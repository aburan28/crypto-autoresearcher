derivation_packet:
  id: DPKT-PA-ECDLP-6ac801-v2-to-v3
  for_amendment: PA-ECDLP-6ac801-v2-to-v3
  for_contract: experiments/EXP-ECDLP-6ac801/specification.v3.yaml
  for_experiment: EXP-ECDLP-6ac801
  stage: "A'' (blind re-derivation)"
  authored_by_task: TASK-20260907-058c69
  authored_at: '2026-09-07'
  authored_at_note: >-
    Runtime-supplied calendar date; the authoring role holds no independent
    clock. The commit time is authoritative.

  # =====================================================================
  # READ THIS FIRST. IT IS THE WHOLE OF THE READING RULE.
  # =====================================================================
  the_reading_rule: >-
    UNTIL YOUR OWN SEAL EXISTS, YOU READ EXACTLY THE FOUR FILES LISTED IN
    `readable_files` BELOW AND NOTHING ELSE IN THIS REPOSITORY.

    Not the experiment contract. Not the amendment. Not a handoff, a task
    card, a dispatch queue, a decision record, an evidence record, a goal
    record, a checkpoint, a correction, a review report or a validation
    report. Not any run directory. Not any existing implementation of this or
    a similar measurement. Not any prior file or review plan. Not any commit
    message, and no output of `git log`, `git show`, `git blame` or any other
    command that prints one.

    THIS IS AN ALLOWLIST, NOT A PROHIBITION LIST. The permitted set is
    closed, finite and hashed; "forbidden" is simply its complement. You do
    not have to consult a list of things not to read, and you are not being
    asked to obey a list nobody could finish.

    `git status`, `git add` and `git commit` on YOUR OWN task directory are
    permitted and are how you seal.

  reading_order:
    - MANIFEST.yaml    # this file: the rule, the file list, the seal procedure
    - quantity.md      # the quantity and the parameters
    - deliverables.md  # what to produce, and the joints you own
    - prohibitions.md  # the rule as an operational checklist

  readable_files:
    - path: MANIFEST.yaml
      sha256: null
      sha256_note: >-
        A file cannot contain its own hash. THIS FILE'S hash is recorded
        EXTERNALLY, in the snapshot-commit receipt of the archival task that
        committed this packet (`path_sha256` map), which is where a gate or an
        auditor verifies it. That is the same content-first verification every
        archived artifact in this program gets, and it is why the omission
        here is a fact about self-reference rather than a gap in the packet.
      role: 'the reading rule, the file list, the seal procedure, the leak declaration'
    - path: quantity.md
      sha256: 7040669a86549365d338fb2062a76b7e5e8a7664c8f555835e38e1ed352ffb68
      bytes: 12253
      sha256_recomputed_note: >-
        Recomputed and updated by the orchestrating session (Bash, direct
        sha256sum-equivalent) after TASK-20260907-7cce3e's Defect B fix
        changed this file's bytes (the stale "established"/"independent
        work" a=1/4 characterization was corrected to match
        specification.v3.yaml's own cf2_anchor_strength). Prior value
        7bcf4b6...df91 (12217 bytes) is superseded, not silently
        overwritten -- recorded here per DEC-20260907-2c4beb required_fix
        (4). No blind re-derivation has read this packet yet (per the
        gate's own blind_history_ruling), so no sealed reading is
        invalidated by this correction.
      role: >-
        The STATEMENT of the quantity and the parameters, quoted from the
        governing contract's `definitions` and `inputs`: the instrument, the
        DP predicate and its independent key, the walk cap and both places it
        binds, the exact three-class basin partition and its exact accounting
        identity, pool construction, the selection weight and its tie-break
        convention, share_top, cov_static, the margin, the pass-count rule,
        the seed list, the interval estimator, the control arms, and the
        eight-cell W/cap table.
    - path: deliverables.md
      sha256: 68835b2e9a695ecfe00393a83d2f9b98a795b0bd1548d5c9c313639bbe83640a
      bytes: 6035
      role: >-
        What to produce and in what shape: the per-cell and per-(N, a) field
        lists, the ordering requirement, the seven joints the re-deriver owns,
        the required reading attestation, and the seal procedure.
    - path: prohibitions.md
      sha256: 786c35f78a31c3b6462be194fa1abac9cd79291bd78d69423a7794eb8849fcae
      bytes: 5399
      role: >-
        The reading rule as an operational checklist, including the git-history
        prohibitions, the honest disclosure of the standing commit-message
        contamination, the asymmetric consequence of a disclosed slip, and the
        instruction to report an INCOMPLETE PACKET as a defect rather than
        filling the gap.
  readable_files_count: 4
  completeness_claim: >-
    THE LIST ABOVE IS COMPLETE. That is a checkable claim about four files,
    not an unsupportable claim about a repository -- which is exactly why the
    mechanism is an allowlist. If a fifth file is ever needed, the packet is
    amended additively under a new manifest and a new hash, never by a reader
    deciding to open something else.

  # =====================================================================
  # THE LEAK DECLARATION -- THE PROPERTY THAT MAKES THE PACKET USABLE
  # =====================================================================
  no_prior_and_no_result_declaration:
    what_is_declared: >-
      THIS PACKET CONTAINS NO PRIOR AND NO RESULT. Specifically it contains
      no verdict, no expectation, no pass-count, no margin, no margin sign, no
      share, no coverage, no interval endpoint and no crossing bracket at
      a = 1/16, a = 1/8 or a = 3/16, at either scale, from any prior batch or
      any recomputation. It carries no Coordinator prior, no review plan and
      no other agent's judgement.
    what_numbers_it_does_contain_and_why_they_are_admissible: >-
      DEFINITIONS AND PARAMETERS ONLY: N, T, T_sel, r, the a-grid, W, cap,
      dp_threshold, the mixing constants, the 25-seed list, the pass-count
      thresholds, and the bootstrap parameters. A re-deriver cannot compute
      without them and they are derivable from frozen sources anyway. What is
      NOT admissible, and is absent, is any LEVEL OF THE MEASURED QUANTITY.
    the_one_disclosed_inclusion:
      what: >-
        `quantity.md` section 13 states that T_sel = T/2 at a = 1/4, r = 2,
        N = 2^24 records G3-infeasibility at strength `preliminary`, on one
        execution batch, with no independent implementation (evidence record
        EV-ECDLP-60e266), and instructs that the a = 1/4 cell be computed and
        reported FIRST.
      why_it_is_necessary: >-
        a = 1/4 is this batch's KNOWN-FALSE OBJECT and its replication
        control. "Controls before belief" requires the identical measurement
        be run against an object whose answer is known, and a re-deriver not
        told which object that is cannot run the control at all. Removing it
        would buy blindness at the price of the batch's strongest artifact
        detector.
      why_it_is_bounded: >-
        It concerns a = 1/4 ONLY, and it is a CONTROL ANCHOR rather than a
        prior: it says what the instrument must REPRODUCE, not what the open
        cells will do. Nothing is stated at a = 1/16, a = 1/8 or a = 3/16 --
        and a = 1/8 is the decision-changing cell this lineage exists to
        resolve.
    how_to_check_it: >-
      READ THE FOUR FILES END TO END. They are about 24 kB in total. The
      declaration is not offered as an assurance to be trusted: it is offered
      as a claim a gate can verify in minutes, which is the entire reason the
      permitted set was made small.

  # =====================================================================
  # NORMATIVITY
  # =====================================================================
  normativity:
    the_contract_governs_on_definitions: >-
      `quantity.md` quotes the governing contract's `definitions` and `inputs`
      and adds NO definitional content of its own. If this packet and
      experiments/EXP-ECDLP-6ac801/specification.v3.yaml are ever found to
      differ on any definitional point, THE CONTRACT GOVERNS, this packet is
      DEFECTIVE, and the difference is a reportable defect of amendment
      PA-ECDLP-6ac801-v2-to-v3. It is NEVER a licence for the re-deriver to
      choose. (The re-deriver cannot check this, by construction -- it may not
      read the contract. The check is an explicit joint of the contract's
      approval gate.)
    the_packet_governs_on_what_may_be_read: >-
      For the question "may I read this before my seal", this manifest is
      AUTHORITATIVE. Any `blind_from` denylist -- in the contract or in any
      review plan -- is CORROBORATING: it may warn a denylist-only reader and
      may name further paths, but it cannot widen what this manifest permits,
      and nothing load-bearing turns on its contents. Two lists that cannot
      disagree about anything load-bearing cannot drift into a contradiction.
    an_incomplete_packet_is_a_finding: >-
      If a quantity in `deliverables.md` cannot be computed from what
      `quantity.md` provides, STOP AND REPORT IT as a defect of this packet.
      Do not fill the gap by reading outside the allowlist and do not fill it
      by choosing a convention. That failure mode is what this exercise exists
      to detect: the previous re-derivation of this quantity disagreed with
      production because the contract named a formula without stating it, and
      the re-deriver had to make a defensible but arbitrary choice. Reporting
      an incomplete packet is a success.

  # =====================================================================
  # THE SEAL
  # =====================================================================
  seal_procedure:
    when: 'When your computation is complete and BEFORE you open anything outside this packet.'
    steps:
      - 'Write your program and its output to your own task directory (never into this packet, never into any runs/ directory, never into any existing task directory).'
      - 'Compute a sha256 of each file you are sealing.'
      - 'Record those hashes and a UTC timestamp in a seal.json (or equivalent) in the same directory.'
      - 'Commit them.'
      - 'ONLY THEN open anything else.'
    what_a_seal_is: >-
      A hash plus a timestamp committed BEFORE the first read outside this
      packet. The seal is what makes the reading independent. A reading sealed
      after looking is a reading, not a blind reading, and must be reported as
      such.
    reading_attestation_required: >-
      Your deliverable must include the COMPLETE LIST OF FILES YOU READ BEFORE
      SEALING. If that list is exactly these four files, say so.
    immutability: >-
      Your artifact is NEW and lives at its own new task directory. It may not
      edit, append to or replace any prior sealed artifact, anything under
      experiments/EXP-ECDLP-6ac801/runs/, or anything under
      coordination/experiments/EXP-ECDLP-6ac801/batches/BATCH-3c7493/.

  consequence_of_a_slip:
    stated_in_advance_so_it_holds_no_surprise: true
    asymmetric_and_deliberately_so: >-
      If you read something outside this packet before sealing, your reading's
      AGREEMENT with the production reading carries NO independence weight for
      this batch. Its DISAGREEMENT retains FULL weight, because a disagreement
      reached despite having seen the other answer is stronger evidence, not
      weaker.
    so: >-
      DISCLOSING costs you only the weaker half of your own result.
      CONCEALING costs the batch its only independence claim, and is the kind
      of thing a later audit finds. There is no version of this in which
      concealing is the better move.

  who_may_not_perform_this_task: >-
    The re-deriver must be in a session that authored NEITHER the contract,
    NOR amendment PA-ECDLP-6ac801-v2-to-v3, NOR this packet. Authorship of the
    packet is disqualifying for obeying it: the author knows what was
    deliberately left out, which is precisely the knowledge the seal exists to
    exclude.

  why_this_packet_exists: >-
    An independent approval gate found that the previous attempt at this
    re-derivation was run under a DENYLIST discipline that had already failed
    three ways: the list could not be shown complete and the gate found two
    leak paths its author had missed; two lists for the same re-derivation had
    silently diverged, so the re-deriver had two answers to one question; and
    resolving the divergence required a convention recorded in a decision
    record the re-deriver was not permitted to read. A BLIND DISCIPLINE A
    FRESH RE-DERIVER CANNOT OBEY FROM THE TEXT IT IS GIVEN IS NOT A BLIND
    DISCIPLINE. This packet is the repair: the discipline is stated in the only
    text the re-deriver reads, and its completeness is a property of four
    files.
