experiment:
  id: EXP-ECDLP-6ac801
  id_allocation_provenance: >-
    Pre-minted and confirmed-free by the orchestrating session, named
    explicitly in this design's own task instruction (this authoring role
    has no shell/Bash tool and could not itself run `python3
    tools/allocate_id.py --check experiment EXP-ECDLP-6ac801`). Glob/Grep
    confirm no file exists yet at experiments/EXP-ECDLP-6ac801/ and the id
    is unused elsewhere under ledger/ or experiments/. The orchestrating
    session must run the `--check` invocation before this record is treated
    as durable, per the program's standing content-first verification
    discipline.
  hypothesis_id: H-ECDLP-37dc01
  question_id: RQ-ECDLP-78dbc5
  goal_id: null
  goal_id_note: >-
    Mirrors experiments/EXP-ECDLP-612fb1/specification.v2.yaml's own
    goal_id: null; RQ-ECDLP-78dbc5 and H-ECDLP-37dc01 are themselves
    unbound to a GOAL record (see H-ECDLP-37dc01.yaml goal_id_note). Not
    changed by this design.
  derived_from_decision: DEC-20260906-bcc097
  derived_from_decision_note: >-
    This is a STANDALONE, NEW experiment (version 1), not a versioned
    protocol_amendment of EXP-ECDLP-612fb1 -- per DEC-20260906-bcc097's own
    RANK 1 instruction ("must be designed as its own hypothesis-relevant
    experiment, not folded silently into a footnote"). It continues
    H-ECDLP-37dc01 and reuses EXP-ECDLP-612fb1 v2's instrument, definitions
    and G3 rule VERBATIM where cited below, to avoid a second, possibly
    divergent implementation of the same definitional walk -- but it is its
    own frozen contract with its own success/falsification criteria, scoped
    narrowly to the single open question named in DEC-20260906-bcc097's
    RANK 1 and EV-ECDLP-f6b3f5's unresolved_confounds.
  derived_from_idea: null
  version: 1
  status: approved
  approved_by: coordinator
  frozen: true
  execution_authorized: true
  approval_note: >-
    Approved as frozen per the user's recorded "Approve as frozen
    (Recommended)" answer on 2026-09-07 (AskUserQuestion), authored by
    TASK-20260907-7204ee. Only these four gate fields (status, approved_by,
    frozen, execution_authorized) plus this additive note were changed by
    that task; every other byte of this contract is exactly as designed.
  designed_by: coordinator
  designed_at: '2026-09-07'
  designed_at_note: >-
    This role holds no clock; the date is the runtime-supplied calendar
    date, per the same disclosure every prior record in this lane carries.

  title: >-
    THE STAGE-0 T/2 DISCREPANCY, RE-CHECKED AT SCALE AND BLIND: does the
    ORIGINAL clause (C1) claim -- a re-selected table with T_sel = T/2
    reaching the static full-T table's steady-state ceiling -- become
    G3-feasible at a SMALLER a than H-ECDLP-37dc01's stated test_boundary
    (a in {1/4, 1/2}) names, specifically a in {1/16, 1/8}, and where does
    the crossing between a = 1/8 and a = 3/16 fall, when re-measured at
    N = 2^24 exact basins (one scale up from the v2 Stage 0 a-scan's
    N = 2^20) under a FROZEN, mandatory blind re-derivation rather than a
    second read of the same executor table that produced the discrepancy?

  context: >-
    DEC-20260906-bcc097 closed BATCH-f3a30a's v2 execution of
    EXP-ECDLP-612fb1 (`support`, re-scoped effect clause at T_sel in
    {0.65T, 0.75T}, NOT clause (C1)). While composing that decision, the
    Coordinator found that the executor's own committed Stage 0 a-scan data
    (experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v2-analysis-001/ci_tables.json,
    stage0_ascan block), read DIRECTLY against the frozen v2 contract's own
    G3 rule (g3_gate_procedure: >= 4 of 5 seeds with exact top-T_sel share
    >= STATIC(T) exact coverage), shows T_sel = T/2 IS G3-feasible at
    a = 1/16 (5/5 seeds) and a = 1/8 (4/5 seeds), r = 2, N = 2^20 -- directly
    contradicting execution_report.yaml's own stated Stage 0 conclusion
    ("no smaller a ... where T_sel = T/2 would be feasible"). The
    orchestrating session independently re-derived this from each a-scan
    seed's own raw-result.json by a SECOND, DIFFERENT computation path
    (exact top_share['T/2'] vs static_by_r['2'] arithmetic, not the
    rho_ORACLE table used in the first reading) and confirmed the identical
    pass/fail pattern with matching margins (see EV-ECDLP-f6b3f5.yaml
    `observations.stage0_ascan_reanalysis` and
    `unresolved_confounds` for the full numbers). This discrepancy has NOT
    gone through this program's formal independent review process -- no
    blind rederivation, no proves-too-much control, no mutual blindness --
    it is a post-hoc read of already-committed data by two people using two
    methods, not a designed experiment. DEC-20260906-bcc097's RANK 1
    next_action names this "cheap, potentially high-value, must not be
    dropped" and specifies exactly what this contract implements: re-run at
    N = 2^24 with exact basins, locate the true crossing point between
    a = 1/8 and a = 3/16, and require independent blind re-derivation
    mirroring TASK-20260906-bc1cfc's J2 method (seal a from-scratch
    computation before opening any of the producer's own code or data)
    rather than a second read of the same executor table.

  hypothesis_test_boundary_note: >-
    H-ECDLP-37dc01's own `statement` and `test_boundary.parameters` scope
    `a` to {1/4, 1/2} ONLY. Testing at a in {1/16, 1/8, 3/16} is THEREFORE
    OUTSIDE that stated boundary. This is handled explicitly, not silently
    smuggled in: H-ECDLP-37dc01.yaml has been additively amended
    (`test_boundary.boundary_amendments`, a new appended entry dated
    2026-09-07, plus one appended `assumptions` bullet and one appended
    `status_history` entry recording this design action at unchanged
    status `analyzed`) to disclose that this wider `a` range is now being
    tested. The hypothesis's frozen `statement`, `predictions`, and
    `falsification_conditions` fields are UNTOUCHED and remain
    byte-identical; only the boundary disclosure and the audit trail are
    additive. Nothing about this widening is itself a claim; it documents
    scope only, and any evidentiary weight is owed to this contract's own
    success/falsification criteria below, reviewed exactly as every other
    claim-relevant result in this program is.

  objective: >-
    At N = 2^24 exact basins, r = 2, T_sel = T/2 exactly (the ORIGINAL
    clause (C1) claim, NOT the v2 grid's {0.65T, 0.75T}): for each a in
    {1/16, 1/8, 3/16, 1/4}, compute the exact top-T_sel basin share and
    STATIC(T)_{r=2} exact coverage per seed, and apply the v2 contract's own
    G3 rule (>= 4 of 5 seeds with exact top-T_sel share >= STATIC(T) exact
    coverage) to determine, at each a, whether T_sel = T/2 is G3-feasible --
    with a REQUIRED, FROZEN, mandatory blind re-derivation of this exact
    comparison performed by a designated independent reviewer BEFORE that
    reviewer opens this experiment's own run outputs or the original Stage 0
    a-scan data, exactly mirroring TASK-20260906-bc1cfc's J2 method. This is
    a narrow, cheap, exact-basin-only measurement (no re-selected LOWER
    bracket online arm is run; the ceiling-feasibility comparison alone is
    the quantity under test, mirroring v1/v2's own "Stage 0" which likewise
    ran zero re-selected arms). a = 1/4 is included as a REPLICATION CONTROL
    against EV-ECDLP-60e266's already-established result (G3 FAIL 10/10 at
    a = 1/4, T_sel = T/2), not as a novel test point: if this control does
    not reproduce that FAIL, the instrument itself, not the hypothesis, is
    in question at every other cell of this batch.

  definitions: # reused VERBATIM from experiments/EXP-ECDLP-612fb1/specification.v2.yaml
                # (`definitions`, `inputs.g3_gate_procedure`) to avoid a second,
                # possibly divergent implementation of the same definitional walk.
                # Copied inline here so this contract is self-contained.
    N: "order of the group (or size of the set for the generic instrument); fixed at 2^24 = 16777216 for this contract (one scale up from the v2 Stage 0 a-scan's N = 2^20)"
    T: "nominal table size N^{1/3} rounded = 256 at N = 2^24"
    T_sel: "number of entries STORED (the advice); FIXED at T/2 = 128 for this contract (the ORIGINAL clause (C1) value, not the v2 grid's 0.65T/0.75T)"
    W: "expected walk length between DPs, W = sqrt(a N / T); theta = 1/W"
    a: "T W^2 / N; a_grid = {1/16, 1/8, 3/16, 1/4} for this contract (see `hypothesis_test_boundary_note`)"
    r: "precomputation pool ratio; FIXED at r = 2 for this contract (the value at which the original discrepancy was found; matches the operating point found feasible)"
    exact top-T_sel basin share: >-
      the exact fraction of the N points whose walk terminates, under the
      exact (non-sampled) basin partition of the DP-truncated functional
      graph, in one of the T_sel largest basins by size -- computed by full
      enumeration, not walked online, exactly as v1/v2's `exact_basins`
      procedure and Stage 0's own a-scan compute it.
    STATIC(T)_r exact coverage: >-
      the exact fraction of the N points covered by the T basins selected
      by the published Bernstein-Lange weight from an r T-distinct-DP
      precomputation pool at ratio r, read exactly (not sampled) from the
      same basin partition -- v1/v2's own STATIC(T) arm's exact-coverage
      reading.
    "G3-style feasibility criterion (this contract's operative rule, IDENTICAL IN FORM to experiments/EXP-ECDLP-612fb1/specification.v2.yaml `inputs.g3_gate_procedure`, reused verbatim to prevent the exact definitional/units mismatch that is this contract's own outcome (b))": >-
      at a given a, T_sel = T/2 is G3-FEASIBLE iff exact top-T_sel basin
      share >= STATIC(T)_r exact coverage in >= 4 of the 5 seeds; otherwise
      G3-INFEASIBLE (equivalently, per-seed rho_ORACLE = the smallest
      T_sel/T at which the exact share equals STATIC(T)'s coverage; T/2 is
      feasible at a seed iff rho_ORACLE < 0.5 at that seed -- the SAME
      arithmetic the orchestrating session's second, independent
      confirmation used on EV-ECDLP-f6b3f5).
    crossing point: >-
      the (open) interval between the largest a at which T_sel = T/2 is
      G3-feasible and the smallest a at which it is not, as bracketed by
      this contract's own a_grid; this contract locates the crossing to
      within the grid's own resolution (between 1/8 and 3/16, per the
      Stage 0 N = 2^20 reading) and does NOT interpolate a point estimate
      beyond that bracket (a finer grid is out of scope; see `out_of_scope`).
    seed: "walk-key seed for the generic instrument; 5 seeds per a, matching Stage 0's and v2's own seed count."

  instrument: >-
    IDENTICAL to experiments/EXP-ECDLP-612fb1/specification.v2.yaml
    `instrument.generic_walk` and `inputs.exact_basins`, reused verbatim
    (f(x) = mix64(x XOR K) mod N, DP predicate hash64(x) < floor(2^64 / W)
    with an independent key; exact-basin enumeration procedure unchanged
    from v1). No curve arm (generic instrument only; certificate kind:
    none). The PRODUCTION computation (Stage B below) may reuse
    experiments/EXP-ECDLP-612fb1/source_v2/'s exact-basin code by explicit
    citation in its manifest (commit-pinned); the REQUIRED blind
    re-derivation (Stage A) may NOT (see `blind_rederivation.blind_from`).

  inputs:
    stage_plan: >-
      STAGE A (BLIND RE-DERIVATION, REQUIRED, FROZEN, NON-NEGOTIABLE -- see
      `blind_rederivation` below for the full frozen procedure). Must be
      SEALED before Stage B's own output is opened by the same reviewer, and
      before either is compared against the original EXP-ECDLP-612fb1 v2
      Stage 0 a-scan data. This is a contract-level requirement, not an
      afterthought of the executor handoff: no cell's G3-style verdict from
      this experiment may be treated as evidence before the seal exists and
      the comparison is recorded (see `invalidation_rules`).
      STAGE B (EXECUTION, exact-basin generation): generic instrument,
      N = 2^24 only, exact basins; a_grid = {1/16, 1/8, 3/16, 1/4}, r = 2,
      T_sel = T/2 = 128, 5 seeds. For every (a, seed) cell: exact top-T_sel
      basin share and STATIC(T)_{r=2} exact coverage. Zero re-selected
      (RESEL-L) arms are run -- this is a closed-form-from-exact-basins
      measurement only, mirroring v1/v2's own Stage 0 (seconds-to-minutes
      per cell at N = 2^20; this contract's N = 2^24 is one scale up but
      still exact-basin-only, not a full online-walk re-selection batch).
      STAGE C (ANALYSIS): apply the G3-style feasibility criterion at each
      a; report the per-seed margins (share minus coverage) and the
      pass-count out of 5; state the crossing bracket per `definitions`;
      compare against Stage A's sealed blind result and report agreement or
      disagreement explicitly, cell by cell; confirm the a = 1/4 replication
      control reproduces EV-ECDLP-60e266's FAIL.
    arms: >-
      Two exact-coverage readings only per (a, seed): STATIC(T)_{r=2} exact
      coverage, and the exact top-T_sel (= T/2) basin share. No ORACLE,
      RESEL-L, NULL-A, CAP, RHO, or STATIC2T arm is run; those test the
      re-selection MECHANISM (already the subject of EXP-ECDLP-612fb1) and
      are explicitly out of scope for this narrow ceiling-feasibility check
      (see `out_of_scope`).
    exact_basins: "unchanged from v1/v2, verbatim, restricted to N = 2^24 and the a_grid above."

  blind_rederivation:
    required: true
    frozen: true
    quantity: >-
      exact top-T_sel (= T/2) basin share and STATIC(T)_{r=2} exact coverage
      at each a in {1/16, 1/8, 3/16, 1/4}, N = 2^24, from the exact
      basin-partition definition alone (a uniformly random function on N
      points truncated at an independent Bernoulli(1/W) marking, per
      HEUR-BLT-1) -- NOT a re-read of any run's own analysis output and NOT
      an inspection of experiments/EXP-ECDLP-612fb1/source_v2/'s
      implementation before the seal.
    parameters: "N = 2^24; a_grid = {1/16, 1/8, 3/16, 1/4}; r = 2; T_sel = T/2 = 128; 5 seeds"
    procedure: >-
      A designated independent reviewer (validator or, if none is assigned,
      the executor acting under a strict pre-registration discipline)
      writes their own from-scratch computation of the quantity above, SEALS
      it (commits it to their own task directory with a hash and timestamp,
      exactly as TASK-20260906-bc1cfc's J2 sealed its result before opening
      any run artifact), and ONLY THEN opens: (i) this experiment's own
      Stage B/C run output, (ii) the original EXP-ECDLP-612fb1 v2 Stage 0
      a-scan data that produced the discrepancy. The sealed file and its
      hash/timestamp are a REQUIRED artifact (see `required_artifacts`).
    blind_from:
      - experiments/EXP-ECDLP-612fb1/source_v2/
      - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v2-ascan-*/
      - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v2-analysis-001/
      - experiments/EXP-ECDLP-6ac801/runs/ (this experiment's own outputs, once they exist)
    comparison_rule: >-
      The blind result and Stage B/C's production result are compared cell
      by cell (per a). Agreement (same PASS/FAIL pattern, margins within
      seed-to-seed noise) is required before ANY cell's G3-style verdict is
      reported as more than a single, unreviewed reading; disagreement is
      itself the headline result of this batch (see `distinguishable_outcomes`
      (b)) and is never resolved by picking one side without a stated,
      checkable reason (e.g. a demonstrated units/definition mismatch).
    non_negotiable_note: >-
      This step exists BECAUSE the discrepancy this contract investigates
      was itself found by re-reading the same executor table twice by two
      different arithmetic routes, not by an independent from-scratch
      computation -- DEC-20260906-bcc097's RANK 1 explicitly requires the
      latter. A run set completed without a sealed blind re-derivation is
      NOT evidence under this contract (see `invalidation_rules`).

  controls:
    - >-
      (a) BLIND RE-DERIVATION CONTROL (REQUIRED, frozen): see
      `blind_rederivation`. No cell is evidence before the seal exists.
    - >-
      (b) a = 1/4 REPLICATION CONTROL: T_sel = T/2 at a = 1/4, r = 2,
      N = 2^24 is ALREADY established as G3-INFEASIBLE (G3 FAIL 10/10 seeds,
      EV-ECDLP-60e266). This contract's own fresh 5 seeds at a = 1/4 must
      reproduce that FAIL. A PASS here at a = 1/4 invalidates this batch's
      instrument (see `invalidation_rules`), independent of any other cell's
      result.
    - >-
      (c) EXACT-COVERAGE NON-EXCEEDANCE: no exact top-T_sel share may exceed
      1.0 or the exact top-T share (T > T_sel); an exceedance is an
      implementation error, not a result (mirrors v1/v2's own structural
      tell).
    - >-
      (d) DEFINITIONAL IDENTITY WITH THE v2 G3 RULE: the feasibility
      criterion applied here is REUSED VERBATIM from
      experiments/EXP-ECDLP-612fb1/specification.v2.yaml
      `inputs.g3_gate_procedure`, not re-derived or re-worded, specifically
      to rule out a units/definition mismatch as the source of any
      confirmed discrepancy (this contract's own outcome (b) names that
      possibility explicitly and this control is what would surface it).
    - >-
      (e) SEED-COUNT PARITY: 5 seeds per a, matching Stage 0's and v2's own
      seed count, so this batch's statistical power is comparable, not
      thinner, than the batch that produced the original discrepancy.

  independent_variables:
    - "N: fixed, 2^24"
    - "a: {1/16, 1/8, 3/16, 1/4}"
    - "r: fixed, 2"
    - "T_sel: fixed, T/2 = 128"
    - "seed: {1, 2, 3, 4, 5}"
    - "reading: {blind (Stage A), production (Stage B/C)}"

  metrics:
    primary:
      - "per (a, seed): exact top-T_sel basin share minus STATIC(T)_{r=2} exact coverage (the G3-style margin); sign and magnitude"
      - "per a: pass-count out of 5 seeds (margin >= 0); G3-style feasibility verdict (>= 4/5 -> FEASIBLE, else INFEASIBLE)"
      - "crossing bracket: the pair of adjacent a-grid values straddling the FEASIBLE/INFEASIBLE boundary, per `definitions.crossing point`"
      - "blind-vs-production agreement per (a, seed): same sign, margins within the two readings' own seed-to-seed noise; and per-a agreement on the pass-count/verdict"
      - "a = 1/4 replication control: pass-count out of 5 seeds, compared against EV-ECDLP-60e266's 5/5 FAIL at 2^24"
    secondary:
      - "exact top-T_sel share and STATIC(T)_{r=2} exact coverage individually, per (a, seed), for auditability"
      - "wall clock and peak RSS per run, for budget accounting only"

  heuristic_under_test: null
  heuristic_note: >-
    This contract does not validate or re-validate HEUR-BLT-1/2/7; it is a
    direct exact-enumeration measurement. HEUR-BLT-1 (the random-function
    basin law) is the same standing assumption EXP-ECDLP-869870 and
    EXP-ECDLP-612fb1 already carry; nothing here adds to or subtracts from
    its own validation status.

  preregistered_prediction:
    quantity: "G3-style feasibility verdict (per `definitions`) at each a in {1/16, 1/8, 3/16, 1/4}, N = 2^24, r = 2, T_sel = T/2"
    formula: >-
      INFORMED EXTRAPOLATION FROM THE N = 2^20 STAGE 0 READING, EXPLICITLY
      FLAGGED UNVERIFIED (not a re-derivation from a closed form; the
      closed-form C_max(a) model of IDEA-20260906-aed829 is itself
      unverified by any validator per H-ECDLP-37dc01's own assumptions
      block): (i) a = 1/16 predicted FEASIBLE (5/5), extrapolating the
      Stage 0 margins (+0.0196, +0.0122, +0.0240, +0.0163, +0.0092 at
      N = 2^20), which are comfortably clear of the pass/fail boundary;
      (ii) a = 1/8 predicted FEASIBLE but BORDERLINE (around 4/5, possibly
      3/5 or 5/5), since Stage 0's own margins there straddle zero (+0.0032,
      -0.0020, +0.0103, +0.0050, +0.0071) and N-dependence of this margin is
      genuinely untested -- this cell is the one this contract is least
      confident in and most likely to move; (iii) a = 3/16 predicted
      INFEASIBLE (around 1/5 or fewer), extrapolating Stage 0's clear
      failure there (only 1 of 5 seeds below the boundary, margins mostly
      well above zero); (iv) a = 1/4 (replication control) predicted
      INFEASIBLE 5/5, reproducing EV-ECDLP-60e266's already-established
      10/10 FAIL exactly (this is a control, not a novel prediction). The
      crossing bracket is predicted to remain between a = 1/8 and a = 3/16,
      unchanged from the N = 2^20 reading, but this prediction is explicitly
      the thing being tested: N-independence of the crossing point has NOT
      been established for this specific quantity (only for the unrelated
      rho_ORACLE(a=1/4) vs rho_ORACLE(a=1/2) ordering, per v2's item h). A
      result outside this predicted pattern is not a contract failure; it is
      the kind of finding this experiment exists to surface, reported
      exactly as measured.
    source: >-
      EV-ECDLP-f6b3f5.yaml `observations.stage0_ascan_reanalysis` (the
      confirmed N = 2^20 margins) and EV-ECDLP-60e266 (the a = 1/4
      replication-control anchor); this contract's own extrapolation to
      N = 2^24 is UNVERIFIED and is exactly what Stage B/C tests.

  scale_relevance:
    tier: toy
    justification: >-
      Generic keyed-random-function instrument at N = 2^24; no field, no
      curve, no cryptographic size. Constant-factor, exact-enumeration
      statement under the same KN-LIT-013 ceiling H-ECDLP-37dc01 and
      EXP-ECDLP-612fb1 are scoped to; no exponent is claimed or approached.
      Transfer beyond N = 2^24 and beyond this exact a-grid is an
      assumption, never a result, and must be stated per evidence record.
    correspondence: null

  tail_checks:
    - "The single a-grid cell with the smallest pass-count margin (closest to the 4/5 boundary), reported individually with its per-seed values."
    - "The a = 1/4 control's individual seed margins, compared side by side against EV-ECDLP-60e266's own 2^24 seed margins for consistency (not required to match seed-for-seed, since these are fresh seeds; sign and rough magnitude are the check)."

  replication:
    seeds: [1, 2, 3, 4, 5]
    independent_instances: 5

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1
    maximum_memory_gb: 8
    maximum_runs: 8
    maximum_workers: 1
  budget_note: >-
    Advisory per docs/research-budget-policy.md; research spending is not
    rationed by default (CLAUDE.md "Research budgets: progress first").
    Deliberately CHEAP and NARROW, per DEC-20260906-bcc097's own
    characterisation ("cheap ... Stage 0 itself ran in seconds per cell")
    and the task's explicit instruction not to scope-creep this into a full
    re-run: this is exact-basin enumeration only (no online re-selection
    batch), at one N, one r, one T_sel, a 4-point a-grid. Estimated
    shape: up to 5 execution runs (one per seed, sweeping all 4 a-values
    internally per seed, mirroring how Stage 0 itself batched one run per
    seed across its whole a x r grid) + 1 analysis run (Stage C) + the
    blind re-derivation (Stage A, a reviewer task, not counted against
    maximum_runs since it produces no run manifest under this experiment's
    own runs/ directory) + 2 spare for recorded infrastructure re-runs =
    maximum_runs 8. total_cpu_hours 1 is generously above the expected
    actual usage: v1/v2's own N = 2^24 exact-basin work ran in well under
    a minute per seed-cell at a comparable T. This is far below
    EXP-ECDLP-612fb1 v2's own 20-run ceiling, matching the task's
    instruction that this "should be CHEAP." These are advisory estimates
    only and require no repeated approval to revise upward if the actual
    run needs more (CLAUDE.md).

  stopping_rules:
    - "Stage A (blind re-derivation) must be sealed before Stage B/C's own output is opened by the same reviewer, and before either is compared against the original v2 Stage 0 data; a violation voids the blindness of that reviewer's reading for this batch (report the violation plainly; do not silently discard it)."
    - "The a = 1/4 replication control is evaluated FIRST among the four a-values, before the novel cells (1/16, 1/8, 3/16) are interpreted; a control FAIL-to-reproduce stops interpretation of the other three cells until the instrument mismatch is understood (see `invalidation_rules`)."
    - "Stop at maximum_runs or total_cpu_hours, whichever binds first; a cell not reached is reported as not run, never as a negative."
    - "Wall clock per run at 3600 s; a run that exceeds it is failed_infrastructure and is re-planned with a smaller shard, never interpreted (AGENTS.md rule 5)."
    - "Any exact-coverage exceedance (control (c)) stops the run as completed_invalid (implementation error), reported immediately, not folded into the a-value's pass-count."

  invalidation_rules:
    - "Execution while status is not approved or execution_authorized is false: no run under this contract is evidence."
    - "A timeout, crash, memory exhaustion or dependency failure is failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md rule 5)."
    - "Any exact top-T_sel share exceeding 1.0 or the exact top-T share: invalid (impossible by construction)."
    - "A run set completed WITHOUT a sealed blind re-derivation artifact (hash + timestamp, predating the reviewer's own opening of Stage B/C output and of the original v2 Stage 0 data): the production reading alone is NOT evidence under this contract -- report it as an unreviewed measurement only, exactly the status quo this contract exists to move past, and re-open Stage A before any conclusion is drawn."
    - "The a = 1/4 replication control failing to reproduce EV-ECDLP-60e266's G3 FAIL (i.e. scoring >= 4/5 PASS at a = 1/4): invalidates this batch's instrument for every cell; report as an instrument mismatch requiring investigation (a changed definition, a changed seed policy, or an implementation defect), never as a result that clause (C1) now holds at a = 1/4 too."
    - "Duplicated or missing seeds, a manifest missing command, commit, dirty-tree state, environment, requested policy or resolved model, or raw/summary disagreement: invalid."
    - "Any post-hoc change to the a-grid, N, r, T_sel, or the G3-style feasibility criterion beyond what THIS versioned contract states: requires a further versioned protocol_amendment; runs already executed are never re-scored."
    - "Reading H-ECDLP-37dc01's or EXP-ECDLP-612fb1's own frozen text as if it already licensed a conclusion about a in {1/16, 1/8, 3/16} before this contract's own criterion resolves: not permitted; the boundary widening on H-ECDLP-37dc01 is a disclosure of scope, not a result."

  success_criterion: >-
    FIRST, Stage A's blind re-derivation must be sealed (see
    `blind_rederivation`); absent that seal, nothing below is evaluated as
    evidence (see `invalidation_rules`). SECOND, the a = 1/4 replication
    control must reproduce G3-INFEASIBLE (>= 4/5 seeds with exact top-T_sel
    share BELOW STATIC(T) exact coverage); absent that, the batch is an
    instrument mismatch, not a result (see `invalidation_rules`). GIVEN
    both hold: at EACH a in {1/16, 1/8, 3/16}, apply the G3-style
    feasibility criterion (>= 4 of 5 seeds with exact top-T_sel share >=
    STATIC(T)_{r=2} exact coverage) to BOTH Stage A's sealed blind result
    and Stage B/C's production result independently, then compare. S1
    (CONFIRMED FEASIBLE): the blind and production readings AGREE that a
    given a is G3-FEASIBLE. S2 (CONFIRMED INFEASIBLE): the blind and
    production readings AGREE that a given a is G3-INFEASIBLE. S3
    (DISAGREEMENT): the blind and production readings DISAGREE on a given
    a's feasibility verdict, or agree on the verdict but disagree on the
    per-seed sign pattern beyond noise -- this is reported as its own
    outcome (see `distinguishable_outcomes` (b)), never resolved by
    preferring one reading without a stated, checkable reason. OVERALL: the
    crossing bracket is reported as the pair of adjacent a-grid values where
    the CONFIRMED (blind-and-production-agreeing) verdict changes from
    FEASIBLE to INFEASIBLE; if no clean crossing is confirmed (e.g.
    disagreement occurs inside the bracket), that is reported plainly as
    "crossing not confirmed at this N," not papered over with the N = 2^20
    reading.

  falsification_criterion: >-
    F1: the a = 1/4 replication control fails to reproduce
    G3-INFEASIBLE -- see `invalidation_rules` (instrument mismatch, not a
    result about clause (C1)). F2: at a = 1/16 or a = 1/8, the CONFIRMED
    (blind-and-production-agreeing) verdict is G3-INFEASIBLE, reversing the
    N = 2^20 Stage 0 reading -- this falsifies the N-independence of the
    Stage 0 discrepancy specifically at N = 2^24 (reported as a genuine,
    scale-dependent finding, not an error) and is exactly outcome (b)'s
    "NOT confirmed" branch if it stems from a real N-dependence rather than
    a units/definition artifact. F3: Stage A's blind result and Stage B/C's
    production result disagree beyond seed-to-seed noise at any a without a
    demonstrable units/definition explanation -- this is a MEASUREMENT
    ARTIFACT finding about the ORIGINAL Stage 0 discrepancy's own validity,
    reported as a correction to EV-ECDLP-f6b3f5's `unresolved_confounds`
    (a new evidence record superseding, never editing, that entry), not
    treated as resolving feasibility either way at N = 2^24.

  required_artifacts:
    - "experiments/EXP-ECDLP-6ac801/runs/RUN-*/manifest.yaml with exact command, git commit and dirty-tree state, environment, requested policy, resolved model identifier and fallback flag, seeds, wall clock, peak_rss_bytes"
    - "experiments/EXP-ECDLP-6ac801/runs/RUN-*/raw-result.json with exact basin-size data sufficient to recompute the top-T_sel share and STATIC(T) coverage independently, per (a, seed)"
    - "experiments/EXP-ECDLP-6ac801/runs/RUN-*/summary.json with the per-(a, seed) exact top-T_sel share, STATIC(T)_{r=2} exact coverage, margin, and per-a pass-count"
    - "the SEALED blind re-derivation artifact (Stage A): the reviewer's own from-scratch computation, its hash and timestamp, predating (by that timestamp) any read of Stage B/C's own output or of the original v2 Stage 0 data, per `blind_rederivation.procedure`"
    - "the Stage C analysis output: the crossing-bracket determination, the blind-vs-production agreement table cell by cell, and the a = 1/4 control's comparison against EV-ECDLP-60e266"

  cost_model:
    measured_vs_modeled: >-
      Everything in this contract is MEASURED (exact basin enumeration,
      exact coverage, exact top-T_sel share); nothing is modeled or
      extrapolated from a closed form within Stage B/C itself. The
      `preregistered_prediction` above is explicitly labeled an UNVERIFIED
      extrapolation from a different N, never presented as a measured or
      modeled quantity of this contract.
    optimistic_assumptions: >-
      None beyond the standing generic-instrument assumption (HEUR-BLT-1,
      inherited, not re-tested here) that the DP-truncated functional graph
      of the walk behaves as a uniformly random function's basin partition.
    memory_accounting: "exact basin enumeration at N = 2^24 requires O(N) working memory for the walk graph; charged against maximum_memory_gb."
    hidden_overhead: "none beyond the enumeration cost itself; no online walks, no re-selection, no restart scalar multiplications this contract."
    standardized_parameter_sets: "N = 2^24 only; not a costed-algorithm table (this is a feasibility measurement, not a COST-* record)."

  interpretation:
    - >-
      Every conclusion this contract can license is claim_tier toy,
      constant-factor, under the KN-LIT-013 ceiling, and scoped EXACTLY to
      N = 2^24, r = 2, T_sel = T/2, a in {1/16, 1/8, 3/16, 1/4}. It says
      nothing about r in {4, 8}, about T_sel other than T/2, about the
      curve arm, or about any N other than 2^24; transfer to any of those
      is an assumption to be stated in the evidence record, never a result.
    - >-
      A CONFIRMED-FEASIBLE result at a in {1/16, 1/8} does NOT by itself
      re-open clause (C1) as a supported claim: G3-feasibility is a CEILING
      test (can a re-selected table exceed static's coverage in principle),
      not a demonstration that the LOWER-bracket online re-selection
      mechanism actually reaches that ceiling at any achievable batch size
      U. That is a SEPARATE, further question requiring its own online
      re-selection batch (a follow-up this contract does not run; see
      `out_of_scope`), exactly as the v2 contract's own G3 gate is a
      precondition for, not a substitute for, S1/F1.
    - >-
      A CONFIRMED-INFEASIBLE result at a in {1/16, 1/8} (reversing the
      N = 2^20 Stage 0 reading) is reported as a genuine N-dependence
      finding, not a retraction of the N = 2^20 numbers themselves (those
      remain confirmed at N = 2^20, per EV-ECDLP-f6b3f5); it would mean the
      ceiling itself is N-sensitive at this a-range in a way this
      hypothesis's model does not currently predict, and is routed to
      review as a model-boundary finding, not adopted unilaterally.
    - >-
      This contract cannot and does not claim any exponent moves; online
      1/3, advice 1/3, precomputation 2/3 in N are untouched by construction
      (no algorithm is run, only an exact enumeration of a fixed generic
      instrument at fixed N).

  out_of_scope: >-
    Any online re-selection (RESEL-L) arm at the new a-values (a further,
    separate experiment if this contract's crossing-point finding warrants
    it); r other than 2; T_sel other than T/2; N other than 2^24; the curve
    arm; a finer a-grid than the four points named (a follow-up may propose
    one if the crossing bracket needs narrowing); any statement about
    exponents; re-litigating the a = 1/4 mechanism-attribution question
    (S2_v2) already carried as an open item on EV-ECDLP-f6b3f5 and
    DEC-20260906-bcc097 RANK 2.

  distinguishable_outcomes:
    - outcome: >-
        (a) CONFIRMED FEASIBLE: Stage A's sealed blind result AND Stage
        B/C's production result AGREE that T_sel = T/2 is G3-FEASIBLE at
        a = 1/16, at a = 1/8, or both, at N = 2^24; the a = 1/4 control
        reproduces INFEASIBLE; the crossing bracket is confirmed between
        the largest feasible a and the smallest infeasible a among
        {1/16, 1/8, 3/16}.
      means: >-
        Clause (C1) of H-ECDLP-37dc01 is REOPENED at the confirmed smaller
        a -- a materially more interesting result than anything scored in
        EV-ECDLP-f6b3f5 or EV-ECDLP-60e266. This is a CEILING-FEASIBILITY
        result only (see `interpretation`): it does NOT by itself support
        or promote the hypothesis's status, and REQUIRES its own follow-up
        (an online RESEL-L re-selection batch at the confirmed a, out of
        this contract's scope) before any hypothesis-status movement. Report
        plainly, cite this contract and its evidence record, and rank the
        follow-up per CLAUDE.md's exponent-targeting/ECC-first bias only if
        it is later shown to bear on such a mechanism (it currently does
        not: this remains a constant-factor toy-scale measurement).
    - outcome: >-
        (b) NOT CONFIRMED: Stage A's sealed blind result and Stage B/C's
        production result DISAGREE on the feasibility verdict at a = 1/16
        or a = 1/8 (or on the sign pattern beyond noise), OR the disagreement
        traces to a demonstrable units/definition mismatch between this
        contract's re-derivation and the original Stage 0 reading.
      means: >-
        The original Stage 0 discrepancy (EV-ECDLP-f6b3f5
        `unresolved_confounds`) is NOT corroborated at N = 2^24 by
        independent means. This is recorded PLAINLY as a CORRECTION to
        EV-ECDLP-f6b3f5's `unresolved_confounds` -- a new evidence record
        citing and superseding that entry's open status, per rule 2
        (records are immutable; corrections supersede, never overwrite) --
        NEVER as a silent retraction. The N = 2^20 numbers themselves stay
        exactly as confirmed in EV-ECDLP-f6b3f5 (this contract does not
        and cannot retroactively change them); what changes is whether they
        generalize to N = 2^24 and whether they survive independent
        re-derivation.
    - outcome: >-
        (c) INFRASTRUCTURE FAILURE: any run ends by timeout, crash, memory
        exhaustion, or dependency failure.
      means: >-
        Infrastructure signal only (AGENTS.md rule 5); NEVER evidence for
        or against feasibility at any a. Re-plan with a smaller shard per
        `stopping_rules`.
    - outcome: >-
        (d) INSTRUMENT MISMATCH: the a = 1/4 replication control does NOT
        reproduce EV-ECDLP-60e266's G3 FAIL (i.e. scores >= 4/5 PASS).
      means: >-
        Per `invalidation_rules`: the entire batch's instrument is in
        question; no conclusion is drawn about a in {1/16, 1/8, 3/16} until
        the mismatch (changed definition, changed seed policy, or an
        implementation defect) is understood and, if needed, repaired under
        a further versioned protocol_amendment.
    - outcome: >-
        (e) A run set is completed WITHOUT Stage A's blind re-derivation
        being sealed before the production output was opened by the same
        reviewer (a stopping-rule violation).
      means: >-
        Per `invalidation_rules`: the production reading is reported ONLY
        as an unreviewed measurement, explicitly not stronger evidence than
        the original, already-flagged Stage 0 discrepancy this contract
        exists to move past; Stage A must be genuinely re-sealed (a fresh
        reviewer, or the same reviewer with the violation disclosed and a
        judgment made about whether blindness was materially compromised)
        before any outcome (a)/(b) verdict is reported.

  assigned_to: executor
  review_required: true
  review_note: >-
    Claim-relevant producer (a positive result here -- outcome (a) -- would
    be the most informative and highest-value possible reading of this
    program's current ECDLP lane, per DEC-20260906-bcc097's own framing).
    On approval the dispatch card must carry review_required: true with AT
    LEAST one independent reviewer task performing Stage A's blind
    re-derivation (this MAY be the same task that reviews the executor's
    Stage B/C output, provided the seal genuinely predates that reviewer's
    own reading of it, per `blind_rederivation.procedure`; it may also be a
    separate designated reviewer if the Coordinator's approval decision so
    specifies). A second reviewer (red team) task is RECOMMENDED but not
    mandatory given this contract's narrow scope, to independently re-check
    (i) the a = 1/4 replication control's comparability to EV-ECDLP-60e266
    and (ii) whether the G3-style criterion was applied identically (control
    (d)) rather than with any drift from the v2 contract's own wording.

  claim_tier: toy
  claim_tier_note: >-
    Generic keyed-random-function instrument at N = 2^24 only; no curve arm,
    no cryptographic size. Constant-factor, exact-enumeration statement
    under the Corrigan-Gibbs-Kogan S T^2 = Omega~(eps N) ceiling
    (KN-LIT-013); no exponent is claimed or approached; online 1/3, advice
    1/3, precomputation 2/3 unchanged (no online algorithm is even run by
    this contract).
