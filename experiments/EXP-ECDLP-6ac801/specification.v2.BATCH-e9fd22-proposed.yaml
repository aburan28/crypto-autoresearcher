  distinguishable_outcomes:
    - outcome: "(a) a = 1/8 RESOLVED, both readings agreeing (S1, S2 or S3 at that cell), with every control passing."
      means: >-
        DEC-20260907-9b1b02's RANK 1 is discharged. The a = 1/8 cell moves from
        S3 DISAGREEMENT to a stated verdict, and the definitional gap is
        confirmed to have been the whole cause. If the verdict is FEASIBLE, the
        confirmed-feasible region of clause (C1)'s ceiling widens from
        {a = 1/16} to {a = 1/16, 1/8} and the crossing bracket is located
        between 1/8 and 3/16 -- a ceiling result only, requiring RANK 2's online
        batch before any hypothesis movement. If UNRESOLVED, the honest reading
