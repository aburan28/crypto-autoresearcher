    - "NEW (item b): editing coordination/experiments/EXP-ECDLP-6ac801/batches/BATCH-3c7493/tasks/TASK-20260907-80e198/sealed_blind_rederivation.json, or any BATCH-3c7493 artifact, in the course of this batch: forbidden outright. The re-seal is a NEW artifact in a NEW task directory."
    - "NEW (item d): NULL-RANDSEL failing its required firing signature at any cell: the whole batch is uninterpretable as a feasibility measurement and is reported as an artifact finding."
    - "NEW (item d): DECAY-A failing -- mbar not decreasing in a, or mbar(1/4) >= 0 -- : no feasibility verdict is reported at any a; this is the canonical artifact tell and it overrides every pass-count in the batch."
    - "NEW (item c): control (f) failing (the seeds 1..5 N = 2^24 production margins not reproducing the committed v1 cells to 1e-9): every novel cell is uninterpretable until the divergence is explained; the committed v1 runs are the reference and are not re-scored."

  success_criterion: >-
    GATES FIRST, in the order of `inputs.control_evaluation_order`. Stage A'
    must be sealed; control (f) must reproduce the committed v1 cells; control
    (g) NULL-RANDSEL must fail G3 with its required signature at every cell;
    control (h) DECAY-A must decay with mbar(1/4) < 0. Absent any of these,
    nothing below is evaluated as evidence.
    GIVEN THE GATES HOLD, at each (N, a) apply the G3-feasibility predicate to
    Stage A''s sealed reading and to Stage B'/C''s production reading
    INDEPENDENTLY, then compare.
    S1 CONFIRMED FEASIBLE: both readings return G3-FEASIBLE.
    S2 CONFIRMED INFEASIBLE: both readings return G3-INFEASIBLE.
    S3 CONFIRMED UNRESOLVED: both readings return G3-UNRESOLVED, i.e. the two
    independent routes agree that 25 seeds do not settle this cell. This is a
    real, informative outcome and is reported as one.
    S4 DISAGREEMENT: the two readings return different verdicts. Reported as its
    own headline outcome, never resolved by preferring one side without a
    stated, checkable reason, and never by a post-hoc diagnostic standing in for
    a seal.
    OVERALL: the crossing bracket is reported at each N as the adjacent a-pair
    where the CONFIRMED verdict changes from FEASIBLE to INFEASIBLE; if an
    UNRESOLVED or DISAGREEMENT cell lies inside it, the bracket is reported as
    not cleanly located at that N.
    THE DECISION-CHANGING CELL IS a = 1/8 AT N = 2^24. Its outcome under S1, S2
    or S3 discharges DEC-20260907-9b1b02's RANK 1; an S4 there means the
    definitional repair was not the whole story and is a more interesting result
    than any of the three.

  falsification_criterion: >-
    F1 (carried): the a = 1/4 anchor fails to reproduce G3-INFEASIBLE --
    instrument mismatch, not a result about clause (C1).
    F2 (carried, re-scoped): at a = 1/16 or a = 1/8 the CONFIRMED verdict is
    G3-INFEASIBLE. At a = 1/16 this would additionally CONTRADICT
    EV-ECDLP-2e9680's committed CONFIRMED FEASIBLE finding at the same N and
    T_sel, which is a contradiction between validated evidence records and
    therefore requires independent review-breakthrough review at max effort per
    AGENTS.md rule 12 before it is recorded as anything.
    F3 (carried): Stage A' and production disagree beyond noise at any cell
    without a demonstrable definitional explanation -- a measurement-artifact
    finding about the corrected definition itself, reported as a new evidence
    record superseding nothing and retracting nothing.
    F4 (NEW): any control in `inputs.control_evaluation_order` fires the wrong
    way. This falsifies the MEASUREMENT, not the hypothesis, and is reported as
    an artifact finding with the control's own numbers; it is never reported as
    evidence for or against feasibility at any a.

