    - "CARRIED FROM v1: the a = 1/4 anchor is evaluated before the novel cells are interpreted; a failure to reproduce INFEASIBLE stops interpretation until the mismatch is understood."
    - "CARRIED FROM v1: stop at maximum_runs or total_cpu_hours, whichever binds first; a cell not reached is reported as not run, never as a negative."
    - "CARRIED FROM v1: wall clock per run at 3600 s; an exceedance is failed_infrastructure, re-planned with a smaller shard, never interpreted (AGENTS.md rule 5)."
    - "CARRIED FROM v1: any exact-coverage exceedance (control (c)) stops the run as completed_invalid, reported immediately, never folded into a pass-count."
    - "NEW: N = 2^20 is run and reported before N = 2^24; a control failure at N = 2^20 stops the N = 2^24 execution until it is understood, so the expensive scale is not spent on a broken pipeline."
