  title: >-
    THE a = 1/8 DISAGREEMENT, RE-SEALED UNDER A STATED DEFINITION: with the
    STATIC(T)_r pool-selection weight written into the contract as an explicit
    formula rather than named, does a freshly sealed independent blind
    re-derivation now AGREE with production on whether T_sel = T/2 is
    G3-feasible at a = 1/8 -- and does the feasibility signal at a in
    {1/16, 1/8} survive a null object of the same shape and decay in both of
    the two declared decay parameters?

  context: >-
    BATCH-3c7493 executed v1 of this contract. One cell remains genuinely
    open because v1's `definitions.STATIC(T)_r exact coverage` names "the
    published Bernstein-Lange weight" but never states the formula, so an
    independent from-scratch re-deriver working from the contract and
    HEUR-BLT-1 alone cannot recover it and must choose a selection rule.
    DEC-20260907-9b1b02 required exactly two things before that cell may be
    called either way: this amendment, which states the formula, and a
    fresh seal under the corrected definition. This version implements
    both, and adds the sample size, interval estimation, null object and
    decay controls that v1 lacked. Prior per-cell verdicts, pass-counts,
    and which implementation chose which rule are not restated here: they
    live on EV-ECDLP-2e9680 and DEC-20260907-9b1b02, which are on
    Stage A' `blind_from`.

  objective: >-
    Under the CORRECTED, explicitly stated STATIC(T)_r selection rule
    (`definitions`, item a), measure the G3 margin at each a in
    {1/16, 1/8, 3/16, 1/4} at N in {2^20, 2^24}, r = 2, T_sel = T/2, over 25
    pre-registered seeds per cell, by TWO structurally independent routes -- a
    production implementation (Stage B'/C') and a FRESHLY SEALED blind
    re-derivation by an agent that has not read the prior blind implementation
    (Stage A') -- and report, per cell, whether the two routes now AGREE. The
    single decision-changing uncertainty is a = 1/8. a = 1/16 is carried as a
    same-cell reproduction target (with a disclosed, permanent
    commit-history contamination on its independence, see
    `blind_history_contamination`); a = 3/16 and a = 1/4 are carried as
    known-false anchors and as the endpoints of the DECAY-A control.

  definitions:
    N: "size of the set for the generic instrument; two scales this version: 2^20 = 1048576 and 2^24 = 16777216."
    T: "nominal table size, round(N^{1/3}): T = 256 at N = 2^24, T = 102 at N = 2^20."
    T_sel: "number of entries STORED (the advice); primary value T/2 exactly (128 at N = 2^24, 51 at N = 2^20). The DECAY-TSEL control additionally reads T/4 and T/8 at the same cells."
    W: "expected walk length between DPs, W = sqrt(a N / T); theta = 1/W. (Worked check: at N = 2^24, a = 1/16, T = 256, W = sqrt(16777216/(16*256)) = 64.)"
    a: "T W^2 / N; a_grid = {1/16, 1/8, 3/16, 1/4}, unchanged from v1."
    r: "precomputation pool ratio; FIXED at r = 2, unchanged from v1."
    seed: "walk-key seed for the generic instrument; seed_set = {1..25} per (N, a) cell (see `replication`)."
    exact basin partition: >-
      the exact partition of the N points induced by the DP-truncated
      functional graph: point x belongs to basin d iff the walk from x first
      reaches a distinguished point at d. Computed by full enumeration
      (`inputs.exact_basins`), never sampled, never walked online. b(d) denotes
      the exact size of basin d; sum over all d of b(d) = N.
    exact top-T_sel basin share: >-
      UNCHANGED FROM v1. With basins sorted by exact size descending
      (b_1 >= b_2 >= ...), share_top(T_sel) = (1/N) * sum_{i=1..T_sel} b_i.
      This is the oracle-optimal coverage achievable by storing T_sel entries.
    "STATIC(T)_r exact coverage (v2, CORRECTED, item a)": >-
      Stated as an explicit procedure in named measured quantities, removing
      the underspecification that produced v1's a = 1/8 disagreement.
      (1) POOL. Construct the precomputation pool exactly as
      `inputs.pool_construction` states: run pool-construction walks from
      uniformly random restarts until r*T DISTINCT distinguished points have
      been reached. Let P be that set of r*T distinct DPs.
      (2) PER-ENTRY WALK STATISTICS. For each d in P, let h_d be the NUMBER of
      pool-construction walks that terminated at d, and let S_d be the SUM of
      the LENGTHS of those walks (every walk charged in full, including walks
      from restarts; length counted in steps from the restart point to the DP).
      Both are properties of the pool construction, not of the basin partition,
      and both are observable to a real precomputer.
      (3) WEIGHT. weight_d = S_d + 4 * W * h_d, with W as defined above. This is
      the published Bernstein-Lange weight and is the formula v1 named but did
      not state. It is EXACTLY what
      experiments/EXP-ECDLP-612fb1/source_v2/instrument.py `Pool.weights(W)`
      computes. Prior cell outcomes under this rule are not restated here.
      (4) SELECTION. Sel_static = the T entries of P with the largest weight_d,
      ties broken by ASCENDING pool key. |Sel_static| = T exactly.
      (5) COVERAGE. cov_static = (1/N) * sum_{d in Sel_static} b(d), where b(d)
      is the TRUE exact basin size of d from the exact basin partition.
      NOTE, stated because a from-scratch re-deriver must not have to infer it:
      distinct DPs index DISTINCT basins by construction, so no basin is
      double-counted in this sum. The SELECTION is a realistic estimator
      (weights, not sizes); the COVERAGE READ-OFF is exact (true sizes of the
      selected entries). Both halves matter and v1 stated only the second.
    superseded_v1_text: >-
      v1's `definitions.STATIC(T)_r exact coverage`, quoted verbatim and
      retained for auditability, never deleted: "the exact fraction of the N
      points covered by the T basins selected by the published Bernstein-Lange
      weight from an r T-distinct-DP precomputation pool at ratio r, read
      exactly (not sampled) from the same basin partition -- v1/v2's own
      STATIC(T) arm's exact-coverage reading." Where v1 and v2 differ, and v2 is
      approved, v2 governs; v1's six executed runs are never re-scored under it.
    "G3 margin (the load-bearing quantity)": >-
      For a cell (N, a, r = 2, T_sel, seed s):
      margin(s) = share_top(T_sel)(s) - cov_static(s).
      This single scalar is the quantity the blind re-derivation must reproduce
      and the quantity every verdict below is a function of. It is
      dimensionless (a difference of two fractions of N) and lies in [-1, 1].
    "G3-feasibility predicate (v2, stated as a formula)": >-
      Let n = 25 be the pre-registered seed count, k(a, N) = #{s in seed_set :
      margin(s) >= 0} the pass-count, and [L(a, N), U(a, N)] the 95% BCa
      bootstrap confidence interval for the mean margin mbar(a, N) =
      (1/n) * sum_s margin(s), computed with 10000 resamples and RNG seed
      20260907 fixed here in advance.
      G3-FEASIBLE(a, N)   iff  k >= 20  AND  L > 0.
      G3-INFEASIBLE(a, N) iff  k <= 5   AND  U < 0.
      G3-UNRESOLVED(a, N) otherwise.
      The k thresholds are v1's >= 4-of-5 rule and its complement carried to
      n = 25 at the same 80% rate. UNRESOLVED is a first-class permitted
      outcome, new in v2 (see `judgment_calls` in the amendment): v1's bare
      pass-count forced every cell to a verdict, which is part of how a
      definitional artifact could present as a substantive disagreement.
    "v1-comparable subgroup reading": >-
      The SAME predicate applied with n = 5 to the seeds {1..5} subgroup alone
      and the literal v1 rule (FEASIBLE iff k >= 4, else INFEASIBLE, no
      interval). Reported BESIDE the 25-seed reading at every cell and NEVER
      composited with it, so v1's committed cells remain directly comparable.
    crossing bracket: >-
      the pair of adjacent a_grid values at which the CONFIRMED verdict (both
      readings agreeing, per `success_criterion`) changes from G3-FEASIBLE to
      G3-INFEASIBLE, at a given N. If an UNRESOLVED or DISAGREEMENT cell lies
      inside the bracket, the bracket is reported as NOT CLEANLY LOCATED at that
      N, exactly as v1 required; it is never interpolated.

  instrument: >-
    UNCHANGED FROM v1, verbatim: the generic keyed-random-function walk of
    experiments/EXP-ECDLP-612fb1/specification.v2.yaml `instrument.generic_walk`
    (f(x) = mix64(x XOR K) mod N; DP predicate hash64(x) < floor(2^64 / W) with
    an independent key) and its exact-basin enumeration. No curve arm;
    certificate kind: none. The PRODUCTION implementation (Stage B') may reuse
    experiments/EXP-ECDLP-612fb1/source_v2/ by explicit commit-pinned citation
    in its manifest. The RE-SEALED blind re-derivation (Stage A') may NOT -- see
    `blind_rederivation.blind_from`.

  inputs:
    pool_construction: >-
      UNCHANGED FROM v1 in substance, stated explicitly here because
      `definitions.STATIC(T)_r exact coverage` (v2) now depends on its
      observable by-products. Repeatedly: pick a uniformly random start point,
      walk under f until a distinguished point is reached, record (start,
      terminal DP, walk length). Stop when the number of DISTINCT terminal DPs
      reaches r*T. Every walk is charged, including walks whose terminal DP was
      already seen; h_d and S_d aggregate over all of them.
    stage_plan: >-
      STAGE A' (RE-SEALED BLIND RE-DERIVATION, REQUIRED, FROZEN,
      NON-NEGOTIABLE). A designated independent reviewer who has NOT read
      BATCH-3c7493's Stage A implementation, sealed artifact, or report writes
      its own from-scratch computation of `definitions.G3 margin` from
      specification.v2.yaml's `definitions` alone, SEALS it (hash + timestamp in
      its own task directory), and ONLY THEN opens any `blind_from` path for the
      required cell-by-cell comparison. See `blind_rederivation`.
      STAGE B' (PRODUCTION EXECUTION). Generic instrument, N in {2^20, 2^24},
      a_grid = {1/16, 1/8, 3/16, 1/4}, r = 2, T_sel = T/2, seeds 1..25, exact
      basins. Per (N, a, seed): share_top(T_sel), cov_static, margin. N = 2^20
      is run and reported FIRST (it is roughly 16x cheaper and shakes the
      pipeline out before the expensive scale).
      STAGE C' (CONTROLS). NULL-RANDSEL, DECAY-A, DECAY-TSEL and the NULL-SHUF
      diagnostic, on the SAME enumerated basin partitions and the SAME pools as
      Stage B' (no fresh sampling, so no draw-to-draw confound -- this is the
      correction the validator's own postseal_diagnostic_v2_clean.py had to make
      to its first diagnostic pass).
      STAGE D' (ANALYSIS). Apply the G3-feasibility predicate and the
      v1-comparable subgroup reading at every cell; compute the bootstrap
      intervals; evaluate the controls; report the crossing bracket at each N;
      compare cell by cell against Stage A''s sealed result; and separately
      report the seeds 1..5, N = 2^24 reproduction control against the committed
      v1 runs.
    control_evaluation_order: >-
      BINDING. Within Stage D', evaluate in this order and report in this order:
      (1) the seeds 1..5 N = 2^24 REPRODUCTION control; (2) NULL-RANDSEL;
      (3) DECAY-A; (4) DECAY-TSEL; (5) only then the novel-cell verdicts. A
      failure at (1), (2) or (3) stops interpretation of every novel cell (see
      `invalidation_rules`).
    exact_basins: "unchanged from v1, verbatim, at the two scales named above."

  blind_rederivation:
    required: true
    frozen: true
    quantity: >-
      `definitions.G3 margin`: margin(s) = share_top(T_sel)(s) - cov_static(s),
      per (N, a, seed), with share_top and cov_static exactly as
      `definitions.exact top-T_sel basin share` and `definitions.STATIC(T)_r
      exact coverage (v2, CORRECTED, item a)` state them. The re-deriver derives
      the whole computation from those definitions and `inputs.pool_construction`
      alone. THIS IS NOW POSSIBLE, which it was not under v1: the selection
      weight is a stated formula, not a named reference.
    parameters: "N in {2^20, 2^24}; a_grid = {1/16, 1/8, 3/16, 1/4}; r = 2; T_sel = T/2; seeds 1..25"
    procedure: >-
      Write the from-scratch computation; run it; write its full per-(N, a,
      seed) output to sealed_blind_rederivation_v2.json in the reviewer's own
      task directory; record its sha256 and an ISO-8601 UTC timestamp in
      sibling files; ONLY THEN open `blind_from` paths for the cell-by-cell
      comparison and any root-cause diagnosis. The seal must genuinely predate
      every `blind_from` read and the reviewer attests to the ordering.
      Determinism is REQUIRED this version: seed every RNG explicitly and do not
      derive any seed from Python's `hash()` (v1's Stage A did, which made its
      pool draw non-reproducible across processes under PYTHONHASHSEED -- a
      disclosed defect in validation_report.yaml `limitations`).
    blind_from:
      - experiments/EXP-ECDLP-612fb1/source_v2/
      - experiments/EXP-ECDLP-6ac801/source/
      - experiments/EXP-ECDLP-6ac801/runs/
      - coordination/experiments/EXP-ECDLP-6ac801/batches/BATCH-3c7493/tasks/TASK-20260907-80e198/
      - coordination/experiments/EXP-ECDLP-6ac801/batches/BATCH-3c7493/tasks/TASK-20260907-0a8773/
      - ledger/evidence/EV-ECDLP-2e9680.yaml
      - ledger/evidence/EV-ECDLP-f6b3f5.yaml
      - ledger/evidence/EV-ECDLP-60e266.yaml
      - ledger/decisions/DEC-20260907-9b1b02.yaml
      - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-e423d5/
    blind_from_note: >-
      EXTENDED relative to v1, which listed only EXP-ECDLP-612fb1's source and
      a-scan runs plus this experiment's own runs. Six of the ten paths above
      did not exist when v1 was frozen and every one of them states the prior
      per-cell verdicts or the prior blind implementation. A re-derivation that
      reads TASK-20260907-80e198/ is not a re-derivation; it is a re-run of the
      thing being checked.
    not_blind_from: >-
      specification.v2.yaml (this file) and
      experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.yaml are NOT blind_from
      and MUST be read: they are the statement the quantity is derived from.
      This is the whole point of amendment item (a).
    reviewer_eligibility: >-
      TASK-20260907-80e198's session is INELIGIBLE to perform Stage A'. It has
      read every blind_from path above and its blindness for this quantity is
      spent. This is not a judgement about that review, which did its job; it is
      the ordinary consequence of having done it.
    comparison_rule: >-
      UNCHANGED FROM v1 in substance. The sealed blind result and Stage B'/C''s
      production result are compared cell by cell. Disagreement is itself a
      reportable outcome and is never resolved by preferring one side without a
      stated, checkable reason.

  blind_history_contamination:
    condition: >-
      Two commit messages reachable from this lane's branch state the a = 1/16
      verdict in plain text: 84233e8c3 ("research(H-ECDLP-37dc01): ledger
      archive EXP-ECDLP-6ac801 -- a=1/16 confirmed G3-feasible") and 376c6660e
      ("H-ECDLP-37dc01: additive status_history entry -- a=1/16 independently
      confirmed G3-feasible"). `git log --oneline` is a routine orientation
      command in nobody's blind list, and it displays the answer for that cell.
    why_it_cannot_be_undone: >-
      Both commits are immutable archive commits and are correct as written.
      Reverting them would break the receipts bound to them and would not
      retract the messages anyway (CORR-20260905-547849 records exactly this
      failure mode). Nothing downstream can detect the contamination either: a
      re-derivation that agrees because it was told the answer is
      indistinguishable from one that agrees because the answer is right.
    consequence_on_scope: >-
      BINDING ON INTERPRETATION. Stage A''s independence claim is FULL at
      a = 1/8 and a = 3/16, whose verdicts appear in no commit message, and is
      WEAKENED at a = 1/16 whatever the re-deriver does. Any evidence record
      arising from this contract must state this beside the a = 1/16 result and
      must not present a = 1/16 agreement as independent corroboration of the
      same weight as a = 1/8 agreement. a = 1/4's infeasibility is already
      public in EV-ECDLP-60e266 and was never a blind cell.
    mitigation: >-
      The Stage A' handoff instructs the reviewer not to run git history
      commands and declares the condition rather than concealing it, per
      tools/check_review_independence.py's --blind-history contract. This is a
      mitigation, not a repair; the limitation is permanent for this cell.

  controls:
    - >-
      (a) BLIND RE-DERIVATION CONTROL (REQUIRED, frozen), carried from v1 and
      strengthened: see `blind_rederivation`. No cell is evidence before the
      Stage A' seal exists.
    - >-
      (b) a = 1/4 KNOWN-FALSE ANCHOR / REPLICATION CONTROL, carried from v1
      verbatim in force: T_sel = T/2 at a = 1/4, r = 2, N = 2^24 is established
      G3-INFEASIBLE (EV-ECDLP-60e266, 10/10; reconfirmed 0/5 under both readings
      in BATCH-3c7493). This version's 25 seeds at a = 1/4 must reproduce
      G3-INFEASIBLE. A FEASIBLE or UNRESOLVED verdict here invalidates the
      batch's instrument at every cell.
    - >-
      (c) EXACT-COVERAGE NON-EXCEEDANCE, carried from v1 verbatim: no
      share_top(T_sel) may exceed 1.0 or share_top(T) for T > T_sel, and no
      cov_static may exceed share_top(T). An exceedance is an implementation
      error, not a result.
    - >-
      (d) DEFINITIONAL IDENTITY, carried from v1 and now checkable rather than
      asserted: the selection rule applied by Stage B' must be the formula in
      `definitions` item (a), verified by the reviewer reading the production
      source against the contract text, not by trusting a citation.
    - >-
      (e) SEED-COUNT PARITY AND PRE-REGISTRATION: 25 seeds per (N, a) cell, the
      identical seed set on both readings and in every control arm, fixed in
      this contract before execution.
    - >-
      (f) NEW -- REPRODUCTION CONTROL vs THE COMMITTED v1 RUNS: at N = 2^24,
      seeds 1..5, the Stage B' production margins must reproduce the committed
      values in experiments/EXP-ECDLP-6ac801/runs/RUN-ECDLP-6ac801-001..006
      summary.json to within 1e-9 (these are exact enumerations of a
      deterministic instrument at fixed seeds, so agreement should be exact up
      to floating-point summation order). A mismatch means the new pipeline is
      not the old pipeline and every novel cell is uninterpretable until it is
      explained. This does NOT re-score the committed runs; they stand as
      executed and are the reference, not the subject.
    - >-
      (g) NEW -- NULL-RANDSEL, THE NULL OBJECT (G3-feasibility KNOWN FALSE).
      Same shape as the real measurement in every respect -- same enumerated
      basin partition, same pool P, same coverage read-off from true basin
      sizes, same predicate -- with exactly one substitution: the ORACLE top-
      T_sel selection is replaced by a uniformly random T_sel-subset of P
      (drawn with an explicitly seeded RNG, seed = 20260907 + seed index).
      margin_null(s) = (1/N) * sum_{d in RandSubset(P, T_sel)} b(d) - cov_static(s).
      WHY ITS CONCLUSION IS KNOWN FALSE, by argument and not by appeal to data:
      Sel_static is a weight-selected subset of P of size T = 2*T_sel, and
      weight_d is positively correlated with b(d) by construction (a larger
      basin is reached by more pool walks and by longer ones); a uniformly
      random subset of P of HALF that size has no such correlation and half the
      entries. margin_null must therefore be negative.
      REQUIRED FIRING SIGNATURE: at EVERY (N, a) cell, margin_null(s) < 0 in at
      least 24 of 25 seeds AND the bootstrap CI upper bound on mean margin_null
      strictly below 0.
      IF IT FAILS: the pipeline is producing "feasibility" from something other
      than top-basin structure. The entire batch is uninterpretable and is
      reported as an artifact finding, never as a feasibility result at any a.
    - >-
      (h) NEW -- DECAY-A, THE DECLARED DECAY CONTROL. The declared decay
      parameter is `a`. Increasing it must destroy the signal. Pre-registered
      requirements at each N: (i) mbar(a) is strictly decreasing across
      a = 1/16, 1/8, 3/16, 1/4; (ii) the bootstrap CI on the paired difference
      mbar(1/4) - mbar(1/16) excludes 0 on the negative side; (iii)
      mbar(1/4) < 0 with its own CI excluding 0.
      WHY THIS CONTROL HAS TEETH: requirement (iii) is anchored OUTSIDE this
      batch, on EV-ECDLP-60e266's independently established a = 1/4
      infeasibility, so DECAY-A is not a purely internal monotonicity check that
      a self-consistent wrong implementation would pass automatically.
      IF IT FAILS -- in particular if mbar does not decay in a, or if
      mbar(1/4) >= 0 -- the signal is an artifact by the canonical tell of
      docs/inventor-protocol.md and NO feasibility verdict is reported at any a.
    - >-
      (i) NEW -- DECAY-TSEL, THE SECOND DECAY CONTROL, WITH ITS TAUTOLOGICAL
      PART REMOVED. At fixed (N, a), read margins additionally at T_sel = T/4
      and T/8 (free: prefix sums over the same enumerated basin sizes, same
      pool, same Sel_static).
      WHAT IS TAUTOLOGICAL AND THEREFORE NOT THE CONTROL: cov_static does not
      depend on T_sel (it is read off the T largest-weight pool entries), and
      share_top(T_sel) is a prefix sum of a descending sequence, so
      margin(T/2) > margin(T/4) > margin(T/8) holds BY CONSTRUCTION on every
      seed of every correct implementation. Monotonicity here is arithmetic, not
      evidence, and is recorded as a structural self-check only -- a violation
      means the implementation is broken, and its absence means nothing.
      WHAT THE CONTROL ACTUALLY IS: define rho_ORACLE(a, N, s) = the smallest
      T_sel/T in the read grid {1/8, 1/4, 1/2} at which margin(s) >= 0 (and
      "> 1/2" when no read value reaches zero). Pre-registered requirements:
      (i) margin(s) < 0 at T_sel = T/8 in at least 24 of 25 seeds at EVERY a --
      i.e. the sign change is located strictly inside the grid and the
      feasibility signal is not an everything-passes artifact; (ii)
      rho_ORACLE is non-decreasing in a, which is the same directional claim
      DECAY-A makes, read on a second axis, and which is NOT forced by any
      arithmetic identity.
      IF (i) FAILS -- if a table of T/8 entries already covers as much as
      STATIC(T) -- the comparison is not measuring stored-advice efficiency and
      no feasibility verdict is reported.
      DISCLOSED: this control is weaker than DECAY-A, because both of its
      substantive clauses are internal to this batch, whereas DECAY-A's
      mbar(1/4) < 0 clause is anchored on EV-ECDLP-60e266 outside it. DECAY-A
      carries the load; DECAY-TSEL is corroboration bought almost for free.
    - >-
      (j) NEW -- NULL-SHUF, DIAGNOSTIC COLLAPSE CHECK ON THE ESTIMATOR (not a
      G3 null; recorded here so its direction is not misread). Randomly permute
      the assignment of true basin sizes b(d) across the DPs of P while holding
      the size multiset and the weights fixed, then recompute cov_static.
      Expected: cov_static collapses toward the pool's mean-size expectation,
      confirming that weight_d carries real information about b(d). This makes
      G3 pass MORE easily, so it is explicitly NOT usable as a null for the
      feasibility predicate; it is reported as a diagnostic only, and no verdict
      depends on it.

