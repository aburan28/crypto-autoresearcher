    Sizing anchor, the only MEASURED timing available for corrected-definition
    work at this scale: validation_report.yaml `reviewer_resource_accounting`
    records 65.3 s wall clock for a full 4-a x 5-seed sealed pass at N = 2^24,
    and roughly 1 GB peak for int32/float32 arrays of length 2^24. Scaling that
    by 5x seeds gives order 5-6 minutes per 4-a x 25-seed pass at N = 2^24, with
    N = 2^20 roughly 16x cheaper, plus the control arms which reuse the same
    enumerated partitions and pools rather than re-drawing them. maximum_runs 30
    covers: 8 production shards (2 scales x 4 a-values), 4 control shards, 1
