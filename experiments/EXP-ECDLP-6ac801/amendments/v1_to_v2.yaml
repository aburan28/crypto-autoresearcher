    - "instrument, inputs.stage_plan's own scientific content (Stage B/C is complete and NOT re-run), inputs.arms, inputs.exact_basins"
    - "blind_rederivation's own v1 fields (required, frozen, quantity, parameters, procedure, blind_from, comparison_rule, non_negotiable_note) -- verbatim; `v2_rerequirement_a_1_8` is a new, appended sub-key only"
    - "controls (a) through (e) verbatim; (f) is newly appended"
    - "independent_variables, metrics, heuristic_under_test, heuristic_note, preregistered_prediction, scale_relevance, tail_checks, replication"
    - "budget's own numeric fields (enforcement, wall_clock_seconds_per_run, total_cpu_hours, maximum_memory_gb, maximum_runs, maximum_workers) -- unchanged; budget_note gets one additive sentence"
    - "stopping_rules (the five v1 entries) verbatim; one new entry appended"
    - "invalidation_rules (the eight v1 entries) verbatim; one new entry appended"
    - "success_criterion, falsification_criterion -- byte-identical to v1, word for word"
    - "required_artifacts (the five v1 entries) verbatim; one new entry appended"
    - "cost_model (all five sub-fields) -- byte-identical to v1"
    - "interpretation (the four v1 bullets) verbatim; one new bullet appended"
    - "out_of_scope's own scientific content -- byte-identical to v1, with one clarifying sentence appended naming RANK 2 as the separate future experiment"
    - "distinguishable_outcomes (all five outcomes a-e) -- byte-identical to v1, word for word"
    - "claim_tier toy and claim_tier_note -- byte-identical to v1, word for word"

