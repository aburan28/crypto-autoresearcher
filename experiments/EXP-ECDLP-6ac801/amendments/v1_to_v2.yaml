      experiments/EXP-ECDLP-612fb1/amendments/v1_to_v2.yaml both make
      throughout their own `judgment_calls`/`limitations` blocks.

  reason: >-
    TASK-20260907-80e198's sealed blind Stage A re-derivation, performed
    under DEC-20260906-bcc097's own RANK 1 requirement, disagreed with
    Stage B/C production at exactly one of the four tested a-values
    (a = 1/8: blind 1/5 INFEASIBLE vs production 5/5 FEASIBLE), while the
    other three cells (a = 1/16, a = 3/16, a = 1/4) agreed cleanly. The
    validator's own report diagnosed, but explicitly declined to resolve by
    fiat, a demonstrated, checkable root cause: specification.yaml's own
    `definitions.STATIC(T)_r exact coverage` names the pool-selection
    weight rule only by name ("the published Bernstein-Lange weight"),
    never by formula, so an independent from-scratch reader (Stage A) had
    no way to derive the exact rule production (Stage B/C, via the reused
    v2 instrument) actually applies (weight_d = S_d + 4*W*h_d). The
    Coordinator's committed decision DEC-20260907-9b1b02 records this a
    = 1/8 cell as genuinely OPEN (neither confirmed feasible nor confirmed
    infeasible) and names, as `next_actions` RANK 1, exactly the amendment
    this record implements: state the formula explicitly, then require a
    freshly sealed, independent re-derivation of ONLY the a = 1/8 cell
    under the corrected definition before any further verdict is reported
    for that cell. This record implements exactly that specification, no
    more and no less: traceable item-by-item to DEC-20260907-9b1b02's own
    `next_actions[0]` text and to TASK-20260907-80e198's own root-cause
    diagnosis, with every judgment call the decision's text underspecifies
    disclosed above rather than guessed silently.

