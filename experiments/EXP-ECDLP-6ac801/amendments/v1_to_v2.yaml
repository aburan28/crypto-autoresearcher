protocol_amendment:
  id: PA-ECDLP-6ac801-v1-to-v2
  id_allocation_provenance: >-
    Amendment records are NOT in tools/allocate_id.py's identifier space.
    That tool's PREFIX_TYPE mapping covers GOAL, RQ, IDEA, H, EXP, EV, DEC,
    TASK, BATCH, CORR only; there is no "amendment" or "protocol_amendment"
    entry. This mirrors the identical disclosure
    experiments/EXP-ECDLP-612fb1/amendments/v1_to_v2.yaml's own
    `id_allocation_provenance` makes for its sibling record. This id
    (PA-ECDLP-6ac801-v1-to-v2) is a deterministic, collision-free label --
    one experiment has at most one v1-to-v2 amendment, so the experiment id
    plus the version pair is unique by construction, unlike the
    random-token identifier types the allocator protects. No
    `allocate_id.py --next` or `--check` call was made or is needed for
    this record.
  experiment_id: EXP-ECDLP-6ac801
  version_from: 1
  version_to: 2
  authoring_task: >-
    TASK-20260907-56234a (this design authorship, coordinator role),
    dispatched by the orchestrating session as RANK 1 of
    DEC-20260907-9b1b02's own `next_actions`.
  amended_at: '2026-09-07'
  amended_at_note: >-
