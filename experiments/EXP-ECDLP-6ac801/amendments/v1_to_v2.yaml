      implements ONLY that decision's `next_actions` RANK 1 (the protocol
      amendment named as the prerequisite to resolving a = 1/8), not any
      re-opening of the decision itself.
    hypothesis_id: H-ECDLP-37dc01
    review_task_that_diagnosed_the_gap:
      task_id: TASK-20260907-80e198
      role: validator
      report: >-
        coordination/experiments/EXP-ECDLP-6ac801/batches/BATCH-3c7493/tasks/TASK-20260907-80e198/validation_report.yaml
      section: a_1_8_disagreement_root_cause
      verdict: >-
        review_attestation.verdict: breaks (on the literal a = 1/8 joint, as
        sealed); the report's own `disposition` explicitly declines to
        relabel the cell and hands the diagnosis to the Coordinator, exactly
        as implemented here.
    authoritative_field: >-
      DEC-20260907-9b1b02 `coordinator_decision.next_actions[0]`, quoted and
      implemented in full below. This is the ONLY authoritative spec for
      what this amendment must contain; nothing here re-derives it
      independently or substitutes a paraphrase for its instructions.
    next_actions_0_quoted: >-
      "RANK 1 (protocol amendment, prerequisite to resolving a = 1/8):
      author a versioned `protocol_amendment` to EXP-ECDLP-6ac801 (or a
      fresh standalone follow-up contract citing this one) that states
      `definitions.STATIC(T)_r exact coverage`'s pool-selection weight
      formula EXPLICITLY -- weight_d = S_d + 4*W*h_d (S_d the summed
      generating-walk length reaching pool entry d, h_d its hit count) --
      exactly as experiments/EXP-ECDLP-612fb1/source_v2/instrument.py
      already implements it -- removing the underspecification this
      batch's Stage A blind re-derivation had to fill in with a defensible
      but different (oracle true-size) choice. AFTER that amendment is
      committed, Stage A must be RE-SEALED: a NEW, freshly sealed,
      independent blind re-derivation artifact (never an edit of
      sealed_blind_rederivation.json, per `invalidation_rules` 'runs
      already executed are never re-scored') computed under the corrected
      definition, then re-compared cell by cell against Stage B/C's
      existing production result (which does not need to be re-run, since
      it already implements the corrected formula). Only then may a = 1/8
      be reported as CONFIRMED FEASIBLE, CONFIRMED INFEASIBLE, or a
      genuinely new disagreement. This is RANKED FIRST because it is cheap
      (the diagnostic script postseal_diagnostic_v2_clean.py is already a
      working prototype for the corrected Stage A logic) and resolves the
      single largest open item this batch produced."

  what_changed:
    old_text_quoted: >-
      v1's `definitions.STATIC(T)_r exact coverage` (verbatim, unchanged at
      this same key in v2): "the exact fraction of the N points covered by
      the T basins selected by the published Bernstein-Lange weight from an
      r T-distinct-DP precomputation pool at ratio r, read exactly (not
      sampled) from the same basin partition -- v1/v2's own STATIC(T) arm's
      exact-coverage reading." This text names the selection rule ONLY BY
      NAME ("the published Bernstein-Lange weight") and never states the
      formula anywhere else in v1's `definitions`, `inputs`, or
      `instrument` blocks (confirmed by a full read of
      experiments/EXP-ECDLP-6ac801/specification.v1-frozen-add84d2f.yaml).
    new_text_added: >-
      A NEW definitions key, appended (not replacing the quoted text
      above): "STATIC(T)_r pool-selection weight formula (v2 amendment item
      1, ADDITIVE...)", stating weight_d = S_d + 4*W*h_d explicitly, with
      S_d, W, h_d, and d each defined precisely (summed generating-walk
      length reaching DP d; the standing `definitions.W`; hit count of DP
      d; the pool-entry index), and citing the exact source: class `Pool`,
      method `weights`, experiments/EXP-ECDLP-612fb1/source_v2/instrument.py
      lines 445-446 -- `def weights(self, W: float) -> np.ndarray: return
      np.asarray(self.S, dtype=np.float64) + 4.0 * W *
      np.asarray(self.h, dtype=np.float64)` -- verified by direct read of
      that file at this amendment's authoring time. See
      specification.v2.yaml `definitions` for the full text.
    additional_additive_changes: >-
      (i) `blind_rederivation.v2_rerequirement_a_1_8`, a new sub-block
      scoping a mandatory, freshly SEALED, NEW-ARTIFACT-ONLY re-derivation
      of ONLY the a = 1/8 cell under the corrected formula, explicitly
      stating that Stage B/C's existing production a = 1/8 result (5/5
      FEASIBLE, RUN-ECDLP-6ac801-001..006, already computed under the
      correct formula) does NOT need to be re-run -- only Stage A's
      re-derivation is being redone, and only at a = 1/8 (the other three
      cells already agree cleanly between Stage A and Stage B/C and are not
      reopened). (ii) a new control (f) requiring the re-seal to apply the
      new formula with no further drift. (iii) one new stopping rule and
      one new invalidation rule enforcing the new-artifact/seal-timing
      discipline on the re-seal. (iv) one new required_artifacts entry for
      the new sealed a = 1/8 artifact. (v) one new interpretation bullet
      clarifying that even an S1 outcome at a = 1/8 remains ceiling-
      feasibility-only, per the unchanged interpretation bullets. (vi) this
      `protocol_amendment` metadata block itself, plus a `field_provenance`
      block listing every field confirmed byte-identical to v1.

  root_cause: >-
    Per DEC-20260907-9b1b02 `context` and TASK-20260907-80e198's own
    `a_1_8_disagreement_root_cause.finding`: this is a genuine
    UNDERSPECIFICATION IN THE FROZEN CONTRACT'S OWN TEXT, not a
    disagreement about physics and not a computational bug in either
    party's implementation. Absent the formula, Stage A's sealed
    computation selected the STATIC(T)_r pool's T entries by TRUE EXACT
    BASIN SIZE (the most natural reading of "weight" without access to the
    literature estimator), while production (Stage B/C, via
    experiments/EXP-ECDLP-612fb1/source_v2/instrument.py, reused unchanged)
    actually implements weight_d = S_d + 4*W*h_d, a realistic
    walk-statistics-based estimator a real precomputer would have to use
    (not knowing exact basin sizes in advance). A controlled post-seal
    diagnostic (postseal_diagnostic_v2_clean.py, same task directory,
    applying BOTH rules to the IDENTICAL sampled pool) confirmed that
    switching from the oracle rule to the S_d+4*W*h_d rule alone flips
    a = 1/8 from pass_count 1/5 (INFEASIBLE) to 5/5 (FEASIBLE) -- exactly
    matching production -- while leaving a = 1/16 (5/5 either way) and
    a = 1/4 (0/5 either way) unchanged, and moving a = 3/16 from 0/5 to 2/5
    (still solidly INFEASIBLE by the >= 4/5 threshold either way). This is
    why the re-seal required by this amendment is scoped to a = 1/8 ONLY.

  not_changed: # mirrors EXP-ECDLP-612fb1/amendments/v1_to_v2.yaml's own style; the complete list is also embedded in v2's own `field_provenance.unchanged`
    - "id, hypothesis_id, question_id, goal_id, derived_from_decision, derived_from_idea"
