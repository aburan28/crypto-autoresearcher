  judgment_calls: # explicit per this program's standing discipline: state, do not guess silently
    - >-
      The exact placement of the new formula key inside `definitions`
      (appended after `seed`, rather than inline-editing the existing
      `STATIC(T)_r exact coverage` entry) is a judgment call made to
      satisfy the task's own explicit instruction to keep all existing
