protocol_amendment:
  id: PA-ECDLP-6ac801-v2-to-v3
  id_allocation_provenance: >-
    Amendment records are NOT in tools/allocate_id.py's identifier space. That
    tool's PREFIX_TYPE mapping covers GOAL, RQ, IDEA, H, EXP, EV, DEC, TASK,
    BATCH, CORR only; there is no "amendment" or "protocol_amendment" entry.
    This mirrors the identical disclosure made by this experiment's own
    approved amendments/v1_to_v2.yaml and by
    experiments/EXP-ECDLP-612fb1/amendments/v1_to_v2.yaml. The label
    PA-ECDLP-6ac801-v2-to-v3 is deterministic and collision-free by
    construction: one experiment has at most one v2-to-v3 amendment. No
    `allocate_id.py --next` or `--check` call was made for this record and none
    is needed. Every OTHER identifier this amendment's lane uses (BATCH-48ef8b,
    six TASK-20260907-*, three DEC-20260907-*) WAS minted with
    `--next` and confirmed with `--check`; see
    ledger/decisions/DEC-20260907-52f2a0.yaml `id_allocation_provenance`.
  experiment_id: EXP-ECDLP-6ac801
  version_from: 2
  version_to: 3
  v3_path: experiments/EXP-ECDLP-6ac801/specification.v3.yaml
  authoring_task: TASK-20260907-058c69
  authoring_batch: BATCH-48ef8b
  authoring_goal: GOAL-ECDLP-bbc21f
  amended_at: '2026-09-07'
  amended_at_note: >-
    Runtime-supplied calendar date; this role holds no independent clock, the
    same disclosure every record in this lineage carries. The commit time is
    authoritative.

  # =====================================================================
  # 0. WHICH DOCUMENT THIS AMENDS -- STATED EXPLICITLY, BECAUSE THE
  #    IDENTIFIER PA-ECDLP-6ac801-v1-to-v2 IS AMBIGUOUS
  # =====================================================================
  amends:
    base_amendment_id: PA-ECDLP-6ac801-v1-to-v2
    base_amendment_path: experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.yaml
    base_contract_path: experiments/EXP-ECDLP-6ac801/specification.v2.yaml
    base_contract_status: 'approved / frozen: true / execution_authorized: true'
    which_of_the_two: >-
      THE APPROVED ONE. The identifier PA-ECDLP-6ac801-v1-to-v2 names TWO
      records (identifier collision IC-1, DEC-20260907-b6bcf4
      `identifier_collision_disposition`): BATCH-8f3e86's narrow a = 1/8
      re-seal, APPROVED and FROZEN at the two live canonical paths named above;
      and BATCH-e9fd22's wide re-seal at `status: revision_required`, at
      experiments/EXP-ECDLP-6ac801/{specification.v2.BATCH-e9fd22-proposed.yaml,
      amendments/v1_to_v2.BATCH-e9fd22-proposed.yaml}. THIS AMENDMENT AMENDS
      THE APPROVED ONE, at the two live canonical paths, whose sha256 are
      recorded under `additivity_check` below. It amends NEITHER sidecar.
    the_collision_is_not_resolved_here: >-
      BINDING. This amendment does NOT rename, supersede, retract, edit or
      dispose of either colliding record, and holds no authority to. AGENTS.md
      rule 15 forbids the rename (the identifier appears in the binding fields
      of two COMPLETED archives: TASK-20260907-4ce154's `archive.record_ids` at
      commit 5856b36e8 and TASK-20260907-ceb8cf's ledger receipt `record_ids`
      at commit f996864d2), and DEC-20260907-b6bcf4 has already disposed of it:
      the collision STANDS PERMANENTLY AS A DISCLOSED DEFECT. This amendment is
      the successor that record names -- a v2-to-v3 under a NEW, unambiguous id
      that needs neither colliding record to change.
    relation_to_the_refused_sidecar_draft: >-
      The sidecar draft is this amendment's ANCESTOR IN SCOPE and its
      PREDECESSOR IN DEFECTS, not its base. Its wide scope (25 seeds, interval
      estimation with a non-verdict outcome, an externally anchored decay
      control, a properly-shaped null, a reproduction control against the
      committed v1 cells) is carried forward here per DEC-20260907-b6bcf4
      `next_actions` RANK 1 and the compatibility read CR-1. Its three blocking
      defects D1/D2/D3 and its four non-blocking defects D4/D5/D6/D7
      (DEC-20260907-4e34c5) are discharged here. Its bytes are untouched and
      its `revision_required` status is unchanged by this record.
    what_v3_is_beside_and_never_edits:
      - experiments/EXP-ECDLP-6ac801/specification.yaml (v1, frozen, executed)
      - experiments/EXP-ECDLP-6ac801/specification.v1-frozen-add84d2f.yaml (v1's byte copy)
      - experiments/EXP-ECDLP-6ac801/specification.v2.yaml (v2, APPROVED, frozen -- another lane's record)
      - experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.yaml (v2's amendment, APPROVED -- another lane's record)
      - experiments/EXP-ECDLP-6ac801/specification.v2.BATCH-e9fd22-proposed.yaml (the refused sidecar)
      - experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.BATCH-e9fd22-proposed.yaml (the refused sidecar)
      - experiments/EXP-ECDLP-6ac801/runs/ (RUN-ECDLP-6ac801-001..006; never re-scored)

  # =====================================================================
  # 1. WHERE THE AUTHORITY TO CHANGE COMES FROM (CR-1 COND-1..COND-4)
  # =====================================================================
  authority_to_change:
    primary:
      field: 'experiments/EXP-ECDLP-6ac801/specification.v2.yaml invalidation_rules item 7'
      quoted_verbatim: >-
        "Any post-hoc change to the a-grid, N, r, T_sel, or the G3-style
        feasibility criterion beyond what THIS versioned contract states:
        requires a further versioned protocol_amendment; runs already executed
        are never re-scored."
      why: >-
        It is the APPROVED CONTRACT'S OWN DECLARED CHANGE MECHANISM, and it
        names three of the four things the wide scope must move: N (the second
        scale), T_sel (T/4 and T/8, read only inside the DECAY-TSEL control),
        and the G3-style feasibility criterion (interval estimation and the
        fresh non-verdict outcome). A versioned protocol_amendment is exactly
        the instrument the rule points at, and this is one.
      binding_condition_discharged: >-
        "runs already executed are never re-scored" HOLDS. The six executed v1
        runs RUN-ECDLP-6ac801-001..006 enter v3 in exactly ONE role: as the
        REFERENCE of control (h), the cross-scale reproduction control. They are
        never its subject, are never re-scored under v3's criterion, and no byte
        under experiments/EXP-ECDLP-6ac801/runs/ is written by this amendment or
        by any task of BATCH-48ef8b. v3's own `invalidation_rules` restates this
        as a rule binding on the executor.
    cond_1:
      id: COND-1
      condition_quoted_from: 'DEC-20260907-b6bcf4 compatibility_read.the_four_conditions_v3_must_meet[COND-1]'
      requirement: >-
        Append a second arm declaring T = 64 and T_sel = 32 at N = 2^20, cited
        to experiments/EXP-ECDLP-612fb1/specification.v2.yaml line 223, leaving
        every N = 2^24 field byte-identical.
      discharged_by: 'this amendment `d1_discharge`; v3 `definitions.T`, `definitions.T_sel`, `definitions.W_and_cap_table_v3`'
      how: >-
        The approved v2 states NOTHING at N = 2^20 -- `definitions.T` reads "T:
        nominal table size N^{1/3} rounded = 256 at N = 2^24" and
        `definitions.T_sel` reads "FIXED at T/2 = 128 for this contract". So
        there is no value to contradict, only a blank to fill. v3 quotes both v2
        strings verbatim, retains them in force at N = 2^24, and APPENDS the
        N = 2^20 values from the frozen table. Every N = 2^24 number in v2
        (T = 256, T_sel = 128) is unchanged.
    cond_2:
      id: COND-2
      requirement: >-
        `blind_rederivation` carries `frozen: true`; extend it by APPENDING new
        sub-keys and touch none of its eight existing v1 fields (required,
        frozen, quantity, parameters, procedure, blind_from, comparison_rule,
        non_negotiable_note).
      discharged_by: 'v3 `blind_rederivation`'
      how: >-
        v3 reproduces those eight fields byte-identically from the approved v2,
        retains v2's own appended sub-key `v2_rerequirement_a_1_8`
        byte-identically beside them, and appends exactly two NEW sub-keys of
        its own: `v3_derivation_packet` (the allowlist mechanism that discharges
        D3) and `v3_rerequirement_stage_a_dprime` (the scope of the Stage A''
        re-seal v3 requires). This is precisely the precedent the approved v2
        set against itself when it appended `v2_rerequirement_a_1_8` inside a
        block carrying `frozen: true`, recorded in its own amendment's
        `not_changed`.
      one_deliberate_asymmetry_declared: >-
        `blind_from` is NOT edited -- not one entry removed, not one added.
        v3 instead makes the new ALLOWLIST (`v3_derivation_packet`)
        authoritative and demotes every denylist, v2's included, to
        corroborating. That satisfies AO-3's "name ONE authoritative blind list"
        without touching a frozen field, and it is the substance of the D3
        repair: see `d3_discharge`.
    cond_3:
      id: COND-3
      requirement: >-
        Keep success_criterion S1/S2/S3 and metrics.primary VERBATIM with the
        approved v2's meanings; give the interval-routed outcome a FRESH label,
        never S3.
      discharged_by: 'v3 `success_criterion`, `metrics`'
      how: >-
        v3 carries S1 (CONFIRMED FEASIBLE), S2 (CONFIRMED INFEASIBLE) and S3
        (DISAGREEMENT) with the approved v2's meanings quoted verbatim, and
        introduces the FRESH label **SU (CONFIRMED UNRESOLVED)** for the
        interval-routed outcome. The refused sidecar draft's labelling -- S3 =
        CONFIRMED UNRESOLVED, S4 = DISAGREEMENT -- is NOT adopted, and NO
        OUTCOME OF v3 IS LABELLED S4 (the string occurs in v3 only inside the
        three disclaimers that say so, never as a label; checked by grep at
        authoring time). `SU` occurs zero times in the approved v2, in
        v1, and in either sidecar (checked by grep at authoring time), so the
        label is free. v2's own ">= 4 of 5 seeds" rule is preserved verbatim and
        applied to the seeds 1..5 subgroup, reported separately and never
        composited with the 25-seed reading.
      why_the_fresh_label_matters: >-
        The approved v2's S3 means DISAGREEMENT. Reusing "S3" for CONFIRMED
        UNRESOLVED would make one label denote two different outcomes under one
        experiment identifier -- the exact failure this experiment has already
        suffered once, at the amendment id (IC-1). One collision per experiment
        is a disclosed cost; two would be a pattern.
    cond_4:
      id: COND-4
      requirement: >-
        Do not edit control (e) SEED-COUNT PARITY. Append a new control quoting
        (e) verbatim, argue that 25 seeds meet its stated rationale a fortiori,
        and pin seeds 1..5 as the subgroup serving the reproduction control.
      discharged_by: 'v3 `controls` item (g)'
      how: >-
        v3 carries controls (a) through (f) byte-identically from the approved
        v2 and appends (g) SEED-COUNT PARITY EXTENSION, which quotes (e) in full
        and argues from (e)'s OWN stated rationale -- "so this batch's
        statistical power is comparable, not thinner, than the batch that
        produced the original discrepancy" -- that 25 seeds per (N, a) satisfy
        it a fortiori: 25 > 5 and the seed streams are the same construction, so
        power is strictly greater, never thinner. (e)'s text is untouched.
      the_authority_gap_stated_rather_than_papered_over: >-
        THE SEED SET IS THE ONE WIDE-SCOPE ITEM `invalidation_rules` item 7 DOES
        NOT NAME, so item 7 confers no authority over it. The authority used
        here is control (e)'s own rationale, which states the property the
        control exists to protect and is satisfied more strongly by 25 seeds
        than by 5. That is a weaker warrant than item 7 and it is recorded as
        such rather than assimilated to it. A gate that rejects this reading
        should say so; the fallback that needs no new warrant at all is to run
        seeds 1..5 only, which costs the wide scope its power and discharges
        nothing this lane exists to discharge.

  # =====================================================================
  # 2. D2 -- THE BLOCKING DEFECT DISCHARGED FIRST
  # =====================================================================
  d2_discharge:
    rank: 'FIRST, per DEC-20260907-b6bcf4 next_actions RANK 1 and the goal head'
    the_defect_as_the_gate_stated_it: >-
      DEC-20260907-4e34c5 `blocking_defects[D2]`: the contract defines the basin
      partition as exhaustive ("sum over all d of b(d) = N") and describes pool
      construction as walking "until a distinguished point is reached".
      Production does neither: `exact_basins` keeps only points with dist <= cap
      where cap = ceil(8*W), and reports cycle_mass and capped_mass as
      unassigned. The constant 8 appears nowhere in the contract, so the cap is
      not derivable from it at all.
    where_it_is_live: >-
      IN THE APPROVED v2, not only in the refused sidecar. `cap`, `CAP_MULT`,
      `cycle_mass` and `capped_mass` appear ZERO times in
      experiments/EXP-ECDLP-6ac801/specification.v2.yaml (re-verified by grep of
      the committed file at this amendment's authoring time: 0 matches for each
      of the four strings, case-sensitive). The approved v2 is
      `execution_authorized: true` and requires a freshly sealed Stage A'
      re-derivation of the a = 1/8 cell, so a from-scratch re-deriver working
      from it alone MUST INVENT A CAP CONVENTION. This is CR-1a
      (DEC-20260907-b6bcf4 `compatibility_read.the_finding_that_strengthens_the_recommendation`).
    what_is_not_claimed: >-
      NO MAGNITUDE AND NO DIRECTION. Whether a cap difference could change any
      cell's verdict is UNMEASURED -- by the gate, by the lane close, and by this
      amendment. The gate measured only the unassigned mass itself (4.67e-4 to
      2.09e-3 of N across the four a-cells of RUN-ECDLP-6ac801-001, its own
      single-run scope) and stated that the direction of any induced difference
      is unpredictable from the contract text. This amendment repairs a
      DERIVABILITY gap. It predicts no verdict, no flip, and no margin, and it
      is not evidence about G3 feasibility at any a.
    against_the_approved_v2_this_is_a_pure_addition: >-
      The approved v2 is SILENT about the partition's exhaustiveness; only the
      refused sidecar ASSERTS 'sum over all d of b(d) = N', which is false of
      the object both readings compute. So against the approved v2 there is
      NOTHING TO RETRACT: v3 states the cap and the true accounting, and no
      approved sentence has to be withdrawn. v3 nevertheless states the FALSE
      identity explicitly and marks it false, because a later reader coming from
      the sidecar will have seen it and must be told which way it was resolved.

    # -----------------------------------------------------------------
    # THE CAP CONVENTION, STATED AS A FORMULA IN THE MEASURED QUANTITIES
    # -----------------------------------------------------------------
    cap_convention:
      read_off_the_production_implementation: >-
        NOT paraphrased from a decision record. The three lines below were read
        directly, at this amendment's authoring time, from the two files that
        constitute the v1 production computation of this experiment:
        experiments/EXP-ECDLP-612fb1/source_v2/instrument.py (the commit-pinned
        instrument this experiment's Stage B imports by explicit path reference,
        per its own `instrument` field) and
        experiments/EXP-ECDLP-6ac801/source/run_stageb.py (the Stage B
        production script itself).
      source_lines:
        - path: experiments/EXP-ECDLP-612fb1/source_v2/instrument.py
          line: 31
          verbatim: 'CAP_MULT = 8                                  # cap = 8W'
        - path: experiments/EXP-ECDLP-612fb1/source_v2/instrument.py
          line: 75
          verbatim: 'self.W = math.sqrt(self.a * self.N / self.T)'
        - path: experiments/EXP-ECDLP-612fb1/source_v2/instrument.py
          line: 77
          verbatim: 'self.cap = int(math.ceil(CAP_MULT * self.W))'
        - path: experiments/EXP-ECDLP-612fb1/source_v2/instrument.py
          line: 29
          verbatim: 'T_OF_NBITS = {20: 64, 24: 256, 30: 1024}      # T = N^{1/3} rounded, as frozen'
        - path: experiments/EXP-ECDLP-612fb1/source_v2/instrument.py
          line: 74
          verbatim: 'self.T = T_OF_NBITS[self.n_bits]'
      formula: >-
        cap(N, a) = ceil(8 * W(N, a)),  where  W(N, a) = sqrt(a * N / T(N))
        and T(N) is the frozen table T(2^20) = 64, T(2^24) = 256,
        T(2^30) = 1024.
      units_and_type: >-
        `cap` is a COUNT OF WALK STEPS (group operations), a non-negative
        integer. `math.ceil` is applied to the float64 value of 8*W and the
        result is converted with `int(...)`, so cap is the least integer >= 8*W.
        It is NOT 8*W truncated, NOT round(8*W), and NOT a distance in any other
        unit. The multiplier is exactly 8 (`CAP_MULT = 8`), not 8*W, not W/8.
      exact_values_at_this_contracts_grid: >-
        DERIVED FROM THE FORMULA ABOVE, not measured and not read off any run.
        Any reader can reproduce every row with the three source lines and a
        calculator. At N = 2^20, T = 64: a = 1/16 -> W = 32, cap = 256;
        a = 1/8 -> W = 45.254833996, cap = 363; a = 3/16 -> W = 55.425625842,
        cap = 444; a = 1/4 -> W = 64, cap = 512. At N = 2^24, T = 256:
        a = 1/16 -> W = 64, cap = 512; a = 1/8 -> W = 90.509667992, cap = 725;
        a = 3/16 -> W = 110.851251684, cap = 887; a = 1/4 -> W = 128,
        cap = 1024. (W printed to nine decimal places; the binding definition is
        the formula, not the printed decimal.)
      the_dp_rate_that_accompanies_it: >-
        Stated because a re-deriver needs it and it is the same class of
        convention: theta = 1/W and the production DP predicate is
        `mix64(x XOR K_dp) < dp_threshold` with
        dp_threshold = floor(2^64 / W) (instrument.py line 83:
        `self.dp_threshold = int(math.floor((1 << 64) / self.W))`). The
        approved v2's `instrument` field already names this predicate in words
        ("DP predicate hash64(x) < floor(2^64 / W) with an independent key");
        v3 states the floor and the independent-key derivation
        (`K_dp = mix64(K XOR 0xD1B54A32D192ED03)`, instrument.py line 82)
        explicitly so no second convention has to be invented either.

    # -----------------------------------------------------------------
    # WHAT THE RESIDUAL MASS IS AND WHERE IT GOES
    # -----------------------------------------------------------------
    residual_mass_accounting:
      read_off: 'experiments/EXP-ECDLP-612fb1/source_v2/instrument.py `exact_basins`, lines 194-215, and `Basins`, lines 158-166'
      the_three_disjoint_classes: >-
        For every one of the N points x, let dist(x) be the number of walk steps
        from x to the first distinguished point on its forward orbit, and
        reach(x) the predicate that such a DP exists. `exact_basins` computes
        dist by pointer doubling with DPs made absorbing (lines 201-206), and
        saturates dist at sat = 2^n_bits for points with no DP on their orbit
        (line 207). It then partitions the N points into exactly three disjoint,
        exhaustive classes:
          (1) ASSIGNED:      reach(x) AND dist(x) <= cap.  Line 209:
                             `ok = reach & (dist <= P.cap)`.
          (2) CYCLE MASS:    NOT reach(x).  Line 210:
                             `cycle_mass = int((~reach).sum())`.
          (3) CAPPED MASS:   reach(x) AND dist(x) > cap.  Line 211:
                             `capped_mass = int((reach & ~ok).sum())`.
        Basin sizes are counted over class (1) ALONE: line 212-213,
        `idx = searchsorted(dps, nxt[ok])` then
        `size = bincount(idx, minlength=len(dps))`.
      where_the_residual_goes: >-
        NOWHERE. It is not assigned to any basin, not redistributed, and not
        discarded silently: it is REPORTED, as the two named integer fields
        `Basins.cycle_mass` and `Basins.capped_mass` (dataclass fields declared
        at instrument.py lines 164-165 with the comments "points that never
        reach a DP (DP-free cycle and its tails)" and "points whose first DP
        lies beyond the cap"). A point on a DP-free cycle, a point in the tail
        feeding such a cycle, and a point whose first DP lies beyond the cap all
        belong to NO basin.
      the_true_relation_replacing_the_false_identity: >-
        FALSE, and asserted by the refused sidecar draft (its lines 92 and 169):
        "sum over all d of b(d) = N".
        TRUE, and stated by v3:
            sum over all DPs d of b(d)  =  N - cycle_mass - capped_mass
        equivalently, as an exact accounting identity every reading must satisfy:
            sum_d b(d)  +  cycle_mass  +  capped_mass  =  N.
        This is an identity of the object `exact_basins` computes, not an
        empirical claim: classes (1), (2) and (3) are disjoint and exhaustive
        over the N points by construction, and sum_d b(d) is exactly |class (1)|.
      a_consequence_worth_stating: >-
        Every DP is in its own basin, so b(d) >= 1 for every d: dist(d) = 0 at a
        DP (line 202, `dist = (~dp).astype(np.int32)`) and 0 <= cap, so every DP
        is in class (1) and is counted into its own bincount bucket. A reading
        that produces b(d) = 0 for some DP has a defect.
      the_cap_also_governs_pool_construction: >-
        `walk_to_dp` (instrument.py lines 126-151) stops at the cap: its
        docstring states "Returns (terminal, length): terminal = DP value, or -1
        if capped; length = number of walk steps (group operations), = cap when
        capped", its loop condition is `while active.size and steps < P.cap`
        (line 141) and it charges `length[active] = P.cap` to the survivors
        (line 150). `generate_pools` (lines 243-289) then charges every walk and
        credits only the terminating ones: line 268 `P_cost += L`
        unconditionally, then lines 269-280,
          if t < 0:  capped += 1
          else:      S[j] += L ; h[j] += 1  (or a new entry with S = L, h = 1).
        SO: A POOL-CONSTRUCTION WALK THAT REACHES THE CAP IS CHARGED ITS `cap`
        STEPS AND CREDITS NO S_d AND NO h_d. It contributes to `P_cost` and to
        `PoolSnapshot.capped_walks` and to nothing else. v3 states this, and
        requires `capped_walks` reported per cell, because a re-deriver that
        credits a capped walk to the DP it would eventually have reached
        computes a different weight_d, hence a different Sel_static, hence a
        different cov_static.
      required_of_both_readings: >-
        v3 requires cycle_mass, capped_mass, capped_walks and the residual
        fraction (cycle_mass + capped_mass)/N reported PER CELL by BOTH the
        blind and the production reading, and requires the accounting identity
        above to hold EXACTLY (integer arithmetic, zero tolerance) in each. See
        v3 `controls` item (n) and `required_artifacts`. Item (n) is declared a
        STRUCTURAL SELF-CHECK and not a control, for the reason given there: it
        is an identity, so it cannot fire on a correct implementation, and
        calling it a control would repeat the vacuity the gate removed from
        DECAY-TSEL.

  # =====================================================================
  # 3. D3 -- THE MECHANISM, NOT THE PATH LIST
  # =====================================================================
  d3_discharge:
    the_defect_as_the_gate_stated_it: >-
      DEC-20260907-4e34c5 `blocking_defects[D3]`: the Coordinator's directional
      prior sits in plain text in ledger/handoffs/TASK-20260907-e423d5.yaml
      `review_plan.coordinator_prior` and in five places in BATCH-e9fd22's
      committed dispatch_queue.json; TASK-20260907-6a2b2e's task_card.yaml
      declares that handoff as its `review_plan_path`, so the re-deriver is
      instructed to read it before sealing; and neither path is on any blind
      list.
    why_adding_two_paths_to_a_list_is_not_the_repair: >-
      Three independent reasons, each read off the committed record rather than
      argued in the abstract.
      (i) A DENYLIST CANNOT BE SHOWN COMPLETE. It enumerates what must not be
      read out of a repository of 13000+ identifier-bearing paths that grows
      every batch. "No further leak path exists" is not a statement any author
      can support, and the gate found two the previous author had missed.
      (ii) THE LISTS DRIFT, SILENTLY AND DEMONSTRABLY. AO-3
      (DEC-20260907-4e34c5 `archive_time_observations`) records that the two
      blind lists for the SAME re-derivation had already diverged -- the
      handoff's list gained two paths at commit 465c01cba and the contract's
      gained nothing -- so the re-deriver had two answers to one question.
      (iii) IT DEPENDS ON A CONVENTION RECORDED ELSEWHERE. AO-2 records a DIRECT
      CONTRADICTION between the sidecar's `not_blind_from` (which says two paths
      MUST be read) and the handoff's `blind_from` (which added those same two
      paths), resolved only by a convention stated in an archive's decision
      record. A blind discipline a fresh re-deriver cannot obey FROM THE TEXT IT
      IS GIVEN is not a blind discipline, and that is the standard the whole
      re-seal exists to meet.
    the_mechanism_v3_installs:
      name: 'DERIVATION PACKET -- an ALLOWLIST that replaces the denylist as authoritative'
      declared_at: 'v3 `blind_rederivation.v3_derivation_packet` (a new appended sub-key; no frozen field touched)'
      packet_path: experiments/EXP-ECDLP-6ac801/derivation-packet/PA-ECDLP-6ac801-v2-to-v3/
      the_rule_in_one_sentence: >-
        Until its seal exists, the Stage A'' re-deriver reads EXACTLY the files
        enumerated in the packet's own manifest and NOTHING ELSE in this
        repository -- not the contract, not this amendment, not a handoff, not a
        task card, not a queue, not a decision, not a run, not a commit message.
      why_this_is_the_repair_and_not_a_relabelling:
        - >-
          IT IS FINITE, ENUMERATED AND HASHED. The manifest lists every readable
          file with its sha256. Completeness is a property of a closed list of
          four files, not a claim about a repository. "Did I read anything I
          should not have" becomes decidable by the re-deriver itself.
        - >-
          IT IS SELF-CONTAINED. The manifest lives INSIDE the packet and is the
          first file the re-deriver opens, so the discipline is stated in the
          only text the re-deriver is permitted to read. It depends on no
          convention recorded in a decision record -- which is exactly AO-2's
          failure and the sharpest form of the defect.
        - >-
          IT IS PROVABLY LEAK-FREE BY CONSTRUCTION, IN THE ONLY SENSE THAT
          MATTERS. The packet contains no prior, no verdict, no pass-count, no
          margin, no interval and no number produced by any prior run at any
          cell of the quantity under test. It is not asserted clean; it is
          asserted clean AND the assertion is checkable, because the packet is
          four files a gate can read end to end in minutes. See
          `packet_leak_audit` below for the audit and its one disclosed,
          bounded, necessary inclusion.
        - >-
          IT DISSOLVES AO-2 RATHER THAN ADJUDICATING IT. Under an allowlist
          there is no file the re-deriver is both required and forbidden to
          read, because "forbidden" is the complement of a four-item list and
          "required" is that list. The contradiction has no place to live.
        - >-
          IT MAKES ONE LIST AUTHORITATIVE, AS AO-3 ASKS, WITHOUT EDITING A
          FROZEN FIELD. v2's `blind_from` stays byte-identical and is demoted in
          v3 to a CORROBORATING denylist that explicitly defers to the packet;
          any future review plan's `blind_from` does the same. Two lists that
          cannot disagree about anything load-bearing cannot drift into a
          contradiction.
      what_the_packet_contains: >-
        Four files, and the manifest is the contract for all four. (1)
        `MANIFEST.yaml` -- the readable-file list with sha256, the reading rule,
        the seal procedure, and the declaration that the packet carries no prior
        or result. (2) `quantity.md` -- the STATEMENT of the quantity to be
        re-derived and the parameters, quoting v3's `definitions` verbatim:
        the instrument, the DP predicate, the exact-basin partition, the cap and
        its residual accounting, the pool-construction procedure, the selection
        weight and its tie-break, share_top, cov_static, the margin, and the
        seed streams. (3) `deliverables.md` -- what to produce and in what
        shape, with the joints the re-deriver owns stated WITHOUT the
        Coordinator's expectation of how any of them will come out. (4)
        `prohibitions.md` -- the reading rule restated as an operational
        checklist, including the two mechanical prohibitions the denylist got
        right (no `git log`/`git show`/`git blame` and no reading of any commit
        message before the seal) and the honest disclosure that two commit
        messages already reachable on this branch state a prior cell's verdict.
      normativity_of_the_packet_versus_the_contract: >-
        THE CONTRACT GOVERNS. `quantity.md` quotes v3's `definitions` and
        `inputs` verbatim and adds no definitional content of its own. If the
        packet and v3 are ever found to differ on any definitional point, v3
        governs, the packet is defective, and the difference is a REPORTABLE
        DEFECT of this amendment -- not a licence for the re-deriver to choose.
        Verifying that the packet says exactly what v3 says, and nothing more, is
        an explicit joint of v3's approval gate (see `gate_fields_not_set`).
      seal_procedure_unchanged: >-
        The seal itself is the approved v2's `blind_rederivation.procedure`,
        byte-identical and in force: the re-deriver commits its own from-scratch
        computation to its own task directory with a hash and a timestamp, and
        only then opens anything outside the packet. v3 changes WHAT MAY BE READ
        BEFORE THE SEAL, not what a seal is.
    the_prior_is_kept_and_moved_off_the_reading_path:
      why_it_is_kept: >-
        AGENTS.md "Review architecture" REQUIRES the Coordinator's prior to be
        recorded before any reviewer runs, and for a reason this lane should be
        the last to weaken: "three reviewers concurred" and "three reviewers
        concurred with what the Coordinator already believed" are different
        findings, and only a pre-recorded prior separates them. The answer to a
        leaking prior is never to stop recording it.
      where_it_lives: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-48ef8b/priors/coordinator_prior.SEALED.yaml
      properties_of_that_file:
        - 'It is NOT in the derivation packet, so under the allowlist it is unreadable before the seal without an explicit violation.'
        - 'It is named on v3''s corroborating denylist and must be named on every future review plan''s `blind_from` for this experiment, so a denylist-only reader is also warned.'
        - 'It is the ONLY place in BATCH-48ef8b carrying a directional expectation. This lane''s queue, its six task cards, its six handoffs, its opening decision and its commit messages state no prior, no verdict, no margin and no number at any cell of the quantity under test.'
        - 'It is written at lane opening and committed in the opening snapshot, so the commit that carries it is itself proof the prior predates every reviewer -- which is a stronger discharge of the AGENTS.md requirement than a prior recorded in a handoff, not a weaker one.'
      what_it_does_not_contain: >-
        No instruction to any reviewer, no assignment, no authority. It records
        an expectation and nothing else. A reviewer's joints and deliverables
        come from the packet, which is why the packet can be prior-free at all.
    packet_leak_audit:
      method: >-
        Every sentence of the four packet files was read against one question:
        does this tell the re-deriver anything about how any cell of the
        quantity under test has come out, or is expected to come out? Numbers
        that are DEFINITIONS (T, T_sel, r, N, W, cap, the seed set, the bootstrap
        parameters) are admissible and necessary -- a re-deriver cannot compute
        without them, and they are derivable from frozen sources anyway. Numbers
        that are LEVELS OF THE MEASURED QUANTITY (a margin, a pass-count, a
        share, a coverage, an interval endpoint) are not.
      result: 'CLEAN, with exactly one disclosed inclusion, stated below rather than smuggled.'
      the_one_disclosed_inclusion:
        what: >-
          The packet states that T_sel = T/2 at a = 1/4, r = 2, N = 2^24 is
          ESTABLISHED G3-INFEASIBLE by EV-ECDLP-60e266, and that the re-deriver
          must report the a = 1/4 cell FIRST.
        why_it_is_necessary: >-
          a = 1/4 is the KNOWN-FALSE OBJECT of this batch's replication control,
          carried verbatim from the approved v2's control (b). "Controls before
          belief" (docs/inventor-protocol.md) requires the identical measurement
          be run against an object whose answer is known, and a re-deriver who
          is not told which object that is cannot run the control. Removing it
          would buy blindness at the price of the batch's strongest
          artifact detector -- DECAY-A clause (iii) is anchored on the same
          external result and the gate found it carries "essentially the whole
          artifact-detection load".
        why_it_is_bounded: >-
          It concerns a = 1/4 ONLY. The packet states no verdict, expectation,
          pass-count, margin, share, coverage or interval at a = 1/16, a = 1/8
          or a = 3/16 at either N -- and a = 1/8 is the decision-changing cell
          this whole lineage exists to resolve. It is a control anchor, not a
          prior: it says what the instrument must reproduce, not what the open
          cells will do.
        precedent: >-
          The same rule the gate bound itself to (DEC-20260907-4e34c5
          `leak_discipline_on_this_record`): magnitudes appear only as
          differences or as unassigned-mass fractions, never as levels of the
          quantity under test. This amendment and v3 adopt it verbatim, and it
          is why neither carries a margin or a pass-count at any open cell.
      standing_contamination_not_repaired_and_not_hidden: >-
        Two commit messages reachable from this branch (84233e8c3, 376c6660e)
        state the a = 1/16 verdict in plain text. That is a PERMANENT,
        UNREPAIRABLE contamination of any future blind reading at a = 1/16 on
        this branch, exactly as the approved v2 disclosed it. v3 keeps the
        disclosure and makes the consequence BINDING rather than reviewable: see
        `d6_discharge`. The allowlist reduces the exposure -- a re-deriver
        obeying it runs no git history command at all -- but does not eliminate
        it, and nothing in v3 claims it does.

  # =====================================================================
  # 4. D1 -- A VALUE TO STATE, NOT A CONTRADICTION TO REPAIR
  # =====================================================================
  d1_discharge:
    the_defect_as_the_gate_stated_it: >-
      DEC-20260907-4e34c5 `blocking_defects[D1]`: the sidecar draft states
      "T = 102 at N = 2^20" and "T_sel ... 51 at N = 2^20". The arithmetic of its
      stated rule is right -- round(2^20^(1/3)) = 102 -- and the value
      contradicts both governing sources. T fixes T_sel = T/2 and W =
      sqrt(aN/T), hence the DP rate, the cap, the basin partition, the pool size
      r*T, and every quantity read off them.
    why_it_is_cheaper_here: >-
      Against the sidecar D1 is a contradiction to repair; against the APPROVED
      v2 it is A BLANK TO FILL. The approved v2's `definitions.T` reads "nominal
      table size N^{1/3} rounded = 256 at N = 2^24" and states nothing at
      N = 2^20, so v3 contradicts no approved value.
    the_frozen_source:
      path: experiments/EXP-ECDLP-612fb1/specification.v2.yaml
      line: 223
      quoted_verbatim: 'T: nominal table size N^{1/3} rounded, i.e. 64 at 2^20, 256 at 2^24, 1024 at 2^30'
      corroborated_by:
        path: experiments/EXP-ECDLP-612fb1/source_v2/instrument.py
        line: 29
        verbatim: 'T_OF_NBITS = {20: 64, 24: 256, 30: 1024}      # T = N^{1/3} rounded, as frozen'
        note: >-
          The commit-pinned production instrument has NO CODE PATH TO 102: T is
          a dictionary lookup keyed on n_bits (line 74,
          `self.T = T_OF_NBITS[self.n_bits]`), with no fallback and no
          round(N**(1/3)) expression anywhere in the file. At 2^24 and 2^30 the
          frozen table and round(N^{1/3}) coincide; 2^20 is the one scale where
          they diverge, and 2^20 is the scale v3 adds.
    what_v3_states: >-
      T = 64 and T_sel = T/2 = 32 at N = 2^20; T = 256 and T_sel = T/2 = 128 at
      N = 2^24 (the approved v2's values, unchanged). The DECAY-TSEL control
      additionally reads T/4 and T/8, which at N = 2^20 are 16 and 8 and at
      N = 2^24 are 64 and 32. W and cap follow from the single formula in
      `d2_discharge.cap_convention` and are tabulated at all eight cells in v3
      `definitions.W_and_cap_table_v3`, so no reader has to recompute them to
      check a manifest.
    the_second_scale_is_optional_and_that_is_recorded: >-
      DEC-20260907-9b1b02 RANK 1 never asked for a second scale, and
      DEC-20260907-4e34c5 RANK 2 offers dropping the N = 2^20 arm as a complete
      discharge of D1. v3 RETAINS it, for one stated reason: the N = 2^20 arm is
      roughly 16x cheaper, runs first, and shakes the pipeline out before the
      expensive scale, and it is the scale at which the original Stage 0
      discrepancy was found -- so a cross-scale read is the cheapest available
      check on whether the crossing bracket is N-dependent at all. If a gate
      judges the added scope not worth its added surface, dropping the N = 2^20
      arm discharges D1 by deletion and costs the rest of v3 nothing; v3 is
      written so that every N = 2^20 field is separable.

  # =====================================================================
  # 5. D4 -- D7, FOLDED INTO THIS VERSION
  # =====================================================================
  d4_discharge:
    defect: >-
      "ties broken by ASCENDING pool key" does not say what the key is. A
      re-deriver would most naturally use the DP value. The convention is
      load-bearing in the committed data: the gate found a tie AT the T-th
      largest weight in all 20 committed cells, split by the tie-break in 16 of
      them.
    option_taken: >-
      OPTION 1 of the gate's required change: NAME THE PRODUCTION CONVENTION
      EXACTLY, and declare that the two readings' key streams necessarily
      differ. Option 2 (specify a reading-independent rule, ascending DP value)
      is REJECTED here, with its reason recorded: the committed v1 cells were
      produced under the pseudorandom key, so adopting a reading-independent
      rule would make control (h)'s reproduction target unreachable at its
      tolerance and would trade a discharged defect for a broken control.
    the_production_convention_read_off_the_code:
      selection_call:
        path: experiments/EXP-ECDLP-6ac801/source/run_stageb.py
        line: 96
        verbatim: 'order = I.numpy_select(w, keys, T)'
      ordering:
        path: experiments/EXP-ECDLP-612fb1/source_v2/instrument.py
        lines: '359-363'
        verbatim: 'def numpy_select(weights, keys, t): order = np.lexsort((keys, -weights)); return order[:t].tolist()'
        meaning: >-
          `np.lexsort` sorts by its LAST key first, so the primary key is
          -weights (weight DESCENDING) and the secondary key is `keys`
          (ASCENDING). The first t indices are selected.
      the_key_stream:
        path: experiments/EXP-ECDLP-6ac801/source/run_stageb.py
        lines: '93-95'
        verbatim: 'keys = np.random.default_rng(P.seed_tiebreak).integers(0, 1 << 63, size=len(snap.dps), dtype=np.int64)'
        seed: 'P.seed_tiebreak = 400 + seed (instrument.py line 91: `self.seed_tiebreak = 400 + self.seed`)'
        binding: >-
          The i-th drawn value is bound to POOL INDEX i, and pool index i is the
          order in which `generate_pools` first discovered that DP
          (instrument.py lines 272-277: a new terminal DP appends to `dps`, `S`
          and `h`). So the key is a per-entry pseudorandom 63-bit integer in
          POOL-INSERTION ORDER, drawn as one bulk array from a fresh
          `numpy.random.default_rng(400 + seed)` -- NOT the DP value, NOT the
          pool index itself, and NOT derived from the weight.
    consequence_declared_rather_than_assumed_away: >-
      A blind re-deriver reimplementing the instrument from v3's text will
      generate pool entries in its own insertion order and its own key stream,
      so ITS tie-broken selection at the T-th weight may legitimately differ
      from production's. v3 declares this, requires both readings to report the
      number of entries tied at the T-th largest weight and the size of the
      symmetric difference of the two Sel_static sets, and -- per `d5_discharge`
      -- judges blind-versus-production agreement on the pass-count and the sign
      of the mean margin, which is exactly the reading that a tie-break
      difference does not manufacture into a disagreement.
    no_tolerance_is_invented_for_the_blind_reading: >-
      The gate measured a tie-break sensitivity of at most 3.7e-4 absolute
      across the four a-cells of ONE committed seed and reported it at that
      scope. v3 does NOT promote that into a pre-registered tolerance: a
      single-seed measurement is not a distributional bound, and inventing one
      would be exactly the fabrication the program forbids. The
      tie-break-induced difference is instead a MEASURED, REPORTED quantity of
      this batch. Control (h)'s 1e-9 tolerance applies to the PRODUCTION reading
      only, where the key stream is identical by construction and the gate
      independently reproduced all three quantities at all 20 committed cells to
      a worst absolute deviation of 0.000e+00.
  d5_discharge:
    defect: >-
      The sidecar's predicate turns FEASIBLE and INFEASIBLE on the SIGN OF A
      BOOTSTRAP INTERVAL ENDPOINT, but "95% BCa bootstrap ... 10000 resamples
      and RNG seed 20260907" does not determine an implementation: BCa's
      bias-correction and acceleration have variants, and two independent
      implementations cannot produce the same resamples from one integer seed.
      A near-zero cell could then receive different verdicts from the two
      readings for reasons unrelated to the quantity -- the v1 failure mode
      relocated from the weight to the CI.
    option_taken: 'THE GATE''S PREFERRED OPTION: DECOUPLE AGREEMENT FROM THE INTERVAL ENTIRELY.'
    what_v3_does:
      - 'NOTHING LOAD-BEARING DEPENDS ON A BOOTSTRAP. The verdicts G3-FEASIBLE and G3-INFEASIBLE are functions of the PASS-COUNT k alone, an exact integer both readings compute without resampling. Blind-versus-production AGREEMENT is judged on (k, sign of mean margin) alone -- also resampling-free.'
      - 'THE INTERVAL ROUTES, AND ONLY ROUTES. Its single job is to send a cell to the fresh label SU (CONFIRMED UNRESOLVED), which is not a feasibility verdict and supports no hypothesis movement in either direction.'
      - 'A PERCENTILE INTERVAL IS PRIMARY, specified to the exact call so that any reimplementation using the same library reproduces it bit-for-bit, and BCa is reported BESIDE it as context with no rule depending on it.'
      - 'A ROUTING DIFFERENCE BETWEEN THE TWO READINGS IS REPORTED AS INTERVAL-METHOD SENSITIVITY, never as S3 DISAGREEMENT. S3 is reachable only through k or the sign of the mean margin.'
    why_this_is_stronger_than_pinning_the_variant: >-
      Pinning the BCa variant would make the interval reproducible for two
      implementations that share a library and still not for two that do not,
      and it would leave a verdict resting on machinery whose failure mode is
      invisible. Removing the interval from every verdict and every agreement
      test removes the failure mode instead of documenting it. The cost is
      stated: v3 buys no interval-based confidence statement about feasibility,
      and a cell with a wide interval is routed to SU rather than being called
      either way -- which is the honest reading and is why SU exists.
    the_coordinators_own_untested_expectation_on_this_item: >-
      DEC-20260907-38e5ae's review plan recorded an expectation that a reviewer
      would raise the BCa objection, and the lane close records that expectation
      as UNTESTED because the round never opened. The gate reached the same
      conclusion independently as D5. v3 fixes it in the contract so the repair
      no longer depends on a reviewer happening to catch it -- and the
      expectation itself stays recorded, untested, in the sealed prior file,
      never rewritten to match this outcome.
  d6_discharge:
    defect: >-
      The sidecar set a = 1/16's independence to "WEAKENED" and left to a review
      joint whether that is the right word, while itself recording that the
      contamination is undetectable downstream.
    ruling_now_binding_in_the_contract: >-
      ASYMMETRIC AND FIXED, not routed to a review joint. AGREEMENT between the
      two readings at a = 1/16 carries ZERO independence weight from the outset.
      DISAGREEMENT at a = 1/16 retains FULL weight and additionally triggers
      falsification condition F2 and AGENTS.md rule 12 (independent
      review-breakthrough at max effort).
    reasoning: >-
      An agreement produced because the re-deriver was told the answer is, by
      the contract's own account of the contamination, indistinguishable from one
      produced because the answer is right. A weight no observation can revise
      is not a weight, so any nonzero independence credit at that cell is
      unfalsifiable. The converse does not hold and is preserved: a disagreement
      reached DESPITE two commit messages stating the opposite verdict is strong
      evidence, precisely because the contamination pushes the other way. The
      rule costs the batch nothing, because a = 1/16 already has two jobs that
      need no independence -- DECAY-A's low-a endpoint and a cross-scale
      consistency read -- and it replaces an adjective a post-hoc reviewer would
      have had to arbitrate with a stated rule a reviewer can attack.
  d7_discharge:
    defect: >-
      The sidecar claimed NULL-RANDSEL is the real measurement's shape "in every
      respect ... with exactly one substitution". It is two. The real treatment
      arm, share_top(T_sel), ranges over the ENTIRE basin partition; the null's
      arm ranges only over the r*T = 512-entry pool. So the null changes the
      selection rule AND the universe, and its guaranteed negativity is bought
      largely by the universe change and the size ratio rather than by the
      weight carrying information. The gate recomputed it on the committed cells
      and found it one to two orders of magnitude beyond its own declared firing
      threshold at every cell -- almost no discriminating power against the claim
      actually under test.
    what_v3_does:
      - 'ADDS (i) NULL-ORACLE-RAND, a null of the REAL measurement''s shape: the ORACLE side -- top-T_sel basins by true size over the whole exact partition -- is replaced by a uniformly random T_sel-subset of DPs drawn over the SAME universe (all DPs of the same enumerated partition), with cov_static held fixed and read off identically. ONE substitution, same universe, same read-off, same predicate. This is the gating null.'
      - 'KEEPS (j) NULL-RANDSEL as an estimator check with its low power DISCLOSED in the contract, exactly as the gate recommended, and demotes it from gating to reported.'
      - 'ADDS the size-biased variant of NULL-ORACLE-RAND as a DIAGNOSTIC ONLY, with its direction declared UNPREDICTABLE in advance and no verdict depending on it -- because a subset drawn with probability proportional to basin size is deliberately competitive with the oracle and the contract cannot honestly pre-register which way it falls.'
    why_the_uniform_variant_is_known_false_by_argument_and_not_by_data: >-
      cov_static is the exact coverage of T = 2*T_sel pool entries selected by
      weight_d = S_d + 4*W*h_d. Both factors of that weight are increasing in
      basin size for a structural reason: a DP with a larger basin is reached by
      MORE uniform-restart pool walks (larger h_d) and the walks reaching it are
      drawn from a larger set of start points (larger S_d). The pool itself
      over-samples large basins for the same reason, since a DP enters the pool
      only when some restart walk reaches it. A UNIFORMLY random T_sel-subset of
      all DPs has, by construction, no correlation with basin size at all: its
      expected mass is T_sel times the MEAN basin mass over a DP set of size
      order N/W, the overwhelming majority of whose basins are small. So
      NULL-ORACLE-RAND's arm is an unbiased draw from a distribution whose mean
      is far below the mass of a size-correlated selection of twice as many
      entries, and margin_null must be negative. No committed number is used in
      this argument and none is asserted by it.

  # =====================================================================
  # 6. THE WIDE SCOPE CARRIED FORWARD
  # =====================================================================
  wide_scope_carried:
    seeds: >-
      25 pre-registered seeds per (N, a) cell, seeds 1..25, the identical seed
      set on both readings and in every control arm, fixed in the contract
      before execution. Seeds 1..5 are pinned as the subgroup serving control
      (h) and the v1-comparable subgroup reading. Carried under CR-1 COND-4 via
      the appended control (g); control (e)'s text untouched.
    interval_estimation: >-
      Percentile bootstrap, primary, specified to the exact call
      (B = 10000 resamples, the declared RNG construction, the declared quantile
      method); BCa reported beside it as context only. Its ONLY role is routing
      a cell to the fresh label SU. See `d5_discharge`.
    fresh_label: 'SU (CONFIRMED UNRESOLVED). S1, S2 and S3 keep the approved v2''s meanings verbatim; no OUTCOME of v3 is labelled S4.'
    externally_anchored_decay_control: >-
      (k) DECAY-A, whose clause (iii) is anchored OUTSIDE this batch on
      EV-ECDLP-60e266's independently established a = 1/4 infeasibility. The
      gate's own control-falsifiability check called DECAY-A "the strongest
      control in the batch" and clause (iii) "the only clause anchored OUTSIDE
      this batch", carrying "essentially the whole artifact-detection load". v3
      restates its binding clauses in pass-count and sign form so no clause
      depends on a bootstrap (D5).
    cross_scale_reproduction_control: >-
      (h), at N = 2^24, seeds 1..5, against the committed v1 cells. SEE
      `contradictions_in_the_committed_record` ITEM 1: the reproduction control
      CANNOT be anchored at N = 2^20, because this experiment has no committed
      cell there. v3 additionally reads a CROSS-SCALE CONSISTENCY comparison at
      N = 2^20 and declares it explicitly NOT a control -- it has no reference
      to pass or fail against.
    budget: >-
      maximum_runs raised 8 -> 30 and total_cpu_hours 1 -> 6, both
      `enforcement: advisory` and revisable upward without further approval under
      CLAUDE.md "Research budgets: progress first". maximum_memory_gb stays 8 and
      maximum_workers stays 1: those are MACHINE PROTECTION, not research budget,
      and v3 does not raise them.

  # =====================================================================
  # 7. CONTROL FALSIFIABILITY -- EVERY DECLARED CONTROL, AND THE STATE OF
  #    THE WORLD IN WHICH IT FIRES ON A CORRECT IMPLEMENTATION
  # =====================================================================
  control_falsifiability:
    method: >-
      docs/inventor-protocol.md "controls before belief", applied to each
      declared item with the question the gate used: does a state of the world
      exist in which this fires on a CORRECT implementation? An item for which
      the answer is no is not a control, and v3 labels it a STRUCTURAL
      SELF-CHECK rather than carrying it as one. The gate before this one
      removed a DECAY-TSEL clause that held by arithmetic on every correct
      implementation; the two clauses below that are arithmetic are named as
      such rather than reintroduced.
    items:
      - id: '(a) BLIND RE-DERIVATION'
        kind: control
        fires_when: 'No sealed Stage A'''' artifact predating the re-deriver''s first read outside the derivation packet exists when a verdict is reported.'
        failing_world: 'A run set is completed and interpreted with no seal, or with a seal whose timestamp postdates a packet-external read. Both are reachable on a correct implementation -- they are procedural, not arithmetic -- and v1''s own history contains the near miss that motivated the control.'
      - id: '(b) a = 1/4 REPLICATION CONTROL'
        kind: control
        fires_when: 'The a = 1/4 cell scores G3-FEASIBLE (k >= 20 of 25), or is routed to SU, at N = 2^24.'
        failing_world: 'The instrument has changed in a way that makes a known-INFEASIBLE cell pass: a changed seed policy, a changed definition, a cap or partition defect, or a coverage read-off over the wrong universe. Nothing in the code or in arithmetic forces the a = 1/4 margin negative -- it is an empirical fact about the basin-size distribution at that a, established independently in EV-ECDLP-60e266 -- so this control can fail.'
      - id: '(c) EXACT-COVERAGE NON-EXCEEDANCE'
        kind: structural self-check
        fires_when: 'share_top(T_sel) > 1.0, or share_top(T_sel) > share_top(T) for T > T_sel, or cov_static > share_top(T).'
        failing_world: 'IMPOSSIBLE ON A CORRECT IMPLEMENTATION and declared so. share_top is a prefix sum of a descending sort of non-negative basin sizes divided by N, and Sel_static is a set of T DPs whose exact coverage cannot exceed the T largest basins. It fires only on a defect. Carried verbatim from the approved v2, relabelled here as the self-check it is, exactly as v3 relabels item (n).'
      - id: '(d) DEFINITIONAL IDENTITY WITH THE v2 G3 RULE'
        kind: control
        fires_when: 'The rule Stage B'''' applies is not the rule v3''s `definitions` state, found by a reviewer reading the production source against the contract text rather than trusting a citation.'
        failing_world: 'A drift between contract and implementation. This is not hypothetical for this experiment: D1 and D2 were BOTH found by exactly this comparison, against a contract that asserted the citation was accurate. It fires whenever the code and the text disagree, and it has fired before.'
      - id: '(e) SEED-COUNT PARITY'
        kind: control
        fires_when: 'Fewer seeds are run per (N, a) than the contract pins, or the seed set differs between readings or between arms.'
        failing_world: 'A truncated batch, a partially failed shard silently dropped, or a control arm run on a different seed set from the treatment arm. Reachable on a correct implementation of the measurement, since it is a property of the execution plan rather than the arithmetic. Carried verbatim from the approved v2; text untouched.'
      - id: '(f) SELECTION-FORMULA IDENTITY'
        kind: control
        fires_when: 'A re-seal applies a third reading of "the published Bernstein-Lange weight" instead of the stated formula weight_d = S_d + 4*W*h_d.'
        failing_world: 'Exactly the world v1 was in: the re-deriver chooses an oracle true-size selection, or any other defensible-but-different rule. TF-1 established that the stated formula IS what production computes at the 20 committed cells, so a divergence is attributable rather than ambiguous. Carried verbatim from the approved v2.'
      - id: '(g) SEED-COUNT PARITY EXTENSION'
        kind: control
        fires_when: 'The 25-seed reading and the seeds 1..5 subgroup reading are composited into one number anywhere, or the subgroup reading is omitted, or fewer than 25 seeds are run at a cell whose verdict is reported.'
        failing_world: 'An analysis that reports only the 25-seed reading, breaking direct comparability with v1''s committed cells; or one that averages the two. Both are ordinary analysis mistakes on a correct measurement, which is what makes this a control rather than an identity.'
      - id: '(h) CROSS-SCALE REPRODUCTION CONTROL'
        kind: control
        fires_when: 'At N = 2^24, seeds 1..5, any production share_top(T_sel), cov_static or margin differs from the committed value in the corresponding RUN-ECDLP-6ac801-001..005 summary.json by more than 1e-9 absolute.'
        failing_world: 'The new pipeline is not the old pipeline: a changed import, a changed seed stream, a changed cap, a changed pool-generation batch size, a changed tie-break key. The target is known ACHIEVABLE -- the gate reproduced all three quantities at all 20 committed cells to a worst absolute deviation of 0.000e+00 from the pinned instrument -- so a nonzero residual is a real signal and not a tolerance artifact. It does NOT re-score the committed runs: they are the reference, never the subject.'
      - id: '(i) NULL-ORACLE-RAND (uniform) -- THE GATING NULL OBJECT'
        kind: 'control (null object, conclusion KNOWN FALSE)'
        fires_when: 'margin_null(s) >= 0 in more than 1 of the 25 seeds at any (N, a) cell, or the reported mean margin_null is non-negative at any cell.'
        failing_world: 'The pipeline is producing "feasibility" from something other than top-basin structure. Concretely: cov_static computed over the wrong universe; a "uniform" draw that is in fact size- or weight-biased; a coverage read-off that double-counts a DP; or the weight ceasing to track basin size at that a. Nothing in the code or in arithmetic forces margin_null negative -- the argument for its negativity is structural (see `d7_discharge`) and structural arguments can be wrong -- so this control can fail, and unlike NULL-RANDSEL it is shape-matched to the real measurement, so failing it indicts the real measurement.'
      - id: '(j) NULL-RANDSEL'
        kind: 'control, retained, NON-GATING, low power DISCLOSED'
        fires_when: 'margin_null_pool(s) >= 0 in more than 1 of the 25 seeds at any cell.'
        failing_world: 'A gross defect only. The gate recomputed this quantity on the committed cells and found it one to two orders of magnitude beyond its own threshold at every cell, because its arm ranges over the 512-entry pool while the real arm ranges over the whole partition (D7). So it CAN fire, but on nothing short of a gross defect. Retained as a check on the weight estimator, demoted from gating, and its power stated in the contract rather than left for a reviewer to discover.'
      - id: '(k) DECAY-A -- THE DECLARED DECAY CONTROL'
        kind: 'control (declared decay parameter: a)'
        fires_when: 'CLAUSE (i): mean margin is not strictly decreasing across a = 1/16, 1/8, 3/16, 1/4 at either N -- a single non-monotone step fires it. CLAUSE (iii): mean margin at a = 1/4 is >= 0, or the a = 1/4 pass-count k exceeds 5 of 25.'
        failing_world: 'The canonical artifact tell of docs/inventor-protocol.md -- a quantity that fails to decay when the parameter meant to destroy it increases. Clause (i) is not forced by any identity: each a is a DIFFERENT instrument, with its own W, DP rate, cap and basin partition, so no arithmetic relates the four means. Clause (iii) is anchored OUTSIDE this batch on EV-ECDLP-60e266, so a self-consistent but wrong implementation does not pass it automatically -- which is what makes DECAY-A the batch''s load-bearing artifact detector. Clause (ii), the paired difference, is reported with its interval as CONTEXT and binds nothing, per `d5_discharge`.'
      - id: '(l) DECAY-TSEL -- SECOND DECAY CONTROL, TAUTOLOGICAL PART EXCLUDED'
        kind: 'control, weaker than (k), weakness DISCLOSED'
        fires_when: 'CLAUSE (i): margin(s) >= 0 at T_sel = T/8 in more than 1 of the 25 seeds at any a. CLAUSE (ii): rho_ORACLE is not non-decreasing in a.'
        failing_world: 'CLAUSE (i) fires if a T/8-entry oracle table already matches STATIC(T)''s coverage -- i.e. the comparison is not measuring stored-advice efficiency at all but is an everything-passes artifact. I RE-CHECKED THIS CLAUSE AGAINST THE CODE RATHER THAN CARRYING IT ON TRUST: cov_static is a function of the T weight-selected pool entries and is independent of T_sel (run_stageb.py line 96 selects T, never T_sel), and share_top(T/8) is a strict prefix of share_top(T/2); nothing in either expression forces share_top(T/8) < cov_static, so the clause is NOT an identity and can fail. Its POWER is nevertheless low and that is disclosed: the gate found it comfortably satisfied on every committed cell. CLAUSE (ii) is not forced by arithmetic either, but on the read grid {1/8, 1/4, 1/2} rho_ORACLE can take only a few values, so it is effectively a coarse ordering check on the same directional claim (k) makes -- disclosed, not hidden. THE CLAUSE THE PREVIOUS GATE REMOVED IS NOT REINTRODUCED: margin(T/2) > margin(T/4) > margin(T/8) holds by arithmetic on every correct implementation, and appears in v3 only as part of item (n), labelled a structural self-check.'
      - id: '(m) NULL-SHUF'
        kind: 'diagnostic, explicitly NOT a G3 null'
        fires_when: 'Nothing gates on it. Reported only.'
        failing_world: 'DECLARED UNUSABLE AS A NULL, in the contract, rather than dropped. Permuting basin sizes across the pool''s DPs while holding the size multiset and the weights fixed makes cov_static COLLAPSE, which makes G3 pass MORE easily -- the wrong direction for a feasibility null. Carrying it as a null would be carrying a control that fires in the direction of the claim, which is worse than having none. It is retained because the collapse itself is informative about whether weight_d carries information, and it is fenced off from every verdict.'
      - id: '(n) BASIN-MASS ACCOUNTING'
        kind: structural self-check
        fires_when: 'sum_d b(d) + cycle_mass + capped_mass != N exactly, in integer arithmetic, at any cell of either reading; or b(d) = 0 for some DP d; or the two readings'' residual fractions differ by more than the difference their two independently generated instruments can produce.'
        failing_world: 'IMPOSSIBLE ON A CORRECT IMPLEMENTATION and declared so: the three classes are disjoint and exhaustive over the N points by construction. It fires exactly when a reading implements no cap, or assigns residual mass to a basin, or double-counts -- which is D2''s failure mode and the reason the check exists. It is NOT offered as a control and its passing means nothing beyond "no defect of this kind"; calling it a control would repeat the vacuity the previous gate correctly removed from DECAY-TSEL.'
    summary: >-
      Eleven items are controls with a reachable failing world; three are
      structural self-checks and are labelled as such, not as controls; one is a
      diagnostic explicitly fenced off from every verdict. The power gradient is
      stated in the contract rather than left to a reviewer to discover:
      DECAY-A clause (iii) is the only externally anchored clause and carries
      most of the artifact-detection load, NULL-ORACLE-RAND is the shape-matched
      gating null that D7 asked for, and NULL-RANDSEL and DECAY-TSEL are
      corroboration with disclosed low power.

