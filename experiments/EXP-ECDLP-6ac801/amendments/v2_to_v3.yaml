        THE RECORD WINS: there are no committed v1 cells of EXP-ECDLP-6ac801 at
        N = 2^20. The approved v2 fixes N in five places ("fixed at 2^24 =
        16777216", "N: fixed, 2^24", "N = 2^24 only", "restricted to N = 2^24",
        "N = 2^24; ...; 5 seeds"), run_stageb.py hard-codes `N_BITS = 24` at line
        53, and RUN-ECDLP-6ac801-001..006 are all at N = 2^24. The refused
        sidecar's own control (f) likewise anchors at N = 2^24, seeds 1..5, and
        CR-1 COND-3 pins "seeds 1..5 as the subgroup serving the reproduction
        control" without moving the scale.
      how_v3_handles_it: >-
        Control (h) is anchored where a reference exists: N = 2^24, seeds 1..5,
        against RUN-ECDLP-6ac801-001..005. "Cross-scale" is satisfied by v3
        spanning two scales with the reproduction anchor at the scale that has
        committed cells. At N = 2^20, v3 reads a CROSS-SCALE CONSISTENCY
        comparison and declares it explicitly NOT A CONTROL, because it has
        nothing to pass or fail against. Inventing a reference at N = 2^20 would
        have been a fabrication; silently relocating the control to N = 2^24
        without saying so would have been worse.
    - id: CONTRA-2
