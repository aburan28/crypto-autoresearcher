    - "r stays 2; T_sel's primary value stays T/2; no online RESEL-L arm is added (that remains DEC-20260907-9b1b02 RANK 2, a separate contract)"

  budget_shape: >-
    Same field shape as v1's block (enforcement, wall_clock_seconds_per_run,
    total_cpu_hours, maximum_memory_gb, maximum_runs, maximum_workers,
    budget_note), resized for 25 seeds x 4 a-values x 2 scales x the control
    arms. Advisory only per CLAUDE.md "Research budgets: progress first" and
    docs/research-budget-policy.md; these estimates are not a gate on approving
    this amendment and require no repeated user approval to revise upward. The
    worked sizing is in specification.v2.yaml `budget`/`budget_note`; the
    measured anchor it extrapolates from is the validator's own recorded
    65.3 s wall clock for a full 4-a x 5-seed sealed pass at N = 2^24
    (validation_report.yaml `reviewer_resource_accounting`), which is the only
    measured timing this contract has for the corrected-definition work.

  binding: >-
    NO RUN under EXP-ECDLP-6ac801 v2 is authorized by this record. Mirroring
    v1's own approval path exactly (v1 `approval_note`: approved as frozen on
    the user's recorded AskUserQuestion answer, then recorded by a committed
    Coordinator decision) and PA-ECDLP-612fb1-v1-to-v2's `binding`: this
    amendment must be confirmed and then recorded APPROVED by a committed
    Coordinator decision -- setting specification.v2.yaml's `status: approved`,
    `approved_by: coordinator`, `frozen: true`, `execution_authorized: true` --
    before any executor may run. Until that happens, v1 remains the only
    executable contract for this experiment identifier and v2 is a proposal.
    BATCH-e9fd22's dispatch queue reflects this: TASK-20260907-f65c6e is the
    approval gate and TASK-20260907-e423d5 (the executor) depends on the ledger
    archive of that approval.

  judgment_calls: # stated, never guessed silently
    - >-
      SEED COUNT (item c). DEC-20260907-9b1b02's RANK 1 does not name a seed
      count; it names only the re-seal. 25 seeds (1-5 retained + 6-25 fresh) is
      this record's choice, made to (i) keep the exact v1 subgroup intact and
      separately reportable, (ii) roughly match the 30-seed supplementary sample
      the validator itself found necessary to settle a near-boundary cell, and
      (iii) stay inside a cheap exact-basin budget. A coarser or finer count is
      defensible; the number is fixed HERE, before execution, so it cannot be
      chosen after seeing margins.
    - >-
      ADDING THE INTERVAL/UNRESOLVED OUTCOME (item c). v1's rule is a bare
      pass-count, which forces every cell to FEASIBLE or INFEASIBLE even when
      the margins straddle zero -- which is exactly what happened at a = 1/8 and
      is arguably part of why a definitional artifact could masquerade as a
      substantive disagreement. v2 adds a bootstrap CI and a third permitted
      verdict, G3-UNRESOLVED. This makes the contract HARDER to satisfy, not
      easier, and a cell landing UNRESOLVED is an honest reportable outcome and
      not a contract failure. Disclosed because it is a real change of the
      decision rule, not a clarification.
    - >-
      THE NULL OBJECT (item d). "A null object of the same shape whose
      G3-feasibility must fail" admits several constructions. NULL-RANDSEL (a
      uniformly random T_sel-subset of the SAME pool, scored by the SAME
      coverage procedure) was chosen because its conclusion is known false by a
      one-line argument rather than by appeal to prior data: a random half-size
      subset of the pool cannot match a weight-selected subset of twice the size
      drawn from the same pool, when the weight is positively correlated with
      basin size. Two alternatives were considered and are recorded rather than
      silently dropped. (1) A shuffled size-to-DP assignment (NULL-SHUF) is a
      good null for the claim "the weight is informative" but makes G3 pass
      TRIVIALLY, i.e. it fires in the wrong direction for this predicate; it is
      therefore retained as a DIAGNOSTIC collapse check on the estimator, not as
      the G3 null. (2) T_sel = T is degenerate (the oracle top-T share dominates
      any T-subset of the same partition by construction, so G3 is trivially
      true) and is not used.
    - >-
      THE DECAY PARAMETER (item d). `a` is the declared decay parameter because
      the entire claim is that feasibility exists at small a and dies as a
      grows, and because its death at a = 1/4 is independently established
      (EV-ECDLP-60e266, 10/10 FAIL) rather than being read off this batch. That
      makes DECAY-A a control with an external anchor, which is stronger than a
      purely internal monotonicity check. T_sel/T is added as a second decay
      parameter because it is nearly free (prefix sums over the same enumerated
      basin sizes) and because it probes a different axis of the same
      comparison.
    - >-
      NOT RE-RUNNING STAGE B/C AT THE ORIGINAL 5 SEEDS ONLY. DEC-20260907-9b1b02
      states production "does not need to be re-run, since it already implements
      the corrected formula", and that is correct for the 5 committed seeds. v2
      nevertheless re-runs those 5 seeds as an explicit reproduction control
      alongside the 20 new ones, because the new production code is new code and
      a fresh pipeline that cannot reproduce the committed cells is a defect the
      batch must catch before anything else is read. This is ADDITIVE caution,
      not a re-scoring of the committed runs, which stand exactly as executed.
    - >-
      BLIND-HISTORY CONTAMINATION IS ALREADY PARTIAL AND CANNOT BE UNDONE. Two
      commit messages reachable from this branch state the a = 1/16 verdict in
      plain text ("a=1/16 confirmed G3-feasible", 84233e8c3 and 376c6660e).
      Reverting is impossible and would be wrong (the archives are immutable and
      correct). Per CORR-20260905-547849 and
      tools/check_review_independence.py's --blind-history check, this means
      Stage A''s independence claim at a = 1/16 is WEAKER than at the other
      cells, whatever the re-deriver does, because a routine `git log --oneline`
      displays the answer. v2 handles this by (i) instructing the re-deriver not
      to run git history commands, (ii) declaring the condition in the review
      plan rather than hiding it, and (iii) SCOPING the strength of the re-seal:
      a = 1/8 and a = 3/16 (whose verdicts appear in no commit message) carry
      the full independence claim; a = 1/16 is reported with this contamination
      disclosed beside it. This is a real, permanent limitation of this lane and
      is recorded as one, not engineered around.
    - >-
      THIS AMENDMENT'S HOME. DEC-20260907-9b1b02 RANK 1 permits either "a
      versioned protocol_amendment to EXP-ECDLP-6ac801" or "a fresh standalone
      follow-up contract citing this one". The amendment form was chosen because
      the defect is a single underspecified sentence in an otherwise sound
      frozen contract whose other twelve cells resolved cleanly; a fresh
      contract would duplicate all of it to fix one definition, and would make
      the a = 1/8 result harder rather than easier to compare against the cells
      it must be compared against.

  reason: >-
    EXP-ECDLP-6ac801 (BATCH-3c7493) resolved three of its four cells cleanly and
    left one, a = 1/8, in state S3 DISAGREEMENT: the sealed blind re-derivation
    read 1 of 5 seeds feasible, production read 5 of 5. DEC-20260907-9b1b02
    recorded that disagreement as GENUINELY OPEN and explicitly refused to
    relabel it in either direction, because the validator's root-cause
    diagnostic -- though it isolates the cause convincingly, and though the
    Coordinator's own reading is that the diagnosis looks correct -- is a
    post-hoc, non-blind computation, and accepting one in place of a sealed
    blind re-derivation would dissolve the exact discipline the v1 contract was
    written to impose. The cause is not a bug in either implementation. It is
    that v1's own `definitions.STATIC(T)_r exact coverage` names "the published
    Bernstein-Lange weight" without stating it, so a from-scratch re-deriver
    working from the contract and HEUR-BLT-1 alone cannot recover the formula
    and must invent one; Stage A invented an oracle true-size rule, production
    uses the realistic estimator S_d + 4*W*h_d, and on the same pool the oracle
    rule systematically raises STATIC(T)_r's coverage and therefore
    systematically lowers the margin. This amendment fixes exactly that
    sentence, additively, and specifies the fresh seal, sample size, controls
    and scales under which a = 1/8 can be resolved rather than re-argued. It
    claims nothing about the answer: a = 1/8 may come back FEASIBLE, INFEASIBLE,
    UNRESOLVED, or in a new disagreement, and all four are reportable outcomes
    of the contract as written.

  claim_boundaries:
    - "Maximum claim tier remains toy on this amendment; no exponent moves and none is claimed."
    - "This amendment repairs one toy experiment's protocol. It is not an ECDLP result, not a closure, not an impossibility result, and not evidence about any (N, a, r, k, walk, solver) outside the amended grid."
    - "No hypothesis status, evidence record, or decision record is created or changed by this amendment. H-ECDLP-37dc01 remains `analyzed`; EV-ECDLP-2e9680's a = 1/16 CONFIRMED FEASIBLE and a = 3/16 / a = 1/4 CONFIRMED INFEASIBLE findings stand exactly as recorded and are not reopened by this record."
    - "This amendment does not itself authorize any run; see `binding`."
    - "v1's six executed runs stand as executed and are NOT re-scored by this record or by any future v2 run."
    - "Nothing in this record asserts what the re-seal will find. The post-seal diagnostic reported in TASK-20260907-80e198's validation_report.yaml is DIAGNOSTIC ONLY and is deliberately NOT restated as a prediction here; specification.v2.yaml's `preregistered_prediction` states the Coordinator's expectation separately and marks it unverified."

