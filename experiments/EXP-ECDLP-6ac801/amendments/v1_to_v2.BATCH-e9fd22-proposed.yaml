protocol_amendment:
  id: PA-ECDLP-6ac801-v1-to-v2
  id_allocation_provenance: >-
    Amendment records are NOT in tools/allocate_id.py's identifier space (its
    --next choices are batch, coordinator_decision, correction, evidence,
    experiment, goal, handoff, hypothesis, idea, research_question; there is no
    amendment type). This id follows the deterministic, collision-free label
    already used by experiments/EXP-ECDLP-612fb1/amendments/v1_to_v2.yaml
    (PA-ECDLP-612fb1-v1-to-v2), EXP-STR-004 and EXP-IC-002: one experiment has
    at most one v1-to-v2 amendment, so experiment id plus version pair is unique
    by construction. No allocator call was made or is needed for this record.
  experiment_id: EXP-ECDLP-6ac801
  version_from: 1
  version_to: 2
  authoring_task: TASK-20260907-d47b50
  amended_at: '2026-09-07'
  goal_id: GOAL-ECDLP-bbc21f
  goal_id_note: >-
    EXP-ECDLP-6ac801 and H-ECDLP-37dc01 both carry `goal_id: null` and this
    amendment does NOT change that. GOAL-ECDLP-bbc21f is named here only because
    this amendment is authored inside that goal's lane BATCH-e9fd22
    (coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/), which is the
    operational home of the work. No GOAL binding is created on either record.

  triggering_decision:
    id: DEC-20260907-9b1b02
    decision_verb: support
    hypothesis_id: H-ECDLP-37dc01
    evidence_id: EV-ECDLP-2e9680
    batch_id: BATCH-3c7493
    authoritative_field: >-
      next_actions RANK 1, quoted verbatim in `decision_text_quoted` under
      `discharges` item (a) below. That text is the ONLY authoritative
      specification of what this amendment must contain; nothing here
      substitutes a paraphrase for it.
    supporting_review_report: >-
      coordination/experiments/EXP-ECDLP-6ac801/batches/BATCH-3c7493/tasks/TASK-20260907-80e198/validation_report.yaml,
      block `a_1_8_disagreement_root_cause`, which is where the
      underspecification was diagnosed and where the corrected formula was read
      off the production implementation after the seal.
    contract_outcome_that_triggered_this: >-
      Under the frozen v1 contract, a = 1/16 resolved S1 (CONFIRMED FEASIBLE,
      blind and production agreeing 5/5) and a = 3/16 and a = 1/4 resolved S2
      (CONFIRMED INFEASIBLE). a = 1/8 resolved S3 (DISAGREEMENT) at the literal
      sealed level. The validator root-caused that single disagreement to an
      UNDERSPECIFICATION IN THE FROZEN v1 CONTRACT ITSELF -- v1's
      `definitions.STATIC(T)_r exact coverage` names "the published
      Bernstein-Lange weight" but never states the formula, so an independent
      from-scratch re-deriver working only from the contract text and the
      HEUR-BLT-1 statistical model cannot derive it and must make a defensible
      but arbitrary choice. Stage A chose true exact basin size (oracle);
      production uses S_d + 4*W*h_d (a realistic walk-statistics estimator).
      DEC-20260907-9b1b02 declined to relabel a = 1/8 on a post-hoc diagnostic
      and required this amendment plus a fresh re-seal instead.

  v1_frozen_path: experiments/EXP-ECDLP-6ac801/specification.yaml
  v1_frozen_sha256: dfd4047f467b2faab12f179e6907a11f53d72ca6d1239836c0b162c7369a82b9
  v1_frozen_sha256_provenance: >-
    Computed by this authoring session with `sha256sum
    experiments/EXP-ECDLP-6ac801/specification.yaml` against the committed
    worktree bytes at branch cursor/ecdlp-bbc21f-g3-feasibility-review-276e,
    HEAD 33c9b49a7, clean tree for that path. Unlike the prior amendment in this
    lane, this authoring session HAS a shell and computed the hash itself; it is
    not a reused value. v1's bytes are NOT modified by this amendment -- v1
    remains at its own path, byte-identical, and this amendment adds
    specification.v2.yaml beside it.
  v2_path: experiments/EXP-ECDLP-6ac801/specification.v2.yaml

  additive_guarantee: >-
    This amendment is ADDITIVE ONLY. It creates one new file
    (specification.v2.yaml) and this record. It deletes nothing, rewrites
    nothing, and re-scores nothing. experiments/EXP-ECDLP-6ac801/specification.yaml
    (v1) is preserved byte-for-byte at its own path. The six executed v1 runs
    (RUN-ECDLP-6ac801-001..006) STAND AS EXECUTED and are NEVER re-scored under
    v2, per v1's own `invalidation_rules` ("runs already executed are never
    re-scored"). EV-ECDLP-2e9680, EV-ECDLP-f6b3f5, EV-ECDLP-60e266,
    DEC-20260907-9b1b02 and DEC-20260906-bcc097 are untouched. Stage A's sealed
    artifact from BATCH-3c7493 (sealed_blind_rederivation.json) is NEVER edited;
    the re-seal this amendment requires is a NEW, ADDITIONAL sealed artifact in
    a new task directory.

  discharges: # one entry per element of DEC-20260907-9b1b02 next_actions RANK 1
    - item: a
      title: state the STATIC(T)_r pool-selection weight formula explicitly
      decision_text_quoted: >-
        "RANK 1 (protocol amendment, prerequisite to resolving a = 1/8): author
        a versioned `protocol_amendment` to EXP-ECDLP-6ac801 (or a fresh
        standalone follow-up contract citing this one) that states
        `definitions.STATIC(T)_r exact coverage`'s pool-selection weight formula
        EXPLICITLY -- weight_d = S_d + 4*W*h_d (S_d the summed generating-walk
        length reaching pool entry d, h_d its hit count), exactly as
        experiments/EXP-ECDLP-612fb1/source_v2/instrument.py already implements
        it -- removing the underspecification this batch's Stage A blind
        re-derivation had to fill in with a defensible but different (oracle
        true-size) choice."
      answers: >-
        validation_report.yaml `a_1_8_disagreement_root_cause.finding` and
        `.disposition` (the reviewer's own recommendation, which it explicitly
        declined to act on itself for want of standing).
      v2_change: >-
        specification.v2.yaml `definitions.STATIC(T)_r exact coverage (v2,
        CORRECTED, item a)` states the selection procedure as an explicit
        formula in named measured quantities: weight_d = S_d + 4*W*h_d, ties
        broken by ascending pool key; the T largest-weight DISTINCT pool DPs are
        selected; and only then is coverage read as the sum of the TRUE exact
        basin sizes of the selected entries, divided by N. It also states the
        three things v1 left implicit that a from-scratch re-deriver cannot
        guess: (i) S_d is summed over every pool-construction walk terminating
        at d, charged in full including restarts; (ii) h_d is the count of those
        walks; (iii) distinct pool DPs index distinct basins, so no basin is
        double-counted in the coverage sum. v1's own text is quoted verbatim
        beside it under `superseded_v1_text`, never deleted.
    - item: b
      title: Stage A must be RE-SEALED under the corrected definition
      decision_text_quoted: >-
        "AFTER that amendment is committed, Stage A must be RE-SEALED: a NEW,
        freshly sealed, independent blind re-derivation artifact (never an edit
        of sealed_blind_rederivation.json, per `invalidation_rules` 'runs
        already executed are never re-scored') computed under the corrected
        definition, then re-compared cell by cell against Stage B/C's existing
        production result (which does not need to be re-run, since it already
        implements the corrected formula). Only then may a = 1/8 be reported as
        CONFIRMED FEASIBLE, CONFIRMED INFEASIBLE, or a genuinely new
        disagreement."
      answers: >-
        DEC-20260907-9b1b02 `rationale` bullet 3 (the post-seal diagnostic is
        DIAGNOSED, not RESOLVED; accepting a second post-hoc reading in place of
        a sealed blind re-derivation would undo the v1 contract's own purpose).
      v2_change: >-
        specification.v2.yaml `blind_rederivation` (v2) requires STAGE A' -- a
        fresh seal by an agent that has NOT read BATCH-3c7493's Stage A
        implementation or report. `blind_from` is EXTENDED to name
        coordination/experiments/EXP-ECDLP-6ac801/batches/BATCH-3c7493/tasks/TASK-20260907-80e198/
        (the prior blind implementation, its sealed artifact, and its report),
        TASK-20260907-0a8773/ (the prior execution report), EV-ECDLP-2e9680 and
        DEC-20260907-9b1b02 (both of which state the prior per-cell verdicts) --
        none of which v1's `blind_from` covered, because none of them existed
        when v1 was frozen. Re-using the same reviewer is FORBIDDEN by
        `invalidation_rules` (v2): TASK-20260907-80e198's session has read every
        one of those paths and its blindness for this quantity is spent.
      why_this_is_now_derivable: >-
        The point of item (a) is that after it, the quantity IS derivable from
        the contract text alone. A re-deriver reads specification.v2.yaml (NOT a
        blind_from path -- the contract is the statement it derives from) and
        obtains the selection rule without ever opening an implementation. That
        is precisely what v1 made impossible.
    - item: c
      title: >-
        pre-registered seed extension and interval estimation, so the resolved
        cells are not decided by five near-boundary seeds
      decision_text_quoted: >-
        DEC-20260907-9b1b02 `limitations`: "Single batch: strength `preliminary`
        on EV-ECDLP-2e9680 (see its own `strength_note` for the per-cell
        texture: a = 1/16 near the `replicated` bar on its own, a = 1/8 openly
        unresolved, a = 3/16 and a = 1/4 both confirmed matching prior
        evidence). No second experiment has yet independently reproduced
        a = 1/16's result from a third angle."
      answers: >-
        validation_report.yaml `metric_recomputations`, which records that the
        reviewer's own 30-extra-seed supplementary sample at a = 1/8 (seeds
        101-130, mean -0.0063, sd 0.0076, 5/30 positive under the SIZE-based
        method) was needed to establish that the sealed 5-seed reading was "a
        consistent negative bias under the size-based method, not a 5-seed
        sampling fluke". The same thinness applies to the corrected-definition
        reading, which has never been run beyond 5 seeds.
      v2_change: >-
        specification.v2.yaml fixes the per-seed sample count IN ADVANCE at 25
        seeds per (N, a) cell: seeds 1-5 (the EXACT seeds of the committed v1
        runs, retained as the same-scale REPRODUCTION CONTROL) plus fresh seeds
        6-25. The verdict rule is pre-registered in two forms reported side by
        side and never composited: (i) the LITERAL v1 rule (>= 4 of 5) applied
        to the seeds 1-5 subgroup alone, for exact v1 comparability; (ii) the v2
        rule on all 25 seeds, which adds a bootstrap interval so a cell may
        resolve UNRESOLVED rather than being forced to a verdict by a
        pass-count. See `success_criterion` (v2).
      pre_registration_note: >-
        This is a criterion CHANGE and it is made BEFORE any v2 run exists,
        which is the only time it may be made. It is recorded here, versioned,
        additively, exactly as v1's own `invalidation_rules` require ("Any
        post-hoc change to the a-grid, N, r, T_sel, or the G3-style feasibility
        criterion beyond what THIS versioned contract states: requires a further
        versioned protocol_amendment"). No v1 run is re-scored under it.
    - item: d
      title: >-
        null object and decay controls -- controls before belief, made
        mandatory and pre-registered
      decision_text_quoted: >-
        docs/inventor-protocol.md, "Controls before belief": "Any reported
        signal is an artifact until the identical measurement has been run
        against a null object of the same shape. A quantity that fails to decay
        when the parameter meant to destroy it increases is the canonical
        artifact tell."
      answers: >-
        A gap in v1: v1's controls (a)-(e) are a blindness control, a
        replication control, a non-exceedance structural check, a definitional
        identity check and a seed-parity check. NONE of them is a null object,
        and v1 declares no decay parameter. v1's a = 1/4 replication control is
        the closest thing it has, and it is retained and promoted in v2.
      v2_change: >-
        specification.v2.yaml `controls` adds three mandatory, pre-registered
        controls with stated firing signatures: NULL-RANDSEL (the null object of
        the same shape, G3-feasibility known false by construction), DECAY-A
        (the declared decay parameter is `a`; its increase must destroy the
        signal, anchored on the independently established a = 1/4
        infeasibility), and DECAY-TSEL (a second decay parameter, T_sel/T). It
        also adds NULL-SHUF as a diagnostic collapse check on the weight
        estimator itself. Each is evaluated BEFORE any novel cell is
        interpreted, and each has an `invalidation_rules` entry that voids
        interpretation of the whole batch when it fires the wrong way.
    - item: e
      title: >-
        cross-scale reproduction control at N = 2^20, replacing an
        uncheckable appeal to the original Stage 0 numbers
      decision_text_quoted: >-
        DEC-20260906-bcc097 RANK 1 (carried into the goal head's next_action):
        "ideally at N = 2^24 exact basins with a blind re-derivation", with the
        N = 2^20 Stage 0 a-scan reading as the origin of the lead.
      answers: >-
        v1's `interpretation` bullet 3 correctly refuses to retract the N = 2^20
        numbers, but v1 has no arm that can compare against them under the
        SAME definition: the N = 2^20 Stage 0 cells belong to EXP-ECDLP-612fb1
        and were produced under v2 of THAT contract. Re-scoring them here is
        forbidden.
      v2_change: >-
        specification.v2.yaml adds N = 2^20 as a second, cheap scale of THIS
        contract's own arm (same corrected definition, same 25 seeds, same
        a-grid), run fresh under this contract rather than re-scored from
        another experiment's committed runs. This makes the N-dependence of the
        crossing bracket a MEASURED quantity of this contract instead of an
        inherited assumption, and gives the executor a fast cell to shake out
        the pipeline on before the N = 2^24 cells run.

  not_changed: # every v1 field not listed above is carried into v2 unchanged
    - "id, hypothesis_id, question_id, goal_id, derived_from_decision, derived_from_idea"
