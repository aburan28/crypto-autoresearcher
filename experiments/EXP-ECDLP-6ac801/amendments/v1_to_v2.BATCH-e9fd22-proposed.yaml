  inference_receipt:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_used: false
    resolved_model: >-
      claude-opus-5 (Cursor cloud agent runtime; the model that actually
      answered this session). Recorded beside the requested policy per AGENTS.md
      "Model policy"; no downgrade was accepted and none was needed.
    model_verified: >-
      NOT probe-verified. `python3 -m orchestration.adapter doctor --probe` was
      not run by this session, so the binding between the requested policy and
      the answering model is unverified configuration in the sense of AGENTS.md
      "Model policy". Disclosed rather than asserted.
    runtime: cursor cloud agent, coordinator subagent
    session_capability_disclosure: >-
      This session HAS a shell and git. It computed v1_frozen_sha256 itself, ran
