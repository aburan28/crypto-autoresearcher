gate_outcome:
  id: GATE-EXP-ECDLP-6ac801-v2-to-v3-r2
  gated_contract: experiments/EXP-ECDLP-6ac801/specification.v3.yaml
  gated_amendment: experiments/EXP-ECDLP-6ac801/amendments/v2_to_v3.yaml
  gated_revision: PA-ECDLP-6ac801-v2-to-v3-r2
  gate_task_id: TASK-20260907-6c221a
  decision_ref: DEC-20260907-2c4beb
  recorded_at: '2026-09-07'

  execution_authorized: false
  gate_fields_not_set:
    specification_v3_status: proposed
    specification_v3_approved_by: null
    specification_v3_frozen: false
    specification_v3_execution_authorized: false
    revision_status: revision_required
    consequence: >-
      No run under specification.v3.yaml is evidence, by that contract's own
      first `invalidation_rules` entry (carried from v2) and by its appended
      v3 entry naming this exact gate-outcome record. Executor dispatch
      against v3 stays blocked. No Stage A'' re-deriver may be dispatched
      under the derivation packet until DEFECT A below is fixed, per
      `blind_history_ruling`.

  verdict: revise

  verdict_note: >-
    `revise`, mirroring DEC-20260907-4e34c5's own use of the verb for a
    "sound design, not ready as-is" outcome -- NOT `approve`, NOT `reject`.
    Precedent for this schema and for the meaning of `revise` on this
    experiment identifier is DEC-20260907-4e34c5 `decision_verb_note`: a
    revision loops through a new amendment/gate-outcome cycle and does not
    edit this record in place.

  session_provenance: >-
    This gate-outcome record is composed by a coordinator session that
    authored none of specification.v3.yaml, amendments/v2_to_v3.yaml, the
    v3_r2_addendum, or the derivation-packet files -- the independence
    specification.v3.yaml's own `gate_fields_note` requires ("a coordinator
    session that authored none of these artifacts"). The authoring lane is
    TASK-20260907-b1b54b / BATCH-d7e987 / DEC-20260907-d806f5, which itself
    states explicitly: "A later independent session that is neither this
    session nor TASK-20260907-9c0626 nor TASK-20260907-058c69 must gate the
    revision before any executor runs" (DEC-20260907-d806f5 `context`). This
    session is that later independent session. An independent gate review of
    the underlying artifacts was performed by a separate coordinator session
    and its findings were spot-verified directly against the repository
    (hash/formula checks, file reads at the cited lines) before being
    composed into this record; the four defects below were each independently
    re-confirmed against committed bytes by this composing session, not
    merely transcribed from a summary.

  additivity_check:
    method: >-
      v2's `definitions`, `blind_rederivation` (required/frozen/quantity/
      parameters/procedure/blind_from/comparison_rule/non_negotiable_note/
      v2_rerequirement_a_1_8), `controls` (a)-(f), and `success_criterion`
      were checked against specification.v3.yaml for byte-for-byte identity.
    result: PASS
    fields_verified_unchanged:
      - definitions
      - blind_rederivation (pre-r3 required/frozen/quantity/parameters/procedure/blind_from/comparison_rule/non_negotiable_note/v2_rerequirement_a_1_8 fields)
      - controls (a)-(f)
      - success_criterion
    new_content_appended_not_interleaved:
      - v3_derivation_packet (experiments/EXP-ECDLP-6ac801/derivation-packet/PA-ECDLP-6ac801-v2-to-v3/)
      - v3_rerequirement_stage_a_dprime
      - v3_r2_addendum (BATCH-d7e987 / TASK-20260907-b1b54b)
    budget_fields_note: >-
      `budget.maximum_runs` (8 -> 30) and `budget.total_cpu_hours` (1 -> 6)
      move between v2 and v3, but both are correctly labeled advisory
      research-budget numbers under CLAUDE.md "Research budgets: progress
      first", not machine-protection numbers, and their movement is not a
      leak or an additivity violation.
    no_other_undisclosed_drift_found: >-
      Every other high-risk field checked is confirmed genuinely additive or
      unchanged with disclosed reasons for what did change. No undisclosed
      drift was found beyond the four blocking defects below.

  d1_d2_d3_discharge_status: >-
    SOUND, AND NOT ITSELF A BLOCKING DEFECT. D1 (T at N = 2^20), D2 (cap /
    cycle_mass / capped_mass accounting) and D3 (blind_from leak-path
    completeness), the three blocking defects of the prior v1-to-v2 gate
    (DEC-20260907-4e34c5 `blocking_defects`), are correctly discharged by the
    v2-to-v3 design:
    (i) D2's formula cap(N,a) = ceil(8*W) is CONFIRMED CORRECT against real
    committed data: independently checked against
    experiments/EXP-ECDLP-6ac801/runs/RUN-ECDLP-6ac801-001/summary.json's own
    a=0.125000 cell, W=90.50966799187809, recorded cap=725,
    ceil(8*90.50966799187809)=725 -- exact match, verified directly against
    the committed file, not merely cited. This closes the real, disclosed
    limitation TASK-20260907-2db9aa's own Validator report left unreconciled
    (infinite-horizon exact absorption with no cap, versus production's
    cap=ceil(8*W) leaving DP-free-cycle mass and beyond-cap mass unassigned).
    (ii) D1's T=64 at N=2^20 is a correctly-sourced blank-fill, not a
    contradiction: round(2^20^(1/3)) independently confirmed to compute to
    102 (2^20=1,048,576, cube root approximately 101.6), matching the
    amendment's own concession that this is a NEW value rather than the
    frozen table's, and the frozen source
    (experiments/EXP-ECDLP-612fb1/specification.v2.yaml T_OF_NBITS
    convention: T=64 at 2^20, 256 at 2^24, 1024 at 2^30) is a real, checkable
    citation, with T=256 at N=2^24 matching the committed summary.json.
    (iii) D3's allowlist mechanism (the v3_derivation_packet) is
    architecturally sound: the packet exists at
    experiments/EXP-ECDLP-6ac801/derivation-packet/PA-ECDLP-6ac801-v2-to-v3/
    {MANIFEST.yaml,quantity.md,deliverables.md,prohibitions.md}, all four
    read in full by this composing session, genuinely dissolving the prior
    denylist-based leak defects (AO-2/AO-3 in DEC-20260907-4e34c5
    `archive_time_observations`) the v1-to-v2 refusal named. The underlying
    scientific repair does NOT need to be redesigned; only the four
    disclosure/consistency defects below need fixing.

  blocking_defects:
    - id: A
      severity: most important -- undisclosed leak surface
      location: 'specification.v3.yaml v3_r2_addendum.objective_v3_r2, approximately line 2220-2222'
      quote: >-
        "v3 MAY NOT inherit the premise that a = 1/8 is unresolved. It is
        confirmed ceiling-feasible at N = 2^24 at strength `preliminary`
        (EV-ECDLP-6783b8 / DEC-20260907-8d8782)..."
      independently_confirmed: >-
        Present at that exact location, confirmed by direct read of
        specification.v3.yaml (not merely a grep hit trusted on faith) by
        this composing session.
      defect: >-
        This is a cited, resolved VERDICT for an open cell, sitting in the
        very document PA-ECDLP-6ac801-v2-to-v3's whole apparatus exists to
        keep a re-deriver blind to -- the exact class of defect (D3) this
        amendment exists to repair, now reproduced by the r2 addendum itself.
      why_it_is_architecturally_contained_today: >-
        prohibitions.md section 2 blanket-forbids reading
        `specification.v3.yaml` directly ("Do not read the experiment
        contract. Not specification.yaml, not specification.v2.yaml, not
        specification.v3.yaml..."), so a re-deriver obeying the allowlist
        never sees this leak. Confirmed by direct read of prohibitions.md in
        full.
      why_it_still_blocks: >-
        The contract's own `leak_discipline_on_this_record` block (line
        2138) and the `d3_discharge` block's
        "a = 1/16 INDEPENDENCE RULING" sub-block (approximately line 720,
        header text: "THE STANDING CONTAMINATION, restated because the
        ruling is meaningless without it") -- both written BEFORE the r2
        addendum -- name only the two a = 1/16 commit messages (84233e8c3,
        376c6660e) as the disclosed leak inventory. Neither block was updated
        to disclose the new a = 1/8 leak the r2 addendum introduces. A
        disclosure inventory that omits a known leak is not honest
        disclosure, even one that happens to be contained by an independent
        mechanism (the allowlist).
      required_fix: >-
        (1) Disclose this leak in `leak_discipline_on_this_record` and in the
        d3_discharge standing-contamination block, naming the r2 addendum's
        a = 1/8 citation alongside the two existing a = 1/16 commit-message
        citations; OR (2) move the citation out of the contract body the
        allowlist's completeness claim depends on remaining sound to check
        (e.g. into a decision record cited by reference rather than quoted
        verdict text). Either fix must be made before this contract may be
        approved.

    - id: B
      severity: packet staleness relative to r2's own correction
      location: >-
        experiments/EXP-ECDLP-6ac801/derivation-packet/PA-ECDLP-6ac801-v2-to-v3/quantity.md
        section 13 ("The one thing you are told about an outcome, and why"),
        approximately line 285-289
      quote: >-
        "`T_sel = T/2` at `a = 1/4`, `r = 2`, `N = 2^24` is established
        G3-INFEASIBLE by prior, independent work outside this batch (evidence
        record `EV-ECDLP-60e266`)."
      independently_confirmed: >-
        Present verbatim, confirmed by direct read of quantity.md section 13
        in full by this composing session.
      contradicting_text: >-
        specification.v3.yaml's own r2 addendum `cf2_anchor_strength` block
        (approximately line 2266-2277) explicitly WITHDRAWS this exact
        characterisation: "EV-ECDLP-60e266 carries `strength: preliminary`
        ... The phrases 'ESTABLISHED G3-INFEASIBLE' and 'independently
        established a = 1/4 G3-infeasibility' are withdrawn ... records
        a = 1/4 G3-infeasibility at strength `preliminary`, on one execution
        batch, with no independent implementation."
      defect: >-
        quantity.md -- the ONE document an actual blind re-deriver is handed
        -- still uses the exact withdrawn language, including calling
        single-batch work "independent work". By the packet's OWN
        normativity clause (MANIFEST.yaml `normativity.the_contract_governs_
        on_definitions`: "If this packet and specification.v3.yaml are ever
        found to differ on any definitional point, THE CONTRACT GOVERNS, this
        packet is DEFECTIVE, and the difference is a reportable defect"), the
        packet is now self-certified defective.
      required_fix: >-
        (2) Update quantity.md section 13 (and MANIFEST.yaml if it repeats
        the characterisation) to the r2-corrected text: state that
        EV-ECDLP-60e266 records a = 1/4 G3-infeasibility at strength
        `preliminary`, on one execution batch, with no independent
        implementation -- dropping "established" and "independent work" from
        the packet a blind re-deriver actually reads.

    - id: C
      severity: duplicate/superseded required_artifacts clause left unflagged
      location: 'specification.v3.yaml required_artifacts, approximately line 1754'
      quote: >-
        "[v3 AMENDMENT, ADDITIVE] the control report: for every declared
        control (a)-(o), per cell, FIRED or NOT FIRED, with the quantity and
        cell it was read from; an absent entry counts as NOT RUN"
      independently_confirmed: >-
        Present verbatim at that location, confirmed by direct read of the
        `required_artifacts` block in full by this composing session.
      superseding_text: >-
        specification.v3.yaml `v3_r2_addendum.cf1_required_artifacts_override`
        (approximately line 2293-2298) states this base clause "SUPERSEDES
        snapshot `required_artifacts` item at line 1754 ... An executor has
        no correct action under that clause for six of fifteen letters,"
        replacing it with the three-entry `required_artifacts_r2` (control
        report over eleven letters, self-check report over four predicates,
        diagnostic report over two letters).
      defect: >-
        The base clause is left in place in the main `required_artifacts`
        list with no inline pointer to the override, creating a real risk
        that a mechanical reader or dispatcher acts on the stale
        fifteen-letter clause rather than the corrected three-part scheme.
      required_fix: >-
        (3) Flag the base `required_artifacts` line 1754 entry inline with an
        explicit forward pointer to `v3_r2_addendum.cf1_required_artifacts_
        override` and `required_artifacts_r2`, or remove the superseded
        clause outright and fold the r2 replacement directly into the main
        `required_artifacts` list.

    - id: D
      severity: verification gap in the self-consistency tooling
      location: >-
        coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-d7e987/tasks/TASK-20260907-b1b54b/am1_self_consistency.py
        and its output am1_report.json
      independently_confirmed: >-
        am1_report.json read in full by this composing session:
        `"all_pass": true`, `"n_checks": 5`, with the five checks being
        item-set identity, partition arithmetic, quantifier range,
        cross-reference resolution and pointer freshness (the instrument.py
        line-81/line-84 citation check). The script's own
        `asserts_nothing_about` field reads "the ECDLP; this is a
        document-consistency pass".
      defect: >-
        The script checks ONLY the r2 addendum block's own internal
        self-consistency: item-set identity, partition arithmetic, quantifier
        range, cross-reference resolution against DEC-20260907-b6bcf4, and
        one hardcoded instrument.py line-content check. It never reads or
        checks the derivation packet's own content (quantity.md,
        deliverables.md, prohibitions.md, MANIFEST.yaml) against the
        contract, and never checks for Defect A or Defect B. Its
        `"all_pass": true` must not be read as validating packet-contract
        consistency, which it does not test.
      additional_gap: >-
        No session with a Bash/shell tool has yet independently recomputed
        the packet's declared sha256 values (quantity.md, deliverables.md,
        prohibitions.md in MANIFEST.yaml `readable_files`) or re-run
        am1_self_consistency.py directly. The review that found Defects A-C
        had no shell in its own session and worked from direct file reads
        only.
      required_fix: >-
        (4) Have a session with a shell independently verify the packet's
        declared sha256 values against the committed bytes and re-run
        am1_self_consistency.py directly to reconfirm `all_pass: true`
        end-to-end; consider extending the script (or adding a sibling check)
        to verify packet-vs-contract consistency, specifically that
        quantity.md contains no characterisation contradicted by the r2
        addendum and that specification.v3.yaml's readable-contract body
        (outside the packet) discloses every leak the packet's allowlist
        mechanism is relied upon to contain.

  control_and_other_findings_not_blocking: >-
    Every OTHER high-risk field checked (definitions, blind_rederivation's
