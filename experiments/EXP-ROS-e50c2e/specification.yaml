experiment:
  id: EXP-ROS-e50c2e
  hypothesis_id: H-ROS-7a19e0
  derived_from_idea: IDEA-20260809-47bb6d
  question_id: RQ-ROS-595c15
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    ROS solver reproduction and cost surface - a literal blind-Schnorr forgery certified by an
    independently implemented verifier, plus solver operations and peak memory as a curve in
    concurrent session count at three group orders, with an honest-path gate and a below-threshold
    control
  objective: >-
    The one uncertainty a run reduces is whether this goal can answer instantiation questions
    quantitatively rather than by citation. A run establishes (i) whether the honest blind-Schnorr
    path produces signatures an independent verifier accepts - the gate without which any forgery is
    a bug report against this program's own code; (ii) whether a LITERAL forgery on a message never
    signed is produced at the smallest parameter and whether its certificate re-verifies
    independently; (iii) the solver's operations and peak memory as a function of concurrent session
    count at three declared group orders, reported as a curve with the transition's fitted location
    and sharpness rather than as a verdict; and (iv) whether the solver FAILS within budget at session
    counts well below the transition, without which the transition cannot be distinguished from an
    artifact of the search order.
    No new attack is claimed - the algorithm is published and this record does not claim it. No
    statement is made about any deployed protocol, wallet, custody service or chain. Non-completion
    at a cell is a budget outcome about this solver, never a mathematical result.
  what_this_is_not:
    - >-
      Not a new attack and not a claim of one. The solver is a published algorithm and the record
      claims only the artifact and the measured cost surface.
    - >-
      Not a statement about any deployed protocol, wallet, custody service, chain, or production
      library. Everything is against this program's own implementation at small parameters.
    - >-
      Not a verification of any published asymptotic claim. Three small group orders cannot reach an
      asymptotic statement and the contract does not pretend they can.
    - >-
      Not a status change to any hypothesis, evidence record, decision or goal record, and not a
      promotion of any knowledge entry.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: toy_reproduction
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the three executed group orders and the swept session counts,
      against this program's blind-Schnorr implementation at the recorded commit, a forgery was or
      was not produced with an independently re-verified certificate, and the solver's operations and
      peak memory took the reported values with a transition at the reported location. WHAT DOES NOT
      FOLLOW - nothing about any deployed system; nothing about the published asymptotic claim, which
      three small orders cannot reach; no novelty, since the algorithm is published; and specifically
      NOT that the measured transition location extrapolates to a cryptographic group order, which
      would be a separate assumption with its own evidence requirement.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, HARD GATE): fetch and file the ROS reference from primary text under a
      run record. The parent proposal records it as recalled and unread. From the filed text,
      transcribe the solver as an explicit procedure with its cost accounting, and freeze the group
      orders, the session-count grid, the trial count, the per-cell budget and the definition of
      "operation" for the cost metric. Hash all of it.
      STAGE 1 (minutes, HARD GATE): implement the honest blind-Schnorr signing protocol and an
      INDEPENDENT verifier, the verifier by a separate dispatch with a disjoint write scope. Run
      honest sessions at every group order and require every emitted signature to verify. GATE - no
      forgery is attempted while this is red.
      STAGE 2 (minutes, HARD GATE): verifier calibration. Feed the independent verifier the planted
      negatives of the controls block - a signature on a different message, a signature with a
      perturbed scalar, a signature from a different key - and require rejection of every one. A
      verifier that accepts everything would certify any forgery, including a non-forgery.
      STAGE 3 (the reproduction): implement the solver from the Stage 0 transcription and run it at
      the SMALLEST group order and a session count above the predicted transition. Emit the forged
      signature and its certificate, and re-verify the certificate through the independent verifier
      by a path that does not call the solver. This is the artifact.
      STAGE 4 (the curve): sweep the session count at each of three group orders, including at least
      two counts well below the predicted transition and at least two well above, twenty trials per
      cell with declared seeds. Record per trial - success indicator, operation count, peak memory,
      wall time, and the certificate where successful. Fit the transition location and sharpness per
      group order.
      STAGE 5 (the control): confirm that at the well-below counts the solver FAILS within the
      declared per-cell budget on every trial. A success there voids the transition.
      STAGE 6 (zero compute): report the artifact, the certificate, the cost surface with its per-cell
      counts, the fitted transition locations against the logarithm of each group order, and the
      below-threshold failure counts. Report every timeout separately from every algorithmic failure.
    instrument: >-
      Python with arbitrary-precision integers; the group, the honest protocol and the solver written
      from the Stage 0 transcription; the verifier written by a separate dispatch with a disjoint
      write scope, sharing no module, constant table or serialization. Every session and every solver
      run seeded and replayable. Operation counting instrumented at the level frozen in Stage 0, so
      that "operations" means the same thing in every cell. Recorded through the program's run wrapper
      with a manifest, and every claimed forgery re-verified independently by the wrapper per
      docs/claims-and-verification.md.
    parameters: >-
      Three group orders, declared and frozen in Stage 0, chosen so that a complete sweep is
      affordable rather than because the attack works there; concurrent session counts swept around
      the logarithm of each order, with at least two values well below and at least two well above;
      twenty trials per cell; per-cell wall-clock budget declared in Stage 0; seeds declared per
      trial.
  controls:
    - >-
      HONEST-PATH CONTROL, blocking - the blind signing protocol must produce signatures the
      independent verifier accepts at every group order BEFORE any forgery is attempted. A broken
      protocol implementation manufactures forgeries out of its own bugs.
    - >-
      INDEPENDENT VERIFIER, blocking - implemented by a separate dispatch with a disjoint write
      scope, sharing no module, constant table or serialization with the signer or the solver.
    - >-
      PLANTED-NEGATIVE BATTERY FOR THE VERIFIER, blocking - a signature on a different message, one
      with a perturbed scalar, and one from a different key must all be REJECTED. A verifier that
      accepts everything would certify a non-forgery.
    - >-
      BELOW-THRESHOLD CONTROL, blocking for the transition claim - at session counts well below the
      predicted transition the solver must FAIL within the declared per-cell budget on every trial. A
      success there means the transition is an artifact of the search order or of the cost accounting.
    - >-
      DETERMINISTIC REPLAY - every session and solver run replayable from its seed, since a forgery
      that cannot be replayed cannot be verified.
    - >-
      TIMEOUT SEPARATION - a per-cell timeout is recorded as a distinct outcome from an algorithmic
      failure and is NEVER merged into a failure count, per AGENTS.md rule 3. A cost surface that
      counts timeouts as failures would manufacture a transition.
    - >-
      FROZEN COST ACCOUNTING - the definition of "operation" is fixed in Stage 0 and is identical in
      every cell, so that a curve in session count is not partly a curve in what is being counted.
  independent_variables:
    - group order, three declared values
    - number of concurrently opened signing sessions
    - trial seed
    - 'regime: well below the predicted transition / near it / well above it'
  metrics:
    primary:
      - name: forgery_success_indicator
        units: boolean per trial, plus certificate bytes where true
        computed: >-
          True when the solver emits a signature on a message never submitted to the signer AND the
          independent verifier accepts it AND the run wrapper's re-verification, by a path that does
          not call the solver, also accepts it. All three are required; any one failing makes the
          trial not a success.
      - name: solver_operation_count
        units: >-
          operations as defined by the frozen Stage 0 accounting, dimensionless integer, per trial
        computed: >-
          Instrumented count over the solver's execution, per trial, reported per cell as the full
          distribution over the twenty trials rather than as a mean alone.
      - name: solver_peak_memory
        units: bytes, peak resident set size per trial
        computed: >-
          Sampled during solver execution, per trial, with the dominant data structure's analytic
          size reported alongside for reconciliation.
      - name: transition_location
        units: session count, dimensionless, per group order, with a fitted uncertainty
        computed: >-
          The session count at which the per-cell success rate crosses one half, obtained by fitting
          the success rate against session count per group order, reported alongside the logarithm of
          that group order for direct comparison.
      - name: below_threshold_failure_count
        units: exact integer count of failing trials over exact integer count of trials
        computed: >-
          Number of trials at the well-below session counts that fail within the declared per-cell
          budget, over the trials run there. Required equality; a single success voids the transition.
      - name: honest_path_validity_count
        units: exact integer count of verifying signatures over exact integer count of honest sessions
        computed: >-
          Honest blind-Schnorr sessions whose emitted signature the independent verifier accepts, per
          group order. Required equality.
    secondary:
      - name: transition_sharpness
        units: >-
          width in session counts over which the success rate rises from 0.1 to 0.9, dimensionless
        computed: Read off the same fit as the transition location, per group order.
      - name: timeout_count
        units: exact integer per cell
        computed: >-
          Trials that hit the per-cell wall-clock budget, counted SEPARATELY from algorithmic
          failures and never merged into them.
      - name: planted_negative_rejection_count
        units: exact integer over the battery size
        computed: Planted negatives the independent verifier rejects. Required equality.
      - name: replay_byte_equality
        units: boolean per session and per solver run
        computed: >-
          Byte-for-byte reproduction of every message and every solver output from the recorded seed.
      - name: wall_time_per_trial
        units: seconds
        computed: Per trial, with the per-cell median and maximum reported.
      - name: certificate_reverification_outcome
        units: 'categorical per claimed forgery: reverified / failed'
        computed: >-
          Outcome of the run wrapper's independent re-verification of every claimed forgery, by a
          path that does not call the solver.
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The triple (forgery_success_indicator at the smallest group order above the predicted
      transition, transition_location against the logarithm of each group order,
      below_threshold_failure_count).
    formula: >-
      forgery_success_indicator is true at the smallest parameter above the predicted transition,
      with a certificate that re-verifies - a failure there means the implementation is wrong and
      halts the goal until fixed. transition_location tracks the logarithm of the group order across
      all three orders, i.e. the fitted locations are consistent with a common linear relation in the
      logarithm; a location that does not track it contradicts the published account as implemented
      here and requires investigation BEFORE anything is recorded.
      below_threshold_failure_count equals the number of trials run below the transition. Under the
      null that the transition is an artifact of the search order, the solver succeeds below it too
      and below_threshold_failure_count is less than the trial count.
    source: >-
      Pre-registered in the parent proposal IDEA-20260809-47bb6d (predictions and controls blocks)
      before any run under this contract exists. The success-rate-crosses-one-half definition of the
      transition location and the 0.1-to-0.9 sharpness definition are the Coordinator's rendering of
      the proposal's "location and sharpness of that transition" into decidable quantities, and are
      frozen here before any run.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at three small group orders chosen so that a complete sweep over session counts and
      twenty trials per cell is affordable - not chosen because the solver succeeds there. That is
      adequate for the two things the contract claims, which are an ARTIFACT (a forgery whose
      certificate re-verifies) and a COST SURFACE at the executed orders. It is NOT adequate for any
      asymptotic statement, and the transfer assumption that would be needed to extrapolate the
      transition to a cryptographic order is stated as unmade rather than minimised.
    correspondence: null
  tail_checks:
    - >-
      Report the full per-trial distribution of operation count and peak memory in every cell, not a
      mean, since a transition is a change in a distribution's shape and a mean would smooth it away.
    - >-
      Report every timeout individually with its seed and cell, since merging timeouts into failures
      would manufacture a sharper transition than exists.
    - >-
      Report the largest peak memory observed in every cell, reconciled against the analytic size of
      the solver's dominant data structure, since memory rather than time may be what binds.
    - >-
      Report every cell where the success rate is strictly between 0 and 1, in full, since the fitted
      transition location is determined entirely by those cells.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
    trials_per_cell: 20
    note: >-
      The independent verifier is additionally a separate implementation produced by a separate
      dispatch; that is a control, not a replication seed. Every claimed forgery must additionally
      re-verify under the run wrapper's own independent path.
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 24.0
    maximum_memory_gb: 16
    maximum_runs: 200
  stopping_rules:
    - Halt if the ROS reference cannot be fetched and filed in Stage 0; the solver is not written from recall.
    - Halt if the honest path fails to produce verifier-accepted signatures at any group order; no forgery is attempted.
    - Halt if the independent verifier accepts any planted negative; it would certify a non-forgery.
    - >-
      Abandon a cell at its declared per-cell wall-clock budget and record a TIMEOUT, which is an
      infrastructure outcome under AGENTS.md rule 3 and is never counted as an algorithmic failure.
    - >-
      Stop at the frozen grids - three group orders, the declared session-count sweep, twenty trials
      per cell. The grids and the cost accounting are frozen in Stage 0 and are not revised after a
      curve is seen.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop,
      never a negative result (AGENTS.md rule 5).
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the trial failed_infrastructure
      and is NEVER negative mathematical evidence (AGENTS.md rule 5, rule 3).
    - >-
      A run in which the verifier shares any module, constant table or serialization with the signer
      or the solver is invalid_measurement - its acceptance carries no information.
    - >-
      Any claimed forgery whose certificate fails independent re-verification makes the run
      completed_invalid (docs/claims-and-verification.md), and no cost figure from that cell is
      admissible.
    - >-
      A run in which the operation-counting definition differs between cells is invalid_measurement,
      because the reported curve would be partly a curve in what was counted.
    - >-
      A run whose parameters differ from the frozen grids is a DIFFERENT experiment and requires a new
      contract; it is never a repair of this one.
  success_criterion: >-
    The run is successful when ALL of the following hold and are read off the predefined metrics:
    (1) planted_negative_rejection_count equals the battery size; (2) honest_path_validity_count
    equals the honest session count at every group order; (3) forgery_success_indicator is true for
    at least one trial at the smallest group order above the predicted transition, with
    certificate_reverification_outcome = reverified; (4) replay_byte_equality is true for every
    session and solver run; (5) below_threshold_failure_count equals the number of trials run below
    the transition; and (6) solver_operation_count, solver_peak_memory, transition_location and
    transition_sharpness are reported per group order with full per-trial distributions and with
    timeouts counted separately.
    Note that (6) is satisfied by REPORTING the curve. Whether the transition tracks the logarithm of
    the group order is the finding, and criterion (5) is what makes that finding falsifiable.
  falsification_criterion:
    - >-
      No forgery at any reachable parameter within the batch budget - either the implementation is
      wrong or the reachable range excludes the successful regime. This is a BUDGET AND IMPLEMENTATION
      outcome about this solver under AGENTS.md rule 3, NEVER a mathematical statement about the ROS
      problem, and it halts the goal until resolved.
    - >-
      transition_location does not track the logarithm of the group order across the three orders -
      the measured curve contradicts the published account as implemented here. Investigation comes
      BEFORE anything is recorded, and no cost surface is published until the discrepancy is resolved
      or characterised.
    - >-
      below_threshold_failure_count is less than the trial count, i.e. the solver succeeds well below
      the predicted transition - the transition is not real as measured, most likely an artifact of
      the search order or of the cost accounting, and the cost surface is VOID until corrected.
    - >-
      The honest path fails to produce verifier-accepted signatures - the protocol implementation is
      broken and any forgery produced afterwards would be a bug report against this program's own
      code. Blocking.
    - >-
      Any forgery certificate fails re-verification - the run is completed_invalid and the claimed
      forgery is not a forgery.
    - >-
      The independent verifier accepts any planted negative - it would certify a non-forgery and every
      success it reported is void.
  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved inference block and environment
    - the Stage 0 fetch receipt for the ROS reference, with URL, HTTP status, byte count and sha256
    - the frozen grids, per-cell budget and operation-counting definition, with their hash
    - raw-result.json carrying every per-trial success indicator, operation count, peak memory, wall time and seed, not summaries
    - the forged signature and its certificate bytes, for every successful trial
    - the independent re-verification outcome for every claimed forgery
    - the honest-path arm and the planted-negative battery, in the same file as the solver arm
    - the below-threshold control's per-trial outcomes with timeouts separated from failures
    - the fitted transition location and sharpness per group order, with the cells the fit rests on
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Approval is required before execution and is the USER's gate, because it authorizes execution
      and spends compute. This contract is review_required and NOT approved; approved_by is null and
      execution_authorized is false.
    - >-
      Stage 0's reference filing is a precondition of implementing the solver. The Coordinator must
      confirm the fetch receipt exists before Stage 3, because a solver written from recall would make
      the measured cost surface a property of the recall.
    - >-
      The independent verifier must be dispatched as a SEPARATE task with a disjoint write scope. A
      single agent writing the signer, the solver and the verifier produces no independent check.
    - >-
      This contract is scoped to this program's own implementation at small group orders. Approving it
      authorizes no work against any external system, service or deployed protocol, and any extension
      in that direction would require its own hypothesis, contract and approval.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260809-47bb6d
    authored_at: '2026-08-25'
    note: >-
      Objective, the two predictions, the honest-path control and the below-threshold control are
      transcribed from the parent proposal's claim, predictions, minimal_test and controls blocks.
      The planted-negative verifier battery, the timeout separation, the frozen operation-counting
      definition and the decidable definitions of transition location and sharpness are added here,
      because the proposal's cost curve was otherwise not decidable from any listed metric and because
      a design that counts timeouts as failures manufactures the transition it is trying to measure.
      Budgets come from the parent's declared estimated_cost (implementation medium, compute
      moderate) through the program's cost table.
  derivation_gaps:
    - >-
      The three group orders are NOT fixed in this contract and must be frozen in Stage 0. They must
      be chosen for sweep affordability and declared before any solver run, since choosing them after
      seeing where the solver succeeds would make the transition claim unfalsifiable.
    - >-
      The definition of "operation" for the cost metric is named but not chosen. It must be fixed in
      Stage 0 and applied identically in every cell, or the reported curve is partly a curve in what
      was counted.
    - >-
      The per-cell wall-clock budget is not set here. It determines which failures are timeouts and
      which are algorithmic, and therefore directly shapes the measured transition; it must be frozen
      before Stage 4.
    - >-
      Whether the solver has variants in the filed reference, and which variant is implemented, is
      unknown until Stage 0. If more than one exists, the contract must name the implemented variant,
      because the cost curve is a property of the variant.
    - >-
      Twenty trials per cell gives a success-rate resolution of five percentage points, which may be
      too coarse to locate a sharp transition. Whether the trial count suffices is not derived from a
      power calculation here, and a Coordinator wanting a tighter location must fund more trials by
      amendment before the run.
