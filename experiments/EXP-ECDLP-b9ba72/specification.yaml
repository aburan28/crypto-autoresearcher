experiment:
  id: EXP-ECDLP-b9ba72
  hypothesis_id: H-ECDLP-caf3ff
  proposal_id: IDEA-20260921-1ec106
  source_idea_ids: [IDEA-20260921-1ec106]
  question_id: RQ-CRYPTO-001
  goal_id: GOAL-CRYPTO-001
  version: 1
  title: >-
    Digit-character (lambda, PGL_2-stability) profile: the Thue-Morse
    and Rudin-Shapiro level sets on the census's primary ladder, with
    the level-set/character identity check, the construction-closure
    comparison against the ffe1df band, and the census control battery.
  status: approved
  assigned_to: executor
  approved_by: coordinator
  approval_decision: DEC-20260921-33f3b6
  approval_basis: >-
    AGENTS.md standing user authorization of 2026-09-06 supplies user
    approval; the Coordinator's protocol-completeness check passes
    (rows, ladder, identity check, controls, seeds, stopping and
    invalidation rules, verdict vocabulary, artifacts, write scope all
    frozen and non-null). Budget advisory per docs/research-budget-policy.md;
    only the 8 GiB memory ceiling is machine protection.
  recorded_at: '2026-09-21'
  inference:
    requested_policy: executor-implementation
    runtime: null
    resolved_model_id: null
    model_verified: false
    reasoning_effort: null
    fallback_used: false
    degraded_requirements: []
    session_identity: null
    provenance_note: >-
      Designed and executed in the top-level coordinator session under
      the executor role contract (role-runtime outage, AWS
      DescribeInstances AuthFailure, recorded in DEC-20260921-4d1b40);
      the run manifest carries the executor provenance.
  scale_relevance:
    tier: toy
    justification: >-
      The census's primary ladder verbatim (ten primes 4099..16777259);
      exact computation, no sampling; readings feed necessary-condition
      gates only.
    correspondence: null

  rows:
    - >-
      id: VT
      name: Thue-Morse level set
      construction: >-
      t(x) = (-1)^{popcount(x)} on the canonical lift x in [0, p);
      A_t = {x : t(x) = +1}; v = 1_{A_t}/|A_t| (probability
      normalisation, vhat(0) = 1 exactly).
    - >-
      id: VR
      name: Rudin-Shapiro level set
      construction: >-
      r(x) = (-1)^{u(x)}, u(x) = #{i >= 0 : bit_i(x) = bit_{i+1}(x) = 1};
      A_r = {x : r(x) = +1}; v = 1_{A_r}/|A_r|.
    - >-
      id: VTM
      name: Thue-Morse Moebius variant
      construction: >-
      v composed with the frozen-hash Moebius map M (stream
      SHA256(EXP-ECDLP-b9ba72:C03:moebius:VT:<counter>), coefficients
      mod p, resampled on det = 0, pole input mapped to the image of
      infinity as in the census battery).
    - >-
      id: VRM
      name: Rudin-Shapiro Moebius variant
      construction: as VTM with the VR stream.
    - >-
      id: C01
      construction: v = 1/p everywhere; lambda reads 0 exactly.
    - >-
      id: C02A
      construction: >-
      random-set control, A = {x : the frozen sign bit is 1} (stream
      SHA256(EXP-ECDLP-b9ba72:C02:sign:A:<block>), 256 bits per
      digest); analytic level 0.5.
    - >-
      id: C02B
      construction: as C02A with seed set B.

  ladder:
    note: >-
      The census's frozen primary ladder VERBATIM (same ten primes, same
      deterministic construction: smallest prime >= 2^b for b in
      {12, 13, 14, 15, 16, 17.5, 19, 20.5, 22, 24}), chosen so the
      census's R03 mode-level bridge reading (0.4191) is directly
      comparable without re-measurement.
    primes: [4099, 8209, 16411, 32771, 65537, 185369, 524309, 1482919, 4194319, 16777259]

  bridge:
    note: >-
      The construction-closure comparison uses the census's own R03
      readings on these primes (RUN-ECDLP-8e13c2 registry, cited, not
      re-measured) as the mode-level indicator bridge.

  identity_check:
    note: >-
      At the smallest ladder prime, compute that (the transform of the
      ±1-valued character array) and vhat for VT and verify the CORRECTED
      identity l1*(VT) = ||that||_1^* / (2|A_t|) to 1e-9: the
      probability-normalised indicator v = 1_A/|A| equals (1+t)/(2|A_t|)
      on the level set, so vhat(k) = that(k)/(2|A_t|) for k != 0 exactly.
      PRE-ARCHIVE CORRECTION, disclosed: the first draft of this check and
      of IDEA-20260921-1ec106's mechanism section stated l1*(VT) =
      ||that||/2, conflating the 0/1-valued (1+t)/2 with the
      probability-normalised indicator; the run's checker caught the error
      (relative difference 1.00) before any archive, the formula was
      corrected, and the single identity cell was recomputed. No
      measurement cell was affected: the row constructions are plain
      level-set indicators and were computed correctly throughout. The
      merged idea record carries the error in its mechanism prose; this
      note is the supersession of record for it.

  controls:
    - C01 exact numerical zero (l1* <= 1e-9 relative to |vhat(0)|).
    - C02A/C02B within the Parseval band 0.5 +- (2SE + 0.02) with seed
      agreement within 2SE.
    - vhat(0) = 1 within 1e-9 for every ok cell.
    - The identity check above.
    - >-
      Checker battery: naive O(p^2) DFT spot at the smallest prime and a
      second independently structured chirp-z at a mid prime, agreement
      1e-9.

  independent_variables:
    - character (t, r)
    - Moebius composition (base vs variant)
    - prime (frozen ladder)

  primary_metrics:
    - fitted lambda per row with SE, two-spacing agreement, jackknife.
    - level difference delta_c = lambda(character) - lambda(C02A) with
      combined SE (convention-free).
    - Moebius deviation |lambda(variant) - lambda(base)| beyond 2SE.
    - >-
      construction closure: lambda(VT) point estimate against
      [0.36, 0.42] with the census R03 bridge cited beside it.

  verdict_vocabulary:
    - >-
      stable_above_random: delta_c > 2SE AND Moebius stable (the
      positive candidate; replicate before any use)
    - >-
      unstable: Moebius deviation beyond 2SE (regardless of level)
    - >-
      stable_flat: Moebius stable AND |delta_c| <= 2SE
    - >-
      unresolved: guard failures (two-spacing, jackknife) or missing
      cells
    - >-
      void_control_failure: any control failure voids the run

  stopping_rules:
    - First failed control halts dependent reads and marks the run void
      with the defective control named.
    - Memory above 8 GiB checkpoints the cell resource_exhaustion with a
      continuation pointer (machine protection only; not expected on
      this ladder).
    - No row, ladder prime, seed, or rule change after any cell outcome.

  invalidation_rules:
    - Composite-length surrogate DFT or any prefactor other than the
      canonical normalisation.
    - Unnormalised statistics or a normalisation change after outcomes.
    - A Moebius-unstable row reported as stable, or a level comparison
      made across different ladders.
    - The bridge comparison silently re-measuring the census's R03 cells.

  success_criterion: >-
    The single frozen run completes all 70 cells (7 rows x 10 ladder
    primes, with unavailable/void statuses recorded where they occur),
    all five controls pass (C01 exact zero, C02A Parseval band, C02 seed
    agreement, the corrected identity check to 1e-9, vhat(0) = 1 in every
    ok cell), the checker spot re-derivations agree (naive DFT and second
    chirp-z to 1e-9), and every character carries one of the frozen
    verdicts with its delta and Moebius reading on record, plus the
    construction-closure statement either way (VT against the ffe1df band
    with the census R03 bridge cited).
  falsification_criterion: >-
    Any control failure voids the run (infrastructure outcome, never
    mathematical evidence). A character reading stable AND above the
    random-set level is the positive outcome and triggers replicate on
    first observation, not support. Moebius deviation beyond 2SE on a
    character falsifies that character's stability; a stable-flat or
    unstable reading on both characters extends the census's scoped
    negative over the digit-character family at this ladder, with the
    cross-ratio family and the non-set escape hatch as the named
    successors. The hypothesis's prediction that Rudin-Shapiro reads at
    the random level is falsified if it reads above it with passing
    controls -- recorded as the primary observation either way.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_runs: 1
    maximum_workers: 4

