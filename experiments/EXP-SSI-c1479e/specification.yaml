# EXP-SSI-c1479e
# Integer slice of four written ladder rungs. No decryption trial is run.
# Approved by DEC-20261009-f531ff.
experiment:
  id: EXP-SSI-c1479e
  hypothesis_id: H-SSI-5dfc3f
  source_idea: IDEA-20261007-cd446e
  question_id: RQ-SSI-1946c9
  version: 1
  title: Four ladder rungs versus last index 3
  status: approved
  frozen: true
  designed_at: '2026-10-09'
  approved_by: coordinator
  approval_decision_id: DEC-20261009-f531ff
  objective: >-
    Check the rung count 4, the last index 3, and the nearby gap 0.
  inputs:
    rung_count: 4
    last_index: 3
    rung_gap: 1
    rung_product: 12
    rung_sum: 7
    nearby_a: 3
    nearby_b: 3
    nearby_gap: 0
    nearby_product: 9
  controls:
    - >-
      The labels are V0, V1, V2, and V3. That is four rungs and the
      last index is 3. Reporting both counts as 3 drops the gap and
      invalidates the run.
    - >-
      Four exceeds three by 1. The product of 4 and 3 is 12. Their
      sum is 7.
    - >-
      Two readings of the last index are both 3. Their gap is 0 and
      their product is 9.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {count, subtract}
  metrics:
    primary:
      - rung_count
      - last_index
      - rung_gap
      - implementations_agree
    secondary:
      - rung_product
      - rung_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The ladder has 4 rungs and the last index is 3. The gap of two
      last-index readings is 0.
    formula: >-
      Count the labels V0, V1, V2, and V3. Read the last index 3.
      Subtract 3 from 4. Multiply 4 by 3. Subtract 3 from 3.
    source: >-
      IDEA-20261007-cd446e writes the rungs V0 through V3, read
      2026-10-09. The gap, the product, and the sum were recomputed
      in this design session. That computation is not a run. No
      decryption trial was run.
  scale_relevance:
    tier: toy
    justification: Four written labels. No transfer to a torsion image.
    correspondence: null
  tail_checks:
    - The product 12 and the nearby gap 0 are required. A check that stops at the rung count 4 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the rung count 4 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The rung count is not 4.
    - The last index is not 3.
    - The product is not 12.
    - Both counts are reported as 3, or a decryption trial is run.
  success_criterion: >-
    Both runs agree that the rung count is 4, that the last index is
    3, and that 4 exceeds 3 by 1.
  falsification_criterion: >-
    The runs agree that the rung count is computed, and that count
    is not 4.
  decision_impact:
    on_positive: >-
      Agreement that the ladder has 4 rungs and the last index is 3
      records the written size of the ladder. It does not run a
      decryption trial.
    on_negative: >-
      Agreement that the rung count is not 4 records that the written
      labels were misread. The ladder test stays unrun.
  required_artifacts:
    - experiments/EXP-SSI-c1479e/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SSI-c1479e/runs/<RUN-ID>/command.txt
    - experiments/EXP-SSI-c1479e/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SSI-c1479e/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SSI-c1479e/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-SSI-c1479e/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any decryption trial, torsion sample, or isogeny walk.
    - Any claim that a rung gap of 1 moves an exponent.
    - Any security statement about auxiliary torsion data.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
