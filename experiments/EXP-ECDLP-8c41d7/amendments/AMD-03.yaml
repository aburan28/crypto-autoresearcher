protocol_amendment:
  id: AMD-03
  experiment_id: EXP-ECDLP-8c41d7
  filed: "git commit time of this file (no hand-typed timestamp)"
  filed_before_affected_data: true
  reason: >-
    RUN-ECDLP-8c41d7-03 (m = 4, L = 4) ran to the end, but every msolve arm
    crashed (rc -11, segmentation fault) within a fraction of a second on every
    instance, and both Singular arms timed out on all 6 instances. The crash is
    an msolve 0.6.5 defect on primes with exactly 17 bits (2^16 < p < 2^17):
    reproduced on a standalone dense system at p = 65551 (m = 4, L = 4),
    p = 70039 (m = 3, L = 3 and m = 4, L = 3) and, earlier, p = 66047
    (m = 2, L = 8); the same systems over 15-, 16-, 19- and 23-bit primes
    (15 bits: 20023; 16: 60103; 19: 300007; 23: 5000087) read fine. The frozen
    prime rule gives the 17-bit p = 65551 for (m, L) = (4, 4). No completed
    msolve result in any EXP-ECDLP-* run used a 17-bit prime (m = 3 used
    10, 13, 16, 19 and 22 bits; m = 4 used 9 and 13 bits before this cell).
  change: >-
    Re-run the m = 4, L = 4 cell for the msolve arms only (A_elim_ms, A_drl_ms,
    B_ms) as RUN-ECDLP-8c41d7-04 with p = 262271 (19 bits; 16 | p + 1;
    the prime msolve already solved at m = 3, L = 6), via block_order_m4_p19.py,
    which overrides only that prime choice; chain construction, targets,
    instruments, controls, timeout, instance counts and stopping rule are
    unchanged (instances differ because the seed draws are conditioned on p).
    The Singular arms are not re-run: they ran correctly at p = 65551 in
    RUN-03 and both timed out on all 6 instances, which the stopping rule
    already treats as retirement. The L = 4 cell therefore has the Singular
    pair at p = 65551 and the msolve arms at p = 262271; within each solver
    family the chain and dense arms share instances, and the report states
    the two primes. RUN-03's msolve rows are instrument failures, not
    evidence, and are excluded from the analysis.
  thresholds_changed: false
  success_or_falsification_criteria_changed: false
