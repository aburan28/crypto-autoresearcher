record_correction:
  id: NOTE-01
  experiment_id: EXP-ECDLP-8c41d7
  filed: "git commit time of this file (no hand-typed timestamp)"
  trigger: >-
    Independent validation of this experiment (VAL-20261019-0cb05d): the validator
    scanned 72 primes on the dense system and 10 on a two-variable toy system.
  scope: >-
    Corrects the stated range of the msolve 0.6.5 crash in AMD-03,
    block_order_m4_p19.py and CORR-20261019-e6f65b. Changes no measurement,
    threshold, criterion or prime choice; earlier files stay unedited.
  corrections:
    - record: amendments/AMD-03.yaml, block_order_m4_p19.py docstring, runs/RUN-ECDLP-8c41d7-03 notes
      stated: "msolve crashes on primes with exactly 17 bits (2^16 < p < 2^17)"
      actual: >-
        msolve 0.6.5 crashes on primes with 17 AND 18 bits, 2^16 < p < 2^18
        (131111 and 262127 crash on the dense m = 3 system; 65519 and 262147 and above read fine). The
        prime chosen by AMD-03, p = 262271 (> 2^18), is outside the crashing
        range, so the re-run, its results and the conclusion are unaffected.
    - record: result coverage
      note: >-
        No completed msolve result in EXP-ECDLP-502ae2, -20a588 or -8c41d7 used
        a 17- or 18-bit prime (msolve rows exist at 9, 10, 13, 16, 19 and 22
        bits; RUN-03's 15 crash rows are the only 17-bit ones).
    - record: amendment timing (validator concern, recorded as a fact)
      note: >-
        AMD-03 was filed after RUN-03's data was seen, so the choice to re-run
        only the msolve arms followed that run. The Singular arms of L = 4 are
        not re-run and stay at p = 65551.
  approved_by: coordinator
