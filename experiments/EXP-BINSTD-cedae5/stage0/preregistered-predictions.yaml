heuristics_under_test:
  - HEUR-BINSTD-fe6b59-H0
  - HEUR-BINSTD-fe6b59-H1
source: >-
  IDEA-20260922-c2bbe6 H-c2bbe6-0; HOLD-Q concrete_experiment and
  A13/sqrt(2 N B) pricing; H-BINSTD-fe6b59. Classical birthday bound
  marked recalled where not derived here.
predictions:
  A_combined_count:
    statement: >-
      Combined-relation count after T attempts ≈ T^2/(2S) with S measured
      from the residual histogram (and compared to S=N).
    formula: E[matched_pairs] = T^2 / (2S)
    kind: modeled
    birthday_bound_provenance: recalled
  B_collision_rate_ratio:
    statement: residual_collision_rate_ratio ≈ 1 when S ≈ N
    formula: observed_collisions / (T^2/(2N))
    kind: modeled
    band: [0.5, 2.0]
  C_curve_over_generic:
    statement: curve_over_generic_ratio in [0.5, 2] at matched T
    kind: modeled
    band: [0.5, 2.0]
    concentration_trigger: >-
      ratio outside [0.5, 2] OR excess >4x fires optional Stage 5 (n=19)
  D_certificate:
    statement: >-
      certificate_pass_rate = 1.0 under correct c; adversarial 8-bit
      truncated-key failure rate > 0
    kind: modeled_control
  E_stage0_floors:
    statement: >-
      log2 sqrt(2 N B) floors match HOLD-Q table 66.0/71.0/76.0/81.0 at
      B=1/2^10/2^20/2^30 for N=2^131
    kind: modeled
    verified_in: stage0/dominated-by-pricing.yaml
  full_relation_baseline:
    statement: >-
      Recombination-off full-relation yield matches free-leg landing
      rate ≈ T * |V| / N (equivalently balance heuristic order
      B^m/(m! N) with m=3 within lane tolerance)
    formula: p_full ≈ B^m / (m! N) with m=3; free-leg attempt yield ≈ T*|V|/N
    kind: modeled
  aligned_half:
    statement: >-
      V'_0 collision rate ≈ 2x full V if residuals confined to one coset
      of 2E (structural check, not a fail)
    kind: modeled
cell_RC1:
  n: 17
  N: 130412  # 4 * 32603
  m: 3
  l: 9
  V: polynomial_basis_window_deg_lt_9
seeds:
  stage2_subsamples: [20261001, 20261002, 20261003]
  stage3_windows: [20261001, 20261002, 20261003]
optimistic_assumptions_restated:
