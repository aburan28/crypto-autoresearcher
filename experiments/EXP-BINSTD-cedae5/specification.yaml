# =============================================================================
# EXP-BINSTD-cedae5 -- VERSION 1 (APPROVED by DEC-20261001-ada211) frozen
# contract for H-BINSTD-fe6b59: Stage 0 HOLD-Q dominated_by pricing +
# methodological note; Stage 1 RC-1 exhaustive free-leg large-prime census;
# Stage 2 T-growth curve; Stage 3 Z/(4l) generic replica; Stage 4
# adversarial truncated-key control; optional Stage 5 n=19 sibling.
#
# Source: IDEA-20260922-c2bbe6 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Absorbs HOLD-Q review defects from
# analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-c2bbe6.yaml
# (verdict dominated; agreement: honest toy-tier revision): dominated_by
# filled with sqrt(2 N B); toy scope forced; Z/(4l) control; KN-LIT-164/
# 92caf4 cited as kb without adopting GTTD; recalled attributions flagged.
#
# ZERO RUNS in this design packet. Stages 0-4 authorized for later
# executor TASK-20261001-e57118. Optional Stage 5. No AUXIN.
# Amazon Bedrock prohibited. packaging_only false.
#
# certificate.kind vocabulary (docs/claims-and-verification.md):
#   discrete_log | decomposition | key_recovery | none
# Runs that claim combined/full relations MUST use certificate.kind:
# decomposition and re-verify independently. Metric-only / Stage-0
# arithmetic manifests use none.
# =============================================================================
experiment:
  id: EXP-BINSTD-cedae5
  hypothesis_id: H-BINSTD-fe6b59
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-c2bbe6
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    HOLD-Q toy free-leg large-prime accumulator on RC-1; birthday vs
    Z/(4l) replica; dominated_by sqrt(2 N B) priced; no deployed bearing
  status: analyzed
  approved_by: DEC-20261001-ada211
  approved_at: '2026-10-01'
  analyzed_by: DEC-20261001-fe73db
  analyzed_at: '2026-10-01'
  packaging_only: false
  approval:
    approved_by: DEC-20261001-ada211
    composing_decision: DEC-20261001-ada211
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Does NOT claim a break or rho
      competitiveness. HOLD-Q defects absorbed. GTTD form NOT authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3, 4]
    optional_stages: [5]
    scientific_execution_authorized_note: >-
      Stages 0-4 are the required success path (pricing derivation, RC-1
      census, T-growth, Z/(4l) replica, adversarial control). Stage 5
      (n=19) runs ONLY if Stage 1/3 show curve-specific residual
      concentration (curve/generic ratio outside [0.5,2] or excess >4x).
      Toy n<=41 only. No deployed-curve attacks. No Amazon Bedrock.
      No GTTD oracle measurement in this contract.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (A) Freeze HOLD-Q dominated_by pricing (sqrt(2 N B) vs matched rho on
    ECC2K-130) and Stage-0 methodological note before any scientific run.
    (B) Exhaustively census free-leg residuals on RC-1 (n=17, m=3) for
    polynomial-window V and aligned-half V'_0; bank residuals; merge
    combined relations; re-verify every combined relation by summing to O.
    (C) Trace combined-relation growth vs T against T^2/(2S).
    (D) Replicate collision statistics in Z/(4*32603) with a random
    matched-size window (blocking uniformity control).
    (E) Confirm truncated-key adversarial control has certificate power.
    Claim no deployed attack and no GTTD result.

  class: heuristic_validation
  class_note: >-
    Heuristic-validation / toy instrument measurement for HEUR-BINSTD-
    fe6b59-H0 (birthday residual uniformity) and H1 (merge cost). Not a
    cost-model claiming cryptanalytic impact. Measured vs modeled columns
    stay separate. No exponent-moving claim. HOLD-Q forces zero deployed
    bearing.

  corrections_absorbed:
    hold_q_dominated_by_filled: >-
      dominated_by states T≈sqrt(2 N B) with ECC2K-130 floors
      (≥2^66.0 at B=1 vs rho ≈2^60.809) and plain free-leg Θ(N); cites
      IDEA-20260926-1db0e8 sharpening. Written in Stage 0 before runs.
    hold_q_toy_tier_only: >-
      Frozen claim is toy relation-collection instrument (n≤41); not a
      primary deployed collector.
    hold_q_gttd_not_adopted: >-
      GTTD double-large-prime is successor_seam / G1 lane; KN-LIT-164 and
      KN-LIT-92caf4 cited as kb corpus context only; not implemented here.
    hold_q_zn_control: >-
      Relabelled Z/(4l) replica with random matched-size window is a
      required Stage 3 control.
    hold_q_citation_flags: >-
      Joux-Vitse / classical sieve LP remain recalled; free-leg arithmetic
      re-derived in Stage 0 rather than trusted from unread detail.

  scope:
    included:
      - >-
        Stage 0: write dominated-by-pricing.yaml (recompute sqrt(2 N B)
        floors at B in {1,2^10,2^20,2^30} for N=2^131 vs rho 2^60.809);
        canonicalisation-convention.md; preregistered-predictions.yaml;
        methodological-note.md absorbing HOLD-Q; literature-note.yaml
        for KN-LIT-164/92caf4 (kb; PDF unread).
      - >-
        Stage 1: on RC-1 (n=17, f=t^17+t^3+1, A=97044, B=126251,
        #E=4*32603) enumerate unordered pairs from V={deg<9} (~512 pts)
        and separately V'_0={c_0=0}; compute L=-(P1+P2); canonicalise by
        x(L); hash+union-find; count full and combined relations;
        re-sum every combined relation to O; residual histogram; report
        recombination-off baseline yield.
      - >-
        Stage 2: random subsets T in {B,2B,4B,...} with recorded seeds;
        growth curve of combined relations vs T^2/(2S).
      - >-
        Stage 3: Z/(4*32603) replica with random 512-subset window;
        same metrics; curve_over_generic_ratio.
      - >-
        Stage 4: truncate hash key to 8 bits; confirm certificate failure
        rate measurably >0.
      - >-
        Stage 5 (OPTIONAL): n=19 Koblitz sibling only if concentration
        trigger fires.
    excluded:
      - Any scientific ECDLP / GHS / decomposition attack at m >= 41 bits field
      - GTTD double-large-prime oracle measurement or adoption
      - Claiming the mechanism beats matched rho on any deployed curve
      - Treating hash table as F7 advice for unrelated future targets
      - AUXIN edits
      - Amazon Bedrock
      - Claiming a break or any curve's attack cost
      - Quietly editing IDEA-20260922-c2bbe6 claim text
      - Using non-vocabulary certificate.kind values

  inputs:
    proposal: ledger/proposals/IDEA-20260922-c2bbe6.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-c2bbe6.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-fe6b59.yaml
    dominated_by_input: ledger/proposals/IDEA-20260926-1db0e8.yaml
    literature:
      - knowledge/literature/KN-LIT-164.md
      - knowledge/literature/KN-LIT-92caf4.md
    rho_baseline: knowledge/findings/KN-FIND-aa2efc.md
    related_designs:
      - ledger/proposals/IDEA-20260922-6cf862.yaml
      - ledger/proposals/IDEA-20260806-9d47e2.yaml
    code_refs:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/instances.py
    cells:
      Stage0-pricing:
        N_ecc2k130: '2^131'
        matched_rho_log2: 60.809
        B_grid: [1, 1024, 1048576, 1073741824]
        formula: T = sqrt(2 * N * B)
      BIN-TOY-RC1:
        n: 17
        irreducible: t^17 + t^3 + 1
        A: 97044
        B_curve: 126251
        group_order: 4 * 32603
        m: 3
        l: 9
        V: polynomial_basis_window_deg_lt_9
        V_prime_0: aligned_half_c0_eq_0
        role: primary_exhaustive_census
      BIN-TOY-generic-replica:
        group: Z/(4*32603)
        window: random_matched_size
        role: blocking_uniformity_control
      BIN-TOY-optional-n19:
        n: 19
        curve: y^2 + xy = x^3 + 1
        role: optional_concentration_followup

  controls:
    - name: recombination_off_null
      object: >-
        Plain free-leg at same cells; zero phantom combined relations;
        full-relation yield matches B^m/(m! N) within lane tolerance.
    - name: zn_generic_replica
      object: >-
        Z/(4*32603) with random matched |V|; collision stats must agree
        with the curve within [0.5,2] ratio or excess is curve structure.
    - name: adversarial_truncated_key
      object: >-
        8-bit truncated hash key; certificate failure rate must be
        measurably nonzero.
    - name: aligned_half_window
      object: >-
        V'_0 predicts ~2x collision rate vs full V if residuals confined
        to one coset of 2E (structural check, not a fail).
    - name: certificate_resum
      object: >-
        Every claimed combined/full relation re-sums to O on a freshly
        constructed curve object; zero tolerance under correct c.
    - name: f2_not_f7_boundary
      object: >-
        Hash table consumed within one sweep; no artefact claimed reusable
        for a different unrelated target without re-derivation.
    - name: certificate_kind_vocabulary
      object: >-
        Every run manifest result.certificate.kind is one of
        discrete_log | decomposition | key_recovery | none.
    - name: no_break_guard
      object: No break / attack-cost / rho-beating claim in any artifact.
    - name: seed_control
      object: Stage 2 subsamples use recorded seeds {20261001,20261002,20261003}.

  independent_variables:
    - arm  # curve_V | curve_V0 | generic_replica | adversarial | recombination_off
    - n
    - m
    - window_kind  # poly_deg_lt_9 | aligned_half | random_zn
    - T
    - seed
    - hash_key_bits

  metrics:
    primary:
      - full_relation_count
      - combined_relation_count_per_T
      - certificate_pass_rate_combined
      - residual_collision_rate_ratio
      - curve_over_generic_ratio
      - attempts_to_B_relations_log2
      - residual_support_S_fitted
    secondary:
      - residual_value_histogram
      - max_residual_multiplicity
      - merge_wall_clock_s
      - collection_wall_clock_s
      - merge_fraction
      - union_find_amortised_ops
      - adversarial_certificate_failure_rate
      - peak_rss_bytes
      - termination_reason

  heuristic_under_test:
    - HEUR-BINSTD-fe6b59-H0
    - HEUR-BINSTD-fe6b59-H1

  preregistered_prediction:
    quantity: >-
      (A) Combined-relation count after T attempts ≈ T^2/(2S) with S
      measured from residual histogram (and compared to S=N).
      (B) residual_collision_rate_ratio ≈ 1 when S≈N.
      (C) curve_over_generic_ratio in [0.5, 2] at matched T.
      (D) certificate_pass_rate = 1.0 under correct c; adversarial failure
      rate > 0 under 8-bit truncation.
      (E) Stage 0: log2 sqrt(2 N B) floors match HOLD-Q table
      (66.0 / 71.0 / 76.0 / 81.0 at B=1/2^10/2^20/2^30 for N=2^131).
    formula: >-
      E[matched pairs] = T^2/(2S); T_B ≈ sqrt(2 S B); full-relation
      baseline p_full ≈ B^m/(m! N) with m=3.
    source: >-
      IDEA-20260922-c2bbe6 H-c2bbe6-0; HOLD-Q concrete_experiment and
      A13/sqrt(2 N B) pricing; H-BINSTD-fe6b59. Classical birthday bound
      marked recalled where not derived here.
    claim_tier: observational
    measured_vs_modeled: >-
      Combined counts, histograms, certificate pass/fail, wall_s, RSS are
      MEASURED. T^2/(2S) and sqrt(2 N B) floors are MODELED predictions
      written in Stage 0 before Stage 1 and never retuned to Stage 1+ data
      without a protocol_amendment. S fitted from the histogram is a
      MEASURED nuisance parameter for comparing the modeled curve.

  scale_relevance:
    tier: toy
    justification: >-
      Primary cell n=17 (RC-1) vs deployed ECC2K-130 n=131. Contribution
      is instrument validation of residual banking + uniformity, plus
      honest domination pricing — not a transfer claim to deployed rows.
    correspondence: >-
      None exact. HOLD-Q explicitly forbids reading toy success as
      deployed bearing. Transfer assumption: NONE claimed.

  tail_checks:
    - Maximum residual multiplicity vs uniform prediction at same T.
    - Smoothest/heaviest residual bucket reported explicitly.
    - attempts_to_B_relations compared to both sqrt(2 N B) and N.
    - Aligned-half V'_0 collision rate vs full V (~2x predicted).

  replication:
    seeds:
      - 20261001
      - 20261002
      - 20261003
    independent_instances: >-
      Stage 0 is deterministic arithmetic (seed-free). Stage 1 exhaustive
      census is deterministic given frozen RC-1 and window definition.
      Stage 2 uses the three seeds for random T-subsamples. Stage 3 draws
      one primary random window (seed 20261001) plus two replicates
      (20261002, 20261003). Stage 4 deterministic given Stage 1 table.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 24
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete when pricing, convention, predictions, literature note, and methodological note are written BEFORE Stage 1.
    - Stage 1 complete when both V and V'_0 censuses report full/combined counts, 100% certificate pass under correct c (or hard fail), and residual histograms.
    - Stage 2 complete when growth curve for the listed T grid is written for at least one window.
    - Stage 3 complete when curve_over_generic_ratio is reported for primary seed (replicates optional but preferred).
    - Stage 4 complete when adversarial failure rate is reported and is >0 (or hard instrument fail if =0).
    - Stage 5: run only on concentration trigger; else write skip-not-triggered.yaml.
    - Advisory wall-clock: checkpoint and report; never fabricate completion.

  invalidation_rules:
    - Stage 0 pricing disagrees with HOLD-Q floors without identified arithmetic bug
    - Claiming rho-beating or deployed attack cost
    - Implementing GTTD oracle under this EXP id without amendment
    - timeout/crash/OOM → failed_infrastructure, not negative math evidence
    - Amazon Bedrock invocation attempted → abort
    - certificate.kind outside vocabulary → invalid run
    - Combined relation claimed without independent re-sum to O
    - Editing IDEA-20260922-c2bbe6 claim text

  success_criterion: >-
    Stage 0: dominated-by-pricing + predictions + methodological note
    committed before Stage 1.
    Stage 1: RC-1 V and V'_0 censuses with certificate_pass_rate=1.0 under
    correct c (or documented hard fail).
    Stage 2: growth curve present.
    Stage 3: curve_over_generic_ratio reported.
    Stage 4: adversarial failure rate >0.
    Decidable from predefined metrics. Positive birthday agreement does
    NOT authorize a deployed claim.

  falsification_criterion: >-
    Certificate failure under correct c; OR truncated-key failure rate
    =0; OR combined count off T^2/(2S) by >factor 2 at T<=sqrt(S) with
    no structural explanation; OR curve/generic ratio outside [0.5,2]
    without Stage-5 plan / structural report; OR any rho-beating claim.

  required_artifacts:
    - experiments/EXP-BINSTD-cedae5/stage0/dominated-by-pricing.yaml
    - experiments/EXP-BINSTD-cedae5/stage0/canonicalisation-convention.md
    - experiments/EXP-BINSTD-cedae5/stage0/preregistered-predictions.yaml
    - experiments/EXP-BINSTD-cedae5/stage0/methodological-note.md
    - experiments/EXP-BINSTD-cedae5/stage0/literature-note.yaml
    - experiments/EXP-BINSTD-cedae5/stage1/census-V.yaml
    - experiments/EXP-BINSTD-cedae5/stage1/census-V0.yaml
    - experiments/EXP-BINSTD-cedae5/stage1/residual-histogram-V.json
    - experiments/EXP-BINSTD-cedae5/stage1/recombination-off-baseline.yaml
    - experiments/EXP-BINSTD-cedae5/stage2/growth-curve.yaml
    - experiments/EXP-BINSTD-cedae5/stage3/generic-replica.yaml
    - experiments/EXP-BINSTD-cedae5/stage3/curve-over-generic.yaml
    - experiments/EXP-BINSTD-cedae5/stage4/adversarial-truncated-key.yaml
    - experiments/EXP-BINSTD-cedae5/stage5/  # metrics or skip-not-triggered.yaml
    - experiments/EXP-BINSTD-cedae5/runs/*/manifest.yaml
    - experiments/EXP-BINSTD-cedae5/runs/*/raw-result.json
    - experiments/EXP-BINSTD-cedae5/runs/*/stdout.log

  procedure:
    stage0:
      - Recompute log2(sqrt(2*N*B)) for N=2^131 and B in {1,2^10,2^20,2^30}; write dominated-by-pricing.yaml vs rho 2^60.809.
      - Write canonicalisation-convention.md (sign fold via x(L); optional Frobenius note).
      - Write preregistered-predictions.yaml BEFORE Stage 1.
      - Write literature-note.yaml citing KN-LIT-164 and KN-LIT-92caf4 as kb; disclose PDF unread; GTTD out of scope.
      - Write methodological-note.md absorbing HOLD-Q defects.
    stage1:
      - Construct RC-1 from frozen (A,B,f); verify #E = 4*32603.
      - Enumerate unordered pairs in V; bank residuals; merge; certificate re-sum.
      - Repeat for V'_0.
      - Run recombination-off baseline counts.
      - Write census YAML + histograms.
    stage2:
      - For seeds in {20261001,20261002,20261003}, subsample T in {B,2B,4B,...}; record combined counts vs T^2/(2S).
    stage3:
      - Build Z/(4*32603) replica with random matched window; compare histograms and growth.
    stage4:
      - Re-run Stage-1 matching with 8-bit truncated keys; report certificate failure rate.
    stage5_optional:
      - If curve/generic ratio outside [0.5,2] or excess >4x: replicate census at n=19 Koblitz sibling.
      - Else: write stage5/skip-not-triggered.yaml.

  optimistic_assumptions:
    - assumption: >-
        Residual support S ≈ N for subspace/window bases at toy scale
      bias_direction: >-
        If S << N, combined yield is HIGHER than uniform-N prediction
        (mechanism looks better at toy); if S > modeled support, worse.
        Mitigated by measuring S and by Z/(4l) control.
    - assumption: >-
        Pair enumeration cost is negligible vs interpretation value at
        ~1.3e5 pairs
      bias_direction: Understates engineering cost at larger B; disclosed toy only.

  memory_accounting: >-
    Hash table and union-find store O(T) entries (T ≤ C(B_window,2) ≈ 1.3e5
    for exhaustive Stage 1). Report measured peak_rss_bytes beside counts.
    No deployed-scale table memory claimed. IDEA-20260926-1db0e8's
    ~2^58 sqrt(B) deployed memory floor is cited in dominated_by only.

  assigned_to: executor
  dominated_by: >-
    Matched Pollard rho on standardized binary rows (ECC2K-130 ≈2^60.809).
    Free-leg large-prime cost floor sqrt(2 N B) ≥ 2^66 at B=1. This
    experiment is a toy instrument, not an attack-cost improvement.
  sota_delta:
    time: Zero exponent; toy birthday/instrument measurement only.
    memory: O(T) at toy T; disclosed.
    data_queries: N/A; adds a validated toy residual-banking instrument.
  impediments_declared:
    - id: IMP-numpy-e94b27
      what_is_blocked: Stage 1+ curve arithmetic via EXP-CERTBIN-e94b27/impl
      condition: >-
        gf2n.py/curve.py top-level import numpy; numpy may be absent
        (HOLD-Q zero_run_prerequisites)
      clears_when: >-
        numpy is importable OR a lifted scalar path under
        experiments/EXP-BINSTD-cedae5/implementation/ removes the dependency
      recheck: >-
        python3 -c 'import numpy; print(numpy.__version__)' ;
        ls experiments/EXP-BINSTD-cedae5/implementation/
      asserts_nothing_about: >-
        Stage 0 pricing arithmetic, HOLD-Q domination, or birthday heuristic
        truth at deployed scale
    - id: IMP-gttd-out-of-scope
      what_is_blocked: GTTD double-large-prime / oracle-cost measurement
      condition: >-
        HOLD-Q successor_seam assigns GTTD to G1 lane; this EXP does not
        authorize it
      clears_when: >-
        A separate Coordinator-approved EXP under the G1/CERTBIN seam
        freezes an oracle-cost protocol citing KN-LIT-92caf4
      recheck: >-
        rg -n 'GTTD|KN-LIT-92caf4|double.large' ledger/handoffs/TASK-20261001-*.yaml
        experiments/EXP-*/specification.yaml | head
      asserts_nothing_about: >-
        Toy free-leg single-large-prime instrument validity at n<=41
