experiment:
  id: EXP-PAIR-4da326
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-6c7540
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE EMBEDDING DEGREE IS THE MULTIPLICATIVE ORDER OF A SMALL INTEGER MODULO A LARGE PRIME,
    AND THAT MAKES ITS DISTRIBUTION VALIDATABLE AT CRYPTOGRAPHIC SIZE WITHOUT CONSTRUCTING A SINGLE
    CURVE - from N | #E(F_p) one gets p = t - 1 (mod N), so k = ord_N(t-1) with |t-1| <= 2 sqrt(p)
    + 1; the distribution of k can therefore be sampled directly over (N, t) pairs at 256-bit N, and
    compared against the classical theorem it imitates (Erdos-Murty 1999 - the order of a fixed integer
    a modulo p exceeds p^{1/2 + eps(p)} for all but o(pi(x)) primes), rather than being asserted from
    a relayed probability bound'
  status: draft
  objective: "(A) THE IDENTITY AND WHY IT CHANGES THE EXPERIMENT. For a prime N dividing #E(F_p) =\
    \ p + 1 - t we have p = t - 1 (mod N), hence\n    k = ord_N(p) = ord_N(t - 1),\nand when N > 2\
    \ sqrt(p) + 1 the residue is LITERALLY the integer t - 1, whose absolute value is at most 2 sqrt(p)\
    \ + 1 by Hasse. So the embedding degree of a near-prime-order curve is the multiplicative order\
    \ of a comparatively SMALL integer modulo a large prime. This is exactly the regime of the classical\
    \ analytic results on multiplicative order, and it is a strictly different random model from \"\
    the order of a uniformly random residue\".\n(B) THE SAMPLING SHORTCUT, WHICH IS THE POINT OF THE\
    \ PROPOSAL. Because k depends only on (N, t) and not on the curve, the distribution of k can be\
    \ sampled by generating PAIRS rather than curves - choose a target size, choose t with |t| <=\
    \ 2 sqrt(p), set #E = p + 1 - t, and keep the cases where #E has a large prime factor N. No curve\
    \ is ever constructed, no CM equation is solved, no point counting is done. Existence of a curve\
    \ with that (p, t) is guaranteed for every t with |t| <= 2 sqrt(p) and gcd(t, p) = 1 by the Deuring/Honda-Tate/Waterhouse\
    \ classification, so the sampled pairs are not fictional - they correspond to real isogeny classes.\
    \ THE CONSEQUENCE - the distribution of the embedding degree can be measured AT CRYPTOGRAPHIC\
    \ SIZE (N of 256 bits and above), which the rest of this campaign cannot do for any other quantity.\
    \ This program's standing statement about the embedding degree (KN-TECH-032, quoting KN-LIT-086\
    \ and a Luca-Mireles-Shparlinski restatement) is a relayed asymptotic bound that has never been\
    \ checked here against data at any size.\n(C) WHAT IS MEASURED, AND AGAINST WHICH TWO NULLS. For\
    \ each sampled (N, t) -\n  the exact k when N - 1 factors, otherwise the certified bound k > K;\n\
    \  the ratio log k / log N, which is the quantity Erdos-Murty bounds;\n  the empirical CDF of\
    \ log k / log N.\nNULL ONE, THE WRONG RANDOM MODEL - the same statistic computed for ord_N(a)\
    \ with a a UNIFORMLY RANDOM residue mod N. If the two distributions agree, then the smallness\
    \ of t - 1 is irrelevant and the simpler model suffices; if they differ, the difference is the\
    \ CM-side content of the measurement and the record must report which model the data supports.\
    \ NULL TWO, THE SHUFFLED PAIRING - compute ord_{N'}(t-1) where N' is a random prime of the same\
    \ size NOT arising as a divisor of p + 1 - t. This destroys the arithmetic relation between t\
    \ and N while preserving both marginals, and it is the matched null object of the same shape.\
    \ Any structure surviving it is a property of the relation, which is the only thing that could\
    \ be interesting.\n(D) THE TWO OUTCOMES, BOTH DELIVERABLES. OUTCOME 1 - the data match the classical\
    \ prediction. Then this program's genericity claim is validated at cryptographic size for the\
    \ first time, the relayed bound is replaced by measured data, and the safe-scope statement of\
    \ IDEA-20260807-98a970 rests on something checked here. OUTCOME 2 - the data show a systematic\
    \ excess of small k relative to both nulls. Then the constraint linking t and N is doing something,\
    \ and since that constraint is exactly the CM/Hasse structure of the curve, it would be a CM-side\
    \ effect on the embedding degree - which contradicts IDEA-20260807-653dda's independence claim\
    \ and would be the most surprising result available in this lane. The record commits to reporting\
    \ either."
  resource_label: R7 (pairings into F_{p^k}), in scoping mode - the record measures the distribution
    of the R7 precondition and mounts no transfer.
  admissibility: admissible
  admissibility_argument: Admissible - the embedding degree is a representation-level integer, not
    a group-operation output, so it is not covered by KN-FIND-b7e091, and nothing here applies an
    endomorphism to a point of G, so the H-ENDO-001 filter does not bite. The measurement supports
    no attack, which is the expected finding.
  reachability_gate: NOT A MOVE BETWEEN CURVES. The record does, however, answer a reachability question
    in the DESIGNER's direction, which is where reachability is real - it measures how many random
    attempts a designer would need to stumble onto a small k, and the predicted answer is "more than
    any sampling budget", which is why pairing-friendly curves must be constructed rather than found.
    For the ATTACKER the pair (N, t) is a class invariant and there is nothing to walk to (IDEA-20260807-b92080).
  inputs:
    procedure: 'STAGE 0 (hours): literature check for an existing measurement of the embedding-degree
      distribution; transcribe Erdos-Murty into knowledge/literature; attempt to transcribe Boxall
      (KN-LIT-313) for the tail comparison. STAGE 1 (HARD GATE, minutes): the toy fixture - 1000 pairs
      at 32 bits, orders by two independent methods, exact agreement required. STAGE 2 (HARD GATE,
      minutes): the supersingular-trace control and the injected known-small-k control. STAGE 3 (hours):
      sample 10^5 pairs at 32, 64 and 128 bits with exact k. STAGE 4 (hours to days): sample 10^4
      to 10^5 pairs at 192, 256 and 384 bits with exact k where N-1 factors and certified bounds otherwise.
      STAGE 5 (hours): both nulls on the identical pipeline. STAGE 6: the CDF comparison and the tail
      table. THE CHEAPEST DECISIVE SUBSET is Stages 1-3, which already tests H1 at three sizes and
      costs under an hour.'
    mechanism: 'STEP 1 - THE SAMPLER. For each target size s in {32, 64, 128, 192, 256, 384} bits,
      repeat - draw a prime p of s bits, draw t uniformly in [-2 sqrt(p), 2 sqrt(p)] with gcd(t, p)
      = 1, form #E = p + 1 - t, extract its largest prime factor N (by trial division and ECM at toy
      sizes; at large sizes, by REJECTION - draw until #E is prime or has a large prime factor that
      can be certified). Record (p, t, N, cofactor). STEP 2 - THE ORDER. Compute ord_N(t-1) exactly
      where N - 1 factors, using the standard prime-power descent; otherwise emit the certified lower
      bound k > K by K modular multiplications, as in IDEA-20260807-98a970. Record which route each
      sample took. STEP 3 - THE TWO NULLS of (C), on the identical pipeline with the identical order
      routine. STEP 4 - THE COMPARISON. Empirical CDF of log k / log N per size, against (i) the uniform-residue
      null, (ii) the shuffled-pairing null, (iii) the Erdos-Murty prediction that the statistic exceeds
      1/2 + eps for all but a vanishing fraction. Report Kolmogorov-Smirnov statistics between arms
      and the exact count of samples with log k / log N below 1/2. STEP 5 - THE TAIL CHECK, which
      is where a surprise would live. Report the SMALLEST k observed at each size, the number of samples
      with k below 10^3, 10^6 and 10^9, and compare against the count predicted by the relayed KN-LIT-086
      bound at the same sample size. A tail heavier than predicted is the only outcome that would
      matter cryptographically, and it is checked explicitly rather than left to the bulk statistic
      to hide.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - toy fixture with two independent order computations
  - supersingular traces, which must report small k
  - injected pairs with a planted k = 12
  - uniform-residue null
  - shuffled-pairing null
  - bit-size sweep as the decay parameter
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, and there are two because they fail
    differently. NULL ONE (wrong random model) - ord_N(a) for a uniformly random a mod N. Same pipeline,
    same order routine, same sample size. If the measured arm matches this, then the smallness of
    t - 1 does nothing and the record must say the embedding degree behaves like a generic order.
    NULL TWO (matched object of the same shape, and the blocking one) - the SHUFFLED PAIRING ord_{N''}(t-1)
    with N'' a random prime of the same bit length drawn independently of t. This preserves both marginals
    - the distribution of t, and the distribution of prime sizes - and destroys only the arithmetic
    relation N | p + 1 - t. Any effect that survives Null Two is a property of the relation; any effect
    that does not survive it is a marginal artifact. DECAY PARAMETER - the bit size s. Any apparent
    excess of small k must DECAY as s grows, because the density of small orders falls with N. An
    excess that is flat or growing in s is the canonical artifact tell of docs/inventor-protocol.md
    and, in this pipeline, has a specific likely cause named in advance - the rejection sampling for
    large prime factors correlates t with the smoothness of #E, which can correlate with the smoothness
    of N - 1, which directly biases the order. That correlation must be measured, not assumed absent.
    INSTRUMENT POSITIVE - inject pairs with a KNOWN small k (take N and set t - 1 to a small-order
    element mod N, e.g. an element of order 12) and confirm the pipeline reports k = 12. A distribution
    instrument that has never seen a small k cannot be trusted to report their absence.'
  independent_variables: []
  metrics:
    primary:
    - per sample - (p, t, N, cofactor, k or its certified bound, which route)
    - empirical CDF of log k / log N per size, per arm
    - KS statistics between arms with critical values
    - tail table - smallest k and counts below 10^3, 10^6, 10^9 per size
    secondary:
    - mutual information between the two smoothness profiles (H2)
    - wall-clock and the fraction of samples receiving an exact k rather than a bound
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Kolmogorov-Smirnov distance between the CDF of log k / log N for real (N, t) pairs and
      for the uniform-residue null, per bit size
    formula: Predicted BELOW the 0.05 critical value at every tested size, i.e. no detectable difference.
      A significant difference means the smallness of t-1 matters and H1 is refuted in its stated
      form, which would be a genuine finding about the arithmetic of embedding degrees.
    source: pre-registered in IDEA-20260807-6c7540 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - 'Rejection sampling bias, which is H2 and is the dominant risk. Requiring a large prime factor
    conditions on the smoothness of #E and can propagate into the smoothness of N-1. Measured directly
    rather than assumed away.'
  - Censoring by the certified-bound fallback. Samples that receive only k > K are censored observations,
    and computing a CDF over a mixture of exact and censored values without saying so would misstate
    the distribution. Every reported CDF must state its censoring fraction.
  - The Hasse-interval endpoints. Traces near the extremes have different arithmetic behaviour (t^2
    - 4p near zero), and t = 1 (anomalous) and t = 2 (k = 1) are degenerate points that must be reported
    separately rather than absorbed into the bulk.
  - Confusing this measurement with a statement about STANDARD curves. Standard curves are not sampled
    uniformly; they are generated by specific procedures and are audited separately in IDEA-20260807-98a970.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Predicted BELOW the 0.05 critical value at every tested size, i.e. no detectable
    difference. A significant difference means the smallness of t-1 matters and H1 is refuted in its
    stated form, which would be a genuine finding about the arithmetic of embedding degrees.
  falsification_criterion:
  - The real arm differing significantly from BOTH nulls in the direction of smaller k, with the effect
    surviving the bit-size decay sweep. H1 is refuted, the arithmetic relation between t and N matters,
    and this is the lane's most valuable possible outcome.
  - Any 256-bit sample with k below 10^9. Reported individually with a certificate; a genuine one
    would be a material observation about the density of pairing-friendly parameters.
  - The mutual-information check refuting H2. The sampler is biased; repair before reporting anything
    else. This is an instrument failure, not mathematics.
  - The toy fixture's two order computations disagreeing. Arithmetic bug; halt.
  - Supersingular traces reported as generic. The instrument cannot see small k and no absence of
    small k is interpretable.
  - Inability to factor enough N-1 at 256 bits to build a CDF. INFRASTRUCTURE outcome under AGENTS.md
    rule 5 - report the bound-only CDF, which is a censored distribution and must be labelled as such,
    never as the distribution of k.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
