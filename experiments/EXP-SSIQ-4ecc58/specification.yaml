# =============================================================================
experiment:
  id: EXP-SSIQ-4ecc58
  hypothesis_id: H-SSIQ-d724f2
  question_id: RQ-SSIQ-9702af
  source_idea: IDEA-20260930-024033
  goal_id: GOAL-SSIQ-001
  version: 1
  title: >-
    Holonomy census of S-smooth order elements in GL_2(Z/N) at first two
    panel primes, N∈{5,7}
  status: approved
  approved_by: DEC-20261003-9f9c4f
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261003-9f9c4f under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    Deuring sampler. No isogeny walk. No p^{1/4} claim. Stage 2 off.
  approval:
    approved_by: DEC-20261003-9f9c4f
    composing_decision: DEC-20261003-9f9c4f
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes primes, N, S, formula, obligations, Cayley/iso twins.
      Stage 1 runs holonomy census on first two primes × N∈{5,7}; writes
      RESULTS.md with exactly one O-* label.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether readable Stage-1 holonomy cells have index 1 and trivial
    SL abelianisation (O-CLOSED) or a larger path-independent abelian
    quotient (O-OPEN); deliver exactly one O-* label from H-SSIQ-d724f2.

  class: heuristic_validation
  class_note: >-
    Pre-registered index/ab bands on a quaternion-to-GL_2 instrument.
    Not an exponent-moving breakthrough; no isogeny attack table.

  scope:
    included:
      - >-
        Stage 0. Freeze preregistered-predictions.json (cells as a list with
        integer p,N), fixtures.json (Cayley Z/12, O/NO iso, seven obligations),
        twin probe.
      - >-
        Stage 1. Holonomy census on first two panel primes × N∈{5,7};
        spine/null arms; stab prefixes; RESULTS.md with exactly one O-*.
    excluded:
      - Crypto-size Deuring sampling / Stage 2.
      - N in {2,3,4} census (even-modulus matrix map not on this card).
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Any p^{1/4} or exponent-moving claim.
      - Editing IDEA claim text or GOAL-SSIQ-001/goal.yaml.
      - Editing the frozen formula after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.

  execution_surface:
    trial_plan: experiments/EXP-SSIQ-4ecc58/trial-plan.json
    command_stage0: >-
      python3 experiments/EXP-SSIQ-4ecc58/implementation/run.py --stage 0
      --trial-plan experiments/EXP-SSIQ-4ecc58/trial-plan.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-SSIQ-4ecc58/implementation/run.py --stage 1
      --trial-plan experiments/EXP-SSIQ-4ecc58/trial-plan.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. Twin meters are the
      dual-implementation control. {run_dir} substituted by supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20260930-024033.yaml
    hypothesis: ledger/hypotheses/H-SSIQ-d724f2.yaml
    bit_floors: [1024, 2048, 4096, 8192, 16384]
    N_panel: [5, 7]
    S: [2, 3]
    max_sum: 12
    coord: 4
    stab_prefixes: [100, 200, 400]
    null_seed: 2026100303
    stage1_cells:
      - {role: first_two_primes, N: 5}
      - {role: first_two_primes, N: 7}

  controls:
    - name: twin_H
      definition: BFS path A (generator order) equals path B (reversed) as matrix sets.
    - name: ctl_cayley
      definition: Cayley Z/12 with {±1,±5} is abelian and full (positive nearby object).
    - name: ctl_spine
      definition: Z[sqrt(-p)] holonomy image is abelian; else O-ARTIFACT.
    - name: ctl_iso
      definition: Image of 1 is I; det of image equals reduced norm mod N.
    - name: ctl_null
      definition: 'Seeded random subgroup of equal |H| abelianised by identical code.'
    - name: ctl_p_gt_N4
      definition: Cells with p <= N^4 are reported unread (not scored as O-CLOSED/O-OPEN).
    - name: ctl_stab
      definition: "H_N order stable across prefixes 100/200/400 (clamped); else UNDETERMINED."
    - name: ctl_no_posthoc_formula_edit
      definition: Formula frozen in preregistered-predictions.json before Stage 1.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_census]
    - name: cell
      levels: [first_two_primes_x_N5, first_two_primes_x_N7]
    - name: arm
      levels: [full_order, spine, null]

  metrics:
    primary:
      - name: index
        unit: count
        definition: '[GL_2(Z/N)_S : H_N] when defined.'
      - name: ab_sl
        unit: count
        definition: Order of abelianisation of H_N ∩ SL_2(Z/N).
      - name: R_max
        unit: count
        definition: Largest path-independent abelian quotient order vs M=p^{1/3}.
      - name: twin_agreement
        unit: boolean
        definition: H_a = H_b on every measured cell.
    secondary:
      - name: order_H
        unit: count
      - name: spine_abelian
        unit: boolean
      - name: wall_clock_seconds
        unit: seconds
      - name: peak_rss_bytes
        unit: bytes

  heuristic_under_test: HEUR-SSIQ-024033-H1

  preregistered_prediction:
    quantity: >-
      E-CLOSED iff index=1 and |(H∩SL_2)^{ab}|=1 on every readable Stage-1
      cell with p>N^4 and N in {5,7}.
    formula: >-
      E-CLOSED iff index[GL2_S:H_N]==1 and | (H_N cap SL2)^ab |==1 for every
      Stage-1 cell with p>N^4 and N in {5,7}
    source: >-
      IDEA-20260930-024033 E-CLOSED/E-OPEN; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Panel primes at 2^10–2^14. Stage 1 uses the first two. No transfer of
      index=1 into a cryptographic-size closure is claimed (Stage 2 off).
    correspondence: >-
      Quaternion order of B_{p,infinity} is the Deuring counterpart of
      supersingular curves; this card maps O-elements, not curves.

  tail_checks:
    - Twin disagreement voids index claims (O-ARTIFACT).
    - Spine non-abelian voids the table (O-ARTIFACT).
    - p≤N^4 cells are unread.
    - "Unstable H_N order across prefixes -> UNDETERMINED, not O-CLOSED."

  seeds_and_replication:
    null_seed: 2026100303
    independent_instances: 2
    note: >-
      First two panel primes are independent instances. Twin BFS plus
      spine/null arms are the replication instrument.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and fixtures.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-SSIQ-d724f2.
    - maximum_runs = 4.
    - Do not open Stage 2 under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin/spine/iso failure → O-ARTIFACT; do not read index as support.
    - Claiming an exponent move / p^{1/4} → protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Running Deuring/isogeny-walk code as the success path → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok true on Cayley and iso fixtures;
    Stage 1 produces per-cell H_N order, index, ab_sl (or a named
    O-ARTIFACT/O-IMPEDIMENT/O-INCONCLUSIVE stop); RESULTS.md names exactly
    one O-* label from H-SSIQ-d724f2 with cited artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; post-hoc formula edit; spine non-abelian;
    Cayley control fail; a claimed exponent under this card. (O-OPEN and
    O-MIXED are valid scientific negatives of O-CLOSED, not protocol fails.)

  required_artifacts:
    - experiments/EXP-SSIQ-4ecc58/trial-plan.json
    - experiments/EXP-SSIQ-4ecc58/stage0/preregistered-predictions.json
    - experiments/EXP-SSIQ-4ecc58/stage0/fixtures.json
    - experiments/EXP-SSIQ-4ecc58/stage1/
    - experiments/EXP-SSIQ-4ecc58/RESULTS.md
    - experiments/EXP-SSIQ-4ecc58/runs/<RUN-SSIQ-*>/
    - experiments/EXP-SSIQ-4ecc58/implementation/run.py
    - experiments/EXP-SSIQ-4ecc58/implementation/check.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
