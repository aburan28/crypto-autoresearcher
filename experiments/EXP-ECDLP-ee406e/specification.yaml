      section-cost exponent.
    preregistered_prediction:
      quantity: On this cell the oracle multiplier is 1, (x1, y1) = (0, 0) satisfies the section identity,
        and the linear control has unique solution (4, 5).
      formula: 'Point check: 3^2 = 2^3 + 2 + 30 in F_31. Section form: x(t) = 2 + x1 t, y(t) = 3 + y1
        t, residual y^2 - x^3 - x - 30 is the zero polynomial at (x1, y1) = (0, 0). Control solution of
        u + 2v = 14 and u - v = -1 is (u, v) = (4, 5).'
      source: The formulas are the preregistered cell, checked by algebra in F_31 before any run. They
        are not a smoothness law and not SNFS-E4.
    success_criterion: The run records oracle_recovered true, oracle_multiplier 1, structured_contains_planted
      true, and random_contains_planted true, with random_solution_count equal to 1, at p = 31 and degree
      bound 1.
    falsification_criterion: The run records a complete cell in which oracle_recovered is false, or structured_contains_planted
      is false, or random_contains_planted is false, or random_solution_count is not 1. That result invalidates
      the instrument cell and does not decide the section-cost claim.
    decision_impact:
      on_positive: The instrument cell passed. A later amendment may add a degree-matched random system
        and a degree-of-regularity measurement. This pass does not authorize a claim that section search
        beats rho, and it does not close IDEA-20261009-581f5d.
      on_negative: The instrument cell failed. Do not schedule a cost-exponent stage from this runner.
        Repair the instrument by amendment. Do not read the failure as evidence that bounded-height sections
        are expensive.
    stopping_rules:
    - Stop after the single preregistered cell. Do not open another prime in this version.
    - The runner stops an enumeration only by finishing F_31^2 or by the process watchdog. It has no adaptive
      stopping rule.
    invalidation_rules:
    - A crash, timeout, or exception invalidates the instrument run. It is not evidence about section
      cost.
    - Changing p, the degree bound, the planted vector, or the control equations after this freeze requires
      an amendment. It is not a rerun of version 1.
