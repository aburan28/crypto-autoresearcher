protocol_amendment:
  amendment_id: AMD-20260926-f05de8
  experiment_id: EXP-ICEX-11c498
  hypothesis_id: H-ICEX-50e403
  source_idea_ids: [IDEA-20260909-0cb73b]
  version_from: 1
  version_to: 2
  authored_by: coordinator
  authored_at: '2026-09-26'
  approved_by: coordinator
  approval_decision: DEC-20260926-58da30
  batch_id: BATCH-739b32
  id_provenance: >-
    Tokens drawn with secrets.token_hex(3), checked absent from origin/main
    ledger/ and experiments/; confirm with tools/allocate_id.py --check.

  pre_data_status: No implementation, trial plan, run or output exists.

  precedence: >-
    Protocol version 2 = specification.yaml (v1, DEC-20260910-466b78) plus this
    file; this file governs where they differ.

  reason: >-
    The treatment object -- a prospectively frozen Kummer/Picard-bridge family
    (TRANSFER-H036), the K1P10F-R1 degree-nine kernel-descent construction
    (TRANSFER-H038) and the PO96AB-R1-F5F* family fixtures -- exists only as
    status text in the external ledger the user pasted on 2026-09-09
    (imported as IDEA-20260909-0cb73b). The in-repo snapshot
    inputs/autolab_research_ledger.md stops at TRANSFER-H008 and PO96 and
    contains no H036-H042 rows, producers, verifiers or family parameters.
    A cover family also DETERMINES its elliptic quotients, so generic hash
    fixtures cannot host it. This amendment freezes everything that does not
    depend on the family, and records the family as a source-acquisition
    impediment instead of inventing one.

  source_bindings:
    - id: TRANSFER-H036 (gate text)
      provenance: recalled
      location: >-
        User-pasted external ledger, 2026-09-09 session; imported verbatim in
        spirit by IDEA-20260909-0cb73b. Not an in-repo artifact.
      quoted_gate: >-
        must target ordinary prime-field groups, prove the target factor lies
        outside the saturated visible algebra, construct maps both ways, and
        beat native/rational-map/cover controls after normalization and all
        relation/descent costs. A matching Weil factor or factor-base orbit
        reduction is not novel by itself.
    - path: inputs/autolab_research_ledger.md
      section: TRANSFER-H001..H008, TRANSFER-P001, TRANSFER-NR-034..NR-054
      provenance: internal
      use: nearest in-repo precedent for cover relations, calibration and controls

  impediments:
    - id: IMP-SRC
      raised: '2026-09-26'
      condition: source artifacts absent
      what_is_blocked: >-
        Implementation and every scientific run of EXP-ICEX-11c498 (stage T).
      clears_when: >-
        The frozen family definition (curve equations or generating rule over
        each size, the correspondence/map formulas, and the saturated visible
        algebra basis) for TRANSFER-H036/H038 is committed to the repository
        with producer and verifier hashes, and a v3 amendment binds it.
      recheck: >-
        git grep -n -e 'TRANSFER-H03[6-9]' -e 'K1P10F' -e 'PO96AB-R1' origin/main -- inputs research
      asserts_nothing_about: the transfer hypothesis or its cost

  changes:
    - id: C-1
      field: inputs.curve_rule
      new: >-
        Treatment curves are the elliptic quotients of the frozen family at
        the three smallest family members with q in [2^15, 2^21), selected
        by a rule the v3 amendment must fix BEFORE any target is drawn
        (target-blind, per TRANSFER-H036). The "EXP-ICEX-11c498" entries of
        ic_leads_fixtures_v2.json (sha256
        543f49ca5304f4e61085305ca2ea01ccc0085298db26368d7362f96b1b6a5a45) are
        RESERVED as native-control curves of matching size (C-4) and are not
        treatment curves.
    - id: C-2
      field: cost unit
      new: >-
        As AMD-20260926-ced670 C-3 (F_p mult = 1, inversion = 10, affine
        elliptic addition = 13). Genus-2 Jacobian operations and every map
        evaluation are charged in the same field-operation units by
        instrumented arithmetic; no operation is charged as free "algebra".
    - id: C-3
      field: metrics.primary / verdict
      new: >-
        ratio := total charged cost (family construction amortized over the
        three sizes and reported unamortized, map construction, normalization,
        relation collection, sparse LA, 32 blind descents) / (13 * sqrt(q))
        per size, gate 0.886 per the spec. Pass iff ratio < 0.886 at all three
        sizes AND the visibility control C-4 passes AND every descent verifies
        k*G = Q. Scoped negative naming the first failing stage otherwise.
    - id: C-4
      field: controls (made concrete)
      new:
        visibility: >-
          Recompute relation rank with the relation space restricted to the
          saturated visible correspondence algebra; a hit whose rank is fully
          reproduced there is rejected (spec falsification clause).
        native: Semaev m = 5 MITM (AMD-20260926-3479cf B0) on the reserved native curves.
        rational_map_and_cover: >-
          Direct rational-map pullback and split-cover (product) controls,
          per the H036 gate text.
        baseline: Pollard rho with negation map, 64 targets per curve.
        accounting_audit: >-
          Independent checker rejects placeholder or unexecuted artifacts in
          any rho comparison (spec falsification clause).
    - id: C-5
      field: budget / execution_admission
      new: >-
        maximum_memory_gb 8, maximum_workers 1, maximum_runs 1 unchanged.
        currently_admitted stays false until IMP-SRC clears AND the
        machine-protection precondition holds (15-minute load <= 14, system
        volume >= 5 GiB free, repository volume >= 20 GiB free).

  affected_runs: []
  confirmatory_status: Confirmatory for everything frozen here; the family binding is pending (v3).
  claim_ceiling_unchanged: Toy fixtures; no cryptographic-size transfer.
