experiment:
  id: EXP-JINV-a539d6
  hypothesis_id: H-JINV-0e8819
  derived_from_idea: IDEA-20260807-477e40
  question_id: RQ-JINV-8fc13a
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Exact symbolic support, Newton polytope and BKK measurement of the Semaev decomposition system at
    a = 0 and b = 0 versus generic, with a representation null on u^6 b, a sixth-power nearby-object
    control, and an implementation-bound Groebner proxy reported as a proxy
  objective: >-
    The one uncertainty a run reduces is whether setting a = 0 or b = 0 is a DEGREE reduction, a
    SUPPORT reduction, or NOTHING on the polynomial system a solver actually sees. A run establishes
    (i) the monomial counts of unspecialised S_3, predicted 13 / 9 / 10, verified mechanically rather
    than by hand; (ii) which of the nine coefficients of the SPECIALISED m = 2 system in (x1,x2) vanish
    identically at a = 0 and at b = 0 for generic x_R, predicted NONE, which is the cheapest possible
    test of the premise every other proposal in this lane borrows and costs seconds; (iii) the
    per-variable degree, total degree, monomial count and mod-3 x-degree distribution of S_4 generic,
    at a = 0 and at b = 0; (iv) the Newton polytope vertices and BKK mixed volume of the specialised
    systems at m = 2 and m = 3 on the identical code path; and (v) an implementation-bound Groebner
    proxy on matched toy instances, reported as a proxy and never as a degree of regularity. NO SPEEDUP
    of any kind is claimed here or would follow from a run.
  what_this_is_not:
    - >-
      Not an attack and not a speedup. The output is a set of exact integers that either license or
      forbid downstream claims about "the equation is simpler on j = 0 curves"; it is filed as baseline
      calibration.
    - >-
      Not a claim about solving TIME. Two systems with the same support can have very different solving
      behaviour, and the support object is deliberately weak; its value is that it is exactly
      computable.
    - >-
      Not a degree-of-regularity measurement. sympy's Groebner routine is not an optimised F4 and its
      basis maximum degree is a property of the returned reduced basis, not of the computation.
    - >-
      Not a statement about other curve models. Everything here is short Weierstrass; the model
      question is owned elsewhere.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: "for arities m in {2,3}, at the declared primes, in short Weierstrass
      form, the monomial support, Newton polytope and BKK bound of the specialised decomposition system
      are (or are not) changed by a = 0 / b = 0, and S_4|_{a=0} is (or is not) confined to total
      x-degree congruent to 0 mod 3." WHAT DOES NOT FOLLOW: nothing about solving time, nothing about
      other curve models, nothing about m outside the tested set, nothing about the ECDLP, and no
      speedup. Even a positive degree reduction would apply only to curves already in a D_0 = -3 or
      D_0 = -4 isogeny class, because such a class cannot be walked to at any price.
  inputs:
    procedure: >-
      STEP 0 (minutes, symbolic, zero risk). Re-derive the monomial counts mechanically: build
      sympy.Poly(s3_expr(a,b), x1,x2,x3) over Q[a,b], count monomials, substitute a = 0 and b = 0, and
      count again. Assert 13 / 9 / 10. A mismatch means the hand derivation is wrong and everything
      downstream is re-based on the machine numbers before anything is reported. STEP 1 (minutes, THE
      CHEAPEST VALID DISCRIMINATOR). Specialise x3 := x_R symbolically over Q[a,b,x_R], collect in
      (x1,x2), and record which of the 9 coefficients vanish IDENTICALLY -- as polynomials in
      (a,b,x_R), not at sampled points -- under a = 0 and under b = 0. Assert: none, for generic x_R.
      STEP 2 (minutes). Verify the weighted-homogeneity: S_3|_{a=0} homogeneous of weight 4 with
      deg(b) = 3 and S_3|_{b=0} homogeneous of weight 4 with deg(a) = 2, by evaluating the weight of
      every monomial. STEP 3 (minutes to an hour). Compute S_4 = Res_t(S_3(x1,x2,t), S_3(x3,x4,t))
      generically, then at a = 0 and at b = 0, with the specialisation order FROZEN before the step and
      stated with every number. Record per-variable degree, total degree, monomial count, and for
      a = 0 the distribution of total x-degree mod 3. STEP 4 (minutes). Attempt factorisation of S_4,
      S_4|_{a=0} and S_4|_{b=0} over Q and over three declared F_p. A factorisation at a = 0 that does
      not occur generically is the one interesting event; report it and STOP, because it would need
      independent verification before anything else in this lane is run. STEP 5 (hours). Newton
      polytope vertices and BKK mixed volume for the specialised systems at m = 2 and m = 3, generic
      versus a = 0 versus b = 0, on the identical code path. STEP 6 (hours, the only arm costing real
      compute, run ONLY if Steps 1-5 produce a nonzero gap worth chasing). On matched toy instances,
      run the existing harness/semaev.py Groebner measurement on the three curve families and record
      the basis maximum degree, basis size and wall time, all labelled implementation-bound proxies.
    instrument: >-
      sympy over Q[a,b] for the support arm; harness/semaev.py's existing Groebner measurement for the
      empirical arm. ALL SUPPORT WORK IS DONE OVER Q[a,b] FIRST and only then reduced mod each declared
      p, and the two are reported separately, because at small p accidental coefficient collisions mod
      p can shrink support for reasons unrelated to a = 0. The frozen fixture reproducing
      harness/semaev.py's s3_expr and s4_expr term for term runs before any specialisation is computed.
      Recorded through harness/runner.py.
    parameters: >-
      Arities m in {2,3}. Three declared primes, each congruent to 1 mod 12 so that both the j = 0 and
      the j = 1728 families are ordinary and F_p-rational, verified by point counting before use.
      Groebner arm at p up to about 2^24. Three declared gauge parameters u for the representation
      null b -> u^6 b. Matched factor-base size and matched transported target across all three curve
      families. At least 5 factor-base seeds per curve family so within-family variance is known before
      any between-family comparison. x_R = 0 on a j = 0 curve with b a square is measured as a separate
      degenerate stratum and is never folded into the generic count.
  controls:
    - >-
      MATCHED NULL: a generic-j curve at the same p, with a and b both nonzero, drawn from the same
      generator, measured on the identical code path at the identical factor-base size. The comparison
      is generic versus a = 0 versus b = 0, and NEVER a = 0 against nothing.
    - >-
      REPRESENTATION NULL, AND IT IS THE SHARP ONE: the same j = 0 curve written with b replaced by
      u^6 b for three declared u. Over F_p, b and u^6 b give F_p-ISOMORPHIC curves, hence identical
      ECDLP and identical everything intrinsic. ANY support, BKK or solving-degree difference between
      them is measuring the representative, not the curve, and VOIDS the instrument.
    - >-
      NEARBY-OBJECT CONTROL: a curve with a and b both nonzero but with b a sixth power, so that (a,b)
      looks special in an arithmetically irrelevant way. NO support change may be reported there; an
      instrument that fires is detecting a numerical accident.
    - >-
      DECAY PARAMETER, the arity m. A support or BKK gap at a = 0 that does NOT grow with m is a
      coefficient-writing artifact and not structure, because the mod-3 grading argument predicts the
      gap to GROW with m (weight 4 at m = 2, weight 12 at m = 3) while a fixed-size gap is what a
      bookkeeping artifact looks like. A gap constant in m is the canonical artifact tell and must be
      reported as such.
    - >-
      DEGENERATE STRATUM MEASURED SEPARATELY: x_R = 0 on a j = 0 curve with b a square, where the
      coefficient list genuinely does collapse. Folding it into the generic count would manufacture the
      positive result.
    - >-
      FROZEN FIXTURE reproducing harness/semaev.py's s3_expr and s4_expr term for term on a fixed
      (a,b,p) before any specialisation is computed. A mismatch is an instrument failure and halts the
      line.
    - >-
      FORMAL-DEGREE AND SPECIALISATION-ORDER DECLARATION: the order of specialising x_{m+1} := x_R
      relative to taking the resultant is frozen before Step 3 and stated with every number, since the
      two orders can give different intermediate supports.
  independent_variables:
    - specialisation, one of generic (a,b), a = 0, b = 0
    - arity m, one of 2 or 3
    - >-
      curve representative within a fixed isomorphism class, one of b or u^6 b for three declared u
    - prime p, one of three declared primes, plus the symbolic base field Q[a,b]
    - x_R stratum, one of generic or the degenerate x_R = 0 stratum
    - factor-base size and seed, for the empirical arm
  metrics:
    primary:
      - >-
        monomial_count_unspecialised_S3, units count of monomials, computed as the number of terms of
        sympy.Poly(s3_expr(a,b), x1,x2,x3) over Q[a,b] and of its a = 0 and b = 0 substitutions.
        Predicted 13 / 9 / 10.
      - >-
        monomial_count_specialised_m2, units count of monomials in (x1,x2) after x3 := x_R, computed
        over Q[a,b,x_R] with identical vanishing tested as polynomial identity rather than at sampled
        points. Predicted 9 / 9 / 9.
      - >-
        per_variable_degree_S4 and total_degree_S4, units degree (integer), computed on the expanded
        symbolic S_4 for generic, a = 0 and b = 0. Predicted 4 in every case.
      - >-
        mod3_support_fraction_S4_a0, units a fraction in [0,1], computed as the fraction of monomials of
        S_4|_{a=0} whose total x-degree is congruent to 0 mod 3, against the generic baseline.
        Predicted exactly 1.000 against approximately 1/3.
      - >-
        bkk_mixed_volume, units mixed volume (a non-negative integer), computed on the identical code
        path per (arity, specialisation) at matched factor-base size, reported as the ratio
        a = 0 over generic at m = 3.
    secondary:
      - >-
        full support list and Newton polytope vertex list, units lists of exponent vectors, per (m,
        specialisation), archived rather than summarised
      - >-
        factorisation result of S_4, S_4|_{a=0} and S_4|_{b=0} over Q and over each declared F_p, units
        a factor list with degrees
      - >-
        weighted_homogeneity_check, units boolean per specialisation, computed by evaluating the weight
        of every monomial under the declared weighting
      - >-
        groebner_basis_max_degree, groebner_basis_size and groebner_seconds, units degree, count and
        seconds, per (curve family, seed, factor-base size), LABELLED IMPLEMENTATION-BOUND PROXY in
        every row and never reported as a degree of regularity
      - >-
        representation_null_verdict, units boolean, computed as exact equality of support, BKK and
        proxy across b and u^6 b for three declared u
      - >-
        nearby_object_control_verdict, units boolean, computed as absence of any support change on the
        sixth-power-b curve
      - >-
        within-family Groebner proxy variance over at least 5 seeds, established BEFORE any
        between-family contrast
      - >-
        wall_seconds and peak_rss_gb per step, with the m = 3 resultant's peak memory reported per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      monomial_count_specialised_m2 (the m = 2 answer) and mod3_support_fraction_S4_a0 (the m = 3
      answer).
    formula: >-
      Pre-registered before any run: the m = 2 answer is "NOTHING AFTER SPECIALISATION", i.e.
      monomial_count_specialised_m2 = 9 / 9 / 9 with none of the nine coefficients vanishing identically
      at generic x_R; and the m = 3 answer is "support restricted to total x-degree congruent to 0
      mod 3 for a = 0, with per-variable degree unchanged at 4", i.e.
      mod3_support_fraction_S4_a0 = 1.000 against a generic baseline near 1/3, and
      per_variable_degree_S4 = 4 in all three cases. Also pre-registered:
      monomial_count_unspecialised_S3 = 13 / 9 / 10; bkk ratio at m = 3 in [0.9, 1.1] would be the null
      outcome and at least 1.5 would be required before any "simpler at m = 3" statement; the Groebner
      proxies identical in distribution at Mann-Whitney p > 0.05.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-477e40, whose title states the m = 2 and m = 3
      answers in advance and whose predictions block gives every minimum effect above. The hand
      derivations in its parts (A), (B) and (C) are labelled predictions there, not measurements, and
      the record is superseded if any of them is wrong. Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      The support arm is computed over Q[a,b], i.e. for the GENERIC curve, so its statements about
      support and degree do not depend on any prime; the mod-p arm exists only to expose accidental
      coefficient collisions and is reported separately. The Groebner arm is toy scale at p up to about
      2^24 with sympy, and its outputs are implementation-bound proxies whose transfer to any other
      solver is not claimed. There is no scale extrapolation in this design because there is no cost
      claim to extrapolate.
    correspondence: >-
      Exact computation over Q[a,b] is what lets the support conclusion escape the tested primes; it
      escapes them only for support and degree, never for a cost.
  tail_checks:
    - >-
      Report the mod-3 x-degree histogram of S_4|_{a=0} in full, not only the fraction, so a single
      off-grade monomial is visible rather than rounded away.
    - >-
      Report the nine specialised coefficients as explicit polynomials in (a,b,x_R), so a reader can
      check the identical-vanishing test rather than trusting a boolean.
    - >-
      Report the degenerate x_R = 0 stratum's coefficient collapse separately and in full, since it is
      the one place the null genuinely fails and it must not be conflated with the generic claim.
    - >-
      Report the extreme seeds of the Groebner proxy distribution, not only the medians, since the
      proxy's run-to-run variance is substantial and a difference in tails without a support difference
      is evidence about sympy.
    - >-
      Report the largest reachable arity and the memory at which the m = 3 resultant stopped, if it
      stopped, as an infrastructure fact.
  replication:
    seeds:
      - 20260807
      - 20260808
      - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds: 7200
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4.0
    memory_gb: 8
    maximum_memory_gb: 8
    maximum_runs: 16
  stopping_rules:
    - >-
      Halt the line if the frozen fixture fails to reproduce harness/semaev.py's s3_expr or s4_expr
      term for term. That is an instrument failure and no specialisation is computed.
    - >-
      Halt and report immediately if Step 4 finds a factorisation at a = 0 that does not occur
      generically. That is the one interesting event and it requires independent verification before
      anything else in this lane is run.
    - >-
      Step 6 (the Groebner arm) runs ONLY if Steps 1-5 produce a nonzero support or BKK gap worth
      chasing. It is the only arm costing real compute and it is not run speculatively.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop,
      never a negative result (AGENTS.md rule 5).
    - >-
      The specialisation order, the weighting, the declared primes and the gauge parameters u are
      frozen before Step 3 and are not revised after seeing any support.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure and
      is NEVER negative mathematical evidence (AGENTS.md rule 5). In particular the m = 3 resultant
      exceeding memory is an infrastructure outcome and is not evidence about support.
    - >-
      A run whose representation null fires (b and u^6 b give different support, BKK or proxy) is
      invalid_measurement: the instrument measured the representative and every number it produced is
      void.
    - >-
      A run whose nearby-object control fires (a support change on a sixth-power-b curve) is
      invalid_measurement.
    - >-
      A run whose matched generic-j null arm was not executed in the same invocation as the a = 0 and
      b = 0 arms is invalid_measurement: the comparison the contract exists to make was not made.
    - >-
      A run that tests coefficient vanishing at SAMPLED points rather than as a polynomial identity is
      invalid_measurement, because it would establish only the vacuous weaker quantifier order.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a
      new contract; it is never a repair of this one.
  success_criterion: >-
    The run succeeds as a MEASUREMENT when all of the following hold and are reported: the frozen
    fixture reproduces s3_expr and s4_expr term for term; monomial_count_unspecialised_S3 is reported
    and compared against 13 / 9 / 10; the nine specialised coefficients are reported as explicit
    polynomials with their identical-vanishing verdict at generic x_R; per_variable_degree_S4,
    total_degree_S4 and mod3_support_fraction_S4_a0 are reported for generic, a = 0 and b = 0; the
    Newton polytope vertex lists and BKK mixed volumes are reported per (arity, specialisation) on the
    identical code path; the representation null and the nearby-object control both return no
    difference; and the degenerate x_R = 0 stratum is reported separately. Each is decidable from the
    primary metrics above. Note explicitly: a result of 9 / 9 / 9 and a result of 9 / 7 / 8 are BOTH
    successes of the measurement; the criterion is completeness, and the scientific verdict is read
    from the falsification criteria below.
  falsification_criterion:
    - >-
      Any of the nine specialised coefficients vanishes identically at a = 0 or at b = 0 for generic
      x_R, i.e. monomial_count_specialised_m2 is not 9 / 9 / 9. THE HYPOTHESIS'S CENTRAL PREDICTION IS
      FALSE, the lane gains a target, and the result must be independently replicated before use.
    - >-
      monomial_count_unspecialised_S3 is not 13 / 9 / 10. The hand derivation is false and the
      hypothesis is superseded rather than amended.
    - >-
      S_4|_{a=0} has a monomial of total x-degree not congruent to 0 mod 3, i.e.
      mod3_support_fraction_S4_a0 is strictly between 1/3 and 1. The weighted-homogeneity argument is
      false as stated.
    - >-
      per_variable_degree_S4 drops below 4 at a = 0 or b = 0, or S_4|_{a=0} factors over F_p where the
      generic system does not. This is the degree-reduction outcome, the lane's first real finding, and
      it halts the line for independent verification.
    - >-
      The representation null fires. The instrument is void and no number from the run may be used in
      either direction.
    - >-
      The nearby-object control fires on the sixth-power-b curve. The instrument has not identified the
      load-bearing structure.
    - >-
      NOT a falsification: a Groebner proxy difference WITHOUT a corresponding support or BKK
      difference. That is evidence about sympy and must be reported in those words.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and inference
      block, environment, the frozen specialisation order and the declared weighting
    - >-
      raw-result.json carrying the full support list and Newton polytope vertex list per (m,
      specialisation), the nine specialised coefficients as explicit polynomials, and every per-seed
      Groebner proxy value, not summaries
    - >-
      the matched generic-j arm, the representation-null arm and the nearby-object control's
      measurements, in the same file as the a = 0 and b = 0 arms
    - >-
      the degenerate x_R = 0 stratum's separate measurement
    - >-
      the frozen fixture's term-for-term comparison against harness/semaev.py
    - >-
      the pre-registration text with the m = 2 and m = 3 predicted answers, written before the first run
      and hashed
    - >-
      certificate kind none; no solve, relation or distinguisher is claimed
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator authorship does not confer approval. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false (AGENTS.md rule 1). Approval is
      the user's gate because it authorizes execution and spends compute.
    - >-
      Steps 0-2 cost seconds and constitute the cheapest valid discriminator in the lane. They may be
      approved independently of Steps 3-6, and Step 6 must not be authorized until Steps 1-5 have
      produced a gap worth chasing.
    - >-
      The three primes must be declared numerically and confirmed congruent to 1 mod 12 before
      approval, since otherwise one of the two special families is supersingular and the comparison is
      not the one intended.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260807-477e40
    authored_at: '2026-08-25'
    note: >-
      Every metric, control, prediction and falsification condition is transcribed from the parent
      proposal's predictions, minimal_test, controls, required_metrics, null_object_control and
      falsification_conditions blocks. The proposal's parts (A), (B) and (C) are carried as
      PRE-REGISTERED PREDICTIONS, exactly as it labels them, and not as measurements. Boilerplate
      identical across contracts by program rule comes from a fixed table. Budgets come from the
      parent's declared estimated_cost of implementation low and compute low, widened to cover the
      m = 3 resultant and the optional Groebner arm.
  derivation_gaps:
    - >-
      The three primes are not fixed numerically by the parent proposal. They must be declared before
      approval, together with confirmation that both families are ordinary at each of them.
    - >-
      The specialisation ORDER (x_{m+1} := x_R before or after the resultant) is declared as frozen but
      the parent proposal does not say WHICH order. A coordinator must pick one before approval,
      because the two can give different intermediate supports and choosing afterwards would make the
      result selectable.
    - >-
      The BKK mixed-volume implementation is not named. The parent proposal says the program has a
      mature BKK instrument but does not identify the module; it must be named by path before approval
      so that "the identical code path" is checkable.
    - >-
      The generic-curve baseline fraction of monomials with total x-degree congruent to 0 mod 3 is
      quoted as "approximately 1/3". It should be computed exactly for the generic S_4 in Step 3 and
      used as the baseline, rather than compared against an approximation.
    - >-
      The three gauge parameters u for the representation null are not declared. They must be fixed
      before approval, since a u chosen after seeing a difference would let the null be evaded.
