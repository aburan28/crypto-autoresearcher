experiment:
  id: EXP-MCE-313ecb
  hypothesis_id: H-MCE-15cb48
  derived_from_idea: IDEA-20260807-c3267e
  question_id: RQ-MCE-e65b3c
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Migration audit of the unadopted code-based costing convention: recharge published ISD figures
    under its declared triple and under the private convention that produced them, with a
    convention-coincident zero-delta control, a scheme-independence gate and a transitivity gate on
    two figures from different goals
  objective: >-
    The single uncertainty a run reduces is whether the unadopted costing convention DOES REAL WORK
    or whether adopting it would be cosmetic. A run establishes (i) the MIGRATION DELTA in bits
    between a published ISD figure charged naively and the same figure charged under the
    convention's declared triple, on at least three figures spanning the convention's memory-model
    rows; (ii) the zero-delta control, a figure whose private convention already coincides with the
    triple, which forces a delta of exactly 0 and detects a pipeline that manufactures differences;
    (iii) the SCHEME-INDEPENDENCE verdict, re-confirmed first-hand by attempting to state the
    convention without naming any scheme; and (iv) the TRANSITIVITY verdict, tested by subtracting
    two real migrated figures drawn from different goals. The run produces the audit an adoption or
    rejection decision would consume. IT TAKES NO SUCH DECISION - only the Coordinator may, and only
    in a committed decision record.
  what_this_is_not:
  - >-
    NOT an adoption. NOT a rejection. NOT a supersession or amendment of the convention. Those are
    Coordinator acts (AGENTS.md rule 1) and this run performs none of them; it supplies their input.
  - >-
    NOT a new ISD variant and not a new costing scheme. The convention already exists and has been
    reviewed.
  - >-
    NOT a security claim, an attack, or a margin statement about any code-based scheme. A margin
    computed under two conventions is an artifact of the conventions.
  - >-
    NOT knowledge creation. Adopting a convention makes existing figures subtractable; it discovers
    nothing.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: laboratory
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - for the specific published figures recharged and the specific
      memory-model rows used, the migration delta takes stated values in bits; the convention is or
      is not statable without naming a scheme; and two migrated figures from different goals are or
      are not subtractable without further argument. WHAT DOES NOT FOLLOW - no security claim about
      Classic McEliece, HQC, SDitH or any code-based scheme; no general correction factor applicable
      to figures not recharged here; no adoption; and specifically NOT that a measured delta
      establishes any scheme's margin is larger or smaller than published, since a margin computed
      across conventions is an artifact.
  inputs:
    procedure: >-
      STAGE 0 (reading, zero compute) - read the convention document FIRST-HAND and in full,
      recording its declared triple (what is counted, under which memory model, with what
      preprocessing charge) and every memory-model row it declares. A review judgement recorded
      elsewhere is a pointer, not a substitute. STAGE 1 (reading, zero compute) - obtain the
      published ISD cost table with a locator, transcribe the figures to be migrated recording the
      provenance level of each, and mark unavailable any value that cannot be obtained. Never
      recall a figure. STAGE 2 (zero compute, ORDERED BEFORE THE TREATMENT AND HASH-COMMITTED) - the
      CONVENTION-COINCIDENT CONTROL: identify a figure whose private convention already coincides
      with the triple, recharge it, and confirm the delta is EXACTLY 0. If it is not, the pipeline
      manufactures differences and no other delta is admissible. STAGE 3 (zero compute) - the
      SCHEME-INDEPENDENCE GATE: restate the convention without naming any scheme, and record either
      success or the exact clause that cannot be so stated. STAGE 4 (arithmetic, minutes) - the
      MIGRATION CHECK: recharge at least three published figures under the triple and under their
      own private convention, spanning all memory-model rows the convention declares, and report
      each delta in bits with the direction named. STAGE 5 (zero compute) - the TRANSITIVITY GATE:
      take two migrated figures from DIFFERENT goals and subtract them, recording whether any
      further argument was required. STAGE 6 (zero compute) - assemble the audit: adoption-relevant
      findings, the migrated figure pairs and deltas, the transcribed table under the migrated
      basis, and any named defect. State explicitly that no decision is taken.
    instrument: >-
      Reading plus exact arithmetic where the source's precision permits, with every rounding stated
      and the source precision recorded beside each figure. No solver, no randomness, no seeds.
      Network at Stages 0 and 1 only, with every fetch outcome including failures recorded. Recorded
      through harness/runner.py.
    parameters: >-
      All memory-model rows the convention declares, never a single chosen one - the three goals may
      need different rows, and picking one is itself a defect the audit must report rather than
      commit. At least three migrated figures plus the convention-coincident control. Two figures
      from different goals for the transitivity gate. Every transcribed value carries its locator
      and provenance level.
  controls:
  - >-
    MIGRATION CHECK AGAINST THE PRIVATE CONVENTION (the primary null). Recompute one already-
    published figure under the adopted-candidate convention AND under the private convention that
    produced it. If the two agree exactly, the convention is not doing any work and adoption is
    cosmetic. If they differ, the difference IS the size of the comparability problem. This arm can
    come out zero, and its coming out zero is a fully reportable negative.
  - >-
    CONVENTION-COINCIDENT ZERO-DELTA CONTROL, FORCED VALUE PRE-DERIVED, CAN FAIL. A figure whose
    private convention already coincides with the triple. FORCED - delta exactly 0 bits. A nonzero
    delta there means the migration pipeline manufactures differences and NO other delta in the run
    is reportable.
  - >-
    BASELINE REPRODUCTION GATE. Recharging a published figure under ITS OWN stated convention must
    reproduce the published value to the digits the source carries. A mismatch means the
    transcription or the private-convention reading is wrong, and no delta is meaningful.
  - >-
    SCHEME-INDEPENDENCE GATE. The convention must be statable without naming any specific scheme. It
    was found scheme-independent by a prior review, and this gate RE-CONFIRMS it first-hand rather
    than inheriting the judgement. It can fail, and a named defect is as valuable as adoption.
  - >-
    TRANSITIVITY GATE. Two migrated figures from DIFFERENT goals must be subtractable without
    further argument. This is the direct test of HEUR-ISDFC-1 on real figures rather than on a
    review judgement.
  - >-
    ALL-ROWS CONTROL. Every memory-model row the convention declares is exercised. Reporting under a
    single chosen row would hide exactly the case where the three goals need different rows, which
    is a declared confounder.
  - >-
    ORDERING CONTROL. The convention-coincident control and the scheme-independence verdict are
    computed and hash-committed BEFORE any treatment delta is read.
  - >-
    PROVENANCE GATE. Every transcribed value carries a locator and a provenance level, or is marked
    unavailable. A figure filled from memory makes the run completed_invalid.
  independent_variables:
  - 'charging convention: the candidate convention''s triple versus the private convention that produced the figure'
  - 'memory-model row, over every row the convention declares'
  - 'figure identity, across the published table''s parameter sets'
  - 'goal of origin, for the transitivity gate'
  metrics:
    primary:
    - >-
      migration_delta_bits per (figure, memory-model row) - signed number of bits, the figure
      charged under the convention's triple minus the same figure charged naively under its private
      convention, with the DIRECTION named for each.
    - >-
      convention_coincident_control_delta - signed bits, forced EXACTLY 0. A nonzero value voids
      every other delta.
    - >-
      scheme_independence_verdict - a three-way verdict (statable without naming a scheme / not
      statable, with the exact offending clause quoted / not assessable), recorded first-hand.
    - >-
      transitivity_verdict - boolean per pair, whether two migrated figures from different goals
      were subtractable without further argument, with the argument recorded if one was required.
    secondary:
    - >-
      baseline_reproduction_match - boolean per figure, whether recharging under the private
      convention reproduces the published value to the source's digits.
    - >-
      rows_exercised - integer, the number of the convention's declared memory-model rows actually
      used, against the number it declares.
    - >-
      goal_row_requirement_table - which memory-model row each of the three code-based goals needs,
      read from the goals rather than assumed.
    - >-
      transcription_provenance per figure - locator and provenance level, or UNAVAILABLE.
    - >-
      named_defect_list - any specific defect found in the convention, quoted with its location in
      the document.
  heuristic_under_test: HEUR-ISDFC-1
  preregistered_prediction:
    quantity: 'migration_delta_bits on the published ISD figures recharged under the convention''s triple.'
    formula: >-
      Predicted NONZERO in a single named direction, with a prior in-program proposal pricing it at
      6 to 10 bits. Any confirmed nonzero value establishes that the convention does real work.
      Under the null that the convention is cosmetic, migration_delta_bits is exactly 0 on every
      migrated figure, and that outcome is recorded as cosmetic rather than celebrated. Under the
      instrument-failure reading, the convention-coincident control's delta is nonzero and nothing
      is reportable.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-c3267e, whose predictions block names the
      6-to-10-bit figure as a prediction relayed from a sibling proposal and whose
      falsification_conditions state the zero-delta outcome as 'adoption is cosmetic and should be
      recorded as such rather than celebrated'. Fixed before any run and never tuned to data. The
      6-to-10-bit figure is a RELAYED in-program prediction, not a measurement, and is used as a
      comparison target only.
  scale_relevance:
    tier: full_parameters
    justification: >-
      The published figures are stated at deployed code-based parameter sets, so the migration is
      performed at full parameters and there is no scale transfer. The boundary is not scale but
      SCOPE - the delta is measured on the specific figures recharged under the specific rows used,
      and is not a general correction factor. A reader must not apply a measured delta to a figure
      the run did not migrate.
    correspondence: null
  tail_checks:
  - >-
    Report the delta per memory-model ROW, never aggregated across rows, since the three goals may
    need different rows and an aggregate would hide exactly that case.
  - >-
    Report the DIRECTION of each delta explicitly. A magnitude without a direction cannot be checked
    against the pre-registered 'single named direction'.
  - >-
    Report the source precision beside each figure, so a delta smaller than the source's own rounding
    is visible as such rather than read as a finding.
  - >-
    Report the convention-coincident control's delta FIRST in the deliverable, matching the order in
    which it was computed and committed.
  - >-
    Report any figure that could not be obtained as UNAVAILABLE by name, so the migration table's
    coverage is exact and not implied.
  replication:
    seeds:
    - not_applicable_deterministic
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.3
    maximum_memory_gb: 2
    maximum_runs: 6
  stopping_rules:
  - >-
    STOP if the convention-coincident control's delta is nonzero. The pipeline manufactures
    differences and no other delta is admissible.
  - >-
    STOP if the baseline reproduction gate fails on a figure - recharging under its own private
    convention does not reproduce the published value. The transcription or the private-convention
    reading is wrong and that figure's delta is void.
  - >-
    STOP the migration table if the published source cannot be obtained; deliver the convention
    audit alone with the migration check marked UNAVAILABLE, never with an imputed figure.
  - >-
    STOP AND REPORT if the scheme-independence gate finds an offending clause. A named defect is a
    complete deliverable and resolves the limbo just as adoption would.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A network failure, timeout, crash or dependency failure makes the run failed_infrastructure and
    is NEVER a finding about the convention (AGENTS.md rule 3).
  - >-
    A run that fills any figure from memory rather than from a located source or an UNAVAILABLE
    marker is completed_invalid (AGENTS.md rule 5).
  - >-
    A run that takes an adoption or rejection decision, or that edits the convention document, any
    goal record or any decision record, is completed_invalid. Those are Coordinator acts.
  - >-
    A run in which any treatment delta was read before the convention-coincident control and the
    scheme-independence verdict were hash-committed is completed_invalid.
  - >-
    A run that reports under a single chosen memory-model row when the convention declares several is
    invalid_measurement - it hides the case the all-rows control exists to expose.
  - >-
    A run that derives a security margin or any scheme-level security statement from a migrated
    figure is completed_invalid.
  success_criterion: >-
    The convention is read first-hand and its declared triple and memory-model rows are recorded;
    the baseline reproduction gate passes on every migrated figure; the convention-coincident control
    returns a delta of exactly 0 and is hash-committed before any treatment delta; the
    scheme-independence gate returns a first-hand verdict; at least three figures are migrated
    spanning every declared memory-model row with each delta reported in bits WITH its direction; and
    the transitivity gate returns a verdict on two figures from different goals. H-MCE-15cb48 is
    SUPPORTED if migration_delta_bits is nonzero in a consistent direction on at least one figure;
    the ZERO-delta outcome and the named-defect outcome are equally complete deliverables and are
    reported as themselves.
  falsification_criterion:
  - >-
    migration_delta_bits is exactly 0 on every migrated figure and every row. The convention does no
    work, adoption would be COSMETIC, and that is recorded as such rather than celebrated. This is
    the primary negative outcome and it is fully reportable.
  - >-
    The convention-coincident control's delta is nonzero. The pipeline manufactures differences and
    NO delta in the run is reportable.
  - >-
    The scheme-independence gate finds a clause that cannot be stated without naming a scheme. The
    deliverable is a reasoned REJECTION with a named reason - equally valuable, since it resolves the
    limbo the lane currently sits in.
  - >-
    The transitivity gate fails - two migrated figures from different goals require a further
    per-scheme argument to be subtracted. HEUR-ISDFC-1 is refuted directly.
  - >-
    The baseline reproduction gate fails - recharging under the private convention does not reproduce
    the published figure. The transcription or the reading is wrong and no delta is meaningful.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
  - the convention's declared triple and every memory-model row, quoted first-hand with locations
  - raw-result.json carrying every migrated figure pair and its delta per row, not summaries
  - the convention-coincident control's delta, hash-committed before any treatment delta and reported first
  - the scheme-independence verdict with the offending clause quoted if there is one
  - the transitivity gate's two figures, their difference, and any further argument that was required
  - the transcribed published table under the migrated basis, with a locator and provenance level per value
  - the per-goal memory-model row requirement table, read from the goal records
  - an explicit statement that NO adoption or rejection decision was taken by this run
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval and the user's authorization are required before execution. This contract
    is review_required and is NOT approved; approved_by is null and execution_authorized is false
    (AGENTS.md rule 1).
  - >-
    The task card must state explicitly that the executor takes NO adoption or rejection decision and
    edits no decision, goal or convention record. This is the single most likely way this contract
    would be executed wrongly.
  - >-
    The published source and the specific figures to be migrated must be named before approval, since
    'one already-published figure' is not a specification and the choice of figure determines the
    delta.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260807-c3267e
    authored_at: '2026-08-25'
    note: >-
      The migration check as primary null, the scheme-independence gate and the transitivity gate are
      taken from the parent proposal's null_object_control and minimal_test.controls blocks; the
      6-to-10-bit prediction and the cosmetic-adoption negative are its predictions and
      falsification_conditions verbatim in substance. The convention-coincident zero-delta control,
      the baseline reproduction gate, the all-rows control and the provenance gate are Coordinator
      additions - the parent proposal's controls could not distinguish a real delta from a pipeline
      that manufactures one, which is the failure this contract exists to preclude. Boilerplate
      identical across contracts by program rule comes from the fixed table.
  derivation_gaps:
  - >-
    Neither the convention document's path nor the specific published figures are fixed here beyond
    what the parent proposal records. Both must be named before approval; the choice of figure
    determines the measured delta and choosing it after seeing a delta would be a fit.
  - >-
    Whether a convention-coincident figure EXISTS is not guaranteed. If none can be found, the
    zero-delta control is unavailable and the migration deltas are uncalibrated at the zero end -
    that is a stated weakening that must appear in the headline, not a reason to proceed silently.
  - >-
    The 6-to-10-bit target is a RELAYED in-program prediction from a sibling proposal, not a
    measurement. It is a comparison target only, and a delta outside that range refutes the sibling's
    pricing rather than this contract.
  - >-
    Whether the three code-based goals need different memory-model rows is read from the goal records
    at run time. If they do and the convention declares only one, that is a named defect and the
    contract's transitivity gate is the arm that surfaces it.
  - >-
    The successor act - adopt, reject with a named reason, or amend - is NOT chosen by this contract
    and must not be inferred from a passing run.
