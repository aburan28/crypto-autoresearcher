experiment:
  id: EXP-ALPF-1ed5d7
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-746055; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-746055
  question_id: RQ-ALPF-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Per-profile false-positive rate of the ALPF first-fall survival screen, measured against
    dense and sparsity-matched null homogeneous systems at two prime sizes with the published control
    rows re-run in the same invocation.
  objective: 'The one uncertainty a run reduces is how often the ALPF survival label fires on an object
    containing no elliptic-curve structure. Stated as parts: (i) does a pure-Python Macaulay-rank
    first-fall meter reproduce, row for row, the three control results published in experiments/EXP-ALPF-010/analysis.md
    and EXP-ALPF-011/analysis.md -- planted shared-quadratic-factor cubics firing at d_ff=4 against
    D_reg=7, generic quadrics quiet at 4/4, generic cubics quiet at 7/7 -- because without that reproduction
    no rate measured by the re-implementation is comparable to the archived campaign; (ii) conditional
    on (i), what is the fire rate of that identical meter on N random homogeneous systems drawn to
    each surviving cell''s exact leading-form degree profile, with a binomial confidence interval,
    at a 13-bit and a 17-bit prime; (iii) does that rate depend on the balance of the degree profile,
    comparing the balanced baseline profile [4,4,4,12] against the unbalanced e-ring profile [2,2,2,4],
    both of which appear in the committed EXP-ALPF-011 table with opposite recorded verdicts. Reducing
    these three uncertainties converts the campaign''s binary METER_VALIDATED flag into a numeric
    operating characteristic that any future ALPF cell can be read against, and does so without re-running
    a single elliptic-curve computation.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for this meter implementation,
      this null ensemble, these degree profiles and these two prime sizes, the observed fire rate
      is p_hat with the stated interval, and the published control rows were or were not reproduced.
      What does NOT follow: nothing about whether any elliptic-curve representation decomposes points,
      nothing about whether any ALPF survivor is a genuine algebraic effect, nothing about behaviour
      at medium or cryptographic scale, and no attack, speedup or security consequence of any kind;
      a high rate bounds the evidential weight of a single firing cell and does not retract EXP-ALPF-011
      or EV-ALPF-001.'
  inputs:
    procedure: 'STAGE 0 (cost: 0 compute, ~1 hour human): transcribe every leading-form degree profile
      and its recorded verdict from experiments/EXP-ALPF-011/analysis.md and EXP-ALPF-010/analysis.md
      into a frozen fixture file. STAGE 1 (cost: ~1 day human, minutes compute): implement first_fall(profile_forms,
      p, max_D) as a pure-Python Macaulay-matrix rank routine over F_p and D_reg_pred(profile) from
      the positive-truncated semiregular Hilbert series. STAGE 2 (cost: seconds): run the three published
      control systems; abort and report instrument-mismatch if any row differs. STAGE 3 (cost: ~2
      CPU-hours): for each of the profiles in the fixture, draw N=200 dense random homogeneous systems
      at p13 and p17 under 5 disjoint seed blocks and record the verdict triple. STAGE 4 (cost: ~2
      CPU-hours): repeat STAGE 3 with the sparsity-matched null sampler. STAGE 5 (cost: minutes):
      aggregate to per-profile rates with Clopper-Pearson intervals, run the two-proportion comparison
      between balanced and unbalanced profiles, and report the positive-dimensional draw fraction
      separately. STAGE 6 (cost: 0): emit the fixture, all seeds, all raw verdict triples and the
      environment record.'
    instrument: Python 3 only, no Sage. Macaulay matrix construction and rank over F_p in pure Python
      with integer arithmetic modulo p, using sympy for polynomial manipulation exactly as harness/semaev.py
      and harness/toycurve.py already do; harness/runner.py for the run manifest and the inference
      block; src/macaulay_export.py consulted for the existing Macaulay serialisation conventions.
      src/ic_first_fall_fast.py is read for its first_fall_degree logic but is NOT used, because it
      imports sage.all. Seeded RNG via the same _seed_int convention as harness/toycurve.py.
    parameters: 'Primes: one 13-bit and one 17-bit prime, matching the field sizes recorded in the
      EXP-ALPF-011 and EXP-ALPF-010 tables. Profiles: the full set transcribed from those tables,
      at minimum [4,4,4,12], [2,2,2,4], [2,3,4,12], [3,3,3,24], [5,5,5,12], [3,4,5,12]. Variable counts:
      as recorded per profile, 4 to 6. Draws: N=200 per (profile, prime, null-sampler) cell, split
      over 5 seed blocks of 40. Maximum Macaulay degree: 14, or the first degree at which the matrix
      exceeds 2 million columns, whichever is smaller, recorded per cell. Total cells: 6 profiles
      x 2 primes x 2 samplers = 24, i.e. 4800 draws.'
  controls:
  - The three published meter controls (planted shared-quadratic-factor cubics; regular quadric complete
    intersection; regular cubic triple) re-run in the same invocation as every null draw.
  - 'A sparsity-matched null arm: random forms whose monomial supports match the observed support
    density of the Semaev-derived forms, run alongside the dense null arm.'
  - 'A seed-permutation control: the same profile drawn under 5 disjoint seed blocks, to show the
    rate is not a seed artifact.'
  - 'A field-size control: the identical null ensemble at a 13-bit and a 17-bit prime, to show the
    rate is not a small-field artifact.'
  - 'A degenerate-draw filter recorded rather than discarded: draws producing a positive-dimensional
    ideal are counted and reported separately, since EXP-ALPF-006 shows pos_dim is a distinct failure
    mode.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a k-tuple of dense random homogeneous forms over
    F_p with the identical degree profile and identical variable count as the signal cell, drawn from
    a seeded RNG, carrying no elliptic curve behind it. The IDENTICAL meter code path, at the identical
    maximum degree, with the identical D_reg_pred formula, is run on it in the same process. For the
    signal arm to mean anything the null must be QUIET at a rate consistent with the published controls:
    specifically, the null fire rate for a balanced profile must be below 0.05, and the three published
    control rows (planted shared-quadratic-factor cubics fire at d_ff=4 vs D_reg=7; generic quadrics
    quiet at 4/4; generic cubics quiet at 7/7) must be reproduced exactly by the re-implementation.
    If the null fires at a rate comparable to the signal cells, the correct record is a controlled
    null under inventor-protocol section 3, and no ALPF survivor may be cited as evidence of algebraic
    structure at that profile.'
  independent_variables:
  - leading-form degree profile
  - prime field size (13-bit vs 17-bit)
  - null sampler (dense vs sparsity-matched)
  - seed block
  metrics:
    primary:
    - null_fire_rate per (profile, prime, sampler) with Clopper-Pearson 95 percent interval
    - d_ff per draw
    - D_reg_pred per profile
    - control-row reproduction indicator for each of the three published rows
    secondary:
    - positive-dimensional draw fraction per cell
    - gap statistic D_reg_pred minus d_ff distribution
    - peak Macaulay matrix rows and columns per cell
    - wall-clock seconds per draw
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The fire rate of the first-fall meter on null homogeneous systems, conditioned on the
      leading-form degree profile.
    formula: 'p_hat(profile) = (number of draws with d_ff < D_reg_pred) / N, with D_reg_pred(profile)
      defined as the index of the first non-positive coefficient of the truncated series product over
      i of (1 - t^{d_i}) divided by (1 - t)^{n_vars}, and d_ff defined as the smallest degree D at
      which the observed Macaulay rank implies a Hilbert-function value strictly below that series.
      Pre-registered prediction: p_hat([4,4,4,12]) < 0.05 and p_hat([2,2,2,4]) > 0.15, with the difference
      exceeding 0.10.'
    source: Pre-registered in the parent proposal IDEA-20260816-746055 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at 13-bit and 17-bit primes with 4 to 6 variables and total degrees up
      to 24, exactly the parameters recorded in the archived ALPF cells. NO transfer to medium or
      cryptographic scale is assumed or claimed: the measured rate is asserted only for these profiles
      at these field sizes. The one extrapolation that is examined rather than assumed is across the
      two prime sizes, and it is reported as an observed difference or lack of difference, not fitted
      or projected further.'
    correspondence: null
  tail_checks:
  - Report the maximum observed d_ff and the number of draws that hit the degree ceiling without firing,
    since ceiling-truncated draws bias the rate downward.
  - Report the fraction of draws whose ideal is positive-dimensional separately from the fire rate,
    following the pos_dim failure mode recorded in EXP-ALPF-006.
  - Report the per-seed-block rate spread, not just the pooled rate, so that a single anomalous block
    is visible.
  - Report draws where the Macaulay matrix rank routine returned a rank equal to its full dimension
    at every degree, which indicates a degenerate draw rather than a quiet one.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort before STAGE 3 if any of the three published control rows is not reproduced exactly; report
    instrument-mismatch and no rate.
  - Stop a cell early if 5 consecutive draws exceed the per-draw wall-clock budget of 120 seconds,
    and report that cell as budget-truncated rather than as a rate.
  - Hard stop at 8 total CPU-hours; report completed cells and mark the rest not-run.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All three published control rows reproduced exactly, and a per-profile fire rate
    reported with a 95 percent Clopper-Pearson interval no wider than 0.10 for every completed cell.
  falsification_criterion:
  - Any published control row not reproduced exactly by the pure-Python meter.
  - Pooled null fire rate below 0.01 for every profile, falsifying the profile-dependence prediction.
  - Two-proportion comparison between balanced and unbalanced profiles not significant at the pre-registered
    0.10 effect size.
  - Per-seed-block rate spread exceeding the pooled Clopper-Pearson interval width, indicating an
    ill-defined ensemble.
  - Positive-dimensional draw fraction above 0.20 in any cell, indicating the null ensemble does not
    match the zero-dimensional regime.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-746055
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact D_reg_pred truncation convention used by the Autolab meter is described in prose in
    EXP-ALPF-006 and EXP-ALPF-011 analysis text but not pinned to code; a Coordinator must fix one
    convention and record it before approval.
  - The definition of 'sparsity-matched' requires a concrete support-density statistic extracted from
    the archived Semaev forms, which the archived analyses summarise but do not tabulate.
  - The variable count per profile must be confirmed against the archived source scripts under experiments/EXP-ALPF-011/source/
    rather than inferred from the profile length.
  - N=200 was chosen for a plus-or-minus-0.03 interval at rates near 0.1; a Coordinator should confirm
    the compute budget supports 4800 draws before freezing.
