experiment:
  id: EXP-PMA-8985bd
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-d202cf; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-d202cf
  question_id: RQ-PMA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Evaluate the frozen divisor-parity predicate at all four anchor choices and all twenty-four
    index relabellings per prescribed table, and report the verdict orbit size against a gauge-blind
    null and a random-table null
  objective: 'The one uncertainty a run reduces is whether the frozen obstruction predicate reports
    a property of the prescribed minor table or a property of the anchor and triple-set chosen to
    evaluate it. Concretely: (i) it establishes computationally that simultaneous row and column permutation
    preserves principal minors up to subset relabelling, so that the equivariance requirement being
    tested is grounded in a verified identity rather than in an assertion; (ii) it measures, per prescribed
    table on the nondegenerate locus, the size of the verdict orbit across the four anchors and across
    all twenty-four relabellings, printing for every nontrivial orbit the minimal disagreeing gauge
    pair with both reduced discriminants and both divisor certificates, so that a disagreement arrives
    as a reader-checkable object rather than as a count; (iii) it separates genuine square-class disagreements
    from degenerate branches, since a vanishing q_ij under one anchor changes the code path without
    changing the mathematics, and conflating the two is the single most likely way this measurement
    goes wrong. The run requires no existence decider and no ground truth, because self-inconsistency
    across gauges is a defect regardless of which verdict is correct. It reduces no uncertainty about
    whether divisor parity actually obstructs PMA4, and none about any cryptographic quantity.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for the specific predicate
      implementation, the specific anchored-triple construction, and the specific prescribed family
      p_empty = 1, p_S = (t+1)/(t+d_S) frozen in H-PMA-001, over the tested constant fields and parameter
      assignments, the measured verdict orbit size under index relabelling and anchor choice, with
      degenerate gauges classified separately and a gauge-blind null establishing that the orbit measurement
      itself is sound. What does NOT follow: nothing about whether the predicate''s verdicts are CORRECT
      (equivariance is necessary, not sufficient), nothing about the one-directional obstruction mechanism
      of IDEA-20260726-012 which survives any single exhibited odd valuation, nothing about symmetries
      other than relabelling, nothing about n other than 4, and no attack, speedup or security consequence.'
  inputs:
    procedure: 'STAGE 0 (cost: hours, human): refactor the predicate into a pure function of (table,
      anchor, triple-set); freeze the degenerate-branch classification rules and the null-arm seeds.
      STAGE 1 (cost: minutes): minor-relabelling identity control on 10^4 random matrices times 24
      permutations; abort everything on any violation. STAGE 2 (cost: minutes): determinism control
      and independent square-class cross-check on a sample of tables. STAGE 3 (cost: minutes to an
      hour): signal arm -- for each grid table, evaluate all four anchors and all twenty-four relabellings;
      record verdict vectors, orbit sizes, degenerate gauges. STAGE 4 (cost: same order): NULL 1,
      the gauge-blind reference verdict function, through the identical orbit-measurement code in
      the same invocation. STAGE 5 (cost: same order): NULL 2, the real predicate on uniformly random
      prescribed tables of the same shape. STAGE 6 (cost: hours, human): for every nontrivial orbit,
      attribute the disagreement to a square class or to a degenerate branch, printing both discriminants
      and both divisor certificates; write the run record with the attribution table.'
    instrument: Python 3 with sympy for exact rational-function arithmetic over k(t) (Poly and rational
      canonicalisation over QQ and over GF(q)), plus a hand-written square-class routine computing
      the squarefree divisor including the place at infinity and the residual constant class, written
      independently of sympy's factorisation for the cross-check. Explicit cofactor expansion for
      minors. harness/runner.py for the run manifest, seeds and the inference block. No Sage.
    parameters: 'n = 4 fixed, so 15 prescribed values, 4 anchors, 4 available anchored triples of
      which the frozen set is three, and 24 relabellings. Constant fields: k = Q as the primary arm,
      plus k = F_q for the largest q the parameter box actually admits under whatever distinctness
      reading the Coordinator fixes. Grid: at least 20 nondegenerate prescribed tables from the frozen
      family, plus at least 5 deliberately near-degenerate tables to exercise the separation control.
      Control sample sizes: 10^4 random matrices times 24 permutations for the relabelling identity;
      every table twice for determinism; at least 20 tables for the independent square-class cross-check.
      NULL 1: gauge-blind hash-based verdict with marginals matched to the signal arm, declared seed.
      NULL 2: at least 20 uniformly random prescribed tables of the same shape. Per-table wall-clock
      cap 120 s; any gauge exceeding it is recorded UNDECIDED.'
  controls:
  - 'NULL 1: gauge-blind reference verdict function with matched marginal frequencies, which must
    produce orbit size 1 on every table; run in the same invocation through the identical orbit-measurement
    code.'
  - 'NULL 2: the real predicate on uniformly random prescribed tables of the same shape, to establish
    the background rate of gauge dependence outside the structured family.'
  - 'Minor-relabelling identity control: minors of P_sigma A P_sigma-transpose equal relabelled minors
    of A, on 10^4 random matrices times all 24 permutations.'
  - 'Determinism control: identical (table, gauge) input evaluated twice must give byte-identical
    discriminants and verdicts.'
  - 'Degenerate-branch separation control: any gauge where a required q_ij vanishes or a discriminant
    is zero is classified DEGENERATE and excluded from orbit-size scoring, with the count reported
    separately, per RQ-PMA-001''s constraint that degenerate loci are never counted as obstructions.'
  - 'Canonical-reduction control: two discriminants that differ by a square factor in k(t) must be
    recognised as the same square class by an independent square-class routine.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both run in the same invocation as the signal arm and through
    the identical code path. NULL 1 (the essential one): replace the predicate by a gauge-blind reference
    verdict function that depends only on the table -- concretely, a fixed hash of the canonicalised
    table mapped to the same ternary alphabet with matched marginal frequencies drawn from a declared
    seed. This null must show verdict orbit size exactly 1 on every table, because it cannot see the
    gauge; a nonzero orbit-size-2 count in NULL 1 proves the orbit measurement itself is buggy. NULL
    2: apply the real predicate to uniformly random prescribed tables of the same shape rather than
    to tables from the frozen grid, to measure whether any observed gauge dependence is specific to
    the structured p_S = (t+1)/(t+d_S) family or is generic. For the signal arm to mean anything,
    NULL 1 must show zero non-trivial orbits and the signal arm must be compared against NULL 2''s
    rate rather than against zero.'
  independent_variables:
  - anchor index in {1, 2, 3, 4}
  - index relabelling sigma in S_4 (24 values)
  - prescribed table identity within the grid
  - 'arm: signal predicate, NULL 1 gauge-blind reference, NULL 2 random tables'
  - constant field k
  metrics:
    primary:
    - verdict orbit size per table under the anchor arm and under the relabelling arm
    - fraction of nondegenerate tables with verdict orbit size greater than 1, per arm
    - NULL 1 nontrivial verdict orbit count (must be exactly 0)
    - minor_relabelling_identity_violations (must be exactly 0)
    - determinism_violations (must be exactly 0)
    secondary:
    - per nontrivial orbit, the minimal disagreeing gauge pair with both reduced discriminants and
      both divisor certificates
    - count and class of DEGENERATE gauges per table
    - NULL 2 nontrivial orbit fraction, as the background rate
    - square-class cross-check agreement rate between the predicate's internal reduction and the independent
      routine
    - count of UNDECIDED gauges from wall-clock caps, reported separately and never as verdicts
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The verdict orbit size of the frozen predicate under the gauge group of anchor choice
      and index relabelling, on nondegenerate prescribed tables.
    formula: 'For every nondegenerate prescribed table T and every sigma in S_4 and every anchor a
      in {1,2,3,4}: verdict(T, a, triples(a)) equals verdict(sigma.T, sigma(a), triples(sigma(a))),
      hence orbit size equals 1 for every table. Pre-committed value: nontrivial_verdict_orbit_fraction
      equals 0 in the signal arm, and exactly 0 in NULL 1 by construction. No value is pre-committed
      for the fraction of tables containing a degenerate gauge, by explicit refusal recorded in the
      proposal.'
    source: Pre-registered in the parent proposal IDEA-20260816-d202cf before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested parameters are n = 4, at least 20 nondegenerate prescribed tables plus at
      least 5 near-degenerate ones drawn from the frozen family p_S = (t+1)/(t+d_S), over k = Q and
      one finite constant field, with all 4 anchors and all 24 relabellings evaluated exhaustively
      per table. The only extrapolation assumption is that the tested tables are representative of
      the frozen family; that is NOT assumed but bounded, because the negative direction is decisive
      with a single counterexample -- one table with orbit size 2 settles the equivariance question
      for the predicate as frozen, regardless of the grid size. No transfer to other n, other prescribed
      families, or other symmetries is claimed.
    correspondence: null
  tail_checks:
  - Near-degenerate tables, where some q_ij is small or nearly cancels, are over-represented, since
    that is where anchor-dependent branching would first appear.
  - Tables whose discriminants have the largest coefficient heights over Q are inspected individually,
    since that is where canonical reduction is most likely to fail and manufacture a disagreement.
  - Any table with an UNDECIDED gauge is inspected by hand and excluded from orbit scoring with its
    exclusion recorded.
  - The four anchored triples are each checked for whether they are individually degenerate on the
    tested family, since the frozen contract uses only three of them.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort the entire run if the minor-relabelling identity control fails on any sampled matrix and
    permutation.
  - Abort if NULL 1 produces any nontrivial verdict orbit; report nothing from the signal arm.
  - Stop the signal arm early and report the finding if a single nondegenerate table is confirmed,
    after attribution, to have verdict orbit size greater than 1 on a square-class basis rather than
    a degenerate-branch basis.
  - Record any gauge exceeding the 120 s cap as UNDECIDED and continue; never treat it as a verdict.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The minor-relabelling identity, determinism and square-class cross-check controls
    all pass with zero violations, NULL 1 yields orbit size 1 on every table, and every nondegenerate
    grid table receives a complete 4-element anchor verdict vector and a complete 24-element relabelling
    verdict vector with its orbit size and degenerate-gauge classification recorded.
  falsification_criterion:
  - Any minor-relabelling identity violation.
  - Any NULL 1 nontrivial verdict orbit.
  - Any determinism violation, showing the predicate is not a pure function of (table, gauge).
  - 'A nonzero nontrivial-orbit fraction on nondegenerate tables in the signal arm, attributed after
    inspection to a genuine square-class difference: the frozen predicate is gauge-dependent and the
    exact-classifier framing of H-PMA-001 fails.'
  - Independent square-class routine disagrees with the predicate's internal reduction on any inspected
    table, making disagreements unattributable.
  - Signal-arm nontrivial-orbit fraction statistically indistinguishable from NULL 2's, meaning any
    gauge dependence is generic to the table shape rather than a property of the frozen family.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-d202cf
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must decide whether the predicate under test is the three-triple frozen version
    or a symmetric four-triple version; comparing the two is a comparison of predicates, not a gauge
    test, and the contract must fix one.
  - The Coordinator must supply valid parameter assignments for the prescribed family, which depends
    on the unresolved parameter-box question raised elsewhere in this bucket; without instantiable
    d_S there is no grid to test.
  - The exact rule separating a degenerate gauge from a genuine disagreement needs to be frozen before
    the run, because it is the single judgement call that determines whether a nontrivial orbit is
    reported as a defect.
  - Whether an UNDECIDED gauge from a wall-clock cap should force exclusion of the whole table or
    only that gauge needs a ruling; both are defensible and they give different orbit statistics.
