protocol_amendment:
  experiment_id: EXP-ECDLP-6a97f4
  version_from: 1
  version_to: 1
  amendment_id: v1_stage1_protocol
  recorded_at: '2026-09-08'
  recorded_by_task: TASK-20260908-05f9f3
  archived_by: TASK-20260908-9baba3
  reason: >-
    DEC-20260908-1efe9b held Stage 0 of
    EXP-ECDLP-6a97f4 as a scaling-invariance
    instrument. Ranked next is Stage 1
    protocol completeness for the
    first-lift-digit comparison. This
    amendment writes that protocol. It
    does not authorize Stage 1 execution.
    Canonicality of the coefficient lift
    is not certified. P-S1-DIGIT remains
    untested. The frozen Stage 1 object
    is P-S1-RELATIVE: deformation
    sensitivity of d(F) under three
    p-coefficient perturbations of the
    uncertified 0..p-1 lift on the same
    four Stage 0 cells.
  predecessor_path: experiments/EXP-ECDLP-6a97f4/specification.yaml
  predecessor_sha256: f71674b24ff770d0f2c913df23e8cc4725c166c9863d9ea69efccf6469f76417
  scientific_parameters_changed: true
  preregistered_prediction_changed: true
  affected_runs: []
  confirmatory_status: preserved
  approved_by: coordinator
  approval_decision: DEC-20260908-bcccb1
  standing_authorization: >-
    AGENTS.md user instruction of 2026-09-06.
    This amendment freezes the Stage 1
    protocol text, including budget,
    artifacts, and replication. Coordinator
    completeness for execution authorization
    is a later decision and is not performed
    here.
  execution_authorized_stages_remain: [0]
  stage1_authorized_by_this_amendment: false
  exp_420e73_stage17_authorized: false
  exp_a98ea9_stage5_authorized: false
  SMALL_W_or_LARGE_W: false
  fit_of_a: false
  not_an_H1_claim: true
  not_a_canonicality_claim: true
  first_lift_digits_not_inspected_at_stage0: true
  P_S1_DIGIT_untested: true
  certificate:
    kind: none
  claim_tier: observational
  scale_relevance:
    tier: toy
    justification: >
      Four ordinary residue curves with
      13 <= p <= 37, reused from Stage 0.
      No transfer to cryptographic n.
    correspondence: null

  design_tightening_stage1_is_relative_not_serre_tate: >-
    IDEA-20260905-4dca34 prediction 2 and
    H-ECDLP-e9d9bb P-S1-DIGIT require a
    certified canonical lift versus
    certified noncanonical perturbations.
    Assumption A1 on H-ECDLP-e9d9bb and
    the idea's own inconclusive clause
    say that if canonicality cannot be
    certified, the comparison is
    inconclusive, not a positive. No
    Serre-Tate certification method is
    frozen here. Stage 1 therefore does
    not inspect P-S1-DIGIT. It freezes
    P-S1-RELATIVE: d(F) on the Stage 0
    0..p-1 coefficient lift versus three
    p-coefficient perturbations of that
    same uncertified lift. A nonzero
    n_digit_diff is deformation
    sensitivity of d(F), not a
    canonicality detector. A zero
    n_digit_diff on this panel misses
    P-S1-RELATIVE only. This is a
    disclosed tightening, not a silent
    change of P-S1-DIGIT.

  cells_reused_from_stage0:
    - id: S0-C13
      p: 13
      A: 1
      B: 5
      n: 9
      P: [3, 3]
    - id: S0-C17
      p: 17
      A: 1
      B: 5
      n: 15
      P: [2, 7]
    - id: S0-C19
      p: 19
      A: 1
      B: 1
      n: 21
      P: [0, 1]
    - id: S0-C37
      p: 37
      A: 1
      B: 3
      n: 39
      P: [0, 15]

  fixture:
    precision_r: 2
    scalings: [2, 3]
    working_model: >
      Coefficient lift of (A,B,P) into
      Z/p^2 by the representatives 0..p-1.
      Not certified Serre-Tate.
      canonicality_status: uncertified
      on every arm.
    section_rule: >
      Unique n-torsion lift of each
      non-identity multiple [k]P for
      k=1..n-1, n coprime to p, y != 0.
      Hensel on y at fixed x in 0..p-1.
    digit_convention: >
      d(F) = ((F - (F mod p)) / p) mod p
      using representatives 0..p-1 for F
      in Z/p^2.
    base_arm: >
      Stage 0 coefficient lift. Same
      (A,B,P) as RUN-ECDLP-6a97f4-S0.
    perturbations:
      - id: P10
        a: 1
        b: 0
        A_lift: A + p
        B_lift: B
      - id: P01
        a: 0
        b: 1
        A_lift: A
        B_lift: B + p
      - id: P11
        a: 1
        b: 1
        A_lift: A + p
        B_lift: B + p
    do_not_hunt_a_new_cell: true
    do_not_change_stage0_cells: true

  independent_variables:
    - cell in {S0-C13, S0-C17, S0-C19, S0-C37}
    - perturbation in {P10, P01, P11}
    - non-identity n-torsion section

  null_object:
    name: BASE versus BASE digit comparison
    construction: >
      d(F) on the Stage 0 lift compared
      to itself. n_digit_diff must be 0
      on every cell.
    non_degeneracy_check: >
      BASE-vs-BASE n_digit_diff == 0
      before any perturbation is read.
    dynamic_range_demonstration: >
      Each perturbation changes A or B
      by p in Z/p^2, so the model is a
      distinct lift of the same residue
      curve. Scaling u=2,3 of BASE must
      still leave F unchanged
      (Stage 0 law on the base arm).

  controls:
    - BASE versus BASE (n_digit_diff 0)
    - Stage 0 scaling invariance of F on the BASE arm (already held)
    - Stage 0 scaling invariance of F on each perturbed model
    - odd n > 3 coprime to p
    - A nonzero mod p
    - exact enumeration of n-1 sections
    - canonicality_status uncertified recorded, not silently upgraded

  metrics:
    primary:
      - n_digit_diff integer per (cell, perturbation)
      - n_digit_diff_panel integer sum over 12 pairs
      - relative_sensitivity_pass boolean (n_digit_diff_panel > 0)
      - fixture_pass boolean
    secondary:
      - per-cell n_sections
      - BASE-vs-BASE n_digit_diff
      - scaling_invariance_pass on BASE and on each perturbation
      - wall-clock seconds
    not_a_metric:
      - P-S1-DIGIT hit or miss
      - Serre-Tate canonicality
      - H1
      - W class

  preregistered_prediction:
    quantity: >
      Stage 1 instrument: n_digit_diff_panel
      > 0 on the frozen four-curve panel
      under the three frozen perturbations.
      Certificate kind none. P-S1-DIGIT
      untested.
    formula: >
      F = x^2 A^{-1} in Z/p^2.
      d(F) = ((F - (F mod p))/p) mod p.
      n_digit_diff(cell, Pab) = number of
      k in 1..n-1 with d(F_BASE) != d(F_Pab)
      on the unique n-torsion section of
      [k]P. FORCED Stage 1: fixture_pass
      true; BASE-vs-BASE n_digit_diff 0;
      certificate kind none.
      relative_sensitivity_pass is an
      observation, not a gate.
    source: >
      ledger/proposals/IDEA-20260905-4dca34.yaml
      predictions[1] tightened to a relative
      digit audit because canonicality is
      uncertified. Provenance internal.

  heuristic_under_test: none

  tail_checks:
    - BASE-vs-BASE n_digit_diff is 0 on every cell
    - each cell has n-1 sections with y != 0
    - F scaling invariance holds on BASE and on each perturbation under u=2,3
    - canonicality_status is uncertified on every arm
    - P-S1-DIGIT is not claimed hit or miss

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 1 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 1, HARD GATE: fixture_pass
      requires BASE-vs-BASE n_digit_diff 0,
      n-1 sections per cell, scaling
      invariance of F on every arm, and
      certificate kind none. relative_sensitivity_pass
      is not required for fixture_pass.
    - A zero n_digit_diff_panel after fixture_pass
      is a scoped miss of P-S1-RELATIVE, not
      failed_infrastructure and not a miss
      of P-S1-DIGIT.
    - A positive n_digit_diff_panel is
      deformation sensitivity of d(F), not
      a canonicality detector.
    - Stage 2 and later are not authorized.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 1 is not in execution_authorized_stages
    - Changing p, A, B, n, P, scalings, perturbations, or precision after this freeze
    - Hunting a new cell
    - Reading Stage 1 as Serre-Tate canonicality certification
    - Reading Stage 1 as a hit or miss of P-S1-DIGIT
    - Reading Stage 1 as H1, a W class, or an ECDLP advantage
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Changing H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73
    - Putting unofficial d(F) integers in commit messages

  success_criterion: >
    Stage 1 succeeds as a measurement when
    fixture_pass is true and the run
    manifest carries certificate.kind none.
    relative_sensitivity_pass is an
    observation. Success is not a
    canonicality claim and not a
    P-S1-DIGIT disposition.

  falsification_criterion: >
    After fixture_pass, n_digit_diff_panel
    == 0 is a scoped miss of P-S1-RELATIVE
    on this panel. It is not a miss of
    P-S1-DIGIT. Infrastructure bugs are
    not mathematics.

  required_artifacts:
    - Stage 1 raw-result.json with
      n_digit_diff per (cell, perturbation),
      n_digit_diff_panel, BASE-vs-BASE
      zeros, fixture_pass, and
      canonicality_status uncertified
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  combining_rule: >
    n_digit_diff_panel is the sum of
    n_digit_diff over the 12 frozen
    (cell, perturbation) pairs. No
    weighting. No sampling.

  limitations:
    - Four toy ordinary curves, 13 <= p <= 37.
    - Coefficient lift is not certified canonical.
    - P-S1-DIGIT is untested.
    - No cryptographic transfer.
    - No disposition of H-ECDLP-77caa5, 07c7c6, or 2ade73.
    - No Stage 17 of 420e73. No Stage 5 of a98ea9.
    - Certificate kind none. No solve, relation, or attack.
    - W is not classified.
