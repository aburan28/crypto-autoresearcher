experiment:
  id: EXP-ECDLP-6a97f4
  hypothesis_id: H-ECDLP-e9d9bb
  version: 1
  title: >
    Scaling invariance of F=x^2/A on a frozen four-curve
    ordinary n-torsion panel at precision r=2
  status: approved
  approved_by: coordinator
  approved_at: '2026-09-08'
  approval_decision: DEC-20260908-36385f
  approval_basis: >
    Standing user authorization recorded in AGENTS.md on
    2026-09-06 (ideas and experiments always approved once
    the protocol is complete). Coordinator completeness
    check is DEC-20260908-36385f after TASK-20260908-25fceb.
    User confirmation is not an outstanding gate.
  frozen: true
  frozen_at: '2026-09-08'
  execution_authorized: true
  execution_authorized_note: >
    Stage 0 only. Stages 1 and later remain unauthorized
    until an independent review of the Stage 0 instrument
    holds and a later Coordinator decision extends
    execution_authorized_stages. This approval does not
    authorize Stage 17 of EXP-ECDLP-420e73, does not
    authorize Stage 5 of EXP-ECDLP-a98ea9, does not
    classify W, and does not change H-ECDLP-77caa5,
    H-ECDLP-07c7c6, or H-ECDLP-2ade73.
  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-36385f
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-25fceb
  source_proposal: IDEA-20260905-4dca34
  class: control
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-36385f under the standing 2026-09-06
    user authorization. Stage 0 is the scaling-invariance
    instrument. Canonical-versus-arbitrary first-lift
    digits are a later stage and are not inspected here.

  objective: >
    Prove the scaling identity F(u^2 x, u^4 A) = F(x, A)
    in any ring where A and u are units, then evaluate F
    in Z/p^2 on every non-identity n-torsion section of
    four frozen ordinary residue curves, under two frozen
    unit scalings of the coefficient lift. Stage 0 decides
    whether the scaling instrument works. It does not
    certify Serre-Tate canonicality, does not compare
    first-lift digits, and does not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: zero changed F values under
      scalings u=2 and u=3 on the frozen panel. Symbolic
      identity holds in the polynomial ring before any
      evaluation. Certificate kind none.
    formula: >
      F = x^2 * A^{-1} in Z/p^2 Z.
      Scaling: A' = u^4 A, B' = u^6 B, x' = u^2 x, y' = u^3 y.
      Identity: A'^{-1} (x')^2 = A^{-1} x^2 whenever A and u
      are units. Evaluated at every non-identity point of
      the frozen n-torsion subgroup on each cell.
      FORCED Stage 0: scaling_invariance_pass is true;
      identity_pass is true; n_changed_F is 0.
    source: >
      ledger/proposals/IDEA-20260905-4dca34.yaml
      predictions[0] and minimal_test. Provenance internal;
      read in this design session.

  design_tightening_stage0_is_scaling_not_canonicality: >
    IDEA-20260905-4dca34 also predicts at least one
    first-lift-digit difference versus certified
    noncanonical perturbations. Stage 0 does not inspect
    those digits and does not certify canonicality of the
    coefficient lift. That comparison is a Stage 1+
    object. This is a disclosed tightening, not a silent
    change of the idea's claim.

  inputs:
    fixture:
      precision_r: 2
      scalings: [2, 3]
      cells:
        - id: S0-C13
          p: 13
          A: 1
          B: 5
          nE: 9
          n: 9
          P: [3, 3]
          curve: y^2 = x^3 + x + 5 over F_13
        - id: S0-C17
          p: 17
          A: 1
          B: 5
          nE: 15
          n: 15
          P: [2, 7]
          curve: y^2 = x^3 + x + 5 over F_17
        - id: S0-C19
          p: 19
          A: 1
          B: 1
          nE: 21
          n: 21
          P: [0, 1]
          curve: y^2 = x^3 + x + 1 over F_19
        - id: S0-C37
          p: 37
          A: 1
          B: 3
          nE: 39
          n: 39
          P: [0, 15]
          curve: y^2 = x^3 + x + 3 over F_37
      working_model: >
        Coefficient lift of (A,B,P) into Z/p^2 by the
        representatives 0..p-1. Not certified Serre-Tate.
      section_rule: >
        Unique n-torsion lift of each non-identity multiple
        [k]P for k=1..n-1, n coprime to p, y != 0.
      digit_convention_recorded_not_used: >
        d(F)=(F-lift(F mod p))/p mod p using 0..p-1.
        Stage 0 does not evaluate d(F) on a noncanonical
        comparison family.

  independent_variables:
    - cell in {S0-C13, S0-C17, S0-C19, S0-C37}
    - scaling u in {2, 3}
    - non-identity n-torsion section

  null_object:
    name: symbolic scaling identity before evaluation
    construction: >
      In Z[A,x,u,A_inv]/(A*A_inv-1), the polynomial
      (u^2 x)^2 * (u^4 A)^{-1} - x^2 * A^{-1} is the
      zero polynomial on the unit locus.
    non_degeneracy_check: >
      identity_pass must be true before any Z/p^2
      evaluation is read as a measurement.
    dynamic_range_demonstration: >
      A unit u=1 is the identity scaling and must
      give n_changed_F = 0. u=1 is not a frozen
      Stage 0 scaling; u=2 and u=3 are.

  controls:
    - symbolic scaling identity (baseline)
    - u=1 sanity on the same sections (must be zero change)
    - odd n > 3 coprime to p (no 2-torsion in the subgroup)
    - A nonzero mod p (unit)
    - exact enumeration of n-1 sections (no sampling)

  metrics:
    primary:
      - identity_pass boolean
      - scaling_invariance_pass boolean
      - n_changed_F integer
      - fixture_pass boolean
    secondary:
      - per-cell n_sections
      - per-cell n_changed_F
      - wall-clock seconds and peak RSS
      - expression size of the symbolic identity

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      Four ordinary residue curves with 13 <= p <= 37.
      No transfer to cryptographic n. Stages 1+, when
      authorized, remain toy-scale until a later
      amendment says otherwise.
    correspondence: null

  tail_checks:
    - identity_pass is true
    - n_changed_F == 0
    - each cell has n-1 sections with y != 0
    - u=2 and u=3 are units modulo every cell p

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: identity_pass and
      scaling_invariance_pass with n_changed_F = 0.
      Miss classifies the run failed_infrastructure
      if it is a representative/Hensel bug, otherwise
      it is a scoped falsification of P-S0-SCALING.
    - Stages 1 and later are not authorized.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing p, A, B, n, P, scalings, or precision after this freeze
    - Inspecting first-lift digits of a noncanonical family as a Stage 0 metric
    - Reading Stage 0 as Serre-Tate canonicality certification
    - Reading Stage 0 as H1, a W class, or an ECDLP advantage
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Changing H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73 from Stage 0 of this experiment

  success_criterion: >
    Stage 0 succeeds as a measurement when
    identity_pass is true, scaling_invariance_pass
    is true, n_changed_F is 0, fixture_pass is true,
    and the run manifest carries certificate.kind
    none. Success is instrument reproduction, not a
    canonicality claim and not an attack.

  falsification_criterion: >
    A certified F mismatch under a frozen scaling,
    after identity_pass, is a scoped miss of
    P-S0-SCALING on this panel. Infrastructure bugs
    are not mathematics. Stage 0 does not test
    P-S1-DIGIT, H-ECDLP-77caa5, or W.

  required_artifacts:
    - Stage 0 raw-result.json with identity_pass,
      scaling_invariance_pass, n_changed_F, per-cell
      counts, and fixture_pass
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - Four toy ordinary curves, 13 <= p <= 37.
    - Coefficient lift is not certified canonical.
    - First-lift-digit audit is unauthorized.
    - No cryptographic transfer.
    - No disposition of H-ECDLP-77caa5, 07c7c6, or 2ade73.
    - No Stage 17 of 420e73. No Stage 5 of a98ea9.
    - Certificate kind none. No solve, relation, or attack.
    - W is not classified.
