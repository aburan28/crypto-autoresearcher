experiment:
  id: EXP-DREG-dd668d
  hypothesis_id: H-DREG-1d0e5d
  question_id: RQ-DREG-d7b6d6
  derived_from_idea: IDEA-20260922-9d808c
  version: 1
  title: >-
    One certified degree-2 edge over F_4: does the chained t=4 degree-filtration
    rank profile move, once linear boolean substitutions are checked?
  status: approved
  objective: >-
    Decide a single pre-registered label for one ordinary F_4-isogeny edge.
    The label is agreement of the two native rank profiles, a filtration gap
    of at least 1 that the linear check does not remove, an order artifact, an
    instrument failure, a missing edge, a unit ideal, or an unmeasured matrix.
    No ECDLP exponent is claimed.
  inputs:
    ladder_id: LADDER-W-v1
    normative_definitions: this file, section frozen_ladder
    standing_authorization: >-
      AGENTS.md standing user authorization of 2026-09-06. Protocol approval
      is DEC-20260922-0397f8.
  controls:
    - id: GL-8
      description: >-
        Eight invertible F_2-linear substitutions of the base boolean
        variables, seed 20260922. All eight must reproduce r(d) for d <= 4.
    - id: NEARBY-DEG2
      description: >-
        One frozen substitution x0 |-> x0 + x1*x2 on the base ideal, reduced
        by the field equations. It may move r(d). A GL sample that moves r(d)
        is an instrument failure.
    - id: IDENTITY
      description: The identity substitution must match the native base profile bit for bit.
    - id: TRACE
      description: >-
        Domain and codomain must have the same #E(F_4). A mismatch voids the edge.
  independent_variables:
    - which native ideal, domain or codomain
    - the eight linear substitutions and the one degree-2 substitution
  metrics:
    primary:
      - max_d abs(r_domain(d) - r_codomain(d)) for d <= 4
      - gl_check_passed, a boolean
      - outcome_label
    secondary:
      - grevlex solving degree of each native ideal, or unmeasured
      - delta, the maximum total degree of the cleared boolean isogeny polynomials
      - denominator degree, recorded separately from numerator degree
      - first_fall and last_fall of each native ideal, as controls, not as the primary gap
  heuristic_under_test: HEUR-1d0e5d
  preregistered_prediction:
    quantity: max_d abs(r_domain(d) - r_codomain(d))
    formula: '0, conditional on gl_check_passed and neither ideal the unit ideal'
    source: >-
      H-DREG-1d0e5d. Agreement is the prediction. A difference of at least 1
      falsifies it. The prediction is not a degree-of-regularity formula and
      is not adjusted after a run.
  scale_relevance:
    tier: toy
    justification: >-
      F_4, boolean variable count 8 at rung n=1, degree bound 4. No transfer
      to a larger extension or to a cryptographic curve is assumed.
    correspondence: null
  tail_checks: []
  replication:
    seeds: [20260922]
    independent_instances: 1
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one protocol execution emits exactly one outcome_label.
    - Do not search a second edge if the first certified degree-2 edge exists.
    - Do not raise D_max above 4. A matrix that needs a higher degree is unmeasured.
  invalidation_rules:
    - A GL sample changes r(d). Label instrument. Do not interpret the codomain gap.
    - delta = 1 and the rank profiles differ. Label instrument.
    - Trace or homomorphism certificate fails. Label no-certified-edge.
    - Either ideal is the unit ideal in degree <= 1. Label degenerate-unit-ideal.
    - A matrix does not finish within the degree bound. Label unmeasured. Do not impute a large degree.
    - Subset-column ranks are not admissible.
  success_criterion: >-
    gl_check_passed is true, both native profiles finish for every d <= 4,
    neither ideal is the unit ideal, the primary max absolute difference
    is 0, and the grevlex solving degrees do not differ by at least 1
    (they agree, or at least one is unmeasured). Label nonlinear-but-flat
    if delta > 1, or linear if delta = 1. A grevlex gap of at least 1 is
    not these labels.
  falsification_criterion: >-
    gl_check_passed is true, both native profiles finish, neither ideal is
    the unit ideal, and the primary max absolute difference is at least 1.
    Label filtration-gap. When the primary difference is 0, a grevlex gap
    of at least 1 is the unique label order-artifact. That label does not
    by itself falsify rank agreement, and it is not linear or
    nonlinear-but-flat.
  required_artifacts:
    - experiments/EXP-DREG-dd668d/runs/<RUN-ID>/metrics.json
    - experiments/EXP-DREG-dd668d/runs/<RUN-ID>/report.md
    - experiments/EXP-DREG-dd668d/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-dd668d/runs/<RUN-ID>/certificates.json
  assigned_to: executor
  approved_by: coordinator
  approval_decision: DEC-20260922-0397f8
  claim_ceiling:
    tier: toy
    forbids:
      - an ECDLP exponent
      - a class-wide slope
      - equating first-fall, last-fall, grevlex solving degree, and degree of regularity
      - treating a timeout as evidence that a degree exploded

frozen_ladder:
  id: LADDER-W-v1
  norm: >-
    Later contracts EXP-DREG-ab3fee, EXP-DREG-6de989, and EXP-DREG-c3e8c9 use
    these definitions unchanged. A change is an amendment of this file, not a
    redefinition in those files.
  field:
    F4: 'F_2[z]/(z^2 + z + 1)'
    F16: 'F_2[w]/(w^4 + w + 1)'
    embedding: >-
      F_4 is the subfield of F_16 cut out by T^2 + T + 1. Curve coefficients
      live in that subfield at both rungs.
  curve_model: >-
    Ordinary characteristic 2: y^2 + x*y = x^3 + a2*x^2 + a6 with a6 != 0.
    This is not the odd-characteristic short Weierstrass model. Supersingular
    models are out of scope.
  point_counts: >-
    Enumerate all affine points over the rung field. Trace over F_4 is
    t = 5 - #E(F_4). Ordinary means t is odd.
  base_curve: >-
    Lexicographic order on (a2, a6) with basis (1, z), a6 nonzero. The base
    is the first ordinary curve in that order.
  kernel: >-
    The unique rational point T = (0, s) with s^2 = a6. Over F_4 the Frobenius
    x |-> x^2 is bijective, so s exists and is unique.
  edge_certificate:
    - phi(T) is the point at infinity on the codomain
    - phi(P+Q) = phi(P)+phi(Q) for every pair of F_4-rational points
    - the codomain has the same #E(F_4) as the domain
    - a dual map satisfies dual(phi(P)) = [2]P for every F_4-rational point
    - a failed certificate is no-certified-edge, not a degree result
  class: >-
    Every ordinary model with the base trace. A class range may be reported
    only when each such model is either reached by a chain of certified
    degree-2 edges or listed as missing. Any missing model sets certified
    false. There are at most 12 candidate models (4 values of a2, 3 of a6).
  rungs:
    n1: curve and auxiliaries over F_4, Weil-restricted to F_2
    n2: curve and auxiliaries over F_16, Weil-restricted to F_2
  chained_system:
    t: 4
    k: 1
    factor_base: 'V = {0, 1} inside the rung field'
    equations: >-
      S_3(u1, x1, x2) = 0, S_3(u1, u2, x3) = 0, S_3(u2, x4, R_X) = 0, with
      each x_i in V and each u_j ranging over the rung field. R_X is the
      element 1. Do not replace R_X if the ideal is a unit ideal; that label
      is degenerate-unit-ideal.
    summation_polynomial: >-
      Build S_3 by elimination from the group law on this model. Certify it
      on every triple of F_4-points at rung n=1, and on all relations among
      E(F_4) plus 32 frozen triples over F_16 at rung n=2. A failed certificate
      stops the run before any rank is read.
  boolean_matrix:
    ring: 'F_2[variables] / (x_i^2 + x_i)'
    columns: square-free monomials of degree at most d
    rows: square-free reductions of m*g for generators g and monomials m with deg(m)+deg(g) <= d
    r(d): exact rank of that full matrix over F_2
    D_max: 4
    homogeneity_gate: >-
      The field equations x_i^2 + x_i make this matrix inhomogeneous.
      CORR-20260808-f4d780 says a homogeneous graded rank is frame-invariant.
      If the implementation drops the degree-1 part of the field equations or
      otherwise homogenizes, label homogeneous-no-op and do not treat the GL
      sample as evidence of invariance. The two native profiles may still be
      compared and are then labeled without a GL attribution.
  falls: >-
    Let V_d be the row-span of the degree-at-most-d matrix inside the
    square-free monomials of degree at most d. A fall at d occurs when
    V_d intersect (monomials of degree < d) properly contains V_{d-1}.
    first_fall is the minimum such d, or none. last_fall is the maximum
    such d, or none. none is a finished observation that no fall occurred
    at d <= D_max, not an unmeasured cell. The recorded value stays none.
    The last-fall increment from rung n=1 to n=2, and any numeric comparison
    with first_fall, reads each none as 0 and then uses those integers.
    These are not the Bardet-Faugère-Salvy degree of regularity and are not
    grevlex solving degree.
  grevlex: >-
    Variable order is the boolean bits of x1, x2, x3, x4, u1, u2, with the
    bit of x1 first. grevlex solving degree is the maximum total degree of an
    element of a reduced grevlex Gröbner basis of the boolean ideal, and only
    if every S-polynomial reduces without exceeding D_max. Otherwise
    unmeasured.
  gl_sample: >-
    Python random.Random(20260922). For each of eight matrices, start from
    the identity and left-multiply by N elementary transvections whose pivot
    and target indices are drawn from the RNG. Reject a singular matrix and
    draw again, at most 100 draws. More than 100 failures is label instrument.
  delta: >-
    Clear denominators on the isogeny coordinate maps, Weil-restrict to F_2,
    and set delta to the maximum total degree of those boolean polynomials.
    Record the denominator degree separately. Characteristic-2 squaring may
    change the degree relative to the x-line. The recorded delta is the
    boolean one.
  not_this_experiment:
    - tools/isogeny_dreg_search.py functional F2, the prime-field m=3 first-fall screen
    - EXP-DREG-c92f56, a different unexecuted linear-frame battery
    - a single true degree of regularity
    - Pollard rho
