# =============================================================================
# EXP-BINSTD-1a7892 -- VERSION 1 (APPROVED by DEC-20261001-bcc056) frozen
# contract for H-BINSTD-6e3bd4: Stage 0 Arm B arithmetic + dual rho columns
# + OPEN reachability cell; Stage 1 Gorla-Massierer literature calibration;
# Stage 2 toy per-trial decomposition cost vs g on T_k cells.
#
# Source: IDEA-20260922-8278db under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Absorbs review defects from
# analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-8278db.yaml
# (verdict sound / HOLD-L design_after): corrected rho comparator; Gorla-
# Massierer gate; T4 tripwire against citing (B) without (C)+(D).
#
# ZERO RUNS in this design packet. Stages 0-2 authorized for later executor
# TASK-20261001-d6b2b5 (Stage 2 gated on Stage 0+1 artifact presence).
# No AUXIN. Amazon Bedrock prohibited. packaging_only false.
# =============================================================================
experiment:
  id: EXP-BINSTD-1a7892
  hypothesis_id: H-BINSTD-6e3bd4
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-8278db
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Stage 0 T_k / Gaudry Arm B arithmetic audit (naive cost, rho_reg, dual
    rho margins, OPEN cell); Stage 1 Gorla-Massierer g=2,4 calibration;
    Stage 2 toy per-trial decomposition cost vs g in {2,4,6,8}
  status: approved
  approved_by: DEC-20261001-bcc056
  approved_at: '2026-10-01'
  packaging_only: false
  approval:
    approved_by: DEC-20261001-bcc056
    composing_decision: DEC-20261001-bcc056
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Does NOT claim a break. HOLD-L
      defects absorbed. Tripwire T4 frozen.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stages 0-2. Stage 0 is arithmetic (zero scientific group walks on
      deployed curves). Stage 1 is literature retrieval/extraction (zero
      compute). Stage 2 is toy measurement at g<=8 only and MUST NOT start
      until Stage 0 and Stage 1 artifact directories exist (Stage 1 may
      record unrecovered=true if the paper cannot be retrieved — Stage 2
      may then proceed with calibration marked incomplete). Deployed-curve
      attacks, exponent claims, and DEFINED-cost filing without
      review-breakthrough on DO-3 are NOT authorized.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (A) Commit the arithmetic certificate for naive Arm B cost bits,
    rho_reg, and dual-column margins vs matched rho at the five deployed
    rows; file the reachability cell OPEN with named missing quantity.
    (B) Retrieve Gorla-Massierer measured per-relation costs at g=2,4 and
    compute calibration vs H2-only prediction (or record unrecovered).
    (C) Measure per-trial decomposition cost vs g on toy T_k cells
    g in {2,4,6,8}; fit a growth law; state extrapolation distance to
    g=22; never emit a deployed break claim.

  class: cost-model-measurement
  class_note: >-
    Primary class is cost-model / regime-validity audit with a literature
    calibration arm and a toy growth-law measurement. Not a smoothness
    CDF heuristic-validation. HEUR ids are falsification hooks for the
    arithmetic, H2 calibration, and per-trial-unknown statements.
    Measured vs modeled columns stay separate. No exponent-moving claim.
    Break-adjacent DO-3 outcomes require review-breakthrough before any
    DEFINED filing.

  corrections_absorbed:
    dual_rho_columns: >-
      HOLD-L: report BOTH the reused d11575/c07598 matched-rho column
      (labeled inherited/modeled) AND a recomputed canonical comparator
      log2(sqrt(pi*r/(4*k))) (labeled recomputed). Canonical margins are
      ~0.5 bit larger; this strengthens the discredited "apparent break",
      never licenses reporting one.
    gorla_massierer_gate: >-
      Stage 1 must attempt retrieval of iacr:2014/318 / arXiv:1405.1059
      and extract MEASURED (not asymptotic) per-relation costs at g=2,4
      before any cell may move from OPEN toward DEFINED. Provenance
      upgrades recalled→retrieved only when an agent actually reads the
      source (verified_by required).
    tripwire_T4: >-
      Any artifact that prints (B) naive bits MUST also print rho_reg (C)
      and the OPEN/missing-quantity statement (D) in the same file.
      Success criterion forbids (B)-only deliverables.

  scope:
    included:
      - >-
        Stage 0 (arithmetic; zero scientific trials on deployed curves):
        (i) recompute naive charged bits for k in {11,13,17,19,23};
        (ii) recompute rho_reg=(k-1)/16; (iii) dual rho margins
        (reused + canonical); (iv) confirm r~q^{k-1} bit check vs audit;
        (v) corpus recheck that arity>=4 per-trial cost cells remain
        absent (cite IDEA-20260807-32f96d + search note); (vi) write
        reachability-table cell OPEN with named missing quantity;
        (vii) ECC2K-130 null note (no T_k).
      - >-
        Stage 1 (literature; zero compute): retrieve Gorla-Massierer;
        extract measured per-relation cost at g=2,4; compute calibration
        ratio vs H2-only 1/(g!) or 1/(g-1)! as stated by a77711; record
        provenance retrieved with verified_by; or unrecovered=true with
        attempted URLs.
      - >-
        Stage 2 (toy executable): for each (d,k') in
        {(4,3),(4,5),(4,7),(4,9)} construct T_k descended decomposition
        system at g=k'-1; measure per-trial cost (Macaulay ops and/or
        wall); fit growth law in g; state extrapolation distance to
        g=22; run null and non-T_k same-arity controls; certificate-
        verify every claimed decomposition.
    excluded:
      - Any scientific group walk / attack run at deployed k in {11..23}
      - Filing a DEFINED attack cost or break claim without DO-3 review-breakthrough
      - Editing AUXIN / QSP / SEMBIN
      - Amazon Bedrock
      - Claiming Gaudry or Gorla-Massierer as verified without reading them

  inputs:
    proposal: ledger/proposals/IDEA-20260922-8278db.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-8278db.yaml
    curve_audit: analysis/binstd-curve-audit/
    hypothesis: ledger/hypotheses/H-BINSTD-6e3bd4.yaml
    a77711: ledger/proposals/IDEA-20260906-a77711.yaml
    idea_32f96d: ledger/proposals/IDEA-20260807-32f96d.yaml
    optional_code_refs:
      - experiments/EXP-CERTBIN-e94b27/impl/macaulay.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
    literature_targets:
      - id: gorla_massierer_2014
        refs:
          - 'https://eprint.iacr.org/2014/318'
          - 'https://arxiv.org/abs/1405.1059'
        extract: measured per-relation / per-decomposition cost at n=3,5 (g=2,4)
        provenance_on_success: retrieved
    cells:
      Stage0-deployed-rows:
        q: 65536
        q_bits: 16
        k_list: [11, 13, 17, 19, 23]
        frozen_expected_naive_bits: [50.6, 58.2, 74.3, 82.7, 100.5]
        frozen_expected_rho_reg: [0.625, 0.750, 1.000, 1.125, 1.375]
        frozen_expected_r_bits_q_km1: [160, 192, 256, 288, 352]
        frozen_expected_audited_r_bits: [161, 193, 257, 289, 353]
        frozen_reused_rho_bits: [77.9, 93.7, 125.5, 141.5, 173.3]
        frozen_reused_margin_bits: [27.3, 35.5, 51.3, 58.8, 72.8]
        tolerance_bits: 0.5
        tolerance_rho_reg: 0.01
      Stage2-toys:
        - {d: 4, k_prime: 3, g: 2, dk: 12}
        - {d: 4, k_prime: 5, g: 4, dk: 20}
        - {d: 4, k_prime: 7, g: 6, dk: 28}
        - {d: 4, k_prime: 9, g: 8, dk: 36}
      NULL-no-subfield: >-
        Ordinary binary curve over a prime-extension field with no proper
        subfield (e.g. toy n prime); instrument must report no T_k
        construction (not a finite cost).
      CTRL-non-Tk-same-arity: >-
        Matched non-abelian-variety / non-T_k factor-base decomposition
        system of the SAME arity g; isolates arity-driven vs T_k-specific
        growth.

  controls:
    - name: small_g_sanity_slice
      object: >-
        g=2 cell (and Stage 0 hypothetical k'=3 arithmetic): formula must
        behave cheaply where rho_reg << 1; instrument must return a finite
        measured cost at g=2 (smoke).
    - name: null_no_subfield
      object: >-
        NULL-no-subfield: no T_k construction. Failure invalidates instrument.
    - name: non_Tk_same_arity
      object: >-
        CTRL-non-Tk-same-arity at each affordable g: compare growth to T_k
        arm; report both curves separately (measured).
    - name: certificate_oracle
      object: >-
        Every claimed decomposition re-verified by summing points on the
        curve; no solver verdict trusted alone.
    - name: tripwire_T4_artifact_check
      object: >-
        Every Stage 0 deliverable that contains naive_bits also contains
        rho_reg and open_missing_quantity fields in the same file.
    - name: dual_rho_column_check
      object: >-
        Stage 0 margins table has columns reused_rho_bits and
        canonical_rho_bits; never mixed into one unlabeled column.

  independent_variables:
    - stage  # 0 | 1 | 2
    - k  # deployed row or k_prime toy
    - g  # k-1
    - d  # toy base-field degree
    - construction  # Tk | non_Tk | null
    - seed

  metrics:
    primary:
      - naive_charged_cost_bits_per_row
      - regime_ratio_rho_reg_per_row
      - margin_below_rho_reused_bits
      - margin_below_rho_canonical_bits
      - reachability_cell_verdict
      - named_missing_quantity
      - gorla_massierer_measured_cost_g2
      - gorla_massierer_measured_cost_g4
      - calibration_ratio_vs_H2
      - per_trial_decomposition_cost_vs_g
      - fitted_growth_law
      - extrapolation_distance_to_g22
    secondary:
      - r_bit_check_pass
      - arity_ge4_corpus_recheck
      - certificate_pass_rate
      - null_reports_no_construction
      - non_Tk_cost_vs_g
      - peak_rss_bytes
      - wall_s
      - termination_reason
      - literature_unrecovered

  heuristic_under_test:
    - HEUR-BINSTD-6e3bd4-H0
    - HEUR-BINSTD-6e3bd4-H1
    - HEUR-BINSTD-6e3bd4-H2

  preregistered_prediction:
    quantity: >-
      (A) naive bits = [50.6,58.2,74.3,82.7,100.5] (±0.5);
      (B) rho_reg = [0.625,0.750,1.000,1.125,1.375] (±0.01);
      (C) reused margins ~[27.3,35.5,51.3,58.8,72.8] growing with k;
      (D) canonical margins ~0.5 bit larger;
      (E) cell verdict = OPEN with missing quantity = per-trial cost at
      arity 10-22 over F_2^16;
      (F) Stage 2: per-trial cost increases with g on T_k toys (a priori
      expectation); fitted law + extrapolation distance required;
      (G) NO break claim under any outcome without review-breakthrough on DO-3.
    formula: >-
      naive_bits = 16*(2-2/g) + log2((k-1)!) with g=k-1;
      rho_reg = (k-1)/16;
      canonical_rho_bits = log2(sqrt(pi*r/(4*k)));
      reused_rho_bits inherited from d11575/c07598 column.
    source: >-
      IDEA-20260922-8278db (A)(B)(C)(D); HOLD-L review dual-rho fix;
      H-BINSTD-6e3bd4; a77711 Arm B / H2
    claim_tier: observational
    measured_vs_modeled: >-
      Stage 0 naive bits, rho_reg, canonical rho, and bit checks are
      RECOMPUTED arithmetic (labeled recomputed); reused rho column is
      INHERITED/MODELED comparator in a separate column. Stage 1 literature
      numbers are EXTRACTED (labeled extracted; provenance retrieved) or
      unrecovered. Stage 2 wall_s, peak_rss, op counts are MEASURED; any
      extrapolated cost to g=22 is MODELED with explicit distance and must
      not be filed as a deployed DEFINED cost in this experiment's success
      criterion.

  scale_relevance:
    tier: toy_plus_deployed_arithmetic
    justification: >-
      Stage 0 uses deployed parameter identities as arithmetic only (no
      group walks). Stage 2 toys at dk'<=36, g<=8 access the missing
      quantity at affordable arity; transfer to deployed g in {10..22} is
      an EXPLICIT extrapolation with stated distance, never a silent
      promotion. Correspondence: none exact to deployed attack cost.
    correspondence: null

  sample_size_justification: >-
    Stage 0: five fixed rows (complete census of the target family).
    Stage 1: two literature cells (g=2,4) — all implemented cases named
    by the source idea/review. Stage 2: four g values {2,4,6,8}; at each
    g run enough independent seeds (minimum 5) that median and max
    per-trial cost are stable to within a factor of 2, or until
    advisory wall-clock exhausts with partial results labeled partial.
    Tail: report the single most expensive trial per g alongside the median.

  tail_checks:
    - Report max per-trial cost per g alongside median (not averaged away).
    - Smoothest/cheapest trial must not be the sole reported figure.
    - Any DO-3-shaped surviving-margin reading is a hard escalation, not a quiet DEFINED filing.
    - Tripwire T4: reject (B)-only artifacts.

  replication:
    seeds:
      - 20261001
      - 20261002
      - 20261003
      - 20261004
      - 20261005
    independent_instances: >-
      Stage 0 deterministic. Stage 1 single extraction with source hash /
      URL recorded. Stage 2: minimum 5 seeds per affordable (d,k') cell;
      if g=8 is instrument-infeasible, record instrument_ceiling and still
      complete g in {2,4,6} with the same seed set.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_runs: 40
    maximum_workers: 1

  stopping_rules:
    - >-
      Stage 0 complete when arithmetic tables, dual rho margins, OPEN cell
      artifact, corpus recheck note, and T4-compliant fields are written.
    - >-
      Stage 1 complete when literature extraction OR unrecovered=true with
      attempted URLs is written.
    - >-
      Stage 2 may start only after Stage 0 and Stage 1 artifact dirs exist.
      Stage 2 complete when cost-vs-g table, fitted law, extrapolation
      distance, null control, and non-T_k control are written for all
      affordable g (instrument_ceiling allowed).
    - Advisory wall-clock: checkpoint and report; never fabricate completion.
    - >-
      Hard stop on DO-3-shaped reading (surviving extrapolated margin below
      rho): preserve artifacts, set termination_reason=break_adjacent_halt,
      do not file DEFINED.

  invalidation_rules:
    - Stage 0 naive bits or rho_reg outside tolerance vs frozen expected
    - Dual rho columns missing or mixed/unlabeled
    - T4 violation ((B) without (C)+(D) in same artifact)
    - Null control reports a finite T_k cost
    - certificate_pass_rate < 1.0 on claimed decompositions
    - timeout/crash/OOM → failed_infrastructure, not negative math evidence
    - Amazon Bedrock invocation attempted → abort
    - Claiming retrieved provenance without verified_by / without reading

  success_criterion: >-
    Stage 0: recomputed naive bits and rho_reg within tolerance; dual rho
    margins present; r bit-check passes; cell verdict OPEN with named
    missing quantity; T4 fields present; ECC2K-130 null note present.
    Stage 1: extraction artifact or unrecovered record present.
    Stage 2: measured cost-vs-g for all affordable g; fitted law;
    extrapolation_distance_to_g22 stated; null and non-T_k controls pass;
    certificates verify. Decidable from predefined metrics. Success does
    NOT include filing a DEFINED deployed attack cost.

  falsification_criterion: >-
    Stage 0 arithmetic outside tolerance; Stage 2 shows slow (polynomial)
    growth that would leave a surviving extrapolated margin (DO-3 —
    escalate, do not quietly succeed as DEFINED); null/certificate
    invalidation. Distinguish infrastructure via invalidation_rules.

  required_artifacts:
    - experiments/EXP-BINSTD-1a7892/stage0/naive-cost-table.yaml
    - experiments/EXP-BINSTD-1a7892/stage0/rho-reg-table.yaml
    - experiments/EXP-BINSTD-1a7892/stage0/dual-rho-margins.yaml
    - experiments/EXP-BINSTD-1a7892/stage0/reachability-table-cell.yaml
    - experiments/EXP-BINSTD-1a7892/stage0/corpus-arity-ge4-recheck.yaml
    - experiments/EXP-BINSTD-1a7892/stage0/ecc2k130-null-note.md
    - experiments/EXP-BINSTD-1a7892/stage1/gorla-massierer-extraction.yaml
    - experiments/EXP-BINSTD-1a7892/stage1/calibration-ratio.yaml
    - experiments/EXP-BINSTD-1a7892/stage2/cost-vs-g-table.yaml
    - experiments/EXP-BINSTD-1a7892/stage2/fitted-growth-law.yaml
    - experiments/EXP-BINSTD-1a7892/stage2/controls-report.yaml
    - experiments/EXP-BINSTD-1a7892/stage2/certified-decompositions/
    - experiments/EXP-BINSTD-1a7892/runs/*/manifest.yaml
    - experiments/EXP-BINSTD-1a7892/runs/*/raw-result.json
    - experiments/EXP-BINSTD-1a7892/runs/*/stdout.log

  procedure:
    stage0:
      - Recompute 16*(2-2/g)+log2((k-1)!) for each deployed k; compare to frozen expected.
      - Recompute rho_reg=(k-1)/16; compare to frozen expected.
      - Recompute canonical_rho_bits=log2(sqrt(pi*r/(4*k))) using audited r; place beside reused column.
      - Write dual-rho-margins.yaml with both margin columns (T4: include rho_reg + OPEN note).
      - Write reachability-table-cell.yaml: verdict=OPEN; missing_quantity=per-trial cost at arity 10-22 over F_2^16.
      - Corpus recheck for arity>=4 measured cost cells; write note citing IDEA-20260807-32f96d.
      - Write ecc2k130-null-note.md (n=131 prime → no T_k).
    stage1:
      - Attempt fetch of iacr:2014/318 and/or arXiv:1405.1059; record URLs and content hashes if obtained.
      - Extract MEASURED per-relation costs at n=3,5 (g=2,4); if only asymptotics present, say so.
      - Compute calibration_ratio = measured / H2-only prediction; write calibration-ratio.yaml.
      - Set provenance retrieved with verified_by=executor (or unrecovered=true).
    stage2:
      - Confirm stage0/ and stage1/ artifact dirs exist.
      - For each toy (d,k'): build T_k descended system; measure per-trial cost over >=5 seeds.
      - Run NULL-no-subfield and CTRL-non-Tk-same-arity.
      - Fit growth law in g; write extrapolation_distance_to_g22 (e.g. 22-max_g_measured).
      - Certificate-verify every claimed decomposition.
      - If any reading looks DO-3 (surviving margin), halt with break_adjacent_halt.

  optimistic_assumptions_disclosed:
    - >-
      Treating (k-1)! as the sole overhead understates cost if per-trial
      solve is super-polylog (bias: optimistic for the attack / pessimistic
      for the OPEN verdict's caution). Direction flagged.
    - >-
      Stage 2 Macaulay-rank instrument may understate true Groebner cost at
      higher g relative to a full engine (bias: optimistic for attack).
    - >-
      Extrapolation from g<=8 to g=22 assumes smoothness of the cost law
      (likely false near phase transitions); labeled modeled bound, not
      prediction.

  memory_accounting: >-
    Stage 0/1 negligible. Stage 2: peak_rss_bytes measured per run; dominant
    structure is the Macaulay / descended-system matrix — size analytically
    noted per g in fitted-growth-law.yaml alongside measured RSS.

  assigned_to: executor
  dominated_by: >-
    Matched rho on every standardized row for attack cost; this experiment's
    sota_delta is reachability-table correctness (OPEN + named missing
    quantity + rho_reg gate), not an attack-cost improvement.
  sota_delta:
    time: Unresolved for attack cost; methodological delta is the quantified regime failure.
    memory: Order-q FB size comparatively trustworthy; not promoted here.
    data_queries: N/A.
