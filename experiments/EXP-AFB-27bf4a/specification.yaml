experiment:
  id: EXP-AFB-27bf4a
  hypothesis_id: H-AFB-d42351
  question_id: RQ-RELN-001
  goal_id: GOAL-ECDLP-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  claim_tier: toy
  title: >-
    Charged bounded-degree algebraic-factor-base census with matched random and
    extension-field controls
  objective: >-
    Audit the bounded-degree, target-independent, single-plane-predicate slice of
    KN-OPEN-020. Stage 0 derives the intersection and N/B^m coverage bounds with
    exact arithmetic. Stage 1 enumerates explicit toy predicates and charges
    description, membership, source recovery, relation, target-descent, time, and
    memory separately. Matched random subsets test whether coverage is cardinality
    alone, while a toy extension-field subfield base verifies that the instrument
    can represent a nearby interface where algebraic structure is useful. No
    stage is permitted to call this a universal no-go theorem.
  what_this_is_not:
    - Not a universal theorem about every algebraically described factor base.
    - Not an ECDLP attack, relation-bank claim, or sub-rho exponent measurement.
    - Not a test of high-degree interpolation, multiple predicates, implicit membership, or target-dependent descriptions.
    - Not permission to execute; approval, freezing, dispatch, and archival review are separate Coordinator gates.
  inputs:
    prime_field_cells:
      primes: [101, 103, 107, 211]
      curve_selection: deterministic first nonsingular ordinary curve with a recorded subgroup generator
      predicate_degrees: [1, 2, 3, 5]
      predicates_per_cell: 5
      descent_arities: [2, 3]
      targets: exhaustive over the toy subgroup
    random_null:
      subsets_per_cell: 20
      cardinality: matched exactly to the corresponding algebraic base
    extension_control:
      field_cells: [[2, 3], [3, 2]]
      base: x-coordinate subfield points, exhaustively enumerated
    seed_derivation: >-
      Derive every random coefficient and random-subset sample from SHA-256 of
      EXP-AFB-27bf4a/v1, arm, cell, and replicate; record the full seed material
      and reject repeated subset elements in digest order.
  controls:
    - id: CTRL-AFB-BEZOUT
      method: Exact projective intersection and multiplicity audit for every explicit plane predicate.
      pass_condition: Every valid predicate has |F| <= 3d after component handling; any violation stops interpretation.
    - id: CTRL-AFB-RANDOM-SUBSET
      method: Compare algebraic and uniformly random bases at identical (N,B,m), with the null measured first.
      pass_condition: Coverage and trial distributions are reported with the pre-registered finite-sample band.
    - id: CTRL-AFB-EXTENSION
      method: Enumerate the toy subfield base and its sumset using independent field construction and group verification.
      pass_condition: Exhaustive counts and subgroup membership certificates agree; failure invalidates the instrument, not the prime-field lane.
    - id: CTRL-AFB-SOURCE-RECOVERY
      method: For every accepted factor-base point, independently recover and verify the signed source point before using it in a relation.
      pass_condition: 100 percent certificate verification; a predicate hit without a source is not a relation.
    - id: CTRL-AFB-COST-SEPARATION
      method: Keep field operations, group operations, target trials, stored bits, and wall time in separate columns.
      pass_condition: No cross-type conversion is made without a separately registered cost ruler.
  independent_variables:
    - predicate_degree
    - predicate_family
    - factor_base_construction
    - descent_arity
    - prime_field_cell
  metrics:
    primary:
      - factor_base_cardinality_B
      - intersection_degree_bound_3d
      - coverage_fraction
      - target_trial_count
      - charged_description_bits
      - charged_membership_field_operations
      - charged_source_recovery_operations
      - charged_memory_bits
    secondary:
      - verified_relation_count
      - relation_yield
      - random_null_coverage_distribution
      - extension_control_coverage
      - wall_clock_seconds
      - peak_memory_gb
  replication:
    seeds: [1, 2, 3, 4, 5]
    independent_instances: 4
    seed_policy: Deterministic digest-derived seeds; no unrecorded ambient randomness.
  budget:
    wall_clock_seconds_per_run: 1200
    total_wall_clock_seconds: 7200
    maximum_memory_gb: 4
    maximum_runs: 24
  stopping_rules:
    - Run Stage 0 before any enumeration; if the symbolic bound or charge decomposition is inconsistent, stop without a mathematical interpretation.
    - Stop if CTRL-AFB-BEZOUT or CTRL-AFB-EXTENSION fails; classify the run as invalid_measurement.
    - Stop each run at 1200 seconds and record the exact completed cells; never extrapolate a censored cell.
    - Stop before any universal-language conclusion; a surviving bounded-degree census is only a scoped result and requires Coordinator synthesis.
  invalidation_rules:
    - Missing exact command, clean revision, environment, seed, raw result, or logs invalidates the run.
    - Counting a relation from membership alone, omitting source recovery, or using the Bezout upper bound as the measured base size invalidates the affected cell.
    - Any amendment after an observed number requires a versioned successor with exploratory-only status.
  success_criterion: >-
    The contract succeeds as an instrument only when every completed cell has
    passing controls and a complete separated cost ledger. Scientific outcomes
    are then classified as scoped confirmation, scoped counterexample, or
    inconclusive; none changes KN-OPEN-020 automatically.
  falsification_criterion: >-
    A verified bounded-degree predicate violating the intersection bound or a
    verified charged descent path below the declared N/B^m trial term falsifies
    this scoped interface hypothesis. Backend, timeout, missing-artifact, and
    control failures falsify no mathematical claim.
  required_artifacts:
    - experiments/EXP-AFB-27bf4a/specification.yaml
    - experiments/EXP-AFB-27bf4a/implementation/charged_census.py
    - experiments/EXP-AFB-27bf4a/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-AFB-27bf4a/runs/<RUN-ID>/command.txt
    - experiments/EXP-AFB-27bf4a/runs/<RUN-ID>/environment.json
    - experiments/EXP-AFB-27bf4a/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-AFB-27bf4a/runs/<RUN-ID>/stdout.log
    - experiments/EXP-AFB-27bf4a/runs/<RUN-ID>/stderr.log
    - experiments/EXP-AFB-27bf4a/analysis.md
    - experiments/EXP-AFB-27bf4a/execution-report.yaml
  assigned_to: executor
  inference_receipt:
    requested_policy: executor-implementation
    resolved_model_id: null
    fallback_used: false
    authorization_ref: null
