# =============================================================================
# EXP-MONO-01e759 — version 1, approved by DEC-20261005-b5fa9e.
# Frozen census of the signed-sum monodromy image on four ordinary curves at
# p = 101, over the ordered base. Prediction (order exactly 4, exponent 2,
# versus a proper subgroup, versus an escape from the degree-4 closure) is
# fixed here, before any run. This design session computed no Frobenius
# permutation of Psi. Point counts, j-invariants, z^101 = -z, and the RNG
# prefixes below were computed as pins.
# =============================================================================
experiment:
  id: EXP-MONO-01e759
  hypothesis_id: H-MONO-9ce194
  question_id: RQ-MONO-001
  source_idea: IDEA-20261005-70b25b
  goal_id: null
  version: 1
  title: >-
    Toy census at p=101 of the monodromy image of the four signed sums over
    the ordered base: order-4 biquadratic image, a proper subgroup, or an
    escape from the degree-4 closure
  status: approved
  approved_by: DEC-20261005-b5fa9e
  approved_at: '2026-10-05'
  packaging_only: false
  approval:
    approved_by: DEC-20261005-b5fa9e
    composing_decision: DEC-20261005-b5fa9e
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06: "all is
      approved. ideas/experiments should be always approved") because every
      field the design protocol requires is non-null. Approval does not assert
      that the image has order 4.
    implementation_authorized: true
    scientific_execution_authorized: true
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide, on a pinned panel of four ordinary curves at p = 101, whether the
    p-power Frobenius permutations of
    Psi = {P+Q, -(P+Q), P-Q, -(P-Q)} generate a group of order exactly 4 and
    exponent 2, a group of order dividing 2, or a group that does not fit in
    the degree-at-most-4 closure. The assignment of each observation to a
    reading is the table mechanism_assignment. A failed control or an inertia
    disagreement is inconclusive.

  inputs:
    prime: 101
    m: 3
    model: short Weierstrass y^2 = x^3 + A*x + B over F_101
    base_field:
      polynomial: z^2 + 2
      frobenius_pin: >-
        In F_101[z]/(z^2 + 2), z^101 = -z. This was computed in the design
        session by binary exponentiation: z^101 = (0, 100) in the basis
        (1, z). The executor recomputes it before any curve arithmetic. A
        mismatch is failed_infrastructure. The p-power map is therefore
        a + b z maps to a - b z.
      note: >-
        z^2 + 2 is irreducible over F_101 because the Legendre symbol
        (-8 / 101) = -1, also computed in this session. Square roots of
        F_101 elements live in this field. Elements are a + b z with
        a, b in {0, ..., 100}.
    frobenius: >-
      The primary permutation is the p-power map on coordinates in
      F_101[z]/(z^2 + 2). Pairs are drawn in F_101 × F_101. Permutations
      at points of F_{101^2} are not sampled and are not mixed into the
      generating set.
    panel_rule: >-
      Ordinary curves are the first four pairs (A, B) in lexicographic
      order with A from 1 to 100 and B from 1 to 100, skipping singular
      curves (4 A^3 + 27 B^2 ≡ 0 mod 101) and skipping trace-zero curves.
      Trace is minus the sum of Legendre symbols of f(x) for x = 0..100.
      Point count is 102 - trace. j ≡ 1728 * 4 A^3 * (4 A^3 + 27 B^2)^{-1}
      (mod 101). j ≡ 0 iff A = 0 and j ≡ 1728 (mod 101) iff B = 0, so this
      scan already excludes the artifact j-invariants. The six rows below
      were obtained by executing this rule in the design session. That
      count is a pin, not a monodromy run. The executor recomputes point
      counts and j and halts, as failed_infrastructure, if any pin disagrees.
    curves:
      - id: ordinary-1
        A: 1
        B: 1
        trace: -3
        point_count: 105
        j_mod_p: 34
        role: ordinary_panel
      - id: ordinary-2
        A: 1
        B: 2
        trace: 2
        point_count: 100
        j_mod_p: 4
        role: ordinary_panel
      - id: ordinary-3
        A: 1
        B: 3
        trace: 15
        point_count: 87
        j_mod_p: 93
        role: ordinary_panel
      - id: ordinary-4
        A: 1
        B: 4
        trace: 4
        point_count: 98
        j_mod_p: 14
        role: ordinary_panel
      - id: artifact-j0
        A: 0
        B: 1
        trace: 0
        point_count: 102
        j_mod_p: 0
        role: artifact_panel
        note: supersingular because 101 ≡ 2 (mod 3); excluded from the ordinary tally
      - id: artifact-j1728
        A: 1
        B: 0
        trace: 2
        point_count: 100
        j_mod_p: 11
        role: artifact_panel
        note: j ≡ 1728 (mod 101); ordinary with extra automorphisms; excluded from the ordinary tally
    rng_pin:
      implementation: CPython random.Random.randrange(101)
      version_that_produced_the_pin: 3.12.8
      specialization_seed: 20261005
      null_seed: 20261006
      specialization_first_eight_pairs:
        - [35, 69]
        - [37, 51]
        - [19, 12]
        - [70, 66]
        - [2, 11]
        - [14, 91]
        - [36, 68]
        - [36, 94]
      null_first_four_raw_draws:
        - [63, 10, 86, 36]
        - [36, 65, 25, 100]
        - [71, 29, 67, 80]
        - [67, 90, 69, 96]
      note: >-
        Each specialization draw is two calls of randrange(101), in the
        order (x1, x2). Each null draw is four calls, in the order
        (a, b, c, d) for X^4 + a X^3 + b X^2 + c X + d. The executor
        reproduces these tuples before any curve arithmetic. A mismatch
        halts the run as failed_infrastructure. Substituting a different
        generator is forbidden.

  controls:
    - id: character-product
      statement: >-
        On every good pair, let chi be the Legendre symbol on F_101. Let
        the two x-coordinates of Psi be split when both lie in F_101 and
        are distinct, inert when they do not both lie in F_101, and
        ramified when they coincide. The predicted type is split when
        chi(f(x1)) chi(f(x2)) = +1 and inert when the product is -1.
        Good pairs have both factors nonzero, so ramified is never the
        prediction. The identity disc = 16 f(x1) f(x2) is the source,
        read from KN-FIND-c41ea9. One disagreement on a good pair makes
        the panel inconclusive.
      pass_condition: zero disagreements on the scored good pairs of every pinned curve
      on_fail: >-
        The panel reading is inconclusive. There is no redraw. Do not
        repair the labelling inside the run.
    - id: null-quartic
      statement: >-
        Frobenius on the roots of random monic separable quartics over
        F_101, sample size 64, seed 20261006. Separable means gcd(f, f') = 1
        in F_101[X]. The draw is inconclusive if none of the 64 has cycle
        type 3+1.
      pass_condition: at least one element of cycle type 3+1
      on_fail: >-
        Redraw once, continuing the same null stream until 256 separable
        quartics, and rescore. A second miss stops the image reading for
        the whole panel as inconclusive. Do not redraw a second time.
    - id: artifact-panel
      statement: >-
        artifact-j0 and artifact-j1728 are run at the same sample size and
        written to their own rows. They are excluded from the ordinary
        tally and cannot by themselves establish an ordinary exceptional
        locus.
    - id: inertia-agreement
      statement: >-
        On ordinary-1, and on every ordinary curve whose Frobenius group
        is not order 4 of exponent 2, compute tame inertia along the first
        transverse lines in the frozen list and compare order and
        cycle-type inventory with the Frobenius subgroup on that same curve.
      pass_condition: same group order and the same number of elements of each cycle type
      on_fail: >-
        Withhold the group-order reading. Do not score the disagreement as
        a proper subgroup or as an escape. A partition-breaking permutation
        remains a non-block-system result even when this check fails.

  independent_variables:
    - curve identity inside the pinned panel (A, B)
    - good specialization (x1, x2) in F_101 × F_101
    - which reading of the generated group is scored (order 4, order dividing 2, escape, partition break)

  metrics:
    primary:
      - id: psi_group_order
        statement: >-
          Order of the subgroup of S_4 generated by the p-power Frobenius
          permutations of Psi on the good pairs of that curve.
    secondary:
      - id: exponent_divides_2
        statement: Whether every element of that subgroup has order dividing 2.
      - id: has_4_cycle
        statement: Whether the closure contains a 4-cycle.
      - id: preserves_partition
        statement: >-
          Whether every scored permutation sends inverse-pair blocks to
          blocks. The blocks are the two pairs of points with equal
          x-coordinate.
      - id: character_disagreements
        statement: Number of good pairs whose x-projection type disagrees with the Legendre product.
      - id: null_emitted_3_plus_1
        statement: Whether the null quartic sample emitted cycle type 3+1.
      - id: inertia_agrees
        statement: Whether the inertia subgroup matches the Frobenius subgroup in order and cycle-type inventory, on each curve where the check is required.

  heuristic_under_test: null
  heuristic_under_test_note: >-
    H1 and H2 in H-MONO-9ce194 are instrument gates inside this census.
    This contract is not a separate heuristic-validation experiment and
    not a concrete-cost table. The pre-registered prediction is the
    group-order split below.

  preregistered_prediction:
    quantity: >-
      The order of the group generated by p-power Frobenius on Psi, whether
      that group has exponent 2, and whether it preserves the inverse-pair
      partition.
    formula: >-
      The positive side is order exactly 4, every element of order dividing
      2, no 4-cycle, partition preserved, on all four ordinary curves. The
      group (Z/2)^2 has order 4 and exponent 2. Order dividing 2 is a
      proper subgroup. Order 8, a 4-cycle, or an element of order greater
      than 2 is an escape from the degree-at-most-4 closure. The source
      of the degree bound is the extension k(x1, x2, y1, y2), degree at
      most 4, as stated in IDEA-20261005-70b25b.
    source: >-
      IDEA-20261005-70b25b predictions and falsification_conditions, copied
      before any run of EXP-MONO-01e759. The character law is the identity
      disc_T S_3 = 16 f(x1) f(x2) in KN-FIND-c41ea9, read before any run.
      This design session did not adjust the split after seeing monodromy
      data, because it computed none.

  scale_relevance:
    tier: toy
    justification: >-
      The tested parameters are p = 101, m = 3, and four ordinary curves
      plus two artifact curves. A result at this prime is not a result at
      cryptographic size, at another prime, or at m >= 4. No extrapolation
      is authorized. Pairs are F_101-rational. That is not a sample of the
      geometric fundamental group beyond the inertia lines specified below.
    correspondence: >-
      Direct sampling of specializations on the pinned curves. No Deuring
      correspondence and no other sampling equivalence is used.

  tail_checks:
    - >-
      Character control: agreement on every good pair, not a tail rate.
      One mismatch withholds the reading. Under a uniform model on a group
      of order 4, each element has density 1/4, so the expected count at
      N = 64 is 16. The probability of missing one specific element is
      (3/4)^64, far below 1. N = 64 is the idea's frozen sample. It is not
      enlarged in this design.
    - >-
      Order-8 escape: under a uniform model on a group of order 8, each
      element has density 1/8 and the expected count at N = 64 is 8. Missing
      one class is possible. The inertia comparison withholds the order
      reading when the two subgroups disagree, so a short Frobenius sample
      is not scored as order 4 against a larger inertia group.
    - >-
      Null quartic: at least one cycle type 3+1 in 64 separable samples,
      or in the one redraw to 256. In S_4 the elements of cycle type 3+1
      number 8 out of 24. Missing that class is the sampler-failure tail.

  replication:
    seeds:
      - name: specialization_stream
        algorithm: CPython random.Random.randrange(101)
        seed: 20261005
        draws_per_sample: 2
      - name: null_quartic_stream
        algorithm: CPython random.Random.randrange(101)
        seed: 20261006
        draws_per_sample: 4
    independent_instances: 4
    independent_instances_note: >-
      The four ordinary curves are the independent instances of the image
      claim. The two artifact curves are controls.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 2
    maximum_memory_gb: 2
    maximum_runs: 2
    maximum_workers: 1
    budget_note: >-
      Time and CPU figures are advisory machine-protection watches
      (docs/research-budget-policy.md). They do not cap the frozen sample
      counts. maximum_runs is 2 so one infrastructure retry may take a new
      run id. The scientific sample size is 64 good specializations per
      curve. The null quartic has at most one redraw to 256. There is no
      redraw of the Psi sample. Expiry of the watch is failed_infrastructure,
      never a negative mathematical result.

  procedure:
    sampling: >-
      Seed random.Random(20261005) once. Curves are consumed in the order
      ordinary-1, ordinary-2, ordinary-3, ordinary-4, artifact-j0,
      artifact-j1728, without reseeding. For each curve, draw (x1, x2) by
      two randrange(101) calls. Keep the draw only when it is good, until
      64 good draws. Stop the curve as inconclusive if 10000 draws do not
      yield 64 good specializations. That cap is an instrument failure, not
      a small image.
    good_specialization: >-
      Drop the draw if x1 = x2 or if f(x1) = 0 or f(x2) = 0. Let y1 be the
      lexicographically smaller square root of f(x1) in F_101[z]/(z^2+2),
      and y2 the lexicographically smaller square root of f(x2), comparing
      coefficient tuples (a, b) of a + b z. Set P = (x1, y1) and
      Q = (x2, y2). Using the chord formulas, with
      lambda_plus = (y2 - y1) / (x2 - x1) and
      lambda_minus = (-y2 - y1) / (x2 - x1),
      set x(P+Q) = lambda_plus^2 - x1 - x2 and
      y(P+Q) = lambda_plus * (x1 - x(P+Q)) - y1, and the same with
      lambda_minus for P-Q. Psi is those two points and their inverses
      (x, y) maps to (x, -y). Drop the draw if any denominator vanishes,
      if any of the four sums is the point at infinity, or if the four
      points are not distinct. Dropped draws are counted and then
      discarded. They are not scored as permutations.
    labelling: >-
      Represent each field element by its coefficient tuple (a, b) in the
      basis (1, z). Order points by (x, y) lexicographically on those
      tuples. Labels are 0, 1, 2, 3 in that order. The Frobenius
      permutation sends label i to the label of the image of that point
      under a + b z maps to a - b z. If the image of a scored point is not
      one of the four points, the run is failed_infrastructure.
    partition_check: >-
      On each scored fibre the blocks are the two pairs of points with
      equal x-coordinate. A permutation preserves the partition when it
      sends each block to a block. This comparison does not use a labelling
      shared across fibres.
    group: >-
      Close the set of scored permutations under composition inside S_4.
      Record the order, whether every element has order dividing 2, the
      cycle-type inventory, and whether a 4-cycle occurs. S_4 has 24
      elements, so the closure is exhaustive.
    null_quartic: >-
      Seed a separate random.Random(20261006). Draw (a, b, c, d) by four
      randrange(101) calls. Keep f = X^4 + a X^3 + b X^2 + c X + d when
      gcd(f, f') = 1, until 64 separable quartics, or until 256 if the
      first 64 contained no cycle type 3+1. Label roots by the same
      sorting rule in the splitting field of f over F_101 and record the
      p-power Frobenius permutation. Exceeding 10000 draws is
      failed_infrastructure.
    inertia: >-
      Required on ordinary-1, and also on each ordinary curve whose
      primary group is not order 4 of exponent 2, before that curve may
      be scored as a proper subgroup or as an escape. Lines, tried in
      order: x2 = 1, 2, 3, 4, 5 with parameter t = x1, then x1 = 1, 2, 3,
      4, 5 with parameter t = x2. Encoding coefficient beta is the smallest
      integer in 1..20 such that the four values x(R) + beta y(R) are
      generically distinct. Let P(X) be the monic degree-4 polynomial over
      F_101(t) with those roots, cleared of denominators to a primitive
      polynomial in F_101[t][X]. Let Delta(t) be its discriminant. At each
      simple root r of Delta, if the ramification index is divisible by
      101, record the place as wild and do not use it as a generator.
      Otherwise the inertia generator is the permutation of the four
      points induced by u -> zeta u on a Puiseux parameter u^e = t - r.
      A simple root at which f(x1) f(x2) ≠ 0 is a branch off the
      discriminant divisor 16 f(x1) f(x2); include it as a generator and
      record it. Do not drop it. Generate the subgroup of those tame
      inertia elements. Compare its order and its cycle-type inventory
      with the Frobenius subgroup of the same curve. Literal equality of
      written permutations is not required: the Frobenius sample is
      labelled by sorting each fibre, and the inertia sample is labelled
      by continuation along the line. If no beta and no line produce a
      usable simple root, the order reading is withheld.
    mechanism_assignment:
      - id: row-full-degree-4
        observation: >-
          All four ordinary curves have Psi group order 4, every element
          of order dividing 2, no 4-cycle, the partition preserved, the
          character control clean, the null quartic emitting cycle type
          3+1, and inertia agreeing on ordinary-1.
        assigns_to: >-
          Full degree-4 image on this panel. Falsifies an exceptional
          ordinary curve inside the panel. Does not prove the image has
          order 4 for every ordinary j.
      - id: row-uniform-proper
        observation: >-
          All four ordinary curves have Psi group order dividing 2, the
          partition preserved, both controls passing, and inertia agreeing
          on ordinary-1 and on each of the four curves.
        assigns_to: >-
          Proper subgroup of the degree-4 group, uniformly on this panel.
          Falsifies the full degree-4 reading on this panel.
      - id: row-exceptional-mix
        observation: >-
          At least one ordinary curve has order 4 and exponent 2, and at
          least one has order dividing 2, both controls passing, and
          inertia agreeing on ordinary-1 and on every curve whose group
          is not order 4 of exponent 2.
        assigns_to: exceptional locus inside the panel
      - id: row-escape
        observation: >-
          At least one ordinary curve has order 8, or a 4-cycle, or an
          element of order greater than 2, both controls passing, and
          inertia agreeing on ordinary-1 and on each such curve.
        assigns_to: >-
          The image is not contained in a group of degree at most 4.
          This falsifies that containment on this panel.
      - id: row-partition-break
        observation: >-
          At least one scored Psi permutation, or one inertia permutation,
          does not preserve the inverse-pair partition.
        assigns_to: >-
          The inverse-pair partition is not a block system of this
          operation set. This assignment does not require the inertia
          agreement check.
      - id: row-not-a-2-group
        observation: >-
          The closure on an ordinary curve contains a 3-cycle or has
          order outside {1, 2, 4, 8}, with the character control clean.
        assigns_to: >-
          The image is not a 2-group. This falsifies both the biquadratic
          reading and the order-8 wreath reading on that curve.
      - id: row-inconclusive
        observation: >-
          The character control disagrees on any good pair, or the null
          quartic emits no cycle type 3+1 after the redraw to 256, or
          inertia disagrees, or the draw cap is hit, or the runtime watch
          expires, or a pin mismatches.
        assigns_to: >-
          Inconclusive. Not evidence for the degree-4 reading and not
          evidence for a proper subgroup or an escape.

  stopping_rules:
    - Stop when every pinned curve has its scored sample, both controls have their pass or fail bit, and every required inertia comparison is recorded.
    - Do not add a curve, a prime, a sample size above 64 for Psi, a second null redraw, or a sample over F_{101^2}.
    - The null redraw to 256 is mandatory if the first 64 separable quartics contain no cycle type 3+1, and forbidden if they already contain one.
    - Watch expiry, the 10000-draw cap, and a pin mismatch stop the run as failed_infrastructure.

  invalidation_rules:
    - A timeout, crash, memory abort, missing dependency, or pin mismatch is failed_infrastructure and is not evidence against the hypothesis.
    - Scoring a specialization with fewer than four distinct Psi points invalidates the run.
    - Mixing permutations from an extension-field sample into the F_101 generating set invalidates the run.
    - Using any curve other than the six pinned curves invalidates the run.
    - An order reading reported when inertia disagrees, or when a required inertia comparison is absent, is invalid.
    - Changing the pre-registered prediction after seeing permutations is forbidden. A correction is a new amendment record, and existing runs are not re-scored against it.

  success_criterion: >-
    The run is a success for the full degree-4 reading exactly when
    mechanism_assignment row-full-degree-4 holds: all four ordinary curves
    have Psi group order 4, exponent 2, no 4-cycle, partition preserved,
    character control clean, null quartic emitting cycle type 3+1, and
    inertia agreeing on ordinary-1. Any other completed assignment is not
    this success. The criterion fails when row-uniform-proper,
    row-exceptional-mix, row-escape, row-partition-break, or
    row-not-a-2-group holds.

  falsification_criterion: >-
    The full degree-4 reading on this panel is falsified when
    row-uniform-proper holds. Uniformity on the panel is falsified when
    row-exceptional-mix holds. Degree-at-most-4 containment is falsified
    when row-escape holds. The block-system reading is falsified when
    row-partition-break holds. The 2-group reading is falsified when
    row-not-a-2-group holds. row-inconclusive falsifies nothing.

  required_artifacts:
    - experiments/EXP-MONO-01e759/runs/RUN-*/manifest.yaml
    - experiments/EXP-MONO-01e759/runs/RUN-*/stdout.txt
    - experiments/EXP-MONO-01e759/runs/RUN-*/stderr.txt
    - experiments/EXP-MONO-01e759/runs/RUN-*/raw-result.json
    - experiments/EXP-MONO-01e759/runs/RUN-*/permutations.jsonl
    - experiments/EXP-MONO-01e759/runs/RUN-*/verdict.yaml
  artifact_contents:
    raw-result.json: >-
      Per curve: sample size used, draws consumed, draws dropped, group
      order, exponent_divides_2, cycle-type inventory, has_4_cycle,
      preserves_partition, character_disagreements, inertia order and
      cycle-type inventory when required, and whether any simple root of
      Delta lay off f(x1) f(x2) = 0. Plus the null quartic boolean, the
      redraw flag, and the rng and curve pin checks.
    verdict.yaml: >-
      Exactly one assignment row from mechanism_assignment, or
      failed_infrastructure with a reason. The verdict quotes the row id.
      It does not change hypothesis status.
    permutations.jsonl: >-
      One record per scored specialization: curve id, (x1, x2), the
      permutation in one-line notation, whether it preserves the
      partition, and the Legendre product.

  assigned_to: executor
  zero_runs_in_design: true
