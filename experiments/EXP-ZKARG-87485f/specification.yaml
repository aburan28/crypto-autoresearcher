experiment:
  id: EXP-ZKARG-87485f
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-500948; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-500948
  question_id: RQ-WFS-e776b6
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustively enumerate error vectors and challenges in a toy field to measure the attained
    soundness of powers-of-one-challenge batching against an independent-challenge comparator, as
    a function of the number of batched claims
  objective: 'The one uncertainty a run reduces: whether the soundness ceiling that batching accounting
    assigns to a single-challenge random linear combination is attained by an adversary in a concrete
    construction, and how far the two batching schemes actually separate at named parameters. Specifically
    (i) it enumerates every challenge in a toy field against a fully or structurally enumerated family
    of adversary error vectors and reports the attained maximum passing probability with its argmax,
    so the ceiling (v minus 1)/p is compared against a measured attainment rather than assumed tight;
    (ii) it computes the same attained quantity for an independent-challenge comparator whose definition
    is frozen before the run, and reports the ratio and bit difference as a function of v over the
    enumerable range; (iii) it runs the identical counting code against uniformly random error vectors
    so that the worst case is separated from the typical case, and against two degenerate controls
    at v equal to 1 and at zero error, so that any reported separation is attributable to batching
    structure rather than to the enumeration. The run performs no forgery search, weakens no transform,
    and touches no system outside the reference construction written for this contract.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for linear claims over F_p
      at the named primes and the named v range, under the frozen definition of the independent-challenge
      comparator and the named error-vector families, the attained maximum passing probabilities are
      the tabulated values and their ratio is the reported number, with the argmax error vectors exhibited.
      What does NOT follow: that powers-of-one-challenge batching is unsound or that any accounting
      in use is wrong, since a factor of order v is exactly what the standard bound allows; that the
      result transfers to nonlinear checks, to large fields, or to any protocol not written here;
      that any deployed, third-party or standardized system has any property; and no attack, break,
      speedup or security consequence of any kind.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes) Freeze the claim construction, the two primes, the v range,
      the error-vector families, the independent-challenge comparator definition, the multiplicity
      convention, and the null-arm sample size. STAGE 1 (cost: seconds) Implement F_p arithmetic and
      the batched evaluation; run the zero-error and v equal to 1 controls and abort on failure. STAGE
      2 (cost: minutes) Full enumeration at v equal to 2 and 3 over all nonzero error vectors, counting
      roots by direct evaluation over all z, recording maximum, argmax and histogram. STAGE 3 (cost:
      minutes) Structured enumeration over the fully split family at v equal to 4 through 8, clearly
      labelled as producing a lower bound on the attained maximum. STAGE 4 (cost: seconds) Compute
      the independent-challenge comparator''s attained value for the same claims at every v. STAGE
      5 (cost: minutes) Null arm: 100000 uniformly random nonzero error vectors through the identical
      counting code in the same invocation. STAGE 6 (cost: minutes) Cross-check every recorded root
      count by an independent factorisation routine. STAGE 7 (cost: as stages 2 to 6) Replay from
      the recorded seed and require identical histograms before writing the run record.'
    instrument: Python 3, no Sage. Prime-field arithmetic on Python integers in a self-contained module;
      root counting by direct evaluation over the whole field for the primary path and by an independently
      written polynomial-factorisation routine over F_p for the cross-check, sharing no code with
      the evaluator; random module with a declared seed for the null arm; numpy only for histogram
      assembly and reporting. The run is wrapped by harness/runner.py so that commit, environment,
      resources, seeds and the immutable run record are captured, and the argmax error vectors are
      emitted as certificate artifacts that the wrapper re-verifies by recomputing their root sets
      independently.
    parameters: 'Primes p in {251, 1021}. Number of batched claims v in {1, 2, 3} with full enumeration
      over all nonzero error vectors, giving 251 squared equal to 63001 vectors at v equal to 2 and
      about 1.58e7 at v equal to 3 for p equal to 251, and v in {4, 5, 6, 7, 8} over the structured
      fully split family capped at 200000 vectors per v. Challenge enumeration is complete: all p
      values of z for every vector. Null arm: 100000 uniformly random nonzero error vectors per (p,
      v). Multiplicity convention: distinct roots for probability, with-multiplicity counts recorded
      separately. Total field operations bounded by about 2 to the 33 at the largest cell, split across
      cells and capped by the stopping rule.'
  controls:
  - Null arm of uniformly random error vectors through the identical counting code in the same invocation.
  - Degenerate control at v equal to 1 where batching is vacuous and the passing probability must
    be exactly zero for a nonzero constant error.
  - Zero-error control where every e_i is zero and the check must pass for every z, giving probability
    exactly one.
  - Independent recomputation of root counts by polynomial factorisation over F_p compared against
    the direct evaluation count.
  - Two distinct primes so the reported ratio is not a coincidence of one modulus.
  - Seed replay of the null arm reproducing the histogram exactly.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): NULL OBJECT: random error vectors drawn uniformly from F_p to the v
    rather than adversary-chosen, pushed through the identical enumeration of z and the identical
    counting code in the same invocation. The null reports the TYPICAL passing probability, which
    for a uniformly random nonzero e is the expected root density, close to 1/p by the standard fact
    that a random polynomial has about one root on average. For the signal arm to mean anything the
    null must come out near 1/p and clearly below the adversary-optimal value; if the two agree, the
    enumeration is not finding adversary structure and the reported maximum is an artifact of the
    family being enumerated. A second null uses v equal to 1, where batching is vacuous and both schemes
    must return exactly 1/p times the number of roots, that is, exactly zero for a nonzero constant
    error.'
  independent_variables:
  - number of batched claims v
  - field size p
  - batching scheme (single challenge with powers versus independent challenges)
  - error-vector family (full enumeration versus structured versus random null)
  metrics:
    primary:
    - attained maximum batched passing probability per (p, v)
    - attained maximum independent-challenge passing probability per (p, v)
    - ratio and bit difference between schemes
    - argmax error vector and its distinct root set
    - null-arm maximum and mean passing probability
    secondary:
    - histogram of distinct root counts over the enumerated family
    - root counts with multiplicity
    - number of error vectors enumerated per cell
    - wall time and peak memory per cell
    - factorisation cross-check disagreement count, required to be zero
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The attained maximum passing probability of the batched check over the enumerated error
      family at each (p, v), and its ratio to the attained maximum of the independent-challenge comparator
      at the same (p, v).
    formula: 'Pre-registered law: the batched attained maximum equals (v minus 1)/p exactly, whenever
      the error family contains a vector whose associated degree-(v minus 1) polynomial splits completely
      with distinct roots in F_p, and is strictly smaller otherwise. The independent-challenge comparator''s
      attained maximum is pre-registered as 1/p under the frozen definition in which each claim is
      checked against its own uniform challenge and the adversary must survive all v. The pre-registered
      ratio is therefore exactly v minus 1, and any measured deviation from that integer is the reportable
      result.'
    source: Pre-registered in the parent proposal IDEA-20260816-500948 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at p equal to 251 and 1021 with v up to 8, chosen because full enumeration
      over challenges is complete at those sizes and full enumeration over error vectors is complete
      for v up to 3. Transfer assumption, stated rather than assumed: extending the measured ratio
      to cryptographic-size fields presumes that attainment of the root-count ceiling is a property
      of the algebra and not of the small modulus, which this run checks at only two primes and only
      up to v equal to 8. No cryptographic-scale conclusion is drawn and the structured-family cells
      are reported as lower bounds throughout.'
    correspondence: null
  tail_checks:
  - Report the single error vector with the largest distinct root count and confirm it does not exceed
    v minus 1.
  - Inspect the upper tail of the null-arm histogram and confirm no random vector reaches the adversary-optimal
    value, which would indicate the family is not adversarially special.
  - Check the v equal to 8 structured cell separately, since it is the one furthest from full enumeration
    and most likely to understate attainment.
  - Report the smallest nonzero attained probability across cells to confirm no cell collapsed to
    zero through an implementation error.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt if any enumerated vector reports more than v minus 1 distinct roots or if either degenerate
    control fails.
  - Cap full enumeration at 2 to the 25 error vectors per cell; larger cells fall back to the structured
    family and are labelled as lower bounds.
  - Cap total wall time at four hours; truncation reduces the v range and is recorded as a budget
    outcome, never as evidence about soundness.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run succeeds if both degenerate controls pass, the factorisation cross-check
    reports zero disagreements, and attained maxima with argmax vectors, the comparator values, their
    ratio, and the null-arm distribution are reported for every (p, v) cell attempted, whether or
    not the ratio equals the pre-registered v minus 1.
  falsification_criterion:
  - Any vector reports more than v minus 1 distinct roots.
  - Zero-error or v equal to 1 control fails.
  - The null arm attains the same maximum as the adversary-optimal arm, showing no adversarial structure
    was found.
  - The attained batched maximum is strictly below (v minus 1)/p at every v, falsifying attainability
    in this construction and closing the record with that obstruction named.
  - Factorisation cross-check disagrees with direct evaluation on any vector.
  - The measured ratio is non-monotone in v, indicating the comparator definition is inconsistent
    across cells.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-500948
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The claim construction that determines which error vectors an adversary can actually realise is
    not fixed by this proposal and must be specified by the Coordinator; without it the enumeration
    ranges over all vectors and the attainment result is about algebra rather than about a protocol.
  - The independent-challenge comparator has at least two natural definitions, per-claim checking
    and a single random linear combination with independent coefficients; the Coordinator must freeze
    one, since the pre-registered ratio depends on the choice.
  - Whether the structured fully split family at v equal to 4 and above is the right restriction,
    or whether a random-sample-plus-bound treatment would be more honest.
  - The multiplicity convention needs a ruling so that the histogram and the probability are not reported
    under different conventions.
