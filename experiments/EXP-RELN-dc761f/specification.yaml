# EXP-RELN-dc761f -- successor of EXP-RELN-c5a377 v4 (DEC-20261001-7fa9f9 NA-1/NA-2;
# DEC-20261001-f5e83a R-1). Designed by TASK-20261001-5a45b1. SELF-CONTAINED:
# this file alone defines the protocol. No rule is adopted by reference to
# any implementation report, amendment or earlier specification; where a v4
# rule is kept, its full text is restated here.
experiment:
  id: EXP-RELN-dc761f
  hypothesis_id: H-RELN-940f14
  parent_hypothesis_id: H-RELN-4d092c
  predecessor_experiment_id: EXP-RELN-c5a377
  source_idea_ids: [IDEA-20260909-860d1e]
  question_id: RQ-RELN-001
  goal_id: GOAL-RELN-001
  batch_id: BATCH-9fba5a
  designed_by_task: TASK-20261001-5a45b1
  version: 1
  title: >-
    Short-cycle enrichment of the honest 2-LP summation multigraph against
    the degree-preserving rewire null, across a percolation-window budget sweep
  status: review_required
  assigned_to: executor
  approved_by: null
  approval_decision: null
  approval_basis: >-
    Pending. When the protocol is complete and the impediments below are
    cleared, a separate committed Coordinator decision may approve it under
    the standing user authorization of 2026-09-06 (AGENTS.md).
  recorded_at: '2026-10-01'
  experiment_class: measurement
  scale_label: toy

  objective: >-
    Decide, at toy scale and for the v4 generator, whether the honest
    two-large-prime summation multigraph has more short cycles (lengths 3 and
    4) than degree-preserving configuration-model rewires of itself, using a
    statistic that (|E|, |V|, number of components) does not determine, at
    budgets spanning the percolation window.

  why_successor: >-
    RUN-RELN-a695fe (EXP-RELN-c5a377 v4) was valid but its verdict was
    protocol-forced (EV-RELN-3c9a24): cycle rank = |E| - |V| + c is fixed by
    the edge count once the budget is set, A1 sat below the percolation
    threshold, and the certified-subcritical branch was unreachable at 16
    bits. This contract keeps the v4 generator, B and B2; replaces the
    statistic, the budgets and the certificate domain; fixes L; and inlines
    every open-question ruling (DEC-20261001-7fa9f9 NA-1, NA-2).

  execution_admission:
    currently_admitted: false
    requirements:
      - Impediment IMP-1 cleared (28-bit fixtures derived by rule F-2, budgets by P-5, both in a committed fixture receipt independently re-derived).
      - Separate committed Coordinator approval decision naming this file's sha256.
      - Verified snapshot archive of this contract and of the implementation (every implementation file hash) before any protocol-labelled draw.
      - Fresh executor claim via tools/goal_lanes.py.
      - Machine-protection precondition M-1 at launch.

  precedence: >-
    This specification is the whole protocol (version 1). Any later change is
    an additive protocol_amendment. EXP-RELN-c5a377 and its amendments stay
    frozen and are not modified or relied on.

  # ------------------------------------------------------------------ inputs
  inputs:
    fixtures:
      F-1:
        description: >-
          The nine EXP-RELN-c5a377 fixtures, restated verbatim from
          experiments/EXP-SDEG-85eefd/amendments/ic_leads_fixtures_v2.json
          (sha256 543f49ca5304f4e61085305ca2ea01ccc0085298db26368d7362f96b1b6a5a45),
          key "EXP-RELN-c5a377". Every curve is y^2 = x^3 + a x + b over F_p,
          of prime order N (cofactor 1); q := N. G is the listed generator.
        list:
          - {id: b16-s11, bits: 16, seed: 11, p: 62417, a: 31838, b: 5672, N: 61979, G: [0, 27690]}
          - {id: b16-s12, bits: 16, seed: 12, p: 49391, a: 17959, b: 16189, N: 49367, G: [6, 24294]}
          - {id: b16-s13, bits: 16, seed: 13, p: 39607, a: 28493, b: 1765, N: 39581, G: [0, 15550]}
          - {id: b20-s11, bits: 20, seed: 11, p: 855727, a: 220250, b: 149669, N: 856153, G: [3, 354997]}
          - {id: b20-s12, bits: 20, seed: 12, p: 855641, a: 287740, b: 209027, N: 854363, G: [0, 248685]}
          - {id: b20-s13, bits: 20, seed: 13, p: 911707, a: 786752, b: 903968, N: 911033, G: [2, 189920]}
          - {id: b24-s11, bits: 24, seed: 11, p: 9769087, a: 1694034, b: 548449, N: 9773123, G: [0, 3916788]}
          - {id: b24-s12, bits: 24, seed: 12, p: 15738469, a: 11997084, b: 5182456, N: 15735007, G: [4, 7793897]}
          - {id: b24-s13, bits: 24, seed: 13, p: 10589077, a: 4368383, b: 1627642, N: 10593239, G: [1, 4615285]}
      F-2:
        description: >-
          Three 28-bit fixtures, seeds 11, 12, 13, derived deterministically
          (sage or PARI point counting) as follows. For c = 0, 1, 2, ...:
          x := int.from_bytes(SHA256(UTF-8 "EXP-RELN-dc761f/v1|curve|28|<seed>|<c>"), "big");
          p := next_prime(2^27 + (x mod 2^27)); skip c unless p has exactly 28
          bits; a := (x >> 64) mod p; b := (x >> 128) mod p. Admit the first c
          with a != 0, b != 0 (mod p), 4a^3 + 27b^2 != 0 (mod p), N = #E(F_p)
          prime, N != p, N != p + 1, and p^k != 1 (mod N) for k = 1..20.
          G := (x0, min(y, p - y)) for the least x0 >= 0 with x0^3 + a x0 + b a
          square mod p. Record (counter c, p, a, b, N, G).
        status: not_derived
        impediment: IMP-1
        why_28_bits: >-
          Certified-subcritical (rule C-SUB) needs |V| > 40 to be possible
          (any edge gives giant fraction >= 2/|V|). That holds at 20 and 24
          bits, but on the design surrogate a genuinely subcritical graph at
          kappa = 1/4 is certified only 0% (20-bit), 5% (24-bit) and about 38-41%
          (28-bit) of the time, so 28 bits is the smallest size where the
          certificate is usefully reachable.
    seed_namespace: EXP-RELN-dc761f/v1
    seed_namespace_note: >-
      A fresh namespace, not v4's "EXP-RELN-c5a377/v2": the v4 attempt stream
      has already been analysed (RUN-RELN-a695fe), so reusing it would make
      the first A1/A2 attempts of every fixture non-blind. The generator rule
      is unchanged; only its labels differ.

  # ------------------------------------------------------------------ parameters
  parameters:
    P-1: 'B := ceil(p^{1/5}) and B2 := ceil(p^{2/5}), computed exactly as the least integer B with B^5 >= p and the least B2 with B2^5 >= p^2.'
    P-2: 'x-coordinates are least non-negative residues in [0, p); x = 0 is allowed.'
    P-3: >-
      Scan set S: every affine point (x, y) with x < B2, both signs (a point
      with y = 0 appears once), sorted ascending by (x, y) as integer pairs.
      Factor-base classes: liftable x with x < B; L_fb := their number
      (recorded, never used as a logarithm base). Large-prime classes:
      liftable x with B <= x < B2; n_lp := their number.
    P-4: >-
      L := ceil(q^{1/5}) (exact integer root as in P-1, q = N). This is the
      ONLY L used by any logarithmic normalisation in this experiment
      (delta_short, rule S-6, and the v4-continuity reading S-7). It equals B
      on every F-1 fixture. Chosen over v4's count L_fb (2..14) because it is
      smooth in q, matches the parent hypothesis's L = q^{1/5}, and avoids the
      L_fb = 2 instability of b16-s12 (RD-20261001-4aefce U-9).
    P-5:
      rule: >-
        Exact edge yield and budgets, computed before any labelled draw and
        label-free. For every group element R != O, its kept decomposition is
        the first in scan order (rule G-4): enumerate i = 0..|S|-1 and k = i..|S|-1,
        R = S[i] + S[k]; the first (i, k) reaching R assigns its class (full,
        lp1, lp2 by the number of x-coordinates >= B). n_edge := number of R
        of class lp1 or lp2; y_edge := n_edge / q. For kappa in
        {1/4, 1/2, 1, 2}: A_kappa := ceil(kappa (n_lp + 1) q / n_edge) in
        exact rational arithmetic. Expected LP edges at A_kappa are kappa
        (n_lp + 1) (mean degree 2 kappa over the vertex universe; the
        configuration-model giant threshold is near kappa = 1/2).
      frozen_values_F1:
        source: coordination/goals/GOAL-RELN-001/batches/BATCH-9fba5a/tasks/TASK-20261001-5a45b1/exact_yield_budgets_out.json (non-protocol, label-free)
        columns: [B, B2, L, L_fb, n_lp, scan_size, R_full, R_lp1, R_lp2, A_1/4, A_1/2, A_1, A_2]
        b16-s11: [10, 83, 10, 6, 38, 88, 72, 904, 2750, 166, 331, 662, 1324]
        b16-s12: [9, 76, 9, 2, 33, 70, 8, 264, 2106, 178, 355, 709, 1417]
        b16-s13: [9, 70, 9, 6, 29, 70, 72, 694, 1618, 129, 257, 514, 1028]
        b20-s11: [16, 237, 16, 6, 103, 218, 72, 2464, 20860, 955, 1909, 3818, 7636]
        b20-s12: [16, 237, 16, 7, 106, 226, 98, 2964, 22148, 911, 1821, 3641, 7281]
        b20-s13: [16, 243, 16, 10, 115, 250, 200, 4580, 26008, 864, 1728, 3455, 6910]
        b24-s11: [26, 626, 26, 14, 320, 668, 392, 17904, 202432, 3560, 7120, 14239, 28477]
        b24-s12: [28, 757, 28, 12, 348, 720, 288, 16684, 240076, 5347, 10694, 21388, 42776]
        b24-s13: [26, 646, 26, 10, 337, 694, 200, 13472, 224422, 3763, 7526, 15051, 30102]
      frozen_values_F2: impediment IMP-1 (computed by the same rule once F-2 is derived)
      check: The executor recomputes every value above and refuses to start on any mismatch.
      cross_check_against_v4: >-
        The exact yields agree with RUN-RELN-a695fe's realised yields
        (b24-s11: 0.02255 exact, 352/15633 = 0.02252 observed; b16-s11:
        0.0590 exact, 47/751 = 0.0626 observed).
    P-6: 'Budgets are nested prefixes: the kappa cell uses attempts j = 0 .. A_kappa - 1 of one stream per fixture.'

  # ------------------------------------------------------------------ seed labels
  seed_rules:
    H: 'H(s) := int.from_bytes(SHA256(UTF-8 bytes of s), "big"), a 256-bit integer.'
    uniform: >-
      uniform(label, n) for n >= 1: limit := floor(2^256 / n) * n; v := H(label);
      r := 0; while v >= limit: r := r + 1; v := H(label + "|rej" + str(r));
      return v mod n. (Range [0, n).)
    draws: >-
      A draw sequence with prefix P yields uniform(P + "|" + str(t), n_t) for
      t = 0, 1, 2, ... (t increments once per draw, whatever n_t is).
    shuffle: >-
      Fisher-Yates with a draw sequence: for i = len - 1 down to 1:
      j := next draw with n = i + 1; swap positions i and j.
    integers_as_strings: decimal, no padding, no sign for non-negative values. kappa labels are the strings k1/4, k1/2, k1, k2.
    labels:
      L-1 target: '"EXP-RELN-dc761f/v1|target|<bits>|<seed>"; k := uniform(label, q); Q := k G. k = 0 is allowed (Q = O; recorded; attempts remain defined).'
      L-2 attempt: '"EXP-RELN-dc761f/v1|attempt|<bits>|<seed>|<j>", j = 0, 1, 2, ...; a_j := uniform(label + "|a", q); b_j := uniform(label + "|b", q).'
      L-3 rewire: 'draw prefix "EXP-RELN-dc761f/v1|rewire|<i>|<bits>|<seed>|<kappa>", replicate i = 0..998.'
      L-4 er: 'draw prefix "EXP-RELN-dc761f/v1|er|<i>|<bits>|<seed>|<kappa>", replicate i = 0..198.'
      L-5 pseudo: 'draw prefix "EXP-RELN-dc761f/v1|pseudo|<i>|<bits>|<seed>|<kappa>", pseudo-treatment i = 0..99.'
      L-6 planted: 'draw prefix "EXP-RELN-dc761f/v1|planted|<bits>|<seed>|<kappa>".'
      L-7 forest_null: 'draw prefix "EXP-RELN-dc761f/v1|forestnull|<i>|<bits>|<seed>|<kappa>", i = 0..998.'
      L-8 audit: 'attempt j is replayed iff H("EXP-RELN-dc761f/v1|audit|<bits>|<seed>|<j>") mod 10 == 0.'
      L-9 smoke: 'smoke runs replace the namespace by "smoke|EXP-RELN-dc761f/v1" in every label.'

  # ------------------------------------------------------------------ generator
  generator_rules:
    G-1: 'Attempt j: R_j := a_j G + b_j Q (affine short-Weierstrass arithmetic over F_p).'
    G-2: 'If R_j = O: outcome R_is_O; no scan; failed attempt.'
    G-3: >-
      Otherwise scan P1 over S in order and compute T := R_j - P1 for every
      P1 (full scan always; every point operation charged). T = O sets a
      single-point flag. T != O with x(T) < B2 (so T is in S) is a
      decomposition {P1, T}; unordered duplicates are counted once.
    G-4: >-
      The kept relation is the FIRST decomposition found in scan order (the
      least scan index P1 for which T is in S). Further decompositions are
      counted as extra_decompositions only. A decomposition takes precedence
      over a single-point flag. R_j = 2 P1 (T = P1) is a decomposition.
    G-5: >-
      Class of the kept relation by the number of its two x-coordinates that
      are >= B: 0 -> full, 1 -> lp1, 2 -> lp2. Attempts without a
      decomposition are single_point_fb / single_point_lp (if flagged, by
      x(R_j) < B or not) or miss; all are failed attempts.
    G-6: 'Certificate: every kept relation stores (j, a_j, b_j, P1, T); a verifier recomputes a_j G + b_j Q = P1 + T.'
    G-7: >-
      LP multigraph for a budget: vertex 0 is the root, always present (even
      with no lp1 edge); vertices 1.. are the LP x-classes incident to at
      least one LP edge of that budget, in increasing x. Each lp2 relation
      adds one edge between its two LP classes (a self-loop when the
      x-classes coincide); each lp1 relation adds one edge between its LP
      class and the root; full relations add no edge (counted separately).
      Multigraph: one edge per relation, parallel edges and loops kept, edges
      listed in attempt order.
    G-8: 'Charging (reported, never compared with any baseline): group operations of setup and attempts, scalar multiplication by double-and-add with its operation count recorded; instance construction Q = k G uncharged.'

  # ------------------------------------------------------------------ statistics
  statistic_rules:
    S-1:
      name: C34 (primary)
      definition: >-
        C3 + C4, where Ck (k = 3, 4) is the number of distinct edge sets of the
        multigraph forming a cycle through exactly k distinct vertices. Equivalently,
        with W the symmetric multiplicity matrix with zero diagonal (loops
        dropped), C3 = tr(W^3) / 6 and
        C4 = (tr(W^4) - 2 sum_i s_i^2 + sum_{i,j} W_ij^4) / 8, s_i = sum_j W_ij^2.
      identity_check: >-
        For every treatment graph, C3 and C4 by the trace formulas equal a
        direct enumeration (triples and quadruples of distinct vertices with
        products of multiplicities). Mismatch is a procedure defect.
      why: >-
        Not a function of (|E|, |V|, c): two graphs with equal edge, vertex
        and component counts can have any short-cycle count. Expected values
        under the configuration model are O(1) per cell and of order 10-50 at
        kappa = 2, so the pooled sum over cells is testable.
    S-2:
      name: secondary counts
      definition: >-
        C1 = number of loops; C2 = sum over unordered vertex pairs of
        C(multiplicity, 2); C3 and C4 separately. Structural note: a root loop
        is impossible in the treatment (it would be a full relation) and is
        excluded from the null by N-1; C1 and C2 are reported but never used
        in a verdict.
    S-3:
      name: M4 (secondary, minimum cycle basis)
      definition: >-
        Number of cycles of length <= 4 in a minimum (unit-weight) cycle basis
        of the multigraph, computed as the GF(2) rank of the set of all cycles
        of length <= 4 (loops, digons, triangles, 4-cycles, each as an edge
        set). By the matroid greedy property every minimum cycle basis
        contains exactly this many cycles of length <= 4, so the value does not
        depend on tie-breaking. Also M3 (length <= 3). The full Horton
        minimum-cycle-basis length histogram is reported for treatment graphs
        whose Horton candidate count is <= 300000; otherwise recorded as
        skipped_memory_protection.
    S-4:
      name: cycle structure descriptors (secondary)
      definition: >-
        |V|, |E|, components c, cycle_rank = |E| - |V| + c and its GF(2)
        incidence-nullity cross-check, components_with_cycle (components
        whose edge count >= vertex count, loops included), giant fraction =
        largest component's vertex count / |V| (root included), root degree,
        realised edges / (n_lp + 1).
    S-5:
      name: pooled primary test
      definition: >-
        Primary cells P := every fixture x kappa in {1, 2} (24 cells with F-2,
        18 without). T_obs := sum over P of C34(treatment). For replicate
        i = 0..998: T_null(i) := sum over P of C34(rewire i of that cell).
        p_up := (1 + #{i : T_null(i) >= T_obs}) / 1000;
        p_lo := (1 + #{i : T_null(i) <= T_obs}) / 1000;
        mu_T, sigma_T := mean and sample standard deviation (ddof 1) of T_null;
        r := T_obs / mu_T; r_up := (T_obs + 1.6448536 sigma_T) / mu_T;
        r_lo := (T_obs - 1.6448536 sigma_T) / mu_T.
    S-6:
      name: delta_short (secondary, parent-gate reading)
      definition: >-
        Per cell: delta_c := ln((C34_obs + 1) / (mean C34_rewire + 1)) / ln L,
        L = ceil(q^{1/5}) (P-4). Per bit size and kappa in {1, 2}: the mean of
        delta_c over the size's fixtures. The parent gate is delta > 1/4,
        that is a short-cycle ratio of L^{1/4} (1.73 at L = 9, 2.26 at
        L = 26). Reported only; never used by the verdict.
    S-7:
      name: v4-continuity reading (secondary)
      definition: >-
        At kappa = 2, per fixture: log_L(cycle_rank_obs / mean cycle_rank_rewire)
        with L = ceil(q^{1/5}); mean and t-interval over fixtures. Re-measures
        the EV-RELN-3c9a24 obstruction quantity on fresh draws.
    S-8:
      name: per-kappa and per-size readings (secondary)
      definition: The S-5 computation restricted to each kappa (all four) and to each bit size, reported with r, p_up, p_lo; never used by the verdict.
    S-9:
      name: trend (secondary)
      definition: OLS slope of per-fixture ln((C34_obs + 1) / (mean C34_rewire + 1)) at kappa = 2 against bits, with its two-sided 95% t-interval.

  # ------------------------------------------------------------------ nulls and controls
  null_rules:
    N-1:
      name: configuration-model rewire conditioned on no root-root edge (the null)
      definition: >-
        Stub list of the treatment multigraph: for each edge (u, v) in
        attempt order append u then v (a loop contributes two stubs at its
        vertex). For try r = 0, 1, 2, ...: copy the stub list in that original
        order, shuffle it with the draw sequence whose prefix is the L-3
        prefix + "|try" + str(r) (rule shuffle), and pair consecutive stubs
        (positions 2t, 2t + 1) into edges; accept the first try whose pairing
        has no edge with both ends at the root (vertex 0). LP loops and
        parallel edges are kept. Degrees, |V| and |E| are preserved exactly.
        A root-loop-free pairing always exists because every root edge of the
        treatment is an lp1 edge, so root degree <= |E| = half the stubs. At
        most 100000 tries per replicate (the design surrogate needed mean 2.5,
        99th percentile 17, maximum 3528); exhausting them is a procedure
        defect. The number of tries is recorded per replicate. 999 replicates per cell, all four
        kappa. Replicate index i aligns across cells for S-5.
      why_conditioned: >-
        A root self-loop would be a full relation, so the treatment never has
        one, while the unconditioned configuration model does, which removes
        hub edges and undercounts triangles through the root. On the design
        surrogate (independent uniform edges, the no-enrichment model) the
        unconditioned null read 9% low (pooled ratio median 1.087, p_up < 0.01
        in 13% of 100 synthetic experiments). For independent uniform edges,
        the conditioned configuration model has exactly the surrogate's law
        given the degree sequence: both weight a multigraph by
        1 / (prod multiplicity! x 2^{LP loops}) on root-loop-free graphs.
    N-2:
      name: Erdos-Renyi reference (report only)
      definition: >-
        Simple G(|V|, m_s) with m_s := number of distinct non-loop vertex
        pairs of the treatment (so it is always feasible): draw two uniform
        vertices from the L-4 sequence, reject u = v or an already chosen
        pair, until m_s pairs. 199 replicates per cell. EVERY replicate is
        kept, including those with zero cycles or zero C34; no replicate is
        dropped from any mean. Not degree-preserving and disclosed as biased
        (it has isolated vertices the treatment cannot have; RT-20261001-ece593
        O-4); never used by the verdict.
  controls:
    - id: K-POS
      kind: known_positive
      design: >-
        Degree-preserving planted enrichment of every primary cell. Starting
        from the treatment edge list (current list order), repeat proposals
        with the L-6 draw sequence: draw edge index i (n = |E|) and an
        orientation bit o (n = 2); skip if e_i is a loop; with e_i = (u, v),
        set (a, b) := (u, v) if o = 0 else (v, u). List, in edge-index order,
        the non-loop edges k != i incident to b whose other end c is not a or
        b; skip if empty; draw j from that list (n = its length). List the
        edges k not in {i, j} incident to a (in index order) and draw ka; list
        those incident to c and draw kc; skip if either list is empty or
        ka = kc. With x the end of e_ka other than a (x = a for a loop) and y
        the end of e_kc other than c, replace e_ka by (a, c) and e_kc by
        (x, y). Accept iff C34 strictly increases (otherwise restore). Stop
        when C34 >= ceil(1.5 mu_c) (mu_c the cell's mean rewire C34) or after
        20000 proposals; a cell short of target is recorded. Degrees are
        preserved, so the cell's rewire null is unchanged. The pooled S-5
        test on the planted cells must return ENRICHED.
      design_note: >-
        An earlier proposal rule (two uniform edges that happen to share a
        vertex, 4000 proposals) rarely found a path in 28-bit-sized graphs and
        left the planted pooled ratio under 1.25 in 14 of 46 synthetic
        experiments; the vertex-anchored rule above reached target in every
        cell (design_report.yaml).
      failure_meaning: Procedure defect (the pipeline cannot see the effect the design check detected in 100/100 synthetic experiments at 1.25x and 1.5x); run invalid.
    - id: K-FALSE-1
      kind: known_false (forest)
      design: >-
        Spanning forest of every primary cell         (Kruskal in attempt order: keep
        an edge iff it joins two components). C34 = 0. Tested by S-5 against
        999 N-1 rewires of the forest's own stub list (L-7 prefixes, with the
        N-1 "|try<r>" rejection).
        Must not return ENRICHED.
      failure_meaning: Procedure defect.
    - id: K-FALSE-2
      kind: known_false (degree-matched random)
      design: >-
        100 pooled pseudo-treatments: in pseudo-treatment i every primary cell
        is replaced by an independent N-1 rewire of its treatment (L-5
        prefixes, with the N-1 "|try<r>" rejection), and S-5 is applied
        against the same 999 rewires. The
        number returning ENRICHED must be <= 4 of 100 (nominal 1%; P(X >= 5)
        = 0.003 under Binomial(100, 0.01)).
      failure_meaning: Procedure defect (null miscalibrated).
    - id: K-ID
      kind: identity checks
      design: >-
        cycle_rank equals GF(2) incidence nullity; C34 trace formula equals
        direct enumeration (S-1); every rewire preserves the degree sequence;
        the M4 rank never exceeds cycle_rank.
      failure_meaning: Procedure defect.
    - id: K-AUD
      kind: accounting_audit
      design: >-
        Every kept relation's certificate is verified (G-6). An independent
        checker replays the attempts selected by L-8 and must reproduce
        their outcome, relation, decomposition count and charged operations.
      failure_meaning: Procedure defect.
    - id: K-BASE
      kind: baseline
      design: >-
        Not applicable: this experiment makes no cost comparison and no rho or
        BSGS baseline is run. Any later cost statement needs its own contract.

  # ------------------------------------------------------------------ verdict
  verdict_rules:
    validity_gate: K-POS, K-FALSE-1, K-FALSE-2, K-ID and K-AUD all pass, and every fixture x kappa cell completed. Otherwise the run is invalid (procedure defect) or failed_infrastructure, and no verdict is reported.
    ENRICHED: 'p_up < 0.01 and r >= 1.25.'
    NULL_MATCHED: 'p_up >= 0.05 and r_up < 1.25.'
    DEPLETED: 'p_lo < 0.01 (reported alongside NULL_MATCHED when both hold).'
    INCONCLUSIVE: 'Any other outcome, or mu_T = 0.'
    certified_subcritical (C-SUB, report only): >-
      Per fixture x kappa cell with |V| > 40 (vertex set G-7): certified iff
      giant fraction < 0.05 and cycle_rank <= 2 x components_with_cycle.
      Cells with |V| <= 40 are labelled ineligible (all 16-bit cells: n_lp + 1
      <= 39). Reachability on the design surrogate at kappa = 1/4: 0% at 20
      bits, 5% at 24 bits, about 38-41% at 28 bits; 0% at kappa >= 1/2 at every
      size. Neither branch of the primary verdict uses it.
    parent_gate_reading: 'delta_short (S-6) per bit size; reported, never promoted to a verdict.'

  success_criterion: >-
    A valid run (validity gate passed) that returns ENRICHED, NULL_MATCHED or
    DEPLETED under the pooled S-5 test. Either direction is a reportable
    toy-tier result; only ENRICHED supports H-RELN-940f14.
  falsification_criterion: >-
    NULL_MATCHED (p_up >= 0.05 and r_up < 1.25) or DEPLETED (p_lo < 0.01) on a
    valid run falsifies H-RELN-940f14's enrichment claim on the tested scope.
  preregistered_prediction:
    quantity: pooled short-cycle ratio r (S-5)
    formula: r in [0.8, 1.25] and verdict NULL_MATCHED (configuration-model behaviour, HEUR-RELN-940f14-1)
    source: H-RELN-940f14 coordinator_prior; random model of HEUR-RELN-940f14-1
  heuristic_under_test: HEUR-RELN-940f14-1
  heuristic_validation_also: HEUR-RELN-940f14-2 (giant fraction at kappa = 1/4 and 1; report only)

  independent_variables:
    - {name: fixture, values: [b16-s11, b16-s12, b16-s13, b20-s11, b20-s12, b20-s13, b24-s11, b24-s12, b24-s13, b28-s11, b28-s12, b28-s13]}
    - {name: kappa, values: ['1/4', '1/2', '1', '2']}
  metrics:
    primary:
      - pooled C34 ratio r, p_up, p_lo, r_up, r_lo and the verdict (S-5)
    secondary:
      - per-cell C1, C2, C3, C4, M3, M4 and their rewire means and empirical upper-tail p-values
      - per-kappa and per-size pooled readings (S-8)
      - delta_short per size (S-6) and v4-continuity reading (S-7)
      - Horton length histogram where computed (S-3)
      - '|V|, |E|, components, cycle_rank, components_with_cycle, giant fraction, root degree (S-4)'
      - ER reference means including zero replicates (N-2)
      - C-SUB label per eligible cell
      - outcome counts, extra_decompositions, realised edges against kappa (n_lp + 1)
      - charged group operations / sqrt(q) (descriptive only)
      - peak_rss_bytes, wall seconds per cell
  scale_relevance:
    tier: toy
    justification: >-
      q < 2^28. Short-cycle counts in configuration-model-like graphs are O(1)
      per cell regardless of n, so larger q adds little power; the 28-bit
      size is for the C-SUB certificate's reachability. No transfer to
      cryptographic size is claimed.
    correspondence: null
  tail_checks:
    - Report the largest per-cell C34 excess (obs - mean) / sd over cells and its expected maximum over the cell count under normality.
    - Report cells with mean rewire C34 < 1 separately (low-information cells).
    - Do not tune thresholds after seeing treatment outcomes.
  replication:
    seeds: [11, 12, 13]
    independent_instances: 3
    note: Three fixtures per bit size; the pooled test treats fixtures x kappa as cells.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    wall_clock_estimate_note: >-
      Advisory estimate about 60-75 minutes for the whole run: 16-bit
      fixtures < 1 s of attempts each, 20-bit about 4 s, 24-bit 40-65 s,
      28-bit about 12 minutes each (about 1.7e5 attempts x 2400 operations at
      the v4 rate of about 5.5e5 group operations/s); nulls and controls
      about 1-2 minutes per 28-bit fixture and seconds elsewhere.
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
    protection_note: Memory is machine protection; time and CPU estimates are advisory (docs/research-budget-policy.md).
  machine_protection:
    M-1: 'At launch: 15-minute load <= 14; system volume ("/" on non-macOS) >= 5 GiB free; repository volume >= 20 GiB free; readings recorded in the manifest. Otherwise refuse launch (not a result).'
    M-2: 'Memory watchdog at 4 GiB RSS; fail closed if the watchdog cannot run.'
  stopping_rules:
    - Stop at the first failed certificate, identity check or audit replay; classify the run invalid (procedure defect).
    - Stop on memory protection or signal; classify failed_infrastructure; completed cells are kept as partial artifacts and carry no verdict.
    - Never change thresholds, budgets, replicate counts or statistics during or after the run.
  invalidation_rules:
    - A budget or yield that differs from P-5's frozen values invalidates the run.
    - Any draw from an unfrozen label, or any treatment draw evaluated before the admitted run (other than in the smoke namespace with smoke budgets), invalidates the run.
    - Smoke runs use the L-9 namespace and budgets outside a factor 1.25 of every frozen A_kappa of the same fixture, or omit treatment statistic fields.
    - Infrastructure failures never falsify the hypothesis.
  run_status_vocabulary: >-
    running; completed_valid (all cells, all controls pass); invalid with
    failure_class procedure_defect; failed_infrastructure with failure_class
    exception | signal | infrastructure_error | resource_exhaustion.
  required_artifacts:
    - manifest.yaml with top-level run block (id, experiment_id, status, code, environment, inputs, timing, result), protocol sha256, fixture receipt sha256, implementation file hashes
    - command.txt (exact argv), stdout.log, stderr.log, environment.json (python, numpy, scipy, networkx, sage versions)
    - per-fixture attempts JSONL (j, a_j, b_j, outcome, kept relation, n_decomp, charged operations)
    - per-cell JSON (graph edge list, S-1..S-4 values, every rewire replicate's C34, C1, C2, M4 and cycle_rank, ER replicate values, controls, timings, peak RSS)
    - pooled analysis JSON (S-5..S-9, verdict, control outcomes)
    - accounting audit and certificate-verification report
    - git commit and dirty-tree state; every failure and exception
  write_scope:
    - experiments/EXP-RELN-dc761f/implementation/
    - experiments/EXP-RELN-dc761f/runs/
    - experiments/EXP-RELN-dc761f/fixtures/

  # ------------------------------------------------------------------ inlined rulings
  open_question_rulings:
    note: >-
      Self-contained restatement of every open-question ruling v4 adopted
      (AMD-20260929-988139 adopted OQ-1..OQ-3, OQ-5..OQ-13, OQ-15..OQ-20 by
      reference to implementation_report.yaml, ruled OQ-4 and OQ-14, and the
      implementation added OQ-21..OQ-29), plus each underdetermination the
      blind re-deriver found (RD-20261001-4aefce U-1..U-13). Each entry says
      what THIS contract does; no entry depends on reading the v4 files.
    v4_open_questions:
      - {id: OQ-1, topic: log base L, ruling: 'Replaced. L = ceil(q^{1/5}) (P-4) for every logarithm; L_fb recorded only. delta_short uses +1 smoothing, so it is always defined.'}
      - {id: OQ-2, topic: CI population for delta_proof, ruling: 'Replaced by the pooled Monte Carlo test S-5; no seed-level t-interval enters the verdict.'}
      - {id: OQ-3, topic: flat-or-rising trend, ruling: 'Replaced by the report-only trend S-9.'}
      - {id: OQ-4, topic: ER clause aggregation, ruling: 'Replaced. ER is report-only (N-2), simple, always feasible, every replicate kept.'}
      - {id: OQ-5, topic: subcritical rule scope, ruling: 'Replaced. C-SUB per fixture x kappa cell, |V| > 40 only, report-only.'}
      - {id: OQ-6, topic: LP vertex set, ruling: 'Kept: root plus LP classes incident to an LP edge; root always present (G-7). n_lp recorded.'}
      - {id: OQ-7, topic: multiple decompositions and degenerate hits, ruling: 'Kept: full scan; first decomposition in scan order kept; extras counted; R = P1 is a single-point hit (no edge); R = O is R_is_O; both failed attempts (G-2..G-5).'}
      - {id: OQ-8, topic: scan both signs, ruling: 'Kept: both signs scanned, every point operation charged (P-3, G-3).'}
      - {id: OQ-9, topic: seed labels, ruling: 'Replaced by the complete label table L-1..L-9 under namespace EXP-RELN-dc761f/v1.'}
      - {id: OQ-10, topic: 10% audit selection, ruling: 'Kept in form: H(audit label) mod 10 == 0 (L-8); every relation certificate is checked regardless (K-AUD).'}
      - {id: OQ-11, topic: configuration-model rewire type, ruling: 'Changed: configuration model conditioned on no root-root edge by rejection (N-1); LP loops and parallel edges kept; exact shuffle of seed_rules.'}
      - {id: OQ-12, topic: ER simple or multigraph, ruling: 'Simple, with m_s = distinct non-loop pairs so it is never infeasible (N-2).'}
      - {id: OQ-13, topic: planted-dense known positive, ruling: 'Replaced by the degree-preserving planted enrichment K-POS (v4 planted density, which an ER null also passes, is not used).'}
      - {id: OQ-14, topic: scrambled known false not exercised, ruling: 'Not applicable: no LP log recovery and no scrambled-coefficient control; relation validity is checked by certificates (G-6, K-AUD).'}
      - {id: OQ-15, topic: Horton at 24 bits, ruling: 'Replaced: M4/M3 by rank for every graph and replicate; Horton histogram for treatment graphs with <= 300000 candidates (S-3).'}
      - {id: OQ-16, topic: blind descent, ruling: 'Not applicable; no descent step.'}
      - {id: OQ-17, topic: charged work unit, ruling: 'Kept as descriptive only: setup plus attempt group operations, scalar-multiplication operation counts recorded; instance construction uncharged (G-8). No comparison.'}
      - {id: OQ-18, topic: LP recovery fraction, ruling: 'Not applicable; no recovery computed.'}
      - {id: OQ-19, topic: rho baseline, ruling: 'Not run; no cost comparison permitted from this experiment (K-BASE).'}
      - {id: OQ-20, topic: machine precondition off macOS; meaning of null controls passing, ruling: 'M-1 with "/" as system volume off macOS. "Controls passing" means the validity gate of verdict_rules.'}
      - {id: OQ-21, topic: undetermined ER clause with subcritical rule firing, ruling: 'Not applicable (ER is report-only; C-SUB is report-only).'}
      - {id: OQ-22, topic: cell-level known-positive power, ruling: 'Replaced by the pooled K-POS check.'}
      - {id: OQ-23, topic: superseded approval decision, ruling: 'The driver refuses an approval decision whose status is superseded or withdrawn, or which has a non-null superseded_by, or which a later decision lists under supersedes.'}
      - {id: OQ-24, topic: smoke budget near frozen, ruling: 'Smoke budgets must differ from every frozen A_kappa of the same fixture by more than a factor 1.25 (strict), or smoke output omits treatment statistic fields.'}
      - {id: OQ-25, topic: snapshot coverage and dirty tree, ruling: 'Every implementation file is pinned in the snapshot receipt; any untracked or modified file under implementation/ blocks a scientific run.'}
      - {id: OQ-26, topic: run status vocabulary, ruling: 'As run_status_vocabulary.'}
      - {id: OQ-27, topic: smoke margin boundary, ruling: 'A ratio of exactly 1.25 is refused (see OQ-24); other fixtures budgets do not count.'}
      - {id: OQ-28, topic: run provenance check, ruling: 'Cells run only as children of the admitted driver, which passes a per-run token; a hand-launched cell refuses a non-smoke namespace.'}
      - {id: OQ-29, topic: driver SIGKILL, ruling: 'Cells exit when re-parented and write no cell JSON; the manifest stays running and the run is failed_infrastructure.'}
    rederivation_findings:
      - {id: U-1, ruling: 'Resolved: this file is self-contained.'}
      - {id: U-2, finding: label prefix v1 versus v2, ruling: 'One namespace, EXP-RELN-dc761f/v1, written out in every label (L-1..L-9).'}
      - {id: U-3, finding: digest-to-integer map, ruling: 'seed_rules.H and seed_rules.uniform: full 256-bit big-endian digest, rejection at floor(2^256/n) n with "|rej<r>" re-hash, then mod n. k may be 0. a_j, b_j in [0, q).'}
      - {id: U-4, finding: two integers from one label, ruling: 'Separate sub-labels "<attempt label>|a" and "<attempt label>|b".'}
      - {id: U-5, finding: attempt index base, ruling: 'j starts at 0.'}
      - {id: U-6, finding: scan order and decomposition choice, ruling: 'S sorted by (x, y) as integers; the first decomposition in that scan order is kept (G-4); e1, e2 are the signs carried by the scanned points; T = O is a single-point hit; R = 2 P1 is kept (a loop if x(P1) >= B).'}
      - {id: U-7, finding: vertex set, ruling: 'G-7: root always present plus touched LP classes.'}
      - {id: U-8, finding: multigraph or simple, ruling: 'Multigraph with loops; repeated relations from different attempts are parallel edges (G-7).'}
      - {id: U-9, finding: which L, ruling: 'L = ceil(q^{1/5}) (P-4).'}
      - {id: U-10, finding: aggregation, CI, undefined values, trend, ruling: 'S-5 pooled test (no CI over seeds, no undefined values: C34 is always a non-negative integer); trend S-9 report-only; C-SUB per cell.'}
      - {id: U-11, finding: giant fraction denominator, ruling: 'Largest component vertex count / |V|, root included (S-4).'}
      - {id: U-12, finding: ER seeds, ruling: 'L-4.'}
      - {id: U-13, finding: residue convention, ruling: 'Least non-negative residue in [0, p), x = 0 allowed (P-2).'}

  # ------------------------------------------------------------------ design checks
  design_power_check:
    label: NON-PROTOCOL (synthetic surrogates, numpy PCG64 from a non-protocol seed string; no curve arithmetic, no protocol label)
    report: coordination/goals/GOAL-RELN-001/batches/BATCH-9fba5a/tasks/TASK-20261001-5a45b1/design_report.yaml
    summary: >-
      100 synthetic pooled experiments per condition, R = 399 rewires (the
      protocol uses 999), S-5 rule and N-1 null as written here. 12-fixture
      set (F-1 plus three estimated 28-bit surrogates): independent-edge
      no-enrichment surrogate ENRICHED 0/100, NULL_MATCHED 99/100;
      configuration-model pseudo-treatment ENRICHED 0/100 (p_up < 0.01 in
      0/100); forest ENRICHED 0/100; degree-preserving planted enrichment at
      1.25x, 1.5x, 2.0x ENRICHED 100/100 each (achieved pooled ratio medians
      1.28, 1.53, 2.03). 9-fixture set: surrogate NULL_MATCHED 98/100, all
      other rows identical. Surrogate noise matches RUN-RELN-a695fe
      (cycle-rank excess over rewire -0.004 +- 0.051 against 0.033 +- 0.028
      delta units).

  proof_search_map:
    see: H-RELN-940f14 proof_search_map
    bottleneck: Whether short-cycle counts of the honest LP multigraph exceed the degree-preserving null.
    baseline_embedding: v4 generator, B, B2 and fixtures unchanged; exact yields cross-checked against RUN-RELN-a695fe (P-5).
    observation_collision: Configuration-model pseudo-treatments, forests and planted objects with the same degree sequence (K-FALSE-1, K-FALSE-2, K-POS).
    quantifier_order: Fixtures, budgets and thresholds frozen before any labelled draw; rewires drawn from their own labels conditional on the observed graph.
    method_ceiling: Toy-tier enrichment or null match on this scope; no cost or exponent claim.
  dominated_by:
    status: not_applicable_no_cost_claim
    rows_checked:
      - Pollard rho with negation map (Theta(sqrt(q)) time, O(1) memory; measured 0.82-1.00 sqrt(q) on the F-1 fixtures in RUN-RELN-a695fe)
      - BSGS (Theta(sqrt(q)) time and memory)
      - Two-large-prime relation collection at the v4 A2 budget (318-4125 sqrt(q) charged group operations, RUN-RELN-a695fe)
    note: >-
      This is a structural measurement with no algorithm or cost claim, so it
      is not on the time/memory frontier. Any algorithm built on its result
      starts dominated by every row above on measured cost: the v4 pipeline
      costs 318-4125 times rho's sqrt(q) constant and grows with q.
  sota_delta:
    established_time_exponent_improvement: 0
    established_memory_exponent_improvement: 0
    measured: none yet (design only)
    what_a_positive_result_would_change: >-
      Only the input to a later cost model: a short-cycle ratio r >= L^{1/4}
      would be the first evidence the parent's delta > 1/4 enrichment exists
      for this generator. It moves no exponent by itself.

  impediments:
    - id: IMP-1
      raised: '2026-10-01'
      condition: Inputs not frozen at design time
      what_is_blocked: Approval and admission of EXP-RELN-dc761f (the F-2 28-bit fixtures and their P-5 budgets are not yet derived)
      why_not_done_here: >-
        The design card forbids protocol-labelled computation; F-2 derivation
        hashes EXP-RELN-dc761f/v1 curve labels. The rule is fully specified
        above, so any agent can derive the values deterministically.
      clears_when: >-
        A coordinator- or executor-owned task derives the three F-2 fixtures
        and their P-5 values, an independent second implementation reproduces
        them, and both are committed as experiments/EXP-RELN-dc761f/fixtures/fixture_receipt.yaml
        with sha256 before the approval decision.
      recheck: test -f experiments/EXP-RELN-dc761f/fixtures/fixture_receipt.yaml and compare its values with an independent re-derivation
      fallback_if_never_cleared: >-
        An additive amendment may drop F-2; the primary test then runs over
        the 18 F-1 cells (design check, 9-fixture set: planted 1.25x ENRICHED
        100/100, surrogate NULL_MATCHED 98/100) and C-SUB stays nearly
        unreachable (5% at 24 bits), which the evidence record must state.
      asserts_nothing_about: the science

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      On the 12 tested fixtures, the v4 generator and the four budgets: the
      honest LP multigraph's pooled 3- and 4-cycle count is (ENRICHED) or is
      not (NULL_MATCHED / DEPLETED) at least 1.25 times its
      configuration-model rewire null.
    explicitly_not_supportable_under_any_outcome: Cryptographic-size ECDLP statements; deployed-curve solves; any cost or exponent claim; claims about other generators, B2 exponents or Semaev/extension-field decompositions.
  what_this_is_not:
    - Not an amendment of EXP-RELN-c5a377 (it stays frozen).
    - Not approved; not admitted.
    - Not a cost comparison.
