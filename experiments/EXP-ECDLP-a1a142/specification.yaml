  source_proposal: IDEA-20260805-cc4c2c
  prior_draft: >
    coordination/design/BATCH-4c0b9a/tasks/TASK-20260909-76de1d/
    reserved H-ECDLP-d9b1f3 and EXP-ECDLP-a1a142 as a
    zero-run draft. This contract is the canonical Stage 0
    promotion of that draft. It does not inherit the
    draft's recalled transfer-cost numbers.
  class: control
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-13 by
    DEC-20260913-f41c2e under the standing 2026-09-06
    user authorization. Stage 0 is the exact
    least-positive modular embedding-degree calibrator.

  objective: >
    Evaluate the exact identity that on
    REAL-A (p=2, r=7, cap=8) one has
    least k=3, on REAL-B (p=5, r=11,
    cap=8) one has least k=5, and
    reject the nearby claim that
    asserted_k=1 on REAL-A, on one
    frozen family (REAL, KF, NULL).
    Stage 0 does not select a live
    curve and does not authorize
    Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL-A has
      k=3; REAL-B has k=5; KF
      asserted_k=1 rejected because
      k=3; NULL invalid p=1 rejected;
      cap=2 on REAL-A rejected; mixed
      cost labels rejected;
      toy-versus-crypto ranking
      rejected. Certificate kind
      none.
    formula: >
      Enumerate j=1..cap; return the
      least j with p^j ≡ 1 (mod r).
      REAL-A: 2^3 ≡ 1 (mod 7).
      REAL-B: 5^5 ≡ 1 (mod 11).
      KF: claim k=1, actual k=3,
      rejected as a generic
      embedding-degree target.
    source: >
      Finite modular arithmetic on
      the frozen toys. No named
      transfer theorem is used.
    claim_tier: observational

  inputs:
    fixture:
      real_a:
        field_modulus_p: 2
        subgroup_order_r: 7
        k_search_cap: 8
        asserted_k: 3
        must_k: 3
        cost_inputs:
          time: {label: unavailable, reason_code: stage0_no_cost}
          memory: {label: unavailable, reason_code: stage0_no_cost}
          data_or_queries: {label: unavailable, reason_code: stage0_no_cost}
      real_b:
        field_modulus_p: 5
        subgroup_order_r: 11
        k_search_cap: 8
        asserted_k: 5
        must_k: 5
        cost_inputs:
          time: {label: unavailable, reason_code: stage0_no_cost}
          memory: {label: unavailable, reason_code: stage0_no_cost}
          data_or_queries: {label: unavailable, reason_code: stage0_no_cost}
      known_false:
        kind: asserted_k_mismatch
        field_modulus_p: 2
        subgroup_order_r: 7
        k_search_cap: 8
        asserted_k: 1
        must_k: 3
        must_reject: true
        refuse_code: asserted_k_mismatch
      matched_null:
        kind: invalid_p
        field_modulus_p: 1
        subgroup_order_r: 7
        k_search_cap: 8
        must_reject: true
        refuse_code: invalid_public_integer
      invalid:
        - {k_search_cap: 2, field_modulus_p: 2, subgroup_order_r: 7, must_reject: true, refuse_code: no_k_within_cap}
        - {mix_unavailable_as_measured: true, must_reject: true, refuse_code: mixed_cost_labels}
        - {rank_toy_against_crypto_placeholder: true, must_reject: true, refuse_code: scale_class_mismatch}

  controls:
    - name: known_false_asserted_k
      object: KF claim asserted_k equals 1 on REAL-A
    - name: matched_null
      object: invalid p=1
    - name: invalid_cap
      object: cap=2 below REAL-A least k
    - name: invalid_label_mix
      object: unavailable cost marked measured
    - name: invalid_scale_mix
      object: toy ranked against cryptographic placeholder

  independent_variables:
    - field_modulus_p
    - subgroup_order_r
    - k_search_cap
    - asserted_k
  metrics:
    primary:
      - fixture_pass
      - real_least_k_pass
      - known_false_asserted_k_pass
      - reject_invalid_pass
      - reject_scope_pass
    secondary: []
  primary_metrics:
    - fixture_pass
    - real_least_k_pass
    - known_false_asserted_k_pass
    - reject_invalid_pass
    - reject_scope_pass
  secondary_metrics: []
  seeds: [8]
  replication_plan: >
    One Stage 0 run. Deterministic
    exact integer tables. No sampling.
  budget:
    wall_clock_seconds: 120
    memory_gb: 2
    maximum_runs: 1
    enforcement: advisory
  stopping_rules:
    - Stop after the five gates are recorded.
    - A timeout is failed_infrastructure, not a mathematical miss.
  invalidation_rules:
    - Missing artifact paths invalidate the run.
    - Overwriting an existing run record invalidates the procedure.
  success_criterion: >
    All five Stage 0 gates true and
    certificate kind none on the
    frozen REAL / KF / NULL toys.
  falsification_criterion: >
    After fixture_pass, any REAL
    least-k miss or KF-asserted-k
    accept at the frozen toys.
  success_criteria:
    - All five gates true and certificate kind none.
  falsification_criteria:
    - After fixture_pass, any REAL table miss or KF accept.
  required_artifacts:
    - raw-result.json
    - execution-report-s0.yaml
    - implementation/stage0_embk.py
  dependencies:
    - H-ECDLP-d9b1f3
    - DEC-20260913-f41c2e
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
  scientific_boundary: >
    Stage 0 P-S0-EMBK only. Not a
    named transfer. Not an
    L-function cost. Not Semaev.
    Not a P1553 recurrence. Not a
    factor-base. Not Velu. Not a
    rho beat. No Stage 1 of
    EXP-ECDLP-a1a142. No Stage 1
    of EXP-ECDLP-e9dd89.
