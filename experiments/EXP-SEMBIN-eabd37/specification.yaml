# EXP-SEMBIN-eabd37
# Ceilings and one dense-memory square at n = 571. No optimiser.
# Approved by DEC-20261002-4b082e.
experiment:
  id: EXP-SEMBIN-eabd37
  hypothesis_id: H-SEMBIN-471c4a
  source_idea: IDEA-20260913-9c54f9
  question_id: RQ-SEMBIN-fa2e3f
  version: 1
  title: Diagonal ceilings and one dense square at n = 571
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-4b082e
  objective: >-
    Compute ceil(571/m) for seven values of m, the variable count at
    m = 12, the square of binom(6289, 4), and the first k at which
    k^2 * 2^k exceeds 571^2. Reject k = 10 as a clearing value.
  inputs:
    n: 571
    rows:
      - {m: 2, k: 286}
      - {m: 10, k: 58}
      - {m: 12, k: 48, N: 6286}
      - {m: 13, k: 44}
      - {m: 22, k: 26}
      - {m: 29, k: 20}
      - {m: 30, k: 20}
    square_bounds:
      at_least_2_to_91: true
      below_2_to_92: true
      above_917_tenths: true
      below_918_tenths: true
    bound:
      fails_at_10: true
      fails_at_11: true
      first_clearing_k: 12
  controls:
    - >-
      k = 10 does not satisfy k^2 * 2^k > 571^2. Reporting that it does
      invalidates the run.
    - >-
      The square is strictly below 2^92. Reporting that it meets or
      exceeds 2^92 invalidates the run.
    - Two integer routes. They must not import each other.
  independent_variables:
    - m
    - route in {division_and_product, repeat_module}
  metrics:
    primary:
      - k_by_m
      - N_at_m12
      - square_bounds
      - first_clearing_k
      - k10_rejected
      - implementations_agree
    secondary:
      - fails_at_11
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Seven ceilings, one variable count, four square bounds, and one first k.
    formula: >-
      k = ceil(n/m) by integer division (n + m - 1) // m.
      N = (m - 2)*n + k*m. The square is
      ((N+3)*(N+2)*(N+1)*N // 24)^2. It is above 2^{91.7} when its
      tenth power exceeds 2^917, and below 2^{91.8} when that power is
      below 2^918. The bound holds when k^2 * 2^k > 571^2.
    source: >-
      IDEA-20260913-9c54f9 claim paragraphs C1 and C4, read 2026-10-02.
      The integers were recomputed in this design session. That
      computation is not a run. The proposal's phrase about k0 at least
      10 does not satisfy the strict inequality. The written tenth 91.8
      is an upper bound.
  scale_relevance:
    tier: toy
    justification: Integer arithmetic at one n. No transfer to a runtime or a memory measurement.
    correspondence: null
  tail_checks:
    - m = 30 is required. Stopping at m = 29 and still reporting the m = 30 ceiling is invalid.
  replication:
    seeds: []
    independent_instances: 7
    replication_note: Deterministic. The second run is the other integer module.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If k = 10 is reported as clearing the bound, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - k = 10 is reported as clearing the bound.
    - The square is reported as at least 2^92.
    - A runtime, a rho comparison, or a claim that a FIPS curve is broken is reported.
  success_criterion: >-
    Both runs agree. The ceilings are 286, 58, 48, 44, 26, 20 and 20.
    N at m = 12 is 6286. The square is at least 2^91, below 2^92, above
    2^{91.7} and below 2^{91.8}. The bound fails at 10 and at 11 and
    first holds at 12.
  falsification_criterion: >-
    The runs agree, k = 10 stays rejected, the square stays below 2^92,
    and any ceiling, variable count, square bound, or first clearing k
    differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-SEMBIN-eabd37/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SEMBIN-eabd37/runs/<RUN-ID>/command.txt
    - experiments/EXP-SEMBIN-eabd37/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SEMBIN-eabd37/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SEMBIN-eabd37/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-SEMBIN-eabd37/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Time estimates, rho comparisons, and any FIPS-curve conclusion.
    - The memory minimum over m.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
