experiment:
  id: EXP-MLKEM-011
  hypothesis_id: H-MLKEM-011
  goal_id: GOAL-MLKEM-003
  version: 1
  title: >-
    Carrier Fig 4.1 Pwrong experimental coverage vs Pgood operating threshold
  status: approved
  frozen: true
  approved_by: coordinator
  approved_at: '2026-07-31'
  claim_tier: medium
  objective: >-
    Using the authors' archived verifyModel ScoreExperimentalDistribution
    outputs (and fresh runs if G6K is available), measure whether the
    experimentally recorded Pwrong T-range intersects the Pgood≈1/2 operating
    threshold, and quantify the probability-extrapolation gap from that toy
    floor to Kyber-scale Table C.2 log2(Pwrong).

  source_refs:
    literature: [KN-LIT-7617, KN-LIT-111]
    code: https://github.com/kevin-carrier/CodedDualAttack/tree/main/verifyModel
    prior: [EXP-MLKEM-015, EXP-MLKEM-010]

  controls:
    - id: CTRL-ARCHIVED-FIG41
      description: Authors' Pwrong/Pgood .out files for Fig 4.1 parameters
    - id: CTRL-TABLE-C2
      description: Kyber CC log2(Pwrong) from Table C.2 as extrapolation target

  metrics:
    primary:
      - fraction_Pgood_inside_Pwrong_T_range
      - T_gap_minPgood_minus_lastPositivePwrongT
      - log2_extrapolation_Kyber512_vs_toy_floor
  scale_relevance:
    tier: medium
    justification: >-
      Toy simulations are not Kyber-scale; the metric is the coverage gap and
      extrapolation distance, which directly bounds what Fig 4.1 can support
      about Table 5.1.
  budget:
    wall_clock_seconds_per_run: 600
    maximum_runs: 2
  success_criterion: >-
    fraction_Pgood_inside_Pwrong_T_range and extrapolation gap are measured
    from archived (or fresh) artifacts with explicit file hashes.
  falsification_criterion: >-
    Archived left-panel Pgood scores substantially overlap the recorded
    Pwrong T-range (fraction inside > 0.5), contradicting the scope-gap claim.
  invalidation_rules:
    - Missing both G6K and archived Fig 4.1 data files
  required_artifacts:
    - experiments/EXP-MLKEM-011/runs/RUN-MLKEM-011-001/results.json
    - experiments/EXP-MLKEM-011/runs/RUN-MLKEM-011-001/pwrong_scope_gap.json
  assigned_to: executor
