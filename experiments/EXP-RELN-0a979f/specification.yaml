experiment:
  id: EXP-RELN-0a979f
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  approved_by: null

  hypothesis_id: H-RELN-66c079
  question_id: RQ-RELN-001
  goal_id: GOAL-RELN-001
  idea_id: IDEA-20260805-a25f11

  title: >-
    Graded additive-energy census of the collision deficit: measuring the one free
    coordinate of P(decomp), against a derived ceiling, a derived negation floor,
    and a derived sign-change threshold at B = (N/2)^{1/3}

  objective: >-
    Measure the collision deficit D = mu - coverage across a six-arm ladder of
    factor-base additive energies at fixed (B, m, N), and test three derived
    statements: the exact ceiling coverage <= (2B^2+1)/N at m = 2, the exact
    negation floor (B multisets to the identity at m = 2; 2B^2 multisets onto 2B
    targets at m = 3), and the threshold below which the best possible base is
    strictly worse than a random one. The mean mu is forced and is used only as a
    reference; the deliverable is the deficit, which is the only coordinate of the
    P(decomp) curve that (B, m, N) do not already determine.

  what_this_is_not:
    - Not an attack, not a relation-collection campaign, not a discrete-logarithm computation.
    - Not a claim that structured factor bases cannot help index calculus; that sentence is on DEC-20260724-020's forbidden list and is not written here.
    - Not a claim about relation rank or independence, which are excluded from this contract's scope exactly as they were excluded from DEC-20260724-020's.
    - Not a measurement of solve cost; the decider is not exercised at all.
    - Not a proposal to use a low-additive-energy factor base as an attack. Its discrete logarithms are known by construction and the AM-GM two-table bound applies; it is a measuring rod.
    - Not an authorisation, approval, freezing, run, observation, or evidence, and not a status change to any existing record.

  claim_ceiling:
    tier: toy
    exact_scope: >-
      A completed run could support only this: at field_bits in {8, 10, 12, 16} on
      the named deterministic curves, with the frozen protocol's own B-ladder,
      m in {1, 2, 3}, and six named factor-base families, the measured coverage of
      each arm does or does not respect the derived ceiling; the deficit does or does
      not order monotonically with additive energy; and the sign of the best-arm
      advantage does or does not flip at the derived threshold. Nothing about
      crypto-scale decomposition probability, index-calculus cost, relation rank, or
      any published construction follows. The frozen protocol's prohibited_claims
      list is inherited verbatim.

  inputs:
    field_bits: [8, 10, 12, 16]
    arity_m: [1, 2, 3]
    factor_base_size_ladder:
      note: Taken unmodified from the frozen protocol's default ladder.
      bits_8: [4, 6, 8, 12]
      bits_10: [6, 10, 14, 20]
      bits_12: [8, 14, 20, 28]
      bits_16: [12, 20, 32, 48]
    groups:
      - id: GRP-CURVE
        description: >-
          Deterministic ordinary short-Weierstrass E(F_p), selected exactly as in
          EXP-RELN-475c87 (same prime rule, same candidate stream, same acceptance
          conditions: N odd, near-cyclic, N != p). The same curves are reused so the
          two contracts are directly comparable.
      - id: GRP-ZN
        description: >-
          Z/N with the same N and the same exponent sets, i.e. the curve removed.
          Nearby-object control: every forced value must be identical.
    base_families:
      - id: ARM-AP-K1
        energy_rank: 1 (highest)
        construction: "V = {x((a + i d) G) : i = 0..B-1}; one arithmetic progression in the exponent."
      - id: ARM-AP-K2
        energy_rank: 2
        construction: "Union of 2 APs of length B/2, offsets from the seed stream."
      - id: ARM-AP-K4
        energy_rank: 3
        construction: "Union of 4 APs of length B/4."
      - id: ARM-AP-K8
        energy_rank: 4
        construction: "Union of 8 APs of length B/8 (only where B >= 8)."
      - id: ARM-UNIFORM
        energy_rank: 5
        construction: "B exponents drawn uniformly without replacement by the seed stream. The matched null."
      - id: ARM-SIDON-B3
        energy_rank: 6 (lowest)
        construction: >-
          B exponents forming a B_3 (Sidon-of-order-3) set in Z/N, built GREEDILY
          (accept the next candidate iff it creates no repeated three-term sum among
          the accepted set and its negatives). The greedy construction is used rather
          than Bose-Chowla precisely because the Bose-Chowla claim is RECALLED,
          UNVERIFIED in this session; if a source is obtained during the run, a
          Bose-Chowla arm is added as a supplementary arm and reported separately,
          never substituted.
    seed_derivation_rule: >-
      seed_bytes(label, bits, counter) = ASCII of
      "EXP-RELN-0a979f/v1|" || label || "|" || decimal(bits) || "|" || decimal(counter),
      SHA-256, big-endian unsigned. Labels: "curve-a", "curve-b", "ap-offset",
      "ap-step", "uniform", "sidon-probe". All consumed seeds are enumerated in the
      manifest before execution; no adaptive reseeding.
    exponent_convention: >-
      Every arm is specified by a set S of EXPONENTS in Z/N; the factor base is
      V = {x(sG) : s in S}, and W = {sG, -sG : s in S}. Working in exponents is what
      makes additive energy computable exactly and is also the reason no arm is an
      attack: the discrete logarithms are known by construction. This is stated in
      the contract so it cannot be forgotten in the writeup.

  arms_and_controls:
    treatment: >-
      ARM-AP-K1 through ARM-SIDON-B3, six arms per (bits, m, B) cell, evaluated on
      GRP-CURVE.
    measured_null:
      id: ARM-UNIFORM
      forced_values_derived_pre_run:
        - "multiset total EXACTLY C(2B+m-1, m), identical to every other arm"
        - "coverage within the Clopper-Pearson interval of 1 - exp(-mu)"
        - "c_W(O) EXACTLY B at m = 2 (no 2-torsion, no other 2-term relation expected)"
      can_fail: >-
        Yes, in two independent ways: a different total means the enumerator is
        wrong; a coverage far from Poisson on a uniform base means the toy group is
        not behaving like a random group and the whole census is confounded before
        any structured arm is read.
    positive_control:
      id: ARM-AP-K1
      requirement: >-
        The single-AP base must show a coverage COLLAPSE of at least one order of
        magnitude relative to ARM-UNIFORM at the cells corresponding to
        KN-FIND-007's recorded 0.0021 ratio (N ~ 2^18, m = 3), while its multiset
        TOTAL must be exactly equal to ARM-UNIFORM's. IF THE COLLAPSE DOES NOT
        APPEAR, THE INSTRUMENT CANNOT SEE ADDITIVE ENERGY AND NO NEGATIVE RESULT MAY
        BE REPORTED FROM ANY ARM OF THIS CONTRACT.
    graded_control:
      id: ARM-K-LADDER
      description: >-
        The k = 1, 2, 4, 8, B ladder is the graded control, with five interior points
        at fixed (B, m, N). Pre-registered prediction: coverage/mu strictly increasing
        in k, with at least three consecutive pairs separated by more than their
        Clopper-Pearson intervals. A non-monotone ladder localises the obstruction to
        a specific k instead of returning "it did not work".
    nearby_object_controls:
      - id: ARM-ZN
        description: >-
          Every arm repeated on GRP-ZN. All forced values must be IDENTICAL to
          GRP-CURVE, because none of them uses the curve. A difference is an artifact
          of the point arithmetic and must be found before anything else is read.
      - id: ARM-M1
        description: >-
          m = 1 on every arm. Coverage must be EXACTLY 2B/N and the deficit EXACTLY 0
          for all six arms; the geometry channel is provably empty at m = 1, so any
          arm-to-arm difference here is instrument error.
    threshold_arm:
      id: ARM-THRESHOLD
      description: >-
        At bits = 12 and bits = 16 the derived threshold B ~ (N/2)^{1/3} (about 10.1
        and 25.4 at the illustrative primes) lies INSIDE the ladder. The sign of
        (best-arm coverage minus ARM-UNIFORM coverage) is predicted NEGATIVE below and
        POSITIVE above, at both bit sizes, with the crossover reproduced to within one
        ladder step. A sign change is a far stronger signature than a magnitude and
        cannot be produced by a monotone artifact.
    ordering_control: >-
      The forced-value table (ceilings, floors, threshold locations, Poisson
      predictions) is instantiated at the real primes and orders, written to the run
      directory and SHA-256 hashed BEFORE any arm is enumerated. ARM-M1, then
      ARM-ZN, then ARM-UNIFORM are evaluated and recorded before any structured arm's
      output is read.
    comparability_policy: >-
      Arms are compared only within a matched (group, bits, curve, m, B) cell, and
      only after both the m = 1 slice and the ARM-ZN slice have passed. Cross-cell
      and cross-bit comparisons are reported as descriptive only.

  independent_variables: [group, field_bits, arity_m, factor_base_size_B, base_family_energy_rank]

  metrics:
    primary:
      - metric_id: coverage
        type: rational
        definition: "fraction of group elements g with c_W(g) > 0, enumerated exactly"
      - metric_id: deficit
        type: rational
        definition: "mu - coverage, with mu = C(2B+m-1,m)/N (forced, not measured)"
      - metric_id: coverage_over_mu
        type: rational
        definition: "coverage / mu; the scale-free form used for all cross-cell comparison"
      - metric_id: gain_vs_uniform
        type: rational
        definition: "coverage(arm) / coverage(ARM-UNIFORM) at matched cell"
      - metric_id: threshold_sign
        type: categorical
        definition: >-
          sign of (max over arms of coverage) - coverage(ARM-UNIFORM), reported per
          cell alongside the derived threshold (N/2)^{1/3}
    secondary:
      - metric_id: multiset_total
        type: integer
        definition: "sum_g c_W(g); forced value C(2B+m-1, m), identical across all six arms"
      - metric_id: identity_count
        type: integer
        definition: "c_W(O) at m = 2; forced floor B"
      - metric_id: pair_multiset_count
        type: integer
        definition: "number of size-3 multisets containing a +/- pair, and the number of distinct targets they cover; forced 2B^2 and 2B"
      - metric_id: multiplicity_histogram
        type: vector
        definition: "counts of targets at c = 0, 1, 2, 3, >=4; the tracked object of H-RELN-66c079"
      - metric_id: additive_energy
        type: integer
        definition: "number of quadruples (a,b,c,d) in W^4 with a+b = c+d, computed exactly at m = 2 cells where |W| permits"
      - metric_id: clopper_pearson_intervals
        type: interval
        definition: "two-sided 95% intervals on coverage, computed per arm from the exact target count"

  heuristic_under_test: HEUR-RELN-B2

  preregistered_prediction:
    quantity: "coverage/mu per arm, and the sign of the best-arm advantage per cell"
    formula: >-
      Ceiling at m = 2: coverage/mu <= (2B^2+1)/(2B^2+B).
      Uniform arm: coverage/mu ~ (1 - exp(-mu))/mu.
      Sign change: best-arm advantage is negative iff 2N(B-1) > (2B^2+B)^2, i.e.
      iff B < roughly (N/2)^{1/3}.
      Global bound: max over all arms and B of gain_vs_uniform <= 1.58198.
    source: >-
      KN-FIND-007's conservation identity and coverage ceiling, extended to the
      +/- symmetric set W in H-RELN-66c079, combined with the balls-in-bins
      comparator HEUR-RELN-B2. Derived before this contract was written; the
      threshold reproduces the sign of the derived maximum gain at all sixteen m = 2
      ladder cells with no fitted parameter.

  stages:
    - id: STAGE-1-DERIVE
      cost: "zero compute"
      description: >-
        Derive and commit the m = 2 and m = 3 forced floors, the ceilings, the
        threshold location per cell, and the Poisson comparator. If the m = 3 pair
        count cannot be derived cleanly, restrict the contract to m in {1, 2} and say
        so rather than guessing.
      can_terminate_run: true
      terminates_what: "The m = 3 half, or the whole contract if the m = 2 ceiling cannot be derived."
    - id: STAGE-2-BASELINE-SLICE
      cost: "seconds"
      description: >-
        ARM-M1 on all six arms and both groups. Coverage must be exactly 2B/N with
        zero deficit everywhere. A single arm-to-arm difference here stops the run.
      can_terminate_run: true
      terminates_what: "The whole contract; the enumerator is not reading multiset structure."
    - id: STAGE-3-NULL-AND-NEARBY
      cost: "seconds"
      description: >-
        ARM-UNIFORM and ARM-ZN at every cell. Record and freeze their verdicts before
        reading any structured arm.
      can_terminate_run: true
      terminates_what: "The whole contract if totals mismatch or the two groups disagree on a forced value."
    - id: STAGE-4-POSITIVE-CONTROL
      cost: "seconds"
      description: >-
        ARM-AP-K1. Require the coverage collapse. If absent, stop and report
        instrument insensitivity; no negative result may be reported from any arm.
      can_terminate_run: true
      terminates_what: "All negative conclusions."
    - id: STAGE-5-LADDER
      cost: "minutes"
      description: >-
        ARM-AP-K2, K4, K8, ARM-SIDON-B3. Report coverage/mu, the monotonicity verdict
        in k, and the ceiling compliance of every arm.
      can_terminate_run: false
    - id: STAGE-6-THRESHOLD
      cost: "zero compute beyond stage 5"
      description: >-
        Report threshold_sign per cell at bits = 12 and 16 against the derived
        (N/2)^{1/3}, and state whether the crossover is reproduced within one ladder
        step.
      can_terminate_run: false
    - id: STAGE-7-RECONCILE
      cost: "zero compute"
      description: >-
        Compare the measured coverage ratios against DEC-20260724-020's published
        ratios (1.1071 Bose-Chowla B_3; 1.0269 greedy; 0.0021 small-multiples) AS
        RELAYED, noting that decision's scope line says "unsigned multisets" so the
        two may be about different objects. REPORT AGREEMENT OR DISAGREEMENT; DO NOT
        ADJUDICATE IT (AGENTS.md: report contradictory sources rather than picking
        one).
      can_terminate_run: false

  replication:
    seeds:
      - "EXP-RELN-0a979f/v1|curve-a|<bits>|<t>"
      - "EXP-RELN-0a979f/v1|curve-b|<bits>|<t>"
      - "EXP-RELN-0a979f/v1|ap-offset|<bits>|<index>"
      - "EXP-RELN-0a979f/v1|ap-step|<bits>|<index>"
      - "EXP-RELN-0a979f/v1|uniform|<bits>|<index>"
      - "EXP-RELN-0a979f/v1|sidon-probe|<bits>|<index>"
    independent_instances: 5
    replication_note: >-
      Five independently seeded instances per (curve, arm, B). The forced values are
      deterministic; the coverage measurements are not, and the Clopper-Pearson
      intervals are computed from the exact target counts rather than from the
      replicate spread, with the replicate spread reported separately as a
      consistency check.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2
    maximum_memory_gb: 2
    maximum_runs: 20
    unit_note: >-
      Primary unit is exact multiset enumerations; wall clock is secondary. No scalar
      cost is formed across units. Largest enumerations: C(97,2) = 4656 at m = 2 and
      C(58,3) = 32,509 at m = 3, times six arms, two groups, four bit sizes and five
      replicates.

  stopping_rules:
    - id: STOP-M1-DIFFERS
      condition: "Any arm-to-arm difference at m = 1."
      action: "Stop; instrument error."
    - id: STOP-TOTAL-MISMATCH
      condition: "Any arm's multiset total differs from C(2B+m-1, m)."
      action: "Stop; report as falsification of the conservation extension."
    - id: STOP-CEILING-EXCEEDED
      condition: "Any arm exceeds its derived coverage ceiling."
      action: "Stop; report as falsification of H-RELN-66c079's ceiling."
    - id: STOP-POSITIVE-CONTROL-FAILS
      condition: "ARM-AP-K1 shows no coverage collapse."
      action: "Stop; NO negative result from any arm may be reported."
    - id: STOP-ZN-DISAGREES
      condition: "GRP-ZN and GRP-CURVE disagree on any forced value."
      action: "Stop; locate the point-arithmetic artifact first."
    - id: STOP-GAIN-ABOVE-BOUND
      condition: "Any gain_vs_uniform exceeds 1.58198 at matched B."
      action: "Stop; either conservation or the measurement is broken."
    - id: STOP-BUDGET
      condition: "Budget exhausted."
      action: "Report as infrastructure outcome."

  invalidation_rules:
    - "Any exponent set with repeated elements, or containing 0, or containing s with 2s = 0."
    - "Any curve accepted with even N, with N = p, or with a large non-cyclic part."
    - "Any arm compared across a cell boundary."
    - "Any structured arm read before ARM-M1, ARM-ZN, ARM-UNIFORM and ARM-AP-K1 verdicts are frozen."
    - "Any seed not present in the pre-execution manifest, or any adaptive reseeding."
    - "Any substitution of a Bose-Chowla arm for the greedy B_3 arm rather than an addition alongside it."
    - "Any comparison against DEC-20260724-020's ratios that silently mixes signed and unsigned conventions."

  infrastructure_failure_disposition: >-
    Timeouts, crashes, memory exhaustion, and missing dependencies are INFRASTRUCTURE
    SIGNAL, recorded with exact error text, and are NEVER negative mathematical
    evidence about the deficit, the ceiling, or the threshold (AGENTS.md rule 3). The
    enumerator uses the standard library only, so no arm can be blocked by the
    absence of sympy or Sage (both verified absent in this container). If the greedy
    B_3 search fails to reach size B at some cell, that is a CONSTRUCTION outcome, is
    reported with the size actually reached, and that cell's ARM-SIDON-B3 is marked
    not-constructed rather than being replaced by a substitute.

  scale_relevance:
    tier: toy
    justification: >-
      The ceiling, the floors and the threshold are exact counting statements that
      hold at every N, so the toy enumeration checks derivations rather than
      extrapolating. But the measured deficits, the monotonicity verdict and every
      coverage number are toy and transfer to nothing: the negation floor is a 1/B
      effect and the achievable gain is a small constant, so nothing here bears on
      cryptographic parameters. The threshold's ARITHMETIC extends to any N; the
      claim that it MATTERS does not.
    correspondence: null

  tail_checks:
    - "At the cells where mu > 1 the ceiling saturates at 1 and the gain necessarily falls; report those cells separately so saturation is not read as an effect."
    - "Report the multiplicity histogram's tail (targets with c >= 4) per arm; a heavy tail on ARM-UNIFORM would indicate the group is not behaving randomly."
    - "Report the exact additive energy alongside coverage wherever it is computable, so the claimed mechanism is checked and not assumed."

  success_criterion: >-
    All of: (a) every arm's multiset total equals C(2B+m-1, m) exactly; (b) m = 1
    returns 2B/N with zero deficit on every arm and both groups; (c) GRP-ZN and
    GRP-CURVE agree on every forced value; (d) ARM-UNIFORM's coverage lies in the
    Clopper-Pearson interval of 1 - exp(-mu); (e) ARM-AP-K1 collapses; (f) no arm
    exceeds its derived ceiling; (g) coverage/mu is monotone in k with at least three
    separated consecutive pairs; and (h) threshold_sign is negative below and positive
    above (N/2)^{1/3} at bits = 12 and 16, within one ladder step. Meeting all eight
    supports H-RELN-66c079 at toy tier.

  falsification_criterion: >-
    Any of: an arm exceeding its derived coverage ceiling; a collision-minimising arm
    beating ARM-UNIFORM at a cell with B < (N/2)^{1/3}; any gain_vs_uniform above
    1.58198 at matched B; any arm-to-arm difference at m = 1; GRP-ZN disagreeing with
    GRP-CURVE on a forced value; or a multiset total differing from C(2B+m-1, m). Any
    one refutes H-RELN-66c079 and is reported as a refutation.

  required_artifacts:
    - "The committed forced-value table (ceilings, floors, thresholds, Poisson comparators) and its SHA-256, written before execution."
    - "Per-arm, per-cell coverage, deficit, coverage/mu, multiset total, identity count, and multiplicity histogram."
    - "Exact additive energies wherever computed."
    - "The k-ladder monotonicity verdict with Clopper-Pearson intervals."
    - "The threshold_sign table against the derived (N/2)^{1/3} at bits 12 and 16."
    - "The reconciliation note against DEC-20260724-020's relayed ratios, explicitly unadjudicated, with the signed/unsigned convention difference stated."
    - "The B_3 construction log including any cell where size B was not reached."
    - "The full seed manifest, enumerated before execution."
    - "A statement of which stage terminated the run, if any."

  assigned_to: executor
