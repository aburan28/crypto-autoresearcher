experiment:
  id: EXP-SIG-c9fda8
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  hypothesis_id: H-SIG-e7ff26
  question_id: RQ-SIG-001
  goal_id: GOAL-SIG-001
  source_idea_ids: [IDEA-20260805-d38a8c, IDEA-20260805-8a68d3]

  title: >-
    Cascade leverage lam_D = residual_D / Q_D across the size lattice: a
    zero-compute consistency gate, a pre-registered n = 21 D5 cell with a forced
    dichotomy at residual_5 = 2311, and the first planted-syzygy sensitivity
    calibration this goal has ever had

  review_context: >-
    GOAL-SIG-001's next_action is "Protocol repair PASS (SIG-D6-NULL-RECAL-v2).
    Defer calibration executor until campaign capacity prioritizes D >= 6 null
    recalibration; keep D <= 5 cascade admissible." This contract does NOT
    contend with that lane and does not build or validate a null baseline. It
    opens a different route to the same completion criterion by asking a question
    that needs no D >= 6 baseline: whether the D-born non-rewritable component,
    measured on the D <= 5 axis the goal itself declares admissible, is growing
    fast enough relative to the quotient it would have to eliminate to have any
    cost consequence. Its decisive stage is a power-series evaluation on already
    committed numbers.

  objective: >-
    Determine whether the model leverage lam_D(n) = residual_D(n) / Q^model_D(n)
    decays in n on the D <= 5 axis, extend the measured series to n = 21 against
    a pre-registered threshold, and -- as a required and blocking arm -- calibrate
    the instrument's sensitivity by planting non-rewritable syzygy families of
    known dimension.

  what_this_is_not:
    - >-
      NOT a null-baseline experiment. It constructs no new null and makes no
      claim about whether any D >= 6 null validates. Every D6 quantity it touches
      is carried as context and inherits verbatim the inadmissibility declared by
      EV-SIG-006 and EV-SIG-008.
    - >-
      NOT a claim that the cascade does not exist. H-SIG-001's growth clause is
      established at D = 4 (residual_4 = 2n/3 + 1 at six sizes) and this contract
      neither disputes nor relies on disputing it.
    - >-
      NOT a d_reg or solving-degree measurement. No Groebner basis is computed
      and no solving degree is measured. EV-SIG-003 already established that the
      syzygy family and the Macaulay rank deficit are not the same object
      rank-wise; this contract does not borrow that link.
    - >-
      NOT a statement about prime fields. Every instance is the boolean chained
      Semaev system. GOAL-SIG-001's objective names prime-field decomposition
      cost and IDEA-20260805-0d2a21 raises that mismatch separately; this
      contract does not resolve it.
    - NOT a crypto-scale result and not extrapolable to one.
    - >-
      NOT an approval. status is review_required, there is no approved_by field,
      and only the Coordinator may authorize execution (AGENTS.md rule 1).

  claim_ceiling: >-
    TIER: toy. The most a completed run may support is: on the boolean chained
    Semaev lattice m = 3, t = 3, n in {9, 12, 15, 18, 21}, at D in {4, 5}, with
    the pinned instrument and its stated seeds, the measured D-born
    non-rewritable component is (or is not) a monotonically decreasing fraction
    of the semi-regular quotient, with a stated log-log slope and stated
    sensitivity calibration. It may NOT support any statement about crypto-scale
    ECDLP, about prime fields, about the degree of regularity, about D >= 6, or
    about sizes off the tested lattice. Toy evidence is never crypto-scale
    evidence (AGENTS.md rule 7).

  inputs:
    system_family: >-
      Boolean chained Semaev, m = 3, t = 3, ti = 0, the frozen family used by
      EXP-SIG-002 through EXP-SIG-008. Variables nb = 2n; equation degree
      histogram {2: n, 3: n}.
    sizes: [9, 12, 15, 18, 21]
    degrees_primary: [4, 5]
    degrees_context_only: [6]
    committed_inputs_reused_without_remeasurement:
      residual_4: "2n/3 + 1 at n = 12, 15, 18, 21, 24 (EV-SIG-005 P1)"
      residual_4_n9: "24 (EV-SIG-004); EV-SIG-002 records a different D4 series and BOTH are carried"
      residual_5: "344 / 878 / 1158 / 974 at n = 9 / 12 / 15 / 18 (EV-SIG-005)"
      residual_6_context: "2615 (n = 9, EV-SIG-006), 2722 (n = 12, EV-SIG-008)"
      ranks_and_ncols: >-
        n = 9 D6 sem rank 27292 ncols 29332; n = 12 D6 sem rank 138570 ncols
        174033; n = 12 D5 sem rank 28097 ncols 46709 nrows 31512 (EV-SIG-006,
        EV-SIG-008)
      variety: "|V_sem| = 6 at n = 9 by full 2^18 enumeration (EV-SIG-006 C5)"
    derived_inputs_to_be_recomputed_in_harness:
      hilbert_series: >-
        H(z) = (1+z)^{2n} / ((1+z^2)^n (1+z^3)^n), truncated-positive, per
        semireg_rank_pred in experiments/EXP-SIG-006/src/h013_f5_signatures.sage
      Q_model_D: "sum_{d <= D} HF_n(d)"
      targets_that_must_reproduce_exactly: >-
        HF_9 = [1, 18, 144, 645, 1566, 738]; freeze = 6/7/8/9 at n = 9/12/15/18;
        sr_pred = 180/1674/9504/28068 (n=9 D3..D6), 312/3834/29418/156520
        (n=12 D3..D6), 484520 (n=15 D6), 1216266 (n=18 D6);
        Q_model_5 = 3112/26037/103502/297823/706308 at n = 9/12/15/18/21;
        Q_model_6 = 3112/33531 at n = 9/12; nrows(12,6) = 183312;
        nrows(12,5) = 31512.
      provenance_of_targets: >-
        These target values were computed by the idea generator in this session
        OUTSIDE THE HARNESS (label: SESSION-COMPUTED) from the formula above and
        agree with every corresponding number in EV-SIG-006 and EV-SIG-008. They
        are listed here as REGRESSION TARGETS, not as results. A disagreement
        between the in-harness recomputation and this list is a stop condition,
        not a discrepancy to reconcile silently.
    seeds:
      instance_seeds: [1, 2, 3]
      planting_site_seeds: [1, 2, 3]
      seed_derivation_rule: >-
        Every random choice draws from a stream keyed by
        SHA-256("EXP-SIG-c9fda8|" + arm_label + "|" + str(n) + "|" + str(D) +
        "|" + str(seed_index)), taken as a little-endian integer and used to
        seed a counter-mode SHA-256 byte stream; the k-th 32-bit draw is bytes
        [4k, 4k+4) of SHA-256(key || k as 8-byte big-endian), rejection-sampled
        to the required range. arm_label is one of: sem, null_matched,
        planted_treatment, planted_duplicate, planted_rewritable,
        planted_scaling. This rule is stated so a third party reproduces every
        instance bit-for-bit without access to any prior artifact.
    environment_preconditions:
      measured_this_session: >-
        numpy 2.4.6 present; sympy, Sage, Singular, msolve ABSENT;
        `python3 -c "import sage"` raises ModuleNotFoundError;
        src/ic_first_fall_fast.py fails to import at `from sage.all import GF,
        Matrix`; `which sage singular msolve magma` returns nothing.
      consequence: >-
        Stages 0 and 1 require none of these and must run in any environment.
        Stages 2-4 require either a Sage-bearing environment or a bounded
        pure-Python/numpy GF(2) bitmask rank port. Which of those is used MUST be
        recorded in the run manifest. An unavailable dependency is
        failed_infrastructure and is NEVER negative mathematical evidence
        (AGENTS.md rule 5).

  stages_cheapest_first:
    - id: S0
      name: zero-compute consistency gate
      terminates_run: true
      description: >-
        Recompute the pinned series in-harness and reproduce every regression
        target listed above. Then compute lam_4(n) = (2n/3 + 1) / Q_model_4(n)
        at n = 12, 15, 18, 21, 24 from the ESTABLISHED closed form, with no new
        measurement of any kind, and fit its log-log slope. THIS STAGE CAN END
        THE EXPERIMENT: if lam_4 -- whose numerator is the one growth law this
        goal has proven, at six sizes with zero seed variance -- does not decay
        with slope <= -2.5, the leverage construction is wrong and nothing
        further is run.
      cost: seconds, no solver
    - id: S1
      name: committed-series evaluation and archive audit
      terminates_run: false
      description: >-
        Compute lam_5 at n = 9, 12, 15, 18 from the committed residuals; report
        every finite difference and the log-log slope. Tabulate each input
        beside its ledger record and its run-registration status, so a reader
        sees which inputs are receipt-backed (EV-SIG-005, EV-SIG-006) and which
        are quoted-only (EV-SIG-008). Carry BOTH the EV-SIG-002 and EV-SIG-004
        D4 series and adjudicate neither.
      cost: seconds, no solver
    - id: S2
      name: instrument sensitivity calibration (BLOCKING)
      terminates_run: true
      description: >-
        The planted-syzygy calibration of IDEA-20260805-8a68d3, run at
        (n = 9, D = 4) and (n = 12, D = 5) over k = 0, 1, 2, 4, 8, 16, with the
        duplicate arm and the rewritability arm first. THIS STAGE BLOCKS S3 AND
        S4: if the recovery slope is outside [0.90, 1.10] at either cell, no
        negative conclusion about leverage may be reported and the deliverable
        becomes the calibration finding.
      cost: 24 cells at sizes the goal already runs; the k=1 n=9 D4 cell is hand-checkable
    - id: S3
      name: the pre-registered cell
      terminates_run: false
      description: >-
        residual_5 at n = 21, 3 instance seeds, with its matched null arm,
        using the memory-safe staging built for EXP-SIG-007. Compare against the
        pre-registered dichotomy.
      cost: the lane's known memory-binding cell; checkpointed
    - id: S4
      name: denominator hardening
      terminates_run: false
      description: >-
        Enumerate |V_sem| at n = 12 (2^24 points) to replace the assumed value 6
        in the measured-Gap denominator, and report lam_D against the MEASURED
        Q_D beside the model Q_model_D at every cell where a rank exists.
      cost: bounded enumeration

  arms_and_controls:
    treatment: >-
      The frozen sem system at each (n, D) cell; residual_D computed by the
      pinned pipeline; lam_D formed against both Q_model_D and, where a rank
      exists, the measured Q_D.
    measured_null: >-
      The support-matched null at each tested (n, D <= 5) cell, which EV-SIG-005
      records as validating. FORCED VALUE, DERIVED BEFORE THE RUN AND ABLE TO
      FAIL: extra_5 = 0 and rank == sr_pred, hence lam_5^null = 0 EXACTLY at
      every n. Two distinct failure modes, both informative and both reported:
      a nonzero null extra (the support-matching confound EV-SIG-006 measured as
      369 at n = 9 D5 reappearing at n = 21) means the numerator is contaminated
      at that cell and the treatment arm may not be read there; a null extra that
      GROWS with n means the normalisation is measuring the null construction.
    positive_control_planted: >-
      REQUIRED AND BLOCKING. Systems carrying k F_2-independent adjoined
      non-rewritable relations, k = 1, 2, 4, 8, 16, independence verified by rank
      of the k bitmasks BEFORE the measurement. FORCED VALUE:
      residual_D(k) - residual_D(0) = k exactly, slope 1.00, band [0.90, 1.10],
      R^2 >= 0.98. If the instrument does not recover a planted family of known
      size, IT HAS NOT BEEN SHOWN CAPABLE OF MEASURING THE QUANTITY THIS GOAL
      REPORTS, and NO negative result from this contract may be reported.
    positive_control_duplicate_arm: >-
      The k = 0 arm implemented as k adjoined EXACT DUPLICATES of existing rows,
      holding the degree histogram fixed across the sweep. FORCED VALUE:
      residual_D unchanged from the committed baseline, and the k trivial
      syzygies absorbed entirely into K_D. Movement here means the pipeline
      responds to the histogram change rather than to planted structure and the
      whole sweep is confounded.
    rewritability_control: >-
      Plant k genuinely REWRITABLE relations (products of existing generators).
      FORCED VALUE: residual_D UNCHANGED, because a rewritable family belongs in
      K_D by definition. Movement means K_D fails to absorb rewritable families
      and every "non-rewritable" count in this goal is inflated. This arm and the
      treatment arm together bracket the instrument from both sides.
    nearby_object_where_conclusion_must_fail: >-
      A planted family sized to SCALE with the quotient (k proportional to
      Q_model_D at each n rather than constant). On this object lam_D must NOT
      decay. If lam_D decays here too, the statistic is measuring instance size
      rather than structure and no leverage conclusion may be drawn. This is the
      method-ceiling control from H-SIG-e7ff26's proof_search_map and it is
      required.
    graded_control: >-
      Two graded axes, each with >= 3 interior points, both reporting
      monotonicity rather than only endpoints. AXIS 1 (size): n = 9, 12, 15, 18,
      21 at D = 5 -- report the sign of every consecutive difference of lam_5.
      AXIS 2 (planting): k = 1, 2, 4, 8 -- report every consecutive difference of
      residual_D, so a detection CEILING (linear then flat) is visible rather
      than averaged into a slope.
    ordering_control: >-
      The null arm, the duplicate arm and the rewritability arm are computed,
      recorded and hash-committed BEFORE any treatment number at the same cell is
      read. The decision rule is frozen in this contract and is executed on the
      null arm first; if it emits the same label on the null and the treatment,
      the rule discriminates nothing and must be rewritten before the treatment
      is read.
    comparability_policy: >-
      Cross-cell comparison is permitted ONLY between cells produced by the same
      instrument version and the same reduction path. EV-SIG-008 records a
      reimplementation drift (A4_5 = 242 against the recorded 444) that a shared
      seed did not prevent; a shared seed does not imply instrument, stream or
      output equivalence. Any comparison to EXP-SIG-002/003/005/006/007/008
      numbers must cite the reduction path (pinned early-break vs canonical
      full_reduce) recorded for each, and where two committed series disagree
      (EV-SIG-002 vs EV-SIG-004 on the D4 axis) BOTH are reported and NEITHER is
      picked (AGENTS.md knowledge-retrieval policy item 7).

  independent_variables: [n, D, k (planted family size), arm]

  metrics:
    primary:
      - "lam_5(n) = residual_5(n) / Q_model_5(n) at n = 9, 12, 15, 18, 21"
      - "sign of every finite difference of lam_5 across the size ladder"
      - "log-log slope of lam_5 against n, with residuals"
      - "recovery slope d(residual_D)/dk on the planted arm at both calibration cells"
    secondary:
      - "lam_4(n) from the closed form, zero compute"
      - "lam_D against the MEASURED Q_D wherever a rank exists"
      - "extra_D / Q_model_D beside residual_D / Q_model_D"
      - "null-arm extra_5 per size"
      - "rank(K_D) planted vs unplanted against the pre-derived expected change"
      - "|V_sem| at n = 12"
      - "Q_model_D / ncols_full(D) ratio table (HEUR-LEV-2 validation), zero compute"
      - "wall clock, peak RSS and checkpoint count per cell"

  heuristic_under_test: HEUR-LEV-1

  preregistered_prediction:
    quantity: "residual_5 at n = 21, and hence lam_5(21)"
    formula: >-
      Q_model_5(21) = 706308 (SESSION-COMPUTED from the pinned series; to be
      reproduced in S0). NON-OPERATIVE side: lam_5(21) < 0.00327, i.e.
      residual_5(21) < 2311 = 974 * 706308 / 297823. OPERATIVE side:
      residual_5(21) >= 2311. POINT PREDICTION from the four-point geometric law
      (ratios 3.278 / 3.014 / 3.421, geometric mean 3.233): lam_5(21) = 0.00101,
      residual_5(21) = 714, BAND 400 to 1400 to absorb the non-monotonicity
      already recorded at n = 18.
    source: >-
      H-SIG-e7ff26 mechanism and HEUR-LEV-1/HEUR-LEV-2; numerators quoted from
      EV-SIG-005, denominators from the pinned series in
      experiments/EXP-SIG-006/src/h013_f5_signatures.sage. FIXED BEFORE
      EXECUTION AND NEVER TUNED TO THE DATA.

  scale_relevance:
    tier: toy
    justification: >-
      Conclusions transfer across the tested lattice only. The DENOMINATOR's
      growth law Q_model_D = Theta(n^D) is a property of the series and does
      extend, but the NUMERATOR's growth law is measured at five sizes and its
      extension is HEUR-LEV-1, explicitly a heuristic. The stated limit: nothing
      here supports a statement at n > 24, at D > 5, at any degree at or above
      the freeze degree, on any curve family outside the frozen instance family,
      or over any field other than GF(2).
    correspondence: null

  tail_checks:
    - >-
      Sanity identities at every measured cell: kernel_D = nrows_D - rank_D;
      extra_D = kernel_D - rank(K_D); extra_D - deficit_D equal to the rankK
      shortfall against nrows - sr_pred; residual_D >= 0.
    - >-
      Determinism: one cell per size re-run under an identical seed and compared
      field by field.
    - >-
      Extreme-value check on the planted sweep: the largest k must still lie on
      the fitted line, not merely the mean; a saturation at large k is reported
      explicitly rather than absorbed into the slope.

  replication:
    seeds: [1, 2, 3]
    independent_instances: 3

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 24
    maximum_memory_gb: 24
    maximum_runs: 40

  stopping_rules:
    - S0 failing to reproduce any regression target: STOP, report a reproduction failure.
    - "S0's lam_4 slope > -2.5: STOP, the construction is refuted at zero compute."
    - "S2 recovery slope outside [0.90, 1.10] at either cell: STOP S3/S4; the calibration finding is the deliverable."
    - The duplicate arm or the rewritability arm moving residual_D: STOP, the sweep is confounded.
    - Peak RSS exceeding 24 GB or a cell exceeding 3600 s: checkpoint, report as infrastructure, do not retry blind.
    - Total runs reaching 40: stop and report what was completed.

  invalidation_rules:
    - >-
      Any cell whose instrument version or reduction path differs from the one
      recorded for the cells it is compared against is INVALID for comparison and
      is reported separately.
    - >-
      Any treatment number read before its cell's null, duplicate and
      rewritability arms are hash-committed invalidates that cell.
    - >-
      A run whose seed derivation deviates from the stated rule is invalid.
    - >-
      A timeout, crash, out-of-memory, missing dependency or absent solver is
      recorded as failed_infrastructure and is NEVER evidence for or against
      H-SIG-e7ff26 (AGENTS.md rule 5). In particular, the absence of Sage in the
      execution environment is an infrastructure signal and an implementation
      request, not a result.

  success_criterion: >-
    S0 reproduces every regression target AND S2's recovery slope lies in
    [0.90, 1.10] at both calibration cells with R^2 >= 0.98 AND the duplicate and
    rewritability arms are flat AND the n = 21 null arm validates (extra_5 = 0)
    AND residual_5(21) is measured on >= 3 seeds. Under those conditions the run
    yields a decidable answer on the pre-registered dichotomy, whichever side it
    falls. NOTE: "success" here means the experiment produced an interpretable
    measurement, NOT that the hypothesis was confirmed. Both sides of the
    dichotomy are successful outcomes.

  falsification_criterion: >-
    H-SIG-e7ff26 is falsified by any of: residual_5(21) >= 2311 at a
    null-validated cell; lam_4 failing to decay in S0; any non-negative finite
    difference in lam_5 not explained by a null-arm failure at the same cell; or
    the scaling-planted nearby-object control also reading as decaying.

  outcomes_and_their_dispositions:
    - condition: "residual_5(21) < 2311 and all controls pass"
      disposition: >-
        Evidence supporting H-SIG-e7ff26 at toy tier, scoped to the tested
        lattice. It does NOT close GOAL-SIG-001 and does NOT weaken H-SIG-001;
        the Coordinator alone decides what it means for the goal's completion
        criterion, and any decision must carry the forward guidance in
        H-SIG-e7ff26's interpretation_limits (diagonal cells, CM panel, Yokoyama
        arm).
    - condition: "residual_5(21) >= 2311"
      disposition: >-
        H-SIG-e7ff26 falsified. The cascade is keeping pace with the quotient at
        that cell and the operative question reopens with a measured lower bound
        -- the most valuable single outcome available from this contract.
    - condition: "S2 calibration fails"
      disposition: >-
        The deliverable is the calibration finding. Every committed residual in
        GOAL-SIG-001 requires a stated correction factor and no negative
        conclusion may be drawn from this contract. This outcome bears on eight
        experiments and is reported as such, not as a footnote.
    - condition: infrastructure exhaustion at S3
      disposition: >-
        failed_infrastructure. The S0-S2 results stand on their own and the n=21
        cell is re-queued. Never reported as evidence about the cascade.

  required_artifacts:
    - the recomputed Hilbert series and every regression target, with the code path and its hash
    - the lam table with numerator, denominator, provenance and run-registration status per cell
    - all finite differences and the log-log fit with residuals, per axis
    - null, duplicate and rewritability arm results with their pre-commit hashes and timestamps
    - the k=1 planted syzygy exhibited as a row-index vector with its substitution check
    - the planted sweep raw table (k, residual_D, rank(K_D)) per seed, unaggregated
    - "|V_sem| enumeration output at n = 12"
    - exact commands, git commit and dirty-tree state, dependency versions, seeds, peak RSS, wall clock
    - resolved model policy, backend, model identifier and probe-verification status per AGENTS.md artifact policy
    - a statement of which execution environment provided the GF(2) rank (Sage or ported)

  approval_requirements:
    - Coordinator approval is required before any execution (AGENTS.md rule 1).
    - >-
      S2 must be reviewed as a control design before S3 is authorized, because
      S2 blocks the interpretation of everything downstream.
    - >-
      No evidence record may be written from this contract until it carries
      status: approved and a run receipt; it is currently review_required with no
      approved_by field, and citing an unapproved contract is against the
      corpus's own rule.

  assigned_to: executor
