experiment:
  id: EXP-MLKEM-9fc13b
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-MLKEM-cad0a5
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-001
  batch_id: null
  assigned_to: executor
  title: >-
    Review-required contract: zero-compute consistency gates on the archived
    isometric-MLWE cost gap, plus the same-arm repeat study that would give the
    campaign's only structure-dependent number its first matched null

  objective: >-
    If separately approved, frozen and authorized, decide whether the quantity
    the corpus records as "the maximum matched isometry gain is 0.8 bit" is
    separated from the run-to-run randomization of the code that produced it.
    Stage 1 evaluates two consistency gates by exact decimal arithmetic on
    numbers already committed in this repository and can end the line at zero
    compute. Stage 2, if and only if an arm is obtainable, measures the same-arm
    spread sigma_null with a planted positive control and a four-level graded
    control. This contract is a pre-execution declaration; no run has happened
    and no number below is an observation of this experiment.

  what_this_is_not:
    - Not an attack, not a solve, not a key recovery, and not a certificate.
    - Not a claim that the isometry gain is zero; the strongest available negative is that the corpus does not resolve it below sigma_null bits.
    - Not a claim that any external paper, estimator, or author is wrong. It audits a difference of two archived numbers and the resolution of that difference.
    - Not a revision of any ML-KEM security estimate, and not a statement about MLWE hardness.
    - Not a status change to EV-MLKEM-001, EV-MLKEM-002, IDEA-20260722-001, DEC-20260724-019 or GOAL-MLKEM-001; any correction is a new superseding record.
    - Not an approval, a freezing, an execution authorization, a run, an observation, or evidence.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Stage 1 is DERIVATION tier: it can support, at most, that the nine
      archived differences take the frozen values, that the rank-invariance ratio
      exceeds the frozen threshold at two labels, and that a nonzero CN gap
      coexists with an exactly-zero C0 gap at two parameter sets. Stage 2 is TOY
      tier and, if the arm is a surrogate, it is toy tier ABOUT THE SURROGATE:
      it can support at most that estimator pipelines of the surrogate's shape do
      or do not carry randomization spread of a stated magnitude. NO OUTCOME MAY
      BE QUOTED as a measurement of the external code, as a security-relevant
      magnitude, or as evidence about ML-KEM's ring structure.

  inputs:
    archived_figures:
      source_path: coordination/goals/GOAL-MLKEM-001/batches/BATCH-002/tasks/TASK-20260722-206/cost_baseline_report.yaml
      source_status: >-
        READ THIS SESSION. An in-repo archived task artifact of GOAL-MLKEM-001
        BATCH-002, written 2026-07-22 by a different runtime. The external work
        it relays -- Ogilvie, Hou-Jiang, Carrier, MATZOV, Wu-Xu, source ids
        S08/S09/R01/R02 -- IS NOT READ AND IS RELAYED. No page, theorem, table or
        figure number from any external source is asserted in this contract.
      unstructured_LWE:
        C0: {ML-KEM-512: 121.8739039065, ML-KEM-768: 173.0147334810, ML-KEM-1024: 237.4610475866}
        CC: {ML-KEM-512: 139.3027469708, ML-KEM-768: 194.7388243958, ML-KEM-1024: 259.6029042249}
        CN: {ML-KEM-512: 134.7524036216, ML-KEM-768: 189.4790954189, ML-KEM-1024: 254.1848102613}
      isometric_MLWE:
        C0: {ML-KEM-512: 121.8739039065, ML-KEM-768: 173.0147334810, ML-KEM-1024: 237.3688668105}
        CC: {ML-KEM-512: 139.1190879063, ML-KEM-768: 194.7194941097, ML-KEM-1024: 258.9961181565}
        CN: {ML-KEM-512: 134.5237207556, ML-KEM-768: 188.7412506867, ML-KEM-1024: 254.0576918916}
      archive_caveat_quoted: >-
        "Output files contain repeated optimizer results and randomized
        polar-code data without recorded seeds. The rounded Hou--Jiang table is
        the stable publication claim; raw precision is not treated as
        reproducible accuracy."
    frozen_derived_differences:
      note: >-
        Computed this session from the figures above and FROZEN AS PART OF THE
        CONTRACT. Stage 1 must reproduce them exactly; a mismatch is
        invalid_measurement.
      C0: {ML-KEM-512: 0.0000000000, ML-KEM-768: 0.0000000000, ML-KEM-1024: 0.0921807761}
      CC: {ML-KEM-512: 0.1836590645, ML-KEM-768: 0.0193302861, ML-KEM-1024: 0.6067860684}
      CN: {ML-KEM-512: 0.2286828660, ML-KEM-768: 0.7378447322, ML-KEM-1024: 0.1271183697}
    frozen_thresholds:
      G1_rank_invariance_max_over_min: 2.0
      G1_excluded_label: >-
        C0 is EXCLUDED from G1 because two of its three gaps are exactly zero and
        the ratio is undefined. This exclusion is declared here, before
        evaluation, and is not a choice made after seeing a result.
      G2_forced_gap_where_C0_gap_is_zero: 0.0
      G3a_sigma_null_C0_forced: 0.0
      G3b_noise_branch_bits: 0.30
      G3b_resolved_branch_bits: 0.10
      G3b_indeterminate_interval: "[0.10, 0.30)"
      positive_control_minimum_detected_gain_bits: 0.50
    module_ranks:
      ML-KEM-512: 2
      ML-KEM-768: 3
      ML-KEM-1024: 4
    isometry_group_order: 512
    stage2_arm_preference_order:
      - id: ARM-A
        description: the external pinned repositories named by the archive's source ids
        status: >-
          Retrievability UNKNOWN to this contract. Must be attempted and the
          outcome recorded with the endpoint tried and the status code received.
      - id: ARM-B
        description: >-
          the in-repo sage-free lattice-estimator harness (tools/sage_free_estimator)
          with lattice-estimator pinned at 3e48ef421ec256afddb3e7d2249a77eab6e9ba12
        status: >-
          SURROGATE. A different optimizer. Its measurement bounds nothing about
          the code that produced the archived figures, and every sentence citing
          it must carry that clause. Its known-answer control MUST be executed in
          this run with delta exactly 0 and its stdout archived verbatim; the
          harness README's own transcript is NOT a passed control.
      - id: ARM-NONE
        description: neither obtainable
        status: >-
          INFRASTRUCTURE OUTCOME. Stage 1 is reported alone with the retrieval
          log; NEVER reported as evidence about ML-KEM or about the gap.
    seeds:
      master_seed: 20260805
      domain: "EXP-MLKEM-9fc13b/v1"
      seed_derivation_rule: >-
        ASCII bytes of domain || "|" || arm_id || "|" || label || "|" ||
        decimal(repeat_index), hashed with SHA-256; the digest's leading 8 bytes
        interpreted big-endian unsigned give the repeat's randomization seed
        where the arm accepts one. Labels are exactly one of
        {"same-arm", "planted", "graded"}. WHERE AN ARM ACCEPTS NO SEED -- which
        is the archived code's recorded condition -- the repeat index and the
        exact invocation are recorded instead, and the absence of seed control is
        reported as a property of the arm, not worked around.

  arms_and_controls:
    treatment: >-
      The archived isometric-versus-unstructured comparison, evaluated at stage 1
      by exact arithmetic and, at stage 2, re-run on the obtained arm if the
      isometry feature can be toggled there.
    measured_null: >-
      NULL-SAME-ARM. At least 10 repeats of ONE arm with only the unrecorded
      randomization varying and every other input identical. FORCED VALUES
      DERIVED BEFORE THE RUN: sigma_null(C0) = 0.0 exactly, because C0 is a
      deterministic function of the interior parameters under HEUR-ISO-2; and
      sigma_null(CN) either < 0.10 bit (resolved branch) or >= 0.30 bit (noise
      branch). BOTH BRANCHES ARE PRE-DECLARED USABLE AND THE NULL CAN FAIL IN
      EITHER DIRECTION.
    positive_control: >-
      PLANTED-GAIN. An arm in which the usable sample budget is doubled by a
      change that is NOT the isometry, forcing a gain of order one bit. It MUST
      register at least 0.50 bit. IF IT DOES NOT, the instrument cannot resolve
      effects of the size under discussion and NO NEGATIVE RESULT MAY BE REPORTED
      FROM ANY ARM. This is the sensitivity demonstration required by
      KN-TECH-1a5b7e, and it is the demonstration the corpus-wide census says
      most evidence records lack.
    graded_control: >-
      Four interior points, monotonicity reported: sample-budget multipliers
      1.00x, 1.25x, 1.50x, 2.00x. The measured gain must be monotone
      non-decreasing across the four levels, and the 1.00x cell must return a
      gain indistinguishable from 0 within sigma_null -- a self-null that
      localises a defect instead of leaving "the measurement was noisy".
    ordering_control: >-
      NULL-SAME-ARM and PLANTED-GAIN are measured and hash-committed BEFORE any
      isometry comparison is looked at in stage 2, and the frozen decision rule is
      executed on the null first. If the rule emits the same verdict on the null
      as on the treatment it discriminates nothing and must be rewritten before
      the treatment is read. Absence of the pre-treatment commitment is
      invalid_measurement.
    comparability_policy: >-
      The archive's own cost_model_legend FORBIDS subtraction across labels
      ("not comparable to CC, CN, RAM, memory-routing, quantum-query, or
      physical figures"), and this contract obeys it: every difference is taken
      WITHIN one label, and no minimum is ever taken across labels. A surrogate
      arm's numbers may never be differenced against an archived figure. A shared
      parameter name does not imply a shared quantity.

  stages_cheapest_first:
    - id: stage-0-provenance
      cost: "zero compute, ~1 h"
      content: >-
        Settle the two assumptions: (a) are C0, CC and CN three costings of one
        optimizer run or three independent optimizations, established from code
        rather than from the legend; (b) do the two arms differ only in the
        isometry feature. Record which external attributions could be retrieved,
        with the endpoint tried and the status code received for each.
      can_terminate_run: true
      termination_rule: >-
        If (a) resolves to independent optimizations, gate G2 is WITHDRAWN here,
        before evaluation, and the package continues on G1 and G3 in an
        explicitly weakened form.
    - id: stage-1-arithmetic
      cost: "zero compute, minutes"
      content: >-
        Reproduce the nine differences to ten decimal places; evaluate G1 and
        G2 against the frozen thresholds; emit the gate table.
      can_terminate_run: true
      termination_rule: >-
        A failure to reproduce the frozen differences invalidates the package
        immediately. THIS IS THE CHEAPEST DECISIVE GATE AND IT RUNS FIRST AFTER
        PROVENANCE.
    - id: stage-2-null
      cost: "hours, network required"
      content: >-
        Obtain an arm in the declared preference order; run its known-answer
        control if it is ARM-B; measure NULL-SAME-ARM, PLANTED-GAIN, and the
        graded control; evaluate G3.
      can_terminate_run: false
      termination_rule: >-
        Inability to obtain any arm is an INFRASTRUCTURE OUTCOME. The package
        reports stages 0-1, names sigma_null as the missing number, and states
        what obtaining it would cost.

  metrics:
    primary:
      - "G1 rank-invariance ratio max_k Delta(L,k) / min_k Delta(L,k) at L in {CC, CN}."
      - "G2 label consistency: |Delta(CN, set)| and |Delta(CC, set)| at the parameter sets where Delta(C0, set) = 0.0000000000."
      - "G3a sigma_null(C0): same-arm spread of C0 over >= 10 repeats."
      - "G3b sigma_null(CC) and sigma_null(CN): same-arm spread over the same repeats."
    secondary:
      - "PLANTED-GAIN measured gain in bits, per parameter set."
      - "graded control gain at each of the four multipliers, with the monotonicity verdict."
      - "retrieval log: endpoint, status code and outcome per external attribution attempted."
      - "arm identity: ARM-A, ARM-B or ARM-NONE, with the commit or version pinned."
      - "known-answer control stdout verbatim, with its delta, if ARM-B is used."

  heuristic_under_test: HEUR-ISO-2

  preregistered_prediction:
    quantity: >-
      (i) the nine differences; (ii) G1 ratios at CC and CN; (iii) G2 values at
      the two zero-C0 parameter sets; (iv) sigma_null(C0); (v) the branch of
      sigma_null(CN).
    formula: >-
      (i) exactly the frozen_derived_differences above, to ten decimal places.
      (ii) CC: 0.6067860684 / 0.0193302861 = 31.39...; CN: 0.7378447322 /
      0.1271183697 = 5.80...; both above the frozen threshold 2.0.
      (iii) 0.2286828660 at ML-KEM-512 and 0.7378447322 at ML-KEM-768 for CN,
      against a forced value of 0.0.
      (iv) exactly 0.0, forced by HEUR-ISO-2.
      (v) NOT PREDICTED AS A VALUE -- the frozen decision rule is the prediction:
      >= 0.30 bit at any parameter set is the noise branch that H-MLKEM-cad0a5
      asserts; < 0.10 bit everywhere refutes it; [0.10, 0.30) is indeterminate at
      this repeat count and may not be resolved by choosing a side afterwards.
    source: >-
      (i)-(iii) are exact decimal arithmetic on figures committed in this
      repository, computed this session. (iv) follows from HEUR-ISO-2 as stated
      in H-MLKEM-cad0a5. The rank-invariance threshold in (ii) rests on the
      exact group-order computation in H-MLKEM-cad0a5 mechanism section B
      together with HEUR-ISO-1, whose threshold 2.0 is declared a judgement and
      not a derived constant. NO EXTERNAL SOURCE IS CITED FOR ANY OF THIS.

  scale_relevance:
    tier: toy
    justification: >-
      Stage 1 is arithmetic on committed numbers and carries no scale at all: it
      is a consistency check of a record, and its conclusions are about that
      record. Stage 2 measures an estimator's reproducibility, which is a
      property of software rather than of a lattice, and if the arm is a
      surrogate it is a property of DIFFERENT software. The FIPS 203 parameter
      names appearing throughout denote which archived row is being audited and
      MUST NOT be read as crypto-scale validation of anything: no lattice is
      reduced, no instance is solved, and no secret exists anywhere in this
      contract.
    correspondence: null

  tail_checks:
    - >-
      Exactness check on the zeros: verify that the C0 agreement at ML-KEM-512
      and ML-KEM-768 is exact at all ten recorded places and is not the result of
      truncation in the archive. If the archive's precision is lower than ten
      places anywhere, G2's premise weakens and that must be reported before the
      gate verdict.
    - >-
      Rounding cross-check: confirm that rounding the raw decimals to one place
      reproduces the published rounded table the archive calls the stable claim
      (C0 121.9/173.0/237.4, CC 139.1/194.7/259.0, CN 134.5/188.7/254.1 for the
      isometric arm). A failure here means the raw file and the rounded table are
      not the same computation, which is itself a reportable finding.
    - >-
      Extreme-repeat check in stage 2: report the full min and max of each label
      across repeats, not only the standard deviation, so that a single outlying
      repeat cannot hide inside a summary statistic.

  replication:
    seeds: [20260805, 20260806, 20260807]
    independent_instances: 3
    interpretation: >-
      Stage 1 is deterministic and must be bit-identical across all three
      replications; any variation is an implementation defect. Stage 2's repeat
      count is at least 10 per arm per parameter set, and the three listed seeds
      index independent repeat BLOCKS so that block-to-block variation is
      separable from within-block variation. One block alone is not a replication.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3
    maximum_memory_gb: 8
    maximum_runs: 3
    maximum_workers: 1
    no_network_stages_0_1: false
    network_required_stage_2: true
    note: >-
      Stage 0 needs network only to attempt external retrieval; its failure is
      recorded and does not block stage 1, which needs nothing.

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived, and authorized under a successor goal; GOAL-MLKEM-001 is closed at budget and authorizes nothing.
    - Stop before reading any stage-2 treatment number if NULL-SAME-ARM and PLANTED-GAIN are not committed with their digests.
    - Stop the whole package if stage 1 cannot reproduce the frozen differences.
    - Stop stage 2 if ARM-B is used and its known-answer control does not reproduce its reference values with delta exactly 0.
    - Stop and report at the first budget or wall-clock ceiling, recording what was covered.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any change to a frozen threshold, the decision rule, or the label exclusions after any number has been observed.
    - Any difference taken across cost labels, or any minimum taken across labels.
    - Any surrogate-arm number differenced against an archived figure.
    - Any citation of a surrogate measurement without the surrogacy clause attached in the same sentence.
    - Any report of a stage-2 negative without the PLANTED-GAIN control having fired at >= 0.50 bit.
    - Any use of the sage-free harness README's transcript in place of a control executed in this run.
    - Absence of the retrieval log, or a retrieval outcome recorded without its endpoint and status code.

  success_criterion: >-
    This contract has no current success outcome because it is not authorized for
    execution. IF a separately approved, frozen successor is executed, its only
    positive disposition is: stage 0 records the provenance findings and the
    retrieval log; stage 1 reproduces the nine frozen differences to ten decimal
    places and emits the G1 and G2 verdicts against the pre-declared thresholds;
    and EITHER stage 2 delivers sigma_null per label per parameter set with the
    PLANTED-GAIN control having fired and the graded control monotone, OR stage 2
    records an infrastructure outcome naming sigma_null as the missing number.
    THAT DISPOSITION ESTABLISHES NO ATTACK, NO SECURITY CLAIM, NO REVISION OF ANY
    PUBLISHED FIGURE, AND NO STATEMENT ABOUT MLWE HARDNESS.

  falsification_criterion: >-
    H-MLKEM-cad0a5 is falsified, in whole or in the named part, by any of:
    (F1) stage 1 failing to reproduce the frozen differences -- the record is
    arithmetically wrong and is withdrawn by supersession;
    (F2) stage 0 establishing that C0, CC and CN are independently optimized --
    HEUR-ISO-2 fails and G2 is withdrawn;
    (F3) sigma_null(C0) measured nonzero -- HEUR-ISO-2 fails from the data side;
    (F4) sigma_null(CN) < 0.10 bit at every parameter set WITH the PLANTED-GAIN
    control firing -- the gap is resolved at the 0.1-bit level, the hypothesis is
    refuted, and the corpus gains its first controlled measurement of the
    isometry gain, which is a strictly better outcome for the program than the
    one the hypothesis predicts and must be reported with equal emphasis;
    (F5) a reviewer exhibiting a mechanism that makes the gain legitimately
    rank-dependent by 5.8x -- HEUR-ISO-1 fails and G1 is withdrawn.
    A failure of PLANTED-GAIN is NOT a falsification of anything; it is an
    instrument failure that forbids reporting any negative.

  outcomes:
    no_execution_authorization: >-
      The only current disposition: a review_required draft. No run, no
      observation, no evidence, no inference.
    future_complete_readout: >-
      Only after separate approval, freezing, authorization, and valid execution
      under a successor goal; scoped as declared and never an ML-KEM security
      claim.
    infrastructure_or_integrity_failure: >-
      A timeout, crash, 403 from a source endpoint, unavailable repository,
      absent network, or missing dependency is recorded as INFRASTRUCTURE SIGNAL
      and is NEVER negative mathematical evidence against H-MLKEM-cad0a5, against
      any external work, or against any ML-KEM proposition (AGENTS.md rule 5).
      Specifically: inability to obtain ARM-A leaves the historical code
      unmeasured, and the package must say so rather than substitute a surrogate
      silently.

  required_artifacts_if_later_authorized:
    - Frozen approved specification with a freeze receipt binding its SHA-256.
    - Stage-0 provenance note: the code-reading finding on label independence, the arm-matching finding, and the full retrieval log with endpoints and status codes.
    - Stage-1 gate table: the nine recomputed differences to ten places, the G1 ratios, the G2 values, and each verdict against its frozen threshold.
    - Pre-treatment commitment digests for NULL-SAME-ARM and PLANTED-GAIN.
    - Raw per-repeat records: (arm id, label, parameter set, repeat index, seed or exact invocation, C0, CC, CN), one JSON object per line, keys sorted, UTF-8.
    - Graded-control table at the four multipliers with the monotonicity verdict.
    - If ARM-B: the known-answer control's verbatim stdout with its delta, and the estimator commit.
    - Manifest, environment, exact argv, stdout, stderr, timestamps, and resource measurements.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - Independent review confirms that the frozen thresholds, the label exclusion, and the two-branch decision rule were fixed before any evaluation and cannot be tuned afterwards.
    - Independent review confirms that NULL-SAME-ARM can fail in both directions and that PLANTED-GAIN can fail at all.
    - Independent review confirms the contract nowhere asserts a claim about an unread external paper.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
    - A successor goal record exists; GOAL-MLKEM-001 is closed at budget and authorizes nothing.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved and only the Coordinator may approve it (AGENTS.md rule 1).
