experiment:
  id: EXP-ICINV-9a9402
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-0a3272
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'A CANDIDATE FUNCTIONAL WITH A CLASS-VARYING CAUSE THE DECOMPOSITION''S T4 LIST OMITS: the
    GROUP STRUCTURE of E(F_p) varies inside an isogeny class even though its ORDER does not, so the
    number of roots of x^3 + ax + b in F_p is 1 on some class members and 3 on others; that integer
    is gauge-invariant, it changes the ramification of the x-map and the non-transversality of the
    Semaev ideal, and it is the one candidate cause of within-class variance whose minimiser is LOCALLY
    DETECTABLE and therefore passes the T5 reachability gate'
  status: draft
  objective: "(A) THE OMISSION BEING REPAIRED. DECOMPOSITION.md T4 lists what a fixed F_p-isogeny\
    \ class fixes (t, p, N, #E(F_p), embedding degree, K, D, whether j = 0 or 1728 occurs) and what\
    \ varies inside it (j, the isomorphism class of (a, b), volcano level, h(End(E))). The list of\
    \ what varies is INCOMPLETE in a way that matters for this lane: the GROUP STRUCTURE of E(F_p)\
    \ also varies. For ordinary E with End_{F_p}(E) = O, Lenstra's theorem gives E(F_p) ~= O/(pi -\
    \ 1) as O-modules [citation to be re-verified: H. W. Lenstra Jr., \"Complex multiplication structure\
    \ of elliptic curves\", J. Number Theory 56 (1996)]. The ORDER #E(F_p) = p + 1 - t is a class\
    \ invariant by Tate; the DECOMPOSITION Z/n_1 x Z/n_2 with n_1 | n_2 is not, because it is computed\
    \ from O, and O varies with the volcano level. So within one class there are, in general, members\
    \ with cyclic 2-part and members with full rational 2-torsion.\n(B) WHY THAT IS A CURVE-EQUATION\
    \ FUNCTIONAL AND NOT A FUNCTION OF (p, N, t). #E[2](F_p) = 1 + #{x in F_p : x^3 + a x + b = 0},\
    \ and for a non-singular curve the root count r is 1 or 3, never 2. Hence\n    r(E) = 3  <=> \
    \ E[2] subset E(F_p)  <=>  4 | #E(F_p) and the 2-part is\n    non-cyclic,\nand r varies across\
    \ the 2-isogeny volcano of a single class whenever 2 divides the conductor of Z[pi] in O_K. THE\
    \ INTEGER r IS THEREFORE A FUNCTION OF THE CURVE AND NOT OF (p, N, t): two curves with identical\
    \ p, identical N, identical t and identical #E(F_p) can have r = 1 and r = 3 respectively. Crucially\
    \ r is ALSO GAUGE-INVARIANT: under (a, b) -> (u^4 a, u^6 b) the roots go to u^2 times the roots,\
    \ so r is unchanged. This is the rare combination the lane needs -- a quantity that the class\
    \ does not fix and that equation choice cannot move.\n(C) THE MECHANISM CONNECTING r TO ALGEBRAIC\
    \ ATTACK COST. Two independent routes, both concrete:\n  (C1) RAMIFICATION OF THE x-MAP. The degree-2\
    \ map x : E -> P^1 ramifies\n    exactly over the roots of f and over infinity. A factor base\
    \ V of\n    x-coordinates contains r points with a SINGLE preimage (y = 0) and\n    |V| - r points\
    \ with two. Relation counting, sign handling and the\n    negation symmetry that Semaev systems\
    \ exploit (KN-TECH-002, KN-LIT-004)\n    all treat those points differently.\n  (C2) NON-TRANSVERSALITY\
    \ OF THE SEMAEV IDEAL. The relation locus\n    C_R : S_3(x1, x2, x(R)) = 0 meets the vertical\
    \ line x1 = v\n    non-transversally exactly when the quadratic S_3(v, ., x(R)) in x2 has a\n\
    \    double root, i.e. when its discriminant vanishes; by the classical\n    identity disc_{x2}\
    \ S_3 = 16 f(x1) f(x3) [to be re-derived symbolically,\n    not quoted], that happens exactly\
    \ when f(v) = 0. SO THE IDEAL\n    <S_3, f_V(x1), f_V(x2)> FAILS TO BE RADICAL PRECISELY AT FACTOR-BASE\n\
    \    ELEMENTS THAT ARE 2-TORSION x-COORDINATES, and the number of such\n    elements is a draw\
    \ from a population of size r. Non-radicality inflates\n    the Groebner staircase, which is what\
    \ a solving-degree proxy measures.\n  Both routes predict the SAME stratification and predict\
    \ it to be\n  TWO-LEVEL (r = 1 versus r = 3), not a continuum -- which is a strong,\n  falsifiable\
    \ shape prediction that noise does not produce.\n\n(D) WHAT THE TWO OUTCOMES MEAN, DECLARED BEFORE\
    \ THE RUN.\n  OUTCOME S (stratified): the solving-degree proxy differs between the\n    r = 1\
    \ and r = 3 strata of the SAME class by more than the gauge\n    interval. Then a genuine within-class\
    \ cost difference exists, its cause\n    is named and mechanistic rather than statistical, and\
    \ -- this is the\n    payoff -- IT IS LOCALLY DETECTABLE: an attacker at any vertex computes\n\
    \    r in O(log p) by factoring a cubic, so hill-climbing to the preferred\n    stratum along\
    \ the 2-volcano costs O(log p) steps. T5 IS PASSED. The\n    campaign would then have to ask only\
    \ whether the difference is a\n    constant or an exponent, and the honest prior is a constant.\n\
    \  OUTCOME F (flat): the proxy is indistinguishable across strata. Then the\n    one class-varying,\
    \ gauge-invariant, mechanistically motivated cause the\n    lane can name does not move the cost,\
    \ which is a much stronger negative\n    than \"we measured variance and found none\" -- it is\
    \ a negative against a\n    NAMED mechanism, which is the closure standard.\n  There is no outcome\
    \ in which the measurement means nothing.\n\n(E) SCOPE, STATED UP FRONT. r is about 2-torsion,\
    \ hence about the cofactor, hence NOT about G: N is a large prime and the ECDLP in G is untouched\
    \ by the 2-part. This record therefore claims nothing about the difficulty of the ECDLP; it claims\
    \ that a RELATION-COLLECTION cost proxy may be stratified by a class-varying invariant. Confusing\
    \ the two would be exactly the error H-ENDO-001 exists to prevent."
  resource_label: 'R5 (ell-torsion for ell != N as a Galois module: the rational 2-torsion is outside
    G entirely) + R2 (the curve equation, whose cubic''s factorisation type is the observable) + R1
    (x-coordinates as field elements, which is what the Semaev system reads).'
  admissibility: admissible
  admissibility_argument: 'The observable r is the number of F_p-roots of the defining cubic. It is
    invisible to any algorithm restricted to group operations on G: G has prime order N and contains
    no 2-torsion at all, so no sequence of additions, negations and equality tests inside G can produce
    r. The resource is R5, a torsion module at a prime different from N, which DECOMPOSITION.md section
    2 lists as outside G by construction, and KN-FIND-b7e091''s closed oracle classes (incidence,
    endomorphism-image) do not include it. H-ENDO-001 is not contradicted and not tested: every endomorphism
    still acts as a scalar on G, and nothing here applies one to a point of G.'
  reachability_gate: 'THIS IS THE ONE CANDIDATE IN L1 THAT PASSES T5 IF ITS EFFECT IS REAL, AND THAT
    IS THE REASON TO RANK IT ABOVE OTHER FUNCTIONALS. r is computable at any vertex in O(log^2 p)
    by factoring one cubic -- no isogeny graph, no class-group action, no global address. So goodness,
    if it exists, is LOCALLY DETECTABLE in the sense of DECOMPOSITION.md T5 route (R-local) of IDEA-20260807-c36472:
    an attacker walks 2-isogenies, reads r at each vertex, and stops at the preferred stratum after
    at most the 2-volcano height O(log p) steps, each step costing poly(log p). Transport of the instance
    costs the same walk (T1, with degree a power of 2, coprime to the odd prime N). TOTAL REACHABILITY
    COST: polylog(p), against a 0.886 sqrt(N) baseline -- negligible. THE GATE IS PASSED ON COST.
    What remains entirely open, and what this record does NOT claim, is whether the prize is anything
    more than a constant factor on one stage of one attack family; the pre-registered expectation
    is that it is not.'
  inputs:
    procedure: 'STAGE 0 (zero compute): re-derive disc_{x2} S_3 = 16 f(x1) f(x3) symbolically; verify
      r is gauge- and twist-invariant on >= 100 curves; re-verify or downgrade the Lenstra citation.
      A failure at this stage costs minutes and removes mechanism (C2) before any Groebner run. STAGE
      1 (~1 hour): enumerate complete classes at p ~ 2^13, compute r for every member, and confirm
      that BOTH strata occur inside at least one class -- which is the record''s existence precondition
      and could itself fail. If no class at reachable p has both strata, the record is scoped out
      at toy scale and that is reported as a scope limit, not as a negative. STAGE 2 (hours, BLOCKING):
      the single-stratum null class, run first. STAGE 3 (hours): the stratified measurement at random,
      excluded and loaded factor bases, >= 5 seeds per vertex, >= 8 gauge draws per member. STAGE
      4 (zero compute): apply the frozen rule; report the decay fit in B; record OUTCOME S or OUTCOME
      F with the reachability bookkeeping of Step 6.'
    mechanism: 'STEP 1 -- CLASS SELECTION ON A DECLARED CRITERION, BEFORE ANY MEASUREMENT. Enumerate
      complete classes at p in [2^12, 2^14] (as in IDEA-20260807-0ff796 Step 2), compute r for every
      member, and retain only classes that contain BOTH strata with at least 8 members each. Classes
      with a single stratum are retained separately as the NULL CLASSES of Step 5. This selection
      is on r alone and never on the cost proxy, which would be circular.

      STEP 2 -- MEASURE THE COST PROXIES. On each retained member, at a COMMON factor base and a TRANSPORTED
      target with a re-verified certificate, run harness/semaev.py measure_s3_decomposition and record:
      Groebner basis size, Groebner basis maximum total degree, wall time, and the trivial-ideal flag.
      All four are implementation-bound proxies, exactly as that module states, and none is reported
      as a degree of regularity. Repeat >= 5 times per vertex with different factor-base seeds so
      the WITHIN-vertex variance is known before any BETWEEN-vertex comparison is made.

      STEP 3 -- STRATIFIED CONTRAST WITH THE GAUGE INTERVAL. For each class, compare the r = 1 and
      r = 3 strata using the gauge interval of IDEA-20260807-6eb96b as the reference spread: >= 8
      gauge draws per member, the comparator reported as an interval, and the derived 2/n false-positive
      rate quoted beside every OUTSIDE verdict.

      STEP 4 -- THE MECHANISTIC SUB-MEASUREMENT, which distinguishes (C1) from (C2). Repeat Step 2
      twice more per vertex: once with a factor base that EXCLUDES every 2-torsion x-coordinate, and
      once with a factor base that DELIBERATELY INCLUDES all r of them. If the stratification is caused
      by (C2), it must VANISH in the exclusion arm and be AMPLIFIED in the inclusion arm. If it survives
      the exclusion arm, (C2) is not the cause and (C1) or something unnamed is. This is the step
      that converts a correlation into a mechanism, and without it the record may report only a correlation.

      STEP 5 -- THE NULL CLASSES. Run the identical pipeline on classes with a single stratum, splitting
      their members arbitrarily into two groups of the same sizes as the real strata. The rule MUST
      return no effect there. This is the null-first check and it is run BEFORE the real arm is read.

      STEP 6 -- REACHABILITY BOOKKEEPING. If OUTCOME S fires, record: the cost of computing r at a
      vertex (one cubic factorisation, O(log^2 p)); the number of 2-isogeny steps needed to move between
      strata (the 2-volcano height, O(1) to O(log p)); the size of the effect; and the resulting change,
      if any, in the total attack cost against 0.886 sqrt(N). The prediction recorded now is that
      the effect is a constant factor on the relation-collection stage only, hence baseline calibration
      by KN-TECH-018''s standard and NOT an exponent.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - single-stratum class with an arbitrary split (matched null) -- BLOCKING, run first
  - gauge orbit, >= 8 draws, reported as an interval
  - factor base excluding 2-torsion x-coordinates (mechanism arm)
  - factor base loaded with 2-torsion x-coordinates (mechanism arm)
  - within-vertex repeat measurements to establish solver noise first
  - transport certificate on every transported target
  - "NULL OBJECT (from the proposal): MANDATORY, THREE LAYERS, ALL BLOCKING. (1) MATCHED NULL: classes\
    \ with a TRIVIAL 2-volcano, whose members all share\n  one value of r, split arbitrarily into\
    \ two groups of the same sizes as the\n  real strata. Same p, same class structure, same measurement,\
    \ same group\n  sizes -- and no r contrast. The rule must return nothing. Run FIRST.\n(2) GAUGE\
    \ NULL: >= 8 gauge representatives per member. Because r is\n  gauge-INVARIANT, the gauge arm\
    \ cannot produce the stratification by\n  construction, which is exactly why it is the right spread\
    \ reference here\n  and not a mode-1 null for THIS contrast (it is a mode-1 null for r itself,\n\
    \  and the record says so).\n(3) DECAY PARAMETER: the factor-base size B. Mechanism (C2) predicts\
    \ the\n  effect DECAYS as r/B, because the stratification is driven by how many of\n  the B factor-base\
    \ elements are 2-torsion x-coordinates and there are at\n  most 3 of them in all of F_p. An effect\
    \ that does NOT decay as B grows is\n  not (C2) and is very likely an apparatus artifact -- this\
    \ is the canonical\n  artifact tell for this record and it is stated before the run.\n  FORCED\
    \ VALUE, DERIVED NOW: under (C2) with a uniformly random factor base,\n  the expected number of\
    \ 2-torsion elements in V is rB/p, which is BELOW 1\n  for every B and p in the toy range. So\
    \ (C2) predicts a SMALL effect unless\n  the factor base is deliberately loaded, which is precisely\
    \ why Step 4's\n  inclusion arm exists and why a large observed effect at random V would be\n\
    \  EVIDENCE AGAINST (C2) rather than for it."
  independent_variables: []
  metrics:
    primary:
    - r per class member, and the class's 2-volcano height
    - Groebner basis size, max total degree, wall time, trivial-ideal flag, per (vertex, seed, factor-base
      type)
    - within-vertex variance before any between-vertex contrast
    - gauge interval per member and its number of draws
    secondary:
    - the fitted B-decay exponent of the effect
    - the null-class verdict, reported before the real verdict
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Groebner basis maximum total degree (implementation-bound proxy) on the r = 3 stratum
      minus the same on the r = 1 stratum, within one class, at a DELIBERATELY 2-TORSION-LOADED factor
      base
    formula: At least 1 full degree, and outside the >= 8-draw gauge interval, in at least 2 of 3
      independent classes. Anything smaller is not resolvable against solver noise at this scale and
      is declared INCONCLUSIVE in advance so neither branch can be reached by rounding.
    source: pre-registered in IDEA-20260807-0a3272 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - SOLVER NOISE DOMINATING. sympy's Groebner routine is not an optimised F4 and its wall time varies
    substantially run to run. Within-vertex variance must be established first, and wall time must
    never be the primary metric.
  - r CORRELATES WITH VOLCANO LEVEL, which correlates with h(End(E)) and with the number of rational
    ell-isogenies. Any effect attributed to r could be an effect of level. The exclusion/inclusion
    arms of Step 4 are what separate them, because level does not change when the factor base is re-loaded
    but the (C2) mechanism does.
  - CLASS SELECTION. Selecting classes on r is legitimate; selecting them on the cost proxy is circular.
    The selection criterion is declared in Step 1 and frozen.
  - GAUGE LEAKAGE. Each member must be measured at a canonical gauge representative or averaged over
    draws; otherwise gauge variance enters the stratum contrast.
  - SMALL STRATA. At toy p a stratum may have under 8 members, in which case no interval-based verdict
    is admissible. Stratum sizes are reported beside every contrast.
  - MULTIPLE PROXIES. Four proxies are recorded; reporting the one that fires is forking. All four
    verdicts are reported and their rates are not multiplied.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: At least 1 full degree, and outside the >= 8-draw gauge interval, in at least
    2 of 3 independent classes. Anything smaller is not resolvable against solver noise at this scale
    and is declared INCONCLUSIVE in advance so neither branch can be reached by rounding.
  falsification_criterion:
  - No class at reachable p contains both strata. The record's precondition fails at toy scale; reported
    as a SCOPE limit with the largest p reached, never as evidence that r has no effect.
  - The symbolic identity disc_{x2} S_3 = 16 f(x1) f(x3) fails. Mechanism (C2) is withdrawn and Step
    4's arms lose their interpretation.
  - The single-stratum null class shows an effect. The rule fires on its own null; nothing is reported
    and measurement halts under P1.
  - The effect does not decay in B. Not (C2), probably apparatus; halt.
  - The contrast survives the 2-torsion-EXCLUDED factor base at full size. Then the named mechanism
    is wrong even if the correlation is real, and the honest report is "an unexplained within-class
    stratification by r", which is a weaker but still reportable observation and must not be dressed
    as mechanism (C2).
  - OUTCOME F (no stratification at any factor-base loading). The lane's one named, gauge-invariant,
    class-varying mechanistic cause does not move the cost proxy. This is the expected outcome and
    it is a NEGATIVE WITH A NAMED MECHANISM, which is the deliverable the closure standard asks for.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
