# EXP-ECDLP-6eb216
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-84fbf1.
experiment:
  id: EXP-ECDLP-6eb216
  hypothesis_id: H-ECDLP-fccebf
  source_idea: IDEA-20261004-30a53f
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 2097151
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-84fbf1
  objective: >-
    Check the counts 21, 20, and 20, the product 8400, and the nearby gap 0.
  inputs:
    bit_length: 21
    doublings: 20
    additions: 20
    length_gap: 1
    doubling_gap: 0
    digit_product: 8400
    digit_sum: 61
    nearby_a: 20
    nearby_b: 20
    nearby_gap: 0
    nearby_product: 400
  controls:
    - >-
      The bit length is 21. The doubling count is 20. The addition
      count is 20. Reporting the addition count as 21 drops the gap
      against the bit length and invalidates the run.
    - >-
      Twenty-one exceeds twenty by 1. Twenty equals twenty, so that gap
      is 0. The product of 21, 20, and 20 is 8400. Their sum is 61.
    - >-
      Two readings of the addition count are both 20. Their gap is
      0 and their product is 400.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 2097151 has bit length 21, 20 doublings, and 20
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 21. Count 20 doublings. Count 20 additions.
      Multiply 21, 20, and 20. Subtract 20 from 20.
    source: >-
      IDEA-20261004-30a53f states the counts 21, 20, and 20, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 8400 and the nearby gap 0 are required. A check that stops at the bit length 21 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 20 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 21.
    - The doubling count is not 20.
    - The addition count is not 20.
    - The product is not 8400.
    - The addition count is reported as 21, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 21, that the doubling
    count is 20, that the addition count is 20, and that the product
    of those three counts is 8400.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 20.
  required_artifacts:
    - experiments/EXP-ECDLP-6eb216/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-6eb216/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-6eb216/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-6eb216/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-6eb216/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-6eb216/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
