experiment:
  id: EXP-KEX-6572c9
  hypothesis_id: H-KEX-4383ab
  derived_from_idea: IDEA-20260813-2123f1
  question_id: RQ-KEX-b8be01
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Faithful-quotient audit on complete toy abelian action tables -- measured
    effective public-key fiber size, within-fiber induced-permutation and
    shared-output counts, exact entropy subtraction, with a positive
    correctness-failure control and nonabelian / nontransitive nearby-object
    controls

  objective: >-
    THE ONE UNCERTAINTY A RUN REDUCES -- whether the faithful-quotient
    obstruction of IDEA-20260813-2123f1 survives complete mechanical
    enumeration, and whether an audit built on it can actually distinguish the
    cases it claims to distinguish. A run establishes, on completely
    enumerated finite abelian action tables at log2 |G| <= 14 and
    log2 |X| <= 14: (i) the maximum effective public-key fiber size after
    quotienting by the encoding stabilizer H, which the hypothesis forces to
    1; (ii) the maximum number of distinct induced permutations and distinct
    shared outputs inside a single public fiber, both forced to 1, which is
    the operative statement that a discarded fiber label buys zero key-
    exchange entropy; (iii) the exact entropy subtraction, nominal minus
    effective, per table; (iv) whether the collision search actually returns a
    correctness counterexample on an encoding built to contain one; and
    (v) whether the audit REFUSES a nonabelian transitive action and an
    abelian nontransitive action by naming a failed premise rather than
    silently returning the same answer. No attack, no key recovery, no
    distinguisher, and no security consequence is claimed here or would follow
    from a run. No statement is made about any deployed or proposed key
    exchange. No direction is declared impossible.

  what_this_is_not:
    - >-
      Not an attack, a key recovery, a forgery, a distinguisher, or a
      cryptanalytic result of any kind. It is an algebraic audit with
      instrument certification.
    - >-
      Not a claim, in either direction, about the security of any isogeny
      class-action key exchange, any hard homogeneous space, or any parameter
      set. The tables enumerated here are abstract group actions and contain
      no elliptic curve.
    - >-
      Not a status change to any hypothesis, evidence record, decision or goal
      record, and not a promotion of any knowledge entry.
    - >-
      Not approval, freezing, execution authorization, a run, an observed
      output, or evidence. No run has been executed under this contract and
      approved_by is null.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE -- on the enumerated toy tables at the
      executed sizes, the stated forced values held (or did not), the audit
      refused (or failed to refuse) each nearby-object control, and the
      entropy subtraction was exactly the stated number of bits per table.
      WHAT DOES NOT FOLLOW -- no statement about any isogeny class action, any
      real key exchange, or any cryptographic size; no claim that
      vectorization in the faithful quotient is easy or hard; no closure of
      RQ-KEX-b8be01 or of any research direction; and specifically NOT that a
      candidate surviving this screen is secure, which is not a proposition
      this design can address at all.

  inputs:
    procedure: >-
      STAGE 0 (zero compute) -- freeze the table generator, the certificate
      list, the null-relabeling count, and the forced values G1 = 1, G2 = 1,
      G3 = (log2 |H/K|, log2 |G/H|), G4 >= 1, G5 >= 1, and hash the
      pre-registration text. STAGE 1 (minutes) -- generate every declared
      action table and verify closure, identity, inverse, commutativity,
      codomain, transitivity and canonical-encoding certificates
      EXHAUSTIVELY; a table failing any certificate is excluded with its
      defect recorded and never enters a measurement. STAGE 2 (minutes) --
      BASELINE REPRODUCTION, gating -- for each surviving table reproduce
      two-party agreement over all sampled key pairs, public validation
      acceptance, |G/H|, and matched exhaustive and BSGS search sizes on the
      effective orbit. STAGE 3 (minutes) -- compute K, compute H, enumerate
      every q-collision pair and every g, record the first separating triple
      if any; compute the raw and effective fiber histograms, the within-fiber
      distinct-induced-permutation and distinct-shared-output counts, and the
      exact nominal / K-quotiented / H-quotiented entropy triple.
      STAGE 4 (minutes) -- run the positive correctness-failure control and
      the two nearby-object controls through the IDENTICAL code path and
      record their verdicts and, for the nearby controls, the exact failed
      premise. STAGE 5 (minutes) -- same-shape random relabeling nulls and the
      G -> G/K -> G/H decay series for any secondary statistical signal.
      STAGE 6 (zero compute) -- assemble the per-table tables and the refusal
      statement naming candidate classes this screen cannot decide.
    instrument: >-
      Python 3.11 with numpy only; NO Sage and NO sympy (both recorded absent
      from this container in prior lane records, and their absence must be
      re-checked and recorded at run time rather than assumed). Group actions
      are explicit integer tables; certificates are exhaustive loops; entropy
      is computed in exact rational arithmetic from counts, not by floating
      estimation. Every measurement is recorded through harness/runner.py.
    parameters: >-
      Abelian groups G in {Z/8, Z/16, Z/64, Z/256, Z/1024, Z/4096,
      Z/4 x Z/4, Z/8 x Z/8, (Z/2)^6, (Z/2)^10}, each acting by translation on
      X = G/K for declared kernels K of order 1, 2, 4, 8. Encodings q -- the
      identity; a genuine equivariant quotient with |H/K| in {2, 4, 8}; an
      ideal-word duplicate encoding; and an encoding omitting one necessary
      coordinate (positive control). Nearby objects -- S_4 acting on the 6
      cosets of a non-normal order-4 subgroup (nonabelian transitive) and
      Z/16 acting on a disjoint union of two 16-point orbits (abelian
      nontransitive). Samplers -- uniform on G in the primary arm, plus one
      declared nonuniform arm with weights fixed before the run. 200 random
      relabelings per table for the same-shape null.
  controls:
    - >-
      BASELINE REPRODUCTION, gating -- two-party agreement, validation
      acceptance, |G/H| and matched exhaustive / BSGS sizes reproduced on each
      table before any quotient audit result is reported.
    - >-
      POSITIVE CORRECTNESS-FAILURE CONTROL -- an encoding built to omit a
      necessary coordinate. The collision search MUST return a separating
      triple (x, x', g) with two independently recomputed distinct shared
      outputs. Failure to return one is an instrument failure that blocks
      every negative in this experiment.
    - >-
      NEARBY-OBJECT CONTROL 1 -- nonabelian transitive action. The audit must
      refuse it by naming the failed abelian premise, not by returning a fiber
      size.
    - >-
      NEARBY-OBJECT CONTROL 2 -- abelian nontransitive action. The audit must
      refuse it by naming the failed transitivity premise.
    - >-
      SYNTACTIC-REDUNDANCY CONTROL -- ideal-word / relation-duplicate encoding
      where |H/K| is known by construction. The measured |H/K| must equal the
      constructed value exactly; a mismatch means H is not being computed.
    - >-
      SAME-SHAPE RANDOM NULL -- 200 random relabelings preserving orbit and
      fiber cardinalities, giving the conditional null for any secondary
      statistical association.
    - >-
      DECAY CONTROL -- progressive canonicalization G -> G/K -> G/H, with the
      effect size reported at each stage. A flat effect is an artifact.
    - >-
      NULL OBJECT (mandatory under docs/inventor-protocol.md) -- the identity
      encoding, where H = K by construction and the quotient audit must remove
      exactly zero bits. An audit that removes bits where nothing was
      discarded is subtracting an artifact, and BOTH this null and the
      positive control must pass before any table's entropy subtraction is
      reportable.

  independent_variables:
    - group structure (cyclic / product / elementary abelian) and |G|
    - kernel order |K|
    - encoding class (identity / equivariant quotient / duplicate / omitting)
    - "residual index |H/K| in {1, 2, 4, 8}"
    - secret sampler (uniform / declared nonuniform)
    - "premise class (abelian-transitive / nonabelian / nontransitive)"

  metrics:
    primary:
      - >-
        G1 effective_public_key_fiber_size_max -- for each table, the maximum
        over public states of the number of distinct H-cosets mapping to that
        state. Computed by grouping G by H and counting preimages of each y in
        Y0. Unit -- dimensionless count. Forced value 1.
      - >-
        G2a within_fiber_distinct_induced_permutation_count_max -- for each
        public fiber, the number of distinct permutations of Y0 induced by its
        members, maximised over fibers. Unit -- dimensionless count. Forced
        value 1.
      - >-
        G2b within_fiber_distinct_shared_output_count_max -- for each public
        fiber and each peer public key, the number of distinct shared outputs
        produced by its members, maximised over (fiber, peer). Unit --
        dimensionless count. Forced value 1.
      - >-
        G3 entropy_triple -- (nominal_bits, K_quotiented_bits,
        H_quotiented_bits) computed in exact rational arithmetic from the
        sampler's push-forward. Unit -- bits. Forced values log2 |G|,
        log2 |G/K|, log2 |G/H| under the uniform sampler.
      - >-
        G4 action_separating_collision_count on the positive control, with the
        lexicographically first triple (x, x', g) and both shared outputs
        recomputed independently. Unit -- dimensionless count. Forced to be at
        least 1.
      - >-
        G5 nearby_control_failed_premise_count -- per nearby-object control,
        the number of named audit premises reported as failed, with the failing
        proof step identified. Unit -- dimensionless count. Forced to be at
        least 1 for each of the two controls.
    secondary:
      - measured |K|, |H|, |G/H|, |Y0| per table, against constructed values
      - raw (pre-quotient) fiber histogram per table
      - certificate failure counts per table, by certificate type
      - baseline reproduction outcome per table (agreement rate, |G/H|, matched search sizes)
      - same-shape null effect size and the G -> G/K -> G/H decay series
      - nonuniform-sampler Shannon and min-entropy, pushed through the quotient exactly
      - wall clock and peak memory per stage

  heuristic_under_test: HEUR-KEX-1
  preregistered_prediction:
    quantity: >-
      The five forced values G1 = 1, G2a = G2b = 1, G3 = (log2 |G|,
      log2 |G/K|, log2 |G/H|) under the uniform sampler, G4 >= 1 on the
      positive control, and G5 >= 1 on each nearby-object control.
    formula: >-
      G1 := max over y in Y0 of |{gH : q(g * x0) = y}|; G2a := max over fibers
      F of |{the permutation of Y0 induced by g : g in F}|; G2b := max over
      (fiber F, peer public key z) of |{shared(g, z) : g in F}|; G3 :=
      (H_infinity of the sampler on G, on G/K, on G/H) computed from exact
      counts. Under the NULL that a discarded fiber label carries genuine
      hidden entropy, G2b would exceed 1 on at least one well-defined encoding
      and G3's third component would exceed log2 |G/H|.
    source: >-
      Pre-registered in the parent proposal IDEA-20260813-2123f1 (predictions
      P1-P4) and restated as G1-G5 in H-KEX-4383ab before any run under this
      contract exists. Never tuned to data. A run reporting a different
      quantity reports a different experiment and requires a new contract.

  scale_relevance:
    tier: toy
    justification: >-
      Executed on abstract finite action tables at log2 |G| <= 14 and
      log2 |X| <= 14 -- far below any cryptographic parameter and containing
      no elliptic curve at all. That is deliberate and is the entire design --
      the claim under test is an algebraic identity whose premises are
      checkable only by COMPLETE enumeration, so the experiment is sized to be
      exhaustive rather than large. THE TRANSFER ASSUMPTION IS STATED AND IS
      NARROW -- a refutation at these sizes refutes the general statement,
      because the statement is universally quantified; a confirmation at these
      sizes confirms only that no slip was found within them, and licenses NO
      claim about any real candidate. Applying the screen to an actual
      class-action candidate requires that candidate's public representation
      to be transcribed first, which this contract does not do.
    correspondence: null

  tail_checks:
    - >-
      Report every table where |H| computed from the encoding differs from |H|
      constructed by the generator; a nonzero count means H is being measured
      wrong and blocks the entropy metric.
    - >-
      Report the largest raw fiber and confirm it equals |H/K| exactly; a
      larger raw fiber means the encoding is not the declared one.
    - >-
      Report the number of (collision pair, g) triples examined on each table,
      so an empty collision result can be distinguished from an unexecuted
      search.
    - >-
      Report the largest same-shape null effect over the 200 relabelings, not
      only its mean, since the maximum is what a spurious signal must beat.

  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
    note: >-
      Seeds govern only the random relabeling nulls, the nonuniform sampler
      draws and the table-generation order. The certificate checks, the
      collision searches and the fiber measurements are EXHAUSTIVE and
      therefore deterministic -- identical across seeds by construction, and a
      seed-to-seed difference in any of them is an implementation defect, not
      variance.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 2.0
    maximum_memory_gb: 4
    maximum_runs: 8

  stopping_rules:
    - >-
      Abort a table on any certificate failure and record the defect; do not
      measure fibers on an uncertified table.
    - >-
      Abort the entire run if the positive correctness-failure control returns
      no separating triple; nothing negative is reportable and the deliverable
      becomes an instrument report.
    - >-
      Stop at the declared table list. New group or encoding families are a
      different experiment and require a new contract.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result (AGENTS.md rule 5).

  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5).
    - >-
      A run whose null-object arm (identity encoding) or positive control was
      not executed in the same invocation as the signal arm is
      invalid_measurement -- the comparison the contract exists to make was
      not made.
    - >-
      A run whose baseline reproduction (agreement, validation, |G/H|, matched
      search sizes) failed on any table but which reports that table's quotient
      audit anyway is completed_invalid.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT
      experiment and requires a new contract; it is never a repair of this one.

  success_criterion: >-
    The run is SUCCESSFUL as a measurement when all of the following hold and
    are reported per table -- (a) every measured table passed its certificates
    and its gating baseline reproduction; (b) the positive control returned at
    least one separating triple with both distinct shared outputs
    independently recomputed; (c) each of the two nearby-object controls was
    refused with at least one named failed premise; (d) the identity-encoding
    null removed exactly zero bits; and (e) G1, G2a, G2b and G3 are reported
    with their measured values for every table. The hypothesis H-KEX-4383ab is
    SUPPORTED at toy tier if, in addition, G1 = 1, G2a = 1 and G2b = 1 on
    every certified well-defined table and G3 equals the forced triple exactly
    on every such table under the uniform sampler.

  falsification_criterion:
    - >-
      G1 > 1, or G2a > 1, or G2b > 1 on ANY certified table whose
      well-definedness check passed. The hypothesis is FALSE; the offending
      table is the refutation artifact and is archived verbatim as the
      counterexample certificate.
    - >-
      G3's H-quotiented component exceeds log2 |G/H| on any certified table
      under the uniform sampler. The entropy accounting is wrong.
    - >-
      G4 = 0 on the positive control. The collision search is blind; NO
      negative result may be reported from any arm of this experiment.
    - >-
      G5 = 0 on either nearby-object control -- the audit returns an answer
      where it should refuse. The method ceiling is undemonstrated and the
      audit's scope statement is unsupported.
    - >-
      The identity-encoding null removes a nonzero number of bits. The
      quotient step is subtracting an artifact and no entropy number is
      reportable.
    - >-
      A secondary statistical signal is matched by the same-shape null or
      fails to decay under G -> G/K -> G/H. It is recorded as an artifact and
      may not support any interpretation.

  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
    - raw-result.json carrying every per-table measurement, not summaries
    - the null-object (identity encoding) and positive-control measurements, in the same file as the signal arm
    - the two nearby-object control verdicts with their named failed premises
    - the pre-registration text with the five forced values, written before the first run and hashed
    - the full action and encoding tables for any table that violates a forced value, archived verbatim as a counterexample certificate
    - a recorded check of whether sage and sympy import in the execution environment

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; approved_by is null and
      execution_authorized is false (AGENTS.md rule 1). The Coordinator
      subagent that drafted it has no authority to approve it -- approval is
      the user's gate because it authorizes execution and spends compute.
    - >-
      The parent proposal is proof-oriented, so its proof_search_map must be
      audited before implementation (KN-TECH-080). The audit is carried in
      H-KEX-4383ab.proof_search_map and must be reviewed alongside this
      contract.
    - >-
      The five forced values must be committed and hashed before the first
      table is generated; a forced value fixed after any measurement voids
      this contract.

  derivation_provenance:
    tool: coordinator-subagent design pass
    source_record: IDEA-20260813-2123f1
    authored_at: '2026-08-25'
    note: >-
      Metrics G1-G5, the controls and the criteria are a direct rendering of
      the parent proposal's predictions P1-P4, its lossy_projection_test and
      its minimal_test.controls, restated so that each is decidable from a
      recorded number. Budgets come from the parent's declared estimated_cost
      (implementation low, compute low). Boilerplate identical across
      contracts by program rule -- invalidation rules, required artifacts,
      approval gate -- comes from the fixed table. No field is invented; a
      value the proposal did not supply is either derived here and labelled,
      or left in derivation_gaps.

  derivation_gaps:
    - >-
      The parent proposal does not fix concrete group and state sizes. The
      table list above is chosen here to be exhaustively enumerable, and a
      Coordinator must confirm it before approval; enlarging it after seeing a
      result would be a protocol amendment, not a repair.
    - >-
      The nonuniform sampler's weights are declared but not specified. They
      must be written into the frozen pre-registration, because a sampler
      chosen after seeing the uniform arm's entropy numbers would make the
      nonuniform arm unfalsifiable.
    - >-
      The parent proposal's ECC instantiation (class groups, orientations,
      level structures) is NOT implemented here and no such table is
      enumerated. Whether the screen applies to any real candidate is a
      separate transcription task with its own record; treating this contract
      as evidence about a class action would be the exact overclaim its
      claim_ceiling forbids.
    - >-
      The "matched best feasible published vectorization" baseline named in
      the parent's complete_cost_boundary is NOT reproduced here -- only
      exhaustive and BSGS sizes are. A run must not report a vectorization
      comparison, and the omission is disclosed rather than silently dropped.
