experiment:
  id: EXP-JINV-9be254
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-f8a045
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'Charge the j=0 / j=1728 automorphism gain in the RELATION SYSTEM exactly: one successful
    decomposition on a mu_k-stable factor base yields |Aut|/2 relations and permits a factor-base
    quotient with |Aut|/2 fewer columns, so the index-calculus gain is at most 3 on collection and
    9 on linear algebra for j=0 (2 and 4 for j=1728) - LINEAR in |Aut|, not sqrt, and still a constant;
    measure whether the mu_k-orbit constraint charges a decomposition- probability penalty that cancels
    it'
  status: draft
  objective: "(A) THE ACCOUNTING, DERIVED. Let E/F_p be ordinary with j=0 (p congruent to 1 mod 3,\
    \ Aut(E) cyclic of order 6, generated by (x,y) -> (zeta_3 x, -y)) or j=1728 (p congruent to 1\
    \ mod 4, Aut of order 4, generated by (x,y) -> (-x, i y)). Write A = Aut(E) and note that negation\
    \ is already inside A and is ALREADY EXPLOITED by every standard factor base, which is indexed\
    \ by x-coordinates and therefore identifies P with -P. The EXTRA structure at special j is therefore\
    \ A/{+-1}, of order 3 for j=0 and 2 for j=1728 - not 6 and 4. Let phi generate A/{+-1} and let\
    \ the factor base F be a union of phi-orbits. If R = sum of e_i P_i with P_i in F is a decomposition,\
    \ then phi(R) = sum of e_i phi(P_i) is a decomposition over the SAME F. With R = [a]P + [b]Q and\
    \ phi acting on the prime-order G as multiplication by lambda, the induced relations have right-hand\
    \ sides (a,b), (lambda a, lambda b), ..., (lambda^{r-1} a, lambda^{r-1} b) where r = |A/{+-1}|.\
    \ CONSEQUENCE 1 (collection): ONE successful decomposition search yields r relations instead of\
    \ 1. CONSEQUENCE 2 (linear algebra): on the quotient factor base F/phi, the logarithm of every\
    \ orbit member is determined by one orbit representative (log(phi P) = lambda log P), so the number\
    \ of unknowns falls from B to B/r and the dense-solve cost falls from Theta(B^2) to Theta(B^2/r^2).\
    \ CONSEQUENCE 3 (the free trivial relation, and it is a limit not a gain): for j=0, lambda^2 +\
    \ lambda + 1 = 0 mod N, so the SUM of the three relations from one solve has right-hand side (1\
    \ + lambda + lambda^2)(a,b) = (0,0). One of every three rows produced is a relation among factor-base\
    \ logarithms with zero right-hand side. Such rows are usable but they are not three independent\
    \ (a,b)-directions, so the effective gain on the collection side is bounded by r and is not larger.\
    \ NET: at most 3x on collection and 9x on linear algebra for j=0; 2x and 4x for j=1728. All constants.\
    \ [derived in this record; the r-fold relation yield and the B/r column count are the quantities\
    \ the experiment measures.]\n(B) THIS IS A DIFFERENT CONSTANT FROM KN-TECH-018's sqrt(|Aut|),\
    \ AND THE DIFFERENCE IS THE POINT. KN-TECH-018 records the rho gain, which is sqrt(|Aut|) because\
    \ rho's cost is a birthday cost on a set shrunk by |Aut|. Index calculus is not a birthday algorithm;\
    \ its two stages scale linearly and quadratically in the factor-base size, so the same quotient\
    \ buys |Aut|/2 and (|Aut|/2)^2 respectively. The lane must not quote sqrt(6) as the ceiling for\
    \ the index-calculus side. IT IS STILL A CONSTANT AND STILL NEVER AN EXPONENT, and it is bounded\
    \ by 9 for j=0 and 4 for j=1728 in this program's cost model. THIS PROPOSAL CLAIMS NOTHING BEYOND\
    \ A CONSTANT and is filed as baseline calibration, not as an attack. It also cannot produce an\
    \ attack, because prime-field index calculus is not competitive with rho in the first place (KN-TECH-001,\
    \ KN-TECH-006).\n(C) THE QUANTITY THAT COULD CANCEL IT, AND WHY IT IS NOT OBVIOUS. The gain above\
    \ assumes the decomposition probability of a random target over a mu_r-stable factor base of size\
    \ B equals that over a random factor base of size B. That is plausible - the base still covers\
    \ B x-coordinates - but it is NOT proved, and this program has an unresolved measurement in exactly\
    \ this place: H-STR-002 posited a \"relation-density penalty\" and was moved to `weakened` (DEC-20260727-009)\
    \ on artifact and cost-path grounds, with its transition record stating explicitly that the mechanism\
    \ was not shown false and that no arm of EXP-STR-003 tested the C_3-equivariance of the closed\
    \ system. The density ratio\n  D = Pr[random target decomposes over a random F of size B]\n  \
    \    / Pr[random target decomposes over a mu_r-stable F of size B]\nis therefore an OPEN NUMBER\
    \ in this repository, and it is the number that decides whether the derived factor r survives.\n\
    (D) THE THREE OUTCOMES, FIXED IN ADVANCE.\n  O1 D = 1 within noise and the measured relations-per-solve\
    \ equals r\n    exactly. The derivation in (A) is confirmed; the j=0 index-calculus gain\n   \
    \ is exactly 3 on collection and 9 on dense linear algebra, and L3 records\n    that as its calibrated\
    \ constant. Predicted.\n  O2 D > 1 materially (say D >= 1.5). The mu_r-stable factor base is a\
    \ WORSE\n    factor base, the constant is eaten, and the correct statement is that\n    special\
    \ j confers no index-calculus advantage after charging. This would\n    be a clean negative with\
    \ a measured mechanism.\n  O3 relations-per-solve exceeds r, or D < 1 materially. Either the\n\
    \    instrument is double-counting shifted rows (the exact failure mode\n    recorded against\
    \ EXP-STR-002's appended rows in DEC-20260727-009's\n    finding R2) or something real is happening.\
    \ Audit before reporting."
  resource_label: R1 and R2 primarily (x-coordinates as field elements, and the equation that relates
    them), with R3 entering only as the source of the eigenvalue lambda. The relation-yield gain is
    a property of the polynomial system and the factor base, not of the group action on G.
  admissibility: admissible
  admissibility_argument: 'The tested object is the number of usable ROWS of a relation matrix per
    Groebner solve and the decomposition probability of a target over a structured factor base. Both
    are properties of the field-element factor base and the equation (R1/R2 in DECOMPOSITION.md section
    2), which the generic group oracle does not return. H-ENDO-001 forbids expecting NEW CONGRUENCES
    from phi acting on G, and this proposal expects none: the r right-hand sides (lambda^i a, lambda^i
    b) all lie on one line in (Z/N)^2, exactly as H-ENDO-001''s index-pinning argument requires, and
    claim (A) CONSEQUENCE 3 states that limitation rather than hiding it. What is gained is bookkeeping
    - r rows for the price of one solve - which is a cost-model fact about the relation stage, not
    a new algebraic constraint on k. KN-FIND-b7e091''s GGM closure is untouched because no oracle
    is invented here.'
  reachability_gate: 'NOT APPLICABLE AS A WALK: the curve is fixed and no isogeny step is taken. T4
    nonetheless bounds the result''s reach: the r-fold gain exists only on curves with an F_p-rational
    automorphism of order > 2, which requires D_0 = -3 or D_0 = -4, and by T4 a curve whose isogeny
    class lacks such a curve cannot be walked to one. There is therefore no route by which a generic
    curve acquires this constant, at any cost, and the result may never be reported as applying beyond
    D_0 in {-3,-4}.'
  inputs:
    procedure: 'CHEAPEST VALID DISCRIMINATOR: Step 3 alone, at one prime and one arity. Fix a j=0
      toy curve at 16 bits. Build one phi-stable factor base and one random factor base of identical
      size B. Stream 200 random targets through the SAME decomposition routine (harness/semaev.py
      _find_decomposition) and count successes on each. That single number D decides outcome O1 versus
      O2 and needs no linear algebra, no quotient, no displacement rank, and no solve. It is cheap
      because it reuses committed code unchanged and because the comparison is size-matched by construction.
      Only if D is near 1 do Steps 2, 4 and 5 become worth their implementation cost.'
    mechanism: 'STEP 1 (implementation, medium). Extend the existing j=0 driver harness/endomorphism_la.py
      so that it (a) builds a factor base as a union of exact phi-orbits and RECORDS THE ORBIT PARTITION,
      (b) collects relations by genuine decomposition search only, and (c) derives the r-1 shifted
      rows ANALYTICALLY from each found decomposition rather than by re-searching - while marking
      derived rows as derived. The current committed driver appends shifted rows into the same list
      it later measures, which is precisely the accounting the H-STR-002 weakening flagged (DEC-20260727-009
      finding R2: "with the appended rows removed"); derived rows must be counted once as a yield
      multiplier and never as independent search successes. Also: the committed driver raises IndexError
      when B mod 3 != 0 (harness/endomorphism_la.py main(), noted in DEC-20260727-009), so B is constrained
      to multiples of r or the code path is fixed before any run.

      STEP 2 (the yield measurement). For each (p, seed, arity m, B): count SOLVES (distinct decomposition
      searches that succeeded) and count USABLE ROWS (rank of the resulting matrix over F_N, not the
      number of rows appended). Report yield = usable_rows / solves. Predicted r for a phi-stable
      base and 1 for a random base. Rank, not row count, is what makes CONSEQUENCE 3 visible: if the
      three rows from one j=0 solve contribute rank 3, CONSEQUENCE 3 is wrong; if they contribute
      rank 3 but only one independent (a,b) direction, the report must say both numbers.

      STEP 3 (the density measurement, and it is the decisive one). On the SAME curve, same p, same
      target stream and same B, compare decomposition probability over (i) a phi-stable factor base
      and (ii) a uniformly random factor base of the same size. Estimate D with a binomial confidence
      interval over at least 200 targets per cell. This is the size-matched comparison DECOMPOSITION.md
      section 4 (L4) calls "the only comparison that isolates equivariance from factor-base size".

      STEP 4 (the quotient solve). Build the B/r-column orbit-indexed matrix over Z[lambda]/N, solve
      it, and CERTIFY the recovered logarithms independently by recomputing the point (docs/claims-and-verification.md;
      harness/toycurve.py is the independent verifier). Report the fully charged cost of the whole
      pipeline against matched rho and matched BSGS on the identical instance in the same operation
      unit (one elliptic-curve point addition or doubling).

      STEP 5 (the withheld-endomorphism arm - the matched null). Rerun the entire pipeline on the
      SAME j=0 curve with phi withheld from the algorithm: random factor base, no shifted rows, no
      quotient. Any difference between Step 4 and Step 5 is attributable to knowing phi; any difference
      between Step 5 and a generic-j curve at matched p is attributable to being a j=0 curve without
      using it, which should be ZERO and is the artifact detector.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - size-matched random factor base on the same curve (N1)
  - withheld-endomorphism arm on the same j=0 curve (N2)
  - fake orbit partition, which must fail to produce consistent logs (N3)
  - matched Pollard rho with negation on the identical instance
  - matched BSGS on the identical instance
  - generic-j curve at the same p and matched N, to check that N2 and the generic curve are indistinguishable
  - "NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, THREE MATCHED NULLS. N1 SIZE-MATCHED\
    \ RANDOM FACTOR BASE on the same curve, same p, same targets.\n  This is the only comparison that\
    \ isolates equivariance from base size.\nN2 WITHHELD-ENDOMORPHISM ARM: the same j=0 curve run\
    \ without phi (Step 5).\n  Predicted to be indistinguishable from a generic-j curve at matched\
    \ p.\nN3 RANDOM-PERMUTATION ORBIT PARTITION: a factor base partitioned into\n  arbitrary blocks\
    \ of size r that are NOT phi-orbits, quotiented the same\n  way. The quotient must FAIL to produce\
    \ consistent logarithms here. An\n  instrument that reports a gain on a fake partition is measuring\
    \ the\n  bookkeeping and not the automorphism.\nDECAY PARAMETER: the factor-base size B. The derived\
    \ gain is a CONSTANT r independent of B. A measured yield that GROWS with B is the canonical artifact\
    \ tell (docs/inventor-protocol.md section 3) and indicates derived rows being recounted as searches\
    \ - the exact failure DEC-20260727-009 recorded. A measured yield that decays toward 1 as B grows\
    \ means the orbit structure is being destroyed by collisions and must be explained."
  independent_variables: []
  metrics:
    primary:
    - solves, appended rows, and MATRIX RANK over F_N, separately
    - independent (a,b) right-hand-side directions per solve
    - decomposition successes / attempts per arm, with binomial intervals
    - factor-base size B, orbit partition, and count of short orbits excluded
    secondary:
    - fully charged point-addition count for every arm including controls
    - certificate verification pass/fail for every recovered logarithm
    - wall time and peak memory per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: usable relation rank per successful decomposition search, j=0, phi-stable base
    formula: Predicted exactly 3 (and 2 for j=1728), against exactly 1 on a size-matched random base.
      A value below 2.5 on j=0 means the derived rows are not usable and the accounting in (A) is
      wrong.
    source: pre-registered in IDEA-20260807-f8a045 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - DERIVED-ROW DOUBLE COUNTING. The committed harness/endomorphism_la.py appends phi-shifted rows
    into the relation list before measuring it. Every metric here must distinguish searched rows from
    derived rows or it repeats the exact error DEC-20260727-009 documented.
  - RANK DEFICIENCY. DEC-20260727-009 records the phi arm's matrix being rank-deficient by 4, 6, 30
    and 67 in the earlier work. Row count is not rank; only rank is reported as yield.
  - B MOD r. The committed driver's orbit machinery assumes B divisible by r and raises IndexError
    otherwise. Choosing B only at multiples of r is a legitimate constraint but must be stated, because
    it silently changes the comparison against a random base of arbitrary size.
  - SHORT ORBITS. x = 0 is fixed by phi on a j=0 curve and lies on E whenever b is a square; such
    points form orbits of length 1 and must be excluded or accounted separately.
  - TOY-SCALE B. At B of order sqrt(N) with N under 2^24, B is small enough that a factor of 3 in
    the number of needed relations is within run-to-run noise unless many seeds are used. At least
    five seeds per cell.
  - THE COMPARISON THAT MATTERS IS AGAINST RHO, NOT AGAINST UNSTRUCTURED INDEX CALCULUS. A factor
    9 on the linear algebra of an algorithm that loses to rho by orders of magnitude changes nothing,
    and every reported ratio must be accompanied by the rho ratio.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Predicted exactly 3 (and 2 for j=1728), against exactly 1 on a size-matched random
    base. A value below 2.5 on j=0 means the derived rows are not usable and the accounting in (A)
    is wrong.
  falsification_criterion:
  - Yield per solve on a j=0 phi-stable base is below 2.5 (or below 1.7 for j=1728). The r-fold accounting
    in (A) is false.
  - 'D >= 1.5 with a 95 percent interval excluding 1.2. The mu_r-stable factor base is materially
    worse and the constant is cancelled: outcome O2, a clean negative for the lane.'
  - The fake-partition control (N3) produces a consistent solve. The instrument is not testing the
    automorphism and every number it produced is void.
  - The withheld-endomorphism arm differs measurably from a generic-j curve at matched p. Something
    about being a j=0 curve is affecting the measurement without phi being used, which is either a
    confound in curve generation or a finding, and must be resolved before anything else is reported.
  - Yield grows with B. Derived rows are being recounted as searches; the accounting is void (this
    is the recorded EXP-STR-002 failure mode and the reason the driver must mark derived rows).
  - Any recovered logarithm fails independent certificate verification. The run is INVALID, not negative.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-f8a045
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
