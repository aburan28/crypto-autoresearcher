experiment:
  id: EXP-ECDLP-4617dc
  hypothesis_id: H-ECDLP-5cb5d0
  version: 1
  title: >-
    Vacuity audit of the full-point oracle used as a relation constructor,
    measured as rank contribution per oracle query with a known-logarithm arm
    supplying the instrument's dynamic range, and a curve-free (Z/N, +) null
    that fixes how broadly the closure is stated
  status: draft
  objective: >-
    Establish, on an instrument shown able to report a nonzero value, that an
    oracle returning complete curve points contributes EXACTLY ZERO rank to the
    factor-base relation system, in both variants the source proposal treats as
    live, and therefore that the proposal's headline advantage is a tautology
    rather than a mechanism. The source's own prediction, a ratio of about
    (m! N)/B^m for the factor-base oracle, is NOT measured here, because it
    holds with probability 1 by construction and its nominated falsifier, a
    ratio below 10, would require a sum of three elements of V not to be a sum
    of three elements of V. The measured quantity is rank contribution per
    query, whose zero is meaningful only because a known-logarithm control arm
    returns about 0.119 on the same instrument.
    The curve-free null is present not to defend an elliptic claim but to fix
    the SCOPE of a negative one, and its expected agreement makes the closure
    broader, a statement about index calculus in any finite cyclic group.
  inputs:
    curve_family: >-
      Toy prime-field short-Weierstrass curves at p in {101, 103, 107, 211,
      1009}, hygiene-screened per curve with the factored group order, the
      largest prime factor, and an explicit "#E(F_p) != p" check.
    factor_base: V, a random subset of E(F_p) of size B, chosen independently of every query.
    arity: 3
    B_values: [10, 20, 50]
    queries_per_cell: 2000
    targets_per_cell: 2000
    oracle_variants:
      variant_1_random: O_full returns a uniformly random point of E(F_p).
      variant_2_factor_base: O_full returns a uniformly random point of V.
      control_known_logarithm: >-
        O(i) = [i]P for i drawn uniformly from Z/N, so the returned point's
        logarithm is known to the algorithm. THIS IS A CONTROL, not a proposed
        mechanism; it is ordinary scalar multiplication and its research object
        is EXP-ECDLP-e7f6e4 under H-ECDLP-a4c9c1, which this contract does not
        duplicate.
    curve_free_null_instances: (Z/N, +) at matched N, matched B, matched query and target counts.
    rank_routine: >-
      Exact integer rank of the relation matrix over the factor-base logarithm
      unknowns modulo N. Every point returned by an oracle that is not in V and
      whose logarithm is not known introduces a NEW unknown and that unknown is
      counted.
  controls:
    - >-
      DYNAMIC-RANGE CONTROL, BLOCKING, RUN FIRST. The known-logarithm arm. At
      p = 1009, B = 10, m = 3 the decomposition probability C(B,m)/N is about
      120/1009 = 0.119, so this arm must return a rank contribution per query at
      or above 0.10 and a strictly positive verified-solve rate. An instrument
      that returns 0.000 here cannot report a meaningful 0.000 anywhere and
      every zero in the run is void.
    - >-
      NAMED NULL, BLOCKING, CURVE-FREE. The identical protocol in (Z/N, +).
      CONSEQUENCE PRE-STATED. Agreement with the elliptic arm means the vacuity
      is a property of index calculus in any finite cyclic group; the conclusion
      is then stated at that breadth and may NOT be reported as an
      elliptic-curve or ECDLP result. Disagreement would mean the elliptic
      accounting differs from the abelian one and would require the whole
      analysis to be redone.
    - >-
      TAUTOLOGY DETECTOR, FORCED VALUE. For every accepted VARIANT 2 relation,
      record whether the returned decomposition is literally the multiset the
      algorithm constructed. It must be, in 100 percent of cases, and the rank
      routine must credit it 0. If any VARIANT 2 relation is NOT the constructed
      multiset, that is a genuine independent relation and must be reported
      individually rather than pooled.
    - >-
      EXHAUSTIVE-SEARCH BASELINE. Arity-3 exhaustive search over V on the same
      instances, supplying the relation truth against which every arm's
      relations are checked for membership and independence.
    - >-
      MATCHED BASELINES, MANDATORY UNDER RQ-ECDLP-002 CONSTRAINT 3. Pollard rho
      and BSGS on the identical instances, in the same operation unit, with
      BSGS memory in bits.
  independent_variables:
    - prime p, five values
    - factor-base size B in {10, 20, 50}
    - oracle variant, random, factor-base, known-logarithm control
    - object class, elliptic curve versus curve-free (Z/N, +)
  metrics:
    primary:
      - >-
        rank_contribution_per_query, dimensionless, increase in the exact
        integer rank of the relation matrix over the factor-base logarithm
        unknowns divided by oracle queries, per arm per cell
      - >-
        verified_solve_rate, dimensionless in [0,1], targets on which a k with
        [k]P = Q was recovered and independently re-verified, per arm per cell
    secondary:
      - number of accepted relations per arm per cell, integer
      - fraction of VARIANT 2 relations that are literally the constructed multiset
      - number of new logarithm unknowns introduced per query, per arm
      - decomposition fraction on the known-logarithm arm against the predicted C(B,m)/N
      - achieved B/p per cell, reported rather than the target
      - matched rho and BSGS operation and memory counts
  heuristic_under_test: H1
  preregistered_prediction:
    quantity: >-
      Rank contribution per oracle query over the factor-base logarithm
      unknowns.
    formula: >-
      VARIANT 2 constructs R as a sum of m elements of V and returns that same
      multiset, a tautology of the form P_1 + ... + P_m = P_1 + ... + P_m, whose
      row is identically zero, so its rank contribution is 0. VARIANT 1 returns
      points of unknown logarithm, so each accepted decomposition adds one
      equation and one new unknown and its net rank contribution over the
      factor-base unknowns is 0. The known-logarithm control adds one equation
      and no new unknown, at a rate C(B,m)/N per query, about 0.119 at
      p = 1009, B = 10, m = 3.
    source: >-
      Derived in H-ECDLP-5cb5d0 from the accounting identity of index calculus.
      It is NOT the source proposal's prediction, which was a yield ratio that
      holds by construction.
  band_non_degeneracy:
    checked_before_freezing: true
    arms_found_degenerate_and_repaired:
      - >-
        SOURCE ARM REJECTED AS DEGENERATE, AND ITS FALSIFIER IS A CONTRADICTION.
        IDEA-20260808-b8e2d4 pre-registers, for VARIANT 2, a ratio of
        (6 * N)/B^3, about 600 at p = 101 and B = 10, with the falsifier
        "VARIANT 2 yields ratio < 10". COMPUTED, VARIANT 2 constructs R as a sum
        of three elements of V and then asks whether R is a sum of three
        elements of V. The answer is yes with probability exactly 1 for every p,
        every B and every m, so the predicted ratio fires with certainty and the
        nominated falsifier would require a sum of three elements of V not to be
        a sum of three elements of V. The band has width zero in the sense that
        matters, no alternative hypothesis can move the statistic.
      - >-
        SOURCE ARM REJECTED AS DEGENERATE. VARIANT 1's prediction, ratio
        1.0 plus or minus 0.2, is also forced, because a uniformly random point
        gives a uniformly random R and the decomposition probability is then
        exactly the exhaustive-search rate by definition. It is retained as an
        instrument sanity check with a forced value, not as evidence.
      - >-
        REPAIR, COMPUTED, NOT A LOOSENED THRESHOLD. The yield ratio is deleted
        and replaced by RANK CONTRIBUTION PER QUERY over the factor-base
        logarithm unknowns, which is the quantity that decides whether a
        relation is usable. Under the source's mechanism the value would be
        positive; under the accounting identity it is exactly 0. That is a real
        two-outcome discriminator, and the known-logarithm control shows the
        instrument returning a positive value on the same code path.
    surviving_band_and_its_separation: >-
      Zero arms, predicted 0.000, with a 95 percent upper bound of 3/2000 =
      0.0015 when no rank-increasing event is observed in 2000 queries.
      Known-logarithm control, predicted at or above 0.10 and computed as
      C(10,3)/1009 = 0.119 at the reference cell. Separation is a factor of
      about 79 between the null bound and the demonstrated positive.
      NON-DEGENERATE with dynamic range exercised in the direction that matters,
      namely showing the instrument can report a nonzero value.
    forced_quantities_recorded_as_proofs_not_arms:
      - >-
        The tautological character of the VARIANT 2 relation is an algebraic
        fact, not a measurement. It is stated in H-ECDLP-5cb5d0 and the
        tautology detector here records it operationally with a forced value of
        100 percent, which is a check on the implementation only.
  scale_relevance:
    tier: toy
    justification: >-
      7 to 11 bit prime fields, arity 3, B up to 50. Every number is a statement
      about those cells. The finding is an accounting identity and its
      generality is argued rather than extrapolated; behaviour at cryptographic
      p is not measured and is not claimed.
    correspondence: null
  tail_checks:
    - >-
      Report individually any single query in any zero arm that increased the
      rank, with its full relation. One such event is more informative than any
      pooled rate and would reopen the mechanism.
    - >-
      On the known-logarithm arm, compare the measured decomposition fraction
      against C(B,m)/N at the largest B, where dependence among subset sums
      would show first.
    - >-
      Report the distribution of new unknowns introduced per query on VARIANT 1,
      so that a zero net rank cannot be produced by a bookkeeping error that
      counts no unknowns at all.
  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 5
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 3
    maximum_memory_gb: 8
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - >-
      Run the known-logarithm dynamic-range control FIRST. If it returns a rank
      contribution per query below 0.10 or a verified-solve rate of zero, halt
      and report the instrument defect. No zero from any other arm is read.
    - >-
      Stop each arm at 2000 queries per cell, or earlier if a zero arm records
      any rank-increasing event, in which case report that event immediately and
      continue to completion for context.
    - >-
      If the zero arms' 95 percent upper bound exceeds 0.01 at any cell,
      increase the query count to reach 0.0015 or report the cell as
      UNDERPOWERED with that required count.
  invalidation_rules:
    - >-
      Rank is credited without an exact integer recomputation, or a new
      logarithm unknown introduced by a non-factor-base point is not counted.
    - >-
      The source proposal's yield ratio is reported as a measured confirmation
      of anything.
    - >-
      Any recovered k is accepted without independent re-verification by code
      disjoint from the solver.
    - >-
      The known-logarithm arm is reported as a result about oracles rather than
      as a control, or is presented as an attempt at H-ECDLP-a4c9c1's claim.
    - >-
      Any comparison drawn against EV-ECDLP-65b004's recorded artifact hashes
      rather than against runs/RUN-SEMAEV-f48dd1-grid/analysis.yaml recomputed
      directly.
    - >-
      Any timeout, crash, or memory exhaustion reported as evidence, contrary to
      AGENTS.md rule 5.
  success_criterion: >-
    All of the following on the same committed run set. The known-logarithm
    control returns a rank contribution per query at or above 0.10 and a
    strictly positive verified-solve rate; VARIANT 1 and VARIANT 2 both return
    exactly 0.000 rank contribution and 0.000 verified-solve rate at every cell,
    with the 95 percent upper bound at or below 0.0015; the tautology detector
    reports 100 percent on VARIANT 2; and the curve-free (Z/N, +) arm agrees
    with the elliptic arm, so that the closure is stated for cyclic-group index
    calculus generally. That combination is a complete, argued closure of the
    oracle-as-constructor reading at the tested scope, with a named obstruction
    and a named successor.
  falsification_criterion: >-
    Any of the following, scoped to the tested primes, factor-base sizes, arity
    3 and the pinned implementation. A zero arm returns a rank contribution
    above its 95 percent upper bound while the known-logarithm control fires
    correctly, which would mean the accounting identity is wrong and the
    source mechanism is live. Or the known-logarithm control fails to fire, in
    which case nothing is admissible and no closure follows. Or the curve-free
    arm disagrees with the elliptic arm, which would mean the elliptic
    accounting differs from the abelian one and the analysis must be redone.
  required_artifacts:
    - implementation source at a pinned revision, with the exact integer rank routine identified
    - per-arm per-cell relation lists, with the rank before and after each accepted relation
    - the unknown-count ledger per arm, showing every new logarithm unknown introduced
    - the known-logarithm dynamic-range control's results, reported before any zero
    - the tautology detector's per-relation output for VARIANT 2
    - the curve-free (Z/N, +) arm's full results in the same schema
    - the exhaustive-search relation truth per instance
    - any single rank-increasing event in a zero arm, reported in full
    - matched rho and BSGS operation and memory counts on the identical instances
    - manifest per AGENTS.md artifact policy, including seeds, environment and dirty-tree state
  assigned_to: executor
  approved_by: null
