# =============================================================================
# EXP-CANL-5b859e — version 1, not approved. Specified from
# IDEA-20261006-9deda5 / H-CANL-b9033d. Status is review_required.
# check_approval_capacity would accept an approving decision:
# GOAL-ENDO-001 holds 2 approved contracts with no run, cap 3.
# The contract is not runnable. The missing driver is a doubling-slope
# denominator comparison of y^2 = x^3 + 1 against y^2 = x^3 + x + 1
# at p = 13. harness/run_canl.py fits log-log slopes of a
# canonical-height lift ratio and does not form these rational
# slopes. There is no trial-plan.json. Success is the source idea's
# prediction: 13 * H(E_cm) >= H(E_gen). The concrete negative is
# 13 * H(E_cm) < H(E_gen) when both maxima are defined. This session
# did not compute a slope. Source idea bytes are blob
# f7ba500c552867a83c6cae4b1d1bc5fedb4c5e4e.
# =============================================================================
experiment:
  id: EXP-CANL-5b859e
  hypothesis_id: H-CANL-b9033d
  question_id: RQ-CANL-63098f
  goal_id: GOAL-ENDO-001
  source_idea: IDEA-20261006-9deda5
  version: 1
  title: >-
    Doubling-denominator size on y^2 = x^3 + 1 against
    y^2 = x^3 + x + 1 at p = 13
  status: review_required
  approved_by: null
  designed_at: '2026-10-07'
  frozen: false
  execution_authorized: false
  packaging_only: false
  approval:
    approved_by: null
    composing_decision: DEC-20261007-38717f
    withheld_reason: >-
      The launcher is missing, so the contract is not runnable.
      check_approval_capacity would not reject an approving
      decision on the count taken from origin/main: GOAL-ENDO-001
      holds 2 approved contracts with no run, and the cap in
      tools/portfolio_kpis.py is 3. There is no committed program
      that enumerates the non-2-torsion affine points of
      y^2 = x^3 + 1 and y^2 = x^3 + x + 1 over F_13, lifts x and y
      into {0, 1, ..., 12}, writes lambda = (3x^2 + A) / (2y) over
      Q in lowest terms, takes H as the maximum absolute
      denominator, and reports 13 * H(E_cm) - H(E_gen) together with
      one group-law check on each model. harness/run_canl.py fits a
      log-log slope of a canonical-height lift ratio. It does not
      build these two denominators. A search of origin/main for the
      phrases "H_cm" and "point_count_cm" under *.py and *.sage
      returned no path. experiments/EXP-ECDLP-OUTER-TRANSLATOR-001/src/exact_floor.py
      guards a zero field-inverse denominator and does not compare
      these two models. A trial plan requires that comparison. This
      session did not compute a slope.
    implementation_authorized: false
    scientific_execution_authorized: false
    scientific_execution_scope: >-
      When a later approval adds the missing comparison and the goal
      still has room under check_approval_capacity, work only at
      p = 13 on these two integer models. Do not call H a Néron-Tate
      height. Do not run Xedni and do not run Pollard rho.
    frozen: false
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
      applied: false

  objective: >-
    Decide whether the largest absolute denominator of the doubling
    slope, on nonnegative lifts of the non-2-torsion affine points,
    satisfies 13 * H(E_cm) >= H(E_gen) for E_cm: y^2 = x^3 + 1 and
    E_gen: y^2 = x^3 + x + 1. The idea's prediction is that the
    difference 13 * H(E_cm) - H(E_gen) is at least 0. The concrete
    negative is a strictly negative difference when both maxima are
    defined and the checks pass. No faster discrete logarithm is in
    scope.

  inputs:
    prime: 13
    model_cm: >-
      E_cm: y^2 = x^3 + 1. Coefficients A = 0, B = 1. The same
      equation is the integer model. It is not a p-adic canonical lift.
    model_gen: >-
      E_gen: y^2 = x^3 + x + 1. Coefficients A = 1, B = 1.
    lift: >-
      For each affine point over F_13 that is not 2-torsion, lift x
      and y to integers in {0, 1, ..., 12}. Skip a point whose y is
      divisible by 13. The same nonnegative residues are used on
      both models.
    slope: >-
      lambda = (3 x^2 + A) / (2 y) over Q, written in lowest terms.
      H is the maximum of the absolute values of those denominators.
      Do not search for a dependence among lifted points and do not
      run Xedni.

  controls:
    - id: slope-matches-group-law
      statement: >-
        At least one retained slope on each model, reduced modulo 13,
        matches the group-law double. Otherwise H is invalid.
    - id: both-maxima-defined
      statement: >-
        Each model contributes at least one slope. If either H is
        undefined, the comparison is refused.
    - id: j-gen-generic
      statement: >-
        j(E_gen) modulo 13 is neither 0 nor 1728. Otherwise the
        comparison is refused.
    - id: ordinary-nonsingular
      statement: >-
        Both models are nonsingular, and neither trace is divisible
        by 13. A singular or supersingular model is not scored.

  independent_variables:
    - which integer model, E_cm or E_gen
    - the affine point whose nonnegative lift supplies the slope

  metrics:
    primary:
      - id: denominator_gap
        statement: >-
          The integer 13 * H(E_cm) - H(E_gen). The idea's prediction
          is at least 0. The concrete negative, after both maxima
          are defined and the group-law, j-invariant, and ordinary
          checks pass, is a strictly negative value.
    secondary:
      - id: H_cm
        statement: the maximum absolute denominator on E_cm
      - id: H_gen
        statement: the maximum absolute denominator on E_gen
      - id: point_count_cm
        statement: >-
          the number of non-2-torsion points that contribute a slope
          on E_cm
      - id: point_count_gen
        statement: >-
          the number of non-2-torsion points that contribute a slope
          on E_gen
      - id: j_gen
        statement: j(E_gen) modulo 13
      - id: trace_cm
        statement: the trace of Frobenius of E_cm over F_13
      - id: trace_gen
        statement: the trace of Frobenius of E_gen over F_13

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says the CM model does not shrink this denominator by more
    than a factor of 13. An undefined maximum, a group-law mismatch,
    or a singular or supersingular model voids the comparison and
    does not by itself replace the gap with another integer.

  preregistered_prediction:
    quantity: >-
      The integer 13 * H(E_cm) - H(E_gen), together with the two
      counts of points that contribute a slope.
    formula: >-
      denominator_gap >= 0, and point_count_cm >= 1, and
      point_count_gen >= 1, when both models are nonsingular and
      ordinary and j(E_gen) is neither 0 nor 1728. The concrete
      negative, after those checks and the group-law check pass, is
      denominator_gap < 0. Source idea IDEA-20261006-9deda5,
      predictions minimum_effect at least 0 and at least 1 on each
      model. No slope was scored before this formula was written.
    source: >-
      IDEA-20261006-9deda5. RQ-CANL-63098f asks whether CM on the
      canonical lift changes the height quantity that makes Xedni
      fail. KR-IC-cd159a and KR-RHO-13bf67 were opened in this
      session. Neither states this denominator gap at p = 13.

  scale_relevance:
    tier: toy
    justification: >-
      The prime is 13. No transfer to another prime, to a p-adic
      canonical lift, or to cryptographic size is assumed. The
      minimum effect is the idea's own: 13 * H(E_cm) - H(E_gen) at
      least 0.
    correspondence: >-
      Direct enumeration of the affine points of two models over
      F_13. No sampling shortcut is used.

  tail_checks:
    - >-
      A gap of at least 0 meets the prediction only together with at
      least one retained slope on each model. A strictly negative
      gap, with the checks passed, is the negative.
    - >-
      The representative of y in {0, ..., 12} is part of the frozen
      lift. A later run does not replace it by the negative residue.

  replication:
    seeds:
      - EXP-CANL-5b859e|denominator|F13|Ecm
      - EXP-CANL-5b859e|denominator|F13|Egen
    independent_instances: 1
    note: >-
      One later manifest would cover both models and the group-law
      checks. No run id is minted in this session. The replication
      plan does not name a future run slot, because the trial plan
      is not frozen while status is review_required.

  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One later manifest would cover the frozen comparison at p = 13.
      Wall-clock and CPU figures are not set. The 1 GB figure is
      machine protection for a prime of 13. A watchdog expiry is
      failed_infrastructure, not a denominator gap.

  stopping_rules:
    - Stop after one reading row is named from the pinned denominators.
    - Do not change the predicted gap of at least 0 after seeing a denominator.
    - Do not score a second prime in this contract.
    - A timeout or crash voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - A retained slope that does not match the group law modulo 13 voids the run.
    - An undefined H, a singular or supersingular model, or j(E_gen) in {0, 1728} voids the run.
    - Calling H a Néron-Tate height, or transferring the gap to another prime, voids the run.
    - An Xedni search or a rho walk is out of scope and voids the run.

  success_criterion: >-
    Both models are nonsingular and ordinary, j(E_gen) modulo 13 is
    neither 0 nor 1728, each model contributes at least one
    non-2-torsion slope, at least one retained slope on each model
    matches the group-law double modulo 13, and
    13 * H(E_cm) - H(E_gen) is at least 0. That inequality is the
    prediction of IDEA-20261006-9deda5. The conjunction is reachable
    as a failure when the checks pass and the difference is strictly
    negative.

  falsification_criterion: >-
    Both models are nonsingular and ordinary, j(E_gen) modulo 13 is
    neither 0 nor 1728, each model contributes at least one slope,
    a retained slope on each model matches the group law modulo 13,
    and 13 * H(E_cm) is strictly less than H(E_gen). That is the
    concrete negative. An undefined maximum, a group-law mismatch,
    or a singular or supersingular model is not this sentence.

  decision_impact:
    on_positive: >-
      A later evidence review may record that, at p = 13 on these
      two integer models, the denominator proxy did not shrink under
      the CM model by more than a factor of 13. The generic-group
      exponent stays 1/2. No knowledge entry is promoted from this
      design record. The gap is not a Néron-Tate height.
    on_negative: >-
      A later evidence review may record that, at p = 13 on the same
      two models, 13 * H(E_cm) is strictly less than H(E_gen), so
      explanation A is false for this proxy on this pair only. The
      generic-group exponent stays 1/2. The two outcomes name
      different signs of 13 * H(E_cm) - H(E_gen).

  required_artifacts:
    - experiments/EXP-CANL-5b859e/runs/RUN-*/manifest.yaml
    - experiments/EXP-CANL-5b859e/runs/RUN-*/raw-result.json
    - experiments/EXP-CANL-5b859e/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: setup_invalid
      when: >-
        either H is undefined, a retained slope misses the group law,
        j(E_gen) is 0 or 1728, or either model is singular or
        supersingular
    - id: infrastructure
      when: the process aborts for memory or the process times out
    - id: denominator_shrinks
      when: >-
        both maxima are defined, the group-law, j-invariant, and
        ordinary checks pass, and 13 * H(E_cm) - H(E_gen) is strictly
        negative
    - id: denominator_holds
      when: >-
        both maxima are defined, the group-law, j-invariant, and
        ordinary checks pass, and 13 * H(E_cm) - H(E_gen) is at least 0
  reading_rule: >-
    Name exactly one row. denominator_holds is the only success row.
    denominator_shrinks is the concrete negative. setup_invalid and
    infrastructure are not the comparison with gap at least 0. Record
    H_cm, H_gen, both point counts, j_gen, and both traces beside the
    row. attack_claimed is false.
