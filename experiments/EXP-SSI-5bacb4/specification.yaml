# EXP-SSI-5bacb4
# Equality-bit quotient of eight endomorphisms on E[8].
# Frozen before any run. The partition below is a prediction, not a result.
experiment:
  id: EXP-SSI-5bacb4
  hypothesis_id: H-SSI-915a14
  source_idea: IDEA-20261004-edbd24
  question_id: RQ-SSI-1946c9
  goal_id: GOAL-SSI-2fa82a
  version: 1
  title: >-
    E[8] equality-bit fibers for iota and Frobenius on y^2 = x^3 + x
  status: approved
  frozen: true
  designed_at: '2026-10-05'
  approved_by: coordinator
  approval_decision_id: DEC-20261005-0305c1
  objective: >-
    List the sixty-four points of E[8] over F_{p^2}, apply each of
    the eight witnesses, and partition the witnesses by the set of
    points they fix.
  inputs:
    primes: [7, 23, 31]
    curve: "y^2 = x^3 + x"
    field: "F_p[i] / (i^2 + 1)"
    witnesses: "iota^a after pi^b, a in 0..3, b in 0..1"
    predicted_point_count:
      7: 64
      23: 576
      31: 1024
    predicted_e8_count:
      7: 64
      23: 64
      31: 64
    predicted_fiber_count:
      7: 7
      23: 7
      31: 7
    predicted_largest_fiber:
      7: 2
      23: 2
      31: 2
    predicted_replay_disagreements:
      7: 0
      23: 0
      31: 0
    predicted_fibers:
      7:
        - [[0, 0]]
        - [[0, 1]]
        - [[1, 1]]
        - [[2, 0]]
        - [[2, 1]]
        - [[3, 1]]
        - [[1, 0], [3, 0]]
      23:
        - [[0, 0]]
        - [[0, 1]]
        - [[1, 1]]
        - [[2, 0]]
        - [[2, 1]]
        - [[3, 1]]
        - [[1, 0], [3, 0]]
      31:
        - [[0, 0]]
        - [[0, 1]]
        - [[1, 1]]
        - [[2, 0]]
        - [[2, 1]]
        - [[3, 1]]
        - [[1, 0], [3, 0]]
    predicted_fix_counts:
      7: [64, 8, 8, 4, 8, 8, 2]
      23: [64, 8, 8, 4, 8, 8, 2]
      31: [64, 8, 16, 4, 8, 16, 2]
  controls:
    - >-
      Pair control. The witnesses (1, 0) and (3, 0) stay in one
      fiber at every prime and fix two points.
    - >-
      Negation control. The witness (2, 0) is iota squared and
      fixes four points, the rational 2-torsion, at every prime.
    - >-
      Nearby prime. p=7 and p=23 share one fixed-point vector.
      p=31 has 16 fixed points for (1, 1) and for (3, 1).
    - >-
      Two Frobenius routes. One uses (a + b i)^p = a - b i.
      The other raises each coordinate to the p-th power in
      F_{p^2}. They must not import each other's fibers.
    - >-
      Endomorphism check. iota squared equals negation on every
      point of E[8]. A failure invalidates the cell.
  independent_variables:
    - prime in {7, 23, 31}
    - frobenius_route in {closed_form, exponent}
  metrics:
    primary:
      - fibers
      - fix_counts
      - fiber_count
      - largest_fiber
      - routes_agree
    secondary:
      - point_count
      - e8_count
      - replay_disagreements
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: >-
      The witness partitions and fixed-point counts under inputs.
      Fiber counts are 7. Largest fibers are 2. Fixed-point counts
      are 64, 8, 8, 4, 8, 8, 2 at p=7 and p=23, and
      64, 8, 16, 4, 8, 16, 2 at p=31.
    formula: >-
      A fiber is a maximal set of witnesses with the same set of
      fixed points in E[8]. Membership is compared after sorting
      each witness pair as [a, b] and sorting each fiber by its
      pairs. Fibers are then sorted by length and then
      lexicographically. Fix counts follow that fiber order.
    source: >-
      IDEA-20261004-edbd24, specialized from E[4] to E[8] on this
      curve at the primes where E[8] lies in E(F_{p^2}). The
      partition was computed in the design session and is not a run.
  scale_relevance:
    tier: toy
    justification: >-
      Three primes and a 64-point module. No transfer to a
      cryptographic endomorphism-ring scheme. Primes 11 and 19
      are outside the boundary because 8 does not divide p+1.
    correspondence: null
  tail_checks:
    - >-
      p=31 must be reported. Dropping the cell whose fixed-point
      counts differ invalidates the batch.
    - >-
      The group order over F_{p^2} must be (p+1)^2, and E[8]
      must contain 64 points. Any other count invalidates the cell.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: >-
      Deterministic. One manifest per prime and Frobenius route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - Stop after six valid manifests.
    - Do not add a prime, a curve, or a torsion level.
    - Do not continue a cell after the routes disagree.
  invalidation_rules:
    - The two Frobenius routes disagree.
    - iota squared fails to equal negation on some point of E[8].
    - The point count is not (p+1)^2 or E[8] does not have 64 points.
    - A timeout, crash, or missing manifest.
  success_criterion: >-
    All six manifests are valid, the routes agree, iota squared
    equals negation, replay disagreements are 0, the sorted fibers
    match, fiber counts are 7, largest fibers are 2, and the
    fixed-point counts are 64, 8, 8, 4, 8, 8, 2 at p=7 and p=23
    and 64, 8, 16, 4, 8, 16, 2 at p=31.
  falsification_criterion: >-
    The routes agree, iota squared equals negation, the point
    counts are the required ones, and a fiber membership or a
    fixed-point count differs from the table. A route disagreement
    or a point-count failure does not meet this criterion.
  required_artifacts:
    - experiments/EXP-SSI-5bacb4/runs/<run-id>/command.txt
    - experiments/EXP-SSI-5bacb4/runs/<run-id>/stdout.txt
    - experiments/EXP-SSI-5bacb4/runs/<run-id>/stderr.txt
    - experiments/EXP-SSI-5bacb4/runs/<run-id>/result.json
    - experiments/EXP-SSI-5bacb4/runs/<run-id>/fibers.json
  assigned_to: executor
  out_of_scope:
    - Any torsion other than E[8].
    - Any prime outside {7, 23, 31}.
    - Any curve other than y^2 = x^3 + x.
    - A SÉTA, SiGamal, or LIT-SiGamal implementation.
    - Editing H-SSI-cb227f or EXP-SSI-494592.
