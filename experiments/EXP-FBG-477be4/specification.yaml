experiment:
  id: EXP-FBG-477be4
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-62354d; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-62354d
  question_id: RQ-FBG-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Instrument-validity run for a geometry-agnostic factor-base measurement module: exact reproduction
    of three closed-form synthetic geometries and port fidelity against the recorded exact values
    of previously measured geometries'
  objective: 'The one uncertainty a run reduces is whether a single shared measurement core can produce
    the quantities this bucket needs while reproducing numbers the program has already committed to.
    Stated in parts: (i) COUNTING CORRECTNESS - does the module reproduce, exactly and not approximately,
    the coverage and multiset totals of three synthetic geometries whose values are known in closed
    form, since a counting core that misses a closed form has a defect that would contaminate every
    later contract built on it; (ii) PORT FIDELITY - does the module reproduce the frozen battery''s
    recorded exact yield ratio of 1.000000 digit for digit and its recorded coverage ratios within
    a deviation the run reports and attributes to a specific convention difference, since a module
    that silently differs from committed numbers would create two incompatible measurement regimes
    in one program; (iii) INTERFACE ADEQUACY - can the previously measured geometries be expressed
    through the declared constructor-plus-predicate interface, or does one of them name a capability
    the interface lacks. A run cannot reduce uncertainty about any mathematical question: it establishes
    nothing about factor-base geometry, coverage, yield, relation rate, decomposition, linear algebra,
    or index-calculus cost. It also cannot validate the frozen battery''s conclusions, since reproducing
    a number tests the module against the record and not the record against the world. The deliverable
    is an agreement table, an expressibility list, and a defect list.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support at most this: the module, as implemented
      at the recorded commit, reproduces the stated closed-form synthetic values exactly or does not;
      reproduces the frozen battery''s recorded yield ratio of 1.000000 digit for digit or does not;
      reproduces its recorded coverage ratios to within the reported deviations, each attributed to
      a named convention difference or left unattributed; expresses the stated previously measured
      geometries through the declared interface or names the ones it cannot; and refuses, under unit
      test, to return a measurement record lacking its matched null. WHAT DOES NOT FOLLOW: nothing
      whatsoever about factor-base geometry, coverage behaviour, yield, relation rate, decomposition
      cost, linear-algebra cost or index-calculus cost, since the run is an instrument check and measures
      no research question; no validation of the frozen battery''s conclusions or of any recorded
      verdict; nothing about behaviour at sizes beyond those the exact counter can reach, which is
      toy scale by construction; nothing about wall-clock performance, machine variance or the program''s
      cost model, none of which are measured; and no attack, break, speedup or security consequence.'
  inputs:
    procedure: 'STAGE 0, interface declaration (cost: 2 human hours). Write the constructor-plus-predicate
      protocol and the certificate tuple shape, and freeze both before implementation. STAGE 1, core
      implementation (cost: 1 to 2 human days). Negation collapse and deduplication, exact multiset-sum
      counting over the complete target space, closed-form total check, coverage, three matched-null
      constructions drawn in-call, excess ratios, content hash. STAGE 2, charge instrumentation (cost:
      4 human hours). Counter wrappers around field and group primitives, active during the constructor
      call only, plus tracemalloc peak in words. STAGE 3, synthetic gate (cost: seconds of compute).
      Whole-curve, single-element and two-element geometries, requiring exact agreement; halt on any
      mismatch. STAGE 4, port fidelity (cost: minutes). Re-measure previously measured geometries
      at a recorded size and compare digit by digit, recording every deviation and attempting attribution
      to a named convention. STAGE 5, interface adequacy (cost: 4 human hours). Express each previously
      measured geometry through the interface, listing any that cannot be. STAGE 6, refusal test and
      report (cost: 2 human hours). Unit test that a null-free call raises; emit the agreement table
      and defect list.'
    instrument: Python 3 with harness/toycurve.py for exact curve arithmetic, negation, point generation
      and discrete-logarithm tables; numpy for count vectors; tracemalloc for peak construction memory
      in words; hashlib for the certificate content hash; harness/runner.py for the run manifest,
      recorded seeds and the inference block. No Sage, no timing calls in the measurement path, and
      no solver. The module deliberately depends on toycurve.py rather than reimplementing curve arithmetic,
      so that the existing verifier remains the single source of curve truth.
    parameters: 'Curves: 4 generated prime-order toy curves. Sizes: N near 2^12 and 2^14 for the synthetic
      gate; one size matching a recorded battery size for port fidelity. Synthetic geometries: 3 -
      whole-curve, single-element, two-element. Previously measured geometries targeted for reproduction:
      up to 6. Arity: m equal to 1, 2 and 3, so the closed-form total identity is exercised at three
      arities. Null definitions computed per call: 3. Seeds: 4 per cell. Primitive classes counted:
      6. Unit tests: at least 12, including the null-refusal test and the instrumented-versus-uninstrumented
      equality test.'
  controls:
  - Whole-curve synthetic geometry with coverage exactly 1 and a closed-form multiset total.
  - Single-element and two-element synthetic geometries with closed-form coverage.
  - Bit-identical comparison of instrumented against uninstrumented constructor output.
  - Port fidelity against the frozen battery's recorded exact values at a recorded size.
  - 'A refusal test: the module must raise rather than return when asked to skip the matched null,
    verified by a unit test.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object for the module itself is a SYNTHETIC GEOMETRY whose
    coverage and construction charge are known in closed form - for instance the whole-curve base,
    whose coverage is exactly 1 and whose multiset total is exactly binomial(B_eff + m - 1, m) with
    B_eff the full group size, and a single-element base whose coverage is exactly 1 over N. The module
    must reproduce these exactly, not approximately. For the module to be usable, it must also reproduce
    the frozen battery''s recorded exact yield ratio of 1.000000 for untyped geometries and its recorded
    coverage values within a stated tolerance; a module that cannot reproduce numbers this program
    has already committed cannot be trusted to produce new ones. The matched random null is not a
    control for the module but a required output of every call, and the module must refuse to return
    a record without it - which is the enforcement mechanism the program''s control-adequacy rule
    currently lacks.'
  independent_variables:
  - geometry supplied through the interface (synthetic, previously measured, or random)
  - arity m in 1, 2, 3
  - group size N
  - null definition (nominal, effective, multiset-count)
  - instrumented or uninstrumented constructor
  metrics:
    primary:
    - exact-agreement flag per synthetic closed-form geometry
    - digit-level agreement of reproduced yield ratio against the recorded value
    - deviation magnitude of reproduced coverage against recorded coverage per geometry
    - expressibility outcome per previously measured geometry
    - null-refusal unit test outcome
    secondary:
    - certificate internal-consistency check outcomes
    - instrumented against uninstrumented constructor equality flag
    - construction charge per geometry, per primitive class
    - closed-form total residual at each arity
    - count of convention differences identified and attributed
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Exact agreement on synthetic closed-form geometries, and digit-level agreement of the
      reproduced yield ratio against the recorded value.
    formula: For a base with effective size B_eff and arity m, the module must return a measured multiset
      total exactly equal to binomial(B_eff + m - 1, m) and, for the whole-curve geometry, coverage
      exactly 1, and for a single-element geometry, coverage exactly 1 over N. The reproduced yield
      ratio for an untyped geometry must equal 1.000000 to six decimal places, this value being forced
      by the counting identity rather than by convention. Coverage deviations are reported as the
      absolute difference from the recorded value with no pre-committed tolerance, for the reason
      given in the predictions block, and each is accompanied by an attribution to a named convention
      difference or an explicit statement that no attribution was found.
    source: Pre-registered in the parent proposal IDEA-20260816-62354d before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are N near 2^12 to 2^16 with arities 1 to 3 on 4 generated prime-order
      curves, and the module is bounded to toy scale by design because exact counting over the complete
      target space is a stated requirement rather than an implementation limitation. Transfer assumptions:
      none are made and none are permitted - the module''s outputs are exact at the sizes it runs
      and it simply refuses larger inputs rather than sampling, so there is no extrapolation surface.
      The one honest limitation is that port fidelity is checked at a single recorded size, so agreement
      there does not establish agreement at the frozen battery''s largest cells, and the run reports
      that gap rather than assuming continuity.'
    correspondence: null
  tail_checks:
  - Arity m equal to 1, where the closed-form total degenerates and an off-by-one in the multiset
    formula would surface.
  - The single-element geometry, the smallest nontrivial input.
  - The whole-curve geometry, the largest input, where the count vector is maximally dense.
  - A geometry whose effective size differs most from its nominal size, exercising the collapse path.
  - An empty geometry, which must raise rather than return a degenerate record.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - 'HALT at STAGE 3 on any synthetic closed-form mismatch: the counting core is defective and later
    stages would report meaningless agreement.'
  - Halt and report if instrumented and uninstrumented constructors differ.
  - Halt and report if the null-refusal unit test fails, since the module's central guarantee is then
    absent.
  - Implementation budget of 3 human days; if exceeded, ship the counting core with the charge instrumentation
    deferred and mark the charge fields absent rather than approximate.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All three synthetic closed-form geometries are reproduced exactly at all three
    arities, the recorded yield ratio is reproduced to six decimal places, instrumented and uninstrumented
    constructors agree bit for bit, the null-refusal unit test passes, and the run emits an agreement
    table with every coverage deviation reported and attributed or explicitly marked unattributed.
  falsification_criterion:
  - Any synthetic closed-form value is not reproduced exactly.
  - The recorded yield ratio is not reproduced to six decimal places.
  - Instrumented and uninstrumented constructors produce different bases.
  - A previously measured geometry cannot be expressed through the declared interface.
  - The module returns a record without a matched null under any code path.
  - A certificate fails its own internal-consistency checks.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-62354d
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Whether the certificate tuple shape should be frozen before or after the first three consuming
    contracts are written is a real design question a Coordinator must settle; freezing early risks
    ossification and freezing late risks the shared instrument arriving after the contracts that needed
    it.
  - The port-fidelity target is a battery whose experiment record is not machine-parseable and is
    cited by path; a Coordinator must decide what constitutes an acceptable reproduction target under
    that constraint.
  - Whether a shared instrument's correlated-defect risk outweighs the reproducibility gain over bespoke
    modules is not resolved here and is a genuine tradeoff a Coordinator should record either way.
  - The set of primitives to wrap for the construction charge is asserted rather than derived, and
    an unwrapped hot primitive would understate a geometry's cost systematically.
