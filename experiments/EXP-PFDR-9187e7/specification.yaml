experiment:
  id: EXP-PFDR-9187e7
  hypothesis_id: H-PFDR-cb9606
  question_id: RQ-ICEX-001
  idea_id: IDEA-20260830-f2e5b7
  batch_id: BATCH-c64bee
  version: 1
  recorded_at: '2026-09-04'
  drafted_under_task: TASK-20260904-9c61a9
  status: draft
  approved_by: null
  approved_at: null
  assigned_to: executor
  status_note: >-
    Frozen at the design stage; NOT submitted for approval and NOT authorized for
    implementation. SEPARATELY: RQ-ICEX-001 states in its own constraints that it
    is BLOCKED until three named goals each have a committed protocol or scoped
    measurement decision. This contract does not lift that block and may not be
    moved out of draft until the Coordinator records that the constraint is
    satisfied or amends it under a versioned protocol_amendment.
  title: >-
    One sweep routine, three crediting rules and a matched generic baseline on ONE
    frozen instance set under ONE frozen operation convention -- separating the
    two-channel exponent from the full-relation-only exponent by the FACTOR-BASE
    SWEEP at a single field size, and settling by a CURVE-FREE null whether the
    surviving gain is index calculus or generic collision search in an
    index-calculus costume.
  claim_ceiling: >-
    A within-model exponent for one rate-constant family at one arity. NO advantage
    over the generic baseline is claimed anywhere: the best point in the family
    ties it in time and loses by a square root in memory. The positive content is
    that a live sibling record exponent is wrong within its own model; the
    negative content is that correcting it does not produce an attack.
  claim_tier_basis: >-
    Toy tier. Every recovered logarithm carries a certificate re-verified
    independently of the solver. Operation counts are charged under one declared
    convention with a sensitivity row at three probe costs.
  objective: >-
    Establish, IN THIS ORDER: (1) that the empty-pool slice reproduces the
    committed per-trial charge symbolically and that the degenerate boundary arm
    reproduces the textbook generic constant, which are the two baseline
    embeddings; (2) the closed-form exponent surface with its branch crossover
    verified numerically; (3) the FACTOR-BASE SWEEP at a single field size, which
    is the discriminator, because the two models predict opposite dependence on
    the factor-base size; (4) the point-predicted arm ratio at the named cell; and
    (5) the CURVE-FREE null, which decides whether the gain is structural or
    generic and which is the single most important control in the design.
  band_non_degeneracy:
    statistic: >-
      the multiplicative change in total charged relation-collection operations
      per doubling of the factor-base size, at fixed field size
    null_value: >-
      1.00 per doubling, FLAT, which is the full-relation-only reading of the
      sibling record
    alternative: >-
      1.41 per doubling, a square-root rise, which is the two-channel reading on
      the lower branch
    computed_check: >-
      The admitted interval around the alternative is 1.41 plus or minus 25
      percent, i.e. [1.06, 1.76]. THE NULL VALUE 1.00 LIES OUTSIDE THAT INTERVAL,
      with a margin of 0.06 below the lower edge, so the two readings cannot both
      satisfy the criterion and the discriminator has genuine width. Over a 32x
      sweep of the factor-base size the two predictions separate by a factor of
      about 5.7 in the accumulated count, which is far above the seed spread of a
      deterministic operation counter.
    resolution: >-
      RETAINED AS WRITTEN, with two additions. First, the SEPARATION IS ACCUMULATED
      OVER THE WHOLE 32x SWEEP rather than judged per doubling, so a single noisy
      doubling cannot decide it. Second, because the two-channel arm performs many
      more hash probes per group operation than the full-relation arm, an unfair
      probe charge could manufacture the entire separation; a SENSITIVITY ROW at
      probe costs of 0.1, 1 and 10 group operations is therefore mandatory, and if
      the arm ratio drops below 3 at the highest probe cost the result is
      CONVENTION-DEPENDENT and must be labelled so on every row.
  inputs:
    field_sizes: '{2^12, 2^14, 2^16}; the discriminating sweep is at 2^16'
    B_sweep: 'a 32x range at each field size, up to 256'
    seeds: '5 per cell; derived exponents are seed-free and must be bit-identical across seeds'
    arms:
      - 'A: full relations only, the sibling record crediting rule'
      - 'B: two-channel, pool the whole coordinate set, partials stored in a hash table keyed by residual, pairwise combining, elimination, target recovery'
      - 'C: the degenerate boundary arm at vanishing factor-base size'
      - 'D: matched generic collision search on the identical instances under the identical counter'
    convention: >-
      ONE frozen convention declared before any cell runs: one charged operation is
      one group operation, with hash probes and pool membership tests charged at
      the same declared rate in every arm. THIS CONVENTION AND THE INSTANCE SET ARE
      SHARED WITH EXP-PFDR-2524f4, whose hypothesis DISAGREES WITH THIS ONE ABOUT A
      NUMBER; the disagreement is decidable only under one convention on one
      instance set, and both run packages record the same instance-set sha256.
    saturation_screen: >-
      cells with mean full-relation yield outside [0.05, 2], or with fewer than 4
      targets, are excluded BEFORE the run and never explained after
  controls:
    - id: CTRL-BOUNDARY-REPRODUCTION
      row_class: baseline
      blocking: true
      object: 'arm C against arm D, and arm D against the textbook generic constant'
      forced_disposition: >-
        Arm C must land within a factor 2 of arm D, and arm D must reproduce the
        textbook constant within the seed spread. THE FAMILY OWN BOUNDARY MEMBER
        IS THE BASELINE: if it does not reproduce the generic method, the claimed
        baseline embedding is false, the closure argument does not stand, and
        NOTHING ELSE in the record may be reported.
    - id: CTRL-EMPTY-POOL
      row_class: baseline
      blocking: true
      object: 'arm B with the pool disabled'
      forced_disposition: >-
        MUST reproduce arm A OPERATION FOR OPERATION, isolating the crediting rule
        as the only difference between the two models. Symbolically, the empty-pool
        slice must reproduce the committed per-trial charge.
    - id: CTRL-CURVE-FREE-NULL
      row_class: null_object
      blocking: true
      object: >-
        THE MANDATORY CURVE-FREE NULL AND THE MOST IMPORTANT CONTROL HERE. The
        group is replaced by a random bijection on the same key space with the
        same charged costs, and arm B is re-run. No curve, no group law, no
        summation polynomial.
      forced_disposition: >-
        FORCED SHAPE, NOT A FORCED VALUE. The BIRTHDAY branch MUST SURVIVE
        UNCHANGED, because it is generic and depends only on collision statistics
        over a key space. The FULL-RELATION branch MUST COLLAPSE, because it
        depends on the factor base being a structured subset that the group law
        maps into. A TWO-CHANNEL GAIN THAT SURVIVES IN BOTH BRANCHES IS GENERIC
        COLLISION FINDING WEARING AN INDEX-CALCULUS COSTUME: it must be reported
        as a statement about collision search, and NO elliptic-curve, summation
        polynomial or ECDLP language may appear anywhere in the deliverable.
    - id: CTRL-YIELD
      row_class: instrument
      blocking: true
      object: 'measured full-relation yield per target'
      forced_disposition: >-
        MUST equal the conservation mean with deviation consistent with the
        committed identity. A systematic nonzero deviation voids the cell.
    - id: CTRL-RATE-INVARIANT
      row_class: instrument
      blocking: true
      object: 'partials produced per charged operation'
      forced_disposition: >-
        FORCED EXACTLY 2, invariant in the factor-base size and in the field size
        to within 5 percent. This is the candidate-production-rate invariant the
        whole mechanism rests on; a measured rate that grows with the factor-base
        size means the sweep is not being charged what the model charges it and
        EVERY operation count is void.
    - id: CTRL-PROBE-SENSITIVITY
      row_class: instrument
      blocking: true
      object: 'the hash-probe charge'
      forced_disposition: >-
        A sensitivity row at probe costs 0.1, 1 and 10 group operations. If the
        arm ratio drops below 3 at probe cost 10, the separation is
        CONVENTION-DEPENDENT and must be labelled so on every row.
    - id: CTRL-RANK-NOT-COUNT
      row_class: instrument
      blocking: true
      object: 'the combined relation system'
      forced_disposition: >-
        The CREDITED quantity is MEASURED RANK, never measured relation count.
        Combined relations have low weight and can be rank-deficient in ways the
        count does not see; in particular the connected-component structure of the
        combining graph caps the usable equations.
    - id: CTRL-SEED-INDEPENDENCE
      row_class: instrument
      blocking: true
      object: 'the derived exponent surface'
      forced_disposition: 'FORCED bit-identical across seeds; only measured counts may vary.'
    - id: CTRL-CERTIFICATE
      row_class: honesty
      blocking: true
      object: 'every recovered logarithm'
      forced_disposition: >-
        FORCED: re-verified by an independent checker sharing no state with the
        solver.
    - id: PARETO-RHO-AND-BSGS
      row_class: pareto_control
      blocking: true
      object: 'the generic collision method with constant memory, and the memory-heavy generic method'
      forced_disposition: >-
        MANDATORY on every row, and MEMORY IS REPORTED BESIDE EVERY TIME. Memory
        equals time along the entire lower branch of this family, so a time-only
        comparison is FORBIDDEN in any deliverable from this contract.
  independent_variables:
    - 'field size in {2^12, 2^14, 2^16}'
    - 'factor-base size over a 32x range at each field size'
    - 'arm in {A, B, C, D} and the CURVE-FREE re-run of B'
    - 'seed'
    - 'probe charge in {0.1, 1, 10} group operations'
  metrics:
    primary:
      - 'total charged operations per arm, per (field size, factor-base size, seed). UNITS: group operations'
      - 'multiplicative change in relation-collection operations per doubling of the factor-base size, at fixed field size, and accumulated across the 32x sweep. UNITS: dimensionless ratio. THE DISCRIMINATOR.'
      - 'arm A operations divided by arm B operations at the named cell, on the identical frozen instances. UNITS: dimensionless ratio'
      - 'partials produced per charged operation, per cell. UNITS: partials per group operation, forced exactly 2'
      - 'relation-collection, combining and elimination operations, SEPARATELY. UNITS: group operations'
      - 'peak stored residuals and peak matrix memory, per arm, IN STORED GROUP ELEMENTS, on every time row. UNITS: group elements'
      - 'measured RANK of the combined system against the cycle-rank prediction. UNITS: rank (integer)'
      - 'arm C against arm D, and arm D against the textbook constant. UNITS: group operations; dimensionless ratio'
      - 'CURVE-FREE null results for both branches. UNITS: as above. THE ATTRIBUTION METRIC.'
      - 'symbolic exponent surface and its memory counterpart at three linear-algebra exponents, with the branch crossover. UNITS: exponents, verified to 1e-12'
    secondary:
      - 'measured full-relation yield against the conservation mean, per cell'
      - 'combining-graph degree distribution and largest component size'
      - 'certificate verification pass or fail for every recovered logarithm'
      - 'the probe-cost sensitivity rows'
      - 'the frozen convention and the shared instance-set sha256'
  heuristic_under_test: >-
    HEUR-001 (residual equidistribution and the birthday count over pool keys) and
    HEUR-002 (combining-graph rank) of H-PFDR-cb9606.
  preregistered_prediction:
    quantity: >-
      The factor-base dependence of arm B; the arm ratio at the named cell; the
      production-rate invariant; the boundary reproductions; the exponent surface;
      the memory rows; and the curve-free null.
    formula: >-
      Arm B relation-collection operations RISE as the square root of the
      factor-base size on the lower branch: 1.41 per doubling with a tolerance of
      plus or minus 25 percent, i.e. an admitted interval of [1.06, 1.76], which
      EXCLUDES the flat value 1.00 predicted by the competing model. ARM RATIO at
      the named cell PREDICTED 32 from the closed form, REQUIRED at least 10, and
      a value below 3 falsifies the partial channel as exponent-moving there. The
      point prediction was recomputed by the drafting coordinator: with the pool
      the whole coordinate set, the sweep produces 128 residuals per target, the
      required partial count is about 1448 so 16 targets suffice at 2048 stored
      partials, the pair count is exactly the required 64 combined relations, and
      the charged cost is 16 times 64 = 1024 operations against about half the
      group order for the full-relation-only arm. PARTIALS PER OPERATION EXACTLY
      2. ARM C within a factor 2 of ARM D; ARM D at the textbook constant. THE
      INFIMUM of the exponent surface over positive factor-base exponents EXACTLY
      one half at every admitted linear-algebra exponent, verified to 1e-12.
      CURVE-FREE NULL: birthday branch unchanged, full-relation branch collapsed.
    source: >-
      H-PFDR-cb9606 claims (A) to (F) and predictions P1 to P9. The committed
      per-trial charge and the conservation mean were read verbatim by the
      drafting coordinator, who also recomputed the point prediction arithmetic
      above. FIXED ON 2026-09-04, BEFORE ANY CELL RUNS. The convention, the
      tolerance, the saturation screen and the probe-sensitivity requirement are
      part of the frozen contract and are never adjusted after an outcome is seen.
  scale_relevance:
    tier: toy
    justification: >-
      Field sizes at most 2^16 and factor-base sizes at most 256. THE
      DISCRIMINATOR IS A WITHIN-SIZE SWEEP OF THE FACTOR-BASE SIZE AT FIXED FIELD
      SIZE, deliberately chosen because this lane own estimator audits show a
      four-point size ladder is not identifiable at toy sizes. The exponent
      statements are DERIVATIONS WITHIN A COST MODEL and are not validated at
      cryptographic scale by any part of this contract.
    correspondence: 'none; instances are generated directly'
  tail_checks:
    - >-
      The largest factor-base cell at the discriminating field size, reported
      separately, where the two predicted counts differ most and where the memory
      row is largest.
    - >-
      The number of residual values occurring three or more times against the
      triple-coincidence rate, since an excess of multiple coincidences is the
      signature of residual concentration and would inflate the combining yield
      for a reason unrelated to the mechanism.
    - >-
      The maximum observed pool-hit count per target against the binomial upper
      tail.
    - >-
      The combining-graph degree distribution and largest component size against
      the giant-component threshold, since the component structure and not the
      edge count is what caps the usable equations.
  replication:
    seeds: ['5 independent seeds per cell, values recorded in the run package']
    independent_instances: 12
    reason: >-
      Twelve generated prime-order curves, exhaustive over the complete target set
      at the smallest field sizes where feasible, and five seeds per cell so the
      spread of a deterministic counter across instances can be reported. Derived
      exponents are seed-free and must be bit-identical.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 4
    maximum_memory_gb: 8
    maximum_runs: 300
    maximum_workers: 1
    notes: >-
      Pure Python. NO Macaulay matrix and NO Groebner basis. The largest object is
      a hash table of at most a few thousand residuals plus a matrix of side at
      most 256 -- under 10 MB. This contract cannot reproduce any
      resource-exhaustion stop because it never allocates a monomial space, and
      such a stop would be an INFRASTRUCTURE outcome under AGENTS.md rule 5 in any
      case.
  stages:
    - id: stage-0-baselines
      purpose: >-
        verify symbolically that the empty-pool slice reproduces the committed
        per-trial charge and that the degenerate boundary slice reproduces the
        birthday count; freeze the convention and the shared instance set with
        its sha256
      blocking: true
    - id: stage-1-symbolic-surface
      purpose: >-
        emit the exponent surface and its memory counterpart on a grid at three
        linear-algebra exponents, verify the branch crossover, and place every
        grid point on a time-memory plane against the generic baselines
      blocking: true
    - id: stage-2-measurement
      purpose: >-
        one sweep routine with three crediting rules over one frozen instance set
        with one operation counter, sweeping the factor-base size over 32x at each
        field size, with the matched generic arm on the identical instances
    - id: stage-3-curve-free-null
      purpose: >-
        the random-bijection re-run of arm B, both branches; BLOCKING FOR
        ATTRIBUTION and the most important control in the design
      blocking: true
    - id: stage-4-analysis
      purpose: >-
        fit the factor-base dependence at fixed field size, report the arm ratio,
        the production rate, the boundary reproduction, the memory rows and the
        probe-sensitivity rows
    - id: stage-5-report
      purpose: >-
        file any correction against the sibling record as a
        correction-by-reference PROPOSAL for the Coordinator, never as an edit,
        and state the surviving conclusion in the exponent-surface form
  stopping_rules:
    - 'STOP at stage 0 if either baseline slice fails to reproduce symbolically.'
    - >-
      STOP if arm D does not reproduce the textbook constant, or arm C does not
      land within a factor 2 of arm D. Nothing else may be reported.
    - >-
      STOP if the production-rate invariant is not exactly 2 within 5 percent. The
      sweep is not being charged what the model charges it.
    - >-
      Stage 3 is NOT optional and is NOT conditional on stage 2 outcome. Reporting
      stage 2 without stage 3 is an invalidation, not a shortcut.
    - 'Cells failing the saturation screen are excluded BEFORE the run, never explained after.'
  invalidation_rules:
    - >-
      Charging hash probes differently in the two arms, or omitting the
      probe-sensitivity rows, INVALIDATES the comparison: the two-channel arm
      performs many more probes per group operation and an unfair charge could
      manufacture the entire separation.
    - >-
      Reporting any time row without its MEMORY row INVALIDATES it. Memory equals
      time along the entire lower branch and the generic constant-memory method
      pays none, so a time-only comparison is forbidden.
    - >-
      Crediting measured relation COUNT rather than measured RANK INVALIDATES the
      cell.
    - >-
      Fitting a size ladder rather than the within-size factor-base sweep, and
      quoting an exponent from it, INVALIDATES the inference: this lane own audits
      show a four-point toy size ladder is not identifiable.
    - >-
      Reporting arm B without the CURVE-FREE null beside it INVALIDATES the
      report. Describing a gain that survives the null in BOTH branches as index
      calculus, as a statement about elliptic curves, or as an ECDLP result
      INVALIDATES the artifact: it is generic collision search.
    - >-
      Editing or restating the status of the sibling record from inside this run
      package INVALIDATES it. Only a Coordinator decision may supersede or amend
      it, and the correction discipline forbids editing.
    - >-
      Quoting the conclusion without "rate-constant oracle" or without the arity
      qualifier INVALIDATES the statement under AGENTS.md rule 4.
    - >-
      Treating this contract as authorized while the standing question-level block
      is in force INVALIDATES the execution.
  success_criterion: >-
    Decidable from the primary metrics, ALL of: (1) both baseline slices reproduce
    symbolically and the convention and instance set are frozen with a recorded
    sha256 shared with the sibling contract; (2) the exponent surface verifies to
    1e-12 and its infimum is exactly one half at every admitted linear-algebra
    exponent; (3) arm D reproduces the textbook constant and arm C lands within a
    factor 2 of it; (4) the production-rate invariant is exactly 2 within 5
    percent at every cell; (5) the factor-base sweep is reported per doubling and
    accumulated over 32x, with the arm ratio at the named cell and the
    probe-sensitivity rows; (6) memory is reported beside every time row in stored
    group elements; and (7) the CURVE-FREE null is run for BOTH branches and
    reported.
    SUCCESS IS BATTERY INTEGRITY, NOT A PARTICULAR EXPONENT.
  falsification_criterion: >-
    ANY of the following, evaluated in this order and reported by name.
    F1 DERIVATION FALSIFIED: arm B operation counts are FLAT in the factor-base
    size within a factor 1.2 over the 32x range. The two-channel derivation falls
    and the sibling record crediting rule stands.
    F2 CHANNEL NOT EXPONENT-MOVING: the arm ratio at the named cell is below 3.
    F3 BASELINE EMBEDDING FALSE: arm C does not reproduce arm D within a factor 2,
    or arm D does not reproduce the textbook constant.
    F4 ATTRIBUTION DENIED: the CURVE-FREE null reproduces the two-channel gain in
    the FULL-relation branch as well as the birthday branch. The gain is generic
    collision search and the record must be re-described as a statement about
    collision finding, with no curve language anywhere.
    F5 BIRTHDAY COUNT WRONG: combined relations fall short of the predicted pair
    count by more than a factor 4.
    F6 COMBINING STAGE BINDS: measured rank falls short of the cycle-rank
    prediction by more than 20 percent. No exponent may be quoted until the
    exponent is restated.
    F7 KNOWN-ANSWER GATE FAILED: the extension-field instantiation does not tie
    the generic baseline at the smallest extension degree and beat it above.
    F8 CONVENTION-DEPENDENT: the arm ratio drops below 3 at probe cost 10.
    F9 EVERYTHING HOLDS: the question decision target has a structural answer at
    this arity, and the sibling record parts require correction by reference,
    proposed to the Coordinator and never as an edit.
  artifact_package_directory: experiments/EXP-PFDR-9187e7/runs/RUN-001/
  required_artifacts:
    - 'experiments/EXP-PFDR-9187e7/runs/RUN-001/convention.yaml (the frozen operation convention, the shared instance set with its sha256, and this contract sha256; the sibling contract must record the same instance-set sha256)'
    - 'experiments/EXP-PFDR-9187e7/runs/RUN-001/baselines.yaml (the empty-pool symbolic reproduction and the degenerate-boundary symbolic reproduction)'
    - 'experiments/EXP-PFDR-9187e7/runs/RUN-001/exponent-surface.yaml (the surface and its memory counterpart at three linear-algebra exponents, the branch crossover, and the verification residuals)'
    - 'experiments/EXP-PFDR-9187e7/runs/RUN-001/measurements.yaml (per arm per cell: total operations, separated relation and combining and elimination counts, partials per operation, measured yield, measured rank, peak stored residuals, peak matrix memory, seed, curve)'
    - 'experiments/EXP-PFDR-9187e7/runs/RUN-001/sweep.yaml (the per-doubling and accumulated factor-base dependence at the discriminating field size, with the admitted interval and the excluded competing value stated)'
    - 'experiments/EXP-PFDR-9187e7/runs/RUN-001/curve-free-null.yaml (the random-bijection re-run of both branches, with an explicit statement of what each outcome licenses and forbids)'
    - 'experiments/EXP-PFDR-9187e7/runs/RUN-001/probe-sensitivity.yaml (the arm ratio at probe costs 0.1, 1 and 10, and the convention-dependence determination)'
    - 'experiments/EXP-PFDR-9187e7/runs/RUN-001/combining-graph.yaml (degree distribution, component sizes, measured rank against the cycle-rank prediction)'
    - 'experiments/EXP-PFDR-9187e7/runs/RUN-001/certificates/ (one per recovered logarithm, with independent verification results)'
    - 'experiments/EXP-PFDR-9187e7/runs/RUN-001/execution-report.md (stage by stage; the success-criterion checklist; which of F1 to F9 fired; per-file sha256; the inference block; and explicit statements that memory accompanies every time row, that no advantage over the generic baseline is claimed, and that the sibling record was not edited)'
  interpretation_limits:
    - >-
      NOT AN ECDLP HARDNESS RESULT AND NOT A LOWER BOUND ON ANY ALGORITHM OUTSIDE
      THE FAMILY. It characterises one rate-constant family at one arity under one
      cost model.
    - >-
      SCOPED TO ONE ARITY AND TO RATE-CONSTANT ORACLES. FORWARD GUIDANCE: the
      factor base pays for itself only if the oracle decides asymptotically more
      candidate tuples than it performs operations. Every oracle this program has
      charged has constant rate and is therefore inside the family and capped at
      the generic exponent. The classes that REMAIN OPEN are the
      superconstant-rate ones.
    - >-
      NO ADVANTAGE OVER THE GENERIC BASELINE IS CLAIMED ANYWHERE. The best point
      ties it in time and loses by a square root in memory, and MEMORY IS THE
      HIDDEN PRICE: the two-channel arm stores a large residual table where the
      generic constant-memory method stores nothing.
    - >-
      Because the family lower branch IS the birthday bound, a confirming result is
      expected to be reproduced IN PART by an object with no curve in it. That is
      stated in advance, and the curve-free null governs the attribution rather
      than decorating it.
    - >-
      A CORRECTION IS NOT A VERDICT. The two records in this batch that disagree
      about the exponent must be adjudicated on shared instances under the shared
      convention before either is cited as settling the other.
    - >-
      THE QUESTION IS UNDER A STANDING BLOCK, recorded in its own constraints. This
      design does not lift it.
    - >-
      THE EXTERNAL LITERATURE IS NOT ADJUDICATED. The large-prime variation is
      classical in adjacent settings and no novelty is claimed for it; the primary
      sources were not opened by any agent under this task.
  dominated_by: >-
    As an ATTACK the family is dominated at every positive factor-base exponent:
    by the generic collision method on both axes; by the memory-heavy generic
    method on both axes for positive exponents and tied at the degenerate
    boundary; by the multi-target variant; by the memory-parameterised variant at
    every memory budget along its tradeoff curve; and by the generic preprocessing
    frontier, which this family does not approach. Data and queries: both arms are
    query-free, so no separation exists on that axis. As a COST-MODEL STATEMENT
    the incumbents are the sibling record pair and an existing two-regime formula;
    this contract CONTRADICTS the former exponent and EXTENDS the latter excluded
    scope rather than being dominated by either. NOT NULL ON ANY AXIS.
  sota_delta: >-
    Zero speedup against any attack baseline. Content delivered: a within-model
    exponent surface for this arity with its infimum pinned and its boundary
    identified as the generic method itself; a falsification of a live sibling
    record floor within that record own model; a 32x factor-base discriminator at a
    single field size, replacing a size ladder this lane own audits show is not
    identifiable; and a curve-free null that decides whether the surviving gain is
    index calculus or generic collision search.
  id_allocation_provenance: >-
    EXP-PFDR-9187e7 pre-allocated by the tasking Coordinator in
    TASK-20260904-9c61a9 against IDEA-20260830-f2e5b7. Nothing was minted.
  yaml_parse_disclosure: >-
    Written without an interpreter; prose values are folded block scalars or
    quoted scalars; no tabs; no duplicate keys to the author reading. The
    orchestrating session must run a strict parse and tools/validate_ledger.py.
