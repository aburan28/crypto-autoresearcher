experiment:
  id: EXP-MONO-64aaa4
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-08-31'
  coordinator_approval_rationale: >-
    APPROVED. This contract tests H-MONO-1d50ac, converted this session
    from IDEA-20260831-d29a71, which is the single proposal in this
    lane's refreshed backlog most directly aimed at RQ-MONO-001's own
    decision target as KN-OPEN-009 states it verbatim: an exceptional-
    family (CM-curve) test at a locus (m=4 root-multiplicity, not cycle
    type) already confirmed non-degenerate (EV-MONO-a0a89c OBS-5/OBS-6
    show the cycle-type instrument constant on exactly this sublocus).
    (1) THIS IS A NEW, SELF-CONTAINED CONTRACT, NOT A REVIVAL OF
    EXP-MONO-12ce1c: that contract was never executed and this one does
    not depend on it running; it reuses EXP-MONO-12ce1c's own frozen
    construction conventions (curve/factor-base construction, sign
    convention, seed derivation) for fidelity to H-MONO-45183a's own
    already-specified predictions, under this contract's OWN domain and
    seeds. (2) SAME STANDALONE-BRANCH AUTHORITY AS ALL PRIOR MONO
    CONTRACTS THIS SESSION: GOAL-MONO-001 is `paused` with its campaign
    budget exhausted; this draws on none of it. (3) NO CLAIM ON
    GOAL-ECDLP-001 OR GOAL-RELN-001 TERRITORY: fully self-contained toy
    computation, no write outside this experiment's own directory. (4)
    THE MATCHED-PAIR SEARCH (STAGE 0) IS THE CONTRACT'S OWN NEW CONTENT;
    EVERYTHING DOWNSTREAM OF A FOUND PAIR REUSES H-MONO-45183a PART B'S
    ALREADY-DERIVED, UNMODIFIED FORMULAS (B-1, B-2), so approval risk is
    confined to whether the search and comparison design is sound, not
    to any new mathematics.

  hypothesis_id: H-MONO-1d50ac
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  title: >-
    Matched-(N,tau) CM-vs-ordinary m=4 root-multiplicity collision-rate
    comparison: does H-MONO-45183a Part B's closed form 6(tau-1)/N hold
    identically for curves with different endomorphism rings at the same
    (N,tau)?

  objective: >-
    Decide, at toy scale, whether H-MONO-45183a Part B's collision-rate
    closed form is complete as a function of (N,tau) alone, by finding a
    genuine matched-(N,tau) CM/ordinary curve pair and comparing their
    measured m=4 root-multiplicity collision rates directly against each
    other, not merely each independently against the shared formula.

  relation_to_the_goals_pause: >-
    GOAL-MONO-001 is `paused` with its own batch campaign budget
    (maximum_batches: 3) exhausted; this is a standalone experiment under
    the classic lifecycle, identical in authority basis to every other
    standalone MONO contract approved this session, per DEC-20260810-2f86db's
    own text (binds resuming the campaign's own batch sequence, not a
    standalone contract).

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection at scale.
    - Not an ECDLP cost, runtime, asymptotic, exponent, cryptographic-scale, or deployed-scheme claim.
    - >-
      Not a re-derivation of H-MONO-45183a Part B's closed form: B-1's
      collision criterion and B-2's branch probabilities are reused
      unmodified, exactly as that record states them.
    - >-
      Not a claim about m != 4, extension fields, or any curve family
      beyond non-singular short-Weierstrass prime-field curves.
    - Not a claim on GOAL-ECDLP-001's or GOAL-RELN-001's territory.
    - Not approved for any purpose beyond what this record states once run.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: whether ONE matched-(N,tau) CM/ordinary pair (plus a
      replication pair, if a second is found) shows agreeing or
      disagreeing m=4 root-multiplicity collision rates, within the
      stated statistical tolerance, at toy scale. Cannot certify the
      closed form's completeness for every curve or CM discriminant.
    what_no_outcome_can_support: >-
      No outcome establishes anything about m != 4, extension fields, or
      cost/exponent. A found disagreement identifies a curve-specific
      deviation at toy scale for ONE tested pair; it does not by itself
      characterize the full exceptional family's size or cryptographic
      relevance. AGENTS.md rule 7.

  inputs:
    field_bits_search_range: >-
      Enumerate primes p in [101, 3000] in increasing order (the SAME
      prime range this lane's other MONO experiments use) as the Stage-0
      matched-pair search range, declared before the search runs.
    m_value: 4
    null_draws_per_curve: 20000
    null_draws_note: >-
      Matches this lane's own established floor for the sublocus
      root-coincidence measurement (EXP-MONO-12ce1c's own
      sublocus_tuples_per_cell, and H-MONO-45183a's own test_boundary
      commitment). This is a DIRECT (not permutation-null) measurement --
      it counts admissible tuples and their collision outcomes directly,
      not a matched-random-subset comparison -- so KN-TECH-95a42b's
      floor-vs-threshold check does not apply to the per-curve rate
      itself; it DOES apply to the Stage-2 two-sample comparison test
      (see arms_and_controls.comparison_test_power_check below).
    domain: EXP-MONO-64aaa4/v1
    seed_derivation_rule: >-
      Every draw uses SHA-256 of the ASCII bytes of
      domain || "|" || label || "|" || decimal(p) || "|" ||
      decimal(role) || "|" || decimal(draw_index) || "|" ||
      decimal(counter), big-endian unsigned, with rejection sampling
      against modulo bias. Labels used, and no others: "curve-a",
      "curve-b", "fb-x". `role` distinguishes the CM and ordinary members
      of a matched pair ("cm", "ord") so their streams are disjoint.
      Reused mechanism from EXP-MONO-12ce1c's own seed rule, under this
      contract's OWN domain.
    curve_construction_ordinary_member: >-
      For a candidate prime p: for t=0,...,65535, a_t=int(SHA256(
      seed("curve-a","ord",p,0,t))) mod p, b_t=int(SHA256(seed(
      "curve-b","ord",p,0,t))) mod p; reject if (4a_t^3+27b_t^2) mod p=0;
      reject j in {0,1728} (A=0 or B=0) to keep the ordinary member
      generic. Accept the first non-singular, ORDINARY (#E(F_p) mod p !=
      1) candidate. Reused verbatim from EXP-MONO-12ce1c's own ordinary-
      curve construction, under this contract's own domain.
    curve_construction_cm_member: >-
      For the SAME candidate prime p: construct the j=0 curve (A=0, B
      the first accepted value of the b-stream under label "curve-b" with
      role "cm", rejecting B=0) and the j=1728 curve (B=0, A the first
      accepted value under label "curve-a" with role "cm", rejecting
      A=0), exactly as EXP-MONO-12ce1c's own panel-member construction
      specifies. Both are recorded; either qualifies as "the CM member"
      for the matched-pair search below. A non-j=0/1728 small-discriminant
      CM curve is EXPLICITLY OUT OF SCOPE for this contract's own budget
      (named as a valuable, disclosed follow-up in H-MONO-1d50ac's own
      confounders, not attempted here).
    factor_base_construction: >-
      Identical to EXP-MONO-12ce1c's own rule: scan x=0,...,p-1 in
      increasing order; retain x when (x^3+Ax+B)^((p-1)/2) mod p = 1
      (nonzero squares only; f(x)=0 excluded, exclusion count recorded).
      The retained ordered list is the factor base; its SHA-256 is
      committed before any tuple is drawn. Sign convention: fixed-sign
      arm uses the smaller of the two square roots in [0,p); random-sign
      arm draws the sign from label "fb-x". BOTH ARMS ARE RUN (HEUR-COIN-1).

  stage_order_and_the_terminating_stage:
    principle: >-
      Cheapest decisive gate first. STAGE 0 IS NEAR-ZERO COMPUTE (curve
      construction and point-counting at toy p) AND CAN END THE CONTRACT
      WITH A REPORTABLE BOUNDED NEGATIVE if no matched pair is found.
    stage_0:
      name: matched-(N,tau) pair search
      compute: seconds to low minutes, scales with the declared prime range
      description: >-
        For each prime p in the declared range, construct the ordinary
        member and both CM candidates (j=0, j=1728) exactly per `inputs`
        above, computing (N,tau)=(#E(F_p), #E(F_p)[2]) for each. Record
        every constructed curve's (p,N,tau,role). Report the FIRST prime
        at which an ordinary curve and AT LEAST ONE CM candidate (at that
        SAME prime or, if declared explicitly in advance, at a different
        prime within the range) share the identical (N,tau) pair. If
        several matches occur within the range, report the smallest-p
        match as the primary pair and the next as the replication pair
        (Stage 3), if any.
      terminates_the_run_if: >-
        No matched-(N,tau) pair is found within the declared range
        [101,3000]. Report this exhaustively and explicitly as a bounded
        negative/instrument outcome (H2's own falsification condition,
        H-MONO-1d50ac). This is NOT evidence for either direction of the
        main claim and spends no further compute.
    stage_1:
      name: independent reproduction of G6/G7 on each matched curve
      compute: minutes
      description: >-
        On EACH matched curve independently (using ONLY that curve's own
        factor base and its own draws), measure the m=4 root-multiplicity
        collision rate per B-1/B-2 (draw 20000 admissible 4-tuples of
        distinct factor-base x-coordinates under label "fb-x", compute
        the 4 signed-sum x-coordinates via group arithmetic, count
        collisions). Compare each curve's own rate against ITS OWN
        G6/G7-predicted value (exactly 0 if tau=1; 6(tau-1)/N within 3
        binomial standard errors otherwise) BEFORE Stage 2 is entered.
      terminates_the_run_if: >-
        Either matched curve fails to reproduce its own G6/G7-predicted
        rate independently. This halts the comparison and implicates the
        implementation, not H-MONO-1d50ac's own main claim -- report as
        `failed_infrastructure`, do not proceed to Stage 2.
    stage_2:
      name: direct curve-to-curve comparison, gated on Stage 1 passing on both curves
      compute: seconds
      description: >-
        Compare the two matched curves' measured collision counts
        directly via a two-sample test (Fisher exact on the 2x2 table of
        {collision, no-collision} outcomes across the two curves' 20000
        tuples each, for the tau>1 case; for a tau=1 matched pair, the
        comparison is the exact-zero check itself, not a statistical
        test). This is the PRIMARY, headline result.
    stage_3:
      name: replication at a second matched pair, if found in Stage 0
      compute: minutes
      description: >-
        Repeat Stages 1-2 identically on the second matched pair, if
        Stage 0 found one within the declared range and budget permits.

  arms_and_controls:
    treatment: >-
      Two matched curves (one CM, one ordinary) sharing (N,tau), each
      measured independently per Stage 1, then compared directly per
      Stage 2.
    nearby_object_control: >-
      MANDATORY, PER H-MONO-1d50ac'S OWN proof_search_map. If the
      matched pair found has tau=1, BOTH curves are forced to EXACTLY 0
      collisions -- the sharpest possible agreement test (an exact-zero
      prediction, not a statistical band). This control is checked
      BEFORE any tau>1 pair's statistical agreement is trusted, and a
      single observed collision on either tau=1 curve is a hard
      falsification of H-MONO-45183a's own G6, independent of this
      contract's own comparison question.
    dual_convention_control: >-
      BOTH the fixed-sign and random-sign arms (HEUR-COIN-1) are run for
      each matched curve; a mismatch beyond HEUR-COIN-1's own declared
      standard-error tolerance is reported as that heuristic's own
      falsification, per H1 in H-MONO-1d50ac.
    comparison_test_power_check: >-
      DESIGN-TIME CHECK, PERFORMED HERE, PER KN-TECH-95a42b'S OWN LESSON
      (applied to a Fisher-exact two-sample test rather than a
      permutation p-value, but the same discipline): at n=20000 tuples
      per curve, a Fisher-exact test on a 2x2 table with expected
      collision counts of order tau*20000/N (typically single digits to
      low tens at toy N) has adequate resolution to detect a
      multiplicative rate difference of order 2x or more between the two
      curves; it is NOT powered to detect a sub-20% relative difference
      at these small expected counts. This is disclosed explicitly so a
      null Stage-2 result is read as "no LARGE deviation detected," not
      as "the rates are provably identical to arbitrary precision" --
      matching H-MONO-1d50ac's own confounders block ("SAMPLE SIZE AT
      THE MATCHED-PAIR TAU>1 CELL... a null result... is reported as
      bounded to that budget").
    comparability_policy: >-
      No comparison of measured numbers with EXP-MONO-12ce1c, EXP-MONO-4c7479,
      EXP-MONO-2a13d7, or any other contract in this lane is licensed --
      distinct domain, distinct seeds, distinct (matched-pair) panel
      construction. The comparison this contract DOES license is the
      internal CM-vs-ordinary direct comparison declared above.

  metrics:
    primary:
      - "M1: Stage-0 search outcome (matched pair found: yes/no; if yes, at which p, N, tau)."
      - "M2: each matched curve's independently measured collision count and rate, both sign conventions."
      - "M3: Stage-2 two-sample comparison result (Fisher-exact p-value for tau>1; exact pass/fail for tau=1)."
      - "M4: Stage-3 replication outcome, if a second pair is found."
    secondary:
      - Per-curve (p, A, B, N, n1, n2, tau, j-invariant, role) construction transcript.
      - Factor-base size and digest per curve.
      - Fixed-sign vs random-sign arm agreement per curve.

  preregistered_prediction:
    - quantity: M1
      value: >-
        A matched pair found within [101,3000] (expected but not
        guaranteed, per H2); non-find is a reportable bounded negative.
      formula: Deuring class-number correspondence (motivational only, not a load-bearing derivation step -- see H-MONO-1d50ac structural_ingredients).
      source: H-MONO-1d50ac H2.
    - quantity: M2, tau=1 matched pair (if found)
      value: EXACTLY 0 collisions, both curves, both sign conventions.
      formula: G6, H-MONO-45183a Part B.
      source: H-MONO-45183a (unmodified).
    - quantity: M2, tau>1 matched pair
      value: rate approx 6(tau-1)/N within 3 binomial standard errors, EACH curve independently.
      formula: G7, H-MONO-45183a Part B.
      source: H-MONO-45183a (unmodified).
    - quantity: M3
      value: >-
        TWO-SIDED, GENUINELY OPEN: agreement (Fisher-exact p not
        significant) corroborates (N,tau)-only completeness; a
        significant disagreement, with the tau=1 control (if available)
        passing, falsifies it and is the record's single most
        consequential possible outcome.
      formula: n/a (direct empirical comparison).
      source: H-MONO-1d50ac (new content of this record).

  replication:
    planned_runs: 1
    seeds: [20260901]
    interpretation: >-
      A single deterministic run: the matched-pair search and both
      curves' measurements are fully determined by the frozen seed rule
      and declared prime range: no seed-to-seed replication is meaningful
      for the search itself. Stage 3's replication (a second matched
      pair, if found within the SAME run's search range) is the
      record's own internal replication check, not a second seeded run.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 3600
    maximum_cpu_seconds: 7200
    maximum_peak_rss_bytes: 536870912
    maximum_total_disk_bytes: 268435456
    maximum_workers: 1
    no_network: true
    cost_note: >-
      Stage 0's search cost scales with the declared prime range
      (~700-800 primes in [101,3000] at toy field sizes); curve
      construction and point-counting at these sizes is cheap (this
      lane's own prior experiments constructed 100+ curves in seconds).
      Stage 1/2's per-pair cost (2 curves x 20000 tuples x 2 sign
      conventions) is comparable to a single cell of this lane's earlier
      K3/K4 experiments. If wall-clock trends past 1800s with the search
      still running, STOP and report the exact prime reached and the
      cause as an infrastructure/budget signal -- do not silently narrow
      the declared search range.

  environment_preconditions:
    consequence: NO CAS AND NO SOLVER IS REQUIRED, unchanged from this lane's other contracts.
    if_a_precondition_fails: >-
      A missing interpreter or a failed curve/factor-base construction is
      `failed_infrastructure`, reported as infrastructure signal, NEVER
      negative mathematical evidence (AGENTS.md rule 3).

  infrastructure_failure_disposition: >-
    Any timeout, crash, or construction failure is recorded with its
    exact cause and classified `failed_infrastructure` or `invalid`.
    Supports and weakens NOTHING about H-MONO-1d50ac or the ECDLP.

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen and authorized. (Satisfied here.)
    - Stop at Stage 0 if no matched-(N,tau) pair is found within [101,3000]; report the exhaustive negative and spend no further compute.
    - Stop at Stage 1 if either matched curve fails to reproduce its own G6/G7-predicted rate independently.
    - Stop on any budget breach, reporting it as infrastructure signal.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Any missing construction record, factor-base digest, or seed record for either matched curve.
    - Any cell reporting one sign convention only.
    - Any Stage-2 comparison read without Stage 1's independent reproduction check having passed on both curves.
    - >-
      Any post-hoc change to the declared prime range, the null-draw
      count, or the comparison test after any Stage-1 or Stage-2 number
      has been observed. Requires a versioned protocol amendment marked
      exploratory_only, never a silent edit.

  success_criterion: >-
    A run is well-formed evidence (regardless of which direction M1-M4
    come out) if: the Stage-0 search outcome is reported explicitly
    (found, with p/N/tau, or exhaustively not found); if found, both
    matched curves independently reproduce their own G6/G7-predicted
    rate (Stage 1); the Stage-2 direct comparison is reported with its
    exact statistic; and Stage 3's replication outcome (if applicable)
    is reported. THAT DISPOSITION SUPPORTS EXACTLY the scoped statement
    in claim_ceiling and nothing more.

  falsification_criterion: >-
    Any of: (a) no matched pair found within the declared range
    (bounded negative, not evidence for either direction); (b) either
    matched curve failing to reproduce its own G6/G7-predicted rate
    independently (implementation, not the main claim, is suspect); (c)
    a tau=1 matched pair showing any nonzero collision on either curve;
    (d) the CM and ordinary curves' rates disagreeing beyond the stated
    statistical tolerance at a matched tau>1 cell, with the tau=1
    control (if available) passing -- the record's single most
    consequential possible outcome, escalated to independent review
    rather than absorbed; (e) a reversal of the qualitative finding
    between two replication pairs, if found.

  outcomes:
    closed_form_corroborated: >-
      A matched pair is found; both curves independently reproduce
      G6/G7; the direct comparison shows agreement within tolerance.
      Corroborates H-MONO-45183a Part B's (N,tau)-only completeness
      beyond what its own designed panel tests -- closes, for m=4 and
      this construction, the specific residual risk that record's own
      audit named as open.
    exceptional_locus_found: >-
      A matched pair is found; both curves independently reproduce
      G6/G7 (so the tau=1 nearby-object control, if applicable, passes);
      the direct comparison shows a significant disagreement. The single
      most consequential possible outcome in this lane: a genuine,
      curve-specific (endomorphism-ring-linked) relation-rate deviation,
      escalated to independent review-adversarial.
    no_matched_pair_found: >-
      Stage 0 exhausts the declared range without a match. A bounded,
      reportable negative about the search, not about H-MONO-1d50ac's
      main claim in either direction.
    instrument_failure: >-
      Stage 1 fails on either curve, or the tau=1 control fails. Never
      evidence about H-MONO-1d50ac's main claim.
    infrastructure_or_integrity_failure: See infrastructure_failure_disposition. Never mathematical evidence.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      Unchanged from this lane's other contracts: toy scale, no transfer
      to cryptographic scale or F_{q^n}. A found disagreement identifies
      a curve-specific deviation at toy scale for ONE tested pair; it
      does not characterize the full exceptional family's size or
      cryptographic relevance.

  required_artifacts_if_later_authorized:
    - Frozen approved specification with a freeze receipt binding its SHA-256.
    - Stage-0 search transcript: every constructed curve's (p,A,B,N,n1,n2,tau,role), and the matched-pair outcome.
    - Per-curve factor-base digest and construction record, both matched curves.
    - Per-curve collision counts/rates, both sign conventions, both matched curves (and the replication pair, if found).
    - Stage-2 comparison statistic and its exact value.
    - Run manifest carrying git commit, dirty-tree state, environment, resolved model identifier and probe status.
    - Command, stdout, stderr, timings, peak RSS, and an execution report.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - This contract is a Coordinator-initiated conversion of IDEA-20260831-d29a71 into hypothesis H-MONO-1d50ac and this frozen contract; no separate Coordinator judgment call is reserved beyond this approval.
    - Independent review confirms the matched-pair search (Stage 0) genuinely searches rather than assumes a match, and that Stage 1's reproduction check genuinely gates Stage 2.
    - Independent review confirms the comparison_test_power_check's disclosed resolution limit is accurate and that a null Stage-2 result is not over-read as proving exact equality.

  approval_status: >-
    APPROVED 2026-08-31 by the Coordinator; see `coordinator_approval_rationale` above.

  source_refs:
    - ledger/hypotheses/H-MONO-1d50ac.yaml
    - ledger/proposals/IDEA-20260831-d29a71.yaml
    - ledger/hypotheses/H-MONO-45183a.yaml
    - ledger/evidence/EV-MONO-a0a89c.yaml
    - experiments/EXP-MONO-12ce1c/specification.yaml
    - ledger/questions/RQ-MONO-001.yaml
    - ledger/goals/GOAL-MONO-001/goal.yaml
    - knowledge/open-problems/KN-OPEN-009.md
    - knowledge/techniques/KN-TECH-95a42b.md
    - docs/inventor-protocol.md
    - docs/claims-and-verification.md

  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
