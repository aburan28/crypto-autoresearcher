  finding_summary: >-
    The run package is a genuine, content-verified, bit-for-bit reproducible
    committed snapshot, executed against the exact frozen specification. Both
    disclosed implementation decisions this task was specifically assigned to
    attack are CONFIRMED MATHEMATICALLY CORRECT by independent derivation and
    independent from-scratch reimplementation, not merely plausible-sounding:
    (1) the m=4 construction genuinely requires 3 drawn points and 4 canonical
    sign classes, not 4 drawn points -- the "4 points" literal reading is not
    just wrong but self-contradictory against the spec's own "4 sign classes"
    count; (2) the fixed/random-sign dual-arm control genuinely cannot fail
    for this construction, by a group-theoretic permutation argument I
    re-derived independently and which matches EXP-MONO-12ce1c's own
    red-team OBJ-6 finding for the same construction almost verbatim. Stage 0's
    search, Stage 1's collision counts, and Stage 2's Fisher-exact p-value all
    independently recompute exactly from the raw archived data using
    genuinely different code than the Executor's own. Four findings beyond
    the assigned attack surface, none of which overturns the above but all of
    which should be carried into the Coordinator's synthesis: (a) the
    execution_report's headline "2.424 SE" figure for the CM curve's
    deviation independently recomputes to 2.427 SE from the same raw counts
    and the same SE formula -- a small, real, uncorrected arithmetic
    discrepancy, not a rounding artifact I could reproduce by any alternative
    formula; (b) Stage 0's search silently narrows the contract's own more
    permissive "same prime or a different prime, if declared" text to
    same-prime-only, which I believe is the scientifically correct choice
    (cross-prime matches would confound field/characteristic with
    endomorphism ring) but which was never disclosed as an interpretation
    decision, unlike the other five -- and there are 100 cross-prime (N,tau)
    numerical coincidences in the transcript the code never even considers,
    the cheapest at p=109/139 rather than p=617; (c) the contract's own
    pre-registered `comparison_test_power_check` ("powered to detect ~2x or
    more, not sub-20%") is independently shown to be WRONG for the actual
    matched-pair cell: true power is ~92-95% at a 20% relative difference and
    ~42-47% at the actually-observed ~11% difference, both confirmed by
    normal-approximation and from-scratch Monte Carlo Fisher-exact
    simulation, so the Stage-2 null is a moderately-powered, genuinely
    borderline result rather than an uninformative one; (d) Stage 1's
    per-curve CM "pass" and Stage 2's between-curve p=0.066 are not
    independent evidence -- they are two views of the same four raw counts,
    and citing both as separately corroborating risks double-counting one
    signal. None of the underlying numbers are fabricated; the run is an
    admissible receipt, but several of its own headline framings (the exact
    SE figure, the search's implicit scope, and the stated power/resolution
    limit) require correction before this record is cited as cleanly
    supporting either "closed form corroborated" or "no large deviation."

