  metric_recomputations:
    - id: RECOMP-1
      metric: Stage-0 matched pair's own curve parameters (p=617, both curves).
      method: >-
        Independent brute-force point enumeration over ALL (x,y) in
        F_617 x F_617 (not the Legendre-symbol character-sum method
        run_experiment.py's own `count_points` uses) for both curves;
        independent brute-force root count of x^3+Ax+B=0 mod 617 for tau;
        independent j-invariant computation via the standard formula.
      result: >-
        N=580 for BOTH curves (matches archived exactly). tau=4 for BOTH
        (matches). j_ord=227, j_cm=494 (== 1728 mod 617 == 494, confirming
        the j=1728 CM designation is arithmetically correct). Both curves
        confirmed non-singular. Additionally confirmed 617 mod 4 = 1, so the
        j=1728 curve's order-4 automorphism (x,y)->(-x,iy) is genuinely
        F_617-rational (i in F_617) -- the CM designation reflects real
        extra structure at this specific prime, not a spurious label.
    - id: RECOMP-2
      metric: Stage-0 search completeness and uniqueness of the matched pair.
      method: >-
        Independently loaded `stage0_transcript.json` (405 entries) and
        verified: (a) all 405 primes in [101,3000] are present, sorted,
        genuinely prime, no gaps and no extras (independent primality test
        written from scratch); (b) independently re-scanned ALL (ord, cm_j0,
        cm_j1728) triples for SAME-PRIME (N,tau) matches, not trusting
        `stage0.matches`.
      result: >-
        Primes-scanned list is exhaustive and exact: 405/405, matching
        `len([p prime : 101<=p<=3000])` exactly. Same-prime scan independently
        confirms EXACTLY ONE match: (p=617, N=580, tau=4, j1728) -- identical
        to the archived claim. See control_checks below for a completeness
        caveat this recomputation also surfaced (task item 1 / item 6).
    - id: RECOMP-3
      metric: Stage-1 predicted rate, SE, and per-curve deviations.
      method: >-
        Recomputed `predicted_rate = 6*(tau-1)/N`, `expected_pairs =
        predicted_rate*20000`, and `se = sqrt(20000*6*p_pair*(1-p_pair))`
        with `p_pair=(tau-1)/N` (run_experiment.py's own `binomial_se_pairs`
        formula, re-derived from B-2's stated branch probabilities rather
        than copied), using exact `Fraction` arithmetic to eliminate any
        float-rounding ambiguity, then converted to float for comparison.
      result: >-
        predicted_rate = 0.03103448275862069, expected_pairs = 620.6896551724138,
        se = 24.849128585098583 -- ALL bit-identical to `raw-result.json`'s
        own `stage1.primary.se_pairs_per_20000` and the reported
        `expected_pairs` fields. Ordinary deviation: (613-620.6897)/24.8491 =
        -0.30945..., rounds to 0.309 -- MATCHES execution_report.yaml's
        reported 0.309 exactly. CM deviation: (681-620.6897)/24.8491 =
        2.42706..., rounds to 2.427 -- DOES NOT MATCH execution_report.yaml's
        reported 2.424. This is a genuine, reproducible ~0.003 discrepancy in
        a headline reported statistic, independently confirmed via exact
        Fraction arithmetic (not a floating-point artifact): the true
        recomputed value from the archived raw counts and the run's own SE
        formula is 2.427 SE, not 2.424 SE. I could not find any alternative
        plausible SE formula (Poisson variance, tau/N instead of (tau-1)/N,
        per-tuple-Bernoulli variance, using the 679 any-collision count
        instead of the 681 pair count) that reproduces 2.424 exactly; the
        discrepancy looks like a small arithmetic slip in the report's prose
        rather than a different-but-defensible computation. It does not
        change the qualitative reading (still inside the pre-registered 3-SE
        gate) but should be corrected in any downstream citation.
    - id: RECOMP-4
      metric: Stage-1 raw collision counts (613 ordinary, 681/679 CM), from scratch.
      method: >-
        Wrote an independent, from-scratch reimplementation of the m=4
        measurement (different code structure, different internal sign-class
        list ordering, independently re-derived `draw_uniform`/point/curve
        arithmetic), using ONLY the frozen contract's own `seed_derivation_rule`
        text (unavoidably shared, since correctly reproducing the specified
        deterministic draws requires the specified formula) applied to the
        matched pair's own (p,A,B) values from the archived transcript.
      result: >-
        First attempt used role tag "cm1728" (a plausible but WRONG guess at
        run_experiment.py's exact string-concatenation convention) and
        obtained a DIFFERENT count (662), which is itself informative: the
        seed derivation is doing real, sensitive work, not degenerate. After
        reading run_experiment.py's exact `role = curve["role"] + str(curve.get("j"))`
        convention (role_tag = "cmj1728", not "cm1728") and correcting only
        that string, the independent implementation reproduced BOTH curves'
        collision counts EXACTLY: ordinary 613/613 (pairs/tuples), CM 681
        pairs / 679 tuples -- bit-identical to `raw-result.json` in both sign
        arms. This independently confirms `measure_curve`'s collision-counting
        logic is correct, not merely self-consistent with its own bugs.
    - id: RECOMP-5
      metric: Stage-2 Fisher-exact odds ratio and p-value.
      method: >-
        Independent, from-scratch hypergeometric computation (log-factorial
        based, not calling `scipy.stats.fisher_exact` as run_experiment.py
        does): P(a=k) = C(1292,k)*C(38708,20000-k)/C(40000,20000) on the
        table {613,19387,679,19321}, two-sided p-value as the sum of all
        P(a=k) <= P(a=613) in log-space.
      result: >-
        p = 0.06598219372124663 -- matches the archived 0.06598219371661383
        to 9 significant figures (residual difference is float log-sum-exp
        precision, not a disagreement). Odds ratio a*d/(b*c) = 0.8997247977460565
        -- bit-identical to archived. CONFIRMED via a genuinely independent
        method, not a re-run of scipy's own black-box implementation.
    - id: RECOMP-6
      metric: >-
        Statistical power of the Stage-2 comparison at the ACTUAL matched
        pair's parameters (task item 3 / the contract's own
        `comparison_test_power_check` approval_requirement).
      method: >-
        Two-proportion normal-approximation power calculation (pooled
        variance under H0, unpooled under H1) at n=20000, p1=613/20000, for
        relative differences 5%-200%; cross-checked with a from-scratch
        Monte Carlo simulation (300 replications per point) using the
        independent hypergeometric Fisher-exact implementation from
        RECOMP-5, not scipy.
      result: >-
        THE CONTRACT'S OWN PRE-REGISTERED CLAIM IS WRONG FOR THIS CELL. The
        contract states (`comparison_test_power_check`, `power_check_reminder`):
        "adequate resolution to detect a multiplicative rate difference of
        order 2x or more... NOT powered to detect a sub-20% relative
        difference." Independently computed power at n=20000, p1=0.03065:
        20% relative difference -> 92.5% power (normal approx) / 94.7% power
        (300-rep Monte Carlo Fisher-exact) -- NOT "unpowered". 80% power is
        already reached at a ~16.4% relative difference, not "2x". At the
        ACTUALLY OBSERVED ~10.8% relative difference, power is only
        ~42-47% (both methods agree) -- moderate, not negligible. The
        contract's power characterization was written generically before
        Stage 0 found this specific (N,tau) cell and was not revisited
        against the cell actually found (predicted_pairs ~620, not the
        "single digits to low tens" the contract's inputs section
        anticipated for a generic toy cell). This means the p=0.066 null
        result is neither "we couldn't have seen anything smaller than 2x
        anyway" (as both specification.yaml and execution_report.yaml's
        prose claim) nor strong evidence of equality (only ~46% power to
        catch the actual observed effect size if it is real) -- it is a
        genuinely close, moderately-powered null that deserves the
        escalation the contract's own `outcomes.exceptional_locus_found`
        clause anticipates for a significant result, even though it did not
        cross the 0.05 threshold.

  control_checks:
    - check: >-
        Stage 1 hard gate genuinely computed and genuinely gates Stage 2
        (approval_requirements item 2): confirmed by reading run_experiment.py's
        control flow directly, not the report's prose.
      result: >-
        PASS. `run_stage_1_and_2` computes `stage1_pass` from the actual
        per-cell `pass` booleans (lines ~448-475) and only enters the Stage-2
        branch `if stage1_pass:` (line 478); a failing gate sets
        `stage2["note"]` to an explicit "not computed" string and never
        reaches the Fisher-exact call. This is not merely reported as gated;
        it is structurally gated in the control flow.
    - check: >-
        Stage-0 search genuinely searches (constructs and compares real
        curves) rather than assuming or hard-coding a match
        (approval_requirements item 2).
      result: >-
        PASS. `construct_ordinary`/`construct_cm_j0`/`construct_cm_j1728`
        perform real point-counting (`count_points` via Legendre-symbol
        character sums) for every one of the 405 primes; independently
        cross-checked via a completely different (brute-force enumeration)
        method for the matched pair specifically (RECOMP-1) and confirmed
        exact agreement.
    - check: >-
        TASK ITEM 1 -- does "exactly one matched pair" hold up against an
        independent re-scan of the FULL transcript for (N,tau) coincidences
        the Executor's own code might not detect?
      result: >-
        MIXED. Under the SEARCH THE CODE ACTUALLY RUNS (same-prime ord-vs-CM
        match at a single p), the claim is TRUE and exhaustively confirmed:
        my independent re-scan of all 405x3 constructed curves found exactly
        the one reported match, no more. HOWEVER, `specification.yaml`'s own
        text ("at that SAME prime OR, if declared explicitly in advance, at a
        different prime within the range") explicitly contemplates a WIDER
        search that the implementation never performs. I independently
        scanned for CROSS-PRIME (N,tau) coincidences (ordinary curve at p1
        matching either CM candidate at a DIFFERENT p2) and found 100 of
        them in the same transcript, the smallest at (ordinary p=109, N=124,
        tau=4) vs (CM j0, p=139, N=124, tau=4) -- a vastly cheaper candidate
        than p=617 by the contract's own "report the smallest-p match"
        instruction, had cross-prime matching been in scope. I judge the
        SAME-PRIME-ONLY choice to very likely be the SCIENTIFICALLY CORRECT
        one and not merely a convenient narrowing: a cross-prime "match"
        would compare curves over two DIFFERENT FIELDS (F_109 vs F_139), so
        it would confound the intended endomorphism-ring axis with a
        field/characteristic axis the design is not built to control for,
        and Deuring's correspondence (H2's own motivating citation) is
        specifically about curves sharing a FIXED prime. But this is an
        interpretive judgement call with real stakes (it determines which of
        101 candidate pairs, at wildly different cost, becomes "the" tested
        pair), and it is NOT among the five decisions implementation.md
        discloses (Sections 1-5 cover the point count, `decimal(role)`, role
        disjointness, the sign-tautology, and the Fisher unit -- never the
        same-prime-vs-cross-prime search scope). This should have been a
        sixth disclosed decision. Reported as a completeness/disclosure gap,
        not a correctness error, since I believe the choice made was right.
    - check: >-
        TASK ITEM 4 -- is m=4 genuinely (m-1)=3 drawn points with 2^(m-2)=4
        canonical sign classes, per H-MONO-45183a's own B-1/B-2 text (read in
        full, independently, before reading implementation.md's own
        argument)?
      result: >-
        CONFIRMED CORRECT, via an independent derivation performed BEFORE
        reading implementation.md's own justification. H-MONO-45183a's B-2
        text names "the partitions of {1,2,3}" explicitly as the object
        governing the m=4 branch-type count -- a THREE-element index set,
        which can only be (m-1) drawn points' indices, never 4. Working out
        the 4 canonical sign classes (eps_1 fixed +1, eps_2/eps_3 free) by
        hand: all C(4,2)=6 unordered class-pairs have symmetric-difference
        type (1,2) in {1,2,3} (never (0,3) or any other type), so every pair
        contributes probability EXACTLY (tau-1)/N (the singleton branch is
        forced to probability 0 per B-2), giving 6*(tau-1)/N -- matching G7
        bit-for-bit. This independent derivation was reached before reading
        implementation.md's own section 1, and agrees with it exactly. It
        was FURTHER confirmed empirically: my own from-scratch
        reimplementation (RECOMP-4), using this exact 3-point/4-class
        construction and nothing else, reproduces the archived collision
        counts exactly. The "4 drawn points" literal reading is not merely
        wrong but internally inconsistent with the spec's own arithmetic:
        quotienting 4 points' signs by the global diagonal flip gives
        2^{4-1}=8 classes, never the stated "4 sign classes for m=4" at all
        -- so the literal prose is self-contradictory, and 3-points-4-classes
        is the UNIQUE reading that is even internally consistent, independent
        of whether it reproduces 6(tau-1)/N. I was NOT able to independently
        reproduce implementation.md's specific claimed figure for the
        rejected "4 points, fix 2 signs, vary 2" alternative (it states
        "2(tau-1)/N"; my own hand-derivation of one plausible reading of that
        alternative gives 4*(2*tau-1)/N instead) -- a minor, non-load-bearing
        gap in my own audit of a REJECTED alternative that does not affect
        confidence in the construction actually used, which is independently
        confirmed correct by two different methods above.
    - check: >-
        TASK ITEM 5 -- is the fixed-sign/random-sign dual-arm control
        actually, provably tautological for this construction, and was this
        already known elsewhere in the lane?
      result: >-
        THE MATHEMATICAL CLAIM IS CONFIRMED TRUE, independently re-derived.
        Writing S(eps_2,eps_3) = P1 + eps_2 P2 + eps_3 P3 for the 4 canonical
        classes: substituting -P1 for P1 gives S'(eps_2,eps_3) = -S(-eps_2,-eps_3),
        and x(-Q)=x(Q), so the multiset of 4 x-values is invariant under
        negating both eps_2 and eps_3 simultaneously -- a permutation of the
        4-class index set, not a change to the set of values. Substituting
        -P2 gives S(-eps_2,eps_3) (a transposition), and -P3 gives
        S(eps_2,-eps_3) (another transposition, matching implementation.md's
        own worked example of classes (+,+,+) and (+,+,-) swapping under a
        P3 sign flip exactly). Since the collision COUNT depends only on the
        multiset of 4 x-values, not on which class produced which value, no
        square-root choice for any of the 3 points can ever change it. This
        is a general, m=4-specific but curve- and prime-independent identity,
        not a property of THIS run's specific numbers. IT WAS ALREADY KNOWN
        AND ALREADY DOCUMENTED IN THIS LANE, and this is the more important
        finding for task item 5: EXP-MONO-12ce1c's own red-team report
        (OBJ-6, severity: high) proves the IDENTICAL invariance ("flipping
        y_i permutes the eps-keys and fixes the multiset of resulting
        x-coordinates, so the collision count D is sign-invariant") for the
        SAME 3-point/(m-1)-point sublocus construction (confirmed identical
        by cross-reading EXP-MONO-12ce1c/specification.yaml's `treatment_b`,
        which parallels `treatment_a`'s explicit "(x_1,...,x_{m-1})"
        indexing), and H-MONO-45183a's OWN status_note (read at the top of
        this record) already carries the consequence forward: "Part B is
        supported, rescoped to the transversal sampling convention actually
        used (its own sign-convention control was empty by implementation)."
        implementation.md's independent re-derivation is CORRECT but presents
        this as though newly discovered in this run, without citing OBJ-6 or
        the hypothesis's own status_note that already records the identical
        finding. THE MORE CONSEQUENTIAL, UNDISCLOSED PART: OBJ-6 goes further
        and identifies the discriminating axis HEUR-COIN-1 actually needed
        (transversal factor-base sampling, which structurally excludes
        2-torsion points via f(x)=0 exclusion, VERSUS true uniform sampling
        on the full group E(F_p), which does not) and MEASURED a 100% effect
        (not the "o(1/N)" HEUR-COIN-1 hoped for): "at m=4 the group-uniform
        mean D is 1.84-2.08x the transversal mean D on every tau>=2 curve."
        H-MONO-1d50ac's own H1 (the assumption this experiment's Stage 1 gate
        rests on) states its `falsification_condition` as "Inherited
        unmodified: the fixed-sign and random-sign sampling arms disagreeing"
        -- i.e. it inherits the ALREADY-PROVEN-EMPTY falsifier verbatim, and
        H1's own `rigorous_support` text repeats the STALE, already-
        superseded characterization ("an expected-but-unproven O(1/N)-relative
        first-order effect") rather than OBJ-6's own corrected, already-
        measured finding (~100% effect, scoped to the transversal
        convention). This is not a defect in EXP-MONO-64aaa4's own execution
        -- both curves here are measured under the SAME (transversal)
        convention consistently, so the CM-vs-ordinary comparison itself is
        unaffected by this gap -- but H-MONO-1d50ac's own contract, and this
        experiment's specification.yaml (`dual_convention_control`), assert a
        "mandatory" control that was already known, before this contract was
        written, to have zero discriminating power, and neither the
        hypothesis conversion nor the Coordinator's approval rationale
        discloses this precedent.
    - check: >-
        TASK ITEM 3 -- is citing both "Stage 1's CM deviation passed (2.427
        SE)" and "Stage 2's comparison did not reach significance (p=0.066)"
        as two separately corroborating facts a form of double-counting?
      result: >-
        YES, PARTIALLY. Both statistics are computed from the same four raw
        counts (613 ord-collision, 679/681 cm-collision, and their
        complements out of 20000). Stage 1's CM deviation isolates one
        curve's departure from a FIXED theoretical target; Stage 2 directly
        compares the two curves to EACH OTHER, which already nets out any
        shared or field-independent bias and is the strictly more diagnostic
        test the contract itself calls "the PRIMARY, headline result". A
        difference-of-Z-scores calculation (Z_cm - Z_ord = (681-613)/
        (sqrt(2)*24.8491) = 1.935, two-sided p~=0.053, computed independently
        here) lands in the same borderline region as both the CM-alone
        deviation and the Stage-2 Fisher result, confirming these are not
        three independent lines of evidence but close restatements of one
        underlying signal (CM higher, ordinary at-or-below prediction). The
        record's own text (execution_report.yaml, M2/M3) does report these
        as SEPARATE gate results rather than explicitly flagging the overlap,
        which risks a reader adding weight twice. Recommend the Coordinator
        treat Stage 2's p=0.066 (or the difference-of-Z form above) as THE
        statistic, with Stage 1's per-curve numbers cited as diagnostic
        context rather than as additional independent support.
    - check: >-
        Negative/scope control -- does the record over-claim beyond its own
        `claim_ceiling` anywhere in execution_report.yaml or implementation.md?
      result: >-
        PASS. Both explicitly refuse any ECDLP, cost, exponent, or
        cryptographic-scale claim, and explicitly refuse to certify the
        closed form's completeness beyond this one pair. No overclaim found.
    - check: >-
        Seed-derivation / determinism disclosure (task item 6a): is the
        claim that the recorded seed (20260901) does not actually perturb
        any draw accurate?
      result: >-
        CONFIRMED ACCURATE. `seed_derivation_rule` in specification.yaml
        contains no `seed` or `master_seed` term in its SHA-256 preimage
        (domain, label, p, role, draw_index, counter only); confirmed by
        direct reading of `seed_bytes()` in run_experiment.py, which never
        references any seed variable. The full independent re-execution
        above (artifact_checks) reproduces the run bit-for-bit without ever
        passing the seed anywhere, confirming this disclosed property rather
        than merely trusting the prose.
    - check: >-
        Factor-base construction (task item 6b): independently reproduced
        for both matched curves.
      result: >-
