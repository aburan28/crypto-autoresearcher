    dual_convention_control_observation: >-
      MEASURED, NOT A BUG: the fixed-sign and random-sign arms produced
      BYTE-IDENTICAL collision counts on both curves (613/613 ordinary,
      681/681 CM). This is a provable mathematical invariant of the
      specific 4-sign-class construction used here (see implementation.md
      section 4), not merely a passing statistical check: substituting the
      other square root for any one of the 3 drawn points permutes which of
      the 4 canonical sign-classes computes which value, but cannot change
      the multiset of resulting x-coordinates, so this construction's
      dual-arm control cannot detect a sign-convention dependence even in
      principle. Disclosed as a design limitation, not claimed as
      corroboration beyond what a tautological check can support.

  stage2_direct_curve_to_curve_comparison:
    headline: >-
      THE PRIMARY, HEADLINE RESULT. Fisher-exact test on the {collision,
      no-collision} 2x2 table across the ordinary and CM curves' 20000
      tuples each, for this tau=4 (tau>1) matched pair. Result: NO
      STATISTICALLY SIGNIFICANT DISAGREEMENT at p<0.05, in EITHER sign
      convention (both arms give an identical table because of the
      dual-convention invariance noted above).
    fixed_sign_arm:
      table: {ord_collision: 613, ord_no_collision: 19387, cm_collision: 679, cm_no_collision: 19321}
      odds_ratio: 0.8997247977460565
      p_value: 0.06598219371661383
      significant_at_0.05: false
    random_sign_arm:
      table: {ord_collision: 613, ord_no_collision: 19387, cm_collision: 679, cm_no_collision: 19321}
      odds_ratio: 0.8997247977460565
      p_value: 0.06598219371661383
      significant_at_0.05: false
    ordinary_rate_any_collision: 0.03065
    cm_rate_any_collision: 0.03395
    ordinary_rate_pairs_per_tuple: 0.03065
    cm_rate_pairs_per_tuple: 0.03405
    power_check_reminder: >-
      Per the contract's own comparison_test_power_check (design-time,
      pre-registered): at n=20000 per curve with expected collision counts
      of order tau*20000/N ~ 620 pairs here, this test is powered to detect
      a multiplicative rate difference of roughly 2x or more, NOT a
      sub-20% relative difference. The observed CM rate (0.03405
      pairs/tuple) is about 11% higher than the ordinary rate (0.03065
      pairs/tuple); this is within the disclosed resolution limit of the
      design and is reported as "no LARGE deviation detected", not as
      evidence the rates are identical to arbitrary precision.

  stage3_replication:
    applicable: false
    reason: >-
      Stage 0's exhaustive search of the full declared range [101,3000]
