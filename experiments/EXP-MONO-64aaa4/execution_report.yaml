  observations_only_no_interpretation:
    - >-
      M1: exactly one matched-(N,tau) CM/ordinary pair exists in
      [101,3000], at p=617, N=580, tau=4, the j=1728 CM candidate.
    - >-
      M2: both curves independently reproduce H-MONO-45183a's own
      unmodified G7 prediction (6(tau-1)/N = 0.03103...) within 3 SE, in
      both sign conventions (Stage 1 hard gate passed on all 4 cells).
    - >-
      M3: the direct two-sample Fisher-exact comparison between the two
      matched curves does not reach significance at p<0.05 (p=0.066, both
      arms identical). This is reported as the headline result regardless
      of direction, per the contract.
    - >-
      M4: no replication pair exists in the declared range; Stage 3 is
      explicitly not applicable, not omitted.
    - >-
      Disclosed implementation interpretation: the m=4 sign-class
      construction uses (m-1)=3 drawn factor-base points and 4 canonical
      sign classes (fixing eps_1=+1), not 4 drawn points, because that is
      the unique reading consistent with H-MONO-45183a B-1/B-2's own
      unmodified combinatorics and the only one that reproduces
      6(tau-1)/N exactly. Full derivation in implementation.md section 1.
    - >-
      Disclosed design limitation: the fixed-sign vs random-sign dual-arm
      control is provably tautological for this specific construction
      (both arms are mathematically forced to agree exactly); it passed,
      but that pass carries no discriminating power. Full derivation in
      implementation.md section 4.

  claim_ceiling_reminder: >-
    Toy scale only (p up to 2999, non-singular short-Weierstrass curves
    over F_p, m=4 exactly, j in {0,1728} CM candidates only). This run
    supports at most: whether this ONE matched-(N,tau) CM/ordinary pair
    shows agreeing or disagreeing m=4 root-multiplicity collision rates,
    within the stated statistical tolerance, at toy scale. It does not
    certify the closed form's completeness for every curve or CM
    discriminant, and it makes no ECDLP, cost, exponent, or
    cryptographic-scale claim in either direction (AGENTS.md rule 4;
    contract claim_ceiling). This is an observation record; the Reviewer
    and Coordinator, not this report, determine what it corroborates or
    falsifies.

