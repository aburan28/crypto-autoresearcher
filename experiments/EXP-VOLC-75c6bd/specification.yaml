# =============================================================================
# EXP-VOLC-75c6bd — version 1, approved by DEC-20261006-e791e0.
# Frozen measurement of the floor-versus-crater gap in liftable roots of
# one S_3 slice on the first qualifying ordinary 2-volcano below 2000.
# The prediction is an absolute mean gap of at least 0.25. A finished
# gap strictly below 0.25, with the instrument gates passing, is a
# negative. This design session did not build a volcano and did not
# compute Y. No discrete logarithm below the generic floor is authorized.
# Source idea IDEA-20261006-52015b is copied byte-for-byte from
# origin/design/ntru-bd02d9-fatigue and is not rewritten.
# =============================================================================
experiment:
  id: EXP-VOLC-75c6bd
  hypothesis_id: H-VOLC-520108
  question_id: RQ-VOLC-f6253b
  source_idea: IDEA-20261006-52015b
  version: 1
  title: >-
    Floor-versus-crater gap of liftable S_3 roots on one toy 2-volcano
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-e791e0
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that the floor mean and the crater mean
      differ by at least 0.25.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Build the frozen graph, compute Y on the chosen component, score
      the integer gap, and apply the gates. Do not search below the
      generic floor and do not change 0.25.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether the mean of Y on the floor and the mean of Y on the
    crater differ by at least 0.25 on the first qualifying ordinary
    2-volcano with prime p in [307, 2000). A finished strict gap below
    0.25, with the formula, point-count, and BSGS gates passing, is a
    negative. No faster discrete logarithm is in scope.

  inputs:
    search:
      prime_start: 307
      prime_limit_exclusive: 2000
      order: ascending primes
      tie_break: >-
        At the first prime that has at least one qualifying component,
        choose the component of smallest trace t, then the smallest
        crater j. Freeze that choice before computing any Y.
    excluded_j: [0, 1728]
    ordinary_rule: >-
      For p > 3 the curve is ordinary when its trace t = p + 1 - #E
      is nonzero. Supersingular components are not scored.
    reduced_model: >-
      For j not in {0, 1728}, set k = j * inverse(1728 - j) in F_p
      and set A = 3k, B = 2k, with A and B represented in
      {0, 1, ..., p-1}. This is the only model used for that j.
      Singular models, those with 4 A^3 + 27 B^2 = 0, are omitted.
    abscissa_rule: >-
      Represent field elements as integers in {0, 1, ..., p-1}. An
      abscissa x is liftable when the Legendre symbol of
      x^3 + A x + B is 0 or 1. Sort the distinct liftable abscissae
      ascending. x1 and x2 are the first two. A root of the cubic
      (a rational point of order 2, y = 0) is included once. If fewer
      than two distinct liftable abscissae exist, the curve is
      unscored and the component is replaced by continuing the
      search. That replacement is not a zero gap. The rule is fixed
      before Y is computed.
    summation_polynomial: >-
      S_3(x1, x2, X) = (x1 - x2)^2 X^2
      - 2*((x1 + x2)*(x1*x2 + A) + 2*B)*X
      + (x1*x2 - A)^2 - 4*B*(x1 + x2).
      This is the short-Weierstrass form written in
      coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-642cf5/v1_blind_rederive.py,
      which this design session opened. Y counts distinct roots X in
      {0, 1, ..., p-1} that are liftable. A double root counts once.
      Y is in {0, 1, 2}.
    velu_edge: >-
      For a rational point (r, 0) of order 2, set t = 3 r^2 + A and
      w = r * t, then A' = A - 5 t and B' = B - 7 w. Compute the
      codomain j from A' and B'. An undirected edge joins the source
      j to that codomain j when the two j-invariants differ. A Vélu
      image that lands on the same j is a self-loop and contributes
      2 to the degree. Every edge must join two curves of equal
      point count. A mismatch voids the cell.
    crater_and_floor: >-
      Within one trace, take each connected component of the
      undirected graph. The crater is the 2-core: delete degree-1
      vertices until none remain. A self-loop contributes 2, so a
      looped vertex is not deleted for being a leaf. The level of a
      vertex is its graph distance to the nearest crater vertex.
      The floor is the set of vertices at maximal level. A component
      qualifies only when the crater is nonempty, the floor level is
      at least 1, the floor has at least two vertices, and no vertex
      has j in {0, 1728}.
    gap_comparison: >-
      Let F be the sum of Y over the floor, n_f the number of floor
      curves that were scored, C the sum of Y over the crater, and
      n_c the number of crater curves that were scored. The
      prediction holds if and only if
      4*|n_c*F - n_f*C| >= n_f*n_c. The negative is the same gates
      with the strict inequality 4*|n_c*F - n_f*C| < n_f*n_c. Both
      comparisons are exact integer comparisons. They are the
      absolute mean gap of at least 1/4 and the strict gap below 1/4.
    formula_check: >-
      The audit curve is the floor curve of smallest j. Let P1 and
      P2 be the affine points with abscissae x1 and x2 and with the
      smaller nonnegative y in {0, 1, ..., (p-1)//2}. The collinear
      set is the set of liftable X for which there exist signs
      e1, e2, e3 in {+1, -1} and a point P3 of abscissa X with
      e1*P1 + e2*P2 + e3*P3 equal to the identity. That set must
      equal the liftable root set of S_3(x1, x2, X).
    null_traces: >-
      Four ordinary reduced models at the same p, with four distinct
      traces, none equal to the chosen component's trace, and with
      j not in {0, 1728}. Choose the four smallest traces, breaking
      ties by smallest j. Record the range max Y minus min Y. If
      fewer than four such traces exist, the reading is
      null_control_missing and the gap is not scored.
    cost_controls:
      scalar: 2
      curves: >-
        The crater curve of smallest j and the floor curve of
        smallest j. The base point is the liftable abscissa of
        smallest x whose smaller nonnegative y gives a point of
        order at least 3. If no such point exists, the cost control
        is void and the cell is void.
      bsgs: >-
        Baby-step giant-step on the subgroup generated by that base
        point, width ceil(sqrt(order)). The answer must equal 2.
        A wrong answer voids the cell.
      distinguished_point_rho: >-
        The same two targets, scalar 2. A point is distinguished
        when it is the identity or its affine x-coordinate is
        divisible by 16. Cap each walk at 20000 steps. The walk
        seed is 1, via SHA-256 of the UTF-8 string
        EXP-VOLC-75c6bd|rho|{j}|{counter}. Record the step count or
        the cap. A cap hit does not flip the Y reading.
    forbidden:
      - Do not change 0.25 after seeing any Y.
      - Do not claim an ECDLP solution or a change in the exponent 1/2.
      - Do not score the gap when the formula check disagrees, when a Vélu edge joins unequal point counts, or when BSGS is wrong.
      - Do not treat a missing volcano as a gap of 0.
      - Do not treat a rho cap hit as a Y result.

  controls:
    - id: collinear-triple
      statement: >-
        On the audit curve the liftable roots of the frozen S_3
        equal the collinear-triple search.
      pass_condition: the two sets are equal
      on_fail: >-
        The polynomial is not the summation polynomial. The gap is
        not evidence. The reading is formula_disagreement.
    - id: equal-point-counts
      statement: >-
        Every Vélu edge joins two curves with the same point count.
      pass_condition: every edge has equal counts
      on_fail: >-
        The graph is not an isogeny graph. The cell is void. This
        is not a gap result.
    - id: four-trace-null
      statement: >-
        Y on four ordinary curves of four other traces at the same p.
        The range is the between-class comparison.
      pass_condition: four curves are measured and the range is recorded
      on_fail: >-
        Fewer than four traces exist. The reading is
        null_control_missing. The gap is not scored.
    - id: depth-gap
      statement: >-
        The floor level is at least 1 and the floor has at least two
        curves. A component that fails this rule is not scored.
      pass_condition: level gap at least 1 and n_f at least 2
      on_fail: >-
        Continue the search. Do not record a zero gap. If the chosen
        component is later found to have one level, the reading is
        same_level and the gap is not scored.
    - id: bsgs-and-rho
      statement: >-
        BSGS and distinguished-point rho on the planted scalar 2 at
        one floor curve and one crater curve. They do not predict Y.
      pass_condition: >-
        BSGS returns 2 on both curves, and rho records a step count
        or the cap on both curves.
      on_fail: >-
        A wrong BSGS answer voids the cell. A rho cap hit is recorded
        and does not flip the Y reading.

  independent_variables:
    - the prime, ascending from 307
    - the trace of the component
    - the level, floor or crater
    - the curve j inside the chosen component

  metrics:
    primary:
      - id: floor_minus_crater_mean_Y
        statement: >-
          The integer 4*|n_c*F - n_f*C| compared with n_f*n_c. The
          prediction is the greater-or-equal comparison. The strict
          less-than comparison, with the instrument gates passing, is
          the negative.
    secondary:
      - id: Y_on_each_curve
        statement: Y in {0, 1, 2} on every scored curve of the component.
      - id: level_gap
        statement: The floor level, which must be at least 1.
      - id: four_trace_range
        statement: max Y minus min Y on the four null curves.
      - id: uniform_hit_comparison
        statement: >-
          The mean of Y on the component compared with
          2 * (number of liftable abscissae) / p, recorded per curve
          as a secondary note. It is not the success criterion.
      - id: bsgs_answers
        statement: The two BSGS answers, each required to equal 2.
      - id: rho_steps
        statement: Step counts or cap hits on the two planted targets.
      - id: attack_claimed
        statement: Boolean. The design-session value is false. The run value must stay false.

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 names a uniform-hit picture and then pre-registers the gap
    0.25 rather than a fit to that picture. The strict inequality
    below 0.25 falsifies the gap clause. A formula disagreement does
    not.

  preregistered_prediction:
    quantity: >-
      The absolute difference between the floor mean of Y and the
      crater mean of Y on the one volcano the search returns.
    formula: >-
      4*|n_c*F - n_f*C| >= n_f*n_c. The negative is the strict
      opposite inequality under the same gates. No attack term enters
      the formula.
    source: >-
      IDEA-20261006-52015b, prediction floor_minus_crater_mean_Y with
      minimum effect an absolute difference of at least 0.25, and
      falsification when that absolute difference is strictly less
      than 0.25.

  scale_relevance:
    tier: toy
    justification: >-
      The cell is one ordinary 2-volcano at a prime below 2000. The
      proposal fixed that search and the gap 0.25. No transfer to a
      cryptographic prime, to another summation polynomial, or to an
      exponent below 1/2 is claimed.
    correspondence: >-
      Direct enumeration of one rational 2-isogeny component. No
      Deuring correspondence.

  tail_checks:
    - >-
      Every scored Y is in {0, 1, 2}. A value outside that set voids
      the cell.
    - >-
      n_f is at least 2 and n_c is at least 1. Otherwise the component
      was not qualifying and must not be scored.
    - >-
      The audit curve's two abscissae are the two smallest liftable
      ones under the frozen rule. A different pair voids the cell.

  replication:
    seeds: [1]
    independent_instances: 1

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - Stop after the chosen component is scored, the four-trace null is recorded, the formula check is done, and the two BSGS and rho controls are recorded.
    - Do not score a second volcano and do not change 0.25.
    - On the first Vélu point-count mismatch, stop and mark the cell void.
    - If the prime search reaches 2000 with no qualifying component, stop with no_qualifying_volcano.

  invalidation_rules:
    - A Vélu edge joins two curves whose point counts differ.
    - The formula check sets differ.
    - BSGS returns a scalar other than 2.
    - A scored Y is outside {0, 1, 2}.
    - The abscissa pair on the audit curve is not the frozen two-smallest rule.
    - attack_claimed is true.
    - The gap is scored on a component that contains j 0 or j 1728, or on a component whose floor level is 0.

  success_criterion: >-
    A qualifying component was frozen before Y was computed, every
    Vélu edge has equal point counts, the formula-check sets agree,
    the four-trace range is recorded, BSGS returns 2 on both pinned
    curves, rho records a step count or the cap on both, every scored
    Y is in {0, 1, 2}, attack_claimed is false, n_f is at least 2,
    the floor level is at least 1, and 4*|n_c*F - n_f*C| >= n_f*n_c.
    That is the prediction in IDEA-20261006-52015b. Any other finished
    assignment is not success.

  falsification_criterion: >-
    The same instrument gates pass, including equal point counts, the
    formula-check agreement, the four-trace null, and BSGS returning
    2, and 4*|n_c*F - n_f*C| < n_f*n_c. That is an absolute mean gap
    strictly below 0.25, which is the negative named in
    IDEA-20261006-52015b. A missing volcano, a formula disagreement,
    a missing null, or a wrong BSGS answer is not this negative.

  required_artifacts:
    - experiments/EXP-VOLC-75c6bd/runs/RUN-*/manifest.yaml
    - experiments/EXP-VOLC-75c6bd/runs/RUN-*/stdout.txt
    - experiments/EXP-VOLC-75c6bd/runs/RUN-*/stderr.txt
    - experiments/EXP-VOLC-75c6bd/runs/RUN-*/reading.yaml

  assigned_to: executor
  reading_rows:
    - prediction_holds
    - gap_below_025
    - formula_disagreement
    - no_qualifying_volcano
    - null_control_missing
    - same_level
    - void
    - failed_infrastructure
  reading_rule: >-
    reading.yaml names exactly one row. prediction_holds requires the
    success criterion. gap_below_025 requires the strict integer
    inequality with the instrument gates passing. formula_disagreement
    means the collinear set differs from the S_3 root set.
    no_qualifying_volcano means the search reached 2000 without a
    qualifying component; it is not a gap of 0. null_control_missing
    means fewer than four other traces exist. same_level means the
    chosen component has floor level 0. void covers a point-count
    mismatch, a Y outside {0, 1, 2}, a wrong BSGS answer, or a broken
    abscissa rule. failed_infrastructure covers a timeout.
    attack_claimed stays false on every row.
