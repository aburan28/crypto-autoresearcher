# (rho Theta(P) floor application; IC Krylov wall-clock floor; region table).
#
# Source: IDEA-20260922-2e2a58 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Absorbs review defects from
# analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-2e2a58.yaml.
#
# ZERO RUNS in this design packet. Stages 0-3 authorized for later executor
# TASK-20260930-2cc13f. Stage 3 region table only after Stage 0-2 gates.
