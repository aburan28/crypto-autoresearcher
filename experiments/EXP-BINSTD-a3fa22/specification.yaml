experiment:
  id: EXP-BINSTD-a3fa22
  hypothesis_id: H-BINSTD-9bde6e
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-2e2a58
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Cost-model measurement of the (T, M, P) crossover surface: Stage 0
    published-attack reproduction + g_rho pin; Stage 1 rho overhead vs P/(2D);
    Stage 2 LA engine + Krylov chain/null; Stage 3 region table (E1)/(E2)
  status: approved
  approved_by: DEC-20260930-982e92
  approved_at: '2026-09-30'
  approval:
    approved_by: DEC-20260930-982e92
    composing_decision: DEC-20260930-982e92
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-3 authorized with Stage 3
      gated on Stage 0-2 pass criteria.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3]
    scientific_execution_authorized_note: >-
      Stages 0 and 1 fully authorized. Stage 2 authorized as IMPLEMENTATION of
      the shared sparse LA engine under experiments/EXP-BINSTD-a3fa22/implementation/
      plus measurement on toy relation matrices and shape-matched nulls.
      Stage 3 (zero-compute region table) authorized ONLY after Stage 0-2 gates
      pass and the KN-LIT-017 body-read gate for quoting the chain-length
      constant as literature support. No Stage 4 and no AUXIN.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Measure the resource-space crossover between matched van Oorschot-Wiener
    rho and decomposition-based index calculus on the standardized binary
    population: apply the known vOW storage/overhead tradeoff as a Theta(P)
    FLOOR (limb B; not claiming formula novelty); measure the recalled Krylov
    chain-length law against a shape-matched null (limb C); emit the per-row
    region table and decide (E1)/(E2) under pinned g_rho := sqrt(|Aut|).

  class: cost-model-measurement
  class_note: >-
    Primary class is cost-model-measurement (concrete region table, measured vs
    modeled separation, memory accounting, standardized parameter sets). Also
    carries heuristic-validation of H-BINSTD-XOVER-1 and H-BINSTD-XOVER-2 at
    toy scale. No exponent-moving claim.

  novelty_absorption:
    limb_B: >-
      P/(2D) / Theta(P) storage floor is KNOWN (KN-LIT-012). Contribution =
      applying the known tradeoff as a FLOOR to the standardized binary
      population's region table. Do not claim novelty of the derivation.
    limb_C_constant: >-
      Chain-length constant 2B'/n0 is RECALLED. Stage 2 measures against
      shape-matched null; read KN-LIT-017 body before quoting deployed rows
      (Stage 3 literature-quote gate).
    la_engine: >-
      Sparse LA engine (block Wiedemann / block Lanczos / structured GE)
      MISSING (~1000-1500 LOC). Built under this EXP write_scope in Stage 2.
      GOAL-ICPERF-e6b6a4 historical ownership noted; code path is shareable.
    g_rho_pin: >-
      g_rho := sqrt(|Aut|). Negation-only: sqrt(2) ≈ 1.414. Koblitz/Frobenius:
      sqrt(2n). Nearby-object B-m vs K-m MUST use this pin.

  scope:
    included:
      - >-
        Stage 0 HARD GATE (zero scientific group walks): reproduce KN-LIT-096
        ECC2K-130 (2^60.9, 2^35.63, 2^25.27; 54.03e6 iter/s → 1263 GPUs/year
        within 5%); reproduce KN-TECH-036 sect113r2 anchor; pin g_rho unit in
        writing; write symbolic region model. Mismatch halts.
      - >-
        Stage 1: parallel rho instrument on toy binary n∈{23,29,31,37,41}
        Koblitz + matched ordinary; P∈{2^4,2^8,2^12}; theta three decades;
        30 seeds/cell; measure relative overhead vs P/(2D).
      - >-
        Stage 2: IMPLEMENT sparse LA engine under implementation/ + collect
        real relation matrices B'∈[2^6,2^10] + shape-matched null; block
        Wiedemann n0∈{1,8,32,64} + block Lanczos + structured GE; record chain
        length, field ops, peak words, c_M.
      - >-
        Stage 3 (zero compute, gated): emit region table (charged ops, peak
        words, P*, binding axis, L_mv sweep {1e-4,1e-3,1e-2}s, both B'
        readings, extrapolation distance); report (E1)/(E2)
        confirmed|refuted|sweep-dependent.
    excluded:
      - Any scientific group walk in Stage 0
      - Stage 3 before Stage 0-2 gates pass
      - Quoting chain-length constant from KN-LIT-017 as literature support
        before body read
      - Claiming novelty of the P/(2D) formula
      - Preprocessing / multi-instance amortisation on either side
      - Any run at deployed n >= 131 as a scientific trial (Stage 3 is arithmetic)
      - AUXIN / FROB / QSP / SEMBIN edits or values
      - Amazon Bedrock

  inputs:
    proposal: ledger/proposals/IDEA-20260922-2e2a58.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-2e2a58.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-9bde6e.yaml
    literature:
      - knowledge/literature/KN-LIT-012.md
      - knowledge/literature/KN-LIT-096.md
      - knowledge/literature/KN-LIT-017.md
      - knowledge/techniques/KN-TECH-008.md
      - knowledge/techniques/KN-TECH-036.md
    optional_code_refs:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
    cells:
      stage1_n: [23, 29, 31, 37, 41]
      stage1_curve_kinds: [koblitz, ordinary_matched]
      stage1_P: [16, 256, 4096]
      stage2_B_prime_log2_range: [6, 10]
      stage2_n0: [1, 8, 32, 64]
      stage2_engines: [block_wiedemann, block_lanczos, structured_GE]
      L_mv_seconds: [0.0001, 0.001, 0.01]
    g_rho_pin:
      definition: g_rho := sqrt(|Aut|)
      negation_only: 1.41421356237  # sqrt(2)
      koblitz_formula: sqrt(2*n)

  controls:
    - name: published_attack_reproduction
      object: >-
        BLOCKING Stage 0: KN-LIT-096 ECC2K-130 triple + 1263-GPU year within
        5%; KN-TECH-036 sect113r2 anchor. Model that cannot reproduce two
        published attacks is not charging them.
    - name: shape_matched_random_sparse_null
      object: >-
        BLOCKING Stage 2: same B', same nonzeros/row, same entry distribution,
        random support. No chain-length conclusion without it.
    - name: null_curve_B_vs_K
      object: >-
        Every Koblitz row beside matched pseudorandom (B-m vs K-m) under
        PINNED g_rho (sqrt(2) vs sqrt(2n)). Binding axis must not be driven by
        the symmetry constant alone.
    - name: three_engine
      object: >-
        Block Wiedemann, block Lanczos, and structured GE on the same matrices.
    - name: L_mv_sweep
      object: Three decades; every row at all three values; flips labelled latency-dependent.
    - name: record_size_sensitivity
      object: Storage figures at 16, 32, 64 bytes per distinguished point.
    - name: B_prime_double_reading
      object: Orbit-gain rows at both B and B/g.
    - name: synthetic_uniform_integer_control
      object: >-
        For Stage 1 metric hygiene: confirm relative-overhead accounting on a
        synthetic walk length model matching geometric(theta) when the
        instrument is correct (sampler/metric control).

  independent_variables:
    - n
    - curve_kind  # koblitz | ordinary_matched
    - P           # concurrent walks
    - theta
    - B_prime
    - n0
    - engine      # block_wiedemann | block_lanczos | structured_GE
    - L_mv
    - seed
    - B_prime_reading  # B | B_over_g
    - record_bytes

  metrics:
    primary:
      - measured_relative_overhead_versus_P_over_2D
      - krylov_chain_length_per_engine_per_n0_real_and_null
      - P_star_per_row_per_L_mv
      - memory_ratio_per_row
      - binding_axis_label_and_stability
    secondary:
      - stored_distinguished_points
      - wasted_in_flight_iterations
      - useful_iterations
      - total_field_operations_per_engine
      - peak_live_words
      - measured_c_M
      - walk_length_KS_vs_geometric
      - fruitless_cycle_counts_negation_frobenius
      - minimal_polynomial_degree_distribution
      - extrapolation_distance_per_deployed_row
      - peak_rss_bytes
      - wall_s
      - termination_reason
      - stage0_reproduction_error_pct

  heuristic_under_test:
    - H-BINSTD-XOVER-1
    - H-BINSTD-XOVER-2

  preregistered_prediction:
    quantity: >-
      (i) measured rho relative overhead ≈ P/(2D) within 20% across theta
      decades; (ii) Krylov chain length ≈ 2B'/n0 within 20% on null, and real
      matches null unless structured; (iii) (E1) P* > 10^3 × realisable width
      at every row × L_mv; (iv) (E2) memory ratio > 2^20 on competitive rows.
    formula: >-
      D = theta * T_rho; waste = P/(2 theta); relative overhead = P/(2D);
      D(epsilon) = P/(2 epsilon). T_IC_floor = (2 B'/n0) * L_mv.
      P* = width where rho wall clock meets T_IC_floor.
      memory_ratio = (c_M B') / (P/(2 epsilon)) at declared (P, epsilon).
      g_rho = sqrt(|Aut|): sqrt(2) negation-only; sqrt(2n) Koblitz.
    source: >-
      IDEA-20260922-2e2a58 limbs (B)(C)(E); KN-LIT-012 (known tradeoff);
      KN-LIT-096; recalled Coppersmith chain model (H-BINSTD-XOVER-2);
      review g_rho pin.
    claim_tier: observational
    measured_vs_modeled: >-
      MEASURED columns: Stage 1 overhead, stored DPs, waste; Stage 2 chain
      length, field ops, peak words, c_M; Stage 0 reproduction residuals.
      MODELED columns: Stage 3 P*, memory_ratio, binding axis from the
      symbolic region model fed by measured laws and declared input ranges;
      rho closed-form wall clock c*sqrt(N)/(g_rho * P * f) with g_rho pinned.
      NEVER mix measured and modeled in one column.

  scale_relevance:
    tier: toy_plus_published_anchor
    justification: >-
      Stage 1 n<=41; Stage 2 B'<=2^10. Deployed rows in Stage 3 are arithmetic
      on measured laws with printed extrapolation distance (up to ~23 doublings
      on chain length). Transfer assumption: walk memorylessness and chain-law
      FORM persist; constants are not transferred unlabelled.
    correspondence: null
    published_anchors:
      - KN-LIT-096 ECC2K-130
      - KN-TECH-036 sect113r2 / 117.35-bit record

  tail_checks:
    - >-
      Upper tail of walk lengths vs geometric(theta); heavy tail => cycling or
      predicate correlation (H-BINSTD-XOVER-1).
    - >-
      Fruitless cycles under negation and Frobenius reported separately.
    - >-
      Fraction of matrices with min-poly degree < 0.8 B' (left-tail structure
      signal; per-matrix, never pooled).
    - >-
      Smoothest / extreme theta cell overhead vs P/(2D).

  optimistic_assumptions:
    - assumption: Relation-collection parallel efficiency = 1
      bias_direction: understates IC wall clock at large P (duplicates/contention)
    - assumption: Recalled chain-length constant 2/n0 until measured
      bias_direction: may over- or under-state T_IC_floor; Stage 2 replaces it
    - assumption: L_mv treated as swept exogenous latency
      bias_direction: hides interconnect/partition dependence inside the sweep
    - assumption: Single-instance, no preprocessing on either side
      bias_direction: may understate practical rho or IC with tables/pooling
    - assumption: 32-byte default DP record (also reported at 16/64)
      bias_direction: storage figures scale linearly with record size
    - assumption: Closed-form rho step rate f from one published platform figure
      bias_direction: platform-specific; labeled modeled

  memory_accounting: >-
    Peak RSS measured on every Stage 1/2 run. Analytic: rho stores at most
    P distinguished-point records in the instrument (P<=2^12); Stage 2 largest
    object is a 2^10 x 2^10 sparse matrix plus Krylov blocks at n0=64
    (under ~200 MB expected). Reconcile analytic word counts against
    peak_rss_bytes in summaries. Rho floor D = P/(2 epsilon) and IC peak
    c_M B' reported as separate MEMORY columns; never as a single mixed figure.
    Time–memory: rho T*M*epsilon invariant along the vOW curve (known); IC
    memory fixed by algorithm (no T–M trade on the LA matrix itself).

  hidden_overhead_honesty: >-
    (i) L_mv hardware-dependent and swept. (ii) Chain-length constant recalled
    until Stage 2. (iii) C_att, p, R_need, B are external inputs (ranges).
    (iv) B' double-valued. (v) Toy-to-deployed chain-law extrapolation ~23
    doublings printed, not hidden in o(1). (vi) No preprocessing/multi-instance.
    (vii) Limb (B) formula is known — not presented as a new asymptotic.
    No superpolynomial factor is claimed to hide inside an o(1) for this
    cost-model correction.

  standardized_parameter_sets:
    - name: Stage0-ECC2K-130-anchor
      T_rho: '2^60.9'
      D: '2^35.63'
      iters_per_DP: '2^25.27'
      f_gtx295: 54030000
      GPUs_per_year_target: 1263
    - name: Stage0-sect113r2-anchor
      source: KN-TECH-036
    - name: Stage1-toy-binary-rho
      n: [23, 29, 31, 37, 41]
      P: [16, 256, 4096]
      seeds_per_cell: 30
      g_rho_negation_only: 1.41421356237
      g_rho_koblitz: 'sqrt(2*n)'
    - name: Stage2-LA-toy
      B_prime_range: [64, 1024]
      n0: [1, 8, 32, 64]
      matrices_per_cell: 10
      engines: [block_wiedemann, block_lanczos, structured_GE]
    - name: Stage3-region-L_mv
      L_mv_seconds: [0.0001, 0.001, 0.01]
      n0_default: 64
      epsilon_default: 0.01
      P_memory_ratio_reference: 1000000000

  affected_vs_safe_scope: >-
    AFFECTED (cost-model accounting only): how the standardized binary
    population's IC-vs-rho comparison is charged on memory and parallel-width
    axes; ECC2K-130 reachability prose that treated rho as memory-free or
    treated parallelism as the deciding asymmetry. SAFE / untouched as attack
    capability: all deployed curves' asymptotic security exponents; no NIST
    security-level break claimed; no new algorithm. Tables are bounds under
    declared optimistic assumptions, not predictions of wall-clock attacks.

  replication:
    seeds_note: >-
      Stage 1: 30 independent seeds per (n, curve_kind, P, theta-decade) cell.
      Stage 2: 10 real matrices + 10 shape-matched nulls per (B', curve_kind)
      cell. Stage 0/3 deterministic given inputs.
    independent_instances_stage1: 30
    independent_instances_stage2: 10

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 200
    maximum_workers: 1
  budget_note: >-
    Advisory under research-budget-policy. Dominant cost is Stage 2 LA engine
    implementation (~1000-1500 LOC) plus hours of toy matrix runs; Stage 0/3
    zero scientific walks; Stage 1 minutes-scale. Peak memory under 200 MB
    expected; hard cap 4 GB machine protection.

  stopping_rules:
    - Stop Stage 0 after reproduction artifacts + g_rho pin note + symbolic model written.
    - If Stage 0 reproduction error > 5% on the 1263-GPU figure or the ECC2K-130 triple fails, HALT all further stages.
    - Stop Stage 1 after all declared (n, curve_kind, P, theta) cells report 30 seeds or hit wall clock.
    - Stop Stage 2 after LA engine sources are present and all declared (B', n0, engine, real/null) cells report metrics or hit wall clock.
    - Stage 3 begins only after Stage 0-2 gates pass (and KN-LIT-017 body-read attested for literature quotes of the constant).
    - Stop Stage 3 after region table + (E1)/(E2) labels emitted for all standardized rows in scope.
    - Timeout/crash is failed_infrastructure, never a mathematical miss.
    - If Stage 2 finds real chain << null, archive the structure certificate before Stage 3 uses any recalled constant.

  invalidation_rules:
    - Missing required artifacts invalidate the run.
    - Overwriting an existing run record invalidates the procedure.
    - Changing success/falsification criteria after observing outcomes without a versioned protocol_amendment invalidates interpretation.
    - Mixing measured and modeled numbers in one reported column invalidates the cost table.
    - Claiming novelty of the P/(2D) formula invalidates the novelty disclosure.
    - Using g_rho units other than pinned sqrt(|Aut|) in the B-m vs K-m control invalidates binding-axis conclusions.
    - Emitting Stage 3 deployed-row quotes of the chain constant as literature-supported before KN-LIT-017 body read invalidates those quotes (measurement-only labels remain OK).
    - Reading AUXIN/FROB/QSP run values into this experiment invalidates scope.
    - Any claim of deployed-curve break or exponent move invalidates the report.
    - Amazon Bedrock use invalidates the session artifacts.

  success_criterion: >-
    Stage 0: ECC2K-130 triple reproduced; 1263 GPUs/year within 5%; sect113r2
    anchor reproduced; g_rho pin recorded; symbolic region model present.
    Stage 1: for each declared cell, measured relative overhead tracks P/(2D)
    within 20% across the theta sweep (or a systematic departure is reported
    as limb-B falsification with full artifacts). Stage 2: LA engine sources
    under implementation/; chain length, field ops, peak words, c_M reported
    for all three engines on real and null matrices across n0 sweep.
    Stage 3 (after gates): region table with charged ops, peak words, P*,
    binding axis, L_mv sensitivity, both B' readings, extrapolation distance;
    (E1)/(E2) labelled confirmed|refuted|sweep-dependent per row. All primary
    metrics decidable from predefined outputs.

  falsification_criterion: >-
    Stage 0 reproduction failure; OR Stage 1 systematic departure from P/(2D);
    OR Stage 2 real chain materially below null while null matches 2B'/n0
    (structure finding — scientific success of a different kind, still a
    falsifier of the generic-floor premise used in (E1) as stated); OR any
    row with P* < 10^6 (E1); OR competitive row memory ratio < 2^4 (E2);
    OR binding axis flips under pinned g_rho B-m vs K-m from symmetry alone.

  required_artifacts:
    - experiments/EXP-BINSTD-a3fa22/runs/RUN-*/raw-result.json
    - experiments/EXP-BINSTD-a3fa22/runs/RUN-*/manifest.yaml
    - experiments/EXP-BINSTD-a3fa22/runs/RUN-*/stdout.txt
    - stage0/reproduction-ecc2k130.yaml
    - stage0/reproduction-sect113r2.yaml
    - stage0/g_rho_pin.md
    - stage0/symbolic-region-model.md
    - stage1/rho-overhead-summary.json
    - stage2/la-engine-sources-manifest.yaml
    - stage2/krylov-chain-summary.json
    - stage2/c_M_summary.json
    - stage3/region-table.yaml
    - stage3/E1_E2_verdicts.yaml
    - implementation/ (block Wiedemann, block Lanczos, structured GE, rho instrument)

  stage_gates:
    stage0_hard_gate: >-
      Must pass before Stage 1 scientific walks count as evidence for the region
      model (Stage 1 may be implemented in parallel with Stage 0 code, but
      Stage 1 results are not interpreted against a failed Stage 0 model).
    stage2_before_stage3: >-
      Stage 3 region table uses measured chain-length law and c_M; recalled
      2B'/n0 may not feed Stage 3 if Stage 2 disagrees.
    kn_lit_017_body_gate: >-
      Before Stage 3 quotes the chain-length constant as literature support,
      Executor (or a designated reader) records that KN-LIT-017 body was read;
      measurement-only Stage 3 labels do not need this for the numeric law.

  assigned_to: executor
  executor_handoff: TASK-20260930-2cc13f
  snapshot_task: TASK-20260930-616c86

  cost_model_disclosure: >-
    Measured: Stage 1 overhead/DP/waste; Stage 2 chain length, field ops, peak
    words, c_M, RSS; Stage 0 reproduction residuals. Modeled: Stage 3 P*,
    memory_ratio, binding axis, rho closed-form wall clocks with pinned g_rho
    and published f. Optimistic assumptions listed above; tables under those
    assumptions are bounds/comparators, not predictions of wall-clock attack
    cost on deployed curves. Limb (B) formula disclosed as known (KN-LIT-012).
