      "field": "F_(2^n)=F2[z]/f where f is the lexicographically least irreducible monic binary polynomial degree n, ordered by integer coefficient bit mask. Canonical element encoding=sum bits*2^i. Curve y^2+x*y=x^3+x^2+z, A=1,B=z; verify nonsingular. k=n/3 and V=span(1,z,...,z^(k-1)). No hidden default Sage polynomial is allowed.",
      "target": "Enumerate every affine factor-base point with x in V; sort encoded(x,y). Hash-sort ordered triples of distinct factor-base points using SHA256 UTF8 SIG|n|seed|i|j|k, ties lex indices. Test first400 triples, select first with Q1+Q2!=O and whose sum R is nonzero with R_x!=0 and whose descended system has no degree1 equation. Retain attempted triples and rejection reasons. Selection uses no matrix rank/cancellation/cost; exhausted pool is ineligible. Planted witness retained checker-side. Never silently substitute another n,seed or candidate pool. Retain the explicit chained Boolean witness u=x(Q1+Q2),x1,x2,x3 and verify both S3 equations before accepting the fixture; a point decomposition with infinite intermediate is excluded by this fixed eligibility rule, not converted into an affine u.",
      "formula": "S3(a,b,c)=(ab+ac+bc)^2+abc+B over F_(2^n). For m=3 use S3(u,x1,x2)=0 and S3(u,x3,R_x)=0. Expand u over n basis bits and each x over k bits, extract all2n coordinate equations, reduce variable powers via Boolean x^2=x. Keep original equation slots including zero generators for provenance; zero generators contribute no row tags. n+3k=2n variables ordered u bits then x1,x2,x3 bits. Implement from this formula and audit against experiments/EXP-SIG-008/src/semaev_tree.py; do not import or use old S4 code.",
      "null": "For each descended equation keep exact counts of monomials at each degree, including constant. For each degree choose that many distinct squarefree monomials uniformly from all nb-variable monomials of that degree using SHA256 seed SIGNULL|n|seed|equation|degree with unbiased rejection and sorted output. This is the T11 degree-histogram-matched support randomization. It does NOT preserve each original support or actual nonzero-column set and is NOT assumed semiregular. Both families use identical full ambient columns below, including zero columns. Record rank/solution behavior actually measured; no expected semiregular rank is a control requirement.",
      "matrix": "At each D, C0 has EVERY squarefree monomial of degree<=D in all nb variables (graded lex order), including absent/zero columns. C1 has tagged pairs(i,mu) for each nonzero equation f_i and every squarefree mu with |mu|<=D-deg(f_i), including rows mu*f_i that vanish after Boolean reduction. d1:C1->C0 maps each tag to the full coefficient column of mu*f_i. Rows may be streamed but no subset-column rank or discarded zero-column normalization is allowed.",
      "stage_order": "Calibrate n6 at all three seeds/degrees/families first, then n12 followed by n15, degrees ascending. Threshold requires full n12/n15 ladder completion; passing n12 alone is partial scope, not source prediction success."
    },
    "methods": {
      "candidate_syzygies": "Build C2 from explicitly certified relations among C1 tags. Candidate families: (a) unit vectors for vanishing rows; (b) Boolean principal relations (f_i+1)e_i, since f_i^2+f_i=0; (c) Koszul f_j e_i+f_i e_j for i<j. For(b,c), multiply by every squarefree nu of degree0..D, expand in the Boolean ring, and retain a candidate only if every surviving tag(i,mu) exists in C1; missing tags reject the entire candidate, never truncate. XOR duplicate tags, omit zero vectors, deduplicate equal vectors retaining all provenance. d2 maps each C2 generator to its vector in C1. Verify d1*d2=0 exactly before matching. Do not treat raw candidate counts as independent syzygies.",
      "matching": "Use directed graph of full complex C2->C1->C0 for nonzero differential entries. Match only C2->C1 edges with coefficient1; C0 is never matched or removed. Order candidate edges by original Markowitz product(degree_C2-1)*(incoming_degree_C1-1), then C2 index,C1 index. Greedily accept an edge only if neither endpoint is already used and reversing accepted matched edges keeps the complete graph acyclic, tested by exact topological sort. Retain accepted/rejected edges and DAG certificate; no tuning after seeing target memory.",
      "cancellation": "Eliminate the accepted unit pairs in deterministic topological order, smallest vertex tie. For pivot d2[a,b]=1, perform exact elementary basis updates to isolate the pair, transport both adjacent differentials and all reconstruction maps, then delete C2 basis b and C1 basis a only. Retain every update and induced fill. A zero updated pivot, violated DAG or failed identity invalidates the instrument; no silent alternative matching. Compute residual d1/d2 ranks with the same deterministic sparse Gaussian engine as baseline.",
      "contraction": "Emit sparse/procedural exact maps f:C->Cprime,g:Cprime->C,h:C->C[1] with dprime^2=0, f and g chain maps, f*g=I, g*f=I+d*h+h*d, f*h=0,h*g=0,h^2=0 over F2. C0 maps are identity and h0=0. Verify maps on every basis element using an independent checker, charging recomputation and all stored/transient support. Original full-column image(d1) must equal residual image(d1prime) via explicit two-way row reconstruction; do not infer rank preservation merely from homology equivalence.",
      "quotient": "Compute H1 dimension=dim C1-rank(d1)-rank(d2) in baseline and reduced complexes and transport any retained quotient representatives. This is the quotient by the declared principal/Koszul/vanishing candidate space, not by all syzygies. A planted non-model syzygy must survive; no claim of Groebner regularity or all higher-degree syzygy classification.",
      "baseline": "Empty matching uses same full C0/C1/C2, source generators, ordering, Boolean arithmetic, sparse representation and verification policy, with identity f/g and h=0 represented implicitly. Baseline directly computes rank(d1),rank(d2) and quotient witnesses. Candidate path computes same outputs after contraction; all matching/construction/map/check costs count. Baseline may stream row generation and keep only required pivots; do not force a dense straw baseline. Candidate also streams and may regenerate original rows during verification, charging all recomputation/I/O.",
      "cost": "Primary workspace is maximum total live bytes of original generators, C0 index, tagged rows/pivots, candidate syzygies, graph/topological data, residual matrices, fill, f/g/h and verifier/reconstruction scratch, using identical packed64-bit sparse index/value representation. Report uncompressed and compressed witness bytes, actual allocator/peak RSS and spill I/O separately; no map or checker exemption. Primary arithmetic counts bit XORs/ANDs, index comparisons and SHA compression rounds including both construction and complete certificate verification. Record components, CPU/wall and total stored bytes separately; no universal hardware price claimed. Each D cell includes its own full construction costs; no free reused lower-degree basis.",
      "calibration": "At n6 enumerate all2^(2n)=4096 Boolean assignments for each semaev/null system. Original versus transformed row presentations have identical evaluations/zero sets and all solutions are retained; independently compare chain polynomial evaluations to extension-field S3. For every semaev solution try all curve lifts of x coordinates and verify genuine point decompositions; retain polynomial solutions with no permitted point lift separately rather than claiming equivalence without conditions. Algebraic matrix preservation applies to the stated Boolean system, not automatically to all EC decomposition branches.",
      "reported_loss": "C0 column representation is lossless. Removed C1/C2 basis coordinates have explicit reconstruction; report dim/bytes of removed coordinates and maps, quotient fibre dimensions and maximum number of successors visited by the deterministic cancellation routine (chosen path1, candidate outgoing degrees separately). No group-action compression or generic-group escape is asserted."
    },
