# EXP-ECDLP-645b56
# Exponent-cut arithmetic. No seed list.
# Approved by DEC-20261002-ade3b7.
experiment:
  id: EXP-ECDLP-645b56
  hypothesis_id: H-ECDLP-d73cdb
  source_idea: IDEA-20261002-3722ca
  question_id: RQ-ECDLP-002
  version: 1
  title: Exponent-cut arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-ade3b7
  objective: >-
    Check that 4/9 is 1/18 below 1/2, that theta = 1 at m = 5 ties
    1/2, and that m = 4 at theta = 0 also ties 1/2.
  inputs:
    m5: 5
    theta_half_num: 1
    theta_half_den: 2
    exp_half_num: 4
    exp_half_den: 9
    gap_half_num: 1
    gap_half_den: 18
    cross_low: 8
    cross_high: 9
    theta_one: 1
    tie_gap: 0
    theta_zero: 0
    exp_zero_num: 2
    exp_zero_den: 5
    gap_zero_num: 1
    gap_zero_den: 10
    m4: 4
    excess_num: 2
    excess_den: 3
    excess_gap_num: 1
    excess_gap_den: 6
  controls:
    - >-
      4/9 is 1/18 below 1/2. Reporting the two fractions as equal
      invalidates the run.
    - >-
      At m = 5 and theta = 1 the exponent is 1/2. Reporting that cell
      as strictly below 1/2 invalidates the run.
    - >-
      At m = 5 and theta = 0 the exponent is 2/5, which is 1/10 below
      1/2.
    - >-
      At m = 4 and theta = 0 the exponent is 1/2. Reporting that cell
      as strictly below 1/2 invalidates the run.
    - >-
      At m = 4 and theta = 1 the exponent is 2/3, which exceeds 1/2
      by 1/6.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - cell in {half, one, zero, m4_zero, m4_one}
    - route in {cross_product, formula}
  metrics:
    primary:
      - gap_half
      - tie_at_one
      - implementations_agree
    secondary:
      - gap_zero
      - tie_m4
      - excess_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 4/9 is 1/18 below 1/2, and the theta = 1 cell ties 1/2.
    formula: >-
      Compare 4 times 2 with 9 times 1. Evaluate 2 divided by m minus
      theta at the five cells.
    source: >-
      IDEA-20261002-3722ca states the exponent 2/(m - theta) and the
      cut theta < m - 4, read 2026-10-02. The fractions were computed
      in this design session. That computation is not a run. No seed
      set was scanned.
  scale_relevance:
    tier: toy
    justification: Five rational cells. No transfer to a group order.
    correspondence: null
  tail_checks:
    - The exact tie at theta = 1 is required. A check that stops at 4/9 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 1/18 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The gap of 4/9 below 1/2 is not 1/18.
    - Theta = 1 at m = 5 is reported as strictly below 1/2.
    - The m = 4, theta = 0 cell is reported as strictly below 1/2.
    - A seed set is scanned or a curve is built.
  success_criterion: >-
    Both runs agree that 4/9 is 1/18 below 1/2, that the theta = 1
    cell equals 1/2, that 2/5 is 1/10 below 1/2, that the m = 4 and
    theta = 0 cell equals 1/2, and that 2/3 exceeds 1/2 by 1/6.
  falsification_criterion: >-
    The runs agree, the cross products of 4/9 and 1/2 are 8 and 9,
    and their difference is not 1.
  required_artifacts:
    - experiments/EXP-ECDLP-645b56/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-645b56/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-645b56/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-645b56/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-645b56/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-645b56/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any scan of a subgroup, any additive-energy measurement, and any curve.
    - Any claim that theta is below 1.
    - Any measured relation or linear algebra.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
