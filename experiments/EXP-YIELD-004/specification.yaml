experiment:
  id: EXP-YIELD-004
  hypothesis_id: H-YIELD-001
  goal_id: GOAL-ECDLP-001
  version: 1
  title: >-
    Direct Semaev m=2 decomposition yield measurement — ratio actual/heuristic
    across prime sizes, clean implementation without BATCH-011 INV-4 issues
  status: completed
  claim_tier: toy
  confirmatory_status: exploratory
  objective: >-
    Measure the ratio of actual m=2 Semaev decomposition yield to the heuristic
    B^2/(2N) across p in {1009, 4001, 9001} with B_frac=0.05. Determine whether
    the yield converges to, exceeds, or falls below the heuristic as p grows.
  metrics:
    primary:
      - ratio = actual_yield / min(1, heuristic)
    secondary: []
  metrics_basis: >-
    Schema slot filled under DEC-20260805-7b3e91 (RUL-12) from this contract's own
    committed text: the quantity is named in preregistered_prediction.quantity and
    is the quantity every entry in the result block reports. Nothing new is
    measured or claimed.
  success_criterion: null
  success_criterion_note: >-
    Recorded under DEC-20260805-7b3e91 (RUL-12) via the documented-null path the
    validator provides for observation-only contracts. The contract as committed
    states NO success criterion anywhere; it records `confirmatory_status:
    exploratory` and reports a measured ratio and a trend, never a pass or a fail.
    The field is present and explicitly null rather than absent so that a reader
    cannot mistake an omitted field for an overlooked one. No criterion is
    invented here.
  budget_gap_note: >-
    THIS CONTRACT HAS NO BUDGET AND ONE IS NOT SUPPLIED. The record contains no
    budget, cap, or resource statement of any kind, so there is nothing to lift
    into the slot and a budget cannot be inferred from a completed result
    (AGENTS.md rule 9). Reported as DEC-20260805-7b3e91 FINDING-4, which also
    notes that this contract carries `status: completed` and a `result` block,
    which a pre-execution contract cannot -- it was written after the fact.
  preregistered_prediction:
    quantity: ratio = actual_yield / min(1, heuristic)
    source: H-YIELD-001 (yield exceeds heuristic) vs null (yield = heuristic)
  result:
    p_1009: {ratio: 0.80, n_trials: 8}
    p_4001: {ratio: 0.98, n_trials: 8}
    p_9001: {ratio: 1.00, n_trials: 8}
    trend: ratio converges to 1.0 from BELOW as p increases
    conclusion: >-
      The Semaev m=2 yield converges to the heuristic prediction as p grows.
      It approaches 1.0 but NOT from above. H-YIELD-001 (yield exceeds heuristic)
      is NOT supported by this measurement. The heuristic B^2/(2N) is accurate and
      slightly overestimates at small p, converging to exact accuracy at larger p.
  validity_status: completed_valid_scoped
  run_id: RUN-YIELD-004
  batch_id: BATCH-062
