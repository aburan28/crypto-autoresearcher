# EXP-GFPN-3ce2d1
# Root-free companion of EXP-GFPN-8da8d4.
# Frozen before any run. Counts below are a prediction, not a result.
experiment:
  id: EXP-GFPN-3ce2d1
  hypothesis_id: H-GFPN-8aaf70
  source_idea: IDEA-20261004-31991f
  question_id: RQ-GFPN-c01af8
  goal_id: GOAL-GFPN-380702
  version: 1
  title: >-
    Identity-only side-1 subsum on y^2 = x^3 + x + 1
  status: approved
  frozen: true
  designed_at: '2026-10-05'
  approved_by: coordinator
  approval_decision_id: DEC-20261005-2a1dbb
  objective: >-
    Partition F_p by the Legendre symbol of x^3 + x + 1, add every
    ordered pair of affine points by two laws, and count side-1
    subsums that are not the identity.
  inputs:
    curve: y^2 = x^3 + x + 1
    field_model: F_p[i]/(i^2 + 1)
    primes: [7, 19, 59]
    derivative: 3x^2 + 1
    predicted_roots:
      7: []
      19: []
      59: []
    predicted_side0:
      7: [0, 2]
      19: [0, 2, 5, 7, 9, 10, 13, 14, 15, 16]
      59: [0, 1, 6, 8, 11, 13, 14, 15, 19, 21, 22, 25, 26, 27, 30, 31, 34, 38, 39, 40, 41, 42, 43, 45, 48, 49, 51, 52, 53, 54, 55]
    predicted_side1:
      7: [1, 3, 4, 5, 6]
      19: [1, 3, 4, 6, 8, 11, 12, 17, 18]
      59: [2, 3, 4, 5, 7, 9, 10, 12, 16, 17, 18, 20, 23, 24, 28, 29, 32, 33, 35, 36, 37, 44, 46, 47, 50, 56, 57, 58]
    predicted_point_count:
      7: 14
      19: 38
      59: 118
    predicted_rational_sum_count:
      7: 26
      19: 418
      59: 3900
    predicted_nonzero_side1_subsums:
      7: 0
      19: 0
      59: 0
  controls:
    - >-
      Root control. The cubic has no root in F_p. A discovered root
      invalidates the cell.
    - >-
      Positive control. Two side-0 points have side-1 subsum equal
      to the identity whenever their sum is F_p-rational.
    - >-
      Two addition laws, affine slope and Jacobian. Neither imports
      the other's sums.
    - >-
      Nonempty control. The rational-sum count must be positive.
  independent_variables:
    - prime in {7, 19, 59}
    - addition_law in {affine, jacobian}
  metrics:
    primary:
      - side_partition
      - nonzero_side1_subsums
      - rational_sum_count
      - routes_agree
    secondary:
      - point_count
      - rational_root_count
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: >-
      The partitions and counts under inputs. Nonzero side-1 subsums
      are 0. Rational-sum counts are 26, 418, and 3900.
    formula: >-
      Side is the Legendre symbol of x^3 + x + 1. With no F_p-root,
      the only rational 2-torsion point is the identity, so a
      rational pair sum has side-1 subsum equal to the identity.
    source: >-
      Lemma (L) in IDEA-20261004-31991f, specialized to this model.
      The counts were computed in the design session and are not a run.
  scale_relevance:
    tier: toy
    justification: >-
      Three primes, n = 1, and pairs only. No transfer to a Gaudry cost.
    correspondence: null
  tail_checks:
    - >-
      p=59 must be reported with its full side sets. A batch that
      stops at p=19 is invalid.
    - >-
      point_count must be 14, 38, and 118.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: >-
      Deterministic. One manifest per prime and addition law.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - Stop after six valid manifests.
    - Do not add a prime, a model, or a pair length.
    - Do not continue a cell after the addition laws disagree.
  invalidation_rules:
    - The two addition laws disagree.
    - A rational root of the cubic is found.
    - The rational-sum count is zero.
    - Square roots or sums are loaded from a table.
    - A timeout, crash, or missing manifest.
  success_criterion: >-
    All six manifests are valid, the laws agree, the side sets match,
    the root counts are 0, nonzero_side1_subsums is 0, and the
    rational-sum counts are 26, 418, and 3900.
  falsification_criterion: >-
    The laws agree, the rational-sum count is positive, and either a
    side-1 subsum is a nonzero point or a side set, root count, or
    rational-sum count differs from the table. A law disagreement
    does not meet this criterion.
  required_artifacts:
    - experiments/EXP-GFPN-3ce2d1/runs/<run-id>/command.txt
    - experiments/EXP-GFPN-3ce2d1/runs/<run-id>/stdout.txt
    - experiments/EXP-GFPN-3ce2d1/runs/<run-id>/stderr.txt
    - experiments/EXP-GFPN-3ce2d1/runs/<run-id>/result.json
    - experiments/EXP-GFPN-3ce2d1/runs/<run-id>/sides.json
  assigned_to: executor
  out_of_scope:
    - Gaudry cost and any n greater than 1.
    - The model y^2 = x^3 + x, already contracted as EXP-GFPN-8da8d4.
    - Editing H-GFPN-d48ae1 or H-GFPN-d3c9a1.
