experiment:
  id: EXP-ECDLP-628891
  hypothesis_id: H-ECDLP-3f68f6
  version: 1
  title: >
    Brute-force D_elim(2,1) instrument on a frozen
    9-bit 3-block ANF
  status: approved
  approved_by: coordinator
  approved_at: '2026-09-08'
  approval_decision: DEC-20260908-66685e
  approval_basis: >
    Standing user authorization recorded in AGENTS.md on
    2026-09-06 (ideas and experiments always approved once
    the protocol is complete). Coordinator completeness
    check is DEC-20260908-66685e after TASK-20260908-9c3bb0.
    User confirmation is not an outstanding gate.
  frozen: true
  frozen_at: '2026-09-08'
  execution_authorized: true
  execution_authorized_note: >
    Stage 0 only. Stages 1 and later remain unauthorized
    until an independent review of the Stage 0 instrument
    holds and a later Coordinator decision extends
    execution_authorized_stages. This approval does not
    authorize Stage 1 of EXP-ECDLP-9e9536, does not
    authorize Stage 1 of EXP-ECDLP-90f602, does not
    authorize Stage 2 of EXP-ECDLP-4be480, does not
    authorize Stage 2 of EXP-ECDLP-6a97f4, does not
    authorize Stage 17 of EXP-ECDLP-420e73, does not
    authorize Stage 5 of EXP-ECDLP-a98ea9, does not
    classify W, and does not change H-ECDLP-b51c3d,
    H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb,
    H-ECDLP-77caa5, H-ECDLP-07c7c6, H-ECDLP-2ade73,
    or H-ECDLP-a3598b.
  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-66685e
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-9c3bb0
  source_proposal: IDEA-20260905-3de445
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-66685e under the standing 2026-09-06
    user authorization. Stage 0 is the D_elim
    instrument. A cadical/kissat histogram is a
    later stage and is not run here.

  objective: >
    Compute brute-force D_elim(2,1) on one frozen
    family (REAL3, KF3, NULL3) and decide whether
    the elimination-degree instrument works. Stage 0
    does not parse a solver proof, does not decode
    a scalar, and does not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL3 has 32 solutions,
      32 projected pairs, 0 affine-linear forms;
      KF3 has D_elim(2,1)=1 and a_j+b_j vanish;
      NULL3 has 64 pairs and 0 linear forms,
      recorded and not a rigidity gate; empty and
      two-block objects rejected. Certificate kind none.
    formula: >
      Bits a0,a1,a2,b0,b1,b2,c0,c1,c2 over F2.
      REAL3: a0+b0+c0=1, a1+b1+c1=0, a2+b2+c2=1,
      a0*b0+a1+c2=0. KF3 is REAL3 plus a_j=b_j.
      NULL3: c0=1, c1=0, c2=1. D_elim(2,1)=1 means
      a nonzero affine-linear form in A,B vanishes
      on every extending (A,B) pair. FORCED Stage 0:
      fixture_pass, real_no_linear_pass,
      known_false_delims_one_pass, reject_invalid_pass,
      null_recorded_pass all true.
    source: >
      ledger/proposals/IDEA-20260905-3de445.yaml
      proof_search_map.baseline_embedding and
      method_ceiling.nearby_object_control.
      Provenance internal; read in this design session.

  design_tightening_stage0_is_instrument_not_encoder: >
    IDEA-20260905-3de445 also flags cadical/kissat
    learned-clause histograms as a later question.
    Stage 0 does not parse a solver proof and does
    not claim the Trimoska pdp encoder. That
    comparison is a Stage 1+ object. This is a
    disclosed tightening, not a silent change of
    the idea's claim.

  inputs:
    fixture:
      real:
        id: REAL3
        m: 3
        l: 3
        constraints:
          - a0+b0+c0 = 1
          - a1+b1+c1 = 0
          - a2+b2+c2 = 1
          - a0*b0+a1+c2 = 0
        must_solutions: 32
        must_projected_pairs: 32
        must_affine_linear_forms: 0
        role: real_system
      known_false:
        id: KF3
        extra_constraints:
          - a0 = b0
          - a1 = b1
          - a2 = b2
        must_solutions: 4
        must_projected_pairs: 4
        must_delims_one: true
        must_vanish:
          - a0+b0
          - a1+b1
          - a2+b2
        role: known_false_equal_blocks
      matched_null:
        id: NULL3
        constraints:
          - c0 = 1
          - c1 = 0
          - c2 = 1
        must_solutions: 64
        must_projected_pairs: 64
        must_affine_linear_forms: 0
        role: matched_null
        linear_count_is_not_a_gate: true
      invalid:
        - id: BLOCKS-empty
          blocks: {}
          must_reject: true
        - id: BLOCKS-twoblock
          blocks: {A: 3, B: 3}
          must_reject: true
      working_model: >
        Exact brute-force projection of a frozen
        9-bit 3-block ANF. Not a decoder. Not a
        SAT run. Not the Trimoska encoder.
      do_not_hunt_a_new_anf: true

  independent_variables:
    - object in the frozen family
    - presence of the equal-block constraint

  null_object:
    name: KF3 equal-block system
    construction: >
      REAL3 plus a_j=b_j. The elimination ideal
      of the (A,B) projection contains a_j+b_j.
      This is the known-false object for a
      "D_elim never sees a linear form" reading.
    non_degeneracy_check: >
      known_false_delims_one_pass must be true
      before any REAL3 linear-count is read as
      a measurement.
    dynamic_range_demonstration: >
      BLOCKS-empty and BLOCKS-twoblock must be
      rejected before D_elim is read as a fiber.

  controls:
    - KF3 D_elim(2,1)=1 (known-false / proves-too-much)
    - REAL3 0 affine-linear forms
    - NULL3 same-shape recorded 0
    - empty and two-block rejection
    - exact discrete constraints, no sampling
    - ANF frozen before any D_elim is read

  metrics:
    primary:
      - fixture_pass boolean
      - real_no_linear_pass boolean
      - known_false_delims_one_pass boolean
      - reject_invalid_pass boolean
      - null_recorded_pass boolean
    secondary:
      - REAL3 solutions / projected_pairs / linear_forms
      - KF3 solutions / projected_pairs / delims_one
      - NULL3 solutions / projected_pairs / linear_forms
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      One 9-bit 3-block ANF. No transfer to a pdp
      encoder, a SAT solver, or cryptographic n.
    correspondence: null

  tail_checks:
    - REAL3 constraints are the frozen four equations
    - KF3 adds a_j=b_j
    - NULL3 fixes C to 101
    - BLOCKS-empty and BLOCKS-twoblock are rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      real_no_linear_pass, known_false_delims_one_pass,
      reject_invalid_pass, and null_recorded_pass.
      A miss classifies the run failed_infrastructure
      if it is a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-DELIM.
    - Stages 1 and later are not authorized.
    - Do not hunt a new ANF.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing the 9-bit ANF after this freeze
    - Hunting a new ANF because a frozen cell fails
    - Reading Stage 0 as a SAT run, pdp encoder, or decoder
    - Reading Stage 0 as H1, a W class, or an ECDLP advantage
    - Authorizing Stage 1 of EXP-ECDLP-9e9536 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-90f602 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-4be480 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-6a97f4 from this contract
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Editing EXP-ECDLP-a5f766 or H-ECDLP-a3598b
    - Changing H-ECDLP-b51c3d, H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73

  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, real_no_linear_pass,
    known_false_delims_one_pass, reject_invalid_pass,
    and null_recorded_pass are true, and the run
    manifest carries certificate.kind none.
    Success is instrument reproduction, not a
    SAT-trace claim and not an attack.

  falsification_criterion: >
    A certified KF3 miss of D_elim(2,1)=1 after
    fixture_pass is a scoped miss of P-S0-DELIM.
    A certified REAL3 affine-linear form after
    fixture_pass is a scoped miss of P-S0-DELIM.
    Infrastructure bugs are not mathematics.
    Stage 0 does not test P-S1-TRACE.

  required_artifacts:
    - Stage 0 raw-result.json with the five gates
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - One 9-bit toy ANF.
    - Not the Trimoska pdp encoder.
    - No SAT run. No decoder. No cryptographic transfer.
    - No Stage 1 of 9e9536. No Stage 1 of 90f602.
      No Stage 2 of 4be480. No Stage 2 of 6a97f4.
      No Stage 17 of 420e73. No Stage 5 of a98ea9.
    - Certificate kind none. No solve or attack.
    - W is not classified.
    - EXP-ECDLP-a5f766 remains another lane.
    - Do not hunt a new ANF.
