experiment:
  id: EXP-MQOM-1e17ed
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-MQOM-a45638
  question_id: RQ-MQOM-001
  goal_id: GOAL-MQOM-001
  title: >-
    Reproduce, unit-check and memory-charge MQOM v2.1's own MQ security tables
    with no solver, and calibrate its semi-regularity assumption against a
    matched MQOM-shaped null and a graded oil-dimension sweep at toy scale

  objective: >-
    If a later approval and execution authorization are granted, (a) reproduce
    the specification's published hybrid-XL parameters (k, D) at its six q=16
    and q=256 parameter sets from its own semi-regular series in exact integer
    arithmetic and resolve the constant cost residual; (b) confirm that at
    MQOM's own m = n the series has no nonpositive coefficient, so the
    specification's solving degree is undefined without naming k; (c) recompute
    the binding attack row per security level under a frozen menu of
    memory-charged cost models and report the permutation table; and (d) measure
    exact Macaulay ranks at toy sizes for MQOM-shaped random systems (the
    matched null, with its prediction frozen before any linear algebra) and for
    UOV-shaped systems across a graded oil dimension, delivering the
    structured-MQ family the matched null it has never had.

  what_this_is_not:
    - Not a solve of any MQ instance, not a key recovery, not a forgery, not an attack.
    - Not a new MQ solving algorithm and not an improvement to any existing one.
    - Not a claim that MQOM fails or meets any security level.
    - Not a statement about deployed UOV, MAYO, QR-UOV or SNOVA parameters; the structured arm is a hand-built UOV-SHAPED object and is labelled so everywhere.
    - Not a validation of semi-regularity at MQOM's deployed n; the measured sizes are n <= 12 against n = 48 to 320.
    - Not a reproduction claim for the q = 2 table, which rests on an estimator the specification states is its own and unpublished and on an unpublished Crossbred+ variant.
    - Not a statement about prime-field summation-polynomial systems or about KN-OPEN-002.
    - Not a statement about any MQOM Round-3 parameter set; no Round-3 specification exists as of 2026-08-05.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling: >-
    Tier: toy. The precise scope a completed run could support is: (i) that
    MQOM v2.1's published (k, D) choices at its six q=16 and q=256 sets are
    reproduced exactly by its own stated series under one frozen scoring rule;
    (ii) that a_d > 0 for all d <= 400 at all nine MQOM (q, n=m); (iii) that
    under the frozen model menu the binding algorithm row changes at the listed
    levels and the derived margin does not decrease; and (iv) a toy-scale,
    multi-seed table of exact Macaulay ranks at n <= 12 over F_2 (and n <= 8
    over F_16 / F_256 if the port lands). NO OUTCOME may establish MQ hardness
    at MQOM's deployed sizes, may bound any solver at cryptographic scale, may
    validate semi-regularity at n = 160, may move an exponent, or may say
    anything about a structured scheme as deployed. AGENTS.md rule 7 binds
    absolutely: toy evidence is never crypto-scale evidence.

  environment_preconditions:
    measured_this_session: >-
      numpy 2.4.6 imports. sympy does NOT exist (ModuleNotFoundError). Sage does
      NOT exist, so src/ic_first_fall_fast.py cannot be imported at all (its
      line 23 is "from sage.all import GF, Matrix"). This is the answer to
      GOAL-MQOM-001's next_action: the degree-of-regularity backend is not in
      the state EV-DREG-004 left it in -- it is absent from this container.
    ev_dreg_004_applicability: >-
      NOT APPLICABLE, and recorded rather than glossed. EV-DREG-004's object is
      a boolean chained Semaev system at n = 21 over GF(2) with field equations
      carried; its validity_status is in_progress_rebuilt; two filesystem
      incidents destroyed its checkpoint at 24.93 per cent of columns; and three
      of its four run_ids are collective range labels resolving to no manifest.
      MQOM's objects are dense random MQ over F_2 / F_16 / F_256 with m = n. No
      number transfers in either direction.
    consequence_for_this_contract: >-
      Stages 1 through 3 require only exact integer arithmetic in the Python
      standard library (math.comb). Stage 4 requires a purpose-built exact rank
      routine, which is part of the work and is budgeted. A failed port is an
      infrastructure outcome and never negative mathematical evidence
      (AGENTS.md rule 5).

  inputs:
    specification_source:
      url: https://mqom.org/docs/mqom-v2.1.pdf
      fetched_this_session: true
      http_status: 200
      bytes: 707578
      version_string: "MQOM v2.1, dated 2025-09-22"
      extraction_method: >-
        Pure-zlib PDF stream decompression plus a regex over text-showing
        operators. LOSSY: table cells arrive in reading order and page numbers
        are not preserved. Stage 0 re-verifies every cell against the rendered
        PDF; until it does, no transcribed number may appear in an evidence
        record.
    mq_parameter_sets:
      gf2: [160, 240, 320]
      gf16: [56, 84, 116]
      gf256: [48, 72, 96]
    published_attack_rows:
      note: "(algorithm, level, cost_log2, memory_log2); memory is |A| for WXL/PXL/Crossbred and Space for Dinur."
      q16:
        - [WXL, I, 150.6, 50.7, "k=13", "D=13"]
        - [WXL, III, 210.8, 73.5, "k=17", "D=19"]
        - [WXL, V, 278.9, 94.0, "k=24", "D=24"]
        - [PXL, I, 142.8, 79.3, "k=12", "D=14"]
        - [PXL, III, 209.3, 116.3, "k=17", "D=19"]
        - [PXL, V, 284.9, 149.2, "k=26", "D=23"]
      q256:
        - [WXL, I, 157.0, 68.0, "k=3", "D=22"]
        - [WXL, III, 217.5, 90.8, "k=5", "D=28"]
        - [WXL, V, 280.4, 110.6, "k=8", "D=33"]
        - [PXL, I, 148, 86.5, "k=5", "D=17"]
        - [PXL, III, 216, 128.9, "k=7", "D=24"]
        - [PXL, V, 283, 169, "k=9", "D=30"]
      q2:
        - [Crossbred, I, 144, 75.3, "h=3", "D=13", "k=31"]
        - [Crossbred, III, 213, 111, "h=4", "D=20", "k=44"]
        - [Crossbred, V, 282, 145, "h=3", "D=27", "k=56"]
        - [CrossbredPlus, I, 147, 37.3, "h=86", "D=5", "k=26"]
        - [CrossbredPlus, III, 216, 54, "h=122", "D=8", "k=38"]
        - [CrossbredPlus, V, 285, 70.4, "h=160", "D=11", "k=51"]
        - [Dinur1, I, 160, 129, "n1=39"]
        - [Dinur1, III, 223, 190, "n1=58"]
        - [Dinur1, V, 283, 248, "n1=80"]
        - [Dinur2, I, 148, 107, "n1=34"]
        - [Dinur2, III, 214, 158, "n1=49"]
        - [Dinur2, V, 280, 208, "n1=64"]
      q2_exclusion_note: >-
        The q=2 rows are EXCLUDED from the reproduction claim. The specification
        states it developed its own unpublished estimator, names four ways it
        considers CryptographicEstimators v2.0.0 (git commit 0d9bd3f925e) wrong,
        and reports that library giving 151.17 (150.43 with h=3) for
        MQProblem(n=160, m=160, q=2) against its own 144. Both figures are
        reported; neither is selected.
    frozen_scoring_rule:
      a_d: "sum over j <= d/2 of (-1)^j * C(m,j) * C(nv + d - 2j, d - 2j), exact integers"
      d_solv: "min{ d <= 400 : a_d <= 0 }, else undefined"
      cost_k: "k*log2(q) + log2( 2 * C(nv+d, d)^2 * C(nv+2, 2) ) with nv = n-k, d = d_solv(m, nv)"
      note: >-
        This is the specification's BW1 shape with the (1 + n~/m~) factor set to
        1 and the + m~ term dropped. It is used ONLY for (k, D) unless and until
        stage 2 explains the constant residual.
    model_menu:
      M0: "time only; reproduces the published minimum"
      M1: "hard memory ceiling C; rows with memory > C excluded; C in 2^{40,60,80,100,120,150,210}"
      M2: "AT^2 proxy: score = log2 T + 0.5 * log2 M"
      M3: "memory-access penalty: score = log2 T + c * log2 M, c in {0, 0.1, 0.25}"
      closure: "The menu is closed before any table is transformed. No model may be added or removed after a result is seen, and no model may be selected as correct."
    toy_measurement_cells:
      fields: [2, 16, 256]
      n_equals_m_gf2: [4, 6, 8, 10, 12]
      n_equals_m_other: [4, 6, 8]
      degrees: [2, 3, 4]
      oil_dimensions: [0, 1, 2, 3, 4]
      positive_control_cell: "o = floor(n/2) with m <= o, at the largest affordable n"
      seeds_per_cell: 3
      seed_values: [1, 2, 3]
    seed_derivation_rule: >-
      Every random object is generated from SHA-256 of the ASCII byte string
      domain || "|" || label || "|" || decimal(q) || "|" || decimal(n) || "|" ||
      decimal(m) || "|" || decimal(o) || "|" || decimal(seed) || "|" ||
      decimal(counter), with domain = "EXP-MQOM-1e17ed/v1" and label in
      {"coeff", "oil", "change_of_basis"}. Digests are interpreted as big-endian
      unsigned integers, consumed ceil(log2 q) bits at a time in order, with
      rejection sampling discarding any draw at or above floor(2^b / q) * q
      before reduction mod q. The counter advances once per digest. A third
      party reproduces every system bit-for-bit from (q, n, m, o, seed) alone.
      Field elements of F_16 and F_256 use the specification's own irreducible
      polynomials, transcribed in stage 0: F_2^4 = F_2[rho]/(rho^4 + rho + 1),
      F_2^8 = F_2[xi]/(xi^8 + xi^4 + xi^3 + xi + 1).
    uov_shaped_construction: >-
      Draw a uniformly random o-dimensional subspace O of F_q^n from the seed
      stream; for each of the m equations draw a quadratic form vanishing
      identically on O by sampling its restriction to a complement and its
      cross terms; then apply a uniformly random invertible S in GL_n(F_q) drawn
      from the same stream. o = 0 yields exactly a uniformly random dense
      quadratic system, which IS the MQOM-shaped null. THIS IS A HAND-BUILT
      SHAPE AND IS NOT ANY DEPLOYED SCHEME'S KEY GENERATION.

  arms_and_controls:
    treatment: >-
      (T1) The six q=16/q=256 (k, D) reproductions and their cost residuals.
      (T2) The nine k=0 series checks to d = 400.
      (T3) The binding-row permutation table across M0..M3.
      (T4) Exact Macaulay ranks in the graded oil arm at o >= 1.
    measured_null: >-
      (N1) SERIES NULL: the synthetic overdetermined twin q=16, n=56, m=112 and
      the underdetermined twin q=16, n=56, m=28, both scored by the identical
      frozen rule. FORCED VALUES DERIVED BEFORE THE RUN: the overdetermined twin
      must return an optimal k strictly below 13 and a D strictly below 13,
      and the underdetermined twin must return an optimal k strictly above 13.
      If the rule returns (13, 13) for all three, it is reading n alone and the
      six-cell reproduction is a coincidence of the search range.
      (N2) RANK NULL: the o = 0 arm, the MQOM-shaped uniformly random system,
      whose predicted rank C(nv+D,D) - a_D at every cell is FROZEN AND COMMITTED
      IN STAGE 1 BEFORE ANY LINEAR ALGEBRA RUNS. It can fail at every cell.
    ordering_control: >-
      Stage 1 computes and commits the entire predicted rank table and the
      series-null outputs, with a digest written to disk, BEFORE any Macaulay
      matrix is built and before any structured arm is scored. The o = 0 arm is
      measured and its agreement fraction recorded before any o >= 1 arm is
      looked at. Absence of either commitment invalidates the package.
    positive_control: >-
      (P1) TABLE FLIP, hand-checkable, zero compute: imposing a memory ceiling
      of 2^80 must move the q=2 Category V binding row from Dinur 2nd (cost 280,
      space 2^208) to Crossbred (cost 282, space 2^145), and the q=256 Category
      III binding row from PXL (216, 2^128.9) to WXL (217.5, 2^90.8). IF THE
      RE-COSTING PIPELINE DOES NOT REPRODUCE BOTH FLIPS, IT IS BROKEN AND NO
      STAGE-3 RESULT MAY BE REPORTED.
      (P2) RANK DEFICIT, measured: at o = floor(n/2) with m <= o the UOV-shaped
      system admits a linear-algebra solution and its degree-3 Macaulay rank
      MUST fall strictly below the semi-regular prediction. IF IT DOES NOT, THE
      RANK INSTRUMENT IS BROKEN AND NO NEGATIVE RESULT MAY BE REPORTED FROM ANY
      ARM AT ALL.
    graded_controls: >-
      (G-MEM) Memory ceiling C swept over seven values 2^40 .. 2^210 at all nine
      levels; binding cost must be NON-INCREASING in C and exactly constant once
      C exceeds that level's largest row memory.
      (G-OIL) Oil dimension o swept over {0, 1, 2, 3, 4, floor(n/2)} at fixed
      (q, n, m, D); the rank deficit against the semi-regular prediction must be
      NON-DECREASING in o. A flat curve localises the instrument's power to zero
      at that size instead of leaving "it did not work".
      (G-SEED) Three seeds per cell; the seed-to-seed rank spread is reported
      BEFORE any model error at that cell. Semi-regularity asserts
      coefficient-independence, so a nonzero spread is itself a refutation at
      that size and is reported first.
    nearby_object_control: >-
      The synthetic overdetermined twin (N1) is the nearby object on which the
      hoped-for conclusion -- a large optimal k -- fails by construction, and it
      is the check that the scoring rule depends on the (n, m) pair rather than
      on n alone.
    comparability_policy: >-
      No comparison to EV-DREG-*, EV-SIG-* or any Semaev-lineage rank
      measurement is permitted from this package: different object, different
      construction, different field-equation treatment. Any such comparison
      requires a separately registered comparator naming both objects and the
      expected relation. Likewise no comparison to any published UOV / MAYO /
      QR-UOV / SNOVA attack figure.

  metrics:
    primary:
      - Number of the six q=16/q=256 cells whose published (k, D) is reproduced exactly (target 6).
      - Spread of the published-minus-reconstructed cost residual across the six cells, in bits (target below 0.2 around ~6.1).
      - Number of the nine MQOM (q, n=m) sets with a nonpositive a_d for some d <= 400 at k = 0 (target 0).
      - Number of the nine security levels whose binding row changes under M1 at C = 2^80 (target at least 2, specifically the two named).
      - Sign of the binding-cost shift under M1 versus M0, per level (target non-negative everywhere, strictly positive at at least two).
      - Fraction of o = 0 rank cells with nv >= 6 whose exact rank equals the frozen semi-regular prediction (target 1.00).
      - Seed-to-seed rank spread per cell (target exactly 0), reported before any model error at that cell.
      - Rank deficit as a function of o (target non-decreasing; strictly positive at the positive-control cell).
    secondary:
      - Optimal (k, D) for the overdetermined and underdetermined synthetic twins.
      - Binding-cost curve versus memory ceiling at all nine levels (seven points each).
      - The unit of each published cost column, cited to a page, or an explicit statement that the specification does not state it.
      - The retrieved NIST Category I/III/V security bars with their source, or a recorded failure to retrieve; the recalled values 2^143 / 2^207 / 2^272 are UNVERIFIED and may not be used without that retrieval.
      - Wall-clock and peak memory per rank cell, and the largest cell completed.
      - Whether the F_16 / F_256 port was achieved or only F_2 (reported, not predicted).

  heuristic_under_test: HEUR-MQOM-MQ-1

  preregistered_prediction:
    quantity: >-
      The optimal (k, D) per MQOM q=16/q=256 parameter set under the frozen
      scoring rule, and the exact degree-D Macaulay rank of a MQOM-shaped
      uniformly random system at each toy cell.
    formula: >-
      (k, D) = argmin over k of [ k*log2 q + log2(2*C(nv+d,d)^2*C(nv+2,2)) ]
      with nv = n-k and d = min{ d : [z^d] (1-z^2)^m/(1-z)^(nv+1) <= 0 };
      predicted (13,13), (17,19), (24,24) at q=16 for n = 56, 84, 116 and
      (3,22), (5,28), (8,33) at q=256 for n = 48, 72, 96.
      rank_D = C(nv+D, D) - a_D for D below the solving degree, and
      rank_D = C(nv+D, D) at or above it; at m = nv the prediction is
      rank_D = C(nv+D,D) - sum_{j<=D} C(nv,j) at every D, with no saturation.
    source: >-
      MQOM v2.1 specification Section 4.2, which states both the series and the
      rank formula, and Tables 16 and 17 for the published (k, D). READ this
      session with the lossy-extraction caveat. The (k, D) predictions were
      DERIVED IN THIS SESSION in exact integer arithmetic before this contract
      was written and are frozen here; no value may be tuned after any stage
      output is seen.

  scale_relevance:
    tier: toy
    justification: >-
      Stages 1 to 3 operate on published integers at the deployed parameter
      sets, so their conclusions are exact statements ABOUT THE SPECIFICATION'S
      OWN MODEL rather than extrapolations -- but they are conditional on that
      model, which stage 4 can only calibrate at n <= 12. Stage 4's conclusions
      DO NOT TRANSFER to n = 48..320 and no extrapolation is permitted. This
      program's own record of toy-to-crypto extrapolation failure (prime-field
      solves at p = 1009 extrapolated to N = 2^256) is cited by name in any
      conditional statement, as GOAL-MQOM-001's completion criterion requires.
    correspondence: null

  tail_checks:
    - >-
      At every measured cell, check the identity rank_D <= min(nrows, ncols) and
      report nrows and ncols explicitly; a rank exceeding either is an
      arithmetic failure and invalidates the cell.
    - >-
      At the largest measured n, check that the measured rank at D = 2 equals
      exactly m (the equations are linearly independent with overwhelming
      probability) and report any deficiency; a D = 2 deficiency is a
      construction failure, not a finding.
    - >-
      Check that the reconstructed log2 N at the q=16 Category I cell equals the
      published 40.8 to one decimal, as an independent anchor on the
      reproduction that does not go through the cost formula.

  stages:
    - id: S0
      name: source re-verification and unit reading
      compute: zero
      can_terminate_run: true
      description: >-
        Re-verify Tables 16, 17, 18 and the Section 4.2 series against the
        rendered PDF with page references; record whether the unit of the cost
        column is stated for each table; transcribe the irreducible polynomials;
        retrieve the NIST call document and read the Category bars. TERMINATES
        THE RUN if any transcribed cell disagrees.
    - id: S1
      name: series, reproduction, and frozen predictions
      compute: seconds
      can_terminate_run: true
      description: >-
        Run the series nulls (N1) first and commit them; compute the k = 0
        undefinedness check to d = 400; compute the six-cell (k, D)
        reproduction and the residual spread; compute and COMMIT the entire
        predicted rank table for stage 4 before any linear algebra exists.
        TERMINATES THE RUN if the reproduction fails at any cell or if the
        series nulls return the same (k, D) as the MQOM cells.
    - id: S2
      name: residual resolution
      compute: zero
      can_terminate_run: false
      description: >-
        Resolve the ~6.1-bit constant residual against the specification's
        stated BW1 formula. Report resolved or unresolved; an unresolved
        residual CAPS every downstream statement at "the (k,D) choices
        reproduce, the costs do not" and forbids any cost claim.
    - id: S3
      name: memory-charged re-costing
      compute: seconds
      can_terminate_run: true
      description: >-
        Run positive control P1 first. Then compute the binding row and cost
        under M0, M1 (seven ceilings), M2 and M3 (three constants) at all nine
        levels; report the permutation table, the count of levels changed, and
        the graded ceiling curve. TERMINATES if P1's two flips do not reproduce.
    - id: S4
      name: toy exact-rank measurement
      compute: bounded
      can_terminate_run: false
      description: >-
        Build and run the exact rank routine over F_2 first, smallest cell
        first; measure the o = 0 null arm and report its agreement fraction and
        seed spread BEFORE any structured arm; then the graded oil sweep,
        ending with the positive control P2. Attempt the F_16 / F_256 port only
        after the F_2 arm is complete. A truncated ladder reports what it
        covered; it does not fail.
  cheapest_decisive_stage: >-
    S1. If the six-cell reproduction fails, or if the series nulls return the
    same answer as the MQOM cells, the entire model reconstruction is wrong and
    the run ends in seconds at zero compute. S0 can end it even earlier, at zero
    compute, on a transcription disagreement.

  replication:
    seeds: [1, 2, 3]
    independent_instances: 3
    planned_runs: 1
    note: >-
      Stages 1 to 3 are deterministic and exact; replication there means two
      independent re-implementations agreeing bit-for-bit, and a disagreement is
      an implementation defect that halts the package. Stage 4 uses the three
      declared seeds per cell, and the seed spread is a reported metric rather
      than a nuisance to be averaged away.

  budget:
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 4
    maximum_memory_gb: 8
    maximum_runs: 1
    maximum_workers: 1
    network_access_required: true
    network_scope: "https://mqom.org and the NIST call document URL carried in the specification's bibliography. No other host."

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived, and authorized.
    - Stop at stage 0 on any transcription disagreement with the rendered PDF.
    - Stop at stage 1 if the six-cell (k, D) reproduction fails at any cell.
    - Stop at stage 1 if the overdetermined and underdetermined series nulls return the same optimal (k, D) as the m = n cells.
    - Stop at stage 3 if positive control P1's two table flips do not reproduce.
    - Stop stage 4's ladder at the first cell exceeding the per-cell wall-clock or memory allowance, and report the largest completed cell rather than failing the stage.
    - Do not attempt the F_16 / F_256 port before the F_2 arm is complete.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any Macaulay rank computed before the predicted rank table's digest is committed.
    - Any structured arm looked at before the o = 0 null arm's agreement fraction and seed spread are recorded.
    - Any change to the scoring rule, the model menu, the cell list, the degrees, or any forced value after a stage output has been seen.
    - Any cost claim built on the reconstruction while the residual is unresolved.
    - Any comparison to a Semaev-lineage rank measurement without a registered comparator.
    - Any use of the recalled NIST bars 2^143 / 2^207 / 2^272 without the stage-0 retrieval.
    - Any statement about a structured scheme's deployed parameters, or any extrapolation from stage 4 to any MQOM parameter set.

  success_criterion: >-
    This contract has no current success outcome because it is not authorized
    for execution. If a later, separately approved and frozen successor is
    executed, its only positive disposition is: stage 0 confirms the
    transcription and records the unit of every cost column; stage 1 reproduces
    6 of 6 (k, D) with residual spread below 0.2 bits, returns 0 of 9 on the
    undefinedness check, and passes the series nulls; stage 3's positive control
    fires and the permutation table is delivered with at least two binding-row
    changes and no negative margin shift; and stage 4 reports the o = 0 null
    arm's agreement fraction and seed spread before any structured arm, with the
    positive control P2 firing. THAT DISPOSITION ESTABLISHES NO ATTACK, NO
    SOLVE, NO EXPONENT AND NO CRYPTO-SCALE CLAIM.

  falsification_criterion: >-
    Failure of the six-cell (k, D) reproduction; or a residual spread above 0.2
    bits; or a nonpositive a_d at k = 0 for any MQOM (q, n=m); or fewer than two
    binding-row changes under M1 at 2^80; or any negative margin shift; or an
    o = 0 rank differing from the frozen prediction at any cell with nv >= 6
    (which refutes HEUR-MQOM-MQ-1 at that size and is reported FIRST); or a seed
    spread comparable to the deficits measured. Any of these refutes the
    corresponding part of H-MQOM-a45638, and the refutation is recorded in a
    superseding record rather than by editing this contract or the hypothesis.

  outcomes:
    no_execution_authorization: >-
      The only current disposition: review_required draft; no run, no evidence,
      no mathematical inference.
    future_complete_audit: >-
      Only after separate approval, freezing, authorization and valid execution.
      Scoped as in claim_ceiling.
    planned_negative_memory: >-
      If the memory sweep changes no binding row at any level under any ceiling,
      the scoped negative "for MQOM v2.1's twelve published attack rows,
      charging memory changes nothing under models M1-M3" is the deliverable,
      stated with its exact boundary. A run that does not emit that statement
      HAS NOT FINISHED.
    planned_negative_instrument: >-
      If the graded oil curve is flat at every interior o while positive control
      P2 fires, the scoped negative "this instrument has no power against oil
      structure at n <= 12 over F_2" is the deliverable, and it explicitly
      forbids any statement about UOV, MAYO, QR-UOV or SNOVA. A run that does
      not emit that statement HAS NOT FINISHED.
    stronger_target_outcome: >-
      A finding that MQOM's derived margin INCREASES under memory charging is a
      legitimate, expected and reportable positive result. It is not a
      certification of MQOM and may not be written as one.
    infrastructure_or_integrity_failure: >-
      An unfetchable PDF, an unavailable network, a failed F_16 / F_256 port, or
      a cell exceeding its allowance is an infrastructure signal reported as
      such. It is NEVER negative mathematical evidence against H-MQOM-a45638,
      against semi-regularity, or against any statement about MQOM
      (AGENTS.md rule 5).

  required_artifacts_if_later_authorized:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - SHA-256 of the fetched PDF and of the extracted text, with fetch timestamp and HTTP status.
    - Page-referenced re-verification of Tables 16, 17, 18, the Section 4.2 series, and the irreducible polynomials; plus the unit statement or its recorded absence per table.
    - The retrieved NIST category bars with their source, or a recorded retrieval failure.
