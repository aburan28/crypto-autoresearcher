experiment:
  id: EXP-SHAONE-febbd6
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-70b60d; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-70b60d
  question_id: RQ-SHAONE-081e3a
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Measure the re-implemented counter-cryptanalysis predicate's false-positive rate across five
    declared benign corpora and its true-positive rate on certified MD5-scale near-collision objects
    against shape-matched nulls.
  objective: 'The one uncertainty a run reduces is whether the deployed collision detector has a measurable
    operating point, or whether its error rates are simply unknown. Stated as parts: (i) it establishes
    whether a specification-faithful re-implementation can be produced at all and validated against
    declared test vectors, which is a precondition the RQ makes binding and which may itself fail
    and be the entire result; (ii) it measures the false-positive rate over five corpora of declared
    and deliberately different composition -- uniform random, repository text and YAML, compressed
    high-entropy data, structured binary, and boundary-shaped non-colliding inputs -- reporting a
    rate with a Clopper-Pearson interval per corpus and reporting the zero-flag case as an upper bound
    rather than as zero, together with the firing-pattern histogram that localises which tested positions
    are responsible for any flags; (iii) conditional on the predicate being applicable, it measures
    the true-positive rate on MD5-scale near-collision objects whose colliding structure is independently
    certified, against shape-matched and entropy-matched non-colliding messages run in the same invocation,
    so a flag can be attributed to structure rather than to shape. The run attempts no collision on
    SHA-1 and constructs no evading object.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: medium
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: THIS re-implementation
      of the predicate, validated against THESE test vectors, flags at THESE rates with THESE intervals
      on THESE corpora, and at THIS rate on THESE certified MD5-scale objects versus THESE shape-matched
      nulls. WHAT DOES NOT FOLLOW: nothing about whether the deployed detector binary behaves the
      same way, nothing about whether the detector''s criterion covers the disturbance-vector class,
      nothing about the safety or risk of any repository, certificate or deployed system, and nothing
      about SHA-1''s security. A low false-positive rate is not evidence of completeness, and a high
      one is not evidence of a break.'
  inputs:
    procedure: 'STAGE 0 (cost: uncertain, possibly the whole budget): obtain the counter-cryptanalysis
      specification in primary text and file it as a KN-LIT entry at a stated provenance level. If
      this fails after the declared source-preference order is exhausted, STOP -- this is a pause
      condition GOAL-SHA1-001 already carries, and it is not evidence about anything. STAGE 1 (cost:
      4-8 human-hours): re-implement the predicate, and validate against declared test vectors plus
      any offline reference implementation. Disagreement halts. STAGE 2 (cost: 2 human-hours): declare
      and freeze corpus composition and byte budgets before any flag is counted. STAGE 3 (cost: 2-8
      CPU-hours): stream the predicate over all five corpora in one pass each, counting flags and
      firing patterns, retaining every flagging input. STAGE 4 (cost: minutes): run the non-detecting
      stub predicate over the same corpora to confirm the harness reports zero when it should. STAGE
      5 (cost: inherited from GOAL-MD5-001, plus 1 CPU-hour): run the predicate over certified near-collision
      objects and over shape-matched nulls in the same invocation. STAGE 6 (cost: 1 CPU-hour): re-run
      the test vectors, compute all Clopper-Pearson intervals, emit the run manifest and every disagreement
      with the predictions.'
    instrument: Python 3.11 for orchestration and corpus streaming; the predicate re-implemented in
      C behind ctypes so the streaming pass is affordable over large corpora and so state resets are
      explicit at message boundaries; hashlib for reference digests; scipy.stats for Clopper-Pearson
      intervals; numpy for firing-pattern histograms; harness/runner.py for the run manifest and deterministic
      corpus ordering. Corpora drawn from os.urandom, the repository's own tracked text and YAML files,
      zlib-compressed streams, and synthetic structured binary. No Sage, no computer-algebra dependency,
      and no network access during the measurement pass.
    parameters: 'Five corpora, each with a declared budget of 2^32 bytes or the corpus''s natural
      size, whichever is smaller; message segmentation at 4 KiB and at 1 MiB to expose boundary effects.
      Test vectors: the full declared set from the specification, run before and after. Near-collision
      objects: at least 32 certified MD5-scale objects from the MD5 pipeline, each paired with one
      shape-matched null and one bit-flipped variant. Stub predicate: 1 run per corpus. Firing-pattern
      histogram over all tested positions. Confidence level 99 percent for all intervals.'
  controls:
  - Shape-matched, entropy-matched, non-colliding messages run in the same invocation as the true-positive
    arm.
  - Uniform random byte corpus as the distributional floor.
  - Bit-flipped variants of the near-collision objects, which destroy the structure while preserving
    shape almost exactly.
  - Re-implementation agreement check against declared test vectors, run before and after the corpora
    sweep to detect state corruption.
  - A deliberately non-detecting stub predicate run over the same corpora to confirm the harness reports
    zero when it should.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Shape-matched non-colliding messages: for every MD5-scale near-collision
    object in the true-positive arm, construct a message of identical byte length, identical block
    alignment and matched byte-entropy that contains no near-collision structure, and run the IDENTICAL
    predicate in the same invocation. The null must show a flag rate consistent with the benign-corpus
    false-positive rate. If the shape-matched null flags at a materially elevated rate, then flags
    in the signal arm are attributable to message shape rather than to colliding structure and the
    true-positive measurement means nothing.'
  independent_variables:
  - corpus identity (five declared compositions)
  - message segmentation size
  - arm (benign / certified near-collision / shape-matched null / bit-flipped variant / stub predicate)
  metrics:
    primary:
    - false-positive rate per corpus with 99 percent Clopper-Pearson interval
    - firing-pattern histogram over tested positions per corpus
    - true-positive rate on certified near-collision objects
    - flag rate on shape-matched nulls
    secondary:
    - bytes and messages processed per corpus
    - test-vector agreement fraction before and after the sweep
    - predicate throughput in bytes per second and peak working memory
    - count and identity of retained flagging inputs
  heuristic_under_test: null
  preregistered_prediction:
    quantity: FPR_c, the per-corpus false-positive rate per message, and the ratio max_c FPR_c / min_c
      FPR_c across the five corpora.
    formula: 'Predicted FPR_c < 1e-6 for every corpus c, reported as a Clopper-Pearson upper bound
      at 99 percent when the observed flag count is zero: upper bound = 1 - 0.01^(1/n) for n messages.
      The cross-corpus ratio is predicted to be reportable but is deliberately not pre-committed to
      a value, because the distribution-dependence of the rate is the quantity under study.'
    source: Pre-registered in the parent proposal IDEA-20260816-70b60d before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: medium
    justification: 'Tested parameters are 2^32 bytes per corpus at two segmentations, plus at least
      32 certified MD5-scale near-collision objects -- medium rather than toy because the corpora
      are at realistic deployment volumes for the false-positive question, which is the arm that dominates
      the deliverable. Transfer assumption stated explicitly: the false-positive rate transfers to
      other corpora only insofar as those corpora resemble the tested five, and NOT at all to adversarially
      chosen inputs, which are outside this contract. The true-positive arm''s transfer from MD5-scale
      objects to the predicate''s intended domain is an assumption the contract flags as its weakest
      and does not defend.'
    correspondence: null
  tail_checks:
  - Inspect every retained flagging input individually rather than reporting only the count; a single
    flag is more informative than a rate here.
  - Check whether flags cluster at message boundaries, which would indicate a state-reset artefact
    rather than a detector property.
  - Check whether the firing-pattern histogram is dominated by a single tested position, which would
    localise the entire rate to one criterion component.
  - Report the zero-flag case as an interval and never as the number zero.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at STAGE 0 if the specification cannot be obtained in primary text; record a pause, not a
    result.
  - Halt at STAGE 1 on any test-vector disagreement and report the disagreement as the outcome.
  - Stop the true-positive arm and report it as not measured if the predicate proves inapplicable
    to MD5-scale objects.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run is successful if a test-vector-validated re-implementation produces per-corpus
    false-positive rates or Clopper-Pearson upper bounds for all five corpora with the stub-predicate
    check returning zero -- whatever the rates turn out to be.
  falsification_criterion:
  - Test-vector disagreement before or after the sweep, voiding every rate reported.
  - The stub predicate returns non-zero flags, showing the counting harness itself flags.
  - Shape-matched nulls flag at more than 10x the benign rate, voiding the true-positive arm.
  - Flags cluster at message boundaries beyond a declared fraction, indicating a segmentation artefact
    rather than a measured rate.
  - More than the declared saturation fraction of tested positions fires on benign input, showing
    a degenerate operating point in this re-implementation.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-70b60d
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The specification must be filed as KN-LIT with a stated provenance level before approval; the
    Coordinator must confirm the filing exists and at what confidence, since the RQ forbids designing
    against a remembered description.
  - Whether MD5-scale near-collision objects are an admissible true-positive substrate for this predicate
    is unresolved and must be decided before approval rather than discovered mid-run.
  - Corpus composition needs Coordinator sign-off, since a chosen corpus can produce any false-positive
    rate and the choice must be defensible in advance.
  - The declared saturation fraction for the firing-pattern degeneracy check has no derivation and
    must be fixed as an explicit declaration.
