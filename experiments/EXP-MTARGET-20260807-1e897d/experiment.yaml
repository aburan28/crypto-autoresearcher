experiment_id: "EXP-MTARGET-20260807-1e897d"
title: "Multi-target Baby-step Giant-step with BKK Structure - p=103"
type: "multi-target-bsgs-bkk"
description: |
  Multi-target baby-step giant-step attack on ECDLP exploiting BFK structure.
  
  Parameters:
  - p: 103 (small prime for implementation simplicity)
  - |F|: 32 (field characteristic)  
  - r: 2 (target count exponent)
  - b: 6 (baby steps per table)
  - m: 6 (giant steps per table)
  
  Complexity analysis:
  - BFK runtime: O(p^{3*r-2+ε}) = O(103^4)
  - Multi-target speedup: O(|F|^{m*(r-1)})
  
  This yields exponential runtime in r for cryptographically relevant parameters.
  
