# EXP-BINSTD-cd8484
# Divisor counts for N = 16k. No genus and no cost.
# Approved by DEC-20261002-6a17cc.
experiment:
  id: EXP-BINSTD-cd8484
  hypothesis_id: H-BINSTD-5d748a
  source_idea: IDEA-20260922-0e3641
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Divisor counts of 16 times prime and composite multipliers
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-6a17cc
  objective: >-
    Enumerate the divisors of 16 and of 16k for five primes and three
    composites. On N = 240 list the divisors whose gcd with 16 is 4.
    Reject tau(240) = 10.
  inputs:
    d: 16
    divisors_of_16: [1, 2, 4, 8, 16]
    primes:
      - {k: 11, tau: 10}
      - {k: 13, tau: 10}
      - {k: 17, tau: 10}
      - {k: 19, tau: 10}
      - {k: 23, tau: 10}
    composites:
      - {k: 9, tau_k: 3, tau_N: 15}
      - {k: 15, tau_k: 4, tau_N: 20}
      - {k: 21, tau_k: 4, tau_N: 20}
    period_4_on_240: [4, 12, 20, 60]
    rejected_tau_240: 10
  controls:
    - >-
      tau(240) = 10 is the prime-k count applied to a composite and is
      false. Reporting it invalidates the run.
    - >-
      The period-4 list must contain both 12 and 60. Omitting either
      and still reporting four entries invalidates the run.
    - Two divisor routes. They must not import each other.
  independent_variables:
    - k
    - route in {trial_division, factor_product}
  metrics:
    primary:
      - tau_by_prime
      - tau_by_composite
      - prime_divisor_sets_match_union
      - period_4_list
      - tau_240_is_not_10
      - implementations_agree
    secondary:
      - gcd_with_16_is_1
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Eight divisor counts and one four-element period list.
    formula: >-
      For odd prime k the divisors of 16k are j and j*k for j dividing
      16. The period of c is 16/gcd(c, 16). On 240 that period equals 4
      exactly for 4, 12, 20 and 60.
    source: >-
      IDEA-20260922-0e3641 claim paragraphs A and B, read 2026-10-02.
      The counts were enumerated in this design session. That
      enumeration is not a run. No genus was computed.
  scale_relevance:
    tier: toy
    justification: Eight integers below 400. No transfer to a GHS cost.
    correspondence: null
  tail_checks:
    - k = 23 and k = 21 are required. Stopping before either and still reporting its count is invalid.
  replication:
    seeds: []
    independent_instances: 8
    replication_note: Deterministic. The second run is the other divisor route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If tau(240) is reported as 10, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - tau(240) is reported as 10.
    - A genus, a regime ratio, or an attack cost is reported.
  success_criterion: >-
    Both runs agree. tau(16) is 5. Each of the five primes has tau 10
    and the divisor set is the ten-element union. The composite counts
    are 15, 20 and 20. The period-4 divisors of 240 are 4, 12, 20 and
    60. tau(240) = 10 is rejected.
  falsification_criterion: >-
    The runs agree, tau(240) is not 10, and any count, prime divisor
    set, or period-4 list differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-BINSTD-cd8484/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-cd8484/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-cd8484/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-cd8484/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-cd8484/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-cd8484/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Genus ranges, regime ratios, and any GHS cost.
    - Whether an extra divisor is exploitable.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
