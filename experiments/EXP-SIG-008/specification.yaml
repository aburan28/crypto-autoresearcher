# EXP-SIG-008 specification (as approved, TASK-20260724-006)

Hypothesis: H-SIG-001 (freeze theory, EV-SIG-006): below the freeze degree a generic
column-matched null is semiregular; at n=12 the freeze degree is 7, so at D6 the null
must satisfy rank == sr_pred(12,6) = 156,520 and extra_6 = 0, making the sem's D6
quantities admissible.

Cell: boolean chained Semaev m=t=3, n=12 (nb=24), seed 2 (canonical recorded D5 cell).

Gates:
1. Column-matched D6 null baseline at n=12 vs sr_pred=156,520 (verdict: rank/extra).
2. If gate 1 validates: first admissible sem residual_6/deficit_6 at n=12
   (closure engine A3_6/A4_6/A5/F3/F4/F5; anchors rankK5=2,093, A3_5=242, A4_5=444,
   quotient sizes 1/32/1,322 asserted before any D6 claim).
3. Support-induced share of the sem-D5 deficit at n=12 (N1 null at D5 vs sem anchor).

Controls: sr_pred formula reproduction; sem D3/D4/D5 pinned anchors == EV-SIG-003;
int-mask row builder cross-check vs pinned builder at D3/D4; N1 D4 pinned cross-check;
determinism rebuild; carries sha256-verified; atomic state writes.

Budgets/stopping: per-invocation sage work <= 240 s; platform call cap 300 s;
staircase resume-safe; censor with resume commands rather than kill.

Required artifacts per run: command.txt, stdout.txt, stderr.txt, raw.json (when produced),
environment.json, manifest.yaml; plus summary.json, analysis.md, ledger/EV-SIG-008.yaml.

Falsification: gate 1 falsifies the freeze prediction iff completed null rank6 != 156,520
(equivalently extra_6 != 0 given rankK6_null = 26,792). A timeout/crash is not evidence
(AGENTS rule 5).
