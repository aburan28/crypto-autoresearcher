experiment:
  id: EXP-SIG-008
  hypothesis_id: H-SIG-001
  version: 1
  status: approved
  approved_by: coordinator   # handoff TASK-20260724-006
  approved_by_task: TASK-20260724-006
  title: >-
    n=12 D6 column-matched null baseline and, if it validates, the first
    admissible sem residual_6 / deficit_6 at n=12.
  transcription_note: >-
    This contract was committed as approved prose in a .yaml file, so it never
    parsed and every schema check on it was skipped. Transcribed 2026-08-02
    into the frozen schema with the approved text preserved verbatim in the
    fields below; the prose is reproduced in full under `as_approved_text`.
    Nothing was added, removed or reinterpreted: no parameter, gate, control,
    budget, artifact or falsification criterion differs from the approved
    document. Recorded in CORR-20260802-005.

  hypothesis_statement: >-
    H-SIG-001 (freeze theory, EV-SIG-006): below the freeze degree a generic
    column-matched null is semiregular; at n=12 the freeze degree is 7, so at
    D6 the null must satisfy rank == sr_pred(12,6) = 156,520 and extra_6 = 0,
    making the sem's D6 quantities admissible.

  cell: >-
    boolean chained Semaev m=t=3, n=12 (nb=24), seed 2 (canonical recorded
    D5 cell).

  metrics:
    gates:
      - >-
        Column-matched D6 null baseline at n=12 vs sr_pred=156,520
        (verdict: rank/extra).
      - >-
        If gate 1 validates: first admissible sem residual_6/deficit_6 at n=12
        (closure engine A3_6/A4_6/A5/F3/F4/F5; anchors rankK5=2,093,
        A3_5=242, A4_5=444, quotient sizes 1/32/1,322 asserted before any D6
        claim).
      - >-
        Support-induced share of the sem-D5 deficit at n=12 (N1 null at D5 vs
        sem anchor).

  controls:
    - sr_pred formula reproduction
    - sem D3/D4/D5 pinned anchors == EV-SIG-003
    - int-mask row builder cross-check vs pinned builder at D3/D4
    - N1 D4 pinned cross-check
    - determinism rebuild
    - carries sha256-verified
    - atomic state writes

  budget:
    per_invocation_sage_work_seconds: 240
    platform_call_cap_seconds: 300
    stopping: >-
      staircase resume-safe; censor with resume commands rather than kill.

  required_artifacts_per_run:
    - command.txt
    - stdout.txt
    - stderr.txt
    - raw.json (when produced)
    - environment.json
    - manifest.yaml
  required_artifacts_additional:
    - summary.json
    - analysis.md
    - ledger/EV-SIG-008.yaml

  success_criterion: >-
    Gate 1 is the decision point. The freeze prediction is UPHELD when the
    completed column-matched D6 null at n=12 gives rank6 == 156,520, i.e.
    extra_6 == 0 given rankK6_null = 26,792; only then are the sem D6
    quantities admissible and gates 2 and 3 authorised.

  falsification_criterion: >-
    Gate 1 falsifies the freeze prediction iff completed null rank6 != 156,520
    (equivalently extra_6 != 0 given rankK6_null = 26,792). A timeout/crash is
    not evidence (AGENTS rule 5).

  as_approved_text: |
    # EXP-SIG-008 specification (as approved, TASK-20260724-006)

    Hypothesis: H-SIG-001 (freeze theory, EV-SIG-006): below the freeze degree a generic
    column-matched null is semiregular; at n=12 the freeze degree is 7, so at D6 the null
    must satisfy rank == sr_pred(12,6) = 156,520 and extra_6 = 0, making the sem's D6
    quantities admissible.

    Cell: boolean chained Semaev m=t=3, n=12 (nb=24), seed 2 (canonical recorded D5 cell).

    Gates:
    1. Column-matched D6 null baseline at n=12 vs sr_pred=156,520 (verdict: rank/extra).
    2. If gate 1 validates: first admissible sem residual_6/deficit_6 at n=12
       (closure engine A3_6/A4_6/A5/F3/F4/F5; anchors rankK5=2,093, A3_5=242, A4_5=444,
       quotient sizes 1/32/1,322 asserted before any D6 claim).
    3. Support-induced share of the sem-D5 deficit at n=12 (N1 null at D5 vs sem anchor).

    Controls: sr_pred formula reproduction; sem D3/D4/D5 pinned anchors == EV-SIG-003;
    int-mask row builder cross-check vs pinned builder at D3/D4; N1 D4 pinned cross-check;
    determinism rebuild; carries sha256-verified; atomic state writes.

    Budgets/stopping: per-invocation sage work <= 240 s; platform call cap 300 s;
    staircase resume-safe; censor with resume commands rather than kill.

    Required artifacts per run: command.txt, stdout.txt, stderr.txt, raw.json (when produced),
    environment.json, manifest.yaml; plus summary.json, analysis.md, ledger/EV-SIG-008.yaml.

    Falsification: gate 1 falsifies the freeze prediction iff completed null rank6 != 156,520
    (equivalently extra_6 != 0 given rankK6_null = 26,792). A timeout/crash is not evidence
    (AGENTS rule 5).
