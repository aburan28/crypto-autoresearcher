# =============================================================================
# EXP-OAKLEY-b7421f -- VERSION 1 (APPROVED by DEC-20261002-800b91) frozen contract for H-OAKLEY-602f93:
# HOLD-A Oakley n=5 SAT-arm pricing + Groebner companion arm.
# Source IDEA-20260922-af7396 under RQ-OAKLEY-264353 / GOAL-ECDLP2M-001. Folds IDEA-20260922-70a67c as Stage G
# (engine-impediment path). Resolves F-2 by treating absent 684291/2caba8
# as unresolved citations.
#
# Stages 0-2 authorized; Stage G authorized only if engine present else
# O-IMPEDIMENT-G. ZERO RUNS in this design packet. No Magma/Sage/AUXIN/
# Bedrock. Singular non-null success_criterion and falsification_criterion.
# Tripwire T3: first review at review-breakthrough.
# =============================================================================
experiment:
  id: EXP-OAKLEY-b7421f
  version: 1
  hypothesis_id: H-OAKLEY-602f93
  question_id: RQ-OAKLEY-264353
  source_idea: IDEA-20260922-af7396
  related_idea_ids:
    - IDEA-20260922-70a67c
  goal_id: GOAL-ECDLP2M-001
  designed_by_task: TASK-20261002-2f358a
  snapshot_task: TASK-20261002-2f358a
  executor_task: TASK-20261002-bdd507
  title: >-
    HOLD-A: Stage-0 freeze of Oakley b-checks, crossover arithmetic, F-2
    unresolved note; Stage-1 WDSat instrument + chained t=5 builder;
    Stage-2 SAT ladder p=3..7 (four configs) + bridge/null; Stage G K_5
    if Groebner engine present else O-IMPEDIMENT-G
  status: approved
  approved_by: DEC-20261002-800b91
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-800b91
    composing_decision: DEC-20261002-800b91
    standing_authorization: >-
      AGENTS.md standing user authorization (2026-09-06). Protocol complete;
      Coordinator checked required fields (including singular
      success_criterion and falsification_criterion) before approving.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    execution_authorized_stages_note: >-
      Stage G is authorized conditionally: run if a Groebner engine over
      F_{2^p} is already available; otherwise record O-IMPEDIMENT-G and
      do not provision Magma/Sage/AUXIN as the success path.
    execution_state: approved frozen contract; awaiting /run under TASK-20261002-bdd507
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
    tripwire: T3
    tripwire_note: >-
      DEC-20260924-99ce20 T3: first review of this HOLD-A contract runs at
      review-breakthrough at max; the tier is never lowered.

  objective: >-
    (1) Stage 0: freeze Oakley b outside-subfield checks, endpoint pricing
    arithmetic, crossover p* band, F-2 unresolved note, preregistered
    predictions. (2) Stage 1: build/vendored WDSat instrument check on three
    Trimoska medians; extend chained builder to t=5 with subfield V.
    (3) Stage 2: for p in 3..7, 20 targets (10 certified-UNSAT, 10 SAT),
    four WDSat configs; fit k,c; bridge t=3 vs direct S_4; null object;
    emit exactly one SAT-path O-* label. (4) Stage G: measure K_5 at small
    p if engine present, else O-IMPEDIMENT-G. Observations only.

  claim_tier: measurement
  claim_tier_note: >-
    Pricing / scaling-law measurement on a toy ladder with labelled endpoint
    extrapolations. No IC-vs-rho claim as an attack; no exponent move.
    Missing Groebner → O-IMPEDIMENT-G only.

  inputs:
    proposal: ledger/proposals/IDEA-20260922-af7396.yaml
    companion_proposal: ledger/proposals/IDEA-20260922-70a67c.yaml
    hypothesis: ledger/hypotheses/H-OAKLEY-602f93.yaml
    decision: ledger/decisions/DEC-20261002-800b91.yaml
    question: ledger/questions/RQ-OAKLEY-264353.yaml
    goal: ledger/goals/GOAL-ECDLP2M-001.yaml
    hold_source: ledger/decisions/DEC-20260924-99ce20.yaml
    related:
      - ledger/proposals/IDEA-20260915-0d8e90.yaml
      - ledger/proposals/IDEA-20260904-96c4f3.yaml
      - inputs/TRIMOSKA-WDSAT-2024/
      - inputs/RFC2409-OAKLEY-EC2N/
      - inputs/JOUX-VITSE-2010-157/
      - harness/macaulay_fp/fixtures/gf2_chained_builder.py
    off_limits:
      - Editing IDEA-20260922-af7396 / IDEA-20260922-70a67c claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Magma / Sage / AUXIN as success path.
      - Amazon Bedrock.
      - Deployed Oakley ECDLP solves as claimed results.
      - Treating infra / missing-engine as evidence against (A)-(D).
      - Citing sibling-only EXP/H identifiers not present on this branch as DEC target_ids.
      - Relying on absent IDEA-20260922-684291 / IDEA-20260922-2caba8 (F-2 unresolved).

  controls:
    - name: trimoska_instrument_check
      description: >-
        Reproduce three shipped Trimoska WDSat medians within 6% before any
        chain instance; failure → O-ARTIFACT.
    - name: exhaustive_certificate_p_le_5
      description: >-
        At p<=5, exhaustive 4-loop of IDEA-20260904-96c4f3 must agree with
        WDSat SAT/UNSAT on every instance.
    - name: order_control
      description: x_5-first versus x_1..x_4-first on identical bytes.
    - name: xg_control
      description: XG on versus off on identical bytes.
    - name: bridge_t3
      description: Chained t=3 versus direct S_4 at Trimoska (15,5),(17,6),(19,6).
    - name: random_boolean_null
      description: >-
        Shape-matched random Boolean system (same vars/eqs/degree/XOR
        density) at every cell; must not fit c·2^{4p}.
    - name: oakley_b_reverify
      description: Stage-0 re-verify both RFC 2409 b's outside F_{2^5} and F_{2^p}.
    - name: f2_unresolved_note
      description: >-
        Stage-0 note records IDEA-20260922-684291 and IDEA-20260922-2caba8
        absent; no claim uses them.
    - name: groebner_impediment_discipline
      description: Missing Groebner engine → O-IMPEDIMENT-G for Stage G only.
    - name: memory_beside_time
      description: Peak RSS stated beside every timed instance.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_instrument_builder, 2_sat_ladder, G_groebner_optional]
    - name: tower_p
      levels: [3, 4, 5, 6, 7, 8]
    - name: wdsat_config
      levels: [default_xg_on, xg_off, x5_first, x1_to_x4_first]
    - name: target_class
      levels: [certified_unsat, sat]
    - name: system_family
      levels: [chained_t5_subfield, chained_t3_bridge, direct_S4_bridge, random_boolean_null]

  primary_metrics:
    - name: fitted_exponent_k
      definition: Fit of log2(conf) ~ log2(c) + k·p on certified-UNSAT under each config.
    - name: fitted_constant_c
      definition: c = conf / 2^{k p} at the fitted k; median and range per p.
    - name: outcome_label
      definition: >-
        Exactly one of O-K4 / O-K5 / O-SUBEX / O-SHAPE / O-ARTIFACT /
        O-IMPEDIMENT from H-OAKLEY-602f93 (Stage G may add O-IMPEDIMENT-G as a
        companion annotation without replacing the SAT-path label).
    - name: instrument_check_pass
      definition: Boolean; three Trimoska medians within 6%.
    - name: certificate_agreement_rate_p_le_5
      definition: Fraction of p<=5 instances where exhaustive 4-loop agrees with WDSat.

  secondary_metrics:
    - name: bridge_conf_ratio
      definition: chained t=3 conflicts / direct S_4 conflicts on matched cells.
    - name: null_fit_statistic
      definition: Whether null admits c·2^{4p} with c in [0.5,1].
    - name: conflicts_per_instance
      definition: Raw WDSat conflict count per (p, config, target).
    - name: wall_clock_seconds
      definition: Per-instance and per-cell aggregate wall clock.
    - name: peak_rss_bytes
      definition: Peak RSS beside every timed instance.
    - name: crossover_p_star_band
      definition: Stage-0 frozen [11,13] under K_5 in [2^{40},2^{48}] and k=4.
    - name: K_5_Fq_ops
      definition: Stage G only; F_q-operation count of F4+FGLM+roots at small p.
    - name: endpoint_pricing_table
      definition: Stage-0 arithmetic table under fitted k (updated post-Stage-2 as labelled extrapolation).

  seeds_and_replication:
    master_seed: 20261002af73
    targets_per_cell: 20
    unsat_per_cell: 10
    sat_per_cell: 10
    p_schedule: [3, 4, 5, 6, 7]
    p_8_rule: run only if fitted k under default+XG is in [3.7, 4.3]
    conflict_budget_per_instance:
      default: 268435456  # 2^28
      k5_probe_instances_at_p7: 2
      k5_probe_budget: 34359738368  # 2^35
    cheapest_discriminator: >-
      Stage-2 at p=3..5 alone (seconds–minutes) decides k=4 vs k=5 vs
      sub-exhaustive once the instrument check and exhaustive certificates
      pass.
    replication: >-
      Single primary replication under this card; seeds and cell schedule
      frozen in stage0/preregistered-predictions.json before Stage 1.

  budget:
    wall_clock_seconds: 86400
    memory_gb: 8
    maximum_runs: 3
    advisory_note: >-
      Advisory. Minutes at p<=6 under k=4; p=7 under k=5 limited to 2
      instances; Stage G absent if no engine.

  stopping_rules:
    - >-
      After Stage 2 fits k,c on p=3..7 under all four configs and writes
      exactly one SAT-path O-* label.
    - >-
      Early stop to O-ARTIFACT if Trimoska check fails or p<=5 certificate
      agreement < 1.0.
    - >-
      Early stop to O-IMPEDIMENT if WDSat cannot be built.
    - >-
      Stage G: stop as O-IMPEDIMENT-G immediately if no Groebner engine;
      do not install one.
    - Conflict budget exhaustion on an instance → record censored; do not invent a fit point.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze.
    - Using Magma/Sage/AUXIN/Bedrock as the success path.
    - Treating O-IMPEDIMENT / O-IMPEDIMENT-G as evidence against (A)-(D).
    - Running p in {31,37} under this card.
    - Claiming an Oakley break or exponent move.
    - Citing absent 684291/2caba8 as support.

  success_criterion: >-
    Decidable from the primary metrics before any run. The experiment
    SUCCEEDS as a measurement (either outcome direction) when all of:
    (1) Stage 0 worksheet present with Oakley b-checks, crossover band,
    F-2 unresolved note, and preregistered predictions frozen before
    Stage 1; (2) instrument_check_pass is true OR exactly one of
    O-ARTIFACT / O-IMPEDIMENT is named with no k-fit read; (3) exactly
    one SAT-path O-* label in RESULTS.md decidable from primary metrics
    (O-K4 / O-K5 / O-SUBEX / O-SHAPE / O-ARTIFACT / O-IMPEDIMENT);
    (4) memory (peak_rss_bytes) reported beside time for every timed
    instance that ran; (5) Stage G either reports K_5 or O-IMPEDIMENT-G.
    Success of the measurement is not endorsement of any ECDLP attack.

  falsification_criterion: >-
    Stated before any run, scoped to the tested ladder p in 3..7 (and p=8
    if run). H1 / claim (B) is falsified by O-SUBEX (k<3.5 or decaying c)
    or by O-SHAPE (null fits the same law). Mechanism (A) as what WDSat
    exploits is falsified when the t=3 bridge shows no 2^{-l} gain and
    default+XG stays at k=5 (O-K5 with bridge failure). Instrument /
    certificate failure is O-ARTIFACT: run void; not directional evidence
    against (A)-(D). Stage-0 Oakley b-check failure falsifies the
    no-2-torsion assumption and voids endpoint pricing until redone.
    Missing Groebner engine is O-IMPEDIMENT-G only, never falsification
    of (A)-(D).

  success_criteria:
    - Stage-0 freeze complete before Stage 1.
    - Exactly one SAT-path O-* label.
    - Memory beside time.
    - Stage G resolved as K_5 measurement or O-IMPEDIMENT-G.
  falsification_criteria:
    - O-SUBEX or O-SHAPE as defined on H-OAKLEY-602f93.
    - O-ARTIFACT on instrument/certificate failure.
    - Oakley b-check failure at Stage 0.

  required_artifacts:
    - experiments/EXP-OAKLEY-b7421f/stage0/preregistered-predictions.json
    - experiments/EXP-OAKLEY-b7421f/stage0/worksheet-note.md
    - experiments/EXP-OAKLEY-b7421f/stage0/f2-unresolved-note.md
    - experiments/EXP-OAKLEY-b7421f/stage1/instrument-check.json
    - experiments/EXP-OAKLEY-b7421f/stage1/builder-notes.md
    - experiments/EXP-OAKLEY-b7421f/stage2/ladder-results.jsonl
    - experiments/EXP-OAKLEY-b7421f/stage2/fits.json
    - experiments/EXP-OAKLEY-b7421f/RESULTS.md
    - experiments/EXP-OAKLEY-b7421f/runs/<RUN-OAKLEY-*>/

  stages:
    - id: 0
      name: freeze
      authorized: true
      description: >-
        Zero/tiny compute. Freeze predictions, Oakley b-checks, crossover
        arithmetic, F-2 unresolved note, endpoint pricing table under
        design figures.
    - id: 1
      name: instrument_and_builder
      authorized: true
      description: >-
        Compile WDSat; Trimoska median check; extend chained builder to
        t=5 with subfield V = ker(sigma^p-1).
    - id: 2
      name: sat_ladder
      authorized: true
      description: >-
        p in 3..7 ladder, four configs, bridge, null; fit k,c; write
        RESULTS.md with one O-* label.
    - id: G
      name: groebner_K5_companion
      authorized: conditional
      description: >-
        If Groebner engine over F_{2^p} present, measure K_5 at p in
        6..8 on symmetrised S_6; else O-IMPEDIMENT-G. Never provision
        Magma/Sage/AUXIN.

  protocol_amendments_path: experiments/EXP-OAKLEY-b7421f/amendments/
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
