experiment:
  id: EXP-ICEX-354d3a
  hypothesis_id: H-ICEX-9df78d
  derived_from_idea: IDEA-20260815-c3f707
  question_id: RQ-RELN-001
  batch_id: BATCH-fced88
  version: 1
  title: >-
    THREE COUNTERS WHERE THE LANE HAS ONE- separate attempt cost, failure
    cost and rerandomization cost in charged group operations, convert the
    lane's P(decomp) into expected charged cost per ACCEPTED relation over a
    16x factor-base sweep, measure its log-log slope against the
    independently measured attempt-cost exponent, locate the joint optimum
    with the linear-algebra term as an interval, and carry a curve-free
    subset-sum arm that must reproduce the slope
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. The lane reports a per-attempt success rate. An
    exponent consumes expected charged cost per accepted relation. Those are
    different quantities in different units, and the second has never been
    computed here. This contract computes it, with the failed attempts and
    the rerandomization charged.
    (B) WHAT IS BUILT. Three separated counters at the call sites, an
    acceptance counter, an attempt-cost exponent measured in the same run,
    and a curve-free subset-sum arm sharing every counter and every code path
    with the curve arm.
    (C) WHAT IS DECIDED. Whether the counters are wired through (P1, P2),
    whether the charged cost follows the pre-registered slope
    theta_measured - m (P3), where the joint optimum lies as an INTERVAL (P4),
    whether the derived exponent is sensitive to that optimum at all (P5),
    and whether the slope is a curve property or a supply-model property
    (P6).
    (D) WHAT IS NOT DECIDED. The ICEX comparison, which RQ-ICEX-001 reserves;
    the lane's inherited linear-algebra model, which EXP-ICEX-7ea77e
    measures; anything at medium or cryptographic scale.
    (E) THE CHEAPEST VERSION FIRST. Stage 1's first task is to determine
    whether the lane's EXISTING RELN attempt logs retain per-attempt
    outcomes. If they do, this is a re-analysis of runs already paid for; if
    they do not, a bounded instrumented re-run is required and its cost is
    reported. The contract does not assume either case.
  inputs:
    cost_unit: >-
      ONE CHARGED OPERATION IS ONE GROUP OPERATION on E(F_p) - one point
      addition or one point doubling - counted by an explicit program
      counter. Work natively counted in F_p FIELD OPERATIONS is tagged and
      converted at the frozen declared rate kappa in {1, 10, 100} field
      multiplications per group operation, one row per kappa. ACCEPTANCE RATE
      P(decomp) is a DIMENSIONLESS PROBABILITY. CHARGED COST PER ACCEPTED
      RELATION is in GROUP OPERATIONS PER RELATION. WALL CLOCK, in SECONDS,
      is a MACHINE-TAGGED SECONDARY COLUMN and never enters a primary total
      or a primary ratio - a deliberate strengthening of the source proposal,
      which accepted wall clock as a toy-scale proxy.
    unit_discipline: >-
      BINDING AND ENFORCED. Every value carries a tag in {group_ops,
      field_ops, relations, group_ops_per_relation, probability, seconds,
      dimensionless}. The harness refuses any add, subtract, divide or
      compare across tags without a named conversion recorded beside the
      result. IN PARTICULAR- a probability is never added to an operation
      count; a group-operation count is never subtracted from a
      field-operation total; and a wall-clock figure never appears in the
      same total as an operation count. A row without its kappa is INVALID.
    feasibility_gate: >-
      THE HARNESS REFUSES TO DIVIDE BY ZERO ACCEPTANCES. A cell with ZERO
      accepted relations within its attempt budget is reported as CENSORED,
      with its attempt count, its total charged attempt cost and a lower
      bound on the per-relation cost - and is NEVER assigned a finite cost, a
      point estimate, or an imputed value. Also refused and reported rather
      than priced- a factor base of size zero or one; fewer than 10 accepted
      relations in a cell (the 1/P estimator's relative error then exceeds
      30 percent and the cell may not anchor a fit); and any cell whose
      attempt budget was exhausted by the stopping rule rather than by
      completing its declared attempt count. THIS GATE IS THE ESTIMATOR FORM
      OF THE ZERO-ROW GATE- DEC-20260904-d47cd2 rejected a cost table that
      priced a matrix with no rows; a per-relation cost computed from no
      relations is the same defect wearing a different hat.
    procedure: >-
      STAGE 1 (HARD GATE). LOG INVENTORY AND COUNTER SEPARATION. Determine
      whether the lane's existing RELN logs retain per-attempt outcomes, and
      report the inventory - paths, cells, attempt counts, hashes. Then split
      the harness's single total into three counters at the call sites and
      ASSERT at every cell that the three sum EXACTLY to the previously
      reported total. An inexact decomposition is a bug, not a rounding
      issue, and halts.
      STAGE 2 (HARD GATE). COUNTER-RESPONSE NULLS. Inject a rerandomization
      of declared extra cost c_extra and confirm the charged cost per
      accepted relation rises by c_extra / P(decomp) within 15 percent; then
      run zero-cost rerandomization (instance reuse) and confirm it falls by
      the rerandomization channel's measured share within 15 percent. Failure
      voids every number in the run.
      STAGE 3 (HARD GATE). BASELINE COLLAPSE. With zero-cost rerandomization
      and unit attempt cost the estimator must collapse to 1/P(decomp) and
      reproduce the lane's committed P(decomp) values within their reported
      estimator noise.
      STAGE 4 (the measurement). The base-size sweep over at least a factor
      of 16, at least 100 targets per cell, at m in {2, 3}, all counters, all
      seeds, all kappa. Measure theta from the attempt-cost counter against
      B in the SAME run, then the slope of charged cost per accepted relation
      against B.
      STAGE 5. Add the inherited linear-algebra charge and locate the joint
      optimum as an INTERVAL; compute the derived exponent's sensitivity
      across a factor-of-four range in B.
      STAGE 6 (curve-free arm). Repeat Stages 2, 4 and 5 on subset-sum
      membership over a size-B random subset of (Z/NZ, +) at matched N and
      matched supply, through the identical code path.
      STAGE 7. The lowest-P-decile tail check for HEUR-RELN-CHG-1, the
      censored-cell table, and the random-set-base null at matched size.
    mechanism: >-
      STEP 1. Instrument three counters- (i) ATTEMPT COST, charged operations
      consumed by one decomposition attempt regardless of outcome; (ii)
      FAILURE COST, the subset of attempt cost consumed by attempts that did
      not yield an accepted relation, recorded separately so the failed work
      is visible rather than folded in; (iii) RERANDOMIZATION COST, charged
      operations consumed producing each fresh randomized instance. Plus an
      ACCEPTANCE counter.
      STEP 2. Compute charged cost per accepted relation as (total attempt
      cost + total rerandomization cost) / (accepted relations), directly
      from the counters - NOT from the formula. The FORMULA'S prediction is
      computed separately from the mean components and P(decomp), and the two
      are compared; that comparison is HEUR-RELN-CHG-1's validation and is
      the point of measuring both.
      STEP 3. Fit theta from ln(mean attempt cost) against ln(B), and the
      per-relation slope from ln(charged cost per accepted relation) against
      ln(B), with both axes in the same logarithm base (asserted).
      STEP 4. Add c_LA * B^2 and locate the interval optimum; sweep B by a
      factor of four around it and record the derived exponent's movement.
      STEP 5. Run the curve-free arm through the same functions, differing
      ONLY in the group and the decomposition predicate.
    instrument: >-
      The lane's existing RELN harness with three counters added, plus a
      post-processing layer over existing logs where they suffice. Pure
      Python with explicit counters; no wall-clock proxy in any primary
      metric.
  controls:
    - >-
      NULL 1, RANDOM-SET FACTOR BASE at matched size. Gives the charged cost
      under BIRTHDAY-ONLY supply, which is the reference any algebraic base
      must beat. A charged cost identical for an algebraic base and a random
      base of the same size means the base design contributes nothing
      measurable and must be reported as such.
    - >-
      NULL 2, DELIBERATELY EXPENSIVE RERANDOMIZATION (blocking). Must RAISE
      the charged cost per accepted relation by c_extra / P(decomp) within
      15 percent. An unchanged charged cost means the counter is not wired
      through and VOIDS every number in the run.
    - >-
      NULL 3, ZERO-COST RERANDOMIZATION (blocking). Instance reuse must LOWER
      the charged cost by the rerandomization channel's measured share within
      15 percent. Together with NULL 2 this is a two-directional test of the
      instrument- a counter that responds in only one direction is not
      measuring the cost it claims.
    - >-
      NULL 4, CURVE-FREE SUBSET-SUM ARM (REQUIRED under the standing scope
      constraint of pfdr-battery-20260904). Subset-sum membership over a
      size-B random subset of (Z/NZ, +) at matched N and matched supply, run
      through the IDENTICAL code path with the identical counters. The
      predicted slope theta - m is a property of the SUPPLY MODEL and reads
      no group law. PREDICTED- the curve-free arm reproduces the slope within
      0.3. Consequence stated in advance- if it does, no measured slope in
      this lane may be read as a statement about elliptic curves.
    - >-
      NULL 5, BASELINE COLLAPSE (blocking). Zero-cost rerandomization and
      unit attempt cost must collapse the estimator to 1/P(decomp) and
      reproduce the lane's committed values within their reported estimator
      noise.
    - >-
      CONTROL 6, EXACT DECOMPOSITION ASSERTION. The three counters must sum
      EXACTLY to the harness's previously reported single total at every
      cell.
    - >-
      CONTROL 7, KAPPA SENSITIVITY. Every row at kappa in {1, 10, 100}; a
      conclusion that flips inside the range is labelled convention-dependent.
    - >-
      CONTROL 8, SHARED COST MODEL. The cost model is recorded explicitly and
      must be the SAME model used by the yield-charged descent record
      (IDEA-20260727-002), or the two outputs cannot be added and the ICEX
      aggregate would be wrong in a way nobody notices.
  independent_variables:
    - factor base size B, swept over at least a factor of 16 at each p
    - arity m in {2, 3}
    - toy prime p over the lane's existing ladder
    - rerandomization arm in {normal, deliberately expensive, zero-cost}
    - base type in {algebraic (the lane's), random-set at matched size}
    - kappa in {1, 10, 100}
    - group object- curve arm E(F_p) against curve-free subset-sum arm over (Z/NZ, +)
  metrics:
    primary:
      - >-
        attempt cost, CHARGED GROUP OPERATIONS, mean and full distribution
        per (p, m, B, arm, seed)
      - >-
        failure cost, CHARGED GROUP OPERATIONS, reported separately from
        attempt cost so the failed work is visible
      - >-
        rerandomization cost, CHARGED GROUP OPERATIONS, its own counter
      - >-
        accepted relations, a COUNT, and P(decomp), a DIMENSIONLESS
        PROBABILITY, per cell
      - >-
        charged cost per accepted relation, GROUP OPERATIONS PER RELATION,
        with an interval, per cell - computed from the counters directly AND
        predicted from the formula, both reported
      - >-
        theta, the attempt-cost exponent, DIMENSIONLESS, measured in the same
        run
      - >-
        log-log slope of charged cost per accepted relation against B,
        DIMENSIONLESS, against the pre-registered theta - m
      - >-
        joint optimum B* with the linear-algebra term, in FACTOR-BASE
        ELEMENTS, AS AN INTERVAL
      - >-
        derived-exponent sensitivity across a factor-of-four range in B,
        DIMENSIONLESS
    secondary:
      - wall clock in SECONDS, machine-tagged, never in a primary total
      - the censored-cell table (zero or fewer than 10 accepted relations) with attempt counts and lower bounds
      - the lowest-P-decile divergence between measured and formula-predicted cost
      - the exact three-counter decomposition assertion result per cell
      - the log inventory- which existing RELN logs retain per-attempt outcomes, with hashes
      - artifact manifest with hashes and a rebuild receipt
  heuristic_under_test: HEUR-RELN-CHG-1
  preregistered_prediction:
    quantity: >-
      The log-log slope of expected charged cost per accepted relation
      against factor base size B, at fixed p and m.
    formula: >-
      With attempt cost c_A * B^theta and mean per-target yield
      binomial(B + m - 1, m) / N exactly (KN-FIND-007, quoted verbatim in
      H-ICEX-9df78d), which for B much larger than m reads as proportional to
      B^m / (m! N), the charged cost per accepted relation scales as
      B^{theta - m}. The harness evaluates the EXACT binomial and never the
      asymptotic form. PREDICTED SLOPE = theta_measured - m within +/- 0.3,
      where theta is measured in the SAME run from the attempt-cost counter
      against B. SEPARATELY PREDICTED- the slope is strictly negative; a
      slope at or above 0 contradicts the supply model.
    source: >-
      H-ICEX-9df78d statement (B); the yield factor is KN-FIND-007's
      conserved mean, read in full and quoted verbatim, and the 1/P factor is
      Wald's identity, re-derived in-record.
  scale_relevance:
    tier: toy
    justification: >-
      Toy primes on the lane's existing ladder, base sizes swept over a
      factor of 16, at least 100 targets per cell. The located optimum is a
      TOY optimum. TRANSFER ASSUMPTIONS, STATED AND NOT DISCHARGED- that the
      attempt-cost exponent theta is stable outside the tested base-size
      range, and that the inherited linear-algebra exponent 2 holds there
      too. Neither is tested here, and the second is measured by the sibling
      contract EXP-ICEX-7ea77e. Evidence is capped at claim_tier toy.
    correspondence: null
  tail_checks:
    - >-
      THE LOWEST-P DECILE OF TARGETS. HEUR-RELN-CHG-1's i.i.d. assumption
      fails first there, and the formula understates the cost exactly there.
      The divergence between measured and formula-predicted cost RESTRICTED
      to that decile is reported separately and is the heuristic's real test.
    - >-
      THE SMALLEST BASE SIZE, where P(decomp) is lowest and the acceptance
      count is smallest; it is the cell most likely to be censored and the
      one that anchors the slope. Its accepted-relation count is reported
      explicitly beside its cost.
    - >-
      THE LARGEST BASE SIZE, where the linear-algebra term begins to dominate
      and the joint optimum is decided.
    - >-
      ANY CELL WHERE THE CURVE-FREE ARM'S SLOPE DIFFERS from the curve arm's
      by more than 0.3 is inspected individually; that divergence, not the
      agreement, would be the curve-specific content.
  replication:
    seeds:
      - 20260904
      - 20260905
      - 20260906
      - 20260907
      - 20260908
    independent_instances: 5
    seeds_note: >-
      Seeds govern target selection, factor-base draw (for the random-set
      null) and the curve-free arm's subset draw. At least 5 seeds per cell;
      per-cell intervals are computed from the seed-to-seed spread and no
      difference smaller than twice that spread is reported as a difference.
      Re-analysis of existing logs inherits those logs' recorded seeds, which
      are carried into the manifest unchanged.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 24
    maximum_workers: 1
  stopping_rules:
    - Stop at maximum_runs or total_cpu_hours, whichever binds first.
    - >-
      Stop a cell at its declared attempt budget and record it as CENSORED
      with its attempt count and a lower bound; never extend a cell to
      manufacture an acceptance.
    - >-
      Stop immediately if either counter-response null fails- an unwired
      counter voids every number and the run is reported unrun.
    - >-
      Stop immediately if the three-counter decomposition does not sum
      exactly to the harness's previously reported total.
  invalidation_rules:
    - >-
      A run assigning a finite charged cost per accepted relation to a cell
      with zero acceptances is INVALID.
    - >-
      A run emitting an untagged value, mixing units in a total, or omitting
      kappa from a row is INVALID.
    - >-
      A run reporting a wall-clock figure inside a primary total or ratio is
      INVALID.
    - >-
      A run estimating a split among the three counters when they could not
      be separated is INVALID- the correct output is the combined counter
      with the decomposition claim withdrawn.
    - >-
      A run reporting the optimum as a point estimate rather than an interval
      is INVALID.
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is never negative mathematical evidence
      (AGENTS.md rule 5).
    - >-
      Any claimed relation whose certificate fails independent
      re-verification makes the run completed_invalid.
  success_criterion: >-
    The contract SUCCEEDS when Stages 1-3 gates pass, the three counters are
    reported separately at every cell, the charged cost per accepted relation
    is reported with its interval both from the counters and from the
    formula, theta and the per-relation slope are measured in the same run,
    the joint optimum is reported as an interval with its exponent
    sensitivity, the curve-free arm is reported beside the curve arm, and the
    censored-cell table is emitted. Success is the production of those
    numbers in either direction- an exponent insensitive to the optimum is a
    successful run and a budget-saving result.
  falsification_criterion:
    - >-
      F1 (voids the run). Charged cost does not respond to rerandomization
      cost in either direction. Instrumentation not wired; infrastructure
      outcome under AGENTS.md rule 5.
    - >-
      F2 (withdraws a claim, not a falsification). The three costs cannot be
      separated. Report the combined counter and withdraw the decomposition
      claim; do not estimate a split.
    - >-
      F3 (falsifies the hypothesis). The measured slope differs from
      theta_measured - m by more than 0.3 at a majority of cells with
      consistent sign.
    - >-
      F4 (falsifies the hypothesis, and is the most interesting outcome). The
      charged cost is FLAT or RISING in B. This contradicts the supply model
      and must be investigated before any optimum is reported.
    - >-
      F5 (falsifies HEUR-RELN-CHG-1). The lowest-P-decile divergence exceeds
      the estimator noise. The i.i.d. assumption fails, the formula
      understates the cost, and every number derived from it is an
      underestimate that must be labelled as one.
    - >-
      F6 (scope finding). The curve-free arm reproduces the slope within 0.3,
      as predicted. The result is about the supply model, not about elliptic
      curves, and every citation must say so.
    - >-
      F7 (budget-saving negative, a legitimate deliverable). The derived
      exponent varies less than its own confidence interval across a
      factor-of-four range in B. The optimum does not need refining; record
      that and stop refining it.
  required_artifacts:
    - manifest.yaml with exact command, git commit, dirty-tree state, environment and dependency versions
    - the Stage 1 log inventory naming which existing RELN logs retain per-attempt outcomes, with hashes
    - raw-result.json with every per-cell, per-seed, per-arm counter value and its unit tag, including per-attempt outcomes
    - the three-counter exact-decomposition assertion result per cell
    - the curve-free arm's measurements in the same file as the curve arm
    - the random-set-base null's measurements at matched size
    - the censored-cell table with attempt counts and lower bounds
    - the lowest-P-decile divergence table
    - the joint optimum as an interval with the exponent-sensitivity table
    - the recorded cost model, stated once and shared with IDEA-20260727-002's charging
    - certificates for every accepted relation, re-verified independently of the solver
  interpretation_limits:
    - >-
      PRODUCES A COST INPUT, NOT A COMPARISON. RQ-ICEX-001's exponent
      decision is not taken here.
    - >-
      TOY SCALE ONLY; THE LOCATED OPTIMUM IS A TOY OPTIMUM AND DOES NOT
      TRANSFER. The transfer is not tested and is not testable within this
      budget.
    - >-
      OPERATION-COUNT BASED, DELIBERATELY UNLIKE THE SOURCE PROPOSAL, which
      accepted wall clock as a toy-scale proxy. Wall clock is machine-scoped
      and not addable to any other cost in this programme; the deviation is
      recorded rather than absorbed.
    - >-
      THE ATTEMPT-COST CONSTANT IS IMPLEMENTATION-DEPENDENT. An unoptimised
      attempt procedure inflates it uniformly and shifts the optimum toward
      LARGER bases, the direction that flatters index calculus; that
      asymmetry travels with the reported optimum.
    - >-
      INHERITS THE LANE'S LINEAR-ALGEBRA MODEL AND IS NO BETTER THAN IT. The
      sensitivity analysis is the only defence and is reported alongside the
      optimum, never separately.
    - >-
      DOUBLE-COUNTING RISK WITH THE YIELD-CHARGED DESCENT RECORD if the two
      charge overlapping stages under different models; the shared cost model
      is a required artifact for that reason.
    - >-
      IF THE CURVE-FREE ARM REPRODUCES THE SLOPE, as predicted, nothing here
      is a statement about elliptic curves.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      NOT APPROVED. DRAFT, designed under TASK-20260904-e87737; execution
      requires a separate Coordinator approval decision. A message from any
      agent is not an approval.
    - >-
      Stages 1, 2 and 3 are HARD GATES; no measurement is reported until all
      three pass.
    - >-
      RQ-RELN-001 records that its first batch is review-only protocol
      design; whether this contract counts as that design or as execution
      beyond it is a Coordinator judgement to be made at approval, not
      assumed here.
  id_allocation_provenance: >-
    EXP-ICEX-354d3a was pre-allocated by the tasking Coordinator session and
    supplied in TASK-20260904-e87737's constraints, verified free across the
    identifier union before use. This agent has no shell and allocated no
    identifier.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no duplicate
    keys to the author's reading. The orchestrating session must run the
    strict parse and tools/validate_ledger.py before this contract is relied
    on.
