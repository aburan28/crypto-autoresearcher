experiment:
  id: EXP-HQCX-54e990
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-2e03d4; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-2e03d4
  question_id: RQ-HQC-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Paired tie-convention ablation on the HQC inner decoder: tie rate, tie multiplicity, and
    the deterministic-versus-random tie-break difference measured on identical channel realisations
    with an exact tie-free null'
  objective: 'The one uncertainty a run reduces: how much of HQC''s measured block-failure behaviour
    the inner decoder''s deterministic tie convention could possibly account for. A run establishes
    (i) the tie rate and tie multiplicity distribution of the inner maximum-likelihood decoder at
    the tested parameters, quantities this program has never measured for any decoder; (ii) the paired
    difference in per-block failure rate and in P[S > delta] between the deployed deterministic rule
    and a uniform random tie-break, decoded from identical received blocks so that tie-free trials
    contribute exactly zero variance and the estimator''s precision scales with the tie rate rather
    than with the failure rate; and (iii) the estimator''s own empirical noise floor from a random-versus-random
    arm, so that a null result is reportable as a bound with a number attached. A stress arm at tie-rich
    parameters demonstrates the instrument''s power before any null at realistic settings is interpreted.
    No attack, break, speedup or security consequence is claimed here or would follow from a run.
    No statement is made about what the published literature does or does not contain; this environment
    cannot reach external literature. No direction is declared impossible.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: at the executed parameter sets, the
      inner decoder''s tie rate is a stated number, and the difference in failure statistics between
      the deterministic and random tie conventions is bounded by a stated paired confidence interval,
      at a demonstrated instrument power. WHAT DOES NOT FOLLOW: nothing about deployed HQC parameters;
      nothing about the value of the decryption failure rate; nothing about execution timing or any
      implementation-attack surface, none of which is measured; no attack and no security consequence;
      and no claim that the specification''s tie rule is a defect, since a specification choice with
      a measured null influence is simply a licensed choice.'
  inputs:
    procedure: 'STAGE 0 (zero compute): recover the deployed tie rule from the committed transcription
      and record any incompleteness; declare the pairing, the seed separation and the significance
      thresholds. STAGE 1 (minutes): instrument the decoder to emit tie indicator and multiplicity;
      verify tie detection is exact in integer arithmetic. STAGE 2 (minutes, T = 10^6): three arms
      from identical received blocks - deterministic, random-A, random-B; run the tie-free zero-disagreement
      gate; report tau, the paired differences and both standard errors. STAGE 3 (tens of minutes):
      block-length and duplication ladder, measuring how tau falls with block length. STAGE 4 (minutes):
      stress arm at tie-rich parameters as the positive control. STAGE 5 (zero compute): assemble
      the survival chain - tau, conditional disagreement rate, induced shift in P[S > delta] - with
      intervals.'
    instrument: Python 3.11 with numpy; NO Sage. Inner Reed-Muller ML decoding by the shared numpy
      fast Walsh-Hadamard routine, kept in int32 throughout so correlations are exact integers and
      tie detection is exact rather than a tolerance test; ties detected by counting array entries
      equal to the maximum. The random tie-break draws from a seed stream provably separate from the
      channel-realisation stream, verified by a stream-independence check. Paired statistics computed
      directly from the definition, with paired and unpaired standard errors both reported, mirroring
      the committed matched-pair reporting of EV-HQC-469c08. Recorded through harness/runner.py.
    parameters: 'n = 227 and n = 587 with ord_n(2) = n-1 checked at run time. Inner codes RM(1,4)
      length 16, RM(1,5) length 32, RM(1,6) length 64, duplication in {1, 3}; n_e in {7, 18}; N/n
      near 0.98; outer radius delta = 2. Primary set: RM(1,5), duplication 1, weights tuned to a per-block
      failure rate near 1e-2. Stress arm: RM(1,4) with duplication 1 and a crossover probability tuned
      toward the ambiguity point, chosen on a disjoint pilot seed stream to make ties common. T =
      10^6 per cell for the ladder, T = 10^7 for the primary set. Three tie arms per trial; two independent
      random seeds for the noise floor.'
  controls:
  - Tie-free subpopulation zero-disagreement gate, exact and fail-closed.
  - Random-versus-random paired arm giving the estimator's empirical noise floor with no theory.
  - Stress arm at tie-rich parameters as a positive control demonstrating power.
  - Paired and unpaired standard errors both reported, following the committed EV-HQC-469c08 discipline,
    so the pairing's benefit is visible rather than asserted.
  - Tie multiplicity distribution reported, since a rule's influence depends on how many codewords
    a tie involves.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is the tie-free subpopulation, which is available in
    the same invocation and requires no separate generation: on trials where no block ties, the deterministic
    and random arms MUST produce bit-identical block-failure vectors. FOR THE SIGNAL ARM TO MEAN ANYTHING
    THE NULL MUST SHOW: zero disagreements over the entire tie-free subpopulation - a single disagreement
    there proves the arms differ somewhere other than the tie rule and voids the whole comparison.
    A second null is a two-random-arm control: run the random tie-break twice with different randomness
    and pair those, which has a known expected difference of zero and a known variance, giving the
    estimator''s own noise floor empirically rather than by formula. And a positive control: the stress
    arm at parameters where ties are common must show a detectable paired difference, otherwise the
    instrument has no demonstrated power and its null result at realistic settings is uninterpretable.'
  independent_variables:
  - 'tie convention: deployed deterministic / random-A / random-B'
  - inner block length 2^m
  - duplication multiplicity
  - channel crossover probability (stress arm)
  metrics:
    primary:
    - tie rate tau
    - tie multiplicity distribution
    - paired difference in per-block failure rate with paired standard error
    - paired difference in P[S > delta]
    - disagreement count on the tie-free subpopulation
    secondary:
    - unpaired standard error and the unpaired-to-paired ratio
    - random-versus-random noise floor
    - stress-arm paired difference and significance
    - tau as a function of block length across the ladder
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The paired difference d := P_det[F_j = 1] - P_rand[F_j = 1] at the primary parameter
      set, with its paired standard error, and the tie rate tau at that set.
    formula: d is estimated as the mean over trials and blocks of (F_j^det - F_j^rand), which is exactly
      zero on every tie-free block by construction, so Var(d-hat) scales as tau/T rather than as p/T.
      Predicted |d| <= 3 paired standard errors at the primary set (the bound outcome) and |d| > 3
      paired standard errors in the stress arm (the power demonstration). Under the null that the
      convention is irrelevant, d = 0 exactly and d-hat concentrates on the random-versus-random noise
      floor.
    source: Pre-registered in the parent proposal IDEA-20260816-2e03d4 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Executed at n = 227 and n = 587 with inner blocks of length 16 to 64 and elevated
      failure rates, orders of magnitude below deployed HQC. The tie rate depends on the inner block
      length and the crossover probability, both of which are directly varied here, so the block-length
      ladder is the closest thing to a transfer statement the design offers - and it is reported as
      a measured trend across the tested lengths, not as an extrapolation. No claim is made at deployed
      parameters. IDEA-20260808-5d8b39's observation that inner block length does not scale with security
      level is cited as that record's claim, and if it holds the ladder is more informative than it
      would otherwise be; that conditional is stated rather than assumed.
    correspondence: null
  tail_checks:
  - Report the contribution to d from high-multiplicity ties separately, since rare large-multiplicity
    events can dominate a small paired difference.
  - Verify that the tie-free zero-disagreement gate holds in every block position, not only in aggregate.
  - Check tau's stability across seed blocks to expose any dependence on the random stream.
  - Report the number of tie events contributing to d and refuse any cell with fewer than 100.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort if any disagreement is observed on the tie-free subpopulation.
  - Abort a cell whose tie-event count falls below 100 and report the shortfall rather than a difference.
  - Stop at the declared ladder; thresholds and pairing are frozen before data generation.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The tie-free gate passes exactly, the stress arm demonstrates detection at 3
    paired standard errors, and the run reports tau, the tie multiplicity distribution and the paired
    difference with paired and unpaired standard errors at every declared cell.
  falsification_criterion:
  - 'The paired difference is within 3 paired standard errors of zero at the primary set with the
    stress arm demonstrating power: the convention''s influence is bounded and the bound is the recorded
    obstruction.'
  - 'The tie-free subpopulation shows any disagreement: the comparison is void.'
  - 'The stress arm shows no detectable difference: the instrument has no demonstrated power and no
    null is interpretable.'
  - 'The random-versus-random floor is comparable to the signal: the design cannot separate them at
    this trial count.'
  - 'The committed transcription is incomplete about the rule: only tau and the noise floor are reported.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-2e03d4
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact deployed tie rule must be confirmed against the committed transcription before approval;
    the design is honest about reporting a gap, but a Coordinator should know in advance whether the
    signal arm will exist.
  - Whether the random tie-break should be uniform over tied codewords or uniform over tied codeword
    LABELS needs a ruling, since the two differ if the correlation array indexes codewords non-uniformly.
  - The stress arm's parameter choice is described as 'tuned toward the ambiguity point' and must
    be made concrete before approval, since a stress arm chosen after seeing tie rates would be a
    fitted control.
  - The stream-independence check between channel randomness and tie randomness is asserted and needs
    a written procedure.
