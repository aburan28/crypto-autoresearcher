experiment:
  id: EXP-PEXT-212d5c
  hypothesis_id: H-PEXT-d536a1
  source_idea: IDEA-20261024-b58e07
  question_id: RQ-PEXT-7c3e91
  goal_id: GOAL-PEXT-4a1d6b
  version: 1
  title: >-
    GHS cover genus floor at n = 7 (odd characteristic, with a characteristic-2 control): regression of the n = 3 /
    n = 5 census, constructive genus-7 enumeration at q = 3, 5, 7, stratified n = 7 structure census at q = 3,
    classical magic numbers at N = 7 l, and Lean decide lemmas
  experiment_class: structural-census
  status: approved
  frozen: true
  designed_at: '2026-10-24'
  designed_by: coordinator (design lane of /design-experiment IDEA-20261024-b58e07)
  selection_decision: DEC-20261024-e29f4c
  approved_by: DEC-20261024-992998
  approval_decision: DEC-20261024-992998
  execution_authorized: true
  approval_basis: >-
    AGENTS.md 'Standing user authorization' (user, 2026-09-06); approval bounded by execution: tools/experiment_preapproval.py approvable true on pushed bytes, goal approved-unrun capacity checked.
  execution_scope: >-
    The six trials of experiments/EXP-PEXT-212d5c/trial-plan.json and nothing else, in dependency order, through the frozen argv; no other q, n, stratum or seed.
  reserved_ids:
    approval_decision: DEC-20261024-992998
    observation_decision: DEC-20261024-e97526
    executor_task: TASK-20261024-672126
    archive_task: TASK-20261024-5ab5b8
    lane: BATCH-21339c
    runs:
      regression: RUN-PEXT-fccfb9
      construct: RUN-PEXT-056770
      char2: RUN-PEXT-708f11
      census: RUN-PEXT-3fd19f
      lean: RUN-PEXT-af1b2a
      analyze: RUN-PEXT-422517
  status_note: >-
    Frozen at version 1 and approved by DEC-20261024-992998 under AGENTS.md standing authorization after the preapproval probe reported approvable true on pushed bytes.
  objective: >-
    Decide, for n = 7 in odd characteristic, (a) the span spectrum (P1), (b) whether genus 7 is reached and only
    by split 2-torsion through (m, r) = (3, 7) (P2), (c) whether every non-split stratum respects its derived
    floor 161 / 193 / 193 / 577 (P3, P4) with zero violations of the derived statements (P5), (d) whether the
    characteristic-2 classical magic number obeys the same divisor-of-x^7-1 rule with the exact predicted counts
    (P6), with the genus-7 configuration-to-curve map checked at q = 3 (P7) and heuristic H1 (rate of genus-7
    split j-invariants like q^-3) tested out of sample at q = 5, 7.
  inputs:
    implementation_sources:
      note: >-
        Files under experiments/EXP-PEXT-212d5c/implementation/. Their sha256 values are bound by trial-plan.json
        source_sha256, which binds this specification by sha256. The tool is a port of the sibling tool; for
        n in {3, 5} its code paths and output bytes are the upstream's (regression trial).
      sha256_binding: trial_plan_source_sha256
      files:
      - path: cover_census_n7.rs
        provenance: >-
          port of aburan28/crypto research/ghs_cover_census_n5_20261013/cover_census_n.rs (sha256
          d2a8504b68b26ea5ef83687d682a2bae75bb254acaf7d909420103e22aa11edc, commit
          f7ed67332588643447fdeca66b3790febbcf9e92) with the n = 7 additions listed in its header
      - path: spectrum.py
        provenance: new; abstract (m, r, genus) spectrum by 2-torsion type (derivation aid of Lemma E7)
      - path: char2_magic.py
        provenance: new; characteristic-2 classical magic-number census
      - path: run.py
        provenance: new; frozen driver (stages regression, construct, char2, census, lean, analyze)
      - path: analyze.py
        provenance: new; analysis from recorded run directories
      - path: check.py
        provenance: new; producer-written output checker (not independent review)
      - path: lean/CoverCensusN7.lean
        provenance: new; decide lemmas (no Mathlib), with lean/lakefile.toml and lean/lean-toolchain (v4.34.1)
      - path: fixtures/pilot-n3-q3-cosets.jsonl
        sha256: 5003d258d9146d6650ac70d77ea373b4e4979713abbbebd82e1007c6394573ff
        provenance: verbatim copy of aburan28/crypto research/ghs_cover_census_n5_20261013/results/run-20261014T0050Z/pilot-n3-q3-cosets.jsonl
      - path: fixtures/R1-n3-q5.jsonl
        sha256: 8f1cad66e3625505b200822178a01baf98cc91c499080fef77f2f844b609babb
        provenance: verbatim copy of .../results/run-20261014T0050Z/R1-n3-q5.jsonl (reproduced the merged census run 20261013T0403Z)
      - path: fixtures/R1-n3-q7.jsonl
        sha256: 9710fcd3eb89a8ec1464541c29424ac02c7de5b15cc08b614a05f1d2886e1d08
        provenance: verbatim copy of .../results/run-20261014T0050Z/R1-n3-q7.jsonl
      - path: fixtures/D-n5-q3-cosets.jsonl
        sha256: 8f03e3d1a28a989108a038cfffab51e0362d2397dd03e06fc0ccfe442d9123fa
        provenance: verbatim copy of .../results/run-20261014T0050Z/D-n5-q3-cosets.jsonl (panel D, n = 5 q = 3, every class)
    fields: >-
      GF(q^n) for q odd prime by the upstream first-primitive-modulus construction (n = 3, 5, 7; q = 3, 5, 7);
      GF(2^N), N = 7, 14, 21, by the lowest-weight smallest irreducible polynomial (char2_magic.py). q = 9 is not
      run: the tool's field construction is for prime q, and #E(K) on a 4.8e6-element field per attaining j is
      out of proportion; the characteristic-3 confounder is separated by q = 5 and 7.
    curves: >-
      n = 7, q = 3: K-isomorphism classes of y^2 = x^3 + a2 x^2 + a4 x + a6 via the characteristic-3 families
      (a2 != 0, a4 = 0) and (a2 = 0); strata by #E(K) parity, E(K)[2] and #E(K) mod 4, and j in F_q for odd order.
      Construct arm: split curves y^2 = x(x - 1)(x - lambda) by j only (for split curves the PGL2(K)-class of B is
      fixed by j; both quadratic twists share B).
  input_bindings:
    regression_fixture_pilot_n3_q3:
      path: experiments/EXP-PEXT-212d5c/implementation/fixtures/pilot-n3-q3-cosets.jsonl
      sha256: 5003d258d9146d6650ac70d77ea373b4e4979713abbbebd82e1007c6394573ff
      upstream_commit: f7ed67332588643447fdeca66b3790febbcf9e92
      role: positive control, n = 3 q = 3 records
    regression_fixture_n3_q5:
      path: experiments/EXP-PEXT-212d5c/implementation/fixtures/R1-n3-q5.jsonl
      sha256: 8f1cad66e3625505b200822178a01baf98cc91c499080fef77f2f844b609babb
      upstream_commit: f7ed67332588643447fdeca66b3790febbcf9e92
      role: positive control, n = 3 q = 5 records (merged census)
    regression_fixture_n3_q7:
      path: experiments/EXP-PEXT-212d5c/implementation/fixtures/R1-n3-q7.jsonl
      sha256: 9710fcd3eb89a8ec1464541c29424ac02c7de5b15cc08b614a05f1d2886e1d08
      upstream_commit: f7ed67332588643447fdeca66b3790febbcf9e92
      role: positive control, n = 3 q = 7 records (merged census)
    regression_fixture_n5_q3:
      path: experiments/EXP-PEXT-212d5c/implementation/fixtures/D-n5-q3-cosets.jsonl
      sha256: 8f03e3d1a28a989108a038cfffab51e0362d2397dd03e06fc0ccfe442d9123fa
      upstream_commit: f7ed67332588643447fdeca66b3790febbcf9e92
      role: positive control, n = 5 q = 3 records (floors 33 / 33 / 25 / 5 attained)
  controls:
  - id: C1
    name: regression fixture (positive control)
    check: >-
      trial regression: the ported tool, rerun on n = 3 (q = 3, 5, 7) and n = 5 (q = 3), gives curve, group, mr and
      derived_checks records byte-identical to the vendored sibling records; spectrum.py reproduces the sibling odd
      spectra and floors at n = 3 and 5; the (m, r) lists compiled into the tool equal spectrum.py 7. Any
      difference voids the experiment (instrument defect; no later trial is read as evidence).
  - id: C2
    name: subcover-sum identity
    check: on every structure evaluated in full, genus equals the sum of (support - 2)/2 over the nonzero span vectors (tool mismatch counter must be 0)
  - id: C3
    name: structure count
    check: every model counts exactly (Q^3 - Q)/(q^3 - q) structures (tool assertion; check.py)
  - id: C4
    name: configuration-to-curve map (P7)
    check: every censused split model at q = 3 has minimum genus 7 iff its j lies in the q = 3 enumeration
  - id: C5
    name: nearby object, characteristic 2 (P6)
    check: >-
      classical GHS magic numbers m_b for every b in F_{2^{7l}}*, l = 1, 2, 3, against the predicted histogram and
      m_b = deg lcm(Ord_b, x + 1). Compared with KR-IC-791cb7: m_b = 4 is the genus 7 / 8 case of the classical
      construction; the row's genus-7 Hess family uses other degree-2 functions and its density is not the
      quantity tested.
  - id: C6
    name: negative control by derivation
    check: >-
      non-split strata are the negative control of the floor-7 mechanism: by E7 they cannot reach any genus below
      161; any non-split model at 7 (or below its floor) refutes, so the census carries a negative arm on the same
      instrument and the same structures.
  - id: C7
    name: independent blind recount (at review)
    check: >-
      before any status move, an independent session writes a second implementation from PROTOCOL text only
      (this specification and H-PEXT-d536a1, not cover_census_n7.rs) and recounts: (m, r, genus) of 2000 structures
      drawn by seed 20261024 from 4 censused q = 3 models (one per non-odd_jFq stratum, first in record order), the
      j-set of the q = 3 and q = 5 enumeration, and the l = 1, 2 characteristic-2 histograms; any difference is a
      finding against the instrument.
  independent_variables:
  - 'n in {3, 5} (regression only) and 7'
  - 'q in {3} (census), {3, 5, 7} (enumeration), {2, 4, 8} (characteristic 2)'
  - '2-torsion stratum: odd, odd_jFq, Z2_2mod4, Z2_0mod4, split'
  metrics:
    primary:
    - name: m spectrum
      pointer: analysis.json /m_values_observed, /structures_by_m_r_E2
      prediction: P1
    - name: split floor and its route
      pointer: analysis.json /predictions/P2_split_floor_7, /construct/*/j_genus7, /floor_table/split
      prediction: P2
    - name: non-split floors
      pointer: analysis.json /floor_table (observed_min, below_floor, attaining_floor per stratum)
      prediction: P3, P4
    - name: derived-check violations
      pointer: analysis.json /derived_check_violations (census-n7-q3.jsonl derived_checks record)
      prediction: P5
    - name: characteristic-2 magic-number histogram
      pointer: analysis.json /char2[*]/m_hist and /m_equals_deg_lcm_ord_b_x_plus_1_mismatches
      prediction: P6
    - name: configuration-to-curve agreement
      pointer: analysis.json /predictions/P7_configuration_map
      prediction: P7
    - name: headline
      pointer: analysis.json /headline, /valid, /invalid_reasons
      prediction: all
    secondary:
    - name: H1 rate scaling
      pointer: analysis.json /predictions/H1_rate_q_minus_3
      prediction: H1 (heuristic; out of sample at q = 5, 7)
    - name: per-curve 2-adic data
      pointer: census-n7-q3.jsonl curve records (order, v2, E2, E4, j_in_Fq, min_genus_2isog) and construct_curve v2 / v2_twist
      prediction: descriptive; no prediction (v2 and E(K)[4] are not functions of B)
    - name: Lean lemmas
      pointer: lean.json (status, axioms)
      prediction: descriptive; a build failure is a limitation of the formal arm, never evidence about a floor
    - name: wall time and peak RSS per trial
      pointer: manifest.yaml /run/timing, /run/resources
      prediction: bookkeeping only
  preregistered_predictions:
  - id: P1
    claim: m spectrum at n = 7
    test: set of m over all censused structures equals {1, 3, 4, 6, 7}; any m outside refutes M7; a proper subset is reported as under-coverage
  - id: P2
    claim: split floor 7 via (3, 7)
    test: j_genus7 > 0 at q = 3, 5, 7; at least one censused split pick at q = 3 has minimum 7; every genus-7 structure is (3, 7) on a split model
  - id: P3
    claim: non-split floors
    test: no censused model below 161 (Z2_0mod4), 193 (Z2_2mod4), 193 (odd), 577 (odd_jFq, j != 0)
  - id: P4
    claim: odd order, j not in F_q
    test: every odd-stratum model has minimum exactly 193, attained by exactly one structure
  - id: P5
    claim: derived statements
    test: zero violations in the census derived_checks record
  - id: P6
    claim: characteristic-2 divisor rule
    test: m histogram equals {1 - q - 1, 4 - 2q^4 - 2q, 7 - q^7 - 2q^4 + q} at l = 1, 2, 3 and zero lcm mismatches
  - id: P7
    claim: configuration-to-curve map
    test: zero disagreements at q = 3 (a disagreement invalidates)
  - id: H1
    claim: rate of genus-7 split j-invariants falls like q^-3
    test: slope of log rate on log q between q = 5 and 7 in [-3.5, -2.5] and the ratio of rate q^3 (q = 7 over q = 5) in [0.8, 1.25]
  scale_relevance:
    tier: toy
    justification: >-
      Structural statements: the derived floors hold for every odd q by proof; the census and enumeration test
      them where exact computation is feasible (K up to 7^7 = 823,543 elements, 3^7 for the structure scan).
  panel_sizing:
    census: >-
      q = 3 only: (Q^3 - Q)/(q^3 - q) = 435,847,959 structures per model, about 2 x 10^3 classes, so an exhaustive
      census (about 4,400 models) is out of proportion; q = 5 would be about 4 x 10^12 structures per model. The
      sample takes 24 classes per stratum (odd, Z2_2mod4, Z2_0mod4, split) by the fixed-seed stream plus every
      odd class with j in F_q, and all their K-rational 2-isogeny neighbour classes (about 200 models). 24 per
      stratum: with the q = 3 genus-7 j-rate observed in the design smoke test (0.40, data_seen below), the
      chance that no split pick reaches 7 is 0.6^24 < 10^-5, so P2's census arm is powered; for the derived
      floors any single model is a test, and 24 per stratum gives each non-split floor 24 independent chances
      to be violated on the curve itself plus its neighbours.
    construct: q = 3, 5, 7 every configuration (1,274 / 9,114 / 34,314); q = 11 would need about 2 x 10^12 field operations for the point counts.
    char2: every b in K*, N = 7, 14, 21 (127, 16,383, 2,097,151 elements).
  replication:
    seeds:
    - 20261012
    - 20261024
    seed_rule: census stratum draw Rng(20261012, tag = 1000 q + 10 n + 7 = 3077), Fisher-Yates per stratum in the fixed order odd, odd_jFq, Z2_2mod4, Z2_0mod4, split; 20261024 seeds the review recount draw
    independent_instances: 6
    trials:
    - trial_id: regression
      run_id: RUN-PEXT-fccfb9
      stage: regression
    - trial_id: construct
      run_id: RUN-PEXT-056770
      stage: construct
    - trial_id: char2
      run_id: RUN-PEXT-708f11
      stage: char2
    - trial_id: census
      run_id: RUN-PEXT-3fd19f
      stage: census
    - trial_id: lean
      run_id: RUN-PEXT-af1b2a
      stage: lean
    - trial_id: analyze
      run_id: RUN-PEXT-422517
      stage: analyze
    replication_note: >-
      Exact computations: replication is the regression fixture (C1), the independent blind recount at review
      (C7) and the byte-identical rerun of any trial from the same bound sources (determinism, excluding wall
      seconds). Trials construct, char2 and census depend on regression; analyze on regression, construct, char2 and census, and reads lean.json when present (a Lean failure never blocks the analysis).
    determinism_excluded_fields:
    - setup_s
    - wall_s
    - census-progress.log seconds
  budget:
    enforcement: advisory
    wall_clock_seconds_per_trial:
      regression: 3600
      construct: 3600
      char2: 7200
      census: 172800
      lean: 3600
      analyze: 1800
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 6
    maximum_workers: 4
    note: >-
      Machine protection only (4 threads). Census estimate from the design timing pilot (stdout discarded unread;
      see runs_before_freezing): one n = 7 q = 3 model took 1,342.6 s wall on one of 4 concurrently busy threads (about 3.1 microseconds per structure; strata:1 pilot killed after its first completed model, stdout unread); with about 220 models (24 per stratum, every odd j in F_q class, 2-isogeny neighbours) the census is about 220 x 1,343 / 4 = 74,000 s (about 20.5 h) on 4 threads; watchdog 172,800 s (48 h, 2.3 x). A timeout, memory kill or crash is failed_infrastructure,
      never evidence about a floor. Not a research budget (ECC goal, unlimited).
  stopping_rules:
  - Each trial stops when its stage completes; the census stops after every planned model is censused over all its structures.
  - A census not finished within its watchdog is failed_infrastructure; it is rerun only under a versioned amendment with the same seed and draw, never with a different sample after seeing output.
  - No trial runs before regression passes; a failed regression stops the experiment.
  invalidation_rules:
  - regression fails (any fixture difference, spectrum mismatch or tool-list mismatch) -> experiment void (instrument defect).
  - subcover-sum mismatch > 0 or a structure-count assertion -> census invalid.
  - construct configs not all (m, r) = (3, 7) -> construct invalid.
  - P7 disagreement -> configuration-to-curve map wrong; P2 and H1 are not evidence (invalid, not null).
  - check.py nonzero on a trial -> that trial is not read until the defect is explained by an amendment.
  success_criterion: >-
    SUPPORT_SCOPED (comparisons C-floor-split, C-floor-nonsplit, C-spectrum, C-char2, all absolute): analysis.json
    /valid true and /headline begins SUPPORT_SCOPED, i.e. regression passes, P1 confirmed (m set equals
    {1, 3, 4, 6, 7}), P2 confirmed, P3 confirmed, P4 confirmed, P5 confirmed (0 violations), P6 confirmed and P7
    confirmed. Scope: n = 7, odd q with the census at q = 3 (stratified sample, per-model minima exact) and the
    enumeration at q = 3, 5, 7; characteristic 2 at N = 7, 14, 21; the classical branch-set construction only.
  falsification_criterion: >-
    REFUTE (scoped): analysis.json /headline begins REFUTED on a valid analysis, i.e. some censused model lies below
    its derived floor, has an m outside {1, 3, 4, 6, 7}, is non-split at genus 7, or the characteristic-2
    histogram differs from P6. The offending model (A_idx, B_idx, a2_idx, stratum) and its structures_by_m_r are
    the counterexample certificate; the derivation they contradict is wrong (or the tool is, which the blind
    recount decides).
  inconclusive_criterion: >-
    INCONCLUSIVE: valid, no refutation, but P1 observes a proper subset of the spectrum, or P2's census arm is not
    attained, or P4 not tested; the derived statements stand untested where unattained.
  heuristic_criterion: >-
    H1 is reported as consistent or inconsistent by its own band; it never changes the headline.
  decision_impact:
    on_positive: >-
      SUPPORT_SCOPED: after the blind recount (C7) and independent review, H-PEXT-d536a1 may move to supported at
      the tested scope; the goal's first decision target gains its n = 7 floor table (split 7 derived and
      attained; Z/2 161, 2 mod 4 193, odd 193 / 577 derived, attainment as measured), and the second gains the
      cross-characteristic divisor rule at n = 7, which motivates a general-n spectrum lemma and the next prime
      with ord_n(2) < n - 1 (n = 17 symbolic, or n = 23 / 31 combinatorics).
    on_negative: >-
      REFUTE: the counterexample is re-verified by the blind recount; on confirmation the contradicted derivation
      is withdrawn, the hypothesis is rejected in scope, and the counterexample's orbit data point to the missing
      invariant (decision target 3: another invariant is needed).
    on_inconclusive: >-
      INCONCLUSIVE: no status move; the next contract targets the unattained cells (a larger split or Z/2 sample at
      q = 3, or a constructive search for the (7, 9) / (7, 10) configurations).
    on_invalid: >-
      NOT_EVIDENCE: the instrument is repaired under a versioned amendment and the affected trials rerun.
  interpretation_limits:
  - Bounded q and samples; floors are theorems by their paper proofs, the census only tests them; attainment is measured only where observed.
  - Genus says nothing about descent to F_q, transfer injectivity, hyperellipticity or cost; nothing about any deployed curve.
  - Other degree-2 functions (Hess's generalisation) can give lower genus; out of scope.
  - KN-LIT-bf1772 (Iijima-Momose-Chao) not read; novelty unverified.
  variable_ledger:
    independent:
    - name: n
      levels: [3, 5, 7]
    - name: q
      levels: [2, 3, 4, 5, 7, 8]
    - name: stratum
      levels: [odd, odd_jFq, Z2_2mod4, Z2_0mod4, split]
    factors:
    - name: branch_set_construction
      treatment: fixed
      value: B = x(E[2]) with infinity; (2,...,2) compositum of the 7 conjugate double covers
      how: one tool (cover_census_n7.rs) for every census and enumeration arm
    - name: structure_enumeration
      treatment: fixed
      value: Lang cosets by normal forms of (N(inf), N(0), N(1)), every structure per model
      how: the same transversal code for every model; count asserted per model
    - name: field_modulus
      treatment: fixed
      value: first primitive modulus (upstream construction); characteristic 2 lowest-weight irreducible
      how: deterministic construction, identical across arms of one q
    - name: class_representative
      treatment: fixed
      how: characteristic-3 family normal forms at n = 7; genus depends on B only, so any representative of a class gives the same census
    - name: curve_draw
      treatment: randomized
      how: fixed-seed Fisher-Yates per stratum (seed 20261012, tag 3077), independent of any census output
    - name: tool_build_and_host
      treatment: measured
      how: rustc version and host recorded per run; the regression trial (C-aa-rebuild) shows the output does not depend on them
    - name: threads
      treatment: fixed
      value: 4
      how: affects wall time only; models are pure functions of their input
    comparisons:
    - id: C-spectrum
      arms: [census-n7-q3]
      differs_in: []
      design: absolute
    - id: C-floor-split
      arms: [census-n7-q3 split, construct q = 3, 5, 7]
      differs_in: []
      design: absolute
    - id: C-floor-nonsplit
      arms: [census-n7-q3 odd, odd_jFq, Z2_2mod4, Z2_0mod4]
      differs_in: []
      design: absolute
    - id: C-char2
      arms: [char2 l = 1, 2, 3]
      differs_in: []
      design: absolute
    - id: C-aa-rebuild
      arms: [sibling records (upstream build, host of 2026-10-14), regression trial (this build, this host)]
      differs_in: [tool_build_and_host]
      design: aa
    crosses_map: false
    crosses_map_note: >-
      No claim moves an ECDLP across the cover: the experiment reports the genus of a cover by branch data only,
      and states descent and transfer injectivity as open. The cover is the object measured, not a map a claim
      relies on.
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261024-b58e07.yaml
    written_at: '2026-10-24'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: no n = 7 census existed; the design smoke test ran no n = 7 census output that was read'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261024-b58e07.yaml
    written_at: '2026-10-24'
    data_seen:
    - path: design smoke test, construct q = 3 (scratch output, not committed)
      measured: 'j_genus7 = 147 of 365 split j at q = 3; every configuration (3, 7)'
    sample_status: partially_in_sample
    decisive_scope: q = 5 and q = 7 enumeration and the q = 3 census arm (the census was not run); the q = 3 enumeration count is calibration only
    overlap: the q = 3 enumeration was run once in the design smoke test to prove the launcher executes
  - prediction: P3
    first_recorded_in: ledger/hypotheses/H-PEXT-d536a1.yaml
    written_at: '2026-10-24'
    data_seen: []
    sample_status: out_of_sample
    overlap: floors derived at design before any n = 7 census output was read
  - prediction: P4
    first_recorded_in: ledger/proposals/IDEA-20261024-b58e07.yaml
    written_at: '2026-10-24'
    data_seen: []
    sample_status: out_of_sample
    overlap: none
