  # ---------------------------------------------------------------------------
  definitions:
    ambient_and_sizes: >-
      ECC2K-130: y^2 + xy = x^3 + 1 over F_2[z]/(z^131 + z^13 + z^2 + z + 1),
      #E = 4 r, r = 680564733841876926932320129493409985129 (Bailey et al.
      Appendix A as frozen at inputs/BAILEY-2009-541-ECC2K130/, cited through
      EXP-BINSTD-178742 SRC-ECC2K130; not re-read here). log2 r = 129.0000.
      The product law's ambient is N = #E = 4 r = 2^131 (CORR-20260928-4cb669).
      N_prime = r/262 (negation and 131 Frobenius classes), log2 N_prime =
      120.9666. Matched rho: rho_1 = sqrt(pi r / (4 times 131)) = 2^60.8090
      (CORR-20260922-81aeab); the proposal's form sqrt(pi N_prime / 2) is the
      same number because N_prime / 2 = r / 524 (C1).
    cap_locus_and_constants: >-
      B_cap(m) = (m factorial times 2^131)^(1/m), so log2 B_cap = (131 + log2
      m factorial)/m. mu(B) = B^m / (m factorial times 2^131). A(mu) =
      1/(1 - exp(-mu)) attempts per success (1.5820 at mu = 1, 0.6617 bit;
      about 1/mu for mu much below 1). retry_m = 1/(1 - m exp(-m)) at R = B
      (1.0791 at m = 4; 1.0349 at m = 5; 1.3711 at m = 2; the exact usable
      probability (1 - exp(-m))^m is 0.9291, 0.9669, 0.7477). kappa_m =
      A(1) times retry_m = 1.7072 (m = 4), 1.6371 (m = 5); the proposal's
      rounding 1.6 is shown beside. LA_m(B) = m B^2 modular multiply-adds.
    model_Mm: >-
      For arity m, base size B, oracle per-attempt cost C and L targets:
      T_shared(B, C) = B times A(mu(B)) times C + m B^2; per_target(B, C) =
      A(mu(B)) times retry_m times C; IC(L) = T_shared + L times per_target.
      Generic side under H2: rho(L) = rho_1 sqrt(L). The window at (m, B, C)
      is the set of L with IC(L) below rho(L): with s = sqrt(L), a =
      per_target / rho_1, b = T_shared / rho_1, the set is the open interval
      between the roots of a s^2 - s + b = 0 when 4ab is below 1 and empty
      otherwise. log2 L_lo = 2 log2 s_minus, log2 L_hi = 2 log2 s_plus.
    conventions_for_g: >-
      D3 convention (the comparator, C2): C = 2^(D3(m) + g) with D3(5) =
      33.076 (one attempt per relation at B_cap), D3(4) = 11.010 (sub-cap,
      B = 2^29.036). Proposal convention (shown beside, never the
      comparator): C = 2^(32.414 + g) at m = 5, where 32.414 = D3(5) - 0.662
      charges 1.58 attempts. For the same C, g_D3 = g_prop - 0.662 at m = 5.
    frontier: >-
      At advice S = B_cap words, T_gen = sqrt(N_prime / S), P_gen =
      sqrt(N_prime S). Identity: B_cap T_gen = P_gen. Constants at C = T_gen
      are disclosed in H-BINSTD-6e4713 statement_note; an oracle at exactly
      C = T_gen reads ON the frontier within 0.5 bit, never below.
    cells:
      BIN-ORD-19: >-
        Ordinary y^2 + xy = x^3 + A x^2 + B over F_2[t]/(t^19 + t^5 + t^2 + t
        + 1), A = 46693, B = 306147 (integer bit patterns in the polynomial
        basis), #E = 2 q, q prime, G the order-q subgroup. The executor
        recomputes #E by the trace count (curve.py count_by_trace) and by the
        naive count, proves q prime (deterministic Miller-Rabin below 3.3e24)
        and halts the cell on any disagreement with "2 times 261823"
        (KN-FIND-c3a917's value, a pointer).
      BIN-KOB-19: >-
        Koblitz y^2 + xy = x^3 + 1 over the same field, #E = 4 l, l prime
        (the proposal's hand value 4 times 130873, a pointer), recomputed and
        proved at setup the same way, cross-checked against the Lucas
        recurrence s_0 = 2, s_1 = -1, s_(i+1) = -s_i - 2 s_(i-1), #E = 2^19 +
        1 - s_19.
      CTRL-ZN: >-
        The additive group Z/NZ with N the least prime above 2^20 (computed at
        setup with is_probable_prime; recorded), presented through a seeded
        random permutation pi of {0, ..., N-1}: an element z is handled only
        as its label pi(z); add(a, b) = pi(pi_inv(a) + pi_inv(b) mod N), one
        group operation; neg(a) = pi(N - pi_inv(a)); the generator is the
        label of 1. Base: 2^7 = 128 distinct nonzero elements drawn uniformly
        by the seeded stream. Enumeration oracle at m = 2: for target label
        R, for each base element F_i and each sign, test whether R - s F_i is
        a signed base element by hash lookup; one lookup is one oracle work
        unit; the attempt enumerates all 2 times 128 lookups and returns
        every decomposition found (so satisfiability is decided exactly, as
        oracle A does on the curves).
    factor_base_and_projection: >-
      On the binary cells V = {x in F_2^19 : deg x below 10} (1024 x-values),
      F = {P affine : x(P) in V}, closed under negation; columns are the
      G-classes {+Q, -Q} of pi_G(P) = [h (h^-1 mod q)] P for P in F, merged
      when equal up to sign (merge count reported). |F| and the class count
      are reported; mu_cell = C(|F|, 2)/#E is reported and must lie in
      [0.5, 2] (admission AR-MU; l = 10 is the cap locus d_cap(19, 2) =
      (19 + 1)/2 = 10 of IDEA-20260926-4b65e3 (D)). Logarithms are taken in
      F_q (resp. F_l) with respect to a generator P0 = [h] P_rand not equal
      to O.
    oracle_A: >-
      For a target R in G (as a point of E), for each x1 in V solve the
      quadratic S_3(x1, X, x(R)) = 0 in X (the root-finding of
      experiments/EXP-CERTBIN-e94b27/impl/oracles_rc1.py oracle_A, with L = 10
      in place of 9 and a GF(2^19) field), keep roots in V, lift both
      candidate points and their negatives, and keep the sign choices with
      s1 P1 + s2 P2 = R verified by point addition. One attempt = 2^10 root
      solves = 2^10 oracle work units. Certificates: every relation and every
      target decomposition is re-verified by point addition in the
      schoolbook-multiplication path (curve.py s3_eval_school and mul_school)
      independently of the table-multiplication path the oracle used.
    shared_and_per_target: >-
      shared_ops = oracle work units of relation collection + group operations
      of relation-target generation + la_ops of the full-vector solve.
      per_target_ops (per target) = oracle work units of its decomposition
      attempts + group operations of its re-randomisations + the O(m)
      multiply-adds of its log assembly. The two are never summed into one
      figure; per_target_cost(L) = (shared_ops + sum of per_target_ops over
      the L targets)/L is the quantity whose exponent is fitted, reported in
      oracle work units with the group-operation and la_ops columns beside
      it.
    usable_and_retries: >-
      A decomposition of a fresh target is usable iff every leg's column has
      a determined logarithm in the full-vector solve. usable_fraction = the
      fraction of first-found decompositions that are usable, over the 341
      targets; retries per target = attempts until a usable decomposition;
      touched-but-undetermined columns are reported as a separate diagnostic.
    fits: >-
      exponent_ic = least-squares slope of log2 per_target_cost(L) against
      log2 L over the L cells satisfying L times mean per_target_ops at most
      shared_ops / 4 (the knee rule; design expectation on every cell: L in
      1, 4, 16); a 95 percent interval by the t-statistic on the residuals
      and, in parallel, by 1000 bootstrap resamples of targets within cells.
      exponent_rho = the same slope over all five L on mean total walk_ops /
      L per L (30 seeds). Cells beyond the knee are reported with the
      flattening ratio per_target_cost(L) / (kappa_2 times mean attempt cost).
    pooling_constant: >-
      c(L) = mean over 30 seeds of total walk_ops at L, divided by sqrt(L)
      times W_1, where W_1 is the mean walk_ops of 150 single-target solves
      (the 5 targets of the L = 1 and L = 4 cells, 30 seeds each) through the
      same multi-target code at L = 1.
    dp_admission: >-
      dp_bits per cell is fixed at setup as the largest integer with
      2^dp_bits at most sqrt(N_G / L_max) / 8, N_G the subgroup order and
      L_max = 256 (3 at N_G about 2^20; 2 at N_G about 2^17 to 2^18), so the
      distinguished-point overshoot is at most one eighth of the smallest
      per-target walk; walk_ops and setup_ops are reported separately as
      rho.py does and only walk_ops enters the fit.

  # ---------------------------------------------------------------------------
  instruments:
    - id: I1
      name: full-logarithm-vector solve (extension of linalg.py, about 80 lines)
      specification: >-
        Keep EliminationState.add_row unchanged for relation entry (kcoef = 0
        for target-free relations). Add solve_all(): process the pivot
        columns in reverse creation order; for the pivot row (prow, pk, pr)
        of column c, substitute every other column cc of prow whose logarithm
        is already determined (value subtracted from pr, entry removed); if
        prow then contains only c, set log[c] = pr and mark c determined;
        otherwise mark c undetermined and record the set of free columns
        blocking it. Return log (dict), the determined count, the touched
        count (columns seen in any row) and la_ops (each substitution charged
        one multiply-add). Correctness check on every cell: for each
        determined column c, the point [log[c]] P0 equals the class
        representative up to sign (certificate CERT-LOG), on a seeded 10
        percent sample of columns on the curves and on all columns on CTRL-ZN.
    - id: I2
      name: shared-table multi-target rho (extension of rho.py, about 60 lines)
      specification: >-
        Group-generic over an adapter with add, neg, mul, identity None,
        subgroup order N_G, integer label(P) and an operation counter. Steps
        M_j = c_j P0 for j below r = 20 (P0-only steps, d_j = 0, so all walks
        for all targets share one step function). A walk for target t starts
        at a P0 + b Q_t with fresh random a, b; its state is (a, t, b).
        Distinguished when label(X) // r has its low dp_bits zero. The table
        maps a distinguished label to (a, t, b). On a hit with stored (a2,
        t2, b2): if t2 = t and b differs from b2, k_t = (a2 - a)/(b - b2) mod
        N_G; if t2 differs and k_t2 is solved, k_t = (a2 + b2 k_t2 - a)/b mod
        N_G; if t2 = t and b = b2, or t2 unsolved, the walk is abandoned and a
        fresh walk for t starts (counted). Targets are solved in order 1..L
        with the table carried across targets; every stored point of a solved
        target has a known logarithm. Per walk at most 20 times 2^dp_bits
        steps, then abandoned. Every k_t is verified by an independent scalar
        multiplication [k_t] P0 = Q_t (CERT-DL) before it is used or
        reported. Reported per L and seed: total walk_ops, setup_ops, walks,
        abandoned walks, table entries and bytes (label plus a, t, b as
        integers, 8 bytes each), per-target walk_ops in solving order.
    - id: I3
      name: GF(2^19) field module
      specification: >-
        A general-n variant of experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
        (about 150 lines: schoolbook multiplication, table or shift-and-add
        multiplication, inverse, trace, half-trace, sqrt, irreducibility check
        of the modulus t^19 + t^5 + t^2 + t + 1) or, if a GF(2^19) module
        already exists under a CERTBIN experiment in the repository and the
        executor's card permits its read, that module copied unchanged with
        provenance recorded in impl-provenance.json. Self-test: the modulus is
        irreducible; x^(2^19) = x on 100 seeded elements; trace and half-trace
        identities on 100 elements.
    - id: I4
      name: Z/NZ relabelled adapter (about 60 lines)
      specification: As in definitions.cells CTRL-ZN, with the same adapter interface as I2 and the enumeration oracle; the permutation is generated by seeded Fisher-Yates and its seed recorded.
    - id: I5
      name: harness, accounting and fits (about 150 lines)
      specification: >-
        One driver runs Stage 1 then Stage 2 per the procedure, writes one
        JSON line per (cell, phase, L, target or seed) and computes the fits,
        intervals, usable fractions, retries, pooling constants and the
        certificate pass rates; a separate verifier process re-verifies every
        certificate (CERT-DL, CERT-REL, CERT-LOG) with no shared import.
    - id: I0
      name: Stage 0 script
      specification: The committed stage0_code of the audit sheet, run unchanged; its output stage0.json is a design artifact and never a result.

  # ---------------------------------------------------------------------------
  stages:
    stage_0:
      compute: zero
      what: >-
        Run stage0_code. It prints and writes: log2 N_prime, log2 rho_1 in
        both forms with their difference; per m in 4, 5, 6, 8, 16: log2
        B_cap, S in bytes at 17 bytes per word, log2 LA_m, LA memory in bytes
        (m B_cap entries at 8 bytes), log2 T_gen, log2 P_gen, log2 P_gen -
        log2 LA, log2(B_cap T_gen) - log2 P_gen, log2(P_IC(T_gen)/P_gen) with
        the attempt constant; the pinned D3 column and the recomputed D3
        values at m = 5, 6, 8 (and the sub-cap optimum at m = 4 by the closed
        form x = (log2 rho_1 + log2 0.6 - 2)/2, C from the relation term),
        the 4b65e3 mu = 1 column beside it with the 0.66-bit factor and the
        m = 8 residual; the relaxation T_gen - D3 and T_gen - (4b65e3 value);
        the m = 5 window bounds and critical g in both conventions at g in
        0, 6, 10, 12, 13, 13.2, 14; the m = 4 sub-cap slice at g in 0, 6, 10,
        13, 14, the cap slice at log2 C in 11.01, 20, 30, and the envelope
        over log2 B on a 0.01-bit grid from 29.036 to 33.896 at each g.
      acceptance: >-
        Every printed value agrees with the design figures of the audit sheet
        within 0.05 bit (columns), 1 bit (window bounds) and 0.2 (critical g);
        a disagreement is a design defect referred to the Coordinator before
        any later stage runs.
    stage_1:
      compute: minutes
      what: >-
        The Z/NZ instrument gate: fixture_code run unchanged on CTRL-ZN.
        Pass criterion (stated here before execution, G1): exponent_ic over
        the knee-rule cells within [-1.1, -0.9]; exponent_rho over all five L
        within [-0.6, -0.4]; every CERT-DL, CERT-REL and CERT-LOG verified;
        pooling constant c(L) in [0.5, 2] at every L. NO CURVE CELL IS READ
        BEFORE G1 PASSES (stopping rule S1; invalidation rule IR-1).
    stage_2:
      compute: minutes to an hour per cell
      what: >-
        On BIN-ORD-19 and BIN-KOB-19 (then CTRL-ZN again as the third arm of
        the same run): setup (orders, primality, admission); relation
        collection at R = B classes from targets a P0 (no Q); full-vector
        solve (I1) with CERT-LOG; 341 fresh targets Q_t = k_t P0 with k_t
        drawn by the seeded stream and hidden from the solver, in five
        disjoint L cells; per target the decomposition of Q_t + c P0 (fresh c
        per attempt) by oracle A, usable check, retries, log assembly,
        CERT-DL; multi-target rho (I2) on the same L cells, 30 seeds per L,
        plus the 150 single-target reference solves; fits, usable fractions,
        retries, pooling constants, tail checks.
    stage_3:
      compute: zero
      what: >-
        The preprocessing column (T_gen, P_gen, S bytes, LA) filed into the
        RQ-BINSTD-b6f698 table beside the pinned single-target column, as an
        analysis note under the run directory, labelled CONDITIONAL on H1,
        H2 and on the oracle cost C, carrying the Stage 2 exponents, usable
        fractions and pooling constants as the validation record of H1 and
        H2 and the constants disclosure of H-BINSTD-6e4713 statement_note.
        The note states no oracle cost, no point below any budget and no
        first-below-the-line clause.

  procedure:
    - 1. Stage 0 script; compare with the audit sheet; stop on disagreement.
    - 2. Instrument self-tests (I3 field; I1 on a 6-unknown random system with a known solution; I2 at L = 1 against rho.py on a prime-field toy curve, same seed, same k).
    - 3. Stage 1 gate on CTRL-ZN; stop unless G1 passes.
    - 4. Stage 2 on BIN-ORD-19, BIN-KOB-19, CTRL-ZN; certificates on every logarithm and relation; the verifier process re-checks all.
    - 5. Fits and intervals; the outcome table; the Stage 3 note.

  # ---------------------------------------------------------------------------
  controls:
    - id: CTL-1
      name: relabelled Z/NZ with the enumeration oracle (blocking)
      role: both laws are group-generic; the L^-1 law and the usable fraction must reproduce there for the same reason; Stage 1 gate and Stage 2 third arm.
    - id: CTL-2
      name: ordinary against Koblitz at n = 19 (blocking for interpretation)
      role: no Frobenius is used, so the two cells must give the same laws within intervals; a difference with equal usable fractions is an instrument defect.
    - id: CTL-3
      name: certificates on every logarithm and relation (blocking)
      role: CERT-DL (independent scalar multiplication), CERT-REL (point addition in the schoolbook path), CERT-LOG (factor-base logs against class representatives); docs/claims-and-verification.md.
    - id: CTL-4
      name: single-target reproduction at L = 1
      role: >-
        Arithmetic: the L = 1 slice of model M4 at B = 2^29.036 and C =
        2^11.010 reproduces the pinned single-target verdict term by term
        (PTM-B; stage0_code prints it). Instrument: on each cell the existing
        single-target pipeline (stop at the first pinning row) on the L = 1
        target with the same base and seed stream yields a certified
        logarithm and its total oracle work units are reported beside the
        multi-target L = 1 total; reported, not gated.
    - id: CTL-5
      name: "rho pooling constant against IDEA-20260920-2e37b3's toy range"
      role: c(L) in [0.8, 1.3] is the H2 prediction; outside [0.5, 2] is an instrument defect (nothing read).
    - id: CTL-6
      name: shared-versus-per-target split and the knee (observation-collision separation)
      role: shared_ops, per_target_ops, usable fraction and retries are reported per target; a per-target exponent near -1 with usable fraction near 1 and retries near 1 while shared_ops is setup-dominated is the artefact preimage (ii) and reads nothing.
    - id: CTL-7
      name: admission rules
      role: AR-MU (mu_cell in [0.5, 2]); AR-ORDER (orders recomputed two ways, primality proved); AR-DP (dp_admission); AR-FIELD (I3 self-test). A failed admission halts the cell before any figure is read.

  independent_variables:
    - L in 1, 4, 16, 64, 256 (fresh disjoint targets per cell)
    - cell in BIN-ORD-19, BIN-KOB-19, CTRL-ZN
    - algorithm arm in index calculus (I1 plus oracle) and multi-target rho (I2)
    - rho seed 0..29 per L

  metrics:
    primary:
      - name: exponent_ic
        unit: dimensionless
        definition: definitions.fits, with 95 percent interval, per cell
      - name: exponent_rho
        unit: dimensionless
        definition: definitions.fits, with 95 percent interval, per cell
      - name: usable_fraction
        unit: fraction of 341 targets
        definition: definitions.usable_and_retries, with Clopper-Pearson 95 percent bounds, per cell
      - name: retries_per_target
        unit: attempts
        definition: mean, maximum and histogram per cell
      - name: pooling_constant
        unit: dimensionless
        definition: definitions.pooling_constant, per L per cell
      - name: stage0_column
        unit: bits and bytes
        definition: the Stage 0 outputs listed under stages.stage_0 (design artifact)
    secondary:
      - name: shared_ops and per_target_ops
        unit: oracle work units, group operations, la_ops (separate columns)
        definition: definitions.shared_and_per_target
      - name: solved_fraction and touched_fraction
        unit: fraction of base columns
        definition: determined and touched columns of the full-vector solve over the class count
      - name: flattening_ratio
        unit: dimensionless
        definition: per_target_cost(L) over kappa_2 times mean attempt cost, on the cells beyond the knee
      - name: walk_ops, setup_ops, table_entries, table_bytes, abandoned_walks
        unit: counts and bytes
        definition: I2 outputs per L and seed
      - name: certificate_pass_rate
        unit: fraction
        definition: verifier process, per certificate kind
      - name: termination_reason
        unit: label per cell
        definition: completed | timeout | crash | admission_failed

  heuristic_under_test: H1 and H2 of H-BINSTD-6e4713 (both; Stage 2 is their validation and the pairing DEC-20260928-63addc C5 requires)
  preregistered_prediction:
    quantity: >-
      (1) per_target_cost exponent in L for index calculus and for
      shared-table rho; (2) usable_fraction and retries at R = B; (3) the
      pooling constant; (4) the Stage 0 column, identity and windows.
    formula: >-
      (1) -1.0 and -0.5. (2) (1 - exp(-m))^m = 0.748 at m = 2, retries
      geometric with mean 1/0.748 = 1.34. (3) c(L) in [0.8, 1.3]. (4) The
      design figures of H-BINSTD-6e4713 statement (B) and (C) and the audit
      sheet, including T_gen 43.54, 46.69, 48.78, 51.34, 55.01 bits and the
      m = 5 critical g 12.26 (D3 convention), 12.92 (proposal convention).
    source: >-
      H1 occupancy law (KN-FIND-007 for the exact mean; IDEA-20260805-061f97
      as relayed); H2 generic laws (KN-LIT-f47b10, KN-LIT-7cc07f, KN-LIT-013
      as corpus entries; sources unread, IMP-CGK); the model M_m of
      definitions; the proposal's predictions block.
    fixed_before_execution: true

  scale_relevance:
    tier: toy
    justification: >-
      Subgroup orders about 2^17 to 2^20 on the executable cells (field bit
      size 19 on the curves; 20 on the control). The deployed column at n =
      131 is arithmetic on the model; the transfer assumptions are H1 (mean
      only) and H2 (law's form only) and are stated as heuristics, never as
      bounds. No correspondence trick reaches deployed scale here.
    correspondence: null

  tail_checks:
    - The maximum retries per target on each cell against the geometric tail at 341 samples (expected maximum about log(341)/log(1/0.252) = 4.2 at m = 2; a maximum above 12 is reported as a tail anomaly).
    - "The largest seed's total walk_ops at each L against the single-target tail (90th percentile over mean, reported per L; an L at which the ratio exceeds 2.5 times the L = 1 ratio is reported)."
    - "The most-retried target's decomposition count from oracle A against the Poisson(mu_cell) tail."

  replication:
    seeds:
      permutation_and_base: PCG-style seeded stream from the string "EXP-BINSTD-532d7f|<cell>|setup|0"
      targets: k_t from "EXP-BINSTD-532d7f|<cell>|targets|<t>" for t in 0..340; L cells are t in [0,1), [1,5), [5,21), [21,85), [85,341)
      re_randomisation: c from "EXP-BINSTD-532d7f|<cell>|attempt|<t>|<attempt>"
      relations: a from "EXP-BINSTD-532d7f|<cell>|relation|<j>"
      rho: seeds 0..29 per L, walk stream "EXP-BINSTD-532d7f|<cell>|rho|<L>|<seed>"
    independent_instances: 3 cells, 341 targets each, 30 rho seeds per L; every seed string recorded in the manifest

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 8
    maximum_memory_gb: 2
    maximum_runs: 3
    maximum_workers: 1
    note: >-
      One scientific run (Stage 1 and Stage 2 in one run, Stage 0 and Stage 3
      inside it as zero-compute phases) plus at most two infrastructure
      reruns. Estimate: relation collection 2^19.7 root solves per binary
      cell, 341 targets about 2^19.5, rho at N_G about 2^17 to 2^18 with 30
      seeds and 341 targets about 2^22 walk steps; minutes per cell in pure
      Python. Zero runs in the design batch.

  stopping_rules:
    - S1. Stage 2 does not start, and no curve cell is read, until the Stage 1 gate G1 passes on CTRL-ZN with fixture_code run unchanged.
    - S2. Stage 1 stops at the first failed certificate or at the first exponent outside its band; the run ends as failed_infrastructure with the fixture output preserved.
    - S3. A cell halts at a failed admission rule (AR-MU, AR-ORDER, AR-DP, AR-FIELD); the other cells continue; the halted cell is reported not measured.
    - S4. The run ends when every cell has completed or halted, or at the wall-clock ceiling, with every partial artifact preserved and the termination reason per cell.
    - S5. Stage 0 disagreement with the audit sheet beyond tolerance stops the run before Stage 1.

  invalidation_rules:
    - IR-1. Any curve-cell figure produced before G1 passed is invalid and is not read; the run is invalid.
    - IR-2. A failed certificate (CERT-DL, CERT-REL, CERT-LOG) on any reported logarithm or relation invalidates the run as invalid_measurement.
    - IR-3. A pooling constant outside [0.5, 2] on CTRL-ZN, or an index-calculus exponent on CTRL-ZN outside [-1.1, -0.9], invalidates every rho or index-calculus reading of the run respectively (instrument defect).
    - IR-4. A cell whose order or primality check disagrees between the two routines, or whose mu_cell is outside [0.5, 2], is invalid for that cell.
    - IR-5. Per-target and shared operations summed into one figure, or a fit over cells violating the knee rule, invalidates that fit.
    - IR-6. Any deviation from fixture_code or stage0_code as committed (sha256 mismatch in the manifest) invalidates the run.
    - IR-7. Any value read from a source under SR-NOSUB replacing a frozen figure invalidates the run.
    - IR-8. A timeout or crash is failed_infrastructure, never a negative observation.

  success_criterion: >-
    Decidable from the primary metrics, all of the following: (i) Stage 0
    agrees with the audit sheet within tolerance and the identity reads 0;
    (ii) G1 passed; (iii) on BIN-ORD-19 and BIN-KOB-19, exponent_ic within
    [-1.1, -0.85] and exponent_rho within [-0.6, -0.4], each interval
    excluding the other law's value; (iv) usable_fraction on each binary cell
    at least 0.8 of CTRL-ZN's and within 10 percent of 0.748 on CTRL-ZN;
    (v) pooling_constant in [0.8, 1.3] at every L on every cell; (vi) CTL-2
    agreement. Then the POSITIVE outcome holds: the column is filed
    conditional on H1, H2 and C, and HOLD-X1's ladder contract states both
    lines. The NEGATIVE outcome (also a decidable, valid outcome): (ii)
    passes but exponent_ic on both binary cells is shallower than -0.85 with
    usable_fraction below 0.8 of CTRL-ZN's: the amortisation is recorded as
    coverage-limited on subspace bases and the column carries the measured
    law. ARTIFACT: any invalidation rule fires; nothing is read.

  falsification_criterion: >-
    The proposal's expectation is falsified by the NEGATIVE outcome above
    (H1 fails on subspace bases at the tested cells). The frontier statement
    (C) is falsified by a nonzero identity residual at any m or by a read of
    the source under SR-CGK stating a bound of a different form; the column
    is then withdrawn and the split (A) stands. Stated before any run.

  outcome_table:
    certifies_only: the column, the identity, the windows (design figures recomputed) and the toy exponents with their constants. Nothing else.
    positive: success_criterion (i) to (vi).
    negative: the coverage-limited reading of success_criterion.
    artifact: any invalidation rule; instrument defect; nothing read.
    never_an_outcome: >-
      That any oracle sits below T_gen at n = 131; that index calculus is
      below the generic preprocessing frontier on any deployed row; that any
      algorithm is the first below the S T^2 = N_prime line; that any oracle
      meets any budget; any deployed-curve verdict. Pre-registered tripwire
      TW-01 (DEC-20260928-63addc C3; plan TA-1): any such reading, by anyone,
      is routed to review-breakthrough at max in its own round and is not an
      outcome of this contract.

  memory_beside_time:
    note: C6. Advice S = B_cap words at 17 bytes per word (a 129-bit logarithm), LA memory m B_cap entries at 8 bytes; design figures, recomputed by stage0_code.
    rows:
      - {m: 4, log2_B_cap: 33.896, S_bytes: '2^37.98 (about 270 GB)', LA_time_bits: 69.79, LA_memory_bytes: '2^38.9 (about 500 GB)', T_gen_bits: 43.54, P_gen_bits: 77.43, D3_bits: 11.01, record_mu1_bits: 11.0}
      - {m: 5, log2_B_cap: 27.581, S_bytes: '2^31.67 (about 3.4 GB)', LA_time_bits: 57.48, LA_memory_bytes: '2^32.9 (about 8 GB)', T_gen_bits: 46.69, P_gen_bits: 74.27, D3_bits: 33.08, record_mu1_bits: 32.4}
      - {m: 6, log2_B_cap: 23.415, S_bytes: '2^27.50 (about 190 MB)', LA_time_bits: 49.42, LA_memory_bytes: '2^29.0 (about 0.5 GB)', T_gen_bits: 48.78, P_gen_bits: 72.19, D3_bits: 37.39, record_mu1_bits: 36.7}
      - {m: 8, log2_B_cap: 18.287, S_bytes: '2^22.37 (about 5.4 MB)', LA_time_bits: 39.57, LA_memory_bytes: '2^24.3 (about 20 MB)', T_gen_bits: 51.34, P_gen_bits: 69.63, D3_bits: 42.52, record_mu1_bits: 42.2}
      - {m: 16, log2_B_cap: 10.953, S_bytes: '2^15.04 (about 34 KB)', LA_time_bits: 25.91, LA_memory_bytes: '2^18.0 (about 256 KB)', T_gen_bits: 55.01, P_gen_bits: 65.96, D3_bits: 'not pinned (design 49.86)', record_mu1_bits: 49.7}
    window_memory: >-
      At m = 5 the index-calculus side holds S = 2^31.67 bytes throughout the
      window; at m = 4 the sub-cap slice holds 2^33.12 bytes (B = 2^29.036 at
      17 bytes) and the cap slice 2^37.98 bytes. The rho side holds a
      distinguished-point table of theta times rho_1 sqrt(L) entries (theta
      the distinguished-point rate, a free van Oorschot-Wiener parameter) at
      17 bytes: at L = 2^30 and theta = 2^-20, about 2^56 entries, 2^60
      bytes; stated as the comparator's tradeoff position, not as a claim.
    proposal_discrepancy_noted: >-
      The proposal states about 580 GB for S at m = 4; 2^33.90 words at 17
      bytes is 2^37.98 bytes, about 270 GB. Recorded; the proposal is not
      edited.

  required_artifacts:
    - "stage0.json and stage0.log (the committed script's output, sha256 of the extracted script recorded)"
    - fixture.json and fixture.log (Stage 1; sha256 of the extracted fixture recorded)
    - per cell setup.json (orders, primality, mu_cell, |F|, class count, merge count, dp_bits, N for CTRL-ZN, permutation seed)
    - relations.jsonl.gz, logvector.json, targets.jsonl.gz (per target attempts, retries, usable flag, per_target_ops by column, certificate)
    - rho.jsonl.gz (per L and seed: walk_ops, setup_ops, walks, abandoned, table entries and bytes, per-target walk_ops, certificate)
    - fits.json (exponents with intervals, knee cells, usable fractions with bounds, retries, pooling constants, tail checks, CTL-2 comparison)
    - certificate-verification.json from the separate verifier process
    - sources.json (SR-CGK, SR-KS, SR-BL attempts and outcomes)
    - manifest.yaml, environment.json, command.txt, stdout and stderr logs, raw-result.json with the certificate summary (docs/claims-and-verification.md)
    - stage3-note.md (the column filed conditional on H1, H2 and C; no oracle cost; no first-below-the-line clause)

  assigned_to: executor
  runs_launched: 0
  inference:
    requested_policy: coordinator-orchestration-code
    served_by: claude-fable-5-1
    fallback_used: true
    fallback_reason: runtime inheritance, backend substitution only
    model_verified: false
    degraded_allowed: false
    amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
  procedure_note: >-
    Written by one fresh Coordinator-role /design-experiment session that did
    not compose DEC-20260928-63addc, did not author DEC-20260928-65c6d7 or
    either review plan, and is not the lane-B producer. No file other than
    the three declared was written; no identifier was minted; no existing
    record was edited; no instrument, driver or solver was executed.
