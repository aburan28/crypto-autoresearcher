# =============================================================================
# EXP-SDEG-ffec77 — version 1, approved by DEC-20261006-cdd3e2.
# Frozen measurement of the crossed (p, B) grid in IDEA-20261006-4b8f91.
# Success is the idea's prediction: the pooled lower-median grevlex
# solving degree at p=127 rises by at least 1 from B=4 to B=8. A
# finished increment of 0, or a negative increment, is a negative.
# This design session did not build a Groebner basis and did not
# record a degree. No discrete logarithm is authorized.
# Source idea bytes are copied unchanged from
# origin/design/mlkem-0e9abf-isometry.
# =============================================================================
experiment:
  id: EXP-SDEG-ffec77
  hypothesis_id: H-SDEG-05d67f
  question_id: RQ-SDEG-001
  source_idea: IDEA-20261006-4b8f91
  version: 1
  title: >-
    Crossed (p, B) grid for prime-field S_3 grevlex solving degree
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-cdd3e2
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that the degree rises with B.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Search the two curves per prime, draw the frozen factor bases,
      solve the 144 S_3 systems and the 180 random systems, recompute
      the audit cell, and score the integer increment. Do not change
      the threshold 1. Do not search for a discrete logarithm.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether the pooled lower-median grevlex solving degree at
    p=127 rises by at least 1 when B goes from 4 to 8. A finished
    increment of 0 is the concrete negative named by the source idea.
    A finished negative increment is the same directional failure.
    The fixed-B range at B=6 is reported and does not replace that
    test. No faster discrete logarithm is in scope.

  inputs:
    primes: [31, 61, 127]
    cardinalities: [4, 6, 8]
    curves_per_prime: 2
    targets_per_cell: 8
    random_replicates_per_cell: 20
    curve_search: >-
      For each prime p, scan integers A from 1 upward and, for each A,
      scan integers Bcoef from 1 upward. The model is
      y^2 = x^3 + A x + Bcoef over F_p. Skip the model when
      4 A^3 + 27 Bcoef^2 = 0. Count points by summing, over x in
      {0, 1, ..., p-1}, one plus the Legendre symbol of
      x^3 + A x + Bcoef, then add the point at infinity. The trace is
      t = p + 1 - #E. Skip the model when t = 0. Keep the first two
      models that remain, in (A, Bcoef) lexicographic order. Record
      A, Bcoef, #E, and t before any Groebner call.
    summation_polynomial: >-
      S_3(x1, x2, x3) = (x1 - x2)^2 x3^2
      - 2*((x1 + x2)*(x1*x2 + A) + 2*Bcoef)*x3
      + (x1*x2 - A)^2 - 4*Bcoef*(x1 + x2).
      This is the short-Weierstrass polynomial printed in
      coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-642cf5/v1_blind_rederive.py,
      which this design session opened. A and Bcoef are the curve
      coefficients. Expand over F_p before solving.
    monomial_support: >-
      The support-matched random generator uses exactly these
      monomials, which are the ones present in S_3 for generic
      A and Bcoef: x1^2 x3^2, x1 x2 x3^2, x2^2 x3^2,
      x1^2 x2 x3, x1 x2^2 x3, x1 x3, x2 x3, x3,
      x1^2 x2^2, x1 x2, x1, x2, and the constant term.
    membership: >-
      For a factor base b1, ..., bB of distinct field elements, the
      membership polynomial is m(X) = product (X - bi), monic of
      degree B. The ideal is generated by S_3(x1, x2, x3), m(x1),
      m(x2), and m(x3) in F_p[x1, x2, x3]. Field equations
      x_i^p - x_i are omitted.
    factor_base_draw: >-
      Liftable abscissae are the x in {0, 1, ..., p-1} whose
      Legendre symbol of x^3 + A x + Bcoef is 0 or 1. Shuffle that
      list with Fisher-Yates. The random integer at step k is the
      first 8 bytes, as a big-endian integer, of SHA-256 of the
      UTF-8 string
      EXP-SDEG-ffec77|base|{p}|{A}|{Bcoef}|{B}|{target_index}|{k}.
      The factor base is the first B elements after the shuffle. If
      fewer than B liftable abscissae exist, that target is unscored
      and is not entered as degree 0.
    solver: >-
      Grevlex with variable order x1 > x2 > x3. One solver build for
      every grid cell and every random replicate. d_solve is the
      maximum total degree of any polynomial the solver constructs,
      including reducers, as written in its degree transcript. When
      the reduced basis is {1}, d_solve is still that maximum, not 0,
      unless the transcript shows that no higher-degree polynomial
      was built. A target whose transcript does not record the
      maximum is infrastructure-incomplete and is not entered as 0.
    audit_cell: >-
      p=31, the first curve, B=4, target index 0. A second solver
      build recomputes this single system and must return the same
      integer. Disagreement voids the grid as an instrument failure.
      It is not an increment of 0.
    lower_median: >-
      Sort the scored degrees ascending. For a list of length 16 the
      lower median is the 8th entry, 1-based. For a list of length 8
      it is the 4th entry. For a list of length 20 it is the 10th
      entry. d_solve(p, B) is the lower median of the sixteen S_3
      degrees at that cell, two curves times eight targets. A cell
      with fewer than sixteen scored degrees is incomplete.
    increment: >-
      I = d_solve(127, 8) - d_solve(127, 4). Success is I >= 1.
      The concrete negative is I = 0. I < 0 is the same directional
      failure. Both comparisons are exact integer comparisons.
    fixed_B_range: >-
      R = max d_solve(p, 6) - min d_solve(p, 6) over p in
      {31, 61, 127}. R = 0 is the B-only reading. R >= 1 is the
      field-size reading. R does not flip I.
    comparator: >-
      c(B) = ceil((3*(B - 1) + 2) / 2), using per-variable degree 2.
      The values are c(4)=6, c(6)=9, c(8)=12. Report the absolute
      gap between d_solve(p, B) and c(B). The curve is not assumed
      correct.
    random_arm: >-
      At each of the nine (p, B) cells, draw 20 independent
      systems. The first generator has exactly the monomial support
      listed above, each coefficient uniform in F_p, drawn from
      SHA-256 of the UTF-8 string
      EXP-SDEG-ffec77|random|{p}|{B}|{rep}|{monomial_index}
      as an integer modulo p. The other three generators are monic
      of degree B in one variable each, lower coefficients uniform
      in F_p from the same style of digest. Solve them with the same
      solver. Record the lower median per cell and the fixed-B range
      at B=6.
    omission_cap: >-
      If any constructed polynomial has total degree at least p, that
      target is void. The omission of the field equations was then
      outside the rule, and the degree is not scored.

  controls:
    - id: support-matched-random
      statement: >-
        Twenty support-matched random systems at each cell. A fixed-B
        range at B=6 that appears for both the S_3 arm and the random
        arm, both at least 1, marks the field-size reading as a
        field-arithmetic artifact. A range that appears for S_3 only
        is system-specific. The random arm does not rewrite I.
    - id: comparator-curve
      statement: >-
        The integers 6, 9, and 12 are reported next to the three
        cardinalities. Distance to them is a secondary metric. They
        are not a success threshold.
    - id: two-curve
      statement: >-
        Each cell records the two per-curve lower medians of eight
        targets. If they differ by at least 1, that cell is flagged
        curve_split. A flagged cell's prime effect is not separable
        from the curve. The pooled median still defines I.
    - id: audit-recompute
      statement: >-
        The second solver build on the audit cell must match the
        grid's integer. A mismatch voids the grid.

  independent_variables:
    - prime p in {31, 61, 127}
    - factor-base cardinality B in {4, 6, 8}
    - curve index in {1, 2}
    - target index in {0, 1, ..., 7}
    - arm in {S_3, random}

  metrics:
    primary:
      - id: increment_I
        statement: >-
          I = d_solve(127, 8) - d_solve(127, 4), pooled lower median
          of sixteen degrees against the same at B=4.
    secondary:
      - id: range_R
        statement: >-
          R = max_p d_solve(p, 6) - min_p d_solve(p, 6).
      - id: random_range
        statement: >-
          The same range on the random arm at B=6, from twenty
          replicates per prime.
      - id: comparator_gap
        statement: >-
          Absolute difference between d_solve(p, B) and c(B) at each
          cell.
      - id: curve_split
        statement: >-
          Whether the two per-curve lower medians differ by at least
          1.

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 is the random-arm shift of 0 across the three primes at
    fixed B. The S_3 increment is the main prediction. A random-arm
    range of at least 1 falsifies HEUR-1 and is not, by itself, an
    S_3 increment of 0.

  preregistered_prediction:
    quantity: >-
      The pooled lower-median grevlex solving degree at p=127, B=8,
      minus the same quantity at p=127, B=4.
    formula: >-
      I >= 1. The concrete negative is I = 0. I < 0 fails the same
      "higher" prediction. Source idea IDEA-20261006-4b8f91, first
      prediction, minimum_effect "at least 1".
    source: >-
      IDEA-20261006-4b8f91. The B-only comparator c(B) is not the
      prediction. KR-IC-5a43e5 supplies per-variable degree 2 and was
      opened. It does not predict the increment.

  scale_relevance:
    tier: toy
    justification: >-
      Primes 31, 61, and 127 only. No transfer to cryptographic p
      and no transfer to B growing with p is assumed. A unit
      increment here is a toy degree table.
    correspondence: null

  tail_checks:
    - >-
      At each random-arm cell, record the maximum of the twenty
      degrees minus the minimum. That within-cell range is the tail
      check for HEUR-1. It is not a second success threshold.
    - >-
      Record the maximum and the minimum of the sixteen S_3 degrees
      at (p=127, B=4) and at (p=127, B=8), so a median increment of
      1 that is carried by a single target is visible.

  replication:
    seeds:
      - EXP-SDEG-ffec77|base|{p}|{A}|{Bcoef}|{B}|{target_index}|{k}
      - EXP-SDEG-ffec77|random|{p}|{B}|{rep}|{monomial_index}
    independent_instances: 16
    random_replicates_per_cell: 20
    note: >-
      Sixteen is the number of S_3 systems pooled into one cell
      median. Twenty is the random-arm replicate count. Both are
      frozen scientific sample counts.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_runs: 1
    maximum_workers: 1
    scientific_systems: 325
    budget_note: >-
      One run manifest covers the frozen grid: 144 S_3 systems, 180
      random systems, and 1 audit recompute. Wall-clock and CPU
      figures are advisory and null. The 8 GB memory figure is
      machine protection. A watchdog expiry is failed_infrastructure,
      not an increment of 0.

  stopping_rules:
    - Stop when all 325 systems are scored or voided with a reason.
    - A timeout on one system voids that system. It does not fill a degree of 0 and it does not stop the other systems.
    - If any cell has fewer than its full scored count, I and R are not computed. The reading is incomplete.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - A singular or supersingular model that was scored voids the grid.
    - A field equation that was included voids the targets that included it.
    - A monomial order other than grevlex voids the grid.
    - An audit-cell mismatch voids the grid and is not I = 0.
    - A degree transcript that lacks the maximum voids that target.
    - Fewer than B liftable abscissae voids that target and is not degree 0.

  success_criterion: >-
    The grid is complete, the audit cell matches, and the pooled
    lower-median increment I = d_solve(127, 8) - d_solve(127, 4)
    is an integer at least 1. This is the first prediction of
    IDEA-20261006-4b8f91. It is reachable as a failure.

  falsification_criterion: >-
    The grid is complete, the audit cell matches, and I equals 0.
    That finished zero is the concrete negative named by the source
    idea: it falsifies "the degree moves with B" on this grid. A
    finished I below 0 is the same directional failure and is also
    a negative. Neither outcome is an infrastructure event.

  required_artifacts:
    - experiments/EXP-SDEG-ffec77/runs/RUN-*/manifest.yaml
    - experiments/EXP-SDEG-ffec77/runs/RUN-*/stdout.txt
    - experiments/EXP-SDEG-ffec77/runs/RUN-*/stderr.txt
    - experiments/EXP-SDEG-ffec77/runs/RUN-*/degrees.csv
    - experiments/EXP-SDEG-ffec77/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: moves_with_B
      when: I >= 1 on a complete grid with a matching audit cell
    - id: flat_in_B
      when: I = 0 on a complete grid with a matching audit cell
    - id: fell_in_B
      when: I < 0 on a complete grid with a matching audit cell
    - id: incomplete
      when: a cell is short, a target is void, or the audit mismatches
  reading_rule: >-
    Name exactly one row. moves_with_B is the only success row.
    flat_in_B is the concrete negative. fell_in_B is the directional
    negative. incomplete is not evidence about the degree. Record R,
    the random-arm range, the comparator gaps, and every curve_split
    flag beside the row. Those fields do not change the row.
