# =============================================================================
# EXP-SEMBIN-79a02d -- VERSION 1 (APPROVED by DEC-20261002-5a576d) frozen
# contract for H-SEMBIN-8e8bef: Semaev d_F4 / d_ff / SOLV4 / Macaulay-rank
# separation control (Stages 0-3). Source IDEA-20260913-449d2b under
# RQ-SEMBIN-fa2e3f / GOAL-SEMBIN-5078bc.
#
# Unlocks GOAL-SEMBIN-5078bc next_action item (3). Prerequisite for
# IDEA-20260913-9ba7fc. ZERO RUNS in this design packet. Stages 0-3
# authorized for executor TASK-20261002-fc71d6. No Magma/Sage/AUXIN/Bedrock
# as success path. NO curve attack. NO exponent.
# =============================================================================
experiment:
  id: EXP-SEMBIN-79a02d
  hypothesis_id: H-SEMBIN-8e8bef
  question_id: RQ-SEMBIN-fa2e3f
  source_idea: IDEA-20260913-449d2b
  goal_id: GOAL-SEMBIN-5078bc
  version: 1
  title: >-
    Stage-0 four-degree definition freeze plus Stages 1-3 builder-equality,
    SOLV4/d_ff/Macaulay-rank census with dual GF(2) rank, and optional
    open-source step-degree TRACE (productive vs raw)
  status: approved
  approved_by: DEC-20261002-5a576d
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-5a576d
    composing_decision: DEC-20261002-5a576d
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-3 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3]
    scientific_execution_authorized_note: >-
      Stage 0 freezes the four-degree definition table and quotes the DREG
      rank-comparison target verbatim. Stage 1 checks coefficient-wise builder
      equality at n=12,m=t=3,k=4 (blocking). Stage 2 runs SOLV4 + d_ff +
      rank/nrows on calibration and known-false arms with dual GF(2) rank and
      SAT/UNSAT stratification. Stage 3 runs a productive-vs-raw step-degree
      TRACE if a vendored open-source engine is present; otherwise records
      O-IMPEDIMENT and still emits RESULTS.md from Stages 0-2. No Magma/Sage.
      No AUXIN. No Bedrock. No deployed-curve solve.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide by construction whether GOAL-DREG-001's Macaulay-rank instrument
    measures Semaev's d_F4 (Assumption 1), by separating four named quantities
    on identical descended chained S_3 instances and delivering exactly one
    O-* label from H-SEMBIN-8e8bef.

  class: control
  class_note: >-
    Control / measurement of degree-definition separation. Unlocks the
    Assumption-1 cost-bearing surrogate (SOLV4) and the 9ba7fc boundary
    surface. Not an exponent-moving breakthrough.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond reading code/prose). Write
        stage0/definitions.md (four degrees with explicit quantifiers),
        stage0/dreg-comparison-target.md (verbatim file:line quotation of the
        DREG rank comparison — expected nrows per EXP-DREG-001/analysis.md),
        and stage0/preregistered-predictions.json freezing C1/C2/C3 bands and
        known-false arms before Stage 1.
      - >-
        Stage 1 (blocking). Coefficient-wise builder equality between this
        experiment's Semaev eq.(5) descent and the DREG builder at
        n=12, m=t=3, k=4; write stage1/builder-equality.json. On failure →
        O-BUILDER-MISMATCH and stop before Stage 2 comparisons.
      - >-
        Stage 2. On calibration cells n∈{12,15} (and the Stage-1 cell): compute
        d_ff (src/ic_first_fall_fast.py or equivalent), SOLV4 via degree-4
        capped GF(2) closure with TWO independent rank routines, rank(M_D) and
        deficit at D∈{4,5} (src/h012c_block_m4ri.py / h012_peel_rank.py
        read-only reuse), independent SAT/solution enumeration; planted and
        uniform-z strata never pooled; null arm and both known-false arms in
        identical format; write stage2/census.json.
      - >-
        Stage 3. If a vendored open-source F4/XL-style engine exposing
        per-step degree is importable: run productive-vs-raw step-degree TRACE
        on SAT and UNSAT strata at the largest Stage-2 cell that fits the
        budget; write stage3/step-trace.json. Else write
        stage3/impediment.json with O-IMPEDIMENT and proceed to RESULTS.md.
      - >-
        RESULTS.md with exactly one O-* label; memory beside time; no Magma
        as success path; Assumption-1 cryptographic-scale claims forbidden.
    excluded:
      - Magma/Sage/cypari2/AUXIN/Bedrock as success path.
      - Any deployed-degree Semaev / ECDLP solve as a claimed result.
      - Editing IDEA-20260913-449d2b / GOAL-SEMBIN-5078bc.yaml claim text.
      - Editing EXP-DREG-001 artifacts (read-only).
      - Treating infra / missing Stage-3 engine as evidence against C1–C4.
      - Pooling planted and uniform-z strata.
      - Averaging disagreeing dual GF(2) ranks.

  inputs:
    idea: ledger/proposals/IDEA-20260913-449d2b.yaml
    hypothesis: ledger/hypotheses/H-SEMBIN-8e8bef.yaml
    decision: ledger/decisions/DEC-20261002-5a576d.yaml
    frozen_paper: inputs/SEMAEV-2015-310/paper_fulltext.md
    frozen_tables: inputs/SEMAEV-2015-310/tables.yaml
    dreg_analysis: experiments/EXP-DREG-001/analysis.md
    dreg_spec: experiments/EXP-DREG-001/specification.yaml
    kn_find_006: knowledge/findings/KN-FIND-006.md
    kn_lit_fa346d: knowledge/literature/KN-LIT-fa346d.md
    kn_lit_e77232: knowledge/literature/KN-LIT-e77232.md
    kn_open_d218ec: knowledge/open-problems/KN-OPEN-d218ec.md
    reusable_impl_readonly:
      - src/h012c_block_m4ri.py
      - src/h012_peel_rank.py
      - src/ic_first_fall_fast.py

  controls:
    - name: builder_equality
      description: >-
        Stage-1 coefficient-wise equality of generators against the DREG
        builder at n=12,m=t=3,k=4; failure voids later comparisons.
    - name: dual_gf2_rank
      description: >-
        Two independent GF(2) rank routines on the identical SOLV4 / Macaulay
        matrix; disagreement → O-ARTIFACT for that cell.
    - name: satisfiability_stratification
      description: >-
        Planted vs uniform-z instances with independent solution counts;
        never pooled.
    - name: null_arm
      description: >-
        Matched null object of the same shape; quantity that fails to decay
        under the null-destroying parameter is an artifact tell.
    - name: known_false_arms
      description: >-
        Off-diagonal / collapsed-identification objects where a proposed
        coincidence of the four degrees is known false; SOLV4 must not
        vacuously return true.
    - name: proves_too_much_assumption1
      description: >-
        Forbid reading Stage-2 toy cells as a cryptographic-scale Assumption 1
        verdict; O-A1-COST-FAIL escalates rather than summarizing.

  independent_variables:
    - name: field_degree_n
      levels: [12, 15]
    - name: macaulay_degree_D
      levels: [4, 5]
    - name: satisfiability_stratum
      levels: [planted, uniform_z, unsat]
    - name: control_arm
      levels: [primary, null, known_false_a, known_false_b]

  primary_metrics:
    - name: solv4_verdict
      definition: Boolean SOLV4(I); must match independent solution-count gate.
    - name: solv4_closure_iterations
      definition: Iteration count of the degree-4 capped closure to fixpoint.
    - name: d_ff
      definition: First-fall degree on the rebuilt generators.
    - name: macaulay_rank
      definition: GF(2) rank of M_D at D∈{4,5}.
    - name: macaulay_nrows
      definition: Row count of M_D; C3 compares rank against this.
    - name: rank_lt_nrows
      definition: Boolean; predicted true at every measured (n,D≥4) cell.
    - name: peak_rss_bytes
      definition: Peak RSS; first-class beside time.

  secondary_metrics:
    - name: productive_max_step_degree
    - name: raw_max_step_degree
    - name: dual_rank_agree
    - name: builder_equality_pass
    - name: independent_solution_count

  seeds_and_replication:
    stage0_note: Deterministic prose/code citation; no RNG.
    stage2_seeds: 8
    stage3_seeds: 4
    replication_plan: >-
      Stage 0–1 are exhaustive over the frozen cells. Stage 2 uses ≥8 seeds
      per (n, stratum, arm) within budget. Stage 3 uses ≥4 seeds per stratum
      when engine present. Dual rank is mandatory on every SOLV4/Macaulay cell.

  budget:
    wall_clock_seconds: 14400
    memory_gb: 8
    maximum_runs: 8
    note: >-
      Advisory. Stage 3 may stop early with O-IMPEDIMENT if no engine.
      Scientific sample counts above are frozen; CPU estimates are not
      rationing gates. RSS/wall-clock cap → O-IMPEDIMENT, never a degree result.

  stopping_rules:
    - SR-1. Stage 0 freeze before any Stage-1 RESULTS reading.
    - SR-2. If Stage 1 builder equality fails → O-BUILDER-MISMATCH; stop before Stage 2 comparisons.
    - SR-3. If dual GF(2) ranks disagree → invalidate cell as O-ARTIFACT; do not average.
    - SR-4. If Stage 2 C2/C3 gates fail → record O-C2-FALSE / O-C3-FALSE; Stage 3 optional.
    - SR-5. Missing Stage-3 engine → O-IMPEDIMENT; RESULTS.md still emitted from Stages 0-2.
    - SR-6. Budget abort / crash / RSS cap → failed_infrastructure / O-IMPEDIMENT; never negative evidence against C1–C4.
    - SR-7. O-A1-COST-FAIL or O-DFF-ANOMALY → escalate; do not summarize as ordinary separation.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze.
    - Pooling planted and uniform-z strata.
    - Averaging disagreeing dual GF(2) ranks.
    - Using Magma/Sage/AUXIN/Bedrock as the success path.
    - Treating missing Stage-3 engine as falsification of C1.
    - Claiming cryptographic-scale Assumption 1 from toy cells without escalation path.
    - Editing IDEA-20260913-449d2b or GOAL-SEMBIN-5078bc.yaml.

  success_criterion: >-
    Stages 0-2 complete with artifacts present; RESULTS.md names exactly one
    of O-SEPARATED, O-COINCIDE, O-C1-FALSE, O-C1b-FALSE, O-C2-FALSE,
    O-C3-FALSE, O-BUILDER-MISMATCH, O-A1-COST-FAIL, O-DFF-ANOMALY, O-ARTIFACT,
    O-IMPEDIMENT; every primary metric for executed stages recorded; Stage-0
    definitions and DREG comparison target frozen before Stage 1; Stage 1
    builder equality passed or named O-BUILDER-MISMATCH stop; Stage 3 either
    classified C1/C1b or recorded as O-IMPEDIMENT without blocking Stages 0-2
    deliverables.

  falsification_criterion: >-
    Separation falsified (→ O-COINCIDE) iff all four quantities agree on every
    reproduced cell including known-false arms. C3 falsified (→ O-C3-FALSE)
    iff Stage-0 shows a non-nrows comparison target OR rank=nrows at any
    measured (n,D≥4) cell. C2 falsified (→ O-C2-FALSE) iff SOLV4 disagrees
    with independent enumeration on a calibration or known-false cell. C1
    falsified (→ O-C1-FALSE) iff Stage-3 engine shows raw max step degree 4
    with no trailing 5/6/7 on SAT instances. Builder falsified
    (→ O-BUILDER-MISMATCH) on Stage-1 coefficient mismatch. Instrument
    falsified (→ O-ARTIFACT) on dual-rank disagreement or unstratified pooling.

  required_artifacts:
    - stage0/definitions.md
    - stage0/dreg-comparison-target.md
    - stage0/preregistered-predictions.json
    - stage1/builder-equality.json
    - stage2/census.json
    - stage3/step-trace.json OR stage3/impediment.json
    - RESULTS.md
    - runs/<RUN-SEMBIN-*>/manifest.yaml

  protocol_amendments: []
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
