      Then j2_replay.py, an independent implementation (own F_p arithmetic, torsion lift by Newton iteration on
      x([n-1]T) = x(T) in affine coordinates instead of the producer's formal-group route, own digit extraction,
      own vectorised spectrum), replays all 72 curves; it shares with the producer only the rng consumption
