    RUN-CZLIFT-d37ca4:
      curves: {recorded: 36, recomputed: 36, cm: 24, random: 12}
      spikes_total: {recorded: 0, recomputed: 0}
      spikes_digit0: {recorded: 0, recomputed: 0}
      spikes_higher_digits: {recorded: 0, recomputed: 0}
      shuffled_spikes_total: {recorded: 0, recomputed: 0}
      uniform_spikes_total: {recorded: 0, recomputed: 0}
      max_excess_over_threshold_higher_digits: {recorded: -4.069590238107235, recomputed: -4.069590238107235, row: 'cm D=-163 p=347 n=383 x4, max 19.725 vs T 23.794'}
      max_excess_shuffled: {recorded: -4.650324431558591, recomputed: -4.650324431558591, row: 'cm D=-3 p=547 n=61 y4 shuffled, 17.763 vs T 22.413'}
      threshold_mean: {recorded: 21.345362885197275, recomputed_equal_within: 1.0e-12}
      by_digit: '60/60 fields equal (integers exact; means within 1e-12)'
    frozen_criteria:
      success_criterion: 'holds on both seeds (spikes_higher_digits = shuffled_spikes_total = uniform_spikes_total = 0)'
      falsification_criterion: 'not met: no digit i >= 1 has any above-threshold pair on either seed'
      invalidation_rules: 'none triggered: uniform_spikes_total 0 on both seeds; both arms non-empty (24 + 12 per seed); checker passed'
    curve_audit: >-
      72/72 curve records pass every structural check (point counts, n prime and n | N, n != p, N odd, Hasse, CM j and
      split p for all 48 CM records, random primes equal the spec list) except one flag per seed, n^2 | N:
      seed 20261009 D=-3 p=193 n=13 N=169; seed 20261010 D=-43 p=281 n=17 N=289 (both cyclic, both in the blind zone).
      The producer's torsion section T = P^ - [n^-1]([n]P^) is valid there, and the independent replay certifies
      [n-1]T1 = -T1 on those curves; no silent drop
    independent_replay:
      scope: 'all 72 curves of both runs (720 rows, 2160 real/shuffled/uniform series); total 9 s on one core'
      result: 'every max_power, shuffled_max_power, uniform_max_power and threshold within 8.0e-14 relative; all 2160 spike counts equal'
    checker_receipt:
      result: >-
        check.stdout.log "check ok" agrees with the recomputation. The checker is not independent code: it imports the
        driver (import run as driver), replays only the first curve of each arm, re-derives the summary with the
        driver's own summarize(), and skips by_digit. Its pass is superseded by the full independent replay above
    borderline_probes:
      - 'exclusions: k = 0 (point at infinity) is excluded from the real and uniform half-range sums as specified'
      - >-
        shuffled control construction: the permutation runs over all n indices including the k = 0 placeholder
        (value 0), then the half range is read; the shuffled series is therefore a random half-subsample of the
        full-range digit multiset (x values duplicated by x(-k) = x(k), y values mixed with p-1-v by y(-k) = -y(k)),
        and contains the placeholder 0 in 350/720 rows (35/72 curves). Matches the spec text "re-indexed by a seeded
        permutation of k"; not a metric discrepancy
      - 'ties and conjugate pairs: X(a,t) = X(p-a, n-t), so every spike count must be even; all recorded and PTM counts are even'
      - 'd = +-1: no referent in this contract; the nearest analogue (k <-> -k negation classes) is handled by the half range'
      - 'singular fits: none; every curve is non-singular mod p and the lift arithmetic never hit a non-unit denominator'
      - >-
        near-misses: the top real and shuffled near-misses are on CM D=-3 y-digits at character t = 0 (the
        permutation-invariant DC sum), driven by the order-3 automorphism, y(s_tor([lambda k]P)) = y(s_tor([k]P)):
        half-range y-digit sequences repeat values about 1.9x versus about 1.1-1.16x elsewhere. Mean excess of the
        row maximum over ln((p-1)n/2) + gamma on non-blind curves: D=-3 y digits 1-4 real +2.60, shuffled +3.65,
        uniform +0.04; all other classes -1.7..+0.2. The single non-DC near-miss (D=-163 p=347 n=383 x4, a=207, t=110,
        19.725) has null tail probability 1.8e-4 per row, about 0.06 expected across the 336 non-blind higher-digit rows

  control_checks:
    - control: 'digit 0 obeys the same bound'
      result: 'pass: spikes_digit0 = 0 on both seeds; real digit-0 maxima sit below the null expectation (classical exponential-sum cancellation)'
    - control: shuffled-digit control
      result: >-
        pass as specified: 0 spikes on both seeds, recomputed and independently replayed. Shape caveat: on D=-3 y digits
        the shuffled maxima are elevated (+3.65 over the Exp(1) expectation) because the shuffle keeps the
        automorphism-induced value repetitions, so it is not an Exp(1) null there
    - control: uniform-digit control (instrument)
      result: 'pass: 0 spikes on both seeds; uniform maxima track ln((p-1)n/2) + gamma (mean deviation -0.8..+0.04 by class), as the sealed blind calibration predicts'
    - control: 'both arms behave alike'
      result: >-
        at the frozen level (spike counts) both arms give 0 on both seeds. Power is unequal: random-arm curves inside
        the blind zone are 6/12 (seed 20261009) and 9/12 (seed 20261010), so only 9 of 24 random-arm curves can register
        any spike at all
    - control: PTM-1 (proves-too-much)
      result: see proves_too_much

  proves_too_much:
    id: PTM-1
    object: 'planted digit sequence f(k) = floor(p k / n) mod p, fed to the producer instrument run.spectrum and to the validator spectrum on every recorded (p, n)'
    verdict: holds
    result: >-
      The statistic spikes far above threshold on the planted sequence on all 42/72 curves with (n-1)/2 > T(p,n)
      (excess min +1.01, median +65.8, max +281.2; X = m * r with r in [0.99887, 0.999997]). Substituted for a
      higher digit, it gives above-threshold pair totals of 27712 (seed 20261009) and 11710 (seed 20261010), so the
      success criterion fails on both seeds and the known-false conclusion would not be drawn. Instrument and
      validator spectra agree to 9.1e-13 with identical counts.
    scope_restriction: >-
      The instrument is provably blind on 30/72 curves: X <= m = (n-1)/2 for any digit sequence, and m <= T there
      (all curves with n <= 41). That is 12/36 curves on seed 20261009 (6 CM, 6 random) and 18/36 on seed 20261010
      (9 CM, 9 random). PTM-1 is clean on exactly these 30 curves and spikes on exactly the other 42. A clean
      spectrum on these curves carries no information about correlation with k.
    decision_rule_note: >-
      Run through the frozen falsification criterion with the producer's own permutations, the planted sequence
      falsifies under a per-curve-row reading (19 and 15 curves spike with a clean shuffled control). It does NOT
      falsify under a per-digit aggregate reading (the manifest's by_digit.shuffled_above), because its shuffled
      control also spikes, on 5 and 3 curves (mostly cofactor h >= 3, where the planted values form a coarse lattice
      that the t = 0 character detects in any order). The criterion's reading level is therefore load-bearing for a
      falsification. No consequence for the recorded runs, where every count is 0.

