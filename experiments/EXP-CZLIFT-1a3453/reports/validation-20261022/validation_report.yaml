  limitations:
    - 'A passed report makes the two receipts admissible evidence. It does not support or weaken H-CZLIFT-fba874, changes no status, and authorizes no promotion.'
    - 'Interpretation and scope joints (what a white spectrum says about H2) were owned by nobody in this round (PD-1); the points below are reported for that round, not adjudicated here.'
    - 'Effective tested family: 42 of 72 curve records (24 + 18) can register a spike at all; 30 (12 + 18), with n <= 41, are structurally blind under the frozen normalisation and threshold. Random arm: 9 of 24 records carry power.'
    - 'The claim text "maxima about 9 vs threshold about 22" averages per-curve maxima that include the 30 bounded blind-zone curves; null maxima on curves with power are about 9-12.5.'
    - 'The falsification criterion has two readings (per curve-row vs per digit aggregated over curves). Under the aggregated one a planted DL function would not falsify (PTM-1 decision_rule_note). Irrelevant to these zero-count runs, but load-bearing for any future positive.'
    - 'Exp(1) is not the null shape for CM D=-3 y digits, real or shuffled (t = 0 elevation from the order-3 automorphism). The margin of 12 absorbed it here (closest approach 3.94 below T).'
    - 'Environment record lacks numpy/sympy versions and a runtime lock; no peak-memory record. Mitigated by exact independent replay on numpy 2.5.3 / Python 3.13.16.'
