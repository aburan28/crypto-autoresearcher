    range_over_stated_family: [18.35, 24.86]            # p=53,n=11 .. p=599,n=641
    per_seed_fwer_bonferroni:
      spikes_higher_digits_gt0: 1.77e-03     # 36 curves x 2 coords x 4 digits
      shuffled_spikes_total_gt0: 2.21e-03    # 36 x 2 x 5
      uniform_spikes_total_gt0: 2.21e-03
    two_seed_probability_success_criterion_fails_under_null: '<= 1.24e-02 (Bonferroni), <= 6.2e-03 over distinct values'
  null_calibration:
    marginal: 'P(X > 5), P(X > 10) match e^-5, e^-10 to within sampling error for m >= 63; lighter for m <= 29 (bounded by m)'
    null_max_per_digit: 'about ln((p-1)n/2) + 0.577 minus 0.1..0.5: 4.9 (p53,n13), 7.2 (p53,n59), 9.2 (p131,n127), 10.9 (p263,n271), 12.3 (p557,n563), 12.5 (p599,n593)'
    gap_to_threshold: 'null maxima sit about 12 to 14 below T; no simulated draw (7 configs x 60) came within 7 of T'
  planted_PTM1:
    sequence: 'f(k) = floor(p k / n) mod p, k = 1..m'
    value: 'max_{a,t} X = m * r with r in [0.99887, 0.999998] over all 5909 (p,n) grid cells (p prime in [50,600], n odd prime in [11, p+1+2 sqrt p], n != p); argmax at a = 1 or p-1'
    expected_signature: 'spike far above T when m = (n-1)/2 >> T, e.g. p=307,n=311: X = 154.99 vs T = 23.47'
    trivial_bound_blind_zone: >-
      X <= m for every digit sequence, so when (n-1)/2 <= ln((p-1)n) + 12 no sequence at all can
      register a spike. Smallest odd n escaping the zone: 41 (p=53), 43 (p=101), 45 (p=307), 47 (p=557, 599).
