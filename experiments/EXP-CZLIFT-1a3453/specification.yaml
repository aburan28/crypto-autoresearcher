# EXP-CZLIFT-1a3453 -- discrete-log spectrum of the torsion section's digits.
# H-CZLIFT-fba874 / IDEA-20261009-d2412c / RQ-CZLIFT-b9f765 / GOAL-CZLIFT-1516d5.
experiment:
  id: EXP-CZLIFT-1a3453
  hypothesis_id: H-CZLIFT-fba874
  source_idea: IDEA-20261009-d2412c
  question_id: RQ-CZLIFT-b9f765
  goal_id: GOAL-CZLIFT-1516d5
  version: 1
  title: >-
    Character spectrum of digits 0..4 of x and y of the torsion section
    s_tor([k]P), half-range k <= (n-1)/2, on CM-canonical and arbitrary lifts,
    against shuffled and uniform controls
  status: approved
  frozen: true
  designed_at: '2026-10-09'
  approved_by: coordinator
  approval_decision: DEC-20261009-296cee
  execution_authorized: true
  status_note: >-
    Frozen at version 1 and approved 2026-10-09 by DEC-20261009-296cee under
    AGENTS.md "Standing user authorization" after the readiness check.
    Pilot (seed 1, pmax 200) showed the full-range y-digit statistic is
    real-valued by negation symmetry (chi-square with one degree of freedom,
    not exponential); the frozen statistic sums over the half-range only.
    Approval asserts nothing about H-CZLIFT-fba874.
  objective: >-
    For each curve of the EXP-CZLIFT-ae0a13 family compute s_tor([k]P) for
    all k in Z/n at precision 5, read the p-adic digits of its affine
    coordinates, and for every nontrivial additive character psi of F_p
    compute the FFT over Z/n of psi(digit) on the half-range; record per
    digit the maximum of |S|^2/n_half, the count of (psi, chi) pairs above
    ln((p-1)n) + 12, and the same for the shuffled-digit and uniform-digit
    controls.
  inputs:
    cm_arm: harness.czlift.cm_curves_with_prime_subgroup(50, 600, 11), shuffled by seed, first 24
    random_arm: harness.czlift.random_curves_with_prime_subgroup at primes [53, 71, 101, 131, 173, 211, 263, 307, 367, 421, 487, 557]
    precision: 5
    spike_margin: 12
    seeds: [20261009, 20261010]
  controls:
    - 'Digit 0 is the F_p coordinate itself and must obey the same bound (a spike there would be a classical DL correlation).'
    - 'Shuffled control: the same digit values re-indexed by a seeded permutation of k; destroys any DL structure while keeping the digit distribution.'
    - 'Uniform control: fresh uniform digits; a spike there is an instrument defect and invalidates the run.'
    - 'Both arms: the canonical curve lift and an arbitrary lift must behave alike.'
  independent_variables:
    - arm (cm_canonical, random_naive)
    - coordinate (x, y) and digit index (0..4)
    - p, n
  metrics:
    primary:
      - spikes_higher_digits
      - max_excess_over_threshold_higher_digits
    secondary:
      - spikes_digit0, shuffled_spikes_total, uniform_spikes_total
      - by_digit max_power_mean against threshold_mean
  heuristic_under_test: null
  preregistered_prediction:
    quantity: spikes_higher_digits and the control spike counts
    formula: 'spikes_higher_digits = 0; shuffled_spikes_total = 0; uniform_spikes_total = 0 (null tail about e^{-12} per digit)'
    source: H-CZLIFT-fba874 predictions
  scale_relevance:
    tier: toy
    justification: p <= 600, n <= 600, precision 5; no crypto-scale statement.
    correspondence: null
  tail_checks:
    - 'max_excess_over_threshold_higher_digits is reported so a near-miss on one seed can be compared with the other seed.'
  replication:
    seeds: [20261009, 20261010]
    independent_instances: 2
    replication_note: two seeds; a spike counts only if it reproduces at the same digit on both.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1
  stopping_rules:
    - Stop after the two planned trials have output_validated receipts.
    - A crash or timeout is failed_infrastructure; never a metric value.
  invalidation_rules:
    - uniform_spikes_total > 0 (instrument).
    - Either arm empty.
    - The checker cannot reproduce one curve per arm from the recorded seed.
  success_criterion: >-
    On both seeds: spikes_higher_digits = 0, shuffled_spikes_total = 0 and
    uniform_spikes_total = 0.
  falsification_criterion: >-
    On both seeds a digit i >= 1 with above-threshold pairs while its
    shuffled control has none (a reproducible DL-correlated canonical
    digit).
  decision_impact:
    on_positive: >-
      H-CZLIFT-fba874 moves to supported at toy tier after review and the
      "canonical section" clause of H2 is closed at the nonlinear
      (character) level; KN-TECH-73630e gains a pointer to this spectrum.
    on_negative: >-
      A reproducible spike opens a scaled follow-up on that digit and arm
      with a red-team card; it would be the first canonical p-adic quantity
      correlated with the discrete logarithm and overrides every other
      priority on this goal.
  required_artifacts:
    - experiments/EXP-CZLIFT-1a3453/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CZLIFT-1a3453/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CZLIFT-1a3453/runs/<RUN-ID>/command.txt
    - experiments/EXP-CZLIFT-1a3453/runs/<RUN-ID>/environment.json
    - experiments/EXP-CZLIFT-1a3453/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CZLIFT-1a3453/runs/<RUN-ID>/stderr.log
  launcher:
    trial_plan: experiments/EXP-CZLIFT-1a3453/trial-plan.json
    driver: experiments/EXP-CZLIFT-1a3453/implementation/run.py
    checker: experiments/EXP-CZLIFT-1a3453/implementation/check.py
    library: [harness/czlift.py, harness/czlift_run.py, harness/toycurve.py]
  assigned_to: executor
  out_of_scope:
    - Multiplicative characters of F_p on the digits; nonlinear combinations of digits.
    - Any claim about a deployed curve.
