experiment:
  id: EXP-CLGP-399fd9
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-326442
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE LANE''S ONE CONSTRUCTIVE SHOT, AND THE TRADEOFF THAT KILLS IT: the isogeny class supplies
    h ~ p^{1/2} DIFFERENT x-coordinate views of the same abstract group, which is exactly the resource
    the CAGG closure cannot cover -- but the number of curves reachable by an isogeny of degree at
    most X is at most O(X), so M views force isogeny degree >= cM, a cross-view relation''s summation
    polynomial inherits that degree, and the algebraic cost multiplies by M^m against a factor-base
    benefit of only M; the same-view alternative is block-diagonal and is pure parallelism'
  status: draft
  objective: "(A) THE RESOURCE, AND WHY IT IS THE RIGHT PLACE TO LOOK. The CAGG closure of IDEA-20260807-1b7241\
    \ shows the class-group action is worthless to an adversary that sees points only as group handles,\
    \ and names the residual open class precisely: constructions using x(Q) as a FIELD ELEMENT (resource\
    \ R1) composed with the class structure (R4). This record is a concrete member of that class,\
    \ filed deliberately so the closure is not self-serving. The resource is real and is worth stating\
    \ carefully. By transport (T1), an F_p-isogeny phi : E -> E' of degree coprime to N restricts\
    \ to a group ISOMORPHISM G -> G' with phi([k]P) = [k] phi(P). So the same abstract group Z/N is\
    \ realised on every one of the ~h = O(sqrt(p) log p) curves of the class, and each realisation\
    \ gives every point a DIFFERENT x-coordinate. A point of G therefore has h distinct field-element\
    \ views, all computable in polynomial time once the connecting isogeny is known. Nothing in the\
    \ generic group model can express this.\n(B) THE HOPED-FOR GAIN, STATED PRECISELY SO IT CAN BE\
    \ PRICED. In Gaudry/Semaev point-decomposition index calculus the factor base is F_V = {points\
    \ whose x-coordinate lies in V} for V subset F_p, and the binding costs are: |F| relations to\
    \ collect, each requiring a Groebner solve of the arity-m summation system; and |F|^2-ish sparse\
    \ linear algebra. With M views the factor base can be enlarged to\n    F = {P in G : EXISTS i\
    \ <= M with x_{E_i}(phi_i P) in V},\nof expected size ~ M |V| N / p, i.e. M times larger at the\
    \ same |V|. If that enlargement were free it would let the same decomposition probability be reached\
    \ with |V| smaller by a factor M.\n(C) THE FIRST OBSTRUCTION, AND IT IS RIGOROUS: THE VIEWS-DEGREE\
    \ TRADEOFF. Every curve in the class is [a] * E for an integral ideal a of O, and the connecting\
    \ isogeny has degree N(a). The number of integral ideals of norm at most X is O(X). Therefore\n\
    \    #{curves reachable from E by an isogeny of degree <= X} = O(X),\nso obtaining M distinct\
    \ views forces the largest connecting isogeny degree to be at least c M. This is a counting theorem,\
    \ not a heuristic, and it is the exact quantitative form of the T5 reachability gate for this\
    \ lane: cheap reachability and low degree are the same resource and you cannot have both.\n(D)\
    \ THE SECOND OBSTRUCTION: A CROSS-VIEW RELATION INHERITS THE DEGREE. A relation that mixes views\
    \ asserts\n    sum_i phi_{j(i)}^{-1}( point with x-coordinate u_i ) = R  in G,\nand expressing\
    \ it algebraically requires pulling each point back along its isogeny. The pullback is the dual\
    \ isogeny, a rational map of degree N(a_{j(i)}) = deg phi_{j(i)}. Composing the arity-m summation\
    \ polynomial S_{m+1} -- whose degree in each variable is 2^{m-1} -- with rational maps of degree\
    \ D multiplies the degree in each affected variable by D. So the cross-view system has degree\
    \ ~ 2^{m-1} D in each of m variables, and its Bezout number rises from ~2^{(m-1)m} to ~(2^{m-1}\
    \ D)^m: a factor D^m. Combining with (C), D >= cM gives\n    BENEFIT: factor-base size multiplied\
    \ by M.\n    COST:    algebraic system Bezout number multiplied by M^m.\nFor every m >= 2 this\
    \ is a strict loss, and the m >= 3 needed for index calculus to have any chance against rho makes\
    \ it catastrophic. THE TRADEOFF IS THE RESULT and it is stated as an inequality between two explicit\
    \ powers of M, not as an impression.\n(E) THE THIRD OBSTRUCTION, WHICH CLOSES THE OBVIOUS WORKAROUND:\
    \ SAME-VIEW RELATIONS ARE BLOCK-DIAGONAL. The workaround is to forbid mixing: collect relations\
    \ whose m points all come from one curve's sub-factor-base, and combine them in the linear algebra,\
    \ which is legitimate because transport is a group isomorphism and every relation pulls back to\
    \ a relation in G. But then every relation's support lies inside ONE of the M sub-bases, so the\
    \ relation matrix is BLOCK DIAGONAL with M blocks. Block-diagonal relations cannot link blocks,\
    \ so the system decomposes into M independent index calculi, each on a factor base of size |V|\
    \ N/p -- exactly the standard attack run M times in parallel. NO EXPONENT CHANGE, only parallelism,\
    \ and parallelism is already available for free by running M independent rho walks. Linking two\
    \ blocks requires at least one cross-view relation, which reinstates (D).\n(F) THE FOURTH OBSTRUCTION,\
    \ WHICH IS THE DEEPEST AND IS ALREADY IN THE CORPUS. Even granting cross-view relations for FREE,\
    \ the views change |V| but not m, and the binding constraint in the prime-field case is m together\
    \ with the non-algebraic factor base: to hold the decomposition probability constant one needs\
    \ |F| ~ N^{1/m} regardless of how |F| is assembled, and on a prime field V cannot be cut out by\
    \ an algebraic condition (the Bezout obstruction recorded in KN-FIND-5c1a03). Enlarging the factor\
    \ base by a factor M lets |V| shrink by M but does not reduce m and does not make V algebraic.\
    \ So the best-case gain is not an exponent at all. This must be said first and loudly, because\
    \ it means (C)-(E) are belt-and-braces: the route fails even in its own fantasy.\n(G) WHERE A\
    \ GAIN COULD STILL HIDE -- THE FORWARD GUIDANCE, AND IT IS NON-EMPTY. The one thing M views could\
    \ buy that (F) does not kill is a view in which the factor base becomes ALGEBRAIC -- a curve E_i\
    \ in the class admitting a low-degree map to a curve or variety over which V is cut out by equations.\
    \ Whether any such curve exists in an ordinary prime-field class is exactly lane L1's isogeny-class-invariance\
    \ question (RQ-ICINV-475b5e), and this record hands it a precise criterion to test rather than\
    \ a vague hope: does the factor-base defining condition remain non-algebraic on EVERY curve of\
    \ the class? A YES is a strong class-invariance closure; a NO is an attack. That is the one branch\
    \ of this lane that is genuinely live, and this record's job is to isolate it."
  resource_label: 'R1 (x-coordinates as field elements: the factor base and the summation polynomials)
    combined with R4 (the isogeny graph / class-group action, supplying the M views). This is the
    only proposal in the L10 batch that consumes R1, and it is filed precisely because R1 is the residual
    class the lane''s closure cannot reach.'
  admissibility: admissible
  admissibility_argument: 'Admissible, and admissible for the strongest available reason: the mechanism
    reads x-coordinates as FIELD ELEMENTS, which is exactly the resource that Shoup''s model cannot
    express and that KN-FIND-b7e091''s simulability arguments do not cover -- both closed oracles
    there return group elements. It also uses the isogeny graph to move between curves, which the
    generic model cannot express either. H-ENDO-001''s scalar collapse is irrelevant because no endomorphism
    is applied to a point of G; isogenies here map G to a DIFFERENT group on a different curve. The
    proposal therefore clears the admissibility filter cleanly and is then obstructed by the four
    quantitative arguments (C)-(F), which is the honest and useful outcome.'
  reachability_gate: 'T5 IS THE BINDING CONSTRAINT AND THIS RECORD GIVES IT ITS SHARPEST QUANTITATIVE
    FORM IN THE CAMPAIGN. The proposal never needs to reach a SPECIFIED curve -- it walks and therefore
    knows every ideal it used, so the expensive p^{1/4} side of the dichotomy is never paid. But the
    cheap side is not free either, and (C) is exactly the price: the curves reachable at degree <=
    X number only O(X), so cheap reachability and low isogeny degree are THE SAME RESOURCE and buying
    M views costs degree M. This converts T5 from a dichotomy into a continuous tradeoff for R1-flavoured
    lanes, which is a reusable statement: any future proposal that wants many curves cheaply must
    pay degree linearly in the number of curves, and any algebraic method whose cost depends on isogeny
    degree inherits that payment. That statement, and the measured views-degree curve behind it, are
    worth having even if every arm of the experiment comes out negative.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): establish (F). If the best case is not an exponent,
      the record''s priority is capped and Stages 3-5 are run only as a measurement of a predicted
      dead end -- which is still worth doing because it produces the views-degree curve and the connectivity
      metric that lane L1 needs. STAGE 1 (zero compute): prove (C); derive (D)''s M-versus-M^m accounting
      at m = 3 and m = 4 with concrete toy numbers. STAGE 2 (minutes, BASELINE GATE): M = 1 reproduction
      of the DREG-lane fixture. Halt if it does not reproduce. STAGE 3 (hours): enumerate a toy class;
      compute connecting degrees; measure the views-degree curve against (C). STAGE 4 (hours to days):
      the three arms at M in {1, 2, 4, 8}, m in {3, 4}, with the random-partition null run alongside
      arm 2. STAGE 5 (hours): the connectivity metric -- cross-view relations found versus M - 1 needed,
      within the arm-1 budget. STAGE 6 (zero compute): hand (G) to lane L1 with the stated criterion.'
    mechanism: "STEP 1 (zero compute, HARD GATE). Establish (F) first, because it is the cheapest\
      \ and it bounds everything else: write the decomposition-probability accounting and confirm\
      \ that |F| ~ N^{1/m} is required regardless of how |F| is assembled, so M changes |V| and not\
      \ m. If (F) is right, the best-case gain is not an exponent and the rest of the proposal is\
      \ a measurement of how much worse than best-case it actually is.\nSTEP 2 (zero compute). Prove\
      \ (C) by the ideal-counting bound and state the constant. Then derive (D)'s Bezout accounting\
      \ explicitly for m = 3 and m = 4, producing the two competing powers M and M^m as concrete numbers\
      \ at the toy parameters to be used.\nSTEP 3 (toy compute). Build the instrument: enumerate a\
      \ toy isogeny class; for a chosen subset of M curves compute the connecting isogenies and their\
      \ degrees by walking with small split primes; verify the views-degree bound (C) empirically\
      \ by plotting the M-th smallest reachable degree against M. PREDICTED: linear in M with the\
      \ ideal-counting constant.\nSTEP 4 (toy compute, THE DISCRIMINATING MEASUREMENT). Three arms\
      \ on identical instances, identical |F| and identical m:\n  ARM 1 SINGLE-VIEW: standard index\
      \ calculus on E with |V| chosen so that\n    |F| = target.\n  ARM 2 MULTI-VIEW, SAME-CURVE RELATIONS\
      \ ONLY: M curves, |V| reduced by M\n    so that the union factor base has the same |F|; relations\
      \ restricted to\n    one curve each.\n  ARM 3 MULTI-VIEW, CROSS-VIEW RELATIONS ALLOWED: same\
      \ as arm 2 but the\n    solver is given the composed system with the pullback maps.\nMetrics\
      \ per arm: relations per unit time; measured solving degree and Groebner runtime per decomposition\
      \ attempt; the RELATION MATRIX BLOCK STRUCTURE (number of connected components of the support\
      \ hypergraph); and total time to |F| independent relations. PREDICTED: arm 2 matches arm 1 per\
      \ block and its matrix has exactly M connected components, i.e. it is M parallel copies and\
      \ its total is no better; arm 3 fails to produce ANY cross-view relation within budget once\
      \ M exceeds a small threshold, and its measured solving degree grows with M as (D) predicts.\n\
      STEP 5 (toy compute, THE CONNECTIVITY METRIC -- this is the sharpest number in the design).\
      \ Report the fraction of relations that are cross-view, as a function of M and of the algebraic\
      \ budget. The union factor base is only useful if the relation hypergraph is CONNECTED; the\
      \ number of cross-view relations needed to connect M blocks is at least M - 1. So the decisive\
      \ question is a single measurable number: can the solver produce M - 1 cross-view relations\
      \ within the budget that arm 1 would spend on the entire attack? PREDICTED: no, by orders of\
      \ magnitude, and the gap grows like M^m.\nSTEP 6 (zero compute). Hand (G) to lane L1 with the\
      \ precise criterion: is the factor-base defining condition non-algebraic on EVERY curve of the\
      \ class?"
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - arm 1, size-matched single-curve factor base -- the only comparison that isolates views from size
  - random-partition null with the identical block structure and no isogenies -- mandatory before
    any block-count claim
  - M = 1 degeneracy reproducing the DREG-lane fixture exactly
  - matched m, matched |F|, matched target and matched solver across arms
  - rho baseline at 0.886 sqrt(N) on the same instances, so all totals are charged against the real
    incumbent
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. MATCHED NULL OF THE SAME SHAPE: a SIZE-MATCHED
    SINGLE-CURVE factor base -- arm 1 -- with exactly the same |F|, the same m, the same target and
    the same solver. This is the only comparison that isolates "M views" from "a bigger factor base",
    and it is the same discipline lane L4 requires for its orbit bases. A second matched null: M RANDOM
    DISJOINT SUBSETS of a single curve''s factor base, of the same sizes as the M sub-bases, with
    relations restricted to one subset each. That null has the identical block structure with NO isogenies
    involved, so any block-structure effect it reproduces is a property of the partition and not of
    the class. DECAY PARAMETER: M. The claimed benefit (factor-base enlargement) must grow with M
    while the measured cross-view relation yield must FALL with M like M^{-m}. A cross-view yield
    that does NOT fall as M grows contradicts (C)+(D) and is the one outcome worth escalating; a measured
    "benefit" that fails to decay when the isogenies are replaced by the random-partition null is
    the canonical artifact tell and means the effect is partition bookkeeping, not isogeny structure.
    POSITIVE CONTROL: M = 1, where all three arms must coincide exactly with the standard single-curve
    attack and reproduce the DREG lane''s recorded solving degrees on a frozen fixture.'
  independent_variables: []
  metrics:
    primary:
    - connecting isogeny degree per curve, and the views-degree curve
    - relations per unit time, per arm, per (M, m)
    - measured solving degree and Groebner runtime per decomposition attempt
    - connected-component count of the relation hypergraph, per arm, with the partition null alongside
    secondary:
    - cross-view relation count against the M - 1 connectivity requirement
    - total time to |F| relations per arm, and against rho
    - per-cell record of whether a cell ended in a solver timeout (infrastructure) or a completed
      measurement
  heuristic_under_test: null
  preregistered_prediction:
    quantity: M-th smallest connecting isogeny degree from E, as a function of M
    formula: Linear in M with fitted slope within a factor 3 of the ideal-counting constant, over
      the whole toy class. A sublinear fit would refute (C) empirically and would be a genuine surprise
      worth escalating.
    source: pre-registered in IDEA-20260807-326442 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - 'FACTOR-BASE SIZE VERSUS VIEW COUNT. The single largest confounder: a multi-view base is bigger,
    and bigger bases help for reasons unrelated to views. |F| must be matched exactly across arms,
    and the record''s whole comparison is void if it is not.'
  - ISOGENY EVALUATION COST. Computing x_{E_i}(phi_i P) for M curves costs M isogeny evaluations per
    point, which is pure overhead charged to arms 2 and 3 and to nothing else. It must be measured
    and included in totals, or arms 2 and 3 will look artificially competitive.
  - SOLVER TIMEOUTS MASQUERADING AS DEGREE GROWTH. Arm 3 will time out. A timeout is an infrastructure
    outcome and is not evidence for (D) unless the degree growth is independently confirmed on the
    cells that DID complete. This distinction is the most likely place for the write-up to overclaim.
  - SMALL-CLASS ARTIFACTS. At toy p the class may contain fewer than 8 curves, capping M below the
    interesting range and making the views-degree fit meaningless. Require h >= 32 before interpreting
    any M-sweep, and report h per instance.
  - m = 3 IS NOT THE INTERESTING ARITY. Prime-field index calculus needs larger m to have any chance,
    and larger m is exactly where the toy budget dies. The record must state that its measurements
    are at the arities it can reach and that (D)'s M^m penalty is WORSE at the arities that matter,
    not better -- so the toy measurement is conservative in the direction of the conclusion, which
    is the honest direction.
  - TWIST AND SIGN. x-coordinates forget the sign of a point, so a view vector is really a vector
    of point-pairs. Relations must track signs consistently across views or spurious relation failures
    will be recorded as algebraic difficulty.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: 12.0
    maximum_memory_gb: 8
    maximum_runs: 60
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Linear in M with fitted slope within a factor 3 of the ideal-counting constant,
    over the whole toy class. A sublinear fit would refute (C) empirically and would be a genuine
    surprise worth escalating.
  falsification_criterion:
  - Arm 3's measured solving degree does not grow with M. (D) is wrong; the cross-view systems are
    cheaper than the Bezout accounting predicts; the route is live and this becomes an attack proposal.
    Escalate for independent review.
  - The views-degree curve is sublinear in M. (C) is wrong as applied; recheck the ideal counting
    and the walk construction.
  - Arm 2 beats arm 1 at equal |F| and m. (E) is wrong; the union factor base helps even block-diagonally;
    escalate, and check first that |F| really was matched, since an unmatched |F| is the overwhelmingly
    likely cause.
  - The random-partition null reproduces any claimed multi-view effect. The effect is partition bookkeeping,
    not isogeny structure, and no class-based claim may be made.
  - M = 1 fails to reproduce the DREG-lane fixture. The pipeline is not the program's index calculus;
    no arm comparison is interpretable and the run set is invalid.
  - Arm 3 cells end in solver timeouts without the predicted degree growth being independently confirmed.
    That is an INFRASTRUCTURE outcome under AGENTS.md rule 5, is recorded as such, and is NOT evidence
    for (D).
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
