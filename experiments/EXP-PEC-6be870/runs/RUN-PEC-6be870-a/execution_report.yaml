    - id: "OBS-9"
      subject: "the pre-registered extrapolation to c"
      status: "MODELED, NOT MEASURED"
      law: "c = gamma * log2(B_opt) / sqrt(log2 p)  (frozen before any datum)"
      inputs_that_are_measured_by_this_run: "gamma (see OBS-4)"
      inputs_that_are_carried_in_constants: >
        log2(B_opt) per field size, quoted as stored from
        experiments/EXP-P13VOW-001/runs/RUN-P13VOW-001/raw-result.json
        (per_field.<key>.optimal.log2B).  sqrt(log2 p) was RECOMPUTED by this
        run rather than copied.
      rows:
        - name: "SQIsign NIST-I"
          log2p: 256
          log2_B_opt_input_constant: 14.200000000000001
          sqrt_log2p_recomputed: 16.0
          c_modeled_at_gamma_low: 0.7713584333335093
          c_modeled_at_gamma_point: 0.8643539342933328
          c_modeled_at_gamma_high: 0.8682499776339566
          c_modeled_at_gamma_local_top_sensitivity: 1.0389140465019586
        - name: "SQIsign NIST-III"
          log2p: 384
          log2_B_opt_input_constant: 17.8
          sqrt_log2p_recomputed: 19.595917942265423
          c_modeled_at_gamma_low: 0.789482050567682
          c_modeled_at_gamma_point: 0.884662547232566
          c_modeled_at_gamma_high: 0.8886501308937227
          c_modeled_at_gamma_local_top_sensitivity: 1.0633240739345178
        - name: "SQIsign NIST-V"
          log2p: 512
          log2_B_opt_input_constant: 20.900000000000002
          sqrt_log2p_recomputed: 22.627416997969522
          c_modeled_at_gamma_low: 0.8027848647713463
          c_modeled_at_gamma_point: 0.899569157826579
          c_modeled_at_gamma_high: 0.9036239324828037
          c_modeled_at_gamma_local_top_sensitivity: 1.0812411406793072
        - name: "log2p = 576"
          log2p: 576
          log2_B_opt_input_constant: 22.3
          sqrt_log2p_recomputed: 24.0
          c_modeled_at_gamma_low: 0.8075724442881341
          c_modeled_at_gamma_point: 0.9049339312085127
          c_modeled_at_gamma_high: 0.9090128873820297
          c_modeled_at_gamma_local_top_sensitivity: 1.0876893538494683
        - name: "log2p = 768"
          log2p: 768
          log2_B_opt_input_constant: 26.1
          sqrt_log2p_recomputed: 27.712812921102035
          c_modeled_at_gamma_low: 0.8185548152964232
          c_modeled_at_gamma_point: 0.9172403443864438
          c_modeled_at_gamma_high: 0.9213747712614945
          c_modeled_at_gamma_local_top_sensitivity: 1.1024811017728027
      optimistic_and_declared_assumptions_restated_next_to_these_numbers:
        - id: "L1"
          statement: >
            The measured power law is assumed to extend from the tested range
            (ell <= 211 here) to ell ~ B_opt ~ 2^14.2 at NIST-I through 2^26.1 at
            log2 p = 768.  UNTESTED.  That is about 6.5 octaves in log2 ell
            beyond the top of the measured range at NIST-I.  The measured range
            also never reaches ell >> log2(p^2) = 80, so the asymptotic regime
            the law describes is not entered by this experiment at all.
        - id: "L2"
          statement: >
            The table build is charged at ell = B_opt.  DECLARED, NOT MEASURED.
            Algorithm 1 creates entries at every prime ell <= B, so the
            entry-weighted mean of ell^gamma is at most B^gamma; charging at
            B_opt makes the primary c an UPPER bound WITHIN the law, which is
            attack-unfavourable.  The contract's optional secondary kappa was
            computed from the C-BASE.4 exhaustive builds and is reported below;
            it carries its own untested transfer from tiny B to B_opt ~ 2^14.
        - id: "L3"
          statement: >
            B_opt is inherited from RUN-P13VOW-001, whose own control
            reproduced the paper's five Section 4.1 pairs only within 0.05-3.51
            bits (adjudicated in DEC-20260724-016).  Any margin statement
            derived from these c values inherits that +/-3.51-bit
            irreproducibility band.
        - id: "L4"
          statement: >
            gamma is measured for THIS pure-Python implementation pair.  Batched
            modular-polynomial evaluation of the Sutherland type - suggested in
            the frozen paper's own Lemma 3.3 footnote, credited there to Damien
            Robert, and flagged in RT-C1 - is NOT implemented here and could
            lower the exponent.  An unoptimised implementation yields an UPPER
            bound on the achievable per-entry exponent, which is anti-attack by
            construction.  Conversely the costs the contract excludes (Phi_ell
            storage and I/O, coefficient reduction, hashing and table access)
            are all excluded in the attack's favour, so the same gamma is
            simultaneously a LOWER bound with respect to those components.  The
            two directions are NOT netted; both are reported.
    - id: "OBS-10"
      subject: "optional secondary of assumption L2 (kappa)"
      status: "SECONDARY, MODELED"
      measured_part: >
        Entry-weighted mean of log2(ell) over the C-BASE.4 exhaustive builds:
        [{"B": 2, "X": 16, "entries": 45, "entry_weighted_mean_log2_ell": 1.0, "kappa": 1.0}, {"B": 2, "X": 64, "entries": 189, "entry_weighted_mean_log2_ell": 1.0, "kappa": 1.0}, {"B": 3, "X": 27, "entries": 217, "entry_weighted_mean_log2_ell": 1.463656913014002, "kappa": 0.9234646954410844}, {"B": 3, "X": 81, "entries": 889, "entry_weighted_mean_log2_ell": 1.4606003942686185, "kappa": 0.9215362468222731}]
      kappa_mean_over_rows: 0.9612502355658393
      c_kappa_modeled:
