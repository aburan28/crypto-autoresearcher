        - {name: "SQIsign NIST-III", log2p: 384, c_kappa_at_gamma_point: 0.8503820819235797}
        - {name: "SQIsign NIST-V", log2p: 512, c_kappa_at_gamma_point: 0.8647110648685628}
        - {name: "log2p = 576", log2p: 576, c_kappa_at_gamma_point: 0.869867954545704}
        - {name: "log2p = 768", log2p: 768, c_kappa_at_gamma_point: 0.8816974971119607}
      caveat: >
        This does NOT replace the primary law and carries its own untested
        transfer from B in {2,3} to B_opt ~ 2^14.
    - id: "OBS-11"
      subject: "instrument and bookkeeping integrity"
      measured: >
        Total counted F_{p^2} multiplications across every measured region of
        the run: 1511133917.  Per-worker accounting agrees with the sum of per-sample
        costs: TRUE.  Per-sample counter-isolation failures: 0.  Wall-clock is
        recorded per sample in raw-result.json and was never substituted for
        the counted unit.

