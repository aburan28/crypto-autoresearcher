        Transient fetch obstruction on Phi_97 during this run's acquisition
        phase, although the same URL served the file earlier in the session
        (see PD-2).
      class: "infrastructure_error"
      mathematical_evidence: false
    - id: "AN-3"
      what: >
        C-INSTR.3's isolation guard fired during pre-run testing on control-cost
        leakage into forked workers (see PD-3).  Recorded because it is exactly
        the class of bookkeeping error the control exists to catch, and because
        it demonstrates the guard was armed rather than decorative.
      class: "implementation_error, caught and repaired before the run"
      mathematical_evidence: false
    - id: "AN-4"
      what: >
        p (largest prime below 2^40 with p = 3 mod 4) does NOT coincide with the
        frozen PoC's previous_prime(2**40).  The contract anticipated this and
        asked for it to be recorded; both values are in OBS-2.
      class: "expected observation, recorded as instructed"
      mathematical_evidence: "not applicable"
    - id: "AN-5"
      what: >
        C-NULL covers ell 2..101 only. The contract's execution_order places
        C-NULL at step 5 and the optional extension at step 8, so the extension ell
        103..211 were acquired and measured AFTER the null control had run and are
        therefore not null-controlled, although they enter the W-ALL, W-MID and
        W-TOP fits. This follows from the frozen order and was not chosen by the
        Executor. It is recorded rather than repaired by improvising an extra
        post-hoc null measurement outside the frozen order.
      class: "scope limitation of the frozen execution order"
      mathematical_evidence: "not applicable"
    - id: "AN-6"
      what: >
        Two summary fields of raw-result.json under-report the acquisition phase:
        acquisition_phase_total_bytes reads 28564879 and acquisition_phase_seconds
        reads 20.41, which cover only the step-2 core acquisition; the step-8
        extension fetches are recorded completely per ell but were not added into
        those two summary fields. Recomputed from the run's own committed per-ell
        records: 646284683 bytes over 46 retrieved files and 51.835 seconds of
        fetch time, both far inside the contract's caps of 2147483648 bytes and 900
        seconds, and the largest single file is 66663416 bytes, inside the 67108864
