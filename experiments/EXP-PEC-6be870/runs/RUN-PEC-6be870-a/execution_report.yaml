      met: true
      detail: >
        One run was planned (maximum_runs: 1) and one run reached a terminal
        state.  The failed command invocation PD-1 is recorded and is not a run.
    - check: "missing runs are explained"
      met: true
      detail: "no run is missing; PD-1 through PD-5 explain every gap."
    - check: "required artifacts exist"
      met: true
      detail: >
        All six queue-declared artifacts plus the four the repository validator
        requires beside a manifest (command.txt, environment.json, stdout.log,
        stderr.log) are present; their SHA-256 and byte lengths are in
        manifest.yaml.
    - check: "raw data and summary tables agree"
      met: true
      detail: >
        manifest.yaml and this report are both generated mechanically from
        raw-result.json, so no number is transcribed by hand.  Within
        raw-result.json the per-worker accounting sum equals the sum of
        per-sample costs (TRUE), and the per-sample counter-isolation check,
        which compares each region's count against the process-global counter,
        failed 0 times.
    - check: "the result reproduces from the recorded command and revision"
      met: true
      detail: >
        The program is deterministic given the recorded seeds: every random
        stream is derived from a string recorded in manifest.yaml.  The only
        non-deterministic inputs are the downloaded Phi_ell files, whose
        SHA-256 are recorded per ell together with the SHA-256 of the
        mod-p-reduced arrays, and the reduced arrays for ell <= 13 are embedded
        in raw-result.json as an offline re-verification fixture.  Wall-clock
        figures and worker pids will differ on re-execution; counted
        multiplications will not.
    - check: "core-grid requirement of the contract's success criterion"
      met: false
      detail: >
        The contract binds the completion gate to the 26-prime core grid at 8
        samples each.  25 of 26 were achieved; ell=97 was dropped by the fetch
        obstruction PD-2.  Recorded as NOT MET, per the contract's own
        instruction that a truncated grid is scoped evidence and that the
        core-grid requirement is then recorded as not met.

  non_claims_restated:
    - >
      This run measures a toy-scale exponent at p ~ 2^40 over ell <= 211. It is NOT
      a cryptographic-scale measurement and may never be presented as one
      (AGENTS.md rule 7). The claim-tier ceiling is medium.
    - >
      Every statement about NIST-I, NIST-III or NIST-V here is an EXTRAPOLATION
      under the pre-registered law, conditional on L1-L4, and is reported as
      conditional - never as a measurement of a cryptographic-scale margin. The
      extrapolated c carries NO tier at all: it is a declared model substitution.
    - >
      The measured range never reaches ell >> log2(p^2) = 80 in the asymptotic
      sense the law describes, and at NIST-I the relevant ell ~ B_opt ~ 2^14.2 lies
      about 6.5 octaves beyond the top of the measured range. The extension of the
      power law across that gap is assumed, not observed.
    - >
      gamma is a property of this pure-Python implementation pair over this range,
      not of Algorithm 1. A batched Sutherland-type modular-polynomial evaluation -
      credited in the paper's own Lemma 3.3 footnote to Damien Robert - is not
      implemented and could collapse the measured exponent. The measured gamma is
      therefore an UPPER bound on the achievable per-entry exponent.
    - >
      Conversely the excluded costs (Phi_ell storage and I/O, coefficient
      reduction, hashing and table access) are all excluded in the attack's favour,
      so gamma is simultaneously a LOWER bound with respect to those components.
      The two directions are not netted; both are reported.
    - >
      This experiment cannot discriminate between per-entry cost laws that agree
      over ell <= 211 and diverge at ell ~ 2^14. That identifiability limit is
      inherent to the measured range and is not removed by any precision within it.
      The pre-registered curvature diagnostic in fact declares the single-exponent
      model MISSPECIFIED over the measured range, which is recorded as OBS-6 and is
      an observation, not an interpretation.
    - >
      Nothing here decides whether the NIST-I margin is ~34 bits or ~2 bits. It
      supplies one input to that question.
    - >
      Nothing here bears on Heuristic 1: this is a cost measurement, not a
      smoothness measurement. Nothing here bears on CSIDH, (qt-)Pegasis, or
      torsion-based constructions, which the attack does not cover.
    - >
      Nothing here changes any hypothesis status, promotes or weakens H-P13-001, or
      supports any security-parameter action.

