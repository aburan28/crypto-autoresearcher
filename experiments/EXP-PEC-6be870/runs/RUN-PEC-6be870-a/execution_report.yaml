  readings_of_the_frozen_contract_preamble: >
    Points where the contract admits more than one implementation and the
    reading taken is recorded so a Validator can check it.  Each records the
    direction of the reading.  None of these was chosen after seeing a
    result; all were fixed before the measurement run.
  readings_of_the_frozen_contract:
    - id: "R-1"
      subject: "F_{p^2} inversion accounting"
      reading: >
        The contract says inversions are counted in a SEPARATE register and are
        NOT included in the primary unit, while C-INSTR.4 says an inversion
        increments the multiplication register 'by exactly the number of
        multiplications it performs through the instrumented primitive'.  Both
        clauses hold exactly and simultaneously only if the inversion performs
        ZERO primitive calls, so fp2_inv computes the F_p norm and the F_p
        inverse without routing them through the F_{p^2} primitive.
      direction: "attack-favourable for the primary count"
      sensitivity_reported: >
        The declared sensitivity charging 3 multiplications per inversion is
        reported: gamma under that charge (IMPL-A, W-MID) is 0.9329491309016471 versus 0.9331912935165684
        without it.
    - id: "R-2"
      subject: "what IMPL-B substitutes"
      reading: >
        'IMPL-B = the same pipeline with KARATSUBA polynomial multiplication'
        names exactly one substitution, so only the multiplication routine
        differs; the schoolbook remainder and division steps are shared with
        IMPL-A.
      direction: >
        A Karatsuba/Newton-based remainder is not named anywhere in the frozen
        contract and improvising one would redesign the experiment.  It would
        lower IMPL-B's count further and hence lower the min-over-
        implementations primary; the reading taken therefore yields an UPPER
        bound relative to that unnamed alternative.
    - id: "R-3"
      subject: "C-NULL denominator"
      reading: >
        The contract's own construction says 'a table of ell + 1 entries', so
        entries_null = ell + 1.  The alternative reading of 'identical
        cost/entries denominator convention' - counting the non-backtracking
        roots at each 2-isogeny step - is also computed and recorded per
        sample.  The two denominators differ by a factor independent of ell, so
        gamma_null and the C-NULL verdict are identical under both.  The
        control's verdict is therefore invariant under this ambiguity.
      direction: "none (verdict invariant)"
    - id: "R-4"
      subject: "which implementation the null object is measured with"
      reading: >
        'IDENTICAL ... aggregation and fit' was read as mirroring the primary
        exactly, so C-NULL was run under BOTH IMPL-A and IMPL-B and aggregated
        by the same min-over-implementations rule.  At the null's fixed degree
        2 the two implementations coincide (below the Karatsuba threshold), so
        this makes the mirroring literal at no cost.
      direction: "none"
    - id: "R-5"
      subject: "C-BASE.4 starting j-invariant"
      reading: >
        The contract does not name a starting j-invariant for the isogs
        enumeration.  Rather than privilege one, the enumeration was run from
        EVERY pool member, and the contract's 20000-chain cap on (5,125) was
        applied to each starting point's own running total.  count(B,X) is
        j-independent, so the pass criterion is unchanged.  See
        underspecification U-1.
      direction: "superset; no privileged choice made"
    - id: "R-6"
      subject: "Horner instantiation"
      reading: >
        'by Horner evaluation in j for each x-degree' was implemented as a
        plain Horner loop with NO zero-coefficient skipping, so
        mults_instantiate is exactly (ell+1)(ell+2) by construction and is
        deterministic.
      direction: "attack-unfavourable (it counts multiplications by zero)"
    - id: "R-7"
      subject: "zero-coefficient skipping in polynomial arithmetic"
      reading: >
        Polynomial multiplication, remainder and division skip zero
        coefficients and make no primitive call for them.  With all
        coefficients nonzero the schoolbook product counts exactly (d+1)^2 as
        C-INSTR.1 requires, which is the case the control pins.
      direction: "attack-favourable"
    - id: "R-8"
      subject: "the carry-forward minimum"
      reading: >
        'the primary per_entry(ell) is the MINIMUM over implementations' is
        stated at the per-ell level, so the minimum is taken of the two per-ell
        MEDIANS, not sample by sample.  gamma_A and gamma_B are both reported
        separately, as are the per-ell cost ratios.
      direction: "attack-favourable, as the contract intends"
    - id: "R-9"
      subject: "the 'POINT estimate' of gamma in the extrapolation"
      reading: >
        The contract asks for c at the LOW end, the POINT estimate and the HIGH
        end of gamma_reported, and declares W-MID the primary window before any
        datum.  The point estimate used is therefore the W-MID OLS slope.  All
        three values are reported, so a reviewer may substitute any other
        summary of gamma into the same law.
      direction: "none; all three ends reported"

  underspecification_encountered_preamble: >
    The contract requires the Executor to STOP and report rather than fill a
    gap that changes a number.  The gaps found are listed with whether they
    change a number.  None of them changes a primary metric: each was
    neutralised by computing a superset, by an invariance, or by the
    contract's own text determining the answer.  No STOP was therefore
    warranted, and none of these was resolved in a way that could have been
    chosen after seeing a result.
  underspecification_encountered:
    - id: "U-1"
      gap: "C-BASE.4 does not name the starting j-invariant."
      changes_a_number: >
        It changes the chain counts of that control only, never a per-entry
        cost, gamma or c.  Neutralised by running every pool member (R-5); the
        per-start results are all recorded individually.
      resolution: "superset; no privileged choice"
    - id: "U-2"
      gap: >
        C-NULL says 'IDENTICAL cost/entries denominator convention' while its
        own construction fixes 'a table of ell + 1 entries'.
      changes_a_number: >
        It changes the LEVEL of per_entry_null by a constant factor but not its
        exponent, and the control's pass criterion is on the exponent and on a
        ratio, so the verdict is invariant.  Both denominators are recorded.
      resolution: "invariance; both values reported"
    - id: "U-3"
      gap: >
        The contract fixes walk seeds and the bootstrap seed but does not fix a
        seed for the randomness that Cantor-Zassenhaus splitting requires,
        although it names Cantor-Zassenhaus explicitly.
      changes_a_number: >
        Yes: the number of splitting attempts, and hence the counted cost of a
        sample, depends on that stream.  It could not be omitted, since the
        named algorithm is randomised.  Every stream is derived
        deterministically from strings recorded in the manifest, and the stream
        for a sample depends on (ell, j_index) ONLY and not on the
        implementation, so IMPL-A and IMPL-B traverse the identical split
        structure and differ only in the multiplication routine.  This makes
        the run bit-for-bit reproducible and makes the A/B cost ratio a clean
        comparison.  Reported here rather than chosen silently.
      resolution: >
        Deterministic seeding, fully recorded.  If the Coordinator judges that
        this needed to be pre-registered, that is an amendment for a
        SUPERSEDING contract; nothing here was re-scored.
    - id: "U-4"
      gap: >
        Whether IMPL-B's remainder step is also Karatsuba-based.
      changes_a_number: >
        It would change IMPL-B's counts and hence the min-over-implementations
        primary.  It is NOT genuinely underspecified: the contract names
        exactly one substitution.  See reading R-2, which also states the
        direction of the unnamed alternative.
      resolution: "determined by the contract's own text"

