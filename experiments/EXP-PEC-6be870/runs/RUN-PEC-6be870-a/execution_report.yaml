  executor_assessment:
    protocol_complete: false
    protocol_complete_detail: >
      Every step of the frozen execution_order was executed in order, every
      pre-registered control was run with its own pass/fail/void criteria, the
      optional extension was executed and reached ell = 211, and every required
      artifact exists. The one gap is coverage, not procedure: the contract binds
      the completion gate to the 26-prime core grid and ell=97 could not be
      acquired (PD-2), so 25 of 26 core ell were measured. Because that binding
      requirement is not met, protocol_complete is recorded as false rather than
      true. The measurement over the 46 ell that WERE measured is unaffected.
    data_quality: "good"
    data_quality_detail: >
      All ten control checks PASS, including the null-object control that would
      have voided the primary measurement. 484 primary samples and 400 null
      samples; per-sample counter-isolation failures 0; per-worker accounting
      agrees exactly with the sum of per-sample costs; every one of 30616 reported
      roots verified by an independent evaluation path; 23772 chain relations
      verified by a separate bivariate evaluator; all 40 C-BASE.4 enumerations
      reproduce the frozen PoC's count(B,X) EXACTLY; root regularity 484/484. All
      four pre-registered admissibility conditions are met. Two scope limitations
      qualify the coverage rather than the quality: the missing ell=97, and
      C-NULL's coverage of ell 2..101 only.
    requires_rerun: false
    requires_rerun_detail: >
      maximum_runs is 1 and the contract's stopping rule is 'stop after the
      first valid run'.  The one gap (ell=97) is an infrastructure obstruction
      the contract instructs the Executor to drop and record, not to retry, and
      re-running to fill it would be a second run against a maximum of one.
      Whether a scoped successor experiment should re-measure ell=97 is a
      Coordinator decision, not an Executor one.
    failure_classification: >
      The run itself is not a failure. Two infrastructure_error events occurred and
      are recorded: a failed command invocation before the run started (PD-1) and a
      transient fetch obstruction on Phi_97 (PD-2). Neither is mathematical
      evidence about the attack (AGENTS.md rule 5), and neither is a
      negative_observation. One implementation_error (PD-3) was caught by a control
      during pre-run testing and repaired before the measurement run; it is
      recorded rather than omitted. No resource_exhaustion, no invalid_measurement,
      no specification_error. On the classification list of agents/executor.md the
      run terminates as a completed valid measurement, scoped to what it measured.

