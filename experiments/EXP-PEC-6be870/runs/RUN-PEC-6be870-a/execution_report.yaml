        largest (101) is 4903.127450980392; ratio 0.9578603427174924; within 2^{+/-0.5}: true.
      implementation_gap: >
        gamma_A - gamma_B = 0.14027624073132405 on W-MID.  The contract calls a substantial
        negative gap the quantitative form of RT-C1's own caveat that a better
        implementation lowers the exponent.  The sign and size are recorded;
