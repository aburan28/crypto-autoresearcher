experiment:
  id: EXP-MLDSA-1c66ac
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-MLDSA-12f563
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  title: >-
    Calibrate first, attribute second: reproduce a published ML-DSA lattice
    block size to within 10 before computing anything, then decompose
    SelfTargetMSIS's norm budget by source term and tabulate which attack arm
    binds under each named cost convention

  objective: >-
    Produce, if a later approval and execution authorization are granted, three
    things in strict order. (1) A CALIBRATION VERDICT: does a pure-Python
    root-Hermite instrument reproduce a published MLWE and MSIS block size at
    ML-DSA-44 to within 10? A SCOUT-COMPUTED pass outside the harness says NO,
    by about 355 in beta. (2) If and only if (1) passes: the per-term
    attribution of SelfTargetMSIS's norm budget zeta, including the d = 0
    counterfactual, over a five-point graded ladder. (3) In either case: the
    exact integer quantities that do not pass through a block size -- zeta and
    its three term shares, the triviality gate zeta/q, and the hash arm's size
    |B_tau| -- together with the non-reordering control and the
    lattice-versus-hash margin table insofar as its lattice column can be
    sourced. THE CONTRACT IS DESIGNED SO THAT A CALIBRATION FAILURE IS A
    DELIVERABLE RATHER THAN A DEAD RUN.

  what_this_is_not:
    - Not a forgery, a key recovery, a signature, or any attack on ML-DSA or on any of its underlying problems.
    - Not a claim that ML-DSA meets or fails any NIST security category. That comparison needs the category definitions, which this program has not read, and it is out of scope.
    - Not a claim that any published estimate is wrong. The contract can exhibit a discrepancy and attribute it; it cannot adjudicate a document it has not obtained.
    - Not a statement about any implementation, device, fault, or side channel. That is EXP-MLDSA-15866e's lane and under AGENTS.md rule 7 the two may never be combined into a joint claim.
    - Not a measurement of anything GOAL-MLDSA-002 owns. No leak rate, no t0 reconstruction, no rejection predicate. Only the definitional bound ||t0||_inf <= 2^(d-1) is used.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has happened.
    - Not a lattice reduction. No lattice is ever built, reduced, or sieved; only a cost model is evaluated.

  claim_ceiling:
    tier_for_exact_integer_results: crypto
    tier_for_block_size_results: >-
      NONE UNTIL THE CALIBRATION GATE PASSES. If G4 fails, every quantity
      downstream of a block size is reported as UNTIERED and may not be cited at
      any tier by any record. If G4 passes, those quantities are reported at the
      tier the source convention itself supports, never higher.
    exact_scope_a_run_could_support: >-
      At most: "at the parameter table sourced in Stage 0, SelfTargetMSIS's
      admissible-solution infinity-norm zeta equals <values>, of which
      <percentages> are contributed by the public-key compression term
      2^(d-1)*tau; the generic hash arm costs |B_tau| = <values> operations with
      O(1) memory; and under cost conventions <named list> the cheapest attack
      arm is <table>, with crossovers at <values>." Nothing about ML-DSA's
      security, nothing about any category, nothing about any implementation.
    why_toy_is_not_claimed_as_crypto: >-
      Rule 7 is satisfied trivially on the exact-integer half because the
      arithmetic runs at the real parameter sets and involves no scaling. It
      binds hard on the block-size half, where the CONVENTION is inherited and
      currently unvalidated -- so that half is gated rather than downgraded.

  inputs:
    parameter_table_provenance_rule: >-
      Every parameter enters the run with a provenance class in
      {READ_PRIMARY, READ_SECONDARY, RELAYED, RECALLED-UNVERIFIED} recorded per
      field. Stage 0 attempts to raise every field to READ_PRIMARY. Fields that
      remain RECALLED-UNVERIFIED are used, but every result they touch is
      stamped with the lowest provenance class among its inputs.
    parameter_table_recalled:
      q: 8380417
      ring_degree: 256
      d: 13
      ML-DSA-44: {k: 4, l: 4, eta: 2, tau: 39, gamma1: 131072, gamma2: 95232, omega: 80}
      ML-DSA-65: {k: 6, l: 5, eta: 4, tau: 49, gamma1: 524288, gamma2: 261888, omega: 55}
      ML-DSA-87: {k: 8, l: 7, eta: 2, tau: 60, gamma1: 524288, gamma2: 261888, omega: 75}
      provenance: RECALLED-UNVERIFIED
      corroboration: >-
        (a) sibling-goal records IDEA-20260805-bb52fa and H-MLDSA-2d4123 quote
        gamma2, tau and d identically and derive tau*2^(d-1) = 159744 / 200704 /
        245760; (b) the challenge-space sizes this table forces reproduce the
        widely quoted 2^192 / 2^225 / 2^257 to within a bit. NEITHER IS A
        READING OF THE STANDARD.
      recorded_inconsistency: >-
        Those sibling records cite "FIPS 204 Table 1" while KN-LIT-4dadec
        records the standard's body as NOT READ. Reported to the Coordinator;
        this contract edits nothing and repairs nothing.
    derived_ladders:
      d_ladder: [0, 4, 7, 10, 13]
      memory_price_alpha_sweep: [0.0, 0.05, 0.10, 0.25, 0.50, 1.00]
      maxdepth_budget_bits: [40, 64, 96]
      cost_conventions: [classical_memory_free, classical_memory_charged, quantum_sieve, wiener_at2]
    recalled_baselines_to_be_replaced_in_stage_0:
      published_block_size_mldsa44_msis: "about 423 -- RECALLED-UNVERIFIED, the calibration target, and itself a candidate to be wrong"
      published_classical_bits: "about 123 / 182 / 252 -- RECALLED-UNVERIFIED, the lattice column of the margin table"
      core_svp_constants: {classical: 0.292, quantum: 0.265, memory: 0.2075, provenance: RECALLED-UNVERIFIED}
    seeds: []
    seed_derivation_rule: >-
      NO RANDOM SEED IS USED ANYWHERE IN THIS CONTRACT. Every computation is
      deterministic: exact integer arithmetic, one transcendental function
      (delta(b)), an integer minimisation over a bounded range, and bisection to
      a declared tolerance. A third party reproduces every number bit-for-bit
      from the parameter table alone. The absence of seeds is recorded
      explicitly so that a reader cannot mistake an omitted field for an
      overlooked one; any future arm that introduces randomness requires a new
      contract version and a stated derivation rule.
    determinism_declarations:
      delta_formula: "delta(b) = ((b/(2*pi*e)) * (pi*b)^(1/b))^(1/(2*(b-1))), evaluated in IEEE double via math.log/math.exp in log space to avoid overflow"
      subdimension_range: "m ranges over integers in [2, rank]; the chosen m and whether the optimum is INTERIOR or on the BOUNDARY is recorded for every evaluation -- a boundary optimum is a declared diagnostic, not a silent result"
      block_size_search: "least b in [50, 3000] satisfying the criterion, found by increasing scan; if no b in range satisfies it, the cell is reported as OUT_OF_RANGE and never as a large number"
      bisection_tolerance: "crossover quantities to 1e-6 absolute in the swept variable"

  arms_and_controls:
    treatment: >-
      For each parameter set and each d in the d-ladder: compute zeta, its three
      term values and shares, and (only after G4 passes) the block size and
      core-SVP bits; report Delta_bits between d = 13 and d = 0.
    measured_null: >-
      NULL-A, THE IDENTICAL-SHAPE NULL. Run the ENTIRE attribution pipeline on a
      pair of shapes that are identical (both d = 0). FORCED VALUE, DERIVED
      BEFORE THE RUN: Delta_bits EXACTLY 0 and Delta_beta EXACTLY 0. THIS NULL
      CAN FAIL: a rounding convention applied asymmetrically, an off-by-one in
      the subdimension loop, or any dependence on evaluation order returns a
      nonzero answer here. If it returns nonzero, every attribution number in
      the package is void.
      NULL-B, THE LATTICE-VS-LATTICE NON-REORDERING NULL. Compare the MLWE arm
      against the MSIS arm across 3 parameter sets x 4 cost conventions = 12
      cells, all costed with the same solver family. FORCED VALUE: reordering
      count EXACTLY 0, forced by the theorem in H-MLDSA-12f563 C3. THIS NULL CAN
      FAIL: the same code path that would produce a spurious lattice-vs-hash
      flip produces a spurious flip here.
      NULL-C, THE CONSTANT-INSTRUMENT CHECK. Report the spread of block sizes
      across the six shapes (3 sets x {d = 13, d = 0}). Zero spread means the
      projection is constant across everything it was supposed to distinguish
      and the instrument measured the apparatus; that outcome terminates the
      line and is reported as an instrument finding.
    positive_control: >-
      PC-1, THE CALIBRATION GATE (this is G4 and it is the whole contract's
      hinge). Reproduce a published MLWE block size and a published MSIS block
      size at ML-DSA-44, under the source's own stated convention, to within 10.
      IF PC-1 FAILS, NO NEGATIVE OR POSITIVE BLOCK-SIZE RESULT MAY BE REPORTED
      AT ALL -- not "the compression costs few bits", not "the margin is wide",
      not "the arms do not swap". The instrument is then the object of study.
      PC-2, THE CONSTRUCTED FLIP. Build a synthetic arm pair: the real hash arm
      at ML-DSA-87, and a synthetic lattice arm whose block size is chosen so
      that the classical memory-free margin is exactly +1 bit. Charging memory
      at any alpha > 0 MUST flip the binding arm. If the machinery does not
      report a flip on a pair constructed to flip, it cannot detect flips, and
      no "no flip" finding may be reported anywhere in the package.
    graded_controls: >-
      GC-1, THE d-LADDER: five interior points d in {0, 4, 7, 10, 13} at
      ML-DSA-44's other parameters. Report block size at each and the
      monotonicity verdict. Forced: strictly non-increasing in zeta. A FLAT
      ladder (spread <= 1) is a real and reportable finding -- the norm budget
      does not drive the block size at these dimensions -- and is distinguished
      from an instrument failure by NULL-A and PC-1 both passing.
      GC-2, THE MEMORY-PRICE SWEEP: alpha in {0, 0.05, 0.10, 0.25, 0.50, 1.00}.
      Report, per parameter set, which arm binds at each alpha. Forced: the
      binding-arm sequence is MONOTONE -- once the hash arm binds it must keep
      binding, because the lattice cost is increasing in alpha and the hash cost
      is constant. Non-monotonicity localises the fault to the cost composition
      rather than leaving "the table looks odd".
    ordering_control: >-
      THE NULLS ARE COMMITTED BEFORE THE TREATMENT IS LOOKED AT. Execute
      NULL-A, NULL-B and PC-1 first, write their outputs and a SHA-256 digest of
      those outputs to disk, and only then compute any treatment quantity.
      Absence of that digest invalidates the package. Additionally the decision
      rule for "which arm binds" is executed on NULL-B before the real
      comparison is read: if it emits the same label on both, it discriminates
      nothing and must be rewritten before the treatment arm is read.
    comparability_policy: >-
      Every reported number carries (i) its cost convention by name, (ii) the
      provenance class of every input it touched, and (iii) its memory column.
      NUMBERS FROM DIFFERENT CONVENTIONS ARE NEVER COMPARED, SUBTRACTED, OR
      PLACED IN THE SAME COLUMN. The SCOUT-COMPUTED values recorded in
      H-MLDSA-12f563 (b = 778 / 1182 / 1688, Delta_bits = 37.1 / 28.0 / 47.0)
      were produced OUTSIDE this harness and are pre-registration targets only:
      they may be compared to the in-harness re-run and to nothing else.

  metrics:
    primary:
      - "G4 calibration residual |b_instrument - b_published| for the MLWE and the MSIS arm at ML-DSA-44, with the source's convention named. THE GATE: <= 10."
      - "zeta and its three term values and shares, exact integers, per parameter set (G0, G1)."
      - "log2 |B_tau| = log2(C(256,tau)*2^tau), computed two independent ways agreeing to 0.1 bit (G2)."
      - "Delta_bits between d = 13 and d = 0, per parameter set, reported ONLY if G4 passes (G8 ladder attached)."
      - "Binding-arm table over 3 parameter sets x 4 cost conventions, with alpha_star and the MAXDEPTH reversal thresholds (G9, G10, G11)."
    secondary:
      - "Triviality gate zeta/q per set (G3)."
      - "NULL-A output (must be exactly 0), NULL-B reordering count (must be exactly 0), NULL-C block-size spread."
      - "PC-2 flip verdict."
      - "The chosen subdimension m per evaluation and whether the optimum was INTERIOR or BOUNDARY."
      - "Wall-clock and peak RSS per stage; provenance class per parameter field after Stage 0."
      - "A list of every candidate cause considered for the calibration residual, and which were eliminated."

  heuristic_under_test: HEUR-STM-1

  preregistered_prediction:
    quantity: >-
      The five exact-integer forced values and the calibration verdict, all
      fixed before any in-harness execution.
    formula: >-
      zeta = max(gamma1 - beta, 2*gamma2 + 1 + 2^(d-1)*tau) with beta = tau*eta;
      compression share = 2^(d-1)*tau / zeta;
      |B_tau| = C(256, tau) * 2^tau;
      b(zeta) = min{ b : min_{m in [2,rank]} delta(b)^m * q^(n*k/m) <= zeta };
      Delta_bits = 0.292*(b(zeta_0) - b(zeta_13)).
    source: >-
      Derived in ledger/hypotheses/H-MLDSA-12f563.yaml, mechanism STEPS 1-6. The
      norm-budget identity and the |B_tau| count are derived in-repo. The
      delta(b) form and the core-SVP constants are RECALLED-UNVERIFIED and are
      the object of the calibration gate, not an authority for it.
    values:
      zeta: [350209, 724481, 769537]
      compression_share: [0.4561, 0.2770, 0.3193]
      zeta_over_q: [0.04179, 0.08645, 0.09183]
      log2_B_tau: [192.760, 225.345, 257.015]
      zeta_d0: [190465, 524092, 524168]
      scout_computed_and_expected_to_be_wrong:
        b_zeta: [778, 1182, 1688]
        b_zeta0: [905, 1278, 1849]
        delta_bits: [37.1, 28.0, 47.0]
        note: >-
          PRE-REGISTERED IN ORDER TO BE FALSIFIED. These come from the
          uncalibrated instrument. The pre-registered expectation is that G4
          FAILS on first attempt (SCOUT residual about 355 against a gate of 10)
          and that these three rows are therefore never promoted.
    calibration_verdict_prediction: >-
      FAIL on first attempt, with a residual of order 10^2 in beta, and with the
      subdimension optimum on the BOUNDARY at every b tested. A PASS on first
      attempt would mean the recalled published block size is wrong instead,
      which is equally reportable and is not treated as a better outcome.

  scale_relevance:
    tier: crypto
    justification: >-
      The exact-integer arm evaluates the actual parameter sets and involves no
      extrapolation of any kind, so its conclusions are at the parameter sets by
      construction rather than by transfer. The block-size arm evaluates a cost
      MODEL at those parameter sets; its transfer question is not one of scale
      but of CONVENTION, and that question is the calibration gate. A run at any
      other scale would answer nothing here, which is why no toy cell exists in
      this contract.
    correspondence: >-
      null -- no sampling correspondence is used. Every quantity is evaluated
      directly at the parameter sets of interest.

  tail_checks:
    - "|B_tau| computed by exact binomial and by the entropy approximation 256*H(tau/256) - 0.5*log2(2*pi*256*(tau/256)*(1-tau/256)) + tau; agreement to 0.1 bit required."
    - "zeta/q reported to five places so that a value approaching 1 at any future parameter set is visible rather than inferred."
    - "The margin_bits sequence across the three categories checked for strict monotone decrease; a violation is reported even when every individual number is defensible."
    - "For every block-size cell, whether the subdimension optimum was interior or on the boundary. A boundary optimum at every b is the diagnostic that already fired outside the harness."

  replication:
    seeds: []
    independent_instances: 3
    interpretation: >-
      The three parameter sets are three independent instances of the SAME
      derivation, not three replicates of a stochastic measurement. There is
      nothing to replicate statistically: the computation is deterministic. The
      meaningful independence here is that a single arithmetic error is unlikely
      to reproduce the correct forced value at all three sets simultaneously,
      and the shared-form checks (constant unrounded ratios, monotone shares)
      exploit exactly that.

  budget:
    wall_clock_seconds_per_run: 4020
    stage_ceilings_seconds: {stage_0_reading: 2400, stage_1_exact: 120, stage_2_calibration: 600, stage_3_attribution: 900}
    total_cpu_hours: 1.2
    maximum_memory_gb: 1
    maximum_runs: 3
    no_network_for_compute_stages: true
    network_for_stage_0_only: true
    budget_note: >-
      GOAL-MLDSA-001's campaign_budget carries a budget_risk_note recording that
      BATCH-001's task ceilings summed to 83 per cent of the whole 10800 s
      campaign. This contract's ceiling is 4020 s (37 per cent), of which 2400 s
      is reading that may yield nothing under the network policy; its compute
      stages total 1620 s, 15 per cent of the campaign. Sized deliberately so
      that a Coordinator does not have to amend campaign_budget to run it.

  stopping_rules:
    - "Do not execute unless this contract is separately approved, frozen, archived, and execution-authorized. It carries no approved_by field because it is not approved."
    - "Stop before any treatment computation if the NULL-A / NULL-B / PC-1 digest is absent."
    - "STOP AT G4. If the calibration gate fails, do not compute Delta_bits, do not compute the margin table's lattice column, and do not report any block-size-derived quantity. Spend the remaining budget on the reconciliation instead, and report it."
    - "Stop if NULL-A returns nonzero or NULL-B returns a nonzero reordering count: the instrument is faulty and further computation produces only more faulty numbers."
    - "Stop if PC-2 does not flip: the machinery cannot detect flips and every flip-related conclusion is unavailable."
    - "Stop if any block-size search returns OUT_OF_RANGE: report the cell as out of range rather than widening the range to obtain a number."
    - "Stop Stage 0 at its ceiling whether or not a source was obtained, and record exactly what was attempted."

  invalidation_rules:
    - "Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false."
    - "Any reported number lacking its cost convention, its provenance class, or (for a lattice quantity) its memory column."
    - "Any comparison, subtraction, or shared column between numbers from different cost conventions."
    - "Any promotion of the SCOUT-COMPUTED pre-registration values to results. They are targets to be falsified; a package that reports them as measurements is invalid."
    - "Any statement about MLWE, MSIS or SelfTargetMSIS hardness rather than about attack cost under a named model."
    - "Any statement about a NIST security category, which requires a document this program has not read."
    - "Any joint claim with EXP-MLDSA-15866e or with any fault or side-channel result (AGENTS.md rule 7)."
    - "Any statement about t0 secrecy, leak rates, or Algorithm 7 rejection predicates (GOAL-MLDSA-002's scope)."
    - "Any parameter used without a recorded provenance class."

  success_criterion: >-
    This contract has no current success outcome because it is not authorized
    for execution. IF a later, separately approved and frozen successor is
    executed, its positive disposition is: NULL-A returns exactly 0; NULL-B
    returns a reordering count of exactly 0; PC-2 flips; the five exact-integer
    forced values (zeta, the shares, zeta/q, log2|B_tau|, zeta_d0) reproduce
    their pre-registered values or their deviation is traced to a Stage-0
    parameter substitution and relabelled; and EITHER (a) G4 passes with residual
    <= 10 and the d-ladder and binding-arm tables are produced with monotonicity
    verdicts, OR (b) G4 fails and the package delivers the reconciliation --
    the exact criterion, the subdimension range, the boundary-optimum
    diagnostic, and the eliminated candidate causes -- with no block-size-derived
    number reported. BOTH (a) AND (b) ARE SUCCESSES. Outcome (b) is the one the
    contract expects, and it establishes, for the first time in this program,
    that no published-versus-rederived lattice comparison here is currently
    meaningful -- which GOAL-MLDSA-001's first completion criterion needs settled
    before it can be met.

  falsification_criterion: >-
    The contract falsifies H-MLDSA-12f563 if: any exact-integer forced value is
    wrong on inputs that Stage 0 confirms (arithmetic error in the derivation);
    or Delta_bits comes out non-positive at any set after G4 passes
    (contradicting the monotonicity theorem C2); or NULL-B returns a nonzero
    reordering count with the instrument otherwise sound (contradicting the
    non-reordering theorem C3); or the margin sequence is not monotone
    decreasing across the categories (contradicting C4's shape claim); or a
    Stage-0 reading shows the SelfTargetMSIS norm bound contains no term
    proportional to 2^(d-1)*tau (C1 has no object).

  infrastructure_failure_disposition: >-
    A timeout, crash, missing dependency, or unreachable source is
    INFRASTRUCTURE SIGNAL and is NEVER negative mathematical evidence
    (AGENTS.md rule 5). Specifically: failure to obtain FIPS 204 or a published
    estimate in Stage 0 is recorded as a source-availability finding and
    triggers GOAL-MLDSA-001's second pause condition for the affected quantities
    only -- it does not weaken any claim about zeta, |B_tau|, or the theorems,
    all of which are derived and need no source. Absence of numpy, sympy,
    fpylll, Sage, gmpy2 or PARI is likewise infrastructure: the environment was
    measured this session (numpy 2.4.6 present, the rest absent) and this
    contract is written to require none of them, so a solver-absence failure
    would indicate the implementation departed from the contract.

  required_artifacts_if_later_authorized:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - Stage-0 source log: every URL or path attempted, HTTP status or error, and the provenance class assigned to each parameter field.
    - The parameter table actually used, with per-field provenance, and its diff against parameter_table_recalled.
    - Null-and-positive-control outputs with their pre-treatment SHA-256 digest, timestamped before any treatment output.
    - Raw results: per cell, the criterion evaluated, the chosen subdimension m, whether the optimum was interior or boundary, and the resulting b.
    - The calibration report: residual, the source convention as stated, and the enumerated candidate causes with their disposition.
    - Exact command, git commit and dirty-tree state, environment and dependency versions, stdout, stderr, timings, peak RSS.
    - Requested model policy, backend, resolved model identifier, probe-verification status, reasoning effort, fallback and degraded flags.
    - Validity status and reason; a snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - Independent review confirms that the calibration gate is genuinely blocking, that the nulls can fail, and that no block-size quantity can be reported when the gate fails.
    - Independent review confirms that no sentence in the contract can be read as a claim about ML-DSA's security, about a NIST category, about an implementation, or about GOAL-MLDSA-002's objects.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
    - Execution is separately authorized after the approved frozen package is delivered.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved; only the Coordinator approves (AGENTS.md rule 1).

  assigned_to: executor
