# EXP-ECDLP-847c56
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-2603a1.
experiment:
  id: EXP-ECDLP-847c56
  hypothesis_id: H-ECDLP-264cdb
  source_idea: IDEA-20261004-6bb450
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-24 table versus width-23 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-2603a1
  objective: >-
    Check the table sizes 8388608 and 4194304, the product 35184372088832, and the nearby gap 0.
  inputs:
    width_hi: 24
    width_lo: 23
    table_hi: 8388608
    table_lo: 4194304
    table_gap: 4194304
    table_product: 35184372088832
    table_sum: 12582912
    nearby_a: 4194304
    nearby_b: 4194304
    nearby_gap: 0
    nearby_product: 17592186044416
  controls:
    - >-
      Two to the power 23 is 8388608. Two to the power 22 is 4194304.
      Reporting both tables as size 4194304 drops the gap and invalidates
      the run.
    - >-
      Eight million three hundred eighty-eight thousand six hundred
      eight exceeds four million one hundred ninety-four thousand three
      hundred four by 4194304. The product of the two sizes is
      35184372088832. Their sum is 12582912.
    - >-
      Two width-23 tables each store 4194304. Their gap is 0 and their
      product is 17592186044416.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-24 table stores 8388608 entries. The width-23 table stores
      4194304. The gap of two width-23 tables is 0.
    formula: >-
      Compute 2 to the power 23. Compute 2 to the power 22. Subtract
      4194304 from 8388608. Multiply 8388608 by 4194304. Subtract 4194304 from 4194304.
    source: >-
      IDEA-20261004-6bb450 states the widths 24 and 23 and the sizes
      8388608 and 4194304, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 35184372088832 and the nearby gap 0 are required. A check that stops at the size 8388608 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 8388608 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 23 is not 8388608.
    - Two to the power 22 is not 4194304.
    - The gap is not 4194304.
    - The product is not 35184372088832.
    - Both tables are reported as size 4194304, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-24 table stores 8388608 entries, that
    the width-23 table stores 4194304, and that 8388608 exceeds 4194304 by 4194304.
  falsification_criterion: >-
    The runs agree that the width-24 table size is computed, and
    that size is not 8388608.
  required_artifacts:
    - experiments/EXP-ECDLP-847c56/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-847c56/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-847c56/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-847c56/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-847c56/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-847c56/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 4194304 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
