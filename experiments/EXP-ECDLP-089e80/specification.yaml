experiment:
  id: EXP-ECDLP-089e80
  hypothesis_id: H-ECDLP-7f5b05
  version: 1
  title: >
    Exact C1 fibre-partition calibrator
    on one frozen Weierstrass model
  status: approved
  approved_by: coordinator
  approved_at: '2026-09-08'
  approval_decision: DEC-20260908-ff376f
  approval_basis: >
    Standing user authorization recorded in AGENTS.md on
    2026-09-06 (ideas and experiments always approved once
    the protocol is complete). Coordinator completeness
    check is DEC-20260908-ff376f after TASK-20260908-e7df9d.
    User confirmation is not an outstanding gate.
  frozen: true
  frozen_at: '2026-09-08'
  execution_authorized: true
  execution_authorized_note: >
    Stage 0 only. Stages 1 and later remain unauthorized
    until an independent review of the Stage 0 instrument
    holds and a later Coordinator decision extends
    execution_authorized_stages. This approval does not
    authorize Stage 1 of EXP-ECDLP-b3f975, does not
    authorize Stage 1 of EXP-ECDLP-daf1bb, does not
    authorize Stage 1 of EXP-ECDLP-0d1336, does not
    authorize Stage 1 of EXP-ECDLP-1aa0f8, does not
    authorize Stage 1 of EXP-ECDLP-79f8c4, does not
    authorize Stage 1 of EXP-ECDLP-628891, does not
    authorize Stage 1 of EXP-ECDLP-9e9536, does not
    authorize Stage 1 of EXP-ECDLP-90f602, does not
    authorize Stage 2 of EXP-ECDLP-4be480, does not
    authorize Stage 2 of EXP-ECDLP-6a97f4, does not
    authorize Stage 17 of EXP-ECDLP-420e73, does not
    authorize Stage 5 of EXP-ECDLP-a98ea9, does not
    classify W, and does not change H-ECDLP-e54f8c,
    H-ECDLP-a69bea, H-ECDLP-38f4b4, H-ECDLP-a23318,
    H-ECDLP-536b21, H-ECDLP-3f68f6, H-ECDLP-b51c3d,
    H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb,
    H-ECDLP-77caa5, H-ECDLP-07c7c6, H-ECDLP-2ade73,
    or H-ECDLP-a3598b.
  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-ff376f
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-e7df9d
  source_proposal: IDEA-20260905-d0fee4
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-ff376f under the standing 2026-09-06
    user authorization. Stage 0 is the exact C1
    fibre-partition calibrator. Random-window
    census, S_3^y, C2, the (L, b) meter, and a
    curve hunt are a later stage and are not
    run here.

  objective: >
    Compute brute-force fibre partitions
    on one frozen family (REAL, KF, NULL)
    and decide whether the enumerative
    C1 calibrator works. Stage 0 does
    not sample windows, does not form
    S_m^f, and does not authorize
    Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL x- and
      y-partitions both sum to #E=12;
      KF adaptive y-window W={0} has
      ratio 3; NULL constant map is
      rejected; zero p and the singular
      cubic rejected. Certificate kind
      none.
    formula: >
      E: y^2 = x^3 - x over F_11.
      Sum_t #f^{-1}(t)(F_p) = #E(F_p)
      for f in {x, y}, with O counted
      at infinity. KF is W={0} for y.
      FORCED Stage 0: fixture_pass,
      real_double_count_pass,
      known_false_adaptive_pass,
      reject_invalid_pass,
      null_constant_pass all true.
    source: >
      ledger/proposals/IDEA-20260905-d0fee4.yaml
      proof_search_map.baseline_embedding and
      method_ceiling.nearby_object_control.
      Provenance internal; read in this design session.

  design_tightening_stage0_is_instrument_not_window: >
    IDEA-20260905-d0fee4 also flags a
    p~2^12 window census, S_3^y
    distinct-value count, (L, b) meter,
    C2 degree bound, and generic-j
    prime-order curves. Stage 0 does
    not sample windows, does not form
    a summation polynomial, and does
    not claim a coordinate-window
    advantage. Those arms are Stage 1+
    objects. Partition arithmetic is
    the only Stage 0 arm. This is a
    disclosed tightening, not a silent
    change of the idea's claim. The
    frozen model has j=1728; C1 is a
    double count on this model.

  inputs:
    fixture:
      curve:
        p: 11
        A: -1
        B: 0
        Weierstrass: y^2 = x^3 - x
        j: 1728
        nE: 12
      real:
        id: REAL
        p: 11
        A: -1
        B: 0
        must_count: 12
        role: real_double_count
      known_false:
        id: KF
        f: y
        W: [0]
        must_ratio: 3
        role: known_false_adaptive_full_fibre
      matched_null:
        id: NULL
        kind: constant
        must_reject: true
        role: matched_null_constant_map
      invalid:
        - id: P-zero
          p: 0
          must_reject: true
        - id: singular
          A: 0
          B: 0
          must_reject: true
      working_model: >
        Exact C1 fibre partition for one
        frozen Weierstrass model. Not a
        window factor base. Not S_3^y.
        Not C2. Not an (L, b) meter.
        Not a curve hunt.
      do_not_hunt_a_new_curve: true

  independent_variables:
    - object in the frozen family
    - whether f is non-constant of degree >= 2
    - whether W is adaptive on full fibres

  null_object:
    name: KF adaptive y-window W={0} on p=11
    construction: >
      f=y and W keeps only the size-3
      fibre at 0. Ratio 3 is the
      known-false object for a
      "every window has ratio 1"
      reading.
    non_degeneracy_check: >
      known_false_adaptive_pass must be
      true before any REAL double count
      is read as a measurement.
    dynamic_range_demonstration: >
      P-zero and the singular cubic must
      be rejected before a partition is
      read as a census.

  controls:
    - KF adaptive full-fibre window (known-false / proves-too-much)
    - REAL x- and y-partition double count
    - NULL constant-map rejection
    - zero p and singular cubic rejection
    - exact discrete enumeration, no sampling
    - model frozen before any fibre is read

  metrics:
    primary:
      - fixture_pass boolean
      - real_double_count_pass boolean
      - known_false_adaptive_pass boolean
      - reject_invalid_pass boolean
      - null_constant_pass boolean
    secondary:
      - REAL #E
      - KF ratio
      - NULL reject reason
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      One frozen Weierstrass model at p=11.
      No transfer to a random-window law,
      C2, or cryptographic n.
    correspondence: null

  tail_checks:
    - REAL is the frozen model p=11 A=-1 B=0
    - KF is the frozen adaptive y-window W={0}
    - NULL is a constant map
    - P-zero and the singular cubic are rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      real_double_count_pass,
      known_false_adaptive_pass,
      reject_invalid_pass, and
      null_constant_pass. A miss classifies
      the run failed_infrastructure if it is
      a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-C1.
    - Stages 1 and later are not authorized.
    - Do not hunt a new curve.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing the frozen (p, A, B) after this freeze
    - Hunting a new curve because a frozen cell fails
    - Reading Stage 0 as a window factor base, S_3^y, C2, or a decoder
    - Reading Stage 0 as an ECDLP advantage
    - Authorizing Stage 1 of EXP-ECDLP-b3f975 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-daf1bb from this contract
    - Authorizing Stage 1 of EXP-ECDLP-0d1336 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-1aa0f8 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-79f8c4 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-628891 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-9e9536 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-90f602 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-4be480 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-6a97f4 from this contract
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Editing EXP-ECDLP-a5f766 or H-ECDLP-a3598b
    - Changing H-ECDLP-e54f8c, H-ECDLP-a69bea, H-ECDLP-38f4b4, H-ECDLP-a23318, H-ECDLP-536b21, H-ECDLP-3f68f6, H-ECDLP-b51c3d, H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73

  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, real_double_count_pass,
    known_false_adaptive_pass,
    reject_invalid_pass, and
    null_constant_pass are true, and the
    run manifest carries certificate.kind
    none. Success is instrument
    reproduction, not a window-base claim
    and not an attack.

  falsification_criterion: >
    A certified KF miss of ratio 3
    after fixture_pass is a scoped miss
    of P-S0-C1. A certified REAL partition
    miss after fixture_pass is a scoped
    miss of P-S0-C1. Infrastructure bugs
    are not mathematics. Stage 0 does not
    test P-S1-WINDOW.

  required_artifacts:
    - Stage 0 raw-result.json with the five gates
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - One frozen toy Weierstrass model at p=11, j=1728.
    - Not a window factor base. Not S_3^y.
    - Not C2. Not an (L, b) meter.
    - No decoder. No cryptographic transfer.
    - No Stage 1 of b3f975. No Stage 1 of daf1bb.
      No Stage 1 of 0d1336. No Stage 1 of 1aa0f8.
      No Stage 1 of 79f8c4. No Stage 1 of 628891.
      No Stage 1 of 9e9536. No Stage 1 of 90f602.
      No Stage 2 of 4be480. No Stage 2 of 6a97f4.
      No Stage 17 of 420e73. No Stage 5 of a98ea9.
    - Certificate kind none. No solve or attack.
    - W is not classified.
    - EXP-ECDLP-a5f766 remains another lane.
    - Do not hunt a new curve.
