# EXP-ECDLP-0f79e5
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-35f8e7.
experiment:
  id: EXP-ECDLP-0f79e5
  hypothesis_id: H-ECDLP-32dbde
  source_idea: IDEA-20261004-6a28f9
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 1048575
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-35f8e7
  objective: >-
    Check the counts 20, 19, and 19, the product 7220, and the nearby gap 0.
  inputs:
    bit_length: 20
    doublings: 19
    additions: 19
    length_gap: 1
    doubling_gap: 0
    digit_product: 7220
    digit_sum: 58
    nearby_a: 19
    nearby_b: 19
    nearby_gap: 0
    nearby_product: 361
  controls:
    - >-
      The bit length is 20. The doubling count is 19. The addition
      count is 19. Reporting the addition count as 20 drops the gap
      against the bit length and invalidates the run.
    - >-
      Twenty exceeds nineteen by 1. Nineteen equals nineteen, so that
      gap is 0. The product of 20, 19, and 19 is 7220. Their sum is 58.
    - >-
      Two readings of the addition count are both 19. Their gap is
      0 and their product is 361.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 1048575 has bit length 20, 19 doublings, and 19
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 20. Count 19 doublings. Count 19 additions.
      Multiply 20, 19, and 19. Subtract 19 from 19.
    source: >-
      IDEA-20261004-6a28f9 states the counts 20, 19, and 19, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 7220 and the nearby gap 0 are required. A check that stops at the bit length 20 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 19 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 20.
    - The doubling count is not 19.
    - The addition count is not 19.
    - The product is not 7220.
    - The addition count is reported as 20, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 20, that the doubling
    count is 19, that the addition count is 19, and that the product
    of those three counts is 7220.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 19.
  required_artifacts:
    - experiments/EXP-ECDLP-0f79e5/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-0f79e5/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-0f79e5/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-0f79e5/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-0f79e5/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-0f79e5/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
