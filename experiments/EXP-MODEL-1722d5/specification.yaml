experiment:
  id: EXP-MODEL-1722d5
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-1354d8
  question_id: RQ-MODEL-e61cb2
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: THE METER THAT ANSWERED THE MODEL QUESTION HAD NO DYNAMIC RANGE - EV-REP-001 and EV-REP-002
    report d_reg = 2 FLAT in every arm, at every factor-base degree, at m = 2 and m = 3, for both
    models; a meter pinned at its floor cannot distinguish models, so "model-invariant" is currently
    a statement about the instrument; this record specifies the six-quantity model-discriminating
    panel, with a pre-registered saturation test that decides in advance whether each quantity CAN
    separate the arms
  status: draft
  objective: "(A) THE OBSERVATION, TAKEN DIRECTLY FROM THE LEDGER. EV-REP-001 records \"W_semaev ...\
    \ d_reg = 2 flat across d in {4,6,8,12,16}, vdim = 2\" and \"ED_x and ED_y (Edwards native): d_reg\
    \ = 2 flat, vdim = 2 ... identical to the Weierstrass baseline at every d\". EV-REP-002 records\
    \ \"m = 3: W_semaev_m3 and ED_native_m3 both d_reg = 2 flat across d in {4,6,8}, vdim = 6\". So\
    \ across two arities, five factor-base degrees, three seeds and two models, the reported metric\
    \ took ONE value. That is not a null result about models; it is a metric with a range of size\
    \ one over the whole design.\n(B) WHY IT SATURATED, WHICH MATTERS BECAUSE IT PREDICTS WHERE IT\
    \ WILL SATURATE AGAIN. The metric is \"output Groebner basis maximum total degree\" (H-REP-001\
    \ assumption 3 names it explicitly, and harness/semaev.py returns exactly this as groebner_basis_max_degree\
    \ with the in-code comment \"proxy, NOT degree of regularity\"). The system solved is\n  {S_m(...)\
    \ = 0} union {prod_{v in V}(x_i - v) = 0 for each i},\nwhose membership factors force each variable\
    \ into a finite explicitly-listed set. A grevlex Groebner basis of such an ideal typically reduces\
    \ to a shape where the quotient ring is spanned by low-degree monomials, so the OUTPUT basis has\
    \ small maximum degree regardless of how hard the computation was. The quantity that varies is\
    \ the degree REACHED DURING the computation, which sympy does not expose - as harness/semaev.py's\
    \ own docstring says. The instrument reports a floor and the floor was reported as a result.\n\
    (C) THIS IS NOT A CRITICISM OF THE ORIGINAL WORK, IT IS THE NEXT STEP. The original records were\
    \ explicit and honest: the module docstring says the reported numbers are \"implementation-bound\
    \ proxies, never ... the theoretical degree of regularity\" and that \"only trends versus parameters\
    \ are interpreted\". EV-REP-001's boundaries even record \"d_reg metric only; wall-time sub-ms,\
    \ not exponent-informative here\". The defect is downstream: DEC-20260716-002 and KN-FIND-023\
    \ converted a flat proxy into \"model not a solving-degree lever\", which is a stronger statement\
    \ than a saturated meter can support. The remedy is a meter with range, not a retraction.\n(D)\
    \ THE SIX-QUANTITY PANEL, WITH THE PREDICTED RANGE OF EACH STATED IN ADVANCE. Every L11 arm reports\
    \ all six on identical instances.\n  M1 PER-VARIABLE DEGREE of the reduced summation polynomial.\
    \ Range predicted:\n    NONE - constant 2^(m-2) across all degree-2 coordinates\n    (IDEA-20260807-dadcd2).\
    \ Included precisely because its predicted range is\n    zero: a quantity known in advance to\
    \ be invariant is the panel's internal\n    negative control, and if it ever varies the pipeline\
    \ is broken.\n  M2 MONOMIAL SUPPORT SIZE and the explicit support set. Range predicted: 13\n \
    \   (short Weierstrass) to 27 (generic reparametrisation), with twisted\n    Edwards at most 14.\
    \ Range of 14 over the design - genuine discrimination.\n  M3 NEWTON POLYTOPE and BKK MIXED VOLUME\
    \ of the full decomposition system\n    (KN-TECH-007). Range predicted: [open], and the pre-registered\
    \ saturation\n    test is MV/Bezout - if that ratio is near 1 in every arm the polytopes are\n\
    \    Newton-saturated, sparse solving equals dense solving, and M3 carries no\n    information,\
    \ which KN-TECH-007 itself names as \"the candidate's own\n    disproof track\".\n  M4 MACAULAY\
    \ MATRIX DIMENSION AT THE FIRST-FALL DEGREE, computed from the\n    degree multiset and the variable\
    \ count via the Froberg series\n    (KN-TECH-011, and the inherited semireg_Dreg construction).\
    \ Range\n    predicted: this is the quantity EV-REP-002's variable-count difference\n    (4 versus\
    \ 8 variables) actually moved, and it should show the Edwards\n    native arm as dramatically\
    \ larger - explaining the 0.09s versus 31s gap\n    without any model content.\n  M5 MAXIMUM DEGREE\
    \ REACHED DURING the computation - not the output degree.\n    Range predicted: [open]. sympy\
    \ does not expose it, so this requires either\n    instrumenting the Buchberger loop or computing\
    \ the Macaulay rank profile\n    directly. THIS IS THE QUANTITY THE ORIGINAL EXPERIMENT WANTED\
    \ AND DID NOT\n    HAVE, and obtaining it is the panel's main implementation cost.\n  M6 WALL\
    \ TIME and Groebner basis size, retained for continuity with\n    EV-REP-001/002 and explicitly\
    \ labelled as the weakest member of the panel\n    at toy scale, where sympy overhead dominates.\n\
    Additionally reported for every arm: VARIABLE COUNT, because it is the confounder that produced\
    \ the original result and it must be visible in every table row rather than buried in a method\
    \ section.\n(E) THE PRE-REGISTERED SATURATION TEST, WHICH IS WHAT MAKES THIS A DESIGN AND NOT\
    \ A WISH LIST. Before any model comparison is interpreted, each quantity is checked for RANGE\
    \ over a deliberately varied design: two models, five factor-base degrees, three seeds, five primes,\
    \ two arities, and the 30 random-reparametrisation draws of IDEA-20260807-4fc635. A quantity whose\
    \ observed range over that entire design is a single value is declared SATURATED and is reported\
    \ as \"no information at this scope\" rather than as \"no difference\". That distinction is exactly\
    \ the one the current ledger elides, and pre-registering it prevents this record from repeating\
    \ the error it diagnoses.\n(F) THE TWO OUTCOMES.\n  OUTCOME 1 - M2 through M5 show range and the\
    \ models still tie. Then\n    \"model-invariant\" becomes a supported statement rather than an\
    \ artifact of\n    a floored meter, and KN-FIND-023 is upgraded rather than contradicted.\n  OUTCOME\
    \ 2 - some quantity shows range AND separates the models after the\n    null battery is applied.\
    \ Then L11 has a genuine finding and the panel\n    identifies exactly which quantity carries\
    \ it, which is what a meter is for.\n  Either way the deliverable is a meter the rest of the campaign\
    \ can reuse,\n  which is DECOMPOSITION.md L14's stated purpose applied inside L11."
  resource_label: '"audit: consumes no resource" - a measurement record. It mounts no attack and claims
    no non-generic structure; it exists so that other records'' resource claims can be measured with
    an instrument that has range.'
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE VACUOUSLY. The admissibility filter asks which non-generic resource
    a lane consumes; a meter consumes none, because it makes no claim about the ECDLP. Filing it inside
    L11 rather than L14 is scoping: the panel''s members are chosen specifically for their ability
    to separate coordinate choices, and a general instrumentation lane would not contain M2 or M3
    in this form.'
  reachability_gate: 'TRIVIAL AND STATED EXPLICITLY. T5 (DECOMPOSITION.md section 3) charges for reaching
    a specified curve in an isogeny class. This record reaches no curve and moves no instance: it
    re-measures the same curves, the same points and the same factor bases the existing records used,
    with more instruments attached. Model change, where it occurs in Step 5, is a coordinate substitution
    costing O(1) field operations with probability 1 - no walk, no mixing time, no vectorization.
    The only non-trivial cost anywhere in the record is IMPLEMENTATION (instrumenting the solver for
    M5), which is an engineering cost and is charged in estimated_cost rather than in a reachability
    gate.'
  inputs:
    procedure: 'STAGE 1 (minutes, GATE): reproduce EV-REP-001''s m = 2 numbers exactly. STAGE 2 (hours):
      implement M5 by both routes and cross-check on the Weierstrass baseline. STAGE 3 (an hour):
      implement M2, M3, M4 and validate M3 against a brute-force F_p solution count as KN-TECH-007
      describes. STAGE 4 (hours): the saturation sweep over the full design; publish the saturation
      table before reading any model comparison. STAGE 5 (hours): the matched-variable-count model
      comparison with the null battery of IDEA-20260807-4fc635 applied to every arm. STAGE 6 (zero
      compute): the per-metric re-read of the original conclusion - CONFIRMED, REFUTED, or STILL UNRESOLVED.'
    mechanism: 'STEP 1 - REPRODUCE THE ORIGINAL NUMBER EXACTLY. Re-run the EV-REP-001 design (m =
      2, d in {4,6,8,12,16}, three seeds) with harness/semaev.py and confirm groebner_basis_max_degree
      = 2 in every cell. If it does not reproduce, the disagreement is the finding and everything
      else waits. GATE. STEP 2 - INSTRUMENT M5. Two routes, cheapest first. Route A: wrap sympy''s
      Buchberger loop to log the total degree of every S-polynomial and every reduced polynomial considered,
      and report the maximum. Route B (independent, and the cross-check): build the Macaulay matrix
      degree by degree from the system''s leading forms and compute the rank profile, extracting the
      first-fall degree by the D0.4 construction of the inherited document. Agreement between the
      two routes on the Weierstrass baseline is the acceptance condition for both. STEP 3 - IMPLEMENT
      M2, M3, M4. Support counting is trivial. Newton polytopes and mixed volume reuse whatever the
      BKK lane already has (KN-TECH-007, KN-FIND-2a8b7e). Macaulay dimension at first fall is a binomial
      from the degree multiset and variable count. STEP 4 - THE SATURATION SWEEP. Run all six metrics
      over the full declared design of (E). For each metric record the number of distinct values and
      the range. Publish the saturation table BEFORE any model comparison is read. STEP 5 - THE MODEL
      COMPARISON, WITH VARIABLE COUNT PINNED. Compare short Weierstrass Semaev against Edwards y-only
      (IDEA-20260807-78eafe), Montgomery (IDEA-20260807-e6d79e) and Hessian-s (IDEA-20260807-5f5ace),
      ALL WITH THE SAME VARIABLE COUNT, on identical curves, points and factor bases. Report every
      non-saturated metric with its null-battery distribution alongside. STEP 6 - THE RE-READ. State
      explicitly, for each metric, whether the original "model-invariant" conclusion is CONFIRMED
      on a metric with range, REFUTED, or still UNRESOLVED because the metric saturated again. All
      three are legitimate and the third is the one the current ledger cannot express.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - the EV-REP-001 reproduction as the anchor
  - the planted-difficulty positive null (y-eliminated versus explicit-y Weierstrass systems, whose
    separation EV-REP-001 already measured)
  - the random-Moebius negative null with decay parameter r
  - MV validated against brute-force solution counting, so the polytope code is checked before its
    numbers are used
  - Route A versus Route B for M5, two independent implementations of the same quantity
  - variable count reported in every table row, never aggregated away
  - 'NULL OBJECT (from the proposal): MANDATORY AND OF TWO KINDS, because a meter needs both directions.
    NEGATIVE NULL - the matched null of IDEA-20260807-4fc635 (random Moebius reparametrisation of
    the same model), on which every metric must behave as that record predicts; in particular M1 must
    be exactly constant. DECAY PARAMETER: the number of randomised variables r, 0 to m. A metric that
    shows a "model effect" of the same size under the random null as under a named model is measuring
    reparametrisation, and the panel reports it that way. POSITIVE NULL - A PLANTED DIFFICULTY. Construct
    two systems on the SAME curve that are known in advance to differ in solving cost - the 3-variable
    y-eliminated Weierstrass Semaev system versus the explicit-y collinearity system that EV-REP-001
    already measured as d_reg growing 4 -> 12 - and confirm that each panel member either detects
    the difference or is honestly recorded as blind to it. A panel that reports "no difference" between
    those two systems is unusable, and EV-REP-001''s own data gives us the answer key for free: the
    output-degree proxy DID separate them (2 versus 4-12), so it has range in that direction and is
    floored only within the membership-constrained family. That nuance must appear in the saturation
    table.'
  independent_variables: []
  metrics:
    primary:
    - all six panel members per arm per cell
    - variable count per arm
    - number of distinct values and range per metric over the design
    - MV/Bezout ratio per arm with the saturation verdict
    secondary:
    - Route A versus Route B agreement for M5
    - the filled saturation table and the filled re-read table
  heuristic_under_test: null
  preregistered_prediction:
    quantity: dynamic range of groebner_basis_max_degree over the full declared design (2 models x
      5 factor-base degrees x 3 seeds x 5 primes x 2 arities)
    formula: Predicted range EXACTLY 1 (the single value 2), reproducing EV-REP-001/002 and confirming
      saturation. A range of 2 or more would mean the original design simply did not span far enough
      and the metric is usable after all.
    source: pre-registered in IDEA-20260807-1354d8 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - VARIABLE COUNT, which is the confounder that produced the original result. It must be pinned in
    Step 5 and printed in every row.
  - MEMBERSHIP-CONSTRAINT DOMINANCE. When the membership polynomials have degree d much larger than
    the summation polynomial's degree, the degree multiset is dominated by the membership block and
    every model looks alike. Sweeping d from small to large is therefore not optional - the model
    effect, if any, should be largest at small d, and a design that only samples large d would manufacture
    invariance.
  - TOY-SCALE SYMPY OVERHEAD dominating M6. Wall time at 16 bits measures the interpreter as much
    as the mathematics; M6 is retained for continuity and explicitly down-weighted.
  - SEMI-REGULARITY. M4's Froberg number is a heuristic prediction and the inherited document records
    that these systems are NOT semi-regular (true first fall below the semi-regular D_reg). M4 must
    never be reported as a measured degree.
  - Reading a saturated metric as a null result is the exact error this record exists to prevent,
    and the pre-registered saturation table in Stage 4 is the mechanism that prevents the record from
    committing it itself.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Predicted range EXACTLY 1 (the single value 2), reproducing EV-REP-001/002 and
    confirming saturation. A range of 2 or more would mean the original design simply did not span
    far enough and the metric is usable after all.
  falsification_criterion:
  - Stage 1 fails to reproduce EV-REP-001's d_reg = 2. The disagreement is the finding and is escalated
    before anything else runs.
  - groebner_basis_max_degree shows range over the enlarged design. Then it was not saturated, the
    original conclusion needs no repair on that ground, and claim (A) of this record is wrong.
  - Route A and Route B disagree on M5 for the baseline. Neither is reportable.
  - MV/Bezout is above 0.9 everywhere. M3 is uninformative and is dropped from the panel with that
    reason recorded - KN-TECH-007 anticipates exactly this.
  - The planted-difficulty positive null is not detected by any panel member. The panel is blind and
    no negative from it is publishable.
  - The Edwards elimination of IDEA-20260807-78eafe fails, so no matched-variable comparison is possible.
    Then Step 5 is reported as unmatched and the conclusion is explicitly scoped to that.
  - Instrumenting sympy changes its results. Route A is abandoned; that is an implementation outcome,
    not a mathematical one (AGENTS.md rule 5).
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-1354d8
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
