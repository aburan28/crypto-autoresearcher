# =============================================================================
# EXP-BINSTD-cb15a4 -- VERSION 1 (APPROVED by DEC-20261003-f15665) frozen
# contract for H-BINSTD-ce918e: peak RSS of S_3 encode+solve vs frozen band
# M₀·2^{α·ℓ} at fixed dim(V)=ℓ (Stages 0-1). Source: IDEA-20261001-20561e
# under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
#
# ZERO RUNS in this design packet. Stages 0-1 authorized for executor
# TASK-20261003-bbf477. No AUXIN. Amazon Bedrock prohibited. NO break.
# NO attack. NO exponent. Runnable command surface declared below.
# =============================================================================
experiment:
  id: EXP-BINSTD-cb15a4
  hypothesis_id: H-BINSTD-ce918e
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-20561e
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Peak-RSS band: does S_3 encode+solve RSS stay ≤ M₀·2^{α·ℓ} at fixed
    dim(V)=ℓ on n=17 toys?
  status: approved
  approved_by: DEC-20261003-f15665
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261003-f15665 under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    ECC2K-130 solve. No n>=131 attack. Stage 2 (multi-n + random-Boolean
    null) not authorized here.
  approval:
    approved_by: DEC-20261003-f15665
    composing_decision: DEC-20261003-f15665
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes V family, (α,M₀)=(1.0, 16777216), encoder pin, RSS
      probe. Stage 1 runs n=17 ℓ∈{3,4} encode+solve RSS panels; writes
      RESULTS.md with exactly one O-* label. No Magma/Sage. No AUXIN. No
      Bedrock. No ECDLP solve.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether peak_rss(encode+solve) ≤ M₀·2^{α·ℓ} on Stage-1 toy cells
    under twin agreement; deliver exactly one O-* label from H-BINSTD-ce918e.

  class: heuristic_validation
  class_note: >-
    Pre-registered peak-RSS band on a memory instrument. Not an
    exponent-moving breakthrough; no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Freeze V family for (n,ℓ) cells including Stage-1 and
        Stage-2 candidates; freeze preregistered-predictions.json
        (α,M₀, seeds, encoder pin, RSS probe); twin self-check on probe V.
      - >-
        Stage 1. For (n,ℓ)∈{(17,3),(17,4)} measure peak_rss of
        encode+one-shot F₂ solve; write stage1/panels.json,
        stage1/control-table.json, RESULTS.md with exactly one O-* label.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Stage-2 multi-n panels and random-Boolean null under this card.
      - Editing IDEA-20261001-20561e claim text or GOAL-ECDLP2M-001.yaml.
      - Editing (α,M₀) after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.
      - Catalog-expansion successor of EXP-BINSTD-5b2fd0 (separate lane).

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-cb15a4/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-cb15a4/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-cb15a4/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-cb15a4/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-cb15a4/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. implementation/run.py +
      check.py + gf2n.py + product_space.py + encode_s3.py are the
      hash-bound sources. Twin meters are the dual-implementation control.
      {run_dir} is substituted by the process supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261001-20561e.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-ce918e.yaml
    alpha: 1.0
    M0_bytes: 16777216
    catalog_seed: 202610032056
    stage1_cells:
      - {n: 17, ell: 3}
      - {n: 17, ell: 4}

  controls:
    - name: twin_Nvar
      definition: >-
        encode_s3 N_var path A == path B on every measured V.
    - name: ctl_fixed_dim_V
      definition: Every Stage-1 V has exactly ℓ basis elements (dim ℓ).
    - name: ctl_frozen_V_family
      definition: Catalog frozen in stage0/v-catalog.json before Stage 1.
    - name: ctl_shared_xorsat_pin
      definition: Encoder pin frozen in preregistered-predictions.json.
    - name: ctl_frozen_alpha_M0_before_runs
      definition: (α,M₀)=(1.0, 16777216) frozen before Stage 1.
    - name: ctl_no_posthoc_band_edit
      definition: Band constants not edited after Stage-0 freeze.
    - name: null_random_boolean_matched_Nvar
      definition: >-
        Stage 2 only (NOT AUTHORIZED). Named so the Stage-1 reading cannot
        silently claim the null.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_rss_n17]
    - name: cell
      levels: ['(17,3)', '(17,4)']

  metrics:
    primary:
      - name: peak_rss_bytes
        unit: bytes
        definition: Process peak RSS via resource.getrusage around encode+solve.
      - name: band_holds
        unit: boolean
        definition: peak_rss_bytes ≤ M0_bytes · 2^(alpha · ell).
      - name: twin_agreement
        unit: boolean
        definition: Twin N_var meters agree on every measured V.
    secondary:
      - name: N_var
        unit: integer
      - name: lin_rank_solve
        unit: integer
      - name: wall_clock_seconds
        unit: seconds

  heuristic_under_test: HEUR-BINSTD-20561e-H1

  preregistered_prediction:
    quantity: >-
      peak_rss(encode+solve) ≤ M₀·2^{α·ℓ} on each Stage-1 cell after twin
      agreement, with (α,M₀)=(1.0, 16777216).
    formula: >-
      band_bytes(ell) = 16777216 * 2**(1.0 * ell); peak_rss from
      resource.getrusage(RUSAGE_SELF).ru_maxrss * 1024 after encode+solve.
    source: >-
      ledger/proposals/IDEA-20261001-20561e.yaml predictions; frozen before
      Stage 1 in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Memory instrument on n=17 only under this card. No transfer of a RSS
      band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids band claims (O-ARTIFACT).
    - RSS probe unavailable → O-IMPEDIMENT / O-INCONCLUSIVE (not O-SUPPORT).

  seeds_and_replication:
    catalog_seed: 202610032056
    independent_instances: 2
    note: >-
      Cells (17,3) and (17,4) are independent instances. Twin meters are the
      replication instrument for each V.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 2.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and v-catalog.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-BINSTD-ce918e.
    - maximum_runs = 4.
    - Do not open Stage-2 under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure → O-ARTIFACT; do not read band as support.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok and rss_probe_ok true on probes;
    Stage 1 produces peak_rss vs band for each Stage-1 cell with twin
    agreement (or a named O-ARTIFACT/O-IMPEDIMENT/O-INCONCLUSIVE stop);
    RESULTS.md names exactly one O-* label from H-BINSTD-ce918e with cited
    artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; post-hoc (α,M₀) edit; a claimed
    break/exponent under this card. (O-FAIL-BAND is a valid scientific
    negative of O-SUPPORT, not a protocol fail.)

  required_artifacts:
    - experiments/EXP-BINSTD-cb15a4/trial-plan-v1.json
    - experiments/EXP-BINSTD-cb15a4/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-cb15a4/stage0/v-catalog.json
    - experiments/EXP-BINSTD-cb15a4/stage1/
    - experiments/EXP-BINSTD-cb15a4/RESULTS.md
    - experiments/EXP-BINSTD-cb15a4/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-cb15a4/implementation/run.py
    - experiments/EXP-BINSTD-cb15a4/implementation/check.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
