    - id: R16
      run_id: RUN-PFDR-1b78f7-stage-r
      condition: O-EXCURSION only
      command: >-
        For each excursion cell (m, bits, arm A): census --panel main --m <m>
        --bits <bits> --curves 5 --curve-offset 5 --arms <A and its three
        matched random arms> --workers 4 --out
        experiments/EXP-PFDR-1b78f7/runs/RUN-PFDR-1b78f7-stage-r/rows.jsonl
        (appending), then analyze_census.py --stage-r over it into the same
        directory.
    - id: R17
      run_id: RUN-PFDR-1b78f7-reg-attribution
      condition: G1 or G2 fails only
      command: >-
        The failing regression command, restricted to the mismatching (bits,
        curve) jobs, executed on the dispatch base commit (engine code before
        any change of this task) in a separate worktree; output rows compared
        with the committed rows and with the new code's rows; the report states
        whether the mismatch predates the harvest change.
  run_procedures:
    regression_comparison: >-
        After each of R02-R09: python3 experiments/EXP-PFDR-1b78f7/compare_regression.py
        --committed <committed file> --new <run>/rows.jsonl --out
        <run>/regression-report.json. Keys: (bits, curve, method, fb, engine
        or "enumerate"). Every key present in the committed row except
        `seconds` is compared for exact equality after JSON parse. The
        committed la_pivot of a row lacking the field is min_index (README
        "Pivot rule"); if a committed file's recorded la_pivot differs from the
        command's flag, the recorded value governs and the executor reports it.
    compression: every rows/harvest-rows/staircase JSONL is gzip -n compressed after its run completes, and hashed after compression
    comparison_before_compression: compare_regression.py reads the uncompressed rows.jsonl; the committed files are read gzip-compressed as stored

  required_artifacts:
    per_run:
      - manifest.yaml (AGENTS.md artifact policy -- run id; experiment id; status and validity reason; code commit, dirty state and sha256 of every executed source file; exact command; environment and dependency versions (python, numpy, OS, CPU model); inputs, cells and every seed; executor session inference block -- requested policy, backend, resolved model id, provenance, model_verified, reasoning effort, fallback_used, degraded requirements; started/finished timestamps; peak RSS, CPU seconds and wall seconds; result.certificate block)
      - command.txt
      - environment.json
      - stdout.log
      - stderr.log
      - raw-result.json (per-run summary -- instance counts by status, gate results, certificate counts, and for R15 every metric of the analysis section and the outcome ids)
      - checksums.sha256 (every file in the run directory)
    per_run_data:
      R01: [stdout.log (pytest output), junit.xml]
      R02-R09: [rows.jsonl.gz, regression-report.json]
      R10-R12: [rows.jsonl.gz, harvest-rows.jsonl.gz, staircase.jsonl.gz]
      R13: [rows.jsonl.gz]
      R14: [rows.jsonl.gz, harvest-rows.jsonl.gz, staircase.jsonl.gz]
      R15: [analysis.json, kappa-cells.jsonl, fits.json]
      R16: [rows.jsonl.gz, harvest-rows.jsonl.gz, staircase.jsonl.gz, analysis.json]
      R17: [rows.jsonl.gz, attribution-report.json]
    per_experiment:
      - experiments/EXP-PFDR-1b78f7/compare_regression.py
      - experiments/EXP-PFDR-1b78f7/analyze_census.py
      - experiments/EXP-PFDR-1b78f7/implementation-notes.yaml (IC-1..IC-8 mapped to functions, files and the implementation commit; any deviation from the implementation contract stated)
      - experiments/EXP-PFDR-1b78f7/execution-report.yaml (runs, gate outcomes, failed instances, unexpected observations, outcome ids; no interpretation beyond the outcome table)
  assigned_to: executor
  interpretation_limits:
    - The generic harvest gain is engineering, not an advance; every odd-m exponent stays above rho's 1/2.
    - A kappa null closes only subgroup (coset), dickson and small_x, m <= 5, 12..32 bits, on this engine and these curves.
    - A kappa-positive outcome is a lever candidate for independent review, not a result.
    - No target-dependent base and no non-generic solver is tested; TS and search-vs-base coincidences are not harvested.
    - Toy scale; generated curves; no deployed-curve statement; slopes are fits, not bounds.
