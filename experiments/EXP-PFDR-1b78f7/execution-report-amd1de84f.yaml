  decision_request:
    id: STOP-1
    blocks: R11 remainder, and very likely R12 (m = 5) and possibly R14 (j0, m = 3); hence R15, PC-1/PC-2 readings and every A1-A7 reading that needs m = 4 cells at 12-24 bits
    observation: >-
      R11 ran the exact frozen command under the binding limits (4 workers,
      RLIMIT_AS 3.5e9 bytes per process, 7200 s per instance). At 3803 s the
      process pool broke. Every job not yet returned -- the three 24-bit jobs
      still running or queued and every 12-22-bit job, which had never started
      because jobs run in descending bits -- was written as
      failed_infrastructure by the frozen job_failure path with t = 0.0 s.
    diagnosis_not_proven: >-
      At bits <= 24 IC-5 RETENTION keeps every harvested row, and the frozen
      _census_job returns them in memory to the pool parent; the 24-bit m = 4
      instances emit tens of millions of SS rows (42096230 SS rows over the
      396 completed instances). The pool parent (itself under the 3.5e9-byte
      cap) grew 0.74 -> 1.38 -> 2.57 GB in its last two 60 s samples while
      24-bit results arrived. An allocation failure under the address-space
      cap during result transfer or unpickling is the most likely cause;
      CPython reports it as this BrokenProcessPool. No traceback, no kernel
      OOM kill; host memory never below 10 GB available. R10 (m = 3) already
      peaked at 2.94 GB. The failure is deterministic in the code and
      limits, so re-running the identical command would be expected to break
      the pool at the same point.
    why_the_executor_did_not_proceed: >-
      The card allows a continuation in a new attempt directory only for
      per-run watchdog expiry, and forbids re-running crashed instances with
      other parameters without a Coordinator decision (D-2). Any workaround
      (restricting --bits / --curve-offset per job, fewer workers, a raised
      cap, or streaming harvest rows to disk) is either a changed command, a
      changed machine limit, or a code change outside the card's enumerated
      list. Running R12 now would very likely reproduce the break (m = 5 at
      <= 24 bits also retains every SS row) and R15 would read 60% of the
      m = 4 panel as failed. None of these is the executor's call.
    options_for_the_coordinator_not_decisions:
      - >-
        (A) Continuation of R11 under the same code, command flags and
        limits, in a new attempt directory of RUN-PFDR-1b78f7-census-m4, one
        census invocation per unfinished (bits, curve) job (--bits B
        --curve-offset c --curves 1), so a pool break is confined to one job;
        the same for any break in R12 and R14. Cheapest; a 24-bit job that
        breaks again stays failed_infrastructure; lower rungs are expected to
        fit (smaller retained sets). Needs a ruling that the per-run
        continuation clause covers pool breakage and that per-job
        invocations are the same command.
      - >-
        (B) An additive code change in _census_job / cmd_census (both
        E-3-allowed functions): workers append harvest rows and staircases to
        per-job files and return only counts, so no retained-row list crosses
        the process boundary; then re-run R11 in full as a new attempt (and
        R10 is unaffected). Changes no count, row or definition; needs an
        amendment, a new R01-style test run and a fresh C-2 certificate.
      - >-
        (C) Change the machine-protection envelope (for example a higher cap
        for the pool parent or fewer workers). The executor does not propose
        raising a cap; listed for completeness.
      - >-
        (D) Accept the loss: run R12-R15 as frozen, with every lost instance
        failed_infrastructure and C-4 reporting incomplete cells. Expected to
        leave m = 4 (and probably m = 5) at 12-24 bits empty.
    note: A pool break is an infrastructure/resource event; it is never negative evidence about any base, class, m or prediction.

