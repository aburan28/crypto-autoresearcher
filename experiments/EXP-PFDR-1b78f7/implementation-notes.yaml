  contract_map:
    IC-1_factor_base:
      file: src/crypto_autoresearcher/index_calculus/factor_base.py
      functions:
        - "FactorBase.subgroup(E, size, seed=0, divisor_multiple_of=1) -- d from _base_divisor(); default path calls nearest_divisor exactly as before; params gain divisor_multiple_of only when != 1"
        - "_base_divisor(p, size, divisor_multiple_of) -- divisor of p-1, multiple of divisor_multiple_of, closest to 2*size, ties to the smaller"
        - "FactorBase.dickson(E, size, seed=0, divisor_multiple_of=1) -- rng label fb-dickson|p|d|seed; c redrawn until (c g^-2)^d != 1; xs = u + c/u, u = g zeta^t; distinct asserted; params {d, coset, c, lambda, seed, target_size}"
        - "dickson_value(x, c, d, p) (recurrence) and dickson_coefficients(d, c, p) (exact integer d/(d-i) C(d-i,i), reduced); FactorBase.membership_poly for kind dickson = D_d(x, c) - lambda"
        - "FactorBase.known_log(E, P, size) -- j*P, j = 1..size, on a separate Curve instance, stored as computed; distinct x asserted; membership_poly raises NotImplementedError; not in FACTOR_BASES"
        - "FACTOR_BASES = (small_x, subgroup, random, dickson); build_factor_base dispatches dickson"
    IC-2_curve:
      file: src/crypto_autoresearcher/index_calculus/curve.py
      functions:
        - "generate_prime_order_curve_j0(bits, seed=0, p_filter=None, max_prime_draws=100_000) -- rng _seeded_rng(...curve.j0, bits, seed); prime as generate_prime_order_curve plus p % 3 == 1; b = rng.randrange(1, p), E = Curve(p, 0, b), P = E.random_point(rng); same order certification and rejections. generate_prime_order_curve unchanged."
    IC-3_tails:
      file: src/crypto_autoresearcher/index_calculus/tails.py
      functions:
        - "TailTable.iter_keys() -- every stored x-key ascending with its codes in stored order (numpy: sorted-array order; dict: sorted codes)"
        - "TailTable.iter_keys_selected(extra_keys) -- the same, restricted to keys with >= 2 tails or in extra_keys (vectorised on the numpy path; tested equal to filtering iter_keys)"
        - "TailTable.distinct_keys() -- number of distinct stored x-keys"
        - "TailTable.decode(code) -> (tail in stored orientation, s_1 = +1; y-bit code & 1)"
        - "build, entries, s3_solves, codes(), orient(), arrays() unchanged"
    IC-4_decompose_recorder:
      file: src/crypto_autoresearcher/index_calculus/decompose.py
      functions:
        - "decompose(..., recorder=None) threads the recorder through _decompose, _level2, _level3 and _walk_candidates"
        - "charged-range rule: _level2 (scalar) calls recorder.scan(R', lo, i) at an early return at i, else scan(R', lo, n-1); _walk_candidates the same with the candidate index c; _level3 and the scalar recursion push/pop the fixed head (i, s) around each visited pair whose R' is finite"
        - "harvest.SearchRecorder computes the encodings R' - F_j (s = +1) and R' + F_j (s = -1) for j in [lo, hi] with _accel's formulas (vectorised) or a non-counting affine addition; the degenerate index x_j = x(R') records only the finite point and counts degenerate_roots; never touches E.ops, DecompStats or the table"
        - "identity G5 per instance: encodings_recorded == 2*(s3_solves - table_s3_solves) - degenerate_roots (harvest block ss_store.identity_ok)"
    IC-5_harvest_module:
      file: src/crypto_autoresearcher/index_calculus/harvest.py
      functions:
        - "Harvester.table_phase -- TT/TB groups from iter_keys_selected; base element first, tails in stored order; y-bit orientation; formal duplicates (TB if identical to the base element, TT if identical to an earlier tail); pairs and star rows; rows emitted TB by (base index, code), TT by (x, code)"
        - "Harvester.end_attempt -- SS: the attempt's encodings are matched against the sorted runs of the store (log-structured merge of sorted (x, descriptor) arrays) and among themselves, group state rebuilt from the stored encodings of that x in recording order; star rows first distinct encoding vs each new distinct encoding; rows emitted at the end of the attempt in recording order of their later element"
        - "rows: c = sigma_X A_X - sigma_Y A_Y, kcoef = -(sigma_X b_t - sigma_Y b_u), rhs = sigma_X a_t - sigma_Y a_u"
        - "Harvester.certify -- sum c_i F_i + kcoef Q == rhs P on an independent Curve instance (own OpCounter; curve.py add/mul; no numpy), before any elimination; a failure raises CertificateFailure (invalidation I-3)"
        - "formal bases: formal_basis_known_log (e_j - j e_1, 1-based), j0_omega_lambda (lambda root with lambda P == (omega x_P, y_P), checked on an independent instance; none matching raises FormalBasisFailure), formal_basis_j0 (e_b - eps lambda e_a)"
        - "formal classes: Harvester._residual -- reduction against the formal-only EliminationState (read-only use of its pivots); known_log uses the log value sum v_j j mod N (allowed by the contract); empty basis: the vector itself"
        - "census elimination: census_elimination(N, formal rows) per class; rows fed in emission order until rank - formal_rank == U; k_determining_rows counted when add_row returns k"
        - "A_fix snapshot at the end of attempt number A_fix (attempts are numbered from 1); censored when the instance stops earlier"
        - "retention: every row at bits <= 24 (p.bit_length()); above 24 bits per class until the census elimination saturates, counts only thereafter"
        - "Harvester.staircase -- per class: rank increments, saturation index, and on instances <= 24 bits the saturation index under 5 permutations random.Random(1..5).shuffle"
        - "poisson_mean per class (formula fixed in ledger/hypotheses/H-PFDR-4765e4.yaml HEUR-4765e4-H1 specification_of_means, which names EXP-PFDR-1b78f7 analysis.poisson_means): mu_TT = C(E'_t,2)*2/N, mu_TB = E'_t*|F|*2/N, mu_SS = C(X'_s,2)*2/N (at A_fix in at_A_fix, at the stop in at_stop); E'_t = stored tails minus tail-tail formal duplicates, X'_s = encodings minus SS formal duplicates"
    IC-6_solver:
      file: src/crypto_autoresearcher/index_calculus/solver.py
      functions:
        - "solve_index_calculus(..., harvest='off', target_label=None, formal_basis=None, attempt_budget=None, harvest_sink=None); harvest != off requires engine mitm"
        - "target rng label ic|p|a|b|m|<target_label or fb_kind>|seed"
        - "harvest off: the original loop, untouched (the harvest branch is a separate block that `continue`s)"
        - "harvest census: recorder + harvester run; rows certified and counted; nothing fed; every solver column equal to off (G2; unit-tested for m = 3, 4, 5 and four bases)"
        - "harvest on: TB then TT rows fed after the table build; per attempt the decomposition row first, then that attempt's SS rows; stops at the first row that determines k; on.{rows_fed, solver_rank_increments, k_determined_by}"
        - "ICResult gains the trailing field harvest: dict | None = None; terminated_by k_found | attempt_cap (max_attempts reached) | attempt_limit"
    IC-7_cli:
      file: src/crypto_autoresearcher/index_calculus/__main__.py
      functions:
        - "sweep --harvest {off,census,on}; census/on refuse any engine other than mitm (exit 2); with off the job dict and the row are built exactly as before (no new key); otherwise the row gains `harvest`"
        - "census subcommand (cmd_census, _census_job, _census_instance, _census_rho): panels main, rho, j0; options --panel --m --bits --curves --curve-offset --rho-curves --arms --known-log-max-bits --workers --out --rows-out --staircase-out; one job per (bits, curve, m); arms in MAIN_ARMS / J0_ARMS order; modes census then on; rows sorted by (bits, curve, m, arm, mode) before the report"
        - "j0_prime_filter(0.15) (label j0-subgroup3(m=[3],tol=0.15)) and _instance_j0"
        - "_base_checks: G7 (subgroup x^d == coset^d; dickson D_d(x, c) == lambda, d distinct preimages, base in image, c not in g^2 mu_d) and G6 (known_log F_j == j P on an independent instance); formal-rank checks (known_log |F|-1, j0 coset 2|F|/3) added from the harvest block"
        - "analyze unchanged"
    IC-8_tests:
      file: tests/test_index_calculus_harvest.py
      tests:
        - "test_tt_tb_groups_match_brute_force (h = 2, 3; numpy and dict tables; p < 2^14)"
        - "test_recorder_encodings_are_the_charged_s3_solves (m = 3, 4, 5; accelerated and scalar paths; early returns and degenerate indices asserted to occur)"
        - "test_every_row_certifies_and_a_corrupted_row_fails"
        - "test_census_mode_leaves_every_solver_column_identical (m = 3, 4, 5 x small_x, random, subgroup, dickson)"
        - "test_harvest_on_stops_no_later_and_verifies"
        - "test_dickson_builder"
        - "test_known_log_base_and_its_formal_basis"
        - "test_j0_generator_lambda_and_formal_basis"
        - "test_duplicated_column_fixture_rank_deficit_and_permutation_stability (census_elimination, B = 24, deficit exactly 1, 5 permutations)"
        - "test_repeated_target_encodings_are_formal_duplicates_at_m4"
        - "test_census_cli_is_deterministic_across_workers (12-14 bits, --workers 1 vs 2)"
        - "plus: harvest needs mitm; target_label replaces fb_kind; subgroup default params unchanged; sweep --harvest off rows carry no new key"
      fp_tests: "tests/test_index_calculus_fp.py passes unedited (74 passed, 9 skipped because the msolve binary is not installed)"
  deviations_from_the_implementation_contract:
    - "IC-4 names _m2_at and _tail_at among the functions the recorder is threaded through. The recorder is informed at the scan level (_level2, _walk_candidates, _level3, _decompose), because indices the vectorised scan skips are charged in _walk_candidates without calling _tail_at; _m2_at and _tail_at are unchanged. The recorded set is exactly the charged range the contract defines (identity G5 is exact and unit-tested)."
    - "IC-7 census rows carry keys beyond the listed schema: status and status_reason (the completion gate requires a status per instance), k_found, k_verified, checks (G6/G7 results) and m is carried in method. The harvest block keys are exactly those of harvest_block."
    - "IC-7 census gains --instance-watchdog (default 7200 s = the budget's per_instance_watchdog_seconds) and --quiet; the frozen commands do not pass them, so the default applies. An expired instance, a MemoryError under the per-process address-space cap, or a crashed job is recorded failed_infrastructure."
    - "j0 panel target log: the contract fixes the curves and the target stream label but not how k is drawn on j0 curves. _instance_j0 applies _instance's rule unchanged: k = Random('target|bits|c|0').randrange(1, N)."
    - "A known_log instance whose cap source (the random_sub_r0 census instance of the job) did not complete is recorded failed_infrastructure (cap unavailable) rather than run uncapped."
    - "Harvest wall time is included in the solver's seconds_* wall-time fields (it runs inside the attempt loop) and is also reported on its own as harvest_seconds; it is never added to any count."
    - "worker_maxrss_bytes is the worker process's lifetime RSS high-water mark (ru_maxrss), cumulative over the instances that worker ran before and including this one."
    - "SS-store layout choice (contract allows any merge schedule): sorted runs of (x uint32, packed uint64 descriptor), merged when the older run is at most twice the newer; groups are rebuilt on demand from the stored encodings of the colliding x. peak_bytes is analytic: entries x 12 bytes."
  engineering_record:
    - "Before R01 the SS store was changed twice to cut memory (same counts, rows and certificates on every smoke instance): a 32-bit m = 4 census instance (random base, curve 0) peaked at 2.2 GB, then 1.7 GB, then 1.17 GB resident. These benchmark instances ran in a scratch directory outside the repository and are not runs; only time and RSS were read from them."
