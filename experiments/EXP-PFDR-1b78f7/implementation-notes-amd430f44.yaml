  contract_map:
    M-1_per_job_procedure:
      file: experiments/EXP-PFDR-1b78f7/amd-430f44/run_jobs.py
      functions:
        - "job_command(): main: <PY> -m crypto_autoresearcher.index_calculus census --panel main --m <m> --bits <B> --curve-offset <c> --curves 1 --known-log-max-bits <K> [--arms <arm> under M-4] --workers 1 --out <jobdir>/rows.jsonl --rows-out <jobdir>/harvest-rows.jsonl --staircase-out <jobdir>/staircase.jsonl; j0: --panel j0 --m 3 ... --rho-curves 5; rho: --panel rho --bits <B> --curve-offset <c> --rho-curves 1 --workers 1 --out <jobdir>/rows.jsonl. No --instance-watchdog and no --quiet."
        - "cmd_run(): each job via amd-1de84f/run_wrapper.py exec (RLIMIT_AS 3.5e9 on the job process; --watchdog = remaining per-attempt watchdog, attempt watchdog 86400 s); at most --max-procs 4; no job starts while /proc/meminfo MemAvailable < 4 GB (it waits); order (-bits, curve, arm) = the frozen cmd_census sort for one m."
        - "postprocess_job(): gzip -n on rows / harvest-rows / staircase JSONL after the job ends, then sha256 of every file in the job directory (jobs-index.json files_sha256)."
        - "jobs-index.json: per job the command, wrapper command, start/end, exit code or signal, watchdog flag, peak RSS, CPU seconds, file hashes, and (keys/status only) rows written, status counts, missing keys, address-space-cap instances, invalid instances, abnormal_end and m4_trigger flags."
        - "run_stop_rule: after any job whose rows hold an invalid instance, no further job starts; running jobs finish; unstarted jobs are listed not_started_after_run_stop."
        - "abnormal_job_end: rows file absent or empty, exit code not in {0, 1} (census returns 1 when an instance is invalid), or wrapper watchdog expiry. M-5 then writes placeholders."
      job_layout: >-
        <attempt>/jobs/b<BB>-c<C>/ (M-4 per-arm: b<BB>-c<C>-<arm>/; IE-1:
        <R11>/attempt-2/invocation-check/b26-c0/) holds rows.jsonl.gz,
        harvest-rows.jsonl.gz, staircase.jsonl.gz, command.txt, stdout.log,
        stderr.log, execution.json (M-1 layout) plus the wrapper's own
        environment.json and its copy run_wrapper.py (the archived wrapper's
        exec always writes both; extra files, nothing removed).
      attempt_files: jobs-index.json, manifest.yaml, command.txt, environment.json, stdout.log, stderr.log, wrapper-stderr.log, raw-result.json, checksums.sha256
    M-2_where_PJ_applies:
      R11: "merge_census.py resume-set asserts the resume set from the archived root rows.jsonl.gz before attempt-2 starts; merge re-asserts it and stops on any attempt-2 job outside it"
      R12_R14: run_jobs.py from their start (attempt-1)
      R13: frozen command via run_wrapper.py exec (general rule only on job-crash rows)
    M-3_checks:
      BI-1: bi-1/bi1_check.sh (above)
      IE-1_IE-2: "merge_census.py compare: attempt-1 records selected by (panel, m, bits, curve[, arms]) from the root rows / staircase / harvest-rows files in file (emission) order vs the check job's files; strip_excluded() removes keys named seconds, keys ending _seconds, worker_maxrss_bytes and ru_maxrss_bytes at any depth; record-by-record equality; the report holds record counts and differing key NAMES only"
    M-4_per_arm_fallback: "run_jobs.py --jobs b<BB>-c<C>:<arm>,... into the next attempt-N (--arms <arm>); merge covers() lets a per-arm attempt supersede only the arms it ran"
    M-5_merge:
      file: experiments/EXP-PFDR-1b78f7/amd-430f44/merge_census.py
      functions:
        - "universe(): U(run) exactly as M-5 cell_universe (R11/R12 990, R14 280 + 35 rho keys)"
        - "row_key(): (panel, m, bits, curve, arm, mode) with m = row m or int(method[4:]); rho rows (panel, 'rho', bits, curve)"
        - "_merge() rule (1): the latest attempt that ran the key's arm in its job (root attempt-1 runs every job; a PJ job every arm; an M-4 job one arm) is the source"
        - "rule (2): no row in any attempt -> placeholder {key fields, status failed_infrastructure, status_reason 'no row: <exit status from jobs-index.json>', placeholder true}"
        - "rule (3): rows outside U -> non_cell_rows_excluded in merge-report.json"
        - "rule (4): two rows for one key within one attempt -> STOP (exit 4, merge-stop.json)"
        - "rule (5): an earlier completed_valid row of a re-run key must equal the later row after the M-3 exclusions -> else STOP (I-5)"
        - "rule (6): staircase records for each canonical key are copied from the same attempt/job directory"
        - "rule (7): rows and staircases written sorted by (bits, curve, m, arm, mode), stable (Python sort), then gzip -n"
        - "rule (8): harvest rows not merged; harvest_rows_map gives each canonical instance its file and sha256"
        - "execution.json aggregate: peak = max, CPU = sum, wall = sum of attempt wall spans (root execution.json for R11 attempt-1; jobs-index.json otherwise), labelled as M-5 requires"
        - "raw-result.json by the pinned summarize_run.py census on the canonical location; manifest.yaml and checksums.sha256 via run_jobs.write_manifest()"
      reading_recorded_before_data:
        - >-
          RHO SORT KEY. M-5 (7) says rho rows sort with arm "" but gives no m
          for them (method "rho" has no int(method[4:])). merge_census uses
          m 0 and mode "" for rho rows, as the frozen __main__._census_sort_key
          does for non-ic rows. Any m <= 3 gives the same order (arm "" sorts
          before every j0 arm within a (bits, curve)), so the choice cannot move
          the order of an R14 row. Recorded here, before R14 exists.
        - >-
          UNRULED CASE STOPS. If the latest attempt that ran a key wrote no row
          while an earlier attempt did, M-5 (1)/(2) do not say which applies;
          merge_census stops (exit 4) rather than choose. It can only arise
          under M-4 or a watchdog continuation.
        - >-
          The M-3 invocation-check jobs are excluded from R11's aggregated
          execution.json (their rows never enter the canonical set); their
          resources are in their own jobs-index.json.
    M-6_view: "merge_census.py view: one symlink per runs/RUN-PFDR-1b78f7-* directory, target <run>/merged/ if it exists else the run root; view-map.json lists link, target and the sha256 of every file under the target"
    M-7_status: "attempt (run_jobs.finalize_attempt): invalid on any invalid instance or run stop; failed_infrastructure if an expected key has no row, a job did not start or a job ended abnormally; else completed_valid. Canonical location (merge_census._merge): completed_valid iff every U key has one canonical row, none invalid and no run stop."
    certificate_format: >-
      run_jobs.certificate_block(): kind discrete_log with verified true (boolean)
      only when instances_verified == instances_claimed > 0; kind none when no
      solve is claimed; a mismatch raises and no manifest is written (fixture M8).
      summarize_run.py's raw-result keeps its own count field `verified`; the
      manifests never copy it into certificate.verified.
    raw_result_sources: >-
      Canonical locations and R13: summarize_run.py 68165e09... (interface fits).
      Attempt directories and the IE check: merge_census.py summarize, which
      uses summarize_run.py's gate_checks() on every job row. R15: analyze_census.py.
    manifest_writer_note: >-
      run_wrapper.py finalize hard-codes TASK-20260929-f90fed and protocol v2, so
      it is not used. run_jobs.py finalize writes the manifests of the wrapper-run
      roots (R13, R15), and write_manifest() is shared by the attempt and
      canonical manifests. The added subcommands (run_jobs finalize /
      finalize-attempt; merge_census resume-set / summarize) implement M-2, M-7
      and the card's REQUIRED ARTIFACTS. They are inside the two pinned files.

