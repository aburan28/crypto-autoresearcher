      - "T3 test_j0_amended_generator_equals_frozen_where_the_first_prime_survives -- inline copies of the frozen prime draw and b-loop; wherever the frozen first prime is neither excluded nor twist-free, (p, a, b, N, P) equal; elsewhere the first log entry is that prime with a skip reason"
