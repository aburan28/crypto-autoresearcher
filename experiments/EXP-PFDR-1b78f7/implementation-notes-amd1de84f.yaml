  deviations_from_the_card_or_amendment:
    - id: DEV-1
      item: D-2 ru_maxrss recording in _census_instance
      text: >-
        The card's CODE CHANGES list for __main__.py names C-1 and C-3 only;
        AMD-20260929-1de84f C-8 D-2 ("the row records the instance's ru_maxrss
        and labels the stop 'address-space cap'") and the card's MACHINE
        PROTECTION constraint ("record ru_maxrss on any MemoryError") require
        a row-level record the frozen code did not make. Implemented inside
        _census_instance only (an E-3-allowed function); E-3 passes. Recorded
        here as a deviation from the card's enumeration, not from protocol v2.
    - id: DEV-2
      item: analyze_census.py G3 reading
      text: >-
        G3 now requires both R01 and R01a raw-result G3_pass (see
        analysis_G3_reading_v2). Not in the card's C-4/C-6 list; follows from
        C-2 E-5, which makes R01a the G3 check of the amended build.
    - id: DEV-3
      item: analyze_census.py A3 permutation staircases restricted to usable census instances
      text: >-
        Version 1's code read every census-mode staircase record; the C-4
        exclusion of failed_infrastructure and unmatched_size instances from
        A3 is applied to the H3 permutation-stability tally as well.
    - id: DEV-4
      item: summarize_run.py corrected after R11 execution (post-processing only; no engine or analysis file)
      text: >-
        Its main-panel prime-coincidence listing treated job-crash rows
        (which carry no p) as five curves sharing p = None. Fixed to skip rows
        without p; sha256 247a9ae9ecae48d22cb4d3a1b1df1699d4f997d58ba6a59c549031f66b89374d
        -> 68165e094c51f90c2aafd4e51510f414622b53b2145a0af6c279c32af93f5e68.
        R10's raw-result.json (old version) is unaffected (no p-less rows;
        its coincidence list is empty under both versions). R11's
        raw-result.json is the corrected output; both invocations are in its
        post-processing.json. analyze_census.py is untouched (pin unchanged).
  engineering_record:
