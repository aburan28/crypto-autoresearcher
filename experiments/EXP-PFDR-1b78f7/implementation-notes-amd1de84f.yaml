    recorded_before: R10 (RUN-PFDR-1b78f7-census-m3), which had not been launched when this pin was written
    exercised_before_R15_on: >-
      Synthetic fixtures only: every row, staircase record, regression report,
      raw-result and Stage 0 fits file of the fixture was generated from
      random.Random(12345) by a scratch generator
      (scratchpad/f90fed/fixture/make_fixture.py, outside the repository;
      no solver ran, no panel row, no archived run file and no Stage 0 file
      was read). Planted cases: unmatched_size at (m 5, 14 bits, curve 4,
      subgroup, |F| = 1) with a C-3 failed_infrastructure census row, a
      watchdog failed_infrastructure random arm, a censored structured arm,
      and a Stage R directory. The script ran to completion on the full
      synthetic panel and on --stage-r, and each planted case appeared in
      excluded_instances, incomplete_cells, A4 excluded_instances and
      A6 excluded_instances as specified.
    later_edits: none

  # ---------------------------------------------------------------------------
  contract_map:
    C-1:
      resolves: AMB-1
      files_and_functions:
        - "src/crypto_autoresearcher/index_calculus/curve.py: generate_prime_order_curve_j0(bits, seed=0, p_filter=None, max_prime_draws=100_000, *, exclude_primes=(), generation_log=None) -- the C-1 `algorithm` verbatim: cumulative draw counter over the whole prime selection with the stated ValueError text; (a) frozen draw on the same rng; (b) duplicate_prime skip; (c) no_prime_order_twist skip via the helper (no draw of rng); (d) the frozen b-loop unchanged; generation_log receives {p, reason} per skipped prime in draw order and finally {prime_draws, p, b}"
        - "src/crypto_autoresearcher/index_calculus/curve.py: _j0_has_prime_order_twist(p, bits, seed) (new) -- g = primitive_root(p); trng = _seeded_rng('crypto_autoresearcher.index_calculus.curve.j0.twistcheck', bits, seed, p); i = 0..5 in order, E = Curve(p, 0, g^i), one point from trng, the frozen certification (one BSGS hit, m != p, m > 4 isqrt(p) + 4, m prime)"
        - "src/crypto_autoresearcher/index_calculus/__main__.py: _j0_exclude_primes(bits, curve_seed, p_filter) (new helper, called only from _instance_j0) -- exclusion_set_rule: primes selected by the amended generator for c' = 0..c-1 at the same bits and filter, in that order, recomputed from c' = 0 in every job"
        - "src/crypto_autoresearcher/index_calculus/__main__.py: _instance_j0(bits, curve_seed, target_seed=0, p_filter=None, generation_log=None) -- passes exclude_primes and generation_log; target log unchanged (C-5)"
        - "src/crypto_autoresearcher/index_calculus/__main__.py: _census_job -- the j0 branch passes a fresh generation log and merges j0_generation into the curve fields, so every j0-panel row (census, on, rho and a G6 lambda-failure row) carries exactly one new key, j0_generation"
      generate_prime_order_curve: not modified (E-2)
    C-2:
      files: experiments/EXP-PFDR-1b78f7/amd-1de84f/function_diff.py (no engine import; frozen bytes by `git show 1a037688c:<path>`), source.diff, function-diff.json
      result: E-1, E-2, E-3, E-4 pass (function-diff.json all_pass true); E-5 = R01a completed_valid
      e4_instrument_control: the same graph from cmd_census reaches all six changed or added units, so the empty sweep intersection is not vacuous
    C-3:
      file: src/crypto_autoresearcher/index_calculus/__main__.py
      function: _census_instance
      rule: >-
        After the unchanged gate check (G4/G5/G6/G7 failure -> invalid, stops
        the run), an instance with not ok, harvest.terminated_by ==
        "attempt_limit" and ic.k None is failed_infrastructure with
        status_reason "attempt_limit_without_k (AMD-20260929-1de84f C-3)" and
        stop_run False; the row keeps every solver column and the harvest
        block. Every other invalid case is unchanged. _census_job's later
        formal-rank gate check still turns such a row invalid on failure.
        known_log with random_sub_r0 not completed_valid stays
        failed_infrastructure (cap unavailable), unchanged (C-8 D-7).
    C-4:
      file: experiments/EXP-PFDR-1b78f7/analyze_census.py
      functions:
        - "unmatched_size(idx, m, bits, j, A) (new): structured arm A's fb_size vs its matched random arms' fb_size (either mode), whatever the statuses"
        - "kappa_cell: a curve with unmatched_size is dropped for A and R(A) (rule unmatched_size); every curves_dropped entry now carries a rule (missing | failed_infrastructure | invalid | censored | unmatched_size)"
        - "analyze: UM set of unmatched (m, bits, curve, arm); excluded from A3 (per-instance rho and the H3 permutation staircases, which now also require a usable census row), A4 (medians and exponent fits; every group's fit record carries fit_uses and excluded_instances with reasons) and A7 (counted as excluded_unmatched_size)"
        - "A6: failed_infrastructure (and invalid) random-arm instances excluded as before and now listed per (class, m) as excluded_instances"
        - "analysis.json: excluded_instances (one entry per excluded (panel, bits, curve, m, arm, mode) with status, status_reason, rule, rules, excluded_from), incomplete_cells (every A1 cell with fewer than five curves, curves used, kept and dropped), unmatched_size_instances"
        - "raw-result.json: excluded_instances_count, excluded_instances_by_rule, incomplete_cells_count, unmatched_size_instances"
    C-5:
      text: target log k = Random(f"target|{bits}|{c}|0").randrange(1, N), Q = k P -- as implemented in _instance_j0 before this task; unchanged
    C-6:
      file: experiments/EXP-PFDR-1b78f7/analyze_census.py
      implementation: >-
        harvest.py (byte-unchanged) already computes poisson_mean as
        C(E'_t,2)*2/N, E'_t*|F|*2/N and C(X'_s,2)*2/N (at_A_fix and at_stop).
        A6 reads mu from the harvest block (unchanged); analysis.json gains
        A6_poisson_mean_source (the C-6 text) and a conformance check that
        recomputes every mu A6 uses from the block's own counts
        (table.formally_distinct_tails, fb_size, SS at_A_fix
        formally_distinct_encodings, N) and reports mismatches.
    C-7:
      implementation: analysis_pin_C7 above; analyze_census.py writes analysis_script_sha256 (its own sha256) into analysis.json and raw-result.json
    C-8:
      D-2_implementation: >-
        _census_instance: a MemoryError is failed_infrastructure with
        status_reason prefixed "address-space cap:" and the row gains
        ru_maxrss_bytes (the worker's ru_maxrss at the stop). Required by
        D-2 and by the card's MACHINE PROTECTION constraint ("record
        ru_maxrss on any MemoryError"); a watchdog expiry is unchanged.
      D-1_D-4: the census commands pass no --instance-watchdog, so the 7200 s default is in force for R10-R14 (recorded in each manifest)

