    - id: AMB-2
      blocks: one main-panel cell of R12 (m = 5); recorded now so one amendment round can cover it
      contract_text: >-
        cells.main_panel.sizes: size0 = default_fb_size(N, m); F_sub =
        FactorBase.subgroup(E, size0, c); s_sub = max(4, len(F_sub)); the
        subgroup arm uses F_sub.
      defect: >-
        At (14 bits, curve 4, m = 5) the subgroup base has |F_sub| = 1 (every
        other arm gets s_sub = 4). No-solver diagnostic over all main-panel
        cells (c = 0..4, m = 3..5, 12..32 bits; curves 5..9 built as well):
        this is the only arm below 4 points, dickson d == subgroup d in every
        cell, and every curve and base builds and terminates. With a 1-point
        base at m = 5 a target decomposes only if it lies in {+-F, +-3F, +-5F},
        so census mode cannot reach k before the solver's 50N attempt limit.
        Meanwhile the SS store grows by 4 encodings per attempt at N ~ 2^14,
        so the per-instance watchdog (7200 s) would likely end it first. As
        implemented (frozen code), an instance that stops at attempt_limit
        without k is classified `invalid`, and that stops the census run
        (census code, _census_instance). The contract does not classify this
        case. The executor did not change frozen code.
      options_for_the_coordinator_not_decisions:
        - "Classify an attempt_limit stop without k as failed_infrastructure / resource_exhaustion (A1 then drops that curve at that rung for the subgroup cell), which requires an __main__.py change and a new R01 attempt."
        - "Amend the cell (e.g. a size floor for the subgroup arm)."
