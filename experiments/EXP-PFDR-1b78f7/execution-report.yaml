  ambiguities:
    - id: AMB-1
      blocks: R14 (j0 panel), hence PC-2, G6 on j0 curves, and every R15 reading that needs PC-2
      contract_text: >-
        IC-2: generate_prime_order_curve_j0 -- prime drawn as in
        generate_prime_order_curve but also requiring p % 3 == 1; then repeat
        b = rng.randrange(1, p), E = Curve(p, 0, b), P = E.random_point(rng),
        with exactly the existing order certification and rejections. cells.j0_panel:
        generate_prime_order_curve_j0(bits, c, p_filter=j0_filter), c = 0..4, bits 12..24.
      defect: >-
        For a fixed p = 1 mod 3 every curve y^2 = x^3 + b is isomorphic to one
        of the six sextic twists y^2 = x^3 + g^i (i = 0..5), so the b-loop
        only ever meets six group orders. Two of the six are divisible by 2
        and two more by 3 on every one of the 35 primes examined. When neither remaining twist has
        prime order, the loop as written never terminates. The contract gives
        no rule for that case (redraw p? which stream?). Implemented exactly as
        written, R14 hangs. Observed: a scratch
        crash-test of the j0 CLI at 12-16 bits ran 27 minutes on four workers
        with only (16, curve 2) finishing, and was stopped. Nothing was
        implemented around it.
      diagnostic: >-
        For each j0-panel cell, the prime the frozen generator draws (first
        prime of its rng stream passing p % 3 == 1 and j0_filter) and the
        orders of its six twists, each computed by BSGS on independent random
        points until unique. No solver code ran. 22 of 35 cells have no
        prime-order twist, so the frozen generator never returns for them.
        13 cells terminate.
      cells:
