  changes:
    - id: C-1
      resolves: AMB-1
      field: implementation_contract.IC-2_curve (generate_prime_order_curve_j0) and cells.j0_panel.curves
      summary: >-
        Change the PRIME, never the b-loop: a drawn prime is skipped, and the
        SAME rng stream continues to the next prime, when (i) it is the prime
        already selected for a lower-index j0 curve at the same bits, or (ii)
        none of its six sextic twists has certified prime order. The b-loop
        runs exactly as frozen on the first prime that survives, and on that
        prime it terminates with probability 1.
      signature: >-
        generate_prime_order_curve_j0(bits, seed=0, p_filter=None,
        max_prime_draws=100_000, *, exclude_primes=(), generation_log=None).
        The two new keyword-only arguments default to the frozen behaviour's
        inputs (no exclusion, no log). generate_prime_order_curve (a != 0) is
        not modified.
      algorithm: |
        if bits < 8: raise ValueError("bits must be >= 8")                      # unchanged
        rng = _seeded_rng("crypto_autoresearcher.index_calculus.curve.j0", bits, seed)   # unchanged label
        draws = 0
        while True:                                   # prime selection
            # (a) draw exactly as frozen, from the same rng
            while True:
                if draws == max_prime_draws:
                    raise ValueError(f"no {bits}-bit prime p = 1 mod 3 passed the filter "
                                     f"and the j0 prime rule in {max_prime_draws} draws")
                draws += 1
                p = next_prime(rng.randrange(1 << (bits - 1), 1 << bits) | 1)
                if p.bit_length() == bits and p % 3 == 1 and (p_filter is None or p_filter(p)):
                    break
            # (b) distinctness within the rung
            if p in exclude_primes:
                log(p, "duplicate_prime"); continue
            # (c) prime-order twist existence, exact; consumes NO draw of rng
            if not _j0_has_prime_order_twist(p, bits, seed):
                log(p, "no_prime_order_twist"); continue
            break
        # (d) the frozen b-loop, unchanged, continuing the same rng
        while True:
            b = rng.randrange(1, p)
            E = Curve(p, 0, b)
            P = E.random_point(rng)
            hits = E.point_order_in_hasse(P)
            if len(hits) != 1: continue
            m = hits[0]
            if m == p or m <= 4 * math.isqrt(p) + 4 or not is_probable_prime(m): continue
            E.order = m; E.ops.group_ops = 0
            return E, P

        def _j0_has_prime_order_twist(p, bits, seed):     # new helper in curve.py
            g = primitive_root(p)                          # curve.primitive_root, unchanged
            trng = _seeded_rng("crypto_autoresearcher.index_calculus.curve.j0.twistcheck", bits, seed, p)
            for i in range(6):                             # i = 0..5 in this order
                E = Curve(p, 0, pow(g, i, p))
                P = E.random_point(trng)
                hits = E.point_order_in_hasse(P)
                if len(hits) == 1:
                    m = hits[0]
                    if m != p and m > 4 * math.isqrt(p) + 4 and is_probable_prime(m):
                        return True
            return False
      generation_log: >-
        When generation_log is a list, append one dict per skipped prime,
        {p, reason} with reason in {duplicate_prime, no_prime_order_twist},
        in draw order, and finally {prime_draws: draws, p, b}.
      exclusion_set_rule: >-
        cells.j0_panel: for curve seed c at a given bits, exclude_primes = the
        set of primes SELECTED by this amended generator for curve seeds
        0, 1, ..., c-1 at the same bits and the same j0_filter, computed in
        that order (curve 0 has an empty set). Every job recomputes the set
        from c' = 0 regardless of --curve-offset or worker count, so the curve
        is a deterministic function of (bits, c, filter). The main panel's
        generator is NOT amended; main-panel prime coincidences, if any, are
        reported in the execution report and changed by nothing.
      exactness_note: >-
        Why (c) is exact rather than probabilistic. p = 1 (mod 3) and p odd,
        so 6 | p - 1 and the classes b*(F_p^*)^6 are represented by g^0..g^5;
        y^2 = x^3 + b and y^2 = x^3 + b*u^6 are F_p-isomorphic (x -> u^2 x,
        y -> u^3 y), so the b-loop meets exactly these six group orders. The
        frozen acceptance test on ANY finite point P decides "#E is prime,
        != p": on a prime-order curve the only multiple of ord(P) = N in the
        Hasse interval is N (2N lies above it), so there is exactly one hit and
        it is N; on a composite-order curve #E is among the hits, so a unique
        hit equals #E and is rejected as composite. is_probable_prime is
        deterministic Miller-Rabin below 3.3e24. Hence (c) returns True iff the
        frozen b-loop terminates on p, and when it does each b-draw hits an
        accepted class with probability >= 1/6.
      preserved: >-
        The panel's scientific role is unchanged: every j0 curve is still
        y^2 = x^3 + b over a bits-bit prime p = 1 (mod 3) passing j0_filter,
        of certified prime order, with the order-3 automorphism, a 3 | d coset
        base (F_coset) and three matched random bases of |F| = s on the same
        curve, target stream label census, A_fix = s, and rho on the same five
        curves. PC-2 (A5), G6 and the matched-random comparison are computed
        exactly as version 1 defines them on 35 (rung, curve) units. Relative
        to the frozen generator, a cell whose first accepted prime is neither
        excluded nor twist-free returns the identical curve (the twist check
        uses its own rng); the executor's diagnostic lists 13 such cells, but
        a lower-index cell's new prime could exclude one of them, so no count
        of unchanged cells is promised.
      required_tests: >-
        Added to tests/test_index_calculus_harvest.py (existing tests are not
        edited unless the amended generator changes their expected values, in
        which case each change is listed in implementation-notes-amd1de84f):
        (T1) for every prime selected or skipped at 12 bits in the j0 panel,
        _j0_has_prime_order_twist agrees with an independent exhaustive point
        count of all six twists (Legendre-symbol sum, no BSGS); (T2) the
        amended generator terminates for all 35 j0 cells (bits 12..24 step 2,
        c = 0..4, j0_filter, exclusion rule) and returns a == 0, p % 3 == 1,
        p passing j0_filter, certified prime order, and five distinct primes
        per rung; (T3) wherever the first accepted prime is neither excluded
        nor twist-free, the output equals an inline copy of the frozen
        algorithm; (T4) the existing j0 lambda / formal-basis test passes.

    - id: C-2
      resolves: the re-run question (execution report remaining_work item 2)
      field: runs (R01-R09 validity on the amended build) and budget.maximum_runs
      ruling: >-
        R02-R09 are NOT re-executed, provided the BUILD-EQUIVALENCE
        CERTIFICATE below passes. R01 IS re-executed on the amended build as a
        new run, R01a. If any certificate condition fails, R02-R09 are
        re-executed as R02a-R09a (same commands, new run ids, same gates G1
        and G2) and must pass before R10 starts; a failure there follows
        version 1's stopping rule (stop, R17 attribution, return).
      build_equivalence_certificate:
        script: experiments/EXP-PFDR-1b78f7/amd-1de84f/function_diff.py (written by the executor; no solver import)
        outputs:
          - experiments/EXP-PFDR-1b78f7/amd-1de84f/source.diff (unified diff, frozen vs amended, every file below)
          - experiments/EXP-PFDR-1b78f7/amd-1de84f/function-diff.json
        frozen_reference: >-
          The bytes of each file at commit 1a037688c (the TASK-20260928-f15632
          archive), whose sha256 must equal implementation-notes.yaml
          frozen_source_sha256; read with `git show 1a037688c:<path>`.
        conditions:
          - >-
            E-1: factor_base.py, tails.py, decompose.py, solver.py and harvest.py
            are byte-identical to their frozen sha256; every
            engine_files_unchanged_byte_for_byte file, __init__.py and every
            results/ file is byte-identical to the implementation-notes
            byte_unchanged_files sha256.
          - >-
            E-2: in curve.py, an ast.dump comparison per top-level function,
            class and method, and of the ordered list of module-level
            statements that are not function or class definitions, shows
            changes ONLY in generate_prime_order_curve_j0 and ADDITIONS only of
