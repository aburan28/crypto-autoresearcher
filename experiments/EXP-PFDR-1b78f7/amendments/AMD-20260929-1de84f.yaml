    - id: C-8
      field: execution-report protocol_deviations and implementation-notes deviations
      accepted_deviations:
        - id: D-1
          item: per-instance watchdog not enforceable inside the frozen `sweep` subcommand (R02-R09)
          ruling: >-
            Accepted. It is hang protection, not a scientific control; R02-R09
            ran under the per-run watchdog and the per-process address-space
            cap, and the longest instance was 692 s. For R10-R14 the census
            subcommand's --instance-watchdog default (7200 s) binds and must be
            in force; the manifests record it.
        - id: D-2
          item: per-process RSS cap enforced as RLIMIT_AS = 3.5e9 bytes on every worker
          ruling: >-
            Accepted as a stricter proxy (address space >= RSS). A MemoryError
            under it is failed_infrastructure; the row records the instance's
            ru_maxrss and labels the stop "address-space cap", so an AS stop
            with RSS below 3.5 GB is visible as such. No such instance is
            re-run with other parameters without a Coordinator decision.
        - id: D-3
          item: extra census-row keys (status, status_reason, k_found, k_verified, checks; m carried in method)
          ruling: Accepted (additive). R15 reads the version-1 keys by their names; the harvest block keys are exactly harvest_block's.
        - id: D-4
          item: census options --instance-watchdog and --quiet
          ruling: Accepted; the frozen commands pass neither, so the defaults apply.
        - id: D-5
          item: j0 target-log rule
          ruling: Ratified as protocol text by C-5.
        - id: D-6
          item: poisson_mean formula source
          ruling: Ratified as protocol text by C-6.
        - id: D-7
          item: known_log with an unavailable cap (random_sub_r0 census instance not completed) recorded failed_infrastructure
          ruling: Accepted; consistent with C-3. It is never run uncapped.
        - id: D-8
          item: IC-4 recorder informed at scan level (_level2, _walk_candidates, _level3, _decompose) rather than inside _m2_at/_tail_at
          ruling: >-
            Accepted. The recorded set is the charged range IC-4 defines; the
            G5 identity is exact per instance and unit-tested, and fails an
            instance if it drifts.
        - id: D-9
          item: harvest wall time inside the solver's seconds fields, also reported as harvest_seconds
          ruling: Accepted. No count includes it; timing is advisory and not decision-bearing.
        - id: D-10
          item: worker_maxrss_bytes is the worker's lifetime high-water mark
          ruling: Accepted; A9 must label it "worker lifetime RSS high-water mark, not per instance".
        - id: D-11
          item: SS-store layout (sorted runs, log-structured merge; peak_bytes analytic = entries x 12)
          ruling: Accepted; IC-5 allows any merge schedule, and peak_bytes is labelled analytic.
        - id: D-12
          item: spec commands name python3; runs used the task venv interpreter (Python 3.11.15, numpy 2.4.6)
