    - id: C-3
      resolves: AMB-2 (classification)
      field: implementation_contract.IC-7_cli (census instance status) and stopping_rules
      rule: >-
        In every census panel (main, j0), every arm and both modes: an
        instance whose solve returns normally with no gate failure, with
        harvest.terminated_by == "attempt_limit" and k not determined, is
        status failed_infrastructure with status_reason
        "attempt_limit_without_k (AMD-20260929-1de84f C-3)". The run continues
        with the next instance. The row keeps every solver column and the full
        harvest block (G4 and G5 are still evaluated on it and still
        invalidate on failure). An instance that returns a k failing kP = Q,
        or that fails any of G4-G7, stays `invalid` and stops the run as
        version 1 says. The known_log arm's attempt_cap stop is unchanged
        (ok). This rule applies to ANY such instance, not only
        (14, curve 4, m = 5).
      not_evidence: >-
        An attempt-limit stop, a watchdog expiry and an RSS or address-space
        cap hit are infrastructure or feasibility signals. None is ever
        negative evidence about any base, class or m (AGENTS.md core rule 5).
      known_log_consequence: >-
        If random_sub_r0's census instance ends failed_infrastructure under
        this rule, known_log in that job is failed_infrastructure (cap
        unavailable), as implemented and accepted in C-8 D-7.

    - id: C-4
      resolves: AMB-2 (analysis treatment)
      field: analysis.A1_kappa, A3_informative_rank, A4_harvest_gain, A6_poisson, A7_floor
      rule: >-
        UNMATCHED-SIZE EXCLUSION. For structured arm A in {subgroup, dickson,
        small_x} on curve j at a rung and m: if len(base of A) differs from
        the size of its matched random arms (s_sub for subgroup and small_x,
        s_dick for dickson), curve j is dropped for A AND R(A) in that A1
        cell, whatever the instance statuses, and listed with reason
        unmatched_size. The same instance is excluded from A3 qualification,
        from A4 medians and exponent fits, and from A7. This can occur only
        where the max(4, .) floor of cells.main_panel.sizes applies; the
        executor's no-solver diagnostic found exactly one such arm, subgroup
        at (14, curve 4, m = 5), where |F_sub| = 1 and s_sub = 4. The rule is
        general and applies to any cell where it holds.
      failed_instance_treatment: >-
        failed_infrastructure instances (C-3, watchdog, memory) are treated
        exactly as A1 treats `failed` (the curve is dropped for all four arms
        of that cell and listed); they are excluded from A3, A4 (which already
        requires both modes solved and verified), A6 (random-arm KS inputs;
        listed) and A7. A dropped curve never enters a count, a band or a fit.
      reporting: >-
        R15 analysis.json carries excluded_instances: one entry per excluded
        (bits, curve, m, arm, mode) with its status, status_reason and the
        rule (unmatched_size | failed_infrastructure | censored | invalid) and
        the analyses it was excluded from; and incomplete_cells: every A1 cell
        with fewer than five curves, with the count used. A4's subgroup m = 5
        exponent fit states that it uses the completed instances and lists
        the excluded ones (declared here, before any run, as A4 already does
        for m = 4 at 30-32 bits).
      no_design_change: >-
        The cell itself is NOT amended: the subgroup arm at (14, 4, 5) runs as
        frozen, both modes. A size floor on the subgroup arm was rejected
        because it would change which coset defines the arm at one cell, and
        a skipped instance would be adaptive sampling.

    - id: C-5
      field: cells.j0_panel (target log k)
      ratifies: execution-report deviation "j0 target-log rule"
      text: >-
        On j0 curves the target log is k = random.Random(f"target|{bits}|{c}|0").randrange(1, N),
        with Q = k*P: exactly the main panel's __main__._instance rule (target
        seed 0), as implemented in _instance_j0. Version 1 fixed the curves and
        the target-stream label but not k; this text fixes it. Pre-data: no j0
        census row has been read.

    - id: C-6
      field: harvest_block poisson_mean and analysis.A6_poisson
      ratifies: execution-report deviation "poisson_mean formulas"
      text: >-
        The poisson_mean of every class is the operational form fixed before
        any run in ledger/hypotheses/H-PFDR-4765e4.yaml, HEUR-4765e4-H1
        specification_of_means: mu_TT = C(E'_t, 2) * 2/N; mu_TB = E'_t * |F| *
        2/N; mu_SS = C(X'_s, 2) * 2/N, at A_fix in at_A_fix and at the stop in
        at_stop; E'_t = stored tails minus tail-tail formal duplicates, X'_s =
        encodings minus SS formal duplicates. The reference in that record to
        "EXP-PFDR-1b78f7 analysis.poisson_means" resolves to this text and to
        A6; the formula is unchanged.

    - id: C-7
      field: required_artifacts.per_experiment (analysis pinning)
      text: >-
        analyze_census.py, updated to implement C-3 and C-4 reporting, is
