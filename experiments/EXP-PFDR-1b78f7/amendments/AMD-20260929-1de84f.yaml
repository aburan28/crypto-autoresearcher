            set and their intersection.
          - 'E-5: R01a passes (G3), tests/test_index_calculus_fp.py unedited.'
        why_this_suffices: >-
          G1 and G2 exercise the `sweep` subcommand: curves from
          generate_prime_order_curve, bases from factor_base, and the solver,
          decomposition, tail table and harvest modules. Under E-1..E-4 every
          function those runs executed is byte- or AST-identical on the amended
          build, and I-5 (determinism) makes identical code on identical inputs
          produce identical rows, so G1 and G2 carry over as a derivation, not
          an assumption. The census subcommand that R10-R14 use was never
          exercised by G1 or G2 on either build, so re-running R02-R09 would
          add no check of the changed code; its checks are R01a (G3, including
          census-mode equality and worker determinism) and G4-G7 on every
          panel instance. Machine time was not a reason either way.
      new_runs:
        - id: R01a
          run_id: RUN-PFDR-1b78f7-tests-amd1de84f
          command: python3 -m pytest tests/test_index_calculus_fp.py tests/test_index_calculus_harvest.py -q -p no:cacheprovider --junitxml experiments/EXP-PFDR-1b78f7/runs/RUN-PFDR-1b78f7-tests-amd1de84f/junit.xml
        - id: R02a-R09a
          condition: build-equivalence certificate fails (any of E-1..E-4)
          run_ids: >-
            RUN-PFDR-1b78f7-reg-off-sweep-20260924-amd1de84f,
            RUN-PFDR-1b78f7-reg-off-sweep-mitm-20260926-amd1de84f,
            RUN-PFDR-1b78f7-reg-off-sweep-arity-20260926-amd1de84f,
            RUN-PFDR-1b78f7-reg-off-sweep-minfill-20260926-amd1de84f,
            RUN-PFDR-1b78f7-reg-off-sweep-arity-minfill-20260926-amd1de84f,
            RUN-PFDR-1b78f7-reg-off-sweep-arity67-20260928-amd1de84f,
            RUN-PFDR-1b78f7-reg-census-sweep-minfill-20260926-amd1de84f,
            RUN-PFDR-1b78f7-reg-census-sweep-arity-minfill-20260926-amd1de84f
          command: >-
            Exactly R02-R09's commands with the output directory replaced by
