  reason: >-
    The TW-FLOOR review-breakthrough round (DEC-20261001-709f0d opened it;
    DEC-20261001-494663 composed it; EV-PFDR-d90ccd) found that the frozen
    A7 per-instance predicate proves too much: it fired on 73 harvest-on
    instances, of which 52 are premise violations (35 known_log, 17 j0_coset),
    and the same predicate fires on rho at exactly the generic rate (38 of
    145 against a design expectation of 38.2), on an exactly generic replica
    (2.29% at m = 4, 2.00% at m = 5 under r_frozen; 0 under r_rank) and on
    random arms (1.41% = structured 1.42%) (EV-PFDR-d90ccd OBS-4, OBS-6). The
    lemma bounds an EXPECTATION: at fixed S Markov gives only P(ratio <= t)
    <= t^2 for the stopping count, and for r_frozen (a compound pair count,
    not the stopping count) no per-instance bound follows at all
    (DN-575e80-F6 D2, D4, D5, archived at 92f503cb9). The quantity the lemma
    does bound, the aggregate ratio of sums T, held on every premise-holding
    cell: lowest calibrated 99% lower end 1.373 (EV-PFDR-d90ccd OBS-5). The
    charging conventions are faithful (c = 2, X_cmp <= 2*S_3 on every row;
    OBS-7). So the frozen A7 stays as archived, and the corrected reading is
    added beside it.

  diagnosis_basis: >-
    The derivation note DN-575e80-F6 (red team TASK-20260929-575e80, archived
    at 92f503cb9): D1 non-adaptive linearity of expectation; D2 the Markov
    t^2 tail holds for the STOPPING count only; D4 the stopping-time
    extension; D5 for r_frozen no per-instance bound exists (the measured
    jump-law dispersion of the compound pair count is 2.2-18.6, quoted from
    the red team's report); D6 the aggregate is a ratio of sums, not a mean of
    ratios, and is the quantity the lemma bounds. Checked by the Coordinator
    on D2 and the D5 value (1 - 13*exp(-3) = 0.3528); the rest is one
    reviewer's derivation, and an independent check is commissioned
    (DEC-20261001-494663 NA-4). Tier: derivation, never "proved".

  changes:
    - id: C-1
      name: A7_premise_audit_precondition
      field: analysis.A7_floor reading precondition
      definition: >-
        Before any floor-relative reading of a row, panel or cell, the
        per-arm premise audit is computed and reported: formal_basis_kind,
        formal_basis_rank, and the count and share of formal rows fed. An arm
        is premise-holding iff its formal basis has rank 0 on its rows (random
        and structured arms: formal rank 0 on 1980 of 1980 and 990 of 990
        archived rows). known_log (formal rank B - 1 on 70 of 70) and j0_coset
        (formal rank 2B/3 on 70 of 70) are POSITIVE CONTROLS, never test rows.
        j0_random is neither: formal rank > 0 on 12 of 210 rows with 0
        formal rows fed and 0 of 105 firing; it is reported per row and
        excluded from premise-holding aggregates unless its own audit says
        otherwise.
      equivalence: none (a new precondition; no frozen field is redefined)
    - id: C-2
      name: A7_aggregate_T_reading
      field: analysis.A7_floor aggregate reading (added beside the frozen text)
      definition: >-
        On premise-holding arms, per (panel, m, mode, arm class) cell, the
        aggregate is the ratio of sums T = (sum_i w_i S_{3,i}^2) / (sum_i
        w_i r_i N_i / 4) with deterministic weights w_i = 1/(N_i B_i) per
        instance i, S_3 the instance's s3_solves, r its relation count, N its
        group order, B its factor-base size. The cell passes iff T >= 1.
        Interval: 99% curve-bootstrap over the cell's curves, calibrated at
        five curves per rung with at least 20000 replicates (the round's
        calibration showed coverage 0.946-0.984 at nominal 99%, so the 99%
        interval is the calibrated one; MC s.d. of the 99% lower ends
        <= 0.0011). A violation is T below 1 beyond its interval.
      equivalence: >-
        Not equivalent to the frozen per-instance ratio; it is added beside
        it. For already-archived cells the round's measured values are the
        reference: r_frozen T 1.511 (random m3), 1.479 (structured m3), 1.477
        (random m4), 1.451 (structured m4, 99% [1.373, 1.531]), 2.073 (random
        m5), 2.121 (structured m5), 1.452 (j0_random); r_rank T 2.43-9.20
        (EV-PFDR-d90ccd OBS-5).
    - id: C-3
      name: A7_dual_r_reporting
      field: analysis.A7_floor r convention
      definition: >-
        Every floor-relative reading reports BOTH conventions: r_frozen
        (relations + harvested rows fed before the stop; the lemma's step-ii
        pair count, compound and overdispersed) and r_rank (independent
        relations the solver rank actually consumed; the lemma's step-iii
        count). Under r_rank the 21 generic firing rows lie at 1.72-2.97 and
        j0_coset at >= 1.11; under r_frozen they fired (EV-PFDR-d90ccd OBS-3).
        A reading stated under one convention names it; no convention is
        silently substituted for the other.
      equivalence: none (a reporting rule over both existing conventions)
    - id: C-4
      name: A7_no_per-instance_predicate_without_generic_null
      field: analysis.A7_floor per-instance predicate scope
      definition: >-
        The frozen predicate "any value < 0.9 fires TW-FLOOR" remains AS
        ARCHIVED (its firing history is never recomputed), and NO NEW
        per-instance floor predicate is adopted under version 4 except one
        calibrated on a null built from an EXACTLY GENERIC engine at the
        instance's own count structure (the PTM-5 replica technique: an
        exactly generic replica over Z_N matched in N, B and attempt budget;
        under such a null the replica's own firing rate at 12..24 bits is the
        calibration). Proves-too-much retest: any new predicate is first run
        against PTM-1..PTM-5 (rho at r = 1; the harvest-off sweep rows; the
        known_log and j0 positive controls; random arms; the exactly generic
        replica), and a predicate that fires on any of them at its design rate
        is rejected as a test, exactly as the round did for the frozen form.
      equivalence: >-
        The frozen TW-FLOOR tripwire text in specification.yaml stays
        unchanged for future runs of this experiment; this change governs
        READINGS ONLY, and any future specification edit is a separate
        pre-data amendment.
    - id: C-5
      name: withheld_floor_relative_readings_gate
      field: composition gate for EV-PFDR-1faf10
      definition: >-
        The floor-relative readings withheld from EV-PFDR-1faf10 (and any
        floor-relative comparison withheld elsewhere, e.g. H-PFDR-2765d2
        time_exponent and EXP-PFDR-011cd0 dominated_by) are composed only
        under protocol version 4 with this amendment archived, per
        DEC-20261001-3fbaff NA-4. Their composition is a separate Coordinator
        act citing this amendment.
      equivalence: none (a gate on later composition acts; no evidence record
        is edited)

