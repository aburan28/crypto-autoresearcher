# EXP-ICPERF-b2f2d0 — stage-0 instrument for H-ICPERF-5adc9b.
# Frozen under DEC-20261017-f2d04c. No run, outcome, or conclusion is in this file.
experiment:
  id: EXP-ICPERF-b2f2d0
  hypothesis_id: H-ICPERF-5adc9b
  source_idea: IDEA-20261015-b41f68
  question_id: RQ-ICPERF-94c86e
  goal_id: GOAL-ICPERF-e6b6a4
  version: 1
  title: >-
    Stage-0 instrument: 64 geometric draws at p = 1/50 with seed 20261017
  status: approved
  frozen: true
  designed_at: '2026-10-17'
  approved_by: DEC-20261017-f2d04c
  execution_authorized: true
  objective: >-
    Draw 64 independent geometric counts with success probability 1/50 from
    the frozen xorshift32 sampler at seed 20261017. Record the sample sum,
    the sum of squares, the median, and whether the coefficient of variation
    and the median-to-mean ratio sit in the preregistered bands. Do not time
    a pointer chase and do not read a host receipt.
  inputs:
    seed: 20261017
    p_den: 50
    n_targets: 64
    cv_band: [0.9, 1.1]
    median_ratio_band: [0.6, 0.8]
    runner: experiments/EXP-ICPERF-b2f2d0/implementation/run.py
  controls:
    - >-
      The coefficient of variation is compared with the population value
      sqrt(1 - 1/50) through the integer band [0.81, 1.21] on its square.
    - >-
      The median-to-mean ratio is compared with ln(2), through the integer
      band [0.6, 0.8].
  independent_variables:
    - none; the cell is one frozen seed
  metrics:
    primary:
      - sample_sum
      - sum_squares
      - median
      - cv_in_band
      - median_ratio_in_band
    secondary:
      - elapsed_seconds
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The sample sum is 2943, the sum of squares is 289567, and the median
      is 28. The coefficient-of-variation square and the median-to-mean
      ratio both sit in their bands.
    formula: >-
      Draws use xorshift32 from seed 20261017 and stop when the state is
      divisible by 50. CV squared equals
      (64 * 289567 - 2943^2) / 2943^2, which is inside [81/100, 121/100].
      The median-to-mean ratio is 28 * 64 / 2943, inside [3/5, 4/5].
    source: >-
      The integers were evaluated by experiments/EXP-ICPERF-b2f2d0/implementation/run.py
      in a design-time directory before this contract was frozen. They are
      not a host measurement.
  scale_relevance:
    tier: toy
    justification: >-
      Sixty-four draws at mean 50. No transfer to an 8 GiB table, to n=83,
      or to a cross-host latency ratio.
    correspondence: null
  tail_checks: []
  replication:
    seeds: [20261017]
    independent_instances: 1
    seed_policy: >-
      The single seed is 20261017. No other seed is drawn.
  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    wall_clock_seconds_per_run: 60
  stopping_rules:
    - Stop after the single preregistered sample. Do not open another seed in this version.
  invalidation_rules:
    - >-
      A crash, timeout, or a split between the two central order statistics
      invalidates the instrument run. It is not evidence about host latency.
    - >-
      Changing the seed, the success denominator, or the sample size after
      this freeze requires an amendment. It is not a rerun of version 1.
  success_criterion: >-
    The run records sample_sum 2943, sum_squares 289567, median 28,
    cv_in_band true, and median_ratio_in_band true.
  falsification_criterion: >-
    The run records a complete sample in which sample_sum is not 2943, or
    sum_squares is not 289567, or median is not 28, or cv_in_band is false,
    or median_ratio_in_band is false. That result invalidates the instrument
    cell and does not decide the host-latency claim of IDEA-20261015-b41f68.
  decision_impact:
    on_positive: >-
      The sampler reproduced the frozen geometric sample and both bands
      hold on it. A later amendment may bind real probe panels. This pass
      does not show that n=83 probe counts are geometric, and it does not
      close IDEA-20261015-b41f68.
    on_negative: >-
      The sampler failed the frozen sample. Do not schedule a pointer-chase
      from this runner. Repair the instrument by amendment. Do not read the
      failure as evidence that host latency is independent of the online ratio.
  required_artifacts:
    - experiments/EXP-ICPERF-b2f2d0/runs/RUN-ICPERF-b09be8/manifest.yaml
    - experiments/EXP-ICPERF-b2f2d0/runs/RUN-ICPERF-b09be8/raw-result.json
    - experiments/EXP-ICPERF-b2f2d0/runs/RUN-ICPERF-b09be8/RESULTS.md
  assigned_to: executor
  scope_note: >-
    Version 1 is the seeded geometric sample only. Pointer-chase latency,
    huge pages, and cross-host ratios remain proposed.
