experiment:
  id: EXP-ICEX-432a29
  hypothesis_id: H-ICEX-b6124c
  derived_from_idea: IDEA-20260818-ffeddf
  question_id: RQ-CLGRP-66ab7f
  batch_id: BATCH-a70dc3
  version: 1
  title: >-
    Fix the closed-form balance optimum beta = 1/(2 sqrt(omega-1)) by symbolic
    fixture, then measure the (log time, log memory) trace of class-group index
    calculus over a five-point beta sweep against four separated forced values of
    the memory-to-time exponent ratio - with a repaired 1024-bit c(W) grid whose
    spread is 35.9 bits instead of the declared grid's 6.37, and with the
    memory-bounded crossover DECLARED UNDERPOWERED because no bound in the
    declared range binds at the crossover discriminant
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. Deployed discriminant sizes for class-group hidden-order
    groups are justified by a TIME complexity with no memory figure beside it.
    Whether the same balance that fixes the time constant also forces an
    exponentially large memory footprint, and by how much a memory bound degrades
    the achievable time constant, is a computable and partly measurable question
    that no cost model in this corpus contains.

    (B) WHAT IS FORCED BY ARITHMETIC AND IS THEREFORE A GATE, NOT A RESULT.
    Minimising max(beta + 1/(4 beta), omega beta) over beta gives the closed form
    beta_opt = 1/(2 sqrt(omega - 1)) and c = omega/(2 sqrt(omega - 1)), derived in
    H-ICEX-b6124c. To six decimals- (2, 0.500000, 1.000000),
    (2.376, 0.426246, 1.012761), (3, 0.353553, 1.060660), and 1.060660 is
    3/sqrt(8) exactly. The memory-to-time exponent ratio is 1/omega for sparse
    storage and 2/omega for dense.

    (C) THE SOURCE IDEA'S PREDICTION BAND OMITS TWO FORCED VALUES AND IS
    REPAIRED. It lists 0.333 plus or minus 0.05 and 0.5 plus or minus 0.05 only.
    The dense-storage values 0.6667 and 1.0000 are equally forced, and a
    dense-storage run landing on one of them would be misread as evidence that the
    two-leg model is inadequate. The band is repaired to four values keyed by the
    RECORDED storage format, separated by at least 0.1667 so the plus-or-minus
    0.05 windows do not overlap.

    (D) THE 1024-BIT c(W) GRID IS DEGENERATE AND ITS HEADLINE IS WRONG, BOTH
    COMPUTED BEFORE ANY RUN. At 1024 bits, d = 709.783, ln d = 6.5650,
    sqrt(d ln d) = 68.262, and the unconstrained optimum needs
    W_opt = 2^34.83 words. The declared grid is W in {2^30, 2^35, 2^40, 2^45,
    2^50}, so 2^40, 2^45 and 2^50 leave the constraint slack and return
    c(infinity) EXACTLY; only 2^30 binds and 2^35 is marginal. At W = 2^30,
    beta_W = 0.30462 and c(W) = 1.12532, an excess of 0.06466 over 1.060660, i.e.
    6.37 bits - AGAINST THE SOURCE IDEA'S CLAIMED 'at least 0.35 ... i.e. at
    least 24 bits', an overstatement by a factor of about 3.8 that also sits only
    1.4 bits above its own 5-bit falsification line. The 0.35 figure is correct at
    2048 BITS, where sqrt(d ln d) = 101.505, W_opt = 2^51.78 and W = 2^30 gives
    beta_W = 0.20486, c(W) = 1.42522, an excess of 0.36456 or 53.4 bits. THE
    REPAIR IS A COMPUTED REPLACEMENT GRID- at 1024 bits use W in {2^20, 2^24,
    2^28, 2^31, 2^34} words, whose excesses are 36.77, 20.57, 10.14, 4.76 and 0.86
    bits, a spread of 35.9 bits. At 2048 bits the declared grid is kept and gives
    53.39, 32.85, 18.71, 8.82 and 1.91 bits, a spread of 51.5 bits.

    (E) THE MEMORY-BOUNDED CROSSOVER IS DECLARED UNDERPOWERED, BY ALGEBRA. The
    crossover with the generic |D|^{1/4} family solves d/4 = c sqrt(d ln d), i.e.
    d/ln d = 16 c^2, giving d = 78.5 and |D| = 2^{113.3} at c = 3/sqrt(8), and
    d = 163.0 and |D| = 2^{235.2} at c = sqrt(2). At those discriminants the
    index-calculus optimal memory is exp(0.353553 sqrt(d ln d)), which is 694 and
    26570 words - 2^9.4 and 2^14.7. NO BOUND IN {2^30 .. 2^50} WORDS BINDS THERE,
    so the crossover moves by EXACTLY ZERO bits and the source's 'at least 30 bits
    between W = 2^{50} and W = 2^{30}' cannot fire. A 2^30-word bound first binds
    at sqrt(d ln d) = 58.81, i.e. |D| about 2^{790.6}, which is unreachable for a
    certified class-group computation. The claim is therefore reported
    UNDERPOWERED WITH ITS REQUIRED CONDITION rather than shrunk, and the tested
    replacement parameterises W as a FRACTION f of W_opt(d), which binds by
    construction.

    (F) THE LINEAR-ALGEBRA TIME-FRACTION BAND IS REPLACED BY ONE THE MODEL
    ACTUALLY FORCES. The two-leg model equalises the legs' EXPONENTS and says
    nothing about their constant ratio, so [0.35, 0.65] is an assumption, not a
    prediction. The replacement statistic is that over the beta sweep the beta
    minimising total time must coincide, within one sweep point, with the beta at
    which the linear-algebra time fraction crosses 0.5 - which is forced under a
    two-leg model and need not hold under a model with a third cost.
  inputs:
    cost_unit: >-
      TIME- the exponent coefficient of sqrt(d ln d), dimensionless, plus WALL
      CLOCK in SECONDS as the measured quantity from which it is fitted. MEMORY-
      WORDS as the model unit and PEAK RESIDENT BYTES as the measured quantity,
      with the word size recorded. The MEMORY-TO-TIME RATIO IS A RATIO OF TWO
      DIMENSIONLESS EXPONENTS, log(peak memory) over log(total time), and both
      sides are logarithms of quantities in their own consistent units; seconds
      are never divided into bytes.
    unit_discipline: >-
      BINDING. Tags in {exponent, seconds, bytes, words, bits, dimensionless,
      count}. A memory bound W is always in WORDS and the word size is recorded.
      A c(W) excess is converted to BITS by multiplying by sqrt(d ln d) and
      dividing by ln 2, and that conversion is written out in every artifact that
      quotes a bit figure.
    storage_format: >-
      RECORDED PER RUN AND NEVER POOLED. Sparse and dense storage differ by a
      factor of two in the memory exponent, so the memory-to-time ratio is
      reported per format and the forced value is selected by the recorded format.
      Pooling formats produces a meaningless fitted ratio and is an invalidation
      condition.
    implementation_identity: >-
      One named, versioned class-group index-calculus implementation, recorded in
      every manifest together with the machine's cache and RAM boundaries. Claims
      are scoped to that implementation and that machine.
    literature_gate: >-
      RQ-CLGRP-66ab7f constrains verbatim- 'No cost claim is recorded before at
      least one primary class group algorithm reference and one hidden-order-group
      construction are filed as KN-LIT entries.' No such entry exists for this
      lane today. Stage A includes filing them and is blocking for every cost
      claim, though not for the zero-compute symbolic fixture.
  controls:
  - >-
    C1 FROZEN SYMBOLIC FIXTURE, ZERO COMPUTE, BLOCKING. Assert that
    argmin over beta of max(beta + 1/(4 beta), omega beta) equals
    1/(2 sqrt(omega-1)) with value omega/(2 sqrt(omega-1)), and assert the literal
    triples (2, 0.500000, 1.000000), (2.376, 0.426246, 1.012761) and
    (3, 0.353553, 1.060660) to six decimal places.
  - >-
    C2 BINDING-CONSTRAINT CHECK, ZERO COMPUTE, BLOCKING FOR EVERY c(W) AND
    CROSSOVER CELL. For each (d, W) assert whether beta_W is below the cap, i.e.
    whether ln W is below beta_opt * sqrt(d ln d). A cell where it is not is
    emitted as NON-BINDING with c(W) equal to c(infinity), and is never counted
    toward a spread.
  - >-
    C3 NEARBY-OBJECT CONTROL, STAGE A, FREE. Apply the identical balance analysis
    to integer factoring by the quadratic sieve, where the same structure holds
    and record-computation memory is publicly documented. A predicted memory
    exponent grossly inconsistent with published record memory means the model is
    wrong in a way the class-group case would hide.
  - >-
    C4 CLASS-GROUP-FREE NULL, REQUIRED. Run the identical linear-algebra step on a
    RANDOM SPARSE INTEGER MATRIX matched on dimension, row-weight distribution,
    entry magnitudes and determinant magnitude, with no class-group structure.
    Consequence pre-stated in falsification_criterion.
  - >-
    C5 INVARIANT-FACTOR NULL. Compare the Smith normal form profile of the real
    relation matrix against that of the C4 matrix. Agreement means the normal-form
    cost has no class-group-specific component; disagreement localises where the
    structure enters.
  - >-
    C6 SYNTHETIC TRACE NULL. Stub both legs with the modelled costs and verify the
    measurement pipeline recovers the INJECTED beta-optimum and the INJECTED
    memory-to-time ratio. A pipeline that cannot recover a known optimum cannot be
    trusted to report a measured one.
  - >-
    C7 SPLIT INSTRUMENTATION, REQUIRED. Because (T, M) alone does not identify the
    configuration, the linear-algebra time fraction is a REQUIRED metric per run
    and NO conclusion may rest on totals.
  - >-
    C8 ARGMIN-COINCIDENCE CONTROL, REPLACING THE [0.35, 0.65] BAND. Over the
    five-point beta sweep at fixed |D|, the beta minimising total time must
    coincide within one sweep point with the beta at which the linear-algebra time
    fraction crosses 0.5.
  - >-
    C9 CERTIFICATE CONTROL, PER RQ-CLGRP-66ab7f. Every class-group computation
    emits a certificate - generators, relations and a verifiable structure
    statement - re-verified by an independent checker. An uncertified structure
    computation is not evidence.
  - >-
    C10 ANALYTIC PINNING CONTROL, PROXY FOR H1. The computed group order must
    match the ERH-interval analytic estimate from a truncated Euler product at
    every tested discriminant. A mismatch is a bug until proved otherwise.
  - >-
    C11 MEMORY-HIERARCHY ANNOTATION. Record whether each run's working set crossed
    the machine's cache and RAM boundaries. A beta-sweep point that crosses a
    boundary is ANNOTATED and never silently included in a fit.
  - >-
    C12 COEFFICIENT-GROWTH METRIC, REQUIRED. Record the largest intermediate
    integer coefficient per run. It is the named candidate for a third cost that
    is not a function of beta, and if it dominates the whole one-parameter trace
    is the wrong object.
  independent_variables:
  - omega, symbolically, in {2, 2.376, 3}
  - discriminant size |D| about 2^64, 2^96, 2^128, 2^160
  - factor-base bound over a five-point sweep spanning a factor of 16 at |D| about 2^128
  - storage format in {sparse, dense}
  - memory bound W, on the repaired 1024-bit grid and the declared 2048-bit grid
  - crossover memory fraction f of W_opt(d), in {2^-14, 2^-10, 2^-6, 2^-3, 2^0}
  - arm in {real relation matrix, structureless random matrix, synthetic trace stub}
  metrics:
    primary:
    - >-
      symbolic (beta_opt, c) per omega, to six decimals, against the closed form.
    - >-
      fitted memory-to-time exponent ratio log(peak memory)/log(total time) with
      an interval, PER RECORDED STORAGE FORMAT, against the four forced values
      0.3333, 0.5000, 0.6667 and 1.0000.
    - >-
      the (log time, log memory) trace over the five-point beta sweep at
      |D| about 2^128, with the linear-algebra time fraction at every point.
    - >-
      c(W) at the repaired 1024-bit grid and the declared 2048-bit grid, in
      constant units and converted to BITS, with the binding-constraint flag per
      cell.
    secondary:
    - factor-base bound B, factor-base size, matrix dimension, density, storage format
    - wall clock and peak resident bytes, each split into collection and linear algebra
    - largest intermediate integer coefficient per run
    - the argmin-coincidence statistic of C8
    - structureless-matrix and invariant-factor null comparison statistics
    - synthetic-trace recovery of the injected optimum and injected ratio
    - realised smoothness rate against the predicted density, per u value
    - computed h(D) against the ERH-interval analytic estimate
    - the memory-bounded crossover under the fraction-parameterised grid, with its extrapolation distance
    - cache and RAM boundary crossings per sweep point
    - certificate and independent re-verification receipt per computation
  heuristic_under_test: H3
  preregistered_prediction:
    quantity: >-
      The balance optimum, the memory-to-time exponent ratio, and the
      memory-constrained time constant c(W).
    formula: >-
      'beta_opt = 1/(2 sqrt(omega - 1)), c = omega/(2 sqrt(omega - 1)), forced to
      (0.500000, 1.000000) at omega = 2, (0.426246, 1.012761) at omega = 2.376,
      (0.353553, 1.060660) at omega = 3. Memory-to-time exponent ratio 1/omega
      sparse and 2/omega dense, forced to 0.3333, 0.6667, 0.5000 and 1.0000.
      c(W) = beta_W + 1/(4 beta_W) with beta_W = min(ln W / sqrt(d ln d),
      1/(2 sqrt 2)); at 1024 bits sqrt(d ln d) = 68.262 and W_opt = 2^34.83, at
      2048 bits sqrt(d ln d) = 101.505 and W_opt = 2^51.78. Crossover with the
      generic family at d / ln d = 16 c^2.'
    source: >-
      Derived in H-ICEX-b6124c statements (A) through (E) from the standard
      index-calculus balance, with the smoothness leg imitating
      Canfield-Erdos-Pomerance. THE BALANCE ARITHMETIC IS ASSUMED TO BE TEXTBOOK
      and no novelty is claimed for it. The retrieved constant 3/sqrt(8) is
      carried from IDEA-20260818-ffeddf's own citation block, which records it as
      web-search abstract-level and NOT primary-read; TASK-20260904-f2b3db did not
      open any external source for this lane.
  scale_relevance:
    tier: medium
    justification: >-
      Certified class-group computations at |D| about 2^64 to 2^160, which is far
      below the deployed 1024- and 2048-bit discriminants. The c(W) curve and the
      crossover are MODEL OUTPUTS evaluated at deployed sizes, with the measured
      beta-trace overlaid and the EXTRAPOLATION DISTANCE stated explicitly. The
      transfer of a fitted omega from matrix dimensions in the low thousands to
      the order-2^35 dimensions the model implies at deployed sizes IS
      UNJUSTIFIED and is recorded as unjustified; it is the largest single source
      of error in c(W).
    correspondence: null
  tail_checks:
  - >-
    Report the largest relative deviation of the computed h(D) from the
    ERH-interval analytic estimate over the ladder.
  - >-
    Report the largest intermediate coefficient at the largest matrix, against
    that matrix's dimension. Growth outrunning the dimension is the signature of
    the third cost that would dissolve the whole trace.
  - >-
    Report the 'other' time fraction - everything outside collection and linear
    algebra - at every rung, itemised at the rung where it is largest. Above 20
    percent at any rung, H4 is falsified.
  - >-
    Report the lowest rung, |D| about 2^64, SEPARATELY and never pooled into the
    exponent fit- at that size the factor base is small enough that constant
    overheads dominate both legs.
  replication:
    seeds: [1009, 1013, 1019]
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 48
    maximum_memory_gb: 16
    maximum_runs: 120
    maximum_workers: 1
  stopping_rules:
  - >-
    STAGE A, ZERO COMPUTE, FIRST AND BLOCKING. Run C1, C2 and C3; file the two
    KN-LIT entries RQ-CLGRP-66ab7f requires; primary-read Biasse-Erukulangara for
    the balance and Vollmer for the omega = 2 branch. Outcome- part (A) stands, is
    withdrawn, or degrades to `known`. No cost claim is emitted before the KN-LIT
    entries exist.
  - >-
    STAGE B. Instrument and run the discriminant ladder, then the five-point beta
    sweep at |D| about 2^128. The beta sweep IS the experiment; the ladder only
    anchors it. Stop a rung at the per-run wall clock and record it as
    BUDGET-CENSORED rather than as a data point.
  - >-
    STAGE C. Run C4, C5 and C6 on matrices matched to the Stage B runs, then fit
    the exponent ratio and emit c(W) and the fraction-parameterised crossover.
  - >-
    Run C6 the synthetic trace null BEFORE any real fit, so that a pipeline unable
    to recover an injected optimum is caught before it reports a measured one.
  - >-
    Run rungs in ascending |D|. Do not start 2^160 until 2^128 has a completed
    receipt.
  invalidation_rules:
  - The symbolic fixture C1 fails; the whole run set is invalid.
  - The synthetic trace null C6 does not recover the injected optimum and ratio; the pipeline is untrusted and every fit is invalid.
  - A structure computation without a certificate re-verified by an independent checker; not evidence, per RQ-CLGRP-66ab7f.
  - Storage formats pooled in any fitted ratio.
  - A c(W) or crossover cell reported without its binding-constraint flag from C2.
  - A beta-sweep point that crossed a cache or RAM boundary included in a fit without its annotation.
  - >-
    Any bit figure quoted without the sqrt(d ln d) and ln 2 conversion written
    out, or any ratio formed across two unit tags.
  - >-
    Any record derived from this contract stating that a deployed parameter is
    adequate or inadequate. Void per RQ-CLGRP-66ab7f regardless of its numbers.
  - Wall-clock or memory exhaustion; failed_infrastructure under AGENTS.md rule 5.
  success_criterion: >-
    The contract delivers its object when- C1, C2 and C6 pass; the two required
    KN-LIT entries are filed; the primary read of Biasse-Erukulangara returns a
    stands or withdrawn verdict on part (A); the discriminant ladder and the
    five-point beta sweep complete with certificates re-verified; the
    memory-to-time exponent ratio is fitted with an interval PER STORAGE FORMAT
    and compared against the four forced values; the argmin-coincidence statistic
    C8 is reported; c(W) is emitted on the repaired 1024-bit grid and the declared
    2048-bit grid with binding flags and bit conversions; the crossover is emitted
    under the fraction-parameterised grid with its extrapolation distance and its
    UNDERPOWERED declaration for the absolute-W formulation; and C4 and C5 are
    reported against the Stage B matrices.
  falsification_criterion: >-
    N1 FIXTURE, BLOCKING. C1 does not return (0.353553, 1.060660) at omega = 3 or
    does not match the closed form. The record's arithmetic is wrong; void and
    supersede.

    N2 BALANCE. A primary read shows Biasse-Erukulangara reach 3/sqrt(8) by a
    different balance. Part (A) is WITHDRAWN, the numerical coincidence is
    recorded as a coincidence, and the remaining parts are re-derived from their
    actual balance. This is the audit working.

    N3 ARGMIN COINCIDENCE. The beta minimising total time does not coincide within
    one sweep point with the beta at which the linear-algebra time fraction
    crosses 0.5. The implementation is not on a two-leg cost curve; every
    cost-curve record in this goal inherits that qualification and must state it.

    N4 EXPONENT RATIO. The fitted memory-to-time ratio is inconsistent with ALL
    FOUR forced values beyond intervals at its recorded storage format. The
    two-leg model is inadequate; report the measured ratio and diagnose the third
    cost - the largest intermediate coefficient is the named candidate - rather
    than fitting around it.

    N5 CLASS-GROUP-FREE NULL, REQUIRED, CONSEQUENCE PRE-STATED. If the
    structureless random matrix of C4 reproduces the real matrix's time, memory
    and fitted exponent ratio within intervals, then every quantity measured on
    the linear-algebra leg is a property of sparse integer linear algebra at those
    dimensions and carries NO class-group-specific content; no evidence record may
    present it as a statement about class groups. If the real matrix is
    substantially MORE expensive, an unmodelled structural cost exists and the
    derived memory exponent must be reported as a LOWER bound. If substantially
    cheaper, the relation lattice is atypically well-conditioned and the deployed
    cost model is pessimistic. All three are informative and none is predicted.

    N6 c(W) SPREAD. The spread across the REPAIRED 1024-bit grid is under 5 bits.
    Memory is not decision-relevant at that size; parts (C) and (D) are falsified
    and that clean negative is reported as prominently as a positive. NOTE that
    the declared grid would give 6.37 bits and would therefore have decided this
    on a 1.4-bit margin, which is why the grid was replaced.

    N7 CROSSOVER, DECLARED UNDERPOWERED RATHER THAN SHRUNK. The absolute-W
    formulation of part (D) CANNOT FIRE- the crossover sits at |D| about 2^{113}
    to 2^{235} where the optimal memory is 2^9.4 to 2^14.7 words, so no bound in
    {2^30 .. 2^50} words binds and the shift is exactly 0 bits. The required
    condition for it to be testable is |D| above about 2^{790.6} for a 2^30-word
    bound, which is unreachable. Only the fraction-parameterised formulation is
    run, and its output is labelled a MODEL OUTPUT with its extrapolation
    distance.

    N8 COST-MODEL COMPLETENESS. Measured 'other' time exceeds 20 percent of total
    at any ladder rung. H4 is falsified and the two-leg model does not describe
    the implementation.

    N9 NOVELTY. A primary read finds the c(W) curve or an equivalent
    memory-bounded analysis already published for class groups. novelty_status
    becomes `known`; the measurement retains value and the framing does not.

    N10 LITERATURE GATE. The two KN-LIT entries cannot be filed. No cost claim is
    recorded, per RQ-CLGRP-66ab7f, and only the zero-compute symbolic fixture and
    the nearby-object control may be reported.
  required_artifacts:
  - frozen contract hash and the exact-arithmetic transcript of C1, C2 and C3
  - the two KN-LIT entries required by RQ-CLGRP-66ab7f, with extracted claims and source hashes
  - the primary-read note on Biasse-Erukulangara with its stands or withdrawn verdict on part (A)
  - the primary-read note on Vollmer with its verdict on the omega = 2 branch
  - implementation name and version, machine cache and RAM boundaries, word size
  - exact command, git commit, dirty-tree state, environment and dependency versions
  - per run- factor-base bound, factor-base size, relations collected, matrix dimension, density, storage format, largest intermediate coefficient
  - per run- wall clock and peak resident bytes, each split into collection and linear algebra
  - the (log time, log memory) trace over the five-point beta sweep with the linear-algebra fraction at every point
  - the fitted memory-to-time exponent ratio with interval, per storage format, against the four forced values
  - the C8 argmin-coincidence statistic
  - structureless-matrix, invariant-factor and synthetic-trace null outputs
  - c(W) tables at both deployed sizes with binding flags and the bit conversion written out
  - the fraction-parameterised crossover output with its extrapolation distance and the UNDERPOWERED declaration for the absolute-W form
  - class-group certificates and their independent re-verification receipts
  - computed h(D) against the ERH-interval analytic estimate, per discriminant
  - cache and RAM boundary crossing annotations per sweep point
  - stdout, stderr, timestamps, and per-run validity status with reason
  assigned_to: executor
  approved_by: null
