  observations:
    - "alpha_phi = 0 (exact invariance) on all 6 GLV cells with ||M*Phi - Phi*M||_0 = 0; complete separation from the in-run random baseline (alpha_rand >= 0.98*min(R,B) on all 9) on 6/6 GLV instances, both families."
    - "alpha_neg = 0 on 3/3 generic cells (universal involution structure, r=2), separated from its random baseline identically."
    - "The ablated alpha returns to the generic maximum (median 0.9919) on all 6 GLV matrices: the measured structure is phi-operator-specific."
    - "All 30 arm-cell hit rates are 1.000 (200/200 targets decompose, Wilson [0.9812, 1.0]): median GLV penalty = 1.0; B/alpha thresholds are infinite at alpha=0 and recorded as 'threshold_infinite_because_alpha_zero', never as numbers."
    - "Structured-vs-Wiedemann model ratio (alpha^2*B*ceil(log2 B))/(2*B^2*m) = 0.0 at both GLV 24-bit cells (alpha=0), raw and under the matvec calibration (1.3958 median)."
    - "Weight-3 0/1 relation matrices are generically rank-deficient at these sizes: raw square-matrix ranks 1590/1659, 1552/1660, 3120/3318 (uniform random weight-3 0/1 matrices show the same ~6% deficiency; full rank reached near 3xB rows); recorded as an observation; calibration solves use greedy full-rank subsystems (EV-STR-001 precedent)."
    - "Fully-charged totals (penalty-adjusted relation collection + LA + descent + verification, group-op equivalents) exceed measured rho per-target cost on every arm and cell (ratios 35.2 to 1413, growing with size); this matches the hypothesis's own expectation note for 16-24 bits and does not bear on the LA-stage claims."
    - "Orbit-completeness fraction = 1.0 on all 9 structured factor bases (complete orbits by construction; audited)."

  protocol_deviations:
    - id: DEV-1
      text: "Artifact naming: frozen required_artifacts name raw.json/summary.json/stdout.txt/stderr.txt; docs/evidence-and-reproducibility.md names raw-result.json/stdout.log/stderr.log. Both sets emitted byte-identical in every run directory (sha256-verified); recorded in every manifest."
    - id: DEV-2
      text: "Seed-to-size mapping fixed as seed 1->16, 2->20, 3->24 bits (spec says 'mapped one-to-one'; EXP-MTIC-001 amendment precedent used for the pinning)."
    - id: DEV-3
      text: "Generic-arm columns are signed points (x, +/-y); negation is trivial on x-coordinates, so this is the only non-vacuous reading of 'negation-orbit factor base' (r=2). GLV arms use x-coordinate columns. Disclosed in implementation.md decision 4."
    - id: DEV-4
      text: "Random-baseline displacement measured with the same block-cyclic shift operator as the cell's phi arm (fixed operator on consecutive r-blocks); a random matrix w.r.t. any fixed shift sits at the generic maximum (EV-STR-001 expectation, confirmed: median 0.9958)."
    - id: DEV-5
      text: "p regenerations on the deterministic nextprime chain: j0-24 x1, j1728-24 x5 (sextic/quartic twist orders all smooth on the skipped primes; the frozen stop rule's contemplated regeneration case; counts and derivations in frozen-instances.yaml)."
    - id: DEV-6
      text: "Harvesting pool of 2000 seeded targets per cell (EXP-MTIC-001 protocol) used for relation collection, disjoint from the 200 decomposition-test targets shared identically across arms of each cell."
    - id: DEV-7
      text: "Wiedemann calibration solves run on greedy full-rank B x B subsystems of freshly harvested phi-invariant relations (EV-STR-001 precedent), because raw square weight-3 matrices are generically ~4-6% rank deficient and plain Wiedemann hits a singular sequence minpoly (X factor); raw square ranks recorded in RUN-ENDO-009; harvest quota >= 3.2xB fresh relations per cell to make the subsystem exist."
    - id: DEV-8
      text: "Hit rate defined as fraction of the 200 targets with >=1 valid decomposition within the cell's enumeration budget (Wilson 95% intervals); exact FB-membership semantics for point-column factor bases, free-sign bookkeeping for x-column arms."
    - id: DEV-9
      text: "Memory enforcement: darwin rejects setrlimit(RLIMIT_AS); 4 GB cap enforced post-hoc against measured peak RSS plus proactive self-abort at 3.75 GB (mechanism recorded in every manifest). No run exceeded 1.32 GB."
    - id: DEV-10
      text: "Repeated-summand relations (2G_i+G_j=R) excluded so all matrix rows are strict 0/1; counted in resolve_stats (negligible rate)."

  anomalies:
    - "order_bsgs (harness/toycurve.py) can return a small common annihilator of its two probe points on j=0 curves (smooth junk orders caused 400 consecutive b rejections in smoke); orders are now annihilator-verified on 3 seeded points with exact naive-order fallback (bsgs==naive in a spot check). Recorded in implementation.md."
    - "All hit rates saturated at 1.000: the penalty measurement is a near-census of the tested distribution (penalty 1.0 with tight Wilson intervals); wider-aperture regimes untested (recorded, not smoothed)."
    - "Weight-3 0/1 generic rank deficiency (see observations); plain Wiedemann on the raw square matrix cannot converge (C[L]=0 on all attempts, measured); handled per DEV-7."
    - "alpha = 0 (exact invariance, stronger than the alpha <= r prediction) makes B/alpha an infinite threshold; recorded via threshold_infinite_because_alpha_zero."
    - "Smoke-test failures (pre-record, scratch root): smooth twist orders, point-FB membership overcount, RSS allocator fragmentation (6.9 GB) in the unchunked GE. All fixed before the recorded execution; no recorded run carries defective-code output."

