experiment:
  id: EXP-ENDO-001
  hypothesis_id: H-ENDO-001
  version: 1
  title: >-
    Endomorphism-rank cost curve - does augmenting the ECDLP witness lattice
    with endomorphisms shrink its minimum while leaving the search exponent at
    one half and inflating the constant like 2^r
  status: approved
  frozen: true
  frozen_on: '2026-07-28'
  confirmatory_status: confirmatory
  claim_tier_ceiling: toy
  claim_tier_ceiling_note: >-
    Every field size in this contract is at most 28 bits, so under
    tools/validate_ledger.py::tier_of_run every run in this experiment is toy
    tier. No record derived from this experiment may assert medium or crypto
    tier, and no outcome of it is a cryptanalytic result, an attack
    improvement, a closure, or an impossibility claim.
  objective: >-
    Measure, on one frozen protocol and at four field sizes, whether the three
    properties P1 (index pinning), P2 (minimum shrinkage) and P3 (cost
    neutrality with a 2^r constant) of H-ENDO-001 hold simultaneously. The
    discriminating question is whether the measured meet-in-the-middle cost
    divided by sqrt(N) RISES with the endomorphism rank r, as the pinned
    determinant predicts, or FALLS with r, which would mean the low-dimensional
    shadow of a short witness is exploitable, would refute P3, and would reopen
    the endomorphism lane as an exponent-targeting direction.
  pre_registration_note: >-
    EVERY PREDICTED NUMBER IN THIS CONTRACT CARRIES ITS BASIS, AND NO NUMBER IS
    COPIED FROM A PROBE. Three bases appear and are labelled at each use.
    (i) DERIVED-IN-CONTRACT - obtained by the arithmetic written out in section
    `derivation` below and checkable from that text alone: the predicted index
    N, the predicted first-minimum exponent 1/(2r), the predicted cost ratio
    rho(r) = 2^(r+1) and hence rho(1) = 4, rho(4) = 32 and rho(4)/rho(1) = 8.
    (ii) LITERATURE-CONSTANT - 0.886, the classical rho birthday constant
    sqrt(pi/4), from the published Pollard rho and van Oorschot-Wiener
    literature. This campaign has NEVER measured it; it is used here as a
    known-answer calibration target, and reproducing it is a precondition for
    trusting any negative this instrument produces.
    (iii) PRE-REGISTERED-TOLERANCE, UNTESTED - every acceptance band and every
    tolerance: the slope interval [0.85, 1.15], the R^2 floor 0.90, the
    factor-2 band around 2^(r+1), the 15 percent monotonicity tolerance, the
    acceptance threshold 4 for rho(4)/rho(1) against a derived 8, the 20
    percent calibration band, and the memory ratio floor sqrt(N)/16. These are
    judgement calls fixed BEFORE execution so that they cannot be adjusted
    after seeing the data. None of them is a measurement and none may be
    reported as one.
    NO UNARCHIVED PROBE WAS CONSULTED IN WRITING THIS CONTRACT, AND NO VALUE
    HERE ORIGINATES IN ONE.
  derivation: >-
    Written out so the predicted values above are checkable from this document
    rather than taken on trust.
    STEP 1 - REDUCTION TO ONE CONGRUENCE. G has prime order N, so every
    endomorphism of G is multiplication by a scalar; write phi_i acting on G as
    multiplication by lambda_i in Z/N with lambda_1 = 1. With Q = [k]P, the
    witness condition (sum a_i phi_i(P)) + (sum b_i phi_i(Q)) = O becomes
    [(sum a_i lambda_i) + k (sum b_i lambda_i)] P = O, that is the single
    congruence (sum a_i lambda_i) + k (sum b_i lambda_i) = 0 mod N on Z^(2r).
    STEP 2 - INDEX. The coefficient vector of that congruence contains
    lambda_1 = 1, a unit, so the induced map Z^(2r) -> Z/N is surjective and its
    kernel W_r has index exactly N and determinant exactly N, for every r.
    Predicted index N. BASIS: derived here.
    STEP 3 - FIRST MINIMUM. Put X = ceil(N^(1/(2r))). The symmetric closed box
    [-X, X]^(2r) has volume (2X+1)^(2r), which strictly exceeds (2X)^(2r) and
    hence strictly exceeds 2^(2r) times N. Minkowski's convex body theorem then
    guarantees a NONZERO witness inside it, so the infinity-norm first minimum
    is at most ceil(N^(1/(2r))) and log_N of it is at most about 1/(2r).
    Predicted regression slope of log_N(first minimum) on 1/(2r): 1. BASIS:
    derived here.
    STEP 4 - COST. Split the 2r coordinates into the r P-side coordinates and
    the r Q-side coordinates. Each half ranges over (2X+1)^r vectors, and
    (2X+1)^r is about (2 N^(1/(2r)))^r = 2^r sqrt(N). Building each list
    incrementally costs one point addition per entry, so two lists cost about
    2 times 2^r times sqrt(N) point additions, and the collision join costs
    hash-table work counted separately from point additions. Hence the predicted
    cost ratio rho(r) = (point additions) / sqrt(N) = 2^(r+1), giving
    rho(1) = 4, rho(2) = 8, rho(3) = 16, rho(4) = 32 and rho(4)/rho(1) = 8.
    Predicted peak storage: 2^r sqrt(N) entries. BASIS: derived here.
    STEP 5 - WHAT THE THREE STEPS TOGETHER SAY. The witness gets shorter like
    N^(1/(2r)) while the search for it gets more expensive like 2^(r+1)
    sqrt(N). Shortness bought by adding coordinates is not shortness that can be
    searched for more cheaply, because the determinant never moved. If the
    measurement contradicts STEP 4 - if rho(r) falls with r - then either the
    determinant is not pinned or the balanced split is not the best
    decomposition, and either is a genuine structural finding rather than an
    implementation improvement.
  relation_to_target_profile: >-
    This experiment is dispatched under the exponent-targeting bias, and its
    primary metric is an EXPONENT question rather than a cofactor question: it
    asks whether the search exponent in N stays at 1/2 as r grows. Its
    confirmatory outcome is a scoped negative - endomorphism augmentation is
    exponent-neutral and constant-inflating - and its falsifying outcome F1
    would identify an exponent-relevant mechanism. The one CONSTANT-factor
    quantity in the design, the classical 0.886 sqrt(N/|Aut|) automorphism
    quotient, appears only as a known-answer calibration of the instrument and
    is explicitly NOT a target-class result: a speedup of at most sqrt(6) is
    engineering, not an exponent.
  inputs:
    curve_families:
      - id: J0
        description: >-
          j = 0 curves of the form y^2 = x^3 + b over F_p with p congruent to 1
          mod 3, CM discriminant -3, |Aut| = 6. Endomorphism phi(x, y) =
          (zeta_3 x, y) with zeta_3 a primitive cube root of unity in F_p.
        genuine_r_bound: 3
        eigenvalue_source: 'roots of L^2 + L + 1 = 0 mod N'
      - id: J1728
        description: >-
          j = 1728 curves of the form y^2 = x^3 + a x over F_p with p congruent
          to 1 mod 4, CM discriminant -4, |Aut| = 4. Endomorphism phi(x, y) =
          (-x, i y) with i a primitive fourth root of unity in F_p.
        genuine_r_bound: 2
        eigenvalue_source: 'roots of L^2 + 1 = 0 mod N'
      - id: GEN
        description: >-
          Generic j curves with |Aut| = 2 and no nontrivial efficiently
          computable endomorphism. Control family, r = 1 only.
        genuine_r_bound: 1
        eigenvalue_source: 'lambda_1 = 1 only'
    field_bits: [16, 20, 24, 28]
    seeds: [1, 2, 3, 4, 5]
    endomorphism_ranks: [1, 2, 3, 4]
    synthetic_rank_rule: >-
      A cell whose r exceeds its family's genuine_r_bound is SYNTHETIC: the
      extra eigenvalues are drawn uniformly from the units of Z/N under the
      cell seed and correspond to NO efficiently computable map. Synthetic cells
      MUST be flagged `synthetic: true` in raw-result.json, MUST be excluded
      from any statement about a realizable attack, and are interpretable only
      as lattice geometry and cost model. This corrects
      IDEA-20260727-008's minimal test, which assumed four genuine
      endomorphisms are available; on a prime-order subgroup of a j = 0 curve
      the efficiently computable scalars are generated by 1 and lambda with
      lambda^2 + lambda + 1 = 0 mod N, so at most three distinct scalars exist
      and the third satisfies lambda_3 = -1 - lambda_2.
    subgroup_requirement: >-
      Each instance uses a prime-order subgroup of order N with N at least
      2^(field_bits - 4), P a generator, and Q = [k]P for k drawn uniformly in
      [1, N-1] under the cell seed. k is CHOSEN by the driver, so no discrete
      logarithm is solved to set up an instance and no circularity enters.
  independent_variables:
    - endomorphism_rank_r
    - field_bits
    - curve_family
    - lattice_origin (endomorphism-derived versus uniformly random sublattice of index N)
  controls:
    - id: CTRL-RANDSUB
      title: Random-sublattice negative control
      description: >-
        A uniformly random sublattice of Z^(2r) of index N with no endomorphism
        origin, constructed by drawing a coefficient vector uniformly from
        (Z/N)^(2r) with at least one unit entry. Its measured cost curve must
        match the endomorphism-derived curve within the acceptance band. A
        discrepancy means the endomorphism structure carries exploitable
        information beyond the index, which is exactly the F1 outcome.
      arm: RUN-ENDO-001-D-RANDSUB
    - id: CTRL-COLLAPSE
      title: Planted index-collapse positive control
      description: >-
        An artificially constructed instance in which the congruence is imposed
        modulo a proper divisor d of a COMPOSITE modulus M = d e chosen by the
        driver, so the true index is d and is strictly below M. The instrument
        must report index d and a meet-in-the-middle cost below sqrt(M). If it
        cannot detect a planted collapse it cannot certify the absence of a real
        one, and every P1 negative in the run set is void.
      arm: RUN-ENDO-001-E-COLLAPSE
    - id: CTRL-EIGEN
      title: Eigenvalue verification control
      description: >-
        Every lambda_i is verified on the curve by checking
        phi_i(P) = [lambda_i] P, at cost O(log N). A wrong root silently
        produces a lattice of the wrong index and would manufacture a false
        falsification of P1. Any cell whose eigenvalue check fails is marked
        invalid and excluded, and the count of such cells is reported.
      arm: applied in every arm that constructs a lattice
    - id: CTRL-CERT
      title: Witness certificate control
      description: >-
        Every returned witness is replayed on the curve as
        (sum a_i phi_i(P)) + (sum b_i phi_i(Q)) = O, and where the Q-side
        coefficient combination B = sum b_i lambda_i is invertible mod N the
        recovered k = -A/B mod N is checked by [k] P = Q. An unverified witness
        is NOT a witness, is excluded from the cost counts, and is reported
        separately. Per docs/claims-and-verification.md, only
        certificate-verified solves may be recorded with
        result.certificate.kind = discrete_log.
      arm: applied in arms A, B, C, D, E
    - id: CTRL-BASELINE
      title: Matched rho and BSGS baselines
      description: >-
        Matched Pollard rho with negation and matched BSGS are run on every
        instance of arms A, B and C in the same operation unit (one point
        addition or doubling), with peak stored entries recorded for both.
      arm: arms A, B, C
    - id: CTRL-GENJ
      title: Generic-j implementation-quality control
      description: >-
        On the GEN family at r = 1 the meet-in-the-middle must land within a
        factor 2 of matched BSGS in point additions. This bounds the
        implementation penalty at r = 1, without which only the trend in r and
        not the absolute ratio would be interpretable.
      arm: RUN-ENDO-001-C-GEN
  arms:
    - id: RUN-ENDO-001-A-J0
      family: J0
      ranks: [1, 2, 3, 4]
      cells: 4 field sizes x 5 seeds x 4 ranks = 80 cells, of which the r = 4 cells are synthetic
      measures: [index, first_minimum, mitm_cost, mitm_memory, rho, bsgs, certificates]
    - id: RUN-ENDO-001-B-J1728
      family: J1728
      ranks: [1, 2, 3, 4]
      cells: 4 field sizes x 5 seeds x 4 ranks = 80 cells, of which the r = 3 and r = 4 cells are synthetic
      measures: [index, first_minimum, mitm_cost, mitm_memory, rho, bsgs, certificates]
    - id: RUN-ENDO-001-C-GEN
      family: GEN
      ranks: [1]
      cells: 4 field sizes x 5 seeds x 1 rank = 20 cells, none synthetic
      measures: [index, first_minimum, mitm_cost, mitm_memory, rho, bsgs, certificates]
    - id: RUN-ENDO-001-D-RANDSUB
      family: 'none (synthetic lattices only)'
      ranks: [1, 2, 3, 4]
      cells: 4 field sizes x 5 seeds x 4 ranks = 80 cells
      measures: [index, first_minimum, mitm_cost, mitm_memory]
    - id: RUN-ENDO-001-E-COLLAPSE
      family: 'none (planted collapse)'
      ranks: [2, 3]
      cells: 4 moduli x 3 seeds x 2 ranks = 24 cells
      measures: [index, mitm_cost, detection_flag]
    - id: RUN-ENDO-001-F-H1
      family: 'J0 and J1728'
      ranks: [1, 2, 3]
      cells: >-
        witness census in boxes of side c X for c in {0.5, 1, 2}, at 16 and 20
        field bits, 5 seeds, ranks 1 to 3. Counting is by LATTICE-POINT
        enumeration over an LLL-reduced basis of W_r, never by enumerating the
        box: the box holds about 4^r N integer points, which is not enumerable,
        while the lattice holds about (2c)^(2r) points in it, at most 4096 at
        c = 2 and r = 3. c = 4 and r = 4 are EXCLUDED as not enumerable within
        budget, and that exclusion is declared here rather than discovered
        later.
      measures: [witness_count_per_box, zero_count_fraction_at_c_equals_1, poisson_chi_square]
    - id: RUN-ENDO-001-G-H2
      family: 'J0 and J1728'
      ranks: [2]
      cells: at least 500 curves across the four field sizes
      measures: [eigenvalue_multiset, ks_statistic_against_uniform, min_first_minimum_ratio]
    - id: RUN-ENDO-001-H-RHOCAL
      family: 'J0, J1728, GEN'
      ranks: ['not applicable']
      cells: >-
        4 field sizes x 3 families x 5 seeds, with 10 independent rho
        repetitions per instance at 16, 20 and 24 bits and 5 repetitions at 28
        bits; report the mean and standard error of measured rho cost.
      measures: [rho_mean_cost, rho_standard_error, ratio_to_calibration_target]
  metrics:
    primary:
      - name: hnf_index_equals_N
        definition: >-
          Boolean per cell: the Hermite normal form index of W_r in Z^(2r),
          computed exactly over the integers, equals N.
      - name: log_N_first_minimum
        definition: >-
          log(first minimum in the infinity norm of W_r) / log(N) per cell, with
          the method recorded as `exact_enumeration` or `lll_upper_bound`.
      - name: rho_r
        definition: >-
          Measured meet-in-the-middle point additions divided by sqrt(N), per
          cell. This is the discriminating metric of the experiment.
    secondary:
      - name: mitm_peak_entries
        definition: peak number of stored list entries during the meet-in-the-middle
      - name: rho_measured_cost
        definition: measured Pollard rho point additions to solve the same instance
      - name: bsgs_measured_cost
        definition: measured BSGS point additions and peak stored entries on the same instance
      - name: rho_calibration_ratio
        definition: 'measured rho mean cost divided by 0.886 * sqrt(N / |Aut|)'
      - name: certificate_pass_rate
        definition: fraction of returned witnesses that pass CTRL-CERT
      - name: eigenvalue_check_pass_rate
        definition: fraction of eigenvalues that pass CTRL-EIGEN
      - name: witness_count_per_box
        definition: number of nonzero witnesses of W_r inside the box of side c X
      - name: ks_statistic
        definition: Kolmogorov-Smirnov statistic of lambda_2 / N against uniform on [0, 1)
  replication:
    seeds: [1, 2, 3, 4, 5]
    independent_instances: 60
    independent_instances_note: >-
      60 curve instances (3 families x 4 field sizes x 5 seeds) carry the
      primary arms; the control and validation arms reuse those instances where
      the design says so and construct their own where it does not. Every seed
      is recorded per cell and duplicate seeds within a cell are an
      invalidation condition.
  budget:
    wall_clock_seconds_per_run: 1800
    wall_clock_seconds_total: 7200
    total_cpu_hours: 2
    maximum_memory_gb: 8
    maximum_runs: 8
  stopping_rules:
    - >-
      Hard stop at 1800 seconds per arm and 7200 seconds across the experiment.
      An arm that reaches its cap terminates with status `resource_exhaustion`,
      keeps every cell it completed, and records which cells were not attempted.
      A resource exhaustion is INFRASTRUCTURE SIGNAL, never evidence against
      H-ENDO-001.
    - >-
      PRE-REGISTERED DEGRADATION ORDER. If an arm cannot complete inside its
      cap, drop cells in this order and no other: first the 28-bit cells, then
      the 24-bit cells, then seeds 5 and 4. Never drop a rank, because the rank
      sweep is the measurement.
    - >-
      PRE-REGISTERED CONSEQUENCE OF DEGRADATION. If fewer than four field sizes
      complete for a family, the cross-size fit for that family is
      under-determined and its S3 verdict is INCONCLUSIVE by pre-registration -
      not negative, and not to be rescued by refitting on three sizes.
    - >-
      Stop the whole experiment and report if the planted-collapse control
      CTRL-COLLAPSE fails, because every P1 negative downstream of it is void.
    - >-
      Stop and report if peak resident memory exceeds 8 GB at any point.
  invalidation_rules:
    - Any run whose manifest lacks the exact command, code commit, environment, seeds, or timing is invalid.
    - Any cell with a duplicated seed within its arm, or a missing seed, is invalid.
    - Any disagreement between raw-result.json and results/summary.json invalidates the summary until regenerated from raw.
    - Any cell whose eigenvalue check CTRL-EIGEN fails is invalid and excluded, and the exclusion count is reported.
    - Any witness that fails CTRL-CERT is excluded from cost counts and reported separately.
    - >-
      Mixing exact-enumeration and LLL-upper-bound first minima inside one
      regression invalidates that regression. The S2 fit runs on
      exact-enumeration cells only, and the LLL cells are reported beside it.
    - >-
      Any modification of harness/ or of another experiment's directory
      invalidates the run set. The driver is new and standalone.
  success_criterion: >-
    The experiment CONFIRMS H-ENDO-001 if and only if all five of S1 to S5 hold
    on the completed cells.
    S1 INDEX PINNING - the Hermite normal form index equals N on 100 percent of
    non-synthetic and synthetic cells of arms A, B, C and D whose eigenvalue
    check passed. Threshold: 100 percent, no tolerance.
    S2 SHRINKAGE - regressing log_N(first minimum) on 1/(2r) over
    EXACT-ENUMERATION cells only gives slope in [0.85, 1.15] with R^2 at least
    0.90 (pre-registered tolerance, untested).
    S3 COST NEUTRALITY - for every family and every completed field size, the
    measured rho(r) is non-decreasing in r within 15 percent; rho(r) lies within
    a factor 2 of the derived 2^(r+1) at every r; and rho(4)/rho(1) is at least
    4 at the largest completed field size, against a derived 8. At least four
    field sizes must have completed for the family, per the degradation rule.
    S4 CONTROLS - CTRL-COLLAPSE detects the planted collapse (reported index
    equal to the planted divisor d and measured cost below sqrt(M));
    CTRL-RANDSUB's cost curve matches arms A and B within the same factor-2
    band, so no exploitable information beyond the index is present; and
    CTRL-GENJ places the r = 1 meet-in-the-middle within a factor 2 of matched
    BSGS.
    S5 CALIBRATION - measured mean rho cost on J0 and J1728 lies within 20
    percent of 0.886 sqrt(N / |Aut|) (literature constant; pre-registered band,
    untested).
    VERDICT MAP, FIXED IN ADVANCE. All of S1 to S5 hold -> `confirmed`, and the
    scoped reading is that endomorphism augmentation is exponent-neutral and
    constant-inflating at 16 to 28 bits. Any of F1 to F5 fires -> the
    corresponding falsification verdict below, which OVERRIDES a partial
    confirmation. Neither a full confirmation nor any falsifier -> `mixed`, and
    `mixed` is a genuinely reachable branch that must be reported as such rather
    than resolved by rounding a criterion.
    WHAT CONFIRMATION IS NOT. A confirmation is a scoped NEGATIVE about one
    attack strategy at toy sizes. It is not a lower bound, not a hardness proof,
    not a claim about crypto scale, and not a completion criterion of
    GOAL-ECDLP-001.
  falsification_criterion: >-
    F1 COST FALLS WITH RANK. Measured rho(r) decreases with r by more than the
    15 percent tolerance on any family at any completed field size, while
    CTRL-RANDSUB does NOT show the same decrease. P3 is FALSE on the tested
    scope. Verdict `refuted_P3`. This is the single most informative outcome
    available: it would mean the endomorphism lane carries exploitable structure
    beyond the pinned index, it must not be reported until an independent
    non-originating review has re-derived it, and it would collapse the
    load-bearing exit-map claim of IDEA-20260727-005.
    F2 INDEX BELOW N. Any cell reports Hermite index strictly below N with a
    PASSING eigenvalue check. P1 is FALSE. Verdict `refuted_P1`. Since P1 is a
    derived consequence of surjectivity, this is far more likely an
    implementation error than a discovery and must be replicated in an
    independently written implementation before being reported as anything else.
    F3 NO SHRINKAGE. The S2 slope on exact-enumeration cells falls outside
    [0.85, 1.15] or its R^2 falls below 0.90. The Minkowski minimum is not being
    attained, the box is the wrong size, and the cost comparison is
    UNINTERPRETABLE. Verdict `inconclusive_instrument`, explicitly NOT a
    negative result.
    F4 UNEXPLAINED RHO SPEEDUP. Measured mean rho cost on an endomorphism-rich
    family beats 0.886 sqrt(N / |Aut|) by more than 20 percent. Verdict
    `calibration_failure`: no other number in the run set may be interpreted
    until this is explained.
    F5 PLANTED COLLAPSE MISSED. CTRL-COLLAPSE does not detect the planted
    collapse. Verdict `invalid_instrument`: every P1 negative in the run set is
    void, the run set is INVALID rather than negative, and it returns to the
    Executor.
    F6 MEMORY-COMPETITIVE MITM. Peak meet-in-the-middle entries divided by rho
    peak entries falls below sqrt(N)/16 at any r. The tradeoff reading of the
    hypothesis is wrong even if the time exponent holds. Verdict
    `mixed`, with the memory clause reported explicitly.
  required_artifacts:
    - >-
      One immutable run directory per arm under experiments/EXP-ENDO-001/runs/,
      named exactly as the arm id, each containing manifest.yaml, command.txt,
      environment.json, stdout.log, stderr.log and raw-result.json. Eight run
      directories exactly; a different count is a validity defect to report, not
      to absorb.
    - >-
      Each manifest.yaml carries id, experiment_id EXP-ENDO-001, status, code
      (commit and exact command and dirty flag), environment, inputs (including
      inputs.parameters.field_bits set to the LARGEST field size completed in
      that arm, so the claim-tier ceiling computes correctly), timing, result,
      requested model policy executor-terra, the resolved model identifier, and
      whether fallback was used.
    - >-
      raw-result.json carries one row per cell with: family, field_bits, seed,
      r, synthetic flag, p, N, the lambda_i, the eigenvalue check flag, the HNF
      index, the determinant, the first minimum and its method, the
      meet-in-the-middle point additions, the peak entries, the witness vector,
      the certificate results, the recovered k where available, and the matched
      rho and BSGS costs and memories.
    - >-
      results/summary.json with the per-family, per-size, per-r aggregates, the
      S1 to S5 evaluations, the F1 to F6 evaluations, and the fitted slope and
      R^2 - each aggregate traceable to the raw rows it came from.
    - >-
      results/run_index.json listing the eight runs, their statuses and their
      completed cell counts.
    - >-
      driver/endo_rank_driver.py, the standalone implementation, plus the
      SHA-256 of every source file it loads recorded in each manifest.
    - >-
      An explicit list of every cell that was NOT attempted, with the reason,
      whenever the degradation rule fired.
  assigned_to: executor
  approved_by: coordinator
  approved_on: '2026-07-28'
  approval_scope: >-
    Approval covers execution of this protocol exactly as frozen. Any change
    after this freeze requires a versioned protocol_amendment record per
    docs/task-lifecycle.md, and an exploratory change may not be evaluated
    against the criteria above.
  reserved_record_ids:
    evidence: EV-ENDO-001
    decision: DEC-20260728-004
    reserved_note: >-
      RESERVED AND UNWRITTEN. No evidence and no decision record exists for this
      experiment. EV-ENDO-001 and DEC-20260728-004 are written by
      TASK-20260728-009 after the independent validator and red-team reviews
      report, and only the post-commit-verified ledger archive makes any
      disposition official.
  scope_statement: >-
    Toy tier only, 16 to 28 field bits, prime-order subgroups over prime fields,
    |Aut| in {2, 4, 6}, one Python implementation on one machine, one balanced
    meet-in-the-middle decomposition. NOT a cryptanalytic result, NOT an attack
    improvement, NOT a closure, NOT an impossibility claim, and NOT crypto-scale
    validation under any outcome. No asymptotic exponent claim of GOAL-ECDLP-001
    moves in either direction on this evidence alone, and none of the four
    asymptotic-claim promotion gates is addressed by it.
  source_refs:
    - ledger/proposals/IDEA-20260727-008.yaml
    - ledger/proposals/IDEA-20260727-005.yaml
    - ledger/hypotheses/H-ENDO-001.yaml
    - ledger/decisions/DEC-20260726-007.yaml
    - ledger/evidence/EV-GGM-001.yaml
    - docs/claims-and-verification.md
