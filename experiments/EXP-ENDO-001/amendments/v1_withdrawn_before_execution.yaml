protocol_amendment:
  id: AMEND-EXP-ENDO-001-001
  experiment_id: EXP-ENDO-001
  amends_version: 1
  new_version: null
  new_version_note: >-
    NO v2 IS ISSUED. This amendment WITHDRAWS version 1 before execution and
    supersedes it with nothing. A v2 remains available as a ranked deferral
    (DEFER-BATCH009-002) under the resume condition recorded there, and this
    record does not write one.
  amended_on: '2026-07-28'
  amended_by: coordinator
  task_id: TASK-20260728-010
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-009

  kind: withdrawal_before_execution

  effect: >-
    experiments/EXP-ENDO-001/specification.yaml version 1, frozen at status
    approved and committed at a6b5ca60b99f115e0e74b0d2932b19bd63084785, is
    WITHDRAWN BEFORE EXECUTION and must not be executed. TASK-20260728-005 is
    cancelled in the BATCH-009 dispatch queue. Zero runs of EXP-ENDO-001 exist,
    exist in any prior batch, or will be produced under version 1.

  the_committed_specification_is_not_edited: >-
    STATED PLAINLY. experiments/EXP-ENDO-001/specification.yaml is NOT modified
    by this amendment, in place or otherwise. Its committed blob still reads
    `status: approved` and still carries `genuine_r_bound: 3` for family J0.
    That is deliberate: the file is an immutable committed record and the
    campaign has already paid for one in-place edit of a frozen contract
    (a935f207, disposed of by DEC-20260727-003 and bounded by
    CORR-20260727-004, which its own gate records as NOT a clean instance of the
    precedent it defines). Corrections supersede; they do not overwrite. An
    auditor reads specification.yaml at a6b5ca60 together with THIS file.

  effective_when: >-
    The withdrawal is recorded here and is operative for dispatch immediately -
    no execution will occur. It becomes an OFFICIAL experiment-state transition
    only when DEC-20260728-004 is written by TASK-20260728-009, committed by
    that ledger archive, and accepted by the post-commit verifier. Until then
    the official status of EXP-ENDO-001 in the ledger remains `approved` and
    this record does not claim otherwise.

  experiment_status:
    status_as_frozen: approved
    status_proposed_by_this_amendment: withdrawn_before_execution
    status_vocabulary_note: >-
      AGENTS.md defines the experiment lifecycle as draft -> review_required ->
      approved -> running -> completed | failed_infrastructure | invalid ->
      analyzed -> archived. It has no `withdrawn` state. This amendment does not
      invent one silently: it records the disposition in words, names the gap,
      and leaves the canonical vocabulary question to DEC-20260728-004, which
      must either map this to `invalid` with an explicit reason of
      design-defect-found-before-execution or record the vocabulary gap as an
      integrity note. A withdrawal before any run is NOT
      `failed_infrastructure`: nothing crashed, nothing timed out, and no
      infrastructure was involved.

  grounds:
    - id: G1
      summary: >-
        The independent non-originating review TASK-20260728-004
        (RT-20260728-001), committed at 4f87e165, returned REVISE with six
        blocking objections after confirming snapshot integrity and
        pre-registration order without reservation. Every objection is about the
        design. INT-BATCH009-E makes the gate the Coordinator's: the dispatcher
        would have unblocked execution mechanically.
    - id: G2
      summary: >-
        A decisive mathematical defect reaches a cell the contract labels
        GENUINE. For family J0 the genuine rank bound is 2, not 3, and at every
        r >= 3 the infinity-norm first minimum of W_r is exactly 1 for every N
        and every k, against a predicted N^(1/(2r)). Prediction P2 is false
        there on paper. See claims D1 and D2 in
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/tasks/TASK-20260728-010/refutation_claims.yaml
        and the companion derivation_note.md.
    - id: G3
      summary: >-
        The `confirmed` branch is unreachable from the contract's own
        arithmetic. S3 bands the measured cost ratio within a factor 2 of
        2^(r+1) at every rank, size and family, while the contract's own ceiling
        rule X = ceil(N^(1/(2r))) makes the exact ratio reach 3.81 at 16-bit
        r = 4 and 3.57 at 20-bit r = 4 - and the pre-registered degradation
        order drops 28-bit cells FIRST, so the deterministically failing cells
        are exactly the ones that always survive. S5 fails independently:
        CTRL-BASELINE specifies rho with negation, |Aut| = 2, while S5
        calibrates against |Aut| = 6 and 4, a guaranteed 1.73x and 1.41x miss.
        Recorded as objections B2 and B3 of RT-20260728-001 and NOT re-derived
        by this session; cited to that report rather than restated as ours.
    - id: G4
      summary: >-
        The most informative falsifier F1 is unreachable as intended. Per
        objection B4 of RT-20260728-001, the meet-in-the-middle cost is
        dominated by a list-build term that is a curve-free deterministic
        function of (N, r), identical by construction in arms A, B and D, so the
        structure-sensitive share is about 4^(-r) - 0.4 percent at r = 4 -
        against a 15 percent tolerance. The one route that does fire F1 is the
        coordinate redundancy of G2, whose pre-registered interpretation would
        be exactly backwards.
    - id: G5
      summary: >-
        The mechanism the contract offers is not the operative one. W_r is not
        attacker-constructible - its congruence involves the unknown k - and
        constructing W_2 plus LLL plus k = -A/B would solve the instance. The
        determinant pinning at N is therefore not what makes the shortness
        unexploitable. See claim D4. A `confirmed` verdict would have attached a
        true observation to a false mechanism.
    - id: G6
      summary: >-
        No outcome could have been target-class. RT-20260728-001's baseline
        comparison finds the algorithm under test dominated by BSGS by about 2^r
        in BOTH time and memory at every rank including r = 1, and by Pollard
        rho absolutely on memory, with no time-memory point where it wins. Under
        the target-result profile the experiment could at best have measured how
        much worse than the baseline an augmented search is, at toy tier.
    - id: G7
      summary: >-
        The minimal repair does not rescue the primary question. Setting
        genuine_r_bound to 2 for J0 - objection B1's own required fix, and the
        one item RT-20260728-001 says to do if only one can be done - leaves the
        genuine r-sweep with exactly TWO points, r = 1 and r = 2, on both CM
        families. A two-point curve cannot separate a 2^r constant from an
        exponent effect, which is the confound the batch-opening record itself
        named as dominant. This is the Coordinator's own arithmetic, not the
        review's.

  what_is_NOT_a_ground:
    - >-
      No timeout, crash, cap hit or implementation failure occurred. Nothing was
      executed. Infrastructure signal plays no part in this withdrawal.
    - >-
      No measurement contradicts anything, because no measurement exists. The
      grounds are the committed review and paper algebra only.
    - >-
      The snapshot integrity of TASK-20260728-003 is NOT in question.
      RT-20260728-001 verified the commit, its parent, its four paths, their
      hashes and reachability from HEAD, and confirmed that experiments/
      EXP-ENDO-001 contains specification.yaml and nothing else at that commit,
      so the contract provably precedes any measurement in commit order. That
      property is intact and is the strongest thing this batch produced about
      process.

  what_this_amendment_does_not_do:
    - >-
      It does NOT change any hypothesis status. H-ENDO-001 remains `approved`,
      which carries no evidential standing. H-STR-002 remains `weakened` per
      DEC-20260727-009 and H-IC-001 remains `weakened` per DEC-20260727-008.
    - >-
      It does NOT reject H-ENDO-001 or its lane. An adverse transition of
      H-ENDO-001 requires the refutation artifact to be committed and
      independently verified first, and is proposed for DEC-20260728-004, not
      taken here.
    - >-
      It does NOT close, supersede or retract any research direction, and it
      claims no closure quorum - AGENTS.md at this commit has no rule 13 and
      every review in this lineage resolves to claude-opus-5 with fallback_used
      true.
    - >-
      It does NOT edit experiments/EXP-ENDO-001/specification.yaml,
      ledger/hypotheses/H-ENDO-001.yaml, tools/validate_ledger_baseline.txt,
      harness/, or any other experiment directory.
    - 'It does NOT retract EXP-STR-004. That deferral is carried unretracted as DEFER-BATCH009-001.'

  superseded_records: []
  supersedes: []
  commit_sha: null
  parent_sha: null
  path_sha256: null
  hash_note: >-
    Null by construction. The authoring session had no shell and no git access,
    ran no git command and no validator, and fabricated no hash. The orchestrator
    fills these after the isolated TASK-20260728-011 commit.
