  deviation_p64_u3_float_boundary:
    classification: implementation_error (criteria layer); per-sample data unaffected
    description: B(u) = exp(ln(p/2)/(3u)) is computed in double precision. At p64 = 18446744073709551667 and u =
      3 the code gives 127.99999999999997. The exact value is (p/2)^(1/9) = 128.0000000000000000393..., so by the
      spec rule (B >= 128 and N*rho >= 30, N*rho = 4860.8) the cell is ADMISSIBLE, but admissible_cells.p64.json
      records it as inadmissible. The admissible_cells.p64.json file was written before the first p64 sample, as
      required. No other (prime, u) grid point has B within float error of 128.
    unaffected: Smooth counts (no integer lies strictly between 127.99999999999997 and 128.00000000000000004), all
      per-sample and per-null records, every other cell, and the other primes.
    reading_1_frozen_code:
      p64_admissible_u:
      - 1.5
      - 2
      - 2.5
      outcome_code: FC-VOID
    reading_2_u3_admitted_from_recorded_values:
      p64_admissible_u:
      - 1.5
      - 2
      - 2.5
      - 3
      p64_u3_cell:
        B: 128.0
        rho_u: 0.048608388291131566
        S_delta: 6673
        f_emp: 0.06673
        wilson99:
        - 0.06472587182098491
        - 0.068791618397605
        wilson_upper_ge_rho: true
        T1: 0.9223220456116102
        T1_ci99:
        - 0.8827300600535848
        - 0.9636684852440889
        null2_over_rho: 1.4773170336343262
        null2_within_0.7_2.0: true
      NULL-2_bound_at_p64_u3: within [0.7, 2.0] (1.477)
      outcome_code: 'FC-VOID (unchanged: the failing cell is p96 u=4.5)'
    needs_reviewer_recomputation_from_samples:
    - 'SEED-1 at p64: the u=3 two-proportion test (R1 vs R2) and the Bonferroni family size 5 (threshold 0.002).
      Recorded members, minimum p = 0.0771, are not affected by the tighter threshold.'
    - 'KS-1 at p64: the u=3 two-proportion test (KS1 arm vs main) and family size 5. Recorded minimum p = 0.1244.'
    - 'START-2 at p64: the u=3 two-proportion test (START2 arm vs main) and family size 5. Recorded minimum p =
      0.2799.'
    - Any criterion input at p64 that depends on the admissible set (none is evaluated under SR-4).
    data_for_recomputation: 'samples.p64.jsonl.gz (160000 records: R1, R2, KS1, START2, PC3) and nulls.p64.jsonl.gz,
      in this run directory, under 50 MiB each. Every Stage-C per-sample and per-null record is in-repo.'
    handling: Frozen code and analysis_freeze were not changed (IV-5). The Coordinator resolves this at review with
      a validator recomputation of the admissible set in exact arithmetic.
  measurement_limitations:
  - 'manifest timing.cpu_seconds_children_* (210 s user) UNDERCOUNTS CPU: gp processes started inside multiprocessing
    pool workers are not reaped by wait(), so their rusage is not accumulated. Wall time (2105.8 s) and the sampled
    process-tree peak RSS (2.56 GB) are valid. Per-sample wall seconds are recorded in every sample record.'
