# EXP-PFDR-81e7c2
# Incomplete-sum threshold arithmetic. No character sum.
# Approved by DEC-20261002-689959.
experiment:
  id: EXP-PFDR-81e7c2
  hypothesis_id: H-PFDR-0bc09b
  source_idea: IDEA-20260928-fd7f5d
  question_id: RQ-PFDR-ae2fba
  version: 1
  title: Incomplete-sum threshold arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-689959
  objective: >-
    Check the gaps 311 and 132, the pair excess 222784, and the binomial
    shortfall 4.
  inputs:
    field_size: 4096
    character_order: 12
    product: 49152
    low_root: 221
    low_square: 48841
    low_gap: 311
    high_root: 222
    high_square: 49284
    high_gap: 132
    cube_root: 16
    cube: 4096
    root_shortfall: 205
    pair_square: 16777216
    written_pairs: 17000000
    pair_excess: 222784
    cutoff: 500
    binomial_32: 496
    binomial_shortfall: 4
    binomial_33: 528
    binomial_excess: 28
  controls:
    - >-
      Sixteen cubed is 4096. Reporting another cube invalidates the run.
    - >-
      49152 exceeds 221 squared by 311 and falls short of 222 squared by
      132. Reporting the square root as at most 221 invalidates the run.
    - >-
      17000000 exceeds 4096 squared by 222784. Reporting the square as at
      least 17000000 invalidates the run.
    - >-
      C(32, 2) is 496, which is 4 below 500. Reporting it as at least 500
      invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {threshold, binomial}
    - route in {squares, products}
  metrics:
    primary:
      - low_gap
      - pair_excess
      - implementations_agree
    secondary:
      - high_gap
      - binomial_shortfall
      - root_shortfall
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The gap below 49152 is 311 and the pair excess is 222784.
    formula: >-
      Compare 4096 times 12 with 221 squared and with 222 squared.
      Compare 17000000 with 4096 squared. Compare C(32, 2) and C(33, 2)
      with 500.
    source: >-
      IDEA-20260928-fd7f5d states the twelve-bit complete-sum scale and
      the written pair count near 1.7e7, read 2026-10-02. The squares
      were computed in this design session. That computation is not a
      run. No character sum was evaluated.
  scale_relevance:
    tier: toy
    justification: One field size and two binomials. No transfer to a character sum.
    correspondence: null
  tail_checks:
    - The binomial excess 28 at C(33, 2) is required. A check that stops at the two squares is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the cube disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - Sixteen cubed is not 4096.
    - The square root of 49152 is reported as at most 221.
    - 4096 squared is reported as at least 17000000.
    - C(32, 2) is reported as at least 500.
    - A character sum is evaluated or a bias verdict is stated.
  success_criterion: >-
    Both runs agree that 49152 exceeds 221 squared by 311, that 222
    squared exceeds 49152 by 132, that 17000000 exceeds 4096 squared by
    222784, and that C(32, 2) is 4 below 500.
  falsification_criterion: >-
    The runs agree, sixteen cubed is 4096, and 222 squared does not
    exceed 49152 by 132.
  required_artifacts:
    - experiments/EXP-PFDR-81e7c2/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-PFDR-81e7c2/runs/<RUN-ID>/command.txt
    - experiments/EXP-PFDR-81e7c2/runs/<RUN-ID>/stdout.log
    - experiments/EXP-PFDR-81e7c2/runs/<RUN-ID>/stderr.log
    - experiments/EXP-PFDR-81e7c2/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-PFDR-81e7c2/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any character sum, curve count, or bias verdict.
    - Any claim that a filter lifts a search.
    - Any measured Lambda.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
