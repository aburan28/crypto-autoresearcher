experiment:
  id: EXP-MCEGOP-9006b1
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-9c7e2d; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-9c7e2d
  question_id: RQ-MCE-e65b3c
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Square-code defect trajectories along single-coordinate shortening chains of toy Goppa,
    matched random and random alternant codes: lag-1 autocorrelation, total variation and distinct-value
    counts against a per-chain shuffle self-null and a verified closure check'
  objective: 'One uncertainty is reduced: whether a structural anomaly''s behaviour ALONG a family-preserving
    operation carries information that its value at a single point does not. Stated in parts: (i)
    CLOSURE, VERIFIED NOT ASSUMED -- does shortening a toy Goppa code at a support coordinate produce
    exactly the code built directly from the restricted support with the same Goppa polynomial? The
    entire mechanism rests on this and it is checked at every step of every chain before any statistic
    is computed, because a mechanism resting on an unverified closure is not a mechanism. (ii) ORDERING
    VERSUS VALUES -- do the chain functionals of a real Goppa trajectory differ from those of a random
    permutation of that same trajectory''s values? The shuffle has an identical value multiset, so
    any difference is pure ordering and is precisely the content this contract adds over a single-value
    measurement. If there is no difference, this contract is subsumed and should say so. (iii) WHICH
    FAMILY THE TRAJECTORY BELONGS TO -- do random alternant chains behave like Goppa chains? Alternant
    codes are also shortening-closed, so a match there means the statistic measures alternant closure,
    which is directly on the family axis that this program''s own corrected boundary records as decisive.
    Every arm runs in the same invocation on matched (n, k) with a shared coordinate order, and no
    arm sees any information the others do not.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support exactly this: that at the tested
      toy cells, over the declared coordinate orders and samplers, the measured chains had the reported
      autocorrelations, total variations and distinct-value counts per arm; that the closure check
      passed or failed at the reported rate; and that real chains stood in the reported relation to
      their own shuffles. What does NOT follow: nothing about Classic McEliece or any standardized
      parameter set; no distinguisher, since arms are compared with full knowledge of which is which;
      no claim that any chain statistic persists at lower rate or larger n, since every toy cell here
      is high-rate by construction; and no promotion of a confirmed algebraic closure property into
      a structural weakness of any kind.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes). Freeze cells, chain counts, coordinate-order generation,
      stopping rule and the three functionals before any run. STAGE 1 (cost: dependent). Load the
      certified fixture and the square-code routine and re-verify both against their recorded hashes
      and controls. STAGE 2 (cost: minutes per cell). For each Goppa key, shorten one coordinate at
      a time in a seeded order, and at EVERY step verify closure by constructing the code directly
      from the restricted support and comparing row spaces; abort on any mismatch. STAGE 3 (cost:
      minutes per cell). Compute k_i, the generic ceiling and D_i at every step; stop when k_i <=
      2 or the ceiling condition fails; record the stopping index. STAGE 4 (cost: as STAGE 3). Run
      matched random and random alternant chains under the identical coordinate order. STAGE 5 (cost:
      seconds). Compute the three functionals per chain; restrict to a common prefix length per cell
      for the cross-arm comparison and report the restriction. STAGE 6 (cost: seconds). Run 100 shuffles
      per chain and build the shuffle-null distribution of each functional. STAGE 7 (cost: minutes).
      Run the order-replication control on 5 codes per cell under three different orders. STAGE 8.
      Emit all raw chains, not only functionals. Total budget 2 CPU-hours.'
    instrument: Python 3.11 standard library only (numpy absent, verified). Consumes harness/goppa_toy.py
      from proposal 1 and the Schur-product routine from proposal 3; adds a shortening routine (delete
      a column, re-reduce, recompute a generator), a direct-construction comparator for the closure
      check, and plain-Python implementations of lag-1 autocorrelation, total variation and permutation
      shuffling via random.Random. Driven through harness/runner.py with domain-separated seeds. No
      Sage, no external package, no network.
    parameters: 'Cells: (m,t,n) in {(6,4,64), (6,3,48), (5,3,32), (4,2,16)}. 100 chains per arm per
      cell at the two largest cells, 20 per arm at the two smallest. Three arms: Goppa, matched random
      binary, random alternant, all at the Goppa arm''s measured k. Coordinate orders drawn once per
      chain from a seeded stream and shared across arms. Chain stopping rule: k_i <= 2 or k_i(k_i+1)/2
      < n_i. Common-prefix restriction for cross-arm comparison set at the 10th percentile of measured
      stopping indices in that cell. Shuffles: 100 per chain. Order-replication: 3 orders on 5 codes
      per cell.'
  controls:
  - 'Closure verification on every Goppa chain step: the shortened code must equal the directly constructed
    code on the restricted support.'
  - Matched random binary arm, same coordinate index sequence from the same seeded stream, same invocation.
  - Random alternant arm at matched (n,k), as the competing family explanation.
  - 'Shuffle self-null: 100 permutations of each chain''s own values, isolating ordering from value
    distribution.'
  - 'Order-replication control: the same starting code shortened under three different coordinate
    orders, to measure how much of the chain statistic is order-specific.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Three controls run in the same invocation, and the third is the decisive
    one. (1) MATCHED RANDOM ARM: 100 chains from random binary [n,k] codes at the Goppa arm''s measured
    k, shortened at the same coordinate index sequence from the same seeded stream. For the Goppa
    chains to mean anything the random arm must show measurably WEAKER lag-1 autocorrelation and larger
    total variation. (2) ALTERNANT ARM: 100 chains from random alternant codes at matched (n,k). Alternant
    codes are also closed under shortening, so if this arm behaves like the Goppa arm the statistic
    measures alternant closure, which is exactly the family axis RQ-MCE-3f7c02''s corrected boundary
    identifies as decisive and must be reported as such rather than as a Goppa result. (3) SHUFFLE
    SELF-NULL: for every chain in every arm, recompute the three functionals on a random permutation
    of that same chain''s values. The shuffle has the identical value multiset, so any difference
    between a chain and its shuffle is pure ordering. If Goppa chains do not differ from their own
    shuffles, this proposal measures nothing beyond proposal 3''s value distribution and is subsumed
    by it -- a clean, cheap self-refutation.'
  independent_variables:
  - cell (m, t, n)
  - arm (goppa | random-binary | random-alternant)
  - chain index / coordinate order
  - condition (real chain | shuffled chain)
  metrics:
    primary:
    - lag-1 autocorrelation per chain
    - total variation per chain
    - distinct-value count per chain
    - closure-verification pass rate
    secondary:
    - measured stopping index distribution per arm
    - shuffle-null mean and interval per functional per chain
    - order-replication spread
    - full raw chains
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The lag-1 autocorrelation of the normalised square-code defect along the chain, per
      arm, and the gap between each real chain's total variation and its own shuffle-null mean.
    formula: 'Let d_i = D_i / ceiling_i with ceiling_i = min(n_i, k_i(k_i+1)/2). Lag-1 autocorrelation
      r = sum over i of (d_i - dbar)(d_{i+1} - dbar) divided by sum over i of (d_i - dbar)^2, computed
      on the common prefix. Total variation TV = sum over i of |d_{i+1} - d_i|. Pre-registered: r(goppa)
      >= 0.7 at (6,4,64); r(goppa) > r(random) at every cell; TV(real Goppa chain) <= mean TV of its
      100 shuffles minus 0.2.'
    source: Pre-registered in the parent proposal IDEA-20260816-9c7e2d before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Cells at m <= 6, n <= 64, inside RQ-MCE-b38a8b''s toy boundary. Chain length is
      the binding scale parameter and it is measured rather than assumed: the longest available chain
      starts at (6,4,64) with k = 40 and is still short by time-series standards, which is why the
      autocorrelation is reported with its chain length attached and why cells whose chains fall below
      6 steps are excluded from that comparison. NO transfer assumption is made in any direction;
      the high-rate confound present in every toy square-code measurement in this bucket is present
      here unchanged and is not mitigated by forming chains.'
    correspondence: null
  tail_checks:
  - Chains whose measured stopping index is far below the cell's median are reported individually,
    since an early stop is itself a structural observation.
  - 'The first and last steps of every chain are inspected separately: the first is closest to the
    full code and the last is nearest degeneracy, and both are where a functional is most fragile.'
  - Any Goppa chain that is constant (autocorrelation undefined) is reported as such and excluded
    from the autocorrelation statistic rather than assigned a value.
  - Alternant chains that coincide exactly with a Goppa chain are detected by code equality and counted.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort the entire contract on any closure-verification failure and report the failing step, since
    the mechanism has no basis without it.
  - Exclude from the autocorrelation comparison any cell whose common-prefix length falls below 6,
    reporting it as too short.
  - Cap total wall-clock at 2 CPU-hours and report unreached cells.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The closure check passes at every step of every Goppa chain, all raw chains are
    emitted for all three arms, each real chain is compared against its own 100-shuffle null on all
    three functionals, and the cross-arm comparison is reported on a stated common prefix with the
    chain-length distribution attached.
  falsification_criterion:
  - Any closure-verification failure.
  - Goppa chains indistinguishable from their own shuffles on all three functionals.
  - Random-arm autocorrelation greater than or equal to the Goppa arm's.
  - Alternant chains statistically identical to Goppa chains, which forbids any Goppa-specific reading.
  - Common-prefix length below 6 in every cell, making the whole comparison uninterpretable.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-9c7e2d
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The normalisation of D_i by the generic ceiling is a choice; an unnormalised chain would have
    a different autocorrelation and the Coordinator must freeze one before results are seen.
  - Whether chains from the same code under different coordinate orders count as replicates or as
    distinct objects affects every interval reported and must be settled in advance.
  - The common-prefix rule (10th percentile of stopping indices) is asserted rather than derived and
    biases the comparison toward short chains; an alternative length-adjusted statistic should be
    considered before freezing.
  - This contract inherits two dependencies (proposals 1 and 3); the Coordinator must decide whether
    it may run before both have passed their own controls.
