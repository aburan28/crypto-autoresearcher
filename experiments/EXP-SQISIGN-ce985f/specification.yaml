experiment:
  id: EXP-SQISIGN-ce985f
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-SQISIGN-ce323c
  question_id: RQ-SQISIGN-001
  goal_id: GOAL-SQISIGN-001
  batch_id: null
  assigned_to: executor
  title: >-
    Review-required contract: extend the S3-2 toy-signer cancellation audit
    to E_aux, using the theorem-dead response-codomain coincidence stream as
    the required negative control, with an algebraic kill-early gate run
    before any compute

  objective: >-
    If separately approved, frozen, authorized, AND run only after
    GOAL-SQISIGN-001 is activated (see goal_activation_blocker below),
    attempt the one-hour algebraic kill-early on J_i^aux; if it does not
    close the question, run a paired toy-signer measurement of the
    coincidence-partition Poisson law on both the response-codomain stream
    (theorem-backed control) and the E_aux stream (open arm), under
    identical code on identical batches. This contract is an instrument
    design and a pre-execution declaration. No run has happened.

  what_this_is_not:
    - Not an attack on SQIsign, not a key recovery, and not a certificate of any kind.
    - Not a claim that the response-codomain cancellation theorem is being tested; it is used as a proven, fixed reference.
    - Not a claim about crypto-scale behaviour; every measured number is toy-scale by construction.
    - Not an approval, a freezing, an execution authorization, a run, an observation, or evidence.
    - Not a reopening of GOAL-SQISIGN-001's activation decision; that is exclusively a Coordinator matter.

  goal_activation_blocker: >-
    GOAL-SQISIGN-001 is currently status draft with dispatch_queue_path
    null, as verified against ledger/goals/GOAL-SQISIGN-001.yaml at contract
    drafting time. NOTHING CAN BE EXECUTED UNDER THIS GOAL AS IT STANDS. This
    contract may be reviewed and even frozen in advance, but
    execution_authorized may not become true, and no run may occur
    (including the zero-compute kill-early stage, for ledger consistency
    with the sibling contract EXP-SQISIGN-be5bb2), until a Coordinator
    decision moves GOAL-SQISIGN-001 out of draft and assigns it a
    dispatch_queue_path. This mirrors EXP-MLKEM-bfdb63's honest disclosure
    that its own goal is closed_at_budget and the contract would run only
    under a successor goal.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      TOY ONLY, per CEILING-S3(ii). A completed run could support, at most:
      (1) the algebraic kill-early verdict (extends by algebra, or not),
      recorded before any measurement; (2) IF the kill-early does not close
      the question, the response-arm Poisson goodness-of-fit and
      across-key-independence verdict at the declared alpha; (3) the E_aux-arm
      Poisson goodness-of-fit and across-key-independence verdict under the
      identical test, reported ONLY IF the response arm passed its own gate.
      NOTHING ELSE. No outcome may be quoted as evidence about the
      endomorphism-ring problem's hardness, about EUF-CMA, or as a
      crypto-scale conclusion.

  inputs:
    toy_signer:
      source: "S3-2's toy signer, both arms (translation-shaped, simulator-shaped), reused unmodified"
    commitment_walk_length:
      source: "IDEA-20260805-bb4bf8's TV curve computation, consumed as an input, not re-derived"
      dependency_note: >-
        CHARGED AND NAMED AS A DEPENDENCY, NOT A SAVING. If bb4bf8's number
        is unavailable at execution time, this contract's stage 2 onward
        must be deferred rather than run at a guessed walk length; deferral
        is an infrastructure outcome, not a negative finding.
    graph_parameters:
      primes: [8192, 32768]
      batch_sizes: [100, 200, 400]
      keys: 8
      replicates: 3
      alpha: 0.01
    seeds:
      master_seed: 78134092
      domain: "EXP-SQISIGN-ce985f/v1"
      seed_derivation_rule: >-
        ASCII bytes of domain || "|" || label || "|" || decimal(p) || "|" ||
        decimal(key_index) || "|" || decimal(replicate) || "|" ||
        decimal(sig_ordinal), hashed with SHA-256; digest integers
        interpreted big-endian unsigned. Labels exactly one of
        {"key", "commitment", "challenge", "response"}. Reproduces every
        instance bit-for-bit from (master_seed, domain, label, p, key_index,
        replicate, sig_ordinal) and nothing else.

  arms_and_controls:
    treatment: >-
      The E_aux arm. Per (p, q, replicate): the toy signer's E_aux curve
      symbols across the batch, coincidence-partition extracted, Poisson
      goodness-of-fit and across-key dispersion test applied.
    measured_null: not_applicable_reason -- no random-sampling null distinct from the response-codomain control; the theorem-backed stream itself is the required reference, not a separately constructed null.
    positive_control: >-
      THE RESPONSE-CODOMAIN STREAM, RUN THROUGH IDENTICAL CODE ON THE
      IDENTICAL BATCH, AND ITS KNOWN-ANSWER GATE MUST PASS FIRST. Poisson
      goodness-of-fit and key-independence within the pre-registered band is
      proven by IDEA-20260805-18a4d4 and MUST hold; failure here means the
      instrument, not the theorem, is at fault, and NO E_AUX NUMBER MAY BE
      REPORTED FROM ANY ARM.
    kill_early_gate: >-
      Stage 1 (zero compute, ~1 hour): attempt to extend 18a4d4's
      cancellation to J_i^aux by writing the ideal explicitly and checking
      whether conj(I_tau) pairs with I_tau there too. If it extends by
      algebra, the contract terminates with a one-page proof and stages 2+
      do not run.
    planted_second_rung: >-
      A planted signer whose E_aux is drawn from a deliberately
      key-dependent sub-region must be flagged at the pre-registered effect
      size, run after the primary response-arm gate passes and before the
      primary E_aux finding is trusted as a clean negative.
    ordering_control: >-
      The kill-early gate runs before any compute. The response-arm
      known-answer gate is evaluated and committed before the E_aux arm's
      numbers are read, on every batch.
    comparability_policy: >-
      No number from this contract may be compared with any figure from
      S3-2, S3-8, or any other slice entry except via the shared toy signer
      code path and the shared Poisson null.

  stages_cheapest_first:
    - id: stage-1-algebraic-kill-early
      cost: "zero compute, ~1 hour"
      content: "Write J_i^aux explicitly and check whether conj(I_tau) pairs with I_tau there too."
      can_terminate_run: true
      termination_rule: "If the identity extends by algebra, the contract terminates here with a one-page proof; no measurement stage runs."
    - id: stage-2-toy-signer-batches
      cost: "up to 3 CPU-hours, hard cap"
      content: >-
        Run the toy signer in both S3-2 arms across the declared
        (p, q, K, replicate) grid, using bb4bf8's commitment-walk length.
      can_terminate_run: true
      termination_rule: "Absence of the bb4bf8 walk-length number defers this stage; it is not run at a guessed length."
    - id: stage-3-response-arm-gate
      cost: "minutes"
      content: "Poisson goodness-of-fit and across-key dispersion test on the response-codomain stream."
      can_terminate_run: true
      termination_rule: "Any failure (dispersion above band in >=1 of 3 replicates) halts the package; no E_aux number is read."
    - id: stage-4-e_aux-arm
      cost: "minutes"
      content: "Identical Poisson and dispersion tests on the E_aux stream, plus the planted-deviation second rung."
      can_terminate_run: false
      termination_rule: not_applicable

  metrics:
    primary:
      - "kill-early verdict (extends / does not extend), recorded before any measurement."
      - "response-arm Poisson goodness-of-fit statistic and across-key dispersion test result per (p,q,replicate)."
      - "E_aux-arm Poisson goodness-of-fit statistic and across-key dispersion test result per (p,q,replicate)."
    secondary:
      - "planted-deviation second-rung detection verdict at the pre-registered effect size."

  heuristic_under_test: HEUR-SQ-ce323c-1

  preregistered_prediction:
    quantity: "coincident-pair count per stream per batch"
    formula: "Poisson(C(q,2)/n), n ~ p/12; at p=2^15 (n~2730), q=200, mean ~ 7.29"
    source: "Response arm: IDEA-20260805-18a4d4's theorem, cited not re-derived. E_aux arm: the empirical extension under test in H-SQISIGN-ce323c, HEUR-SQ-ce323c-1."

  scale_relevance:
    tier: toy
    justification: >-
      p in {2^13, 2^15} are toy-scale graphs (n ~ 683 and ~2730 vertices);
      the response arm's law is a theorem and holds at every scale in
      principle, but the E_aux arm's result, whatever it is, is a toy-scale
      statement about a toy signer and must not be reported as scale-
      independent.
    correspondence: null

  tail_checks:
    - "Largest batch (q=400) at the larger prime (p=2^15): verify both streams' goodness-of-fit explicitly at this extreme cell, since it has the most statistical power to detect a deviation."

  replication:
    seeds: [78134092, 78134093, 78134094]
    independent_instances: 3
    interpretation: >-
      Three replicates per (p, q, K) cell as declared in the source
      catalogue entry; across-key dispersion is tested within each
      replicate and consistency across replicates is reported, not pooled
      silently.

  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 3
    maximum_memory_gb: 4
    maximum_runs: 3
    maximum_workers: 1

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived, AND GOAL-SQISIGN-001 has been activated with a dispatch_queue_path.
    - Stop at stage 1 if the algebraic kill-early closes the question; do not proceed to measurement.
    - Stop the whole package if the response-arm gate fails in >=1 of 3 replicates.
    - Stop stage 2 if bb4bf8's commitment-walk-length number is unavailable; defer rather than guess.
    - Stop at the first budget, memory, or wall-clock ceiling and record what was covered rather than truncating silently.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any execution while GOAL-SQISIGN-001 remains status draft with dispatch_queue_path null.
    - Any E_aux number reported before the response-arm known-answer gate is committed and passed.
    - Any commitment-walk length used that was not sourced from bb4bf8's TV computation.
    - Any change to the Poisson-fit or dispersion-test parameters after any number has been observed.

  success_criterion: >-
    This contract has no current success outcome because it is not
    authorized for execution and its goal is not yet activated. IF a
    separately approved, frozen successor is executed under an activated
    GOAL-SQISIGN-001, its only positive disposition is: EITHER the
    kill-early closes the question with a one-page proof, OR the
    response-arm gate passes and the E_aux arm's Poisson/dispersion verdict
    is reported (whichever of F7a/F7b/F7c it is) together with the planted-
    deviation second rung's detection verdict. THAT DISPOSITION ESTABLISHES
    NO ATTACK, NO ENDOMORPHISM-RING HARDNESS CONCLUSION, AND NO CRYPTO-SCALE
    RESULT.

  falsification_criterion: >-
    H-SQISIGN-ce323c (specifically HEUR-SQ-ce323c-1) is falsified, weakened,
    or supported by exactly one of: (F7a) the response arm shows across-key
    dispersion above the band in >=1 of 3 replicates -- instrument void, the
    theorem cannot be wrong, the toy signer can be, and no E_aux number is
    reportable; (F7b) the E_aux arm matches the response arm within the band
    at both primes and all q -- the heuristic is SUPPORTED, the
    cancellation extends empirically (the catalogue entry's own predicted,
    still-valuable outcome); (F7c) both arms deviate from Poisson -- the
    graph is too small or the walk is unmixed, and the measurement is
    scale-bound and uninformative, neither supporting nor refuting the
    heuristic.

  outcomes:
    no_execution_authorization: >-
      The only current disposition: a review_required draft blocked on both
      Coordinator approval AND goal activation. No run, no observation, no
      evidence, no inference.
    future_complete_readout: >-
      Only after separate approval, freezing, authorization under an
      activated GOAL-SQISIGN-001, and valid execution; scoped toy-only.
    infrastructure_or_integrity_failure: >-
      A timeout, crash, or missing dependency (including an unavailable
      bb4bf8 walk-length number) is INFRASTRUCTURE SIGNAL and is NEVER
      negative mathematical evidence against H-SQISIGN-ce323c or against
      IDEA-20260805-18a4d4's theorem (AGENTS.md rule 5).

  required_artifacts_if_later_authorized:
    - Frozen approved specification with a freeze receipt binding its SHA-256.
    - The stage-1 kill-early derivation note in full (proof attempt and its outcome).
    - Raw per-signature records: (p, key_index, replicate, sig_ordinal, response_codomain_label, E_aux_label), one JSON object per line, sorted keys, UTF-8.
    - Response-arm and E_aux-arm Poisson goodness-of-fit and dispersion-test statistics per (p,q,replicate).
    - The planted-deviation second-rung detection log.
    - Manifest, environment, exact argv, stdout, stderr, timestamps.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - Independent review confirms the kill-early derivation attempt is genuine (not a placeholder) before any compute is authorized.
    - Independent review confirms the response-arm gate can actually fail (i.e., the dispersion test has real power at the declared batch sizes) before it is trusted as a control.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
    - >-
      REQUIRED, NOT OPTIONAL: a Coordinator decision activating GOAL-SQISIGN-001
      (status draft -> active or equivalent, with a dispatch_queue_path
      assigned) must exist before execution_authorized may become true. This
      contract's approval and this goal's activation are two separate
      Coordinator decisions and neither substitutes for the other.

  approval_status: >-
    Pending review AND pending goal activation. No approved_by field is
    present because this draft is not approved and only the Coordinator may
    approve it (AGENTS.md rule 1); even if approved, execution remains
    blocked until GOAL-SQISIGN-001 leaves draft status.
  approved_by: null
