      extrapolation over more than 200 bits.
    correspondence: null

  tail_checks:
    - >-
      c(O) = 138 exactly, the negation-closure tell: negation closure forces
      c(O) >= B, so a value below B is a bug and a value far above it would indicate
      a different base than the one declared.
    - >-
      The maximum arity-2 decomposition count (frozen anchor 138) and the
      unreachable-target count (3704), which respond to clustering far more sharply
      than the variance does.
    - >-
      The matched null's RANGE (2.7628-3.1316) rather than only its mean, so that the
      box's 2.8875 is read against the null's spread and not against a point value.
    - >-
      Zero false negatives AND zero false positives in anchor (a), separately
      reported, because a one-sided check would pass on a vacuous predicate.

