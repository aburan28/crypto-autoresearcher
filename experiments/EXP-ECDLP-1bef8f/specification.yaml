  heuristic_under_test: null
  heuristic_under_test_note: >-
    NO heuristic is under test at Stage 0. HEUR-1, HEUR-2 and HEUR-3 of
    H-ECDLP-b97b72 are carried below with their rigorous support and validation
    routes intact, because the contract must show where each would be discharged —
    but their validation lives in Stages 1-3, which are unauthorized. Stage 0
    recomputes one dispersion cell and five box counts as FIXTURES; no heuristic
    gains any support from that.

  heuristic_assumptions:
    carried_verbatim_from: IDEA-20260913-c5f90d
    canonical_record: ledger/hypotheses/H-ECDLP-b97b72.yaml
    entries:
      - id: HEUR-1
        proposal_id: H1-IDEA-20260913-c5f90d
        statement: >-
          For the height box F_H = {x in F_p : ht(x) <= H} with H = o(p^{1/2}), the
          induced curve base F = {P in E(F_p) : x(P) in F_H} behaves with respect to
          ADDITIVE statistics on E(F_p) like a uniformly random negation-closed base
          of the same size. Formally: the arity-m decomposition count c_m(R) over
          targets R has the same first two moments as for a uniformly random
          negation-closed base of size |F|, up to O(|F|^m * n^{-3/2}).
        rigorous_support: >-
          The first moment needs no heuristic at all: KN-FIND-007's conservation
          identity fixes the mean at C(B+m-1, m)/n exactly, whatever the base. The
          heuristic half is the SECOND moment — that the height box has no additive
          structure on the curve beyond the random model. It imitates the classical
          statement that a Farey-type set of rationals of bounded height is
          equidistributed modulo p with square-root-cancellation error, the additive
          analogue of the Weyl/Kloosterman bounds for such sets.
        random_model_justification: >-
          Comparison law: the balls-in-bins distribution of the decomposition count
          for a uniformly random negation-closed base of the same size, whose
          dispersion index at the frozen cell is 2.9163 (range 2.7628-3.1316, seed
          20260913, 60 draws). No smoothness law and no Dickman-de Bruijn statement
          is involved; the size function here is Archimedean height, not
          multiplicative smoothness, which is exactly the difference between this
          base and the F_p^* rational sieve.
        validation_route: >-
          Stages 2-3, UNAUTHORIZED. The complete decomposition-count vector over all
          n targets at every H on a declared ladder and at three field sizes
          (p = 10007 exactly enumerable, p near 2^20 and 2^26 by the same exact
          enumeration with the group indexed once); 60 seeded negation-closed random
          bases per cell compared by a two-sample test against the frozen anchors
          2.8875 against 2.9163 and 3704 against 3712.3; tail check on the maximum
          decomposition count and the count of targets with c_m = 0. TRANSFER
          ASSUMPTION: validated only at p <= 2^26 and H <= 32, and its use at
          cryptographic p with H = p^{1/(2m)} is an EXTRAPOLATION over more than 200
          bits, labelled as one wherever it appears.
        stage0_contribution: >-
          NONE beyond fixture reproduction of the single frozen cell.
        falsification_condition: >-
          A dispersion index or unreachable-target count outside the matched null's
          range at the 1 per cent level, WITH the separation growing along the
          p-ladder.
      - id: HEUR-2
        proposal_id: H2-IDEA-20260913-c5f90d
        statement: >-
          There is no declared small-root method achieving gamma_m >= 1 for the
          homogenised arity-m box relation equation; formally, for the 9-monomial
          degree-4 support of the arity-2 form F(alpha_1, beta_1, alpha_2, beta_2)
          the achievable exponent satisfies gamma_2 < 1 strictly, and gamma_m is
          non-increasing in m because the per-variable degree of the homogenised
          f_{m+1} grows like 2^{m-2}.
        rigorous_support: >-
          The rigorous ingredient is the requirement side, which is exact algebra:
          the density condition forces the product of the 2m unknown bounds to equal
          n/c_H^m = p^{1+o(1)} for every m, and p is the uniqueness threshold for a
          single modular equation (below it a random equation has no box root, so a
          method that worked above it would be returning roots that need not exist).
          The heuristic half is that the achievable exponent for a given support is
          what the declared shift-polynomial strategy delivers — the univariate
          anchor 1/d = 1/4 is rigorous (provenance `recalled`), the multivariate
          extension is heuristic, and the record asks for the number rather than
          assuming it. It imitates the classical pattern that lattice small-root
          bounds degrade with the number of unknowns, the analogue of the
          Minkowski/LLL gap growing with dimension.
        random_model_justification: >-
          Comparison law: a RANDOM 9-monomial degree-4 form modulo p with the same
          support and random coefficients. The Semaev form must not do better than
          its random-support twin; if it does, the advantage is a property of the
          elliptic structure and is a finding in its own right, and if it does not,
          gamma_2 is a support-level quantity and transfers to every curve.
        validation_route: >-
          Stage 1, UNAUTHORIZED, and Stage 2 for the empirical half. Recomputation of
          the shift-polynomial set, the lattice dimension and its determinant, and
          the derived bound, for both the Semaev support and 100 seeded
          random-coefficient twins; PLANTED instances from the frozen cell for the
          empirical half; the achieved root bound against the predicted gamma and
          against the rigorous univariate anchor p^{1/4} on the positive control;
          tail check on the fraction of successful reductions returning algebraically
          DEPENDENT polynomials, the standard failure mode of multivariate small-root
          methods, which must be reported rather than discarded. TRANSFER
          ASSUMPTION: gamma at arity 2 and 3 says nothing about arity 5 except
          through the stated monotonicity, itself part of the heuristic and
          separately falsifiable.
        stage0_contribution: >-
          NONE. Stage 0 reports no gamma; a Stage 0 run that reports one is invalid.
          Stage 0 does, however, freeze the support (anchor (c)) that Stage 1's
          computation would consume, and rejects KF-3.
        falsification_condition: >-
          A declared, reproducible construction with gamma_2 >= 1 whose univariate
          positive control passes and whose recovered integers verify as a genuine
          curve relation.
      - id: HEUR-3
        proposal_id: H3-IDEA-20260913-c5f90d
        statement: >-
          The box constant c_H = |F_H|/H^2 converges to a limit of order 1 as H grows
          with H = o(p^{1/2}), so that B = c_H*H^2 with c_H bounded away from 0 and
          infinity, and the exponent bookkeeping is unaffected by the constant.
        rigorous_support: >-
          Rigorous half: |F_H| <= (2H+1)*H trivially, and |F_H| >= (a positive
          constant)*H^2 for H = o(p^{1/2}) because distinct coprime pairs with
          |alpha| <= H, 1 <= beta <= H give distinct residues once H^2 < p/2. The
          heuristic half is only the existence of a limit and its value. It imitates
          the classical Farey-fraction count 6/pi^2 * (2H)*H for coprime pairs in a
          box.
        random_model_justification: >-
          Comparison law: the Farey count with coprimality density 6/pi^2, giving
          c_H -> 12/pi^2 = 1.216 in the asymmetric normalisation used here. The
          frozen exact counts c_H = 1.438, 1.560, 1.306, 1.370, 1.270 at
          H = 4, 5, 6, 9, 10 bracket that value and are consistent with slow
          convergence from above.
        validation_route: >-
          Stage 3, UNAUTHORIZED: exact counts of |F_H| for all H up to 200 at three
          field sizes against the Farey prediction 12/pi^2 * H^2, with a tail check
          locating the largest H at which |F_H| still grows quadratically before
          saturating toward p. TRANSFER ASSUMPTION: c_H enters the bookkeeping only
          through c_H^m, which is p^{o(1)} for fixed m and is NOT p^{o(1)} if m grows
          with p.
        stage0_contribution: >-
          FIXTURE ONLY: five exact |F_H| values at one field size. No convergence
          claim may be read from five points at one p.
        falsification_condition: >-
          |F_H|/H^2 drifting outside [0.5, 3] for H up to 200 at any field size, or
          failing to stabilise.

  proof_search_map:
    canonical_record: ledger/hypotheses/H-ECDLP-b97b72.yaml
    present_before_approval: true
    protocol_reference: >-
      docs/inventor-protocol.md section 8 and KN-TECH-080. This is a proof-oriented
      proposal (an asymptotic bound plus a closure argument), so the map is required
      before the Coordinator approves implementation or expensive experiments. It is
      recorded in full on H-ECDLP-b97b72 and mirrored here in the four audits so the
      frozen contract itself carries the gate.
    audits:
      - audit: baseline_reproduction
        applies: true
        content: >-
          Bottleneck: gamma_m against gamma_req = 1. Baseline slices: at
          H = (4p/3)^{1/2} the box is all of F_p and the cost formula
          max(B*search, B^2) must return p; at m = 1 the relation search IS the
          ECDLP and the charge must be p; at H = 1 the formula must DIVERGE rather
          than return a small number, with no end special-cased. Frozen fixture:
          Stage 0 anchor (a), 6441 realisable ordered x-triples at
          (p, a, b) = (101, 3, 5) with zero errors in both directions, which is the
          baseline reproduction for the relation condition and is the only part of
          this audit Stage 0 executes.
      - audit: observation_collision
        applies: true
        content: >-
          Run, and SUCCESSFUL — a collision was found. See
          observation_collision_limit above, which is binding on this contract: the
          density observable does not identify the height box, no claim may be
          founded on it, and any successor reporting a coverage advantage has
          collided with the null and must say so.
      - audit: quantifier_order
        applies: true
        content: >-
          FOR ALL odd p, FOR ALL H in [1, (4p/3)^{1/2}], THERE EXISTS a base of size
          c_H*H^2 with polylog membership; and FOR ALL m, the density condition
          B^m ~ n IMPLIES the product of the 2m unknown bounds is n/c_H^m. The cost
          claim is strictly weaker and separate: FOR the declared shift-polynomial
          strategies, THERE EXISTS a computable gamma_m, and gamma_m < 1 is a
          PREDICTION about those strategies. THE READING NOT CLAIMED: "FOR ALL
          small-root methods, gamma_m < 1", which no computation in this design can
          establish and which the LEAD branch is allowed to refute.
      - audit: method_ceiling_and_nearby_object
        applies: true
        content: >-
          Ceiling: at most "for the declared supports, strategies and
          implementations, the achievable exponent is [these numbers] against a
          requirement of 1, the univariate positive control passed, and no declared
          strategy reached the threshold". Under the Stage-0-only authorization the
          ceiling is lower still and is recorded as claim_ceiling above. Nearby
          objects, both specified and both unauthorized: the univariate degree-4
          instance with a root below p^{1/4} where small-root solving provably works
          (a pipeline failing there has no power and reports UNTESTED), and the
          random 9-monomial degree-4 twin where the curve structure is absent (a
          pipeline solving it at the threshold shows gamma is a support property, not
          a curve property).
    not_applicable_reason: null

  scale_relevance:
    tier: toy
    justification: >-
      Two toy cells: p = 101 (#E = 115) and p = 10007 (n = 9851 prime, n != p), with
      the box ladder H = 4, 5, 6, 9, 10. At p = 10007, H = 10 the box holds 1.27 per
      cent of F_p, FAR larger than any cryptographic analogue, which biases every
      density measurement toward apparent structure. This is disclosed, not
      controlled: the p-ladder is the only available defence and it is Stage 3 and
      unauthorized. NO transfer to cryptographic parameters is claimed by any Stage 0
