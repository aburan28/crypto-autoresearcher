  stopping_rules:
    - >-
      ANY DISAGREEMENT BETWEEN A STAGE 0 MEASUREMENT AND ITS PRE-REGISTERED ANCHOR
      STOPS THE RECORD. Stop at the first mismatch, report it with both values, and
      classify it as a FIXTURE DEFECT. Stopping is an observation ABOUT THE ANCHORS
      — that a number frozen during ideation does not reproduce — and it is NOT
      negative mathematical evidence about the ECDLP, about the height box, about
      the density condition, or about gamma_m. The remedy is a superseding record,
      never an edit of an anchor.
    - >-
      Stop at the first failed known-false control (KF-1, KF-2, KF-3) and classify it
      as a procedure defect rather than as evidence about the object: a pipeline that
      accepts a claim known to be false has not measured the object.
    - >-
      Stop at the first failed invalid-input refusal (INV-1, INV-2, INV-3).
    - >-
      Stop after the primary gates are recorded. Do not proceed to Stage 1, 2 or 3
      under any outcome: both a clean pass and a stop leave Stages 1-3 unauthorized,
      and each needs its own Coordinator decision.
    - >-
      A timeout, crash, or memory exhaustion is failed_infrastructure under AGENTS.md
      rule 5, never a mathematical miss and never evidence about any anchor.
    - >-
      Carried forward for the unauthorized stages so a later authorization cannot
      quietly drop them: stop after Stage 1 if gamma_2 <= 0.9 and gamma_3 <= gamma_2
      (BR-CLOSURE; no sampling is then authorized); stop and route to independent
      review-breakthrough at max effort before any interpretation if gamma_2 >= 1.0
      (BR-LEAD); stop and report UNTESTED if the univariate small-root positive
      control fails.

  invalidation_rules:
    - Missing or unwritten declared artifact paths invalidate the run.
    - >-
      Overwriting an existing run record invalidates the procedure; run records are
      immutable and a correction is a new record.
    - >-
      Reporting any value, bound or estimate of gamma_2, gamma_3 or gamma_m
      invalidates the run: that is Stage 1 work and it is unauthorized.
    - >-
      Building a lattice, running LLL/BKZ, or constructing a shift-polynomial set
      invalidates the run for the same reason.
    - >-
      Any certificate kind other than `none`, any claimed ECDLP solve, or any
      recovered scalar invalidates the run.
    - >-
      Founding any reported conclusion on the density observable — in either
      direction — invalidates the interpretation, per observation_collision_limit.
    - >-
      Editing any pre-registered anchor, or re-scoring the run against a changed
      anchor, invalidates the run. Anchors change only through a versioned
      protocol_amendment, and runs already executed are never silently re-scored.
    - >-
      A matched-null draw set not reproducible from seed 20260913 invalidates the
      dispersion comparison.
    - >-
      Floating-point arithmetic anywhere in a pre-registered integer anchor
      invalidates that anchor's measurement; c_H and the pinning ratio are derived
      from exact integer counts and reported to the frozen precision.

  success_criterion: >-
    ALL primary gates true on one Stage 0 run: the five anchors (a)-(e) reproduce
    exactly — 6441 realisable ordered x-triples at (101, 3, 5) with zero false
