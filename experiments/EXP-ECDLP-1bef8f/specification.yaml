    no gamma reported.
  falsification_criterion: >-
    After fixture_pass, ANY mismatch between a measured Stage 0 quantity and its
    pre-registered anchor, or ANY known-false claim accepted, or ANY invalid input
    not refused. That falsifies the Stage 0 INSTRUMENT and the frozen anchors at
    these two toy cells and nothing else: it is an observation about the anchors,
    explicitly NOT negative mathematical evidence about the ECDLP, the height box,
    the density condition, or gamma_m, and explicitly not support for the
    hypothesis' negation. A distinguishable, recordable negative outcome therefore
    exists for every primary gate, which is what makes this contract decidable.
  success_criteria:
    - All primary gates true, certificate kind none, and no gamma reported.
    - >-
