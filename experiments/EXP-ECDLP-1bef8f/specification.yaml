experiment:
  id: EXP-ECDLP-1bef8f
  hypothesis_id: H-ECDLP-b97b72
  version: 1
  title: >-
    Height-box factor base Stage 0 fixture calibrator: the f_3 relation
    condition, the asymmetric-height box counts, the 9-monomial homogenised
    support, the pinning ratio, and the dispersion cell with its matched null
  status: approved
  approved_by: coordinator
  approved_at: '2026-09-13'
  approval_decision: DEC-20260913-0f8468
  approval_basis: >-
    Standing user authorization recorded in AGENTS.md on 2026-09-06 ("all is
    approved. ideas/experiments should be always approved" — ideas and
    experiments are always approved once the protocol is complete). The
    Coordinator completeness check is DEC-20260913-0f8468, recorded under
    TASK-20260913-1871bd. User confirmation is not an outstanding gate.
    Approval authorizes Stage 0 work only and asserts nothing about whether
    H-ECDLP-b97b72 is true.
  frozen: true
  frozen_at: '2026-09-13'
  execution_authorized: true
  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260913-0f8468
  execution_authorized_note: >-
    STAGE 0 ONLY. Stages 1, 2 and 3 are fully specified below and are explicitly
    NOT AUTHORIZED; each requires its own later Coordinator decision before any
    of its work is performed. In particular this approval does not authorize:
    the gamma_2 / gamma_3 symbolic computation (Stage 1), any shift-polynomial
    set, any lattice construction or LLL/BKZ reduction, any planted lattice
    instance (Stage 2), or the p-ladder at three field sizes and two arities
    (Stage 3). It does not solve any ECDLP instance, does not recover any
    scalar, does not compute or estimate any value of gamma_m, does not run
    descent, does not run a Groebner-basis relation search, and does not
    authorize Stage 1 or later of any sibling GOAL-ECDLP-001 experiment.
  evidence_eligible: false
  evidence_eligible_note: >-
    Stage 0 is a fixture reproduction. Its output is an observation about the
    frozen anchors and is not eligible to move any hypothesis status; an
    evidence record and an official decision are separate later tasks.
  claim_ceiling: stage0_fixture_reproduction_only
  claim_ceiling_note: >-
    The strongest claim any Stage 0 run of this contract may support is that the
    five declared fixture anchors (a)-(e) reproduce exactly under independent
    recomputation and that the three known-false claims are rejected. No claim
    about gamma_m, about whether the size-function lane is open or closed, about
    additive structure in the height box, about coverage, or about the ECDLP may
    be read from this run at any strength.
  designed_by: coordinator
  designed_under_task: TASK-20260913-1871bd
  source_proposal: IDEA-20260913-c5f90d
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-e5c603
  class: measurement
  certificate:
    kind: none
    note: >-
      No ECDLP instance is solved and no scalar is recovered, so there is nothing
      to certify. A run of this contract that reports any certificate kind other
      than `none` is invalid.
  claim_tier: observational
  status_note: >-
    Frozen at version 1 and approved 2026-09-13 by DEC-20260913-0f8468 under the
    standing 2026-09-06 user authorization. Stage 0 is the height-box fixture
    calibrator P-S0-HTBOX. After approval the protocol is frozen: any later change
    requires a versioned protocol_amendment under
    experiments/EXP-ECDLP-1bef8f/amendments/.

  objective: >-
    Reproduce, by exact integer arithmetic and independently of the ideation
    session that produced them, the five frozen fixture anchors of
    IDEA-20260913-c5f90d's Stage 0 hard gate, and reject the three known-false
    claims the proposal names. Stage 0 exists so that every later stage is
    readable: it establishes that the relation condition, the box counts, the
    monomial support, the pinning ratio and the dispersion cell are what the
    proposal says they are, before any lattice is built and before any gamma is
    computed. Stage 0 does NOT compute gamma_2, does not build a lattice, does not
    solve an ECDLP instance, and does not authorize Stage 1, 2 or 3.

  preregistered_prediction:
    quantity: >-
      The five Stage 0 anchors (a)-(e) below, taken VERBATIM from
      IDEA-20260913-c5f90d and frozen here before execution, plus rejection of the
      three known-false claims. These values are pre-registered predictions and are
      never tuned to the data; a disagreement is resolved by superseding this
      contract, never by editing an anchor.
    formula: >-
      (a) f_3(x_1, x_2, x_3) = (e_2 - a)^2 - 4*e_1*(e_3 + b), with e_1, e_2, e_3
      the elementary symmetric functions of (x_1, x_2, x_3), vanishes modulo p
      exactly on realisable ordered x-triples. (b) |F_H| = #{x in F_p : ht(x) <= H}
      in the frozen asymmetric normalisation, and c_H = |F_H|/H^2. (c) The
      homogenised arity-2 form F = beta_1^2*beta_2^2*f_3(alpha_1/beta_1,
      alpha_2/beta_2, x_3). (d) The pinning ratio H^4/p. (e) The arity-2
      decomposition count c_2(R) over all n targets, its mean, variance, dispersion
      index (variance/mean), unreachable-target count, and c(O); with a matched
      negation-closed random base of the same size as the null.
    source: >-
      IDEA-20260913-c5f90d, minimal_test.design Stage 0 and the `predictions` block
      of that proposal. The anchors were computed during ideation by exact
      enumeration and are a FIXTURE to be independently recomputed, not an evidence
      record.
    claim_tier: observational

  inputs:
    stage0_anchors:
      a_relation_condition:
        curve: y^2 = x^3 + 3x + 5
        p: 101
        a: 3
        b: 5
        curve_order: 115
        must_realisable_ordered_x_triples: 6441
        must_false_negatives: 0
        must_false_positives: 0
        method: >-
          Enumerate ALL ordered triples of on-curve x-coordinates and compare
          vanishing of f_3 modulo 101 against realisability by direct point
          arithmetic (three points, one per x-coordinate up to sign, summing to the
          identity). Both directions are checked: no realisable triple may fail to
          vanish, and no vanishing triple may fail to be realisable.
      b_box_counts_and_base:
        normalisation: >-
          ht(x) = min over lifts of max(|alpha|, beta) subject to
          alpha = x*beta mod p and 1 <= beta, alpha reduced to the symmetric
          interval.
        ladder_p: 10007
        ladder_H: [4, 5, 6, 9, 10]
        must_box_sizes: [23, 39, 47, 111, 127]
        must_c_H: [1.438, 1.560, 1.306, 1.370, 1.270]
        c_H_tolerance: >-
          c_H is reported to three decimals as |F_H|/H^2 computed from the exact
          integer counts; the exact integer counts are the pre-registered anchors
          and the decimals are derived from them.
        cell:
          curve: y^2 = x^3 + x + 28
          p: 10007
          a: 1
          b: 28
          n: 9851
          must_n_prime: true
          must_n_not_equal_p: true
          H: 10
          must_on_curve_x_values_in_box: 69
          must_base_points: 138
      c_monomial_support:
        must_monomial_count: 9
        must_total_degree: 4
        must_bidegrees_present: >-
          all nine pairs (i, j) with i in 0..2 and j in 0..2
        must_coefficients:
          x1^2*x2^2: '1'
          x1^2*x2: '-2*x_3'
          x1*x2^2: '-2*x_3'
          x1*x2: '-2a - 2*x_3^2'
          x1^2: 'x_3^2'
          x2^2: 'x_3^2'
          x1: '-2a*x_3 - 4b'
          x2: '-2a*x_3 - 4b'
          const: 'a^2 - 4b*x_3'
        note: >-
          Coefficient list taken verbatim from the `box_support_monomial_count`
          prediction of IDEA-20260913-c5f90d. The homogenisation transcript must be
          recorded, not just the count.
      d_pinning_anchor:
        p: 10007
        H: 10
        must_H_to_the_4: 10000
        must_ratio_H4_over_p: 0.99930
        must_B_squared_over_n: 1.9332
        B: 138
        n: 9851
      e_dispersion_cell:
        p: 10007
        a: 1
        b: 28
        n: 9851
        H: 10
        B: 138
        must_mean: 1.9332
        must_variance: 5.5822
        must_dispersion_index: 2.8875
        must_unreachable_targets: 3704
        must_max_count: 138
        must_c_of_identity: 138
        method: >-
          Index the whole group once by repeated addition of a generator, then
          compute the arity-2 ordered decomposition count exactly for every target
          as a convolution over the base. No sampling error in the box measurement.
        matched_null:
          kind: negation_closed_random_base
          size: 138
          draws: 60
          seed: 20260913
          must_mean_dispersion: 2.9163
          must_dispersion_range: [2.7628, 3.1316]
          must_mean_unreachable: 3712.3
    known_false:
      - id: KF-1
        claim: >-
          The product of the unknown bounds FALLS with arity m.
        refuted_by: >-
          The identity H^{2m} = n/c_H^m, which makes the product p^{1+o(1)} for
          every m. The pipeline must reject KF-1 and must exhibit the identity at
          the frozen cell (H^4 = 10000 against p = 10007).
        must_reject: true
      - id: KF-2
        claim: >-
          The homogenised arity-2 support has a MISSING bidegree.
        refuted_by: >-
          Independent expansion, which must find all nine bidegrees present with
          nonzero coefficients. The pipeline must reject KF-2 and must name which
          bidegree the false claim omitted.
        must_reject: true
      - id: KF-3
        claim: >-
          gamma_2 >= 1, asserted WITHOUT the lattice dimension and determinant
          recorded.
        refuted_by: >-
          The admissibility rule of this contract: a gamma claim with no recorded
          lattice dimension and determinant is inadmissible on its face. Stage 0
          must reject KF-3 as unsupportable AND must not itself report any gamma.
        must_reject: true
    invalid:
      - id: INV-1
        object: x = 0 and the point at infinity
        must_handle_explicitly: true
        note: >-
          The point at infinity has no affine x and therefore no height; x = 0 has
          the lift (0, 1). Both must be handled explicitly rather than by accident.
      - id: INV-2
        object: H exceeding (4p/3)^{1/2}
        must_refuse: true
        note: >-
          The box is then all of F_p and the density condition is vacuous. Such an H
          must be refused, not measured.
      - id: INV-3
        object: a singular (a, b), i.e. 4a^3 + 27b^2 = 0 mod p
        must_refuse: true

  stages:
    - stage: 0
      name: fixture_calibrator
      authorized: true
      authorized_by: DEC-20260913-0f8468
      content: >-
        Exact integer arithmetic only. Reproduce anchors (a)-(e), reject KF-1, KF-2
        and KF-3, and handle INV-1 to INV-3. No lattice, no gamma, no sampling
        beyond the declared seeded null draws.
      maximum_runs: 1
    - stage: 1
      name: gamma_symbolic
      authorized: false
      authorization_required: >-
        A later Coordinator decision is required before ANY Stage 1 work is
        performed. This approval does not grant it.
      content: >-
        Compute gamma_2 for the exact 9-monomial degree-4 support by a DECLARED
        shift-polynomial strategy, with the shift-polynomial set, lattice dimension,
        determinant and derived bound all recorded, and repeat for the arity-3
        support obtained from f_4. Report gamma_2 and gamma_3 against
        gamma_req = 1 and against the rigorous univariate anchor 1/4. Needs no
        elliptic curve and no sampling. The strategy and the lattice-reduction
        implementation must be declared and hash-bound in the authorizing decision
        before any gamma is reported.
      preregistered_branches_ref: stage1_preregistered_branches
    - stage: 2
      name: planted_lattice_instances
      authorized: false
      authorization_required: >-
        A later Coordinator decision is required. Reachable only if Stage 1 is not
        decisive or the LEAD branch fires.
      content: >-
        Build the lattice and run it on PLANTED instances from the frozen cell —
        targets known to have a box relation, of which the frozen cell supplies many
        since the mean is 1.93 — plus the univariate positive control and the
        matched null. A run whose univariate positive control fails reports the cell
        UNTESTED; no gamma may be read from a powerless instrument.
      maximum_runs: null
    - stage: 3
      name: p_ladder
      authorized: false
      authorization_required: >-
        A later Coordinator decision is required. Reachable only if the LEAD branch
        survives Stage 2.
      content: >-
        A p-ladder at three field sizes and two arities, then stop and route to
        independent review. NO ECDLP INSTANCE IS SOLVED under this contract at any
        stage.
      maximum_runs: null

  stage1_preregistered_branches:
    frozen_before_any_computation: true
    frozen_at: '2026-09-13'
    frozen_note: >-
      These branches are frozen NOW, while Stage 1 is unauthorized and gamma_2 is
      unknown to this program. Freezing them before the computation is the point:
      after the number exists, any tolerance chosen around it is a tolerance chosen
      to fit. The two anchors are gamma = 1 (the uniqueness threshold, exact
      algebra) and gamma = 1/4 (the rigorous univariate Coppersmith exponent 1/d at
      d = 4, provenance `recalled`). The tolerances themselves are untested choices,
      not measurements.
    quantity: >-
      gamma_2 = sup{gamma : the DECLARED small-root method returns a box solution of
      the homogenised arity-2 relation equation whenever the product of the four
      unknown bounds is at most p^gamma}, against gamma_req = 1.
    branches:
      - id: BR-CLOSURE
        condition: gamma_2 <= 0.9
        label: CLOSURE
        consequence: >-
          gamma_2 becomes the NAMED OBSTRUCTION QUANTITY for the size-function lane.
          The closing evidence record must carry a complete `obstruction` block per
          templates/research-records.md — statement about the OBJECT, quantity,
          value with units and error bars, measured_by run IDs, scope — and its
          `resource_check`. A closure recorded as prose is a fatigue report and is
          refused (docs/inventor-protocol.md section 4). Additional stopping rule
          carried from the proposal: stop after Stage 1 if gamma_2 <= 0.9 AND
          gamma_3 <= gamma_2; no sampling is then authorized.
        obstruction_skeleton:
          statement: >-
            To be written at closure as a claim about the OBJECT: the homogenised
            arity-m box relation equation has an achievable small-root exponent
            strictly below the exponent the density condition requires, so the
            arity that cheapens the linear algebra is exactly the arity that makes
            the search hard.
          quantity: >-
            gamma_m, the achievable small-root exponent for the homogenised arity-m
            box relation support, against gamma_req = 1.
          value: >-
            To be filled from the Stage 1 computation, dimensionless (an exponent of
            p), with the lattice dimension and determinant that produced it, and
            with the spread across the declared strategies as its error bar. Never
            filled from an estimate.
          units: dimensionless exponent of p
          measured_by: >-
            To be filled with the Stage 1 RUN-* IDs. Empty until Stage 1 is
            authorized and executed.
          scope: >-
            The declared supports (arity 2 from f_3, arity 3 from f_4), the declared
            shift-polynomial strategies, and the declared lattice implementation.
            NOT over all small-root methods, and not over arities above 3.
          resource_check:
            examined: >-
              To be answered at closure, and required non-null before the closing
              decision.
            candidate_readings:
              - >-
                A LOW gamma_m is an asset to any argument that wants a PROVABLE
                lower bound on box-relation search cost for a declared method
                class: the same number that kills the exponent move bounds the
                method class from below.
              - >-
                gamma_m decreasing in m quantifies how fast the homogenised Semaev
                degree growth 2^{m-2} destroys small-root solvability, which is a
                measurement about Semaev polynomials usable by any lane that prices
                them — including lanes with no height box in them.
              - >-
                The pinning identity H^{2m} = n/c_H^m is itself a resource: it says
                a size function on F_p exists and its shape is forced, which
                constrains every future factor-base proposal in this class before
                it is built.
            spawned_ids: []
      - id: BR-LEAD
        condition: gamma_2 >= 1.0
        label: LEAD
        consequence: >-
          MANDATORY independent review-breakthrough review at max effort BEFORE ANY
          INTERPRETATION, per AGENTS.md rule 12. The reported LEAD must exhibit the
          recovered integers and verify the relation by direct point arithmetic, and
          must record the lattice dimension and determinant (a gamma claim without
          them is KF-3 and is inadmissible). The univariate positive control must
          have passed. If review-breakthrough cannot be served, the CLAIM stays
          un-promoted and the campaign stays active — the tier is never downgraded.
      - id: BR-INDECISIVE
        condition: 0.9 < gamma_2 < 1.0
        label: INDECISIVE
        consequence: >-
          Declared INDECISIVE IN ADVANCE. Neither closure nor lead. The honest
          record is that the declared strategy does not decide the lane, and the
          next step is a different declared strategy or a tighter analysis, each
          requiring its own authorization.

  observation_collision_limit:
    binding: true
    status: already_successful_before_any_run
    observable: >-
      The arity-2 decomposition-count vector over all targets and its summary
      statistics: mean, variance, dispersion index, unreachable-target count,
      maximum, c(O).
    finding: >-
      The proposal's own observation-collision audit FOUND A COLLISION. At the
      frozen cell the height box gives dispersion index 2.8875 and 3704 unreachable
      targets; a matched negation-closed RANDOM base of the same size gives mean
      dispersion 2.9163 over range 2.7628-3.1316 (60 seeded draws) and 3712.3
      unreachable targets on average. Two structurally unrelated bases produce the
      same observation. The mean cannot separate them at all by KN-FIND-007's
      conservation identity, and these numbers show the second moment does not
      either.
    consequence: >-
      THE DENSITY OBSERVABLE DOES NOT IDENTIFY THE HEIGHT BOX, AND NO CLAIM OF THIS
      EXPERIMENT OR OF H-ECDLP-b97b72 MAY BE FOUNDED ON IT. This is the single most
      important limit in this design. Any successor record that reports a coverage
      advantage for the height box has collided with the null and MUST say so in its
      own record. The separating quantity must be the SEARCH cost, which is why
      gamma and not coverage is the bottleneck. Stage 0 recomputes the dispersion
      cell as a FIXTURE only: reproducing 2.8875 is a check that the fixture is
      right, never a finding about the height box.
    artifact_free_signal: >-
      The only reading of the density observable that would be a finding is a
      separation from the matched null that GROWS along the declared p-ladder at
      fixed c_H. A separation flat in p is an artifact under
      docs/inventor-protocol.md section 3. The p-ladder is Stage 3 and is
      unauthorized.

  controls:
    - name: matched_null
      kind: matched_null
      stage: 0
      applies: true
      object: >-
        A negation-closed random base of the same size (138) at the same (p, H),
        drawn as a random SUBSET OF THE ON-CURVE X-VALUES with both points per x,
        60 seeded draws at seed 20260913, with all density statistics computed
        identically to the box.
      load_bearing_property: >-
        NEGATION CLOSURE IS LOAD-BEARING. The height box is automatically closed
        under y -> -y, which forces c(-R) = c(R) exactly and c(O) >= B. A null drawn
        as a plain random POINT set would differ from the box for that reason alone
        and would manufacture a spurious signal. This is the single most likely
        source of a spurious positive in the density half.
      decay_parameter: p
      decay_rule: >-
        A genuine structural advantage of the height box must GROW with p at fixed
        c_H. A separation FLAT IN p is an artifact under docs/inventor-protocol.md
        section 3 and is recorded as a controlled null, not as a finding. Stage 0
        measures one value of p and therefore CANNOT test decay at all; the decay
        test is Stage 3 and is unauthorized.
    - name: known_false_KF1
      kind: known_false
      stage: 0
      applies: true
      object: >-
        The claim that the product of unknown bounds falls with arity m. Refuted by
        the identity H^{2m} = n/c_H^m. Must be rejected.
    - name: known_false_KF2
      kind: known_false
      stage: 0
      applies: true
      object: >-
        A monomial support with a missing bidegree. Refuted by independent
        expansion, which finds all nine present. Must be rejected.
    - name: known_false_KF3
      kind: known_false
      stage: 0
      applies: true
      object: >-
        A claim of gamma_2 >= 1 asserted without the lattice dimension and
        determinant recorded. Inadmissible on its face. Must be rejected, and Stage
        0 must not itself report any gamma.
    - name: invalid_input
      kind: invalid_input
      stage: 0
      applies: true
      object: >-
        x = 0 and the point at infinity handled explicitly; an H exceeding
        (4p/3)^{1/2} refused because the box is then all of F_p and the density
        condition is vacuous; a singular (a, b) refused.
    - name: identity_target_control
      kind: identity
      stage: 0
      applies: true
      object: >-
        The identity O as a target: negation closure forces c(O) >= B, and the
        frozen anchor is c(O) = 138 = B exactly. A pipeline reporting c(O) < B has a
        negation-closure bug rather than a finding.
    - name: relabelled_generic_group
      kind: generic_group
      stage: 0
      applies: partially
      object: >-
        Relabelled Z/nZ with a base of the same size and no height structure. The
        DENSITY statistics must agree with the elliptic run because they are
        generic; the SEARCH must not, because the height structure is exactly what
        a lattice reads. A generic run that reproduces a search advantage means the
        advantage is an artifact of the search harness.
      stage0_applicability_note: >-
        Only the density half of this control is meaningful at Stage 0, where there
        is no search. Stage 0 may record the generic density agreement as a further
        statement of the collision above; the search half of the control is Stage 2
        or later and is unauthorized.
    - name: baseline_attack_cost
      kind: baseline
      stage: 3
      applies: false
      object: >-
        Pollard rho with distinguished points and BSGS on the same curve in the same
        group-operation unit, as the mandatory matched attack-cost controls.
      stage0_applicability_note: >-
        NOT APPLICABLE AT STAGE 0 and not run: Stage 0 charges no attack and reports
        no ratio to rho. Recorded here so a later stage cannot omit it.
    - name: positive_control_small_root_power
      kind: positive_control
      stage: 2
      applies: false
      object: >-
        A planted univariate modular instance strictly inside the rigorous
        Coppersmith range (degree 4, root below p^{1/4}), which the lattice code
        must solve. If it does not, every gamma reported at Stage 1 or 2 is
        inadmissible and the cell is reported UNTESTED rather than closed.
      stage0_applicability_note: >-
        NOT APPLICABLE AT STAGE 0: no lattice exists at Stage 0. Mandatory before
        any gamma is read at any later stage.
    - name: positive_control_relation_existence
      kind: positive_control
      stage: 2
      applies: false
      object: >-
        Targets from the frozen cell with a known box decomposition, which the search
        must find when given the decomposition's own bounds.
      stage0_applicability_note: >-
        NOT APPLICABLE AT STAGE 0: there is no search at Stage 0.
    - name: random_support_twin
      kind: nearby_object
      stage: 1
      applies: false
      object: >-
        A RANDOM 9-monomial degree-4 form modulo p with the same support and the same
        bounds, which has a box root with probability of order one by counting but
        carries no elliptic structure. If the pipeline solves the random form at the
        threshold, gamma is a property of the SUPPORT and not of the curve, and any
        curve-specific claim is refuted before it is made.
      stage0_applicability_note: >-
        NOT APPLICABLE AT STAGE 0. This is the method-ceiling nearby-object control
        and it binds every later stage.

  independent_variables:
    - height_bound_H
    - field_size_p
    - base_kind (height_box | matched_negation_closed_random | relabelled_Z_mod_n)
    - arity_m (Stage 0 fixes m = 2 for the density cell and m = 3 for the relation
      condition's triple structure)

  metrics:
    primary:
      - fixture_pass
      - relation_condition_pass
      - box_count_ladder_pass
      - base_and_order_pass
      - monomial_support_pass
      - pinning_anchor_pass
      - dispersion_cell_pass
      - matched_null_pass
      - known_false_KF1_reject_pass
      - known_false_KF2_reject_pass
      - known_false_KF3_reject_pass
      - invalid_input_reject_pass
      - identity_count_pass
      - certificate_kind_none_pass
      - no_gamma_reported_pass
    secondary:
      - realisable_ordered_x_triples
      - box_sizes_by_H
      - c_H_by_H
      - on_curve_x_values_in_box
      - base_point_count
      - pinning_ratio
      - decomposition_mean
      - decomposition_variance
      - dispersion_index
      - unreachable_target_count
      - max_decomposition_count
      - c_of_identity
      - matched_null_dispersion_mean_min_max
      - matched_null_unreachable_mean
      - generic_group_density_agreement
  primary_metrics:
    - fixture_pass
    - relation_condition_pass
    - box_count_ladder_pass
    - base_and_order_pass
    - monomial_support_pass
    - pinning_anchor_pass
    - dispersion_cell_pass
    - matched_null_pass
    - known_false_KF1_reject_pass
    - known_false_KF2_reject_pass
    - known_false_KF3_reject_pass
    - invalid_input_reject_pass
    - identity_count_pass
    - certificate_kind_none_pass
    - no_gamma_reported_pass
  secondary_metrics:
    - realisable_ordered_x_triples
    - box_sizes_by_H
    - c_H_by_H
    - on_curve_x_values_in_box
    - base_point_count
