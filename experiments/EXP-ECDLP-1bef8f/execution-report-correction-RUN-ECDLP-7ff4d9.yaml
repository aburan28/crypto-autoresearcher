    - "Anchor (c): the independent expansion of f_3 = (e_2 - a)^2 - 4*e_1*(e_3 + b) has 9 monomials in (x1, x2), every bidegree in {0,1,2}^2 present, and the homogenised form is homogeneous of total degree [4] in (alpha_1, beta_1, alpha_2, beta_2). All nine coefficient polynomials agree with the frozen list."
