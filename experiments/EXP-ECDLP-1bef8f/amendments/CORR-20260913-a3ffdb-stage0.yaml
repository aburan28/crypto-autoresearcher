protocol_amendment:
  id: PA-ECDLP-1bef8f-CORR-20260913-a3ffdb
  correction_id: CORR-20260913-a3ffdb
  experiment_id: EXP-ECDLP-1bef8f
  hypothesis_id: H-ECDLP-b97b72
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-e5c603
  version_from: 1
  version_to: 2
  amended_at: '2026-09-13'
  filed_by: coordinator
  authoring_task: TASK-20260913-3db7c6
  approved_by: coordinator
  approved_by_decision: DEC-20260913-3330b6
  status: approved
  applies_to: RUN-ECDLP-7ff4d9_only
  predecessor_specification: experiments/EXP-ECDLP-1bef8f/specification.yaml
  predecessor_run: RUN-ECDLP-1bef8f-S0
  superseding_run: RUN-ECDLP-7ff4d9
  execution_authorized: true
  execution_authorized_stages: [0]
  maximum_corrected_runs: 1
  claim_ceiling: fixture_and_instrument_correction_only
  certificate:
    kind: none
    note: >-
      The correction run solves no ECDLP instance, recovers no scalar, and
      verifies no relation offered as an ECDLP certificate.

  immutability:
    additive_only: true
    original_specification_untouched: true
    original_run_untouched: true
    original_implementation_untouched: true
    original_reports_untouched: true
    original_run_directory: >-
      experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-1bef8f-S0/
    corrected_run_directory: >-
      experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-7ff4d9/
    rule: >-
      RUN-ECDLP-7ff4d9 is a distinct prospective correction run. It must not
      overwrite, rename, reuse, hard-link, or write beneath the original run
      directory. The original bytes remain the auditable invalid receipt.
    normative_precedence:
      - >-
        This amendment governs RUN-ECDLP-7ff4d9 where it conflicts with the
        frozen version-1 Stage 0 protocol.
      - >-
        Every version-1 field not expressly corrected here remains binding.
      - >-
        No prior run is re-scored in place; the additive correction record
        supplies the official validity correction.

  triggering_findings:
    validity_classification: invalid_stage0_fixture_and_instrument_receipt
    mathematical_effect: none
    findings:
      - id: J3-TAUTOLOGY
        source: >-
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-e5c603/reviews/TASK-20260913-2868d5/validation_report.yaml
        finding: >-
          The producer checked (n/c_H^m)c_H^m=n, which is true by construction,
          rather than checking H^(2m)=n/c_H^m.
      - id: J3-PREMISE-ABSENT
        source: >-
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-e5c603/reviews/TASK-20260913-2868d5/independent-recomputation.json
        finding: >-
          At m=2, B=138 and n=9851, so B^2/n=19044/9851=1.9332 rather than 1.
          The frozen cell therefore does not instantiate the exact density
          premise B^m=n.
      - id: J6-NONDISCRIMINATING
        source: >-
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-e5c603/reviews/TASK-20260913-1414af/red_team_report.yaml
        finding: >-
          KF-1 does not enforce its premises, KF-2 accepts incomplete support
          grids, KF-3 has no payload, and the certificate/no-gamma gates are
          literal True values.

  corrected_claim_partition:
    - id: CLAIM-SYMBOLIC-CONDITIONAL
      statement: >-
        For exact rational or integer values satisfying both explicit premises
        B=c_H*H^2 and B^m=n, derive H^(2m)=n/c_H^m.
      derivation: >-
        Substitute B=c_H*H^2 into B^m=n to obtain
        c_H^m*H^(2m)=n, then divide by nonzero c_H^m. The checker must derive
        this chain from the supplied payload. It must not install an exponent
        of 1, an equality verdict, or either side of the conclusion as a
        literal expected answer.
      domain_requirements:
        - m is an integer with m >= 1.
        - H, B, n and c_H are exact positive rationals, with c_H nonzero.
        - B=c_H*H^2 is checked from the payload.
        - B^m=n is checked from the payload.
      exact_positive_tuples:
        - {m: 2, H: 10, c_H: 127/100, B: 127, n: 16129}
        - {m: 3, H: 10, c_H: 127/100, B: 127, n: 2048383}
      required_results:
        - >-
          Each positive tuple records both premise verdicts, both exact
          conclusion sides, and equality, all obtained with exact arithmetic.
        - >-
          A payload where either premise is false returns structured status
          `premise_refused`; it must never return `identity_proved`.
      required_negative_tuples:
        - id: density_premise_mutation
          tuple: {m: 2, H: 10, c_H: 127/100, B: 127, n: 9851}
          expected: premise_refused
          violated_premise: B^m=n
        - id: box_constant_premise_mutation
          tuple: {m: 2, H: 10, c_H: 127/100, B: 138, n: 19044}
          expected: premise_refused
          violated_premise: B=c_H*H^2
    - id: CLAIM-FROZEN-CELL-NUMERICAL
      statement: >-
        The frozen cell has H=10, p=10007, B=138, n=9851 and measured
        c_H=127/100. Its independently checkable numerical facts are
        H^4/p=10000/10007=0.99930 and B^2/n=19044/9851=1.9332.
      separation_rule: >-
        H^4/p and B^2/n are different ratios and must be reported in separate
        fields. The first is a pinning ratio against the field modulus. The
        second is the density-premise diagnostic and proves that B^2=n is not
        exact in this cell.
      conditional_identity_noninstantiation:
        m2:
          ratio: H^(2m)/(n/c_H^m)
          exact: 16129/9851
          equals_one: false
        m3:
          ratio: H^(2m)/(n/c_H^m)
          exact: 2048383/9851
          equals_one: false
        finite_sequence: n/c_H^m
        monotonicity_for_this_cell: strictly_decreasing
        reason: c_H=127/100 is greater than 1
      prohibited_reading: >-
        The frozen cell cannot numerically instantiate the conditional identity.
        Its failure to meet a premise is neither a refutation of the algebraic
        implication nor evidence about gamma_m, height-box utility, or ECDLP.

  original_run_disposition:
    run_id: RUN-ECDLP-1bef8f-S0
    corrected_validity: invalid
    scope: Stage_0_validity_claim_only
    reason: >-
      Required J3 and J6 controls are non-discriminating. A zero exit code and
      internally consistent artifacts cannot repair a control that checks a
      tautology or returns hard-coded expected answers.
    observations_preserved_but_not_promoted:
      - J1 relation-condition two-directional counts hold.
      - J2 box counts and base construction hold.
      - J4 dispersion cell and matched-null recomputation hold.
      - Blind J5 symbolic support re-derivation holds.
      - J7 density-observable collision limit is honoured.
      - J8 Stage 0 authorization and claim ceiling are honoured.
      - INV-1, INV-2 and INV-3 controls hold.
    evidence_rule: >-
      These are narrow observations from an invalid run and its same-session
      reviews. None is eligible for an evidence record or hypothesis transition
      unless RUN-ECDLP-7ff4d9 validly reproduces the unaffected anchor or control
      and a later independent review accepts that run.

  corrected_controls:
    kf1:
      interface: validate_conditional_identity(payload)
      payload_fields: [m, H, c_H, B, n]
      required_behavior:
        - Validate B=c_H*H^2 and B^m=n independently.
        - Refuse either false premise with named failed premises.
        - Derive the conclusion only after both premises hold.
        - Do not use a literal expected exponent or equality answer.
      mutations:
        - >-
          Replace n=16129 by n=9851 in the m=2 positive tuple. The control must
          return premise_refused naming B^m=n and must not prove the identity.
        - >-
          Replace B=127 by B=138 while retaining c_H=127/100 and H=10. The
          control must return premise_refused naming B=c_H*H^2.
    kf2:
      interface: validate_bidegree_claim(payload)
      expected_key_set:
        - [0, 0]
        - [0, 1]
        - [0, 2]
        - [1, 0]
        - [1, 1]
        - [1, 2]
        - [2, 0]
        - [2, 1]
        - [2, 2]
      payload_fields:
        - coefficient_map
        - claimed_missing_bidegree
      required_behavior:
        - >-
          Compare the exact supplied key set with all nine expected bidegrees
          before indexing any particular coefficient.
        - Name every missing and every extra key in deterministic sorted order.
        - >-
          Reject a claim that a bidegree is missing only when the supplied grid
          is complete and the claimed bidegree is actually present with a
          nonzero polynomial coefficient.
        - >-
          If the grid is incomplete, return a structured non-pass identifying
          the actual omissions; do not report the unrelated canonical (1,1)
          bidegree and do not crash.
      mutations:
        - >-
          Delete (0,0): report missing [[0,0]], no extras, and no false pass.
        - >-
          Delete (1,1): report missing [[1,1]], no extras, and no exception.
        - >-
          Add (3,0): report extra [[3,0]] and no false pass.
    kf3:
      interface: validate_gamma_claim_payload(payload)
      required_payload_fields:
        - claim
        - stage_authorization
        - shift_set
        - lattice_dimension
        - determinant
        - recovered_root
        - relation_verification
        - positive_control
      required_behavior:
        - The function takes exactly one structured claim payload.
        - >-
          A payload marked Stage 0 that contains a gamma field returns a
          structured refusal code `STAGE0_GAMMA_PROHIBITED`.
        - >-
          Every missing, null, nonpositive, or failed required witness returns
          a structured refusal naming all defects.
        - >-
          A complete synthetic positive-control payload is accepted by the
          validator solely to prove it is not a constant rejector. The fixture
          must be explicitly marked `admissibility_test_only`, must contain no
          measured gamma value, and confers no authorization.
      positive_control:
        kind: admissibility_test_only
        claim: gamma_threshold_admissibility
        stage_authorization:
          stage: 1
          authorized: true
          authorization_ref: synthetic_schema_fixture_not_a_decision
        shift_set: [synthetic_shift_0]
        lattice_dimension: 1
        determinant: 1
        recovered_root: [0]
        relation_verification: true
        positive_control: true
        gamma_value: null
        expected: structurally_admissible_test_fixture
      mutations:
        - Set stage_authorization.stage to 0 and add gamma_2=1; require structured refusal.
        - Delete each required witness in turn; require structured refusal naming it.
        - Set relation_verification false; require structured refusal.
        - Set positive_control false; require structured refusal.
    tail_gates:
      scan_domain: >-
        Recursively scan the fully assembled raw-result object and every retained
        structured artifact summary before writing any PASS gate.
      no_gamma_rule: >-
        Fail if a semantic field gamma, gamma_2, gamma_3, gamma_m, or
        gamma_reported carries a non-null run-derived value. Text quoting a
        prohibited claim is not a measured value and must be separately typed.
      certificate_rule: >-
        Every semantic certificate object or certificate_kind field must resolve
        to kind `none`; absent, malformed, conflicting, or non-none values fail.
      mutations:
        - >-
          Inject stage_output.gamma_2=1 into a copy of the assembled payload;
          no_gamma_reported_pass must become false.
        - >-
          Inject certificate.kind=relation into a copy of the assembled payload;
          certificate_kind_none_pass must become false.
      prohibition: >-
        Neither gate may be assigned from a literal boolean or from a local
        variable that was not computed by scanning the assembled payload.

  unaffected_reproduction:
    compare_against_original_immutable_observations: true
    required:
      - J1 relation condition, including separate false-negative and false-positive counts.
      - J2 box ladder, c_H values, curve order, on-curve x set and base size.
      - J4 full decomposition vector, summaries, all 60 seeded matched nulls and c(O).
      - J5 all nine bidegrees and coefficients.
      - J7 collision-limit language and absence of a density-founded claim.
      - J8 Stage 0-only boundary and absence of Stage 1+ work.
      - INV-1, INV-2 and INV-3.
      - Frozen H^4/p and B^2/n facts, now reported as distinct ratios.
    validity_rule: >-
      RUN-ECDLP-7ff4d9 is valid only if every original numerical anchor except
      the invalid conditional-identity framing reproduces exactly, every original
      applicable control is rerun, both symbolic positive tuples derive the
      conditional identity, every false-premise tuple is refused, KF-2 deletion
      mutations discriminate without crashing, KF-3 positive and negative
      payload fixtures discriminate, and both tail-gate mutations force failure.

  required_artifacts:
    corrected_implementation: >-
      experiments/EXP-ECDLP-1bef8f/implementation-corrections/CORR-20260913-a3ffdb/stage0_htbox_corrected.py
    corrected_run_directory: >-
      experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-7ff4d9/
    manifest: >-
      experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-7ff4d9/manifest.yaml
    raw_result: >-
      experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-7ff4d9/raw-result.json
    command: >-
      experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-7ff4d9/command.txt
    environment: >-
      experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-7ff4d9/environment.json
    stdout: >-
      experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-7ff4d9/stdout.log
    stderr: >-
      experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-7ff4d9/stderr.log
    frozen_manifest: >-
      experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-7ff4d9/frozen-manifest.json
    f3_transcript: >-
      experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-7ff4d9/f3-verification-transcript.txt
    homogenisation_transcript: >-
      experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-7ff4d9/homogenisation-transcript.txt
    decomposition_counts: >-
      experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-7ff4d9/decomposition-counts.json
    control_report: >-
      experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-7ff4d9/corrected-controls.yaml
    mutation_report: >-
      experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-7ff4d9/mutation-controls.json
    execution_report: >-
      experiments/EXP-ECDLP-1bef8f/execution-report-correction-RUN-ECDLP-7ff4d9.yaml

  stopping_rules:
    - Stop invalid if either symbolic premise is bypassed or a false-premise tuple is accepted.
    - Stop invalid if a KF-2 deletion crashes or returns a false pass.
    - Stop invalid if KF-3 accepts Stage 0 gamma or fails to accept its synthetic complete fixture.
    - Stop invalid if either injected tail mutation leaves its gate true.
    - Stop invalid at the first unaffected-anchor mismatch, retaining both values.
    - Stop after the single Stage 0 correction run; never continue to Stage 1, 2 or 3.
    - A timeout, crash, or resource failure is infrastructure signal, not mathematical evidence.

  invalidation_rules:
    - Any write beneath RUN-ECDLP-1bef8f-S0 or the original implementation invalidates the procedure.
    - Any missing required artifact invalidates the correction run.
    - Any non-exact arithmetic in a decisive identity or ratio invalidates that check.
    - Any gamma computation, lattice, shift-set construction, scalar recovery, or ECDLP interpretation invalidates the run.
    - Any certificate kind other than none invalidates the run.
    - Any conclusion founded on the density observable invalidates the interpretation.

  authorization_boundary:
    authorized:
      - One Stage 0 correction run, RUN-ECDLP-7ff4d9.
      - New corrected implementation bytes at the declared correction-only path if needed.
      - Exact fixture recomputation and procedural mutation controls above.
    not_authorized:
      - Stage 1, Stage 2, or Stage 3.
      - gamma computation or estimation.
      - shift-polynomial construction.
      - lattice construction, LLL, or BKZ.
      - scalar recovery or any ECDLP solve or interpretation.
      - any hypothesis, goal, or evidence transition.
      - any overwrite or re-score of RUN-ECDLP-1bef8f-S0.
