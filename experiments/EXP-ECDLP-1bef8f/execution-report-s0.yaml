  observations:
    - "Anchor (a): 6441 realisable ordered x-triples over the 57 on-curve x-values of y^2 = x^3 + 3x + 5 over F_101 (frozen anchor 6441); 0 false negatives and 0 false positives, reported separately. Realisability was decided by affine point addition, never by f_3."
    - "Anchor (b): |F_H| = [23, 39, 47, 111, 127] at H = [4, 5, 6, 9, 10] (frozen anchor [23, 39, 47, 111, 127]), c_H = ['1.438', '1.560', '1.306', '1.370', '1.270'] (frozen anchor ['1.438', '1.560', '1.306', '1.370', '1.270']). Two independent box constructions -- forward from the lifts and backward from ht(x) -- agree on every H. At (10007, 1, 28), n = 9851 is prime and differs from p, and the box at H = 10 holds 69 on-curve x-values carrying 138 base points, negation-closed."
    - "Anchor (c): the independent expansion of f_3 = (e_2 - a)^2 - 4*e_1*(e_3 + b) has 9 monomials in (x1, x2), every bidegree in {0,1,2}^2 present, and the homogenised form is homogeneous of total degree [4] in (alpha_1, beta_1, alpha_2, beta_2). All nine coefficient polynomials agree with the frozen list."
    - "Anchor (d): H^4 = 10000 and H^4/p = 10000/10007 = 0.99930 at five decimals (0.9993004897 at ten), rendered from the exact rational with half-away-from-zero rounding. B^2/n = 19044/9851 = 1.9332."
    - "Anchor (e): mean 1.9332, variance 5.5822, dispersion index 2.8875, 3704 unreachable targets, max 138, c(O) = 138. The same count vector recomputed by direct point addition rather than index-space convolution agrees exactly: True."
    - "Matched null (seed 20260913, 60 draws, negation-closed random base of size 138 drawn from the 4925 on-curve x-values of F_p): mean dispersion 2.9163, range [2.7628, 3.1316], mean unreachable 3712.3. The box's dispersion index lies inside that range: True. This is the contract's already-successful observation collision restated as a fixture check; it is not a finding, not an advantage, and not evidence about the height box in either direction."
    - "Relabelled-Z/nZ generic control (density half only; the search half is Stage 2 and unauthorized): the indexed height-box base was deterministically relabelled in Z/nZ with all curve and height labels removed. Its complete density count vector agrees with the elliptic vector exactly: True. This control used no additional random draws."
    - "KF-1 rejected by exact rational and symbolic-exponent computation: multiplying n/c_H^m by c_H^m recovers n for every m in [2, 8], and the exponent of n remains exactly one. Only the p-independent factor c_H^(-m), c_H = 127/100, changes; finite values may decrease when c_H exceeds one, which is not a fall in the field-size exponent. The identity is exhibited at the frozen cell as H^4 = 10000 against p = 10007."
    - "KF-2 rejected by the independent expansion: all 9 candidate omissions are refuted, each bidegree carrying a nonzero coefficient polynomial. The canonical false claim omits bidegree [1, 1] (the monomial x1*x2), whose coefficient is -2*w^2 -2*a."
    - "KF-3 rejected procedurally, with nothing computed by design: the contract's admissibility rule makes a gamma claim without a recorded lattice dimension and determinant inadmissible on its face. THIS RUN COMPUTED NO GAMMA of any kind, built no lattice, formed no shift-polynomial set, and called no lattice-reduction routine."
    - "INV-1, INV-2 and INV-3 all handled explicitly: the point at infinity is refused as having no affine x and no height; x = 0 has the lift (0, 1) and height 1; H = 116 at p = 10007 is refused because 3H^2 > 4p while H = 115 is still accepted; and both a trivial and a computed nontrivial singular (a, b) are refused, while both frozen cells are confirmed nonsingular."
