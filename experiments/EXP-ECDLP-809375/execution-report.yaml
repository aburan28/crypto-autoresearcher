      present. No specification_error raised; execution proceeded.

  protocol_deviations:
    - id: DEV-1
      class: disclosed_addition
      description: >-
        The C-2/C-3 null-lift instruction ("perturb by adding p^e to a
        coordinate before lifting, with no order-n projection") admits two
        non-equivalent readings. BOTH were tabulated at every (r, e) cell
        rather than one being selected: raw_perturbation (x0 = S.x + p^e,
        which is what the two prior runs recorded, at e = 1) and
        canonical_offset (x0 = x(S_hat) + p^e). Neither was chosen after
        seeing the result and both are reported in full.
    - id: DEV-2
      class: implementation_error_caught_pre_measurement
      description: >-
        The first implementation evaluated the projection scalar as one
        monolithic binary ladder. It raised KernelOfReduction at r = 12 -- the
        code's own explicit non-unit guard correctly detecting that an
        intermediate multiple [i]L with n | i had left the affine chart, which
        affine coordinates cannot represent. No run record was produced from
        that code. Repaired by staged evaluation ((r-1) multiplications by p,
        then one by u = (p^(r-1))^-1 mod n, computing the identical group
        element) plus a machine-checked audit of every intermediate's residue
        mod n. The r=4 and r=8 values produced before the repair are identical
        to those reported.
    - id: DEV-3
      class: implementation_error_caught_pre_measurement
      description: >-
        An early draft of the chain-audit predicate tested the pre-doubling
        scalar instead of the post-doubling one and reported affine_safe:
        false for chains that had executed correctly. Corrected before the
        recorded run. It affected only the audit flag; measured values were
        byte-identical before and after the fix.
    - id: DEV-4
      class: infrastructure_event
      description: >-
        The first attempt to wrap the packaged command in /usr/bin/time -l was
        blocked by the execution sandbox ("sysctl kern.clockrate: Operation
        not permitted") and wrote that error into stderr.log. The wrapper was
        dropped, the exact command in command.txt re-executed unwrapped, and
        the resource figures taken from a separate identical invocation. Both
        invocations produced byte-identical raw-result.json. No run record was
        overwritten; none had been written.
    - id: DEV-5
      class: disclosed_drafting_error_in_this_package
      description: >-
        While drafting the run manifest, a placeholder value was typed into
        code.specification_sha256 before the real digest had been computed. It
        was replaced with the actual SHA-256 of the frozen contract
        (b94f6f10...), which matches the value environment.json recorded
        independently at execution time. Disclosed rather than silently
        corrected, because a fabricated digest in a reproducibility field is
        exactly the failure class rule 5 exists to prevent.

  prohibited_paths_discipline:
    prohibited:
      - experiments/EXP-ECDLP-c373eb/implementation/rc1_tabulation.py
      - experiments/EXP-ECDLP-c373eb/implementation/rc1_tabulation_run2.py
    opened: false
    statement: >-
