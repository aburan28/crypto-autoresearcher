experiment:
  id: EXP-ECDLP-809375
  hypothesis_id: H-ECDLP-a40416
  version: 1
  title: >-
    FG-1: independent cross-implementation reproduction of the D1
    coordinate-valuation image, via a group-theoretic order-n lift in affine
    Z/p^r arithmetic sharing no code with EXP-ECDLP-c373eb
  status: approved
  objective: >-
    Discharge the single objection that broke joint J2 of the BATCH-e8a3a7
    review round (DEC-20260903-9f1190): that RUN-ECDLP-c373eb-1 and
    RUN-ECDLP-c373eb-2 share 266 of ~270 executable lines with every function
    byte-identical, so they constitute ONE implementation on two instances and
    their agreement carries likelihood ratio 1 on the question at issue.
    This experiment reproduces the SAME measured quantity by a construction
    that shares no line, no lift method, and no group law with either existing
    script, on BOTH instances already measured. It is a methodological
    cross-check of an existing measurement, not a new scientific claim.
  source_decision: DEC-20260903-9f1190
  supersedes_no_run: >-
    This is a NEW contract, deliberately not a third run against
    EXP-ECDLP-c373eb, whose frozen specification declares
    budget.maximum_runs: 1 and was already exceeded by RUN-ECDLP-c373eb-2
    without an amendment (recorded as PD-4 of DEC-20260903-9f1190). Runs are
    immutable and that contract is not edited here.

  claim_tier_basis: >-
    Toy tier per docs/claims-and-verification.md (p ~ 10 bits, well under the
    32-bit floor). This experiment can only ever establish that two
    independent implementations agree on a toy-scale tabulation. It cannot
    upgrade the underlying finding's scale, and no transfer argument to
    cryptographic scale is made or licensed by it.

  inputs:
    instance_A:
      note: 'the RUN-ECDLP-c373eb-1 instance, re-measured independently here'
      p: 1009
      A: 1
      B: 1
      S: {x: 286, y: 680}
      n: 47
      precision_r: 8
    instance_B:
      note: 'the RUN-ECDLP-c373eb-2 instance, re-measured independently here'
      p: 1013
      A: 2
      B: 2
      S: {x: 393, y: 263}
      n: 41
      precision_r: 8

  method_constraint_this_is_the_whole_point: >-
    The implementation MUST differ from experiments/EXP-ECDLP-c373eb/
    implementation/rc1_tabulation.py and rc1_tabulation_run2.py on all three
    axes below. An implementation matching any one of them on these axes does
    not discharge J2 and the run is invalid_measurement.
    (1) LIFT CONSTRUCTION: build the canonical order-n lift GROUP-
    THEORETICALLY with no Hensel/Newton iteration at all. Take any lift L of
    S to Z/p^r satisfying the curve equation, then set
    S_hat = [ p^(r-1) * ( (p^(r-1))^{-1} mod n ) ] L.
    This reduces to S because the scalar is congruent to 1 mod n, and
    satisfies [n]S_hat = O because the scalar is divisible by p^(r-1), which
    annihilates the kernel of reduction (the formal group) at precision r.
    (2) GROUP LAW: use AFFINE Z/p^r arithmetic with explicit modular
    inverses, NOT Jacobian projective coordinates.
    (3) NO REUSE: do not import, copy, or adapt any function from either
    existing script.

  controls:
    - id: C-1
      description: >-
        Uniqueness cross-check. The order-n prime-to-p torsion lift is unique,
        so the group-theoretically constructed S_hat MUST equal the
        Hensel-constructed one on all r digits. Compare against the x_hat and
        y_hat values recorded in the two existing run manifests. This is a
        hard binary check on the load-bearing object, replacing the five
        sampled pairs currently on record.
    - id: C-2
      description: >-
        Null-lift control, reconstructed independently under this
        implementation, on both instances. Predicted image {0, e} for
        perturbation depth e.
    - id: C-3
      description: >-
        Dose-response sweep on precision and null depth, which no RUN of
        EXP-ECDLP-c373eb performed internally (recorded as UC-2 of
        EV-ECDLP-921b5d): vary r in {4, 8, 12} and null depth e in {1,2,3,4}.
        The on-fibre value MUST track r, and the null image MUST read
        {0, min(e,r)}. A quantity that does not move when the parameter meant
        to move it moves is the canonical artifact tell of
        docs/inventor-protocol.md section 3.

  independent_variables:
    - 'instance in {A, B}'
    - 'j, k over all pairs 1 <= j < k < n'
    - 'precision r in {4, 8, 12} (C-3)'
    - 'null perturbation depth e in {1,2,3,4} (C-3)'

  metrics:
    primary:
      - 'image (as a set) of D1 on the canonical lift, per instance, at r=8'
      - 'per-digit equality of group-theoretic S_hat against the recorded Hensel S_hat, per instance (C-1)'
    secondary:
      - 'image of D1 on the null lift, per instance (C-2)'
      - 'on-fibre value as a function of r, and null image as a function of e (C-3)'
      - 'count of any pair whose value differs from the corresponding recorded run value'

  heuristic_under_test: null

  preregistered_prediction:
    quantity: 'D1 image on the canonical lift, both instances, r=8'
    formula: '{0, r} exactly, with the value r occurring exactly on k = n-j'
    source: >-
      Proposition E, ideas/artifacts/ECDLP-IDEA-436/
      ggm_simulability_gate_erratum_20260831.md section C.2, as already
      measured by RUN-ECDLP-c373eb-1 and -2 and independently re-derived by
      TASK-20260903-6048dc. This prediction is FROZEN before execution and is
      read-only during it.

  scale_relevance:
    tier: toy
    justification: >-
      Two ~10-bit instances, chosen to match exactly what has already been
      measured so the cross-implementation comparison is like-for-like.
      Deliberately NOT new instances: adding a third instance would compound
      the confound J2 identified rather than isolate it. The variable under
      test here is the IMPLEMENTATION, so the instances are held fixed.
    correspondence: null

  tail_checks: []
  replication:
    seeds: []
    independent_instances: 2

  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.05
    maximum_memory_gb: 1
    maximum_runs: 3
    maximum_workers: null
    budget_note: >-
      maximum_runs is 3, not 1, deliberately: this contract anticipates a
      possible repair run and a possible C-3 extension without requiring an
      amendment, which is the specific failure recorded as PD-4 of
      DEC-20260903-9f1190.

  stopping_rules:
    - 'Stop when both instances have completed the canonical, null, and C-3 tabulations. No iterative search, no parameter tuning against the prediction.'

  invalidation_rules:
    - >-
      If the implementation reuses, imports, or adapts any function from
      rc1_tabulation.py or rc1_tabulation_run2.py, or uses Hensel/Newton
      iteration for the lift, or uses Jacobian coordinates, the run is
      invalid_measurement -- it would not discharge J2, which is the entire
      purpose of the contract.
    - >-
      If the group-theoretic S_hat does not reduce to S mod p, or [n]S_hat is
      not the identity mod p^r, the construction is wrong and the run is
      invalid_measurement (not a negative result about the mathematics).
    - 'Any use of floating point for a p-adic quantity invalidates the run.'

  success_criterion: >-
    Not a solve criterion (certificate kind: none). The run SUCCEEDS AS A
    MEASUREMENT if all declared tabulations complete and are recorded,
    whichever way the comparison against the frozen prediction comes out. A
    disagreement with the existing runs is a fully successful run and a highly
    informative result -- it would mean one of the two implementations is
    wrong, which is exactly what a cross-implementation check exists to find.

  falsification_criterion: >-
    C-1: any digit of the group-theoretic S_hat differing from the recorded
    Hensel S_hat on either instance. C-3: an on-fibre value that does not
    track r, or a null image that does not read {0, min(e,r)} -- either would
    indicate the reported cap is a precision artifact rather than exact ring
    equality. A single D1 value strictly between 1 and r-1 on a canonical
    lift falsifies Proposition E's literal claim as measured here.

  required_artifacts:
    - 'run manifest with the full enforced schema (code, environment, inputs, timing, result blocks) present from the start'
    - 'raw tabulated results for both instances: full image sets, the C-1 per-digit comparison, and the C-3 sweep tables'
    - 'the implementation script, committed alongside the run'
    - 'certificate block with kind: none and the explicit statement that a finite-precision computation observes only "at least r", never infinity'
    - 'an explicit independence statement naming what differs from the two prior scripts on each of the three required axes'

  assigned_to: executor
  approved_by: coordinator
  approval_note: >-
    Approved by ordinary Coordinator authority (AGENTS.md rule 1), executing
    DEC-20260903-9f1190's first next_action. Frozen as of this commit; any
    change is a new version, never an edit.
