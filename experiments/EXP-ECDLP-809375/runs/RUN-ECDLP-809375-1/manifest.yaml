  disagreement_accounting: >-
    No disagreement with the recorded runs was found on any quantity this run
    can compare. Specifically: the group-theoretic S_hat equals the recorded
    Hensel-constructed S_hat on all 8 base-p digits of BOTH coordinates on
    BOTH instances (C-1, a hard binary check on the load-bearing object); the
    r=8 D1 image on the canonical lift is [0, 8] on both instances, matching
    RUN-ECDLP-c373eb-1 and -2's part1_D1_image_canonical_lift; the on-fibre
    pair counts are 23 (A) and 20 (B), matching the recorded
    part1_on_fibre_count; the pair totals are 1035 (A) and 780 (B), matching
    the recorded part1_pairs_tabulated; and the recorded null-lift image
    [0, 1] is reproduced. Per-pair D1 values from the prior runs are not
    tabulated in their manifests, so the per-pair comparison is made against
    the image, the value counts and the on-fibre pair set rather than against
    a recorded per-pair table.

  null_family_observation:
    what_was_done: >-
      The specification's C-2/C-3 null lift ("perturb by adding p^e to a
      coordinate before lifting, with no order-n projection") admits two
      non-equivalent readings, and BOTH were tabulated at every (r, e) cell.
      Neither was chosen after seeing the result, and both are reported.
      raw_perturbation: x0 = S.x + p^e, y solved from the curve equation, no
      projection -- this mirrors the null lift recorded by the two prior runs,
      which used e = 1. canonical_offset: x0 = x(S_hat) + p^e, y solved, no
      projection.
    observation: >-
      The canonical_offset family reads {0, min(e, r)} in all 24 cells across
      both instances. The raw_perturbation family reads {0, 1} for every e at
      every r on both instances: the naive integer-representative lift of S is
      already off the canonical fibre at depth 1 (v_p(x(L) - x(S_hat)) = 1),
      so adding p^e for e >= 2 does not change the depth, which stays at
      min(1, e) = 1. Both families are recorded in full in raw-result.json.
    note: >-
      Recorded as an observation about which construction the parameter e
      actually controls. It is NOT an adjustment of the frozen prediction, and
      no completed run is re-scored by it. Whether the specification's C-3
      criterion should be read against one family or the other is a
      Coordinator question, not an Executor one.
    degenerate_cells: >-
      At e >= r the perturbation p^e is 0 in Z/p^r, so the canonical_offset
      "null" is literally the canonical lift and is not a null object at all.
      This occurs only at (r=4, e=4) and is flagged in raw-result.json as
      degenerate_equals_canonical_lift: true.

  addition_chain_note: >-
    Affine arithmetic over Z/p^r cannot represent a point in the kernel of
    reduction, and an intermediate multiple [i]L with n | i is exactly such a
    point. A monolithic ~(r log2 p)-bit ladder for the projection scalar
    visits ~2 r log2(p) intermediates and hits that set with high probability
    at r = 12 (it did, on the first implementation attempt -- recorded as
    DEV-2 below). The projection is therefore evaluated in stages, (r-1)
    multiplications by p followed by one multiplication by
    u = (p^(r-1))^-1 mod n, which computes the identical group element
    [p^(r-1) u] L. The residues mod n of every intermediate of every stage are
    recorded in raw-result.json under addition_chain_audit, together with the
    machine-checked assertion that none is 0 mod n and no addition step has
    colliding operands; the audit passes for both instances at r in
    {4, 8, 12}. This is a representability constraint of the mandated affine
    group law, not a change to the mathematics being measured.

  deviations_from_specification:
    - id: DEV-1
      description: >-
        Both readings of the C-2/C-3 null-lift construction were tabulated
        rather than one, because the specification's wording does not
        disambiguate them and they are not equivalent. This is an addition,
        not a substitution: the raw_perturbation family reproduces exactly
        what the prior runs recorded. See null_family_observation.
      severity: none_disclosed_addition
    - id: DEV-2
      description: >-
        The first implementation attempt evaluated the projection scalar as a
        single monolithic binary ladder. It completed instance A at r = 4 and
        r = 8 but raised KernelOfReduction at r = 12, correctly detecting that
        an intermediate multiple had left the affine chart. This was an
        implementation_error in the addition chain, caught by the code's own
        explicit non-unit guard BEFORE any measurement was recorded; no run
        record was produced from it. It was repaired by the staged evaluation
        described in addition_chain_note, and an explicit machine-checked
        chain audit was added. The measured quantity is unchanged: the r=4 and
        r=8 values produced by the failing version are identical to those
        reported here.
      severity: caught_pre_measurement
    - id: DEV-3
      description: >-
        An earlier draft of the chain-audit PREDICATE was itself wrong (it
        tested the pre-doubling scalar rather than the post-doubling one) and
        reported affine_safe: false for chains that had in fact executed
        without incident. The predicate was corrected before the recorded run.
        This affected only the reported audit flag, never any measured value:
        raw-result.json's measurements were byte-identical before and after
        the predicate fix.
      severity: caught_pre_measurement
    - id: DEV-4
      description: >-
        The packaged invocation is the second execution of the exact command
        in command.txt. The first was wrapped in /usr/bin/time -l, which the
        execution sandbox blocked from reading kern.clockrate and which
        therefore wrote a sandbox error into stderr.log. The wrapper was
        dropped, the exact command re-executed, and the resource figures taken
        from a separate identical invocation instead (see resources.note).
        Both invocations produced byte-identical raw-result.json; no run
        record was overwritten, because none had yet been written.
      severity: none_disclosed_infrastructure

  limitations:
    - >-
      Toy tier only: two ~10-bit instances, deliberately the SAME two already
      measured, because the variable under test here is the implementation and
      not the instance. Nothing here licenses any transfer to cryptographic
      scale, and none is claimed.
    - >-
      This run establishes agreement between two implementations on a toy
      tabulation. It cannot upgrade the scale of the underlying finding, and
      agreement between two implementations is not agreement about the
      infinite-precision mathematics: every value r reported here is bounded
      below only, per the precision_cap_statement.
    - >-
      Independence is asserted about the implementation, not about the
      author's knowledge: the frozen specification itself states the lift
      formula and the expected image, so this is an independent IMPLEMENTATION
      of a stated construction, not a blind re-derivation of the quantity. The
      recorded x_hat/y_hat were read (as C-1 requires) only after the
      group-theoretic S_hat had been computed by the script.
    - >-
      Per-pair D1 values from the prior runs are not present in their
      manifests, so the metric "count of any pair whose value differs from the
      corresponding recorded run value" is answered at the level of the image,
      the value counts and the on-fibre pair set (see
      disagreement_accounting), not per pair.

