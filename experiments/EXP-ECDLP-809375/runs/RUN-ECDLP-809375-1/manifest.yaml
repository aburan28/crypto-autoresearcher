  independence_statement:
    purpose: >-
      This run exists to discharge objection J2 of DEC-20260903-9f1190: that
      RUN-ECDLP-c373eb-1 and -2 share 266 of ~270 executable lines with every
      function byte-identical, so their agreement carries likelihood ratio 1
      on whether the reported D1 image is mathematics or shared-code artifact.
    axis_1_lift_construction:
      prior_runs: >-
        Hensel/Newton iteration: f(x0) defined as the Jacobian Z-coordinate of
        [n](x0, HenselLift_y(x0)), x0 = S.x shown to be a simple root of f mod
        p, then single-variable Newton correction one p-adic digit at a time
        for r+1 steps.
      this_run: >-
        Group-theoretic projection with NO iteration of any kind on the
        order-n condition: take an arbitrary curve-satisfying lift L of S and
        set S_hat = [p^(r-1) * ((p^(r-1))^-1 mod n)] L. The scalar is 1 mod n
        so S_hat still reduces to S, and is divisible by p^(r-1) so it
        annihilates the kernel of reduction at precision r. The auxiliary
        lift's y-coordinate is a Tonelli-Shanks square root in the cyclic
        group (Z/p^r)^* -- group exponentiation plus a 2-Sylow discrete log --
        which is likewise not a per-digit lift. No derivative, no finite
        difference, and no Newton correction appears in this implementation.
    axis_2_group_law:
      prior_runs: 'Jacobian projective coordinates (add-2007-bl and textbook doubling).'
      this_run: >-
        Affine coordinates over the ring Z/p^r with explicit modular inverses
        pow(d, -1, p**r), each guarded by an explicit unit test d % p != 0.
        The non-unit branch is handled explicitly rather than allowed to
        raise: it means the operands reduce to the same point of E(F_p)
        without being equal, so the result lies in the kernel of reduction and
        has no affine representation, and it is raised as KernelOfReduction
        and handled by the caller. No projective and no Jacobian coordinate
        appears anywhere in this file.
    axis_3_no_reuse: >-
      experiments/EXP-ECDLP-c373eb/implementation/rc1_tabulation.py and
      rc1_tabulation_run2.py were NOT opened, read, imported, copied or
      adapted at any point during this task. The only data taken from
      EXP-ECDLP-c373eb is the recorded x_hat/y_hat pair in each run manifest,
      read solely as the comparison target of control C-1, together with the
      instance parameters, which the frozen specification restates
      independently anyway.
    additionally_independent: >-
      #E(F_p), the order of S, and the discriminant were recomputed here from
      scratch (exhaustive character sum over F_p and direct repeated addition)
      rather than taken from the prior manifests. All three agree with the
      recorded values (1034 / 47 and 984 / 41).

