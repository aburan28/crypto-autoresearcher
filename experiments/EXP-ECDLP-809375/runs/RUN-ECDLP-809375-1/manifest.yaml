      construction-correctness check under the specification's
      invalidation_rules, not a claim requiring the certificate protocol of
      docs/claims-and-verification.md.
    precision_cap_statement: >-
      EVERY reported valuation equal to r means "v_p >= r, observed only to
      the finite precision r used in this computation" -- NEVER literal
      infinity. A finite-precision computation cannot observe infinity. In
      particular the value 8 in the r=8 D1 images below arises where the
      difference of the two x-coordinates is exactly 0 in Z/p^8; the true
      valuation is unbounded-above as far as this run can see, and no value in
      raw-result.json may be read as an infinite-precision claim.

