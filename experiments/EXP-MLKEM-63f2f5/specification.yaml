experiment:
  id: EXP-MLKEM-63f2f5
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-MLKEM-d9062d
  question_id: RQ-MLKEM-002
  goal_id: GOAL-MLKEM-002
  batch_id: null
  title: >-
    Silent-set mechanism taxonomy, stride reachability, and lane-coverage
    population audit for ML-KEM comparison conformance: a zero-compute forced-
    value gate followed by an out-of-sample planted-comparator battery under GNU
    ld --wrap

  goal_relationship: >-
    GOAL-MLKEM-002 is COMPLETED (DEC-20260731-001) and its record forbids
    reopening experimental batches under maximum_batches = 4 without an explicit
    campaign-budget amendment and a new or successor goal. THIS CONTRACT DOES
    NOT REOPEN THOSE BATCHES AND MUST NOT BE SCHEDULED INSIDE THEM. It is
    attached to GOAL-MLKEM-002 only for traceability of the records it audits.
    Stages S1 through S3 consume committed archived artifacts and arithmetic and
    require no wolfSSL build, no library fetch and no network; stages S4 and S5
    require a successor goal with its own budget before they may be considered.

  objective: >-
    If separately approved, frozen and authorized under a successor goal:
    determine (i) whether three single-parameter closed forms reproduce all four
    archived silent-set profiles of EV-MLKEM-005 with exactly zero integer
    residual; (ii) whether the cardinality profile identifies the mechanism at
    FIPS 203 ciphertext lengths, or admits a fibre of size at least two;
    (iii) which (stride, parameter set) cells the coverage-deficit class can
    reach at all, given that every ML-KEM ciphertext length is a multiple of 32;
    and (iv) whether a lane-coverage predicate yields a non-empty, decidable
    population for the isolation-versus-systemic question that GOAL-MLKEM-002
    recorded as second_impl_unavailable. No conclusion about any implementation's
    correctness is sought.

  what_this_is_not:
    - Not a key recovery, oracle construction, exploitation path, disclosure, or attack-cost estimate. RQ-MLKEM-002 forbids all five.
    - Not a timing, power, EM, cache, or fault measurement. Functional comparison completeness only.
    - Not a statement about MLWE hardness, passive ML-KEM security, or any deployed system, network peer, or third-party key.
    - Not a claim that any implementation is correct or defective. No new defect is alleged and none is sought; any deficiency observed in unmodified upstream code is escalated, not published.
    - Not a reopening of GOAL-MLKEM-002, not a status change to any record, not H-MLKEM-004 support, and not a paraphrase of EV-MLKEM-008, -009 or -010.
    - Not an approval, freezing, execution authorization, run, observed output, or evidence. No run has happened.
    - Not a correctness proof of any comparison routine: a null under a finite generator is not a correctness proof (RQ-MLKEM-002 constraint).

  claim_ceiling:
    tier: toy
    laboratory_class_descriptor: laboratory_implementation_conformance
    exact_scope_a_run_could_support: >-
      At most: that three named closed forms do or do not reproduce four
      committed archived profiles exactly; that a stated fibre of the cardinality
      observable does or does not have size at least two; that L mod w is or is
      not zero in 18 of 27 named cells; that a battery of comparators PLANTED BY
      THIS CONTRACT does or does not exhibit its forced silent sets under the
      GNU ld --wrap instrument on one toolchain and one target triple; and, if
      stage S5 is ever authorized, that the lane-coverage fraction of n fetched
      implementations was measured to be some value, stated as a FLOOR over what
      was fetched. Toy and laboratory conformance evidence is never crypto-scale
      or MLWE evidence (AGENTS.md rule 7). No outcome may establish an attack,
      cost, exponent, or deployed-scheme conclusion.

  inputs:
    ciphertext_lengths:
      ML-KEM-512: 768
      ML-KEM-768: 1088
      ML-KEM-1024: 1568
    length_derivation: >-
      L = 32*(du*k + dv) with (k, du, dv) = (2,10,4), (3,10,4), (4,11,5).
      RECALLED FROM FIPS 203, UNVERIFIED. Stage S1c checks it against the
      published standard; until it does, every dependent statement carries the
      label. The three integers themselves are corroborated in-repo by
      EV-MLKEM-005's measured cardinalities.
    control_lengths: [1000, 1600]
    control_length_rationale: >-
      1000 is not a multiple of 32 and is the null for the divisibility
      obstruction. 1600 is a multiple of 32 and of 64 but not of 128, and is the
      separating length for the C-BND(1536) versus C-COV(64) collision.
    strides_enumerated: [1, 2, 4, 8, 16, 32, 64, 128, 256]
    planted_arms:
      C-BND: {N: ["L", 1536, "L-1"]}
      C-COV: {w: [16, 32, 64, 128]}
      C-RED: {phi: [1, 0.875, 0.75, 0.5, 0.25], nlanes: 32}
      C-SCALAR: {description: "byte-at-a-time scalar comparator, no lanes; out-of-population control"}
    mutation_sweep: >-
      For each arm and each L, for each index i in [0, L) and each nonzero delta
      in [1, 255]: form b = a with b[i] = a[i] XOR delta and record the
      comparison verdict. Exhaustive; 255*L probes per (arm, L) cell.
    base_buffer_derivation: >-
      The base buffer a for length L is the first L bytes of the concatenation
      SHA256(domain || "|" || "base" || "|" || decimal(L) || "|" || decimal(j))
      for j = 0, 1, 2, ..., big-endian, ASCII encoding of the domain string.
    master_seed: 63242565
    domain: "EXP-MLKEM-63f2f5/v1"
    seed_encoding: >-
      ASCII bytes of domain || "|" || label || "|" || decimal(L) || "|" ||
      decimal(counter), hashed with SHA-256; digest bytes consumed big-endian.
      Every buffer used anywhere in the run is reproducible bit-for-bit from
      (domain, label, L, counter) with no other input.
    determinism_note: >-
      The measurement is deterministic given (arm, L, base buffer): the silent
      set of a comparison routine is a property of the routine, not of a random
      draw. The seed derivation exists so a third party reconstructs the exact
      buffers, not because the result is expected to vary. Replication across
      base buffers is nonetheless required (see replication) precisely to
      detect a routine whose silent set is input-dependent, which would falsify
      HEUR-SIL-1's closed-form claim.
    environment_measured_this_session:
      gcc: /usr/bin/gcc
      python: 3.11.15
      numpy_importable: true
      note: >-
        Measured in the drafting session on 2026-08-05 and recorded because the
        program's scouting notes disagree about container contents. No Sage,
        solver, or lattice library is required by any stage. Binutils ld
        version, target triple, and AVX2 availability are NOT yet measured and
        are stage S0 preflight items.

  stages:
    S0_preflight:
      cost: seconds
      network: false
      content: >-
        Record gcc version, GNU ld version, target triple, and whether
        -Wl,--wrap links and fires on a trivial two-object test. Record the
        result as INFRASTRUCTURE STATUS. A failure here blocks S4 only.
      can_terminate_run: false
    S1_forced_tables:
      cost: minutes, zero measurement
      network: false
      content: >-
        (a) Compute the 27-cell reachability table L mod w and list the nonzero
        cells. (b) Compute the forced profiles of C-BND(N) for all N in
        [1, 1568], C-COV(w) for w in {8,...,512}, C-RED(phi) for phi in
        {1, 7/8, 3/4, 1/2, 1/4}, and record which reproduce (0, 0, 32) and which
        reproduce (384, 544, 784). (c) Check L = 32*(du*k + dv) against FIPS 203
        if the document can be obtained; otherwise record the failure and keep
        the RECALLED-UNVERIFIED label. (d) Run the null-length check at L = 1000
        and the separating computation at L = 1600. Emit the table, hash it, and
        commit the hash before any later stage begins.
      can_terminate_run: true
      termination_rule: >-
        If G1 fails (any anchor residual nonzero) or G3 fails (other than 5
        nonzero cells), STOP. The mechanism model does not describe the founding
        measurements and no later stage may run. This is the cheapest decisive
        gate in the contract and it costs no measurement at all.
    S2_stride_read:
      cost: minutes, one file read
      network: true (fetch of one pinned source file)
      content: >-
        Fetch wolfcrypt/src/wc_mlkem_asm.S at peeled commit 1d363f3 and
        wolfcrypt/src/port/arm/armv8-mlkem-asm.S at 1d363f3 and ac01707.
        Extract, verbatim, the vector-load offsets of mlkem_cmp_avx2 and the
        reduction instructions of mlkem_cmp_neon. Resolve C-BND(1536) versus
        C-COV(64) by the stride pattern. If the fetch fails, record
        INFRASTRUCTURE UNAVAILABLE and continue; the collision then stands
        unresolved, which is itself a reportable finding.
      can_terminate_run: false
    S3_archived_index_patterns:
      cost: minutes, archived data only
      network: false
      content: >-
        From the committed per-index tables of EXP-MLKEM-002 (as cited by
        EV-MLKEM-005), recover the index-level silent sets, compute the minimal
        period and residue set of each, evaluate is_suffix, and settle the
        784-versus-768 discrepancy recorded in H-MLKEM-d9062d mechanism (9). If
        the per-index tables are not present in the tree, record ARTIFACT
        UNAVAILABLE and report the discrepancy as unresolved. Do not infer the
        pattern from the cardinality.
      can_terminate_run: false
    S4_planted_battery:
      cost: under one hour, local compile only
      network: false
      content: >-
        Compile every planted arm as a separate translation unit exporting a
        symbol named mlkem_cmp_probe, link it into a driver via
        -Wl,--wrap=mlkem_cmp_probe following the method admitted by
        EV-MLKEM-010, attest the wrap call counts, and run the exhaustive
        single-byte sweep at every L in {768, 1088, 1568, 1000, 1600}. Report
        measured versus forced silent sets per arm.
      can_terminate_run: false
      requires: S0 wrap preflight pass
    S5_population_census:
      cost: bounded by fetch budget
      network: true
      content: >-
        Source census of the reduction expression and effective stride of
        publicly fetchable ML-KEM comparison routines, with measured
        confirmation wherever a build succeeds. NOT AUTHORIZED BY THIS CONTRACT
        AND NOT PART OF ITS SUCCESS CRITERION. It requires a successor goal with
        its own budget and its own approval.
      can_terminate_run: false

  arms_and_controls:
    treatment: >-
      The three closed forms evaluated against the four archived profiles (S1),
      and the planted C-BND, C-COV and C-RED arms measured on the instrument
      (S4). "Treatment" here is a model-versus-committed-number comparison and a
      construction-versus-measurement comparison; there is no adversary, no
      secret, and no library under test.
    measured_null:
      - >-
        NULL-COMPLETE. A planted comparator that is complete by construction: a
        full-register reduction over the whole buffer, structurally identical to
        PQClean's `1 - _mm256_testz_si256(h, h)` shape. FORCED VALUE, DERIVED
        BEFORE THE RUN: silent set EMPTY at all five lengths, phi = 1, period
        undefined. IT CAN FAIL: any silent index reported for a comparator that
        is complete by construction is an instrument failure and stops the run.
        Committed precedent for what a pass looks like: EV-MLKEM-005's post-fix
        arms at zero silent indices, coverage fraction 1.0, both seeds.
      - >-
        NULL-LENGTH. The identical reachability computation at L = 1000, which
        is not a multiple of 32. FORCED: L mod 32 = 8 and L mod 16 = 8, so the
        w <= 32 row must be NONZERO. IT CAN FAIL: if the table reports zeros
        there, the zeros at ML-KEM lengths are an artifact of the script and the
        divisibility obstruction is void.
      - >-
        NULL-DEADTAIL. A planted comparator with stride 32 and a deliberately
        sabotaged remainder path. FORCED: silent set EMPTY at 768, 1088 and 1568
        (the remainder path is dead code there) and NONEMPTY at 1000. This is
        the direct experimental realization of the zero-power statement and it
        can fail in both directions.
    positive_controls:
      - >-
        POS-RED. A planted comparator at phi = 1/2 with 64-byte periodicity.
        FORCED BEFORE THE RUN: silent cardinalities exactly 384, 544, 784 and a
        silent set that is a union of residue classes modulo 64 -- the archived
        pre-fix NEON numbers reproduced by construction on a different toolchain
        and target. IF THE INSTRUMENT DOES NOT REPRODUCE THEM, IT CANNOT SEE THE
        MECHANISM AND NO NEGATIVE OR NULL RESULT MAY BE REPORTED FROM IT AT ALL.
      - >-
        POS-COV. A planted comparator at stride 64 with no remainder handling.
        FORCED: silent set exactly {1536..1567} at L = 1568, i.e. 32 indices,
        empty at 768 and 1088 -- the archived pre-fix AVX2 profile reproduced by
        construction. Same disposition as POS-RED on failure.
      - >-
        POS-BND. A planted comparator with hardcoded bound 1536. FORCED:
        identical to POS-COV at all three ML-KEM lengths, and DIFFERENT at
        L = 1600 (64 versus 0). This pair is the executable demonstration that
        the collision is a property of the standardized lengths.
    out_of_population_control: >-
      NEG-SCALAR. A purely scalar byte-at-a-time comparator, which has no lanes.
      The lane-coverage predicate must return OUT OF POPULATION, not phi = 1.
      A predicate that scores it as a passing member has not identified the
      load-bearing structure and must be restated before any census.
    graded_control: >-
      GRAD-RED with five points, phi in {1, 7/8, 3/4, 1/2, 1/4}, forced |S| at
      L = 1568 of (0, 196, 392, 784, 1176), EXACTLY LINEAR in (1 - phi). The
      pre-registered check is the linear residual, not the ordering. A
      non-linear response localises an instrument artifact, most plausibly a
      probe that saturates once any silent index is found. GRAD-COV with four
      points, w in {16, 32, 64, 128}, forced |S| at L = 1568 of (0, 0, 32, 32) --
      PRE-REGISTERED AS NON-MONOTONE ACROSS THE FULL STRIDE SWEEP, which is the
      structural fact that makes coverage defects parameter-set-selective; a
      report presenting the stride sweep as monotone has been computed wrongly.
    ordering_control: >-
      The S1 forced tables, the planted-arm expectations, and the null and
      positive-control forced values are written, hashed and committed BEFORE
      any file is fetched in S2, any archived table is opened in S3, or any
      comparator is compiled in S4. Within S4 the NULL-COMPLETE and NULL-DEADTAIL
      arms are scored and committed BEFORE any treatment arm is looked at.
      Absence of that commitment is invalid_measurement.
    comparability_policy: >-
      No arm of this contract is comparable to any arm of EXP-MLKEM-002 through
      EXP-MLKEM-009 as a measurement. The archived profiles are used as FIXED
      TARGET INTEGERS that closed forms must reproduce, never as a control group,
      never as a baseline for a difference, and never re-derived to make them
      agree. Cross-contract comparison of measured quantities would require a
      separately registered comparator contract naming both domains, both
      instruments, the statistic and the failure disposition.

  metrics:
    primary:
      - "G1 anchor residual: max over the twelve committed cells of |forced |S| - archived |S||."
      - "G2 collision multiplicity: count of enumerated (class, parameter) pairs whose forced profile equals (0, 0, 32)."
      - "G3 reachability: count and identity of nonzero cells in the 27-cell L mod w table."
      - "G6 planted battery residual: max over all planted arms and all lengths of |measured |S| - forced |S||."
    secondary:
      - "G4 cross-class exclusion count for the profile (384, 544, 784)."
      - "G5 shape discrimination at ML-KEM-1024: (is_suffix, minimal period) for each archived arm."
      - "G7 separating measurement at L = 1600 for POS-BND versus POS-COV."
      - "G8 population contrast: strict-coverage-predicate population size versus lane-coverage-predicate population size over implementations named in committed records."
      - "G9 derived mutual information in bits between the recorded package class and the isolation ground truth under an empty strict neighborhood."
      - "Wrap-attest call counts per symbol per arm; verbatim assembly offsets from S2; minimal period and residue set per archived arm from S3."
      - "Infrastructure status of every stage, separately from every mathematical result."

  preregistered_prediction:
    - quantity: G1 anchor residual
      formula: >-
        max over cells of |closed_form(class, param, L) - archived_cardinality|,
        with C-BND(1536), C-COV(64), C-RED(1/2) and the no-defect parameters,
        against (0,0,32), (0,0,32), (384,544,784), (0,0,0).
      predicted_value: "EXACTLY 0"
      source: >-
        Derived in H-MLKEM-d9062d mechanism (4) from EV-MLKEM-005's committed
        cardinalities; each class parameter fixed from a source fact recorded
        independently of the cardinality it must reproduce.
    - quantity: G2 collision multiplicity
      formula: >-
        |{ (class, param) in {C-BND(N) : 1 <= N <= 1568} union
           {C-COV(w) : w in {8,16,32,64,128,256,512}} :
           profile(class, param) = (0, 0, 32) }|
      predicted_value: "EXACTLY 2, namely C-BND(1536) and C-COV(64)"
      source: H-MLKEM-d9062d proof_search_map.observation_collision.
    - quantity: G3 reachability
      formula: "count of (w, L) with L mod w > 0 over 9 strides x 3 lengths"
      predicted_value: >-
        EXACTLY 5, at (64,1568)=32, (128,1088)=64, (128,1568)=32,
        (256,1088)=64, (256,1568)=32; and EXACTLY 0 in all 18 cells with w <= 32.
      source: H-MLKEM-d9062d conjunct (B), HEUR-SIL-2, computed on this machine.
    - quantity: G6 planted battery residual
      formula: "max over planted arms and lengths of |measured - forced|"
      predicted_value: "EXACTLY 0"
      source: >-
        H-MLKEM-d9062d HEUR-SIL-1. This is the only genuinely out-of-sample test
        in the contract: none of the planted comparators existed when the
        classes were written.
    - quantity: G7 separating measurement
      formula: "|S(1600)| for POS-BND(1536) and for POS-COV(64)"
      predicted_value: "EXACTLY 64 and EXACTLY 0 respectively"
      source: H-MLKEM-d9062d conjunct (C); 1600 - 1536 = 64 and 1600 mod 64 = 0.
    - quantity: G9 outcome-class information
      formula: >-
        I(recorded package class ; isolation ground truth | strict neighborhood
        empty), computed from the goal's frozen precedence as a channel.
      predicted_value: "EXACTLY 0 bits"
      source: >-
        H-MLKEM-d9062d proof_search_map.quantifier_order. Derived, not measured.
        A statement about what the criterion licenses, NOT a claim that
        GOAL-MLKEM-002 violated it -- the goal satisfied its criterion as
        written and its evidence records already forbid over-reading it.

  replication:
    planned_runs: 3
    seeds: [63242565, 63242566, 63242567]
    seed_role: >-
      Each seed selects a different base buffer via the declared derivation. The
      silent set of a routine is expected to be seed-INVARIANT; the three seeds
      exist to detect an input-dependent silent set, which would falsify the
      closed-form claim of HEUR-SIL-1. Seed-to-seed spread is reported BEFORE
      any model residual is reported.
    interpretation: >-
      Three runs of a deterministic measurement are a determinism check, not
      statistical power. They cannot support, reject, or validate anything
      beyond the explicitly scoped laboratory instrument observation.

  budget:
    maximum_runs: 3
    maximum_wall_seconds: 9000
    maximum_cpu_seconds: 18000
    maximum_peak_rss_bytes: 2147483648
    maximum_total_disk_bytes: 2147483648
    maximum_workers: 1
    network: >-
      Required only by S2 (one pinned source file) and S5 (not authorized).
      S0, S1, S3 and S4 run with no network.
    stage_ceilings:
      S0: 120
      S1: 600
      S2: 1800
      S3: 1800
      S4: 3600

  stopping_rules:
    - Do not execute while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Do not execute inside any GOAL-MLKEM-002 batch. Execution requires a successor goal with its own approved budget; GOAL-MLKEM-002's record forbids reopening batches under maximum_batches = 4 without a campaign-budget amendment.
    - Stop at S1 if G1 is nonzero or G3 is other than 5. The model does not describe the founding measurements.
    - Stop before any treatment arm of S4 if the NULL-COMPLETE and NULL-DEADTAIL forced values have not been committed and scored.
    - Stop and report instrument failure if POS-RED or POS-COV does not reproduce its forced silent set. No negative and no null result may be reported from a failed instrument.
    - Stop and report probe-local measurement if wrap-attest call counts are zero for the symbol under test on any arm carrying a conclusion.
    - ESCALATION STOP. If any stage observes a conformance deficiency in unmodified upstream code, halt immediately, escalate to the coordinator, and publish nothing. RQ-MLKEM-002 constraint, binding on every agent.
    - Stop on any budget, memory, or disk ceiling breach and record it as infrastructure.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any class parameter adjusted after an anchor cardinality has been observed. Parameters are fixed by source facts and frozen in H-MLKEM-d9062d assumptions (1)-(11); a post-hoc adjustment requires a versioned protocol amendment with confirmatory_status exploratory_only and is never an edit.
    - Any missing forced-table hash, missing ordering commitment, missing per-arm raw record, or missing wrap-attest record.
    - Any use of the call-site INTERPOSE_COMPARE construction as load-bearing evidence. EV-MLKEM-009 refuted it as a probe-local multiplicity gate (OBJ-RT006-001/002) and EV-MLKEM-010 forbids it as load-bearing.
    - Any cross-contract comparison of measured quantities without a separately registered comparator contract.
    - Any statement in the outputs that raises the claim tier above toy/laboratory, paraphrases EV-MLKEM-008/009/010 as H-MLKEM-004 support, or presents a null census as an isolation proof.

  success_criterion: >-
    This draft has NO current success outcome because it is not authorized for
    execution. If a later, separately approved and frozen successor is executed
    under a successor goal, its only positive disposition is: S1 completes with
    G1 = 0 and G3 = 5 and G2 >= 2 under the committed forced tables; the
    ordering commitments are present; NULL-COMPLETE, NULL-LENGTH and
    NULL-DEADTAIL all return their forced values; POS-RED, POS-COV and POS-BND
    all reproduce their forced silent sets; NEG-SCALAR is scored out of
    population; G6 = 0 across the whole planted battery at all three seeds with
    seed spread reported first; and the outputs state, with its exact boundary,
    which mechanism classes are reachable at which (stride, parameter set) cells
    and which are not. That disposition establishes no attack, cost, exponent,
    crypto-scale, MLWE, or deployed-scheme claim, and asserts nothing about the
    correctness of any implementation.

  falsification_criterion: >-
    Any of: G1 nonzero at any anchor cell; G3 other than 5 nonzero cells or any
    ML-KEM length not divisible by 32; G2 equal to 1; G4 nonzero, i.e. some
    C-BND or C-COV member reproducing (384, 544, 784); G5 failing to separate
    the two archived arms at ML-KEM-1024; G6 nonzero at any planted arm; G7
    returning equal values for POS-BND and POS-COV at L = 1600; or NEG-SCALAR
    scored as an in-population pass. Each falsifies a named conjunct of
    H-MLKEM-d9062d and each is reported with the conjunct it kills. A
    falsification at S1 costs no measurement at all, which is the point of the
    stage ordering.

  outcomes:
    no_execution_authorization: >-
      THE ONLY CURRENT DISPOSITION: review_required draft under a completed
      goal. No run, no evidence, no mathematical inference, no status change.
    future_taxonomy_readout: >-
      Only after separate approval, freezing and authorization under a successor
      goal. Scoped laboratory/toy only; never an attack, cost, or MLWE claim.
    named_no_go: >-
      If conjuncts fail, the deliverable is a NAMED NO-GO at the inventor-
      protocol section 4 standard: the obstruction, the argument, the exact
      tested boundary, and forward guidance naming the successor population.
      A count of rejected classes is a fatigue report and is not an acceptable
      output of this contract.
    infrastructure_or_integrity_failure: >-
      Inconclusive INFRASTRUCTURE signal, never negative mathematical evidence
      about any conjunct, any mechanism, or any implementation (AGENTS.md rule
      5). A failed fetch in S2 leaves the collision unresolved and that is
      reported as unresolved; a failed wrap preflight blocks S4 and blocks
      nothing else; a missing archived per-index table blocks S3 and is recorded
      as ARTIFACT UNAVAILABLE.

  scale_relevance:
    tier: toy
    transfer_argument: >-
      Two of the four conjuncts are ARITHMETIC IDENTITIES about the standardized
      parameter sets and are therefore exact at the parameter sets that matter,
      not extrapolations from a smaller instance: 32 | L and the reachability
      table hold at ML-KEM-512, -768 and -1024 themselves. That is the only
      sense in which anything here reaches deployed parameters.
    stated_limit: >-
      Everything else is bounded to laboratory builds, single-byte differential
      probing, one toolchain, one target triple, and the arms actually measured.
      It transfers to no cryptanalytic quantity, to no attack cost, to no
      multi-byte or physical channel, and to no statement about any deployed
      system. Toy and laboratory conformance evidence is never crypto-scale
      validation (AGENTS.md rule 7).

  infrastructure_failure_disposition: >-
    A timeout, crash, missing dependency, failed fetch, failed link, absent
    archived artifact, or exhausted budget is recorded as INFRASTRUCTURE SIGNAL
    with its exact cause and is NEVER negative mathematical evidence against
    H-MLKEM-d9062d or any conjunct of it (AGENTS.md rule 5). Stages S1 and S3
    require no network and no build; if every other stage fails, S1 alone still
    yields the forced tables and the reachability result, and the report says so
    rather than reporting a blocked run as a null.

  required_artifacts_if_later_authorized:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - The S1 forced-value tables with the generating script, its hash, and the pre-fetch commitment timestamp.
    - Verbatim vector-load offsets and reduction instructions from S2, or a recorded fetch failure with its exact error.
    - Per-index silent sets, minimal periods and residue sets from S3, or a recorded ARTIFACT UNAVAILABLE.
    - Source of every planted comparator, the exact compile and link command lines, and the wrap-attest call counts per symbol per arm.
    - Raw per-(arm, L, seed) silent-set tables, the null-before-treatment commitment, and the seed-spread report emitted before any model residual.
    - Manifest with git commit and dirty-tree state, environment and dependency versions, requested policy, backend, resolved model identifier and probe-verification status, reasoning effort, fallback and degraded flags, stdout, stderr, timestamps and resource measurements.
