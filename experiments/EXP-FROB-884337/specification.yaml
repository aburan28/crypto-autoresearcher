# =============================================================================
# EXP-FROB-884337 — version 1, not approved. Specified from
# IDEA-20261006-aa03f9 / H-FROB-4aba8e. Status is review_required because
# GOAL-FROB-6333a9 already holds four approved contracts with no run
# (EXP-FROB-30006a, EXP-FROB-7d51ae, EXP-FROB-ec08b5, EXP-FROB-f495ea)
# against a cap of 3. The driver is written. No trial plan is frozen,
# because a trial plan requires status approved. Success is the source
# idea's prediction: b(norm) <= 4 and L(norm) >= 2, with the random
# label at b >= 6 and the x-coordinate at L = 1, b = 2. The concrete
# negative is b(norm) > 4 while L(norm) >= 2 and the calibrations pass.
# This session did not compute (L, b). Source idea bytes are blob
# cf564cab3f4fa13a31fab051965bb9c6999615fa.
# =============================================================================
experiment:
  id: EXP-FROB-884337
  hypothesis_id: H-FROB-4aba8e
  question_id: RQ-FROB-7d8dd4
  goal_id: GOAL-FROB-6333a9
  source_idea: IDEA-20261006-aa03f9
  version: 1
  title: >-
    One-step branching of the field norm of x on y^2 = x^3 + x + 1
    over F_343
  status: review_required
  approved_by: null
  designed_at: '2026-10-07'
  frozen: false
  execution_authorized: false
  packaging_only: false
  approval:
    approved_by: null
    composing_decision: DEC-20261007-9ac746
    withheld_reason: >-
      python3 tools/portfolio_kpis.py --capacity GOAL-FROB-6333a9
      reported approved_unrun=4 against cap 3, naming
      EXP-FROB-30006a, EXP-FROB-7d51ae, EXP-FROB-ec08b5, and
      EXP-FROB-f495ea. area:FROB reported approved_unrun=13.
      Approving this contract on 2026-10-07 would be refused. The
      scientific fields below are filled. A later decision may approve
      after one of those four has a run or is withdrawn.
    implementation_authorized: false
    scientific_execution_authorized: false
    scientific_execution_scope: >-
      When a later approval frees a slot, work only on y^2 = x^3 + x + 1
      over F_7 with affine points over F_343. Score (L, b) for the
      x-coordinate, the field norm of x, the frozen random label onto
      seven bins, and the identity on the first 30 lexicographic
      points. Do not search for a discrete logarithm and do not add a
      prime to the claim.
    frozen: false
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
      applied: false

  objective: >-
    Decide whether b(norm) <= 4 and L(norm) >= 2. The concrete negative
    is that the calibrations pass, L(norm) >= 2, and b(norm) > 4. No
    faster discrete-logarithm algorithm is in scope.

  inputs:
    curve: >-
      A=1, B=1, model y^2 = x^3 + x + 1 over F_7. The discriminant
      residue 4A^3+27B^2 mod 7 is 3. A zero residue is instrument_failure.
    extension: >-
      F_343 = F_7[z] modulo the monic irreducible cubic of least
      coefficients in lexicographic order. The driver records that
      polynomial. Affine points are pairs (x, y) with y^2 equal to the
      right-hand side. The point at infinity is omitted.
    norm: >-
      The norm of a nonzero field element is that element to the power
      (7^3-1)/(7-1) = 57. The norm of zero is zero. A value outside F_7
      is instrument_failure.
    branching: >-
      L >= 2 means the affine count is at least four times the image
      size. b is the exact rational whose numerator is the sum, over
      ordered pairs of image labels, of the number of distinct labels
      of A+B, and whose denominator is the square of the image size.
      Sums equal to infinity are omitted, except on the identity
      control, where infinity is one label. The driver is
      experiments/EXP-FROB-884337/implementation/run.py. The checker is
      experiments/EXP-FROB-884337/implementation/check.py.
    random_label: >-
      Affine points in lexicographic order receive successive integers
      mod 7. The label is not redrawn. All seven bins must be nonempty
      and b must be at least 6, or the norm is not scored.
    identity_control: >-
      The first 30 lexicographic affine points, each its own label.
      The required reading is L = 0 and b = 1.

  controls:
    - id: x-calibration
      statement: >-
        The x-coordinate returns mean fibre size exactly 2 and b
        exactly 2. Any other pair voids the run.
    - id: identity-control
      statement: >-
        The identity on the first 30 points returns mean fibre size 1
        and b exactly 1. Otherwise the meter is void.
    - id: random-label
      statement: >-
        The frozen label uses seven nonempty bins and has b >= 6.
        A smaller b means the norm gate is not interpreted.
    - id: loop-agreement
      statement: >-
        Swapping the order of summation leaves b unchanged as a
        rational, for the x-coordinate, the norm, the random label,
        and the identity.
    - id: discriminant
      statement: The discriminant residue mod 7 is not zero.

  independent_variables:
    - whether the projection is the x-coordinate, the norm, the random label, or the identity
    - the maximum fanout, which is recorded and does not choose the row

  metrics:
    primary:
      - id: b_norm
        statement: >-
          The exact rational b of the norm. The idea's prediction is
          b <= 4 together with L >= 2. The concrete negative is b > 4
          while L >= 2 and the calibrations pass.
    secondary:
      - id: L_norm
        statement: >-
          Whether the mean norm fibre has size at least 4. This is
          L >= 2. L < 2 with the calibrations passed is the not_lossy row.
      - id: x_pair
        statement: mean fibre and b of the x-coordinate
      - id: random_b
        statement: b of the frozen label onto seven bins
      - id: identity_pair
        statement: mean fibre and b of the 30-point identity
      - id: norm_image_size
        statement: the number of distinct norm values, an integer at most 7
      - id: affine_point_count
        statement: the number of affine points
      - id: max_fanout
        statement: >-
          The maximum, over fibre pairs, of the number of distinct
          norms of A+B. This metric does not choose the reading row.

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 is the mean b <= 4. The maximum fanout is the tail named in
    the source idea. It is written into the artifact and does not
    choose the reading row.

  preregistered_prediction:
    quantity: >-
      b and L of the field norm of x on the affine points of
      y^2 = x^3 + x + 1 over F_343, with the x-coordinate and the
      frozen seven-bin label as calibrations.
    formula: >-
      b(norm) <= 4 and L(norm) >= 2, b(random label) >= 6, and the
      x-coordinate has b = 2 and L = 1. The concrete negative is
      b(norm) > 4 while L(norm) >= 2 and the calibrations pass.
      L(norm) < 2 with the calibrations passed is a second negative.
      Source idea IDEA-20261006-aa03f9. Neither rational was computed
      before this formula was written.
    source: >-
      IDEA-20261006-aa03f9. The definition of L and b was read from
      IDEA-20260802-002. KR-IC-46d822, KR-IC-b0fcda, KR-RHO-13bf67,
      and KR-RHO-755e35 were opened in this session and do not state
      this pair.

  scale_relevance:
    tier: toy
    justification: >-
      F_343 is below the question's toy window and far below a
      cryptographic field. No transfer to a larger field is assumed.
      The sample is one curve. The minimum effect is the idea's own
      pair b <= 4 and L >= 2.
    correspondence: >-
      Direct enumeration of affine points. No Deuring correspondence
      is used.

  tail_checks:
    - >-
      b <= 4 meets the branching prediction. b > 4 with L >= 2 is the
      negative. No third band is introduced after the rational is seen.
    - >-
      The maximum fanout is reported. A maximum of at least 7 does not
      move the row. The row is chosen from b and L only.

  replication:
    seeds:
      - EXP-FROB-884337|claim|deterministic
    independent_instances: 1
    note: >-
      One deterministic manifest covers the four projections. No run
      id is minted in this session. The replication plan does not name
      a future run slot, because the trial plan is not frozen while
      status is review_required. The two summation orders are the
      replication of b.

  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One later manifest would cover all four projections. Wall-clock
      and CPU figures are not set. The 1 GB figure is machine
      protection for the point list. A watchdog expiry is
      failed_infrastructure, not a value of b.

  stopping_rules:
    - Stop after a reading row is named.
    - Do not change the curve and do not replace the threshold 4 after seeing b.
    - Do not let the maximum fanout choose the row.
    - A timeout voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - A zero discriminant, an x-coordinate pair other than L = 1 and b = 2, an identity pair other than L = 0 and b = 1, a random label that misses a bin or has b < 6, a norm value outside F_7, or a loop disagreement voids the run.
    - Using the maximum fanout to choose the reading row voids the run.
    - Scoring any curve other than the frozen curve voids the run.

  success_criterion: >-
    The instrument checks pass, L(norm) >= 2, and b(norm) <= 4. This
    is the prediction of IDEA-20261006-aa03f9. It is reachable as a
    failure when the instrument checks pass, L(norm) >= 2, and
    b(norm) > 4.

  falsification_criterion: >-
    The instrument checks pass, L(norm) >= 2, and b(norm) > 4. That
    is the concrete negative. A reading with L(norm) < 2 is a second
    negative, not_lossy, and is not this sentence. A calibration
    failure and a timeout are not this negative.

  decision_impact:
    on_positive: >-
      A later evidence review may record that this one curve has
      b(norm) <= 4 and L(norm) >= 2. The generic exponent stays 1/2.
      No knowledge entry is promoted from this design record, and no
      discrete logarithm is claimed.
    on_negative: >-
      A later evidence review may record that this one curve has
      b(norm) > 4 with L(norm) >= 2, so explanation 1 holds on this
      curve and the bounded-branching claim is falsified here only.
      The generic exponent stays 1/2. The two outcomes name different
      inequalities and different readings.

  required_artifacts:
    - experiments/EXP-FROB-884337/runs/RUN-*/manifest.yaml
    - experiments/EXP-FROB-884337/runs/RUN-*/raw-result.json
    - experiments/EXP-FROB-884337/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        the discriminant is 0, the x-coordinate is not exactly L = 1
        and b = 2, the identity is not exactly L = 0 and b = 1, the
        random label misses a bin or has b < 6, a norm leaves F_7, or
        the two summation orders disagree
    - id: not_lossy
      when: the instrument checks pass and L(norm) < 2
    - id: explanation_1
      when: the instrument checks pass, L(norm) >= 2, and b(norm) > 4
    - id: bounded_branching
      when: the instrument checks pass, L(norm) >= 2, and b(norm) <= 4
  reading_rule: >-
    Name exactly one row. bounded_branching is the only success row.
    explanation_1 is the concrete negative. not_lossy is the other
    negative. instrument_failure is not a value of b. Record both
    rationals, the x pair, the random b, the identity pair, the image
    size, the affine count, the maximum fanout, and attack_claimed
    false beside the row. Those fields do not change the row.
