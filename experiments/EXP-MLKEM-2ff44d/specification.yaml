experiment:
  id: EXP-MLKEM-2ff44d
  hypothesis_id: H-MLKEM-142bab
  derived_from_idea: IDEA-20260821-121612
  question_id: RQ-MLKEM-002
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Determinacy of an unroll-normalized, memory-operand-based stride extractor over 40 toolchain
    cells on two pinned x86-buildable comparison routines, calibrated at both ends by a hand-written
    .S floor and an archived known-incomplete anchor, with all five calibrators scored and committed
    before any candidate is disassembled
  objective: >-
    The single uncertainty a run reduces is whether the integer this lane's obstruction argument
    consumes - the vector stride of a comparison routine - is well defined on a compiled artifact at
    all. A run establishes (i) DETERMINACY, the fraction of the 80 candidate cells in which the
    frozen extractor returns a single well-defined (w_source, u, phi) triple rather than AMBIGUOUS
    or UNMEASURABLE, with every ambiguous cell listed with its reason and its disassembly; (ii) the
    w_source spread per routine scored cell by cell against the stride its source reading assigns;
    (iii) the coverage deficit where the trip count is statically computable, printed beside its
    value on a known-complete null object and on a known-incomplete anchor; and (iv) a two-bit
    per-project census of whether each project's OWN default flags yield a w_source not dividing 32
    and whether a hand-written remainder path exists in its source. No crypto is executed, no
    comparison is ever run, and no conformance claim about any named library is made or would follow.
  what_this_is_not:
  - >-
    NOT an attack, an oracle, an exploitation path, an attack-cost estimate, or any timing, power,
    EM, cache or fault measurement. RQ-MLKEM-002 forbids those outright and this contract executes
    none of them; every measured quantity is static - counts of bytes in memory operands, counts of
    lanes read, and sets of byte offsets.
  - >-
    NOT a statement about MLWE hardness or ML-KEM security at any parameter set.
  - >-
    NOT a claim that any named library is defective. A stride that fails to divide 32 makes a defect
    class REACHABLE; it does not make a defect present, and conflating the two is forbidden.
  - >-
    NOT a contradiction of any prior source-level immunity prediction. A compiler-generated epilogue
    is not a member of the hand-written-remainder defect class.
  - >-
    NOT a residue-count deliverable. The residue is reported only alongside its value on the
    known-complete null object, never alone.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: laboratory
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - for the two pinned routines at the executed compilers, versions,
      optimisation levels, -march targets and host architecture, at the translation-unit level, the
      frozen extractor returns a well-defined tuple in a stated fraction of cells, w_source takes a
      stated set of values per routine, and the coverage deficit takes stated values with its
      calibrator values beside it. WHAT DOES NOT FOLLOW - nothing about aarch64, about a compiler
      version not tested, about a distribution's patched toolchain, about the linked library after
      LTO or call-site specialisation, about the two routines that could not be pinned, or about any
      implementation's correctness. Any newly observed conformance defect escalates to the
      Coordinator under RQ-MLKEM-002 and is published by no agent.
  inputs:
    procedure: >-
      STAGE 0 (zero compute) - fix the population from the primary record. Read
      experiments/EXP-MLKEM-009/analysis/second_implementation_selection.md and record what it
      contains. The pinned, distinct, x86-buildable population is TWO routines; two further entries
      carry no commit and are recorded UNMEASURABLE-UNTIL-PINNED and never as w equals anything; the
      aarch64 routine is DROPPED and recorded as a separate, not-run matrix requiring its own cross
      toolchain. STAGE 1 (minutes) - FREEZE THE EXTRACTOR BEFORE ANY CANDIDATE IS COMPILED, and
      hash-commit the script. Its rule: enumerate MEMORY OPERANDS, not load instructions, including
      operands folded into ALU instructions; group by base pointer, requiring exactly two read-only
      input bases and flagging any other count AMBIGUOUS; derive the unroll factor u as the number
      of distinct operand displacements per input base per back-edge traversal, requiring uniform
      spacing and flagging non-uniform spacing AMBIGUOUS; report BOTH w_source, the operand width,
      and w_backedge equal to u times w_source; compute the coverage set of input byte offsets
      provably read where the trip count is statically computable and report UNMEASURABLE where it
      is not; and report phi, the fraction of accumulator lanes read between the last accumulate and
      the verdict branch. STAGE 2 (minutes) - CALIBRATE AT BOTH ENDS AND PUBLISH THE CALIBRATION
      DISASSEMBLY. Compile all five calibration objects over the identical 40 cells, score every
      forced value, and COMMIT the scorecards WITH FULL DISASSEMBLY before any candidate is read. IF
      ANY FORCED VALUE FAILS, STOP AND REPORT INSTRUMENT FAILURE - no candidate number is
      admissible. STAGE 3 (tens of minutes) - compile the two candidates' comparison translation
      units over the same 40 cells and extract the tuple per cell. STAGE 4 (minutes) - report
      determinacy, w_source spread against the source reading cell by cell, coverage deficits beside
      their calibrator values, the residue beside the known-complete null object's residue, and the
      per-project default-flag column read from each build system.
    instrument: >-
      A frozen extractor script over objdump output, hash-committed before Stage 3. Compilers gcc
      and clang with exact versions recorded. No crypto library is built, no key material exists, no
      ciphertext exists, no generator runs, and no comparison ever executes. Recorded through
      harness/runner.py, with the exact command line of every cell, the compiler versions and the
      host CPU in the manifest.
    parameters: >-
      Two candidate routines x 40 cells, plus five calibration objects x 40 cells = 280 compiles of
      small translation units and 280 objdump passes. Cells are gcc and clang x {-O0, -O1, -O2, -O3,
      -Os} x {x86-64, x86-64-v2, x86-64-v3, x86-64-v4}. Lengths 768, 1088 and 1568 where a length is
      needed. Source-level stride assignments scored against - BoringSSL CRYPTO_memcmp, one byte per
      source iteration; PQClean avx2 verify, 32 bytes per source iteration with a hand-written
      scalar remainder loop.
  controls:
  - >-
    NULL-1, THE MUST-VARY OBJECT. A portable byte loop with a runtime length. FORCED - max w_source
    divided by min w_source at least 2.0 across the 40 cells, because -O0 emits a scalar byte
    operand per iteration by construction. If the extractor reports the same w_source in every cell
    for this source, it is not reading the loop body and NO candidate measurement may be reported.
  - >-
    NULL-2, THE C-LEVEL MUST-NOT-VARY OBJECT, RESTATED AT THE ONLY LEVEL WHERE IT HOLDS. A
    hand-written 32-byte AVX2 intrinsics body with an explicit stride and a full-register reduction.
    FORCED - w_source equals 32 and phi equals 1 in every AVX2-capable cell. NOT FORCED AND
    EXPLICITLY UNCONSTRAINED - u and w_backedge, which the compiler may set to anything. Their
    variation is DATA about unrolling, not instrument failure, and that distinction is the whole
    repair.
  - >-
    NULL-2b, THE TRUE MUST-NOT-VARY FLOOR, WHICH CANNOT BE WRITTEN IN C. A hand-written x86-64
    assembly comparison, assembled not compiled, with a literal 32-byte stride and a literal bound.
    FORCED - w_source 32, u 1, w_backedge 32, phi 1 and coverage_deficit 0 in ALL 40 cells, because
    no optimisation level may rewrite an assembled body. Any variation whatsoever indicts the
    extractor. No C-level object can serve as a must-not-vary calibrator, because every C-level
    stride is subject to unrolling and vectorisation.
  - >-
    NULL-3, THE COMPLETENESS-BY-CONSTRUCTION NULL OBJECT. Run the COMPLETE frozen pipeline -
    extractor plus residue arithmetic - on the auto-vectorised NULL-1 byte loop, whose epilogue the
    compiler emits under a semantics-preservation obligation. FORCED - coverage_deficit 0 in every
    cell where the trip count is computable. ALSO REPORTED AND PREDICTED NONZERO - L mod w_backedge
    for this known-complete object. Printing that number next to every candidate residue is what
    prevents the artifact reading.
  - >-
    NULL-4, THE KNOWN-NONZERO ANCHOR. The archived pre-fix AVX2 comparison routine whose silent set
    EV-MLKEM-005 records. FORCED - coverage_deficit 32 at L equal 1568 and 0 at L equal 1088 and
    768. Without it, deficit 0 everywhere is indistinguishable from an extractor that always returns
    0. CONDITIONALITY STATED IN ADVANCE - if the routine cannot be isolated as a compilable
    translation unit at the pinned tag, the anchor is reported UNAVAILABLE and the coverage
    deliverable is downgraded to calibrated-at-the-zero-end-only, which is a stated weakening and
    not a silent one.
  - >-
    ORDERING CONTROL. All five calibrator verdicts, with disassembly, are emitted and committed
    BEFORE any candidate disassembly is read. A matrix read before the nulls are scored is
    inadmissible.
  - >-
    NEARBY-OBJECT CONTROL WHERE THE METHOD MUST FAIL. A comparison whose length is a runtime
    parameter NOT constant-folded in the translation unit. The method MUST report coverage
    UNMEASURABLE there, not deficit 0. A pipeline that reports 0 for it is reporting absence of
    evidence as evidence of completeness.
  - >-
    ARCHIVE CHECK (zero compute). Enumerate every prior record that assigns a stride to either
    routine and record the value assigned, so the matrix is scored against the prior assignment cell
    by cell rather than in aggregate.
  - >-
    TOOLCHAIN PROVENANCE. Exact compiler versions, host CPU and the full command line of every cell
    recorded in the manifest. A matrix without them is unreproducible and is not a measurement.
  independent_variables:
  - 'routine: BoringSSL CRYPTO_memcmp versus PQClean ml-kem-1024/avx2 verify, each at its pinned commit'
  - 'compiler: gcc versus clang, exact versions recorded'
  - 'optimisation level: -O0, -O1, -O2, -O3, -Os'
  - '-march target: x86-64, x86-64-v2, x86-64-v3, x86-64-v4'
  - 'object class: candidate versus each of the five calibrators'
  - 'length L: 768, 1088, 1568, where a length is needed'
  metrics:
    primary:
    - >-
      determinacy - dimensionless fraction over the 80 candidate cells, computed as the number of
      cells in which the frozen extractor returns a single well-defined (w_source, u, phi) triple
      divided by the number of cells that built, with the list of ambiguous and unmeasurable cells
      and the reason for each.
    - >-
      w_source_spread per routine - integer, the number of distinct w_source values observed across
      that routine's 40 cells, reported together with a per-cell boolean of whether w_source equals
      the stride the source reading assigns that routine.
    - >-
      coverage_deficit per (routine, cell, L) - integer bytes, L minus the size of the set of input
      byte offsets provably read, reported ONLY in cells where the trip count is statically
      computable and UNMEASURABLE otherwise, and always printed beside NULL-3's and NULL-4's values.
    - >-
      calibrator_scorecard - five booleans plus their measured tuples, emitted and committed before
      any candidate cell is read. A single failure voids the matrix.
    secondary:
    - >-
      null_object_residue - integer, L mod w_backedge computed by the complete frozen pipeline on
      NULL-3, printed adjacent to every candidate residue.
    - >-
      NULL-1 w_source ratio - dimensionless, max over min across the 40 cells, forced at least 2.0.
    - >-
      default_flag_column - two bits per project, whether its own default build flags yield a
      w_source not dividing 32, and whether a hand-written remainder path exists in its source,
      quoted from the build system and the source.
    - >-
      phi per (routine, cell) - dimensionless fraction of accumulator lanes read between the last
      accumulate and the verdict branch.
    - >-
      build_failure_list and unmeasurable_list - exact counts with reasons, never folded into a rate.
    - >-
      the frozen extractor script and its hash, and the per-cell disassembly excerpt each value was read from.
  heuristic_under_test: HEUR-MLKEM-DECODE-1
  preregistered_prediction:
    quantity: >-
      determinacy over the 80 candidate cells, and the per-cell agreement of w_source with the
      source reading.
    formula: >-
      Predicted determinacy strictly below 1.0, i.e. at least one AMBIGUOUS or UNMEASURABLE cell
      across the 80, OR at least one cell where w_source disagrees with the source reading.
      Predicted w_source_spread at least 2 for at least one routine, with the honest discount that
      for the BoringSSL byte loop this is close to forced and therefore a supporting observable
      only. Under the clean negative, determinacy is exactly 1.0 and w_source equals the source
      reading in all 80 cells, which CONFIRMS the source-level shortcut on this population by a
      stronger instrument.
    source: >-
      Pre-registered in the parent proposal IDEA-20260821-121612, whose predictions block states
      determinacy as the headline deliverable with 'exactly 1.0 is the clean negative' and states
      the w_source_spread discount verbatim. Fixed before any run under this contract exists and
      never tuned to data.
  scale_relevance:
    tier: laboratory
    justification: >-
      There is no scale extrapolation of any kind - the measurement is made directly on the compiled
      artifacts at the standardized ML-KEM lengths 768, 1088 and 1568, which are the deployed
      lengths. The boundaries that do exist are not scale boundaries but CONFIGURATION boundaries -
      the exact compilers, versions, flag sets, host architecture and pinned commits, and the
      translation-unit level rather than the linked library after LTO or call-site specialisation.
      Each is stated in the claim ceiling and none is extrapolated across.
    correspondence: null
  tail_checks:
  - >-
    Report the residue L mod w_backedge for every candidate cell ADJACENT to NULL-3's residue in the
    same table row, so a reader cannot read a candidate residue as a defect signal.
  - >-
    Report every cell where u times w_source disagrees with the induction-variable increment visible
    in the disassembly, flagged AMBIGUOUS rather than reported as a value.
  - >-
    Report every symbol with multiple bodies from ifunc or target_clones as its own category, listing
    all tuples rather than picking the first, and counting the cell as non-determinate.
  - >-
    Report the interior rungs -O1 and -Os as interior rungs and state the OBSERVED ordering rather
    than asserting monotonicity in optimisation level; monotonicity is not assumed.
  - >-
    Report the exact list of cells that failed to build, with the compiler diagnostic, so a build
    failure never enters a determinacy denominator as an ambiguous cell.
  replication:
    seeds:
    - not_applicable_deterministic
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 2.0
    maximum_memory_gb: 8
    maximum_runs: 12
  stopping_rules:
  - >-
    STOP AND REPORT INSTRUMENT FAILURE if any of the five calibrators' forced values fails. No
    candidate number is admissible and the record is repaired before anything else is read.
  - >-
    Stop before Stage 3 if the calibrator scorecards and their full disassembly have not been
    emitted and committed. The ordering control is not optional.
  - >-
    Stop at the declared 40-cell matrix; the extractor rule, the ambiguity criteria and the source
    reading assignments are frozen before Stage 2 and are not revised after seeing a disassembly.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A fetch failure, build failure, timeout, crash or dependency failure makes the affected cells
    failed_infrastructure and is NEVER negative evidence about any implementation (AGENTS.md rule 3).
    The matrix is reported over the cells that built, with every failure listed.
  - >-
    A run in which any candidate cell was read before all five calibrator scorecards were committed
    is completed_invalid. The ordering is the control.
  - >-
    A run that reports a coverage deficit of 0 for a cell whose trip count is not statically
    computable is completed_invalid - it reports absence of evidence as evidence of completeness.
  - >-
    A run that reports a candidate residue without NULL-3's residue beside it is invalid_measurement.
  - >-
    A run that assigns w equals anything to the two unpinned entries, or that compiles the aarch64
    routine under x86 -march flags, is completed_invalid - both are out of population by the frozen
    contract.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a
    new contract; it is never a repair of this one.
  success_criterion: >-
    All five calibrators pass their forced values and their scorecards with full disassembly are
    committed before any candidate is read; the two pinned routines build in a majority of the 40
    cells each; and the run reports determinacy over the cells that built, the ambiguous and
    unmeasurable cell lists with reasons and disassembly, the per-cell w_source scored against the
    source reading, coverage deficits printed beside NULL-3 and NULL-4 values, the residue printed
    beside NULL-3's residue, and the two-bit per-project default-flag column. H-MLKEM-142bab is
    SUPPORTED if determinacy is strictly below 1.0 or w_source disagrees with the source reading in
    at least one cell; it is REFUTED, reportably and usefully, if determinacy is exactly 1.0 with
    w_source matching everywhere.
  falsification_criterion:
  - >-
    determinacy equals 1.0 and w_source matches the source reading in all 80 cells. The claim is
    FALSE as stated, the source-level reading is well defined and stable on this population, and the
    result is recorded as a confirmation of the prior record's methodology obtained by a stronger
    instrument. This is a fully reportable deliverable and the primary negative outcome.
  - >-
    NULL-1 fails to vary. Instrument failure; the matrix is void and NO conclusion, positive or
    negative, may be drawn about any routine.
  - >-
    NULL-2's w_source varies over AVX2-capable cells, or NULL-2b's tuple varies at all. Extractor
    mis-attribution of memory operands; same consequence. NOT a falsifier - variation in NULL-2's u
    or w_backedge, which is the phenomenon under study.
  - >-
    NULL-3 shows a nonzero coverage deficit on a compiler-generated body. The coverage extractor is
    wrong and no coverage number is reportable.
  - >-
    NULL-4 is unavailable or shows a deficit other than 32 / 0 / 0. Either the coverage deliverable
    is downgraded and labelled calibrated-at-one-end, or the extractor cannot see a known
    incompleteness and no coverage zero means anything.
  - >-
    The comparison function cannot be located in a majority of cells. The measurement is not
    executable as designed; the design is withdrawn and restated, not patched after seeing partial
    results.
  required_artifacts:
  - manifest.yaml with the exact command line of every cell, compiler names and versions, host CPU, commit sha, dirty-tree state, resolved model/inference block and environment
  - raw-result.json carrying the per-(object, cell) tuple with the disassembly excerpt each value was read from, not summaries
  - the five calibrator scorecards with FULL disassembly, emitted and committed before the candidate table
  - the frozen extractor script and its hash, committed before Stage 3
  - the determinacy figure with the ambiguous and unmeasurable cell lists and a reason per cell
  - NULL-3's coverage deficit and its residue, printed adjacent to every candidate residue
  - the per-project default-flag column and the presence or absence of a hand-written remainder path, quoted from source
  - the list of cells that failed to build, with the compiler diagnostic
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval and the user's authorization are required before execution. This contract
    is review_required and is NOT approved; approved_by is null and execution_authorized is false
    (AGENTS.md rule 1).
  - >-
    The proof_search_map on H-MLKEM-142bab must be audited before implementation, per KN-TECH-080
    and the Coordinator's proof-oriented dispatch gate.
  - >-
    RQ-MLKEM-002's escalation clause must be restated in the task card - any newly observed
    conformance defect escalates to the Coordinator immediately and is published by no agent.
  - >-
    The extractor script must be frozen and hash-committed, and the calibrator scorecards emitted,
    before any candidate translation unit is disassembled. Approval that does not enforce that
    ordering approves a different experiment.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260821-121612
    authored_at: '2026-08-25'
    note: >-
      The population, the extractor rule, the five calibrators with their forced values, the
      predictions and the falsification conditions are taken from the parent proposal's mechanism,
      null_object_control, predictions and falsification_conditions blocks, which are unusually
      complete because the record is a repaired revision filed after a red-team screen found four
      blocking defects in its predecessor. The compile observations attributed to that screen are
      cited in the parent as attributed review observations that the run must reproduce under its
      own frozen harness; NO forced value in this contract rests on them alone, and this contract
      reproduces none of them as measurements. Boilerplate identical across contracts by program
      rule comes from the fixed table.
  derivation_gaps:
  - >-
    The exact compiler versions are not pinned here. Two versions of the same compiler are different
    cells, and the result is scoped to whatever is recorded; the versions must be fixed in the
    manifest before approval so the matrix is reproducible.
  - >-
    NULL-4's availability is genuinely uncertain. If the archived routine cannot be isolated as a
    compilable translation unit at its pinned tag, the coverage deliverable is calibrated at one end
    only and the run must say so in the headline rather than in a footnote.
  - >-
    The definition of 'innermost back-edge' is frozen but is a taste call for software-pipelined or
    rotated loops. It is frozen before the run precisely so the ambiguity cannot be resolved in
    whichever direction makes the result interesting; an ambiguous cell counts against determinacy
    rather than being resolved.
  - >-
    Whether the two currently unpinned routines can be pinned is a prerequisite task for whoever
    owns the lane. It is NOT an assumption of this contract and those cells are reported
    unmeasurable-until-pinned.
  - >-
    The matrix measures the translation unit. Extending it to the linked artifact after LTO and
    call-site specialisation is a declared limitation, not an oversight, and would be a separate
    contract.
