experiment:
  id: EXP-ARGON-41fd17
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-839444; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-839444
  question_id: RQ-ARGON-141710
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Depth-reducing-set ratio of one fixed Argon2 lane-graph numerator against four declared null
    families, with within-family spreads, a self-comparison forced case, and a t-direction consistency
    check
  objective: The one uncertainty a run reduces is how much of this lane's central number is determined
    by Argon2 and how much by the analyst's choice of comparison object -- a confound EV-ARGON-209ece
    records as raised independently by the red team and explicitly unresolved. (i) The magnitude question
    is answered by computing one byte-identical numerator against four structurally distinct denominators
    and reporting the interval spanned by the resulting rho values, compared against the within-family
    spread over twenty draws so that the interval is separated from noise rather than asserted over
    it. (ii) The attribution question -- which structural coordinate drives which part of the interval
    -- is answered by the design of the four nulls, each of which preserves a named coordinate and
    destroys exactly one other, so the finite-difference profile across them is interpretable rather
    than a scatter of numbers. (iii) The coherence question -- whether the four are even measuring
    the same underlying quantity -- is answered by the pre-committed requirement that all four rho
    values move in the same direction as t increases; divergent directions would show that this lane
    has been calling four different quantities by one name, which changes what every existing contract
    here means. The run tests no hypothesis about Argon2 and produces no security statement.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: for the fixed p=1 numerator
      graphs at the declared cells, computed with the lane''s existing greedy heuristic at the declared
      threshold, the ratio rho takes the reported values against each of the four declared null families
      with the reported within-family spreads, the four point estimates span the reported interval,
      and the four move in the reported directions as t increases. WHAT DOES NOT FOLLOW: no null is
      thereby shown correct or incorrect; nothing follows about which comparison any external analysis
      makes, and the record must not assert one; a wide interval does not refute H-ARGON-ef2f0b but
      shows its statement is incomplete without a named denominator; every number remains a heuristic
      upper bound rather than an exact minimum; and nothing at all follows about Argon2''s security,
      any parameter set, or any adversary.'
  inputs:
    procedure: 'STAGE 0 (cost: hours of human time): declare all four null constructions, the greedy
      threshold, the draw count and the t-direction consistency requirement in a pre-registration
      file, before any numerator is computed, so that no null can be chosen after seeing a number.
      STAGE 1 (cost: low): build the real per-lane graphs at the declared cells and compute each numerator
      once. STAGE 2 (cost: low): implement the four null generators sharing one code path parameterized
      by target-selection rule, with the degree-preserving rewiring sampler and its mixing check taken
      from the companion live-set contract. STAGE 3 (cost: negligible): run the two forced cases --
      self-comparison, which must return exactly 1.000, and chain-only numerator against its closed
      form -- and halt on any failure. STAGE 4 (cost: the compute bound): compute removal-set sizes
      for twenty draws of each null family at every cell with the identical greedy function. STAGE
      5 (cost: negligible): report rho per denominator with spreads, the four-point interval, and
      each null''s back-distance and in-degree profiles. STAGE 6 (cost: hours of human time): write
      the per-null interpretation stating which structural question each denominator answers, and
      record explicitly that the run cannot adjudicate among them. No attack, no credential data.'
    instrument: Python 3 with numpy for graph construction and null generation, sharing one target-selection-parameterized
      code path across all four families; the lane's existing greedy depth-reducing-set implementation
      imported unchanged with its existing tie-breaking rule, so the interval applies to the instrument
      actually in use rather than to a reimplementation; the degree-preserving rewiring sampler and
      mixing check shared with the companion live-set contract in this batch, which lets the two records
      cross-validate it; harness/runner.py for seeding, parameter capture and run manifests. Exact
      integer arithmetic for all removal-set sizes, floating point only in the reported ratios. No
      Sage, no computer-algebra system, no external Argon2 library.
    parameters: 'p=1. Variants Argon2i and Argon2id. t in {1, 3, 6}, where 1 and 3 match the RFC 9106
      recommended pass counts and 6 exists to test the t-direction consistency requirement. q in {1024,
      4096}. Depth threshold fixed at 50 percent of native depth t*q-1, matching H-ARGON-ef2f0b''s
      own definition so the interval applies directly to its prediction. Four null families: window-matched
      uniform, full-history uniform, matched-mean geometric, degree-preserving rewiring. Twenty independent
      draws per family per cell, declared seeds. Forced cases: self-comparison and chain-only numerator.
      Ten synthetic input draws for the data-dependent portion of Argon2id. No password, credential,
      leaked corpus or third-party dataset at any stage.'
  controls:
  - Self-comparison forced case returning rho exactly 1.000 through every null-family code path.
  - Chain-only numerator with a closed-form removal-set size, isolating denominator variation from
    numerator noise.
  - Twenty independent draws per null family, so the between-null interval is compared against the
    within-null spread rather than against nothing.
  - Each null's back-distance distribution and in-degree histogram reported alongside its rho, making
    the preserved and destroyed coordinates visible.
  - The t-direction consistency check, run as a diagnostic on the measurement rather than as a result
    about Argon2.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): This record''s subject is nulls, so its own control must be a case
    where the answer is forced. Two are used, both run through the identical code path in the same
    invocation. FORCED CASE ONE: the numerator graph compared against ITSELF as denominator, which
    must return rho exactly 1.000 for every null-family code path; any deviation is a bug in the comparison
    harness and halts the run. FORCED CASE TWO: a chain-only graph as numerator against each of the
    four nulls, where the numerator''s removal-set size is known in closed form, so that any variation
    across nulls is attributable entirely to the denominators rather than to numerator noise. For
    the four-null interval to mean anything, case one must return 1.000 exactly and case two must
    reproduce its closed form. If the interval measured in the main arm is no wider than the spread
    within a single null family''s twenty draws, the correct record is a controlled null on this record''s
    own claim: the choice of null does not matter at these parameters, which would fully resolve the
    confound EV-ARGON-209ece leaves open and is the single most valuable outcome available here.'
  independent_variables:
  - null family, in {window-matched uniform, full-history uniform, matched-mean geometric, degree-preserving
    rewiring}
  - t, in {1, 3, 6}
  - q, in {1024, 4096}
  - variant, in {Argon2i, Argon2id}
  metrics:
    primary:
    - rho per null family per cell
    - within-family spread over twenty draws
    - interval width spanned by the four point estimates, in rho units
    - direction of each rho's movement across t
    secondary:
    - back-distance distribution of each null family
    - in-degree histogram of each null family
    - self-comparison forced-case value
    - chain-only closed-form agreement per family
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The width of the interval spanned by rho computed against four declared null families
      with one fixed numerator, relative to the within-family spread and to the 0.30 gap between H-ARGON-ef2f0b's
      confirm and falsify thresholds.
    formula: rho_k = |S*_real| / median over twenty draws of |S*_null_k|, for k in the four declared
      families, where S* is the greedy depth-reducing set bringing longest path to at most 50 percent
      of t*q-1. Interval width I = max_k rho_k - min_k rho_k. Predicted I >= 0.30; predicted rho_fullhistory
      <= rho_windowmatched - 0.20; predicted rho_rewiring >= rho_windowmatched + 0.20.
    source: Pre-registered in the parent proposal IDEA-20260816-839444 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested at p=1 and q in {1024, 4096}, two to four binary orders below the second
      RFC 9106 recommended tuple's per-lane block count. The quantity of interest is a DIFFERENCE
      between denominators rather than an absolute robustness value, and differences between null
      constructions are expected to widen with q, since the window becomes a smaller fraction of the
      array and the window-matched and full-history nulls diverge. The reported interval is therefore
      expected to be a conservative underestimate at recommended q -- a direction stated explicitly,
      and not relied on by any reported number. No extrapolation to recommended parameters is performed.
    correspondence: null
  tail_checks:
  - Inspect the extreme draws within each null family, not just the median, since a heavy-tailed within-family
    distribution would invalidate the interval-versus-spread comparison.
  - Inspect the cells at q=1024 separately, where the window is a large fraction of the array and
    two of the four nulls nearly coincide by construction.
  - Inspect the t=6 cells specifically for the direction check, since that cell exists only for that
    purpose and has no other role.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt if the self-comparison forced case returns anything other than exactly 1.000.
  - Stop and report partial results if wall clock exceeds three hours, recording which cells completed;
    incompleteness is a budget outcome and is never reported as a narrow interval.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The forced cases pass, all four null families complete twenty draws at every
    cell, and the four rho values, their within-family spreads, the interval width, and the per-null
    structural profiles are reported together with the t-direction check -- irrespective of whether
    the interval turns out wide or narrow.
  falsification_criterion:
  - Interval width smaller than the within-family spread, refuting this record's central claim and
    resolving EV-ARGON-209ece's confound reassuringly.
  - Self-comparison forced case returns other than 1.000.
  - Chain-only numerator fails its closed form under any family.
  - Full-history null yields a higher rho than the window-matched null, contradicting the predicted
    direction.
  - The four rho values move in different directions with t, forbidding the report of a single interval.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-839444
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The matched-mean null's shape is fixed to geometric by fiat; a Coordinator should either justify
    that choice or add a second shape at the same mean, since the interval is only over declared families
    and an arbitrary member weakens it.
  - Whether the greedy heuristic's family-dependent approximation error can be bounded without the
    companion exact-DP result is unresolved, and it is the one confounder this design cannot control
    on its own.
  - Twenty draws per family is a judgement, not a power calculation; the Coordinator should derive
    it from a pilot or record it as arbitrary.
  - The record deliberately cannot say which null is correct; whether the goal should open a KN-OPEN
    entry for that question rather than leaving it inside an evidence record's confounds block is
    a Coordinator decision.
