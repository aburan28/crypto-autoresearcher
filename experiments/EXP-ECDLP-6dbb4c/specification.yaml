  ordering_gates:
  - id: G0-SOURCE
    admits: CTRL-SOURCE-BINDING only
    completion: exact proposal and frozen future contract bytes hash-bound
  - id: G1-STATIC-GRAMMAR
    depends_on: G0-SOURCE
    admits: family/code collision and complete layout checks only
    completion: zero collisions, gaps, overlaps, and reserved-byte defects
  - id: G2-COMPACT-FIXTURES
    depends_on: G1-STATIC-GRAMMAR
    admits: the 20 literal compact serializer fixtures only
    completion: 20/20 byte round trips and frozen digest matches
  - id: G3-INDEPENDENT-SHA
    depends_on: G2-COMPACT-FIXTURES
    admits: independent padding and block reconciliation only
    completion: zero per-message or aggregate residuals
  - id: G4-CERTIFICATE-MAP
    depends_on: G3-INDEPENDENT-SHA
    admits: static nine-row source/slot map only
    completion: 9/9 bijection and negative alias rejection without certificate output
  - id: G5-ARCHIVE
    depends_on: G4-CERTIFICATE-MAP
    admits: 84 zero fixtures, allocation-25 nonzero round trip, and two mutations
    completion: every archive control has its exact expected outcome
  - id: G6-COMMITMENT
    depends_on: G5-ARCHIVE
    admits: result packaging and hash commitment only
    completion: immutable presemantic commitment over all required artifacts
  - id: G7-SEMANTIC-BARRIER
    depends_on: G6-COMMITMENT
    admits: nothing_under_this_contract
    completion: No semantic work is part of this design. A later task remains barred until independent validation plus separate approval, freeze, archive, implementation review, execution authorization, and user authorization.
