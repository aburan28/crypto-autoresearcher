    note: These are prospective hard caps for a future separately authorized mechanical conformance package. They are not measured costs and do not authorize this design or any implementation.
  stopping_rules:
  - Stop before reading fixture outcomes if this specification is not separately reviewed and snapshot-bound.
  - Stop at the first failed ordering gate; record the precise defect and do not admit successors.
  - Stop before hashing if a source binding, family/code, layout, length, or reserved-zero gate fails.
  - Stop before archive fixtures if any compact fixture, SHA arithmetic, or 9/9 certificate-map gate fails.
  - Stop on any forbidden scientific-path event, actual certificate-digest attempt, or network request.
  - Stop on wall, CPU, memory, retained-artifact, logical-byte, or run-package cap exhaustion.
  - Never replace, drop, regenerate, normalize away, or weaken a failed case; a repair requires a versioned successor.
  invalidation_rules:
  - Any execution while frozen is false, execution_authorized is false, evidence_eligible is false, or approved_by is null.
  - Any implementation or output produced under TASK-20260809-1c7ba1; this task is design-only.
  - Any curve generation, curve-equation computation, selector, sampler, interval solve, certificate-output generation, join, witness, or treatment path.
  - Any actual future interval-certificate digest value replacing the pending sentinel.
  - Any source hash mismatch, offset gap/overlap, alternate encoding, nonzero reserved byte, trailing byte, or native-endian field.
  - Any missing or duplicate family, subtype, fixture, certificate row, archive allocation, pass, output slot, or required artifact.
  - Any fixture digest, byte count, block count, slot, traffic, CPU-weight, wall-weight, or archive-mapping residual.
  - Any archive digest depending on its own non-neutralized output slot or any nonzero dependency cycle.
  - Any late or incomplete ordering commitment, or any later semantic work reading uncommitted outputs.
  - Any comparison to a prior experiment output or any scientific inference from a conformance outcome.
  infrastructure_failure_disposition:
    terminal_status: failed_infrastructure
    applies_to:
    - timeout
    - crash
    - missing dependency
    - unsupported SHA implementation
    - filesystem or storage failure
    - resource exhaustion
    - environment mismatch
    interpretation: Infrastructure failure is not a failed serializer control, not evidence against the proposal, and never ECDLP evidence. Preserve partial logs and coverage, mark every unexecuted control not_performed, and do not infer a negative result.
  success_criterion: 'This unfrozen design has no current success outcome and authorizes no run. If a later separately approved, frozen, archived, implemented, and authorized package executes, its only positive disposition is serializer_conformance_pass: every primary metric equals its fixed expected value, every negative control fails in the required direction, all required artifacts are committed before any successor reads them, and no forbidden path is entered. That disposition is apparatus conformance only and is not scientific evidence.'
  falsification_criterion: The proposed byte-reproducibility repair fails at serializer scope if any valid future conformance package has a source mismatch, layout gap/overlap, reserved-zero acceptance, nonidentity round trip, digest or block mismatch, certificate map other than 9/9, archive map other than 42-by-2, nonzero dependency cycle, failed nonzero allocation-25 round trip, included-byte digest collision, excluded-byte digest change, or incomplete ordering commitment. This falsifies only the tested serialization/interface repair; it is not evidence about signed-y structure or ECDLP.
  proof_search_map_relevance:
    applicability: bounded_serializer_interface_audits_only
    proof_or_asymptotic_proposal_dispatched: false
    baseline_reproduction: Reproduce exactly the proposal-bound 20 compact fixtures, 84 all-zero archive-pass fixtures, 9/9 source-slot schedule, ICC2 literal mapping, and allocation-25 finite construction.
    observation_collision: Scan family/code collisions and slot aliases; use the all-zero archive case to expose the direct-versus-neutral ambiguity and the nonzero allocation-25 fixture to distinguish it.
    quantifier_order: For every declared family/subtype fixture, every archive allocation code 1..42, both pass codes, and every certificate ordinal 0..8, the one canonical preimage and mapping are fixed before execution. No witness, curve, digest, or case choice may depend on a future observation.
    method_ceiling:
      strongest_certifiable_claim: exact finite serializer conformance under the tested implementation
      nearby_object_control: literal included and excluded allocation-25 byte perturbations
      cannot_certify:
      - SHA-256 collision resistance as a theorem
      - semantic correctness of interval certificates, curve logic, selectors, or treatment
      - scientific validity, novelty, advantage, scaling, or ECDLP impact
    constructive_transforms_used: []
    not_applicable_reason: No theorem, asymptotic bound, reduction, or closure is being dispatched. The proposal's proof-search-map discipline is retained only where it supplies cheap interface falsifiers and a method ceiling.
  comparator_restrictions:
