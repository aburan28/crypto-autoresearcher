  controls:
    execution_order:
    - CTRL-SOURCE-BINDING
    - CTRL-FAMILY-MAGIC-CODE-COLLISION
    - CTRL-OFFSET-COVERAGE-RESERVED-ZERO
    - CTRL-ENCODE-DECODE-ENCODE
    - CTRL-SHA256-INDEPENDENT-PADDING
    - CTRL-CERTIFICATE-9-OF-9-BIJECTION
    - CTRL-ARCHIVE-42-BY-2-ZERO-FIXTURES
    - CTRL-ALLOCATION-25-SELF-NEUTRAL
    - CTRL-NEARBY-OBJECT-PERTURBATION
    - CTRL-ORDERING-HASH-COMMITMENT
    - CTRL-FORBIDDEN-SCIENTIFIC-PATH
    definitions:
    - id: CTRL-SOURCE-BINDING
      can_fail: true
      test: Require the exact proposal path, SHA-256, idea id, experiment id, fixture counts, and all copied constants to agree before parsing a canonical message. A stale or mismatched binding halts the package.
    - id: CTRL-FAMILY-MAGIC-CODE-COLLISION
      can_fail: true
      test: Parse the registry and proposal tables independently; reject any duplicate eight-byte prefix, family code, schema code within its namespace, family/subtype pair, or selector arm code, and reject any prefix whose decoded magic differs from the literal ASCII value.
    - id: CTRL-OFFSET-COVERAGE-RESERVED-ZERO
      can_fail: true
      test: For every fixed-width header, record, and subrecord in the exact layout sources, sort half-open [offset,offset+width) intervals and require a gap-free, overlap-free partition of the declared width. Reconcile all derived widths and require every reserved byte zero. A negative fixture changing the first reserved byte to 01 MUST be rejected before hashing.
    - id: CTRL-ENCODE-DECODE-ENCODE
      can_fail: true
      test: For all 20 canonical messages, all 84 archive zero messages, and the two allocation-25 pass messages, decode each typed field, reject trailing bytes, re-encode canonically, and require exact byte identity before checking its digest.
    - id: CTRL-SHA256-INDEPENDENT-PADDING
      can_fail: true
      test: Path A obtains the serialized byte length from the emitted byte stream. Path B obtains the expected logical length by summing declared field widths and payload cardinalities without consulting Path A. Require both lengths equal and recompute blocks as floor((message_bytes+72)/64), an integer-arithmetic form independent of the proposal's ceil expression. Require agreement for every case, 7257 blocks over the 20 compact fixtures, every archive row's frozen blocks_per_pass, and 70396870 blocks across all 84 zero fixtures.
    - id: CTRL-CERTIFICATE-9-OF-9-BIJECTION
      can_fail: true
      test: Require the exact ordered 9/9 source-slot schedule, contiguous source and digest partitions, and unique ids/ordinals/slots. A negative map that aliases ordinal 8 to digest offset 2912 MUST be rejected. No certificate solver or actual certificate digest is permitted.
    - id: CTRL-ARCHIVE-42-BY-2-ZERO-FIXTURES
      can_fail: true
      test: Rebuild and hash all 42 allocation families under both pass headers; require 84/84 matches, 42 unique allocation codes, 42 unique write slots, 42 unique verification slots, and exact ordering.
    - id: CTRL-ALLOCATION-25-SELF-NEUTRAL
      can_fail: true
      test: Perform the declared nonzero initial and stored-digest round trip. Require both expected pass digests at both phases and a zero-cycle dependency graph. An all-zero allocation-25 payload is insufficient for this control and cannot substitute for it.
    - id: CTRL-NEARBY-OBJECT-PERTURBATION
      can_fail: true
      test: Run both literal allocation-25 mutations. The excluded mutation must preserve each pass digest and the included mutation must change each pass digest. Either wrong direction invalidates the package.
    - id: CTRL-ORDERING-HASH-COMMITMENT
      can_fail: true
      test: Commit, by SHA-256, the exact source bindings, implementation bytes, fixture table, case order, all conformance outputs, stdout, stderr, and invalidation log before any result may be read by a later semantic task. Missing or late commitment invalidates the package.
    - id: CTRL-FORBIDDEN-SCIENTIFIC-PATH
      can_fail: true
      test: The manifest must enumerate invoked modules and commands and assert zero curve generation, curve-equation evaluation, XOF generation, selector, sampler, join, witness, interval-solver, certificate-output, treatment, or semantic-analysis calls. Any such call immediately invalidates the package even if every digest matches.
  independent_variables:
