# EXP-SSIQ-0dd144
# Memory-axis count arithmetic. No holonomy is computed.
# Approved by DEC-20261003-02ea39.
experiment:
  id: EXP-SSIQ-0dd144
  hypothesis_id: H-SSIQ-ac76ea
  source_idea: IDEA-20260930-024033
  question_id: RQ-SSIQ-9702af
  version: 1
  title: Curve exponent versus the one-third exponent
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-02ea39
  objective: >-
    Check the cross 3, the reduction 1/12, and the cross 0.
  inputs:
    curve_cross: 3
    gap_num: 1
    gap_den: 12
    memory_cross: 0
    reopen_cross: 3
    torsion_product: 6
    torsion_sum: 5
  controls:
    - >-
      The cross of 5/12 against 1/3 is 3. Reporting the curve
      exponent as 1/3 drops that cross and invalidates the run.
    - >-
      Three over 36 is 1/12. The cross of 2/12 against 1/6 is 0.
      The cross of 1/6 against 1/9 is 3.
    - >-
      Two times 3 is 6. The orders 2 and 3 sum to 5.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {curve, memory, torsion}
    - route in {cross, reduce}
  metrics:
    primary:
      - curve_cross
      - gap_den
      - memory_cross
      - implementations_agree
    secondary:
      - reopen_cross
      - torsion_product
      - torsion_sum
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The cross of 5/12 against 1/3 is 3. Three over 36 is 1/12.
      The cross of 2/12 against 1/6 is 0.
    formula: >-
      Cross 5/12 with 1/3. Reduce 3 over 36. Cross 2/12 with 1/6.
      Cross 1/6 with 1/9. Multiply 2 by 3.
    source: >-
      IDEA-20260930-024033 states the exponents 1/3, 1/6, 5/12, and
      1/12, the reopen exponent 1/9, and the torsion orders 2 and 3,
      read 2026-10-03. The prime is not named as an integer. The
      products were recomputed in this design session. That
      computation is not a run. No holonomy was computed.
  scale_relevance:
    tier: toy
    justification: Five written exponents and two written torsion orders. No transfer to a memory measurement.
    correspondence: null
  tail_checks:
    - The reduction 1/12 and the cross 0 are required. A check that stops at the cross 3 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the cross 3 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The curve cross is not 3.
    - The reduction is not 1/12.
    - The memory cross is not 0.
    - The curve exponent is reported as 1/3, or a holonomy is computed.
  success_criterion: >-
    Both runs agree that the cross of 5/12 against 1/3 is 3, that 3
    over 36 is 1/12, that the cross of 2/12 against 1/6 is 0, and
    that 2 times 3 is 6.
  falsification_criterion: >-
    The runs agree that the cross of 5/12 against 1/3 is computed,
    and that cross is not 3.
  required_artifacts:
    - experiments/EXP-SSIQ-0dd144/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SSIQ-0dd144/runs/<RUN-ID>/command.txt
    - experiments/EXP-SSIQ-0dd144/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SSIQ-0dd144/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SSIQ-0dd144/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-SSIQ-0dd144/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any holonomy census, Cayley graph, or memory measurement.
    - Any claim that a memory lever is closed.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
