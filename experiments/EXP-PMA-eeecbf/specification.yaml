experiment:
  id: EXP-PMA-eeecbf
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-5c040d; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-5c040d
  question_id: RQ-PMA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Instrument the frozen square-class gate to emit separated divisor-parity and residual-constant-class
    certificates, and measure each component's firing rate and their overlap over F_q, over Q, and
    over a closure proxy
  objective: 'The one uncertainty a run reduces is which of two structurally different obstructions
    the frozen gate is actually detecting on the prescribed family, since RQ-PMA-001 names divisor
    parity while the gate as frozen is a conjunction of divisor parity and a residual constant class.
    Concretely: (i) it validates the certificate implementation in both directions, requiring zero
    misclassifications across at least 200 constructed squares and 200 constructed nonsquares per
    field and an exactly zero divisor accounting residual, so that every later number rests on a verified
    instrument; (ii) it measures, per discriminant and per instance, the marginal firing rate of the
    finite-place parity component, of the valuation at infinity, and of the residual constant class,
    together with their full eight-way joint attribution histogram, at k = F_q, at k = Q, and over
    a finite-extension proxy for an algebraically closed constant field where the constant-class component
    is identically trivial; (iii) it compares every one of those rates against a degree-matched random-rational-function
    null run in the same invocation, so that a firing rate is a controlled quantity rather than a
    bare number. The run reduces no uncertainty about whether any matrix exists, since no existence
    decider is involved, and none about any cryptographic quantity.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for the frozen prescribed
      family, the tested parameter assignments, the tested constant fields, and the specific anchored-triple
      construction, the measured firing rates and joint attribution of the three square-class certificate
      components, together with a degree-matched null baseline for each, and a verified certificate
      implementation. What does NOT follow: nothing about the existence or non-existence of any matrix
      (no component failing to fire is a compatibility claim), nothing about a different prescribed
      family or a generic family, nothing about sizes other than 4, nothing about characteristic 2
      which is out of scope, no statement that the observed rates are typical, and no attack, speedup
      or security consequence.'
  inputs:
    procedure: 'STAGE 0 (cost: hours, human): fix the certificate type, the degree-matching rule for
      the null, the closure-proxy extension rule, and the UNDECIDED policy. STAGE 1 (cost: minutes):
      constructed-square and constructed-nonsquare validation, at least 200 each per field; abort
      on any misclassification. STAGE 2 (cost: minutes): divisor accounting identity and independent
      factorisation cross-check on a sample. STAGE 3 (cost: minutes): signal arm over k = F_q -- certify
      all three discriminants per grid instance, record components. STAGE 4 (cost: minutes to an hour):
      signal arm over k = Q, with per-instance completion tracking and UNDECIDED accounting. STAGE
      5 (cost: minutes): closure-proxy arm on the same instances, with the per-instance extension
      degree recorded, and the monotonicity check that the OBSTRUCTED rate does not increase. STAGE
      6 (cost: same order as stages 3 to 5): degree-matched null arm at every field, identical code
      path, same invocation. STAGE 7 (cost: minutes): compute marginals, the eight-way joint histogram,
      the conditional rate of the constant class given even divisor parity, and the signal-minus-null
      differences; write the run record.'
    instrument: Python 3 with sympy for exact polynomial factorisation over GF(q) and over QQ and
      for rational canonicalisation; a hand-written valuation and residual-constant-class routine
      that computes the place at infinity explicitly rather than inferring it, written independently
      of the factoriser; a second factorisation entry point for the cross-check. galois or pure-Python
      finite-field arithmetic for the closure-proxy extension. harness/runner.py for the manifest,
      seeds and inference block. No Sage.
    parameters: 'n = 4, three anchored discriminants per instance. Constant fields: F_q for the largest
      small odd q the parameter box admits, Q, and a finite-extension closure proxy of degree chosen
      per instance so that every relevant residual constant is a square. Grid: at least 30 prescribed
      instances from the frozen family, giving at least 90 discriminants per field. Validation sets:
      at least 200 constructed squares and at least 200 constructed nonsquares per field, with designed
      odd-valuation supports of sizes 1, 2 and 3. Null arm: one degree-matched random rational function
      per signal discriminant, numerator and denominator degrees matched separately, from a declared
      seed. Distinguishability tolerance: absolute firing-rate difference 0.15. Per-instance factorisation
      cap over Q: 120 s, exceeded instances recorded UNDECIDED.'
  controls:
  - 'Constructed-square control: at least 200 rational functions built as explicit squares per field
    must be certified with all-even valuations and square constant class.'
  - 'Constructed-nonsquare control: at least 200 built with exactly one designed odd valuation, or
    with a designed nonsquare constant, must be certified with exactly that component nontrivial and
    no other.'
  - 'Divisor accounting control: the sum of valuations over all places, including infinity, is exactly
    zero for every certificate.'
  - 'Degree-matched random null: uniformly random rational functions with numerator and denominator
    degrees matched instance by instance to the signal discriminants, run in the same invocation through
    the identical certificate code.'
  - 'Closure-proxy control: the same instances over a finite extension large enough that the constant
    class is trivial for them; the OBSTRUCTED rate must not increase.'
  - 'Independent factorisation cross-check: a second factorisation path (different algorithm or different
    library entry point) must produce the same odd-valuation support on a sample.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The identical certificate computation runs against a null: uniformly
    random rational functions over the same constant field with the SAME degree profile as the observed
    discriminants (numerator and denominator degrees matched instance by instance to the signal arm),
    drawn from a declared seed. Because a random rational function of positive degree has odd valuation
    somewhere with high probability, the null establishes the BASELINE firing rate of each component
    under no structure at all. For the signal arm to mean anything, the signal must differ from the
    null in at least one of: the marginal firing rate of finite-place parity, the marginal rate of
    the constant class, or their overlap. If all three match the null within tolerance, the record
    states a controlled null -- the observed square classes are what a degree-matched random function
    gives, and the discriminant structure contributes nothing detectable.'
  independent_variables:
  - constant field in {F_q, Q, closure proxy}
  - certificate component in {finite-place parity, valuation at infinity, residual constant class}
  - 'arm: signal discriminants versus degree-matched random null'
  - prescribed instance identity within the grid
  metrics:
    primary:
    - marginal firing rate of each certificate component, per field and per arm
    - eight-way joint attribution histogram over the three components, per field and per arm
    - conditional firing rate of the residual constant class given even divisor parity, per field
    - constructed_square_misclassification_count and constructed_nonsquare_misclassification_count
      (both must be 0)
    - divisor_accounting_identity_violations (must be 0)
    secondary:
    - per discriminant, the explicit odd-valuation places with multiplicities
    - per-instance versus per-discriminant firing rates, reported separately because the three discriminants
      share entries
    - closure-proxy extension degree per instance and the monotonicity check result
    - factorisation cross-check disagreements
    - UNDECIDED count and cause, per field; also discriminant degree and coefficient-height distributions,
      per field
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The joint attribution of the frozen gate's OBSTRUCTED verdicts to the divisor-parity
      half versus the residual-constant-class half, measured against a degree-matched null.
    formula: 'For each discriminant Delta, write Delta = c times product over monic irreducible f
      of f^{e_f} in canonical reduced form. Components: P_fin equals 1 if some finite e_f is odd;
      P_inf equals 1 if the valuation at infinity is odd; C equals 1 if the class of c in k-star modulo
      k-star-squared is nontrivial. Gate fires iff P_fin or P_inf or C. Predicted: sum over all places
      of the valuation equals 0 exactly; zero misclassifications on constructed squares and nonsquares;
      OBSTRUCTED rate over the closure proxy at most the rate over F_q. No numeric prediction is made
      for the component firing rates themselves, by explicit refusal recorded in the proposal; distinguishability
      from the null requires an absolute difference of at least 0.15 in at least one marginal or in
      the joint histogram.'
    source: Pre-registered in the parent proposal IDEA-20260816-5c040d before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are n = 4, at least 30 prescribed instances from the frozen
      family p_S = (t+1)/(t+d_S) yielding at least 90 discriminants per field, over three constant
      fields, plus at least 400 constructed validation functions per field. No transfer or extrapolation
      is claimed: firing rates are reported for the tested family and tested assignments only, and
      the highly structured form of the prescribed data means these rates are explicitly NOT offered
      as estimates for a generic family. The one comparison that does carry structural weight -- the
      monotonicity of the OBSTRUCTED rate from F_q to the closure proxy -- is a consistency check
      on the implementation rather than an extrapolation.'
    correspondence: null
  tail_checks:
  - Discriminants with the largest coefficient heights over Q are inspected individually, since that
    is where factorisation is least reliable.
  - Instances where all three anchored discriminants fire identically are inspected, since that pattern
    most likely reflects the shared entries rather than three independent obstructions.
  - Discriminants that are exactly zero, or whose canonical reduction cancels entirely, are branched
    into the declared degenerate class and never assigned a component, per RQ-PMA-001's constraints.
  - The closure-proxy extension degree distribution is inspected for instances requiring unusually
    large degrees, which would indicate the proxy is straining.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort the run and report nothing if any constructed square or nonsquare is misclassified.
  - Abort if the divisor accounting identity fails on any certificate.
  - Record an instance as UNDECIDED and continue if factorisation exceeds its 120 s cap; never assign
    it a component and never count it in a rate.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Zero misclassifications on all constructed squares and nonsquares, zero divisor
    accounting violations, and a complete three-component certificate for every decided discriminant
    at every constant field, with marginals, the eight-way joint histogram, and the degree-matched
    null baseline all reported.
  falsification_criterion:
  - Any constructed-square or constructed-nonsquare misclassification.
  - Any nonzero divisor accounting residual.
  - Independent factorisation cross-check disagreement on any sampled discriminant.
  - OBSTRUCTED rate over the closure proxy strictly exceeding the rate over F_q on the same instances.
  - 'All component rates and the joint histogram matching the degree-matched null within 0.15: recorded
    as a controlled null.'
  - 'The finite-place parity component firing on zero instances at every tested field while the constant
    class fires: the divisor-parity half is vacuous at the tested scale, which is a decisive scoped
    result to be reported as such.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-5c040d
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - 'The Coordinator must fix the closure-proxy rule: which extension degree per instance, and how
    to report an instance where no bounded extension makes every relevant constant a square.'
  - The Coordinator must rule on whether firing rates are scored per discriminant or per instance
    as the primary metric, since the three anchored discriminants share entries and the two rates
    can differ materially.
  - The degree-matching rule for the null needs to be frozen precisely (numerator and denominator
    degrees separately, and whether to match coefficient height as well over Q), because the whole
    null-comparison hinges on it.
  - Valid parameter assignments for the prescribed family depend on the unresolved parameter-box question
    raised elsewhere in this bucket; without instantiable d_S there is no grid.
