experiment:
  id: EXP-ICEX-e18b45
  hypothesis_id: H-ICEX-e1c3b6
  derived_from_idea: IDEA-20260901-c4730d
  question_id: RQ-JINV-8fc13a
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Splitting-and-valuation profile of the group order by COMPLETE enumeration of ordinary isogeny
    classes - exact verification of the universality identity and the two conductor-one consequences,
    a blocking unconditional-divisibility fixture, a matched-generic null at the same prime, a
    matched-automorphism control on the smallest-excluded-prime axis, a twist control, a CURVE-FREE
    trace-enumeration arm and a CURVE-FREE constrained-integer null that decides the scope of every
    distributional statement
  objective: >-
    Reduce one inferential uncertainty and one measured one. THE INFERENTIAL ONE, at zero compute:
    the lane repeatedly reasons from "small discriminant constrains the arithmetic" to "special j is
    arithmetically distinguished", and the identity plus one congruence shows the constraint exists
    on EVERY ordinary curve with density exactly one half whatever the discriminant. THE MEASURED
    ONE: whether the small-prime END of the profile - where a fixed congruence condition does carry
    weight - shifts the B-smooth part of the group order for special-j classes relative to a matched
    generic null at the same prime, and whether any such shift tracks the SMALLEST EXCLUDED PRIME or
    the automorphism group.
    The run additionally decides the SCOPE of any shift it finds. The predicted signature is produced
    by integers restricted to a congruence class set; a curve-free constrained-integer arm run under
    the identical statistic determines whether the finding is about elliptic curves at all.
  what_this_is_not:
    - >-
      Not an attack and not a speedup. No ECDLP instance is solved, no algorithm is proposed, and no
      exponent moves. On a prime-order subgroup the entire content of the tracked object is the
      automorphism-discount null restated, and the contract says so before the measurement.
    - >-
      NOT A COST MEASUREMENT. Converting a smooth-part distribution into an expected attack cost needs
      a Pollard rho constant measured in this program on comparable instances; this run measures none
      and therefore makes NO attack-cost statement of any kind.
    - >-
      Not a per-curve measurement. The profile is an isogeny-class invariant, so the unit of analysis
      is the class and per-curve pooling is prohibited by this contract.
    - >-
      Not a statement about volcano depth, about factor bases, or about relation collection. The
      conductor appears only as a control that the two exact consequences must FAIL at conductor
      greater than one.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence.
      approved_by is null.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: at the declared primes, over the COMPLETE enumeration of ordinary
      isogeny classes with the group order factored outright, the universality statement holds with
      zero exceptions or it does not; every conductor-one class at the two special discriminants has
      the stated exact property or it does not; and the B-smooth part of special-j classes does or does
      not differ from matched generic classes by more than the pre-registered constrained-model
      prediction, with the difference attributable to the smallest excluded prime or to the
      automorphism group. WHAT DOES NOT FOLLOW: nothing about a fixed prime-order instance, no
      exponent, no attack cost, nothing at cryptographic scale, and - if the constrained-integer arm
      reproduces the difference - nothing about elliptic curves.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, and it is most of the deliverable; blocking). Derive the universality
      identity and the two conductor-one consequences in full. Compute the constrained-model prediction
      for the expected logarithm of the smooth part under the rule "divides with twice the unconditional
      rate if split, zero if inert", for each discriminant in the panel and for the unconditional model,
      at the declared bound. WRITE THE PREDICTED DIFFERENCES DOWN AND HASH THEM BEFORE ANY DATA IS
      READ. Freeze: the full prime set in the range; the panel of discriminants including the
      matched-automorphism arm and the large class-number-one arm where the prime two is inert; the
      smoothness bound and its two robustness values; the unit of analysis; and the machine.
      STAGE 1 (baseline reproduction, BLOCKING). At the committed toy primes, enumerate EVERY ordinary
      isogeny class, certify each against the mass formula with the Deuring weighting honoured at the
      two special j-invariants, and check the pooled probability that each of the declared smallest
      primes divides the order against the unconditional heuristic, within the exact binomial interval.
      STAGE 2 (the exact arms). Verify universality, and the two conductor-one consequences, by complete
      enumeration: every class, every prime in the range, the order factored outright, the profile
      recorded, the two-adic valuation recorded, and the perfect-square indicator recorded on the
      relevant arm. Enumerate and report separately every case where the prime divides twice the
      discriminant.
      STAGE 3 (the distributional arm). Compute the logarithm of the smooth part and the small-factor
      count per CLASS; compare special-j against matched generic at the SAME prime with an exact
      permutation test over class labels; run the matched-automorphism control across the panel; and
      sweep the smallest-excluded-prime axis by choosing discriminants where the prime two is inert,
      split and ramified.
      STAGE 4 (curve-free arms). (a) TRACE ENUMERATION: recompute the whole profile arithmetically from
      the prime and the trace with NO curve constructed, over a prime range orders of magnitude larger,
      and report the same distributional comparison there. (b) CONSTRAINED INTEGERS: draw uniform
      integers from the same interval, restrict them to the same split-prime set, and run the identical
      smooth-part comparison with no curve, no trace and no isogeny class anywhere.
      STAGE 5 (controls and reporting). Twist control; conductor arm; class-number stratification.
      REPORT PER CLASS, NEVER PER CURVE, and report the distribution over primes rather than a single
      cell, since the special arm has one class per prime.
    instrument: >-
      Exact integer arithmetic, complete trace enumeration and outright factorisation of the group order
      under experiments/EXP-ICEX-e18b45/driver/. Class certification against the mass formula with the
      Deuring weighting. The trace-enumeration arm constructs no curve at all, which is both the scope
      control and the reason the range can be extended cheaply. Recorded through harness/runner.py.
    parameters: >-
      THE PRIME SET IS PRE-REGISTERED IN FULL BEFORE ANY MEASUREMENT and every arm runs on that same
      set. Curve-constructing arms at the committed toy primes; the trace-enumeration arm across a much
      larger declared range. Smoothness bound declared in advance with the whole analysis repeated one
      order of magnitude below and above, all three reported. Panel of discriminants covering: the two
      special j-invariants; several small discriminants with automorphism order two; a large
      class-number-one discriminant where the prime two is inert; and generic discriminants as the
      matched null. THE MACHINE IS NAMED; timings are for budget accounting only.
  controls:
    - >-
      CURVE-FREE CONSTRAINED-INTEGER NULL, MANDATORY AND BLOCKING (standing scope constraint from the
      pfdr-battery lane): uniform integers from the same interval, restricted to the same split-prime
      set for each panel discriminant, with no curve, no trace and no isogeny class. It reproduces the
      predicted signature by construction if the signature is a congruence-restriction effect. If it
      reproduces the special-versus-generic difference, the curve reading is WITHDRAWN and the finding
      is restated as a statement about congruence-restricted integers.
    - >-
      CURVE-FREE TRACE-ENUMERATION ARM: the profile computed arithmetically from the prime and the trace
      with no curve constructed. It both extends the range by orders of magnitude and demonstrates that
      no point, coordinate or group law enters the measurement. Its transfer assumption - that trace
      enumeration is the same population as class enumeration up to the mass weighting - is DECLARED and
      checked against the curve-constructing arm where they overlap.
    - >-
      MATCHED GENERIC NULL, BLOCKING: generic-discriminant classes at the SAME prime and the same order
      bit length, measured through the identical code path. Without it any special-j number is an
      artifact.
    - >-
      AUTOMORPHISM-DISCOUNT BASELINE AS THE NULL HYPOTHESIS: the contract states, and the design
      enforces, that on a prime-order subgroup the whole profile reduces to the single splitting
      statement, which is the automorphism-discount null itself. Any reported effect must be shown to
      live in the COFACTOR and not in the prime-order part.
    - >-
      MATCHED-AUTOMORPHISM CONTROL, the discriminating cell: small discriminants with automorphism order
      two, including a large class-number-one discriminant where the prime two is inert. It separates
      "small discriminant" from "automorphism group larger than two", which no other control does.
    - >-
      DECAY PARAMETER - THE SMALLEST EXCLUDED PRIME, swept by choosing discriminants where the prime two
      is inert, split and ramified. The predicted SHAPE is a STEP on this axis and FLAT in the
      discriminant size at fixed smallest excluded prime. A quantity that fails to move when the
      smallest excluded prime moves is the canonical artifact tell.
    - >-
      SECOND DECAY PARAMETER - THE CONDUCTOR. The two exact consequences are stated for conductor one
      only and MUST FAIL at larger conductor in the predicted way; a statement surviving every conductor
      would indicate the arm is not computing the conductor at all.
    - >-
      TWIST CONTROL: the quadratic twist has the negated trace and a different order while sharing the
      j-invariant, the discriminant and the automorphism group. The profile must DIFFER between a class
      and its twist. If it does not, the instrument is reading the j-invariant rather than the order and
      every number is void.
    - >-
      CLASS-COMPLETENESS CERTIFICATE: every enumerated class certified against the mass formula with the
      Deuring weighting honoured at the two special j-invariants.
  independent_variables:
    - fundamental discriminant of the class, across the declared panel
    - smallest excluded prime - two inert, split or ramified
    - automorphism group order
    - conductor, one versus greater than one
    - class number of the discriminant
    - prime, across the pre-registered set
    - arm - curve-constructing, curve-free trace enumeration, curve-free constrained integers
  metrics:
    primary:
      - >-
        the splitting-and-valuation profile per CLASS: for every prime below the bound, the Kronecker
        symbol in minus one, zero, plus one and the integer valuation of the group order at that prime.
        Archived in full per class; the derived scalars below are recomputable from it.
      - >-
        split_fraction: the fraction of prime divisors of the order, excluding those dividing twice the
        discriminant, that split. Dimensionless. FORCED exactly 1.000 on every class.
      - >-
        two_adic_valuation per class, an integer, with the perfect-square indicator for the order minus
        one on the relevant arm. FORCED to the exact values the two consequences predict on conductor-one
        classes.
      - >-
        log_smooth_part per class: the natural logarithm of the product of prime powers below the bound
        dividing the order, in nats. Archived as the FULL EMPIRICAL DISTRIBUTION per discriminant cell -
        the empirical cumulative distribution function - because the difference of means is only one
        summary of it and the tail is where the interesting event lives.
      - >-
        small_factor_count per class: the sum of the valuations below the bound, an integer count.
      - >-
        smooth_part_difference: the mean log_smooth_part over special-j classes minus the same over
        matched generic classes at the same prime, in nats, with an EXACT permutation distribution over
        class labels. Because the special arm has ONE class per prime, this difference is reported as a
        distribution OVER PRIMES and never as a single cell; a single-prime difference is not a
        legitimate summary and this contract prohibits quoting one.
      - >-
        matched_automorphism_difference: the same statistic on the panel arms with automorphism order
        two, including the large class-number-one arm where the prime two is inert. THE DISCRIMINATING
        CELL.
      - >-
        curve_free_integer_difference: the same statistic on the constrained-integer arm. THE METRIC
        THAT DECIDES WHETHER THE RUN MAY SAY ANYTHING ABOUT CURVES.
      - >-
        unconditional_divisibility_fixture: the pooled measured probability that each declared small
        prime divides the order, over all classes, against the unconditional heuristic, with the exact
        binomial interval. BLOCKING.
    secondary:
      - >-
        per class: the prime, the trace, the order, the discriminant, the fundamental discriminant, the
        conductor, the class number, the automorphism order, the class size and the Deuring weighting
        flag.
      - >-
        the full factorisation of the order at toy scale, so any bound can be re-applied without a rerun.
      - >-
        the enumerated list of cases where the prime divides twice the discriminant, reported separately
        rather than assumed away.
      - >-
        the twist control's profile for every class in the panel.
      - >-
        the conductor arm's results, reported separately and never pooled with conductor one.
      - >-
        the class-number stratification of the small-factor count at matched splitting profile, with an
        exact permutation distribution.
      - >-
        the agreement between the curve-constructing arm and the trace-enumeration arm where their prime
        ranges overlap, which is the check on the declared transfer assumption.
      - >-
        the Stage 0 constrained-model predictions with their hash, recorded before the data.
      - >-
        wall-clock seconds and peak resident set per prime on the named machine, and the largest prime at
        which factorisation completed.
  heuristic_under_test: HEUR-SPL-1
  preregistered_prediction:
    quantity: >-
      split_fraction; two_adic_valuation on the two conductor-one arms; smooth_part_difference for
      special-j against matched generic; matched_automorphism_difference; the shape of the small-factor
      count against the smallest-excluded-prime axis; and curve_free_integer_difference.
    formula: >-
      split_fraction is EXACTLY 1.000 on every class, which is a derivation from the identity plus one
      congruence and not a statistical prediction. On conductor-one classes at the first special
      discriminant the two-adic valuation is exactly zero; at the second it is at most one and the order
      minus one is a perfect square. smooth_part_difference is NEGATIVE - special-j classes rougher -
      because the exclusion of the smallest prime is not compensated by the doubling on the allowed odd
      primes; its exact predicted magnitude is computed in Stage 0 from the constrained model and hashed
      before any data is read, and no sharper number is written here because no model in this corpus
      supplies one. matched_automorphism_difference shows the SAME effect wherever the smallest excluded
      prime is two, including at the large class-number-one discriminant. The small-factor count shows a
      STEP on the smallest-excluded-prime axis and is FLAT in the discriminant size at fixed smallest
      excluded prime. curve_free_integer_difference matches the class arms within tolerance.
      The direction that would matter - special-j classes SMOOTHER - is the halting outcome and is not
      predicted.
    source: >-
      The identity, the two exact consequences, the three rival readings, the matched-automorphism
      control and the smallest-excluded-prime relocation are taken from IDEA-20260901-c4730d, read in
      full by TASK-20260904-8f2f95 on 2026-09-04. The constrained-model prediction is a DERIVATION
      computed in Stage 0 from a divisibility rule stated in advance, never a measurement. The
      unconditional divisibility heuristic and the smooth-number density function behind it are RECALLED
      ONLY and are measured as a blocking fixture rather than assumed. Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      The curve-constructing arms run where a COMPLETE enumeration of ordinary isogeny classes with the
      order factored outright is feasible, which makes the negative exact over its range rather than
      statistical - that exactness is the design's main asset and it is bought by keeping the range
      small. The trace-enumeration arm extends the range by orders of magnitude at the cost of a
      declared transfer assumption about the mass weighting, checked where the two overlap. THE TESTED
      SCALE IS THE CLAIMED SCALE and nothing is extrapolated to cryptographic primes.
    correspondence: >-
      The profile depends on the class only through the prime and the trace, so the trace-enumeration
      arm samples the same object without constructing a curve. The correspondence is exact for the
      profile and INEXACT for the population weighting, which is the declared transfer assumption and is
      checked on the overlap rather than asserted.
  tail_checks:
    - >-
      Compare the smoothest observed order in each discriminant cell against the predicted extreme-value
      probability from the smooth-number density curve. A cell with a heavier smooth tail than predicted
      is the interesting event and is reported as a finding, never absorbed as noise.
    - >-
      Report the count of classes whose order is smooth to the declared bound, per cell, which under the
      model should be equal across cells up to the exclusion effect.
    - >-
      Report the smooth_part_difference distribution over primes with its extremes, since the special arm
      has one class per prime and one prime can carry the mean.
    - >-
      Recompute the whole distributional analysis at the two robustness smoothness bounds and report all
      three; a small bound makes the smooth part noisy and a large one makes it essentially the order.
    - >-
      Report the largest prime at which factorisation completed, and mark every prime beyond it as not
      reached rather than as showing nothing.
  replication:
    seeds:
      - 20260904
      - 20260905
      - 20260906
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_runs: 10
  stopping_rules:
    - >-
      HALT before Stage 3 if the unconditional-divisibility fixture fails at any declared small prime.
      The enumeration or the factorisation is wrong and no special-j cell may be compared.
    - >-
      HALT the whole run if the twist control shows an equal profile for a class and its twist.
    - >-
      STOP and request independent review, before writing any sentence asserting it, if the smooth part
      is systematically LARGER on special-j classes and survives the permutation test and the
      matched-automorphism control.
    - >-
      Report every case where the prime divides twice the discriminant separately; do not fold it into
      the split fraction.
    - >-
      Stop at the pre-registered prime set. No prime is added after any difference has been seen, and the
      full set is registered in advance precisely because the special arm has one class per prime.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. A factorisation that does not
      complete at the largest prime is an infrastructure outcome recorded with the largest prime reached.
  invalidation_rules:
    - >-
      A timeout, crash or dependency failure makes the run failed_infrastructure and is NEVER negative
      mathematical evidence.
    - >-
      A run that pools curves within an isogeny class as independent observations is invalid_measurement.
      The profile is a class invariant and per-curve pooling manufactures significance from nothing; this
      is the dominant statistical confound of the design.
    - >-
      A run that pools conductor-one and larger-conductor classes in any arm is invalid_measurement.
    - >-
      A run quoting a single-prime smooth_part_difference as the headline, rather than the distribution
      over primes, is invalid_measurement.
    - >-
      A run reporting any distributional difference without the curve-free constrained-integer arm's
      value is invalid_measurement.
    - >-
      A run that makes any attack-cost or expected-work statement is invalid_measurement: no rho constant
      is measured here and the contract forbids converting a smooth-part distribution into a cost.
    - >-
      A run whose prime set, panel, smoothness bound or Stage 0 predictions differ from the frozen
      contract is a DIFFERENT experiment and needs a new contract.
  success_criterion: >-
    The run yields interpretable evidence when ALL of the following hold: (1) the Stage 0 derivations and
    constrained-model predictions are archived and hashed before any data is read; (2) the
    unconditional-divisibility fixture passes at every declared small prime; (3) the class-completeness
    certificate passes at every prime with the Deuring weighting honoured; (4) split_fraction is reported
    per class with every exceptional case enumerated separately; (5) the two conductor-one arms report
    their exact quantities on every class, with the conductor arm reported separately; (6) the full
    empirical distribution of log_smooth_part is archived per discriminant cell, with the difference
    reported as a distribution over primes and an exact permutation distribution; (7) the
    matched-automorphism control and the smallest-excluded-prime sweep are reported; (8) both curve-free
    arms are reported, with the trace-enumeration overlap check; (9) the twist control is reported for
    every panel class.
  falsification_criterion:
    - >-
      split_fraction is below 1.000 on any class with the exceptional cases removed. The universality
      derivation is contradicted by an identity plus one congruence, so the IMPLEMENTATION is indicted
      first and independent review is required before any mathematical reading.
    - >-
      An even order on a conductor-one class at the first special discriminant, or an order minus one that
      is not a perfect square at the second. That consequence is false as stated and is withdrawn by a
      superseding record.
    - >-
      smooth_part_difference is systematically POSITIVE and survives the permutation test and the
      matched-automorphism control. The record STOPS for independent review before stating it.
    - >-
      The effect appears only at the two special j-invariants and not at the large class-number-one
      discriminant where the prime two is also inert. The measurement is tracking the AUTOMORPHISM group
      and the arithmetic reading is void.
    - >-
      The small-factor count decays smoothly with the discriminant size instead of stepping on the
      smallest-excluded-prime axis. The quantity is measuring class-number or conductor effects rather
      than exclusion, and the interpretation changes accordingly.
    - >-
      The twist control shows an equal profile for a class and its twist. The instrument is reading the
      j-invariant rather than the order; every number is void in both directions.
    - >-
      The unconditional-divisibility fixture fails. The enumeration or the factorisation is wrong; the
      line halts.
    - >-
      The curve-free constrained-integer arm reproduces the special-versus-generic difference. The finding
      belongs to congruence-restricted integers; the curve reading is withdrawn.
  required_artifacts:
    - manifest.yaml with exact command, commit sha, dirty-tree state, resolved inference block, environment and the NAMED machine
    - the Stage 0 derivations and the constrained-model predictions, hashed, written before any data was read
    - the pre-registered prime set and panel, with their hash
    - the class-completeness certificates against the mass formula, with the Deuring weighting flags
    - raw-result.json with the full profile, the full factorisation of the order, the two-adic valuation and the perfect-square indicator per class
    - the enumerated exceptional cases where the prime divides twice the discriminant
    - the full empirical distribution of log_smooth_part per discriminant cell, archived as raw per-class values
    - the smooth_part_difference distribution over primes with its exact permutation distributions
    - the matched-automorphism control table and the smallest-excluded-prime sweep
    - the conductor arm, reported separately from conductor one
    - the class-number stratification at matched splitting profile
    - the curve-free trace-enumeration arm's results and its overlap check against the curve-constructing arm
    - the curve-free constrained-integer arm's complete results under the identical statistic
    - the twist control's profile for every panel class
    - the unconditional-divisibility fixture with its binomial intervals
    - the largest prime at which factorisation completed, with wall-clock seconds and peak resident set per prime
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not confer approval. status is draft, frozen is false,
      execution_authorized is false, approved_by is null.
    - >-
      Approval must confirm the pre-registered prime set. The special arm has ONE class per prime, so the
      set is the entire sample size, and adding primes after seeing a difference would be the exact defect
      that made an earlier single-cell record in this lane inconclusive.
    - >-
      Approval must confirm the construction of the curve-free constrained-integer arm - the interval, the
      restriction rule and the draw count. That arm decides whether the run may say anything about curves,
      and a construction chosen afterwards would destroy its value.
    - >-
      Approval should confirm that no attack-cost statement is permitted from this contract. A smooth-part
      distribution invites a Pohlig-Hellman cost reading, and this program has no measured rho constant to
      support one.
  derivation_provenance:
    tool: coordinator-authored contract under TASK-20260904-8f2f95
    source_record: IDEA-20260901-c4730d
    authored_at: '2026-09-04'
    note: >-
      The universality identity, the two exact conductor-one consequences, the three rival readings, the
      matched-automorphism control, the smallest-excluded-prime decay parameter, the twist control and the
      class-completeness certificate are taken from the parent proposal and restated as measured
      quantities with units and decision rules. Added by this contract: the CURVE-FREE constrained-integer
      null required by the standing scope constraint, the requirement that the smooth part be archived as
      a full empirical distribution and its difference reported as a distribution over primes rather than
      a single cell, the explicit prohibition on any attack-cost statement in the absence of a measured rho
      constant, and the overlap check between the two curve-free arms. Every numeric prediction is derived
      and hashed in Stage 0; none is written into this contract.
  derivation_gaps:
    - >-
      The two exact consequences are elementary and a referee with a library should be expected to find
      them stated in the curve-construction literature. This session opened no external source, so the
      novelty status is unverified and the contract's value rests on the measurement and the scope
      statement, not on priority.
    - >-
      The constrained-model prediction is a heuristic, and it is the reference the measured difference is
      scored against. If the model is wrong the difference is still measured correctly but its
      interpretation changes; the model's own fit is checked by the unconditional fixture first.
    - >-
      The trace-enumeration arm's population differs from the class-enumeration population by the mass
      weighting. The overlap check bounds that difference where the ranges meet, but the extended range
      carries the assumption and every row from it is flagged.
    - >-
      The order and the prime are linked: comparing classes at the same prime still leaves the order
      varying across the Hasse interval and the smooth part depends on the order's size. The design matches
      on bit length and reports the residual dependence rather than adjusting it away.
    - >-
      The two special discriminants are perfectly confounded with automorphism order across classes. The
      large class-number-one discriminant is the ONLY available separation on that axis, so the
      discriminating cell rests on a single arm.
