experiment:
  id: EXP-JMV-004
  hypothesis_id: H-JMV-002
  question_id: RQ-JMV-001
  version: 2
  supersedes: >-
    version 1 (status draft, hypothesis_id null, approved_by null, claim_tier crypto). Version 1
    is superseded, not corrected in place. Its claim_tier was NOT approved; see condition E3.
    Nothing was ever run under version 1; no run record, manifest, or evidence record exists for
    any version of this experiment.
  title: >-
    Concrete field-operation cost of the JMV random self-reduction under the stated cost model,
    and the non-vacuity of its proven eigenvalue separation. Analytic derivation, zero instances.
  status: paused
  status_enactment_note: >-
    Enacted 2026-08-08 by the Coordinator: DEC-20260807-5adc24 (2026-08-07)
    paused this experiment for a fabricated/misattributed approval citation,
    but this status field was never updated to reflect that decision until
    now. Found during a survey for approved-but-unrun experiments to
    dispatch; this experiment was correctly excluded from that dispatch as a
    result of finding this gap, not despite it. Prior value: approved.
  approved_by: coordinator
  approved_at: "2026-07-26"
  approved_under: >-
    DEC-20260726-001 (approval of BRANCH (a) ONLY; binding conditions C1, C2, E1, E2, E3, E4).
    Branch (b) is blocked pending DEC-20260726-002, which also blocks EXP-JMV-003 outright.
    Version 2 is the version approved; version 1 was explicitly NOT approved.
  assigned_to: executor

  objective: >-
    Corollary 1.2 gives polylog(q) ORACLE QUERIES, not field operations. Convert the reduction
    to a concrete operation count under a fully stated cost model and determine (i) the modelled
    bit sizes at which its overhead is negligible, comparable, or dominant relative to sqrt(n),
    and (ii) whether the PROVEN eigenvalue separation is non-vacuous when the model is evaluated
    at q = 2^256. Nothing is instantiated and nothing is measured: q enters only as a parameter
    of a deterministic model.

  type: theoretical
  proof_status: derivation
  proof_refs:
    - experiments/EXP-JMV-004/runs/<RUN-ID>/cost_model.md
  claim_tier: not_applicable
  claim_tier_ruling: >-
    CONDITION E3, BINDING. Version 1 asserted claim_tier crypto. THAT TIER IS REFUSED. Per
    docs/claims-and-verification.md the tier is a mechanical function of the instances actually
    tested, and this experiment tests NONE at any size. Approving it at crypto tier would be the
    very failure mode this suite is auditing, with the scale set to zero. It is approved instead
    as an ANALYTIC DERIVATION: any evidence record arising from it carries type theoretical,
    proof_status derivation, and proof_refs pointing at the archived cost_model.md. If branch (b)
    is ever unblocked it inherits the MEDIUM ceiling of EXP-JMV-003's measurements - never
    crypto, whatever q the model is evaluated at.
  claim_boundary: >-
    A claim about THE STATED COST MODEL (Proposition 3.1's walk length, the per-step modular
    polynomial cost, and the cited explicit GRH constants) and about nothing else, WITH NO
    TESTED INSTANCE AT ANY SIZE. It asserts nothing about real attack cost, improves no attack,
    and bears on GRH not at all. Every numeric statement about q = 2^256 must be phrased as an
    EVALUATION OF THE MODEL AT THAT PARAMETER, never as a measurement on P-256 or on any curve.
    If the proven separation turns out vacuous at 2^256 while a measured gap would be healthy,
    the only correct statement is that Corollary 1.2 is asymptotically sound but concretely
    UNPROVEN at deployed sizes - not that it is false, and not that the reduction fails in
    practice. A high modelled reduction cost is not a security claim: a self-reduction being
    expensive makes no dlog instance easier or harder.

  inputs:
    q_bit_sizes: [64, 96, 128, 160, 192, 224, 256, 320, 384, 512]
    q_bit_sizes_note: "Model parameters. NOT instances, NOT curves, NOT tested sizes. They confer no tier."
    delta_values: [0.25, 0.5, 1.0, 2.0]
    lambda_2_sources:
      branch_a:
        status: APPROVED AND THE ONLY RUNNABLE BRANCH
        description: "Proven GRH-conditional bound with explicit constants (Bach-Sorenson-type, JMV ref [2]), every constant traceable to a cited source."
      branch_b:
        status: BLOCKED
        description: "Constant measured by EXP-JMV-003. EXP-JMV-003 is itself unapproved under DEC-20260726-002 and must not be started, piloted, or partially run."
    theorem_transcription_artifact: >-
      Theorem 1.1, Corollary 1.2, Proposition 3.1's walk-length inequality, and Lemma 4.1's
      eigenvalue bound and its normalization are held ONLY as a plain-text paste of
      arXiv:math/0411378v3, not as the source. This artifact is an object under test on equal
      footing with the model; see control C1.

  method:
    - "State ONE degree convention explicitly and reconcile it in writing to the paper's own statements of Proposition 3.1 and Lemma 4.1 (condition E2): whether a split prime contributes one generator or two, whether the generating set is symmetric, and the meaning of any 1/e normalization. m = (log q)^(2+delta); degree k as fixed by the stated convention."
    - "Report the logarithm base explicitly and compute BOTH base-2 and natural, since the choice moves m by orders of magnitude."
    - "Walk length r from Proposition 3.1, with h ~ sqrt(q), under the transcribed inequality."
    - "Per-step cost: root-finding on Phi_l(j(E), X) for a TYPICAL step. A uniformly random prime l <= m is typically of size ~m, so cheap l = 2 steps are NOT what the theorem's generator set provides. Model the typical-l and the best-case-l=2 variants and report both."
    - "State the precomputation term explicitly (condition E4): whether Phi_l is assumed precomputed and available, and at what storage cost. At the m the theorem's generator set forces at cryptographic q, Phi_l has on the order of l^2 coefficients and is not storable. A cost that silently assumes free precomputation is not a cost."
    - "Total reduction cost = r x per-step cost, plus any declared precomputation term; compare against rho at sqrt(n) ~ q^(1/2) under the SAME cost unit, with the unit named."

  controls:
    - id: C1
      name: SOURCE-TRANSCRIPTION CONTROL (binding; gates every conclusion in this experiment)
      requirement: >-
        Theorem 1.1, Corollary 1.2, Proposition 3.1's walk-length inequality, and Lemma 4.1's
        eigenvalue bound AND its normalization must be archived verbatim in the run artifacts
        with version, section, and equation numbers, and must be checked against
        arXiv:math/0411378v3 by a reviewer who did NOT produce the transcription, BEFORE any
        conclusion is recorded. The headline quantity here is the SIGN of log(k/c); a
        single-character error in a transcribed constant, exponent, or normalization flips that
        sign and would manufacture a false vacuity result out of our own reading error.
      status_at_approval: >-
        NOT SATISFIED. No agent in this program has read arXiv:math/0411378v3. The paper is not
        in the corpus.
      coordinator_note_added_in_version_2: >-
        C1 IS NOW KNOWN TO BE A LIVE RISK HERE, NOT A PRECAUTIONARY ONE. Scouting under
        EXP-JMV-001 indicates that the same plain-text paste of this paper contains at least one
        demonstrable digit-level corruption in Figure 1 (the K-163 row: a printed value that a
        single inserted digit repairs to exact consistency). The theorem statements this
        experiment depends on come from that same artifact and have never been checked against
        the source. A demonstrated nonzero corruption rate in the artifact means the C1 review
        for this experiment must be a DIGIT-LEVEL check of every constant, exponent, and
        normalization factor in the four transcribed statements, not a reading for sense.
      what_is_and_is_not_blocked: >-
        The RUN is not blocked: computing and archiving the cost model, the grids, and the
        crossover tables is permitted and is expected to precede the C1 review. The CONCLUSION
        is blocked. Until C1 passes, no artifact may state that the separation is vacuous or
        non-vacuous, that Corollary 1.2 is or is not concretely proven, or that a crossover does
        or does not exist. analysis.md must carry a C1 STATUS: PENDING banner at the top until
        then.
    - id: C2
      name: CLAIM-TIER AND FRAMING DISCIPLINE
      requirement: >-
        No promotion above the approved basis (analytic derivation, no tested instance) and no
        attack framing of any kind. This is a REDUCTION cost audit: it produces no ECDLP attack,
        no attack-cost improvement, and nothing bearing on GRH, and it must not be written up as
        evading the D1 data-movement or BAR-AMORT-D2 exponent-neutrality barriers, which concern
        attacks. It must not be attached to GOAL-ECDLP-001 or GOAL-CRYPTO-001, from which
        RQ-JMV-001 is explicitly detached.
    - id: E2-CONVENTION
      name: NORMALIZATION AND CONVENTION CONTROL
      requirement: >-
        Both logarithm conventions computed and reported side by side, and ONE stated degree
        convention with its written reconciliation to the paper's own statements. Any conclusion
        that flips between the two logarithm conventions, or between the two degree conventions,
        is reported as CONVENTION-DEPENDENT and is NOT a result. A factor of 2 in the degree
        convention moves log(k/c) across zero, which IS the headline quantity.
    - id: E4-PRECOMPUTATION
      name: PRECOMPUTATION-TERM CONTROL
      requirement: >-
        cost_model.md states explicitly whether Phi_l is assumed precomputed and available, and
        reports either the precomputation term or the declared assumption, with the storage
        figure at the m values in the grid. Both the with-precomputation and the
        free-precomputation variants must be reported if the assumption is made.
    - id: CTRL-CONSTANT-PROVENANCE
      name: CONSTANT PROVENANCE CONTROL
      requirement: >-
        Every implied constant used is traceable to a cited source and recorded in a constants
        table with source, statement number, and the hypotheses under which it holds. No constant
        is invented, and no constant is silently set to 1. A constant set to 1 by choice is
        declared as such and its effect on the sign of log(k/c) reported.
    - id: CTRL-GRH
      name: CONDITIONALITY DECLARATION
      requirement: >-
        Every quantitative statement is labelled GRH-conditional, because the underlying bound
        is. Nothing here confirms or disconfirms GRH, and no artifact may suggest otherwise.
    - id: CTRL-SANITY-DEFERRED
      name: "Toy sanity anchor (DEFERRED, not available)"
      requirement: >-
        Version 1 named a sanity anchor comparing modelled r against walk lengths measured by
        EXP-JMV-005. EXP-JMV-005 is unapproved under DEC-20260726-002, so THIS ANCHOR DOES NOT
        EXIST and must not be reported as passing, failing, or attempted. Its absence is a
        stated limitation of the run: the model is unanchored against any measurement at any
        size, which is exactly why the basis is derivation and the tier is not_applicable.

  independent_variables: [q bit size, delta, log convention, per-step cost variant]
  independent_variables_note: >-
    lambda_2 source is NOT an independent variable in version 2: branch (b) is blocked, so the
    branch-(a) proven bound is the only level.

  metrics:
    primary:
      - "sign of log(k/c) under the proven bound at each (q, delta) cell, under BOTH logarithm conventions - the non-vacuity indicator"
      - "modelled reduction overhead in field operations at each (q, delta) cell, with the cost unit named"
      - "modelled crossover bit size where reduction overhead equals sqrt(n), per convention and per per-step variant, or an explicit statement that no crossover occurs inside the grid"
      - "smallest delta for which log(k/c) > 0 when the model is evaluated at q = 2^256, with its induced m and typical l"
    secondary: [r, m, k, c, typical l, ratio overhead/sqrt(n), declared precomputation term, storage figure for Phi_l at each m]

  replication:
    seeds: []
    seed_note: "Fully deterministic arithmetic. No randomness, so seed integrity is not applicable; determinism is asserted by byte-identical re-execution on the archived constants table."
    independent_instances: 1

  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 5
    budget_provenance: >-
      Funded from the standalone RQ-JMV-001 track budget (2 CPU-hours, 10 runs total across
      EXP-JMV-001 and EXP-JMV-004 branch (a)). Consumes NO goal campaign budget.

  stopping_rules:
    - "BRANCH (a) ONLY. If any input, constant, or code path would require a value from EXP-JMV-003, STOP and report the dependency. Do not estimate it, do not substitute a literature proxy for it, and do not start EXP-JMV-003 in any form."
    - "The run STOPS at the model, the grids, and the constants table. It does not write a conclusion about vacuity or about Corollary 1.2. Conclusions are written only after the C1 review completes."
    - "If any of the four required source statements cannot be archived verbatim as held, STOP and report an infrastructure defect rather than paraphrasing. A paraphrased theorem cannot be digit-level checked."
    - "If a needed explicit constant has no traceable citation, STOP for that cell and record it as not_computable_without_citation. Do not proceed with an invented or assumed value."
    - "On exhausting wall_clock_seconds_per_run, record completed cells and mark the rest not_completed. A timeout is an infrastructure signal, never a negative result about any cell."

  invalidation_rules:
    - "Executing branch (b), or using any constant measured by EXP-JMV-003, invalidates the run (condition E1). EXP-JMV-003 is unapproved under DEC-20260726-002."
    - "Any use of an implied constant not traceable to a cited source invalidates the run. No constant may be invented or assumed to be 1 without saying so explicitly and reporting the effect of that choice on the sign of log(k/c)."
    - "Reporting one logarithm convention without the other invalidates the conclusion (condition E2)."
    - "Reporting a conclusion that flips between logarithm conventions or between degree conventions AS A RESULT, rather than as convention-dependent, invalidates the conclusion (condition E2)."
    - "Failing to state whether Phi_l is assumed precomputed invalidates the cost model (condition E4). A cost that silently assumes free precomputation is not a cost."
    - "Asserting claim_tier crypto, or any tier at all, on this experiment or on any record derived from it invalidates that record (condition E3). Zero instances are tested; the correct fields are type theoretical, proof_status derivation, proof_refs cost_model.md."
    - "Phrasing any numeric statement about q = 2^256 as a measurement on P-256, or on any curve, invalidates that statement (condition E3). The only permitted phrasing is an evaluation of the model at that parameter."
    - "Asserting that Corollary 1.2 is FALSE, rather than concretely UNPROVEN at the evaluated parameters under the stated model, invalidates the analysis."
    - "Any conclusion about vacuity or non-vacuity recorded before the C1 review has been completed by a reviewer who did not produce the transcription invalidates the analysis (condition C1)."
    - "Any statement that this result bears on GRH, on ECDLP hardness, on attack cost, or on the D1 / BAR-AMORT-D2 barriers invalidates the analysis (condition C2)."
    - "Reporting the EXP-JMV-005 toy sanity anchor as attempted, passing, or failing invalidates the run. That experiment is unapproved and the anchor does not exist."

  success_criterion: >-
    A complete (q, delta) grid under the branch-(a) proven bound, computed under BOTH logarithm
    conventions and BOTH per-step cost variants, giving the sign of log(k/c) per cell, the
    modelled overhead and its ratio to sqrt(n), and either a crossover bit size or an explicit
    statement that no crossover occurs inside the grid; PLUS an archived cost_model.md carrying
    the single stated degree convention with its written reconciliation to the transcribed
    Proposition 3.1 and Lemma 4.1, the full constants table with citations, and the explicit
    precomputation term or declared assumption; PLUS the verbatim archived transcription of the
    four source statements. A cell whose sign flips between conventions is a successful outcome
    reported as convention-dependent, not a failure.

  falsification_criterion: >-
    log(k/c) > 0 at every tested (q >= 2^128, delta >= 0.25) cell under both logarithm
    conventions and the cited constants, AND modelled reduction overhead < 2^-20 * sqrt(n) at
    every modelled size >= 128 bits. The paper's practical reading is then vindicated under the
    stated model and this line closes. Note the asymmetry deliberately preserved: a vacuous
    proven separation is a claim about a bound, never a claim that the reduction fails.

  required_artifacts:
    - experiments/EXP-JMV-004/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-JMV-004/runs/<RUN-ID>/raw.json
    - experiments/EXP-JMV-004/runs/<RUN-ID>/stderr.txt
    - "experiments/EXP-JMV-004/runs/<RUN-ID>/analysis.md  # carries a C1 STATUS: PENDING banner until the C1 review completes"
    - experiments/EXP-JMV-004/runs/<RUN-ID>/crossover.csv
    - "experiments/EXP-JMV-004/runs/<RUN-ID>/cost_model.md  # the proof_refs target: stated degree convention + written reconciliation to Prop 3.1 and Lemma 4.1 (E2), explicit precomputation term or declared assumption with storage figures (E4), cost unit, and GRH conditionality"
    - "experiments/EXP-JMV-004/runs/<RUN-ID>/constants_table.csv  # every implied constant with source, statement number, and hypotheses (CTRL-CONSTANT-PROVENANCE)"
    - "experiments/EXP-JMV-004/runs/<RUN-ID>/source_statements.md  # C1: verbatim Theorem 1.1, Corollary 1.2, Proposition 3.1 inequality, Lemma 4.1 bound and normalization, with version/section/equation numbers, provenance, and an explicit UNCHECKED-AGAINST-SOURCE banner"
  manifest_requirements:
    - "inference block recording requested_policy from the handoff, the resolved model, and fallback_used per CLAUDE.md."
    - "Exact software versions and arbitrary-precision settings; any floating-point use declared with its precision, since the headline quantity is a SIGN near zero."
    - "Explicit statement that seeds are not applicable and why."
    - "Explicit statement that branch (b) was not executed and that no EXP-JMV-003 value was consumed."

  notes:
    - "This is the cheapest item in the suite with no dependencies, and DEC-20260726-001 sequences it FIRST, before EXP-JMV-001. The two must not be run concurrently in one worktree."
    - "Version 1's claim that this is the 'highest insight per unit of compute in the suite' is retained as a sequencing rationale only. It is not a claim about the result and must not appear in any run artifact as one."
    - "Everything version 2 adds is a TIGHTENING - the tier is lowered, branch (b) is closed, controls and required artifacts are added, and permitted conclusions are narrowed - recorded BEFORE any run under this experiment exists. No success criterion has been relaxed and none has been changed after observing a run outcome, because there is no run outcome. Any future loosening requires a versioned protocol_amendment."
    - "The sign of log(k/c) is a near-zero quantity by construction. Treat exact rational or high-precision arithmetic as mandatory and report the precision; a sign obtained from double-precision floating point at a cell where |log(k/c)| is small is not a result."
    - "Independent review reserved per DEC-20260726-001: a C1 reviewer who did not produce the transcription, before any evidence review. Per AGENTS.md core rule 12 a claimed vacuity of a published corollary requires independent review-xhigh review by an agent that did not originate the claim."
