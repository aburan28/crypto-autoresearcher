validation_report:
  id: VAL-20260907-b0832b
  task_id: null
  task_id_note: >-
    No TASK-YYYYMMDD-NNN handoff envelope was supplied with this assignment;
    it was delivered as a direct instruction naming the frozen contract
    (experiments/EXP-JMV-004/specification.yaml) and the specific control to
    execute (Control C1, digit-level check of the four/five transcribed
    source statements in RUN-JMV-004-a/source_statements.md). Flagged as a
    record-trail gap, not a defect of EXP-JMV-004 itself.
  experiment_id: EXP-JMV-004
  hypothesis_id: H-JMV-002
  question_id: RQ-JMV-001
  scope_note: >-
    THIS REPORT COVERS ONLY CONTROL C1 (SOURCE-TRANSCRIPTION CONTROL) as
    specification.yaml defines it: a digit-level check of Theorem 1.1,
    Corollary 1.2, Section 4.3's split-prime generator count, Lemma 4.1's
    eigenvalue bound and normalization, and Proposition 3.1's walk-length
    inequality, as archived in source_statements.md, against
    arXiv:math/0411378v3 itself. Per the task's own "what this review does
    NOT do" instruction and specification.yaml's what_is_and_is_not_blocked
    clause, this report draws NO conclusion about the sign of log(k/c) at any
    (q, delta) cell, about whether a crossover exists, or about whether
    Corollary 1.2 is concretely proven or vacuous at any evaluated size. It
    is not a review of RUN-JMV-004-a's run-integrity as a package (command,
    environment, full manifest audit) beyond what is needed to establish the
    snapshot facts below.
  run_ids:
    - RUN-JMV-004-a

  independence_note: >-
    I did not produce source_statements.md, cost_model.md, compute_grid.py,
    analysis.md, or any other artifact under experiments/EXP-JMV-004/. This
    session's retrieval of arXiv:math/0411378v3 into
    inputs/JMV-0411378-20260907/ was performed by the Coordinator in a prior
    session (commit 8d737b3e0), for a different experiment (EXP-JMV-001); I
    treat its provenance.json narrative as a claim to be independently
    re-checked (I re-verified the PDF's sha256 myself), and for every one of
    the five items below I read the actual PDF page image myself with the
    Read tool's page-rendering support, transcribing the exact wording I saw,
    before comparing it to source_statements.md's held text. I used the
    plain-text and layout .txt extractions only to LOCATE which PDF page
    number to render, never as the authority for the exact wording of any
    load-bearing formula, exponent, or constant (which I read off the
    rendered page image itself in every case below).

  snapshot_verification:
    - check: cited_commits_exist_and_are_ancestors_of_current_HEAD
      result: pass
      detail: >-
        HEAD = cf25a36a0cd7764d4e48e079889f2919715f5971 (merge commit,
        `git rev-parse HEAD`). `git merge-base --is-ancestor 8d737b3e0 HEAD`
        succeeds; that commit's own message is "research(EXP-JMV-001):
        retrieve and archive arXiv:math/0411378v3, resolving Control C1's
        source-unavailability blocker" and it is the commit that added
        inputs/JMV-0411378-20260907/. `git log --oneline -1 -- experiments/
        EXP-JMV-004/specification.yaml` = 53aac6d88 (re-approval enactment)
        and `git log --oneline -1 -- experiments/EXP-JMV-004/runs/
        RUN-JMV-004-a/source_statements.md` = 578f0a747 (run archival); both
        are reachable from HEAD by construction of `git log` on the checked-
        out branch.
    - check: working_tree_matches_HEAD_for_the_paths_this_review_reads
      result: pass
      detail: >-
        `git diff HEAD --stat -- experiments/EXP-JMV-004/
        inputs/JMV-0411378-20260907/` is empty. `git status --short` shows
        only one untracked, unrelated file
        (experiments/EXP-JMV-001/reviews/RT-20260907-4a1432.yaml) which this
        review does not read or depend on. This is a Coordinator-committed
