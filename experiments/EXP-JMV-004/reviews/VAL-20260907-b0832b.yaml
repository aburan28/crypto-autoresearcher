  overall_finding: >-
    Control C1 is now satisfied by an independent reviewer who did not
    produce the held transcription, using the actual retrieved and
    sha256-pinned arXiv:math/0411378v3 PDF, with a genuine digit-level check
    of every constant, exponent, and normalization factor in all five
    transcribed statements (not a reading for sense). Four of the five
    checks are clean: Theorem 1.1 matches exactly, and is in fact stated
    even more conservatively by the held transcription than the source
    requires (the paper's own proof of Theorem 1.1 literally sets
    p(x) = x^{2+delta}, not merely "a" polynomial consistent with it);
    Corollary 1.2's held completeness gap is confirmed genuine -- the
    source itself never states it as a clean equation, in either its first
    statement or its restated proof; Lemma 4.1 matches exactly on its
    exponent, normalization, and the "absolute, never pinned" status of its
    implied constant, with a minor citation-label nuance (|D|<=4q is
    recalled in the Proof of Theorem 1.1, not literally inside Lemma 4.1's
    own hypothesis, though the inequality itself and its use are
    source-accurate); Proposition 3.1 matches exactly, symbol for symbol,
    on the inequality direction and the exact logged quantity
    2h/|S|^{1/2}. The fifth item, Section 4.3's k-formula, is a PARTIAL
    match: its numeric value (k ~ pi(m)/2) is asymptotically consistent
    with the source's own formula (lambda_triv ~ pi(m)/e ~ m/(e log m))
    across every cell this run's grid actually evaluates, because this
    run's own |D|=4q convention always satisfies the source's stated
    condition for the unit count e to equal 2 -- but the held
    transcription's stated MECHANISM for the /2 ("a split prime contributes
    one generator") is the opposite of what the source's own text says (a
    split prime contributes TWO ideals of norm p; the /2 comes from
    dividing by the unit count e, not from "one generator per prime"), and
    the source's own constant "e" appears nowhere in source_statements.md
    or constants_table.csv. This is a genuine transcription/reconciliation
    inaccuracy, distinct in kind from a published-source error: it is on
    this program's own transcription side, not the paper's side, though it
    happens to be numerically inert for every parameter this run evaluates.
    It should be corrected in a follow-up amendment to source_statements.md
    and cost_model.md's Section 4.3/E2 entries, and "e" should be added to
    constants_table.csv as an explicit, cited, traceable constant.

