    - check: pdf_sha256_pin_matches_bytes_on_disk
      result: pass
      detail: >-
        `sha256sum inputs/JMV-0411378-20260907/sources/jmv-math-0411378v3.pdf`
        = c80586caaa2e4129b250d612b9f257cc1156cc839f2a17d791eb77ebfb5ab54e,
        byte-identical to the adjacent .pdf.sha256 file and to
        provenance.json's recorded sha256. Verified fresh in this session,
        not assumed from the provenance file's own claim.

  transcribed_statement_checks:
    - item: "Theorem 1.1 (m-formula)"
      held_transcription: >-
        "m = (log q)^(2+delta)" attributed to the weaker existential reading
        "m = p(log q) for some polynomial p", per
        source_statements.md's own disclosure that the specific family
        swept in this run is "a modelling choice consistent with, but not
        identical to, the literal content attributed to Theorem 1.1."
      source_location: "arXiv:math/0411378v3, page 3 (printed folio '3'), Section 1, statement 'Theorem 1.1.'"
      exact_source_wording: >-
        "Theorem 1.1. (Assuming GRH) There exists a polynomial p(x),
        independent of N and q, such that for m = p(log q) the isogeny
        graph G on each level is an expander graph, in the sense that any
        random walk on G will reach a subset of size h with probability at
        least h/(2|G|) after polylog(q) steps (where the implicit
        polynomial is again independent of N and q)."
      comparison: >-
        MATCHES. The Theorem's own statement is exactly the existential
        form the held transcription attributes to it -- "there exists a
        polynomial p(x)... such that for m=p(log q)..." -- not a specific
        polynomial. Separately, I found (page 15, "Section 4.3" -- see
        below -- and page 16, Proof of Theorem 1.1) that the paper's OWN
        proof of Theorem 1.1 sets "p(x) = x^{2+delta}, where delta > 0 is
        fixed" verbatim, i.e. m = (log q)^{2+delta} is not merely "a
        modelling choice consistent with" the theorem -- it is literally
        the one polynomial family the paper's own proof uses. The held
        transcription's phrasing is therefore accurate but slightly more
        hedged than the source strictly requires; this is not a defect
        (understating fidelity is not a transcription error), and I flag
        it only because the task asked me to check this attribution
        closely.
      one_off_notational_note: >-
        Not a transcription defect, but worth recording: Theorem 1.1's own
        statement uses "h" for the SIZE OF THE TARGET SUBSET reached by the
        random walk ("reach a subset of size h ... probability at least
        h/(2|G|)"), whereas Proposition 3.1 (see below) and the rest of the
        paper use "h" for the TOTAL number of graph vertices (the ideal
        class number). This is a one-off notational collision internal to
        the source itself (Theorem 1.1's local "h" corresponds to Prop
        3.1's "|S|", not to Prop 3.1's "h"), not an error introduced by
        this program's transcription.
      match: true

    - item: "Corollary 1.2 (verbatim form)"
      held_transcription: >-
        NOT held verbatim; only the narrative paraphrase "polylog(q) oracle
        queries" is held, disclosed explicitly as a completeness gap, not
        fabricated.
      source_location: "arXiv:math/0411378v3, page 3, Section 1, statement 'Corollary 1.2'"
      exact_source_wording: >-
        "Corollary 1.2 (Assuming GRH) The DLOG problem on elliptic curves
        is random reducible in the following sense: given any algorithm A
        that solves DLOG on some fixed positive proportion of curves in
        fixed level, one can probabilistically solve DLOG on any given
        curve in that same level with polylog(q) expected queries to A
        with random inputs."
      comparison: >-
        The source itself states Corollary 1.2 ONLY in prose -- there is no
        clean equation-level form anywhere in the paper for this statement
        (confirmed by reading the restated instance in the Proof of
        Corollary 1.2 on page 16 as well: "The Theorem shows that a random
        walk from any fixed curve E probabilistically reaches the
        proportion where the algorithm A succeeds, in at most polylog(q)
        steps... This provides the random polynomial time reduction of
        DLOG along successive curves in the random walk" -- also prose,
        also no equation). The held transcription's paraphrase "polylog(q)
        oracle queries" is a fair gloss of "polylog(q) expected queries to
        A" (A is exactly the kind of algorithm being treated as an oracle).
        Per this task's own instruction, I did not supply a verbatim
        equation-level form myself, because none exists in the source to
        supply: the completeness gap disclosed in source_statements.md is
        genuine, not an artifact of incomplete search on my part.
      match: "no verbatim equation exists in the source to check against; the held prose paraphrase is faithful to the source's own prose statement."

    - item: "Section 4.3 -- split-prime generator count / k = lambda_triv"
      held_transcription: >-
        "k = lambda_triv ~ #{split p <= m} ~ pi(m)/2 [Sec 4.3]", justified
        in source_statements.md and (I additionally checked)
        cost_model.md's E2 written reconciliation as: "a split prime
        contributes ONE generator to the set S, so the count of usable
        split primes <= m is approximately half the count of all primes
        <= m (the other half being inert or ramified primes ... which do
        not contribute a generator under this reading)."
      source_location: >-
        arXiv:math/0411378v3, page 15, Section "4.3 Eigenvalue Separation
        under the Generalized Riemann Hypothesis" (confirmed as the correct
        section number and title by direct page image), plus the
        definition of "e" on page 13-14, Section 4.2.
      exact_source_wording: >-
        Page 15: "The graphs with adjacency matrices {M(p) | p <= m} above
        share common eigenfunctions (the characters chi of Cl(O)), and so
        their eigenvalues are lambda_chi = (1/e) sum_{p<=m} a_p(chi) =
        (1/e) sum_{p<=m} sum_{integral ideals a subset K, Na=p} chi(a).
        (4.4)  When chi is the trivial character, lambda_triv equals the
        degree of the regular graph G. Since roughly half of rational
        primes p split in K, AND THOSE WHICH DO SPLIT INTO TWO IDEALS OF
        NORM p, lambda_triv is roughly pi(m)/e ~ m/(e log m) by the prime
        number theorem." Page 13-14 (equation 4.1's context): "where e is
        the number of units in O (which always equals 2 for disc(O) > 4)."
      comparison: >-
        PARTIAL MATCH -- genuine transcription-fidelity discrepancy found,
        with no numeric impact on this run's own evaluated grid (see
        below). Section attribution ("Sec 4.3") is correct: page 15 is
        headed exactly "4.3 Eigenvalue Separation under the Generalized
        Riemann Hypothesis" and this is where lambda_triv's asymptotic is
        derived. However: (1) the source's own formula is
        "lambda_triv ~ pi(m)/e ~ m/(e log m)", built on the constant "e"
        (the number of units in the quadratic order O), NOT on a bare "/2"
        -- the symbol "e" does not appear anywhere in source_statements.md,
        cost_model.md, or constants_table.csv (checked all three by grep);
        (2) the source's own stated MECHANISM for the eventual "/2" is the
        OPPOSITE of what cost_model.md's E2 written reconciliation claims:
        the source says a split prime contributes TWO ideals of norm p
        (not one) to the sum in (4.4), and it is dividing that resulting
        ~pi(m)-sized sum by e (generically 2, the unit count) that produces
        the final ~pi(m)/2 -- not "a split prime contributes one generator,
        so half the primes are excluded" as cost_model.md's reconciliation
        states. The two derivations happen to coincide numerically ONLY
        because e=2 in the generic case (disc(O) > 4, i.e. D not in
        {-3,-4}); this run's own convention uses |D| = 4q as equality for
        every q in its grid (q >= 2^64), so disc(O) = -4q always satisfies
        |disc(O)| = 4q > 4, which IS exactly the source's own stated
        condition for e=2 -- so the numeric value pi(m)/2 used as this
        run's PRIMARY convention is asymptotically consistent with the
        source's own formula for every cell this run actually evaluates.
        What is NOT consistent is the stated derivation/justification text
        and the complete absence of the source's own constant "e" from the
        held transcription and from constants_table.csv's disclosed
        constants (contrast with Lemma 4.1's C, which IS disclosed as an
        explicit, swept, cited unpinned constant). Per
        CTRL-CONSTANT-PROVENANCE's own requirement that "every implied
        constant used is traceable to a cited source and recorded in a
        constants table," "e" is traceable (it is defined in this same
        paper, page 13-14) but is not recorded anywhere in this run's
        constants table.
      does_the_source_justify_one_generator_per_split_prime: >-
        NO. The source's own text says the opposite: "those which do split
        into two ideals of norm p" -- i.e. TWO generators per split prime,
        not one. The run's "one generator per split prime" framing
        (source_statements.md and cost_model.md's E2 reconciliation) is
        this program's own invented mechanism, not the source's stated
        reasoning, even though it produces the same asymptotic number in
        this run's own parameter regime via a different (and, per the
        source's own text, incorrect) route.
      match: false
      match_detail: >-
        The held FORMULA's numeric value (pi(m)/2) is asymptotically
        consistent with the source across this run's entire evaluated grid
        (q >= 2^64 bits in every cell, so e=2 always per the source's own
        stated condition). The held DERIVATION/justification and the
        omission of the source's own constant "e" do not match the source.
        This is not a source-side error (unlike a published-table anomaly)
        and it does not currently manifest as a wrong number for any cell
        this run evaluates, but it is a genuine transcription/reconciliation
        inaccuracy that should be corrected: source_statements.md and
        cost_model.md's Section 4.3 / E2 entries should be rewritten to
        state the source's actual mechanism (two ideals per split prime,
        sum ~ pi(m), divided by the unit count e which is 2 whenever
        |D| > 4) and constants_table.csv should carry "e" as an explicit,
        cited, traceable constant rather than leaving it invisibly folded
        into a bare "/2".

    - item: "Lemma 4.1 -- eigenvalue bound and normalization"
      held_transcription: >-
        "c = C * m^(1/2) * log|mD|, |D| <= 4q [Lemma 4.1]", with C held as
        an unpinned "absolute" implied constant, deliberately swept over
        {0.5,1,2,4,8} rather than assumed to be 1, and |D| <= 4q used as
        equality (|D| = 4q) as the conservative reading.
      source_location: "arXiv:math/0411378v3, page 16, statement 'Lemma 4.1'; the '|D| <= 4q' fact is recalled on the same page in the Proof of Theorem 1.1, immediately after Lemma 4.1's statement."
      exact_source_wording: >-
        "Lemma 4.1 Let D < 0 and let O be the quadratic order of
        discriminant D. If chi is a nontrivial ideal class character of O,
        then the Generalized Riemann Hypothesis for L(s, chi) implies that
        the sum (4.4) is bounded by O(m^{1/2} log|mD|) with an absolute
        implied constant." Immediately below, in "Proof (of Theorem 1.1)":
        "Recall that |D| <= 4q and lambda_triv ~ m/(e log m)."
      comparison: >-
        MATCHES EXACTLY on every load-bearing symbol: exponent 1/2 on m,
        the log|mD| normalization, and the inequality direction of the
        big-O bound all match digit-for-digit / symbol-for-symbol. "With
        an absolute implied constant" is a direct, verbatim confirmation
        that the paper states only that the constant is absolute and NEVER
        gives it a numeric value -- this directly supports the held
        transcription's decision to sweep C rather than pin it to any
        single value, including 1. One attribution nuance, not a numeric
        defect: "|D| <= 4q" is not literally part of Lemma 4.1's own
        hypothesis (the Lemma as stated only requires D < 0, with no
        q-dependence); it is a separate fact recalled in the Proof of
        Theorem 1.1 immediately after Lemma 4.1 is invoked, derived
        elsewhere in the paper (Section 2, page 4: the characteristic
        polynomial's discriminant relation Trace(E)^2 - 4q = disc(Z[pi]) =
        c_pi^2 d_K, combined with the Hasse bound). The held transcription
        tags this fact "[Lemma 4.1]" as if it were part of the Lemma's own
        statement; it is instead a fact used ALONGSIDE Lemma 4.1 in exactly
        the combination this run's model performs -- the inequality itself
        is correctly stated and correctly used, only the citation label is
        slightly loose.
      match: true
      match_caveat: >-
        "|D| <= 4q" is source-accurate as an inequality but is drawn from
        the Proof of Theorem 1.1's recollection of a background fact, not
        from Lemma 4.1's own hypothesis. Recorded for completeness, not
        treated as a numeric or sign-relevant defect.

    - item: "Proposition 3.1 -- walk-length inequality"
      held_transcription: >-
        "r >= log(2h/|S|^(1/2)) / log(k/c)", with the order-of-magnitude
        note "h ~ sqrt(|D|) ~ sqrt(q) [class number, order of magnitude]"
        held separately and explicitly NOT attributed to a specific
        numbered source statement.
      source_location: "arXiv:math/0411378v3, page 12, statement 'Proposition 3.1'"
      exact_source_wording: >-
        "Proposition 3.1 Let G be a regular graph of degree k on h
        vertices. Suppose that the eigenvalue lambda of any nonconstant
        eigenvector satisfies the bound |lambda| <= c for some c < k. Let
        S be any subset of the vertices of G, and x be any vertex in G.
        Then a random walk of any length at least
        [log(2h/|S|^{1/2})] / [log k/c] starting from x will land in S
        with probability at least |S|/(2h) = |S|/(2|G|)."
      comparison: >-
        MATCHES EXACTLY. Inequality direction ("a random walk of any
        length AT LEAST ..." = ">="), the exact quantity inside the
        logarithm's numerator (2h/|S|^{1/2}), and the denominator
        (log k/c, i.e. log(k/c)) are all identical, symbol for symbol, to
        the held transcription. The paper leaves S completely generic
        ("any subset of the vertices"); it never gives |S| a formula as a
        fraction of h, confirming source_statements.md's own disclosure
        that its "eps" parameter (|S| = eps*h) is a DECLARED, not
        paper-sourced, parameter. "h ~ sqrt(|D|) ~ sqrt(q)" does not appear
        anywhere in the source in this or any equivalent form (grepped the
        full extracted text for "class number", "h ~", "sqrt(|D|)" and
        found only the bare definition of h as "the ideal class number of
        the order O" on page 13, no explicit asymptotic formula) -- but
        the held transcription itself already labels this as an
        "order of magnitude" note rather than a specific source citation,
        so this is not a mismatch against a claimed source statement, only
        confirmation that the held hedging is honest and necessary.
      match: true

  metric_recomputations:
    - metric: "page-number location of each of the five items, from the .txt/-layout.txt line numbers given in the task"
      method: >-
        Split both jmv-math-0411378v3.txt and jmv-math-0411378v3-layout.txt
        on form-feed characters (26 form-feed-delimited body pages plus a
        leading title page = 27 segments) and computed which segment each
        cited line number fell in, in a fresh Python process in this
        session's scratchpad. This was used only to choose which PDF page
        range to render as an image; every load-bearing formula, exponent,
        and constant quoted in this report was read directly off the
        rendered page image, never off the .txt extraction.
      result: >-
        Theorem 1.1 / Corollary 1.2 -> printed page 3 (confirmed by the
        page-3 image, footer numeral "3"). Proposition 3.1 -> printed page
        12 (footer "12"; page 11 is the Section 3 introduction leading up
        to it). Section 4.3 header and the lambda_triv formula -> printed
        page 15 (footer "15"). Lemma 4.1, |D|<=4q, and the two restated
        proofs -> printed page 16 (footer "16"). All four locations were
        confirmed by directly reading the rendered PDF page, not inferred
        from the line-count computation alone.
    - metric: "grep for the constant 'e' (Section 4.2/4.3's unit-count) anywhere in this run's own disclosed constants"
      method: >-
        `grep -n -i "unit\|number of units" constants_table.csv` and
        `grep -n -i "unit\|number of units" cost_model.md`, run fresh in
        this session against the committed run artifacts.
      result: >-
        Zero matches in either file. cost_model.md's own E2 written
        reconciliation (section 1, "Degree convention") explains the /2
        via "a split prime contributes ONE generator," with no mention of
        the source's actual constant e or its value. Quoted above under
        the Section 4.3 item.

  control_checks:
    - id: C1
      name: SOURCE-TRANSCRIPTION CONTROL
      status_before_this_review: >-
        "NOT SATISFIED. No agent in this program has read
        arXiv:math/0411378v3. The paper is not in the corpus."
        (specification.yaml's status_at_approval, unchanged since version 2
        approval.)
      result: this review constitutes an independent digit-level completion of C1.
      detail: >-
        Performed by a reviewer (myself) who did not produce
        source_statements.md, cost_model.md, or compute_grid.py, against the
        actual retrieved and sha256-pinned PDF, reading every one of the
        five required source locations as a rendered page image before
        recording any comparison. Outcome, per statement: Theorem 1.1
        matches exactly (existential form confirmed verbatim); Corollary
        1.2's completeness gap is confirmed genuine (the source itself
        never states it as an equation); Lemma 4.1 matches exactly on every
        exponent and normalization, with a minor citation-label nuance on
        |D|<=4q's attribution; Proposition 3.1 matches exactly, digit for
        digit, on the inequality direction and the exact logged quantity;
        Section 4.3's k-formula's NUMERIC VALUE is asymptotically
        consistent with the source for every cell this run's grid actually
        evaluates, but its stated DERIVATION and the omission of the
        source's own constant "e" do not match the source and should be
        corrected in source_statements.md and cost_model.md.
      per_coordinators_note: >-
        The coordinator_note_added_in_version_2 demanded "a DIGIT-LEVEL
        check of every constant, exponent, and normalization factor in the
        four transcribed statements, not a reading for sense." That is what
        this review performed, and it is precisely this kind of check that
        surfaced the Section 4.3 discrepancy above: a reading for sense
        would have accepted cost_model.md's "one generator per split prime"
        story as plausible (it is plausible-SOUNDING) without noticing that
        the source's own text says the opposite mechanism and names a
        different constant ("e") than the one silently assumed ("2").
    - id: CTRL-CONSTANT-PROVENANCE-OBSERVATION
      name: "Incidental observation while checking C1 (not this report's control to certify)"
      result: observation, not a verdict on this control
      detail: >-
        specification.yaml's own CTRL-CONSTANT-PROVENANCE requires "every
        implied constant used is traceable to a cited source and recorded
        in a constants table with source, statement number, and the
        hypotheses under which it holds. No constant is invented, and no
        constant is silently set to 1." The constant "e" (page 13-14's
        "number of units in O") is used, implicitly, as the value 2 inside
        this run's PRIMARY k-formula, but does not appear in
        constants_table.csv at all -- not as "e", not as "unit count", and
        not under any other name I could find by grep. This is not "set to
        1" (it is silently set to 2, which happens to be correct for every
        cell in this run's own grid), so it is a narrower gap than the
        rule's literal "silently set to 1" language, but it is the same
        failure mode the rule exists to prevent. I record this as an
        observation for the Coordinator's attention; a full audit of
        CTRL-CONSTANT-PROVENANCE compliance across the whole run package is
        outside this C1-scoped review's remit.

  heuristic_validation_checks: []
  heuristic_validation_checks_note: >-
    Not applicable. EXP-JMV-004 is a zero-instance analytic derivation over
    a deterministic cost model, not a distribution-level heuristic
    validation against a pre-registered theoretical CDF in the
    docs/target-result-profile.md sense.

  cost_model_checks: []
  cost_model_checks_note: >-
    Out of scope for this C1-scoped review by the task's own explicit
    instruction ("Do NOT compute, re-derive, or comment on whether
    log(k/c) is positive or negative at any (q, delta) cell"). The one
    cost-model-adjacent fact recorded above (the missing "e" constant in
    constants_table.csv) was found incidentally while checking source
    fidelity and is reported as an observation, not as a completed
    cost-model audit.

  proof_architecture_checks: []
  proof_architecture_checks_note: >-
    Not applicable. EXP-JMV-004 is a cost-model derivation over a
    previously published theorem/corollary, not a new proof-oriented
    proposal under docs/inventor-protocol.md section 8 / KN-TECH-080; it
    makes no new theorem, asymptotic-bound, or reduction claim of its own.

  claim_boundary_check:
    result: pass
    detail: >-
      This report makes no statement about the sign of log(k/c) at any
      (q, delta) cell, about whether a crossover exists, about whether
      Corollary 1.2 is concretely proven or vacuous at 2^256, about ECDLP
      difficulty, or about GRH's truth. It does not attach to
      GOAL-ECDLP-001 or GOAL-CRYPTO-001. Every claim above is scoped to (a)
      the exact wording of five specific statements in
      arXiv:math/0411378v3 as I read them on the retrieved, sha256-pinned
      PDF, and (b) whether source_statements.md's held transcription of
      those statements matches that wording. Per this task's own
      instruction, I use "matches" / "does not match" only to describe
      transcription fidelity, and I do not use "verified," "confirmed," or
      "finding" to describe any conclusion about the paper's correctness or
      about this experiment's own vacuity question.

  limitations:
    - >-
      This report does not perform a full run-integrity audit of
      RUN-JMV-004-a as a package (manifest completeness, environment,
      arbitrary-precision settings, the full 400-cell crossover.csv
      recomputation). It reads only what is needed to establish the
      snapshot facts above and to locate/quote the five source statements.
      A separate run-integrity reviewer role is contemplated by this
      program's discipline and is not this report.
    - >-
      I did not independently re-derive the number-theoretic content
      behind Section 4.3's formula (e.g., re-proving that roughly half of
      primes split in K, or re-deriving equation (4.4) from the theta-series
      construction on pages 13-14). My comparison is a textual/symbolic
      fidelity check of what the source states, not an independent proof
      audit of the source's own mathematics, which is standard, cited
      analytic number theory (Hecke theta-functions, GRH-conditional prime
      counting) I have not re-derived from first principles.
    - >-
      The Section 4.3 finding's "no numeric impact on this run's grid"
      claim rests on the fact that this run's own convention uses
      |D| = 4q as equality for every q in {64,...,512} bits, which always
      satisfies the source's own stated threshold (disc(O) > 4 in absolute
