  branch: "a"
  specification_version: 2
  handoff_id: TASK-20260906-a29dee
  authorized_by: DEC-20260906-27fa94
  authorized_by_note: >-
    The ONLY citation used as this run's approval basis. DEC-20260726-001
    (specification.yaml's own approved_under field) is NOT cited as
    authorization anywhere in this run's artifacts; it is documented as a
    fabricated citation by CORR-20260906-a6a296 and by
    DEC-20260906-27fa94's own context section.
  goal_id: null
  question_id: RQ-JMV-001
  hypothesis_id: H-JMV-002
  branch_b_and_exp_jmv_003_status: >-
