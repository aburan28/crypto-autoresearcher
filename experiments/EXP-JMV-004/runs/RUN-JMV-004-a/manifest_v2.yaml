    measured value). Confirmed by direct inspection of compute_grid.py: no
    import, file read, or constant reference touches
    experiments/EXP-JMV-003/ anywhere in this run directory's code.

  # ===========================================================================
  # GENERIC RUN-SCHEMA REQUIRED FIELDS (added here; absent by name, though not
  # in substance, from the original manifest.yaml -- see supersession_note)
  # ===========================================================================
  status: completed_valid
  status_note: >-
    No failure, timeout, or infrastructure defect is recorded anywhere in
    this run's artifacts (analysis.md, execution report, protocol_deviations
    below); every required_artifact for this run was produced and is
    self-consistent (re-verified independently by the completing Executor
    session and again by the Coordinator session that archived this run --
    see manifest.yaml's DEV-3 and this repository's commit 578f0a747
    message). "completed_valid" reflects that, not a new finding.

  code:
    commit: 54aa83b92c16104aeed9356d5e055033ad7f99ce
    command: >-
      cd experiments/EXP-JMV-004/runs/RUN-JMV-004-a && python3
      compute_grid.py > stdout.log 2> stderr.txt
    dirty: true
    dirty_note: >-
      Copied verbatim from manifest.yaml's `git.dirty_tree_note`: working
      tree carried other agents' untracked work-in-progress directories
      (experiments/EXP-HZM-001/, experiments/EXP-PMA-001/,
      experiments/EXP-SEMAEV-002/, unrelated to this task) plus this run's
      own new, previously-untracked directory
      experiments/EXP-JMV-004/runs/RUN-JMV-004-a/. No tracked file was
      modified by this task; write_scope for this task was
      experiments/EXP-JMV-004/runs/ only.

  inputs:
    curve_id: null
    seed: null
    parameters:
      q_bit_sizes: [64, 96, 128, 160, 192, 224, 256, 320, 384, 512]
      delta_values: [0.25, 0.5, 1.0, 2.0]
      log_conventions: ["bits", "natural"]
      C_sweep: ["0.5", "1", "2", "4", "8"]
      degree_conventions_computed:
        - "split_half (k=Li(m)/2, PRIMARY per Sec 4.3 transcription)"
        - "split_full (k=Li(m), ALT, E2 sensitivity only)"
    inputs_note: >-
      Copied verbatim from manifest.yaml's `grid_coverage` block (the
      independent-variables grid this deterministic analytic evaluation
      sweeps; q enters only as a model parameter, no curve/instance is
      touched -- claim_tier: not_applicable, type: theoretical).
    seeds_applicable: false
    seeds_not_applicable_reason: >-
      Copied verbatim from manifest.yaml's `seeds` block: fully
      deterministic arithmetic evaluating closed-form expressions at
      declared parameters; no randomness anywhere in this run.

  timing:
    started_at: null
    started_at_note: >-
      Not separately recorded by manifest.yaml; only elapsed/wall-clock
      duration was captured (see wall_seconds below and stderr.txt/
      stderr.log's own "elapsed: 0.161s" line, the script's own internal
      timer -- distinct from the 0.306s external shell-timestamp figure
      manifest.yaml's budget block reports, which additionally covers
      process-startup overhead this internal timer excludes).
    finished_at: null
    wall_seconds: 0.306
    wall_seconds_source: >-
      manifest.yaml budget.actual_wall_clock_seconds_this_run
      ("compute_grid.py: 0.306s (measured via shell `date +%s.%N` around
      the process)"). The script's own internal timer (stderr.txt/
      stderr.log: "elapsed: 0.161s") measures only the grid-computation
      loop, excluding process startup; both figures are archived bytes,
      neither is a new measurement.

  result:
    metrics:
      total_cells_in_raw_json: 400
      indeterminate_at_precision_cells: 0
      log_convention_sign_flips: 16
      degree_convention_sign_flips: 37
    metrics_source: >-
      raw.json (grid_dims/cell_count/indeterminate_cells/
      log_convention_flips fields) and stderr.txt/stderr.log's own printed
      summary line, cross-checked identical.
    valid: true
    invalid_reason: null
    certificate:
      kind: none
      verified: true
      verifier: no-claim
      note: >-
        No discrete-log, relation, or key-recovery claim is made anywhere
        in this run (claim_tier: not_applicable, type: theoretical,
        proof_status: derivation, per condition E3 -- zero instances
        tested at any size). This is a deterministic closed-form model
        evaluation, not a measurement against real curve data.

  # ===========================================================================
  # EVERYTHING BELOW IS COPIED VERBATIM FROM THE ORIGINAL manifest.yaml
  # (no content changed; reproduced here so this superseding record is
  # self-contained per tools/validate_ledger.py's routing, which reads only
  # the superseding path once registered)
  # ===========================================================================
  claim_tier: not_applicable
  type: theoretical
  proof_status: derivation
  claim_tier_note: >-
    Per condition E3: zero instances tested at any size; this and every
    record derived from it carries type theoretical / proof_status
    derivation / claim_tier not_applicable, never crypto or any other tier.

  c1_status: PENDING
  c1_note: >-
    This run does NOT satisfy control C1 (source-transcription-fidelity
    gate). It archives the held transcription verbatim (source_statements.md)
    with an UNCHECKED-AGAINST-SOURCE banner and computes the model, the
    grids, and the constants table. No conclusion about vacuity/non-vacuity
    or about Corollary 1.2's status is drawn anywhere in this run's
    artifacts; that is gated on a separate, later C1 review by a reviewer
    who did not produce this transcription.

  git:
    commit: 54aa83b92c16104aeed9356d5e055033ad7f99ce
    dirty_tree: true
    dirty_tree_note: >-
      Working tree carries other agents' untracked work-in-progress
      directories (experiments/EXP-HZM-001/, experiments/EXP-PMA-001/,
      experiments/EXP-SEMAEV-002/, unrelated to this task) plus this run's
      own new, previously-untracked directory
      experiments/EXP-JMV-004/runs/RUN-JMV-004-a/. No tracked file was
      modified by this task. write_scope for this task is
      experiments/EXP-JMV-004/runs/ only; nothing outside it was written.

  environment:
    python_version: "3.11.15"
    platform: "Linux 6.18.44-fc-v24 x86_64"
    dependencies:
      mpmath: "1.3.0"
    arbitrary_precision_settings:
      library: mpmath
      mp.dps: 60
      note: >-
        60 decimal digits of working precision used throughout
        compute_grid.py for every mpmath.mpf / mpmath.li evaluation. The
        headline quantity (sign of log(k/c)) is the sign of (ratio - 1) at
        this precision. A cell is flagged INDETERMINATE_AT_PRECISION if
        |log(k/c)| < 1e-40 (20 orders of magnitude above the ~1e-60 floor of
        the working precision); zero cells were flagged in this run (see
        raw.json "indeterminate_cells": []).
      floating_point_use: >-
        NONE for the sign-determining arithmetic (all done via mpmath.mpf at
        60 dps). Native Python floats appear ONLY in the reproducibility
        helper make_csvs.py / the ad-hoc inspection commands used to
        summarize crossover_summary.csv (float(str(mpf)) conversions purely
        for human-readable log2 display of already-mpf-computed
        quantities); the sign and ratio values themselves in raw.json and
        crossover.csv are the mpf-precision values (stored as 30-significant-
        digit decimal strings via mpmath.nstr).
    exact_rational_arithmetic_used: false
    exact_rational_arithmetic_note: >-
      Exact rational arithmetic was not used because the model itself
      involves transcendental quantities (the offset logarithmic integral
      Li(m), natural/base-2 logarithms, sqrt) that have no exact rational
      representation. High-precision arbitrary-precision arithmetic (mpmath,
      60 decimal digits) was used instead, per the constraint's "exact
      rational OR high-precision arithmetic" wording, with the precision
      stated here and re-affirmed per-cell via the indeterminate-cell check
      above.

  seeds:
    applicable: false
    reason: >-
      Fully deterministic arithmetic evaluating closed-form expressions at
      declared parameters. No randomness is used anywhere in this run
      (no sampling, no Monte Carlo, no stochastic search). Seed integrity is
      therefore not applicable, matching specification.yaml's own
      replication.seed_note.

  inference:
    requested_policy: executor-implementation
    resolved_model_id: claude-sonnet-5
    resolved_model_id_note: Genuine self-report from this session's own runtime system context.
    fallback_used: false
    fallback_reason: null

  budget:
    cap_wall_clock_seconds_per_run: 600
    cap_memory_gb: 2
    cap_maximum_runs: 5
    actual_wall_clock_seconds_this_run: 0.31
    actual_wall_clock_seconds_note: >-
      compute_grid.py: 0.306s (measured via shell `date +%s.%N` around the
      process). make_csvs.py and the ad-hoc summary/inspection commands
      together added well under 1 additional second. No memory profiling
      tool (`/usr/bin/time -v`) was available in this environment (confirmed
      absent); peak memory was not instrument-measured, but the entire
      computation is a 400-cell closed-form arithmetic sweep at 60 decimal
      digits with no large data structures (raw.json is 476 KB), and is
      certain by construction to be far under the 2 GB cap. This is recorded
      as an observed instrumentation gap (infrastructure note), not a
      fabricated memory figure.
    runs_used_of_5: 1
    cpu_hours_consumed_this_task: "<0.001"
    completion_session_note: >-
      This single run (RUN-JMV-004-a, run 1 of the 5-run cap) was completed
      across two Executor sessions under the same handoff
      (TASK-20260906-a29dee), per DEV-3 above. The completing session's own
      compute cost was a single re-execution of compute_grid.py in an
      isolated scratch directory for verification purposes only (~0.09s
      wall clock, not counted against this run's budget since it did not
      write into write_scope) plus authorship of the three missing
      artifacts (no further model computation). Combined actual compute
      across both sessions for this run remains far under 600s wall clock,
      1 CPU-hour, and 2GB memory.

  grid_coverage:
    q_bit_sizes: [64, 96, 128, 160, 192, 224, 256, 320, 384, 512]
    delta_values: [0.25, 0.5, 1.0, 2.0]
    log_conventions: ["bits", "natural"]
    degree_conventions_computed: ["split_half (k=Li(m)/2, PRIMARY per Sec 4.3 transcription)", "split_full (k=Li(m), ALT, E2 sensitivity only)"]
    C_sweep: ["0.5", "1", "2", "4", "8"]
    per_step_variants: 6
    per_step_variants_note: >-
      3 algorithms (phi_l O(l^3) JMV Sec 4.1 -- PRIMARY/APPLICABLE per the
      frozen method; velu O(l) and sqrt_velu O(sqrt l) -- OPTIMISTIC/CAVEATED,
      reported in addition, per the held scouting precedent) x 2 l-choices
      (typical l ~ Theta(m); best-case l=2), matching independent_variables'
      "per-step cost variant" axis.
    total_cells_in_raw_json: 400
    total_cells_note: >-
      400 = 10 (q_bit_sizes) x 4 (delta_values) x 2 (log_conventions) x 5
      (C_sweep). Each cell's JSON record additionally carries BOTH degree
      conventions and, where the primary convention's ratio > 1, all 6
      per-step-variant costs -- so the full covered grid is a superset of
      the (q bit size, delta, log convention, per-step cost variant)
      independent_variables axes named in specification.yaml, with C and
      degree convention layered on as declared sensitivity axes (C is
      unpinned by the held source; degree convention is required to be
      checked for E2 sign-flip sensitivity even though only one is adopted
      as the stated convention).

  artifacts:
    - manifest.yaml
    - manifest_v2.yaml
    - raw.json
    - raw-result.json
    - stderr.txt
    - stderr.log
    - command.txt
    - environment.json
    - analysis.md
    - crossover.csv
    - cost_model.md
    - constants_table.csv
    - source_statements.md
    - compute_grid.py            # reproducibility helper, not a required_artifact
    - make_csvs.py               # reproducibility helper, not a required_artifact
    - crossover_summary.csv      # supplementary sensitivity table, not a required_artifact
    - stdout.log                 # raw stdout capture (empty; script prints to stderr only)

  protocol_deviations:
    - id: DEV-1-CorollaryStatementNotHeld
      severity: reported_not_blocking
      description: >-
        Per stopping_rules ("If any of the four required source statements
        cannot be archived verbatim as held, STOP and report an
        infrastructure defect rather than paraphrasing"): Corollary 1.2's
        own statement (the polylog(q) oracle-query bound itself) is NOT held
        verbatim anywhere in this repository's corpus. cost_model.py's
        docstring and research/JMV004_branch_a_scouting_20260726.md only
        reference it narratively ("Converts Corollary 1.2 (polylog(q)
        ORACLE QUERIES) into field operations" / "Corollary 1.2 gives
        polylog(q) oracle queries"), never as an equation-level statement
        with its own normalization. Theorem 1.1's m-formula, Proposition
        3.1's walk-length inequality, and Lemma 4.1's bound ARE held as
        compact transcribed formulas with statement-number tags and ARE
        archived verbatim (as held) in source_statements.md. This gap is
        recorded plainly in source_statements.md, per stopping_rules; no
        Corollary 1.2 statement is fabricated or paraphrased to fill it.
        This does not block the model/grid computation, which uses only the
        Theorem 1.1 / Sec 4.3 / Lemma 4.1 / Prop 3.1 quantities; it is
        reported as a completeness gap in the held transcription itself, to
        be surfaced to the (separate) C1 reviewer and, if warranted, the
        Coordinator as an amendment/repair candidate for the held
        transcription artifact.
    - id: DEV-2-InstrumentationGap
      severity: reported_not_blocking
      description: >-
        `/usr/bin/time -v` (intended for peak-memory measurement) is not
        installed in this execution environment. Wall-clock time was
        measured via shell timestamps instead; peak memory was not
        instrument-measured (see budget.actual_wall_clock_seconds_note
        above for why this is certain to be far under the 2 GB cap by
        construction, not merely assumed).
    - id: DEV-3-CompletionSessionAndSummaryScopeCaveat
      severity: reported_not_blocking
      description: >-
        This run was completed by a SECOND Executor session (same handoff
        TASK-20260906-a29dee) after a first session was interrupted
        mid-run by an account-wide HTTP 429 rate-limit on 2026-09-07
        (see the now-removed INCOMPLETE.md, whose text is preserved here:
        interruption ~03:38 UTC 2026-09-07, missing analysis.md,
        cost_model.md, source_statements.md at that point). The completing
        session independently re-verified the first session's
        manifest.yaml, compute_grid.py, raw.json, crossover.csv, and
        constants_table.csv before trusting them: re-executed
        compute_grid.py in an isolated scratch directory and diffed the
        resulting raw.json byte-for-byte against the committed one (only
        the non-deterministic `elapsed_seconds` field differed), and
        independently hand-recomputed one grid cell
        (bits=256, delta=1.0, convention=bits, C=1.0) at mp.dps=60 from
        first principles, matching the archived value exactly. On that
        basis compute_grid.py, raw.json, crossover.csv, and
        constants_table.csv were RETAINED AS-IS (not regenerated); only the
        three missing required artifacts (analysis.md, cost_model.md,
        source_statements.md) were newly authored by the completing
        session. Separately, the completing session found that the
        supplementary, non-required `crossover_summary.csv` (also
        inherited from the first session) computes its crossover-bit-size
        figures via a continuous delta sweep (step 0.05, range
        [0.05, 6.0]) that extends beyond the frozen grid's four declared
        `delta_values`, and that its generation script was not archived
        (produced by ad-hoc inspection commands per the first session's own
        note above). It is retained for supplementary context only; it is
        NOT used as the basis for this run's required crossover reporting,
        which instead uses a fresh, grid-faithful computation directly over
        `raw.json`/`crossover.csv` (see analysis.md section 5). This is
        recorded as a completeness/scope caveat, not an error requiring
        correction of the retained file.
    - id: DEV-4-SchemaCompletion
      severity: reported_not_blocking
      description: >-
        This top-level Coordinator session found, via
        `tools/validate_ledger.py`, that the original manifest.yaml (still
        immutable and unedited) does not use the generic run schema's
        expected top-level field names (status/code/inputs/timing/result;
        it used git/budget instead, with no explicit status or result
        block) and that four companion artifacts the generic schema expects
        by canonical name (command.txt, environment.json, stderr.log,
        raw-result.json) were not present under those exact names (the run
        used stderr.txt/raw.json, the names specification.yaml's own
        required_artifacts list literally specifies). This manifest_v2.yaml
        and its added companion files are an additive_schema_completion
        (tools/run_supersession_registry.yaml), deriving every added field
        and file from bytes already archived in manifest.yaml/raw.json/
        stderr.txt -- no experiment was rerun and no number changed.

  confirmations:
    branch_b_not_executed: true
    exp_jmv_003_not_touched: true
    no_vacuity_or_non_vacuity_conclusion_written: true
    c1_status_pending_banner_present_in_analysis_md: true
