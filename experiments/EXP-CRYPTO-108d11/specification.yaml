# EXP-CRYPTO-108d11
# Power-residue counts. No summation system.
# Approved by DEC-20261002-358fa3.
experiment:
  id: EXP-CRYPTO-108d11
  hypothesis_id: H-CRYPTO-35eac0
  source_idea: IDEA-20260921-ffd330
  question_id: RQ-CRYPTO-001
  version: 1
  title: Power-residue counts
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-358fa3
  objective: >-
    Count the power-residue cosets at two primes, separate the
    membership degree from the cover degree, and place the two
    written ceilings.
  inputs:
    p13: 13
    ell13: 3
    cubes: [1, 5, 8, 12]
    cosets_13: 3
    coset_size_13: 4
    membership_degree_13: 4
    cover_degree_13: 3
    degrees_equal_13: false
    p17: 17
    ell17: 4
    cosets_17: 4
    coset_size_17: 4
    membership_degree_17: 4
    cover_degree_17: 4
    degrees_equal_17: true
    genus_num: {3: 8, 5: 14, 7: 20, 2: 5}
    genus_even: {3: true, 5: true, 7: true, 2: false}
    ceiling_num: 8
    ceiling_den: 1024
    ceiling_below_100: true
    ceiling_above_78: true
    ceiling_below_79: true
    wide_num: 20
    wide_den: 128
    wide_below_160: true
    wide_above_156: true
    wide_below_157: true
  controls:
    - >-
      Equal degrees at p = 13 are false. The membership degree is
      4 and the cover degree is 3. Reporting them equal invalidates
      the run.
    - >-
      An integer genus at ell = 2 is false. The numerator is 5,
      which is odd. Reporting an integer genus invalidates the run.
    - >-
      A ceiling of at least 0.01 for 8/1024 is false. It is strictly
      below 0.01 and strictly above 0.0078. Reporting otherwise
      invalidates the run.
    - >-
      A ceiling of at least 0.16 for 20/128 is false. It is strictly
      below 0.16 and strictly above 0.156. Reporting otherwise
      invalidates the run.
    - >-
      A cube count other than 4 in F_13 is false. The cubes are
      1, 5, 8 and 12. Reporting another set invalidates the run.
    - Two residue routes. They must not import each other.
  independent_variables:
    - prime
    - route in {enumerate, index}
  metrics:
    primary:
      - membership_degree_13
      - cover_degree_13
      - cubes
      - implementations_agree
    secondary:
      - ceiling_sides
      - genus_even
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The degrees 4 and 3 at p = 13, and the cube set.
    formula: >-
      The image of the ell-power map on F_p-star has size
      (p-1)/gcd(ell, p-1). The membership degree is (p-1)/ell
      when ell divides p-1. The cover degree is ell. The genus
      numerator is 3 ell - 1. The ceilings are 8/1024 and 20/128.
    source: >-
      IDEA-20260921-ffd330 states the membership degree (p-1)/ell
      and the cover degree ell, and ceilings of about 1 percent
      and about 16 percent, read 2026-10-02. The cosets were
      enumerated in this design session. That enumeration is not
      a run. The two degrees at p = 13 are unequal. No summation
      system was solved.
  scale_relevance:
    tier: toy
    justification: Two prime fields and four numerators. No transfer to a yield.
    correspondence: null
  tail_checks:
    - The p = 17 row is required. Stopping after p = 13 and still reporting four cosets of size 4 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other residue route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the two degrees at p = 13 are reported equal, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two degrees at p = 13 are reported equal.
    - The genus numerator at ell = 2 is reported even.
    - 8/1024 is reported at least 0.01 or at most 0.0078.
    - 20/128 is reported at least 0.16 or at most 0.156.
    - The F_13 cubes are reported as a different set.
    - A summation system or a yield is reported.
  success_criterion: >-
    Both runs agree on the cubes 1, 5, 8 and 12, three cosets of
    size 4, membership degree 4 and cover degree 3 at p = 13, four
    cosets of size 4 at p = 17, genus numerators 8, 14, 20 and 5,
    and the ceiling sides. The two degrees at p = 13 stay unequal.
    The numerator 5 stays odd.
  falsification_criterion: >-
    The runs agree, the two degrees at p = 13 stay unequal, the
    numerator 5 stays odd, and any count differs from the
    preregistered table.
  required_artifacts:
    - experiments/EXP-CRYPTO-108d11/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CRYPTO-108d11/runs/<RUN-ID>/command.txt
    - experiments/EXP-CRYPTO-108d11/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CRYPTO-108d11/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CRYPTO-108d11/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CRYPTO-108d11/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any summation system, yield measurement, or curve point search.
    - A claim that a coset factor base helps or does not help.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
