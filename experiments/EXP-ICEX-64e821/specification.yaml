experiment:
  id: EXP-ICEX-64e821
  hypothesis_id: H-ICEX-5ff793
  derived_from_idea: IDEA-20260808-bfa0b9
  question_id: RQ-ICEX-001
  batch_id: BATCH-a70dc3
  version: 1
  title: >-
    Measure d_solve of the batched decomposition ideal by exact graded rank over
    a T ladder to 32, and decide between three FORCED and SEPARATED values of the
    finite difference Delta rather than between two overlapping fitted slopes-
    on a grid re-sized so that the batched system actually has at least eight
    solutions, with a curve-free random-generator arm whose agreement would
    remove every elliptic-curve reading of the result
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. Two cost models this corpus uses interchangeably
    disagree about how the solving degree of the batched decomposition ideal
    responds to the batch size T. M1 says d_solve grows like T^{1/(m+1)}; M2 says
    it grows affinely with slope exactly 1/2 per unit T. No corpus record holds
    evidence for either, and only a third response - d_solve flat in T - would
    permit multi-target amortisation of the decomposition oracle.

    (B) WHY THE SOURCE IDEA'S DISCRIMINATOR CANNOT FIRE, COMPUTED BEFORE ANY RUN.
    IDEA-20260808-bfa0b9 pre-registers a fitted exponent of d_solve in T and
    states that M1 predicts slope 1/(m+1) while M2 predicts slope 1, 'an exponent
    gap of at least a factor 3 at m = 2'. M2 IS AFFINE, NOT A POWER LAW. At the
    source's own cell m = 2, B = 6 with the Semaev total degree taken as 4, M2
    gives d_solve(1) = 7 and d_solve(16) = 14.5, so its EFFECTIVE log-log slope
    over T in [1,16] is ln(14.5/7)/ln 16 = 0.262 against M1's 0.333. The two
    bands overlap and the discriminator is degenerate by algebra, not by
    parameter choice.

    (C) THE COMPUTED REPLACEMENT. The decision statistic is
    Delta := [d_solve(T_max) - d_solve(1)] - (T_max - 1)/2, with T_max = 32.
    M2 forces Delta = 0 plus or minus 1, independent of m, B, D_S and the
    solution count, because M2's difference is exactly (T_max - 1)/2. The
    amortising response forces Delta = -15.5. M1 forces
    Delta = d_solve(1) * (32^{1/(m+1)} - 1) - 15.5, that is
    2.1748 * d_solve(1) - 15.5 at m = 2 and 1.3784 * d_solve(1) - 15.5 at m = 3,
    evaluated with the d_solve(1) MEASURED FIRST IN THE SAME CELL. The three
    branch values are separated by construction, and the separation is CHECKED
    per cell- a cell discriminates only if the M1 and M2 values differ by at
    least 3 degrees, i.e. only if d_solve(1) is at least
    18.5/(32^{1/(m+1)} - 1), which is 9 at m = 2 and 14 at m = 3.

    (D) THE GRID IS RE-SIZED BECAUSE THE DECLARED ONE HAS NO SOLUTIONS. Under
    this batch's frozen convention the batched system has about
    T * binomial(B+m-1,m)/p solutions, and M1's corank criterion cannot be
    exercised below about eight. At the source's declared grid the largest value
    over all cells is 1.90, at (m=3, B=8, p=1009, T=16); the smallest is 0.082.
    The primary grid is therefore p in {101, 211} with T to 32, which reaches at
    least eight solutions at (m=3, B=8, p=101, T at least 8),
    (m=3, B=6, p=101, T at least 16), (m=3, B=8, p=211, T at least 16) and
    (m=2, B=8, p=101, T at least 23). p in {1009, 4099} is retained only for the
    M2 and semi-regularity limbs, which do not depend on the solution count.
    Every cell below eight solutions is emitted with an UNDERPOWERED flag and the
    T that would reach eight, never with a narrowed claim.

    (E) THE CURVE-FREE ARM IS REQUIRED. M2's derivation is a Hilbert-series
    argument about a regular sequence of univariate generators in distinct
    variables; it mentions no elliptic curve. A curve-free object can therefore
    reproduce the whole signature, so the identical measurement is run with the
    Semaev generator replaced by a random dense polynomial of the same
    multidegree, and the consequence is pre-stated in falsification_criterion.
  inputs:
    cost_unit: >-
      d_solve IS A DEGREE- a dimensionless non-negative integer. Delta is a
      difference of degrees and is also a degree, dimensionless. Operation counts
      are FIELD OPERATIONS over F_p, dimensionless counts. Memory is BYTES.
      Wall clock is SECONDS. DEGREES ARE NEVER DIVIDED INTO SECONDS OR BYTES, and
      the batched-versus-separate ratio is field ops over field ops.
    unit_discipline: >-
      BINDING. Tags in {degree, field_ops, bytes, seconds, count, dimensionless}.
      Cross-tag arithmetic requires a named recorded conversion and none is used
      in this contract.
    frozen_operation_convention: >-
      SHARED WITH EXP-ICEX-e0c85b AND EXP-ICEX-60c93c, AND THIS CONTRACT IS THE
      ONE WHERE IT MATTERS MOST. Expected decompositions per uniform target is
      binomial(B+m-1,m)/N. The convention B^m/p, used in the source idea
      IDEA-20260808-bfa0b9, IS NOT USED- at B = 8, m = 3 it gives 512 against
      binomial(10,3) = 120, a factor 4.27, and at B = 6, m = 2 it gives 36
      against 21, a factor 1.71. Every solution-count number this contract emits
      is under the frozen convention and is tagged with the instance-set hash, so
      a disagreement with a sibling contract is decidable.
    instance_set_hash: >-
      TO BE EMITTED BY THE RUN, NOT PRE-FILLED. SHA-256 over the canonical
      serialisation of (arm, p, curve parameters, factor base V, arity m, target
      list R_1..R_T, seed) per cell, recorded in the manifest.
    semaev_degree_D_S: >-
      MEASURED, NOT ASSUMED. The total degree and the per-variable degrees of the
      constructed summation polynomial are read off the polynomial and recorded
      per cell. No branch value in this contract depends on D_S- that is one
      reason Delta was chosen over the fitted slope.
    d_solve_definition: >-
      The smallest degree d at which the exact graded rank of the Macaulay matrix
      of I_T attains the corank equal to the INDEPENDENTLY ENUMERATED solution
      count. The enumeration is over V^m and the T targets and never reads the
      solve.
  controls:
  - >-
    C1 T = 1 CALIBRATION, BLOCKING. The batched solve at T = 1 and the unbatched
    solve must agree EXACTLY on the recovered decomposition set and on the
    solution count. Field-operation counts may differ by the inert extra
    variable; that difference is recorded as the batching overhead and is never
    netted out.
  - >-
    C2 SOLUTION-COUNT RECONCILIATION, BLOCKING, PER CELL. The batched enumerated
    solution count must equal the sum over the T targets of their individually
    enumerated decomposition counts. A discrepancy voids the cell.
  - >-
    C3 CURVE-FREE NULL, REQUIRED, BLOCKING FOR INTERPRETATION. The identical
    measurement with S_{m+1} replaced by a random dense polynomial of the same
    multidegree in the same m+1 variables, keeping g_T and the membership
    generators. Consequence pre-stated in falsification_criterion.
  - >-
    C4 DUMMY-VARIABLE NULL. y adjoined with a random squarefree degree-T
    generator having NOTHING to do with the targets. If the degree response to T
    is the same, the effect is generator-degree-driven rather than target-driven.
  - >-
    C5 RANDOM AGAINST STRUCTURED TARGET SETS. Targets drawn uniformly (the honest
    arm) and targets drawn as an arithmetic progression in the x-coordinate (the
    artifact detector). Any amortisation present only in the structured arm is an
    artifact of that structure.
  - >-
    C6 DISTINCTNESS CHECK, BLOCKING. Targets must be pairwise distinct and g_T
    squarefree, checked before the ideal is formed. Repeated roots change g_T's
    degree and silently move every branch value.
  - >-
    C7 SEPARATION CHECK, PER CELL, PRE-INTERPRETATION. After d_solve(1) is
    measured, compute the three branch values of Delta and assert that the M1 and
    M2 values differ by at least 3 degrees. A cell failing this is emitted
    UNDERPOWERED with the required d_solve(1) and is NOT interpreted.
  - >-
    C8 T-OVER-p COVARIATE. Record T/p per cell and refuse any cell with
    T/p above 0.35, so that batching a large fraction of the group is excluded
    rather than hidden.
  - >-
    C9 RANK-PROFILE CONTROL. Record the full per-degree rank profile, not only
    d_solve, and compare it degree by degree against HA-1's predicted
    coefficients. The largest per-degree residual and the T at which it occurs
    are required metrics.
  independent_variables:
  - batch size T in {1, 2, 4, 8, 16, 32}
  - arity m in {2, 3}
  - factor base size B in {6, 8}
  - prime p in {101, 211} primary and {1009, 4099} secondary
  - arm in {Semaev, curve-free random dense generator, dummy-variable null}
  - target set in {random, structured arithmetic progression}
  metrics:
    primary:
    - >-
      d_solve(T) per cell, in DEGREES, by exact graded rank against the
      independently enumerated solution count.
    - >-
      Delta = [d_solve(32) - d_solve(1)] - 15.5, in degrees, per cell, per arm,
      with its three forced branch values computed from the measured d_solve(1).
    - >-
      the per-cell admissibility verdict- solution count at least 8, and M1-M2
      branch separation at least 3 degrees.
    secondary:
    - full per-degree rank profile against HA-1's predicted coefficients, per T
    - largest per-degree residual and the T at which it occurs
    - counted field operations for the batched solve and for T separate solves, and their ratio
    - Macaulay column count binomial(d_solve + m + 1, m + 1) and peak bytes per cell
    - measured Semaev total and per-variable degrees D_S per cell
    - T/p per cell
    - batched and per-target enumerated solution counts
  heuristic_under_test: HA-1
  preregistered_prediction:
    quantity: >-
      The finite difference Delta of the batched solving degree over the T
      ladder, and the per-degree rank profile.
    formula: >-
      'Delta := [d_solve(T_max) - d_solve(1)] - (T_max - 1)/2 at T_max = 32.
      FORCED BRANCH VALUES- M2 gives 0 plus or minus 1 for every m, B, D_S and
      solution count; the amortising response gives -15.5; M1 gives
      d_solve(1) * (32^{1/(m+1)} - 1) - 15.5, that is 2.1748 * d_solve(1) - 15.5
      at m = 2 and 1.3784 * d_solve(1) - 15.5 at m = 3. ADMISSIBILITY- the cell
      discriminates only if d_solve(1) is at least 18.5/(32^{1/(m+1)} - 1),
      i.e. at least 9 at m = 2 and at least 14 at m = 3, and only if the expected
      solution count T * binomial(B+m-1,m)/p is at least 8.'
    source: >-
      M2's branch is derived in H-ICEX-5ff793 from the source idea's own HA-1,
      whose rigorous half is that the membership and target generators are
      univariate in distinct variables and hence regular, so the box-convolution
      factor is exact. THE SOURCE IDEA'S OWN CITATION FOR THIS STEP, the label
      'E2-01', resolves to NO committed record anywhere in this repository -
      verified by repository-wide grep for TASK-20260904-f2b3db and stated
      independently in experiments/EXP-ICEX-c93308/specification.yaml - and is
      NOT relied on. M1's branch is the standard corank-threshold reading. The
      grid sizing uses knowledge/findings/KN-FIND-007.md, opened and read in full
      by TASK-20260904-f2b3db.
  scale_relevance:
    tier: toy
    justification: >-
      p at most 4099 and, in the primary grid, p in {101, 211}; m at most 3;
      B at most 8; T at most 32. The primary grid is smaller in p than the source
      idea declares, and that is FORCED by the solution-count computation, not
      chosen for convenience. Delta's M2 branch is scale-free; its M1 branch is
      calibrated on the same cell's measured d_solve(1), so both are internally
      anchored. NO transfer to cryptographic parameters is claimed.
    correspondence: null
  tail_checks:
  - >-
    Report the largest per-degree rank residual against HA-1's predicted
    coefficients and the T at which it occurs. A residual GROWING with T means a
    T-dependent departure from semi-regularity and is itself the amortisation
    signal, to be reported rather than absorbed.
  - >-
    Report the minimum and maximum d_solve over seeds within each cell. A cell
    whose Delta verdict flips across seeds is INCONCLUSIVE, not assigned to the
    majority branch.
  - >-
    Report the largest observed per-target decomposition count against the
    Poisson upper tail at mean binomial(B+m-1,m)/p; a heavy tail concentrates the
    solutions on few targets and changes what the corank threshold measures.
  replication:
    seeds: [5, 13, 29, 47, 67]
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 32
    maximum_memory_gb: 8
    maximum_runs: 300
    maximum_workers: 1
  stopping_rules:
  - >-
    Run C1, C2 and C6 first at every cell. A cell failing any of them is not run
    further.
  - >-
    Measure d_solve(1) before any larger T in a cell, then run C7. A cell failing
    the separation check is emitted UNDERPOWERED and not run at larger T.
  - >-
    Run T in ascending order and stop a cell when the Macaulay column count
    exceeds the memory cap, recording that T as MEMORY-CENSORED rather than as a
    result.
  - >-
    Run the arms in the order {curve-free, dummy-variable, Semaev} so that the
    nulls cannot be tuned after seeing the Semaev arm.
  - >-
    Run p = 101 and p = 211 before p = 1009 and p = 4099; the secondary primes
    are for the M2 and rank-profile limbs only.
  invalidation_rules:
  - The T = 1 calibration C1 fails at any cell; that cell and every T derived from it are void.
  - The solution-count reconciliation C2 fails at any cell; that cell is void.
  - The distinctness or squarefreeness check C6 fails; the cell is void.
  - T/p exceeds 0.35 at any run cell; that cell is out of contract and is void.
  - >-
    d_solve is taken from a solver's self-report rather than from exact graded
    rank at any cell; the cell is void because the two arms would then be
    measured by different instruments.
  - Two runs of a cell with an identical seed disagree on d_solve or on the solution count.
  - Memory or wall-clock exhaustion; recorded as failed_infrastructure under AGENTS.md rule 5, never as a flat d_solve.
  success_criterion: >-
    The contract delivers its object when- C1, C2 and C6 pass at every reported
    cell; d_solve(1) and d_solve(32) are measured by exact graded rank at every
    admissible cell with at least 3 seeds; the separation check C7 is recorded
    per cell with its three computed branch values; Delta is reported with a
    per-seed spread and a branch verdict, or an explicit INCONSISTENT verdict;
    the per-degree rank profile is reported against HA-1's predicted
    coefficients with its largest residual; and the curve-free arm C3 and
    dummy-variable null C4 are reported at every admissible cell. Neither branch
    outcome is called a success.
  falsification_criterion: >-
    K1 CALIBRATION, BLOCKING. C1 or C2 fails. The plumbing is wrong; nothing is
    interpreted.

    K2 M1 BRANCH. Delta lands within the per-seed spread of the M1 forced value
    at every admissible cell. M1 holds, batching loses superlinearly in T, and
    the multi-target lane is closed AT THIS INTERFACE, at the tested primes,
    arities, factor-base sizes and batch sizes only.

    K3 M2 BRANCH. Delta lands within plus or minus 1 of 0 at every admissible
    cell. M2 holds; batching also loses, and the result is an independent
    confirmation that a univariate degree-T generator adds about degree/2 to a
    semi-regular system. THAT IS A STATEMENT ABOUT SEMI-REGULARITY AND NOT ABOUT
    ELLIPTIC CURVES, and per K5 it must be checked against the curve-free arm
    before it is described any other way.

    K4 AMORTISATION BRANCH. Delta lands within the per-seed spread of -15.5 at
    admissible cells. d_solve is flat in T over the tested range. This is the
    only outcome that would matter and it is NOT a result on its own- it
    triggers replication at a larger T ladder and an explicit multi-target
    comparison against the generic sqrt(T N) bound before any interpretation.

    K5 CURVE-FREE NULL, CONSEQUENCE PRE-STATED. If the random-dense-generator arm
    reproduces the Semaev arm's Delta within the per-seed spread at every
    admissible cell, then the measured d_solve(T) response is a generic fact
    about adjoining a univariate degree-T generator to a semi-regular system in
    m+1 variables. It carries NO statement about Semaev polynomials, about point
    decomposition, or about elliptic curves; any evidence record drawn from this
    contract must say so in its boundaries and may not be filed under an ECDLP
    heading.

    K6 DUMMY-VARIABLE NULL. If C4 shows the same degree response to T, the effect
    is generator-degree-driven rather than target-driven and no multi-target
    conclusion may be drawn.

    K7 STRUCTURED-TARGET ARTIFACT. If an amortisation appears in the structured
    target arm but not in the random arm, it is an artifact of the target set and
    only the random arm is reportable.

    K8 INCONSISTENT. Delta lands outside the spread of all three forced values at
    an admissible cell. Report the measured Delta and diagnose the third effect;
    do not assign the cell to the nearest branch.

    K9 UNDERPOWERED, NOT SHRUNK. A cell failing the eight-solution requirement or
    the three-degree separation check is emitted with an UNDERPOWERED flag and
    with the T, or the d_solve(1), that would be required. It is never reported
    as a weaker version of the claim.
  required_artifacts:
  - frozen contract hash and the per-cell branch-value computation transcript
  - per-cell instance-set SHA-256 and the serialised target list
  - exact command, git commit, dirty-tree state, environment and dependency versions
  - all seeds, curve parameters, factor base V, and the constructed generators
  - measured Semaev total and per-variable degrees D_S per cell
  - full per-degree Macaulay rank profile per (cell, arm, T)
  - independently enumerated batched and per-target solution counts
  - counted field operations for the batched solve and for T separate solves
  - Macaulay column counts, peak bytes, and wall clock per cell
  - the per-cell admissibility verdict with its two computed gates
  - stdout, stderr, timestamps, and per-cell validity status with reason
  - a machine-readable results table keyed by (arm, target_set, p, m, B, T, seed)
  assigned_to: executor
  approved_by: null
