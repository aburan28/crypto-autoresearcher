experiment:
  id: EXP-MODEL-f9e9e0
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-78eafe
  question_id: RQ-MODEL-e61cb2
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: THE EDWARDS y-ONLY SUMMATION POLYNOMIAL WAS NEVER MEASURED - EV-REP-001 and EV-REP-002 compared
    4-variable Weierstrass Semaev against an 8-variable NATIVE Edwards system and concluded "model-invariant";
    the matched object is the ELIMINATED 3-variable S_3 in the Edwards y-coordinate, whose per-variable
    degree is predicted EXACTLY 2 and whose support is predicted to lie in the 14 even-total-degree
    monomials because translation by the 2-torsion point (0,-1) acts on y as y -> -y
  status: draft
  objective: "(A) THE GAP IN THE LEDGER, STATED PRECISELY BECAUSE IT IS THE WHOLE REASON THIS RECORD\
    \ EXISTS. EV-REP-001 records, at m = 2, arms \"W_semaev (fair Weierstrass baseline, y-eliminated\
    \ Semaev, x-membership)\" and \"ED_x and ED_y (Edwards native)\". EV-REP-002 records, at m = 3,\
    \ \"Edwards native (8 vars) wall-time grows 0.09 -> 31s across d while Weierstrass Semaev (4 vars)\
    \ stays fast: constant-factor disadvantage at the SAME solving degree.\" DEC-20260716- 002 then\
    \ set H-REP-001 to rejected_scoped and KN-FIND-023 recorded \"model not a solving-degree lever\
    \ at that scope\". The comparison was between a y-ELIMINATED Weierstrass system and a NON-eliminated\
    \ Edwards system. Those are not matched objects: one has 4 variables, the other 8. The observed\
    \ Edwards disadvantage is therefore fully explained by the variable count, exactly as EV-REP-001\
    \ itself already diagnosed for the W_native_x arm (\"this is a suboptimal formulation whose extra\
    \ solutions are +-y sign branches, NOT a model property\"). The same diagnosis was applied to\
    \ the Weierstrass arm and NOT to the Edwards arm. The matched Edwards object - the reduced summation\
    \ polynomial in the single coordinate y, with 3 variables at m = 3 - does not appear in any run\
    \ record I can find.\n(B) THE OBJECT AND ITS DEGREE. On a twisted Edwards curve a x^2 + y^2 =\
    \ 1 + d x^2 y^2, negation is -(x, y) = (-x, y). So the coordinate y is negation-invariant, the\
    \ map y : E -> P^1 has degree 2, and it is exactly the Kummer coordinate. By the fibre count of\
    \ IDEA-20260807-dadcd2 (L1) with Gamma = {+-1}, the reduced summation polynomial S_m^{Ed,y} has\
    \ per-variable degree EXACTLY 2^(m-2) - identical to Weierstrass. Concretely deg_{y_i} S_3^{Ed,y}\
    \ = 2, total degree 4, in 3 variables. Equivalently, since the Edwards-to-Montgomery map is u\
    \ = (1 + y)/(1 - y), a MOEBIUS map, S_3^{Ed,y} is the Weierstrass S_3 with a Moebius substitution\
    \ per variable and denominators cleared - degree-preserving by construction.\n(C) THE SUPPORT\
    \ PREDICTION, WHICH IS THE PART THAT IS NOT A RESTATEMENT. The point T = (0, -1) is 2-torsion\
    \ on every twisted Edwards curve, and\n  (x, y) + (0, -1) = ((x*(-1) + y*0)/(1 + 0), (y*(-1) -\
    \ a*x*0)/(1 - 0))\n                   = (-x, -y),\ndirectly from the twisted Edwards addition\
    \ law. So translation by T acts on the coordinate y as y -> -y. Replacing P_i by P_i + T for an\
    \ EVEN number of indices leaves P_1 + ... + P_m unchanged; hence S_m^{Ed,y} is invariant under\
    \ flipping the sign of any even number of its variables, hence\n  SUPPORT(S_m^{Ed,y}) is contained\
    \ in the monomials of EVEN TOTAL DEGREE.\nAt m = 3 with per-variable degree at most 2 this is\
    \ a count I can do exactly: of the 27 exponent vectors in {0,1,2}^3, those with even coordinate\
    \ sum number (27 + 1)/2 = 14. So\n  SUPPORT(S_3^{Ed,y}) <= 14, versus SUPPORT(S_3^W) = 13 (hand-expanded\
    \ in\n  IDEA-20260807-e6d79e) and SUPPORT(S_3^Mont) = 27 for A != 0.\nThe exact value in {?, ...,\
    \ 14} is [open] and IS THE MEASUREMENT.\n(D) THE THREE OUTCOMES, PRE-REGISTERED, EACH WITH A MEANING.\n\
    \  OUTCOME 1 - support exactly 14 and degree exactly 2. Then Edwards is\n    essentially TIED\
    \ with Weierstrass (14 versus 13) on the only axis where\n    models can differ at all, and the\
    \ standing conclusion KN-FIND-023 is\n    CONFIRMED on the matched object it was never tested\
    \ on. That upgrade\n    matters: right now the conclusion rests on a mismatched comparison.\n\
    \  OUTCOME 2 - support strictly below 13, say 9 or 10. Then the Edwards\n    coordinate is genuinely\
    \ SPARSER than short Weierstrass, and since mixed\n    volume is monotone-ish in support (KN-TECH-007),\
    \ the lane has found the\n    first model that beats short Weierstrass on a measurable axis. That\
    \ would\n    be a real, if constant-factor, finding and would justify recomputing the\n    BKK\
    \ constants of KN-FIND-2a8b7e / KN-FIND-c7d31e in the Edwards\n    coordinate.\n  OUTCOME 3 -\
    \ support above 14, or degree not 2. Then the parity argument in\n    (C) is wrong, or the elimination\
    \ is not returning the reduced polynomial,\n    or the addition law used is not the twisted Edwards\
    \ one. All three are\n    instrument findings that invalidate other L11 arms and must be fixed\n\
    \    before anything else in the lane is believed.\n\n(E) WHY THIS IS THE CHEAPEST VALID DISCRIMINATOR\
    \ IN THE LANE. It is one resultant elimination and one monomial count on one curve. It costs minutes.\
    \ It simultaneously (i) closes a documented gap in the ledger, (ii) tests IDEA-20260807-dadcd2's\
    \ (L1) on the model where the corpus already has an empirical prior, and (iii) produces the number\
    \ that decides whether L11 has anything at all beyond its closure."
  resource_label: R1 (x-coordinates - here y-coordinates - as field elements forming the factor base)
    and R2 (curve equation and model).
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE. The resource is the polynomial system''s coefficient data,
    which is invisible to the generic-group simulator of KN-FIND-b7e091: that simulator answers group-operation
    and equality queries and cannot produce the monomial support of a polynomial over F_p. H-ENDO-001
    does not apply because no endomorphism is applied to points of G. The ceiling is nevertheless
    known in advance and stated: IDEA-20260807-dadcd2 shows the DEGREE cannot move, so the admissible
    resource can only purchase support and coefficient structure.'
  reachability_gate: 'TRIVIAL AND STATED EXPLICITLY. T5 gates lanes that move between CURVES; this
    lane moves between COORDINATES on a fixed curve, at the cost of one Moebius substitution, with
    probability 1, no walk and no mixing time. There is, however, a MODEL-EXISTENCE gate that is not
    a search cost and must not be confused with one: a twisted Edwards model exists iff the curve
    has a rational point of order 4. That is decided by the curve''s group order, is free to check,
    and is either satisfied or unsatisfiable at any price. On a prime-order curve it is unsatisfiable,
    so the object of this proposal does not exist there - which is a fact about arithmetic, not about
    reachability, and it is recorded here rather than left implicit.'
  inputs:
    procedure: 'STAGE 0 (zero compute): read Cheng-Kodera-Miyaji 2019 and the FGHR 2014 body for an
      existing y-only support count. A hit reclassifies this record. STAGE 1 (minutes, GATE): reproduce
      the Weierstrass baseline - s3_expr per-variable degree 2, support 13, planted root verified.
      STAGE 2 (minutes, GATE): build the Edwards curve and verify the birational map on 200 points.
      STAGE 3 (minutes to an hour): eliminate to the 3-variable S_3^{Ed,y}, take the squarefree part,
      run the vanish / non-vanish gate. STAGE 4 (minutes): count degree, support, parity classes;
      cross-check via the Moebius substitution from Montgomery. STAGE 5 (an hour): the matched measurement
      panel of IDEA-20260807-1354d8 on both 3-variable systems, 5 primes, 3 seeds, factor-base degrees
      d in {4, 6, 8} to match the EV-REP-002 grid exactly so the comparison is direct. STAGE 6 (minutes):
      the random-Moebius null and the no-2-torsion null.'
    mechanism: 'STEP 1 - BUILD AND VERIFY. Construct a toy twisted Edwards curve a x^2 + y^2 = 1 +
      d x^2 y^2 over a 16-bit prime with its birational Weierstrass model. Verify on 200 random points
      that the map is a group isomorphism onto its image, using harness/toycurve.py as the independent
      on-curve verifier for the Weierstrass side. GATE: a failure stops the line. STEP 2 - ELIMINATE.
      Form the twisted Edwards addition law for P_1 + P_2 + P_3 = O and eliminate x_1, x_2, x_3 using
      the curve equations x_i^2 = (1 - y_i^2)/(a - d y_i^2), obtaining a polynomial in y_1, y_2, y_3
      only. Take its squarefree part. GATE: verify by direct substitution that the result vanishes
      on 200 random valid triples and does NOT vanish on 200 random invalid triples. A polynomial
      that vanishes on everything is the trivial failure mode of an over-eager elimination and must
      be caught here. STEP 3 - COUNT. Read off per-variable degree (predicted exactly 2), total degree
      (predicted 4), the explicit support set, and the support size (predicted at most 14). Verify
      directly that every monomial has even total degree - this is a strong check of the parity argument
      that costs one pass. STEP 4 - CROSS-CHECK BY SUBSTITUTION. Independently obtain S_3^{Ed,y} by
      substituting the inverse Moebius map y_i -> (u_i - 1)/(u_i + 1) into the Montgomery S_3 of IDEA-20260807-e6d79e
      and clearing denominators. The two derivations must agree up to a scalar. Disagreement means
      one of the two eliminations is wrong. STEP 5 - THE COST COMPARISON, ON MATCHED OBJECTS. On the
      SAME curve, the SAME points, and the SAME factor base expressed in each model''s own coordinate,
      run the identical measurement panel of IDEA-20260807-1354d8 on the 3-variable Weierstrass Semaev
      system and the 3-variable Edwards y-only system: Bezout, BKK mixed volume, Macaulay dimension
      at the first fall, F4 maximum degree, Groebner basis size and wall time. This is the comparison
      EV-REP-002 could not make because its Edwards arm had 8 variables. STEP 6 - THE NULL. Apply
      the random-Moebius null of IDEA-20260807-4fc635 to the Weierstrass coordinate. If a random Moebius
      reparametrisation produces the same support statistics as Edwards, the Edwards number is not
      an Edwards property. The parity check of Step 3 is the discriminator: the random null must FAIL
      it, Edwards must PASS it.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - Weierstrass 3-variable Semaev on the same curve and factor base
  - random-Moebius null with decay parameter 0..3
  - a curve without rational 2-torsion, where the grading must be absent
  - an Edwards model with a deliberately wrong neutral element, where the grading must also be absent
  - the EV-REP-002 parameter grid reproduced exactly, so the new numbers sit beside the old ones rather
    than in a new coordinate system
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. Matched null - the SAME curve in the
    SAME Weierstrass model with a random Moebius substitution x_i -> mu(x_i) applied identically to
    every variable, mu drawn uniformly from PGL_2(F_p). Same degree, same variable count, same curve,
    same points: only the coordinate differs, exactly as for Edwards. DECAY PARAMETER: the number
    of independent random Moebius maps applied, 0 to 3. The parity property of Step 3 must decay to
    failure as soon as that parameter exceeds 0 (a random mu does not diagonalise the 2-torsion involution),
    while support size must NOT decay - it should jump to 27 and stay there. A pipeline in which the
    random null also passes the parity check has a bug in the parity check. SECOND NULL - a curve
    WITHOUT rational 2-torsion, in any degree-2 coordinate: the parity grading must be absent, since
    the mechanism requires the rational 2-torsion point. That second null is what connects this record
    to the prime-order case and is the reason the finding, whatever it is, cannot be transported to
    a cryptographic curve.'
  independent_variables: []
  metrics:
    primary:
    - per-variable and total degree of every eliminated polynomial
    - explicit support set, size, and parity-class histogram
    - variable count per arm (the load-bearing number)
    - Bezout, BKK mixed volume, Macaulay dimension at first fall
    secondary:
    - F4 maximum degree, Groebner basis size, wall time per arm
    - pass/fail of the vanish / non-vanish gate and of every null
  heuristic_under_test: null
  preregistered_prediction:
    quantity: per-variable degree of the reduced 3-variable S_3^{Ed,y}
    formula: EXACTLY 2 in each of y_1, y_2, y_3, total degree exactly 4. Zero tolerance. This is the
      direct test of IDEA-20260807-dadcd2 (L1).
    source: pre-registered in IDEA-20260807-78eafe before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - 'VARIABLE COUNT. This is the confounder that produced the original result and it must be controlled
    by construction, not by argument: both arms have exactly 3 variables at m = 3 or the comparison
    is void.'
  - MODEL-EXISTENCE BIAS. Every Edwards-admitting curve has cofactor at least 4. The comparison is
    therefore run only on cofactor-4 curves, and a Weierstrass-versus-Edwards difference measured
    there says nothing about prime-order curves. This is not a caveat; it is the scope.
  - ACCIDENTAL COEFFICIENT VANISHING at 16 bits inflates sparsity. Five primes, report the distribution.
  - NON-REDUCED ELIMINATION adds monomials of both parities and would falsely break the parity check.
    The squarefree gate must run before the parity count.
  - The factor base must be the SAME SET OF POINTS in both arms, addressed by each model's own coordinate
    - the assumption H-REP-001 already made and the one that makes the comparison about representation
    rather than about which points are cheap.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY 2 in each of y_1, y_2, y_3, total degree exactly 4. Zero tolerance. This
    is the direct test of IDEA-20260807-dadcd2 (L1).
  falsification_criterion:
  - An odd-total-degree monomial appears in the reduced S_3^{Ed,y}. The parity argument (C) is false;
    supersede this record.
  - Per-variable degree is not 2. Falsifies both (B) here and IDEA-20260807-dadcd2 (L1).
  - The two independent derivations (direct elimination and Moebius substitution from Montgomery)
    disagree up to a scalar. One elimination is wrong; nothing is reported until it is found.
  - The eliminated polynomial vanishes on random INVALID triples. The elimination has lost information;
    the object does not exist as constructed.
  - The random-Moebius null also passes the parity check. Instrument fault.
  - After matching the variable count to 3, the Edwards wall-time disadvantage of EV-REP-002 persists
    at the same magnitude. Then the variable-count explanation in (A) is wrong, and the honest report
    is that EV-REP-002's conclusion stands for a reason nobody in this lane has identified.
  - Support comes out at 12 or 13. Pre-registered as INCONCLUSIVE; no branch is claimed.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
