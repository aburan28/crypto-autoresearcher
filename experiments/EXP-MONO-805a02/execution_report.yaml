execution_report:
  experiment_id: EXP-MONO-805a02
  handoff_id: TASK-20260830-d0ad39
  hypothesis_id: H-MONO-40aca5
  implementation_commit: 147b5cd1fcfddbc2776eecced512e18e64ffbe30
  implementation_commit_note: >-
    Commit checked out at the start of both runs (repository dirty with
    unrelated concurrent-session files outside this task's write scope; see
    each run manifest's code.dirty_note). This report and the run artifacts
    it cites are not yet committed by the Coordinator; the Coordinator's
    snapshot commit will record the final SHA that includes these files.

  no_verdict_statement: >-
    OBSERVATIONS ONLY. This report renders no verdict on H-MONO-40aca5 and
    proposes no status change to H-MONO-40aca5, EXP-MONO-805a02, or any
    record read in Stage 6 (GOAL-SDEG-001, GOAL-DREG-001, GOAL-SIG-001, the
    ICEX threshold contract). That judgment belongs to the Coordinator and
    independent reviewers.

  protocol_deviations:
    - >-
      STAGE 1 RECONSTRUCTION, NOT LITERAL REPRODUCTION. KN-FIND-c41ea9's
      committed m=4, p=211 census (193 triples, curve A=37,B=57) is recorded
      in prose (this record's own citation trail:
      coordination/goals/GOAL-MONO-001/batches/BATCH-003/reviews/
      TASK-20260802-1b4130/red_team_report.md lines 407-414, 628, 752) but
      the literal 193 (x1,x2,x3) triples used are not committed anywhere
      machine-readable. This Executor reproduced the IDENTICAL construction
      (same curve, same p, same s4_expr resultant, same 193-triple count) on
      a freshly, deterministically seeded sample rather than the historical
      triples themselves. See implementation.md for the full disclosure.
      Both official runs matched the theorem's prediction 193/193 on the
      authoritative metric (root-set equality; see Stage 1 below).
    - >-
      A DEGREE-COMPUTATION BUG WAS FOUND AND FIXED BEFORE ANY OFFICIAL RUN.
      sympy.Poly(expr, var).degree() without modulus=p reports the OVER-Z
      degree, which over-counts the true mod-p degree whenever the top
      integer coefficient happens to be divisible by p (KN-FIND-c41ea9's own
      "degree drop" phenomenon, generalised from m=3 to m=4/m=5: one signed
      combination of the summed points lands on the point at infinity).
      Fixed by stripping leading-zero coefficients mod p before computing
      the degree. Pre-fix, this produced 3 spurious Stage-1 "non-split"
      cells (190/193) despite the root SET matching the group-law prediction
      in all 193/193 cases even before the fix; post-fix both metrics read
      193/193 in both official runs. The pre-fix number appears in no
      official artifact. See implementation.md.
    - >-
      STAGE 2's INTERNAL RNG IS NOT SEEDED BY THE RUN'S OWN SEED ARGUMENT.
      stage2()'s sampler is seeded from (p, "stage2") only, so its 30-trial
      sample is IDENTICAL in content (not merely in distribution) between
      RUN-MONO-805a02-1 (seed 20260830) and RUN-MONO-805a02-2 (seed
      20260831) -- verified directly by diffing both runs' raw-result.json
      stage2_m5_extension blocks with timing fields excluded (they are byte-
      identical). Every OTHER stage (0,1,3,4,5) IS seeded from the run's own
      seed and its two replication instances draw genuinely different,
      independently verifiable samples. This was caught only after both
      official runs completed; re-running was not done, because doing so
      would discard two otherwise valid, budget-compliant, immutable run
      records to fix a scope defect in ONE stage's own internal seeding, not
      a correctness defect in what that stage measured. Disclosed here per
      AGENTS.md rule 8 rather than silently corrected or hidden. If a
      genuinely re-seeded Stage-2 replication becomes material to any future
      reviewer, it is a candidate for a superseding RUN-MONO-805a02-3, not a
      retroactive edit of these two runs.

  runs:
    completed:
      - RUN-MONO-805a02-1
      - RUN-MONO-805a02-2
    invalid: []
    failed: []
    wall_seconds: {RUN-MONO-805a02-1: 73.42370223999023, RUN-MONO-805a02-2: 72.69372010231018}
    budget_cap_seconds: 1800
    within_budget: true

  stage0_known_answer_edge_m3:
    curve: {p: 211, a: 37, b: 57}
    gate_pass_both_runs: true
    P: [1, 99]
    Q: [2, 75]
    P_plus_Q: [151, 125]
    P_minus_Q: [100, 36]
    s3_roots: [100, 151]
    instrument_matches_group_law: true
    operation_count_reconciliation: >-
      Obtaining ONE named root (either P+Q or P-Q alone) costs exactly 1
      call to EllipticCurve.add. Obtaining BOTH roots of the complete m=3
      fibre (matching deg_T S_3 = 2) costs exactly 2 calls to
      EllipticCurve.add -- (m-1)=2 at m=3, under the identical m-1
      convention Stage 3 uses for general m. EllipticCurve.negate() (a sign
      flip on y, no field inversion) is never counted as an addition.
      Measured directly via a counting wrapper around EllipticCurve.add,
      identically in both runs (Stage 0 is seed-free by design).
    identical_across_both_runs: true

  stage1_fixture_reproduction_m4:
    curve: {p: 211, a: 37, b: 57}
    n_triples: 193
    gate_pass:
      RUN-MONO-805a02-1: true
      RUN-MONO-805a02-2: true
    n_split_completely: {RUN-MONO-805a02-1: 193, RUN-MONO-805a02-2: 193}
    n_root_set_matches_group_law: {RUN-MONO-805a02-1: 193, RUN-MONO-805a02-2: 193}
    reconstruction_caveat: >-
      See protocol_deviations above -- same construction and curve as
      KN-FIND-c41ea9's committed census, freshly sampled 193 triples (the
      literal historical triples are not committed anywhere machine-
      readable). Both official runs' independently seeded 193-triple samples
      reproduced 193/193 complete splitting and 193/193 root-set equality
      with the group-law prediction {x(+-P1+-P2+-P3)}, matching
      KN-FIND-c41ea9's own reported outcome exactly.
    wall_seconds: {RUN-MONO-805a02-1: "~5.6s (embedded in Stage0+1 block)", RUN-MONO-805a02-2: "~5.6s"}

  stage2_m5_extension:
    method: >-
      S_5(x1,x2,x3,x4,T) = Res_U(S_4(x1,x2,x3,U), S_3(x4,T,U)), following
      s4_expr's own resultant-elimination pattern one further step, done
      NUMERICALLY (x1,x2,x3,x4 substituted to concrete on-curve
      x-coordinates BEFORE the resultant is taken over U, leaving only T
      symbolic) for tractability, per the frozen contract and the handoff's
      own constraint.
    p211:
      trials: 30
      n_split_completely: 29
      n_root_set_matches_group_law: 30
      all_matched: true
      wall_seconds: "~8.8s"
      timed_out: false
    p1009:
      trials: 30
      n_split_completely: 29
      n_root_set_matches_group_law: 30
      all_matched: true
      wall_seconds: "~8.9s"
      timed_out: false
    timeout_note: >-
      Every cell's resultant computation completed in well under 1 second;
      the frozen contract's 300-second per-cell timeout was never
      approached, let alone triggered.
    identical_across_both_runs: true
    identical_across_both_runs_caveat: >-
      By construction (see protocol_deviations) -- Stage 2's own RNG is not
      seeded from the run's seed argument, so this is not independent
      replication of Stage 2 specifically, though it is the identical,
      independently-computed-twice (once per run process) confirmation of
      the same 30-trial sample, and it matches on every trial in both
      independent process executions.
    split_vs_match_note: >-
      n_split_completely (29/30) uses the strict "no repeated root" test;
      n_root_set_matches_group_law (30/30) is the authoritative theorem
      test (does the SET of roots found equal the group-law prediction).
      All 30/30 trials matched at both p; the single "non-split" reading at
      each p is a genuine repeated-root coincidence (two different sign
      combinations sharing an affine x-coordinate), not a theorem failure.
      See implementation.md.

  stage3_operation_count:
    description: >-
      Instrumented directly via a counting wrapper around EllipticCurve.add,
      m in {3,...,8}, p in {211,1009}, 100,000 attempts per cell (the
      contract's floor). NO Semaev-polynomial evaluation function is
      imported or called anywhere in stage3()'s hot loop.
    convention: >-
      Summing k=m-1 factor-base points: acc=chosen[0] (0 calls), then k-1
      = m-2 further .add calls to fold in the rest, then +1 .add call for
      the residual target-minus-sum subtraction (via .add(target,
      .negate(acc))) = m-1 total .add calls per attempt. .negate() (sign
      flip on y) is never counted.
    reconciliation_table:
      # measured_add_calls == (m-1) * 100000 at EVERY cell, both runs, both p
      p211:
        m3: {measured: 200000, expected: 200000}
        m4: {measured: 300000, expected: 300000}
        m5: {measured: 400000, expected: 400000}
        m6: {measured: 500000, expected: 500000}
        m7: {measured: 600000, expected: 600000}
        m8: {measured: 700000, expected: 700000}
      p1009:
        m3: {measured: 200000, expected: 200000}
        m4: {measured: 300000, expected: 300000}
        m5: {measured: 400000, expected: 400000}
        m6: {measured: 500000, expected: 500000}
        m7: {measured: 600000, expected: 600000}
        m8: {measured: 700000, expected: 700000}
    reconciles_exactly_every_cell_both_runs: true
    zero_polynomial_arithmetic_calls_confirmed: >-
      Confirmed by code inspection: stage3() never imports or references
      s3_expr/s4_expr/sympy anywhere in its body.
    wall_seconds_range: "0.15s (m=3) to 0.46s (m=8) per cell, both runs"

  stage4_negative_locus_and_degenerate:
    negative_locus_null_m3:
      description: >-
        x1,x2 drawn uniformly in F_p (NOT constrained to on-curve
        x-coordinates), classified by Euler's-criterion Legendre symbol of
        the resulting quadratic's discriminant, 10,000 nominal trials
        (>99.5% usable after skipping the x1==x2 degree-collapse case).
      split_rate_both_roots_in_Fp:
        RUN-MONO-805a02-1: {p211: 0.4934752057819715, p1009: 0.5032555344084945}
        RUN-MONO-805a02-2: {p211: 0.5019599959794955, p1009: 0.5006003602161296}
      bug_signature_near_1_observed: false
      tail_check_note: >-
        Per the frozen tail check, split rate should approach 1/2 as p
        grows; observed values at both p (0.493-0.503 at p=211, 0.501-0.503
        at p=1009 across the two runs) are already extremely close to 1/2
        at both tested primes, with no directional trend distinguishable at
        this sample size (10,000 trials, statistical noise ~0.005).
    degenerate_check_m2:
      expr: "x1 - x2"
      degenerate_flag: true
      reported_in_both_runs: true

  stage5_partial_locus_cost:
    symmetry_finding: >-
      S_4(x1,x2,x3,x4) was checked and confirmed SYMMETRIC under swapping
      x3<->x4 and x1<->x4 (both differences reduce to exactly 0 by direct
      symbolic expansion). Since transpositions generate the full symmetric
      group, this confirms S_4 is symmetric under every permutation of its
      four arguments -- the well-known symmetry of Semaev summation
      polynomials (Semaev 2004), not new to this record.
    headline_consequence: >-
      STAGE 5 AS LITERALLY SPECIFIED BY THE FROZEN CONTRACT (fix m-2 of the
      m-1 summation coordinates on-curve, ALSO fix the target T on-curve,
      leave exactly ONE summation coordinate free) IS NOT ACTUALLY OUTSIDE
      KN-FIND-c41ea9's THEOREM. Fixing m-2 summation coordinates plus the
      target T on-curve fixes m-1 of S_4's m=4 TOTAL symmetric arguments to
      rational x-coordinates -- exactly the theorem's own precondition,
      applied to a relabelled argument (T is not privileged; it is
      symmetric with x1,x2,x3). This is the "cheap result" the frozen
      contract's own falsification_conditions anticipated as possible and
      instructed to report prominently: "the partial locus at m=4 or 5 also
      splits completely / is cheap to enumerate ... a new structural fact
      exists and must be reported as the record's headline, not a
      footnote." Reported here as exactly that -- a corollary of the ALREADY
      KNOWN symmetry of Semaev polynomials applied to this record's own
      Stage-5 construction, not a new theorem, but a genuine correction to
      how "genuinely open" the partial locus (as this contract defined it)
      actually is.
    measured_split_rates:
      m4:
        RUN-MONO-805a02-1: {p211: 1.0, p1009: 0.9666666666666667}
        RUN-MONO-805a02-2: {p211: 0.9666666666666667, p1009: 0.9666666666666667}
      m5:
        RUN-MONO-805a02-1: {p211: 0.9, p1009: 0.9666666666666667}
        RUN-MONO-805a02-2: {p211: 0.8333333333333334, p1009: 0.9666666666666667}
      trials_per_cell: 30
    example_nonsplit_case: >-
      RUN-MONO-805a02-2, m=4, p=211: P1=(72,38), P2=(51,71), R=(51,71)
      (note R==P2 here) gave deg=4 but only 3 distinct roots [72,94,166] --
      consistent with the same repeated-root / degree-drop phenomenon
      documented at Stage 1/2, not with a failure to split into linear
      factors.
    honest_scope_note: >-
      The near-100% (not exactly 100%) split rates are consistent with the
      symmetry-implied prediction once repeated-root coincidences (a rare,
      ~1/p event per trial) are accounted for exactly as at Stage 1/2 --
      see implementation.md's split-vs-match distinction. No trial in
      either run showed a genuinely INCOMPLETE fibre (a polynomial that
      does not factor fully into linear factors over F_p at its true
      mod-p degree).
    wall_seconds: "m4: ~0.85s/cell; m5: ~9.0s/cell (both runs, both p)"

  stage6_cross_goal_labelling:
    search_method: >-
      git ls-files (tracked, committed state of this branch ONLY --
      untracked worktree copies under .claude/worktrees/* and
      kb/.kb-corpus* were explicitly excluded as not-committed-on-this-
      branch) filtered by case-insensitive grep for SDEG, DREG, GOAL-SIG,
      ICEX, and fa9839, restricted to ledger/, coordination/goals/, and
      experiments/, cross-checked against
      tools/schema_supersession_registry.yaml and
      tools/run_supersession_registry.yaml for any DREG/SDEG/SIG/ICEX
      supersession (found: three DREG schema/administrative supersessions,
      none touching a scientific measurement cell).
    table:
      - goal: GOAL-SDEG-001
        artifact: >-
          experiments/EXP-SDEG-{0be8e4,0d4fec,f7faa8}/specification.yaml
          (all status: review_required, approved_by: null; f7faa8/runs/
          contains only .gitkeep); ledger/evidence/EV-SDEG-001.yaml
        label: not_yet_committed
        justification: >-
          EV-SDEG-001 states explicitly "No scaling experiment was
          executed" -- goal has a reviewed PROTOCOL DESIGN only, no
          measurement cell exists.
      - goal: GOAL-DREG-001
        artifact: >-
          experiments/EXP-DREG-001/DREG_dff.sage (Matrix(GF(2), ...) over
          a "boolean chained Semaev m=3" system, per h012_peel_rank.py's
          build_system/boolean_null); ledger/evidence/EV-DREG-004.yaml
          (n=21 boolean-system cell, ncols=778394, nrows=279048)
        label: S-extension
        justification: >-
          GOAL-DREG-001's own title: "the boolean Semaev m=3 degree-of-
          regularity axis". The measured system is over GF(2) (boolean /
          Weil-descended variables), not a prime-field polynomial ring.
      - goal: "GOAL-SIG-001 (boolean arm)"
        artifact: >-
          experiments/EXP-SIG-001/analysis.md sections 2-3 ("boolean arm",
          "GF(2) symmetric-difference semantics", K-family syzygy
          classifier, n=9/12/15/18); runs/RUN-EXP-SIG-001-{a,b,c}/
        label: S-extension
        justification: >-
          Explicit GF(2) boolean-variable system, per analysis.md's own
          language.
      - goal: "GOAL-SIG-001 (panel arm, Yokoyama #G*)"
        artifact: >-
          experiments/EXP-SIG-001/src/h013_f5_signatures.sage
          gstar_cell() ("I = <F(x_1..x_m), S_{m+1}(x_1..x_m,xR)>",
          PolynomialRing(F, names) with F = E.base_field() = GF(p),
          p=1000003 in the committed panel run); analysis.md section 4;
          runs/RUN-EXP-SIG-001-d/
        label: S-prime
        justification: >-
          gstar_cell() builds gens = [prod(x_i - r for r in base) for
          i in 1..m] + [S_{m+1} with target xR substituted], ALL over the
          curve's own PRIME FIELD F_p -- exactly harness/semaev.py's own
          fV1/fV2 factor-base-forcing pattern, with NO boolean/Weil-descent
          encoding anywhere in this arm. Solving degree (#G*, instrumented
          Buchberger) is measured directly over F_p for a genuine
          factor-base decomposition target.
        critical: true
        headline: >-
          THIS CELL LABELS S-prime, CONTRADICTING THE FROZEN PREDICTION
          THAT EVERY REACHABLE CELL LABELS S-EXTENSION. Per
          H-MONO-40aca5's own falsification_conditions, this is named here
          as the single most valuable cell found across GOAL-SDEG-001/
          GOAL-DREG-001/GOAL-SIG-001/ICEX, reported prominently per the
          contract's own instruction, not buried in this table.
      - goal: "ICEX threshold contract (IDEA-20260803-fa9839 / EXP-ICEX-146ff5)"
        artifact: >-
          experiments/EXP-ICEX-146ff5/specification.yaml (status:
          approved_execution_withheld, execution_authorization.granted:
          false, three open preconditions)
        label: not_yet_committed
        justification: >-
          Never executed; no runs/ directory with measurement output.
          Design-only observation (not a label): its own D_trial conversion
          formula consumes a Groebner solving degree and its own GATE-A
          calibration uses an extension-field (Gaudry-Diem q^n) baseline --
          built around formulation S by construction -- but this is not a
          committed measurement cell. The falsification condition
          ("fa9839 already charges formulation E explicitly") does NOT
          apply: it does not.
    counts:
      labellable: 3
      not_yet_committed: 2
      not_located: 0
      by_label: {E: 0, S-extension: 2, S-prime: 1, not-labellable: 0}
    identical_across_both_runs: true
    note: Stage 6 is static (no randomness, no compute); identical by construction in both runs.

  unit_declaration_tripwire:
    refused_no_declared_conversion: true
    reason: >-
      No group-operation-to-field-operation conversion constant is declared
      anywhere in the frozen contract. D_trial(E) (group operations, Stage
      3) and any D_trial(S) (field operations, e.g. Stage 5's sympy-
      factoring path or Stage 6's Buchberger #G*) are reported side by
      side in this report and never combined into a ratio.

  tail_checks:
    stage3_m8_reconciliation: >-
      At the largest tested m (8), measured_add_calls == 700000 ==
      (8-1)*100000 exactly at both p, both runs -- no off-by-one drift
      appeared at the largest tested arity.
    negative_locus_trend: >-
      Both tested primes (211, 1009) already read within 0.01 of exactly
      1/2 in both runs; no trend distinguishable from noise at this sample
      size, consistent with (though not a strong test of) the predicted
      O(1/p) approach to 1/2.

  anomalies:
    - >-
      Degree-computation bug (over-Z vs mod-p degree) found and fixed
      before any official run; see protocol_deviations.
    - >-
      Stage 2's RNG not seeded by the run's own seed argument, giving
      identical Stage-2 content across both replication instances; see
      protocol_deviations. Caught after both official runs completed;
      disclosed rather than corrected retroactively.
    - >-
      Stage 5's measured near-complete splitting (headline structural
      observation, not a bug) -- see stage5_partial_locus_cost above.

  artifact_paths:
    - experiments/EXP-MONO-805a02/implementation.md
    - experiments/EXP-MONO-805a02/implementation/
    - experiments/EXP-MONO-805a02/runs/RUN-MONO-805a02-1/
    - experiments/EXP-MONO-805a02/runs/RUN-MONO-805a02-2/
    - experiments/EXP-MONO-805a02/execution_report.yaml

  executor_assessment:
    protocol_complete: true
    data_quality: good
    requires_rerun: false
    notes: >-
      Both planned runs (2/2) reached completed_valid terminal state, well
      within budget (73.4s and 72.7s against a 1800s cap). Stage 0 and
      Stage 1 hard gates passed exactly in both runs. The operation count
      is reported for every m in {3,...,8} at both p with an exact call-
      count reconciliation in every cell of both runs. The partial-locus
      cost is reported for m in {4,5} at both p in both runs, and the
      unexpectedly cheap (near-complete-split) result is reported
      prominently along with its algebraic explanation (S_4's own
      permutation symmetry), per the contract's own instruction for a
      falsifying-direction result. Every reachable SDEG/DREG/SIG/ICEX cell
      identified by the documented search received a label or an explicit
      not_yet_committed disposition; the one S-prime cell found (EXP-SIG-
      001's Yokoyama panel arm) is reported as the headline of Stage 6, not
