experiment:
  id: EXP-MONO-805a02
  hypothesis_id: H-MONO-40aca5
  version: 1
  title: >-
    D_trial cost identity for the enumerate-and-test relation-search
    formulation, plus a read-only formulation label for SDEG/DREG/SIG/ICEX
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-08-30'
  coordinator_approval_rationale: >-
    APPROVED under the identical precedent already established and
    user-confirmed for the four sibling contracts EXP-MONO-4c7479,
    EXP-MONO-2a13d7, EXP-MONO-a20e48, and EXP-MONO-715694: a small,
    standalone experiment under the classic lifecycle
    (docs/task-lifecycle.md steps 3-7), not a GOAL-MONO-001 campaign
    batch. Draws on no part of that goal's exhausted campaign budget. Low
    implementation cost (reuses `harness/semaev.py` and
    `harness/toycurve.py` directly), low compute (10^5 trivial group
    operations per cell; a handful of small-p resultant eliminations).
    The cross-goal reading pass (Step 6 / Stage 3 below) is READ-ONLY
    against other goals' already-committed artifacts; it writes nothing
    outside this experiment's own directory and proposes no status change
    to any other goal.

  objective: >-
    (1) Pin the per-attempt cost D_trial for the enumerate-and-test
    relation-search formulation exactly, by exhaustive reproduction of an
    already-committed fixture plus a fresh extension and an
    operation-count instrumentation. (2) Measure the one locus the
    underlying theorem does not reach (the partial/large-prime fibre) as
    a genuinely open question. (3) Read (never write) other goals'
    already-committed measurement cells and assign each a formulation
    label. Produces observations only; renders no verdict on
    H-MONO-40aca5.

  what_this_is_not: >-
    NOT an ECDLP attack, NOT an exponent claim in either direction. NOT a
    status change to GOAL-SDEG-001, GOAL-DREG-001, GOAL-SIG-001, the ICEX
    threshold contract, or any other MONO record. NOT a re-derivation of
    KN-FIND-c41ea9's own theorem (imported verbatim, not re-proven). NOT a
    write of any kind to any file outside `experiments/EXP-MONO-805a02/`.

  inputs:
    reused_infrastructure:
      - path: harness/semaev.py
        role: "s3_expr, s4_expr (Semaev summation polynomials via resultant elimination); reused directly, not reimplemented."
      - path: harness/toycurve.py
        role: "EllipticCurve (add, mul, lift_x), Point; reused directly for all group arithmetic."
    read_only_cross_goal_sources:
      - description: >-
          Already-committed evidence/decision/experiment records under
          `ledger/goals/GOAL-SDEG-001/` or `coordination/goals/GOAL-SDEG-001/`
          (whichever layout is current), `ledger/goals/GOAL-DREG-001/` or
          `coordination/goals/GOAL-DREG-001/`, `ledger/goals/GOAL-SIG-001/`
          or `coordination/goals/GOAL-SIG-001/`, and the ICEX threshold
          contract (`ledger/proposals/IDEA-20260803-fa9839.yaml` and/or
          `experiments/EXP-ICEX-146ff5/specification.yaml` if committed
          under that or a superseding id — check
          `tools/schema_supersession_registry.yaml` and
          `tools/run_supersession_registry.yaml` for any supersession
          before concluding a name is missing).
        access: read_only
        note: >-
          Read exactly as committed at the moment of reading; record the
          git commit or file mtime read, per cell. A goal whose relevant
          contract cannot be located after a reasonable search (grep for
          "solving.degree", "Macaulay", "Groebner", "DREG", "SDEG", "SIG"
          across `ledger/` and `experiments/`) is reported as
          `not_located`, not guessed at.

  controls:
    - id: KNOWN-ANSWER-EDGE-M3
      description: >-
        S_3 has degree 2 in T; the two roots are x(P+Q), x(P-Q) by the
        two-line chord derivation. The instrument must return exactly
        those two values and exactly 1 addition per attempt with a fixed
        target. Runs FIRST, before any other cell.
    - id: COMMITTED-FIXTURE-REPRODUCTION-M4
      description: >-
        Reproduce KN-FIND-c41ea9's own committed m=4, p=211 census (193
        specialisations, 193/193 complete splitting, root sets exactly
        {x(+-P1+-P2+-P3)}) cell for cell, using `harness/semaev.py`'s own
        `s4_expr`, BEFORE any new cell (m=5 or the operation count) is
        interpreted. CAN FAIL: a mismatch means the construction differs
        from the finding's and nothing else in this record is
        interpretable.
    - id: NEGATIVE-LOCUS-NULL-M3
      description: >-
        Specialise S_3 at x_1, x_2 chosen UNIFORMLY in F_p (not
        constrained to be on-curve x-coordinates of factor-base points).
        FORCED split rate 1/2 + O(1/p), NOT 1. CAN FAIL: complete
        splitting here means the implementation is silently projecting
        onto the curve; the whole measurement is void.
    - id: DEGENERATE-CHECK-M2
      description: >-
        S_2 = x_1 - x_2; there is no fibre. The instrument MUST report
        this explicitly (e.g. a `degenerate: true` flag with no numeric
        root-count/split-rate field), never a numeric result forced into
        the same schema as m>=3.
    - id: UNIT-DECLARATION-TRIPWIRE
      description: >-
        No group-operation-to-field-operation conversion constant is
        declared anywhere in this contract. Any code path that would
        require comparing D_trial(E) (group operations) against D_trial(S)
        (field operations) numerically MUST refuse to compute a ratio and
        report `refused_no_declared_conversion: true` instead of a number.

  independent_variables:
    - name: m
      values: "2..5 for polynomial-construction-dependent stages; 3..8 for the operation-count stage only"
    - name: p
      values: [211, 1009]
    - name: locus
      values: [factor_base_complete, negative_generic, partial_large_prime]

  metrics:
    primary:
      - "D_trial(E): exact operation count per attempt, m in {3,...,8}, both p, >=10^5 attempts/cell"
      - "Fixture reproduction: pass/fail, cell-for-cell against KN-FIND-c41ea9's committed m=4/p=211 census"
      - "m=5 root-set equality against the group-law prediction, both p"
      - "Negative-locus split rate at m=3, both p"
      - "Partial-locus fibre enumeration cost, m in {4,5}, both p"
      - "Formulation label (E / S-extension / S-prime / not-labellable) per reachable committed SDEG/DREG/SIG/ICEX cell"
    secondary:
      - "Table size and lookup count per cell (H2 accounting)"
      - "Area-time-convention second column for the membership-test cost"
      - "Count of labellable vs. not-labellable cells in Step 6"

  heuristic_under_test: H1
  preregistered_prediction:
    quantity: "D_trial(E) as a function of m"
    formula: "D_trial(E) = m - 1 (group additions) + 1 (O(1) membership lookup), independent of p"
    source: "KN-FIND-c41ea9 (factor-base-locus complete splitting) + the elliptic-curve group law; derived in IDEA-20260806-9d47e2."

  scale_relevance:
    tier: toy
    justification: >-
      p in {211, 1009}; m<=5 for anything needing S_m, m<=8 for the pure
      operation count. No transfer or extrapolation to cryptographic
      scale is claimed; the underlying THEOREM (not the measurement) is
      scale-independent, per H1's own framing.
    correspondence: null

  tail_checks:
    - "The largest tested m (8) for the operation-count stage is where an off-by-one in the additions-per-attempt convention (m-1 vs. m-2 plus the final subtraction) is most visible; report the exact call count alongside the m-1 convention and reconcile any discrepancy explicitly."
    - "The negative-locus null's split rate should approach 1/2 as p grows across the two tested primes (211, 1009); report both and note the trend direction, not just pass/fail against 1/2+O(1/p)."

  replication:
    seeds: [20260830, 20260831]
    independent_instances: 2

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1.0
    maximum_memory_gb: 2
    maximum_runs: 2
    maximum_workers: 1

  stopping_rules:
    - "Stage 0 (known-answer edge, m=3) and Stage 1 (m=4 fixture reproduction) are hard gates: do not proceed to m=5, the operation count, or the negative-locus/partial-locus stages until both pass exactly."
    - "If the m=5 resultant elimination fails to terminate within 300 seconds at either p, abort that cell as failed_infrastructure and report the timeout; do not fall back to a smaller m silently."
    - "If any Step-6 goal directory cannot be located after the documented search, report not_located for that goal and continue with the others; do not block the rest of the record on one missing goal."
    - "Total wall clock per run must not exceed wall_clock_seconds_per_run; if approached, reduce attempts-per-cell for the largest untested m first, disclose the reduction explicitly, and never silently drop a whole m value from the report."

  invalidation_rules:
    - "Any post-hoc change to the m ranges, p values, or the 10^5-attempt floor after Stage 2 numbers have been observed requires a versioned protocol_amendment."
    - "The reused-infrastructure paths (harness/semaev.py, harness/toycurve.py) are frozen as the required implementation base; substituting a different S_m or curve-arithmetic implementation requires an amendment."

  success_criterion: >-
    All of: the m=3 known-answer edge and m=4 fixture-reproduction gates
    pass exactly; the m=5 extension and negative-locus/degenerate controls
    are reported (pass or documented failure); the operation count is
    reported for every m in {3,...,8} at both p with the exact call-count
    reconciliation; the partial-locus cost is reported for m in {4,5} at
    both p; every reachable, already-committed SDEG/DREG/SIG/ICEX cell
    receives a label or an explicit `not_located`/`not_labellable`
    disposition. A run reporting all of this, regardless of which
    direction any individual number points, is successful.

  falsification_criterion: >-
    See H-MONO-40aca5's `falsification_conditions` (carried over
    verbatim, not restated in full here): fixture non-reproduction;
    negative-locus complete splitting; D_trial(E) growing with p or
    showing polynomial arithmetic; any SDEG/DREG/SIG/ICEX cell labelling
    as E or S-prime-field; the partial locus also splitting completely;
    the ICEX contract already charging formulation E explicitly.

  required_artifacts:
    - implementation.md
    - implementation/ (source code)
    - runs/RUN-MONO-805a02-1/
    - runs/RUN-MONO-805a02-2/
    - execution_report.yaml

  battery:
    - id: STAGE0-KNOWN-ANSWER-EDGE
      description: "Per KNOWN-ANSWER-EDGE-M3 control. Hard gate, runs first."
      forced_output: "roots = {x(P+Q), x(P-Q)}; exactly 1 addition per attempt."
    - id: STAGE1-FIXTURE-REPRODUCTION
      description: "Per COMMITTED-FIXTURE-REPRODUCTION-M4 control. Hard gate."
      forced_output: "193/193 complete splitting; root sets exactly {x(+-P1+-P2+-P3)}."
    - id: STAGE2-M5-EXTENSION
      description: >-
        Build S_5 by one further resultant elimination from S_4 and S_3
        (the identical pattern `s4_expr` uses), evaluated numerically mod
        p for tractability, at p in {211,1009}. Check root-set equality
        against {x(+-P1+-P2+-P3+-P4)}.
      forced_output: "set equality at every tested factor-base 4-tuple, both p."
    - id: STAGE3-OPERATION-COUNT
      description: >-
        Instrument formulation E directly via `EllipticCurve.add`, m in
        {3,...,8}, p in {211,1009}, >=10^5 attempts per cell. No S_m
        evaluation permitted in this stage's instrumented path.
      forced_output: "exactly m-1 additions + 1 lookup per attempt, zero polynomial-arithmetic calls, at every cell."
    - id: STAGE4-NEGATIVE-LOCUS-AND-DEGENERATE
      description: "Per NEGATIVE-LOCUS-NULL-M3 and DEGENERATE-CHECK-M2 controls."
      forced_output: "split rate 1/2+O(1/p) at m=3 (not 1); explicit degenerate flag at m=2."
    - id: STAGE5-PARTIAL-LOCUS-COST
      description: >-
        m in {4,5} ONLY, p in {211,1009}. Fix m-2 factor-base
        coordinates; leave one coordinate free; enumerate the fibre via
        genuine univariate root-finding on the specialised S_4/S_5.
      forced_output: >-
        Report the exact charged operation count; PREDICTED expensive
        (materially above m-1 additions) but not certain — report
        whichever direction is measured.
    - id: STAGE6-CROSS-GOAL-LABELLING
      description: >-
        READ-ONLY. For every located, already-committed SDEG/DREG/SIG/
        ICEX measurement cell, determine and record the polynomial system
        it solves and assign E / S-extension / S-prime / not-labellable.
      forced_output: >-
        PREDICTED: every reachable cell labels S-extension. Report the
        full table plus counts; any E or S-prime cell is the headline
        finding of this stage.

  observation_requirements:
    - "Report the exact reconciliation between the m-1 convention and the actual instrumented call count for Stage 3."
    - "Report, per Step 6 cell, the git commit or mtime read and a one-line description of the system solved, not just the assigned label."
    - "Report the search method used for locating each goal's relevant contract (which files/directories were grepped) so the not_located determination is auditable."

  assigned_to: executor
