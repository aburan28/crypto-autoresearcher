      matches_reported: true
      note: >-
        Partial (n=25, not the full 193) independent re-run, per the task's
        item-1 instruction; consistent with, and additional to, the
        Executor's own reconstructed-sample 193/193 result.
    - id: ITEM2-DEGREE-BUG-COUNTEREXAMPLE
      method: >-
        Fresh script (v2_bugfix.py), independently constructed a concrete
        m=4 degree-drop instance by scanning fresh random triples (own
        seed) until sympy.Poly(expr,x4).degree() (no modulus=p, the BUGGY
        call) disagreed with the true mod-p degree.
      result: >-
        FOUND: P1=(122,79), P2=(123,92), P3=(135,37) at p=211. Over-Z
        degree=4 (sympy .degree()); true mod-p degree=3 (leading
        coefficient over Z = 594582724414345216, which is 0 mod 211 but
        nonzero over Z). The BUGGY check (len(roots)==deg_over_z) reads
        False (spurious non-split); the FIXED check
        (len(roots)==deg_modp) reads True; the 3 roots found
        ([11,65,156]) EXACTLY equal the group-law-predicted set
        {x(+-P1+-P2+-P3)}.
      matches_reported: true
      note: >-
        Independently confirms both (a) the bug is real and reproducible,
        not a fabricated disclosure, and (b) the disclosed fix (strip
        leading-zero mod-p coefficients before computing degree) is
        mathematically correct, by constructing my own counterexample
        rather than trusting the Executor's characterization. Also
        confirmed by direct code inspection that this exact fix (lines
        76-83 of run_experiment.py's poly_roots_bruteforce) is the code
        that ran in BOTH official runs (single implementation file, single
        commit, no pre/post-fix variant present in the reviewed tree), and
        that both runs' raw-result.json independently read
        stage1_fixture_reproduction_m4.n_split_completely=193 and
        n_root_set_matches_group_law=193 (both runs, checked directly).
    - id: ITEM3A-FULL-S4-SYMMETRY
      method: >-
        Fresh script (v3_symmetry.py), independently checked ALL SIX
        transpositions of S4(x1,x2,x3,x4) (the Executor's own artifacts
        checked only 2: x3<->x4 and x1<->x4), by direct symbolic
        subtraction and expansion.
      result: >-
        All 6 transpositions (x1x2, x1x3, x1x4, x2x3, x2x4, x3x4) give
        IDENTICALLY ZERO difference. Full S4 symmetric-group symmetry of
        the harness's OWN s4_expr construction is established without
        gaps.
      matches_reported: true
      note: >-
        See central_question_item3_finding below: the Executor's own
        stated justification ("transpositions generate the full symmetric
        group") is technically under-supported by the 2 transpositions it
        actually checked (their transposition graph on {1,2,3,4} does not
        connect vertex 2 to anything, so checking only swap_34 and
        swap_14 establishes symmetry on {1,3,4} only, NOT full S4
        symmetry, contrary to the blanket claim made from them) -- but the
        CONCLUSION is independently confirmed true by this review's more
        complete check.
    - id: ITEM3B-S5-XT-SYMMETRY-THE-KEY-GAP
      method: >-
        Fresh script (v3_symmetry.py Part B + v3b_symmetry_robust.py),
        built the harness's OWN S5 construction
        (Res_U(S4(x1,x2,x3,U), S3(x4,T,U)), the exact pattern
        build_s5_root_set_and_deg uses) but with BOTH x4 and T left
        symbolic simultaneously (unlike every stage in the harness, which
        always numerically fixes one of {x4,T} before eliminating U),
        yielding a genuine bivariate S5(x4,T) with x1,x2,x3 fixed to
        concrete on-curve values. Tested the x4<->T swap identity across 9
        independent (x1,x2,x3) triples total (1 in the first script, 4+4
        in the robustness script) at BOTH tested primes (211, 1009).
      result: >-
        S5(x4,T) == S5(T,x4) IDENTICALLY (as an exact bivariate polynomial
        subtraction, not merely at sampled points) in all 9/9 independent
        triples tested, at both p. Degrees checked: deg_x4=deg_T=8,
        matching Semaev's deg_T(S_m)=2^(m-2)=2^3=8 for m=5, an additional
        structural sanity check.
      matches_reported: not_applicable_never_computed_by_executor
      note: >-
        THIS IS THE MOST CONSEQUENTIAL FINDING OF THIS REVIEW. See
        central_question_item3_finding below for why this specific check
        is load-bearing and was never performed by the Executor's own
        submitted artifacts.
    - id: ITEM3C-STAGE5-MATCH-CHECK-NEVER-COMPUTED-BY-HARNESS
      method: >-
        Grepped run_experiment.py for n_match/group_law_root_set/
        matches_group_law: these appear ONLY inside stage0/stage1/stage2
        (lines 159,199,206,237,285,292,299); stage5_m4/stage5_m5 (lines
        428-505) never call group_law_root_set and never report an
        n_match/match field -- they report ONLY n_split_completely /
        split_rate (a WEAKER property: "factors into distinct linear
        terms of the correct degree" is not the same claim as "the root
        SET equals the group-law prediction"). Independently recomputed
        the ONE example execution_report.yaml cites by name
        (RUN-MONO-805a02-2, m=4, p=211: P1=(72,38), P2=(51,71), R=(51,71))
        AND ran a full independent recomputation of Stage 5 m=4 and m=5
        at both p (own seeds 0xA11CE/0xB0B0B for m=4, 0xC0FFEE/0xDEAD01
        for m=5, own fresh script v5_stage5_full_recompute.py, 30 trials
        per cell matching the contract's own floor), WITH the match check
        added.
      result: >-
        Cited example: deg=4, roots=[72,94,166] (len=3, hence "not split"
        under the strict test), group-law-predicted set
        {x(+-P1+-P2+-R)}={72,94,166} -- EXACT MATCH. Full independent
        recompute: m=4 p=211 30/30 split, 30/30 match; m=4 p=1009 30/30
        split, 30/30 match; m=5 p=211 29/30 split, 30/30 MATCH; m=5 p=1009
        29/30 split, 30/30 MATCH. Every trial's root SET equals the
        group-law prediction at both m and both p, on an INDEPENDENT
        30-trial sample per cell (different seeds from the Executor's own
        runs).
      matches_reported: >-
        Consistent with and strictly stronger than what execution_report.yaml
        reports (which never states a match rate for Stage 5 at all,
        only a split rate).
      note: >-
        This closes the gap identified in ITEM3B/ITEM3C: even though
        neither the harness's own code nor its report ever verify
        root-set matching for Stage 5, this independent recomputation
        confirms, on fresh samples, that Stage 5's measured near-complete
        splitting IS fully consistent with (not merely "explained away
        by prose reference to") the theorem, at both m=4 and m=5.
    - id: ITEM4-STAGE3-OPCOUNT-INDEPENDENT-RECOUNT
      method: >-
        Fresh script (v6_stage3_check.py), own counting wrapper around
        EllipticCurve.add (not importing AddCounter), own seed, m in
        {3,4,5,8}, 2000 attempts/cell (smaller than the contract's 1e5
