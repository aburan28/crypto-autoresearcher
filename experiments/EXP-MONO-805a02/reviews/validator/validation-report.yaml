      result: "m=3: 4000/4000; m=4: 6000/6000; m=5: 8000/8000; m=8: 14000/14000 -- exactly (m-1)*attempts in every case."
      matches_reported: true
    - id: ITEM6-STAGE4-DISCRIMINANT-IDENTITY
      method: >-
        Fresh script (v7_negloc_check.py), fully symbolic (general A,B,
        not numeric) recomputation of disc_T(s3_expr) - 16*f(x1)*f(x2)
        using the harness's own s3_expr.
      result: >-
        Symbolic difference simplifies to exactly 0 -- KN-FIND-c41ea9's
        own cited identity holds for THIS repository's actual s3_expr
        implementation, confirming stage4's Legendre-symbol-of-
        discriminant approach measures the quantity the theorem is about.
      matches_reported: not_stated_by_executor_but_consistent
    - id: ITEM6-STAGE4-EXACT-BOUND-CHECK
      method: >-
        Checked all 4 reported negative-locus split rates against
        KN-FIND-c41ea9's own EXACT closed-form bound
        |freq_split - 1/2| < 4/p (not just "close to 1/2" informally).
      result: >-
        RUN1 p211: dev=0.006525 < bound 0.018957 (PASS). RUN1 p1009:
        dev=0.003256 < bound 0.003964 (PASS, margin ~18%). RUN2 p211:
        dev=0.001960 < bound (PASS). RUN2 p1009: dev=0.000600 < bound
        (PASS). All 4 cells satisfy the theorem's own precise bound, not
        merely an informal "near 1/2" impression.
      matches_reported: true

