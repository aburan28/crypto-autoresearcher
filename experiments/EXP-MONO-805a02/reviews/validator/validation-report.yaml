  central_question_item3_finding: >-
    ITEM 3 -- THE CENTRAL QUESTION, both parts resolved independently.

    PART A (m=4, S4's symmetry): CONFIRMED, and more completely than the
    Executor's own artifact. run_experiment.py's stage5() checks only 2 of
    the 6 transpositions needed to rigorously justify "transpositions
    generate the full symmetric group, hence S4 is symmetric under every
    permutation" -- the two checked (x3<->x4, x1<->x4) connect only
    {1,3,4} in the transposition graph, leaving x2 unconnected, so the
    STATED justification does not by itself establish full S4 symmetry.
    This review checked all 6 transpositions directly (ITEM3A) and found
    all 6 identically zero, which DOES establish full S4 symmetry without
    gaps. The Executor's ultimate conclusion is therefore correct, but its
    own stated argument for it has an unremarked logical gap (a
    documentation/rigor defect, not a wrong conclusion).

    Given full S4 symmetry, the LOGICAL REDUCTION argument for Stage 5's
    m=4 case is valid and was walked through independently: Stage 5's
    actual construction (fix x1=P1,x2=P2,x4=T=Rt; free x3) equals, via the
    x3<->x4 identity S4(x1,x2,x3,x4)=S4(x1,x2,x4,x3), the SAME polynomial
    as evaluating S4 with slots (x1,x2,x3)=(P1,P2,Rt) fixed and slot x4
    free -- which is EXACTLY Stage 1's own already-verified construction
    (fix 3 rational x-coordinates, solve for the 4th), just with (P1,P2,Rt)
    playing the role of "the three fixed points." So Stage 5 m=4, as
    literally specified, reduces via ONE symmetric relabeling to the
    already-proven theorem. This chain is independently re-derived here,
    not merely accepted from the Executor's prose.

    PART B (m=5, S5's symmetry) -- THE GAP THE EXECUTOR'S OWN ARTIFACTS
    DID NOT CLOSE. The identical logical reduction for m=5 requires the
    analogous fact that the harness's OWN S5 construction (built via ONE
    FURTHER resultant elimination, a DIFFERENT and more complex
    construction than S4's) is symmetric under swapping x4<->T. Neither
    run_experiment.py's code NOR execution_report.yaml's prose ever states
    or checks this for S5 specifically -- stage5() computes a
    symmetry_finding block ONLY for S4 (m=4), and stage5_m5() builds a
    fresh S5 every trial with NO symmetry check and NO group-law-match
    check at all (see ITEM3C). Yet execution_report.yaml's
    "headline_consequence" and "symmetry_finding" text are placed as a
    SHARED preface to BOTH the m=4 and m=5 measured_split_rates blocks,
    giving the reader the impression that the m=5 near-complete-split
    numbers (83.3%-96.7%) are equally explained by a checked symmetry
    fact, when in the submitted artifacts they are not -- only the m=4
    case was actually checked.

    This review independently performed the missing check (ITEM3B): built
    the harness's own two-step S5 resultant construction with BOTH x4 and
    T left symbolic (a genuine bivariate object neither the harness nor
    the Executor ever constructs, since every stage always numerically
    fixes one of the two before eliminating the resultant variable), and
    confirmed x4<->T symmetry holds IDENTICALLY across 9 independent
    on-curve triples at both tested primes. This review additionally
    recomputed Stage 5 m=5 from scratch with the match-check the harness
    never computes (ITEM3C) and found 30/30 root-set matches at both p on
    a fresh, independently-seeded sample.

    CONCLUSION: the symmetry explanation for Stage 5 (both m=4 and m=5) is
    TRUE and the logical reduction is VALID -- Stage 5 as literally
    specified genuinely does not reach outside KN-FIND-c41ea9's theorem,
    at either tested m. But this conclusion, for m=5 specifically, is
    established by THIS REVIEW's own supplementary computation, not by
    the Executor's own submitted artifacts, which asserted it by analogy
    ("Semaev 2004", "not new to this record") without the
    construction-specific verification the task itself warns is necessary
    ("resultant elimination does not automatically preserve symmetry in
    an implementation, even though the true mathematical S_m has it").
    Had this review's Part B or ITEM3C check come out negative, Stage 5's
    m=5 "cheap result" would have remained a live, unexplained falsifier
    exactly as the frozen contract's own falsification_conditions
    anticipated -- the Executor's report would have been WRONG to fold it
    into the same "not new" narrative as m=4 without having checked it.
    As it happens the check comes out positive, so no correction to the
    substantive conclusion is needed, but the gap in what was actually
    verified before that conclusion was written is real and is reported
    here as a finding under this joint (see verdict_rationale).

