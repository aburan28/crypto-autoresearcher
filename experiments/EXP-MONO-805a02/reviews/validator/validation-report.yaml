        All 5 trials: s3_expr's two roots in T exactly equal
        {x(P+Q), x(P-Q)} computed via EllipticCurve.add, degree 2 both
        over Z and mod p in every trial.
      matches_reported: true
      note: Independently confirms the m=3 known-answer-edge identity holds beyond the fixture curve/prime, not merely reproducing Stage 0's own fixed instance.
    - id: ITEM1-STAGE1-FRESH-M4-SAMPLE
