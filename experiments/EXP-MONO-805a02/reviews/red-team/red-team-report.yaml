  # =====================================================================
  # ITEM 1 -- ADVERSARIAL ATTACK ON THE STAGE-5 "SYMMETRY EXPLAINS IT AWAY"
  # =====================================================================
  item_1_symmetry_narrative:
    verdict: holds_but_incomplete
    "1a_is_s4_expr_actually_symmetric":
      method: >-
        Fresh script (scratchpad rt1_symmetry.py), written from scratch, NOT
        reusing run_experiment.py's stage5() check. Built
        harness.semaev.s4_expr with SYMBOLIC curve coefficients a,b (the
        Executor tested only the concrete fixture a=37,b=57), expanded, and
        subtracted sigma(S_4) for ALL SIX transpositions (the Executor tested
        two) plus six random permutations.
      result: >-
        S_4 - sigma(S_4) expands to EXACTLY 0 for all six transpositions
        (x1x2, x1x3, x1x4, x2x3, x2x4, x3x4) and all six random permutations,
        over Z[a,b]. deg = 4 in each of the four variables; total degree 12;
        sympy.factor_list returns ONE factor of multiplicity 1, i.e. the
        resultant construction carries NO extraneous factor that could have
        supplied a spurious symmetry or a spurious root.
      finding: >-
        CONFIRMED, and strictly stronger than the Executor's check. The
        Executor's claim is true and its evidence was weaker than the claim
        (concrete a,b; two transpositions). Not an error, but the report
        should not have said "confirmed SYMMETRIC" on a single-curve check
        when the symbolic check costs two seconds.
    "1b_does_the_theorem_privilege_T":
      method: >-
        Re-read KN-FIND-c41ea9's statement and proof sketch, then tried to
        find a privileged role for T (different normalisation, sign
        convention, or degree-1-vs-2^{m-2} asymmetry).
      result: >-
        NO privileged role exists, and the reason is structural rather than
        incidental. The theorem's hypothesis is "x_1..x_{m-1} are
        x-coordinates of rational points" and its conclusion is about the
        roots in the remaining slot; the underlying characterisation
        (S_m(u_1..u_m)=0 iff there exist y_i with (u_i,y_i) on E summing to
        O) is manifestly symmetric in all m slots. T enters at degree
        2^{m-2}, the SAME degree as every other variable (verified above:
        deg=4 in each of S_4's four variables), so the
        "degree-1-vs-2^{m-2}" asymmetry the attack plan hypothesised does
        not exist. The Executor's logical step -- fixing m-2 summation
        coordinates plus the target T on-curve fixes m-1 of the m symmetric
        arguments, which IS the theorem's precondition -- is valid.
      finding: >-
        The argument holds. What it does NOT establish, and what the
        execution report presents it as establishing, is that the theorem's
        precondition is what CAUSES the observed complete splitting. See
        item 2: the precondition is sufficient, not necessary, and I
        exhibited the second sufficient case.
    proves_too_much_control:
      objects_tried:
        - "S_4 fibre with exactly ONE fixed coordinate off-curve (j=1)"
        - "S_4 fibre with exactly TWO fixed coordinates off-curve (j=2)"
        - "S_4 fibre with ALL THREE fixed coordinates off-curve (j=3)"
        - "S_5 fibre with j=1, j=2, j=4 among its four fixed coordinates"
      result: >-
        The symmetry argument does NOT go through where its conclusion is
        false (j=1, j=2: split rate 0.000 at both primes, both m) -- so it is
        not an artifactual proof. It DOES fail to predict the j=3 / j=4 case,
        where the conclusion is true for a different reason. That is a gap in
        coverage, not a refutation.

  # =====================================================================
  # ITEM 2 -- INDEPENDENT TEST OF A GENUINELY PARTIAL LOCUS
  # =====================================================================
  item_2_genuinely_partial_locus:
    verdict: symmetry_explanation_corroborated_and_superseded
    construction: >-
      Same free variable and same polynomial as Stage 5 (fix x1,x2,x4;
      root-find in x3 on harness s4_expr), but the fixed coordinates are
      drawn from declared residue classes instead of all being on-curve. My
      own root-finder and my own mod-p factor_list, not the Executor's.
      Metrics: complete splitting WITH MULTIPLICITY (which Stage 5 never
      measured), distinct-root splitting (Stage 5's own metric), and the full
      factor-degree multiset.
    independently_derived_law: >-
      Roots of S_m(u_1..u_{m-1}, X) are x(eps_1 P_1 + ... + eps_{m-1}
      P_{m-1}), eps in {+-1}^{m-1} modulo global sign, where P_i is a point
      with x(P_i)=u_i -- over F_p when f(u_i) is a square, else over F_{p^2}
      with phi(P_i) = -P_i. Frobenius therefore acts on sign vectors by
      flipping the signs at the NON-RESIDUE ("bad") coordinates. A root is
      F_p-rational iff that flip is the identity (bad set empty) or the
      global negation (bad set = ALL coordinates). Hence:
      COMPLETE SPLITTING iff j = 0 OR j = m-1, where j = #{i : f(u_i) is a
      non-residue}. KN-FIND-c41ea9 states only the j=0 branch.
    measured_results:
      m4_p211_200_trials_per_config:
        "A j=0 (Stage 5 as literally specified)": {split_with_multiplicity: 1.000, split_distinct: 0.975}
        "B target T ~ Uniform(F_p)": {split_with_multiplicity: 0.590, split_distinct: 0.565}
        "C target T forced NON-RESIDUE (genuinely partial)": {split_with_multiplicity: 0.000, split_distinct: 0.000}
        "D all three fixed coords uniform": {split_with_multiplicity: 0.220, split_distinct: 0.215}
        "E j=3, ALL THREE fixed coords OFF-CURVE": {split_with_multiplicity: 1.000, split_distinct: 0.975}
        "F j=1": {split_with_multiplicity: 0.000}
        "G j=2": {split_with_multiplicity: 0.000}
      m4_p1009_200_trials_per_config:
        "A j=0": {split_with_multiplicity: 1.000, split_distinct: 0.980}
        "B T uniform": {split_with_multiplicity: 0.540}
        "C T non-residue": {split_with_multiplicity: 0.000}
        "D all uniform": {split_with_multiplicity: 0.245}
        "E j=3": {split_with_multiplicity: 1.000, split_distinct: 0.990}
        "F j=1": {split_with_multiplicity: 0.000}
        "G j=2": {split_with_multiplicity: 0.000}
      m5_p211_15_trials_per_config:
        "A j=0 (four on-curve)": "15/15 split, shapes (1^8)"
        "C j=1 target off-curve (genuinely partial)": "0/15 split, shape (2,2,2,2) every trial"
        "E j=4 ALL FOUR off-curve": "15/15 split, shapes (1^8)"
        "G j=2": "0/15 split, shape (2,2,2,2) every trial"
    conclusion_on_the_executor_account: >-
      (1) CORROBORATED. A genuinely partial locus -- T left off the curve, so
      that only m-2 of the m-1 needed arguments are pinned -- does NOT split:
      0.000 at m=4 and 0/15 at m=5, both primes, with the fibre factoring
      into Frobenius-conjugate PAIRS ((2,2) at m=4, (2,2,2,2) at m=5) exactly
      as the sign-flip action predicts. So the Executor's diagnosis of WHY
      Stage 5 came out cheap is right: the literal Stage-5 construction does
      re-enter the theorem's scope, and removing the loophole removes the
      cheapness.
      (2) INCOMPLETE. Complete splitting is NOT a signature of the
      factor-base locus. The j=m-1 (all-coordinates-off-curve) locus splits
      completely too, at both m and both primes, and no part of
      KN-FIND-c41ea9, of H-MONO-40aca5, or of the execution report predicts
      or mentions it. "The partial locus splits completely because of
      symmetry" is therefore an account of one branch presented as an account
      of the phenomenon.
    residual_that_is_still_unexplained_in_the_record: >-
      NOTHING in Stage 5's own numbers is left unexplained -- see item 5,
      where I confirm the sub-100% distinct-split readings are multiplicity
      degeneracies. What is left unexplained BY THE RECORD is the scope of
      the phenomenon: the record's stated mechanism covers strictly less of
      the observed behaviour than the object actually exhibits.

  # =====================================================================
  # ITEM 3 -- STAGE 6 S-PRIME FINDING AND MISSED CELLS
  # =====================================================================
  item_3_stage6:
