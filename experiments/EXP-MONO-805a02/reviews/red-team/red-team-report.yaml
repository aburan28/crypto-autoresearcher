        ICEX}-001.yaml, ledger/evidence/, ledger/hypotheses/,
        ledger/decisions/ returns EMPTY. No write of any kind.
      - >-
        The only tracked modification in the whole worktree is
        .worktrees/ssi-cost-source-20260809 (a submodule pointer belonging to
        another session). Untracked additions outside this experiment
        (EXP-MONO-715694 validator scripts, GOAL-SSI-001 BATCH-5917d5,
        six TASK-20260830-* handoffs, root-level convert_qwen3.py /
