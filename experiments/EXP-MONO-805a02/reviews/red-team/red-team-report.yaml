  # =====================================================================
  # ITEM 7 -- BASELINE / UNIT-DECLARATION / EXPONENT SCOPE
  # =====================================================================
  item_7_baseline_and_units:
    asymptotic_claim_null_holds: true
    evidence: >-
      Grepped execution_report.yaml and run_experiment.py for
      ratio|speedup|faster|exponent|asymptot|rho|BSGS|Pollard. The report
      contains NO ECDLP claim, NO relation-rate claim, NO exponent claim, and
      does not mention Pollard rho or BSGS at all -- consistent with
      H-MONO-40aca5's `asymptotic_claim: null` and with a record that
      deliberately makes no attack claim.
    unit_tripwire_genuinely_unviolated: true
    evidence_2: >-
      The only division anywhere in the instrumented code is
      calls / attempts (same units) and hits / trials (dimensionless rate).
      No Stage-3 number is divided by, multiplied with, or compared against
      any Stage-5 or Stage-6 number anywhere in the code or the report. The
      refusal is real, not decorative.
    baseline_comparison: >-
      NOT APPLICABLE AS A SPEEDUP CLAIM, and correctly so. For completeness
      the correct frame is unchanged by this record: formulation E's
      per-attempt cost of m-1 additions multiplies an attempt count of
      Theta(|F|^{m-1}) (or |F|^{ceil(m/2)} with a van Oorschot-Wiener-style
      meet-in-the-middle join at memory |F|^{ceil(m/2)}), which the record's
      own prior catalogue work places STRICTLY WORSE than Pollard rho's
      O(sqrt(N)) time / O(1) memory at every finite m. Nothing measured here
      moves that. dominated_by for the composed procedure is Pollard rho on
      the time axis and Pollard rho on the memory axis simultaneously;
      sota_delta = 0 on every attack axis. I checked this against all three
      axes (time, memory, data) rather than the headline baseline alone.
    cost_bookkeeping_objection: >-
      The per-attempt cost is reported WITHOUT the success probability, in
      violation of H-MONO-40aca5's own confounder ("D_trial(E)=m-1 must
      always be reported beside the attempt count, never alone") and of the
      target-profile rule that total expected cost = per-attempt cost x
      inverse success probability. The raw JSON HAS the data --
      hits_in_factor_base is 57.2-59.2k/100k at p=211 and 11.3-12.0k/100k at
      p=1009, flat in m across m=3..8 -- and the execution report's
      stage3 block omits it entirely. I ran the artifact-tell check on that
      flatness and it PASSES as a controlled null: the hit rate should be
      2|F|/#E independent of m once the residual is near-uniform, and
      2*64/216 = 0.59 (p=211) and 2*64/1009 = 0.127 (p=1009) match the
      measurements, so flat-in-m is the correct behaviour here, not an
      artifact. What the report should say and does not: the Stage-3 factor
      base is 64 of the 111 on-curve x-coordinates at p=211, i.e. 57.7% OF
      THE ENTIRE CURVE, so the success probability measured is a toy-scale
      artifact of factor-base density and carries no transfer to any
      realistic |F|/#E.

