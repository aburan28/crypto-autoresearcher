      broader enumeration (directory listing of experiments/EXP-{SIG,DREG,
      SDEG,ICEX}-* plus ledger/evidence/) finds, committed on this same
      branch and NOT mentioned anywhere in the table:
        * EXP-SIG-002, -003, -004, -005, -006, -007, -008 (seven approved
          experiments, hypothesis_id H-SIG-001, with 9/9/9/14/6/20+/20+
          committed run directories respectively);
        * EXP-DREG-002 (3 committed runs) and EXP-DREG-004 (30+ committed
          runs) -- the Executor cites EV-DREG-004 but never the experiment
          that produced it;
        * EXP-ICEX-01a79b, EXP-ICEX-b8b2b6 (GOAL-ICEX-001, review_required);
          EXP-DREG-519ad9, EXP-DREG-9ac65a; EXP-SIG-4fe529, EXP-SIG-c9fda8;
        * evidence records EV-DREG-006/007/008/354ef9/39e13d/4500cd,
