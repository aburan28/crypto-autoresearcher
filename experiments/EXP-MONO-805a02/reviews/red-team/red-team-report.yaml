      their committed runs contains a gstar cell or a `p` parameter, and
      their sources are GF(2)-dominated. EXP-DREG-002/004 sources contain
      GF(2) only and no EllipticCurve/PolynomialRing over F_p. All three
      committed ICEX evidence records state in terms that no measurement was
      executed (EV-ICEX-001: "No ICEX measurement or solver campaign was
      executed"; EV-ICEX-2be32e and -82d77c: "THIS RECORD ASSERTS NO
      MEASUREMENT"). So the additional cells would all label S-extension or
