  spawned_ids_and_resource_reading:
    obstruction_reversed: >-
      KN-FIND-c41ea9 records its m>=4 result as an OBSTRUCTION to KN-OPEN-009
      ("a generic-fibre Frobenius census measures a quantity that is constant
      where relation search operates ... Any m >= 4 census should answer this
      before spending budget") and states that at m >= 4 the
      imprimitivity/block-system question "is genuinely open". Read as a
      resource instead: the same sign-vector structure that makes the
      factor-base fibre constant also PINS the generic monodromy. The roots
      of S_m in one variable are indexed by {+-1}^{m-1} modulo global sign,
      and every Frobenius element acts by flipping a subset of signs, so the
      geometric/arithmetic Galois image of the generic fibre is contained in
      (Z/2)^{m-1}/{+-1} ~= (Z/2)^{m-2} acting REGULARLY on the 2^{m-2} roots
      -- hence transitive, abelian, and (for m >= 4) IMPRIMITIVE, with an
      explicit block system given by the coordinate subgroups.
    evidence_i_measured_for_it:
      - "m=4, uniform specialisations, p=211, n=400: observed squarefree factor shapes are ONLY (1,1,1,1) and (2,2). Never (4), (1,3), or (1,1,2) outside degeneracies."
      - "m=4, uniform, p=1009, n=400: same."
      - "complete-split rate 0.230 (p=211) / 0.260 (p=1009) vs 1/4 predicted by |V_4 identity| / |V_4| and vs ~1/24 for a uniformly random quartic."
      - "m=5, p=211: non-split fibres factor as (2,2,2,2) every time -- a fixed-point-free involution on 8 roots, i.e. a regular (Z/2)^3 action."
    consequence_offered_not_asserted: >-
      If this holds (it is elementary and I believe it does, but it is a
      DERIVATION I ran in a review session, at toy scale, with no independent
      re-derivation), then KN-OPEN-009's m >= 4 monodromy question is answered
      in the negative for the summation cover in one variable, and the
      "imprimitivity / block-system / resolvent mechanism the open problem
      hunts" exists trivially and carries no relation-rate advantage --
      which would make the m >= 4 census KN-FIND-c41ea9 recommends
      unnecessary rather than merely uninformative.
    status: >-
      CANDIDATE FOR THE RANKING, NOT EVIDENCE. It changes no status, closes
      no open problem, and is not a finding of EXP-MONO-805a02. It belongs in
      a fresh proposal under RQ-MONO-001 with its own contract and its own
      independent re-derivation, and the closure standard in
      docs/inventor-protocol.md section 4 applies to it in full -- including
      that "the monodromy is small" is a claim about the object that needs a
      named obstruction, an argument, and forward guidance before anyone
      treats it as closing KN-OPEN-009.

  narrowest_supported_statement: >-
    On the branch and working-tree state hashed above, at p in {211, 1009}:
    (1) formulation E's instrumented per-attempt cost is exactly m-1 calls to
    EllipticCurve.add plus one hash lookup, at every m in {3..8}, in both
    runs, with zero polynomial arithmetic in the instrumented path;
    (2) KN-FIND-c41ea9's m=4/p=211 census reproduces at 193/193 on root-set
    equality under a freshly seeded reconstruction, and that reconstruction
    rejects every one of six deliberately wrong implementations at 0/193;
    (3) the m=5 extension matches the group-law prediction at 30/30 per prime
    (single sample, shared across both runs by a disclosed seeding defect);
    (4) the m=3 negative-locus null reads 0.493-0.503, not 1;
    (5) Stage 5's cheap result is correctly attributed to the permutation
    symmetry of S_4/S_5 placing the construction inside KN-FIND-c41ea9's own
    precondition -- and complete splitting of the S_m fibre is governed by
    the strictly broader condition "j = 0 or j = m-1", of which the theorem's
    precondition is the j=0 branch;
    (6) EXP-SIG-001's Yokoyama panel arm (RUN-EXP-SIG-001-d, p = 1000003
    prime, 21 gstar cells, ideal over GF(p) with prime-field
    factor-base-forcing generators) is a committed prime-field
    formulation-S cell, refuting the frozen S-extension prediction, and it is
    the only such cell among the artifacts anyone in this round has
    enumerated;
    (7) nothing here bears on ECDLP hardness, on any relation rate, or on any
    exponent, in either direction.

  next_concrete_action: >-
    Before the Coordinator writes an evidence record, have the Executor (or a
    scoped successor task) add ONE stage to the harness and re-run only that
    stage into a superseding run record: the residue-class-stratified fibre
    census (j = 0, 1, ..., m-1 for m in {4,5}, both primes, >=200 trials per
