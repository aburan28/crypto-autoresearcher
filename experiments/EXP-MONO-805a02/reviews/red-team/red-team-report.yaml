  proof_architecture_challenges:
    - attack: observation-fiber
      result: >-
        BREAKS THE STATED SEPARATOR. Hold the observable "the specialised
        fibre splits completely over F_p" fixed and vary the object: I placed
        a preimage on each side of the record's conclusion -- the
        factor-base-complete locus (j=0) and the all-off-curve locus (j=m-1)
