  # =====================================================================
  # ITEM 4 -- PROVES-TOO-MUCH / KNOWN-FALSE-OBJECT ON STAGE 1
  # =====================================================================
  item_4_reconstruction_power:
    verdict: the_test_has_genuine_discriminating_power
    method: >-
      Built five deliberately WRONG S_4 constructions and one deliberately
      wrong group-law prediction, and ran the identical 193-triple census
      (identical seeding, identical curve, identical root-finder) on each.
    results:
      "CONTROL correct s4_expr, correct curve": {set_match: "193/193", distinct_split: "193/193"}
      "MUTANT 1 S_4 built for a=38 (wrong curve)": {set_match: "0/193", distinct_split: "53/193"}
      "MUTANT 2 S_4 built for b=58 (wrong curve)": {set_match: "0/193", distinct_split: "47/193"}
      "MUTANT 3 sign error in S_3 constant term (+4b(x1+x2))": {set_match: "0/193", distinct_split: "30/193"}
      "MUTANT 4 (x1x2+a)^2 instead of (x1x2-a)^2": {set_match: "0/193", distinct_split: "25/193"}
      "MUTANT 5 product-at-t=0 instead of resultant": {set_match: "0/193", distinct_split: "0/193"}
      "MUTANT 6 prediction = {x(P1+P2+P3)} only, no sign orbit": {set_match: "0/193"}
    interpretation: >-
      193/193 on the AUTHORITATIVE metric (root-set equality against the
      group law) is NOT a foregone conclusion of the test setup: every mutant
      scores 0/193 on it, including mutations of the curve, of S_3's sign
      conventions, and of the group-law prediction itself. The reconstruction
      is real evidence of implementation correctness.
      CAVEAT, and it is the reason the Executor's own gate wording matters:
      the SECONDARY metric (distinct_split alone) is weak -- wrong-curve
      mutants still score 25-53/193 on it -- so a reviewer who read only
      "193/193 split completely" would have far less than they think. The
      Executor is right to call set-equality the authoritative metric and
      wrong to lead the report's stage1 block with n_split_completely.
    unverifiable_replication_claim_found: >-
      implementation.md asserts "Stage 1/3/4/5 raw-result.json content
      differs between the two runs beyond timing fields". FALSE FOR STAGE 1.
      I diffed both runs' raw-result.json with all wall/sec fields stripped:
      stage3, stage4 and stage5 differ; stage0, stage2, stage6 and STAGE 1
      are identical. Stage 1 records no sample-dependent field at all (both
      runs recorded 193, 193, first_mismatch null), so the artifacts contain
      NO evidence that the two runs drew different triples -- for the one
      stage that is the hard gate and the baseline-reproduction control.
      I supplied the missing evidence myself: replaying stage1's own seeding
      gives triple-sample sha256[:16] = d03f0658e9101a05 for seed 20260830
      and 01eda2f477ea138a for seed 20260831, both scoring 193/193. So the
      substance is fine and the ARTIFACT is deficient; the fix is a
      per-run sample digest field, not a re-run.

  # =====================================================================
  # ITEM 5 -- DOES THE DEGREE-BUG FIX HIDE A RELATED UNCAUGHT BUG?
  # =====================================================================
  item_5_degree_computation:
    verdict: fix_is_correct_at_m4_and_m5_no_related_bug_found
    what_causes_the_drop: >-
      I identified the exact algebraic trigger rather than taking the
      Executor's description on trust: the leading coefficient of S_4 in the
      free variable is a degree-8 polynomial in the other three, and it
      vanishes mod p EXACTLY when some signed combination +-P_1+-P_2+-P_3
      equals the point at infinity. So the drop is constructible on demand by
      taking P3 = P1 + P2, not merely observable by luck.
    adversarial_cases_run_against_the_FIXED_code:
      - case: "m=4, Stage-1 path, P3 = P1+P2 (p=211, P1=(3,..), P2=(7,..))"
        lc_mod_p: 0
        fixed_code_result: "deg=3, 3 distinct roots [37,129,159], SET MATCH vs group law = True, split = True"
        prefix_code_would_have_said: "over-Z degree 4 -> NON-SPLIT (this is the disclosed 3/193 bug, reproduced)"
      - case: "m=4, p=1009, RUN-2's OWN recorded non-split cell P1=(110,0) P2=(435,32) R=(637,9)"
        fixed_code_result: "deg=4, distinct roots [374,1002], SET MATCH = True"
        my_factorisation_mod_p: "(x3 + 7)^2 * (x3 - 374)^2 -- splits completely WITH MULTIPLICITY"
        diagnosis: >-
          P1=(110,0) is the curve's rational 2-torsion point, so -P1 = P1 and
          the four sign classes collapse to two. The Executor's report
          discusses the p=211 example (R == P2) and never this one; I confirm
          both are degeneracies, not theorem failures.
      - case: "m=4, forced DOUBLE drop: P3 = 2-torsion AND P1+P2 = P3 (p=1009)"
        fixed_code_result: "deg=2, 1 distinct root [737], SET MATCH = True, distinct-split = False"
        note: "the fix computes the doubly-dropped mod-p degree correctly"
      - case: "m=5, Stage-2 path (build_s5_root_set_and_deg), forced lc_U(S_4) == 0 mod p"
        fixed_code_result: "deg=8, 7 distinct roots, SET MATCH vs group law = True"
      - case: "m=5, Stage-5 inline path, same forced drop"
        fixed_code_result: "deg=8, 7 distinct roots, SET MATCH = True"
      - case: "m=5 generic control (no drop)"
        fixed_code_result: "deg=8, 8 distinct roots, SET MATCH = True"
    latent_hazard_identified_then_shown_self_masking: >-
      A DIFFERENT bug of the same family is latent in Stage 2 / Stage 5-m5
      and is NOT disclosed anywhere: those stages take
      sympy.resultant(f, g, U) OVER Z and only then reduce mod p. That is
      only equal to the resultant of the reductions when deg_U f does not
      drop mod p; when it does, Res_Z(f,g) mod p acquires a factor
      lc_U(g-bar)^(deg f - deg f-bar), and lc_U(g) here is (x(P4) - T)^2 --
      a polynomial in the very variable being solved for. So a spurious root
      at T = x(P4) is injected exactly in the degree-drop case. I built that
      case and it did NOT produce a wrong answer, and I can say why: the
      trigger condition (some +-P_1+-P_2+-P_3 = O) is precisely the condition
      that makes +-P_4 itself a legitimate member of the group-law root set,
      so the injected root is always a genuine root. The hazard is
      structurally self-masking at these m. RECORD IT ANYWAY: it is
      undisclosed, it was not reasoned about, and nothing in the record shows
      it would still be benign if the S_5 recursion were split differently
      (e.g. Res of S_4 against S_4) or extended to m=6.
    stage4_checked_separately: >-
      stage4() also uses an over-Z degree test (`if poly.degree() != 2:
      continue`), i.e. the same code smell in an unfixed location. Here it is
      harmless: the leading coefficient is (v1-v2)^2, whose vanishing over Z
      and mod p coincide for v1,v2 in [0,p). No defect.

  # =====================================================================
  # ITEM 6 -- SCOPE CREEP / WRITES TO OTHER GOALS
  # =====================================================================
  item_6_scope_and_writes:
    verdict: clean
    checks:
      - >-
        `git status --porcelain` over experiments/EXP-SIG-001,
        EXP-DREG-001/002/004, EXP-SDEG-0be8e4/0d4fec/f7faa8,
