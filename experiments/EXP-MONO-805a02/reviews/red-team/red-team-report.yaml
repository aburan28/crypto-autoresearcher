        extension unless the caller passes a prime POWER. The caller is
        SIG_run.sage line 187 (`F = GF(args.p)`), `--p` default 1000003.
        The COMMITTED run's own manifest
        (runs/RUN-EXP-SIG-001-d/manifest.yaml) and raw.json args both pin
        p = 1000003, which I verified prime by trial division. GF(1000003)
        is a prime field. The label survives.
      - >-
        ARM ATTRIBUTION. I counted kind=="gstar" cells in all four committed
        EXP-SIG-001 runs: run a (mode gate) 0, run b (mode boolean) 0, run c
        (mode boolean) 0, run d (mode panel) 21. So the prime-field arm is
        exactly run d and the boolean arms are exactly a/b/c, as the
