        [prod(x_i - r for r in base) for i in 1..m] + [S_{m+1} with target
        xR substituted]; R = PolynomialRing(F, names, order='degrevlex');
        measurement = buchberger_instrumented -> #G*. No GF(2), no boolean
        variable, no Weil descent anywhere in this code path.
      - >-
        DISGUISED-EXTENSION-FIELD ATTACK, run and FAILED to break it. The
        only producer of E is build_panel(p) (line 490), which opens with
        `F = GF(p)` and constructs every panel member and every isogenous
