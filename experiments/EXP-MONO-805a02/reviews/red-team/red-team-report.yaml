  counterexample_or_mutation: >-
    The cheapest discriminating object is the ALL-OFF-CURVE fibre. Take m=4,
    p=211, and three x-values u1,u2,u3 each with f(u_i) a quadratic
    NON-residue. Every hypothesis in this record predicts nothing about it;
    KN-FIND-c41ea9's precondition fails maximally; and S_4(u1,u2,u3,X) splits
    into four distinct linear factors over F_p, 200 times out of 200, at both
    tested primes, and 15/15 at m=5. One minute of compute. It does not break
    any measured number in EXP-MONO-805a02, and it breaks the record's
    framing of what its own Stage-5 result means.

  baseline_comparison: >-
    No baseline is claimed and none is owed: the record moves no exponent in
    either direction and its own asymptotic_claim is null. Checked against
    all three Pareto axes anyway: formulation E composed end to end costs
    Theta(|F|^{m-1}) attempts x (m-1) additions in time with |F| words of
    memory, or Theta(|F|^{ceil(m/2)}) time and memory under a
    meet-in-the-middle join; Pollard rho is O(sqrt N) time and O(1) memory
    and dominates on BOTH axes for every finite m at any |F| that keeps the
    relation count feasible. dominated_by = {Pollard rho (time), Pollard rho
    (memory), BSGS (time, at O(sqrt N) memory)}; sota_delta = 0. This is
    consistent with what the record says and is recorded here because
    `dominated_by: null` anywhere in this lane would be a fabrication.

  heuristic_challenges:
