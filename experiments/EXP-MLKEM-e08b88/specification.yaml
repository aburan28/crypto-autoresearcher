# EXPERIMENT CONTRACT -- EXP-MLKEM-e08b88 (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLKEM-e08b88
  hypothesis_id: H-MLKEM-102e08
  derived_from_idea: IDEA-20261018-5272db
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Rotation augmentation gain versus projection depth in G6K
  objective: >-
    Decide whether the negacyclic rotation orbit gives any measurable sieve saving inside
    the projected contexts real attacks use.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: >-
      G6K (Python/C++) with a small augmentation hook in the insert path, fpylll, SageMath
      for lattice construction
    parameters: >-
      n in {16,32}, k in {2,3}, q=3329, CBD(2); d in {64,96}; projection depth i in {0,4,8,d/8,d/4,d/2};
      10 instances per (n,k); saturation 0.9
    procedure: >-
      1) Freeze protocol. 2) Build lattices and LLL/BKZ-20 preprocess. 3) For each i run plain
      and augmented sieves from identical seeds. 4) Record iterations, pair tests, time. 5)
      Fit ratio(i) and test P1/P2.
  controls:
  - >-
    null: unstructured q-ary lattice of the same dimension and determinant with 'rotations'
    applied as random signed coordinate permutations (orbit is not in the lattice) - augmentation
    must not help
  - >-
    positive: ideal lattice (k=1) full sieve, where the orbit is exact and the published gain
    should reproduce
  - 'A/A: plain arm run twice with different database-initialization seed blocks'
  independent_variables:
  - augmentation
  - projection_depth
  - lattice_family
  metrics:
    primary:
    - iterations-to-saturation ratio
    - pair-test ratio
    secondary:
    - wall-clock ratio
    - database size at saturation
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: pair-test ratio at i=0 and at i=d/4
    formula: ~2n at i=0 bounded by duplicates; ~1 for i>=d/4
    source: orbit size argument; Bos-Naehrig-van de Pol (recalled)
  scale_relevance:
    tier: toy
    justification: >-
      d=64..96; transfer assumption: if the gain is already ~1 at i=d/4 it is ~1 at the i~d-beta
      used for FIPS 203
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
    - 2026101805
    - 2026101806
    - 2026101807
    - 2026101808
    - 2026101809
    independent_instances: 10
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 40
    maximum_memory_gb: 16
    maximum_runs: 480
  stopping_rules:
  - stop if positive control shows no gain on 5 instances
  invalidation_rules:
  - timeout/crash/OOM is failed_infrastructure, never negative evidence
  - >-
    any instance whose recovered secret fails the independent check (A*s+e == t mod q, CBD
    support) is discarded and logged, never counted as a success
  - >-
    protocol, seeds and analysis script frozen and hashed in manifest.yaml before the first
    timed run; any change voids the batch
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    C1 at i=0 shows ratio >= 4 (P1) and C2 shows the ratio falling to <= 1.1 by i=d/4 (P2),
    both outside the AA1 noise floor.
  falsification_criterion: >-
    C2 shows ratio >= 1.5 at i=d/4 (P2 falsified) or C1 ratio < 2 at i=0 on module lattices
    (P1 falsified).
  decision_impact:
    on_positive: >-
      Close the rotation-reuse-in-sieving lane for the projected BKZ setting with a measured
      decay curve; keep it only for full-lattice final sieves in hybrid attacks.
    on_negative: >-
      If gain survives projection, open a lane to price rotation-augmented pumps at FIPS block
      sizes.
  variable_ledger:
    independent:
    - name: augmentation
      levels:
      - 'off'
      - rotations_on
    - name: projection_depth
      levels:
      - '0'
      - '4'
      - '8'
      - d/8
      - d/4
      - d/2
    - name: lattice_family
      levels:
      - module_kyber_shape
      - unstructured_null
      - ideal_positive
    factors:
    - name: db_seed_block
      treatment: randomized
      value: A,B
      how: seed for initial database sampling
    - name: threads
      treatment: fixed
      value: '8'
      how: taskset pinned
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - rotations_on
      - 'off'
      differs_in:
      - augmentation
      design: one_factor
    - id: C2
      arms:
      - ratio curve over projection_depth
      differs_in:
      - projection_depth
      - augmentation
      design: factorial
    - id: AA1
      arms:
      - off db_seed_block A
      - off db_seed_block B
      differs_in:
      - db_seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-5272db.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-5272db.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with frozen protocol hash, tool versions (fpylll/G6K/Sage commit ids), host
    and seeds
  - raw-result.json with one row per (arm, instance, seed) including verification flag
  - analysis.json with effect sizes, bootstrap CIs and the AA noise floor
  - report.md plus graph (SVG/PNG) and PDF per the research-visuals skill
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-MLKEM-e08b88/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-5272db.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
