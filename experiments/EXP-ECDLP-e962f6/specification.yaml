experiment:
  id: EXP-ECDLP-e962f6
  id_allocation_provenance: >-
    Pre-minted and verified free on origin/main by the orchestrating
    session before this design (2026-09-09); relayed in the design
    instruction for IDEA-20260906-ac100b. Not derived by scanning state.
  hypothesis_id: H-ECDLP-f2bdd0
  derived_from_idea: IDEA-20260906-ac100b
  question_id: RQ-ECDLP-78dbc5
  goal_id: null
  version: 1
  status: approved
  approved_by: coordinator
  approval_decision: DEC-20260909-0d8274
  frozen: true
  execution_authorized: true
  execution_authorized_stages: [1, 2]
  execution_authorized_note: "Stage 0 is a reserved validator audit (a separate task, not an executor run); only Stages 1-2 may execute under this approval; any further stage requires a new Coordinator decision."
  designed_by: coordinator
  designed_at: '2026-09-09'
  approval_note: >-
    APPROVED by the Coordinator under the standing user authorization of
    2026-09-06 ("all is approved. ideas/experiments should be always
    approved"; AGENTS.md "Standing user authorization for ideas and
    experiments"), recorded in DEC-20260909-0d8274. Protocol readiness
    verified before approval: stage plan, inputs, the four controls
    (independent re-derivation per lemma, permutation nearby-object,
    exact-enumeration anchor, proves-too-much non-uniform rule) plus the
    N-decay control, independent variables, metrics with units and
    tolerances (the 15% decidable-negative band and the N^{-1/3} decay
    checks D1-D3), seeds for every numeric stage, replication, the
    advisory budget, stopping and invalidation rules (including the
    validator-disagreement handling), success and falsification criteria,
    required artifacts (including the derivation document with per-lemma
    check boxes), and the committed handoff TASK-20260909-2989a0 are all
    present. Pre-approval note (preserved verbatim): "DESIGNED, NOT
    APPROVED. Designing an experiment is not approving it (AGENTS.md "ECC
    comes first", item 3). This contract confers no execution authority
    and no run under it can be evidence until a committed Coordinator
    decision marks it approved. Class: OTHER -- VERIFICATION-PROTOCOL for
    a derivation artifact (per Coordinator verdict
    ses_f7c589781ffeGfc3ONOpFH2U7b): the deliverable is a checkable
    derivation with explicit, checkable derivation steps, not a compute
    experiment; the compute is minutes-scale and exists to check the
    derivation, never the other way round."

  class: verification_protocol

  title: >-
    VERIFICATION PROTOCOL FOR THE BOREL CEILING DERIVATION (Lemmas 1-6 of
    IDEA-20260906-ac100b): Stage 0 zero-compute validator audit of the
    derivation document; Stage 1 minutes-scale quadrature table with the
    committed anchor values as digit-for-digit fixture, a permutation
    nearby-object control, a proves-too-much non-uniform-rule control, and
    one exact-basin array pass at N = 2^26; Stage 2 read-only re-read of
    the committed exact-enumeration residuals (EXP-ECDLP-869870 at
    N in {2^20, 2^22, 2^24}, EXP-ECDLP-612fb1 anchor values) with the
    N^{-1/3} decay check and the 15% decidable-negative band at 2^26

  objective: >-
    Convert the (B1)-(B3) closed forms of IDEA-20260906-aed829, carried as
    a proof-shaped claim in IDEA-20260906-ac100b, into a checkable
    derivation artifact (never "proved"): Lemmas 1-6 with explicit error
    terms, two independent routes per lemma, and the quantifier statement,
    verified by (i) a zero-compute independent validator audit (Stage 0,
    separate reserved task), (ii) a minutes-scale quadrature table that
    reproduces the committed anchor values digit-for-digit, a permutation
    nearby-object control that must collapse the ceiling as predicted, a
    proves-too-much non-uniform-rule control that must fail loudly, and
    one exact-basin array pass at N = 2^26 (Stage 1), and (iii) a read-only
    re-read of the committed exact-enumeration residuals with the N^{-1/3}
    decay check (Stage 2). The decidable negative is frozen: C_max(1/4)
    differing from the exact top-T share by more than 15% at N = 2^26 with
    residuals not shrinking as N^{-1/3}, or a validator exhibiting a
    stored set beating C_max(a)(1+o(1)) under H1, withdraws the ceiling
    and replaces it with the exact enumeration.

  definitions:
    N: size of the set / order of the group
    T: nominal table size, N^{1/3} rounded to a power of two (64, 128, 256, 256, 1024 at N = 2^20, 2^22, 2^24, 2^26, 2^30)
    W: expected walk length between DPs, W = sqrt(a N / T); theta = 1/W
    a: T W^2 / N; 1/4 primary, {1/8, 1/2, 1} for the quadrature table
    B(d): basin of DP d, the set of x whose forward orbit reaches d before any other DP
    C(X): exact coverage of a stored set X, sum over d in X of |B(d)| / N
    C_max(a): erfc(sqrt(x*/2)), x* the root of 2 x*^{-1/2} e^{-x*/2} - sqrt(2 pi) erfc(sqrt(x*/2)) = a sqrt(2 pi)
    C_rand(a_m): 1 - (1 + 2 a_m)^{-1/2}, a_m = m W^2 / N (the unselected law, Lemma 4)
    top_T_share: sum of the T largest exact basin sizes divided by N (cap 8W)
    corrected residual: R(N) = (top_T_share + cycle_mass_frac + capped_mass_8W_frac - C_max(a)) / C_max(a); the cycle and capped mass are added back because they are not in the model (confounder of the idea)
    raw ratio: top_T_share / C_max(a), as committed in the run summaries
    T W/N: "the permutation-object ceiling scale; at N = 2^20, a = 1/4, T = 64, W = 64: T W/N = 2^{-6} = 0.015625, 3 T W/N = 0.046875"
    anchor values: the committed c_max_numeric / x_star_numeric of RUN-ECDLP-869870-011-N24-s1 (cross-checked against RUN-ECDLP-612fb1-002 for a = 1/4), listed in inputs.residual_reread.anchor_values

  inputs:
    stage_plan: >-
      STAGE 0 (zero compute, HARD GATE on the ceiling claim; separate
      reserved validator task, NOT a run of this experiment): an
      independent validator (review-adversarial, independent session)
      reads the derivation document and, for each of Lemmas 1-6, either
      accepts the stated error terms, corrects them (recording the
      corrected term), or refutes the lemma with a counterexample. The
      validator also checks the quantifier statement and the two-routes
      agreement per lemma. All three outcomes are deliverables. The
      ceiling claim is not citable until this audit completes; the
      Stage 1-2 measurements stand on their own regardless (the exact
      shares are measurements, not model claims).
      STAGE 1 (minutes scale, new compute, bounded; runs 001-006):
      (001) the quadrature table; (002) the N = 2^26 exact-basin anchor;
      (003-005) the permutation nearby-object control at N = 2^20, seeds
      1-3; (006) the proves-too-much non-uniform-rule control at
      N = 2^20, seed 1. STAGE 2 (no new compute, read-only; run 007):
      re-read the committed summaries and produce the residual table and
      the decay check. Stage order is binding: 001 before 002-006 are
      interpreted (the quadrature is the fixture every other number is
      compared against); 007 last (it consumes 002's anchor value).
    derivation_document: >-
      experiments/EXP-ECDLP-e962f6/derivation/derivation-lemmas-1-6.md:
      for EACH of Lemmas 1-6 a block with: (i) the statement with explicit
      error terms (the O(theta) rate, the N-dependence of Lemma 2 stated
      in the right metric, the concentration term of Lemma 5); (ii) ROUTE
      A, the main derivation (the idea's route); (iii) ROUTE B, an
      independent route to the same formula (control C1): Lemma 1 -- a
      direct counting argument via the functional-graph cycle
      decomposition, checked against the committed partition identity
      (sum of basin sizes + cycle mass = N, digit-for-digit on the
      committed data); Lemma 2 -- the generating-function fixed point of
      the Poisson(1-theta) Galton-Watson total progeny (the classical
      Otter/Dwass route, independent of the tree-exploration coupling),
      with the N-dependence error stated separately; Lemma 3 -- the
      Aldous-Pitman size-biased identity (recalled pointer, stated as
      such) plus a numerical check of the size-biased distribution on the
      committed basin multisets; Lemma 4 -- the discrete sum with the
      EXACT Borel pmf (no asymptotics) evaluated numerically, as a
      different route from the asymptotic integral of Route A; Lemma 5 --
      the expected top-T sum via the survival-function integral
      sum_{k=1..T} integral P(at least k basins exceed t) dt evaluated by
      a different quadrature than Route A's integration by parts; Lemma 6
      -- a first-step / renewal analysis of the restart cost, independent
      of the memorylessness shortcut; (iv) the measured agreement of
      Routes A and B (to four digits, stated per lemma); (v) the
      citations with provenance exactly as recorded in
      H-ECDLP-f2bdd0 (recalled entries stay recalled; none may be
      upgraded without a recorded fetch); (vi) a per-lemma check box
      block: [ ] statement with explicit error terms, [ ] Route A,
      [ ] Route B, [ ] routes agree to four digits, [ ] citations with
      provenance, [ ] self-check complete (executor); the Stage 0 audit
      verdicts are NOT written into this document (it is immutable once
      archived) -- they are recorded in the validator's report. The
      document also contains: the quantifier statement verbatim from
      H-ECDLP-f2bdd0; the baseline-embedding check (Lemma 4 at a_m = 1
      gives 0.423; Lemma 5 at a = 1 gives 0.66; both in (0,1), selected
      above unselected); the permutation collapse argument (why the tree
      branching is load-bearing: in a permutation every in-degree is 1,
      there are no trees, the "basins" are cycle segments of geometric
      size with mean W, and the top-T sum is of order T W (ln(N/W) + 1),
      i.e. O(T W/N) of the set, not C_max(a)); and the proves-too-much
      argument (why the non-uniform {0, 2theta} rule breaks Lemma 6: the
      walk length is a mixture of a fast component (starts in the marked
      half, about Geometric(2theta), mean W/2) and a slow component
      (starts in the unmarked half, hitting time plus Geometric(2theta)),
      with mixture mean about W/2 + 1, not W, and the mixture is not
      geometric).
    quadrature: >-
      RUN-ECDLP-e962f6-001 (deterministic; no seed; method, grid and
      tolerance recorded in the manifest): solve the root equation
      2 x*^{-1/2} e^{-x*/2} - sqrt(2 pi) erfc(sqrt(x*/2)) = a sqrt(2 pi)
      for x* at a in {1, 1/2, 1/4, 1/8} and on a fine grid a in [0.05, 2]
      step 0.001; compute C_max(a) = erfc(sqrt(x*/2)) and
      sqrt(a)/C_max(a). Method: bisection bracketing plus Newton
      refinement on the root equation, erfc from the standard library
      function named in the manifest; the assembly minimum located on the
      fine grid. Tolerances: (Q1) reproduce the committed anchor values
      (inputs.residual_reread.anchor_values) to within 5e-5 (four digits)
      at all four a values; (Q2) the assembly minimum of
      sqrt(a)/C_max(a) on the fine grid lies at a in [0.2, 0.25] and its
      value is within 0.01 of 1.28; (Q3) the baseline-embedding values
      0.423 (a_m = 1) and 0.66 (a = 1) reproduced to within 5e-3.
    anchor_enumeration: >-
      RUN-ECDLP-e962f6-002 (N = 2^26, T = 256, W = 2048, theta = 1/2048,
      a = 1/4, cap 8W = 16384; walk_key seed 1, dp_key seed 101,
      tie_break seed 401): one exact-basin array pass (vectorised forward
      iteration with pointer jumping, as in EXP-ECDLP-869870's
      exact_basins): for every x the first DP reached and its distance;
      the basin size of every DP; the cycle mass and the capped mass; the
      top-T share (cap 8W); the walk length to the first mark per start
      point (the distance array); the Spearman correlation of the walk
      length with the basin size of the reached DP (the Lemma 6
      independence check, alpha = 0.01); the mean walk length beside W.
      This run exists because NO committed run exists at N = 2^26
      (verified by search of the committed runs on 2026-09-09) and the
      decidable negative of the Coordinator verdict is stated at
      N = 2^26; it is the minimal new compute that makes the decidable
      negative decidable. It is one array pass, minutes scale.
    permutation_control: >-
      RUN-ECDLP-e962f6-003/004/005 (N = 2^20, T = 64, W = 64, theta =
      1/64, a = 1/4; permutation seeds s in {1, 2, 3} for the Fisher-Yates
      draw, dp_key seed 101 + s): a uniformly random permutation on
      [0, 2^20) with the same DP marking as the generic instrument; the
      "basins" are the cycle segments ending at each DP (in a permutation
      every in-degree is 1, so the segment of x is the points between the
      previous DP on the cycle and x); the top-T share of the segment
      sizes; the segment-size distribution beside Geometric(theta); the
      comparison of the top-T share with 3 T W/N = 0.046875 (the collapse
      prediction) and with C_max(1/4) = 0.3889120129663709 (the value the
      Borel machinery must NOT reproduce). Three seeds bound the control's
      own noise floor (the committed 2^20 random-function data shows
      about 3pp seed-to-seed scatter in the top-T ratio); the idea's
      "one array pass" is the minimum, not the ceiling.
    proves_too_much: >-
      RUN-ECDLP-e962f6-006 (N = 2^20, T = 64, W = 64, theta = 1/64,
      a = 1/4; walk_key seed 1, dp_key seed 101, online seed 201): a
      NON-UNIFORM distinguishing rule on the generic random function:
      density 2theta on the even-hash half of the points, 0 on the
      odd-hash half (a deterministic function of the point, so the basin
      partition of Lemma 1 still holds; the average density is theta).
      The known-false conclusion is Lemma 6's "Geometric(theta), mean W,
      independent of the basin": the walk length to the first mark is a
      mixture (fast component from the marked half, about Geometric(2
      theta), mean W/2; slow component from the unmarked half, hitting
      time plus Geometric(2 theta)), with mixture mean about W/2 + 1, not
      W. Compute: the exact basin structure under the non-uniform rule
      (one array pass); M = 40000 online walks (cap 8W) with the walk
      length to the first mark per walk; the mean walk length beside W
      (the loudness threshold: deviation beyond 10% of W); the KS
      statistic of the walk lengths against Geometric(theta) (alpha =
      0.01); the top-T share beside C_max(1/4) (reported; the 15% band is
      the loudness threshold). The control PASSES when the machinery
      fails loudly: mean walk length deviating from W by more than 10%,
      or the KS test rejecting at alpha = 0.01, or the top-T share
      deviating from C_max(1/4) by more than 15%. The control FAILS (and
      is void, routed to the Coordinator for a stronger object under a
      versioned amendment) when none of these fires.
    residual_reread: >-
      RUN-ECDLP-e962f6-007 (read-only; no re-simulation, no modification;
      the sha256 of every committed file read is recorded in the
      manifest): re-read the committed summaries and produce the residual
      table. Sources (a = 1/4 cells, cap 8W): EXP-ECDLP-869870
      RUN-ECDLP-869870-001..005-N20-s1..s5 (N = 2^20, 5 seeds),
      RUN-ECDLP-869870-006..010-N22-s1..s5 (N = 2^22, 5 seeds),
      RUN-ECDLP-869870-011..015-N24-s1..s5 (N = 2^24, 5 seeds) -- fields
      global_oracle.top_T_share_8W, global_oracle.ratio_to_c_max_numeric,
      global_oracle.model.c_max_numeric, basin_law.survival_slope_8W,
      cycle_mass_frac, capped_mass_8W_frac,
      exact_mean_online_walk_length_8W; and EXP-ECDLP-612fb1
      RUN-ECDLP-612fb1-002 (N = 2^20: basins.top_T_share,
      basins.C_max_model, basins.x_star_model, basins.cycle_mass_frac,
      basins.capped_mass_frac) as the cross-check of the anchor values.
      Plus the new anchor RUN-ECDLP-e962f6-002 (N = 2^26). Compute per
      (N, seed): the raw ratio (as committed) and the corrected residual
      R(N) (cycle and capped mass added back). Decay check (D1):
      |R(2^26)| <= 0.15 (the decidable-negative band). Decay check (D2):
      the per-N median |R| is non-increasing across {2^20, 2^22, 2^24,
      2^26} up to a 2 percentage-point noise floor (|R(N_next)| <=
      |R(N_prev)| + 0.02 at each step). Decay check (D3): the log-log
      slope of the per-N median |R| versus N, over the points with
      |R| > 0.01, lies in [-0.7, -0.1] (consistent with the predicted
      -1/3); if fewer than three points exceed the 0.01 floor, D3 is
      replaced by D2 alone and the substitution is recorded. The
      committed calibration points (read, not re-derived): R(2^20) about
      -0.072 (seed 1), R(2^22) about -0.013 (seed 1), R(2^24) about
      +0.008 (seed 1) -- the O(theta) shrinkage is already visible in the
      committed data.
      anchor_values:
        a_1_8: {x_star: 1.2085522833979216, c_max: 0.27161902810059757}
        a_1_4: {x_star: 0.7423409681771704, c_max: 0.3889120129663709}
        a_1_2: {x_star: 0.4045307067767451, c_max: 0.5247586384598776}
        a_1: {x_star: 0.1903808702719756, c_max: 0.6625998114129124}
        source: >-
          RUN-ECDLP-869870-011-N24-s1 global_oracle.model (all four a
          values); the a = 1/4 pair cross-checked against
          RUN-ECDLP-612fb1-002 basins.C_max_model / basins.x_star_model
          (identical values).

  controls:
    - >-
      C1 INDEPENDENT RE-DERIVATION PATH PER LEMMA: each lemma carries two
      routes to the same formula (inputs.derivation_document, item (iii));
      the routes must agree to four digits, stated per lemma; the Stage 0
      validator audits both routes and the agreement.
    - >-
      C2 NEARBY-OBJECT CONTROL (permutation walk): a random permutation
      with the same DP marking has no trees, geometric segment sizes, and
      a top-T share of order T W/N; the derivation must predict the
      collapse (the document contains the collapse argument) and the
      measured top-T share must be below 3 T W/N = 0.046875 at every seed
      and must not reproduce C_max(1/4) = 0.3889120129663709.
    - >-
      C3 EXACT-ENUMERATION ANCHOR: the committed runs whose numbers the
      derivation must reproduce digit-for-digit: the anchor values
      (inputs.residual_reread.anchor_values) reproduced by the quadrature
      to within 5e-5; the committed partition identity (sum of basin
      sizes + cycle mass = N) verified digit-for-digit on the committed
      data as the Lemma 1 Route B check; the committed top-T shares are
      the Stage 2 residual source, read only.
    - >-
      C4 PROVES-TOO-MUCH CHECK (non-uniform distinguishing rule): the
      derivation machinery run against the {0, 2theta} rule, on which the
      Lemma 6 conclusion is known false; the machinery must fail loudly
      (mean walk length deviating from W by more than 10%, or the KS test
      against Geometric(theta) rejecting at alpha = 0.01, or the top-T
      share deviating from C_max(1/4) by more than 15%) rather than
      reproduce C_max.
    - >-
      N-DECAY CONTROL: the corrected residual R(N) must shrink as
      N^{-1/3} across {2^20, 2^22, 2^24, 2^26} (checks D1-D3); error
      terms that do not shrink mean a missing term in the derivation.
    - >-
      DEFERRED (out of scope, named for the successor): the r = 2
      adding-walk control of the idea's null_object_control (Lemma 2 must
      fail measurably on a Teske-non-random walk) is NOT staged here: no
      committed r = 2 data exists and the verdict's stages do not include
      it; it is recorded as a successor control, not silently dropped.

  independent_variables:
    - "N in {2^20, 2^22, 2^24} committed exact, 2^26 new anchor exact, 2^30 committed sampled (no exact top-T share; not used for the decay check)"
    - "a in {1/8, 1/4, 1/2, 1} (quadrature table); 1/4 primary (anchor, permutation, non-uniform, residual re-read)"
    - "walk object in {uniformly random function, uniformly random permutation, random function with non-uniform {0, 2theta} rule}"
    - "distinguishing rule in {uniform theta, non-uniform {0, 2theta}}"
    - "seed (per the seed_policy)"

  metrics:
    primary:
      - >-
        quadrature table x*(a), C_max(a), sqrt(a)/C_max(a) at a in
        {1, 1/2, 1/4, 1/8} and on the fine grid; dimensionless; tolerance
        Q1 (within 5e-5 of the committed anchor values at all four a),
        Q2 (assembly minimum at a in [0.2, 0.25], value within 0.01 of
        1.28), Q3 (baseline-embedding values within 5e-3)
      - >-
        corrected residual R(2^26) at a = 1/4 from the new anchor;
        dimensionless; band |R| <= 0.15 (the decidable-negative band)
      - >-
        residual decay across N in {2^20, 2^22, 2^24, 2^26} at a = 1/4;
        dimensionless; checks D1 (|R(2^26)| <= 0.15), D2 (per-N median
        |R| non-increasing up to a 2pp noise floor), D3 (log-log slope in
        [-0.7, -0.1], predicted -1/3)
      - >-
        permutation top-T share at N = 2^20, a = 1/4, per seed;
        dimensionless; must be below 3 T W/N = 0.046875 at every seed and
        must not reproduce C_max(1/4) = 0.3889120129663709
      - >-
        proves-too-much loudness on the non-uniform object: mean walk
        length deviation from W (dimensionless fraction; loudness
        threshold 10%), KS statistic against Geometric(theta) with p-value
        (alpha = 0.01), top-T share deviation from C_max(1/4)
        (dimensionless fraction; loudness threshold 15%)
      - >-
        Stage 0 audit outcome per lemma (recorded by the reserved
        validator task, not by this experiment's runs): accepted /
        corrected (with the corrected error term) / refuted (with the
        counterexample)
    secondary:
      - "raw ratio top_T_share / C_max(a) per (N, seed), as committed, beside the corrected residual"
      - "cycle_mass_frac and capped_mass_8W_frac per (N, seed) (the confounders added back in the corrected residual)"
      - "survival_slope_8W per (N, seed) from the committed data beside the Borel prediction -1/2 (Lemma 2 check, read-only)"
      - "exact_mean_online_walk_length_8W per (N, seed) from the committed data beside W (Lemma 6 check, read-only)"
      - "oracle online constant sqrt(a)/top_T_share at the 2^26 anchor beside 1.28 (within 10%)"
      - "Spearman correlation of walk length with basin size at the 2^26 anchor (Lemma 6 independence; alpha = 0.01)"
      - "permutation segment-size distribution beside Geometric(theta) (KS statistic)"
      - "quadrature method, grid, tolerance and runtime (recorded in the manifest)"

  heuristic_under_test: null

  preregistered_prediction:
    quantity: >-
      The quadrature values x*(a), C_max(a), sqrt(a)/C_max(a); the
      corrected residual R(N) at a = 1/4 across N in {2^20, 2^22, 2^24,
      2^26}; the permutation top-T share; the non-uniform-object walk
      length statistics.
    formula: >-
      Written verbatim from IDEA-20260906-aed829 (B1)-(B3) and
      IDEA-20260906-ac100b (Lemmas 1-6, assembly), with x = n/W^2 and a =
      T W^2/N. (B1) UNSELECTED LAW: C_rand(a_m) = 1 - (1 + 2 a_m)^{-1/2};
      0.423 at a_m = 1. (B2) ORACLE CEILING: C_max(a) =
      erfc(sqrt(x*/2)), x* solving 2 x*^{-1/2} e^{-x*/2} - sqrt(2 pi)
      erfc(sqrt(x*/2)) = a sqrt(2 pi); anchor values per
      inputs.residual_reread.anchor_values. (B3) ORACLE ONLINE COST at T =
      N^{1/3}: L sqrt(T/N) = sqrt(a)/C_max(a) = 1.51 (a = 1), 1.35 (1/2),
      1.28 (1/4), 1.30 (1/8); minimum about 1.28 near a in [0.2, 0.25];
      at fixed L, T_oracle = 1.64 N/L^2. RESIDUAL: R(N) = O(theta) =
      O(N^{-1/3}), shrinking by a factor 2^{2/3} about 1.59 per 2^2 step
      in N; |R(2^26)| <= 0.15. PERMUTATION: top-T share of order T W/N,
      below 3 T W/N = 0.046875 at N = 2^20, a = 1/4; the Borel/erfc
      machinery does not reproduce C_max(1/4) on this object.
      NON-UNIFORM: mean walk length about W/2 + 1 (not W); the walk
      length distribution is not Geometric(theta).
    source: >-
      Derived in IDEA-20260906-aed829 (B1)-(B3) and carried as a
      proof-shaped claim in IDEA-20260906-ac100b -- UNVERIFIED derivations
      pending this protocol; the anchor values are committed measurements
      of the same formulas (RUN-ECDLP-869870-011-N24-s1,
      RUN-ECDLP-612fb1-002). Written before any run; never tuned to data;
      a change requires a versioned protocol_amendment and executed runs
      are never re-scored.

  scale_relevance:
    tier: toy
    justification: >-
      Toy scale: the tested N range is 2^20..2^26 (the committed grid
      extends to 2^30 sampled, which carries no exact top-T share and is
      not used for the decay check). The lemmas are statements about
      uniformly random functions of size N with W <= N^{1/3}; the
      transfer to r-adding walks is H1 only (HEUR-AC100B-1, tested by
      EXP-ECDLP-869870, not here); the transfer to cryptographic N is an
      assumption stated per evidence record, never a result. The O(theta)
      error terms are the disclosed finite-size content of the artifact;
      the N^{-1/3} decay check is the test that separates them from model
      failure.
    correspondence: null

  tail_checks:
    - "The single (N, seed) cell with the largest |corrected residual|, reported individually with cell identity."
    - "The 2^26 anchor: the largest basin against the Borel(1-theta) N/W-sample order-statistic 99% band (the committed runs carry the band estimator)."
    - "The permutation control: the largest segment size per seed against the geometric tail (the top-T share is dominated by the top segments; a segment beyond the geometric 99% band is reported)."
    - "The non-uniform object: the walk-length quantiles (10%, 50%, 90%) beside the Geometric(theta) quantiles, reported individually."
    - "Any committed file whose sha256 at read time differs from the committed state: the Stage 2 run is invalid (the read-only guarantee failed)."

  replication:
    seeds: [1, 2, 3]
    independent_instances: 3
  seed_policy: >-
    Quadrature: deterministic, no seed (method and grid recorded in the
    manifest). Anchor (RUN-002): walk_key seed 1, dp_key seed 101,
    tie_break seed 401 (one array pass by design, per the idea's Stage 1
    convention; the committed grid provides the multi-seed replication
    for the decay test). Permutation (RUN-003/004/005): permutation seed
    s in {1, 2, 3} for the Fisher-Yates draw, dp_key seed 101 + s.
    Non-uniform (RUN-006): walk_key seed 1, dp_key seed 101, online seed
    201. Stage 2 (RUN-007): no seed (read-only). Every seed is recorded in
    every manifest; a duplicated or missing seed invalidates the run.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 4
    maximum_runs: 8
    maximum_workers: 1
  budget_note: >-
    Sized to the work, advisory per docs/research-budget-policy.md. The
    2^26 array pass needs about 5 int32 arrays of 67M entries (about 1.3
    GB) and about 20 pointer-jumping passes -- minutes (the committed
    2^20 pass took 1.7 s of compute; 2^26 is 64x the data). The 2^20
    passes (permutation x3, non-uniform x1) are seconds each; M = 40000
    online walks at 2^20 are seconds. Runs: 1 (quadrature) + 1 (anchor) +
    3 (permutation) + 1 (non-uniform) + 1 (Stage 2 re-read) = 7, with 1
    spare for a recorded infrastructure re-run. The 4 GB figure is the
    machine-protection ceiling, not an expectation.

  stopping_rules:
    - "STAGE 0 is a HARD GATE on the ceiling claim: no ceiling number is citable until the reserved validator audit completes; the Stage 1-2 measurements stand on their own regardless (they are measurements, not model claims)."
    - "RUN-001 first: if the quadrature fails to reproduce the committed anchor values to within 5e-5 at any a, the quadrature run is an implementation error (not a model failure); repair and re-run as a new run record before any other Stage 1 number is interpreted."
    - "If |R(2^26)| > 0.15: record it; the decidable negative is half-triggered (the 15% half); the decay checks D2-D3 still run; the Coordinator decides (withdraw the ceiling or investigate) -- the Executor records, never decides."
    - "Any timeout (600 s per run), crash, memory exhaustion or dependency failure: failed_infrastructure, NEVER a result, positive or negative (AGENTS.md rule 5); re-planned within the spare run, never interpreted."
    - "Stop at maximum_runs or total_cpu_hours, whichever binds first; a cell not reached is reported as not run, never as a negative."

  invalidation_rules:
    - "Execution while status is not approved or execution_authorized is false: no run under this contract is evidence."
    - "Timeout, crash, memory exhaustion or dependency failure: failed_infrastructure, NEVER negative mathematical evidence (AGENTS.md rule 5)."
    - "Any modification of a committed run record during Stage 2 (even one byte): the Stage 2 run is invalid; the re-read is read-only by contract."
    - "Any committed file whose sha256 at read time differs from the committed state: the Stage 2 run is invalid."
    - "A quadrature run that does not reproduce the committed anchor values to within 5e-5: invalid as an implementation error, not a model failure; a new run record is required."
    - "A permutation control that reproduces C_max(1/4) within 15%: the control is void (the object did not discriminate); nothing is reported from it; routed to the Coordinator."
    - "A proves-too-much control that fails to discriminate (no loudness threshold fires): void, routed to the Coordinator for a stronger object under a versioned amendment; the derivation is not falsified by a void control."
    - "Duplicated or missing seeds, an incomplete manifest, or raw/summary disagreement: invalid."
    - "Any post-hoc change to the grids, tolerances, seeds or pre-registered forms: versioned protocol_amendment required under experiments/EXP-ECDLP-e962f6/amendments/; executed runs are never re-scored."
    - >-
      VALIDATOR-DISAGREEMENT HANDLING: if the Stage 0 audit refutes a
      lemma or corrects an error term, the derivation document is NOT
      edited (it is immutable once archived); the correction is recorded
      in the validator's report, and a corrected derivation document
      (version 2) is produced under a versioned amendment only if the
      Coordinator so decides; the ceiling claim is not citable until the
      corrected document passes a fresh audit. If two independent audits
      disagree (e.g. the Stage 0 validator and a later red-team pass), the
      disagreement is recorded as a contradiction between review reports
      and routed to the Coordinator, which commissions a
      review-breakthrough round at max effort per AGENTS.md rule 12; the
      Executor never resolves a validator disagreement and records the
      audit outcomes verbatim, without interpretation.

  success_criterion: >-
    The derivation artifact is citable as a CHECKABLE DERIVATION ARTIFACT
    (never "proved") when: (S1) the quadrature table reproduces the
    committed anchor values to within 5e-5 at all four a values, the
    assembly minimum lies at a in [0.2, 0.25] within 0.01 of 1.28, and
    the baseline-embedding values are reproduced (Q1-Q3); (S2)
    |R(2^26)| <= 0.15 (the decidable-negative band, corrected residual);
    (S3) the residual decays as N^{-1/3} per checks D2 and D3 (D1 is S2);
    (S4) the permutation top-T share is below 3 T W/N = 0.046875 at every
    seed and the derivation document contains the collapse argument;
    (S5) the proves-too-much control fires at least one loudness
    threshold; (S6) the Stage 2 residual table is produced from the
    committed data only, with the read-only guarantee verified (sha256
    match on every file read); (S7) the Stage 0 audit (recorded by the
    reserved validator task) returns, per lemma, accepted or corrected
    with the corrected error term recorded (a refutation is a deliverable
    that routes to the Coordinator, not a success). S1-S6 met and S7
    accepted-or-corrected on every lemma -> the ceiling C_max(a) with its
    stated error terms is the standing model for the RQ-ECDLP-78dbc5
    lane, citable at claim_tier toy as a derivation artifact. S1-S6 met
    but S7 refutes a lemma -> the specific lemma is withdrawn with the
    counterexample recorded; the remaining lemmas stand only as far as
    the refutation does not reach (the Coordinator decides the scope).

  falsification_criterion: >-
    (F1) DECIDABLE NEGATIVE (Coordinator verdict
    ses_f7c589781ffeGfc3ONOpFH2U7b): |R(2^26)| > 0.15 (corrected
    residual) WITH the residuals not shrinking as N^{-1/3} (D2 or D3
    fails): the ceiling formula is wrong and is withdrawn; the exact
    enumeration (the committed top-T shares plus the 2^26 anchor)
    replaces it as the standing number. (F2) Lemma 6 fails: the Spearman
    correlation of walk length with basin size at the 2^26 anchor is
    significant at alpha = 0.01, or the mean walk length deviates from W
    beyond the CI: the online cost is not W/C and every cost figure in
    the batch must be re-derived from the measured length-conditional
    law. (F3) The permutation walk does not collapse the ceiling: the
    top-T share is not below 3 T W/N at a majority of seeds, or the
    derivation document lacks the collapse argument: the derivation has
    not identified the tree branching as load-bearing; its numbers are
    void. (F4) A validator exhibits a stored set with expected coverage
    above C_max(a) (1 + o(1)) under H1: the record is refuted outright.
    (F5) The proves-too-much control fails to discriminate: the
    verification is incomplete (not a falsification of the derivation);
    routed to the Coordinator for a stronger object under a versioned
    amendment.

  required_artifacts:
    - "experiments/EXP-ECDLP-e962f6/derivation/derivation-lemmas-1-6.md: the derivation document with the per-lemma check box blocks (statement with explicit error terms, Route A, Route B, route agreement to four digits, citations with provenance, self-check), the quantifier statement, the baseline-embedding check, the permutation collapse argument, and the proves-too-much argument"
    - "experiments/EXP-ECDLP-e962f6/runs/RUN-ECDLP-e962f6-001/manifest.yaml and raw-result.json: the quadrature table (x*, C_max, sqrt(a)/C_max at the four a values and the fine grid), the method, grid and tolerance, the anchor-reproduction table with per-value deviation"
    - "experiments/EXP-ECDLP-e962f6/runs/RUN-ECDLP-e962f6-002/manifest.yaml, raw-result.json, summary.json: the 2^26 anchor (basin histogram, top-T share, cycle and capped mass, walk-length array statistics, Spearman correlation, mean walk length beside W)"
    - "experiments/EXP-ECDLP-e962f6/runs/RUN-ECDLP-e962f6-003..005/manifest.yaml, raw-result.json, summary.json: the permutation control per seed (segment-size distribution, top-T share, comparison with 3 T W/N and C_max(1/4))"
    - "experiments/EXP-ECDLP-e962f6/runs/RUN-ECDLP-e962f6-006/manifest.yaml, raw-result.json, summary.json: the non-uniform proves-too-much object (walk-length distribution, mean beside W, KS statistic and p-value, top-T share beside C_max(1/4), the loudness verdict per threshold)"
    - "experiments/EXP-ECDLP-e962f6/runs/RUN-ECDLP-e962f6-007/manifest.yaml (with the sha256 of every committed file read), raw-result.json, summary.json: the residual table per (N, seed) (raw ratio and corrected residual), the decay checks D1-D3 with the verdicts, the read-only verification"
    - "every run manifest: exact command, git commit and dirty-tree state, environment and dependency versions, all seeds, requested policy, resolved model identifier, fallback flag, wall clock, peak_rss_bytes"
    - "the execution report in the execution batch task directory (assigned at dispatch): run inventory, per-run validity, the quadrature anchor-reproduction table, the decay-check verdicts, the control verdicts, infrastructure events, stages not yet run"

  cost_model:
    measured_vs_modeled: >-
      MEASURED: every exact top-T share, every walk length, every count,
      every KS statistic. MODELED: C_max(a), C_rand(a_m), the assembly
      constants, the O(theta) error terms -- labelled with formula and
      source, in their own column. The two never mix in one column.
    optimistic_assumptions:
      - "A walk step is one group operation (the unit is stated, not converted to field operations or time)."
      - "The closed forms hide O(theta) corrections; the N sweep exposes them rather than absorbing them."
      - "The 2^26 anchor is one seed; the committed grid provides the multi-seed replication for the decay test."
    memory_accounting: >-
      The 2^26 arrays are about 5 x 4 x 2^26 bytes (about 1.3 GB);
      peak_rss_bytes is recorded per run and reconciled against the 4 GB
      ceiling.
    hidden_overhead: None claimed; the protocol produces a checkable derivation and its checks, not an algorithm.
    standardized_parameter_sets: >-
      The four anchor a values at the committed N grid plus the 2^26
      anchor; no cryptographic set is costed.

  interpretation:
    - >-
      Every conclusion is claim_tier toy and is a check of a derivation
      artifact under the generic S T^2 ceiling (KN-LIT-013); it moves no
      exponent, names no non-generic structure, and is scoped to the
      tested objects, N, a and seeds.
    - >-
      The exact top-T shares and the residual table are MEASUREMENTS that
      stand regardless of the Borel model; only the closed forms are at
      risk from a model failure, and the decidable negative (F1) is the
      pre-registered withdrawal rule.
    - >-
      The generic instrument solves and certifies nothing (certificate
      kind none); no logarithm is claimed anywhere in this protocol.
    - >-
      A void control (F5) or a refuted lemma (S7) is a recorded outcome,
      not a silent discard; the Coordinator decides the successor.

  assigned_to: executor
  review_required: true
  review_note: >-
    Claim-relevant producer. The Stage 0 validator audit is a SEPARATE
    reserved validator task (review-adversarial, independent session),
    NOT part of this handoff and NOT a run of this experiment: it is
    dispatched after the snapshot archive TASK-20260909-b95f26 commits
    the derivation document, with a review_plan written by the
    Coordinator before the validator runs. Reason for the separation:
    the audit is the hard gate on the ceiling claim and must be
    independent of the producer of the derivation document (the
    executor); the audit's input is the archived document, which cannot
    exist before the snapshot. The executor's Stages 1-2 measurements
    stand on their own (exact shares are measurements, not model claims)
    and do not wait on the audit; the ceiling claim waits on it.
