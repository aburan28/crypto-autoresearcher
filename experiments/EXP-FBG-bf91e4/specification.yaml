experiment:
  id: EXP-FBG-bf91e4
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-f49ad1; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-f49ad1
  question_id: RQ-FBG-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Held-out predictive test of a character-sum bias law for factor-base coverage excess: twelve
    matched-size geometries, sealed six-geometry validation half, exact transforms and exact coverage
    in one invocation'
  objective: 'The one uncertainty a run reduces is whether coverage excess for an unseen factor-base
    geometry can be predicted from a single scalar computed from the base, rather than requiring a
    fresh measurement of every family. Stated in parts: (i) ASSOCIATION - across a declared panel
    of twelve geometries at matched realised size, is the largest non-trivial character-sum modulus
    of the base indicator monotonically associated with measured coverage excess on the training half,
    at or above a pre-committed rank correlation; (ii) TRANSFER - does a law fitted and frozen on
    the training half predict the measured excesses of six geometries sealed before any fitting, with
    a median absolute error below half their own spread, and does the frozen law also return excess
    1.00 at the matched random null''s bias, which is its calibration point; (iii) SEPARATION FROM
    THE ADJACENT FUNCTIONAL - once the fourth moment of the same transform, which is another lane''s
    object, is included as a covariate, does bias retain incremental predictive power, or is the association
    fully explained by the covariate. A run cannot reduce uncertainty about causation, about arities
    or sizes outside those tested, about relation yield, decomposition or linear-algebra cost, about
    any operational use, or about behaviour at sizes where a discrete-logarithm table is unavailable,
    which is every size where the underlying problem is hard. The deliverable is a predicted-against-measured
    scatter on the sealed half with intervals, plus the covariate analysis.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support at most this: on the named toy
      prime-order curves at the stated sizes, at matched realised base size and arity 3, over the
      twelve declared geometries, the largest non-trivial character-sum modulus is or is not associated
      with measured coverage excess at the reported rank correlation on the training half, and a law
      of the declared functional form fitted and frozen on that half does or does not predict the
      sealed half''s measured excesses within the reported median absolute error, with the reported
      incremental contribution over the fourth-moment covariate. WHAT DOES NOT FOLLOW: no causal claim,
      which the contract explicitly declines; nothing about geometries outside the declared panel
      or outside the realised bias range, since prediction beyond the training range is extrapolation
      and is reported as such; nothing about arities or group sizes not tested; nothing about relation
      yield, relation independence, decomposition cost, linear-algebra cost or index-calculus cost;
      nothing usable at any scale where a discrete-logarithm table cannot be built, which the contract
      states as a hard limit on the object itself rather than on the implementation; and no attack,
      break, speedup or security consequence of any kind.'
  inputs:
    procedure: 'STAGE 0, declaration and sealing (cost: 2 human hours, no compute). Declare the twelve-geometry
      panel, the functional form of the law with its free parameters, the rank-correlation threshold
      and the split seed; write the sealed half to a file the fitting module is tested to be unable
      to read. STAGE 1, curves and tables (cost: seconds to minutes). Generate and verify prime-order
      toy curves via harness/toycurve.py and build discrete-logarithm tables, checking bijectivity.
      STAGE 2, panel construction (cost: seconds). Build all twelve geometries plus the matched random
      and permuted-label nulls at matched realised size. STAGE 3, spectra (cost: order N log N per
      base). Exact discrete Fourier transform of each indicator over the cyclic group; record the
      bias and the fourth moment; verify Parseval exactly. STAGE 4, coverage (cost: dominant, order
      N times B squared per base). Exact multiset-sum counting over the complete target space with
      the closed-form total check per cell. STAGE 5, fit and freeze (cost: minutes). Fit the declared
      form on the training half only, freeze parameters, and check the law at the random null''s bias;
      halt if it fails. STAGE 6, unseal and report (cost: minutes plus 2 human hours). Predict the
      sealed half, report errors with intervals, then run the covariate analysis.'
    instrument: Python 3 with harness/toycurve.py for exact curve arithmetic, point generation and
      discrete-logarithm tables; numpy for the discrete Fourier transform, count vectors and the bootstrap;
      scipy for the declared curve fit and the rank correlation; harness/runner.py for run manifests,
      recorded seeds and the inference block. Parseval is checked in exact integer arithmetic on the
      squared moduli where possible and to machine precision otherwise. No Sage, no solver, and no
      timing in the measurement path.
    parameters: 'Curves: 4 generated prime-order toy curves per size. Sizes: N near 2^12, 2^14 and
      2^16. Matched realised base size: B equal to ceiling of (6N) to the one-third power. Arity:
      m equal to 3. Panel: 12 geometries - 3 interval families, 2 canonical small sets, 2 cosets,
      2 progressions, 1 greedy construction, 1 ceiling-attaining construction, 1 random draw - plus
      the matched random null and the permuted-label null. Split: 6 training, 6 sealed, by recorded
      seed. Seeds per cell: 4. Declared functional form: excess as a function of the m-th power of
      bias, with 2 free parameters. Target space: complete, no sampling. Cells: 14 bases times 3 sizes
      times 4 curves times 4 seeds equals 672 coverage computations.'
  controls:
  - Matched random base of identical realised size in the same invocation, serving as both denominator
    and law calibration point.
  - 'Permuted-label null: a uniformly random exponent set of the same size pushed through the identical
    bias and coverage path.'
  - Sealed half enforced in code, with a test asserting the fitting module cannot read the sealed
    file.
  - 'Closed-form total check per cell: summed multiset count equals binomial(B_eff + m - 1, m) exactly.'
  - 'Transform verification: Parseval''s identity checked exactly on every computed spectrum.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a MATCHED RANDOM BASE of identical realised size
    in the same invocation, which serves twice. First, in the usual way, as the denominator of every
    excess ratio. Second, and more importantly here, as a calibration point on the law itself: a random
    base has a bias concentrated near the square root of the base size divided by the base size, computable
    in closed form up to the standard fluctuation, and its coverage excess is exactly 1.000 by definition.
    So the fitted law must pass through the random base''s point, and a law that does not is refuted
    by its own null before any held-out test. A second null is required: a PERMUTED-LABEL base, where
    the base''s exponent set is replaced by a uniformly random set of the same size and the identical
    bias and coverage computations are run, which must produce the same joint distribution as the
    matched random null. If it does not, the pipeline treats structured and unstructured inputs differently
    and no fitted law can be read.'
  independent_variables:
  - geometry within the declared twelve-member panel
  - panel half (training or sealed)
  - group size N
  - curve instance and seed
  metrics:
    primary:
    - bias scalar per base
    - exact coverage and coverage excess ratio per base with bootstrap interval
    - training-half rank correlation between bias and excess
    - frozen law parameters and its value at the matched random null's bias
    - median absolute predictive error on the sealed half, with interval
    secondary:
    - fourth-moment covariate per base
    - incremental predictive error reduction attributable to bias after the covariate
    - realised bias range on each half, for the extrapolation check
    - Parseval residual per spectrum
    - closed-form total residual per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The median absolute predictive error of the frozen law on the sealed half, relative
      to the sealed half's own interquartile spread of measured excesses.
    formula: 'Let b be the largest modulus among non-trivial characters of the base indicator divided
      by the base size, and let e be the measured coverage excess ratio against a matched random base
      of identical realised size. The declared law is e equal to 1 plus c times b raised to the power
      m, with c and an optional offset as the two free parameters, motivated by the exact propagation
      rule that m-fold convolution raises every frequency modulus to the m-th power. Fit on the training
      half by least squares on the logarithm of e minus 1; freeze. Predicted: training-half Spearman
      correlation at least 0.6; the frozen law at the random null''s measured bias returns excess
      within one interval half-width of 1.00; median absolute predictive error on the sealed half
      at most 0.5 times that half''s interquartile spread of measured excesses.'
    source: Pre-registered in the parent proposal IDEA-20260816-f49ad1 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are N near 2^12 to 2^16, matched realised base size 29 to 46,
      arity 3, twelve geometries, 4 curves and 4 seeds per size, with exact transforms and exact coverage
      counting over the complete target space so neither primary quantity carries sampling error.
      Transfer assumptions are stated and are narrow: the fitted law is claimed only within the realised
      bias range observed on the training half, and the run reports whether the sealed half falls
      inside that range - if it does not, the result is labelled extrapolation and the transfer claim
      is withdrawn. No transfer to other arities is claimed, since the declared functional form depends
      on m explicitly. Nothing extrapolates to cryptographic sizes and nothing can: the bias is computed
      from a discrete-logarithm table, so the predictor itself is unavailable at any size where the
      underlying problem is hard, which the contract records as a property of the object rather than
      a limitation of the run.'
    correspondence: null
  tail_checks:
  - The highest-bias panel member, where coverage saturation most compresses the excess and the law
    is most likely to fail at the top end.
  - The matched random null, the lowest-bias point and the law's calibration point.
  - Any sealed-half geometry whose bias falls outside the training range, examined and reported individually
    as extrapolation.
  - The geometry with the largest gap between its bias rank and its excess rank, examined element
    by element.
  - The smallest tested size, where the bias fluctuation of a random base is largest relative to structured
    bases.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - 'Halt and report before unsealing if the training-half rank correlation is below the pre-committed
    threshold: there is nothing worth freezing.'
  - Halt and report if the frozen law fails at the matched random null's bias.
  - Halt and report if any Parseval residual or closed-form total residual is nonzero.
  - Per-cell wall-clock budget of 1800 seconds and total budget of 100 cell-hours; exceeded cells
    are recorded infeasible, which is not negative mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Parseval and closed-form checks pass on every cell, the permuted-label null matches
    the matched random null, the training-half fit is frozen before unsealing under a test-enforced
    seal, and the run reports the sealed half's predicted-against-measured errors with intervals together
    with the covariate analysis - whether the law transfers or fails.
  falsification_criterion:
  - The frozen law fails at the matched random null's bias.
  - Median absolute predictive error on the sealed half is at or above the sealed half's own interquartile
    spread.
  - The sealed half's bias values lie outside the training range, voiding the transfer claim.
  - The fourth-moment covariate absorbs all incremental predictive power from bias.
  - Training-half rank correlation is below the pre-committed threshold.
  - Any Parseval or closed-form total residual is nonzero, or the permuted-label null diverges from
    the matched random null.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-f49ad1
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The declared functional form is motivated by the exact m-th-power propagation of frequency moduli
    but is not derived as the correct relation between a maximum modulus and coverage; a Coordinator
    must decide whether a fitted form with that motivation is acceptable or whether a derivation is
    required before approval.
  - The relationship between this contract's maximum-modulus predictor and the additive-energy object
    owned by the RELN lane needs an explicit boundary statement from a Coordinator, since a positive
    result here could be read as trespassing on that lane's question.
  - The panel size of twelve is asserted rather than powered; a Coordinator should require a power
    argument for the held-out error estimate or accept a wide interval on it.
  - Whether the sealing discipline is enforceable strongly enough to count as a genuine held-out test
    within a single session is a process question a Coordinator must rule on.
