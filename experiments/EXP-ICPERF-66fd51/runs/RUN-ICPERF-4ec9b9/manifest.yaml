    command: python3 experiments/EXP-ICPERF-66fd51/code/bench.py --run-dir experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-4ec9b9 --phases A,B,C,D,E

  environment:
    schema_note: >-
      This manifest VALIDATES against schemas/run-manifest.schema.json. Two blocks
      that schema defines, `protocol` and `receipt`, are omitted rather than
      filled: they belong to harness/runner.py's approval-lock and runner-receipt
      machinery and require an approval_lock_sha256, a run_object_sha256 and a
      runner-receipt.json that this experiment's own bench.py does not produce.
      Filling them would mean inventing hashes for artifacts that do not exist.
      What they would have carried -- which contract was run, under which
      amendment, by which task, and how the run was closed -- is recorded below
      under protocol_binding and closure. For reference, RUN-ICPERF-305ca3's
      manifest and its v2 do not validate against this schema at all (four
      unexpected top-level keys), so this is a repair of a known gap rather than a
      new convention.

    protocol_binding:
      contract: experiments/EXP-ICPERF-66fd51/specification.yaml
      amendment: experiments/EXP-ICPERF-66fd51/amendments/AMD-20260915-4ec9b9.yaml
      amendment_note: >-
        The frozen contract sets budget.maximum_runs 1. This is the SECOND
        execution, admitted by an additive amendment that raises only that number;
        the specification is unedited and every metric, control, threshold, phase
        order and invalidation rule is the one RUN-ICPERF-305ca3 ran under.
      task: TASK-20260915-dde0a0
      queue: coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-51e2aa/dispatch_queue.json
      what_this_run_is_for: >-
        RUN-ICPERF-305ca3's timings are contaminated in a way its own rows cannot
        bound: 125 of its 474 solve rows started at loadavg > 2, concentrated in
        the phases whose engines it wanted to compare, so an exclusion test on them
        has no low-load control group. This run repeats the identical protocol with
        no concurrent subagent and no VM suspension, to say whether the first run's
        per-cell medians are timings or artefacts of the load its own Macaulay2
        phase created.

    recorded_by_harness: experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-4ec9b9/environment.json
    python: 3.12.3
    platform: Linux-6.12.94+-x86_64-with-glibc2.39
    cpu_count: 4
    gcc: gcc (Ubuntu 13.3.0-6ubuntu2~24.04.1) 13.3.0
    macaulay2: '1.22'
    singular: >-
      NOT RECORDED. The harness's version probe timed out after 60 s, exactly as
      it did on RUN-ICPERF-305ca3. Review joint V2 (TASK-20260915-195b0c) found
      the cause: the probe hangs whenever the child's stdin never reaches EOF,
      reproduced under a pty, and Singular run directly reports 4.3.2 -- the
      version the hypothesis names. Recorded as an instrument gap, not a missing
      dependency.
    cryptominisat5: c CryptoMiniSat version 5.11.15
    cadical: 1.7.3
    minisat: 2.2.1 (apt; prints no version)
    loadavg_at_start: [0.0356, 0.0801, 0.1948]
    mem_limit_gb_per_child: 6
    dirty_tree_note: >-
      The tree carried uncommitted coordination and review files while this run
      executed (28 paths at launch). None is read by bench.py: the run's inputs are
      the vendored benchmark under inputs/TRIMOSKA-ECICB-2024, the vendored solver
      sources under inputs/TRIMOSKA-WDSAT-2024, and the experiment's own code/, all
      committed at b38bb610e. Recorded as dirty because that is what the tree was.
    execution_role: >-
      Executed by the Coordinator session in the executor-mechanical role, with
      fallback_used true and the reason in the inference block. Not presented as a
      dispatched Executor run.

    closure:
      status: completed
      completed_at: '2026-09-15T17:58:22Z'
      manifest_written_at: '2026-09-15T19:10Z'
      manifest_written_by: coordinator
      manifest_written_by_note: >-
        Written after the run finished, from the run's own artifacts, by the
        session that launched it. Every number in this manifest is read from
        results.jsonl, summary.json, phase_log.txt or environment.json, or from
        the two committed review reports it cites by task id.
      reviews_cited:
        - TASK-20260913-6c5729 (joints V1, V3, V4, V5, V6 of RUN-ICPERF-305ca3)
        - TASK-20260915-195b0c (joint V2 of RUN-ICPERF-305ca3)
      reviews_cited_note: >-
        Those reviews are OF THE FIRST RUN, not of this one. They are cited because
        their findings about the encoding, the RLIMIT_AS artifact and the .m2 parse
        error apply verbatim to this run's identical artifacts. THIS RUN HAS NOT
        BEEN INDEPENDENTLY REVIEWED; its task entry records that its review chain
        opens when its round does.

  inputs:
    curve_id: null
    seed: 0
    parameters:
      curve: 'y^2 + xy = x^3 + x^2 + 1 over F_{2^n} (Sage EllipticCurve(K,[1,1,0,0,1]); every coefficient in F_2, hence Koblitz)'
      curve_id_note: >-
        null because this curve has no standardized identifier. It is the shipped
        benchmark curve of Trimoska's EC-Index-Calculus-Benchmarks; review joint V6
        established it is defined over F_2, with #E(F_{2^n}) = 32494, 131174,
        525086 at n = 15, 17, 19.
      n_values: [15, 17, 19]
      l_values: [5, 6]
      instances: 60 shipped S_4 point-decomposition instances (30 labelled S, 30 labelled U)
      u_label_meaning: >-
        'target drawn uniformly at random', NOT 'certified to have no
        decomposition'. Read at source from find_points.sage lines 61-67, where the
        string UNSAT is a literal argument and no satisfiability test occurs.
      engines: WDSat (4 configs + noncore_first + null), CryptoMiniSat (XOR and pure CNF), CaDiCaL, MiniSat, Macaulay2 F4, Singular std
      seed_note: >-
        0 is a placeholder the schema requires; this run draws no randomness. Every
        instance, target and null object is either shipped by the vendored
        benchmark or generated deterministically by convert.py from it, and the
        null objects are byte-identical to RUN-ICPERF-305ca3's.

  timing:
    started_at: '2026-09-15T10:24:24Z'
    finished_at: '2026-09-15T17:58:22Z'
    wall_seconds: 17170.5
    total_wall_seconds: 27238.0

  resources:
    peak_rss_bytes: 2783125504
    cpu_seconds: 17710.4
    unavailable_reason: >-
      peak_rss_bytes is the highest per-row children high-water mark recorded
      (2717896 kB, a Macaulay2 row), not a whole-run peak: bench.py measures RSS
      per child, so a run-level peak was never taken. cpu_seconds is the sum of
      per-row cpu_s and exceeds wall_seconds because the 32 Macaulay2 rows ran
      multi-threaded at 1.27-2.74 CPU-seconds per wall-second. wall_seconds is the
      sum of the 474 measured solve rows; total_wall_seconds is started_at to
      finished_at, which additionally covers the certificate phase, WDSat rebuilds,
      format conversion and per-row bookkeeping.

  result:
    valid: true
    invalid_reason: null
    certificate:
      kind: none
      verified: null
      verifier: null
    metrics:
      certificate_scope: >-
        This run claims no solve of any cryptographic instance, so
        result.certificate is kind none. It does VERIFY the benchmark's own 30
        shipped decomposition certificates as phase A's admission gate (30/30
        verified, 0 invalid); those verifications are rows in results.jsonl, not a
        certificate for this run.
      rows_planned: 504
      rows_recorded: 504
      phases_finished: [A, B, C, D, E]
      phase_wall_seconds: {A: 6900.4, B: 3153.2, C: 236.2, D: 13348.5, E: 3600.3}
      status_counts:
        SAT: 212
        UNSAT: 191
        budget_stop_timeout: 39
        infrastructure_exit_-6: 32
        certificate_rows_without_solver_status: 30
      certificates_verified: 30
      certificates_invalid: 0
      predictions_as_reported_by_summary_py: {P1: false, P2: null, P3: true, P4: true, P5: true, P6: true}
      predictions_note: >-
        AS REPORTED, and three of those booleans are known defective because
        summary.py was deliberately not repaired while a run using it was in flight
        (AMD-20260915-4ec9b9). Review of the first run found: the four P3c ratios
        are one number copied across cells by a loop variable that leaks its scope;
        P5's Groebner clause is never evaluated because it guards on engine_cpu_s,
        a key present on 0 of 504 rows, so P5 true covers half the prediction as
        worded; and P6's top-level boolean drops a cell whose value is unevaluable
        from its conjunction, so 'holds on every cell' is reported when n19l6 was
        not testable. Read those three as the review's corrected values, not as
        printed here.
      load_contamination:
        solve_rows: 474
        rows_started_above_loadavg_2: 48
        by_phase: {C: 29, D: 19}
        maximum_loadavg1_at_start: 3.81
        comparison_with_first_run: >-
          RUN-ICPERF-305ca3 had 125 such rows across all five phases with a maximum
          of 4.55. This run has 48, confined to the Macaulay2 phase and the start of
          the phase after it. SO THIS RUN IS LESS CONTAMINATED BUT NOT CLEAN, and
          the cause is the same in both: the run's own multi-threaded Macaulay2 rows
          raise the load average and the decay tail reaches into the next phase. An
          uninterrupted host does not fix that; reordering the phases or
          single-threading Macaulay2 would.
        non_macaulay2_wall_minus_cpu_seconds: {min: 0.0004, max: 0.3183, rows: 442}
      replication_against_the_first_run:
        conflict_counts_identical: 31 of 31 per-cell median conflict counts, to the last digit
        wall_time_medians_compared: 55
        median_absolute_relative_move: 0.0024
        moves_over_10_percent: 1
        moves_over_5_percent: 2
        moves_over_2_percent: 6
        largest_move: 'n15l5/S cryptominisat5_pure_cnf 0.4668 s -> 0.5168 s (1.107x), the smallest absolute time in the table'
        what_this_answers: >-
          The question this run was launched to answer. Conflict counts are
          deterministic, so their agreement checks the harness rather than the load;
          the wall-time medians are the load-sensitive quantity, and they move by
          0.24% at the median, with one cell over 10% and that on a half-second
          measurement. RUN-ICPERF-305ca3's per-cell medians are therefore TIMINGS,
          not artefacts of its load. This is an observation about these two runs on
          this host. It is not a general claim that load does not matter, and it does
          not repair the first run's exclusion test, which remains underpowered for
          want of a control group.
      unexpected_observations:
        - >-
          P1 fails identically to the first run: the same five SAT answers on
          n19l6-19-U fail E-membership decoding. Review joint V1 classified these
          POSITIVELY as twist decompositions -- f3 = 0 under the LSB-first
          convention that verifies all 30 shipped certificates, all four elements of
          absolute trace 1 so none lies on E, and the decomposition holding on the
          quadratic twist. An exhaustive enumeration of every multiset in V^3 for all
          60 instances agrees with both runs' SAT/UNSAT verdicts 60 of 60 and finds
          this instance has exactly one root, the twist one. The shipped
          Weil-descent system does not constrain its solutions to E and nothing
          downstream filters twist solutions, so P1's failure is a property of the
          encoding, reproduced here, not a malfunction of either run.
        - >-
          All 32 Macaulay2 rows abort identically (infrastructure_exit_-6). Review
          joint V2 established this is an RLIMIT_AS ARTIFACT, not memory exhaustion
          of F4: under the 6 GB cap the process dies with 5.996 GiB of ADDRESS SPACE
          against 2.575 GiB RESIDENT, and the same committed script completes
          uncapped, reserving 145 GiB of address space against a 6.8 GiB resident
          peak. Under core rule 5 these 32 rows are an infrastructure observation
          and say nothing about F4's memory behaviour on these systems.
        - >-
          V2 also found that every one of the 32 committed .m2 scripts carries a
          convert.py parse error at line 49 which fires AFTER the computation, so
          lifting the memory cap alone would convert 32 abort rows into 32
          exit-code-1 rows. Both defects are present in this run's scripts, so THIS
          RUN DOES NOT REPAIR THE GROEBNER COLUMN and P2 is null here for the same
          reason it was null in the first run.
        - >-
          All four Singular rows hit the 900 s budget again. V2 judged the
          invocation fair (identical ideal to Macaulay2's, single-threaded, still
          unfinished without option(redSB)) and found that slimgb on the same ring
          and ideal finishes in 167 s and agrees with F4 on a 43-element basis at
          max degree 2. So std is uncompetitive here, while the Groebner column is
          measurable on this host inside the contracted budget once the two defects
          above are removed.
        - >-
          The Singular version probe timed out at 60 s again, so this run cannot
          name the version it ran. V2 localised the cause to the probe's stdin
          handling. Recorded as an instrument defect.

