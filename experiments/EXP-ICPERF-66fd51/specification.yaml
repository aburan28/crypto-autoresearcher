experiment:
  id: EXP-ICPERF-66fd51
  hypothesis_id: H-ICPERF-cc4847
  goal_id: GOAL-ICPERF-e6b6a4
  version: 1
  title: >-
    PDP boundary row 1: every installed engine on Trimoska's 60 shipped S_4
    Weil-descent instances (n,l) in {(15,5),(17,6),(19,6)}, with independent
    certificate verification and matched random null objects
  status: analyzed
  status_history:
    - {status: draft, at: '2026-09-13', by: coordinator}
    - {status: review_required, at: '2026-09-13', by: coordinator}
    - {status: approved, at: '2026-09-13', by: coordinator, decision: DEC-20260913-6270ba,
       basis: standing user authorization 2026-09-06; protocol complete}
    - status: running
      at: '2026-09-13'
      by: coordinator
      note: RUN-ICPERF-305ca3 under TASK-20260913-0b470b.
    - status: completed
      at: '2026-09-15'
      by: coordinator
      note: >-
        Both runs terminal at 504 rows each. RUN-ICPERF-4ec9b9 was admitted by
        AMD-20260915-4ec9b9 (maximum_runs 1 -> 2, additive) and archived by
        TASK-20260915-620d66; RUN-ICPERF-305ca3 by TASK-20260913-e75497.
    - status: analyzed
      at: '2026-09-15'
      by: coordinator
      decision: DEC-20260915-87360d
      note: >-
        EV-ICPERF-390707 composed from REVIEW-ICPERF-20260913-66fd51 (joints V1-V6,
        two proves-too-much objects, two independent validators). NOT `archived`:
        the second batch reuses this phase structure, and three defects in this
        contract's own code are repaired against the next run rather than this one
        -- convert.py's `gens_` line, which zeroes the Macaulay2 column at any
        memory limit; RLIMIT_AS, which is not a memory limit for Macaulay2; and
        summary.py's three reporting defects. See DEC-20260915-87360d
        next_actions[0].
  objective: >-
    Produce the first fully measured point-decomposition column of the
    RQ-ICPERF-94c86e boundary table on the authors' own instances, and test
    predictions P1-P6 of H-ICPERF-cc4847. Observations only; the executor forms no
    conclusion.
  inputs:
    frozen_instances: inputs/TRIMOSKA-ECICB-2024/upstream/benchmarks/ (SRC-ICPERF-TRIMOSKA-ECICB-2024; 60 instances x {INFO, ANF, CNF-XOR, Magma})
    pure_cnf_regeneration: inputs/TRIMOSKA-ECICB-2024/upstream/XORtoCNF.sh, output hash-checked against inputs/TRIMOSKA-ECICB-2024/UPSTREAM_SHA256SUMS.txt per instance
    solver_source: inputs/TRIMOSKA-WDSAT-2024/upstream/src/ (SRC-ICPERF-TRIMOSKA-WDSAT-2024), rebuilt per exact static sizing derived from each ANF
    engines_installed_on_host:
      - WDSat @ 61c6ff3 (rebuilt; gcc version recorded in environment.json)
      - Macaulay2 1.22, groebnerBasis Strategy=>"F4" over ZZ/2 with field equations x^2-x appended, GRevLex
      - Singular 4.3.2, std over GF(2) with field equations, dp
      - CryptoMiniSat 5.11.15 (CNF-XOR native, and pure CNF)
      - CaDiCaL 1.7.4 (pure CNF)
      - MiniSat 2.2.1 (pure CNF)
    engines_absent_and_not_substituted: [Magma F4, PolyBoRi/BRiAl, msolve (characteristic 2 unsupported; not run)]
    certificate_arithmetic: experiments/EXP-ICPERF-66fd51/code/binec.py -- GF(2^n) with the INFO-file modulus, curve y^2+xy=x^3+x^2+1, half-trace root finding, four sign combinations of P1 +/- P2 +/- P3; written independently of the generator and of WDSat
    null_objects: experiments/EXP-ICPERF-66fd51/code/convert.py anf_null_object -- same header, same equation count, per equation the same multiset of term degrees, uniformly random distinct monomials, fair-coin constant; seed = 20260913*1000 + 100*n + id
    code: experiments/EXP-ICPERF-66fd51/code/{binec.py, convert.py, bench.py, summary.py}
    curves: the single fixed curve of the generator; n in {15, 17, 19}; l in {5, 6}; m-1 = 3
  controls:
    - id: C-CERT
      what: all 30 shipped S certificates verified with independent arithmetic before any solver runs (phase A.1)
      pass: 30/30 verified; any failure invalidates the instance set as an instrument and stops the run
    - id: C-ANSWER
      what: every SAT assignment returned by any engine is re-verified on the curve from its first m*l bits; a SAT answer on a U-labelled instance is recorded as an unexpected observation, not an error
      pass: every recorded SAT answer has verification.verified true
    - id: C-NULL
      what: matched random ANF of identical shape per template (3 S + 3 U per cell), WDSat default; shape equality asserted by convert.anf_shape
      pass: shape_matches_template true on every null row
    - id: C-REGEN
      what: pure-CNF files regenerated with the vendored XORtoCNF.sh must hash-match the upstream manifest
      pass: pure_cnf_hashcheck.match true on every phase-D row; a mismatch is recorded and the row still runs, flagged
    - id: C-UNSAT-CERT
      what: U-labelled instances are certified unsatisfiable only where a Groebner engine returns the unit ideal; otherwise UNSAT remains a solver report
      pass: reported per instance in summary; no pass/fail
    - id: C-LOAD
      what: 1-minute load average recorded at every launch; rows launched at loadavg > 2 are flagged in the task report
      pass: reported
  independent_variables:
    - cell (n, l)
    - label (S / U)
    - engine and configuration (WDSat default / core_order / noncore_first / symmetry / gauss_elim; CMS cnf_xor; CMS/CaDiCaL/MiniSat pure_cnf; M2 F4; Singular std)
    - structured instance vs matched null object
  metrics:
    primary:
      - SAT engines: conflicts (WDSat conf[0]; CryptoMiniSat 'c conflicts' where printed)
      - Groebner engines: engine-reported CPU seconds; Groebner basis size; maximal basis degree; unit-ideal flag
    secondary:
      - wall seconds, child CPU seconds (user+sys), children peak RSS high-water (KB), exit status, timeout flag, loadavg at launch
  preregistered_prediction:
    quantity: predictions P1-P6 of H-ICPERF-cc4847, evaluated by summary.py on per-cell medians over finished rows, S and U separately
    formula: see summary.py; medians exclude budget stops and infrastructure exits, which are counted per (cell,label,engine,config)
    source: H-ICPERF-cc4847 statement; thresholds 10x (P2, P3c, P6), exact per-instance equality (P3a), >=2x (P3b), >=0.9x with a 0.05 s default-median floor (P4), 2x and [0.5,2] (P5)
  coordinator_prior: >-
    P1 holds (the Coordinator's own pre-run check verified 30/30 certificates and a
    perturbed certificate failed). P2 holds against Macaulay2 on n15l5 by two to four
    orders of magnitude (smoke: WDSat 0.002-0.2 s vs M2 ~50 s) and Macaulay2 likely
    times out on most l=6 instances, leaving P2 asserting nothing there; Singular
    likely times out everywhere it is run. P3a holds by construction (the -g 1..ml
    order is a prefix of the default order; the smoke runs showed exactly equal
    counts on all 6 instances), which the report must say rather than present as a
    finding. P3b holds by orders of magnitude: the pre-run pilot of the non-core-
    first order gave 1.23M conflicts / 2.06 s on n15l5-1-S (default 26 / 0.005 s),
    81M / 109 s on n15l5-11-U (default 31k / 0.2 s), and >300 s on n17l6-11-U
    (default 2.3 s), so at l = 6 most non-core-first rows will be 120 s censored
    and the ratio lower bound will still exceed 2x by a wide margin. P4 holds
    where resolvable (smoke: -x slowed every instance 3-7x; the n15l5 S cell sits
    under the 0.05 s floor and asserts nothing). P5's SAT clause holds on n15 and n19
    (U conflicts 50-1000x S) but may FAIL on n17 where the one S smoke instance took
    108k conflicts against 255k for U (ratio 2.4, near the threshold); the Groebner
    clause is likely to hold on n15l5 (M2 S 51 s vs U 49 s in smoke). P6 holds by a
    wide margin (smoke: null objects 4.6M-7.7M conflicts or 600 s timeout vs 31k-256k
    structured). The Coordinator expects symmetry breaking (-b) to cut conflicts
    5-6x, matching claim C4's m! = 6, though no prediction is registered on it.
  scale_relevance:
    tier: toy
    justification: n <= 19, l <= 6, one fixed curve; the boundary row is exact for these cells and transfers to nothing without the later phases of GOAL-ICPERF-e6b6a4
    correspondence: null
  budget:
    enforcement: subprocess wall-clock timeout per engine invocation plus RLIMIT_AS 6 GB per child (bench.py); phases ordered A,B,C,D,E so a stop leaves the most valuable data
    wall_clock_seconds_per_run: 1800
    wall_clock_seconds_per_run_note: >-
      1800 is the largest single invocation (Macaulay2 F4 at l=6). Per engine:
      WDSat 600, WDSat noncore_first 120, WDSat null 180, CMS cnf_xor 300,
      generic pure-CNF 300, M2 l=5 600, Singular 900.
    maximum_memory_gb: 6
    maximum_runs: 1
    maximum_workers: 1 (engines run sequentially; the run is a timing benchmark)
    executor_wall_clock_seconds: 28800
    plan_sizes: WDSat 4 configs x 60 + noncore_first 30 (5 S + 5 U per cell) + 18 null; CMS cnf_xor 60; M2 20 (n15l5) + 6 per l=6 cell; pure-CNF 3 engines x 10 per cell; Singular 4 (n15l5)
  stopping_rules:
    - C-CERT fails: stop before any solver, record which certificate failed and why
    - executor wall clock reached: stop, keep results.jsonl as the partial artifact, run summary.py, record which phases finished in phase_log.txt
    - a phase's every row is a budget stop: continue to the next phase (the stops are data)
  invalidation_rules:
    - results.jsonl absent or unparsable
    - any WDSat row whose wdsat_constants MAX_ID differs from the ANF-derived value (mis-sized build)
    - null object rows with shape_matches_template false
    - manifest.yaml missing code.commit or the inference block
  success_criterion: >-
    Every planned row is either finished or recorded as a budget stop with its timeout;
    summary.json evaluates P1-P6 (with None where no engine finished); the task report
    lists every unexpected observation (SAT on a U instance, verification failure,
    hash mismatch, high load at launch).
  falsification_criterion: >-
    Per H-ICPERF-cc4847: P1 any failure; P2 any cell with a finishing Groebner engine
    where the WDSat/Groebner median wall ratio exceeds 0.1; P3, P4, P5, P6 as stated.
    The executor reports the summary values; the Coordinator decides.
  required_artifacts:
    - experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-305ca3/manifest.yaml
    - experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-305ca3/results.jsonl
    - experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-305ca3/summary.json
    - experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-305ca3/environment.json
    - experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-305ca3/task-report.md
    - experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-305ca3/logs/ (stdout/stderr per invocation)
    - experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-305ca3/builds/*/config_used.json and make.log
    - experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-305ca3/null_objects/ and pure_cnf/*.hashcheck.json
  assigned_to: executor-mechanical (Coordinator-provided code; judgement-free execution)
  approved_by: coordinator
  approval_basis: DEC-20260913-6270ba under standing user authorization (AGENTS.md, 2026-09-06)
  dependencies:
    - SRC-ICPERF-TRIMOSKA-ECICB-2024 committed
    - SRC-ICPERF-TRIMOSKA-WDSAT-2024 committed
    - TASK-20260913-f8bdec snapshot of this contract and code before execution
  independence_note: >-
    The certificate checker was written by the Coordinator from the curve and field
    definitions without reading semaev.c, weil.c or wdsat.c; the validator's
    blind re-derivation joint recomputes the certificates without reading binec.py.
  interpretation_limits:
    - Six engine builds on one host; not Magma F4, not PolyBoRi, not l > 6.
    - WDSat is rebuilt with exact static constants per ANF; the authors' binary and constants are not reproduced.
    - The pure-CNF encoding is the authors' XORtoCNF.sh; a different XOR-to-CNF encoding could change every phase-D number.
    - Reported literature timings are not reproduced and appear in no ratio.
    - No relation-yield, linear-algebra or rho column exists in this row.
