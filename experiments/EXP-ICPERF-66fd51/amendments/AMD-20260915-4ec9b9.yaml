protocol_amendment:
  id: AMD-20260915-4ec9b9
  experiment_id: EXP-ICPERF-66fd51
  recorded_at: '2026-09-15T17:30Z'
  recorded_by: coordinator
  kind: additive
  amends_field: budget.maximum_runs
  from: 1
  to: 2
  authority: >-
    Coordinator, under the standing user authorization of 2026-09-06 (AGENTS.md
    "Standing user authorization for ideas and experiments") and the explicit
    user execution request of 2026-09-15 ("/run the icperf expierment", then
    "Run"). The protocol is not rewritten: this file is additive and the frozen
    specification.yaml is unedited, per CLAUDE.md "Changing a frozen scientific
    protocol uses an additive amendment; never rewrite historical records".

  what_this_changes: >-
    Exactly one number: the run cap rises from 1 to 2, admitting a second
    execution of the SAME frozen protocol. Nothing else moves. No metric
    definition, no prediction, no control, no threshold, no timeout, no phase
    order, no invalidation rule, and no success criterion is touched, and no
    hypothesis or record changes status because of this file.

  what_this_does_not_change:
    - >-
      The predictions. P1-P6 in H-ICPERF-cc4847 are worded once and are scored
      per run; a second run does not restate, weaken, or re-tune them, and a run
      that disagrees with the first is a disagreement to be reported rather than
      an average to be taken.
    - >-
      The claim tier. Two runs of one protocol on one host is a replication of a
      measurement, not evidence at a new scale and not a step toward any
      asymptotic claim. Everything stays scoped to n <= 19, l <= 6, one curve,
      one 4-CPU machine.
    - >-
      RUN-ICPERF-305ca3. It is immutable, already snapshot-archived
      (TASK-20260913-e75497), and under independent review right now
      (REVIEW-ICPERF-20260913-66fd51). This amendment neither supersedes nor
      repairs it.

  why:
    the_request: >-
      The user asked for the experiment to be run. The first run was already
      complete and archived, so re-running in place was not available: it would
      have overwritten an immutable, archived, under-review run package and
      broken the archive's content binding.
    what_a_second_run_buys_scientifically: >-
      RUN-ICPERF-305ca3's timings carry a disclosed contamination. 125 of its 504
      rows started at loadavg > 2, and its validator (TASK-20260913-6c5729, joint
      V5) found that the exclusion test meant to control for that is UNDERPOWERED
      BY CONSTRUCTION: phase D is 82/90 high-load, so there is no low-load control
      group inside that run, and on one cell excluding high-load rows leaves no
      rows at all. Its host wall clock also spans two VM suspensions of 43866 s
      and 59032 s. A second execution on an uninterrupted host with no concurrent
      subagent gives the low-load comparison the first run cannot give from its
      own rows -- which is the one thing that makes P3c's and P4's medians
      readable as timings rather than as phase membership.
    why_this_is_not_make_work: >-
      It is ranked above doing nothing on a specific ground: without it, every
      wall-time ratio in the boundary table of RQ-ICPERF-94c86e rests on rows
      whose contamination is bounded only by a wall-versus-cpu argument, and the
      duty to rank (AGENTS.md "ECC comes first ... unlimited removes the batch
      ceiling, not the duty to rank") is met by naming that gap rather than by
      the run cap being liftable.

  the_second_run:
    run_id: RUN-ICPERF-4ec9b9
    directory: experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-4ec9b9
    started_at: '2026-09-15T10:24Z'
    status_at_recording: >-
      IN FLIGHT. Phases A, B, C, D finished (6900.4 s, 3153.2 s, 236.2 s,
      13348.5 s); phase E (Singular, 900 s per row) is executing. 501 rows
      recorded of a planned 504. No conclusion is drawn from it in this file.
    same_code: >-
      Launched from the same committed code as the first run and with the same
      plan; the run's own environment.json and the manifest written at completion
      carry the exact commit and dirty-tree state, and they, not this file, are
      the record of what ran.
    execution_role_note: >-
      Launched by the Coordinator session in the executor-mechanical role, as
      RUN-ICPERF-305ca3's closure also had to be (recorded in that run's
      manifest). The manifest for this run records the same, with fallback_used
      and its reason, rather than presenting a Coordinator-run execution as a
      dispatched Executor's.

  known_defect_carried_by_both_runs: >-
    THIS RUN'S summary.json WILL CARRY THE SAME THREE DEFECTS the validator found
    in the first, because summary.py is deliberately NOT being edited while a run
    that uses it is in flight: (1) the four P3c ratios are one number copied
    across cells by a loop variable that leaks its scope; (2) P5's Groebner clause
    is never evaluated because it guards on `engine_cpu_s`, a key present on 0 of
    504 rows, and reports `holds: true` on half the prediction; (3) P6's top-level
    boolean drops a cell whose value is unevaluable from its conjunction, so
    "holds on every cell" is reported when one cell was not testable. A reader of
    either run's summary.json must read those three fields as the validator's
    corrected values, not as printed. Recorded here BEFORE this run's summary is
    produced so the defect is not discovered a second time and mistaken for new.
    Repairing summary.py is a successor task against the next run, never an edit
    under a running one.

  supersedes: null
  superseded_by: null
  validation_note: >-
    tools/validate_ledger.py does not read experiment amendment files. This file
    is a protocol record, not a ledger record; its authority is the Coordinator
    decision it cites and the queue entry that carries the run.
