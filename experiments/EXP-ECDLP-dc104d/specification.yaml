  source_idea_ids: [IDEA-20260921-4af08b]
  question_id: RQ-CRYPTO-001
  goal_id: GOAL-CRYPTO-001
  version: 1
  title: >-
    The stability-signal tradeoff as a theorem-shaped obstruction:
    derivation-level proof note with obligation-by-obligation verdicts
    (including the exact inversion-transform identity and the
    Lean-lane assessment), plus the toy inversion-image verification
    (lambda vs inversion-image lambda for the both-structures family,
    the interval, and the QR equality case) on the census's primary
    ladder.
  status: approved
  assigned_to: executor
  approved_by: coordinator
  approval_decision: DEC-20260921-f718a2
  approval_basis: >-
    AGENTS.md standing user authorization of 2026-09-06; Coordinator
    protocol-completeness check passed. The proof note's obligations and
    the toy rows are frozen; budget advisory; 8 GiB memory ceiling
    machine protection only.
  recorded_at: '2026-09-21'
  inference:
    requested_policy: executor-implementation
    runtime: null
    resolved_model_id: null
    model_verified: false
    reasoning_effort: null
    fallback_used: false
    degraded_requirements: []
    session_identity: null
    provenance_note: >-
      Designed and executed in the top-level coordinator session under
      the respective role contracts (role-runtime outage, AWS
      DescribeInstances AuthFailure, recorded in DEC-20260921-4d1b40).
  scale_relevance:
    tier: toy
    justification: >-
      The proof note is a derivation-level artifact; the toy run is the
      census harness at the census's primary ladder, exact computation.
    correspondence: null

  proof_note_obligations:
    - id: O1
      obligation: >-
        FEASIBILITY: define "PGL_2-closed family" (a set F of subsets of
        P^1(F_p) with {A o M : A in F, M in PGL_2} = F, excluding the
        trivial closures: the family of all sets, and families closed
        only under a proper subgroup) and "lambda-constant at scale
        p^{lambda_0}" precisely enough to quantify.
    - id: O2
      obligation: >-
        STEP 1 (concentration implies structure): a set whose
        probability-normalised indicator has l1* at scale
        p^{lambda_0} with lambda_0 < 1/2 (concentration below the flat
        level) has approximate additive structure at the measured
        scales, via energy/doubling in the b6ad24 machinery. Verdict
        honestly: DERIVED-AS-FOLKLORE (the converse direction of
        Freiman-type results is external and unextracted; flagged
        recalled).
    - id: O3
      obligation: >-
        STEP 2 (inversion destroys structure): the inversion image of
        an additively structured set is an arc with no comparable
        additive structure. Verdict honestly: GEOMETRIC-CLASSICAL (the
        image statement is elementary; the quantitative no-structure
        claim is folklore).
    - id: O4
      obligation: >-
        STEP 3 (Kloosterman cancellation forbids concentration): derive
        the EXACT identity for the inversion image's transform --
        for v = 1_A/|A| and w = v o inv (inv(x) = 1/x, inv(0) = 0
        frozen), w-hat(k) = (1/|A|) sum_{x in A} e^{-2 pi i k x^{-1}/p},
        a pure character sum over the inverted set -- and state the
        Weil-cancellation consequence |w-hat(k)| <= sqrt(p)-scale for
        every k (RECALLED bound; the identity itself is exact and
        checked numerically in the toy run).
    - id: O5
      obligation: >-
        COMPOSITION: state exactly what O2-O4 compose into at the
        derivation level actually achieved, and what remains open; the
        honest expected outcome is a FRAGMENT (the exact
        inversion-identity plus the boundary cases) with the full
        contradiction chain left open pending the extractions.
    - id: O6
      obligation: >-
        SCOPE and COUNTEREXAMPLE SEARCH: the theorem (if achieved)
        covers set statistics only; the escape hatch (characters,
        partitions) is stated with the measured runs cited
        (RUN-ECDLP-ee15df, RUN-ECDLP-3e2225); the both-structures
        families (interval cap QR, cross-ratio QR -- the latter measured
        flat in RUN-ECDLP-4dfb36) are enumerated and classified
        (inside the fragment's scope or the recorded gap); the
        multiplicative cosets are the equality case (flat under
        inversion by the QR symmetry, cited).

  lean_lane_assessment:
    note: >-
      Per the harness's proof-oriented-work rule, the load-bearing lemma
      suitable for Lean is O4's exact identity (the inversion-image
      transform as a character sum over the inverted set) together with
      the QR-invariance equality case. FORMALIZATION NOT YET USEFUL: the
      transitive claim needs the external unextracted bounds (Freiman
      converse, Kloosterman/Weil cancellation) whose exact statements
      are not yet on file; formalizing the fragment before extraction
      would pin the wrong statements. REVISIT TRIGGER: after the
      Kloosterman/Weil and Freiman-converse forms are extracted into
      knowledge/ (the proof note names the exact sources to extract),
      re-open the formalization task for O4 + the equality case.

  toy_rows:
    - id: IVQ
      construction: >-
        v = 1_A/|A|, A = {x in [0, p div 8) : x is a nonzero quadratic
        residue} -- the both-structures family (additive interval cap
        multiplicative coset).
    - id: IVQI
      construction: >-
        The inversion image: v composed with inv (inv(x) = 1/x for
        x != 0, inv(0) = 0 frozen); the Kloosterman-governed object of
        step O4.
    - id: R01
      construction: the census's interval row verbatim (structured
        member; its inversion image is the arc).
    - id: R01I
      construction: the interval row composed with inv.
    - id: R08
      construction: the census's QR row verbatim (the equality case).
    - id: R08I
      construction: >-
        the QR row composed with inv -- MUST equal R08's set exactly
        (inversion preserves QR), the equality-case check.
    - id: C02A
      construction: the random-set control, seed set A (level 0.5).
    - id: C01
      construction: v = 1/p everywhere.

  ladder:
    note: The census's frozen primary ladder VERBATIM.
    primes: [4099, 8209, 16411, 32771, 65537, 185369, 524309, 1482919, 4194319, 16777259]

  controls:
    - R08I equals R08 exactly (same set; l1* agreement to 1e-12
      relative) -- the equality-case check.
    - C01 exact zero; C02A Parseval band.
    - vhat(0) = 1 within 1e-9 for every ok cell.
    - The O4 identity checked numerically at one prime: w-hat(k)
      recomputed by the naive DFT on the inverted set and compared.
    - Checker battery: naive DFT and second chirp-z spots, 1e-9.

  primary_metrics:
    - fitted lambda per row with SE, jackknife.
    - the inversion-collapse statistic: delta_inv = lambda(row) -
      lambda(row composed with inv) per family, with combined SE.
    - the proof note's obligation-by-obligation verdicts (derived /
      folklore-flagged / open) as first-class outputs.

  verdict_vocabulary:
    - inversion_collapse_confirmed: a structured row's inversion image
      reads at the flat level within 2SE while the row itself reads
      below/above it (the mechanism's measured instance)
    - equality_case_holds: R08I = R08 exactly
    - no_structure_to_collapse: the both-structures row reads flat
      already (nothing to test; recorded)
    - unresolved / void_control_failure as before

  stopping_rules:
    - First failed control halts dependent reads and marks the run void
      with the defective control named.
    - Memory above 8 GiB checkpoints the cell (machine protection).
    - No row, prime, seed, or obligation change after any outcome; the
      proof note's verdicts are frozen once written.

  invalidation_rules:
    - Composite-length surrogate DFT or a non-canonical normalisation.
    - The R08I equality check failing silently absorbed.
    - The proof note claiming DERIVED for an obligation whose support
      is recalled-only (the verdict labels are the point).

  success_criterion: >-
    The proof note exists with all six obligations carrying honest
    verdicts (derived / folklore-flagged / open), the exact O4 identity
    stated and numerically checked, the Lean-lane assessment recorded
    with its revisit trigger, and the toy run completes all cells with
    all controls passing, the equality case holding exactly, and each
    family's (lambda, inversion-image lambda) pair on record.

  falsification_criterion: >-
    Any control failure voids the toy run (infrastructure, never
    mathematical evidence). A both-structures row reading
    structured-and-inversion-stable (lambda and its inversion image
    both off the flat level within 2SE of each other) REFUTES the
    obstruction's mechanism by counterexample and promotes the family
    to the lane's measured successor. The proof note's honest outcome
    may be a fragment: the open obligations are named, not hidden --
    per the idea's own falsification conditions.

