# EXP-ECDLP-16307a
# Balance-page arithmetic. No matrix.
# Approved by DEC-20261002-11c3b0.
experiment:
  id: EXP-ECDLP-16307a
  hypothesis_id: H-ECDLP-cc2a21
  source_idea: IDEA-20261002-e2a340
  question_id: RQ-ECDLP-002
  version: 1
  title: Balance-page arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-11c3b0
  objective: >-
    Check the unstructured identity 4096 squared = 16777216, the
    circulant identity 2304 cubed = 9437184 times 1296, and the gap
    7340032.
  inputs:
    B: 64
    log2_B: 6
    log2_square: 36
    B_squared: 4096
    B_cubed: 262144
    B_fourth: 16777216
    T_unstructured: 4096
    N_unstructured: 16777216
    T_circulant: 2304
    N_circulant: 9437184
    polylog_square: 1296
    T_circulant_cubed: 12230590464
    dense_gap: 7340032
    cross_nine: 150994944
    N_miss_unstructured: 262144
    miss_cube: 68719476736
    N_miss_circulant: 147456
    miss_square: 5308416
    toy_N: 65536
    toy_lambda: 256
    toy_gap: 16711680
  controls:
    - >-
      4096 squared equals 16777216. Reporting that square as a
      different value invalidates the run.
    - >-
      2304 cubed equals 9437184 times 1296. Reporting a different
      cube invalidates the run.
    - >-
      16777216 exceeds 9437184 by 7340032. Nine times 16777216 equals
      sixteen times 9437184.
    - >-
      The missing-factor page is nearby and false as a model exponent.
      Unstructured N = 262144 has exponent 2/3. Circulant N = 147456
      has T squared equal to 36 times N. Reporting either as the model
      exponent invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - route in {powers_of_two, decimal_products}
  metrics:
    primary:
      - unstructured_square
      - circulant_cube
      - dense_gap
      - implementations_agree
    secondary:
      - boundary_ratio
      - toy_lambda
      - miss_cube
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      4096 squared equals 16777216, 2304 cubed equals 12230590464, and
      16777216 exceeds 9437184 by 7340032.
    formula: >-
      Square 64 to reach 4096, then square again to reach 16777216.
      Multiply 64 by 36 to reach 2304, then multiply 4096 by 2304 to
      reach 9437184. Cube 2304 and compare with 9437184 times 1296.
    source: >-
      IDEA-20261002-e2a340 states the two charges and the balances at
      exponent 1/2 and 1/3, read 2026-10-02. The products were computed
      in this design session. That computation is not a run. No matrix
      was built.
  scale_relevance:
    tier: toy
    justification: Integers at B = 64. No transfer to a curve.
    correspondence: null
  tail_checks:
    - The gap 7340032 is required. A check that stops at the unstructured square is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 7340032 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - 4096 squared is not 16777216.
    - 2304 cubed is not 12230590464.
    - The gap of 16777216 over 9437184 is not 7340032.
    - The unstructured ratio is reported as strictly above 1.
    - The missing-factor exponent 2/3 is reported as the model exponent.
    - A matrix is built or a commutator is computed.
  success_criterion: >-
    Both runs agree that 4096 squared is 16777216, that 2304 cubed is
    12230590464, that 16777216 exceeds 9437184 by 7340032, and that
    nine times 16777216 equals sixteen times 9437184.
  falsification_criterion: >-
    The runs agree that B to the fourth is 16777216, and 4096 squared
    is not that value.
  required_artifacts:
    - experiments/EXP-ECDLP-16307a/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-16307a/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-16307a/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-16307a/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-16307a/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-16307a/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any relation matrix, commutator, or FFT.
    - Any curve and any discrete-log solve.
    - Any claim that the model exponent 1/3 is an attack cost.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
