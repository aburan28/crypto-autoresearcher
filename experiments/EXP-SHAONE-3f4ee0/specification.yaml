experiment:
  id: EXP-SHAONE-3f4ee0
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-d3151e; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-d3151e
  question_id: RQ-SHAONE-081e3a
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Decide P1 (collision-admitting) and P2 (accept-changing) over a named finite set of formalized
    container-format grammars, with a forced-fail zero-slack control, a forced-pass known-slack control,
    and a marginal-matched random-grammar null.
  objective: 'The run reduces one uncertainty: whether format-level semantic collision-exploitability
    can be made a DECIDABLE, CONTROLLED count rather than an anecdote, and how the named set splits
    under it. Specifically: (i) do the two controls behave as forced -- the zero-slack format fails
    P1 and the known-slack format passes P2 -- establishing that the predicate encodes the obstacle
    it names; (ii) how many formats pass P1 versus P2, and is the P1-pass/P2-fail gap non-empty, which
    is the empirical test of whether the two-predicate split is meaningful on this set or collapses
    to P1 alone; (iii) does the real-format pass rate separate from the marginal-matched random-grammar
    null, without which the verdict is a function of field count and boolean frequency and carries
    no format-specific information. The run does not attempt any collision, evaluates no hash, and
    touches no deployed system. Its entire output is two counts, a per-fail reason table, a count
    of UNKNOWN annotations, and a signal-versus-null comparison over grammars the run itself formalizes
    and declares as models.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: over the named finite set
      of grammars AS FORMALIZED in this contract and under the STAGE 1 annotation rules, the predicates
      P1 and P2 take the reported verdicts, the controls behave as forced, and the real-vs-null separation
      is as measured. What does NOT follow: that any real deployed instance of any listed format is
      exploitable, that a collision against it exists or is affordable, that the literature does or
      does not report such an attack, or that a format passing P2 is anything more than a grammar
      lacking one structural obstacle in a stated model.'
  inputs:
    procedure: 'STAGE 0 (cost: low): freeze the STAGE 1 annotation rules for SLACK, HASHED, CONSULTED,
      DIVERGENT and the canonical field-decomposition rule; commit them before any grammar is written.
      STAGE 1 (cost: medium): formalize six grammars as JSON field lists -- zero-slack negative control,
      known-slack positive control, four real-format models -- each with a provenance note per field
      marking structural vs assumed. STAGE 2 (cost: low): implement the P1/P2 evaluator in Python;
      for each fail record the first missing conjunct in fixed order SLACK,HASHED,CONSULTED,DIVERGENT.
      STAGE 3 (cost: low): run the evaluator on all six grammars; assert the two controls behave as
      forced and halt with an error if not. STAGE 4 (cost: low): for each real format, generate 1000
      marginal-matched random grammars (same field count, same per-boolean marginal frequency, independent
      assignment) and compute null P1/P2 pass rates with a bootstrap interval. STAGE 5 (cost: low):
      a second annotator independently annotates one real grammar; record the field-level disagreement
      rate. STAGE 6 (cost: low): emit the two counts, the per-fail reason table, the UNKNOWN count,
      and the real-vs-null comparison.'
    instrument: 'Python 3 standard library only: json for grammar files, random and a fixed seed for
      the null generator, statistics for bootstrap intervals. A single ~150-line evaluator module
      under harness/ (new module, e.g. harness/format_slack_predicate.py, modeled on the counting
      style of existing harness/run_*.py scripts). No Sage, no cryptographic library, no hash evaluation
      -- the run never computes SHA-1 or any digest.'
    parameters: 'Named set: exactly 6 grammars (1 negative control, 1 positive control, 4 real-format
      models). Fields per grammar: 4 to 20. Four boolean annotations per field, plus an UNKNOWN state.
      Null: 1000 random grammars per real format, fixed seed. Bootstrap: 2000 resamples for the null
      pass-rate interval. Two-annotator check: at least 1 real grammar annotated independently by
      a second pass.'
  controls:
  - 'Zero-slack negative control: fixed-length fully-hashed record, must fail P1.'
  - 'Known-slack positive control: format with a declared length-free uninterpreted hashed-and-rendered
    field, must pass P2.'
  - 'Marginal-matched random-grammar null: same field count and boolean marginals, booleans assigned
    independently.'
  - Fixed conjunct-order fail attribution, so the same fail is always attributed to the same missing
    conjunct across formats and across the null.
  - Two-annotator agreement check on at least one real grammar to bound annotation subjectivity.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A random grammar of the same shape: same field count as a target format
    and the same marginal frequency of each of the four booleans across fields, but with the four
    booleans assigned to fields independently (destroying any correlation that puts SLACK, HASHED,
    CONSULTED and DIVERGENT together on one field). The identical P1/P2 evaluator runs against it.
    For the signal arm to mean anything about deployed formats specifically, the real formats'' pass
    rate must differ from the marginal-matched random grammars'' pass rate: if they match, the verdict
    is a function of field count and marginal boolean frequency alone, and reveals nothing about the
    structured alignment that a real attack needs.'
  independent_variables:
  - format grammar (which of the 6 is evaluated)
  - arm (signal grammar vs marginal-matched null grammar)
  - predicate level (P1 vs P2)
  metrics:
    primary:
    - P1 verdict per grammar
    - P2 verdict per grammar
    - count of formats in the P1-pass/P2-fail gap
    - real-format vs null P2 pass-rate difference with bootstrap interval
    secondary:
    - per-fail first-missing-conjunct table
    - count of UNKNOWN annotations per grammar
    - two-annotator field-level disagreement rate
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The verdict vector (P1,P2) for each of the 6 grammars, the size of the P1-pass/P2-fail
      gap, and whether the real-format P2 pass rate lies outside the null's bootstrap interval.
    formula: P1(G) = OR over fields f of [SLACK(f) AND HASHED(f)]. P2(G) = OR over fields f of [SLACK(f)
      AND HASHED(f) AND CONSULTED(f) AND DIVERGENT(f)]. Gap = count of grammars with P1(G) true and
      P2(G) false. Null separation holds iff the observed real-format P2 pass rate is outside the
      [2.5, 97.5] percentile interval of the 1000 marginal-matched random grammars' P2 pass rates.
    source: Pre-registered in the parent proposal IDEA-20260816-d3151e before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested scale is 6 hand-formalized grammars plus a per-format null of 1000 random
      grammars; this is a symbolic audit, not a cryptographic run. No transfer to real deployed formats
      is claimed: the grammars are stated models and the counts are scoped to them. The only extrapolation
      assumption -- antitone monotonicity of the four booleans under refinement -- is stated and makes
      each pass an upper bound rather than a claim about reality.'
    correspondence: null
  tail_checks:
  - Inspect grammars where every field annotates UNKNOWN -- these produce no verdict and must not
    be silently counted as fails.
  - Inspect any real format whose P2 verdict flips under a single plausible field-decomposition change,
    flagging decomposition-sensitivity.
  - Inspect the null grammars at the extreme tail (all four booleans landing on one field by chance)
    to confirm the null generator can produce passes.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt with an error if either control violates its forced verdict; no other result is admissible
    until the evaluator or rules are fixed.
  - Stop after the 6 grammars and the per-format null are evaluated; no additional formats are added
    mid-run to chase a desired count.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both controls behave as forced AND the run emits the two counts, the per-fail
    reason table, the UNKNOWN count, and a real-vs-null comparison with its bootstrap interval, regardless
    of whether the split favors pass or fail.
  falsification_criterion:
  - The zero-slack negative control passes P1.
  - The known-slack positive control fails P2.
  - The P1-pass/P2-fail gap is empty across all real formats.
  - The real-format P2 pass rate lies inside the null's bootstrap interval.
  - More than half of real-format fields annotate UNKNOWN.
  - Two-annotator disagreement exceeds the declared per-grammar threshold.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-d3151e
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - A Coordinator must approve the exact STAGE 1 annotation-rule text and the canonical field-decomposition
    rule before the run; their precision is load-bearing and outside this draft.
  - The four real formats to formalize are not fixed here; the Coordinator selects them and records
    the selection reason, since set choice is a declared confounder.
  - The two-annotator disagreement threshold that triggers falsification must be set by the Coordinator
    before annotation begins.
