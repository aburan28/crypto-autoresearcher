experiment:
  id: EXP-UOV-d217fb
  hypothesis_id: H-UOV-f58323
  derived_from_idea: IDEA-20260805-69af7c
  question_id: RQ-UOV-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Memory-charged UOV key-recovery cost table - the (time, memory) hybridisation frontier against a
    polynomial-memory comparator at a ladder of memory caps, with a polynomial-memory null family that
    must produce a single point, a positive control with a forced gap, a sensitivity sweep over every
    named convention, and a one-line parameter-floor consistency test
  objective: >-
    The one uncertainty a run reduces - whether charging the memory that the quoted UOV key-recovery
    figure drops changes which attack is binding, or merely changes the reported gap. A run establishes
    (i) the full (log2 time, log2 memory) table over the hybridisation parameter for each family and each
    audited tuple, and whether the polynomial-memory null family correctly degenerates to a single point;
    (ii) the best achievable time at each of five memory caps per family per tuple, hence the
    margin-compression metric and whether any rank inversion occurs; (iii) the sensitivity of every
    conclusion to the linear-algebra exponent, the sparse-versus-dense memory charge and the comparator's
    polynomial cofactor, so that a conclusion surviving only at one corner is reported as
    convention-dependent; and (iv) the pass/fail verdict of the parameter-floor test on every candidate
    tuple. No attack is proposed, no exponent is claimed to move, and nothing here is evidence about the
    security of any deployed parameter set.
  what_this_is_not:
  - >-
    Not an attack, and it must not be read as proposing one. Every cost is an evaluation of a published-
    style model, not an execution.
  - >-
    Not a measurement of the solving degree, which is a sibling record's object and is consumed here as an
    inherited heuristic input.
  - >-
    Not an entry into the quotient-ring, whipping or group-action variants' goals. This contract derives
    the CONVENTION those goals must share and deliberately does not enter any of them.
  - >-
    Not implementation-level cost modelling. The charge is the abstract circuit-model one and says nothing
    about cache hierarchies or concrete hardware.
  - >-
    Not a security argument for UOV. A scheme looking stronger under charged memory is a statement about
    two named families under one cost model.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has been
    executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - under the declared cost model, memory charge, degree-of-regularity
      convention, linear-algebra exponent and comparator cofactor, the two named attack families occupy the
      tabulated points of the (time, memory) plane at the audited tuples; their gap compresses by the
      tabulated number of bits when memory is capped; the time-optimal family does or does not change over
      the cap ladder; and the listed tuples pass or fail the parameter floor. WHAT DOES NOT FOLLOW - nothing
      about the security of any deployed parameter set; nothing about families not costed, which are
      enumerated with reasons; nothing about actual hardware cost; and nothing about the correctness of the
      recalled tuples themselves, since the floor test is necessary and not sufficient.
  inputs:
    procedure: >-
      STAGE 0 (zero compute). Freeze the memory-cap ladder, the linear-algebra exponent values, the two
      memory-charge conventions, the three comparator cofactors, the four candidate tuples and their claimed
      security levels, and the degree-of-regularity convention. Declare that the in-harness computation, not
      the parent proposal's scratchpad figures, is authoritative wherever they disagree.
      STAGE 1 (minutes, IN-HARNESS RECOMPUTATION AND HARD GATE). Re-implement the Hilbert series, the time
      and memory formulas over the hybridisation parameter, the polynomial-memory comparator and the
      parameter floor in committed code, and reproduce every figure the parent proposal quotes. ANY
      disagreement is resolved in favour of the in-harness computation and is reported as a defect of the
      parent record.
      STAGE 2 (minutes, SENSITIVITY). Re-run the whole table at three linear-algebra exponents, at both the
      sparse and the dense memory charge, and at three comparator cofactors. Report WHICH conclusions
      survive ALL combinations. A conclusion that survives only at the attacker-favourable corner is
      reported as convention-dependent, not as a result.
      STAGE 3 (BLOCKING FOR AUTHORITATIVE TUPLES). Read the round-3 specification, replace the recalled
      tuples, and re-run. If the specification already tabulates memory beside time for every attack in its
      own table, REPORT THAT AS THE PRIMARY FINDING - the audit's frontier part is then a reproduction.
      STAGE 4 (zero compute). Assemble the frontier tables, the capped-optimum tables, the sensitivity
      matrix, the parameter-floor verdicts, and the explicit list of families NOT costed with the reason for
      each.
    instrument: >-
      Roughly 150 lines of Python 3.11 standard library - exact integer binomial coefficients, an exact
      series-coefficient loop for the Hilbert series, a sweep over the hybridisation parameter, and a table
      writer. Exact integer arithmetic throughout with logarithms taken only at output time. NO solver, no
      field arithmetic, no seeds, no external dependency. Recorded through harness/runner.py.
    parameters: >-
      Four candidate UOV parameter tuples, treated as RECALLED-UNVERIFIED and used only to exercise the
      machinery. Memory caps at log2 field elements in {30, 40, 50, 60, 72}. Linear-algebra exponent at three
      values spanning the standard range. Memory charge at both the sparse (columns) and dense (columns
      squared) conventions. Comparator cofactor at three candidate polynomial powers. Hybridisation parameter
      swept over the full admissible range for each tuple. Claimed security level per tuple for the
      parameter-floor test. Standardized parameter sets - the audited tuples are candidates for NIST levels I,
      III and V, and every reported number names which level it is being compared against.
  controls:
  - >-
    NULL OBJECT, MANDATORY AND BLOCKING (same shape, forced value derived before the run, CAN FAIL). Apply
    the identical frontier machinery to a family whose memory requirement is KNOWN polynomial in the
    parameters - exhaustive search over the oil space. FORCED VALUE - its (T, S) curve must be a SINGLE POINT
    with S constant in the hybridisation parameter, and its memory-capped optimum must equal its unconstrained
    optimum at every cap above the polynomial floor. If the machinery reports a nontrivial frontier for this
    family, the machinery is MANUFACTURING FRONTIERS and every other curve it produced is void.
  - >-
    POSITIVE CONTROL, WHERE THE EFFECT MUST APPEAR. A comparison whose gap is purely memory-bought - the
    intersection attack at zero hybridisation versus the same attack at the largest hybridisation parameter
    whose memory fits the smallest cap. The time gap between them MUST be large and positive because the model
    makes it so by construction. If the implemented machinery reports a small or negative gap it is broken, and
    NO negative conclusion about memory charging may be drawn from any other row.
  - >-
    GRADED CONTROL WITH FIVE INTERIOR POINTS. Sweep the memory cap over the full ladder and report the best
    time at each. DERIVED EXPECTATION - strictly decreasing in the cap, and convex in log-log. A non-monotone
    reading means the hybridisation search is mis-implemented, since the time is provably increasing and the
    memory provably decreasing in the hybridisation parameter.
  - >-
    ORDERING CONTROL. Both null arms and the Stage-2 sensitivity sweep are computed and written before the
    headline table is assembled, so the headline cannot be chosen to suit the corner that produced it.
  - >-
    MIRROR-FAILURE CHECK, EXPLICIT. If the memory-charged ranking of the two families were IDENTICAL to the
    time-only ranking at every cap and every tuple, then charging memory would be a change of units with zero
    comparator spread and this contract would say nothing. The margin-compression metric IS that check, and a
    reading below the declared threshold at every tuple is the check firing.
  - >-
    ARCHIVE CHECK (zero compute). Record that no prior memory-charged multivariate costing exists in this
    corpus, and that the area-time technique is catalogued but its intended vehicle has never executed. The
    ABSENCE is recorded as an absence and is not claimed as a passed check.
  independent_variables:
  - attack family (intersection-style key recovery / polynomial-memory comparator / polynomial-memory null / direct key equation)
  - hybridisation parameter g
  - parameter tuple (four candidates)
  - memory cap (five values)
  - linear-algebra exponent (three values)
  - memory-charge convention (sparse columns / dense columns squared)
  - comparator polynomial cofactor (three values)
  metrics:
    primary:
    - >-
      margin_compression - in bits, per tuple. Computed as (log2 time of the comparator minus log2 time of the
      intersection attack at unbounded memory) minus (log2 time of the comparator minus log2 best time of the
      intersection attack under a 2^60 field-element memory cap). At least 20 bits at at least two of the four
      tuples supports S3; below 20 bits at every tuple refutes it.
    - >-
      rank_inversion_budget - in log2 field elements, or the literal string DOES_NOT_EXIST. The largest memory
      cap at which the time-optimal family differs from the time-optimal family at unbounded memory. Predicted
      to not exist above 2^30.
    - >-
      frontier_table - the full (log2 T, log2 S) pair for every hybridisation parameter, family and tuple, with
      the degree of regularity each cell relies on printed beside it so a later correction can be applied
      without recomputing the table.
    - >-
      parameter_floor_verdict - per candidate tuple, the computed value of (n - 2m - 1) log2 q + 4 log2 m
      against the claimed level, and a PASS or FAIL, at each of the three comparator cofactors.
    - >-
      null_family_frontier_width - the number of distinct memory values the polynomial-memory null family
      produces across the hybridisation sweep. Required to be exactly 1. Any other value voids the run.
    secondary:
    - >-
      best time at each of the five memory caps, per family, per tuple, in bits.
    - >-
      the area-time scalar beside the pair, NEVER instead of it, with the ordering it induces at each cap.
    - >-
      at2_ordering_stability - whether the area-time ordering agrees with the memory-capped time ordering at
      each of the four lower caps.
    - >-
      the Stage-2 sensitivity matrix - which conclusions survive all combinations of exponent, memory-charge
      convention and cofactor, and which survive only at the attacker-favourable corner.
    - >-
      frontier_slope - bits of time bought per bit of memory saved, per tuple, over the swept range.
    - >-
      the positive control's measured gap against its derived forced value.
    - >-
      an explicit list of families NOT costed, each with its reason.
  cost_model:
    measured_vs_modeled: >-
      Every number in every column is MODELED; there is no measured quantity in this contract and the tables say
      so in their captions. Within the modeled category the columns are further separated and never mixed -
      DERIVED-EXACT (binomial coefficients, Hilbert-series degrees of regularity, the parameter floor: exact
      integer arithmetic), MODEL-EVALUATED (the time and memory formulas, which carry a named convention), and
      INHERITED (the intersection system's shape and the comparator's exponent and cofactor, which come from a
      sibling derivation and from recall respectively and are tagged with their provenance in every row).
    optimistic_assumptions:
    - >-
      Charging memory as columns times one field element rather than columns squared. Direction of bias -
      ATTACKER-FAVOURABLE, i.e. it understates the attacker's memory and therefore understates
      margin_compression. Chosen deliberately so that a 'memory does not change the ranking' conclusion cannot
      be an artifact of a pessimistic charge. The dense convention is reported beside it so the reader sees the
      whole interval.
    - >-
      The semi-regular degree of regularity. Direction of bias - if the true solving degree is LOWER, both the
      time and the memory fall, and the frontier moves; the direction on the RANKING is not determined and is
      declared undetermined.
    - >-
      Taking the comparator's polynomial cofactor at the largest of the three candidate powers. Direction of
      bias - raises the comparator's cost, i.e. favours the intersection attack and works AGAINST the
      predicted rank invariance. All three are reported.
    - >-
      Ignoring the field-multiplication to gate-count conversion when comparing against a gate-count security
      level. Direction of bias - understates the attack cost by the log of the field size. Declared and applied
      to the time column only, wherever a level comparison is made.
    memory_accounting: >-
      MEMORY IS THE POINT OF THIS CONTRACT AND IS A FIRST-CLASS METRIC. The dominant structure is sized
      ANALYTICALLY - the Macaulay matrix's column count as an exact binomial coefficient, times one field
      element, with the dense upper bound reported beside it. That analytic size is the memory axis of every
      frontier row and of every cap. The time-memory tradeoff IS the deliverable, read as a frontier rather
      than a point, and its slope in bits of time per bit of memory is reported per tuple. The RUN's own peak
      resident memory is kilobytes and is reported separately so it can never be confused with the modeled
      attack memory.
    hidden_overhead: >-
      Four named overheads, all swept rather than fixed silently - the linear-algebra exponent (which scales
      the time and leaves the memory untouched, so the CHOICE ITSELF changes the memory-charged ranking); the
      field-multiplication to gate-count conversion; the sparse-versus-dense charge, worth a factor of two in
      the log; and the comparator's polynomial cofactor. Parallelism is NOT modelled and is declared not
      modelled - the area-time charge is a circuit-model one and says nothing about a distributed attack with
      communication costs.
    standardized_parameter_sets: >-
      The four audited tuples are candidates for NIST security levels I, III and V, and every reported number
      names the level it is compared against. AFFECTED-VERSUS-SAFE SCOPE - no deployed parameter set is
      claimed affected or safe by this contract. Charging memory makes the audited scheme look STRONGER at
      every cap, and that is a statement about a cost convention, not a security margin. Any tuple failing the
      parameter floor is a TRANSCRIPTION ERROR to be corrected, not a break to be announced.
  heuristic_under_test: null
  heuristic_under_test_note: >-
    Explicitly null. HEUR-UOV-B1 (semi-regular solving degree, including in the hybridised case) is INHERITED
    and reported as a condition in every cell, together with the degree of regularity each cell relies on;
    this contract does not measure it and must not be cited as validating it. HEUR-UOV-B2 (the comparator's
    exponent and cofactor) is CONTAINED by the Stage-2 sweep over three cofactors. HEUR-UOV-B3 (the memory
    lower bound) needs no validation because it is a lower bound and is reported with its dense upper bound
    beside it.
  preregistered_prediction:
    quantity: >-
      Two quantities, fixed before any run exists. (1) rank_inversion_budget. (2) margin_compression at each
      of the four audited tuples.
    formula: >-
      rank_inversion_budget is the largest memory cap at which the time-optimal family differs from the
      time-optimal family at unbounded memory. PREDICTED - DOES_NOT_EXIST above a 2^30 cap; the prediction is
      the NEGATIVE one and an inversion falsifies it. margin_compression is defined in the metrics block.
      PREDICTED - at least 20 bits at at least two of the four tuples. Under the null that charging memory is a
      change of units, margin_compression is 0 at every tuple and rank_inversion_budget does not exist; that
      null is DISTINGUISHABLE from the prediction, because the prediction asserts a large compression WITHOUT
      an inversion, which is neither the null nor its obvious alternative.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-69af7c, predictions block (rank_inversion_budget,
      margin_compression, parameter_floor_violations, at2_ordering_stability), before any run under this
      contract exists. The parent's own numeric figures are SESSION-COMPUTED scratchpad arithmetic, not
      measurements, and Stage 1's whole purpose is to recompute them in committed code; where they disagree,
      the in-harness computation wins and the parent is superseded.
  scale_relevance:
    tier: standardized
    justification: >-
      The cost tables are evaluated DIRECTLY at candidate NIST-level parameter tuples - there is no scale gap
      in the evaluation, because the model is closed-form arithmetic that costs the same at any parameter
      size. The scale caveat lies elsewhere and is stated - the tuples themselves are recalled and unverified
      until Stage 3 reads a specification, and the degree-of-regularity heuristic they are evaluated under has
      been measured only at toy scale by a sibling record. The transfer assumption is therefore about the
      HEURISTIC, not about the arithmetic - that a semi-regular degree of regularity measured at toy scale
      also holds at the tabulated parameters, and additionally in the hybridised case which no measurement
      covers. That assumption is declared, is carried in every cell, and is why the whole record must be
      reissued rather than amended if the sibling measurement overturns it.
    correspondence: null
  tail_checks:
  - >-
    Report the best time at the SMALLEST cap in the ladder, where the hybridisation parameter is largest and
    the model is furthest from the regime it was fitted in. A conclusion resting only on the smallest-cap
    column is reported as extrapolated.
  - >-
    Report the gap between the two families at each cap together with the width of the cofactor-and-exponent
    uncertainty at that cap. A gap NARROWER than that width is reported as 'the two attacks are comparable',
    never as 'family X is best'.
  - >-
    Report whether the best time is monotone decreasing and log-log convex in the cap. Non-monotone means the
    hybridisation search is mis-implemented, which is an instrument failure and not a finding.
  - >-
    Report the parameter-floor value at all three comparator cofactors for every tuple, and flag any tuple
    whose verdict CHANGES across them. A tuple that passes at one cofactor and fails at another is reported as
    cofactor-dependent, not as passing.
  replication:
    seeds:
    - 20260825
    independent_instances: 3
    note: >-
      The computation is fully deterministic and carries no randomness; the three independent instances are
      three independent re-executions and must agree bit-for-bit. Any disagreement is an instrument defect,
      not a result.
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 2
    maximum_runs: 8
  stopping_rules:
  - >-
    HALT if the polynomial-memory null family produces more than one distinct memory value. The machinery
    manufactures frontiers and nothing else is emitted.
  - >-
    HALT if the positive control's gap is not reproduced within its derived value. No negative conclusion
    about memory charging may be drawn from any row.
  - >-
    HALT and report if the Stage-1 recomputation disagrees with any figure the parent proposal quotes; the
    in-harness value is authoritative and the parent is superseded, not edited.
  - >-
    If Stage 3's specification read shows memory already tabulated beside time, STOP and report that as the
    primary finding rather than proceeding to a headline about an uncharged quantity.
  - >-
    Stop at the frozen cap ladder, exponent values, charge conventions and cofactors. None is revised after a
    table is seen.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop, never a
    negative result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion, network failure or dependency failure makes the run
    failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md rule 5). A failed
    specification fetch in Stage 3 is specifically named here as such.
  - >-
    A run in which the null family or the positive control was not executed in the same invocation as the
    signal arm is invalid_measurement.
  - >-
    A run that reports the area-time scalar INSTEAD of the pair, rather than beside it, is
    invalid_measurement; the pair is the primary object by contract.
  - >-
    A run that compares a field-multiplication attack count directly against a gate-count security level
    without stating the conversion is invalid_measurement.
  - >-
    A run that reports a conclusion surviving only at the attacker-favourable corner without labelling it
    convention-dependent is invalid_measurement.
  - >-
    A run whose parameters differ from this frozen contract is a DIFFERENT experiment and needs a new
    contract; it is never a repair of this one.
  success_criterion: >-
    ALL SIX of the following, each decidable from the primary metrics. (1) null_family_frontier_width equals 1.
    (2) The positive control reproduces its derived forced gap. (3) The Stage-1 recomputation reproduces every
    figure the parent quotes, or the disagreement is reported explicitly. (4) frontier_table is emitted for
    every family, tuple and hybridisation value, with the degree of regularity printed per cell. (5)
    margin_compression and rank_inversion_budget are reported for every tuple, and the best time at all five
    caps. (6) parameter_floor_verdict is reported for every candidate tuple at all three cofactors, and the
    Stage-2 sensitivity matrix is emitted. NOTE that success means THE TABLE WAS BUILT AND ITS CONTROLS PASSED;
    whether the hypothesis is supported is decided by the pre-registered prediction and the falsification
    criteria, and a completed run showing margin_compression below threshold is a successful run.
  falsification_criterion:
  - >-
    margin_compression below 20 bits at ALL four tuples - S3 is FALSE. Charging memory changes nothing at
    UOV's scale, the record's practical content collapses to the parameter floor, and that must be reported
    plainly rather than dressed up.
  - >-
    rank_inversion_budget exists above 2^30 - the pre-registered NEGATIVE prediction is FALSIFIED. Which
    attack is 'best known' is a function of a memory budget nobody states, and every dependent goal's baseline
    is wrong as written.
  - >-
    null_family_frontier_width is greater than 1 - the machinery manufactures frontiers and every curve it
    produced is void.
  - >-
    The positive control's forced gap is not reproduced - the machinery is broken and nothing may be
    concluded.
  - >-
    The Stage-1 recomputation disagrees with any figure the parent quotes - the parent's numbers are wrong and
    are corrected by supersession before use.
  - >-
    Stage 3 finds the specification already tabulates memory beside time for every attack - S1's premise is
    FALSE for UOV, the frontier part is a reproduction, and that is the primary finding.
  - >-
    at2_ordering_stability fails at any cap - the area-time scalar is not a faithful summary at these
    parameters and the pair must be carried unreduced into every dependent goal.
  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and
    environment
  - >-
    raw-result.json carrying the full frontier table cell by cell, not summaries, with the degree of regularity
    per cell
  - >-
    the null-family arm and the positive-control arm, in the same file as the signal arm, written before the
    headline table
  - >-
    the Stage-2 sensitivity matrix over exponent, memory-charge convention and cofactor
  - >-
    the parameter-floor table with per-tuple verdicts at all three cofactors, and the provenance tag of every
    tuple (recalled or specification-read)
  - >-
    the explicit list of families NOT costed with a reason for each
  - >-
    the Stage-3 receipt - either the specification's own attack table with its memory columns quoted, or an
    explicit UNRUN receipt naming what could not be obtained
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution. This contract is NOT approved; approved_by is null,
    execution_authorized is false and frozen is false (AGENTS.md rule 1). Approval is the user's gate because
    it authorizes execution and spends compute.
  - >-
    The Coordinator should decide before approval whether Stage 3 (the specification read) is in scope for this
    run or is a separate task, because without it every tuple is recalled-unverified and the tables exercise
    the machinery rather than audit real parameters.
  - >-
    This contract is CONDITIONAL on the semi-regular degree-of-regularity heuristic that a sibling record
    measures. The Coordinator should record whether that measurement is scheduled, since an adverse result
    there requires this record to be REISSUED and not amended.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260805-69af7c
    authored_at: '2026-08-25'
    note: >-
      Design, controls, metrics and criteria are taken from the parent proposal's minimal_test, controls,
      required_metrics, predictions and falsification_conditions and restated as a contract. Boilerplate
      identical across contracts by program rule comes from a fixed table. Budgets come from the parent's
      declared estimated_cost (implementation low, roughly 150 lines; compute negligible, the full table runs
      in under a minute). NO NUMBER IS INVENTED - the parent's session-computed figures are deliberately NOT
      copied into this contract's parameter block, because they are scratchpad arithmetic that Stage 1 exists
      to recompute, and copying them would make an unverified number load-bearing.
  derivation_gaps:
  - >-
    The four candidate parameter tuples are not enumerated here, deliberately. They are recalled-unverified in
    the parent and the parent itself demonstrates that recall has already failed once. They must be frozen in
    Stage 0 with their provenance tagged, and replaced in Stage 3.
  - >-
    The intersection system's equation and variable counts as functions of the UOV parameters are inherited
    from a sibling derivation and are not restated here. A Coordinator should pin that sibling record's
    identifier in an amendment before approval, since every table depends on the shape it supplies.
  - >-
    The 20-bit threshold in margin_compression is the parent's pre-registered figure and is a judgement about
    what counts as material, not a derived quantity. It must not be moved after a run; if it is wrong, it is
    wrong in a versioned amendment before execution.
  - >-
    The signature-based and forgery routes, the rectangular MinRank route and every quantum variant are NOT
    costed. They are enumerated as uncosted with reasons, and the frontier's dominated_by claim is therefore
    scoped to the families actually checked.
  - >-
    The parent's own honest prior identifies the single most likely way this contract is moot - that the
    specification already tabulates memory. Stage 3 tests it, but a Coordinator may prefer to run Stage 3
    FIRST as a cheap gate, which would be a different sequencing and therefore a different contract.
