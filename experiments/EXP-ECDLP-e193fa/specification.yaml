experiment:
  id: EXP-ECDLP-e193fa
  hypothesis_id: H-ECDLP-ad8992
  proposal_id: IDEA-20260909-4c5ee9
  question_id: RQ-ECDLP-002
  goal_ids:
  - GOAL-ECDLP-001
  - GOAL-ICEX-001
  version: 1
  title: 'Prym E: blind complete-recovery comparison across subgroup sizes'
  designed_at: '2026-10-19'
  status: review_required
  objective: Test an exact qualifying pipeline against the current matched verified IC baseline on fresh blind prime-subgroup
    instances, charging complete recovery, and report the remaining matched-rho gap.
  inputs:
    design_brief: research/prym_experiment_design_20261019/brief.md
    prior_intake: research/prym_relation_followup_20261019/README.md
    problem: problems/prym-assisted-source-labelled-router.md
    proposal: ledger/proposals/IDEA-20260909-4c5ee9.yaml
    archive_task_id: TASK-20261019-84755b
    depends_on:
    - EXP-ECDLP-ad0ffe verified source/rank/no-leakage prerequisite
    - EXP-ECDLP-5e7e74 verified charged selector-stage benefit or accurately attributed generic engineering improvement
    subgroup_bits:
    - 11
    - 13
    - 15
    - 17
    panel: Ten independent fresh public instances per subgroup-bit size; three paired seeds [0,1,2] per instance.
      Total 40 curves and 120 seed-paired workloads per arm; seeds are not independent instances.
    fixture_freeze: Before approval specify a deterministic domain-separated seed-to-prime/curve/cover search algorithm
      (including primality/order certificates, curve family, field bound, rejection order, first-hit convention
      and generator rule). Materialize all 40 p,E,r,cofactor,P,cover/base/map UIDs and certificates as immutable
      public constants. The bit size is bit_length(r), not p. All failed searches count toward cold-start setup.
      These search rules/constants are NOT supplied yet and are explicit admission blockers.
    eligibility: Publicly constructed ordinary prime-field curves with a certified prime subgroup of the target
      bit length, admitted map/constructor and genuine nonzero target. Any special bielliptic/cover-family selection
      is recorded as the exact tested population, never generic secp256k1/P-256 applicability. Reject singular/supersingular
      cases by the frozen rule; charge attempts.
    challenge: Separate challenge process draws k uniformly from 1..r-1 via frozen CSPRNG/domain-separated secret
      seed, emits only Q=[k]P and public challenge ID. Commit a hiding salted commitment and sealed verifier file
      before attack launch; no brute-forceable unsalted hash of tiny k. Attack process cannot read seed/k/commitment
      salt/truth-log files. Publish k only after sealed recovery output.
    paired_targets: All arms receive identical public instance/P/Q and paired seed; run order randomized by a public
      domain-separated order seed independent of k. No target replacement after observed difficulty.
    baseline: Current best independently verified IC pipeline for each admitted curve and size, frozen implementation/protocol/end-to-end
      S and evidence hashes. This may differ by size, but is fixed before outcomes. A historical PO003 recovery
      table is not baseline evidence.
    other_comparators: Memory-matched usable-action Pollard rho with full setup/recovery/verification; when reporting
      setup-excluded numbers also bind Bernstein-Lange comparator under its correct workload. These are gap reports,
      not incremental success gates.
    amortization: Primary cold-start one target. Secondary genuinely reused-setup mean over the actual three targets
      only if those repetitions are separate targets and reuse is certified; otherwise seeds repeat one target and
      cannot count as multiple amortized targets. The default three seeds here repeat the same Q, so do not claim
      3-target amortization.
  controls:
  - 'C-E-aa: duplicate the current IC baseline arm with the same Q/seed and frozen setup, varying only run order;
    identical algebraic/operation outputs expected where deterministic. Stochastic variation belongs to the paired
    seed, not hidden restart selection.'
  - 'C-E-total: exact baseline versus candidate complete pipeline on the same fresh instance/Q/seeds; code differences
    limited to the frozen constructor/selector treatment.'
  - 'C-E-coordinate: transport P,Q, all base atoms and cover maps under a fixed coordinate isomorphism; independently
    recover the same k.'
  - 'C-E-random: matched-dimension split-product/permuted-companion candidate control with no informative source
    relation; no auxiliary cancellation interpreted as recovery.'
  - 'C-E-invalid: known-false target labels, malformed witnesses and noninvertible recovery multiplier must be rejected
    by an isolated checker.'
  - 'C-E-source: independent final source verification for every claimed solution; challenge-secret isolation and
    source/rank prerequisites audited before interpretation.'
  independent_variables:
  - 'pipeline: current matched IC/candidate/identity A-A/transported/null'
  - prime subgroup bit size 11,13,15,17
  metrics:
    primary:
    - complete cold-start S per verified recovered target in C-E-total, matched current-baseline weights and full
      phases
    - per-instance log2(S_base_mean_over_3_seeds / S_candidate_mean_over_3_seeds), with all solves and zeros/failures
      retained
    - independent source-verification success fraction and no-leakage/control release
    secondary:
    - phase costs and raw operation vectors; number/validity/useful rank of all relations
    - peak RSS bytes, peak live words, stored advice bytes, wall/CPU seconds, failed searches/attempts
    - ratio to full matched rho work and residual log2 cost gap; setup-excluded Bernstein-Lange gap only under correct
      declared workload
    - descriptive finite-size ratios and complete cost distribution, not an asymptotic exponent fit
    - genuinely amortized costs only with separately frozen actual multi-target workload and reuse certificate
  replication:
    seeds:
    - 0
    - 1
    - 2
    independent_instances: 40
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: null
    maximum_workers: 1
  stopping_rules:
  - Complete all fixed 40 instances x three paired seeds x frozen arms; no early stop on favorable sizes or enlarge
    sample after seeing intervals.
  - Run order is fixed independently of secrets. Each scientific solve ends at verified recovery or an exact algorithmic
    failure declared in the frozen implementation. A resource guard is censored infrastructure, never successful
    completion.
  - No expand-size, baseline switch, solver tuning or factor-base re-selection after target release.
  - A failed/non-estimable A/A, null, source/rank or leakage gate withholds dependent inferential labels; keep descriptive
    records and refreeze any independent replication prospectively.
  invalidation_rules:
  - Any access by the attack to k, challenge seed/salt, verifier truth logs or unsalted brute-forceable commitment.
  - Size indexed by p rather than r, uncertified subgroup, nonordinary fixture treated as ordinary, or uncharged
    search rejection/cover construction.
  - Current verified baseline not bound before targets, different base/workload/memory/weights, favorable-target
    exclusion, or phase omission.
  - Claimed end-to-end success is only planted/calibration recovery, partial rank, stage timing, or final verification
    without proof of complete charged execution.
  - Confidence intervals treat within-instance seeds as independent or silently use a population unsupported by
    the frozen generator.
  success_criterion: 'P-E-total/C-E-total and P-E-recovery/C-E-source: every claimed answer independently verifies,
    all source/rank/leakage/null and C-E-aa gates release, and at least one predeclared size meets the simultaneous
    conservative median interval, A/A floor and lower fixed-panel total S rule. Independent review and a matching
    progress-fidelity/measured-bound record are required before calling this a verified improvement. Beating rho
    is not required.'
  falsification_criterion: 'P-E-total/C-E-total: no predeclared size meets the complete-S improvement rule on a
    valid fully completed panel; this bounds only this pipeline and tested population. P-E-recovery/C-E-source:
    any reproducible incorrect answer challenges that implementation. Failed controls, censored solves or missing
    admission are indeterminate/infrastructure, not mathematical evidence of impossibility or security.'
  required_artifacts:
  - 'manifest.json: exact command, clean committed revision, protocol/input/dependency hashes, hardware, field encoding,
    curve UID, subgroup and factor-base UIDs, policy/model provenance, timestamps and process-group resources'
  - stdout.txt and stderr.txt; immutable raw-result.json and per-attempt event stream, including rejects/duplicates/errors
  - verification.json from an independently implemented checker, with every failed check retained
  - report.md, graph.svg plus source, and inspected report.pdf; source-linked limits and no promoted claim without
    review
  assigned_to: executor-implementation
  approved_by: null
  approval_blockers:
  - No exact deterministic instance-search rule/seed domain, field bounds, prime/order/ordinary certificates or
    40 immutable fixture constants are supplied.
  - No current matched independently verified IC baseline, complete S weights or fully instrumented candidate pipeline
    is bound.
  - W source/rank/leakage and S selector gates are unexecuted/unreviewed; the supplied selector component is not
    an independently verified full-rank integrated pipeline.
  - No sealed challenge generator with demonstrated attack/verifier isolation, independent full checker, rho/BL
    protocol binding, or complete execution-proof integration is bound.
  - No native trial plan, source/input hashes, runbook/task-card, executor handoff, lawful science lane/archive
    or approvable=true admission is bound.
  execution_authority: None. Exact prospective bytes must pass native experiment_preapproval approvable=true; committed
    approval/archive and newest_experiments execution_state=ready precede the run skill. No retrospective approval.
  cost_accounting:
    complete_work: Retain a vector of raw field operations by field, elliptic/Jacobian additions and multiplications,
      polynomial arithmetic/factorization, comparisons/hash operations, matrix operations and bytes moved. Do not
      add unlike units without a frozen weight model. S is the current matched baseline protocol's complete weighted
      operation count, with its weights bound before approval. Wall time and CPU are secondary diagnostics.
    charge:
    - public instance/cover search including rejected candidates
    - map construction, normalization, factor-base generation, advice/training and tuning
    - all candidate generation, failed lifts, branch enumeration and rejected tuples
    - companion labels, selector evaluation, row normalization, witness/source checks and independent-rank maintenance
    - linear algebra, target descent, recovery, and final source verification
    accounting_scope: Both cold-start and genuinely amortized totals; no free offline table, oracle, secret witness
      or uncharged rejected stream. Reference/checker work is reported separately and cannot be supplied to the
      attack.
    memory: Record peak process-group RSS bytes plus peak live algebraic words/table entries and serialized advice
      bytes. A 2 GiB guard protects headroom; any guard stop is censored infrastructure, not a complete successful
      solve.
  interpretation_limits:
  - 'Design only: no scientific run, measured gain, new asymptotic exponent, novelty certificate or security conclusion.'
  - The unsourced historical 32-cover quotation is not an input catalog; no identification or completeness claim
    is made.
  - P1546 remains a scoped fixed-branch counting gate; this design does not execute or reopen the IDEA-002 frozen
    contract.
  - A cover, Frobenius overlap, auxiliary cancellation or faster known-scalar multiplication alone does not solve
    ECDLP.
  - Missing code, access, admission or verification is an implementation/infrastructure impediment, not mathematical
    falsification.
  decision_impact:
    on_positive: Commission independent raw-output/cost re-derivation and source verification; add a progress-fidelity
      claim and measured bound with exact scope. A verified landed improvement becomes the new current baseline.
      Expand only through a separately frozen instance panel; no deployed-curve claim.
    on_negative: Keep all valid complete recovery and cost data, identify the dominant charged phase/rank/selector
      overhead, and devise a distinct measured engineering change instead of retesting unchanged geometry.
    on_inconclusive: Resolve exact controls/admission/baseline/challenge implementation issue with an additive correction
      and prospectively frozen independent replication; retain all partial/censored records.
  preregistered_predictions:
  - id: P-E-total
    quantity: Blind verified complete IC cost over fresh subgroup-size strata
    prediction: A qualifying pipeline yields lower fully charged S than the current matched baseline in at least
      one size under the simultaneous interval/control rule. No effect magnitude, sub-rho result or exponent is
      predicted.
  - id: P-E-recovery
    quantity: Public-input recovery and source verification
    prediction: Every claimed k_hat verifies on the original source and no source/target secret is supplied to the
      attack.
  scale_relevance:
    tier: toy
    justification: Finite implementation/algorithm experiments; no transfer to secp256k1 or P-256.
    correspondence: null
  attack_api:
    input: Only public instance manifest, P,r,Q, exact frozen factor base/map description, paired seed and implementation
      bytes.
    phases:
    - public construction/search, maps and base setup
    - source-labelled relation collection and useful-rank checks
    - linear algebra solving unknown base logs
    - blind target descent using frozen selection/branch rules
    - scalar recovery using certified invertible subgroup multiplier
    - independent source check [k_hat]P=Q
    output: Sealed k_hat or explicit censored/failure record, every intermediate witness/relation/phase count and
      complete resources. No challenge truth enters logs until seal.
    failure_handling: Retain every zero-row/rank-deficient/descent-failed workload. A solver cannot discard a failed
      target and report only successful costs.
  statistics:
    independent_unit: Curve/instance within each bit size, n=10. Average costs across its three paired seeds first.
      No pseudoreplication of the resulting 120 seed workloads. Different sizes are separate strata.
    primary_parameter: Median across the stated instance-generation population of the paired instance log2 complete-cost
      ratio. Also report every instance and the fixed-panel total; no average-cost claim is inferred from a median.
    interval: For each size sort the ten instance log2 ratios; report [minimum,maximum] as a conservative distribution-free
      median confidence interval. Under independent instances from the frozen population its coverage is at least
      1-2/2^10=99.8046875% (ties conservative). Bonferroni across the four sizes gives simultaneous coverage at
      least 99.21875%, exceeding 95%. Do not present narrower unregistered seed-level intervals.
    aa_floor: For each instance compute absolute log2 baseline-A/A2 cost ratio after averaging paired seeds. The
      per-size floor is their maximum. Exact deterministic count disagreements trigger instrumentation invalidity
      rather than a wider tolerated margin. Wall-time spread is diagnostic, never an S threshold.
    multiple_size_rule: After all gates, a size supports a scoped median complete-cost improvement only if its simultaneous
      lower interval endpoint is strictly above its predeclared A/A floor, every target verifies, and fixed-panel
      total S_candidate < S_base. At least one qualifying size is a scoped incremental success; report all four
      sizes including nonqualifying results, no selective pooled claim. A four-size general improvement requires
      all four qualify.
    failure_rule: If any paired solve fails/censors, no finite mean-complete-S win is assigned at that size. Report
      success rates and censored phase costs explicitly; a future cost/success analysis needs its own frozen definition.
    power: 'No guaranteed power: no expected effect/variance model is supplied. This conservative n=10 design is
      a bounded falsifiable first panel; no post-hoc sample extension or threshold relaxation.'
    rho_rule: Rho is the long-term distance comparator. Candidate need not beat rho to constitute verified improvement
      over the current matched IC baseline.
  prediction_provenance:
  - prediction: P-E-total
    first_recorded_in: experiments/EXP-ECDLP-e193fa/specification.yaml
    written_at: '2026-10-19'
    data_seen:
    - path: inputs/refs/experiments/ecdlp_isogeny/po_transfer_003_result.md
      measured: Imported historical toy relation/rank/recovery/cost observations; read by parent intake, not replayed
        here.
    - path: research/prym_relation_followup_20261019/README.md
      measured: Earlier chat F43 point-count/Frobenius diagnostic was seen; it is not native run evidence.
    sample_status: out_of_sample
    overlap: No measurements on the future frozen holdout challenge set have been seen.
  - prediction: P-E-recovery
    first_recorded_in: experiments/EXP-ECDLP-e193fa/specification.yaml
    written_at: '2026-10-19'
    data_seen:
    - path: inputs/refs/experiments/ecdlp_isogeny/po_transfer_003_result.md
      measured: Imported historical toy relation/rank/recovery/cost observations; read by parent intake, not replayed
        here.
    - path: research/prym_relation_followup_20261019/README.md
      measured: Earlier chat F43 point-count/Frobenius diagnostic was seen; it is not native run evidence.
    sample_status: out_of_sample
    overlap: No measurements on the future frozen holdout challenge set have been seen.
  variable_ledger:
    independent:
    - name: pipeline
      levels:
      - current IC
      - candidate
      - null candidate
    - name: subgroup_bits
      levels:
      - 11
      - 13
      - 15
      - 17
    factors:
    - name: instance_generator
      treatment: randomized
      value: pending frozen exact search rule/constants
      how: Ten domain-separated instance seeds per size; same instances in every arm.
    - name: target
      treatment: randomized
      value: uniform nonzero k, held only by challenge process
      how: Same public Q in paired arms; no replacement.
    - name: paired_seed
      treatment: randomized
      value:
      - 0
      - 1
      - 2
      how: Within-instance repetitions averaged first.
    - name: run_order
      treatment: randomized
      value: public independent order seed
      how: Nuisance only in baseline A/A.
    - name: source_encoding
      treatment: fixed
      value: original or fixed isomorphic transport
      how: Transport exact P,Q and base instead of reselecting.
    - name: factor_base_and_maps
      treatment: fixed
      value: committed per-instance identities
      how: Same admissible base unless algorithmic treatment explicitly includes construction and full cost; then
        classify corresponding comparison as bundled pipeline, not a map-only causal effect.
    - name: baseline_revision_cost_scope
      treatment: fixed
      value: pending current verified baseline per size
      how: Bind exact revisions, evidence, weights and all phase accounting before targets.
    - name: resources
      treatment: fixed
      value: one worker, 2 GiB
      how: Identical guards/charged process groups.
    - name: secret_access
      treatment: fixed
      value: challenge/verifier only
      how: Audit files, descriptors, logs and IPC.
    - name: hardware_load
      treatment: measured
      value: manifest
      how: Secondary timing only.
    comparisons:
    - id: C-E-total
      arms:
      - current IC
      - candidate
      differs_in:
      - pipeline
      design: one_factor
    - id: C-E-aa
      arms:
      - baseline-A
      - baseline-A2
      differs_in:
      - run_order
      design: aa
    - id: C-E-coordinate
      arms:
      - source
      - transported coordinates
      differs_in:
      - source_encoding
      design: one_factor
    - id: C-E-random
      arms:
      - candidate
      - null candidate
      differs_in:
      - pipeline
      design: one_factor
    - id: C-E-source
      arms:
      - independent source verification
      differs_in: []
      design: absolute
    crosses_map: true
  transfer_obligations:
  - map: Public source ECDLP -> native relation system -> recovered source scalar
    kind: descent
    source: (E/Fp,P,Q=[k]P,G of prime order r)
    destination: Native Jacobian/companion relations then k_hat on E
    preserves:
    - source scalar modulo r when certified multiplier is invertible
    - working field and original target verification
    changes:
    - representation, relation collection and unknown-log basis
    - all preparation/descent/recovery costs
    controls:
    - kind: identity_map
      comparison: C-E-aa
    - kind: matched_random
      comparison: C-E-random
    assessment: research/prym_experiment_design_20261019/protocol_summary.json
    assessment_key: transfer_assessments.E
  goal_id: GOAL-ECDLP-001
