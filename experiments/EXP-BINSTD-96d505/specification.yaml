# EXP-BINSTD-96d505
# Orbit-band arithmetic. No search.
# Approved by DEC-20261003-7bd84f.
experiment:
  id: EXP-BINSTD-96d505
  hypothesis_id: H-BINSTD-56a510
  source_idea: IDEA-20261001-cb6a72
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Orbit band versus half of n
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-7bd84f
  objective: >-
    Check the excess 34, the excess 46, and the product 1564.
  inputs:
    n_17: 17
    n_23: 23
    lo_coeff: 7
    hi_coeff: 14
    coeff_gap: 7
    lo_17: 119
    hi_17: 238
    half_17: 85
    excess_17: 34
    lo_23: 161
    hi_23: 322
    half_23: 115
    excess_23: 46
    excess_product: 1564
    n_gap: 6
    relation_floor: 5
    gap_product: 210
    run_budget: 20
    budget_quot: 4
    n_sum: 40
    n_product: 391
    cells: 2
  controls:
    - >-
      Fourteen is twice 7, and 14 minus 7 is 7. Seven times 17 is
      119, and 14 times 17 is 238. Reporting 119 as 85 invalidates
      the run.
    - >-
      Five times 17 is 85, and 119 minus 85 is 34. Seven times 23 is
      161, and 14 times 23 is 322. Five times 23 is 115, and 161
      minus 115 is 46. The product of 34 and 46 is 1564.
    - >-
      Twenty-three minus 17 is 6. Seven times 6 times 5 is 210.
      Twenty divided by 5 is 4. Seventeen plus 23 is 40. Seventeen
      times 23 is 391.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {band, excess, product}
    - route in {difference, product}
  metrics:
    primary:
      - excess_17
      - excess_product
      - implementations_agree
    secondary:
      - excess_23
      - gap_product
      - n_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      One hundred nineteen exceeds 85 by 34. One hundred sixty-one
      exceeds 115 by 46. The product of 34 and 46 is 1564.
    formula: >-
      Subtract 85 from 119. Subtract 115 from 161. Multiply 34 and
      46. Compare 14 times 17 with twice 119.
    source: >-
      IDEA-20261001-cb6a72 states the n list 17 and 23, the band from
      0.7 n to 1.4 n, the mark n over 2, the relation floor 5, and
      the run budget 20, read 2026-10-03. The products were
      recomputed in this design session. That computation is not a
      run. No search was run.
  scale_relevance:
    tier: toy
    justification: Two listed n values and one written band. No transfer to a yield.
    correspondence: null
  tail_checks:
    - The product 1564 and the excess 46 are required. A check that stops at the excess 34 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the excess 34 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The excess at 17 is not 34.
    - The excess at 23 is not 46.
    - The product is not 1564.
    - A search is run, or 119 is reported as 85.
  success_criterion: >-
    Both runs agree that 14 is twice 7, that 119 minus 85 is 34,
    that 238 is twice 119, that 161 minus 115 is 46, and that the
    product of 34 and 46 is 1564.
  falsification_criterion: >-
    The runs agree that 119 minus 85 is computed, and that difference
    is not 34.
  required_artifacts:
    - experiments/EXP-BINSTD-96d505/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-96d505/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-96d505/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-96d505/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-96d505/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-96d505/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any search, orbit expansion, or yield count.
    - Any claim that conjugates multiply a relation yield.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
