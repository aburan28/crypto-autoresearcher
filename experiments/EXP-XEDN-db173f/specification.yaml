# =============================================================================
# EXP-XEDN-db173f — version 1, approved by DEC-20261006-c4570b.
# Frozen measurement: absolute gap of nonzero-section fractions at p=5
# between exact degree 4 and exact degree 6 of b(t), a(t)=0.
# The prediction is an absolute gap of at least 0.05.
# A finished absolute gap strictly less than 0.05 is a negative.
# This design session did not enumerate the census.
# No xedni lift and no ECDLP algorithm are authorized.
# Source idea IDEA-20261005-e6a067 is already on origin/main and is
# not rewritten.
# =============================================================================
experiment:
  id: EXP-XEDN-db173f
  hypothesis_id: H-XEDN-876f24
  question_id: RQ-XEDN-001
  source_idea: IDEA-20261005-e6a067
  goal_id: GOAL-ICLIFT-001
  version: 1
  title: >-
    Degree-4 versus degree-6 section-fraction gap at p=5 for a(t)=0
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-c4570b
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that the absolute gap is at least 0.05
      and does not assert a xedni lift.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Enumerate both exact degrees at p=5 under the pinned predicate,
      score the plants and the degree-6 replay, and record the absolute
      gap. A prefixed sign check at p=7 is recorded and does not change
      the p=5 assignment. Do not lift any slot to characteristic zero.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether the fraction of exact-degree-4 slots of
    y^2 = x^3 + b(t) over F_5 that contain at least one detected
    section differs from the same fraction for exact degree 6 by at
    least 0.05 in absolute value. A finished absolute gap strictly
    less than 0.05 is a negative. The degree-6 census compared with a
    replay of itself is the control on which a gap of 0.05 is predicted
    false. No lift to characteristic zero is in scope.

  inputs:
    prime: 5
    a_of_t: 0
    equation: y^2 = x^3 + b(t)
    predicate: >-
      is_square_poly in experiments/EXP-XEDN-001/xedni_sections.py,
      imported and not edited. The same function object is used for
      both degrees, for the replay, for the plants, and for the p=7
      sign check. A second predicate on only one degree voids the gap.
    predicate_rule: >-
      The function returns None on the zero polynomial. A returned
      value other than None is an acceptance. Do not special-case
      degree 4 or degree 6 inside the predicate.
    section: >-
      A monic quadratic x(t) = t^2 + x1*t + x0. There are 25 such
      polynomials at p=5 and 49 at p=7. A slot is positive when at
      least one of them makes the predicate accept x(t)^3 + b(t).
    coefficient_order: >-
      A vector [b0, b1, ..., bd] stores the coefficient of t^i at
      index i. Exact degree d means bd is nonzero and the list has
      length d+1.
    enumeration: >-
      Lexicographic order with b0 varying fastest and the leading
      coefficient ranging through 1, 2, ..., p-1. The p=5 census is
      the entire order. The p=7 sign check is the first 2000 vectors
      of each exact degree in that same order. The subset is not
      chosen after seeing the p=5 gap, and no random seed is used.
    slot_counts_before_predicate:
      degree_4: 2500
      degree_6: 62500
      note: >-
        5^5 - 5^4 = 2500 and 5^7 - 5^6 = 62500. These integers are
        the census sizes, not the section fractions. Record them
        before the predicate runs.
    predicted_absolute_gap: 0.05
    integer_form: >-
      Let n4 and n6 be the positive-slot counts. The absolute gap is
      at least 0.05 exactly when the absolute value of 25*n4 - n6 is
      at least 3125. It is strictly less than 0.05 exactly when that
      absolute value is at most 3124. Compare the integers. Do not
      compare binary floats.
    plants:
      accept_degree_6:
        b: [1, 0, 0, 4, 0, 0, 3]
        x: [0, 0, 1]
        y: [1, 0, 0, 2]
        required: the predicate accepts x^3 + b
      accept_degree_4:
        b: [0, 0, 2, 2, 2]
        x: [1, 0, 1]
        y: [1, 0, 0, 1]
        required: the predicate accepts x^3 + b
      reject_degree_6:
        b: [0, 0, 0, 0, 0, 0, 1]
        required: zero of the 25 monic quadratics are accepted
      y0_only:
        b: [0, 0, 0, 0, 0, 0, 4]
        required: >-
          zero of the 25 monic quadratics are accepted. The candidate
          x = t^2 produces the zero polynomial, which must be rejected.
      zero_polynomial:
        f: [0]
        required: the predicate returns None
    sign_check:
      prime: 7
      slots_per_degree: 2000
      role: >-
        If both absolute gaps are at least 0.05 and the signs differ,
        record direction_unstable true. The p=5 assignment does not
        change.
    forbidden:
      - Do not lift any slot to characteristic zero.
      - Do not claim an ECDLP algorithm or a change in the exponent 1/2.
      - Do not claim that H-XEDN-001 is supported or closed.
      - Do not drop or add the y=0 section on only one degree.
      - Do not adjust the threshold 0.05 after seeing a fraction.
      - Do not treat a failed plant as a mathematical negative.

  controls:
    - id: same-predicate
      statement: >-
        Both degrees, the replay, the plants, and the p=7 subset call
        the imported is_square_poly. A second predicate on only one
        degree voids the gap.
      pass_condition: one function object is used for every acceptance test
      on_fail: >-
        Splitting the predicate by degree invalidates the run. It is
        not a gap.
    - id: plants
      statement: >-
        The degree-6 accept slot and the degree-4 accept slot are
        accepted on their named quadratics. The polynomial t^6 and the
        polynomial 4 t^6 each have zero accepted monic quadratics. The
        zero polynomial returns None.
      pass_condition: all five plant requirements hold
      on_fail: >-
        A failed plant voids the run. It is not a mathematical negative
        and it is not a gap of 0.
    - id: slot-counts
      statement: >-
        Before the predicate runs, the exact-degree-4 list has length
        2500 and the exact-degree-6 list has length 62500.
      pass_condition: both lengths match
      on_fail: >-
        A wrong census size invalidates the run. Do not divide by the
        wrong size and call the result a fraction.
    - id: self-replay
      statement: >-
        A second pass over every exact-degree-6 slot, same predicate
        and same enumeration, returns the same positive-slot count.
        The absolute gap of a family with itself is 0, so the
        conclusion "gap at least 0.05" is predicted false on this pair.
      pass_condition: the two degree-6 positive-slot counts are equal
      on_fail: >-
        Disagreement means the counter is not a function of the slots.
        The run is invalid.
    - id: no-lift
      statement: >-
        The implementation uses only arithmetic in the prime field and
        the imported predicate. It constructs no curve over Q and
        performs no rank computation.
      pass_condition: lifts_to_Q is 0
      on_fail: >-
        Any lift to characteristic zero invalidates the run. A lift is
        not a section fraction.
    - id: y0-exclusion
      statement: >-
        The zero polynomial is not counted as a section on either
        degree. The y0 plant is the slot on which that exclusion is
        required.
      pass_condition: the zero polynomial returns None and the y0 plant has zero accepted sections
      on_fail: >-
        Counting y=0 on either degree invalidates the run.

  independent_variables:
    - whether the slot has exact degree 4 or exact degree 6
    - which coefficient vector is enumerated
    - which of the 25 monic quadratics is tested
    - whether the pass is the census or the degree-6 replay
    - whether the prime is 5 or the p=7 sign-check subset

  metrics:
    primary:
      - id: absolute_gap
        statement: >-
          The absolute difference of the two exact fractions at p=5.
          The predicted value is at least 0.05. Record it as a ratio
          of integers, and record the integer absolute value of
          25*n4 - n6 beside it.
      - id: gap_integer
        statement: >-
          The absolute value of 25*n4 - n6. At least 3125 is the
          prediction. At most 3124 is the negative.
    secondary:
      - id: fraction_degree_4
        statement: n4/2500, with n4 the positive-slot count.
      - id: fraction_degree_6
        statement: n6/62500, with n6 the positive-slot count.
      - id: slot_count_degree_4
        statement: Length of the degree-4 list before the predicate. Required value 2500.
      - id: slot_count_degree_6
        statement: Length of the degree-6 list before the predicate. Required value 62500.
      - id: replay_degree_6
        statement: Positive-slot count of the second degree-6 pass. Required to equal n6.
      - id: plants_pass
        statement: 1 if every plant requirement holds, else 0.
      - id: lifts_to_Q
        statement: Count of lifts to characteristic zero. Required value 0.
      - id: sign_check_gap
        statement: >-
          Absolute gap on the first 2000 slots of each degree at p=7,
          and the sign of (fraction_4 - fraction_6) at p=7 and at p=5.
          direction_unstable is true only when both absolute gaps are
          at least 0.05 and the signs differ.
      - id: attack_claimed
        statement: Boolean. The design-session value is false. The run value must stay false.

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 is the equal-probability Bernoulli null. The branch
    prediction is the exhaustive gap. A gap of at least 0.05 with both
    fractions inside [0.05, 0.95] rejects equal probabilities in that
    range. A gap strictly less than 0.05 is the branch negative. Neither
    number is a lift probability over Q. The p=7 subset checks the sign
    only.

  preregistered_prediction:
    quantity: >-
      The absolute difference between the exact-degree-4 and
      exact-degree-6 nonzero-section fractions at p=5.
    formula: >-
      absolute_gap >= 0.05, equivalently the absolute value of
      25*n4 - n6 is at least 3125. A finished value at most 3124 is a
      negative. The sign is not predicted. The self-replay gap is 0.
      No attack term enters the formula.
    source: >-
      IDEA-20261005-e6a067, copied before any run of EXP-XEDN-db173f.
      The design session on 2026-10-06 did not enumerate the 2500 or
      62500 slots. KR-IC-cd159a was opened and does not state this gap.

  scale_relevance:
    tier: toy
    justification: >-
      The tested object is two exhaustive slot censuses at p=5. A
      result here is not a rate at p=101 or p=809 and not a transfer
      to characteristic zero. No extrapolation is authorized. The p=7
      subset is a sign check of 2000 slots per degree, not a second
      claim.
    correspondence: >-
      Direct enumeration of coefficient vectors. No sampling
      equivalence is used for the p=5 fractions. The p=7 subset is a
      prefix of a fixed order, not a correspondence for p=5.

  tail_checks:
    - >-
      There is no sampled tail on the p=5 census. The extreme check is
      the integer gap_integer. A value of at most 3124, with the plants
      passing, is a negative. The self-replay is the same-shape object
      on which a gap of 0.05 is predicted false. For the sign check, if
      both absolute gaps are at least 0.05 and the signs differ, the
      direction is unstable and the p=5 result stays scoped to p=5.

  replication:
    seeds:
      - name: census
        algorithm: lexicographic enumeration of exact-degree coefficient vectors
        seed: 5
        note: >-
          No random generator is consulted. seed 5 records the prime.
          Substituting a random slot is forbidden.
      - name: sign_check
        algorithm: first 2000 vectors in the same lexicographic order at p=7
        seed: 7
        note: >-
          seed 7 records the sign-check prime. It is not used to choose
          which 2000 slots, and it is not chosen after seeing p=5.
    independent_instances: 65000
    independent_instances_note: >-
      2500 + 62500 slots are the exhaustive classes at p=5. They are
      not draws. The degree-6 replay repeats those 62500 slots. The
      4000 p=7 slots are a separate sign check and are not additional
      p=5 instances.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      Time and CPU figures are advisory machine-protection watches
      (docs/research-budget-policy.md). maximum_runs is 1. The
      scientific work is one pass over 2500 slots, two passes over
      62500 slots, 25 predicate calls per slot, the five plants, and
      2000 slots of each degree at p=7 with 49 quadratics each. Watch
      expiry is failed_infrastructure, never a negative mathematical
      result.

  procedure:
    counts: >-
      Build both exact-degree lists and record their lengths before
      calling the predicate. Stop as invalid if the lengths are not
      2500 and 62500.
    plants: >-
      Score the five plant requirements. On any failure, stop as
      invalid.
    census: >-
      For each degree-4 slot and each degree-6 slot, test all 25 monic
      quadratics. Record n4, n6, both fractions, absolute_gap, and
      gap_integer.
    replay: >-
      Repeat the degree-6 pass. Record the second count. On
      disagreement, stop as invalid.
    sign_check: >-
      At p=7, score the first 2000 exact-degree-4 vectors and the first
      2000 exact-degree-6 vectors. Record the subset gap and whether
      the direction is unstable. Do not change the p=5 assignment from
      this subset.
    forbidden: >-
      Do not lift a slot to Q. Do not change the threshold. Do not
      claim a discrete logarithm. Do not edit the predicate module.
    mechanism_assignment:
      - observation: >-
          plants_pass is 1, slot counts are 2500 and 62500,
          lifts_to_Q is 0, replay_degree_6 equals n6, gap_integer is
          at least 3125, and attack_claimed is false.
        assigns_to: >-
          The branch claim holds at p=5. This is not a xedni lift, not
          an ECDLP algorithm, and not a result at p=101 or p=809.
      - observation: >-
          plants_pass is 1, slot counts are 2500 and 62500,
          lifts_to_Q is 0, replay_degree_6 equals n6, and gap_integer
          is at most 3124.
        assigns_to: >-
          The prediction fails. This is a negative. The predicate does
          not separate the two degrees at p=5 at resolution 0.05.
          Quote both fractions and gap_integer.
      - observation: >-
          A plant fails, a slot count is wrong, lifts_to_Q is not 0,
          the replay disagrees, or attack_claimed is true.
        assigns_to: >-
          Invalid. Not evidence for the branch claim, and not evidence
          against it.
      - observation: >-
          The watch expires, or the process crashes, or the predicate
          module cannot be imported.
        assigns_to: >-
          failed_infrastructure. Not a negative mathematical result.
          A missing predicate is not a gap of 0.

  stopping_rules:
    - Stop when both fractions, the replay, the plants, the slot counts, and the p=7 sign check each have a recorded value, or an invalidation has fired.
    - Do not add a third degree. Do not lift a slot. Do not emit an attack.
    - Watch expiry stops the run as failed_infrastructure.
    - If the p=5 census and its controls are already recorded and only the p=7 subset crashes, record the p=5 assignment and mark the sign check failed_infrastructure. That crash does not flip the p=5 row.

  invalidation_rules:
    - A timeout, crash, memory abort, or missing predicate module is failed_infrastructure and is not evidence against the hypothesis.
    - A failed plant, a slot count other than 2500 or 62500, a nonzero lifts_to_Q, or a degree-6 replay that disagrees invalidates the run.
    - Using a different predicate on one degree, or counting the zero polynomial as a section, invalidates the run.
    - Emitting an ECDLP algorithm, a xedni lift, or a claim about alpha at p=101 or p=809 invalidates the run.
    - Changing the pre-registered threshold after seeing a fraction is forbidden. A correction is a new amendment record, and an existing run is not re-scored against it.
    - An unstable p=7 sign does not invalidate the p=5 assignment and is not a p=5 negative.

  success_criterion: >-
    The run is a success for this reading exactly when the first row of
    mechanism_assignment holds: the plants pass, the slot counts are
    2500 and 62500, lifts to Q are 0, the degree-6 replay agrees, and
    the absolute gap is at least 0.05 (gap_integer at least 3125). Any
    other completed assignment is not this success. In particular, a
    finished absolute gap strictly less than 0.05 is not a success.

  falsification_criterion: >-
    The prediction fails when the plants pass, the slot counts are
    2500 and 62500, lifts to Q are 0, the degree-6 replay agrees, and
    the absolute gap is strictly less than 0.05 (gap_integer at most
    3124). That is a negative. The third row of mechanism_assignment
    falsifies nothing about the two degrees. The fourth row falsifies
    nothing about the two degrees.

  required_artifacts:
    - experiments/EXP-XEDN-db173f/runs/RUN-*/manifest.yaml
    - experiments/EXP-XEDN-db173f/runs/RUN-*/stdout.txt
    - experiments/EXP-XEDN-db173f/runs/RUN-*/stderr.txt
    - experiments/EXP-XEDN-db173f/runs/RUN-*/reading.yaml
  artifact_contents:
    reading.yaml: >-
      Both slot counts recorded before the predicate. n4, n6, both
      fractions, absolute_gap, and gap_integer. The replay count.
      plants_pass and lifts_to_Q. The p=7 subset gap, both signs, and
      direction_unstable. Then exactly one mechanism_assignment row.
      attack_claimed is false.
  assigned_to: executor
