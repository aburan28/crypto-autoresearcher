experiment:
  id: EXP-FROB-ec08b5
  hypothesis_id: H-FROB-6774fb
  proposal_id: IDEA-20260918-9abf42
  question_id: RQ-FROB-7d8dd4
  goal_id: GOAL-FROB-6333a9
  version: 1
  title: >-
    The Frobenius-stable factor-base design space: which orbit-bearing factor
    bases exist at a given (q, n), what the orbit quotient is exactly worth, and
    when the two together are a net win
  status: approved
  frozen: true
  execution_authorized: true
  assigned_to: executor
  approved_by: coordinator
  approval_decision: DEC-20260922-5796b8
  metrics:
    - id: M1
      name: lattice_method_agreement
      definition: >-
        Exact agreement of four independent methods on subspace count, dimension
        spectrum and orbit-length census, per lattice cell.
    - id: M2
      name: census_derivation_agreement
      definition: >-
        Number of stable subspaces on which the annihilator/totient and Burnside
        derivations of the orbit census disagree. Target 0.
    - id: M3
      name: pi_stability_and_controls
      definition: >-
        Whether F_V is pi-stable for sigma-stable V, and whether both controls
        (random non-stable V' of equal dimension; curve over no proper subfield)
        fail to be pi-stable, per curve cell.
    - id: M4
      name: exact_orbit_count
      definition: >-
        Measured number of pi-orbits on F_V minus the predicted
        f + (|F_V| - f)/n, where f counts the affine E(F_q) points in F_V.
        Target 0 on every cell.
    - id: M5
      name: net_win_margin_log2
      definition: >-
        log2(mean orbit size) - (l' - l*) * log2(q), where l* = ceil(n/m) and l'
        is the smallest attainable faithful stable dimension at least l*.
        Positive means the orbit quotient outweighs the factor-base inflation.
  success_criterion: >-
    All five preregistered predictions hold: M1 exact agreement on every lattice
    cell; M2 zero mismatches; M3 stable V always pi-stable with both controls
    failing on every curve cell; M4 exactly zero deviation on every curve cell;
    and M5 negative at q = 2, n in {131, 163} for every m in {2,3,4,5} with a
    margin of at least 50 bits, while positive for at least one m at n = 127.
  falsification_criterion: >-
    Any disagreement among the four lattice methods; any totient/Burnside
    mismatch; a sigma-stable V whose factor base is not pi-stable, or a control
    that passes; a measured orbit count differing from f + (|F_V| - f)/n at n an
    odd prime; or a net win at n = 131 or n = 163, or no net win at n = 127.
    Any one of these falsifies the corresponding clause of H-FROB-6774fb.
  budget:
    watchdog_seconds: 5400
    memory_mb: 4096
    max_concurrent: 1
    expected_wall_seconds: 900
    wall_clock_seconds: null
    maximum_batches: null
    budget_note: >-
      wall_clock_seconds and maximum_batches are null because FROB is a declared
      ECC area and CLAUDE.md rule 11 sets ECC budgets unlimited. The watchdog and
      memory cap remain as machine protection, not as a research budget.
  objective: >-
    Decide, exactly and at cryptographic extension degrees, whether a
    Frobenius-stable Gaudry/Diem factor base is available at the dimension index
    calculus needs, and what the orbit quotient buys when it is. This is the
    factor-base half of RQ-FROB-7d8dd4; it deliberately says nothing about
    solving degree or decomposition cost, which the rest of the lane measures.

  design:
    object: >-
      E/F_q ordinary, attacked over F_{q^n}, with factor base
      F_V = {P in E(F_{q^n}) : x(P) in V} for V an F_q-subspace of the x-line.
    null_object: >-
      A curve defined over F_{q^n} and over no proper subfield. For it the
      q-power Frobenius is not an endomorphism, so there is no orbit structure
      on its factor base at all. Measured on every curve cell, not assumed.
    nearby_object_control: >-
      A uniformly random F_q-subspace V' of the SAME dimension that is not
      sigma-stable. Its factor base must fail to be pi-stable. This separates
      "V is Frobenius-stable" from "V happens to have the right dimension".
    independent_methods:
      - >-
        A -- monic divisors of T^n - 1 over F_q, obtained from q-cyclotomic
        cosets; integer arithmetic only, no polynomial factorisation.
      - >-
        B -- sigma-closure of each single vector of F_{q^n}, collecting distinct
        spans. Recovering all stable subspaces this way also verifies that every
        stable subspace is cyclic, which is the module claim itself.
      - >-
        C -- exhaustive enumeration of EVERY F_q-subspace by reduced row echelon
        form, tested for stability. Exponential, so small cells only.
      - >-
        O -- direct orbit iteration inside the field, with no appeal to
        annihilators, divisors or totients.
      - >-
        Two further independent derivations of the orbit census itself: the
        F_q[T]-annihilator/totient argument and Burnside's lemma over the
        subfield lattice. They share no step.

  scope:
    q: [2, 3, 4, 5, 8, 9]
    n_lattice: [3, 4, 5, 6, 7, 9, 11]
    n_census: [3, 5, 7, 8, 9, 11, 13, 15, 17, 21]
    n_targets: [7, 11, 41, 43, 113, 127, 131, 163, 233, 239, 283, 409, 571]
    m: [2, 3, 4, 5]
    includes_non_semisimple: true
    non_semisimple_note: >-
      Cells with p | n are included in the lattice phase, where T^n - 1 is not
      squarefree and the divisor lattice is not Boolean. The orbit census is
      scoped to gcd(q, n) = 1 and the driver records the skip rather than
      silently omitting the cell.

  constraints:
    - No deployed curve is an attack instance. The real extension degrees appear
      only as parameters of a structural census; no point on any standardised
      curve is touched.
    - No discrete logarithm is solved and no relation is claimed, so
      certificate.kind is none and docs/claims-and-verification.md's solution
      certificate gate does not apply.
    - Claims are scoped to the enumerated (q, n) cells and to the Gaudry/Diem
      subspace factor-base family. No extrapolation to other factor-base shapes.
    - A timeout, crash or environment restart is execution status and never
      negative mathematical evidence.

  execution:
    entry_point: experiments/EXP-FROB-ec08b5/impl/driver.py
    interpreter: sage -python
    trial_plan: experiments/EXP-FROB-ec08b5/trial-plan-v1.json
    seed: 20260922
    determinism: >-
      Every phase is an exact enumeration; the seed affects only the choice of
      random non-stable control subspace and of null-object curve, both of which
      are recorded in the run artifacts.
    checkpointing: >-
      One checkpoint file per phase under <run-dir>/checkpoint/. --resume
      continues from the last completed phase. A killed run loses at most one
      phase.
    output_bound: >-
      DELIBERATE CONTRACT: no per-element, per-tuple or per-point stream exists.
      Each phase emits aggregate counters plus a bounded number of witness
      records, so a completed run's artifacts are tens of kilobytes. The
      predecessor stage0 of EXP-FROB-d8aa37 streamed one JSON record per signed
      tuple; its partial output reached 2.44 GB, exceeded the 100 MiB hosting
      limit, and was never checkable. This contract exists so that failure mode
      cannot recur here.
    budget:
      watchdog_seconds: 5400
      memory_mb: 4096
      expected_wall_seconds: 900

  replication:
    plan: >-
      Two ordinary subfield curves of distinct j-invariant per curve cell where
      the base field admits them; cells where only one exists are recorded as
      such and their evidence strength is capped accordingly.
    independent_recomputation: >-
      Phases 1-3 and 5 depend on no random choice and no curve, and are
      recomputable from (q, n) alone by any implementation of the divisor
      enumeration. Phase 4 is reproducible from the recorded curve coefficients
      and seed.

  measurements:
    - id: M1
      what: subspace count, dimension spectrum and orbit-length census per cell
      how: methods A, B, C, O compared for exact agreement
    - id: M2
      what: agreement of the two orbit-census derivations on every stable subspace
      how: totient vs Burnside, exhaustively over the census cells
    - id: M3
      what: pi-stability of F_V and the two controls
      how: direct membership test of pi(P) for every P in the factor base
    - id: M4
      what: measured pi-orbit count vs the exact prediction f + (|F_V| - f)/n
      how: orbit partition by iteration; f counted as the affine E(F_q) points in F_V
    - id: M5
      what: attainability and net-win verdict at each target degree and each m
      how: l' = min attainable faithful dimension >= ceil(n/m); margin =
           log2(mean orbit size) - (l' - l*) log2 q
