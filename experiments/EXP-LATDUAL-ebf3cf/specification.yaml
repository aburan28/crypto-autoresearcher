experiment:
  id: EXP-LATDUAL-ebf3cf
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-7bc28c; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-7bc28c
  question_id: RQ-MLKEM-003
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Instrument a Gauss-style sieve's near-neighbour list accesses at dimensions 26 to 44, fit
    the working-set locality exponent against a semantics-preserving locality-destroyed null, and
    report the induced interval on the memory-charged wiring exponent
  objective: 'The run reduces one uncertainty: how local a sieve''s list accesses actually are, and
    therefore which wiring exponent a memory-charged cost model is entitled to. Stated as parts: (i)
    does the locality-destroyed null preserve the algorithm exactly - identical output vectors, identical
    access counts - so that its lambda is a valid uniform-access calibration point; (ii) what is lambda
    on the signal arm at each dimension, with an interval, and does the signal-null gap exceed the
    fitter''s resolution; (iii) what interval on the wiring exponent theta does the measured lambda
    induce under the committed monotone map, and how wide is the resulting interval on the crossover
    displacement. The run is not asked where the crossover is - that is the priced-crossover contract''s
    question - and is not asked anything about any deployed parameter set. A run that finds lambda_signal
    indistinguishable from lambda_null is a complete run: it measures that this sieve has no address
    locality to price, which supports the pessimistic wiring exponent and is a usable input to every
    memory-charged figure in the corpus.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for this sieve implementation
      with this data layout, on lattices from the tested distribution at n in the tested band, the
      working-set exponent was lambda with the stated interval, the semantics-preserving locality-destroyed
      null gave lambda_null, and the committed map induces the reported theta interval. WHAT DOES
      NOT FOLLOW: nothing about G6K or any other implementation; nothing about sieving in general,
      since lambda is a property of the implementation-layout pair; no crossover dimension, which
      this contract does not compute; no claim that any published memory-charged figure is wrong;
      nothing about ML-KEM or FIPS 203; and no extrapolation of lambda above n = 44.'
  inputs:
    procedure: 'STAGE 0 (cost: 0 compute). Freeze the instrumentation boundary - the exact definition
      of one list access - the w grid, the fit region rule, the seed schedule and the lambda-to-theta
      map. This stage is the one that determines the result and is frozen first for that reason. STAGE
      1 (cost: high). Implement and validate the instrumented Gauss-style sieve; confirm it returns
      correct shortest vectors against exhaustive enumeration at n <= 26. STAGE 2 (cost: high, dominant).
      Signal-arm runs at n = 26 to 44, streaming D(w). STAGE 3 (cost: high). Locality-destroyed null
      runs on the same lattices from the same seeds, with the semantic-equivalence check. STAGE 4
      (cost: low). Synthetic-sequence fitter validation at forced lambda of 0.5 and 1.0. STAGE 5 (cost:
      low). Per-run lambda fits with intervals; aggregation across lattices; drift fit with dimension.
      STAGE 6 (cost: medium). Layout control on a subsample. STAGE 7 (cost: low). Induce the theta
      interval through the committed map and report the crossover-displacement interval. STAGE 8 (cost:
      low). Emit immutable run records through harness/runner.py.'
    instrument: Python 3.11 standard library only; numpy, fpylll and Sage are absent from this environment
      and none is used. The sieve holds its list in a plain Python list of integer tuples with an
      explicit index-based accessor, and every call to that accessor is counted - the accessor is
      the instrumentation boundary and is the frozen object of STAGE 0. Working-set curves are computed
      by a streaming distinct-count over a sliding window using a dictionary of last-touch positions,
      so the full access sequence is never stored. Fits by ordinary least squares implemented in pure
      Python. Run records and seeds through harness/runner.py.
    parameters: n in {26, 30, 34, 38, 42, 44}; ten lattices per dimension from one fixed distribution
      with recorded determinant normalisation; sieve run to saturation with a stated saturation criterion;
      w grid geometric from 8 to 10^6 with eight points per decade; fit region restricted to the saturated
      phase and to windows spanning at least two decades; layout control on 3 lattices per dimension;
      synthetic validation sequences of length 10^7 with lambda forced to 0.5 and 1.0.
  controls:
  - 'Locality-destroyed null: identical sieve with a seeded index-space permutation between rounds,
    on the same lattices in the same invocation.'
  - 'Semantic-equivalence check: both arms must produce identical output vectors and identical total
    access counts.'
  - Synthetic-sequence fitter validation with lambda forced to 0.5 and to 1.0 by construction.
  - 'Scaling-region check: runs whose D(w) curve spans fewer than two decades are excluded and counted.'
  - 'Layout control: rerun on a subsample with the list stored in insertion order rather than sorted
    order, exposing how much of lambda is layout rather than algorithm.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The locality-destroyed null, executed in the same invocation on the
    same lattices from the same seed stream: the identical sieve, with the list''s index space randomly
    permuted after each round by a seeded permutation. This preserves the algorithm exactly - the
    same vectors, the same reductions, the same list size, the same number of accesses - and destroys
    address locality only. The null''s lambda is thereby forced toward the uniform-access value, and
    it is the calibration point against which the signal arm''s lambda is read. The null must show
    lambda_null measurably above lambda_signal for the signal arm''s locality to mean anything; if
    lambda_signal equals lambda_null, the sieve as implemented has no address locality to price, which
    is a complete and reportable result. A second control fixes a synthetic access sequence with a
    known lambda by construction and confirms the fitter recovers it.'
  independent_variables:
  - lattice dimension n
  - arm (signal versus locality-destroyed null)
  - data layout (sorted versus insertion order)
  - sieve phase (fill, reduce, prune)
  metrics:
    primary:
    - fitted lambda with interval per run, signal arm
    - fitted lambda with interval per run, null arm
    - lambda_null minus lambda_signal per dimension
    - induced theta interval
    secondary:
    - total access count per run
    - peak list size per run
    - per-phase lambda
    - scaling-region span
    - wall clock per run reported as a secondary metric only
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The signal-null locality gap G_lambda(n) = lambda_null(n) - lambda_signal(n) at each
      tested dimension with a 95 percent interval, and the interval on the wiring exponent theta that
      lambda_signal induces through the committed map.
    formula: D(w) = the expected number of distinct list indices appearing in a window of w consecutive
      accesses, averaged over window start positions in the saturated phase. Fit log D(w) = lambda
      * log w + const by least squares over the fit region; lambda in (0, 1], with lambda = 1 the
      uniform-access regime. The committed monotone map is theta = 1 - (1 - lambda) * kappa with kappa
      a wiring constant fixed in STAGE 0, so lambda = 1 forces theta = 1 (fully global, most pessimistic)
      and smaller lambda relaxes theta toward the local value. G_lambda(n) = lambda_null(n) - lambda_signal(n)
      is predicted positive and at least 0.05 at the largest n if the sieve has address locality.
    source: Pre-registered in the parent proposal IDEA-20260816-7bc28c before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Measured at n in [26, 44] on one lattice distribution with a pure-Python instrumented
      sieve, no numpy and no fpylll available in this environment. The transfer assumption is stated
      twice because it is unusually strong here: first, lambda is a property of the (implementation,
      layout) pair and its transfer to any other sieve implementation is not licensed at all; second,
      the drift of lambda with dimension is fitted over eighteen dimensions and is reported strictly
      as a within-band slope with its interval. No lambda, theta or crossover displacement is projected
      to dimensions where a real crossover would sit, and nothing is said about ML-KEM or FIPS 203.'
    correspondence: null
  tail_checks:
  - Smallest w in the grid, where D(w) is trivially near w in both arms and carries no information.
  - Largest w, where the window approaches the list size and D(w) saturates by construction; excluded
    from the fit and reported.
  - The fill phase, whose access pattern differs qualitatively from the reduce phase and could dominate
    a pooled fit.
  - Runs at the largest n where saturation may not be reached within budget; reported as unsaturated
    and excluded from the primary fit.
  - The layout control's extremes, where insertion-order storage may produce a sharply different lambda.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop a dimension at ten lattices or 10 wall-clock hours, reporting achieved counts.
  - Exclude and count any run whose scaling region spans fewer than two decades rather than fitting
    it.
  - Halt and report a null defect if the two arms disagree on output vectors or total access count
    on any lattice.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The null arm is verified semantics-preserving on every lattice, the fitter recovers
    the synthetic lambdas within 0.05, and lambda is reported with an interval of width at most 0.08
    at a minimum of four dimensions in both arms - whatever the size of the signal-null gap turns
    out to be.
  falsification_criterion:
  - 'Arms disagree on output vectors or access counts: the null is not semantics-preserving and no
    calibration exists.'
  - 'Fitter misses the synthetic lambdas by more than 0.05: the estimator is wrong and every lambda
    is void.'
  - 'Signal-null gap within interval of zero at every dimension: no measurable address locality, supporting
    the pessimistic theta and refuting the entry''s motivating expectation.'
  - 'Layout control shifts lambda by more than the signal-null gap: lambda is layout-borne and may
    be reported only as such.'
  - 'Fewer than four dimensions produce a fittable scaling region: the measurement floor is reported
    instead of a lambda.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-7bc28c
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The lambda-to-theta map is committed in STAGE 0 but is not derived; a Coordinator must either
    derive it from an explicit wiring model or own it as an assumption, and KN-OPEN-017 records that
    this corpus has no such model.
  - The instrumentation boundary - what counts as one list access - determines lambda and is a choice,
    not a derivation.
  - Whether a Gauss-style sieve's access pattern is representative of the sieves whose costs are quoted
    in the concrete-security literature is not established and must not be asserted at review.
  - The saturation criterion for the sieve is named but not fixed.
