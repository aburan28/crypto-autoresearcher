experiment:
  id: EXP-ALPF-1bd2d9
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-a67f97; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-a67f97
  question_id: RQ-ALPF-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Paired leading-form versus full-system first-fall metering of the same prime-field Semaev
    instances, with a homogeneous null arm on which the two meters must agree exactly, reporting the
    2x2 disagreement table per degree profile.
  objective: 'The one uncertainty a run reduces is how much of the ALPF survival signal is a property
    of the homogeneous truncation the meter actually reads rather than of the Semaev system it is
    taken to describe. Stated as parts: (i) do two meters that differ only in their input construction
    -- top forms versus full generators through the degree filtration -- agree exactly on homogeneous
    systems, where the truncation is the identity, and do both reproduce the three published control
    rows, since without this the comparison measures implementation difference rather than truncation;
    (ii) on genuine toy prime-field Semaev instances, what is the paired 2x2 verdict agreement table
    per leading-form degree profile, and is the disagreement asymmetric under a McNemar test; (iii)
    does the disagreement rate track the profile imbalance ratio, being small for the balanced baseline
    profile [4,4,4,12] and large for the extreme pullback profile [1,1,1,24] that appears in the archived
    EXP-ALPF-007 and EXP-ALPF-011 tables. Reducing these tells any future reader exactly what a leading-form
    fire licenses about the untruncated system, which is currently an unstated inference in every
    ALPF cell.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for these profiles,
      these toy primes, this pair of meter implementations and this choice of inhomogeneous predictor,
      the paired verdicts agreed at rate a with disagreement asymmetry as reported, and the homogeneous
      null agreed exactly. What does NOT follow: that any archived ALPF verdict is wrong or should
      be revised, since those runs are immutable and metered the truncation deliberately; that the
      truncation is a good or bad modelling choice in general; that any decomposition method is feasible,
      faster or slower; and no attack, speedup or security consequence of any kind. A disagreement
      rate is a scope qualifier on an inference, not a correction of a measurement.'
  inputs:
    procedure: 'STAGE 0 (cost: 0 compute, ~2 hours human): transcribe the leading-form profiles and
      their recorded verdicts from experiments/EXP-ALPF-011/analysis.md and EXP-ALPF-007/analysis.md;
      write down, symbolically, the truncation map for each profile and its imbalance ratio. STAGE
      1 (cost: ~1 day human): implement meter_lead(generators) and meter_full(generators) sharing
      one Macaulay rank routine and one D_reg_pred function, differing only in the builder. STAGE
      2 (cost: seconds): run both on the three published control systems and on 40 homogeneous null
      systems per profile; abort if any disagreement appears. STAGE 3 (cost: ~2 CPU-hours): build
      40 toy Semaev instances per profile at a 13-bit prime with harness/toycurve.py and harness/semaev.py,
      and meter each with both meters in the same process. STAGE 4 (cost: ~1 CPU-hour): run the random-inhomogeneous
      null arm. STAGE 5 (cost: minutes): assemble the paired 2x2 tables, run McNemar per profile,
      and regress disagreement rate on imbalance ratio. STAGE 6 (cost: 0): report ceiling hits per
      meter separately so asymmetric truncation is visible.'
    instrument: Python 3 only, no Sage. harness/semaev.py for s3_expr and s4_expr and build_factor_base;
      harness/toycurve.py for curve and instance generation; one shared pure-Python Macaulay-rank
      module over F_p with two builder functions (top-form builder and full-generator builder) and
      one shared rank routine and one shared D_reg_pred function; sympy for polynomial degree and
      leading-form extraction; harness/runner.py for manifests and seeds; scipy-free McNemar computed
      directly from the discordant counts with an exact binomial test.
    parameters: 'Prime: one 13-bit prime, matching the archived rows; a 15-bit prime for one replication
      cell. Profiles: [4,4,4,12] (balanced baseline), [2,2,2,4] (e-ring), [2,3,4,12] (power-sum),
      [1,1,1,24] (pullback x=t^2+c, extreme). |FB| = 4 throughout, matching the archived rows. Instances:
      40 per profile per arm; arms are signal, homogeneous null, random-inhomogeneous null. Maximum
      Macaulay degree: 14 for both meters, with a hard column cap of 2 million applied identically.
      Total metered pairs: 4 profiles x 3 arms x 40 = 480, each metered twice, plus 3 control systems.'
  controls:
  - Homogeneous null arm on which the two meters must agree on 100 percent of instances, run in the
    same invocation.
  - Random-inhomogeneous null arm with the same profile and random lower-order terms, bounding generic
    truncation disagreement.
  - The three published meter control rows, metered by both implementations independently.
  - 'Rank-routine identity check: both meters call the same rank function on matrices built by different
    builders, asserted programmatically.'
  - 'Degree-ceiling parity: both meters run to the same maximum degree, with ceiling hits reported
    per meter.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a homogeneous random system with the identical leading-form
    profile -- for which the two meters are, by construction, reading the same input, since a homogeneous
    system equals its own leading forms. Running both meters on the null must produce EXACT agreement
    on every instance; any disagreement is a bug in one of the two implementations and voids the whole
    comparison. The three published control systems serve the same role and must also agree exactly.
    For the signal arm to mean anything, the null must show a 100 percent agreement rate and the published
    control rows must be reproduced by both meters independently. A second null, a random inhomogeneous
    system with the same profile and randomly drawn lower-order terms, bounds how much disagreement
    arises from generic lower-order terms rather than from curve structure.'
  independent_variables:
  - leading-form degree profile
  - meter input construction (top forms vs full generators)
  - arm (signal, homogeneous null, random-inhomogeneous null)
  - prime size (13-bit primary, 15-bit replication)
  metrics:
    primary:
    - paired 2x2 verdict agreement table per profile
    - McNemar discordant counts and exact binomial p-value per profile
    - agreement rate on the homogeneous null arm
    - d_ff from meter_lead and from meter_full per instance
    secondary:
    - first degree at which the two observed Hilbert sequences diverge
    - profile imbalance ratio and its regression against disagreement rate
    - ceiling-hit count per meter per profile
    - peak Macaulay rows and columns per meter
    - wall-clock seconds per meter per instance
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The paired disagreement rate between the leading-form meter and the full-system meter
      on the same instance, as a function of the leading-form degree profile.
    formula: 'disagree(profile) = (# instances where fired_lead != fired_full) / 40, with fired_x
      = [d_ff_x < D_reg_pred(profile)]. Imbalance(profile) = max(d_i) / min(d_i). Pre-registered predictions:
      disagree(homogeneous null) = 0 exactly at every profile; disagree([4,4,4,12]) <= 0.10; disagree([1,1,1,24])
      >= 0.40; and disagree is monotone non-decreasing in Imbalance across the four tested profiles.
      No direction is pre-committed for the McNemar asymmetry.'
    source: Pre-registered in the parent proposal IDEA-20260816-a67f97 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested at 13-bit and 15-bit primes with |FB| = 4 and full generator degrees up
      to 24, which are the archived ALPF parameters. No transfer to medium or cryptographic scale
      is assumed or claimed. The one extrapolation examined rather than assumed is across the four
      profiles via the imbalance regression, and it is reported as an observed within-experiment trend
      over four points, explicitly too few to fit a law and stated as such.
    correspondence: null
  tail_checks:
  - Report every instance where the full meter hit the degree ceiling and the leading-form meter did
    not, since these manufacture disagreement.
  - Report the divergence-degree distribution, not just its mean, since the propagation account predicts
    concentration at specific degrees.
  - Report any homogeneous-null disagreement individually with its seed, since even one is a bug rather
    than noise.
  - Report the largest gap between d_ff_lead and d_ff_full observed on any instance.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Abort before STAGE 3 if the homogeneous null arm shows any disagreement or if either meter fails
    a published control row.
  - Mark a profile not-measurable and continue if its full-system Macaulay matrix exceeds the column
    cap at degree 4 or below.
  - Hard stop at 6 total CPU-hours; report completed profiles and mark the rest not-run.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both meters reproduce the three published control rows, the homogeneous null
    arm shows exact agreement on all instances, and a paired 2x2 table with a McNemar result is reported
    for at least two profiles of differing imbalance.
  falsification_criterion:
  - Disagreement above 95 percent agreement at every profile, falsifying the imbalance mechanism in
    claim (C).
  - Any disagreement on the homogeneous null arm.
  - Either meter failing to reproduce a published control row.
  - Disagreement rate uncorrelated with imbalance ratio across the four profiles.
  - Ceiling hits accounting for the majority of disagreements, in which case the result is reported
    as budget-limited rather than as a truncation effect.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-a67f97
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The semiregular predictor for the inhomogeneous side must be specified by a Coordinator; using
    the homogeneous D_reg_pred for both sides is the default here but is a modelling choice that determines
    what a disagreement means.
  - The homogenisation convention used by the archived Autolab meter must be confirmed against experiments/EXP-ALPF-011/source/
    rather than inferred from the profile column.
  - Whether the pullback profile [1,1,1,24] can be built at all with the harness Semaev code, or is
    specific to the archived pullback construction, needs checking before freeze.
  - The column cap of 2 million is a guess at the memory budget and needs a dry-run measurement.
