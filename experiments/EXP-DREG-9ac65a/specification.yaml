experiment:
  id: EXP-DREG-9ac65a
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-DREG-5a3ac1
  question_id: RQ-DREG-001
  goal_id: GOAL-DREG-001
  title: >-
    The block-matched null: exact GF(2) Macaulay rank at D=5 of the null
    ensemble sharing the boolean chained-Semaev supports, at n=9 and n=12, with
    a full-support null forced to deficit 0, a block-permuted nearby control and
    a five-point graded arm

  objective: >-
    If separately approved, authorized and executed, measure how much of the
    boolean chained-Semaev rank deficit against the global semi-regular
    reference is reproduced by a RANDOM system sharing the sem's supports - the
    matched null this goal has never built. The sem side uses COMMITTED ranks
    only and is never recomputed; the null side is constructed and measured in
    pure Python plus numpy, which is what makes the contract executable in an
    environment without Sage. The deliverable is the share
    s = (E[rank_BMN] - rank_sem) / (sr_pred - rank_sem) with its seed spread, at
    n = 12 D = 5 primarily and n = 9 D = 5 as the cheap rung, and BOTH DIRECTIONS
    OF s ARE USEFUL.

  what_this_is_not:
    - Not a d_reg measurement. D = 5 sits below the semi-regular freeze degree at both cells (phi_full = 6 at n=9, 7 at n=12).
    - Not a measurement of the sem system; no sem rank is computed here, only read from committed artifacts.
    - Not evidence for or against the polynomial-solve or sub-rho scenarios, and not a status change to H-DREG-001 or H-SIG-001.
    - Not a discrete-logarithm computation, relation collection, or any ECDLP attack.
    - Not an ECDLP cost, asymptotic, exponent, cryptographic-scale, or deployed-scheme claim.
    - Not an adjudication of the arm-P versus arm-R dispute at n=12 D6, which is out of this contract's budget.
    - Not a lifting or reinstatement of the BATCH-002 quarantine, which is a Coordinator decision.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling: >-
    Tier TOY, unraisable by any downstream citation. The exact scope a completed
    run could support is: at n in {9, 12}, D = 5, t = 3, ti = 0, m = 3, over
    GF(2), a stated fraction of the sem's committed rank deficit against
    sr_pred is reproduced by a random system sharing the sem's supports, with a
    stated ensemble spread over 3 to 5 seeds and one instrument lineage on the
    null side. It cannot support a statement about d_reg, about degrees at or
    above the freeze degree, about n > 12, about t >= 4, about prime fields, or
    about any cost.

  inputs:
    t: 3
    ti: 0
    m: 3
    field: GF(2)
    cells:
      - {n: 9,  D: 5, nb: 18, k: 3, priority: primary_cheap, seeds: 5}
      - {n: 12, D: 5, nb: 24, k: 4, priority: decisive,      seeds: 3}
      - {n: 9,  D: 6, nb: 18, k: 3, priority: optional_stretch_outside_gate, seeds: 3}
    forced_ncols: {"9,5": 11032, "9,6": 29332, "12,5": 46717}
    forced_nrows: {"9,5": 10440, "9,6": 45324, "12,5": 31512}
    nrows_formula: "nrows(n,D) = n*N(nb,D-2) + n*N(nb,D-3)"
    forced_srpred: {"9,5": 9504, "12,5": 29418}
    srpred_formula: >-
      sr_pred(n,D) = N(nb,D) - sum_{k<=D} h_k^+ where h_k are the coefficients of
      (1+z)^{nb} (1+z^2)^{-n} (1+z^3)^{-n} and h^+ truncates at the first
      non-positive coefficient.
    committed_sem_ranks_to_resolve:
      "12,5": {value: 28096, source: "src/h012c_block_m4ri.py header, declared validation gate: 'n=12 sem D5 ti0 -> 28096'", status: SOURCE_COMMENT_NOT_A_RUN_RECEIPT}
      "18,5": {value: 143882, source: "same header, used only as a cross-check of the sr_pred convention, not as a cell of this experiment", status: SOURCE_COMMENT_NOT_A_RUN_RECEIPT}
      "9,5": {value: null, source: "NOT ESTABLISHED IN THIS CONTRACT", status: UNRESOLVED}
    derived_deficits_for_reference:
      "12,5": 1322
      "18,5": 1999
      "21,5": 2724
    master_seed: 9066590
    domain: EXP-DREG-9ac65a/v1
    seed_derivation_rule: >-
      For arm label L in {BMN, FULL, PERM, GRAD00, GRAD25, GRAD50, GRAD75,
      GRAD100}, size n, degree D and replicate r, seed = big-endian unsigned
      integer of SHA-256 over the ASCII bytes of
      domain || "|" || L || "|" || decimal(n) || "|" || decimal(D) || "|" ||
      decimal(r) || "|" || decimal(master_seed), reduced mod 2^64, fed to
      random.Random(seed). Coefficients are drawn as independent uniform bits
      over the arm's support in sorted canonical monomial order; supports, where
      randomly drawn, are drawn without replacement in sorted index order. A
      third party reproduces every system bit-for-bit from (L, n, D, r).
    support_source:
      preferred: >-
        The sem's per-equation supports, recovered from the committed system
        artifacts (EXP-DREG-004 system_hash prefix 0da7ff6aa40007e8, and the
        EXP-SIG-* / EXP-DREG-001 lineages).
      fallback: >-
        BLOCK-TEMPLATE supports generated from the derived incidence pattern:
        n quadrics whose support is the full set of degree-<=2 monomials on
        (U, X3), n cubics whose support is the full set of monomials of degree
        <= 3 on (U, X1, X2) that contain at most one variable from each of X1
        and X2 and at most one from U in the cubic terms, sized to match the
        sem's per-equation support sizes.
      declaration_requirement: >-
        WHICH SOURCE WAS USED IS A REQUIRED ARTIFACT AND MUST APPEAR ON THE FACE
        OF EVERY NUMBER. The fallback matches block structure but NOT
        per-equation support and is strictly the weaker object; a result obtained
        under it may not be described as support-matched.

  arms_and_controls:
    treatment:
      label: BMN
      description: >-
        Block-matched null. Uniform random GF(2) coefficients on the sem's
        supports (or the block template, declared). Exact Macaulay rank at D.
    measured_null:
      label: FULL
      description: >-
        Full-support random null: same degree histogram (n quadrics, n cubics),
        same nb, same per-equation support sizes, supports drawn from ALL
        variables rather than from blocks.
      forced_value: >-
        rank EXACTLY sr_pred(n,D), i.e. deficit EXACTLY 0 - 9,504 at n=9 D5 and
        29,418 at n=12 D5. DERIVED BEFORE THE RUN. It CAN FAIL, and its failure
        voids everything: this is the instrument's calibration and it reproduces
        the committed BATCH-002 result ("null rank = sr_pred = 156520, deficit 0
        => calibrated") one degree lower and at a second n.
    positive_control:
      label: FULL (same arm, serving both roles) plus PLANT
      description: >-
        FULL is the sensitivity demonstration: it shows the instrument can land
        exactly on sr_pred. PLANT is the second, sharper positive control - a
        system with the BMN supports into which a KNOWN rank defect is planted by
        forcing one equation to be the GF(2) sum of two others (a syzygy of
        multiplicity 1). Its forced deficit is at least the number of Macaulay
        rows generated by that equation, i.e. exactly N(nb, D-d_i) additional
        dependent rows, computable pre-run: 2,024 + 1 at n=12 D5 for a cubic and
        10,626 + 1 for a quadric.
      requirement: >-
        If PLANT's measured deficit is not at least its forced value, the rank
        code cannot see a defect it was told about, the instrument is broken, and
        NO negative result may be reported from any arm.
    graded_control:
      label: GRAD(f)
      description: >-
        f in {0, 0.25, 0.5, 0.75, 1}, adding a fraction f of the forbidden
        cross-block monomials to the supports, interpolating BMN (f=0) to FULL
        (f=1). Five interior points at n = 9, D = 5.
      requirement: >-
        Deficit must decrease MONOTONICALLY in f and reach EXACTLY 0 at f = 1.
        Monotonicity is reported as a verdict. A deficit that fails to decay as f
        rises is the canonical artifact tell and localises the effect to a named
        cross-block monomial class.
    nearby_object_control:
      label: PERM
      description: >-
        Block-permuted null: degree-3 family on (U, X3), degree-2 family on
        (U, X1, X2), same block sizes, same degree histogram.
      requirement: >-
        Its deficit must differ from BMN's by more than the seed spread. If it
        does not, the measurement responds to block SIZES rather than to
        incidence and HEUR-BMN-2 is unsupported; this must be reported even if
        the headline s comes out favourable.
    ordering_control: >-
      Execution and commitment order is FIXED: FULL, then PLANT, then PERM, then
      GRAD, then BMN. Every arm's rank is written to the results artifact before
      the next arm runs. The committed sem ranks are NOT read into the analysis
      script until every null arm has been written. The frozen decision rule is
      executed on FULL and PLANT first; if it emits the same label on both, it
      discriminates nothing and must be rewritten before BMN is read.
    comparability_policy: >-
      Every arm at a cell shares nb, block sizes, degree histogram, per-equation
      support SIZES, row-generation rule, column ordering and counting
      convention. Ranks are compared only within a cell. The sem side comes from
      a different implementation (Sage/m4ri) than the null side (numpy), and the
      FULL arm is the declared bridge: both implementations must place the
      full-support null at the same committed value, and if they do not the
      cross-implementation comparison is VOID and reported as infrastructure.

  metrics:
    primary:
      - name: ncols_per_arm
        definition: "Column count of each arm at each cell, against the forced values."
        units: monomials (integer)
      - name: rank_exact
        definition: >-
          Exact GF(2) rank of the degree-D Macaulay matrix, computed as the sum
          of per-chunk new pivots, with the per-chunk table retained.
        units: rank (integer)
      - name: seed_spread
        definition: >-
          max(rank) - min(rank) over the arm's seeds at a cell. REPORTED BEFORE
          ANY COMPARISON TO rank_sem.
        units: rank (integer)
      - name: s_share
        definition: >-
          s = (mean(rank_BMN) - rank_sem) / (sr_pred - rank_sem), with the
          interval induced by the seed spread.
        units: dimensionless ratio
    secondary:
      - name: full_arm_deficit
        definition: "sr_pred - rank_FULL. Forced 0."
        units: rank (integer)
      - name: plant_arm_deficit
        definition: "sr_pred - rank_PLANT against its forced lower bound."
        units: rank (integer)
      - name: perm_separation
        definition: "mean(rank_PERM) - mean(rank_BMN), against the seed spread."
        units: rank (integer)
      - name: grad_curve
        definition: "Deficit at f in {0,0.25,0.5,0.75,1} plus a monotonicity verdict."
        units: rank (integer), categorical
      - name: sem_rank_provenance
        definition: >-
          For each cell, whether rank_sem resolved to a run receipt, to a source
          comment only, or not at all.
        units: categorical
      - name: resource_trace
        definition: "Peak RSS, wall clock and chunk count per arm per seed."
        units: GB, seconds, count

  preregistered_prediction:
    quantity: s at n = 12, D = 5, and the forced values of every control arm.
    formula: >-
      s = (E[rank_BMN] - rank_sem) / (sr_pred - rank_sem) with
      sr_pred(12,5) = 29,418 and rank_sem(12,5) = 28,096, hence denominator
      1,322.
    source: >-
      ledger/hypotheses/H-DREG-5a3ac1.yaml prediction C4; sr_pred re-derived from
      the frozen series and validated against sr_pred(12,3..6) = 312 / 3,834 /
      29,418 / 156,520.
    values_frozen_here:
      s_supported_if: ">= 0.50, i.e. mean(rank_BMN) >= 28,757"
      s_falsified_if: "<= 0.15, i.e. mean(rank_BMN) <= 28,294"
      s_inconclusive_band: "0.15 < s < 0.50, declared inconclusive at this cell before any run"
      full_arm_rank: {"9,5": 9504, "12,5": 29418}
      bmn_ncols: {"9,5": 11032, "12,5": 46717}
      grad_deficit_at_f1: 0
      seed_spread_admissible_range_12_5: "strictly greater than 0 and strictly less than 331 (= 0.25 * 1,322)"

  stages:
    - id: S0
      name: environment and provenance
      cost: "<= 15 min, zero compute"
      terminates_run: false
      description: >-
        Record the environment probe verbatim (numpy present at 2.4.6; `import
        sage` fails; src/semaev_tree.py and src/h012c_block_m4ri.py both fail to
        import in this container). Attempt to recover the sem supports; declare
        PREFERRED or FALLBACK. Resolve rank_sem(12,5) = 28,096 to a run receipt
        or mark it SOURCE_COMMENT_ONLY.
    - id: S1
      name: construction gate
      cost: "seconds, pure Python"
      terminates_run: true
      description: >-
        THE CHEAPEST DECISIVE GATE, AND IT RUNS FIRST. Build every arm's column
        set and compare counts to the forced values (11,032 / 46,717 for BMN;
        N(nb,D) for FULL). A mismatch means the null is not matched and the run
        ENDS here. No rank is computed until this passes.
    - id: S2
      name: calibration and sensitivity
      cost: "<= 1 h, numpy"
      terminates_run: true
      description: >-
        FULL at n = 9 D5 and n = 12 D5 (forced deficit 0) and PLANT at n = 9 D5
        (forced deficit >= its planted lower bound). If FULL is not exactly 0, or
        PLANT does not fire, the run ENDS and reports instrument failure. No
        other arm is read.
    - id: S3
      name: n = 9 rung
      cost: "<= 1 h, numpy"
      terminates_run: false
      description: >-
        BMN (5 seeds), PERM (3 seeds), GRAD (5 f-values x 3 seeds) at n = 9 D5.
        Report spread first, then any comparison.
    - id: S4
      name: n = 12 decisive rung
      cost: "<= 6 h, numpy, ~184 MB packed"
      terminates_run: false
      description: >-
        BMN (3 seeds) and PERM (2 seeds) at n = 12 D5. Compute s against the
        committed rank_sem if and only if it resolved in S0.
    - id: S5
      name: optional stretch
      cost: "outside the completion gate"
      terminates_run: false
      description: >-
        n = 9, D = 6 - the ONLY affordable cell at or above the semi-regular
        freeze degree (phi_full(9) = 6). Run only if S1-S4 complete inside
        budget. Its value is that it is the one cell where the question can be
        asked at the freeze degree rather than below it.

  replication:
    seeds: [0, 1, 2, 3, 4]
    seeds_per_cell: {"9,5": 5, "12,5": 3, "9,6": 3}
    determinism_requirement: >-
      Re-running any (arm, n, D, seed) must reproduce the identical system hash,
      the identical column set hash and the identical rank. Any arm failing this
      is invalid.
    minimum_for_a_reported_share: >-
      s may be reported at a cell only with >= 3 completed BMN seeds at that
      cell and the seed spread reported first.

  budget:
    wall_clock_seconds: 36000
    cpu_seconds: 36000
    memory_gb: 4
    max_runs: 60
    per_cell_ceiling_seconds: {"9,5": 3600, "12,5": 21600, "9,6": 7200}
    note: >-
      n = 12 D5 dominates: 46,717 columns (730 uint64 words per row) x 31,512
      rows, about 184 MB packed, eliminated in column chunks. n = 12 D6
      (174,035 x 183,312) is EXPLICITLY OUT OF SCOPE - the committed CTRL-B run
      needed 7.16 GB and 1,623.8 s under a Sage/m4ri engine for a cell of that
      size, and nothing in this contract attempts it.

  stopping_rules:
    - S1 construction gate fails at any arm -> STOP, report F1, no rank computed.
    - FULL arm deficit is not exactly 0 at n = 9 D5 -> STOP, instrument failure, no arm reported.
    - PLANT arm does not reach its forced deficit lower bound -> STOP, instrument cannot see a planted defect, no negative reported.
    - Seed spread of BMN at a cell is exactly 0 -> STOP that cell, report a degenerate ensemble (the coefficient sampler is not random).
    - Seed spread of BMN at a cell >= 0.25 * D_glob -> the comparison at that cell is WITHDRAWN; report the distribution, not a share.
    - Per-cell wall clock ceiling exhausted -> STOP that cell and report failed_infrastructure with the chunk coverage reached.
    - rank_sem(12,5) unresolvable to a run receipt -> S4 still runs and reports rank_BMN and its spread, but NO s is reported at that cell.

  invalidation_rules:
    - Any rank not equal to the sum of its per-chunk new pivots is invalid.
    - Any arm whose system hash is not reproducible from its declared seed is invalid.
    - Any comparison between arms differing in nb, block sizes, degree histogram, support sizes, row rule or column convention is invalid.
    - Any s reported without the seed spread reported first is invalid.
    - Any s computed against a rank_sem that resolved only to a source comment must be labelled PROVISIONAL on its face; unlabelled, it is invalid.
    - Any result obtained under the FALLBACK support source that is described as support-matched is invalid.
    - Any conclusion about d_reg, cost, exponent, prime fields or cryptographic scale drawn from this contract is invalid on its face.

  success_criterion: >-
    ALL of: (a) the construction gate passes at every arm with column counts
    exactly equal to the forced values; (b) the FULL arm returns deficit exactly
    0 at n = 9 D5 and n = 12 D5; (c) the PLANT arm reaches at least its forced
    deficit lower bound; (d) BMN completes with >= 3 seeds at n = 12 D5 and >= 3
    at n = 9 D5, with seed spread strictly between 0 and 0.25 * D_glob at each;
    (e) the GRAD curve is monotone in f and exactly 0 at f = 1; (f) s is reported
    at n = 12 D5 with its spread-induced interval and its provenance label, and
    the verdict is assigned by the FROZEN rule s >= 0.50 supports / s <= 0.15
    falsifies / otherwise inconclusive. Reaching a verdict of "falsifies" or
    "inconclusive" is a SUCCESSFUL RUN of this contract; only failing (a)-(e) is
    an unsuccessful one.

  falsification_criterion: >-
    s <= 0.15 at n = 12, D = 5, with the seed spread inside its admissible band
    and the FULL and PLANT controls passing. H-DREG-5a3ac1 is then rejected in
    scope: the deficit is NOT substantially block incidence and it survived a
    support-matched null. Secondary falsifiers of the design rather than the
    hypothesis: the construction gate failing; FULL not returning 0; PLANT not
    firing; PERM indistinguishable from BMN; GRAD non-monotone or nonzero at
    f = 1. In every case the failing cell, arm and seed are named, and the
    forward guidance names the next object - a closed form for the amalgam's
    Hilbert series if s is large, or the n = 9 D = 6 freeze-degree cell and the
    n = 15 rung if s is small. A negative that names no successor has not
    finished (inventor protocol section 4).

  required_artifacts:
    - results.json with every metric, per cell, per arm, per seed
    - per-chunk pivot tables for every rank, summing to the reported rank
    - system hashes and column set hashes per arm per seed
    - the declared support source (PREFERRED or FALLBACK) with its evidence
    - the sem rank provenance table (run receipt / source comment / unresolved)
    - the ordering-control log showing FULL, PLANT, PERM, GRAD written before BMN and before any sem rank was read
    - exact commands, git commit, dirty-tree state, Python and numpy versions
    - environment probe transcript (numpy import, sage import, semaev_tree import)
    - peak RSS, wall clock and chunk count per arm per seed
    - stdout and stderr

  scale_relevance:
    tier: toy
    statement: >-
      n <= 12 boolean unknowns (nb <= 24) at D = 5, below the semi-regular freeze
      degree at both cells. Conclusions transfer NOWHERE by extrapolation: the
      share s is a per-cell empirical quantity with no derived law behind it, and
      this contract explicitly does not fit one. What DOES transfer, and only as
      a methodological statement, is that the deficits this goal reports are
      differences against an unmatched comparator until a matched one exists.
      The optional n = 9 D = 6 cell is the single cell inside budget that sits AT
      the freeze degree, and it is carried for exactly that reason; even it
      supports no statement about larger n.

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory, missing dependency, unrecoverable support,
    or unresolvable committed rank is INFRASTRUCTURE SIGNAL, recorded as
    failed_infrastructure with its cause and its chunk coverage. It is NEVER
    negative mathematical evidence and never counts toward the falsification
    criterion (AGENTS.md rule 5). This goal's own history makes the clause
    load-bearing: a host ENOSPC event blocked Bash and git on 2026-07-20, the
    un-chunked first-fall instrument is recorded as host-unsafe at D6,
    EV-DREG-004 records a destroyed checkpoint at 194,000 of 778,394 columns with
    a measured pickle-codec bottleneck, and two EXFAT data-loss incidents
    (INC-20260724-EXFAT-01/-02) are on record. Chunking with per-chunk receipts
    is therefore REQUIRED, not advisory, so that a crash costs a chunk rather
    than a cell.

  authorization_note: >-
    This contract is status review_required, is not frozen, and carries no
    approved_by field. Only the Coordinator may approve, freeze or authorize
    execution (AGENTS.md rule 1). It supersedes no existing contract, edits no
    existing record, does not alter GOAL-DREG-001's next_action or any committed
    checkpoint, and computes no sem rank. It depends on H-DREG-152cff only for
    the forced column counts used at the S1 gate; if that hypothesis fails its
    own stage 1, S1 falls back to comparing the BMN column set directly against
    the sem's committed column set, and that fallback is declared here rather
    than improvised later.

  inference:
    requested_policy: research-deep
    resolved_model_id: claude-opus-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
      orchestration/model-policies.yaml. Recorded, never silently substituted.
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    model_verified_reason: >-
      No adapter probe receipt exists for this session.
