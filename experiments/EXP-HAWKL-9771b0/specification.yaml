experiment:
  id: EXP-HAWKL-9771b0
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-955659; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-955659
  question_id: RQ-HAWK-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Zero-compute quantifier-order, method-ceiling, observation-collision and nearby-object audit
    of the module-LIP to nrd-PIP to subfield chain, calibrated against a null chain known to be sound.
  objective: 'The one uncertainty a run reduces is whether the recorded failure of the density heuristic
    was a diagnosis of the binding constraint or of an incidental one, and whether the chain''s composition
    is quantifier-sound as this corpus states it. Concretely: (i) whether each of the four links can
    be written from committed records with an explicit quantifier prefix and a named witness whose
    dependency set is stated, with any link available only in paraphrase marked provisional and barred
    from carrying a flag - the count of provisional links being a first-class output; (ii) whether
    composing the links requires an exists-forall exchange, and if so at which composition index,
    which is the audit''s primary flag and which must not land at links 1 or 2 without re-derivation,
    since KN-OPEN-028''s Q3 closure records the reduction as valid; (iii) what the chain would conclude
    if the failed density heuristic were replaced by the maximally generous assumption of density
    1, which tests whether density was the binding link at all - a ceiling that still falls short
    of the composed conclusion would mean another link binds and would relocate the whole route''s
    open question. The audit additionally runs the nearby-object control on plain LIP and the observation-collision
    search on the attaching map. Every step is symbolic; no compute is consumed and no experiment
    is executed.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: as the chain is stated
      in this repository''s committed records as of the run date, with p links provisional, the composition
      raises a quantifier flag at index i (or none), the method ceiling under density equals 1 is
      such-and-such compared to the composed conclusion, the chain fails to apply to plain LIP at
      link j, and the null chain raised zero flags. What does NOT follow: nothing about the route
      as its authors state it, since the body is relayed second-hand; nothing that revises KN-OPEN-028''s
      Q1, Q2 or Q3 closures or EV-HAWK-c99848''s identification of the fractional-ideal omission,
      all consumed here as settled; nothing about any cost, bound or exponent; nothing about whether
      any link''s underlying mathematics is correct; and no statement about HAWK''s security in either
      direction.'
  inputs:
    procedure: 'STAGE 0 (cost: half a day of human work, zero compute). Select and freeze the null
      chain (proposed: KN-TECH-081''s two-stage PIP structure) and the notation for quantifier prefixes,
      witnesses and dependency sets. STAGE 1 (cost: half a day). Audit the NULL CHAIN end to end by
      the full procedure; it must raise zero flags. If it flags, halt and report the procedure as
      too aggressive. STAGE 2 (cost: a day). Write the target chain''s four links twice, independently:
      once from KN-OPEN-027, once from KN-OPEN-028 plus EV-HAWK-c99848 and EV-HAWK-21edba. Record
      disagreements. Mark paraphrase-only links provisional. STAGE 3 (cost: hours). Perform the three
      composition checks; record the first flagged exchange index or none. STAGE 4 (cost: hours).
      Method ceiling: substitute density equals 1, recompute the chain''s conclusion link by link
      keeping all other stated costs, and check the substitution for incoherence with other links.
      STAGE 5 (cost: hours). Nearby-object control: instantiate link 1 on a plain LIP instance of
      matched dimension and record the failure link. STAGE 6 (cost: hours). Observation collision:
      search symbolically for distinct secret bases with the same attached nrd-PIP instance; report
      a witness or report the search''s scope. STAGE 7 (cost: an hour). Emit the trace, the four values,
      the provisional count, the disagreement count and the null result as a text artifact registered
      through harness/runner.py with the input record hashes.'
    instrument: 'No computation is required. The artifact is a structured text document plus a small
      JSON summary; the only tooling is a Python 3 script that records the frozen input record hashes
      and emits the JSON summary through harness/runner.py so the audit is a citable run record rather
      than prose in a chat. No numeric libraries, no lattice library, no computer-algebra system,
      and specifically no Sage. All inputs are files already in this repository: KN-OPEN-027, KN-OPEN-028,
      EV-HAWK-c99848, EV-HAWK-21edba, KN-TECH-081, docs/inventor-protocol.md.'
    parameters: 'Four target-chain links (module-LIP instance shape, reduction to nrd-PIP, re-randomisation
      over representations, subfield solve). Three composition checks. One null chain of comparable
      link count (proposed: two-stage PIP, two links, extended to comparable granularity or replaced
      if the Coordinator judges it too short). Two independent re-statements of each target link.
      One density substitution (density equals 1). One nearby object (plain LIP of matched dimension).
      Collision search scope declared as symbolic and bounded by the attaching map''s stated structure.
      No sample sizes, no seeds, no numeric parameters.'
  controls:
  - Null chain known to be sound (KN-TECH-081's two-stage PIP structure), audited first by the identical
    procedure, which must raise zero flags.
  - Single-link trivial chain, which must produce an empty composition check.
  - 'Provisional-entry rule: any link statable only from paraphrase is marked provisional and is barred
    from carrying a flag, so no flag rests on a paraphrase.'
  - Nearby-object control on a plain LIP instance of matched dimension, per section 8 item 4.
  - 'Independent re-statement: the four links are written out twice, once from KN-OPEN-027 and once
    from KN-OPEN-028 plus the evidence records, and disagreements between the two statements are reported
    rather than reconciled silently.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a chain of the SAME SHAPE that is known to be sound:
    a short, uncontroversial reduction chain from elsewhere in this corpus - for example the two-stage
    PIP structure recorded in KN-TECH-081, where stage one (find a generator) and stage two (shorten
    it) compose in a way the entry states explicitly - written out in the identical quantifier notation
    by the identical procedure and audited by the identical checks in the same working session. For
    the audit to mean anything, the null chain must PASS: no exchange flagged, ceiling equal to its
    stated conclusion, nearby-object control failing where it should. If the audit flags problems
    in a chain known to be sound, the audit procedure itself is too aggressive and every flag it raises
    on the target chain is void. A second null is the trivial chain of one link, which must produce
    an empty composition check.'
  independent_variables:
  - link index 1 through 4
  - composition index 1 through 3
  - chain (target versus null)
  - source of the link statement (KN-OPEN-027 versus KN-OPEN-028 plus evidence records)
  metrics:
    primary:
    - first flagged exchange composition index, or none
    - method ceiling under density equals 1, compared to the composed conclusion
    - nearby-object failure link index for plain LIP
    - null chain flag count
    secondary:
    - provisional (paraphrase-only) link count
    - disagreement count between the two independent re-statements
    - observation-collision result and the scope of the search that produced it
    - incoherence check result for the density-equals-one substitution
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'C, the ceiling verdict: whether the chain''s conclusion is restored when the failed
      density heuristic is replaced by density equals 1, with every other stated cost unchanged.'
    formula: 'C = RESTORED if, under the substitution density := 1, the composed conclusion of links
      1 to 4 is exactly the chain''s originally claimed conclusion using only costs already stated
      in committed records; C = SHORT if some other link still bounds the conclusion strictly away
      from it, in which case that link''s index is reported; C = INCOHERENT if density equals 1 contradicts
      a counting statement elsewhere in the chain. Predicted: C = RESTORED, confirming density as
      the binding link and confirming the recorded diagnosis. C = SHORT is the more valuable outcome
      and would relocate the route''s open question to the newly identified binding link.'
    source: Pre-registered in the parent proposal IDEA-20260816-955659 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'There is no scale parameter: the artifact is a logical trace over four links written
      from six committed files. The tier is toy because the chain is stated from this corpus''s second-hand
      records rather than from the source, and because provisional links are barred from carrying
      flags. The transfer assumption is stated explicitly and is not verified: that the links as relayed
      here have the same quantifier structure as the links as their authors state them. No extrapolation
      of any kind is performed.'
    correspondence: null
  tail_checks:
  - Check the case where a witness's dependency set is stated differently in the two independent re-statements,
    which is the most likely place a spurious flag originates.
  - Check whether density equals 1 makes any other stated quantity impossible (for instance a count
    that must be less than the pool size), and report incoherence rather than a ceiling.
  - Check the shortest composition (links 1 and 2 alone), where KN-OPEN-028's Q3 closure gives an
    independent expectation of soundness that the audit must reproduce.
  - Check whether the observation-collision search's scope is broad enough that a null result means
    anything, and report the scope with the result.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report the procedure as too aggressive if the null chain raises any flag.
  - Halt if more than one target link is provisional, since flags would then rest on paraphrase.
  - Halt and require independent re-derivation before reporting if a flag lands at composition index
    1 or 2, which would contradict a recorded closure.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run emits a complete quantifier trace for all four links with named witnesses
    and dependency sets, the three composition-check results, the ceiling verdict with its incoherence
    check, the nearby-object failure link, the observation-collision result with its search scope,
    the provisional and disagreement counts, and a null chain that raised zero flags.
  falsification_criterion:
  - The null chain raises any flag.
  - More than one target link is provisional.
  - The two independent re-statements disagree materially.
  - A flag lands at composition index 1 or 2, contradicting KN-OPEN-028's Q3 closure.
  - The nearby-object control shows the chain applying to plain LIP through link 1.
  - The density-equals-one substitution proves incoherent with another stated quantity, so no ceiling
    can be computed.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-955659
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The null chain must be approved by the Coordinator and must be of comparable link count and statement
    granularity; the proposed two-stage PIP structure from KN-TECH-081 has only two links and may
    be too easy a calibration.
  - Whether a link statable only from paraphrase may be traced at all, even as provisional, is a Coordinator
    decision; barring provisional links from carrying flags is proposed here but not settled.
  - The chain's originally claimed conclusion must be fixed precisely before the ceiling can be compared
    to it, and this corpus states it in summary form ('probabilistic polynomial time under four heuristics')
    rather than formally.
  - The audit's own output should be independently re-audited by a different session before anything
    is built on it; whether that second pass is required is a Coordinator decision.
