# EXP-DREG-2cfbfc
# Crater and floor invariant gates. No Macaulay matrix.
# Approved by DEC-20261002-5efbe8.
experiment:
  id: EXP-DREG-2cfbfc
  hypothesis_id: H-DREG-575e48
  source_idea: IDEA-20260922-1f9967
  question_id: RQ-DREG-c8ae8d
  version: 1
  title: Crater and floor invariant gates
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-5efbe8
  objective: >-
    Check the invariants of three short Weierstrass models and the
    factorial divisibility table for degrees 4, 5 and 6.
  inputs:
    A0: 0
    B0: 1
    A1728: 1
    B1728: 0
    A_floor: 1
    B_floor: 1
    num_floor: 6912
    den_floor: 31
    const_1728: 1728
    product_1728_times_31: 53568
    floor_residues:
      5: 2
      7: 1
      11: 9
      13: 7
    crater_1728_residues:
      5: 3
      7: 6
      11: 1
      13: 12
    char31_floor: singular
    fact4: 24
    fact5: 120
    fact6: 720
    five_divides_24: false
    five_divides_120: true
    five_divides_720: true
    seven_divides_24: false
    seven_divides_120: false
    seven_divides_720: false
    two_divides_all_three: true
    three_divides_all_three: true
  controls:
    - >-
      A floor invariant of 0 is the model (0, 1), not (1, 1). A
      floor invariant of 1728 is the model (1, 0). The model (1, 1)
      has invariant 6912/31. Reporting either crater value for the
      floor model invalidates the run.
    - >-
      6912 equals 1728 times 31 is false. The product is 53568.
      Reporting the floor invariant as the integer 1728 invalidates
      the run.
    - >-
      In characteristics 5, 7, 11 and 13 the floor residues are 2,
      1, 9 and 7. The reductions of 1728 are 3, 6, 1 and 12.
      Reporting a floor residue equal to the crater residue
      invalidates the run.
    - >-
      In characteristic 31 the floor denominator is 0. Reporting
      that model as smooth there invalidates the run.
    - >-
      Five divides 24 is false. Seven divides 24, 120 or 720 is
      false. Reporting either divisibility invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - prime
    - route in {residues, cross}
  metrics:
    primary:
      - floor_residues
      - char31_singular
      - five_misses_24
      - implementations_agree
    secondary:
      - seven_misses_all
      - product_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The floor residues and the factorial table.
    formula: >-
      The invariant is 1728 times 4 A cubed, divided by 4 A cubed
      plus 27 B squared. For (1, 1) the numerator is 6912 and the
      denominator is 31. Compare 6912 with 1728 times 31 by
      cross-multiplication. Reduce the same ratio modulo 5, 7, 11
      and 13. At 31 the denominator is 0. The factorials are 24,
      120 and 720, and divisibility is the remainder after division.
    source: >-
      IDEA-20260922-1f9967 names invariants 0 and 1728, degree at
      least 4, and an odd characteristic not dividing m factorial,
      read 2026-10-02. The residues were computed in this design
      session. That computation is not a run. No matrix was built.
  scale_relevance:
    tier: toy
    justification: Five primes and three factorials. No transfer to a fall profile.
    correspondence: null
  tail_checks:
    - The characteristic-31 row is required. Stopping at the four smooth residues and still reporting the floor model smooth is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the floor invariant is reported as 0 or as 1728, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The floor invariant is reported as 0 or as 1728.
    - 6912 is reported equal to 53568.
    - A floor residue is reported equal to the reduction of 1728.
    - The floor model is reported smooth in characteristic 31.
    - Five is reported as a divisor of 24.
    - Seven is reported as a divisor of 24, 120, or 720.
    - A Macaulay matrix or a fall profile is reported.
  success_criterion: >-
    Both runs agree that the floor invariant is 6912/31, that
    1728 times 31 is 53568, that the floor residues are 2, 1, 9
    and 7, that characteristic 31 makes the denominator vanish,
    that the factorials are 24, 120 and 720, that five does not
    divide 24, and that seven divides none of the three.
  falsification_criterion: >-
    The runs agree, the floor invariant stays unequal to 0 and to
    1728, and any residue differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-DREG-2cfbfc/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-2cfbfc/runs/<RUN-ID>/command.txt
    - experiments/EXP-DREG-2cfbfc/runs/<RUN-ID>/stdout.log
    - experiments/EXP-DREG-2cfbfc/runs/<RUN-ID>/stderr.log
    - experiments/EXP-DREG-2cfbfc/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-DREG-2cfbfc/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any Macaulay matrix, block rank, or fall-profile measurement.
    - Any claim that symmetry hides or does not hide an outlier.
    - Characteristic 2 and characteristic 3, where this invariant formula is not the one used here.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
