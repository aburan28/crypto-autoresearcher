    preregistered_prediction:
      quantity: Exactly four translations commute, and the gap is 288.
      formula: iota(P) is the negation of P+S. A translation by T commutes with iota when the two compositions agree
        on every rational point. The bound is 4 raised to m-1, times m!, at m = 3. The nearby integer uses the exponent
        m. Their difference is the gap.
      source: IDEA-20260920-0490f5 states the degree-2 bound 4^(m-1) m!, read 2026-10-02. The point count, the witness,
        and the gap were computed in this design session. That computation is not a run. No summation polynomial
        was built.
    success_criterion: Both runs agree that the curve has 12 points, that each listed center has commuting count
      4, that the witness sides are (7,1) and (7,10), and that 384 exceeds 96 by 288.
    falsification_criterion: The runs agree, the curve has 12 points, and the commuting count for S = (0,0) is not
      4.
