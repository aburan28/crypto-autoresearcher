experiment:
  id: EXP-CODESD-67614c
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-b3a6f0; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-b3a6f0
  question_id: RQ-SDITH-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Verification harness for zero-compute closed forms of worst-case and expected revealed-node
    counts in punctured complete trees at leaf counts 4 to 64, with an incomplete-tree nearby-object
    control and a random-antichain null.
  objective: 'The one uncertainty a run reduces is whether the two closed forms derived without compute
    are correct, and whether the derivation is actually sensitive to the hypothesis it claims to use.
    Concretely: (i) whether exhaustive enumeration over every hidden set at leaf counts 4 to 64 and
    hidden-set sizes 1 to 4 reproduces the worst-case closed form exactly at every cell, with any
    mismatch reported as a signed integer that localizes which term of the overlap correction is wrong;
    (ii) whether the same enumeration reproduces the expectation closed form exactly, computed as
    an exact rational mean rather than a float; (iii) whether the complete-tree formulas FAIL on a
    family of incomplete trees with matched leaf counts, and by how much, which is the method-ceiling
    and nearby-object audit demanded by inventor-protocol section 8, since a formula that returns
    a plausible answer for any tree has not identified the structure it claims to use. A run does
    not reduce uncertainty about any scheme''s size budget, about what any specification states, or
    about any security property. It converts a paper derivation into a checked forced value, or it
    refutes it, and both outcomes are cheap.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for complete binary
      and quaternary trees at the enumerated leaf counts and hidden-set sizes, under the declared
      puncturing rule and uniform hidden sets, the closed forms reproduced the exhaustive maximum
      and mean exactly (or failed by the reported signed amounts), and the same forms failed on the
      declared incomplete-tree family by the reported amounts. What does NOT follow: nothing about
      any scheme''s opening-size budget, which has not been read; nothing about non-uniform hidden
      sets; no security consequence of any kind; and no claim that the quantifier-order audit describes
      any real statement, since it is applied only to hypothetical forms of words.'
  inputs:
    procedure: 'STAGE 0 (cost: hours human, zero compute) derive both closed forms on paper and write
      them into a frozen fixture BEFORE any harness exists, with the derivation recorded in full so
      a reader can check it independently of the code. STAGE 1 (cost: minutes) implement the enumeration
      harness and the revealed-node counter; verify the counter by round-trip reconstruction of the
      derivable leaf set at L equal to 8. STAGE 2 (cost: seconds) run the degenerate cells t equal
      to 1 and t equal to L; HALT if the general forms do not reproduce them. STAGE 3 (cost: minutes)
      run the full enumeration at L in {4, 8, 16, 32, 64} and t in {1, 2, 3, 4} for branching factors
      2 and 4, recording exhaustive maximum and exact rational mean per cell. STAGE 4 (cost: seconds)
      compare against the frozen closed forms and emit signed mismatches. STAGE 5 (cost: minutes)
      run NULL-INCOMPLETE-TREE across a swept imbalance and record the smallest imbalance at which
      each formula first fails. STAGE 6 (cost: seconds) run NULL-RANDOM-ANTICHAIN at matched cardinality.
      STAGE 7 (cost: minutes) emit the quantifier-order decision table with the measured gap attached
      to each of its four cells.'
    instrument: 'Python 3.11 standard library: itertools.combinations for hidden-set enumeration,
      fractions.Fraction for the exact rational mean, math.comb for the closed forms, random.Random
      with a declared seed for the random-antichain null. No numpy required, no Sage, no hash, no
      cryptographic library. Run through harness/runner.py with the frozen derivation fixture and
      the run records stored immutably under an experiments/EXP-* directory.'
    parameters: 'Leaf counts L in {4, 8, 16, 32, 64}; branching factor in {2, 4}; hidden-set size
      t in {1, 2, 3, 4} plus t equal to L as a degenerate cell; enumeration is complete at every cell
      since C(64,4) is 635376. Incomplete-tree family: trees with L leaves and leaf-depth spread in
      {1, 2, 3} levels, three shapes per spread, at L in {8, 16, 32}. Random-antichain null: 100000
      draws at each matched cardinality with a declared seed. Total enumerated cells: 5 leaf counts
      times 2 branching factors times 5 hidden-set sizes equals 50, plus 27 incomplete-tree configurations.'
  controls:
  - 'NULL-INCOMPLETE-TREE: the derivation must fail there by a computable amount.'
  - 'NULL-RANDOM-ANTICHAIN: generic antichain cardinality at matched size, confirming the derived
    counts are not generic.'
  - Exhaustive enumeration at L up to 64 as the verification harness for both closed forms.
  - t equal to 1, where the worst case and the expectation coincide exactly at the tree depth, a degenerate
    cell both forms must reproduce.
  - t equal to L, where the revealed count is exactly zero and both forms must vanish.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): NULL-INCOMPLETE-TREE: the identical derivation and the identical verification
    harness applied to a family of incomplete or unbalanced trees with the same leaf count, in the
    same invocation. The complete-tree closed forms must FAIL there by a computable amount. If they
    do not fail, the derivation is not using the completeness hypothesis and is returning a plausible
    number for any tree, which under inventor-protocol section 8 audit 4 means the load-bearing structure
    has not been identified and the forced value is not forced. A second null, NULL-RANDOM-ANTICHAIN,
    evaluates the size functional on a random antichain of the same cardinality with no hidden set
    behind it, confirming that the derived counts are not simply the generic antichain size.'
  independent_variables:
  - leaf count L
  - branching factor
  - hidden-set size t
  - tree completeness (complete versus incomplete with declared leaf-depth spread)
  - arm identity (derivation check, incomplete null, random-antichain null)
  metrics:
    primary:
    - signed mismatch between the worst-case closed form and the exhaustive maximum, per cell
    - signed mismatch between the expectation closed form and the exact rational mean, per cell
    - worst case minus expectation, per cell
    - failure magnitude of the complete-tree formulas on each incomplete-tree configuration
    secondary:
    - smallest leaf-depth spread at which each formula first fails
    - random-antichain cardinality distribution at matched size
    - round-trip reconstruction failures, required zero
    - enumerated hidden-set count per cell
    - wall-clock seconds per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The gap G(L, t) = worst_case(L, t) minus expectation(L, t) in revealed nodes, and the
      signed mismatch M(L, t) between each closed form and its exhaustive counterpart.
    formula: M(L, t) is predicted to be exactly 0 at every enumerated cell for both forms. G(L, t)
      is predicted to be strictly positive for every t at least 2 and L at least 4, and at least 1
      revealed node at L equal to 256, t equal to 4, extended there by the closed forms rather than
      by enumeration and labelled as such. Nonzero M anywhere refutes the corresponding closed form
      and its sign localizes the error; G equal to 0 anywhere with t at least 2 removes the quantity
      the quantifier-order audit measures.
    source: Pre-registered in the parent proposal IDEA-20260816-b3a6f0 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Enumeration is performed at leaf counts up to 64 and hidden-set sizes up to 4,
      chosen so that every cell is complete and no sampling occurs anywhere. The closed forms themselves
      are exact at every (L, t) and are evaluated at larger L for reporting, but those rows are labelled
      closed-form-only and carry no enumeration support. The transfer assumption is explicit and narrow:
      the forms hold for complete regular trees under the declared rule, and the incomplete-tree control
      exists precisely to show where they stop holding, so the scope boundary is measured rather than
      asserted.'
    correspondence: null
  tail_checks:
  - 't equal to 1: worst case and expectation must both equal the tree depth exactly, and their gap
    must be zero.'
  - 't equal to L: revealed count must be exactly zero under both forms and under enumeration.'
  - 't equal to L divided by 2: the regime where the overlap correction becomes active; verify the
    correction''s stated validity boundary is respected and that enumeration confirms it.'
  - 'Non-power-of-two t, specifically t equal to 3: verify the maximal-spread configuration used in
    the worst-case argument actually exists there.'
  - 'Branching factor 4 at matched L: the depth changes and both forms must track it; a form that
    only works at branching factor 2 is reported as such.'
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt if round-trip reconstruction fails at any cell.
  - Halt if the degenerate cells t equal to 1 or t equal to L are not reproduced by the general forms.
  - Halt and report immediately if a signed mismatch appears, since a refuted closed form makes the
    remaining sweep uninformative until the derivation is corrected in a superseding record.
  - Stop the incomplete-tree sweep once the smallest failing imbalance is located at each L, since
    larger imbalances add nothing.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both closed forms reproduce the exhaustive maximum and the exact rational mean
    with signed mismatch exactly zero at all 50 enumerated cells, the degenerate cells pass, the incomplete-tree
    null shows the formulas failing with a located smallest failing imbalance, and the quantifier-order
    decision table is emitted with the measured gap attached to each cell.
  falsification_criterion:
  - Nonzero signed mismatch for the worst-case form at any cell.
  - Nonzero signed mismatch for the expectation form at any cell.
  - Gap G equal to zero at any cell with t at least 2 and L at least 4.
  - The complete-tree formulas remaining correct on every incomplete-tree configuration, showing the
    derivation is insensitive to its own hypothesis.
  - The random-antichain null reproducing the derived counts, showing they are generic.
  - Round-trip reconstruction failure, voiding the revealed-node counter.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-b3a6f0
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must fix the puncturing rule before the derivation is frozen, since a different
    reveal rule changes both closed forms and no specification is available to fix it from.
  - Whether the two readings in the quantifier-order audit exhaust the intended cases, or whether
    a third reading, such as a budget enforced with a rejection-and-retry loop, must be added before
    the decision table is meaningful.
  - Whether closed-form-only rows at L beyond the enumerated range should be emitted at all, given
    they carry no verification support.
