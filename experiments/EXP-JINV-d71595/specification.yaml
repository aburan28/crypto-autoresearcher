experiment:
  id: EXP-JINV-d71595
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-94f953
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: At small |D_0| the isogeny crater has exactly h(D_0) vertices, so for the nine class-number-one
    discriminants it is a SINGLE curve whose address is free - which simultaneously abolishes the
    hard half of the T5 reachability gate and empties the space it was meant to search; the surviving
    research object is not the crater but the DESCENDING direction, where a j=0 curve sits at the
    surface with about p^{1/2} isogenous curves below it and the cheaply reachable subfamily is exactly
    the smooth part of the conductor f, governed by a named Dickman-de Bruijn heuristic
  status: draft
  objective: "(A) THE CARDINALITY FACT, AND THE DICHOTOMY IT FORCES. For an ordinary isogeny class\
    \ over F_p with fundamental discriminant D_0, the set of curves whose endomorphism ring is the\
    \ MAXIMAL order O_K - the crater, i.e. the surface of every ell-volcano - is a principal homogeneous\
    \ space under Cl(O_K), hence has exactly h(D_0) elements up to F_p-isomorphism. Therefore:\n \
    \ h(D_0) = 1  ==>  the crater is a SINGLE curve.\n  D_0 = -3    ==>  that curve is j = 0. D_0\
    \ = -4 ==> it is j = 1728.\nDECOMPOSITION.md's T5 states the campaign's central dichotomy: a random\
    \ curve in the class is cheap to reach but a SPECIFIED one is the CSIDH vectorisation problem\
    \ at about sqrt(h) ~ p^{1/4} classically. Both halves of that sentence are statements about h.\
    \ At h = 1 the vectorisation problem is VACUOUS - there is one target and you are either on it\
    \ or you are not, and the Hilbert class polynomial hands you its j-invariant for free. THE HARD\
    \ HALF OF T5 DISAPPEARS EXACTLY WHEN THE SEARCH SPACE DOES. That is the named obstruction and\
    \ it is a conservation law, not an accident: |crater| = h, and h measures both the freedom to\
    \ optimise and the difficulty of exploiting it. You cannot buy one without the other, and this\
    \ is why \"find a better curve at the surface\" cannot be a mechanism at small |D_0|.\n(B) WHAT\
    \ THIS CLOSES, PRECISELY. Every L3 mechanism of the form \"walk horizontally to a better curve\
    \ in the class\" is closed at small |D_0| by cardinality, with no experiment required: there is\
    \ nowhere to walk. Combined with T4 - j = 0 requires D_0 = -3, and D_0 is an isogeny-class invariant,\
    \ so no curve outside such a class can be walked into one - the horizontal direction contributes\
    \ exactly nothing to this lane. This is a genuine closure at the docs/inventor-protocol.md section\
    \ 4 standard: named obstruction (|crater| = h(D_0) = 1), argument (the Cl(O_K)-torsor structure),\
    \ and forward guidance (below).\n(C) WHAT IT LEAVES OPEN, AND IT IS THE INTERESTING PART. The\
    \ crater is one vertex but the CLASS is not. With D = t^2 - 4p = D_0 f^2, the total number of\
    \ curves in the class is h(Z[pi]), which for h(D_0) = 1 is approximately f * product over ell\
    \ | f of (1 - (D_0/ell)/ell), and f = sqrt((4p - t^2)/|D_0|) is of order p^{1/2}. SO A j=0 CURVE\
    \ SITS AT THE TOP OF A STRUCTURE CONTAINING ABOUT p^{1/2} ISOGENOUS CURVES, EVERY ONE OF WHICH\
    \ CARRIES THE SAME DISCRETE LOGARITHM k BY T1. The curve is not impoverished; it is maximally\
    \ positioned. Descending is the direction with room in it. THE COST OF DESCENDING IS THE WHOLE\
    \ QUESTION, AND IT IS ANSWERABLE. A descending ell-isogeny requires ell | f and costs Otilde(ell)\
    \ by standard isogeny computation (or Otilde(ell^2) if the modular polynomial is built). So the\
    \ CHEAPLY REACHABLE subfamily from j = 0 is generated by the SMALL prime factors of f: its size\
    \ is the B-smooth part of f for a cost budget corresponding to B. That is a smoothness question\
    \ about a specific integer, it has a classical governing distribution, and it is exactly the kind\
    \ of quantity the target-result profile asks to be stated as a numbered heuristic with a validation\
    \ route rather than assumed.\n(D) THE TWO OUTCOMES OF THE MEASURABLE PART, FIXED IN ADVANCE. The\
    \ measurable part is: at toy scale, enumerate a whole isogeny class with D_0 = -3, locate the\
    \ surface (j = 0), and evaluate every cost functional the campaign measures on every curve in\
    \ the class, stratified by volcano level.\n  O1 EVERY FUNCTIONAL IS CONSTANT ON THE CLASS. Then\
    \ the descending\n    direction is worthless too, L1's predicted invariance is confirmed on the\n\
    \    one family where the surface is canonically identified, and L3's isogeny\n    half is closed\
    \ entirely. PREDICTED, per DECOMPOSITION.md section 5\n    prediction 1 and 2.\n  O2 SOME FUNCTIONAL\
    \ VARIES WITH LEVEL. Then the campaign has a target and\n    the question becomes precisely the\
    \ smoothness question in (C): how much\n    of the class is reachable within budget from the free\
    \ surface address.\n    This is the branch where heuristic H1 below becomes load-bearing, and\
    \ it\n    is the branch worth pre-registering the heuristic for.\n\n(E) WHAT IS CLAIMED BEYOND\
    \ THE sqrt(|Aut|) CONSTANT: NOTHING TODAY. Under O1 nothing is claimed at all. Under O2 the claim\
    \ would be a constant-factor change in a cost functional plus a reachability cost, and it would\
    \ have to be charged in full against rho before it meant anything. No exponent is claimed and\
    \ the record does not license one."
  resource_label: R3 and R4 - End(E) as a ring (the order, the conductor, the class number) and the
    isogeny graph / class-group action on curves. Neither is a group-operation output.
  admissibility: admissible
  admissibility_argument: 'The resources are the endomorphism ring''s ideal-class structure and the
    isogeny graph, both of which act on CURVES rather than on points of G (DECOMPOSITION.md section
    2, R3 and R4). H-ENDO-001''s scalar-action argument does not apply because nothing here applies
    an endomorphism to a point of G; the objects are the crater''s cardinality and the conductor''s
    factorisation. KN-FIND-b7e091''s GGM closure does not apply because a generic group oracle returns
    no information about the isogeny class at all. Admissible. ONE HONEST QUALIFICATION: by T1 the
    transported instance has the SAME k, so the resource can only ever change the COST FUNCTIONAL,
    never the answer. That is why outcome O1 - constancy of every functional - would close the lane''s
    isogeny half despite the resource being admissible. Admissibility buys the right to run the experiment,
    not a presumption that it will find anything.'
  reachability_gate: "THIS PROPOSAL IS THE LANE'S REACHABILITY-GATE ANALYSIS AND IT ANSWERS T5 IN\
    \ THREE PARTS. (i) HORIZONTAL, WITHIN THE CRATER: at h(D_0) = 1 there is one vertex. Cost to\n\
    \  reach the best crater curve: ZERO if you are on it (a j = 0 curve is on it\n  by definition,\
    \ since End = O_{-3} is maximal), and there is no other. T5's\n  p^{1/4} vectorisation obstruction\
    \ is ABSENT - and so is the payoff. This\n  half is closed.\n(ii) VERTICAL, DESCENDING FROM THE\
    \ SURFACE: about p^{1/2} curves are below,\n  every one carrying the same k by T1. Cost to reach\
    \ a curve at depth\n  (v_ell): sum over ell of v_ell steps, each Otilde(ell). The CHEAPLY\n  reachable\
    \ subfamily is the B-smooth part of f for the affordable B, and\n  its expected size is governed\
    \ by heuristic H1. This half is OPEN and its\n  budget is measurable at crypto scale by Step 5\
    \ without any curve\n  computation.\n(iii) VERTICAL, ASCENDING TO THE SURFACE from a non-surface\
    \ curve: requires\n  ell-isogenies for the ell dividing the curve's own conductor, with the\n\
    \  same Otilde(ell_max) obstruction, and is the direction a defender's curve\n  would have to\
    \ be pushed along. Not needed for a j = 0 curve, which is\n  already at the top - which is the\
    \ sense in which j = 0 is the MOST\n  structurally favourable position in its class, and the sense\
    \ in which that\n  favourable position is worth exactly nothing unless outcome O2 fires.\nT4 remains\
    \ binding over all three: no curve outside a D_0 = -3 class reaches any of this at any price."
  inputs:
    procedure: 'CHEAPEST VALID DISCRIMINATOR, AND IT COSTS NO COMPUTE: STEP 1. The cardinality argument
      settles the horizontal half of the lane outright - at h(D_0) = 1 there is exactly one curve
      at the surface, so there is nothing to optimise over and nothing to walk to, and the CSIDH-style
      p^{1/4} obstruction is simultaneously absent and irrelevant. Recording that conservation law
      is the deliverable and it requires an argument, not an experiment. THE CHEAPEST EMPIRICAL DISCRIMINATOR
      IS STEP 5, WHICH RUNS AT CRYPTO SCALE AND NEEDS NO CURVES: sample 10^5 conductors from 4p =
      t^2 + 3f^2 at 256 bits and fit their smoothness against Dickman. That single distribution decides
      whether the descending direction is cheap enough to matter, before any isogeny is computed and
      independently of whether O1 or O2 holds - and if H1 fails, the entire reachability half of the
      lane is re-based before any toy enumeration is paid for. Steps 2-4 are the expensive part and
      are worth running only because L1 needs them anyway and this is L1''s most informative stratum.'
    mechanism: 'STEP 1 (zero compute). Write out the cardinality argument in (A) and the conservation
      law it forces, and record the two corollaries: (i) at h = 1 the horizontal direction is empty,
      (ii) at h = 1 the surface address is free. Both are consequences of the Cl(O_K)-torsor structure
      and neither needs an experiment.

      STEP 2 (toy enumeration, moderate compute - THE MAIN EXPERIMENT). Choose toy primes p congruent
      to 1 mod 3 with 4p = t^2 + 3f^2 for a conductor f having at least two distinct small prime factors,
      so that the volcano has genuine depth in more than one direction. Enumerate the ENTIRE isogeny
      class: start at j = 0, walk all ell-isogenies for every ell | f, and label every curve with
      its full level vector (v_ell)_{ell | f}. Verify the class size against h(Z[pi]) computed independently
      from the order''s class number. Verify T1 directly: transport (P,Q) along each isogeny and check
      that k is unchanged by recomputing it - which also gives a certificate for every transport.

      STEP 3 (the functional sweep). On every curve in the class, at matched factor-base size and
      matched targets, measure: Groebner solving proxies from harness/semaev.py, relation yield, decomposition
      probability, rho step count and rho multiplication count. Stratify by level vector. Report within-class
      variance against between-class variance (different p, different t) and against the matched-null
      battery of IDEA-20260807-a3d644.

      STEP 4 (the level-zero question that only this family can ask). Because the surface is CANONICALLY
      j = 0, one specific comparison becomes available that no general isogeny class permits: is the
      surface curve distinguished from the rest of ITS OWN CLASS by any functional, beyond the automorphism
      effect? Run every functional on j = 0 with phi WITHHELD (the NULL-3 arm of IDEA-20260807-a3d644)
      against the depth-1 curves. Any surviving difference is a level effect and not an automorphism
      effect, and that separation is only possible here.

      STEP 5 (the conductor smoothness measurement, which is the crypto-scale half and needs no curve
      at all). For many primes p at crypto-relevant sizes admitting 4p = t^2 + 3f^2, compute f and
      measure the distribution of its largest prime factor and of its B-smooth part for a ladder of
      B. Compare against the Dickman-de Bruijn prediction (heuristic H1 below). THIS IS THE ONE PART
      OF THIS PROPOSAL THAT CAN BE RUN AT CRYPTOGRAPHIC PARAMETER SIZES, because it is integer arithmetic
      on f and needs no isogeny computation, and it is therefore the part that would carry any O2
      finding beyond toy scale.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - large-h class at matched p (N1)
  - random level relabelling (N2)
  - phi-withheld surface arm (N3)
  - T1 transport certificate on every isogeny edge
  - independently computed h(Z[pi]) against the enumeration
  - matched rho and matched BSGS on a sample of curves at each level
  - the matched-null battery of IDEA-20260807-a3d644, including the sixth-power representation gate,
    run before any functional is reported
  - "NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. N1 A LARGE-h CLASS AT MATCHED p. Enumerate\
    \ a class with a generic D_0 (large\n  h) at the same prime and run the identical functional sweep.\
    \ This is the\n  only comparison that separates \"small |D_0|\" from \"we enumerated a class\"\
    .\n  If the within-class variance profile is the same in both, the small-|D_0|\n  framing adds\
    \ nothing and must be dropped.\nN2 RANDOM-RELABELLING NULL: permute the level labels among the\
    \ curves of the\n  class at random and rerun the stratified analysis. Any \"level effect\" that\n\
    \  survives a random relabelling is an artifact of the analysis, not of the\n  volcano. This is\
    \ the sharpest control in the proposal because a stratified\n  analysis over a small class is\
    \ exactly where spurious structure appears.\nN3 THE PHI-WITHHELD SURFACE ARM (Step 4), which separates\
    \ the level effect\n  from the automorphism effect at j = 0.\nDECAY PARAMETER: the LEVEL ITSELF,\
    \ and this is the canonical docs/inventor-protocol.md section 3 test for this lane. Any functional\
    \ difference attributed to being at the surface must DECAY MONOTONICALLY with depth. A difference\
    \ that is the same at depth 1, 2 and 3 is not a level effect - it is a difference between j =\
    \ 0 and everything else, i.e. an automorphism or a coefficient artifact, and N3 will say which.\
    \ SECOND DECAY PARAMETER: the class size. Any variance signal must shrink relative to the null\
    \ as the class grows, because a larger class gives the null more room; a signal that does not\
    \ is a small-sample artifact."
  independent_variables: []
  metrics:
    primary:
    - class size, crater size, and the full level lattice
    - per curve: j, (a,b), level vector, every cost functional, seeds
    - within-class and between-class variance per functional, with intervals
    - level multiplicities alongside every stratified statistic
    secondary:
    - transport certificate pass rate (must be 100 percent)
    - conductor smoothness distribution versus rho(u), with tail table
    - largest-prime-factor statistic versus the Golomb-Dickman constant
    - H2 mixing test results at toy scale, labelled toy scale
  heuristic_under_test: null
  preregistered_prediction:
    quantity: number of curves with maximal endomorphism ring in a D_0 = -3 toy class
    formula: Exactly 1, and its j-invariant exactly 0, on every enumerated class. Any other count
      refutes the cardinality argument or the enumeration.
    source: pre-registered in IDEA-20260807-94f953 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - SMALL CLASSES GIVE SPURIOUS STRATIFICATION. A class of 20 curves split across 4 levels has 5 curves
    per stratum; almost any functional will look stratified. N2's random relabelling is the only defence
    and it is blocking.
  - j = 0 IS BOTH THE SURFACE AND THE AUTOMORPHISM-RICH CURVE. Every surface-versus-depth comparison
    is confounded by |Aut| = 6 unless phi is withheld. N3 exists for exactly this and no surface claim
    may be made without it.
  - TWIST SELECTION. Which sextic twist is used determines the trace and hence the class; comparing
    across twists compares different classes. Recorded per instance.
  - THE CONDUCTOR IS NOT A FREE INTEGER. f is a value of a quadratic form and its small-prime divisibility
    is correlated with splitting in Q(sqrt(-3)). H1 could be biased for exactly this reason and the
    validation is designed to see it; assuming H1 without the validation would be the classic smoothness-heuristic
    error.
  - OUTCOME O1 IS NOT A PROOF OF INVARIANCE. Constancy on toy classes at p <= 2^24 does not establish
    constancy at crypto scale, and the record must say so wherever O1 is reported.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Exactly 1, and its j-invariant exactly 0, on every enumerated class. Any other
    count refutes the cardinality argument or the enumeration.
  falsification_criterion:
  - More than one curve with maximal endomorphism ring is found in an h(D_0) = 1 class. The cardinality
    argument or the level detection is wrong; halt.
  - Enumerated class size disagrees with h(Z[pi]). The enumeration is incomplete and no variance statement
    is admissible.
  - A T1 transport changes k. T1 is elementary and this would be an implementation error; every number
    in the run set is void.
  - 'Within-class variance exceeds between-instance variance AND survives the random-relabelling null.
    Outcome O2: the lane has a target and the reachability question in (C) becomes load-bearing. Requires
    independent replication before interpretation.'
  - H1 fails against Dickman at 3 standard errors. The descent budget is mis-modelled and every reachability
    statement is withdrawn until it is re-based on the measured distribution - which would itself
    be a reportable finding about conductors of CM primes.
  - Class enumeration exceeds budget at the largest declared p. INFRASTRUCTURE outcome under AGENTS.md
    rule 5; the toy ceiling is lowered and recorded, and nothing is inferred about variance.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-94f953
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
