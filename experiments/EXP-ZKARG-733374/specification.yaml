experiment:
  id: EXP-ZKARG-733374
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-8e6e96; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-8e6e96
  question_id: RQ-WFS-e776b6
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Enumerate the full input domain of a tiny-field algebraic sponge challenge sampler and measure
    exact deviation from uniform as a function of permutation round count, against random-function
    and one-round nulls
  objective: 'The one uncertainty a run reduces: how far the challenge distribution produced by an
    arithmetization-friendly permutation in sponge mode departs from the uniformity that soundness
    accounting assumes, at parameters where the departure can be counted rather than estimated. Specifically
    (i) it computes the exact integer count vector of the challenge map over the entire input domain
    at every round count in a swept range, so total variation distance, max-mass excess and unreached-challenge
    counts are exact rather than sampled; (ii) it establishes the correct reference by running a uniformly
    random function over the same domain through the identical functionals, so the flattening level
    of the decay curve is compared against the random-function floor rather than against zero, which
    is the single most likely way to manufacture a false signal here; (iii) it converts the measured
    mass vector into a soundness bit discrepancy using a greedy-adversary functional at named attainable-set
    sizes and reports the round count at which that discrepancy falls below a named threshold, so
    the deliverable is a round number at named parameters rather than a qualitative statement. The
    run performs no cryptanalysis, claims no distinguisher, and examines no primitive outside the
    one written for this contract.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the named Poseidon-shaped
      permutation over the named tiny prime with the named width, S-box exponent, matrix and seeded
      constants, in rate-one single-squeeze sponge mode, the exact challenge-mass deviations at each
      round count are the tabulated values, their decay flattens at the measured level relative to
      the random-function floor, and the derived bit discrepancy crosses the named threshold at the
      reported round count. What does NOT follow: anything about full-size instances of any permutation,
      since the random-function floor at cryptographic field size is smaller by many orders of magnitude;
      anything about round counts chosen for deployment; any algebraic weakness, distinguisher or
      attack; anything about any deployed, third-party or standardized primitive or proof system;
      and no security consequence of any kind.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes) Freeze p, width, S-box exponent with its coprimality check,
      both MDS-style matrices with their branch-number checks, both round-constant seeds, the round-count
      range, and the attainable-set sizes for the conversion. STAGE 1 (cost: seconds) Run the identity
      and constant-map controls through the deviation functionals and require exactly zero and the
      maximal value. STAGE 2 (cost: minutes) For each matrix, each seed and each round count, enumerate
      all p inputs and accumulate the exact count vector. STAGE 3 (cost: seconds) Compute exact total
      variation distance, max-mass excess, unreached count and collision probability from each vector
      in exact rational arithmetic. STAGE 4 (cost: minutes) Run the random-function null and the one-round
      null through the identical functionals in the same invocation, with the null repeated over 32
      seeds to give its sampling interval. STAGE 5 (cost: seconds) Apply the greedy-adversary conversion
      at each d and report the bit discrepancy and the crossing round count. STAGE 6 (cost: equal
      to stages 2 to 5) Replay from the declared seeds and require identical count vectors before
      the run record is written.'
    instrument: Python 3, no Sage. A self-contained F_p module on Python integers implementing the
      S-box, the linear layer and the round-constant schedule; the sponge written directly with rate
      one and capacity width minus one; exact counting into a Python integer array and exact rational
      deviation via the fractions module, with decimal used only for final printing; the random-function
      null drawn with the standard library random module from declared seeds. Execution is wrapped
      by harness/runner.py so commit, environment, timing, resources and seeds are captured and the
      run record is immutable, and each count vector's checksum is emitted as a certificate the wrapper
      recomputes independently.
    parameters: Prime p equal to 65537, with a secondary cell at p equal to 1048583 if wall time permits.
      State width t equal to 3, capacity 2, rate 1, one squeezed element. S-box exponent alpha equal
      to 3, verified coprime to p minus one. Two MDS-style 3 by 3 matrices, each with all minors verified
      nonzero. Two round-constant seeds. Round counts r from 1 to 16 inclusive. Attainable-set sizes
      d in {1, 4, 16} for the soundness conversion. Random-function null repeated over 32 independent
      seeds to give a sampling interval. Total permutation evaluations at most 2 times 2 times 16
      times 65537, about 4.2e6, each costing O(r times t squared) field operations.
  controls:
  - Uniformly random function null on the same domain through the identical functionals in the same
    invocation.
  - One-round permutation null, required to sit far above the floor.
  - Identity permutation control, where the challenge map is the identity and the count vector is
    exactly flat, giving total variation distance exactly zero.
  - Constant-map control, where every input maps to one challenge, giving the maximal possible deviation,
    confirming the functional spans its range.
  - Two distinct round-constant seeds so that the decay curve is not a property of one constant schedule.
  - Two distinct MDS-style matrices so that the decay is not an artifact of one linear layer.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): NULL OBJECT: a uniformly random function from F_p to F_p, realised
    by drawing p independent uniform outputs from a declared seed, pushed through the identical count-vector
    computation and the identical deviation functionals in the same invocation. The null establishes
    the FLOOR: a random function is not uniform either, and its expected total variation distance
    from flat is a known positive quantity of order the square root of one over p. For the signal
    arm to mean anything the round-swept deviation must decay toward the null''s level and not below
    it; a permutation that measured below the random-function floor would be more uniform than random,
    which is itself a structural tell and would indicate the enumeration is wrong. A second null is
    a one-round permutation, which must sit far above the floor, confirming the instrument can see
    non-uniformity when it is present.'
  independent_variables:
  - permutation round count r
  - MDS-style matrix choice
  - round-constant seed
  - prime p
  - attainable-set size d for the soundness conversion
  metrics:
    primary:
    - exact total variation distance from uniform per round count
    - exact max-mass excess per round count
    - derived soundness bit discrepancy per (r, d)
    - random-function null total variation distance with 32-seed interval
    - crossing round count at which the bit discrepancy falls below the named threshold
    secondary:
    - number of unreached challenges per round count
    - exact collision probability of the challenge map
    - one-round null deviation
    - wall time and peak memory per cell
    - count-vector checksums
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The exact total variation distance between the induced challenge distribution and uniform,
      as a function of permutation round count, and the round count at which the derived greedy-adversary
      bit discrepancy first falls below 2 to the minus 10 bits.
    formula: 'For count vector c over p challenges with domain size p, total variation distance TV(r)
      equals one half times the sum over challenges of the absolute value of c[j]/p minus 1/p. Pre-registered
      reference: for a uniformly random function on p points the expected TV is asymptotically the
      square root of 1 over (2 pi) times the square root of 1 over p, approximately 0.3989 divided
      by the square root of p, which at p equal to 65537 is about 0.00156. Pre-registered law: TV(r)
      is non-increasing in r and converges to that reference, not to zero. The derived bit discrepancy
      is t times (log2 of the greedy sum of the d largest masses minus log2 of d/p), the same functional
      used by the reduction-bias record in this set, evaluated at t equal to 1.'
    source: Pre-registered in the parent proposal IDEA-20260816-8e6e96 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at p equal to 65537 with width 3 and rate 1, chosen because the entire
      input domain is enumerable there, which is the only way the deviation is exact rather than estimated.
      The transfer assumption is stated and explicitly expected to fail in the direction of irrelevance:
      at cryptographic field size the random-function floor shrinks as one over the square root of
      p, so a decay curve measured here says nothing quantitative about full-size parameters, and
      the record claims only the shape of the decay and the instrument, not a transferable number.
      A secondary cell at p equal to 1048583 gives a two-point check on whether the floor scales as
      predicted.'
    correspondence: null
  tail_checks:
  - Report the single most over-represented challenge at each round count and confirm its excess is
    consistent with the random-function tail rather than with a structural bias.
  - Report the number of unreached challenges and compare against the expected fraction one over e
    for a random function, since a large deviation there is the clearest structural tell.
  - Inspect r equal to 1 and r equal to 2 separately, since those are where dynamic range exists and
    averaging across the sweep would hide it.
  - Report the maximum over the 32 null seeds of the null TV, to confirm the signal arm's flattened
    level is not merely inside the null's tail.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt if the identity or constant-map control fails, or if the signal arm measures below the random-function
    floor.
  - Stop the round sweep two rounds after TV first enters the null interval, since further rounds
    carry no information.
  - Cap total wall time at three hours; truncation reduces the round range or drops the secondary
    prime and is recorded as a budget outcome, never as evidence about the permutation.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run succeeds if both degenerate controls pass, exact count vectors and deviations
    are produced for every (matrix, seed, round count) cell, the random-function null interval is
    established over 32 seeds, and the decay curve with its flattening level and the derived crossing
    round count are reported, whether or not the curve shows any dynamic range.
  falsification_criterion:
  - Identity or constant-map control fails.
  - The signal arm measures below the random-function floor at any round count.
  - TV does not decay with round count, marking the measurement an artifact under inventor-protocol
    section 3.
  - TV is inside the null interval already at r equal to 1, falsifying the premise that the instrument
    has resolution at this p and closing with the required larger p named.
  - The decay curve differs materially between matrices or between constant seeds.
  - Replay from declared seeds does not reproduce the count vectors exactly.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-8e6e96
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The scaled-down permutation is a construction choice, not a derivation; the Coordinator must rule
    on whether a tiny-field Poseidon-shaped object is defensible as an instrument or whether the record
    should be scoped to a generic algebraic sponge with declared components.
  - The branch-number condition on the MDS-style matrix over a tiny field needs an explicit criterion,
    since the standard condition is stated for larger fields.
  - Whether the threshold of 2 to the minus 10 bits for the crossing round count is the right reference,
    or whether the crossing should be defined relative to the null interval instead.
  - Whether the secondary prime p equal to 1048583 is sufficient to check the one-over-square-root-of-p
    scaling of the floor, or whether a third point is needed for that remark to be made at all.
