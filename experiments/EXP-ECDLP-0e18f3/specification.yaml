# EXP-ECDLP-0e18f3
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-86ad6a.
experiment:
  id: EXP-ECDLP-0e18f3
  hypothesis_id: H-ECDLP-fe8ec0
  source_idea: IDEA-20261004-84f1aa
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-12 table versus width-11 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-86ad6a
  objective: >-
    Check the table sizes 2048 and 1024, the product 2097152, and the nearby gap 0.
  inputs:
    width_hi: 12
    width_lo: 11
    table_hi: 2048
    table_lo: 1024
    table_gap: 1024
    table_product: 2097152
    table_sum: 3072
    nearby_a: 1024
    nearby_b: 1024
    nearby_gap: 0
    nearby_product: 1048576
  controls:
    - >-
      Two to the power 11 is 2048. Two to the power 10 is 1024.
      Reporting both tables as size 1024 drops the gap and invalidates
      the run.
    - >-
      Two thousand forty-eight exceeds one thousand twenty-four by 1024.
      The product of the two sizes is 2097152. Their sum is 3072.
    - >-
      Two width-11 tables each store 1024. Their gap is 0 and their
      product is 1048576.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-12 table stores 2048 entries. The width-11 table stores
      1024. The gap of two width-11 tables is 0.
    formula: >-
      Compute 2 to the power 11. Compute 2 to the power 10. Subtract
      1024 from 2048. Multiply 2048 by 1024. Subtract 1024 from 1024.
    source: >-
      IDEA-20261004-84f1aa states the widths 12 and 11 and the sizes
      2048 and 1024, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 2097152 and the nearby gap 0 are required. A check that stops at the size 2048 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 2048 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 11 is not 2048.
    - Two to the power 10 is not 1024.
    - The gap is not 1024.
    - The product is not 2097152.
    - Both tables are reported as size 1024, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-12 table stores 2048 entries, that
    the width-11 table stores 1024, and that 2048 exceeds 1024 by 1024.
  falsification_criterion: >-
    The runs agree that the width-12 table size is computed, and
    that size is not 2048.
  required_artifacts:
    - experiments/EXP-ECDLP-0e18f3/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-0e18f3/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-0e18f3/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-0e18f3/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-0e18f3/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-0e18f3/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 1024 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
