experiment:
  id: EXP-XEDN-050b8a
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-XEDN-754174
  question_id: RQ-XEDN-004
  goal_id: GOAL-XEDN-003
  title: >-
    Forced-value audit of the XEDN relation-coefficient metric: is
    max_|coeff| = 1 the only value the committed configurations could have
    produced?

  objective: >-
    Decide whether the value max_|coeff| = 1, reported on all fourteen
    Mordell-Weil relations committed by GOAL-XEDN-003, was free to be anything
    else. For each committed relation-bearing configuration, compute the exact
    canonical-height Gram matrix of its enumerated sections, evaluate the
    Hermite/Hadamard bound B = floor(( H * gamma_r / lambda_1^2 )^{r/2}) under
    a rule frozen before any evaluation, and report B against the committed
    observation. Run the identical statistic on a matched lattice null with no
    elliptic curve behind it, and on an affine-E_8 positive control whose
    forced value 6 is derived before the run.

  what_this_is_not:
    - >-
      Not a discrete-logarithm computation, not a relation-collection attack,
      not an ECDLP cost, runtime, asymptotic, exponent, cryptographic-scale, or
      deployed-scheme claim.
    - >-
      Not a claim that H-XEDN-005 is false. The experiment cannot decide the
      truth of the coefficient bound; it decides whether the executed
      measurement carried information about it.
    - >-
      Not a request for, or a performance of, any status change. No status of
      GOAL-XEDN-003, H-XEDN-005, DEC-20260730-001, DEC-20260730-002,
      EV-XEDN-005, EV-XEDN-006, KN-FIND-010 or KN-FIND-011 is altered, and only
      the Coordinator may alter one.
    - >-
      Not a new census. No new surface, no new prime, and no new enumeration in
      the deg b = 10 family is performed; every curve-side input is a committed
      artifact already on disk.
    - >-
      Not approval, freezing, execution authorization, a run, an observed
      output, or evidence.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      That on the fourteen committed configurations of EXP-XEDN-006 and
      EXP-XEDN-007 -- deg a <= 2, deg b = 10, j non-constant, free-x
      deg x <= 3 / deg y <= 5, p in {7,13,19,31}, configuration sizes 3 to 6 --
      the reported coefficient equalled the maximum its own configuration
      geometry permitted, and that a matched lattice null with no elliptic
      curve reproduces the same value at the same rate. Nothing above that
      tier, nothing about larger configurations, nothing about other primes,
      nothing about the ECDLP.
    tier_justification: >-
      Every curve-side input is a toy-scale committed artifact at p <= 31.
      Toy-scale evidence is never crypto-scale evidence (AGENTS.md rule 7), and
      no citation of this contract may raise the tier.

  inputs:
    committed_artifacts:
      - experiments/EXP-XEDN-006/runs/RUN-XEDN-006-MAIN/raw-result.json
      - experiments/EXP-XEDN-006/runs/RUN-XEDN-006-CTRL/raw-result.json
      - experiments/EXP-XEDN-007/runs/RUN-XEDN-007-MAIN/raw-result.json
      - experiments/EXP-XEDN-007/runs/RUN-XEDN-007-CTRL/raw-result.json
      - experiments/EXP-XEDN-007/implementation/run_census.sage
      - experiments/EXP-XEDN-001/xedni_sections.py
    artifact_binding: >-
      Record the SHA-256 of each of the six files above at run start and again
      at run end. A change in any digest during the run invalidates the run.
      Every quantity attributed to the archive is re-extracted from these files
      at stage 0 and no number quoted in H-XEDN-754174 is used until it has
      been re-extracted.
    primes: [7, 13, 19, 31]
    family: "y^2 = x^3 + a(t)x + b(t) over F_p(t), a != 0, deg a <= 2, deg b = 10, j non-constant"
    section_window: "deg x <= 3, deg y <= 5, one representative per {P,-P}"
    synthetic_null_parameters:
      ranks: [2, 3, 4, 5, 6, 7, 8]
      configuration_sizes: [3, 4, 5, 6, 7, 8, 9]
      injected_spreads: [1.0, 1.5, 2.0, 3.0]
      lattices_per_cell: 500
    hermite_constants:
      primary: "recalled: gamma_1..gamma_8 = 1, 2/sqrt(3), 2^(1/3), sqrt(2), 8^(1/5), (64/3)^(1/6), 64^(1/7), 2"
      sensitivity_arm: >-
        certified lower bounds obtained by exhibiting A_2, A_3, D_4, D_5, E_6,
        E_7, E_8 and computing minimum and determinant in exact integer
        arithmetic. The recalled values are the CONSERVATIVE choice for this
        hypothesis (larger gamma_r gives a larger bound B, making B = 1 harder
        to achieve), so the recalled arm is primary and the certified arm is
        reported as a sensitivity, never as the headline.
    master_seed: 754174
    seed_derivation_rule: >-
      For a stream labelled L at cell index i, the seed is
      int.from_bytes(sha256(("EXP-XEDN-050b8a/v1|" + L + "|" + str(i)).encode(
      "utf-8")).digest()[:8], "big"), fed to Python's random.Random. Streams
      used: "null-lattice", "spread", "subset-chain". Every emitted seed is
      recorded so a third party reproduces every synthetic instance
      bit-for-bit.
    environment_declaration: >-
      Sage is ABSENT from this container and the archived implementation
      cannot be re-executed. Verified at ideation time
      (`python3 -c "import sage"` -> ModuleNotFoundError; numpy 2.4.6 present;
      sympy absent) and MUST be re-verified and recorded at run start. All
      stages are pure Python with the standard library plus, at most, numpy for
      convenience; exact arithmetic uses fractions.Fraction and integers only.
      If a stage cannot run for want of a dependency, that is an infrastructure
      request, not a result.

  stages:
    ordering_rationale: >-
      Cheapest-first. Stage 0 costs seconds and can end the whole line by
      showing the record misread the archive; stage 1 costs no compute and can
      end it by refuting the index identity; stage 3 is the only expensive
      stage and it is last.
    stage_0:
      name: archive re-extraction
      cost: seconds
      can_terminate_run: true
      content: >-
        From the four committed raw-result.json files extract, per surface:
        n_slots, span_rank, corank, max_abs_coeff, max_abs_coeff_gram,
        shortest_relation, relation_source, skip_reason, height_ctrl.ok_num and
        height_ctrl.deg_num. Report the relation count, the support profile,
        the coefficient-vector multiset, the slot histograms per prime, the
        height-diagnostic pass rate, and the distinct growth coefficients with
        multiplicities.
      termination_rule: >-
        If the extracted support profile is not 13 relations at support 3, 1 at
        support 4, 0 above, with max_abs_coeff = 1 on all 14, HALT and report
        that H-XEDN-754174 misread the archive. No further stage runs.
    stage_1:
      name: symbolic derivation and ladder
      cost: zero compute
      can_terminate_run: true
      content: >-
        Verify the index identity |c_i| = [L : L_i] on at least five explicitly
        constructed examples with hand-computable answers, including the fixture
        L = Z^2 with P_1 = (1,0), P_2 = (0,1), P_3 = -(2,3), whose unique
        primitive relation is (2,3,1) with infinity-norm 3. Compute
        floor(gamma_r^{r/2}) for r = 1..8 in both the recalled and the
        certified-lower-bound arms. Compute the affine Dynkin marks for A_2,
        D_4, E_6, E_7 and E_8 by enumerating positive roots from the Cartan
        matrices, and record the E_8 vector.
      termination_rule: >-
        If the index identity fails on any fixture, HALT: the mechanism is
        wrong at its first line.
    stage_2:
      name: matched null and graded controls
      cost: minutes
      can_terminate_run: false
      content: >-
        Run the synthetic arms: the matched lattice null, the graded rank
        ladder, the spread control, and both positive controls. All pure
        integer arithmetic; no elliptic curve, no function field.
    stage_3:
      name: canonical-height Gram on the committed configurations
      cost: hours of implementation, minutes of compute
      can_terminate_run: false
      content: >-
        Implement F_p[t] and F_p(t) arithmetic and the elliptic-curve group law
        over F_p(t) from scratch. For each of the fourteen committed
        configurations, take the recorded slot list, compute hhat(P) for EVERY
        section by fitting deg_t x(nP)/n^2 over n = 1..12, build the polarised
        Gram, compute H, lambda_1^2 and r on the relation's support, and
        evaluate B under the frozen rule. Report B beside the committed
        max_abs_coeff.

  arms_and_controls:
    treatment: >-
      The fourteen committed relation-bearing configurations, evaluated under
      the frozen rule of H-XEDN-754174 assumptions clause 1.
    measured_null: >-
      MATCHED LATTICE NULL. For each (rank r, size n) cell, draw 500 random
      integral lattices of rank r, enumerate the n closest nonzero vectors one
      per +/- pair, and compute the shortest relation's infinity-norm by exact
      integer kernel search. Matched on rank, on configuration size, and on the
      near-equal-norm profile the ball enumeration produces. FORCED VALUE
      DERIVED BEFORE THE RUN: the distribution concentrates on 1, with at least
      0.75 at (r = 2, n = 3) and exactly 1.00 at (r = 2, n in {4,5}). Origin of
      those thresholds: a pilot run OUTSIDE the harness at ideation time
      (pure Python, seed 7, 370 lattices) returning 0.81 and 1.00; THAT PILOT
      IS NOT EVIDENCE and is recorded only as the origin of the pre-registered
      numbers. THE NULL CAN FAIL: the same pilot observed 0.19 of (r = 2,
      n = 3) cells returning 2, so the null is not degenerate.
    positive_control_must_fire: >-
      AFFINE-E_8. Nine vectors of norm 2 realising an extended E_8 diagram,
      supplied synthetically. The relation-finder MUST return exactly 6, with
      primitive relation vector (1,2,3,4,6,5,4,3,2) up to permutation and sign.
      That value was computed at ideation time in exact integer arithmetic by
      enumerating the 120 positive roots of E_8 from its Cartan matrix
      (determinant 1), and stage 1 recomputes it independently. IF THE FINDER
      DOES NOT RETURN 6, THE INSTRUMENT IS BROKEN AND NO NEGATIVE RESULT MAY BE
      REPORTED FROM ANY ARM OF THIS EXPERIMENT.
    positive_control_low_end: >-
      AFFINE-A_2. Three vectors of a hexagonal rank-2 lattice, whose unique
      relation has all marks 1. The finder MUST return exactly 1. This pins the
      bottom of the scale so that a finder which returns 1 on everything is
      distinguishable from one which is correct.
    graded_control: >-
      RANK LADDER, 7 interior points. Maximum observed circuit coefficient on
      synthetic equal-norm configurations at r = 2,3,4,5,6,7,8, reported
      against the forced ladder 1,1,2,2,4,8,16. Prediction: monotone
      non-decreasing, never above the ladder, first crossing of the value 4 no
      earlier than r = 6. A violation at a specific r localises the failure to
      that rank instead of leaving "the bound did not hold".
    graded_control_2: >-
      SPREAD LADDER, 4 points. At fixed r = 2, inject spread
      sigma in {1.0, 1.5, 2.0, 3.0} and report the maximum observed
      coefficient. Prediction: strictly increasing, with the first value above
      1 appearing only once sigma > 1.7320. A quantity that does NOT rise as
      the parameter meant to move it increases is the canonical artifact tell
      and indicts the finder rather than the bound.
    ordering_control: >-
      The null arm and both positive controls are generated, evaluated,
      digest-committed and written to disk BEFORE any committed-archive
      configuration is evaluated. The frozen decision rule is executed on the
      null first and its verdict recorded. If the rule emits the same label on
      the null and on the treatment, it discriminates nothing and must be
      rewritten before the treatment is read.
    comparability_policy: >-
      No comparison to EXP-XEDN-002, -003, -004 or -005 is made, because those
      artifacts were NOT read at design time and their windows differ in chi.
      Such a comparison requires a separately registered comparator contract
      naming both families, both windows, the statistic, and the expected
      relation.

  metrics:
    primary:
      - G1_forced_bound_1_count: number of the 14 committed configurations at which B = 1
      - G2_exact_agreement_count: number at which B equals the committed max_abs_coeff
      - G3_null_infnorm1_fraction: by (rank, size) cell, with seeds
      - G4_positive_control_value: the value returned on affine-E_8
    secondary:
      - G5_rank_ladder_maximum: maximum observed coefficient by rank, with monotonicity
      - G6_spread_ladder_maximum: maximum observed coefficient by injected spread
      - G7_support_profile: re-extracted support and coefficient-vector multiset
      - per_configuration_H_lambda1_r_sigma: the four inputs to B, per configuration
      - height_convergence_diagnostic: "abs(hhat(n) - hhat(12)) against n for n in {4,6,8,10}"
      - gram_positive_semidefinite_flag and gram_kernel_contains_committed_relation_flag
      - certified_gamma_sensitivity: B recomputed under the certified-lower-bound arm

  preregistered_prediction:
    quantity: G1_forced_bound_1_count
    formula: >-
      B = floor(( H * gamma_r / lambda_1^2 )^{r/2}) with H = max_j hhat(P_j)
      over the relation's support, lambda_1^2 the exact minimum of the lattice
      generated by that support, and r = (support size) - 1.
    source: >-
      H-XEDN-754174 mechanism steps (1)-(4), derived in-repo; gamma_r from
      heuristic HEUR-XH-1 (RECALLED, UNVERIFIED, with a certified-lower-bound
      sensitivity arm).
    predicted_value: ">= 12 of 14"
    derivation_note: >-
      13 of the 14 relations have support 3 (r = 2) and 1 has support 4
      (r = 3). B floors to 1 whenever the within-configuration spread
      sigma = H/lambda_1^2 satisfies sigma < 1.7320 at r = 2 and
      sigma < 1.2599 at r = 3. sigma has never been measured on any
      configuration, so this is a genuine prediction and not a restatement.

  replication:
    seeds: [754174, 754175]
    independent_instances: 2
    interpretation: >-
      The synthetic arms replicate across both seeds. The archive arm is
      deterministic given the committed artifacts and does not replicate; its
      reproducibility is established by the artifact digests instead.

  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 4
    maximum_memory_gb: 4
    maximum_runs: 6
    no_network: true

  stopping_rules:
    - Stage 0 halts the run if the extracted support profile disagrees with the frozen expectation.
    - Stage 1 halts the run if the index identity fails on any fixture.
    - Stop stage 2 at a cell once 500 lattices are evaluated or the cell budget is reached, whichever is first; a truncated cell reports its own coverage and is not extrapolated.
    - Stop stage 3 after the 14 committed configurations, or at the budget; a partial stage 3 reports which configurations were covered and makes no statement about the rest.
    - Stop before the treatment arm if the null arm or either positive control has not been written and digest-committed.

  invalidation_rules:
    - Any change in a committed-artifact digest between run start and run end.
    - Any evaluation of the treatment arm before the null arm and both positive controls are committed.
    - Any change to the frozen evaluation rule after any value of B is observed; such a change requires a versioned protocol amendment with confirmatory_status exploratory_only and is never an edit.
    - Any failure of the two forced height identities hhat(2P) = 4 hhat(P) or <P,P> = hhat(P), which invalidates every stage-3 number.
    - A polarised Gram that is not positive semi-definite, or whose kernel omits a committed relation vector, on any configuration; that configuration is invalid for the primary metric.
    - Reporting the certified-lower-bound arm as the headline instead of as a sensitivity.

  infrastructure_failure_disposition: >-
    A timeout, crash, memory exhaustion, or missing dependency terminates the
    affected stage and is recorded as failed_infrastructure with the exact
    error. IT IS NEVER NEGATIVE MATHEMATICAL EVIDENCE (AGENTS.md rule 5), never
    evidence about H-XEDN-754174 or H-XEDN-005, and never evidence that the
    coefficient bound holds. In particular: the absence of Sage is an
    infrastructure fact about this container, and any inability to reproduce
    the archived pipeline is reported as such rather than as a finding about
    the mathematics.

  success_criterion: >-
    This draft has no current success outcome because it is not authorized for
    execution. If a later, separately approved and frozen successor is
    executed, its positive disposition is: stage 0 and stage 1 pass; both
    positive controls fire (affine-E_8 returns exactly 6, affine-A_2 returns
    exactly 1); the null arm is committed before the treatment arm; and
    G1 >= 12 of 14 with the per-configuration (H, lambda_1^2, r, sigma) values
    reported. That disposition supports only the claim that the coefficient
    metric was uninformative at the tested configuration sizes, and establishes
    no ECDLP attack, cost, exponent, crypto-scale, or deployed-scheme
    conclusion, and no status change.

  falsification_criterion: >-
    G1 <= 11 of 14, i.e. the frozen rule returns B >= 2 on three or more
    committed configurations. H-XEDN-754174 is then falsified: the measurement
    had room to move and the observed constancy is informative. Independently
    falsifying: the index identity fails on a fixture; the matched null returns
    infinity-norm 1 on fewer than 0.5 of (r = 2, n = 3) draws; or the rank
    ladder exceeds the forced values at any r.

  outcomes:
    no_execution_authorization: >-
      The only current disposition: a review_required draft. No run, no
      evidence, no mathematical inference.
    forced_value_confirmed: >-
      Toy-scoped instrument finding. MUST be accompanied by the forward
      guidance required by falsification condition F6 of H-XEDN-754174 -- the
      configuration-size boundary at which the metric regains content, the null
      distribution, and a named successor quantity with measured spread -- or
      the outcome is a fatigue report and its honest status is unverified.
    forced_value_refuted: >-
      The measurement had room to move. This is the more interesting outcome:
      it rescues the informativeness of the existing GOAL-XEDN-003 result and
      redirects the audit to explain why the observed value nonetheless never
      varied.
    instrument_failure: >-
      A positive control does not fire, or a forced height identity fails.
      Reported as an instrument outcome; NO negative mathematical statement of
      any kind may be made.

  required_artifacts_if_later_authorized:
    - The frozen approved specification and a freeze receipt binding its SHA-256.
    - experiments/EXP-XEDN-050b8a/runs/*/manifest.yaml with the inference block and git state.
    - experiments/EXP-XEDN-050b8a/runs/*/raw-result.json, stdout.log, stderr.log, command.txt, environment.json.
    - The stage-0 re-extraction table with the digests of all six committed input artifacts.
    - The stage-1 symbolic derivation, the fixture results, and the recomputed affine Dynkin marks.
    - The null-arm and positive-control outputs with their pre-treatment digest commitment and all seeds.
    - The per-configuration table of (H, lambda_1^2, r, sigma, B, committed max_abs_coeff).
    - The from-scratch F_p(t) arithmetic implementation with its two forced-identity self-tests.
    - experiments/EXP-XEDN-050b8a/execution_report.md.

  scale_relevance:
    tier: toy
    transfer_statement: >-
      The lattice half of the argument (steps 1-4 of the mechanism) is
      scale-free: it is an inequality about positive-definite lattices and does
      not depend on p, on the curve, or on the field. What does NOT transfer is
      any conclusion about elliptic surfaces, about larger configurations,
      about primes outside {7,13,19,31}, or about the ECDLP at any scale. The
      experiment's own numbers are toy and are labelled toy on every citation.
    stated_limit: >-
      Configuration sizes 3 to 6, four toy primes, one committed family, one
      instrument lineage, fourteen relations of which thirteen are the same
      structural event.

  approval_requirements:
    - Independent review confirms the frozen evaluation rule is complete, parameter-free, and fixed before any evaluation.
    - Independent review confirms the null arm is matched (rank, size, norm profile) and can actually fail.
    - Independent review confirms the affine-E_8 forced value is derived rather than fitted.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved, and only the Coordinator may approve (AGENTS.md rule 1).
  assigned_to: unassigned
