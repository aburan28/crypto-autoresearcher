experiment:
  id: EXP-PEC-27c7a3
  hypothesis_id: H-PEC-189c70
  source_idea: IDEA-20260803-48e258
  version: 1
  title: >-
    Emit the crossover locus p*(w) for this campaign's own charged
    p^(1/3+o(1)) cost curve against this campaign's own frozen
    Delfs-Galbraith / van Oorschot-Wiener middle-memory baseline, over
    w in {2^20, 2^25, 2^30, 2^35, 2^40}, for all eighteen committed
    measured-gamma readings and both L4 scenarios, at zero new isogeny
    compute
  status: review_required
  class: cost-model-measurement

  status_rationale: >-
    `review_required` AND NOT `approved`. Three independent reasons, each
    sufficient on its own, and none of them is a null field:
    (1) AUTHORIZATION. GOAL-P13-001 is `closed_at_budget` with
    batches_remaining 0, batches_consumed 4, and a next_action that states
    "NO FURTHER EXECUTOR BATCH IS AUTHORIZED AGAINST THIS GOAL UNDER THE
    CURRENT (SPENT) CAMPAIGN BUDGET" (GOAL-P13-001 status, campaign_budget,
    next_action). This contract cannot be dispatched under that goal without
    a recorded fresh campaign_budget authorization.
    (2) USER APPROVAL GATE. The designing session was instructed that user
    confirmation is the approval gate and that it has not been given. The
    standing authorization in .claude/skills/design-experiment/SKILL.md step 4
    is therefore NOT exercised here.
    (4) A CONTRADICTION BETWEEN TWO COMMITTED RUNS OF THE EXPERIMENT THAT
    SUPPLIES THIS CONTRACT'S BASELINE. RUN-WESOVOW-001 and
    RUN-WESOVOW-201692-001 use different vOW memory normalizations, differ by
    0.5*log2 M = 46.6389 bits at NIST-I, and DISAGREE ON WHETHER THE ASSESSED
    METHOD BEATS THE BASELINE AT ALL. The deliverable is a curve in exactly
    that variable. See blocking_preconditions PRE-4; this contract does not
    adjudicate the conflict and must not.
    (3) A PRE-EXECUTION SOUNDNESS FINDING THAT THE APPROVER MUST SEE FIRST.
    See coordinator_prior_before_execution: the proposal's headline
    pre-registered bound (P1 / F3) is, on this Coordinator's own reading of
    committed constants, ALREADY FALSE before the experiment runs, and the
    headline deliverable is likely UNDEFINED on three independent grounds
    (F5, F6 and PRE-4). That does not make the contract unfit to run - F2 and
    the controls remain live and decidable - but it changes what the run is for,
    and an approver who has not read that finding is approving a different
    experiment than the one this contract describes.
    NO FIELD REQUIRED BY templates/research-records.md IS NULL. inputs,
    controls, independent_variables, metrics.primary, metrics.secondary,
    replication, budget, stopping_rules, invalidation_rules,
    success_criterion, falsification_criterion and required_artifacts are all
    populated. The template's `heuristic_under_test` is null, correctly: this
    experiment validates no heuristic and says so (see
    heuristic_under_test_note).

  objective: >-
    Reduce exactly one uncertainty: WHETHER REPORTING THIS CAMPAIGN'S OWN
    MODELLED COMPARISON AS A LOCUS IN (p, w) IS BETTER CONDITIONED THAN
    REPORTING IT AS A SCALAR AT (NIST-I, w = 2^30). It reduces no uncertainty
    about the attack, about Heuristic 1, about any deployed parameter set, or
    about any cost this campaign has not already charged. The deliverable is a
    concrete-cost table plus a conditioning comparison, not a binary test of a
    mathematical prediction.

  # ---------------------------------------------------------------------------
  # INPUTS
  # ---------------------------------------------------------------------------
  inputs:
    provenance_rule: >-
      EVERY numeric input below is either (a) quoted from a committed record of
      this repository with its record ID and field named, or (b) listed under
      inputs.must_be_obtained_or_declared_unrun. THERE IS NO THIRD CATEGORY. An
      input in neither list may not be used, and using one is a rule-9
      violation rather than a modelling choice. The Executor does not repair a
      missing input by estimation, recollection, or interpolation.

    committed_verified_by_the_designing_coordinator:
      - id: IN-GAMMA-6
        value: >-
          The six committed (gamma, log2 A) fit pairs, W-ALL / W-MID / W-TOP x
          S-A / S-B (S-MIN identical to S-B on all three windows):
          W-MID S-A 0.9328644281 / 9.2983509117;
          W-MID S-B 0.8100336227 (full precision 0.8100336226739335) /
          9.7307533347;
          W-ALL S-A 0.8912302306 / 9.5717462175;
          W-ALL S-B 0.7945793087 / 9.8316770207;
          W-TOP S-A 0.9711874858 / 9.0226957062;
          W-TOP S-B 0.9584957100 / 8.6295978066.
        source: EV-PEC-857664 observations OBS-G
        binding_rule: >-
          THE PAIRING RULE IS BINDING AND IS THE BATCH'S OWN STRUCTURAL
          CONTRIBUTION: an intercept is used ONLY with the slope of the same
          fit of the same series over the same window (EV-PEC-857664 OBS-H;
          DEC-20260802-48c72c adjudication C). Any cross-paired (log2 A, gamma)
          combination is prohibited and its appearance in an emitted row is an
          invalidation condition (INV-3).
      - id: IN-ALPHA-3
        value: "alpha in {0, 1, alpha_hat} with alpha_hat = 1.1596976732"
        source: EV-PEC-857664 observations OBS-K
        binding_rule: >-
          SP-10 binds: alpha = 1 is labelled DERIVED and MECHANISM-INCONSISTENT
          on a toy-scale three-point basis, NEVER 'measured-consistent', and
          every alpha = 1 row inherits the label including the bracket's high
          end (DEC-20260802-48c72c SP-10). The FC-4 firing on
          ell in {3,5,7,11,13} stands (gap 0.1661896244 > 0.15); its retirement
          by NC2d-PROPER holds only within ell in {47,101,151,211} and may not
          be cited as contract-verified while defect D-8 stands.
      - id: IN-EIGHTEEN-READINGS
        value: >-
          The eighteen measured-gamma readings = 6 fits x 3 alphas, landing in
          [8.3498, 13.1544] bits of modelled NIST-I margin at w = 2^30, a span
          of 4.805 bits. Most adverse: S-A W-TOP at alpha_hat
          (overhead 25.9193, c 1.619957, margin 8.3498). Least adverse:
          S-B W-ALL at alpha 0 (21.1147, 1.319669, 13.1544).
        source: EV-PEC-857664 observations OBS-M
        completeness_warning_read_this: >-
          ONLY EIGHT OF THE EIGHTEEN ROWS ARE COMMITTED VERBATIM. OBS-M names
          the two extremes plus six headline bracket rows (S-B/S-MIN W-MID
          alpha 0: 21.2332 / 1.327077 / 13.0359; S-A W-MID alpha 0: 22.5450 /
          1.409064 / 11.7241; S-B W-MID alpha 1: 23.9113 / 1.494456 / 10.3578;
          S-A W-MID alpha 1: 25.2231 / 1.576444 / 9.0460; S-B W-MID alpha_hat:
          24.3390 / 1.521187 / 9.9301; S-A W-MID alpha_hat: 25.6508 /
          1.603174 / 8.6183). THE REMAINING TEN ROWS ARE NOT COMMITTED
          ROW-BY-ROW and must be RECONSTRUCTED from IN-GAMMA-6, IN-ALPHA-3 and
          IN-MODEL-FORMULAS. That reconstruction is the thing CTL-1 exists to
          gate: a reconstruction that cannot reproduce the eight committed rows
          has no licence to emit the other ten.
      - id: IN-C-BRACKET
        value: >-
          Per field size, as a span across two declared modelling choices and
          NEVER as a confidence interval: NIST-I [1.327077, 1.576444];
          NIST-III [1.232366, 1.488390]; NIST-V [1.178237, 1.435130];
          log2 p = 576 [1.158104, 1.414551]; log2 p = 768
          [1.114020, 1.367929].
        source: DEC-20260802-48c72c citability_ruling.what_may_be_cited
        binding_rule: >-
          All eight mandatory attachments MA-1..MA-8 travel with every emitted
          object. SP-1 (permanent) forbids citing c = 0.864 / 0.771 / 0.868 /
          1.0389 / the c_kappa values as estimates. SP-7 forbids the per-row
          bootstrap c_low/c_high (~0.005 wide) as the uncertainty on c. SP-11
          forbids any W-TOP-derived c as an estimate or bracket endpoint - it
          appears ONLY in the window-choice sensitivity, with the
          band-artifact label, under the citability_ruling carve-out.
      - id: IN-MODEL-FORMULAS
        value: >-
          The frozen baseline cost model, verbatim from the committed
          implementation: log2X = 0.5*log2B + (log2p - 1)/6;
          log2M = 2*log2X + log2(rho(w)) with w = log2X/log2B;
          log2P0 = -u*log2(u) with u = (log2p - 1)/(3*log2B);
          log2Tfull = log2M - log2P0; T_w_vOW = T_full/sqrt(min(w, M));
          T_DG_baseline = 2^(log2p/2); overhead multiplies T(w) by
          2^(c*sqrt(log2p)); B_grid log2B from 1.0 to 60.0 in steps of 0.1.
        source: >-
          experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/raw-result.json
          model.formulas and model.B_grid; implementation
          experiments/EXP-WESOVOW-001/cost_model.py
        note: >-
          NOTE THE COLLISION OF NAMES, WHICH IS A REAL HAZARD: `w` denotes the
          smoothness parameter log2X/log2B inside these formulas AND the MEMORY
          BUDGET on the deliverable's axis. They are different quantities. The
          Executor renames the memory axis `w_mem` throughout the
          implementation and the emitted table. A conflation of the two is
          invalidation condition INV-5.
      - id: IN-COMMITTED-FIELD-GRID
        value: >-
          The five committed field sizes with their optimized quantities
          (log2B_opt, log2T_full, log2T_DG):
          256: 14.200000000000001 / 108.73088958800618 / 128.0;
          384: 17.8 / 157.87439031817553 / 192.0;
          512: 20.900000000000002 / 206.1038967394178 / 256.0;
          576: 22.3 / 229.98121023958595 / 288.0;
          768: 26.1 / 300.93543569782855 / 384.0.
        source: >-
          experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/raw-result.json
          per_field.*.optimal and per_field.*.baseline_log2TDG
        note: >-
          log2 B_opt = 14.2 at NIST-I is the value EV-PEC-857664 OBS-M cites,
          so the two records agree and the agreement was checked rather than
          assumed.
      - id: IN-MARGIN-MODEL-NIST1
        value: >-
          margin(w_mem) = 128 - (108.73088958800618 - 0.5*log2(w_mem)
          + overhead_bits), with base margin 34.2691 at zero overhead and
          overhead_bits = c*sqrt(log2 p).
        source: EV-PEC-857664 observations OBS-M
        designing_coordinator_verification: >-
          This Coordinator reconstructed the two bracket rows from this formula
          and IN-C-BRACKET alone and obtained 13.0359 (c = 1.327077) and
          9.0460 (c = 1.576444), matching OBS-M to every printed digit. That
          check is COORDINATOR-SIDE ANALYSIS OF COMMITTED DATA under
          DEC-20260802-48c72c SP-5 as extended, is cited as a design finding
          and NEVER as run evidence, and it opens and closes no gate. It is
          recorded because it is the basis of
          coordinator_prior_before_execution below, and a prior stated without
          its arithmetic is an opinion.
      - id: IN-L4
        value: >-
          The removable ell-dependent term is gamma*log2(B_opt), PER READING:
          0.810034 * 14.2 = 11.502 bits of a 21.233 (alpha 0) to 23.911
          (alpha 1) bit total for S-B/S-MIN W-MID, 48 to 54 per cent; and
          0.932864 * 14.2 = 13.247 bits of 22.545 to 25.223 for S-A W-MID,
          53 to 59 per cent.
        source: EV-PEC-857664 observations OBS-L
        correction_to_the_proposal_recorded_rather_than_propagated: >-
          IDEA-20260803-48e258 describes 11.50 and 13.25 as "the 11.50 and
          13.25 bit extremes" of a single two-valued L4 scenario. THAT IS A
          MISREADING OF OBS-L AND IS NOT ADOPTED. They are not two extremes of
          one quantity; they are the L4 term OF TWO DIFFERENT READINGS
          (S-B/S-MIN W-MID and S-A W-MID respectively). The two L4 scenarios
          are therefore ABSENT vs PRESENT, and in the PRESENT scenario each
          reading has its OWN gamma*log2(B_opt) removed. Applying 11.502 or
          13.247 to a reading it does not belong to is invalidation condition
          INV-4.
      - id: IN-L2
        value: >-
          Delta = 0.60 to 1.00 bits at every field size, in the ATTACK'S
          FAVOUR (every modelled margin is UNDERSTATED by that much; c at
          NIST-I is OVERSTATED by 0.038 to 0.063). Supporting values: exact
          enumeration 0.598 at (X, B) = (10^7, 100) and 0.625 at (10^8, 215)
          for gamma 0.810 (0.676 / 0.704 for gamma 0.933); Dickman asymptotic
          0.868 at NIST-I and 0.899 at log2 p = 768 for gamma 0.810.
        source: EV-PEC-857664 observations OBS-J
        binding_rule: >-
          Applied as an EXPLICIT SIGNED correction on every emitted object,
          shown as its own column, and NEVER netted against any anti-attack
          term. In particular it is never netted against RT3-C9's
          asymmetric-realism term (plausibly 5-7 bits, also pro-attack, and
          deliberately applied to NO row).
      - id: IN-IRREPRO-BANDS
        value: "2.2309 bits (NIST-I time) and 3.5133 bits (largest absolute deviation in RUN-WESOVOW-001's C1 control)"
        source: EV-PEC-857664 OBS-M; DEC-20260802-48c72c completion_criteria_assessment.criterion_1
      - id: IN-SOURCE-SCALE
        value: >-
          p = 1099511627563 (one 80-bit F_{p^2}), 47 prime degrees
          2 <= ell <= 211, one pure-Python IMPL-A/IMPL-B pair sharing every
          line but poly_mul, one 791.751-second run.
        source: DEC-20260802-48c72c limitations
        binding_rule: "MA-6 / AGENTS.md rule 7. This is not a cryptographic-scale measurement and no emitted object may be presented as one."

    must_be_obtained_or_declared_unrun:
      - id: MISSING-K
        quantity: >-
          The end-to-end Delfs-Galbraith / vOW baseline constant k, from the
          frozen bibliography's [15] (Santos-Costello-Shi) and [3] (Adj et
          al.), and Sutherland (ANTS X, 2013).
        status_on_the_committed_record: >-
          UNQUANTIFIED. The bibliographic subtask was EXECUTED in BATCH-403f13
          and all three named sources were retrieved, AND k REMAINS
          UNQUANTIFIED (GOAL-P13-001 batch_checkpoints BATCH-403f13 outcome;
          EV-PEC-857664 unresolved_confounds). Retrieval was necessary and is
          not sufficient. IDEA-20260803-48e258 assumed retrieval would pin k;
          that assumption is corrected here rather than carried.
        required_handling: >-
          BLOCKING FOR THE ABSOLUTE LOCUS ONLY. The Executor transcribes k with
          a quoted excerpt and a SHA-256 of the retrieved source, or declares
          it UNOBTAINED. If UNOBTAINED: emit the locus ONLY in ratio form
          against an unpinned k, report the absolute locus as UNRUN under
          AGENTS.md rule 5, and do NOT evaluate the pre-registered bound P1.
          That is falsification condition F5 and it is a LIVE AND LIKELY
          outcome, not a hedge. Substituting k = 1 silently is a rule-9
          violation; substituting k = 1 as a DECLARED, LABELLED sensitivity row
          beside the UNRUN verdict is permitted and required to be labelled.
        prohibited_substitute: >-
          SP-9, permanently: C-NULL's measured per-step cost 2^12.26 to 2^12.32
          at p ~ 2^40 may NEVER be used as a Delfs-Galbraith per-step
          measurement. It goes through Phi_2 root-finding and inherits the
          whole 2*log2(p^2) exponentiation; a competent DG implementation walks
          by Velu at tens of operations plus a subfield test.
      - id: MISSING-ALPHA-P-SCALING-BASIS
        quantity: >-
          Any measurement of the overhead law's p-scaling at more than three
          primes, or at any p above 2^80.
        status_on_the_committed_record: >-
          DOES NOT EXIST. alpha rests on three primes at 40-, 60- and 80-bit
          fields and carries a `toy` ceiling (DEC-20260802-48c72c limitations;
          EV-PEC-857664 OBS-K). The fits themselves stand at a SINGLE
          p = 1099511627563.
        required_handling: >-
          NOT OBTAINABLE IN THIS EXPERIMENT AND NOT SOUGHT. It is recorded here
          because it is the divisor of the reconditioning mechanism: the locus
          in p is conditioned by HEUR-XO-1 rather than interpolated, and every
          emitted object states that on its face (DEL-6).
      - id: MISSING-COST-MODEL-BELOW-256
        quantity: >-
          Any committed evaluation of the baseline cost model at log2 p < 256.
        status_on_the_committed_record: >-
          DOES NOT EXIST. RUN-WESOVOW-001's per_field grid is exactly
          {256, 384, 512, 576, 768} (IN-COMMITTED-FIELD-GRID).
        required_handling: >-
          THIS IS THE FITTED-WINDOW GUARD'S SHARPEST EDGE AND IT IS WHERE THIS
          EXPERIMENT MOST LIKELY TERMINATES. Re-executing the committed
          cost_model.py at log2 p < 256 is mechanically possible and is NOT
          forbidden, but the OVERHEAD LAW composed onto it is fitted at a
          single p = 2^40 over 2 <= ell <= 211, so any locus located below
          log2 p = 256 sits outside the declared window of
          fitted_windows.window_p and is emitted as UNDEFINED with the missing
          input named. It is NOT extrapolated, NOT interpolated, and NOT
          quietly re-windowed. See F6 and coordinator_prior_before_execution.

    blocking_preconditions:
      - id: PRE-1
        condition: >-
          A recorded, committed campaign_budget authorization permitting a
          further executor task against GOAL-P13-001, whose next_action states
          that no further executor batch is authorized under the current spent
          budget (batches_consumed 4, batches_remaining 0, status
          closed_at_budget).
        why_it_blocks: >-
          Dispatching an Executor against a closed_at_budget goal would make
          the run's authorization defective at the moment it is created, which
          is an evidence-integrity failure rather than a mathematical result.
          Alternatively this contract is re-parented to a NEW goal record with
          its own budget; that is a Coordinator decision and is not taken here.
      - id: PRE-2
        condition: >-
          Either a committed Coordinator decision lifting or scoping standing
          prohibition SP-3 after independent review, or acceptance that every
          w_mem != 2^30 row is emitted as a MODEL LOCUS with SP-3 attached and
          no absolute margin quoted at those w.
        why_it_blocks: >-
          SP-3 STANDS UNCHANGED: modelled margins are quoted at w = 2^30 only
          and larger-w rows are NOT read as improvements
          (DEC-20260802-48c72c SP-3). The deliverable's entire point is a w
          axis. This contract takes the SECOND branch by default - it does not
          lift SP-3, it attaches it - and the approver must confirm that
          reading is acceptable rather than discover it in the output.
      - id: PRE-3
        condition: >-
          The approver has read coordinator_prior_before_execution and accepts
          that P1/F3's verdict is conditional on PRE-4 and that the headline
          locus is expected to be UNDEFINED or UNRUN.
        why_it_blocks: >-
          Approving this contract without that finding approves a different
          experiment. Stated as a precondition so it cannot be satisfied by
          inattention.
      - id: PRE-4
        condition: >-
          A committed Coordinator determination, after independent review, of
          WHICH vOW MEMORY CONVENTION GOVERNS THE BASELINE COMPARISON - and
          therefore which way the deliverable's memory axis runs and what the
          sign of the comparison is.
        the_conflict_stated_exactly: >-
          TWO COMMITTED RUNS OF EXP-WESOVOW-001 DISAGREE, AND THE DISAGREEMENT
          IS IN SIGN RATHER THAN PRECISION.
          VARIANT (A), RUN-WESOVOW-001: model.formulas.T_w_vOW =
          "T_full / sqrt(min(w, M))", so log2 T(w) = log2 T_full
          - 0.5*log2 w_mem. At (NIST-I, w_mem = 2^30, c = 0):
          log2T_w = 93.7309, log2speedup_vs_DG = +34.2691, beats_baseline TRUE.
          VARIANT (B), RUN-WESOVOW-201692-001, same experiment id, matching the
          current experiments/EXP-WESOVOW-001/cost_model.py:
          model.formulas.T_w_vOW = "T_full * sqrt(M / min(w, M))", so
          log2 T(w) = log2 T_full + 0.5*max(0, log2 M - log2 w_mem). At the
          same point: log2T_w = 140.3698, log2speedup_vs_DG = -12.3698,
          beats_baseline FALSE.
          They differ by exactly 0.5*log2 M = 46.6389 bits at NIST-I.
        what_is_settled_and_needs_no_determination: >-
          THE DIRECTION OF THE w TERM IS SETTLED AND IS THE SAME IN BOTH
          VARIANTS: more memory makes the ASSESSED METHOD cheaper and the
          margin LARGER. The baseline is charged as
          T_DG = p^(1/2) = 2^(log2 p / 2) with NO memory dependence whatsoever
          (model.formulas.T_DG_baseline; per_field.*.baseline_log2TDG is
          exactly half of log2 p at all five field sizes, and no memory budget
          appears in its computation). The vOW time-memory tradeoff in this
          model is applied to the ASSESSED method's own table-and-collision
          structure, NOT to Delfs-Galbraith. So the expectation that more
          memory should help the baseline and SHRINK the margin is NOT what
          either committed variant does, and the margin's increase in w_mem is
          not a sign error in the w term. Whether charging the baseline with no
          memory dependence at all is the right modelling choice is a separate
          question this contract does not open; it is an asymmetry in the
          ATTACK'S FAVOUR on the w axis, and it is part of why SP-3 exists.
        what_is_NOT_settled: >-
          THE NORMALIZATION OF THAT TERM, WHICH DECIDES THE SIGN OF THE WHOLE
          COMPARISON. Variant (A) is what EV-PEC-857664 OBS-M uses and
          therefore what all eighteen readings, the [8.3498, 13.1544] band, the
          c bracket's margin column, and this contract's CTL-1 known-answer
          gate all rest on. Variant (B) reverses the sign of every one of those
          rows. THIS CONTRACT DOES NOT ADJUDICATE IT AND MUST NOT: it is a
          contradiction between committed records, which AGENTS.md rule 12
          routes to an independent review-breakthrough pass at `max` - a policy
          that may never be degraded and that DEC-20260802-48c72c records as
          unavailable in this campaign. So the honest handling is to block, not
          to choose.
        observation_offered_to_that_review_and_not_a_verdict: >-
          Variant (A)'s OWN committed crossover block reports the memory needed
          to beat the baseline as log2 w* = -38.5382, -22.5382 and -6.5382
          entries at c = 0, 0.5 and 1.0 at NIST-I. A negative count of table
          entries is not a memory requirement. That is the signature of an
          unnormalized term: T_full/sqrt(w_mem) grants unbounded credit from
          memory with no reference to the table size M, so it will always
          report that the attack wins at sufficiently small memory. Variant (B)
          pays nothing at w_mem = M and sqrt(M/w_mem) below it, and its w*
          values are 2^54.74, 2^69.24, 2^81.64, 2^87.27 and 2^102.56 entries -
          all finite, all below log2 M, and all ABOVE the deliverable's largest
          plotted w_mem = 2^40. This is recorded as an observation for the
          reviewer to weigh. It is COORDINATOR-SIDE ANALYSIS under
          DEC-20260802-48c72c SP-5 as extended, is not run evidence, opens and
          closes no gate, and is explicitly NOT a finding that variant (A) is
          wrong or that the campaign's committed margins are void.
        why_it_blocks: >-
          THE DELIVERABLE IS A CURVE IN EXACTLY THIS VARIABLE. A curve whose
          free axis may carry a contested normalization, and whose comparison
          may carry the opposite sign, is not approvable - and the defect would
          otherwise be discovered mid-run, after the known-answer gate had
          already certified a reconstruction of whichever variant the Executor
          happened to implement. CTL-1 CANNOT CATCH THIS: it gates against
          OBS-M, which is faithful to variant (A), so an Executor implementing
          variant (A) passes the gate and an Executor implementing variant (B)
          fails it - meaning the gate silently ENFORCES variant (A) rather than
          testing it. That is precisely the kind of self-consistent wrong
          implementation R3's blind re-derivation exists to catch, and it is
          cheaper to resolve at the approval gate.
        minimum_acceptable_resolution: >-
          Either (i) a committed determination naming the governing variant
          with its reasoning, after which this contract is SUPERSEDED by one
          whose XO-DEF, XO-BASE and CTL-1 name that variant explicitly and
          whose IN-* inputs are re-derived under it; or (ii) a determination
          that both remain live, in which case the deliverable must be emitted
          TWICE, once under each convention, with neither presented as the
          result and the sign disagreement reported as the headline. Silently
          inheriting variant (A) because OBS-M uses it is NOT an acceptable
          resolution, and this contract as frozen would do exactly that.

  # ---------------------------------------------------------------------------
  # THE FROZEN DEFINITIONS. Everything below this line is hash-bound and is
  # fixed BEFORE any curve is drawn.
  # ---------------------------------------------------------------------------
  frozen_definitions:
    freeze_rule: >-
      The crossover definition, the baseline cost model, the
      uncertainty-propagation rule, the fitted-window boundaries and the five
      pre-registered predictions are FROZEN by this contract. After approval
      any change requires a versioned protocol_amendment in
      experiments/EXP-PEC-27c7a3/amendments/, recorded BEFORE execution
      resumes. A dispatch message cannot amend this contract
      (INCIDENT-20260802-P13-03; DEC-20260802-48c72c adjudication H, whose
      remedy binds every successor batch). An underspecification is REPORTED
      by the Executor, never resolved by the Executor.
    hash_binding: >-
      The Executor records the SHA-256 of this specification.yaml, exactly as
      committed by its snapshot archive, in the run manifest, and re-verifies
      it against the committed blob before emitting any object. A mismatch is
      invalidation condition INV-1.

    crossover_definition:
      id: XO-DEF
      statement: >-
        FIXED BEFORE ANY CURVE IS DRAWN. For a fixed memory budget w_mem and a
        fixed reading r = (series, window, alpha) and a fixed L4 scenario s,
        define the modelled signed advantage
          D_r,s(p, w_mem) = log2 T_DG(p) - log2 T_assessed,r,s(p, w_mem)
        where log2 T_DG(p) = log2(p)/2 + log2(k) with k the baseline constant
        of MISSING-K, and log2 T_assessed is IN-MODEL-FORMULAS' T_w_vOW
        multiplied by the overhead 2^(c_r(p)*sqrt(log2 p)), with the L4 term
        removed in scenario s = PRESENT and charged in scenario s = ABSENT, and
        with the IN-L2 correction applied as a signed additive term.
        D > 0 means the assessed method is modelled CHEAPER than the baseline.
        THE CROSSOVER LOCUS p*_r,s(w_mem) IS THE VALUE OF log2 p AT WHICH
        D_r,s CHANGES SIGN. If D has no sign change over the evaluated p range,
        p* DOES NOT EXIST over that range and is reported as
        NO_CROSSOVER_IN_RANGE together with the SIGN of D throughout the range
        - which is a determinate, reportable outcome and is NOT an UNDEFINED
        segment. If D changes sign more than once, ALL crossings are reported
        and the monotonicity assumption of the mechanism is recorded as
        VIOLATED.
      sign_convention_is_frozen_because_it_is_the_whole_claim: >-
        The mechanism claims the locus inherits the ROBUST SIGN and not the
        unrobust magnitude. Freezing which sign means what, before any
        evaluation, is what prevents a post-hoc re-reading of a positive
        margin as a negative one.
      root_finding: >-
        Bisection on log2 p to an absolute tolerance of 1e-6 bits in log2 p,
        over the evaluated p range, at each (r, s, w_mem). Deterministic; no
        randomness. The bracket must be exhibited (two log2 p values with
        opposite-signed D) before bisection is entered; a bisection entered
        without an exhibited sign-change bracket is INV-6.

    baseline_cost_model:
      id: XO-BASE
      statement: >-
        EXACTLY IN-MODEL-FORMULAS, re-executed from the committed
        experiments/EXP-WESOVOW-001/cost_model.py with the committed B_grid
        (log2B 1.0 to 60.0, step 0.1) and the committed Dickman configuration
        (Laplace inversion, laplace_h 0.05, laplace_T 25.0, gl_nodes 96,
        grid_du 0.05, grid_umax 130.0). No re-derivation, no reimplementation,
        no re-tuning of the Dickman routine or the B grid.
      reuse_verification_gate: >-
        Before any new p is evaluated, the Executor re-executes the committed
        implementation at the five committed field sizes and must reproduce
        IN-COMMITTED-FIELD-GRID's log2B_opt, log2T_full and log2T_DG exactly
        as committed (bit-for-bit on the printed digits). Failure is INV-2:
        the instrument is not the committed instrument and nothing may be
        emitted.
      what_is_and_is_not_new_compute_stated_honestly: >-
        IDEA-20260803-48e258 says "ZERO NEW COMPUTE BEYOND ARITHMETIC ON
        COMMITTED NUMBERS". THAT IS NOT EXACTLY TRUE AND THE CORRECTION IS
        RECORDED RATHER THAN PROPAGATED. A locus in p requires B_opt, log2M and
        log2P0 at p values that are NOT among the five committed field sizes,
        which requires RE-EXECUTING the committed B-grid optimizer and the
        committed Dickman routine at each new p. That is deterministic
        re-execution of committed code rather than arithmetic on committed
        outputs. It involves no isogeny computation, no field arithmetic at
        scale, no sampling and no randomness, and it is cheap - but it is new
        computation and the manifest labels it as such. Calling it "arithmetic
        on committed numbers" would misdescribe the instrument.

    uncertainty_propagation_rule:
      id: XO-PROP
      statement: >-
        FIXED BEFORE ANY CURVE IS DRAWN. There is NO statistical propagation,
        because there is no statistical input to propagate. The eighteen
        readings are a SPAN ACROSS DECLARED MODELLING CHOICES and are NOT
        independent: they share the same 47 acquired ell and the same two
        implementations, whose exponents are themselves non-independent
        estimates under a fixed split structure (EV-PEC-857664 OBS-F; MA-8).
        The band on p* is therefore computed as the EXACT ENVELOPE - the
        minimum and maximum of p* over the enumerated set of readings and
        scenarios - and never as a variance, standard error, confidence
        interval, or quantile.
      prohibitions_that_are_part_of_the_rule:
        - "The envelope may NEVER be called or labelled a confidence interval (MA-3, SP-7)."
        - >-
          The per-row bootstrap c_low/c_high (about 0.005 wide in c, a
          j-resampling interval on a DETERMINISTIC COUNTER) may NEVER be
          propagated as the uncertainty on c (SP-7, MA-3). Where a spread is
          wanted the correct object is the spread across the six (series,
          window) fits at that alpha, which is 0.084 in c at NIST-I alpha = 1.
        - >-
          No two readings are averaged, blended, or combined. An average of
          non-independent modelling choices is not a better estimate of
          anything.
      envelope_membership_is_declared_not_chosen: >-
        The envelope is taken over exactly the 18 readings x 2 L4 scenarios =
        36 objects enumerated in independent_variables, with the IN-L2
        correction applied at both ends of its [0.60, 1.00] range, giving 72
        envelope members. No member is excluded for being inconvenient; an
        excluded member is INV-7.

    fitted_windows:
      id: XO-WIN
      statement: >-
        FIXED BEFORE ANY CURVE IS DRAWN. An evaluation point (p, w_mem, r) is
        DEFINED only if every predicate below holds. Otherwise it is UNDEFINED,
        is drawn as a gap, and names the failing predicate and the missing
        input. UNDEFINED IS NEVER EXTRAPOLATED AND NEVER INTERPOLATED ACROSS.
      window_ell: >-
        The reading's fit window in ell: W-ALL = the 47 admitted ell over
        2 <= ell <= 211; W-MID = the 43 admitted ell >= 11; W-TOP = the 8
        admitted ell in the top arm. The operating point is ell ~ B_opt ~
        2^14.2 at NIST-I, which is ABOVE EVERY WINDOW - about 6.48 unmeasured
        octaves at NIST-I and about 18 at log2 p = 768 (EV-PEC-857664
        boundaries). THIS PREDICATE IS FAILED BY CONSTRUCTION AT EVERY
        OPERATING POINT, and that is not a defect of the contract: it is the
        honest statement of what the campaign measured. It is therefore
        DECLARED SATISFIED ONLY UNDER HEUR-XO-1, which is named on every
        emitted object, and the number of unmeasured octaves is emitted as a
        first-class column (DEL-6) rather than as a footnote.
      window_p: >-
        The overhead law is fitted at the SINGLE p = 1099511627563. The
        baseline cost model is committed at log2 p in
        {256, 384, 512, 576, 768}. The DEFINED p range for a composed
        evaluation is therefore 256 <= log2 p <= 768, being the convex hull of
        the committed baseline grid. Any log2 p outside [256, 768] is
        UNDEFINED, naming MISSING-COST-MODEL-BELOW-256 (below) or the absence
        of any committed baseline evaluation (above).
      window_p_consequence_stated_plainly: >-
        IF THE SIGN OF D IS POSITIVE THROUGHOUT [256, 768] - WHICH IS WHAT THE
        COMMITTED MARGIN ROWS SAY - THEN THERE IS NO SIGN CHANGE INSIDE THE
        DEFINED RANGE, p* DOES NOT EXIST IN RANGE, AND THE HEADLINE LOCUS IS
        REPORTED AS NO_CROSSOVER_IN_RANGE WITH THE LOCATION OF THE ACTUAL
        CROSSING DECLARED UNDEFINED AND OUT OF WINDOW. That is falsification
        condition F6's first limb and it is a determinate deliverable.
      window_w_mem: >-
        w_mem in {2^20, 2^25, 2^30, 2^35, 2^40} exactly, and nowhere else. The
        model's vOW term is T_full/sqrt(min(w_mem, M)); any w_mem exceeding the
        modelled table size M at that p is UNDEFINED because the min() clamps
        and the memory axis stops responding - a flat or non-monotone p*(w_mem)
        in that regime would be a clamped model and not a physical finding
        (see instrument_response_check).
      window_k: "DEFINED only if k is transcribed per MISSING-K. Otherwise absolute-locus rows are UNRUN, not UNDEFINED - a distinct label, because the input is missing rather than out of range."

    preregistered_prediction:
      quantity: "The crossover locus p*(w_mem) and the ratio of its envelope width in log2 p to the matched margin band width"
      formula: >-
        P1 (the proposal's headline bound, TRANSCRIBED VERBATIM AND NOT
        SOFTENED): p*(w_mem) > 2^512 for every w_mem <= 2^40, under EVERY one
        of the eighteen measured-gamma readings and BOTH L4 scenarios.
        P2 (THE CENTRAL CLAIM): width(p* envelope in log2 p) / |p* in log2 p|
        < width([8.3498, 13.1544]) / 10.7521 = 4.8046 / 10.7521 = 0.44685 at
        the matched w_mem = 2^30 point. The comparator's numerator 4.8046 and
        denominator 10.7521 are derived arithmetic on the committed endpoints
        8.3498 and 13.1544 (EV-PEC-857664 OBS-M); the 4.805-bit span is stated
        in OBS-M itself and agrees.
        P3: both L4 scenarios are emitted separately and an explicit joint /
        split verdict on P1 is stated.
        P4 (KNOWN-ANSWER GATE): the machinery reproduces
        [8.3498, 13.1544] at (NIST-I, w_mem = 2^30) for all eighteen readings
        and both committed endpoints to within 0.001 bits.
        P5: every out-of-window point is disclosed as UNDEFINED with its
        missing input named.
      source: >-
        IDEA-20260803-48e258 predictions and falsification_conditions,
        transcribed; H-PEC-189c70 predictions. Comparator constants from
        EV-PEC-857664 OBS-M.
      never_tuned: >-
        These five are fixed by this contract. They are NOT adjusted after any
        evaluation. In particular P1 is NOT weakened, re-signed, or re-scoped
        to make it survive, notwithstanding
        coordinator_prior_before_execution's expectation that it will fail. A
        prediction the designer expects to fail, left standing, is what makes
        pre-registration non-decorative.

  # ---------------------------------------------------------------------------
  coordinator_prior_before_execution:
    why_this_block_exists: >-
      templates/research-records.md requires a coordinator_prior on a review
      plan so that "three reviewers concurred" and "three reviewers concurred
      with what the Coordinator already believed" are distinguishable. The same
      logic applies to a cost-model contract whose designer has already read
      the inputs: a designer who can see the answer and does not say so has
      made the pre-registration decorative in the other direction.
    the_finding_part_1_the_anchor_which_is_VERIFIED: >-
      EV-PEC-857664 OBS-M records that all eighteen measured-gamma readings put
      the modelled NIST-I margin at w_mem = 2^30 in [8.3498, 13.1544] bits -
      ALL STRICTLY POSITIVE. Under XO-DEF's frozen sign convention a positive
      margin means the assessed method is modelled CHEAPER than the baseline.
      This Coordinator reproduced the two bracket-endpoint rows at NIST-I from
      IN-MARGIN-MODEL-NIST1 and IN-C-BRACKET alone and obtained 13.0359
      (c = 1.327077) and 9.0460 (c = 1.576444), matching OBS-M to every
      printed digit, and the overhead decomposition checks independently
      (1.327077 * sqrt(256) = 21.2332, exactly OBS-M's overhead for that row).
      THIS PART IS VERIFIED AGAINST COMMITTED VALUES AT log2 p = 256 AND
      NOWHERE ELSE. At log2 p = 256 no p-scaling rule is exercised, so the
      anchor validates the margin arithmetic and validates NOTHING about the
      behaviour in p.
    the_finding_part_2_the_p_EXTENSION_and_its_scaling_rule: >-
      SEPARATED FROM THE ANCHOR BECAUSE IT IS A DIFFERENT CLAIM RESTING ON
      DIFFERENT INPUTS. IN-MARGIN-MODEL-NIST1 is pinned at NIST-I: both its 128
      and its 108.73088958800618 are log2 p = 256 quantities, and extending it
      across p requires a scaling rule for each.
      THE SCALING RULE IS COMMITTED, AND IT IS NOT AN INTERPOLATION - IT IS A
      PER-FIELD TABLE LOOKUP PLUS A CLOSED FORM. (i) The baseline scales as
      log2 T_DG(p) = log2(p)/2, committed as model.formulas.T_DG_baseline
      ("p^{1/2} = 2^{log2p/2}") and tabulated as per_field.*.baseline_log2TDG
      at 128 / 192 / 256 / 288 / 384 for the five field sizes - each exactly
      half its log2 p. (ii) The assessed cost scales by the committed closed
      form log2X = 0.5*log2B + (log2p - 1)/6; log2M = 2*log2X + log2(rho(w));
      log2P0 = -u*log2(u) with u = (log2p - 1)/(3*log2B);
      log2Tfull = log2M - log2P0, optimized over the committed B grid - and is
      TABULATED at all five field sizes as per_field.*.optimal.log2T
      (IN-COMMITTED-FIELD-GRID). (iii) The overhead scales as c(p)*sqrt(log2 p)
      with c(p) read per field from IN-C-BRACKET.
      SO THE EXTENSION USES NO UNCOMMITTED CONSTANT. The earlier draft of this
      block cited IN-MARGIN-MODEL-NIST1 as its basis, which was a CITATION
      DEFECT: the correct citations are IN-COMMITTED-FIELD-GRID and
      IN-C-BRACKET, and the NIST-I-pinned restatement is not the basis of any
      row above 256. The per-field margins are moreover not this Coordinator's
      reconstruction at all: they are recoverable directly from the committed
      per_field.*.van_oorschot_wiener['w=2^30']['c=0.0'].log2speedup_vs_DG
      outputs (34.2691 / 49.1256 / 64.8961 / 73.0188 / 98.0646) minus
      c(p)*sqrt(log2 p).
    the_finding_part_3_THE_EXTENSION_IS_NEVERTHELESS_NOT_DEFENSIBLE_AND_THE_CLAIM_IS_WITHDRAWN: >-
      THE "MONOTONICALLY INCREASING AND POSITIVE THROUGHOUT" CHARACTERISATION
      IS WITHDRAWN, NOT SOFTENED, AND THE REASON IS NOT THE SCALING RULE. It is
      that THE TWO COMMITTED RUNS OF EXP-WESOVOW-001 USE TWO DIFFERENT vOW
      MEMORY CONVENTIONS AND DISAGREE ON THE SIGN OF THE MARGIN AT EVERY FIELD
      SIZE, AND THIS CONTRACT'S ENTIRE INPUT SET DEPENDS ON WHICH ONE GOVERNS.
      (A) RUN-WESOVOW-001 - the run OBS-M cites and the run every one of the
      eighteen readings rests on - declares
      model.formulas.T_w_vOW = "T_full / sqrt(min(w, M))", i.e.
      log2 T(w) = log2 T_full - 0.5*log2 w_mem. At NIST-I, w_mem = 2^30, c = 0
      it outputs log2T_w = 93.7309, log2speedup_vs_DG = +34.2691,
      beats_baseline TRUE - and 34.2691 is exactly OBS-M's "base margin at zero
      overhead", so OBS-M is faithful to this run.
      (B) RUN-WESOVOW-201692-001, committed under the SAME experiment id and
      matching the current
      experiments/EXP-WESOVOW-001/cost_model.py, declares
      model.formulas.T_w_vOW = "T_full * sqrt(M / min(w, M))", i.e.
      log2 T(w) = log2 T_full + 0.5*max(0, log2 M - log2 w_mem). At the same
      point it outputs log2T_w = 140.3698, log2speedup_vs_DG = -12.3698,
      beats_baseline FALSE.
      THE TWO DIFFER BY EXACTLY 0.5*log2 M = 46.6389 BITS AT NIST-I and they
      differ in SIGN, not in precision. Under (A) the margins at w_mem = 2^30
      across the bracket are +13.0359/+9.0460, +24.9763/+19.9592,
      +38.2356/+32.4228, +45.2243/+39.0696, +67.1919/+60.1554 - positive and
      increasing. Under (B) they are -33.6030/-37.5929, -43.7676/-48.7846,
      -52.4823/-58.2951, -56.4292/-62.5839, -67.1514/-74.1880 - NEGATIVE and
      becoming MORE negative. Both trends are monotone; they run in opposite
      directions in sign, so "monotonically increasing and positive throughout"
      is a property of ONE of two conflicting committed variants and may not be
      stated as a property of the committed model.
    the_finding_part_4_what_this_does_to_the_P1_expectation: >-
      THE EXPECTATION THAT P1 FAILS IS DOWNGRADED FROM "FALSE BY INSPECTION" TO
      "CONDITIONAL ON VARIANT (A) GOVERNING", AND THE DIRECTION IF THAT
      CONDITION IS WRONG IS STATED RATHER THAN LEFT IMPLICIT.
      UNDER (A): the sign has already changed below log2 p = 256, the crossover
      in p lies outside XO-WIN.window_p from below, P1 ("p* > 2^512 for every
      w_mem <= 2^40") is FALSE, and F3 fires.
      UNDER (B): the assessed method LOSES to the baseline at every field size
      in range at every w_mem in the deliverable's grid, so there is NO sign
      change in p over [256, 768] at all; the verdict is NO_CROSSOVER_IN_RANGE
      with D negative throughout, and P1 is then NOT FALSIFIED - it is either
      vacuously satisfied or not evaluable, which is the OPPOSITE of the
      earlier draft's conclusion. Variant (B) additionally makes the memory
      axis non-vacuous: its committed crossover block reports the memory
      required to beat the baseline at c = 0 as log2 w* = 54.74, 69.24, 81.64,
      87.27 and 102.56 entries at the five field sizes, every one of them ABOVE
      the deliverable's largest plotted w_mem = 2^40 and below log2 M.
      A TELL THAT BEARS ON WHICH VARIANT IS COHERENT, RECORDED AS AN
      OBSERVATION AND NOT AS AN ADJUDICATION: variant (A)'s own committed
      crossover block reports log2 w* = -38.54, -22.54 and -6.54 entries at
      c = 0, 0.5 and 1.0 at NIST-I. A negative count of memory entries is not a
      memory requirement, and it is the signature of an unnormalized speedup
      term - T_full/sqrt(w) grants unbounded credit from memory with no
      reference to the table size M, whereas T_full*sqrt(M/min(w,M)) pays
      nothing at w = M and sqrt(M/w) below it. THIS OBSERVATION DOES NOT DECIDE
      THE QUESTION and this Coordinator does not decide it here: see
      blocking_preconditions PRE-4.
    the_finding_part_5_what_survives: >-
      SURVIVING, VERIFIED: the NIST-I anchor arithmetic (part 1); the fact that
      the p-scaling rule is committed in closed form and tabulated (part 2);
      and the fact that OBS-M is faithful to the run it cites.
      SURVIVING, CONDITIONAL: that P1 fails and F3 fires - true under variant
      (A) only.
      WITHDRAWN: "monotonically increasing and positive throughout" as a
      statement about the committed model.
      UNCHANGED AND STRENGTHENED: the expectation that this contract's headline
      deliverable is UNDEFINED or UNRUN. It now has a THIRD independent ground
      beyond F5 and F6 - that the sign of its own baseline comparison is
      contested between two committed runs of the experiment that supplies it.
    consequences_that_the_approver_must_weigh:
      - >-
        P1 AS WRITTEN IS EXPECTED TO FAIL IF AND ONLY IF vOW VARIANT (A)
        GOVERNS. It is retained verbatim and unaltered. Under variant (B) it is
        not falsified at all. The expected verdict is therefore FAIL-OR-NOT-
        EVALUABLE depending on PRE-4's resolution, and this Coordinator does
        not pre-empt that resolution.
      - >-
        F3 FIRING IS NOT A CONCRETE THREAT FINDING, contrary to
        IDEA-20260803-48e258, which calls it "the concrete threat finding the
        campaign has been unable to reach". A positive modelled margin at
        NIST-I is the campaign's EXISTING committed position, and that position
        is concrete_threat_nist1 = INCONCLUSIVE because the magnitude band is
        four to seven times the irreproducibility band (SP-4, which stands and
        is not met). F3 firing here restates a committed INCONCLUSIVE result;
        it does not upgrade it, and the Executor is FORBIDDEN from reporting it
        as a threat finding (see reporting_prohibitions).
      - >-
        THE HEADLINE LOCUS IS EXPECTED TO BE UNDEFINED OR UNRUN ON THREE
        INDEPENDENT GROUNDS. (i) F5: k is unquantified on the committed record
        even after the bibliographic subtask was executed, so the absolute
        locus is UNRUN. (ii) F6: under variant (A) the sign change lies below
        log2 p = 256, outside XO-WIN.window_p, so its location is UNDEFINED;
        under variant (B) there is no sign change in range at all. BOTH
        VARIANTS YIELD NO_CROSSOVER_IN_RANGE over the plotted range, reached
        from opposite sides - which makes it the one conclusion here that does
        NOT depend on PRE-4's resolution. (iii) PRE-4: the memory axis, which
        is the deliverable's whole point, is governed by one of two conflicting
        committed conventions differing by 0.5*log2 M = 46.6389 bits at NIST-I
        and disagreeing on beats_baseline.
      - >-
        WHAT REMAINS GENUINELY LIVE AND DECIDABLE, AND IS WHY THIS CONTRACT IS
        STILL WORTH RUNNING RATHER THAN WITHDRAWN: P4, the known-answer gate,
        is a real check on the reconstruction of the ten uncommitted readings
        and can fail. P2, the central conditioning claim, is computable WITHOUT
        k in ratio form and can fail (F2) - and if the locus is
        NO_CROSSOVER_IN_RANGE then P2 is ALSO not evaluable as written, which
        is itself the finding that the reconditioning argument does not survive
        contact with the declared windows. The null-baseline control CTL-3 and
        the adversarial-corner check CTL-4 are computable and can both fail.
        The instrument-response check can fail. And the negative deliverable -
        that the locus buys nothing over the scalar because it is UNDEFINED
        exactly where it would have to be read - is a real, citable, honest
        result that costs almost nothing to obtain.
    this_prior_is_not_evidence: >-
      Every number in this block is COORDINATOR-SIDE ANALYSIS OF COMMITTED DATA
      produced in a design session, and is governed by DEC-20260802-48c72c SP-5
      as extended: it may be cited as a design finding with this contract's ID
      and NEVER as run evidence, and it neither opens nor closes any gate. It
      does not pre-empt the Executor's own evaluation, which is performed
      independently from the frozen definitions and reported as found. If the
      Executor's result contradicts this prior, THE EXECUTOR'S RESULT GOVERNS
      and the disagreement is a finding to be reported, not reconciled.

  # ---------------------------------------------------------------------------
  independent_variables:
    - name: log2_p
      values: "continuous over the DEFINED range 256 <= log2 p <= 768, evaluated on a grid of step 0.25 plus bisection refinement"
      role: "the axis the locus is located on"
    - name: w_mem
      values: ["2^20", "2^25", "2^30", "2^35", "2^40"]
      role: "the free memory axis; the deliverable's whole point"
      binding_note: "SP-3 attached to every value other than 2^30"
    - name: reading
      values: >-
        18 = 6 fits (S-A, S-B x W-ALL, W-MID, W-TOP) x 3 alphas
        (0, 1, alpha_hat = 1.1596976732)
      role: "the declared modelling-choice span; NOT a sample"
    - name: L4_scenario
      values: ["ABSENT (gamma*log2 B_opt charged)", "PRESENT (that reading's own gamma*log2 B_opt removed)"]
      role: "the two-valued scenario that replaces a point estimate of the dominant residual term"
    - name: L2_correction_bits
      values: [0.60, 1.00]
      role: "signed pro-attack correction, applied at both ends, never netted"
    - name: overhead_convention
      values: ["corrected (this campaign's measured law)", "NULL: Section 4.1's one-operation-per-entry convention"]
      role: "the null-baseline control axis, CTL-3"

  controls:
    - id: CTL-1
      name: KNOWN-ANSWER GATE
      blocking_semantics: HARD BLOCKER
      statement: >-
        At (NIST-I, w_mem = 2^30), the locus machinery must return a modelled
        margin inside [8.3498, 13.1544] bits for EVERY one of the eighteen
        readings, and must reproduce the two committed extreme rows - S-A W-TOP
        at alpha_hat (overhead 25.9193, c 1.619957, margin 8.3498) and S-B
        W-ALL at alpha 0 (21.1147, 1.319669, 13.1544) - AND the six committed
        headline bracket rows of IN-EIGHTEEN-READINGS, each to within 0.001
        bits in margin and 1e-6 in c.
      if_it_fails: >-
        F1 FIRES. THE CURVE MACHINERY IS WRONG AND NOTHING MAY BE EMITTED - not
        a partial table, not a ratio-form curve, not a caveated figure. The
        Executor reports the residual per row and stops. A curve that cannot
        reproduce the point it generalizes is void.
      why_it_is_first: >-
        Ten of the eighteen rows are not committed row-by-row and must be
        reconstructed. This gate is the only thing standing between a
        reconstruction and an invention.
    - id: CTL-2
      name: FITTED-WINDOW GUARD
      blocking_semantics: "PER-POINT BLOCKER; annihilating failure is F6"
      statement: >-
        Every evaluation point is tested against XO-WIN before it is emitted.
        Out-of-window points are emitted as UNDEFINED with the failing
        predicate and the missing input named, and are drawn as GAPS. No
        interpolation across a gap, no extrapolation beyond a window, no
        silent re-windowing.
      if_it_fails: >-
        If the guard marks EVERY point of the deliverable UNDEFINED, F6 fires:
        the guard and the deliverable are mutually annihilating as specified,
        which is a defect of THIS CONTRACT rather than a refutation of the
        hypothesis, and the remedy is a superseding contract with an explicitly
        re-derived window predicate - never a loosened guard mid-run.
      why_it_exists: >-
        THE CAMPAIGN'S OWN BATCH-002 EXTRAPOLATION DEFECT IS THE EXACT FAILURE
        THIS PREVENTS: a law that discarded its measured intercept and returned
        c ~ 0 for an object measured at 2^12.26 to 2^12.32 multiplications per
        entry (EV-PEC-2e67ff OBS-E; DEC-20260802-48c72c SP-1, permanent). That
        defect was caught by REVIEW rather than by the contract. This control
        moves the catch into the contract.
    - id: CTL-3
      name: NULL-BASELINE CONTROL
      blocking_semantics: "NON-BLOCKING FOR EMISSION, BLOCKING FOR ATTRIBUTION"
      statement: >-
        Recompute the entire deliverable with the corrected overhead REPLACED
        by the frozen paper's Section 4.1 one-operation-per-entry convention
        (overhead_bits = 0, i.e. c = 0 with the level term also removed). Report
        the DISPLACEMENT of the locus - and, where the locus is
        NO_CROSSOVER_IN_RANGE under both conventions, report instead the
        displacement of D at each committed field size, which is a defined
        quantity under both conventions and is the correct fallback comparator.
        The displacement must equal the measured overhead to within the
        arithmetic tolerance.
      if_it_fails: >-
        F4 FIRES. If the locus (or the fallback D displacement) barely moves,
        the corrected overhead is NOT driving the result, the whole
        BATCH-002/003 contribution is not doing the work claimed for it here,
        and THE RECORD MUST BE RE-DESCRIBED rather than defended. The locus may
        still be real but is not attributable to this campaign's measurement.
      null_object_shape: >-
        This is a null of the SAME SHAPE - same model, same B grid, same
        Dickman routine, same p grid, same w_mem grid, same 18 readings where
        they still apply - differing in exactly one declared input. Per
        docs/inventor-protocol.md, controls before belief.
    - id: CTL-4
      name: ADVERSARIAL-CORNER CHECK
      blocking_semantics: "BLOCKING FOR ANY CLAIM OF THE PRE-REGISTERED BOUND"
      statement: >-
        Evaluate at the corner of the c bracket and the gamma readings MOST
        FAVOURABLE TO THE ATTACK - i.e. the corner minimizing the modelled
        overhead and therefore pushing the assessed method's cost DOWN and the
        crossover EARLIEST - with the IN-L2 correction at its most pro-attack
        end (1.00 bits) and the L4 PRESENT scenario. Report that corner
        EXPLICITLY, by name, with its p* value or its NO_CROSSOVER_IN_RANGE
        verdict.
      binding_direction_note: >-
        THE BRACKET'S LOW END IS THE OPTIMISTIC ONE AND MAY NOT BE TREATED AS
        CONSERVATIVE (MA-5; EV-PEC-857664 OBS-I). gamma_B = 0.8100336227 is a
        TRANSIENT of the unimproved shared schoolbook reduction; if the
        Karatsuba gain saturates and gamma_B -> gamma_A = 0.9328644281 the low
        end rises to c = 1.436129 and the NIST-I margin falls from 13.036 to
        11.291 bits. The Executor must therefore NOT treat the adversarial
        corner as a bound on the attack's advantage; it is a bound on THIS
        MODEL'S most attack-favourable admissible reading, and the saturation
        reading is emitted beside it.
      if_it_fails: "The pre-registered bound P1 is claimed ONLY if it survives this corner. If it does not, P1 is reported FAILED at the corner, naming the corner."
    - id: CTL-5
      name: INSTRUMENT-RESPONSE CHECK
      blocking_semantics: "BLOCKING FOR THE w AXIS"
      statement: >-
        w_mem is an externally imposed knob with a MONOTONE PREDICTED EFFECT:
        more memory helps the vOW baseline via T_full/sqrt(min(w_mem, M)) and
        therefore pushes p* in a single declared direction. A p*(w_mem) - or,
        under NO_CROSSOVER_IN_RANGE, a D(w_mem) - that is FLAT or NON-MONOTONE
        in w_mem means the baseline's memory dependence is not wired in and the
        instrument is not responding to the parameter it is built around.
      if_it_fails: >-
        The w axis is reported as NOT RESPONDING and no locus is claimed over
        it. The Executor must distinguish two causes and say which: (a) a wiring
        defect, or (b) the min(w_mem, M) clamp genuinely binding because w_mem
        exceeds the modelled table size M at that p - which is a MODEL
        SATURATION and not a defect. Case (b) is reported as a clamped region
        with M named at each p.
      why_it_exists: >-
        docs/inventor-protocol.md: a quantity that fails to respond to the
        parameter meant to move it is the canonical artifact tell. This is that
        check for the deliverable's own free axis.

  heuristic_under_test: null
  heuristic_under_test_note: >-
    NULL, CORRECTLY AND DELIBERATELY. This experiment validates NO heuristic.
    It INHERITS two - HEUR-XO-1 (the overhead law's extension beyond its fitted
    ell and p windows) and HEUR-XO-2 (the correctness of the baseline charging
    and its constant k) - and it is conditional on the frozen paper's own
    Heuristic 1, which remains UNVALIDATED: NC-3/NC-6 has never successfully
    executed once across GOAL-P13-001's entire budgeted history and its single
    attempt was a failed_infrastructure outcome, which is never evidence about
    Heuristic 1 either way (AGENTS.md rule 5; GOAL-P13-001 status_note,
    BATCH-403f13 outcome). THIS CONTRACT MUST NOT BE CITED AS REDUCING THE NEED
    FOR THAT PAIRING. P0 multiplies every one of the eighteen margin rows
    identically, so a constant-factor error in it moves the entire deliverable
    by the same amount.

  scale_relevance:
    tier: medium
    tier_cap_is_explicit: >-
      CAPPED AT `medium` AND MAY NOT BE EXCEEDED BY ANY EMITTED OBJECT. Per
      docs/claims-and-verification.md the `medium` tier covers fields up to
      ~64-96 bits with multiple instances/seeds, licensing "measurements on the
      tested range plus explicitly stated broader implications" and NOTHING by
      label alone. The source measurement is p = 1099511627563, one 80-bit
      F_{p^2}, so `medium` is the ceiling the inputs support.
      THE LOCUS ITSELF CARRIES NO CLAIM TIER AT ALL, exactly as the
      extrapolated c does not (DEC-20260802-48c72c
      citability_ruling.what_may_not_be_cited: "any figure in this batch as a
      cryptographic-scale measurement, or the extrapolated c as carrying a
      claim tier"). Every emitted object is labelled MODEL SUBSTITUTION; NO
      CLAIM TIER, and the `medium` cap governs the INPUT measurements it rests
      on. No `crypto` tier is available here and none is claimed. No
      review-breakthrough tier is available in this campaign and none is
      claimed (AGENTS.md rule 12; DEC-20260802-48c72c).
    justification: >-
      Tested parameters are a single 80-bit prime field and 47 prime degrees
      ell <= 211. Every NIST-level number is a MODEL SUBSTITUTION into
      RUN-WESOVOW-001's scenario grid, conditional on L1-L6, and the roughly
      6.48 unmeasured octaves at NIST-I (about 18 at log2 p = 768) remain an
      assumption whatever this experiment does. THIS EXPERIMENT DOES NOT REDUCE
      THAT GAP BY A SINGLE OCTAVE and must never be described as validating
      anything at cryptographic scale (AGENTS.md rule 7; MA-6).
    correspondence: null
    correspondence_note: "None. No sampling correspondence is used or available; nothing is sampled."

  tail_checks:
    - >-
      THE LARGE-p END IS THE TAIL THAT MATTERS, because the pre-registered
      bound P1 lives at log2 p = 512 and the o(1) term is treated as a constant
      across the whole plotted range. The Executor reports D and the envelope
      width at log2 p = 768, the top of the DEFINED range, and states
      explicitly how far the bound's evaluation point sits from the nearest
      committed measurement.
    - >-
      THE SMALL-p END IS WHERE THE SIGN CHANGE IS EXPECTED TO LIE AND IS OUT OF
      WINDOW. The Executor reports the sign of D at log2 p = 256 for all 72
      envelope members and states, as a bare fact, whether any member is
      negative there. It does NOT search below 256.
    - >-
      THE CLAMP TAIL: at each p, report M (the modelled table size) beside
      w_mem, and flag every (p, w_mem) where w_mem >= M so the vOW min() clamp
      is visible rather than absorbed. At NIST-I log2 M = 93.27781828665178
      (RUN-WESOVOW-001 per_field), so no plotted w_mem <= 2^40 clamps there;
      the check is nonetheless run at every p rather than assumed.

  metrics:
    primary:
      - id: MET-1
        name: crossover_locus_table
        definition: >-
          p*_r,s(w_mem) in log2 p, or the label NO_CROSSOVER_IN_RANGE with the
          sign of D throughout the range, or UNDEFINED with the failing XO-WIN
          predicate and the missing input named, or UNRUN with the missing
          input named - one value per (reading, L4 scenario, w_mem, L2 end,
          overhead convention). Machine-readable.
      - id: MET-2
        name: crossover_band_width_ratio
        definition: >-
          width(p* envelope in log2 p) / |p* in log2 p| at w_mem = 2^30,
          compared against the frozen comparator 4.8046 / 10.7521 = 0.44685.
          THIS IS THE CENTRAL CLAIM'S DECIDING METRIC. If p* is
          NO_CROSSOVER_IN_RANGE or UNDEFINED, this metric is reported as
          NOT EVALUABLE with the reason named, which is itself a determinate
          outcome against the hypothesis rather than a missing datum.
      - id: MET-3
        name: known_answer_gate_residual
        definition: "Per-row |margin_recomputed - margin_committed| in bits and |c_recomputed - c_committed|, for the eight committed rows; plus the in-band verdict for all eighteen."
      - id: MET-4
        name: null_baseline_displacement
        definition: "Displacement of p* (or, under NO_CROSSOVER_IN_RANGE, of D at each committed field size) between the corrected and Section-4.1 overhead conventions, in bits."
      - id: MET-5
        name: adversarial_corner
        definition: "The named corner (series, window, alpha, L2 end, L4 scenario) most favourable to the attack, and its p* value or NO_CROSSOVER_IN_RANGE verdict."
      - id: MET-6
        name: undefined_segment_inventory
        definition: "Every UNDEFINED and UNRUN (p, w_mem, reading, scenario) with the failing predicate and the missing input named for each. A count alone is not sufficient; the inventory is enumerated."
    secondary:
      - id: MET-7
        name: L4_scenario_separation
        definition: "For each (reading, w_mem): the two scenarios' p* values (or verdicts) side by side, and the joint/split verdict on P1."
      - id: MET-8
        name: instrument_response
        definition: "Monotonicity direction and magnitude of p* (or D) in w_mem per reading, plus the clamp flag w_mem >= M."
      - id: MET-9
        name: measured_vs_modeled_ledger
        definition: >-
          FOR EVERY EMITTED NUMBER, a label in {MEASURED, MODELED, DERIVED,
          TRANSCRIBED, UNDEFINED, UNRUN} with its source record ID and field.
          MEASURED is reserved for a quantity an instrumented run counted; on
          this deliverable that is essentially only the per-entry multiplication
          counts and REF_null = 12.2595 bits. The fitted (log2 A, gamma) pairs
          are MODELED-FROM-MEASURED, not MEASURED, and the fitted level at
          ell = B_opt is a FITTED value at an unobserved abscissa (CORR-3,
          MA-8). No column mixes labels.
      - id: MET-10
        name: hidden_overhead_disclosure
        definition: >-
          A per-row statement of what is hidden: the o(1) in p^(1/3+o(1))
          treated as constant over the plotted range; the unmeasured octaves
          (6.48 at NIST-I, ~18 at 768); L4's share (48-59 per cent of corrected
          overhead); L2's 0.60-1.00 pro-attack bits; RT3-C9's unmeasured 5-7
          pro-attack bits applied to no row; and k, unquantified and
          anti-attack if k > 1.
      - id: MET-11
        name: memory_accounting
        definition: >-
          log2 M (modelled table entries) at every evaluated p, beside
          log2 bytes at 64 and 256 bytes per entry, and the process
          peak_rss_bytes of the run itself reconciled against the analytic size
          of the run's own data structures. THE TWO ARE DIFFERENT OBJECTS and
          are never conflated: the attack's modelled memory is astronomic
          (log2 M = 93.27781828665178 entries at NIST-I) while this run's own
          footprint is a few tens of megabytes of floats.

  # ---------------------------------------------------------------------------
  # COST-MODEL CLASS REQUIREMENTS (design-experiment SKILL.md)
  # ---------------------------------------------------------------------------
  cost_model_class_compliance:
    measured_vs_modeled_separation: >-
      MET-9 makes the label a first-class column of the emitted table with a
      per-number source record ID, and no column mixes labels. The
      distinction is enforced structurally rather than by prose: the emitter
      writes the label beside the number or does not write the number.
    optimistic_assumption_disclosure:
      - assumption: "The o(1) in p^(1/3+o(1)) is treated as a constant across 256 <= log2 p <= 768."
        direction_of_bias: "UNKNOWN SIGN, POTENTIALLY UNBOUNDED. Named as the largest modelling gap. A locus is most sensitive to it exactly where P1 lives."
      - assumption: "HEUR-XO-1: the overhead law extends from ell <= 211 to ell ~ 2^14.2 and from p = 2^40 to p in [2^256, 2^768] with the same (log2 A, gamma)."
        direction_of_bias: "UNKNOWN SIGN; about 6.48 unmeasured octaves at NIST-I and ~18 at 768. No experiment in this repository reduces it by one octave."
      - assumption: "The bracket's LOW end (c = 1.327077) assumes an undiminished 0.075-bit-per-octave Karatsuba gain across 6.48 unmeasured octaves."
        direction_of_bias: "PRO-ATTACK / OPTIMISTIC. MA-5: the low end is the OPTIMISTIC reading and may not be treated as conservative; the HIGH end is defensible for this implementation family."
      - assumption: "L2: charging every entry at ell = B_opt."
        direction_of_bias: "ANTI-ATTACK by 0.60 to 1.00 bits at every field size. Applied as a signed correction, never netted (IN-L2)."
      - assumption: "RT3-C9 asymmetric realism: the null's Phi_2-based walk step is not a competent Delfs-Galbraith step."
        direction_of_bias: "ANTI-ATTACK, plausibly 5-7 bits, UNMEASURED and deliberately applied to NO row. SP-9 forbids the tempting substitution."
      - assumption: "k = 1 wherever a sensitivity row uses it."
        direction_of_bias: "PRO-ATTACK if the true k > 1. Permitted only as a DECLARED, LABELLED sensitivity row beside the UNRUN absolute-locus verdict."
      - assumption: "alpha = 1 rows."
        direction_of_bias: "Sign not established; the label is DERIVED and MECHANISM-INCONSISTENT on a toy-scale three-point basis (SP-10) and every alpha = 1 row inherits it."
      - assumption: "L4 PRESENT scenario: batched/quasi-linear evaluation removes gamma*log2(B_opt) entirely."
        direction_of_bias: "PRO-ATTACK and UNIMPLEMENTED. The subroutine has never been written; it is the frozen paper's own stated expectation, so it is not a speculative escape hatch, but it is also not a measurement."
    bound_labelling_rule: >-
      Any table produced under the pro-attack corner of these assumptions is
      labelled a BOUND on this model's most attack-favourable admissible
      reading, never a PREDICTION.
    memory_accounting: >-
      MET-11 makes peak memory first-class: the dominant modelled data
      structure is sized analytically as M table entries from the committed
      log2M formula, reported at every evaluated p, and the RUN's own measured
      peak_rss_bytes is reconciled against the analytic size of ITS OWN
      structures - never against M, which is a modelled quantity about a
      hypothetical attack. The time-memory tradeoff IS the deliverable: the vOW
      interpolation T_full/sqrt(min(w_mem, M)) is stated with its
      interpolation range and its clamp flagged wherever w_mem >= M.
    hidden_overhead_honesty: >-
      MET-10 requires a per-row disclosure. The headline p^(1/3+o(1)) hides a
      superpolynomial o(1); the contract says so on the object rather than in a
      footnote, and the deliverable reports it as a column.
    standardized_parameter_sets: >-
      Concrete costs are reported at the five committed standardized sets -
      SQIsign NIST-I / NIST-III / NIST-V and log2 p = 576 / 768 - and at no
      others. AFFECTED-VS-SAFE SCOPE: NOTHING IS AFFECTED. No cryptanalytic
      impact is claimed, so the affected set is EMPTY and the safe statement is
      that this record pressures no parameter set of any construction. NIST-III
      and NIST-V retain comfortable margins under every tested scenario and are
      not re-examined. CSIDH, (qt-)Pegasis and torsion-based constructions are
      explicitly disclaimed, as in the committed record. Nothing here bears on
      ECDLP, SIDH/SIKE, CSIDH, or SQIsign security.

  # ---------------------------------------------------------------------------
  replication:
    seeds: []
    seeds_note: >-
      EMPTY, AND A RANDOM SEED WOULD BE A FICTION HERE. This experiment is
      DETERMINISTIC ARITHMETIC AND DETERMINISTIC RE-EXECUTION over committed
      constants: no sampling, no randomness, no Monte Carlo, no stochastic
      optimizer. The B-grid search is an exhaustive deterministic sweep and the
      Dickman routine is a deterministic quadrature. Declaring a seed would
      imply a stochastic instrument that does not exist. The run manifest
      records `seed: 0` ONLY if the committed cost_model.py requires the field,
      and labels it INERT.
    independent_instances: 1
    replication_plan: >-
      REPLICATION IS BY BIT-FOR-BIT RECOMPUTATION, WHICH IS THE ONLY FORM OF
      REPLICATION A DETERMINISTIC INSTRUMENT ADMITS, AND ITS LIMITS ARE STATED
      RATHER THAN GLOSSED.
      (R1) SELF-REPRODUCTION: the emitter is run twice in separate processes
      and the two machine-readable outputs must be byte-identical. A difference
      indicates unordered iteration, hash randomization, or float
      non-determinism and is invalidation condition INV-8.
      (R2) INSTRUMENT REPRODUCTION: the committed cost_model.py reproduces
      IN-COMMITTED-FIELD-GRID exactly (XO-BASE reuse_verification_gate).
      (R3) INDEPENDENT RE-DERIVATION IS REQUIRED AND IS NOT R1 OR R2. A
      Validator in an independent session re-derives MET-2 and the CTL-1
      residuals FROM THE FROZEN DEFINITIONS AND THE COMMITTED INPUTS ONLY,
      with its own implementation, blind from the Executor's implementation and
      report. Recomputing a metric with the producer's code cannot catch an
      implementation that is wrong and self-consistent - it reproduces the
      error faithfully - so R1 and R2 are NOT replication of the inference and
      may not be described as such.
      HONEST LIMIT: no amount of recomputation replicates the MEASUREMENT.
      There is exactly one authorized source run (RUN-PEC-49c773-a) and
      EV-PEC-857664's strength is `preliminary`. Any evidence record arising
      from this experiment inherits that ceiling: the deliverable is at most
      `preliminary` on the inference axis however many times it recomputes,
      and C-REPRO-style agreement is INSTRUMENT replication and never
      INFERENCE replication.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 0.5
    maximum_memory_gb: 2
    maximum_runs: 2
    maximum_workers: 1
    compute_character: >-
      Deterministic re-execution of a committed pure-Python cost model over a
      p grid, plus bisection. No isogeny computation, no modular-polynomial
      acquisition, no network fetch except the optional MISSING-K transcription.
      The two authorized runs are the R1 self-reproduction pair, not two
      independent trials.
    the_binding_budget_is_not_compute: >-
      COMPUTE IS EFFECTIVELY FREE HERE AND IS NOT THE CONSTRAINT. The binding
      budgets are (a) AUTHORIZATION - GOAL-P13-001 is `closed_at_budget` with
      batches_remaining 0 and batches_consumed 4, and its next_action states
      that no further executor batch is authorized under the current spent
      budget; and (b) REVIEW CAPACITY - this contract requires an independent
      Validator re-derivation (R3) and, because it touches a
      concrete_threat position, an independent adversarial review before any
      citation. NO CEILING IS INVENTED HERE THAT THE GOAL RECORD DOES NOT
      CONTAIN: the goal's total_wall_clock_seconds is 21600 and max_concurrent
      is 3, and the numbers above sit far inside both. The goal's
      maximum_batches is null (no cap) by the user's explicit 2026-08-02
      direction, but batches_consumed 4 / batches_remaining 0 and the
      `closed_at_budget` status are what actually block dispatch, and removing
      a batch cap does not license a weaker result.

  stopping_rules:
    - "STOP IMMEDIATELY AND EMIT NOTHING if CTL-1 fails at any of the eight committed rows or any of the eighteen in-band verdicts (F1). Report the residuals and stop."
    - "STOP AND EMIT NOTHING if the XO-BASE reuse_verification_gate fails to reproduce IN-COMMITTED-FIELD-GRID (INV-2)."
    - "STOP AND EMIT NOTHING if the specification SHA-256 does not match the committed blob (INV-1)."
    - >-
      STOP THE ABSOLUTE-LOCUS ARM and continue with the ratio-form arm only, if
      k cannot be transcribed with a quoted excerpt and a hash (F5). Report the
      absolute locus UNRUN and do NOT evaluate P1.
    - >-
      STOP AND REPORT F6 rather than loosening any predicate, if CTL-2 marks
      every point of the deliverable UNDEFINED. The remedy is a superseding
      contract, not a mid-run adjustment.
    - "STOP the w-axis arm and report NOT RESPONDING if CTL-5 finds p* (or D) flat or non-monotone in w_mem, distinguishing a wiring defect from a genuine min() clamp."
    - "STOP on budget exhaustion and report the exhaustion AS SUCH. An exhausted budget is never a result and never evidence about the hypothesis (AGENTS.md rule 5)."
    - "STOP on any required input that is neither committed nor transcribable, and report it as UNDEFINED or UNRUN. NEVER estimate, recall, or interpolate it."

  invalidation_rules:
    - id: INV-1
      rule: "The specification SHA-256 recorded in the manifest does not match the committed blob. The run is INVALID: the protocol it claims to follow is not the frozen one."
    - id: INV-2
      rule: "The committed cost_model.py, re-executed, does not reproduce IN-COMMITTED-FIELD-GRID's log2B_opt / log2T_full / log2T_DG at all five field sizes. INVALID: the instrument is not the committed instrument."
    - id: INV-3
      rule: "Any emitted row pairs an intercept with the slope of a different fit, series, or window. INVALID: the binding pairing rule is violated (EV-PEC-857664 OBS-H)."
    - id: INV-4
      rule: "Any emitted row applies 11.502 or 13.247 bits of L4 to a reading it does not belong to, or treats them as two extremes of one scenario. INVALID (IN-L4 correction)."
    - id: INV-5
      rule: "The smoothness parameter w of IN-MODEL-FORMULAS is conflated anywhere with the memory axis w_mem. INVALID."
    - id: INV-6
      rule: "A bisection is entered without first exhibiting an opposite-signed bracket. INVALID: a root reported without a sign change is not a crossover."
    - id: INV-7
      rule: "Any of the 72 declared envelope members is omitted from the envelope. INVALID: a selectively-populated envelope is not an envelope."
    - id: INV-8
      rule: "The two R1 self-reproduction outputs are not byte-identical. INVALID pending diagnosis; a non-deterministic deterministic instrument is a defect, not a datum."
    - id: INV-9
      rule: "Any prohibited citation appears in any emitted artifact: a single c as 'the' overhead; c = 0.864 / 0.771 / 0.868 / 1.0389 / c_kappa as an estimate (SP-1, permanent); the per-row bootstrap endpoints as an uncertainty (SP-7, MA-3); a W-TOP-derived c as an estimate or bracket endpoint rather than in the window-choice sensitivity (SP-11); the NC2b-G1 pass as validation of the corrected law (SP-12, MA-7); C-NULL's per-step cost as a Delfs-Galbraith measurement (SP-9); 'all five predictions MET' as evidence of no top-of-range steepening (SP-8); or any figure as a cryptographic-scale measurement. INVALID."
    - id: INV-10
      rule: "Any emitted object omits the eight mandatory attachments MA-1..MA-8, the FC-4 label, Heuristic 1's unvalidated status, or the SP-3 attachment on a w_mem != 2^30 row. INVALID."
    - id: INV-11
      rule: "An infrastructure failure, timeout, crash, or missing dependency is reported as a mathematical result or as evidence about the hypothesis. INVALID (AGENTS.md rule 5)."
    - id: INV-12
      rule: "Any number appears in an emitted artifact without a MET-9 label and a source record ID. INVALID: an unlabelled number in a cost-model deliverable is indistinguishable from an invented one."

  success_criterion: >-
    DECIDABLE FROM THE PREDEFINED METRICS AND NOT A SYNONYM FOR A FAVOURABLE
    OUTCOME. The experiment SUCCEEDS AS AN EXPERIMENT if and only if ALL of:
    (S1) CTL-1 passes: MET-3 shows every one of the eighteen readings in
    [8.3498, 13.1544] and all eight committed rows reproduced to within 0.001
    bits in margin and 1e-6 in c;
    (S2) MET-6 is a complete enumerated inventory, so that every point of the
    deliverable is exactly one of DEFINED, UNDEFINED, UNRUN, or
    NO_CROSSOVER_IN_RANGE, with no point unaccounted for;
    (S3) MET-4 (CTL-3) and MET-5 (CTL-4) are both reported with their named
    corners and displacements;
    (S4) MET-9 labels every emitted number and MET-10/MET-11 are populated;
    (S5) R1 byte-identity holds and the R3 independent re-derivation is
    dispatched.
    THE HYPOTHESIS IS SUPPORTED, SEPARATELY AND ADDITIONALLY, only if MET-2 is
    EVALUABLE and strictly below the frozen comparator 0.44685. A run in which
    every success criterion S1-S5 holds and MET-2 is NOT EVALUABLE, or is at or
    above 0.44685, is A SUCCESSFUL EXPERIMENT THAT REFUTES ITS OWN HYPOTHESIS,
    and is reported that way.

  falsification_criterion: >-
    The hypothesis H-PEC-189c70 is FALSIFIED, in the exact scope of this
    contract, if ANY of F1-F6 fires. Each is decidable from the predefined
    metrics and each names its metric:
    F1 (MET-3) - the known-answer gate does not reproduce the committed margin
    band or misses a committed endpoint by more than 0.001 bits. HARD BLOCKER;
    the machinery is wrong and nothing is emitted.
    F2 (MET-2) - the crossover band is proportionally NO NARROWER than the
    margin band at the matched point. THE CENTRAL CLAIM IS FALSE, THE CURVE
    BUYS NOTHING OVER THE SCALAR, AND THAT NEGATIVE RESULT IS THE HONEST
    DELIVERABLE. MET-2 being NOT EVALUABLE because the locus is UNDEFINED or
    NO_CROSSOVER_IN_RANGE also falsifies the central claim, by a different
    route, and is reported as such rather than as a missing datum.
    F3 (MET-1) - any admissible reading puts p*(w_mem) at or below 2^512 for
    some w_mem <= 2^40: the pre-registered bound P1 FAILS. See
    reporting_prohibitions: this is a statement about a MODEL and is NOT a
    concrete threat finding, and coordinator_prior_before_execution expects it
    to fire.
    F4 (MET-4) - the null-baseline control shows the locus (or the fallback D
    displacement) barely moves: the corrected overhead is not driving the
    result and the record must be re-described.
    F5 (MISSING-K, MET-1) - k cannot be quantified: ratio form only, absolute
    locus UNRUN, P1 NOT EVALUATED. Likely on the committed record.
