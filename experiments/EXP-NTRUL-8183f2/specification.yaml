experiment:
  id: EXP-NTRUL-8183f2
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-6e6f2e; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-6e6f2e
  question_id: RQ-NTRU-9015ee
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Measure the rotation orbit's normalised correlation log-determinant against a rank-matched,
    norm-matched independent-plant null across ring degrees, and fit the resulting discount's growth
    in n
  objective: 'The uncertainty reduced is how much of an NTRU planted sublattice''s density is attributable
    to the vectors being an orbit rather than merely being short, and whether that quantity grows
    with dimension. (i) Does the normalised correlation log-determinant S separate the orbit arm from
    a rank-matched and Frobenius-norm-matched independent-plant arm at any tested n, with a Monte-Carlo
    standard error small enough that a difference is resolvable; (ii) if it separates, what is the
    sign, and does the pre-committed positive sign survive, since a negative sign would say the orbit
    is more orthogonal than independent vectors and would invert the usual intuition about ring structure;
    (iii) what is the growth shape of Delta(n) across n in {16, 32, 64, 128, 256}, adjudicated among
    extensive, logarithmic and bounded forms by an information criterion, this being the direct deliverable
    against KN-OPEN-026''s Q2 which asks whether the discount grows with dimension or is a bounded
    constant. The run also fixes an instrument: it establishes forced values, S = 0 for an orthogonal
    set, that any later profile or density work in this program can reuse as a calibration. Nothing
    in the run touches a modulus, a reduction algorithm or a cost model, which is what makes the result
    unit-clean and also what bounds what it can say.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable claim: for the tested ring family, the tested
      secret distributions and n in the tested set, the rotation orbit''s normalised correlation log-determinant
      differs from a rank-matched and norm-matched independent plant by Delta(n) with the reported
      CIs, and the growth shape preferred by AIC is X with weight w. What does NOT follow: no conversion
      of Delta into bits of security, no statement about reduction cost, block sizes or attack feasibility,
      no statement about the deployed NTRU Prime ring whose non-circulant shape is outside the tested
      family, and no claim that any published discount figure is confirmed, contradicted or reproduced,
      since this program cannot read the sources KN-OPEN-026 relays.'
  inputs:
    procedure: 'STAGE 0, cost minutes: implement exact integer Gram, correlation normalisation, and
      both determinant routes; run the two instrument nulls (orthogonal set must give S = 0 to 1e-12,
      rank-deficient set must diverge) and gate everything else on them passing. STAGE 1, cost minutes:
      implement the secret sampler and the independent-plant sampler with rejection matching on total
      Frobenius norm to 0.1 percent, plus an assertion that per-arm rank and dimension are identical.
      STAGE 2, cost tens of minutes: for each n in {16, 32, 64, 128, 256}, 500 orbit instances and
      500 null instances, computing S by the spectral route; for n <= 64 also by the exact-integer
      route with a required relative agreement of 1e-9. STAGE 3, cost minutes: unconditioned-null
      arm at 500 replicates per n to bound the conditioning bias. STAGE 4, cost minutes: report Delta(n)
      with standard errors, fit the three growth shapes, report AIC weights and the n-range over which
      the preference is stable. STAGE 5, cost minutes: repeat STAGE 2 with the all-ones spectral coordinate
      excluded and report both versions, since that coordinate is the leading confounder.'
    instrument: 'Pure Python 3. Exact integer arithmetic for Gram matrices and for the direct determinant
      route (Bareiss); Decimal at 50 digits for logarithms; the spectral route implemented as an exact
      integer autocorrelation followed by a high-precision eigenvalue computation of a symmetric circulant,
      which reduces to evaluating a real trigonometric polynomial and needs no external linear-algebra
      library. Instance generators and the matching assertion in a new harness/ module. harness/runner.py
      for manifests, environment capture and immutability. No Sage, no lattice-reduction library,
      no estimator: this contract deliberately touches none of them.'
    parameters: n in {16, 32, 64, 128, 256}; 500 orbit instances and 500 matched-null instances per
      n, plus 500 unconditioned-null instances per n; ring Z[x]/(x^n - 1); secrets ternary fixed weight
      at weight round(2n/3) as the primary arm and ternary uniform as a secondary arm at n in {32,
      128} only; norm-matching tolerance 0.1 percent; required spectral-versus-direct agreement 1e-9
      relative; no modulus is used anywhere in the contract.
  controls:
  - Independent-plant null, rank-matched and Frobenius-norm-matched, same code path, same invocation.
  - Unconditioned independent plant, to check that the norm conditioning does not bias the correlation
    structure.
  - Orthogonal generating set, forced S = 0, as an instrument calibration that gates the run.
  - Rank-deficient generating set, forced divergence, as the opposite-end instrument calibration.
  - Spectral versus exact-integer determinant cross-check at every n where the latter is affordable.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The independent-plant null: n vectors drawn independently from the
    identical secret distribution, rejection-conditioned to match the orbit''s total Frobenius norm
    within 0.1 percent, run through the identical correlation and log-determinant code path in the
    same invocation. The null must show a distribution of S_null whose Monte-Carlo standard error
    at 500 replicates is smaller than the claimed Delta; if it is not, no signal can be claimed at
    that n. A second, cheaper null validates the instrument: for n orthogonal vectors S must be exactly
    0, and for a deliberately rank-deficient set S must diverge, both of which the code path must
    reproduce before any measurement is recorded.'
  independent_variables:
  - ring degree n
  - arm in {orbit, matched independent plant, unconditioned independent plant}
  - secret distribution in {ternary fixed weight, ternary uniform}
  - all-ones spectral coordinate included or excluded
  metrics:
    primary:
    - S per instance
    - Delta(n) with Monte-Carlo standard error
    - sign of Delta and its CI
    - AIC weights across the three growth shapes
    - spectral-versus-direct relative error
    secondary:
    - difference between matched and unconditioned nulls
    - S with and without the all-ones coordinate
    - rejection rate of the norm matcher
    - wall-clock per instance
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Delta(n), the difference in normalised correlation log-determinant between the rotation
      orbit and a rank-matched, norm-matched independent plant, and its growth shape in n.
    formula: 'S = n*log(||f||^2 + ||g||^2) - sum_{j=0}^{n-1} log(|fhat_j|^2 + |ghat_j|^2), with fhat
      the length-n DFT of the coefficient vector of f; Delta(n) = S_orbit(n) - mean S_null(n). Predicted:
      Delta(n) > 0 with CI excluding zero for at least three of the five tested n, and a single growth
      shape carrying AIC weight >= 0.7.'
    source: Pre-registered in the parent proposal IDEA-20260816-6e6f2e before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: n in {16,...,256} spans dimensions 32 to 512 for the lattice these orbits sit in,
      which reaches the low end of deployed ring degrees, but the measured object is an orbit invariant
      and not a security quantity, so no transfer assumption is needed or made. The growth fit is
      extrapolatable in principle to larger n at negligible cost, and the contract requires that any
      such extrapolation be reported with its CI and never as a statement about a parameter set.
    correspondence: null
  tail_checks:
  - Secrets in the low-norm tail of the fixed-weight distribution, checked for whether they dominate
    S's spread.
  - Spectra with a near-zero coordinate, where log det is numerically delicate; these are counted
    and reported, not dropped.
  - n = 256 exact-integer route cost, checked before launching to avoid an unbounded Bareiss pass.
  - Rejection-matcher acceptance rate in the tails, which if very low means the null arm is a conditioned
    and therefore different distribution.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort if either instrument null fails its forced value.
  - Abort if the spectral and direct routes disagree beyond 1e-9 at any n where both are computed.
  - Stop the exact-integer route at the largest n completing within the declared per-instance wall-clock
    cap, recording that cap rather than silently dropping cells.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both instrument nulls pass, spectral and direct routes agree to 1e-9, and Delta(n)
    is reported with CIs at all five n together with AIC weights for the three growth shapes, whatever
    the sign and shape turn out to be.
  falsification_criterion:
  - Delta's CI contains zero at every n, recording a controlled null.
  - Delta negative with CI excluding zero, falsifying the pre-committed sign.
  - No growth shape reaching AIC weight 0.7, leaving Q2 unresolved by this instrument.
  - Instrument-null failure, which makes the run an invalid measurement.
  - Matched and unconditioned nulls differing significantly, meaning the matching created the effect.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-6e6f2e
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Whether the all-ones spectral coordinate should be in or out of the definition of S needs a Coordinator
    ruling before the primary metric is fixed; the contract measures both, but the primary must be
    named in advance.
  - The precise definition of 'matched' for the independent plant, in particular whether to match
    total Frobenius norm or per-vector norm, needs to be fixed before approval since the two give
    different nulls.
  - No derivation is offered for why the correlation log-determinant should be the right summary rather
    than, say, the smallest eigenvalue; the Coordinator should decide whether a second summary statistic
    is co-primary.
