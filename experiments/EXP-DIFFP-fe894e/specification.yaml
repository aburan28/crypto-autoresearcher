experiment:
  id: EXP-DIFFP-fe894e
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL, AND EXPLICITLY NULL RATHER THAN ABSENT. This contract
    builds and controls an ADJUDICATION INSTRUMENT -- a census, a declared
    equivalence relation, a path verifier, and a membership adjudicator -- and
    bears on no hypothesis about MD5 or SHA-1. GOAL-DIFFP-84d641 opens with
    active_hypothesis_ids empty on purpose: naming a hypothesis here would
    invite exactly the inference this contract cannot support, namely that a
    verdict from the instrument says something about the difference space. It
    says something about the census and the equivalence, and nothing else. A
    hypothesis about the difference space is a batch-2-or-later object and gets
    its own id.
  version: 1
  title: >-
    DIFFP-ADJ-1 -- the differential-path novelty adjudicator for MD5 and SHA-1:
    reference step functions, a path conformance verifier, a machine-readable
    census with per-entry provenance, a declared and individually VERIFIED
    equivalence relation, and the two controls (planted-positive recall and
    random-negative null against a plantable census) that decide whether the
    instrument can answer YES and NO at all
  status: approved
  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-f8bf86
  question_id: RQ-DIFFP-a5c483
  frozen_by_task: TASK-20260824-531f8a
  frozen_at: '2026-08-24'
  assigned_to: executor
  executor_task: TASK-20260824-c6625a
  approved_by: >-
    coordinator, TASK-20260824-531f8a (the opening control plane of
    BATCH-f8bf86). The approving decision BODY is carried verbatim in
    coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/batch.yaml under
    `opening_decision_body_pending_mint`. NO DEC IDENTIFIER WAS PRE-ALLOCATED
    FOR THIS GOAL'S OPENING and this Coordinator subagent has no shell, so it
    did not invent one: the driving session mints and files the opening decision
    with `python3 tools/allocate_id.py --next coordinator_decision --date
    20260824 --check`. DEC-20260824-af6d5c is RESERVED FOR THE BATCH CLOSE and
    must not be used here. UNTIL THAT OPENING DECISION FILE IS COMMITTED THIS
    CONTRACT IS FROZEN ON PAPER AND IS NOT DURABLE RESEARCH STATE (AGENTS.md,
    "Durable research commits"). The Executor may begin only against the
    committed contract at this path.
  objective: >-
    Decide, by direct construction and BEFORE any batch of this goal spends
    budget searching, whether this program can hold a CHECKABLE notion of "a new
    differential path for MD5 or SHA-1". Concretely, in this order: (1) pin
    reference MD5, SHA-1 and SHA-0 step functions and message expansions against
    their published test vectors; (2) build a PATH CONFORMANCE VERIFIER that,
    given a path object and a message pair, decides conformance and evaluates
    the sufficient-condition set; (3) DECLARE the equivalence relation as an
    explicit generator list and VERIFY each generator individually against the
    primitive's own step function, admitting only those that pass and listing
    the rest as excluded; (4) build the machine-readable CENSUS from sources an
    agent in this program actually opened, with per-entry citation provenance,
    and record every source it could not open as an explicit acquisition gap;
    (5) build the ADJUDICATOR that canonicalises a candidate and decides
    census membership, reporting the STRICT (verified generators only) and the
    PERMISSIVE (all declared generators) verdicts SEPARATELY; (6) run the two
    controls that decide whether the instrument works at all -- planted-positive
    recall and the random-negative null against a census containing plantable
    entries; (7) run the cheap KN-TECH-080 audits: observation collision against
    the canonical form, and the SHA-0 nearby-object control.
    A CONTROL THAT FAILS IS A COMPLETE AND VALUABLE OUTCOME, not a batch
    failure, and is reported with its integer counts and its named cause. AN
    EMPTY OR NEAR-EMPTY READABLE CENSUS IS ALSO A COMPLETE OUTCOME and is
    reported as a measured acquisition gap. NOTHING HERE CLAIMS ANY PATH IS NEW,
    claims any cryptanalytic improvement, or executes any search over the
    difference space.
  objective_budget_floor_note: >-
    templates/research-records.md sets budget floors of
    wall_clock_seconds_per_run >= 600 and maximum_memory_gb >= 8, and requires a
    contract below them to say why. BOTH ARE BELOW THE FLOOR HERE, deliberately.
    Per-run ceilings are 120-240 s because TASK-20260824-c6625a's whole declared
    budget is 900 s and must cover implementation plus six wrapper-charged runs,
    and because the modelled compute of every run is small: the dominant run is
    the null control at N = 1000 draws per family, each draw being a
    canonicalisation over an 80-step 32-bit-word vector plus a lookup against a
    census of tens of entries -- milliseconds per draw in unoptimised Python.
    maximum_memory_gb is 4 rather than 8 because the whole state of this
    contract is a few thousand 32-bit-word vectors and their canonical forms,
    peak far under 1 GB, and because max_concurrent is 2 on a 15 GB machine so a
    4 GB per-task declaration leaves headroom the batch actually needs. THE
    CEILINGS EXIST SO THAT A HALT IS LEGIBLE, NOT BECAUSE THE WORK NEEDS THEM. A
    halt at any ceiling is a budget outcome, reported with achieved progress and
    the ceiling named, and is never a negative mathematical result
    (AGENTS.md rule 5).

  inputs:
    specifications:
      md5: >-
        RFC 1321, including the Appendix A.5 test suite. The pinned copy already
        committed in this repository at
        coordination/goals/GOAL-MD5-001/batches/BATCH-1f30fe/inputs/rfc1321-md5.txt
        (sha256
        284a79d148400d9cd2a423211d1103b5cef0fb9256a4cbe6d7ebe5197c3149dd, as
        recorded in EXP-MDFIVE-a8e71e) IS THE PREFERRED SOURCE: REUSE THE
        COMMITTED PIN, DO NOT RE-FETCH. The Executor MUST re-compute and record
        the sha256 it actually observes and report any mismatch as an
        infrastructure finding rather than proceeding.
      sha1: >-
        FIPS 180-4's SHA-1 definition. NO PINNED COPY EXISTS IN THIS REPOSITORY
        as far as the opening survey found. The Executor has no web capability
        under orchestration/roles.yaml, so it MUST NOT attempt acquisition. It
        implements SHA-1 from the specification as it knows it, and then GATES
        THAT IMPLEMENTATION ON THE PUBLISHED TEST VECTORS reproduced below,
        which is what makes the implementation checkable without the document:
        SHA-1("abc") = a9993e364706816aba3e25717850c26c9cd0d89d and
        SHA-1("") = da39a3ee5e6b4b0d3255bfef95601890afd80709. THESE TWO DIGESTS
        ARE RECALLED BY THE COORDINATOR AND ARE MARKED `recalled` IN
        RQ-DIFFP-a5c483 TERMS: they are a self-check the Executor must confirm,
        and if either does not reproduce, THE IMPLEMENTATION OR THE RECALLED
        DIGEST IS WRONG and the run STOPS and reports which, rather than
        adjusting either to fit. An acquisition task for the primary
        specification is a batch-2 deliverable.
      sha0: >-
        SHA-0 (FIPS 180) is needed ONLY as the nearby-object control, and only
        its MESSAGE EXPANSION is needed: SHA-0's expansion is SHA-1's without
        the one-bit rotation. The Executor implements both expansions
        side by side, labels the SHA-0 one `nearby_object_control`, and makes NO
        claim about SHA-0's digest values or security.
    modules: >-
      A NEW package directory harness/diffpath/ is the ONLY code location this
      contract authorises, plus one NEW dedicated test file
      tests/test_diffpath_adjudicator.py. No existing harness module and no
      existing test file may be edited: tests/test_harness.py in particular is
      shared with concurrent campaigns and is OUT OF SCOPE here. The bound entry
      point is harness/diffpath/adjudicator.py; sibling modules under
      harness/diffpath/ are permitted, are staged with the snapshot, and are
      disclosed in the receipt's staged_not_in_binding_set.
    census_sources: >-
      ONLY SOURCES AN AGENT IN THIS PROGRAM ACTUALLY OPENED, under knowledge/
      and inputs/. The Executor enumerates what it finds and files everything it
      cannot open as an acquisition gap with a stable identifier. It may not
      populate a census entry from its own recollection: a recalled reference is
      a pointer for a reviewer and never support (AGENTS.md rule 9).
    quarantine_pointer: >-
      coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml,
      sha256 e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5,
      source KN-LIT-87e00e. THIS FILE IS NOT READ (IR-1 below). It enters the
      census as an entry with status `quarantined_not_read`, `path_data: null`,
      its sha256, its KN-LIT id, and an UNDETERMINED orbit. The Executor
      re-confirms the sha256 WITHOUT reading the content (hash the bytes, do not
      parse them) and attests non-reading.
    seeds:
      equivalence_generator_check: 20260824
      planted_path_generation_md5: 84064101
      planted_path_generation_sha1: 84064102
      null_draw_md5_delta_m: 84064103
      null_draw_sha1_dv_in_code: 84064104
      null_draw_sha1_dv_unconstrained: 84064105
      observation_collision_search: 84064106
    seeds_note: >-
      All seven seeds are declared HERE, before any run
      (fixed_before_acquisition), and are immutable once this contract is
      frozen. Generating any planted path, null draw, or search target by a
      procedure or seed other than those declared here INVALIDATES the run
      (IR-3).

  # =====================================================================
  # THE OBJECT SCHEMA -- what a "path" IS, machine-readably
  # =====================================================================
  path_object_schema:
    binding_status: >-
      A HARD TERM. The census, the verifier, the equivalence generators and the
      adjudicator all read the SAME object schema. The Executor may extend it
      with clearly-labelled optional fields; it may not fork it per primitive
      beyond the two variants below, because a per-primitive fork is how a
      canonical form silently stops being comparable.
    common:
      - id
      - primitive            # md5 | sha1
      - step_range           # [first_step, last_step], inclusive, 0-indexed
      - provenance           # recalled | retrieved | kb | internal
      - source_ref           # KN-LIT-*, path under inputs/, or internal task id
      - status               # readable | quarantined_not_read | acquisition_gap
      - conditions           # sufficient-condition set, normal form declared
    md5_variant:
      delta_m: >-
        Sixteen entries, one per message word, each recorded BOTH as a modular
        difference in Z/2^32 AND as a signed-bit-difference representation. The
        modular form is canonical; the signed form is derived and is recorded so
        a representation change is visible rather than silent.
      path: >-
        Per-step signed bit differences on the working state, one entry per
        step in step_range.
    sha1_variant:
      dv: >-
        The disturbance vector as 32-bit words over the declared step_range,
        recorded together with the DECLARED SEED WINDOW (which 16 consecutive
        words generate it under the linearized expansion) and a boolean
        `in_linearized_code` computed by the Executor, never assumed.
      path: >-
        The near-collision path induced by placing local collisions at the DV's
        set bits, per step.
    explicit_non_content: >-
      A census entry whose status is `quarantined_not_read` or `acquisition_gap`
      has `path_data: null` and carries only its identifier, provenance and (for
      the quarantined entry) its sha256. It is a POINTER. It contributes NOTHING
      to any covering number, and every covering number reported by this
      contract states how many pointers it excluded.

  # =====================================================================
  # THE DECLARED EQUIVALENCE RELATION -- generators, each VERIFIED OR EXCLUDED
  # =====================================================================
  equivalence_declaration:
    binding_status: >-
      A HARD TERM, and the intellectual centre of this contract. "Two paths are
      the same object" is a DECLARATION, not a discovery, and the declaration is
      only worth something if each generator is checked rather than assumed.
    quantifier_order: >-
      Stated explicitly per KN-TECH-080 audit 3. The membership claim is:
      FOR EVERY candidate path P, THERE EXISTS a census entry C and THERE EXISTS
      a group element g in <verified generators> such that g(P) = C, where g may
      depend on BOTH P and C. It is NOT claimed that a single g works for all P,
      and it is NOT claimed that the group is the full symmetry group of the
      difference space -- only that it is generated by the listed, verified
      generators. Any record restating the verdict must restate this order.
    generators:
      - id: E1
        name: step_shift_sha1
        statement: >-
          A SHA-1 disturbance vector is a codeword of the linearized message
          expansion; two DVs related by a whole-step shift of the expansion
          window are the same codeword read at a different offset.
        verification_check: >-
          Apply the shift to a DV, recompute the expansion from the shifted seed
          window, and require the resulting expanded vector to equal the
          original expanded vector over the overlapping steps, EXACTLY, on at
          least 64 seeded random codewords.
      - id: E2
        name: bit_rotation_sha1
        statement: >-
          SHA-1's message expansion and step function are conjectured here to
          commute with a simultaneous left-rotation of every message word by the
          same amount, making DV and rot(DV, b) the same object up to bit
          relabeling.
        verification_check: >-
          THIS IS A CONJECTURE AND IS TREATED AS ONE. For each b in 0..31 and at
          least 64 seeded random codewords, check that rot(expand(DV), b) equals
          expand(rot(DV, b)) EXACTLY. If it holds, E2 is verified for the
          expansion; then check that a conforming pair for the path is carried to
          a conforming pair for the rotated path under the corresponding rotation
          of the message. IF EITHER CHECK FAILS, E2 IS EXCLUDED AND SAID SO. The
          Coordinator's recollection that published DV families carry a rotation
          index is a `recalled` pointer and is NOT a reason to admit E2.
      - id: E3
        name: global_sign_flip
        statement: >-
          Swapping the two members of the message pair negates every signed
          difference. A path and its negation are the same object.
        verification_check: >-
          For at least 64 seeded planted paths per primitive, negate every
          signed difference and require that the negated path is conforming for
          the swapped pair, exactly.
      - id: E4
        name: signed_digit_representation_md5
        statement: >-
          A modular difference in Z/2^32 has many binary signed-digit
          representations. Two MD5 paths differing only in the signed-digit
          representation of identical modular differences are the same object;
          the canonical form is the modular difference itself.
        verification_check: >-
          Round-trip at least 4096 seeded random modular differences through the
          signed-digit encoder and decoder and require exact recovery; then
          verify that two distinct signed representations of one modular
          difference canonicalise identically and admit the same conforming
          pairs on a planted path.
      - id: E5
        name: condition_set_normalisation
        statement: >-
          Two paths whose sufficient-condition sets have the same solution set
          are the same object; the canonical form is a declared normal form of
          the condition set.
        verification_check: >-
          On a bounded condition alphabet, enumerate the solution set of the
          condition string and of its normal form and require exact set equality
          on at least 256 seeded random condition strings. IF THE NORMAL FORM IS
          NOT DECIDABLE WITHIN THE DECLARED BUDGET, E5 IS EXCLUDED AND SAID SO
          -- it is not weakened into a syntactic match and reported as if it were
          semantic.
      - id: E6
        name: block_index_reuse
        statement: >-
          For a multi-block attack, the same per-block characteristic used at a
          different block index or from a different chaining value is the same
          object AS A PER-BLOCK CHARACTERISTIC.
        verification_check: >-
          Verify that the per-block path's conformance predicate does not read
          the block index, and that a conforming pair at one chaining value
          yields a conforming pair for the same per-block path at a second
          seeded chaining value whenever the path's conditions are satisfied.
    declared_non_generators: >-
      RECORDED SO THE RELATION CANNOT SILENTLY WIDEN. The following make a
      GENUINELY DIFFERENT object and are never absorbed: a different set of
      active message words; a different Hamming weight of delta_m or of the DV;
      a different number of near-collision blocks; a DV outside the linearized
      code; a different step_range. An adjudicator that identifies any of these
      is broken, and the observation-collision audit is where that shows up.
    two_verdicts_reported_separately: >-
      The adjudicator reports STRICT membership (canonical form under the
      VERIFIED generators only) and PERMISSIVE membership (under all declared
      generators including the excluded ones) as TWO SEPARATE FIELDS. They are
      never merged, averaged, or reported as one number. Excluding a real
      equivalence over-declares novelty; admitting a false one under-declares
      it; reporting both bounds the error in a direction a reader can see.

  independent_variables:
    - "primitive: md5 | sha1 (with sha0 expansion as the nearby-object control)"
    - "equivalence generator under check: E1..E6"
    - "adjudication mode: strict (verified generators) | permissive (all declared)"
    - "candidate source: census entry | planted path | null draw | orbit image"

  controls:
    - id: CTL-BASE
      what: >-
        BASELINE REPRODUCTION (KN-TECH-080 audit 1). MD5 reproduces the RFC 1321
        Appendix A.5 test vectors exactly. SHA-1 reproduces the two digests
        declared in inputs.specifications.sha1 exactly. The path verifier, given
        a seeded RANDOM message pair and the actual per-step differential that
        pair induces, reports 100% conformance -- the degenerate baseline every
        verifier must pass before any interesting input is shown to it.
      can_it_fail: >-
        YES, and its failure is INFRASTRUCTURE SIGNAL, not a mathematical
        finding: it means the reference implementation or the recalled digest is
        wrong, and the run stops and says which.
    - id: CTL-PLANT
      what: >-
        PLANTED-POSITIVE RECALL. Generate at least 8 synthetic path objects per
        primitive from the declared seeds (a planted path is the actual
        differential a seeded random message pair induces, so it is conforming by
        construction and needs no literature). Insert them into a SHADOW CENSUS.
        Adjudicate each planted path AND every image of it under EVERY VERIFIED
        generator. All must return MEMBER under strict mode.
      criterion: >-
        Recall exactly 100%, reported as an integer fraction (hits / attempts),
        never as a percentage alone. Any miss is a STOP and is a finding about
        the adjudicator, reported with the missing case named.
    - id: CTL-NULL
      what: >-
        THE NULL CONTROL, AND THE REASON THE SHADOW CENSUS EXISTS. Draw N = 1000
        decoy difference vectors per family from the declared seeds: (a) MD5
        delta_m uniform at matched Hamming weight to the planted entries; (b)
        SHA-1 DVs uniform IN the linearized code; (c) SHA-1 DVs uniform in the
        unconstrained word space. Adjudicate every draw against a census that
        CONTAINS THE PLANTED ENTRIES, so that a false positive is possible.
      criterion: >-
        Zero MEMBER verdicts in strict mode across all three families, reported
        as integer counts per family. A nonzero count is a STOP and is a finding
        that the declared equivalence is TOO COARSE.
      can_it_fail: >-
        THIS IS THE WHOLE POINT AND IT IS WHY THE SHADOW CENSUS IS MANDATORY. A
        null control run against an EMPTY census returns NON-MEMBER for
        everything trivially and has measured nothing; it is recorded as VACUOUS
        and does not discharge this control. Family (b) is the sharp one: a
        uniform draw from the linearized code is a legitimate DV, so if the
        equivalence is too coarse this is where the false positive appears.
    - id: CTL-OBS
      what: >-
        OBSERVATION COLLISION (KN-TECH-080 audit 2), run in both directions. (i)
        Over a declared bounded slice, search for TWO DISTINCT ground-truth
        objects with EQUAL canonical form -- a direct falsifier of the
        equivalence as too coarse. (ii) Search for a path and a KNOWN-equivalent
        image (produced by a verified generator) with DIFFERENT canonical forms
        -- a direct falsifier of the canonicaliser as incorrect. Report every
        collision found, with both objects, as a required artifact.
      criterion: >-
        Direction (ii) must find ZERO discrepancies; any discrepancy is an
        implementation defect and a STOP. Direction (i) findings are REPORTED,
        not required to be zero: a collision there is a real finding about the
        declared relation and is exactly what this audit exists to surface.
    - id: CTL-NEARBY
      what: >-
        NEARBY-OBJECT CONTROL (KN-TECH-080 audit 4). SHA-0's message expansion
        differs from SHA-1's by one rotation. Run the identical
        `in_linearized_code` test and the identical canonicalisation against
        DVs drawn for SHA-0's expansion and require the adjudicator to SEPARATE
        the two spaces: a SHA-0 codeword drawn uniformly must not test as a
        SHA-1 codeword except at the measured, reported rate.
      why: >-
        A method that cannot distinguish the closest object where the hoped-for
        structure differs has not identified the load-bearing structure. If the
        adjudicator cannot separate SHA-0 from SHA-1 expansions, its SHA-1
        verdicts mean much less than they appear to, and that must be on the
        record before anyone reads a covering number.
    - id: CTL-QUAR
      what: >-
        QUARANTINE NON-READING ATTESTATION. The sha256 of
        coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml
        is recomputed from the bytes WITHOUT parsing them and compared to
        e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5, and
        the execution report carries an explicit statement that no task read,
        extracted or reconstructed the payload.

  metrics:
    primary:
      - >-
        Per generator E1..E6: VERIFIED or EXCLUDED, with the integer pass/fail
        counts of its verification check and, on exclusion, the named failing
        case.
      - >-
        CTL-PLANT recall as an integer fraction (hits / attempts), per primitive
        and per generator-image class.
      - >-
        CTL-NULL false-positive counts as integers, per family (md5 delta_m,
        sha1 DV in-code, sha1 DV unconstrained), in strict mode and separately in
        permissive mode, against the plantable census.
      - >-
        Census size as integers, decomposed: readable entries, quarantined_not_
        read pointers, acquisition_gap pointers. THE THREE ARE NEVER SUMMED INTO
        ONE "census size".
      - >-
        Number of distinct ORBITS the READABLE census occupies under the strict
        equivalence, as an integer, with the pointer entries excluded and the
        exclusion count stated beside it.
      - >-
        CTL-OBS: number of collisions found in direction (i) and number of
        discrepancies in direction (ii), as integers, with the colliding objects
        listed.
      - >-
        CTL-NEARBY: measured rate at which a uniform SHA-0-expansion codeword
        tests as a SHA-1 codeword, as an integer fraction over the declared N.
    secondary:
      - wrapper-measured wall-clock seconds and peak memory per run
      - >-
        code_path_fingerprint per run: fully qualified names of the
        canonicalisation and membership functions invoked, plus the generator
        set actually in force
      - >-
        the acquisition-gap list: every source the Executor could not open, with
        a stable identifier, so batch 2's acquisition task is specified by
        measurement rather than by recollection
      - >-
        search_knowledge query strings and outcomes, recorded verbatim, for
        every assertion about what has or has not been tried

  heuristic_under_test: null
  heuristic_under_test_note: >-
    This contract tests no heuristic. E1..E6 are DECLARATIONS checked by direct
    computation, not heuristics: each has a finite verification check with a
    pass/fail outcome, and a failing check EXCLUDES the generator rather than
    weakening a conditional claim. If a later batch needs an unprovable
    uniformity premise over the difference space, it is numbered as a heuristic
    then, in its own hypothesis, with its own validation experiment
    (docs/claims-and-verification.md, "Heuristic-conditional claims").

  preregistered_prediction:
    quantity: >-
      The number of READABLE census entries this contract can populate from
      sources present in this repository, per primitive.
    formula: >-
      readable_md5 = 0 and readable_sha1 = 0.
    source: >-
      DIRECT OBSERVATION OF THE CORPUS BY THE COORDINATOR AT OPENING, not a
      theorem: knowledge/literature holds exactly one MD5 collision-path source
      (KN-LIT-87e00e) whose entry states it carries no path data and points at a
      quarantined payload this contract may not open, and a search of
      knowledge/literature for SHA-1-tagged entries returned none carrying
      disturbance-vector data. THE PREDICTION IS RECORDED BEFORE THE RUN SO THAT
      A NONZERO RESULT IS LEGIBLE AS A RESULT rather than absorbed: if the
      Executor finds readable path data anywhere under knowledge/ or inputs/,
      that is a genuine discovery about this corpus and the Coordinator's
      opening survey was incomplete. It is a prediction, not a result, and no
      run has occurred.

  scale_relevance:
    tier: toy
    justification: >-
      Everything in this contract is bounded, self-contained instrument work:
      64-to-4096-sample verification checks per generator, 8 planted paths per
      primitive, 1000 null draws per family, and canonicalisation over 80-step
      32-bit-word vectors. NO SEARCH OVER THE DIFFERENCE SPACE IS RUN, no
      full-primitive collision is attempted, and no figure here is extrapolated
      to any attack complexity. The `toy` tier describes the tested scale of the
      INSTRUMENT CHECKS; it is not a claim that a later search must be toy.
      TRANSFER ASSUMPTION, STATED: that an adjudicator correct on planted paths
      and null draws is also correct on published paths is NOT assumed and NOT
      claimed -- it cannot be tested until the census has readable entries,
      which is precisely what the acquisition gap blocks, and that limitation is
      the honest ceiling of this contract.
    correspondence: null

  tail_checks:
    - >-
      Report the single most nearly-matching null draw in each family -- the
      draw whose canonical form is closest to a census entry's under the
      declared distance -- with its distance, rather than only the count of
      exact false positives. A relation that is close to collapsing looks
      identical to a safe one when only the exact count is reported.
    - >-
      Report the orbit-size distribution over the planted entries, not just the
      orbit count: an equivalence whose orbits are all size 1 is doing no work
      and must be visible as such.

  replication:
    seeds: [20260824, 84064101, 84064102, 84064103, 84064104, 84064105, 84064106]
    independent_instances: 1
    independent_instances_note: >-
      One instance per check. Replication at a second seed set is an explicit
      OPEN DIRECTION for a later batch, not part of this contract; its absence
      is a stated limit and not an oversight. The checks are deterministic given
      the seeds, so the Validator's replication is a cold re-run to exact integer
      agreement rather than a statistical comparison.

  run_plan:
    - run: 1
      suffix: buildcheck
      contents: CTL-BASE (MD5, SHA-1, SHA-0 expansion, verifier degenerate baseline) and CTL-QUAR
      ceiling_seconds: 120
      gate_condition: none -- runs first
    - run: 2
      suffix: equivalence-verification
      contents: The E1..E6 verification checks; emits the VERIFIED generator set
      ceiling_seconds: 180
      gate_condition: >-
        RUNS ONLY IF run 1 passed. If NO generator verifies, the run reports the
        empty verified set and the contract STOPS after run 3's census build:
        there is no defensible canonical form and no adjudication is attempted.
    - run: 3
      suffix: census-build
      contents: Census assembly from openable sources, provenance per entry, acquisition-gap list, shadow census with planted entries
      ceiling_seconds: 180
      gate_condition: RUNS ONLY IF run 1 passed.
    - run: 4
      suffix: controls
      contents: CTL-PLANT then CTL-NULL, in that order, against the plantable census
      ceiling_seconds: 240
      gate_condition: >-
        RUNS ONLY IF the verified generator set from run 2 is NONEMPTY. CTL-NULL
        is skipped and recorded VACUOUS if the census contains no plantable
        entries -- which cannot happen, because the shadow census is mandatory.
    - run: 5
      suffix: observation-collision
      contents: CTL-OBS directions (i) and (ii)
      ceiling_seconds: 120
      gate_condition: RUNS ONLY IF run 4's CTL-PLANT passed.
    - run: 6
      suffix: nearby-object
      contents: CTL-NEARBY, the SHA-0 expansion control
      ceiling_seconds: 120
      gate_condition: RUNS ONLY IF run 1 passed.
  run_plan_arithmetic: >-
    120 + 180 + 180 + 240 + 120 + 120 = 960 s of run ceilings. These are
    CEILINGS, not a plan: the modelled compute of all six runs together is well
    under 60 s, and TASK-20260824-c6625a's 900 s declared budget covers
    implementation plus the runs that actually execute. If the ceilings were all
    consumed the task would halt truthfully at its own 900 s budget with the
    ceiling named, which is the intended legible failure and not a
    mis-declaration.

  budget:
    wall_clock_seconds_per_run: 240
    wall_clock_seconds_per_run_note: >-
      240 s is the MAXIMUM any single run may take; per-run ceilings are set
      individually in run_plan (120, 180, 180, 240, 120, 120). See
      objective_budget_floor_note for why these are below the template's 600 s
      floor.
    total_cpu_hours: 0.3
    maximum_memory_gb: 4
    maximum_runs: 6
    maximum_workers: 1

  stopping_rules:
    - >-
      Every run is charged through harness.runner.run_wrapped with an explicit
      deadline on the monotonic clock. A deadline hit is a BUDGET OUTCOME,
      reported with achieved progress and the ceiling named, and is never a
      negative mathematical result and never a finding about the difference
      space.
    - >-
      If CTL-BASE fails in run 1, the Executor STOPS before everything else and
      reports which of the reference implementation, the RFC pin, or the
      recalled SHA-1 digest disagrees. This is INFRASTRUCTURE SIGNAL (AGENTS.md
      rule 5), not a finding.
    - >-
      If run 2 verifies NO generator, the Executor completes the census build
      (run 3) and STOPS. No adjudication is attempted without a defensible
      canonical form; the empty verified set is the reportable result.
    - >-
      If CTL-PLANT misses any planted path or orbit image, the Executor STOPS
      before CTL-OBS, reports the missing case, and does NOT report a null-
      control result as if the adjudicator worked.
    - >-
      If CTL-NULL returns any strict-mode false positive, the Executor reports
      the count and the colliding pair and STOPS. A false positive is a finding
      that the declared equivalence is too coarse; it is not repaired in-run by
      dropping a generator, because dropping a generator after seeing the data
      is exactly the protocol amendment AGENTS.md forbids without a versioned
      record.
    - >-
      If direction (ii) of CTL-OBS finds any discrepancy, that is an
      implementation defect and a STOP.
    - >-
      Implementation of harness/diffpath/ is budgeted inside the task's 900 s and
      is engineering time, not a scored run. Total TASK-20260824-c6625a
      wall-clock may not exceed 900 s.

  invalidation_rules:
    - id: IR-1
      text: >-
        ANY READ, PARSE, EXTRACTION OR RECONSTRUCTION OF
        coordination/goals/GOAL-MD5-001/quarantine/** invalidates the entire run
        regardless of outcome, and is additionally a cross-goal contamination
        finding reported to GOAL-MD5-001. Hashing the file's bytes without
        parsing them is permitted and required (CTL-QUAR); parsing them is not.
    - id: IR-2
      text: >-
        ANY CENSUS ENTRY POPULATED FROM RECOLLECTION rather than from a source
        the Executor actually opened invalidates every covering number and every
        orbit count derived from the census (AGENTS.md rule 9). A recalled
        reference may appear ONLY in the acquisition-gap list, with
        `path_data: null`.
    - id: IR-3
      text: >-
        Any planted path, null draw, or search target generated by a procedure or
        seed other than the exact deterministic ones frozen in inputs.seeds.
        These are IMMUTABLE once this contract is frozen.
    - id: IR-4
      text: >-
        A NULL-CONTROL RESULT REPORTED WITHOUT A PLANTABLE CENSUS. A null run
        against a census that contains no entry a draw could possibly match is
        VACUOUS and must be recorded as vacuous; reporting it as a passed control
        invalidates the control.
    - id: IR-5
      text: >-
        AN EQUIVALENCE GENERATOR ADMITTED TO THE STRICT GROUP WITHOUT ITS
        VERIFICATION CHECK PASSING, or a strict and permissive verdict merged
        into a single reported number.
    - id: IR-6
      text: >-
        ANY EDIT TO tests/test_harness.py OR TO ANY EXISTING harness/ MODULE.
        Only harness/diffpath/** and tests/test_diffpath_adjudicator.py may be
        written.
    - id: IR-7
      text: >-
        A run manifest lacking code_path_fingerprint, or naming an experiment id
        other than the literal string EXP-DIFFP-fe894e. (The producer-chosen-id
        drift recorded at DEC-20260822-d7c2d0 F-8 on GOAL-MD5-001 is a known
        failure mode and is closed here by making the id a hard term.)
    - id: IR-8
      text: >-
        ANY SEARCH OVER THE DIFFERENCE SPACE, any attempt at a collision, or any
        cost projection toward an attack complexity. This contract builds and
        controls an instrument; it does not use one. Search is a later batch's
        contract and needs its own approval.
    - id: IR-9
      text: >-
        ANY WORK THAT IS SOLVER VALIDATION rather than difference-space
        adjudication. If the Executor finds itself measuring whether a
        characteristic-search solver works, it STOPS and reports the observation
        for handoff to GOAL-MD5-001 (GOAL-DIFFP-84d641 non_duplication).

  success_criterion: >-
    SC-1 (THE CONTROLS, FIRST, BECAUSE THEY ARE THE POINT). CTL-BASE passes;
    CTL-PLANT reports 100% recall as an integer fraction over every planted path
    and every image under every VERIFIED generator; and CTL-NULL reports zero
    strict-mode false positives, as integer counts per family, AGAINST A CENSUS
    CONTAINING PLANTABLE ENTRIES. A CONTROL THAT FAILS, HONESTLY REPORTED WITH
    ITS INTEGER COUNTS AND ITS NAMED CAUSE AND WITH THE DOWNSTREAM RUNS NOT
    EXECUTED, ALSO SATISFIES THIS CONTRACT: it is a complete and admissible
    outcome, and every criterion below is then returned not_applicable with that
    reason rather than quietly passed.
    SC-2. Every generator E1..E6 carries a VERIFIED or EXCLUDED verdict with the
    integer counts of its check, and the strict group is exactly the verified
    subset.
    SC-3. The census exists as a machine-readable artifact with per-entry
    provenance, its three counts (readable / quarantined_not_read /
    acquisition_gap) reported separately and never summed, and an
    acquisition-gap list specified well enough for a batch-2 acquisition task to
    act on. AN EMPTY READABLE CENSUS SATISFIES THIS CRITERION and is reported as
    the measured acquisition gap it is.
    SC-4. The adjudicator reports strict and permissive verdicts as separate
    fields on every adjudication it performs.
    SC-5. CTL-OBS direction (ii) reports zero discrepancies; direction (i)
    reports its collisions, whatever their number, with both objects listed.
    SC-6. CTL-NEARBY reports the measured SHA-0-versus-SHA-1 separation rate as
    an integer fraction.
    SC-7. CTL-QUAR passes and the non-reading attestation is present; every run
    manifest carries code_path_fingerprint and the literal experiment id
    EXP-DIFFP-fe894e; every figure is labelled MEASURED or MODELED; no figure
    projects toward any attack complexity; and the execution report states
    explicitly that NO PATH IS CLAIMED NEW and NO SEARCH WAS RUN.
  falsification_criterion: >-
    This contract's checks are two-sided by construction and each has a defined
    failing outcome that is a RESULT rather than a defect, except where noted as
    infrastructure. (a) A generator's verification check fails: that generator is
    EXCLUDED, and if all six fail there is no defensible canonical form and the
    adjudication approach as declared is falsified at these parameters. (b)
    CTL-PLANT misses a planted path or an orbit image: the adjudicator is
    incomplete, and the missing case names where. (c) CTL-NULL returns a strict-
    mode false positive: THE DECLARED EQUIVALENCE IS TOO COARSE, and the
    colliding pair is the counterexample certificate. (d) CTL-OBS direction (i)
    finds distinct ground-truth objects with equal canonical form: identifiability
    fails and "new" is being over-declared as "old". (e) CTL-OBS direction (ii)
    finds a discrepancy: implementation defect, a STOP, infrastructure signal.
    (f) CTL-NEARBY cannot separate the SHA-0 and SHA-1 expansions: the
    adjudicator has not captured the load-bearing structure and its SHA-1
    verdicts are correspondingly weaker, which must be stated wherever they are
    cited. (g) CTL-BASE fails: infrastructure signal, never a mathematical
    finding.

  required_artifacts:
    - >-
      harness/diffpath/adjudicator.py -- the bound entry point: the path object
      schema, the canonicaliser, the strict/permissive membership decision, and
      the two controls' drivers. Sibling modules under harness/diffpath/ carrying
      the reference MD5, SHA-1 and SHA-0 step functions and expansions, the path
      conformance verifier, the equivalence generators, and the census loader are
      permitted and are staged with the snapshot.
    - >-
      tests/test_diffpath_adjudicator.py -- a NEW dedicated test file. No
      existing test file is edited.
    - >-
      A machine-readable census artifact under the task directory, with
      per-entry provenance, the three separated counts, and the acquisition-gap
      list.
    - >-
      An equivalence-declaration artifact recording, per generator, its
      statement, its verification check, its integer pass/fail counts, and its
      VERIFIED or EXCLUDED verdict.
    - >-
      A null-control result artifact with the per-family integer counts in both
      modes, the plantable-census attestation, and the closest-non-matching draw
      per family with its distance.
    - >-
      Run directories under the task path for every executed run: command,
      environment, seeds, manifest carrying code_path_fingerprint and the
      literal experiment id EXP-DIFFP-fe894e and an armed deadline, raw
      machine-readable results, stdout and stderr, and the full AGENTS.md
      Artifact Policy set including requested policy, backend, resolved model
      identifier and whether probe-verified, reasoning effort, fallback and
      degraded fields, wrapper-measured wall-clock and peak memory.
    - >-
      An execution report stating, in this order: the CTL-BASE verdict; the
      per-generator VERIFIED/EXCLUDED table; the three census counts; the
      CTL-PLANT and CTL-NULL integer results with the plantable-census
      attestation; the CTL-OBS and CTL-NEARBY results; the quarantine
      non-reading attestation; the search_knowledge queries and outcomes; actual
      wall-clock against declared ceilings with unspent ceilings reported as
      unspent; and an explicit closing statement that NO PATH IS CLAIMED NEW and
      NO SEARCH OVER THE DIFFERENCE SPACE WAS RUN.

  interpretation_limits:
    - >-
      CLAIM CEILING `analyzed`, NEVER `supported`, for every record derived from
      this contract. It carries no asymptotic claim; three of CLAUDE.md's four
      supported-promotion gates are structurally unmet by a batch of this kind
      and the fourth is not attempted.
    - >-
      A PASSING CONTROL SET LICENSES ONLY: "the adjudicator recalls planted paths
      and their verified-generator images, and rejects the declared null draws,
      at these parameters, against this census." It does not license "the
      adjudicator identifies published paths correctly" -- which cannot be tested
      until the census has readable entries -- and it says nothing whatsoever
      about MD5's or SHA-1's difference space.
    - >-
      A NON-MEMBER VERDICT IS SCOPED TO THE CENSUS THAT PRODUCED IT. Against a
      census with zero readable entries it means "not in an empty census", which
      is no information at all, and every record citing such a verdict must say
      so in the same sentence. It is never novelty.
    - >-
      A MEMBER VERDICT means "equivalent to a census entry under the verified
      generators", never "identical to a published path" and never "already
      known".
    - >-
      NOVELTY IS UNVERIFIED AND NO NOVELTY CLAIM IS MADE OR LICENSED by anything
      in this contract, for any path, for either primitive.
    - >-
      Nothing here bears on GOAL-MD5-001's blind calibration criterion, on
      GOAL-SHA1-001's detector-coverage question, or on the security of any
      deployed system, repository, certificate or archive.

  open_directions:
    - >-
      ACQUISITION IS THE BINDING CONSTRAINT AND IS BATCH 2's OBJECT. The census
      cannot be populated from this repository; a task with web capability must
      obtain primary sources carrying actual path and disturbance-vector data
      and file them as KN-LIT, under a firewall discipline compatible with
      GOAL-MD5-001's BCP-1 so that neither goal's criterion is contaminated.
    - >-
      THE COVERING MEASUREMENT is the natural next rung once the census is
      nonempty: how many orbits, over what enumerable slice, covering what
      fraction. Its slice definition must be fixed before acquisition of the
      data that would tune it.
    - >-
      E2 (the SHA-1 bit-rotation equivalence) is the generator most likely to
      change the covering number by a large factor if it verifies, and is the
      single cheapest thing in this contract that could surprise its author in
      either direction.
    - >-
      A DECLARED DISTANCE on canonical forms would turn membership from a
      predicate into a graded measurement, which is what a covering statement
      actually wants. This contract computes only the closest-draw distance as a
      tail check; a principled distance is open.
