experiment:
  id: EXP-MTGT-0f2122
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-e41559
  question_id: RQ-MTGT-2cabee
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: IS "MANY TARGETS ON DIFFERENT CURVES IN THE SAME ISOGENY CLASS" A THREAT MODEL WITH ANY INSTANCE
    AT ALL? An audit whose first finding is already rigorous and negative -- the one second curve
    deployments DO publish, the quadratic twist, has trace -t and is therefore NEVER in the same class
    for an ordinary curve -- and whose deliverable is an explicit affected-versus-safe scope split
    that this lane must carry on every result it produces
  status: draft
  objective: "(A) THE QUESTION, ASKED HONESTLY BECAUSE THE ANSWER IS PROBABLY NO. Lane L13 can show\
    \ that one preprocessing table serves an entire F_p-isogeny class (IDEA-20260807-a127ab). That\
    \ statement is worth exactly as much as the threat model it presupposes: an attacker facing M\
    \ targets spread over M DISTINCT, PUBLICLY KNOWN, MUTUALLY ISOGENOUS curves over the same prime\
    \ field. If no deployed or standardised system ever puts two isogenous curves in an attacker's\
    \ hands, the amortisation is a true theorem about an empty set, and saying so plainly is a deliverable\
    \ rather than a defect. This record exists so that no downstream summary can quietly assume the\
    \ model.\n(B) THE FIRST FINDING IS RIGOROUS AND COSTS NOTHING, AND IT KILLS THE MOST OBVIOUS CANDIDATE.\
    \ The one \"second curve\" that real deployments genuinely do publish alongside E is its QUADRATIC\
    \ TWIST E^d, because twist-security is a stated design goal of Montgomery-ladder systems: a system\
    \ that accepts x-coordinates without validation effectively also offers the twist. But for E/F_p\
    \ with trace t, the quadratic twist has trace -t (since #E + #E^d = 2p + 2). By Tate, two curves\
    \ over F_p are F_p-isogenous exactly when their traces are equal. So E and E^d lie in the same\
    \ isogeny class if and only if t = -t, i.e. t = 0, i.e. E is SUPERSINGULAR. Every ordinary prime-field\
    \ curve in this program's target family has t != 0. THEREFORE THE QUADRATIC TWIST IS NEVER IN\
    \ THE SAME F_p-ISOGENY CLASS, and the transport theorem T1 does not connect a curve to its twist.\
    \ This is an elementary argument, it is decisive, and it removes the only ubiquitous multi-curve\
    \ deployment pattern from the lane's affected scope before any compute is spent.\n(C) WHAT REMAINS\
    \ TO BE AUDITED, AS A FINITE CHECKABLE LIST. The audit enumerates every publicly standardised\
    \ prime-field curve this program tracks -- NIST P-192/224/256/384/521, secp256k1 and the SEC families,\
    \ the Brainpool families, Curve25519/Ed25519, Curve448/Ed448, the FRP256v1 and SM2 curves, and\
    \ the pairing-friendly BN/BLS families -- and for each PAIR asks the only two questions that matter:\n\
    \  Q1. Same prime field p? (necessary; almost all pairs fail here)\n  Q2. If same p, same trace\
    \ t? (necessary and sufficient for F_p-isogeny)\nBoth are read directly from published parameters\
    \ (p and #E give t = p+1-#E) and require no computation beyond subtraction. PRE-REGISTERED EXPECTATION:\
    \ ZERO pairs pass Q1 and Q2. The audit is falsifiable in the interesting direction: a single passing\
    \ pair would be a genuinely useful discovery and would give lane L13 its first real instance.\n\
    (D) THE FOUR CANDIDATE SOURCES OF MULTIPLE ISOGENOUS CURVES, AND WHY THREE ARE OUT OF SCOPE. Recorded\
    \ so the audit does not conflate them:\n  (i) MODEL CHANGES. Curve25519 (Montgomery) and Ed25519\
    \ (twisted Edwards)\n    are related by a birational map. A birational equivalence of elliptic\n\
    \    curves is an ISOMORPHISM, i.e. an isogeny of degree 1, so it changes the\n    MODEL and not\
    \ the curve. Transport by a degree-1 map is a relabelling of\n    the same object, buys nothing,\
    \ and is exactly the ell = 1 positive\n    control of IDEA-20260807-0e8977 rather than an instance\
    \ of the threat\n    model. WHETHER THE PUBLISHED Ed25519/Curve25519 RELATION IS EXACTLY\n   \
    \ DEGREE 1 OR INVOLVES A SMALL-DEGREE ISOGENY IS MARKED [open] AND IS ONE\n    OF THE AUDIT'S\
    \ EXPLICIT CHECKS -- this record does not assert it from\n    memory.\n  (ii) ISOGENY-BASED PROTOCOLS\
    \ (CSIDH, SIDH/SIKE, SQIsign, CSI-FiSh) publish\n    many isogenous curves BY DESIGN. They are\
    \ out of scope twice over: they\n    are supersingular or work over F_{p^2}, and their security\
    \ problem is\n    the class-group action or path-finding, not the ECDLP on a prime-order\n   \
    \ subgroup. Transport says nothing about them and they say nothing about\n    this lane. Recorded\
    \ so no one is tempted to import them as an instance.\n  (iii) FAULT AND INVALID-CURVE ATTACKS\
    \ move a computation onto a DIFFERENT\n    curve, which is a genuine multi-curve setting -- but\
    \ the curve reached is\n    the one produced by the fault, which generically has a different order,\n\
    \    hence a different trace, hence a different class. The attacker there\n    wants a WEAK curve,\
    \ not an ISOGENOUS one. Out of scope, and the reason is\n    worth recording because \"attacks\
    \ that touch two curves\" is otherwise a\n    tempting false positive.\n  (iv) SELF-CHOSEN CLASSES.\
    \ An attacker may generate as many isogenous\n    curves as they like. This is the only setting\
    \ where M > 1 is trivially\n    available, and it is worthless: the attacker has no target on\
    \ any of\n    them. The amortisation is over CURVES, and targets are not attacker-\n    supplied.\n\
    \n(E) THE DELIVERABLE IS THE SCOPE SENTENCE. The audit's output is a single reusable paragraph\
    \ that every L13 record must carry:\n  AFFECTED SCOPE: systems that publish two or more mutually\
    \ F_p-isogenous\n  prime-field curves with the same prime-order subgroup and place targets on\n\
    \  more than one of them. Instances known to this audit: [to be filled by the\n  audit; pre-registered\
    \ expectation is NONE].\n  SAFE SCOPE: every standardised prime-field curve listed above, considered\n\
    \  singly; and, rigorously by (B), every ordinary curve considered together\n  with its quadratic\
    \ twist.\nA scope sentence with an empty affected set is a complete and honest result."
  resource_label: 'audit: consumes no resource. This record consumes no R1-R8 resource because it
    mounts no attack and computes nothing about any group; it audits whether a threat model that OTHER
    records in this lane presuppose has any instance.'
  admissibility: admissible
  admissibility_argument: 'The admissibility filter of DECOMPOSITION.md section 2 closes lanes that
    claim an advantage from a GGM-simulable resource. This record claims no advantage of any kind,
    so the filter does not apply; it is admissible in the same sense as lane L12 (RQ-GGMB-6eaabc),
    which likewise consumes no resource and exists to constrain the other lanes. The record does,
    however, carry the filter''s SPIRIT into a new place: just as L12 asks "is your oracle simulable",
    this record asks "does your threat model have an instance", and a negative answer is as decisive
    a closure as simulability. Both are cheaper than running anything.'
  reachability_gate: NOT APPLICABLE IN THE COMPUTATIONAL SENSE, AND THAT IS THE POINT WORTH RECORDING.
    This lane's other records must reach a specified classmate at p^{1/4+o(1)} (see IDEA-20260807-a127ab's
    gate). This record asks the prior question of whether a classmate WITH A TARGET ON IT EXISTS AT
    ALL. If the audit returns zero, the reachability gate of every other L13 record becomes moot --
    not because the walk is too expensive, but because there is nowhere worth walking to. That is
    a stronger and cheaper form of closure than a cost argument, and this record is the only one in
    the lane that can deliver it.
  inputs:
    procedure: 'STAGE 0 (zero compute, ALREADY DONE IN THIS RECORD): claim (B). The quadratic twist
      is out of the class for every ordinary curve. This alone answers the most common intuition about
      "two curves a deployment gives you" and costs nothing. STAGE 1 (an hour, no compute beyond subtraction):
      build the (name, p, #E, t) table with citations, group by p, compare traces. This IS the audit.
      STAGE 2 (minutes): the random-coincidence null and the power statement. STAGE 3 (minutes): the
      planted-pair instrument check on toy curves. STAGE 4 (reading): Step 5''s model-relation determination
      from published specifications, with every finding cited. STAGE 5 (zero compute): write the scope
      sentence.'
    mechanism: 'STEP 1 -- BUILD THE TABLE. For each standardised prime-field curve in the declared
      list, record (name, p, #E, n, h, t = p + 1 - #E) from its published specification. Source every
      number to a citable document; a parameter that cannot be sourced is recorded as MISSING, never
      as estimated. STEP 2 -- Q1 PASS. Group by p. Report the size of each group. Expected: all groups
      of size 1 except where a family deliberately reuses a prime. STEP 3 -- Q2 PASS. Within any group
      of size > 1, compare traces. A pair with equal p and equal t is an F_p-isogenous pair and is
      the audit''s positive finding. STEP 4 -- TWIST CHECK, ALREADY ANSWERED ANALYTICALLY. For each
      curve, record t and -t and confirm t != 0 (ordinariness). This makes claim (B) a per-curve recorded
      fact rather than a general assertion. STEP 5 -- MODEL-RELATION CHECK. For the declared Montgomery/Edwards
      pairs, determine from the published specifications whether the stated relation is a birational
      isomorphism (degree 1) or an isogeny of degree > 1, and record which. THIS IS MARKED [open]
      IN THIS RECORD AND IS RESOLVED BY THE AUDIT, NOT BY MEMORY. STEP 6 -- RANDOM-COINCIDENCE NULL.
      Generate a matched set of RANDOM curves at the same primes and count how often two of them share
      a trace. For random curves over F_p the trace is distributed over an interval of length 4*sqrt(p)
      with the Sato-Tate-like density, so two random curves collide in trace with probability ~1/(4
      sqrt(p)) up to the density factor. At p ~ 2^{256} that is ~2^{-129}: the audit''s expected finding
      of ZERO isogenous pairs among standardised curves is therefore NOT evidence of deliberate avoidance,
      it is what chance predicts. Recording this prevents the audit from over-reading its own null.
      STEP 7 -- WRITE THE SCOPE SENTENCE of claim (E) with the affected set filled in from Steps 3
      and 5.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - random-coincidence null at matched K and p (power statement)
  - planted isogenous pair on toy curves (detection check)
  - supersingularity check t != 0 per curve (data-integrity check)
  - MISSING-parameter accounting: every unsourced number reported, never estimated
  - 'NULL OBJECT (from the proposal): MANDATORY: the RANDOM-COINCIDENCE NULL of Step 6. A matched
    set of randomly generated curves at the same primes, in the same numbers, with trace-sharing counted
    identically. Without it, "zero isogenous pairs among standards" would be reported as a property
    of standards when it is a property of arithmetic. DECAY PARAMETER: the number of curves audited,
    K. The chance rate of at least one isogenous pair grows like K^2 / (8 sqrt(p)); the audit must
    report, for its actual K and p, the probability that a null set of the same size shows zero pairs.
    If that probability is close to 1 -- which it will be -- the audit''s negative carries LOW POWER
    and must be reported as low-power, not as a demonstration that standards avoid isogenous curves.
    SECOND NULL, FOR THE INSTRUMENT: seed the table with a DELIBERATELY PLANTED isogenous pair (a
    toy curve and an explicitly constructed 2-isogenous classmate, with their true traces). The audit
    pipeline must FIND it. An audit that cannot find a planted pair has not demonstrated it could
    find a real one and its zero is void.'
  independent_variables: []
  metrics:
    primary:
    - the full (name, p,
    - count of pairs sharing p; count of pairs sharing p and t
    - the null probability of zero pairs at the audited K and p
    - planted-pair detection outcome
    secondary:
    - count of rows with MISSING parameters
    - the final affected/safe scope sentence
  heuristic_under_test: null
  preregistered_prediction:
    quantity: number of (curve, curve) pairs in the audited list sharing both p and t
    formula: 'ZERO, pre-registered. A single nonzero pair falsifies the expectation and is the audit''s
      most valuable possible outcome: it would give lane L13 a real instance and would change every
      scope sentence in the lane.'
    source: pre-registered in IDEA-20260807-e41559 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - 'COFACTOR CONFUSION. The class is fixed by #E(F_p), not by the prime-order subgroup n. Two curves
    at the same p with the same n but different cofactors have different #E and are NOT isogenous.
    The table must record both n and h and the comparison must use #E = n*h.'
  - FAMILY PARAMETERS. Pairing-friendly families (BN, BLS) are defined by a polynomial in a seed,
    so two curves from the same family have different p and cannot be isogenous. Recording them is
    still worthwhile because the question "does any family instantiate twice at the same p" has a
    definite answer.
  - MODEL VERSUS CURVE. A named curve given in two models is one curve. Counted once, and the model
    relation classified in Step 5.
  - EXTENSION-FIELD AND SUPERSINGULAR CURVES. Out of scope by construction; the table must not mix
    them in, since their trace arithmetic differs and they would create spurious matches.
  - PUBLICATION BIAS IN THE AUDITED LIST. Auditing only the curves this program already tracks could
    miss a niche standard that does publish isogenous curves. The list must be declared in advance
    and its selection criterion stated, and the safe-scope sentence scoped to it.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'ZERO, pre-registered. A single nonzero pair falsifies the expectation and is
    the audit''s most valuable possible outcome: it would give lane L13 a real instance and would
    change every scope sentence in the lane.'
  falsification_criterion:
  - A pair of standardised prime-field curves shares p and t. The pre-registered expectation is falsified
    and lane L13 acquires an instance. This must be independently verified from primary specifications
    before it is reported, since the most likely cause is a transcription error.
  - The planted-pair check fails. The audit pipeline cannot detect what it claims to detect; the zero
    is void.
  - More than a small number of rows are MISSING parameters. The audit's coverage is then too thin
    to support a safe-scope sentence and the sentence must be scoped to the rows actually filled.
  - The random-coincidence null shows that a size-matched random set would ALSO almost always show
    zero pairs -- which is expected. This is NOT a falsification; it is the reason the audit's negative
    must be reported as low-power, and reporting it as strong evidence of deliberate avoidance would
    be the over-read this record exists to prevent.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-e41559
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
