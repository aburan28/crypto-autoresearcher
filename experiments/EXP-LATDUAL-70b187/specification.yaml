experiment:
  id: EXP-LATDUAL-70b187
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-bd7f26; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-bd7f26
  question_id: RQ-MLKEM-003
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Two-factor design crossing module structure with secret Hamming weight at matched dimension,
    measuring the recovery observable per cell and fitting the structure-by-sparsity interaction against
    a ring-deleted null and a sparsity-only null
  objective: 'The run reduces one uncertainty: whether the structure discount''s size depends on secret
    sparsity, in the strict sense of a nonzero interaction in a designed experiment where both factors
    are manipulated inside one generator. Stated as parts: (i) does the unstructured arm show a main
    effect of sparsity at all, which is the precondition for an interaction to be meaningful; (ii)
    what is the structure-by-sparsity interaction coefficient on the signal surface, with an interval
    and an achieved-power figure, under an interval-censored fit that reports its censoring map; (iii)
    does that interaction survive the ring-deleted null, the secret-norm covariate and the support-geometry
    contrast. The run is not asked how large the discount is - that is the matched-discount contract
    - and is not asked anything about FHE or ML-KEM parameter selection. A run returning an interaction
    interval containing zero on a well-powered grid is a complete run: it measures sparsity to be
    incidental at these parameters, which is directly usable against KN-OPEN-026''s Q3.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: at the tested (q, n, d, k,
      m, error law, blocksize ceiling, sparsity grid, seed set), the structure-by-sparsity interaction
      had the reported coefficient and interval under the stated censored fit, with the ring-deleted
      null''s interaction containing zero and the unstructured arm showing the reported main effect
      of sparsity. WHAT DOES NOT FOLLOW: nothing about whether any FHE or ML-KEM parameter set is
      affected; no bit-security figure of any kind, since no cost model is applied anywhere in this
      contract; no mechanism for an interaction, only its presence or absence; no claim that the interaction
      persists at larger n or at denser secrets than the grid reaches; and no statement about what
      the sources KN-OPEN-026 relays report.'
  inputs:
    procedure: 'STAGE 0 (cost: 0 compute, ~3h human). Freeze the sparsity grid, the seed schedule,
      the censored-likelihood fit, the pre-specified interaction size for the power calculation, and
      the support-geometry split. STAGE 1 (cost: low). Matched-triple generation per (seed, h): structured,
      NULL C unstructured, NULL B ring-deleted, all sharing s and e; record support pattern and secret
      norm. STAGE 2 (cost: high, dominant). Progressive BKZ plus Babai to exact recovery on every
      instance, recording beta* or censoring. STAGE 3 (cost: low). Interval-censored additive-plus-interaction
      fit on log2 beta* for the signal surface and for NULL B. STAGE 4 (cost: low). Main-effect fit
      on NULL C. STAGE 5 (cost: low). Refit with secret norm as covariate; refit within support-geometry
      strata. STAGE 6 (cost: low). Achieved-power computation against the pre-specified effect size,
      and censoring map. STAGE 7 (cost: low). Zero-error positive controls at each h. STAGE 8 (cost:
      low). Emit immutable run records through harness/runner.py.'
    instrument: Python 3.11 standard library only; numpy, fpylll and Sage are all absent from this
      environment and none is used. Exact-integer q-ary lattice construction, fractions.Fraction Gram-Schmidt,
      progressive BKZ with integer enumeration inside blocks, Babai nearest-plane decoding, and exact
      comparison of the recovered vector against the retained secret. The interval-censored likelihood
      and its profile intervals are implemented in pure Python. Seeds and run records through harness/runner.py.
    parameters: q in {769, 3329}; cyclotomic degree d in {8, 16}; module rank k with n = k*d and n
      in {24, 32, 48}; m in {2n}; nonzero secret coordinates drawn from a centered binomial with eta
      = 2; Hamming weight h over {n/8, n/4, n/2, n} at each n, with h rounded to an integer; blocksize
      ceiling 24; 50 seeds per (n, h) cell; support geometry split 25 contiguous and 25 scattered
      per cell.
  controls:
  - NULL C, the matched unstructured arm across the full H grid, establishing the main effect of sparsity
    as a precondition.
  - NULL B, the ring-deleted structured arm across the full H grid, whose interaction must be zero.
  - 'Norm covariate control: secret Euclidean norm recorded per instance, and the interaction refitted
    with norm as a covariate to separate sparsity from magnitude.'
  - Zero-error positive control at each h, where recovery must succeed at minimal blocksize in every
    arm.
  - 'Support-pattern control: at fixed h, half the seeds use a contiguous support and half a scattered
    one, exposing any dependence on support geometry rather than on weight.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both in the same invocation. NULL B, the ring-deleted structured
    instance with the entry multiset preserved by a seeded within-block permutation, is run across
    the entire H grid; its interaction coefficient must be zero within interval. If it is not, the
    interaction tracks the block layout rather than the ring and the signal surface is an artifact,
    recorded as a controlled null under inventor-protocol section 3. NULL C, the sparsity-only arm:
    the unstructured instance across the H grid, which must show a clear main effect of H - beta*
    decreasing as h decreases - because an interaction term is uninterpretable if the response does
    not depend on the manipulated factor at all. NULL C is a precondition, not a comparison: if sparsity
    does not move the response in the unstructured arm, the design has no interaction to measure and
    the run reports that instead.'
  independent_variables:
  - structure factor S (module, matched unstructured, ring-deleted)
  - secret Hamming weight h
  - lattice dimension n
  - cyclotomic degree d
  - support geometry (contiguous or scattered)
  metrics:
    primary:
    - beta* or censoring flag per instance
    - S x H interaction coefficient with interval, signal surface
    - S x H interaction coefficient with interval, NULL B
    - main effect of H in NULL C with interval
    secondary:
    - censoring fraction per cell
    - achieved power against the pre-specified interaction size
    - secret Euclidean norm per instance
    - support-geometry stratum contrast
    - wall clock and peak memory per instance
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The S x H interaction coefficient gamma on the signal surface with a 95 percent profile
      interval, reported beside the same coefficient fitted on NULL B and the main effect of H fitted
      on NULL C, together with the censoring map and the achieved power.
    formula: Model log2 beta*(i) = mu + alpha * 1[structured] + beta * log2(h/n) + gamma * 1[structured]
      * log2(h/n) + epsilon, fitted by an interval-censored Gaussian likelihood in which a censored
      observation contributes P(beta* > ceiling). gamma is the interaction and is the prereg quantity;
      gamma = 0 means the discount is a fixed offset in log-blocksize independent of sparsity, i.e.
      sparsity is incidental in the sense of Q3; gamma with an interval excluding zero means the discount's
      size depends on sparsity. The same model fitted with an added secret-norm term reports gamma_adjusted,
      and the entry treats the pair (gamma, gamma_adjusted) as the result rather than either alone.
      NULL B's predicted gamma is 0.00 with its interval containing zero.
    source: Pre-registered in the parent proposal IDEA-20260816-bd7f26 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Run at n in {24, 32, 48}, d in {8, 16}, q in {769, 3329}, blocksize ceiling 24,
      in pure Python with neither numpy nor fpylll present in this environment. Toy parameters are
      forced by requiring exact recovery against retained ground truth in every cell of a twelve-to-thirty-six
      cell factorial. The transfer assumption is stated as none. In particular the sparsity grid tops
      out at h = n, which is not a uniform secret in the sense any deployed scheme uses, so the dense
      end of this grid is a construction of this experiment and not a model of any parameter set.
      No gamma is converted into bits and none is projected onto ML-KEM, Kyber, Dilithium or any FHE
      scheme.
    correspondence: null
  tail_checks:
  - The sparsest cells, where recovery may be trivial in both arms and the response saturates at the
    minimum blocksize.
  - The densest cells, where censoring concentrates and the fit's censored contribution dominates.
  - Cells where all seeds censor in one arm and none in the other, which the likelihood handles but
    which merit individual inspection.
  - The contiguous-support stratum in the structured arm, where rotations preserve contiguity and
    any support-geometry effect should be largest.
  - Instances whose secret norm falls far from its cell's median, checked against the covariate fit.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: 12.0
    maximum_memory_gb: 8
    maximum_runs: 60
  stopping_rules:
  - Stop a cell at 50 seeds or 8 wall-clock hours, reporting achieved counts and the resulting power.
  - Abandon and report as censored any cell exceeding 90 percent censoring in both arms rather than
    fitting it.
  - Halt and report a generator defect if NULL B's gamma interval excludes zero at the primary grid
    point.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: NULL C shows a main effect of sparsity with an interval excluding zero, NULL
    B's gamma interval contains zero, censoring stays below half the cells, and gamma and gamma_adjusted
    are both reported with profile intervals and an achieved power of at least 0.7 against the pre-specified
    effect size - whatever their values turn out to be.
  falsification_criterion:
  - 'NULL C shows no main effect of sparsity: no interaction is measurable and the design''s premise
    fails.'
  - 'NULL B''s gamma interval excludes zero: the interaction is block-layout-borne and the signal
    surface is an artifact.'
  - 'Censoring exceeds half the cells: the surface is unfittable and a reachability floor is reported
    instead.'
  - 'gamma_adjusted''s interval contains zero while gamma''s does not: the apparent interaction is
    secret magnitude, not sparsity, and must be reported that way.'
  - 'Achieved power below 0.7: the run cannot support a null verdict on the interaction and reports
    only the estimate with its interval.'
  - 'Both gamma and gamma_adjusted contain zero on a well-powered grid: sparsity is incidental at
    these parameters, which is the reported result.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-bd7f26
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The pre-specified interaction effect size used for the power calculation is not derived and a
    Coordinator must fix it; without it 'achieved power' has no referent.
  - Whether h = n counts as a legitimate dense endpoint, given that no deployed scheme uses that secret
    law, is a scoping decision that affects how the interaction may be described.
  - The sparsity-magnitude aliasing is only partially addressable by a covariate; a Coordinator must
    decide whether a norm-matched sparse-versus-dense pairing is constructible and, if so, whether
    it should replace the covariate.
  - The interval-censored likelihood's profile-interval implementation in pure Python needs validation
    against a case with a known answer before approval.
