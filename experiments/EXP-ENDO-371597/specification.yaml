experiment:
  id: EXP-ENDO-371597
  hypothesis_id: H-ENDO-d492e4
  version: 1
  title: Hom degree forms and conductor-product identifiability pilot
  status: approved
  frozen: true
  objective: Construct the full Hom lattice by exact multiplier containment, compute
    degree norm form and compare Delta/content against planted conductors; transport
    sublattice matrices before inferring products.
  inputs:
    intake_commit: a49c65b1ffc04b192b1bf92e386baf4d9e4cc523
    intake_sha256: 229714383ff1dbe845355c2835c66aa46f345565c2bf94afaa5c260bdf6222ce
    parameters:
      fundamental_discriminants:
      - -3
      - -4
