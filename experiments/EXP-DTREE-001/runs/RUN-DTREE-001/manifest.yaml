  anomalies:
  - type: design_infeasible
    stage: freeze
    description: 'The frozen slope-grid rule (B''>=8, C(B'',3)>=50, lambda<=0.7) yields
      0 qualifying cells across the three tiny curves (8/10/12 bits, seed 1), fewer
      than the required 6. Root cause: harness.toycurve.generate_instance''s deterministic
      search accepts the FIRST curve meeting a weak bar (largest prime factor >= 5),
      not one with a large prime-order subgroup; for seed=1 at 8/10/12 bits this yields
      group orders n=23, n=19, n=31 respectively (recorded exactly in this run''s
      raw output), far too small for 0.7*n >= 50 to ever hold at any B''>=8. Per the
      freeze stage''s own stop rule this is recorded as design_infeasible with the
      exact lambda table, and the frozen grid is NOT improvised or replaced -- the
      C1 slope fit is not computable from this frozen input; C2 (which does not depend
      on the tiny curves) is unaffected.'
  - type: target_collisions
    stage: freeze
    description: main curve 16-bit (n=23) has only 19 distinct points among the 50
      requested targets (R = a*P+b*Q for 50 distinct seeded (a,b) pairs); by the pigeonhole
      principle this is unavoidable once n < 50, and is even likely for n in the low
      hundreds. Every target keeps its own distinct, recorded (a,b) seed pair as specified;
      several pairs simply land on the same group element.
  - type: target_collisions
    stage: freeze
    description: main curve 24-bit (n=349) has only 43 distinct points among the 50
      requested targets (R = a*P+b*Q for 50 distinct seeded (a,b) pairs); by the pigeonhole
