  anomalies:
  - generate_instance (seed 1 at 8/10/12 bits; seeds 1/2/3 at 16/20/24 bits) yields subgroup orders n
    far smaller than and non-monotonic in field_bits (n=23,4271,349 at 16/20/24 bits; n=23,19,31 at 8/10/12
    bits) -- the function accepts the FIRST curve meeting a weak bar (largest prime factor >=5), not one
    with a large prime-order subgroup. Directly causes the C1 design_infeasible outcome. Recorded on RUN-DTREE-001.
  - 'With n < 50, the 50 seeded (a,b) targets are not 50 distinct group elements: 19/50 distinct at 16-bit,
    50/50 at 20-bit, 43/50 at 24-bit (RUN-DTREE-001). Each target keeps its own distinct, recorded (a,b)
    pair; this is a consequence of a small state space, not a duplicated-seed invalidation.'
  - 'Confirmed pre-existing bug in harness/semaev.py''s s4_expr (variable-collision from sympy .subs()
    without simultaneous=True): evaluated at a genuine witness, it is nonzero where it must be exactly
    0. Fixed locally (semaev_fix.py) for this experiment only; harness/semaev.py is unmodified (out of
    scope). Also imported by experiments/EXP-MTIC-001 and experiments/EXP-FIB-001 -- flagged for the Coordinator,
    not investigated further here.'
  - harness.semaev.build_factor_base samples x-coordinates from the WHOLE curve, not the order-n subgroup
    the target always lies in; measured main-curve cofactors are 2280 (16-bit), 196 (20-bit), 31512 (24-bit).
    Measured single-level P(m=3,B) (0.0, 0.32, 0.0) does not track HEUR-001's own (B/N)^2 point-prediction
    (0.047, 0.000239, 0.003) in either direction or magnitude. Not a pre-registered metric; reported per
    AGENTS.md rule 8, not scored against any threshold, not diagnosed further.
  - Two of the 16-bit curve's 50 targets are the identity point O (no x-coordinate); the Semaev embedding
    this experiment implements requires a target x-coordinate, so the Groebner cost sample (and any certificate)
    is explicitly skipped for those two targets while the fast-exact ground-truth test still runs and
    is recorded in full.
  - 'RUN-DTREE-006 and RUN-DTREE-007/008 overshot the 1500s per-run cumulative Groebner-time cap by up
    to one call''s worth (measured cumulative: 1505.6s, 1514.2s, 1509.2s) because the cap is checked BEFORE
    starting each new capped solve, not enforced as a hard mid-call kill; all three runs still completed
    within the independent 1800s per-run wall-clock hard cap (max observed: 1583.5s).'
  - 'Several implementation bugs were caught and fixed during development, before any official RUN-DTREE-*
    record was written (verified against a brute-force reference; full account in implementation.md):
    a single-witness collision in the arity-3 pairwise-sum index; P_dec computed without restricting to
    the exact subgroup in the slope-enumeration code (inflated a diagnostic value past 1.0); a non-deterministic
    bootstrap seed from Python''s per-process-randomized string hash(); and Python tuple dict keys that
    json.dumps cannot serialize.'
