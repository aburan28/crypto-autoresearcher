  executor_assessment:
    protocol_complete: false
    protocol_complete_reason: 'All 12 planned runs reached terminal status with complete, certificate-verified,
      mutually agreeing raw/summary artifacts, and both claims were decided with measured quantities per
      the frozen contract (C1: design_infeasible, fully diagnosed; C2: resource_exhaustion at 2 of 3 sizes,
      a defined-but-non-winning comparison at the third). The one gap is structural, not scientific: experiments/EXP-DTREE-001/analysis.md,
      a required artifact, could not be written to disk this session (see note_analysis_md above) -- its
      content is delivered in full here and in the Executor''s response instead.'
    data_quality: limited
    data_quality_reason: C1 is undecided (design_infeasible, not a measurement of the exponent). C2 is
      decided (negative in the sense that no configuration wins) only at 16-bit, which meets the validity
      prefix; the 20-bit and 24-bit comparisons are resource_exhaustion, inconclusive per the protocol's
      own rule. Every individual number reported is a genuine, certificate-verified measurement.
    requires_rerun: false
    requires_rerun_note: Not requested; a rerun would need a Coordinator-approved amendment (e.g. a different
      seed policy for the tiny curves, or restricting the factor-base construction to the target subgroup)
      to change these specific outcomes, not a mechanical retry of the same frozen inputs.
