  - claim: CTRL-GENERIC-HEURISTIC
    measured: Every computable cell (all at 20-bit) labeled non_generic_signal (ratio measured/HEUR001-predicted
      C2 in [0.00044, 0.00095], far outside the pre-registered [0.5,2] tolerance -- measured C2 100-800x
