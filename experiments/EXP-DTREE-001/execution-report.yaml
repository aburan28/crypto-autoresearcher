  observations:
  - claim: C1 (slope)
    frozen_prediction: HEUR-001 predicts log-slope gamma = m-1 = 2 at m=3; the competing birthday model
      predicts gamma ~ m = 3. The 95% CI over a least-squares fit on >=6 exact non-saturated cells across
      the three tiny curves was to decide which (if either) the data support.
    measured: '0 qualifying cells found (RUN-DTREE-001 exact lambda table: tiny curves have n=23, 19,
      31 at 8/10/12 bits seed 1; the frozen rule needs n>=71.4 at any B''>=8). No slope, no CI, no comparison
      to gamma=2 or gamma=3 was computed (RUN-DTREE-002, design_infeasible).'
    diagnostic_only_not_confirmatory:
      b_prime_8_p_dec:
        8_bit_n23: 0.9565217391304348
        10_bit_n19: 0.42105263157894735
        12_bit_n31: 0.1935483870967742
      note: Outside the frozen grid; illustrates deep saturation at the smallest allowed B', not part
        of the confirmatory fit.
  - claim: C2 (cost)
    frozen_prediction: At least one (B_med, m', m) configuration at the largest tested size (24-bit) achieves
      C_2 < 0.8*C_1 with a bootstrap 95% CI on C_2/C_1 entirely below 1.
    measured_c1_by_size:
      16_bit: null
      20_bit: 62.5
      24_bit: null
    measured_c1_note: None = undefined (P(m=3,B) measured as an exact 0/50), not zero and not infinite;
      C_solve(3) mean was 1.40s (16-bit, n=48 non-identity targets) / 20.0s (20-bit and 24-bit, 100% Groebner-capped).
    measured_c2_by_size:
      16_bit: undefined for all 8 configurations (stage-2 P(m,B)=0 whenever attempted; validity prefix
        MET, 8/8 configs >=10 targets)
      20_bit: defined for 6/8 configurations, range [110.0, 200.0]; validity prefix NOT met (0/8 configs
        >=10 targets; n1=3-4 each) -> resource_exhaustion
      24_bit: undefined for all 8 configurations (stage-2 P(m,B)=0 whenever attempted); validity prefix
