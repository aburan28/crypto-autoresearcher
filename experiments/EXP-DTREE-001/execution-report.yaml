  note_analysis_md: 'experiments/EXP-DTREE-001/analysis.md is a required_artifact per the frozen specification.yaml
    but COULD NOT be written to disk: the Write tool refused the call with ''Subagents should return findings
    as text, not write report files'' (a harness-level restriction on this Executor session, matched on
    the filename). Its full intended content (Observation/Comparison/Inference/Limitation, per docs/task-lifecycle.md
    step 8) is delivered in this execution_report''s `observations` and `anomalies` fields below and in
    the Executor''s accompanying response text, so nothing is lost -- but the file itself is genuinely
    absent from experiments/EXP-DTREE-001/ and the Coordinator should persist it (e.g. during the snapshot-commit
    step, which runs in a different session) before treating required_artifacts as fully satisfied.'
  protocol_deviations:
  - None of these change the frozen hypothesis, success/falsification criteria, controls, metrics, budgets,
    or stopping rules -- all are implementation elaborations needed to execute the protocol as written,
    recorded per AGENTS.md rule 8 and in full in implementation.md.
  - 'design_infeasible for the C1 slope grid (RUN-DTREE-001/002): the frozen grid rule applied to the
    frozen tiny-curve instances (generate_instance, seed 1, 8/10/12 bits) yields 0 qualifying cells (n=23,19,31;
    rule requires n>=71.4). This is the protocol''s own named stop-rule outcome, not an improvisation
    -- the grid was not replaced or widened.'
  - 'resource_exhaustion for C2 at 20-bit and 24-bit (RUN-DTREE-007/008): fewer than 2 configurations
    reached the 10-measured-target validity-prefix minimum at either size, per the depth2 stage''s own
    named stop-rule outcome.'
  - Local correction of a confirmed pre-existing bug in shared harness/semaev.py's s4_expr (variable-collision
    from a non-simultaneous sympy .subs() call) via a local semaev_fix.py, used only within experiments/EXP-DTREE-001/;
    harness/semaev.py itself was not edited (out of this experiment's declared scope). This bug also affects
    experiments/EXP-MTIC-001 and experiments/EXP-FIB-001, which import harness.semaev.s4_expr directly;
    whether their results depended on it is not investigated here.
  - Decomposition-probability P(m,B') is measured via an exact curve-group-law test (curvegroup.py), decoupled
    from whether the capped Groebner solve finishes -- a necessary elaboration given a calibration (implementation.md)
    showing sympy's Buchberger routine exceeds the 20s cap at B' values far below this experiment's actual
    factor-base sizes for arity 3; gating P on solver completion would have made P degenerate by censoring
    rather than measuring the combinatorics.
  - Breadth-first, round-based scheduling of the 8 depth-2 configurations against the 50 shared targets
    within the 1500s per-run cumulative Groebner-time cap (frozen configuration order preserved; only
    the interleaving is a considered choice, documented in implementation.md, since a strictly sequential
    reading would spend the entire budget on the first configuration alone).
