      k_star_256<12; KF rejected; NULL
      constant-in-k rejected.
      Certificate kind none.
    formula: >
      L_q[1/3,1.923]=exp(1.923*(ln q)^{1/3}
      *(ln ln q)^{2/3}); rho=2^{bits/2};
      q=2^{bits*k}.
    source: IDEA-20260805-cc4c2c mechanism (internal)
    claim_tier: observational
  inputs:
