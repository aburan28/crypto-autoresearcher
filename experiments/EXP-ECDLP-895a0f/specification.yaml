  source_proposal: IDEA-20260913-4efec0
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-13 by
    DEC-20260913-7b31fe under the standing 2026-09-06
    user authorization. Stage 0 is the exact affine
    doubling-slope calibrator.

  objective: >
    Evaluate the exact identity that on
    p=19, A=1, B=-1, P=(2,3) one has
    [2]P=(16,11), lambda=18,
    lambda'=3, x'=16, and rejects the
    nearby invariance claim that
    lambda'=18, on one frozen family
    (REAL, KF, NULL). Stage 0 does not
    form a real Gamma orbit, does not
    run a unary-closure census, does
    not run Miller or Tate, and does
    not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL has
      lambda=18, lambda'=3, x'=16;
      KF invariance claim rejected
      because lambda'=3; NULL empty
      slope rejected; y=0 rejected.
      Certificate kind none.
    formula: >
      Affine doubling then
      lambda=(3x^2+A)/(2y).
      REAL: P=(2,3), [2]P=(16,11),
      lambda=18, lambda'=3, x'=16.
      KF: claim lambda'=18, actual 3,
      rejected as a generic
      doubling-slope target.
    claim_tier: observational

  inputs:
    fixture:
      real_curve:
        p: 19
        A: 1
        B: -1
        P: [2, 3]
        P2: [16, 11]
        must_lambda: 18
        must_lambda_prime: 3
        must_x_prime: 16
      known_false:
        kind: constant_lambda_prime
        claimed_lambda_prime: 18
        must_lambda_prime: 3
        must_reject: true
      matched_null:
        kind: empty_slope
        must_reject: true
      invalid:
        - {y_zero: true, point: [2, 0], must_reject: true}

  controls:
    - name: known_false_constant
      object: KF claim lambda' equals 18
    - name: matched_null
      object: empty slope
    - name: invalid_y_zero
      object: y=0 undefined slope

  independent_variables:
    - point
    - affine_chart
  metrics:
    primary:
      - fixture_pass
      - real_slope_pass
      - known_false_constant_pass
      - reject_invalid_pass
      - null_empty_pass
    secondary: []
  primary_metrics:
    - fixture_pass
    - real_slope_pass
    - known_false_constant_pass
    - reject_invalid_pass
    - null_empty_pass
  secondary_metrics: []
  seeds: [8]
  replication_plan: >
    One Stage 0 run. Deterministic
    exact F_19 tables. No sampling.
  budget:
    wall_clock_seconds: 120
    memory_gb: 2
    maximum_runs: 1
  stopping_rules:
    - Stop after the five gates are recorded.
    - A timeout is failed_infrastructure, not a mathematical miss.
  invalidation_rules:
    - Missing artifact paths invalidate the run.
    - Overwriting an existing run record invalidates the procedure.
  success_criterion: >
    All five Stage 0 gates true and
    certificate kind none on the
    frozen REAL / KF / NULL toys.
  falsification_criterion: >
    After fixture_pass, any REAL
    slope miss or KF-constant accept
    at the frozen toys.
  success_criteria:
    - All five gates true and certificate kind none.
  falsification_criteria:
    - After fixture_pass, any REAL table miss or KF accept.
  required_artifacts:
    - raw-result.json
    - execution-report-s0.yaml
    - implementation/stage0_dblslp.py
  dependencies:
    - H-ECDLP-aca677
    - DEC-20260913-7b31fe
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
  scientific_boundary: >
    Stage 0 P-S0-DBLSLP only. Not
    nested LHW. Not Esser-May. Not
    Semaev. Not det D[2]. Not
    Miller. Not Tate. Not a rho
    beat. No Stage 1 of
    EXP-ECDLP-895a0f. No Stage 1
    of EXP-ECDLP-bf222c. No unary-
    closure census.
