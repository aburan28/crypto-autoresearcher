# EXP-ECDLP-ca5d53
# Jacobian storage arithmetic. No group law is run.
# Approved by DEC-20261003-36e89a.
experiment:
  id: EXP-ECDLP-ca5d53
  hypothesis_id: H-ECDLP-958e1a
  source_idea: IDEA-20261003-849551
  question_id: RQ-ECDLP-623a32
  version: 1
  title: Jacobian storage versus affine storage
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-36e89a
  objective: >-
    Check the storage gap 1, the product 6, and the nearby gap 0.
  inputs:
    jacobian: 3
    affine: 2
    storage_gap: 1
    storage_product: 6
    storage_sum: 5
    nearby_a: 3
    nearby_b: 3
    nearby_gap: 0
    nearby_product: 9
  controls:
    - >-
      A Jacobian point stores 3 field elements. An affine point
      stores 2. Reporting the affine point as storing 3 drops the
      gap and invalidates the run.
    - >-
      Three exceeds two by 1. The product of the two counts is 6.
      Their sum is 5.
    - >-
      Two Jacobian points each store 3. Their gap is 0 and their
      product is 9.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {count, subtract}
  metrics:
    primary:
      - storage_gap
      - storage_product
      - nearby_gap
      - implementations_agree
    secondary:
      - storage_sum
      - nearby_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      3 exceeds 2 by 1. The product of 3 and 2 is 6. The gap of
      two Jacobian counts is 0.
    formula: >-
      Subtract 2 from 3. Multiply 3 by 2. Add 3 and 2. Subtract
      3 from 3. Multiply 3 by 3.
    source: >-
      IDEA-20261003-849551 states the storage counts 3 and 2,
      read 2026-10-03. The gap, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No group law was run.
  scale_relevance:
    tier: toy
    justification: Two written storage counts. No transfer to a group law.
    correspondence: null
  tail_checks:
    - The product 6 and the nearby gap 0 are required. A check that stops at the gap 1 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 1 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The Jacobian count is not 3.
    - The affine count is not 2.
    - The gap is not 1.
    - The product is not 6.
    - The affine point is reported as storing 3, or a group law is run.
  success_criterion: >-
    Both runs agree that the Jacobian count is 3, that the affine
    count is 2, that 3 exceeds 2 by 1, and that the product is 6.
  falsification_criterion: >-
    The runs agree that the Jacobian count is computed, and that
    count is not 3.
  required_artifacts:
    - experiments/EXP-ECDLP-ca5d53/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-ca5d53/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-ca5d53/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-ca5d53/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-ca5d53/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-ca5d53/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any group law or scalar recovery.
    - Any claim that a storage gap of 1 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
