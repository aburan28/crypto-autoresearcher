experiment:
  id: EXP-HAWKL-a16195
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-e9ca55; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-e9ca55
  question_id: RQ-HAWK-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Extract, type and graph the nrd-PIP route's numbered heuristics from committed records; delete
    the failed node; report the surviving-consumer partition against a degree-preserving rewiring
    null and a stricter-extraction-rule replicate.
  objective: 'The one uncertainty a run reduces is whether the three surviving heuristics of the nrd-PIP
    route still have live consumers, and how many. Concretely: (i) whether the heuristic statements
    this corpus holds can be typed as predicates at all, or whether the paraphrase in KN-OPEN-027,
    KN-OPEN-028 and EV-HAWK-c99848 has already merged or blurred them beyond separation - answered
    by the untyped-residue count and by whether four distinct nodes emerge; (ii) whether, after deleting
    the node corresponding to the failed density heuristic, any survivor retains an out-edge to a
    step whose correctness or termination argument still needs it - answered by the class (ii) size
    on the cited-only edge set, which is the primary metric; (iii) whether that partition is a fact
    about the argument or an artifact of the extraction, answered jointly by the degree-preserving
    rewiring null and by the stricter-extraction-rule replicate, both of which run in the same invocation
    as the signal arm. A run does not attempt to decide any heuristic''s truth, implements no part
    of the attack, and reads no source outside this repository. The intended downstream use is to
    tell a Coordinator whether there is a live heuristic inventory worth a successor proposal, or
    whether the route''s heuristic content is fully consumed by the failure already recorded - the
    second answer being a usable measured obstruction rather than a null result.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: within the heuristic
      statements as recorded in this repository as of the run date, and under one named extraction
      rule plus one stricter replicate, exactly k of the three surviving heuristics retain a cited
      consumer after the failed density heuristic is deleted, with k reported separately for cited-only
      and cited-plus-inferred edge sets and each value referenced to the rewiring null. What does
      NOT follow: nothing about whether any heuristic is true; nothing about the corrected cost of
      the nrd-PIP route, whose direction is closed by KN-OPEN-028 Q1 and is not touched here; nothing
      about HAWK''s security or its Round-3 parameters in either direction; nothing about what the
      paper actually says beyond what this corpus transcribed; and no licence to build a successor
      construction without first obtaining the paper body.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes). Freeze the input set: the exact file paths and git blob hashes
      of KN-OPEN-027, KN-OPEN-028, KN-LIT-7674, EV-HAWK-c99848, EV-HAWK-21edba, plus the control file
      KN-OPEN-024. Write the two extraction rules and the edge-marking convention to a frozen JSON
      before any extraction runs. STAGE 1 (cost: minutes). Run extraction rule A over the frozen inputs,
      emitting candidate predicates with source file and line; run stricter rule B into a separate
      output. STAGE 2 (cost: under an hour of human adjudication, recorded). Type each candidate:
      name and type its free variables, or mark it untyped with a reason. Every adjudication decision
      is written to the record rather than summarised. STAGE 3 (cost: seconds). Build the edge set,
      each edge marked cited or inferred with its source line; assert acyclicity, halting and reporting
      on any cycle. STAGE 4 (cost: seconds). Delete the failed-heuristic node; take the induced subgraph;
      assign class (i) and class (ii); emit sizes for cited-only and full edge sets under both extraction
      rules. STAGE 5 (cost: under a minute). Null arm in the same invocation: 2000 degree-preserving
      rewirings, identical deletion, report the observed size''s percentile. STAGE 6 (cost: seconds).
      Scrambled-source control on KN-OPEN-024. STAGE 7 (cost: minutes). Emit the run manifest through
      harness/runner.py with all six metrics and the frozen input hashes.'
    instrument: Python 3 standard library only for extraction and graph work (re, json, itertools,
      random with a declared seed); no external natural-language tooling, no lattice library, no computer-algebra
      system, and specifically no Sage. Graph handling is a hand-rolled adjacency dictionary of under
      20 nodes rather than a dependency on networkx, so the whole pipeline is auditable by reading
      one short file. The run manifest and seed discipline come from harness/runner.py, following
      the instrument lineage already used by EXP-HAWK-a2f34a. All inputs are files already in this
      repository and no network access is used or needed.
    parameters: 'Input set: 5 committed records plus 1 control record, frozen by blob hash. Expected
      node count: 4 heuristics plus between 4 and 12 algorithmic-step nodes. Two extraction rules.
      Null arm: 2000 degree-preserving rewirings with the seed declared in the specification. Edge
      marking: two categories, cited and inferred. Adjudication: every typing decision recorded individually,
      expected between 4 and 20 decisions. No parameter sweep and no scale parameter - this contract
      has no n.'
  controls:
  - Degree-preserving edge rewiring null, executed in the same script invocation as the signal arm,
    2000 permutations.
  - 'Extraction-rule sensitivity control: rerun the whole pipeline under a second, deliberately stricter
    extraction rule (a heuristic number required, not merely the word) and report both class (ii)
    sizes; a partition that flips under rule choice is reported as rule-dependent.'
  - Cited-only versus cited-plus-inferred edge sets reported separately and never merged into one
    number.
  - 'Scrambled-source control: run the extractor over an unrelated open-problem entry of similar length,
    for instance KN-OPEN-024, and confirm it does not produce a four-node heuristic graph, which would
    indicate the extractor is matching prose shape rather than content.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a shuffled consumption graph: the same node set
    and the same out-degree sequence, with edge targets permuted uniformly at random among the algorithmic
    steps, run through the identical deletion procedure over 2000 permutations in the same script
    invocation as the signal arm. For the signal arm to mean anything, the null must produce class
    (ii) sizes distributed around the value expected from out-degree alone, and the real graph''s
    class (ii) size must sit outside the central 90 percent of that null distribution. If the real
    graph''s partition is indistinguishable from a degree-preserving random rewiring, the partition
    carries no information beyond the degree sequence and must be recorded as a controlled null rather
    than as a finding.'
  independent_variables:
  - extraction rule (A permissive, B strict)
  - edge set (cited-only versus cited-plus-inferred)
  - source record subset (all five versus the two records that quote verbatim rather than paraphrase)
  metrics:
    primary:
    - class (ii) size, cited-only edge set, rule A
    - class (ii) size, cited-only edge set, rule B
    - untyped predicate residue count
    - percentile of the observed class (ii) size in the degree-preserving null
    secondary:
    - total node count and edge count
    - fraction of edges marked inferred
    - number of adjudication decisions requiring a judgement call
    - whether the scrambled-source control produced a four-node heuristic graph
  heuristic_under_test: null
  preregistered_prediction:
    quantity: k_cited_A, the number of surviving heuristics retaining at least one cited out-edge
      to a step that is not downstream of the deleted density heuristic, under extraction rule A.
    formula: 'k_cited_A = |{h in S : out_cited(h) intersect Steps_surviving is non-empty}|, where
      S is the set of three heuristic nodes other than the failed density heuristic, Steps_surviving
      is the set of algorithmic-step nodes not reachable from the deleted node along cited edges,
      and out_cited(h) is h''s cited out-neighbourhood. Predicted: k_cited_A is at most 2. The run
      is informative whichever value in {0, 1, 2, 3} it takes, and a value of 0 is a measured obstruction
      rather than a failure.'
    source: Pre-registered in the parent proposal IDEA-20260816-e9ca55 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'There is no scale parameter: the object is a graph of fewer than 20 nodes built
      from six files. The tier is toy because the input is this corpus''s second-hand record of the
      route rather than the route itself, and the transfer assumption - that predicates extracted
      from paraphrase are the paper''s predicates - is stated explicitly and is not verified. No extrapolation
      to HAWK parameters, to deployed conductors, or to the paper''s own argument is performed or
      licensed.'
    correspondence: null
  tail_checks:
  - 'Check the case where the extractor finds fewer than four heuristic nodes: report it as extraction
    failure, never as a merged-heuristic finding.'
  - 'Check the case where a survivor''s only cited out-edge points at a step itself reachable only
    through the deleted node: this must classify as class (i), and the classifier is unit-tested on
    a hand-built graph exhibiting exactly that shape.'
  - Check the degenerate null in which every rewiring yields the same class (ii) size, which would
    mean the degree sequence forces the answer and the null has no discriminating power.
  - Check both extraction rules against a hand-annotated gold subset of ten sentences and report precision
    and recall on that subset.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report if the consumption graph is cyclic, since a cycle means the extracted relation
    was not 'is consumed by'.
  - Halt and report if adjudication requires more than 30 judgement calls, which would indicate the
    records are too paraphrastic to support the construction.
  - Halt if the scrambled-source control produces a four-node heuristic graph, and report the extractor
    as invalid rather than reporting any partition.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run emits, for both extraction rules and both edge sets, a class (ii) size
    together with its null percentile, an untyped residue count, and a per-element justification naming
    the surviving consumer of each class (ii) member, with every adjudication decision recorded -
    and with the scrambled-source control not firing.
  falsification_criterion:
  - Class (ii) is empty under both rules and both edge sets.
  - The observed class (ii) size lies within the central 90 percent of the degree-preserving null.
  - Class (ii) membership differs between extraction rules A and B.
  - The scrambled-source control on KN-OPEN-024 produces a four-node heuristic graph.
  - The extracted graph is cyclic.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-e9ca55
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact wording of Heuristics 1, 2 and 3 is not held verbatim in this corpus - KN-OPEN-028 records
    that the paper body was not read - so a Coordinator must decide whether paraphrase-derived predicates
    are admissible at all, or whether this contract waits on source acquisition.
  - The mapping from 'algorithmic step' to a node is not fixed by any committed record; the Coordinator
    must approve a step decomposition before extraction, or the step node set becomes a free parameter
    tuned after the fact.
  - Whether deletion or weakening is the correct semantics for a failed heuristic is asserted here
    and tested by the resource-reading entry in this batch; the Coordinator should decide whether
    the two contracts run together.
