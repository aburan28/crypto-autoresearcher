  execution_surface:
    trial_plan: experiments/EXP-SEMBIN-d830d5/trial-plan-v1.json
    trial_plan_stage2: experiments/EXP-SEMBIN-d830d5/trial-plan-v2.json
    trial_plan_twin: experiments/EXP-SEMBIN-d830d5/trial-plan.json
    command_stage0: >-
      python3 experiments/EXP-SEMBIN-d830d5/implementation/run.py --stage 0
      --trial-plan experiments/EXP-SEMBIN-d830d5/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-SEMBIN-d830d5/implementation/run.py --stage 1
      --trial-plan experiments/EXP-SEMBIN-d830d5/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage2: >-
      python3 experiments/EXP-SEMBIN-d830d5/implementation/run.py --stage 2
      --trial-plan experiments/EXP-SEMBIN-d830d5/trial-plan-v2.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. trial-plan.json is a byte-twin
      of trial-plan-v1.json. Stage 0 must be the first admitted trial.

  objective: >-
    Measure whether Galbraith/Nagao coset typing conserves its combinatorial
    yield gain as lower complete cost per verified independent relation inside
    HEUR-YT's declared regime, or exchanges it into solver degree / Macaulay
    growth — delivering exactly one O-* label from H-SEMBIN-558848.

  class: measurement
  class_note: >-
    Heuristic-validation / measurement successor to EXP-SEMBIN-92724f.
    Not an exponent-moving breakthrough. Not a FIPS security verdict.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond tiny probes). Write
        stage0/preregistered-predictions.json (C1/C2 thresholds, cell list,
        cost-model schema, seeds) and stage0/backend-probe.json (msolve /
        pure-Python Macaulay / optional WDSat availability). Select the
        feasible subset of candidate cells {(24,6,3),(30,7,3),(36,8,4)} that
        satisfy mk≤n−3 and 2^k≫m² under the available backends and memory
        budget; record replacements only if they keep the same inequalities
        and are frozen before Stage 1. Missing primary backend →
        O-IMPEDIMENT stop (design stays valid; no science claimed).
      - >-
        Stage 1 (blocking smoke). Reproduce conventional untyped Semaev
        descend+solve path on one smoke cell; verify finite-k counting-cap
        identity against EXP-SEMBIN-92724f scoring rule; verify planted
        relation under independent group-law check. Failure → O-ARTIFACT
        stop.
      - >-
        Stage 2 (ladder). On each frozen cell run arms: untyped,
        additive-coset typed, degenerate-typed, randomized typed-null; fresh
        matched targets plus held-out set; charge complete cost model;
        record image_over_finite_k_cap, verified_relations_per_target,
        independent_relation_rank, maximum_solver_degree,
        maximum_macaulay_matrix_dimension, monomial_count,
        solver_wall_seconds, peak_rss_bytes, extraction_and_verification_seconds,
        final_linear_algebra_dimension, total_cost_per_verified_independent_relation.
        Optional SAT/XOR second backend when available on the same predicate.
        Write RESULTS.md with exactly one O-* label; memory beside every time
        figure.
    excluded:
      - Magma/Sage/cypari2/AUXIN/Bedrock as success path.
      - Deployed FIPS / production-curve ECDLP solves as claimed results.
      - Editing IDEA-20260918-c05e71 claim text.
      - Editing shared GOAL-SEMBIN-cbf422.yaml / GOAL-SEMBIN-5078bc.yaml.
      - Treating infra / missing-backend as evidence against C1–C3.
      - Scoring yield by raw relation count without independent rank.
      - Using asymptotic m! as the primary scoring cap inside finite-k cells.
      - Target-conditioned coset selection or uncharged preprocessing.
      - Reviving falsified frozen predictions of EXP-SEMBIN-92724f.
      - Citing sibling-only EXP/H identifiers as target_ids on this branch.

  inputs:
    idea: ledger/proposals/IDEA-20260918-c05e71.yaml
    hypothesis: ledger/hypotheses/H-SEMBIN-558848.yaml
    decision: ledger/decisions/DEC-20261002-5c465c.yaml
    predecessor_hypothesis: ledger/hypotheses/H-SEMBIN-c59e50.yaml
    predecessor_experiment: experiments/EXP-SEMBIN-92724f/specification.yaml
    predecessor_evidence: ledger/evidence/EV-SEMBIN-4614e7.yaml
    predecessor_code: experiments/EXP-SEMBIN-92724f/code/
    f4_trace_reference: experiments/EXP-SEMBIN-7e1371/code/f4_trace.py
    gf2_closure: src/crypto_autoresearcher/gf2/closure.py
    gf2_rank: src/crypto_autoresearcher/gf2/rank_only.py
    kn_lit_nagao: knowledge/literature/KN-LIT-ebd657.md
    gg_paper: inputs/GG-2014-806/paper_fulltext.txt
    nagao_paper: inputs/NAGAO-2015-984/paper_fulltext.md

  controls:
    - name: degenerate_typing
      description: >-
        Degenerate typing must reproduce the untyped accepted relation set
        on the smoke cell and on each ladder cell used for C2; mismatch →
        O-ARTIFACT.
    - name: randomized_typed_null
      description: >-
        Equal-cardinality randomized typed bases separate typing from
        special coset geometry; null is shape-matched, not a yield claim.
    - name: finite_k_cap_scoring
      description: >-
        Exact finite-k counting cap (EXP-SEMBIN-92724f) is the primary
        yield scorer; m! is reported only as large-k limit annotation.
    - name: held_out_targets
      description: >-
        Fresh held-out targets; any gain that disappears on held-out is
        O-ARTIFACT, not O-CONSERVED.
    - name: independent_group_law_verifier
      description: >-
        Every accepted relation and matrix row checked by independent
        group-law verification before cost aggregation.
    - name: independent_relation_rank
      description: >-
        Rank measured on the verified relation matrix; raw counts never
        substitute for independence.
    - name: backend_impediment_discipline
      description: >-
        Missing msolve / WDSat / other backend → O-IMPEDIMENT for that arm,
        never evidence against C1–C3.
    - name: memory_beside_time
      description: Peak RSS stated beside every time figure in RESULTS.md.

  independent_variables:
    - name: stage
      levels: [0_freeze_probe, 1_baseline_smoke, 2_ladder]
    - name: cell
      levels: [n24_k6_m3, n30_k7_m3, n36_k8_m4, stage0_feasible_subset]
    - name: arm
      levels: [untyped, additive_coset_typed, degenerate_typed, randomized_typed_null]
    - name: backend
      levels: [msolve_f4_trace, pure_python_macaulay_closure, optional_wdsat]
    - name: target_split
      levels: [train_matched, held_out]

  metrics:
    primary:
      - name: finite_k_image_over_cap
        unit: fraction
        definition: >-
          Typed (or arm) image size divided by the exact finite-k counting
          cap for that (n,k,m); median over targets per cell.
      - name: total_cost_per_verified_independent_relation
        unit: charged_ops_or_seconds_per_rank
        definition: >-
          Complete end-to-end cost (setup+search+solver+extract+verify+rank+LA)
          divided by independent_relation_rank; same schema on every arm.
      - name: independent_relation_rank
        unit: integer
        definition: Rank of the verified relation matrix over the base field.
      - name: maximum_solver_degree
        unit: integer
        definition: >-
          F4 step-degree (msolve d_F4_semaev convention) or pure-Python
          degree-capped closure productive degree, per arm.
    secondary:
      - name: verified_relations_per_target
        unit: count
        definition: Group-law-verified relations before rank.
      - name: maximum_macaulay_matrix_dimension
        unit: rows_x_cols
        definition: Largest Macaulay / closure matrix shape observed.
      - name: monomial_count
        unit: integer
        definition: Monomials at the recorded degree.
      - name: solver_wall_seconds
        unit: seconds
        definition: Measured solver wall clock (reported; not a pre-committed claim).
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS of Stage 1–2 processes.
      - name: extraction_and_verification_seconds
        unit: seconds
        definition: Extraction + group-law verification time.
      - name: final_linear_algebra_dimension
        unit: integer
        definition: Dimension of the final sparse LA system.
      - name: termination_reason
        unit: enum
        definition: completed | timeout | crash | O-ARTIFACT | O-IMPEDIMENT | O-EXCHANGED | O-NO-YIELD | O-CONSERVED.

  heuristic_under_test:
    - HEUR-YT
    - HEUR-CONSERVE

  preregistered_prediction:
    quantity: >-
      C1: median typed image_over_finite_k_cap ≥ 0.9 on ≥2/3 in-regime cells.
      C2: total_cost_per_verified_independent_relation ≥20% lower on typed
      than untyped at three increasing feasible sizes with no rank loss.
      Exchange: degree/matrix growth erasing ≥90% of combinatorial gain →
      O-EXCHANGED. Degenerate typing exact agreement; certificates pass.
    formula: >-
      Exact finite-k cap from EXP-SEMBIN-92724f scoring rule; combinatorial
      gain measured as typed/untyped yield ratio before cost; conservation
      requires net complete-cost reduction ≥20% after rank.
    source: >-
      ledger/proposals/IDEA-20260918-c05e71.yaml predictions +
      EV-SEMBIN-4614e7 successor note; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy_to_medium
    justification: >-
      Ladder cells at n∈{24,30,36} (or Stage-0 feasible replacements under
      the same inequalities). No transfer of cost ratios to n=163/233/283
      or any FIPS row. HEUR-YT regime clauses are local to the frozen cells.
    correspondence: null

  replication:
    seeds: [2026091805, 2026091806, 2026091807]
    independent_instances: 3
    note: >-
      Three seeds for target generation; held-out split frozen in Stage 0.
      Backend versions recorded in backend-probe.json.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 28800
    total_cpu_hours: 48.0
    maximum_memory_gb: 8
    maximum_runs: 24
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and backend-probe.json.
    - Stage 1 smoke pass (untyped path + cap identity + planted verify), OR O-ARTIFACT / O-IMPEDIMENT stop.
    - Stage 2 complete on frozen feasible cells with all required metrics, OR named O-* stop with measured quantity.
    - RESULTS.md names exactly one O-* label from H-SEMBIN-558848.
    - maximum_runs = 24.
    - Do not open deployed-n Semaev/ECDLP solves under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Scoring by raw count without independent rank → protocol invalid.
    - Target-conditioned coset selection or uncharged preprocessing → O-ARTIFACT / invalid.
    - Infra timeout/crash/missing-backend → O-IMPEDIMENT, never evidence against C1–C3.
    - Claiming break/exponent/FIPS under this card → protocol invalid.
    - Degenerate-typing mismatch or verifier failure → O-ARTIFACT; do not read C2.

  success_criterion: >-
    Stage 0 artifacts frozen; Stage 1 smoke recorded as pass or as named
    O-ARTIFACT/O-IMPEDIMENT stop; Stage 2 produces per-arm image-over-cap,
    independent rank, solver degree, Macaulay shape, complete cost metrics
    (or a named O-* stop with measured quantity); RESULTS.md names exactly
    one O-* label from H-SEMBIN-558848 with cited artifacts. O-CONSERVED,
    O-EXCHANGED, and O-NO-YIELD are all successful scientific completions
    when controls pass.

  falsification_criterion: >-
    Any of: C1 fails with controls passing (O-NO-YIELD); C2 fails because
    degree/matrix growth erases ≥90% of combinatorial gain at every size
    (O-EXCHANGED — conservation falsified); apparent speedup vanishes on
    held-out targets or after rank accounting (O-ARTIFACT); degenerate
    typing or verifier failure (O-ARTIFACT); target-conditioned basis /
    uncharged preprocessing detected; or a claim of break/exponent/FIPS
    under this card. Missing backend alone is O-IMPEDIMENT, not
    falsification of C1–C3.

  required_artifacts:
    - experiments/EXP-SEMBIN-d830d5/stage0/preregistered-predictions.json
    - experiments/EXP-SEMBIN-d830d5/stage0/backend-probe.json
    - experiments/EXP-SEMBIN-d830d5/stage1/
    - experiments/EXP-SEMBIN-d830d5/stage2/
    - experiments/EXP-SEMBIN-d830d5/RESULTS.md
    - experiments/EXP-SEMBIN-d830d5/runs/<RUN-SEMBIN-*>/

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
