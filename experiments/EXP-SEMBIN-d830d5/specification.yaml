    Stage 2 is admitted by trial-plan-v2 / TASK-20261003-130c83 with C2
    re-scope to {(30,7,3),(36,8,4)}. No Magma/Sage/AUXIN/Bedrock.
    No deployed-curve solve / exponent / FIPS.
  approval:
    approved_by: DEC-20261002-5c465c
    composing_decision: DEC-20261002-5c465c
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
