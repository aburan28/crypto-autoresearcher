  goal_id: GOAL-SEMBIN-cbf422
  version: 1
  title: >-
    Stage-0 in-regime feasibility and backend probe; Stage-1 untyped baseline
    + finite-k cap smoke; Stage-2 typed / degenerate / randomized-null ladder
    measuring image-over-cap and complete cost per verified independent
    relation with solver degree and Macaulay growth
  status: approved
