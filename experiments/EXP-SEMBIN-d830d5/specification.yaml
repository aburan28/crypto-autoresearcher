    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0 freezes feasible cells and backend probe before any ladder
      RESULTS reading. Stage 1 smoke-reproduces untyped Semaev path + finite-k
      cap identity. Stage 2 admitted by trial-plan-v2 under C2 re-scope
