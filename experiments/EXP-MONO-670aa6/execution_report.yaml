  anomalies_and_deviations:
    - >-
      Removed the (unstated-in-this-contract) supersingular-curve rejection
      that was present in EXP-MONO-c819ba's reused helper, after discovering
      it would eliminate ~half of the j0 panel purely from arithmetic
      (p = 2 mod 3 forces every j=0 curve supersingular). See
      implementation.md note 2.
    - >-
      Interpreted the null-object gate's Holm/Bonferroni families (i)/(ii)
      as Var-only per the more specific, itemized `multiplicity_correction`
      text, computing C/F null-object p-values as an additional,
      non-gating, informational diagnostic rather than silently widening or
      narrowing the declared family. See implementation.md note 3.
    - >-
      One primary-panel j0 curve (curve_ordinal=17) failed construction
      identically in both runs due to a coordinate-map generator
      independence check; excluded, not backfilled.
    - >-
      Legacy 8-curve sub-panel's subgroup-availability precondition was NOT
      met (only 1 of 8 curves has 4|n2, vs the >=2 required), so
      positive_control_1 and positive_control_2 are SKIPPED in both runs
      per specification -- this affects only legacy/graded continuity
      controls, never the primary-panel result.
    - >-
      Used an FFT-derived exact-integer convolution (route 2) for all
      20,100+ null/null-object/coset draws for computational tractability,
      cross-verified against the literal direct-convolution route on every
      real-arm cell in both runs (all agree <1e-9 relative). See
      implementation.md "Why route 2."

  claim_ceiling_reminder: >-
    Per specification.yaml `claim_ceiling`: this observation is scoped to
    the tested 100-curve (49 j0 + 50 random-ordinary) primary panel and
    8-curve legacy sub-panel, primes in [127, ~2050], F=N/4, m=4, 200
    matched-null draws per cell, Holm/Bonferroni correction, on this
    Executor's implementation and seeds. It supports no claim about
    asymptotic C, no cost/exponent conversion, and no transfer to
    cryptographic scale or F_{q^n}.

  completion_gate_check:
    stage0_reported_before_stage1_4: true
    realized_panel_sizes_reported_before_stage2: true
    stage2_gate_outcome_reported_explicitly_before_stage3_output: true
    stage2_passed_both_families_both_seeds_so_stage3_output_present: true
    legacy_L1_L4_and_graded_controls_reported: true
    manifests_bind_commit_dirty_seeds_environment_field_bits_timing_resources: true
    all_planned_runs_terminal: true
    missing_runs: none
    raw_data_and_summary_agree: >-
      Spot-checked (gate n_significant counts, dual-path residual booleans,
      P5 counts/rates, legacy L2/L3 ratios) directly against
      raw-result.json for both runs; this report's numbers are read from,
      not independently re-derived from, those artifacts.
    reproduces_from_recorded_command_and_revision: >-
      Yes -- see runs/RUN-MONO-670aa6-{1,2}/command.txt and manifest.yaml
      `code.commit`; construction is fully deterministic given the frozen
      domain/seed rule (SHA-256-based, no external randomness).

