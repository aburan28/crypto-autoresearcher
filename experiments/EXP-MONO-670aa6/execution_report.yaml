  budget:
    declared: {wall_clock_seconds: 7200, memory_gb: 2, maximum_runs: 2}
    used: >-
      ~7.1s wall-clock and ~77MB peak RSS per run, both runs -- no soft-stop
      threshold approached, no budget breach.

  stage_0_fixture_gate:
    description: >-
      Exact-identity sanity gate on fixture p=101, A=1, B=1, N=105, F=52
      (reused fixture pattern from EXP-MONO-c819ba's own Stage 0). Checks
      (m=1) Var = F(N-F)/N^2 exactly, and (m=2) the additive-quadruple and
      variance identities between the exact-integer convolution side and
      the character/FFT side.
      This is a re-verification of the arithmetic core, not a re-derivation
      of (I1)-(I3), which stand independently confirmed per
      EV-MONO-b84b24.
    result_both_runs: >-
      gate_pass: true (identical on both seeds; Stage 0 does not depend on
      master_seed). m1 exact match true; m2 additive-quadruple relative
      residual 0.0; m2 variance-identity relative residual ~3.75e-15.

  stage_1_panel_construction:
    primary_panel_declared: {j0: 50, random-ordinary: 50, total: 100}
    primary_panel_realized_after_curve_construction: {j0: 50, random-ordinary: 50}
    primary_panel_realized_after_factor_base_and_symmetry_check:
      j0: 49
      random-ordinary: 50
      identical_on_both_seeds: true
      note: >-
        Panel construction (primes, curves, factor bases) is keyed to the
        FIXED domain "EXP-MONO-670aa6/v1" and is therefore identical across
        both seeded runs -- only the null/null-object/coset-pick draws
        differ by seed (see implementation.md interpretation note 4). One
        j0 construction failure occurred identically in both runs:
        curve_ordinal=17, "coordinate map collision at k1=4,k2=0: point
        already mapped (G1,G2 not independent generators)" -- a genuine
        structural-integrity check in group_structure/build_coordinate_map
        catching a case where the generic generator-selection heuristic did
        not find an independent G2 for that curve's group structure.
        Reported and excluded, not patched or backfilled.
    floor_check: >-
      49 >= 40 and 50 >= 40: both families clear the success_criterion's
      40-curve floor.
    legacy_panel: 8 curves (RO1-4, CM1-2, J0, J1728) constructed successfully
      in both runs; no construction errors.
    interpretation_note: >-
      See implementation.md note 2: the frozen curve_construction text
      names no supersingular-curve rejection, and one was found during
      implementation to eliminate ~half of all j0 curve_ordinal slots if
      added (every j=0 curve at a prime p = 2 mod 3 is supersingular for
      EVERY choice of B). It was therefore omitted, matching the literal
      text; the realized j0 panel legitimately includes some supersingular
      curves at such primes.

  stage_2_null_object_gate:
    headline: >-
      GATE PASSED IN BOTH FAMILIES, ON BOTH SEEDS. Stage 3 real-arm numbers
      below were computed, read, and reported ONLY because of this result.
    per_run:
      RUN-MONO-670aa6-1:
        j0: {n_curves: 49, holm_family_i_var_n_significant: 0, min_adjusted_p: 1.0}
        random-ordinary: {n_curves: 50, holm_family_ii_var_n_significant: 0, min_adjusted_p: 1.0}
        gate_pass: true
      RUN-MONO-670aa6-2:
        j0: {n_curves: 49, holm_family_i_var_n_significant: 0, min_adjusted_p: 1.0}
        random-ordinary: {n_curves: 50, holm_family_ii_var_n_significant: 0, min_adjusted_p: 0.2488}
        gate_pass: true
    families_i_ii_definition: >-
      Var statistic only, m=4, F=N/4, per curve, per curve-family, per the
      literal `multiplicity_correction` text -- see implementation.md note 3
      for the disclosed tension with metrics.primary P4's looser phrasing
      and how it was resolved (Var-only families gate; C/F null-object
      p-values computed and Holm-corrected as an ADDITIONAL, NON-GATING,
      informational diagnostic).
    cf_informational_diagnostic_both_runs: >-
      Zero significant curves in both families, both runs, on the
      informational C/F null-object Holm correction too (not part of the
      declared gate, reported per "record, never discard").
    outcome: controlled_null_confirmed_at_corrected_calibration (pending Stage 3/4 below)

  stage_3_real_arm:
    gated_note: >-
      Computed, read, and reported ONLY because Stage 2 passed in both
      families on both seeds, per the frozen hard-stop rule.
    dual_path_control:
      RUN-MONO-670aa6-1: {all_100_real_arm_cells_within_1e-9: true}
      RUN-MONO-670aa6-2: {all_100_real_arm_cells_within_1e-9: true}
      note: >-
        Route 1 (direct roll-based exact-integer convolution) and Route 2
        (FFT-derived exact-integer convolution) agree to <1e-9 relative
        on every one of the 100 real-arm cells in both runs (most residuals
        are of order 1e-12 to 1e-15); convolution side (both routes compute
        the identical object) is primary per specification.
    holm_families_iii_iv:
      RUN-MONO-670aa6-1:
        j0: {n_tests: 98, n_curves: 49, n_significant_tests: 0, min_adjusted_p: 1.0}
        random-ordinary: {n_tests: 100, n_curves: 50, n_significant_tests: 0, min_adjusted_p: 1.0}
      RUN-MONO-670aa6-2:
        j0: {n_tests: 98, n_curves: 49, n_significant_tests: 0, min_adjusted_p: 1.0}
        random-ordinary: {n_tests: 100, n_curves: 50, n_significant_tests: 0, min_adjusted_p: 0.4975}
      definition: >-
        Var AND C/F p-values pooled per curve-family (2 tests x n curves),
        m=4, F=N/4, Holm-Bonferroni within each family, per the frozen
        `multiplicity_correction` (iii)/(iv) text.
    p5_enrichment:
      statistic_used: >-
        Var, m=4, uncorrected two-sided permutation p < 0.05 per curve,
        this run (see implementation.md for why this operationalization of
        "nominal exceedance" was chosen; the frozen text does not spell out
        the exact single-run definition).
      RUN-MONO-670aa6-1:
        j0: {exceedance_count: 2, n: 49, rate: 0.0408}
        random-ordinary: {exceedance_count: 1, n: 50, rate: 0.02}
        fisher_exact_p_two_sided: 0.6173
      RUN-MONO-670aa6-2:
        j0: {exceedance_count: 1, n: 49, rate: 0.0204}
        random-ordinary: {exceedance_count: 1, n: 50, rate: 0.02}
        fisher_exact_p_two_sided: 1.0
      not_pre_registered_direction: >-
        Reported as measured, per preregistered_prediction's own text. Both
        runs show j0 rate >= random-ordinary rate (opposite direction to
        the Red Team's own EXP-MONO-c819ba replication's 12.1%-vs-20.0%
        finding), neither difference statistically significant.
        This is itself a reportable observation about replication
        stability across two independent panels/instruments, per
        falsification_criterion(d) -- not evidence either direction about
        H-MONO-663fb4.
    full_per_cell_tables: >-
      Every curve's raw and Holm-adjusted p-value (both statistics, both
      families, both runs) is in `raw-result.json`'s
      `stage3_real_arm_holm_families_iii_iv.<family>.per_test_adjusted_pvalue`
      list and `stage3_per_curve` block; not reproduced element-by-element
      here per artifact-vs-summary separation.

