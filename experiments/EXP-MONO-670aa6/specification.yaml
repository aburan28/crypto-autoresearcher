experiment:
  id: EXP-MONO-670aa6
  version: 1
  status: completed
  status_note: >-
    Completed 2026-08-31 (2 runs, RUN-MONO-670aa6-1/2). Disposition:
    DEC-20260831-a4b23f, evidence EV-MONO-849355. Stage 0 and the
    dual-path check on the 100 real-arm cells held; the declared
    Stage-2/Stage-3 primary test had ZERO statistical power by
    construction (permutation p-value floor exceeds every declared Holm-
    Bonferroni family's threshold by 5-10x, independently confirmed by
    both reviewers) and the P5 enrichment comparison is compromised
    (100% prime/B/t_used collision across matched curve pairs, plus 58%
    supersingular contamination of the j0 arm). See
    CORR-20260831-d15d36 for the out-of-band edit disclosure (NOT
    adopted) and KN-TECH-95a42b for the design-time check that would
    have caught this before execution. K3/K4 remains open; a properly
    re-derived successor contract is DEC-20260831-a4b23f's next_action.
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-08-30'
  coordinator_approval_rationale: >-
    APPROVED. This contract IS the `next_action` DEC-20260830-891d39 itself
    named: a corrected-calibration replication of H-MONO-663fb4's K3/K4
    question, using exactly the design both independent reviewers of
    EXP-MONO-c819ba converged on and the Red Team explicitly proposed --
    200 null draws per cell (not 30), permutation-based p-values with
    Holm/Bonferroni correction over all tested cells (not a fixed
    multiplicative band), one primary cell per curve across a >=100-curve
    panel (not a small fixed panel), and a mandatory panel-level
    null-object arm gating interpretation of every treatment cell (closing
    OBJ-6, the ordering-control gap EXP-MONO-c819ba's own null arm
    violated undetected). (1) SAME STANDALONE-BRANCH AUTHORITY AS ALL
    EIGHT PRIOR MONO CONTRACTS THIS SESSION: GOAL-MONO-001 is `paused`
    with its own batch campaign budget (maximum_batches: 3) exhausted;
    this is a standalone experiment under the classic lifecycle, drawing
    on none of that budget, per DEC-20260810-2f86db's own text. (2) NO
    CLAIM ON GOAL-ECDLP-001 OR GOAL-RELN-001 TERRITORY: identical scope
    boundary to EXP-MONO-c819ba, unchanged. (3) THE HYPOTHESIS IS
    UNCHANGED; ONLY THE INSTRUMENT'S CALIBRATION IS CORRECTED. This
    contract does not restate or re-derive H-MONO-663fb4's mechanism; it
    tests the identical K3/K4 prediction with a design that KN-TECH-7745e6
    shows is actually powered to detect what it claims to test. (4)
    MODEL-CORRELATION CONFOUND, DISCLOSED AND CARRIED FORWARD: this
    contract is drafted by the same Coordinator session (resolved
    claude-sonnet-5) that composed DEC-20260830-891d39; the coming review
    round's resolved models are to be disclosed exactly as measured, not
    assumed, per the pattern EV-MONO-b84b24 already established of
    checking each reviewer's own runtime-session-receipt.json.
  hypothesis_id: H-MONO-663fb4
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  batch_id: null
  batch_id_note: >-
    No batch is asserted. GOAL-MONO-001 is `paused` with its campaign
    budget exhausted; batch assignment is a Coordinator act and is not
    performed here.

  title: >-
    Corrected-calibration replication of EXP-MONO-c819ba's K3/K4
    discriminating test: permutation-based, Holm/Bonferroni-corrected,
    4000-draw null, >=100-curve panel, mandatory pre-treatment null-object
    gate.

  objective: >-
    Decide, at toy scale and under an instrument whose own false-positive
    rate is measured rather than assumed, whether the real x-coordinate
    factor base's character bias (Var_R N_m(R) and C/F at m=4) is
    statistically distinguishable from a matched random symmetric subset
    of the same size -- the exact question EXP-MONO-c819ba's fixed-band
    instrument was shown, by independent review (EV-MONO-b84b24), to be
    uncalibrated for.

  supersession_note: >-
    This is a NEW experiment, not an amendment: EXP-MONO-c819ba is
    frozen, completed and immutable. Nothing here edits, reruns, or
    retroactively reinterprets EXP-MONO-c819ba's own archived numbers.
    Its identities (I1)-(I3) and both positive controls already stand
    independently confirmed and are NOT re-tested here except as a cheap
    Stage-0 sanity gate; this contract's entire marginal contribution is
    the corrected K3/K4 test.

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection at scale.
    - Not an ECDLP cost, runtime, asymptotic, exponent, cryptographic-scale, or deployed-scheme claim.
    - >-
      Not a closure of KN-OPEN-009. Its imprimitivity/monodromy half is
      EXP-MONO-12ce1c's and is untouched here.
    - >-
      Not a re-litigation of EXP-MONO-c819ba's disposition: this contract
      accepts DEC-20260830-891d39's finding that the prior run's escalated
      signal was a calibration artifact, and does not re-test that
      specific claim -- it tests the underlying K3/K4 question fresh,
      under corrected calibration.
    - >-
      Not an adjudication of this corpus's alpha or max-C disagreements
      (read, not resolved, by EXP-MONO-c819ba's Stage 1; not re-read here).
    - Not a claim on GOAL-ECDLP-001's or GOAL-RELN-001's territory.
    - Not approved for any purpose beyond what this record states once run.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: that on a declared panel of >= 100 independently-constructed
      curves (>= 50 j=0, >= 50 random-ordinary) over primes in [100, 3000],
      with exhaustive target enumeration, 4000 matched null draws per cell,
      and a Holm/Bonferroni-corrected permutation test whose own
      null-object false-positive rate was measured and found controlled,
      the real x-coordinate factor base's character bias at m=4, F=N/4
      either was or was not distinguishable from a matched random
      symmetric subset -- reported per curve-family, with an explicit
      enrichment comparison between the two families.
    what_no_outcome_can_support: >-
      No outcome establishes the asymptotic size of C; no outcome converts
      a measured deviation into a cost or an exponent; no outcome
      transfers to crypto scale or to F_{q^n}. Toy evidence is never
      crypto-scale evidence (AGENTS.md rule 7).

  inputs:
    field_bits: [7, 8, 9, 10, 11]
    prime_range: [100, 3000]
    m_values_primary: [4]
    m_values_secondary: [1, 2, 3]
    m_note: >-
      m=4 is the PRIMARY, FWER-controlled test (matching L3/K4's sharpest
      moment and the moment EXP-MONO-c819ba's escalated finding was
      measured at). m=1 remains calibration-only, declared non-
      discriminating (Parseval forces agreement by construction) and
      excluded from every corrected family. m=2,3 are reported as
      secondary/graded checks on the legacy sub-panel only (see
      `legacy_controls_panel`), never contributing a corrected p-value.
    primary_factor_base_size: "N/4"
    primary_f_note: >-
      A SINGLE, PRE-DECLARED F PER CURVE for the primary test, chosen as
      N/4 -- H-MONO-663fb4's own P2 names small structured factor bases
      (F << N) as "the actual index-calculus regime" and the Red Team's
      replication used a single F per curve for exactly this reason
      (one cell per curve, not a ladder, is what keeps the correction
      family well-defined and the multiplicity count honest). The full
      F-ladder ({N/16,N/8,N/4,N/2}) is retained as a secondary, uncorrected
      graded control on the smaller legacy panel only.
    null_draws_per_cell: 4000
    null_draws_note: >-
      Raised from EXP-MONO-c819ba's 30. The Validator's 20,000-trial
      bootstrap (EV-MONO-b84b24 observation 3) and the Red Team's
      draw-count-sensitivity test both showed the m=4 statistic's null
      distribution stabilizes by 200 draws, so 200 is the STABILITY floor;
      it is NOT the RESOLUTION floor this design needs. A permutation
      p-value over n draws cannot fall below 1/(n+1), and Holm/Bonferroni
      over a declared family of ~100 tests at alpha=0.05 rejects only at
      p <= 5e-4, so n=200 (floor 1/201 ~ 4.98e-3) would make every
      corrected test -- including the Stage-2 hard stop -- tautologically
      non-significant. n=4000 gives a floor of 1/4001 ~ 2.50e-4, i.e. half
      the tightest Holm threshold of any declared family, so the gate and
      P1-P3 can genuinely fire. This number is FROZEN.
    targets: >-
      ALL R in E(F_p), exhaustively. No target sampling, unchanged from
      EXP-MONO-c819ba.
    primary_panel:
      j0_curves: 50
      random_ordinary_curves: 50
      total: 100
      construction_note: >-
        Each of the 100 curves is an INDEPENDENTLY drawn curve (not a
        shared fixed panel reused across cells): distinct primes and
        distinct (A,B) per curve, drawn by the seed rule below with a
        curve-ordinal component so no two panel curves share a
        construction stream. This directly reproduces the design that let
        the Red Team's replication test enrichment (12.1% vs 20.0%,
        EV-MONO-b84b24 observation 2) rather than a single fixed-panel
        anecdote.
    legacy_controls_panel:
      reused_from: EXP-MONO-c819ba/v1 curve_panel requirements, unchanged
      random_ordinary_minimum: 4
      cm_minimum: 2
      j0_required: true
      j1728_required: true
      subgroup_availability_required: true
      subgroup_availability_note: >-
        At least two panel curves must have #E(F_p) admitting a proper
        subgroup of index 2 and of index 4 (4 | n2 in the invariant-factor
        sense EXP-MONO-c819ba's execution_report.yaml documents), so
        positive_control_1 can be instantiated at h=N/2 and h=N/4 with
        distinct forced values 1 and 3. If unmet, positive_control_1 and
        positive_control_2 do not exist for this run and are reported
        SKIPPED -- this affects only the legacy/graded controls, never the
        primary_panel test, which does not depend on subgroup structure.
      panel_size: 8
      panel_construction: >-
        THIS IS THE SAME 8-CURVE CONSTRUCTION AS EXP-MONO-c819ba/v1
        (identical roles RO1-RO4, CM1-CM2, J0, J1728), reused here under
        THIS contract's own domain string so its draws are independent of
        EXP-MONO-c819ba's, purely to re-exercise the subgroup/coset-union
        positive controls and the F-ladder/m-ladder graded controls as a
        secondary sanity layer. No number from this sub-panel is corrected
        or contributes to the primary escalation decision.
    master_seed: 20260901
    domain: EXP-MONO-670aa6/v1
    seed_derivation_rule: >-
      Every draw uses SHA-256 of the ASCII bytes of
      domain || "|" || decimal(master_seed) || "|" || family || "|" ||
      label || "|" || decimal(field_bits_or_p) || "|" ||
      decimal(curve_ordinal) || "|" || decimal(m) || "|" ||
      decimal(draw_index) || "|" || decimal(counter), big-endian unsigned,
      with rejection sampling against modulo bias (reject digests >=
      floor(2^256/M)*M for a draw in [0,M)). Labels used, and no others:
      "prime", "curve-a", "curve-b", "null-subset", "null-object-pick",
      "coset-pick". `family` is one of "j0", "random-ordinary", "legacy"
      and no others; it is part of the preimage so the two primary_panel
      families, whose curve_ordinals are independently numbered, draw
      DISJOINT construction streams and therefore distinct primes rather
      than colliding on matching (field_bits, curve_ordinal) pairs.
      `master_seed` is likewise part of the preimage, so the two planned
      replication runs (seeds 20260901 and 20260902) are independent draws
      rather than bit-identical repeats. Counters start at 0 and advance
      once per digest consumed, per label, per (p, m, draw_index).
      `curve_ordinal` runs 0..49 within each of the two primary_panel
      families (independently numbered) and is fixed at a per-role constant
      (0) for legacy_controls_panel, exactly reproducing EXP-MONO-c819ba's
      own single-curve-per-role construction for that sub-panel. A third
      party holding the domain and the master seed reproduces every
      instance bit-for-bit.
    prime_construction: >-
      For a target field_bits b and curve_ordinal k within family f: h =
      int(SHA256(seed(f, "prime", b, k, 0, 0))), L=2^(b-1), U=2^b, c_0 = L +
      1 + 2*(h mod 2^(b-2)), test c_j = c_0 + 2j while c_j < U; prime iff
      >3, odd, no odd divisor up to floor(sqrt(c_j)). For the j0_curves
      family additionally require p = 1 mod 3 (a j=0 curve y^2 = x^3 + B
      over p = 2 mod 3 is forced supersingular, which would contaminate the
      j=0 vs random-ordinary comparison); candidates failing that
      congruence are skipped and the scan continues. Reaching U is
      CONSTRUCTION_FAILURE for that (b,k); no wrapping, no reseeding --
      that curve ordinal is simply absent from the panel and the shortfall
      is reported, never silently backfilled from a different bit length.
      The 100-curve primary panel draws field_bits round-robin across
      [7,8,9,10,11] (i.e. curve_ordinal k uses field_bits[k mod 5]) so
      each bit length contributes 10 curves per family.
    curve_construction: >-
      For t=0,...,65535: a_t=int(SHA256(seed(f,"curve-a",p,k,0,t))) mod p,
      b_t=int(SHA256(seed(f,"curve-b",p,k,0,t))) mod p; reject if
      (4a_t^3+27b_t^2) mod p = 0; reject if the candidate is not ORDINARY
      (trace of Frobenius t_E = p + 1 - #E(F_p) with t_E = 0 mod p is
      supersingular and is rejected, checked not assumed); accept the first
      candidate surviving both rejections. For the j0_curves family: A=0
      forced, B drawn from the same stream (rejecting B=0); combined with
      the p = 1 mod 3 requirement above, every j=0 panel curve is ordinary.
      For the random_ordinary_curves family: both A,B drawn freely
      (rejecting the j=0 and j=1728 loci exactly, i.e. reject A=0 and
      reject B=0). Full group structure E(F_p)=Z/n1 x Z/n2 computed and
      recorded for every curve.
    factor_base_construction: >-
      Identical rule to EXP-MONO-c819ba: FB = points P with x(P) in the
      x-coordinate set of the first F values (increasing scan order) with
      (x^3+Ax+B)^((p-1)/2) mod p = 1. Symmetry (-FB=FB) CHECKED, not
      assumed; failure is a construction failure for that curve, reported
      and excluded, never silently patched.

  stage_order_and_the_terminating_stage:
    principle: >-
      Cheapest decisive gate first, AND the null-object gate now comes
      BEFORE any real-arm number is read at all -- directly closing OBJ-6.
    stage_0:
      name: exact-identity sanity gate, reused fixture
      compute: none to seconds
      description: >-
        Re-verify (I1)-(I3) symbolically and on the SAME frozen fixture
        cell EXP-MONO-c819ba's Stage 0 used (already independently
        confirmed twice, by the Validator and Red Team). This is a cheap
        sanity check that this contract's own arithmetic core is not
        broken, not a re-derivation.
      terminates_the_run_if: Either identity fails on the fixture. Halt; report as an implementation defect, not new mathematical evidence.
    stage_1:
      name: construct the 100-curve primary panel and the 8-curve legacy panel
      compute: seconds to low minutes
      description: >-
        Construct every curve, record group structure, factor base,
        symmetry check and construction-failure count per family. Report
        the realized panel sizes explicitly (a shortfall from 50+50 due to
        construction failures is reported, not silently backfilled).
    stage_2:
      name: MANDATORY NULL-OBJECT GATE -- must pass before Stage 3
      compute: minutes
      description: >-
        For every curve in the primary panel, draw 4000 matched-null
        symmetric subsets (label "null-subset") AND one additional,
        independently-labelled symmetric subset of the same size (label
        "null-object-pick") standing in for "treatment" though it is drawn
        from the identical null-generating process. Run the EXACT SAME
        permutation-test + Holm/Bonferroni procedure defined below on the
        null-object arm against the 4000 null draws, separately within
        each of the two families (j0, random-ordinary).
      terminates_the_run_if: >-
        The null-object arm produces ANY Holm/Bonferroni-corrected
        p-value below alpha=0.05 in EITHER family. This means the
        correction procedure itself has an uncontrolled false-positive
        rate on THIS panel and draw count, exactly the failure
        KN-TECH-7745e6 documents and EXP-MONO-c819ba's OBJ-6 exposed
        undetected. If this triggers, STOP: report as instrument_failure,
        do not compute, read, or report any real-arm treatment cell, and
        do not interpret this as evidence about H-MONO-663fb4 in either
        direction (AGENTS.md rule 3 analogue: an instrument-calibration
        failure is not mathematical evidence).
    stage_3:
      name: real arm and correction, gated on Stage 2 passing
      compute: minutes
      description: >-
        Only entered if Stage 2's null-object gate passes in BOTH
        families. Compute the real x-coordinate factor base's L2*
        (Var_real/Var_null-derived permutation p-value) and L3* (C/F
        analogue) at m=4, F=N/4, per curve, in both families. Apply
        Holm/Bonferroni correction within each family across its curves.
        Report the cross-family enrichment comparison (Fisher exact, on
        the UNCORRECTED nominal-exceedance counts, matching the Red
        Team's own diagnostic) as a secondary, non-primary check.
    stage_4:
      name: legacy/graded controls on the 8-curve sub-panel
      compute: minutes
      description: >-
        Reruns EXP-MONO-c819ba's own subgroup, coset-union, F-ladder,
        m-ladder and prime-ladder controls on the independently-drawn
        8-curve legacy sub-panel, under THIS contract's own domain and
        seeds, purely as continuity evidence. Never contributes a
        corrected p-value to the primary escalation decision.

  arms_and_controls:
    treatment: >-
      REAL ARM, PRIMARY PANEL. For each curve in each family, at F=N/4,
      m=4: compute N_4(R) for all R by exact integer convolution, emit
      Var_real (ordered convention; multiset reported alongside per
      dual_convention_control) and C_real/F.
    measured_null: >-
      4000 matched-null symmetric subsets per curve, identical size F=N/4,
      SAME curve, SAME m, SAME exhaustive target set, label "null-subset".
      This is the reference distribution the permutation p-value is
      computed against -- NOT a fixed band. p_curve = (1 + #{null draws
      with |stat_null - median(null)| >= |stat_real - median(null)|}) /
      (4001), two-sided, per curve, per family, per statistic (Var and
      C/F separately).
    null_object_arm: >-
      MANDATORY, GATES EVERYTHING (Stage 2). One additional symmetric
      subset per curve, label "null-object-pick", drawn from the identical
      generating process as measured_null, treated as if it were the real
      arm and run through the identical permutation-test +
      Holm/Bonferroni procedure against the SAME 4000 null-subset draws.
      This directly instruments the false-positive rate KN-TECH-7745e6
      quantifies (EXP-MONO-c819ba's null arm was itself out-of-band on
      17/192 combinations, uncaught): here, a corrected exceedance in the
      null-object arm is a HARD STOP, not a footnote.
    positive_control_1: >-
      LEGACY PANEL ONLY. Subgroup arm, exact forced value N/h-1 at h=N/2
      and h=N/4, unchanged from EXP-MONO-c819ba. Reported for continuity;
      contributes no corrected p-value.
    positive_control_2: >-
      LEGACY PANEL ONLY. Coset-union arm, unchanged from EXP-MONO-c819ba
      (including its own out-of-band-fixed degenerate-g exclusion, per
      CORR-20260830-2b6706 -- this contract's implementation MUST exclude
      order-2 cosets from the coset-union draw, matching the corrected
      logic, since building fresh here means there is no reason to
      reintroduce a known bug).
    graded_controls: >-
      LEGACY PANEL ONLY: F-ladder decay, m-ladder decay (m=2,3,4 against
      forced (C/F)^(m-2)), prime-ladder C/sqrt(F) trend. Unchanged in
      design from EXP-MONO-c819ba; reported as secondary continuity
      evidence, never corrected or escalation-eligible.
    dual_convention_control: Ordered and multiset counts at every primary and legacy cell, unchanged.
    dual_path_control: Convolution side and character side must agree to 1e-10 relative; convolution side is always primary.
    multiplicity_correction: >-
      Holm-Bonferroni, applied SEPARATELY within four declared families:
      (i) j0-family null-object p-values (Var and C/F, m=4), (ii)
      random-ordinary-family null-object p-values (Var and C/F, m=4), (iii)
      j0-family real-arm p-values (Var and C/F, m=4), (iv)
      random-ordinary-family real-arm p-values (Var and C/F, m=4). Family
      (i) and (ii) must BOTH show zero corrected-significant curves before
      family (iii)/(iv) are computed or read (Stage 2 gate). alpha=0.05
      family-wise for every family. Families (i)/(ii) mirror (iii)/(iv)
      EXACTLY in statistic set and multiplicity (both statistics, same
      curves, same correction), so the gate measures the false-positive
      rate of the same procedure the real arm is read under -- a C/F
      calibration failure trips the hard stop rather than passing
      unmeasured.
    comparability_policy: >-
      No comparison of measured numbers with EXP-MONO-c819ba or any other
      contract is licensed -- distinct domain, distinct seeds, distinct
      panel. The comparison this contract DOES license is the internal
      j0-vs-random-ordinary enrichment test declared above, and against
      KN-TECH-7745e6's documented calibration procedure.

  metrics:
    primary:
      - >-
        P1 (j0 family): Holm/Bonferroni-corrected permutation p-value of
        Var_real vs the 4000-draw null, per curve, at m=4, F=N/4; count of
        curves significant at corrected alpha=0.05.
      - "P2 (random-ordinary family): identical statistic and correction, independently."
      - "P3: C/F analogue of P1 and P2, same families, same correction."
      - >-
        P4 (null-object gate): identical statistics and correction applied
        to the null-object arm in both families; MUST show zero
        significant curves for P1-P3 to be interpretable at all.
      - >-
        P5 (enrichment): Fisher exact test comparing the two families'
        UNCORRECTED nominal-exceedance rates at m=4, matching the Red
        Team's own diagnostic (EV-MONO-b84b24 observation 2).
    secondary:
      - Legacy-panel L1-L4 and graded controls, exactly as EXP-MONO-c819ba's metrics block, unchanged in definition.
      - Realized panel sizes and construction-failure counts per family.
      - Per-curve group structure, N, factor-base digest and symmetry-check result.

  preregistered_prediction:
    - quantity: P4 (null-object gate)
      value: zero corrected-significant curves in both families
      formula: >-
        By construction the null-object arm has no real effect; a
        properly-calibrated correction should reject at approximately
        the nominal family-wise rate (near 0 corrected hits at n=4000,
        alpha=0.05), per KN-TECH-7745e6's own diagnosis of why n=30 failed
        this same test.
      source: KN-TECH-7745e6; EV-MONO-b84b24 observations 2-3.
    - quantity: P1, P2, P3 (real arm, both families)
      value: >-
        TWO-SIDED, PRE-REGISTERED AS GENUINELY OPEN: zero or few
        corrected-significant curves is the controlled-null outcome
        H-MONO-663fb4 K3/K4 originally predicted; a nonzero, family-
        consistent, ENRICHED (see P5) count of corrected-significant
        curves in one family only is the exceptional-locus outcome
        KN-OPEN-009 asks about. Either is a first-class deliverable.
      source: H-MONO-663fb4 K3/K4, retested under corrected calibration.
    - quantity: P5 (enrichment)
      value: >-
        NOT pre-registered in a specific direction; reported as measured.
        The Red Team's own EXP-MONO-c819ba replication found j=0 curves
        LESS enriched than random-ordinary (12.1% vs 20.0%, p=0.092) at
        n=30 -- whether that direction persists, reverses, or vanishes
        at n=4000 with a fresh, larger, independently-constructed panel is
        exactly what this metric is for.
      source: EV-MONO-b84b24 observation 2.

  replication:
    planned_runs: 2
    seeds: [20260901, 20260902]
    interpretation: >-
      Two runs at different master seeds. The null-object gate (Stage 2)
      is re-evaluated independently on each seed and BOTH must pass before
      either run's real-arm results are read.

  budget:
    maximum_runs: 2
    maximum_wall_seconds: 7200
    maximum_cpu_seconds: 14400
    maximum_peak_rss_bytes: 2147483648
    maximum_total_disk_bytes: 2147483648
    maximum_workers: 1
    no_network: true
    cost_note: >-
      Primary panel is 100 curves x 1 F-value x 1 primary m-value x 4001
      draws (4000 null + 1 null-object) = 400,100 cell computations, versus
      EXP-MONO-c819ba's panel which completed its full ladder in 1.9s of
      measured wall time; even at a conservative 1000x scale-up this is
      inside the 7200s ceiling. The legacy panel reproduces
      EXP-MONO-c819ba's own (already-measured-cheap) full ladder at 8
      curves. If either panel construction or the correction procedure
      breaches budget, this is `failed_infrastructure`/budget breach per
      `infrastructure_failure_disposition` -- reduce panel size in a
      superseding contract, never silently truncate the declared panel.

  environment_preconditions:
    consequence: >-
      NO CAS AND NO SOLVER IS REQUIRED, unchanged from EXP-MONO-c819ba.
      Pure-Python exact-integer convolution is the primary metric path.
    if_a_precondition_fails: >-
      A missing interpreter, a failed symmetry check, or a curve-
      construction shortfall is `failed_infrastructure`, reported as
      infrastructure signal, NEVER negative mathematical evidence
      (AGENTS.md rule 3).

  infrastructure_failure_disposition: >-
    Any timeout, crash, memory-cap breach, construction failure, or
    dual-path disagreement is recorded with its exact cause and classified
    `failed_infrastructure` or `invalid`. Supports and weakens NOTHING
    about H-MONO-663fb4 or the ECDLP.

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen and authorized. (Satisfied here by this Coordinator approval.)
    - Stop at Stage 0 if either reused identity fails on the fixture.
    - >-
      STOP AT STAGE 2 (HARD, NOT A WARNING) if the null-object gate shows
      any corrected-significant curve in either family. No Stage 3 or 4
      output may be computed, read, or reported if this triggers.
    - Skip legacy positive controls 1/2, without affecting the primary decision, if the legacy panel's subgroup-availability precondition is unmet.
    - Stop on any budget breach, reporting it as infrastructure signal.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Any missing construction record, factor-base digest, symmetry check, seed record or manifest.
    - Any run manifest lacking field_bits.
    - Any cell reporting one convention only.
    - Any cell whose targets were sampled rather than exhaustively enumerated.
    - Any real-arm p-value read, computed, or reported before the Stage-2 null-object gate has passed in both families.
    - >-
      Any post-hoc change to null_draws_per_cell, the correction method,
      alpha, or the declared families after any Stage-2 or Stage-3 number
      has been observed. Such a change requires a versioned protocol
      amendment marked exploratory_only and is never a silent edit.

  success_criterion: >-
    A run is well-formed evidence (regardless of which direction P1-P3
    come out) if: Stage 0 passes; the primary panel realizes at least 40
    curves per family (allowing for construction-failure attrition from
    the declared 50); Stage 2's null-object gate passes in both families
    on both seeds; P1-P5 are reported with their exact corrected p-value
    counts and the enrichment Fisher-exact result; and the legacy panel's
    L1-L4 continuity checks are reported. THAT DISPOSITION SUPPORTS
    EXACTLY the scoped statement in claim_ceiling and nothing more.

  falsification_criterion: >-
    Any of: (a) Stage 0 identity failing; (b) the Stage-2 null-object gate
    failing in either family (instrument_failure, not evidence about
    H-MONO-663fb4); (c) a Holm-corrected significant result appearing in
    ONE family's real arm but not the other, WITH the null-object gate
    clean in both -- this falsifies the pre-registered "no exceptional
    locus anywhere" default and is escalated to independent review rather
    than reported as routine; (d) the enrichment test (P5) disagreeing in
    direction or significance from the Red Team's own EXP-MONO-c819ba
    finding, which is itself a reportable finding about replication
    stability, not a defect.

  outcomes:
    no_execution_authorization: Not applicable; this contract is authorized as of this Coordinator approval.
    controlled_null_confirmed_at_corrected_calibration: >-
      Null-object gate clean, and P1-P3 show no (or statistically expected
      few) corrected-significant curves in either family. This is the
      relation-rate statement KN-OPEN-009 wanted, this time from an
      instrument whose own false-positive rate was measured and controlled.
    exceptional_locus_found: >-
      Null-object gate clean, and one family shows a corrected-significant,
      enrichment-consistent signal the other does not. Escalated to
      independent review-adversarial; not written up as an attack, because
      the linear-algebra stage remains uncharged.
    instrument_still_uncalibrated: >-
      Null-object gate fails in either family even at n=4000. This would
      itself be a significant, reportable finding about the statistic's
      intrinsic difficulty to calibrate at toy scale, distinct from and
      more informative than a silent failure -- report prominently, do not
      interpret any real-arm number.
    infrastructure_or_integrity_failure: See infrastructure_failure_disposition. Never mathematical evidence.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      Unchanged from EXP-MONO-c819ba: the identities are scale-free and
      hold by derivation; the measured quantities (C/F, Var ratios) at
      p ~ 10^3 do not transfer to cryptographic scale. Nothing here
      addresses F_{q^n} or charges the linear-algebra stage.

