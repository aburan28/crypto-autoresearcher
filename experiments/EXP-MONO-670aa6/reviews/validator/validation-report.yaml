  other_correctness_findings:
    - id: OTHER-FINDING-1
      title: This contract's own pre-approval requirements were not, and could not have been, satisfied.
      finding: >-
        `specification.yaml.approval_requirements` explicitly requires that
        independent review confirm the null-object gate "genuinely can
        trigger (i.e. is not tautologically satisfied)" and that the Holm
        family declarations are fixed before any p-value is computed. The
        second half was met; the first was not, and per DEFECT-1's
        unconditional floor/threshold inequality, COULD NOT have been met by
        this design at n=200 with families of size 49-100. No artifact in
        this experiment's own trail (execution_report.yaml, implementation.md)
        shows an independent pre-execution review having checked this
        specific requirement before the Coordinator's approval and the
        Executor's run. This is a process gap at approval time, not merely a
        post-hoc discovery, and is worth the Coordinator's attention for
        future contract-approval practice, independent of this specific
        experiment's disposition.
    - id: OTHER-FINDING-2
      title: 58% of the realized j0-family primary panel is supersingular, not ordinary, and this is unquantified in the existing record.
      finding: >-
        Independently computed (RECOMP-5/defect2 script) over the 50
        realized j0 curves: 29/50 (58%) have p = 2 mod 3 and are therefore
        FORCED supersingular (N = p+1 exactly, since the Hasse bound forces
        the supersingular trace-zero condition at these prime sizes), versus
        1/50 for the random-ordinary family. This is a direct, disclosed
        CONSEQUENCE of a genuine internal contradiction in the frozen v1
        text: the original curve_construction rule (as literally written and
        as executed) names no ordinary-vs-supersingular rejection at all,
        while implementation.md/execution_report.yaml both disclose that a
        rejection WAS tried and removed because it eliminated "~half" of the
        j0 slots -- an estimate this review now confirms and sharpens to an
        exact 29/50 (58%). H-MONO-663fb4's own scope and this contract's own
        `random_ordinary_curves` family definition are about GENERIC ORDINARY
        curves; comparing a curve family that is 58% supersingular against
        one that is 98% ordinary is not the "j=0 vs random-ordinary"
        comparison either P5 or any future Stage-3 correction claims to be
        making, INDEPENDENT of and IN ADDITION TO Defect 2's prime-collision
        problem. This further compounds why P5's enrichment comparison
        (and, were the floor defect ever fixed, any future j0-family
        escalation) cannot be read as being about j=0 curves specifically
        without first separating the supersingular and ordinary j0 sub-arms.
    - id: OTHER-FINDING-3
      title: Primary-panel per-curve construction transcript (p, A, B, N, symmetry check) is absent from the archived raw-result.json.
      finding: >-
        See the artifact_checks entry above. Fully recoverable by
        deterministic re-execution (performed here), so not by itself
        grounds for `invalid`, but it means a future reader relying only on
        the archived JSON (not re-running the code) cannot verify DEFECT-2's
        prime/B collisions, the supersingular fraction (OTHER-FINDING-2), or
        any other per-curve construction property without re-executing the
        implementation -- unlike the legacy 8-curve panel, whose transcript
        IS fully archived. Recommend any successor contract's
        required_artifacts explicitly include a per-curve primary-panel
        transcript in the JSON itself, not only in the (already declared but
        under-enforced) required_artifacts_if_later_authorized text.
    - id: OTHER-FINDING-4
      title: The currently-committed specification.yaml no longer describes what was executed, and this is only visible via git history.
      finding: >-
        Independently confirmed via `git diff`/`git show` (not merely
        trusting CORR-20260831-d15d36's prose) that commit 837e51ae5
        changed ONLY specification.yaml's text (raising null_draws_per_cell
        200->4000, adding `family`/`master_seed` to the documented seed
        formula, adding a p=1 mod 3 admission rule and an ordinary-curve
        rejection) and touched NO implementation file. The implementation/
        files actually archived and actually executed (panel_primary.py,
        curve.py, seed.py, run_experiment.py) still contain NONE of these
        five "fixes" -- confirmed directly by reading them and by bit-for-bit
        re-execution. So even a reader who takes the tampered v2 text at
        face value and separately reads the implementation would find the
        two do not match; only reading `git log`/`git show` on
        specification.yaml (as this task instructed) reveals which is
        authoritative. This is disclosed in CORR-20260831-d15d36 but not
        remediated (by the Coordinator's own deliberate "never revert,
        always disclose" policy), so it remains a live documentation hazard
        for any future reader of this experiment's directory who does not
        also read the correction record.
    - id: OTHER-FINDING-5
      title: The "two independent replication runs" share an identical curve panel; only the null/null-object/coset draws differ.
      finding: >-
        Independently confirmed: RUN-1 and RUN-2's primary_panel_construction
        and legacy_panel_construction blocks are byte-identical (both keyed
        to the fixed domain `EXP-MONO-670aa6/v1`, with `master_seed` entering
        only as a domain suffix for null-subset/null-object-pick/coset-pick
        draws, per implementation.md note 4). This is a genuine internal
        inconsistency already present in the FROZEN v1 text (it declares
        `master_seed` as a top-level input associated with two different
        replication runs -- `replication.seeds: [20260901, 20260902]` -- yet
        its own `seed_derivation_rule` formula never includes master_seed as
        a preimage component at all), which the Executor resolved via a
        disclosed, reasonable-but-unilateral interpretive choice. The
        practical consequence: "two independent runs" here means two
        independent draws of the null/null-object populations on the SAME
        100+8 curves, not two independently-constructed panels -- a weaker
        replication than the contract's own `replication.interpretation`
        text ("Two runs at different master seeds") appears to promise a
        naive reader. This does not itself invalidate either run (each is
        internally sound given the interpretation used, and is disclosed),
        but is a second latent defect in the frozen v1 text's own internal
        consistency, distinct from the two named ones, and should be fixed
        explicitly (not left to Executor interpretation) in any successor
        contract.

  assessment_of_review_questions:
    a_is_the_coordinators_disposition_right_too_harsh_or_not_harsh_enough: >-
      NOT TOO HARSH -- if anything it is very slightly conservative relative
      to what this review independently found. "Stage 0 and dual-path valid;
      Stage 2/3 primary result and P5 enrichment uninterpretable/compromised;
      K3/K4 remains open" is the correct disposition and is fully
      independently reconfirmed. This review adds: (i) Defect 2 is exact and
      total (50/50 pairs, not "much of the same stream" -- prime AND B are
      identical in every pair), (ii) a third, independent reason P5/Stage-3's
      "j0" label is compromised (58% supersingular contamination,
      OTHER-FINDING-2, previously only vaguely disclosed as "some"), (iii) a
      process finding that this contract's own approval_requirements were
      unsatisfiable by construction and were apparently not checked before
      approval (OTHER-FINDING-1), and (iv) a documentation-currency hazard in
      the archive (OTHER-FINDING-4). None of these soften the disposition;
      all either confirm it exactly or make the case for "uninterpretable /
      compromised" stronger. K3/K4 remaining OPEN after two consecutive
      failed-for-distinct-reasons experiments (uncontrolled false-positive
      rate at EXP-MONO-c819ba; zero statistical power by design here) is the
      honest characterization.
    b_is_uninterpretable_too_strong_a_verdict_would_a_coarser_or_pooled_test_have_had_power: >-
      "Uninterpretable" is EXACTLY RIGHT for this contract's own pre-registered
      primary metrics (P1-P4: per-curve, per-statistic, Holm/Bonferroni-
      corrected over ~98-100 tests) -- DEFECT-1 is an unconditional
      mathematical fact about this design (floor > alpha/m for every
      declared family), not a data-dependent judgment call, so no
      re-analysis of THOSE specific corrected numbers can recover power. It
      is NOT quite as strong a verdict for the underlying ARCHIVED per-curve
      p-values themselves: a coarser, single-test-per-family aggregation
      (m=1, no multiplicity correction needed) is immune to the floor
      problem by construction, and this review computed two such
      aggregations directly from the SAME archived numbers (Fisher's
      combined-p omnibus test and a sign test on var_real_over_median_null,
      RECOMP-6) -- both retain genuine power in principle and, when applied,
      show a clean, consistent NULL result in both families and both runs
      (omnibus p in [0.36, 0.99]; sign-test p in [0.57, 1.00]). Two important
      caveats on that reading: (1) this reanalysis is exploratory and was
      NOT pre-registered, so per this contract's own invalidation_rules it
      cannot be substituted for P1-P4 as this experiment's official result
      without a versioned amendment; (2) P5 itself is ALREADY exactly this
      kind of coarser, m=1, uncorrected family-level test, and it too shows
      no signal (Fisher p=0.62, 1.0) -- but P5's cross-family comparison
      specifically is undermined by DEFECT-2 and OTHER-FINDING-2's shared-
      prime/supersingular-contamination problems, which a within-family
      omnibus test (comparing each family only to its OWN matched null, never
      cross-family) sidesteps entirely. Net: a within-family omnibus test
      WOULD have had genuine power and, on the archived data, supports (but
      does not itself establish, being post-hoc) the "controlled null"
      reading -- this is worth relaying to the Coordinator as informative
      context for the next-action design, not as new evidence.
      One-sidedness does NOT fix the floor problem (a one-sided permutation
      p-value has the identical floor 1/(n+1)); pooling the two runs' null
      draws (200+200=400) also does not fix it (floor 1/401=0.0025 is still
      ~5x above the m=98 Holm threshold) -- both were checked and rejected as
      remedies.
    c_any_other_implementation_or_manifest_correctness_issue: >-
      See OTHER-FINDING-1 through -5 above. Summarized: (1) the contract's
      own approval gate for "the null-object test can genuinely trigger" was
      unsatisfiable and apparently unchecked pre-approval; (2) 58% of the
      j0 arm is supersingular, an independent and previously-unquantified
      threat to the family comparison; (3) the primary panel's per-curve
      construction transcript is missing from the archived JSON (recoverable
      by re-execution, but a real completeness gap against this contract's
      own required_artifacts text); (4) the currently-committed
      specification.yaml (post out-of-band edit) no longer describes the
      executed run, and only git history resolves which text is
      authoritative; (5) the two "independent replication runs" in fact
      share one identical curve panel, a latent internal contradiction in
      the frozen v1 seed_derivation_rule (declares master_seed as an input,
      never uses it in the formula) that the Executor was forced to resolve
      unilaterally, disclosed but not contract-specified.

