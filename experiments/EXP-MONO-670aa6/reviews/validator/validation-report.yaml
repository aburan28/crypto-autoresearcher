  metric_recomputations:
    - id: RECOMP-1-stage0-fixture
      description: Independently recomputed Stage-0's m=1/m=2 exact identities on the frozen fixture (p=101,A=1,B=1) by re-executing the archived `stage0_fixture_gate()` and cross-checked the formula by hand.
      result: "gate_pass=true both runs; m1 exact match; m2 additive-quadruple and variance-identity relative residuals ~0 / ~3.75e-15. Matches execution_report.yaml exactly. PASS."
    - id: RECOMP-2-holm-bonferroni-independent-implementation
      description: >-
        Wrote a fresh, independent implementation of the standard Holm
        step-down procedure (not copied from stats.py) and applied it to the
        archived per-curve p_var_uncorrected/p_cf_uncorrected values in
        stage3_per_curve for both families, both runs.
      result: >-
        n_significant_tests and min_adjusted_p match the archived
        stage3_real_arm_holm_families_iii_iv and execution_report.yaml
        exactly in all 4 (family x run) cells, including the one nontrivial
        case (RUN-2 random-ordinary: my min_adjusted_p=0.49751243...,
        archived min_adjusted_p=0.4975 -- exact match to reported precision).
        Also reproduced stage2_null_object_gate's min_adjusted_p values
        (1.0, 1.0, 1.0, 0.2488) exactly. PASS -- the Holm-Bonferroni
        implementation is correct.
    - id: RECOMP-3-fisher-exact-p5
      description: Wrote a fresh, independent hypergeometric Fisher-exact implementation and recomputed P5's 2x2 test from the archived per-curve exceedance counts (p_var_uncorrected < 0.05).
      result: >-
        Exceedance counts (j0: 2/49 and 1/49; random-ordinary: 1/50 and
        1/50, run1/run2) and both Fisher p-values (0.6173070915339169 and
        1.0) reproduce exactly. PASS.
    - id: RECOMP-4-DEFECT-1-p-value-floor-vs-holm-threshold
      description: >-
        BLIND RE-DERIVATION of the first claimed defect, computed only from
        n_null_draws in raw-result.json and the permutation-pvalue formula
        in stats.py (p=(1+count)/(n+1)), i.e. floor=1/(n+1); and from the
        actual per-family test counts in stage3_per_curve (curves x 2
        statistics). Script: defect1_pvalue_floor.py (see receipt).
      result: >-
        CONFIRMED, independently, exactly. n_null_draws=200 in BOTH archived
        runs (confirmed directly, not assumed) => floor = 1/201 =
        0.004975124378109453. n_tests per family = 98 (j0, 49 curves x 2
        statistics) and 100 (random-ordinary, 50 x 2) in BOTH runs =>
        Holm's most-lenient (smallest-p-value) rejection threshold =
        alpha/m = 0.05/98 = 5.102e-4 and 0.05/100 = 5.0e-4. floor/threshold
        ratio = 9.75x and 9.95x -- matching the Coordinator's "~10x" exactly.
        The ACTUAL minimum p-value achieved across all curves/statistics in
        BOTH runs is exactly 0.004975124378109453 = 1/201 (hit exactly in
        RUN-2; RUN-1's minimum, 0.0199=4/201, is still ~39x above the m=98
        Holm threshold). Because floor > alpha/m unconditionally (this
        inequality does not depend on any observed data -- it follows
        purely from n=200 and the declared family sizes), NO cell in this
        design could EVER reach Holm-corrected significance at ANY true
        effect size. CONFIRMS the claim without qualification. Same
        argument applies, with a smaller (~5x) but still fully sufficient
        margin, to Stage 2's Var-only null-object families (m=49/50,
        alpha/m=1.02e-3/1.0e-3): the gate is likewise incapable of ever
        firing. This directly falsifies this contract's own
        `approval_requirements` bullet 2 ("the null-object gate... genuinely
        can trigger, i.e. is not tautologically satisfied") -- that
        requirement was not, in fact, satisfiable by this design, and (so
        far as this review's artifact trail shows) was not checked before
        approval. See OTHER-FINDING-1 for the process implication.
    - id: RECOMP-5-DEFECT-2-family-colliding-prime-streams
      description: >-
        BLIND RE-DERIVATION of the second claimed defect. Read
        implementation/curve.py's actual `construct_prime(domain, b, k)` and
        `curve_stream(domain, p, k, ...)` signatures (confirmed: neither
        accepts nor uses a `family` parameter anywhere in the seed
        preimage -- `seed.py`'s `seed_digest` string is
        `domain|label|field_bits_or_p|curve_ordinal|m|draw_index|counter`,
        with no family component for ANY of the six declared labels). Then
        re-executed the archived, unmodified `panel_primary.build_primary_panel()`
        directly (not read from raw-result.json, which does not retain
        per-curve p/A/B -- see the artifact-completeness finding above) and
        compared j0 vs random-ordinary at every matching curve_ordinal.
        Script: defect2_family_colliding_primes.py (see receipt).
      result: >-
        CONFIRMED, and MORE SEVERE than the claim as stated. Because `b =
        FIELD_BITS[k % 5]` and `construct_prime(domain, b, k)` depend only on
        (domain, b, k) -- never on family -- EVERY ONE of the 50 matched
        curve_ordinal pairs (50/50, not "most" or "many") shares the
        IDENTICAL prime p. Going further than the claim: because
        `curve_stream(domain, p, k, ...)` also ignores family, and because
        every single one of the 100 curves (j0 and random-ordinary alike)
        happened to accept its family's very first stream candidate
        (t_used=0 in 100/100 cases), the two curves at each matched ordinal
        ALSO share the identical B value (50/50 pairs), differing only in A
        (forced 0 for j0 vs. the stream's a_0 for random-ordinary, since
        random-ordinary additionally requires a_0 != 0). So the contract's
        own claim that "no two panel curves share a construction stream" is
        not merely imprecise -- for every j0/random-ordinary pair at a given
        ordinal, the entire stream up to and including B is IDENTICAL. This
        fully confirms the claim and shows it understates the defect.
    - id: RECOMP-6-supplementary-omnibus-power-check-EXPLORATORY
      description: >-
        NOT a pre-registered EXP-MONO-670aa6 metric; performed only to
        answer this task's review question (b) ("is there a subset of the
        analysis that would have had genuine power"). Combined the SAME
        archived per-curve p_var_uncorrected values within each family via
        Fisher's method (a single, m=1, uncorrected omnibus test per
        family -- floor-immune because it performs no per-curve multiplicity
        correction) and via a sign test on var_real_over_median_null > 1.
        Script: supplementary_omnibus_power_check.py (see receipt).
      result: >-
        Both omnibus statistics avoid the floor-vs-threshold problem (m=1,
        no correction) and are therefore capable in principle of detecting a
        family-wide signal that the per-curve Holm tests structurally
        cannot. Applied to the actual archived data: Fisher-combined
        omnibus p in {0.99, 0.49, 0.98, 0.36} and sign-test p in {0.78,
        1.00, 0.57, 0.67} across the 4 (family x run) cells -- no signal
        whatsoever, consistently null. This is exploratory/non-primary
        analysis (flagged as such per this contract's own invalidation_rules
        on post-hoc reanalysis) and creates NO new evidence for or against
        H-MONO-663fb4; it is reported to inform the Coordinator's answer to
        review question (b), not as a finding about the hypothesis.

