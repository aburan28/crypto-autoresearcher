    own "100 independently-constructed curves" claim and compromising P5's
    enrichment comparison. Stage 0 and the dual-path convolution-engine
    agreement are believed to remain valid. Task: verify execution fidelity
    to the frozen v1 text, independently RE-DERIVE both claimed defects from
    raw-result.json and the archived source (not from the Coordinator's own
    prose), and surface any other correctness issue missed. Blind
    re-derivation requirement observed: computed both defects directly from
    runs/RUN-MONO-670aa6-{1,2}/raw-result.json and
    implementation/panel_primary.py/curve.py/seed.py/stats.py/run_experiment.py,
    then cross-checked (not substituted for) against
    ledger/corrections/CORR-20260831-d15d36.yaml only after independent
