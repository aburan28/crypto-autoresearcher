  counterexample_or_mutation: >-
    The cheapest discriminating action available today, requiring zero new compute: apply
    Fisher's combined-probability test to the ALREADY-ARCHIVED per-curve raw_p values in
    both runs' stage3_real_arm_holm_families_iii_iv blocks (OBJ-4). I did this; it shows no
    signal. A slightly more expensive mutation for a successor contract: rebuild the
    primary panel with `family` in every seed preimage (the out-of-band patch's own fix,
    independently re-verifiable rather than trusted) and re-run the identical Fisher-exact
    P5 enrichment comparison to see whether removing the ~50-pair correlation changes its
    conclusion (I predict it will not, per OBJ-2's practical-damage assessment, but this is
    a prediction, not a finding).

  baseline_comparison: >-
    NOT APPLICABLE IN THE ASYMPTOTIC SENSE, and this is unchanged from every prior record
    in this lane: H-MONO-663fb4's asymptotic_claim is null throughout, and this experiment
    makes no cost, exponent, or attack claim. Pollard rho at O(sqrt(N)) time / O(1) memory
    remains the unchallenged prime-field ECDLP baseline; nothing in this run's toy-scale
    character-bias measurement (p in [127, ~2050], F=N/4, m=4) could move that baseline in
    either direction even under the most favorable possible outcome, because the
    linear-algebra/relation-collection stage this hypothesis would need to charge is
    uncharged here and everywhere in this corpus's relation-rate findings
    (asymptotic_claim_note, unchanged). sota_delta = 0; dominated_by = not_applicable, for
    the same reason the Coordinator's own record gives.

  heuristic_challenges:
    - >-
      HEUR-CHR-2 (the load-bearing conditional that C = O(sqrt(N) log N) for the real
      x-coordinate factor base) is EXACTLY as untested after this run as it was before it:
      neither defect #1 (design has zero power) nor my own exploratory Fisher-combined
      reanalysis (post-hoc, unpowered by KN-TECH-7745e6's own calibration standard)
      discharges or falsifies it. Its `falsification_condition` (measured C/sqrt(F) growing
      with p across the pinned prime ladder) is reported in stage4_legacy_controls'
      prime_ladder block on the 4-curve RO1-4 sub-panel only (fitted exponent -0.197 in
      run1), which is far too small a ladder (<=4 primes) to say anything about growth and
      is explicitly labelled as such in the run's own artifacts ("toy-scale trend over <=4
      primes; never extrapolated"). No new heuristic evidence either way.

  cost_model_challenges:
    - >-
      No cost model is asserted or implied anywhere in this record, and none should be
      inferred from either direction of a hypothetical K3/K4 resolution: a measured
      character-bias deviation, even if eventually confirmed at proper statistical power,
      is one term of a relation-rate model whose linear-algebra stage remains completely
      uncharged in this hypothesis's entire evidence chain. This challenge is unchanged
      from every prior record in this lane and is restated here only to confirm it was
      checked, not assumed.

  reduction_and_scope_challenges:
    - >-
      H-MONO-663fb4's own `proof_search_map.method_ceiling.nearby_object_control` requires
      the subgroup-extreme positive control (exact N/h-1) to be re-verified before any
      arm's negative reading is trusted ("NO NEGATIVE MAY BE REPORTED FROM ANY ARM" if this
      fails). EXP-MONO-670aa6's legacy 8-curve sub-panel's subgroup-availability
      precondition was UNMET in both runs (only RO3 has 4|n2, vs the required >=2), so
      positive_control_1/2 were correctly SKIPPED per the frozen contract's own explicit
      fallback (confirmed directly in implementation/run_experiment.py's
      `run_legacy_stage4`: `if len(subgroup_capable) < 2: ... "SKIPPED"`) -- NOT silently
      patched, NOT silently backfilled. This is disclosed correctly by the Executor. But
      it means THIS CYCLE never re-exercised the hypothesis's own mandatory positive
      control at all; the mandatory-control confirmation this record implicitly leans on
      is entirely EXP-MONO-c819ba's, from a different (smaller, n=30) panel. Any successor
      contract should either construct a legacy panel guaranteed to have >=2 subgroup-
      capable curves, or explicitly state (as this one does) that it is relying on a prior
      experiment's positive control rather than its own.
    - >-
      The F=N/4 exact-symmetric-prefix claim was audited and found SOUND, not a defect:
      `factor_base_x_coords` only ever appends points in (x,y)/(x,-y) PAIRS (points with
      f(x)=0 are excluded from the factor base entirely, so every accepted x contributes
      exactly two points), so any EVEN-length prefix of `fb_full` is symmetric by
      construction; `primary_F_of` forces F even; and the run additionally performs an
      explicit symmetry check per curve and excludes (never patches) any failure. No
      instance of asymmetry was found or reported in either run.

  proof_architecture_challenges: []
  proof_architecture_not_applicable_reason: >-
    This is a toy-scale empirical calibration test of an already-derived, unconditional
    identity (I1)-(I3) plus one conditional heuristic (HEUR-CHR-2), not a new
    proof-oriented theorem, asymptotic bound, or reduction. Section 8's proof-architecture
    portfolio does not apply beyond what H-MONO-663fb4's own frozen `proof_search_map`
    already discharged; this run does not reopen or extend that map.

  narrowest_supported_statement: >-
    EXP-MONO-670aa6's DECLARED Stage-2/Stage-3 permutation-p-value + Holm/Bonferroni
    procedure could not have detected any true effect at any size, confirmed by
    independent re-derivation against the archived raw data (OBJ-1), and its P5 enrichment
    comparison drew its 50-50 panel from two families that share, in every realized case,
    the same prime AND the same B coefficient (a stronger and more thoroughly propagated
    collision than described, OBJ-2), so neither is admissible as a resolution of K3/K4 in
    either direction, exactly as CORR-20260831-d15d36 concludes. Stage 0's exact identities
    and the dual-path check ON THE 100 REAL-ARM CELLS SPECIFICALLY remain valid; the
    broader claim that "the dual-path convolution-engine agreement" validates the run's
    core computation should be understood as covering only those 100 cells, not the
    >20,000 null/null-object/legacy draws the p-values actually depend on (OBJ-3, a
    coverage gap I found no evidence of an actual failure in). A cheap, already-computable,
    non-floor-limited panel-level statistic (Fisher's combined-probability test, applied
    post-hoc/exploratory to already-archived and freshly-reproduced raw p-values) shows no
    signal in either family, either seed, and is offered as a candidate resource for a
    properly pre-registered successor, not as evidence (OBJ-4). The identical
    floor-vs-correction defect that invalidates this run's declared test is also present,
    unremarked, in one redundant sentence of EXP-MONO-c819ba's own already-closed Red Team
    review, but does not undermine that review's overall conclusion, which rests on four
    other, non-floor-limited, independent lines of evidence. K3/K4 remains open in the
    sense that no properly powered, pre-registered test of it has yet run across two
    consecutive experiments -- not in the sense that the accumulated evidence is silent;
    it leans mildly, non-conclusively, toward no exceptional locus at the tested scale.

