# EXP-SEMBIN-0ce931
# Finite-k cap identity and regime bits. No solver.
# Approved by DEC-20261002-f62341.
experiment:
  id: EXP-SEMBIN-0ce931
  hypothesis_id: H-SEMBIN-d80aa9
  source_idea: IDEA-20260918-c05e71
  question_id: RQ-SEMBIN-9fa4ba
  version: 1
  title: Finite-k cap identity on four cells
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-f62341
  objective: >-
    Check the cleared cap identity on four cells. Record the three
    reduced cap-over-factorial ratios. Accept the regime inequality on
    the three candidate cells and reject it on (24, 8, 3).
  inputs:
    cells:
      - {n: 24, k: 6, m: 3, in_regime: true, two_k_above_m_squared: true, cap_over_factorial: "2048/2145"}
      - {n: 30, k: 7, m: 3, in_regime: true, two_k_above_m_squared: true, cap_over_factorial: "8192/8385"}
      - {n: 36, k: 8, m: 4, in_regime: true, two_k_above_m_squared: true, cap_over_factorial: "8388608/8586627"}
      - {n: 24, k: 8, m: 3, in_regime: false, two_k_above_m_squared: true, role: control}
    regime_rule: m*k <= n-3
    size_rule: 2^k > m^2
  controls:
    - >-
      The cell (24, 8, 3) fails m*k <= n-3. Reporting it in regime
      invalidates the run.
    - >-
      The identity is required on the control cell as well as on the
      three candidates. Skipping the control invalidates the run.
    - Two integer routes. They must not import each other.
  independent_variables:
    - cell
    - route in {successive_binomial, product_binomial}
  metrics:
    primary:
      - identity_holds_by_cell
      - in_regime_by_cell
      - cap_over_factorial_by_candidate
      - control_out_of_regime
      - implementations_agree
    secondary:
      - two_k_above_m_squared_by_cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Four identity bits, four regime bits, and three reduced ratios.
    formula: >-
      2^{m k} * prod_{j=1}^{m-1}(2^k+j) = C(2^k+m-1, m) * m! * 2^{k(m-1)}.
      The cap over m! is 2^{k(m-1)} / that product, reduced by their gcd.
      In regime means m*k <= n-3.
    source: >-
      IDEA-20260918-c05e71 candidate cells and EV-SEMBIN-4614e7
      observation O-3, read 2026-10-02. The ratios were reduced in this
      design session. That reduction is not a run. No solver was launched.
  scale_relevance:
    tier: toy
    justification: Four integer triples. No transfer to a measured solver cost.
    correspondence: null
  tail_checks:
    - The cell (36, 8, 4) is required. Stopping after two candidates and still reporting its ratio is invalid.
  replication:
    seeds: []
    independent_instances: 4
    replication_note: Deterministic. The second run is the other integer route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If (24, 8, 3) is reported in regime, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The control cell is reported in regime.
    - The control cell is omitted.
    - A Groebner basis, a SAT solve, or a relation image is reported.
  success_criterion: >-
    Both runs agree. The identity holds on all four cells. The regime
    bits are true, true, true, and false. The reduced ratios are
    2048/2145, 8192/8385 and 8388608/8586627. Each candidate has
    2^k > m^2.
  falsification_criterion: >-
    The runs agree, the control stays out of regime, and any identity
    bit, regime bit, size bit, or reduced ratio differs from the
    preregistered table.
  required_artifacts:
    - experiments/EXP-SEMBIN-0ce931/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SEMBIN-0ce931/runs/<RUN-ID>/command.txt
    - experiments/EXP-SEMBIN-0ce931/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SEMBIN-0ce931/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SEMBIN-0ce931/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-SEMBIN-0ce931/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Solver degree, Macaulay dimension, and relation rank.
    - Any image-size measurement.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
