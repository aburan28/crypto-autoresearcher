# EXP-ECDLP-245636
# Bit-size arithmetic. No polynomial is built.
# Approved by DEC-20261003-e69d56.
experiment:
  id: EXP-ECDLP-245636
  hypothesis_id: H-ECDLP-f30431
  source_idea: IDEA-20261003-5ad26b
  question_id: RQ-ECDLP-001
  version: 1
  title: Toy bit sizes 8, 10, and 12
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-e69d56
  objective: >-
    Check the sum 30, the product 960, and the nearby gap 0.
  inputs:
    lo: 8
    mid: 10
    hi: 12
    size_sum: 30
    size_product: 960
    excess: 4
    mid_excess: 2
    step: 2
    step_product: 4
    nearby: 8
    nearby_sum: 24
    nearby_product: 512
    nearby_gap: 0
  controls:
    - >-
      The sizes 8, 10, and 12 sum to 30. Replacing 12 by 8 drops
      the excess 4 and invalidates the run.
    - >-
      The product is 960. Twelve exceeds eight by 4. Ten exceeds
      eight by 2. Twelve exceeds ten by 2. The product of those
      two gaps is 4.
    - >-
      Three copies of 8 sum to 24 and multiply to 512. Their
      pairwise gap is 0.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {sum, product, nearby}
    - route in {add, multiply}
  metrics:
    primary:
      - size_sum
      - size_product
      - nearby_gap
      - implementations_agree
    secondary:
      - excess
      - nearby_sum
      - nearby_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The sum is 30. The product is 960. The pairwise gap of
      three copies of 8 is 0.
    formula: >-
      Add 8, 10, and 12. Multiply 8 by 10 by 12. Subtract 8 from
      12. Add 8 three times. Subtract 8 from 8.
    source: >-
      IDEA-20261003-5ad26b states the sizes 8, 10, and 12, read
      2026-10-03. The sum, the product, and the gaps were
      recomputed in this design session. That computation is not
      a run. No polynomial was built.
  scale_relevance:
    tier: toy
    justification: Three written bit sizes. No transfer to a solver.
    correspondence: null
  tail_checks:
    - The product 960 and the nearby gap 0 are required. A check that stops at the sum 30 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the sum 30 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The sum is not 30.
    - The product is not 960.
    - The excess of 12 over 8 is not 4.
    - Twelve is reported as 8, or a summation polynomial is built.
  success_criterion: >-
    Both runs agree that the sum is 30, that the product is 960,
    and that 12 exceeds 8 by 4.
  falsification_criterion: >-
    The runs agree that the sum is computed, and that sum is not 30.
  required_artifacts:
    - experiments/EXP-ECDLP-245636/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-245636/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-245636/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-245636/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-245636/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-245636/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any summation polynomial or solver.
    - Any claim that a sum of bit sizes moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
