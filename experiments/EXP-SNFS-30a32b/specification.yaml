experiment:
  id: EXP-SNFS-30a32b
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-a451fe; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-a451fe
  question_id: RQ-SNFS-005666
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Forced algebraic factors in p minus one for special-form primes: exact reducibility ceiling
    by enumeration, factor-size profile separation against a random-prime null, and a joint-yield
    measurement of the cost of hiding'
  objective: 'The one uncertainty a run reduces is whether the composition of the special form with
    an arithmetic neighbour of p leaves a visible trace, and what it costs a constructor to avoid
    one. (i) What is the ceiling: over an exact enumeration of degree-d polynomials with coefficients
    bounded by H, what fraction have f - 1 reducible over the rationals, since that fraction bounds
    the true-positive rate of the whole mechanism and knowing it before the measurement is what prevents
    a post-hoc story being fitted to whatever separation appears. (ii) Does the trace show up in the
    statistic: with p - 1 factored completely under an identical budget on both arms, does the normalised
    factor-size profile separate planted from honest primes, and crucially is the separation confined
    to the stratum where f - 1 is actually reducible, which is the only pattern consistent with the
    claimed mechanism. (iii) What does hiding cost: when the special-form generator is additionally
    required to produce a prime factor of p - 1 above a declared size, how many more candidates does
    it try per acceptance than an honest generator meeting the same criterion, since a constructor
    forced into a narrower subclass has been made more detectable by the composition even if this
    particular statistic sees nothing.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal claim a run could support is: for the tested degrees,
      coefficient bounds and sizes, the exact reducibility fraction is as enumerated, the factor-size
      profile separates or fails to separate the arms by the measured amount, the separation is or
      is not confined to the reducible stratum, and the special-form generator pays the measured joint-yield
      penalty under the added criterion. What does NOT follow: no claim that special-form primes are
      detectable in general, no claim at any size where p - 1 cannot be factored, nothing about any
      real, published or deployed prime, and no attribution of intent to any party.'
  inputs:
    procedure: 'STAGE 0, seconds of compute: enumerate polynomials and compute R(d,H) exactly for
      the small cells, and freeze the profile statistic and its scoring path before generating primes.
      STAGE 1, minutes: implement complete factorization by trial division to 10^6 plus Pollard rho
      with a fixed iteration cap, validated against known factorizations. STAGE 2, minutes: generate
      planted and honest arms with recorded seeds and witnesses. STAGE 3, tens of minutes: factor
      p - 1 and p + 1 for every prime in both arms under the identical budget. STAGE 4, minutes: compute
      the profile statistic, the separations and the witness-stratified split. STAGE 5, minutes: run
      the along-the-base-line persistence control on both arms. STAGE 6, tens of minutes: run the
      cost-of-hiding arm, counting candidates per acceptance for both generators under the added factor-size
      criterion. STAGE 7, minutes: run the budget-halving and budget-doubling controls. STAGE 8: emit
      the run manifest and the immutable record.'
    instrument: Pure Python 3.11 standard library only, since numpy, sympy, gmpy2 and fpylll are absent
      here and Sage is excluded by contract; rational factorization of small-degree polynomials is
      done by a hand-written rational-root and quadratic-factor search rather than by a computer algebra
      system, and that limitation caps the degrees in scope. A sieve of Eratosthenes prime table,
      Pollard rho with Brent cycle detection, and a shared Miller-Rabin. New module harness/snfs_pminus1.py
      holds the enumerator, the factorer, the samplers and the controls; harness/runner.py records
      the manifest.
    parameters: 'Prime bit sizes n in {40, 48, 56}. Degrees d in {2, 3}. Coefficient bounds H in {4,
      8, 16}. Enumeration cells for R: all polynomials with coefficients in [-H,H] at each (d,H),
      up to about 33^4 at the largest cell. Sample sizes 500 planted and 500 honest primes per (n,d,H)
      cell. Factoring budget: trial division to 10^6, then Pollard rho with 10^7 iterations per composite
      cofactor. Cost-of-hiding criterion: a prime factor of p - 1 of at least n/3 bits. Per-cell wall-clock
      cap 900 seconds.'
  controls:
  - The uniform-prime honest arm factored under the identical budget in the same invocation.
  - The along-the-base-line persistence control run on the honest arm, testing the section 3 structural
    tell.
  - A witness-stratified control on the planted arm, splitting it by whether f - 1 is actually reducible,
    which must show the separation concentrated entirely in the reducible stratum.
  - A p + 1 control using f + 1, which should behave identically under the same algebra and provides
    an independent replicate of the mechanism.
  - A factoring-budget control at half and double the budget, confirming that neither arm's profile
    is budget-truncated.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Uniform random primes of identical bit length, with p - 1 factored
    by the identical routine under the identical budget in the same invocation. The null must reproduce
    the known shape of the largest-prime-factor distribution for random integers, in particular the
    characteristic mass near the top of the range, and it must do so with the same factoring budget
    as the planted arm so that budget truncation cannot masquerade as a class difference. A second
    null is required because of the section 3 tell: the planted arm''s structure does not decay along
    the base line, so the identical along-the-line measurement must be run on the honest arm, where
    any apparent persistence would prove the measurement is picking up the base grid rather than the
    algebra.'
  independent_variables:
  - degree d
  - coefficient bound H
  - prime bit size n
  - 'arm: planted or honest'
  - reducible versus irreducible witness stratum
  metrics:
    primary:
    - exact reducibility fraction R(d,H)
    - normalised largest-prime-factor statistic per prime
    - separation between arms with bootstrap intervals
    - separation within reducible and irreducible strata
    - joint yield candidates per acceptance for both generators
    secondary:
    - full factor-size profile per prime
    - fraction of p - 1 values fully factored within budget
    - p + 1 replicate separation
    - along-the-line persistence on both arms
    - wall-clock seconds per prime
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The upper bound on the achievable true-positive rate of the mechanism, namely R(d,H),
      and the measured separation which must not exceed it.
    formula: R(d,H) = (number of f with coefficients in [-H,H] and deg f = d such that f(x) - 1 factors
      nontrivially over Q) divided by (number of such f), computed by exact enumeration. The prereg
      statement is the inequality TPR_mechanism <= R(d,H) plus the accidental base rate, so any measured
      separation implying a true-positive rate above R(d,H) falsifies the mechanistic attribution
      regardless of how significant the separation is.
    source: Pre-registered in the parent proposal IDEA-20260816-a451fe before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Sizes 40 to 56 bits are chosen because p - 1 factors completely within the stated
      budget there, which makes the factor-size profile ground truth rather than a budget-truncated
      estimate. No transfer is claimed: the instrument requires complete factorization, which is unavailable
      at cryptographic sizes, and the contract explicitly forbids reporting an extrapolated detection
      rate. The only quantity claimed to be size-independent is R(d,H), which is a property of polynomials
      and not of primes, and that independence is stated as an assumption open to challenge.'
    correspondence: null
  tail_checks:
  - Inspect planted primes with anomalously smooth p - 1 and check whether the smoothness comes from
    reducibility of f - 1 or from smoothness of m.
  - Inspect honest primes in the extreme tail of the profile statistic, which set the false-positive
    floor.
  - Check cells where the fully-factored fraction is below one, since those profiles are truncated
    and not comparable.
  - Inspect the cost-of-hiding arm for acceptances that satisfy the criterion through an algebraic
    factor rather than an accidental one.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop a cell at its 900-second cap and record it as budget-truncated, never as a negative result.
  - Stop if the fully-factored fraction falls below 0.95 in any cell, since the profile statistic
    is then not comparable across arms.
  - Stop if R(d,H) is zero at every tested cell, since the mechanism has no instances and the measurement
    arm is pointless; report R as the obstruction.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: R(d,H) is enumerated exactly for every cell, both arms are fully factored within
    budget, the separation is reported with its stratified breakdown, and the joint-yield ratio is
    measured, whether or not any separation is found.
  falsification_criterion:
  - Measured separation implies a true-positive rate above R(d,H) plus the accidental base rate, refuting
    the mechanistic attribution.
  - The separation appears in the irreducible stratum, directly refuting the mechanism.
  - The honest arm shows persistence along the base line, indicating a measurement artifact.
  - Joint yields are indistinguishable between generators, refuting the cost-of-hiding claim.
  - R(d,H) is zero throughout, leaving the mechanism with no instances at the tested parameters.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-a451fe
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The rational-factorization test is limited to small degrees by the hand-written search, and a
    Coordinator must either accept that ceiling on d or require a different instrument.
  - The separation between reducibility of f - 1 and smoothness of m as two distinct sources of structure
    in p - 1 is described but not formally separated in the analysis plan; it needs a stated decomposition
    before approval.
  - The selection effect introduced by the added factor-size criterion in the cost-of-hiding arm is
    acknowledged but not corrected, and the correction must be specified before those numbers are
    comparable to the base arms.
