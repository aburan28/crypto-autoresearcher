experiment:
  id: EXP-MODEL-4159eb
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-8027a2
  question_id: RQ-MODEL-e61cb2
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: THE KUMMER LINE IS NOT A NEW MODEL, IT IS THE TERMINAL ONE - Semaev's S_3 IS the differential-addition
    quadratic whose two roots are x(P+Q) and x(P-Q), with the exactly verifiable identity disc_T S_3(x1,x2,T)
    = 16 f(x1) f(x2); the "sum defined only up to sign" is therefore the SOURCE of the 2^(m-2) rather
    than a defect, the false-relation rate is predicted to be EXACTLY ZERO, and sign resolution costs
    at most 2^(m-1) group operations - so x-only working neither helps nor hurts asymptotically and
    the corpus should stop treating it as an unexplored model
  status: draft
  objective: "(A) THE IDENTIFICATION. For a generic-j curve, E/{+-1} is the Kummer line P^1, and EVERY\
    \ degree-2 coordinate on E is a Moebius reparametrisation of the quotient map E -> E/{+-1}. Short\
    \ Weierstrass x, Montgomery x, twisted Edwards y, and the Hessian x + y are all such coordinates.\
    \ Therefore SEMAEV'S SUMMATION POLYNOMIAL ALREADY IS THE KUMMER-LINE OBJECT: S_m(x_1,...,x_m)\
    \ = 0 says \"there EXIST signs eps_i with sum eps_i P_i = O\", which is a statement about points\
    \ of the Kummer line and nothing else. Working \"x-only\" is not a change of model; it is a description\
    \ of what the standard method already does. The corpus has treated Kummer/theta as an unexplored\
    \ direction (the inherited PO-004 note in inputs/refs/research/ proofs_Dreg_conservation_weil_invariance.md\
    \ leaves \"the intrinsic (non-x-line) abelian-surface / Kummer / theta / Mumford summation relation\"\
    \ OPEN), and this record's job is to separate the part of that which is genuinely open (GENUS\
    \ 2 Kummer SURFACES) from the part which is already occupied (the genus-1 Kummer LINE).\n(B) S_3\
    \ IS THE DIFFERENTIAL-ADDITION QUADRATIC. Read harness/semaev.py's s3_expr as a polynomial in\
    \ x_3:\n  S_3 = A T^2 + B T + C, A = (x_1 - x_2)^2,\n  B = -2[(x_1 + x_2)(x_1 x_2 + a) + 2b],\n\
    \  C = (x_1 x_2 - a)^2 - 4b(x_1 + x_2).\nIts two roots are exactly x(P_1 + P_2) and x(P_1 - P_2).\
    \ This is the Montgomery differential-addition structure written as a polynomial: on the Kummer\
    \ line the \"sum\" of two points is not a point but the UNORDERED PAIR {x(P+Q), x(P-Q)}, and S_3\
    \ is the quadratic that has that pair as its roots. Nothing about x-only arithmetic is missing\
    \ from Semaev's method - it IS Semaev's method.\n(C) THE EXACT IDENTITY, HAND-DERIVED AND SPOT-CHECKED,\
    \ WHICH IS THE INSTRUMENT DELIVERABLE. From the chord formulas,\n  x(P+Q) - x(P-Q) = -4 y_1 y_2\
    \ / (x_1 - x_2)^2,\nhence disc_T S_3 = A^2 (root difference)^2 = (x_1 - x_2)^4 * 16 y_1^2 y_2^2\
    \ / (x_1 - x_2)^4, i.e.\n  disc_T S_3(x_1, x_2, T)  =  16 f(x_1) f(x_2),   f(x) = x^3 + a x +\
    \ b.\nI verified this at two independent specialisations by hand:\n  x_1 = x_2 = x gives LHS/4\
    \ = [2x(x^2+a)+2b]^2 = 4 f(x)^2 = RHS/4;\n  x_2 = 0 gives LHS/4 = a^2x_1^2 + 4abx_1 + 4b^2 - a^2x_1^2\
    \ + 4b x_1^3\n                      = 4b f(x_1) = RHS/4.\nThis is extremely non-generic: a random\
    \ (2,2,2) form has an irreducible discriminant of degree 4 in x_1, whereas this one has degree\
    \ 3 and FACTORS COMPLETELY into one-variable factors. That total splitting is the algebraic fingerprint\
    \ of the Kummer structure, it is checkable exactly in one line of sympy, and it is a far sharper\
    \ instrument gate than \"the planted root is a root\".\n(D) WHAT THE SIGN AMBIGUITY COSTS AND\
    \ WHAT IT BUYS - THE PART THE BRIEF ASKS TO BE STATED EXACTLY.\n  (D1) WHAT IT BUYS - the entire\
    \ factor 2^(m-2) instead of 2^(m-1). Because x\n  is invariant under negation, the m-1 sign choices\
    \ collapse under the global\n  sign, and the per-variable degree is 2^(m-2), not 2^(m-1). If one\
    \ insisted on\n  tracking signed points, the relation variety would be a 2:1 cover and the\n \
    \ system strictly larger. The ambiguity is a QUOTIENT and quotients are cheap.\n  (D2) WHAT IT\
    \ COSTS - after solving, one holds a coordinate tuple\n  (x_1,...,x_m) and must determine WHICH\
    \ signed lift is the actual relation.\n  Brute force is at most 2^(m-1) group operations per solution\
    \ (fix the first\n  sign, try the rest, and the global sign is free). For m fixed this is O(1);\n\
    \  concretely 4 at m = 3 and 8 at m = 4. harness/semaev.py's _find_decomposition\n  already does\
    \ exactly this, over (A, -A) x (B, -B), which is the m = 2 case.\n  (D3) WHAT IT DOES NOT COST\
    \ - THERE ARE NO FALSE POSITIVES. By the DEFINITION\n  of the summation polynomial, S_m(x_1,...,x_{m-1},\
    \ x_R) = 0 iff there EXIST\n  signs with sum eps_i P_i eps_R R = O. So every solution lifts to\
    \ a genuine\n  signed relation, and since R and -R give the same x, both are usable. The\n  predicted\
    \ false-relation rate is EXACTLY 0. This is a strong, cheap,\n  binary instrument test and any\
    \ nonzero rate means the polynomial or the\n  lifting code is wrong.\n  (D4) WHERE IT COULD HURT\
    \ AND DOES NOT - one might fear the ambiguity\n  propagates into the linear-algebra stage as an\
    \ unknown sign vector,\n  branching 2^m per relation. It does not, because (D2) resolves the sign\n\
    \  BEFORE the relation is written down, at O(1) cost. A design that defers sign\n  resolution\
    \ to the linear algebra would pay 2^m per relation and would be\n  strictly worse; recording that\
    \ as a named anti-pattern is part of the\n  deliverable.\n\n(E) THE ASYMMETRY THAT IS ACTUALLY\
    \ WORTH MEASURING. The identity in (C) says the discriminant of the summation quadratic is a product\
    \ of one-variable factors given by the curve's own defining polynomial in the chosen coordinate.\
    \ So the model choice shows up in the DEGREES OF THOSE FACTORS: on short Weierstrass f is a cubic\
    \ (three affine 2-torsion x-values plus the branch point at infinity); on twisted Edwards the\
    \ branch locus of y is the quartic (1 - y^2)(a - d y^2), with no branch point at infinity; on\
    \ Montgomery it is x(x^2 + Ax + 1) with the fourth branch point at infinity. In every case there\
    \ are exactly 4 branch points (Riemann-Hurwitz for a degree-2 map from a genus-1 curve to P^1),\
    \ and a model is exactly a choice of WHERE THOSE 4 POINTS SIT relative to 0, 1, infinity. That\
    \ is the correct reformulation of \"curve model\" for this lane and it is developed in IDEA-20260807-a575c8;\
    \ this record's part is the discriminant identity that exposes the branch locus directly inside\
    \ the summation polynomial.\n(F) THE TWO OUTCOMES.\n  OUTCOME 1 - the identity holds exactly,\
    \ the false-relation rate is 0, and\n    sign resolution costs at most 2^(m-1). Then the x-only/Kummer\
    \ direction is\n    CLOSED for genus 1 with a named obstruction (the Kummer line is the\n    terminal\
    \ degree-2 quotient and Semaev already computes on it), and the\n    residual open direction is\
    \ precisely and only the genus-2 Kummer surface\n    route that PO-004 flagged - which this record\
    \ does NOT close and explicitly\n    forwards.\n  OUTCOME 2 - the identity fails, or a nonzero\
    \ false-relation rate appears.\n    Then either harness/semaev.py's s3_expr is not the summation\
    \ polynomial it\n    claims to be, or the lifting logic in _find_decomposition is incomplete.\n\
    \    Either is an instrument defect that invalidates every EXP-SEMAEV number in\n    the ledger\
    \ and must be fixed first. That is a high-value negative."
  resource_label: R1 (x-coordinates as field elements), with R2 for the coordinate choice.
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE. R1 is the canonical non-generic resource: the oracle returns
    FIELD data (a coordinate value) rather than a group element, so the generic-group simulator of
    KN-FIND-b7e091 cannot produce it, and Shoup''s bound does not apply to the algebraic step. H-ENDO-001
    is irrelevant - no endomorphism is applied to points of G. The honest qualifier is that this record
    makes no attack and its content is a closure plus an instrument identity, so the admissible resource
    is being spent on precision rather than on speed.'
  reachability_gate: 'TRIVIAL AND STATED EXPLICITLY, AND IN THIS RECORD IT IS TRIVIAL IN THE STRONGEST
    POSSIBLE SENSE: the Kummer line is not reached, it is already where the computation is. T5 gates
    movement between CURVES at cost about p^(1/4); this record moves nowhere at all. The quotient
    map E -> E/{+-1} is the x-coordinate the program has been using since KN-TECH-002, so the "model
    change" costs zero operations and is available on every curve without any existence condition
    - unlike the Edwards and Hessian models, which need rational 4- and 3-torsion respectively. That
    universality is precisely why the Kummer line is the terminal object of the lane and why no reachability
    cost can be charged against it.'
  inputs:
    procedure: 'STAGE 1 (SECONDS, and it is the cheapest decisive test in the whole lane): one call
      to sympy.discriminant on s3_expr with symbolic a, b, compared against 16*f(x1)*f(x2). Pass or
      fail, immediately. STAGE 2 (minutes): the 500-pair root identification against harness/toycurve.py.
      STAGE 3 (an hour): the false-relation-rate measurement at m = 3, 4 with the matched non-solution
      null, over 3 primes and 3 seeds. STAGE 4 (minutes): sign-resolution cost counting and the left-to-right
      pruning variant. STAGE 5 (an hour): the discriminant identity across the Montgomery, Edwards
      and Hessian-s polynomials produced by the sibling records. STAGE 6 (minutes): the random-(2,2,2)-form
      null for gate calibration and the random-Moebius null.'
    mechanism: 'STEP 1 - THE DISCRIMINANT IDENTITY, SYMBOLICALLY, AS A HARD GATE. Compute sympy.discriminant(s3_expr(a,
      b), x3) with a, b symbolic and check it equals 16*(x1^3 + a*x1 + b)*(x2^3 + a*x2 + b) identically
      over Z[a, b, x1, x2]. Not modulo a prime, not on samples - identically. If this fails, s3_expr
      is not the summation polynomial and every EXP-SEMAEV record that used it needs revisiting; that
      is the single highest-value possible outcome of this record and it costs one function call.
      STEP 2 - THE ROOT IDENTIFICATION. For 500 random on-curve pairs (P, Q) over a 16-bit prime,
      check that the two roots of s3_expr(a,b) at (x(P), x(Q), T) are exactly {x(P+Q), x(P-Q)} computed
      independently by harness/toycurve.py''s add. Predicted: exact set equality in 100% of cases
      where x(P) != x(Q). STEP 3 - THE FALSE-RELATION RATE. Generate 5000 coordinate tuples that solve
      S_m over a small factor base at m = 3 and m = 4; for each, search the 2^(m-1) sign patterns
      for a genuine relation sum eps_i P_i = eps_R R using harness/toycurve.py as the independent
      verifier. Predicted rate of tuples with NO valid sign pattern: EXACTLY 0 out of 5000. Also record
      the empirical distribution of how many sign patterns work per tuple (predicted: usually exactly
      1, occasionally 2 when a summand is 2-torsion or coincides). STEP 4 - THE SIGN-RESOLUTION COST.
      Measure the number of group operations actually spent per resolved relation at m = 2, 3, 4,
      5. Predicted at most 2^(m-1) with the naive search, and the record also asks whether an incremental
      strategy (resolve signs left to right, pruning) reduces it to O(m) - that is a small, honest,
      constant-factor engineering question with a definite answer. STEP 5 - THE MODEL SWEEP OF THE
      IDENTITY. Repeat Step 1 for the Montgomery, Edwards and Hessian-s summation polynomials of the
      sibling records. Predicted: the discriminant always factors as a product of two one-variable
      polynomials, each being (up to squares and the clearing factor) the model''s own branch polynomial
      - cubic for Weierstrass and Montgomery, quartic for Edwards. The DEGREES of the factors are
      the model-dependent part; the FACTORISATION TYPE is the model-independent part. That contrast
      is the measurement. STEP 6 - THE NULL. Apply the random-Moebius null of IDEA-20260807-4fc635.
      The discriminant identity must survive as a factorisation statement (it is intrinsic) but the
      factor degrees must move as branch points cross infinity. A null in which the factorisation
      type breaks means the identity is being computed on a non-reduced polynomial.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - non-solution coordinate tuples (must yield no relation)
  - random (2,2,2) forms with matched support (discriminant must not split)
  - random-Moebius null per IDEA-20260807-4fc635
  - the m = 2 baseline already implemented in harness/semaev.py, as the reproduction anchor
  - a deliberately corrupted s3_expr (one coefficient perturbed), which the discriminant gate must
    reject - proving the gate has teeth
  - 'NULL OBJECT (from the proposal): MANDATORY. Matched null for the false-relation-rate measurement:
    RANDOM COORDINATE TUPLES from the same factor base that do NOT solve S_m. For these the sign search
    must find NO valid relation, with rate EXACTLY 0 successes out of 5000 - the mirror of the positive
    test. An instrument that finds relations for non-solutions is finding them by accident and the
    positive rate means nothing. DECAY PARAMETER: the factor-base size B. As B grows the accidental
    hit probability for the null must decay like B^m/N; a null hit rate that does NOT decay as B is
    reduced is the canonical artifact tell. SECOND NULL for the discriminant identity: a RANDOM (2,2,2)
    form with the same support as s3_expr, whose discriminant must be irreducible of degree 4 in x_1
    - confirming that total splitting is a property of the summation polynomial and not of the shape.'
  independent_variables: []
  metrics:
    primary:
    - symbolic pass/fail of the discriminant identity, per model
    - root-set agreement fraction over random pairs
    - false-relation rate and its confidence interval, positive and null arms
    - group operations per resolved relation, per m, naive and pruned
    secondary:
    - factor degrees of the discriminant, per model
    - number of valid sign patterns per solution (distribution)
  heuristic_under_test: null
  preregistered_prediction:
    quantity: symbolic equality disc_T s3_expr(a,b) == 16*f(x1)*f(x2) over Z[a,b,x1,x2]
    formula: EXACT identity, zero tolerance, symbolic not numeric. Failure is an instrument defect
      affecting the whole EXP-SEMAEV family.
    source: pre-registered in IDEA-20260807-8027a2 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - 2-TORSION AND COINCIDENT SUMMANDS produce solutions with more than one valid sign pattern and
    can inflate or deflate the measured rates. They must be counted separately, not filtered silently
    (AGENTS.md rule 8).
  - x(P) = x(Q) makes A = (x_1 - x_2)^2 vanish and the quadratic degenerate. Those tuples are legitimate
    solutions of S_3 but not root-pairs; they must be reported as their own category.
  - j = 0 and j = 1728 curves have larger automorphism groups, so the Kummer line is not the terminal
    quotient there and (A) does not apply. Excluded and stated.
  - Symbolic discriminant computation over Z[a, b] can be slow or can return a non-normalised form;
    equality must be tested via expand and simplify to zero, not by string comparison.
  - Confusing the genus-1 Kummer LINE with the genus-2 Kummer SURFACE is the single most likely misreading
    of this record and is the reason (F) and the method ceiling name it explicitly.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACT identity, zero tolerance, symbolic not numeric. Failure is an instrument
    defect affecting the whole EXP-SEMAEV family.
  falsification_criterion:
  - The discriminant identity fails symbolically. Then s3_expr is not the summation polynomial as
    documented, and the correct disposition is an instrument-defect report that supersedes nothing
    but blocks every EXP-SEMAEV interpretation until resolved.
  - The roots of S_3 in T are not {x(P+Q), x(P-Q)}. (B) is false.
  - A solution of S_m admits no valid sign pattern. (D3) is false and the x-only setting DOES introduce
    false positives - which would be a genuine cost of the Kummer view and would change the accounting
    in (D).
  - Sign resolution needs more than 2^(m-1) operations in the worst case observed. (D2) is false.
  - The random-(2,2,2) null also splits totally. The gate has no discriminating power and must not
    be used as an instrument check.
  - The corrupted-s3_expr control passes the gate. The gate is not implemented correctly and nothing
    is reported.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
