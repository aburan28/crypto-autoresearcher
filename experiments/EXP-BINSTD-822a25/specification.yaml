# EXP-BINSTD-822a25
# Schedule-band arithmetic. No system.
# Approved by DEC-20261002-4d0488.
experiment:
  id: EXP-BINSTD-822a25
  hypothesis_id: H-BINSTD-8eed47
  source_idea: IDEA-20261001-161102
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Degree product and cost-band gap
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-4d0488
  objective: >-
    Check the degree product 4, the shortfall 23, and the slot
    count 240.
  inputs:
    deg4: 4
    deg3: 2
    degree_product: 4
    band_num: 17
    band_den: 20
    below_one: 3
    ratio_shortfall: 23
    targets: 40
    band_count: 34
    cell_count: 6
    slots: 240
    floor_product: 1
  controls:
    - >-
      Two to the power 4 minus 2 is 4, and two to the power 3 minus
      2 is 2. Their product is 4. Reporting that product as 2
      invalidates the run.
    - >-
      Twice 20 minus 17 is 23. Reporting the band equal to the
      degree ratio 2 invalidates the run.
    - >-
      Twenty minus 17 is 3. Forty times 17 over 20 is 34. Six times
      40 is 240. The floor times 40 is 1.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {degree, band, slots}
    - route in {power_product, cross_multiply}
  metrics:
    primary:
      - degree_product
      - ratio_shortfall
      - implementations_agree
    secondary:
      - below_one
      - band_count
      - slots
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The degree product is 4. The band falls short of the degree
      ratio 2 by 23. The slot count is 240.
    formula: >-
      Compute 2 to the power m minus 2 at m equal to 4 and at m
      equal to 3, and multiply. Separately subtract 17 from twice
      20, and multiply six by 40.
    source: >-
      IDEA-20261001-161102 states the degree rule 2 to the m minus
      2 and the band 0.85, read 2026-10-02. The products were
      recomputed in this design session. That computation is not a
      run. No system was built.
  scale_relevance:
    tier: toy
    justification: Two arities and one band. No transfer to a solver.
    correspondence: null
  tail_checks:
    - The slot count 240 and the floor product 1 are required. A check that stops at the product 4 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the shortfall 23 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The degree product is not 4.
    - The shortfall is not 23.
    - The band is reported equal to the degree ratio 2.
    - A system is built or a solver is timed.
  success_criterion: >-
    Both runs agree that the degrees are 4 and 2, that their product
    is 4, that the shortfall against the degree ratio is 23, that 40
    times 17 over 20 is 34, and that six times 40 is 240.
  falsification_criterion: >-
    The runs agree that two to the power 4 minus 2 is 4, and twice
    20 minus 17 is not 23.
  required_artifacts:
    - experiments/EXP-BINSTD-822a25/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-822a25/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-822a25/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-822a25/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-822a25/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-822a25/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any summation system, solver, or wall-time measurement.
    - Any claim that one schedule is cheaper.
    - Any comparison with rho.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
