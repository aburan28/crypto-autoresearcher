experiment:
  id: EXP-CLGP-4c3f8f
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-1b7241
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE LANE''S CLOSURE, WITH AN EXPLICIT SIMULATOR RATHER THAN A FAILED REDUCTION COUNT: in
    a curve-aware generic group model where the adversary receives the entire isogeny class in the
    clear plus free vectorization and action oracles, but touches G only through a generic encoding,
    the curve-level view is a deterministic function of (p, E, t) and is therefore INDEPENDENT of
    k -- so the simulator computes it itself and Shoup''s Omega(sqrt N) survives untouched; the residual
    open class is named precisely and is non-empty'
  status: draft
  objective: "(A) WHY A SIMULATOR AND NOT A LIST OF FAILED ATTEMPTS. The inventor protocol's closure\
    \ standard (docs/inventor-protocol.md section 4; KN-TECH-056) is explicit that a count of screened-and-rejected\
    \ mechanisms is a fatigue report whose honest status is `unverified`. A closure needs a named\
    \ obstruction, an argument, and forward guidance. This record supplies all three, and the argument\
    \ is a SIMULATOR -- the same instrument that closed the incidence and endomorphism-image oracle\
    \ classes in KN-FIND-b7e091 -- applied to a genuinely new and much stronger oracle.\n(B) THE MODEL,\
    \ STATED PRECISELY BECAUSE THE WHOLE RESULT IS SCOPED BY IT. Call it CAGG (curve-aware generic\
    \ group with class-group action). An adversary A in CAGG receives, in the clear and for free:\n\
    \  - p, the Weierstrass equation of E, the trace t, D = t^2 - 4p, the order\n    O = End_{F_p}(E),\
    \ and h = h(O);\n  - explicit equations for EVERY curve in the isogeny class with End = O\n  \
    \  (all h of them), and the full ell-volcano structure for every small\n    ell;\n  - an ACTION\
    \ oracle Act([a], E_1) returning [a] * E_1, at unit cost;\n  - a VECTORIZATION oracle Vec(E_1,\
    \ E_2) returning the unique [a] with\n    [a] * E_1 = E_2, at unit cost -- an oracle strictly\
    \ stronger than any\n    known classical or quantum algorithm;\n  - the group order N and the\
    \ structure of Cl(O).\nA accesses the subgroup G = <P> ONLY through a generic encoding: a random\
    \ injective sigma : Z/N -> S, handles sigma(1) for P and sigma(k) for Q, and oracles for the group\
    \ operation and for equality. A does NOT receive the affine coordinates of the encoded points.\
    \ That last restriction is the model's entire content and is discussed in (E).\n(C) THE SIMULATOR,\
    \ AND IT IS SHORT. Let A be any CAGG adversary making q generic-group queries. Build a Shoup-model\
    \ adversary A' making q queries:\n  1. A' is given N and generic handles for P and Q, nothing\
    \ else.\n  2. A' SAMPLES the curve-level world itself. It picks any p, E, t\n     consistent with\
    \ N -- or, in the non-uniform version, has (p, E, t)\n     hardwired -- computes the isogeny class,\
    \ Cl(O), the volcano, and\n     implements Act and Vec in the clear by its own computation. No\n\
    \     oracle is needed: these are functions of (p, E, t) alone.\n  3. A' runs A, answering every\
    \ curve-level query from step 2 and\n     forwarding every generic-group query to its own oracle.\n\
    \  4. A' outputs whatever A outputs.\nA' perfectly simulates A's view, because the curve-level\
    \ view V(p, E, t) is a DETERMINISTIC FUNCTION OF (p, E, t) with no dependence on k, and k is uniform\
    \ on Z/N given the curve. Formally: the joint distribution of (V, k) is the product of a point\
    \ mass at V and the uniform distribution on k, so conditioning on V leaves k uniform. Hence A'\
    \ has the same success probability as A with the same query count, and Shoup's bound applies:\n\
    \    Pr[A recovers k] = O(q^2 / N),\nso q = Omega(sqrt(N)). THE VECTORIZATION ORACLE IS WORTH\
    \ EXACTLY NOTHING IN THIS MODEL.\n(D) THE NAMED OBSTRUCTION. Call it OBS-6, the PRODUCT-STRUCTURE\
    \ OBSTRUCTION: the ECDLP instance space over a fixed isogeny class factors as (curve coordinate\
    \ in a Cl(O)-torsor) x (answer k in Z/N), the class-group action moves only the first factor,\
    \ and k is a Cl(O)-INVARIANT of the instance (this is precisely transport theorem T1 of the campaign's\
    \ decomposition: an isogeny carries (E,P,Q,k) to (E',phi P,phi Q,k) with the SAME k). A symmetry\
    \ group that acts trivially on the answer space confers no search advantage. The contrast that\
    \ proves the statement is not vacuous: Aut(E) acts NON-trivially on the answer space (identifying\
    \ P with zeta P shrinks the search by |Aut|), which is exactly why it buys the sqrt(|Aut|) <=\
    \ sqrt(6) discount of KN-TECH-018 -- and Cl(O), of order h ~ sqrt(p), buys nothing at all despite\
    \ being astronomically larger. The relevant quantity is the ORBIT OF THE ANSWER, not the size\
    \ of the group.\n(E) THE MODEL'S ONE REAL RESTRICTION, AND THE RESIDUAL OPEN CLASS. In CAGG the\
    \ adversary cannot turn a POINT into a CURVE, because it never sees x(Q) as a field element. In\
    \ reality it does. So the honest reading of (C) is: any bridge from ECDLP to the class group must\
    \ pass through the CONCRETE REPRESENTATION of points -- resource R1, x-coordinates as field elements\
    \ -- and not through their group-theoretic content. That is the forward guidance this closure\
    \ owes, it is precise, and the class is NON-EMPTY: IDEA-20260807-326442, filed in this same batch,\
    \ is a concrete member of it (multi-curve factor bases), and the R1 lanes L1/L4/L11 own the rest.\
    \ Two further classes remain outside the model and are named rather than swept up: multi-instance/preprocessing\
    \ adversaries across a class (lane L13, resource R8), and adversaries whose queries depend on\
    \ the concrete encoding of S. Naming three residual classes is what separates this from a fatigue\
    \ report.\n(F) WHAT THIS IS NOT. It is not a lower bound on the ECDLP. It is not a claim that\
    \ no reduction exists. It is a statement that ONE specific and very powerful resource -- the exact\
    \ class-group coordinate of any curve -- is generic-group-simulable relative to the point group,\
    \ and is therefore closed at exponent 1/2 in the same sense as KN-FIND-b7e091's two oracle classes."
  resource_label: 'Audit: consumes no resource. This proposal EXTENDS the campaign''s admissibility
    filter to a new oracle class (R4, the class-group action and vectorization) rather than consuming
    it. It is an L12-style audit executed inside L10, which is where its target lives.'
  admissibility: inadmissible_generic_group
  admissibility_argument: 'The verdict applies to the ORACLE CLASS under audit, not to the audit.
    The vectorization and action oracles are shown CAGG-simulable by the explicit simulator in (C),
    hence closed at exponent 1/2 by Shoup exactly as the incidence and endomorphism-image oracles
    were in KN-FIND-b7e091 and DEC-20260804-3b4258. This is a strictly stronger statement than H-ENDO-001''s
    scalar collapse, which concerns endomorphisms acting ON G: here the oracle never touches G at
    all, and it is still worthless, for the independent reason that its answers are k-independent.
    Recording the verdict as `inadmissible_generic_group` is the campaign-correct label and the brief
    directs that such a proposal be filed anyway as a recorded closure with its obstruction named.'
  reachability_gate: 'T5 IS SATISFIED IN THE STRONGEST POSSIBLE WAY AND THAT IS THE POINT OF THE RECORD.
    The model GRANTS the adversary the ability to reach any specified curve at unit cost -- the hard
    side of the T5 dichotomy is handed over for free, along with the exact address of every curve.
    The conclusion is unchanged: no advantage. So this record settles the reachability question for
    L10 in the only way that matters -- by showing that even FREE reachability is worthless, so the
    gate is not the binding constraint in this lane and no future L10 proposal may claim value from
    cheaper reachability alone. For the empirical arm, reachability is cheap by construction: the
    class-augmented walk moves to ADJACENT curves via small split primes, which is the O(log p) rapid-mixing
    side of the dichotomy, and never needs to reach a specified curve.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE, AND THIS IS THE WHOLE CHEAP CORE): write CAGG formally
      and run the interface-by-interface audit of Step 2(i). If every interface is (p,E,t)-determined,
      the lemma follows in two lines and the closure is established at ZERO compute. If any interface
      is not, the record is refuted, also at zero compute. STAGE 1 (minutes): the h = 1 degeneracy
      check. STAGE 2 (hours): implement class-augmented rho over a toy isogeny class -- state (curve,
      point), transport by T1, cost model charging isogeny steps at their measured price -- and run
      it against plain rho on identical seeds. STAGE 3 (hours): run the identical harness in CAGG+
      with planted moduli M in {1, N^{1/4}, N^{1/2}} and record the decay curve. STAGE 4 (zero compute):
      write the three residual open classes.'
    mechanism: "STEP 1 (zero compute). Write the CAGG model down formally: the exact interfaces, the\
      \ exact free information, the exact restriction. A model that is not pinned cannot be the scope\
      \ of a closure.\nSTEP 2 (zero compute, THE ARGUMENT). Prove the simulation lemma of (C). Two\
      \ checks are the whole risk and both must be done explicitly rather than waved at:\n  (i) EVERY\
      \ oracle in the model is a function of (p, E, t) alone -- verify\n      interface by interface,\
      \ including the volcano data and the class\n      group structure;\n  (ii) the simulator's reconstruction\
      \ is EFFICIENT ENOUGH for the claimed\n      statement. Note honestly: computing the whole class\
      \ costs\n      poly(p)-ish at toy scale and L_p(1/2) or worse at crypto scale, so\n      the\
      \ simulation is TIGHT for the query-complexity statement (which is\n      what Shoup bounds)\
      \ and LOOSE for a time-complexity statement. The\n      record claims only the query-complexity\
      \ version, and says so in the\n      method ceiling. Getting this distinction wrong is the single\
      \ most\n      likely way this argument fails, so it is pinned here.\n\nSTEP 3 (zero compute).\
      \ Derive OBS-6 in the symmetry form: define the action of Cl(O) on instances, verify k is invariant\
      \ (this is T1), and state the orbit-of-the-answer principle with the Aut(E) contrast as the\
      \ non-vacuity witness.\nSTEP 4 (toy compute, THE EMPIRICAL FACE OF A SYMBOLIC RESULT). The simulation\
      \ lemma predicts a measurable thing: an ECDLP solver that is ALLOWED to use the class-group\
      \ action must not beat one that is not. Implement a CLASS-AUGMENTED RHO: a Pollard rho whose\
      \ state is (curve, point) and whose steps are, with probability 1 - q an ordinary pseudo- random\
      \ group step on the current curve, and with probability q an isogeny step to an adjacent curve\
      \ carrying the point along by T1 transport. Measure total cost to solve, in a unit that charges\
      \ an isogeny step its true price, against plain rho on identical instances and seeds. PREDICTED:\
      \ strictly WORSE, by the factor (1 + q * (cost of an isogeny step / cost of a point addition\
      \ - 1)), i.e. the augmentation is pure overhead. A class-augmented walk that solves FASTER than\
      \ plain rho at equal charged cost would contradict OBS-6 and is the one outcome worth escalating.\n\
      STEP 5 (zero compute). Write the three residual open classes of (E) with pointers, so the closure\
      \ carries forward guidance and not just a verdict."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - CAGG+ planted-bridge model -- the harness MUST show a benefit there
  - M = 1 decay endpoint -- the benefit MUST vanish
  - h = 1 degeneracy -- class-augmented and plain arms MUST coincide
  - plain rho baseline at 0.886 sqrt(N) within 20 percent on identical instances, before any ratio
    is computed
  - identical seeds across arms, so the comparison is paired rather than distributional
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, and it must be a PLANTED-BRIDGE MODEL
    because the prediction is a null. Define CAGG+ identically to CAGG except that the adversary additionally
    receives one extra oracle Leak(Q) returning ([k mod M] embedded in Cl(O)) for a planted modulus
    M | h. In CAGG+ the simulator provably FAILS (the extra oracle is not a function of (p,E,t)),
    and a class-augmented solver provably beats plain rho by the accounting of IDEA-20260807-bbdcf3.
    The Step 4 harness must be run in BOTH models: it must show no benefit in CAGG and a measurable
    benefit in CAGG+. A harness that shows no benefit in CAGG+ cannot detect a benefit at all, so
    its CAGG null is void and the run set is INVALID rather than negative. DECAY PARAMETER: M. As
    M decreases to 1, the measured CAGG+ benefit must decay to zero. A benefit that persists at M
    = 1 means the harness is leaking k through the instance generator or the seed schedule -- the
    canonical artifact tell -- and everything downstream is void. MATCHED SHAPE: CAGG+ differs from
    CAGG in exactly one interface, so the null object has the same shape as the object.'
  independent_variables: []
  metrics:
    primary:
    - charged cost per arm per instance per seed, in point-addition equivalents, with the isogeny-step
      price measured not assumed
    - the ratio class-augmented/plain, per q, with paired confidence intervals
    - the same in CAGG+ per planted M, and the decay curve
    - the Step 2(i) audit table: one row per interface, with its verdict
    secondary:
    - h, N, and the isogeny-step price per instance
  heuristic_under_test: null
  preregistered_prediction:
    quantity: charged cost to solve (in point-addition-equivalents) of class-augmented rho divided
      by plain rho, on identical instances and seeds, in CAGG mode
    formula: At least 1.0 at every isogeny-step probability q > 0, and increasing in q, matching the
      predicted overhead factor within 25 percent. A ratio below 0.9 that persists across seeds contradicts
      OBS-6 and is escalated for independent review before any interpretation.
    source: pre-registered in IDEA-20260807-1b7241 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - MISCHARGED ISOGENY STEPS. If an isogeny step is charged at one point addition, the class-augmented
    arm will look free and any conclusion is worthless. The step price must be MEASURED on the same
    machine in the same unit and reported per instance. This is the single largest confounder in Step
    4.
  - SEED PAIRING. Comparing arms on different seeds turns a paired comparison into a distributional
    one and inflates variance enough to hide a factor-2 effect at toy sizes. Seeds are shared across
    arms.
  - TINY h. At h < 20 the class-augmented walk revisits curves constantly and its behaviour is dominated
    by the tiny state space rather than by the mechanism. Require h >= 100 before interpreting the
    q-sweep.
  - FRUITLESS CYCLES. Rho variants that use maps of small order are prone to fruitless cycles (the
    classical negation-map problem). A class-augmented walk has the same risk through short isogeny
    cycles, and an unmitigated cycle would make the augmented arm look worse for a reason unrelated
    to OBS-6. Cycle detection and its mitigation are part of the harness and are reported.
  - 'MODEL/REALITY SLIPPAGE. The strongest confounder is rhetorical rather than statistical: it is
    very easy to state the CAGG result and then discuss it as though it were about real adversaries.
    Every reported sentence must carry the model name.'
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: At least 1.0 at every isogeny-step probability q > 0, and increasing in q, matching
    the predicted overhead factor within 25 percent. A ratio below 0.9 that persists across seeds
    contradicts OBS-6 and is escalated for independent review before any interpretation.
  falsification_criterion:
  - An interface of CAGG is found that is not a function of (p, E, t) -- e.g. an oracle whose behaviour
    depends on the encoding sigma. The simulation lemma is false as stated; the closure does not hold;
    supersede the record. This is the cheapest and most valuable falsification and it costs nothing.
  - Class-augmented rho solves faster than plain rho at equal charged cost, persistently across seeds
    and instances. OBS-6 is contradicted empirically; escalate immediately for independent review,
    and do not interpret until replicated, because the far more likely cause is a mischarged isogeny
    step.
  - CAGG+ shows no benefit. Harness blind; run set INVALID rather than negative (docs/inventor-protocol.md,
    controls before belief).
  - The CAGG+ benefit fails to decay at M = 1. The harness leaks k; every number in the run set is
    void.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-1b7241
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
