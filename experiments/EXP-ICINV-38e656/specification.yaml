experiment:
  id: EXP-ICINV-38e656
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-8b9486
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE ONLY WITHIN-CLASS VARIATION OF THE SUMMATION-POLYNOMIAL COEFFICIENT STRUCTURE, LOCATED
    EXACTLY AND CAPPED EXACTLY: the support of S_m is a function of the vanishing pattern of (a, b)
    alone, so it is constant on the open locus ab != 0 and degenerates only at j = 0 and j = 1728
    -- each of which occurs at most once per class and only when D_0 = -3 or -4 -- and the resulting
    sparsity gain is a closed-form constant that this record computes rather than measures'
  status: draft
  objective: "(A) THE FUNCTIONAL. Take as the cost functional the SUPPORT of the m-th summation polynomial\
    \ -- the set of monomials with non-zero coefficient -- together with the derived quantities an\
    \ algebraic solver actually pays for: the number of non-zero coefficients nnz(S_m), the density\
    \ of the Macaulay matrix built from it, and the Newton polytope that governs BKK-type sparse elimination\
    \ (KN-TECH-007). These are genuine costs: sparse linear algebra and polytope-driven elimination\
    \ are charged per non-zero entry (KN-TECH-008), and the program has recorded BKK-based speedups\
    \ (KN-FIND-2a8b7e, KN-FIND-c7d31e as cited by IDEA-20260806-e4f96e).\n(B) WHY IT COULD DEPEND\
    \ ON THE EQUATION AND NOT ONLY ON (p, N, t), STATED EXACTLY. S_3(x1, x2, x3) for y^2 = x^3 + a\
    \ x + b is\n  (x1-x2)^2 x3^2 - 2[(x1+x2)(x1 x2 + a) + 2b] x3 + [(x1 x2 - a)^2 - 4b(x1+x2)].\n\
    Its monomials fall into three groups: those with no a or b (present always), those carrying a\
    \ (the terms a x3(x1+x2), a x1 x2 -- from expanding -- and a^2), and those carrying b (4b x3 and\
    \ -4b(x1+x2)). Therefore\n    support(S_3) is a function of the pair of BITS (a = 0?, b = 0?)\n\
    and of nothing else. Since a = 0 <=> j = 0 and b = 0 <=> j = 1728, the support is constant on\
    \ the open locus and takes exactly two other values. This is a curve-equation functional in the\
    \ strictest sense: it reads (a, b) directly. It is ALSO gauge-invariant, since a = 0 <=> u^4 a\
    \ = 0 -- so unlike the window functionals it cannot be moved by choosing a different equation\
    \ for the same curve, and the gauge null of IDEA-20260807-6eb96b is a mode-1 null for it, which\
    \ this record states rather than discovers.\n(C) THE EXACT CLASS-LEVEL ANSWER. By T4 of DECOMPOSITION.md,\
    \ a class contains a j = 0 curve only if D_0 = -3 and a j = 1728 curve only if D_0 = -4, and in\
    \ those cases the special curve sits at the CRATER, where End(E) is the maximal order O_K = Z[zeta_3]\
    \ or Z[i]. Hence:\n  CLASS WITH D_0 not in {-3, -4}: support(S_m) is CONSTANT across the entire\n\
    \    class. The functional is a class invariant, with the obstruction named\n    (O-SUPPORT):\
    \ the support depends on (a, b) only through their vanishing,\n    the vanishing is an isomorphism\
    \ invariant, and the only isomorphism\n    classes with a vanishing coefficient are j = 0 and\
    \ j = 1728, which the\n    class does not contain.\n  CLASS WITH D_0 = -3 (resp. -4): exactly\
    \ the crater curves with j = 0\n    (resp. 1728) have the smaller support. Within-class variance\
    \ is\n    NON-ZERO, it is TWO-VALUED, and the minimiser has a CLOSED-FORM ADDRESS.\nSo this is\
    \ the lane's cleanest example of a functional that is a class invariant on almost every class\
    \ and provably non-constant on a thin, completely characterised family.\n(D) THE PRIZE, CAPPED\
    \ BEFORE MEASUREMENT. This record does not measure a speedup; it computes a ceiling. Let nnz_gen(m)\
    \ and nnz_0(m), nnz_1728(m) be the non-zero counts of S_m on the generic locus and at the two\
    \ special j. The sparse-solver cost is linear in nnz, so the best possible gain from moving to\
    \ the special curve is the ratio nnz_gen/nnz_special, a CONSTANT independent of p. For m = 3 this\
    \ ratio is computable by hand and by sympy in seconds. And there is a second, independent cap\
    \ already in the corpus: KN-TECH-018 records that the automorphism discount available at j = 0\
    \ and j = 1728 is at most sqrt(6), a constant, never an exponent, and L3's obstruction requires\
    \ any claim on these curves to EXCEED that or be labelled baseline calibration. This record labels\
    \ itself baseline calibration in advance.\n(E) THE TWO OUTCOMES. OUTCOME C (constant support within\
    \ every class with D_0 outside {-3,-4}, two-valued otherwise): the derivation in (B)-(C) is confirmed,\
    \ the functional is closed with the obstruction named, and the exact ratio is recorded as a permanently\
    \ available constant. OUTCOME V (support varies inside a class with D_0 outside {-3,-4}): the\
    \ reasoning in (B) is wrong -- some coefficient of S_m vanishes for a reason other than a = 0\
    \ or b = 0 -- and that would be a genuinely surprising algebraic fact about summation polynomials\
    \ worth its own record. Both outcomes are deliverables and OUTCOME V is checkable exhaustively\
    \ at toy scale."
  resource_label: 'R2 (the curve equation and model: the functional reads the coefficients (a, b)
    themselves) with a downstream effect on R1 (the field-element computations of the decomposition
    system).'
  admissibility: admissible
  admissibility_argument: 'The support of S_m is read off the Weierstrass coefficients. No group-operation
    oracle can produce it: an algorithm restricted to add, negate and equality-test on G never sees
    a or b. It escapes KN-FIND-b7e091 trivially, since neither the incidence nor the endomorphism-image
    oracle outputs a polynomial coefficient. It is admissible AND, by this record''s own conclusion,
    worthless as an attack -- admissibility of the resource and value of the direction are different
    questions and this record separates them explicitly.'
  reachability_gate: 'ROUTE (R-address) OF IDEA-20260807-c36472, AND IT IS PASSED. When D_0 = -3 the
    minimiser''s address is known with no search at all: it is the curve j = 0, i.e. y^2 = x^3 + b
    for the b that gives the right trace among the six sextic twists, which is found by counting points
    on at most six curves. Transporting the instance to it requires an explicit connecting isogeny,
    costing Otilde(p^{1/4}) [open, per IDEA-20260807-c36472 H3] against a p^{1/2} baseline -- affordable.
    SO THE GATE IS PASSED AND THE DIRECTION IS STILL WORTHLESS, because the prize is a constant bounded
    by nnz_gen/nnz_special times sqrt(6) and constants do not move the exponent. Recording a passed
    gate with a worthless prize is deliberate: it is the exact configuration a reader would otherwise
    suspect the lane of having skipped.'
  inputs:
    procedure: 'STAGE 0 (seconds): symbolic support tabulation for S_3 and S_4 at generic, a = 0 and
      b = 0, plus the frozen fixture asserting s3_expr equals the KN-TECH-002 polynomial. This alone
      is the primary deliverable. STAGE 1 (minutes): the mixed-volume honesty check in both raw and
      symmetrised coordinates. STAGE 2 (~1 hour): exhaustive class enumeration at p in [2^12, 2^14]
      and the three integer checks of the predictions. STAGE 3 (zero compute): the cost translation
      with both caps (nnz ratio and KN-TECH-018''s sqrt(6)), and the reachability line. Total cost
      is well under a day and most of it is Stage 2''s enumeration, which is shared with IDEA-20260807-0ff796
      and should not be paid twice.'
    mechanism: 'STEP 1 -- EXACT SUPPORT COMPUTATION, ZERO COMPUTE BEYOND SYMPY. Compute S_3 and S_4
      symbolically over Q[a, b][x_i] (harness/semaev.py already provides s3_expr and s4_expr, the
      latter by resultant). Tabulate the monomial support and nnz for (i) generic a, b; (ii) a = 0;
      (iii) b = 0. Report the exact ratios nnz_gen/nnz_0 and nnz_gen/nnz_1728 for m = 3 and m = 4.
      Also compute the Newton polytope vertices and its normalised volume in each case. This is the
      record''s PRIMARY DELIVERABLE and it costs seconds.

      STEP 2 -- THE MIXED-VOLUME HONESTY CHECK. Compute the BKK bound for the actual decomposition
      system {S_3(., ., x_R), f_V(x1), f_V(x2)} in both the generic and the special cases, and confirm
      or refute the record''s own prediction that it is dominated by B and therefore INSENSITIVE to
      the S_3 polytope. Then repeat in the SYMMETRISED coordinates (e_1 = x1 + x2, e_2 = x1 x2), where
      S_3 becomes a polynomial in (e_1, e_2, x_R) whose support does change, and report whether the
      mixed volume there is sensitive. A record that reported a polytope gain without this check would
      be claiming a BKK improvement that the system does not have.

      STEP 3 -- EXHAUSTIVE TOY VERIFICATION OF THE CLASS STATEMENT. Enumerate complete classes at
      p in [2^12, 2^14]. For every member compute the support of S_3 and check: (i) support is constant
      across every class whose D_0 is not -3 or -4; (ii) classes with D_0 = -3 contain exactly one
      j = 0 curve and it is the unique member with the smaller support; likewise D_0 = -4 and j =
      1728. This is a complete, exhaustive check at these p -- no sampling and no statistics -- and
      it either confirms (C) or exhibits a counterexample.

      STEP 4 -- THE COST TRANSLATION, WITH BOTH CAPS. Convert the nnz ratio into a bound on the sparse-linear-algebra
      stage of point-decomposition index calculus (cost linear in nnz per Wiedemann/Lanczos iteration,
      KN-TECH-008), and place it beside KN-TECH-018''s sqrt(|Aut|) <= sqrt(6) automorphism discount,
      which applies to the SAME curves. Report the product as the total constant-factor advantage
      available on a crater CM curve, and state plainly that the exponent is unchanged at 1/2.

      STEP 5 -- THE REACHABILITY LINE, WHICH IS SHORT AND EXACT. When D_0 = -3, the good curve''s
      address is known a priori (j = 0), so this is route (R-address) of IDEA-20260807-c36472: transport
      costs Otilde(p^{1/4}) [open] against a p^{1/2} baseline. So the gate is PASSED and the direction
      is still worthless, because the prize is a constant. That combination -- reachable and worthless
      -- is worth recording precisely because it is the one the lane is most likely to be accused
      of not having checked.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - random-curve arm at the same p (degenerate support must be ~2/p rare)
  - random polynomial with matched support (nnz reads shape, not curve)
  - frozen symbolic fixture against KN-TECH-002
  - explicit statement that the gauge null is MODE-1 here and is not used
  - exhaustive rather than sampled class sweep, so no sampling control needed
  - 'NULL OBJECT (from the proposal): MANDATORY. MATCHED NULL: the GAUGE ORBIT is a MODE-1 NULL for
    this functional and must not be used as its spread reference -- support is gauge-invariant by
    algebra, so the gauge arm''s spread is EXACTLY ZERO and a control with zero spread is a constant
    of the apparatus (KN-TECH-1a5b7e mode 1, "if your comparator''s spread is zero, your statistic
    is a constant"). The record states this before the run instead of running it and passing. THE
    ADMISSIBLE NULL is a RANDOM-CURVE arm at the same p: draw curves uniformly, compute support, and
    confirm the support takes the generic value except on the O(1) curves with a = 0 or b = 0 -- i.e.
    with probability ~2/p. DECAY PARAMETER: p. The fraction of curves with a degenerate support must
    decay like 1/p; a fraction that does not decay would mean coefficients vanish for reasons other
    than a = 0 or b = 0 and would be OUTCOME V. SECOND NULL: a random polynomial with the same monomial
    support and random coefficients -- its nnz is identical, which demonstrates that nnz alone reads
    the SHAPE and not the curve, and therefore bounds what any nnz-based conclusion may say.'
  independent_variables: []
  metrics:
    primary:
    - exact monomial supports and nnz for S_3, S_4 in all three regimes
    - Newton polytope vertices and normalised volume in all three regimes
    - BKK mixed volume of the decomposition system, raw and symmetrised
    - number of distinct supports per class, per class, exhaustively
    secondary:
    - the class's D_0 and whether j = 0 or 1728 occurs
    - the product of the nnz ratio and the sqrt(|Aut|) discount
  heuristic_under_test: null
  preregistered_prediction:
    quantity: nnz(S_3) and nnz(S_4) at generic (a, b), at a = 0, and at b = 0
    formula: Strictly lower at a = 0 and at b = 0 than at generic (a, b); the exact integers are the
      deliverable. If the counts are EQUAL, (B) is wrong and the record collapses -- which is a two-second
      check.
    source: pre-registered in IDEA-20260807-8b9486 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - 'SEXTIC AND QUARTIC TWISTS. j = 0 has six twists and j = 1728 has four, distributed across SEVERAL
    traces. So "the class contains a j = 0 curve" must be checked per trace, not per j: only the twists
    whose trace matches the class belong to it. Pooling twists across traces would manufacture a fake
    count of 6 instead of 1.'
  - SUPERSINGULARITY. j = 0 is supersingular when p = 2 mod 3 and j = 1728 when p = 3 mod 4. Those
    curves are outside the ordinary setting; primes must be chosen so the intended case is ordinary,
    and the choice recorded.
  - SPARSITY IS NOT SPEED. nnz is a proxy for sparse-solver cost only under the assumption that cost
    is linear in nnz. Wiedemann/Lanczos iteration counts depend on other things too (KN-TECH-008),
    so the translation in Step 4 is a bound and is labelled as one.
  - MODEL DEPENDENCE. The whole analysis is short-Weierstrass. In Montgomery or Edwards form the degeneracy
    loci are different and none of this transfers; that is L11's territory.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Strictly lower at a = 0 and at b = 0 than at generic (a, b); the exact integers
    are the deliverable. If the counts are EQUAL, (B) is wrong and the record collapses -- which is
    a two-second check.
  falsification_criterion:
  - 'nnz at a = 0 equals nnz at generic (a, b). (B) is wrong; the record is superseded. Cost of discovering
    this: seconds.'
  - 'Some class with D_0 outside {-3, -4} exhibits two distinct supports. OUTCOME V: a coefficient
    of S_m vanishes for a reason not captured by (a = 0?, b = 0?), which is an algebraic fact about
    summation polynomials worth its own record and which invalidates (C).'
  - A D_0 = -3 class contains zero or two members with the smaller support. The crater identification
    in (C) is wrong.
  - The symmetrised mixed volume DOES differ between regimes. The record's prediction is refuted and
    the polytope half of the functional becomes live, which would raise the record's priority rather
    than kill it.
  - Exhaustive enumeration at p = 2^14 exceeds budget. INFRASTRUCTURE outcome under AGENTS.md rule
    5; reduce p, report as such.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
