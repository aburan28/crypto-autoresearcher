experiment:
  id: EXP-SHAONE-5fa884
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-1e36fa; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-1e36fa
  question_id: RQ-SHAONE-081e3a
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exact closure of the chained near-collision difference-state set for a declared disturbance-vector
    family versus a matched random family, with the composed cost curve C(k) tabulated and its minimum
    located in both arms.
  objective: 'The single uncertainty a run reduces is whether the reachable inter-block difference
    set carries structure that the chosen-prefix cost curve actually depends on, or whether the curve
    is determined by cardinality alone. Stated as parts: (i) it measures N(k), the exact cardinality
    of the k-step closure, for the declared disturbance-vector family, establishing whether the object
    is enumerable at all within declared memory and at which k it stops being enumerable; (ii) it
    measures the same quantity for a null family matched in cardinality and Hamming-weight profile,
    run in the same process with the same code path, so that any difference in growth is attributable
    to structure rather than to the arithmetic of taking sums of sets; (iii) it composes both closures
    with a declared birthday-cost function and a declared per-block search-cost function into C(k),
    tabulates the curve, locates k_min, and reports the curvature around it and its movement under
    at least three alternative declared S(j) models, so that a reader can see immediately how much
    of the curve is the object and how much is the input. The run does not attempt any collision,
    evaluates the compression function only inside the difference-propagation check used to validate
    the closure step, and produces no object requiring a solution certificate.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for THIS disturbance-vector
      family, THIS signed-bit-difference representation, and k up to the reported k_max, the reachable
      difference-state cardinality is N(k), and under THESE declared cost inputs the composed curve
      has this minimum and this curvature, differing from a matched random family by this measured
      amount. WHAT DOES NOT FOLLOW: nothing about the true cost of any chosen-prefix collision, nothing
      about SHA-1''s security, nothing about whether any published figure is right or wrong, nothing
      about any other disturbance-vector family, and nothing about any deployed system. A difference
      from the null establishes only that the closure is structure-sensitive, not that the structure
      is exploitable.'
  inputs:
    procedure: 'STAGE 0 (cost: 1 CPU-hour, human): fix and write down the disturbance-vector family,
      the signed-bit-difference canonical form, the chaining addition on difference states, the declared
      B(N) and the three declared S(j) variants. Nothing is fitted at this stage and the declarations
      are frozen before any computation. STAGE 1 (cost: minutes of CPU): implement single-block reachable
      difference set D by direct enumeration under the declared family, and unit-test the closure
      step against brute-force difference propagation on a reduced-width toy compression function
      where exhaustive verification is possible. STAGE 2 (cost: under 1 CPU-hour, memory-bound): compute
      S_1..S_kmax by breadth-first closure with canonical deduplication, recording N(k), wall clock
      and peak RSS at each step; stop at declared memory ceiling and record k_max. STAGE 3 (cost:
      identical to stage 2, same invocation): repeat stage 2 verbatim for the random null family and
      the shuffled-disturbance-vector control. STAGE 4 (cost: seconds): compose C(k) for every arm
      and every declared S(j), tabulate, locate k_min, compute curvature and the C(k_min +/- 1)/C(k_min)
      ratio. STAGE 5 (cost: 1 CPU-hour): emit the run manifest, all tables, and a plain statement
      of every disagreement with the predictions.'
    instrument: Python 3.11 with numpy for the difference-state arrays and bitset arithmetic; a small
      ctypes-wrapped C kernel for the compression-function difference-propagation unit tests in STAGE
      1 (no Sage, no computer-algebra dependency); hashlib only for reference vectors; harness/runner.py
      for the run manifest and the inference block; tools/allocate_id.py for identifiers; deterministic
      seeding through the harness seed convention so the null arm is reproducible. Peak memory measured
      by resource.getrusage, not estimated.
    parameters: 'Disturbance-vector family: one declared family, fixed in STAGE 0. Closure depth k
      from 1 to k_max with a declared memory ceiling of 8 GiB. Null family: cardinality matched to
      |D| exactly, Hamming-weight profile matched bucket-by-bucket, 30 independent random draws to
      give a null distribution rather than a single null point. Shuffled-DV control: 30 independent
      bit-position permutations. Declared S(j) variants: 3. Declared B(N): one functional form with
      3 declared price-independent parameter settings. Toy validation compression function for STAGE
      1: reduced state width 32 and 48 bits, where exhaustive difference propagation over all inputs
      is feasible.'
  controls:
  - Random difference family of matched cardinality and matched Hamming-weight profile, run in the
    same invocation as the signal arm.
  - 'Shuffled-disturbance-vector control: permute the bit positions of the declared disturbance vector
    and recompute closure, to separate structure from mere sparsity.'
  - 'Declared-input sensitivity control: recompute C(k) under at least three different S(j) models
    and report whether k_min moves.'
  - Cardinality-matched but structureless control where D is replaced by a set of independent uniform
    differences.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A random difference family: draw a set D_rand of the same cardinality
    as D, uniformly from difference states of the same Hamming weight profile, and run the IDENTICAL
    closure computation and the IDENTICAL cost composition in the same invocation. The null must show
    a materially different closure growth curve and, critically, a materially different curvature
    at the minimum of C(k). If the random family produces the same curve shape, then the curve is
    a property of set-closure arithmetic rather than of the disturbance-vector structure, and the
    signal arm means nothing beyond combinatorics.'
  independent_variables:
  - closure depth k
  - arm (structured family / random null / shuffled-DV control)
  - declared per-block cost model S(j) variant
  - toy compression-function state width in STAGE 1
  metrics:
    primary:
    - N(k) exact cardinality per arm per k
    - growth ratio N(k+1)/N(k) per arm
    - k_min of the composed curve C(k) per arm per S(j) variant
    - curvature proxy C(k_min+1)/C(k_min) and C(k_min-1)/C(k_min)
    secondary:
    - peak resident memory and wall clock per closure step
    - k_max reached before the memory ceiling
    - fraction of STAGE 1 toy propagation unit tests passing
    - spread of N(k) across the 30 null draws
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The ratio R(k) = N_structured(k) / median over null draws of N_null(k), for k = 2 and
      k = 3, and the position of k_min in each arm.
    formula: 'Predicted: R(2) <= 0.5 and R(3) <= 0.5, i.e. the structured closure grows at most half
      as fast as a cardinality-matched random family, because the declared family''s differences are
      constrained to a low-dimensional sublattice while random differences are not. Predicted k_min
      identical across the three S(j) variants for the structured arm, and unstable (moving by at
      least one) for the null arm. C(k) is defined as B(N(k)) + sum over j = 1..k of S(j), with B
      and S frozen in STAGE 0.'
    source: Pre-registered in the parent proposal IDEA-20260816-1e36fa before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are closure depth k <= 3 on a declared disturbance-vector family,
      plus reduced-width (32- and 48-bit) toy compression functions where exhaustive difference propagation
      is verifiable. The transfer assumption, stated explicitly: results about the SHAPE of C(k) and
      about structure-versus-cardinality sensitivity are argued to carry to full-width parameters
      because the closure step is defined identically at any width, but the NUMERIC values of N(k)
      do not transfer at all and no extrapolation of them is performed. Any statement about SHA-1
      parameters would require the full-width family and is outside this contract.'
    correspondence: null
  tail_checks:
  - Report the full distribution of N(k) over the 30 null draws, not the mean, and check whether the
    structured value falls inside or outside the null range rather than merely differing from its
    centre.
  - Check whether closure growth is saturating rather than exponential at k_max, which would be a
    memory-ceiling artefact masquerading as structure.
  - Check that the canonical deduplication is idempotent and order-independent on a random permutation
    of the insertion order.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop closure at the declared 8 GiB memory ceiling and report k_max; do not extend the ceiling
    mid-run.
  - Stop the whole experiment and report a controlled null if R(2) and R(3) both lie inside the null
    draws' interquartile range.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run is successful if N(k) is computed exactly for k = 1..3 in all three arms
    with reproducible seeds and idempotent deduplication, and R(2) and R(3) are reported with the
    full null distribution -- regardless of which direction the result falls.
  falsification_criterion:
  - 'R(2) and R(3) both inside the null interquartile range: the structured family''s closure is indistinguishable
    from cardinality-matched randomness and the tracked object is closed as set arithmetic within
    this scope.'
  - Deduplication shown order-dependent, invalidating every N(k) reported.
  - STAGE 1 toy propagation unit tests fail at either width, showing the closure step does not implement
    the compression function's actual difference propagation.
  - k_min moves under all three declared S(j) variants in the structured arm, showing the curve reports
    the declared input rather than the object.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-1e36fa
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The declared per-block cost model S(j) is not derived here and must be fixed by the Coordinator
    before approval, with its provenance stated; a fitted S(j) would make the whole experiment circular.
  - The disturbance-vector family must be specified from a primary-text source filed as a KN-LIT entry,
    per the RQ-SHAONE-081e3a constraint that no experiment be designed against a remembered description.
  - The signed-bit-difference canonical form's congruence with the chaining addition is assumed at
    STAGE 0 and only spot-checked at STAGE 1; a full argument or a measured failure boundary is still
    owed.
  - Whether the MD5 shape-validation arm belongs in this contract or is consumed from GOAL-MD5-001
    is a scoping decision the Coordinator must make, since GOAL-SHA1-001 declares it does not own
    the MD5 pipeline.
