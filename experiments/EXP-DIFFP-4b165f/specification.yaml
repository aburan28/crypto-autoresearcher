    - >-
      execution-report.yaml in the contract's declared order, whose HEADLINE IS THE
      PER-COMPONENT POWER TABLE and never a pass, and which closes with the explicit
      statement that NO PATH IS CLAIMED NEW, NO SEARCH WAS RUN, NO SOURCE WAS
      ACQUIRED, NO INSTRUMENT WAS REPAIRED, and the MD5 LANE IS BLOCKED RATHER THAN
      CLOSED.

  # =====================================================================
  interpretation_limits:
    - >-
      CLAIM CEILING `analyzed`, NEVER `supported`, for every record derived from
      this contract. It carries no asymptotic claim; three of CLAUDE.md's four
      supported-promotion gates are structurally unmet by a batch of this kind and
      the fourth is not attempted.
    - >-
      A CONTROL SUITE THAT DETECTS MORE ABLATIONS IS A BETTER INSTRUMENT AND IS NOT
      A RESULT ABOUT MD5 OR SHA-1. A PASSING CONTROL IS NOT A CRYPTANALYTIC
      IMPROVEMENT. Nothing measured here bears on either primitive's difference
      space, on any published characteristic, or on novelty.
    - >-
      EVERY NUMBER HERE IS ABOUT A 16-ENTRY SYNTHETIC SHADOW CENSUS IN WHICH EVERY
      PLANTED MD5 ENTRY CARRIES A WEIGHT-1 MESSAGE DIFFERENCE THAT NO REAL MD5
      COLLISION CHARACTERISTIC HAS. The readable census has ZERO entries.
      Adjudicator correctness against a published characteristic remains UNTESTED
      and this contract does not approach it.
    - >-
      THE POWER PROFILE IS SCOPED TO THE DECLARED ABLATION SET, THE DECLARED
      FAMILIES AND ONE SEED SET. Depth >= 2 component subsets beyond the two
      declared multi-deletions are unmeasured, and variation across seed sets is
      unmeasured. "The suite detects the deletion of X" means "at these seeds,
      against these families, over this census".
    - >-
      THE INSTRUMENT IS NOT REPAIRED BY THIS CONTRACT. VD-3, VD-4, the {E4}/{E5}
      zero-image result, OBJ-3's unguarded step_start drop, OBJ-4's cross-primitive
      closest-entry loop and OBJ-10's missing well-formedness gate all stand open.
      Any record quoting the strict group as {E1,E3,E4,E5} must state alongside it
      that the group doing observable work on a membership decision is {E1,E3} plus
      one key-component deletion.
    - >-
      `closest_distance` IS A REPORTED DIAGNOSTIC, NOT A DECISION VARIABLE AND NOT
      A MARGIN, and may never be quoted as evidence about a null's difficulty.
    - >-
      ONE INDEPENDENT REVIEWER REVIEWS THIS PACKAGE, NOT TWO. GOAL-DIFFP-84d641
      completion criterion 4 requires both a Validator and a Red Team and is NOT
      satisfied by this contract's round. No record derived from it may state that
      criterion as met.
    - >-
      Nothing here bears on GOAL-MD5-001's blind-calibration criterion, on
      GOAL-SHA1-001's detector-coverage question, or on the security of any deployed
      system, repository, certificate or archive.

