experiment:
  id: EXP-DIFFP-4b165f
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL, AND EXPLICITLY NULL RATHER THAN ABSENT, for the same
    reason EXP-DIFFP-fe894e was. This contract MEASURES THE POWER OF AN
    INSTRUMENT'S CONTROL SUITE. It bears on no hypothesis about MD5 or SHA-1,
    and GOAL-DIFFP-84d641 still carries `active_hypothesis_ids: []`. Naming a
    hypothesis here would invite exactly the inference this contract cannot
    support -- that a control outcome on a 16-entry synthetic shadow census says
    something about a difference space. It says something about the CONTROLS and
    the KEY, and nothing else.
  version: 1
  title: >-
    DIFFP-POW-1 -- the null's power, measured: CTL-NULL family (d)
    `message_difference_perturbed` with a two-sided known answer, the ablation
    battery of EV-DIFFP-b878aa O-7 promoted to a charged standing control and
    extended to the complete depth-1 canonical-key lattice, the generator action
    profile that shows which generators do observable work, and the two-sided
    known-answer decoy set -- all against the FROZEN, UNMODIFIED BATCH-f8bf86
    adjudicator at census size zero
  status: approved
  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-efcae7
  question_id: RQ-DIFFP-a5c483
  frozen_by_task: TASK-20260824-b7efbf
  frozen_at: '2026-08-24'
  assigned_to: executor
  executor_task: TASK-20260824-9a489e
  prospective_amendments: []
  prospective_amendments_note: >-
    NONE. AMD-20260824-DIFFP-ACQ-1 (in_force, version 1) binds this contract as a
    STANDING restriction rather than as a new amendment: its OB-1 (the firewall
