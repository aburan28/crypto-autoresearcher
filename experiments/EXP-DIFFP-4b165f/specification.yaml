  approved_by: >-
    coordinator, TASK-20260824-b7efbf (the opening control plane of BATCH-efcae7).
    The approving decision BODY is carried verbatim in
    coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/batch.yaml under
    `opening_decision_body_pending_mint`. NO DEC IDENTIFIER WAS PRE-ALLOCATED FOR
    THIS BATCH'S OPENING and this Coordinator subagent has no shell, so it did not
    invent one: the driving session mints and files the opening decision with
    `python3 tools/allocate_id.py --next coordinator_decision --date 20260824
    --check`. DEC-20260824-c5bb72 IS RESERVED FOR THE BATCH CLOSE and must not be
    used here.
    UNTIL THAT OPENING DECISION FILE IS COMMITTED THIS CONTRACT IS FROZEN ON PAPER
    AND IS NOT DURABLE RESEARCH STATE (AGENTS.md, "Durable research commits"). The
    Executor may begin only against the committed contract at this path, and a
    message saying it is approved is a pointer and never the approval.

  objective: >-
    Replace an OUTCOME with a POWER. BATCH-f8bf86's control suite reported
    CTL-PLANT 96/96 and CTL-NULL 0 of 3000 and those integers are true; review
    then measured that an adjudicator whose canonical key CANNOT SEE THE MESSAGE
    DIFFERENCE AT ALL scores the identical pair to the digit, so the suite detects
    2 of 5 single-component key ablations and the two integers do not mean what a
    reader would take them to mean (EV-DIFFP-b878aa O-7, O-8; red-team-report J5
    part D, proves_too_much O5). That measurement was single-session review-side
    computation with no run directory, no RUN-* id, no manifest, no armed deadline
    and no seed envelope (EV-DIFFP-b878aa UC-2).
    THIS CONTRACT MAKES IT A CHARGED, REPLICABLE STANDING CONTROL, in this order:
    (1) CTL-FROZEN and CTL-REPRO -- prove that the instrument under measurement is
    byte-identical to the reviewed one and that it still produces the committed
    integers at the seven declared seeds, including E6's step_range (0,0)
    conditions_satisfied at 2089, the CORRECTED value of CORR-20260824-e0088c.
    (2) CTL-GEN-ACT -- the generator action profile: per generator, the orbit
    images it emits, whether its presence changes the serialised key, and whether
    it changes any verdict. This is the control that can SHOW that {E4} and {E5}
    emit no orbit image, that E5 can affect no membership verdict at all, and that
    the group doing observable work is {E1,E3} plus one key-component deletion.
    (3) CTL-TWOSIDED -- the two-sided known-answer decoy set, whose answers differ
    between strict and permissive on the SAME object, so that no degenerate
    adjudicator can pass.
    (4) CTL-NULL-D -- null family (d) `message_difference_perturbed`: a planted
    entry with k bits of its MESSAGE DIFFERENCE flipped (delta_m for MD5, the DV
    for SHA-1), step_delta and every other field held fixed, at k in
    {0,1,2,4,8,16}. Known answer MEMBER at k = 0 and NON-MEMBER at every k >= 1.
    EVERY REJECTION REPORTS WHICH KEY COMPONENT DECIDED IT, because a control
    whose rejections are decided by a component other than the one it perturbs has
    no power over the component it was built for -- which is precisely how 0/3000
    was over-read.
    (5) CTL-ABL -- the ablation battery: the identical strengthened suite run
    against adjudicators with one canonical-key component deleted. Rows 1-6 are
    EV-DIFFP-b878aa O-7's six declared rows, reproduced verbatim and reported
    first and separately, which is the replication DEC-20260824-af6d5c asked for.
    Rows 7-N extend to the COMPLETE DEPTH-1 SINGLE-DELETION LATTICE over the
    strict key, reported separately, which turns "2 of 5 over a hand-chosen
    five-element sample" into an exhaustive statement at that depth.
    THE DELIVERABLE IS A PER-COMPONENT POWER PROFILE, NOT A PASS. Reporting "the
    null passed" is a contract violation; reporting "the suite detects the
    deletion of X and does not detect the deletion of Y, at these seeds, over this
    declared ablation set" is the required form.
    NOTHING HERE REPAIRS THE INSTRUMENT, ACQUIRES ANY SOURCE, RUNS ANY SEARCH,
    CLAIMS ANY PATH IS NEW, OR CLAIMS ANY CRYPTANALYTIC IMPROVEMENT. A PASSING
    CONTROL IS NOT AN IMPROVEMENT.

  objective_budget_floor_note: >-
    templates/research-records.md sets budget floors of
    wall_clock_seconds_per_run >= 600 and maximum_memory_gb >= 8 and requires a
    contract below them to say why. BOTH ARE BELOW THE FLOOR HERE, deliberately
    and for the same measured reason EXP-DIFFP-fe894e gave. Per-run ceilings are
    120-300 s because the modelled compute is small and MEASURED rather than
    guessed: BATCH-f8bf86's six runs, which included 3000 null draws, 4096 draws
    per E6 step range, 1024 CTL-OBS objects and 2000 CTL-NEARBY codewords,
    consumed 80.748 s of wrapper-measured compute in total. This contract's
    dominant cost is CTL-ABL, which re-runs a suite of that shape once per ablation
    row; at nine rows that is under ten times a measurement that took well under
    30 s, so 300 s is a generous ceiling and not a plan. maximum_memory_gb is 4
    because the whole state is a few tens of thousands of 32-bit-word vectors and
    their canonical forms, peak far under 1 GB, and because max_concurrent is 2 on
    a 15 GB machine.
    THE CEILINGS EXIST SO THAT A HALT IS LEGIBLE, NOT BECAUSE THE WORK NEEDS THEM.
    A halt at any ceiling is a BUDGET OUTCOME, reported with achieved progress and
    the ceiling named, and is NEVER a negative mathematical result and never a
    finding about the difference space (AGENTS.md rule 5).

  # =====================================================================
  # INPUTS -- the frozen instrument, and the seeds
  # =====================================================================
  inputs:
    instrument_under_measurement:
      what: >-
        THE BATCH-f8bf86 ADJUDICATOR PACKAGE AS COMMITTED, UNMODIFIED. Every
        module under harness/diffpath/ plus harness/__init__.py and
        harness/runner.py are READ-ONLY INPUTS to this contract. This contract adds
        exactly two files (see required_artifacts) and edits none.
      why_it_is_an_input_and_not_a_deliverable: >-
        The object being measured is the instrument BATCH-f8bf86 delivered and
        BATCH-f8bf86's review attacked. If this batch edited it, every comparison
        with EV-DIFFP-b878aa's integers would be a comparison between two different
        objects, and the replication the closing decision asked for would not
        exist. Repairing the instrument is batch 3's work and is ranked second in
        DEC-20260824-af6d5c for a stated reason.
      binding_reference: >-
        The reviewed source is fixed at commit
        35c2159eee566f05c176e79ddfe7f1a2642d604e, at which TASK-20260824-c40847
        recomputed 34/34 snapshot binding digests and 148/148 manifest module
        digests against the tree. THAT SHA IS QUOTED FROM
        coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/reviews/TASK-20260824-c40847/validation-report.yaml
        AND FROM EV-DIFFP-b878aa O-3 AND IS NOT THIS SESSION'S MEASUREMENT -- this
        Coordinator has no shell. The Executor MUST recompute each module's sha256
        itself (CTL-FROZEN) and report any mismatch as an infrastructure finding
        rather than proceeding.
    key_components_of_the_strict_serialisation:
      what: >-
        Read from harness/diffpath/adjudicator.py `serialize()` as committed, and
        stated here so the ablation lattice is defined before any run rather than
        discovered from the code afterwards. Under the STRICT generator set
        {E1,E3,E4,E5} the serialised key is a tuple of (name, value) pairs whose
        names are: `primitive`, `length`, `message_difference`, `step_delta`,
        `block_index` (present because E6 is NOT in the strict set), and
        `in_linearized_code` (present for sha1 objects only). `signed_representation`
        is ABSENT because E4 IS in the strict set, and `step_start` is ABSENT
        because E1 is.
      this_is_a_hard_term: >-
        The Executor MUST derive the component-name list AT RUN TIME from the
        serialised key of a declared object rather than hard-coding this list, and
        MUST report the derived list beside this declared one. A disagreement
        between them is a STOP and an infrastructure finding: it means the
        committed instrument is not the instrument this contract was written
        against.
      provenance: >-
        QUOTED FROM COMMITTED SOURCE BY A SESSION WITH NO SHELL, and marked
        unverified in exactly the sense BR-6 of the batch record requires. The
        run-time derivation above is what makes it verified.
    census_and_planted_entries:
      what: >-
        The 16-entry synthetic SHADOW census of EXP-DIFFP-fe894e -- 8 MD5 and 8
        SHA-1 planted entries generated from seeds 84064101 and 84064102 -- rebuilt
        by the committed census builder at those seeds. THE READABLE CENSUS HAS
        ZERO ENTRIES and this contract does not change that: it acquires nothing,
        reads no quarantined byte, and populates no entry from recollection.
      honest_limit_carried_forward_verbatim: >-
        ALL 8 PLANTED MD5 ENTRIES CARRY A WEIGHT-1 MESSAGE DIFFERENCE, WHICH NO
        REAL MD5 COLLISION CHARACTERISTIC HAS (EV-DIFFP-b878aa boundaries). Every
        distance and every family-(d) perturbation in this contract inherits that.
        It is a hard limit on how far any figure here transfers, and every artifact
        of this contract must state it where its numbers are stated.
      the_quarantined_pointer: >-
        coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml
        is NOT READ (IR-1). It is 3103 bytes with sha256
        e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5
        (CORR-20260824-cc2d27; the byte count is the CORRECTED value, not the 5583
        that execution-report.yaml states). This contract does NOT re-hash it:
        CTL-QUAR discharged that in BATCH-f8bf86 and TASK-20260824-c40847 confirmed
        it independently from the bytes, and OBJ-9 raised for precedent that a byte
        count of a quarantined payload is a derived quantity beyond the authorised
        whole-file sha256. Not repeating the measurement is the conservative
        reading of that objection and costs this contract nothing.
    seeds:
      equivalence_generator_check: 20260824
      planted_path_generation_md5: 84064101
      planted_path_generation_sha1: 84064102
      null_draw_md5_delta_m: 84064103
      null_draw_sha1_dv_in_code: 84064104
      null_draw_sha1_dv_unconstrained: 84064105
      observation_collision_search: 84064106
      null_draw_message_difference_perturbed: 84064107
    seeds_note: >-
      EIGHT SEEDS. THE FIRST SEVEN ARE EXP-DIFFP-fe894e's, REUSED BYTE-IDENTICALLY
      AND NOT RE-DERIVED, which is what makes CTL-REPRO a comparison against
      committed integers rather than a fresh measurement.
      THE EIGHTH IS NEW IN THIS CONTRACT and it is declared as a departure rather
      than slipped in. DEC-20260824-af6d5c says family (d) "needs no new seeds",
      and a single deterministic perturbation per k would indeed need none -- but
      it would measure one point rather than a family, and a control with one draw
      per cell cannot report a rate. CTL-NULL-D therefore carries BOTH: a
      DETERMINISTIC canonical draw per (entry, k) that needs no seed at all and is
      reproducible by inspection, AND R = 64 seeded draws per (entry, k) from
      84064107. Both are reported separately. All eight seeds are fixed HERE,
      before any run, and are IMMUTABLE once this contract is frozen; generating
      any planted path, null draw or perturbation by a procedure or seed other than
      those declared invalidates the run (IR-3).

  # =====================================================================
  # THE ABLATION MECHANISM -- a hard term, declared before any run
  # =====================================================================
  ablation_mechanism:
    binding_status: >-
      A HARD TERM. How an ablation is CONSTRUCTED decides what the battery
      measures, and BATCH-f8bf86's battery was constructed by a mechanism that no
      longer exists as an artifact. This contract declares its mechanism in
      advance so that a disagreement with round 1 localises to the mechanism rather
      than being silently absorbed.
    definition: >-
      An ABLATED ADJUDICATOR is the SAME committed Adjudicator class, over the
      SAME committed census, whose SERIALISED KEY has one or more named (name,
      value) pairs REMOVED BY A DECLARED PROJECTION applied at run time. The
      projection takes the tuple returned by the committed `serialize()` and drops
      every pair whose name is in the ablation's declared drop-set, preserving the
      order of the remaining pairs. Nothing else changes: not the census, not the
      generator set, not `canonical()`'s minimisation over the orbit, not
      `orbit_images`, not the null draws, not the seeds.
    why_this_and_not_an_edit_to_serialize: >-
      Because IR-2 forbids editing any committed module, and because keeping the
      measured instrument byte-identical to the reviewed one is the whole point.
      The round-1 battery deleted a tuple element from `serialize()` directly; a
      projection that drops the same named pair from the same tuple is the same
      transformation of the same object, applied without mutating the source.
    the_cost_of_the_change_stated_rather_than_hidden: >-
      IT IS NOT AUTOMATICALLY IDENTICAL. `canonical()` minimises `serialize(v,
      gens)` over the orbit variants; projecting AFTER the minimisation and
      projecting BEFORE it can differ, because dropping a component can change
      which variant is the minimum. THE CONTRACT REQUIRES THE PROJECTION TO BE
      APPLIED INSIDE THE MINIMISATION -- i.e. the ablated canonical form is
      `min(project(serialize(v, gens)) for v in variants)` over the identical
      variant list -- which is exactly what an edit to `serialize()` would have
      produced. The Executor MUST report both forms for the six declared rows and
      state whether they differ; if they do, the inside-minimisation form is the
      contract's value and the difference is a reportable finding about the
      canonicaliser, not a defect to be tuned away.
    what_an_ablation_is_NOT: >-
      It is not a re-implementation of the adjudicator, not a change to the
      generator set (removing E4 is a GENERATOR change and is measured by
      CTL-GEN-ACT, not by CTL-ABL), not a change to the census, and not a change to
      any draw. An ablation that alters anything but the key's component set is
      out of contract and invalidates that row.

  # =====================================================================
  independent_variables:
    - >-
      k, the number of bits flipped in a planted entry's MESSAGE DIFFERENCE, over
      {0, 1, 2, 4, 8, 16}. k = 0 is the declared MEMBER arm.
    - >-
      The ABLATION DROP-SET: the set of canonical-key component names removed from
      the serialised key, over the declared row list of CTL-ABL.
    - >-
      The GENERATOR SET in force, over the singletons and declared subsets of
      CTL-GEN-ACT.
    - >-
      MODE: strict {E1,E3,E4,E5} versus permissive {E1..E6}. Reported as SEPARATE
      FIELDS and NEVER merged into one number (IR-4).

  # =====================================================================
  controls:
    - id: CTL-FROZEN
      what: >-
        THE INSTRUMENT UNDER MEASUREMENT IS THE INSTRUMENT THAT WAS REVIEWED.
        Before the first run and again AFTER the last run, recompute the sha256 of
        every file under harness/diffpath/, plus harness/__init__.py and
        harness/runner.py, and compare the two sets to each other and to the
        digests recorded in this task's own first manifest.
      criterion: >-
        Every digest identical before and after, and the file list identical. Any
        difference is a STOP and an INFRASTRUCTURE FINDING: it means this batch
        modified the object it was measuring, which invalidates every comparison
        with EV-DIFFP-b878aa.
      can_it_fail: >-
        YES, and cheaply -- an accidental import-time write, a stray formatter, or
        an editor touching a file would all trip it. This is the control that makes
        "we did not repair the instrument" a MEASUREMENT rather than an
        attestation.
    - id: CTL-REPRO
      what: >-
        BASELINE REPRODUCTION (KN-TECH-080 audit 1). Run the FROZEN BATCH-f8bf86
        equivalence checks and control suite unmodified at the seven inherited
        seeds and compare every integer against the committed values.
      pre_registered_comparison_values: >-
        CTL-PLANT 96/96; CTL-NULL 0 of 1000 per family in strict AND in permissive,
        for md5_delta_m, sha1_dv_in_code and sha1_dv_unconstrained; E1 704/0;
        E2 2048/248 with the 2048-0 expansion and 0-248 step-function split;
        E3 128/0; E4 4368/0 with its 4096/256/16 sub-counts; E5 256/0; E6 17/1;
        E6 step_range (0,3) conditions_satisfied 0 of 4096; E6 step_range (0,0)
        conditions_satisfied 2089 of 4096.
      the_2089_is_deliberate: >-
        2089 IS THE CORRECTED VALUE OF CORR-20260824-e0088c. execution-report.yaml
        states 2094 at lines 177, 184 and 623; equivalence-declaration.yaml line
        116, raw-observations.json line 873, the equivalence-verification run's
        raw-result.json line 124 and an independent cold re-run all give 2089.
        PRE-REGISTERING 2089 GIVES THAT CORRECTION ITS FIRST CONFIRMATION UNDER A
        CHARGED RUN. If the run produces 2094, the correction is wrong and that is
        a first-class finding to be reported, not reconciled.
      criterion: >-
        EXACT INTEGER AGREEMENT on every listed value. A disagreement is a STOP.
      can_it_fail: >-
        YES, and its failure is INFRASTRUCTURE SIGNAL, never a mathematical
        finding: it means the environment, the interpreter or a module differs from
        the one that produced the committed numbers, and the run stops and says
        which value disagreed and by how much.
      provenance_of_these_integers: >-
        ALL QUOTED FROM COMMITTED ARTIFACTS BY A SESSION WITH NO SHELL -- from
        EV-DIFFP-b878aa O-1 and O-2, from validation-report joint_J1, and from
        CORR-20260824-e0088c -- and attributed to the sessions that measured them.
        This Coordinator recomputed none of them and does not present them as its
        own measurement (batch record BR-6).
    - id: CTL-GEN-ACT
      what: >-
        THE GENERATOR ACTION PROFILE. For each generator g in {E1,E2,E3,E4,E5,E6}
        ALONE, and for the declared subsets {E4,E5} and the full strict set,
        measure over every planted entry of both primitives: (a) the number of
        ORBIT IMAGES `orbit_images` emits; (b) whether the SERIALISED KEY differs
        with g present versus absent, and if so which component names differ;
        (c) whether any ADJUDICATION VERDICT differs with g present versus absent,
        in strict and in permissive mode, over the union of the planted entries,
        their orbit images, the CTL-TWOSIDED decoys and a declared sample of null
        draws.
      criterion: >-
        REPORTED, NOT REQUIRED TO TAKE ANY PARTICULAR VALUE. This is a measurement,
        and both outcomes are informative. What IS required is that (a), (b) and
        (c) are reported SEPARATELY for every generator: a generator can emit no
        orbit image and still change the key (E4 does), or verify and do neither
        (E5 does).
      pre_registered_expectation: >-
        From EV-DIFFP-b878aa O-6 and validation-report joint_J3 part 3, quoted and
        not measured here: {E3} emits 1 image per object; {E1} emits 8 per sha1
        object and 0 per md5 object; {E4} emits 0; {E5} emits 0; {E4,E5} together
        emit 0; E5's `"E5" in gens` is read in exactly one place (adjudicator.py
        line 210) which selects the REPORTED condition signature and is unreachable
        from `serialize()` or `canonical()`, so E5 can affect NO membership verdict
        at all; and E4's only key effect is the REMOVAL of `signed_representation`,
        so it can loosen membership but never test it.
      why_this_control_exists: >-
        BECAUSE THE CLOSING DECISION REQUIRES THAT ANY CONTROL THIS BATCH SPECIFIES
        BE CAPABLE OF SHOWING THAT {E1,E3} IS THE GROUP DOING OBSERVABLE WORK. The
        {E4}/{E5} zero-image result is currently a review-side observation in a
        report; this makes it a charged, replicable measurement with a manifest and
        a seed, so that batch 3's repair has a baseline to regress against. IT DOES
        NOT REPAIR ANYTHING: E4 and E5 remain in the declared strict group exactly
        as EXP-DIFFP-fe894e froze them.
      what_it_does_not_do: >-
        It does not re-run the E1..E6 VERIFICATION checks to re-decide VERIFIED or
        EXCLUDED -- CTL-REPRO reproduces those integers and the verdicts stand as
        frozen. CTL-GEN-ACT measures ACTION, not verification status, and the two
        are exactly what round 1 conflated: P-2 of that round treated "VERIFIED" as
        though it meant "does work in the equivalence", and it does not.
    - id: CTL-TWOSIDED
      what: >-
        THE TWO-SIDED KNOWN-ANSWER DECOY SET. Objects whose known answer DIFFERS
        between strict and permissive mode, or between two declared generator sets,
        on the SAME object -- so that neither a degenerate always-reject nor a
        degenerate always-accept adjudicator can pass.
      objects_and_their_pre_registered_answers:
        - id: T1
          object: E2-rotation images of PLANT-SHA1-00 at b in {1,7,16,31}
          known_answer: strict NON-MEMBER on all four AND permissive MEMBER on all four
          source_of_the_expectation: EV-DIFFP-b878aa O-10 (red-team decoy D1)
        - id: T2
          object: E6-reindexed images at block index 3, both primitives
          known_answer: strict NON-MEMBER and permissive MEMBER, on both primitives
          source_of_the_expectation: EV-DIFFP-b878aa O-10 (red-team decoy D2)
        - id: T3
          object: >-
            an object differing from a planted entry ONLY in
            `signed_representation`
          known_answer: >-
            MEMBER with E4 in the strict group, NON-MEMBER with E4 removed from it
          source_of_the_expectation: EV-DIFFP-b878aa O-10 (red-team decoy D4)
        - id: T4
          object: >-
            a SHA-0 codeword presented as a SHA-1 DV, adjudicated in both modes AND
            again with `in_linearized_code` forced True
          known_answer: >-
            NON-MEMBER in both modes, and STILL NON-MEMBER at the same distance
            with the flag forced True -- i.e. OVER-DETERMINED: the DV content
            separates it independently of the flag
          source_of_the_expectation: EV-DIFFP-b878aa O-10 (red-team object O1)
        - id: T5
          object: >-
            the unperturbed planted entries themselves, all 16, in strict mode
          known_answer: MEMBER, all 16
          why_it_is_here: >-
            THE CHEAPEST POSSIBLE POSITIVE ARM, stated explicitly so that the
            two-sidedness of this control set does not rest on the subtler decoys
            alone. An always-reject adjudicator fails here on its first object.
      criterion: >-
        Every pre-registered answer met, on BOTH sides. A miss is a STOP and is a
        first-class finding about the instrument, reported with the object named
        and its two verdicts.
      why_it_is_not_redundant_with_CTL-REPRO: >-
        CTL-REPRO reproduces AGGREGATE counts. A degenerate adjudicator can
        reproduce an aggregate; it cannot produce two DIFFERENT answers for the
        same object under two generator sets. This is the strongest structural
        property the instrument has and it is measured here directly.
    - id: CTL-NULL-D
      what: >-
        NULL FAMILY (d), `message_difference_perturbed`, AND THE REASON THIS BATCH
        EXISTS. Take a planted census entry; flip k bits of its MESSAGE DIFFERENCE
        (the `delta_m` word vector for MD5, the `dv` word vector for SHA-1); hold
        `step_delta` and EVERY other field fixed; adjudicate against a census that
        CONTAINS that entry. k in {0,1,2,4,8,16}. For each (entry, k) with k >= 1:
        one DETERMINISTIC canonical draw (the k lowest-indexed bit positions of the
        message-difference bit vector in declared index order, requiring no seed)
        plus R = 64 seeded draws from 84064107 with the k flipped positions chosen
        uniformly without replacement.
      criterion: >-
        k = 0 returns MEMBER in strict mode on every planted entry (16/16).
        k >= 1 returns NON-MEMBER in strict mode on every draw. Counts reported as
        integer fractions per (primitive, k), strict and permissive SEPARATELY, for
        the deterministic and the seeded draws SEPARATELY.
      hard_term_H_3_component_attribution: >-
        THE SINGLE MOST IMPORTANT REQUIREMENT IN THIS CONTRACT. For EVERY k >= 1
        draw that returns NON-MEMBER, report the SET OF CANONICAL-KEY COMPONENT
        NAMES on which the draw's canonical form differs from that of its own
        source census entry -- the components that COULD have decided it -- and
        report the aggregate distribution of those sets per (primitive, k).
        A control whose rejections are all decided by a component OTHER than the
        one it perturbs has ZERO POWER over the component it was built for, and
        that is exactly how CTL-NULL's 0/3000 was over-read: family (a)'s draws
        were separated by `step_delta` alone, so no declared draw ever tested
        whether the message difference was in the key. REPORTING "NON-MEMBER" WITHOUT
        THE ATTRIBUTION IS A CONTRACT VIOLATION, not a partial result.
      sub_arm_D_SHA1_INCODE:
        what: >-
          For SHA-1 only, a SECOND perturbation family that stays IN THE LINEARIZED
          CODE: perturb the DV by adding a nonzero codeword of the linearized
          expansion code (so that the honestly recomputed `in_linearized_code`
          remains True), with the perturbation's Hamming weight reported, and with
          `step_delta` and every other field held fixed.
        why_it_exists: >-
          Because the primary arm's SHA-1 rejections at large k are PREDICTED to be
          decided by `in_linearized_code` rather than by the message difference:
          flipping 8 or 16 bits of a DV almost certainly leaves the code, the flag
          honestly recomputes to False, and the flag -- which IS in the strict key
          for sha1 -- separates the draw. If that happens, the primary arm measures
          the flag, not the message difference. THIS SUB-ARM ISOLATES THEM. It is
          an addition to the goal head's wording and is declared as such.
        criterion: >-
          Same as the primary arm: NON-MEMBER at every perturbation, with component
          attribution. If no such codeword perturbation can be constructed within
          the run's ceiling, THAT IS REPORTED AS AN UNMET SUB-ARM WITH ITS REASON
          and the primary arm's SHA-1 power is reported as attributable to whatever
          the attribution vectors show -- never as power over the message
          difference by default.
      sub_arm_D_VD3_PROFILE:
        what: >-
          The SAME k-bit message-difference perturbation applied to SHA-1 E1-SHIFT
          IMAGES (step_start in 1..8) rather than to planted entries at step_start
          0, adjudicated in strict mode and reported SEPARATELY from the primary
          arm.
        pre_registered_expectation: >-
          MEMBER, i.e. the perturbation is ERASED -- because `EQ.align_E1` discards
          the declared dv and recomputes it from `dv_seed_window` whenever
          step_start > 0, so for 64 of CTL-PLANT's 96 attempts the strict key does
          not read the candidate's own declared DV (EV-DIFFP-b878aa O-5, VD-3).
        what_it_is_and_is_not: >-
          IT IS A MEASUREMENT OF A KNOWN DEFECT, NOT A REPAIR AND NOT A KNOWN
          CORRECT ANSWER. The expected MEMBER verdict is the instrument's measured
          behaviour, and this arm turns a review-side finding into a charged
          regression baseline for batch 3's fix. It is REPORTED SEPARATELY and is
          NEVER counted into family (d)'s pass/fail, because family (d)'s known
          answer is NON-MEMBER at k >= 1 and this arm is expected to violate it for
          a mechanism that has nothing to do with the null's power.
      why_this_family_and_not_another: >-
        Because the Red Team measured that the declared null's false-positive
        probability FACTORS: family (a) reaches a planted message difference with
        probability 1/64 per draw and did so 6 times in 1000, and then dies on the
        64-word step_delta. The factorisation names for free where a stronger null
        must aim -- HOLD THE REACHABLE FACTOR FIXED AND PERTURB THE UNREACHABLE
        ONE. Family (d) is precisely that construction, and its k = 1 draw is the
        red team's D3b, on which the honest adjudicator returns NON-MEMBER and the
        delta_m-blind one returns MEMBER (both measured).
    - id: CTL-ABL
      what: >-
        THE ABLATION BATTERY AS A STANDING CONTROL. Run the IDENTICAL suite --
        CTL-PLANT recall over its 96 attempts, CTL-NULL over its 3000 declared
        draws in three families, and CTL-NULL-D's primary arm -- against each
        ablated adjudicator defined by the declared drop-sets, at the declared
        seeds, under the mechanism fixed in `ablation_mechanism`.
      rows_group_1_the_replication:
        binding_status: >-
          THE SIX DECLARED ROWS OF EV-DIFFP-b878aa O-7, REPRODUCED VERBATIM AND
          REPORTED FIRST AND SEPARATELY. This group IS the replication
          DEC-20260824-af6d5c named as its one next action, and it is never
          conflated with group 2.
        rows:
          - {row: 1, drop_set: [], label: 'HONEST (unmodified)', pre_registered_CTL_PLANT: '96/96', pre_registered_CTL_NULL_strict_of_3000: 0, pre_registered_detected: 'n/a'}
          - {row: 2, drop_set: [message_difference], pre_registered_CTL_PLANT: '96/96', pre_registered_CTL_NULL_strict_of_3000: 0, pre_registered_detected: 'NO'}
          - {row: 3, drop_set: [step_delta], pre_registered_CTL_PLANT: '96/96', pre_registered_CTL_NULL_strict_of_3000: 6, pre_registered_detected: 'YES'}
          - {row: 4, drop_set: [in_linearized_code], pre_registered_CTL_PLANT: '96/96', pre_registered_CTL_NULL_strict_of_3000: 0, pre_registered_detected: 'NO'}
          - {row: 5, drop_set: [message_difference, in_linearized_code], pre_registered_CTL_PLANT: '96/96', pre_registered_CTL_NULL_strict_of_3000: 0, pre_registered_detected: 'NO'}
          - {row: 6, drop_set: 'everything except primitive and length', pre_registered_CTL_PLANT: '96/96', pre_registered_CTL_NULL_strict_of_3000: 3000, pre_registered_detected: 'YES'}
        provenance_of_the_pre_registered_values: >-
          READ FROM red-team-report joint J5 part D AND FROM EV-DIFFP-b878aa O-7 BY
          A SESSION WITH NO SHELL, and attributed to TASK-20260824-3bd362 which
          measured them. They are pre-registered COMPARISON TARGETS, not this
          Coordinator's measurements.
        the_declared_summary_of_this_group: >-
          "THE DECLARED BATCH-f8bf86 CONTROL SUITE DETECTS 2 OF THE 5 KEY-COMPONENT
          ABLATIONS TESTED." Reproducing that sentence under run discipline, or
          failing to, is this group's whole job.
      rows_group_2_the_complete_depth_1_lattice:
        binding_status: >-
          AN EXTENSION, DECLARED AS AN EXTENSION, REPORTED SEPARATELY, AND NEVER
          MERGED INTO GROUP 1's FRACTION.
        definition: >-
          One row per SINGLE component name in the run-time-derived strict key
          component list -- expected to be `primitive`, `length`,
          `message_difference`, `step_delta`, `block_index`, `in_linearized_code`,
          i.e. six rows, of which three already appear in group 1 and are re-run
          identically so the two groups are comparable.
        why: >-
          EV-DIFFP-b878aa's own obstruction states that "2 of 5" is A POINT ESTIMATE
          OVER A HAND-CHOSEN FIVE-ELEMENT SAMPLE, not a rate with a confidence
          interval, and that the variability that would matter is ACROSS SEEDS AND
          ACROSS ABLATION CHOICES. Exhausting depth 1 removes the ablation-choice
          variability AT THAT DEPTH ENTIRELY, and replaces a fraction over a sample
          with a per-component profile over a complete set.
        what_it_still_does_not_cover: >-
          DEPTH >= 2 SUBSETS beyond the two declared multi-deletions, and VARIATION
          ACROSS SEED SETS. Both remain unmeasured and must be stated as such
          wherever this batch's numbers are quoted. Naming them is not a promise to
          measure them.
      hard_term_H_6_the_report_form: >-
        THE RESULT IS A PER-COMPONENT POWER PROFILE, NOT A FRACTION AND NOT A PASS.
        For every row, report: the drop-set; CTL-PLANT recall as an integer
        fraction; CTL-NULL false positives as integer counts per family in strict
        and permissive; CTL-NULL-D counts per (primitive, k); and, per row, an
        explicit DETECTED / NOT DETECTED verdict SEPARATELY for (i) the OLD suite
        (CTL-PLANT + CTL-NULL families a,b,c) and (ii) the STRENGTHENED suite (old
        + CTL-NULL-D). Reporting a single "k of n" without the per-component table
        is a contract violation. Where a component is NOT probed by any declared
        family, say so by name rather than reporting NOT DETECTED as though the
        suite had looked.
      criterion: >-
        REPORTED, NOT REQUIRED TO TAKE ANY PARTICULAR VALUE. Both outcomes are
        results: a suite that detects everything at depth 1 is a strong instrument
        finding, and a suite that still misses components is the honest state of
        the instrument. What IS required is that the strengthened suite's verdict
        on row 2 (`message_difference` deleted) is reported explicitly, because that
        is the row the whole batch was designed around.
    - id: CTL-QUAR-ATTEST
      what: >-
        QUARANTINE NON-READING ATTESTATION, BY CODE AND NOT BY PROSE. The execution
        report carries an explicit statement that no task read, parsed, extracted or
        reconstructed any part of
        coordination/goals/GOAL-MD5-001/quarantine/**, that no network call of any
        kind was made, and that the quarantine prefix was never opened. The
        attestation names the mechanism (the prefix is not referenced by any code
        path of the new module) rather than asserting good intent.
      note: >-
        NO RE-HASH THIS BATCH. CTL-QUAR discharged that in BATCH-f8bf86 and the
        Validator independently confirmed the digest from the bytes; OBJ-9 raised
        for precedent that a byte count of a quarantined payload is a derived
        quantity beyond the authorised whole-file sha256. Not repeating a
        measurement of a quarantined object is the conservative reading and costs
        this contract nothing.

  # =====================================================================
  metrics:
    primary:
      - >-
        PER ABLATION ROW, the DETECTED / NOT DETECTED verdict of (i) the OLD suite
        and (ii) the STRENGTHENED suite, with the integer counts each verdict is
        read from. THIS IS THE HEADLINE AND IT IS A TABLE, NOT A NUMBER.
      - >-
        CTL-NULL-D counts as integer fractions per (primitive, k, mode), for the
        deterministic and the seeded draws separately, and for the primary arm,
        the D-SHA1-INCODE sub-arm and the D-VD3-PROFILE sub-arm separately.
      - >-
        THE COMPONENT-ATTRIBUTION DISTRIBUTION for every k >= 1 rejection: which
        canonical-key component names differ from the source entry, aggregated per
        (primitive, k). A rejection with no attribution reported is not a
        measurement.
      - >-
        CTL-GEN-ACT per generator: orbit images emitted per object per primitive;
        the set of key component names that change with the generator present
        versus absent; and the number of verdicts that change, in each mode.
      - >-
        CTL-TWOSIDED: for each of T1..T5, the strict verdict AND the permissive
        verdict (or the two generator-set verdicts for T3), against the
        pre-registered pair.
      - >-
        CTL-REPRO: the number of pre-registered comparison values that agree
        exactly, as an integer fraction, with every disagreement listed by name
        with both values.
      - >-
        CTL-FROZEN: the number of harness files whose sha256 is identical before
        and after the run set, as an integer fraction, with any difference named.
    secondary:
      - wrapper-measured wall-clock seconds and peak memory per run
      - >-
        code_path_fingerprint per run: fully qualified names of the projection, the
        canonicalisation and the membership functions invoked, plus the generator
        set and the drop-set actually in force
      - >-
        the inside-minimisation versus outside-minimisation projection comparison
        for the six declared rows (`ablation_mechanism`)
      - >-
        the run-time-derived strict key component-name list, beside the declared
        one in inputs
      - >-
        search_knowledge query strings and outcomes, recorded verbatim, for every
        assertion about what has or has not been tried

  heuristic_under_test: null
  heuristic_under_test_note: >-
    This contract tests no heuristic and carries no conditional claim. Every
    quantity it measures is produced by direct deterministic computation at
    declared seeds, and every criterion has a finite pass/fail outcome. If a later
    batch needs an unprovable uniformity premise over the difference space, it is
    numbered as a heuristic then, in its own hypothesis, with its own validation
    experiment (docs/claims-and-verification.md, "Heuristic-conditional claims").

  preregistered_prediction:
    quantity: >-
      The number of canonical-key single-component deletions that the STRENGTHENED
      suite (CTL-PLANT + CTL-NULL families a,b,c + CTL-NULL-D) detects, per
      component, over the complete depth-1 lattice.
    formula: >-
      DETECTED for `message_difference`, `step_delta`, `primitive`, `length` and
      `block_index`; NOT DETECTED for `in_linearized_code`. Equivalently: the
      strengthened suite detects the message_difference deletion that the old suite
      did not (this is the batch's designed effect), and still does not detect the
      in_linearized_code deletion, because NO DECLARED FAMILY PERTURBS THE FLAG ON
      AN OTHERWISE-MATCHING OBJECT.
    source: >-
      Not a theorem -- a mechanism, stated as a checkable argument and recorded
      before the run. Membership is EXACT canonical-key equality (a dict lookup,
      not a threshold), so the acceptance region is a single point in every
      retained component and unbounded in every dropped one. A control detects the
      deletion of component X if and only if it contains a draw that agrees with a
      census entry on every retained component and differs on X. Family (d)
      constructs exactly such a draw for `message_difference` and for no other
      component; families (a), (b) and (c) construct one only for `step_delta`
      (EV-DIFFP-b878aa O-7, O-8 and the `obstruction` mechanism).
    the_prediction_this_contract_trusts_least: >-
      THAT THE SHA-1 ARM OF FAMILY (d) PROBES THE MESSAGE DIFFERENCE AT ALL AT
      LARGE k. Flipping 8 or 16 bits of a DV almost certainly leaves the linearized
      code, so `in_linearized_code` honestly recomputes to False and the draw is
      separated by the FLAG. If the attribution vectors show that, the SHA-1 arm's
      power belongs to the flag and not to the message difference, and the honest
      headline changes accordingly. This is why H-3 and D-SHA1-INCODE exist, and it
      is recorded HERE, before the run, so that a confirming outcome cannot be
      claimed as a designed success and a refuting one cannot be absorbed.

  scale_relevance:
    tier: toy
    justification: >-
      `toy` is this program's smallest descriptive scale label and the mapping is
      stated rather than assumed, exactly as EV-DIFFP-b878aa did.
      docs/claims-and-verification.md derives the tier from field bit size, which
      has no meaning for a differential-path adjudicator. THE TESTED SCALE THIS
      LABEL STANDS FOR IS: 16 synthetic planted shadow-census entries (8 MD5, 8
      SHA-1); 0 readable census entries; 3000 inherited null draws over three
      families; up to 16 x 5 x (1 + 64) = 5200 family-(d) draws per adjudicator;
      and up to 9 ablation rows. ALL SYNTHETIC, ALL GENERATED FROM DECLARED SEEDS
      UNDER THIS PROGRAM'S CONTROL. NOTHING AT CRYPTOGRAPHIC SCALE IS TESTED, no
      published characteristic enters any measurement, and no figure here transfers
      to one.
    correspondence: null
    correspondence_note: >-
      NULL, AND THAT IS THE HONEST VALUE. No sampling correspondence stands in for
      anything: the planted entries are not samples from the space of real
      differential characteristics, and the contract makes no claim that they are.
      All 8 planted MD5 entries carry a WEIGHT-1 message difference, which no real
      MD5 collision characteristic has.

  tail_checks:
    - >-
      Report the CLOSEST NON-MATCHING family-(d) draw per (primitive, k) with its
      distance -- AND LABEL IT, IN THE SAME SENTENCE, AS A REPORTED DIAGNOSTIC,
      NOT A DECISION VARIABLE AND NOT A MARGIN. EV-DIFFP-b878aa O-9 measured that
      `closest_distance` neither bounds nor tracks the verdict in either direction:
      an object at bit distance 0 adjudicates NON-MEMBER and an object at bit
      distance 1277 adjudicates MEMBER under permissive. Quoting a distance as
      evidence about a null's difficulty is forbidden by
      DEC-20260824-af6d5c successor_gates.
    - >-
      Report the DISTRIBUTION of component-attribution sets, not only its mode: a
      family whose rejections are decided by the perturbed component in 90% of
      draws and by another component in 10% is a different instrument from one that
      is at 100%, and the difference is invisible in a count of rejections.
    - >-
      Report, for the six declared rows, whether the inside-minimisation and
      outside-minimisation projections give the same counts. A silent choice
      between them would be an undeclared design decision in a load-bearing
      quantity, which is exactly the defect O-14 named in the round-1 orbit sizes.

  replication:
    seeds: [20260824, 84064101, 84064102, 84064103, 84064104, 84064105, 84064106, 84064107]
    independent_instances: 1
    independent_instances_note: >-
      ONE INSTANCE PER CHECK, AND THE REPLICATION THAT MATTERS IS ACROSS BATCHES
      RATHER THAN WITHIN THIS ONE. CTL-REPRO and CTL-ABL group 1 ARE the
      replication of BATCH-f8bf86's numbers, which is what DEC-20260824-af6d5c
      asked for; the checks are deterministic given the seeds, so the reviewer's
      replication is a cold re-run to exact integer agreement rather than a
      statistical comparison. REPLICATION AT A SECOND SEED SET IS AN EXPLICIT OPEN
      DIRECTION AND IS NOT PART OF THIS CONTRACT; its absence is a stated limit and
      not an oversight, and it is precisely the axis EV-DIFFP-b878aa's obstruction
      named as unmeasured.

  # =====================================================================
  run_plan:
    - run: 1
      suffix: frozen-and-repro
      contents: CTL-FROZEN (pre-run digests) and CTL-REPRO
      ceiling_seconds: 180
      gate_condition: none -- runs first
    - run: 2
      suffix: generator-action
      contents: CTL-GEN-ACT and CTL-TWOSIDED
      ceiling_seconds: 120
      gate_condition: RUNS ONLY IF run 1's CTL-REPRO agreed exactly on every pre-registered value.
    - run: 3
      suffix: null-family-d
      contents: >-
        CTL-NULL-D against the HONEST adjudicator only -- primary arm, the
        D-SHA1-INCODE sub-arm and the D-VD3-PROFILE sub-arm, with component
        attribution
      ceiling_seconds: 240
      gate_condition: RUNS ONLY IF run 1 passed.
    - run: 4
      suffix: ablation-battery-declared-rows
      contents: CTL-ABL rows group 1 -- the six declared rows of EV-DIFFP-b878aa O-7
      ceiling_seconds: 300
      gate_condition: >-
        RUNS ONLY IF runs 1 and 3 completed. If run 3's honest-adjudicator family
        (d) did not meet its known answer, THIS RUN STILL EXECUTES -- the battery's
        value does not depend on family (d) passing -- but its strengthened-suite
        column is reported as NOT INTERPRETABLE with the reason named.
    - run: 5
      suffix: ablation-lattice-and-frozen-recheck
      contents: >-
        CTL-ABL rows group 2 -- the complete depth-1 single-deletion lattice -- and
        CTL-FROZEN's post-run digest re-verification
      ceiling_seconds: 300
      gate_condition: >-
        RUNS ONLY IF run 4 completed. IF THE TASK BUDGET BINDS BEFORE THIS RUN, IT
        IS OMITTED AND THE OMISSION IS REPORTED AS A BUDGET OUTCOME WITH THE
        CEILING NAMED -- never as a finding, and never by silently folding group 2
        into group 1. CTL-FROZEN's post-run re-verification is then executed as
        part of run 4's teardown and reported there, because it is not optional.
  run_plan_arithmetic: >-
    180 + 120 + 240 + 300 + 300 = 1140 s of per-run ceilings against a 1200 s task
    budget. THESE ARE CEILINGS, NOT A PLAN: the modelled compute of all five runs
    together is well under 200 s, benchmarked against BATCH-f8bf86's MEASURED
    80.748 s for a comparable six-run suite. The task budget must also cover
    writing one module and one test file against an existing frozen package. If
    every ceiling were consumed the task would halt truthfully at its own budget
    with the ceiling named, which is the intended legible failure.

  budget:
    wall_clock_seconds_per_run: 300
    wall_clock_seconds_per_run_note: >-
      300 s is the MAXIMUM any single run may take; per-run ceilings are set
      individually in run_plan (180, 120, 240, 300, 300). See
      objective_budget_floor_note for why these are below the template's 600 s
      floor.
    total_cpu_hours: 0.35
    maximum_memory_gb: 4
    maximum_runs: 6
    maximum_runs_definition: >-
      DEFINED EXPLICITLY, CLOSING THE ROUND-1 AMBIGUITY THAT TWO REVIEWERS READ
      TWO DIFFERENT WAYS AND THAT DEC-20260824-af6d5c
      `budget_adjudication.red_team_run_count` ruled on. `maximum_runs` COUNTS
      CHARGED EXPERIMENT RUNS UNDER THIS CONTRACT -- a run directory, a RUN-*
      identifier, a manifest, an armed deadline and a consumed ceiling. It does
      NOT count script executions, read-only probes, unit-test invocations, or any
      computation that creates no run directory. FIVE RUNS ARE PLANNED; THE SIXTH
      IS RESERVE FOR EXACTLY ONE RE-ATTEMPT AFTER AN INFRASTRUCTURE ABORT and may
      never be used for a second measurement at different parameters, which would
      be a protocol amendment.
    maximum_workers: 1

  # =====================================================================
  stopping_rules:
    - >-
      Every run is charged through harness.runner.run_wrapped with an explicit
      deadline on the monotonic clock. A DEADLINE HIT IS A BUDGET OUTCOME, reported
      with achieved progress and the ceiling named, and is NEVER a negative
      mathematical result and never a finding about the difference space or about
      the null's power (AGENTS.md rule 5).
    - >-
      IF CTL-FROZEN's PRE-RUN AND POST-RUN DIGEST SETS DIFFER, or differ from the
      first manifest's record, the Executor STOPS, names the file, and reports it
      as an infrastructure finding. Every measurement in the affected runs is
      reported as UNINTERPRETABLE rather than as a result.
    - >-
      IF CTL-REPRO DISAGREES on any pre-registered value, the Executor STOPS after
      run 1, reports which value disagreed with both numbers side by side, and does
      NOT proceed to measure control power against an instrument that is not the
      one that was reviewed. This is infrastructure signal.
    - >-
      IF CTL-TWOSIDED MISSES a pre-registered answer, the Executor REPORTS IT AND
      CONTINUES, because a two-sided miss is a first-class finding about the
      instrument and the remaining controls still measure what they measure. It is
      recorded with the object named and both verdicts, and it is carried into the
      execution report's headline.
    - >-
      IF FAMILY (d) RETURNS MEMBER ON ANY k >= 1 DRAW against the HONEST
      adjudicator, the Executor REPORTS THE DRAW IN FULL -- the entry, k, the
      flipped positions, both canonical forms and the component attribution -- and
      CONTINUES. That draw is a counterexample object and is a required artifact;
      it is NOT repaired, and no perturbation rule is changed after seeing it.
    - >-
      DO NOT REPAIR ANY CONTROL IN-RUN AFTER SEEING ITS DATA. Changing k, R, the
      perturbation rule, a drop-set, a seed or a criterion after observing an
      outcome requires a versioned protocol_amendment and is not the Executor's to
      make.
    - >-
      Implementation of the new module is budgeted inside the task's 1200 s and is
      engineering time, not a scored run. Total TASK-20260824-9a489e wall clock may
      not exceed 1200 s; if it does, SAY SO EXPLICITLY AND MEASURE IT, as
      TASK-20260824-c6625a correctly did in its PD-1.

  # =====================================================================
  invalidation_rules:
    - id: IR-1
      text: >-
        ANY READ, PARSE, EXTRACTION OR RECONSTRUCTION OF
        coordination/goals/GOAL-MD5-001/quarantine/** -- OR OF THE SAME CONTENT BY
        ANY OTHER ROUTE -- invalidates the entire run regardless of outcome, and is
        additionally a cross-goal contamination finding reported to GOAL-MD5-001.
        AMD-20260824-DIFFP-ACQ-1 OB-1 is binding: BCP-1 QUARANTINES CONTENT, NOT A
        FILE PATH, so fetching eprint 2004/199, reading a mirror, pulling a
        repository that embeds the path table, or reproducing the path from a
        model's own memory into a file contaminates GOAL-MD5-001's
        blind-rediscovery criterion exactly as completely as opening the file.
        Unlike EXP-DIFFP-fe894e, this contract does NOT re-hash the payload: it
        does not touch it at all.
    - id: IR-2
      text: >-
        ANY MODIFICATION OF ANY COMMITTED FILE UNDER harness/ -- including every
        module under harness/diffpath/, harness/__init__.py and harness/runner.py --
        invalidates the entire run. The instrument is an INPUT to this contract and
        is measured, not repaired. Only the two new files named in
        required_artifacts may be written, and tests/test_harness.py and
        tests/test_diffpath_adjudicator.py are explicitly out of scope. CTL-FROZEN
        is the measurement of this rule and its failure is a STOP.
    - id: IR-3
      text: >-
        Any planted path, null draw, perturbation or ablation generated by a
        procedure or seed other than the exact deterministic ones frozen in
        inputs.seeds and in the control definitions. THE EIGHT SEEDS ARE IMMUTABLE
        once this contract is frozen.
    - id: IR-4
      text: >-
        A STRICT AND A PERMISSIVE VERDICT MERGED INTO A SINGLE REPORTED NUMBER, or
        an ablation row's counts reported without naming its drop-set. Inherited
        unchanged from EXP-DIFFP-fe894e IR-5 and extended to the ablation rows.
    - id: IR-5
      text: >-
        ANY SEARCH OVER THE DIFFERENCE SPACE, any attempt at a collision, any
        conforming-pair construction beyond the declared planted entries, or any
        cost projection toward an attack complexity. This contract measures an
        instrument's controls; it does not use the instrument to look for anything.
    - id: IR-6
      text: >-
        ANY NETWORK ACQUISITION BY THIS TASK, BY ANY ROUTE, INVALIDATES THE RUN.
        The Executor holds run_commands and deliberately NOT web_search under
        orchestration/roles.yaml, so fetching via the shell would route around a
        declared role boundary (AMD-20260824-DIFFP-ACQ-1 OB-5). No source is
        acquired by this batch at any tier. A source that would be needed goes on
        the acquisition-gap list that BATCH-f8bf86 already produced; it is not
        fetched here.
    - id: IR-7
      text: >-
        A run manifest lacking code_path_fingerprint or an armed deadline, or
        naming an experiment id other than the LITERAL string EXP-DIFFP-4b165f at
        both run.experiment_id and run.inputs.parameters.experiment_id. Inherited
        from EXP-DIFFP-fe894e IR-7, which closed the producer-chosen-id drift
        recorded at DEC-20260822-d7c2d0 F-8.
    - id: IR-8
      text: >-
        AN ABLATION THAT ALTERS ANYTHING BUT THE KEY'S COMPONENT SET -- a changed
        census, a changed generator set, a changed draw, a re-implemented
        adjudicator, or a projection applied outside the orbit minimisation without
        the inside-minimisation value also being reported. That row is out of
        contract and its counts are not evidence about control power.
    - id: IR-9
      text: >-
        ANY WORK THAT IS SOLVER VALIDATION rather than adjudication-instrument
        measurement. If the Executor finds itself measuring whether a
        characteristic-search solver works, it STOPS and reports the observation for
        handoff to GOAL-MD5-001 (GOAL-DIFFP-84d641 non_duplication). Measuring THIS
        goal's own adjudicator is this goal's work and triggers no handoff.
    - id: IR-10
      text: >-
        REPORTING "THE NULL PASSED", OR ANY SINGLE PASS/FAIL SUMMARY OF THE CONTROL
        SUITE, IN PLACE OF THE PER-COMPONENT POWER PROFILE; or reporting any k >= 1
        family-(d) rejection without its component attribution. This is the one
        invalidation rule that is about the SHAPE OF THE REPORT rather than about
        the computation, and it is here because the shape of the report is exactly
        what BATCH-f8bf86 got wrong: 96/96 and 0/3000 are true integers that do not
        mean what a reader would take them to mean.
    - id: IR-11
      text: >-
        ANY CENSUS ENTRY POPULATED FROM RECOLLECTION, or any claim that a
        perturbed, ablated or planted object corresponds to a published
        characteristic. Every object in this contract is SYNTHETIC and generated
        from declared seeds, and nothing here is a statement about the literature.

  # =====================================================================
  success_criterion: >-
    SC-1 (THE INSTRUMENT IS THE ONE THAT WAS REVIEWED). CTL-FROZEN reports
    identical digests before and after, and CTL-REPRO agrees exactly on every
    pre-registered comparison value, INCLUDING 2089.
    SC-2 (THE FAMILY IS TWO-SIDED AND ITS POWER IS ATTRIBUTED). CTL-NULL-D reports
    MEMBER on all 16 k = 0 arms and its k >= 1 counts as integer fractions per
    (primitive, k, mode), WITH the component-attribution distribution for every
    rejection, and with the D-SHA1-INCODE and D-VD3-PROFILE sub-arms reported
    separately. A FAILURE OF THE KNOWN ANSWER, HONESTLY REPORTED WITH THE DRAW AND
    ITS ATTRIBUTION, ALSO SATISFIES THIS CRITERION: it is a complete and admissible
    outcome and a finding about the adjudicator.
    SC-3 (THE BATTERY IS A MEASUREMENT). CTL-ABL group 1 reports all six declared
    rows against their pre-registered values, with agreements and disagreements
    both listed; group 2 reports the complete depth-1 lattice or states which rows
    were not reached and why. The per-component DETECTED / NOT DETECTED table
    exists for BOTH the old and the strengthened suite.
    SC-4 (THE GENERATORS' ACTION IS MEASURED). CTL-GEN-ACT reports orbit images,
    key-component changes and verdict changes SEPARATELY per generator, so that
    "verified" and "does observable work" are visibly different properties.
    SC-5 (NO DEGENERATE ADJUDICATOR COULD HAVE PASSED). CTL-TWOSIDED reports both
    sides of T1..T5 against their pre-registered pairs.
    SC-6 (SCOPE AND HYGIENE). CTL-QUAR-ATTEST present; every manifest carries
    code_path_fingerprint, an armed deadline and the literal id EXP-DIFFP-4b165f;
    run-index.json carries a sha256 for EVERY FILE OF EVERY EXECUTED RUN; every
    figure is labelled MEASURED or MODELED; no figure projects toward any attack
    complexity; unspent ceilings are reported AS UNSPENT rather than reallocated;
    and the execution report states explicitly that NO PATH IS CLAIMED NEW, NO
    SEARCH WAS RUN, NO SOURCE WAS ACQUIRED, NO INSTRUMENT WAS REPAIRED, and THE MD5
    LANE IS BLOCKED RATHER THAN CLOSED.
    A CONTROL THAT FAILS, HONESTLY REPORTED WITH ITS INTEGER COUNTS AND ITS NAMED
    CAUSE, SATISFIES THIS CONTRACT. A control suite measured to have LESS power
    than hoped is the result this batch exists to obtain, in exactly the same way
    that "2 of 5" was BATCH-f8bf86's.

  falsification_criterion: >-
    Every check here is two-sided by construction and each has a defined failing
    outcome that is a RESULT rather than a defect, except where noted as
    infrastructure.
    (a) CTL-FROZEN or CTL-REPRO disagrees: INFRASTRUCTURE SIGNAL, a STOP, and never
    a mathematical finding.
    (b) Family (d) returns MEMBER at some k >= 1 on the honest adjudicator: the
    strict key does not read the candidate's declared message difference on that
    object class, which is a direct finding about the instrument and a
    counterexample object to be archived.
    (c) Family (d)'s rejections are attributed predominantly to a component OTHER
    than the perturbed one: THE FAMILY HAS NO POWER OVER THE COMPONENT IT WAS BUILT
    FOR, and the batch's own headline control is falsified in exactly the way
    0/3000 was. This is the most valuable single outcome available to this batch
    and it is predicted for the SHA-1 arm at large k.
    (d) The battery's row 2 shows the strengthened suite STILL does not detect the
    message_difference deletion: the batch's designed effect did not occur and the
    obstruction is deeper than a missing null family.
    (e) The battery's group 1 disagrees with EV-DIFFP-b878aa O-7: either the
    round-1 measurement or this contract's ablation mechanism is wrong, and the
    disagreement localises to one of two named implementations. Reported, not
    reconciled.
    (f) CTL-GEN-ACT shows {E4} or {E5} DOES emit an orbit image or change a
    verdict: the round-1 finding is wrong and the strict group does more work than
    review measured.
    (g) CTL-TWOSIDED misses a side: the instrument's strongest structural property
    does not hold as measured, which weakens every verdict this goal has recorded.

  required_artifacts:
    - >-
      harness/diffpath/controlpower.py -- THE ONLY NEW MODULE. It imports the
      committed adjudicator, census builder and equivalence modules and modifies
      none of them. It contains: the key projection and the ablated-canonical-form
      construction; the family-(d) perturbation generators (deterministic and
      seeded, both primitives, plus the in-code and VD3-profile sub-arms); the
      component-attribution function; the generator action profiler; the two-sided
      decoy constructors; and the drivers that run the suite once per ablation row.
    - >-
      tests/test_diffpath_controlpower.py -- a NEW dedicated test file covering the
      projection (that dropping a name yields a tuple identical to the original with
      that pair removed), the perturbation generators (that exactly k bits change
      and that no other field moves), the attribution function, and the
      inside-versus-outside minimisation comparison. NO EXISTING TEST FILE IS
      EDITED.
    - >-
      null-family-d-result.json -- per (primitive, k, mode, arm) integer counts,
      the component-attribution distribution, the closest non-matching draw per cell
      with its distance LABELLED AS A DIAGNOSTIC, and every k >= 1 MEMBER verdict
      in full if any occurred.
    - >-
      ablation-battery-result.json -- one record per row: the drop-set, the
      run-time-derived key component list, CTL-PLANT, CTL-NULL per family per mode,
      CTL-NULL-D per cell, the DETECTED / NOT DETECTED verdict for the old and the
      strengthened suite, and for group 1 the pre-registered value beside the
      measured one.
    - >-
      generator-action-profile.json -- per generator and declared subset: orbit
      images per object per primitive, the key component names that change, and the
      verdict changes in each mode; plus the CTL-TWOSIDED table with both sides of
      T1..T5.
    - >-
      repro-and-frozen-result.json -- the CTL-REPRO comparison table with every
      pre-registered value beside its measured value, and the CTL-FROZEN pre-run
      and post-run digest sets with their comparison.
    - >-
      run-index.json -- the index of every executed run, CARRYING A sha256 FOR
      EVERY FILE OF EVERY EXECUTED RUN. This is the batch's closure of
      DEC-20260824-af6d5c's G7 gap: run directories are not declared as queue
      artifact_paths (a gated run that correctly does not execute would make a
      completed archive unable to cover its declared set), so the runs are content-
      bound by an artifact that IS in the binding set.
    - >-
      Run directories under the task path for every executed run: command,
      environment, seeds, manifest carrying code_path_fingerprint and the literal
      experiment id EXP-DIFFP-4b165f and an armed deadline, raw machine-readable
