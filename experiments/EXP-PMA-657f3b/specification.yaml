experiment:
  id: EXP-PMA-657f3b
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-e5cedd; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-e5cedd
  question_id: RQ-PMA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Run the section-8 quantifier-order and observation-collision audits on the divisor-parity
    gate, and measure generic-versus-specialized square-class agreement across all regular specialization
    points
  objective: 'The one uncertainty a run reduces is whether the divisor-parity claim''s quantifier
    structure and its observable can support the exact-classifier reading frozen in H-PMA-001, and
    whether the generic and specialized computations agree in the one direction where agreement is
    compulsory. Concretely: (i) it produces an explicit quantifier-order table for the frozen claim,
    enumerating every argument a witness could depend on and marking each dependence as permitted
    or forbidden with the frozen sentence supporting it, which is the section-8 audit this mechanism
    never received because it predates the section''s adoption; (ii) it measures, per prescribed table,
    the generic square-class verdict against the specialized verdict at every regular point a in k,
    filling a four-cell agreement table and isolating the single contradictory cell -- generically
    square, specialized nonsquare at a regular point -- which must be empty, while explicitly recording
    that the reverse direction failing is expected and is not a defect; (iii) it hunts an observation
    collision, two tables with structurally identical square-class certificates on opposite sides
    of realizability, reporting any candidate only when realizability is independently established
    on both sides. The run decides nothing about whether divisor parity obstructs PMA4 and touches
    no cryptographic quantity.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for the frozen claim
      text as committed, an explicit quantifier-order table with each entry traced to a quoted sentence;
      for the tested prescribed tables, tested constant fields and tested regular specialization points,
      the four-cell generic-versus-specialized agreement table, the measured reverse-implication failure
      rate, and the exceptional-point counts; and for the tested collision search, either a set of
      individually verified collisions or a statement that none was verified at that search size.
      What does NOT follow: no identifiability conclusion from a zero collision count, no conclusion
      about whether divisor parity obstructs PMA4, no generic-family statement, nothing about characteristic
      2 or about sizes other than 4, no inference from specialized realizability to generic realizability
      or the reverse, and no attack, speedup or security consequence.'
  inputs:
    procedure: 'STAGE 0 (cost: hours, human, ZERO compute): write the quantifier-order table from
      the frozen text of H-PMA-001 and IDEA-20260726-012, quoting the supporting sentence for each
      entry; this stage is deliverable on its own. STAGE 1 (cost: minutes): NULL 1 -- build at least
      200 constructed squares over k(t) per field, specialize at every regular point, require zero
      nonsquare results; plus at least 200 constructed nonsquares certified generically. Abort on
      any violation. STAGE 2 (cost: minutes): ring-homomorphism control on a sample -- specialize
      inputs then construct, versus construct then specialize, at regular points. STAGE 3 (cost: minutes):
      signal arm -- per prescribed table, generic verdict plus the specialized verdict vector over
      all regular a, with exceptional points detected and excluded; fill the four-cell agreement table.
      STAGE 4 (cost: minutes): compute the reverse-implication failure rate per point and aggregated.
      STAGE 5 (cost: minutes to an hour): collision hunt -- structural certificate comparison across
      the signal grid and across NULL 2''s degree-matched sample, grouping by identical certificate.
      STAGE 6 (cost: hours, human plus compute): for each candidate collision group, attempt independent
      realizability establishment on both sides using the exhaustive finite-field data where sizes
      permit; report verified, unverified, and unverifiable separately. STAGE 7: run record with the
      quantifier table, the agreement table and the collision ledger.'
    instrument: Python 3 with sympy for exact rational-function arithmetic, factorisation and reduction
      modulo (t - a) over GF(q) and QQ; a hand-written square test in k (Euler criterion over F_q,
      exact factorisation over Q) written independently of the generic square-class routine; structural
      certificate comparison rather than hashing; harness/runner.py for the manifest, seeds and inference
      block. Where independent realizability is needed for a collision candidate over a finite constant
      field, the exhaustive image data from the census contracts in this bucket is used as the external
      source. No Sage.
    parameters: 'n = 4, three anchored discriminants per table. Constant fields: F_q for the largest
      small odd q the parameter box admits, and Q. Signal grid: at least 30 prescribed tables. Specialization
      points: all a in F_q for the finite arm, minus exceptional points; for Q, a stated sample of
      at least 50 integer points in a declared box, minus exceptional points. NULL 1: at least 200
      constructed squares and at least 200 constructed nonsquares per field, with designed odd-valuation
      supports of sizes 1, 2 and 3. NULL 2: at least 300 degree-matched uniformly sampled tables per
      field for the background collision rate. Ring-homomorphism control sample: at least 50 (table,
      point) pairs per field. Per-operation wall-clock cap 120 s over Q, exceeded cases recorded UNDECIDED.'
  controls:
  - 'NULL 1: constructed squares over k(t) must specialize to squares at every regular point, zero
    exceptions, run through the identical specialization and square-test code path.'
  - 'Constructed-nonsquare control: functions built with a designed odd valuation must be certified
    nonsquare generically, so the generic test is exercised in both directions.'
  - 'Exceptional-point control: points where any relevant denominator or leading coefficient vanishes
    are detected, branched and excluded, with counts reported per table; never scored as disagreements.'
  - 'Ring-homomorphism control: for a sample, specialize the inputs first and recompute q_ij, c_ijk,
    Delta from the specialized data, then compare against specializing the generic Delta; these must
    agree at regular points, which checks that specialization commutes with the construction.'
  - 'NULL 2: background certificate-collision rate on degree-matched uniformly sampled tables.'
  - 'Collision verification control: any signal-arm collision is only reported if realizability is
    independently established on both sides by a source outside the gate.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls in the same invocation. NULL 1 (validity of the specialization
    map): apply the identical specialization pipeline to CONSTRUCTED squares over k(t), that is functions
    built explicitly as h squared. At every regular a, the specialized value must be a square in k,
    with zero exceptions -- this is the one direction that must hold, and any violation means the
    specialization map or the square test is wrong, not that a theorem failed. NULL 2 (background
    collision rate): compute square-class certificates for uniformly sampled degree-matched rational-function
    tables and measure how often two distinct tables share a certificate, giving the collision rate
    expected from certificate coarseness alone. For a signal-arm collision to mean anything, it must
    occur at a rate distinguishable from NULL 2, or else be a single collision that is individually
    verified with realizability established on both sides.'
  independent_variables:
  - specialization point a, ranging over all regular points in F_q or over the declared sample in
    Q
  - constant field in {F_q, Q}
  - 'arm: signal prescribed tables, NULL 1 constructed squares and nonsquares, NULL 2 degree-matched
    samples'
  - prescribed table identity, and discriminant index within a table
  metrics:
    primary:
    - 'contradictory-cell count: tables generically square that specialize to a nonsquare at a regular
      point (must be exactly 0)'
    - constructed_square_specialization_violations (must be exactly 0)
    - the full four-cell generic-versus-specialized agreement table, aggregated and per field
    - 'reverse-implication failure rate: fraction of generic-nonsquare cases specializing to a square,
      per point and aggregated'
    - count of verified certificate collisions with opposite realizability
    secondary:
    - exceptional-point count per table and the resulting specialized-vector length
    - ring-homomorphism control agreement rate
    - NULL 2 background certificate-collision rate and group-size distribution
    - candidate collisions classified as verified, unverified or unverifiable, with reasons
    - constructed-nonsquare generic misclassification count; also UNDECIDED counts from wall-clock
      caps
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The compulsory direction of specialization agreement, and the emptiness of the contradictory
      cell.
    formula: 'For every table T and every regular specialization point a: if Delta(T) is a square
      in k(t) then Delta(T) evaluated at a is a square in k. Hence contradictory_cell_count equals
      0 exactly, and constructed_square_specialization_violations equals 0 exactly. The converse implication
      is explicitly NOT predicted; its failure rate is measured and no value is pre-committed for
      it, by explicit refusal recorded in the proposal. Collision prediction: any single verified
      collision with opposite realizability falsifies the exact-classifier framing; zero verified
      collisions predicts nothing.'
    source: Pre-registered in the parent proposal IDEA-20260816-e5cedd before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested parameters are n = 4, at least 30 prescribed tables, all regular points
      of F_q for the finite arm and a declared 50-point sample over Q, at least 400 constructed validation
      functions per field and at least 300 degree-matched samples per field for the background collision
      rate. The one explicit extrapolation is over Q, where the specialization points are a sample
      of an infinite set and the sampling rule is stated rather than hidden; no conclusion is drawn
      about unsampled points. No transfer to other sizes, other prescribed families, characteristic
      2, or a generic parameter variety is claimed.
    correspondence: null
  tail_checks:
  - Tables with the fewest regular specialization points are inspected individually, since their agreement
    statistics rest on very short vectors.
  - Specialization points adjacent to exceptional points are inspected, since near-cancellation is
    where the ring-homomorphism control is most likely to strain.
  - Certificate groups of size greater than 2 are inspected in full rather than pairwise sampled.
  - Tables whose generic verdict is DEGENERATE are excluded from the agreement table entirely and
    counted separately, per RQ-PMA-001's constraints.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort the run and report nothing quantitative if any constructed square specializes to a nonsquare
    at a regular point.
  - Stop and escalate to hand inspection on the first nonzero contradictory cell; it indicates an
    implementation defect that invalidates everything downstream.
  - Stop the collision hunt and report on the first collision verified with independent realizability
    evidence on both sides.
  - Record UNDECIDED and continue for any operation exceeding its wall-clock cap; never convert a
    cap into a verdict.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The quantifier-order table is produced with every entry traced to a quoted sentence
    of the frozen records, NULL 1 shows zero constructed-square specialization violations, the contradictory
    cell is empty, and a complete four-cell agreement table with exceptional-point counts and a measured
    reverse-implication failure rate is reported for every field.
  falsification_criterion:
  - Any constructed square specializing to a nonsquare at a regular point.
  - Any nonzero contradictory-cell count on the signal grid.
  - 'Ring-homomorphism control failure: specialization does not commute with the construction of the
    discriminants.'
  - A verified certificate collision with opposite realizability, which falsifies the exact-classifier
    framing of H-PMA-001 while leaving the one-directional obstruction reading intact.
  - A forbidden witness dependence surfaced by the quantifier audit, traced to a quoted sentence.
  - Signal-arm collision group rate indistinguishable from NULL 2's background rate, meaning certificate
    coarseness explains the groups and no identifiability reading is available in either direction.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-e5cedd
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must rule on the sampling rule for specialization points over Q; the reverse-implication
    rate depends entirely on it and there is no canonical choice.
  - The Coordinator must decide what counts as independent realizability evidence for a collision
    candidate, since using the gate itself would be circular and exhaustive data exists only at sizes
    the census contracts in this bucket can reach.
  - The quantifier table's granularity needs fixing in advance -- which arguments are quantified at
    all -- because a table drawn after seeing the results would not be an audit.
  - Valid parameter assignments for the prescribed family depend on the unresolved parameter-box question
    raised elsewhere in this bucket.
