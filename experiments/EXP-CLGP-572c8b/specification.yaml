experiment:
  id: EXP-CLGP-572c8b
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-02b7b2
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'A PROVED ZERO-VARIANCE FAMILY FOR THE CAMPAIGN''S GATING LANE: the target subgroup''s kernel
    ideal is n = (N, pi - 1), literally the SAME ideal of O for every curve on a crater, so every
    attack-cost functional that is a function of (O, pi, n) alone has provably zero within-crater
    variance -- which tells lane L1 in advance which functionals cannot possibly vary, and predicts
    that all between-level variation is exactly accounted for by the conductor formula with no residual'
  status: draft
  objective: "(A) THE ELEMENTARY FACT, STATED SHARPLY. Let E/F_p be ordinary with End_{F_p}(E) = O\
    \ and Frobenius pi, and let G be the subgroup of E(F_p) of prime order N with N^2 not dividing\
    \ #E(F_p). Then G = E[n] for the O-ideal\n    n = (N, pi - 1),\nof norm N, dividing (pi - 1) because\
    \ G is contained in ker(pi - 1) = E(F_p). Now let E' = [a] * E be any other curve on the SAME\
    \ CRATER (same O, hence same level of every ell-volcano for ell not dividing the conductor), reached\
    \ by an isogeny phi_a of degree coprime to N. The ideal-subgroup correspondence is equivariant\
    \ for the class-group action, so\n    phi_a( E[n] ) = E'[n],\nwith THE SAME IDEAL n. The pair\
    \ (O, pi) is a class invariant by construction (the class fixes t, hence pi and its minimal polynomial),\
    \ and n = (N, pi - 1) is written in terms of (O, pi, N) alone. HENCE n IS THE SAME OBJECT FOR\
    \ EVERY CURVE ON THE CRATER, and so is its class [n] in Cl(O).\n(B) THE CONSEQUENCE, WHICH IS\
    \ THE POINT. Let C be any attack-cost functional on curves that can be written as a function of\
    \ (O, pi, n) -- equivalently, of the arithmetic of the endomorphism ring together with the kernel\
    \ ideal of the target subgroup, with no reference to the curve's equation, model or coordinates.\
    \ Then\n    C IS CONSTANT ON EVERY CRATER, exactly, with zero variance.\nThis is a THEOREM, not\
    \ a measurement, and it is exactly the kind of statement lane L1 (RQ-ICINV-475b5e) exists to produce\
    \ -- T3 of the campaign's decomposition says an attack-cost functional provably constant on the\
    \ isogeny class closes that axis for that functional, with a named obstruction, and that this\
    \ is a legitimate closure. This record supplies such a closure for a whole FAMILY of functionals\
    \ in advance, at zero compute, so L1 need not spend measurement budget discovering it.\n(C) THE\
    \ FAMILY, ENUMERATED CONCRETELY SO IT IS USABLE. Provably within-crater constant: h(O) and the\
    \ full group structure of Cl(O); the class [n] and its order in Cl(O); the norm form of O and\
    \ every representation number; the splitting behaviour of every rational prime in O, hence the\
    \ Elkies/Atkin classification and the number of rational ell-isogenies at each level; the discriminant\
    \ D and conductor f; #E(F_p) = N(pi - 1), N, the cofactor, and the embedding degree; the minimal\
    \ norm of an ideal in any fixed class; the entire ell-volcano shape. Provably NOT in the family,\
    \ hence permitted to vary: the j-invariant; the Weierstrass or Montgomery coefficients; every\
    \ x-coordinate statistic; Semaev summation-polynomial coefficients and every Groebner-basis proxy\
    \ computed from them; the height of j; the model-dependent quantities lane L11 studies. The dividing\
    \ line is exactly RESOURCE: R3/R4 quantities are in the family, R1/R2 quantities are not.\n(D)\
    \ THE BETWEEN-LEVEL PREDICTION, WHICH IS THE FALSIFIABLE PART. Curves in one isogeny class at\
    \ DIFFERENT volcano levels have different orders O_f of conductor f, so (A) applies per level\
    \ and not across levels. Across levels the family's members change, but they change COMPUTABLY,\
    \ by the class number formula for non-maximal orders\n    h(O_f) = h(O_K) f prod_{l | f} (1 -\
    \ (D_K/l)/l) / [O_K^* : O_f^*].\nPREDICTION: for every functional in the family, ALL between-level\
    \ variation is explained by that formula with NO RESIDUAL. Any residual between-level variation\
    \ in an (O, pi, n)-functional would mean the functional is not actually in the family, or that\
    \ the level classification is wrong. This turns a definition into a testable statement, and it\
    \ is the reason this record is a measurement proposal rather than a note.\n(E) THE DISCRIMINATION,\
    \ AND BOTH OUTCOMES ARE USEFUL.\n  OUTCOME 1 (predicted). Every family functional measures exactly\
    \ constant\n  within crater and exactly conductor-explained across levels, while every\n  non-family\
    \ functional (j, the coefficients, the Groebner proxies) varies\n  within crater. Then lane L1's\
    \ within-class variance question is settled\n  for the R3/R4 half of its functional list BY PROOF,\
    \ and L1's budget goes\n  entirely to the R1/R2 half where the answer is genuinely unknown. That\n\
    \  is a real saving and a real closure.\n  OUTCOME 2. Some family functional measures NON-constant\
    \ within a crater.\n  Then either the crater classification is wrong (most likely: the\n  conductor\
    \ or the level was misidentified, or N^2 divides the group order\n  so G is not unique), or the\
    \ equivariance of the ideal-subgroup\n  correspondence is being violated by the implementation.\
    \ Either way it is\n  an instrument failure that must be fixed before ANY L1 measurement is\n\
    \  trusted -- which makes this record a prerequisite calibration for the\n  gating lane rather\
    \ than a competitor to it."
  resource_label: 'R3 (End(E) as a ring: the order O, the ideal n = (N, pi - 1), the class group and
    the conductor formula) and R4 (the class-group action, whose equivariance is what makes n class-wide).
    No R1 or R2 quantity is used; identifying which functionals lie outside R3/R4 is part of the deliverable.'
  admissibility: admissible
  admissibility_argument: 'Admissible: the resource is the ring structure of O and the ideal n, both
    invisible to a generic group oracle for G -- a generic oracle cannot express "the ideal of norm
    N dividing pi - 1". No endomorphism is applied to a point of G, so H-ENDO-001''s scalar collapse
    does not apply and neither closed oracle class of KN-FIND-b7e091 is used. The proposal then produces
    a NEGATIVE (zero variance) for a reason unrelated to admissibility, which is the useful outcome:
    it shows that a lane can clear the resource filter and still contain a provably flat cost landscape.'
  reachability_gate: 'T5 IS ANSWERED IN THE NEGATIVE DIRECTION FOR THIS LANE, AND THAT IS THE RECORD''S
    CONTRIBUTION TO THE GATE. T5 says a cost-minimising curve in the class is useful only if goodness
    is common enough to hit by random walking or detectable by a local test. This record shows there
    is NO goodness TO reach for any (O, pi, n)-functional: the landscape is exactly flat on the crater,
    so both branches of the dichotomy are vacuous for that family and the reachability question does
    not even arise. Concretely, no proposal in this lane may claim value from walking to a better
    curve as measured by an R3/R4 functional, at any cost, because there is no better curve. The gate
    therefore binds trivially here, and the open reachability question is confined to the R1/R2 functionals
    -- which is exactly where lanes L1 and L11 already put it.'
  inputs:
    procedure: 'STAGE 0 (zero compute): prove (A); enumerate the family; pre-register the partition
      of L1''s candidate functional list. This is the entire intellectual content and it costs nothing.
      STAGE 1 (minutes): enumerate one complete toy isogeny class by brute force over all curves at
      a toy p; count distinct j-invariants per crater and compare against h(O). This single check
      verifies the free transitive action empirically and is the cheapest sanity gate in the batch.
      STAGE 2 (minutes, HARD GATE): compute the family functionals per curve and assert exact within-crater
      equality; compute the control functionals and assert within-crater variation. Both must fire.
      STAGE 3 (minutes): the between-level conductor-formula residual, in exact arithmetic. STAGE
      4 (minutes): the planted-misclassification control. STAGE 5 (zero compute): hand the partition
      and the null model to L1 and L2. NOTE ON EXECUTION: Stages 1-4 share their entire instrument
      with lane L1''s enumeration. The coordinator should schedule this as a rider on L1''s run rather
      than as a separate experiment; its marginal compute cost is then near zero.'
    mechanism: 'STEP 1 (zero compute). Prove (A): state the ideal-subgroup correspondence for ordinary
      curves with End_{F_p}(E) = O, verify n = (N, pi - 1) has norm N and annihilates G, and verify
      equivariance phi_a(E[n]) = E''[n] for a coprime to n. Record the two hypotheses (N^2 not dividing
      the group order; deg phi coprime to N) as the object''s domain.

      STEP 2 (zero compute). Enumerate the family (C) explicitly and, for each candidate functional
      the campaign''s other lanes propose to measure, decide IN ADVANCE whether it is an (O, pi, n)-function.
      Publish the partition before L1 measures anything, so that a flat measurement is a CONFIRMED
      PREDICTION rather than a post-hoc explanation. This pre-registration is the record''s main methodological
      contribution.

      STEP 3 (toy compute, cheap). Enumerate a complete toy isogeny class: all curves with a fixed
      trace t at a toy p, classified by volcano level via counting rational ell-isogenies for each
      small ell dividing the conductor. For every curve compute O, h(O), n, [n] and the order of [n];
      assert exact equality of the family functionals within each crater.

      STEP 4 (toy compute, THE DISCRIMINATING CONTROL). On the SAME enumerated class, compute a set
      of NON-family functionals -- j-invariant, Weierstrass coefficients, a low-cost Semaev/Groebner
      proxy at m = 3, and an x-coordinate distribution statistic -- and assert they DO vary within
      the crater. This is the control that makes the zero-variance result meaningful: an instrument
      that reports zero variance for everything is broken, and without this arm the family result
      is untestable.

      STEP 5 (toy compute). The between-level test: compare measured level-to-level ratios of h(O)
      against the conductor formula, and report the RESIDUAL. Predicted exactly zero (to floating-point
      or exact arithmetic precision, since these are integers).

      STEP 6 (zero compute). Hand the partition and the between-level null model to lanes L1 and L2
      with an explicit statement of what remains open: the R1/R2 half of L1''s functional list, where
      nothing here applies.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - non-family functionals -- MUST vary within crater
  - distinct j-invariant count equal to h(O) -- verifies free transitivity
  - planted misclassification of one curve's level -- MUST be detected
  - h(O) = 1 craters flagged automatically as uninformative
  - instances with N^2 dividing the group order recorded separately, not discarded
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, and here the null is a NON-NULL: the
    control arm of Step 4. Matched object of the same shape: the identical enumerated crater, the
    identical pipeline, the identical assertion of within-crater equality -- applied to functionals
    OUTSIDE the family (j-invariant, Weierstrass coefficients, an m = 3 Groebner proxy, an x-coordinate
    statistic). Those MUST vary. A pipeline that reports zero within-crater variance for the j-invariant
    is comparing the wrong objects (most likely it has collapsed isomorphic curves incorrectly, or
    is enumerating one curve repeatedly), and every zero-variance result it produces is void: the
    run set is INVALID, not confirmatory. DECAY PARAMETER: h(O), the crater size. As h grows, the
    within-crater variance of the NON-family functionals must GROW (more distinct curves, more distinct
    j-invariants) while the family functionals stay exactly constant. The two must move in opposite
    directions under the same parameter, which is a much stronger check than either alone. A family
    functional whose measured variance grows with h is the canonical artifact tell and indicates the
    crater classification is leaking curves from another level. SECOND CONTROL: a PLANTED violation.
    Deliberately mis-assign one curve to the wrong volcano level and confirm the pipeline detects
    the resulting inconsistency in h(O). An instrument that cannot detect a deliberately misclassified
    curve cannot certify a correct classification.'
  independent_variables: []
  metrics:
    primary:
    - per-curve (p, t, D, f, level, O, h(O), n, [n], order of [n])
    - within-crater variance of every family and control functional, in exact arithmetic
    - distinct j-invariant count per crater against h(O)
    - between-level h(O_f) ratios against the conductor formula, with residual
    secondary:
    - pass/fail of the planted-misclassification control
  heuristic_under_test: null
  preregistered_prediction:
    quantity: within-crater variance of each family functional (h(O), [n], order of [n], splitting
      type of small primes, number of rational ell-isogenies at the level)
    formula: EXACTLY ZERO, in exact integer arithmetic, on 100 percent of craters with h(O) >= 20.
      Not "small" -- exactly zero. Any nonzero value is an instrument or classification failure and
      halts the line.
    source: pre-registered in IDEA-20260807-02b7b2 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - ISOMORPHISM VERSUS ISOGENY. The single most dangerous confounder here. Curves isomorphic over
    F_p share a j-invariant but so can non-isomorphic twists; and the class-group action is on F_p-isomorphism
    classes with End exactly O. A pipeline that deduplicates by j-invariant alone will merge twists
    and produce a distinct-j count below h(O). Deduplication is by F_p-isomorphism class, and the
    twist handling is stated explicitly.
  - TWISTS ARE NOT IN THE CLASS. E and its quadratic twist have traces t and -t. Including twists
    inflates the apparent class size by a factor 2 and would break every count.
  - LEVEL MISCLASSIFICATION. Counting rational ell-isogenies is the standard level test but is delicate
    when ell is small or divides the conductor to high multiplicity. The planted-misclassification
    control exists for exactly this and is blocking.
  - N^2 DIVIDING THE GROUP ORDER. Then G is not the unique order-N subgroup and n is not uniquely
    determined by (N, pi - 1) as claimed. These instances are recorded separately; they are a boundary
    case worth its own note, not noise to be dropped.
  - TINY CRATERS. At h(O) <= 3 everything is nearly constant for trivial reasons. The h >= 20 threshold
    is pre-registered and h is reported with every number.
  - T4 WORDING. The campaign's own decomposition lists the number of rational ell-isogenies as varying
    within the class; that is true BETWEEN levels and false WITHIN a crater. Any pipeline written
    against T4's wording rather than against (A) will encode the wrong prediction, and the write-up
    must flag the distinction rather than silently differ from the frozen decomposition.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY ZERO, in exact integer arithmetic, on 100 percent of craters with h(O)
    >= 20. Not "small" -- exactly zero. Any nonzero value is an instrument or classification failure
    and halts the line.
  falsification_criterion:
  - Any family functional varies within a crater with h(O) >= 20 while the level classification control
    passes. Either the equivariance claim or the crater classification is wrong; halt, debug, and
    do NOT report as mathematics until independently replicated -- the underlying statement is elementary,
    so a violation is far more likely an implementation error, but if it survives replication it invalidates
    lane L2's stratification too and must be escalated.
  - A control functional (notably the j-invariant) is constant within a crater. The enumeration is
    collapsing curves; every zero-variance result is void and the run set is INVALID rather than confirmatory.
  - The distinct j-invariant count differs from h(O). The free transitive action is not being realised
    as implemented; nothing downstream is interpretable.
  - A nonzero residual survives the conductor formula between levels. The between-level null model
    is wrong and lane L2 must not use it.
  - The planted misclassification is not detected. Instrument blind; the classification cannot be
    certified and neither can any stratified measurement built on it.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
