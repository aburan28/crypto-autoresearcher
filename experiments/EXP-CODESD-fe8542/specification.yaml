experiment:
  id: EXP-CODESD-fe8542
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-4df735; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-4df735
  question_id: RQ-FAEST-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Relation-swap ablation of a single MPC-in-the-head shell across a parity-check-shaped, a
    Boolean-circuit-shaped and a quadratic-shaped relation with pinned proof-layer parameters, plus
    trivial and random null relations and a shell-modification audit.
  objective: 'The one uncertainty a run reduces is whether the paradigm-versus-scheme attribution
    this bucket is built on can be measured rather than argued. Concretely: (i) whether three genuinely
    different relation shapes can be hosted by one proof shell through a three-operation interface
    with zero shell modification, measured as an explicit count of changed shell lines with the forcing
    relation feature named for each; (ii) which measured quantities, exact soundness, emitted bytes,
    verifier operation count and opening-size distribution, are invariant across all three relations
    at pinned shell parameters and which move, measured as a coefficient of variation against a noise
    floor established by an identical-relation repeat arm; (iii) whether the resulting shell-level
    classification is falsifiable, measured by requiring an always-pass trivial null relation to leave
    every shell-level quantity unchanged and every relation-level quantity moved, with a fixed-acceptance
    random null separating relation structure from acceptance rate. A run does not reduce uncertainty
    about SDitH, FAEST or MQOM, none of whose relations appear here, nor about any hard problem, which
    the design never touches.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for the declared shell,
      the declared three relation shapes at the declared sizes, and pinned shell parameters, the shell-modification
      count was X, the following quantities were invariant across relations within the reported tolerance
      and the following moved, with the trivial and random nulls behaving as reported. What does NOT
      follow: nothing about SDitH, FAEST or MQOM, whose relations are not these and whose specifications
      have not been read; no claim that a quantity invariant in the shell is invariant in any real
      scheme, since the shell pins what real schemes vary; and no security consequence, since no attack
      is run and no hard problem is instantiated at any meaningful size.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes) declare the relation interface, the three relation shapes
      with their sizes, the pinned shell parameters and the invariance bands, and freeze them. STAGE
      1 (cost: many hours human) implement all three relations FIRST, then the shell against the interface,
      recording every shell line that had to change to host each relation with the forcing feature
      named. STAGE 2 (cost: minutes) verify the shell configuration hash is identical across all arms;
      HALT if not. STAGE 3 (cost: minutes) run the identical-relation repeat arm to establish the
      noise floor. STAGE 4 (cost: tens of minutes to two core-hours) run the full battery for all
      three relations across the grid: enumerate soundness within the cap, sign the declared message
      count, count verifier operations, record opening-size distributions. STAGE 5 (cost: tens of
      minutes) run NULL-RELATION-TRIVIAL and NULL-RELATION-RANDOM through the identical battery. STAGE
      6 (cost: minutes) build the invariance table with the undetermined band explicit, apply the
      null checks to the classification, and emit the shell-modification audit as the primary artifact
      alongside the table.'
    instrument: 'Python 3.11 standard library: hashlib for idealized commitments, itertools for soundness
      enumeration, fractions.Fraction for exact soundness, struct for deterministic serialization,
      random.Random with declared seeds. numpy 2.4.6 for distribution summaries only. No Sage, no
      external cryptographic library, no circuit compiler. Executed through harness/runner.py with
      immutable run records under an experiments/EXP-* directory and the shell configuration hash
      recorded in every manifest.'
    parameters: 'Relations: R1 parity-check-shaped over F_4 with (n, k, w) in {(12,6,4), (16,8,4),
      (24,12,6)}; R2 Boolean-circuit-shaped with AND-depth in {2, 3, 4} and 12, 24, 36 gates; R3 quadratic-shaped
      over F_4 with (variables, equations) in {(6,6), (8,8), (10,10)}. Shell parameters pinned per
      grid cell: N in {2, 4, 8}, tau in {1, 2, 3}, seed length 16 bytes, salt 16 bytes. Signings per
      cell: 100 with declared seeds. Soundness enumeration cap 5000000 pairs per cell. Null relations:
      trivial always-pass, and random with declared acceptance in {1/4, 1/2}. Identical-relation repeat
      arm: R1 at its middle size, 10 independent seeds.'
  controls:
  - NULL-RELATION-TRIVIAL, always-pass check, testing the shell-level classification.
  - NULL-RELATION-RANDOM, fixed declared acceptance probability, separating relation structure from
    acceptance rate.
  - Relation size sweep within each shape, separating relation KIND from relation SIZE.
  - Shell parameters pinned across all arms, verified by asserting the shell's configuration hash
    is identical in every run record.
  - 'An identical-relation repeat arm: R1 run twice with different seeds, whose cross-run variation
    bounds the noise floor against which cross-relation variation is judged.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): NULL-RELATION-TRIVIAL: a relation whose check always passes on any
    share vector, implemented behind the identical interface and run through the identical battery
    in the same invocation. Every quantity classified shell-level must be unchanged by it within the
    same tolerance; every quantity classified relation-level must move. If a shell-level quantity
    moves under the trivial relation, it was misclassified and the partition is void; if a relation-level
    quantity does not move, the classification has no discriminating power. A second null, NULL-RELATION-RANDOM,
    uses a relation whose check passes with a fixed declared probability independent of the shares,
    separating relation STRUCTURE from relation ACCEPTANCE RATE, which would otherwise be confounded.'
  independent_variables:
  - relation kind (R1, R2, R3, trivial null, random null)
  - relation size within kind
  - party count N
  - repetition count tau
  - seed for the identical-relation repeat arm
  metrics:
    primary:
    - exact enumerated soundness per cell
    - coefficient of variation of each battery quantity across the three relation kinds at matched
      shell parameters
    - shell modification count with named lines
    - movement of shell-level quantities under NULL-RELATION-TRIVIAL
    secondary:
    - emitted signature byte distribution
    - verifier field-operation count and Boolean-gate count, reported separately
    - opening-size distribution summary
    - noise floor from the repeat arm
    - fraction of cells exceeding the enumeration cap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'The invariance ratio I(q) for each battery quantity q: the coefficient of variation
      of q across the three relation kinds at matched shell parameters, divided by the noise floor
      from the identical-relation repeat arm.'
    formula: 'I(q) = CV_across_relations(q) / CV_repeat_arm(q). Predicted: at least two quantities
      have I(q) at most 1, meaning cross-relation variation is at or below the noise floor and q is
      shell-level; at least one has I(q) at least 10, meaning q is relation-level. Values between
      1 and 10 are reported as undetermined and are NOT assigned to either column. I(q) below 1 for
      every q would mean the battery cannot see the relation at all, which falsifies the discriminating
      power rather than establishing invariance.'
    source: Pre-registered in the parent proposal IDEA-20260816-4df735 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Relation sizes run to 24 variables or 36 gates and shell parameters to N equal
      to 8, tau equal to 3, chosen so that exact soundness enumeration completes and the three arms
      remain comparable. These are four or more orders of magnitude below any deployed instance on
      every axis. The transfer assumption is stated and explicitly not used: invariance measured in
      a shell that pins what real schemes vary transfers to nothing, and the record''s value is the
      METHOD plus the shell-modification count, neither of which is a numerical extrapolation.'
    correspondence: null
  tail_checks:
  - 'tau equal to 1: composition contributes nothing and all three relations must agree on the composition-derived
    quantities exactly.'
  - 'NULL-RELATION-TRIVIAL: exact soundness must be exactly 1 by construction; any other value is
    an instrument failure.'
  - 'NULL-RELATION-RANDOM at acceptance 1/2: measured soundness must equal 1/2 to enumeration exactness.'
  - 'Smallest relation size in each shape: verify all three arms complete enumeration, since an asymmetric
    cap would make the primary metric incomparable.'
  - 'Shell configuration hash: identical across every arm and every cell, checked mechanically rather
    than by inspection.'
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt if the shell configuration hash differs across arms.
  - Halt if NULL-RELATION-TRIVIAL does not return soundness exactly 1.
  - Halt if enumeration completes for some relations and not others at any matched shell-parameter
    cell, since the primary comparison is then invalid at that cell.
  - Stop and report partial coverage if wall-clock exceeds six core-hours, marking uncompleted cells
    explicitly.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All three relations are hosted with the shell configuration hash identical across
    arms, both null relations return their constructed values exactly, the identical-relation repeat
    arm establishes a noise floor, and the run emits the invariance table with explicit shell-level,
    relation-level and undetermined columns alongside a shell-modification audit naming every changed
    line and its forcing feature.
  falsification_criterion:
  - A shell modification is required for any relation, falsifying claim (A) and yielding the named
    obstruction as the result.
  - Fewer than two quantities have I(q) at most 1, leaving the shell-level column empty.
  - No quantity has I(q) at least 10, leaving the relation-level column empty and the battery without
    discriminating power.
  - A shell-level quantity moves under NULL-RELATION-TRIVIAL, voiding the partition.
  - NULL-RELATION-TRIVIAL does not return soundness exactly 1, voiding the instrument.
  - Enumeration asymmetry across arms at matched shell parameters, making the primary metric incomparable.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-4df735
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must approve the three relation shapes as genuinely different rather than three
    spellings of one shape, since the entire attribution rests on that judgement and no specification
    is available to anchor it.
  - The invariance bands, one part in a thousand and ten percent, are declared here and must be approved
    or replaced before freezing; they alone decide column membership.
  - Whether idealized commitments across all arms is acceptable, or whether a real hash-based commitment
    is required for the verifier operation count to mean anything.
  - Whether the shell-modification audit can be made objective, since what counts as a changed line
    is a judgement the Coordinator must fix in advance.
