    SYSTEM-PEAK-LIVE-CONCURRENCY:
      severity: blocking
      disposition: REPAIRED_AND_THE_REPAIR_NOW_REACHES_THE_OPERATIVE_CONTRACT
      status_carried_forward_from: EXP-SYC-793304
      # =====================================================================
      # OVL-6, BLOCK-5, RT-82A8CB-OBJ5. THE PRE-REPAIR RULE DOES NOT SURVIVE
      # HERE. The predecessor's frozen_rule at this site omitted B_0 while its
      # own merged-lane formula summed ten streams, and carried disposition
      # REPAIRED two lines above it. This is RULE SITE 1 OF 4.
      # =====================================================================
      frozen_rule: 'peak_live_bytes_system = max_t( B_0(t) + shared(t) + sum_j concurrent_nonshared_shard_j(t) - dedup(t) )'
      frozen_rule_site_id: RULE-SITE-1-OF-4
      frozen_rule_b0_repair_note: >-
        BLOCK-5 / RT-82A8CB-OBJ5. The predecessor's rule at this site read
        max_t( shared(t) + sum_j concurrent_nonshared_shard_j(t) - dedup(t) ),
        with NO B_0 term and no pointer note anywhere in this block, while the
        merged-lane frozen_formula summed TEN streams. Evaluated against
        KAT-PEAK-F (setup allocates 4096 private bytes on [0,20); shared context
        and all eight shards idle) the predecessor's rule returns 0 where the
        fixture requires 4096: THE RECORD'S OWN PRIMARY-BASE RULE WAS
        FORBIDDEN-R7. The B_0 term is added here, at all three other rule sites,
        at all nine stream-count sites, and in the dedup term.
      frozen_rule_equivalent_merged_form: 'system_peak_live_bytes = max_t ( B_0(t) + S(t) + sum_{j=1..8} B_j(t) )'
      equivalence_note: >-
        The two forms are the same rule written twice: shared(t) is S(t),
        concurrent_nonshared_shard_j(t) is B_j(t), and dedup(t) is zero when the
        non-shared streams are already disjoint from shared. Where per-shard
        totals P_j(t) are reported instead, the equivalent form is
        max_t ( B_0(t) + sum_j P_j(t) - D(t) ) with D(t) = sum_j m_j(t) - S(t).
      numeric_effect_of_the_b0_propagation: >-
        NONE. B_0 = 0 in KAT-PEAK-1 through KAT-PEAK-7, so every existing KAT
        expected value is unchanged and the corrected rule reduces exactly to the
        predecessor's at B_0 = 0. No byte figure, bound, residual, or disposition
        anywhere in this package changes. What changes is that a conformant
        implementation can no longer omit the setup stream.
      index_range_j: 1 through 8
      stream_count: 10
      stream_list: 'B_0 (setup-process private, non-shared), S (shared, counted exactly once), and B_1 through B_8 (per-shard non-shared)'
      stream_count_repair_note: >-
        BLOCK-5. TEN, not nine. The predecessor contracted for nine streams at
        nine separate sites while its own corrected formula summed ten. All nine
        sites are corrected in this successor; they are enumerated in
        design-repair-report.yaml item_by_item[BLOCK-5].nine_sites_corrected.
      axis_class: maximum
      scalar_collapse: forbidden
      synchronized_time_base:
        clock: >-
          one host monotonic clock (CLOCK_MONOTONIC_RAW), single source for
          every allocate and free event of the setup process's private context,
          of the shared context, and of all eight shards
        evaluation: >-
          the aggregate expression is evaluated at EVERY event timestamp in the
          merged event set; a step function attains its maximum at an event
          timestamp, so the census is exact
        sampling_forbidden: >-
          periodic or poll-based peak estimation is forbidden because it can
          only undercount
        multi_host_rule: >-
          the setup process, all eight shards and the shared context must execute
          on one host under one clock; a cross-host census invalidates
      dedup_term:
        definition: >-
          dedup(t) = sum over physical pages P live at time t of
          (c_P(t) - 1) * bytes(P), where c_P(t) is the number of distinct
          accounting terms among {setup_private_B_0, shared, nonshared_1..nonshared_8}
          that charge page P at time t
        accounting_terms_counted: 10
        dedup_b0_repair_note: >-
          BLOCK-5 / RT-82A8CB-OBJ5. The predecessor defined c_P(t) over
          {shared, nonshared_1..nonshared_8} -- NINE terms -- while the corrected
          formula summed TEN. The setup-private stream is added to the set here.
          NO DEDUP VALUE IN ANY KAT CHANGES, because dedup is 0 in every fixture
          and B_0 is 0 in KAT-PEAK-1 through KAT-PEAK-7.
        range: 0 <= dedup(t) <= B_0(t) + sum_j nonshared_j(t)
        shared_counted_exactly_once: >-
          shared(t) charges shared allocation once; KAT-PEAK-3 enforces
          agreement between both accountings
      mutation_control_that_makes_the_gap_exact:
        id: MUT-2-B_0-deletion-mutation
        source: RT-82A8CB counterexample_or_mutation
        statement_as_it_applied_to_the_predecessor: >-
          Delete the B_0 term and all four MANDATED KATs (KAT-PEAK-1..4) still
          pass, because B_0 = 0 in all of them. The repaired term was invisible
          to every fixture an implementation was REQUIRED to pass.
        status_against_this_successor: >-
          THIS MUTATION NOW FAILS AS INTENDED. KAT-PEAK-F is placed in the set an
          implementation is REQUIRED to pass (see
          verification-and-null-kats.yaml
          aggregate_kat_summary.required_for_implementation_conformance), and
          KAT-PEAK-F returns 0 under the mutated rule against a required 4096.
        run_by_this_producer: false
        run_by_this_producer_reason: >-
          No implementation and no command tool exist. The mutation's outcome is
          derived from the fixture definition by one line of arithmetic, exactly
          as the red team derived it; it is NOT an executed result.
      new_residual_created_by_this_repair:
        id: PEAK-AGGREGATE-FIT-UNPROVED
        statement: >-
          Under the corrected rule the maximum_memory_gb ceiling of 2 binds an
          aggregate over TEN concurrently live streams rather than a maximum
          over per-shard streams. The corrected aggregate can exceed any single
          per-shard figure by up to eightfold. No static byte figure and no
          measurement exists, so fit under the unchanged 2 GB ceiling is
          UNPROVED and is disclosed as open, carried forward from
          EXP-SYC-793304 unchanged.
        widening_disclosure:
          finding_id: RT-82A8CB-OBJ5 and its cost-model limb CMC-2
          statement: >-
            THE B_0 REPAIR WIDENS THE QUANTITY BEING FITTED. The aggregate now
            includes max_t B_0(t) on top of an already-unproved fit, and the
            predecessor did not disclose that its own repair did so. That is
            disclosed here. No byte figure exists for B_0 either, so the
            widening is qualitative and is not quantified; quantifying it
            requires an implementation that does not exist.
          cap_raised: false
        cap_raised: false
        disposition: OPEN_CARRIED_FORWARD
      item_C_peak_kat_coverage_repair: >-
        See items_A_through_D_repairs.C-PEAK-KAT-PARTIAL-OVERLAP-COVERAGE-GAP
