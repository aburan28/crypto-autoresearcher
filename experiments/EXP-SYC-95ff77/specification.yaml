  # ---------------------------------------------------------------------------
  # PROMINENT HA-2 LIMITATION STATEMENT. Logic and conclusion unchanged from
  # EXP-SYC-793304 / EXP-SYC-edf98d / EXP-SYC-dc854f. TWO CHANGES, BOTH
  # DISCLOSED: (i) the RT-82A8CB-OBJ15 narrowing of the foreclosure to "from the
  # committed heuristics alone"; (ii) the family-size operative statement of
  # RT-82A8CB-OBJ7. No number in it changes.
  # ---------------------------------------------------------------------------
  prominent_ha2_limitation_statement: >-
    THIS DESIGN CANNOT SUPPLY A NON-VACUOUS SIMULTANEOUS (FAMILYWISE) TAIL
    GUARANTEE FOR candidate_index OCCUPANCY, AND THAT IS PROVED BELOW RATHER
    THAN MERELY ASSERTED. A justified worst-case contract IS supplied and it is
    NEGATIVE: the deterministic per-tuple bound 8*(L-1) equals 504, 1016, 2040,
    4088, and 8184 at bits 18/21/24/27/30 and exceeds capacity 32 at every
    ladder size. A justified TUPLEWISE tail contract IS supplied and it is
    SHARP but NON-CERTIFYING: from HA-2's expectation alone the best possible
    bound is P(X >= 33) <= mu/33, attained exactly by the mandated negative KAT
    X=33 with probability mu/33 and X=0 otherwise. Extending either bound over
    the accounting tuples of one size by a union bound is VACUOUS at every
    ladder size and at the tabulated gamma_x slices 5/18 and 1/3 (the familywise
    bound ranges from 938.297567 to 1489.454545 at gamma_x=5/18 and is
    2978.909091 at gamma_x=1/3 under the m = 98304 accounting-tuple count, all
    far above 1), and it remains vacuous under HA-3's second-moment shape for
    every admissible kappa >= 1. THE COST: capacity 32 is not certified adequate
    in any probabilistic sense; the thirty-third distinct value continues to
    invalidate the apparatus without truncation; no bound on the probability of
    mid-run invalidation exists, so no per-attempt-cost times
    inverse-success-probability bookkeeping and therefore no cost, frontier,
    dominance, or advantage claim is admissible FROM THE COMMITTED HEURISTICS
    ALONE; and the HA-2 promotion gate for numbered heuristics with archived
    validation remains unsatisfied, which caps any dependent claim below
    `supported`.
  prominent_statement_change_disclosure:
    change_1_rt_82a8cb_obj15_narrowing:
      predecessor_text_replaced: >-
        "no cost, frontier, dominance, or advantage claim is admissible from
        this design even after a future implementation"
      successor_text: >-
