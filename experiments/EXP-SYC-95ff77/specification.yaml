        falsification_condition_provenance: V4_RESTORATION_ITEM_4_BYTE_EXACT_DO_NOT_RE_TOUCH

      contract_3_simultaneous_tail:
        id: HA2-SIMULTANEOUS-C3
        status: NOT_SUPPLIED_AND_PROVED_UNAVAILABLE_FROM_COMMITTED_HEURISTICS
        kind: simultaneous (familywise) tail over the 98304 tuples per size
        lemma_L2_first_moment_union_bound:
          statement: >-
            A union bound over the 98304 accounting tuples per size gives
            P(any tuple overflows) <= 98304 * mu / 33 = 2978.909090909091 * mu.
          serialization_convention: six decimal places
          rows:
            - {bits: 18, gamma_x: 5/18, familywise_bound: '1489.454545'}
            - {bits: 21, gamma_x: 5/18, familywise_bound: '1326.953145'}
            - {bits: 24, gamma_x: 5/18, familywise_bound: '1182.180856'}
            - {bits: 27, gamma_x: 5/18, familywise_bound: '1053.203409'}
            - {bits: 30, gamma_x: 5/18, familywise_bound: '938.297567'}
          ceiling_row: {gamma_x: 1/3, familywise_bound: '2978.909091'}
          vacuity: >-
            Every value exceeds 1 by two to three orders of magnitude, so the
            bound is vacuous at every ladder size and at both gamma_x slices.
            It is recorded because a vacuous bound is a result, not a gap.
          vacuity_provenance: V4_RESTORATION_ITEM_9_BYTE_EXACT_DO_NOT_RE_TOUCH
          non_vacuity_requirement:
            condition: mu <= 33/98304 = 11/32768
            exact_literal: '0.000335693359375'
            shortfall_factor_equals_the_familywise_bound: true
            interpretation: >-
              HA-2's mean would have to be smaller by a factor of at least
              938.297567 (bits 30) and at most 1489.454545 (bits 18) at
              gamma_x=5/18, and by 2978.909091 at the gamma_x=1/3 ceiling,
              before even a vacuity-free union bound existed. The gap is not
              marginal and cannot be closed by choosing a different ladder size
              within the frozen scope.
            interpretation_provenance: V2_RESTORATION_BYTE_EXACT_DO_NOT_RE_TOUCH
          union_bound_conservatism_note: >-
            The union bound requires no independence, which is why it is used
            here. HA-2 supplies no independence across tuples either, so a
            Poissonization or inclusion-exclusion refinement is not available
            as an alternative.
          union_bound_conservatism_note_provenance: V2_RESTORATION_BYTE_EXACT_DO_NOT_RE_TOUCH
          family_size_used_in_this_lemma: 98304
          family_size_pointer: >-
            This lemma states the family as 98304 accounting tuples. The
            operative-versus-loose reconciliation of 98304 against 32768 is at
            merged_parallel_lane_exp_syc_75f7d2.family_size_reconciliation. NO
            FIGURE IN THIS LEMMA CHANGES; the m = 98304 figures above are the
            valid, threefold-loose variant and are retained exactly.
        lemma_L3_second_moment_route_also_vacuous:
          statement: >-
            Using HA-3's kappa_N = E[X^2]/E[X], Markov applied to X^2 gives
            P(X >= 33) = P(X^2 >= 1089) <= kappa*mu/1089, and the familywise
            bound is 98304*kappa*mu/1089. Non-vacuity requires
            kappa*mu <= 1089/98304 = 363/32768.
          exact_literal_threshold: '0.011077880859375'
          why_it_fails: >-
            For nonnegative integer X, X^2 >= X pointwise, so E[X^2] >= E[X]
            and therefore kappa >= 1 always. The smallest mu anywhere on the
            frozen ladder is 0.3149802624737183 at bits 30 under gamma_x=5/18.
            Hence kappa*mu >= 0.3149802624737183 > 0.011077880859375 at every
            ladder size and at both gamma_x slices, so the second-moment
            familywise bound is vacuous for every admissible kappa.
          why_it_fails_provenance: V4_RESTORATION_ITEM_10_BYTE_EXACT_DO_NOT_RE_TOUCH
          conclusion: >-
            Adding HA-3's second-moment shape does not rescue the familywise
            bound. The obstruction is not the crudeness of the first moment.
          conclusion_provenance: V2_RESTORATION_BYTE_EXACT_DO_NOT_RE_TOUCH
        lemma_L4_zero_o1_convention_is_not_tail_safe:
          statement: >-
            The frozen zero-o(1) arithmetic convention must not be extended from
            HA-2's mean arithmetic to HA-3's kappa. Applying o(1)=0 to
            kappa_N = N^o(1) forces kappa = 1 exactly; but for a nonnegative
            integer X, E[X^2] = E[X] holds if and only if X is supported on
            {0,1} almost surely, which forces P(X >= 33) = 0.
          why_this_matters: >-
            A convention that yields P(overflow)=0 by fiat is not a
            certificate; it is the conclusion assumed. It also contradicts the
            design's own worst-case contract posture, under which occupancy up
            to 8*(L-1) is admissible. The convention is therefore admitted for
            HA-2 mean arithmetic only, exactly as the predecessor declared, and
            is explicitly refused for any tail statement.
          why_this_matters_provenance: V2_RESTORATION_BYTE_EXACT_DO_NOT_RE_TOUCH
          falsification_condition: >-
            Exhibit a nonnegative integer-valued X with E[X^2] = E[X] and
            P(X >= 2) > 0. None exists, so the degeneracy is real and the
            refusal stands.
        lemma_L5_what_would_be_required:
          statement: >-
            A non-vacuous familywise bound requires strictly more than the
            first two moments: either an explicit finite-N upper-tail
            assumption at the thirty-third value (for example a Poisson-type
            or exponential concentration statement for X), or a genuine
            higher-moment control, or an explicit dependence structure across
            the 98304 tuples.
          statement_provenance: V4_RESTORATION_ITEM_11_BYTE_EXACT_DO_NOT_RE_TOUCH
          worked_bound: >-
            For any integer m >= 1, Markov on X^m gives P(X >= 33) <=
            E[X^m]/33^m, and E[X^m] >= mu for nonnegative integer X, with
            equality only in the degenerate {0,1} case of L4. Even in that
            degenerate best case, the familywise bound at bits 18 requires
            33^m >= 98304*0.5 = 49152; since 33^3 = 35937 < 49152 <= 1185921 =
            33^4, no moment order below four suffices there, and any usable
            moment order must be justified by a new assumption that does not
            exist in H-SYC-b854f4.
          worked_bound_provenance: V2_RESTORATION_BYTE_EXACT_DO_NOT_RE_TOUCH
          status_of_that_assumption: >-
            NOT ASSUMED HERE. It is named as the required future numbered
            heuristic and its validation control, not adopted. This producer
            has no authority to approve an experiment and does not.
          status_of_that_assumption_provenance: V4_RESTORATION_ITEM_12_BYTE_EXACT_DO_NOT_RE_TOUCH
        mandatory_negative_kat_retained:
          id: NKAT-HA2-EQUAL-MEAN
          source: TASK-20260813-e04de4 required control CTRL-HA2-TAIL-BOUNDARY
          construction: >-
            For any displayed mean mu, let X=33 with probability mu/33 and X=0
            otherwise. Then E[X]=mu exactly, every displayed margin is preserved
            exactly, and a thirty-third distinct value occurs with positive
            probability.
          status: MANDATORY_AND_RETAINED
