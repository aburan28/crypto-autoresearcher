          null_object_control_role: >-
            THIS IS THE PACKAGE'S PRIMARY NULL-OBJECT CONTROL ON THE HA-2 AXIS,
            and it is SHARP rather than illustrative: it is exactly the Markov
            extremal law, so any argument inferring capacity adequacy, tail
            safety, or overflow improbability from an HA-2 mean margin MUST fail
            against it. A design that could not fail this control would not be a
            design.
        cost_of_the_missing_simultaneous_tail:
          - >-
            Capacity 32 is not certified adequate in any probabilistic sense at
            any ladder size, and the deterministic worst case says it is not
            adequate at all.
          - >-
            The thirty-third-distinct-value overflow rule remains mandatory
            and unavoidable: it is the only line of defence, and its firing
            probability cannot be bounded away from 1 across a full ladder.
          - >-
