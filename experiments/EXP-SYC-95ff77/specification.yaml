            is 2, but no stated identity binds it to peak_live_bytes.
          quantified_as: 'peak_live_bytes_hard_cap_bytes: absent'
          classification: open_non_blocking_observation_not_repaired_here
        - id: C-R4-baseline-memory-axis-uncited-so-the-peak-axis-of-the-gate-is-unsatisfiable
          new_in_this_successor: true
          finding_id: RT-82A8CB-OBJ16
          statement: >-
            The program's Pollard-rho baseline is recorded with "negligible live
            storage", which is UNCITED and is not a property of the method: van
            Oorschot-Wiener parallel rho stores a distinguished-point table whose
            size is a tuned parameter, and the whole point of the vOW analysis is
            the time-memory interpolation. TAKEN LITERALLY, IT MAKES THE
            peak_live_bytes AXIS OF THE NINE-AXIS DOMINANCE GATE UNSATISFIABLE,
            and the predecessor disclosed that consequence nowhere.
          direction_of_the_error: >-
            CONSERVATIVE FOR ANY FUTURE CANDIDATE. It makes the baseline look
            stronger, so it is not self-serving. That is recorded so the finding
            is not read as an accusation.
          what_this_successor_does: >-
            Retains the inherited baseline characterisation VERBATIM (replacing
            it would require a cited vOW DP-table size at each ladder size, which
            does not exist in this task's read scope and which this task will not
            invent) and files this gate residual beside it, which is the second
            of the two remedies the objection itself offered.
          objection_fully_discharged: false
          status: OPEN_DISCLOSED_NEW_IN_THIS_SUCCESSOR

