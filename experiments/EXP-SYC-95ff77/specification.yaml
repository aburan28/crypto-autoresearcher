        id: HA2-TUPLEWISE-C2
        status: SUPPLIED_SHARP_AND_NON_CERTIFYING
        kind: tuplewise (per-tuple) tail contract derived from HA-2 alone
        lemma_L1_statement: >-
          X is a nonnegative integer-valued count, so Markov's inequality gives
          P(X >= 33) <= E[X]/33 = mu/33 for any law with mean mu.
        lemma_L1_sharpness: >-
          Among nonnegative integer-valued laws with mean mu <= 33, the bound
          mu/33 is attained, so it is the best possible bound derivable from
          the mean alone. The extremal law is exactly the mandated negative
          KAT: X=33 with probability mu/33 and X=0 otherwise. No strengthening
          is available without an additional, separately stated assumption.
        assumption_number: >-
