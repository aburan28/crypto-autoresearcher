          quantified_as: 'measured_values_present: false on every peak axis row'
        - id: C-R3-peak-axis-has-no-declared-hard-cap
          statement: >-
            peak_live_bytes now has a measurement rule but no declared hard cap
            anywhere in the inherited compiler, unlike group additions, logical
