experiment:
  id: EXP-ASCON-746407
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-0e0e69; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-0e0e69
  question_id: RQ-ASCON-2dfd8b
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Measure zero-sum depth of the Ascon-family permutation over rate-confined versus unrestricted
    cubes at cube dimensions 1 to 20 and round counts 1 to 8, against a random-S-box null and a random-bijection
    null in the same invocation
  objective: 'The one uncertainty a run reduces is whether confining a higher-order derivative to
    the positions a duplex actually exposes changes the round depth at which the derivative still
    vanishes. Concretely: (i) for each cube dimension k the budget affords, what is the largest round
    count r at which the XOR-sum over a rate-confined k-cube is exactly zero in some output bit, and
    what is the same quantity for cubes drawn freely over the full state, with the difference between
    the two as the headline derived number; (ii) does the identical measurement against a null permutation
    -- same linear layer and constants, randomly drawn S-box -- produce a materially lower depth curve,
    which is the only evidence that the signal curve reflects the design rather than the state size
    and the linear layer; (iii) does the full random-bijection null collapse to depth 1 as structure
    demands, which is the instrument check. No attack is attempted, no key exists in this experiment,
    and no comparison to any published round reach is made or possible. The product is four depth
    curves with their cube-dimension ceiling and capacity-constant sweep stated.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: for the pinned implementation,
      at capacity constants C1..C3, at cube dimensions up to K, the rate-confined zero-sum depth curve
      was D_rate(k), the full-state curve was D_full(k), the random-S-box null curve was D_null(k),
      and the random-bijection null collapsed as predicted. WHAT DOES NOT FOLLOW: no attack, no distinguisher
      of cryptographic consequence, no security margin, no comparison to any published result''s round
      reach, no statement about cube dimensions above K, no statement about capacity constants outside
      the swept three, and nothing at all about Ascon''s security or about any deployed device.'
  inputs:
    procedure: 'STAGE 0 (human time, blocking): pin the permutation, the rate/capacity split, the
      bit ordering and the inter-block round count from primary text, or declare the candidate sets
      to sweep. STAGE 1 (about a day): implement a reference pure-Python permutation and a bitsliced
      64-bit-word evaluator, cross-checked on random inputs. STAGE 2 (minutes): run the test-vector
      gate through the full modes; halt on mismatch. STAGE 3 (minutes to hours of CPU): sweep k from
      1 to 20 and r from 1 to 8 for rate-confined cubes at three capacity constants, with a declared
      number of random cube draws per cell, XOR-accumulating exactly. STAGE 4 (same order of cost):
      repeat for full-state cubes. STAGE 5 (same, same invocation): repeat both sweeps for the random-S-box
      null and the random-bijection null. STAGE 6 (minutes): assert monotonicity in k and the k=0
      degenerate control, then emit depth curves, gap table, Hamming-weight distributions, seeds and
      evaluation counts into the run record.'
    instrument: Python 3.11 with numpy for bitsliced 64-bit-word evaluation of the permutation; a
      reference non-optimised pure-Python permutation for cross-checking; pytest for the test-vector
      gate and the tail checks; harness/runner.py for the run manifest, deterministic seeds and the
      inference block. No Sage, no computer algebra system, no MILP or SAT solver -- the measurement
      is direct evaluation and exact XOR accumulation, which is the whole reason it is affordable.
    parameters: 'Cube dimension k in 1..20, extended to 24 only if the curves have not separated by
      20 and the budget allows. Round count r in 1..8, covering both the reduced inter-block candidates
      and enough depth to see the curves die. Capacity constants: three declared values including
      one non-degenerate random constant and explicitly including the all-zero constant as a labelled
      special case. Cube draws: 32 independent random k-subsets per (arm, k, r) cell, with seeds recorded.
      Four arms: rate-confined signal, full-state signal, random-S-box null, random-bijection null.
      Cross-check sample 10000 random inputs between the reference and bitsliced evaluators.'
  controls:
  - 'Random-S-box null permutation: identical linear layer and constants, randomly drawn bijective
    S-box, same invocation, seed recorded.'
  - 'Random-bijection null: the whole permutation replaced by a keyed pseudorandom permutation over
    the state, whose depth must collapse.'
  - 'Fixed-capacity-constant sweep: the entire measurement repeated at three declared capacity constants,
    so a curve cannot be an artifact of one constant.'
  - Test-vector gate on the pinned permutation before any sweep, run through the full modes and not
    only the bare permutation.
  - Monotonicity assertion in k, checked automatically, since a decrease in measured depth with larger
    cubes is structurally impossible and indicates an accumulator bug.
  - Degenerate-cube control at k=0, where the sum is a single output state and must never be zero
    for a nondegenerate permutation.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A state-size-matched NULL PERMUTATION assembled in the same code, same
    invocation, from the identical linear layer and round-constant schedule but with the nonlinear
    layer replaced by a randomly drawn bijective S-box of the same width, drawn from a recorded seed.
    The identical cube summation, identical round sweep, identical cube dimensions and identical fixed-capacity
    constants are run against it. For the signal arm''s depth curve to mean anything, the null''s
    depth curve must sit clearly below it at matched k; if the two curves coincide, the measured depth
    reflects the linear layer and the state size rather than the design, and the correct record is
    a controlled null. A second null replaces the whole permutation with a random bijection realised
    as a keyed pseudorandom permutation over the state, whose depth curve should collapse to the smallest
    r for every k above 1.'
  independent_variables:
  - cube dimension k (1 to 20, possibly 24)
  - round count r (1 to 8)
  - cube family (rate-confined versus full-state)
  - permutation arm (pinned design / random-S-box null / random-bijection null)
  - fixed capacity constant (three declared values)
  metrics:
    primary:
    - zero-sum depth D(k) per arm and per cube family
    - the derived gap D_full(k) minus D_rate(k)
    - the derived gap D_signal(k) minus D_randomSbox(k)
    - fraction of drawn cubes achieving an exactly zero sum per (arm, k, r) cell
    secondary:
    - Hamming weight distribution of nonzero accumulated sums per cell
    - per-output-bit zero-sum incidence, to see whether vanishing is concentrated in particular positions
    - reference-versus-bitsliced cross-check agreement rate
    - permutation evaluations and wall-clock per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: G(k), the depth gap between unrestricted and rate-confined cubes at cube dimension k,
      and S(k), the depth gap between the pinned design and the random-S-box null at the same k.
    formula: 'D_family,arm(k) = max { r : there exists an output bit position b such that, for at
      least 50 percent of the 32 drawn k-subsets, XOR over all 2^k cube points of bit b of the r-round
      output equals 0 }. Then G(k) = D_full,signal(k) - D_rate,signal(k), predicted to be greater
      than or equal to 0 at every k by construction, with no magnitude pre-committed; and S(k) = D_rate,signal(k)
      - D_rate,randomSbox(k), predicted to be at least 1 for some k in the tested range, with S(k)
      identically 0 across the whole range recorded as a controlled null that blocks interpretation
      of the signal arm.'
    source: Pre-registered in the parent proposal IDEA-20260816-0e0e69 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are cube dimensions up to about 20 and round counts up to 8
      on a single machine, which is a small-derivative regime chosen because it is exactly enumerable
      rather than sampled. The transfer assumption is stated and is deliberately narrow: the arm-to-arm
      GAP at fixed k is compared, and no claim is made that a depth measured at k=20 predicts behaviour
      at k=64 or at the full round count. The experiment is therefore informative about the relationship
      between two subspace families under identical measurement and uninformative about absolute round
      reach, which is precisely the scope RQ-ASCON-2dfd8b''s claim-tier ceiling permits.'
    correspondence: null
  tail_checks:
  - k=0 degenerate cube, whose sum is a single output state and must not be zero.
  - k=1 cube, where the sum is a first-order derivative and behaviour is analytically predictable,
    used as a sanity anchor.
  - r=0 (identity), where the rate-confined sum must vanish for every k above 1 by linearity, confirming
    the accumulator is exact.
  - The all-zero capacity constant, flagged as a special case whose curve is reported separately and
    never merged with the random-constant curves.
  - The maximum affordable k, checked for accumulator overflow or truncation in the bitsliced evaluator.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt before any sweep if the permutation fails a declared test vector or if the reference and
    bitsliced evaluators disagree on any cross-checked input.
  - Halt and report an instrument defect if monotonicity of D in k fails, or if the r=0 or k=0 tail
    checks fail.
  - Stop extending k at the declared ceiling; if the curves have not separated by then, report a budget
    outcome and explicitly refuse to call it evidence of absence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All tail checks pass, the reference and bitsliced evaluators agree on every cross-checked
    input, the random-bijection null collapses to depth 1 above k=1, and the four depth curves are
    reported with G(k) and S(k) tabulated, their cube-dimension ceiling stated and the three capacity
    constants reported separately.
  falsification_criterion:
  - S(k) is identically 0 across the tested range, making the signal indistinguishable from a random-S-box
    permutation and forcing a controlled-null record.
  - The random-bijection null shows depth above 1 for any k above 1.
  - Depth is non-monotone in k, or the r=0 or k=0 tail checks fail.
  - Reference and bitsliced evaluators disagree on any cross-checked input.
  - The depth curves differ qualitatively between the three capacity constants, showing constant-dependence
    rather than subspace-family dependence.
  - Any declared test vector fails at the gate.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-0e0e69
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The rate/capacity split, the bit ordering and the inter-block round count are not pinned in this
    environment; a Coordinator must either file the primary texts as KN-LIT entries or ratify the
    candidate sweep as an acceptable substitute, noting the RQ constraint that forbids experiment
    design before both documents are filed.
  - The 50 percent threshold inside the depth definition is a judgement call and needs Coordinator
    ratification before the run, since moving it moves every curve.
  - Whether 32 cube draws per cell is enough to make a fraction-based depth stable is untested; a
    Coordinator should require a variance pilot at one cell before committing the full matrix.
  - The choice to hold capacity at a constant rather than at an unknown-but-fixed random value chosen
    per cube is a modelling decision about what a duplex adversary faces and should be settled by
    the Coordinator explicitly rather than inherited from this draft.
