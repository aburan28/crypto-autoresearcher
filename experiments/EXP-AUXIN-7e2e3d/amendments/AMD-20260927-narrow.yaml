# =============================================================================
# AMD-EXP-AUXIN-7e2e3d-20260927-narrow -- versioned ADDITIVE corrective
# amendment to EXP-AUXIN-7e2e3d, stated against H-AUXIN-6db354.
#
# NEW FILE. It rewrites nothing. specification.yaml, AMD-20260916-bands.yaml,
# AMD-20260923-d1d10.yaml, AMD-20260926-typed.yaml and H-AUXIN-6db354 stay
# byte-for-byte as committed. Any later change to this text is a NEW file under
# a NEW id, never an edit of this one.
#
# NARROW. It supersedes only the fields named by DEC-20260926-96f970 DF-1 to
# DF-6 and RI-1 to RI-9 (plus the custody consequences of adding one governing
# file, listed separately). Every other field of AMD-EXP-AUXIN-7e2e3d-20260926-typed
# is INCORPORATED BY CONTENT HASH and is not retyped, paraphrased or restated
# here. Where a held field is superseded only in part, the replaced span is
# identified by its first and last characters and by the sha256 of its exact
# text, and the rest of that field stays incorporated by hash.
#
# OUTCOME DISCIPLINE. This file states no census value, no minimising divisor,
# no list of curves from any earlier reading, no reviewer finding value and no
# integer that any control recipe produces. Records are cited by id. Design-time
# tool and locator transcripts are in the design directory named below and
# record integers only as bit length plus sha256.
# =============================================================================
amendment:
  id: AMD-EXP-AUXIN-7e2e3d-20260927-narrow
  experiment_id: EXP-AUXIN-7e2e3d
  hypothesis_id: H-AUXIN-6db354
  question_id: RQ-AUXIN-f8d8c0
  goal_id: GOAL-AUXIN-a93442
  batch_id: BATCH-7b6678
  producer_task: TASK-20260927-64ba3f
  producer_snapshot: TASK-20260927-f24bb2
  review_plan_id: REVIEW-AUXIN-20260927-7b6678
  decision_id: DEC-20260927-f680f7
  decision_id_note: >-
    The composing decision that approves or refuses this amendment. It does not
    exist when this file is written. See approval.
  recorded_at: '2026-09-27'
  kind: additive_corrective_amendment
  status: review_required

  # ---------------------------------------------------------------------------
  # APPROVAL GATE (NP-8).
  # ---------------------------------------------------------------------------
  approval:
    status: review_required
    approved_by: null
    approved_if_and_only_if: >-
      DEC-20260927-f680f7 is OFFICIAL (its ledger archive TASK-20260927-f77bfc
      verified against Git by tools/research_dispatch.py) AND its decision is
      approve AND it names AMD-EXP-AUXIN-7e2e3d-20260927-narrow. Under any other
      state of DEC-20260927-f680f7, or in its absence, this amendment is NOT
      approved, the held text it incorporates is NOT approved through it, and
      nothing is authorized.
    how_approval_is_recorded: >-
      In DEC-20260927-f680f7 only. Nothing in this file is edited afterwards,
      not even this block or the status field. A reader determines approval by
      reading that decision, never by reading this file.
    until_approved: >-
      No run, no implementation dispatch and no executor card may rely on this
      text or on the held text it incorporates. It is a design under review
      (REVIEW-AUXIN-20260927-7b6678).
    immutability: >-
      Bound by content in the producer snapshot TASK-20260927-f24bb2
      (path_sha256). Any revision, including one that a review requires, is a
      new file with a new id that cites this one.

  # ---------------------------------------------------------------------------
  # INCORPORATION BY HASH (NP-2).
  # ---------------------------------------------------------------------------
  incorporates:
    file: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
    id: AMD-EXP-AUXIN-7e2e3d-20260926-typed
    sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
    status_of_that_file: >-
      Refused by DEC-20260926-96f970 and never approved. It governs nothing on
      its own. Its fields govern a run only through this amendment, only as the
      governing_text_table below assigns them, and only if this amendment is
      approved.
    what_is_incorporated: >-
      Every field under the top-level key amendment of that file, read by a YAML
      safe loader, EXCEPT (a) the fields and spans listed in supersedes_fields
      and span_rules below, and (b) the envelope fields listed in
      envelope_not_incorporated. Each incorporated field governs exactly as its
      bytes read in the file whose sha256 is stated above.
    hash_check: >-
      Before any use, a reader or executor computes the sha256 of the named file
      and compares it with the value above. A mismatch means the incorporated
      text is not determined; the reader stops, and for a run it is an
      evidence-integrity stop before Stage A0 completes.
    span_hash_convention: >-
      A span is a contiguous substring of the string value of one held field as
      a YAML 1.1 safe loader returns it (folded scalars folded, so a line break
      inside a folded paragraph reads as one space). It begins at the first
      occurrence in that value of its "from" text and ends at the end of the
      first occurrence of its "through" text at or after that point. Its
      sha256 is taken over the UTF-8 bytes of the span. Each "from" text occurs
      exactly once in its field's value.
    reading_of_self_references: >-
      In incorporated text, "this file" means AMD-20260926-typed.yaml as bound by
      the sha256 above. "This text", "this amendment", "this protocol" and a
      reference of the form amendment.<path> mean the combined governing text:
      each field resolved through governing_text_table, so a reference to a
      superseded field or span reads its corrective replacement, and a
      reference to a field that this file adds under the same path (for example
      controls[C-FIELD].cases_extracted) reads that addition.

  envelope_not_incorporated:
    rule: >-
      These fields of AMD-20260926-typed.yaml describe that file's own identity,
      review round, approval route or authorization. They are NOT incorporated.
      The field of the same role in this file governs instead. They are not in
      supersedes_fields, because they carry no protocol content and no DF or RI
      item names them.
    fields:
      - id
      - predecessor_amendment
      - predecessor_status
      - batch_id
      - producer_task
      - producer_snapshot
      - review_plan_id
      - decision_id
      - decision_id_note
      - recorded_at
      - kind
      - status
      - approval (every sub-field)
      - defect (a provenance statement about the earlier refusal)
      - cites (provenance only; this file's cites apply)
      - authorization (bound to DEC-20260926-96f970, which refused; see authorization below)

  # ---------------------------------------------------------------------------
  # SUPERSEDED FIELDS (NP-2): exactly the DF/RI fields.
  # A field marked (span) is superseded only in the span given in span_rules;
  # the rest of that field stays incorporated by hash. A field marked (whole)
  # is replaced as a whole by the corrective text named.
  # ---------------------------------------------------------------------------
  supersedes_fields:
    - {field: change.D1_pins.parse_rules.PR-EIP197, extent: span EIP-R, item: DF-1}
    - {field: "change.D1_pins.rows[BN254-r].source", extent: span BN-K, item: "DF-1, RI-6"}
    - {field: change.D1_pins.confounder_check.clauses_in_order, extent: span FP-DEF, item: DF-2}
    - {field: what_the_controls_exercise, extent: span CTRL-FIELD, item: DF-2}
    - {field: tools_and_admission.certificate_and_factoring_library.minimum_version, extent: whole, replaced_by: corrective.tools.certificate_and_factoring_library.minimum_version, item: DF-3}
    - {field: tools_and_admission.certificate_and_factoring_library.version_command, extent: whole, replaced_by: corrective.tools.certificate_and_factoring_library.version_command, item: DF-3}
    - {field: tools_and_admission.admission_gate, extent: span ADM-3, item: DF-4}
    - {field: change.D6_factoring.timeouts, extent: span F2-RECOG, item: DF-4}
    - {field: interpretation_limits item 6 (the item beginning "On the two pairing-family rows"), extent: whole, replaced_by: corrective.interpretation_limits_item_6, item: DF-5}
    - {field: definitions.bins, extent: span BINS-EXACT, item: "DF-6, RI-2"}
    - {field: change.D3_descriptive_bins.bin_by_status, extent: whole, replaced_by: corrective.bin_by_status, item: DF-6}
    - {field: change.D6_factoring.ecm_curves_per_level, extent: span ECM-PROV, item: RI-7}
    - {field: change.D4_calibration.threshold_inventory, extent: span INV-CLAIM, item: RI-5}
    - {field: "success_criterion.outcomes[S_VALID_TABLE].condition", extent: span SV-NULL, item: RI-8}
    - {field: "success_criterion.outcomes[S_PARTIAL_TABLE].condition", extent: span SP-VOID, item: RI-8}
  custody_consequences:
    rule: >-
      Adding one governing file changes how many governing-text hashes custody
      must bind. These spans are superseded ONLY to add this file to the hash
      set and to the dirty-path refusal. They change nothing else and are
      necessary for NP-1: without them this file would govern a run without
      being hash-bound. No DF or RI item names them; they are listed here, apart
      from supersedes_fields, so that list stays exactly the DF/RI fields.
    fields:
      - {field: change.D8_custody.trial_plan, extent: span TP-FOUR}
      - {field: change.D8_custody.manifest, extent: "spans MAN-FOUR and MAN-DIRTY"}
      - {field: tools_and_admission.admission_gate, extent: span ADM-7}

  span_rules:
    - id: EIP-R
      field: change.D1_pins.parse_rules.PR-EIP197
      from: "r is the decimal integer captured by the FIRST match"
      through: "prime order q\\s*=\\s*([0-9]+) ."
      replaced_span_sha256: 3979d5e344c063097593eba562276028f04e27a044d00be3580cf9502b8ad847
      replacement: >-
        r is the decimal integer captured by the regular expression
        prime order `q\s*=\s*([0-9]+)` , in which each ` is the single character
        GRAVE ACCENT (U+0060) and every other character is read exactly as
        printed (Python re syntax, applied to the whole decoded file). This
        expression must match EXACTLY ONCE in the file; zero matches or more
        than one match is locator_failure.
    - id: BN-K
      field: "change.D1_pins.rows[BN254-r].source"
      from: "where K is the most recent commit"
      through: "records K, and retrieves"
      replaced_span_sha256: 01a5b3f33eb1ef5871fd38542c61e7f74ace7a3967506669166e2fe50c6f7b2b
      replacement: >-
        where K is the commit stated in rows[BN254-r].pinned_revision of
        AMD-EXP-AUXIN-7e2e3d-20260927-narrow. The executor does not resolve K
        again; it records K and retrieves
    - id: FP-DEF
      field: change.D1_pins.confounder_check.clauses_in_order
      from: "defined as every field prime extracted in Stage P"
      through: "together with the two C-FIELD expression values."
      replaced_span_sha256: c812fad5a24211149d4598cd04a1d781774b17625c81b9ff577eab60d03e2de2
      replacement: >-
        defined as the set of every field prime extracted in Stage P (by the
        row's field_prime_label or field_prime_locator) for any row, whether or
        not that row pinned, and NOTHING ELSE. No C-FIELD expression value,
        control integer or other constant of this text is a member of FP by
        definition. A C-FIELD case meets clause (1) only by being equal to an
        extracted field prime.
    - id: CTRL-FIELD
      field: what_the_controls_exercise
      from: "C-FIELD and C-FIELD-MUTATION exercise the confounder check on two rows."
      through: "C-FIELD and C-FIELD-MUTATION exercise the confounder check on two rows."
      replaced_span_sha256: 16f68c86a5cd7c9ef3f68a9c2daeceb3dfd48879c9d3d4259859ff25239f92d8
      replacement: >-
        C-FIELD exercises the confounder check on its two closed-form cases and,
        through controls[C-FIELD].cases_extracted, on every extracted field
        prime presented as r. C-FIELD-MUTATION exercises it on the two
        closed-form cases with clause (1) disabled.
    - id: ADM-3
      field: tools_and_admission.admission_gate
      from: "(3) PARI alarm self-test:"
      through: "within 10 seconds of wall clock."
      replaced_span_sha256: 21abc1bc242c70c94a0ef4021640ea56da77b17b33c687445f801f7281e54bfd
      replacement: >-
        (3) PARI alarm self-test: the program
        corrective.tools.alarm_self_test_program is run as a CHILD process,
        python3 -I -c "<program>", with the admitted interpreter, and the child
        is killed if it has not exited 10 seconds of wall clock after it was
        started. The item PASSES if and only if the child exits with status 0
        within those 10 seconds and its standard output, split on LF with the
        final empty string after the last LF dropped, is exactly the three lines
        ALARM, ALARM, 4. Any other exit status (including death by a signal), a
        kill, or any other output FAILS the item.
    - id: ADM-7
      field: tools_and_admission.admission_gate
      from: "(7) The four governing-text hashes match trial-plan.json."
      through: "(7) The four governing-text hashes match trial-plan.json."
      replaced_span_sha256: 35728537764f80250992085aec42b22dc8c90c64b1fcd9805284fd48393d7157
      replacement: >-
        (7) The five governing-text hashes of change.D8_custody.trial_plan match
        trial-plan.json.
    - id: F2-RECOG
      field: change.D6_factoring.timeouts
      from: "An alarm return (PARI error e_ALARM) means the call timed out;"
      through: "the timeout is recorded."
      replaced_span_sha256: 18a07fd86e7c84bb512cae7abe4f977932e2b0f80a57b640e7afcf12a338e103
      replacement: >-
        The call is evaluated by the cypari2 Pari instance of
        corrective.tools.certificate_and_factoring_library.stack_allocation, as
        p("alarm(A, factor(n))") with A and n written in decimal. RECOGNITION,
        in this order: (i) if the call raises cysignals.signals.AlarmInterrupt,
        caught by naming that class, the call timed out (that class derives from
        KeyboardInterrupt, not from Exception, so a handler for Exception does
        not catch it); (ii) if the call returns a PARI object of type t_ERROR
        whose errname is e_ALARM (the gp-interface form of the same event), the
        call timed out; in case (i) or (ii) the part stays unfactored and the
        timeout is recorded together with which form was observed; (iii) if the
        call returns an object of type t_MAT, the call completed and that matrix
        is its factorization; (iv) any other exception, any other return type,
        or termination of the process by a signal is a crash under
        stopping_rules (memory protection or crash), never a timeout. After (i)
        or (ii) the same Pari instance serves later calls; admission item (3)
        checks that it remains usable.
    - id: BINS-EXACT
      field: definitions.bins
      from: "For an EXACT value: NEAR_FLOOR if"
      through: "INTERMEDIATE otherwise."
      replaced_span_sha256: 7398d9d75b5a3f762dc5aadc5c57e3fb92c84297cb8c226a4572ecdd72b8211b
      replacement: >-
        For an EXACT value the rules are applied IN THIS ORDER and the first that
        applies gives the bin: (i) if boundary_flag is true, the value takes the
        bin on its lower-depth side, so s within tau of 3/4 gives INTERMEDIATE
        and s within tau of 1/4 gives NEAR_CEILING; (ii) NEAR_FLOOR if
        s >= 3/4 + tau; (iii) NEAR_CEILING if s <= 1/4 - tau; (iv) INTERMEDIATE
        otherwise. PRECEDENCE: the flag rule (i) precedes the cut-off rules (ii)
        and (iii). So s = 3/4 + tau exactly is flagged and gives INTERMEDIATE,
        s = 1/4 - tau exactly is flagged and gives NEAR_CEILING, and no s
        receives two bins.
    - id: ECM-PROV
      field: change.D6_factoring.ecm_curves_per_level
      from: "Provenance: the values follow"
      through: "not a claim about the tool."
      replaced_span_sha256: 39b36767d111ecf061c4daaea499dd403ed5c590e648992fe86fab43a3c72dc9
      replacement: >-
        Provenance: none external is claimed. The attribution of this column to
        a GMP-ECM README table, which an earlier design session made from
        recollection, is WITHDRAWN (VAL-20260927-b99738 coverage entry 8 found
        that it does not match the README it retrieved). The column is a
        declared constant of this protocol, fixed before any value was seen, and
        its determinacy does not depend on any external table.
    - id: INV-CLAIM
      field: change.D4_calibration.threshold_inventory
      from: "The COMPLETE list of numeric cut-offs and decision constants in this amendment, each with what it reads:"
      through: "The COMPLETE list of numeric cut-offs and decision constants in this amendment, each with what it reads:"
      replaced_span_sha256: 1f990bde9f4110cb577cbb7bd2c9c4da9d76be72aef25ffed799e8d2f6625db4
      replacement: >-
        The list of numeric cut-offs and decision constants, each with what it
        reads, is this field TOGETHER WITH corrective.threshold_inventory_added;
        only the two together are claimed complete:
    - id: SV-NULL
      field: "success_criterion.outcomes[S_VALID_TABLE].condition"
      from: "the null arm is complete;"
      through: "the null arm is complete;"
      replaced_span_sha256: 227e7d8109d43aef495a62e7ee5d6d2f6cf1d174ce98eb5868ccfac98a5d4fb7
      replacement: >-
        no deployed row is rejected by the confounder check; the null arm is
        complete, meaning that every sample of every bit class carries a recorded
        outcome (a status for each branch, or rejected by the confounder check
        and flagged); no null-arm branch is VOID and no null-arm sample is
        rejected;
    - id: SP-VOID
      field: "success_criterion.outcomes[S_PARTIAL_TABLE].condition"
      from: "one or more deployed branches are VOID"
      through: "The void branches are listed with reasons."
      replaced_span_sha256: 629f35ca7b7eed522d6963f2be1928bec61464e7fa082f0af666f2227f2ee3fd
      replacement: >-
        one or more of the following holds and nothing else differs: a deployed
        branch is VOID under a validity rule; a deployed row is rejected by the
        confounder check (invalid_measurement for that row, never factored,
        change.D1_pins.confounder_check.evaluation_and_recording); a null-arm
        branch is VOID; a null-arm sample is rejected by the confounder check
        (kept, flagged, not factored). Every such branch, row or sample is
        listed with its reasons.
    - id: TP-FOUR
      field: change.D8_custody.trial_plan
      from: "and of THIS file. The run recomputes all four"
      through: "and of THIS file. The run recomputes all four"
      replaced_span_sha256: e46004cf1ba43b254cbda9556e0d2513cb2573417fb2bd500cf763f8939359e7
      replacement: >-
        of AMD-20260926-typed.yaml, and of AMD-20260927-narrow.yaml. The run
        recomputes all five
    - id: MAN-FOUR
      field: change.D8_custody.manifest
      from: "the four governing-text hashes"
      through: "the four governing-text hashes"
      replaced_span_sha256: 54e0af4b03ed9e1c065dd5273fbd3c72eb870cd6d979e50636c39ae838926552
      replacement: the five governing-text hashes
    - id: MAN-DIRTY
      field: change.D8_custody.manifest
      from: "or this file."
      through: "or this file."
      replaced_span_sha256: 10f130cb58593ed9210b1411626353f9322c69c6e4e603686a5c60e18d1b10ca
      replacement: or either amendment file (AMD-20260926-typed.yaml, AMD-20260927-narrow.yaml).

  # ---------------------------------------------------------------------------
  # CORRECTIVE FIELDS. Whole-field replacements and additions. An addition
  # supersedes nothing; it adds a rule under the path it names.
  # ---------------------------------------------------------------------------
  corrective:

    pins:
      rows_BN254-r_pinned_revision:
        adds_to: "change.D1_pins.rows[BN254-r]"
        item: "DF-1, RI-6"
        K: 9e393a79d9937f579acbdcb234a67869259d5a96
        how_K_was_resolved: >-
          At design time, by the GitHub commits API query that the held text
          names (path EIPS/eip-197.md, until=2026-09-26T00:00:00Z, per_page=1).
          The API's until filter bounds the committer date; K's committer date,
          2022-05-06T07:29:09Z, lies years before the bound, so "strictly
          before" and "on or before" select the same commit. K is now a stated
          constant of this text and is not resolved again at run time.
        raw_url: https://raw.githubusercontent.com/ethereum/EIPs/9e393a79d9937f579acbdcb234a67869259d5a96/EIPS/eip-197.md
        expected_bytes: 8727
        expected_sha256: 96355ab680ea8fae76e05c69009e30bd0ec87f352bec9312515b1cbabc6fe89d
      rows_BLS12-381-r_expected_digest:
        adds_to: "change.D1_pins.rows[BLS12-381-r]"
        item: RI-6
        source: the pinned-revision file named in the held rows[BLS12-381-r].source (not restated)
        expected_bytes: 175678
        expected_sha256: deb806a9ab85ec417cb523524830354829e5e44d3bee11f077d9421bc128f67a
      retrieval_digest_check:
        adds_to: change.D1_pins.retrieval_rule
        item: RI-6
        rule: >-
          After writing each retrieved pinned-revision file and before any parse,
          the executor compares its sha256 with the expected_sha256 stated above
          for that source. A mismatch is an evidence-integrity stop of the
          package in Stage P before any factoring (outcome I_INFRA). No row is
          pinned from a file that does not match, and no other revision is
          substituted.
      null_arm_class_consequence:
        adds_to: null_arm.bit_classes
        item: DF-1
        rule: >-
          The null-arm bit classes are the exact bit lengths of the PINNED
          deployed r (held text). If a deployed row is UNPINNED and no other
          pinned deployed r has its bit length, that bit class has no samples.
          The null arm is then reported with that class named as absent and the
          reason (the UNPINNED row it would have mirrored). An absent class is
          not a VOID branch, does not by itself move the outcome from
          S_VALID_TABLE, and is not negative about any curve.
      pdf_digit_check_weakness:
        adds_to: change.D1_pins.pdf_digit_check
        item: RI-6
        declaration: >-
          The check is a substring test and is kept as written, not made
          positional. Its weakness is declared: for a printed digit string that
          is short (a cofactor h of one or two digits, for example), occurrence
          somewhere in the normalized PDF text is near certain and the check
          then has almost no discriminating power. A PASS on a string shorter
          than 20 characters is recorded in pdf_check.json with its length and is
          not read as evidence that the value was checked against the PDF. The
          value itself stays governed by its parse rule and, where it applies, by
          the hasse clause of the confounder check.
      deployed_rows_roles_and_order:
        adds_to: definitions.deployed_row
        item: RI-5
        rule: >-
          Deployed-row ids, roles and order are READ FROM specification.yaml
          frozen_curve_list (governing layer v1). change.D1_pins.rows lists the
          same ten ids in the same order; that list governs each row's source,
          parse rule and cross-checks only. The two lists were compared at
          design time and agree (design report). A run that finds them different
          stops in Stage P with outcome I_TEXT.

    controls:
      C-FIELD_cases_extracted:
        adds_to: "controls[C-FIELD]"
        item: DF-2
        path_name: controls[C-FIELD].cases_extracted
        rule: >-
          For EVERY row whose field prime was extracted in Stage P (whether or
          not the row pinned) there is one case, id CF-X-<row id>. Its value is
          that extracted field prime, taken from the Stage P record and not
          restated in any text. It is presented to the confounder check as an r
          with NO printed cofactor, so the hasse clause does not apply to it.
          Expected reason list: exactly [field_prime]. No integer of any such
          case is written in this text.
        why_the_expected_reasons_are_fixed: >-
          Each extracted field prime is proved prime at run time
          (change.D7_certificates); hence not_prime does not fire. Under the
          corrected FP each value is a member of FP, so field_prime fires. The
          hasse clause does not apply because no cofactor is presented.
        mutation_sensitivity: >-
          If FP omits the extracted field prime of any row, that row's case is
          admitted and the gate below fails with outcome N2. In particular an FP
          built from the two C-FIELD expression values only (reviewer mutation
          M-FP of DEC-20260926-96f970 DF-2) admits every case whose row's field
          prime is not one of those two values, and the gate fails. The
          design-time locator run evaluated both FP definitions against these
          cases (execution-transcripts.json, pin_locators.fp_and_mutation).
      C-FIELD_gates_added:
        adds_to: "controls[C-FIELD].gates"
        item: DF-2
        gates:
          - >-
            Each case of cases_extracted must be rejected before any factoring,
            and its recorded reason list under the confounder check as written
            must be exactly [field_prime]. Any other result is outcome N2
            (success_criterion N2_CONFOUNDER_CHECK_FALSIFIED reads "a C-FIELD
            case", which includes these cases).
          - >-
            Order of evaluation: the extraction_cross_check gate of every
            closed-form case (outcome I_TEXT on failure) is evaluated first, then
            the reason-list gates of all cases, closed-form and extracted. The
            results of cases_extracted are written to confounder_receipt.json
            under their own key.

    tools:
      certificate_and_factoring_library:
        minimum_version:
          item: DF-3
          value: cypari2 2.1.5 with its PARI library 2.15.4
          rule: >-
            Admission item (1) requires the cypari2 distribution version to be at
            least 2.1.5 and the PARI library version reported through it to be
            at least 2.15.4. cysignals has no minimum version; its version is
            recorded, and admission item (3) decides whether the installed
            cypari2 and cysignals pairing can be admitted.
        version_command:
          item: DF-3
          command: python3 -I -c "<program>" with <program> equal to corrective.tools.version_program
          parse: >-
            Standard output, split on LF with the final empty string after the
            last LF dropped, must be exactly three lines. Line 1 is the cypari2
            distribution version and line 3 the PARI library version; each must
            fully match [0-9]+\.[0-9]+\.[0-9]+ . Line 2 is the cysignals
            distribution version, recorded as printed. A non-zero exit status,
            another line count or a non-matching line 1 or 3 FAILS admission
            item (1). Versions are compared as integer triples.
          why: >-
            No cypari2 release executed at design time defines
            cypari2.__version__ (execution-transcripts.json,
            cypari2_builds.*.typed_version_command_as_held). The distribution
            version comes from importlib.metadata and the PARI version from
            Pari.version(), whose first three entries are the PARI version
            integers.
        declared_builds:
          item: DF-3
          declared_minimum: cypari2 2.1.5, cysignals 1.11.4, PARI 2.15.4 (bundled), CPython 3.12
          declared_latest: cypari2 2.2.4, cysignals 1.12.6, PARI 2.17.2 (bundled), CPython 3.12
          gp_builds_probed: gp 2.15.4 and gp 2.17.4 (built from source), gp 2.17.3 (Homebrew)
          note: >-
            These are the builds on which admission items (1), (3) and (4) and the
            timeout recognition of change.D6_factoring.timeouts were executed at
            design time. Admission decides for any other build. The pairings
            cypari2 2.1.5 or 2.2.0 with cysignals 1.12.6 pass item (1) and FAIL
            item (3) (the child dies by signal), so admission refuses them as an
            infrastructure stop.
        stack_allocation:
          item: RI-7
          rule: >-
            Every cypari2 Pari instance that path A uses (factoring, primecert,
            primecertisvalid and high-precision evaluation) is created as
            cypari2.Pari(size=2**27, sizemax=2**32): an initial PARI stack of
            2^27 bytes, allowed to grow to 2^32 bytes. A PARI stack overflow at
            that ceiling is a crash under stopping_rules, never a result.
      version_program: |-
        import importlib.metadata as m, cypari2; p = cypari2.Pari(); print(m.version('cypari2')); print(m.version('cysignals')); print('.'.join(str(int(x)) for x in p.version()[:3]))
      version_program_sha256: 5701a5e33b9bb8e413374fbdd4715ec3fc08f442d589a7080694b4eab0709dc5
      alarm_self_test_program: |
        import cypari2
        from cysignals.signals import AlarmInterrupt
        p = cypari2.Pari(size=2**27, sizemax=2**32)
        for e in ('alarm(1, while(1, ))', 'alarm(1, factor(nextprime(2^140)*nextprime(2^141)))'):
            try:
                p(e)
                print('RETURNED')
            except AlarmInterrupt:
                print('ALARM')
        print(p('2+2'))
      alarm_self_test_program_sha256: fb9b43c9ba30c664e436a6ef945fd0ca6a3a3196773b1be15dde8aefe6075776
      program_hash_convention: sha256 of the UTF-8 bytes of the string value as a YAML safe loader returns it (the second program ends with one LF, the first with none).
      admission_gate_items_added:
        adds_to: tools_and_admission.admission_gate
        item: RI-7
        items:
          - >-
            (9) Execution audit. The AST audit of admission item (6) also FAILS if
            any module under implementation/typed/ calls exec, eval, compile or
            __import__, imports runpy, or uses importlib other than
            importlib.metadata. Code from any repository file outside
            implementation/typed/ is never executed by any route, whether import,
            exec or loading by path.
          - >-
            (10) Environment location. The resolved sys.prefix of the admitted
            interpreter and the resolved file path of every installed
            third-party distribution module lie OUTSIDE the repository working
            tree. An environment inside the repository fails admission, because
            its modules would be both allowed (import_rule class b) and
            forbidden (inside the repository, outside implementation/typed/).

    custody:
      run_entry_sys_path:
        adds_to: change.D8_custody.import_rule
        item: RI-7
        rule: >-
          Under python3 -I the directory of run.py is NOT on sys.path (executed
          at design time on CPython 3.10 and 3.12; execution-transcripts.json,
          isolated_mode_sys_path). run.py therefore inserts the absolute path of
          experiments/EXP-AUXIN-7e2e3d/implementation/typed/ at sys.path[0]
          before its first import of any module under that directory, importing
          only sys and os before doing so. That is the only change to sys.path
          the run makes, and it is recorded in import_audit.json.
      invalidation_rules_added:
        adds_to: invalidation_rules
        rules:
          - Any edit of AMD-20260927-narrow.yaml after approval - evidence-integrity failure.
          - Any byte difference between AMD-20260926-typed.yaml and the sha256 in incorporates.sha256 - evidence-integrity failure.

    bin_by_status:
      replaces: change.D3_descriptive_bins.bin_by_status
      item: DF-6
      text: >-
        For every branch of every deployed row, construction control, C-BOUND
        state and null-arm sample, three fields are reported: bin, bin_at_least
        and boundary_flag, each with exactly the value given here. EXACT: bin is
        given by definitions.bins; bin_at_least equals bin; boundary_flag is as
        definitions.bins defines it. BOUND: let s be the depth of the witnessed
        upper bound and boundary_flag the flag that definitions.bins computes on
        s. If boundary_flag is false and s >= 3/4 + tau, bin is NEAR_FLOOR and
        bin_at_least is NEAR_FLOOR (the true value is at least as deep).
        Otherwise bin is UNDETERMINED and bin_at_least is the bin that
        definitions.bins gives an EXACT value of depth s (so a witnessed depth
        within tau of 3/4 gives UNDETERMINED, bin_at_least INTERMEDIATE and
        boundary_flag true). VOID: bin, bin_at_least and boundary_flag are all
        null. UNPINNED rows have no branches and report none of the three. This
        clause and definitions.bins never give two answers, and no status and
        bin combination leaves bin_at_least undefined.
      totality_table:
        - {status: EXACT, bin: NEAR_FLOOR, bin_at_least: NEAR_FLOOR}
        - {status: EXACT, bin: INTERMEDIATE, bin_at_least: INTERMEDIATE}
        - {status: EXACT, bin: NEAR_CEILING, bin_at_least: NEAR_CEILING}
        - {status: BOUND, bin: NEAR_FLOOR, bin_at_least: NEAR_FLOOR}
        - {status: BOUND, bin: UNDETERMINED, bin_at_least: "INTERMEDIATE or NEAR_CEILING (the EXACT bin of s)"}
        - {status: VOID, bin: null, bin_at_least: null}
        - {status: UNPINNED, bin: none reported, bin_at_least: none reported}

    interpretation_limits_item_6:
      replaces: interpretation_limits item 6 (the item beginning "On the two pairing-family rows")
      item: DF-5
      text: >-
        BN254-r and BLS12-381-r are reported in their own stratum
        (expected_structure_flag true, change.D3_descriptive_bins.stratification).
        No status, bin, depth or other category is predicted for them, and no
        value on them is read as family-caused.
      reading_of_the_held_stratification_parenthetical: >-
        The parenthetical in change.D3_descriptive_bins.stratification (the two
        rows "whose family polynomials force divisors, CORR-20260923-187ea3")
        stays incorporated. It fixes stratum MEMBERSHIP only and cites the
        record behind that membership. It predicts no category and licenses no
        family-caused reading; the item above governs how those rows are read.
      not_edited: >-
        H-AUXIN-6db354 interpretation_limits, from which the replaced sentence was
        imported, is not edited by this file; its correction is a later card.

    threshold_inventory_added:
      adds_to: change.D4_calibration.threshold_inventory
      item: RI-5
      constants: >-
        Admission timeouts: 600 seconds for the ECM self-test (item 2) and 10
        seconds of wall clock for the alarm self-test child (item 3); the alarm
        length A = 1 second inside that self-test. Minimum tool versions: GMP-ECM
        7.0.4; cypari2 2.1.5 with PARI 2.15.4; pypdf 3.0.0 (held); Python 3.10.
        PARI stack: initial 2^27 bytes, ceiling 2^32 bytes. The screen's optional
        trial-division bound of at most 2^16 (conventions.Q0-5). PR-SEC2's
        continuation minimum of 4 characters. PR-EIP197's required match count
        of exactly one. The PDF short-string length 20 of
        corrective.pins.pdf_digit_check_weakness (a reporting label, no stop).
        Expected sha256 digests and byte counts of the two pinned-revision files
        (equality tests, no cut-off). No constant in this list reads a
        deployed-row or null-arm outcome, and each was fixed before any such
        outcome existed.

    falsification_condition_mapping:
      item: RI-1
      rule: >-
        Each falsification condition of H-AUXIN-6db354 (in its listed order,
        FC1 to FC6) is mapped to the outcome of this protocol that decides it.
        None is retired. Two are demoted, with reason.
      rows:
        - fc: FC1 (a constructed control fails a gate)
          outcome: N1_INSTRUMENT_FALSIFIED
          status: kept
        - fc: FC2 (a field prime presented as r is admitted)
          outcome: N2_CONFOUNDER_CHECK_FALSIFIED
          status: demoted in part
          reason: >-
            The controls can present only field primes that the text or Stage P
            makes available: the two closed-form C-FIELD cases and every
            extracted field prime (cases_extracted). A field prime of a curve
            outside the frozen list, or one no locator extracts, cannot be
            presented, so FC2 is decided for the extracted set only. A deployed
            row whose own r equals a member of FP is invalid_measurement for that
            row (held invalidation rule), not N2.
        - fc: FC3 (a reported exponent or bound below its analytic floor, or T_plus(d) < d)
          outcome: N3_FLOOR_VIOLATION
          status: kept
        - fc: FC4 (reported prime factors of an EXACT branch do not multiply back)
          outcome: >-
            N1 when the branch belongs to a construction control (its EXACT gate
            fails); for a deployed or null-arm branch the product check makes
            the branch VOID (C-PRODUCT; held invalidation rules), which gives
            S_PARTIAL_TABLE
          status: demoted
          reason: >-
            On a deployed or null-arm branch a product mismatch shows a defect in
            that branch's factorization record, not in the instrument as a whole,
            so the held text voids the branch instead of falsifying the
            instrument. On construction controls, where the correct factorization
            is fixed by the recipe, it falsifies the instrument as H states.
        - fc: FC5 (a declared-state BOUND evaluator control returns a value other than the one fixed)
          outcome: N4_BOUND_EVALUATOR_FALSIFIED
          status: kept
        - fc: FC6 (a row omits either branch)
          outcome: >-
            The row is incomplete, not negative. specification.yaml tail_checks
            item 1 (v1, "a missing branch voids the row") makes each omitted
            branch VOID, which gives S_PARTIAL_TABLE; an omission caused by a
            crash is I_INFRA.
          status: kept (as H states it, incomplete and not negative)

    reviewer_convention_zero_runs:
      item: RI-9
      convention: >-
        At zero runs a reviewer reads each gate that needs a pipeline
        factorization (the blind EXACT status of a construction control, the F3
        routing observation of C-PLANT-PL) as a RUN OBSERVATION. Its text is
        judged determinate when the expected value is fixed by the text alone
        (change.D5_controls.expected_status_convention); whether the pipeline
        attains that value is not reviewable before a run and is neither a
        pass nor a break of the text.

    declared_not_superseded:
      - item: "RI-3 (C-PLANT-PL tolerance)"
        field: "controls[C-PLANT-PL].declared_properties"
        declaration: >-
          The phrase giving an absolute tolerance on s is kept. The declared
          property is a design statement read by no gate; C-PLANT-PL's gates
          (plus minimiser, gap within the control gate tolerance, bin) are
          unaffected by it, and the conclusion it supports survives with a
          relative bound. Editing a construction-control field would reopen
          regression group R-D4, which held twice. Revisit when any later
          amendment edits C-PLANT-PL for another reason.
      - item: "RI-3 (minus-branch generator label)"
        field: change.D2_typed_costs.input_models
        declaration: >-
          Kept as written. The split of the label into the 2010 source's two
          cases cannot be written by this session, which has not read that
          source (a recalled reference would be a pointer only); and D2 lies in
          regression group R-D2D3. The typed costs, which the label annotates,
          are unchanged. Revisit: a later card whose producer has read the 2010
          source and records it as retrieved.
      - item: RI-4
        field: none in this file
        declaration: >-
          Addressed in the design report's route_ruling, which names the
          superseded cost fields and lists the extensions not named in
          H-AUXIN-6db354. This file carries no route ruling.
      - item: "observation (not a DF or RI item): pypdf minimum"
        field: tools_and_admission.pdf_text_extractor.minimum_version
        declaration: >-
          Kept as written (pypdf 3.0.0). PyPI has no pypdf 3.0.0 release; the
          first 3.x release is 3.1.0 (execution-transcripts.json). The minimum
          still decides admission determinately, since every existing release
          compares as an integer triple, so this is not a defect and NP-2 keeps
          the field held.

  # ---------------------------------------------------------------------------
  # PRECEDENCE AND GOVERNANCE.
  # ---------------------------------------------------------------------------
  precedence: >-
    Every field the protocol reads has exactly one governing layer, named in
    governing_text_table: v1 (specification.yaml), refused-typed-by-hash
    (AMD-20260926-typed.yaml, bound by sha256 and incorporated through this
    file), or corrective (this file). No field is decided by reading two layers.
    A v1 field that the held text supersedes is governed by the held text; a
    held field or span that this file supersedes is governed by this file.
  governs_nothing:
    - experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260916-bands.yaml (every field, every committed version; the held supersedes_fields last item)
    - experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260923-d1d10.yaml (refused by DEC-20260923-a4c3d5; no field governs)
  does_not_rewrite:
    - experiments/EXP-AUXIN-7e2e3d/specification.yaml
    - experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260916-bands.yaml
    - experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260923-d1d10.yaml
    - experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
    - experiments/EXP-AUXIN-7e2e3d/implementation/ (every existing file)
    - experiments/EXP-AUXIN-7e2e3d/runs/ (every existing run)
    - ledger/hypotheses/H-AUXIN-6db354.yaml
    - ledger/goals/GOAL-AUXIN-a93442.yaml
  cites:
    - DEC-20260926-96f970 (the refusal whose DF-1 to DF-6 and RI-1 to RI-9 this file discharges)
    - DEC-20260927-35dc6c (the opening decision of BATCH-7b6678; scope fixed at the narrow corrective amendment)
    - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-2fc87b/rescope-ranking.yaml (ranking option 3)
    - REVIEW-AUXIN-20260927-7b6678 (the plan this file is reviewed under)
    - H-AUXIN-6db354 (the governing statement)
    - AMD-EXP-AUXIN-7e2e3d-20260926-typed (incorporated by hash)
    - VAL-20260927-b99738, RT-20260926-40d75b, VAL-20260927-b27125 (the findings behind DF and RI items; cited by id, no value carried)
  design_record: >-
    coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-7b6678/design/TASK-20260927-64ba3f/design-report.yaml
    and execution-transcripts.json in the same directory (provenance only).

  authorization: >-
    This file authorizes NO run. If DEC-20260927-f680f7 approves it, the
    combined governing text (v1 as amended by the held text incorporated by hash
    and by this file) is an approved protocol under which a later Coordinator
    decision may mint an executor card for ONE census package (maximum_runs 1)
    running stages A0, P, C, N, D, R and T only. Under no outcome does it
    authorize running Cheon's algorithms, generating or using an auxiliary
    power, a protocol-supply audit, or stage2_protocol_supply_join.
    RUN-AUXIN-fd1edc and RUN-AUXIN-6117d3 are not rehabilitated. The first
    dispatch precondition of any executor card is an environment, outside the
    repository, that passes tools_and_admission.admission_gate as corrected
    here.
  non_claims:
    - AMD-20260927-narrow records no measurement and states no value for any curve; the held non_claims stay incorporated.
    - Design-time tool and locator executions are probes of the text's executability, not runs; no RUN-* id exists for them.

