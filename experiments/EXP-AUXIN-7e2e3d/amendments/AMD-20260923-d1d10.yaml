  # ---------------------------------------------------------------------------
  # DEFINITIONS. Every recipe and rule below uses these and nothing else.
  # ---------------------------------------------------------------------------
  definitions:
    integer_functions: >-
      isqrt(n) is the largest integer x with x*x <= n. icbrt(n) is the largest
      integer x with x*x*x <= n. ceildiv(a, b) is the least integer c with
      c*b >= a, for positive a and b. All arithmetic in recipes is exact integer
      arithmetic. No floating point is used in any recipe.
    prime: >-
      "prime" means prime in the mathematical sense. A search accepts a
      candidate only if every integer its acceptance rule names is prime.
      OPERATIONAL SCREEN: the Baillie-PSW test, defined as a strong
      probable-prime test to base 2 followed by a strong Lucas probable-prime
      test with Selfridge method A parameters (D is the first of 5, -7, 9, -11,
      13, ... with Jacobi symbol (D/n) = -1; P = 1; Q = (1 - D)/4). Trial
      division by small primes may precede it; that cannot change which
      candidate is first accepted. PROOF: every accepted integer is then proved
      prime by a certificate under change.D7_certificates. If a candidate passes
      the screen but its certificate run proves it composite, it is NOT
      accepted, the search continues from the next candidate, and the event is
      recorded. If the certificate run fails without proving compositeness,
      that is an infrastructure stop, never a skip.
    nextprime: >-
      nextprime_ge(x) is the least prime p with p >= x. nextprime_gt(x) is the
      least prime p with p > x. Each is searched upward by steps of +1 over the
      integers from its argument (even integers other than 2 may be skipped,
      since they are never prime).
    control_size: >-
      B = 256. M0 = 3 * 2^(B-2). Every integer within 2^(B-3) of M0 has exactly B
      bits.
    typed_costs: >-
      For a prime r and a branch b in {minus, plus}, let m_minus = r - 1 and
      m_plus = r + 1. For a positive divisor d of m_b:
      T_minus(d) = sqrt(m_minus / d) + sqrt(d)   (Cheon 2006 Theorem 1 leading expression);
      T_plus(d)  = sqrt(m_plus / d) + d          (Cheon 2006 Theorem 2 leading expression).
      e_b(d) = log2(T_b(d)) / log2(r). Admissible d is every positive divisor of
      m_b, including 1 and m_b. The two branches are never combined: no quantity
      in this amendment is a minimum over both branches.
    analytic_floors_and_ceiling: >-
      F_minus(r) = (1 + log2(r - 1)/4) / log2(r), the exact minimum over real
      x > 0 of log2(sqrt(m_minus/x) + sqrt(x)) / log2(r).
      F_plus(r) = (log2(3) - 2/3 + log2(r + 1)/3) / log2(r), the exact minimum
      over real x > 0 of log2(sqrt(m_plus/x) + x) / log2(r), attained at
      x = (m_plus/4)^(1/3).
      C_b(r) = log2(sqrt(m_b) + 1) / log2(r), the value at d = 1 on either
      branch.
    depth: >-
      For a value e on branch b, depth s = (C_b(r) - e) / (C_b(r) - F_b(r)).
      Mathematically F_b(r) <= e <= C_b(r), so s lies in [0, 1]; s near 1 means
      a divisor near the branch's analytic optimum, s near 0 means none.
    bins: >-
      Descriptive bins of a value with depth s, using declared constants only.
      NEAR_FLOOR if s >= 3/4. NEAR_CEILING if s <= 1/4. INTERMEDIATE otherwise.
      A value whose depth lies within 10^-45 of 1/4 or of 3/4 is reported with
      boundary_flag true and assigned the bin on the lower-depth side. Bins carry
      no stop, escalate, naming or decision semantics (change.D4_calibration).
    minimiser_and_ties: >-
      The branch minimum is the least e_b(d) over the explicit divisor set of the
      row status (change.D3_descriptive_bins). Ties: every divisor whose value is
      within relative 10^-100 of the minimum value is tied, and the reported
      minimiser is the SMALLEST tied divisor. On the minus branch d and m_minus/d
      always tie exactly, so the smaller member of that pair is reported.
    precision: >-
      Every logarithm, square root and cube root is evaluated with at least 150
      significant decimal digits. Path A and path B must agree on every reported
      exponent within 10^-50 absolute, and exactly on status, minimiser, bin and
      boundary_flag (change.D7_certificates, independent recompute).

  # ---------------------------------------------------------------------------
  # CHANGE. One clause per defect.
  # ---------------------------------------------------------------------------
  change:

    D1_pins:
      rule: >-
        Every deployed r is pinned AT RUN TIME, in Stage P, from the named
        primary-source file, by the locator given below. For each row the
        executor records in orders.json: the source file path, the sha256 of the
        source file's bytes, the first and last line numbers (1-based, as the
        file is stored) of the printed value, the verbatim text of those lines,
        the radix used, and the parsed r in decimal and hex. Parsing uses the
        radix the source prints: a 0x prefix or hex-digit groups mean base 16,
        otherwise base 10. Whitespace and line breaks inside the printed value
        are removed before parsing. No r is taken from code, from
        research/equation-schemes-20260905/parsed_safecurves.json, from any
        earlier run or from memory.
      locator_failure: >-
        If the named label cannot be found in the named file, or two named
        sources for one row disagree, the row is UNPINNED. It is reported with
        the failure text, never dropped and never filled from another source.
        UNPINNED is not a negative result.
      rows:
        - id: NIST-P-224
          source: inputs/SAFECURVES-20260825/specs/sp800-186.txt
          locator: parameter block of curve P-224, label n
          field_prime_locator: same block, label p
          cross_source: inputs/SAFECURVES-20260825/specs/sec2-v2.txt, block secp224r1, label n (must be equal)
        - id: NIST-P-256
          source: inputs/SAFECURVES-20260825/specs/sp800-186.txt
          locator: parameter block of curve P-256, label n
          field_prime_locator: same block, label p
          cross_source: inputs/SAFECURVES-20260825/specs/sec2-v2.txt, block secp256r1, label n (must be equal)
        - id: NIST-P-384
          source: inputs/SAFECURVES-20260825/specs/sp800-186.txt
          locator: parameter block of curve P-384, label n
          field_prime_locator: same block, label p
          cross_source: inputs/SAFECURVES-20260825/specs/sec2-v2.txt, block secp384r1, label n (must be equal)
        - id: NIST-P-521
          source: inputs/SAFECURVES-20260825/specs/sp800-186.txt
          locator: parameter block of curve P-521, label n
          field_prime_locator: same block, label p
          cross_source: inputs/SAFECURVES-20260825/specs/sec2-v2.txt, block secp521r1, label n (must be equal)
        - id: secp256k1
          source: inputs/SAFECURVES-20260825/specs/sec2-v2.txt
          locator: parameter block of curve secp256k1, label n
          field_prime_locator: same block, label p
          cross_source: none primary; experiments/EXP-CRYPTO-9225d2/specification.yaml arithmetic.curve.order_hex is compared as an internal consistency check only and cannot pin
        - id: brainpoolP256r1
          source: inputs/SAFECURVES-20260825/specs/rfc5639.txt
          locator: RFC 5639 section 3.4 (brainpoolP256r1), label q
          field_prime_locator: same section, label p
          cross_source: none
        - id: brainpoolP384r1
          source: inputs/SAFECURVES-20260825/specs/rfc5639.txt
          locator: >-
            RFC 5639 section 3.6 (brainpoolP384r1), label q, which
            CORR-20260923-64ee17 C1 places at lines 698-699 of this file. The
            executor records the span it actually finds; a different span is
            reported, not silently accepted.
          field_prime_locator: >-
            same section, label p, which CORR-20260923-64ee17 C1 places at lines
            683-684. The value at that span is the field prime and must be
            REJECTED as r (controls C-FIELD).
          cross_source: none
        - id: Ed25519-L
          source: inputs/SAFECURVES-20260825/specs/sp800-186.txt
          locator: parameter block of curve Edwards25519, label n (the prime order of the base point, not the field prime)
          field_prime_locator: same block, label p
          cross_source: >-
            inputs/SAFECURVES-20260825/specs/rfc7748.txt, the order of the
            curve25519 base point as printed there, evaluated as the expression
            printed (must be equal)
        - id: BN254-r
          disambiguation: >-
            THIS ROW IS alt_bn128, the BN curve y^2 = x^3 + 3 used by the Ethereum
            precompiles. The frozen spec's r_pin_source text "BN(2,254) /
            alt_bn128" names two different BN curves; this amendment fixes the
            row to alt_bn128 before any run under it. The b = 2 curve is not this
            row and is not added.
          source: >-
            RETRIEVED at Stage P and archived under the run directory as
            sources/eip-197.txt: Ethereum EIP-197 (https://eips.ethereum.org/EIPS/eip-197),
            the printed order of the group G1 (curve order). Fallback, in this
            order only: Ethereum Yellow Paper, Appendix E, the printed group
            order, archived as sources/yellowpaper-appendix-e.txt. Retrieval
            metadata (URL, UTC time, HTTP status, sha256) goes to
            sources/retrieval.json.
          field_prime_locator: same source, the printed field modulus p
          cross_source: >-
            BN family check. Find the integer u, if any, with
            36u^4 + 36u^3 + 24u^2 + 6u + 1 = p (p from the same source). Require
            r = 36u^4 + 36u^3 + 18u^2 + 6u + 1. No u is taken from any other
            source; failure makes the row UNPINNED.
        - id: BLS12-381-r
          source: >-
            RETRIEVED at Stage P and archived as sources/draft-irtf-cfrg-pairing-friendly-curves.txt:
            the latest retrievable revision of the IETF CFRG draft
            draft-irtf-cfrg-pairing-friendly-curves, parameter block BLS12_381,
            label r. The revision number is recorded.
          field_prime_locator: same block, label p
          cross_source: >-
            BLS12 family check with u from the same block: require
            r = u^4 - u^2 + 1 and p = (u - 1)^2 * (u^4 - u^2 + 1) / 3 + u.
      field_prime_confounder_check:
        applies_to: EVERY deployed row, before any factoring, and every control and null-arm integer.
        rule: >-
          REJECT the candidate r, with reason field_prime, if r equals the field
          prime printed for the same curve, or equals any field prime extracted
          for any row in Stage P. REJECT, with reason not_prime, if r is not
          proved prime under change.D7_certificates. Where the source prints the
          cofactor h, REJECT, with reason hasse, unless
          |p + 1 - h*r| <= 2*isqrt(p) + 2. A rejected deployed row is
          invalid_measurement for that row and is never factored.
        tested_by: controls C-FIELD, which must be rejected before any row is pinned.

    D2_typed_costs:
      source_statement: >-
        As fixed by CORR-20260923-187ea3 and DEC-20260923-ce06a6 (D2), from J. H.
        Cheon, Security Analysis of the Strong Diffie-Hellman Problem, EUROCRYPT
        2006, LNCS 4004. Theorem 1: for d | p - 1, given g, g^alpha and
        g^(alpha^d), alpha is computed in O(log p * (sqrt((p-1)/d) + sqrt(d)))
        group operations. Theorem 2: for d | p + 1, given the 2d consecutive
        powers g^(alpha^i), i = 1..2d, alpha is computed in
        O(log p * (sqrt((p+1)/d) + d)) group operations. Here p is the prime
        group order, called r in this experiment.
      provenance: >-
        retrieved and read by TASK-20260922-0e10d1 (CORR-20260923-187ea3
        citations; IACR archive copy). This design session did not open the
        paper. The J. Cryptology 2010 version was not read by anyone; a source
        giving a sqrt(d) second term for d | p + 1 would reopen the typing
        (CORR-20260923-187ea3).
      columns: >-
        Two separate column groups per row, never merged. MINUS group: cost
        T_minus, input model "P, [x]P, [x^d]P (one auxiliary power, exponent d;
        Cheon 2006 Theorem 1)". PLUS group: cost T_plus, input model
        "[x^i]P for i = 1..2d (2d consecutive auxiliary powers; Cheon 2006
        Theorem 2)". Every row, in each group, carries: status, the exponent (or
        its bounds), the minimiser d in decimal, bits of d (d.bit_length()), the
        input model string, and for the plus group log2(2d), the log2 of the
        number of consecutive powers the minimiser presupposes.
      what_is_omitted: >-
        The typed exponents use the theorems' leading expressions without the
        log p factor and without the O() constant, as the frozen specification
        did (its cost_model_disclosure optimistic_assumptions stand; direction of
        bias: understates operation counts). Memory is not tabulated.
      frozen_expression_on_plus: >-
        DROPPED. No artifact of a run under this amendment evaluates
        sqrt(m/d) + sqrt(d) on the plus branch, in any column, labelled or not.
        On the minus branch that expression IS T_minus, so the minus column
        continues the frozen quantity without change.
      no_combined_quantity: >-
        The frozen E(r) (a minimum over both branches) is not produced. The
        branches answer different problems with different inputs
        (CORR-20260923-187ea3).
      floor_invariant: >-
        Every reported exponent or bound on branch b must satisfy
        e >= F_b(r) - 10^-45. On the plus branch every evaluated witness d must
        also satisfy T_plus(d) >= d. A violation on either path is the negative
        outcome N3 (stopping_rules).

    D3_descriptive_bins:
      status_of_a_branch: >-
        EXACT when m_b is completely factored into primes, each proved under
        change.D7_certificates, and the product check holds. BOUND when a
        composite cofactor C_b > 1 remains after the budget (with a
        compositeness witness and a perfect-power check recorded). VOID when the
        branch fails a validity rule (product mismatch, certificate failure,
        path disagreement). UNPINNED rows have no branches.
      explicit_witness_set: >-
        EXACT: every positive divisor of m_b, enumerated from the certified
        factorization. BOUND: with m_b = F_b * C_b where F_b is the certified
        factored part, the witness set is W_b = {d, d*C_b : d | F_b}. Every
        member of W_b is an explicit divisor of m_b.
      values_by_status: >-
        EXACT: the exponent is the branch minimum over all divisors, with its
        minimiser. BOUND: the reported upper bound is the minimum over W_b (the
        witnessed minimiser is named), and the reported lower bound is F_b(r).
        The true branch exponent lies between them. A BOUND value is never
        reported as an exponent and never read as one.
      bin_by_status: >-
        EXACT: the bin of the exact value. BOUND: NEAR_FLOOR if the witnessed
        upper bound has depth >= 3/4 (the true value is at least as deep);
        otherwise the bin is UNDETERMINED, reported together with
        bin_at_least, the bin of the witnessed upper bound. VOID and UNPINNED:
        no bin.
      per_typed_reading: >-
        Bins are computed per branch with that branch's typed cost only. A
        minus-branch witness is never evaluated with T_plus, and the reverse.
      stratification: >-
        Every count or frequency of bins is reported separately for each
        stratum: deployed rows with expected_structure_flag false; deployed
        rows with expected_structure_flag true (BN254-r and BLS12-381-r, whose
        family polynomials force divisors, CORR-20260923-187ea3); constructed
        controls; and the null arm per bit class. Strata are never pooled in a
        reported frequency.
      semantics: >-
        None. A bin is a descriptive label. No bin, on any row, stops the run,
        triggers an escalation, names a curve, or is read as a property of how
        any curve was chosen.

    D4_calibration:
      choice: >-
        (b) ESCALATE SEMANTICS REMOVED. The table is descriptive. The frozen
        e_inert_floor and e_escalate_ceiling are retired and no rule, stop or
        reading uses them. A pre-registered null arm of random primes
        (amendment.null_arm) runs in the same package, is completed and written
        BEFORE any deployed row is factored, and is reported beside the deployed
        rows with the same statuses, bins and strata.
      threshold_inventory: >-
        The only numeric cut-offs in this amendment are declared constants: the
        bin cut-offs 1/4 and 3/4, the tolerances 10^-6, 10^-45, 10^-50 and
        10^-100, the precision floor, the windows, B, M0 and the null-arm size.
        None is a function of any deployed-row value, and none is a function of
        any null-arm value. No threshold is set after any value is seen.
      what_the_null_arm_is_for: >-
        Context only. It shows how often random primes of the same bit length
        receive each status and bin under the identical pipeline and budget. It
        licenses no curve-specific reading of any deployed row. A later
        amendment may pre-register a rule on the basis of this arm; this run's
        deployed rows are never re-scored by such a rule.

    D5_controls:
      rule: >-
        Every control is fully declared in amendment.controls below, BEFORE any
        code, by search start, step order, primality test, acceptance rule,
        window and tie-breaks. The executor implements exactly that text. A
        control integer that differs from what the text determines voids the run
        (invalidation_rules). The construction factorization is written to
        controls_construction.json and is NOT given to the factoring pipeline,
        which factors each control blind, exactly as a deployed row.

    D6_factoring:
      budget: >-
        Each integer m_b (every branch of every control, null-arm and deployed
        row) receives the full frozen factoring_seconds_per_integer of
        specification.yaml, measured as wall-clock seconds of the factoring
        subprocesses for that integer, on one worker. Factoring stops only when
        m_b is completely factored or that budget is spent. THERE IS NO BIT CAP:
        no integer and no cofactor is excluded from any stage by its size.
      pipeline: >-
        F0 trial division of m_b by every prime below 2^24. F1 every remaining
        part is tested for being a perfect power (and split if so) and screened
        for primality; prime parts go to certification and leave the pipeline.
        F2 every composite part of at most 272 bits goes to PARI/GP factor()
        (which runs its own ECM and MPQS), under a hard timeout equal to the
        budget remaining for m_b; parts are processed in ascending size. F3
        every composite part of more than 272 bits goes to GMP-ECM, run over the
        B1 ladder 2e3, 11e3, 5e4, 25e4, 1e6, 3e6, 11e6, 43e6, 11e7, 26e7, 85e7
        in ascending order, at each level for the number of curves that the
        installed GMP-ECM prints with -v as its expected curve count for that
        level (the counts are recorded at admission), repeating the last level
        if the ladder completes. Every factor found re-enters F1; any composite
        part that falls to at most 272 bits goes to F2. The 272-bit value routes
        a part between two methods; it never ends the budget.
      reporting: >-
        Per integer: seconds spent in each of F0 to F3, the ECM curves run at
        each B1 level with their sigma values, whether an F2 call timed out, the
        final list of certified prime powers, and any unfactored cofactor with
        its bit length, its compositeness witness and its perfect-power check.
        Certificate generation is timed separately and is not charged to the
        factoring budget.
      budget_semantics: >-
        A BOUND row means the full budget was spent without completing the
        factorization. It is not a statement that the integer resists
        factoring, and it is never negative evidence (core rule 5).

    D7_certificates:
      producing_library: >-
        PARI/GP. For each prime p >= 2^64: an ECPP certificate from primecert(p)
        (PARI format), checked on the producing side by primecertisvalid. For
        each prime p < 2^64, and for the terminal prime of every ECPP chain: a
        Pratt certificate, built by path A from the complete factorization of
        p - 1 (recursively, to the leaf 2) with a witness a.
      independent_verifier: >-
        A NEW library-free module, experiments/EXP-AUXIN-7e2e3d/implementation/d1d10/cert_verify.py,
        importing only the Python standard library (checked by an AST import
        audit recorded at admission). It shares no code with PARI, GMP-ECM, FLINT
        or sympy. Its version is the sha256 of its bytes at the run's code
        commit. It checks. (i) Pratt: the listed prime powers multiply to p - 1;
        a^(p-1) = 1 mod p; a^((p-1)/f) != 1 mod p for each listed prime f; each f
        carries its own valid certificate. (ii) ECPP step with (N, t, s, a4,
        P = (x, y)): m = N + 1 - t; s divides m and q = m/s; b = y^2 - x^3 - a4*x
        mod N; gcd(4*a4^3 + 27*b^2, N) = 1; [m]P is the point at infinity and
        [s]P is an affine point whose denominators are invertible mod N, both by
        exact arithmetic mod N; q > (c + 1)^2 where c is the least integer with
        c^4 >= N; the next step's N equals q; the chain's terminal q carries a
        valid Pratt certificate. (iii) Compositeness witnesses: a^(C-1) != 1 mod
        C for the recorded base a. This arithmetic runs on auxiliary curves over
        Z/NZ for primality proofs only; it involves no curve of the frozen list
        and no auxiliary-input power.
      criterion_provenance: >-
        The Goldwasser-Kilian and Atkin-Morain step criterion and Pratt's
        criterion are recalled by this design session (pointer, not support).
        The admission self-tests in tools_and_admission are what the run relies
        on.
      rule: >-
        No prime enters an EXACT branch, and no r is pinned, unless path A
        produced its certificate AND the independent verifier accepted it. A
        verifier rejection voids the branch (or the row, for r). sympy is not
        used for any primality verdict.

    D8_custody:
      trial_plan: >-
        A NEW file experiments/EXP-AUXIN-7e2e3d/implementation/d1d10/trial-plan.json
        records the sha256 of specification.yaml, of AMD-20260916-bands.yaml as
        it stands at the launch commit (context only) and of THIS file. The run
        recomputes all three at launch and at every stage boundary and stops,
        evidence-integrity failure, on any mismatch.
      no_self_hash: >-
        No artifact contains a hash of itself. Every recorded hash is of a file's
        final bytes, computed after the file is closed; a hashed file is never
        rewritten, renamed over or unlinked. orders.json is written once; its
        sha256 goes to the separate file orders.json.sha256 and to stdout.log
        before any factoring. That is the meaning of hash-committed in the
        frozen launch gate.
      manifest: >-
        manifest.yaml records dirty_summary (verbatim git status --porcelain=v1
        output at launch), the launch commit, the three governing-text hashes,
        every tool version from admission, and the inference block. Launch is
        refused if dirty_summary lists any path under implementation/d1d10/ or
        this file.
      snapshot: >-
        The snapshot archive that follows the run must declare IN path_sha256
        every file under the run directory (including sources/ and
        certificates/) and every file under
        experiments/EXP-AUXIN-7e2e3d/implementation/d1d10/. Side fields such as
        run_artifacts_sha256 or source_sha256 are not verifier-bound
        (CORR-20260923-64ee17 C6) and do not satisfy this rule. Until such a
        snapshot verifies, no record may cite the run.

    D9_labelling:
      rule: >-
        Per CORR-20260923-187ea3 labelling_rule_for_any_citing_record. The rho
        column is named rho_ordinary_input, value 0.5 (the frozen rho_baseline),
        and is annotated as the ordinary-input exponent of a different problem,
        in the same group-operation unit. Every typed exponent column name ends
        in E_ASSUMES_AUXILIARY_INPUT and names its branch. Every row states per
        branch the input model and the bits of d (change.D2_typed_costs). The
        table header cites DEC-20260802-204 B032-C7 and B032-C8. The phrase
        "identical accounting" does not appear unqualified in any artifact. The
        supply condition is stated in the header: every typed exponent is
        conditional on the named auxiliary input being supplied, which this
        experiment does not examine (IDEA-20260831-ccb587 unopened).
      applies_to: every artifact of the run, the execution report and any record that cites the run.

    D10_additivity:
      rule: >-
        This amendment is a new file and is never rewritten in place. Any later
        change is a new amendment file with a new id that cites this one. The run
        uses NEW implementation modules under
        experiments/EXP-AUXIN-7e2e3d/implementation/d1d10/ and edits no existing
        implementation file, so the code of earlier runs stays recoverable.

  # ---------------------------------------------------------------------------
  # TOOLS AND ADMISSION (D6, D7).
  # ---------------------------------------------------------------------------
  tools_and_admission:
    ecm_backend:
      name: GMP-ECM (the ecm command-line program)
      minimum_version: 7.0.4
      use: stage F3 of change.D6_factoring
    certificate_and_factoring_library:
      name: PARI/GP (gp binary, or libpari through cypari2)
      minimum_version: 2.13.0
      required_functions: [factor, primecert, primecertisvalid, version]
      use: stage F2 factoring, ECPP certificates, Pratt inputs, and path A high-precision evaluation
    independent_verifier:
      name: experiments/EXP-AUXIN-7e2e3d/implementation/d1d10/cert_verify.py
      version: sha256 of its bytes at the run's code commit
      dependencies: Python standard library only
    path_b_arithmetic:
      name: Python standard library (int, decimal with at least 150 digits, hashlib)
      minimum_version: Python 3.10
      use: independent recompute of products, certificate verification, divisor enumeration, typed exponents, depths and bins
    excluded_for_verdicts: sympy (no primality verdict, no factorization of record)
    admission_gate: >-
      Run BEFORE launch and written first into the run directory as
      admission_receipt.json. (1) Each named tool is present, and its exact
      version string (ecm -printconfig or ecm -version output; PARI version();
      python --version) is recorded and meets the minimum. (2) The GMP-ECM
      expected-curve counts for each B1 level of the ladder are read from ecm -v
      and recorded. (3) Certificate self-test: path A produces certificates for
      2^89 - 1 and 2^607 - 1 and the independent verifier accepts both. (4)
      Tamper self-test: the verifier REJECTS the certificate of 2^89 - 1 with its
      top N replaced by 2^89 + 1. (5) The import audit of cert_verify.py and of
      every path B module finds only standard-library imports. (6) The three
      governing-text hashes match trial-plan.json.
    absence_rule: >-
      Any failure of the admission gate is an INFRASTRUCTURE STOP: the run is not
      launched, the probe output is reported as failed_infrastructure, and no
      other tool, version or verifier is substituted. It is never a result about
      any curve or about this amendment's mathematics.

  # ---------------------------------------------------------------------------
  # STAGES, in this order. No stage starts before the previous one is written.
  # ---------------------------------------------------------------------------
  stages:
    - id: A0_admission
      does: tools_and_admission.admission_gate
    - id: P_pin
      does: >-
        Run controls C-FIELD first; both must be rejected. Then pin every
        deployed row per change.D1_pins, apply the confounder check, prove each r
        prime, write orders.json, then orders.json.sha256, and print the sha256
        to stdout.log. No factoring of any r - 1 or r + 1 happens in this stage.
    - id: C_controls
      does: >-
        Construct C-PLANT-M, C-PLANT-P and C-INERT exactly per their recipes and
        write controls_construction.json. Factor both branches of each control
        blind through the change.D6_factoring pipeline, certify, evaluate on
        path A and path B, apply every gate, and write controls_receipt.json with
        its sha256 printed. If any gate fails on either path, stop (N1).
    - id: N_null_arm
      does: >-
        Sample, pin-check, certify, factor, evaluate on both paths and bin every
        null-arm prime per amendment.null_arm. Write null_arm.json and print its
        sha256. Complete before any deployed factorization begins.
    - id: D_deployed
      does: >-
        Factor both branches of every pinned deployed row, in frozen-list order,
        certify, and evaluate on path A.
    - id: R_recompute
      does: >-
        Path B recomputes every deployed row (products, certificates, divisor
        enumeration, typed exponents, bounds, minimisers, depths, bins) and
        writes independent_recompute.json. Disagreement voids that branch.
    - id: T_table
      does: >-
        Emit typed_table.json with the labelling of change.D9_labelling, the
        deployed rows, the controls and the null arm beside them, per stratum.

  # ---------------------------------------------------------------------------
  # CONTROLS (D5). Recipes are complete; the integers are for reviewers to find.
  # ---------------------------------------------------------------------------
  controls:
    - id: C-PLANT-M
      kind: planted_positive_minus
      purpose: >-
        Known positive on the minus branch at deployed size: r - 1 carries a
        planted divisor at the Theorem-1 optimum, near sqrt(r - 1).
      search_start: >-
        S = isqrt(M0). d1 = nextprime_ge(isqrt(S)). d2 = nextprime_gt(d1).
        D = d1 * d2. u0 = ceildiv(M0, 2 * D).
      step_order: u = u0, u0 + 1, u0 + 2, ... (steps of +1 over the integers).
      primality_test: definitions.prime (Baillie-PSW screen, certificate proof).
      acceptance_rule: >-
        Accept the FIRST u in step order such that u is prime, u differs from d1
        and from d2, r = 2 * D * u + 1 is prime, and v = (r + 1) / 12 is an
        integer and prime.
      window: >-
        d1 must lie in [isqrt(S), isqrt(S) + 2^24); d2 in (d1, d1 + 2^24);
        u in [u0, u0 + 2^48). r must have exactly B bits. Leaving any window is
        an infrastructure stop, not a negative.
      tie_breaks: none needed; each search returns the first acceptable candidate in a total order.
      constructed_factorizations: r - 1 = 2 * d1 * d2 * u; r + 1 = 2^2 * 3 * v.
      gates:
        - The pipeline's blind factorization of each branch equals the constructed one as a multiset of prime powers, on both paths.
        - Every prime in both constructed factorizations carries a certificate the independent verifier accepts.
        - Minus branch is EXACT, its reported minimiser lies in {D, (r - 1)/D}, and 0 <= e_minus - F_minus(r) <= 10^-6.
        - Minus branch bin is NEAR_FLOOR.
        - Plus branch is EXACT and its bin is NEAR_CEILING.
    - id: C-PLANT-P
      kind: planted_positive_plus
      purpose: >-
        Known positive on the plus branch at deployed size, under the TYPED cost.
        The planted divisor sits at the Theorem-2 optimum near
        ((r + 1)/4)^(1/3). A divisor near sqrt(r) would not be a positive under
        T_plus, because T_plus(d) >= d.
      search_start: >-
        d0 = icbrt(M0 / 4) (M0 / 4 is an integer). d = nextprime_ge(d0).
        w0 = ceildiv(M0, 12 * d).
      step_order: w = w0, w0 + 1, w0 + 2, ... (steps of +1 over the integers).
      primality_test: definitions.prime (Baillie-PSW screen, certificate proof).
      acceptance_rule: >-
        Accept the FIRST w in step order such that w is prime, w differs from d,
        r = 12 * d * w - 1 is prime, and q = (r - 1) / 2 is prime.
      window: >-
        d must lie in [d0, d0 + 2^24); w in [w0, w0 + 2^48). r must have
        exactly B bits. Leaving any window is an infrastructure stop.
      tie_breaks: none needed; each search returns the first acceptable candidate in a total order.
      constructed_factorizations: r + 1 = 2^2 * 3 * d * w; r - 1 = 2 * q.
      declared_size_of_planted_divisor: d.bit_length() equals d0.bit_length() or d0.bit_length() + 1, and d is at least d0.
      gates:
        - The pipeline's blind factorization of each branch equals the constructed one as a multiset of prime powers, on both paths.
        - Every prime in both constructed factorizations carries a certificate the independent verifier accepts.
        - Plus branch is EXACT, its reported minimiser equals d, and 0 <= e_plus - F_plus(r) <= 10^-6.
        - Plus branch bin is NEAR_FLOOR.
        - Minus branch is EXACT and its bin is NEAR_CEILING.
    - id: C-INERT
      kind: inert_on_both_branches
      purpose: >-
        Known negative on both branches at deployed size. This is the PTM-2
        construction form of TASK-20260922-0e10d1 (r = 12w - 1 with w, (r - 1)/2
        and r prime), with the search start fixed by this text.
      search_start: w0 = 2^(B-4) (so 12 * w0 = M0).
      step_order: w = w0, w0 + 1, w0 + 2, ... (steps of +1 over the integers).
      primality_test: definitions.prime (Baillie-PSW screen, certificate proof).
      acceptance_rule: >-
        Accept the FIRST w in step order such that w is prime, r = 12 * w - 1 is
        prime, and q = (r - 1) / 2 = 6 * w - 1 is prime.
      window: w in [w0, w0 + 2^48). r must have exactly B bits. Leaving the window is an infrastructure stop.
      tie_breaks: none needed; the search returns the first acceptable candidate in a total order.
      constructed_factorizations: r - 1 = 2 * q; r + 1 = 2^2 * 3 * w.
      gates:
        - The pipeline's blind factorization of each branch equals the constructed one as a multiset of prime powers, on both paths.
        - Every prime in both constructed factorizations carries a certificate the independent verifier accepts.
        - Minus branch is EXACT, its minimiser is the smaller member of the tied pair {2, q}, and its bin is NEAR_CEILING.
        - Plus branch is EXACT, its minimiser is the largest divisor of 12, and its bin is NEAR_CEILING.
    - id: C-FIELD
      kind: field_prime_negative
      purpose: >-
        Known-invalid input for the D1 confounder check: a field prime presented
        as if it were r.
      cases:
        - >-
          The integer printed as p for brainpoolP384r1 in
          inputs/SAFECURVES-20260825/specs/rfc5639.txt section 3.6 (lines 683-684
          per CORR-20260923-64ee17 C1), presented as the brainpoolP384r1 r.
        - >-
          The integer printed as p for Edwards25519 in
          inputs/SAFECURVES-20260825/specs/sp800-186.txt, presented as the
          Ed25519-L r.
      acceptance_rule: none; these are not searched.
      gates:
        - Each case is REJECTED with reason field_prime by the confounder check, before any factoring, in Stage P.
    - id: C-PRODUCT
      kind: arithmetic_product
      purpose: frozen spec control, unchanged.
      gates:
        - For every EXACT or BOUND branch of every row, the product of reported prime powers (times the cofactor, if BOUND) equals m_b exactly, on path B.
    - id: C-RECOMPUTE
      kind: independent_recompute
      purpose: frozen spec control, strengthened by definitions.precision and change.D7_certificates.
      gates:
        - Path A and path B agree on every branch of every row within definitions.precision.
    - id: C-ORDER
      kind: ordering
      purpose: frozen spec control, strengthened.
      gates:
        - controls_receipt.json and null_arm.json exist, with their sha256 printed to stdout.log, before the first deployed factorization starts (timestamps in stdout.log and the stage order in execution-report.yaml).
  controls_distinctness: >-
    C-PLANT-M, C-PLANT-P and C-INERT are structurally distinct (their constructed
    factorizations differ in shape), so their r values cannot coincide.

  # ---------------------------------------------------------------------------
  # NULL ARM (D4). Frozen sampler, size and seed labels. Descriptive only.
  # ---------------------------------------------------------------------------
  null_arm:
    bit_classes: >-
      The distinct exact bit lengths of the r values of the deployed rows pinned
      in Stage P. They are fixed by the primary sources, not by any outcome.
    size_per_class: 16
    sampler: >-
      For bit class L and index i = 0, 1, ..., 15: label is the ASCII string
      "AMD-EXP-AUXIN-7e2e3d-20260923-d1d10/null/" followed by L in decimal, "/",
      and i in decimal, with no padding and no trailing newline. k = ceildiv(L, 8).
      X = the big-endian integer of the first k bytes of SHAKE-256(label), taken
      mod 2^(L-1). start = 2^(L-1) + X. The sample is nextprime_ge(start), searched
      upward by +1; if the search reaches 2^L it continues from 2^(L-1) upward.
    seed: The label prefix "AMD-EXP-AUXIN-7e2e3d-20260923-d1d10/null/" is the seed. No other randomness is used.
    pipeline: >-
      Identical to deployed rows. Confounder check (the field-prime clause is
      applied against every field prime extracted in Stage P, and the
      not_prime clause applies; the hasse clause does not, since a sample is no
      curve's order), certificate, full frozen factoring budget per branch,
      both paths, statuses, bounds, bins, stratum. A sample equal to a deployed r, or
      two equal samples, is kept and flagged.
    reported_beside_deployed: >-
      Per bit class and branch: the count of each status and bin, and the
      sorted list of exact exponents and of witnessed upper bounds. No
      statistic of the null arm enters any rule.
    disclosed_sampler_bias: >-
      nextprime of a uniform start weights each prime by the gap below it. This
      is a known small bias of the sampler and is disclosed, not corrected.

  # ---------------------------------------------------------------------------
  # PREDICTION, METRICS, BUDGET, STOPS, INVALIDATION, ARTIFACTS.
  # ---------------------------------------------------------------------------
  preregistered_prediction:
    quantity: the gate outcomes of C-PLANT-M, C-PLANT-P, C-INERT and C-FIELD
    formula: >-
      Every gate in amendment.controls holds on both paths. For the deployed rows
      and the null arm NO value is predicted; they are reported, not tested.
    source: >-
      The analytic floors in definitions (exact minima of the two leading
      expressions) and the constructed factorizations. Not tuned after any run.
  metrics:
    primary:
      - per row and branch - status, typed exponent (EXACT) or bounds (BOUND), minimiser d in decimal, bits of d, input model, and for the plus branch log2(2d)
      - per row and branch - depth s, bin, bin_at_least (BOUND), boundary_flag
      - per control - every gate verdict on path A and on path B
      - C-FIELD - rejection verdict and reason for each case
      - null arm - per bit class and branch, counts of statuses and bins
      - per row - product check and path agreement verdicts
      - per prime - certificate kind, producing-library check, independent-verifier verdict
    secondary:
      - per integer - seconds in each factoring stage F0 to F3, ECM curves per B1 level with sigma values, F2 timeouts
      - per integer - unfactored cofactor bits, compositeness witness, perfect-power check
      - per row and branch - bits of the largest divisor of m_b not exceeding isqrt(r) (EXACT), or of the largest such explicit witness (BOUND, a lower bound)
      - per control - number of candidates examined in each search
      - wall-clock per stage and peak RSS
  budget:
    enforcement: advisory
    maximum_runs: 1
    maximum_workers: 1
    maximum_memory_gb: 8
    factoring_seconds_per_integer: the frozen specification value, unchanged (change.D6_factoring)
    wall_clock_seconds_per_run: null
    wall_clock_note: >-
      Advisory, not a veto. Worst case is bounded by the number of factored
      integers (2 x (deployed rows + 3 controls + 16 x bit classes)) times
      factoring_seconds_per_integer, plus construction, certification and
      evaluation time. Expected to be dominated by the largest bit classes,
      where integers are likely to spend the full budget.
    construction_watchdog: >-
      Machine protection only. A control construction that has not finished its
      search within its declared window stops as infrastructure (the windows above).
    total_cpu_hours: null
  stopping_rules:
    - Admission failure - do not launch; failed_infrastructure; nothing substituted.
    - C-FIELD not rejected - stop in Stage P before any factoring; outcome N2.
    - Any control construction leaves its window - stop; failed_infrastructure (not negative).
    - Any control gate fails on either path - stop after writing controls_receipt.json; outcome N1; no null-arm or deployed factorization.
    - Any floor_invariant violation (change.D2_typed_costs) on any row, on either path - stop; outcome N3.
    - Governing-text hash mismatch at any stage boundary - stop; evidence-integrity failure.
    - Per integer - stop factoring when its budget is spent; keep the certified partial factorization; the branch is BOUND.
    - Memory protection or crash - checkpoint completed rows; incomplete rows are failed_infrastructure.
    - There is NO stop-and-escalate and no stop on any deployed value. After Stage C passes, the package runs every null-arm and deployed row to completion.
    - Never run Cheon's algorithm, never generate or consume any [x^i]P, never enter a protocol-supply stage.
  invalidation_rules:
    - All experiment.invalidation_rules of specification.yaml stand.
    - A pin not taken from its named source by its locator, or without recorded line numbers and file sha256 - that row is invalid_measurement.
    - A field prime used as r (detected at any time) - that row is invalid_measurement; never negative, never inert.
    - Adding, dropping or reordering a deployed row after Stage P begins - invalid_measurement of the package.
    - Any control integer that differs from what its recipe text determines, or any control built by an undeclared recipe - invalid_measurement of the package.
    - Any evaluation of sqrt(m/d) + sqrt(d) on the plus branch in any artifact, or any column combining the two branches - invalid_measurement of the table.
    - A prime in an EXACT branch without an independently verified certificate - that branch is VOID.
    - Path A and path B disagreement - that branch is VOID.
    - Any edit of this file, of specification.yaml or of AMD-20260916-bands.yaml after approval - evidence-integrity failure.
    - A hashed artifact rewritten after hashing, or a self-hash of a deleted pre-image - evidence-integrity failure.
    - Launch with a dirty implementation/d1d10/ or dirty amendment path - invalid_measurement of the package.
    - Timeout, crash, OOM or tool absence - failed_infrastructure; never a mathematical negative.
  required_artifacts:
    - admission_receipt.json
    - manifest.yaml (with dirty_summary, governing-text hashes, tool versions, inference block)
    - sources/ (retrieved primary sources) and sources/retrieval.json
    - orders.json and orders.json.sha256
    - controls_construction.json (recipe inputs, candidates examined, constructed factorizations)
    - controls_receipt.json (every gate, both paths)
    - null_arm.json
    - factorizations.json (every integer, per-stage seconds, ECM curves, cofactors and witnesses)
    - certificates/ (one file per certified prime, with producing-library and independent-verifier verdicts)
    - typed_table.json
    - independent_recompute.json
    - environment.json
    - command.txt
    - stdout.log
    - stderr.log
    - execution-report.yaml
    - implementation/d1d10/ (every module, cert_verify.py and trial-plan.json), all declared in the snapshot's path_sha256

  # ---------------------------------------------------------------------------
  # DECISION RULES.
  # ---------------------------------------------------------------------------
  success_criterion:
    outcomes:
      - id: S_VALID_TABLE
        kind: success
        condition: >-
          Admission passed; C-FIELD rejected; every gate of C-PLANT-M, C-PLANT-P
          and C-INERT held on both paths; no floor_invariant violation; every
          deployed row is PINNED (or UNPINNED with a recorded source failure)
          and every pinned deployed branch is EXACT or BOUND with product check
          and path agreement; the null arm is complete; every required artifact
          is present.
      - id: S_PARTIAL_TABLE
        kind: success_with_voids
        condition: >-
          As S_VALID_TABLE except that one or more deployed branches are VOID
          under a validity rule. The void branches are listed with reasons. Not
          negative about any curve.
      - id: N1_INSTRUMENT_FALSIFIED
        kind: negative
        condition: >-
          Any gate of C-PLANT-M, C-PLANT-P or C-INERT fails on either path. The
          typed census pipeline (factoring, certification, evaluation or
          binning) is falsified at size B, and no null-arm or deployed row is
          read.
      - id: N2_CONFOUNDER_CHECK_FALSIFIED
        kind: negative
        condition: A C-FIELD case is not rejected. The D1 pin procedure is falsified; nothing is factored.
      - id: N3_FLOOR_VIOLATION
        kind: negative
        condition: >-
          Any reported exponent or bound lies below its branch's analytic floor,
          or any T_plus(d) < d. The evaluator is falsified and the whole table is
          void.
      - id: I_INFRA
        kind: infrastructure
        condition: Admission failure, window exit, crash, timeout outside the per-integer budget, OOM or tool absence. Never negative.
    decidability: >-
      Each outcome is decided from the gate verdicts, statuses and invariants in
      metrics.primary alone. No deployed-row value decides any outcome.
  falsification_criterion: >-
    The amended census instrument is falsified by N1, N2 or N3. It is not
    falsified by any deployed-row or null-arm value, by a BOUND row, or by an
    infrastructure failure.
  interpretation_limits:
    - >-
      A typed, labelled arithmetic table at the pinned frozen orders only. Each
      exponent is conditional on the named auxiliary input being supplied; this
      experiment does not examine supply (IDEA-20260831-ccb587 unopened).
    - >-
      Exponents are those of the leading expressions of Cheon 2006 Theorems 1
      and 2 without the log p factor or O() constant, as read per
      CORR-20260923-187ea3. They are Cheon's known exponent realised at specific
      integers, not a new algorithm.
    - A BOUND row is a pair of bounds under the spent budget, never an exponent.
    - >-
      Bins are descriptive. No bin on any row is read as curve-specific, and the
      null arm is context, not a test.
    - >-
      Controls are at B = 256 bits. Their passing validates the pipeline at that
      size; transfer to the 224- to 521-bit rows is an assumption, most exposed
      where large rows are BOUND.
    - >-
      Nothing here concerns any claim outside experiment.claim_ceiling of
      specification.yaml, which stands unchanged, and the DEC-20260802-204
      acquisition gate stands.

  # ---------------------------------------------------------------------------
  # PROOF SEARCH MAP (inventor protocol section 8). Audits filled.
  # ---------------------------------------------------------------------------
  proof_search_map:
    not_applicable_reason: null
    bottleneck: >-
      Completeness of the factorizations of the largest rows within the frozen
      budget. It decides whether a branch is EXACT or BOUND, and a BOUND row can
      hide a deeper divisor than its witnesses show.
    baseline_embedding:
      parameter_slice: >-
        The minus branch with T_minus is exactly the frozen specification's
        cost_expression on r - 1, so the minus column reproduces the frozen
        quantity; F_minus is Cheon's balanced exponent on that branch.
      reproduction_check: >-
        C-PLANT-M must land within 10^-6 of F_minus at its planted divisor, and
        C-PLANT-P within 10^-6 of F_plus at its planted divisor.
    observation_collision:
      observable: the per-branch typed exponent and its bin
      distinct_preimage_search: >-
        Two collisions are named and separated. (1) The untyped frozen E(r) made
        the minus and plus problems collide in one number; the typed columns
        separate them. (2) An EXACT value and a BOUND upper bound can be equal;
        the status field separates them. Random primes producing the same bins
        as deployed rows are searched for by the null arm, which is why no bin is
        read as curve-specific.
    constructive_transforms: []
    constructive_transforms_note: >-
      None proposed. The object is a measurement protocol, not a mechanism to
      improve.
    quantifier_order: >-
      For each deployed row r, fixed by its primary source before any factoring,
      and for each branch b, under the fixed budget: the pipeline outputs either
      the minimum of e_b over ALL divisors of m_b (EXACT) or the minimum over the
      explicit witness set W_b together with the floor F_b(r) (BOUND). The input
      model is attached per branch (one power [x^d]P on minus; [x^i]P for
      i = 1..2d on plus). The table asserts nothing about whether any party
      supplies that input.
    method_ceiling:
      strongest_certifiable_claim: >-
        A certified, typed table of Cheon's known exponents at specific integers,
        conditional on supplied input. It cannot move any exponent (known prior
        art, DEC-20260802-208).
      nearby_object_control: >-
        The null arm (random primes of the same bit lengths, same pipeline),
        C-INERT and the two planted controls, and C-FIELD (a field prime
        presented as r).
    proof_obligations:
      - claim: For EXACT branches the divisor lattice is complete.
        responsibility: correctness
        discharged_by: C-PRODUCT, change.D7_certificates, C-RECOMPUTE
      - claim: The minus column equals the frozen quantity on r - 1.
        responsibility: baseline
        discharged_by: definitions.typed_costs and C-PLANT-M
      - claim: Each branch's cost and input model match Cheon 2006 Theorems 1 and 2.
        responsibility: interface
        discharged_by: change.D2_typed_costs, as read per CORR-20260923-187ea3; open to the J2 primary-source comparison
      - claim: No reading exceeds the typed arithmetic table.
        responsibility: scope
        discharged_by: change.D4_calibration, change.D9_labelling, interpretation_limits

