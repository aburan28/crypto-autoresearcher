          of AMD-20260927-narrow.yaml gives on that state''s witnessed depth: BND-1 and BND-3 are BOUND, unflagged,
          with depth above 3/4 (each state''s held why_fixed_in_advance), and an unflagged depth above 3/4 is at
          least 3/4 + tau, so bin_by_status gives NEAR_FLOOR and bin_at_least NEAR_FLOOR; BND-2 is BOUND, unflagged,
          with depth below 1/100, below 1/4 - tau, so bin_by_status gives UNDETERMINED and bin_at_least NEAR_CEILING.
          Hence the value condition success_criterion.outcomes[N4_BOUND_EVALUATOR_FALSIFIED] reads ("the value this
          text fixes") and the value gate 1 compares with are the same value on every declared state. No C-BOUND
          state other than BND-1, BND-2 and BND-3 exists in a run (invalidation_rules item 6 of AMD-20260926-typed.yaml).
          A reviewer who constructs a further BOUND state to test the rule evaluates gate 1 on it against the values
          corrective.bin_by_status gives on that state''s witnessed depth, so on every BOUND state that bins NEAR_FLOOR
          bin_at_least is defined (NEAR_FLOOR) and gated.'
      one_outcome: 'For any evaluator correct under the combined text, and for any evaluator that departs from it
        on a C-BOUND state, C-BOUND gate 1 and condition N4 have exactly one outcome together: a returned field
        that differs from the stated value fails gate 1 on that path, stopping_rules item 10 stops the run with
        N4, and the N4 condition is met by the same field; a returned field equal to the stated value passes gate
        1 and does not meet N4. Tabulated in outcome_table.'
      outcome_table:
      - state: BND-1 or BND-3
        evaluator: returns every expected field, bin_at_least NEAR_FLOOR
        gate_1: pass
        stopping_rules_item_10: does not fire
        N4_condition: not met
        outcome: run continues (S_VALID_TABLE or S_PARTIAL_TABLE eligible)
        same_as_under_narrow: true
      - state: BND-1 or BND-3
        evaluator: bin_at_least other than NEAR_FLOOR, every other field as expected
        gate_1: fail
        stopping_rules_item_10: fires
        N4_condition: met
        outcome: N4 only
        same_as_under_narrow: false
        under_narrow: 'gate 1 passed (bin_at_least not stated, so not checked) while the N4 condition was met: two
          outcomes'
      - state: BND-1 or BND-3
        evaluator: 'bin_at_least absent or null (E0 of RT-20260927-730157: correct under the typed text, silent
          at BOUND NEAR_FLOOR)'
        gate_1: fail
        stopping_rules_item_10: fires
        N4_condition: met
        outcome: N4 only
        same_as_under_narrow: false
        under_narrow: 'gate 1 passed while the N4 condition was met: two outcomes'
      - state: BND-2
        evaluator: returns every expected field, bin_at_least NEAR_CEILING
        gate_1: pass
        stopping_rules_item_10: does not fire
        N4_condition: not met
        outcome: run continues
        same_as_under_narrow: true
      - state: BND-2
        evaluator: bin_at_least other than NEAR_CEILING, or absent
        gate_1: fail
        stopping_rules_item_10: fires
        N4_condition: met
        outcome: N4 only
        same_as_under_narrow: true
      - state: any of the three
        evaluator: any other expected field wrong (status, witness set, witness, bin, boundary_flag)
        gate_1: fail
        stopping_rules_item_10: fires
        N4_condition: met
        outcome: N4 only
        same_as_under_narrow: true
      - state: any of the three
        evaluator: paths A and B return different bin_at_least
        gate_1: verdicts differ between paths
        stopping_rules_item_10: fires (gate fails on a path)
        N4_condition: met on the wrong path
        outcome: N4 only (definitions.gate_evaluation_mode assigns N4 for a C-BOUND gate)
        same_as_under_narrow: BND-2 yes; BND-1 and BND-3 no (under narrow gate 1 did not compare bin_at_least there)
      tested_meaning_of_N4: 'Unchanged relative to AMD-20260927-narrow.yaml: N4 tests every field of every declared
        state against the value the combined text fixes, and on BND-1 and BND-3 that value was already NEAR_FLOOR
        through corrective.bin_by_status. What changes is that gate 1, and so stopping_rules item 10, now tests
        the same field. The FC5 row of corrective.falsification_condition_mapping (FC5 -> N4, kept) therefore needs
        no change.'
    threshold_index:
      replaces: span_rules[INV-CLAIM].replacement of AMD-20260927-narrow.yaml (the text governing span INV-CLAIM
        of change.D4_calibration.threshold_inventory of AMD-20260926-typed.yaml)
      item: 'DF-N2 (repair: drop the completeness claim)'
      text: 'An index of numeric cut-offs and decision constants, NOT claimed complete, is this field together with
        corrective.threshold_inventory_added of AMD-20260927-narrow.yaml; each entry names what it reads:'
      status_of_the_index: No gate, stop, validity rule or outcome reads this index. Every cut-off and constant
        governs from its own clause, in the layer governing_text_table names for that clause, whether or not the
        index lists it; an omission from the index changes no outcome and is not a defect of any clause. Pre-registration
        of every cut-off rests on the sha256 binding of all four governing layers before any value is seen (change.D8_custody
        and custody_additions below), not on the index. This file adds no numeric cut-off and no decision constant.
      completeness_claims_over_four_layers: 'v1: none (no field of specification.yaml claims a complete list of
        cut-offs). typed: span INV-CLAIM ("The COMPLETE list ..."), superseded by AMD-20260927-narrow.yaml and again
        here. narrow: span_rules[INV-CLAIM].replacement ("only the two together are claimed complete"), superseded
        here; corrective.threshold_inventory_added claims no completeness. gated: none. After this file no governing
        text claims the index complete. The header comment of AMD-20260926-typed.yaml ("SELF-CONTAINED ...") is
        a YAML comment, not a field; a safe loader does not return it and it governs nothing.'
    falsification_condition_mapping_fc6:
      replaces: corrective.falsification_condition_mapping.rows item 6.outcome of AMD-20260927-narrow.yaml
      item: ER-3
      fc: FC6 (a row omits either branch)
      outcome: 'The row is incomplete, not negative. specification.yaml tail_checks item 1 governs (layer v1), quoted
        verbatim: "Report r-1 and r+1 separately; a missing branch voids the row." (sha256 of its UTF-8 bytes 26b53f8995afb04335a24612dcf48e736a2dd0e3d72d5f9b6b440b1a13cc5e52).
        The row is void: every branch of that row, including a branch that was reported, is VOID, which gives S_PARTIAL_TABLE
        (span SP-VOID of AMD-20260927-narrow.yaml); an omission caused by a crash is I_INFRA (stopping_rules item
        14 of AMD-20260926-typed.yaml).'
      status: kept (as H states it, incomplete and not negative)
      unchanged_rows: rows 1 to 5 (FC1 to FC5) of AMD-20260927-narrow.yaml stay incorporated by hash
    errata_declarations:
    - item: ER-4
      adds_to: corrective.bin_by_status of AMD-20260927-narrow.yaml
      path_name: corrective.bin_by_status.confounder_rejected_candidates
      statement: 'A deployed row, null-arm sample, construction control or C-FIELD case that the confounder check
        rejects reports none of the three reporting fields bin, bin_at_least and boundary_flag. It has no branch:
        a rejected deployed row is invalid_measurement for that row and never factored, a rejected null-arm sample
        is kept, flagged and not factored, a rejected construction control stops the run (I_CONTROL_COLLISION) before
        any factoring, and a C-FIELD case is never factored. Its record is the ordered reason list of the confounder
        check.'
      supersedes: nothing
      why_no_outcome_changes: corrective.bin_by_status assigns the three fields per branch, and a rejected candidate
        has no branch under the held confounder-check text, so this statement makes explicit what the held text
        already implies; no gate, stop or outcome reads the three fields of a candidate that has no branch.
    - item: ER-6
      field: change.D1_pins.confounder_check.applies_to of AMD-20260926-typed.yaml (not superseded)
      declaration: '"every construction-control integer" means each construction control''s r (the r of C-PLANT-M,
        C-PLANT-P, C-INERT and C-PLANT-PL), not every integer named in a recipe.'
      supersedes: nothing; a reading declaration
      reason: 'It is the only reading consistent with the held text: stages[C_controls].does runs the confounder
        check "on each constructed r"; scope_on_controls_and_null_arm fixes the expected outcome for every construction
        control as NOT REJECTED; and under the other reading clause (2) not_prime would reject every composite recipe
        integer (D = d1 * d2 of C-PLANT-M, for example), stopping every run with I_CONTROL_COLLISION. The declared
        reading leaves the integers FP is compared with, and the C-FIELD gates, unchanged. DEC-20260927-f680f7 Q0-3
        recorded the same outcome under both readings for clause (1) at the pinned bytes.'
    - item: ER-7
      field: controls[C-FIELD].cases[CF-1].extraction_cross_check and cases[CF-2].extraction_cross_check of AMD-20260926-typed.yaml
        (not superseded)
      declaration: '"(hex form)" is descriptive, not a requirement. The cross-check compares the case value with
        the field prime p that parse rule PR-SP800 extracts, in whichever representation PR-SP800 selects and records.'
      supersedes: nothing; a reading declaration
      reason: PR-SP800 governs which representation yields the value and records the one used; a second representation
        rule inside the cross-check would duplicate it. DEC-20260927-f680f7 Q0-4 recorded that both readings give
        the same run-time decision at the pinned, hash-fixed bytes.
    - item: ER-5
