  corrective:
    c_bound_gating:
      item: DF-N1
      repairs_used: (a) span G-GATE1 and (b) spans G-BND1 and G-BND3, together; (c) is not used
      expected_value_source:
        adds_to: controls[C-BOUND]
        path_name: controls[C-BOUND].expected_value_source
        text: 'Gate 1 of controls[C-BOUND] compares each returned field with the value stated in that state''s expected
          block. After spans G-GATE1, G-BND1 and G-BND3, every declared state states bin, bin_at_least and boundary_flag:
