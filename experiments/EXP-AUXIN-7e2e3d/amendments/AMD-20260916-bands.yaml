amendment:
  id: AMD-EXP-AUXIN-7e2e3d-20260916-bands
  experiment_id: EXP-AUXIN-7e2e3d
  decision_id: DEC-20260916-bc3375
  recorded_at: '2026-09-16'
  kind: additive_protocol_amendment
  supersedes_fields:
    - controls[positive_planted_divisor].design bit length of r_planted in [32, 64]
    - controls[positive_planted_divisor].design prime q search window [2^16, 2^20]
    - controls[null_safeprime_r_minus_1].design bit length in [16, 32]
    - controls[null_safeprime_r_minus_1].design "or a named small safe prime" alternative
  does_not_rewrite: experiments/EXP-AUXIN-7e2e3d/specification.yaml
  cites:
    - VAL-20260916-b828e7
    - TASK-20260916-41af61
    - RT-20260916-c14349
    - TASK-20260916-fa9626
    - RUN-AUXIN-6117d3
    - DEC-20260916-c81d20
  defect: >-
    Frozen planted band [0.24, 0.26] is unreachable for construction bit
    lengths [32, 64] under E≈0.25+1/log2(r). Frozen safeprime threshold
    0.49 is unreachable for bit lengths [16, 32] under E≈0.5−0.5/log2(r).
    Confirmed by independent validator TASK-20260916-41af61.
  change:
    planted_control:
      construction_bit_length: [104, 128]
      q_search_window: [2^52, 2^64]
      q_search_start: '2^52 + (seed mod 2^20), searching upward for prime q'
      expected_E_band: [0.24, 0.26]
      asymptotic_check: 'also require |E − (0.25 + 1/log2(r))| ≤ 0.01'
      seed: 2026091301
      note: >-
        Raises the bit-length floor so the original numeric band is
        jointly reachable. Does not weaken the band. The frozen recipe
        (d = q, k near q, so r = d*k + 1 ≈ q²) forces r_bits ≈ 2*q_bits;
        with the frozen q window [2^16, 2^20] r is 32–40 bits and the
        amended bit length is unreachable, so the q window is raised to
        [2^52, 2^64] to match. d = q, the k-search, the 0.02 relative
        distance gate and the 10^6-trial infrastructure stop are unchanged.
    safeprime_control:
      construction_bit_length: [52, 64]
      q_search_window: [2^50, 2^63]
      q_search_start: '2^50 + (seed mod 2^20), searching upward for prime q with 2q+1 prime'
      r_minus_1_E_min: 0.49
      asymptotic_check: 'also require E ≥ (0.5 − 0.5/log2(r)) − 0.01'
      seed: 2026091302
      note: >-
        Raises the bit-length floor so the original threshold is jointly
        reachable. Does not lower the threshold. r = 2q + 1 with q in
        [2^50, 2^63] gives r_bits in [52, 64]; the frozen "named small
        safe prime" alternative no longer applies at this size, so the
        control is seed-constructed only, with safeprimality certified in
        the run as before.
    stage1_rule_unchanged: >-
      If either amended control fails its numeric gate, stop Stage 1
      deployed rows; do not interpret deployed factorizations. No
      asymptotic-substitution gate is authorized.
  authorization: >-
    Authorizes a new maximum_runs=1 census package under this amendment
    (controls first, then deployed rows only if amended controls pass).
    Does not rehabilitate RUN-AUXIN-6117d3 deployed conclusions.
  non_claims:
    - Not a vulnerability finding.
    - Not an ordinary-ECDLP claim.
    - Not authorization for Cheon or protocol audit.
