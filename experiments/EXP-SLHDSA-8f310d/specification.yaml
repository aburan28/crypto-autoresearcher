# EXPERIMENT CONTRACT -- EXP-SLHDSA-8f310d (review_required, unapproved, zero runs).
experiment:
  id: EXP-SLHDSA-8f310d
  hypothesis_id: H-SLHDSA-e1b7f8
  derived_from_idea: IDEA-20261018-cfa824
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Multi-user preimage gain with distinct vs shared PK.seed
  objective: Whether PK.seed fully removes cross-user multi-target gain in practice.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: C or Python+NumPy with hashlib SHAKE256 truncated; hash set of targets
    parameters: n in {24,28,32} bits; U in {1,16,256}; t=64 per user; 200 trials per cell
    procedure: >-
      1. Generate users and targets. 2. Run search to first hit. 3. Regress log cost on log
      U per regime. 4. Bootstrap slopes.
  controls:
  - 'null: U=1, which must match 2^n/t'
  - 'positive: shared PK.seed, where slope -1 must appear'
  - 'A/A: distinct-seed arm under two seed blocks'
  independent_variables:
  - seed_regime
  - users_U
  metrics:
    primary:
    - slope of log cost vs log U per regime
    secondary:
    - per-n consistency
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: slope
    formula: 0 for distinct seeds, -1 for shared
    source: random-function model
  scale_relevance:
    tier: toy
    justification: 'n reduced to 24-32; transfer assumption: slope independent of n'
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 12
    maximum_memory_gb: 8
    maximum_runs: 18
  stopping_rules:
  - stop when slope CI half-width < 0.05
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - trial with hash-table overflow invalid
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    Success if C2 shows slope within 0.1 of 0 for distinct seeds and C1 separates regimes
    with shared slope near -1 (P1, P2), beyond the AA1 noise floor.
  falsification_criterion: Falsified if C2 shows a distinct-seed slope below -0.2 or C1 shows
    no separation.
  decision_impact:
    on_positive: >-
      Adopt per-user t in all SLH-DSA cost tables and record PK.seed uniqueness as the load-bearing
      multi-user assumption.
    on_negative: Investigate the unexpected cross-user gain as a tweak-separation defect.
  variable_ledger:
    independent:
    - name: seed_regime
      levels:
      - distinct
      - shared
    - name: users_U
      levels:
      - '1'
      - '16'
      - '256'
    factors:
    - name: seed_block
      treatment: randomized
      value: seed blocks A and B, disjoint master seeds
      how: >-
        two disjoint master seeds derived by SHAKE256 from a frozen label; every arm run under
        both
    - name: n_bits
      treatment: crossed
      value: 24,28,32
      how: every cell at each n
    comparisons:
    - id: C1
      arms:
      - distinct U=256
      - shared U=256
      differs_in:
      - seed_regime
      design: one_factor
    - id: C2
      arms:
      - distinct U=1
      - distinct U=256
      differs_in:
      - users_U
      design: one_factor
    - id: C3
      arms:
      - U=1 vs 2^n/t
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - distinct U=16 seed-block A
      - distinct U=16 seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-cfa824.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-cfa824.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml with frozen parameters, seeds, code commit and tool versions
  - raw-result.json with per-trial records and verification flags
  - cost-vs-U CSV
  - slope SVG
  - PDF
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-SLHDSA-8f310d/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-cfa824.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
