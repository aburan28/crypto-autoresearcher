experiment:
  id: EXP-CLGRP-52980d
  hypothesis_id: H-CLGRP-6f6b58
  derived_from_idea: IDEA-20260809-843eb6
  question_id: RQ-CLGRP-66ab7f
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Certified class group cost sweep - per-phase operation counts and peak memory at five or
    more declared discriminant sizes, with an exact reduced-form known-value control, emitted
    and independently re-verified certificates, declared per-size tuning, and a leave-one-out
    stability test that can refuse the fit
  objective: >-
    The one uncertainty a run reduces is whether this program has a MEASURED cost curve for
    class group computation, or only an analogy to a different problem. A run establishes
    (i) the per-phase operation count and peak memory at at least five declared discriminant
    sizes, each accompanied by generators, relations and a structure statement that an
    independent re-verifier accepts; (ii) exact agreement with an algorithmically independent
    class number and structure at the control sizes, which is the gate that decides whether
    any cost number may be used; (iii) the fitted parameters of a declared model form with
    residuals; and (iv) the leave-one-out movement of the leading parameter, which decides
    whether the ladder is long enough for the fit to be reported at all. The deliverable is a
    cost table in which every column is labelled measured or modeled and never mixed. No
    attack is proposed and no extrapolation to any deployed discriminant size is made here.
  what_this_is_not:
  - >-
    Not an attack, not a record attempt, not a security verdict about any discriminant size,
    and not a claim that any deployed parameter is or is not adequate.
  - >-
    Not an extrapolation. The fitted curve describes the executed ladder. Converting it into a
    statement about a larger discriminant is a separate record with its own interval and its
    own gate, and this contract deliberately excludes it.
  - >-
    Not a comparison against any published class group computation. No published cost figure is
    used in any derivation here; the parent proposal's source references are recorded as
    REQUIRED READS that have not been retrieved.
  - >-
    Not a statement about the algorithm in general. Every number is a property of this
    implementation at these declared tuning parameters on this host.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No
    run has been executed under this contract.
  claim_ceiling:
    tier: measured_toy_to_midrange
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the executed discriminant sizes with the declared
      factor-base sizes and relation surpluses, this implementation consumed a stated number of
      operations and a stated peak memory per phase; the computed class number and structure
      agreed exactly with an independent method at the control sizes; the emitted certificates
      re-verified; a declared model form fits with stated residuals; and the leading parameter
      moves by a stated amount under leave-one-out. WHAT DOES NOT FOLLOW - no cost at any
      discriminant size outside the ladder; no statement about any other implementation; no
      affected-versus-safe verdict for any deployed parameter, which this run explicitly cannot
      determine and must say it cannot determine.
  inputs:
    procedure: >-
      STAGE 0, zero compute - declare and hash the ladder of discriminants, the per-size factor
      base size and relation surplus, the model form to be fitted, the leave-one-out threshold
      of 25 percent, the control sizes, and the analytic memory model for the dominant data
      structure. Nothing in this list may be revised after any size runs.
      STAGE 1, minutes - KNOWN-VALUE CONTROL. At each control size compute the class number and
      group structure by exhaustive enumeration of reduced binary quadratic forms, an exact and
      algorithmically independent method, and require the sweep implementation to reproduce it
      exactly. Disagreement halts the package.
      STAGE 2, the bulk of the budget - run the sweep at each declared size, three independent
      instances per size, with per-phase operation counters and peak resident set sampling.
      Emit generators, relations and the structure statement as a certificate at every size.
      STAGE 3, minutes - independent re-verification of every certificate by a checker that does
      not share code with the producer - the relations must be valid, must generate the claimed
      group, and the structure statement must be consistent with the relation lattice. A size
      whose certificate fails is not a data point and is excluded with its reason recorded.
      STAGE 4, hours - PARAMETER-PERTURBATION PROBE at the smallest and largest ladder sizes,
      with the factor base scaled by 0.5 and 2.0, to measure how much of the curve is the tuning
      schedule rather than the algorithm.
      STAGE 5, minutes - fit the declared model form; report residuals; recompute the fit with
      each single size omitted and report the leading parameter's movement.
      STAGE 6, zero compute - assemble the cost table with every column labelled MEASURED or
      MODELED, list every optimistic assumption with the DIRECTION of its bias, reconcile
      measured peak memory against the analytic size of the dominant structure, and state
      explicitly that no affected-versus-safe scope for any deployed parameter is determinable
      from this run.
    instrument: >-
      One instrumented implementation of a subexponential relation-collection class group
      algorithm, used UNCHANGED at every size. Operation counts come from instrumented counters,
      not from wall clock; wall clock is recorded separately and is never fitted. Peak memory is
      sampled resident set. Certificates are emitted in a machine-readable form and checked by
      an independent re-verifier. Reduced-form enumeration at the control sizes is a separate,
      independent code path. Recorded through harness/runner.py.
    parameters: >-
      At least five fundamental discriminants of imaginary quadratic orders at declared sizes
      spanning a declared range, named exactly in Stage 0. Three independent instances per size.
      Factor base size and relation surplus declared per size in Stage 0 and reported in every
      output row. Control sizes are the two smallest, where reduced-form enumeration is
      affordable. Leave-one-out threshold 25 percent of the central value of the fitted leading
      parameter. Parameter-perturbation factors 0.5 and 2.0 at the smallest and largest sizes.
  controls:
  - >-
    KNOWN-VALUE CONTROL, blocking - at the control sizes the class number and group structure
    must agree EXACTLY with exhaustive reduced-form enumeration, an algorithmically independent
    exact method. No tolerance. Disagreement voids every cost number in the package, because a
    cost measured while computing the wrong answer measures nothing.
  - >-
    CERTIFICATE RE-VERIFICATION, blocking per size - every emitted relation set and structure
    statement is checked by an independent re-verifier that does not share code with the
    producer. A size whose certificate fails is excluded from the fit with its reason recorded;
    it is never repaired into a data point.
  - >-
    PARAMETER-TUNING DISCLOSURE - factor base size and relation surplus are declared per size
    BEFORE the run and reported in every row, since an undeclared tuning difference across sizes
    produces a growth shape indistinguishable from a mathematical one.
  - >-
    PARAMETER-PERTURBATION PROBE, can fail - at the smallest and largest sizes, re-run with the
    factor base scaled by 0.5 and 2.0. If the resulting operation-count change exceeds the
    difference between adjacent ladder points, the curve is dominated by the schedule and is
    reported as a curve of the schedule rather than of the algorithm.
  - >-
    MEMORY RECONCILIATION - the dominant data structure, the relation matrix over the factor
    base, is sized ANALYTICALLY from the declared parameters and compared against measured peak
    resident set. A discrepancy beyond a factor 2 means the memory model does not describe the
    implementation, and the memory column is reported as measured-only with the model withdrawn.
  - >-
    ORDERING RULE - the control sizes and the certificate re-verification are completed and
    their verdicts written before any fit is computed, so that no size can be included or
    excluded to improve a fit.
  - >-
    MEASURED-VERSUS-MODELED SEPARATION - every reported number is labelled measured (instrumented
    run with manifest) or modeled (formula, with the formula printed). The two never appear in
    one column. This is a required property of the output table, checked before the run is
    accepted.
  independent_variables:
  - discriminant size, in bits
  - algorithm phase - factor base construction / relation collection / linear algebra / structure determination
  - declared factor base size and relation surplus
  - instance index within a size
  metrics:
    primary:
    - >-
      operations_per_phase - instrumented operation count per algorithm phase per (size,
      instance), in counted operations with the counted unit named, MEASURED.
    - >-
      peak_rss_bytes_per_phase - peak resident set per phase per (size, instance), in bytes,
      MEASURED, reported alongside the analytic size of the relation matrix, MODELED.
    - >-
      fitted_model_parameters - the parameters of the declared model form fitted to
      operations_per_phase against discriminant size, with residuals per ladder point.
    - >-
      leave_one_out_movement - the maximum relative movement of the fitted leading parameter when
      any single ladder size is omitted, dimensionless. Threshold 0.25.
    - >-
      known_value_agreement - exact agreement of computed class number and group structure with
      reduced-form enumeration at each control size, boolean per control size. FORCED true.
    - >-
      certificate_reverification_rate - fraction of sizes whose emitted certificate is accepted by
      the independent re-verifier, dimensionless. FORCED 1.00 for a size to be a data point.
    secondary:
    - >-
      wall_clock_seconds per phase per instance, MEASURED, reported and never fitted.
    - >-
      instance-to-instance spread of operations_per_phase within each size, which bounds how
      finely the ladder can be read.
    - >-
      parameter_perturbation_delta - the change in operations_per_phase under factor-base scaling
      by 0.5 and 2.0 at the smallest and largest sizes, compared against the adjacent-size gap.
    - >-
      memory_model_ratio - measured peak resident set divided by the analytically sized dominant
      structure, dimensionless, per size.
    - >-
      declared factor base size and relation surplus per size, echoed in every row.
    - >-
      the list of excluded sizes with their exclusion reasons.
  heuristic_under_test: HEUR-CLGRP-6F6-1
  preregistered_prediction:
    quantity: >-
      The shape of operations_per_phase against discriminant size, and leave_one_out_movement of
      the fitted leading parameter.
    formula: >-
      Operation count grows subexponentially in the discriminant size, consistent with the model
      form declared and hashed in Stage 0. leave_one_out_movement is predicted BELOW 0.25. Under
      the null that the ladder is too short or that one model form does not describe it,
      leave_one_out_movement is at or above 0.25 or the residuals curve systematically - and that
      outcome is the finding, not a failure to report.
    source: >-
      Pre-registered in the parent proposal IDEA-20260809-843eb6, whose predictions name cost
      versus discriminant size and fit stability under leave-one-out as the two observables. The
      25 percent threshold and the model form are NOT supplied by the proposal and are set by this
      contract in Stage 0, before any size runs; they are recorded as derivation gaps so that
      their origin is not mistaken for the proposal's.
  scale_relevance:
    tier: midrange
    justification: >-
      The ladder spans the sizes at which the algorithm can be run to completion, with
      certificates, several times, inside the declared budget. That is well below the discriminant
      sizes this program's parameter arguments concern, and the design does NOT bridge the gap -
      it deliberately refuses to. The transfer assumption that would be needed - that one fitted
      model form describes both the executed range and the deployed range - is exactly what the
      leave-one-out test probes at the executed end and cannot probe at the other, and the
      contract requires the output table to state that the affected-versus-safe scope for any
      deployed parameter is NOT determinable from this run.
    correspondence: null
  tail_checks:
  - >-
    Report the largest-size point separately with its own residual, since a subexponential fit is
    most sensitive to the top of the ladder and a single expensive point can carry the whole
    parameter.
  - >-
    Report the fit recomputed on the lower half and the upper half of the ladder separately; a
    material disagreement is systematic curvature and is reported as such rather than averaged.
  - >-
    Report the maximum and minimum operation count across instances at each size, not only the
    mean, so that a size with one anomalous instance is visible.
  - >-
    Report every optimistic assumption in the modeled columns with the DIRECTION of its bias -
    which way it makes the modeled number too small - and label any table produced under them as
    a bound rather than a prediction.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 80.0
    maximum_memory_gb: 64
    maximum_runs: 30
  stopping_rules:
  - >-
    HALT the package if the known-value control disagrees with reduced-form enumeration at any
    control size. No cost number from any size may be reported.
  - >-
    Exclude, with a recorded reason, any size whose certificate fails independent re-verification;
    recompute the fit without it and report the omission.
  - >-
    Stop at the declared ladder and the declared per-size tuning. No size is added, and no
    factor-base size is re-tuned, after any operation count is seen.
  - >-
    Stop at maximum_runs, total_cpu_hours or maximum_memory_gb, whichever binds first. A size that
    exhausts the budget is reported as INCOMPLETE with its partial phase counts; budget exhaustion
    is a stop, never a negative result and never a data point (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5). In particular, a size that did
    not finish does not have an infinite cost - it has no cost measurement.
  - >-
    A run whose known-value control was not executed in the same invocation as the sweep is
    invalid_measurement.
  - >-
    A run whose cost table mixes measured and modeled numbers in one column, or omits the label,
    is completed_invalid regardless of its numbers.
  - >-
    A run reporting operation counts derived from wall-clock timings rather than instrumented
    counters is completed_invalid.
  - >-
    A claimed class number or structure whose certificate fails independent re-verification makes
    that size completed_invalid (docs/claims-and-verification.md).
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: >-
    The sweep yields a reportable cost curve when ALL of the following hold, each decidable from
    the primary metrics -
    (1) known_value_agreement is true at every control size;
    (2) certificate_reverification_rate is 1.00 on at least five sizes;
    (3) at least five sizes complete with per-phase operations_per_phase and peak_rss_bytes_per_phase;
    (4) the declared model form is fitted with residuals reported and no systematic one-directional
    curvature;
    (5) leave_one_out_movement is below 0.25;
    (6) the output table labels every column MEASURED or MODELED, lists every optimistic assumption
    with the direction of its bias, reconciles measured against modeled memory, and states that no
    affected-versus-safe deployed scope is determinable from this run.
  falsification_criterion:
  - >-
    leave_one_out_movement is at or above 0.25, or the residuals show systematic one-directional
    curvature. The sweep is TOO SHORT to support extrapolation. This is a genuine negative for
    H-CLGRP-6f6b58 as stated and is reported as the finding, with the number of additional ladder
    sizes the observed movement implies would be needed.
  - >-
    The parameter-perturbation probe moves the operation count by more than an adjacent-size gap.
    The measured curve is a curve of the tuning schedule; HEUR-CLGRP-6F6-2 is refuted and the fit
    is reported as a fit to the schedule.
  - >-
    memory_model_ratio falls outside a factor 2 at any size. The analytic memory model does not
    describe the implementation; the modeled memory column is withdrawn and only measured memory
    is reported.
  - >-
    known_value_agreement is false at any control size, or a certificate fails re-verification.
    Instrument void - infrastructure signal under AGENTS.md rule 5, never negative mathematical
    evidence about class group cost.
  - >-
    Fewer than five sizes complete inside the budget. No fit is reported; the completed sizes stand
    as individual certified points and the ladder is re-planned.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
  - raw-result.json carrying every per-(size, instance, phase) operation count, peak resident set and wall clock, not summaries
  - generators, relations and the structure statement per size, in a machine-readable form a third party can re-verify
  - the independent re-verifier's report per size, produced by code that does not share a module with the producer
  - the reduced-form enumeration results at the control sizes, from the independent code path
  - the Stage 0 declaration - ladder, per-size tuning, model form, leave-one-out threshold, memory model - written before the first size runs and hashed
  - the parameter-perturbation probe results at the smallest and largest sizes
  - the assembled cost table with per-column MEASURED or MODELED labels, the optimistic-assumption list with bias directions, and the explicit statement that deployed-scope impact is not determinable
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator drafting does not confer approval. This contract is review_required and is NOT
    approved; approved_by is null and execution_authorized is false. Approval is the user's gate
    because it authorizes execution and spends compute.
  - >-
    The exact ladder of discriminants, the per-size factor base size and relation surplus, and the
    model form to be fitted must be named before approval. The parent proposal supplies none of
    them, and a model form chosen after seeing the counts would make this a fitted contract rather
    than a frozen one.
  - >-
    The independent re-verifier must be identified before approval and must not share a module with
    the producer. A certificate checked by the producer's own code is not a control.
  - >-
    The budget is high (80 cpu-hours, 64 GB). Approval should confirm the largest ladder size is
    reachable within one run's wall clock, since a top size that never completes removes the point
    the fit most depends on.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260809-843eb6
    authored_at: '2026-08-25'
    note: >-
      The parent proposal is unusually terse - it supplies the two observables (cost versus size,
      leave-one-out stability), the two controls (known-value, parameter-tuning disclosure) and two
      falsification conditions, and nothing else. Everything quantitative in this contract that the
      proposal does not state - the 25 percent leave-one-out threshold, the reduced-form enumeration
      as the independent method, the certificate re-verification requirement, the
      parameter-perturbation probe, the analytic memory model, and the measured-versus-modeled
      column discipline required of a cost-model experiment - is added by this contract and is
      listed in derivation_gaps so its origin is not mistaken. Budgets follow the proposal's
      declared medium implementation and high compute at the top of the sweep.
  derivation_gaps:
  - >-
    The discriminant ladder is not specified. The proposal says "at least five sizes spanning a
    declared range" and declares no range. The range must be fixed before approval, and it decides
    whether the run is affordable at all.
  - >-
    The model form to be fitted is not specified. Fitting is meaningless without it, and choosing it
    after seeing the counts would be the exact failure this contract's ordering rule exists to
    prevent. It is set in Stage 0 here, but the CHOICE is owed before approval.
  - >-
    The leave-one-out threshold of 25 percent is set by this contract, not by the proposal, which
    says only "small movement" and "large movement". A threshold with no source is a threshold that
    can be argued after the fact; it is fixed here and its arbitrariness is disclosed.
  - >-
    The proposal's known-value control refers to "published class numbers". This contract replaces
    that with exhaustive reduced-form enumeration, because the corpus has no verified transcription
    of any published class number table and using an unverified recollection as ground truth would
    be worse than having no control. If a verified table is later transcribed, it becomes an
    additional control, not a replacement.
  - >-
    The proposal's source_refs are recorded as RECALLED, REQUIRED READS that have not been
    retrieved. No published cost figure is used anywhere in this contract, and the fitted parameters
    are therefore not comparable to any external result until those reads happen. That comparison is
    a separate task.
  - >-
    Whether the discriminant sizes this program's parameter arguments actually concern are within
    reach of any feasible ladder is unknown and is not addressed. If they are far outside it, the
    honest deliverable is a measured curve plus an explicit refusal to extrapolate, and the value of
    the experiment rests on the former alone.
