  # =====================================================================
  # MD5-SIDE RUN AUTHORIZATION -- Coordinator gate decision, this contract
  # =====================================================================
  md5_run_authorization:
    authorized: true
    basis: >-
      IDEA-20260821-ea35d1 EXPLICITLY NAMES this step
      (md5_specific_step_decision.decision: NAMED) with its exact bounded
      parameters, and the Coordinator gate TASK-20260821-fad775 concurs that it is
      a legitimate, correctly bounded nearby-object control under GOAL-MD5-001's
      next_action restriction, HR-1, SC-1 and KN-TECH-080 audit 4. The gate
      additionally re-derived and CONFIRMED the proposal's structural premise:
      MD5's Round 1 shares the word schedule and F with MD4, and neither the
      "+= b" term nor the T[1..16] constants change WHICH tuple positions depend on
      the supplied word, so the E/D propagation sets are IDENTICAL for the two
      primitives. The nearby-object comparison is therefore structurally
      motivated rather than arbitrary.
    what_changed_from_batch_4_and_why_the_gate_accepts_it: >-
      THE COMPARISON QUANTITY IS CHANGED, AND THE CHANGE IS PRE-DECLARED BEFORE ANY
      RUN. Batch 4 compared R, the MD5/MD4 full-target-hit ratio, and R = 1.0 was
      near-mechanically forced by the shared schedule (EV-MDFIVE-ab007d O-4, ANOM-1
      CAVEAT). R is hereby DECLARED IN ADVANCE to carry essentially no information
      at these parameters and MAY NOT BE REPORTED AS A FINDING IN EITHER DIRECTION
      (IR-9). The informative quantity is instead the DISTRIBUTIONAL SHAPE -- the
      chi-square p-value and the sample variance of the matching-window collision
      counts -- where the two primitives' differing shift tables and additive
      constants genuinely can produce a difference. THE GATE RULES THIS ADMISSIBLE
      because it is a control that can come out two ways, with a crediting rule
      fixed in advance, and because it is a NEW heuristic statement in a NEW
      hypothesis declared before the run rather than a reinterpretation of batch
      4's frozen text (SC-9, HR-7).
    crediting_rule_fixed_in_advance: >-
      A difference between the arms is CREDITED ONLY IF one arm's chi-square
      p-value is greater than 0.05 and the other's is at most 0.05, AND the
      difference survives a NULL-CONSTANT REPLICATION. That replication -- both
      primitives' constants replaced by the same BCP-2-style shifted variant -- is
      EXPLICITLY NOT AUTHORIZED OR BUDGETED BY THIS CONTRACT and is a future
      batch's decision. Until it exists, a divergence is reported as an
      uncredited observation, never as a finding about MD4-versus-MD5 divergence.
    exact_parameters_identical_to_the_md4_arm:
      i_word: 2
      j_word: 12
      S: 8
      p: 3
      k1: 10
      k2: 10
      m: 12
      k: 20
      N_targets: 1000
      wall_clock_ceiling_seconds: 300
      fixed_words: >-
        The SAME 14 fixed-word values and the same free-word high-order bits as the
        MD4 arm, from fixed_word_generation(20260821, (2,12), 10) -- byte-identical
        message inputs, so the shift-table, additive-constant and add_b
        substitution is the ONLY structural difference between the arms.
      target_generation: >-
        Independent target draws from seed 8975326, with the same N intent and the
        same halt discipline as the MD4 H1 validation run (seed 8975325). This is a
        distributional comparison, not a replay of the MD4 arm's specific targets.
      the_only_two_fields_that_may_differ: >-
        The primitive selector (which chooses shifts, constants and add_b) and the
        target seed. ANY OTHER DIFFERENCE, IN EITHER DIRECTION, INVALIDATES THE RUN
        UNDER IR-4 and is BATCH-HALTING under review-plan-2de43d joint V4.
      never_larger_than_the_md4_arm: >-
        No parameter, split point, component, seed convention, target count, or
        wall-clock ceiling in the MD5 arm may exceed the MD4 arm's declared values.
        Not equal-and-then-a-little-more; not "for completeness".
    md5_mode_correctness_fixtures_authorized_explicitly: >-
      THIS CLAUSE CLOSES DEFECT-1601d6-02, which recorded that batch 4's MD5-mode
      H2 fixture was defensible but not literally named in the authorization text.
      The following MD5-mode COMPUTATIONS are authorized BY NAME, in addition to
      the search arm, and are the ONLY other MD5 computation this contract permits:
      (F1) the HEUR-H2 backward-inversion regression fixture in MD5 mode, seed
      8975327, at least 10,000 uniformly random tuples, executed in run 1
      (buildcheck) -- CTL-PO6;
      (F2) the MD5 T[1..16] self-check against the RFC 1321 section 3.4 sine
      definition, executed at module import and reported in run 1 -- part of
      CTL-PO7;
      (F3) the MD5 phase of the mandatory dependence gate, GATE-PO2 phase C, at
      k1 = k2 = 4, m = 12, k = 20, target seed 8975328, executed in run 2.
      NOTHING ELSE. In particular the batch-4-slice detector null control (phase A,
      CTL-PO1) is NOT authorized in MD5 mode, the k1 = k2 = 6 controls are NOT
      authorized in MD5 mode, and no MD5 primary certificate run is authorized. Any
      MD5 computation outside F1, F2, F3 and run 5 is invalid under IR-4.
    framing: >-
      The MD5 arm is a PRE-DECLARED NEARBY-OBJECT CONTROL, not an attack attempt.
      Its expected outcome is stated in advance: the gate passes identically for
      both primitives (a divergence there is an implementation defect and a STOP,
      not a finding), and both arms are expected to be H1-consistent. Nothing about
      this arm bears on full 64-step MD5, and no result from it may be described as
      an MD5 attack, an MD5 ceiling, or evidence of MD4/MD5 equivalence or
      divergence at any scale.

  interpretation_limits:
    - >-
      CLAIM CEILING `analyzed`, NEVER `supported`, for every record derived from
      this contract, with the gate-by-gate basis stated in
      H-MDFIVE-0ca596 interpretation_limits and in DEC-20260821-84a8f1
      claim_ceiling. This contract carries no asymptotic claim; CLAUDE.md's four
      supported-promotion gates are assessed for honesty, not because anything is
      near clearing them, and three of them are structurally unmet by any single
      bounded-scale batch of this kind.
    - >-
      A PASSING GATE licenses only "the declared observable varies with each free
      word separately at k1 = k2 = 4, on this fixed-word seed, at these four
      held-fixed values". It does not license "the construction works", does not
      validate HEUR-H1, and says nothing about MD4's preimage resistance.
    - >-
      The instrument can only ever recover a PLANTED pair. No run of it is a
      preimage of anything.
    - >-
      A decoupled non-MITM construction at (word8, word9, S = 9) STRICTLY DOMINATES
      R1-SEP10 on the narrow object "recover the two planted words", in both time
      and memory. That is recorded, not buried. No result from this contract may be
      presented as evidence that R1-SEP10 is the cheapest way to recover two planted
      words; its ratios are against the naive all-pairs baseline over the same
      restricted space only.
    - >-
      NOVELTY IS UNVERIFIED and no novelty claim is made or licensed. No record
      derived from this contract may describe the separation rule or the
      branch-coverage refinement as novel, new, or first.
    - >-
      Every BATCH-af29f6 raw metric cited anywhere downstream carries the ANOM-1
      caveat (SC-4, KN-TECH-bb7e9f), and nothing projects toward the approximately
      2^64-block instrument-class gap (SC-3, DEC-20260821-1215e5 F-8).

  open_directions:
