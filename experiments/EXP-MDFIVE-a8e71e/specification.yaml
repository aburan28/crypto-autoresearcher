experiment:
  id: EXP-MDFIVE-a8e71e
  hypothesis_id: H-MDFIVE-0ca596
  version: 1
  title: >-
    R1-SEP10 -- a genuinely two-free-word Round-1 splice-and-cut MITM instrument
    against MD4 (control) at free-word separation 10, gated by a MANDATORY
    k1 = k2 = 4 two-directional dependence check with a batch-4-slice null
    control, with paired HEUR-H1 and HEUR-H1b validation and an
    identically-bounded MD5 nearby-object arm
  status: approved
  goal_id: GOAL-MD5-001
  batch_id: BATCH-7215fa
  question_id: RQ-MDFIVE-6870c1
  proposal_ref: IDEA-20260821-ea35d1
  frozen_by_task: TASK-20260821-fad775
  frozen_at: '2026-08-21'
  assigned_to: executor
  executor_task: TASK-20260821-372d67
  approved_by: >-
    coordinator, TASK-20260821-fad775. The approving decision body is at
    coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/tasks/TASK-20260821-fad775/gate-decision.yaml;
    its ledger DEC id is MINTED AND FILED BY THE DRIVING SESSION with
    `python3 tools/allocate_id.py --next coordinator_decision --date 20260821 --check`.
    This Coordinator subagent has no shell and did not invent a DEC id. UNTIL
    THAT DECISION FILE IS COMMITTED THIS CONTRACT IS FROZEN ON PAPER AND IS NOT
    DURABLE RESEARCH STATE (AGENTS.md, durable research commits).

    FILED BY THE DRIVING SESSION: the decision is DEC-20260821-333267, at ledger/decisions/DEC-20260821-333267.yaml, minted with tools/allocate_id.py and verified free with --check. The paragraph above is retained as written rather than rewritten.
  objective: >-
    Decide, by direct computation and BEFORE spending anything on a declared-scale
    run, whether construction R1-SEP10 is a genuinely two-free-word splice-and-cut
    MITM at MD4's Round 1 -- and only then measure it. Concretely: (1) establish
    primitive and inversion correctness for a NEW sibling module; (2) run the
    batch-4-slice DETECTOR NULL CONTROL, which must FAIL; (3) run the MANDATORY
    k1 = k2 = 4 TWO-DIRECTIONAL DEPENDENCE GATE, which must PASS in both
    directions separately and on the joint fiber; (4) only on PASS, run the
    k1 = k2 = 6 completeness, degeneracy, observation-collision and HEUR-H1b
    controls; (5) only then the MD4 primary certificate run at the declared
    bounded scale; (6) then HEUR-H1's FIRST GENUINE TEST; (7) then, and only
    under md5_run_authorization below, one identically-bounded MD5 nearby-object
    arm. A FAILED GATE IS A COMPLETE AND VALUABLE OUTCOME, not a batch failure.
    Nothing here claims execution at literature-scale complexity
    (2^96 / 2^102 / 2^116.9 / 2^123.4, all UNVERIFIED provenance in this corpus).
  objective_budget_floor_note: >-
    templates/research-records.md sets budget floors of
    wall_clock_seconds_per_run >= 600 and maximum_memory_gb >= 8, and requires a
    contract below them to say why. maximum_memory_gb is 8 and meets the floor.
    The per-run wall-clock ceilings here are BELOW 600 s deliberately: the
    executor task's own declared ceiling is 1800 s TOTAL and must cover
    implementation plus five wrapper-charged runs
    (coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/batch.yaml
    372d67_sub_budget), and every run's modeled compute is well under 30 s -- the
    largest, the H1 run, is about 2 x 10^6 chunk evaluations, which at
    BATCH-af29f6's MEASURED throughput band of 102899 to 289607 chunk-evals/sec
    (EV-MDFIVE-ab007d O-5, ANOM-1 CAVEAT: a correct measurement of a DEGENERATE
    instrument, used here for a feasibility check ONLY and projected nowhere)
    completes in roughly 7 to 20 s. The ceilings exist so that a halt is legible,
    not because the work needs them. A halt at any ceiling is a budget outcome
    (SC-7), reported with achieved progress, never a negative mathematical result.

  inputs:
    rfc_specifications:
      md4: >-
        RFC 1320, pinned at
        coordination/goals/GOAL-MD5-001/batches/BATCH-af29f6/inputs/rfc1320-md4.txt,
        sha256 f727b15e19ab8ac5036ab7921476e8d8644512190ade32a2e0a2fb9d8a2421c7.
        REUSE THIS COMMITTED PIN; DO NOT RE-FETCH.
      md5: >-
        RFC 1321 Appendix A.3, pinned at
        coordination/goals/GOAL-MD5-001/batches/BATCH-1f30fe/inputs/rfc1321-md5.txt,
        sha256 284a79d148400d9cd2a423211d1103b5cef0fb9256a4cbe6d7ebe5197c3149dd.
        REUSE THIS COMMITTED PIN; DO NOT RE-FETCH.
    module: >-
      harness/run_md4_ceiling_v2.py -- a NEW SIBLING MODULE, and the ONLY harness
      module this contract authorizes writing. harness/run_md4_ceiling.py is
      BATCH-af29f6's frozen instrument of record and IS NOT EDITED OR IMPORTED
      FROM; harness/run_md5_calib.py stays BATCH-1f30fe's frozen instrument and is
      not touched. Test additions go additively into tests/test_harness.py.
    seeds:
      fixed_word_generation: 20260821
      g0_batch4_slice_target_md4: 8975321
      gate_target_md4: 8975322
      control_target_md4_k6: 8975323
      primary_target_md4: 8975324
      h1_target_stream_md4: 8975325
      h1_target_stream_md5: 8975326
      h2_inversion_fixture: 8975327
      gate_target_md5: 8975328
    seeds_note: >-
      All nine seeds are declared HERE, before any run (fixed_before_acquisition),
      and are immutable once this contract is frozen. They are deliberately
      DISJOINT from BATCH-af29f6's 8975313 to 8975317 so no target is silently
      reused across batches. Generating any fixed word, high-order bit, or target
      by a procedure or seed other than those declared here INVALIDATES the run.
    fixed_word_generation_procedure: >-
      fixed_word_generation(seed, free_indices, free_bits): seed a
      random.Random(seed); draw 16 32-bit values; for every index NOT in
      free_indices take the drawn value, substituting 1 if it is zero; for each
      index IN free_indices take the drawn value masked to its high
      (32 - free_bits) bits, substituting (1 << free_bits) if that is zero. This
      is the SAME mask-and-fallback procedure BATCH-af29f6 froze, generalized only
      in WHICH indices are free. For R1-SEP10, free_indices = (2, 12); for the
      batch-4 slice null control, free_indices = (8, 9). free_bits equals the k1
      (and k2) of the phase being run.
    target_generation_procedure: >-
      generate_target(target_seed, fixed, primitive, free_bits, i_word, j_word):
      seed a random.Random(target_seed); draw the low free_bits of the forward
      free word then the low free_bits of the backward free word, in that order;
      OR them onto the corresponding fixed high bits; compute the full Round-1
      forward trajectory from the standard IV with the resulting 16 words; record
      Y as the state after step 16 and target_low20 as the low 20 bits of the
      declared matching component v6 on that same trajectory. THE SEARCH NEVER
      READS true_word2 OR true_word12.
    parameters:
      primitive_primary: md4
      free_word_A: 2
      free_word_A_consumed_at_step: 3
      free_word_B: 12
      free_word_B_consumed_at_step: 13
      split_point_S: 8
      declared_matching_component_index: 3
      declared_matching_component_name: v6, the register produced at step 6
      m: 12
      k: 20
      k1_k2_declared_scale: 10
      k1_k2_gate_scale: 4
      k1_k2_control_scale: 6
      N_h1_targets: 1000
      N_h1_minimum_for_a_licensed_h1_reading: 200
    parameters_note: >-
      m = 12 AND k = 20 AT EVERY SCALE -- gate, control and declared scale alike.
      IDEA-20260821-ea35d1 left m and k at the sub-scales implicit; the gate fixes
      them this way so that the matching observable is LITERALLY IDENTICAL across
      every phase, which is what the same-observable requirement means and what
      joint V1 will trace. This is a specification of an unstated parameter, not a
      change to the proposal's design; no free-word index, split point, component
      index or declared scale is altered from IDEA-20260821-ea35d1.

  independent_variables:
    - free word 2 (chunk1), a k1-bit low-order window, per target
    - free word 12 (chunk2), a k2-bit low-order window, per target
    - "the construction parameter tuple (i_word, j_word, S, p): (2, 12, 8, 3) for R1-SEP10, (8, 9, 9, 1) for the batch-4 slice null control"
    - "target primitive: md4 | md5 (md5 strictly gated, see md5_run_authorization)"

  metrics:
    primary:
      - distinct_fwd_32bit and distinct_fwd_12bit, AS INTEGERS, per held-fixed value, per direction, per phase
      - distinct_bwd_32bit and distinct_bwd_12bit, AS INTEGERS, per held-fixed value, per direction, per phase
      - distinct_fiber_sets, AS AN INTEGER
      - the PO-1 batch-4-slice verdict (must be FAIL) with its own integer counts
      - certificate-verified MITM solution set against the independent naive Y-reproducing set at k1 = k2 = 6 (boolean plus both sets)
      - raw pre-certificate candidate count and both projection widths at k1 = k2 = 6 (integers)
      - the full list of 20-bit-colliding non-Y-reproducing pairs at k1 = k2 = 6
      - chunk-evaluation and step-evaluation counts to the first certificate-verified full-target match, MITM against naive
      - matching-window (12-bit) collision count per target, and full-target (20-bit) hit count per target
      - chi-square statistic, p-value, sample variance, and the largest observed count with its Poisson tail p-value
    secondary:
      - wrapper-measured wall-clock seconds and peak memory per run
      - HEUR-H1b paired contrast, distinct 32-bit counts for v6 against v8 over a 64-value sweep, both sides
      - achieved N for each sampling run, reported honestly whether or not the declared N was reached
      - code_path_fingerprint per phase (function qualnames plus the parameter tuple)

  heuristic_under_test: HEUR-H1
  heuristic_under_test_note: >-
    HEUR-H1b is validated in the same contract by its own paired contrast;
    HEUR-H2 is re-established as a correctness gate; HEUR-H3 is NOT tested by
    this contract and no run here may be read as bearing on it.

  preregistered_prediction:
    quantity: >-
      Distribution of the matching-window (12-bit) collision count across N
      independently drawn targets at k1 = k2 = 10, m = 12.
    formula: Poisson(lambda = 2^(k1 + k2 - m)) = Poisson(lambda = 2^8 = 256)
    source: >-
      H-MDFIVE-0ca596 HEUR-H1, extrapolating RFC 1321 section 3.4's single-step
      F-balance property to the iterated composition. The extrapolation is the
      unproved part and is exactly what this run tests.

  scale_relevance:
    tier: toy
    justification: >-
      Round-1 restricted (16 of MD4's 48 and MD5's 64 steps), 2 of 16 message
      words free, a 20-bit target, k1 = k2 = 10 -- a deliberately tiny,
      self-contained model problem. THE DECLARED SCALE IS JUSTIFIED, NOT MERELY
      STATED: k1 + k2 - m = 8 fixes lambda = 256, large enough for a chi-square
      goodness-of-fit against a Poisson with fixed lambda to have usable bins;
      k1 + k2 - k = 0 fixes the expected count of non-planted full-target
      collisions at about 1, which is the exact quantity the observation-collision
      audit asks for; and N = 1000 targets at these parameters is about 2 x 10^6
      chunk evaluations, which fits a 300 s ceiling with wide margin at
      BATCH-af29f6's measured throughput band (ANOM-1 CAVEAT; feasibility check
      only, no projection). Holding the scale identical to BATCH-af29f6's also
      makes the corrected-versus-degenerate comparison at equal cost meaningful.
      NO TRANSFER OR EXTRAPOLATION to the full primitive is claimed. A
      LARGER-SCALE REPLICATION IS AN EXPLICIT OPEN DIRECTION, NOT A GATE EDIT, and
      is recorded in open_directions below.
    correspondence: null

  tail_checks:
    - >-
      Compare the single largest observed matching-window collision count across
      the N sampled targets against the Poisson(lambda = 256) survival
      probability, as an explicit p-value, reported for the MD4 arm and (if run)
      the MD5 arm.
    - >-
      Report the sample variance of the matching-window collision count and
      classify it against the frozen three-way split in
      H-MDFIVE-0ca596 HEUR-H1 falsification_condition. Variance below 64 is
      INSTRUMENT DEGENERACY and a STOP, explicitly NOT an H1 falsification.

  replication:
    seeds: [20260821, 8975321, 8975322, 8975323, 8975324, 8975325, 8975326, 8975327, 8975328]
    independent_instances: 1
    independent_instances_note: >-
      One instance per phase. Replication at a second fixed-word seed and at a
      larger k1/k2 is an explicit OPEN DIRECTION for a future batch, not part of
      this contract, and its absence is a stated limit rather than an oversight:
      the gate is not quantified over fixed-word seeds
      (H-MDFIVE-0ca596 quantifier_order, CLAIM 3).

  # =====================================================================
  # THE MANDATORY TWO-DIRECTIONAL DEPENDENCE GATE -- A HARD TERM
  # =====================================================================
  mandatory_dependence_gate:
    id: GATE-PO2
    binding_status: >-
      THIS BLOCK IS A HARD TERM OF THIS CONTRACT. It appears as proof obligation
      PO-2 in H-MDFIVE-0ca596, as success_criterion item SC-A below, and as
      invalidation_rule IR-1 below. It is NOT a recommendation and NOT a note.
      Batch 4 had only a paper gate, and a paper gate cannot catch a false
      algebraic assumption that nobody computed.
    when: >-
      The FIRST search-type executable action of TASK-20260821-372d67, after the
      buildcheck run and BEFORE any k1 = k2 = 6 control and before any
      declared-scale run. Within its own run it executes phase A (PO-1) first,
      then phase B, then phase C.
    scale: k1 = k2 = 4 -- 16 values per free word, 256 pairs per configuration; expected compute well under one second.
    observable_identity_requirement: >-
      The gate reads THE DECLARED MATCHING OBSERVABLE -- the low m = 12 bits of
      boundary component p = 3 of state8 -- through THE SAME two functions the
      declared-scale search calls. Those two functions MUST be named
      chunk1_observable and chunk2_observable, must take the construction
      parameter tuple as arguments, and must contain NO primitive-specific or
      phase-specific branching beyond that tuple. NO reimplementation, NO nearby
      quantity, NO convenience wrapper. The gate MUST additionally report the same
      counts at FULL 32-BIT RESOLUTION so that a window-only collapse is
      distinguishable from a value-level collapse.
    phase_A_PO1_detector_null_control:
      what: >-
        Run the entire two-directional predicate on the BATCH-4 PARAMETER SLICE
        (i_word = 8, j_word = 9, S = 9, p = 1, k1 = k2 = 4, m = 12, k = 20,
        primitive md4, fixed words from fixed_word_generation(20260821, (8,9), 4),
        target from seed 8975321) through the SAME chunk1_observable and
        chunk2_observable functions.
      required_outcome: >-
        THE PREDICATE MUST RETURN FAIL, with distinct_bwd_32bit EXACTLY 1 and
        distinct_bwd_12bit EXACTLY 1, and distinct_fwd_32bit > 1.
      derived_in_advance: >-
        At (i = 9, j = 10, S = 9) the propagation rules give d = 0 and r = 0, so
        E_0 = {1} and D_0 = {0}, which are disjoint; and backward tuple position 1
        is an exact pass-through of the successor state, so distinct_bwd = 1 holds
        at ANY window width including k = 4. Derived independently twice
        (TASK-20260821-6b78d4, TASK-20260821-fad775) BEFORE any run.
      on_unexpected_outcome: >-
        If the predicate PASSES here, the detector cannot see a degeneracy that is
        already proved to exist, the entire gate is VOID, and the batch STOPS
        regardless of what R1-SEP10 does. This is also the review plan's
        proves_too_much OBJECT M and its verdict is known false.
    phase_B_direction_A:
      what: >-
        R1-SEP10 parameters (2, 12, S = 8, p = 3), primitive md4, k1 = k2 = 4,
        m = 12, k = 20, fixed words from fixed_word_generation(20260821, (2,12),
        4), target from seed 8975322. Hold free word B fixed; sweep free word A
        over all 16 values of its k1 = 4 window; compute chunk1_observable(wA) for
        each; count distinct values.
      held_fixed_values: >-
        Repeat at FOUR pre-registered held-fixed window indices of free word B --
        0, 5, 10, 15 -- and require the criterion at EVERY one.
      recorded_honestly: >-
        chunk1_observable STRUCTURALLY DOES NOT READ FREE WORD B in this
        construction, so holding B fixed is automatic here and the four
        repetitions buy NO quantifier strength in this direction. This is STATED
        rather than presented as a passed test. The repetitions are retained for
        procedural symmetry and are converted into a real check by PO-3 below.
      report: distinct_fwd_32bit and distinct_fwd_12bit, AS INTEGERS, for each of the four held-fixed values.
      criterion: distinct_fwd_32bit >= 2 AND distinct_fwd_12bit >= 2, at all four held-fixed values.
      PO3_consistency_check: >-
        All four repetitions MUST produce BYTE-IDENTICAL results. A discrepancy
        means chunk1_observable reads free word B somewhere it must not, which is
        an implementation defect and a STOP.
    phase_B_direction_B:
      what: >-
        Same R1-SEP10 parameters and seeds. Hold free word A fixed; sweep free
        word B over all 16 values of its k2 = 4 window; compute
        chunk2_observable(wB, Y) for each; count distinct values.
      held_fixed_values: >-
        Repeat at FOUR pre-registered held-fixed window indices of free word A --
        0, 5, 10, 15 -- and require the criterion at EVERY one. FOR EACH SUCH
        INDEX a, THE TARGET IS REGENERATED by the declared target-generation
        procedure with free word A's low bits set to a and free word B's low bits
        set to the seed-8975322 draw, yielding Y_a; the sweep is then run against
        Y_a. These four repetitions are NOT inert -- each is a genuinely different
        backward computation. This regeneration rule is a coordinator
        specification of a step IDEA-20260821-ea35d1 left implicit; without it the
        phase is ambiguous and the Executor would have to guess.
      report: distinct_bwd_32bit and distinct_bwd_12bit, AS INTEGERS, for each of the four held-fixed values.
      criterion: distinct_bwd_32bit >= 2 AND distinct_bwd_12bit >= 2, at all four held-fixed values.
    phase_B_joint_fiber:
      what: >-
        For the seed-8975322 target, for each of the 16 free-word-B window values,
        compute the SET of wA whose low 12 bits of chunk1_observable(wA) equal the
        low 12 bits of chunk2_observable(wB, Y), and count how many DISTINCT such
        sets occur across the 16 values of free word B.
      report: distinct_fiber_sets, AS AN INTEGER, together with the 16 sets themselves.
      criterion: distinct_fiber_sets >= 2.
      why: >-
        This is the operational signature of ANOM-1. Batch 4's fiber map was the
        constant map, and a constant fiber map is also what any construction whose
        match condition factorizes on this single component would produce.
        Per-side counts alone do not catch it.
      two_pre_registered_predictions_on_record: >-
        IDEA-20260821-ea35d1 predicts about 16. THE COORDINATOR GATE DERIVES
        EXACTLY 2, WITH 3 ACCEPTABLE: at m = 12 the expected number of non-planted
        matching pairs is 16 x 16 / 4096 = 0.0625, while the planted pair matches
        exactly by HEUR-H2, so one fiber is non-empty and fifteen are empty. BOTH
        predictions are recorded here BEFORE any run, attributed, and the CRITERION
        (>= 2) IS UNCHANGED AND NOT WEAKENED. Whichever value is observed, the
        deviation from the other prediction is legible as a result rather than
        absorbed. A degenerate backward channel yields EXACTLY 1 whether or not its
        constant value happens to match, so the criterion still separates the cases
        it exists to separate.
    phase_C_md5_gate:
      what: >-
        Repeat phase B EXACTLY, with primitive md5 substituted -- shifts
        (7, 12, 17, 22), constants T[1..16], add_b true -- at IDENTICAL k1 = k2 = 4,
        m = 12, k = 20, identical fixed-word seed convention, target from seed
        8975328. AUTHORIZED MD5 COMPUTATION; see md5_run_authorization.
      required_outcome: >-
        THE GATE MUST PASS IDENTICALLY FOR MD5. The dependence structure is
        derivably identical because the two primitives share the word schedule and
        F, and neither the "+= b" term nor the additive constants change WHICH
        tuple positions depend on the supplied word. A gate that passes for MD4 and
        fails for MD5, or the reverse, indicates an IMPLEMENTATION DEFECT in the
        shift, constant or add_b substitution, NOT a structural finding, and is a
        STOP.
      not_authorized: >-
        PO-1 (the batch-4-slice null control) is NOT run in MD5 mode. The MD4 run
        of it establishes that the detector can fail, and the calculus is
        primitive-independent, so an MD5 repetition would add nothing and would
        make the MD5 arm larger than necessary.
    forbidden_substitution: >-
      A SIMULTANEOUS BOTH-WORD SWEEP DOES NOT DISCHARGE ANY PART OF THIS GATE and
      must not be reported in place of any part of it. A joint sweep passes
      cleanly on a construction degenerate in one word, because the other word
      supplies all the observed movement (KN-TECH-bb7e9f, part 4). It MAY be
      reported as a SUPPLEMENT, clearly labeled as such.
    pass_predicate: >-
      PASS if and only if ALL of the following hold: phase A returned FAIL on the
      batch-4 slice with distinct_bwd exactly 1 and distinct_fwd greater than 1;
      AND direction A's criterion holds at all four held-fixed values, with the
      PO-3 byte-identity check passing; AND direction B's criterion holds at all
      four held-fixed values; AND distinct_fiber_sets >= 2; AND phase C returns
      the same verdict for MD5 as phase B did for MD4. ANY OTHER OUTCOME IS FAIL.
    on_fail: >-
      STOP. NO k1 = k2 = 6 CONTROL AND NO DECLARED-SCALE RUN HAPPENS, AND NO MD5
      SEARCH ARM HAPPENS. The executor reports the measured distinct-value counts
      AS INTEGERS, states which clause of the pass predicate failed, and the batch
      records the failure as a genuine finding about the construction -- a second,
      sharper measurement of the same obstruction. The unspent budget is REPORTED
      AS UNSPENT and never silently reallocated. This is an admissible and
      valuable batch outcome, not a batch failure (SC-7; batch objective; red-team
      D1). It is NOT infrastructure signal and IS recorded as evidence.
    predicted_values_stated_before_any_run: >-
      distinct_fwd_32bit = 16 and distinct_bwd_32bit = 16 (both free words are at
      step distance 3 from v6 and enter all three arguments of the F that produces
      it, so no bit-selection collapse is expected); the 12-bit counts are
      predicted 16 as well, with 15 acceptable since two of sixteen values collide
      in a 4096-bin window with probability about 2.9 percent. On the batch-4 slice
      under phase A: distinct_fwd = 16 and distinct_bwd = EXACTLY 1.
      distinct_fiber_sets: see the two pre-registered predictions above. These are
      PREDICTIONS recorded in advance so a deviation is legible as a result; they
      are not results, and no run has occurred.

  # =====================================================================
  # CONTROLS
  # =====================================================================
  controls:
    - id: CTL-PO1
      what: >-
        DETECTOR NULL CONTROL on the batch-4 parameter slice, k1 = k2 = 4, MD4,
        through the same code path. MUST FAIL. This is the null object for the
        batch's own hard gate, and a gate that has never been shown able to FAIL
        has not been shown to work (KN-TECH-9d21c4, "can this null fail").
    - id: CTL-PO3
      what: >-
        Direction-A byte-identity check across the four structurally inert
        held-fixed repetitions. A discrepancy is an implementation defect and a
        STOP.
    - id: CTL-PO4
      what: >-
        COMPLETENESS CONTROL at k1 = k2 = 6, MD4, seed 8975323. The set of
        CERTIFICATE-VERIFIED MITM solutions must equal the set found by a naive
        search that enumerates all 4096 pairs and, for each, runs an INDEPENDENT
        straight-line 16-step forward recomputation and compares the resulting
        Round-1 output state to Y. THE NAIVE SIDE NEVER CALLS backward_step, NEVER
        READS COMPONENT p, AND NEVER READS THE MATCHING WINDOW. That is precisely
        what makes it NOT the vacuous control batch 4 ran, where the naive
        baseline read the same word9-independent tuple position the MITM read
        (EV-MDFIVE-ab007d O-2; ANOM-1 CAVEAT). IT CAN FAIL: if the separation or
        branch-coverage reasoning is wrong, the MITM misses the planted pair and
        the naive search still finds it.
      stated_limit: >-
        CTL-PO4 TESTS COMPLETENESS, NOT NON-DEGENERACY. A construction degenerate
        in one free word would emit every value of that word as a raw candidate,
        all but one would fail the certificate, and the surviving sets would still
        match -- so CTL-PO4 ALONE WOULD STILL PASS VACUOUSLY AGAINST ANOM-1. This
        limit is stated here rather than discovered later. CTL-PO5 and GATE-PO2
        are what carry the non-degeneracy load.
    - id: CTL-PO5
      what: >-
        DEGENERACY CONTROL ON THE RAW SOLUTION SET at k1 = k2 = 6 -- the check
        batch 4 did not have. On the RAW PRE-CERTIFICATE candidate set (pairs
        passing full k = 20 bit equality, before the 16-step certificate), BOTH
        must hold: (a) the number of distinct wA appearing is strictly less than
        64 AND the number of distinct wB appearing is strictly less than 64; and
        (b) the total raw candidate count is at most 4, against an expected value
        of about 1 + 4096 / 2^20. FAIL on either part is a STOP.
      can_it_fail: >-
        DEMONSTRABLY YES, and the failing instance is already on record. Batch 4's
        raw solution set was exactly a full row -- one wA paired with every wB
        (EV-MDFIVE-ab007d O-1; ANOM-1 CAVEAT) -- which fails part (a) immediately
        and, at k1 = k2 = 6, would have produced 64 raw candidates and failed part
        (b) as well.
    - id: CTL-OBS
      what: >-
        EXHAUSTIVE OBSERVATION-COLLISION ENUMERATION at k1 = k2 = 6, MD4: all 4096
        pairs enumerated, every pair whose low 20 bits agree reported, and which of
        them reproduce Y reported. The full list of 20-bit-colliding
        NON-Y-reproducing pairs is a required artifact. Expected: the planted pair
        plus about 0.004 others, i.e. usually none. THE SEARCH IS RUN, NOT
        REASONED ABOUT.
    - id: CTL-H1B
      what: >-
        HEUR-H1b PAIRED CONTRAST at k1 = k2 = 6, MD4: report distinct 32-bit and
        12-bit counts over the 64-value sweep for the step-distance-3 component v6
        (tuple position 3) on BOTH sides, AND, as the paired contrast, for the
        step-distance-1 component v8 (tuple position 1) on the BACKWARD side at the
        same separation. A genuine two-outcome test: if BOTH are near 64 the
        step-distance refinement is recorded as not doing work at these parameters
        rather than retained as decoration.
    - id: CTL-PO6
      what: >-
        HEUR-H2 EXACT-INVERTIBILITY REGRESSION FIXTURE, seed 8975327, at least
        10,000 uniformly random tuples PER PRIMITIVE (md4 and md5), exact equality
        required. New code inherits nothing; a single failure invalidates
        everything downstream in that run.
    - id: CTL-PO7
      what: >-
        PRIMITIVE CORRECTNESS: all seven RFC 1320 Appendix A.5 MD4 test vectors
        reproduced, and the MD5 T[1..16] table self-checked against the RFC 1321
        section 3.4 sine definition.
    - id: CTL-PO9
      what: >-
        COMPONENT IDENTITY: assert that tuple position 3 of state8, as produced by
        the module's own forward chain, equals the register value produced at step
        6 as computed by the INDEPENDENT straight-line reference implementation
        that tracks named registers rather than tuple positions. Runs before the
        gate. An off-by-one in the rotating tuple convention is a named confounder
        and this is its check.
    - id: CTL-NEARBY-2
      what: >-
        MD5 ROUND 1 AT IDENTICAL BOUNDED PARAMETERS as the nearby-object control,
        ONLY under md5_run_authorization, never larger than the MD4 arm.

  # =====================================================================
  # RUN PLAN -- exactly five wrapper-charged runs
  # =====================================================================
  run_plan:
    - run: 1
      suffix: buildcheck
      primitive: md4 and md5 (correctness fixtures only, no search)
      contents: CTL-PO6 (both primitives), CTL-PO7, CTL-PO9
      ceiling_seconds: 60
      gate_condition: none -- runs first
    - run: 2
      suffix: gate_and_controls
      primitive: md4, plus the md5 gate phase C
      contents: >-
        Phase A (CTL-PO1), phase B (direction A with CTL-PO3, direction B, joint
        fiber), phase C (md5 gate). THEN, AND ONLY IF the pass predicate returned
        PASS, the k1 = k2 = 6 phase: CTL-PO4, CTL-PO5, CTL-OBS, CTL-H1B, MD4 only.
      ceiling_seconds: 120
      gate_condition: >-
        On FAIL the run TERMINATES IMMEDIATELY after recording the gate results
        and its raw output contains NO k1 = k2 = 6 phase and no later phase at
        all. Each phase writes a `phase_log` entry with a monotonic timestamp and
        its own code_path_fingerprint, and the gate verdict is recorded BEFORE any
        control phase begins, so that ordering is mechanically checkable by joint
        V1 from the artifacts themselves rather than from narrative.
    - run: 3
      suffix: primary-md4
      primitive: md4
      contents: >-
        Declared-scale MD4 primary certificate run, k1 = k2 = 10, m = 12, k = 20,
        target seed 8975324. Every raw MITM candidate is independently re-verified
        by the straight-line 16-step reference recomputation; both the raw and the
        certificate-verified counts are reported.
      ceiling_seconds: 300
      gate_condition: RUNS ONLY IF run 2's gate predicate returned PASS.
    - run: 4
      suffix: h1-md4
      primitive: md4
      contents: >-
        HEUR-H1's FIRST GENUINE TEST. N = 1000 independent targets from seed
        8975325 at k1 = k2 = 10, m = 12, k = 20; per-target matching-window and
        full-target counts; chi-square against Poisson(256) with lambda FIXED a
        priori and df = bins - 1; sample variance; largest-count Poisson tail
        p-value.
      ceiling_seconds: 300
      gate_condition: RUNS ONLY IF run 2's gate predicate returned PASS.
    - run: 5
      suffix: md5-conditional
      primitive: md5
      contents: >-
        The single authorized MD5 nearby-object search arm, identical in every
        parameter to run 4 except the primitive selector and the target seed
        (8975326). See md5_run_authorization.
      ceiling_seconds: 300
      gate_condition: >-
        RUNS ONLY IF run 2's gate predicate returned PASS (including its md5
        phase C) AND md5_run_authorization below is in force.
  run_plan_arithmetic: '60 + 120 + 300 + 300 + 300 = 1080 s of run ceilings, plus 600 s implementation = 1680 s, inside TASK-20260821-372d67''s declared 1800 s.'

  budget:
    wall_clock_seconds_per_run: 300
    wall_clock_seconds_per_run_note: >-
      300 s is the MAXIMUM any single run may take; per-run ceilings are set
      individually in run_plan above (60, 120, 300, 300, 300). See
      objective_budget_floor_note for why these are below the template's 600 s
      floor.
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 5
    maximum_workers: 1

  stopping_rules:
    - >-
      Every run is charged through harness.runner.run_wrapped with an explicit
      deadline on the monotonic clock, checked between target draws for the
      sampling runs. A deadline hit before the declared N is reached is a BUDGET
      OUTCOME (SC-7), reported with the achieved N, and is never treated as a
      defect or as a negative mathematical result.
    - >-
      If the GATE FAILS, the executor stops: no k1 = k2 = 6 control, no
      declared-scale run, no MD5 search arm. It reports the integer counts, names
      the failing clause of the pass predicate, and reports the unspent budget AS
      UNSPENT. The task is COMPLETE at that point and the batch outcome is a
      finding.
    - >-
      If any of CTL-PO6, CTL-PO7 or CTL-PO9 fails in run 1, the executor stops
      before the gate. That is an implementation failure and therefore
      INFRASTRUCTURE SIGNAL (AGENTS.md rule 5, HR-8), NOT a negative mathematical
      result and NOT a finding about the construction.
    - >-
      If CTL-PO4 or CTL-PO5 fails, the executor stops before any declared-scale
      run and reports. A CTL-PO5 failure in particular means a degenerate word
      channel survived the gate, which is a finding about the GATE and must be
      reported as such.
    - >-
      If the H1 sample variance is below 64, the executor reports the number and
      the classification (INSTRUMENT DEGENERACY, a STOP) and does NOT report an
      H1 falsification. The executor never composes a validated / refuted verdict
      on HEUR-H1 at all; it reports comparison statistics only.
    - >-
      Implementation of harness/run_md4_ceiling_v2.py is budgeted separately at up
      to 600 s and is engineering time, not a scored run. Total
      TASK-20260821-372d67 wall-clock may not exceed 1800 s.

  invalidation_rules:
    - id: IR-1
      text: >-
        ANY DECLARED-SCALE RUN EXECUTED WITHOUT A PASSING mandatory_dependence_gate
        IS INVALID, regardless of what it found. This includes a declared-scale run
        whose artifacts predate the gate run, a gate run on a different observable
        or through a different code path than the declared-scale run uses, a gate
        discharged by a simultaneous both-word sweep, and a gate whose phase A did
        not return FAIL on the batch-4 slice. This is the batch's own hard rule
        SC-2 and its breach voids the declared-scale observations entirely.
    - id: IR-2
      text: >-
        Any addition or rotation in the Round-1 step arithmetic performed without
        explicit 32-bit masking (checked by CTL-PO6; a single failure invalidates
        the run).
    - id: IR-3
      text: >-
        The 14 fixed words, the high-order bits of the free words, or any target,
        generated by a procedure or seed other than the exact deterministic ones
        frozen in inputs above. These fields and seeds are IMMUTABLE once this
        contract is frozen (fixed_before_acquisition).
    - id: IR-4
      text: >-
        ANY MD5-SIDE COMPUTATION executed without md5_run_authorization below, or
        executed at any scale, split point, component, seed, target count, or
        wall-clock ceiling different from the declared identical values. An MD5 run
        wider than the MD4 arm in even one field is invalid regardless of outcome
        and is BATCH-HALTING under review-plan-2de43d joint V4.
    - id: IR-5
      text: >-
        Any read of, or derivation from,
        coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml
        or anything else under that quarantine directory (SC-6). This instrument is
        structurally unrelated -- Round-1 MITM/preimage, not a differential
        collision path -- and any consumption finding invalidates the run
        regardless of outcome.
    - id: IR-6
      text: >-
        The declared search space failing to contain the planted pair for a given
        target, at any scale (PO-10 feasibility). That target's result is invalid.
    - id: IR-7
      text: >-
        Editing harness/run_md4_ceiling.py or harness/run_md5_calib.py. Both are
        frozen instruments of record for earlier batches. Only
        harness/run_md4_ceiling_v2.py may be written.
    - id: IR-8
      text: >-
        A run manifest lacking `caveat_refs` (SC-5) or lacking
        code_path_fingerprint (PO-8). Prose disclosure elsewhere does not discharge
        either.
    - id: IR-9
      text: >-
        Reporting the MD5/MD4 full-target-hit ratio R as a finding in either
        direction. R is DECLARED IN ADVANCE to be near-mechanically forced by the
        shared word schedule and to carry essentially no information at these
        parameters (EV-MDFIVE-ab007d O-4, ANOM-1 CAVEAT). It may be computed and
        reported as a raw number with this declaration attached; it may not be
        interpreted.
    - id: IR-10
      text: >-
        Any cost figure that projects toward the approximately 2^64-block
        instrument-class gap, from this batch's figures or BATCH-af29f6's (SC-3;
        DEC-20260821-1215e5 F-8); or any citation of RUN-MDFIVE-primary-md4-v2,
        RUN-MDFIVE-h1-md4 or RUN-MDFIVE-md5-conditional raw metrics without the
        ANOM-1 caveat (SC-4).

  success_criterion: >-
    SC-A (THE GATE, AND IT IS FIRST BECAUSE IT IS THE POINT). The
    mandatory_dependence_gate ran BEFORE any k1 = k2 = 6 control and before any
    declared-scale run, in BOTH DIRECTIONS SEPARATELY plus the joint fiber, on the
    SAME observable through the SAME code path, with phase A returning FAIL on the
    batch-4 slice, and its pass predicate is satisfied -- with BOTH DIRECTIONS'
    DISTINCT-VALUE COUNTS REPORTED AS INTEGERS at 32-bit and 12-bit resolution for
    every held-fixed value. A FAILING GATE HONESTLY REPORTED, WITH ITS INTEGER
    COUNTS AND ITS NAMED FAILING CLAUSE AND NO DECLARED-SCALE RUN, ALSO SATISFIES
    THIS CONTRACT: it is a complete and admissible outcome and every criterion
    below is then returned not_applicable with that reason rather than quietly
    passed.
    SC-B. CTL-PO6 passes exactly on every sampled tuple for both primitives, and
    CTL-PO7 and CTL-PO9 pass.
    SC-C. On a passing gate, CTL-PO4 holds (certificate-verified MITM set equals
    the independent naive Y-reproducing set at k1 = k2 = 6) and CTL-PO5 holds
    (both raw projection widths strictly below 64, raw candidate count at most 4),
    with CTL-OBS's full collision list and CTL-H1B's paired contrast reported.
    SC-D. The MD4 primary run at k1 = k2 = 10 finds a full-20-bit-target match
    whose pair is INDEPENDENTLY RE-VERIFIED by the straight-line 16-step
    recomputation against both the declared low-20 target and the full Round-1
    output state Y, using fewer than 2^18 chunk evaluations, with the raw and the
    certificate-verified counts reported separately.
    SC-E. The H1 validation run reports, for the MD4 arm, the chi-square statistic
    and p-value against Poisson(256) with lambda FIXED a priori, the sample
    variance with its three-way classification, the largest-count Poisson tail
    p-value, and the achieved N -- WHATEVER THEIR VALUES. The executor reports
    comparison statistics ONLY and composes no validated / refuted verdict on
    HEUR-H1.
    SC-F. If and only if the MD5 arm runs under md5_run_authorization: the
    identical statistics are reported for MD5 Round 1, R is reported as a raw
    number carrying its declared-uninformative statement, and every invocation
    parameter is identical to the MD4 arm except the primitive selector and the
    target seed.
    SC-G. Every run manifest carries `caveat_refs` and code_path_fingerprint;
    every cost figure is labeled MEASURED or MODELED; no figure projects toward the
    approximately 2^64-block gap; every BATCH-af29f6 raw metric cited carries the
    ANOM-1 caveat; and the quarantine non-reading attestation is present.

  falsification_criterion: >-
    Per H-MDFIVE-0ca596 falsification_conditions verbatim. In summary: (a) the
    gate fails in either direction at any held-fixed value, or the joint fiber
    count is 1, or phase A PASSES on the batch-4 slice; (b) direction A's four
    repetitions are not byte-identical; (c) CTL-PO4's two sets differ, in
    particular a MISS of the planted pair; (d) CTL-PO5's raw projections cover a
    full window or the raw count exceeds 4; (e) CTL-PO6, CTL-PO7 or CTL-PO9 fails;
    (f) matching-window collision variance below 64 across N targets -- INSTRUMENT
    DEGENERACY, a STOP, explicitly NOT an H1 falsification; (g) chi-square
    p <= 0.05 WITH sample variance inside [128, 512] -- a genuine HEUR-H1
    falsification at this bounded scale, a reportable finding and not a defect;
    (h) v6 below 48 distinct 32-bit values over a 64-value sweep on either side --
    HEUR-H1b falsified at these parameters; (i) the gate's verdict differing
    between MD4 and MD5 -- an implementation defect and a STOP, not a finding.

