# EXP-BINSTD-5993f2
# Weil floors and head-box products. No census.
# Approved by DEC-20261002-e100b1.
experiment:
  id: EXP-BINSTD-5993f2
  hypothesis_id: H-BINSTD-fd7775
  source_idea: IDEA-20260926-5c26f9
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Weil floors and head-box products
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-e100b1
  objective: >-
    Run the pair recurrence through degree 6. Count multiples of 131
    up to each floor. Multiply the two written head boxes. Reject
    equality of the g = 5 product with 1480000000.
  inputs:
    start: {a: 3, b: 2}
    pairs:
      - {g: 1, a: 3, b: 2, floor: 5, real_ceiling: 6, multiples: 0}
      - {g: 2, a: 17, b: 12, floor: 33, real_ceiling: 34, multiples: 0}
      - {g: 3, a: 99, b: 70, floor: 197, real_ceiling: 198, multiples: 1}
      - {g: 4, a: 577, b: 408, floor: 1153, real_ceiling: 1154, multiples: 8}
      - {g: 5, a: 3363, b: 2378, floor: 6725, real_ceiling: 6726, multiples: 51}
      - {g: 6, a: 19601, b: 13860, floor: 39201, real_ceiling: 39202, multiples: 299}
    checks:
      product_51: 6681
      next_52: 6812
      product_299: 39169
      next_300: 39300
      g5_product: 1478330945
      g5_round: 1480000000
      g5_deficit: 1669055
      g6_product: 34107809623425
      g6_above: 34100000000000
      g6_below: 34200000000000
      g6_above_gap: 7809623425
      below_475: [131, 262, 393]
      next_after_475: 524
      below_475_count: 3
      written_gap_g3: 4
      written_gap_g4: 21
      square_181: 32761
      square_182: 33124
      two_to_15: 32768
      two_to_9: 512
      nine_above_eight: true
  controls:
    - >-
      Equality of the g = 5 product with 1480000000 is false. The
      deficit is 1669055. Reporting equality invalidates the run.
    - >-
      Reporting a listed floor equal to 2a is false. The floor is
      2a-1 and the real ceiling is 2a. That report invalidates
      the run.
    - >-
      Reporting 524 at most 475 is false. Exactly three of the eight
      multiples are at most 475. That report invalidates the run.
    - >-
      Reporting the written g = 3 gap as anything but 4 is false
      on the written counts 215 and 211. That report invalidates
      the run.
    - Two integer routes. They must not import each other.
  independent_variables:
    - degree
    - route in {recurrence, repeat_module}
  metrics:
    primary:
      - floors
      - multiples
      - g5_product
      - g5_equality_rejected
      - implementations_agree
    secondary:
      - g6_bracket
      - below_475_count
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Six floors, six multiple counts, and two products.
    formula: >-
      Start at a = 3, b = 2. The next pair is 3a+4b and 2a+3b.
      The floor is 2a-1. The real ceiling is 2a. A multiple count
      is the largest k with 131*k at most the floor. The head
      products are 31*163*455*643 and 37*243*907*1923*2175.
      Compare by subtraction, not by floating point.
    source: >-
      IDEA-20260926-5c26f9 names the pairs, the floors, the
      multiple counts, and the box widths, read 2026-10-02. The
      products and the deficit 1669055 were recomputed in this
      design session. That computation is not a run. The round
      figure 1.48e9 is above the product. No census was run.
  scale_relevance:
    tier: toy
    justification: Integer recurrence and two products. No transfer to a class count.
    correspondence: null
  tail_checks:
    - Degree 6 is required. Stopping after degree 5 and still reporting the degree-6 product is invalid.
  replication:
    seeds: []
    independent_instances: 6
    replication_note: Deterministic. The second run is the other integer route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the g = 5 product is reported equal to 1480000000, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The g = 5 product is reported equal to 1480000000.
    - A listed floor is reported equal to 2a.
    - 524 is reported at most 475.
    - The written g = 3 gap is reported as anything but 4.
    - A Weil-polynomial census or a hit list is reported.
  success_criterion: >-
    Both runs agree on the six pairs, the six floors, the six real
    ceilings, the six multiple counts, both products, the deficit
    1669055, the three multiples at most 475, and the gaps 4 and 21.
    The g = 5 product stays strictly below 1480000000. Each floor
    stays one below its real ceiling.
  falsification_criterion: >-
    The runs agree, the g = 5 product stays below 1480000000, each
    floor stays equal to 2a-1, and any pair, multiple count, or
    product differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-BINSTD-5993f2/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-5993f2/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-5993f2/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-5993f2/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-5993f2/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-5993f2/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any Weil-polynomial census, Sturm test, or hit list.
    - A claim that dimension 5 or 6 is empty or nonempty.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
