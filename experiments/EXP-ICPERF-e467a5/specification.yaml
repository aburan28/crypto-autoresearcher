# EXP-ICPERF-e467a5 — stage-0 instrument for H-ICPERF-2f52d1.
# Frozen under DEC-20261017-95d677. No run, outcome, or conclusion is in this file.
experiment:
  id: EXP-ICPERF-e467a5
  hypothesis_id: H-ICPERF-2f52d1
  source_idea: IDEA-20261015-7a3c9e
  question_id: RQ-ICPERF-94c86e
  goal_id: GOAL-ICPERF-e6b6a4
  version: 1
  title: >-
    Stage-0 instrument: integer price-ratio identity at three toy (r, A) cells
  status: approved
  frozen: true
  designed_at: '2026-10-17'
  approved_by: DEC-20261017-95d677
  execution_authorized: true
  objective: >-
    Run one preregistered deterministic cell. With c_probe = 370 ns,
    c_state = 2100 ns, c_step = 40 ns, and BL constant 21/10, record the
    reduced price ratio and the online ratios at (r, A) = (1000, 2),
    (4000, 2), and (1000, 4), each with a 10-state table. Do not read a
    host receipt and do not estimate an n=83 speedup.
  inputs:
    c_probe_ns: 370
    c_state_ns: 2100
    c_step_ns: 40
    bl_num: 21
    bl_den: 10
    states: 10
    cells:
      - {name: r1000_a2, r: 1000, A: 2}
      - {name: r4000_a2, r: 4000, A: 2}
      - {name: r1000_a4, r: 1000, A: 4}
    runner: experiments/EXP-ICPERF-e467a5/implementation/run.py
  controls:
    - >-
      The (r, A) = (1000, 4) cell changes A and must keep the same reduced
      ratio as the price formula.
    - >-
      The (r, A) = (4000, 2) cell changes r and must keep the same reduced
      ratio as the price formula.
    - >-
      Each cell's probe count is compared with (r/A)/states, the baby-step
      giant-step count on a table of the same size.
  independent_variables:
    - r in {1000, 4000}
    - A in {2, 4}
  metrics:
    primary:
      - price_ratio_num
      - price_ratio_den
      - ratios_agree
      - all_match_bsgs
    secondary:
      - elapsed_seconds
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The reduced price ratio is 925/4. Each of the three cells has that
      same reduced online ratio, and each probe count equals (r/A)/states.
    formula: >-
      price = (370 * 2100 * 10) / (21 * 40 * 40) = 925/4.
      At (1000, 2) the online times are 18500 ns and 80 ns.
      At (4000, 2) they are 74000 ns and 320 ns.
      At (1000, 4) they are 9250 ns and 40 ns.
      Each reduced ratio is 925/4. Probe counts are 50, 200, and 25.
    source: >-
      The integers were evaluated by experiments/EXP-ICPERF-e467a5/implementation/run.py
      in a design-time directory before this contract was frozen. They are
      not a host measurement and not the n=83 figure in IDEA-20261015-7a3c9e.
  scale_relevance:
    tier: toy
    justification: >-
      Three exact integer cells. No transfer to section-23 sizes, to n=83,
      or to a memory-latency model.
    correspondence: null
  tail_checks: []
  replication:
    seeds: []
    independent_instances: 1
    seed_policy: >-
      Deterministic arithmetic. No seed is drawn.
  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    wall_clock_seconds_per_run: 60
  stopping_rules:
    - Stop after the single preregistered cell. Do not open a host receipt in this version.
  invalidation_rules:
    - >-
      A crash, timeout, or an inexact division invalidates the instrument
      run. It is not evidence about the n=83 arm.
    - >-
      Changing a price, a cell, or the BL numerator after this freeze
      requires an amendment. It is not a rerun of version 1.
  success_criterion: >-
    The run records price_ratio_num 925, price_ratio_den 4, ratios_agree
    true, and all_match_bsgs true, at the three preregistered cells.
  falsification_criterion: >-
    The run records a complete cell in which price_ratio_num is not 925, or
    price_ratio_den is not 4, or ratios_agree is false, or all_match_bsgs
    is false. That result invalidates the instrument cell and does not
    decide the measured-price claim of IDEA-20261015-7a3c9e.
  decision_impact:
    on_positive: >-
      The integer identity holds on these three cells. A later amendment
      may bind host receipts for c_probe, c_state, and c_step. This pass
      does not reproduce the 2.0-8.0x table or the n=83 arm, and it does
      not close IDEA-20261015-7a3c9e.
    on_negative: >-
      The integer identity failed. Do not schedule a host comparison from
      this runner. Repair the instrument by amendment. Do not read the
      failure as evidence that the measured deficit grows with r.
  required_artifacts:
    - experiments/EXP-ICPERF-e467a5/runs/RUN-ICPERF-943efa/manifest.yaml
    - experiments/EXP-ICPERF-e467a5/runs/RUN-ICPERF-943efa/raw-result.json
    - experiments/EXP-ICPERF-e467a5/runs/RUN-ICPERF-943efa/RESULTS.md
  assigned_to: executor
  scope_note: >-
    Version 1 is the integer identity only. Section-23 receipts, the n=83
    arm, and the ordinary-curve control remain proposed. No external
    computer-algebra system is on the path.
