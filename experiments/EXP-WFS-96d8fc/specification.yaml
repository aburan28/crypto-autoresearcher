experiment:
  id: EXP-WFS-96d8fc
  hypothesis_id: H-WFS-06cf63
  derived_from_idea: IDEA-20260809-792aca
  question_id: RQ-WFS-e776b6
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Complete per-class enumeration of Fiat-Shamir omission failures in this program's
    own reference sumcheck argument - one constructive forgery artifact per class,
    with the zero-omission slice as the blocking control and a structural reason
    required for every empty cell

  objective: >-
    The one uncertainty a run reduces is whether the omission lattice of a Fiat-Shamir
    transform can be enumerated COMPLETELY with a constructive forgery artifact for
    each class, rather than sampled - and, where a class yields no forgery, whether the
    reason is structural or merely unfound. A run establishes (i) whether the
    zero-omission slice admits no forgery in the declared construction class, which is
    a precondition for every other cell being interpretable; (ii) per single-element
    omission class, whether a forgery of a genuinely false statement is constructed in
    bounded time without resampling and is accepted by an independently written honest
    verifier; (iii) whether honest proofs of true statements verify at every omission
    setting, which is the claim that these defects are invisible to functional testing;
    and (iv) the pair-omission arm as a secondary table. NOTHING HERE EXAMINES, NAMES,
    TESTS OR IMPLICATES ANY THIRD-PARTY SYSTEM.

  what_this_is_not:
    - >-
      Not an examination, test, audit or disclosure concerning any third-party proof
      system, library, circuit, protocol implementation or deployment. Every artifact
      is against this program's own reference implementation with a transform that was
      deliberately weakened by configuration.
    - >-
      Not a new attack class. The weak-Fiat-Shamir failure mode is published; the
      content here is completeness and artifacts, not novelty.
    - >-
      Not an answer to the decidability question this goal ultimately asks. It builds
      the ground truth that question will be scored against.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run has
      been executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE. For this program's reference 3-to-4-round
      sumcheck-style argument over the declared prime field, with the declared
      construction class: k of the n enumerated single-element omission classes admit a
      constructive forgery accepted by an independent honest verifier; the remaining
      n - k are each either structurally explained or recorded UNDETERMINED; the
      zero-omission slice admits none; and honest proofs verify at every setting.
      WHAT DOES NOT FOLLOW - nothing about any other protocol or implementation;
      nothing about whether exploitability is decidable from a specification; no
      security claim, advisory or disclosure about anything outside this repository;
      and no assertion that an unfound forgery does not exist.

  inputs:
    procedure: >-
      STAGE 0 (zero compute, DECLARED FIRST). Write out the complete single-element
      omission list from the protocol's hash-input specification - statement, public
      parameters, round index/domain separator, and each prior prover message - and
      hash the list. The list is fixed before any forgery is attempted, so that a class
      cannot be quietly dropped after it resists.
      STAGE 1 (minutes, BLOCKING CONTROL). At the zero-omission slice, verify that
      honest proofs of true statements verify, and attempt every forgery construction
      in the declared class. Require ZERO successes. If any succeeds, stop; the
      implementation has an unrelated soundness defect and no per-class result is
      interpretable.
      STAGE 2 (minutes per class). For each single-element omission, construct a
      forgery of a false statement by the family-appropriate construction - statement
      chosen last, prior message re-chosen at a fixed challenge, or round transplant -
      three times with distinct seeds. Record wall time and the number of resamplings
      over the challenge space, which must be zero for the class to count as
      constructive.
      STAGE 3 (per class). Submit every forgery to the INDEPENDENTLY WRITTEN honest
      verifier and record acceptance. Independently confirm the proved statement is in
      fact false, by direct evaluation of the sumcheck claim.
      STAGE 4 (minutes). For every omission setting including the empty one, verify
      honest proofs of TRUE statements. All must verify; a setting where they do not is
      functionally visible and is excluded from the ground-truth table with its reason.
      STAGE 5. Repeat STAGE 2 and 3 over the pair-omission arm as a secondary table,
      reported separately and never merged into the single-element count.
      STAGE 6 (zero compute). Assemble the table. Every empty cell carries either a
      structural reason naming the prover freedom the omission fails to open, or the
      label UNDETERMINED. An empty cell with neither is a defect of this run.
    instrument: >-
      Python 3.11, pure Python integer arithmetic modulo a fixed prime of at least 61
      bits. Three separate modules - prover, honest verifier, forgery constructions -
      with the verifier importing neither of the others, so acceptance is not an
      artifact of a shared helper. Hashing by hashlib over an explicitly assembled,
      configurable element list, so an omission is a configuration and not a code edit.
      Recorded through harness/runner.py.
    parameters: >-
      Rounds 3 and 4. Prime field of at least 61 bits. Sumcheck claim over a low-degree
      multivariate polynomial on the boolean cube. Three forgeries per class at seeds
      20260825, 20260826, 20260827. Omission lattice as declared at STAGE 0: all
      single-element omissions as the primary arm, all pairs as the secondary arm.
      Per-class construction budget 10 seconds; a class exceeding it is recorded as
      search-based or unfilled, never as "no forgery exists".

  controls:
    - >-
      COMPLETE-TRANSFORM CONTROL, BLOCKING. At the zero-omission slice no forgery in
      the declared construction class may be constructible. If one is, the
      implementation has a soundness defect independent of Fiat-Shamir and EVERY
      per-class result is confounded and void.
    - >-
      HONEST-PROOF CONTROL. Honest proofs of true statements must verify at every
      omission setting, establishing that the omissions are invisible to functional
      testing - which is the point of the whole record. A setting where they do not is
      excluded from the ground-truth table and reported with its reason.
    - >-
      INDEPENDENT VERIFIER. Acceptance is decided by a verifier module that imports
      neither the prover nor the forgery constructions. A forgery accepted only by its
      own prover's verifier is discarded and counted as discarded.
    - >-
      FALSITY CHECK. Every statement claimed false is independently confirmed false by
      direct evaluation, because a "forgery" of a true statement is an honest proof.
    - >-
      SEARCH DETECTOR. The number of resamplings over the challenge space is counted
      per construction and must be zero for the class to enter the constructive column.
      This is what keeps "constructive" from degrading into "eventually found".
    - >-
      STRUCTURAL-REASON REQUIREMENT ON EVERY EMPTY CELL. A class with no forgery must
      name which prover freedom the omission fails to open. Without one it is
      UNDETERMINED. This is the control that prevents "we did not find one" from being
      read as "none exists".
    - >-
      PAIR ARM REPORTED SEPARATELY, so that a pair success is never used to fill a
      single-element cell.

  independent_variables:
    - omission class (which element is excluded from the hash input)
    - number of rounds (3 or 4)
    - 'arm: single-element omission versus pair omission versus zero-omission slice'
    - 'statement truth value: true (honest-proof control) versus false (forgery arm)'
    - seed

  metrics:
    primary:
      - >-
        Per-class verdict in {CONSTRUCTIVE_FORGERY, SEARCH_BASED, NO_FORGERY_EXPLAINED,
        UNDETERMINED}, assigned by the rules in the success criterion, one row per
        enumerated class.
      - >-
        Count of classes with a constructive forgery, out of the total enumerated at
        STAGE 0, reported as a fraction with both numerator and denominator.
      - >-
        Independent-verifier acceptance rate over all reported forgeries, computed as
        accepted divided by submitted.
      - >-
        Forgeries constructible at the zero-omission slice, an integer that must be 0.
      - >-
        Honest-proof verification rate per omission setting, computed as verified
        divided by attempted over true statements.
      - >-
        Resampling count per construction, an integer that must be 0 for a class to
        count as constructive.
    secondary:
      - Construction wall time per class and per seed, in seconds.
      - Falsity-check outcome per forged statement.
      - Pair-omission table, reported separately from the single-element count.
      - Count of cells labelled UNDETERMINED, reported and not minimized.
      - sha256 of the STAGE 0 omission list and of each forgery transcript.
      - Discarded-forgery count, with the reason per discard.

  heuristic_under_test: null
  heuristic_under_test_note: >-
    Explicitly null. H-WFS-06cf63 carries no numbered heuristic; every claim is a
    construction exhibited on a concrete implementation or a check performed on it.

  preregistered_prediction:
    quantity: >-
      The count of enumerated single-element omission classes receiving the verdict
      CONSTRUCTIVE_FORGERY, and the integer count of forgeries at the zero-omission
      slice.
    formula: >-
      Predicted - every class omitting the statement or a prior prover message receives
      CONSTRUCTIVE_FORGERY, and the zero-omission slice yields exactly 0. Predicted
      construction time under 10 seconds per class with 0 resamplings. Under the
      alternative that some hashed element is not load-bearing in this protocol, at
      least one class receives NO_FORGERY_EXPLAINED with a named structural reason, and
      that is the informative outcome.
    source: >-
      Pre-registered in the parent proposal IDEA-20260809-792aca, whose predictions
      block states "All single-element omissions of statement or prior messages yield
      forgeries. A class with no forgery is the interesting case." The verdict taxonomy
      and the resampling detector are this contract's addition, added so that "no
      forgery found" cannot be silently read as "no forgery exists".

  scale_relevance:
    tier: toy
    justification: >-
      One reference protocol at 3 and 4 rounds over a 61-bit field, which is toy by
      construction and deliberately so - the object of study is the omission lattice,
      which is finite and complete at any round count, not the protocol's parameters.
      NO TRANSFER IS CLAIMED to any other protocol, and specifically none to any
      third-party system. The one transfer the deliverable is FOR is internal: the
      table becomes the false-negative scoring set for a later decidability procedure
      inside this program, and that use is stated so a reviewer can check it.
    correspondence: null

  tail_checks:
    - >-
      Report the denominator of the class count, not only the numerator; a count out of
      an unstated total is not a completeness claim.
    - >-
      Report every UNDETERMINED cell explicitly and never fold it into either column;
      a table with no undetermined cells on first attempt deserves scrutiny rather than
      confidence.
    - >-
      Report per-seed outcomes; a class that forges under one seed and not another is
      search-based regardless of its measured resampling count.
    - >-
      Report the discard reasons, since a forgery discarded for failing the falsity
      check is a different defect from one discarded for verifier rejection.

  replication:
    seeds: [20260825, 20260826, 20260827]
    independent_instances: 3
    repeat_count_per_cell: 3
    note: >-
      Three independent forgery attempts per class with distinct seeds. Constructive
      forgeries must succeed on all three; success on a strict subset is the signature
      of a search and is classified as SEARCH_BASED.

  budget:
    wall_clock_seconds: 1800
    wall_clock_seconds_note: Per run. total_cpu_hours bounds the whole contract.
    total_cpu_hours: 1.0
    memory_gb: 2
    maximum_runs: 20

  stopping_rules:
    - >-
      Stop the entire contract if any forgery succeeds at the zero-omission slice, and
      report only that; the implementation defect is the deliverable.
    - >-
      Stop a class's construction at 10 seconds and classify it SEARCH_BASED or
      UNDETERMINED with its measured resampling count; never as "no forgery exists".
    - >-
      Stop and report if honest proofs fail to verify at the zero-omission slice, since
      the reference protocol is then not correct and nothing else is interpretable.
    - >-
      Stop at maximum_runs or total_cpu_hours. Budget exhaustion is a stop, never a
      negative result (AGENTS.md rule 5).

  invalidation_rules:
    - >-
      A timeout, crash or dependency failure makes the run failed_infrastructure and is
      NEVER evidence that a class admits no forgery.
    - >-
      A run in which the zero-omission control was not executed in the same invocation
      as the omission arms is invalid_measurement.
    - >-
      A run whose honest verifier imports the prover or the forgery module is
      invalid_measurement, because acceptance may be an artifact of a shared helper.
    - >-
      A run in which the STAGE 0 omission list was modified after any forgery attempt
      is invalid_measurement, because completeness is then unverifiable.
    - >-
      A run reporting a forgery whose statement was not independently confirmed false
      is completed_invalid (docs/claims-and-verification.md).
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment
      and requires a new contract.

  success_criterion: >-
    ALL of the following, each decidable from the primary metrics. (1) Zero forgeries
    at the zero-omission slice. (2) Honest-proof verification rate exactly 1.000 at
    every omission setting. (3) Independent-verifier acceptance rate exactly 1.000 over
    every reported forgery, with every forged statement independently confirmed false.
    (4) Every enumerated class carries exactly one of the four verdicts, assigned by
    these rules: CONSTRUCTIVE_FORGERY if all three seeds succeed within 10 seconds with
    zero resamplings and the verifier accepts; SEARCH_BASED if success required
    resampling or succeeded on a strict subset of seeds; NO_FORGERY_EXPLAINED if no
    forgery was produced AND a structural reason names the prover freedom the omission
    fails to open; UNDETERMINED otherwise. A run meeting (1) to (4) is VALID and its
    verdict on H-WFS-06cf63 is then read directly: (W2) is supported in scope only if
    every class omitting the statement or a prior prover message receives
    CONSTRUCTIVE_FORGERY.

  falsification_criterion:
    - >-
      A forgery at the zero-omission slice falsifies (W3) and voids every per-class
      result; the deliverable is the unrelated soundness defect.
    - >-
      Any class omitting the statement or a prior message receiving
      NO_FORGERY_EXPLAINED falsifies (W2) as stated. The enumeration's premise is
      refined - not every hashed element is load-bearing - and the structural reason is
      the most valuable single artifact this contract can produce.
    - >-
      Honest proofs failing at some omission setting falsifies the functional-
      invisibility premise for that class, which is excluded from the ground-truth table.
    - >-
      A reported forgery rejected by the independent verifier, or proving a statement
      that is not false, falsifies that class's entry and it is discarded and counted.
    - >-
      A class succeeding only after resampling falsifies (W2)'s CONSTRUCTIVE character
      for that class, which is then reported as SEARCH_BASED - a materially weaker fact
      that must not be counted in the constructive column.
    - >-
      An enumeration that cannot be shown closed - a class discovered after STAGE 0 -
      falsifies (W1) and the table is reported as incomplete with the missed class named.

  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - the STAGE 0 omission list, hashed, written before any forgery attempt
    - raw-result.json with per-class, per-seed outcomes including timings and resampling counts
    - one forgery transcript artifact per CONSTRUCTIVE_FORGERY class, replayable against the independent verifier
    - the zero-omission control's measurements, in the same file as the omission arms
    - the falsity-check output for every forged statement
    - the structural reason text for every NO_FORGERY_EXPLAINED cell
    - the pair-omission secondary table, kept separate from the single-element table

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and NOT
      approved; approved_by is null and execution_authorized is false. Approval is the
      USER's gate because it authorizes execution and spends compute.
    - >-
      SCOPE GATE, BINDING. The reference protocol and its transform must be this
      program's own code. A version of this contract pointed at any third-party
      library, proof system or deployment must not be approved under this record; that
      would be a different activity with different obligations.
    - >-
      The blocking zero-omission control must remain in the frozen protocol. Without it
      a per-class success cannot be attributed to the omission.

  derivation_provenance:
    tool: coordinator subagent, /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260809-792aca
    authored_at: '2026-08-25'
    note: >-
      The omission families and their constructions, the complete-transform control and
      the honest-proof control come from the parent proposal's mechanism and controls
      blocks. THE FOUR-VALUED VERDICT TAXONOMY, the resampling detector and the
      structural-reason requirement on empty cells are this contract's additions, added
      because the proposal's "a class with no forgery is the interesting case" is only
      informative if "not found" and "does not exist" are kept apart. Budgets come from
      the parent's estimated_cost (implementation medium, compute negligible). No
      measurement, timing, run or citation is invented.

  derivation_gaps:
    - >-
      "The declared construction class" is named but not enumerated in this contract,
      because it depends on the verifier check the executor implements. A Coordinator
      must fix it at approval, since the zero-omission control's meaning is exactly
      "no forgery IN THIS CLASS", and a control over an unstated class asserts nothing.
    - >-
      Whether pair omissions are strictly more exploitable than single ones is not
      assumed and not tested as a claim; the pair arm is descriptive and its table must
      not be used to fill a single-element cell.
    - >-
      The parent proposal cites "weak Fiat-Shamir disclosures and the sumcheck
      protocol" as RECALLED, REQUIRED READS, none of which has been read by this
      program. The reference protocol is therefore assembled from a recalled schema and
      its provenance must be recorded as recalled in the manifest; no published result
      is reproduced, confirmed or contradicted.
    - >-
      The deliverable's intended downstream use - scoring a decidability procedure for
      false negatives - requires the table to be COMPLETE. Every UNDETERMINED cell
      degrades that use proportionally, and the count of such cells must travel with
      the table wherever it is cited.
