experiment:
  id: EXP-AES-3283d3
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-AES-8c2d07
  question_id: RQ-AES-002
  goal_id: GOAL-AES-002
  batch_id: null
  batch_id_note: >-
    NULL BY FACT. GOAL-AES-002 has no committed batch; naming one would be a
    fabrication under AGENTS.md rule 9.
  assigned_to: executor
  title: >-
    The full-round sensitivity ladder and the verification-path audit: a
    ten-round AES-shaped object with rank(M_K) = 128 and a forced one-pair key
    recovery, a graded nonlinearity ladder, and a layer-resident mutation matrix
    over the campaign's declared verifier pair

  objective: >-
    Build and verify the objects and the instrument checks that GOAL-AES-002's
    completion criteria C1, C3 and C4 presuppose but that its ranked next_action
    does not create: (i) a FULL-ROUND-COUNT positive control, L0, on which a
    screening instrument must fire, whose key-recovery answer is derived before
    the run; (ii) a graded nonlinearity ladder L1 with three interior points
    whose monotonicity localises an instrument artifact rather than leaving "it
    did not work"; (iii) a structural rung L2 with forced dependency
    cardinalities; and (iv) a decisive measurement of whether the two
    implementations that C1 and C4 require for certificate re-verification are
    installed and layer-disjoint at all. All four are instrument and
    infrastructure findings and none is evidence about AES.

  what_this_is_not:
    - >-
      NOT an attack on AES, not a distinguisher on AES, not a key recovery on
      AES. L0 has NO S-BOX; it is AES's round geometry with the nonlinear layer
      deleted, and no statement about L0 is a statement about AES.
    - >-
      NOT a completion of GOAL-AES-002 under any criterion. GOAL-AES-002
      non_completion_criteria (vi) rules explicitly that a passing harness, a
      repaired mutation control, a frozen cost model and a throughput receipt are
      INFRASTRUCTURE and are not completions; that ruling governs this contract
      and is quoted here so nobody has to look it up.
    - >-
      NOT a cost claim about AES and NOT a margin against the published state of
      the art, which is UNADJUDICABLE in this environment and is asserted in
      neither direction.
    - >-
      NOT a claim that any verifier is CORRECT. Correctness is not testable from
      inside the stack under test; KN-FIND-029 records that the evasion class is
      not closable by an in-process instrument, and that residual is DECLARED OUT
      of the threat model on that stated ground.
    - >-
      NOT approval, freezing, execution authorization, a run, an observed output,
      or evidence. No run has happened.
    - >-
      NOT a resolution of RQ-AES-002's recorded toolchain contradiction. Stage 0
      contributes a measurement to it; the rank-3 measured-envelope receipt named
      in GOAL-AES-002's next_action is the artifact that resolves it.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      TOY TIER for every rung reading, notwithstanding the full ten-round count,
      because the objects are structurally weakened analogues (AGENTS.md rule 7,
      RQ-AES-002 R7). The `crypto` tier that R7 opens applies to a re-verified
      FULL-ROUND AES key recovery and NOT to L0; conflating them is the exact
      claim-tier violation R5 names. A completed run could support exactly these
      sentences: "the L0 object as constructed is GF(2)-affine at ten rounds with
      rank(M_K) = <measured> and its key is recovered from one pair and
      re-verified at rate <measured>"; "instrument X fires at rungs <list> and is
      silent at rungs <list>, in this container, on this object set"; and "the
      declared verifier pair does / does not share a layer, on the tested mutation
      set". L0's roughly 106-bit margin, wherever stated, is a margin ON THE L0
      OBJECT against the DEFINITIONAL exhaustive-key-search reference for a
      128-bit key under CM-1, and the published-state-of-the-art comparison is
      UNADJUDICABLE in this environment and is asserted in neither direction
      (RQ-AES-002 R5 anti-laundering clause, carried in the same sentence).

  blocking_gate_BLK_1: >-
    BINDING, AND STATED BEFORE ANYTHING ELSE IN THE CONTRACT BODY. Stage 3 of this
    experiment PRODUCES A KEY RECOVERY on the L0 object. RQ-AES-002 names BLK-1 as
    an infrastructure blocker: the certificate vocabulary of
    docs/claims-and-verification.md admits only discrete_log | decomposition |
    none, and check_run in tools/validate_ledger.py errors on any other value, so
    no conforming run may currently emit a key-recovery certificate.
    THEREFORE: the CERTIFICATE-EMITTING form of stage 3 MAY NOT BE DISPATCHED
    until protocol-amendment-GOAL-AES-002-001 is authored, approved and COMMITTED
    -- a gate uncommitted when the card is issued is exactly the retroactive
    enforcement GOAL-AES-002's amendments_note refuses. A NON-CERTIFICATE-EMITTING
    form of stage 3 (recovery performed and re-verified, with the result recorded
    as a task artifact and NOT as a run certificate) may be dispatched earlier,
    and the dispatching card MUST state which form it authorizes. Running the
    certificate form before the amendment is committed is invalid_measurement.

  inputs:
    key_size: 128
    rounds: 10
    rungs:
      L0: "identity S-box in the encryption AND in the key schedule (SubWord)"
      L0_sibling: "real S-box in the encryption, identity SubWord in the key schedule"
      L1: "identity S-box on exactly t of 16 byte positions in every round, real key schedule; t in [16, 12, 8, 4, 0]"
      L1_position_rule: >-
        For t < 16 the identity positions are the first t indices of the state
        under the fixed order 4*column + row, i.e. positions 0..t-1. The order is
        declared here so the object is reproducible; a per-run random choice would
        make the rung unreproducible and is forbidden.
      L2: "MixColumns replaced by the identity in all rounds, real S-box and real key schedule"
      L3: "real AES-128, ten rounds, pinned implementation, unmodified"
      RANDPERM: "a uniformly random 128-bit bijection substituted for the whole cipher"
    affinity_triples: 1000
    recovery_keys: 100
    mutations_per_resident_layer: 32
    mutation_resident_layers:
      - "python wrapper of verifier A only"
      - "python wrapper shared by both verifiers"
      - "the shared dynamic library (libcrypto), if mutation is possible in-container"
      - "the constant tables compiled into the from-definition pure-Python verifier"
    verifier_pairs:
      declared: "the campaign's declared pair as it can actually be instantiated in this container"
      known_dependent_null: "the openssl CLI invoked through two different Python subprocess wrappers"
      layer_disjoint_positive: "from-definition pure-Python AES paired with the openssl CLI"
    field: "GF(2^8), modulus 0x11b, exact arithmetic; GF(2) elimination exact"
    master_seed: 328303
    domain: "EXP-AES-3283d3/v1"
    seed_derivation_rule: >-
      seed_bytes(label, rung, counter) = ASCII bytes of
      domain || "|" || label || "|" || rung || "|" || decimal(counter);
      h = SHA-256(seed_bytes(...)) big-endian unsigned.
      Key triples for the affinity test: K1 = low 128 bits of h with label "k1",
      K2 = low 128 bits of h with label "k2", counter advancing by 1 per triple.
      Recovery keys: low 128 bits of h with label "reckey".
      Known plaintext: low 128 bits of h with label "recpt".
      RANDPERM key: low 128 bits of h with label "randperm".
      Mutation selection: bit index = h mod (8 * artifact_byte_length) with label
      "mutation", redrawn on collision with an already-used index.
      Counters advance by 1 per draw and never reset within a cell.

  arms_and_controls:
    treatment: >-
      L0, L1 at five values of t, L2 and L3, each read by whatever screening
      instruments are presented; plus the declared verifier pair's mutation
      matrix. Read LAST, after the controls below are measured and
      hash-committed.
    measured_null: >-
      RANDPERM -- a uniformly random 128-bit bijection substituted for the whole
      cipher. FORCED VALUES DERIVED BEFORE THE RUN: the affinity identity must
      FAIL (0/1000 triples pass); the L2 dependency cardinalities must FAIL (a
      random bijection has every ciphertext byte depending on all 16 plaintext
      bytes). A structural test that passes on a random permutation is not testing
      structure, so this null can genuinely fail the instrument.
    sibling_null: >-
      L0_sibling -- real S-box in the encryption, identity SubWord in the key
      schedule. FORCED: the affinity test MUST FAIL at 0/1000. This is the null
      that ISOLATES the property L0 names (KN-FIND-029 practice rule): if the
      affinity test passes here, it is reading the key schedule rather than the
      cipher and L0's reading is void.
    known_dependent_verifier_null: >-
      The openssl CLI invoked through two different Python subprocess wrappers.
      FORCED: shared-layer mutation catch rate EXACTLY 0/32 and known-answer pass
      rate EXACTLY 1. If this pair catches ANY shared-layer mutation, the planted
      faults are not actually shared, the layer model is wrong, and the whole
      verifier audit is redesigned before any verdict.
    positive_control: >-
      TWO, BOTH OF WHICH MUST FIRE.
      (i) L0 ITSELF: the effect -- recovery of the master key from ONE known
      plaintext/ciphertext pair -- MUST appear at the FULL ten-round count. If it
      does not, the pipeline is broken and NO negative result about any object may
      be reported at all.
      (ii) THE LAYER-DISJOINT VERIFIER PAIR: from-definition pure-Python AES with
      the openssl CLI must catch EVERY planted mutation resident in either stack,
      at 32/32. If it does not, the mutation harness is broken and nothing may be
      reported in either direction.
    graded_control: >-
      L1 at t = 16, 12, 8, 4, 0 -- three genuine interior points -- with each
      instrument's sensitivity statistic reported per rung and its MONOTONICITY in
      (16 - t) reported as a first-class result. A non-monotone profile localises
      an artifact in the instrument and halts interpretation of that instrument.
      The mutation matrix carries its own grading over four resident layers, with
      catch rate required monotone non-increasing in depth of sharing.
    ordering_control: >-
      RANDPERM, L0_sibling and the known-dependent verifier null are measured and
      hash-committed IN FULL before any treatment rung or the declared verifier
      pair is looked at. Absence of that commitment is invalid_measurement.
    ladder_fixity_control: >-
      THE LADDER IS FIXED BY THIS CONTRACT AND MAY NOT BE RE-CHOSEN PER
      INSTRUMENT. Selecting rungs after seeing an instrument's result would
      satisfy the vacuous quantifier order (for all instruments there exists a
      ladder on which it looks sensitive), which H-AES-8c2d07's quantifier_order
      explicitly refuses. Any rung added later is a new contract.
    ground_truth_control: >-
      After every rung is built, the PINNED FIPS-197 implementation is re-run
      against its known-answer vectors and must still pass byte-for-byte, proving
      the ladder did not perturb the ground truth. Failure here invalidates the
      package.
    mutation_liveness_control: >-
      Every planted mutation must first be shown to change the output of a
      SINGLE-verifier run before it enters the pair comparison. A mutation that
      changes nothing is discarded from the matrix and the discard is recorded
      with its reason, so that a catch rate of 0 cannot be manufactured by dead
      code.

  metrics:
    primary:
      - rank(M_K) and rank(M_P) over GF(2) at r = 10 for L0, by exact elimination.
      - Affinity pass count out of 1000 triples, for L0, L0_sibling and RANDPERM.
      - L0 end-to-end recovery rate out of 100 keys, with independent re-verification.
      - Mutation catch rate per resident layer, per verifier pair, out of 32.
      - Per-instrument fire/silent verdict per rung, with the monotonicity verdict across L1.
    secondary:
      - L2 dependency cardinalities (plaintext bytes and round-key bytes per ciphertext byte) from exhaustive single-bit flips.
      - Effective S-box interpolation support and exponent list per verifier (the 9-term identity).
      - Stage-0 environment transcript: import results, package versions, openssl version, gcc/-maes result, numpy presence, core count, memory.
      - Linkage evidence per verifier, or an explicit statement that linkage could not be determined.
      - Pinned known-answer re-verification result after ladder construction.
      - Wall clock, peak RSS, contention state, and the exact command line.

  preregistered_prediction:
    quantity: >-
      The GF(2) rank of the key map of ten-round identity-S-box AES-128, the
      dependency cardinalities of the MixColumns-free rung, and the mutation catch
      rate as a function of fault residence.
    formula: >-
      rank(M_K) = 128 and rank(M_P) = 128 at r = 10, so K is unique from one known
      pair and is recovered in ~128^3 = 2.10e6 bit operations (about 2^21);
      L2 dependency cardinalities exactly 1 plaintext byte and exactly 11
      round-key bytes per ciphertext byte, from the ShiftRows orbit structure once
      MixColumns is removed; catch rate exactly 0 for faults resident in a shared
      layer and exactly 1 for faults resident above it, from determinism of the
      shared computation.
    source: >-
      Derived in H-AES-8c2d07 mechanism, parts A and C. NOT cited from any
      document; no primary source was read. The rank values were SESSION-COMPUTED
      by the ideation session on this machine OUTSIDE the harness and are
      candidates to re-run in-harness, never run records; stage 1 re-takes them
      and a discrepancy is reported, not reconciled.

  scale_relevance:
    tier: toy
    justification: >-
      The rungs are at the FULL ten-round count, which is exactly why the ladder
      is worth building for a full-round question, but they are structurally
      weakened analogues, so nothing measured on them transfers to AES. What DOES
      transfer, and is the deliverable, is a statement about an INSTRUMENT: a
      sensitivity profile measured at the full round count constrains what that
      instrument's silence on L3 can be taken to mean. The verifier audit is
      container-scoped and transfers to nothing outside this container.
    correspondence: null

  replication:
    seeds: [328303, 328304, 328305]
    independent_instances: 3
    interpretation: >-
      Three independent seed streams for the affinity, recovery and mutation
      arms. The rank computations are deterministic and are simply recomputed;
      their agreement across two independent implementations of GF(2) elimination
      is a required artifact, since a single elimination bug would silently
      produce a wrong forced value.

  budget:
    wall_clock_seconds_per_run: 1200
    maximum_wall_seconds: 3600
    total_cpu_hours: 1.0
    maximum_memory_gb: 2
    maximum_runs: 3
    maximum_workers: 1
    no_network: true
    contention_note: >-
      Concurrency is capped at 3 tasks ACROSS GOAL-AES-001 AND GOAL-AES-002, not
      3 each. If honouring that cap is impossible, this contract WAITS rather than
      running degraded, per GOAL-AES-002's next_action.

  stopping_rules:
    - >-
      Do not execute unless this contract is separately reviewed, approved,
      frozen and archived by the Coordinator, and execution is authorized. Only
      the Coordinator approves (AGENTS.md rule 1); no approved_by field is
      present.
    - >-
      STAGE 0 IS THE CHEAPEST DECISIVE GATE AND RUNS FIRST, AND IT CAN END A
      WHOLE ARM IN ONE SHELL LINE: re-measure the container -- `import Crypto`,
      package versions, `openssl version`, gcc with -maes, numpy, cores, memory --
      under a receipt. If pycryptodome imports, part C's headline premise is
      falsified, that is recorded, and the audit continues at the
      layer-disjointness question only.
    - >-
      STAGE 1 NEXT AND IT CAN END THE LADDER: recompute rank(M_K) and rank(M_P)
      for L0 at r = 10 by two independent exact GF(2) eliminations. If either is
      not 128, HALT the ladder, restate the forced value with the measured rank
      and the corrected cost 2^{128 - rank}, and supersede H-AES-8c2d07's
      prediction rather than proceeding.
    - >-
      Stop before any treatment rung if the RANDPERM, L0_sibling and
      known-dependent-verifier digests are not all committed.
    - >-
      Halt the certificate-emitting form of stage 3 immediately if
      protocol-amendment-GOAL-AES-002-001 is not committed at dispatch time.
    - >-
      Skip the libcrypto mutation arm and record COVERAGE NOT ACHIEVED, with the
      reason, if the shared library cannot be mutated in-container. That is
      infrastructure, and it must never be recorded as a catch rate of 0.
    - >-
      Halt on reaching the declared wall clock and record halted_on_budget
      truthfully, naming the work dropped. Dropped work is SCOPE, never an answer.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any certificate emitted before the BLK-1 amendment is committed.
    - Any in-place edit of the pinned FIPS-197 implementation, or its failure to re-verify against the known-answer vectors after ladder construction.
    - Any treatment rung read before all control digests are committed.
    - Any rung added or changed after an instrument's result has been seen.
    - Any planted mutation used in the pair comparison without first passing the liveness check.
    - Any sentence stating L0's result without, in the SAME sentence, naming that L0 has no S-box and is not AES, and declaring the published-state-of-the-art comparison unadjudicable.

  infrastructure_failure_disposition: >-
    A missing dependency, an unmutatable system library, a timeout, a crash, or a
    contention-induced halt is INFRASTRUCTURE SIGNAL and is NEVER negative
    mathematical evidence about AES or about any instrument's mathematics
    (AGENTS.md rule 5, RQ-AES-002 pause condition P3). In particular: the absence
    of pycryptodome is an infrastructure finding to be filed as such, not a
    finding about verification; and an inability to mutate libcrypto is coverage
    not achieved, not evidence of layer disjointness. Every such outcome records
    the exact condition, the coverage actually achieved, and the cells not
    reached, which are then named OPEN AND UNATTEMPTED.

  success_criterion: >-
    This draft has no current success outcome because it is not authorized for
    execution. IF a later approved, frozen and authorized successor is executed,
    its only positive disposition is a COMPLETE READOUT comprising: the stage-0
    environment receipt; rank(M_K) and rank(M_P) at r = 10 from two independent
    eliminations; the affinity results for L0 (must pass 1000/1000), L0_sibling
    (must fail 0/1000) and RANDPERM (must fail 0/1000); the L0 end-to-end recovery
    at 100/100 with independent re-verification; the L2 dependency cardinalities
    at exactly 1 and exactly 11; the four-layer mutation matrix with the
    layer-disjoint positive control at 32/32 and the known-dependent null at 0/32;
    and, for every screening instrument run, a PUBLISHED SENSITIVITY PROFILE
    across the whole ladder that any later C3 barrier statement must cite. A
    readout without those per-instrument profiles HAS NOT FINISHED, because the
    profiles are the deliverable and the objects are only the means -- and because
    GOAL-AES-002 non_completion_criteria (vi) rules that infrastructure alone is
    not a completion.

  falsification_criterion: >-
    H-AES-8c2d07 is falsified in its several parts as follows, and each
    falsification is a usable result. Part A: rank(M_K) < 128 in-harness at
    r = 10, or the L0 affinity check failing on any triple, or the L0_sibling null
    PASSING the affinity test. Part B: every screening instrument run fires at L0,
    falsifying prediction P10 -- a clean negative meaning the campaign's
    instruments carry more demonstrated sensitivity than this record expected.
    Part C: pycryptodome importing in the harness, or the declared verifier pair
    measuring layer-disjoint, or any intermediate shared-layer catch rate strictly
    between 0 and 32, which falsifies the two-valued layer model HEUR-AES-L2 and
    forces the mechanism to be rewritten before any verdict is recorded.

  required_artifacts:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - Exact command line, git commit and dirty-tree state, dependency versions.
    - Stage-0 environment transcript with verbatim stdout and exit codes.
    - The two independent GF(2) elimination results with matrix digests, so a reviewer can recompute.
    - Control digests committed before treatment, with write timestamps.
    - Rung construction source with a comment-block inference stanza in its own text, per GOAL-AES-002's artifact-provenance gate.
    - Affinity, recovery and mutation raw records in a canonical machine-readable form, with seeds.
    - The mutation matrix with the liveness-check outcome for every planted mutation, including discards and their reasons.
    - Per-instrument sensitivity profile across the ladder, with the L1 monotonicity verdict.
    - Post-construction re-verification of the pinned FIPS-197 known-answer vectors.
    - The declared final verifier set with its independent_layer_count and the verbatim declared-out-of-threat-model residual clause, to be copied into any certificate relying on the instrument.
    - A covering machine-readable manifest carrying artifact_provenance for every declared artifact, with the closed case-insensitive kind vocabulary (SOURCE_CODE, MACHINE_READABLE_MANIFEST, PROSE_REPORT, LEDGER_AND_COORDINATION_RECORD); a self-referential digest is impossible and is recorded as SELF.
    - The C2 stamp record: start_utc, start_epoch, declared_wall_clock_seconds, computed binding_stop_utc, section-boundary stamps, committed as a declared artifact.

  approval_requirements:
    - >-
      Independent review confirms that L0's forced value is a derivation and not
      an assumption, that the L0_sibling null can actually fail, that the ladder
      is fixed before any instrument is run, and that the mutation liveness check
      forecloses a manufactured catch rate of 0.
    - >-
      Independent review confirms that the BLK-1 gate is respected: no
      certificate-emitting card may issue before
      protocol-amendment-GOAL-AES-002-001 is committed.
    - >-
      Coordinator separately approves and freezes; only the Coordinator approves
      (AGENTS.md rule 1).
    - >-
      A red-team pass on HEUR-AES-L1 (sensitivity monotonicity), which the
      hypothesis itself names as its weakest link, and on the claim that L0 is a
      meaningful positive control rather than an object so degenerate that firing
      on it demonstrates nothing.
  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved, and this contract does not authorize any run.
