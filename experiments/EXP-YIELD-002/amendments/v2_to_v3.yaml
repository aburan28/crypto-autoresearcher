      why_the_dispatching_session_could_not_corroborate_them_either: >-
        RECORDED SO THAT THE DISAGREEMENT IS NOT LOST. The TASK-20260729-026
        receipt records that a quick recomputation there assumed the repaired and
        committed arms share a standard error and produced materially LARGER
        figures. VM-1 ABOVE SHOWS THAT THE SHARED-STANDARD-ERROR ASSUMPTION IS NOT
