    - id: C-20
      objection: 'the power_curve_ruling of RT-20260729-025'
      severity: nonfatal
      title: The power-limit sentence binds every record, not only a P-CORE pass, and the realised phi-equivalent is reported
      target: 'v1_to_v2 preregistered_power_curve.reading_pre_registered'
      before: >-
        THEREFORE A PASS OF P-CORE IS NOT EVIDENCE THAT THE REPAIRED NULL IS EXACT:
        it is evidence that the null does not fall short by a LARGE fraction of T,
        and a shortfall of 5 percent of T or less would be very unlikely to be
        detected by anything in this contract. Any record reading a P-CORE pass must
        carry this sentence.
      after:
        - >-
          THE SENTENCE IS UNCHANGED IN CONTENT AND ITS OBLIGATION IS WIDENED. `Any
          record reading a P-CORE pass must carry this sentence` is replaced by
          `EVERY RECORD PRODUCED FROM THIS CONTRACT MUST CARRY THIS SENTENCE,
          WHATEVER BRANCH IT REPORTS - every EXP-YIELD-002 run record, the
          EXP-YIELD-002 results summary, EV-ECDLP-009 and DEC-20260729-002 - in the
          PD-7 pattern.`
        - >-
          THE REASON IS RECORDED RATHER THAN LEFT IMPLICIT. A MISS-MARGINAL record
          is EQUALLY BLIND to a shortfall of 5 percent of T and is MORE liable to
          the softer misreading, because `nearly passed` is a comfortable sentence
          and `passed` at least invites scrutiny. A limit that binds only the
          flattering branch is not a limit.
        - >-
          A FURTHER REPORTING OBLIGATION IS ADDED, FIRING NOTHING. Every run record
          reports the REALISED PHI-EQUIVALENT - the value of phi for which the
          observed aggregate shortfall would be typical - beside the pre-registered
          curve, so that a reader sees WHICH PART OF THE CURVE THE RUN ACTUALLY
          EXCLUDED rather than only that a threshold was or was not crossed. This
          feeds NO criterion, NO threshold, NO invalidation rule and NO verdict, and
          it is reported whatever the branch.
      the_phi_equivalent_is_a_report_and_not_a_test: >-
        STATED SO THAT IT IS NOT LATER READ AS ONE. The realised phi-equivalent has
        no pre-registered threshold, no acceptance region and no disposition. It may
        not be compared against any value to produce a verdict, and no record may
        say that a run `excluded phi above` some figure as though that were a
        criterion. It is a coordinate on a declared curve, published so that the
        declared blindness of the design is visible in the record that reports the
        outcome.
      basis: >-
        RT-20260729-025's power_curve_ruling, which found the curve itself correct
        in all eighteen figures, found the binding sentence `almost, and one clause
        short`, and recommended the further reporting obligation as cheap. Both
        recommendations are adopted.
      consequence: >-
        No threshold moves and no criterion changes. A self-critical obligation
        that bound one branch now binds all of them, including the two ledger
        records BATCH-012 has yet to write.
