    what_this_session_did_NOT_derive_and_does_not_relay:
      statement: >-
        RECORDED AS A REFUSAL RATHER THAN AS AN OMISSION. RT-20260729-025 reports
        an expected conditional CR-3 exceedance count of 0.22989, a probability of
        at least one CR-3 chance alarm of 0.2108, a conditional union-bound total
