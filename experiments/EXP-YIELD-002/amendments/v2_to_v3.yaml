  ordered_disposition_by_objection:
    binding_note: >-
      ONE ORDERED DISPOSITION PER OBJECTION RAISED BY RT-20260729-025, SO THAT NO
      READER HAS TO INFER WHICH READING WON. Where the reviewer supplied
      verbatim-adoptable text it is adopted verbatim and said to be adopted
      verbatim rather than paraphrased. Where this session departs from the
      reviewer's recommendation it says so and gives the reason, rather than
      quietly adopting a weaker form.
    NB_1:
      severity: BLOCKING
      disposition: DISCHARGED BY C-14, ADOPTING THE REVIEWER'S TEXT VERBATIM.
      reading_adopted: >-
        THE COUNTERFACTUAL IS A STATEMENT ABOUT BOTH ARMS' TRUE MEANS. Under it,
        E[mu_rep] = E[mu_001] = P_pred - T at every declared tuple, and the
        committed draw mu_001 is REPLACED BY THAT MEAN rather than used as a
        realised value.
      reading_rejected: >-
        THE LITERAL SINGLE-ARM READING OF v2's C-2 - mu_rep = P_pred - T with
        mu_001 left at its committed value. It is rejected because it is not the
        reading under which v2's own four published sets are correct, and because
        under it CR-3's counterfactual firing set is 19 tuples rather than 18,
        adding T-18-2-B58, which RT-20260729-025 re-derived from IN-1 at 3.4579
        against a threshold of 2.1923. THE REVIEWER IS RIGHT THAT v2's STATED
        JUSTIFICATION CANNOT APPLY TO CR-3, because CR-3's statistic contains
        mu_001 by construction, so the argument that T is DETERMINED while mu_001
        is SAMPLED has nothing to bite on there. The four published sets are NOT
        disputed and are NOT changed by this amendment; what changes is that the
        contract now says which reading produces them.
      what_is_not_changed_by_this_disposition: >-
        NO SET MOVES. CR-1 stays at the same 20 named tuples, CR-2 at the same 5,
        CR-3 at the same 18 and the cannot-fire complement at the same 28, exactly
        as v2 published them and exactly as RT-20260729-025 re-derived them from
        IN-1 on set identity with all four symmetric differences empty. A repair
        that moved a set here would be a criterion change, not a text repair, and
        would be out of scope.
      carried_by: C-14
    NB_2:
      severity: BLOCKING
      disposition: >-
        DISCHARGED BY C-15, C-16 AND C-17 - THE DECLARED REFERENCE DISTRIBUTION IS
        CORRECTED, THE EXPECTED CHANCE OFFENDERS ARE PRE-REGISTERED BY NAME, AND
        THE LARGEST NON-CENTRALITY IN THE CONTRACT IS NAMED WHERE C-11 OMITTED IT.
        THE CR-3 STATISTIC ITSELF IS NOT CHANGED AND NO THRESHOLD IS MOVED.
      what_the_defect_is_stated_plainly: >-
        THE CONTRACT DECLARED A REFERENCE DISTRIBUTION FOR CR-3 THAT CR-3'S
        STATISTIC DOES NOT HAVE. Section 8 of the criterion feasibility table
        records `CR-3 same per-tuple reference as CR-1 = 0.18726 expected
        exceedances`, justified by `under a correct diagnostic the statistics are
        centred to within 0.16466 standard errors`. mu_001 IS A COMMITTED CONSTANT
        AND IS NOT REDRAWN AT RUN TIME. Under a PERFECTLY CORRECT repaired null the
        only randomness in CR-3's numerator is the repaired arm's own mean, so
        CR-3's statistic is NON-CENTRAL, by about 2.07 standard errors on its own
        scale at T-18-2-B264, against a stated centring of 0.16466. That is a
        factor of about twelve on the centring claim and, as C-15 derives below, a
        factor of between about 17 and about 28 on the per-tuple chance-alarm rate
        at that tuple, quoted as a range because the degrees of freedom there were
        not verified by this session.
      why_the_fix_is_disclosure_and_not_a_criterion_change: >-
        THE COORDINATOR RULES THAT CR-3'S STATISTIC AND THRESHOLD ARE NOT TOUCHED,
        AND RECORDS THE REASON RATHER THAN ASSERTING THE RULING. FIRST, the obvious
        alternative - re-centring CR-3 by the per-tuple offset - would calibrate a
        criterion on the very committed draw whose correctness is one of the two
        live explanations under test, and would make CR-3 structurally unable to
        detect the case where mu_001 is itself at fault. That is not a repair; it
        is the removal of the criterion's only independent content. SECOND, it
        would be a criterion change made after two adverse reviews, which is
        exactly what an amendment cycle must not be used for, and it lies outside
        the closed scope of this cycle. THIRD, the harm NB-2 identifies is a
        MIS-ATTRIBUTED SEVERITY rather than a miss reported as a pass - CR-3's
        disposition already records the prediction as NOT MET on any exceedance -
        and severity is precisely what a pre-registered offender list and a correct
        conditional budget address. FOURTH, RT-20260729-025 itself asked for
        disclosure and expressly forbade loosening any threshold. THE TRADE IS
        STATED OPENLY - if TASK-20260729-029 judges disclosure insufficient and
        returns REVISE, the hard cap ends BATCH-012 as a batch failure, and this
        session accepts that consequence rather than pre-emptively weakening a
        criterion to avoid it.
      the_C_4_edge_is_not_reopened: >-
        RECORDED EXPLICITLY BECAUSE THE REVIEWER WAS EXPLICIT. NB-2 IS NOT AN
        ARGUMENT AGAINST C-4. The 4.000 severity edge survives the conditional
        analysis and MUST NOT BE MOVED BACK. This amendment does not touch it, does
        not restate it, and does not re-derive it; C-4 stands as
        RT-20260729-025 ruled it, fully REPAIRED.
      carried_by: 'C-15, C-16, C-17'
    NN_1:
      severity: NONFATAL
      disposition: DISCHARGED BY C-18, ADOPTING THE REVIEWER'S SENTENCE VERBATIM.
      what_it_closes: >-
        v2's corrected_pre_registered_sets.binding_note is the one place v2 widened
        a binding statement beyond what OBJ-2 required, elevating four
        counterfactual FEASIBILITY sets into `the pre-registered sets against which
        any realised firing set is compared` with NO disposition attached to any
        outcome of that comparison. The reviewer is right that the comparison can
        never be passed - under P-CORE the predicted realised firing set is EMPTY
        for CR-1, CR-2 and CR-3, and even under the counterfactual the realised set
        is random - and right that it touches no branch. IT IS THEREFORE A LIVE
        POST-HOC READING ROUTE AND NOTHING ELSE, and it is closed by narrowing,
        which is the direction a widening should be repaired in.
      carried_by: C-18
    NN_2:
      severity: NONFATAL
      disposition: DISCHARGED BY C-19a, ADOPTING THE REVIEWER'S SENTENCE VERBATIM.
      carried_by: C-19
    NN_3:
      severity: NONFATAL
      disposition: DISCHARGED BY C-19b AND C-19c, ADOPTING THE REVIEWER'S RULING THAT THE STRICTER FORM GOVERNS.
      carried_by: C-19
    NN_4:
      severity: NONFATAL
      disposition: DISCHARGED BY C-21, ADOPTING THE REVIEWER'S CLAUSE VERBATIM.
      why_it_is_carried_although_the_dispatching_note_did_not_name_it: >-
        RECORDED SO THAT IT IS NOT READ AS SCOPE CREEP. NN-4 is one of the four
        nonfatal objections RT-20260729-025 raised. Dropping it silently would
        reproduce the exact failure mode the reviewer caught at NB-2 - an item
        parked without re-examination - and it costs one clause. It is a
        DISCLOSURE that the RC-F position is slightly worse than v2 stated. It
        widens nothing, moves nothing and makes no claim easier.
      carried_by: C-21
    the_power_curve_binding_sentence:
      severity: 'RECOMMENDATION, recorded by RT-20260729-025 under power_curve_ruling rather than as a numbered objection.'
      disposition: DISCHARGED BY C-20.
      what_was_wrong: >-
        v2's binding sentence attaches the obligation only to a record `reading a
        P-CORE pass`. A MISS-MARGINAL record is equally blind to a shortfall of 5
        percent of T and is equally liable to be read as `nearly passed`, which is
        the softer of the two misreadings and therefore the likelier one.
      carried_by: C-20

  the_variance_model_for_CR_3:
    binding_note: >-
      THIS BLOCK IS THE LOAD-BEARING CONTENT OF THIS AMENDMENT. It states, before
      any draw exists, what CR-3's statistic actually is under the hypothesis the
      contract calls a perfectly correct repaired null, together with every
      approximation the statement rests on and the DIRECTION of each
      approximation's error. It is stated as a model with named approximations
      rather than as a fact, because that is what it is. IT FEEDS NO CRITERION AND
      NO THRESHOLD - CR-3's statistic, its 3.000 threshold and its disposition are
      untouched. IT GOVERNS ONLY THE DECLARED CHANCE-ALARM BUDGET AND THE
      REPORTING OBLIGATIONS OF C-16.
    VM_1_the_conditional_reference_model:
      step_1_what_is_constant_before_this_run: >-
        mu_001,i IS A COMMITTED CONSTANT recorded in IN-1 at
        2fb2bb7a111d999859612e52990eea7dc6bbac1a. It is not redrawn at run time.
        s_001,i is likewise committed, sem_001,i = s_001,i/sqrt(n_rep,i) is
        DETERMINED from committed constants per C-6, and T_i, P_pred,i, N_i, s_i
        and C_red,i are DETERMINED. THE COMMITTED DRAW IS THE ONLY STATE OF
        KNOWLEDGE THAT EXISTS BEFORE THIS RUN, so it is the state of knowledge the
        pre-registered budget must be computed in.
      step_2_what_is_random: >-
        Under the hypothesis of a perfectly correct repaired null the ONLY random
        quantities entering CR-3 are the repaired arm's realised mean mu_rep,i and
        its realised sample standard deviation s_rep,i, from which
        sem_rep,i = s_rep,i/sqrt(n_rep,i).
      step_3_the_numerator_mean_derived: >-
        Write m_rep,i for the exact mean of the specified P-REPAIRED process,
        bias_i = m_rep,i - P_pred,i for the exact process bias the contract already
        computes in section 5 of the criterion feasibility table, and
        r_i = mu_001,i - (P_pred,i - T_i) for the committed residual after the
        omitted term is added back. Then, EXACTLY,
        E[(mu_rep,i - mu_001,i) - T_i] = m_rep,i - mu_001,i - T_i
        = (P_pred,i + bias_i) - (P_pred,i - T_i + r_i) - T_i = bias_i - r_i.
        DEFINE delta_i = (bias_i - r_i)/sem_001,i. THE NUMERATOR OF CR-3 IS
        THEREFORE NOT CENTRED AT ZERO UNDER A CORRECT DIAGNOSTIC; it is centred at
        delta_i standard errors of the committed arm.
      step_4_the_quantity_is_not_new_to_this_contract: >-
        DERIVED HERE AND WORTH RECORDING AS THE SHARPEST FORM OF THE FINDING.
        Because the as-recorded process mean is m_rep,i - T_i up to the correction
        v2 records as below 1e-3 SEM at every tuple, bias_i - r_i is exactly
        m_asrec,i - mu_001,i, so delta_i/sqrt(2) IS THE VERY QUANTITY C-9 ALREADY
        PRE-REGISTERS FOR REPORTING - the analytic as-recorded mean minus the
        committed draw, over sqrt(2) sem_001. THE CONTRACT ALREADY HAD THIS NUMBER
        IN HAND, at 2.074 at T-18-2-B264 and 1.867 at T-14-2-B118, and used it only
        to describe an IV-1 blind spot. RT-20260729-025 is right that v2 quotes the
        same 2.074 in two places without connecting them.
      step_5_approximation_A1: >-
        A1 - THE REPAIRED ARM'S TRUE STANDARD ERROR IS TAKEN EQUAL TO sem_001,i.
        DIRECTION AND MAGNITUDE OF THIS APPROXIMATION'S ERROR ARE UNKNOWN AND ARE
        NOT CLAIMED. Section 4 of the criterion feasibility table asserts that the
        pre-marking changes the spread by order 1/N, and that assertion is NOT
        PROVED ANYWHERE IN THIS CONTRACT; v2's C-13 scopes the OB-10 effect-size
        analysis to the MEAN in terms and states that no claim is made about the
        variance under either convention. SO A1 RESTS ON AN UNPROVED ASSERTION AND
        IS DECLARED AS SUCH. WHAT SAVES IT FROM MATTERING TO ANY CRITERION - CR-1
        and CR-2 denominate on the MEASURED s_rep and CR-3's denominator uses the
        MEASURED sem_rep, so NO CRITERION IN THIS CONTRACT DEPENDS ON A1. It
        affects only the declared budget below.
      step_6_approximation_A2: >-
        A2 - THE MEASURED sem_rep,i IN CR-3'S DENOMINATOR IS REPLACED BY ITS TRUE
        VALUE, MAKING THE DENOMINATOR THE CONSTANT sqrt(2) sem_001,i. THE DIRECTION
        OF THIS ERROR IS KNOWN AND IS DECLARED - replacing a random denominator by
        its central value UNDERSTATES the tail, so every exceedance probability
        computed under VM-1 is a LOWER bound on the rate this approximation
        governs. The relative standard deviation of the measured s_rep is
        1/sqrt(2(n_rep - 1)), which is about 0.071 at the 37 tuples with 100
        replicates and about 0.131 at the 11 tuples with 30 replicates, so the
        understatement is not negligible at the 30-replicate tuples.
      step_7_the_resulting_reference_law: >-
        Under A1 and A2, z_shift,i is distributed as the absolute value of a normal
        with mean delta_i and unit variance, divided by sqrt(2). The per-tuple
        exceedance probability at threshold c is therefore
        p_i(c) = Q(c sqrt(2) - delta_i) + Q(c sqrt(2) + delta_i), with Q the
        standard-normal upper tail. At c = 3.000, c sqrt(2) = 4.242641. THIS IS THE
        SAME REFERENCE LAW RT-20260729-025 USED, AND ITS DERIVATION IS RESTATED
        HERE IN FULL RATHER THAN IMPORTED, SO THAT TASK-20260729-029 CAN ATTACK THE
        MODEL AND NOT ONLY THE ARITHMETIC.
    corollary_VM_1a_the_correlation_the_table_names_is_the_wrong_one:
      derived_by_this_session: true
      statement: >-
        SECTION 8 OF THE TABLE ALREADY OBSERVES THAT `CR-3's numerator equals
        CR-1's numerator minus the committed arm's own sampling error, giving a
        correlation of exactly 1/sqrt(2)`. THAT OBSERVATION IS THE WHOLE OF NB-2,
        WRITTEN DOWN AND THEN USED ONLY FOR THE COMFORTABLE CONSEQUENCE. The
        contract drew from it that the union bound is loose, and did not draw from
        it that the subtracted quantity is a CONSTANT before this run and therefore
        a SHIFT rather than a variance contribution. CONDITIONAL ON THE COMMITTED
        DRAW, CR-1's AND CR-3's NUMERATORS DIFFER BY THE CONSTANT r_i, so at a
        tuple they are perfectly dependent in the numerator and their statistics
        are deterministic functions of the same pair (mu_rep, s_rep). THE 1/sqrt(2)
        FIGURE IS THE MARGINAL CORRELATION, OBTAINED BY TREATING mu_001 AS
        REDRAWN, AND IT IS NOT THE CONDITIONAL ONE. Any arithmetic that subtracts a
        1/sqrt(2) correlation term from a CONDITIONAL union total is using the
        wrong correlation, and that includes the correction term
        RT-20260729-025 names in its own NB-2 discharging_change.
      numeric_consequence: >-
        NOT COMPUTED BY THIS SESSION AND LEFT AS OPEN ITEM OI-4. The direction is
        that stronger positive dependence makes the sum of expected exceedances a
        LOOSER upper bound on the probability of at least one alarm, which is
        favourable, while making the joint event `CR-1 and CR-3 both fire at the
        same tuple` MORE likely than independence suggests, which is unfavourable
        for the MISS-STRUCTURED routes that count failures. Across DIFFERENT tuples
        the streams are distinct by construction per RC-C, so the independence
        RT-20260729-016 endorsed is untouched by this corollary.
    corollary_VM_1b_the_student_t_justification_does_not_transfer:
      derived_by_this_session: true
      statement: >-
        SECTION 8 JUSTIFIES ITS PER-TUPLE REFERENCE BY `because s_rep is estimated
        from n_rep replicates, the reference is a two-sided Student-t tail at
        n_rep - 1 degrees of freedom`. THAT JUSTIFICATION IS CORRECT FOR CR-1 AND
        DOES NOT TRANSFER TO CR-3, EVEN MARGINALLY. CR-3's denominator
        sqrt(sem_rep^2 + sem_001^2) mixes ONE estimated term with ONE committed
        constant, so its law lies strictly between a Student-t at n_rep - 1 degrees
        of freedom and a standard normal, and is therefore LIGHTER-TAILED than the
        t the line assumes. THE ERRORS IN SECTION 8's CR-3 LINE THEREFORE RUN IN
        BOTH DIRECTIONS - conservative through the tail shape, anti-conservative
        through the non-centrality - AND NOTHING IN THIS CONTRACT ESTABLISHES THAT
        THEY CANCEL. They are declared separately rather than netted, because
        netting two errors of unknown relative size is how a wrong figure survives.
    what_this_session_derived_and_by_what_method:
      method: >-
        HAND ARITHMETIC ONLY. THIS SESSION HAS NO INTERPRETER, RAN NO PROGRAM AND
        EVALUATED NO SPECIAL FUNCTION. The two figures below were obtained by
        LINEAR INTERPOLATION between tabulated standard-normal upper-tail values -
        Q(1.30) = 0.09680, Q(1.31) = 0.09510, Q(1.32) = 0.09342, Q(1.60) = 0.05480
        and Q(1.61) = 0.05370 - and their precision is about plus or minus 0.0005.
        THE INPUT delta_i VALUES WERE NOT DERIVED HERE; their provenance is named
        per figure. WHAT IS THIS SESSION'S OWN WORK IS THE MAP FROM delta_i TO A
        PROBABILITY, AND THE COMPARISON AGAINST THE DECLARED PER-TUPLE REFERENCE.
      T_18_2_B264: >-
        delta = 2.9340 as re-derived by RT-20260729-025 from IN-1, and delta =
        2.9276 as independently corroborated by the dispatching session recorded in
        the TASK-20260729-026 receipt. At c = 3.000 these give
        Q(4.242641 - 2.9340) = Q(1.308641) approximately 0.0953 and
        Q(4.242641 - 2.9276) = Q(1.315041) approximately 0.0943. The opposite tail
        Q(4.242641 + 2.93) is below 4e-13 and is negligible. THE TWO INDEPENDENT
        delta DERIVATIONS THEREFORE BRACKET THE PER-TUPLE RATE AT ROUGHLY 0.094 TO
        0.096, AND THIS SESSION ADOPTS THE RANGE RATHER THAN EITHER ENDPOINT.
      T_14_2_B118: >-
        delta = 2.6404, obtained as sqrt(2) times the C-9 figure 1.867 that
        RT-20260729-016, v2 and RT-20260729-025 all report and that
        RT-20260729-025 re-derived from IN-1. At c = 3.000 this gives
        Q(4.242641 - 2.6404) = Q(1.602241) approximately 0.0546.
      the_comparison_that_makes_the_declared_line_wrong: >-
        THIS IS THE PART THAT NEEDS NO 48-TUPLE SUM AND IS THEREFORE ESTABLISHED
        RATHER THAN RELAYED. Section 8's declared per-tuple reference for CR-3 is
        the CR-1 reference, 0.00342 at the 37 tuples with 99 degrees of freedom and
        0.00552 at the 11 with 29. WHICH OF THE TWO APPLIES AT T-18-2-B264 DEPENDS
        ON ITS C_red UNDER THE C-14 SCHEDULE AND WAS NOT VERIFIED BY THIS SESSION,
        SO THE FACTOR IS QUOTED AS A RANGE RATHER THAN PICKED. ITS CONDITIONAL RATE
        OF ABOUT 0.095 IS THEREFORE BETWEEN ABOUT 17 AND ABOUT 28 TIMES THE
        DECLARED PER-TUPLE REFERENCE, AND IT IS ABOUT 51 PERCENT OF THE ENTIRE
        DECLARED 48-TUPLE CR-3 BUDGET OF 0.18726 AT ONE TUPLE - the second
        comparison depends on no degrees-of-freedom assignment. Adding T-14-2-B118
        gives about 0.149 from TWO tuples, about 80 percent of the whole declared
        figure. THE DECLARED LINE IS NOT MERELY IMPRECISE - ITS DISTRIBUTION ACROSS
        TUPLES IS NOTHING LIKE THE NEAR-UNIFORM ONE IT ASSERTS, AND ITS PER-TUPLE
        REFERENCE IS WRONG BY MORE THAN AN ORDER OF MAGNITUDE AT THE TUPLE MOST
