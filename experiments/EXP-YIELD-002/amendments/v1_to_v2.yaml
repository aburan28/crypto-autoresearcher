  ordered_disposition_by_objection:
    binding_note: >-
      ONE ORDERED DISPOSITION PER BLOCKING OBJECTION, SO THAT NO READER HAS TO
      INFER WHICH READING WON. Each entry names the objection, the reading
      adopted, the reading rejected, and the change identifier that carries it.
      Where the reviewer offered verbatim-adoptable text, it is adopted verbatim
      and said to be adopted verbatim rather than paraphrased.
    OBJ_1:
      severity: BLOCKING
      disposition: DISCHARGED BY C-1, ADOPTING THE REVIEWER'S TEXT VERBATIM.
      reading_adopted: >-
        MISS-MARGINAL IS DEFINED RESIDUALLY, as P-MISS AND NOT MISS-STRUCTURED.
        The connective `and or` is DELETED ENTIRELY rather than resolved in
        favour of one of its two readings.
      reading_rejected: >-
        BOTH enumerated readings are rejected, and rejecting both is the point.
        The OR reading breaks DISJOINTNESS - one CR-1 failure at |z_sem| = 4.0
        with three CR-3 failures below the band edge, CR-2 and CR-4 clean, fires
        BOTH MISS-STRUCTURED and MISS-MARGINAL. The AND reading breaks
        EXHAUSTIVENESS - one CR-1 failure at |z_sem| = 4.0 with zero CR-3
        failures, CR-2 and CR-4 clean, fires NEITHER. The second case is not
        exotic: it is THE SINGLE MOST LIKELY MISS OUTCOME, because the expected
        CR-1 chance exceedance count is 0.187 and CR-3's counterfactual set is a
        strict subset of CR-1's. Choosing one reading would have left the other
        counterexample standing; the residual definition removes both.
      carried_by: C-1
    OBJ_2:
      severity: BLOCKING
      disposition: DISCHARGED BY C-2, WHICH ADOPTS ONE COUNTERFACTUAL AND RESTATES EVERY COUNT AND EVERY NAMED SET UNDER IT.
      counterfactual_adopted: >-
        THE DETERMINED COUNTERFACTUAL OF TABLE SECTION 4, mu_rep = P_pred - T at
        every declared tuple, with T = |S_(m-2)| exp(-C_red/N). From it the
        counterfactual statistics are DETERMINED as T/sem_001, T/s_001 and
        T/(sqrt(2) sem_001), and nothing else.
      counterfactual_rejected: >-
        THE COMMITTED-RESIDUAL COUNTERFACTUAL of table sections 6 and 7, in which
        the counterfactual statistics are read off the committed columns
        |z_sem_001| and |z_sd_001|.
      why_this_one_and_not_the_other: >-
        FOUR REASONS, ORDERED, THE FIRST TWO DECISIVE.
        FIRST, IT IS THE ONLY ONE THE CONTRACT ACTUALLY DEFINES. Section 4 states
        the counterfactual numerically and unambiguously - the pre-marking does
        nothing and the repaired null still falls short by the FULL T - and every
        statistic follows from that sentence by arithmetic. The committed-residual
        version is not a second definition; it is an IDENTIFICATION asserted in
        the next sentence, that the counterfactual statistics are `exactly, the
        committed columns`, and that identification requires T equal to
        |mu_001 - P_pred|, WHICH IS FALSE AT EVERY TUPLE.
        SECOND, T IS DETERMINED AND mu_001 IS SAMPLED, and RC-8's own labelling
        rule separates them. T is exact double-precision arithmetic on quoted
        constants. mu_001 is one committed Monte Carlo draw carrying its own
        error, and the largest gap between the two is 2.9276 SEM at T-18-2-B264.
        A firability claim built on mu_001 is a property of ONE DRAW, not of the
        design; a firability claim built on T is a property of the design and is
        checkable before any draw exists. Pre-registered power must be the second
        kind.
        THIRD, IT IS THE COUNTERFACTUAL THE EXPERIMENT ACTUALLY TESTS. The whole
        content of EXP-YIELD-002 is whether restoring the pre-marking closes the
        gap; the alternative hypothesis under test is precisely `the pre-marking
        does nothing, so the repaired null falls short by T`. Evaluating power
        against the committed residual asks a different question - whether the
        repaired null reproduces one particular committed draw - which no
        criterion in this contract poses.
        FOURTH, IT IS WHAT PD-3 ADOPTS. The reviewer's pre-dispatch condition
        names this resolution in terms, and adopting the reviewer's own stated
        repair is cheaper and safer than re-arguing it.
      the_sharpest_consequence_recorded_as_a_pre_data_observation: >-
        AT ALL 29 m = 2 TUPLES THE RESTORED TERM T IS AT MOST 0.998 BINS, because
        |S_0| = 1 there and T = exp(-lambda) is at most 1 by construction.
        Consequently at T-18-2-B264, T-14-2-B118 and T-18-2-B140 the committed
        BATCH-011 residual exceeds 3T and CANNOT BE EXPLAINED BY THE MISSING
        PRE-MARKING UNDER ANY OUTCOME OF THIS EXPERIMENT. At T-18-2-B264
        specifically, T is 0.8753 bins against a committed residual of 27.997
        bins - 32 times too small. THIS OBSERVATION FEEDS NO CRITERION, NO
        THRESHOLD, NO INVALIDATION RULE AND NO VERDICT (PD-8). It is recorded
        before dispatch so that no later reader mistakes those tuples for
        evidence in either direction, and so that section 6's counting of
        T-18-2-B264 among tuples where CR-1 `can fire under the full
        counterfactual` is corrected on the record rather than quietly dropped.
      carried_by: C-2
    OBJ_3:
      severity: BLOCKING
      disposition: DISCHARGED BY C-3, WHICH ADOPTS THE REVIEWER'S THREE SENTENCES VERBATIM AND ADDS TWO DECLARED EXTENSIONS.
      reading_adopted: >-
        DETERMINISM IS A PROPERTY OF THE NAMED CALL AND ITS POSITION IN THE
        STREAM, NOT OF THE DISTRIBUTION. The contract therefore names the exact
        sampling call, the exact stream-consumption order, a case-keyed seed
        derivation for the KNOWNANSWER arm that makes all eight cases distinct,
        and a numpy version-recording rule.
      the_false_claim_explicitly_retracted: >-
        RETRACTED IN TERMS, BECAUSE A CONTRACT THAT OVERSTATES ITS OWN
        REPRODUCIBILITY IS WORSE THAN ONE THAT DOES NOT CLAIM IT. The v1 sentence
        `FULLY SPECIFIED SO THAT NOTHING IS LEFT TO THE EXECUTOR'S JUDGEMENT AND
        SO THAT EVERY NUMBER IS REPRODUCIBLE FROM THIS CONTRACT` WAS FALSE AS
        FROZEN, in two independent ways: no seed was derivable for the
        KNOWNANSWER arm at all, and the without-replacement pre-mark named a
        DISTRIBUTION rather than an ALGORITHM. Statistical reproducibility
        survived as frozen; BIT-EXACT THIRD-PARTY REPRODUCTION DID NOT. That
        sentence is superseded by C-3's replacement, which states what is now
        true and states its remaining boundary rather than claiming more.
      carried_by: C-3
    OBJ_4:
      severity: BLOCKING
      disposition: DISCHARGED BY C-4, CUTTING THE BAND AT 4.000.
      reading_adopted: >-
        THE ADMISSIBLE-BAND EDGE IS DERIVED FROM THE DECLARED CHANCE-ALARM BUDGET
        RATHER THAN ASSERTED BESIDE IT. The constant 10.000 is replaced by 4.000
        at every place it bounds MISS-MARGINAL or appears as a MISS-STRUCTURED
        disjunct. Expected CR-1 chance exceedance counts are 0.18686 at threshold
        3.0 and 8.92e-03 at threshold 4.0, against 3.71e-04 at 5.0, 1.87e-05 at
        6.0, 8.82e-08 at 8.0 and 7.26e-10 at 10.0. A single CR-1 failure at
        |z_sem| = 8 is SEVEN ORDERS OF MAGNITUDE beyond the rate the 0.377 budget
        was computed to excuse, and four orders below the CR-4 alarm rate the
        contract itself treats as STRUCTURAL, yet the frozen text routed it to
        `inconclusive` with EV-ECDLP-008 observation O-4 left standing.
      what_the_reviewer_found_honest_and_what_is_preserved: >-
        PRESERVED AND NOT RE-LITIGATED. The reviewer recorded EXPLICITLY that
        MISS-MARGINAL IS NOT AN ESCAPE HATCH ON THE PASS-VERSUS-MISS AXIS - it
        says the prediction is NOT MET, records a MISS, forbids `consistent with
        the prediction`, and leaves O-4 neither confirmed nor superseded - and
        called that honest and correct. That half of the branch is unchanged by
        this amendment. The defect was on the SEVERITY axis alone, and only the
        severity axis is repaired.
      carried_by: C-4

  changes:
    - id: C-1
      objection: OBJ-1
      severity: blocking
      title: MISS-MARGINAL is defined residually, so the three branches are disjoint and exhaustive by construction
      target: 'falsification_criterion, the MISS-MARGINAL sentence and the closing no-other-branch sentence'
      before: >-
        MISS-MARGINAL. Exactly one tuple fails CR-1 with 3.000 at most |z_sem|
        less than 10.000, and or exactly one tuple fails CR-3 with 3.000 at most
        |z_shift| less than 10.000, with CR-2 not firing at any tuple and CR-4
        not firing.
        NO OTHER BRANCH EXISTS. Any realised outcome falls in exactly one of
        P-CORE, MISS-STRUCTURED and MISS-MARGINAL, because the three are defined
        by disjoint conditions on the same four criteria and their union is
        total.
      after: >-
        MISS-MARGINAL IS DEFINED AS P-MISS AND NOT MISS-STRUCTURED. Its
        disposition is unchanged in every word.
        NO OTHER BRANCH EXISTS, AND NOW BY CONSTRUCTION RATHER THAN BY
        ASSERTION. P-CORE is the negation of P-MISS; MISS-STRUCTURED is a
        disjunction of explicit conditions; MISS-MARGINAL is the residue of
        P-MISS after MISS-STRUCTURED. The three are therefore pairwise disjoint
        and their union is total, for every realised outcome, without any further
        argument.
      derived_reading_aid_binding_nothing: >-
        NON-NORMATIVE AND OFFERED ONLY SO A READER NEED NOT UNFOLD THE
        DEFINITION. THE RESIDUAL DEFINITION ABOVE IS THE BINDING ONE. Given C-4's
        4.000 edge, MISS-MARGINAL unfolds to exactly this: at least one criterion
        fails, AND CR-1 fails at no more than one tuple and if at one then with
        3.000 at most |z_sem| less than 4.000, AND CR-3 fails at no more than one
        tuple and if at one then with 3.000 at most |z_shift| less than 4.000,
        AND CR-2 does not fire at any tuple, AND CR-4 does not fire. If this
        unfolding and the residual definition are ever found to disagree, THE
        RESIDUAL DEFINITION GOVERNS and the disagreement is a defect to be
        reported, not resolved by preference.
      basis: >-
        ADOPTED VERBATIM FROM THE REVIEWER'S discharging_change FOR OBJ-1 AND
        FROM PD-2. The residual form removes the connective entirely, changes no
        threshold, changes no disposition, and makes the branch structure a
        theorem rather than a claim. It also removes the live route by which the
        branch - and therefore whether EV-ECDLP-008 observation O-4 is SUPERSEDED
        or left UNDISCHARGED - could be chosen after the numbers are visible,
        which ST-5 forbids and cannot prevent when the text itself is ambiguous.
      consequence: >-
        NO THRESHOLD MOVES AND NO DISPOSITION CHANGES. What changes is coverage
        and uniqueness: the most likely miss outcome - one CR-1 exceedance and no
        CR-3 exceedance - now lands in exactly one branch instead of in none.
    - id: C-2
      objection: OBJ-2
      severity: blocking
      title: One counterfactual is adopted, the false identification is deleted, and every named PRED-ID set is restated under it
      target: 'criteria_feasibility_summary.headline_findings_of_the_table, and criterion feasibility table sections 4, 6 and 7'
      before: >-
        Table section 4, after defining mu_rep = P_pred - T, asserts that the
        counterfactual statistics are `exactly, the committed columns`
        |z_sem_001| and |z_sd_001|. Sections 6 and 7 then evaluate CR-1 and CR-2
        from the committed residual while evaluating CR-3 from T, and the
        contract's headline findings report CR-1 firing at 21 of 48, CR-2 at 4 of
        48, CR-3 at 18 of 48, and 27 tuples at which neither CR-1 nor CR-2 can
        fire.
      after: >-
        THE IDENTIFICATION SENTENCE IS DELETED. The counterfactual is
        mu_rep = P_pred - T at every declared tuple, and NOTHING ELSE, from which
        the counterfactual statistics are DETERMINED as T/sem_001 for CR-1,
        T/s_001 for CR-2 and T/(sqrt(2) sem_001) for CR-3, with CR-4 unchanged at
        n_neg = 48 with certainty. Under that single counterfactual the headline
        findings read: CR-1 CAN FIRE at 20 of the 48 declared tuples; CR-2 CAN
        FIRE at 5 of the 48; CR-3 CAN FIRE at 18 of the 48, the same 18 under
        either reading; CR-4 CAN FIRE, with certainty. THE POWERLESS COMPLEMENT
        IS 28 TUPLES, NOT 27, at which neither CR-1 nor CR-2 can fire even under
        the full counterfactual. All four sets are restated by NAME in
        corrected_pre_registered_sets below and are evaluated on SET IDENTITY,
        never on cardinality, exactly as PRED-ID requires.
      the_four_named_errors_recorded_individually: >-
        RECORDED BY NAME RATHER THAN AS A COUNT, BECAUSE PRED-ID FORBIDS SETTLING
        A SET COMPARISON ON CARDINALITY.
        T-18-2-B58 has T/sem_001 = 3.1004 and FIRES CR-1, but is absent from the
        section 6 CR-1 list and is present in the section 7 cannot-fire list.
        T-16-3-B48 has T/sem_001 = 2.7588 and DOES NOT fire CR-1, but is listed
        as firing.
        T-18-2-B264 has T/sem_001 = 0.0945 and DOES NOT fire CR-1, but is listed
        as firing.
        T-16-3-B22 has T/s_001 = 3.0506 and FIRES CR-2, but is absent from the
        named four.
        Section 7's own stated rule - `at those tuples the omitted term T is
        smaller than 3.000 standard errors of the mean` - applied literally
        yields 28 tuples, so the section 7 LIST contradicts the section 7
        CRITERION at three named tuples.
      basis: >-
        THE ARITHMETIC IS THE REVIEWER'S, INDEPENDENTLY REPRODUCED BY THE
        TASK-20260729-017 SESSION FROM THE COMMITTED
        experiments/EXP-YIELD-001/runs/RUN-YIELD-001-NULL-RANDOM-SUMSET/results.json
        AT COMMIT 2fb2bb7a111d999859612e52990eea7dc6bbac1a, AND IT IS NOT
        RE-DERIVED BY THIS SESSION, WHICH HAS NO INTERPRETER. That reproduction
        is recorded in the TASK-20260729-017 snapshot receipt under
        correction_to_the_TASK_20260729_015_receipt and reports the reviewer's
        counts EXACTLY - CR-1 20 of 48, CR-2 5 of 48, CR-3 18 of 48, 28
        powerless - together with the T-18-2-B264 case. SO THAT NO READER
        MISTAKES THE PROVENANCE: the corrected sets below are formed by SET
        SURGERY on the committed 21-, 4-, 18- and 27-member lists using exactly
        the four named differences above, not by a fresh enumeration of all 48
        tuples in this session. TASK-20260729-025 IS ASKED TO RE-DERIVE ALL FOUR
        SETS FROM IN-1 RATHER THAN TO ACCEPT THEM, and that request is recorded
        in left_open_for_the_re_reviewer.
      consequence: >-
        NO THRESHOLD MOVES. The design's per-tuple power is stated one tuple
        LOWER for CR-1 and one tuple HIGHER for CR-2 than the frozen text claimed,
        and the declared powerless complement is one tuple LARGER. The direction
        matters: the corrected statement is the less flattering one, and it is
        adopted for that reason as well as for correctness.
    - id: C-3
      objection: OBJ-3
      severity: blocking
      title: The KNOWNANSWER seeds are case-keyed, the sampling calls and stream order are named, and the numpy version is pinned by rule
      target: 'replication.seed_derivation_binding, and process_specification.P_REPAIRED step 1 and step 2'
      before: >-
        The per-tuple seed string is formed from the master seed, the arm label,
        k, round(beta x 1000), m, B and C_red. KA-1 through KA-7 are synthetic
        instances given only as N, s and C_red, with no k, no beta, no m and no
        B, so no seed is derivable for them and KA-1 and KA-4 share
        (N = 11, s = 3, C_red = 0). Step 1 reads `Choose s DISTINCT bins
        UNIFORMLY AT RANDOM WITHOUT REPLACEMENT from all N bins`. The numpy
        version is not pinned in advance.
      after_C_3a_the_KNOWNANSWER_seed_ADOPTED_VERBATIM: >-
        The KNOWNANSWER arm seeds each case from the string formed by joining
        with the single character pipe, in this exact order and with no
        whitespace - the decimal master seed 120401, the arm label KNOWNANSWER,
        the case label KA-1 through KA-8, the decimal N, the decimal s and the
        decimal C_red; the low 64 bits of the SHA-256 digest, interpreted as an
        unsigned little-endian integer, seed one numpy.random.default_rng per
        case.
      after_C_3b_the_pre_marking_algorithm_ADOPTED_VERBATIM: >-
        The pre-marking of step 1 is performed by exactly the call
        rng.choice(N, size=s, replace=False) on the tuple's generator, and by no
        other method.
      after_C_3c_the_numpy_version_ADOPTED_VERBATIM: >-
        The numpy major and minor version used is recorded in every manifest, and
        any change of it is a declared protocol deviation.
      after_C_3d_the_throwing_call_and_stream_order_DECLARED_EXTENSION: >-
        DECLARED AS AN EXTENSION BEYOND THE REVIEWER'S THREE SENTENCES, AND
        FLAGGED SO THAT TASK-20260729-025 CAN RULE ON IT RATHER THAN DISCOVER IT.
        Naming step 1's call alone does not determine the stream, because step 2
        can consume it in several ways from the same generator. Therefore, within
        one replicate at one tuple, and in this order: step 1 consumes exactly
        one call rng.choice(N, size=s, replace=False), OMITTED ENTIRELY when
        s = 0 and omitted entirely in the P-ASRECORDED arm, which has no step 1;
        step 2 then consumes exactly one call
        rng.integers(0, N, size=C_red // 2, dtype=numpy.int64), whose returned
        array is consumed in index order, each entry g marking bin g and bin
        (N - g) mod N. No other draw is taken from that generator inside the
        replicate, and replicates consume the one per-tuple generator
        SEQUENTIALLY without re-seeding, exactly as v1 already specified. THIS
        CHANGES NO THRESHOLD, NO CRITERION, NO TOLERANCE AND NO DISTRIBUTION: it
        fixes which of several stream-equivalent implementations is meant.
      after_C_3e_the_reproducibility_claim_RESTATED_HONESTLY: >-
        THE v1 SENTENCE IS SUPERSEDED. It reads instead: FULLY SPECIFIED SO THAT
        NO SEED AND NO SAMPLING METHOD IS LEFT TO THE EXECUTOR'S JUDGEMENT. Every
        number produced under this contract is reproducible bit-for-bit BY A
        THIRD PARTY WHO USES THE SAME RECORDED NUMPY MAJOR AND MINOR VERSION ON A
        PLATFORM WITH THE SAME IEEE-754 DOUBLE ARITHMETIC, and is reproducible
        STATISTICALLY OTHERWISE. The residual boundary is stated rather than
        claimed away: numpy does not guarantee bit-identical Generator output
        across major and minor versions, so bit-exactness is claimed only within
        the recorded version and not across versions.
      the_numpy_pin_and_what_this_session_may_not_do: >-
        THE RULE IS PINNED; THE VERSION NUMBER IS NOT NAMED, AND THAT IS
        DELIBERATE. This session has no shell and no interpreter, so it cannot
        read numpy.__version__ in the execution environment, and NAMING A VERSION
        IT HAS NOT OBSERVED WOULD BE FABRICATION. What is binding instead: the
        Executor records the exact numpy.__version__ string in EVERY manifest and
        in results.json before the first draw; ONE version is used for all three
        arms and all 48 tuples and all eight known-answer cases; the version is
        fixed at the start of the first arm and any change mid-batch is a
        declared protocol deviation that fires ST-3 STOP AND REPORT. If the
        environment cannot satisfy the single-version rule, the Executor STOPS
        AND REPORTS rather than proceeding.
      the_KA_collision_repaired_and_why_it_mattered: >-
        KA-1 and KA-4 share (N = 11, s = 3, C_red = 0), so any parameter-keyed
        derivation would have made KA-1's 1000 replicates a PREFIX of KA-4's 10^6
        pre-markings, and two ZERO-TOLERANCE checks would have ceased to be
        independent. Keying on the CASE LABEL makes all eight seed strings
        distinct by construction, including that pair, and restores the
        independence the two checks were written to have.
      basis: >-
        C-3a, C-3b and C-3c are ADOPTED VERBATIM from the reviewer's
        discharging_change for OBJ-3 and from PD-4. C-3d and the version-recording
        rule of C-3e are declared extensions, adopted because bit-exact
        third-party reproduction is the property OBJ-3 says the contract lost, and
        naming only step 1 would leave it lost.
      consequence: >-
        No criterion, threshold, tolerance, replicate count, tuple set or
        denominator reading moves. Two determinism choices that were the
        Executor's are now the contract's, which is where the BATCH-011 fault
        argues they belong.
    - id: C-4
      objection: OBJ-4
      severity: blocking
      title: The MISS-STRUCTURED severity edge is cut from 10.000 to 4.000, derived from the declared chance-alarm budget
      target: 'falsification_criterion, the two MISS-STRUCTURED disjuncts and the two MISS-MARGINAL band bounds'
      before: >-
        MISS-STRUCTURED. Any one of - CR-1 fails at 2 or more of the 48 tuples;
        or CR-1 fails at any tuple with |z_sem| at least 10.000; or CR-2 fails at
        1 or more tuples; or CR-3 fails at 2 or more tuples; or CR-3 fails at any
        tuple with |z_shift| at least 10.000; or CR-4 fires.
        MISS-MARGINAL bounded its admissible band above by the same constant
        10.000 at both places it appeared.
      after: >-
        MISS-STRUCTURED. Any one of - CR-1 fails at 2 or more of the 48 tuples;
        or CR-1 fails at any tuple with |z_sem| AT LEAST 4.000; or CR-2 fails at
        1 or more tuples; or CR-3 fails at 2 or more tuples; or CR-3 fails at any
        tuple with |z_shift| AT LEAST 4.000; or CR-4 fires.
        THE TWO MISS-MARGINAL BAND BOUNDS NO LONGER EXIST AS TEXT, because C-1
        replaced MISS-MARGINAL's enumerated condition with the residual
        definition. The constant 4.000 therefore now lives in exactly two places
        in the whole contract, both inside MISS-STRUCTURED, and MISS-MARGINAL
        admits a single exceedance in [3.000, 4.000) as a CONSEQUENCE of the
        residual definition rather than as a separate assertion.
      interaction_with_C_1_stated_explicitly: >-
        C-1 AND C-4 INTERACT AND THE INTERACTION IS DELIBERATE. Applied alone,
        C-4 would have had to change four numerals - two in MISS-STRUCTURED and
        two in MISS-MARGINAL - and would have left two places where the constant
        could drift apart. Applied after C-1, it changes two, and the band edge is
        derived from the structured branch rather than restated beside it. There
        is now NO WAY for the two to disagree.
      pre_data_basis_for_the_new_edge: >-
        RECORDED AS PD-5 REQUIRES, AS THE PRE-DATA BASIS AND NOT AS A POST-HOC
        JUSTIFICATION. Expected CR-1 chance exceedance counts over the 48 tuples,
        37 at 99 degrees of freedom and 11 at 29: 0.18686 at threshold 3.0;
        4.26e-02 at 3.5; 8.92e-03 at 4.0; 3.71e-04 at 5.0; 1.87e-05 at 6.0;
        8.82e-08 at 8.0; 7.26e-10 at 10.0. The declared 0.377 budget is justified
        at 3.000 and supports a marginal band to roughly |z| = 4, not to |z| = 10.
        The contract's own 0.18726 for the same quantity, computed with slightly
        coarser tail constants, agrees to 0.2 percent and both bound the same
        thing; 0.18686 is quoted here because PD-5 names it.
      basis: >-
        ADOPTED FROM THE REVIEWER'S discharging_change FOR OBJ-4 AND FROM PD-5.
        The defect was that a single CR-1 failure at |z_sem| = 8 sits SEVEN
        ORDERS OF MAGNITUDE beyond the rate the budget was computed to excuse, and
        FOUR ORDERS BELOW the CR-4 alarm rate the contract itself treats as
        STRUCTURAL, yet routed to `inconclusive` with O-4 left standing. That is
        not a route by which a miss is reported as a pass - it is a route by which
        a DECISIVE STRUCTURAL REFUTATION IS RECORDED AS INCONCLUSIVE, which is
        enough to matter, because the severity axis is what decides whether O-4 is
        superseded.
      consequence: >-
        THIS IS THE ONLY THRESHOLD THIS AMENDMENT MOVES, IT MOVES IN THE
        TIGHTENING DIRECTION, AND IT WAS REQUIRED BY THE OBJECTION. It creates no
        route by which a miss is reported as a pass; it moves outcomes FROM
        `inconclusive` TO the structured branch, which is the harder disposition.
        The 3.000 firing thresholds of CR-1, CR-2 and CR-3 are UNCHANGED, CR-4's
        14-to-34 window is UNCHANGED, and the chance-alarm budget of 0.377 is
        UNCHANGED.
    - id: C-5
      objection: OBJ-6
      severity: nonfatal
      title: CR-4's reference law is corrected from Binomial to Poisson-binomial and the word conservative is fixed
      target: 'independence_note_for_the_tail_checks_and_for_CR_4, and criterion feasibility table section 6 CR-4'
      before: >-
        The per-tuple negative-sign probability is stated as `between 0.472 and
        0.500`, and `CR-4's thresholds are evaluated at the conservative end
        p = 0.500 rather than at the biased value`. Table section 6 evaluates
        n_neg as Binomial(48, 0.500) with mean 24.0 and standard deviation
        3.464102, giving a two-sided figure 0.002436.
      after: >-
        The per-tuple negative-sign probability p_i = Phi(-bias_i/sem_i) lies
        between 0.47003 and 0.49859, the lower end being Phi(-0.07519) at
        T-12-2-B46. The signs are INDEPENDENT but NOT IDENTICALLY DISTRIBUTED, so
        the reference law for n_neg is POISSON-BINOMIAL with E[n_neg] = 23.504,
        not Binomial(48, 0.500). The word `conservative` is corrected: p = 0.500
        is conservative on the n_neg at least 35 tail - the counterfactual
        direction, and the contract was right about that - and is
        ANTI-CONSERVATIVE BY A FACTOR OF 1.59 ON THE n_neg AT MOST 13 TAIL, where
        the true probability under the declared bias is 0.001660 against 0.001044
        at p = 0.500, and n_neg at most 13 FIRES CR-4 and routes to
        MISS-STRUCTURED. The declared CR-4 alarm figure 0.002436 NEVERTHELESS
        BOUNDS the true two-sided value 0.002302, so the 0.377 budget stands
        unchanged.
      what_is_endorsed_and_not_reopened: >-
        THE INDEPENDENCE HALF OF THE ARGUMENT IS CORRECT AND THE REVIEWER
        ENDORSED IT, AND IT IS CARRIED FORWARD UNCHANGED. sign(mu_rep,i -
        P_pred,i) depends only on stream i; P_pred,i is a fixed constant carrying
        no randomness; RC-C's de-duplication on (k, m, B) makes those three
        seed-string fields unique across the 48, so the per-tuple streams are
        DISTINCT BY CONSTRUCTION. OB-9's objection concerns the correlation of
        MEASURED CURVE QUANTITIES down a (k, m) column, and those enter here as
        CONSTANTS, so it genuinely does not transfer. The contract's stated reason
        is the right reason and is not re-argued.
      consequence: >-
        No threshold moves. CR-4's 14-to-34 window and the 0.377 budget are
        unchanged. What changes is that the reference law and the direction of
        conservatism are stated correctly before data, so that a realised n_neg
        at the low end cannot later be excused by a figure that was 1.59 times
        too small.
    - id: C-6
      objection: OBJ-7
      severity: nonfatal
      title: sem_001 is relabelled DETERMINED rather than QUOTED, because IN-1 contains no sem field
      target: 'success_criterion CR-3'
      before: >-
        CR-3 says that mu_001 and sem_001 are QUOTED from IN-1 at the tuple's
        binding committed reference.
      after: >-
        mu_001 and s_001 are QUOTED from IN-1 at the tuple's binding committed
        reference, and sem_001 = s_001/sqrt(n_rep) is DETERMINED from them, with
        n_rep the tuple's C-14 replicate count, which equals IN-1's recorded
        `replicates` at all 49 cells.
      basis: >-
        A grep of the committed IN-1 blob returns ZERO occurrences of the string
        `sem`. Under RC-8's labelling rule a DERIVED quantity may not be labelled
        QUOTED, and under ST-3 an Executor who cannot locate a QUOTED quantity in
        IN-1 unambiguously must STOP AND REPORT - so as frozen, CR-3 obliged the
        Executor either to stop or to infer silently. The inference happens to be
        unambiguous, because IN-1's `replicates` equals the C-14 count at all 49
        cells; the TEXT was what was wrong. Adopted from the reviewer's
        discharging_change for OBJ-7.
      consequence: >-
        No number changes. One spurious ST-3 stop is removed and one RC-8
        labelling violation is repaired.
    - id: C-7
      objection: OBJ-5
      severity: nonfatal
      title: CR-2's per-tuple chance-alarm bound is corrected from below 1e-20
      target: 'criteria_feasibility_summary.headline_findings_of_the_table, and criterion feasibility table section 6 CR-2'
      before: >-
        CR-2's per-tuple chance-alarm probability is stated as below 1e-20.
      after: >-
        CR-2's per-tuple chance-alarm probability is BELOW 1e-15 AT EVERY TUPLE,
        and below 1e-50 at the 37 tuples with 100 replicates. At the 11 tuples
        with 30 replicates, |z_sd| at least 3.000 means |t_29| at least
        3.000 x sqrt(30) = 16.4317, and P(|t_29| > 16.4317) is approximately
        3.13e-16 - four orders of magnitude above the stated bound. At the 37
        tuples with 100 replicates the figure is approximately 1.7e-51.
      consequence: >-
        THE BUDGET IS UNAFFECTED: 11 x 3.1e-16 is approximately 3.4e-15, which is
        negligible against 0.377, and the 0.377 total is not recomputed. This was
        a disclosure error, not a budget error - but it was a number in a frozen
        contract that was not true.
    - id: C-8
      objection: OBJ-8
      severity: nonfatal
      title: The declared random-draw count is corrected upward
      target: budget.budget_feasibility_note
      before: >-
        Across the two 48-tuple arms the total is below 1.5 x 10^9 byte-clears
        and below 2 x 10^7 random draws.
      after: >-
        Across the two 48-tuple arms the total is below 1.5 x 10^9 byte-clears
        and below 2.5 x 10^7 random draws. The sum of (C_red/2) x n_rep over the
        48 declared tuples, doubled for the two arms, is 2.19e7, which exceeds the
        frozen 2 x 10^7 by about 9.5 percent.
      consequence: >-
        COSMETIC IN EFFECT AND REAL IN KIND. The byte-clear figures do hold - main
        arms 8.05e8 against below 1.5e9, high-precision block 1.70e10 against
        below 1.8e10 - and the binding cost is indeed the array clears, so no
        budget field moves. wall_clock_seconds_per_run stays 600, total_cpu_hours
        stays 0.5, maximum_memory_gb stays 4 and maximum_runs stays 3.
    - id: C-9
      objection: OBJ-9
      severity: nonfatal
      title: IV-1 gains a REPORTING-ONLY clause naming its own blind spot, and its threshold is not loosened
      target: 'invalidation_rules IV-1, and criterion feasibility table section 9'
      before: >-
        IV-1a fires if |z_comp| is at least 3.000 at MORE THAN 2 of the 48
        tuples. Nothing in the contract records what IV-1 cannot see.
      after: >-
        IV-1a AND IV-1b ARE UNCHANGED IN TRIGGER AND IN THRESHOLD - NOTHING IS
        LOOSENED. A REPORTING-ONLY CLAUSE IS ADDED, FIRING NOTHING: results.json
        reports, per tuple, the quantity |mu_asrec - mu_001|/(sqrt(2) sem_001)
        together with its rank among the 48, and names the pre-registered fact
        that UNDER THE SCENARIO IN WHICH THE COMMITTED BATCH-011 RESIDUALS ARE
        REAL RATHER THAN SAMPLING NOISE, the maximum of that quantity is 2.074 at
        T-18-2-B264 and the next is 1.867 at T-14-2-B118, so it reaches 3.000 at
        ZERO of the 48 tuples and IV-1a DOES NOT FIRE.
      why_this_is_recorded_rather_than_repaired: >-
        THIS IS A BLIND SPOT, NOT A FALSE-ALARM HAZARD. IV-1 is the gate that
        anchors CR-3's comparison to the committed package, and it cannot see the
        single largest anomaly in that package. Loosening the threshold after the
        fact would be exactly the manoeuvre a protocol amendment must not make, so
        the limit is DECLARED AND REPORTED rather than repaired.
    - id: C-10
      objection: OBJ-10
      severity: nonfatal
      title: CR-4's power claim is narrowed to the all-or-nothing counterfactual and the partial-failure power curve is pre-registered
      target: criteria_feasibility_summary, and criterion feasibility table sections 6 and 7
      before: >-
        CR-4 draws its power from the sign at all 48 tuples including those 27,
        and it fires with certainty under the counterfactual; it is the criterion
        that carries the counterfactual power at the 27 tuples where CR-1 and CR-2
        have none.
      after: >-
        CR-4 CARRIES THE ALL-OR-NOTHING COUNTERFACTUAL POWER AT THOSE TUPLES -
        under mu_rep = P_pred - T at every tuple, n_neg = 48 and CR-4 fires with
        certainty. AGAINST A SHORTFALL OF 5 PERCENT OF T OR LESS, NO CRITERION IN
        THIS CONTRACT HAS APPRECIABLE POWER, AND THAT LIMIT IS DECLARED RATHER
        THAN REPAIRED. The count of powerless tuples reads 28 rather than 27, per
        C-2. The full power curve is pre-registered in
        preregistered_power_curve below.
      consequence: >-
        No threshold moves and no criterion is added or removed. What changes is
        that a reader can no longer infer that adding CR-4 repaired the 28-tuple
        limit. It did not; it replaced the limit at the aggregate level for the
        COMPLETE failure only.
    - id: C-11
      objection: OBJ-11
      severity: nonfatal
      title: The 0.16466 bound is scoped to the two declared biases
      target: 'criterion feasibility table section 5.4'
      before: >-
        The statistics are centred to within 0.16466 standard errors.
      after: >-
        The statistics are centred to within 0.16466 standard errors, AND THIS
        BOUND COVERS THE TWO DECLARED BIASES ONLY - the identity-bin convention
        difference at 0.08947 SEM and the process bias at 0.07519 SEM. The
        largest magnitude of the (N-1)-versus-N bin-count term, whose magnitude is
        (1 - exp(-lambda)), is 0.2032 SEM at T-12-2-B62; that term is a
        SPECIFICATION-DEVIATION HAZARD and NOT a bias of the specified process,
        because the exact formula E[distinct] = N - (1 - s/N)[(N-1) A + C] is over
        N bins and is correct, and IT TOO CANNOT FIRE A 3.000 CRITERION ALONE.
      consequence: >-
        No threshold moves. The sentence stops being narrower than a reader will
        take it to be, and 0.16466 stops being quoted downstream as though it
        bounded every second-order effect.
    - id: C-12
      objection: OBJ-12
      severity: nonfatal
      title: The RC-F disclosure carries the sharper consequence verbatim, and RC-F is still not discharged
      target: instrument_independence.RC_F_disclosure_and_what_it_does_not_discharge
      before: >-
        The disclosure records that the Coordinator read the committed BATCH-011
        driver, states that the process specification is not a fully blind
        re-derivation, asks the reviewers to assess what this batch contributes
        toward RC-F, and forbids any card from declaring RC-F discharged.
      after: >-
        UNCHANGED AND EXTENDED BY TWO SENTENCES CARRIED VERBATIM, WHICH ALSO
        APPEAR IN EVERY EXP-YIELD-002 RUN RECORD AND IN DEC-20260729-002 (PD-7).
        First - IV-1 CANNOT DISTINGUISH `the re-implementation is faithful` FROM
        `the re-implementation inherited the same defect through the contract
        text`, because P-ASRECORDED is specified to be IDENTICAL to what the
        driver the Coordinator read implements, so if that driver carried a subtle
        process error and the Coordinator transcribed it faithfully, IV-1
        reproduces it and passes; BATCH-012 therefore contributes an INDEPENDENT
        RE-IMPLEMENTATION OF A COORDINATOR-TRANSCRIBED PROCESS, NOT AN INDEPENDENT
        RE-DERIVATION, which is strictly weaker than RC-F's second route and is
        essentially zero progress on it. Second - ONE ASYMMETRY PARTIALLY RESCUES
        THE DESIGN: step 1 of P-REPAIRED has NO ANALOGUE in the BATCH-011 driver,
        so the PRIMARY arm is not transcribed from anything, and it is only the
        COMPARABILITY ANCHOR that is contaminated.
      status: >-
        RC-F IS NOT DISCHARGED BY THIS AMENDMENT, BY THIS BATCH, OR BY ANY CARD IN
        IT, AND THE REVIEWER ENDORSES THE NON-DISCHARGE. No later reader may read
        IV-1's passing as progress on RC-F.
    - id: C-13
      objection: OBJ-13
      severity: nonfatal
      title: The OB-10 effect-size analysis is scoped to the mean
      target: process_specification.effect_size_arithmetic_OB_10
      before: >-
        Both convention comparisons are derived and stated without scoping them
        to a moment.
      after: >-
        These comparisons are for the MEAN only; no claim is made about the
        variance under either convention, and no criterion in this contract
        depends on a modelled variance.
      why_it_is_harmless_as_written: >-
        CR-1 and CR-2 denominate on the MEASURED s_rep of the actual repaired
        process rather than on a modelled variance, and IV-1b checks the spread of
        the as-recorded arm only. It is recorded so that no later record reads the
        OB-10 analysis as covering second moments.

  changed_text_before_and_after:
    binding_note: >-
      THE THREE CRITERION-BEARING CLAUSES THIS AMENDMENT TOUCHES, EACH WITH ITS
      EXPLICIT BEFORE AND AFTER, SO THAT NO READER HAS TO DIFF TWO FILES. Every
      other clause of the frozen contract is UNCHANGED and is listed under
      not_changed.
    success_criterion_CR_1_CR_2_CR_4:
      before_and_after: >-
        UNCHANGED IN EVERY THRESHOLD AND IN EVERY WORD. CR-1 remains |z_sem|
        strictly less than 3.000 at every one of the 48 declared tuples under the
        standard-error-of-the-mean reading; CR-2 remains |z_sd| strictly less than
        3.000 at every tuple under the single-replicate reading; CR-4 remains
        n_neg at least 14 and at most 34, firing at n_neg at least 35 or at most
        13. What changes around them is the COUNTERFACTUAL under which their
        firability is stated (C-2), the REFERENCE LAW behind CR-4's declared alarm
        rate (C-5) and CR-2's stated chance-alarm bound (C-7). No criterion
        threshold moves.
    success_criterion_CR_3:
      before: >-
        CR-3, THE PRE-REGISTERED UPWARD SHIFT. At EVERY one of the 48 declared
        tuples, |z_shift| = |(mu_rep - mu_001) - T|/sqrt(sem_rep^2 + sem_001^2) is
        STRICTLY LESS THAN 3.000, where mu_001 and sem_001 are QUOTED from IN-1 at
        the tuple's binding committed reference and T = |S_(m-2)| exp(-C_red/N) is
        DETERMINED.
      after: >-
        IDENTICAL IN FORM AND IN THRESHOLD. Only the sourcing labels change, per
        C-6: mu_001 and s_001 are QUOTED from IN-1 at the tuple's binding
        committed reference, sem_001 = s_001/sqrt(n_rep) is DETERMINED from them
        with n_rep the tuple's C-14 replicate count, and T = |S_(m-2)|
        exp(-C_red/N) is DETERMINED. The shift T and the paired denominator
        sqrt(sem_rep^2 + sem_001^2) are BOTH CONFIRMED CORRECT by independent
        re-derivation and are not touched.
    falsification_criterion:
      before: >-
        P-MISS is missed if any of CR-1, CR-2, CR-3 fails at any declared tuple,
        or if CR-4 fires. MISS-STRUCTURED is the disjunction of six conditions,
        two of which use the constant 10.000. MISS-MARGINAL is an enumerated
        condition joined by `and or` and bounded above by 10.000 at both places.
        The three are asserted to be disjoint and exhaustive.
      after: >-
        P-MISS IS UNCHANGED. MISS-STRUCTURED is the same disjunction of six
        conditions with 10.000 replaced by 4.000 at both places it appears (C-4).
        MISS-MARGINAL IS P-MISS AND NOT MISS-STRUCTURED (C-1). The three branches
        are disjoint and exhaustive BY CONSTRUCTION. EVERY DISPOSITION IS
        UNCHANGED IN EVERY WORD - MISS-STRUCTURED still supersedes EV-ECDLP-008
        observation O-4 under a new record and never in place, still leaves the
        VOID standing and INV-4 not re-disposed; MISS-MARGINAL still records the
        prediction as NOT MET, still forbids `consistent with the prediction`,
        still leaves O-4 neither confirmed nor superseded, and still routes
        DEC-20260729-002 to `inconclusive` on the instrument question with a
        named replication successor that BATCH-012 does not perform and does not
        authorize.
      can_it_still_fail: >-
        YES, AND MORE CLEANLY THAN BEFORE. Under the adopted counterfactual CR-1
        fires at 20 tuples, CR-2 at 5, CR-3 at 18 and CR-4 with certainty, so the
        contract CAN FAIL if the diagnostic is wrong. Narrowing the severity edge
        to 4.000 makes MISS-STRUCTURED EASIER to reach and MISS-MARGINAL HARDER,
        which is the tightening direction.

  corrected_pre_registered_sets:
    binding_note: >-
