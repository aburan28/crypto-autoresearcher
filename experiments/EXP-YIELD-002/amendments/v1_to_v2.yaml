  preregistered_power_curve:
    binding_note: >-
      PRE-REGISTERED HERE, BEFORE ANY DRAW EXISTS, BECAUSE AN EXPERIMENT THAT IS
      NEAR-BLIND TO A PARTIAL FAULT MUST SAY SO BEFORE IT RUNS AND NOT AFTER IT
      RETURNS A COMFORTABLE NULL. IT FEEDS NO CRITERION, NO THRESHOLD, NO
      INVALIDATION RULE AND NO VERDICT. It is a declared scope limit.
    setup: >-
      Let the repaired null still fall short of P_pred by a fraction phi of T at
      every tuple, with sem_rep equal to sem_001. phi = 1.00 is the all-or-nothing
      counterfactual of C-2; phi = 0 is the null-plus-declared-bias case the
      prediction asserts. The two columns are the probability that CR-4 fires and
      the number of tuples at which the EXPECTED |z_sem| reaches 3.000.
    curve:
      - 'phi 0.02 - E[n_neg] 26.66 - P(CR-4 fires) 0.009 - tuples with expected |z_sem| at least 3.000, zero'
      - 'phi 0.05 - E[n_neg] 29.22 - P(CR-4 fires) 0.048 - tuples with expected |z_sem| at least 3.000, one'
      - 'phi 0.10 - E[n_neg] 31.71 - P(CR-4 fires) 0.179 - tuples with expected |z_sem| at least 3.000, five'
      - 'phi 0.20 - E[n_neg] 34.46 - P(CR-4 fires) 0.499 - tuples with expected |z_sem| at least 3.000, eight'
      - 'phi 0.50 - E[n_neg] 37.97 - P(CR-4 fires) 0.919 - tuples with expected |z_sem| at least 3.000, sixteen'
      - 'phi 1.00 - E[n_neg] 40.72 - P(CR-4 fires) 0.997 - tuples with expected |z_sem| at least 3.000, twenty'
    reading_pre_registered: >-
      IN THE REGIME WHERE THE PER-TUPLE CRITERIA HAVE NO POWER, PHI AT MOST 0.05,
      CR-4's FIRING PROBABILITY IS AT MOST 0.048. CR-4 restores power against the
      COMPLETE failure, not against partial ones. THEREFORE A PASS OF P-CORE IS
      NOT EVIDENCE THAT THE REPAIRED NULL IS EXACT: it is evidence that the null
      does not fall short by a LARGE fraction of T, and a shortfall of 5 percent
      of T or less would be very unlikely to be detected by anything in this
      contract. Any record reading a P-CORE pass must carry this sentence.
    provenance: >-
      The curve is the TASK-20260729-016 reviewer's Poisson-binomial computation,
      recorded at OBJ-10 and at section 6 of its feasibility_check.md, which the
      reviewer itself labels UNARCHIVED AND NOT EVIDENCE. It is carried here as a
      PRE-REGISTERED DESIGN LIMIT, not as a measurement, and no conclusion of this
      batch rests on its exact digits. This session re-derived none of it and does
      not claim to have.
    the_power_ruling: >-
      THE COORDINATOR'S RULING ON THE POWER QUESTION, RECORDED RATHER THAN LEFT
      IMPLICIT: THE EXPERIMENT IS WORTH RUNNING ONCE OBJ-1 THROUGH OBJ-4 ARE
      DISCHARGED, AND WAS NOT WORTH RUNNING AS FROZEN. The 28 powerless tuples do
      NOT make it unfireable, because the failure mode under test is GLOBAL -
      either the missing pre-marking is the whole story or it is not - so
      per-tuple powerlessness does not remove global falsifiability, and under the
      adopted counterfactual CR-1 fires at 20 tuples and CR-4 fires with
      certainty. What made it unrunnable as frozen was OBJ-1 and OBJ-2 - an
      outcome structure that does not determine its own branch for the most likely
      miss, and pre-registered sets that contradict the counterfactual the
      contract defines - together with OBJ-3. The declared power limit is stated
      BEFORE execution rather than discovered after, which is the only honest way
      to carry a limit.

