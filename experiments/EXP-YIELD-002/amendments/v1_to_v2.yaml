    pre-data, and change no threshold except the deliberate narrowing in OBJ-4.
    This amendment is the ONE versioned protocol_amendment cycle RC-12 permits
    after a REVISE verdict, and it is spent here.

  the_D_2_finding_stated_plainly_and_not_softened: >-
    OBJ-2 IS THE D-2 FAILURE MODE THE CONTRACT'S OWN PRED-ID RULE WAS WRITTEN TO
    PREVENT, OCCURRING INSIDE THE FILE THAT DECLARES IT. criteria_definitions.
    set_identity_not_cardinality_PRED_ID states, correctly and bindingly, that
    every pre-registered per-tuple expectation is a NAMED ENUMERATED TUPLE LIST
    evaluated on SET IDENTITY and never on CARDINALITY, and that a realised set
    whose COUNT matches while its MEMBERS differ is a FAILED prediction. The
    contract then published three pre-registered sets - section 6's CR-1 21-list,
    section 6's CR-2 4-list and section 7's 27-list - whose cardinalities look
    tidy and whose members are wrong at four named tuples under the contract's
    own section 4 counterfactual. The prophylaxis was STATED, NOT ACHIEVED. The
    Coordinator records that this was the Coordinator's own defect, that the
    TASK-20260729-015 receipt's claim to have reproduced all eleven load-bearing
    figures verified the arithmetic under section 6's reading without detecting
    that the contract mixes two readings, and that the defect was caught by the
    independent reviewer and not by the author. It is recorded against the
    contract, not in its favour.
  the_D_2_finding_is_not_a_new_physical_result: >-
    THIS IS A BOOKKEEPING INCONSISTENCY IN A CONTRACT, NOT A NEW FINDING ABOUT
    ANY MEASURED QUANTITY. The sharpest case, T-18-2-B264, has a missing
    pre-marking term T of 0.8753 bins against a committed residual of -27.997
    bins - 32 times too small to explain it - and across ALL 29 m = 2 tuples T
    never exceeds 0.9978 bins. That the pre-marking term explains nothing at
    m = 2 is exactly what BOTH BATCH-011 reviewers already recorded: the fault is
    invisible at m = 2 and dominant at m = 3. Nothing here is evidence about
    P_pred, about the occupancy null, about decomposition yield or about any
    curve.

  confirmatory_status: exploratory_only
  confirmatory_status_basis: >-
    UNCHANGED FROM v1 AND RESTATED RATHER THAN WEAKENED. docs/task-lifecycle.md
    section 5 governs. The v1 basis stands - a successor whose inputs are
    quantities already committed in the BATCH-011 package has an outcome partly
    determined by data already in hand, so it CANNOT be confirmatory (RC-G). This
    amendment adds a second, independent reason for the same label: it revises a
    frozen protocol after an ADVERSE independent review, which docs/task-lifecycle.md
    section 5 requires to be labelled exploratory and forbids evaluating against
    the original confirmatory criterion. A PRIOR BATCH IN THIS PROGRAM WAS
    CORRECTED FOR MARKING EXACTLY THIS SITUATION `preserved`, and that correction
    is followed here rather than re-argued.
    WHAT IS AND IS NOT PRESERVED, SEPARATED SO NEITHER IS OVERSTATED. NOT
    preserved - the confirmatory standing of the v1 criteria. PRESERVED, and it
    is a different and weaker thing - PRE-REGISTRATION ORDER. No run of this
    contract exists; the TASK-20260729-016 review confirmed against commit order
    that `git ls-tree -r HEAD` lists zero paths under
    experiments/EXP-YIELD-002/runs; this amendment is committed strictly before
    any draw, which a third party can check against Git. Pre-registration order
    is a property of commit order; confirmatory status is a property of protocol
    stability over unseen data. This amendment has the first and not the second,
    and the two are not interchangeable.

