    not_changed and what_this_amendment_does_not_do - are a DECLARED EXTENSION of
    that schema, declared here rather than silently added, because the template
    carries no field in which a per-objection disposition, a corrected
    pre-registered tuple set or a pre-registered power curve could be recorded.
