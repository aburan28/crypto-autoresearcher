  carried_forward_as_already_discharged:
    binding_note: >-
      THE REVIEWER ENDORSED AND INDEPENDENTLY RE-DERIVED EACH ITEM BELOW. THEY ARE
      CARRIED FORWARD AS DISCHARGED AND ARE NOT RE-LITIGATED BY THIS AMENDMENT.
      Each cites RT-20260729-016 and its feasibility_check.md as the source of the
      re-derivation. This session re-derived none of them and does not claim to
      have.
    CR_4_independence_half: >-
      ENDORSED AND RE-DERIVED. The per-tuple streams are DISTINCT BY CONSTRUCTION,
      because RC-C's de-duplication on (k, m, B) makes those three seed-string
      fields unique across the 48. P_pred,i is a fixed constant carrying no
      randomness. OB-9 genuinely DOES NOT TRANSFER, because its objection concerns
      the correlation of MEASURED CURVE QUANTITIES down a (k, m) column and those
      quantities enter here as constants. The contract's stated reason is the
      right reason. Only the identical-distribution half was loose, and C-5
      repairs it.
    E_distinct_formula: >-
      RE-DERIVED FROM SCRATCH AND CONFIRMED CORRECT AND EXACT.
      E[distinct] = N - (1 - s/N)[(N-1)(1 - 2/N)^(C/2) + (1 - 1/N)^(C/2)], with the
      derivation correct: pre-marking and throwing are independent, P(j not
      pre-marked) = 1 - s/N for every j by exchangeability, N odd gives
      P(miss j) = 1 - 2/N per throw for j nonzero and 1 - 1/N for j = 0, and
      linearity of expectation needs no cross-bin independence. The asymptotic form
      E[distinct] - P_pred = (1 - s/N)[exp(-lambda)(1 + lambda) - exp(-lambda/2)]
      + O(1/N) is confirmed, with the largest gap between the exact value and the
      asymptotic form over the 48 tuples at 3.05e-05 bins. f < g for every positive
      lambda is proved independently.
    both_SEM_bounds: >-
      BOTH REPRODUCE, AT THE SAME TUPLES THE CONTRACT NAMES. Maximum process bias
      0.07519 SEM at T-12-2-B46, against the contract's 0.0752 at T-12-2-B46.
      Maximum identity-convention difference at m = 2, 0.08947 SEM at T-12-2-B62,
      against the contract's 0.0895 at T-12-2-B62. At m = 3 the maximum is 0.00043
      SEM at T-12-3-B22, against the contract's `below 0.001`. THE BINDING
      CONSEQUENCE STANDS AND IS CARRIED: neither the identity-bin convention nor
      the process bias can produce a 3.000-SEM excursion at any declared tuple, so
      NO OUTCOME OF THIS EXPERIMENT MAY BE EXPLAINED BY EITHER, IN EITHER
      DIRECTION.
    CR_3_shift_and_denominator: >-
      BOTH CORRECT. The true expected shift is T - (s/N) f(lambda) + O(1/N) and the
      neglected correction is below 1e-3 SEM at every tuple, so
      T = |S_(m-2)| exp(-C_red/N) is correct to far inside tolerance. The paired
      denominator sqrt(sem_rep^2 + sem_001^2) is correct, because the arms use
      independent streams and the shared quantities N, C_red, s and P_pred are
      constants carrying no variance. Only the SOURCING LABEL of sem_001 was wrong,
      and C-6 repairs it.
    tail_constants_and_the_budget: >-
      CONFIRMED. P(|t_99| > 3.000) = 0.003416 against the claimed 0.00342;
      P(|t_29| > 3.000) = 0.005499 against the claimed 0.00552, correct to 0.4
      percent; P(|Z| > 3.000) = 0.002700 against the claimed 0.00270. The rebuilt
      total is 0.37582 against the declared 0.377, SO THE DECLARED FIGURE IS A
      VALID UPPER BOUND, and the union-bound direction is right, expected
      exceedances bounding P(at least one) by Markov. Only CR-2's per-tuple bound
      was wrong, and C-7 repairs it.
    pre_registration_order: >-
      CONFIRMED AGAINST COMMIT ORDER. `git ls-tree -r HEAD` lists
      experiments/EXP-YIELD-002/specification.yaml and ZERO paths under
      experiments/EXP-YIELD-002/runs. No draw of P-REPAIRED or P-ASRECORDED exists
      at any commit reachable from HEAD, so the contract and its prediction are
      committed strictly before any draw, and this amendment will be too.
    other_items_reproduced_without_dispute: >-
      CARRIED AND NOT REOPENED: 49 criterion-evaluable cells, RC-C de-duplication
      to 48 with the single duplicate at (k=12, m=3, B=22); the arity split 29 at
      m = 2 and 19 at m = 3; the C-14 realised schedule of 37 tuples at 100
      replicates and 11 at 30 with the 10-replicate tier unreachable and the
      largest C_red 91922 at T-18-3-B82; all 49 C_red even, so C_red/2 is always an
      exact integer and the odd-C_red rule can only fire on a read error; P_pred
      recomputed to full double precision at the four INV-4-failing tuples agreeing
      to 0.0 absolute, so IV-2 case KA-8 is feasible and will pass; and IN-2
      carrying n_evaluable_on_measured_B = 49 and n_eval_denominator = 49, so the
      IV-4 cross-check is implementable as written.

