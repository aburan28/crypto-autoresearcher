  objective: >-
    Discriminate, with zero curve arithmetic and in seconds of compute, between
    the two live explanations of the BATCH-011 VOID that DEC-20260729-001
    rationale R-8 records as UNDISCRIMINATED BY ANYTHING ARCHIVED - (i) the
    occupancy null control's construction omits a term P_pred contains, and
    (ii) P_pred is wrong in some further unmodelled way. The discriminating
    measurement is RC-A: re-derive the antipodal occupancy null WITH THE
    PRE-MARKING - mark |S_(m-2)| bins chosen uniformly at random, then throw
    C_red/2 antipodal pairs, then count distinct occupancy - and compare against
    the UNCHANGED P_pred under BOTH denominator readings, at the four
    INV-4-failing tuples and across the whole criterion-evaluable set
    de-duplicated per RC-C. Until this is archived and verified, explanation
    (ii) is excluded by an argument and not by a measurement.

  admission_and_ceiling: >-
    CARRIED VERBATIM AND BINDING ON EVERY DOWNSTREAM RECORD.
    EXP-YIELD-002 IS NOT EVEN AN EXPONENT-DECIDING SCREEN. It is an INSTRUMENT
    CONTROL ON A CONTROL, admitted under docs/target-result-profile.md rule A1's
    building-block clause as the precondition that decides whether the
    exponent-deciding screen EXP-YIELD-001 measured anything at all. IT MOVES NO
    EXPONENT AND CANNOT MOVE ONE, and no later record may quote any part of it
    as target-class, as an exponent result, as an attack, as an attack
    improvement, as a cryptanalytic result, as a closure, or as an impossibility
    claim.
    ITS CLAIM TIER IS CAPPED AT TOY. It CAN MEET NO COMPLETION CRITERION OF
    GOAL-ECDLP-001 UNDER ANY OUTCOME. It changes no hypothesis status. It
    COMPUTES NO OCCUPANCY-NORMALISED EFFICIENCY E AND NO YIELD RATIO R, and no
    such figure - including the value 0.85 that appears in the committed
    EXP-YIELD-001 v2 amendment clause C-3 as a HYPOTHETICAL WORKED CASE and
    never as a measurement - is computed, quoted or reported anywhere in this
    contract, in its driver, in its run records, or in any record derived from
    them.
    IT DOES NOT UN-FIRE INV-4 AND DOES NOT RE-DISPOSE IT. INV-4 fired at 4 of 49
    criterion-evaluable cells of the BATCH-011 package and that firing stands
    untouched under every outcome here. It DECLARES INV-5 NEITHER FIRED NOR NOT
    FIRED. No branch of the EXP-YIELD-001 v2 outcome_disposition_table is
    evaluated by it.
    IT TOUCHES NO COST MODEL, AND EVEN A FULLY REPAIRED NULL YIELDS NO
    COST-MODEL CONSEQUENCE. The counterfactual branch on the committed data is
    O-6, SPARSE OUT-OF-BAND SET, whose own frozen disposition text forbids
    re-charging - it is NOT O-4, and DEC-20260729-001 rationale R-6 records that
    the opposite framing was factually wrong on the committed data.
    All four asymptotic-claim promotion gates remain OPEN and none is attempted.
    No closure quorum is claimed or claimable (INT-BATCH012-D). A TIMEOUT,
    CRASH, RESOURCE EXHAUSTION OR IMPLEMENTATION FAILURE IS INFRASTRUCTURE
    SIGNAL AND IS NEVER A NEGATIVE MATHEMATICAL RESULT about P_pred, about the
    diagnostic, about the occupancy null, or about anything else.

  why_this_is_not_a_re_litigation: >-
    RECORDED BECAUSE THE OBJECTION IS THE OBVIOUS ONE AND IT IS ANSWERABLE.
    BATCH-011's diagnostic was re-derived INDEPENDENTLY BY TWO NON-ORIGINATING
    REVIEW SESSIONS: TASK-20260729-007 recomputed P_pred at all 49
    criterion-evaluable cells from the raw recorded quantities to a MAXIMUM
    ABSOLUTE DIFFERENCE OF 0.0 and reproduced both standardized residuals to
    1e-9, and TASK-20260729-008 re-derived the same identity from the frozen
    contract text BEFORE reading the Executor's arithmetic and strengthened it.
    Nothing here re-opens that arithmetic and nothing here re-argues it. What is
    UNARCHIVED, and what this contract exists to archive, is the CLAIM the
    arithmetic supports: that a null with the pre-marking restored actually
    lands on P_pred. DEC-20260729-001 rationale R-8 records in terms that NO
    REPAIRED-NULL DRAW EXISTS UNDER ANY ARCHIVED RUN ID and that until RC-A is
    archived and verified the second explanation is excluded by an argument and
    not by a measurement. RC-A is therefore a DISCRIMINATING CONTROL ON AN
    UNARCHIVED CLAIM, not a re-litigation of a settled one.

  instrument_independence:
    zero_curve_arithmetic: >-
      ZERO CURVE ARITHMETIC IS SPECIFIED ANYWHERE IN THIS CONTRACT AND NONE MAY
      BE IMPLEMENTED. No elliptic-curve point addition, no doubling, no scalar
      multiplication, no curve-order computation, no curve selection, no
      generator selection, no discrete-logarithm table, no factor base, no sum
      set, no census, no summation polynomial, no Groebner basis and no
      polynomial system solve. The experiment is a BALLS-IN-BINS SIMULATION OVER
      THE INTEGER RESIDUE UNIVERSE {0, 1, ..., N-1} on already-recorded integer
      parameters. If the driver needs a curve operation to satisfy any clause of
      this contract, the clause is defective and the Executor STOPS AND REPORTS
      under ST-3 rather than implementing one.
    forbidden_imports: >-
      THE DRIVER MUST NOT IMPORT, EXECUTE, OR READ INTO ITSELF any curve code or
      any part of the EXP-YIELD-001 instrument. Named explicitly and
      exhaustively for this contract: harness/endomorphism_la.py, every other
      module under harness/, everything under tools/, and
      experiments/EXP-YIELD-001/driver/yield_census.py. The permitted
      dependencies are the Python standard library and numpy, and nothing else.
    RC_F_disclosure_and_what_it_does_not_discharge: >-
      DISCLOSED RATHER THAN GLOSSED. TASK-20260729-018 is required by its own
      card to write its driver FROM THIS CONTRACT TEXT AND THE COMMITTED
      RECORDED QUANTITIES ALONE, WITHOUT READING
      experiments/EXP-YIELD-001/driver/yield_census.py, and to record that fact
      in every manifest. SEPARATELY AND HONESTLY: the COORDINATOR authoring this
      contract DID read the committed EXP-YIELD-001 driver, in order to state
      truthfully under OB-10 whether this contract's identity-bin treatment
      differs from what the BATCH-011 driver actually did. That reading is
      disclosed here so that nobody later discovers it. Its consequence is that
      the process specification in this contract is NOT a fully blind
      re-derivation, and TASK-20260729-016, TASK-20260729-020 and
      TASK-20260729-021 must assess what, if anything, this batch contributes
      toward RC-F in the light of that disclosure. NO CARD IN THIS BATCH MAY
      DECLARE RC-F DISCHARGED, AND THIS CONTRACT DOES NOT.

