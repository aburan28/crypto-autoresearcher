  process_specification:
    universe: >-
      THE BIN UNIVERSE IS THE INTEGER RESIDUE SET {0, 1, ..., N-1}, one bin per
      group element, with bin 0 being the IDENTITY BIN. N is QUOTED per tuple
      from IN-1 and is odd and prime at all four field sizes (N = 4001, 16619,
      65633, 261707). No group, curve or point object is constructed; the
      universe is an integer index range and nothing more.
    bin_structure_OB_10: >-
      THE MAP g -> (N - g) mod N HAS EXACTLY ONE FIXED POINT, g = 0. The N - 1
      non-identity residues therefore partition into (N-1)/2 ANTIPODAL-PAIR
      BINS, and the identity bin {0} stands alone, giving (N-1)/2 + 1 orbits
      over N bins. Both counts are stated because the quantity being measured is
      the number of distinct BINS covered, not the number of ORBITS touched.
    P_REPAIRED:
      id: P-REPAIRED
      statement: >-
        THE PRIMARY PROCESS, STATED EXACTLY AS RC-A AND DEC-20260729-001 NA-1
        STATE IT, WITH THE TWO OB-10 DECISIONS MADE EXPLICIT RATHER THAN LEFT TO
        THE IMPLEMENTER. One replicate at a tuple (N, C_red, s) with
        s = |S_(m-2)| is:
        STEP 1, PRE-MARK. Choose s DISTINCT bins UNIFORMLY AT RANDOM WITHOUT
        REPLACEMENT from all N bins, and mark them. The identity bin 0 IS
        ELIGIBLE to be chosen and is chosen with probability s/N like every
        other bin. A bin chosen in step 1 is marked ONCE and contributes ONCE to
        the distinct count.
        STEP 2, THROW. Repeat exactly C_red/2 times, each repetition
        independent of every other and of step 1: draw g uniformly at random
        from {0, 1, ..., N-1} WITH REPLACEMENT, and mark BOTH bin g and bin
        (N - g) mod N.
        STEP 3, COUNT. Report the number of distinct marked bins.
        ORDER IS BINDING: step 1 strictly precedes step 2 within a replicate,
        and both consume the same per-tuple random stream in that order.
      identity_bin_may_be_pre_marked: >-
        YES, AND THIS IS A DECISION AND NOT AN OVERSIGHT. RC-A's text is `mark
        |S_(m-2)| bins chosen uniformly at random`, and this contract does not
        weaken, narrow or paraphrase it. The uniform choice is over ALL N bins
        with the identity bin included. The structurally exact alternative and
        its exact effect size are declared below, before data, so that a
        mismatch can never be attributed to this convention after the fact.
      identity_bin_may_be_hit: >-
        YES. A throw with g = 0 marks bin 0 only, because (N - 0) mod N = 0, so
        that throw covers ONE bin rather than two. This is not corrected, is not
        rejected, and is not resampled. It occurs with probability 1/N per
        throw.
      odd_C_red_rule: >-
        C_red IS QUOTED FROM IN-1 AND IS NEVER RECOMPUTED FROM B BY THIS DRIVER.
        All 49 committed cells record C_red_is_even true and the authoring
        session confirmed all 49 values are even; the largest is 91922. IF THE
        DRIVER EVER READS AN ODD C_red FOR A DECLARED TUPLE, that can only be a
        read or parse error, it fires IV-4 INPUT INTEGRITY, the run STOPS AND
        REPORTS, NO THROW IS PERFORMED at that tuple, and the run is not
        evidence. C_red/2 is therefore always an exact integer and no rounding,
        flooring or ceiling rule is needed or permitted.
    P_ASRECORDED:
      id: P-ASRECORDED
      statement: >-
        THE COMPARABILITY PROCESS. Identical to P-REPAIRED WITH STEP 1 DELETED:
        repeat exactly C_red/2 times, draw g uniformly at random from
        {0, 1, ..., N-1} with replacement, mark bin g and bin (N - g) mod N,
        then count distinct marked bins. Nothing is pre-marked.
      authority: >-
        This is the process the committed EXP-YIELD-001 v2 amendment clause C-4
        specifies in its own words - `repeat C_red/2 times, draw g uniformly at
        random from G and insert BOTH g and -g into the same N-bit set, then
        count distinct occupancy`. It is re-implemented here from that text so
        that the repaired arm's comparison against the committed package rests
        on a re-implementation this batch archives, rather than on an assertion.
    difference_from_the_BATCH_011_driver_declared_before_data: >-
      DECLARED IN THE CONTRACT, BEFORE DATA, WITH EFFECT SIZES, AS OB-10
      REQUIRES. THE ONLY INTENDED DIFFERENCE BETWEEN P-ASRECORDED AND THE
      BATCH-011 ANTIPODAL PROCESS IS NONE: the throwing step, the universe, the
      with-replacement draw, the marking of g and (N - g) mod N, and the
      identity-draw behaviour are specified here to be IDENTICAL to what the
      committed BATCH-011 driver implements, which the Coordinator confirmed by
      reading that committed driver (see instrument_independence.
      RC_F_disclosure_and_what_it_does_not_discharge). THE ONLY DIFFERENCE
      BETWEEN P-REPAIRED AND THE BATCH-011 ANTIPODAL PROCESS IS STEP 1, THE
      PRE-MARKING, WHICH IS THE ENTIRE POINT OF THIS EXPERIMENT.
    effect_size_arithmetic_OB_10:
      exact_mean_of_P_REPAIRED: >-
        DERIVED IN PLACE AND OFFERED FOR INDEPENDENT RE-DERIVATION RATHER THAN
        FOR ADJUDICATION BY QUOTATION. Write A = (1 - 2/N)^(C_red/2) and
        C = (1 - 1/N)^(C_red/2). Bin j survives unmarked exactly when it is not
        pre-marked AND not hit, and the two events are independent because step
        1 and step 2 use independent randomness. P(j not pre-marked) = 1 - s/N
        for every j by symmetry of the uniform s-subset. P(j not hit) = A for
        j nonzero and = C for j = 0. Hence
        E[distinct] = N - (1 - s/N)[(N-1) A + C].
        This is EXACT, requires no approximation, and is the known-answer target
        used by IV-2.
      difference_from_P_pred: >-
        With lambda = C_red/N, A = exp(-lambda)(1 - lambda/N + O(N^-2)) and
        C = exp(-lambda/2)(1 + O(N^-1)), so
        E[distinct] - P_pred = (1 - s/N)[exp(-lambda)(1 + lambda) -
        exp(-lambda/2)] + O(N^-1). Write f(lambda) = exp(-lambda)(1 + lambda) -
        exp(-lambda/2). f is positive and increasing on the realised range, f is
        approximately lambda/2 for small lambda, and over the declared set
        lambda spans 0.002208576767147994 to 0.49575670775372144, giving
        f between 0.0011 and 0.1307. THE EXACT PROCESS MEAN THEREFORE SITS ABOVE
        P_pred BY AT MOST 0.131 BINS ACROSS THE WHOLE DECLARED SET, the maximum
        being 0.13063 at T-16-3-B58 where lambda is largest. In standard error
        units, f(lambda) is strictly below g(lambda) = exp(-lambda/2) -
        exp(-lambda) at every positive lambda, so this bias is bounded above by
        the identity-convention bound 0.0895 standard errors of the mean at
        every declared tuple; ITS OWN TIGHTEST PER-TUPLE MAXIMUM IS 0.0752
        STANDARD ERRORS, ATTAINED AT T-12-2-B46. The per-tuple arithmetic for
        all 48 tuples is section 5 of the criterion feasibility table. IT IS A
        KNOWN, POSITIVE,
        SECOND-ORDER BIAS, IT IS DECLARED HERE BEFORE DATA, AND NO CRITERION
        THRESHOLD IS MOVED TO ACCOMMODATE IT.
      the_structurally_exact_alternative_and_why_it_is_not_used: >-
        STATED SO THAT A MISS CAN NEVER BE ATTRIBUTED TO THIS CONVENTION AFTER
        THE FACT. The bins that S_(m-2) actually occupies are not a uniform
        random subset. At m = 2, S_0 is exactly the identity, so the one
        structurally correct pre-marked bin IS bin 0. At m = 3, S_1 is the
        factor base F, which contains no identity and is closed under negation,
        so the structurally correct pre-marked set is B/2 whole antipodal pairs
        among the (N-1)/2 non-identity pairs. THIS CONTRACT USES THE UNIFORM
        RULE, because that is what RC-A and DEC-20260729-001 NA-1 say and their
        text is not narrowed here. The exact size of the difference, derived in
        section 5 of the criterion feasibility table, is:
        AT m = 2, the two conventions differ in mean by exactly
        (1 - 1/N)(exp(-lambda/2) - exp(-lambda)) + O(N^-1), whose MAXIMUM over
        the 29 declared m = 2 tuples is 0.0895 STANDARD ERRORS OF THE MEAN,
        attained at T-12-2-B62 (k = 12, beta = 0.500, lambda =
        0.48037990502374406, committed sd 18.76940073738115, 100 replicates);
        AT m = 3, the two conventions differ in mean by exactly
        (B/N)(exp(-lambda) - exp(-lambda/2)) + O(N^-1), whose MAXIMUM over the 19
        declared m = 3 tuples is BELOW 0.001 STANDARD ERRORS OF THE MEAN at every
        tuple, because B/N is at most 22/4001.
        CONSEQUENCE, BINDING: THE IDENTITY-BIN CONVENTION CANNOT PRODUCE A
        3-STANDARD-ERROR EXCURSION AT ANY DECLARED TUPLE, so no outcome of this
        experiment may be explained by it, in either direction, by any record.
    what_is_NOT_simulated: >-
      NO SUM SET IS BUILT. NO FACTOR BASE IS BUILT. NO CENSUS IS RE-OPENED. |S_m|
      is not recomputed, not read, not estimated and not reported. The
      experiment simulates the NULL CONTROL OBJECT ONLY.

  controls:
    - id: CTRL-002-REPAIRED
      run_id: RUN-YIELD-002-NULL-REPAIRED
      description: >-
        THE PRIMARY ARM. Process P-REPAIRED at all 48 declared tuples, at the
        C-14 replicate schedule fixed below, reporting per tuple the SAMPLED
        mean, the SAMPLED sd, the SAMPLED relative sd, the replicate count, the
        derived standard error of the mean, and both standardized residuals
        against the QUOTED unchanged P_pred.
      feeds: 'CR-1, CR-2, CR-3, CR-4.'
    - id: CTRL-002-ASRECORDED
      run_id: RUN-YIELD-002-NULL-ASRECORDED
      description: >-
        THE COMPARABILITY ARM. Process P-ASRECORDED at the same 48 tuples at the
        same replicate counts, re-implemented from this contract's text. Its
        PURPOSE IS COMPARABILITY AND NOT MEASUREMENT: it establishes whether
        this batch's re-implementation reproduces the committed
        RUN-YIELD-001-NULL-RANDOM-SUMSET antipodal arm, so that the repaired
        arm's comparison against the committed package is anchored.
      feeds: 'IV-1 only. It feeds NO success criterion and NO falsification criterion.'
    - id: CTRL-002-KNOWNANSWER
      run_id: RUN-YIELD-002-KNOWNANSWER
      description: >-
        THE SIMULATOR CORRECTNESS ARM. Known-answer checks of the simulator
        against exactly computable expectations at synthetic parameters, plus
        explicit checks of the pre-marking (uniform, without replacement,
        pre-marked bins counted once) and of the identity-bin accounting, plus
        an exact-arithmetic reproduction of the QUOTED P_pred at the four
        INV-4-failing tuples. Every case, its exact target and its numeric
        tolerance are enumerated in invalidation rule IV-2 below.
      feeds: 'IV-2 only.'
    - id: CTRL-002-DIAGNOSTIC-HIGHPRECISION
      run_id: 'RUN-YIELD-002-NULL-REPAIRED - reported inside that run record in a separate block'
      description: >-
        HIGH-PRECISION DIAGNOSTIC BLOCK, REQUIRED BY RC-E AND FEEDING NOTHING.
        Both processes P-REPAIRED and P-ASRECORDED at the FOUR INV-4-FAILING
        TUPLES ONLY, at 10000 replicates each, under master seed 120501. Its
        purpose is to make the size and sign of the pre-marking shift visible at
        a precision the criteria deliberately do not use.
      binding_label: >-
        THIS BLOCK FEEDS NO CRITERION, NO THRESHOLD, NO INVALIDATION RULE AND NO
        VERDICT. Its numbers may not be substituted for, averaged with, pooled
        with, or compared against any criterion quantity, and no record produced
        by BATCH-012 may evaluate CR-1, CR-2, CR-3, CR-4, IV-1 or IV-2 on them.
        It is reported and labelled and nothing else.

  independent_variables:
    - 'declared parameter tuple, 48 values, each a QUOTED (k, N, m, B, C_red, |S_(m-2)|, P_pred) record from IN-1'
    - 'arity m in {2, 3}, which fixes |S_(m-2)| as 1 or B'
    - 'process in {P-REPAIRED, P-ASRECORDED}'
    - 'denominator reading in {standard error of the mean, single-replicate standard deviation}'

  metrics:
    primary:
      - >-
        PM-1 mu_rep, the mean distinct occupancy of process P-REPAIRED over the
        tuple's replicate count. SAMPLED.
      - >-
        PM-2 s_rep, the sample standard deviation of the same replicates, and
        sem_rep = s_rep/sqrt(n_rep). SAMPLED. n_rep is DETERMINED.
      - >-
        PM-3 z_sem = (mu_rep - P_pred)/sem_rep, the PRIMARY standardized
        residual under DEV-4's standard-error-of-the-mean reading. SAMPLED
        numerator and denominator over a DETERMINED P_pred.
      - >-
        PM-4 z_sd = (mu_rep - P_pred)/s_rep, the SECONDARY standardized residual
        under DEV-4's literal single-replicate-standard-deviation reading.
        SAMPLED numerator and denominator over a DETERMINED P_pred.
      - >-
        PM-5 z_shift = ((mu_rep - mu_001) - T)/sqrt(sem_rep^2 + sem_001^2),
        where mu_001 and sem_001 are QUOTED from IN-1 and T = |S_(m-2)|
        exp(-lambda) is DETERMINED. This is the numeric form of NA-1's clause
        that the repaired mean is shifted UP by |S_(m-2)| exp(-C_red/N) relative
        to the committed mean. Mixed SAMPLED and DETERMINED, labelled per part.
    secondary:
      - 'mu_asrec, s_asrec, sem_asrec of process P-ASRECORDED per tuple. SAMPLED.'
      - 'z_comp = (mu_asrec - mu_001)/sqrt(sem_asrec^2 + sem_001^2), the comparability statistic. SAMPLED over a QUOTED mu_001.'
      - 'r_sd = s_asrec/s_001, the sd comparability ratio, and its natural logarithm. SAMPLED over a QUOTED s_001.'
      - 'the sign of (mu_rep - P_pred) per tuple, and n_neg, the count of declared tuples with a negative sign. SAMPLED.'
      - 'lambda, exp(-lambda), T, P_pred, N, B, C_red, |S_(m-2)|, n_rep per tuple. DETERMINED, and every one is also QUOTED from IN-1 and cross-checked to 1e-9.'
      - 'per-run wall clock, peak resident memory, total random draws consumed. MEASURED.'
      - 'the high-precision diagnostic block means and sds at the four INV-4-failing tuples. SAMPLED, and feeding nothing.'
    labelling_rule_RC_8: >-
      EVERY REPORTED QUANTITY CARRIES AN EXPLICIT `label` FIELD READING EXACTLY
      ONE OF `DETERMINED`, `QUOTED`, `SAMPLED` OR `MEASURED`, PER QUANTITY AND
      PER TUPLE, IN EVERY results.json AND IN summary.json. NOTHING THAT IS
      ESTIMATED MAY BE LABELLED DETERMINED. A statistic derived from SAMPLED
      inputs is SAMPLED however exact its arithmetic.

  heuristic_under_test: null
  heuristic_under_test_note: >-
    NULL. No heuristic is under test. HEUR-1, the counting heuristic
    B^m/(m! p), is NOT tested, NOT validated, NOT weakened and NOT mentioned as
    a measured quantity by this contract, and EV-ECDLP-008 already records that
    BATCH-011 did not test it either.

  preregistered_prediction:
    recording_order_statement: >-
      THIS PREDICTION IS RECORDED IN TWO COMMITS THAT BOTH STRICTLY PRECEDE ANY
      DRAW: the BATCH-012 opening control-plane commit carrying
      dispatch_queue.json, and the TASK-20260729-015 snapshot commit carrying
      this file. PRE-REGISTRATION HERE IS A PROPERTY OF COMMIT ORDER THAT A
      THIRD PARTY CAN CHECK AGAINST GIT, not a property of a working tree.
    quantity: >-
      The mean distinct occupancy of the pre-marked antipodal process
      P-REPAIRED at every one of the 48 declared parameter tuples, standardized
      against the UNCHANGED committed P_pred under both denominator readings,
      and its shift relative to the committed RUN-YIELD-001-NULL-RANDOM-SUMSET
      antipodal mean.
    formula: >-
      E[distinct] = N - (1 - s/N)[(N-1)(1 - 2/N)^(C_red/2) + (1 - 1/N)^(C_red/2)]
      with s = |S_(m-2)|, which equals P_pred = N(1 - exp(-lambda)) +
      |S_(m-2)| exp(-lambda) up to the declared O(1) term f(lambda) bounded by
      0.131 bins and by 0.0895 standard errors of the mean over the declared set.
    prediction_carried_verbatim: >-
      CARRIED VERBATIM FROM DEC-20260729-001 NEXT ACTION NA-1 AND FROM THE
      BATCH-012 dispatch_queue.json preregistered_prediction BLOCK, UNWEAKENED,
      UNPARAPHRASED, WITH NO ESCAPE CLAUSE AND NO BRANCH THAT LETS A MISS BE
      REPORTED AS A PASS:
      THE REPAIRED NULL LANDS WITHIN 3 STANDARD DEVIATIONS OF THE UNCHANGED
      P_pred AT EVERY DECLARED CELL, UNDER BOTH DENOMINATOR READINGS - the
      single-replicate standard deviation and DEV-4's stricter standard error of
      the mean - with the repaired null's mean shifted UP by
      |S_(m-2)| exp(-C_red/N) relative to the per-cell mean recorded in
      RUN-YIELD-001-NULL-RANDOM-SUMSET at commit
      2fb2bb7a111d999859612e52990eea7dc6bbac1a.
    what_a_failure_means_stated_in_advance_and_carried_verbatim: >-
      IF THE PREDICTION FAILS, THE READING OF BATCH-011 CHANGES FROM A
      NULL-CONSTRUCTION FAULT TO A MEASUREMENT FAULT, AND THAT IS THE WHOLE
      POINT OF RUNNING IT. DEC-20260729-001 rationale R-8 records that the two
      live explanations of the BATCH-011 shortfall - (i) the null control's
      construction omits a term P_pred contains, and (ii) P_pred is wrong in
      some further unmodelled way - are NOT discriminated by anything archived,
      and that until RC-A is archived, explanation (ii) is excluded by an
      argument and not by a measurement. A failure of this prediction is
      therefore evidence FOR explanation (ii): it would mean the
      located-and-repairable-instrument-fault half of the BATCH-011 ruling is
      wrong, that the VOID reflects a fault in the predicted quantity rather
      than in the control that was supposed to certify it, and that OBSERVATION
      O-4 OF EV-ECDLP-008 MUST BE SUPERSEDED RATHER THAN CONFIRMED - SUPERSEDED
      UNDER A NEW RECORD AND NEVER EDITED IN PLACE, because EV-ECDLP-008 is
      immutable. THAT OUTCOME IS ADMISSIBLE, IS NOT A BATCH FAILURE, AND MUST
      NOT BE EXPLAINED AWAY. No threshold, replicate count, cell set, seed or
      denominator reading may be changed after the numbers are visible without a
      versioned protocol_amendment recorded before the change.
    what_the_prediction_does_NOT_say: >-
      It does not say, imply or license that P_pred is CORRECT as a model of the
      decomposition census, that the BATCH-011 efficiencies were never in
      question, that INV-4 should not have fired, or that anything at all
      follows about decomposition yield. A REPAIRED CONTROL THAT LANDS ON ITS
      OWN PREDICTION ESTABLISHES THAT THE CONTROL WAS MIS-CONSTRUCTED. IT
      ESTABLISHES NOTHING ABOUT THE QUANTITY THE CONTROL WAS BUILT TO NORMALISE.
    source: >-
      DEC-20260729-001 next action NA-1, adopted from RT-20260729-008 required
      control RC-A. The analytic mean is the textbook balls-in-bins law with an
      independent pre-marking layer, derived in place above and offered for
      independent RE-DERIVATION by TASK-20260729-016 rather than for
      adjudication by quotation. NO EXTERNAL SOURCE WAS RETRIEVED AND NO NOVELTY
      IS CLAIMED.

  confirmatory_status: exploratory_only
  confirmatory_status_basis: >-
    RC-G, MANDATORY AND EASILY MISSED, STATED PLAINLY AND NOT SOFTENED. Under
    docs/task-lifecycle.md section 5, a test whose inputs are quantities ALREADY
    COMMITTED in the BATCH-011 package has an outcome PARTLY DETERMINED BY DATA
    ALREADY IN HAND, so it CANNOT be confirmatory. Every N, B, C_red, m,
    |S_(m-2)| and P_pred consumed here was recorded, committed and read before
    this contract was written, and the very diagnostic this experiment tests was
    computed from them. THIS CONTRACT IS THEREFORE `exploratory_only`.
    A CONFIRMATORY TEST OF THE YIELD HEURISTIC REQUIRES FRESH CELLS - new curves
    per size, or new sizes - WITH THE REPAIRED NULL PRE-REGISTERED BEFORE THEY
    ARE MEASURED, AND THIS CONTRACT IS EXPRESSLY NOT THAT TEST.
    PRE-REGISTRATION ORDER AND CONFIRMATORY STANDING ARE DIFFERENT PROPERTIES
    AND THIS CONTRACT HAS THE FIRST AND NOT THE SECOND. Order is a property of
    COMMIT ORDER: no draw of P-REPAIRED exists at the moment this file is
    committed, and a third party can check that against Git. Standing is a
    property of PROTOCOL STABILITY over data the protocol has not seen. The two
    are not interchangeable and no downstream record may upgrade one into the
    other.

  criteria_definitions:
    denominator_reading_RC_E: >-
      PRE-REGISTERED EXPLICITLY, BEFORE DATA, AND NOT INHERITED FROM THE DEV-4
      AMBIGUITY. On the BATCH-011 package the choice of denominator moved the
      INV-4 firing count from 4 of 49 to 22 of 49, so it is the single most
      easily fudged quantity in this design.
      THE PRIMARY CRITERION IS EVALUATED UNDER DEV-4's STANDARD-ERROR-OF-THE-MEAN
      READING: the denominator is sem_rep = s_rep/sqrt(n_rep).
      THE SECONDARY CRITERION IS EVALUATED UNDER THE LITERAL
      SINGLE-REPLICATE-STANDARD-DEVIATION READING: the denominator is s_rep.
      BOTH ARE REPORTED AT EVERY ONE OF THE 48 TUPLES, AND THE PREDICTION
      REQUIRES A PASS UNDER BOTH.
      s_rep is the SAMPLE standard deviation with denominator n_rep - 1, stated
      because n_rep versus n_rep - 1 is itself a silent-choice hazard.
    replicate_schedule_fixed_to_C_14: >-
      FIXED TO THE AMENDED EXP-YIELD-001 CLAUSE C-14 SCHEDULE AND NOT RAISED:
      100 replicates where C_red is at most 10^4; 30 replicates where C_red is
      above 10^4 and at most 10^6; 10 replicates where C_red exceeds 10^6.
      REALISED ON THE DECLARED SET: 37 tuples at 100 replicates and 11 tuples at
      30 replicates. THE 10-REPLICATE TIER IS UNREACHABLE HERE, because the
      largest C_red among the 48 declared tuples is 91922 at T-18-3-B82; the
      tier is nonetheless stated so the schedule is quoted whole rather than
      truncated to the reachable part.
    why_the_replicate_count_is_not_raised: >-
      STATED IN THE CONTRACT BECAUSE IT IS A REAL TEMPTATION AND A REAL HAZARD.
      RAISING THE REPLICATE COUNT TIGHTENS THE STANDARD ERROR OF THE MEAN BY A
      FACTOR OF ORDER SQRT(COUNT) AND COULD FIRE THE PRIMARY CRITERION ON A
      KNOWN SECOND-ORDER TERM RATHER THAN ON A MEASUREMENT FAULT. Two such known
      second-order terms are already declared above before data: the positive
      process bias f(lambda), at most 0.0895 standard errors at the fixed
      counts, and the identity-bin convention difference, at most 0.0895
      standard errors at the fixed counts. At ten times the replicate count both
      would sit near 0.28 standard errors and at a hundred times near 0.9,
      approaching the threshold without any measurement fault existing. Holding
      the count at C-14's schedule ALSO keeps the standard-error-of-the-mean
      reading here EXACTLY the reading DEC-20260729-001 names, so the recorded
      corrected-residual scale - maximum absolute value 2.93 standard errors of
      the mean at one cell - remains the relevant one.
    high_precision_block_feeds_nothing: >-
      The high-precision diagnostic block at 10000 replicates is REQUIRED and is
      REQUIRED TO BE LABELLED AS FEEDING NO CRITERION, NO THRESHOLD, NO
      INVALIDATION RULE AND NO VERDICT. It exists precisely because the criteria
      may not be evaluated at that precision.
    no_unquantified_comparative_word_RC_D: >-
      EVERY THRESHOLD IN THIS CONTRACT IS NUMERIC BEFORE DATA. The words
      `shrink`, `closer`, `consistent with`, `essentially`, `comparable`,
      `substantially`, `approximately` and `about` ARE FORBIDDEN AS CRITERION
      LANGUAGE and appear in no criterion, no invalidation rule and no outcome
      branch of this contract. Where such a word appears in a narrative or
      basis block it is accompanied by the number it summarises and it binds
      nothing. This is the defect that left INV-5 unadjudicable in BATCH-011 and
      it is not repeated.
    set_identity_not_cardinality_PRED_ID: >-
      D-2 PROPHYLAXIS, BINDING ON EVERY COMPARISON IN THIS CONTRACT AND ON EVERY
      RECORD DERIVED FROM IT. Every pre-registered per-tuple expectation here is
      recorded as a NAMED, ENUMERATED TUPLE LIST, and any comparison of a
      realised outcome against a pre-registered expectation is evaluated on SET
      IDENTITY - which tuples - and NEVER on CARDINALITY - how many. A realised
      set whose COUNT matches a predicted count while its MEMBERS differ is
      recorded as a FAILED PREDICTION and never as a successful one. This rule
      exists because in BATCH-011 pre-registered condition PC-2 predicted eleven
      class flips and eleven occurred, but only five were the same cells, so THE
      COUNT AGREEMENT WAS COINCIDENTAL; that coincidence must not be cited
      anywhere in BATCH-012 as a successful prediction, and this rule makes the
      same mistake structurally impossible here. Every criterion evaluation in
      the run records reports the realised firing set, the pre-registered set,
      and the three quantities |realised AND pre-registered|, |realised MINUS
      pre-registered| and |pre-registered MINUS realised|, by tuple label.

  success_criterion: >-
    P-CORE. The pre-registered prediction is MET if and only if ALL FOUR of the
    following hold on the 48 declared tuples.
    CR-1, PRIMARY, STANDARD-ERROR-OF-THE-MEAN READING. At EVERY one of the 48
    declared tuples, |z_sem| = |mu_rep - P_pred|/sem_rep is STRICTLY LESS THAN
    3.000.
    CR-2, SECONDARY, SINGLE-REPLICATE-STANDARD-DEVIATION READING. At EVERY one
    of the 48 declared tuples, |z_sd| = |mu_rep - P_pred|/s_rep is STRICTLY LESS
    THAN 3.000.
    CR-3, THE PRE-REGISTERED UPWARD SHIFT. At EVERY one of the 48 declared
    tuples, |z_shift| = |(mu_rep - mu_001) - T|/sqrt(sem_rep^2 + sem_001^2) is
    STRICTLY LESS THAN 3.000, where mu_001 and sem_001 are QUOTED from IN-1 at
    the tuple's binding committed reference and T = |S_(m-2)| exp(-C_red/N) is
    DETERMINED. This is the numeric form of NA-1's own clause that the mean is
    shifted UP by |S_(m-2)| exp(-C_red/N), and it is part of the prediction
    rather than an addition to it.
    CR-4, AGGREGATE SIGN. Let n_neg be the number of the 48 declared tuples at
    which (mu_rep - P_pred) is strictly negative. CR-4 HOLDS if and only if
    n_neg is at least 14 AND at most 34. Equivalently CR-4 FIRES if n_neg is at
    least 35 or at most 13.
    P-CORE MET MEANS EXACTLY THIS AND NOTHING MORE: the occupancy null with the
    pre-marking restored recovers the unchanged P_pred at all 48 declared
    parameter tuples of the committed BATCH-011 package, under both denominator
    readings, with the predicted upward shift, and without an aggregate sign
    anomaly. It establishes that CTRL-NULL-SUMSET as frozen in EXP-YIELD-001 v1
    and as re-specified by amendment C-4 WAS MIS-CONSTRUCTED, and EV-ECDLP-008
    observation O-4 is thereby CONFIRMED BY MEASUREMENT for the first time. IT
    ESTABLISHES NOTHING ABOUT DECOMPOSITION YIELD IN EITHER DIRECTION, at any
    scale. It does not un-fire INV-4, does not re-dispose it, computes no E and
    no yield ratio, declares INV-5 neither way, moves no hypothesis, meets no
    completion criterion of GOAL-ECDLP-001, and yields NO COST-MODEL CONSEQUENCE
    WHATEVER, the counterfactual branch being O-6 and not O-4.
  falsification_criterion: >-
    P-MISS. The pre-registered prediction is MISSED if any of CR-1, CR-2, CR-3
    fails at any declared tuple, or if CR-4 fires. A MISS IS ADMISSIBLE, IS NOT
    A BATCH FAILURE, AND MUST NOT BE EXPLAINED AWAY. The miss is split, BEFORE
    DATA, into two disjoint and exhaustive branches, and the split changes no
    threshold and creates no route by which a miss is reported as a pass.
    MISS-STRUCTURED. Any one of - CR-1 fails at 2 or more of the 48 tuples; or
    CR-1 fails at any tuple with |z_sem| at least 10.000; or CR-2 fails at 1 or
    more tuples; or CR-3 fails at 2 or more tuples; or CR-3 fails at any tuple
    with |z_shift| at least 10.000; or CR-4 fires.
    DISPOSITION OF MISS-STRUCTURED, PRE-REGISTERED: the diagnostic is wrong, the
    BATCH-011 VOID reflects a MEASUREMENT FAULT rather than a null-construction
    fault, EV-ECDLP-008 OBSERVATION O-4 IS SUPERSEDED - under a new record, never
    edited in place - and the located-and-repairable-instrument-fault half of
    DEC-20260729-001's ruling is wrong. THE VOID ITSELF STILL STANDS and INV-4
    is still not re-disposed; what changes is which of the two live explanations
    the archive supports. No cost model is re-charged, no hypothesis moves, no E
    is computed, and no statement about decomposition yield follows in either
    direction.
    MISS-MARGINAL. Exactly one tuple fails CR-1 with 3.000 at most |z_sem| less
    than 10.000, and or exactly one tuple fails CR-3 with 3.000 at most
    |z_shift| less than 10.000, with CR-2 not firing at any tuple and CR-4 not
    firing.
    DISPOSITION OF MISS-MARGINAL, PRE-REGISTERED: THE PREDICTION IS NOT MET. It
    is recorded as a MISS and never as a pass, never as `consistent with the
    prediction` and never as a confirmation. EV-ECDLP-008 observation O-4 is
    NEITHER CONFIRMED NOR SUPERSEDED by this run, the discrimination between the
    two live explanations REMAINS UNDISCHARGED, and DEC-20260729-002's
    disposition on the instrument question is `inconclusive`. The declared
    pre-data chance-alarm budget recorded in the criterion feasibility table -
    an expected 0.377 chance exceedances across all criteria under a perfectly
    centred null, hence a probability of at most 0.377 that at least one occurs
    - is on the record BEFORE the numbers exist, precisely so that it is a
    pre-registered reading and not a post-hoc excuse. The NAMED successor for
    this branch is a replication at a higher replicate count under a recorded
    versioned protocol_amendment, WHICH BATCH-012 DOES NOT PERFORM AND DOES NOT
    AUTHORIZE.
    NO OTHER BRANCH EXISTS. Any realised outcome falls in exactly one of P-CORE,
    MISS-STRUCTURED and MISS-MARGINAL, because the three are defined by disjoint
    conditions on the same four criteria and their union is total.

  criteria_feasibility_summary:
    table_ref: >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-012/tasks/TASK-20260729-014/criterion_feasibility_table.md
      - MANDATORY READING FOR TASK-20260729-016 AND FOR ANY READER OF A RESULT.
      Every criterion and every invalidation rule in this contract is evaluated
      there with the arithmetic shown at the exact 48 tuples that will run, and
      each is marked CAN FIRE or CANNOT FIRE, including under the counterfactual
      in which the diagnostic is wrong and the repaired null still falls short
      by the full |S_(m-2)| exp(-lambda) term (DEFER-BATCH009-003).
    headline_findings_of_the_table: >-
      RECORDED HERE SO THE CONTRACT DOES NOT HIDE ITS OWN WEAKNESSES BEHIND A
      REFERENCE.
      CR-1 CAN FIRE, and under the full counterfactual it fires at 21 OF THE 48
      DECLARED TUPLES, named individually in table section 6.
      CR-2 CAN FIRE, and under the full counterfactual it fires at only 4 OF THE
      48, which are exactly the four INV-4-failing tuples. CR-2 has ESSENTIALLY
      NO POWER and ESSENTIALLY NO CHANCE-ALARM RISK - its chance-alarm
      probability per tuple is below 1e-20 - and it is retained because RC-E
      requires both readings to be reported and both to pass, not because it
      discriminates.
      CR-3 CAN FIRE, and under the full counterfactual, projected on the
      committed standard deviations, it fires at 18 OF THE 48.
      CR-4 CAN FIRE, and under the full counterfactual it fires WITH CERTAINTY,
      because every one of the 48 tuples would be short and n_neg would be 48,
      which is at least 35.
      THE DEFECT THE TABLE FINDS AND THE REPAIR MADE BEFORE THE FREEZE: at 27 OF
      THE 48 TUPLES, NEITHER CR-1 NOR CR-2 CAN FIRE EVEN UNDER THE FULL
      COUNTERFACTUAL, because at those tuples the omitted term T is smaller than
      3 standard errors of the mean at the fixed replicate count. Those 27
      tuples are NAMED INDIVIDUALLY in table section 7. They are NOT REMOVED,
      because RC-C binds the declared set to the whole de-duplicated
      criterion-evaluable set and removing them would narrow a control whose
      value is completeness; and they contribute to the chance-alarm budget
      while contributing zero counterfactual per-tuple power, which is a
      declared cost. THE REPLACEMENT REQUIRED BY DEFER-BATCH009-003 IS CR-4,
      WHICH WAS ADDED BEFORE THE FREEZE FOR EXACTLY THIS REASON: it draws its
      power from the SIGN at all 48 tuples including those 27, and it fires with
      certainty under the counterfactual. No per-tuple criterion can have power
      at those 27 tuples at the fixed replicate count, which is an information
      limit and not a drafting choice, and the only escape - more replicates -
      is forbidden by RC-E and is declared unavailable rather than quietly taken.

  invalidation_rules:
    - >-
      IV-1 COMPARABILITY OF THE AS-RECORDED ARM. At every declared tuple compute
      z_comp = (mu_asrec - mu_001)/sqrt(sem_asrec^2 + sem_001^2) and
      ln_r_sd = ln(s_asrec/s_001), with mu_001 and s_001 QUOTED from IN-1 at the
      tuple's binding committed reference and sem_001 = s_001/sqrt(n_rep).
      IV-1a FIRES if |z_comp| is at least 3.000 at MORE THAN 2 of the 48 tuples.
      IV-1b FIRES if |ln_r_sd| is at least 3.000/sqrt(n_rep - 1) at MORE THAN 2
      of the 48 tuples, which is 0.30151 at the 37 tuples with 100 replicates
      and 0.55709 at the 11 tuples with 30 replicates.
      CONSEQUENCE IF EITHER FIRES: this batch's re-implementation does not
      reproduce the committed antipodal arm, so THE REPAIRED ARM'S COMPARISON TO
      THE RECORDED PACKAGE IS VOID RATHER THAN NEGATIVE. CR-3 and IV-1 are then
      not evaluated, CR-1, CR-2 and CR-4 are reported but carry no comparison to
      BATCH-011, no branch of the outcome structure above is read, and the batch
      disposition on the instrument question is `inconclusive`. A VOID HERE IS
      THE ABSENCE OF A MEASUREMENT AND IS NEVER A NEGATIVE MATHEMATICAL RESULT
      ABOUT P_pred, ABOUT THE DIAGNOSTIC OR ABOUT ANYTHING ELSE.
    - >-
      IV-2 SIMULATOR KNOWN-ANSWER DEFECT. Every case below is run in
      RUN-YIELD-002-KNOWNANSWER with the stated exact target and the stated
      numeric tolerance. A MISMATCH BEYOND TOLERANCE AT ANY CASE FIRES IV-2 AND
      THE ENTIRE RUN SET IS INVALID and is never evidence about P_pred, about
      the diagnostic or about anything else.
      KA-1 ZERO THROWS. N = 11, s = 3, C_red = 0, 1000 replicates. Exact target
      distinct = 3 in EVERY replicate. TOLERANCE ZERO - any replicate returning
      a value other than 3 fires IV-2.
      KA-2 FULL PRE-MARKING. N = 11, s = 11, C_red = 8, 1000 replicates. Exact
      target distinct = 11 in EVERY replicate. TOLERANCE ZERO.
      KA-3 EXACT EXPECTATION. N = 11, s = 3, C_red = 8, hence C_red/2 = 4
      throws, 10^6 replicates. Exact target computed by the driver from the
      closed form E = N - (1 - s/N)[(N-1)(1 - 2/N)^(C_red/2) + (1 - 1/N)^(C_red/2)],
      which at these values is 11 - (8/11)[10 (9/11)^4 + (10/11)^4] =
      11 - (8/11)(10 x 6561/14641 + 10000/14641) = 11 - 3.756079 = 7.243921 to
      six decimal places. TOLERANCE: the empirical mean must satisfy
      |mean - target| at most 4.000 times (empirical sd)/sqrt(10^6). The driver
      records the target to full double precision from the closed form and does
      not hard-code the decimal above.
      KA-4 PRE-MARKING UNIFORMITY. N = 11, s = 3, C_red = 0, 10^6 pre-markings.
      For EACH of the 11 bins the empirical marginal frequency must satisfy
      |frequency - 3/11| at most 4.000 times sqrt((3/11)(8/11)/10^6) =
      0.00178145, i.e. each of the 11 frequencies must lie in
      [0.27095, 0.27451].
      KA-5 PRE-MARKING WITHOUT REPLACEMENT AND COUNTED ONCE. In the same 10^6
      pre-markings of KA-4 the number of distinct marked bins must equal 3 in
      EVERY pre-marking. TOLERANCE ZERO.
      KA-6 IDENTITY-BIN ACCOUNTING. N = 11, s = 0, C_red = 2, hence one throw,
      10^6 replicates. The distinct count must be 1 whenever g = 0 and 2
      otherwise, in EVERY replicate, TOLERANCE ZERO on that implication; and the
      empirical frequency of distinct = 1 must satisfy |frequency - 1/11| at
      most 4.000 times sqrt((1/11)(10/11)/10^6) = 0.00114993, i.e. it must lie
      in [0.08976, 0.09206].
      KA-7 ANTIPODAL PAIRING. In the same 10^6 replicates of KA-6 the marked bin
      set must equal exactly {g, (11 - g) mod 11} in EVERY replicate. TOLERANCE
      ZERO.
      KA-8 P_pred REPRODUCTION AGAINST THE COMMITTED PACKAGE. At the four
      INV-4-failing tuples, recompute P_pred = N(1 - exp(-C_red/N)) +
      |S_(m-2)| exp(-C_red/N) by exact double-precision arithmetic from the
      QUOTED N, C_red and |S_(m-2)|, and require agreement with the QUOTED
      P_pred to |difference| at most 1e-9 absolute at all four. This case is
      DETERMINED, not SAMPLED, and consumes no random number.
    - >-
      IV-3 INFRASTRUCTURE. A timeout, crash, resource exhaustion, budget
      cancellation or implementation failure is recorded with its terminal
      status in the manifest and IS INFRASTRUCTURE SIGNAL. IT IS NEVER A
      NEGATIVE MATHEMATICAL RESULT about P_pred, about the diagnostic, about the
      occupancy null, about decomposition yield or about anything else, and it
      is never recorded as a result. NON-EXECUTION IS NEVER RECORDED AS A
      RESULT.
    - >-
      IV-4 INPUT INTEGRITY. The SHA-256 of IN-1 or IN-2 as read differs from the
      value pinned in inputs.files_read; or IN-1's cells array does not carry
      exactly 49 entries; or IN-2 does not report n_evaluable_on_measured_B = 49;
      or de-duplication on measured B within (k, m) columns does not yield
      exactly 48 tuples; or any declared tuple reports an odd C_red; or the
      driver's independently recomputed lambda, exp(-lambda), T or P_pred
      differs from the QUOTED value by more than 1e-9 absolute at any tuple.
      CONSEQUENCE: the run STOPS AND REPORTS immediately, performs no further
      throw, writes all three artifact files with the terminal status recorded,
      and IS NOT EVIDENCE. An input that is not hash-bound is not an input, and
      an input whose hash does not match is not the input this contract names.
    - >-
      IV-5 INCOMPLETE COVERAGE. Any arm that does not measure all 48 declared
      tuples names EVERY tuple it did not reach, by tuple label, with the
      reason, in results.json and in the manifest. A PARTIAL RESULT WITH A NAMED
      GAP IS A RESULT; A SILENTLY TRUNCATED ONE IS NOT. No unreached tuple may
      be reported as measured, no estimate may be substituted for a measurement
      that did not happen, and no criterion may be evaluated as if the missing
      tuples had passed. If any of CR-1, CR-2, CR-3 cannot be evaluated at all
      48 tuples, P-CORE is NOT MET and the disposition is `inconclusive` on the
      instrument question rather than a miss.
    - >-
      IV-6 SCOPE BREACH. The driver imports or invokes any forbidden module, or
      computes any elliptic-curve operation, or computes or reports any
      occupancy-normalised efficiency E or yield ratio R, or reads any file
      under experiments/EXP-YIELD-001 other than IN-1 and IN-2, or writes any
      file outside the eleven required artifacts. THE RUN IS INVALID and the
      Executor STOPS AND REPORTS rather than repairing the protocol in flight.

  stopping_rules:
    - >-
      ST-1 PER-RUN CAP. 600 seconds and 4 GB per run. On approaching the cap the
      run STOPS and names EXPLICITLY every declared tuple not reached, with the
      reason, under IV-5.
    - >-
      ST-2 ARM ORDER. The arms execute in the declared order
      RUN-YIELD-002-KNOWNANSWER, RUN-YIELD-002-NULL-ASRECORDED,
      RUN-YIELD-002-NULL-REPAIRED, so that a simulator defect is caught before
      any criterion quantity is produced. Within an arm, tuples execute in the
      order they appear in IN-1's cells array, and the high-precision diagnostic
      block executes LAST inside RUN-YIELD-002-NULL-REPAIRED so that a cap bind
      costs the block that feeds nothing before it costs a criterion quantity.
    - >-
      ST-3 STOP AND REPORT ON AMBIGUITY. If this contract cannot be executed as
      written - in particular if any quantity this contract says is QUOTED from
      IN-1 cannot be located there unambiguously, or if any process clause
      requires a curve operation - the Executor STOPS AND REPORTS and does NOT
      repair the protocol in flight. Any deviation, however small, is recorded
      in the manifest as a declared protocol deviation and reported; it is never
      applied silently.
    - >-
      ST-4 NO INTERPRETATION. The run package contains OBSERVATIONS AND
      PRE-REGISTERED CRITERION EVALUATIONS ONLY. It must not state which of
      P-CORE, MISS-STRUCTURED or MISS-MARGINAL obtained as a finding, must not
      write an evidence or decision record, must not touch any hypothesis
      status, must not re-dispose INV-4, must not adjudicate INV-5, and must not
      say anything about decomposition yield. Interpretation belongs to
      TASK-20260729-020, TASK-20260729-021 and DEC-20260729-002.
    - >-
      ST-5 NO POST-HOC PROTOCOL CHANGE. No threshold, replicate count, seed,
      tuple set, denominator reading, tolerance or criterion in this contract
      may be changed after any number produced under it is visible, except by a
      versioned protocol_amendment recorded BEFORE the change and independently
      re-reviewed. Under the BATCH-012 execution gate RC-12 at most one such
      cycle is permitted and only if TASK-20260729-016 returns REVISE.

  matched_baseline_position_RC7:
    status: DECLARED INAPPLICABLE
    reason: >-
      DECLARED INAPPLICABLE WITH THE REASON, RATHER THAN SKIPPED OR SATISFIED BY
      A FABRICATED FIGURE. RC-7 requires a matched-baseline position in TIME and
      MEMORY inside the contract. EXP-YIELD-002 SOLVES NO INSTANCE, RECOVERS NO
      DISCRETE LOGARITHM, COMPUTES NO RELATION AND TOUCHES NO CURVE: it is a
      balls-in-bins simulation of a control object over an integer residue
      range. There is no algorithmic task against which Pollard rho or
      baby-step giant-step could be a matched baseline, so no such baseline is
      quoted and quoting one would be decoration. No specialized baseline is
      named either, for the same reason.
    what_stands_unretracted_and_is_not_restated_as_a_result_of_this_batch: >-
      The BATCH-011 cost position stands unretracted at EV-ECDLP-008 observation
      O-11 - the census cost 28,384 to 2,604,442 times a measured Pollard-rho
      solve of the same instance, in a single declared operation unit - and is
      NOT restated as a result of BATCH-012 and is not re-derived here. This
      contract produces no operation-count comparison of any kind.

  scale_relevance:
    tier: toy
    justification: >-
      THE PARAMETERS ARE QUOTED FROM A TOY-TIER PACKAGE AND NOTHING HERE RAISES
      THE TIER. Four toy prime fields at 12, 14, 16 and 18 field bits, with the
      group orders 4001, 16619, 65633 and 261707 quoted from IN-1; one
      prime-order curve per size in the source package, chosen by a
      deterministic rule; x-interval factor bases anchored at 0 on the frozen
      17-point beta grid; m in {2, 3}; unweighted decomposition with
      coefficients in {+1, -1}; one implementation, one budget, one platform;
      and a SINGLE UNREPLICATED SOURCE RUN SET, four field sizes on one curve
      each, which is a SIZE SERIES AND NOT A REPLICATION. NOTHING MEASURED HERE
      IS EVIDENCE ABOUT CRYPTOGRAPHIC-SIZE CURVES IN EITHER DIRECTION, and no
      correspondence, isometry or transport argument to scale is offered or
      available.
    what_this_experiment_is_scoped_to: >-
      EVERY SENTENCE OF EVERY CONCLUSION DRAWN FROM THIS EXPERIMENT IS SCOPED TO
      the 48 declared parameter tuples; to the four tested field sizes k in
      {12, 14, 16, 18} and their quoted group orders; to the frozen beta grid
      0.200 to 0.600 in steps of 0.025 as realised in the source package; to
      arities m in {2, 3}; to the x-interval factor-base convention with B
      measured and not modelled; to the one prime-order curve per size of the
      source package; to this simulator, this budget and this platform; and to
      the occupancy CONTROL OBJECT alone rather than to any measured
      decomposition quantity.
    correspondence: >-
      null - direct simulation of a declared analytic process. No correspondence
      argument of any kind is used and none is available.
  tail_checks:
    - >-
      The distribution of z_sem across the 48 declared tuples, reported against
      the standard normal, as an OBSERVATION. It is NOT a criterion and fires
      nothing. It is reported because a systematic small shift across many
      tuples is the signature CR-4 is written for, and a reader is entitled to
      see the shape rather than only the count.
    - >-
      The largest |z_sem| and the largest |z_shift| over the 48 tuples, reported
      with the tuple label, as OBSERVATIONS. Neither is a criterion.
    - >-
      The measured ratio s_rep/s_asrec per tuple, reported beside the value 1,
      as an OBSERVATION on whether the pre-marking perturbs the spread. It is
      NOT a criterion and fires nothing.
  independence_note_for_the_tail_checks_and_for_CR_4: >-
    RECORDED BECAUSE OB-9 FORBIDS REPEATING BATCH-011'S ERROR AND BECAUSE THE
    SITUATION HERE IS GENUINELY DIFFERENT. OB-9 records that the BATCH-011
    cells are NOT independent, because the 17 beta cells in a (k, m) column
    are nested intervals on one curve so the MEASURED QUANTITIES B, C_red, h
    and S_m are strongly correlated down each column. THAT NON-INDEPENDENCE IS
    NOT RETRACTED AND IS NOT REPAIRED HERE. It does not apply to CR-4, and the
    reason is precise: in EXP-YIELD-002 those measured quantities are FIXED
    CONSTANTS QUOTED FROM A COMMITTED FILE and carry no randomness at all. The
    only randomness in this experiment is the per-tuple Monte Carlo stream,
    and the seed derivation below makes those streams independent across
    tuples BY CONSTRUCTION. CR-4's binomial reference is therefore licensed
    here in a way no fraction in BATCH-011 was. Two residuals are declared:
    first, the known positive process bias f(lambda) is shared across tuples
    and shifts the per-tuple sign probability from 0.500 down to between 0.472
    and 0.500, which makes CR-4 CONSERVATIVE in the negative direction that
    the counterfactual would produce and is therefore not a hazard for the
    miss branch; second, CR-4's thresholds are evaluated at the conservative
    end p = 0.500 rather than at the biased value, and that choice is recorded
    here before data. NO POWER OR FALSE-DISCOVERY STATEMENT IS COMPUTED ON THE
    BATCH-011 EVALUABLE-CELL COUNT ANYWHERE IN THIS CONTRACT.

  replication:
    seeds:
      - 'RUN-YIELD-002-KNOWNANSWER - master seed 120401'
      - 'RUN-YIELD-002-NULL-ASRECORDED - master seed 120301'
      - 'RUN-YIELD-002-NULL-REPAIRED - master seed 120201'
      - 'RUN-YIELD-002-NULL-REPAIRED high-precision diagnostic block - master seed 120501'
    seed_block_note: >-
      The four master seeds are chosen in a block disjoint from the BATCH-011
      master seeds 110201, 110301, 110401, 110501, 110601 and 110701, so that no
      stream of this experiment can coincide with a stream of the source
      package.
    seed_derivation_binding: >-
      FULLY SPECIFIED SO THAT NOTHING IS LEFT TO THE EXECUTOR'S JUDGEMENT AND SO
      THAT EVERY NUMBER IS REPRODUCIBLE FROM THIS CONTRACT. For a tuple the
      per-tuple seed is the LOW 64 BITS, interpreted as an unsigned
      little-endian integer, of the SHA-256 digest of the ASCII string formed by
      joining with the single character `|` and nothing else, in this exact
      order and with no whitespace - the decimal master seed, the arm label, the
      decimal k, the decimal round(beta x 1000), the decimal m, the decimal B,
      the decimal C_red. The arm labels are exactly `REPAIRED`, `ASRECORDED`,
      `KNOWNANSWER` and `HIGHPREC`. round(beta x 1000) is used rather than beta
      so that no floating-point formatting choice can change a seed. That
      integer seeds one numpy.random.default_rng generator per tuple per arm,
      and every replicate at that tuple consumes that one generator
      SEQUENTIALLY without re-seeding, with the pre-marking draw taken BEFORE
      the throwing draws within each replicate. The derived per-tuple seed is
      recorded in results.json beside every number it produced.
    stream_independence_declaration: >-
      THE REPAIRED AND AS-RECORDED ARMS USE INDEPENDENT STREAMS, because their
      arm labels differ and therefore their per-tuple seeds differ. Common
      random numbers are NOT used. CR-3's denominator sqrt(sem_rep^2 + sem_001^2)
      and IV-1's denominator sqrt(sem_asrec^2 + sem_001^2) assume independence
      between the arms being differenced, and the seed derivation is what makes
      that assumption true rather than assumed.
    merged_tuple_seed_note: >-
      The merged tuple T-12-3-B22 is seeded from its binding committed
      reference, the beta = 0.325 entry, so round(beta x 1000) = 325 in its seed
      string. It is drawn ONCE, not twice, which is what de-duplication means.
    independent_instances: 48
    replication_honesty_note: >-
      48 PARAMETER TUPLES ARE NOT 48 REPLICATIONS OF A RESULT. They are 48
      parameter points of one simulation of one analytic process, drawn on one
      platform under one implementation in one batch, all of whose inputs come
      from a SINGLE UNREPLICATED SOURCE RUN SET of four field sizes on one curve
      each. THIS IS A SINGLE UNREPLICATED RUN SET IN ITS OWN RIGHT. No strength
      above `preliminary` may be claimed from it without an independent
      replication on a different platform and interpreter, and `reject_scoped`
      on it is FORBIDDEN by agents/coordinator.md - the correct pair, if the
      evidence points that way, is `weaken` plus a NAMED replication.

  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 4
    maximum_runs: 3
    budget_feasibility_note: >-
      Derived in section 10 of the criterion feasibility table. The dominant cost
      is not the random draws but the clearing of one N-length boolean array per
      replicate. Across the two 48-tuple arms the total is below 1.5 x 10^9
      byte-clears and below 2 x 10^7 random draws; the high-precision diagnostic
      block at 10000 replicates over four tuples adds below 1.8 x 10^10
      byte-clears; the known-answer arm operates at N = 11 and is negligible.
      Peak memory is one boolean array of length at most 261707, i.e. below 0.3
      MB, plus the parsed IN-1 document, so the 4 GB cap is not approached and
      the binding cost of this experiment is IMPLEMENTATION TIME, NOT COMPUTE.
      A run that cannot finish inside its cap STOPS AND REPORTS a bounded
      partial result naming exactly which tuples it did not reach, under IV-5;
      it must not overrun silently and must not compress by fabricating a figure
      or a verdict.

