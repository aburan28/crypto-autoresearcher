      (2) DEC-20260729-002, as a formal experiment_status_transition block.
    this_file_is_never_edited: >-
      experiments/EXP-YIELD-002/specification.yaml is frozen at
      `review_required` with `approved_by: null` and IS NEVER EDITED AFTER
