      and is MANDATORY READING for the reviewer and for any reader of a result.
    split_by_arity: '29 tuples at m = 2 and 19 tuples at m = 3, totalling 48.'
    the_four_INV_4_failing_tuples_named_and_reported_separately:
      - 'T-18-3-B16 - k = 18, beta = 0.200, m = 3, N = 261707, B = 16, C_red = 688, committed z single-sd -12.439358544355992'
