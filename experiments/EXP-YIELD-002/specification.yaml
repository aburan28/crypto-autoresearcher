experiment:
  id: EXP-YIELD-002
  hypothesis_id: null
  hypothesis_id_note: >-
    NULL AND DELIBERATELY SO. EXP-YIELD-002 TESTS NO HYPOTHESIS. It is an
    INSTRUMENT CONTROL ON EXP-YIELD-001'S CONTROL OBJECT CTRL-NULL-SUMSET, and
    the only thing it can establish is whether that control object was correctly
    constructed. H-YIELD-001 is named here ONLY as the hypothesis this
    experiment CANNOT MOVE IN EITHER DIRECTION: it stays at `specified` under
    every outcome of this contract. H-IC-001 and H-STR-002 stay `weakened` with
    DEFER-BATCH009-001's undischarged EXP-STR-004 replication obligation still
    binding H-STR-002's next transition in either direction; H-SUBRES-001 stays
    `weakened`; H-ENDO-001 stays `approved`, which carries no evidential
    standing; H-GGM-001 stays `specified`; H-FCP-001 stays `analyzed`. No
    hypothesis record is read, written, created or cited as moved by this
    contract.
  version: 1
  title: >-
    Curve-free repaired-null re-derivation of the occupancy control
    CTRL-NULL-SUMSET, with the pre-marking restored, at the 48 de-duplicated
    criterion-evaluable parameter tuples of the committed EXP-YIELD-001 v2 run
    package, compared against the unchanged P_pred under both denominator
    readings
  status: review_required
  status_note: >-
    `review_required` AND NOT `approved`, AND THIS FILE WILL NEVER SAY
    OTHERWISE. This contract is frozen by TASK-20260729-014, snapshot-committed
    by TASK-20260729-015, and receives an INDEPENDENT NON-ORIGINATING
    PRE-EXECUTION REVIEW at TASK-20260729-016 before any compute is spent. NO
    RUN OF THIS CONTRACT IS AUTHORIZED BY ITS EXISTENCE. The contract in force
    at execution is the COMMITTED BLOB at the TASK-20260729-015 commit, not the
    working-tree file.

  approval_determination_location:
    why_this_block_exists: >-
      STRUCTURAL PROPHYLAXIS AGAINST CARRIED DEFECT D-1, WHICH THIS PROGRAM
      CANNOT REPAIR AND MUST NOT REPEAT. experiments/EXP-YIELD-001/
