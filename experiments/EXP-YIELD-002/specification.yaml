    the_route_declared_in_advance: >-
      THE APPROVAL DETERMINATION FOR EXP-YIELD-002 IS NOT A FIELD IN THIS FILE
      AND MUST NOT BE SOUGHT HERE. It is recorded in TWO separate, appendable,
      hash-bound artifacts, the first of which is PRE-EXECUTION:
      (1) the TASK-20260729-017 snapshot_commit_receipt.json, which records the
