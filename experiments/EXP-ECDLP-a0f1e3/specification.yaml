# EXP-ECDLP-a0f1e3
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-f988ed.
experiment:
  id: EXP-ECDLP-a0f1e3
  hypothesis_id: H-ECDLP-a39b27
  source_idea: IDEA-20261004-5b2086
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-19 table versus width-18 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-f988ed
  objective: >-
    Check the table sizes 262144 and 131072, the product 34359738368, and the nearby gap 0.
  inputs:
    width_hi: 19
    width_lo: 18
    table_hi: 262144
    table_lo: 131072
    table_gap: 131072
    table_product: 34359738368
    table_sum: 393216
    nearby_a: 131072
    nearby_b: 131072
    nearby_gap: 0
    nearby_product: 17179869184
  controls:
    - >-
      Two to the power 18 is 262144. Two to the power 17 is 131072.
      Reporting both tables as size 131072 drops the gap and invalidates
      the run.
    - >-
      Two hundred sixty-two thousand one hundred forty-four exceeds
      one hundred thirty-one thousand seventy-two by 131072. The product
      of the two sizes is 34359738368. Their sum is 393216.
    - >-
      Two width-18 tables each store 131072. Their gap is 0 and their
      product is 17179869184.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-19 table stores 262144 entries. The width-18 table stores
      131072. The gap of two width-18 tables is 0.
    formula: >-
      Compute 2 to the power 18. Compute 2 to the power 17. Subtract
      131072 from 262144. Multiply 262144 by 131072. Subtract 131072 from 131072.
    source: >-
      IDEA-20261004-5b2086 states the widths 19 and 18 and the sizes
      262144 and 131072, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 34359738368 and the nearby gap 0 are required. A check that stops at the size 262144 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 262144 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 18 is not 262144.
    - Two to the power 17 is not 131072.
    - The gap is not 131072.
    - The product is not 34359738368.
    - Both tables are reported as size 131072, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-19 table stores 262144 entries, that
    the width-18 table stores 131072, and that 262144 exceeds 131072 by 131072.
  falsification_criterion: >-
    The runs agree that the width-19 table size is computed, and
    that size is not 262144.
  required_artifacts:
    - experiments/EXP-ECDLP-a0f1e3/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-a0f1e3/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-a0f1e3/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-a0f1e3/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-a0f1e3/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-a0f1e3/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 131072 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
