experiment:
  id: EXP-ECDLP-7dba4b
  hypothesis_id: H-ECDLP-4d21c2
  source_proposal: IDEA-20260815-284aff
  derived_from_idea: IDEA-20260815-284aff
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Does multi-target amortization survive being charged for its own table --
    shared-table batch rho at M equal to 1, 4, 16 and 64 on one 24-bit subgroup,
    with two forced nulls, the uncharged sqrt(M) factor as an instrument check,
    and the charged per-target cost reported as a CURVE over storage-to-compute
    exchange rates rather than at one privileged rate

  objective: >-
    The uncertainty a run reduces is whether the classical sqrt(M) multi-target
    gain is still a gain once the shared distinguished-point table is paid for.
    A run establishes, at one 24-bit prime-order subgroup and batch sizes 1, 4,
    16 and 64 and only there: (i) that batch size one reproduces the
    single-target baseline and that M non-sharing solves cost M times it, the
    two forced nulls failing in opposite directions; (ii) that the uncharged
    realised factor is about sqrt(M), which is a known-answer instrument check
    and not a finding; (iii) peak table entries, table bytes and peak resident
    memory per batch size; (iv) the CHARGED per-target cost as a function of M
    at each of a declared ladder of storage-to-computation exchange rates; and
    (v) the crossing rate, the smallest rate at which increasing the batch stops
    paying within the tested range, or an explicit statement that no crossing
    occurs in the ladder.
    NO NEW ALGORITHM IS PROPOSED AND NO ATTACK IS PERFORMED. Every target's
    scalar is drawn and recorded by the harness before the solve.
    BUDGET FLOOR NOTE. wall_clock_seconds_per_run is 3600 and maximum_memory_gb
    is 8, both at or above the template floors. The dominant cost is the
    independent-runs arm at M equal to 64, which is 64 full solves per
    repetition by construction.

  what_this_is_not:
    - >-
      Not an attack. Targets carry scalars the harness generated and knows.
    - >-
      Not an improvement to batch rho, and not a novelty claim about the sqrt(M)
      factor, which is classical and is used here as a known-answer check.
    - >-
      Not a statement about deployed batch sizes or deployed batch-to-group
      ratios. A batch of 64 against a 2^24 group is a ratio no deployment
      exhibits, and no extrapolation to deployed ratios is offered.
    - >-
      Not a single charged number. The charged per-target cost depends on an
      exchange rate that is a choice rather than a measurement, so the result is
      a curve and a crossing rate, never one figure.
    - >-
      Not a re-adjudication of any record in this campaign that charges a
      multi-target effect at sqrt(M). If the charged factor falls short, what
      follows for those records is a Coordinator decision with its own record.
    - >-
      Not approval, freezing, execution authorization, a run, an observed
      output, or evidence. No run has been executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope -- for one 24-bit prime-order subgroup, at batch
      sizes 1, 4, 16 and 64, at the declared theta, table representation and
      charging convention, on the named host: the total and per-target group
      operations of the shared-table and independent arms; the peak table
      entries, table bytes and peak resident memory per batch size; the
      uncharged realised amortization factor against sqrt(M); the charged
      per-target cost curve over the declared exchange-rate ladder; and the
      crossing rate or its absence in that ladder.
      WHAT DOES NOT FOLLOW -- no statement at any other group size, at any batch
      size above 64, at any other batch-to-group ratio, at any exchange rate
      outside the ladder, or about any deployed system; no statement that
      multi-target amortization is or is not worth using generally; and no
      re-reading of any existing record's multi-target accounting.

  inputs:
    procedure: >-
      STAGE 0 (reading; CAN TERMINATE, ZERO COMPUTE). Open
      experiments/EXP-MTGT-d4f8cd/specification.yaml and enumerate its runs.
      Record verbatim whether any COMPLETED run reports the fitted exponent of M
      with peak store size per arm; if one does, REUSE it for the uncharged arm
      rather than re-measuring, and record the reuse. Open
      experiments/EXP-ECDLP-4320a7/specification.yaml and its runs and record
      whether the single-target baseline constant is available for NULL 1; reuse
      it if so. Open KN-TECH-001 and KN-LIT-013 and record verbatim what the
      committed corpus states about the multi-target factor and the
      preprocessing floor. RECORD EXPLICITLY, as a stated limitation of the run,
      that this worktree cannot see unmerged branches, and that a sibling
      hypothesis H-ECDLP-6c52c0 derived from IDEA-20260731-013 is reported to
      exist on an unmerged branch and COULD NOT BE READ; if it has since merged,
      the distinctness check against it must be performed before this
      experiment's results are interpreted.
      STAGE 1 (nulls; nothing downstream runs until both pass). Load the frozen
      24-bit instance from EXP-ECDLP-4320a7. Run NULL 1, the batch harness at M
      equal to 1, against the single-target baseline on the identical target.
      Run NULL 2, M independent solves with the shared table disabled, at M equal
      to 4, 16 and 64. WRITE both verdicts, timestamped, before any amortization
      factor is computed.
      STAGE 2 (the uncharged factor, INSTRUMENT CHECK). Run the shared-table arm
      at M equal to 1, 4, 16 and 64, at least 20 repetitions each, recording
      total group operations, per-target operations and resolution order. Compute
      the uncharged realised factor against sqrt(M) with intervals and check it
      against the plus or minus 15 percent band. If it fails, STOP: no charged
      number is reportable.
      STAGE 3 (the memory). Per batch size record peak table entries, peak table
      bytes, peak resident bytes, the walk length, and the retained-bytes
      integral or its declared approximation. Report the tag test's share of
      total charged cost per batch size.
      STAGE 4 (the charging, and the reason this contract exists). For every
      rate r on the declared ladder, compute charged_total(M, r) and the charged
      per-target cost, and plot it against M. Identify the crossing rate -- the
      smallest r at which the charged per-target cost stops decreasing in M
      within the tested range -- or state that no crossing occurs in the ladder.
      Report the uncharged and charged factors SIDE BY SIDE, which is what the
      parent proposal's validation plan requires.
      STAGE 5 (write-up). Produce the measured-versus-modeled table, the
      optimistic-assumption list with each bias direction, and the time-memory
      statement with its interpolation range. Every table carries peak memory
      beside every operation count.
    instrument: >-
      Batch Pollard rho with one shared distinguished-point table and a per-step
      tag test against all M targets, built on the SAME walk and curve
      arithmetic as EXP-ECDLP-4320a7's single-target harness, so that M equal to
      1 is literally the same algorithm rather than a reimplementation of it.
      An independent-runs mode with sharing disabled by construction, not by a
      flag the walk can ignore. Python 3, with a compiled inner loop recorded if
      one is used. All runs recorded through harness/runner.py. NO network access
      is required and none may be used.
    parameters: >-
      One prime-order subgroup at 24 bits, inherited frozen from
      EXP-ECDLP-4320a7 with its recorded seed. Batch sizes 1, 4, 16, 64. At
      least 20 repetitions per batch size, each with its own recorded seed and
      its own freshly drawn targets. Distinguished-point rate theta frozen before
      Stage 1 and identical across arms and batch sizes. Tag test charged at one
      group operation per target per step in BOTH arms. Uncharged-factor
      acceptance band plus or minus 15 percent around sqrt(M). Exchange-rate
      ladder r spanning at least six orders of magnitude in
      operation-equivalents per retained byte, declared as a fixed list before
      execution. Charging formula and its retained-bytes approximation declared
      in the contract, not chosen at analysis time.

  controls:
    - >-
      NULL 1, BATCH SIZE ONE, BLOCKING, CAN FAIL. The batch harness at M equal
      to 1 must reproduce the single-target baseline on the identical target
      within 2 percent. FORCED. Carried in force from the parent proposal. This
      catches a batch implementation that has silently changed the walk.
    - >-
      NULL 2, NO SHARING, BLOCKING, CAN FAIL. M independent solves with the
      shared table disabled must cost M times the baseline within 10 percent.
      FORCED. Carried verbatim in force from the proposal: 'anything less means
      unintended sharing'. This is the control that matters most, because
      unintended sharing would MANUFACTURE the effect under study, and it fails
      in the opposite direction from NULL 1.
    - >-
      KNOWN-ANSWER INSTRUMENT CHECK, BLOCKING. The uncharged realised factor
      must lie within plus or minus 15 percent of sqrt(M) at M equal to 4, 16
      and 64. A harness that cannot reproduce a classical result cannot be
      trusted to measure a charged one, and no charged number is reportable if
      this fails.
    - >-
      SOLUTION VERIFICATION, BLOCKING. Every resolved target's recovered scalar
      is re-verified against its original instance by an independent code path
      before any timing is admitted. A batch harness that reports a resolution
      it cannot certify is reporting a collision, not a solve.
    - >-
      TAG-TEST ATTRIBUTION CONTROL. The per-step tag test costs M group
      operations and is charged identically in both arms, with its share of
      total charged cost reported per batch size. At large M this term can
      dominate the walk itself and would otherwise be read as a loss of
      amortization.
    - >-
      SHARED-INSTANCE AND SHARED-SEED CONTROL. The batch arm and the independent
      arm resolve the SAME targets from the same seeds. An arm that draws its
      own targets has not made the paired comparison this contract specifies.
    - >-
      THETA FREEZE. The distinguished-point rate is frozen before Stage 1 and
      held identical across arms and batch sizes. theta trades table memory
      against walk length, so a per-batch-size theta would make the charged
      result an artifact of tuning.
    - >-
      ORDERING RULE, BLOCKING. Both nulls and the uncharged instrument check are
      computed, recorded and timestamped BEFORE any charged number is formed, so
      that no charged result can be reported off a harness that already failed.
    - >-
      RATE-LADDER PRE-DECLARATION. The exchange-rate ladder is declared before
      execution. A rate chosen after seeing the charged curve would let the
      report pick its own conclusion, which is the single most available way to
      corrupt this measurement.
    - >-
      SUPERSESSION GATE, ZERO COMPUTE, CAN TERMINATE. Stage 0's reads of
      EXP-MTGT-d4f8cd and EXP-ECDLP-4320a7 are executed rather than asserted,
      with paths and verbatim quotations recorded, together with the recorded
      statement that unmerged branches are invisible here.

  independent_variables:
    - batch size M, over 1, 4, 16 and 64
    - arm, over shared-table batch and independent non-sharing runs
    - storage-to-computation exchange rate r, over the declared ladder, applied in analysis
    - repetition seed

  metrics:
    primary:
      - >-
        null1_ratio -- batch-harness total cost at M equal to 1 divided by the
        single-target baseline cost on the identical target. Dimensionless.
        Forced value 1.00 within 2 percent. MEASURED.
      - >-
        null2_ratio -- independent-arm total cost at M divided by M times the
        baseline. Dimensionless. Forced value 1.00 within 10 percent at each M.
        MEASURED.
      - >-
        verification_rate -- fraction of resolved targets whose recovered scalar
        is independently re-verified. Forced value 1.0. MEASURED.
      - >-
        total_group_operations and per_target_group_operations -- per (M, arm),
        with intervals over at least 20 repetitions. MEASURED.
      - >-
        uncharged_amortization_factor -- M times the single-target cost divided
        by the shared-table total at M, per M, with interval, against the
        predicted sqrt(M). Dimensionless. MEASURED against a MODELED target.
      - >-
        peak_table_entries, peak_table_bytes and peak_resident_bytes -- per M.
        MEASURED. Reported beside every operation count; a table without them is
        out of contract.
      - >-
        charged_per_target_cost -- charged_total(M, r) divided by M, for every M
        and every r on the declared ladder. Operation-equivalents. MEASURED
        inputs combined under a DECLARED rate; the rate is not a measurement and
        the distinction is preserved in the reporting.
      - >-
        crossing_rate -- the smallest r on the ladder at which
        charged_per_target_cost stops decreasing in M over 1, 4, 16, 64, or an
        explicit statement that no such r exists in the ladder. This is the
        contract's headline scalar.
    secondary:
      - >-
        tag_test_share -- the per-step tag test's fraction of total charged cost,
        per M. MEASURED. A value above 0.5 at M equal to 64 scopes the result to
        this implementation's tag test.
      - >-
        retained_bytes_integral -- the measured or declared-approximation
        integral of retained table bytes over the walk, per M, which is the
        quantity the exchange rate multiplies. MEASURED or APPROXIMATED, labelled
        either way.
      - >-
        resolution_order_statistics -- cost of the first-resolved against the
        last-resolved target, per M. MEASURED. DIAGNOSTIC ONLY; the total is the
        only pre-registered primary quantity because order effects make
        per-target statistics unstable.
      - >-
        walk_length and steps_to_full_resolution -- per (M, repetition).
        MEASURED.
      - >-
        wall_clock_seconds -- per cell, in its own column, with the note that it
        does not transfer. MEASURED.
      - >-
        stage0_supersession_log -- verbatim commands, paths and quotations, plus
        the recorded unmerged-branch blindness statement and the recorded
        OUTSTANDING distinctness check against H-ECDLP-6c52c0.

  measured_vs_modeled:
    measured:
      - total and per-target group operations per (M, arm, repetition)
      - peak table entries, peak table bytes and peak resident bytes per M
      - walk length, steps to full resolution and resolution order
      - the tag test's share of charged cost
      - verification outcomes for every resolved target
      - the uncharged realised amortization factor, from the measured totals
    modeled:
      - >-
        sqrt(M), the idealised shared-walk amortization factor, which is the
        comparison target for the instrument check and is never a measurement
      - >-
        the exchange rate r at every point of the ladder, which is a DECLARED
        ACCOUNTING CHOICE and not a property of anything measured
      - >-
        the retained-bytes integral when it is approximated by peak table bytes
        times walk length rather than integrated directly, with the
        approximation's direction of error stated
      - >-
        any statement at a batch size above 64, at another group size, or at
        another batch-to-group ratio, all of which are extrapolation and are not
        offered
    optimistic_assumptions_with_bias_direction:
      - >-
        The retained-bytes integral is approximated by peak table bytes times
        walk length. BIAS: OVERSTATES retained storage, because the table is
        smaller than its peak for most of the walk. This makes amortization look
        WORSE than it is, i.e. it biases toward the paper's own conclusion, which
        is the direction a reader should be most suspicious of. It is stated
        first for that reason, and the direct integral is measured instead
        wherever the harness can.
      - >-
        Peak resident bytes include interpreter and harness overhead a production
        implementation would not pay. BIAS: OVERSTATES memory, same direction as
        above. Table entries and table bytes are reported separately so the
        algorithmic memory can be read without it.
      - >-
        The tag test is charged at one group operation per target per step, which
        may exceed its real cost if it is implemented as a hash lookup. BIAS:
        OVERSTATES the batch arm's cost and therefore UNDERSTATES amortization.
        Its share is reported per cell so the reader can remove it.
      - >-
        Storage is charged as a running cost proportional to retained bytes,
        rather than as a one-off capacity cost. BIAS: unknown in sign and
        DEPENDENT ON THE DEPLOYMENT MODEL being imagined -- a rented-memory model
        favours the running charge, an owned-hardware model favours the capacity
        charge. This is the deepest modelling choice in the contract and it is
        the reason the result is a curve over rates rather than a number.
      - >-
        The single-target baseline used in the amortization ratio comes from
        EXP-ECDLP-4320a7 or from this contract's own M equal to 1 cell. BIAS: if
        the baseline is inflated by a weak implementation, the amortization
        factor is inflated with it. NULL 1 is what bounds this.
    time_memory_tradeoff: >-
      The tradeoff measured here is amortization against storage: a larger batch
      shares one walk across more targets and retains a larger table for longer.
      The measured interpolation range is exactly M in [1, 64] at 24 bits and at
      the frozen theta -- four points -- and no functional form is fitted outside
      it. The SECOND tradeoff axis, theta against walk length, is deliberately
      NOT swept here and is frozen instead, because sweeping both at once would
      make the charged optimum unattributable; it is measured in
      EXP-ECDLP-4320a7. The charged optimum this contract can report is therefore
      the optimum over M at ONE theta, not the joint optimum.

  heuristic_under_test: HEUR-BATCH-1

  preregistered_prediction:
    quantity: >-
      null1_ratio, null2_ratio, verification_rate, uncharged_amortization_factor
      per M, and the monotonicity in M of charged_per_target_cost at each rate on
      the ladder.
    formula: >-
      For an idealised shared random walk with FREE storage, resolving M targets
      in one group of order N costs about sqrt(M*N) total group operations, i.e.
      about sqrt(N/M) per target, so the uncharged amortization factor is
      sqrt(M). Forced null values: null1_ratio equals 1.00 within 2 percent,
      null2_ratio equals 1.00 within 10 percent, verification_rate equals 1.0.
      The uncharged factor is predicted within plus or minus 15 percent of
      sqrt(M) at M equal to 4, 16 and 64.
      FOR THE CHARGED COST NO VALUE IS PREDICTED, deliberately. The parent
      proposal supplies none, and its HEUR-BATCH-1 states only that the charged
      factor is NECESSARILY worse than sqrt(M) and that the question is by how
      much. What is pre-registered is the STRUCTURE of the answer: at each rate
      the charged per-target cost either decreases monotonically in M across the
      tested range or it does not, and the smallest rate at which it does not is
      the crossing rate.
      UNDER THE NULL that the harness shares nothing, the uncharged factor is
      1 rather than sqrt(M); under the null that it shares everything
      unintentionally, null2_ratio falls below 1. The two nulls therefore bracket
      the measurement from both sides.
    source: >-
      The classical analysis of shared-walk multi-target collision search,
      RECALLED in the parent proposal IDEA-20260815-284aff and not opened by any
      agent in this program. Stage 0 reads KN-TECH-001 and KN-LIT-013 and records
      what the committed corpus states before the value is used. The 15 percent
      band, the 2 percent and 10 percent null tolerances, the exchange-rate
      ladder and the crossing-rate definition are DERIVATIONS by the converting
      Coordinator under TASK-20260904-35fbe5: the parent proposal states its
      predictions qualitatively and none of them is decidable as written. Never
      tuned to data.

  scale_relevance:
    tier: toy
    justification: >-
      TOY AND ACTUALLY TOY. A prime-order subgroup at 24 bits is CONSTRUCTED and
      up to 64 targets in it are genuinely solved, so toy-scale evidence exists
      and the label is earned rather than conservative. The tested scale is one
      group size, 24 bits, and four batch sizes up to 64. NOTHING is claimed to
      transfer: the parent proposal's validation plan says 'TRANSFER: none beyond
      tested sizes and ratios' and that is preserved literally. In particular the
      batch-to-group ratio here, 64 targets against a 2^24 group, is not a ratio
      any deployment exhibits, and the record offers no extrapolation to deployed
      ratios. Resulting evidence may not exceed claim_tier toy under any outcome.
    correspondence: null
    correspondence_note: >-
      Null because targets are sampled directly in the tested group. No
      correspondence trick is used to reach a scale the computation cannot reach,
      and none is claimed.

  tail_checks:
    - >-
      The largest batch size, M equal to 64, where storage bites hardest. The
      parent proposal's validation plan names exactly this cell. A charged curve
      that is well behaved at M equal to 4 and 16 and breaks at 64 is the
      expected shape, and confirming the break is at 64 rather than an artifact
      of a single repetition requires the per-repetition spread at that cell.
    - >-
      The last-resolved target at each batch size, against the
      coupon-collector-style expectation that late targets are much more
      expensive than early ones. A resolution-order profile that is FLAT would
      mean targets are not being resolved by independent collisions, which would
      undermine the whole measurement.
    - >-
      The per-repetition spread of the uncharged factor at each M, checked to
      confirm the 15 percent band is being evaluated against a distribution with
      a usable interval rather than against a mean of a very heavy-tailed
      sample.
    - >-
      Both ends of the exchange-rate ladder, checked to confirm that the lowest
      rate reproduces the uncharged curve to within rounding and the highest rate
      makes even M equal to 4 unprofitable. If either endpoint does not behave,
      the ladder does not span the interesting region and the crossing rate is
      not bracketed.

  replication:
    seeds: []
    seeds_note: >-
      DELIBERATELY EMPTY AT CONTRACT TIME AND FILLED AT APPROVAL. This experiment
      is genuinely stochastic: the walk, the start points and every target's
      scalar are drawn at random, so seeds are required. They are not enumerated
      here because there are at least 20 repetitions at each of four batch sizes
      in two arms, and the list is generated from a single recorded master seed
      at approval time. The BINDING requirements are that the master seed is
      recorded in the approval decision before execution; that every derived seed
      is logged per repetition; that the 24-bit group is inherited from
      EXP-ECDLP-4320a7's frozen instance set with its recorded seed; and that the
      batch and independent arms resolve THE SAME targets from the same seeds. A
      run whose two arms draw different targets has not made the paired
      comparison this contract specifies and is completed_invalid.
    independent_instances: 2
    independent_instances_note: >-
      Two full independent executions from the same master seed, required to
      produce identical group-operation counts and identical resolution orders
      per repetition. The walk is deterministic given its seed, so any difference
      is an implementation or environment defect. Peak resident bytes are
      required to agree only within a declared 5 percent allocator-noise
      tolerance; peak table entries must agree exactly, because they are a
      property of the walk and not of the allocator.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 10
    maximum_memory_gb: 8
    maximum_runs: 40
    maximum_workers: 1

  stopping_rules:
    - >-
      Stop and report if Stage 0 finds a completed run already reporting the
      charged multi-target per-target cost with table storage accounted. The
      question is answered and the run cites that record.
    - >-
      Abort the package if either null fails. A harness that does not reproduce
      the single-target case, or that shares when told not to, measures nothing,
      and the correct output is the null failure rather than any factor.
    - >-
      Abort the package if verification_rate is below 1.0. A reported resolution
      that cannot be certified is a collision, not a solve.
    - >-
      Stop before Stage 4 if the uncharged factor fails its 15 percent band. No
      charged number is computed at all in that case; computing one would attach
      a charging model to an instrument known to be broken.
    - >-
      Stop at the declared four batch sizes, one group size, one theta and the
      declared rate ladder. No batch size is added and no rate is added after a
      curve has been seen; either would let the report choose its own crossing.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop and is reported as censoring, never as a negative
      result (AGENTS.md rule 5). In particular a censored M equal to 64 cell is
      NOT evidence that amortization fails at 64.

  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence about
      multi-target amortization (AGENTS.md rule 5).
    - >-
      A run reporting any amortization factor computed from arms that resolved
      different targets, or that used different seeds, is completed_invalid.
    - >-
      A run reporting a charged per-target cost at a single exchange rate, or
      quoting one point on the charged curve as the result, is completed_invalid.
      The rate is a declared accounting choice and presenting it as a measurement
      is the central reporting error available here.
    - >-
      A run that adds, removes or re-scales an exchange rate after seeing the
      charged curve is completed_invalid. Changing a success criterion after
      observing an outcome requires a versioned protocol_amendment.
    - >-
      A run reporting any operation count without peak memory beside it, or
      merging a measured quantity and a modeled one into a single column, is
      completed_invalid.
    - >-
      A run that varies theta across batch sizes is completed_invalid; the
      charged result would be unattributable between the two tradeoff axes.
    - >-
      A run reporting a charged number while the retained-bytes integral was
      neither measured nor approximated by the declared formula is
      completed_invalid, and the correct output in that case is the parent
      proposal's own conditional: the amortization number is INCOMPLETE.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT
      experiment and requires a new contract; it is never a repair of this one.

  success_criterion: >-
    All eight of the following hold, each decidable from the primary metrics --
    (1) Stage 0 is executed and its log recorded verbatim, INCLUDING the recorded
    statement that the distinctness check against H-ECDLP-6c52c0 was outstanding
    at contract time and whether it could be performed at run time;
    (2) null1_ratio is 1.00 within 2 percent;
    (3) null2_ratio is 1.00 within 10 percent at M equal to 4, 16 and 64;
    (4) verification_rate is 1.0 across all resolved targets;
    (5) uncharged_amortization_factor lies within plus or minus 15 percent of
    sqrt(M) at M equal to 4, 16 and 64, with per-repetition intervals reported;
    (6) peak_table_entries, peak_table_bytes and peak_resident_bytes are reported
    for every M and appear beside every operation count;
    (7) charged_per_target_cost is reported for every M at every rate on the
    declared ladder, with the uncharged and charged factors shown SIDE BY SIDE as
    the parent proposal's validation plan requires;
    (8) crossing_rate is reported as a value with both bracketing rates, or as an
    explicit statement that no crossing occurs in the ladder together with
    evidence that both ladder endpoints behaved as pre-registered.
    The experiment SUCCEEDS AS AN INSTRUMENT whether or not a crossing is found;
    it fails only when a blocking control fails or a required quantity is
    unreported.

  falsification_criterion:
    - >-
      A null misbehaves -- batch size one does not reproduce the single-target
      baseline, or the independent arm costs materially less than M times it.
      Carried verbatim in force from the proposal: harness wrong, results VOID.
      A too-cheap independent arm specifically means unintended sharing, which
      would have manufactured the effect under study.
    - >-
      The uncharged factor falls outside its band. The harness does not reproduce
      a classical result; C2 fails, no charged number is computed, and this is an
      instrument outcome rather than a statement about amortization.
    - >-
      The charged per-target cost continues to decrease in M at every rate on the
      ladder, with no crossing. Carried from the proposal: the classical factor
      holds with storage charged at these sizes and the campaign's multi-target
      accounting is sound at this scope. C3 is REJECTED and this is a clean,
      valuable positive-for-the-incumbent result reported as the headline.
    - >-
      The charged factor decays strictly more slowly than the uncharged one at
      plausible rates. Carried from the proposal: the idealisation does not hold
      at deployable batch sizes and the effect must be charged differently. C3 is
      supported at the tested scope only, and the crossing rate scopes it.
    - >-
      Storage dominates before the factor is realised -- the charged per-target
      cost stops decreasing, or increases, within the tested batch range at a
      plausible rate. Carried verbatim in force from the proposal as the MOST
      DECISION-RELEVANT POSSIBLE OUTCOME, reported as the headline.
    - >-
      The retained-bytes integral can be neither measured nor approximated by the
      declared formula. The parent proposal's own conditional fires: the
      amortization number is INCOMPLETE and the record says so plainly rather
      than presenting an uncharged number as a charged one.
    - >-
      tag_test_share exceeds 0.5 at M equal to 64. The measured factor is
      dominated by this implementation's tag-test arithmetic rather than by the
      sharing effect, and every conclusion is scoped to that implementation.
    - >-
      The resolution-order profile is flat. Targets are not being resolved by
      independent collisions, the shared-walk model does not describe what the
      harness is doing, and no amortization number from it is interpretable.
    - >-
      Stage 0 finds a completed run already reporting this charged measurement.
      The hypothesis is superseded and the run cites that record rather than
      re-deriving the gap.

  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, host description, master seed, frozen theta, declared exchange-rate ladder, declared charging formula, resolved model/inference block and environment
    - raw-result.json with one row per (repetition, M, arm) carrying seed, per-target scalars and verification verdicts, total and per-target group operations, walk length, resolution order, peak table entries, peak table bytes, peak resident bytes and the retained-bytes integral -- never summaries alone
    - the per-target solution certificates and the independent re-verification log
    - the Stage 0 supersession log with verbatim commands, paths and quotations from EXP-MTGT-d4f8cd, EXP-ECDLP-4320a7, KN-TECH-001 and KN-LIT-013
    - the recorded statement of the OUTSTANDING distinctness check against H-ECDLP-6c52c0, with whether it could be performed at run time and its outcome if so
    - the Stage 1 null verdicts, timestamped before any amortization factor
    - the uncharged-factor table per M with intervals and the 15 percent band verdict
    - the per-M memory table with peak table entries, peak table bytes, peak resident bytes and the retained-bytes integral
    - the charged-cost curve over the full declared rate ladder, with the uncharged and charged factors printed side by side
    - the crossing-rate result with both bracketing rates, or the no-crossing statement with the two ladder-endpoint checks
    - the tag-test share table per M
    - the measured-versus-modeled table and the optimistic-assumption list with each bias direction, with the retained-bytes over-approximation listed FIRST because it biases toward the record's own conclusion
    - the tail-check outputs including the resolution-order profiles
    - the pre-registration text, written before the first run and hashed

  assigned_to: executor
  approved_by: null

  approval_gate:
    - >-
      Coordinator drafting does not confer approval. This contract is
      review_required and is NOT approved; approved_by is null and
      execution_authorized is false. Approval is a separate act because it
      authorizes execution and spends compute.
    - >-
      THE DISTINCTNESS CHECK AGAINST H-ECDLP-6c52c0 MUST BE PERFORMED BEFORE
      APPROVAL. That hypothesis derives from IDEA-20260731-013, which covers the
      multi-target rho baseline, and is reported to exist on a branch not merged
      into the worktree where this contract was written, so it could not be read.
      If it already contracts the charged per-target cost, this contract is a
      second purchase of one measurement and must not be approved. This is the
      single most important precondition on this record.
    - >-
      THE CROSS-GOAL OVERLAP WITH EXP-MTGT-d4f8cd MUST BE SETTLED BEFORE
      APPROVAL. That draft contract already specifies the uncharged fitted
      exponent of M with peak store size per arm at toy scale. Which contract
      owns that measurement is a Coordinator decision spanning GOAL-ECDLP-001 and
      GOAL-ENDO-001; approving both without settling it buys the uncharged arm
      twice.
    - >-
      THE EXCHANGE-RATE LADDER AND THE CHARGING FORMULA MUST BE DECLARED IN
      WRITING BEFORE APPROVAL, including the retained-bytes approximation and its
      direction of error. Without them 'storage charged' has no numerical
      content and the contract's central metric is undefined.
    - >-
      The master seed and the inherited 24-bit instance must be recorded in the
      approval decision before execution, so that targets are fixed before any
      arm runs and cannot be redrawn after an unfavourable cell.
    - >-
      Whether NULL 1's baseline value is measured here or REUSED from a completed
      EXP-ECDLP-4320a7 run must be decided at approval.

  derivation_provenance:
    tool: coordinator-authored contract under the backlog-conversion task
    source_record: IDEA-20260815-284aff
    authored_under_task: TASK-20260904-35fbe5
    authored_at: '2026-09-04'
    note: >-
      Metrics, controls, nulls and falsifiers are taken from the parent
      proposal's predictions, minimal_test, controls, required_metrics,
      falsification_conditions, confounders and interpretation_limits, and
      restated as measurable quantities with units. All four of the proposal's
      falsification conditions are carried, including the two that are positive
      outcomes for the incumbent. Boilerplate identical across contracts by
      program rule follows the fixed table. No field is invented; a value the
      proposal did not supply is null, is recorded as a derivation gap below, or
      is flagged in place as a Coordinator addition.

  coordinator_additions_flagged:
    - >-
      THE EXCHANGE-RATE LADDER, AND IT IS THE LARGEST ADDITION. The proposal
      requires storage to be 'charged in the same model as computation' but never
      says at what rate. Any single rate would make the headline answer an
      artifact of an undeclared choice. Reporting the charged cost as a curve over
      a pre-declared ladder, with the crossing rate as the scalar deliverable,
      converts an arbitrary constant into a reported sensitivity. Declared before
      measurement and attributed to the Coordinator.
    - >-
      THE NUMERIC BANDS -- 2 percent on NULL 1, 10 percent on NULL 2, 15 percent
      on the uncharged factor. The proposal states these qualitatively as
      'reproduce exactly', 'M times baseline' and 'against sqrt(M)', none of
      which is decidable against a stochastic measurement.
    - >-
      THE CONCRETE GROUP SIZE OF 24 BITS. The proposal says 'one toy size'
      without naming it. Chosen to match EXP-ECDLP-4320a7's ladder so the
      instance and the single-target baseline can be shared.
    - >-
      SOLUTION VERIFICATION AS A BLOCKING CONTROL. The proposal does not list it,
      but a batch harness that reports a resolution it cannot certify is
      reporting a collision rather than a solve, and every cost number would
      inherit the error.
    - >-
      THE TAG-TEST SHARE METRIC AND ITS 0.5 THRESHOLD. The proposal names the tag
      test as a confounder in the sibling record IDEA-20260731-013 but supplies no
      instrument here.
    - >-
      THE LADDER-ENDPOINT TAIL CHECK, which is what makes a no-crossing result
      meaningful rather than a statement that the ladder was too narrow.
    - >-
      THE STAGE 0 SUPERSESSION TERMINATORS against EXP-MTGT-d4f8cd and
      EXP-ECDLP-4320a7, and the recorded outstanding check against
      H-ECDLP-6c52c0.

  derivation_gaps:
    - >-
      THE DISTINCTNESS CHECK AGAINST H-ECDLP-6c52c0 IS OUTSTANDING AND THIS IS
      THE RECORD'S LARGEST GAP. IDEA-20260731-013, the sibling proposal covering
      the multi-target rho baseline with a random-function null and a fitted
      exponent in T, is reported already converted as H-ECDLP-6c52c0 on a branch
      not present in the worktree where this contract was authored. That record
      could not be read. Whether the present contract measures something
      H-ECDLP-6c52c0 does not is therefore UNDETERMINED. It is not guessed at
      here; it is recorded as an approval blocker.
    - >-
      WHAT THE CONVERTING COORDINATOR COULD ESTABLISH ABOUT THE OVERLAP, FROM
      THE PROPOSALS ALONE. Reading IDEA-20260731-013 and IDEA-20260815-284aff
      side by side, 013's measured set appears to CONTAIN 284aff's uncharged
      quantities -- its construction B is the shared-table walk, its construction
      A is the no-sharing null, its memory axis is the table size shared versus
      independent, and its fitted gamma against 1/2 is the amortization factor
      against sqrt(M). What 013 reports as two SEPARATE axes, time and memory in
      bits, 284aff asks to be combined into one charged number. That combination
      is this contract's distinguishing content and it requires an exchange rate
      013 does not supply. Whether H-ECDLP-6c52c0 preserved that separation or
      already added a charging step is exactly what cannot be checked from here.
    - >-
      SUBSTANTIAL OVERLAP WITH EXP-MTGT-d4f8cd, WHICH IS IN THIS WORKTREE AND
      WAS READ. Its primary metrics include total and per-target group operations
      per arm per M, peak store size in entries and bytes per arm, and a fitted
      exponent of M with confidence interval, at toy scale with theta frozen
      across arms, and its success criterion is 0.50 plus or minus 0.05 over M in
      1 to 32. Its object is an isogeny-transport comparison under GOAL-ENDO-001
      and the same-curve arm is its calibration, but the uncharged measurement
      would be bought twice if both contracts ran.
    - >-
      ONE GROUP SIZE MEANS NO SIZE AXIS. With N fixed at 24 bits, nothing here
      distinguishes an amortization factor from a coincidence of that N. The
      parent proposal specifies one toy size and that is preserved rather than
      silently extended, but it is a real limit: the sibling proposal
      IDEA-20260731-013 uses three N values precisely so the fit has a second
      axis.
    - >-
      FOUR BATCH SIZES IS A SHORT LEVER FOR A POWER LAW. M in 1, 4, 16, 64 gives
      three usable points for a factor fit, and at M equal to 4 the predicted
      sqrt(M) of 2 is close enough to other candidate laws that the small-M cells
      cannot discriminate on their own. The reportable content is concentrated at
      M equal to 64.
    - >-
      NO THETA SWEEP HERE. Freezing theta makes the charged result attributable
      to M, but it also means the reported optimum is over M at one theta and not
      the joint optimum over both. The joint optimum is not measured by any
      contract in this series.
    - >-
      THIS WORKTREE CANNOT SEE UNMERGED BRANCHES. Every supersession statement in
      this contract is scoped to what is present here, and that limit is recorded
      in the run's required artifacts rather than left implicit.
