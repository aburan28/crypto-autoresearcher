# EXP-ECDLP-f34097 — stage-0 instrument for H-ECDLP-af796a.
# Frozen under DEC-20261012-a99281. No run, outcome, or conclusion is in this file.
experiment:
  id: EXP-ECDLP-f34097
  hypothesis_id: H-ECDLP-af796a
  source_idea: IDEA-20261009-581f5d
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  version: 1
  title: >-
    Stage-0 instrument: planted degree-0 section on y^2 = x^3 + x + 30 over F_31
  status: approved
  frozen: true
  designed_at: '2026-10-12'
  approved_by: DEC-20261012-a99281
  execution_authorized: true
  objective: >-
    Run one preregistered deterministic cell that checks the known-generator
    oracle, the degree-at-most-1 section identity, and a two-unknown linear
    control. Record counts and timings. Do not estimate a section-cost exponent.
  inputs:
    p: 31
    degree_bound: 1
    t0: 0
    surface: "y^2 = x^3 + x + 30"
    planted_section: [2, 0, 3, 0]
    oracle_v_max: 8
    random_control:
      equations: ["u + 2v = 14", "u - v = -1"]
      planted_root: [4, 5]
    runner: experiments/EXP-ECDLP-f34097/implementation/run.py
  controls:
    - >-
      Known-generator oracle: multiples v = 1..8 of the planted constant
      section, matched against the fibre point (2, 3).
    - >-
      Linear control with the same variable count (2) and preregistered planted
      root (4, 5). Degree shape is not matched; that limitation is part of the
      contract.
  independent_variables:
    - none; the cell is a single preregistered point, not a sweep
  metrics:
    primary:
      - oracle_recovered
      - oracle_multiplier
      - structured_contains_planted
      - structured_solution_count
      - random_contains_planted
      - random_solution_count
    secondary:
      - structured_seconds
      - random_seconds
      - variable_count
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      On this cell the oracle multiplier is 1, (x1, y1) = (0, 0) satisfies the
      section identity, and the linear control has unique solution (4, 5).
    formula: >-
      Point check: 3^2 = 2^3 + 2 + 30 in F_31. Section form:
      x(t) = 2 + x1 t, y(t) = 3 + y1 t, residual y^2 - x^3 - x - 30 is the
      zero polynomial at (x1, y1) = (0, 0). Control solution of
      u + 2v = 14 and u - v = -1 is (u, v) = (4, 5).
    source: >-
      The formulas are the preregistered cell, checked by algebra in F_31
      before any run. They are not a smoothness law and not SNFS-E4.
  scale_relevance:
    tier: toy
    justification: >-
      One prime, p = 31, degree bound 1, constant surface. No transfer to
      cryptographic p, and no use of a Gaussian-heuristic degree.
    correspondence: null
  tail_checks: []
  replication:
    seeds: []
    independent_instances: 1
    seed_policy: >-
      Deterministic cell. No seed is drawn. The parent idea's seed base is
      not consumed.
  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    wall_clock_seconds_per_run: 120
  stopping_rules:
    - Stop after the single preregistered cell. Do not open another prime in this version.
    - >-
      The runner stops an enumeration only by finishing F_31^2 or by the
      process watchdog. It has no adaptive stopping rule.
  invalidation_rules:
    - >-
      A crash, timeout, or exception invalidates the instrument run. It is not
      evidence about section cost.
    - >-
      Changing p, the degree bound, the planted vector, or the control
      equations after this freeze requires an amendment. It is not a rerun of
      version 1.
  success_criterion: >-
    The run records oracle_recovered true, oracle_multiplier 1,
    structured_contains_planted true, and random_contains_planted true, with
    random_solution_count equal to 1, at p = 31 and degree bound 1.
  falsification_criterion: >-
    The run records a complete cell in which oracle_recovered is false, or
    structured_contains_planted is false, or random_contains_planted is false,
    or random_solution_count is not 1. That result invalidates the instrument
    cell and does not decide the section-cost claim.
  decision_impact:
    on_positive: >-
      The instrument cell passed. A later amendment may add a degree-matched
      random system and a degree-of-regularity measurement. This pass does not
      authorize a claim that section search beats rho, and it does not close
      IDEA-20261009-581f5d.
    on_negative: >-
      The instrument cell failed. Do not schedule a cost-exponent stage from
      this runner. Repair the instrument by amendment. Do not read the failure
      as evidence that bounded-height sections are expensive.
  required_artifacts:
    - experiments/EXP-ECDLP-f34097/runs/RUN-ECDLP-62ec3d/manifest.yaml
    - experiments/EXP-ECDLP-f34097/runs/RUN-ECDLP-62ec3d/raw-result.json
    - experiments/EXP-ECDLP-f34097/runs/RUN-ECDLP-62ec3d/RESULTS.md
  assigned_to: executor
  scope_note: >-
    Version 1 is the stage-0 instrument only. SNFS-E1 and SNFS-E4 remain
    proposed and are not predecessors that this run waits on. No Magma, Sage,
    or external Groebner solver is on the path.
