experiment:
  id: EXP-CRYPTO-3713bf
  hypothesis_id: H-CRYPTO-46bb7c
  version: 1
  recorded_at: '2026-09-13'
  designed_by: TASK-20260913-154303
  converts_idea: IDEA-20260905-afa907
  title: >-
    Approximate-lumpability defect diagnostic on Z/11 and Z/17: exact
    history-conditioned transition-kernel delta_t for a coordinate-style
    feature partition under a restricted operation grammar, compared against
    a matched-random-partition null and a Z/15 known-false exact-coset
    control, with a full-translation-grammar collapse test.
  status: approved
  approved_by: coordinator
  approval_note: >-
    APPROVED 2026-09-13 by the Coordinator under the standing user
    authorization of 2026-09-06 ("all is approved. ideas/experiments should
    be always approved"), the same standing authorization already relied on
    in DEC-20260913-7036ce; no per-experiment user confirmation is requested.
    Protocol completeness checked before this mark: objective with decidable
    outcomes on both branches of P1 and P2; inputs (self-generated only, no
    external data or unverified infrastructure); controls CTL-1
    (matched_null) and CTL-2 (known_false, gates interpretability) each with
    an invalidation clause; independent variables; primary and secondary
    metrics; the heuristic under test (HEUR-1) stated exactly with its
    justification honestly marked weak/recalled; the preregistered
    prediction transcribed verbatim from the hypothesis's P1/P2 with source
    stated as internal (no external formula claimed); scale_relevance
    (toy, non-transfer stated); tail_checks; replication (fixed seed
    20260913, independent_instances = 2 groups); budget (advisory, trivial
    compute -- exhaustive enumeration on groups of order <=17); stopping and
    invalidation rules (the Z/15 control gates everything, checked first);
    decidable success and falsification criteria with both branches of every
    prediction stated as informative rather than as failure; and required
    artifacts, are all present and non-null. Executor handoff: a separate
    TASK-* record owned by the orchestrating session, not written by this
    task. Any later protocol change is a versioned protocol_amendment under
    experiments/EXP-CRYPTO-3713bf/amendments/, never an edit of this frozen
    contract; executed runs are never re-scored.
  successor_of: null
  objective: >-
    Decide, with real informative outcomes on both sides of each prediction,
    (M-A) whether a coordinate-style feature partition of Z/11 and Z/17 has a
    history-conditioned transition-kernel delta_t, under one declared
    restricted (non-full-translation) operation grammar, measurably below the
    delta_t range of matched random balanced partitions of the identical
    cell-size multiset; and (M-B) whether that separation, if found,
    disappears when the full translation group is added to the grammar. The
    genuine coset partition of the auxiliary non-prime-order group Z/15 is
    run through the identical pipeline as a known-false control that must
    show exact propagation (delta_t = 0) before any prime-order reading is
    trusted. This is a toy-scale finite combinatorial diagnostic: it makes no
    discrete-logarithm claim, no generic-lower-bound claim, and no claim
    beyond the two tested groups, the control group, and the one tested
    grammar.
  inputs:
    external_data: none
    self_generated_only: true
    groups:
    - Z/11 (prime-order test group)
    - Z/17 (prime-order test group)
    - Z/15 (auxiliary known-false coset-quotient control; not prime-order)
    mechanism_source: >-
      H-CRYPTO-46bb7c (mechanism steps (a)-(e)) and
      ledger/proposals/IDEA-20260905-afa907.yaml (claim, mechanism,
      minimal_test design, controls, assumptions, proof_search_map). The
      coordinate-style modulus rule, the restricted grammar, the
      matched-random control, and the Z/15 coset control are implemented
      from this description.
    solver: >-
      A self-contained Python script using only the standard library
      (`fractions.Fraction` for every total-variation-distance and
      probability computation, exact integer arithmetic for group
      operations). No external mathematics package (PARI, Sage, GAP,
      cypari) is required, installed, or used anywhere in this experiment.
  controls:
  - id: CTL-1-MATCHED-NULL
    type: matched_null
    control: >-
      Random balanced partitions of the same group with an identical
      cell-size multiset and identical operation count to the
      coordinate-style partition under test, exactly as
      IDEA-20260905-afa907's `minimal_test.controls[0]` specifies. Drawn (or,
      where the executor confirms full enumeration of all balanced
      partitions of the matched cell-size shape is computationally feasible
      for a given group, exhaustively enumerated instead) using the fixed
      declared seed 20260913. At least 20 independent draws are used whenever
      sampling (rather than full enumeration) is the mode selected for a
      given group; the executor's execution report states explicitly, per
      group, whether sampling or full enumeration was used and why.
  - id: CTL-2-KNOWN-FALSE-COSET
    type: known_false
    control: >-
      The genuine coset partition of the auxiliary composite-order group
      Z/15 by its subgroup structure (cosets of the order-5 or order-3
      subgroup). Z/15 is explicitly NOT prime-order and has an exact, not
      merely approximate, quotient structure, so this control MUST show
      exact propagation (delta_t = 0 for every tested t in {1,2,3,4}) run
      through the identical one-step-kernel-construction and
      delta_t-composition pipeline used for the prime-order groups. This
      control is checked FIRST, before any prime-order (Z/11, Z/17) result
      is reported as interpretable evidence for or against P1/P2, mirroring
      the CTL-2-GRH-BASELINE known-answer-gates-everything pattern used in
      EXP-ECRANK-b23a5e.
  independent_variables:
  - partition family (coordinate-style / matched-random / Z/15 coset-known-false)
  - >-
    operation grammar (restricted single-generator-or-shift-set grammar vs.
    full translation group)
  - history length t (1, 2, 3, 4)
  - group (Z/11, Z/17; Z/15 for the control only)
  metrics:
    primary:
    - name: delta_t_table
      definition: >-
        Per partition family, per grammar, per group, per t in {1,2,3,4}: the
        exact total-variation distance delta_t between the two most
        divergent same-fiber elements' t-step-history-conditioned next-feature
        laws, computed by exact rational composition of the one-step kernel
        (built by full enumeration of the group's Cayley-style dynamics under
        the declared grammar). Answers M-A and M-B, and directly resolves P1
        and P2.
    - name: matched_null_distribution
      definition: >-
        The distribution of delta_t (per t) over the matched-random-partition
        draws or full enumeration (CTL-1), reported as min/median/max and, if
        full enumeration is used, the complete sorted list. The single most
        separated (lowest-delta_t) matched-random draw is recorded explicitly
        as the tail check (see tail_checks below).
    - name: coset_control_result
      definition: >-
        CTL-2's delta_t at every tested t for the Z/15 coset partition, under
        both the restricted and full-translation grammars. Must read
        delta_t = 0 at every t for the diagnostic to be interpretable at all.
    secondary:
    - fiber sizes (cell-size multiset) for every partition family and group
    - >-
      description length of each history-conditioned kernel table (bytes or
      an equivalent exact count of distinct conditional-law entries) per
      partition family, per grammar, per group
    - >-
      construction wall-clock per (partition family, grammar, group, t)
      combination (trivial in absolute terms on groups of order <=17, but
      recorded for completeness and for cross-checking against the advisory
      budget)
    - >-
      the independently-drawn second coordinate rule's delta_t table (the
      observation_collision distinct_preimage_search from
      H-CRYPTO-46bb7c.proof_search_map), used only to check the coordinate-
      style family's result is not an artifact of one lucky rule choice
  heuristic_under_test: HEUR-1
  preregistered_prediction:
    written_before_any_run: '2026-09-13 (this frozen contract; no run of this experiment exists)'
    never_adjusted_afterward: >-
      This prediction is part of the frozen contract, transcribed verbatim
      from H-CRYPTO-46bb7c's predictions P1 and P2 (which transcribe
      IDEA-20260905-afa907's single combined prediction, split into two
      decidable parts for this contract). Any later change requires a
      versioned protocol_amendment in
      experiments/EXP-CRYPTO-3713bf/amendments/ and creates a new record; it
      is never an edit of this field, and runs already executed are never
      re-scored against a new one.
    quantity: >-
      (P1) delta_t of the coordinate-style partition under the restricted
      grammar, at t=1 and secondarily at t in {2,3,4}, compared against the
      matched-random-partition delta_t distribution of the identical
      cell-size multiset. (P2) the same quantity recomputed with the full
      translation group substituted for the restricted grammar, testing
      whether the P1 separation (if any) disappears.
    formula: >-
      coordinate-style delta_t(t=1) <= min(matched-null delta_t(t=1) over
      >=20 independent draws, or over the complete enumeration of balanced
      partitions of the matched cell-size shape where the executor confirms
      that enumeration is feasible) is the P1 success condition. For P2, the
      same comparison recomputed under the full-translation grammar is
      predicted to FAIL (coordinate-style delta_t(t=1) no longer <=
      min(matched-null range)), or the fiber-size / description-length proxy
      is predicted to collapse toward the full |G|-state table.
    source: >-
      H-CRYPTO-46bb7c predictions P1/P2, transcribed unweakened through from
      IDEA-20260905-afa907's single prediction entry. This is an INTERNAL
      prediction with no external published formula behind it -- unlike the
      ECRANK precedent's Bach/Minkowski-bound-derived prediction, no prior
      theorem is cited as the source of the specific numeric threshold ("at
      or below the min of an at-least-20-draw matched-null sample"); that
      threshold is this hypothesis's own operationalization of "measurably
      below" and is stated as such, not attributed to any external result.
  scale_relevance:
    tier: toy
    justification: >-
      Intentionally a toy-scale finite combinatorial diagnostic: the largest
      group enumerated has order 17, and the entire pipeline is exact
      brute-force enumeration, never sampling at scale. This tier is chosen
      deliberately and explicitly carries NO transfer to cryptographic-size
      groups; any claim of relevance to a cryptographic-scale instance
      requires a separately frozen follow-up experiment and is out of scope
      here.
    correspondence: null
    correspondence_note: >-
      No correspondence trick is used. Every group, partition, and kernel is
      directly and exactly enumerated; there is no sampling-based
      approximation standing in for a larger structure.
  tail_checks:
  - >-
    The SINGLE most-separated (lowest-delta_t) matched-random-partition draw
    found in CTL-1, compared directly against the coordinate-style result at
    the same t: if the coordinate-style delta_t is not below even this
    luckiest random draw, P1 fails outright regardless of the distributional
    comparison; if it is below the distribution's minimum but only barely
    below this single luckiest draw, that is reported explicitly as a
    borderline finding rather than folded silently into a pass.
  - >-
    The Z/15 coset control's delta_t at every tested t, checked BEFORE any
    other tail check or any prime-order reading is trusted (CTL-2 gates
    everything downstream, per its own control definition above).
  - >-
    The independently-drawn second coordinate rule's delta_t (the
    observation_collision distinct_preimage_search), checked against the
    primary coordinate rule's result to confirm P1's finding (or its
    absence) is not an artifact of one particular modulus choice.
  replication:
    seeds:
    - 20260913
    seeds_note: >-
      A single fixed seed is used for every matched-random-partition draw
      across both prime-order groups, per H-CRYPTO-46bb7c.rerandomization_note
      and test_boundary.parameters.fixed_seed. Where full enumeration of the
      matched cell-size shape is used instead of sampling for a given group
      (executor's choice, recorded in the execution report), no seed is
      needed for that group's CTL-1 computation since there is no
      randomness left to seed; the coordinate-style, coset, and kernel
      constructions themselves are fully deterministic and require no seed
      at all.
    independent_instances: 2
    independent_instances_note: >-
      The two prime-order test groups (Z/11, Z/17) are the primary
      independent instances the design is indexed by. The Z/15 control is a
      third, structurally distinct instance (not prime-order, used only as
      the known-false gate) and is not counted toward the "independent
      instances" of the tested hypothesis itself, matching
      H-CRYPTO-46bb7c.test_boundary.instances' three-way listing.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 300
    wall_clock_seconds_per_run_note: >-
      Advisory only, per docs/research-budget-policy.md ("Continue justified
      work within the authorized research scope without repeated CPU-time,
      stage-budget or batch-budget approvals... Time, CPU and run-count
      estimates may be null... do not stop launches"). This experiment is
      exhaustive enumeration on groups of order <=17 with exact rational
      arithmetic; 300 s per run is expected to be a very large multiple of
      the actual wall clock, which should be on the order of seconds.
    total_cpu_hours: 0.1
    total_cpu_hours_note: >-
      Advisory estimate. All enumeration is over group orders <=17 with a
      small fixed t-range (1..4) and at most a few dozen matched-random
      draws per group; total compute is expected to be well under a single
      CPU-minute in practice. Recorded at 0.1 CPU-hours as a generous
      advisory ceiling, not a measured figure.
    maximum_memory_gb: 1
    maximum_memory_gb_note: >-
      Advisory. Every table constructed (group Cayley tables, one-step
      kernels, matched-random partition sets) is at most on the order of
      17 x 17 exact-fraction entries; 1 GB is a large multiple of the
      expected peak (kilobytes to low megabytes).
    maximum_runs: null
    maximum_runs_note: >-
      No fixed run-count ceiling. The three groups (Z/11, Z/17, Z/15) each
      run through the same enumeration pipeline under two grammars
      (restricted, full-translation), which the executor may organize as one
      run per group or a small number of runs total; run organization is an
      executor implementation choice, not a scientific parameter, and does
      not authorize additional scientific trials, sampling variants, or
      repeated draws beyond what CTL-1's fixed seed and draw-count (or full
      enumeration) specify.
    maximum_workers: 1
    maximum_workers_note: >-
      Single-worker sequential enumeration; nothing here benefits from or
      requires parallelism at this scale.
  stopping_rules:
  - >-
    CTL-2 (the Z/15 known-false coset control) is computed and checked FIRST,
    before any coordinate-style or matched-random computation on Z/11 or
    Z/17 is read as interpretable evidence for or against P1/P2.
  - >-
    Each (partition family, grammar, group, t) combination is a fixed,
    complete enumeration; there is no early stopping, no adaptive sample-size
    widening, and no re-drawing of the matched-random partitions beyond the
    declared count (or full enumeration) under the fixed seed.
  - >-
    The experiment is complete once every declared combination -- 3 partition
    families x 2 grammars x up to 3 groups (2 prime-order + 1 control) x 4
    values of t, plus the CTL-1 matched-random distribution and the
    observation-collision second coordinate rule -- has been computed and
    recorded.
  invalidation_rules:
  - >-
    CTL-2 failure (the Z/15 coset control does not show delta_t = 0 at every
    tested t) invalidates the ENTIRE run as evidence for or against P1/P2;
    it is reported as `invalid_measurement` for the diagnostic as a whole,
    per H-CRYPTO-46bb7c's falsification_conditions, never as evidence for
    either branch of P1 or P2.
  - >-
    Any implementation defect discovered by the brute-force
    multiplication-table cross-check (proof_search_map.proof_obligations,
    responsibility: correctness) invalidates the affected partition
    family's kernel table; the affected computation is redone under a
    versioned amendment, never silently patched in place.
  - >-
    A wall-clock or memory watchdog interruption (unexpected given the tiny
    scale, but possible as an infrastructure event) is reported as
    `failed_infrastructure` per AGENTS.md rule 3, never as a negative result
    for HEUR-1, P1, or P2.
  - >-
    Every invalidation is recorded with the failing check's exact inputs; a
    voided reading is never silently dropped (AGENTS.md core rule 8).
  success_criterion: >-
    DECIDABLE, WITH REAL INFORMATIVE OUTCOMES ON BOTH SIDES. G1 (CTL-2 gate,
    checked first): the Z/15 coset control shows delta_t = 0 at every tested
    t under both grammars; failure here makes the run `invalid_measurement`
    in full, not a finding against P1/P2. G2 (P1): the coordinate-style
    partition's delta_t(t=1) under the restricted grammar is at or below the
    minimum of the matched-random delta_t distribution (>=20 draws or full
    enumeration, per CTL-1) -- reported as a confirmed separation if true,
    and as a genuine, informative, non-failing negative result if false. G3
    (P2): recomputing the same comparison under the full-translation grammar
    shows the separation (if found in G2) disappearing or the fiber-size/
    description-length proxy collapsing toward the full-state table --
    reported as a confirmed collapse if true, and as an informative finding
    that the restricted-vs-full-grammar framing carries no explanatory power
    at this scale if false. Every clause is machine-checkable from
    delta_t_table, matched_null_distribution, and coset_control_result.
  success_criterion_decidability_note: >-
    Every clause reads directly from the three primary metrics
    (delta_t_table, matched_null_distribution, coset_control_result) with no
    subjective judgement call; the tail_checks provide an independent
    cross-check against the primary comparison rather than an alternative
    decision path.
  falsification_criterion: >-
    Transcribed from H-CRYPTO-46bb7c.falsification_conditions verbatim
    (three conditions): (1) the Z/15 known-false control fails to show exact
    propagation -- this closes nothing about P1/P2 and instead invalidates
    the diagnostic itself as `invalid_measurement`, gating all downstream
    interpretation; (2) P1 fails (coordinate-style delta_t falls inside the
    matched-null range at every tested t under the one tested restricted
    grammar) -- a real, reportable negative result about this mechanism at
    this scale, not an infrastructure failure and not suppressed; (3) P2
    fails (the full-translation grammar does not produce the predicted
    collapse; any P1 separation persists essentially unchanged) -- reported
    as a finding that the restricted-vs-full-grammar framing carries no
    explanatory power at this tested scale. Each falsification closes ONLY
    its declared scope per AGENTS.md core rule 6: (1) closes nothing about
    Z/11 or Z/17, only about this run's interpretability; (2) closes the
    "restricted grammar beats matched-random" reading for THIS coordinate
    rule, THIS grammar, THESE two groups, and does not extend to any other
    rule, grammar, or group; (3) closes the "restricted vs full grammar"
    explanatory story at this scale without closing whether a low delta_t
    was found at all under the restricted grammar.
  required_artifacts:
  - >-
    the enumeration script (self-contained Python, stdlib-only, checked into
    this experiment's own path or referenced exactly) implementing group
    construction, the three partition families, both grammars, the one-step
    kernel builder, and exact delta_t composition
  - >-
    the full transition-kernel tables (or a compact exact representation,
    e.g. a keyed table of Fraction-valued conditional laws) for every tested
    combination of partition family x grammar x group x t
  - >-
    the computed delta_t values for every combination, with the exact
    construction shown (not just the final number) so an independent
    reviewer can recompute any single entry by hand
  - >-
    the matched-random-partition draw list (or full enumeration) with the
    fixed seed 20260913 recorded, and the resulting delta_t distribution
    (min/median/max, or complete sorted list if enumerated)
  - the Z/15 coset-control result table (delta_t at every t, both grammars)
  - >-
    the independently-drawn second coordinate rule's delta_t table (the
    observation-collision check)
  - >-
    a short execution report (executor observations only, no interpretation)
    stating per group whether CTL-1 used sampling or full enumeration and
    why, plus wall-clock and memory actually used against the advisory
    budget
  - >-
    the ledger run schema record for every enumerated run (id, experiment_id,
    status, command, environment, inputs, results, stdout, stderr,
    timestamps, resources, validity, model provenance)
  assigned_to: executor
  completion_gate:
  - >-
    All declared combinations (3 partition families x 2 grammars x groups
    {Z/11, Z/17, Z/15} x t in {1,2,3,4}) finalized with the nested `run:`
    record schema.
  - >-
    CTL-2 (the Z/15 known-false gate) is checked and reported before any
    other combination is read as interpretable.
  - validate_ledger.py adds no new violations after the run package.
  - >-
    The snapshot archive commits the full run package before any independent
    review.
  inference:
    requested_policy: executor-implementation
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
