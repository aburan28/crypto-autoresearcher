experiment:
  id: EXP-MSI-1958dc
  hypothesis_id: H-MSI-8207ee
  derived_from_idea: IDEA-20260811-4a55dd
  question_id: RQ-MSI-f760b2
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    The additivity test and its lattice consequences: an exact homomorphism check on
    the truncated period encoder, then measured rank, gap and recovery against three
    nulls and a blocking non-additive-encoder control, with a p-sweep at fixed level
  objective: >-
    The one uncertainty a run reduces is whether the truncated l-adic period encoder is
    additive in the homology class - the single algebraic fact on which the reduction of
    MSI to Bounded Distance Decoding, and the consequent relocation of its security
    parameter from p to the level, entirely depend. A run establishes (i) the additivity
    violation rate over at least 1000 class pairs per cell, plus scalar-multiplication
    checks; (ii) the MEASURED rank of the encoding matrix modulo l and its elementary
    divisors, from which the kernel determinant follows - never the assumed dimension;
    (iii) the measured first minimum against the Gaussian prediction, by exact
    shortest-vector computation where affordable; (iv) the exact-recovery rate as a
    function of the PREDICTED GAP, against a matched random-lattice null, a random-target
    null, a shuffled-pairing null, and a deliberately non-additive encoder that the
    pipeline must fail on; and (v) attack cost and success at fixed level and truncation
    as p varies over many orders of magnitude. NOTHING HERE IS EVIDENCE THAT MSI IS HARD,
    and a cell in which the attack fails is a regime placement, not a security claim.
  what_this_is_not:
    - >-
      Not evidence of hardness in any cell. Absence of a successful attack at toy rank is
      not evidence of hardness, and this contract forbids that reading in advance.
    - >-
      Not a new lattice technique and not an improvement of any lattice algorithm. The
      claimed increment is CLASSIFICATION - identifying the problem as an instance of a
      standard one - plus the parameter accounting that follows.
    - >-
      Not a claim about prime-field ECDLP, and not a route to one.
    - >-
      Not a break of any proposed parameter set. Toy ranks are far below any regime where
      lattice hardness is the operative question, and a toy success proves almost nothing.
    - >-
      Not a status change to any hypothesis, evidence record, decision or goal record, and
      not a promotion of any knowledge entry.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or
      evidence. No run has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: for the tested cells, the truncated period map was or was
      not additive; the measured rank and elementary divisors were [values]; instances fell
      in the named regime; and the measured recovery-versus-gap curve deviated from the
      random-lattice null by [amount]. WHAT DOES NOT FOLLOW: nothing about untested
      parameters; NO lower bound of any kind; NO hardness certification; and no claim that
      any proposed parameter set is broken. The transferable quantity is the
      SUCCESS-VERSUS-GAP CURVE, not the raw success rate, and the record must report it
      that way.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, HARD GATE). Read the source document's body and extract, with
      page references: the attaching map's definition; the definition of "short
      representative" and the norm it refers to, INCLUDING whether shortness is measured in
      an integral basis or in an overdetermined generating set; the exact definition of the
      l-adic period and whether it is an additive integral, a multiplicative integral, or a
      multiplicative integral composed with a logarithm; the dimension parameter; and any
      per-class normalisation. If the third item reveals a non-additive normalisation, STOP
      - that is the most valuable outcome, obtained for free. IF THE SOURCE CANNOT BE READ
      IN THIS CONTAINER, THE EXPERIMENT IS NOT EXECUTABLE and that is the report.
      STAGE 1 (minutes, HARD GATE, the cheapest valid discriminator). The additivity test:
      at least 1000 class pairs per cell over the declared grid, checking the homomorphism
      identity exactly, including pairs whose sum is short and pairs whose sum is not, plus
      scalar checks for a declared range of multipliers. Three encoder calls decide the
      entire structural question and no lattice machinery is needed to run them.
      STAGE 2 (hours). Build the encoding matrix by encoding each basis element - WITHOUT
      EVER CALLING THE ATTACHING MAP, and the run record must show that it did not. Record
      the measured rank modulo l, the rank modulo l^m, the elementary divisors, the kernel
      determinant that follows, the Gaussian prediction, the measured first minimum by exact
      shortest-vector computation at affordable ranks, and the empirical shortness of
      genuine instances. Report the predicted gap per cell.
      STAGE 3 (hours to a day). Run the frozen planted-error fixture FIRST. Then lattice
      reduction plus nearest-plane decoding, then block reduction at a declared ladder of
      block sizes, reporting the success rate per cell against the predicted gap, together
      with all three nulls and the non-additive-encoder control.
      STAGE 4 (hours). The p-sweep: hold level and truncation fixed, vary p over at least
      four values spanning many orders of magnitude, generate instances by the attaching
      map, and report cost and success.
      STAGE 5 (zero compute). Write the regime table and the scoped verdict, with the
      forbidden readings listed explicitly.
    instrument: >-
      The committed encoder and oriented-instance generator, UNCHANGED, with their commit
      shas recorded in the manifest; this contract does not build them and cannot run
      without them. Exact integer and modular arithmetic for the additivity test - a
      violation must be an exact inequality, not a numerical one. Lattice reduction,
      nearest-plane decoding and block reduction from a standard implementation, validated
      by the frozen planted-error fixture before any MSI number is produced. Exact
      shortest-vector computation as ground truth at ranks where it is affordable; above
      that, a block-reduction estimate whose OWN error is reported. Recorded through
      harness/runner.py.
    parameters: >-
      A declared grid of levels, primes and truncation exponents, frozen at STAGE 0, with
      the rank per cell MEASURED rather than assumed. At least 1000 class pairs per cell for
      the additivity test. A declared block-size ladder for the reduction sweep. At least
      four values of p at fixed level and truncation for the sweep. At least 100 matched
      random q-ary lattices of identical rank and determinant for the null. All norm
      conventions named per cell, since three different shortness measures give three
      different lattices and three different gaps.
  controls:
    - >-
      FROZEN PLANTED-ERROR FIXTURE, read FIRST. At a fixed seed, rank and truncation, a
      random q-ary instance with a planted error must be decoded EXACTLY - integer equality,
      not similarity of a curve. If it fails, the lattice harness is broken and NO MSI number
      from it may be reported.
    - >-
      NULL 1, RANDOM LATTICE OF MATCHED SHAPE. Replace the encoding matrix by a uniform
      random matrix of the same shape over the same ring, plant an error of the same norm,
      and run the identical attack. If the success-versus-gap curve is indistinguishable from
      the real one, the arithmetic contributed NOTHING beyond the dimensions and every claim
      is a claim about q-ary lattices. THAT IS AN ACCEPTABLE AND INFORMATIVE OUTCOME and must
      be reported as such rather than suppressed.
    - >-
      NULL 2, RANDOM TARGET. Replace the target by a uniform random vector. The attack must
      FAIL to return a short preimage at the rate predicted by the ball-volume count. A
      pipeline that "succeeds" on random targets is finding short kernel vectors rather than
      decoding, and every positive result from it is void.
    - >-
      NULL 3, SHUFFLED PAIRING. Permute which encoded vector belongs to which instance.
      Recovery must collapse to the NULL 2 rate.
    - >-
      NON-ADDITIVE-ENCODER CONTROL, BLOCKING and the sharpest single check here. Apply the
      same matrix followed by a fixed public bijection that is NOT additive. The identical
      pipeline MUST fail. A pipeline that succeeds on both has not used linearity and its
      verdict on the real map is worthless.
    - >-
      DECAY CONTROL. The parameter that is supposed to destroy the signal is the predicted
      gap. Success rate MUST decay as the gap decreases. A success rate flat in the gap is
      the artifact signature and means the harness is leaking the answer.
    - >-
      PUBLIC-CONSTRUCTION CONTROL. The encoding matrix must be built without ever calling the
      attaching map. This is what makes the attack an attack rather than a tautology, and the
      run record must demonstrate it - the quantifier trap is named in the paired hypothesis
      and this control is its enforcement.
    - >-
      MEASURED-RANK CONTROL. The kernel determinant is computed from the MEASURED rank and
      elementary divisors, never from the assumed dimension. Using the assumed value
      overstates the determinant and the gap, making the instance look harder than it is;
      this is the confounder most likely to produce a wrong verdict.
    - >-
      NORM-CONVENTION CONTROL. Every reported gap names its shortness convention. Three
      conventions give three lattices, and a gap quoted without its convention is not a
      quantity.
    - >-
      INSTANCE-DISTRIBUTION CONTROL. Instances produced by the attaching map are not uniform
      short vectors. Recovery is measured and reported SEPARATELY on genuine instances and on
      uniform planted errors; a rate from one does not transfer to the other.
    - >-
      GROUND-TRUTH CONTROL. Exact shortest-vector computation at affordable ranks validates
      the Gaussian prediction; above that ceiling the estimate's own error is reported rather
      than assumed zero.
  independent_variables:
    - level N on the declared grid
    - the prime l and the truncation exponent m
    - 'encoder: genuine / deliberately non-additive control'
    - 'lattice: genuine kernel / matched random q-ary'
    - 'target: genuine / uniform random / shuffled pairing'
    - block size on the declared reduction ladder
    - p, in the fixed-level sweep
  metrics:
    primary:
      - name: additivity_violation_rate
        units: fraction of sampled pairs
        computed_as: >-
          number of sampled class pairs with the homomorphism identity failing EXACTLY,
          divided by the number sampled, per cell, over at least 1000 pairs including short
          and non-short sums; plus the scalar-multiplication check over the declared
          multiplier range. Forced value 0. THE EXACT VIOLATING PAIR IS RECORDED IF ANY.
      - name: measured_rank_and_divisors
        units: integer rank plus the elementary divisor list
        computed_as: >-
          rank of the encoding matrix modulo l and modulo l^m, with elementary divisors, per
          cell. The kernel determinant is derived FROM THESE, never from the assumed
          dimension.
      - name: recovery_rate_vs_gap
        units: fraction, tabulated against the predicted gap
        computed_as: >-
          exact-recovery rate of nearest-plane decoding after reduction, and of block
          reduction at each declared block size, per cell, plotted against the predicted gap.
          THE CURVE, not the rate, is the reported quantity.
      - name: p_sweep_flatness
        units: >-
          trend verdict plus the per-p success rates and wall clocks
        computed_as: >-
          success rate and wall clock at fixed level and truncation across at least four
          values of p. Forced FLAT under the hypothesis; any monotone trend is the single
          most informative negative available.
      - name: nonlinear_control_success_rate
        units: fraction
        computed_as: >-
          recovery rate of the identical pipeline on the deliberately non-additive encoder.
          Forced 0. Any success VOIDS every other number in the run.
    secondary:
      - name: measured_lambda_1_vs_gaussian
        units: dimensionless ratio
        computed_as: >-
          exact shortest vector at affordable ranks divided by the Gaussian prediction, per
          cell, with the 20 smallest ratios reported explicitly since a systematically short
          first minimum would make the problem EASIER and is how a module structure would
          announce itself.
      - name: empirical_shortness_distribution
        units: norm units, with the convention named
        computed_as: >-
          full distribution of the genuine representative's shortness per cell, with the 20
          largest and 20 smallest reported and each assigned to a regime, since a bimodal
          distribution means security is set by worst instances rather than median ones.
      - name: null_recovery_rates
        units: fraction, per null
        computed_as: recovery on the matched random lattice, the random target, and the shuffled pairing.
      - name: distinct_short_preimages
        units: count
        computed_as: >-
          number of distinct short preimages found in ill-posed cells by enumerating short
          kernel vectors, against the ball-volume prediction.
      - name: encoder_call_cost
        units: seconds per call
        computed_as: >-
          measured cost of one encoder call, since if building the matrix costs more than the
          attack the assumption cannot support a construction at all.
      - name: peak_memory_and_wall_clock
        units: bytes and seconds
        computed_as: per cell, reported for both the reduction and the decoding phases.
  heuristic_under_test:
    id: HEUR-MSI-8207ee-1
    formal_statement: >-
      For all tested levels, primes and truncations, the kernel lattice behaves like a
      uniformly random lattice of its determinant with respect to its first minimum, with the
      deviation bounded by a constant independent of the grid coordinates.
    validation_plan: >-
      SAMPLE: exact shortest vectors of the kernel for every cell at affordable rank, across
      the full declared grid. SHORTCUT USED TO REACH SCALE: none is needed at affordable rank;
      above it the block-reduction estimate is used as a proxy and the proxy's OWN error is
      reported. COMPARISON DISTRIBUTION: the Gaussian prediction, and separately the empirical
      distribution of the first minimum over at least 100 matched random q-ary lattices of
      identical rank and determinant. TAIL CHECK: report the 20 cells with the smallest
      measured-to-predicted ratio explicitly. TRANSFER ASSUMPTION, STATED: that a deviation
      measured at toy rank persists in sign and rough magnitude at cryptographic rank. THIS IS
      NOT JUSTIFIED BY ANYTHING AND IS RECORDED AS AN OPEN EXTRAPOLATION.
    second_heuristic:
      id: HEUR-MSI-8207ee-2
      formal_statement: >-
        The shortness of a genuine representative grows at most linearly in path length in the
        source's norm, with sub-Gaussian tails around its median.
      validation_plan: >-
        SAMPLE: at least 1000 instances per cell from the attaching map, recording shortness
        and path length side by side. COMPARISON: regression of shortness on path length with
        residual structure reported, and the empirical distribution against a sub-Gaussian fit.
        TAIL CHECK: the 20 largest and 20 smallest, each assigned to a regime. TRANSFER: toy p
        only; NO extrapolation to cryptographic p is offered. THIS IS THE ASSUMPTION WITH THE
        LEAST SUPPORT IN THE DESIGN and it is unsupported until the source is read.
  preregistered_prediction:
    quantity: >-
      additivity_violation_rate per cell, and the midpoint of the recovery-versus-gap
      transition against the random-lattice null.
    formula: >-
      additivity_violation_rate = 0 EXACTLY over at least 1000 pairs per cell. The
      recovery-versus-gap transition is high at large predicted gap and near zero at small
      predicted gap, with its midpoint agreeing with the matched random-lattice null to within
      a declared relative tolerance in the log of the gap; a displacement beyond that tolerance
      is a module effect and a finding in its own right. The p-sweep is FLAT. Under the
      alternative that the encoder is not additive, a single exact violating pair appears and
      every downstream metric is void by construction.
    source: >-
      Pre-registered in the parent proposal IDEA-20260811-4a55dd (predictions: "PREDICTED
      EXACTLY 0 over at least 10^3 pairs per cell"; "with a transition whose midpoint agrees
      with the random-lattice null"; "PREDICTED FLAT - no trend in p") before any run under
      this contract exists. Never tuned to data. The exact numeric tolerances for the
      transition band are assigned to STAGE 0 for freezing, because the parent's figures depend
      on the rank, which is measured rather than known in advance.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at ranks far below any regime where lattice hardness is the operative question.
      AT SMALL RANK NEARLY EVERY LATTICE INSTANCE IS EASY FOR REDUCTION, so a toy success says
      almost nothing about a cryptographic rank - which is precisely why the transferable
      quantity is the SUCCESS-VERSUS-GAP CURVE and not the raw success rate, and why the
      contract requires the curve. The additivity test, by contrast, is scale-free: it is an
      exact algebraic identity and its verdict at toy level is a verdict about the map.
    correspondence: null
    transfer_assumption: >-
      For the additivity arm: none needed, the identity is exact. For the lattice arm: the
      curve's shape is offered as indicative and the module deviation's persistence at larger
      rank is recorded as an OPEN EXTRAPOLATION justified by nothing.
  tail_checks:
    - >-
      Report the exact violating pair if additivity fails, not merely the rate. One exact
      counterexample is the whole result and a rate would bury it.
    - >-
      Report the 20 cells with the smallest measured-to-predicted first-minimum ratio; a
      systematically short first minimum makes the problem easier and is how a module structure
      announces itself.
    - >-
      Report the 20 largest and 20 smallest genuine-instance shortness values with their regime
      assignments, since a bimodal distribution means security is set by worst instances.
    - >-
      Report the recovery curve for genuine instances and for uniform planted errors
      SEPARATELY; a rate from one does not transfer to the other.
    - >-
      Report the number of distinct short preimages in ill-posed cells against the ball-volume
      prediction; finding exactly one where many are predicted means the norm model or the
      heuristic is wrong and must be diagnosed first.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 1000
    repeat_count: 3
    note: >-
      1000 class pairs per cell for the additivity arm and at least 1000 genuine instances per
      cell for the shortness distribution, drawn from the declared seed streams. The additivity
      arm's sample size is NOT a statistical power figure - one exact violation suffices - it
      is a coverage figure, chosen so that a violation confined to a special subset of pairs
      would still be hit. The lattice arm's power lives in the number of cells and matched
      random lattices, not in the seeds.
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 12.0
    memory_gb: 16
    maximum_memory_gb: 16
    maximum_runs: 40
  stopping_rules:
    - >-
      STOP AT STAGE 0 if the source reveals a non-additive normalisation. That is the most
      valuable outcome and it is obtained at zero compute; do not spend the lattice budget to
      re-derive it.
    - >-
      STOP AT STAGE 1 if additivity fails reproducibly. Every downstream metric is void by
      construction and running them would produce numbers with no referent.
    - >-
      Stop and void the run if the frozen planted-error fixture fails, or if the non-additive
      encoder control is defeated.
    - >-
      Stop the block-size ladder at the largest block size terminating inside
      wall_clock_seconds_per_run; a censored cell is recorded as censored, never as a failure
      to recover.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a
      stop, never a negative result (AGENTS.md rule 5).
    - >-
      The grid, the tolerances, the norm convention and the block-size ladder are frozen at
      STAGE 0 and are not revised after any recovery rate is observed.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md rule 5). An
      absent encoder or an unreachable source document is exactly such a failure.
    - >-
      A run in which the encoding matrix was built using the attaching map is
      completed_invalid: the attack's premise - that the matrix is public - was not met.
    - >-
      A run computing the kernel determinant from the assumed dimension rather than the
      measured rank is invalid_measurement.
    - >-
      A run whose three nulls and non-additive control were not executed in the same invocation
      as the signal arm is invalid_measurement.
    - >-
      A run reporting a gap without naming its shortness convention is invalid_measurement.
    - >-
      A run reporting a raw success rate without the success-versus-gap curve is
      invalid_measurement for the transferable claim, since the raw rate at toy rank is known
      in advance to be uninformative.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and
      requires a new contract; it is never a repair of this one.
  success_criterion: >-
    STAGE 0's extraction is complete with page references, the frozen planted-error fixture
    passes, the non-additive-encoder control fails as required, all three nulls are executed in
    the same invocation, and the run reports the additivity violation rate over at least 1000
    pairs per cell, the measured rank and elementary divisors per cell, the recovery-versus-gap
    curve with the null's transition midpoint beside it, and the p-sweep table. The hypothesis
    H-MSI-8207ee is SUPPORTED if and only if the violation rate is exactly 0 in every cell, the
    recovery curve decays with the gap, and the p-sweep is flat within noise.
  falsification_criterion:
    - >-
      A single reproducible additivity violation on genuine encoder output, traced to a
      specific step rather than to a bug. L1 is false, the reduction is void, and the identity
      of the non-additive step is the finding. THIS IS THE OUTCOME MOST WORTH HAVING.
    - >-
      The non-additive-encoder control is DEFEATED. The pipeline is not using linearity; every
      conclusion in the run is void.
    - >-
      The frozen planted-error fixture fails. The harness is broken; no number may be reported.
    - >-
      Recovery rate is FLAT in the predicted gap. The success is not produced by the lattice
      geometry; diagnose the harness before reporting anything.
    - >-
      Recovery or wall clock trends monotonically with p at fixed level and truncation. The
      p-independence part is weakened and the mechanism by which p enters must be found.
    - >-
      The random-lattice null's success-versus-gap curve is indistinguishable from the real
      one. The arithmetic contributed nothing beyond the dimensions - an acceptable and
      informative outcome that must be REPORTED rather than suppressed.
    - >-
      STAGE 0 finds shortness measured in a generating set rather than a basis, with rank and
      geometry different enough that the regime boundaries do not apply. The arithmetic must be
      redone in the correct lattice before any attack claim.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment, INCLUDING the commit shas of the encoder and the
      oriented-instance generator
    - the STAGE 0 extraction with page references, or an explicit record that the source could not be read
    - >-
      raw-result.json carrying the per-cell additivity count with the exact violating pair if
      any, the measured rank and elementary divisors, per-instance shortness, and per-cell
      recovery, and not summaries
    - all three nulls' and the non-additive control's measurements, in the same file as the signal arm
    - the frozen planted-error fixture's result, read before any MSI number
    - the recovery-versus-gap curve for genuine instances and for uniform planted errors, separately
    - the p-sweep table with wall clock and peak memory per cell
    - the frozen grid, tolerances, norm convention and block-size ladder, hashed before the run
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false. Approval is the user's
      gate because it authorizes execution and spends compute.
    - >-
      STAGE 0 IS A HARD PRECONDITION. Every statement about the construction in the paired
      hypothesis is an inference from its published summary; running the lattice arm against
      inferred definitions would produce numbers about a map that may not be the one under
      study. If the source cannot be read here, the correct action is to report the experiment
      as not executable.
    - >-
      The encoder and oriented-instance generator must EXIST AND BE COMMITTED before dispatch.
      This contract does not build them.
    - >-
      STAGE 1 is a HARD GATE and is the cheapest valid discriminator in this portfolio: it must
      be run and read before any lattice budget is spent.
    - >-
      The paired hypothesis is proof-oriented and carries a filled proof_search_map
      (KN-TECH-080); its nearby-object control is the non-additive encoder, which is BLOCKING,
      and its quantifier audit is enforced by the public-construction control.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260811-4a55dd
    authored_at: '2026-08-25'
    note: >-
      Stages, nulls, controls, forced values and confounders are taken from the parent
      proposal's mechanism, minimal_test, predictions and confounders. The parent's numeric
      transition band is NOT copied here because it depends on the rank, which this contract
      measures rather than assumes; the band is assigned to STAGE 0 for freezing before any
      recovery rate is observed. Budgets come from the parent's declared estimated_cost
      (implementation medium, compute low) with the stage-3 "hours to a day" figure carried as
      a bound rather than as a measurement. No field is invented; a value the proposal did not
      supply is null or is assigned to a stage.
  derivation_gaps:
    - >-
      Every definition of the construction is unread. The norm convention alone changes the
      lattice, its rank and every gap, and it is the gap most likely to invalidate the whole
      lattice arm. It is assigned to STAGE 0 and the contract is not executable without it.
    - >-
      The numeric transition band for the recovery-versus-gap agreement with the null is not
      fixed. It depends on the measured rank and must be frozen at STAGE 0 - after the rank is
      known, before any recovery rate is observed - and the run record must show that ordering.
    - >-
      The declared grid of levels, primes and truncations is not numerically fixed. It must be
      chosen by the affordability of exact ground truth, not by which cells give a favourable
      curve.
    - >-
      Whether the encoder's per-call cost makes building the matrix more expensive than the
      attack is unknown and is measured here as a secondary metric; if it is, the assumption
      cannot support a construction and that is a separate, larger finding than anything in the
      lattice arm.
