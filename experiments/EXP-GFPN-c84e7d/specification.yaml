# =============================================================================
# EXP-GFPN-c84e7d — version 1, approved by DEC-20261006-e433b5. Frozen
# monomial-count cell for IDEA-20261006-77b06b. Success is the idea's
# prediction: M3/M2 on E2 is at most 1/4, and M2(E2)/M2(E0) lies in
# the closed interval [1/2, 2], with both M2 counts at least 1. The
# concrete negative is that both M2 counts are at least 1, the
# cross-curve ratio lies inside [1/2, 2], and M3/M2 on E2 is strictly
# greater than 1/4. This design session did not expand a polynomial
# and did not record a monomial count. No discrete logarithm is
# authorized. Source idea bytes are copied unchanged from
# origin/design/hyper-79cb0a-prym, blob
# f3b8032bc975ecd34aaaf3e16bc4df691f56bc90.
# =============================================================================
experiment:
  id: EXP-GFPN-c84e7d
  hypothesis_id: H-GFPN-256b80
  question_id: RQ-GFPN-c01af8
  source_idea: IDEA-20261006-77b06b
  version: 1
  title: >-
    Monomial counts of elementary-symmetric S_5 versus the 2-torsion
    coordinate on one quintic extension of F_11
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-e433b5
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that M3/M2 is at most 1/4, does not
      assert that the cross-curve ratio lies in [1/2, 2], and does
      not assert that an exponent moves.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Work only at p' = 11 and extension degree 5. Freeze the first
      monic irreducible quintic, the first qualifying E2, and the
      first qualifying E0. Count grevlex monomials of the
      elementary-symmetric 5-summand generators on both curves, and
      of the t = X + b/X generators on E2 only. Repeat the expansion
      in the opposite resultant order. Do not run a Gröbner basis,
      do not build a cover, and do not search for a discrete
      logarithm.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether M3/M2 on E2 is at most 1/4 and whether
    M2(E2)/M2(E0) lies in the closed interval [1/2, 2]. The concrete
    negative is that both M2 counts are at least 1, the cross-curve
    ratio lies inside [1/2, 2], and M3/M2 on E2 is strictly greater
    than 1/4. No faster index-calculus algorithm is in scope.

  inputs:
    field: >-
      F_11 = {0, 1, ..., 10}. A monic quintic is
      f = z^5 + a4 z^4 + a3 z^3 + a2 z^2 + a1 z + a0 with
      coefficients in F_11. Identify a coefficient tuple with
      N = a0 + 11 a1 + 11^2 a2 + 11^3 a3 + 11^4 a4, so a0 varies
      fastest. Visit tuples by increasing N, starting at N = 0.
      The quintic is irreducible when it has no root in F_11 and no
      monic quadratic factor over F_11. The first irreducible f is
      frozen before any curve is tested. F = F_11[z]/(f). Write each
      field element as c0 + c1 z + c2 z^2 + c3 z^3 + c4 z^4 and
      identify it with
      N = c0 + 11 c1 + 11^2 c2 + 11^3 c3 + 11^4 c4. If the search
      finishes every tuple and none is irreducible, the reading is
      unmeasured_no_quintic and no curve is built.
    curve_model: >-
      y^2 = x^3 + A x + B with A, B in F. Visit pairs by increasing
      N(A), and for each A by increasing N(B). Skip (A, B) = (0, 0).
      The curve is singular when 4 A^3 + 27 B^2 = 0 in F, and
      singular curves are skipped. A point of order 2 is an affine
      point (r, 0) on the curve. The cubic x^3 + A x + B has an
      F-root if and only if such a point exists.
    object_E2: >-
      E2 is the first nonsingular pair, in the order above, whose
      cubic has at least one root in F. Let r be the root with the
      smallest N. Set X = x - r and b = 3 r^2 + A. If b = 0, the
      reading is unmeasured_degenerate_b and E0 is not built. If no
      pair qualifies, the reading is unmeasured_no_E2 and E0 is not
      built.
    object_E0: >-
      E0 is the first nonsingular pair, in the same order, whose
      cubic has no root in F. The search is independent of which
      pair was chosen as E2. If no pair qualifies, the reading is
      unmeasured_no_E0.
    torsion_check: >-
      On E2, double T = (r, 0) with the characteristic-11 group law
      and require the double to be the point at infinity. On E0,
      require that the cubic has no root. A failed check is
      instrument_failure.
    summation_polynomial: >-
      Work on the shifted model of each curve. For E2 the shift is
      X = x - r, the model is y^2 = X^3 + a2 X^2 + b X with
      a2 = 3 r and b = 3 r^2 + A, and c = 0. For E0 there is no
      order-2 point, so the model stays y^2 = x^3 + A x + B, which
      is the same shape with a2 = 0, linear coefficient A, and
      constant term B. Write f(u) = u^3 + a2 u^2 + b1 u + c for
      those coefficients. Define S2(u, v) = u - v. Define S3(u, v, w)
      as the primitive part of
      4 f(u) f(v) - (f(u) + f(v) - (v - u)^2 (u + v + w + a2))^2,
      after dividing out the highest power of (u - v) that divides
      it in the polynomial ring. For m >= 4,
      S_m(u1, ..., um) = Res_U(S_{m-1}(u1, ..., u_{m-2}, U),
      S3(u_{m-1}, um, U)). S5 is that polynomial at m = 5. Take the
      primitive part over F after each resultant.
    elementary_symmetric_form: >-
      S5 is symmetric in its five variables. Let e1, ..., e5 be the
      elementary symmetric polynomials, with e1 the sum. There is a
      unique polynomial G(e1, ..., e5) with coefficients in F such
      that substituting the elementary symmetric polynomials in the
      five variables recovers S5. Write G = sum_{k=0}^{4} G_k z^k
      with each G_k a polynomial over F_11. M2 is the number of
      distinct monomials in e1, ..., e5 that appear with a nonzero
      coefficient in at least one G_k. A monomial order does not
      change this set. Grevlex with e1 > e2 > e3 > e4 > e5 is the
      listing order written into the artifact.
    torsion_substitution: >-
      On E2 only, impose X_i^2 - t_i X_i + b = 0 on each summand,
      with the same b as above. Eliminate X1, ..., X5 by the
      iterated resultant of S5 against those five quadratics. The
      eliminant is a polynomial in t1, ..., t5. If it is the zero
      polynomial, the reading is void_empty_support. Otherwise take
      its elementary-symmetric form H(f1, ..., f5) over F, descend
      the coefficients to F_11 on the basis 1, z, ..., z^4, and let
      M3 be the number of distinct monomials in f1, ..., f5. M3 is
      not computed on E0.
    second_expansion: >-
      Repeat the construction of S5 with the resultant recurrence
      running from the opposite end,
      S_m = Res_U(S3(u1, u2, U), S_{m-1}(u3, ..., um, U)),
      then the same elementary-symmetric rewrite, the same descent,
      and, on E2, the same elimination. The two monomial sets for
      M2(E2), for M2(E0), and for M3 must agree. One disagreement
      is instrument_failure and voids the cell.
    integer_comparisons: >-
      M3/M2 is at most 1/4 exactly when 4 M3 <= M2(E2). It is
      strictly greater than 1/4 exactly when 4 M3 > M2(E2). The
      cross-curve ratio lies in the closed interval [1/2, 2]
      exactly when M2(E0) <= 2 M2(E2) and M2(E2) <= 2 M2(E0). It
      lies strictly outside when one of those inequalities fails.
      A zero M2 makes the ratio that uses it undefined.

  controls:
    - id: second-expansion
      statement: >-
        The opposite resultant order reproduces the monomial set of
        every reported count. One disagreement voids the cell and is
        not a ratio.
    - id: cross-curve-match
      statement: >-
        M2(E0) is reported whenever E0 exists. A cross-curve ratio
        strictly outside [1/2, 2], with both M2 counts at least 1,
        means M3/M2 is not interpreted.
    - id: torsion-presence
      statement: >-
        2T = O on E2, and E0 has no affine point of order 2. A
        failed check voids the cell.
    - id: no-grobner
      statement: >-
        No Gröbner basis is computed, and no monomial is dropped
        because a leading-term rewrite would remove it. The count is
        the support of the generators before any basis.

  independent_variables:
    - which curve is scored, E2 or E0
    - whether the generators are the elementary-symmetric form or the t-form
    - whether the resultant recurrence runs forward or backward

  metrics:
    primary:
      - id: torsion_ratio
        statement: >-
          M3/M2 on E2. The idea's prediction is that the ratio is at
          most 1/4. The concrete negative is that the ratio is
          strictly greater than 1/4 while both M2 counts are at
          least 1 and the cross-curve ratio lies in [1/2, 2].
      - id: cross_curve_ratio
        statement: >-
          M2(E2)/M2(E0). The idea's prediction is the closed
          interval [1/2, 2]. A ratio strictly outside that interval
          blocks interpretation of M3/M2.
    secondary:
      - id: monomial_counts
        statement: the three integers M2(E2), M2(E0), and M3(E2)
      - id: frozen_objects
        statement: the quintic f, the pairs (A, B) for E2 and E0, the root r, and the constant b
      - id: expansion_disagreements
        statement: the number of monomial-set disagreements, required to be 0 on every interpreted row

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says the torsion coordinate multiplies the generator
    monomial count by at most 1/4, and that the two elementary
    counts stay within a factor 2. The row torsion_did_not_cut is
    the negative for that factor on this cell. It is not a
    refutation of Gaudry's exponent. Do not relabel an instrument
    failure or an unmeasured search as that negative. A zero M2 is
    void_empty_support, not a confirmation of the threshold.

  preregistered_prediction:
    quantity: >-
      The pair of ratios (M3/M2(E2), M2(E2)/M2(E0)) at p' = 11,
      extension degree 5, and five summands, together with the three
      monomial counts.
    formula: >-
      4 M3 <= M2(E2), M2(E0) <= 2 M2(E2), and
      M2(E2) <= 2 M2(E0), with both M2 counts at least 1. The
      concrete negative is 4 M3 > M2(E2), with both M2 counts at
      least 1 and the cross-curve inequalities holding. A count of
      0 on either M2 is not a confirmation. Equality 4 M3 = M2(E2)
      meets the prediction. Source idea IDEA-20261006-77b06b. No
      monomial was counted before this formula was frozen.
    source: >-
      IDEA-20261006-77b06b, whose prediction is M3/M2 at most 1/4
      and the cross-curve M2 ratio inside [1/2, 2]. KR-IC-955fd6,
      KR-IC-e2d81b, KR-IC-5a43e5, KR-IC-46d822, and KR-IC-5ea2f8
      were opened in this session and do not state this ratio.

  scale_relevance:
    tier: toy
    justification: >-
      The only field is a degree-5 extension of F_11, which has
      161051 elements. No transfer to p = 2^64 - 2^32 + 1 is
      assumed. The sample is one quintic and two curves, not a tail
      draw. The minimum effect is the idea's own threshold 1/4 and
      the idea's own band [1/2, 2].
    correspondence: >-
      Direct expansion of the summation polynomial and direct
      elimination of the quadratics X^2 - t X + b. No Deuring
      correspondence and no Gröbner solver is used.

  tail_checks:
    - >-
      An M2 count of 0 is kept as 0. It is not replaced by a
      pseudocount, and the ratio is not declared to meet the
      threshold.
    - >-
      A ratio M3/M2 equal to 1/4 meets the prediction. A ratio
      strictly above 1/4 counts toward the negative when the
      cross-curve band holds.

  replication:
    seeds:
      - EXP-GFPN-c84e7d|lex-order-no-random-draw
    independent_instances: 1
    note: >-
      One is the number of quintics scored. The search is
      deterministic given the frozen order. There is no random seed.
      The second expansion is the replication of the monomial set.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One run manifest covers the quintic search, both curves, both
      expansions, and the torsion elimination. Wall-clock and CPU
      figures are advisory and null. The 4 GB memory figure is
      machine protection for the expanded polynomial. A watchdog
      expiry is failed_infrastructure, not a ratio.

  stopping_rules:
    - Stop after a reading row is named.
    - Do not drop a generator monomial because a later basis would remove it.
    - Do not replace the threshold 1/4 or the band [1/2, 2] after seeing a count.
    - A timeout voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - An expansion disagreement voids the run.
    - A failed doubling of T, or an E0 cubic that has a root, voids the run.
    - Computing a Gröbner basis and counting the basis instead of the generators voids the run.
    - Replacing a zero M2 by a pseudocount voids the run.
    - Scoring a singular curve as E2 or as E0 voids the run.
    - Interpreting M3/M2 when the cross-curve ratio is strictly outside [1/2, 2] voids the run.
    - Continuing past b = 0 to a later curve voids the run.

  success_criterion: >-
    The instrument checks pass, both M2 counts are at least 1, M3/M2
    on E2 is at most 1/4, and M2(E2)/M2(E0) lies in the closed
    interval [1/2, 2]. This is the prediction of
    IDEA-20261006-77b06b. It is reachable as a failure when both M2
    counts are at least 1, the cross-curve ratio lies inside
    [1/2, 2], and M3/M2 is strictly greater than 1/4.

  falsification_criterion: >-
    The instrument checks pass, both M2 counts are at least 1,
    M2(E2)/M2(E0) lies in the closed interval [1/2, 2], and M3/M2
    on E2 is strictly greater than 1/4. That is the concrete
    negative named with the source idea: the 2-torsion coordinate
    did not cut the generator support by a factor of four on this
    field. A ratio equal to 1/4 is inside the predicted threshold
    and is not this negative. A zero M2, an unmatched cross-curve
    ratio, a degenerate b, a missing curve, and a timeout are not
    this negative.

  required_artifacts:
    - experiments/EXP-GFPN-c84e7d/runs/RUN-*/manifest.yaml
    - experiments/EXP-GFPN-c84e7d/runs/RUN-*/stdout.txt
    - experiments/EXP-GFPN-c84e7d/runs/RUN-*/stderr.txt
    - experiments/EXP-GFPN-c84e7d/runs/RUN-*/monomials.csv
    - experiments/EXP-GFPN-c84e7d/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        the two expansions disagree, the doubling of T fails, E0 has
        an order-2 point, a singular curve was scored, a Gröbner
        basis was counted in place of the generators, a zero M2 was
        replaced, the search continued past b = 0, or M3/M2 was
        interpreted while the cross-curve ratio was strictly outside
        [1/2, 2]
    - id: unmeasured_no_quintic
      when: every monic quintic over F_11 is reducible
    - id: unmeasured_no_E2
      when: no nonsingular pair has an F-rational point of order 2
    - id: unmeasured_degenerate_b
      when: E2 exists and b = 3 r^2 + A equals 0
    - id: unmeasured_no_E0
      when: E2 exists, b is not 0, and no nonsingular pair lacks an order-2 point
    - id: void_empty_support
      when: >-
        the instrument checks pass, both curves exist, b is not 0,
        and at least one M2 count is 0, or the t-eliminant is the
        zero polynomial
    - id: unmatched_curves
      when: >-
        the instrument checks pass, both M2 counts are at least 1,
        and M2(E2)/M2(E0) lies strictly outside [1/2, 2]
    - id: torsion_did_not_cut
      when: >-
        the instrument checks pass, both M2 counts are at least 1,
        M2(E2)/M2(E0) lies in [1/2, 2], and 4 M3 > M2(E2)
    - id: ratio_in_band
      when: >-
        the instrument checks pass, both M2 counts are at least 1,
        4 M3 <= M2(E2), and M2(E2)/M2(E0) lies in [1/2, 2]
  reading_rule: >-
    Name exactly one row, the first whose condition holds in the
    order listed. ratio_in_band is the only success row.
    torsion_did_not_cut is the concrete negative.
    void_empty_support does not confirm the threshold.
    unmatched_curves does not interpret M3/M2. The unmeasured rows
    are not ratios. instrument_failure is not a ratio. Record the
    three counts, both ratios or the reason a ratio is undefined,
    the quintic, the curve coefficients, b, and attack_claimed
    false beside the row. Those fields do not change the row.
