experiment:
  id: EXP-SSI-fe3f76
  version: 3
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: null
  hypothesis_note: >-
    Deliberate null: this is an additive design refinement for
    IDEA-20260806-9c2f80, not an executed test of a hypothesis and not an
    attack construction.
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  batch_id: BATCH-6554d6
  source_proposal: IDEA-20260806-9c2f80
  supersedes: EXP-SSI-1d0f36
  supersession_note: >-
    Additive successor incorporating the independent Validator and Red Team
    findings from BATCH-4f52ab. The predecessor remains immutable and is not
    evidence. This record repairs the design contract only; it does not alter
    any prior observation or authorize execution.
  title: >-
    Refined design-only contract for a fixed-advice classical per-prime OneEnd
    frontier, with typed advice encodings, explicit fiber accounting, and
    reproducible matched nulls

  objective: >-
    Define a reviewable symbolic and arithmetic contract for the named closed
    list in IDEA-20260806-9c2f80. The contract must distinguish a fixed
    p-dependent advice witness from the distribution used in a diagnostic,
    separate build cost from per-instance query cost, charge typed advice bytes
    and working memory, and make every null/control reproducible. If later
    approved, frozen, and executed, the work may emit conditional accounting
    rows only; it may not implement isogeny walks, claim a lower bound over all
    advice, infer a security result, or move a hardness exponent.

  claim_ceiling: >-
    At most a derivation about the pre-registered named constructions under the
    exact accounting conventions below. It cannot validate H-ADV-1, H-ADV-2,
    H-ADV-3, or H-ADV-4 by symbolic arithmetic; it cannot certify an
    all-advice lower bound; and it cannot transfer to EndRing, Isogeny,
    SQIsign, CSIDH security, or any deployed parameter claim.

  inputs:
    proposal: ledger/proposals/IDEA-20260806-9c2f80.yaml
    predecessor_contract: experiments/EXP-SSI-1d0f36/specification.yaml
    predecessor_predecessor: experiments/EXP-SSI-a6132d/specification.yaml
    prior_validator: >-
      coordination/goals/GOAL-SSI-001/batches/BATCH-4f52ab/reviews/TASK-20260809-6f34ac/validation_report.yaml
    prior_red_team: >-
      coordination/goals/GOAL-SSI-001/batches/BATCH-4f52ab/reviews/TASK-20260809-83623a/red_team_report.md
    frozen_source: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
    prior_evidence: ledger/evidence/EV-SSI-59f7a2.yaml
    prior_decision: ledger/decisions/DEC-20260805-596d71.yaml
    duplication_refresh: >-
      coordination/goals/GOAL-SSI-001/batches/BATCH-f68c05/tasks/TASK-20260809-b28c39/duplication_knowledge_audit.md
    catalogue_inputs:
      - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/S1.md
      - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/S2.md
      - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/Q3.md

  scope_and_instance_model:
    problem: >-
      A supersingular j-invariant E over F_{p^2} is the instance. The positive
      target is the classical OneEnd/EndRing setting with no published secret
      torsion images, SQIsign transcript, or CSIDH secret. SIDH/SIKE
      torsion-image recovery remains out of scope.
    vertex_set: >-
      V_p is the canonically encoded set of supersingular j-invariants in the
      declared representation. All set cardinalities below count distinct
      vertices after duplicate rejection; no estimate silently replaces a
      finite set by p when the distinction affects a control.
    advice_witness: >-
      For each prime p, A_p is fixed before the instance E is selected. A_p may
      depend on p but not on E, and it is not regenerated per query. The
      quantifier under review is therefore forall p exists fixed A_p forall
      E in V_p, with all query randomness conditioned on that fixed A_p.
    query_scope: >-
      T_q(A_p,E) is the expected cost over query-side randomness only, with E
      held at the worst case in V_p. Advice-generation randomness, if used to
      build A_p, belongs to T_build and is not averaged away. A future report
      must separately disclose whether a finite-sample diagnostic uses an
      average over random advice; that diagnostic may not be substituted for
      the universal quantifier.
    success_and_restart: >-
      A query attempt has target failure probability epsilon = 2^-40. The
      attempt budget includes graph-walk burn-in, walk steps, index lookup,
      candidate parsing, order validation, path pullback, saturation, and
      restart bookkeeping. The declared T_q is per successful-output target
      cost after charging inverse success probability; an attempt timeout is
      an infrastructure/contract failure, not a negative result.
    amortization: >-
      For Q independent instances using the same fixed A_p, total cost is
      T_build(A_p) + Q*T_q(A_p), and the reported amortized cost is
      T_q(A_p) + T_build(A_p)/Q. Q is an explicit axis, not an implicit
      free-advice assumption. The derivation must report the break-even Q.

  exact_parameterization:
    log2_p: [256, 512]
    sigma_grid:
      - {label: "0", numerator: 0, denominator: 1, mode: no_advice_control}
      - {label: "1/6", numerator: 1, denominator: 6, mode: treatment}
      - {label: "1/3", numerator: 1, denominator: 3, mode: treatment}
      - {label: "1/2", numerator: 1, denominator: 2, mode: treatment}
      - {label: "2/3", numerator: 2, denominator: 3, mode: treatment}
      - {label: "4/5", numerator: 4, denominator: 5, mode: collision_audit}
      - {label: "1", numerator: 1, denominator: 1, mode: full_advice_control}
    advice_size: >-
      For treatment rows sigma is an exact rational label and S = floor(p^sigma)
      logical entries, with a separately reported finite-vertex saturation
      S_eff = min(S, |V_p|) after duplicate rejection. sigma=0 is the
      distinguished S=0 control, not floor(p^0). sigma=1 is the S=p known-answer
      corner and is not evidence that a random maximal-order sampler enumerates
      V_p at that charge.
    balance_control: >-
      The S=p^(1/2) Delfs-Galbraith/MITM balance point is a separate exact
      known-answer control even though it is not an additional treatment row.
    incumbent: >-
      The incumbent baseline is T_inc = p^(1/3+o(1)) and its declared working
      memory is log2(M_inc_entries) = 92.5 under the cited conditional source.
      This is a model input, not a new measurement.
    arithmetic: >-
      Use exact integer and rational arithmetic for labels, exponents, floors,
      and comparisons. Decimal renderings are presentation only and must carry
      their exact rational labels alongside them.

  advice_representation:
    logical_entry_definition: >-
      S counts distinct logical records, not curves plus hidden auxiliary data.
      Every record has a declared byte layout, and shared indexes, deduplication
      tables, padding, failed-build attempts, and rejected duplicates are
      charged separately. Unused slots are not silently free.
    encoding_parameters:
      curve_id: >-
        Canonical serialized j-invariant with measured byte width b_j(p) recorded
        in the freeze receipt; the two F_p coordinates and any canonicalization
        header are included in b_j(p).
      order_tag: >-
        Canonical serialized candidate order with byte width b_ord(p), including
        representation and validation metadata.
      path_descriptor: >-
        Optional canonical walked-path descriptor with byte width b_path(p);
        if the query reconstructs a path instead, b_path(p)=0 and the
        reconstruction cost is charged in T_q.
      index: >-
        The lookup index has measured byte width b_idx(S,p), including collision
        handling and duplicate rejection metadata.
    branches:
      construction_a_order_tagged:
        record: [curve_id, order_tag, path_descriptor]
        build: >-
          Build and validate each distinct curve/order record; charge failed
          order-to-curve attempts, duplicate rejection, serialization, and
          index construction in T_build.
        query: >-
          Lookup the curve, validate the tagged order for that curve, then
          perform the declared pullback/saturation/output conversion.
      construction_b_order_tagged:
        record: [curve_id, order_tag, path_descriptor]
        status: >-
          Separate branch. It may be algebraically redundant with A only after
          its typed representation and build/query charges are compared.
      construction_b_membership_only:
        record: [curve_id, path_descriptor]
        status: >-
          Separate branch. A hit supplies membership only; the terminal
          small-delta/order procedure is charged after the hit and is not
          silently replaced by an order lookup.
      construction_c_pair_entry:
        record: [left_endpoint, right_endpoint, middle_descriptor]
        status: >-
          Pair-entry width, endpoint deduplication, and middle-table metadata
          are charged independently. C cannot inherit A's order-tagged cost.
    physical_memory: >-
      Report M_adv_bytes = S*b_entry + b_idx + b_shared + b_padding and
      M_work_bytes separately. Convert to log2 bytes using the measured widths;
      do not report logical entries as physical memory. Report build memory,
      query memory, and the incumbent's 2^92.5-entry model on separate axes.

  fiber_and_output_model:
    charged_fiber: >-
      For an advice element a and query budget t, R_t(a) is the set of distinct
      input vertices E in V_p for which the typed query using only a and at most
      t query work outputs an explicit admissible non-scalar OneEnd witness at
      E. Abstract ring membership without an output witness is not counted.
    union_rule: >-
      R_t(A) = union over a in A of R_t(a), with set union performed before
      counting. Overlaps are never double-counted. Shared indexes and shared
      path/table bits are charged once in the declared representation.
    pullback_rule: >-
      A future implementation must specify the path direction, field encoding,
      order validation, saturation, and conversion from the pushed order to the
      explicit OneEnd output. Those costs belong to T_q unless bytes are stored
      in the advice record. No closure assertion is treated as a proof here.
    ceiling: >-
      Any fiber comparison is restricted to the named typed branches. It is not
      a lower bound for arbitrary advice encodings or a theorem about all
      preprocessing schemes.

  heuristic_inventory:
    - id: H-ADV-1-W
      statement: >-
        Conditional worst-case-over-E hitting model for a fixed A_p, including
        its stated mixing, restart, pullback, and success-probability charges.
      status: unverified_conditional
      scope: symbolic_named_branches_only
      not_validated_by: random_set_diagnostic
      falsification: >-
        Any declared finite test or proof that violates the exact worst-case
        bound, or any ambiguity between fixed-advice and regenerated-advice
        expectations, invalidates the corresponding row.
    - id: H-ADV-1-R
      statement: >-
        Random distinct target sets at toy p have the declared diagnostic
        hitting-time distribution under the toy walk model.
      status: unverified_diagnostic
      scope: random_sets_and_sampled_start_vertices_only
      cannot_establish: H-ADV-1-W
    - id: H-ADV-2
      statement: >-
        The declared order-to-curve construction and its validation cost are
        available under the specified classical model.
      status: unverified_conditional
      falsification: >-
        A missing construction, failed output-type conversion, or charged cost
        outside the declared build/query axes invalidates that branch.
    - id: H-ADV-3
      statement: >-
        The named resolution-fiber growth bound holds for the specified typed
        branch and not for arbitrary advice encodings.
      status: unverified_conditional
      falsification: >-
        A valid closed-list counterexample with the same representation and
        accounting invalidates only that branch and its dependent rows.
    - id: H-ADV-4
      statement: >-
        Construction C endpoint pairs satisfy the declared near-uniform pair
        model after accounting for orientation, middle factors, and endpoint
        correlations.
      status: unverified_conditional
      scope: construction_c_pair_branch_only
      diagnostic_null: >-
        Independently generated endpoint pairs matched to the treatment
        marginals and the same pair-table access path.
      falsification: >-
        A pre-registered pair-collision or binned-distribution statistic outside
        its finite-sample tolerance invalidates C; it does not invalidate A/B.

  proof_search_map_audit:
    status: refined_for_bounded_closed_list_only
    bottleneck: >-
      Growth of the unique, output-producing resolution fiber per typed advice
      byte and per charged query budget.
    baseline_reproduction: >-
      S=0 returns the incumbent; S=p^(1/2) returns the declared MITM balance
      control; both are known-answer controls and not measurements.
    observation_collision: >-
      The former A/B collision at (p^(4/5),p^(1/5)) is retained only as a
      representation-collision audit. Order-tagged B and membership-only B are
      separate branches; no redundancy conclusion is permitted until their
      bytes and build/query charges agree.
    quantifier_order: >-
      The formal symbolic quantifier is forall p exists fixed A_p forall E in
      V_p, with expectation only over query randomness. H-ADV-1-R is explicitly
      weaker and cannot validate H-ADV-1-W.
    method_ceiling: >-
      Certify only the named typed branches. The nearby oriented/CSIDH object is
      a non-gating diagnostic because its problem type and frontier are not
      sufficiently pinned to serve as a method-ceiling proof gate.
    proof_obligations:
      - "Construction A build/query charge and H-ADV-2 status"
      - "Explicit output-producing pullback and saturation cost"
      - "Unique union fiber R_t(A) with overlap and shared-byte accounting"
      - "Construction C pair law H-ADV-4 and matched pair null"
      - "Construction B typed branch mapping at every exact sigma label"
      - "Composite min-row and monotonicity arithmetic"
      - "Build cost, break-even Q, and physical byte conversion"

  controls:
    - id: CTRL-S0
      kind: known_answer
      forced_result: "T_inc = p^(1/3+o(1)); S=0 has no advice lookup"
      order: before_all_treatment
      failure_action: terminate_without_treatment_rows
    - id: CTRL-S-P-HARDCODED
      kind: known_answer
      forced_result: "full distinct V_p order-tagged table has polynomial query"
      note: >-
        This is a symbolic corner control, not a claim that the random sampler
        builds it at the same cost.
    - id: CTRL-RANDOM-ADVICE
      kind: matched_null
      order: before_treatment
      record_layout: >-
        Exactly the same fixed-width [curve_id, payload, validity_tag, optional
        path_descriptor] record and index width as the selected treatment
        branch. curve_id values are sampled without replacement from V_p;
        payload bytes are generated independently with SHAKE256(seed || index),
        and validity_tag=0 marks that no order data are attached.
      query_path: >-
        The same lookup, parse, fixed-cost validation, walk, restart, and budget
        accounting path is used; the null returns NO_WITNESS at the output gate
        without interpreting payload as an order.
      seed: >-
        A freeze receipt must record a non-secret 32-byte seed before any
        treatment row. The seed is not reused for treatment generation.
      forced_result: "T_inc at every declared S; any improvement invalidates the instrument"
      failure_action: invalidate_instrument_and_report_no_treatment
    - id: CTRL-SHUFFLED-FIBER
      kind: negative_control
      record_layout: >-
        Treatment curve_id values and order payloads are preserved byte-for-byte
        but order payloads are assigned to different curve_id values by a
        recorded deterministic permutation with no fixed point where possible.
      query_rule: >-
        The validator checks the curve/order identity before accepting a witness;
        reinterpretation as an order for another curve is forbidden and charged
        as a failed candidate.
      forced_result: "T_inc within the declared finite-size tolerance"
    - id: CTRL-C-PAIR-NULL
      kind: matched_pair_null
      applies_to: construction_c_pair_entry
      record_layout: >-
        Independently generated endpoint pairs match the treatment marginals,
        pair count, endpoint encoding, and lookup path but remove the declared
        middle-factor correlation.
      forced_result: >-
        The pair statistic must match the pre-registered null tolerance; failure
        invalidates Construction C rows only.
    - id: CTRL-NEARBY-ORIENTED
      kind: non_gating_sanity_diagnostic
      applies_to: typed_oriented_nearby_object_only
      forced_result: null
      note: >-
        This diagnostic is not a proof-map gate and cannot refute or validate
        the SSI frontier because its problem type is distinct. Its full input,
        baseline, and output encoding must still be recorded if run.

  pair_and_distribution_diagnostics:
    H-ADV-4_statistic: >-
      Before any C treatment row, compare a pre-registered binned endpoint-pair
      collision statistic against CTRL-C-PAIR-NULL with identical marginals,
      seed count, bins, and table access. The report must state the finite-sample
      tolerance, sample count, and whether the diagnostic is descriptive or
      gating. No theorem is inferred from a pass.
    H-ADV-1-R_statistic: >-
      At toy p only, compare the sampled start-vertex hitting-time CDF for
      random distinct target sets against the declared toy null. Report the
      sampled-set scope separately from the fixed-A_p worst-case symbolic row.

  metrics:
    primary:
      - "T_q and T_amort for every typed branch at exact sigma labels"
      - "T_build, Q_break_even, M_adv_bytes, and M_work_bytes"
      - "CTRL-S0, full-advice, random-advice, shuffled-fiber, and C-pair-null verdicts"
      - "unique R_t(A) fiber mass without overlap double counting"
    secondary:
      - "log2 advice bytes and query-cost exponent at log2(p)=256,512"
      - "Construction C minus A exponent gap under H-ADV-4, explicitly conditional"
      - "finite-size duplicate and saturation counts"
      - "non-gating nearby diagnostic output, if run"

  preregistered_prediction:
    quantity: T_min(S)
    formula: "min(T_inc, T_branch(A_tagged), T_branch(B_tagged), T_branch(B_membership), T_C_pair)"
    prediction_status: conditional_symbolic_input_not_observation
    exact_sigma_labels: ["0", "1/6", "1/3", "1/2", "2/3", "4/5", "1"]
    random_advice_null: "T_inc at every declared S"
    construction_c_gap: "reported only conditional on H-ADV-4 and the typed pair accounting"

  stages:
    - id: stage-0-contract-audit
      purpose: >-
        Validate exact labels, typed record widths, control encodings, quantifier
        annotations, proof-map obligations, and source hashes before arithmetic.
      method: python3_standard_library_only
      budget_seconds: 1800
      stop_rules:
        - "stop on any missing exact encoding or control seed field"
        - "stop if fixed-A_p and random-set diagnostic scopes are conflated"
        - "stop if a branch lacks build/query/memory charges"
    - id: stage-1-arithmetic
      purpose: >-
        If separately approved, emit conditional rows and controls from exact
        symbolic inputs; no cryptographic graph or isogeny computation.
      method: python3_standard_library_only
      budget_seconds: 1800
      budget_memory_gb: 1
      parameters: {log2_p: [256, 512], sigma_labels: ["0", "1/6", "1/3", "1/2", "2/3", "4/5", "1"]}
      stop_rules:
        - "no execution before freeze and Coordinator authorization"
        - "stop on random-null, S=0, or exact-arithmetic gate failure"
        - "stop if any row silently drops build, memory, or representation cost"
    - id: diagnostic-h-adv
      purpose: >-
        Optional toy diagnostic for H-ADV-1-R and H-ADV-4 only, with separately
        recorded seeds and no transfer to the universal symbolic claims.
      method: python3_standard_library_only
      budget_seconds: 600
      budget_memory_gb: 1
      status: not_authorized

  budget:
    wall_clock_seconds_per_run: 4200
    total_cpu_hours: 0.2
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    note: >-
      These are prospective task limits only. This successor is not frozen and
      execution is unauthorized.

  stopping_rules:
    - "No stage executes while frozen=false or execution_authorized=false."
    - "Commit and verify the random-advice and shuffled-fiber control definitions before any treatment row."
    - "Stop at the first exact-label, output-type, null, or accounting failure and preserve the partial artifact."
    - "Any sub-1/3 closed-list row requires independent review-breakthrough at max before promotion."

  invalidation_rules:
    - "Change exact sigma labels, typed record layouts, controls, or formula after any observation."
    - "Use numpy, Sage, network access, or isogeny implementation in Stage 0/1."
    - "Claim an all-advice lower bound, attack, security result, or exponent move."
    - "Treat H-ADV-1-R as validation of H-ADV-1-W."
    - "Treat the nearby oriented diagnostic as a method-ceiling proof."
    - "Omit build cost, duplicate rejection, physical bytes, pullback/saturation, or break-even Q."

  success_criterion: >-
    If separately approved, frozen, and validly executed: every exact label and
    typed branch is emitted; all build/query/memory axes are complete; S=0 and
    the matched random-advice null precede treatment; shuffled and C-pair null
    controls pass their declared finite-size gates; and all conditional
    assumptions remain explicitly attached to their rows. This is only a
    bounded design/accounting result, not attack or security evidence.

  falsification_criterion: >-
    Terminate or invalidate if any exact encoding is missing, fixed-advice and
    random-set quantifiers are conflated, S=0 or the matched random null fails,
    shuffled-fiber identity checks are bypassed, C's pair null fails, a closed
    list row violates its declared arithmetic, or a required build/memory/output
    cost is omitted. Timeout, crash, unavailable backend, or dependency failure
    is infrastructure only.

  required_artifacts:
    - "Additive correction report with predecessor and review hashes"
    - "Corrected successor specification and freeze receipt if later frozen"
    - "Exact typed advice/control encoding table"
    - "Current-corpus catalogue path and duplication/proof/control audit"
    - "Pre-run control seed/hash commitment if later authorized"
    - "Machine-readable Stage 0/1 output only if separately authorized"
    - "Exact command, environment, stdout, stderr, and resource receipt if run"
    - "Coordinator snapshot before independent review and ledger archive after review"

  scale_relevance:
    tier: derivation
    justification: >-
      Stage 1 is symbolic standard-library arithmetic and optional diagnostics
      are explicitly toy/model checks. No cryptographic computation occurs and
      no crypto-scale evidence or security transfer is claimed.
    correspondence: null

  assigned_to: executor
  approved_by: null

