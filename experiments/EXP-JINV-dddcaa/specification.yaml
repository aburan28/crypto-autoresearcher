experiment:
  id: EXP-JINV-dddcaa
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-bfa86b
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: The POSITIVE control for lane L3 - plant a known-answer sub-birthday weakness and require
    the instruments to find it at the predicted cost, because an instrument that cannot detect a real
    weakness produces void negatives - built on the boundary result that the GLV coordinate change
    is a measure-preserving bijection of the key space, so no j=0-specific key distribution beats
    the same-entropy generic one in EXPONENT, and the one lever in this lane that does move an exponent
    (key entropy) lies OUTSIDE the campaign's R1-R8 resource taxonomy entirely
  status: draft
  objective: "(A) WHY A POSITIVE CONTROL IS NOT OPTIONAL HERE. docs/inventor-protocol.md section 3\
    \ requires that a signal be checked against a null before it is believed. It does not, by itself,\
    \ require the converse - that the instrument be shown able to see a signal that IS there - but\
    \ DECOMPOSITION.md's L14 states both directions: \"the instrument must fail to detect a signal\
    \ in a matched random object, AND must detect a PLANTED signal - both directions.\" Lane L3 is\
    \ about to produce a series of negatives (see the other eight proposals in this batch, of which\
    \ at least five predict their own negative). A NEGATIVE FROM AN INSENSITIVE INSTRUMENT IS NOT\
    \ EVIDENCE. This record supplies the planted signals that make those negatives citable.\n(B) THE\
    \ KEY-SIDE PLANT, WITH ITS COST KNOWN IN ADVANCE. On a j=0 curve, draw the secret as k = k1 +\
    \ k2*lambda mod N with (k1, k2) uniform in a box of side S = ceil(N^{alpha/2}) for a declared\
    \ alpha in (0, 1), instead of k uniform in Z/N. The support has about N^alpha elements, so the\
    \ best generic search costs Theta(N^{alpha/2}) - a genuine, known-answer, sub-birthday weakness\
    \ whose exponent is fixed by construction. The instrument's job is to recover k at that cost using\
    \ a two-dimensional Gaudry-Schost-style search over the box. PASS means the L3 pipeline can see\
    \ a real exponent-level structure when one is present; FAIL means every L3 negative in this batch\
    \ is VOID rather than negative.\n(C) THE BOUNDARY RESULT THIS CONTROL ALSO ESTABLISHES, AND IT\
    \ IS THE RECORD'S MATHEMATICAL CONTENT. It is tempting to read (B) as \"j=0 curves are weak against\
    \ structured keys\". They are not, and the reason is exact. The GLV decomposition is the bijection\n\
    \    Z/N  <->  a fundamental domain of the lattice\n              L = {(a,b) in Z^2 : a + b*lambda\
    \ = 0 mod N},\nwhich has determinant N (this is H-ENDO-001's index-pinning result P1, and it is\
    \ rigorous rather than heuristic because lambda_1 = 1 is a unit). A BIJECTION PRESERVES CARDINALITY.\
    \ Therefore a key distribution supported on a set of size M has support of size M in either coordinate\
    \ system, and the birthday cost of searching it is Theta(sqrt(M)) either way. CONSEQUENTLY:\n\
    \  NO KEY DISTRIBUTION ON A j=0 CURVE HAS A SMALLER SEARCH EXPONENT THAN THE\n  SAME-ENTROPY DISTRIBUTION\
    \ ON A GENERIC CURVE.\nWhat DOES change is the SHAPE of the support - an interval becomes a two-dimensional\
    \ box - and hence the CONSTANT of the search algorithm (one-dimensional kangaroo versus two-dimensional\
    \ Gaudry-Schost), plus the sqrt(|Aut|/2) = sqrt(3) automorphism discount that applies to both.\
    \ Constants, not exponents. [derived in this record from the bijection; elementary.]\n(D) THE\
    \ OBSERVATION ABOUT THE CAMPAIGN'S OWN TAXONOMY, WHICH IS WORTH MORE THAN THE CONTROL. The one\
    \ lever in this entire lane that genuinely moves an exponent is the ENTROPY OF k: alpha in (B)\
    \ is a free parameter and the cost exponent is alpha/2. That lever is not R1, not R2, ..., not\
    \ R8. The R1-R8 taxonomy in DECOMPOSITION.md section 2 enumerates CURVE-SIDE resources - coordinates,\
    \ equation, ring, isogeny graph, torsion, lifts, pairings, multi-instance structure - and the\
    \ key distribution is not among them, because it is not a property of the curve at all. THIS IS\
    \ A GAP IN THE DECOMPOSITION, IT IS BENIGN (the campaign is about curve structure, and a low-entropy\
    \ key is a protocol failure rather than a curve weakness), AND IT SHOULD BE RECORDED RATHER THAN\
    \ DISCOVERED LATER BY SOMEONE MISFILING A KEY- DISTRIBUTION RESULT AS A CURVE RESULT. Recording\
    \ it is this proposal's second deliverable.\n(E) WHAT IS CLAIMED BEYOND THE sqrt(|Aut|) CONSTANT:\
    \ NOTHING ABOUT CURVES. The exponent alpha/2 in (B) is planted by the experimenter and is a property\
    \ of the instance generator, never of the curve; presenting it as a curve result would be exactly\
    \ the category error (D) exists to prevent. Filed as a control and as a boundary statement."
  resource_label: '"audit: consumes no resource (positive control)". The planted arm changes the KEY
    DISTRIBUTION, which by claim (D) is outside R1-R8 by construction - and that exclusion is itself
    part of the deliverable rather than an oversight.'
  admissibility: admissible
  admissibility_argument: 'A control names no attack mechanism and so cannot be inadmissible. Its
    relationship to the filter is instructive and is stated rather than assumed: the planted weakness
    is REAL - it genuinely lowers the search exponent to alpha/2 - and it is nonetheless outside the
    filter, because the filter asks what non-generic CURVE resource a mechanism consumes and this
    consumes none. A low-entropy key is weak in the generic group model too; Shoup''s bound is Omega(sqrt(|support|)),
    not Omega(sqrt(N)). So the plant is simultaneously admissible, real, and irrelevant to the campaign''s
    question - which is precisely the configuration that makes it a good positive control, since it
    tests sensitivity without contaminating the research claim.'
  reachability_gate: 'NOT APPLICABLE AS A WALK: no isogeny is computed and the curve is fixed. The
    gate is nonetheless worth stating in its key-side form, because it is the exact analogue and it
    is the boundary this record draws: the planted weakness is not REACHABLE BY AN ATTACKER AT ALL
    - it must be handed over by the instance generator. An attacker facing a uniformly drawn k cannot
    manufacture a low-alpha instance at any cost, just as an attacker facing a generic curve cannot
    walk to a j = 0 one at any cost (T4). Both halves of this lane''s exponent story are therefore
    gated by something the attacker does not control, which is the cleanest statement of why L3 is
    a calibration lane rather than an attack lane.'
  inputs:
    procedure: 'CHEAPEST VALID DISCRIMINATOR: THE THREE-POINT SLOPE CHECK ON ONE CURVE FAMILY. Fix
      one j=0 toy curve at 24 bits. Generate planted instances at alpha = 1.0, 0.7 and 0.4 and run
      the two-dimensional detector on all three. If the log-log slope is 1/2 and alpha = 1.0 reproduces
      the baseline, the instrument is calibrated well enough to underwrite this lane''s negatives
      at that field size. Three solves at 24 bits, one of which (alpha = 0.4) is nearly free, and
      the whole calibration is done. Step 4''s fixed-support shape comparison is the next cheapest
      and is the part with genuine mathematical content, since it is the only falsification route
      for claim (C). Step 5''s curve-side plant is separable and can be dispatched with whichever
      L3 measurement lands first; it does not need this record''s search machinery.'
    mechanism: 'STEP 1 (the plant, low implementation). Extend the toy instance generator so that
      a j=0 (and j=1728, and generic) instance can be produced with k drawn from a declared distribution:
      uniform on Z/N (alpha = 1, the built-in null), uniform on an interval of length N^alpha, or
      uniform on a GLV box of side N^{alpha/2}. The distribution is recorded in the instance and is
      NOT disclosed to the solver.

      STEP 2 (the detector). Implement two searches: a one-dimensional kangaroo/BSGS over an interval,
      and a two-dimensional Gaudry-Schost-style search over a box in the GLV coordinates, both with
      the automorphism quotient available on special-j curves. Each returns k with a certificate re-verified
      independently by harness/toycurve.py (docs/claims-and-verification.md).

      STEP 3 (the sweep, and it is the deliverable). For alpha in {1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4}
      and three field sizes and three curve families, measure recovery cost in F_p multiplications.
      Fit log(cost) against alpha*log(N). PREDICTED SLOPE EXACTLY 1/2 in every family. The intercept
      must differ between families by exactly the automorphism factor, i.e. by sqrt(3) between generic
      and j=0 and sqrt(2) between generic and j=1728, and by nothing else.

      STEP 4 (THE BOUNDARY TEST, WHICH IS CLAIM (C) MADE FALSIFIABLE). At a FIXED support size M,
      compare three shapes: an interval of length M on a generic curve; an interval of length M on
      a j=0 curve; a GLV box with M points on a j=0 curve. Predicted: all three cost Theta(sqrt(M)),
      differing only by constants, with the j=0 arms cheaper by at most sqrt(3). A SHAPE THAT COSTS
      MATERIALLY LESS THAN sqrt(M) WOULD REFUTE CLAIM (C) and would be the one genuinely exponent-relevant
      event this lane could produce - so this step is both a control and a real experiment, which
      is why the proposal is not merely housekeeping.

      STEP 5 (the curve-side plant, a second and independent sensitivity test). Inject an artificial
      curve-side signal into the L1/L3 variance instrument: construct a synthetic "curve" whose measured
      cost functional is deliberately biased by a declared amount d, and verify the stratified analysis
      of IDEA-20260807-94f953 and the null battery of IDEA-20260807-a3d644 recover d within their
      stated confidence intervals, for d swept down to the smallest effect the lane intends to claim.
      This calibrates the MINIMUM DETECTABLE EFFECT SIZE of every L3 functional, which is a number
      no L3 negative can be interpreted without and which no other proposal in this batch produces.

      STEP 6 (record the taxonomy gap of claim (D)) as a note for the Coordinator, with the recommendation
      that it be handled by an explicit scope sentence in DECOMPOSITION.md rather than by adding an
      R9 - because the key distribution is genuinely not a curve resource and adding it would blur
      the filter that makes the taxonomy useful. That recommendation is advisory; only the Coordinator
      amends the decomposition.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - alpha = 1.0 built-in null on every family
  - generic-curve arm at every alpha
  - wrong-lambda GLV box, which must not be detected
  - pseudorandom-subset plant, a real weakness the detector must MISS, to bound what a pass licenses
  - matched rho and matched BSGS at alpha = 1 as the baseline anchor
  - certificate re-verification of every recovered k
  - 'NULL OBJECT (from the proposal): THE BUILT-IN NULL IS alpha = 1.0 - a uniform key, i.e. no plant
    at all. The instrument must report cost Theta(sqrt(N)) there and must NOT report a detected structure.
    An instrument that "detects" a plant in a uniform instance is producing false positives and every
    L3 negative it underwrites is worthless in the opposite direction from the usual failure. SECOND
    NULL: the generic-curve arm at every alpha. The detection slope must be 1/2 there too - the plant
    is not a curve effect and must be detected equally well on a curve with no automorphism. If the
    detector only works on j=0 curves, it is exploiting the plant''s coordinate system rather than
    its entropy and Step 4''s boundary test is invalid. THIRD NULL: a plant in the WRONG coordinates
    - a GLV box drawn with a random lambda'' that is not the curve''s eigenvalue. The two-dimensional
    detector must FAIL there, because the box is not a box in the true coordinates. Success would
    mean the detector is not using the GLV structure at all. DECAY PARAMETER: alpha. Detection must
    DEGRADE MONOTONICALLY as alpha rises toward 1, vanishing at alpha = 1. A detector whose reported
    "signal" is flat across alpha is the canonical artifact tell and its outputs are void.'
  independent_variables: []
  metrics:
    primary:
    - recovery cost in F_p multiplications per (family, alpha, size, seed)
    - fitted slope and intercept per family, with confidence intervals
    - fixed-support shape comparison (Step 4), all three arms
    - pass/fail of the built-in null, the wrong-lambda control and the pseudorandom-subset control
    secondary:
    - minimum detectable effect size per L3 functional (Step 5)
    - certificate pass rate, which must be 100 percent
    - the declared plant distribution per instance, recorded but withheld from the solver until after
      the run
  heuristic_under_test: null
  preregistered_prediction:
    quantity: fitted slope of log(recovery cost) against alpha*log(N), per curve family
    formula: 0.50 within 0.05 in all three families, with the three slopes agreeing within 0.05 of
      each other. A family-dependent slope refutes claim (C) and is the single most important possible
      outcome of this record.
    source: pre-registered in IDEA-20260807-bfa86b before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - IMPLEMENTATION CONSTANTS DOMINATE AT TOY SCALE. Absolute costs at 24 bits are dominated by Python
    overhead. Only slopes are interpreted, and the slope fit needs at least three alpha values and
    at least three field sizes before it means anything.
  - THE PLANT'S SHAPE IS THE PLANT'S LIMITATION. A pass shows the instrument sees boxes and intervals.
    The pseudorandom-subset control exists to make that limit explicit and must be reported next to
    every pass, or the calibration will be over-read.
  - THE AUTOMORPHISM DISCOUNT AND THE PLANT INTERACT. On a j=0 curve at small alpha the box can be
    small enough that the automorphism identifications fold parts of it onto itself, changing the
    effective support. The box is chosen inside a fundamental domain for the automorphism action,
    and the choice is recorded, or the sqrt(3) intercept comparison is confounded.
  - alpha NEAR 1 IS UNINFORMATIVE by construction. The sweep must reach 0.4 or below for the slope
    to be identified, and budget must be allocated accordingly rather than spent on the expensive
    high-alpha end.
  - STEP 5's SYNTHETIC BIAS IS NOT A CURVE. It calibrates the ANALYSIS, not the curve-measurement
    pipeline end to end. A separate plant injected at the curve level would be stronger and is named
    here as a possible extension rather than claimed as done.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 0.50 within 0.05 in all three families, with the three slopes agreeing within
    0.05 of each other. A family-dependent slope refutes claim (C) and is the single most important
    possible outcome of this record.
  falsification_criterion:
  - The fitted slope differs from 1/2 by more than 0.05 in any family. Either the detector is wrong
    or claim (C) is; both must be resolved before any L3 negative is reported.
  - 'The three families'' slopes differ from each other by more than 0.05. Claim (C) is refuted: the
    exponent depends on the curve family, which would be the lane''s first exponent-level result and
    requires review-breakthrough handling under AGENTS.md rule 12.'
  - Any Step 4 arm costs materially below sqrt(M). Claim (C) refuted; halt.
  - The built-in null at alpha = 1 reports a detection. False positive; the instrument is void.
  - The wrong-lambda control is detected. The detector is not using the curve's structure and Step
    4 is meaningless.
  - The detector cannot recover the planted key at alpha = 0.4 within budget. THE L3 INSTRUMENT IS
    INSENSITIVE AND EVERY NEGATIVE IN THIS BATCH IS VOID RATHER THAN NEGATIVE - which is the outcome
    this record exists to make visible, and it is a serious one.
  - Any recovered k fails certificate verification. Run INVALID, not negative.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-bfa86b
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
