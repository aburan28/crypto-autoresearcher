# EXP-BINSTD-b54ec9
# Order-163 arithmetic. No solver.
# Approved by DEC-20261002-2c5110.
experiment:
  id: EXP-BINSTD-b54ec9
  hypothesis_id: H-BINSTD-0b4db8
  source_idea: IDEA-20261001-b98944
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Order-163 arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-2c5110
  objective: >-
    Check the residues of the powers of 2 modulo 163, the order 162,
    and the excess of 7/2000 over 1/289.
  inputs:
    modulus: 163
    remainder_8: 3
    exponents: [2, 6, 18, 54, 81, 162]
    residues: [4, 64, 40, 104, 162, 1]
    product_residues: [104, 40, 64, 4, 2]
    product: 162
    exponent_sum: 81
    order: 162
    dimensions: [0, 1, 162, 163]
    order_131: 130
    square_17: 289
    written_num: 7
    written_den: 2000
    cross_gap: 23
    common_den: 578000
  controls:
    - >-
      The residue of 2^81 is 162, not 1. Reporting the order as 81
      invalidates the run.
    - >-
      The residues of 2^2, 2^6, 2^18 and 2^54 are 4, 64, 40 and 104.
      Reporting any of them as 1 invalidates the run.
    - >-
      The order is 162. The stable dimensions are 0, 1, 162 and 163.
      Reporting another dimension invalidates the run.
    - >-
      The square 17^2 is 289, and 7/2000 exceeds 1/289 by 23/578000.
      Reporting the two ratios as equal invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {order, ratio}
    - route in {squaring, product}
  metrics:
    primary:
      - order
      - implementations_agree
    secondary:
      - residue_81
      - ratio_gap
      - order_131
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The order of 2 modulo 163 is 162.
    formula: >-
      Square until the exponents 2, 6, 18, 54, 81 and 162 are reached.
      The order is 162 when 2^162 is 1 and none of the earlier checked
      residues is 1. The cross difference of 7/2000 and 1/289 is 23.
    source: >-
      IDEA-20261001-b98944 states the order 162, read 2026-10-02. The
      residues were computed in this design session. That computation
      is not a run. No solver was run.
  scale_relevance:
    tier: toy
    justification: Six modular residues and one rational comparison. No transfer to a search.
    correspondence: null
  tail_checks:
    - The order of 2 modulo 131, which is 130, is required. A check that stops at 163 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the residue of 2^81 is not 162, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The order is reported as 81.
    - Any of the residues 4, 64, 40 and 104 is reported as 1.
    - A stable dimension other than 0, 1, 162 or 163 is reported.
    - 7/2000 is reported as equal to 1/289.
    - A solver is run or a conflict count is measured.
  success_criterion: >-
    Both runs agree that the six residues are 4, 64, 40, 104, 162 and
    1, that the order is 162, that the order modulo 131 is 130, and
    that 7/2000 exceeds 1/289 by 23/578000.
  falsification_criterion: >-
    The runs agree, 2^81 stays congruent to -1, and the order is not
    162.
  required_artifacts:
    - experiments/EXP-BINSTD-b54ec9/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-b54ec9/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-b54ec9/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-b54ec9/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-b54ec9/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-b54ec9/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any solver, conflict count, or orbit encoding.
    - Any claim that a search beats a walk.
    - Any measured ratio from an archived finding.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
