experiment:
  id: EXP-ECRANK-73275e
  hypothesis_id: H-ECRANK-36d8d7
  version: 1
  recorded_at: '2026-09-06'
  designed_by: TASK-20260906-387574
  converts_idea: null
  opening_decision: DEC-20260906-8ab17b
  title: >
    Draw-support audit and prescribed-square construction at n = 6/8: attribute
    the EXP-ECRANK-76a70d zero to sampler geometry vs square-pattern density, then
    test the construction-side reversal of the measured obstruction.
  status: analyzed
  approved_by: coordinator
  approval_note: >
    APPROVED 2026-09-07 by the Coordinator under AGENTS.md standing user
    authorization of 2026-09-06 ('all is approved. ideas/experiments should
    be always approved'), recorded in DEC-20260907-12086e. This approval
    discharges the goal-head approval step of BATCH-45eed3 / DEC-20260906-98315b
    without a per-experiment user confirmation: that earlier gate is
    superseded prospectively by the standing authorization. Protocol
    completeness checked before this mark: inputs, controls IV-1..IV-9,
    independent variables, primary/secondary metrics, seeds 760806/760808/
    760810/760812, budget (8 runs, 7200 s, 8 GB, 1.0e8 counted ops),
    stopping and invalidation rules, decidable success/falsification
    criteria, and required artifacts are all present; version stays 1.
    Exactly three gate fields change (status, approved_by, approval_note);
    every protocol field is untouched. Executor handoff:
    TASK-20260907-2a3331. Any later protocol change is a versioned
    protocol_amendment under experiments/EXP-ECRANK-73275e/amendments/,
    never an edit of this frozen contract; executed runs are never
    re-scored. PRE-APPROVAL NOTE, PRESERVED VERBATIM: "DESIGNING IS NOT
    APPROVING. This frozen contract sits at approved_by null, status
    review_required. Approval requires a committed Coordinator decision
    (with the user-confirmation gate used for EXP-ECRANK-76a70d) in a later
    step; no run of this experiment is authorized until then."
  analyzed_by: coordinator
  analyzed_at: '2026-09-08'
  analyzed_note: >
    Lifecycle transition approved -> analyzed (experiment state machine) on
    DEC-20260908-d361ab / EV-ECRANK-2222bd under TASK-20260908-42eb79. NOT a
    protocol change: version stays 1 and every protocol field is untouched.
    The review round identified control-expectation defects (IV-1/F4 textual
    conflict resolved by Reading C; the n=6 d=(1..1) control objects are
    conics so degenerate_deg_s_2 is the correct rejection; n=8 shortfalls are
    F_l-certifier prime-bound limits). Repairs come by versioned
    protocol_amendment under experiments/EXP-ECRANK-73275e/amendments/, never
    by editing this contract; executed runs are never re-scored.
  successor_of: EXP-ECRANK-76a70d
  successor_note: >
    Versioned successor to the analyzed predecessor. Carries the eleven
    successor_contract_requirements of DEC-20260906-7448cf, each tagged
    [SR-1]..[SR-11] below. Science: (1) the J4-F3 draw-support audit, (2) the
    construction-side prescribed-square search (n = 6 first, then n = 8).
  objective: >
    Decide, with possible negative outcomes, (M-A) whether the predecessor's
    zero-instance arms are attributable to the draw stream's geometry (in-box
    draws + full support + planted meets) rather than to square-pattern
    incidence density, and (M-B) whether prescribing the square pattern and
    solving the n - 5 quadratic ellipticity conditions by construction exhibits
    certified instances at n = 6 (primary) and n = 8 (secondary) inside toy caps.
  inputs:
    audit_source: >
      Snapshot-bound raw data of EXP-ECRANK-76a70d at commit
      a20a49b6adbcce51893c1221dbd69cdcd486ad9d: experiments/EXP-ECRANK-76a70d/runs/
      RUN-ECRANK-76a70d-R3-armB/ (manifest, raw-result.json, checkpoints, stdout),
      source/run_arm.py and run_common.py (the draw stream's declared
      construction: seeds, sub-boxes, H schedule, RNG usage). The audit READS
      these committed bytes and reconstructs the stream; it never re-simulates
      from memory and never modifies them.
    support:
      - -1
      - 2
      - 3
      - 5
      - 7
      - 11
      - 13
    b_tuples: >
      affine normal form b_1 = 0, b_2 = 1; b_3..b_n distinct integers in
      [-20, 20] \ {0, 1}; seeded order, NO adaptive reordering. Sample sizes:
      n = 6 arm 10^4 b-tuples; n = 8 arm 10^4 b-tuples.
    audited_b_tuples: >
      Deterministic selection, frozen here: the first three b-tuples of the
      R3-armB record stream (b-stream order) as recorded in the snapshot-bound
      raw data. Named AT-0, AT-1, AT-2 by stream position. No other selection
      rule is permitted.
    r_heights: >
      nested boxes H in {10^2, 10^3, 10^4} at n = 6 (top H6 = 10^4) and
      H in {10^2, 10^3} at n = 8 (top H8 = 10^3); counts cumulative over nested
      boxes and reported per H.
    engine: >
      the M3 family of H-ECRANK-36d8d7 (parent H-ECRANK-ee6e0e M2/M3): after
      prescribing the pattern (r_n carries it), ellipticity is the n - 5
      quadratic vanishing conditions on g's coefficients; at n = 6 a single
      univariate quadratic in box, at n = 8 a 3-diagonal-quadratic system with
      Bézout <= 8 candidate intersections, all solved exactly over Q.
    solver: >
      exact rational algebra (fractions.Fraction, stdlib only); the n = 8 system
      is solved by exhaustive Bézout intersection enumeration within the
      coefficient box (NOT sampled); NO Groebner machinery, NO PARI, NO network.
    certification_machinery: >
      committed: quartic_reduction / cubic_to_weierstrass (built-in exact
      on-curve rechecks), verify_certificate.py-style exact checks, the explicit
      transport factor (post-XOR-fix), Mazur non-torsion (m*P != O, m = 1..12),
      Kummer [K:Q] = 8 via 7 exact integer square tests, the exact
      F_l-reduction within-class certifier (numerical regulator as cross-check
      only, never as the certificate).
    null_family: >
      a provably infeasible variant of the ellipticity system for R6: the n = 6
      quadratic with its constant term sign-forced so no rational in-box solution
      can exist (the executor derives the specific null family from the committed
      d = 1 closed form, records the proof of infeasibility in the run record,
      and freezes it in the run's source before any R6 step).
  controls:
    - id: IV-1
      control: known-false d = (1, 1, ...) Mestre degeneration (R7), n = 6 and n = 8; certified totals must equal n - 1 (5 and 7); failure voids ALL runs.
    - id: IV-2
      control: arm replay R4 (same seed 760806 as R3) must reproduce R3's instance list, counts, and op ledger bit-for-bit.
    - id: IV-3
      control: planted yield R8 -- instances planted from the R7 family (named seed 760808 [SR-5]) must be detected by the construction solver with the exponent gate under the FROZEN window [1 - log10 2, 1 + log10 2] = [0.699, 1.301] and per-decade ratios in [5, 20] [SR-6]; failure voids R3/R5 readings.
    - id: IV-4
      control: null object R6 -- the solver on the null_family must return exactly 0 solutions and the audit code must flag the infeasibility; a nonzero result voids the solver for all counts.
    - id: IV-5
      control: audit self-test R1 -- stream reconstruction on one fixed b-tuple (first of R3-armB stream) must reproduce the recorded draws bit-for-bit, and the planted-meet arithmetic must hit a synthetic 2-D box case with a known answer; failure voids the audit (R2) before any attribution is read.
    - id: IV-6
      control: per-run attempt ceiling [SR-4], at most 12 attempts per enumerated run; every attempt (successful or not) is preserved under its own attempt-<k>-<label>/ directory with NOTE.txt; a 13th attempt is refused by the driver and reported, not run.
    - id: IV-7
      control: determinism of all audit and construction outputs under frozen seeds; no wall-clock, pid, or dict-order dependence in any reported quantity.
    - id: IV-8
      control: multi-class certificate coverage [SR-7] -- at least one certified instance with 4 distinct twist classes is required among R3/R5 output, OR the run record carries the explicit statement that the multi-class path remains untested (with the single-class coverage count). Absent both, the certification claim is downgraded to single-class.
    - id: IV-9
      control: planted distinctness [SR-8] -- every planted instance (R8 and the R2 planted audit points) is a distinct (b-tuple, pattern) pair; no two plants share an h0 unless the record names the shared value and the reason (the predecessor's O-08/C6 defect, three of nine plants shared a repeated A-tuple, two shared h0 = 191 -- that shape is forbidden here).
  independent_variables:
    - n in {6, 8} (arm)
    - box height H (nested, cumulative)
    - the square pattern's carrier coordinate (frozen: r_n)
    - b-tuple (seeded sample)
    - draw count N_a in the audit's planted-meet stage (derived below, frozen at run start)
  metrics:
    primary:
      - name: audit_verdict
        definition: >
          per audited b-tuple: in-box fraction over all recorded draws (must be
          1.000 for M-A), |S| the exactly computed lattice count of the sub-box at
          height <= scheduled H, N_a the pre-registered draw count, meets observed,
          expected meets N_a / |S|.
      - name: construct_count
        definition: >
          per (n, H): count of distinct-minimal-model certified instances
          (nonsingular, twist class populated, certified rank above trivial),
          plus the feasibility fraction (fraction of b-tuples with >= 1 in-box
          solution of the n - 5 system) and the near-miss ledger (tuples with 0
          solutions, recorded with the failing condition).
    secondary:
      - per-tuple incidence with rule-of-three 95% upper bound when the count is 0
      - construction-over-draw comparison: measured incidence vs the 3e-4/draw draw-route upper bound of EV-ECRANK-8b35bb
      - op ledger per run: counted exact ops, ops_cap_respected EXACT boolean [SR-9], exclusions per IC-1 reported [SR-11]
      - wall_seconds: internal monotonic wall AND timestamp span, both reported [SR-10]
      - peak_rss_bytes per run
      - certificate coverage: classes per certified instance; multi-class statement [SR-7]
      - per-draw log for any audit re-draw: solved coordinates plus per-coordinate squareness verdicts [SR-1]
  heuristic_under_test: HEUR-1 (construction-side realization)
  heuristics_stated_exactly:
    - HEUR-1 as stated in H-ECRANK-36d8d7 (carried from H-ECRANK-ee6e0e; internal provenance).
  preregistered_prediction:
    written_before_any_run: '2026-09-06 (this frozen contract; no run of this experiment exists)'
    never_adjusted_afterward: >
      This prediction is part of the frozen contract. Any later change requires a
      versioned protocol_amendment in experiments/EXP-ECRANK-73275e/amendments/ and
      creates a new record; it is never an edit of this field, and runs already
      executed are never re-scored against the new one.
    quantity: >
      (1) The audit verdict per P1/P2. (2) The n = 6 construction count
      N_6(H) over nested H and the per-tuple incidence. (3) The n = 8 count
      N_8(H), secondary.
    formula: >
      P1: in-box fraction = 1.000 for AT-0/1/2. P2: meets >= 1 for each planted
      point, with expected meets N_a / |S| >= 5 by construction of N_a. P3:
      N_6(10^4) >= 1. P4: when N_6 > 0, incidence > 3e-4 per tuple at the same
      per-tuple scale; when N_6 = 0, the rule-of-three upper bound is reported and
      F2's infeasibility pattern decides. P5: N_8 reported at its own scope.
    source: >
      HEUR-1 (internal, IDEA-20260905-d5608c lineage) for the count law; the
      measured obstruction of EV-ECRANK-8b35bb (0/80000 draws at n = 8,
      rule-of-three < 3e-4, P(zero | rate >= 1e-3) ~ 4.5e-5) for the
      draw-route comparison; the predecessor contract's d = 1 closed form for the
      control anchors. No recalled external source backs any number here (rule 9).
  sample_size_derivation:
    method: >
      The audit's N_a is derived from the expected-meet floor: choose N_a so
      N_a / |S| >= 5, i.e. N_a >= 5 |S|; |S| is computed exactly at run start from
      the declared sub-box and H schedule and recorded before any meet is counted.
      Construction sample: 10^4 b-tuples per arm, the same derived sample as the
      predecessor (tail multiple 10 over the q = 10^-3 floor of
      EXP-ECRANK-76a70d), now justified as the scope against which the
      construction-over-draw comparison P4 is made, not as a resolution floor for
      draws.
    smallest_probability_to_resolve: 10^-3 (predecessor floor, carried for comparability)
    derived_sample_count: 10^4 b-tuples per construction arm
  scale_relevance:
    tier: toy
    justification: >
      The claim-tier vocabulary of docs/claims-and-verification.md: toy-scale
      mechanism discrimination, no cryptographic parameters. The construction's
      per-tuple cost structure (one univariate quadratic at n = 6; a Bézout
      <= 8 system at n = 8) is what would carry to larger n, and that transfer is
      a disclosed assumption, not a claim.
    correspondence: null
    correspondence_note: no correspondence trick is used; the audit reaches the predecessor's exact parameters because it reads the predecessor's committed bytes.
  tail_checks:
    - P1 in-box fraction must be exactly 1.000; any single out-of-box draw is recorded with its (b-tuple, draw index, coordinate, scheduled H, box bounds) and triggers F1_audit.
    - P2 zero meets with expected >= 5 triggers F1_audit (uniformity failure), reported with the full per-draw log [SR-1].
    - The smallest and largest H-decade ratios of N_6 are reported against the exponent +2 prediction (factor 100 per decade).
    - The feasibility fraction at n = 6 is reported even when the count is nonzero.
    - The null family R6 must show exactly 0 solutions; any solution is a voiding control failure with the solution recorded.
  replication:
    seeds:
      - 760806
      - 760808
      - 760810
      - 760812
    seeds_note: >
      Deterministic, declared pre-run, never adjusted: 760806 -> R3 construct-n6
      (and R4 replay, bit-for-bit); 760808 -> the NAMED planted-control seed [SR-5]
      (R8 plants and R2 planted-audit points derive from it); 760810 -> R5
      construct-n8; 760812 -> R7 known-false d = (1..1) control. Coset choice,
      b-tuple order, coefficient sub-boxes, and planted positions all derive from
      the run seed via random.Random(seed); height sub-boxes are nested and
      deterministic (no RNG in H). The predecessor's derived-seed practice
      (Random(760708*1000 + instance_index)) is NOT used: every planted object
      traces to a named seed in this list.
    independent_instances: 3
    independent_instances_note: three independent audited b-tuple streams (AT-0/1/2) plus two construction arms with separate seeded b-streams; cross-stream deduplication by minimal model before any count.
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 16
    total_cpu_hours_note: 'Worst-case ceiling: 8 runs x 7200 s = 16 h. Expected far lower: the audit is read-only exact arithmetic, and the construction solver per tuple is a univariate quadratic (n = 6) or a Bézout <= 8 system (n = 8).'
    maximum_memory_gb: 8
    maximum_memory_gb_note: template floor respected (>= 8); expected actual peak < 2 GB.
    maximum_runs: 8
    maximum_runs_note: >
      Enumerated: (1) R1 audit-smoke self-test; (2) R2 draw-support audit
      (AT-0/1/2 + planted meets); (3) R3 construct-n6; (4) R4 construct-n6
      replay; (5) R5 construct-n8; (6) R6 null object; (7) R7 known-false
      n = 6 and n = 8; (8) R8 planted yield.
    maximum_workers: 1
    counted_exact_rational_operations_per_run: 1.0e8
    counted_ops_note: >
      The binding budget is the COUNTED exact-op cap per run, not the wall clock.
      The stop rule is EXACT at >= 1.0e8 counted ops [SR-9]: no tolerance; the
      run record carries an EXACT boolean ops_cap_respected computed as
      (counted_ops < 1.0e8), not a 1% band.
    maximum_attempts_per_run: 12 [SR-4]
    descent_calls: 0
    pari_ellrank_calls: 0
    network: none
  stopping_rules:
    - 'Exhaustion is inert in both directions, a cap or sample exhaustion is reported as exhaustion and is never a positive or negative mathematical result; only the pre-registered falsification patterns close a scope.'
    - The counted-op stop is exact (>= 1.0e8) [SR-9]; checkpoints every 1e7 counted ops.
    - NO early stop for enough instances; NO adaptive box widening; the construction enumeration is a single fixed pass per (n, H) level.
    - 'The audit (R1/R2) has no op cap in the predecessor sense, it is bounded by the committed input size (finite recorded draws) plus the pre-registered N_a; if reconstruction fails, it stops and voids (IV-5), never continues partially.'
    - A 13th attempt in any run is refused and recorded (IV-6).
  invalidation_rules:
    - IV-1 failure voids ALL runs of this experiment (known-false control).
    - IV-2 failure voids R3 and R5 readings (determinism).
    - IV-3 failure voids the R3/R5 COUNT readings (the solver misses what it should see); feasibility-fraction and near-miss data remain as measurements.
    - IV-4 failure voids every count in the experiment (solver unsound on a known-zero object).
    - IV-5 failure voids the audit (R2) only; the construction arms proceed but M-A stays untested.
    - 'F1_audit re-attributes the predecessor zero to the sampler, the density interpretation of EV-ECRANK-8b35bb is suspended (not erased -- it is a recorded scoped negative on its own scope) and the engine repair is the successor action.'
    - Every invalidation is recorded with the failing check's exact inputs; a voided run is never silently dropped (rule 8).
  success_criterion: >
    DECIDABLE, WITH A POSSIBLE NEGATIVE OUTCOME. G1 (M-A, primary): for all of
    AT-0/1/2, in-box fraction = 1.000 AND each planted point is met >= 1 time over
    the pre-registered N_a (expected >= 5) -- then the predecessor zero is
    attributed to square-pattern incidence density at the tested scope.
    G2 (M-B, primary): N_6(10^4) >= 1 certified instance with the IV-8
    multi-class clause satisfied (or the explicit untested statement) -- then the
    construction route is validated at n = 6 at the tested scope. G3 (secondary):
    N_8 reported at its own scope. G4 (controls): R1/R4/R6/R7/R8 all pass their
    pre-registered checks. Negative outcomes are FIRST-CLASS: F1_audit and F2_n6
    are success of the DECISION (the ambiguity is resolved), not failure of the
    experiment.
  success_criterion_decidability_note: >
    Every clause is machine-checkable from the predefined metrics and artifacts:
    in-box fraction from the per-draw ledger; meets from the R2 record; counts and
    feasibility fraction from the R3/R5 instance ledgers; control verdicts from
    R1/R4/R6/R7/R8 records.
  falsification_criterion: >
    F1_audit, F2_n6, F3_n8, F4_controls exactly as in H-ECRANK-36d8d7. Each
    closes ONLY its declared scope (rule 6). F2_n6 with feasibility fraction > 0
    and 0 certified instances closes nothing: it records a degeneracy blocker as
    a new measurement and names it.
  required_artifacts:
    - 'the ledger run schema for EVERY enumerated run [SR-3]: the nested `run:` record carrying RUN_REQUIRED_TOP fields (id, experiment_id, status, code, environment, inputs, results, stdout, stderr, timestamps, resources, validity, model provenance) plus the command.txt and environment.json companions -- the omission that forced the predecessor repair run TASK-20260906-546d17'
    - 'per-draw log for every audit re-draw and every planted-meet scan, with the solved y-tuple plus per-coordinate squareness verdicts [SR-1]'
    - 'the audit reconstruction files, per audited b-tuple, the reconstructed stream, the in-box ledger, |S|, N_a, expected vs observed meets'
    - 'the construction instance ledgers per (n, H), distinct minimal models, certificates, classes, feasibility fraction, near-miss ledger'
    - the null-family definition and its infeasibility proof (R6), frozen in the run source before any R6 step
    - all attempt directories (every attempt preserved, IV-6) with NOTE.txt naming the attempt's defect
    - checkpoints every 1e7 counted ops for R3/R5
    - the exact op ledger per run with IC-1 exclusions itemized [SR-11]
    - wall_seconds: internal monotonic AND timestamp span per run [SR-10]
    - the planted positions and their named-seed derivation (R2 plants, R8 plants) [SR-5, SR-8]
    - execution-report.yaml (executor observations only)
  assigned_to: executor
  completion_gate:
    - All 8 enumerated runs finalized with the nested `run:` record schema [SR-3].
    - validate_ledger.py adds no new violations after the run package.
    - The snapshot archive commits the full run package before any independent review.
  inference:
    requested_policy: executor-implementation
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
