  authorization: >
    Standing user authorization of 2026-09-06 ("all is approved.
    ideas/experiments should be always approved"), under which the
    Coordinator records protocol approval as soon as the contract is
    complete. Core contract mechanism (v1 sample_size_derivation /
    preregistered_prediction.never_adjusted_afterward): a later protocol
    change is a versioned protocol_amendment in this directory creating a
    new record, never an edit of the frozen bytes, and runs already
    executed are never re-scored against it.
  trigger:
    finding: >
      The v1 sample-size derivation for the audit's planted-meet stage is
      infeasible inside the frozen budget, measured before any run of this
      experiment: the frozen floor N_a >= 5 |S| demands 1.337e21 draws at
      the smallest scheduled height while the binding 1.0e8 counted-op cap
      permits at most 1.0e7 exact redrows at a 10-op floor. The sampling
      meet branch as frozen can never execute, so the v2 protocol replaces
      that one branch with an exactly equivalent decisive test and records
      the infeasibility as a first-class measurement.
    measurement:
      method: >
        Exact count of the support of the committed draw stage
        (experiments/EXP-ECRANK-76a70d/source/ecrank_engine.py
        draw_rational, snapshot-bound at a20a49b6a): the per-coordinate
        image at height H is {+- a/b : 1 <= a, b <= H, gcd(a,b) = 1};
        |L(H)| = 2 * sum_{d <= H} mu(d) floor(H/d)^2, computed exactly by
        the Coordinator before any run and re-derived in the R1 self-test
        S1c by the executor and, independently, in the review round.
      values_exact:
        L_100: 12174
        L_1000: 1216766
        L_10000: 121589942
        S_100_is_L_100_to_the_5th: 267403130392225254624
        v1_floor_N_a_at_H_100: 1337015651961126273120
      feasibility: >
        The committed R3-armB run records 8,683,560 counted ops for
        80,000 draws (108.5 ops/draw including the full per-b pipeline).
        Even at a floor of 10 counted ops per redrow, the frozen 1.0e8
        per-run cap allows <= 1.0e7 redrows;
        1337015651961126273120 / 1.0e7 = 1.3370157e14. Infeasible by at
        least 14 orders of magnitude under any admissible counting
        convention, and by ~15.9 orders of magnitude against the committed
        8.5e5-draw scale.
    first_class_measurement: >
      Per core rule 8 the infeasibility is recorded, not discarded: it
      quantifies the draw-route meet probability. The exact per-draw
      full-tuple meet probability for each pre-registered plant is carried
      below (lambda_full block); at the committed 80,000-draw scale the
      expected full-tuple meet count is ~1e-13 or smaller. This datum
      belongs to the EV-ECRANK-8b35bb obstruction family and is cited by
      the execution ledger archive.
  resolved_interpretations:
    AT_selection: >
      AT-i = (stream i, b_index 0) for i in {0, 1, 2}: the first b-tuple
      of each of the three committed coset streams. Basis: v1's "the first
      three in the R3-armB record stream" (H-ECRANK-36d8d7 P1) read
      together with the v1 spec's own
      replication.independent_instances_note ("three independent audited
      b-tuple streams (AT-0/1/2)"); the committed
      blind_rederivation_inputs_C3 records exactly these (stream,
      b_index) pairs with their b-tuples and d-patterns:
      (0,0) b = (0,1,4,-9,15,11,-4,8); (1,0) b = (0,1,-3,7,15,6,-8,12);
      (2,0) b = (0,1,-6,3,12,-4,5,-8).
    meet_probability_model: >
      The v1 expected-meets formula N_a / |S| assumed uniformity over the
      reduced lattice. The committed draw_rational is flat over the
      UNREDUCED [1,H] x [1,H] grid with an independent uniform sign: the
      exact probability that a draw at height H equals a reduced signed
      fraction s = sign * a/b (gcd(a,b) = 1, m = max(a,b)) is
      (1/2) * floor(H/m) / H^2. Amendment v2 replaces the v1 formula with
      this exact one everywhere expected meets are pre-registered.
  plant_selection:
    rule: >
      rng_plant = random.Random(760808) (the NAMED planted-control seed
      [SR-5]); for i in 0..2 and, within each i, c in 0..4: sign =
      rng_plant.choice([1, -1]); num = rng_plant.randint(1, 100); den =
      rng_plant.randint(1, 100); reduce by gcd. Plant i is the five
      coordinates drawn for that i, in order; every coordinate lies in
      L(100), height <= 100 <= every scheduled H. No acceptance or
      rejection: the first fifteen draws are the plants (IV-9: the three
      plants are distinct (b-tuple, pattern) pairs on three distinct
      streams; no two share an h0; recorded in the R2 run record).
    pre_registered_plants:
      plant_0:
        at: (stream 0, b_index 0)
        coords: ['+13/11', '-48/31', '-23/61', '+5/9', '+21/50']
        m: [13, 48, 61, 9, 50]
      plant_1:
        at: (stream 1, b_index 0)
        coords: ['-15/82', '-23/95', '+11/18', '-94/33', '+97/48']
        m: [82, 95, 18, 94, 97]
      plant_2:
        at: (stream 2, b_index 0)
        coords: ['-41/70', '-71/7', '+1/2', '+16/73', '+52/87']
        m: [70, 71, 2, 73, 87]
  redraft_protocol:
    continuation: >
      For AT-i, the committed RNG state at the end of (stream i,
      b_index 0)'s eight-draw phase is reconstructed by replaying the
      committed per-b pipeline (b draw, class selection, d-pattern
      shuffle, eight draws) from random.Random(760708*100 + i) using the
      committed code; the stream is then CONTINUED with N_ext = 20088
      cycles (160,704 redrows) of the frozen H schedule
      [100,100,100,1000,1000,10000,10000,10000], drawing only the rS
      five-tuples (no solve, no b-redraw, no new seed). N_ext is fixed
      before any redrow; the extension is a continuation of the declared
      seeded stream, so the declared per-draw probability model applies
      to it unchanged.
    pre_registered_expectations:
      note: >
        lambda_c(i, c) = 20088 * (1/2) * (3*floor(100/m)/100^2 +
        3*floor(1000/m)/1000^2 + 2*floor(10000/m)/10000^2) for the plant's
        m-profile; Lambda(i) = sum over c of lambda_c(i, c); lambda_full(i)
        = 20088 * sum over stages of count * prod_c (1/2 * floor(H/m)/H^2).
        All values exact rationals; P(0) = exp(-lambda) under the declared
        Poisson model.
      plant_0:
        lambda_c:
          - 294211359/12500000    # 23.536909
          - 10423161/1562500      # 6.670823
          - 44100693/12500000     # 3.528055
          - 458912871/12500000    # 36.713030
          - 208413/31250          # 6.669216
        Lambda: 963975411/12500000   # 77.1180 ; P(0) = 3.222e-34
        lambda_full: 36253197988425881056431/6250000000000000000000000000000000000   # 5.800512e-15
      plant_1:
        lambda_c:
          - 42488631/12500000     # 3.399090
          - 8339031/2500000       # 3.335612
          - 42086871/2500000      # 16.834748
          - 20848833/6250000      # 3.335813
          - 41690133/12500000     # 3.335211
        Lambda: 18900297/625000      # 30.2405 ; P(0) = 7.357e-14
        lambda_full: 37665497181866227902999/4000000000000000000000000000000000000000000   # 9.416374e-17
      plant_2:
        lambda_c:
          - 21647331/6250000      # 3.463573
          - 1082241/312500        # 3.463171
          - 208413/1250           # 166.730400
          - 21451473/6250000      # 3.432236
          - 10523601/3125000      # 3.367552
        Lambda: 563927913/3125000    # 180.4569 ; P(0) = 4.252e-79
        lambda_full: 5885321200368655023/6250000000000000000000000000000000   # 9.416514e-16
  scope_statement: >
    What the v2 audit tests, mapped to M-A's own statement: M-A's support
    claim is that "the map from the seeded stream onto the drawn fixed
    coordinates is surjective, and the scheduled-H bookkeeping never draws
    outside the declared box". Surjectivity of the product map is tested
    as (a) the exact derivation of the per-coordinate image (T2a) and
    (b) empirical reach of fifteen pre-registered target coordinates at
    the exact arithmetic (T2b, plant totals Lambda(i) >= 30 with
    P(0) <= 7.4e-14). The FULL-tuple meet of a specific plant (a draw
    reproducing all five fixed coordinates at once) is NOT the support
    claim: its pre-registered expected count is lambda_full ~ 1e-16..1e-14
    (recorded, undecidable by sampling at any feasible scale -- the
    first-class measurement above). Whether a meeting draw yields a
    square-pattern instance is the incidence-density quantity, which is
    M-B's and is measured by R3/R5 on the construction side. G1's
    attribution conclusion is scoped exactly to the sampler's support and
    box bookkeeping, as M-A's statement reads; it does not assert any
    incidence density.
  changed_clauses:
    R1: >
      v1's two self-tests (fixture reconstruction; IV-5
      corrupted-reconstruction detection) stand. Added S1c:
      support-derivation self-test -- compute |L(5)| by the mu-sum formula
      and by exhaustive enumeration of reduced signed fractions (must
      agree, = 38), and check the exact per-fraction probability
      (1/2)*floor(H/m)/H^2 against the empirical distribution of
      draw_rational over a small committed-scale fixture (tolerance
      recorded in the run record). S1c fails -> the derivation is voided
      and R2's T2a/T2b readings are downgraded to unverified (the
      construction arms are unaffected).
    R2: >
      v1's audit scope is replaced by: T1 reconstruction fidelity
      (reconstruct the full committed 80,000-draw run from the snapshot-
      bound code and seeds; agree with EVERY committed aggregate: per-
      stream draws/solves_ok/square_ok/found/build_ok, class_attempts_
      hist, reject_reasons, level_counts_per_H, cumulative_counts_per_H,
      ops_counted_total = 8683560, events = []; any mismatch -> IV-5,
      the audit voids, the construction arms proceed, M-A untested); T2a
      support derivation (exact |L(100)|, |L(1000)|, |L(10000)|, the
      product support, the per-fraction probabilities); T2b coordinate
      controls (the N_ext = 20088-cycle redraft per plant, per-coordinate
      match counts against the pre-registered plants, with the pre-
      registered exact lambda_c / Lambda / P(0)); T2c full-tuple counts
      and the v1-floor infeasibility datum (recorded, no claim); P1 the
      in-box fraction over ALL 80,000 reconstructed recorded draws plus
      all 482,112 redrows must be 1.000 (any single out-of-box draw is
      recorded with (stream, b_index, draw index, coordinate, scheduled
      H, box bounds)).
    P2_test_form: >
      v1 P2 ("met >= 1 over the pre-registered N_a, expected >= 5") is
      re-tested as T2b's per-plant coordinate-control total: for each
      plant i, observed coordinate matches across the 15 pre-registered
      coordinate targets must be >= 1 (expected Lambda(i), pre-registered
      exact; P(0) recorded exactly). This is the decisive feasible form
      of the support claim per scope_statement; the full-tuple form is
      recorded as undecidable with the exact lambda_full.
    G1: >
      v1 G1 ("in-box fraction = 1.000 AND each planted point is met >= 1
      over the pre-registered N_a") is re-stated: T1 agrees AND P1 =
      1.000 over the full reconstruction and redraft AND every plant's
      coordinate-control total is >= 1 -- then the predecessor zero is
      attributed to square-pattern incidence density at the tested scope
      (sampler support established; no incidence claim).
    F1_audit: >
      v1 trigger ("zero meets with expected >= 5") is re-stated:
      F1_audit fires on (a) any single out-of-box draw in the
      reconstruction or redraft (recorded with full identification), or
      (b) any plant whose coordinate-control total is 0 (P(0) <= 7.4e-14
      under declared uniformity, recorded exactly per plant). Each closes
      ONLY its declared scope; v1's F1_audit consequences (sampler
      re-attribution, density interpretation suspended, engine repair as
      successor) carry over unchanged.
    audit_verdict_metric: >
      The metric now reports, per audited b-tuple: in-box fraction;
      |L(H)| per scheduled H; the plant m-profile; the pre-registered
      exact lambda_c per coordinate and Lambda per plant; observed per-
      coordinate counts and plant totals; observed full-tuple count vs
      lambda_full; and the v1-floor infeasibility datum.
  unchanged: >
    Everything else of v1 stands verbatim: P1 (in-box fraction = 1.000),
    P3, P4, P5; R3, R4, R5, R6, R7, R8 in full (engines, H schedules,
    10^4 b-tuples per arm, IV-8 multi-class clause); the four replication
    seeds and their assignment (760806 R3/R4, 760808 plants, 760810 R5,
    760812 R7); the full budget (7200 s per run, 16 CPU-h, 8 GB, 1.0e8
    counted ops per run with the EXACT stop flag [SR-9], checkpoints
    every 1e7, 12-attempt ceiling [SR-4], zero descent, no network);
    stopping rules 1-3 and 5 (rule 4 stands with "the pre-registered N_a"
    read as N_ext = 20088 cycles per plant); controls IV-1..IV-9
    (IV-5 voids the audit only; IV-9: the three plants sit on three
    distinct streams with three distinct committed b-tuples, so the
    predecessor's O-08/C6 defect shape -- repeated A-tuple, shared h0 =
    191 -- cannot arise; the executor records the exact plant tuples in
    the R2 run record for verification); F2_n6, F3_n8,
    F4_controls; G2, G3, G4; all required artifacts (with the per-draw
    log [SR-1] now covering the redraft as well); the nested run: record
    schema [SR-3]; the completion gate.
