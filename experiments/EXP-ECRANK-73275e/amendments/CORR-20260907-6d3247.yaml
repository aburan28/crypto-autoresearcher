  what_was_wrong: >
    In the v2 amendment's pre_registered_expectations block, the
    plant_1.lambda_full fraction is written with a denominator that has
    four extra zeros relative to the amendment's own formula applied to
    its own m-profile [82, 95, 18, 94, 97]. The numerator is correct;
    only the denominator is mis-transcribed. The inline comment on the
    same line (9.416374e-17) already states the correct magnitude.
  as_written:
    value: 37665497181866227902999/4000000000000000000000000000000000000000000
    float: 9.416374e-21
  corrected:
    value: 37665497181866227902999/400000000000000000000000000000000000000000
    float: 9.416374e-17
  derivation: >
    lambda_full(plant_1) = 20088 * [ 3*prod_c (1/2*floor(100/m_c)/100^2) +
    3*prod_c (1/2*floor(1000/m_c)/1000^2) + 2*prod_c
    (1/2*floor(10000/m_c)/10000^2) ] with m = [82,95,18,94,97]. Evaluated
    exactly (Fractions): 37665497181866227902999 /
    400000000000000000000000000000000000000000 = 9.416374295466557e-17.
    Hand cross-check of the H=100 stage alone: per-draw all-5 product =
    2.5e-4 * (5e-5)^4 = 1.5625e-21; x3 draws x20088 cycles = 9.47e-17,
    consistent to leading digit with the dominant H=100 contribution.
  verification: >
    Independently re-derived by the Coordinator before deciding (exact
    Fraction arithmetic); flagged by the executor in the R2 run record
    (anomaly: T2c.plant1_as_written_discrepancy) and to be re-derived
    again, blind, by the red team under REVIEW-PLAN-BATCH-523fe1-
    ADDENDUM-1 item (d). Plants 0 and 2 verified exact as written
    (formula/as_written ratio = 1).
  effect: >
    NONE on any scoring, control, trigger, or verdict. lambda_full is a
    T2c datum only ("recorded, no claim"); the observed plant_1 full-
    tuple meet count is 0, which is consistent with the corrected
    expected value 9.416374e-17 (P(0) = 1 - 9.416374e-17) exactly as
    with the as-written value. The v1-floor infeasibility datum
    (1.3370157e14) and the plant_1 Lambda (30.2405) are unaffected.
    No run is re-scored and no run is re-run.
  binding: >
    The corrected value 9.416374e-17 is authoritative for all
    downstream use (the EV record, the red-team comparison, any
    synthesis). The v2 frozen byte is left unmodified as history; this
    correction supersedes it for the single named field only.
