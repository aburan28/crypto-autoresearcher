  repairs_by_adjudicated_defect:
    - defect_id: D-1
      defect: >
        v1 IV-1 at n=6 expected certified totals n-1 = 5 for the known-false
        d=(1..1) Mestre degeneration, but the control objects are conics
        (deg s = 2, genus 0) on ALL tuples (red-team J1 exact derivation,
        TASK-20260908-b687fd): the expectation was unsatisfiable through any
        pipeline enforcing deg s in {3,4}. Adjudicated a CONTRACT-DESIGN
        DEFECT under Reading C (DEC-20260908-d361ab); R7's observed
        degenerate_deg_s_2 rejections were mathematically correct behavior.
      repair: IV-1R below asserts the conic rejection at n=6.
    - defect_id: D-2
      defect: >
        v1 IV-1 at n=8 expected certified totals 7; observed [5,6,7,7,7,7,6,7].
        All shortfalls localize to F_l-certifier lower-bound limits at prime
        bound 1500 (red-team J1: b_index 0 certifies 5/8, b_index 1 and 6
        certify 6/8; independent reproduction with the committed certifier
        matches the recorded totals 8/8; the d=1 closed form supports 7 on
        all three shortfall tuples).
      repair: IV-1C below moves the certified-total assertion to a fixed raised certifier ladder.
    - defect_id: D-3
      defect: >
        v1 IV-3/R8 planted from the R7 d=(1..1) family, which is NON-elliptic
        at n=6, so all 9 plants were rejected as degenerate_deg_s_2 and the
        n=6 solver's DETECTION path was never exercised (red-team J4a
        breaks). Consequence on record: all n=6 counts are LOWER BOUNDS
        (completeness unmeasured).
      repair: IV-3R below adds a planted ELLIPTIC n=6 control from the R3-family shape.
    - defect_id: D-4
      defect: >
        The HEUR-1 decade ratios were never reported by the execution report
        (a frozen v1 tail_check); composing them exposed an unreconciled
        tension: 22/15 ~ 1.47 and 28/22 ~ 1.27 per decade against the
        exponent-+2 prediction of x100 per decade. The blind re-derivation
        noted r_height = max |numerator|-style labeling is a convention
        question: either the recorded r_height convention measures something
        other than HEUR-1's H, or the construction-side realization is orders
        of magnitude below prediction at the tested scale (analysis.md
        Inference 7).
      repair: N2R below pre-registers the dual-convention reconciliation with decade ratios as frozen tail_checks.
    - defect_id: D-5
      defect: >
        The n=8 zero is inert in both directions: counted-ops cap breach at
        b_index 666 of 10000 (PD-2, ops_cap_respected false) plus the
        integer-box narrowing (PD-3, IC-732-3: integer (a,b) box of width
        min(H,20), not the full rational height-H lattice).
      repair: N3R below rescopes n=8 by raising the counted-ops cap and disclosing the box convention as declared scope.
    - defect_id: D-6
      defect: >
        Recording-discipline gaps: PD-1 (R6 raw-result null_proof_first
        overwritten after b_index 0) and the R4 int-keyed vs str-keyed
        counts-identity flag (iv2_counts_identical false in raw despite
        equal serialized counts).
      repair: RD-1/RD-2 below; neither re-scores any v1 run.

  fresh_seeds:
    seeds: [760906, 760908, 760910, 760912, 760914, 760916]
    declared_before_any_v2_run: true
    never_adjusted_afterward: true
    assignment:
      '760906': R12 construct-n6 replication AND R13 bit-for-bit replay (same seed, IV-2R)
      '760908': R10 planted ELLIPTIC n=6 detection control (IV-3R; named planted seed per SR-5 discipline)
      '760910': R14 construct-n8 rescoped
      '760912': R9 amended known-false d=(1..1) control (IV-1R n=6 + IV-1C n=8)
      '760914': R11 planted n=8 control (R7 family; elliptic at n=8, deg s = 3)
      '760916': R15 null-object re-run (IV-4R)
    disjointness: no overlap with the v1 seed set {760806, 760808, 760810, 760812}; freshness is the point of the replication round.
    derivation_discipline: >
      Coset choice, b-tuple order, coefficient sub-boxes and planted
      positions all derive from the run seed via random.Random(seed), as in
      v1. The predecessor's derived-seed practice remains forbidden; every
      planted object traces to a named seed in this list.
    independence_disclosure_requirement: >
      N2 requires an independent machine/runtime WHERE POSSIBLE. This
      deployment has one available machine; the executor MUST record the
      actual machine identity, OS, Python build and resolved runtime/model
      provenance in every run manifest, and the run package MUST carry the
      explicit disclosure that same-machine replication is what was
      achievable. Same-machine replication with fresh seeds still tests
      seed-sensitivity and pipeline determinism; it does NOT test
      machine-dependent behavior, and that limitation is recorded, not
      interpreted away.

  amended_controls:
    - id: IV-1R
      name: known-false conic rejection at n=6
      control: >
        R9 (seed 760912) rebuilds the d=(1,1,...) Mestre degeneration at
        n=6 over the same 8-tuple derivation as v1 R7 under the fresh seed.
        ASSERTION: every built object is rejected as degenerate_deg_s_2,
        with the nonzero x^2 coefficient recorded per tuple, and the
        certified total at n=6 is exactly 0. This is the mathematically
        correct behavior adjudicated under Reading C; the v1 expectation
        (certified total 5 at n=6) is withdrawn for v2 runs only.
      invalidation: >
        A certified total > 0 at n=6, or any d=(1..1) object passing with
        deg s in {3,4}, voids the degeneracy gate for ALL v2 runs (the
        pipeline would be unsound on a known-degenerate family). Recorded
        with the exact failing inputs; never silently dropped.
    - id: IV-1C
      name: certified-total n-1 control at n=8 with raised F_l certifier ladder
      control: >
        R9 (seed 760912) rebuilds the d=(1..1) control at n=8 (objects
        elliptic, deg s = 3). The F_l-reduction within-class certifier runs
        at a FIXED three-rung prime-bound ladder: 1500 (baseline
        reproduction of the v1 observation), 10000, 100000. All rungs are
        reported for every tuple; the ladder is non-adaptive. ASSERTION:
        the certified total equals the closed-form value n-1 = 7 for ALL 8
        tuples at the top rung (bound 100000). Closed-form anchor: the
        predecessor d=1 closed form supports 7 on all three v1-shortfall
        tuples (red-team J1 reproduction 8/8 at bound 1500: [5,6,7,7,7,7,6,7]).
      graded_outcome: >
        PASS: all 8 tuples certify 7 at bound 100000. CERTIFIER_LIMITED:
        any tuple still short at bound 100000 -- recorded with the full
        per-rung per-tuple ledger; certified totals remain LOWER BOUNDS;
        NOT voiding (a certifier lower-bound limit is an instrument
        boundary, not a pipeline defect, per the J1 adjudication). The
        outcome label is one of {PASS, CERTIFIER_LIMITED}; nothing else.
      budget_note: >
        Ladder cost is bounded: v1 R7 spent 308,732 counted ops at bound
        1500; the top rung multiplies the prime set ~40x, well inside the
        per-run cap. Every rung's op cost is itemized in the run ledger.
    - id: IV-3R
      name: planted ELLIPTIC n=6 detection control (R3-family shape)
      control: >
        R10 (named planted seed 760908) builds exactly 9 plants from the
        R3-FAMILY SHAPE: the same prescribed-square-pattern mechanism with
        carrier r_n and the n=6 univariate quadratic solve that produced
        the 28 certified instances of R3 -- NOT the non-elliptic R7
        d=(1..1) family. Each plant MUST be elliptic (deg s = 4, disc != 0)
        at build time, a distinct (b-tuple, pattern) pair (v1 IV-9 applies
        verbatim: no shared h0 unless recorded with reason), built inside
        the frozen box (r-height <= 10^4). Plants are injected at recorded
        b-stream positions derived from the named seed. ASSERTIONS: (a)
        DETECTION: the construction solver recovers every plant --
        recovered/denominator = 9/9; (b) EXPONENT GATE: each recovered
        plant's reported height ratio lies inside the FROZEN v1 window
        [1 - log10 2, 1 + log10 2] = [0.699, 1.301] (SR-6 carried
        verbatim); (c) per-decade ratios of planted yields inside [5, 20]
        (SR-6 carried verbatim) where a planted yield spans decades;
        single-decade plants record the clause as not_applicable with the
        per-plant ratios instead.
      plant_builder_freeze: >
        The executor freezes the plant-builder in the v2 run source BEFORE
        any R10 step (the v1 null_family freeze discipline applied to
        plants); the builder derives plants constructively (prescribe the
        pattern, solve the quadratic, keep deg s = 4 roots) and never
        imports R3's found-instance list.
      invalidation: >
        Failure of (a) voids the COUNT readings of R12 and R14 (the solver
        misses what it should see); feasibility-fraction and near-miss data
        remain as measurements (v1 IV-3 invalidation logic carried).
        Failure of (b)/(c) is recorded with exact values and voids only the
        planted-height calibration reading.
      upgrade_clause: >
        Only on 9/9 detection do the R12 n=6 counts upgrade from LOWER
        BOUNDS to MEASURED counts at the tested scope (discharging red-team
        J4a for the v2 round). Otherwise counts remain lower bounds and the
        record says so.
    - id: IV-2R
      name: determinism replay
      control: >
        R13 (seed 760906) replays R12 and MUST reproduce its instance list,
        counts and op ledger bit-for-bit (v1 IV-2 carried). The
        counts-identity flag MUST be computed on canonically serialized
        (string-keyed) dicts per RD-2. Failure voids the R12/R14 readings.
    - id: IV-4R
      name: null object re-run with non-destructive proof recording
      control: >
        R15 (seed 760916) re-runs the v1 null_family (source hash bound
        above; the sign-forced infeasible n=6 quadratic). ASSERTION:
        exactly 0 solutions and the infeasibility flag raised; the
        b_index-0 infeasibility proof is recorded NON-DESTRUCTIVELY per
        RD-1. A nonzero result voids the solver for ALL v2 counts (v1 IV-4
        carried).
    - id: IV-CARRY
      name: carried controls
      control: >
        v1 IV-6 (attempt ceiling 12, every attempt preserved, 13th refused),
        IV-7 (determinism; no wall-clock/pid/dict-order dependence), IV-8
        (multi-class coverage clause or explicit untested statement), IV-9
        (planted distinctness) apply verbatim to every v2 run. The v1 audit
        controls IV-5 and the audit runs R1/R2 are NOT re-run: the audit
        reading (G1/M-A) stands under Reading C and this amendment opens no
        audit scope.

  n2r_reconciliation:
    name: pre-registered height-convention reconciliation for HEUR-1
    run_slot: R12 (reported alongside the replication counts)
    problem_statement: >
      The v1 decade ratios (1.47, 1.27) sit orders of magnitude below the
      HEUR-1 exponent-+2 prediction (x100 per decade) under the recorded
      r_height convention. DEC-20260908-d361ab N2 requires reporting N_6
      per H under BOTH the r_height convention AND HEUR-1's H, with the
      decade ratios as a frozen tail_check, before any count-law reading.
    conventions:
      A_recorded_r_height: >
        h_A = max_i rat_height(r_i) over the full r vector of the found
        instance, computed by the frozen rat_height of source/construct.py
        (hash-bound above) -- the convention under which v1 reported
        counts_per_H {10^2: 15, 10^3: 22, 10^4: 28}. Cumulative counts
        N_6^A(H) for H in {10^2, 10^3, 10^4}.
      B_solved_free_coordinate_height: >
        h_B = rat_height(t*) of the solved free coordinate (the kept root
        of the n=6 univariate quadratic, in canonical minimal form) -- the
        search-box reading of HEUR-1's H, under which the nested box
        schedules the coordinate the solver actually enumerates. Cumulative
        counts N_6^B(H) for H in {10^2, 10^3, 10^4}; instances with h_B
        above the top box are recorded as out-of-box observations and
        excluded from counts (the frozen-box discipline of v1, never an
        adaptive widening).
      exact_predicate_binding: >
        BEFORE any count is reported, the executor records BOTH exact
        predicates verbatim from the frozen v2 source into the R12 raw
        result: the rat_height definition lines and the instance
        classification lines for each convention. No post-hoc
        redefinition; a convention change after counts exist is a new
        amendment, not a reading.
    cross_tabulation: >
      Per found instance: (h_A, h_B, membership level under A, membership
      level under B). The full table is a required artifact.
    frozen_tail_checks: >
      Report the smallest and largest H-decade ratios of N_6 under EACH
      convention against the exponent-+2 prediction (factor 100 per
      decade), plus the two-decade totals. DESCRIPTIVE: this amendment
      creates NO new pass/fail band for the ratios (the v1 tail_check was
      reporting, and stays reporting).
    preregistered_interpretation_branches:
      - >
        Branch CONV-RESOLVED: if the convention-B decade ratios lie near
        the x100 prediction while convention-A ratios remain ~1.3-1.9, the
        recorded tension is a height-convention artifact at the tested
        scope; the resolution is recorded with both tables.
      - >
        Branch TENSION-REAL: if BOTH conventions' decade ratios remain far
        below x100, the tension is real at the tested scope: HEUR-1's
        construction-side count law stands UNVALIDATED with a recorded
        scoped tension. This is NOT a large-scale refutation (toy tier;
        H <= 10^4; the law's asymptotic regime is unmeasured) and F2_n6
        does not fire from ratios alone.
      - >
        Branch MIXED: any other pattern is recorded as an unreconciled
        measurement with exact numbers under both conventions; no
        interpretation is forced.
    interpretation_owner: >
      Branch selection is Coordinator/review work over the recorded tables;
      the executor reports numbers only.

  n3r_n8_rescope:
    name: n=8 rescope (cap-raised branch of N3)
    run_slot: R14 (seed 760910)
    sample_size: 10^4 b-tuples (UNCHANGED -- the rescope keeps the frozen declared sample, preserving comparability with the n=6 arm and the P4 per-tuple scale)
    counted_ops_cap: 2.0e9
    cap_justification: >
      Measured v1 per-tuple cost ~1.5e5 counted ops (R5: 100,002,120 ops at
      b_index 666). Completing 10^4 tuples requires ~1.5e9; the cap is
      raised to 2.0e9 (~33% headroom). This selects the "raise the
      counted-ops cap" branch of N3 over "narrow the declared sample";
      the choice is made here, pre-run, non-adaptively.
    wall_clock: >
      7200 s per run carried from v1. Observed v1 rate (75.7 s for 666
      tuples) projects ~19-30 min for the full sample; disclosed, advisory.
    box_convention_disclosure: >
      The IC-732-3 integer (a,b) box [-min(H,20), min(H,20)]^2 with c
      solved exactly is RETAINED and DISCLOSED as the declared enumeration
      scope (N3's disclosure branch): non-integer (a,b) inside the r-height
      box are outside the enumerated scope and are NOT claimed empty. Full
      rational height-H lattice enumeration at n=8 is NOT attempted and is
      recorded as unmeasured scope. Every R14 raw result carries this
      disclosure (repairing the v1 F-J3-2 documentation finding by making
      the record literal).
    exhaustion_semantics: >
      Cap or sample exhaustion remains inert in both directions (v1
      stopping_rules carried verbatim); F3_n8 can fire only on a COMPLETED
      enumeration with the recorded infeasibility pattern.
    height_reporting: R14 reports counts per H under conventions A and B exactly as R12 (H in {10^2, 10^3} at n=8, top H8 = 10^3, per v1).

  recording_discipline_repairs:
    - id: RD-1
      repair: >
        Null-family and plant-builder proofs/derivations are recorded
        non-destructively: an append-only per-b_index ledger, with the
        b_index-0 record written first and never overwritten (PD-1 repair).
        The R15 raw result retains the b_index-0 proof bytes or their hash.
    - id: RD-2
      repair: >
        All counts-identity comparisons are computed on canonically
        serialized (string-keyed, sorted) dicts AFTER JSON serialization;
        the raw flag records the comparison basis (R4 int-vs-str bug repair).
    - id: RD-3
      repair: >
        The near-miss ledger records the exact predicate used for a
        near-miss (validator F-J3-1 disclosure carried): a near-miss is a
        tuple with 0 kept solutions together with the failing condition
        label; the predicate is quoted from the frozen v2 source.

  run_slots_v2:
    maximum_runs_v2: 7
    enumerated:
      - run_id: RUN-ECRANK-73275e-R9-known-false-v2
        slot: R9 amended known-false control (IV-1R at n=6 + IV-1C ladder at n=8)
        seed: 760912
      - run_id: RUN-ECRANK-73275e-R10-planted-elliptic-n6
        slot: R10 planted elliptic n=6 detection control (IV-3R)
        seed: 760908
      - run_id: RUN-ECRANK-73275e-R11-planted-n8
        slot: R11 planted n=8 control, R7 family (elliptic at n=8), certifier ladder applied
        seed: 760914
      - run_id: RUN-ECRANK-73275e-R12-construct-n6-replication
        slot: R12 construct-n6 fresh-seed replication + N2R dual-convention reconciliation
        seed: 760906
      - run_id: RUN-ECRANK-73275e-R13-construct-n6-replay
        slot: R13 determinism replay of R12 (IV-2R)
        seed: 760906
      - run_id: RUN-ECRANK-73275e-R14-construct-n8-rescoped
        slot: R14 construct-n8 rescoped (N3R; cap 2.0e9; disclosed box)
        seed: 760910
      - run_id: RUN-ECRANK-73275e-R15-null-v2
        slot: R15 null object re-run (IV-4R + RD-1)
        seed: 760916
    ordering: >
      Controls before readings: R9, R10, R11, R15 first (admission), then
      R12, R13, R14. Control admission validates the amended instrument
      before any replication count is read (v1 control_admission discipline).
      If R9 IV-1R or R15 fails, the replication runs are NOT executed and
      the batch stops with the failed-control record (v1 stopping logic).

  budget_v2:
    enforcement: >
      Advisory time/CPU estimates; the binding scientific budgets are the
      fixed run count (7), the per-run counted-ops caps, the frozen sample
      sizes and the 8 GiB machine protection. No research spending cap is
      asserted (docs/research-budget-policy.md).
    wall_clock_seconds_per_run: 7200
    counted_ops_cap_per_run: 1.0e8
    counted_ops_cap_R14: 2.0e9
    maximum_memory_gb: 8
    maximum_workers: 1
    maximum_attempts_per_run: 12
    total_cpu_hours_worst_case: 14
    descent_calls: 0
    pari_ellrank_calls: 0
    network: none
    stdlib_only: true

  stopping_rules_v2:
    - v1 stopping_rules carried verbatim, with the R14 cap read as 2.0e9 (N3R).
    - Control admission gate: R9 (IV-1R), R15 (IV-4R) failures stop the batch before replication readings; R10 (IV-3R) failure does not stop R12/R14 execution but voids their COUNT readings and keeps counts as lower bounds.
    - The counted-op stop is exact at the per-run cap; checkpoints every 1e7 counted ops for R12/R14.
    - NO early stop for enough instances; NO adaptive box widening; NO adaptive ladder rungs; single fixed pass per (n, H) level.
    - A 13th attempt in any run is refused and recorded (IV-6 carried).

  invalidation_rules_v2:
    - IV-1R failure (certified n=6 total > 0 on the conic family) voids ALL v2 runs.
    - IV-4R failure (nonzero null solutions) voids every v2 count.
    - IV-2R failure voids the R12/R14 readings.
    - IV-3R detection failure voids the R12/R14 COUNT readings; feasibility and near-miss data remain; counts stay lower bounds.
    - IV-1C CERTIFIER_LIMITED is NOT an invalidation; it is a graded instrument-boundary outcome recorded with its ledger.
    - Every invalidation is recorded with the failing check's exact inputs; a voided run is never silently dropped (rule 8).

  success_criterion_v2: >
    DECIDABLE, WITH FIRST-CLASS NEGATIVE OUTCOMES. G4v2 (amended controls):
    R9 IV-1R passes (conic rejection, certified n=6 total 0) AND IV-1C
    returns PASS or a recorded CERTIFIER_LIMITED ledger; R10 detection 9/9
    inside the frozen exponent window; R11 passes its planted checks under
    the ladder; R15 returns exactly 0 with the non-destructive proof
    recorded. G5 (replication, primary): R12 N_6^A(10^4) >= 1 certified
    instance on the FRESH seed -- the n=6 existence result replicates at
    the tested scope -- with per-tuple incidence reported against the 3e-4
    draw-route bound (different-n caveat carried) and the full N2R
    dual-convention tables and decade ratios reported. G6 (n=8 rescope,
    secondary): R14 completes inside the raised cap and reports N_8 per H
    under both conventions (a zero remains inert unless the enumeration
    completed and the F3_n8 infeasibility pattern is recorded). The
    detection upgrade clause of IV-3R governs whether G5's counts are
    MEASURED or LOWER BOUNDS, and the record states which.
  falsification_criterion_v2: >
    F2_n6 applies to R12 at its declared scope: 0 certified instances with
    feasibility fraction > 0 on the fresh seed records a degeneracy blocker
    as a new measurement and names it; 0 with feasibility 0 closes the
    construction route at the tested scope only (rule 6). F3_n8 applies to
    R14 only on a COMPLETED in-cap enumeration with the recorded
    infeasibility pattern; cap breach keeps exhaustion inert. A failed
    control is an instrument invalidation, never a mathematical negative
    (rule 5). Nothing in v2 re-scores v1.

  required_artifacts_v2:
    - the v1 SR-3 nested `run:` schema + command.txt + environment.json companions for EVERY v2 run
    - per-rung certifier ledgers (IV-1C): per tuple, per bound, certified totals and op costs
    - the frozen plant-builder source and its per-plant derivation records (IV-3R)
    - the N2R convention-predicate record (verbatim source quotes) and the full per-instance cross-tabulation
    - decade-ratio tables under both conventions (frozen tail_checks)
    - near-miss ledgers with the RD-3 exact predicate
    - non-destructive proof ledgers (RD-1)
    - the same-machine/runtime independence disclosure (fresh_seeds.independence_disclosure_requirement)
    - attempt directories per IV-6, checkpoints per stopping rules
    - exact op ledgers with IC-1 exclusions itemized (SR-11 carried)
    - execution-report-v2.yaml (executor observations only; no interpretation, no finding labels, no status claims)
  completion_gate_v2:
    - All 7 v2 runs finalized with the nested run schema (or recorded control-admission stop with preserved receipts).
    - validate_ledger.py adds no new violations after the run package.
    - The Coordinator snapshot archive commits the full v2 run package BEFORE any independent review; the review round (frozen review_plan, blind re-derivation, validator, red team) is a separate later batch, as BATCH-24d356 was for v1.
  inference:
    requested_policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
