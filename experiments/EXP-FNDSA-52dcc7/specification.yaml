experiment:
  id: EXP-FNDSA-52dcc7
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-FNDSA-6a9cbb
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  batch_id: null
  assigned_to: executor
  title: >-
    Leaf-normalizer theta defect: read the standard's constants, evaluate the
    closed-form deviation and its critical threshold, calibrate the harmonic
    instrument on a six-rung width ladder against a continuous-Gaussian null,
    and audit whether the key-acceptance rule actually enforces the per-leaf
    width floor

  objective: >-
    If separately approved, frozen and authorized, produce for GOAL-FNDSA-001
    the calibrated detection instrument its first completion criterion names,
    together with the derived deviation-to-signature-count conversion the
    goal's objective asks for. Concretely: replace every recalled FN-DSA
    constant with primary text; evaluate eps_0, the per-signature
    Kullback-Leibler divergence, the distinguishing floor N_LLR and the
    critical per-leaf error eps_crit; demonstrate on a six-rung ladder that
    the harmonic instrument recovers a deviation of known size and that it
    reports zero on a null of the same shape; and check whether the
    standard's key-acceptance predicate enforces the width floor at every
    leaf or only at two extremes. NOTHING HERE HAS BEEN RUN AND NO RESULT IS
    ASSERTED.

  what_this_is_not:
    - Not an attack on FN-DSA, not a forgery, not a key recovery, and not a distinguisher an adversary could run -- the optimal statistic requires the trapdoor.
    - Not a measurement at FN-DSA-512 or FN-DSA-1024 parameters. Those enter by closed-form evaluation only; every empirical arm runs at toy widths.
    - Not a claim that the standardized sampler is exact, inexact, secure, or insecure.
    - Not a statement about timing, cache, power, fault, floating-point precision, or any integer-only reformulation. Those are the residual channels this contract explicitly does not test.
    - Not approval, freezing, execution authorization, a run, an observation, or evidence. No approved_by field is present.
    - Not a status change, criticism, or supersession of IDEA-20260801-010 or any other record.

  claim_ceiling: >-
    TIER: toy for every measured quantity; derivation for the closed forms,
    and that derivation is conditional on the Stage-0 constants. The exact
    scope a completed run could support: (i) a closed-form value of the
    per-signature divergence of an exact-arithmetic Klein-family sampler from
    the ideal coset Gaussian, evaluated at the constants actually read, with
    an information-theoretic floor on any distinguisher through that channel;
    (ii) a demonstration that the harmonic instrument recovers known
    deviations at six toy widths and returns zero on a matched null; (iii) a
    count of toy keys whose interior Gram-Schmidt norms violate a two-extreme
    acceptance predicate. IT COULD NOT SUPPORT: any attack cost, any exponent,
    any statement about a deployed or standardized implementation, or any
    claim that the sampler is exact. AGENTS.md rule 7 binds harder here than
    usual because the target is being standardized: a toy measurement is never
    reported as a statement about a fielded parameter set.

  inputs:
    stage0_source_preference_order:
      - "NIST CSRC draft FIPS 206 page and PDF"
      - "the FN-DSA / FALCON specification document as published by the submission team"
      - "the FALCON reference implementation source and its constant tables"
      - "an author-hosted or mirrored copy of any of the above"
      - "the pqc-forum archive for the constant values, recorded explicitly as a secondary source"
    stage0_required_extractions:
      - "q"
      - "sigma (signature width) at n = 512 and n = 1024"
      - "sigma_min and sigma_max at n = 512 and n = 1024"
      - "the key-acceptance predicate and the exact set of Gram-Schmidt norms it tests"
      - "the sampler pseudocode, sufficient to decide whether it is a randomized nearest-plane sampler"
      - "the signature-query bound q_s used in the security argument"
      - "the divergence in which the specification states its own sampler bound (statistical distance, Kullback-Leibler, or Renyi), and its numerical value"
    recalled_fallback_constants_labelled_unverified:
      q: 12289
      n512: {sigma_min: 1.277833697, sigma: 165.736617183, d: 1024}
      n1024: {sigma_min: 1.298280334, sigma: 168.38857, d: 2048}
      key_acceptance: "||B||_GS <= 1.17 sqrt(q)"
      q_s: "2^64"
      status: >-
        RECALLED, UNVERIFIED. Usable ONLY if Stage 0 fails to obtain primary
        text, and in that case every conclusion is restated as a statement
        about the Klein sampler family at these stated widths and NOT as a
        statement about FN-DSA. The substitution must appear in every
        conclusion sentence, not once in a limitations block.
    gaussian_convention: "rho_s(x) = exp(-x^2 / (2 s^2)); eps(s) = exp(-2 pi^2 s^2)"
    ladder_widths: [0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
    ladder_centers: [0.0, 0.125, 0.25, 0.375, 0.5]
    samples_per_ladder_cell: 4000000
    null_arm: "continuous Gaussian of identical width, discretized only at report time"
    toy_key_dimensions: [8, 16, 32]
    toy_keys_per_dimension: 200
    toy_modulus: 12289
    center_uniformity_messages: 1000000
    master_seed: 20260805
    domain: "EXP-FNDSA-52dcc7/v1"
    seed_derivation_rule: >-
      Every random stream is SHA-256 in counter mode over the ASCII byte
      string domain || "|" || label || "|" || decimal(width_index) || "|" ||
      decimal(center_index) || "|" || decimal(counter), with digests
      interpreted big-endian unsigned. Labels are exactly: "leaf-treat",
      "leaf-null", "key", "message", "center". A third party reproduces every
      instance bit-for-bit from (master_seed, domain, label, indices) and no
      other input.

  environment_preflight:
    required: >-
      Record, in the run manifest, the output of `python3 -c "import sys;
      print(sys.version)"`, `python3 -c "import numpy; print(numpy.__version__)"`,
      and an import attempt for scipy and sympy. AN IDEATION-SESSION
      OBSERVATION ON THIS MACHINE, OUTSIDE THE HARNESS, RECORDED HERE AS A
      CANDIDATE AND NOT AS A FACT: python 3.11.15, numpy 2.4.6 present, scipy
      and sympy absent. Two prior scouting sweeps of this repository disagree
      about the container's contents, so the executor MEASURES rather than
      assumes.
    dependency_policy: >-
      The design uses only the standard library (fractions, decimal, hashlib,
      math) and numpy. Normal quantiles are hard-coded constants recorded in
      the artifact. If numpy is absent the ladder runs in pure Python at
      reduced sample counts and the reduction is recorded; that is an
      infrastructure outcome, never mathematical evidence.

  arms_and_controls:
    treatment: >-
      ARM T. The discrete Gaussian leaf sampler at each ladder width and
      center, sampled by exact inverse-CDF over a window |z - c| <= 40 s using
      integer arithmetic on a 128-bit uniform drawn from the declared stream.
      The measured quantities are the empirical mean bias E[z - c] and the
      empirical first-harmonic amplitude of the normalizer, the latter
      estimated as the amplitude of the cos(2 pi c) component of the fitted
      log-normalizer across the five centers.
    measured_null: >-
      ARM N. The CONTINUOUS Gaussian of the identical width, at the identical
      centers, with the identical statistic applied to its (analytically
      known) normalizer, which is s sqrt(2 pi) INDEPENDENT OF c by translation
      invariance. FORCED VALUE, DERIVED BEFORE ANY RUN: first-harmonic
      amplitude EXACTLY 0 and mean bias EXACTLY 0. This arm shares shape, code
      path, sample count and statistic with ARM T and differs only in the
      support, so it isolates discreteness -- the load-bearing structure --
      and it CAN FAIL through an estimator bug, a biased random stream, or a
      wrongly implemented harmonic fit.
    positive_control: >-
      ARM P. The ladder's lowest rung, width 0.45, where the derived
      first-harmonic amplitude is 2 eps = 3.673436e-2 and the derived mean bias
      at c = 0.25 is -4.673880e-2. The instrument MUST recover both to within
      5 per cent. IF ARM P DOES NOT FIRE, THE INSTRUMENT IS BROKEN AND NO
      RESULT OF EITHER SIGN MAY BE REPORTED FROM ANY OTHER ARM.
    graded_control: >-
      ARM G. All six rungs, with pre-derived first-harmonic amplitudes
      3.673436e-2, 1.438377e-2, 5.102812e-3, 1.640149e-3, 4.776327e-4,
      1.260206e-4 and pre-derived mean biases at c = 0.25 of -4.673880e-2,
      -2.259397e-2, -9.698729e-3, -3.709930e-3, -1.267946e-3, -3.879873e-4.
      REPORT MONOTONICITY EXPLICITLY: the sequence must be strictly
      decreasing, and each adjacent ratio must match the derived
      exp(-2 pi^2 (s_{k+1}^2 - s_k^2)) within 10 per cent. A quantity that
      does not decay at the derived rate as the width -- the parameter meant
      to destroy it -- increases is the canonical artifact tell, and a failure
      at a specific rung localises where the closed form stops describing the
      object.
    enforcement_audit_arm: >-
      ARM E. For each toy dimension and each of 200 keys, compute ALL 2n
      Gram-Schmidt norms in EXACT RATIONAL ARITHMETIC (fractions, no floating
      point), and compare the maximum against the two-extreme quantity the
      recalled acceptance predicate tests. Report the count of keys for which
      an INTERIOR norm exceeds the two-extreme maximum, and the largest
      observed excess ratio.
    center_uniformity_arm: >-
      ARM C. From a toy recursive sampler at each dimension, over 10^6
      messages, report the MAXIMUM over leaves of |E[cos(2 pi c_i)]| and the
      MAXIMUM over leaf pairs of |E[cos(2 pi c_i) cos(2 pi c_j)]|. Maxima, not
      means: HEUR-FN-1's failure mode is existential in the leaf.
    ordering_control: >-
      ARM N and ARM G are generated, analysed, and hash-committed IN FULL
      before ARM T's standardized-width evaluation is looked at, and the
      frozen decision rule is executed on ARM N first. If the rule emits the
      same label on ARM N and on ARM T, it discriminates nothing and must be
      rewritten before either is read. Absence of the ARM N commitment before
      ARM T is an invalidation, not a warning.
    comparability_policy: >-
      No cross-experiment comparison of any kind is permitted from this
      contract. There is no predecessor in area FNDSA -- zero experiments,
      zero runs, zero evidence -- so there is nothing to compare against and
      no comparability claim may be constructed. A shared master seed with any
      future contract implies nothing about stream, key, or output
      equivalence.

  metrics:
    primary:
      - "eps_0 = exp(-2 pi^2 sigma_min^2) at the Stage-0 sigma_min, both parameter sets, reported as a base-2 exponent to three decimals"
      - "KL = d eps_0^2 and N_LLR = 1 / KL, both parameter sets, as base-2 exponents"
      - "eps_crit = sqrt(1 / (d q_s)) and the margin log2(eps_crit) - log2(eps_0) in bits"
      - "reconstruction-identity residual |1.17 sqrt(q) sigma_min - sigma| / sigma at the Stage-0 constants"
      - "measured first-harmonic amplitude per ladder rung in ARM T, beside the pre-derived value"
      - "measured first-harmonic amplitude per ladder rung in ARM N, which must be consistent with zero"
      - "count of toy keys in ARM E whose interior Gram-Schmidt norm exceeds the two-extreme maximum"
    secondary:
      - "measured mean bias per rung and center in both arms"
      - "adjacent-rung amplitude ratios against the derived exp(-2 pi^2 (s_{k+1}^2 - s_k^2))"
      - "ARM C maxima against the assumed 2^-10 bound, with the implied coherent and incoherent N_LLR extremes"
      - "largest excess ratio in ARM E"
      - "verbatim Stage-0 quotations with page references, or an explicit source-unavailability record"
      - "the divergence the specification itself uses for its sampler bound, and its value, beside this contract's KL"

  preregistered_prediction:
    quantity: >-
      G1 reconstruction residual; G2 eps_0; G3 N_LLR; G4 eps_crit and margin;
      G5 ladder amplitudes and monotonicity; G6 null-arm amplitude; G7
      weak-key count; G8 center-uniformity maxima. These are exactly the
      predictions of H-FNDSA-6a9cbb and are restated here as the frozen
      preregistration.
    formula: >-
      eps(s) = exp(-2 pi^2 s^2); KL = d eps(sigma_min)^2; N_LLR = 1 / KL;
      eps_crit = sqrt(1 / (d q_s)); ladder amplitude = 2 eps(s); ladder mean
      bias at center c = -4 pi s^2 eps(s) sin(2 pi c); null-arm amplitude = 0.
    source: >-
      Derived in H-FNDSA-6a9cbb and IDEA-20260805-2bbfb2 from Poisson
      summation and the Klein output identity, before any run, with no
      parameter fitted to any measurement. Numerical values at the recalled
      constants: eps_0 = 2^-46.500 and 2^-48.000; KL = 2^-83.000 and
      2^-85.000; N_LLR = 2^83.00 and 2^85.00; eps_crit = 2^-37.000 and
      2^-37.500; margins 9.50 and 10.50 bits; ladder amplitudes 3.673436e-2,
      1.438377e-2, 5.102812e-3, 1.640149e-3, 4.776327e-4, 1.260206e-4.
    tolerance: >-
      G1 below 1e-6; G2 within 0.05 in the base-2 exponent; G3 within 1 bit;
      G4 within 0.1 bit; G5 within 5 per cent per rung with strict
      monotonicity and adjacent ratios within 10 per cent; G6 within
      3 / sqrt(N) of zero; G7 exactly 0 predicted, any nonzero reported and
      escalated; G8 below 2^-10 predicted, above 2^-5 refutes HEUR-FN-1.

  stages_cheapest_first:
    - stage: 0
      name: primary-source acquisition
      compute: none
      wall_clock_seconds: 3600
      can_terminate_run: true
      termination_condition: >-
        If the specification shows the sampler is NOT a randomized
        nearest-plane sampler, the Klein identity does not apply, the
        hypothesis is void as a statement about FN-DSA, and the run stops with
        that finding as its deliverable. If no primary source can be obtained
        after the declared preference order is exhausted, that is a
        SOURCE-AVAILABILITY OUTCOME: it is recorded, GOAL-FNDSA-001's second
        pause condition is cited, later stages may still run on the recalled
        constants, and every conclusion is relabelled as concerning the Klein
        family rather than FN-DSA.
    - stage: 1
      name: closed-form evaluation and reconstruction identity
      compute: "arithmetic only; no sampling"
      wall_clock_seconds: 300
      can_terminate_run: true
      termination_condition: >-
        THIS IS THE DECISIVE CHEAP GATE. If eps_0 >= eps_crit at either
        parameter set, the exact-arithmetic sampler alone places the
        distinguishing floor inside the design query bound; the finding is
        routed immediately to AGENTS.md rule 12 independent
        review-breakthrough at max effort, and no further stage runs until
        that review returns. If the reconstruction residual exceeds 1e-3, the
        design-rationale reconstruction is wrong, ARM E becomes the priority,
        and the ladder is deferred.
    - stage: 2
      name: null arm and ladder calibration
      compute: "sampling; numpy"
      wall_clock_seconds: 2400
      can_terminate_run: true
      termination_condition: >-
        If ARM N shows a nonzero first harmonic, or ARM P fails to recover its
        derived amplitude within 5 per cent, the instrument is broken; the run
        stops and reports an instrument failure. NO RESULT OF EITHER SIGN IS
        REPORTABLE IN THAT CASE.
    - stage: 3
      name: Gram-Schmidt enforcement audit and center-uniformity diagnostic
      compute: "exact rational arithmetic; sampling"
      wall_clock_seconds: 1800
      can_terminate_run: false
      termination_condition: >-
        None; this stage always completes or reports partial coverage. A
        nonzero ARM E count is escalated under rule 12 rather than terminating
        the run.

  scale_relevance:
    tier: toy
    transfer_argument: >-
      The closed form eps(s) = exp(-2 pi^2 s^2) is an algebraic property of the
      one-dimensional discrete Gaussian and does NOT depend on the lattice
      dimension, so validating it at s = 0.45 through 0.70 validates the SAME
      identity that is evaluated at s = sigma_min. That is a check of a
      derivation, not an extrapolation, and it is the only thing in this
      contract that transfers across scale.
    transfer_limits: >-
      NOTHING ELSE TRANSFERS. The factor d, the leaf-center correlation
      structure, and the Gram-Schmidt profile are all properties of the actual
      dimension, and ARM C and ARM E run at n <= 32 against a target at
      n = 512 and 1024. A measured center-uniformity bound at n = 32 is NOT a
      bound at n = 512, and the report must say so at every use. The ladder's
      widths are also not the standardized widths; the standardized values are
      reached only by evaluating the validated closed form.

  replication:
    seeds: [20260805, 20260806, 20260807]
    planned_runs: 3
    interpretation: >-
      Three seeds per cell establish sampling reproducibility only. The
      seed-to-seed spread of each measured amplitude MUST be reported BEFORE
      the deviation of that amplitude from its derived value is reported. If
      the spread is comparable to or larger than the deviation, the
      measurement resolves nothing at that rung and must be reported as such
      rather than as agreement.

  budget:
    maximum_runs: 3
    maximum_wall_seconds: 8100
    maximum_cpu_seconds: 24000
    maximum_peak_rss_bytes: 4294967296
    maximum_total_disk_bytes: 2147483648
    maximum_workers: 1
    network: >-
      Stage 0 REQUIRES outbound HTTPS through the configured agent proxy and
      is the only networked stage. Stages 1 to 3 run with no network. A proxy
      refusal in Stage 0 is a source-availability outcome, not a result.

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived, and execution-authorized by the Coordinator. It carries no approved_by field.
    - Stop at Stage 1 and escalate under rule 12 if eps_0 >= eps_crit at either parameter set.
    - Stop before ARM T is examined if the ARM N commitment and its digest are absent.
    - Stop and report an instrument failure if ARM P does not recover its derived amplitude within 5 per cent.
    - Stop any stage that exceeds its declared wall-clock allowance and report the coverage achieved rather than extrapolating.
    - Stop and escalate under rule 12 if ARM E returns a nonzero weak-key count.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - ARM T generated or analysed before the ARM N commitment exists.
    - Any Gram-Schmidt norm in ARM E computed in floating point rather than exact rational arithmetic.
    - Any reported conclusion about FN-DSA when Stage 0 failed to obtain primary text and the recalled constants were used.
    - Any reported ladder amplitude without its seed-to-seed spread reported first.
    - Any use of a random stream not derivable from the declared seed rule.
    - Any statement of N_LLR as an attack cost, or of a toy measurement as a crypto-scale result.

  infrastructure_failure_disposition: >-
    A timeout, crash, proxy refusal, missing dependency, or exhausted budget
    is INFRASTRUCTURE SIGNAL and is NEVER negative mathematical evidence
    against H-FNDSA-6a9cbb or any proposition in RQ-FNDSA-001 (AGENTS.md rule
    5). Specifically: an unobtainable draft FIPS 206 text is a
    source-availability outcome that triggers GOAL-FNDSA-001's declared pause
    condition and is reported as such; an absent numpy is a dependency
    outcome that reduces sample counts; an exhausted Stage-2 budget is
    reported as partial ladder coverage naming exactly which rungs completed.
    In every case the record states what was NOT measured, and no
    unmeasured cell is described as consistent with anything.

  success_criterion: >-
    This contract has NO current success outcome because it is not authorized
    for execution. If a separately approved, frozen and authorized successor
    is executed, its only positive disposition is a COMPLETE INSTRUMENT
    READOUT: Stage 0 constants quoted or their unavailability recorded; Stage
    1 closed forms evaluated and the reconstruction identity checked; ARM N
    committed before ARM T and consistent with its forced value of zero; ARM P
    firing within 5 per cent; all six ladder rungs measured, monotone, and
    within tolerance with their seed spreads reported first; ARM E and ARM C
    completed with their maxima stated. THAT DISPOSITION ESTABLISHES NO
    ATTACK, NO EXPONENT, NO CRYPTO-SCALE CLAIM, AND NO STATEMENT THAT THE
    STANDARDIZED SAMPLER IS EXACT OR INEXACT.

  falsification_criterion: >-
    The contract falsifies H-FNDSA-6a9cbb if any of the following is observed:
    Stage 0 shows the sampler is not randomized-nearest-plane (clause A void);
    the Stage-0 constants violate sigma = 1.17 sqrt(q) sigma_min above 1e-3
    relative (clause F void); a recomputed eps_0, KL, N_LLR or eps_crit falls
    outside its stated tolerance (clauses D and E void); the ladder amplitudes
    do not follow exp(-2 pi^2 s^2) across six rungs (clause B void); or ARM N
    shows a nonzero first harmonic (instrument void, and in that case no
    falsification of the hypothesis may be claimed either).

  required_artifacts:
    - The frozen approved specification and a freeze receipt binding its SHA-256.
    - Stage-0 source transcript with verbatim quotations, page references, retrieval URLs and timestamps, or an explicit per-source unavailability record naming what was attempted.
    - The Stage-1 evaluation script, its exact command line, and its stdout, with every derived number.
    - The ARM N commitment digest and its timestamp, provably preceding ARM T generation.
    - Per-rung, per-center, per-seed raw measurement records for both arms, with the seed derivation rule reproduced.
    - The full list of 2n exact rational Gram-Schmidt norms for every ARM E key, with the acceptance-predicate comparison.
    - ARM C harmonic-moment maxima with the message count and seeds.
    - Environment manifest: python version, numpy presence and version, scipy and sympy import results, git commit, dirty-tree state, and the resolved inference block.
    - An execution report naming every cell NOT measured and why.
    - A snapshot archive followed by independent Validator and Red Team review before any evidence record is written.

  approval_requirements:
    - Independent review confirms that ARM N is a genuine null with a pre-derived forced value that can fail, that ARM P is a genuine sensitivity demonstration, and that the ladder's derived values were fixed before any measurement.
    - Independent review confirms the Stage-0 substitution policy is stated strongly enough that a recalled-constant run cannot be read as a statement about FN-DSA.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
    - Rule 12 routing is pre-agreed for the two escalation paths: eps_0 >= eps_crit, and a nonzero ARM E count.

  approval_status: >-
    Pending Coordinator review. No approved_by field is present because this
    contract is not approved, and only the Coordinator may approve it
    (AGENTS.md rule 1).
