experiment:
  id: EXP-MULTIV-5a040c
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-8c5f12; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-8c5f12
  question_id: RQ-UOV-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Partial-knowledge difficulty curve for toy UOV key recovery: first-fall degree and field-operation
    cost against the number of revealed oil vectors, with a shape-matched random null at every point.'
  objective: 'The uncertainty reduced is how the difficulty of UOV key recovery depends on partial
    knowledge of the oil space, and how much of that dependence is structural rather than a consequence
    of the system shrinking. Stated as parts: (i) the run measures, at each j from 0 to o-1, the residual
    system''s exact equation and variable counts, its first-fall degree, and its bounded-solve field-operation
    cost over 30 keys, producing a curve with intervals rather than the single endpoint every existing
    in-repo record reports; (ii) it builds, at each j, a uniformly random quadratic system with the
    identical residual shape and a planted solution, and measures it with the same code in the same
    invocation, so that the trivial part of the gradient is absorbed by an executed null and only
    the difference is attributed to structure; (iii) it measures dispersion across 30 different random
    choices of the revealed subspace at fixed j, so that the question of whether C(j) is even a well-defined
    function is answered by measurement rather than assumed. The run recovers no key of any real scheme,
    claims no exponent, and speculates nowhere about how partial knowledge might be obtained.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supported scope is: at the named toy (q, v, m) with
      one solver lineage, one derived-system formulation and one degree cap, the residual difficulty
      proxy and solve cost follow the reported curve in the number of revealed oil vectors, and differ
      from the shape-matched random null by the reported pointwise amounts with 30-instance intervals.
      What does NOT follow: no attack and no exponent; nothing about deployed UOV parameters; no claim
      that revealed oil vectors are obtainable in any real setting; and, if a structure-attributable
      difference is measured, no claim that it grows, persists, or means anything at larger parameters,
      which this run cannot see.'
  inputs:
    procedure: 'STAGE 0, formulation freeze (cost: human): fix the derived system, the constraint-imposition
      rule, the degree cap and the solver budget in the run log. STAGE 1, construction and counting
      code (cost: medium): key generator with planted oil space, subspace revealer, residual-count
      calculator whose outputs are asserted against closed-form values before every solve. STAGE 2,
      gating controls (cost: minutes): j = o degenerate check and wrong-subspace negative control;
      abort on failure. STAGE 3, anchor check (cost: minutes): j = 0 first-fall degree against H-UOV-4d1377''s
      pre-registered value at a shared cell; abort on mismatch. STAGE 4, main sweep (cost: hours):
      j in 0..o-1, 30 keys per j, three toy cells, both arms interleaved with paired seeds. STAGE
      5, dispersion arm (cost: hours): 30 distinct revealed subspaces at fixed j and fixed key. STAGE
      6, analysis (cost: minutes): curves, pointwise differences, intervals, cap-hit rates.'
    instrument: Python 3 with exact F_q arithmetic via precomputed tables for q in {4, 16}; Macaulay
      matrix assembly and rank by an instrumented Gaussian elimination that returns a field-operation
      count, written for this experiment and shared byte-for-byte between arms; constraint imposition
      by explicit linear substitution with the resulting counts asserted against closed-form predictions.
      No computer algebra system and no Sage. Driven by harness/runner.py for seeds, manifests and
      the inference block.
    parameters: q in {4, 16}; (v, m) in {(5,4), (6,5), (7,5)} giving n in {9, 11, 12} and o = m; j
      from 0 to o-1 in unit steps; 30 independently seeded keys per (cell, j); 30 distinct revealed
      subspaces for the dispersion arm at j = 2 on one fixed key per cell; Macaulay degree cap 5 at
      the smallest cell and 4 elsewhere; solver budget capped at 10^9 field operations per instance.
  controls:
  - Shape-matched random null at every j, interleaved in the same invocation, which is the arm that
    absorbs the shrinking-system effect.
  - 'Subspace-choice control: at fixed j, repeat with 30 distinct random revealed subspaces to measure
    dispersion, so a curve is not read off a single lucky choice.'
  - j = 0 anchor against the independently pre-registered first-fall degrees of H-UOV-4d1377 at shared
    cells.
  - j = o degenerate control, where the problem is solved and the measured residual cost must be zero,
    catching bookkeeping errors in the constraint imposition.
  - 'Wrong-subspace negative control: reveal a random j-dimensional subspace NOT inside O and confirm
    the residual system becomes inconsistent or its solution set empty, proving the constraints are
    actually being imposed.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a uniformly random quadratic system over F_q with
    exactly the residual system''s equation and variable counts at each j, carrying a planted solution
    so that it is solvable, run through the identical measurement code in the same invocation and
    interleaved. For the signal arm to mean anything, the null curve must be nonflat - it will fall
    simply because the system shrinks - and the reportable quantity is the DIFFERENCE between the
    two curves. If that difference is zero within intervals at every j, the gradient is entirely a
    shrinking-system effect and the deliverable is exactly that controlled null, which is a usable
    result rather than a failure.'
  independent_variables:
  - number of revealed oil vectors j
  - arm (UOV residual, shape-matched random null)
  - field size q
  - parameter pair (v, m)
  - choice of revealed subspace at fixed j
  metrics:
    primary:
    - first-fall degree of the residual system
    - field operations to bounded solve
    - pointwise signal-minus-null difference in first-fall degree
    - pointwise signal-minus-null difference in field operations
    secondary:
    - exact residual equation and variable counts per j
    - dispersion across revealed-subspace choices
    - degree-cap hit rate and solver-budget exhaustion rate per j
    - annihilation certificate result for every planted oil space
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The first-fall degree of the residual key-recovery system as a function of the number
      j of revealed oil vectors, and its difference from the shape-matched random null at the same
      j.
    formula: For the residual system at reveal level j, with residual equation count M(j) and residual
      variable count N(j) both computed in closed form from (v, m, j) before any solve, the predicted
      semi-regular first-fall degree is the index of the first non-positive coefficient of the series
      [(1 - z^2)^{M(j)} / (1 - z)^{N(j)}]_+ . The pre-registered prediction is that the shape-matched
      null attains exactly this value at every j, and that the signal arm attains it too unless UOV
      structure contributes, in which case the signal arm is strictly lower and the difference is
      the reported quantity.
    source: Pre-registered in the parent proposal IDEA-20260816-8c5f12 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested at n <= 12 over q <= 16, chosen so that the planted oil space is exhaustively
      verifiable, the j = 0 point coincides with an independently pre-registered value from H-UOV-4d1377,
      and the degree cap does not bind at any j except possibly j = 0 at the largest cell, which is
      reported as a bound. No transfer to deployed UOV parameters is claimed or attempted; the extrapolation
      to larger (v, m) is explicitly left open and unmeasured.
    correspondence: null
  tail_checks:
  - j = 1, the minimal partial knowledge, where a structural effect would be smallest and most likely
    to be lost in dispersion
  - j = o-1, where one vector remains and the residual system is smallest and most likely to be degenerate
  - the largest cell at j = 0, where the degree cap is most likely to bind
  - q = 4 versus q = 16 at matched (v, m), since the null's behaviour is q-dependent
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - abort if the j = 0 anchor disagrees with the pre-registered value
  - cap the degree and the solver budget in advance; any capped instance is reported as a bound and
    never as negative mathematical evidence
  - stop adding cells once the signal-minus-null difference is within intervals of zero at every j
    in two consecutive cells
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both arms produce a complete curve over j = 0..o-1 at every cell with 30-instance
    intervals, the j = 0 anchor and both gating controls pass, and the pointwise difference between
    arms is reported with its interval whatever its sign.
  falsification_criterion:
  - The j = 0 anchor disagrees with H-UOV-4d1377's pre-registered value at a shared cell.
  - Signal and null curves coincide within intervals at every j, which is a controlled null and falsifies
    the structure-attributable gradient.
  - Non-monotone first-fall degree in j beyond dispersion.
  - Dispersion across revealed subspaces exceeding the j-to-j step.
  - The wrong-subspace negative control yielding a consistent residual system.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-8c5f12
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact derived-system formulation to use at j > 0 is not pinned down here; the Coordinator
    must choose one (intersection-style or reconciliation-style) and freeze it, because the curve
    is formulation-dependent and comparing curves across formulations would be meaningless.
  - Whether the shape-matched null should also match the residual system's multi-homogeneous structure
    - which IDEA-20260808-ec2128 argues the intersection system has and generic systems do not - is
    unresolved and materially affects what the difference means.
  - Closed-form M(j) and N(j) are asserted to exist and be computable; they are not derived in this
    proposal and must be before approval.
