experiment:
  id: EXP-ECDLP-8a96c6
  hypothesis_id: H-ECDLP-731225
  derived_from_idea: IDEA-20260725-007
  question_id: RQ-ECDLP-002
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Ensemble calibration of the column-matched D5 null - K equal to 16 seeded greedy
    constructions and K equal to 16 admissible-swap walk samples at n equal to 9 and
    n equal to 12, with the interpretation map E1 / E2 / E3 fixed before execution
    and every anchor reproduced first

  objective: >-
    The one uncertainty a run reduces - whether the recorded support-bias pair,
    extra_5 equal to 369 of a 909 deficit at n equal to 9 and extra_5 equal to 0 of
    1,321 at n equal to 12, reflects a property of the CELL, a property of the greedy
    TRAJECTORY, or a construction family with too little entropy for either question
    to be decidable. Every recorded column-matched null in this program sits on ONE
    greedy trajectory - SIG8_run.sage line 734 calls greedy_cover with the single tag
    main - so the distribution behind those two numbers has never been sampled. A run
    establishes (i) median and IQR of extra_5 over K equal to 16 independently seeded
    greedy constructions at each size; (ii) the count of n equal to 12 samples with
    extra_5 greater than 0, reported separately per family, which is the load-bearing
    half; (iii) the median pairwise support Jaccard within each ensemble, which decides
    whether the family can vary at all; (iv) the family-W admission rate, which tests
    the safe-pool preservation argument; and (v) the within-size Spearman correlation
    between extra_5 and conc_5, never pooled across sizes. The interpretation map is
    fixed in the parent proposal and reproduced in this contract BEFORE execution,
    because E1 is the convenient outcome. No attack, no solve, no factor-base relation
    and no attack-cost quantity is produced.

  what_this_is_not:
  - >-
    Not EXP-SIG-008 gate 3, which is FINAL and measured exactly one column-matched null
    at n equal to 12 with share 0 of 1,321. This contract measures the DISTRIBUTION
    that gate sampled once, which EV-SIG-008 itself lists as unmeasured and as an
    unresolved confound.
  - >-
    Not T11 or its EXP-R6-001 control-4 deployment, which randomise coefficients on a
    fixed support and are VACUOUS over GF(2) where every support coefficient is 1.
  - >-
    Not IDEA-20260725-001, whose new arm is a FULL-SUPPORT unconstrained random system
    probing the D6 boundary law. That asks whether the support constraint matters at
    all at D6; this asks whether the D5 support-bias number is reproducible within the
    constraint. The two compose and neither replaces the other.
  - >-
    Not a D6 experiment. No closure engine and no D6 rank is computed; the expensive
    object in EXP-SIG-008 was the D6 staircase (RUN-EXP-SIG-008-n, secs_total 1,182)
    and this contract does not touch it.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output or
    evidence. No run has been executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at n equal to 9 and n equal to 12, over the SAFE-POOL
      admissible construction family and the two sampled procedures, extra_5 has a
      stated median, IQR and zero-count per family per size, the ensemble has a stated
      median pairwise support Jaccard, family W has a stated admission rate, and
      extra_5 has a stated within-size Spearman correlation with conc_5. WHAT DOES NOT
      FOLLOW - nothing about D6 in either direction; nothing about prime fields or
      cryptographic scale; nothing about column-matched nulls built by a DIFFERENT
      admissible construction, since the ensemble explores only the safe-pool set; and
      NOT a validation of the cascade interpretation of the sem deficit even under a
      fully E1 outcome - E1 removes one alternative explanation and nothing more.

  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking). Fix the definitions BEFORE execution -
      conc_5 as |C5_null intersect T5_sem| / |T5_sem| where T5_sem is the set of
      degree-5 monomials the SEM's D5 column set MISSES (1,584 at n equal to 9 per
      EV-SIG-006 observation 1) and C5_null is the null's D5 column set; delta5_in as
      |C5_sem minus C5_null| and delta5_out as |C5_null minus C5_sem| (recorded net
      difference 11 at n equal to 9, 15 at n equal to 12); pairwise support Jaccard
      over the union of the 2n equation supports. Fix the interpretation map (i) to (v)
      reproduced below. Fix the walk lengths to be swept for family W, at least two
      values.
      STAGE 1 (anchors, blocking). Reproduce the sem D5 anchors at both sizes before
      admitting any null sample - n equal to 9 deficit 909 per EV-SIG-005/006; n equal
      to 12 rank 28,097, sr_pred 29,418, deficit 1,321, extra 1,322, rankK5 2,093,
      kernel 3,415, nrows 31,512, ncols 46,709 per RUN-EXP-SIG-008-c raw.json. A
      failure here is INSTRUMENT FAILURE, not evidence.
      STAGE 2 (recorded-construction regression, blocking). Admit the two recorded
      n equal to 9 constructions as ensemble members and reproduce their identical D5
      numbers - rank 9,135, deficit 369, kernel 1,305, rankK 936, extra 369 - from
      RUN-EXP-SIG-006-c and -d; and reproduce the n equal to 12 N1 with extra_5 equal to
      0, ncols 46,694, rankK 2,094 from RUN-EXP-SIG-008-c.
      STAGE 3 (attribution control, blocking at n equal to 9). Reproduce the
      NON-COLUMN-MATCHED nulls N0 and N2 with extra_5 equal to 0 (EV-SIG-006 control
      C2). This is what attributes the 369 to column matching rather than to randomness
      per se, and without it no ensemble number means anything.
      STAGE 4 (family G). K equal to 16 greedy samples per size with distinct
      seed_tags. Per sample measure rank_5, sr_pred, deficit_5, kernel_dim_5, rankK_5,
      extra_5, ncols_5, delta5_in, delta5_out, conc_5, |V|, swap_repairs, the
      D6-colset-equality boolean, and n_free_classes / n_forced_classes.
      STAGE 5 (family W). K equal to 16 admissible-swap walk samples per size, walk
      length swept over at least two values, from the recorded N1. Same per-sample
      measurements plus the admission rate.
      STAGE 6 (determinism). Rebuild at least one sample per (size, family) and check
      byte-identity, matching the recorded determinism_rebuild_identical control.
      STAGE 7 (zero compute). Apply the pre-fixed interpretation map, report per size
      and per family with NO pooling, and state which of E1, E2, E3 the data selects or
      that the data selects none.
    instrument: >-
      The pinned EXP-SIG-006 / EXP-SIG-008 instrument, experiments/EXP-SIG-008/
      SIG8_run.sage, with greedy_cover (lines 646 to 647) called at K distinct
      seed_tags rather than the single tag main (line 734), and with the existing swap
      primitive (risk test at lines 707 to 722, safe pools at lines 435 to 444) driving
      family W. D6 column-set equality verified per sample by the existing colset_of_int
      check (lines 763 to 776). Instrument sha256 must match the pinned version
      (RUN-EXP-SIG-008-c records instrument_sha256_matches_pinned true). Recorded
      through harness/runner.py. Resume-safe checkpointing with 8 samples per invocation.
    parameters: >-
      Rung 1 - n equal to 9, ncols about 11,000 to 12,600, K equal to 16 family-G and
      K equal to 16 family-W. Rung 2 - n equal to 12, sem D5 ncols 46,709, nrows
      31,512, K equal to 16 and K equal to 16. D5 ONLY. Column matching enforced at D6
      by set equality; exact D5 equality is NOT asserted because it does not hold for
      the recorded constructions. Walk length swept over at least two values in family W.

  controls:
  - >-
    SEM ANCHOR REPRODUCTION, blocking - reproduce the sem D5 anchors at both sizes
    before admitting any null sample. A failure is instrument failure, not evidence.
  - >-
    RECORDED-CONSTRUCTION REGRESSION, blocking - admit RUN-EXP-SIG-006-c and -d as
    ensemble members and reproduce their byte-identical D5 numbers, and reproduce the
    n equal to 12 N1.
  - >-
    NON-MATCHED BASELINE ANCHOR at n equal to 9, blocking - reproduce N0 and N2 with
    extra_5 equal to 0 (EV-SIG-006 control C2), which is what attributes the 369 to
    column matching rather than to randomness per se.
  - >-
    EXACT D6 COLUMN-SET EQUALITY per sample, with delta5_in and delta5_out reported as
    covariates and the rejected-sample count reported. EXACT D5 EQUALITY IS NOT
    ASSERTED - it does not hold for the recorded constructions and a control demanding
    it would be unsatisfiable.
  - >-
    |V| MEASURED PER SAMPLE AND USED TO STRATIFY - recorded values are 0 for RUN-006-d
    N1, 1 for RUN-006-c N1, 1 for the old null, 6 for the sem at n equal to 9, and 2
    for N1 at n equal to 12. A |V|-versus-extra_5 correlation is a DISTINCT explanation
    from support concentration and stratification is mandatory.
  - >-
    INDEPENDENCE CHECK - median pairwise support Jaccard reported per family; at least
    0.99 triggers the E3 branch rather than a share figure.
  - >-
    DETERMINISM REBUILD of at least one sample per (size, family), matching the
    recorded determinism_rebuild_identical control.
  - >-
    INSTRUMENT SHA256 IDENTITY with the pinned EXP-SIG-006/008 instrument.
  - >-
    MATCHED-CONTROL DECLARATION (RQ-ECDLP-002 constraint 3;
    docs/claims-and-verification.md) - Pollard rho, BSGS and generic lower bounds are
    NOT applicable and are deliberately omitted. This run calibrates a baseline
    instrument, performs no solve, produces no factor-base relation and asserts no
    attack-cost quantity; it carries certificate kind none, the designated value for
    pure measurement runs. THIS SENTENCE MUST APPEAR IN THE RUN MANIFEST rather than
    the field being left blank.

  independent_variables:
  - 'size n - 9 and 12'
  - 'construction family - G (seeded greedy) and W (admissible-swap walk)'
  - seed_tag within family G
  - walk length within family W, at least two values
  - '|V| as a stratification variable'

  metrics:
    primary:
    - >-
      extra_5 per sample - integer count of D5 relations in excess of the truncated
      series prediction - the ensemble's median and IQR over median reported per
      (size, family), never pooled
    - >-
      count of n equal to 12 samples with extra_5 greater than 0 - integer out of 16 -
      reported SEPARATELY for family G and family W so the source is attributable
    - >-
      median pairwise support Jaccard - dimensionless in [0,1] over the union of the
      2n equation supports - per (size, family); at least 0.99 selects E3
    - >-
      family-W admission rate - dimensionless in [0,1] - the fraction of walk samples
      whose D6 column set still equals the sem's
    - >-
      within-size Spearman rho between extra_5 and conc_5 - dimensionless in [-1,1] -
      computed separately at n equal to 9 and n equal to 12 and NEVER pooled
    secondary:
    - deficit_5, rank_5, ncols_5, nrows_5, sr_pred_n_5, rankK_5, kernel_dim_5 per sample
    - delta5_in and delta5_out per sample, reported alongside every extra_5 as uncontrolled covariates
    - conc_5 per sample
    - variety_size_V per sample, used for stratification
    - swap_repairs per sample
    - d6_colset_equal_bool per sample, and the count of rejected samples per family
    - n_free_classes and n_forced_classes per size
    - median_extra_5 and iqr_extra_5 per (size, family)
    - 'absolute difference of median extra_5 between families at n equal to 9'
    - wall_seconds_per_sample and peak_rss_gb

  heuristic_under_test:
    id: HEUR-SIGENS-1
    formal_statement: >-
      Distinct seed_tags passed to greedy_cover produce statistically independent draws
      from the admissible column-matched construction family, so the measured IQR over
      16 samples estimates the family's spread rather than the spread of a correlated
      pseudo-replicate set.
    tested_here: true
    how: >-
      Directly, by the median pairwise support Jaccard within each ensemble. At least
      0.99 means the draws are pseudo-replicates, the IQR underestimates the family's
      spread, and E1 and E2 are BOTH undecidable - which is the E3 verdict and a
      first-class pre-registered outcome. The second heuristic, HEUR-SIGENS-2 (family
      W's safe-pool preservation argument), is tested by the admission rate against 0.9.

  preregistered_prediction:
    quantity: >-
      Median and IQR over median of extra_5 in the n equal to 9 family-G ensemble; the
      count of n equal to 12 samples with extra_5 greater than 0 per family; and the
      median pairwise support Jaccard at n equal to 9.
    formula: >-
      UNDER E1 - median extra_5 at least 200, IQR over median at most 0.5, at most 2 of
      16 with extra_5 equal to 0 at n equal to 9, and 0 of 16 in each family at
      n equal to 12. UNDER E2 - IQR over median at least 1.0, or at least 4 of 16 with
      extra_5 equal to 0 at n equal to 9, or any n equal to 12 sample with extra_5
      greater than 0. UNDER E3 - median pairwise support Jaccard at least 0.99, in which
      case E1 and E2 are undecidable with this family regardless of the extra_5 numbers.
      INTERPRETATION MAP, FIXED BEFORE EXECUTION - (i) small within-size spread at both
      sizes, Jaccard at most 0.95, and 0 of 32 nonzero at n equal to 12 gives E1; (ii)
      large n equal to 9 spread with IQR over median at least 1.0, or any nonzero at
      n equal to 12, gives E2; (iii) median Jaccard at least 0.99 gives E3; (iv) the two
      families' medians differing by at least 150 at n equal to 9 means the operative
      variable is the construction procedure and the family must be re-specified; (v)
      any sample failing D6 column-set equality is excluded and counted, and at least 4
      of 16 failures in family G at a size means the generator is unreliable there and no
      support-share figure may be quoted from it.
    source: >-
      Pre-registered in the parent proposal IDEA-20260725-007, whose predictions block
      and minimal_test.design carry every threshold and the full interpretation map
      verbatim, written before any sample was drawn and explicitly so because E1 is the
      convenient outcome that preserves every D at most 5 SIG conclusion. Never tuned to
      data.

  scale_relevance:
    tier: toy
    justification: >-
      Executed at exactly the two sizes the committed records used, n equal to 9 and
      n equal to 12, because the entire design is a calibration of THOSE recorded
      numbers and comparability is the point. The n equal to 12 rung is the decisive one
      because n equal to 9 is documented in EV-SIG-005 as an anomalous size (residual_4
      equal to 24 against law 7), so a large n equal to 9 spread might reflect that
      anomaly rather than construction noise. No transfer to other sizes, to prime
      fields or to cryptographic scale is claimed or used.
    correspondence: null

  tail_checks:
  - >-
    Report the extra_5 values for all 16 samples per (size, family), not only median and
    IQR, since a single outlier at n equal to 12 is the load-bearing observation and a
    summary would hide it.
  - >-
    Stratify extra_5 by |V| and report the strata separately; a |V|-driven effect is a
    different explanation from support concentration and must not be pooled with it.
  - >-
    Report Jaccard against walk length W in family W; a small W gives correlated samples
    by construction, and the sweep exists to expose that.
  - >-
    Report the count of samples REJECTED for D6 column-set inequality per family per
    size; at least 4 of 16 in family G voids that size's share figures.
  - >-
    Report n_free_classes and n_forced_classes per size; a materially higher forced
    fraction at n equal to 12 makes the 0-of-16 prediction there weak evidence rather
    than strong, and that must be stated in the reading.
  - >-
    Report delta5_in and delta5_out alongside every extra_5; they are uncontrolled
    covariates by design and must never be conditioned away.

  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
    note: >-
      The ensemble's 16 seed_tags per family per size are the primary replication
      device; these three seeds govern the seed_tag generation and the family-W walk
      draws, so that the ensemble itself is reproducible.

  budget:
    wall_clock_seconds_per_run: 240
    wall_clock_seconds_total: 2700
    total_cpu_hours: 0.75
    maximum_memory_gb: 2
    maximum_runs: 12
    note: >-
      Anchored to measured receipts rather than guessed. RUN-EXP-SIG-008-b records the
      n equal to 12 construction at greedy plus repair 1 s, colset verify 0 s,
      determinism 1 s, |V| 9 s, total 12 s wall and 776 MB peak RSS; RUN-EXP-SIG-008-c
      records sem D5 echelon 6 s, N1 D5 echelon 6 s, total 13 s wall and 1.15 GB peak
      RSS. So a full n equal to 12 sample is about 16 s and K equal to 16 per family is
      about 9 minutes; at n equal to 9 the D5 echelon is recorded at 0 to 1 s. The
      expensive object in EXP-SIG-008 was the D6 staircase (RUN-EXP-SIG-008-n,
      secs_total 1,182), which this contract does not touch. K at n equal to 12 is
      therefore RAISED from 8 to 16 rather than cut. 8 samples per invocation with
      resume-safe checkpointing.

  stopping_rules:
  - >-
    Stop immediately if the Stage 1 sem D5 anchors do not reproduce at either size.
  - >-
    Stop immediately if the Stage 2 recorded n equal to 9 constructions do not return
    369, or the n equal to 12 N1 does not return extra_5 equal to 0 with ncols 46,694
    and rankK 2,094.
  - >-
    Stop immediately if the Stage 3 non-matched baseline anchors N0 and N2 do not return
    extra_5 equal to 0 at n equal to 9.
  - >-
    Stop immediately if instrument sha256 does not match the pinned EXP-SIG-006/008
    instrument.
  - >-
    Do not compute any D6 rank and do not invoke the closure engine.
  - >-
    Do not revise the interpretation map, any threshold, or the definitions of conc_5,
    delta5_in, delta5_out or Jaccard after any sample is drawn.
  - >-
    Stop at the declared totals. A CENSORED RUNG IS INCONCLUSIVE, NOT NEGATIVE
    (AGENTS.md rule 5).

  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run
    failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md rule 5).
    A censored rung is inconclusive.
  - >-
    A sample failing exact D6 column-set equality is EXCLUDED and COUNTED, not repaired.
  - >-
    A run asserting exact D5 column-set equality is invalid_measurement - that control is
    unsatisfiable for the recorded constructions and demanding it would reject every
    admissible sample.
  - >-
    A run pooling extra_5 or the Spearman correlation across sizes is
    invalid_measurement.
  - >-
    A run quoting a support-share figure from a family whose median pairwise Jaccard is
    at least 0.99, or from a size where at least 4 of 16 family-G samples failed colset
    equality, is invalid_measurement.
  - >-
    A run whose manifest omits the MATCHED-CONTROL DECLARATION sentence, or whose
    certificate kind is blank rather than none, is invalid_measurement.
  - >-
    A run whose instrument sha256 differs from the pinned version is a DIFFERENT
    instrument and its numbers are not comparable to the committed anchors.
  - >-
    A run whose parameters or thresholds differ from the frozen contract is a DIFFERENT
    experiment and requires a new contract.

  success_criterion: >-
    The sem D5 anchors reproduce at both sizes, the two recorded n equal to 9
    constructions return 369 and the n equal to 12 N1 returns extra_5 equal to 0, the
    N0/N2 non-matched anchors return extra_5 equal to 0 at n equal to 9, the instrument
    sha256 matches the pinned version, and the run reports all 16 per-sample extra_5
    values plus every listed per-sample metric for family G and family W at both sizes,
    together with the median pairwise Jaccard, the family-W admission rate, the
    within-size Spearman correlations, the rejected-sample counts and at least one
    determinism rebuild per (size, family). This criterion is decidable from the primary
    metrics alone and says nothing about which of E1, E2 or E3 is selected.

  falsification_criterion:
  - >-
    Median extra_5 over the n equal to 9 family-G ensemble is at most 100. The claim that
    369 is a size-typical value is FALSE.
  - >-
    IQR over median of n equal to 9 family-G extra_5 is at least 1.0, or at least 4 of 16
    give extra_5 equal to 0. E1 is falsified, the confound is trajectory-dependent, and
    the recorded 40.6 / 0.0 percent pair is not interpretable as a size effect.
  - >-
    Any n equal to 12 sample in either family has extra_5 greater than 0. The
    load-bearing half is falsified and EV-SIG-008's 0.0 percent statement must be
    re-scoped, with the family identified so the source is attributable.
  - >-
    Median pairwise support Jaccard is at least 0.99 in family G at n equal to 9. E1 and
    E2 are BOTH undecidable with this family; the correct report is E3 and no share
    figure may be quoted from a single draw.
  - >-
    Family-W admission rate is below 0.9. HEUR-SIGENS-2 is false, family W contributes
    nothing to the family comparison, and that is stated rather than the arm silently
    dropped.
  - >-
    The two families' median extra_5 differ by at least 150 at n equal to 9. The claim
    that the effect is a property of column matching is falsified in favour of procedure
    dependence, and the null family must be re-specified before further use.
  - >-
    The sem D5 anchors fail to reproduce, or the recorded constructions do not return
    369. Instrument failure - no null statement may be made and the run yields no
    evidence.
  - >-
    At least 4 of 16 family-G samples fail D6 column-set equality at a size. The
    generator is unreliable there and no support-share figure may be quoted from it.

  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model
    and inference block, instrument sha256 against the pinned EXP-SIG-006/008 instrument,
    certificate kind none, the verbatim MATCHED-CONTROL DECLARATION sentence, and
    environment
  - >-
    raw-result.json carrying every per-sample measurement for all 64 samples - not
    medians or summaries - including extra_5, deficit_5, rank_5, ncols_5, nrows_5,
    sr_pred_n_5, rankK_5, kernel_dim_5, delta5_in, delta5_out, conc_5, variety_size_V,
    swap_repairs and d6_colset_equal_bool
  - >-
    the anchor and regression outputs of Stages 1 to 3, compared line by line against
    EV-SIG-005, EV-SIG-006, RUN-EXP-SIG-006-c, RUN-EXP-SIG-006-d and RUN-EXP-SIG-008-c
  - >-
    the Stage 0 pre-declaration text, written before any sample is drawn and hashed,
    containing the definitions of conc_5, delta5_in, delta5_out and Jaccard, the
    interpretation map (i) to (v), and the walk lengths to be swept
  - >-
    the determinism rebuild outputs, at least one per (size, family), with the byte
    identity verdict
  - >-
    the rejected-sample list with the reason per rejection, and the Jaccard-versus-walk-
    length table for family W

  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution, and under this engagement approval
    is the USER's gate because it authorizes execution and spends compute. This contract
    is NOT approved - approved_by is null and execution_authorized is false
    (AGENTS.md rule 1).
  - >-
    The parent proposal is not proof-oriented and the paired hypothesis records
    not_applicable_reason on its proof_search_map, so no KN-TECH-080 audit is required.
  - >-
    ID NOTE FOR THE APPROVER - the parent proposal IDEA-20260725-007 carries an inline
    comment describing its own identifier as a placeholder for the coordinator to
    confirm or renumber. This contract cites it as written and mints nothing. If that
    identifier collides with another record, the correct remedy is a superseding
    proposal record under a fresh identifier, NEVER a rename, and this contract's
    derived_from_idea would then need a new version rather than an edit.
  - >-
    The definitions, the interpretation map and the walk-length sweep must be recorded at
    Stage 0 before any sample is drawn. E1 is the convenient outcome and the map exists
    to make that irrelevant.

  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3 to 5
    source_record: IDEA-20260725-007
    authored_at: '2026-08-25'
    note: >-
      This contract is an almost direct transcription of the parent proposal, which is
      unusually complete - the eight predictions with their thresholds, the interpretation
      map (i) to (v), the nine controls, the twenty-three required metrics, the eight
      falsification conditions and the receipt-anchored budget are all carried across
      verbatim in substance. That proposal is itself a supersession of an earlier
      formulation that a screen returned with five defects plus one the author found
      independently - the unsatisfiable exact-D5-column-equality control - and all six
      repairs are preserved here. Committed values (369, 909, 1,321, 1,322, 9,135,
      11,004, 11,021, 46,709, 46,694, 31,512, 28,097, 29,418, 2,093, 2,094, 3,415, 1,305,
      936, 1,584, 36 free / 2 forced, and the receipt timings) are quoted from EV-SIG-005,
      EV-SIG-006, EV-SIG-008 and the named run receipts as those records' claims, not
      asserted here. Budgets come from the parent's own receipt-anchored budget block. No
      field is invented.

  derivation_gaps:
  - >-
    The family-W walk lengths are specified only as at least two values swept. They must
    be pinned at Stage 0, because a walk length chosen after seeing a Jaccard would
    select the independence verdict.
  - >-
    The parent proposal flags a plus-or-minus-one labelling inconsistency between
    EV-SIG-005's D5 deficit series (1322 at n equal to 12) and the receipt (deficit 1,321,
    extra 1,322). The receipt values govern by the proposal's own instruction, but the
    inconsistency is unresolved in the ledger and a reader comparing against EV-SIG-005
    will see a mismatch that is not this run's doing.
  - >-
    The |V| stratification is mandatory but the proposal does not say what to do when a
    stratum contains one sample, which is likely given the recorded |V| values 0, 1, 2 and
    6. A Coordinator should fix the minimum stratum size before the run rather than after.
  - >-
    Whether 16 distinct seed_tags actually yield 16 distinct chosen sets is unknown before
    the run - and if they do not, that IS the E3 outcome rather than a defect. The
    contract handles this correctly, but it means the ensemble's effective sample size is
    not knowable in advance and the IQR may be computed over fewer distinct systems than
    16.
  - >-
    The Spearman correlation between extra_5 and conc_5 is computed over 16 points per
    size, which gives a wide confidence interval. The proposal's thresholds of 0.6 and 0.2
    are stated without an interval; a measured value between them should be reported as
    inconclusive rather than binned, and the contract does not currently declare that band.
