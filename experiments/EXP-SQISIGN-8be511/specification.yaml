experiment:
  id: EXP-SQISIGN-8be511
  hypothesis_id: H-SQISIGN-481eaf
  derived_from_idea: IDEA-20260805-18a4d4
  question_id: RQ-SQISIGN-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Does the secret actually cancel - independent pen-and-paper re-derivation with a
    groupoid order-match audit, then a toy quaternion measurement of the distinct
    pair-class count over R secrets at frozen commitments, with a deliberately broken
    positive control and a graded 1, R, 1, R, 1 multiplicity control; plus a gated
    reading arm for the hybrid threshold

  objective: >-
    The one uncertainty a run reduces - whether the claimed cancellation
    [conj(J_i) J_j] equal to [conj(K_i) K_j] holds AS APPLIED to a SQIsign-shaped
    construction, which decides whether an entire family of multi-signature transcript
    statistics can be removed from consideration before any of them is budgeted. A run
    establishes (i) an independent re-derivation verdict, with the failing step NAMED
    if it fails, produced by a reviewer checking every product for matching orders
    since left ideal classes form a groupoid and not a group; (ii) the number of
    distinct canonical pair classes observed as the SECRET is varied over R independent
    keys with commitments and challenges frozen by seed, which the identity FORCES to
    exactly 1; (iii) the deliberately broken positive control, where the pair statistic
    is [J_i J_j] and the multiplicities ADD, whose distinct-class count MUST exceed 1
    and should be about R; (iv) the graded control over m equal to 2 to 6, whose
    predicted pattern 1, R, 1, R, 1 no plausible instrument artifact reproduces; and
    (v), IF AND ONLY IF a specification can be obtained, the two-number comparison
    (D_psi D_phi)^2 against p and the binary question of which threshold the
    specification's own parameter derivation uses. The reading arm is expected to be
    recorded BLOCKED. No attack, break, speedup or security consequence is claimed here
    or would follow from a run.

  what_this_is_not:
  - >-
    Not a claim that SQIsign transcripts are safe, and it must never be cited as one. A
    negative result about one functional family is not a security statement.
  - >-
    Not a statement about unforgeability. Even the distinguisher branch would bear on
    the zero-knowledge argument only.
  - >-
    Not a claim that any designer omitted the hybrid factor q. The claim is that THIS
    CORPUS has never written q down.
  - >-
    Not an entry into GOAL-SSI-001's endomorphism-ring lane or GOAL-SQISIGN-002's
    published-data-surface lane, and not a use of KN-TECH-057's baselines as an attack
    route. This contract costs no hard problem.
  - >-
    Not a statement about the single-transcript functionals S1, where the interesting
    risk is. Blurring the two would be exactly the premature closure the inventor
    protocol forbids.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output or
    evidence. No run has been executed under this contract.

  claim_ceiling:
    tier: >-
      theory for the derivation, toy for the measurement. Neither licenses any
      cryptographic-scale statement.
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - the cancellation identity was or was not confirmed by
      an independent re-derivation with every order match checked; at the executed toy
      prime and the executed R, the distinct canonical pair-class count over secrets is
      the recorded value, the positive control's is the recorded value, and the graded
      family's pattern is the recorded one. WHAT DOES NOT FOLLOW - nothing about any
      deployed parameter set; nothing about the single-transcript functionals S1, S2 or
      S3, which are named as survivors and NOT tested; nothing about unforgeability;
      nothing about whether any scheme is secure or insecure; and no threshold or
      walk-length number at all unless the reading arm actually executed against an
      obtained specification.

  inputs:
    procedure: >-
      STAGE 0 (pen and paper, DECISIVE, zero compute, blocking). An INDEPENDENT reviewer
      re-derives the cancellation from I conj(I) equal to n(I) O_left(I) and
      conj(AB) equal to conj(B) conj(A), CHECKS EVERY PRODUCT FOR MATCHING ORDERS - the
      groupoid trap - and either confirms it or NAMES THE STEP THAT FAILS. A failure here
      ends the contract at zero cost and is the most valuable possible outcome per unit
      spend. The reviewer must not have authored the derivation.
      STAGE 0b (zero compute, blocking). Fix the toy prime, R (at least 8), the graded m
      set, and the SECRET-INDEPENDENT class canonicalisation rule, and record the rule
      verbatim. A canonicalisation that depends on the secret would leak it back in
      through the implementation and is the single most likely way to get this wrong.
      STAGE 1 (reading, GATED by source availability, zero compute). Attempt to obtain a
      SQIsign specification. If obtained - extract D_psi, D_phi, D_sigma, p, lambda and
      the signing-query budget q VERBATIM, evaluate (D_psi D_phi)^2 against p, and record
      which threshold the zero-knowledge parameter derivation compares against, quoting
      the statement verbatim. IF NOT OBTAINED - record the source attempted and the
      failure mode, and compute NOTHING. RQ-SQISIGN-001's provenance records that no
      specification of any version has been read by this program.
      STAGE 2 (positive control, blocking, run BEFORE the main arm). Implement the
      DELIBERATELY BROKEN variant - response built as conj(I_tau) K_i but the pair
      statistic formed as [J_i J_j] - and measure the distinct canonical class count over
      the same R secrets at the same frozen commitments. It MUST exceed 1 and should be
      about R. If it returns 1, the instrument is measuring nothing and no conclusion may
      be drawn from any arm.
      STAGE 3 (main arm). Measure the distinct canonical class count of [conj(J_i) J_j]
      over R independent secrets with commitments and challenges FROZEN BY SEED. Forced
      value 1.
      STAGE 4 (graded control). Form the m-fold alternating product for m equal to 2, 3,
      4, 5, 6 and measure the distinct-class count at each. Predicted 1, R, 1, R, 1.
      STAGE 5 (archive check, zero compute). Record that no prior measurement of this
      observable exists in this corpus - there are no SQISIGN-area evidence records at
      all. The absence is recorded AS AN ABSENCE and not claimed as a passed check.
      STAGE 6 (zero compute). Write the closure at the inventor-protocol section 4
      standard - obstruction, argument, forward guidance naming S1, S2, S3 - or withdraw.
    instrument: >-
      Quaternion ideal arithmetic at a toy prime with canonical class representatives,
      WRITTEN FROM THE DEFINITIONS. The parent proposal records, verified on this machine
      on 2026-08-05, that this container has no Sage, no PARI and no sympy, so nothing is
      inherited. Every ideal product is checked for matching orders at construction time
      and refuses to form otherwise, so a groupoid violation is a runtime error rather
      than a silent wrong answer. The canonicalisation rule is applied by a routine that
      never receives I_tau as an argument, which makes secret-independence structural
      rather than a promise. Recorded through harness/runner.py.
    parameters: >-
      One toy prime, fixed at Stage 0b and recorded. R independent secrets, at least 8,
      fixed at Stage 0b. Commitments and challenges frozen by seed and IDENTICAL across
      all R secrets and across all arms. Graded m in 2, 3, 4, 5, 6. Class canonicalisation
      rule fixed and recorded verbatim at Stage 0b.

  controls:
  - >-
    DERIVED NULL THAT CAN FAIL, blocking - vary the secret I_tau over R independent keys
    with commitments and challenges frozen by seed, and measure the number of distinct
    pair classes. FORCED VALUE 1, derived pre-run. More than 1 means the identity is
    wrong. This is a null with real teeth because the IDENTITY, not a distributional
    assumption, is what forces the value.
  - >-
    POSITIVE CONTROL THAT MUST FIRE, blocking and run FIRST - the deliberately broken
    variant forming [J_i J_j] instead of [conj(J_i) J_j], where the I_tau multiplicities
    ADD rather than subtract so the secret does NOT cancel. The measured distinct-class
    count MUST exceed 1 and should be about R. If the instrument reports 1 there too, it
    is measuring nothing.
  - >-
    GRADED CONTROL with at least 3 interior points - the m-fold alternating product for
    m equal to 2, 3, 4, 5, 6, whose net I_tau multiplicity is 0 for even m and 1 for odd
    m, giving the predicted alternating pattern 1, R, 1, R, 1. No plausible instrument
    artifact reproduces an alternating pattern, and its failure localises exactly which
    multiplicity bookkeeping is wrong.
  - >-
    ORDER-MATCH ENFORCEMENT - every ideal product refuses to form unless the right order
    of the first factor equals the left order of the second, so the groupoid trap
    produces an error rather than a wrong class.
  - >-
    SECRET-INDEPENDENT CANONICALISATION, structural - the canonicalisation routine never
    receives I_tau, so a normalisation cannot leak the secret back in.
  - >-
    ARCHIVE CHECK, zero compute - no prior measurement of this observable exists in this
    corpus, there being no SQISIGN-area evidence records at all. Recorded as an ABSENCE,
    not claimed as a passed check.
  - >-
    INDEPENDENCE OF THE RE-DERIVER - the Stage 0 reviewer must not have authored the
    derivation, per the review-architecture blind-re-derivation requirement.

  independent_variables:
  - 'secret I_tau, varied over R independent keys with commitments and challenges frozen'
  - 'pair statistic - [conj(J_i) J_j] (main) versus [J_i J_j] (broken positive control)'
  - 'alternating-product length m in 2, 3, 4, 5, 6'

  metrics:
    primary:
    - >-
      re-derivation verdict - one of confirmed or failed - with the FAILING STEP NAMED if
      it failed, produced by a reviewer independent of the derivation's author
    - >-
      distinct pair-class count, main arm - integer - the number of distinct canonical
      values of [conj(J_i) J_j] over R secrets at frozen commitments; FORCED VALUE 1
    - >-
      distinct pair-class count, positive control - integer - the same quantity for
      [J_i J_j]; MUST exceed 1 and should be about R
    - >-
      graded distinct-class counts - a vector of 5 integers, one per m in 2, 3, 4, 5, 6 -
      predicted 1, R, 1, R, 1
    secondary:
    - >-
      (D_psi D_phi)^2 against p - two integers, BOTH QUOTED FROM THE SOURCE with the
      quotation - computed only if Stage 1 obtained a specification; otherwise the literal
      value BLOCKED with the source attempted
    - >-
      the threshold the specification actually uses - one of 2^-lambda,
      2^-(lambda + log2 q), or BLOCKED - quoted verbatim if obtained
    - >-
      corrected walk length k* at the q-charged threshold - computed from the sibling
      spectral formula only if lambda, q and log2(n) were obtained from the source;
      otherwise BLOCKED
    - >-
      order-match violation count - integer - the number of times an ideal product was
      refused for mismatched orders, which should be 0 in a correct implementation and
      whose nonzero value localises a bug
    - >-
      canonicalisation collision rate - the number of distinct ideals mapping to the same
      canonical representative and vice versa, reported so a canonicalisation that
      collapses everything cannot masquerade as a cancellation

  heuristic_under_test:
    id: HEUR-SC-2
    formal_statement: >-
      The q-query hybrid is the correct accounting for the scheme's stated security model
      - the model charges signing queries and the zero-knowledge statement is
      per-transcript rather than per-transcript-set.
    tested_here: conditionally
    how: >-
      Only by Stage 1, which quotes the specification's zero-knowledge statement and its
      parameter derivation VERBATIM, or records that the source could not be obtained.
      This is a fact about a document and is settled by reading it, not by argument.
      HEUR-SC-1, the cancellation itself, is NOT a heuristic - it is an identity and is
      tested by Stages 0, 2, 3 and 4 rather than assumed.

  preregistered_prediction:
    quantity: >-
      The distinct pair-class count over R secrets at frozen commitments, on the main arm
      and on the deliberately broken positive control, and the graded pattern over m.
    formula: >-
      D_main := |{distinct canonical [conj(J_i) J_j] over R secrets}|; PREDICTED EXACTLY 1.
      D_control := |{distinct canonical [J_i J_j] over R secrets}|; PREDICTED greater than
      1 and about R. D_graded(m) := the same count for the m-fold alternating product;
      PREDICTED 1, R, 1, R, 1 for m equal to 2, 3, 4, 5, 6. Under the null that the
      identity is false as applied, D_main exceeds 1. Under the null that the instrument
      measures nothing, D_control equals 1.
      SEPARATELY AND DERIVED BEFORE ANY READING - at lambda equal to 128 with q equal to
      2^64 the required per-transcript statistical distance is 2^-192 rather than 2^-128,
      and substituting lambda' equal to 192 with log2(n) equal to 252.415 into the sibling
      spectral walk-length formula k* equal to (0.5 log2(n) + lambda' + 1)/0.0849625 gives
      3757 two-isogeny steps against 3003.8 at lambda' equal to 128. THESE ARE DERIVED
      ARITHMETIC, NOT MEASUREMENTS, and are recomputable in one line.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-18a4d4, whose predictions block
      states EXACTLY 1 for the secret-dependence metric with the note that this is the
      derived null that can actually fail, states the honest and simulated bounds for the
      pair-separation metric, states the binary threshold question, and derives 3757
      against 3004 explicitly before any reading or run. The graded 1, R, 1, R, 1 pattern
      is that proposal's own graded control. Never tuned to data.

  scale_relevance:
    tier: toy
    justification: >-
      The measurement runs at a toy prime because the identity under test is a POINTWISE
      ALGEBRAIC IDENTITY, not a distributional statement - it either holds for every
      I_tau or it does not, so a toy prime tests it exactly as well as a cryptographic
      one, and the only thing scale would buy is the plausibility of the recalled protocol
      shape. That is why the Stage 0 re-derivation is the decisive arm and the toy
      measurement is a check that the implementation instantiates the shape the
      derivation assumes. NO transfer to cryptographic parameters is claimed; the
      distinguisher inequality (D_psi D_phi)^2 less than p is a statement about the REAL
      parameters and is therefore BLOCKED, not approximated at toy scale.
    correspondence: >-
      The Deuring correspondence is what lets the measurement be performed entirely on the
      quaternion side, where ideal classes are computable at a toy prime, instead of
      requiring isogeny computations on curves. That is the only reason the toy arm is
      affordable at all in a container with no Sage and no PARI.

  tail_checks:
  - >-
    Report the R canonical class representatives individually, not just their count; a
    count of 1 obtained because the canonicalisation collapses everything looks identical
    to a count of 1 obtained because the secret cancels.
  - >-
    Report the canonicalisation collision rate explicitly, for exactly that reason.
  - >-
    Report the order-match violation count; it should be 0, and a nonzero value means the
    groupoid enforcement is catching a bug the derivation assumed away.
  - >-
    Report the graded counts for every m separately and identify the FIRST m at which the
    predicted pattern breaks, since that position localises the failing bookkeeping step.
  - >-
    Report the positive control's count as a number, not as a boolean exceeds-1; a control
    returning 2 when R is 8 is a much weaker control than one returning 8 and the
    difference must be visible.

  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
    note: >-
      Seeds fix the commitments and challenges, which must be IDENTICAL across all R
      secrets and across all arms within one instance and DIFFERENT across instances. A
      forced value of 1 that appears only for one commitment set is not the identity.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1.0
    maximum_memory_gb: 8
    maximum_runs: 16

  stopping_rules:
  - >-
    Stop immediately if the Stage 0 independent re-derivation names a failing step. The
    contract ends at zero compute and that is the most valuable outcome per unit spend.
  - >-
    Stop immediately if the Stage 2 positive control returns a distinct-class count of 1.
    The instrument is measuring nothing.
  - >-
    Do not run Stage 3 before Stage 2 has been executed in the same invocation.
  - >-
    Do not compute (D_psi D_phi)^2 against p, the threshold answer, or any corrected walk
    length from ASSUMED parameters. If the specification was not obtained, record BLOCKED.
  - >-
    Stop if the quaternion arithmetic cannot be implemented and cross-checked within the
    declared budget. That is INFRASTRUCTURE - the parent proposal rates Stage 2
    implementation as HIGH and gates it - and it is never a negative result about the
    identity.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a
    stop, never a negative result (AGENTS.md rule 5).

  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or an inability to implement the ideal arithmetic
    makes the run failed_infrastructure and is NEVER evidence about the identity
    (AGENTS.md rule 5). The parent proposal explicitly gates the toy stage on
    implementation cost.
  - >-
    A run whose positive control was not executed in the same invocation as the main arm
    is invalid_measurement.
  - >-
    A run whose canonicalisation rule was not recorded verbatim before any measurement, or
    whose canonicalisation routine receives I_tau, is invalid_measurement - the secret
    could then leak back in through normalisation, which is the single most likely way to
    get this wrong.
  - >-
    A run computing with REPRESENTATIVES and reporting a CLASS conclusion is
    invalid_measurement.
  - >-
    A run in which the commitments and challenges differ across the R secrets is
    invalid_measurement - the identity is a statement at FROZEN commitments and a varying
    commitment set would trivially produce distinct classes.
  - >-
    A run quoting (D_psi D_phi)^2, p, lambda, q or a walk length from anything other than
    an obtained and quotable specification is invalid_measurement.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment and
    requires a new contract.

  success_criterion: >-
    The Stage 0 independent re-derivation returns a verdict with the failing step named if
    it failed; the canonicalisation rule is recorded verbatim before any measurement; the
    positive control is executed before the main arm and returns a distinct-class count
    greater than 1; and the run reports the distinct pair-class count on the main arm, on
    the positive control and at every m in the graded family, together with the R
    individual canonical representatives, the canonicalisation collision rate and the
    order-match violation count - plus either an executed Stage 1 with verbatim quotations
    or an explicit BLOCKED record naming the source attempted. This criterion is decidable
    from the primary metrics alone and says nothing about which counts are found.

  falsification_criterion:
  - >-
    The main arm returns MORE THAN ONE distinct pair class across secrets at frozen
    commitments while the positive control fires. The identity is FALSE AS APPLIED, the
    whole record collapses, and it must be withdrawn by a superseding record. This is the
    cheapest and most decisive falsifier available.
  - >-
    The Stage 0 re-derivation names a step where orders do not match or where a class
    statement was used as a representative statement. The cancellation is withdrawn at
    zero compute.
  - >-
    The positive control returns 1. The instrument is measuring nothing and no conclusion
    may be drawn from any arm in either direction.
  - >-
    The graded family returns a pattern other than 1, R, 1, R, 1 while the main arm and
    positive control both behave. The multiplicity bookkeeping is wrong and the first
    deviating m localises where; the cancellation may hold at m equal to 2 while the
    general argument does not, and those are different claims.
  - >-
    Stage 1 obtains a specification whose response is NOT built from a path through E_0,
    so [J_i] equal to [conj(I_tau) K_i] does not hold. The derivation must be redone
    against the actual construction - the shape survives, the details do not.
  - >-
    Stage 1 obtains a specification that ALREADY charges the q factor. C3's accounting
    half is void as an external observation and becomes an internal correction to this
    program's own comparison threshold. Recorded in advance so the less flattering outcome
    cannot be quietly dropped.
  - >-
    Stage 1 obtains parameters for which (D_psi D_phi)^2 is NOT less than p. The pair
    family is closed for distinguishing as well as for key recovery, and that closure is
    reported with its named obstruction and forward guidance.

  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and
    inference block, and environment; and a separate manifest for the independent Stage 0
    re-derivation session
  - >-
    the re-derivation report, naming the reviewer's independence from the derivation's
    author, listing every product with its order match checked, and NAMING THE FAILING
    STEP if it fails
  - >-
    raw-result.json carrying the R individual canonical class representatives for the main
    arm, the positive control and every graded m - not just counts
  - >-
    the positive control's measurements, in the same file as the main arm
  - >-
    the Stage 0b pre-declaration text, written before any measurement and hashed,
    containing the toy prime, R, the graded m set and the VERBATIM canonicalisation rule
  - >-
    the Stage 1 record - either verbatim quotations of D_psi, D_phi, D_sigma, p, lambda,
    q and the zero-knowledge statement with their source, or a BLOCKED entry naming the
    source attempted and the failure mode
  - >-
    the canonicalisation collision rate and the order-match violation count
  - >-
    certificate kind none, the designated value for pure measurement runs, since no solve,
    no forgery and no relation is produced

  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution, and under this engagement approval
    is the USER's gate because it authorizes execution and spends compute. This contract
    is NOT approved - approved_by is null and execution_authorized is false
    (AGENTS.md rule 1).
  - >-
    PROOF-ORIENTED GATE. The parent proposal states explicitly that it carries no
    proof_search_map and that a coordinator promoting it must require its own first. The
    paired hypothesis H-SQISIGN-481eaf now carries one - bottleneck, baseline embedding
    with the deliberately broken variant as the frozen fixture, an executed
    observation-collision search, an explicit quantifier order for both C1 and C2, a
    method ceiling, a nearby-object control and six proof obligations. THAT MAP MUST BE
    AUDITED AGAINST KN-TECH-080 BEFORE IMPLEMENTATION, and the audit is a separate act
    from approving this contract.
  - >-
    IMPLEMENTATION-COST WARNING FOR THE APPROVER. The parent proposal rates the toy
    quaternion stage as HIGH implementation and records, verified on this machine, that
    this container has no Sage, no PARI and no sympy - so the ideal arithmetic would be
    written from scratch. The proposal explicitly does NOT propose that stage for its
    batch. This contract includes it because without it no outcome would be decidable by
    measurement, but the approver may reasonably approve STAGE 0 ALONE, which is
    decisive, free, and whose failure would end the record at zero cost.
  - >-
    The Stage 0 re-derivation must be performed by a reviewer INDEPENDENT of the
    derivation's author, per the review-architecture blind-re-derivation requirement.
  - >-
    The toy prime, R, the graded m set and the secret-independent canonicalisation rule
    must be recorded verbatim before any measurement.

  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3 to 5
    source_record: IDEA-20260805-18a4d4
    authored_at: '2026-08-25'
    note: >-
      The four-stage design, the derived null with its forced value of 1, the deliberately
      broken positive control, the graded 1, R, 1, R, 1 control, the archive-check
      absence, the required metrics and the falsification conditions are taken from the
      parent proposal's minimal_test, controls, predictions and falsification_conditions
      blocks. THREE ADDITIONS BY THIS CONTRACT, all recorded - the structural
      secret-independence of the canonicalisation routine (it never receives I_tau),
      because the proposal names class-versus-representative as the single most likely way
      to get this wrong but leaves the remedy as an instruction; the canonicalisation
      collision rate, because a count of 1 from a collapsing canonicalisation is
      indistinguishable from a count of 1 from cancellation; and the order-match
      enforcement at construction time, which converts the groupoid trap from a review
      obligation into a runtime error. The proof_search_map required by the proposal was
      authored onto the paired hypothesis by the Coordinator and its unaudited parts are
      listed under derivation_gaps. The derived numbers 3757 and 3003.8 are quoted from
      the parent proposal as DERIVED ARITHMETIC, not as measurements. Budgets come from
      the parent's declared estimated_cost (Stages 0 to 1 none, Stage 2 implementation
      HIGH, compute low). No field is invented.

  derivation_gaps:
  - >-
    THE PROTOCOL SHAPE IS RECALLED AND UNVERIFIED. No SQIsign specification of any version
    has been read by this program. Everything the toy arm measures is the identity as
    applied to a shape this program believes but has not checked, and Stage 1 - the arm
    that would check it - is the arm most likely to be blocked. This is the contract's
    largest gap and it cannot be closed from inside the container.
  - >-
    The toy prime and R are unspecified by the proposal. R must be large enough that the
    positive control's expected count of about R is distinguishable from a small integer;
    at least 8 is this contract's floor, and a Coordinator should consider whether it is
    enough.
  - >-
    The canonicalisation rule is required to be stated and secret-independent but is not
    specified. Choosing it is real mathematical work - a rule that is not canonical would
    produce spurious distinct classes and falsely refute the identity, and a rule that is
    too coarse would collapse everything and falsely confirm it. The collision-rate metric
    exposes the second failure but not the first.
  - >-
    The proof_search_map on the paired hypothesis was authored by the Coordinator from the
    proposal's content rather than supplied by the proposer. Its
    observation_collision and method_ceiling entries have NOT been independently audited,
    and KN-TECH-080 requires that audit before implementation rather than after.
  - >-
    The distinguisher branch C2 cannot be evaluated without real parameters, so the
    contract can confirm the cancellation while leaving the sharpest output - the
    proven-key-blind distinguisher - entirely undecided. The approver should know that the
    most interesting half of the parent proposal is the half most likely to return BLOCKED.
