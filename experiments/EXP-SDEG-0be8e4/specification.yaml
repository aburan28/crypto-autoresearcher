experiment:
  id: EXP-SDEG-0be8e4
  hypothesis_id: H-SDEG-3acfcf
  question_id: RQ-SDEG-001
  goal_id: GOAL-SDEG-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  approved_by: null
  source_proposal: IDEA-20260805-2afd22
  assigned_to: executor

  title: >-
    What fraction of a charged Semaev decomposition cost is certificate-backed:
    a zero-compute coverage derivation, a toy measurement of its two inputs, and
    a first attempt at a verifiable certificate for the failed attempts

  objective: >-
    Produce the numerator specification GOAL-ICEX-001 needs and GOAL-SDEG-001
    has not yet written: the certificate-covered share chi of a charged
    C_decomp(p, m), stated per arity with its two measured inputs (the
    per-attempt success probability P_dec and the cost ratio C_fail/C_succ);
    the collection-versus-linear-algebra decomposition of the numerator with its
    Amdahl ceiling; a MEMORY COLUMN beside every time figure, which this goal's
    completion criterion does not currently require; and, if it survives its own
    gate, one explicit degree-bounded Nullstellensatz witness certifying a FAILED
    decomposition attempt.

  what_this_is_not:
    - Not an ECDLP attack and not a speedup. No algorithm is proposed or improved.
    - >-
      Not a cost, exponent, asymptotic, crypto-scale, or deployed-scheme claim.
      In particular NOT a claim about the index-calculus exponent alpha.
    - >-
      Not a claim that index calculus loses to Pollard rho, or wins. The memory
      finding is that the two are Pareto-INCOMPARABLE until a memory model is
      fixed; asserting a winner in either direction is outside this contract.
    - >-
      Not a claim that GOAL-SDEG-001's or GOAL-ICEX-001's completion criterion is
      unmet, and not a request for any status change to any goal, hypothesis,
      experiment, or evidence record.
    - >-
      Not a criticism of prior work. chi = 1/m! is forced by the DEFINITION of
      the certificate, not by anyone's implementation.
    - >-
      Not independent corroboration of the Amdahl ceiling derived in
      IDEA-20260805-1f4a11 on the same date. One derivation reached twice; any
      synthesis must count it once.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: (a) SYMBOLIC -- the identity chi = P_dec C_succ /
      (P_dec C_succ + (1 - P_dec) C_fail), its value 1/m! at the operating point
      under equal work, and the unconditional bound P_dec <= C(B+m-1, m)/N;
      (b) TOY MEASUREMENT -- P_dec, C_fail/C_succ, the toy collection share, and
      the memory scaling with B on this goal's existing 16-24 bit ladder at
      m in {2, 3, 4}; (c) if reached, the existence, size and verification time of
      one Nullstellensatz witness at the smallest enumerable cell.
    explicitly_not_supportable_under_any_outcome: >-
      Any statement about the asymptotic collection share (the toy ladder cannot
      see the linear algebra and this is declared in advance); any exponent claim;
      any crypto-scale conclusion; any conclusion about whether index calculus
      beats rho; closure or narrowing of KN-OPEN-002; any claim that negative
      certificates are impossible, which no outcome of this contract can support.

  scale_relevance:
    tier: toy
    justification: >-
      The coverage IDENTITY is symbolic and scale-free, and its value at the
      operating point depends on the arity alone -- not on N, p, or the curve --
      which is why a toy measurement of its inputs is informative rather than an
      extrapolation. The MEASUREMENTS are toy and transfer nowhere: at 16-24 bits
      the factor base is small and the linear-algebra stage is negligible, so the
      measured collection share is GUARANTEED to be near 1 and says nothing about
      the asymptotic balance. THIS LIMIT IS STATED BEFORE MEASURING so the result
      cannot be read as reassurance.
    correspondence: null

  inputs:
    read_only_artifacts:
      - path: ledger/goals/GOAL-SDEG-001.yaml
        role: objective and completion_criteria under audit
      - path: ledger/goals/GOAL-ICEX-001.yaml
        role: the consuming goal's completion criterion
      - path: ledger/questions/RQ-SDEG-001.yaml
        role: "the constraint 'Matched rho/BSGS controls and certificates are mandatory'"
      - path: docs/claims-and-verification.md
        role: the certificate contract; read verbatim in stage S0
      - path: ledger/proposals/IDEA-20260805-1f4a11.yaml
        role: prior same-date derivation of the Amdahl ceiling; cited to disclaim priority
    symbolic_parameters:
      arities_symbolic: [3, 4, 5]
      operating_point: "B = (m! N)^{1/m}, equivalently B^m/m! = N"
      linear_algebra_model: "Theta(m B^2) field operations, Omega(m B) stored entries"
      linear_algebra_model_provenance: >-
        RECALLED-UNVERIFIED (Wiedemann / Lanczos). The exponent used is RECORDED,
        not assumed; if a committed source or measurement gives another, the
        balance point is restated rather than defended.
    measured_cells:
      field_bits: [16, 20, 24]
      arities_m: [2, 3, 4]
      factor_base: >-
        this goal's existing toy factor-base construction, unchanged; the
        construction rule and the x-coordinate list hash are recorded per cell
      control_arms: [pollard_rho_negation, bsgs, matched_random_factor_base_null]
      abort_settings: [disabled, mild, moderate, aggressive]
      planted_control_trials: 20
    seeds: [20260805, 20260806, 20260807]
    seed_derivation_rule: >-
      Per-cell seed = int(SHA256(ASCII of "EXP-SDEG-0be8e4/v1|" || arm_label ||
      "|" || decimal(field_bits) || "|" || decimal(m) || "|" ||
      decimal(replicate))) interpreted big-endian unsigned and reduced mod 2**64,
      with replicate in {0, 1, 2} mapping to the three declared seeds in order.
      arm_label ranges over {"treatment", "null-random-fb", "planted",
      "rho", "bsgs"}. The domain string and the reduction are frozen here so a
      third party reproduces every instance bit-for-bit.
    environment_declaration:
      measured_in_this_session: >-
        python3 3.11.15; `import numpy` SUCCEEDS at 2.4.6; `import sympy` FAILS;
        `import sage` FAILS. Recorded because two scouting sweeps of this session
        disagreed about numpy.
      dependency_policy: >-
        Stages S0 and S1 need nothing but paper. If S3 requires a
        computer-algebra backend that is absent, that is an INFRASTRUCTURE
        REQUEST reported as infrastructure signal, never as a mathematical result
        (AGENTS.md rule 5).

  stages:
    - id: S0
      name: read the contract
      cost: minutes, zero compute
      action: >-
        Read docs/claims-and-verification.md and the GOAL-ECDLP-001 certificate
        contract verbatim. Record what a decomposition certificate is required to
        contain, and whether ANY negative certificate is contemplated anywhere.
      terminating_condition: >-
        IF A NEGATIVE CERTIFICATE IS ALREADY SPECIFIED, OR IF COVERAGE IS ALREADY
        STATED, assertion A1 is void. CITE THE OWNING RECORD AND STOP. This is the
        cheapest possible way for the contract to end and it is placed first for
        that reason.
    - id: S1
      name: symbolic derivation
      cost: under an hour, zero compute
      action: >-
        Derive chi in general form and at the operating point for m = 3, 4, 5;
        derive the unconditional bound P_dec <= C(B+m-1,m)/N; derive
        T_IC = m! N B^{1-m} C_decomp + C_linalg, the balanced-B collection share
        s = 1/2 and the Amdahl ceiling 1/(1-s) = 2; derive the memory scaling
        Omega(B) for index calculus against O(1) for rho with negation and
        distinguished points.
      terminating_condition: >-
        THIS STAGE PRODUCES THE ENTIRE A1/A2 DELIVERABLE ON ITS OWN AND CAN END
        THE CONTRACT. If the symbolic re-derivation does not return chi = 1/m! at
        the operating point under equal work, the arithmetic is refuted at zero
        cost and the contract stops.
    - id: S2
      name: toy measurement of the two inputs
      cost: bounded, hours
      action: >-
        Measure P_dec on the real factor base and on the matched-random null at
        each cell; measure C_fail/C_succ at four abort settings; recompute chi at
        each measured ratio; measure the toy collection share and the memory
        scaling; run the coverage accounting on the rho and BSGS control arms.
      terminating_condition: >-
        NOT AUTHORIZED BY THIS CONTRACT. GOAL-SDEG-001's committed next_action is
        "Defer activation/executor ... no runs now" and nothing here overrides it.
        S2 requires a separate committed Coordinator ledger authorization.
    - id: S3
      name: one Nullstellensatz witness
      cost: bounded, hours, and only if S0-S2 pass
      action: >-
        At the smallest cell whose Macaulay matrix at the relevant degree is
        fully enumerable in memory, extract an explicit (g_i) with
        1 = sum_i g_i f_i for one FAILED attempt; verify it by multiplying out;
        report its size in field elements and its verification time against the
        solve time on the same cell.
      terminating_condition: >-
        NOT AUTHORIZED. Requires the same separate Coordinator authorization as
        S2, plus a passing S2. If unreached, report NOT REACHED -- a scope
        statement, never a negative.

  arms_and_controls:
    treatment: >-
      ARM-T. Decomposition attempts on this goal's real factor base at each
      (bits, m) cell, instrumented to record success, per-attempt charged cost,
      and whether a certificate was emitted and verified.
    measured_null: >-
      ARM-N (NULL OBJECT OF THE SAME SHAPE, FORCED VALUE DERIVED PRE-RUN, ABLE TO
      FAIL). The identical measurement against a MATCHED RANDOM SET of B group
      elements -- same size, same target distribution, same solver interface,
      same charging -- that is not a structured factor base. FORCED VALUE, FIXED
      BEFORE EXECUTION: P_dec_null = C(B + m - 1, m)/N, IDENTICAL to the
      treatment prediction, because the counting argument uses nothing about the
      factor base except its cardinality. THIS NULL CAN FAIL AND FAILING IS THE
      INTERESTING OUTCOME: if the real factor base yields measurably more
      relations per attempt than the matched random set, the spreading heuristic
      is wrong in a structured direction, which is a finding about index calculus
      rather than about certificates and must be reported as the more valuable
      result.
    positive_control: >-
      ARM-P (THE EFFECT MUST APPEAR). PLANTED DECOMPOSITION: construct R
      explicitly as a sum of m factor-base points, then hand it to the ordinary
      attempt path with no hint. THRESHOLD DECLARED BEFORE EXECUTION: 20/20
      successes and 20/20 certificate verifications at every (bits, m) cell. IF
      THE PLANTED CASE FAILS, THE INSTRUMENT IS BROKEN AND NO COVERAGE NUMBER AND
      NO NEGATIVE MAY BE REPORTED FROM ANY STAGE.
    graded_controls:
      - id: G-ABORT
        interior_points: 4
        variable: abort aggressiveness (disabled, mild, moderate, aggressive)
        quantity_reported: C_fail/C_succ and the resulting chi
        expected_shape: >-
          chi MONOTONE INCREASING as abort sharpens. Forced values at m = 4:
          0.0417 at ratio 1, 0.0800 at ratio 1/2, 0.3030 at ratio 1/10.
          Monotonicity IS reported. A non-monotone result localises an accounting
          error rather than leaving "the numbers moved".
      - id: G-ARITY
        interior_points: 3
        variable: m in {2, 3, 4} at fixed B
        quantity_reported: measured P_dec against C(B+m-1,m)/N
        expected_shape: >-
          P_dec RISING with m at FIXED B (more multisets), while chi at the
          RE-OPTIMISED B falls like 1/m!. Both regimes are reported separately.
          Conflating them -- "more arity is better" versus "coverage collapses" --
          is the specific misreading this control exists to prevent.
      - id: G-MEMORY
        interior_points: 3
        variable: factor-base size B at three values on one cell
        quantity_reported: count of stored objects on the IC arm and on the rho arm
        expected_shape: >-
          IC arm growing at least linearly in B; rho arm constant. IF THE IC ARM
          DOES NOT GROW WITH B, the implementation is not storing what the cost
          model assumes and the measurement is INVALID, not favourable.
    nearby_object_control: >-
      ARM-C (THE OBJECT WHERE THE HOPED-FOR CONCLUSION FAILS, AND THE SHARPEST
      TEST IN THIS CONTRACT). Apply the identical coverage accounting to the
      matched Pollard rho and BSGS control arms. Rho has the SAME asymmetry as
      index calculus -- a collision is trivially checkable, a non-collision is
      not -- so rho's coverage must also come out LOW. BSGS's "failure" is a table
      miss that IS certifiable by the sorted table, so BSGS must come out HIGH.
      FORCED ORDERING, NOT A VALUE: chi(BSGS) > chi(index calculus), and
      chi(rho) comparable to chi(index calculus). IF THE ACCOUNTING DOES NOT
      SEPARATE BSGS FROM RHO IT IS NOT MEASURING VERIFIABILITY, and no conclusion
      about index calculus may be drawn from it.
    ordering_control: >-
      MANDATORY AND FROZEN. The S1 symbolic derivation, including every forced
      chi value, is COMMITTED BEFORE any measurement in S2 is looked at. Within
      S2, the matched-random null arm is committed before the treatment arm is
      read. This prevents chi being back-fitted to whatever C_fail/C_succ turns
      out to be.
    comparability_policy: >-
      Every arm uses the same curve, the same target distribution, the same
      charging convention (group-operation equivalents via the matched rho
      calibration on the same host), the same certificate definition, and the
      same attempt budget. Coverage is reported in ALL THREE senses -- share of
      attempts, share of charged cost, share of relations -- and the relation
      share, which is trivially 1 by construction, is labelled trivial IN THE
      SAME TABLE so it cannot be quoted alone.

  independent_variables:
    - arity m
    - factor-base size B
    - abort aggressiveness
    - arm (treatment / matched-random null / planted / rho / BSGS)

  metrics:
    primary:
      - id: N1
        name: chi_symbolic
        definition: >-
          certificate-covered share of charged decomposition cost at m = 3, 4, 5
          at the operating point under the equal-work model
      - id: N2
        name: P_dec_measured
        definition: measured per-attempt success probability, treatment and matched-random null
      - id: N3
        name: cost_ratio
        definition: C_fail / C_succ at four abort settings
      - id: N4
        name: chi_measured
        definition: chi recomputed at each measured (P_dec, C_fail/C_succ)
      - id: N5
        name: memory_scaling
        definition: stored-object count versus B, IC arm and rho arm
    secondary:
      - id: N6
        name: collection_share_toy
        definition: >-
          measured C_collect/(C_collect + C_linalg) at toy scale, reported ONLY
          together with the statement that it is not the asymptotic share
      - id: N7
        name: amdahl_ceiling
        definition: 1/(1-s) at the balanced B, derived symbolically, = 2
      - id: N8
        name: control_arm_coverage
        definition: chi for Pollard rho and for BSGS under the identical accounting
      - id: N9
        name: witness_size_and_verification
        definition: >-
          size in field elements and verification time versus solve time for one
          Nullstellensatz witness. REPORTED AS NOT REACHED unless S3 is
          separately authorized and S2 passes.

  preregistered_prediction:
    quantity: >-
      chi per arity; the measured inputs P_dec and C_fail/C_succ; the coverage
      ordering across index calculus, rho and BSGS; and the memory scaling.
    formula: >-
      chi = P_dec C_succ / (P_dec C_succ + (1 - P_dec) C_fail);
      P_dec <= C(B + m - 1, m)/N unconditionally, with near equality under
      HEUR-CERTCOV-1; at B = (m! N)^{1/m} and C_fail = C_succ, chi = 1/m!.
      T_IC = m! N B^{1-m} C_decomp + Theta(m B^2); at the balanced B, s = 1/2 and
      the Amdahl ceiling is 2. Memory: Omega(B) for index calculus against O(1)
      for rho with negation and distinguished points.
    source: >-
      H-SDEG-3acfcf assertions A1-A3, predictions P1-P7, and heuristic
      assumptions HEUR-CERTCOV-1..4. Derived in IDEA-20260805-2afd22 before this
      contract was written. The Amdahl half is NOT original to this record; see
      IDEA-20260805-1f4a11 of the same date.
    forced_values:
      N1: {m3: 0.1666667, m4: 0.0416667, m5: 0.0083333}
      N2: "measured within a factor of 2 of C(B+m-1,m)/N on BOTH arms"
      N3: "1.00 with tolerance [0.8, 1.2] at abort disabled"
      N4_at_m4: {ratio_1: 0.0417, ratio_one_half: 0.0800, ratio_one_tenth: 0.3030}
      N5: "IC arm at least linear in B; rho arm constant across three B"
      N7: 2.0
      N8: "ordering chi(BSGS) > chi(IC), chi(rho) comparable to chi(IC)"
      ARM_P: "20/20 successes and 20/20 certificate verifications per cell"
      N9: "no size predicted; verification must cost at least 10x less than re-solving"

  replication:
    seeds: [20260805, 20260806, 20260807]
    independent_instances: 3
    note: >-
      Three replicates per (bits, m, arm) cell. S1 is symbolic and is instead
      replicated by an INDEPENDENT DERIVATION by a second agent who has not read
      the first; agreement of two independent derivations is the replication that
      matters for a symbolic claim, and re-running one derivation is not.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_runs: 12

  stopping_rules:
    - id: TR1
      rule: >-
        S0 finds a negative certificate or a coverage statement already
        specified -> STOP, cite the owning record, withdraw A1.
    - id: TR2
      rule: >-
        S1 does not return chi = 1/m! at the operating point under equal work ->
        STOP. The arithmetic is refuted at zero compute.
    - id: TR3
      rule: >-
        ARM-P (planted decomposition) does not reach 20/20 at any cell -> STOP.
        NO COVERAGE NUMBER AND NO NEGATIVE MAY BE REPORTED.
    - id: TR4
      rule: >-
        ARM-C does not separate BSGS from rho -> STOP reporting coverage
        conclusions about index calculus; the accounting is not measuring
        verifiability.
    - id: TR5
      rule: >-
        Measured C_fail/C_succ outside [0.8, 1.2] at abort disabled -> do NOT
        stop; RESTATE every chi against the measured ratio and report the
        deviation and its direction BEFORE any chi number.
    - id: TR6
      rule: >-
        S2/S3 not separately authorized -> report NOT REACHED and deliver the
        S0/S1 package alone, which is the complete A1/A2 result.
    - id: TR7
      rule: >-
        Budget exhaustion -> report which cells completed and which did not. An
        exhausted budget is reported as such, never as a result.

  invalidation_rules:
    - >-
      Reading any S2 measurement before the S1 derivation is committed
      invalidates N1 and N4.
    - >-
      Reading the treatment arm before the matched-random null arm is committed
      invalidates N2.
    - >-
      Reporting the relation-share coverage (trivially 1) without the
      attempt-share and cost-share coverage in the same table invalidates the
      coverage deliverable entirely.
    - >-
      Reporting the toy collection share without the explicit statement that it
      is not the asymptotic share invalidates N6.
    - >-
      Reporting a memory figure as a resident-set byte count rather than as a
      stored-object scaling invalidates N5.
    - >-
      Citing the Amdahl ceiling as independently corroborated by
      IDEA-20260805-1f4a11 invalidates N7.
    - >-
      Any modification of a read_only_artifact invalidates the run outright.

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory, or missing dependency at any stage is
    recorded as INFRASTRUCTURE SIGNAL with the exact command, exit status and
    resource state, and is NEVER negative mathematical evidence and never
    evidence about certificates, coverage, or any hypothesis (AGENTS.md rule 5).
    Specifically anticipated: S3 may require a computer-algebra backend that this
    container does not provide (sympy and sage both fail to import, MEASURED this
    session). An absent backend makes S3 an infrastructure request; it does NOT
    make A3 false, and no record may report it as evidence against A3.

  success_criterion: >-
    The run SUCCEEDS -- meaning it produces a usable, citable numerator
    specification, NOT that any particular conclusion is reached -- when:
    (1) S0 records verbatim what the certificate contract requires; (2) S1
    delivers chi, the unconditional bound, the balanced-B share and the memory
    scaling, independently derived twice; (3) if S2 runs, ARM-P reaches 20/20 at
    every cell and ARM-C separates BSGS from rho; and (4) coverage is reported in
    all three senses with the trivial one labelled trivial. A run meeting these
    is successful whether chi comes out at 1/m! or elsewhere, and whether A3
    survives or dies.

  falsification_criterion: >-
    H-SDEG-3acfcf's A1 is FALSIFIED if a symbolic re-derivation does not return
    chi = 1/m! at the operating point under the equal-work model, or if the
    certificate contract already specifies a negative certificate. Its A2 is
    falsified if the balanced-B collection share is not 1/2 under a corrected
    linear-algebra model, or if the memory scaling of the IC arm does not grow
    with B. Its A3 is falsified AT THE TESTED DEGREE if no witness exists at the
    smallest enumerable cell, or if verification costs more than a tenth of
    re-solving; that is a SCOPED negative naming its own residual (higher degree,
    or a separate certificate for the admissibility constraints) and MUST NOT be
    written as "negative certificates are impossible".

  required_artifacts:
    - verbatim quotation of the certificate contract's requirements, with file and line, or a record that it could not be located
    - the S1 derivation in full, twice, by two agents, with the point of any disagreement recorded
    - chi table at m = 3, 4, 5 in both general and operating-point form
    - measured P_dec per cell per arm against C(B+m-1,m)/N, with seeds and factor-base hashes
    - C_fail/C_succ at four abort settings, with the abort rule recorded per setting
    - chi recomputed at every measured ratio, with monotonicity in abort reported
    - toy collection share, printed adjacent to its own scope disclaimer
    - stored-object count versus B for the IC arm and the rho arm at three B
    - coverage of the rho and BSGS control arms, with the ordering stated
    - planted-control results: successes and verifications out of 20 per cell
    - witness size, verification time and solve time, or an explicit NOT REACHED
    - environment record: python version and import status of numpy, sympy, sage
    - exact command lines, git commit and dirty-tree state for every stage
    - stdout and stderr for every stage

  reviewer_notes:
    - >-
      The single most likely misreading of a completed run is that it criticises
      prior work. It does not. chi = 1/m! is forced by the DEFINITION of the
      certificate the contract chose, and would hold for any implementation of
      it. The deliverable is a specification for the ICEX numerator, not a
      finding against anyone.
    - >-
      The second most likely misreading is that the toy collection share says
      something about the asymptotic balance. It cannot: at 16-24 bits the linear
      algebra is negligible by construction. The contract requires the disclaimer
      to be printed adjacent to the number for exactly this reason.
    - >-
      ARM-C (rho and BSGS under the same accounting) is the nearby-object control
      and is the part of this contract most likely to be dropped for budget. IT
      MUST NOT BE. Without it there is no demonstration that the accounting
      measures verifiability rather than an artefact of Groebner solvers, and no
      negative may be reported.
    - >-
      Gaudry and Diem on elliptic index calculus, Wiedemann and Lanczos on sparse
      linear algebra, and effective Nullstellensatz degree bounds are ALL NOT
      READ. The Theta(m B^2) linear-algebra model is RECALLED-UNVERIFIED and is
      recorded as used, not assumed correct; the conclusions need only that the
      term be non-negligible at the balanced B, and the memory conclusion needs
      only that the factor base be stored.
    - >-
      HEUR-CERTCOV-4 (that a degree-D witness exists whenever the solver reports
      no admissible solution) is the weakest link in the paired hypothesis and it
      is tested FIRST within S3, before any effort is spent on witness size.
