experiment:
  id: EXP-ECTD-07b200
  hypothesis_id: H-ECTD-2c0a3d
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  source_idea: IDEA-20261005-1b41d9
  version: 1
  designed_at: '2026-10-10'
  title: Rational group invariant factors across the first eligible ordinary 2-isogeny
  status: approved
  approved_by: DEC-20261010-db0e4b
  frozen: true
  execution_authorized: true
  claim_tier: toy
  objective: >-
    Find the first ordinary, same-trace, different-j rational 2-isogeny
    edge over an odd prime at most 64 whose common group order is not
    square-free, then compare the exact invariant-factor pairs of the
    two rational-point groups. This is a finite endpoint-structure test,
    not a private-path, weakness, or DLP-cost measurement.
  inputs:
    source_family: y^2 = x^3 + a*x + b over F_p
    prime_interval: odd primes 3 through 64 inclusive
    coefficient_representatives: a,b in {0,...,p-1}
    kernel_representatives: r in {0,...,p-1} with r^3+a*r+b=0 mod p
    selection_order: >-
      Lexicographic over (p,a,b,r), p ascending through the stated odd
      primes and a,b,r ascending as integer representatives. Test every
      root r of each source, not just its smallest root. Stop at the
      first quadruple passing every eligibility gate. This resolves the
      proposal's first-root ambiguity before measurement.
    eligibility: >-
      E is nonsingular and ordinary; T=(r,0) has exact order 2;
      the rational separable degree-2 quotient E2 is nonsingular,
      ordinary, defined over F_p, and has the same trace and a
      different j from E; the shared order N has a prime square
      divisor. A failed map/control is an invalid run, never a reason
      to skip a candidate and continue to a later quadruple.
    ordinary_test: >-
      Count E(F_p) exactly, set t=p+1-#E(F_p), and require t mod p
      nonzero; repeat independently on E2. Apply this test at p=3
      as well as at larger primes, retaining every p=3 rejection.
    degree_two_quotient: >-
      For T=(r,0), put X=x-r, A=3r, B=3r^2+a mod p. The translated
      source is y^2=X^3+A*X^2+B*X. For X nonzero use
      u=X+A+B/X, v=y*(1-B/X^2); its codomain is
      v^2=u^3-2A*u^2+(A^2-4B)*u, with O and T mapped to O.
      Require B nonzero and exhibit the map and kernel. For p at
      least 5, convert the codomain to short-Weierstrass form by an
      exact x translation before recording its canonical coefficients;
      at p=3, A=0 and the codomain is already short. Record the
      unnormalized quotient and normalized codomain so the map is
      reconstructible.
    scaling_control: >-
      On the selected source, u=2 gives a coefficient-scaled model
      y^2=x^3+16a*x+64b modulo p via (x,y)->(4x,8y).
      Its invariant-factor pair must equal the selected source pair.
    no_eligible_edge: >-
      After exhausting all frozen quadruples, report a valid
      no-instance negative with the complete rejection trace.
    driver: experiments/EXP-ECTD-07b200/implementation/run.py
    checker: experiments/EXP-ECTD-07b200/implementation/check.py
    trial_plan: experiments/EXP-ECTD-07b200/trial-plan.json
  controls:
    - id: exact-selection
      statement: >-
        Check each p is prime, include p=3, scan a,b,r in the frozen
        lexicographic order, retain a reason for each rejected candidate,
        and never use later candidates after the first accepted one.
    - id: discriminant-and-ordinarity
      statement: >-
        Verify both source and codomain discriminants are nonzero and
        both traces have nonzero residue modulo p. Confirm the point
        counts satisfy the Hasse interval and that p=3 is processed
        under the same rules.
    - id: kernel-and-map
      statement: >-
        Verify T is on E, 2T=O, B is nonzero, the quotient map lands
        on E2 for every rational source point outside {O,T}, and
        O,T are exactly its rational kernel. Verify map degree 2 and
        image size N/2; the image has index 2 in E2(F_p), so the
        rational-point map is not called surjective.
    - id: trace-j-and-order
      statement: >-
        Count E and E2 independently, include O, compute t=p+1-N
        on each, and compute j from each model's own coefficients.
        Same trace, same order, and different j are eligibility gates.
    - id: non-square-free
      statement: >-
        Factor N by exact trial division and exhibit q prime with
        q^2 dividing N. A square-free order is skipped before
        scoring invariant factors.
    - id: group-structure-certificate
      statement: >-
        Enumerate every rational point and its exact additive order
        on each group. Let n1 be the lcm of all source point orders
        and m1 the analogous codomain exponent; set n2=N/n1 and
        m2=N/m1. Check n2 divides n1 and p-1, m2 divides m1 and
        p-1, and both pairs multiply to N. A separate checker
        recomputes the pairs independently from the archived curves.
    - id: scaling-null
      statement: >-
        Verify (x,y)->(4x,8y) is a bijective equation-preserving
        coordinate map on all selected-source points. Independently
        enumerate the scaled group's invariant factors and require
        the pair to equal the source pair.
  independent_variables:
    - selected source versus degree-2 codomain versus scaled-source null
  metrics:
    primary:
      - id: invariant_factor_pairs
        statement: Ordered pairs (n1,n2) and (m1,m2), with second factor dividing first.
      - id: difference_coordinates
        statement: Integer count in {0,1,2} of coordinates where the pairs differ.
    secondary:
      - id: selected_edge
        statement: p,a,b,r, source and codomain coefficients, quotient map, j values, and traces.
      - id: common_order_and_square_witness
        statement: N, independent source/codomain counts, prime q with q^2 dividing N.
      - id: scaling_pair
        statement: Scaled-source coefficients, point bijection check, and invariant-factor pair.
      - id: selection_rejections
        statement: Complete ordered candidate trace, including p=3 handling and no-instance exhaustion.
      - id: resource_record
        statement: Python/dependency versions, source identity, wall time, CPU time, and peak memory.
  heuristic_under_test: HEUR-1
  preregistered_prediction:
    quantity: number of unequal invariant-factor coordinates
    formula: >-
      Positive when the first accepted edge has at least one unequal
      coordinate. Negative when its pairs agree, or when the frozen
      scan has no accepted edge. A failed selection, quotient, group,
      or scaling control is invalid, not a numerical negative.
    source: IDEA-20261005-1b41d9
  scale_relevance:
    tier: toy
    justification: >-
      One selected edge with p at most 64. No inference about an
      isogeny-class distribution, hidden paths, DLP advantage,
      or cryptographic-size exponent follows.
    correspondence: Direct complete finite-field enumeration within the frozen scan.
  tail_checks:
    - Retain the rejection trace proving first acceptance or full no-instance exhaustion.
    - Preserve every source and codomain point-order list, not just the final lcm.
    - Report exact N factorization and the scaled-source pair as a null.
  replication:
    seeds: []
    independent_instances: 1
    future_run_slot: RUN-ECTD-e5714e
    note: >-
      The scan and group enumerations are deterministic. The checker
      rebuilds the selected edge and all three group structures from
      the archived raw parameters by a separate implementation path.
  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      Bounds protect the machine. A watchdog, memory stop, or
      implementation failure is infrastructure, not evidence about
      invariant-factor agreement.
  stopping_rules:
    - Stop at the first quadruple passing every frozen eligibility gate.
    - Finish the two group-structure enumerations and scaling null before scoring.
    - If no edge passes, exhaust every candidate through the last p at most 64.
    - Do not expand the prime range or change the selected root after seeing the pair.
  invalidation_rules:
    - Any missed earlier eligible quadruple, p=3 omission, wrong kernel or map, count or j mismatch, ordinary misclassification, or failed scaling null voids the scored comparison.
    - A square-free N is a rejected candidate, never a group-pair agreement.
    - A timeout, crash, incomplete rejection trace, or missing artifact is infrastructure.
  success_criterion: >-
    The first selected edge and every control are valid, N has a prime
    square divisor, and (n1,n2) differs from (m1,m2) in at least one
    coordinate.
  falsification_criterion: >-
    The complete valid scan finds no eligible edge, or the first
    selected edge passes every control and (n1,n2)=(m1,m2).
  decision_impact:
    on_positive: >-
      After independent evidence review, record one explicit
      same-trace rational 2-isogeny on which rational group
      isomorphism type differs. This licenses only a bounded
      endpoint-structure finding, not a trapdoor or ECDLP gain.
    on_negative: >-
      After independent evidence review, record that the frozen
      first-edge test did not witness differing group type, or that
      the finite search found no eligible edge. Keep other edges
      and larger primes unresolved.
  required_artifacts:
    - experiments/EXP-ECTD-07b200/runs/RUN-ECTD-e5714e/manifest.yaml
    - experiments/EXP-ECTD-07b200/runs/RUN-ECTD-e5714e/raw-result.json
  run_report: >-
    After sealing run records, write the observation report, graph
    with source, and inspected PDF under a fresh
    experiments/EXP-ECTD-07b200/reports/run-<UTC timestamp>/ directory
    using research-visuals.
  assigned_to: executor
