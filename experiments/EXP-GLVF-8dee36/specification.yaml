experiment:
  id: EXP-GLVF-8dee36
  hypothesis_id: null
  hypothesis_id_note: >-
    Focused solver experiment derived from the existing equivariant-index-calculus
    lane. It asks whether the order-3 GLV grading reduces measured F4 work on a
    correctly orbit-lifted j=0 decomposition system.
  question_id: RQ-EQJ-001
  related_question_ids:
    - RQ-DREG-001
    - RQ-EQIC-8cb959
    - RQ-ICPERF-94c86e
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    GLV-graded F4: character-block Macaulay elimination for the order-3
    orbit-lifted Semaev point-decomposition system

  objective: >-
    Test whether the C3 character grading induced by the j=0 GLV action reduces
    actual Macaulay/F4 matrix work, peak memory, or solving degree relative to
    vanilla F4 on the same algebraic solution set. The experiment must not infer
    a solver gain from smaller symbolic support alone; EXP-JINV-dd60d3 already
    measured that j=0 support shrinkage did not improve Groebner time when
    factor-base constraints dominated.

  mathematical_setup:
    curve_family: >-
      j=0 curves E: y^2=x^3+b over F_p with p=1 mod 3 and a complete
      GLV-closed x-coordinate factor base.
    action: >-
      Simultaneous C3 action x_i -> beta*x_i and t -> beta*t, where t is the
      target x-coordinate variable and beta^3=1.
    orbit_lift: >-
      For a submitted target R with x-coordinate r, solve the union of the three
      target-orbit instances by introducing t and the exact orbit constraint
      t^3=r^3. A solution with t=beta^j*r is mapped back by phi^{-j} so every
      accepted solution is a decomposition of the original R.
    factor_base_invariance: >-
      The factor-base membership polynomial must be constructed from complete
      beta-orbits. Its invariance under x -> beta*x is verified symbolically
      before timing.
    grading: >-
      Assign GLV character weight 1 mod 3 to each x_i and to t. Macaulay
      monomials are partitioned by total weight mod 3. Blockwise elimination is
      permitted only after the implementation verifies that every generated row
      respects the declared grading.

  arms:
    - id: ARM_VANILLA_ORBIT
      description: >-
        Solve the exact orbit-lifted polynomial system with the current vanilla
        F4/Macaulay backend and ordinary monomial ordering.
    - id: ARM_GRADED
      description: >-
        Solve the identical orbit-lifted system with rows and columns partitioned
        by C3 character, eliminating within certified compatible blocks and
        performing the required cross-block reconstruction exactly.
    - id: ARM_FIXED_TARGET
      description: >-
        Existing fixed-target Semaev system specialized at t=r. This records the
        cost of the incumbent problem rather than assuming orbit lifting is free.
    - id: NULL_WRONG_GRADE
      description: >-
        Apply a frozen incorrect weight assignment that preserves block sizes but
        is not respected by the equations. The grading verifier must reject it
        before elimination.
    - id: CTRL_GENERIC_J
      description: >-
        Size-matched generic-j curve/factor-base system lacking the order-3 GLV
        action. No GLV speedup may be inferred from a generic sparse-matrix effect.

  inputs:
    procedure: >-
      Stage 0 derives the exact covariance of every equation and archives the
      grading certificate. Stage 1 reproduces the current vanilla F4 result on a
      fixed-target fixture. Stage 2 constructs the orbit-lifted system, verifies
      its solution set against exhaustive toy truth, and verifies map-back to the
      original target. Stage 3 emits the same Macaulay rows to ARM_VANILLA_ORBIT
      and ARM_GRADED. Stage 4 compares solving degree, row/column counts, nonzero
      counts, field operations, wall time, and peak RSS at every degree. Stage 5
      independently verifies every returned decomposition on the curve.
    parameter_grid:
      bit_sizes: [10, 12, 14, 16]
      arities: [2, 3, 4]
      seeds: [20260918, 20260919, 20260920]
      factor_base_rule: complete GLV x-orbits only
      solver_backends: >-
        Use the strongest F4-capable backend already admitted by the ICPERF
        harness. If more than one backend is available, backend is a stratifier,
        never pooled.

  controls:
    - >-
      Solution-set equality gate: at exhaustive toy sizes, ARM_FIXED_TARGET
      solutions must equal the map-back of ARM_VANILLA_ORBIT solutions.
    - >-
      Matrix identity gate: ARM_VANILLA_ORBIT and ARM_GRADED must be generated
      from the exact same polynomial list, term order, coefficient field, and
      degree schedule.
    - >-
      Grading certificate: each row records its input character and all nonzero
      monomials it may touch. A row that violates the declared grading stops the
      run before timing.
    - >-
      NULL_WRONG_GRADE must be rejected. Acceptance means the block partition is
      not being checked and all timing results are void.
    - >-
      CTRL_GENERIC_J prevents attributing generic sparse reordering gains to GLV.
    - >-
      Factor-base membership equations are included in every arm and their cost
      is reported separately because prior j=0 measurements found them dominant.

  metrics:
    primary:
      - solving_degree
      - degree_of_regularity_proxy_used_by_backend
      - macaulay_rows_by_degree
      - macaulay_columns_by_degree
      - macaulay_nnz_by_degree
      - character_block_dimensions_by_degree
      - peak_macaulay_rows
      - peak_macaulay_columns
      - peak_macaulay_nnz
      - field_multiply_count_if_available
      - row_reduction_count_if_available
      - f4_seconds
      - peak_rss_bytes
      - verified_relations
      - f4_seconds_per_verified_relation
    secondary:
      - factor_base_constraint_seconds
      - semaev_constraint_seconds
      - orbit_lift_overhead_seconds
      - reconstruction_seconds
      - basis_size
      - zero_reduction_count
      - block_fill_ratio
      - cross_block_coupling_count
      - charged_ratio_ARM_GRADED_over_ARM_VANILLA_ORBIT
      - charged_ratio_ARM_GRADED_over_ARM_FIXED_TARGET

  benchmark_contract:
    incumbent_solver: ARM_FIXED_TARGET
    structural_control: ARM_VANILLA_ORBIT
    icperf_reference: RQ-ICPERF-94c86e
    previous_j0_measurement: EXP-JINV-dd60d3
    decision_metric: >-
      F4 seconds and peak memory per verified relation on identical systems.
      Solving degree and matrix dimensions are explanatory metrics, not sufficient
      success criteria.
    success_threshold: >-
      ARM_GRADED must reduce paired median F4 wall time or peak RSS by at least
      20% versus ARM_VANILLA_ORBIT with identical verified solution sets. To count
      as an end-to-end PDP improvement, it must also beat ARM_FIXED_TARGET after
      orbit-lift and reconstruction overhead are charged.

  preregistered_predictions:
    - >-
      If the C3 grading is operationally useful, ARM_GRADED reduces peak Macaulay
      nnz and row-reduction work while preserving solving degree.
    - >-
      If factor-base constraints destroy or dominate the usable block structure,
      block dimensions may shrink but charged F4 time will not improve.
    - >-
      No constant-order C3 effect is interpreted as an asymptotic exponent change
      without separate scaling evidence.

  scale_relevance:
    tier: toy
    correspondence: >-
      The order-3 action is the same GLV algebra used by secp256k1, but the
      experiment measures solver structure only at tractable toy sizes. No
      crypto-scale solve or security conclusion follows.

  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20

  stopping_rules:
    - Stop before timing if exhaustive solution-set equality fails.
    - Stop before timing if the grading verifier accepts NULL_WRONG_GRADE.
    - Stop a cell on coefficient-field or term-order mismatch between solver arms.
    - Keep partial degree-by-degree matrix metrics on timeout or memory exhaustion.
    - Do not change monomial order or backend settings after viewing treatment timing.

  invalidation_rules:
    - Any returned decomposition failing independent curve verification invalidates the run.
    - Any arm solving a different ideal, field, or term order is not comparable.
    - Any omitted factor-base constraint cost invalidates the end-to-end comparison.
    - Any reported speedup based only on symbolic support or matrix dimension is invalid.
    - Timeout, crash, or memory exhaustion is failed infrastructure, never negative evidence.

  success_criterion: >-
    Produce exact solution-set equivalence, degree-by-degree Macaulay measurements,
    verified relations, and charged timing/memory comparisons for vanilla versus
    GLV-graded elimination. Scientific success is a valid measurement even if the
    grading loses.

  falsification_criterion:
    - >-
      ARM_GRADED has the same solving degree and no material wall-time or memory
      reduction once factor-base constraints are included.
    - >-
      Orbit lifting adds enough degree or variable overhead that ARM_GRADED loses
      to the fixed-target incumbent.
    - >-
      The observed block structure also appears on CTRL_GENERIC_J with similar
      gains, so the effect is generic reordering rather than GLV-specific.

  required_artifacts:
    - specification.yaml
    - manifest.yaml
    - command.txt
    - environment.json
    - raw-result.json
    - polynomial-system.json
    - grading-certificate.json
    - macaulay-degree-metrics.jsonl
    - block-dimensions.jsonl
    - solution-bijection.json
    - verification-report.json

  source_refs:
    - RQ-EQJ-001
    - KN-LIT-031
    - EXP-JINV-dd60d3
    - EXP-EQLA-164b34
    - RQ-ICPERF-94c86e
    - coordination/intake/cm-factor-base-20260905/source-context.md
    - research/ideas/glv_index_calculus_experiment_matrix.md

  assigned_to: executor
  approved_by: null
