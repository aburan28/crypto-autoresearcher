# AMD-20260929-5a84eb -- pre-data protocol amendment of EXP-ICEX-aaccfc,
# protocol version 3 -> 4. Additive. Approved by DEC-20260929-986b4c.
# Responds to the implementation audit TASK-20260929-e3446a
# (validation_report.yaml, PASS_WITH_FINDINGS, F-1..F-6 must-fix, advisories).
# Execution stays NOT admitted.
protocol_amendment:
  amendment_id: AMD-20260929-5a84eb
  experiment_id: EXP-ICEX-aaccfc
  hypothesis_id: H-ICEX-d8e858
  version_from: 3
  version_to: 4
  authored_by: coordinator
  authored_at: '2026-09-29'
  approved_by: coordinator
  approval_decision: DEC-20260929-986b4c
  batch_id: BATCH-227e0d
  precedence: >-
    Protocol version 4 = specification.yaml + AMD-20260926-ced670 +
    AMD-20260929-143d11 + this file; this file governs where they differ.
  correction_of_v3_pre_data_status:
    finding: F-5
    corrects: >-
      AMD-20260929-143d11 pre_data_status ("The coordinator has seen no data
      bearing on the C-5 verdict").
    correct_statement: >-
      The committed smoke outputs (snapshot TASK-20260929-d04f29) evaluate
      frozen fixture b16-s21 at its frozen m and B in the smoke seed
      namespace, and record complete_units and stage-1 units for its primary
      cell. Stage-1 cost per attempt is nearly deterministic, so this is an
      effective preview of one of the six exponent inputs. No frozen-label
      draw was evaluated.
    coordinator_attestation: >-
      Before writing v3 the coordinator read the executor's summary, which
      stated the smoke primary cell's attempt counts on b16-s21 (6,909
      stage-1 attempts, 1,042 descent attempts). The attempt count
      approximately determines stage-1 units, so the v3 statement was
      inaccurate. The coordinator has not read any complete_units, stage
      units, ratio or exponent value; none appears in the coordinator
      session record. The v3 rulings accepted the implemented literal
      readings, and FX-A is non-verdict, so no ruling could have been tuned
      toward an outcome.
    binding: >-
      The smoke outputs are excluded from every analysis, evidence record
      and verdict. The b16-s21 fixture is NOT replaced (replacing a frozen
      fixture after a preview would itself be outcome-informed). Instead the
      evidence record reports, descriptively and outside the verdict, the
      C-5 exponent fit with b16-s21 left out, beside the primary fit.
      Existing artifacts stay immutable. Future smoke runs use a non-frozen
      fixture or omit cost fields (FX-5).
  rulings:
    - item: OQ-15 (FX-A and descents)
      ruling: >-
        As recorded in the TASK-20260929-d04f29 receipt: the named
        complete_units_rj_incremental covers stage-1 attempts; the
        with-descents figure is supplementary; both non-verdict.
    - item: advisory A-3 (rho target k = 0)
      ruling: >-
        No protocol change. A crash from a zero target is an infrastructure
        failure of that cell, never evidence; the driver records it as
        failed_infrastructure (covered by FX-3).
    - item: advisory A-2 (factor-base membership not re-derived by audit)
      ruling: No code change required; the run's independent review includes a blind membership re-derivation.
  required_fixes_before_admission:
    - id: FX-1
      finding: F-1
      what: >-
        check_decision refuses a decision whose status is superseded or
        withdrawn, that carries a non-null superseded_by, that is superseded
        by a later committed decision, whose decision field is not an
        admission/approve decision, or whose file is uncommitted or dirty;
        tests for each case.
    - id: FX-2
      finding: F-2
      what: >-
        Canonical run manifest with top-level run: block (id, experiment_id,
        status, code, environment, inputs, timing, resources, result),
        mirroring experiments/EXP-SDEG-85eefd/runs/RUN-SDEG-3de103/manifest_v2.yaml;
        companion files command.txt, environment.json, stdout.log,
        stderr.log, raw-result.json; protocol_version 4 and the sha256 of
        every governing amendment and approving decision recorded.
    - id: FX-3
      finding: F-3, A-3
      what: >-
        run() is wrapped so a ProcedureDefect records status invalid and any
        other exception or SIGTERM/SIGHUP/SIGINT records
        failed_infrastructure; the manifest is written with status running
        before the first cell and updated per cell; raw-result.json is always
        written; FX-A is computed after metrics.json is written and cannot
        affect it.
    - id: FX-4
      finding: F-4
      what: cellrun.py refuses the frozen namespace unless launched by the admitted driver (re-checking the decision and the running manifest).
    - id: FX-5
      finding: F-5
      what: smoke.py refuses frozen fixtures at frozen (m, B), or omits cost fields from smoke output.
    - id: FX-6
      finding: F-6
      what: >-
        The driver takes --snapshot-receipt PATH (required for a scientific
        run) and refuses on any implementation-file hash mismatch, any
        unpinned .py / test / trial-plan file, or a dirty implementation
        tree (the receipt itself excluded).
    - id: FX-7
      finding: A-1, A-4
      what: >-
        The inference block reads the variables the adapter exports
        (AUTORESEARCH_POLICY, AUTORESEARCH_BACKEND,
        AUTORESEARCH_FALLBACK_ALLOWED, AUTORESEARCH_DEGRADED_ALLOWED,
        AUTORESEARCH_INDEPENDENT_SESSION) and records model_verified false
        when no verified model id is available; implementation.md describes
        the actual FX-A ordering.
    - id: FX-8
      finding: F-5
      what: >-
        analysis.py reports, descriptively and labelled non-verdict, the C-5
        exponent fit and bootstrap CI recomputed with fixture b16-s21
        omitted, beside the primary fit; the C-5 verdict is computed only
        from the primary fit (test that it is unchanged).
  affected_runs: []
  confirmatory_status: Confirmatory; frozen before any scientific data.
