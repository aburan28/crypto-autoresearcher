  rulings:
    - item: OQ-1, OQ-2, OQ-4..OQ-12, OQ-14
      ruling: >-
        Accept the literal readings implemented, exactly as recorded in
        implementation.md "Open questions". No threshold, statistic or
        outcome mapping changes. OQ-9: the admitted host is the Mac; any
