    - item: OQ-3 (rank |F| - 1)
      ruling: >-
        Accept the implemented reading: columns = L x-classes + G + Q, target
        rank ncols - 1 = L + 1 plus 10 excess rows, kernel fixed by log G = 1.
        The literal target 2L - 1 exceeds the column count for L > 3 because
        log(-P) = -log P, so it is unreachable; this reading is the unique
        one that makes stage 1 terminate with a determined log system.
    - item: OQ-13 (R_j by fresh double-and-add)
      ruling: >-
        Accept the literal reading (fresh double-and-add, charged) for the
        primary complete cost and for the C-5 verdict; unchanged.
      pre_registered_disclosure: >-
        The literal reading charges roughly 1.5 log2 q group operations per
        attempt for R_j, where a standard incremental walk charges about 1.
        This biases the complete index-calculus cost upward, i.e. against
        the hypothesis that index calculus is competitive. Stated before
        data so that a ratio > 1 is not read as stronger than it is.
      required_secondary_report: >-
        FX-A below: report, descriptively and outside the verdict, the
        complete cost with each attempt's R_j charged as 1 group operation.
  required_fixes_before_admission:
    - id: FX-A
      what: >-
        analysis.py reports per fixture a descriptive figure
        complete_units_rj_incremental = complete_units - 13 * sum_j
        (rj_ops_j - 1), where rj_ops_j is the charged group-operation count
        of the double-and-add for R_j = a_j G + b_j Q, recomputed
        deterministically from the attempt labels (the run's own a_j, b_j)
        and cross-checked against the logged pt_ops (rj_ops_j <= pt_ops_j).
        Its ratio to 13 * 0.886 * sqrt(q) is reported beside the primary
        ratio, labelled non-verdict. The C-5 rule is unchanged.
      verified_by: independent audit before admission
