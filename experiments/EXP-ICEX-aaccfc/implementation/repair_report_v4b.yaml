  - id: G-1
    status: implemented
    files_changed:
    - driver.py
    - cellrun.py
    - tests/test_process.py
    - tests/test_guard.py
    implementation: 'driver.run_cell_process launches cellrun with subprocess.Popen(start_new_session=True) (own session and
      process group), writes cells/<cell>/process.json (pid, pgid, driver_pid), passes ICEX_AACCFC_DRIVER_PID=<driver pid>,
      and tracks reaping explicitly: os.wait4(pid, WNOHANG) is polled and only a returned pid equal to the child''s sets reaped
      (a live child returns 0). In finally, if not reaped (exception, or SIGTERM/SIGHUP/SIGINT raised as RunInterrupted),
      the group is SIGKILLed and the child reaped with a blocking waitpid (retried if a second signal interrupts); stray group
      members are SIGKILLed after every cell. cellrun: if ICEX_AACCFC_DRIVER_PID is set and is not os.getppid() it exits 9
      without writing; otherwise a daemon thread polls getppid every 0.2 s and calls os._exit(9) once re-parented; the result
      goes to result.json.tmp and is renamed into place only after a final parent check (orphan: tmp removed, os._exit(9)).'
    tested_by:
    - tests/test_process.py::test_real_child_completes_and_is_reaped
    - tests/test_process.py::test_sigterm_to_driver_kills_and_reaps_child
    - tests/test_process.py::test_exception_in_driver_kills_and_reaps_child
    - tests/test_process.py::test_driver_sigkill_orphan_exits_without_writing
    - tests/test_guard.py::test_watch_parent_exits_on_reparent
    - tests/test_guard.py::test_cellrun_with_wrong_driver_pid_exits_without_writing
    test_design: test_process.py runs a stand-in driver process that calls driver.run_cell_process on a REAL cellrun.py child
      (smoke namespace, synthetic non-frozen fixture b13-s900, a rho cell long enough to still be running); the driver is
      then ended by SIGTERM (exit 8, child gone within 5 s), by an injected exception (exit 1, child gone within 5 s), or
      by SIGKILLing itself (orphan gone within 3 s); no result.json in any case. The fixture SIGKILLs both process groups
      and reaps the stand-in on teardown; no stray process remained after the suite.
  - id: G-2
    status: implemented
    files_changed:
    - driver.py
    - cellrun.py
    - tests/test_guard.py
    - tests/test_driver.py
    implementation: 'driver.execute draws token = secrets.token_hex(32) per run, records inputs.run_token_sha256 = sha256(token)
      and inputs.driver_pid = os.getpid() in the stub and full manifest, and passes the token only in the cells'' environment
      (ICEX_AACCFC_RUN_TOKEN; an inherited value is stripped; the token is never written). driver.main refuses a scientific
      run whose --runs-dir is not experiments/EXP-ICEX-aaccfc/runs (exit 11). cellrun.admission_guard (frozen namespace) requires:
      all five environment values; run directory == RUNS_ROOT/RUN-*; check_decision passes; manifest is the full record (stub
      refused), status running, id == directory name, matching decision and namespace, code.commit == repository HEAD; run_token_sha256
      == sha256(env token); driver_pid == env driver pid == os.getppid(), and that parent''s command line runs this implementation
      directory''s driver.py (psutil; ps fallback).'
    tested_by:
    - tests/test_guard.py::test_frozen_guard_binds_to_real_driver
    - tests/test_guard.py::test_parent_is_driver_real_processes
    - tests/test_guard.py::test_default_runs_root_is_the_experiment_runs_dir
    - tests/test_guard.py::test_env_names_agree
    - tests/test_driver.py::test_manifest_binds_driver_pid_and_run_token
    - tests/test_driver.py::test_main_refuses_runs_dir_other_than_experiment_runs
    hand_written_manifest: 'refused on each of: stub flag, status, id, decision, namespace, wrong or missing token hash, wrong
      or missing driver pid, commit != HEAD, parent not a live driver.py, run dir outside runs/ or not RUN-*, missing token
      or driver pid in the environment, different token in the environment'
