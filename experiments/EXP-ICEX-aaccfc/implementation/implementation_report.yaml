  open_questions:
  - id: OQ-1
    topic: C-3 affine point addition unit
    proposed_literal_reading: every group op with two finite operands (add, double, P+(-P)=O) = 13 units flat; internal field
      ops not re-charged; field-level figure reported secondarily
  - id: OQ-2
    topic: LA inversion over Z/q unpriced
    proposed_literal_reading: 10 units, by analogy with F_p inversion
  - id: OQ-3
    topic: rank |F|-1 unattainable (|F|=2L, log(-P)=-log P)
    proposed_literal_reading: columns = L x-classes + G + Q; rank ncols-1 = L+1, +10 excess rows; kernel fixed by log G =
      1; every relation contains Q
  - id: OQ-4
    topic: B0 at m=6,8
    proposed_literal_reading: same forward 2-sum table, backward (m-2)-sum by the same prefix-shared recursion
  - id: OQ-5
    topic: stage-2 test cost and alpha2 fit
    proposed_literal_reading: 1 unit per x(S-P1)<B test; O not a hit; mean over 256 points; OLS over 6 primary fixtures
  - id: OQ-6
    topic: rho accounting
    proposed_literal_reading: 1 probe per collision-store step; total includes precompute; walk-only reported
  - id: OQ-7
    topic: '''stage-cost-only'' m=6,8'
    proposed_literal_reading: stage 1 (same rank rule, paired attempts) + stage 2 at B_m + stage-3 LA; no descents; not a
      verdict input
  - id: OQ-8
    topic: C-5 bootstrap and dominant stage
    proposed_literal_reading: fixture resampling with replacement, degenerate redraw, percentile CI; dominant stage pooled
      over 20-bit fixtures; ratio uses frozen 13*0.886*sqrt(q)
  - id: OQ-9
    topic: host scope of C-7
    proposed_literal_reading: macOS only; a pod needs an amendment
  - id: OQ-10
    topic: labels
    proposed_literal_reading: a_j/b_j = hi/lo 128 bits of one hash; descent_r, rho, rho_walk, scramble, lanczos, audit, bootstrap
      are implementation labels
  - id: OQ-11
    topic: B0 full scan
    proposed_literal_reading: no early abort (frozen B0); first hit in scan order is the relation; units-to-first-hit recorded
  - id: OQ-12
    topic: null design
    proposed_literal_reading: paired attempt stream; stage 1 + LA, no descents; construction charges all draws
  - id: OQ-13
    topic: R_j by fresh double-and-add
    proposed_literal_reading: literal C-4; incremental walk would be a protocol change
    resolution: 'AMD-20260929-143d11: literal reading accepted; FX-A non-verdict incremental figure added'
  - id: OQ-14
    topic: memory guard and machine caps
    proposed_literal_reading: in-process ru_maxrss 8 GB guard; 5M attempts/cell and 1M/descent caps are infrastructure stops,
      never evidence
  - id: OQ-15
    topic: FX-A coverage of descent attempts (they build Q_t + r G, not a_j G + b_j Q)
    proposed_literal_reading: named complete_units_rj_incremental covers stage-1 attempts only; complete_units_rj_incremental_with_descents
      also substitutes descent attempts; both non-verdict
