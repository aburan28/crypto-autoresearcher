experiment:
  id: EXP-RSA-b101ed
  hypothesis_id: H-RSA-0f37d4
  derived_from_idea: IDEA-20260805-1775f2
  question_id: RQ-RSA-afe33c
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Exact-rational audit of the one-parameter GNFS full-cost family c(theta), with a storage-free
    null object forced theta-independent, a Shanks BSGS positive control forced to the program's own
    published full-cost exponent, and a six-point monotone theta ladder, all computed before the
    theta = 1/3 treatment value is looked at
  objective: >-
    The single uncertainty a run reduces is whether the corpus's two conflicting NFS costings are
    two members of one family indexed by the memory-access exponent theta, and what value that
    family assigns at the convention this program has already declared. A run establishes (i) the
    exact rational values c(theta)^3, beta(theta)^3 and delta(theta)^3 at six ladder points,
    obtained by an INDEPENDENT symbolic re-derivation rather than by evaluating the closed form;
    (ii) whether the theta = 0 endpoint reproduces the classical GNFS exponent exactly as rationals;
    (iii) whether the storage-free null object returns a theta-INDEPENDENT exponent and whether the
    BSGS positive control returns the program's own published full-cost exponent, both computed and
    hash-committed before the treatment; (iv) whether the theta = 1/2 endpoint matches the relayed
    single-key area-time figure and, from primary text, whether that figure is what the source
    actually says; and (v) whether the record data determines theta at all - for which 'it does not'
    is a pre-authorized reportable result.
  what_this_is_not:
  - >-
    NOT a factorization, NOT an attack, NOT an improvement to NFS, and NOT a statement about the
    security of any deployed RSA key or modulus size.
  - >-
    NOT a concrete-cost table. Every value is an exponent in L-notation with an uncontrolled o(1)
    that is not small at any reachable size, and this contract forbids building such a table.
  - >-
    NOT a claim about batch NFS or any amortized-across-keys regime. The family covers single-key
    GNFS only and comparing the two would be a category error.
  - >-
    NOT a validation of any relayed corpus figure. Agreement at theta = 1/2 is either an independent
    reproduction or a coincidence, and disambiguating them requires primary text.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: derivation
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - under the stated model (memory charged S^theta on the linear
      algebra only, relation collection storage-free, CEP smoothness), the GNFS full-cost exponent
      family takes stated exact rational values at the six ladder points, reproduces the classical
      exponent exactly at theta = 0, and the optimal smoothness exponent is strictly decreasing in
      theta. WHAT DOES NOT FOLLOW - no concrete cost at any modulus size; no security statement
      about any RSA key; no claim that real machines correspond to any particular theta; no coverage
      of batch NFS; and specifically NOT that a 1.4 per cent change in an exponent inside a triple
      exponential is a security-relevant re-costing.
  inputs:
    procedure: >-
      STAGE 0 (reading, zero compute, MANDATORY BEFORE DESIGN CLOSES) - obtain primary text for the
      area-time source and for the record announcements, and RECORD whether the relayed single-key
      area-time figure is what the source actually says, or record precisely which sources were
      tried and what each returned. STAGE 1 (exact rational arithmetic, seconds) - re-derive the
      optimization INDEPENDENTLY from the stated model, not by evaluating the published closed form,
      and evaluate the six-point theta ladder in Fraction arithmetic, comparing exact rationals
      rather than decimals. Compute and HASH-COMMIT the null object and the BSGS positive control
      FIRST. Also verify the internal consistency check: substituting the stationarity and balance
      conditions back into the quadratic must leave residual exactly zero. STAGE 2 (arithmetic on
      record data, seconds, only if Stage 0 succeeded) - the beta-direction check: is the factor base
      actually chosen in the record computations BELOW the theta = 0 optimum, as a charged model
      predicts. Record the actual matrix dimension, factor-base size and post-merge row density and
      STATE THE CONCRETE FACTOR being hidden inside L[o(1)] rather than asserting it negligible.
      STAGE 3 (writing, zero compute) - the adjudication statement, in the form 'the record data
      supports theta in [x, y]' or 'the record data does not determine theta', the second being
      pre-authorized as a result.
    instrument: >-
      Exact rational arithmetic in Python's Fraction type. NO FLOATING POINT in any gate; decimals
      appear only as display alongside the exact rational they came from. No solver, no
      computer-algebra system required, no seeds, no randomness. Network at Stage 0 only, with every
      fetch outcome including failures recorded. Recorded through harness/runner.py.
    parameters: >-
      Six ladder points theta in {0, 1/6, 1/4, 1/3, 5/12, 1/2}, four of them interior. Treatment
      pre-registered at theta = 1/3, the value this program's declared wiring convention forces.
      Null object: an NFS variant identical in every respect except that its linear-algebra stage
      holds O(1) shared state, so S is L[o(1)]. Positive control: Shanks baby-step giant-step under
      the identical S^theta rule at theta = 0 and theta = 1/3. Alternative-charging arm: both stages
      charged S^theta, computed and reported so the modelling choice's consequence is visible rather
      than assumed.
  controls:
  - >-
    NULL OBJECT, SAME SHAPE, FORCED VALUE DERIVED PRE-RUN, CAN FAIL. An NFS variant identical in
    every respect except that its linear-algebra stage stores O(1) shared state - a hypothetical
    streamed-matrix Wiedemann regenerating each row on the fly. Its S is L[o(1)], so S^theta is
    L[o(1)] and the optimization MUST return c = (64/9)^(1/3) and beta = (8/9)^(1/3) FOR EVERY
    theta. If the algebra leaks a theta-dependence into a stage that stores nothing, the setup is
    wrong and every treatment number is uninterpretable.
  - >-
    POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR. Shanks BSGS under the identical
    S^theta rule must return n^(1/2) at theta = 0 and n^(2/3) at theta = 1/3, the second being a
    result this program's own technique entries state independently. If the machinery cannot
    reproduce the program's own established full-cost result on the simplest possible algorithm, the
    instrument is broken and NO negative may be reported.
  - >-
    SECOND POSITIVE CONTROL, EXTERNAL. c(1/2) must land on the relayed single-key area-time figure.
    Unlike the BSGS control this one can fail for TWO distinct reasons - derivation wrong, or relayed
    figure wrong - and the contract requires BOTH to be reported rather than the convenient one
    selected.
  - >-
    GRADED CONTROL, SIX POINTS, FOUR INTERIOR, MONOTONICITY REPORTED. c must increase strictly and
    beta must decrease strictly across the ladder, with the exact cubes stated in advance. A break in
    monotonicity LOCALISES the error to a specific theta interval instead of leaving 'the closed form
    did not work'.
  - >-
    ORDERING CONTROL. The null value and both positive-control values are computed, written down and
    HASH-COMMITTED before the theta = 1/3 treatment value is computed or looked at. 'The disagreement
    is one parameter' is a satisfying story and satisfying stories get over-read; this ordering is
    what makes the story cost something to reach.
  - >-
    INDEPENDENT RE-DERIVATION, NOT EVALUATION. Stage 1 re-derives the optimization from the stated
    model rather than evaluating the published closed form. Evaluating the closed form would check
    arithmetic, not the derivation, and the derivation is what is under test.
  - >-
    INTERNAL CLOSURE CHECK. Substituting the stationarity condition and the optimal beta back into
    the quadratic must leave residual EXACTLY ZERO. The stationarity condition and the relation
    condition close on each other, which a wrong derivation would have to arrange.
  - >-
    ALTERNATIVE-CHARGING ARM. Compute the family with BOTH stages charged S^theta and report it. It
    reproduces no published endpoint, and that fact is weak evidence about which modelling choice the
    literature makes - reported WITH that weakness attached, never as a proof of the asymmetric
    choice.
  - >-
    ARCHIVE CHECK, ZERO COMPUTE. Search the corpus for any prior computation of an NFS full-cost
    exponent under a charged memory model and record the result AS AN ABSENCE if none is found, not
    as a passed check.
  independent_variables:
  - 'theta, over the ladder {0, 1/6, 1/4, 1/3, 5/12, 1/2}'
  - 'object: full NFS (treatment) / storage-free NFS variant (null) / Shanks BSGS (positive control)'
  - 'charging convention: linear algebra only (declared model) versus both stages (alternative arm)'
  - 'output quantity: c, beta, delta'
  metrics:
    primary:
    - >-
      c_cubed(theta) - exact rational per ladder point, obtained by independent symbolic
      re-derivation and compared as a Fraction. Forced values 64/9 at theta = 0, 2401/324 at theta =
      1/3, 625/81 at theta = 1/2.
    - >-
      beta_cubed(theta) - exact rational per ladder point, forced 8/9 at theta = 0 and required
      STRICTLY DECREASING across the ladder with the exact cubes 8/9, 104/147, 16/25, 7/12, 464/867,
      40/81.
    - >-
      null_object_theta_dependence - boolean, whether the storage-free variant's c and beta are
      identical at all six theta. Forced TRUE, i.e. theta-independent at (64/9)^(1/3) and
      (8/9)^(1/3).
    - >-
      bsgs_control_exponent - exact rational exponent of n returned by the identical machinery at
      theta = 0 and theta = 1/3. Forced 1/2 and 2/3.
    secondary:
    - >-
      delta_cubed(theta) - exact rational per ladder point, forced 3 at theta = 0.
    - >-
      closure_residual - exact rational, the value left after substituting the stationarity condition
      and the optimal beta back into the quadratic. Forced EXACTLY 0.
    - >-
      area_time_endpoint_match - a three-way verdict (match / derivation mismatch / relayed-figure
      mismatch), with the primary-text quotation or a recorded statement that it could not be
      obtained.
    - >-
      alternative_charging_c(theta) - exact rational per ladder point with both stages charged,
      reported so the modelling choice's consequence is visible.
    - >-
      hidden_density_factor - the actual post-merge row density and factor-base size read from
      primary text, stated as the concrete factor being hidden inside L[o(1)] rather than asserted
      negligible.
    - >-
      record_data_theta_interval - the adjudication output, either an interval or the explicit
      verdict 'the record data does not determine theta'.
  heuristic_under_test: HEUR-NFS-2
  preregistered_prediction:
    quantity: >-
      The exact rational values c(theta)^3 at theta = 0, 1/3 and 1/2, and the monotone direction of
      beta across the six-point ladder.
    formula: >-
      c(0)^3 exactly 64/9; c(1/3)^3 exactly 2401/324 (c = 1.949616); c(1/2)^3 exactly 625/81 (c =
      1.976052); beta(0)^3 exactly 8/9; delta(0)^3 exactly 3; beta strictly decreasing across theta
      in {0, 1/6, 1/4, 1/3, 5/12, 1/2} with exact cubes 8/9, 104/147, 16/25, 7/12, 464/867, 40/81.
      Null object theta-independent at (64/9)^(1/3). BSGS control exactly n^(1/2) at theta = 0 and
      exactly n^(2/3) at theta = 1/3. Under the null that the family is wrong, c(0)^3 is not 64/9 and
      the line terminates at zero compute.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-1775f2, whose predictions block states
      every one of these exact rationals, states the BSGS positive control's forced value with the
      clause that a failure means the instrument is broken, and states the null object's forced
      theta-independence. Fixed before any run and never tuned to data. The pre-registration is
      strengthened by the fact that all gates are exact rational identities with no fitted quantity
      anywhere.
  scale_relevance:
    tier: asymptotic_only
    justification: >-
      Every quantity is an exponent in L-notation with an uncontrolled o(1), so the result has NO
      scale at all in the concrete sense and the contract forbids constructing a concrete-cost table
      at any modulus size. That prohibition is the scale statement: the o(1) is not small at any
      reachable size, the filtering and merge stage is charged nowhere, polynomial selection is
      charged nowhere, and the post-merge density treated as L[o(1)] hides a factor of a few hundred.
      The contract requires the concrete hidden density factor to be STATED from primary text at
      Stage 2 precisely so that the gap between the asymptotic claim and any concrete reading is
      visible rather than assumed away.
    correspondence: null
  tail_checks:
  - >-
    Compare every gate as an EXACT RATIONAL, never as a decimal. A decimal comparison would let
    'approximately 7.11' pass for 'exactly 64/9', which is the failure mode this contract's whole
    testability rests on avoiding.
  - >-
    Report the closure residual explicitly. A derivation that gets either the stationarity condition
    or the relation condition wrong will not close, and a nonzero residual localises which.
  - >-
    Report both possible causes when the theta = 1/2 endpoint mismatches - derivation error and
    relayed-figure error - and do not select the convenient one.
  - >-
    Report the alternative-charging arm's values alongside the declared model's, so a reader can see
    that the asymmetric choice is a modelling decision with consequences and not a neutral
    convention.
  - >-
    Report every consecutive difference along the theta ladder, not just the endpoints, so a break in
    monotonicity is localised to an interval.
  - >-
    Report the concrete post-merge density and factor-base size from primary text beside every claim
    that they are L[o(1)].
  replication:
    seeds:
    - not_applicable_deterministic
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 300
    total_cpu_hours: 0.1
    maximum_memory_gb: 2
    maximum_runs: 6
  stopping_rules:
  - >-
    STOP AT ZERO COMPUTE if c(0)^3 is not exactly 64/9. The family does not reproduce the classical
    GNFS exponent and is withdrawn.
  - >-
    STOP if the BSGS positive control does not return n^(2/3) at theta = 1/3. The instrument is
    broken and no conclusion about NFS may be reported.
  - >-
    STOP if the null object returns a theta-dependent exponent. The optimization is mis-specified.
  - >-
    STOP the record-data arm if Stage 0 cannot obtain primary text; report the symbolic results and
    the explicit verdict that the record data could not be examined, never an imputed one.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A network failure, timeout, crash or dependency failure makes the run failed_infrastructure and
    is NEVER a mathematical result (AGENTS.md rule 3). Inability to fetch primary text yields a
    symbolic-only deliverable, not a negative finding about any published figure.
  - >-
    A run in which the theta = 1/3 treatment value was computed or read before the null and both
    positive controls were hash-committed is completed_invalid. The ordering is the control.
  - >-
    A run that compares any gate in floating point rather than as exact rationals is
    completed_invalid.
  - >-
    A run that EVALUATES the published closed form instead of re-deriving the optimization
    independently is invalid_measurement - it checks arithmetic, not the derivation under test.
  - >-
    A run that builds a concrete-cost table at any modulus size is completed_invalid; the goal's own
    next_action forbids it before the record-reproduction gate passes and the o(1) does not permit it.
  - >-
    A run that asserts the post-merge density is negligible instead of stating the concrete factor is
    completed_invalid.
  success_criterion: >-
    The null object returns a theta-INDEPENDENT exponent at (64/9)^(1/3) and (8/9)^(1/3); the BSGS
    positive control returns exactly n^(1/2) at theta = 0 and exactly n^(2/3) at theta = 1/3; both
    are hash-committed before the treatment; the closure residual is exactly 0; the independent
    re-derivation returns c(0)^3 exactly 64/9, beta(0)^3 exactly 8/9 and delta(0)^3 exactly 3; the
    six-point ladder is strictly increasing in c and strictly decreasing in beta with the stated
    exact cubes; c(1/3)^3 is exactly 2401/324 and c(1/2)^3 exactly 625/81; the theta = 1/2 endpoint
    is compared against primary text with a three-way verdict recorded; and Stage 3 emits either an
    interval for theta or the explicit verdict that the record data does not determine it, which is
    an equally complete deliverable.
  falsification_criterion:
  - >-
    c(0)^3 is not exactly 64/9. The family does not reproduce the classical GNFS exponent and is
    WITHDRAWN. This is the cheapest falsifier available and it costs zero compute.
  - >-
    beta(0)^3 is not exactly 8/9, or delta(0)^3 is not exactly 3.
  - >-
    The BSGS positive control does not return n^(2/3) at theta = 1/3. No negative about NFS may then
    be reported at all; the finding is that the instrument is broken.
  - >-
    The null object returns a theta-dependent exponent. The optimization is mis-specified and every
    treatment number is uninterpretable.
  - >-
    The ladder is non-monotone in c or in beta; the failing interval localises the error.
  - >-
    Primary text shows the relayed single-key area-time exponent is not 1.976. The theta = 1/2
    endpoint agreement is then not corroboration, and the record must state which of the two numbers
    moved.
  - >-
    HEUR-NFS-2 is shown wrong at the sizes that matter - the sieve's per-processor working set grows
    like a positive power of the smoothness bound. The family covers no real machine and must be
    re-derived with theta charged on both stages, which the alternative arm already shows gives a
    materially different and much larger exponent.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
  - raw-result.json carrying every exact rational at every ladder point for every object, as Fractions, not decimals
  - the null object's c and beta at all six ladder points, hash-committed BEFORE any treatment value
  - the BSGS control's exponent at theta = 0 and theta = 1/3, hash-committed before any treatment value
  - the closure residual, forced exactly zero
  - a verbatim quotation of the single-key area-time figure from primary text, or a recorded statement of which sources were tried and what each returned
  - the alternative-charging arm's values at all six ladder points
  - the actual matrix dimension, factor-base size and post-merge row density from primary text, with the concrete hidden factor stated
  - the Stage 3 adjudication statement, in one of the two pre-authorized forms
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval and the user's authorization are required before execution. This contract
    is review_required and is NOT approved; approved_by is null and execution_authorized is false
    (AGENTS.md rule 1).
  - >-
    The proof_search_map on H-RSA-0f37d4 must be audited before implementation, per KN-TECH-080 and
    the Coordinator's proof-oriented dispatch gate.
  - >-
    This hypothesis carries an asymptotic_claim block. It may reach `analyzed` on a passing run but
    may NOT transition toward `supported` until all four promotion gates are satisfied by committed
    artifacts - proof decomposition, numbered heuristics with validation, a concrete-cost table with
    honest o(1) accounting, and independent review plus a red-team pass. This contract satisfies
    none of them by itself and does not claim to.
  - >-
    HEUR-NFS-1 is NOT validated by this contract and does not need to be, because it cancels in any
    comparison across theta. That cancellation is itself a checkable claim and must be verified at
    Stage 1; approval should confirm the check is in the task card.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260805-1775f2
    authored_at: '2026-08-25'
    note: >-
      Every exact rational gate, the null object, the two positive controls, the six-point graded
      ladder, the ordering control and the archive check are taken from the parent proposal's
      predictions and minimal_test.controls blocks, which state them as forced values fixed before
      any contract existed. The requirement that Stage 1 RE-DERIVE rather than evaluate the closed
      form, the closure-residual check as a reported metric, and the alternative-charging arm as a
      reported arm are Coordinator additions that make the derivation rather than the arithmetic the
      object under test. Boilerplate identical across contracts by program rule comes from the fixed
      table.
  derivation_gaps:
  - >-
    Whether the theta = 1/2 agreement with the relayed figure is an independent reproduction or a
    coincidence of two models landing on the same three digits is NOT settled by any amount of
    computation. It requires primary text, and if primary text cannot be obtained the endpoint
    agreement must be reported as unexplained rather than as corroboration.
  - >-
    HEUR-NFS-2, the storage asymmetry, is an architectural argument and not a proof, and its specific
    hole is named in the hypothesis - if the factor base must be replicated across processors the
    argument fails. This contract cannot close that hole; Stage 2's reading of what record
    computations actually did is the only check available and it may return nothing.
  - >-
    The prior probability that the record data determines theta at all is low, which is why 'the
    record data does not determine theta' is pre-authorized as a result. A reader should not treat a
    narrow reported interval as the expected outcome.
  - >-
    Filtering, merge and polynomial selection are charged NOWHERE in the model. The claim that they
    do not change the exponent is flagged, not defended, and is exactly the kind of claim that hides
    a real cost.
  - >-
    The exponent 1/3 in S^(1/3) is taken from this program's own technique entries rather than from
    the primary wiring source, which has not been read. If those entries mis-state it, the treatment
    point moves and every number at theta = 1/3 moves with it.
