# =============================================================================
# EXP-CERTBIN-a14350 -- VERSION 1 (APPROVED by DEC-20261002-780e64) frozen
# contract for H-CERTBIN-adccf3: HOLD-X5 Frobenius-conjugate attempt
# correlation (Propositions T, Sigma; overlap census) with Stage-0 note +
# Stage-1 exhaustive K17/K19 census.
#
# Source: IDEA-20260926-9c5694 under RQ-CERTBIN-836ce2 / GOAL-ECDLP2M-001.
# Consolidates IDEA-20260926-917981 (stable-V control). Folds
# IDEA-20261001-93e740 Lemma A2-prime as pre-gate (TW-7257-2).
#
# ZERO RUNS in this design packet. Stages 0-1 authorized for executor
# TASK-20261002-7c225d. Optional Stage-2 closure arm NOT authorized.
# No AUXIN. Amazon Bedrock prohibited. NO break. NO attack. NO exponent.
# =============================================================================
experiment:
  id: EXP-CERTBIN-a14350
  hypothesis_id: H-CERTBIN-adccf3
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260926-9c5694
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    HOLD-X5: Stage-0 Propositions T/Sigma + overlap arithmetic (A2-prime
    pre-gate) plus Stage-1 exhaustive conjugate-attempt census on K17/K19
    with stable, random-V', and ordinary-curve nulls
  status: approved
  approved_by: DEC-20261002-780e64
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-780e64
    composing_decision: DEC-20261002-780e64
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 is zero-compute (or tiny fixture) authoring of Propositions T
      and Sigma, d_j / o_j tables, ECC2K-130 overlap arithmetic, and the
      93e740 A2-prime pre-gate freeze. Stage 1 is solver-free exhaustive
      sumset census at m=2. Optional Stage-2 M_4/W_4 closure arm is NOT
      authorized. No Magma/Sage. No AUXIN. No Bedrock. No ECC2K-130 solve.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Freeze and independently check Propositions T and Sigma; compute the
    overlap lower bound table; run an exhaustive m=2 conjugate-attempt
    census on the n=17 and n=19 Koblitz siblings with stable / random /
    ordinary-curve controls; deliver exactly one O-* label from
    H-CERTBIN-adccf3 — deciding E-OVERLAP vs E-EXTRA (or artifact / null-fail)
    for the non-stable Frobenius attempt generator.

  class: measurement
  class_note: >-
    Control / certificate experiment with a Stage-0 proposition note and a
    Stage-1 heuristic-validation census (H1 / H-A2PRIME). Carries
    Propositions T and Sigma. Not an exponent-moving breakthrough
    experiment; no ECDLP attack table produced.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond tiny Python LA). Write
        stage0/preregistered-predictions.json and stage0/propositions-note.md
        freezing: Proposition T statement with b-in-F_2 hypothesis;
        Proposition Sigma; d_j for each named base at n in {17,19};
        o_j formulae; ECC2K-130 (m,l)=(4,33) overlap arithmetic with
        d_1=17 re-derived; 93e740 Lemma A2-prime pre-gate predictions and
        bands; stable-arm concordance target 1.000. Stable-arm fixture must
        be declared before any non-stable rho_j is written into RESULTS.
      - >-
        Stage 1. Exhaustive chi_V census over G on K17 and K19; label
        vectors per orbit; rho_j exact vs o_j; T1 check on 10^3 samples;
        A2 / A2-prime gate; ordinary RC-1 null; random V' shape null;
        write stage1/*.json.
      - >-
        RESULTS.md with exactly one O-* label from H-CERTBIN-adccf3
        distinguishable_outcomes; memory (sumset size, peak RSS) stated
        beside every time figure.
    excluded:
      - Magma/Sage/cypari2/AUXIN provisioning as the success path.
      - Amazon Bedrock.
      - Editing IDEA-20260926-9c5694 / 917981 / 93e740 claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Claiming break / exponent / ECC2K-130 attack from this contract.
      - Optional Stage-2 M_4/W_4 closure arm (design_after; not authorized).
      - Treating infra failure as mathematical evidence against T/Sigma/H1.
      - Running any ECC2K-130 / deployed-scale decomposition cell.
      - Overwriting experiments/EXP-CERTBIN-e94b27/impl/ in place without a
        documented copy/wrapper under this experiment's write_scope.

  inputs:
    proposal: ledger/proposals/IDEA-20260926-9c5694.yaml
    hypothesis: ledger/hypotheses/H-CERTBIN-adccf3.yaml
    question: ledger/questions/RQ-CERTBIN-836ce2.yaml
    hold_decision: ledger/decisions/DEC-20260928-63addc.yaml
    pool_ranking: ledger/decisions/DEC-20260929-7257b2.yaml
    consolidated_stable_control: ledger/proposals/IDEA-20260926-917981.yaml
    a2_prime_pre_gate: ledger/proposals/IDEA-20261001-93e740.yaml
    equivariance_source: ledger/proposals/IDEA-20260906-a77711.yaml
    field_instrument: experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
    curve_instrument: experiments/EXP-CERTBIN-e94b27/impl/curve.py
    analysis_readme: analysis/binstd-idea-review-20260926/README.md

  controls:
    - name: stable_V_S_positive
      description: >-
        At n=17, V_S = F_2 + ker g(sigma) (both octic factors of Phi_17):
        label concordance must be exactly 1.000 on all orbits before any
        non-stable rho_j is read. Failure → O-ARTIFACT.
    - name: random_V_prime_shape_null
      description: >-
        One seeded random subspace V' of matched dimension with its own
        computed d_j; excess correlation present on V but absent on V' and
        on the ordinary null supports E-EXTRA as curve-specific.
    - name: ordinary_RC1_null
      description: >-
        RC-1 ordinary curve (A=97044, B=126251) where Proposition T fails
        (T3): conjugate x_R treated as random-x targets; rho_j must lie
        within 3 sigma of 0 (E-NULL). Nonzero → O-E-NULL-FAIL.
    - name: proposition_T1_reproduction
      description: >-
        For 10^3 sampled (R,j), enumerate decompose(sigma^j R, V) and
        decompose(R, sigma^{-j} V); solution sets must correspond under
        sigma^{-j}.
    - name: lemma_A2_prime_pre_gate
      description: >-
        TW-7257-2: freeze and check 93e740 Lemma A2-prime shared-tuple rate
        before treating unsigned A2 "no common tuple" as a voiding check.
        Record O-A2PRIME when unsigned fails but signed form accounts.
    - name: order_recount
      description: >-
        Re-count |G| for both Koblitz siblings before use; disagreement
        with pre-registered 65587 / 130873 → O-ARTIFACT.
    - name: memory_beside_time
      description: >-
        Sumset cardinality and peak RSS stated beside every time figure in
        RESULTS.md.

  independent_variables:
    - name: stage
      levels: [0_propositions_freeze, 1_exhaustive_census]
    - name: field_degree_n
      levels: [17_koblitz, 19_koblitz, 17_RC1_ordinary]
    - name: base
      levels: [polynomial_V, stable_V_S, random_V_prime]
    - name: lag_j
      levels: [1 .. n-1]
    - name: a2_form
      levels: [unsigned_A2, signed_A2_prime]

  metrics:
    primary:
      - name: stable_concordance
        unit: fraction
        definition: Fraction of orbits with constant label on V_S at n=17.
      - name: rho_j
        unit: correlation
        definition: Exact lag-j indicator autocorrelation of chi_V along orbits over all of G.
      - name: o_j
        unit: correlation
        definition: Overlap-term prediction from d_j and measured p (per arm).
      - name: rho_minus_o_over_sigma
        unit: dimensionless
        definition: (rho_j - o_j) / binomial_se; E-EXTRA iff >3 on a Koblitz cell.
      - name: t1_match_rate
        unit: fraction
        definition: Fraction of 10^3 (R,j) samples with exact solution-set correspondence under sigma^{-j}.
    secondary:
      - name: d_j
        unit: dimension
        definition: dim(V cap sigma^j V) by linear algebra (cross-checked by enumeration).
      - name: p_sumset
        unit: fraction
        definition: 'p = |S|/|G| with S=(F_V+F_V) cap G.'
      - name: a2_prime_shared_tuple_count
        unit: count
        definition: Number of x-tuples in Sol(R,V) cap Sol(sigma^j R,V) over the gate sample.
      - name: group_order_recount
        unit: integer
        definition: Re-counted |G| for each Koblitz cell.
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS of Stage-1 processes (memory honesty).
      - name: wall_clock_seconds
        unit: seconds
        definition: Measured wall clock (reported; not a pre-committed claim).
      - name: ecc2k130_overlap_log2
        unit: bits
        definition: Derived |log2| of overlap correlation at (m,l)=(4,33); arithmetic only.

  heuristic_under_test: H1; H-A2PRIME

  preregistered_prediction:
    quantity: >-
      Stage-0 d_j/o_j tables and A2-prime bands; Stage-1 stable concordance
      1.000; Koblitz rho_j vs o_j within 3 sigma (E-OVERLAP) or excess
      (E-EXTRA); ordinary null within 3 sigma of 0.
    formula: >-
      d_1(K17,V={deg<9})=5 (span{1,t^2,t^4,t^6,t^8}); other d_j by LA;
      d_1(ECC2K-130,l=33)=17; overlap at (4,33) ~ 2^{-64};
      stable concordance = 1.000; T1 match_rate = 1.0;
      |G|_K17 = 65587; |G|_K19 = 130873;
      E-OVERLAP iff max_j (rho_j-o_j)/se <= 3 on both Koblitz cells;
      E-NULL iff max_j |rho_j|/se <= 3 on RC-1.
    source: >-
      ledger/proposals/IDEA-20260926-9c5694.yaml predictions + proof_search_map;
      IDEA-20261001-93e740 Lemma A2-prime; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Exhaustive census at n in {17,19}, m=2. Transfer of E-OVERLAP /
      E-EXTRA readings to n=131 is explicitly NOT claimed; only the
      derived overlap arithmetic at (4,33) is recorded as arithmetic.
    correspondence: null

  replication:
    seeds: [20261002]
    independent_instances: 2
    note: >-
      Both Koblitz cells are independent instances of the same protocol.
      V' uses the single recorded seed. Everything else is exhaustive
      (no sampling over G).

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 2.0
    maximum_memory_gb: 4
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json.
    - Stage 1 complete on both Koblitz cells + RC-1 null + named controls, OR a named O-ARTIFACT / O-IMPEDIMENT stop with measured quantity.
    - maximum_runs = 4.
    - Do not open Stage-2 closure arm under this card.

  invalidation_rules:
    - Stable concordance ≠ 1.000 → O-ARTIFACT; do not read non-stable rho_j.
    - Order re-count disagrees → O-ARTIFACT.
    - T1 match_rate < 1.0 → Proposition T falsified; stop.
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence against T/Sigma/H1.

  success_criterion: >-
    Stage 0 artifacts frozen; Stage 1 produces exact rho_j / o_j tables with
    all blocking controls executed; RESULTS.md names exactly one O-* label
    from H-CERTBIN-adccf3 with cited artifacts.

  falsification_criterion: >-
    Any of: T1 mismatch; stable concordance ≠ 1.000; E-NULL fail on RC-1
    before Koblitz reading; A2-prime gate broken while instrument depends on
    unsigned A2; or a claim of break/exponent under this card.

  required_artifacts:
    - experiments/EXP-CERTBIN-a14350/stage0/preregistered-predictions.json
    - experiments/EXP-CERTBIN-a14350/stage0/propositions-note.md
    - experiments/EXP-CERTBIN-a14350/stage1/
    - experiments/EXP-CERTBIN-a14350/RESULTS.md
    - experiments/EXP-CERTBIN-a14350/runs/<RUN-CERTBIN-*>/

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
