# EXP-BINSTD-a57bd3
# Window-floor arithmetic. No basis.
# Approved by DEC-20261003-ddc363.
experiment:
  id: EXP-BINSTD-a57bd3
  hypothesis_id: H-BINSTD-0167cd
  source_idea: IDEA-20261001-880180
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Dimension-window floors versus the pair floor
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-ddc363
  objective: >-
    Check the gap 19, the excess 128, and the product 29184.
  inputs:
    n_17: 17
    n_23: 23
    n_31: 31
    lo_17: 2
    hi_17: 4
    lo_23: 2
    hi_23: 5
    lo_31: 3
    hi_31: 7
    window_17: 3
    window_23: 4
    window_31: 5
    window_product: 60
    pair_floor: 20
    pair_slots: 60
    slot_gap: 0
    threshold: 1
    floor_gap: 19
    n_gap_lo: 6
    n_gap_hi: 8
    span_product: 48
    slot_excess: 12
    hi_product: 140
    lo_product: 12
    band_excess: 128
    gap_product: 29184
    n_sum: 71
    n_product: 12121
    rem_product: 49
  controls:
    - >-
      The floor of 17 over 8 is 2 and the floor of 17 over 4 is 4.
      The floor of 23 over 8 is 2 and the floor of 23 over 4 is 5.
      The floor of 31 over 8 is 3 and the floor of 31 over 4 is 7.
      The windows have 3, 4, and 5 integers. Reporting the pair
      floor as 1 invalidates the run.
    - >-
      The product of 3, 4, and 5 is 60. Three times 20 is 60. Twenty
      minus 1 is 19. Six times 8 is 48. Sixty minus 48 is 12.
    - >-
      Four times 5 times 7 is 140. Two times 2 times 3 is 12. One
      hundred forty minus 12 is 128. The product of 19, 128, and 12
      is 29184. Seventeen times 23 times 31 is 12121. The product of
      the remainders 1, 7, and 7 is 49.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {windows, floors, product}
    - route in {difference, product}
  metrics:
    primary:
      - floor_gap
      - gap_product
      - implementations_agree
    secondary:
      - band_excess
      - slot_excess
      - n_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Twenty exceeds 1 by 19. One hundred forty exceeds 12 by 128.
      The product of 19, 128, and 12 is 29184.
    formula: >-
      Subtract 1 from 20. Multiply 4, 5, and 7, then subtract 12.
      Multiply 19, 128, and 12.
    source: >-
      IDEA-20261001-880180 states the n list 17, 23, 31, the pair
      floor 20, the threshold 1, and the windows from the floor of n
      over 8 to the floor of n over 4, read 2026-10-03. The floors
      were recomputed in this design session. That computation is
      not a run. No basis was built.
  scale_relevance:
    tier: toy
    justification: Three listed n values and one written pair floor. No transfer to a median.
    correspondence: null
  tail_checks:
    - The product 29184 and the excess 128 are required. A check that stops at the gap 19 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 19 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The floor gap is not 19.
    - The excess is not 128.
    - The product is not 29184.
    - A basis is built, or the pair floor is reported as 1.
  success_criterion: >-
    Both runs agree that 20 minus 1 is 19, that 3 times 20 is 60,
    that 140 minus 12 is 128, that 60 minus 48 is 12, and that the
    product of 19, 128, and 12 is 29184.
  falsification_criterion: >-
    The runs agree that 20 minus 1 is computed, and that difference
    is not 19.
  required_artifacts:
    - experiments/EXP-BINSTD-a57bd3/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-a57bd3/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-a57bd3/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-a57bd3/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-a57bd3/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-a57bd3/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any basis, subspace, or usable-dimension count.
    - Any claim that a basis changes a predicate.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
