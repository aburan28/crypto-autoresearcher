experiment:
  id: EXP-MODEL-1554cd
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-dadcd2
  question_id: RQ-MODEL-e61cb2
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: THE RATIONAL-DECK-GROUP LAW FOR CURVE MODELS - the per-variable degree of a model's summation
    polynomial is g^(m-2) and the Bezout number at fixed factor-base size is B^(m-1)/g, where g is
    the order of the F_p-RATIONAL part of the deck group of the coordinate map; on a prime-order curve
    g = 2 for every model, so the model lever on the decomposition system is exactly 1, and the obstruction
    is ARITHMETIC (rationality) rather than the usual birational-invariance handwave
  status: draft
  objective: "(A) THE SETUP, STATED SO IT IS CHECKABLE. Let E/F_p be an elliptic curve with identity\
    \ O. Define a MODEL of E to be a choice of non-constant rational map f from E to P^1, defined\
    \ over F_p - the \"coordinate\" whose values form the factor base. Short Weierstrass takes f =\
    \ x; Montgomery takes f = x_M; twisted Edwards takes f = y; the Kummer line takes f = the quotient\
    \ map E -> E/{+-1}; Hessian can take f = x or f = x+y; and one may also take f to be pulled back\
    \ along an isogeny. Define S_m^f, the m-th summation polynomial IN THE MODEL f, as the reduced\
    \ defining polynomial of the Zariski closure of\n  {(f(P_1),...,f(P_m)) : P_i in E(Fbar_p), P_1\
    \ + ... + P_m = O}\ninside (P^1)^m. For f = x this is exactly Semaev's S_m (KN-TECH-002), which\
    \ harness/semaev.py implements as s3_expr and s4_expr for y^2 = x^3 + ax + b.\n(B) THE LAW. Let\
    \ n = deg f and let\n  Gamma_f = {gamma in Aut(E,O) : f o gamma = f}\nbe the part of the deck\
    \ group of f consisting of GROUP automorphisms, and let g = |Gamma_f(F_p)| be the order of its\
    \ F_p-rational part. Then\n  (L1)  deg_{t_m} S_m^f  =  g^(m-2)      when f is the quotient map\
    \ by Gamma_f\n  (L2)  deg_{t_m} S_m^f  <=  n^(m-1)     always\n  (L3)  a factor base cut out by\
    \ a degree-d membership polynomial in the\n        coordinate f contains B = g*d points OF E(F_p),\
    \ not n*d - because a\n        geometric fibre of f has n elements but only the Gamma_f(F_p)-orbit\n\
    \        of a rational point is rational\n  (L4)  hence the Bezout number of the arity-m decomposition\
    \ system\n        {S_m^f(t_1,...,t_{m-1}, f(R)) = 0} union {membership(t_i) = 0}\n        at FIXED\
    \ rational factor-base size B is\n          Delta_f  =  g^(m-2) * (B/g)^(m-1)  =  B^(m-1) / g.\n\
    \n(C) THE COROLLARY THAT CLOSES THE LANE ON CRYPTOGRAPHIC CURVES. Gamma_f(F_p) is a subgroup of\
    \ Aut(E,O)(F_p), which is {+-1} unless j = 1728 (order 4) or j = 0 (order 6). So g <= 6 always,\
    \ and g = 2 for every ordinary curve of generic j. Therefore\n  Delta_f is between B^(m-1)/6 and\
    \ B^(m-1)/1 for EVERY model of EVERY curve,\n  and equals B^(m-1)/2 for EVERY model of a generic-j\
    \ curve.\nShort Weierstrass x, Montgomery x, twisted Edwards y, the Kummer line and the Hessian\
    \ symmetric coordinate x+y ALL realise g = 2 and are therefore EXACTLY TIED on this functional.\
    \ A model can only LOSE (a non-Galois coordinate such as the Hessian x has g = 1 and Delta = B^(m-1),\
    \ a factor 2 worse) and can only WIN by at most a factor 3 (g = 6, requiring j = 0 and 6 | p -\
    \ 1).\n(D) WHY THE OBSTRUCTION IS ARITHMETIC AND NOT THE USUAL ONE. The standard dismissal of\
    \ this lane is \"birational equivalence is an isomorphism of function fields, so the geometry\
    \ cannot change\". That is true and it is not what does the work here. The load-bearing step is\
    \ (L3): the coordinate degree n counts GEOMETRIC preimages, the factor base counts RATIONAL ones,\
    \ and the two agree only on the F_p-rational part of the deck group. This is what kills the most\
    \ attractive candidate in the lane, which the geometric argument alone does NOT kill - see (E).\n\
    (E) THE CANDIDATE THIS KILLS, WORKED THROUGH, BECAUSE IT IS THE ONE THE INHERITED ANALYSIS LEFT\
    \ OPEN. inputs/refs/research/ proofs_Dreg_conservation_weil_invariance.md, PO-001 section 1.5\
    \ item C2, names \"a genuine rational map (e.g. a 2-isogeny x-coordinate map, which is a degree-2\
    \ rational function)\" as \"the strongest surviving candidate to break conservation\". Take f\
    \ = x' o pi with pi : E -> E/<T> an F_p-rational cyclic ell-isogeny, x' the Weierstrass coordinate\
    \ on the codomain. Then deg f = 2ell, f is invariant under negation AND under translation by T,\
    \ and a direct fibre count gives deg_{t_m} S_m^f = 2^(m-2) - NO WORSE than Weierstrass despite\
    \ the coordinate having degree 2ell. Naively B = 2ell*d, so Delta_f = 2^(m-2) d^(m-1) = B^(m-1)/(2\
    \ ell^(m-1)): a factor ell^(m-1) BETTER than Weierstrass, growing with m. That is the whole apparent\
    \ prize of the lane and the geometric argument does not touch it. It dies on (L3). On a curve\
    \ of prime order N, E(F_p) = Z/N has no rational ell-torsion for ell < N, so T is irrational;\
    \ the geometric fibre {+-P + jT} has 2ell elements but only {+-P} are rational. Hence B = 2d,\
    \ not 2ell*d, and Delta_f = B^(m-1)/2 exactly - tied with Weierstrass, no gain. The prize was\
    \ an artifact of counting geometric points as if they were rational.\n(F) WHAT THIS ARGUMENT DOES\
    \ *NOT* CONSTRAIN, WHICH IS WHY L11 IS NOT VACUOUS AND MUST NOT BE CLOSED WHOLESALE. The law fixes\
    \ a DEGREE and a BEZOUT COUNT. It says nothing about:\n  (F1) the MONOMIAL SUPPORT of S_m^f. Short\
    \ Weierstrass S_3 has 13 of the 27\n       possible monomials of multidegree <= (2,2,2) (hand-expanded\
    \ below);\n       a generic Moebius reparametrisation has 27; twisted Edwards y is\n       predicted\
    \ to have at most 14, all of even total degree. Support drives\n       the BKK mixed volume (KN-TECH-007),\
    \ which the program has already\n       converted into a measured 2-5x speedup (KN-FIND-2a8b7e)\
    \ and a proved\n       (m+1)/2 bound (KN-FIND-c7d31e). Support is NOT a birational invariant.\n\
    \  (F2) the NEWTON POLYTOPE and hence the mixed volume itself.\n  (F3) the COEFFICIENT SIZES /\
    \ heights, which no degree argument sees.\n  (F4) SYMMETRIES induced by RATIONAL TORSION TRANSLATIONS.\
    \ These are NOT in\n       Aut(E,O) and so contribute nothing to g, but a rational 2-torsion point\n\
    \       descends to an involution of the Kummer line and imposes a grading on\n       S_m^f. That\
    \ is precisely the mechanism of Faugere-Gaudry-Huot-Renault\n       (KN-LIT-004) and it is a real\
    \ constant-factor gain - available exactly\n       when the curve has a cofactor, i.e. never on\
    \ a prime-order curve.\n  (F5) anything about genus-2 Kummer surfaces / theta / Mumford\n    \
    \   representations, which PO-004 section 2.2 of the same inherited\n       document explicitly\
    \ leaves OPEN.\nForward guidance is therefore: stop looking for a model with a lower DEGREE, which\
    \ (B)-(C) forbid; look at support, polytope, coefficient height, and the cofactor-dependent torsion\
    \ symmetries - and note that the last of these has a hard arithmetic ceiling on prime-order curves."
  resource_label: R2 (the curve equation / model - it changes the polynomial system, not the group),
    with R1 as the downstream consumer (x-coordinates as field elements).
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE, AND THE ADMISSIBILITY IS THE INTERESTING PART. The proposal
    consumes R2: it changes the ideal whose Groebner basis is computed, and the coefficients of that
    ideal are field data that no generic-group simulator (KN-FIND-b7e091) can produce, because the
    simulator has access to group labels and equality tests only and never to the ring F_p in which
    S_m^f lives. So this is NOT closed by the exponent-1/2 argument. It is closed by a DIFFERENT and
    weaker-sounding but here decisive bound - the rational deck group - and the point of filing it
    is that the two closures are independent. Note also that this lane does not apply phi to points
    of G, so H-ENDO-001 does not bite; the scalar-action argument is irrelevant here.'
  reachability_gate: 'TRIVIAL, AND STATED RATHER THAN LEFT BLANK BECAUSE THE BRIEF REQUIRES IT. T5
    (DECOMPOSITION.md section 3) gates lanes that must MOVE BETWEEN CURVES: reaching a specified curve
    in an isogeny class is the vectorization problem and costs about sqrt(h) ~ p^(1/4). This lane
    moves between COORDINATES ON ONE FIXED CURVE. A model change is a per-variable Moebius substitution,
    costs O(1) field operations, is invertible, and involves no walk, no mixing time and no class-group
    action. The good object is reachable with probability 1 at zero isogeny cost. This is exactly
    why L11 is a strictly finer question than L1 - it removes reachability as a confound, so any difference
    observed is attributable to the representation and to nothing else. The ONE non-trivial reachability
    caveat is model EXISTENCE, not model reachability: a twisted Edwards model requires a rational
    point of order 4 and a Hessian model a rational point of order 3, so those models are unavailable
    on prime-order curves at any price. That unavailability is an arithmetic fact about the curve,
    not a search cost, and it is (L3) again.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): read Cheng-Kodera-Miyaji 2019 (IEICE E102-A(9)
      1061-1071) and FGHR 2014 (KN-LIT-004) bodies. If either already states the rational-deck-group
      law, reclassify this record as duplicate and write a knowledge/literature note instead of running
      anything. STAGE 1 (minutes, HARD GATE): reproduce the baseline. sympy degree read-off of harness/semaev.py
      s3_expr (expect per-variable 2, total 4, 13 monomials) and of the squarefree part of s4_expr
      (expect per-variable 4). STAGE 2 (minutes): construct ONE toy curve over a p of about 16 bits
      that simultaneously admits Weierstrass, Montgomery, twisted Edwards and Hessian models - i.e.
      a rational point of order 4 and, for the Hessian, a rational point of order 3, so the curve
      needs a cofactor divisible by 12. Verify all the birational maps pointwise on 100 random points
      with an independent on-curve check in each model. This is an instrument gate, not a measurement.
      STAGE 3 (minutes to an hour): eliminate to obtain the reduced S_3^f in each of the five coordinates
      by resultants in sympy, take squarefree parts, read off per-variable degrees and monomial counts.
      Compare with the predictions. STAGE 4 (minutes): the rational-fibre count. For the isogeny-pullback
      coordinate on a PRIME-ORDER toy curve, enumerate E(F_p), compute f on every rational point,
      and histogram the fibre sizes. Predicted: every rational fibre has size 2 (or 1 at the four
      branch points). Observing size 2*ell reopens the lane. STAGE 5 (zero compute): apply the random-Moebius
      null of IDEA-20260807-4fc635 to every arm of Stage 3 and confirm degrees are unchanged and supports
      are not.'
    mechanism: 'STEP 1 - PROVE (L1) AND (L2). Fix generic t_1,...,t_(m-1). By definition of the reduced
      defining polynomial, deg_{t_m} S_m^f equals the number of DISTINCT values of f(-(P_1 + ... +
      P_(m-1))) as each P_i ranges over the fibre f^(-1)(t_i). Each fibre has n elements, giving (L2).
      If f is the quotient by Gamma_f (so n = |Gamma_f|), write P_i = gamma_i Q_i; then substituting
      gamma_i -> gamma*gamma_i simultaneously for all i sends the sum to gamma(sum gamma_i Q_i) because
      every gamma is a GROUP automorphism, and f is Gamma_f-invariant, so the value is unchanged.
      Hence the value depends only on the class of (gamma_i) in Gamma_f^(m-1) modulo the diagonal,
      giving at most |Gamma_f|^(m-2) values, with equality for generic parameters. For Gamma_f = {+-1}
      this is 2^(m-2), reproducing Semaev exactly (KN-TECH-002) - which is the baseline-reproduction
      check.

      STEP 2 - PROVE (L3). Let t be an F_p-rational value of f and P a rational point with f(P) =
      t. Every element of f^(-1)(t) is gamma P for some gamma in the geometric deck group. gamma P
      is F_p-rational iff gamma is fixed by Frobenius composed with the stabiliser bookkeeping; for
      gamma in Aut(E,O) this reduces to gamma being defined over F_p. Hence the rational fibre is
      Gamma_f(F_p) P, of size g. Summing over the d roots of the membership polynomial gives B = g*d.

      STEP 3 - ASSEMBLE (L4). The system has m-1 summand variables each constrained to degree d, and
      one summation equation of per-variable degree g^(m-2). The multi-homogeneous Bezout number is
      g^(m-2) * d^(m-1). Substituting d = B/g gives B^(m-1)/g. This matches the program''s own convention
      in IDEA-20260803-e2f5bd, which writes Delta ~ 2^(m-2) * d_p^(m-1) for the Weierstrass case -
      substituting g = 2, d_p = B/2 reproduces it exactly.

      STEP 4 - THE AUT BOUND. Aut(E,O) has order 2 for j not in {0, 1728}, 4 for j = 1728 (needs 4
      | p - 1 for the extra automorphisms to be rational), and 6 for j = 0 (needs 6 | p - 1). Hence
      g <= 6 unconditionally and g = 2 for generic j. Combined with (L4) this bounds the entire lane.

      STEP 5 - THE PRIME-ORDER COROLLARY. If #E(F_p) = N is prime then E(F_p) = Z/N has no rational
      torsion of small order, so no translation is rational, and Aut(E,O)(F_p) acting faithfully on
      E(F_p) must have order dividing... more carefully: negation is always rational, giving g >=
      2; the j = 0 and j = 1728 cases require the corresponding CM discriminant, which fixes t and
      hence is a property of the isogeny class (DECOMPOSITION.md T4). So on a prime-order curve of
      generic j, g = 2 for every model, full stop.

      STEP 6 - THE SYMBOLIC AUDIT THAT COULD FALSIFY EVERY STEP ABOVE. Compute S_3^f symbolically
      in sympy for f = Weierstrass x, Montgomery x, Edwards y, Hessian x, Hessian x+y, on ONE fixed
      toy curve admitting all of them, and read off the per-variable degrees. Predicted (2,2,2), (2,2,2),
      (2,2,2), (9,9,9), (2,2,2). Any deviation falsifies the law at the exact lemma the deviation
      lands on.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - random-Moebius null per variable, decay parameter 0..m
  - shifted Kummer coordinate x(P - R) for random R
  - the same curve over F_{p^k} where the isogeny kernel becomes rational, as the positive control
    that the law's mechanism is rationality
  - a j = 0 curve with 6 | p - 1, as the positive control that g > 2 is reachable at all and produces
    the predicted factor 3
  - an INTENTIONALLY WRONG model map (a birational map with a sign error) to confirm the Stage-2 verification
    gate actually rejects it
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. The matched null is THE SAME MODEL WITH
    A RANDOM CHANGE OF COORDINATES - for each variable independently draw mu_i in PGL_2(F_p) and substitute
    t_i -> mu_i(t_i), clearing denominators. This is a coordinate with the SAME deck group and the
    SAME degree, so the law predicts EXACTLY ZERO change in per-variable degree and in Bezout number,
    while support and coefficients change completely. DECAY PARAMETER: the number of independent random
    Moebius maps applied, 0 through m. If any quantity the experiment reports as a "model effect"
    fails to stay flat as that parameter grows from 0 to m, the quantity is a coordinate artifact
    and no model claim may be made from it. SECOND NULL: the shifted Kummer coordinate x_R(P) = x(P
    - R) for random R, which is a degree-2 coordinate that is translation-conjugate to the standard
    one; every measurement must be identical after retargeting, and a difference is an instrument
    fault. Both nulls are specified in full in IDEA-20260807-4fc635.'
  independent_variables: []
  metrics:
    primary:
    - per-variable degree and total degree of the reduced S_3^f per model
    - monomial count and the explicit support set per model
    - rational fibre size histogram per coordinate
    - g = |Gamma_f(F_p)| computed independently by orbit enumeration
    secondary:
    - Delta_f computed from the formula and from a brute-force solution count
    - pass/fail of every gate
  heuristic_under_test: null
  preregistered_prediction:
    quantity: per-variable degree of the reduced S_3^f for f in {Weierstrass x, Montgomery x, Edwards
      y, Hessian x+y} on one fixed toy curve
    formula: All four EXACTLY 2, an exact integer tie with zero tolerance. Any value other than 2
      for any of the four falsifies (L1) outright.
    source: pre-registered in IDEA-20260807-dadcd2 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - NON-REDUCED PRESENTATIONS. Composed resultants routinely carry squared factors that inflate the
    apparent per-variable degree. Every degree must be read from a squarefree part, and the squarefree
    computation itself must be checked on the Weierstrass baseline where the answer is known.
  - MODEL-EXISTENCE BIAS. A curve admitting all five models has a cofactor divisible by 12 and is
    therefore NOT a cryptographic curve. Every number measured in Stage 3 is measured on a curve with
    torsion, which is exactly the case where mechanism (F4) is available. Conclusions about prime-order
    curves are DERIVED (Step 5), never measured, and must be labelled so.
  - Coordinate-at-infinity conventions. Moving a point to infinity changes whether a degree is realised
    affinely; degrees must be computed in the multi-projective sense and the convention frozen before
    Stage 3.
  - 'j = 0 and j = 1728 availability is CLASS-DETERMINED (DECOMPOSITION.md T4): one cannot walk to
    such a curve from a class that does not contain one, so the factor-3 exception is not an attack
    even where it exists.'
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: All four EXACTLY 2, an exact integer tie with zero tolerance. Any value other
    than 2 for any of the four falsifies (L1) outright.
  falsification_criterion:
  - Any g = 2 model shows a reduced per-variable degree different from 2 at m = 3. (L1) is false as
    stated and the record is superseded, not amended.
  - The Hessian x shows per-variable degree other than 9. The (L1)/(L2) dichotomy is wrong.
  - A rational fibre of the isogeny-pullback coordinate on a prime-order curve has size greater than
    2. (L3) is false, (E) is wrong, and the lane REOPENS with an explicit ell^(m-1) target - the most
    valuable possible failure.
  - Two g = 2 models show materially different MEASURED Groebner solving degree on identical instances
    with the null applied. That does not falsify the law - the law is about Bezout degree - but it
    falsifies the CLOSURE READING of the law and hands the lane to (F1)-(F3).
  - Stage 0 finds the law already published. Then the deliverable is a literature note, not a finding.
  - Stage 1 baseline reproduction fails. Instrument fault; nothing is reported.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
