experiment:
  id: EXP-JINV-f5edb2
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-a3d644
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: The matched-null battery for "special j", including the fact that an exact (p, N, cofactor)
    match across different D_0 is IMPOSSIBLE by T4 so the null must be built through the cofactor;
    plus the sixth-power representation null that no other L3 proposal can pass without; plus the
    |D_0| decay ladder 3,4,7,8,11,19,43,67,163 -> h=2 -> generic, whose flat-then-jump profile is
    this lane's canonical artifact signature
  status: draft
  objective: "(A) THE LANE HAS NO USABLE NULL YET, AND THE OBVIOUS ONE DOES NOT EXIST. RQ-JINV-8fc13a\
    \ and DECOMPOSITION.md section 4 (L3) both specify the comparison \"curves with |D_0| in {3,4,7,8,11,...}\
    \ against generic-D_0 curves at matched p and matched N\". That comparison is NOT CONSTRUCTIBLE\
    \ AS STATED when the cofactor is fixed. Reason, and it is T4: the isogeny class is determined\
    \ by the trace t, and #E = p + 1 - t. Fixing p, fixing N and fixing the cofactor h fixes #E =\
    \ hN, hence fixes t, hence fixes D = t^2 - 4p and therefore D_0. TWO CURVES OVER THE SAME p WITH\
    \ THE SAME GROUP ORDER HAVE THE SAME FUNDAMENTAL DISCRIMINANT. [derived here from T4; elementary.]\
    \ The null is therefore only reachable by letting the cofactor differ: #E = h1*N with D_0 = -3\
    \ and #E' = h2*N with generic D_0, same p, same prime N, h1 != h2. Such pairs exist and are findable\
    \ at toy scale by search, but they are RARE and the search cost is part of this proposal's deliverable.\
    \ Any L3 record that claims a \"matched p and matched N\" null WITHOUT saying how the cofactor\
    \ differs has either not built the null or has silently matched something weaker, and this record\
    \ exists so that no such claim passes unchallenged.\n(B) THE FOUR NULLS THIS LANE ACTUALLY NEEDS,\
    \ IN INCREASING SHARPNESS.\n  NULL-1 SAME-p, SAME-N, DIFFERENT-COFACTOR, GENERIC D_0. The nearest\n\
    \    legitimate approximation to the brief's null. Isolates \"small |D_0|\"\n    from \"this prime\"\
    \ and from \"this subgroup size\". Cost: a search over\n    curves at fixed p; the yield rate\
    \ is measured and reported.\n  NULL-2 SAME-p, SAME-BIT-LENGTH-N, GENERIC D_0. The cheap fallback\
    \ when\n    NULL-1 cannot be found at a given p. Weaker, and every use of it must\n    say which\
    \ of the two was used.\n  NULL-3 THE WITHHELD-ENDOMORPHISM ARM. The SAME j=0 curve, the SAME\n\
    \    instance, with phi denied to the algorithm. This separates two things\n    every L3 measurement\
    \ conflates: \"being a curve with small |D_0|\" and\n    \"using the automorphism\". Predicted:\
    \ NULL-3 is statistically\n    indistinguishable from NULL-1 on every functional. If it is NOT,\
    \ then\n    something about j=0 curves is affecting the measurement WITHOUT the\n    automorphism\
    \ being used, which is either a curve-generation confound or\n    the lane's only genuine finding\
    \ - and either way it must be resolved\n    before anything else in L3 is believed.\n  NULL-4\
    \ THE SIXTH-POWER REPRESENTATION NULL, AND IT IS THE SHARPEST\n    INSTRUMENT IN THE BATCH. Over\
    \ F_p, the curves y^2 = x^3 + b and\n    y^2 = x^3 + u^6 b are F_p-ISOMORPHIC for every u in F_p^*,\
    \ via\n    (x,y) -> (u^2 x, u^3 y). They have the same j, the same D_0, the same\n    group order,\
    \ the same N, and an ECDLP instance on one transports to the\n    other in O(log p) with the same\
    \ k. THEREFORE ANY INTRINSIC COST\n    FUNCTIONAL MUST TAKE THE SAME VALUE ON BOTH. A measured\
    \ difference is\n    proof that the instrument is reading the REPRESENTATIVE (a,b) rather\n  \
    \  than the curve, and it voids the measurement outright. The analogous\n    null at j=1728 is\
    \ a -> u^4 a. Note the arithmetic that makes this\n    non-vacuous: for p congruent to 1 mod 3\
    \ the sixth powers have index 6 in\n    F_p^*, so b ranges over a coset of size (p-1)/6 within\
    \ its isomorphism\n    class and the null has plenty of room; the SIX cosets are the six sextic\n\
    \    twists and they are genuinely different curves in different isogeny\n    classes, which is\
    \ the distinction the null tests the instrument's ability\n    to make.\n\n(C) THE DECAY LADDER,\
    \ WHICH IS WHAT TURNS A COMPARISON INTO A CONTROL. docs/inventor-protocol.md section 3 requires\
    \ naming the parameter whose increase must destroy the signal. For this lane that parameter is\
    \ |D_0|, and the ladder is the nine class-number-one discriminants {3, 4, 7, 8, 11, 19, 43, 67,\
    \ 163}, then a class-number-two rung, then generic. ANY QUANTITY CLAIMED TO ARISE FROM \"SMALL\
    \ |D_0|\" MUST DECAY ALONG THAT LADDER. The canonical artifact tell for L3 is a quantity that\
    \ is FLAT across |D_0| = 3 to 163 and then JUMPS at generic: such a quantity is not tracking |D_0|\
    \ at all, it is tracking \"this curve was built by the CM method rather than by pseudorandom search\"\
    , which is a property of the generation procedure and not of the curve. That confound is specific\
    \ to this lane, it is easy to fall into because CM curves are generated differently from random\
    \ ones, and no other L3 proposal can detect it alone. SECOND LADDER, ORTHOGONAL: |Aut|, which\
    \ takes only the values 2, 4, 6 over prime fields with p > 3. A quantity claimed to come from\
    \ the automorphism must be monotone in |Aut| across {generic, j=1728, j=0}; three points is few,\
    \ but a non-monotone profile across three families with a predicted monotone law is decisive.\n\
    (D) THE CALIBRATION THIS PROPOSAL ALSO FIXES, BECAUSE NOTHING ELSE DOES. KN-TECH-018 records the\
    \ rho discount as sqrt(|Aut|). But this program's baseline convention is 0.886*sqrt(N) and KN-TECH-006\
    \ states that this convention ALREADY INCLUDES the sqrt(2) from negation. Therefore the EXTRA\
    \ discount available at special j, measured against the program's own baseline, is\n  sqrt(|Aut|/2)\
    \ = sqrt(3) = 1.732 for j=0, and sqrt(2) = 1.414 for j=1728,\nNOT sqrt(6) and sqrt(4). Quoting\
    \ sqrt(6) against an already-negation- discounted baseline double-counts negation and overstates\
    \ the j=0 advantage by a factor sqrt(2). This record pins the number by measurement, and it can\
    \ do so without stepping on H-RHO-bc6ea6, which explicitly places j in {0, 1728} OUT OF SCOPE\
    \ - so the j=0 and j=1728 rho constants are UNMEASURED in this program and there is no duplication.\
    \ THIS PROPOSAL CLAIMS NOTHING BEYOND THAT CONSTANT and is filed as baseline calibration plus\
    \ instrumentation, never as an attack."
  resource_label: '"audit: consumes no resource". This is a control and instrument proposal. It mounts
    no attack, consumes no R1-R8 resource, and exists so that the other L3 proposals'' negatives are
    citable and their positives are challengeable.'
  admissibility: admissible
  admissibility_argument: 'Instrumentation is not subject to the admissibility filter because it names
    no mechanism to escape the generic group with. Its own outputs are matched baselines and null
    objects, not advantages. Note the one place it touches the filter substantively: NULL-3, the withheld-endomorphism
    arm, is a DIRECT operationalisation of H-ENDO-001''s scalar-action argument - if knowing phi confers
    nothing beyond the automorphism-quotient constant, then NULL-3 and the full j=0 arm must differ
    by exactly that constant and by nothing else. Measuring that difference is the cheapest empirical
    check on an argument the entire campaign leans on.'
  reachability_gate: 'APPLICABLE IN A LIMITED SENSE AND IT SHAPES THE NULL. T4 says j=0 requires D_0
    = -3 and that no curve outside such a class can be walked to one, so the null arms cannot be constructed
    by isogeny walking from the special arm - they must be constructed independently at the same p.
    That is why claim (A)''s impossibility matters operationally: the two arms are not related by
    any map at all, so every controlled variable has to be matched by search rather than by transport,
    and the search cost is a reported deliverable. T5''s reachability question does not arise because
    no walk is performed.'
  inputs:
    procedure: 'CHEAPEST VALID DISCRIMINATOR: STEP 2, THE SIXTH-POWER GATE, AND IT COSTS MINUTES.
      Take one existing j=0 toy instance, generate two isomorphic presentations with u1^6 b and u2^6
      b, transport P and Q, and run every functional the lane intends to use on all three. If any
      discrete-valued functional differs, the lane''s entire instrument is reading coefficient representatives
      and every L3 number - past or future - is void until fixed. This costs almost nothing, it can
      be run before any other L3 work is dispatched, and it is the single highest-leverage test in
      the batch because it can invalidate seven other proposals at once. Step 1''s search and Step
      5''s rho calibration are the next cheapest.'
    mechanism: 'STEP 1 (search, low compute, and it produces a reusable asset). At each declared field
      size, search for NULL-1 pairs: same p, same prime N, different cofactor, one arm with D_0 =
      -3 (or -4) and one with generic D_0. Record the search cost and yield rate - which is itself
      a reportable number, because if NULL-1 pairs are very rare at toy scale then every future L3
      record must use NULL-2 and say so. Freeze the found pairs as a named instance set that later
      experiments cite rather than regenerate.

      STEP 2 (NULL-4, minutes, and it should be run FIRST on any new instrument). For each declared
      j=0 curve, generate three isomorphic presentations b, u1^6 b, u2^6 b, transport P and Q through
      (x,y) -> (u^2 x, u^3 y), and run the full measurement pipeline on all three. Assert exact equality
      of every intrinsic functional and of the recovered k. THIS IS A ZERO-COST GATE AND IT SHOULD
      BLOCK EVERY OTHER L3 RUN: an instrument that reports different Groebner solving degrees, different
      relation yields or different rho step counts for b and u^6 b is measuring the integer size of
      the coefficients and nothing else, and every number it has produced is void.

      STEP 3 (the ladder). Build instances at |D_0| in {3,4,7,8,11,19,43,67,163}, at a class-number-two
      rung, and at generic, all at matched p where possible and at matched N bit-length otherwise.
      This requires CM-method curve construction at toy scale, which is feasible: for small |D_0|
      the Hilbert class polynomial is degree 1 or 2 and its roots mod p give j directly, and the curve
      is recovered from j by the standard formula with the twist chosen by point counting. Record
      the construction cost per rung.

      STEP 4 (NULL-3). For every j=0 and j=1728 instance, run each functional twice: once with phi
      available to the algorithm and once with it withheld. "Withheld" must be enforced structurally
      (the arm does not receive lambda or zeta and cannot compute them) and audited, not merely intended.

      STEP 5 (the rho calibration of claim (D)). Measure rho step counts on the three families at
      three sizes with a common walk, common escape rule and common cost unit (F_p multiplications,
      with the curve model named). Report the measured ratio to 0.886*sqrt(N) for each family. Predicted
      1.00 (generic), 1/sqrt(2) = 0.707 (j=1728), 1/sqrt(3) = 0.577 (j=0), each within a pre-registered
      band. Report BOTH the step-count ratio and the multiplication-count ratio, because the escape-rule
      overhead at |Aut| = 6 is unmeasured in this program (IDEA-20260807-f00729 forward guidance G3)
      and could make the realised constant materially worse than sqrt(3).

      STEP 6 (the deliverable). One frozen instance set, one gate script (Step 2), one ladder, and
      one table of measured null differences per functional. Every later L3 record cites this instead
      of building its own.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - META-NULL-A: different primes in the two arms, which must show a difference
  - META-NULL-B: u^2 b (a genuine twist), which must show a difference
  - matched Pollard rho with negation on every instance
  - matched BSGS on every instance
  - planted-signal cross-check against IDEA-20260807-bfa86b, so that the instrument is shown to detect
    a real weakness as well as to reject fakes
  - certificate re-verification of every recovered logarithm
  - "NULL OBJECT (from the proposal): THIS PROPOSAL IS THE NULL OBJECT CONTROL, so the field records\
    \ the control ON THE CONTROL - the instrument must be shown able to FAIL, or its passes mean nothing.\
    \ META-NULL-A: deliberately break the matching in a known way (use a different\n  p in the two\
    \ arms) and confirm the pipeline reports a difference. An\n  instrument that reports \"no difference\"\
    \ between arms at different primes is\n  not measuring anything.\nMETA-NULL-B: deliberately break\
    \ NULL-4 by using u^2 b instead of u^6 b (a\n  DIFFERENT curve, a sextic twist, not an isomorphic\
    \ presentation) and\n  confirm the pipeline reports a difference. This is the sharpest test that\n\
    \  the instrument distinguishes isomorphism from twisting, which is the exact\n  distinction the\
    \ lane needs.\nDECAY PARAMETER for the meta-nulls: the size of the deliberate break. A\n  pipeline\
    \ whose reported difference does not grow as the break is made\n  larger is insensitive and its\
    \ nulls are vacuous."
  independent_variables: []
  metrics:
    primary:
    - NULL-1 search cost and yield rate per field size
    - the frozen instance set: (p, a, b, N, cofactor, D_0, h(D_0), |Aut|, twist)
    - every functional on every null arm, with seeds and confidence intervals
    - rho cost in steps AND in F_p multiplications, per family, per size
    secondary:
    - measured ratio to 0.886*sqrt(N) with its pre-registered band
    - pass/fail of NULL-4 as a blocking gate, per instrument
    - pass/fail of META-NULL-A and META-NULL-B
    - the full |D_0| ladder profile for every functional the lane measures
  heuristic_under_test: null
  preregistered_prediction:
    quantity: existence of a same-p, same-N, same-cofactor pair with different D_0, by exhaustive
      search at small p
    formula: ZERO such pairs, at every p searched. A single such pair falsifies claim (A) and, since
      (A) is a two-line derivation from T4, would indicate an error in the search rather than in the
      mathematics - so it halts the line for audit rather than being reported.
    source: pre-registered in IDEA-20260807-a3d644 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - CURVE-GENERATION PROCEDURE. CM curves are constructed from j; generic curves are found by random
    search. Any measured difference could be a difference of PROCEDURE rather than of curve. The ladder
    in (C) is the only defence and it is why the ladder is mandatory rather than nice to have.
  - COFACTOR. NULL-1 arms necessarily have different cofactors, so any functional that depends on
    the cofactor - notably anything touching the full group rather than G - is confounded. Such functionals
    must use NULL-2 or NULL-3 instead and the choice must be recorded per functional.
  - TWIST SELECTION. The six sextic twists of a j=0 curve are different curves in different isogeny
    classes with different traces. Choosing the twist by "whichever has a large prime factor" introduces
    a selection effect on N that the generic arm does not experience. Twist selection policy is frozen
    and reported.
  - SMALL-p ARITHMETIC. At p below 2^12 the number of curves is small enough that "generic D_0" is
    not generic. The generic arm's D_0 distribution is reported, not assumed.
  - ESCAPE-RULE COUPLING IN STEP 5. The rho constant at |Aut| = 6 depends on the fruitless-cycle escape
    rule, which is unmeasured here for r > 1. A single escape rule is frozen across families so the
    comparison is fair, and the resulting constant is scoped to that rule and to nothing else.
  - MULTIPLE COMPARISONS. Sweeping 11 discriminant rungs times several functionals invites false positives.
    The decision rule is the LADDER SHAPE (monotone decay), not any single rung's significance, and
    that rule is pre-registered here.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: ZERO such pairs, at every p searched. A single such pair falsifies claim (A)
    and, since (A) is a two-line derivation from T4, would indicate an error in the search rather
    than in the mathematics - so it halts the line for audit rather than being reported.
  falsification_criterion:
  - 'NULL-4 fails: b and u^6 b give different discrete-valued functionals. The instrument is void
    and no L3 measurement may proceed until it is repaired. This is the strongest possible negative
    outcome for the lane and it is also the cheapest to find.'
  - 'META-NULL-A or META-NULL-B fails: the pipeline reports no difference where one certainly exists.
    The instrument is insensitive and its nulls are vacuous.'
  - An exact same-(p, N, cofactor) cross-D_0 pair is found. Claim (A) is wrong; audit the search before
    reporting anything.
  - NULL-3 differs significantly from NULL-1. Either a curve-generation confound or a genuine finding;
    requires replication before interpretation and blocks the lane's other conclusions until resolved.
  - Measured j=0 rho cost falls below 0.40 x 0.886*sqrt(N). The discount exceeds KN-TECH-018's ceiling
    and everything else in the run set is suspect.
  - NULL-1 pairs cannot be found at any tested size within budget. That is an infrastructure/searchability
    outcome, not negative mathematical evidence (AGENTS.md rule 5); the lane falls back to NULL-2
    and records that it did.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-a3d644
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
