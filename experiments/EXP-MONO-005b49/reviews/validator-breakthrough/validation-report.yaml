      detail: 6(tau-1)/N recomputed from my own independently counted N and tau; 0.031034482758620686 and 0.005 exactly.
    - check: bounded search cannot certify a global property
      result: pass_with_note
      detail: >-
        Cell 2's Stage 0 correctly reports a FIRST match under a fixed
        ascending scan and does not shop for a better one; the scan order is
        declared in the raw file and the search range is disjoint from cell 1's.
        Note that the disjoint, strictly higher range guaranteed a larger N and
        therefore lower power a priori under a fixed n_tuples design -- already
        raised as OBJ-J3-2 by the prior red team, and I confirm the arithmetic
        (N ratio 3600/580 = 6.207 vs variance ratio 6.70).
    - check: quantifier fidelity -- per-instance witnesses not presented as uniform
      result: fail
      detail: >-
        The claim as it will be read is "CM curves differ from ordinary curves
        at matched (N,tau)". The evidence is two instances, one of which is
        90% carried by a single arm of a single curve (FB3, FB5), and the
        lane's own 100-instance sample bounds any such uniform effect at ~1.8%
        rather than 15.6% (FB4). Two per-instance observations are not a
        uniform witness.

  # =====================================================================
  # INDEPENDENT RECOMPUTATION (required by the breakthrough-tier brief)
  # =====================================================================
  independent_recomputation:
    recomputed_by_me_from_raw_artifacts:
      - all eight raw counts, including inverting cell 1's transversal rates to integers and confirming them against the upstream primary source
      - both cells' P1, P2, P3, log P3
      - all four per-arm log-ratio variances and both cell standard errors
      - both cells' z and two-sided p
      - the inverse-variance weights, weight share, pooled log-ratio, pooled variance, pooled se, pooled z, pooled two-sided p, and the 95% CI on the pooled ratio
      - Cochran's Q and its p-value
      - Fisher's combined probability test
      - cell 2's power against cell 1's observed effect (13.95%)
      - every archived Fisher-exact p-value in the chain
      - the A/B decomposition of both cells and per-component heterogeneity tests
      - overdispersion bounds phi for all eight arms
      - the pooled estimate under phi_min and phi_max
      - the 100-cell exact conditional-binomial pooled ratio, its exact CI, leave-one-out range, and unweighted per-cell alternative
      - the 202-measurement empirical null of SE-deviations
      - N, tau, j-invariant, non-singularity, Hasse and supersingularity for all four curves
      - the specification.yaml sha256
      - the entire JB1 Monte Carlo
    re_verified_with_a_disjoint_checker:
      - checker: my own hypergeometric two-sided Fisher exact (log-gamma binomials, "sum of tables no more likely than observed")
        lineage: written for this task; agrees with scipy.stats.fisher_exact to ~1e-11 on all four archived tables
      - checker: my own normal upper tail via a Lentz continued-fraction / series incomplete gamma Q(1/2, z^2/2)
        lineage: written for this task, shares no code with math.erfc or scipy; agrees on the pooled p to 4e-17
      - checker: naive O(p) point count + explicit cubic root enumeration for N, tau and j
        lineage: written for this task; shares no code with any producer script. Confirms the matched-cell structure independently of the producer's construct_ordinary / construct_cm_j0 / construct_cm_j1728.
      - checker: exact conditional-binomial (scipy binomtest) for the 100-cell pooling
        lineage: chosen precisely because it is NOT the producer's delta method and because it handles the 16 zero-count cells a log-ratio drops
    taken_on_the_producers_word:
      - id: TW1
        item: The eight raw counts themselves as measurements.
        why: >-
          The handoff sets budget.maximum_runs = 0, so I did not execute
          anything. I note that re-executing the producer's own script would in
          any case not be an independent check -- agents/validator.md is
          explicit that recomputing with the producer's implementation
          reproduces a wrong-but-self-consistent implementation faithfully.
          What I could do without a run, I did: I verified every count against
          its archived rate, against every other archived copy of it, and
          against the upstream primary source, and I verified the curves the
          counts were measured on with a disjoint checker.
      - id: TW2
        item: That the m=4 root-multiplicity collision criterion is implemented as specified.
        why: >-
          Not re-implementable from the archived artifacts alone; the
          construction ("3 drawn points, 4 canonical sign classes") is named in
          specification.yaml but its collision predicate is defined only in
          code. I did NOT read the implementation, both because JB2 required
          blindness and because reading it would not have made this
          independent. Consequence: I can bound phi from the archived S and C
          but cannot derive it, which is exactly why FB1 ends in a bound rather
          than a value.
      - id: TW3
        item: That the corrected group-uniform sampler is 1/N-uniform.
        why: >-
          Verified by two prior reviewers via disjoint Monte Carlo methods per
          the lane's records, and the chi-square spot-check archived in
          RUN-MONO-cb905d-2 (stat/df = 0.981 and 0.896, no point unobserved,
          category ratios ~1.0) is consistent with it. I did not re-derive the
          uniformity proof; it is outside my joints and was not challenged.
      - id: TW4
        item: That these artifacts sit on a Coordinator-committed snapshot.
        why: My dispatch instruction forbade git invocation. Content-verified only. See FB6.
      - id: TW5
        item: The narrative order of the six looks.
        why: >-
          Reconstructed from ledger records (status_note_2026_09_04 and _b,
          CORR-20260904-d0205d, DEC-20260831-7b44fe, and the two prior review
          plans). I read no session transcript, so my model of WHEN each choice
          was made rests on those records being accurate about their own
          chronology. They are internally consistent and I found no
          contradiction, but this is testimony rather than measurement, and it
          is the input on which JB1's pi parameter depends. This is precisely
          why I swept pi rather than fixing it.

  artifact_hashes_computed_this_session:
    note: Content anchors, offered because FB6 leaves RUN-MONO-cb905d-2 without one.
    experiments/EXP-MONO-005b49/specification.yaml: b190215b156c11fd3f4c8a42f2e77df748689a1ca9d19dde51c31b5cb78246c9

  limitations:
    - >-
      NOT DEGRADED. Both owned joints were completed at full rigor. Where I
      could not close something I have said so by name (TW1-TW5) rather than
      substituting an estimate.
    - >-
      JB2's blindness is partial in two disclosed respects: the target values
      were stated to me in the dispatching message, and cell 2's raw file
      embeds the producer's own derived stage2 block. Cell 1's log-ratio and
      the pooling step are genuinely blind, since neither appears in any raw
      file.
    - >-
      JB1's pi parameter is unobservable in principle. No simulation can
      recover a counterfactual about what a reviewer would have done. This is
      why the answer is a range with the evidence for each end laid out, and
      why the single figure I nominate (0.1026) is the one that charges only
      what the records themselves establish.
    - >-
      phi is bounded, not determined. Both endpoints of [1.49, 2.65] are
      attainable by a law consistent with the archive; the true value needs one
      extra archived field. The headline p therefore lies in [0.0207, 0.0581]
      and I cannot narrow it further from the artifacts as they stand.
    - >-
      The 100-cell reference is cross-prime, which the archive itself discloses
      as a field/characteristic confound. It is a valid upper bound on a uniform
      CM effect and a valid null distribution of the same shape; it is not a
      same-prime replication.
    - >-
      No git operation was performed, on explicit instruction. Commit
      reachability, dirty state, and snapshot binding are unverified for all
      four runs.
    - >-
      I did not adjudicate the j=0 vs j=1728 confound, the transversal-arm
      reuse risk, or what an accepted result would establish. Those are JB3 and
      JB4.

  what_would_close_this:
    ordered_by_information_per_unit_compute:
      - id: R1
        cost: zero marginal (one 8-second re-run of an already-written script)
        action: >-
          Archive the per-tuple pair-count histogram (or just sum k^2) for
          every arm. This converts FB1 from a bound to a value and settles
          whether the headline p is 0.021, 0.030 or 0.058. Nothing else on this
          list is cheaper or more decisive.
      - id: R2
        cost: minutes
        action: >-
          Re-analyse the 100 archived cells as the primary evidence rather than
          as exploratory context. They already contain ~40x the information of
          the two headline cells on the same question, and they are already
          paid for. Whatever this lane concludes about a CM effect should be
          anchored there, at ~1.8-3.7%, not at 15.6%.
      - id: R3
        cost: ~80 seconds of compute
        action: >-
          Re-run cell 2 at n_tuples ~= 209000 (the prior red team's own figure
          for 80% power at cell 1's effect) at the SAME already-found cell
          p=3541. A properly powered second cell replaces the pooling step
          entirely and retires FB2 and FB3 at once.
      - id: R4
        cost: a Stage-0 search
        action: >-
          A third same-prime cell with the CM variant HELD FIXED, with the
          combination rule and the variance model declared before the run.
          This is the only route that produces a genuinely pre-registered
          confirmatory test.

  recommendation_to_the_coordinator:
    note: Advisory only. I change no status; closure remains a committed Coordinator decision naming the criterion met (AGENTS.md rule 13).
    on_the_prior: >-
      The Coordinator's recorded prior -- "probably a genuine, if modest,
      signal", held at low-to-moderate confidence, with sequential
      alpha-inflation flagged as explicitly unassessed -- is the closest of the
      three priors in this lane's history to what the evidence supports, and
      its self-flagged gap (a) is exactly where the claim breaks. The prior is
      not overturned so much as sharpened: there does appear to be a genuine,
      MODEST signal, and the archive already measures it at ~1.8-3.7% rather
      than 15.6%. The prior's item (c) -- correlated blind spots from repeated
      self-involvement -- is corroborated: the two defects I found (FB1, FB4)
      were both available in the archive throughout and were missed by every
      round, and FB4 in particular is a control the lane itself generated and
      then filed as "exploratory context only".
    on_advancement: >-
      Do not advance H-MONO-1d50ac on this pooled statistic. The procedure's
      true error rate is ~10%, the honest adjusted p is ~0.048, the effect size
      is contradicted by the lane's own better-powered archive, and one variance
      term the artifacts cannot close spans the 0.05 boundary by itself.
    on_not_closing_either: >-
      Equally, do not read this as a negative result. Per
      docs/inventor-protocol.md, premature closure is a failure mode symmetric
      with overclaiming, and FB4 is the strongest positive evidence in this
      lane's history: a consistently-signed CM excess on 49491 colliding pairs
      across 100 independent matched cells, whose exact 95% CI excludes 1.0 at
      its lower edge. The correct next action is R1 then R2 -- both nearly free,
      both decisive -- not a third borderline cell and not a closure.

