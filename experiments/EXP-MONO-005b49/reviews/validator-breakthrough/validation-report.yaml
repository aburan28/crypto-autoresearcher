    - id: FB7
      severity: low
      title: The contract's own declared route to replication-grade evidence was not met
      target: experiments/EXP-MONO-005b49/specification.yaml claim_ceiling.what_no_outcome_can_support
      finding: >-
        The frozen contract states: "A significant result at a SECOND cell,
        combined with the first, would be genuine replication-grade evidence
        for an endomorphism-ring-linked effect". The second cell's
        pre-registered test was not significant (p=0.5410). The pooled
        statistic is a different, unregistered route to the same conclusion.
        The prior red team is right that "replication failed" is the wrong
        reading given ~14% power -- but the correct reading is that the
        contract's declared bar was not cleared and its own declared
        alternative (an underpowered null) is uninformative, which is a third
        state, not the first.
      cross_check_of_the_power_claim: >-
        I independently reproduced the prior red team's power figure from
        cell 2's own se: ncp = 0.150422/0.173520 = 0.8669, power =
        1-Phi(1.95996-0.8669) + Phi(-1.95996-0.8669) = 13.95%. Confirmed.

