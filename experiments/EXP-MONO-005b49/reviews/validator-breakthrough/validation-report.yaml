  # =====================================================================
  # JB1 -- SEQUENTIAL INFERENCE VALIDITY
  # =====================================================================
  JB1_sequential_inference_validity:
    verdict: breaks
    question_as_posed: "Does the procedure's own actual error rate materially exceed 5%?"
    answer: >-
      Yes. Roughly 10% under the model that is most generous to the lane while
      still charging what demonstrably happened; 6.6% under the single most
      charitable model that charges nothing but the variance mis-specification;
      23% under a stop-at-first-significant reading. Every one of these
      materially exceeds 5%.

    what_the_procedure_actually_was:
      note: >-
        Reconstructed from ledger records, not from the dispatching message's
        five-step precis. The actual chain is SIX analytic occasions on
        substantially one signal, not five, and the extra one matters because
        it is a prior look at the very counts that dominate the pooled result.
      L1:
        what: EXP-MONO-64aaa4 / RUN-1 -- two-sided Fisher exact on the p=617 TRANSVERSAL arm
        table: [613, 19387, 679, 19321]
        archived_p: 0.06598219371661383
        outcome: not significant; lane recorded `inconclusive` (DEC-20260831-7b44fe)
      L2:
        what: post-hoc alternative framings of the SAME table (one-sided Fisher, one-sided two-proportion z)
        archived_p_range: "[0.029, 0.033] per H-MONO-1d50ac status_note"
        my_recomputation: "one-sided Fisher = 0.032991; two-proportion z two-sided = 0.061963, halved = 0.030981 -- both inside the archived range, confirming these were one-sided reframes"
        outcome: significant, recorded, NOT adopted as headline
      L3:
        what: EXP-MONO-cb905d / RUN-2 -- Fisher exact on the p=617 GROUP-UNIFORM any-collision table
        table: [1049, 18951, 1005, 18995]
        archived_p: 0.32999478969615775
        outcome: not significant; archived as the headline
      L4:
        what: CORR-20260904-d0205d -- L3 declared mis-specified; log ratio-of-ratios on PAIRS constructed and applied to the same cell-1 data
        p: 0.0248
        outcome: significant; adopted, reversing the archived headline
      L5:
        what: EXP-MONO-005b49 / RUN-1 -- the L4 statistic pre-registered and run at a second cell (p=3541)
        p: 0.5410
        outcome: not significant
      L6:
        what: TASK-20260904-904394 joint J4 -- cross-cell combination; TWO rules named in the plan and BOTH computed
        L6a_IVW_pooled: 0.020673
        L6b_Fishers_method: 0.0713
        outcome: the rules disagree across alpha=0.05; the significant one was adopted
      uncounted_additional_look: >-
        EXP-MONO-cb905d / RUN-1 part_a also produced a group-uniform headline
        (Fisher p=0.4879) under the sampler later found biased
        (CORR-20260831-ba2118). I do NOT include it in the simulation because
        its null distribution under the corrected sampler is not
        reconstructible from the archive. Its omission makes every FPR below a
        LOWER bound.

    faithfulness_of_the_model:
      instruction_honoured: >-
        The dispatching brief correctly warned me not to assume a worst-case
        "re-test until significant" model if it does not describe what
        happened. It does not describe steps L4 and L6, and I have not assumed
        it. Instead of picking a model I parameterised the thing that is
        genuinely unobservable -- whether a correction would have been made had
        the preceding answer been favourable -- and swept it.
      pi_parameter: >-
        pi = P(the correction is made even when the preceding look was already
        significant). pi = 1 means the correction is objective and forced, the
        procedure never stops early, and only the terminal statistic is ever
        reported. pi = 0 means each correction happens only because the
        previous answer displeased. The truth is unobservable; the FPR is
        reported across the whole range.
      what_the_evidence_says_about_pi:
        argues_for_high_pi:
          - >-
            The L3->L4 test-mismatch was found by an INDEPENDENT reviewer under
            a joint (TASK-20260904-bb2f29 J4) that was assigned in a review
            plan written BEFORE that reviewer ran, and whose brief was
            literally to challenge whether the chosen test was the right one.
            A scheduled audit is not an opportunistic look.
          - >-
            The defect is objective and checkable without any p-value: the test
            used tuples_with_collision while P1/P2 are defined on
            total_pairs_colliding divided by each curve's own transversal rate.
            Anyone could confirm it blind to the outcome.
          - >-
            The lane never actually stopped early. At L2 it had a significant
            reframe in hand and declined to adopt it. That is documented
            restraint and it is the single strongest argument for high pi.
          - >-
            The cell-2 power deficit (~14%) is likewise an objective property
            of the design, computable before any result.
        argues_for_low_pi:
          - >-
            The L3->L4 correction is not a unique repair. It made three
            coupled choices at once -- pairs not tuples, ratio-to-own-baseline
            not direct comparison, Poisson delta method not a clustered or
            exact variance -- and the combination adopted is the one that moved
            p from 0.330 to 0.0248. The nearest alternative "corrected" test,
            a log-rate comparison on the group-uniform PAIR counts alone
            (1470 vs 1405), gives z=1.212, p=0.226: still not significant. The
            significance is created by the second choice, not the first.
          - >-
            DECISIVE for L6: TASK-20260904-904394's joint J4 named BOTH
            candidate combination rules in advance ("Fisher's combined
            probability test, or a direct pooled log-ratio estimate"), the plan
            was written AFTER both cell results were known, the plan's own text
            anticipated that a meta-analysis "would show a combined, more
            powerful test that IS significant", both rules were computed, they
            straddled 0.05, and the significant one was adopted. The efficiency
            argument for IVW over Fisher's method is correct and standard --
            but it was not declared before it was known which rule won. This is
            a genuine post-hoc selection among a declared menu of two and I
            charge it regardless of pi.
          - >-
            Prior review already flagged the multiplicity in prose. EV-MONO-c0bf6d
            records "NO MULTIPLICITY CORRECTION HAS BEEN APPLIED ACROSS" the
            successive headline statistics; no round has quantified it until now.

    method:
      kind: monte_carlo_simulation_of_the_executed_procedure_under_a_true_null
      script_retained: /private/tmp/.../jb1/{sim.py,sim2.py,final.py} (scratch; reproduced in full below)
      generative_model: >-
        T=20000 iid tuples per curve per arm. Each tuple yields X colliding
        pairs, X in {0,1,2,3,6} (the only pair-counts an equivalence relation
        on 4 items can realise; 6 = C(4,2) is the same 6 that appears in Part
        B's closed form 6(tau-1)/N). C = #{X>=1} ~ Binomial(T, q); S = sum X.
        The archive gives BOTH S and C for every arm, hence mu = S/C, so the
        clustering is measured, not assumed. Two extremal laws for X | X>=1
        reproduce a given mu: LOW (X in {1,2}, P(2)=mu-1) and HIGH (X in {1,6},
        P(6)=(mu-1)/5). LOW is the headline because it UNDERSTATES clustering,
        so every FPR below is a lower bound with respect to that nuisance.
      null: >-
        "No real per-curve difference exists" in the sense the research
        question means it: within each cell the CM and ordinary curves have
        IDENTICAL arm rates, which is exactly H-MONO-45183a Part B's
        (N,tau)-only completeness. Arm levels are set to the observed ord/cm
        averages so a simulated experiment carries the same information as the
        real one. Per-arm mu is preserved, since clustering is a property of
        the sampler and not of the effect.
      tests: >-
        L1/L2/L3 use true Fisher exact (my own from-scratch hypergeometric
        implementation agrees with scipy to ~1e-11; scipy used in the loop for
        speed). L4/L5 use the pre-registered delta-method Wald exactly as
        specification.yaml states it. L6a/L6b as the archive computes them. All
        six looks are computed from the SAME simulated tuples, so their
        realistic correlation is induced rather than assumed.
      calibration_before_use:
        note: Every look's implementation was validated against its archived historical value BEFORE any simulation was run.
        L1_archived: 0.06598219371661383
        L1_mine:     0.06598219372032185
        L3_archived: 0.32999478969615775
        L3_mine:     0.3299947896876386
        cell2_diagnostic_fisher_archived: 0.3984132644540982
        cell2_diagnostic_fisher_mine:     0.398413264462838
        L4_mine: {z: 2.2444200889005512, p: 0.02480538517105861}
        L5_mine: {z: 0.6112296513732004, p: 0.5410475560166701}
        L6a_mine: {z: 2.3139031514128234, p: 0.020673035218915135}
        L6b_mine: {chi2: 8.62188521095142, p: 0.0712775925586039, red_team_reported: "chi2=8.622, p=0.0713"}

    results:
      monte_carlo_n: 400000  # for the headline table; 40000 for the pi sweep and ladder (exact Fisher in the loop)
      table_marginal_fpr_of_each_look_in_isolation:
        note: alpha=0.05, one test only, n=40000, +-0.001
        L1_fisher_transversal:        {clustered: 0.0476, unclustered_control: 0.0467}
        L2_post_hoc_one_sided:        {clustered: 0.0960, unclustered_control: 0.0942}
        L3_fisher_group_uniform:      {clustered: 0.0470, unclustered_control: 0.0468}
        L4_cell1_log_ratio:           {clustered: 0.0659, unclustered_control: 0.0447}
        L5_cell2_log_ratio:           {clustered: 0.0684, unclustered_control: 0.0492}
        L6a_IVW_pooled:               {clustered: 0.0654, unclustered_control: 0.0461}
        L6b_fishers_method:           {clustered: 0.0736, unclustered_control: 0.0446}
        reading: >-
          L1 and L3 are exact Fisher tests on a correctly-specified binomial
          statistic and return ~0.05 or below in BOTH columns -- the machinery
          is calibrated. L4/L5/L6a return ~0.05 in the unclustered control but
          0.065-0.068 on the real data: the excess is entirely the variance
          mis-specification, isolated. L2 returns ~0.10, i.e. a post-hoc
          one-sided reframe doubles alpha exactly as it must.

      table_headline_fpr:
        note: n=400000, +-0.0005
        unclustered_control_single_IVW_test:                 0.0455
        real_minimum_clustering_single_IVW_test:             0.0656
        real_minimum_clustering_terminal_min_of_two_rules:   0.1026
        real_maximum_clustering_single_IVW_test:             0.1077
        real_maximum_clustering_terminal_min_of_two_rules:   0.1711
        full_six_look_chain_pi_1:                            0.0654
        full_six_look_chain_pi_0.5:                          0.1641
        full_six_look_chain_pi_0:                            0.2261

      table_procedure_adjusted_p_for_the_reported_0.020673:
        note: >-
          P(under the null, the procedure reports a headline p-value at least
          this small). This is the number that replaces 0.020673 once the
          procedure is charged.
        unclustered_control_IVW_only:                        0.0182
        real_min_clustering_IVW_only:                        0.0296
        real_min_clustering_with_rule_choice:                0.0478
        real_max_clustering_with_rule_choice:                0.0957
        full_six_look_chain_pi_1:                            0.0307
        full_six_look_chain_pi_0:                            0.0686
      nominal_alpha_needed_for_a_true_5pct_fpr:
        pi_1: 0.0367
        pi_0: 0.0083

      most_defensible_single_estimate:
        model: >-
          pi = 1 throughout (full credit: both corrections objective, the lane
          never stopped early, and it demonstrably declined to adopt the L2
          reframe), MINIMUM clustering consistent with the archive, and the ONE
          charge that survives any reading of pi -- that the terminal
          combination rule was selected post-hoc from the two the plan named
          and that were both computed.
        true_false_positive_rate: 0.1026
        monte_carlo_ci95: [0.1016, 0.1036]
        procedure_adjusted_p_for_the_reported_headline: 0.0478
        plain_statement: >-
          The procedure that produced p=0.020673 rejects a true null about
          10% of the time, roughly twice its nominal rate, and the reported
          headline's honest procedure-level p-value is about 0.048 -- on the
          0.05 boundary rather than comfortably inside it.
        range_across_faithful_models: [0.066, 0.226]

    proves_too_much_control:
      required_by: TASK-20260904-4580e8 review_plan.proves_too_much objects[0]
      requirement_1_single_unadjusted_test_near_nominal_5pct:
        result: 0.0455 (n=400000, +-0.0005); 0.0461 at n=40000
        passes: true
      requirement_2_fpr_must_rise_with_more_adjustment_steps:
        ladder:
          k1_terminal_only:                            0.0654
          k2_plus_L4:                                  0.0862
          k3_plus_L5:                                  0.1431
          k4_plus_L3:                                  0.1724
          k5_plus_L1:                                  0.1921
          k6_plus_L2:                                  0.2240
          k7_plus_L6b:                                 0.2261
        monotone_increasing: true
        unclustered_control_ladder: [0.0461, 0.0609, 0.1032, 0.1383, 0.1587, 0.1911, 0.1921]
        passes: true
      requirement_3_must_not_be_a_rubber_stamp:
        evidence: >-
          The method separates two sources it could easily have conflated:
          holding the look-count at 1 and toggling only the clustering moves
          0.0455 -> 0.0656 -> 0.1077; holding clustering fixed and adding looks
          moves 0.0461 -> 0.1921. It also correctly returns ~0.05 for L1 and L3,
          which are correctly-specified tests inside the SAME procedure, so it
          is not simply reporting "everything here is inflated".
        passes: true
      failure_signature_not_triggered: >-
        The plan's stated failure signature -- a simulation that cannot
        distinguish a 1-step from a 5-step procedure -- does not occur:
        0.0654 vs 0.1921 in the unclustered control, 0.0654 vs 0.2240 on the
        real data.

  # =====================================================================
  # FINDINGS
  # =====================================================================
  findings:
    - id: FB1
      severity: critical
      title: >-
        The pre-registered variance model treats a clustered pair-count as a
        Poisson count of independent events, and the archive itself bounds the
        resulting understatement
      status: NEW -- not raised by any prior review round in this lane
      target: >-
        experiments/EXP-MONO-005b49/specification.yaml
        significance_test_pre_registered_before_any_draw ("var_logP1 =
        1/gu_ord + 1/tr_ord"); CORR-20260904-d0205d
        independent_reverification_by_coordinator ("Var(log rate) ~= 1/count")
      finding: >-
        S = total_pairs_colliding is a sum over 20000 iid tuples of a per-tuple
        pair count X in {0,1,2,3,6}. Var(S) = T*Var(X), and Var(log S) ~=
        phi/S with phi = Var(X)/E[X], not 1/S. The archive records both S and
        C = tuples_with_collision for every arm, and a two-point linear
        program on the convex and concave envelopes of k^2 over the realisable
        support bounds phi exactly:
        min sum k^2 n_k = 3S-2C, max = 7S-6C, phi = (sum k^2 n_k)/S - S/T.
      measured:
        cell1_gu_ord: {S: 1470, C: 1049, mu: 1.4013, phi_min: 1.4993, phi_max: 2.6449}
        cell1_gu_cm:  {S: 1405, C: 1005, mu: 1.3980, phi_min: 1.4991, phi_max: 2.6379}
        cell2_gu_ord: {S: 233,  C: 167,  mu: 1.3952, phi_min: 1.5549, phi_max: 2.6879}
        cell2_gu_cm:  {S: 201,  C: 151,  mu: 1.3311, phi_min: 1.4875, phi_max: 2.4825}
        cell1_tr_ord: {S: 613,  C: 613,  mu: 1.0000, phi_min: 0.9694, phi_max: 0.9694}
        cell1_tr_cm:  {S: 681,  C: 679,  mu: 1.0029, phi_min: 0.9718, phi_max: 0.9836}
        cell2_tr_ord: {S: 98,   C: 98,   mu: 1.0000, phi_min: 0.9951, phi_max: 0.9951}
        cell2_tr_cm:  {S: 94,   C: 94,   mu: 1.0000, phi_min: 0.9953, phi_max: 0.9953}
      asymmetry_note: >-
        phi ~= 1 on every TRANSVERSAL arm and phi >= 1.49 on every
        GROUP-UNIFORM arm. The mis-specification is confined to the arm the
        corrected statistic newly introduced. I independently confirmed the
        transversal sampler never clusters across a much wider sample: over
        168 archived transversal curve-measurements in RUN-MONO-cb905d-1
        part_b, mu ranges [1.0000, 1.0235] with median 1.0000. The
        group-uniform arm's mu of 1.33-1.40 is the outlier, and it cannot be
        produced by any independent-pairs model: under independence,
        P(2 disjoint pairs | >=1 pair) ~= q/2 ~= 0.006, against 0.33-0.40
        observed.
      effect_on_the_headline:
        phi_1_as_published:  {z: 2.3139, p: 0.0207}
        phi_min_least_clustering_the_archive_permits: {z: 2.1713, p: 0.0299}
        phi_max_most_clustering_the_archive_permits:  {z: 1.8946, p: 0.0581}
      consequence: >-
        The published number is the phi=1 corner of an interval whose other
        end is p=0.058. The claim's nominal significance is not robust to a
        variance assumption the artifacts cannot discharge. This is an
        uncharged term, and at this tier that is a finding rather than a
        footnote. It is NOT a p-hacking charge: the variance model was
        pre-registered in good faith. Pre-registering a wrong model does not
        make it right.
      remedy_is_cheap_and_concrete: >-
        The executor's own script already computes the per-tuple pair count.
        Archiving the histogram of k (or merely sum k^2) would pin phi exactly
        at zero marginal compute cost -- RUN-MONO-005b49-1 took 8.19 seconds.
        Alternatively report a cluster-robust or bootstrap variance over
        tuples. Either closes this finding outright.

    - id: FB2
      severity: critical
      title: >-
        The terminal combination rule was selected post-hoc from a menu of two
        that straddled alpha
      status: NEW as a quantified charge; flagged qualitatively as "an uncounted post-hoc look" by the prior red team
      target: ledger/handoffs/TASK-20260904-904394.yaml review_plan joint J4
      finding: >-
        J4's attack plan, written after both cell results were known, named
        "Fisher's combined probability test, or a direct pooled log-ratio
        estimate across both cells" and anticipated in its own text that a
        meta-analysis "would show a combined, more powerful test that IS
        significant". Both rules were computed. They disagree across the
        threshold: Fisher's method p=0.0713, IVW pooling p=0.0207. The
        significant one was adopted.
      acknowledgement: >-
        The stated justification -- that IVW uses effect-size and precision
        information Fisher's method discards, and is therefore more efficient
        when raw counts are available -- is CORRECT and is standard
        meta-analytic practice. I am not disputing the statistics. I am
        charging the fact that the preference was not declared before it was
        known which rule won, and that the two answers land on opposite sides
        of the only threshold anyone will read.
      consequence: >-
        Charging only this selection, and nothing else, raises the FPR from
        0.0656 to 0.1026 and the adjusted p from 0.0296 to 0.0478. This charge
        survives every value of pi, because it is not about stopping early.

    - id: FB3
      severity: high
      title: >-
        The pooled effect is a sum whose two components go in OPPOSITE
        directions in the two cells; the homogeneity check cannot see this
      status: NEW
      finding: >-
        log(P1/P2) decomposes exactly as A + B, where A = log(gu_ord/gu_cm)
        is the group-uniform contrast and B = log(tr_cm/tr_ord) is the
        transversal contrast.
      decomposition:
        cell1_p617:
          A_group_uniform: {value: +0.045225, se: 0.037310, z: +1.2122, p: 0.2255}
          B_transversal:   {value: +0.105197, se: 0.055675, z: +1.8895, p: 0.0588}
          total:           {value: +0.150422, se: 0.067021, z: +2.2444, p: 0.0248}
          share_of_total_from_B: "69.9%"
        cell2_p3541:
          A_group_uniform: {value: +0.147734, se: 0.096265, z: +1.5347, p: 0.1249}
          B_transversal:   {value: -0.041673, se: 0.144369, z: -0.2887, p: 0.7728}
          total:           {value: +0.106061, se: 0.173520, z: +0.6112, p: 0.5410}
          share_of_total_from_B: "-39.3%"
      consequence: >-
        Neither arm is significant in either cell. Cell 1's contribution is
        70% transversal-arm; cell 2's transversal arm points the other way and
        its contribution is entirely group-uniform. The "striking concordance"
        of the two totals (1.1623 vs 1.1119) is a concordance of two sums built
        from different, partly opposing parts. Cochran's Q on the TOTAL
        (Q=0.057, p=0.81) is structurally blind to this -- it sees two similar
        sums. Per-component cross-cell tests: A, Q=0.986, p=0.321; B, Q=0.901,
        p=0.343; total, Q=0.057, p=0.812. Neither component test rejects, but
        with n=2 neither has power, so this is not "no heterogeneity" -- it is
        the same low-power-null problem the prior red team correctly identified
        at J3, now one level up in the statistic it proposed.
      this_is_what_would_have_to_be_true: >-
        Per my breakthrough-tier brief: I named what would have to hold for
        the claim to be false and tested it specifically. If the pooled effect
        were one stable endomorphism-ring-linked phenomenon it should live in
        the SAME component at both cells. It does not. This does not prove the
        effect absent -- n=2 cannot -- but it removes "the two cells replicate"
        as a supporting argument at the level of mechanism.

    - id: FB4
      severity: critical
      title: >-
        The lane's own archive already contains a ~40x better-powered
        measurement of this exact question, and it excludes the claimed effect
        size while corroborating its direction
      status: NEW -- this reference has never been brought to bear on the pooled claim
      source: experiments/EXP-MONO-cb905d/runs/RUN-MONO-cb905d-1/raw-result.json part_b.cells (100 cells)
      finding: >-
        RUN-MONO-cb905d-1 part_b measured 100 FURTHER matched-(N,tau)
        CM/ordinary cells with the identical transversal construction. I
        verified none of them uses p=617 or p=3541, so they are disjoint from
        both headline cells. This is a null object of exactly the required
        shape, already paid for, and the inventor protocol's "controls before
        belief" makes running the identical measurement against it mandatory
        before a signal is believed.
      measurements:
        exact_conditional_binomial_over_all_100_cells:
          note: >-
            Both arms draw the same T=20000 tuples, so conditioning on each
            cell's total makes S_cm ~ Binomial(total, th/(1+th)). This uses
            every cell including the 16 with a zero on one side, which a naive
            log-ratio silently drops.
          total_colliding_pairs: {ordinary: 24525, CM: 24966, total: 49491}
          rate_ratio_CM_over_ordinary: 1.01798
          exact_95_CI: [1.00016, 1.03612]
          exact_two_sided_p_vs_ratio_1: 0.047946
          leave_one_out_range: [1.01553, 1.02083]
        unweighted_per_cell_mean_log_ratio:
          value: +0.03636
          se: 0.01307
          z: +2.782
          p: 0.0054
          ratio: 1.0370
        paired_deviation_from_the_N_tau_prediction:
          mean_paired_CM_minus_ord_SE_deviation: +0.3132
          se: 0.1188
          z: +2.636
          p: 0.0084
          caveat: >-
            Not robust. The sign split is 48 positive / 36 negative / 16 ties,
            so the mean is carried by a skewed tail rather than a consistent
            majority. I report it because it points the same way, and flag that
            it should not be leaned on.
      like_for_like_comparison:
        note: >-
          The 100-cell archive has only the transversal arm, so the honest
          comparison is against the 2-cell claim's own transversal component B,
          on the same scale and with the same sign convention.
          B = log(tr_cm/tr_ord) in both.
        two_cell_pooled_B:   {value: +0.086182, se: 0.051946, ratio: 1.09001, z: +1.659, p: 0.0971}
        hundred_cell_estimate: {value: +0.017822, se: 0.008991, ratio: 1.01798}
        compatible: {z: +1.297, p: 0.1947, verdict: "not formally incompatible"}
        headline_pooled_vs_hundred_cell: {z: +2.008, p: 0.0446, caveat: "different estimands -- the headline includes the group-uniform arm, the reference does not; report this comparison as indicative, not as a test"}
      how_to_read_this: >-
        Both directions honestly. (i) CORROBORATING: there IS a small,
        consistently-signed CM-above-ordinary excess in the transversal arm,
        measured on 49491 colliding pairs across 100 independent matched cells,
        of order 1.8%-3.7%. That is better evidence for a real CM effect than
        anything the two headline cells contain, and it points the same way. It
        is a reason to keep the lane open, not to close it. (ii)
        CONTRADICTING THE MAGNITUDE: the claimed pooled effect is 1.156, and
        the 100-cell exact 95% CI [1.0002, 1.0361] excludes it by roughly a
        factor of 8; the 2-cell transversal component alone (1.090) is ~5x the
        reference. That gap is the exact signature of effect-size inflation
        under selection -- cell 1's transversal contrast sits 1.57 SE above the
        100-cell estimate, an entirely ordinary fluctuation, and it is the one
        that got selected. (iii) The confounds the archive itself discloses --
        the 100 cells are CROSS-prime, so a difference could be attributed to p
        rather than to the endomorphism ring -- weaken (i) but not (ii): an
        upper bound on the effect size derived from a confounded but
        better-powered sample is still an upper bound worth 40x the
        information of the two headline cells.
      handed_to_JB3: >-
        Whether the 1.8% excess is itself explained by the extra automorphisms
        of j=0 (order 6) and j=1728 (order 4) rather than by the endomorphism
        ring's effect on Part B's closed form is a mundane-alternative question
        squarely inside JB3's brief. I measure it and stop.

    - id: FB5
      severity: medium
      title: >-
        The single 2.43-SE deviation that drives 70% of cell 1 is unremarkable
        within the lane's own measured null distribution
      finding: >-
        Against Part B's prediction 6(tau-1)/N, three of the four headline
        curves sit within 0.6 SE (my own independent point counts confirm
        6*3/580 = 0.031034 and 6*3/3600 = 0.005000 exactly): p=617 ordinary
        -0.309 SE, p=3541 ordinary -0.200 SE, p=3541 CM -0.600 SE. The
        outlier is the p=617 CM curve at +2.421 SE, and that single arm supplies
        69.9% of cell 1's log-ratio, which in turn carries 87.0% of the pooled
        weight. Across the 202 comparable curve-measurements in the same
        archive, 6 exceed 2 SE where 9.2 are expected under N(0,1), the
        standard deviation of the SE-deviations is 0.894 rather than 1.0, and
        the +2.427 value ranks 3rd of 202 (empirical one-sided tail 1.5%).
        p=617's own cell p-value of 0.066 ranks 6th of 101 cells, where the
        6th-smallest of 101 uniform p-values is expected at 0.059.
      caveat: >-
        The 100 reference cells are cross-prime while p=617 is same-prime, so
        this is a null distribution of the same SHAPE rather than of the same
        construction. It does not prove the p=617 deviation is noise. It does
        establish that the lane has measured this statistic 202 times, found no
        excess of extreme values at all, and that the value in question sits
        where the 3rd of 202 draws should sit.

