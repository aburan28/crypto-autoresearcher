  note_on_scope: >-
    This report covers JB1 and JB2 ONLY. JB3 (adversarial null construction)
    and JB4 (closure standard) belong to red-team-breakthrough and are not
    adjudicated here. Where a finding of mine touches JB3's territory --
    notably the j=0/j=1728 variant question and the transversal-arm reuse --
    I record the measurement and hand the interpretation to that joint rather
    than pre-empting it. Per AGENTS.md's review architecture, the Coordinator
    composes; a whole-claim verdict from me would be an opinion built from
    half the evidence.

  # =====================================================================
  # HEADLINE
  # =====================================================================
  verdict: failed
  verdict_scope: >-
    `failed` attaches to the INFERENTIAL CLAIM this round was convened to
    test -- that z=2.3139 / p=0.020673 is a nominally-significant result at
    alpha=0.05 -- and NOT to the run records as measurements. The run
    records are intact, the arithmetic reproduces to full double precision
    (JB2 holds), and the measurements themselves remain admissible evidence
    of what was measured. What fails is that the number cannot carry the
    inferential weight placed on it: the procedure that produced it has a
    true false-positive rate of roughly 10% (plausible range 6.6%-23%), not
    5%, and the p-value's own variance model is demonstrably mis-specified
    in the direction that inflates significance, by an amount the archived
    artifacts bound but cannot close.

  joint_verdicts:
    JB1-SEQUENTIAL-INFERENCE-VALIDITY: breaks
    JB2-INDEPENDENT-END-TO-END-REDERIVATION: holds

  one_paragraph_summary: >-
    JB2 holds without qualification: starting from the three raw-result.json
    files alone I re-derived all eight counts, both cells' P1/P2/P3, both
    variances, and the inverse-variance-weighted pooled estimate, and obtained
    z=2.3139031514128234, two-sided p=0.020673035218915135 -- identical to the
    claimed value in every printed digit, via code sharing no lineage with the
    producer's, and cross-checked with two disjoint normal-tail
    implementations. This is the third independent confirmation and I find no
    discrepancy. JB1 breaks. Simulating the executed decision procedure under a
    genuine null, the true false-positive rate is ~10% under the model most
    generous to the lane that still charges what actually happened, and ~23%
    under a stop-at-first-significant reading; a single correctly-specified
    unadjusted test in the same machinery returns 0.0455, and the rate rises
    monotonically 0.065 -> 0.086 -> 0.143 -> 0.172 -> 0.192 -> 0.224 -> 0.226
    as looks are added, so the method discriminates as the review plan
    requires. Two charges drive it, and neither is optional-stopping
    speculation -- both are objective, checkable properties of the artifacts.
    FIRST, the estimator's variance model Var(log S) = 1/S treats S (colliding
    PAIRS) as a Poisson count of independent events, but S is a clustered sum
    over 20000 tuples: the archived pairs-vs-tuples counts prove the
    group-uniform arms carry 1.33-1.40 pairs per colliding tuple, forcing an
    overdispersion factor phi >= 1.49 on all four group-uniform counts while
    the transversal arms sit at phi ~= 1. Correcting only for the LEAST
    clustering the archive permits moves the pooled result to z=2.17/p=0.0299;
    the most it permits gives z=1.89/p=0.0581. SECOND, the terminal statistic
    was chosen post-hoc from a menu of two: TASK-20260904-904394's own joint
    J4 named "Fisher's combined probability test, OR a direct pooled log-ratio
    estimate", both were computed after both cell results were known, they
    disagreed across 0.05 (0.0713 vs 0.0207), and the significant one was
    adopted. Charging only these two, the procedure-level adjusted p-value of
    the reported headline is 0.0478 -- on the 0.05 boundary, not inside it.
    Separately, and not part of either charge, I found that the lane's own
    archive already contains a far better-powered measurement of the same
    question that nobody has brought to bear: RUN-MONO-cb905d-1 part_b's 100
    additional matched-(N,tau) cells give a CM-vs-ordinary transversal rate
    ratio of 1.018 (exact 95% CI [1.0002, 1.0361], 49491 colliding pairs),
    corroborating the DIRECTION of a CM effect while excluding the claimed
    magnitude of 1.156 from its interval by a factor of ~8.

  # =====================================================================
  # JB2 -- INDEPENDENT END-TO-END REDERIVATION
  # =====================================================================
