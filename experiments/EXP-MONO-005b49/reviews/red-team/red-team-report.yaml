red_team_report:
  id: RT-20260904-c4e97a-redteam
  task_id: TASK-20260904-904394
  experiment_id: EXP-MONO-005b49
  hypothesis_id: H-MONO-1d50ac
  question_id: RQ-MONO-001
  joints_owned: [J3-REPLICATION-LOGIC, J4-CROSS-CELL-SYNTHESIS]

  claim_under_review: >-
    The Coordinator's own recorded prior (TASK-20260904-904394 review_plan
    coordinator_prior, item 3): that EXP-MONO-005b49's non-significant P3
    (p=0.5410) at a second, independent same-prime matched-(N,tau) cell
    (p=3541, N=3600, tau=4), in the SAME direction as the first cell's own
    corrected, nominally-significant P3 (p=617; p~0.025-0.033), is "most
    consistent with the first cell's own corrected significant result was
    sampling noise" -- i.e. that this second cell's own null result is clean
    evidence AGAINST the endomorphism-ring-linked reading, sufficient to keep
    H-MONO-1d50ac from advancing.

  verdict_j3: breaks_the_prior_this_cells_own_test_has_only_14pct_power_at_the_relevant_effect_size_so_non_significant_is_not_clean_disconfirmation
  verdict_j4: partially_breaks_the_two_separate_inconclusive_results_framing_a_proper_pooled_estimate_is_nominally_significant_p_0.0207_but_this_is_itself_an_uncounted_post_hoc_look_and_the_p1_p2_stability_asymmetry_is_not_statistically_resolvable_at_n_2

  verdict_summary: >-
    J3: I recomputed the log-ratio delta-method test from this cell's own
    raw counts (233, 98, 201, 94) and reproduced execution_report.yaml's
    P1=2.377551, P2=2.138298, P3=1.111890, se=0.173520, z=0.611230,
    p=0.541048 EXACTLY (independent Python recomputation, blind to the
    implementation script, matching to 6+ significant figures). I then
    computed this cell's own statistical POWER, using its own se, to detect
    an effect the size of the first cell's own observed log-ratio departure
    (logr1=0.150422, i.e. P3~1.1623): power = 13.95%. This is far below the
    conventional 80% adequacy threshold and only modestly above the 5% false-
    positive rate itself. A test with 14% power would produce a "not
    significant" result about 86% of the time EVEN IF the true effect were
    exactly the size the first cell measured. I ran the review plan's own
    `proves_too_much` sensitivity control (J3 object 2): applying my power
    method to a deliberately tiny synthetic count (5,5,5,5) gives power=5.3%
    (correctly collapses to the alpha floor, i.e. correctly flags
    near-total uninformativeness), and applying it to the same cell's counts
    scaled 20x (4660,1960,4020,1880) gives power=97.2% (correctly reports
    near-certain detection) -- the method is sensitive to real power
    differences, not a rubber stamp. I additionally computed a likelihood-
    ratio check at the ACTUAL observed z=0.6112: it is very slightly MORE
    likely under "true effect = cell 1's magnitude" (pdf=0.3861) than under
    "true effect = 0" (pdf=0.3310), LR(H1/H0)=1.167. This is a small tilt,
    not strong evidence for a real effect on its own, but it flatly
    contradicts the prior's framing that this result is "most consistent
    with noise" -- the single observed data point is (mildly) more
    consistent with the alternative than with the null the prior favors. The
    root cause of the power gap is structural, not incidental: H-MONO-45183a
    Part B's own closed form makes the base collision rate scale as
    6(tau-1)/N, so for FIXED tau=4 and a FIXED n_tuples=20000 design, a
    second cell found at a larger N is mechanically less powered -- and
    since Stage 0 searched [3001,20000] (disjoint from and entirely above
    [101,3000], where p=617/N=580 was found), any cell found there was
    guaranteed a priori to have N substantially larger than 580 and
    therefore lower counts and lower power under a fixed-n_tuples design,
    independent of whether a true CM effect exists. I verified this
    quantitatively: predicted rate ratio 6(tau-1)/N1 over 6(tau-1)/N2 =
    580/3600's reciprocal = 6.207, matching the actual N ratio (3600/580 =
    6.207) exactly by construction, and the actual measured variance ratio
    (var2/var1 = 6.70) is close to the value this scaling alone predicts
    (6.21x), meaning most of this cell's power deficit relative to the first
    cell is EXPLAINED by which N Stage 0 happened to find, not by any
    property of the CM-vs-ordinary comparison itself. This is a genuine
    design gap in EXP-MONO-005b49's own specification.yaml: n_tuples=20000
    is fixed regardless of the found cell's N, with no declared minimum
    power target and no adaptive scaling, despite this exact hypothesis's
    own prior status_note (EXP-MONO-64aaa4) already disclosing that "this
    contract's own design-time power claim was independently shown wrong for
    the cell actually found" -- the same failure mode recurs here in a
    different form. Reading this cell's own non-significant result as
    "replication failed" or as license to discount the first cell is
    premature; the honest reading is "this specific test, at this specific
    N, was not capable of reliably detecting an effect of the size in
    question," which is a fact about the test's design, not about the
    underlying phenomenon.

    J4: The two cells' own P3 point estimates are strikingly concordant --
    1.1623 (p=617) and 1.1119 (p=3541), both ordinary-above-CM, a ~5%
    difference between two effect-size estimates whose own individual
    standard errors (0.067, 0.174) are far larger than that gap. I computed
    the fixed-effect inverse-variance-weighted pooled estimate directly from
    all eight raw counts (no summary p-values used): weights w1=222.63,
    w2=33.21 (cell 1 carries roughly 87% of the total information, as
    expected from its larger counts); pooled log-ratio=0.144664, pooled
    P3=exp(0.144664)=1.155651, pooled_se=0.062519, pooled z=2.3139,
    two-sided p=0.020673. This IS nominally significant, and more so than
    cell 1 alone (0.0207 < 0.0248), because cell 2 -- despite being
    individually non-significant -- is directionally concordant and adds
    positive evidence rather than diluting the combined estimate; a
    Cochran's Q heterogeneity test gives Q=0.0569 (df=1), p=0.8115, no
    evidence the two cells' true effects differ. This directly confirms the
    review plan's own suggestion that "a formal meta-analysis... would show
    a combined, more powerful test that IS significant" -- it does. However,
    I hold three disclosed reservations against treating this as a
    confirmed finding, all of which I verified myself rather than merely
    asserting: (1) n=2 is an extremely thin base for any fixed-effect
    pooling; Cochran's Q with df=1 has essentially no power to detect real
    heterogeneity, so "no evidence of heterogeneity" cannot be read as
    "confirmed homogeneity" -- it is the SAME low-power-null-result problem
    as J3, now applied to my own new statistic. (2) This pooled estimate is
    itself a NEW, POST-HOC statistic: neither EXP-MONO-cb905d's nor
    EXP-MONO-005b49's specification.yaml pre-registers a cross-cell
    combination rule, and I computed it only because this review round's own
    attack plan asked me to, after both individual results were already
    known. Per this lane's own already-established multiplicity discipline
    (EV-MONO-c0bf6d: "third consecutive borderline headline statistic...no
    multiplicity correction applied"), this pooled p=0.0207 is best
    understood as a fourth or fifth analytical look at substantially the
    same underlying signal, not a pre-registered confirmatory test; an
    illustrative (not rigorous, since the pooled statistic is a derived
    combination of the other two, not independent of them) sensitivity check
    shows the conclusion sits exactly on the edge of how liberally one counts
    that history: treating it as one additional look, 2x0.0207=0.0414 (still
    <0.05); treating it as a fourth independent look in the family,
    4x0.0207=0.083 (>0.05). (3) I separately checked Fisher's combined
    probability test on the two individual two-sided p-values (0.024805,
    0.541048): chi2=8.622 (df=4), p=0.0713 -- NOT significant, and a
    materially different conclusion than the direct pooled estimate. This
    divergence is expected and instructive: Fisher's method discards the
    actual effect-size and precision information and uses only the p-values,
    which is markedly less efficient than a direct inverse-variance-weighted
    pooled estimate when (as here) the full raw counts are available for
    both cells -- i.e., relying on Fisher's test here would repeat, one
    level up, exactly the kind of "use a less-informative summary statistic
    when a more-informative one is available from the same raw data" mistake
    CORR-20260904-d0205d already corrected once for the single-cell case. I
    therefore hold the direct pooled estimate (p=0.0207) as the more
    defensible number, but flag both its post-hoc status and Fisher's
    divergent result as reasons this should be read as "the combined
    evidence base leans harder toward a real effect than 'cell 2 failed to
    replicate' suggests," not as "the effect is now confirmed."

    On the P1/P2 stability sub-question: P1 (ordinary ratio) differs by only
    0.85% between cells (2.3980 vs 2.3776); P2 (CM ratio) differs by 3.64%
    (2.0631 vs 2.1383) -- P1 IS numerically more stable on raw point
    estimates. But formally testing each curve's own cross-cell difference
    (same log-ratio delta-method framework, applied within-curve instead of
    within-cell) gives z=0.0662, p=0.9472 for P1 and z=-0.2682, p=0.7885 for
    P2 -- both are trivially indistinguishable from zero, and their standard
    errors are nearly identical (0.1296 vs 0.1334), so under a null of "this
    curve's own ratio is cell-invariant," differences at least this large
    for EITHER curve would be unremarkable. With only 2 cells you cannot
    estimate a between-cell variance for either curve type separately (that
    needs 3+ independent replicates), so "P1 is more stable than P2" is not
    a testable claim yet -- it is one realized difference (0.85%) being
    smaller than another realized difference (3.64%), which is exactly what
    you would expect to see by chance about half the time even under
    perfect symmetry. I flag this as hypothesis-generating only, with one
    additional confound the task did not name: the two cells' CM curves are
    NOT the same variant -- cell 1's CM curve is j=1728 (A=69,B=0) and cell
    2's is j=0 (A=0,B=2728), per Stage 0's own "j in {0,1728}" admission
    rule. j=0 and j=1728 are the two exceptional automorphism loci (Aut
    groups of order 6 and 4 respectively, vs. order 2 generically), so any
    cross-cell comparison of P2 conflates prime-to-prime variation with
    CM-variant variation in a way the cross-cell comparison of P1 (always a
    generic-automorphism ordinary curve) does not. This is a genuine,
    previously-unflagged asymmetry between the two comparisons and is itself
    a reason P2's larger apparent cross-cell swing should not yet be read as
    "the CM ratio is intrinsically less stable" -- it may just as easily be
    "j=0 and j=1728 curves individually differ," which a same-variant
    replication (both cells using j=1728, or both using j=0) would be needed
    to separate.

  objections:
    - id: OBJ-J3-1
      severity: critical
      title: >-
        The Coordinator's prior treats a 14%-power non-significant result as
        evidence of a true null, conflating "failed to reject" with "no effect"
      target: >-
        ledger/handoffs/TASK-20260904-904394.yaml review_plan.coordinator_prior
        item 3; experiments/EXP-MONO-005b49/specification.yaml
        outcomes.replication_fails_or_reverses
      finding: >-
        Computed directly from raw-result.json's own four counts (233, 98,
        201, 94) via the pre-registered delta-method framework: this cell's
        own se=0.173520 gives only 13.95% power to detect an effect the size
        of the first cell's own observed departure (logr1=0.150422). A test
        this underpowered returns "not significant" ~86% of the time even
        under the alternative it is nominally testing for. The
        specification's own `outcomes.replication_fails_or_reverses` block
        states flatly that "P3 not significant... supports reading the first
        cell's own corrected result as noise" with no power qualifier
        attached to that reading.
      evidence: >-
        Independent Python recomputation (script retained in this review's
        scratch materials), verified against execution_report.yaml's own
        P1/P2/P3/se/z/p to 6+ significant figures before the power
        calculation was layered on top.
      consequence: >-
        "Not significant, same direction" cannot be read as clean
        disconfirmation of the first cell absent a power statement. The
        correct, narrower characterization is: this specific low-power test
        is uninformative about whether an effect of cell 1's size is present
        or absent at this cell -- not that it demonstrates absence.

    - id: OBJ-J3-2
      severity: medium
      title: >-
        Fixed n_tuples=20000 regardless of the found cell's N structurally
        guarantees lower power whenever Stage 0 finds a larger-N cell, independent
        of any true effect
      target: experiments/EXP-MONO-005b49/specification.yaml inputs.null_draws_per_curve
      finding: >-
        H-MONO-45183a Part B's own closed form (6(tau-1)/N) makes the base
        collision rate, and hence the counts a fixed n_tuples design
        produces, scale as 1/N. Stage 0 searched [3001,20000], strictly
        disjoint from and above [101,3000] where p=617 (N=580) was found;
        any cell found there necessarily has larger N, hence a lower base
        rate, hence lower counts and lower power under a fixed-n_tuples
        design -- BEFORE any question of whether a real CM-linked effect
        exists is even reached. I verified this numerically: the predicted
        rate ratio from N alone (580/3600 basis, 6.207x) closely tracks the
        actual variance ratio observed (var2/var1=6.70x), i.e. most of the
        power gap between the two cells is explained by which N Stage 0
        happened to land on, not by anything about the comparison itself.
        No power target or adaptive n_tuples rule is declared anywhere in
        specification.yaml, despite this same hypothesis's own prior
        status_note (from EXP-MONO-64aaa4) already disclosing a design-time
        power miscalibration as a named finding.
      evidence: >-
        6*(4-1)/580=0.031034 vs 6*(4-1)/3600=0.005; ratio 6.207, matching
        N2/N1=3600/580=6.207 exactly by construction; var1=0.0044918 scaled
        by 6.207 predicts var=0.02788 at N=3600, vs the actually measured
        var2=0.03011 (close; the small excess is consistent with the
        CM-variant confound in OBJ-J4-1 below, not a contradiction).
      consequence: >-
        A "second cell found in a disjoint, higher-N range" replication
        design is not power-matched to the first cell by construction unless
        n_tuples is scaled to the found N. This was knowable analytically
        before Stage 1 ran (H-MONO-45183a Part B's own formula was already
        in hand) and was not checked.
      required_control: >-
        Before authorizing Stage 1 on any future found cell, compute the
        expected count at that cell's own N under the pre-registered formula
        and either declare the resulting power explicitly, or scale
        n_tuples so that a target power (e.g. 80%) at a stated minimum
        effect size is achieved. Concretely for THIS cell: n_tuples =~
        20000*10.44 =~ 209,000 draws per curve per arm would reach ~80%
        power for the cell-1-sized effect, an increase in wall time from
        ~7.4s to roughly 75-80s (still trivially within the 3600s budget) --
        this can be run as a follow-up Stage 1 at the SAME already-found
        cell (p=3541, N=3600, tau=4) at near-zero marginal cost.

    - id: OBJ-J4-1
      severity: medium
      title: >-
        The two cells' CM curves are different j-invariant variants
        (j=1728 vs j=0), confounding any cross-cell reading of P2's own stability
      target: >-
        experiments/EXP-MONO-005b49/execution_report.yaml stage0.cell.cm_variant;
        experiments/EXP-MONO-cb905d/runs/RUN-MONO-cb905d-2/raw-result.json part_a.curve_rederivation_check
      finding: >-
        Cell 1's CM curve (A=69, B=0) is j=1728; cell 2's CM curve (A=0,
        B=2728, cm_variant explicitly "j0") is j=0. These are the two
        distinct exceptional automorphism loci (Aut order 4 and 6
        respectively, vs. 2 generically) admitted by Stage 0's own "j in
        {0,1728}" rule, which does not hold the variant fixed across primes
        -- it accepts whichever of the two happens to match at the found
        prime. The ordinary curve side of the comparison has no analogous
        variant choice (generic automorphism group at both primes), so the
        cross-cell P1 comparison and the cross-cell P2 comparison are not on
        equal methodological footing: P2's larger observed cross-cell swing
        (3.64% vs P1's 0.85%) could reflect j=0-vs-j=1728 structural
        difference rather than prime-to-prime noise in "the CM ratio," and
        the current two-cell dataset cannot separate these.
      consequence: >-
        The review plan's own question ("is the ordinary curve's ratio more
        stable/consistent across cells than the CM curve's, independent of
        the P3 significance question") is not yet answerable, and framing it
        as a property of "CM vs ordinary" is premature until a same-variant
        replication (two cells both landing on j=0, or both on j=1728)
        exists.
      required_control: >-
        A third matched cell, or a targeted search restricted to ONE fixed
        CM variant, would let a same-variant P2 cross-cell comparison be
        made; until then, note the confound rather than reading the current
        3.64% vs 0.85% gap as evidence about curve-type stability.

  required_controls:
    - id: RC-J3-1
      status: I_RAN_IT
      name: Power of this cell's own test to detect an effect the size of cell 1's observed departure
      method: >-
        Delta-method Wald test power formula: ncp = logr1/se2, power =
        (1-Phi(z_0.025 - ncp)) + Phi(-z_0.025 - ncp), using this cell's own
        se=0.173520 computed from its own raw counts and cell 1's own
        logr1=0.150422 as the target effect.
      result: >-
        power = 13.95%. Far below 80% adequacy; se would need to shrink by
        a factor of 10.44 (roughly 209,000 draws per arm instead of 20,000)
        to reach 80% power at this effect size.
    - id: RC-J3-2
      status: I_RAN_IT
      name: proves_too_much sensitivity check on the power method (per TASK-20260904-904394's own named control)
      method: >-
        Applied the identical power formula to (a) a deliberately tiny
        synthetic count set (5,5,5,5) and (b) this cell's own counts scaled
        20x (4660,1960,4020,1880).
      result: >-
        (a) power=5.3% (correctly collapses to the alpha floor -- does not
        spuriously report "adequately powered" for an obviously starved
        case). (b) power=97.2% (correctly reports near-certain detection
        when the data genuinely supports it). The method is sensitive in
        both directions, not a rubber stamp.
    - id: RC-J4-1
      status: I_RAN_IT
      name: Fixed-effect inverse-variance-weighted pooled estimate of log(P3) across both cells
      method: >-
        w_i = 1/var_i (var_i from each cell's own four raw counts via the
        pre-registered delta method); pooled_logr = sum(w_i*logr_i)/sum(w_i);
        pooled_se = sqrt(1/sum(w_i)); pooled_z = pooled_logr/pooled_se;
        two-sided normal p-value.
      result: >-
        w1=222.63, w2=33.21; pooled_logr=0.144664 (pooled P3=1.155651);
        pooled_se=0.062519; pooled_z=2.3139; two-sided p=0.020673 --
        NOMINALLY SIGNIFICANT, more so than cell 1 alone.
    - id: RC-J4-2
      status: I_RAN_IT
      name: Cochran's Q heterogeneity test on the two pooled log-ratios
      method: Q = sum(w_i*(logr_i - pooled_logr)^2), df=1, chi-square p-value.
      result: >-
        Q=0.0569, p=0.8115 -- no evidence of heterogeneity, but a df=1 Q-test
        has essentially no power to detect real heterogeneity with only 2
        studies, so this should not be read as confirming homogeneity.
    - id: RC-J4-3
      status: I_RAN_IT
      name: Fisher's combined probability test on the two individual two-sided p-values, for comparison
      method: chi2 = -2*(ln(p1)+ln(p2)), df=4, chi-square survival function.
      result: >-
        chi2=8.622, p=0.0713 -- NOT significant, diverging from the direct
        pooled estimate (p=0.0207) because it discards effect-size/precision
        information that is available here and should not be discarded when
        the raw counts exist for both cells.
    - id: RC-J4-4
      status: I_RAN_IT
      name: Formal cross-cell equality test for P1 alone and P2 alone
      method: >-
        Same delta-method log-ratio framework applied within-curve across
        cells rather than within-cell across curves.
      result: >-
        P1: z=0.0662, p=0.9472. P2: z=-0.2682, p=0.7885. Both trivially
        consistent with no cross-cell difference; standard errors nearly
        identical (0.1296 vs 0.1334), so the raw 0.85%-vs-3.64% point-estimate
        gap is well within what chance alone produces at n=2 and is not
        itself a statistically supported "P1 more stable" finding.

  counterexample_or_mutation:
    the_cheapest_discriminating_control: >-
      Re-run Stage 1 at the SAME already-found cell (p=3541, N=3600, tau=4)
      with n_tuples scaled to ~209,000 draws per curve per arm (per RC-J3-1),
      an estimated ~75-80 seconds of wall time given the executed run's own
      7.36s Stage-1 time at 20,000 draws -- this directly tests whether the
      non-significance is a power artifact or a genuine null, at negligible
      marginal cost within the existing 3600s budget.
    the_mutation_that_does_discriminate: >-
      The proves-too-much sensitivity pair (RC-J3-2): tiny synthetic counts
      correctly collapse power to the alpha floor, and 20x-scaled counts
      correctly report near-certain power, confirming the power method used
      to challenge the Coordinator's prior is itself discriminating rather
      than vacuous.

  baseline_comparison: >-
    Not applicable in the Pollard-rho/BSGS sense -- this is a toy-scale
    statistical replication of a sampling-construction comparison, not an
    ECDLP solver claim, per specification.yaml's own claim_ceiling and
    what_this_is_not. No cost, exponent, or attack-baseline comparison is
    warranted or attempted here.

  heuristic_challenges:
    - heuristic: HEUR-COIN-1 / H-MONO-1d50ac H1 (reused unmodified by this contract)
      challenge: >-
        Out of scope for J3/J4 as assigned (this joint concerns the
        replication logic and cross-cell synthesis of an already-run
        comparison, not the underlying sampling heuristic itself, which
        prior rounds on this lane already scrutinized). No new challenge to
        H1 raised here.

  cost_model_challenges: []

  reduction_and_scope_challenges:
    - target: DEC-20260904-8c17d5 outcomes.replication_fails_or_reverses framing, as it would apply if reused verbatim for this second cell's own disposition
      finding: >-
        If the Coordinator's decision on THIS run adopts the
        `replication_fails_or_reverses` outcome as written ("supports
        reading the first cell's own corrected result as noise... likely
        moves toward a scoped, non-supported disposition") without the power
        qualifier established above, it would scope-inflate a
        14%-power null into the same evidentiary weight as a well-powered
        null. The narrowest correct statement is that this cell's own test
        is uninformative at the effect size in question, not that it
        actively disconfirms the first cell.

  proof_architecture_challenges: []

  narrowest_supported_statement: >-
    J3: EXP-MONO-005b49's own P3 (p=0.5410) is correctly computed from its
    own raw counts via the pre-registered test -- I independently reproduced
    it exactly. What is NOT supported is reading this non-significant result
    as evidence against the endomorphism-ring-linked reading: this cell's own
    test has only ~14% power to detect an effect the size the first cell
    observed, a deficit substantially explained by this cell's structurally
    larger N under a fixed-n_tuples design, not by anything about the CM
    comparison itself. "Replication failed" is not the correct
    characterization; "this specific test was underpowered for the question
    asked" is. J4: A direct, from-raw-counts, inverse-variance-weighted
    pooled estimate across both cells IS nominally significant (p=0.0207),
    more so than either cell alone, with no detected (though weakly-testable,
    n=2) heterogeneity between them -- the two cells' point estimates are in
    fact strikingly concordant (1.1623 vs 1.1119). This is a genuine update
    against the "two separate, individually inconclusive results" framing.
    It is NOT a confirmed finding: it is a post-hoc statistic computed after
    both individual results were known, in a lane that has already disclosed
    a real, unresolved multiplicity problem across its prior tests on this
    same underlying signal, and Fisher's alternative combination method on
    the same two p-values does NOT reach significance (p=0.0713) -- the
    combined evidence is directionally and quantitatively suggestive, not
    settled. The P1-more-stable-than-P2 observation is not currently
    testable (n=2 per curve type) and is further confounded by the two
    cells' CM curves being different j-invariant variants (j=1728 vs j=0);
    it is a candidate direction for a future, variant-controlled replication,
    not a finding.

  next_concrete_action: >-
    (1) For J3: re-run Stage 1 at the already-found p=3541 cell with
    n_tuples scaled to ~209,000 per curve per arm (RC-J3-1/OBJ-J3-2), to
    directly test whether the non-significance survives adequate power,
    before this cell's own null is used to discount the first cell. (2) For
    J4: if a third matched cell is sought, restrict Stage 0's CM-variant
    admission to a SINGLE fixed j-invariant (either always j=0 or always
    j=1728) across all future cells, so cross-cell P2 comparisons are no
    longer confounded with automorphism-group variant, and pre-register the
    inverse-variance-weighted pooling rule (not Fisher's test) as the
    official cross-cell combination method BEFORE that third cell's counts
    are observed, closing the post-hoc-method gap this review's own pooled
    estimate currently has.

  review_attestation:
    joints_owned: [J3-REPLICATION-LOGIC, J4-CROSS-CELL-SYNTHESIS]
