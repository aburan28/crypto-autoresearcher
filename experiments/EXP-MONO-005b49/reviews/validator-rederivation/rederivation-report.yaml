  # =====================================================================
  # THE DISCREPANCY, LOCATED
  # =====================================================================
  discrepancy:
    id: DISC-GU-SLOT-EXCHANGEABILITY
    severity: high_for_promotion_nil_for_inference
    what_the_red_team_wrote: |
      E[...] = (6/N) * [ tau/(N-1) * ( (tau-1) + (N-tau)(tau-1)/(N-3) )
               + sum over generic points of
                 1/(N-2) * ( beta + tau(tau-1)/(N-3) + (N-2-beta-tau)*tau/(N-4) ) ]
        with beta = tau-2 for the (#E[4]-tau) points of exact order 4
        and beta = tau-1 for all other non-2-torsion points.
    what_that_expression_actually_is: >-
      6 * Pr[ COLLISION(k=3, eps=+1) ] = 6 * Pr[ P3 in T or P1+P2 in T ].
      I verified this by exhaustive per-condition enumeration: their q equals
      Pr[COLLISION(k=3,eps=+1)] to the last exact rational digit (e.g. 37/66 at
      p=13 A=0 B=1). Their algebra for that single condition is CORRECT.
    the_error: >-
      Multiplying that single probability by 6. Under the sequential
      distinct-key rejection sampler the six conditions are NOT equiprobable,
      because the sampler is not exchangeable in the three draw slots: P1 is
      uniform on all N points, P2 on N minus one key class, P3 on N minus two.
      The condition indexed by k puts P_k in the "P_k in T" role, so the six
      conditions take three distinct values, strictly increasing in k.
    exhaustive_evidence:
      - curve: "p=13 A=0 B=1 (N=12, tau=4, nu4=4)"
        Pr_k1: 47/90    ("0.522222222222")
        Pr_k2: 533/990  ("0.538383838384")
        Pr_k3: 37/66    ("0.560606060606  <- the one they used")
        true_E_gu: 3.242424242424
        their_6x_Pr_k3: 3.363636363636
        relative_error: "+3.7383%"
      - curve: "p=11 A=1 B=2 (N=16, tau=4, nu4=8)"
        Pr_k1: 431/1092
        Pr_k2: 443/1092
        Pr_k3: 229/546
        true_E_gu: 2.439560439560
        their_6x_Pr_k3: 2.516483516484
        relative_error: "+3.1532%"
      - curve: "p=11 A=1 B=1 (N=14, tau=2, nu4=2)"
        Pr_k1: 82/385
        Pr_k2: 1116/5005
        Pr_k3: 1181/5005
        true_E_gu: 1.343856143856
        their_6x_Pr_k3: 1.415784215784
        relative_error: "+5.3524%"
    error_magnitude_by_scale:
      N_13:   "+10.09%"
      N_12:   "+3.74%"
      N_16:   "+3.15% to +3.35%"
      N_36:   "+1.50%"
      N_580:  "+0.0982%   (cell 1)"
      N_3600: "+0.0159%   (cell 2)"
      scaling: "O(1/N) relative; always POSITIVE (they multiplied the largest of the three)"
    why_it_is_the_transversal_shortcut_carried_one_step_too_far: >-
      For the TRANSVERSAL arm the sampling law IS exchangeable in the three
      slots, so 3 x (pair probability) -- and equivalently 6 x (single
      condition) -- is exactly valid. That is why exact.py's transversal
      formula is right, and why verify.py's genuine pair-level brute force
      confirms it. The same shortcut was then applied to the group-uniform arm,
      where the distinct-key rejection makes the law slot-dependent.
    why_their_own_verification_could_not_catch_it:
      - >-
        verify.py brute-forces ONLY the transversal formula (brute_tr). There
        is no independent brute force of the group-uniform formula anywhere in
        the review directory.
      - >-
        gu.py's brute_gu, presented as the exact enumeration cross-check for
        the group-uniform arm, is NOT independent: it is itself an O(N^2)
        evaluation of 6 * Pr[COLLISION(k=3,eps=+1)]. It shares the defective
        multiplication with analytic_gu, so it agrees with it to 1e-12 and
        always will. gu2.py prints "AGREE=True" for four curves on this basis.
      - >-
        The 145-measurement panel calibration exercises only the transversal
        arm (panel.py calls exact_tr only).
      - >-
        NC-5's "233.31 predicted versus 233 observed" endorsement of the
        corrected sampler is at a cell where the overdispersion-corrected
        standard error is ~19 counts, so a 0.016% formula error is ~200x below
        the resolution of that check. The check is sound; it simply cannot see
        this.
      - >-
        NOTE: this is precisely the failure mode agents/validator.md "Blind
        re-derivation tasks" names -- a wrong-but-consistent implementation
        reproduces itself faithfully and agrees with itself. Only a derivation
        that never saw it can disagree. RC-B10 asked for exactly this and was
        right to.
    the_corrected_group_uniform_closed_form: |
      E_gu(N,tau,nu4) = pi0*E_trans(N,tau,nu4) + 2*pi1 + 6*pi2 + 6*pi3
        pi_j = C_j * W_j,  G = N - tau
        C_0 = G(G-2)(G-4)        C_1 = tau*G(G-2)
        C_2 = tau(tau-1)*G       C_3 = tau(tau-1)(tau-2)
        W_0 = 1/(N(N-2)(N-4))
        W_1 = 1/(N(N-1)(N-3)) + 1/(N(N-2)(N-3)) + 1/(N(N-2)(N-4))
        W_2 = 1/(N(N-1)(N-2)) + 1/(N(N-1)(N-3)) + 1/(N(N-2)(N-3))
        W_3 = 1/(N(N-1)(N-2))
      Still an exact function of (N, tau, #E[4]) and nothing else.

  # =====================================================================
  # WHAT SURVIVES
  # =====================================================================
  conclusions_that_survive_the_correction:
    - >-
      The measured quantity IS a deterministic function of the curve,
      exactly computable, with no sampling. CONFIRMED.
    - >-
      It depends on the curve ONLY through (N, tau, #E(F_p)[4]). CONFIRMED,
      and now proved rather than fitted: the endomorphism ring enters solely
      through what it forces on those three numbers.
    - >-
      Cell 1's true effect is EXACTLY zero, for the stated reason (N=580 with
      tau=4 forces Z/2 x Z/290, hence #E[4]=4). CONFIRMED. The correction to
      E_gu is identical on both curves and cancels.
    - >-
      Cell 2's true effect is real, tiny (-0.042%), and opposite in sign to
      the measured +11.2%. CONFIRMED (my -0.0424615% vs their -0.0424666%).
    - >-
      H-MONO-45183a Part B's 6(tau-1)/N is systematically incomplete by mean
      +0.62%, max +5.08%, and the exact repair is the transversal formula.
      CONFIRMED independently on 145 curves.
    - >-
      The fixed/random sign arms are byte-identical by construction, so they
      are one measurement and not two. CONFIRMED, and I derived this before
      reading their report.
    - >-
      UC-1's overdispersion finding is right and I can now give it exactly:
      the group-uniform arm's phi = Var/E is >= 1.5388 analytically at cell 1
      (Monte Carlo 1.554 at 600k tuples) against their lower bound 1.499,
      and the transversal arm's is ~0.9686 against their 0.969. The asymmetry
      is structural: by C3/C4 a group-uniform tuple containing a 2-torsion
      point contributes f = 2 (or 6) deterministically, creating atoms the
      transversal arm cannot have.
  what_does_not_survive:
    - the group-uniform closed form as published in counterexample_or_mutation
    - "the four E_group_uniform values in what_it_returns (0.07244810268502463 x2, 0.01166573610782345, 0.01166203446745678)"
    - "the three exact_gu_over_tr values (2.310289, 2.330123, 2.331113); correct: 2.308022, 2.329753, 2.330743"
    - "exact_P3 = 0.99957533 and exact_log_P3 = -0.00042476 at cell 2; correct: 0.99957538460151266 and -0.000424705"
    - "the group_uniform 'expected' counts in per_count_z_against_the_exact_expectation (1448.96 -> 1447.54; 233.31 -> 233.28; 233.24 -> 233.20). The z values shift by <0.04 and no reading changes."

