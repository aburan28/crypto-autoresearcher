  # =====================================================================
  # LIMITATIONS
  # =====================================================================
  limitations:
    - >-
      MY OWN group-uniform closed form is now the load-bearing new content of
      this report and it has been derived by exactly one agent -- me. It is far
      better supported than the one it corrects (1511 exhaustive rational
      agreements, plus a 2e6-tuple simulation of the literal sampler loop that
      discriminates it from the obvious alternative model), but it should be
      independently rederived before any record cites it as exact. I am making
      the same request RC-B10 made, for the same reason.
    - >-
      All exhaustive enumeration is at N <= 68. At N = 580 and N = 3600 the
      closed forms rest on the derivation plus Monte Carlo at ~0.6% and ~1%
      resolution respectively, which cannot by itself distinguish my values
      from the Red Team's.
    - >-
      Both derivations idealise the seed stream: the implementations draw from
      a SHA-256 counter stream, not an RNG, and I modelled the draws as i.i.d.
      uniform. Neither the Red Team nor I tested whether the actual counter
      stream introduces any correlation. Nothing here would detect that.
    - >-
      I validated the two closed forms and the three numbered checks only. I did
      NOT independently verify the report's pooled statistics (pooled log P3,
      weights, z, p), the JB4 closure analysis, the KN-OPEN-009 argument, the
      multiplicity accounting, or objections other than UC-1. Those remain
      unvalidated by me and my verdict says nothing about them.
    - >-
      The task card supplied no committed snapshot sha and instructed me not to
      run git, so I read the working tree. I cannot attest that the artifacts I
      read are identical to a Coordinator-committed snapshot. Per
      agents/validator.md this would ordinarily be a refusal; I proceeded
      because the instruction is explicit and the mathematical content of the
      check is snapshot-independent (the formulas either are or are not exact),
      but the artifact-binding half of a normal validation is NOT discharged.
    - >-
      The +0.098% cell-1 and +0.016% cell-2 errors are far below the resolution
      of any measurement in the archive, so no archived observation could have
      revealed them and none of the archive's statistical readings change.
    - >-
      I did not re-verify the archived runs' manifests, environments, command
      records, resource records, or dirty-tree state. This task was scoped to a
      mathematical rederivation and those checks belong to the runs' own
      validation records.

