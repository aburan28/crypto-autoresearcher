    exact value P3 = 0.99957533 at cell 2 is therefore wrong; the correct
    exact value is 0.99957538460151266 (4111818990624225/4113565673952074).
    The error is O(1/N) relative and immaterial to every inference the report
    draws, but a formula advertised as exact and proposed for DETERMINISTIC
    tier must actually be exact.

