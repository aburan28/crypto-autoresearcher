  # ===================================================================
  # OTHER REQUIRED SECTIONS
  # ===================================================================
  baseline_comparison: >-
    Not applicable in the Pollard-rho / BSGS sense; no solver, cost, or
    exponent claim is made or implied anywhere in this chain, and none should
    be. The relevant baseline is methodological and is stated under
    pareto_honesty.dominated_by: exact evaluation dominates Monte Carlo
    estimation of this quantity on every axis.

  heuristic_challenges:
    - heuristic: HEUR-COIN-1 / H-MONO-1d50ac H1
      challenge: >-
        H1's h1_correction_2026_08_31 already records that the
        transversal-versus-group-uniform gap is a ~2x structural effect rather
        than the o(1/N) the stale text claimed. The exact forms confirm the
        mechanism and sharpen it: the leading-order ratio is (2*tau-1)/(tau-1),
        which is 7/3 = 2.333 at tau=4 -- matching the exact values 2.310 and
        2.330/2.331 computed here, and explaining why EXP-MONO-12ce1c OBJ-6's
        1.84-2.08 reference band does not transfer to these cells (that band
        was measured at other (N,tau), predominantly tau=2, where the
        leading-order ratio is 3). EV-MONO-c0bf6d flags "P1 outside the OBJ-6
        band" as not independently diagnosable; it is now diagnosable and
        benign: the band is tau-dependent and the observed values sit close to
        their own tau=4 exact predictions.
    - heuristic: H2 (existence of matched pairs)
      challenge: >-
        Not a live heuristic; it is a search outcome, correctly recorded as
        such. But see jb3b finding 1: the matched-pair search implicitly
        conditions on the isogeny class having fundamental discriminant -3 or
        -4, which is a strong and undisclosed restriction on the population of
        cells the design can ever sample.

  reduction_and_scope_challenges:
    - target: ledger/hypotheses/H-MONO-1d50ac.yaml (mechanism, predictions, KN-OPEN-009 linkage)
      finding: >-
        The record's own quantifier_order block claims a single confirmed
        disagreement "can falsify (N,tau)-only completeness outright." That is
        correct in principle and is now realized -- but by an exact
        computation whose answer differs in magnitude by a factor of ~370 and
        in sign from what the experiments measured. A record that adopts the
        pooled statistic as the falsifier would be right about the conclusion
        and wrong about the reason, which is the worst outcome available here:
        it would propagate a real result attached to a fabricated effect size.
    - target: ledger/decisions/DEC-20260904-ffaebb.yaml scope_statement
      finding: >-
        The scope statement is accurate and appropriately narrow ("Does not
        close KN-OPEN-009. Does not itself establish or refute H-MONO-45183a
        Part B's (N,tau)-only completeness"). Nothing in it needs weakening.
        What needs adding is the KN-OPEN-009 structural bar (that record's own
        j=0/1728 exclusion requirement), which makes the non-closure a matter
        of design rather than of insufficient evidence.

  proof_architecture_challenges:
    - attack: observation-fiber
      finding: >-
        The lossy projection under test is (N,tau). Holding it fixed and
        varying the curve, I placed two preimages on opposite sides of the
        conclusion at cell 2 (Z/6 x Z/600 versus Z/60 x Z/60 at the same
        (N,tau) = (3600,4)), so the observation IS lossy -- the record is right
        about that. The missing separator is #E(F_p)[4]. Adjoining it makes the
        projection exactly sufficient: I could construct no pair of curves with
        equal (N, tau, #E[4]) and unequal rates, and the closed forms show
        none exists.
    - attack: quantifier-order
      finding: >-
        The record's quantifier order is EXISTS a matched pair SUCH THAT the
        rates agree/disagree. The executed chain silently converted this into
        "there exists a STATISTIC on the pairs already drawn under which they
        disagree," with the statistic chosen after the counts were seen at two
        of the three decision points. The exact computation restores the
        original quantifier and answers it.
    - attack: method-ceiling
      finding: >-
        The largest claim this instrument can support is the exact one: an
        O(1/N) deviation, at most 0.46% relative anywhere in the archive. A
        20,000-tuple Monte Carlo at N=580 has a per-arm standard error of
        about 3.9% -- roughly 8x the largest true effect in the entire
        archive. The method ceiling therefore does not reach the headline by a
        factor of ~8 even before the ratio-of-ratios doubles the variance. This
        was derivable before any run, from Part B's own formula.
    - attack: nearby-object
      finding: See NC-3 and RC-B10. 79 of 84 archived matched cells are exact nearby objects; their measured spread is the noise floor.
    - attack: compositional-invariant
      finding: >-
        Deleting the group-uniform arm from P3 returns exactly EXP-MONO-64aaa4's
        own failed p=0.066 test; deleting the transversal arm returns a
        statistic with no reused data and no significance at either cell
        (cell 1 gu-only log-ratio +0.045, cell 2 +0.148, neither significant
        alone). The composite's significance is not a property of either
        component; it is a property of their sum, which is exactly the
        signature the exact computation says it should be, since the true sum
        is zero.
    - attack: boundary-and-strictness
      finding: >-
        Part B's 6(tau-1)/N is genuinely embedded as the leading term of the
        exact transversal form, and the exact form is strictly better (it is
        correct). The perturbation is real, not merely numerically preferred.

  narrowest_supported_statement: >-
    JB3: The two-cell pooled estimate is a null-hypothesis artifact, and this
    is established by exact computation rather than argued from suspicion. For
    the m=4 construction actually implemented, the expected collision rate
    under both sampling arms is an exact function of (N, tau, #E(F_p)[4]);
    at cell 1 the ordinary and CM curves agree in all three (and are forced to,
    since N=580 with tau=4 admits only Z/2 x Z/290), so the true P3 is exactly
    1.00000000 and cell 1 -- which carries 87% of the pooled weight -- can
    carry no effect of any size; at cell 2 the curves differ (#E[4] = 8 vs 16)
    and the true P3 is 0.99957533, a 0.042% effect in the OPPOSITE direction
    from the measured +11.2%. 63.3% of the pooled signal is one +2.18 sigma
    excursion in a single count (681 versus an exact expectation of 627.18)
    that was measured once and reused three times. Correcting the omitted
    overdispersion in the group-uniform arm independently moves the pooled
    p from 0.0207 to at least 0.0299 and gives the nominal alpha=0.05 test a
    true size of 0.0661.
    JB4: If accepted, the result would establish only a ~15.6% difference in a
    sampling-construction ratio between four named toy curves at m=4, claim
    tier toy. It would not establish anything at cryptographic scale (the
    quantity is ~2^-251 at 256 bits and the true structural term needs ~2^732
    tuples to see), anything for m != 4, any relation-rate or ECDLP claim,
    that the endomorphism ring is the operative variable (it is confounded by
    construction with automorphism group and volcano level, and the exact
    forms show it enters only through #E[4]), or anything about KN-OPEN-009,
    which explicitly requires excluding the j=0/1728 artifacts that constitute
    this design's entire CM arm.
    POSITIVE RESIDUE, held at the deterministic tier it was verified at:
    H-MONO-45183a Part B's (N,tau)-only completeness is FALSE; the exact
    completion is (N, tau, #E[4]); Part B's closed form is low by +0.60% on
    average (max +5.08%) across 145 archived measurements; and crater curves
    in these classes carry strictly more rational 4-torsion than their
    matched partners in 6 of 6 archived instances where #E[4] differs at all.

  next_concrete_action: >-
    (1) DO NOT commission a third cell. A third 20,000-tuple cell would have a
    per-arm standard error roughly 8x the largest true effect in the archive
    and would produce a fourth borderline number carrying no information. If
    the Coordinator wants the answer, run reviews/red-team-breakthrough/exact.py
    and gu.py -- about one second per curve, exact, no run record needed.
    (2) Have an independent party re-derive the two closed forms in
    counterexample_or_mutation before any record cites them. They are mine,
    they are the load-bearing content of this report, and they have not been
    checked by anyone else. RC-B10 states the falsification route.
    (3) File the (N, tau, #E[4]) completion as the actual answer to
    H-MONO-45183a Part B's own residual_collision_risk clause, at claim tier
    DETERMINISTIC (not toy), scoped to m=4 and this construction, with the
    O(1/N) magnitude and the "endomorphism ring enters only through #E[4]"
    statement attached so it cannot be cited as an endomorphism-ring result.
    (4) Partition the Part B 100-cell panel by supersingular/ordinary before
    any further use (OBJ-B6), and re-derive its se_deviation figures against
    the exact expectation rather than the closed form -- the current CM/ordinary
    split in those figures (-0.002 vs +0.293) is an artifact of the closed
    form's missing term, and is exactly the kind of thing that could seed the
    next false positive in this lane.
    (5) Record the reuse overlap (UC-2) in any future multiplicity discussion:
    EXP-MONO-64aaa4's p=0.066 and cell 1's corrected p=0.025 share 70% of
    their signal and must not be counted as independent looks.

