red_team_report:
  id: RT-20260904-4580e8-redteam-breakthrough
  task_id: TASK-20260904-4580e8
  experiment_id: EXP-MONO-005b49
  hypothesis_id: H-MONO-1d50ac
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  tier: review-breakthrough
  degradable: false
  completed_at_full_rigor: true
  joints_owned: [JB3-ADVERSARIAL-NULL-CONSTRUCTION, JB4-CLOSURE-STANDARD-CHECK]

  claim_under_review: >-
    Whether the two-cell inverse-variance-weighted pooled log-ratio estimate
    (pooled log P3 = +0.144664, pooled P3 = 1.1557, se = 0.062519,
    z = 2.3139, two-sided p = 0.020673) across the p=617 and p=3541 matched
    (N,tau) cells constitutes genuine evidence against H-MONO-45183a Part B's
    (N,tau)-only completeness, or is an artifact.

  # ===================================================================
  # HEADLINE
  # ===================================================================
  verdict_jb3: >-
    breaks_the_claim_decisively_the_measured_quantity_is_exactly_computable_and_its_exact_value_is_1.00000000_at_cell_1_and_0.99957533_at_cell_2_so_the_pooled_signal_is_provably_monte_carlo_noise_and_at_cell_2_points_the_opposite_way_from_the_truth
  verdict_jb4: >-
    holds_as_a_finding_the_if_true_claim_is_far_narrower_than_the_chain_implies_and_the_even_if_true_not_list_includes_KN_OPEN_009_which_this_design_is_structurally_barred_from_addressing_by_that_records_own_stated_control_requirement

  verdict_summary: >-
    JB3 does not merely "hold up as a plausible alternative." The adversarial
    null is not a hypothesis here: it is a computation. The quantity
    H-MONO-1d50ac has been estimating by Monte Carlo since EXP-MONO-64aaa4 is
    a DETERMINISTIC function of the curve that can be evaluated exactly, in
    about one CPU-second per curve at these primes, with no sampling at all.
    I derived the exact expectation for both sampling arms from the
    construction in EXP-MONO-64aaa4/implementation/run_experiment.py
    (measure_curve) and EXP-MONO-cb905d/implementation/
    run_experiment_v2_part_a_corrected.py (measure_group_uniform_v2),
    verified it against brute-force enumeration to <1e-14 on 20 curves
    spanning tau in {1,2,4}, j in {0, 1728, generic}, ordinary and
    supersingular, and validated it against 145 independent archived
    curve-measurements from RUN-MONO-cb905d-1's own Part B panel (mean z =
    -0.010, sd 0.915 against my exact values; ideal 0 and 1).

    The exact answer to H-MONO-1d50ac's own pre-registered question, at its
    own two cells:

      cell 1 (p=617,  N=580,  tau=4):  EXACT P3 = 1.00000000  (log = 0 exactly)
      cell 2 (p=3541, N=3600, tau=4):  EXACT P3 = 0.99957533  (log = -4.2476e-4)

    versus the measured values 1.162325 and 1.111890 (pooled 1.1557). At
    cell 1 the two curves' rates are EXACTLY EQUAL -- not approximately, not
    within tolerance: every invariant the rate depends on (N=580, tau=4,
    n_FB=288, #E[4]=4) is identical for the ordinary and the CM curve, and
    is forced to be identical because N=580 with tau=4 admits only the group
    Z/2 x Z/290. Cell 1 therefore cannot carry a true effect of any size, and
    it carries 87% of the pooled weight. At cell 2 the true effect is real
    but is 0.042% and points in the OPPOSITE direction from the measured
    +11.2%. The pooled estimate is not a noisy version of the truth; it is
    370x the magnitude of the largest true component and the wrong sign on
    the only cell where a true component exists.

    The mechanism of the false positive is now fully traced. Decomposing
    log P3 multiplicatively into its group-uniform and transversal arms:

      cell 1: +0.150422 = [group-uniform +0.045225] + [transversal +0.105197]
      cell 2: +0.106061 = [group-uniform +0.147734] + [transversal -0.041673]

    69.9% of cell 1's log-signal is the transversal arm, and cell 1 carries
    87.0% of the pooled weight, so 63.3% of the entire pooled signal is a
    single quantity: log(681/613), the p=617 transversal-arm asymmetry. That
    asymmetry is a +2.18 sigma upward excursion of ONE count (the CM curve's
    681, against its exact expectation of 627.18) in a measurement that has
    been performed ONCE, in RUN-MONO-64aaa4-1, and then REUSED verbatim by
    RUN-MONO-cb905d-1 and again by RUN-MONO-cb905d-2. It is the same 613-vs-681
    comparison that EXP-MONO-64aaa4 already reported as its own headline at
    p=0.066. The two cells are "strikingly concordant" in P3 for opposite
    reasons: cell 1's signal is a high transversal count on the CM curve,
    cell 2's is a low group-uniform count on the CM curve (-1.73 sigma), and
    cell 2's transversal arm runs the wrong way (-0.041673). There is no
    common mechanism; there are two unrelated ~2 sigma blips in different
    arms that happen to push a ratio-of-ratios the same way.

    JB4: taken at face value the pooled result would establish only that two
    named curves at two toy primes gave gu/tr ratios differing by ~16% under
    one sampling construction at m=4. It would establish nothing about
    cryptographic scale (the measured rate is 6(tau-1)/N ~ 2^-251 at a
    256-bit N, and detecting the true O(1/N) effect there would need ~2^732
    tuples), nothing about m != 4, nothing about relation rates, and -- most
    sharply -- nothing about KN-OPEN-009, whose own text closes with "Any
    exceptional-curve claim must exclude j=0/1728 extra-automorphism
    artifacts from the random controls," while this design deliberately makes
    j in {0,1728} its ENTIRE CM arm.

    The claim did not survive. But the underlying question did, and it is now
    answered: (N,tau)-only completeness IS false, the exact completion is
    (N, tau, #E(F_p)[4]), and the endomorphism ring enters only through #E[4].
    That answer is deterministic, costs seconds, and is worth more than
    another cell.

  # ===================================================================
  # THE SINGLE CHEAPEST FALSIFICATION
  # ===================================================================
  counterexample_or_mutation:
    the_single_cheapest_falsification: >-
      COMPUTE THE QUANTITY EXACTLY INSTEAD OF SAMPLING IT. For the m=4
      construction actually implemented (3 distinct factor-base x-coordinates
      per tuple; 4 sign classes with eps_1 = +1; count colliding pairs among
      the 4 resulting x-coordinates), collision for index pair {i,j} occurs
      iff P_i + s P_j lies in E[2]\{O} for one of the two signs s, which
      depends only on the unordered pair of x-coordinates and not on the sign
      lift (this is also why the run's fixed/random-sign arms are byte-identical).
      Summing the resulting counts gives, for the TRANSVERSAL arm,

        E[pairs colliding per tuple] = 3 * ((tau-1)*n - F) / (n*(n-1))
          with  n = (N - tau)/2  and  F = (#E(F_p)[4] - tau)/2,

      and for the GROUP-UNIFORM arm (sequential distinct-key rejection over
      all N points, per measure_group_uniform_v2),

        E[...] = (6/N) * [ tau/(N-1) * ( (tau-1) + (N-tau)(tau-1)/(N-3) )
                 + sum over generic points of
                   1/(N-2) * ( beta + tau(tau-1)/(N-3) + (N-2-beta-tau)*tau/(N-4) ) ]
          with beta = tau-2 for the (#E[4] - tau) points of exact order 4
          and beta = tau-1 for all other non-2-torsion points.

      BOTH are exact functions of (N, tau, #E[4]) and of nothing else. Running
      them on the four curves already in the archive refutes the pooled result
      outright, costs no new run record, and takes about one second per curve.
      Script: reviews/red-team-breakthrough/exact.py, gu.py, gu2.py, verify.py.
    what_it_returns:
      cell1_ord: {p: 617,  A: 340, B: 362,  N: 580,  tau: 4, n_FB: 288,  nE4: 4,  F: 0, group: "Z/2 x Z/290",  E_transversal: 0.03135888501742160, E_group_uniform: 0.07244810268502463, exact_gu_over_tr: 2.310289}
      cell1_cm:  {p: 617,  A: 69,  B: 0,    N: 580,  tau: 4, n_FB: 288,  nE4: 4,  F: 0, group: "Z/2 x Z/290",  E_transversal: 0.03135888501742160, E_group_uniform: 0.07244810268502463, exact_gu_over_tr: 2.310289}
      cell2_ord: {p: 3541, A: 577, B: 1628, N: 3600, tau: 4, n_FB: 1798, nE4: 8,  F: 2, group: "Z/6 x Z/600",  E_transversal: 0.00500649023864394, E_group_uniform: 0.01166573610782345, exact_gu_over_tr: 2.330123}
      cell2_cm:  {p: 3541, A: 0,   B: 2728, N: 3600, tau: 4, n_FB: 1798, nE4: 16, F: 6, group: "Z/60 x Z/60",  E_transversal: 0.00500277622511379, E_group_uniform: 0.01166203446745678, exact_gu_over_tr: 2.331113}
    exact_vs_measured:
      cell1: {exact_P3: 1.00000000, exact_log_P3: 0.0,           measured_P3: 1.162325, measured_log_P3: 0.150422}
      cell2: {exact_P3: 0.99957533, exact_log_P3: -0.00042476,   measured_P3: 1.111890, measured_log_P3: 0.106061}
      pooled: {exact_log_P3_at_the_same_weights: -5.42e-05, measured_pooled_log_P3: 0.144759}
    per_count_z_against_the_exact_expectation:
      note: >-
        z computed with the overdispersion-corrected variance derived below,
        not with the program's Poisson approximation.
      cell1_ord: {transversal: {expected: 627.18, observed: 613,  z: -0.58}, group_uniform: {expected: 1448.96, observed: 1470, z: +0.45}}
      cell1_cm:  {transversal: {expected: 627.18, observed: 681,  z: +2.18}, group_uniform: {expected: 1448.96, observed: 1405, z: -0.94}}
      cell2_ord: {transversal: {expected: 100.13, observed: 98,   z: -0.21}, group_uniform: {expected:  233.31, observed:  233, z: -0.02}}
      cell2_cm:  {transversal: {expected: 100.06, observed: 94,   z: -0.61}, group_uniform: {expected:  233.24, observed:  201, z: -1.73}}
      reading: >-
        Seven of the eight counts sit within 1 sigma of their exact
        expectations. The entire two-cell "signal" is two isolated
        excursions, +2.18 and -1.73, in DIFFERENT arms of DIFFERENT curves.
    the_mutation_that_does_discriminate: >-
      The same exact machinery does NOT dissolve everything it is pointed at,
      which is what makes it evidence rather than a debunking template -- see
      proves_too_much_control below. It confirms the corrected sampler is
      1/N-uniform (its predictions match the corrected run's counts, e.g.
      233.31 predicted vs 233 observed), it flags the v1 sampler's 2x
      2-torsion overweight as a real bias, and it finds a REAL, systematic
      O(1/N) incompleteness in Part B's closed form (mean +0.60%, max +5.08%
      relative across 145 archived curve-measurements) that the program had
      not identified.

  # ===================================================================
  # JB3 (a) THE P-HACKING STEELMAN
  # ===================================================================
  jb3a_motivated_reasoning_steelman:
    verdict: >-
      The steelman is stronger than the Coordinator's prior allows, and the
      exact computation shows it is also CORRECT -- but its correct form is
      not "they kept trying tests." It is "one 2.2 sigma blip in a single,
      never-re-measured count has been carried, intact, through three
      successive re-expressions, each of which preserved it and added weight
      to it."
    the_chain_as_an_adversary_would_state_it:
      - step: 1
        what_happened: >-
          EXP-MONO-64aaa4 measures the transversal arm at p=617. Ordinary 613
          colliding pairs, CM 681. Pre-registered two-sided test: p=0.066.
          Fails. Status recorded as inconclusive; the record itself notes
          that "every standard alternative framing of the identical data
          (one-sided Fisher, two-proportion z) sits just inside" 0.05.
        adversarial_reading: >-
          The very first thing the record does after a failed pre-registered
          test is enumerate the alternative framings that would have passed.
          That is disclosed honestly, but it is also the first look at the
          garden of forking paths.
      - step: 2
        what_happened: >-
          EXP-MONO-cb905d adds a group-uniform arm and defines P3 =
          (gu_ord/tr_ord)/(gu_cm/tr_cm). The archived Fisher test on the new
          arm gives p=0.330. The Red Team then finds that test misspecified
          and replaces it with the log-ratio delta method: p=0.0248. Passes.
        adversarial_reading: >-
          The replacement statistic does not discard the failed step-1
          comparison. It MULTIPLIES it in: P3 = (gu_ord/gu_cm) * (tr_cm/tr_ord),
          and tr_cm/tr_ord is exactly step 1's 681/613. Numerically,
          log(681/613) = +0.105197 out of a total log P3 of +0.150422 -- 69.9%.
          So the "corrected, nominally significant" cell-1 result is, to
          roughly seven tenths, the step-1 result restated, with a second,
          weaker, concordant component added. It is not an independent
          confirmation of step 1; it is step 1 plus a tailwind. The evidence
          record EV-MONO-c0bf6d discloses "third consecutive borderline
          statistic on the same cell" but does not disclose that the third is
          mostly a re-expression of the first.
      - step: 3
        what_happened: >-
          EXP-MONO-005b49 runs a genuinely independent second cell with the
          corrected method pre-registered. p=0.5410. Fails.
        adversarial_reading: >-
          This is the one clean, pre-registered, independent test in the
          entire chain, and it is the one that failed.
      - step: 4
        what_happened: >-
          The failure is reinterpreted as a power deficit (correctly: 14%
          power at cell 1's observed effect) and a new, never-pre-registered
          cross-cell combination rule is introduced. It assigns cell 1 87.0%
          of the weight. p=0.0207. Passes.
        adversarial_reading: >-
          The combination rule is textbook-correct in isolation, and I
          reproduce its arithmetic. But it was chosen after both results were
          known, and the specific rule chosen is the one that maximally
          up-weights the cell carrying the original blip. The alternative
          combination the same reviewer computed on the same data (Fisher,
          p=0.0713) does not pass, and it was set aside with a
          methodological argument constructed after both numbers were in
          hand. A reviewer who suspected motivated reasoning would point at
          exactly this: at every branch the chain took, the branch taken was
          the one that preserved the p=617 blip and increased its weight.
    is_the_steelman_actually_right: >-
      Yes, and it can be settled without adjudicating anyone's motives,
      because the exact computation removes the need to. At cell 1 the true
      effect is EXACTLY ZERO -- the two curves are identical in every
      invariant the statistic depends on. So the 681-vs-613 asymmetry is
      noise with certainty, not with probability. Everything the chain built
      on top of it inherited that. I want to be precise about what this does
      and does not indict: it does NOT show any step was dishonest, and I
      found no step that was mathematically wrong in isolation. The
      test-mismatch fix (CORR-20260904-d0205d) was a genuine defect genuinely
      found; the power analysis was correct and its sensitivity controls
      passed; the pooled arithmetic is right. What it shows is that a
      sequence of individually-correct corrections applied to a
      never-re-measured fluctuation produces a confident wrong answer, and
      that no amount of statistical care downstream can repair it. The only
      repair available was upstream: measure the same cell again with an
      independent seed, or -- much cheaper -- compute the answer.
    the_uncounted_look_nobody_counted: >-
      RUN-MONO-cb905d-1's own Part B already ran 100 additional cross-prime
      matched-(N,tau) ordinary-vs-CM comparisons, each with its own Fisher
      test, and none of them entered the multiplicity family the evidence
      records discuss. That is 100 already-executed tests of the same
      hypothesis, discarded from the accounting as "exploratory context."

  # ===================================================================
  # JB3 (b) THE CM-VARIANT CONFOUND, QUANTITATIVELY BOUNDED
  # ===================================================================
  jb3b_cm_variant_confound:
    verdict: >-
      The confound is real, it is WORSE-STRUCTURED than the prior round
      described, and it is now quantitatively bounded for the first time --
      which was item (b) of the Coordinator's own flagged gaps. It is also no
      longer the operative alternative explanation, because the exact
      computation supersedes it.
    finding_1_the_variant_is_not_a_free_choice: >-
      The prior round (OBJ-J4-1) reads the j=1728/j=0 split as an incidental
      consequence of Stage 0 accepting "whichever of the two happens to match
      at the found prime," and recommends fixing the variant across cells.
      That recommendation cannot be honored as stated. Two curves over the
      same F_p with the same N have the same trace t, hence (Tate) are
      isogenous, hence have endomorphism rings in the SAME imaginary
      quadratic field K = Q(sqrt(t^2-4p)). A j=1728 curve has End = Z[i], so
      it can appear in a same-prime matched cell only when K = Q(i); a j=0
      curve has End = Z[zeta_3], so only when K = Q(sqrt(-3)). Verified:
        cell 1: t = 38,  t^2-4p = -1024  = 16^2 * (-4) -> K = Q(i),        j=1728 forced
        cell 2: t = -58, t^2-4p = -10800 = 60^2 * (-3) -> K = Q(sqrt(-3)), j=0    forced
      The variant is a deterministic function of (p, N). "Restrict Stage 0 to
      one fixed j-invariant" is therefore not a de-confounding control; it is
      a restriction to one CM field, which changes the population of cells
      rather than holding a nuisance variable fixed.
    finding_2_this_is_not_CM_versus_non_CM: >-
      Every ordinary elliptic curve over a finite field has complex
      multiplication -- End is an order in an imaginary quadratic field. At a
      matched same-prime cell both curves lie in the same isogeny class and
      the same field; they differ only in the CONDUCTOR of their order, i.e.
      their level on the isogeny volcano. Because h(-3) = h(-4) = 1, the
      j in {0,1728} member is always the unique crater curve (conductor 1) and
      the "ordinary" member is always strictly below it (conductor f | 16 at
      cell 1, f | 60 at cell 2, uncontrolled and unmeasured by the design).
      Calling this "CM vs ordinary" is a misnomer that has been carried
      through every record in the chain, and it makes the claim sound more
      general than the object permits.
    finding_3_CM_and_extra_automorphisms_are_perfectly_confounded_by_construction: >-
      j=0 and j=1728 are exactly the two loci with Aut of order 6 and 4 rather
      than 2. The design's CM arm is, by its own admission rule, nothing but
      those two curves. H-MONO-1d50ac states this deliberately ("deliberately
      INCLUDED here as the object of study, not excluded as an automorphism
      artifact"), which discloses the confound but does not resolve it: no
      measurement in this design can separate "endomorphism ring" from "extra
      automorphisms."
    finding_4_the_quantitative_bound: >-
      The exact computation removes the need to argue about which label is
      operative, because it names the actual variable. Both arms' rates
      depend on the curve ONLY through (N, tau, #E[4]). Across the 84
      matched (tau>1) cells of RUN-MONO-cb905d-1's Part B panel, the exact
      ordinary and CM rates are IDENTICAL in 79 cells and differ in 5, always
      because #E[4]_CM = 16 while #E[4]_ord = 8, never the reverse:
        p_ord=613  p_cm=641  j1728 N=592  exact (cm-ord)/ord = -0.455%  observed = -1.85%
        p_ord=2297 p_cm=2417 j1728 N=2320 exact = -0.115%  observed =  +5.44%
        p_ord=2671 p_cm=2801 j1728 N=2704 exact = -0.099%  observed =  +2.88%
        p_ord=2677 p_cm=2833 j0    N=2736 exact = -0.098%  observed =  +9.15%
        p_ord=2711 p_cm=2833 j0    N=2736 exact = -0.098%  observed = +28.10%
      and at cell 2 itself, exact = -0.074%, observed = -4.08%. So there IS a
      genuine, systematic CM-linked structural effect -- crater curves in
      these classes carry strictly more rational 4-torsion -- and its size is
      between 0.07% and 0.46% relative, always with the CM curve LOWER, i.e.
      in the direction that makes P3 < 1, the OPPOSITE of the reported
      signal. The observed per-cell differences in the same cells span -1.85%
      to +28.10% with random signs: one to two orders of magnitude larger
      than the true effect, which is the definition of noise-dominated.
    conclusion: >-
      The variant confound is bounded at <= 0.46% relative and points the
      wrong way. It is therefore NOT the alternative explanation for a 16%
      signal. The alternative explanation is sampling noise, and it is
      established by the exact values, not inferred from the confound.

  # ===================================================================
  # JB3 (c) THE REUSED TRANSVERSAL ARM
  # ===================================================================
  jb3c_transversal_arm_reuse:
    verdict: >-
      I found NO mathematical defect in the transversal construction itself.
      I re-derived it from first principles and it does exactly what
      H-MONO-45183a B-1/B-2 says it does. But the reuse carries a different
      and more serious problem than a hidden bug, and the joint's framing
      ("could it carry some other, still-undiscovered defect") points at the
      wrong risk.
    the_construction_is_correct: >-
      measure_curve draws 3 distinct factor-base x-coordinates uniformly
      without replacement, lifts each by a fixed sign rule, forms the 4 signed
      sums with eps_1 = +1, and counts equal x-coordinates among the C(4,2)=6
      class pairs. I confirmed by derivation that classes (c1,c2) and (c3,c4)
      collide iff P1+P2 or P1-P2 lies in E[2]\{O}, and symmetrically for the
      other index pairs; that exactly one of the two fires per related
      x-pair; that the condition depends only on the unordered x-pair, which
      is why the fixed and random sign arms are byte-identical (independently
      re-confirming EXP-MONO-12ce1c OBJ-6's tautology finding by a second
      route); and that the resulting expectation is the exact formula above,
      whose leading term is Part B's 6(tau-1)/N. Brute-force agreement to
      <1e-14 on 20 curves.
    the_real_problem_is_not_a_bug_it_is_n_equals_1: >-
      The p=617 transversal counts (613 ordinary, 681 CM) were produced once,
      by RUN-MONO-64aaa4-1, and have since been consumed verbatim by
      RUN-MONO-cb905d-1 (part_b.p617_same_prime_cell_reused) and by
      RUN-MONO-cb905d-2 (part_a.transversal_arm_reused_from). They appear as
      the DENOMINATORS of P1 and P2 at cell 1 and therefore as the dominant
      term of the pooled headline. A reused measurement is not a replicated
      measurement: it has zero additional information and full additional
      leverage. Against its exact expectation of 627.18, the CM count of 681
      is +2.18 sigma; the ordinary count of 613 is -0.58 sigma. The single
      cheapest empirical check anyone could have run at any point in this
      chain -- re-measure the SAME two curves with a different seed label --
      was never run, and would have cost about one second.
    an_additional_construction_defect_i_did_find: >-
      construct_ordinary explicitly rejects supersingular candidates
      ("if N % p == 1: continue"), but construct_cm_j0 and construct_cm_j1728
      do NOT. Consequently 64 of the 100 cross-prime cells in
      RUN-MONO-cb905d-1's Part B panel have a SUPERSINGULAR curve on the "CM"
      side (N = p_cm + 1; 58 distinct such curves), whose endomorphism ring is
      a maximal order in a quaternion algebra, not an imaginary quadratic
      order. That panel is described throughout as a CM-vs-ordinary panel.
      This does not affect cells 1 or 2 (both CM curves there are verified
      ordinary: 617 = 1 mod 4, 3541 = 1 mod 3, and N != p+1 in both cases),
      and it does not affect my exact formula, which is purely
      group-theoretic and which I verified on supersingular curves as well.
      It does mean that any future use of the 100-cell panel as evidence
      about ordinary CM curves must first partition it.

  # ===================================================================
  # NULL AND NEARBY-OBJECT CONTROLS
  # ===================================================================
  null_and_nearby_object_controls:
    - id: NC-1
      name: The null object of the same shape (docs/inventor-protocol.md section 3, item 2)
      status: WAS_MISSING_I_SUPPLIED_IT
      what_it_is: >-
        The exact expectation is the ideal null object: the same quantity,
        same shape, computed on the same curves with the sampling removed.
      result: >-
        Exact P3 = 1.00000000 (cell 1) and 0.99957533 (cell 2). The measured
        1.1623 and 1.1119 do not match the null object; they exceed it by
        16% and 11%. Under docs/inventor-protocol.md section 3 this is a
        CONTROLLED NULL, not a finding.
    - id: NC-2
      name: "Ask what the measured quantity should do as the destroying parameter increases (section 3, item 1)"
      status: WAS_MISSING_I_SUPPLIED_IT
      what_it_is: >-
        The parameter that must destroy a sampling artifact is n_tuples. A
        genuine effect converges to its exact value as n_tuples -> infinity;
        an artifact does not.
      result: >-
        The measured P3 must converge to 1.00000000 at cell 1 and 0.99957533
        at cell 2. It cannot converge to 1.1557. No convergence check was
        ever run: n_tuples was fixed at 20,000 for every arm of every run in
        this chain, so the one diagnostic that would have exposed the
        artifact was structurally unavailable.
    - id: NC-3
      name: Nearby object where the effect must be absent
      status: I_RAN_IT
      what_it_is: >-
        Two curves at matched (N, tau) with EQUAL #E[4]. By the exact formula
        their rates are identical, so any measured difference is pure noise.
      result: >-
        79 of the 84 matched (tau>1) cells in the archived Part B panel are
        exactly such objects. Their measured ordinary-vs-CM differences are
        distributed exactly as noise. Pooled over the 65 cells with no shared
        curve: log(rate_ord/rate_cm) = -0.016282 +/- 0.009994, z = -1.63,
        p = 0.103, ratio 0.9838 -- consistent with the exact prediction of 0.
        Cell 1's own transversal contribution, log(613/681) = -0.105197, is
        6.5x larger than this 65-cell pooled estimate and 1.6 sigma from it.
    - id: NC-4
      name: Calibration of the variance model against 145 archived measurements
      status: I_RAN_IT
      result: >-
        Against my exact expectations: mean z = -0.010, sd = 0.915 over 145
        distinct curve-measurements (ideal 0 and 1); 2 of 145 exceed |z|=1.96
        where 7.2 are expected. Against Part B's closed form instead: ordinary
        curves mean z = -0.002 but CM curves mean z = +0.293 -- a systematic
        split that is entirely an artifact of the closed form's missing
        O(1/N) F-term, not of the endomorphism ring. This is a concrete
        example of the failure mode this whole lane has been chasing: an
        approximate model produces a spurious CM-vs-ordinary asymmetry.
    - id: NC-5
      name: "proves_too_much control named in the review plan for JB3"
      status: I_RAN_IT
      required_by_plan: >-
        "An adversarial null construction that can be applied identically to
        reject ANY positive result in this lane's history ... is not actually
        targeted and should be discarded as overbroad."
      result: PASSED_the_attack_is_discriminating
      objects_tested:
        - object: "EXP-MONO-cb905d amendment v1's sampler-uniformity proof (known TRUE)"
          outcome: >-
            My method ENDORSES it. My exact group-uniform formula presupposes
            exact 1/N-per-point uniformity, and its predictions match the
            corrected run's counts closely -- most sharply, 233.31 predicted
            versus 233 observed for cell 2's ordinary curve (z = -0.02). Had
            the sampler not been 1/N-uniform, my predictions would have been
            systematically wrong. My argument therefore corroborates the
            result the plan named as the test case, rather than refuting it.
        - object: "sample_group_uniform_v1_biased (known FALSE / genuinely biased)"
          outcome: >-
            My method FLAGS it. Exact slot counting gives the 2-torsion points
            twice a generic point's weight and zero weight to O -- a real,
            structural bias, not a fluctuation. Correctly discriminated.
        - object: "H-MONO-45183a Part A's (Z/2)^(m-2) sign-class group (known TRUE)"
          outcome: >-
            My derivation USES it (the 4 sign classes with eps_1 = +1 are the
            starting point) and reproduces the observed counts, corroborating it.
        - object: "H-MONO-45183a Part B's 6(tau-1)/N closed form (partly true)"
          outcome: >-
            My method neither endorses nor dismisses it wholesale: it
            identifies a real, systematic +0.07% to +5.08% (mean +0.60%)
            incompleteness and gives the exact repair. An overbroad debunking
            template could not have produced a repair.
      conclusion: >-
        The failure signature named in the plan is not triggered. The
        argument confirms three results in this lane, repairs a fourth, and
        refutes only the one under review.

  # ===================================================================
  # UNCHARGED TERMS
  # ===================================================================
  cost_model_challenges:
    - id: UC-1
      severity: high
      term: Overdispersion of the group-uniform counts, omitted from the delta-method variance
      finding: >-
        The delta method as implemented uses Var(log X) ~= 1/X, which assumes
        Var(X) = E[X] (Poisson). The measured quantity is not a Bernoulli
        count of tuples; it is a sum over tuples of the NUMBER of colliding
        class pairs in that tuple, which clusters. The archived aggregates
        pin this down: 1470 pairs across 1049 tuples (cell 1 ordinary),
        1405/1005, 233/167, 201/151. Reconstructing the minimum-spread
        per-tuple distribution consistent with those aggregates gives a
        rigorous LOWER BOUND on the overdispersion factor phi = Var(K)/E[K]:
          group-uniform: 1.499, 1.499, 1.555, 1.487
          transversal:   0.969, 0.972, 0.995, 0.995
        The group-uniform arm's variance is therefore at least ~50% larger
        than assumed, and the transversal arm's is not -- a systematic
        asymmetry the shared 1/count formula cannot represent.
      consequence: >-
        cell 1: p 0.0248 -> 0.0351.  cell 2: p 0.5410 -> 0.5698.
        POOLED: z 2.3139 -> 2.1713, p 0.020673 -> 0.029909.
        The pooled SE is understated by a factor 1.0664, so the nominal
        alpha = 0.05 pooled test has a TRUE SIZE of 0.0661 from this term
        alone, before any multiplicity accounting. These are lower bounds:
        the true phi is at least the value above.
    - id: UC-2
      severity: high
      term: The p=617 transversal counts are one measurement charged as three
      finding: >-
        613 and 681 were measured once (RUN-MONO-64aaa4-1) and reused by
        RUN-MONO-cb905d-1 and RUN-MONO-cb905d-2. They contribute 69.9% of
        cell 1's log P3 and, at cell 1's 87.0% pooled weight, 63.3% of the
        pooled signal. The evidence records treat the corrected cell-1 P3 as
        a new result relative to EXP-MONO-64aaa4's p=0.066; it is 70% the
        same numbers.
      consequence: >-
        The "third consecutive borderline statistic on the same cell" is
        substantially correlated with the first, so any multiplicity
        correction that treats them as separate looks both overcounts the
        family size and undercounts the dependence. Neither the evidence nor
        the decision records disclose the overlap.
    - id: UC-3
      severity: medium
      term: 100 already-executed comparisons excluded from the multiplicity family
      finding: >-
        RUN-MONO-cb905d-1 Part B ran 100 cross-prime matched-(N,tau)
        ordinary-vs-CM comparisons with Fisher tests. They test the same
        hypothesis and were never counted.
      consequence: >-
        The effective family size behind "the corrected p is 0.025" is not 2
        or 3 but of order 100, and the panel's own pooled answer (z = -1.63)
        is null.
    - id: UC-4
      severity: medium
      term: The cost of the answer, versus the cost of the estimate
      finding: >-
        The quantity is exactly computable in O(p) time and O(p) memory per
        curve -- about one second at these primes -- with zero uncertainty.
        Three experiments, two correction records, four review rounds and one
        breakthrough-tier escalation have been spent producing a +/-6.7%
        Monte Carlo estimate of a number whose exact value is 1.00000000. No
        record in the chain charges the cost of NOT computing it.
    - id: UC-5
      severity: low
      term: Data-estimated pooling weights
      finding: >-
        The inverse-variance weights are computed from the same counts that
        produce the effect estimates. At counts of 94-233 this induces a
        small upward bias in |z|. Immaterial next to UC-1 and UC-2, recorded
        for completeness.
    - id: UC-6
      severity: informational
      term: Honest power against the effect that actually exists
      finding: >-
        The prior round recommended scaling to ~209,000 draws per curve per
        arm for 80% power. That targets an effect size (cell 1's observed
        log-ratio) which the exact computation shows does not exist. Against
        the effect that DOES exist at cell 2 (log P3 = -4.2476e-4), 80% power
        requires about 3.0e10 draws per curve per arm. At cell 1 the exact
        effect is zero, so no sample size yields power above alpha: every
        rejection there is by construction a false positive.

  # ===================================================================
  # OBJECTIONS
  # ===================================================================
  objections:
    - id: OBJ-B1
      severity: critical
      title: The pooled signal is refuted by exact computation, not merely weakened
      target: >-
        ledger/evidence/EV-MONO-afcb01.yaml (pooled estimate observation);
        ledger/decisions/DEC-20260904-ffaebb.yaml rationale item 2;
        ledger/hypotheses/H-MONO-1d50ac.yaml status_note_2026_09_04_b
      finding: >-
        Exact P3 = 1.00000000 at cell 1 and 0.99957533 at cell 2, against a
        pooled measured 1.1557. At cell 1 the two curves agree in N, tau,
        n_FB and #E[4], and N=580 with tau=4 forces the group Z/2 x Z/290, so
        the agreement is not a coincidence of this pair but a property of the
        cell. Cell 1 can carry no true effect and carries 87% of the weight.
      evidence: >-
        reviews/red-team-breakthrough/{exact.py,gu.py,gu2.py,verify.py};
        brute-force agreement <1e-14 on 20 curves; 145-measurement calibration
        (mean z -0.010, sd 0.915).
      consequence: >-
        No status advancement of H-MONO-1d50ac toward "supported" is
        defensible on this evidence, and a third cell would not change that.
        The correct disposition is that prediction (A) holds exactly at cell
        1 and prediction (B) holds at cell 2 at 0.042% in the OPPOSITE
        direction from the measurement -- i.e. the measurement does not
        detect the effect it was built to detect.
    - id: OBJ-B2
      severity: critical
      title: Part B's closed form is incomplete, and the completion is 4-torsion, not endomorphism ring
      target: ledger/hypotheses/H-MONO-45183a.yaml Part B (G6/G7); its own residual_collision_risk clause
      finding: >-
        The exact transversal rate is 3((tau-1)n - F)/(n(n-1)) with
        n = (N-tau)/2 and F = (#E[4]-tau)/2. Part B's 6(tau-1)/N is the
        leading term with F dropped and n-1 replaced by n. Across 145
        archived curve-measurements the closed form is low by +0.07% to
        +5.08% (mean +0.60%), and this bias is what produces the spurious
        ordinary/CM split in Part B's own se_deviation figures (ordinary mean
        -0.002, CM mean +0.293).
      consequence: >-
        H-MONO-45183a Part B's residual_collision_risk clause -- "If two
        curves with identical (N, tau) but different endomorphism rings gave
        different measured rates, the derivation would be incomplete" -- is
        answered: the derivation IS incomplete, but the missing variable is
        #E(F_p)[4], and any two curves sharing (N, tau, #E[4]) have exactly
        equal rates whatever their endomorphism rings. This is a positive,
        deterministic result the lane should take, and it is not what the
        pooled statistic claims.
    - id: OBJ-B3
      severity: high
      title: The two cells' concordance is mechanistically empty
      target: ledger/evidence/EV-MONO-afcb01.yaml ("strikingly concordant" point estimates; Cochran's Q = 0.057)
      finding: >-
        Decomposed by arm, cell 1's signal is +0.105 transversal / +0.045
        group-uniform; cell 2's is -0.042 transversal / +0.148 group-uniform.
        The transversal arm carries 69.9% of cell 1 and MINUS 39.3% of cell 2.
        Cochran's Q on the composite P3 cannot see this because the composite
        hides it.
      consequence: >-
        "No detected heterogeneity" was already correctly caveated as
        low-powered; it is additionally the wrong statistic. Concordance of a
        product does not imply concordance of its factors, and a mechanistic
        claim must be tested on the factors.
    - id: OBJ-B4
      severity: high
      title: The variance model is misspecified in the arm that matters
      target: experiments/EXP-MONO-005b49/specification.yaml significance_test_pre_registered_before_any_draw
      finding: See UC-1.
      consequence: >-
        True size of the nominal alpha=0.05 pooled test is 0.0661 from this
        term alone. Pre-registration protected the test's SELECTION but not
        its SPECIFICATION; the same class of error CORR-20260904-d0205d
        corrected once is present again, in the variance rather than the
        statistic.
    - id: OBJ-B5
      severity: medium
      title: >-
        The phrase "CM vs ordinary" mislabels the comparison in every record
        in the chain
      target: H-MONO-1d50ac statement/mechanism; EV-MONO-c0bf6d; EV-MONO-afcb01; DEC-20260904-8c17d5; DEC-20260904-ffaebb
      finding: See jb3b findings 1-3. Same-prime matched curves are isogenous, share a CM field, and differ only in conductor; the CM member is forced to be the unique crater curve, hence forced to have extra automorphisms.
      consequence: >-
        Records should say "crater (maximal-order) curve versus a
        lower-conductor curve in the same isogeny class, with automorphism
        group confounded," not "CM versus ordinary." The current phrasing
        inflates scope in a way that survives into any downstream citation.
    - id: OBJ-B6
      severity: medium
      title: Supersingular curves are silently present in the "CM" arm of the 100-cell panel
      target: experiments/EXP-MONO-64aaa4/implementation/run_experiment.py construct_cm_j0 / construct_cm_j1728
      finding: >-
        Neither CM constructor rejects supersingular candidates, though
        construct_ordinary does. 64 of the 100 Part B cells have N = p_cm + 1
        on the CM side (58 distinct curves).
      consequence: >-
        The Part B panel must be partitioned before any use as evidence about
        ordinary CM curves. Cells 1 and 2 are unaffected (both verified
        ordinary).
    - id: OBJ-B7
      severity: medium
      title: The Coordinator's recorded current prior is wrong, in the direction it flagged as its own risk
      target: ledger/handoffs/TASK-20260904-4580e8.yaml review_plan.coordinator_prior
      finding: >-
        The prior holds, at low-to-moderate confidence, that "the pooled
        estimate is probably a genuine, if modest, signal," resting on the
        observation that each correction was independently verified. Each was.
        The prior's implicit inference -- that verified corrections compose
        into a verified result -- does not hold, because every verification in
        the chain checked a STATISTIC against the DATA, and none checked the
        DATA against the OBJECT. The prior's own flagged item (c),
        correlated blind spots from repeated involvement, is the accurate
        one: five sessions in a row treated an exactly computable quantity as
        one that had to be estimated.
      consequence: >-
        Recorded so the eventual decision can note that this Coordinator's
        prior was overturned a second consecutive time, in the opposite
        direction from the first -- which is itself the strongest available
        argument for keeping this lane's escalation discipline.

  # ===================================================================
  # JB4 -- CLOSURE STANDARD
  # ===================================================================
  jb4_closure_standard:
    verdict: holds_as_a_finding
    note: >-
      Written to be usable verbatim regardless of this round's verdict on
      JB1-JB3, per the joint's own instruction. The "IF TRUE" statement is
      constructed as if the pooled result were accepted; my own verdict is
      that it should not be, and that is recorded separately above.

    if_true_the_narrowest_true_claim: >-
      IF the pooled two-cell estimate were accepted as genuine, it would
      establish exactly this and nothing more: that for two specific pairs of
      elliptic curves -- (p=617, A=340/B=362 ordinary and A=69/B=0 with
      j=1728) and (p=3541, A=577/B=1628 ordinary and A=0/B=2728 with j=0),
      each pair sharing (N, tau) = (580, 4) and (3600, 4) respectively -- the
      ratio [collision rate under group-uniform point sampling] /
      [collision rate under transversal factor-base sampling], for the m=4
      three-point four-sign-class root-multiplicity construction of
      EXP-MONO-64aaa4, is about 15.6% larger on the ordinary member than on
      the j in {0,1728} member, at nominal two-sided p ~ 0.02-0.03, at claim
      tier TOY. That is a statement about a sampling-construction artifact
      measured on four named curves. It would corroborate H-MONO-45183a Part
      B's own residual_collision_risk clause in the sense that (N,tau) alone
      would not determine the measured rate, and it would identify a
      curve-specific deviation of a kind that had not previously been
      exhibited in this lane at a genuinely matched cell.

    even_if_true_this_does_not_establish:
      - >-
        ANYTHING AT CRYPTOGRAPHIC SCALE. The tested primes are 617 and 3541,
        about 2^9.3 and 2^11.8; a standardized curve has N ~ 2^256. That is
        roughly 74 orders of magnitude in N and 27x in bit-length. The
        measured quantity is 6(tau-1)/N to leading order, i.e. ~2^-251 at
        cryptographic size, so the phenomenon does not merely shrink -- it
        falls below any observable threshold. Observing a single collision
        would take ~2^251 tuples; distinguishing the true O(1/N) structural
        term would take ~2^732 (the required sample scales as N^3). No
        transfer argument exists, and none is offered by any record in this
        chain.
      - >-
        ANYTHING ABOUT m != 4. The four sign classes, the six class pairs,
        and the entire B-1/B-2 combinatorics are specific to m=4. Nothing
        here constrains m=3 or m>=5.
      - >-
        ANY ECDLP, RELATION-RATE, EXPONENT, OR COST CLAIM IN EITHER
        DIRECTION. The measured object is a coincidence rate among the four
        signed sums of a 3-point tuple. It is not a Semaev relation rate, not
        a factor-base hit rate, and not an input to any cost model. The
        hypothesis record already says this; it must not drift.
      - >-
        THAT THE ENDOMORPHISM RING IS THE OPERATIVE VARIABLE. Both curves in a
        same-prime matched cell are isogenous and have endomorphism rings in
        the same imaginary quadratic field, differing only in conductor; the
        CM member is forced by the discriminant to be j=1728 or j=0, i.e. one
        of exactly the two curves with extra automorphisms. "Endomorphism
        ring", "position on the isogeny volcano" and "automorphism group" are
        perfectly confounded by the design and cannot be separated by any
        measurement it can make.
      - >-
        THAT KN-OPEN-009 IS RESOLVED, ADVANCED, OR EVEN ADDRESSED. Three
        independent reasons, any one sufficient. (i) KN-OPEN-009's own text
        ends: "Any exceptional-curve claim must exclude j=0/1728
        extra-automorphism artifacts from the random controls." This design
        makes j in {0,1728} its entire CM arm, so its output is by
        construction the artifact class that record requires be excluded.
        (ii) KN-OPEN-009 asks about the geometric monodromy / Galois group of
        the m-th Semaev summation cover and the Frobenius cycle-type census.
        The observable here is root-multiplicity collision counting, not a
        cycle-type census; H-MONO-45183a Part A already reports the cycle-type
        observable constant (EV-MONO-a0a89c OBS-5/OBS-6). The link is by
        analogy, not derivation. (iii) KN-OPEN-009 concerns relation rates for
        index calculus; see the previous item.
      - >-
        THAT H-MONO-45183a PART B IS REFUTED AS A LEADING-ORDER DERIVATION.
        Part B is a leading-order statement and is correct as such; its actual
        error is the O(1/N) term identified in OBJ-B2 (mean +0.60% relative),
        not a 15.6% effect. A 15.6% discrepancy is not a deviation Part B's
        derivation could produce and would have indicated an implementation
        fault, not an incomplete formula.
      - >-
        THAT ANY GENERAL "ENDOMORPHISM RING MATTERS FOR RELATION RATES" CLAIM
        HOLDS. The measured artifact is a property of two specific SAMPLING
        CONSTRUCTIONS (which points the sampler can reach), not of the curve's
        arithmetic as an attack would encounter it. The gu/tr ratio exists
        only because the transversal sampler structurally excludes 2-torsion;
        it is a fact about the instrument.
      - >-
        THAT A REPLICATION SUCCEEDED. Cell 2's own pre-registered test did not
        reach significance. What the pooled estimate shows is that combining a
        significant cell with a non-significant, directionally-concordant one
        can yield a smaller p than either -- an arithmetic property of
        inverse-variance weighting, not a replication.

    pareto_honesty:
      object: >-
        The expected m=4 root-multiplicity collision rate, per tuple, for
        (a) transversal factor-base sampling and (b) group-uniform sampling,
        on an elliptic curve E/F_p.
      depth_of_verified_structure: >-
        DETERMINISTIC and EXACT for the closed forms in
        counterexample_or_mutation (derived here, verified against brute-force
        enumeration to <1e-14 on 20 curves spanning tau in {1,2,4}, j in
        {0,1728,generic}, ordinary and supersingular, and validated against
        145 independent archived measurements). PROBABILISTIC and toy-tier
        for everything the executed experiments measured. These are not
        interchangeable and must not be recorded as if they were.
      dominated_by: >-
        Exact evaluation of the closed forms above, which Pareto-dominates the
        Monte Carlo estimate on EVERY axis: time (about 1 CPU-second per
        curve versus 4-8 seconds per run plus three experiments, two
        corrections, four review rounds and one breakthrough escalation),
        memory (O(p) versus O(p)), and uncertainty (zero versus +/-6.7% on
        log P3). Checked against every alternative I could name for this
        object: the Monte Carlo estimate is not on the frontier at any point.
      sota_delta: >-
        Exact: P3 = 1.00000000 (cell 1) and 0.99957533 (cell 2), no error
        bars. Measured: 1.162325 +/- 6.7% and 1.111890 +/- 17.4%. The exact
        method is better by an unbounded factor in precision, roughly four
        orders of magnitude in cumulative wall-clock and review cost, and --
        decisively -- it gets the sign right at cell 2, which the measurement
        does not.
      enumerated_closure_at_the_section_4_standard:
        named_obstruction: >-
          The m=4 collision rate under both sampling constructions is an exact
          function of (N, tau, #E(F_p)[4]) alone. Collision for an index pair
          requires P_i +/- P_j in E[2]\{O}, which for factor-base sampling
          reduces to "the two x-coordinates are exchanged by one of the tau-1
          two-torsion translations"; the number of such related x-pairs is
          ((tau-1)n - F)/2 with F = (#E[4]-tau)/2, and for group-uniform
          sampling the additional term is the probability that one of the
          three drawn points is itself in E[2]. Neither expression contains
          the endomorphism ring, the CM discriminant, the conductor, or the
          j-invariant except through #E[4]. Therefore the endomorphism ring
          CANNOT produce a curve-specific deviation in this observable beyond
          what #E[4] already accounts for -- and #E[4] contributes a term of
          relative size O(1/N), bounded at 0.46% across every matched cell in
          the archive.
        argument: See counterexample_or_mutation; verification scripts filed alongside this report.
        redirection_forward_guidance: >-
          The live and interesting residue is arithmetic, not statistical:
          crater curves in these classes appear to carry MORE rational
          4-torsion than their lower-conductor partners at the same (N,tau).
          In the archive this holds 5 times out of 5 where #E[4] differs at
          all (#E[4]_CM = 16 vs #E[4]_ord = 8), plus cell 2 itself, and never
          the reverse. Whether that is a theorem about Frobenius congruences
          on the crater is a question for exact enumeration over many cells,
          costs no sampling, and would be a real if small result. What is
          CLOSED is the search for an endomorphism-ring-linked deviation in
          THIS observable at m=4: there is none beyond #E[4], and the #E[4]
          term is O(1/N). Still open and untouched by this closure: m != 4;
          the Semaev cycle-type/monodromy observable KN-OPEN-009 actually
          asks about; and any observable defined on relation collection
          rather than on this sampling construction.

