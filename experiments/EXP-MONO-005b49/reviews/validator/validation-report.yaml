    - control: "specification.yaml sha256 vs manifest.yaml binding"
      result: match

  heuristic_validation_checks: []
  cost_model_checks: []
  proof_architecture_checks: []

  limitations:
    - >-
      This report addresses J1-CELL-SELECTION-INTEGRITY and
      J2-TEST-CORRECTNESS (with the associated blind_rederivation) only.
      It does not evaluate J3-REPLICATION-LOGIC (statistical power at
      this cell's counts) or J4-CROSS-CELL-SYNTHESIS (meta-analytic
      combination with the p=617 cell, or the cross-cell P1/P2 pattern) --
      both are the red-team's owned joints per the task card. I note,
      without adjudicating, that a non-significant P3 at n=20000/curve
      with counts in the ~100-230 range does not by itself establish
      adequate power to detect an effect of the first cell's own observed
      size; this is exactly the question the task card assigns to J3, and
      I defer to that review.
    - >-
      My Stage-0 re-derivation was written independently (fresh code, not
      copied from EXP-MONO-005b49's own implementation/run_experiment.py)
      but necessarily follows the SAME documented construction (SHA-256
      domain-seeded curve search, declared unchanged from EXP-MONO-64aaa4)
      because that construction is the frozen contract's own declared
      input, not a free implementation choice. Exact agreement between my
      independent code and the archived results is therefore strong
      evidence against an implementation bug or a mismatch between what
      was reported and what the declared algorithm actually produces, but
      it does not independently re-derive or challenge the CHOICE of that
      construction itself (e.g., whether SHA-256 domain-seeding is an
      appropriate source of "randomness" for this measurement) -- that
      choice was already reviewed and is unchanged from prior, separately
      validated experiments (EXP-MONO-64aaa4, EXP-MONO-cb905d) per the
      contract's own `inputs.reused_unchanged_from_amendment` block.
    - >-
      I did not re-verify EXP-MONO-64aaa4's or EXP-MONO-cb905d's own prior
      validation history beyond reading the files needed to confirm what
      this experiment declares it reuses; those experiments' own
      validation/red-team reports are cited in specification.yaml's
      source_refs and are treated as already-settled per the contract's
      own text ("already independently verified correct by two disjoint
      reviewer methods"), not re-litigated here.
    - >-
      The Stage-1 raw-count reproduction (tr_ord/tr_cm/gu_ord/gu_cm) was
      performed using the SAME shared library files EXP-MONO-005b49's own
      script loads (measure_curve, measure_group_uniform_v2), run via a
      fresh driver I wrote, not via a wholly independent re-implementation
      of the sampling logic itself. This confirms the reported counts are
      reproducible and genuinely derive from the stated curve/domain
      parameters (ruling out fabrication, transcription error, or a
      silent parameter swap), but does not by itself re-certify the
      sampler's own mathematical correctness -- that correctness (the
      2p+1-slot group-uniform construction, and the m=4 transversal
      sign-class construction) was independently verified by disjoint
      reviewer methods in EXP-MONO-cb905d's and EXP-MONO-64aaa4's own
      prior review rounds, which this report did not re-derive from first
      principles (out of scope for J1/J2 as assigned here; see prior
      limitation).

  verdict: passed
  verdict_rationale: >-
    Both owned joints HOLD under independent, from-scratch re-derivation.
    J1: an independently written Stage-0 scan reproduces the exact cell
    (p=3541, N=3600, tau=4, cm_variant=j0, A/B values for both curves)
    after evaluating exactly 66 admissible primes ascending from 3001,
    with zero matches among the 65 preceding admissible primes, and the
    proves_too_much control (a planted earlier match at p=3011) is
    correctly detected rather than overridden -- confirming the method
    genuinely distinguishes "first" from "a match somewhere in range."
    J2: a blind recomputation of P1, P2, P3, log_ratio, the two variance
    terms, se, z, and the two-sided p-value from raw-result.json's own
    four counts alone -- performed before opening
    execution_report.yaml, implementation/run_experiment.py, or
    manifest.yaml -- reproduces every archived figure to full
    double-precision exactly, and the pre-registered log-ratio
    delta-method test is confirmed (by reading the implementation only
    afterward) to be the sole headline computation actually used, with
    the known-defective Fisher-exact test consistently and only labeled
    as diagnostic context (P5) in every artifact checked. This verdict is
    on J1 and J2 only and authorizes nothing beyond AGENTS.md's evidence
    rules: it does not itself decide H-MONO-1d50ac's status, does not
    adjudicate J3/J4 (replication-logic power or cross-cell synthesis),
    and supports no ECDLP, speedup, or cryptographic-scale claim. The
    underlying result (P3 not significant, p=0.5410, same direction as
    the first cell) is, per the frozen contract's own pre-registered
    prediction, a genuinely open, well-formed outcome -- this report
    certifies the MEASUREMENT and TEST are admissible evidence, not any
    particular reading of what the non-significant result means for
    H-MONO-1d50ac (that is the Coordinator's and the red-team's own
    joints to compose).

