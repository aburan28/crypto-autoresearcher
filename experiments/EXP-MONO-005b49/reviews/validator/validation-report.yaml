      status: present_frozen_hash_verified
      note: "frozen: true, execution_authorized: true, evidence_eligible: true, approved by coordinator; sha256 independently recomputed and matches manifest binding."
    - artifact: experiments/EXP-MONO-005b49/runs/RUN-MONO-005b49-1/{manifest.yaml,raw-result.json,command.txt,stdout.log,stderr.log,environment.json}
      status: present_and_internally_consistent
      note: "status: completed_valid; command matches artifacts; commit 0c0b863ab55687b98c17c27703cfa070d265cb5d recorded, dirty=true with 420 unrelated dirty files, disclosed in manifest.yaml's own dirty_note as not touching this run's inputs (specification.yaml, and the two read-only-loaded reference implementation files, none of which were among the dirty paths)."
    - artifact: experiments/EXP-MONO-005b49/execution_report.yaml
      status: present_consistent_with_raw_result_and_manifest
      note: "All stage0/stage1/stage2 figures restated match raw-result.json exactly (rounded in a few display fields only); budget_compliance and completion_gate_check both report within-budget and reproducibility confirmed by the Executor's own re-invocation."
    - artifact: experiments/EXP-MONO-64aaa4/implementation/run_experiment.py and implementation.md
      status: present_read_confirmed_source_of_reused_constructions
      note: "Curve construction, tau definition, transversal sampler, and Stage-0 admission rule all confirmed by direct reading to match what EXP-MONO-005b49's own script declares it reuses read-only."
    - artifact: experiments/EXP-MONO-cb905d/amendments/v1.yaml and implementation/run_experiment_v2_part_a_corrected.py
      status: present_read_confirmed_corrected_sampler_reused_not_the_deprecated_one
      note: "sample_group_uniform_v2_corrected matches amendment v1's new_construction text; sample_group_uniform_v1_biased is present but unused by EXP-MONO-005b49's own script."
