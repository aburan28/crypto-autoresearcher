      status: did_not_exist_at_time_of_review
      note: "Confirmed via ls before writing this report: no red-team/ or validator/ subdirectory existed prior to my own mkdir for this report; no sibling report was available to read."

  metric_recomputations:
    - metric: "EXP-MONO-005b49 P1, P2, P3, log_ratio, var_logP1, var_logP2, se, z, two_sided_p_value"
      recomputed_independently: true
      blind: true
      match: exact
    - metric: "Stage-0 cell (p, N, tau, cm_variant, A, B for both curves) at p=3541"
      recomputed_independently: true
      match: exact
    - metric: "Stage-0 scan count (primes_scanned=66, last_prime_scanned=3541) and first-match position"
      recomputed_independently: true
      match: exact
    - metric: "Stage-1 raw counts (tr_ord=98, tr_cm=94, gu_ord=233, gu_cm=201, gu tuples-with-collision 167/151)"
      recomputed_independently: true
