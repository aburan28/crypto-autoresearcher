experiment:
  id: EXP-MONO-005b49
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-09-04'
  hypothesis_id: H-MONO-1d50ac
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  coordinator_approval_rationale: >-
    APPROVED. This is DEC-20260904-8c17d5's own named next_action: a
    PRE-REGISTERED REPLICATION at a second, independent, SAME-PRIME
    matched-(N,tau) cell, applying the CORRECTED test methodology fixed
    BEFORE this run (not substituted post-hoc, as happened in
    EXP-MONO-cb905d's own RUN-2). The construction, sampler, and metric
    definitions are UNCHANGED from EXP-MONO-cb905d's own amendment v1
    (already independently verified correct by two disjoint reviewer
    methods); this contract's only new content is (a) a wider same-prime
    search range to find a SECOND matched cell distinct from p=617, and
    (b) the properly-specified significance test, pre-registered here
    rather than reconstructed after the fact.

  title: >-
    Pre-registered replication: apply the corrected OBJ-6 discriminating
    control and a properly-specified homogeneity-of-ratios test to a
    second, independent same-prime matched-(N,tau) cell

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection at scale.
    - Not an ECDLP cost, runtime, asymptotic, exponent, cryptographic-scale, or deployed-scheme claim.
    - >-
      Not a re-litigation of EXP-MONO-cb905d's own disposition
      (inconclusive, third consecutive borderline result); this contract
      is the named replication that record's own next_action calls for.
    - >-
      Not a claim that a second same-prime cell, if found, is drawn from
      any meaningfully different distribution than the first -- both are
      toy-scale, small-prime cells found by the same search procedure.
      This is a replication of the STATISTICAL TEST at a second cell, not
      a claim of population-level generality.
    - Not approved for any purpose beyond what this record states once run.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: whether a SECOND matched (p', N', tau') same-prime cell
      (p' != 617), under the SAME corrected transversal-vs-group-uniform
      construction and the SAME properly-specified significance test
      pre-registered here, shows the same DIRECTION of per-curve
      difference (P1 > P2, ordinary above CM) found at p=617, a different
      direction, or no material difference.
    what_no_outcome_can_support: >-
      No outcome establishes anything about m != 4, other CM discriminants
      beyond j in {0,1728}, extension fields, or any cost/exponent claim.
      A significant result at a SECOND cell, combined with the first,
      would be genuine replication-grade evidence for an endomorphism-
      ring-linked effect -- but even then remains toy-scale and does not
      by itself establish an (N,tau)-dependence formula for the effect's
      OWN magnitude (P1's own value, 2.398 at the first cell, already sits
      outside OBJ-6's reference band measured on other curves).

  inputs:
    reused_unchanged_from_amendment: >-
      experiments/EXP-MONO-cb905d/amendments/v1.yaml's group-uniform
      sampler construction (2p+1-slot rejection sampling, independently
      verified 1/N-uniform by two disjoint reviewer methods) and
      experiments/EXP-MONO-64aaa4's own transversal sampler and m=4
      construction (3 drawn points, 4 canonical sign classes), BYTE-
      IDENTICAL CODE REUSE where the underlying primitives are unchanged.
    stage0_search_range: >-
      Same-prime matched-(N,tau) cells (ordinary curve vs. a CM curve with
      j in {0,1728}) at primes in [3001, 20000], EXCLUDING p=617 by
      construction (already used). EXP-MONO-64aaa4's own Stage-0 search
      covered only [101,3000] and found exactly one same-prime match
      there (p=617); this contract searches a DISJOINT, wider range for a
      second one. If [3001,20000] yields zero same-prime matches, the
      run reports that as a `no_second_cell_found` outcome (see
      `outcomes` below) -- itself a reportable, falsifiable fact, not a
      failure to be silently extended past the pre-declared range.
    p_admission_rule: p prime, p == 617 excluded, supersingularity excluded (matching EXP-MONO-64aaa4's own admission rule).
    null_draws_per_curve: 20000
    domain: EXP-MONO-005b49/v1

  significance_test_pre_registered_before_any_draw: >-
    THE CORRECTED TEST, FIXED HERE, BEFORE THIS RUN, PER DEC-20260904-8c17d5's
    OWN NAMED REQUIREMENT ("pre-registered BEFORE the run rather than
    substituted post-hoc"). Given four counts -- gu_ord (group-uniform
    pairs-colliding count for the ordinary curve, out of ntuples=20000),
    tr_ord (transversal pairs-colliding count, reused or freshly measured
    per this contract's own construction), gu_cm, tr_cm -- compute:
    P1 = (gu_ord/ntuples) / (tr_ord/ntuples), P2 = (gu_cm/ntuples) /
    (tr_cm/ntuples), and a log-ratio delta-method Wald test:
    log_ratio = log(P1/P2); var_logP1 = 1/gu_ord + 1/tr_ord;
    var_logP2 = 1/gu_cm + 1/tr_cm; se = sqrt(var_logP1 + var_logP2);
    z = log_ratio / se; two_sided_p = 2*(1-Phi(|z|)). THIS IS THE ONLY
    significance test this contract authorizes as the headline P3
    statistic. A same-curve-only "any collision per tuple" Fisher-exact
    test (EXP-MONO-cb905d/RUN-2's own defective methodology) is
    EXPLICITLY PROHIBITED as a substitute or a secondary "headline" framing
    -- it may be reported as diagnostic context only, clearly labeled as
    the KNOWN-DEFECTIVE test kept for continuity/comparison, never as a
    second headline.

  stage_order:
    stage_0:
      name: search [3001,20000] for a second same-prime matched-(N,tau) cell
      compute: seconds to low minutes
      description: >-
        Enumerate primes in [3001,20000] (excluding 617, already used);
        for each, construct an ordinary curve and check for a CM candidate
        (j=0 or j=1728) at the SAME prime sharing (N,tau); report the
        first match found under a FIXED, declared prime-ascending scan
        order (smallest p first) -- fixed here, before any search, so cell
        selection cannot be influenced by a peek at later results.
      terminates_the_run_if: >-
        No same-prime matched cell exists anywhere in [3001,20000]. Report
        `no_second_cell_found`; this is itself the run's valid, reportable
        result (a fact about search-space scarcity within the declared
        range), not a failure requiring range expansion within this
        contract.
    stage_1:
      name: transversal and group-uniform measurement, both curves, second cell
      compute: seconds
      description: >-
        20000 draws per curve per arm (transversal, group-uniform),
        IDENTICAL construction to EXP-MONO-cb905d's own amendment v1.
        Unlike EXP-MONO-cb905d (which reused RUN-1's own already-archived
        transversal counts), THIS contract has no prior run for this new
        cell, so BOTH arms are freshly measured here.
    stage_2:
      name: pre-registered significance test (headline)
      compute: seconds
      description: >-
        Apply the log-ratio delta-method test defined above to the second
        cell's own four counts. Report P1, P2, P3(ratio-of-ratios), z,
        and the two-sided p-value. Compare the DIRECTION (does the
        ordinary curve's ratio exceed the CM curve's, matching p=617's own
        P1>P2 direction, or not) explicitly, in addition to significance.

  arms_and_controls:
    primary_test: The pre-registered log-ratio delta-method test defined above.
    diagnostic_only_secondary: >-
      The same-curve-only Fisher-exact "any collision per tuple" test may
      be additionally reported for continuity with EXP-MONO-cb905d's own
      (defective) methodology, EXPLICITLY LABELED as diagnostic-only and
      known-defective, never as a competing or alternative headline.
    dual_convention_control: >-
      NOT RE-RUN, per this lane's own established, twice-independently-
      confirmed tautology finding for this construction.

  metrics:
    primary:
      - "P1: ordinary curve's group-uniform/transversal ratio, second cell."
      - "P2: CM curve's own ratio, second cell."
      - "P3: pre-registered log-ratio delta-method test statistic and two-sided p-value."
    secondary:
      - "P4: direction match/mismatch against the first cell's own P1>P2 finding."
      - "P5: diagnostic-only same-curve Fisher-exact statistic (labeled defective, for continuity only)."

  preregistered_prediction:
    - quantity: P3 (log-ratio delta-method test)
      value: >-
        GENUINELY OPEN, TWO-SIDED. If significant AND in the same direction
        as the first cell (ordinary > CM), this is genuine replication-
        grade evidence for an endomorphism-ring-linked effect across two
        independent cells. If not significant, or significant in the
        OPPOSITE direction, this supports reading the first cell's own
        corrected result as sampling noise inflated by this cell's own
        repeated post-hoc testing history.
      formula: see `significance_test_pre_registered_before_any_draw` above.
      source: DEC-20260904-8c17d5 next_action.

  replication:
    planned_runs: 1
    seeds: [20260904001]
    interpretation: >-
      Single deterministic run per newly-found cell. If Stage 0 finds
      multiple candidate cells in [3001,20000], only the FIRST (smallest
      p) under the fixed scan order is measured; others are reported as
      found-but-not-measured, available for a future replication contract.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 3600
    maximum_cpu_seconds: 7200
    maximum_peak_rss_bytes: 536870912
    maximum_total_disk_bytes: 268435456
    maximum_workers: 1
    no_network: true

  environment_preconditions:
    consequence: NO CAS AND NO SOLVER IS REQUIRED, unchanged from this lane's other contracts.
    if_a_precondition_fails: >-
      A missing interpreter or a construction mismatch is
      `failed_infrastructure`, reported as infrastructure signal, NEVER
      negative mathematical evidence (AGENTS.md rule 3).

  infrastructure_failure_disposition: >-
    Any timeout, crash, or construction failure is recorded with its exact
    cause and classified `failed_infrastructure` or `invalid`. Supports
    and weakens NOTHING about H-MONO-1d50ac or the ECDLP.

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen and authorized. (Satisfied here.)
    - Stop and report `no_second_cell_found` if Stage 0 finds nothing in [3001,20000] -- do not silently widen the range.
    - Do not substitute or add a second "headline" test after seeing Stage 1's own counts; P3 is fixed above, before any draw.
    - Stop on any budget breach.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Any Stage-0 cell selection made after observing any Stage-1 or Stage-2 result.
    - Any post-hoc change to the pre-registered significance test after any count has been observed.
    - Any report of P5 (the diagnostic-only defective test) as a headline or as evidence-bearing on its own.

  success_criterion: >-
    A run is well-formed evidence (regardless of which direction P1-P4
    come out, or whether Stage 0 finds nothing) if: Stage 0's search is
    reported with its exact scan order and outcome; if a cell is found,
    Stage 1's four raw counts are reported in full; Stage 2 applies EXACTLY
    the pre-registered test defined above, with no substitution.

  falsification_criterion: >-
    N/A in the usual single-outcome sense -- both a significant and a
    non-significant P3 are pre-registered, genuinely open outcomes (see
    preregistered_prediction). The one true falsification-of-process
    condition is: Stage 2 reporting a DIFFERENT test than the one
    pre-registered above, or Stage 0 selecting a cell after seeing later
    results.

  outcomes:
    replication_supports_endomorphism_ring_linked_effect: >-
      P3 significant, same direction as the first cell (ordinary > CM).
      Genuine two-cell replication-grade evidence; escalate to
      review-breakthrough tier given this would be this lane's first
      replicated, targeted exceptional-locus finding.
    replication_fails_or_reverses: >-
      P3 not significant, or significant in the opposite direction.
      Supports reading the first cell's own corrected result as noise
      inflated by that cell's own repeated post-hoc testing; H-MONO-1d50ac
      likely moves toward a scoped, non-supported disposition.
    no_second_cell_found: >-
      Stage 0 finds no same-prime matched cell in [3001,20000]. Reported
      as a scarcity fact about the declared range; does not itself
      support or refute anything about H-MONO-1d50ac. A future contract
      may declare a wider or different range.
    infrastructure_or_integrity_failure: See infrastructure_failure_disposition. Never mathematical evidence.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      Unchanged from this lane's other contracts: toy scale, no transfer
      to cryptographic scale or F_{q^n}.

  required_artifacts_if_later_authorized:
    - Frozen approved specification with a freeze receipt binding its SHA-256.
    - Stage-0 search transcript (exact scan order, cell found or not).
    - Stage-1 raw counts, all four, for both arms.
    - Stage-2 pre-registered test computation, shown in full (not just the final p-value).
    - Run manifest carrying git commit, dirty-tree state, environment, resolved model identifier and probe status.
    - Command, stdout, stderr, timings, peak RSS, and an execution report.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - This contract IS DEC-20260904-8c17d5's own named next_action; no further Coordinator judgment call is reserved beyond this approval.
    - Independent review confirms Stage 0's cell selection was genuinely fixed before any Stage 1/2 result, and that Stage 2 applies exactly the pre-registered test with no substitution.

  approval_status: >-
    APPROVED 2026-09-04 by the Coordinator; see `coordinator_approval_rationale` above.

  source_refs:
    - ledger/hypotheses/H-MONO-1d50ac.yaml
    - ledger/decisions/DEC-20260904-8c17d5.yaml
    - ledger/evidence/EV-MONO-c0bf6d.yaml
    - ledger/corrections/CORR-20260904-d0205d.yaml
    - ledger/corrections/CORR-20260831-ba2118.yaml
