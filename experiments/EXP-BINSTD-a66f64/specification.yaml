experiment:
  id: EXP-BINSTD-a66f64
  hypothesis_id: H-BINSTD-e241a8
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-9e5383
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    HOLD-N-corrected c2pnb/null toy ladder + primary (2,17)/n=37 WDSat
    stability differential (primitive-prime nulls)
  status: approved
  approved_by: DEC-20261002-f340fd
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-f340fd
    composing_decision: DEC-20261002-f340fd
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-4 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3, 4]
    scientific_execution_authorized_note: >-
      Stage 0 is pure arithmetic on audited degrees and modular orders.
      Stages 1-4 use toy fields (dk<=41 / n=37) and existing Python
      instrumentation when available. No Magma/Sage. No AUXIN. No Bedrock.
      No new deployed-curve attack.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Freeze a HOLD-N-corrected triangulated null-object ladder for RQ-BINSTD
    (primitive-prime nulls only), verify the primary-cell lattice census, and
    measure WDSat conflict ratios on the composite (2,17) arm against
    within-curve non-stable and Stage-4 null f=2 controls — or name the exact
    transcription / null-misspec / instrument gap that blocks the reading.

  class: measurement
  class_note: >-
    Toy differential / control experiment with a structural Stage-0/4 census.
    Carries HEUR-BINSTD-9e5383-H1. Not an exponent-moving breakthrough
    experiment; no ECDLP attack table produced.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond arithmetic). Write
        stage0/preregistered-predictions.json and stage0/corrected-ladder.md
        freezing: field-size gaps/ratios for five c2pnb/c2tnb pairs;
        corrected null arms with ord_n(2)=n-1 (n=29/37/53 as applicable —
        NEVER n=31); ord_17(4)=4, f=5, 32 subspaces; explicit DISQUALIFY
        note for n=31 (f=7) and for treating n=41 as "poor" (f=3).
      - >-
        Stage 1. Construct composite arm E/F_4 over F_{4^17} and null arm
        at n=37; verify point counts / prime-subgroup orders; write stage1/.
      - >-
        Stage 2. Build Weil-descent PDP on the richest stable F_4-subspace;
        certify UNSAT on >=3 targets; run WDSat; compute conflict ratio vs
        2^{ml}/m!. If WDSat unavailable → O-INSTRUMENT after Stages 0/4.
      - >-
        Stage 3. Within-curve non-stable control (size-matched random
        F_4-subspace) + d=1 cross-check citing EXP-FROB-30006a / H-FROB-a5bf86.
      - >-
        Stage 4. Factor x^n-1 over F_2 on the null arm; confirm f=2 for
        n=37; optionally demonstrate f=7 for n=31 as the artifact tell
        (do not use n=31 as a null result).
      - >-
        RESULTS.md with exactly one O-* label from the hypothesis
        distinguishable_outcomes.
    excluded:
      - Using n=31 (or any n with ord_n(2)<n-1) as an accepted null arm.
      - Magma/Sage/cypari2/AUXIN provisioning.
      - Amazon Bedrock.
      - Editing IDEA-20260922-9e5383 claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Claiming break / exponent / deployed attack / unconditional insecurity.
      - Treating infra failure as mathematical evidence.
      - Running ECC2K-130 as an attack cell under this card.

  inputs:
    proposal: ledger/proposals/IDEA-20260922-9e5383.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-e241a8.yaml
    question: ledger/questions/RQ-BINSTD-b6f698.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-9e5383.yaml
    d1_instrument_idea: ledger/proposals/IDEA-20260920-b9f0c5.yaml
    d1_experiment: experiments/EXP-FROB-30006a/specification.yaml
    d1_hypothesis: ledger/hypotheses/H-FROB-a5bf86.yaml
    stable_subspace_prior: ledger/proposals/IDEA-20260922-6cf862.yaml
    count_formula_prior: ledger/proposals/IDEA-20260918-9abf42.yaml
    certbin_impl: experiments/EXP-CERTBIN-e94b27/
    curve_audit: analysis/binstd-curve-audit/

  controls:
    - name: corrected_ladder_reproduction
      description: >-
        Stage 0 must recover gaps/ratios from audited degrees and the
        ord_17(4)=4 / f=5 census; must DISQUALIFY n=31 as null.
    - name: primitive_prime_null
      description: >-
        Stage 4 must show f=2 for n=37; accepting f>2 as null is O-NULL-MISSPEC.
    - name: within_curve_non_stable
      description: >-
        Size-matched random non-stable F_4-subspace must accompany any
        stable-arm pruning claim.
    - name: d1_crosscheck
      description: >-
        Stage 3 cites EXP-FROB-30006a d=1 reading; d>1 instrument must not
        silently contradict the filed d=1 protocol without disclosure.
    - name: icperf_wdsat_regression
      description: >-
        If WDSat runs, ICPERF/Trimoska UNSAT regression within 2x conflicts
        (reused from b9f0c5 / EXP-FROB-30006a).

  independent_variables:
    - name: stage
      levels: [0_ladder, 1_curves, 2_wdsat_stable, 3_controls, 4_null_census]
    - name: arm
      levels: [composite_stable, composite_non_stable, null_primitive]
    - name: target_index
      levels: '>=3 certified-UNSAT PDP targets on composite arm'

  metrics:
    primary:
      - name: null_arm_f_factors
        unit: integer
        definition: Number of irreducible factors of x^n-1 over F_2; must be 2 for accepted null.
      - name: wdsat_conflict_ratio_composite_arm
        unit: dimensionless
        definition: WDSat conflicts / (2^{ml}/m!) on certified-UNSAT PDPs over richest stable subspace.
      - name: within_curve_non_stable_control_ratio
        unit: dimensionless
        definition: Same ratio on size-matched non-stable F_4-subspace.
    secondary:
      - name: composite_stable_subspace_count
        unit: integer
        definition: 2^f for (d,k)=(2,17); expected 32.
      - name: ratio_matching_error_primary
        unit: dimensionless
        definition: Disclosed |toy_ratio - deployed_ratio| for the primary pair.
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS of Stages 1-3 process (memory honesty).

  heuristic_under_test: HEUR-BINSTD-9e5383-H1

  preregistered_prediction:
    quantity: >-
      Stage-0 corrected ladder + ord_17(4) census; Stage-2/3 WDSat ratio
      bands; Stage-4 null f=2.
    formula: >-
      ord_17(4)=4 → f=5 → 32 subspaces;
      ord_37(2)=36 → f=2 (ACCEPT null);
      ord_31(2)=5 → f=7 (DISQUALIFY as null);
      Stage-2 bands: ratio within 0.01 of 1 (basis-blind) OR <=0.5 (material);
      positive attribution requires non-stable control near 1.
    source: >-
      analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-9e5383.yaml
      concrete_experiment + HOLD-N; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      All executable arms have dk<=41 or n=37. Deployed c2pnb/c2tnb ratios
      are triangulation targets only; no crypto-scale PDP solve.
    correspondence: >-
      Ratio-preserving toy pairs are disclosed approximations of deployed
      field-size relationships; matching errors are reported per pair.
      ECC2K-130 is a structural primitive-prime null reference, not a run cell.

  tail_checks:
    - >-
      Any accepted null with f≠2 fails the protocol (O-NULL-MISSPEC).
    - >-
      Stable pruning without non-stable control fails attribution.
    - >-
      Using the idea's raw n=31 arms without HOLD-N correction invalidates
      the run package.

  replication:
    seeds: [2026100201, 2026100202, 2026100203]
    independent_instances: 3
    note: >-
      Stage 0 deterministic. Stage 2 requires >=3 certified-UNSAT targets;
      seeds govern target draw only when RNG is used.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 4.0
    maximum_memory_gb: 8
    maximum_runs: 8
    maximum_workers: 1
    note: >-
      Advisory only (docs/research-budget-policy.md). Scientific sample count
      is >=3 UNSAT targets — not expandable by leftover wall clock into a
      deployed-scale claim.

  stopping_rules:
    - >-
      SR-1. Stage 0 freeze complete before any curve construction / WDSat.
    - >-
      SR-2. If Stage 0 reproduction fails → O-TRANSCRIPTION; do not run
      Stages 1-3 until corrected via amendment.
    - >-
      SR-3. If Stage 4 finds f≠2 on the chosen null → O-NULL-MISSPEC; reselect.
    - >-
      SR-4. If WDSat / F_4 descent builder unavailable → O-INSTRUMENT after
      Stages 0/4; do not invent conflict counts.
    - >-
      SR-5. If stable <=0.5 and non-stable also <=0.5 → O-ATTRIBUTION-FAIL.
    - >-
      SR-6. Advisory budget exhausted → O-IMPEDIMENT; never negative evidence.
    - >-
      SR-7. Do not escalate toy ratios into any ECDLP security claim.

  invalidation_rules:
    - Editing stage0/preregistered-predictions.json after Stage-0 freeze.
    - Accepting n=31 (or any non-primitive prime) as a null arm.
    - Omitting Stage-4 f check for the chosen null.
    - Claiming stability attribution without the within-curve non-stable control.
    - Provisioning Magma/Sage/cypari2/AUXIN as the success path.
    - Using Amazon Bedrock.
    - Editing IDEA-20260922-9e5383 claim text or shared GOAL-ECDLP2M-001.yaml.
    - Overwriting a prior RUN-* directory.
    - Claiming break / exponent / deployed attack from this contract.

  success_criterion: >-
    ALL of: (1) Stage-0 freeze present with passing corrected-ladder and
    ord_17(4) reproductions and explicit n=31 DISQUALIFY note; (2) Stage-4
    verifies null f=2 for n=37; (3) Stages 2-3 deliver WDSat ratios for
    stable and non-stable arms OR a named O-INSTRUMENT stop after Stages 0/4;
    (4) RESULTS.md names exactly one O-* label; (5) no invalidation_rule
    fired. This delivers the null-object protocol reading; it does NOT claim
    any curve is broken.

  falsification_criterion: >-
    ANY of: (F1) Stage-0 arithmetic fails (O-TRANSCRIPTION); (F2) accepted
    null has f≠2 (O-NULL-MISSPEC); (F3) stable pruning with non-stable also
    pruning (O-ATTRIBUTION-FAIL); (F4) Magma/Sage/AUXIN/Bedrock used as
    success path. Budget exhaustion is O-IMPEDIMENT, not falsification of
    HEUR-BINSTD-9e5383-H1.

  required_artifacts:
    - experiments/EXP-BINSTD-a66f64/implementation/
    - experiments/EXP-BINSTD-a66f64/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-a66f64/stage0/corrected-ladder.md
    - experiments/EXP-BINSTD-a66f64/stage0/ord-census.json
    - experiments/EXP-BINSTD-a66f64/stage1/
    - experiments/EXP-BINSTD-a66f64/stage2/
    - experiments/EXP-BINSTD-a66f64/stage3/
    - experiments/EXP-BINSTD-a66f64/stage4/null-f-census.json
    - experiments/EXP-BINSTD-a66f64/runs/
    - experiments/EXP-BINSTD-a66f64/RESULTS.md

  procedure:
    stages:
      - id: S0-FREEZE
        text: >-
          Write preregistered-predictions.json, corrected-ladder.md,
          ord-census.json; ZERO WDSat / curve construction before freeze.
      - id: S1-CURVES
        text: >-
          Construct composite (2,17) and null n=37 arms; verify orders;
          write stage1/ report.
      - id: S2-WDSAT-STABLE
        text: >-
          Build PDP on richest stable F_4-subspace; >=3 certified-UNSAT;
          WDSat conflict ratio vs 2^{ml}/m!; write stage2/.
      - id: S3-CONTROLS
        text: >-
          Within-curve non-stable control + d=1 cross-check vs
          EXP-FROB-30006a; write stage3/.
      - id: S4-NULL-CENSUS
        text: >-
          Factor x^n-1 on null; confirm f=2; optional n=31 artifact tell;
          write stage4/null-f-census.json.
      - id: S-SUM
        text: >-
          Write RESULTS.md with exactly one O-* label; preserve raw
          manifests under runs/; cite RUN IDs; no ledger status edits.

  assigned_to: executor
  executor_handoff: TASK-20261002-ef25e4
