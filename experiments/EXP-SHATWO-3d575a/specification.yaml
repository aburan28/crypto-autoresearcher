experiment:
  id: EXP-SHATWO-3d575a
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-d39a31; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-d39a31
  question_id: RQ-SHATWO-f196c7
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Budget-response curve for step-reduced SHA-256/16 collision search: eight wall-clock doublings
    against a frozen CNF encoding, solver and seed set, with equisatisfiable-permutation and random-tap
    null arms'
  objective: 'The one uncertainty a run reduces is whether the step-reduced frontier of this toy object
    moves with search budget. (i) It fixes the measurement by emitting s*(B, seed) - the largest step
    count at which the frozen instrument returns a certificate-verified satisfying assignment within
    budget B - for eight doublings, five seeds and three arms, so that the discrimination RQ-SHATWO-f196c7
    target 3 calls unrun becomes a curve with error bars rather than an argument. (ii) It reduces
    the artifact uncertainty by carrying two nulls through the identical code path in the same invocation:
    an equisatisfiable variable-permuted arm that MUST match the signal arm, and a random-tap arm
    that must not, so that a reported curve is a property of the primitive rather than of CNF size
    or solver variable ordering. (iii) It forces every non-solution into the correct epistemic slot
    by recording SAT, UNSAT and TIMEOUT separately and treating TIMEOUT strictly as a budget outcome
    per AGENTS.md rule 3, so that no cell of the table can later be misread as evidence that no characteristic
    exists. A run does NOT reduce the uncertainty about 32-bit SHA-256, about whether the toy word
    size preserves the mechanism, or about any published step count.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope: for SHA-256/16 with the frozen rotation-scaling
      rule, the frozen CNF encoding, the named solver version and the declared seed set, the reachable
      step count s* took the emitted values across the eight budgets, and the last-three-doubling
      mean increment fell in the plateau, slope, or unresolved band of the preregistered decision
      rule. WHAT DOES NOT FOLLOW: that no characteristic exists beyond any plateau - a plateau is
      a solver-and-budget statement and nothing more; that s* transfers to 32-bit SHA-256 at any step
      count; that a persistent slope means the real SHA-256 frontier is instrument-limited; that any
      assignment found constitutes an attack on anything beyond the toy object it was found in; and
      nothing at all about full 64-step SHA-256, HMAC-SHA-256, TLS certificate chains, code signing,
      or Bitcoin.'
  inputs:
    procedure: 'STAGE 0 (hours, human): write and hash the preregistration - the rotation-scaling
      rule for w = 16, the target predicate, the budget base and ladder, the seed set, the decision-rule
      thresholds. STAGE 1 (1 day human): implement SHA-256/16 twice and cross-validate the two on
      10^6 random inputs; implement the CNF encoder once against one of them. STAGE 2 (hours machine):
      encoder faithfulness gate - encode 200 instances with planted known solutions and require every
      returned assignment to decode and verify; abort on any failure. STAGE 3 (minutes): pilot pass
      at the base budget to bracket the coarse frontier and size the step ladder. STAGE 4 (the bulk,
      bounded by the declared total wall clock): the full grid - 3 arms x 8 budgets x 5 seeds x the
      step ladder - with a liveness planted instance at every budget. STAGE 5 (minutes): verify every
      returned assignment independently; classify every cell as SAT, UNSAT or TIMEOUT with TIMEOUT
      recorded as a budget outcome. STAGE 6 (minutes): emit s*(B, seed), the increments, the replicate
      spreads, the null comparisons, and a run manifest carrying solver version, encoding hash, seeds
      and the resolved inference block.'
    instrument: Python 3.11 for the encoder and harness; PySAT with a pinned CaDiCaL or Kissat build
      for solving, version recorded per run and never changed mid-experiment; numpy for tabulation;
      two independently written pure-Python SHA-256/16 implementations for certificate verification;
      harness/runner.py for manifests, seeds and the inference block; hashlib used only to validate
      the 32-bit reference implementation that the toy is derived from. No computer-algebra system
      and no Sage.
    parameters: 'Word size w = 16, block 16 words = 256 bits, step counts s over a ladder bracketing
      the pilot frontier, expected within 12..28. Budgets: base B0 set by the pilot so that the smallest
      arm completes, then B0 x 2^k for k = 0..7. Seeds: 5 per cell, fixed at 101..105. Arms: signal
      (SHA-256/16), NULL-A random-tap (20 draws), NULL-B equisatisfiable permutation (5 permutations).
      Encoder faithfulness gate: 200 planted instances. Per-run memory cap declared and enforced.
      Total wall clock capped at the declared campaign budget with the top rung sized to fit.'
  controls:
  - NULL-B equisatisfiable variable-permutation and clause-shuffle arm, same invocation, same budgets.
  - NULL-A random-tap SHA-256/16 arm, same encoder, same budgets.
  - Certificate verification of every returned assignment by an independent SHA-256/16 implementation;
    unverified SAT is a fault, never a result.
  - Replicate seeds at every (s, B) cell with the spread reported, so machine variance is visible.
  - A trivially satisfiable planted instance at every budget as a liveness check that the solver and
    harness are functioning at that budget.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls in the same invocation. NULL-A random-tap SHA-256/16: identical
    encoder, identical solver, identical budget ladder, but sigma0 and sigma1 replaced by random GF(2)
    linear maps of matched fan-in; a design-specific frontier must differ from this, and if the response
    curve is identical then s* is measuring the encoder''s size rather than the primitive. NULL-B
    satisfiability-neutral scramble: the same CNF with the variable names permuted by a random permutation
    and the clause order shuffled, which is provably an equisatisfiable instance; s*(B) must be statistically
    identical to the signal arm across seeds. If NULL-B differs materially, the measurement is reading
    solver heuristics keyed to variable order and no arm means anything. For the signal arm to carry
    information, NULL-B must match and NULL-A must not.'
  independent_variables:
  - wall-clock budget B over eight doublings
  - step count s
  - arm (signal, NULL-A random tap, NULL-B equisatisfiable permutation)
  - seed
  metrics:
    primary:
    - s*(B, seed) per arm
    - discrete increment ds*/dlog2(B) per arm
    - per-cell SAT/UNSAT/TIMEOUT classification
    - certificate verification rate
    secondary:
    - CNF variable and clause counts per instance
    - wall-clock and peak memory per run
    - replicate spread of s* at fixed (s, B)
    - liveness planted-instance solve time per budget
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The mean discrete increment of s* over the last three of the eight budget doublings,
      in the SHA-256/16 signal arm, averaged over the five seeds.
    formula: 'increment_mean = (1/3) * sum over k in {5,6,7} of [ s*(B0 * 2^k) - s*(B0 * 2^(k-1))
      ], averaged over seeds. Decision rule frozen before the run: increment_mean < 0.25 is scored
      PLATEAU; > 0.75 is scored PERSISTENT SLOPE; in between is scored UNRESOLVED and reported as
      such with the measured replicate spread. No direction is predicted, because the design''s value
      is that the two hypotheses predict opposite outcomes.'
    source: Pre-registered in the parent proposal IDEA-20260816-d39a31 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are w = 16 words, a 256-bit block, and step counts in the low
      tens - a deliberately reduced object chosen so that eight budget doublings and five replicate
      seeds fit inside the campaign budget, which they cannot at w = 32. The transfer assumption is
      stated and NOT tested here: that the SHAPE of the budget response (plateau versus slope) is
      preserved under word-width reduction, while the HEIGHT (the value of s*) certainly is not. No
      numeric step count from this contract may be quoted against 32-bit SHA-256, and the separate
      word-width scaling entry in this bucket is the one that would test the shape-preservation assumption.'
    correspondence: null
  tail_checks:
  - Report the full per-seed s* values, not only their mean, so that a bimodal solver outcome is visible.
  - Report peak memory per run so that a memory-exhaustion plateau is separable from a search-exhaustion
    plateau.
  - Check the smallest step count in the ladder, where a solution must be found at the base budget
    by every seed; failure there indicts the harness.
  - Check that the NULL-B permutation arm's CNF is byte-identical to the signal arm's after canonical
    re-sorting, proving equisatisfiability by construction rather than by argument.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Abort the run if the encoder faithfulness gate fails on any of the 200 planted instances, or if
    any returned assignment fails independent verification.
  - Stop at the eighth doubling as preregistered; do not extend the ladder after seeing the increments.
  - Halt an arm early if its liveness planted instance fails at any budget, and record the fault rather
    than the cell.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The encoder gate passes, every returned assignment verifies independently, the
    NULL-B arm matches the signal arm within one step at every budget, and the full s*(B, seed) grid
    is emitted with increments and replicate spread for all three arms - including when the decision
    rule returns UNRESOLVED, since a measured spread that defeats the discrimination is itself the
    reusable obstruction.
  falsification_criterion:
  - NULL-B differs from the signal arm by more than one step at any budget, falsifying the premise
    that s* measures the instance rather than variable ordering.
  - Any returned assignment fails independent verification, falsifying encoder faithfulness and voiding
    the grid.
  - NULL-A matches the signal arm at every budget, falsifying the premise that the curve is a property
    of the SHA-256/16 taps.
  - The base-budget liveness instance is unsolved at any budget, falsifying harness integrity at that
    budget.
  - Replicate spread at fixed (s, B) exceeds 1 step, falsifying the resolvability of a decision rule
    whose thresholds are 0.25 and 0.75.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-d39a31
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The rotation-amount scaling rule from w = 32 to w = 16 is declared, not derived; a Coordinator
    must accept it as a modelling choice or specify an alternative, and must decide whether more than
    one rule should be run.
  - The base budget B0 is set by a pilot pass rather than by an argument, so the ladder's placement
    is empirical; a Coordinator must approve the pilot-then-freeze protocol explicitly.
  - The target predicate - semi-free-start collision versus collision versus free-start - is a choice
    that changes what s* means; the contract declares one but supplies no argument for which is the
    right discriminator.
  - No argument is given that shape is preserved under word-width reduction; approval must not be
    worded as if it were.
