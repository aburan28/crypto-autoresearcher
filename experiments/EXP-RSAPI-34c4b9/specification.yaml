experiment:
  id: EXP-RSAPI-34c4b9
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-b5b822; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-b5b822
  question_id: RQ-RSA-d46f02
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Single-notch ablation of a reproduced small-root pipeline across five separable stages at
    one modulus size, with a no-op resolution control and a rootless-polynomial null in the same invocation.
  objective: 'The one uncertainty a run reduces is which part of the small-root construction actually
    limits recovery at a concrete parameter, as opposed to which part the received intuition says
    should. Concretely: (i) whether the pipeline is separable at all, that is whether five single-notch
    degradations can be applied with everything else byte-identical and with each notched basis passing
    an exact determinant cross-check, since a notch that silently changes two things measures nothing;
    (ii) whether the resulting changes in r_hat separate, meaning at least one notch whose exact binomial
    interval is disjoint from the others and above the no-op resolution floor, and if so which stage
    carries it; (iii) whether that argmax label is stable under re-seeding and across replicate blocks
    with randomised arm order, so that the label is a property of the construction rather than of
    the run. The run also produces, as a by-product the later entries need, a calibrated resolution
    floor for r_hat differences, which is the unit in which the position-set, noise and completeness
    entries will report their own moves.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for this reproduced
      construction, these five notch definitions, this modulus size, this dimension and this budget,
      a ranking of the five stages by measured effect on the 90-percent-success unknown fraction,
      with exact binomial intervals, a no-op resolution floor and a rootless null. WHAT DOES NOT FOLLOW:
      nothing about how to improve the construction, since a bottleneck is not a lever; nothing about
      a different construction or different notch definitions; nothing about deployed RSA; and no
      claim that a low-ranking stage is unimportant, only that degrading it by ONE declared notch
      moved r_hat less than the others did.'
  inputs:
    procedure: 'STAGE 0 (zero compute): declare the five notches, the no-op notch, the baseline cell,
      seeds, the success threshold and the symbolic determinant of every notched basis. STAGE 1 (hours
      of engineering, no compute): implement the pipeline with S1 through S5 as parameters; verify
      byte-identical behaviour when all parameters are at baseline. STAGE 2 (minutes): determinant
      cross-check every notched basis against STAGE 0. STAGE 3 (CPU-hours): run the baseline arm and
      bisect to r_hat on 60 paired seeded instances. STAGE 4 (CPU-hours, same invocation): run the
      five notched arms and the no-op arm on the identical instances, in randomised order across three
      replicate blocks. STAGE 5 (CPU-hours, same invocation): run the rootless-polynomial null across
      all seven arms. STAGE 6 (minutes): re-seed and repeat the baseline and the argmax arm only.
      STAGE 7 (zero compute): assemble the ranking with exact binomial intervals and the resolution
      floor.'
    instrument: Python 3.11. fpylll 0.6.4 for the reduction ladder used by the S4 notch, via the wheels-only
      route in KN-TECH-14efa5. python-flint or gmpy2 for exact determinants and for verification by
      exact division. harness/runner.py for manifests, seeds and the inference block; harness/run.py
      as the bounded-run wrapper. Arm dispatch is a plain Python parameter object so that all seven
      arms execute in one process from one instance set. No Sage.
    parameters: 'Modulus bit-length n = 128, balanced primes of 64 bits each. One baseline lattice
      dimension in the range 16 to 32, fixed in STAGE 0. Seven arms: baseline, S1, S2, S3, S4, S5,
      no-op. 60 paired known-answer instances per arm, three replicate blocks with randomised arm
      order. Unknown fraction u bisected over at most 9 evaluations per arm within the bracket declared
      in STAGE 0. Rootless null with 60 instances per arm. Per-arm wall-clock cap 900 seconds per
      instance, memory cap 8 GB.'
  controls:
  - 'No-op notch arm: an irrelevant parameter change that must produce a change below the declared
    resolution floor.'
  - Random-polynomial null with no planted root, run in the same invocation.
  - 'Paired instances: every arm uses the identical seeded instance set so differences are within-instance.'
  - 'Order control: the five notches are applied in a randomised order across replicate blocks to
    catch any state leakage between arms.'
  - 'Determinant cross-check: each notched basis has its exact log determinant recomputed and compared
    against the symbolic prediction for that notch.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The identical five-notch ablation runs against a null pipeline in which
    the target polynomial is replaced by a random polynomial of the same degree and coefficient size
    with NO planted root, everything else identical. The null must show r_hat undefined in every arm
    because no arm recovers anything, so that all five changes are zero within their intervals and
    no argmax exists. If the null produces a non-degenerate ranking, the ranking in the signal arm
    is a property of the lattice-building code rather than of root recovery, and the measurement is
    void. A second null re-runs the baseline cell with a NO-OP notch, a change of an irrelevant parameter
    such as the internal ordering of identical basis rows, which must produce a change indistinguishable
    from zero and calibrates the resolution of the whole ranking.'
  independent_variables:
  - notch identity (baseline, S1, S2, S3, S4, S5, no-op)
  - unknown-prime-bit fraction u
  - replicate block
  - arm class (signal, rootless null)
  metrics:
    primary:
    - r_hat per arm with exact binomial interval
    - change in r_hat per notch
    - argmax notch label
    - no-op change in r_hat as resolution floor
    secondary:
    - exact log determinant per notched basis
    - reduction wall time per arm
    - peak resident memory per arm
    - count of time-capped instances per arm
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The argmax over the five notches of the absolute change in r_hat, and the ratio of that
      argmax to the sum of the other four.
    formula: argmax_stage is in {S1, S2} at the baseline dimension, and the argmax change is at least
      the sum over the other four notches of their changes. The no-op notch satisfies a change of
      at most 0.01 in u. A notch effect counts only if its 95-percent exact binomial interval excludes
      the no-op floor.
    source: Pre-registered in the parent proposal IDEA-20260816-b5b822 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'One modulus size of 128 bits with 64-bit primes and one lattice dimension between
      16 and 32. Ground truth is exact by construction. NO TRANSFER IS ASSUMED to other modulus sizes
      or dimensions: the ranking is reported for the tested cell only, and the claim that the argmax
      label is piecewise constant across a grid is stated as an untested expectation in the proposal,
      not as a result of this contract. Extending to a grid is a separate contract that this one is
      a prerequisite for.'
    correspondence: null
  tail_checks:
  - Per-instance success at the two u values bracketing each arm's r_hat
  - Maximum as well as median wall time per arm, since weaker reduction arms have different tails
  - Instances where a norm-bound success failed exact verification, per arm
  - Variance of the notch changes across the three replicate blocks
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt and report an instrument failure if any notched basis fails the STAGE 2 determinant cross-check
  - Halt if the rootless null produces any recovery
  - Halt an arm at the per-instance cap and record it as budget-limited, never as a mathematical negative
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: A run succeeds if all seven arms complete on the identical paired instance set,
    the no-op floor is below 0.01 in u, the rootless null recovers nothing, and every notch change
    is reported with an exact binomial interval, whether or not any notch separates.
  falsification_criterion:
  - No-op floor at or above the smallest real notch effect falsifies the resolution of the whole design
  - Any rootless-null recovery voids the run
  - Determinant cross-check failure on any notched basis voids that arm
  - All five notch intervals mutually overlapping falsifies the single-binding-stage claim and is
    recorded as the measured obstruction
  - Argmax label differing between replicate blocks falsifies stability of the label
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-b5b822
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The five notch definitions are proposed here in words; a Coordinator must fix each one as an exact
    parameter change against the reproduced construction, which cannot be done until that construction
    is filed per RQ-RSA-d46f02's KN-LIT constraint.
  - The baseline dimension is left as a range because it should be chosen where the achievability-ratio
    entry finds r_hat well defined and comfortably inside the budget; that value is not yet measured.
  - Whether notches can be made dimension-preserving for S1 and S2 simultaneously is an open implementation
    question that STAGE 1 may answer negatively, in which case the contract needs re-specification
    rather than a run.
