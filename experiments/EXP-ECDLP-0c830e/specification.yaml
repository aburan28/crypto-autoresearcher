# EXP-ECDLP-0c830e
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-09db4b.
experiment:
  id: EXP-ECDLP-0c830e
  hypothesis_id: H-ECDLP-dbf66d
  source_idea: IDEA-20261003-f1baef
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 9
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-09db4b
  objective: >-
    Check the counts 4, 3, and 1, the product 12, and the nearby gap 0.
  inputs:
    bit_length: 4
    doublings: 3
    additions: 1
    length_gap: 1
    doubling_gap: 2
    digit_product: 12
    digit_sum: 8
    nearby_a: 1
    nearby_b: 1
    nearby_gap: 0
    nearby_product: 1
  controls:
    - >-
      The bit length is 4. The doubling count is 3. The addition
      count is 1. Reporting the addition count as 0 drops that
      count and invalidates the run.
    - >-
      Four exceeds three by 1. Three exceeds one by 2. The product
      of 4, 3, and 1 is 12. Their sum is 8.
    - >-
      Two readings of the addition count are both 1. Their gap is
      0 and their product is 1.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 9 has bit length 4, 3 doublings, and 1
      addition. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 4. Count 3 doublings. Count 1 addition.
      Multiply 4, 3, and 1. Subtract 1 from 1.
    source: >-
      IDEA-20261003-f1baef states the counts 4, 3, and 1, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 12 and the nearby gap 0 are required. A check that stops at the bit length 4 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 1 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 4.
    - The doubling count is not 3.
    - The addition count is not 1.
    - The product is not 12.
    - The addition count is reported as 0, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 4, that the doubling
    count is 3, that the addition count is 1, and that the product
    of those three counts is 12.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 1.
  required_artifacts:
    - experiments/EXP-ECDLP-0c830e/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-0c830e/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-0c830e/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-0c830e/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-0c830e/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-0c830e/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
