  # ---------------------------------------------------------------------------
  definitions:
    field: >-
      F_2[t]/(f) with elements as non-negative integers, bit j the coefficient
      of t^j. Multiplication is carry-less schoolbook multiply followed by
      reduction modulo f. The executor selects f as the lowest-weight and then
      lexicographically least irreducible polynomial of degree n, RECORDS it,
      and verifies irreducibility by the Rabin test before use. Trace is
      Tr(a) equal to the sum over i from 0 to n minus 1 of a^(2^i), which must
      land in 0, 1. For n odd the half-trace H(a) is the sum over i from 0 to
      (n minus 1)/2 of a^(2^(2i)) and satisfies H(a)^2 + H(a) equal to
      a + Tr(a). The square root of a is a^(2^(n minus 1)).
    normal_basis: >-
      A normal element w is one whose n Frobenius conjugates w^(2^i) are
      F_2-linearly independent, found by search with a rank test over F_2. In
      the normal-basis coordinates of w, Frobenius is the cyclic shift of the
      coordinate vector. The executor records w, the change-of-basis matrix and
      its inverse, and verifies the shift property on 100 random elements. A
      type-II optimal normal basis is used where one exists at that n; where
      none exists a random normal basis is used, the Frobenius-as-shift property
      still holds, the specific KN-LIT-661e97 distinguished-point predicate is
      NOT reproduced, and the cell records that.
    curve: >-
      E_a over F_2^n is y^2 + xy = x^3 + a x^2 + b. The Koblitz cells take
      a equal to 0 and b equal to 1. Points are (x, y) pairs with the point at
      infinity a distinct sentinel. Negation is (x, x + y). Doubling of
      P equal to (x1, y1) with x1 nonzero uses lam equal to x1 + y1/x1,
      x3 equal to lam^2 + lam + a, y3 equal to x1^2 + (lam + 1) x3. Addition of
      distinct abscissae uses lam equal to (y1 + y2)/(x1 + x2),
      x3 equal to lam^2 + lam + x1 + x2 + a,
      y3 equal to lam (x1 + x3) + x3 + y1.
    group_order_and_admission: >-
      For a Koblitz cell the order is 2^n + 1 minus s_n from the Lucas
      recurrence s_0 equal to 2, s_1 equal to t, s_(i+1) equal to
      t s_i minus 2 s_(i-1), with t equal to minus 1 for a equal to 0. The
      instrument RECOMPUTES the order independently by the trace-based count
      (one plus the point at abscissa zero plus twice the number of nonzero x
      with Tr(x + a + b/x^2) equal to 0), compares the two, PROVES the primality
      of the odd part by a deterministic Miller-Rabin over the standard small
      bases with a full trial division below 10^4 recorded, and EXHIBITS a point
      of order 4 to prove the 2-Sylow subgroup cyclic. ADMISSION RULE AR-B1: a
      prime-l cell is admitted only when the two counts agree, the order is
      4 times a prime, and a point of order 4 exists. A cell failing any clause
      is REPORTED AND DROPPED, which is an admission outcome and never evidence.
      The record's hand values t_19 equal to 797 and t_17 equal to 101 are
      INPUTS to be checked against the recomputation and are NEVER cited as
      results; a disagreement halts that cell and is referred to the
      Coordinator.
    halving_and_the_exact_filters: >-
      RE-DERIVED FROM THE GROUP LAW, not relayed. Q equal to 2P requires
      lam_P with lam_P^2 + lam_P equal to x(Q) + a, solvable over F_2^n exactly
      when Tr(x(Q) + a) equals 0, so Q lies in 2E exactly when Tr(x(Q)) equals
      Tr(a). For n odd the root is lam equal to H(x(Q) + a) and the second root
      is lam + 1; then x(P)^2 equal to y(Q) + (lam + 1) x(Q), so
      x(P) equal to sqrt of that, and y(P) equal to x(P) (lam + x(P)). The two
      roots give the two halves, which differ by the unique 2-torsion point.
      THE ORDER-2 FILTER is h2(P) equal to Tr(x(P)) + Tr(a), with
      h2 of the point at infinity equal to 0. THE ORDER-4 FILTER h4 is
      CONSTRUCTED, not asserted: with c the inverse of the odd part modulo 4,
      h4(P) is the discrete logarithm, base a fixed generator of E[4], of the
      point obtained by multiplying P by c times the odd part; this is a
      surjective homomorphism onto Z/4 whenever the 2-Sylow subgroup is cyclic
      of order 4. Its CHEAP PRESENTATION on 2E is the trace pair
      (Tr(x(P)), Tr(x(P/2))), well defined because the unique 2-torsion point
      lies in 2E so the two halves give the same second coordinate. SETUP CHECK
      CK-H4: on every prime-l cell the instrument verifies that h4 is a
      homomorphism onto a group of order 4 on 10^4 random pairs, and reports
      whether the trace pair agrees with h4 on 2E up to a labelling; a
      disagreement is reported as design finding DF-1 of the audit sheet and the
      CONSTRUCTED h4 is the tested object.
    exact_filters_on_a_cyclic_cell: >-
      Where the cell's group is cyclic of order N (verified by exhibiting a
      generator), an exact filter of ANY alphabet M dividing N is constructed as
      P maps to (discrete logarithm of P base the generator) modulo M, using a
      full discrete-logarithm table built by enumerating the multiples of the
      generator. This is how the alphabet-548 and alphabet-956 homomorphisms of
      the composite n equal to 17 cell are BUILT rather than assumed, and how
      the M in 2, 4 filters are cross-checked against h2 and h4.
    bucket_gain: >-
      For a filter h onto an alphabet of size M, G(h) is M times the maximum
      over triples (a, b, c) of the empirical conditional probability that
      h(P + Q) equals c given h(P) equal to a and h(Q) equal to b, over S
      sampled ordered pairs (P, Q) drawn uniformly from the cell's group.
      Conditioning cells (a, b) holding fewer than 100 samples are EXCLUDED and
      the exclusion count is reported. The point at infinity and any pair with
      P equal to plus or minus Q are excluded and counted.
    bootstrap: >-
      1000 resamples with replacement of the S pairs, the statistic recomputed
      on each, percentile interval at 95 percent. The reported width is the
      difference of the interval endpoints. The random-label arm's width on the
      same cell, filter alphabet and S is THE NULL WIDTH used by every
      threshold below.
    matched_marginal_shuffle: >-
      Compute each point's marginal bucket probability under h, group points
      into equal-marginal classes, permute h's values uniformly within each
      class under a recorded seed, and recompute G on the SAME sampled pairs.
      A genuine propagation signal must be destroyed; a marginal artifact must
      be preserved. Run on EVERY arm, including the exact controls, where the
      shuffle must destroy the reading.
    l_b_meter: >-
      The two absorbed IDEA-20260926-d06324 rows. L(pi) is the base-2 logarithm
      of the mean fibre size of pi. b(pi) is the mean, over ordered fibre pairs,
      of the number of distinct values of pi(A + B) as A and B range over the
      two fibres. ROW P1, the x-coordinate projection: the fibre of x is the
      pair P, minus P, so the sums are x(A + B) and x(A minus B), giving
      L equal to 1 and b equal to 2 EXACTLY on every arm. ROW P2, the
      halving-trace bit h2: b equal to 1 EXACTLY on the full group, because h2
      is a homomorphism, and L equal to 0 on the odd-order subgroup, where h2 is
      constant. Relation to the gain: b equals M divided by G, so P2's
      b equal to 1 is the same fact as G equal to 2.
    declared_filter_families: >-
      The families measured in Stage 2, declared here and closed. F1: the
      Hamming weight of x in the normal basis, bucketed into M quantile classes
      (Frobenius-invariant, and the statistic of the KN-LIT-661e97
      distinguished-point predicate). F2: a window of log2(M) consecutive normal-
      basis coordinates of x, at three declared offsets. F3: a window of log2(M)
      consecutive polynomial-basis coordinates of x, at the same three offsets.
      F4: the leading log2(M) normal-basis coordinates of the
      Frobenius-canonical representative of x (the lexicographically smallest
      conjugate). F5: the composite of h4 with each of F1 to F4, truncated to
      alphabet M. Twelve arms in total, enumerated in the audit sheet. NO OTHER
      FAMILY is measured, and the family list is declared and therefore
      incomplete, which the interpretation limits state.
    ceiling_model: >-
      THE IDEAL k-LIST MODEL, stated once so two implementations agree, and
      COUNTERFACTUAL THROUGHOUT. k equal to 2^j lists of size L equal to
      N^(1/(j + 1)) over a group of order N; per-attempt cost k times L group
      operations; the factor base must contain the lists so B equals L;
      relations needed equal B without orbit unknowns and B divided by 262 with
      them; the linear algebra costs k times relations squared; the total is
      relations times per-attempt cost plus the linear algebra. AMBIENT for this
      accounting: the TARGET SUBGROUP of order l, so N equals l. Memory is k
      times L points at 17 bytes per point, the x-coordinate alone at
      ceiling(131/8) bytes, stated beside every time figure. THE ORBIT-UNKNOWNS
      LINE IS CONDITIONAL: under CORR-20260925-649e25 relations equal to B/262
      is a PER-ORBIT relation-count framing, conditional on a per-orbit unit
      that NO APPROVED CONTRACT HAS FIXED; it is cited as a dependency only. The
      WITHOUT-ORBIT line is the unconditional one of the pair. BOTH sit under
      the ceiling label: every total is conditional on a filter of alphabet
      about 2^25.80 per internal level at k equal to 16, which the Stage 0
      certificate excludes exactly.

  # ---------------------------------------------------------------------------
  cells:
    primary:
      id: CELL-K19
      curve: Koblitz y^2 + xy = x^3 + 1 over F_2[t]/(t^19 + t^5 + t^2 + t + 1)
      order_input: 523492 equal to 4 times 130873 from t_19 equal to 797, AN INPUT to be recomputed and proved at setup
      role: the primary prime-l cell, the same field as the n equal to 19 RQ-CERTBIN-836ce2 cell
      alphabets: M in 2^6 and 2^5 (N^(1/3) and N^(1/4) rounded to a power of two), recomputed from the verified order
      samples: S equal to 2^20
    ladder:
      - {id: CELL-K23, n: 23, a: 0, role: decay ladder}
      - {id: CELL-K29, n: 29, a: 0, role: decay ladder}
      - {id: CELL-K31, n: 31, a: 0, role: decay ladder, samples: S equal to 2^18}
    ladder_admission: >-
      Each is admitted only under AR-B1 with the order equal to 4 times a
      prime. A cell failing admission is reported and dropped and the ladder
      fit is made over the admitted cells, with the dropped cells named.
    composite_control:
      id: CELL-K17C
      curve: Koblitz a equal to 0 at n equal to 17
      order_input: 130972 equal to 4 times 137 times 239 from t_17 equal to 101, AN INPUT to be recomputed at setup
      role: >-
        THE NEARBY OBJECT WHERE THE CAPACITY IS NOT 2 BITS. Its exact filters of
        alphabet 548 and 956 are CONSTRUCTED by the cyclic-cell route and must
        read G equal to M. BLOCKING for the capacity certificate: if it does not
