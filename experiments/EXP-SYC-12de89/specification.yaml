  success_criterion: >-
    Static production succeeds fully only where all four TASK-20260811-cb5d76
    findings close with zero residual. RT-OBJ2 (shard parallelism) does:
    equalized to eight-way with zero downstream numeric effect. RT-OBJ1 (candidate
    occupancy) closes on derivation, bound, and overflow-rule presence, but
    the "32 is adequate" conclusion is conditional on a disclosed, unvalidated
    heuristic (DERIV-1), not a worst-case-certain result. VAL-EA56C5-ARCHIVE-
    COMMUNICATION-BYTES-UNCHARGED and VAL-EA56C5-OUTPUT-MANIFEST-UNDISCLOSED-
    SWAP close on full, traceable disclosure of every required byte and file
    (no more silent, undisclosed non-charging or unexplained file swap), but
    NOT on capacity-fit: the honestly-recomputed archive_scheduled_bytes
