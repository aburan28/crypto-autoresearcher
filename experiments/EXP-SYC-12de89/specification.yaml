  objective: >-
    Close, or honestly partially close, exactly the four blocking findings
    DEC-20260809-e35473 and its two independent BATCH-ea56c5 reviews
    (Validator TASK-20260809-db593f, Red Team TASK-20260809-3e9c18) returned
    against EXP-SYC-a59d02: RT-OBJ1-candidate-population-cap-N-independent-vs-HA1-N-dependent-boundary,
    RT-OBJ2-asymmetric-shard-parallelism-biases-wall-axis-of-positive-gate,
    VAL-EA56C5-ARCHIVE-COMMUNICATION-BYTES-UNCHARGED, and
    VAL-EA56C5-OUTPUT-MANIFEST-UNDISCLOSED-SWAP -- within unchanged
    prospective caps, without implementing or running an experiment, and
    without touching the eight BATCH-ece945 blocker repairs both BATCH-ea56c5
    reviewers already independently reconfirmed byte-exact. RT-OBJ2 is closed
    by design (shard parallelism equalized). RT-OBJ1 is closed for the
    "no derivation/bound/overflow-rule" defect, conditional on a disclosed,
    unvalidated heuristic for the "32 is adequate" claim. The two Validator
    findings are closed on disclosure (every required artifact now has a
    traceable disposition and byte budget) but NOT closed on capacity-fit:
    the honestly-recomputed archive, communication, and output byte totals
    exceed their currently declared hard caps, which this batch is forbidden
    from raising. See design-repair-report.yaml for the full, itemized
    adjudication of all four findings.

