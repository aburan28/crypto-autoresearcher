    budget (15520768) each exceed their currently declared hard caps
    (2307745600 / 2328717120 / 8388608 respectively), and this batch is
    forbidden from raising any inherited hard cap. This is a disclosed
    partial-repair outcome, not a false PASS_STATIC_FOR_INDEPENDENT_REVIEW.
    Future executable hashes, production receipts, measurements, and coverage
    evidence must remain null because no implementation or stream exists.
    This record authorizes only immutable snapshot and independent Validator
    plus Red Team review; it authorizes neither implementation nor execution.

