experiment:
  id: EXP-PFDR-d2263b
  hypothesis_id: H-PFDR-f7161e
  question_id: RQ-DREG-001
  idea_id: IDEA-20260828-d91efa
  batch_id: BATCH-c64bee
  version: 1
  recorded_at: '2026-09-04'
  drafted_under_task: TASK-20260904-9c61a9
  status: draft
  approved_by: null
  approved_at: null
  assigned_to: executor
  status_note: >-
    Written and frozen at the design stage; NOT submitted for approval and NOT
    authorized for implementation. 'draft' is the first state of the experiment
    machine in AGENTS.md: draft, review_required, approved, running, then
    completed or failed_infrastructure or invalid, then analyzed, then archived.
  record_shape: >-
    A ZERO-COMPUTE SERIES-ARITHMETIC PROTOCOL over already-committed integers. No
    Macaulay matrix is built, no rank is computed and no new cell is measured.
    maximum_runs is 0 and replication.seeds is empty with a stated reason; the
    determinism a seed would buy is bought instead by freezing the cell inventory
    and the band definition before any comparison.
  title: >-
    Does the tensor-over-the-shared-block Hilbert-series identity predict the
    committed boolean chained-Semaev rank deficits -- tested only AFTER proving
    that its prediction is not symbolically identical to the semi-regular
    reference the deficits are already measured against, since if it is, the
    agreement band has width zero and the comparison cannot fire.
  claim_ceiling: >-
    A retrodiction check on committed integers. No mathematical claim about
    d_reg, no forward extrapolation, no exponent, no ECDLP evidence, no
    hypothesis or goal status change. A PASS is a candidate predictor, never a
    validated extrapolation route.
  claim_tier_basis: >-
    DERIVATION TIER. No solve is claimed and no certificate of any cryptographic
    kind can arise. Every number is either a committed integer read from the
    ledger or an exact evaluation of a truncated power series.
  objective: >-
    Establish, IN THIS ORDER: (1) that the tensor prediction is SEPARABLE from
    the semi-regular reference, by computing the symbolic difference Delta0 at
    every admitted cell before any comparison; (2) that the series-arithmetic
    instrument is correct, by returning predicted deficit exactly 0 on a
    curve-free full-support null and by moving by a hand-derivable amount when a
    defect of known size is planted; (3) that it responds to block INCIDENCE and
    not only to block SIZES, by giving a different prediction on the
    block-permuted system; and only then (4) compare the prediction against the
    committed deficits and report the residual correction per cell.
  band_non_degeneracy:
    statistic: 'the predicted rank deficit D_pred at an admitted cell, in columns'
    null_value: 'the committed measured deficit D_meas at that cell'
    alternative: >-
      the correction term is nonzero and grows, i.e. cross-block syzygy content
      that no per-block computation can see
    computed_check: >-
      THE HAZARD IS THAT THE BAND IS ZERO-WIDTH AROUND ZERO. The semi-regular
      reference sr_pred is a generic count and the per-block series H_A and H_B
      are themselves semi-regular approximants, so the tensor formula may
      reproduce sr_pred SYMBOLICALLY, in which case D_pred is identically 0, a
      plus-or-minus-25-percent band around it has width 0, no measured deficit of
      any size can lie inside it, and no outcome distinguishes the mechanism from
      the reference. Delta0 = [tensor prediction] minus sr_pred is therefore
      COMPUTED FIRST and reported whatever it is.
    resolution: >-
      The band is set to 0.25 times |Delta0(n, D)| -- a fraction of the SEPARATION
      THE FORMULA ACTUALLY CLAIMS -- and is set per cell only after Delta0 is
      computed. If Delta0 is identically 0 the band is NOT used, the comparison is
      NOT run, and the non-separability is the reported result. This replaces the
      source idea band of plus-or-minus 25 percent, which does not say of what;
      a band on the RANK would be roughly a factor 7 band on the deficit and would
      pass trivially, since committed ranks are of order 10^4 to 10^5 while
      deficits are of order 10^3.
  inputs:
    committed_cells: >-
      ENUMERATED AT STAGE 0 FROM THE LEDGER AND FROZEN, not taken from the source
      idea. Only cells with a committed FULL-COLUMN EXACT rank are admissible;
      RQ-DREG-001 constraints declare subset-column rank INVALID for the
      semi-regular arm. The cells the drafting coordinator could confirm from
      H-DREG-5a3ac1 are n = 12 D = 5 with deficit 29,418 minus 28,096 = 1,322,
      n = 15 D = 5 with deficit 1,862, and n = 18 D = 5 with deficit
      145,881 minus 143,882 = 1,999. THE SOURCE IDEA CELL LIST, n in {9, 12} and
      D in {5, 6}, IS NOT ADOPTED: the n = 9 and D = 6 cells were not confirmed
      to exist and running a comparison against cells that do not exist would
      manufacture data.
    series: >-
      The per-block semi-regular series as stated by the source idea, H_A of the
      form (1 + z)^{n+k} (1 + z^2)^{-n} and H_B of the form
      (1 + z)^{n+2k} (1 + z^3)^{-n}, RE-DERIVED at Stage 0 from the committed
      source of the chained system rather than adopted.
    convention: >-
      the boolean field-equation series convention, applied identically to both
      sides of the identity with the derivation SHOWN and not assumed
    runs: 0
    new_rank_computations: 0
  controls:
    - id: CTRL-DELTA0-FIRST
      row_class: instrument
      blocking: true
      object: 'the symbolic difference Delta0 between the tensor prediction and sr_pred'
      forced_disposition: >-
        FORCED: computed and archived BEFORE any comparison against a committed
        deficit. Delta0 identically 0 HALTS the comparison and is itself the
        reported result. Computing it after seeing a comparison outcome
        INVALIDATES the run.
    - id: CTRL-FULL-SUPPORT-NULL
      row_class: null_object
      blocking: true
      object: >-
        CURVE-FREE: the full-support generic null, with the two ideals replaced
        by generic full-support quadrics and cubics of matched shape. It contains
        no curve, no group law and no summation polynomial.
      forced_disposition: >-
        MUST return predicted deficit EXACTLY 0 under the adapted boolean
        convention. A nonzero value is a bug in the series algebra and nothing
        else in the run may be read. NOTE FOR ATTRIBUTION: the entire protocol is
        an identity between power series over a boolean polynomial ring and
        contains no elliptic curve anywhere, so no artifact may describe any
        outcome as a statement about elliptic curves or the ECDLP.
    - id: CTRL-PLANTED-DEFECT
      row_class: positive_control
      blocking: true
      object: >-
        H_A perturbed by removing exactly one generator, a defect whose effect on
        the predicted deficit is derivable by hand before the run
      forced_disposition: >-
        MUST move the prediction by exactly the derived amount. THIS IS THE
        DYNAMIC-RANGE DEMONSTRATION: an evaluator that does not move when a
        defect of known size is planted cannot be read when it fails to move on
        the real object, and every null it reports is void.
    - id: CTRL-BLOCK-PERMUTED
      row_class: nearby_object
      blocking: true
      object: 'the block-permuted system, same block sizes and different incidence'
      forced_disposition: >-
        MUST give a prediction differing from the true pairing by more than the
        reporting resolution. Indistinguishability means the formula responds to
        block SIZES and not to incidence, and the mechanism is under-determined.
    - id: CTRL-CELL-INVENTORY-FROZEN
      row_class: honesty
      blocking: true
      object: 'the admitted cell list'
      forced_disposition: >-
        FORCED: enumerated once from committed full-column exact ranks, frozen
        with a sha256 before any prediction is evaluated, and reported in full
        including cells excluded and why. Fewer than two admitted cells is
        reported as UNDERPOWERED, never run on one cell and quoted as agreement.
    - id: CTRL-CONVENTION-SHOWN
      row_class: instrument
      blocking: true
      object: 'the boolean series convention adaptation'
      forced_disposition: >-
        FORCED: the derivation putting both sides in the same convention is
        written out in the run package. A comparison across two conventions is
        invalid by construction rather than by mechanism.
    - id: PARETO-NONE
      row_class: pareto_control
      blocking: false
      object: 'no attack is proposed'
      forced_disposition: >-
        NO DOMINATION IS CLAIMED ON ANY AXIS. This protocol proposes no algorithm
        and contests no frontier row.
  independent_variables:
    - 'admitted cell (n, D) from the frozen inventory'
    - 'object in {true pairing, full-support null, planted-defect variant, block-permuted}'
  metrics:
    primary:
      - 'Delta0(n, D) = tensor prediction minus sr_pred(n, D). UNITS: columns (integer). REPORTED FIRST AND BLOCKING.'
      - 'D_pred(n, D), the predicted rank deficit. UNITS: columns (integer)'
      - 'D_meas(n, D), the committed measured deficit, read from the ledger. UNITS: columns (integer)'
      - 'c(n, D) = D_meas minus D_pred, the correction term, WITH ITS SIGN. UNITS: columns (integer)'
      - '|D_pred minus D_meas| against the band 0.25 times |Delta0|. UNITS: columns (integer)'
      - 'full-support null prediction. UNITS: columns (integer), forced 0'
      - 'planted-defect prediction shift against the hand-derived amount. UNITS: columns (integer)'
      - 'block-permuted prediction minus true-pairing prediction. UNITS: columns (integer)'
    secondary:
      - 'the frozen admitted-cell inventory with a sha256, and the list of excluded cells with reasons'
      - 'the written boolean-convention derivation'
      - 'the truncated series coefficients at each cell, so a reader can recompute'
  heuristic_under_test: >-
    HEUR-001 (near-flatness of the tensor identity for these non-flat quotients)
    and HEUR-002 (separability of the tensor prediction from the semi-regular
    reference) of H-PFDR-f7161e. HEUR-002 is tested FIRST and its failure makes
    HEUR-001 untestable on this observable.
  preregistered_prediction:
    quantity: >-
      Delta0 at each admitted cell; the full-support null prediction; the
      planted-defect shift; the block-permuted separation; and, only if Delta0 is
      nonzero, |D_pred minus D_meas| against the derived band, plus c(n, D) with
      its sign.
    formula: >-
      Full-support null prediction exactly 0. Planted-defect shift exactly the
      hand-derived amount. Block-permuted separation strictly greater than the
      reporting resolution. Delta0 REPORTED WITH NO PREDICTED VALUE, because
      predicting it would prejudge separability. c(n, D) REPORTED WITH NO
      PREDICTED VALUE and never fitted.
    source: >-
      H-PFDR-f7161e claims (A) to (E) and predictions P1 to P6. The committed
      deficits are read from H-DREG-5a3ac1; the admissibility rule on
      full-column exact rank is read verbatim from RQ-DREG-001 constraints.
      FIXED ON 2026-09-04, BEFORE THE CELL INVENTORY IS ENUMERATED AND BEFORE ANY
      PREDICTION IS EVALUATED. The band definition, the cell admissibility rule
      and the control dispositions are part of the frozen contract and are never
      adjusted after an outcome is seen.
  scale_relevance:
    tier: toy
    justification: >-
      The committed cells are boolean chained-Semaev systems at t = 3 with n at
      most 18. Nothing is computed at any other size, and NO transfer to t at
      least 4, to prime fields, or to any uncomputed n is claimed or licensed. A
      PASS is a retrodiction at cells that already exist and is explicitly NOT a
      validated forward-extrapolation route past the memory wall.
    correspondence: 'none; no sampling of any mathematical object occurs'
  tail_checks:
    - >-
      The cell with the LARGEST |c(n, D)|, reported individually with both the
      prediction and the committed deficit written out, so a reader can localise
      the disagreement rather than trust an aggregate.
    - >-
      The sign pattern of c across the admitted cells, reported as a list. Two or
      three cells cannot establish a growth law and NONE is fitted; the signs and
      magnitudes are the deliverable.
    - >-
      The ratio |Delta0| to |D_meas| per cell, which states how much of the
      claimed separation the formula is actually asserting relative to the
      quantity being predicted.
  replication:
    seeds: []
    independent_instances: 0
    reason: >-
      ZERO RUNS AND NO SAMPLING: the inputs are committed integers and closed-form
      series, so there is nothing to seed. The determinism a seed would buy is
      bought by three declared conditions: Delta0 is computed and archived before
      any comparison, the cell inventory is frozen with a sha256 before any
      prediction is evaluated, and the band is defined as a function of Delta0
      rather than chosen.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 8
    maximum_runs: 0
    maximum_workers: 1
    notes: >-
      maximum_runs is 0: no run occurs. The declared wall clock bounds a
      derivation-aid script performing exact integer power-series arithmetic; it
      is not a run, produces no manifest and is not evidence. The dominant cost is
      agent time and is budgeted in the executing handoff.
  stages:
    - id: stage-0-inventory-and-convention
      purpose: >-
        enumerate the committed full-column-exact-rank cells, freeze the list with
        a sha256, write out the boolean-convention derivation, and re-derive H_A
        and H_B from the committed source of the chained system
      blocking: true
    - id: stage-1-separability
      purpose: 'compute and archive Delta0 at every admitted cell'
      blocking: true
    - id: stage-2-instrument
      purpose: 'the full-support null, the planted defect, and the block-permuted control'
      blocking: true
    - id: stage-3-comparison
      purpose: 'evaluate D_pred against D_meas at each admitted cell and report c per cell'
    - id: stage-4-report
      purpose: 'the three tail checks and an explicit statement of what the outcome licenses and forbids'
  stopping_rules:
    - >-
      STOP at stage 1 if Delta0 is identically 0. The tensor identity is not
      separable from the semi-regular reference on this observable; the band is
      not used, no comparison is run, and the non-separability with its forward
      guidance toward a graded observable is the reported result.
    - >-
      STOP at stage 2 if the full-support null does not return exactly 0. The
      series algebra is wrong and nothing else may be read.
    - >-
      STOP at stage 2 if the planted defect does not move the prediction by the
      derived amount, or if the block-permuted control is indistinguishable from
      the true pairing.
    - >-
      STOP at stage 0 if fewer than two cells are admitted. Report UNDERPOWERED
      with the inventory attached.
    - >-
      Do NOT stop early on a cell that agrees. Every admitted cell is evaluated
      and reported; a fit at one cell with a miss at another is reported as
      NON-GENERALIZING and never averaged.
  invalidation_rules:
    - >-
      Computing or revising Delta0, the band definition, or the cell inventory
      AFTER any comparison outcome is seen INVALIDATES the run. Such a change is a
      versioned protocol_amendment and a re-run from stage 0.
    - >-
      Tuning any free parameter to fit a committed deficit INVALIDATES the run.
      The naive form with zero correction is tested FIRST and exactly.
    - >-
      Adopting the source idea cell list without enumerating the committed cells
      INVALIDATES the run.
    - >-
      Including any cell whose committed rank is a subset-column rank INVALIDATES
      that cell, per RQ-DREG-001 constraints.
    - >-
      Applying the two sides of the identity under different series conventions
      INVALIDATES the comparison.
    - >-
      Quoting a PASS as a validated forward-extrapolation route, or as evidence
      about d_reg growth, INVALIDATES the artifact making the statement.
    - >-
      Describing any outcome as a statement about elliptic curves or the ECDLP
      INVALIDATES the artifact. The protocol is power-series arithmetic over a
      boolean polynomial ring and contains no curve.
  success_criterion: >-
    Decidable from the primary metrics, ALL of: (1) the cell inventory is
    enumerated from committed full-column exact ranks and frozen with a sha256
    before any prediction is evaluated; (2) Delta0 is computed and archived at
    every admitted cell BEFORE any comparison; (3) the full-support null returns
    exactly 0, the planted defect moves the prediction by the derived amount, and
    the block-permuted control is distinguishable; (4) if Delta0 is nonzero,
    every admitted cell has a reported D_pred, D_meas, band and c with its sign,
    with no cell omitted and none averaged; and (5) the three tail checks are
    complete and the report states explicitly what the outcome licenses and
    forbids.
    SUCCESS IS PROTOCOL INTEGRITY, NOT AGREEMENT. A run meeting (1) to (5) and
    finding Delta0 identically 0, or finding a large correction term, is a FULL
    SUCCESS.
  falsification_criterion: >-
    ANY of the following, evaluated in this order and reported by name.
    F1 VACUOUS TEST: Delta0 identically 0 on the admitted cells. The identity is
    not separable from the existing null on this observable.
    F2 SERIES BUG: the full-support null does not return exactly 0.
    F3 SIZE-ONLY RESPONSE: the block-permuted control is indistinguishable from
    the true pairing.
    F4 INSTRUMENT DEAD: the planted-defect perturbation does not move the
    prediction by the derived amount.
    F5 NAIVE FORM FALSE: |D_pred minus D_meas| exceeds the band at any admitted
    cell. The zero-correction form is falsified and c with its per-cell sign is
    the surviving deliverable.
    F6 CELL INVENTORY EMPTY OR SINGLE: fewer than two admitted cells; reported
    UNDERPOWERED with the inventory attached.
    F7 EVERYTHING HOLDS: Delta0 nonzero, controls dispose as forced, and D_pred
    agrees within the band at every admitted cell. The identity becomes a
    CANDIDATE zero-marginal-compute predictor, explicitly NOT validated for
    forward extrapolation, and the next step is an out-of-sample check against a
    cell measured after the prediction is frozen.
  artifact_package_directory: experiments/EXP-PFDR-d2263b/runs/AUDIT-001/
  artifact_package_note: >-
    A ZERO-RUN PACKAGE DIRECTORY, not a run. No manifest, no seeds, no timings as
    evidence, and the explicit statement 'certificate kind: none, no run occurred'
    in the execution report.
  required_artifacts:
    - 'experiments/EXP-PFDR-d2263b/runs/AUDIT-001/cell-inventory.yaml (the enumerated committed cells with their sources, the sha256 of the frozen list, and every excluded cell with its reason)'
    - 'experiments/EXP-PFDR-d2263b/runs/AUDIT-001/convention.md (the boolean series convention derivation, written out for both sides)'
    - 'experiments/EXP-PFDR-d2263b/runs/AUDIT-001/delta0.yaml (Delta0 per admitted cell, archived BEFORE any comparison, with its own timestamp and sha256)'
    - 'experiments/EXP-PFDR-d2263b/runs/AUDIT-001/controls.yaml (full-support null, planted defect with its hand-derived expected shift, block-permuted separation)'
    - 'experiments/EXP-PFDR-d2263b/runs/AUDIT-001/comparison.yaml (per cell: D_pred, D_meas, band, |difference|, c with its sign)'
    - 'experiments/EXP-PFDR-d2263b/runs/AUDIT-001/series_eval.py (exact integer power-series arithmetic, standard library only, deterministic)'
    - 'experiments/EXP-PFDR-d2263b/runs/AUDIT-001/tail-checks.yaml (the three declared tail checks)'
    - 'experiments/EXP-PFDR-d2263b/runs/AUDIT-001/execution-report.md (stage by stage; the success-criterion checklist; which of F1 to F7 fired; per-file sha256; the determinism re-execution comparison; the inference block; and the statement that zero runs occurred, no curve appears anywhere, and no record status was changed)'
  interpretation_limits:
    - >-
      A retrodiction at committed cells. A PASS is a candidate predictor and NOT a
      validated extrapolation route; it must still be checked against a cell
      measured after the prediction is frozen.
    - >-
      Toy scale, t = 3, boolean only. Nothing transfers to t at least 4 or to
      prime fields.
    - >-
      A FAIL does not close the lane or answer RQ-DREG-001. It localises where
      cross-block structure lives and hands forward the correction term.
    - >-
      With a small number of admitted cells the design cannot separate a failure
      of per-block semi-regularity from a failure of the combination formula, and
      it does not claim to.
    - >-
      The protocol contains no elliptic curve. No outcome may be described as a
      statement about elliptic curves or the ECDLP.
    - >-
      The block decomposition and the per-block series forms are taken from the
      source idea and are re-derived at stage 0; they are not verified by the
      drafting coordinator, who read H-DREG-5a3ac1 only by targeted search.
  dominated_by: >-
    NOT APPLICABLE as an attack: no algorithm is proposed and no frontier row is
    contested. As a PREDICTOR of the deficit, the incumbent is the direct
    full-glued-matrix rank computation, which is the only source of an ACTUAL
    rather than predicted value and which this protocol does not replace.
  sota_delta: >-
    Exactly 0 on every attack axis. Content delivered: one symbolic separability
    quantity computed before any comparison, a curve-free zero-deficit null, a
    planted defect of known size demonstrating the instrument moves, a
    nearby-object control separating incidence from block sizes, and a per-cell
    correction term with its sign.
  id_allocation_provenance: >-
    EXP-PFDR-d2263b pre-allocated by the tasking Coordinator in
    TASK-20260904-9c61a9 and stated there verbatim against IDEA-20260828-d91efa.
    The authoring subagent has no shell and minted nothing.
  yaml_parse_disclosure: >-
    Written without an interpreter; prose values are folded block scalars or
    quoted scalars; no tabs; no duplicate keys to the author reading. The
    orchestrating session must run a strict parse and tools/validate_ledger.py.
