# EXP-GFPN-8da8d4
# Pair-sum side lemma on y^2 = x^3 + x.
# Frozen before any run. Counts below are a prediction, not a result.
experiment:
  id: EXP-GFPN-8da8d4
  hypothesis_id: H-GFPN-d48ae1
  source_idea: IDEA-20261004-31991f
  question_id: RQ-GFPN-c01af8
  goal_id: GOAL-GFPN-380702
  version: 1
  title: >-
    Side-1 subsum of F_p-rational pair sums on y^2 = x^3 + x
  status: approved
  frozen: true
  designed_at: '2026-10-05'
  approved_by: coordinator
  approval_decision_id: DEC-20261005-165cdc
  objective: >-
    Partition F_p by the Legendre symbol of x^3 + x, add every
    ordered pair of affine points over those x-coordinates by two
    laws, and count violations of the rational 2-torsion condition.
  inputs:
    curve: y^2 = x^3 + x
    field_model: F_p[i]/(i^2 + 1)
    primes: [7, 11, 19]
    excluded_x: roots of x^3 + x
    rational_two_torsion: [infinity, [0, 0]]
    predicted_roots:
      7: [0]
      11: [0]
      19: [0]
    predicted_side0:
      7: [1, 3, 5]
      11: [5, 7, 8, 9, 10]
      19: [3, 4, 5, 8, 9, 12, 13, 17, 18]
    predicted_side1:
      7: [2, 4, 6]
      11: [1, 2, 3, 4, 6]
      19: [1, 2, 6, 7, 10, 11, 14, 15, 16]
    predicted_rational_sum_count:
      7: 48
      11: 120
      19: 360
    predicted_lemma_violations:
      7: 0
      11: 0
      19: 0
    predicted_point_count:
      7: 12
      11: 20
      19: 36
  controls:
    - >-
      Positive control. Two side-0 points have side-1 subsum equal
      to the identity whenever their sum is F_p-rational.
    - >-
      Exclusion control. x = 0 is a root and is not a pair input.
      Including it invalidates the cell.
    - >-
      Two addition laws. Affine slope, and Jacobian coordinates
      with the same short-Weierstrass equation. Neither law may
      import the other's sums.
    - >-
      Nonempty control. The rational-sum count must be positive.
      A zero count is invalid, not a pass.
  independent_variables:
    - prime in {7, 11, 19}
    - addition_law in {affine, jacobian}
  metrics:
    primary:
      - side_partition
      - lemma_violations
      - rational_sum_count
      - routes_agree
    secondary:
      - point_count
      - both_side1_rational_sums
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: >-
      The partitions and counts written under inputs.
      lemma_violations is 0. rational_sum_count is 48, 120, 360.
    formula: >-
      Side is the Legendre symbol of x^3 + x. A sum is F_p-rational
      when it is infinity or both coordinates lie in F_p. The
      side-1 subsum of such a pair is infinity or (0, 0).
    source: >-
      Lemma (L) in IDEA-20261004-31991f, specialized to n = 1 and
      m = 2 on this model. The partitions and counts were computed
      in the design session. That computation is not a run.
  scale_relevance:
    tier: toy
    justification: >-
      Three primes, n = 1, and pairs only. No transfer to a
      Gaudry cost or to EcMasFp5.
    correspondence: null
  tail_checks:
    - >-
      Each prime must report the rational-sum count, not only the
      violation count. A report that stops at violations is invalid.
    - >-
      point_count must equal twice the number of nonzero non-root
      x-coordinates, which is 12, 20, and 36.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: >-
      Deterministic. The two instances are the affine law and the
      Jacobian law. One manifest per (prime, addition_law).
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - Stop after six valid manifests.
    - Do not add a prime, a model, or a pair length.
    - Do not continue a cell after the addition laws disagree.
  invalidation_rules:
    - The two addition laws disagree on a side set, a sum count, or a violation count.
    - A root x is used as a pair input.
    - The rational-sum count is zero.
    - Square roots or sums are loaded from a table instead of computed.
    - A timeout, crash, or missing manifest.
  success_criterion: >-
    All six manifests are valid, the addition laws agree, every
    side partition matches, lemma_violations is 0, and the
    rational-sum counts are 48, 120, and 360.
  falsification_criterion: >-
    The addition laws agree, the rational-sum count is positive,
    and either lemma_violations is positive or a side set or a
    rational-sum count differs from the pre-registered table.
    An addition-law disagreement does not meet this criterion.
  required_artifacts:
    - experiments/EXP-GFPN-8da8d4/runs/<run-id>/command.txt
    - experiments/EXP-GFPN-8da8d4/runs/<run-id>/stdout.txt
    - experiments/EXP-GFPN-8da8d4/runs/<run-id>/stderr.txt
    - experiments/EXP-GFPN-8da8d4/runs/<run-id>/result.json
    - experiments/EXP-GFPN-8da8d4/runs/<run-id>/sides.json
  assigned_to: executor
  out_of_scope:
    - Gaudry cost, twist cost, and any n greater than 1.
    - Any curve besides y^2 = x^3 + x.
    - EcMasFp5 and any model with no rational 2-torsion.
    - Replacing or rescoring H-GFPN-d3c9a1.
