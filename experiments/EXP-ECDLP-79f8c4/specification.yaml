experiment:
  id: EXP-ECDLP-79f8c4
  hypothesis_id: H-ECDLP-536b21
  version: 1
  title: >
    Brute-force Aut instrument on a frozen
    6-variable 3-block positive CNF
  status: approved
  approved_by: coordinator
  approved_at: '2026-09-08'
  approval_decision: DEC-20260908-8da768
  approval_basis: >
    Standing user authorization recorded in AGENTS.md on
    2026-09-06 (ideas and experiments always approved once
    the protocol is complete). Coordinator completeness
    check is DEC-20260908-8da768 after TASK-20260908-07c2a3.
    User confirmation is not an outstanding gate.
  frozen: true
  frozen_at: '2026-09-08'
  execution_authorized: true
  execution_authorized_note: >
    Stage 0 only. Stages 1 and later remain unauthorized
    until an independent review of the Stage 0 instrument
    holds and a later Coordinator decision extends
    execution_authorized_stages. This approval does not
    authorize Stage 1 of EXP-ECDLP-628891, does not
    authorize Stage 1 of EXP-ECDLP-9e9536, does not
    authorize Stage 1 of EXP-ECDLP-90f602, does not
    authorize Stage 2 of EXP-ECDLP-4be480, does not
    authorize Stage 2 of EXP-ECDLP-6a97f4, does not
    authorize Stage 17 of EXP-ECDLP-420e73, does not
    authorize Stage 5 of EXP-ECDLP-a98ea9, does not
    classify W, and does not change H-ECDLP-3f68f6,
    H-ECDLP-b51c3d, H-ECDLP-4afa77, H-ECDLP-2ac931,
    H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6,
    H-ECDLP-2ade73, or H-ECDLP-a3598b.
  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-8da768
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-07c2a3
  source_proposal: IDEA-20260905-a94b5f
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-8da768 under the standing 2026-09-06
    user authorization. Stage 0 is the Aut
    instrument. BreakID/saucy and a torsion-invariant
    V are a later stage and are not run here.

  objective: >
    Compute brute-force variable-permutation Aut on
    one frozen family (REAL3, KF3, NULL3) and decide
    whether the Aut instrument works. Stage 0 does
    not run BreakID, does not run cadical, does not
    construct a torsion-invariant factor base, and
    does not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL3 has |Aut|=6 with the
      committed S_3 images; KF3 has |Aut|=12; NULL3
      has |Aut|=1; empty and two-block objects
      rejected. Certificate kind none.
    formula: >
      Variables a0,a1,b0,b1,c0,c1. Positive CNF.
      REAL3 clauses: (a0 ∨ b0 ∨ c0), (a0 ∨ a1),
      (b0 ∨ b1), (c0 ∨ c1). KF3 is REAL3 plus
      (a1 ∨ b1 ∨ c1). NULL3: (a0), (a1 ∨ b0),
      (b1 ∨ c0 ∨ c1), (a1 ∨ c0), (b1). Aut is the
      set of permutations of the six variables that
      map the clause set to itself. FORCED Stage 0:
      fixture_pass, real_aut_mfact_pass,
      known_false_extra_pass, reject_invalid_pass,
      null_trivial_pass all true.
    source: >
      ledger/proposals/IDEA-20260905-a94b5f.yaml
      proof_search_map.baseline_embedding and
      method_ceiling.nearby_object_control.
      Provenance internal; read in this design session.

  design_tightening_stage0_is_instrument_not_breakid: >
    IDEA-20260905-a94b5f also flags BreakID/saucy
    on a pdp CNF and a torsion-invariant V as later
    questions. Stage 0 does not run BreakID, does
    not construct a torsion-invariant factor base,
    and does not claim the Trimoska pdp encoder.
    That comparison is a Stage 1+ object. This is a
    disclosed tightening, not a silent change of
    the idea's claim.

  inputs:
    fixture:
      variables: [a0, a1, b0, b1, c0, c1]
      real:
        id: REAL3
        m: 3
        l: 2
        clauses:
          - [a0, b0, c0]
          - [a0, a1]
          - [b0, b1]
          - [c0, c1]
        must_aut_order: 6
        must_aut_images:
          - [a0, a1, b0, b1, c0, c1]
          - [a0, a1, c0, c1, b0, b1]
          - [b0, b1, a0, a1, c0, c1]
          - [b0, b1, c0, c1, a0, a1]
          - [c0, c1, a0, a1, b0, b1]
          - [c0, c1, b0, b1, a0, a1]
        role: real_system
      known_false:
        id: KF3
        extra_clauses:
          - [a1, b1, c1]
        must_aut_order: 12
        must_aut_images:
          - [a0, a1, b0, b1, c0, c1]
          - [a0, a1, c0, c1, b0, b1]
          - [a1, a0, b1, b0, c1, c0]
          - [a1, a0, c1, c0, b1, b0]
          - [b0, b1, a0, a1, c0, c1]
          - [b0, b1, c0, c1, a0, a1]
          - [b1, b0, a1, a0, c1, c0]
          - [b1, b0, c1, c0, a1, a0]
          - [c0, c1, a0, a1, b0, b1]
          - [c0, c1, b0, b1, a0, a1]
          - [c1, c0, a1, a0, b1, b0]
          - [c1, c0, b1, b0, a1, a0]
        role: known_false_planted_bitswap
      matched_null:
        id: NULL3
        clauses:
          - [a0]
          - [a1, b0]
          - [b1, c0, c1]
          - [a1, c0]
          - [b1]
        must_aut_order: 1
        role: matched_null
      invalid:
        - id: CNF-empty
          clauses: []
          must_reject: true
        - id: BLOCKS-twoblock
          blocks: {A: 2, B: 2}
          must_reject: true
      working_model: >
        Exact brute-force variable-permutation Aut
        of a frozen 6-variable 3-block positive CNF.
        Not BreakID. Not saucy. Not cadical. Not a
        torsion-invariant V. Not the Trimoska encoder.
      do_not_hunt_a_new_cnf: true

  independent_variables:
    - object in the frozen family
    - presence of the planted bit-swap clause

  null_object:
    name: KF3 planted bit-swap system
    construction: >
      REAL3 plus (a1 ∨ b1 ∨ c1). The simultaneous
      bit-swap is an automorphism, so |Aut|=12.
      This is the known-false object for a
      "|Aut| never exceeds m!" reading.
    non_degeneracy_check: >
      known_false_extra_pass must be true
      before any REAL3 Aut order is read as
      a measurement.
    dynamic_range_demonstration: >
      CNF-empty and BLOCKS-twoblock must be
      rejected before |Aut| is read as an m=3
      census.

  controls:
    - KF3 |Aut|=12 (known-false / proves-too-much)
    - REAL3 |Aut|=6 with committed S_3 images
    - NULL3 |Aut|=1
    - empty and two-block rejection
    - exact discrete Aut, no sampling
    - CNF frozen before any Aut is read

  metrics:
    primary:
      - fixture_pass boolean
      - real_aut_mfact_pass boolean
      - known_false_extra_pass boolean
      - reject_invalid_pass boolean
      - null_trivial_pass boolean
    secondary:
      - REAL3 aut_order / aut_images
      - KF3 aut_order / aut_images
      - NULL3 aut_order
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      One 6-variable 3-block CNF. No transfer to
      BreakID, a pdp encoder, a torsion-invariant
      V, or cryptographic n.
    correspondence: null

  tail_checks:
    - REAL3 clauses are the frozen four clauses
    - KF3 adds (a1 ∨ b1 ∨ c1)
    - NULL3 is the frozen five-clause asymmetric CNF
    - CNF-empty and BLOCKS-twoblock are rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      real_aut_mfact_pass, known_false_extra_pass,
      reject_invalid_pass, and null_trivial_pass.
      A miss classifies the run failed_infrastructure
      if it is a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-AUT.
    - Stages 1 and later are not authorized.
    - Do not hunt a new CNF.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing the 6-variable CNF after this freeze
    - Hunting a new CNF because a frozen cell fails
    - Reading Stage 0 as BreakID, saucy, cadical, a pdp encoder, or a decoder
    - Reading Stage 0 as a torsion-invariant V or an ECDLP advantage
    - Authorizing Stage 1 of EXP-ECDLP-628891 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-9e9536 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-90f602 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-4be480 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-6a97f4 from this contract
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Editing EXP-ECDLP-a5f766 or H-ECDLP-a3598b
    - Changing H-ECDLP-3f68f6, H-ECDLP-b51c3d, H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73

  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, real_aut_mfact_pass,
    known_false_extra_pass, reject_invalid_pass,
    and null_trivial_pass are true, and the run
    manifest carries certificate.kind none.
    Success is instrument reproduction, not a
    BreakID claim and not an attack.

  falsification_criterion: >
    A certified KF3 miss of |Aut|=12 after
    fixture_pass is a scoped miss of P-S0-AUT.
    A certified REAL3 Aut other than the committed
    S_3 after fixture_pass is a scoped miss of
    P-S0-AUT. Infrastructure bugs are not mathematics.
    Stage 0 does not test P-S1-BREAKID.

  required_artifacts:
    - Stage 0 raw-result.json with the five gates
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - One 6-variable toy CNF.
    - Not BreakID. Not saucy. Not cadical.
    - Not the Trimoska pdp encoder.
    - No torsion-invariant V. No decoder. No cryptographic transfer.
    - No Stage 1 of 628891. No Stage 1 of 9e9536.
      No Stage 1 of 90f602. No Stage 2 of 4be480.
      No Stage 2 of 6a97f4. No Stage 17 of 420e73.
      No Stage 5 of a98ea9.
    - Certificate kind none. No solve or attack.
    - W is not classified.
    - EXP-ECDLP-a5f766 remains another lane.
    - Do not hunt a new CNF.
