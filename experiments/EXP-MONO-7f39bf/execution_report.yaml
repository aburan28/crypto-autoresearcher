      3 group additions (m=4), 4 group additions (m=5), per
      IDEA-20260806-9d47e2/EXP-MONO-805a02 (cited, not re-derived).
      `refused_no_declared_conversion: true` and
      `ratio_resolvent_over_enumerate: null` in every one of the 12 cells
