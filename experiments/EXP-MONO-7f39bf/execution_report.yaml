  overall_disposition_RUN_1_2_ORIGINAL_INFRASTRUCTURE_ERROR: >-
    NEITHER `completed_valid` NOR `negative_observation`. The frozen battery
    (STAGE0-GENERIC-CONSTRUCTION-PRECONDITION-GATE, STAGE1-FALSE-POSITIVE-RATE,
    STAGE1B-RANDOM-SUBSET-NULL, STAGE2-FIELD-OPERATION-COST) could not be
    executed at the specification's required scale for either seed
    (20260905, 20260906) because the shared host's root filesystem
    (/dev/disk3s1s1, mounted `/`) returned ENOSPC on essentially every Bash
    tool invocation during the execution window, blocking the Python
    process that runs `implementation/run_experiment.py`. This was
    independently confirmed as a whole-machine condition by the
    Coordinator's own session hitting the identical error at the same time,
    and escalated by the Coordinator to the user (only the user can free
    disk space on a shared box). Per AGENTS.md rule 3 and
    agents/executor.md's own failure taxonomy, this is `infrastructure_error`
    (`failed_infrastructure` at the run level): it is NOT reported, and must
    never be read, as evidence for or against IDEA-20260807-5126f4's
    predictions in either direction, and it is NOT a `negative_observation`.
    This paragraph describes ONLY RUN-MONO-7f39bf-1/-2, an earlier attempt
    against this same frozen contract; it does not describe
    RUN-MONO-7f39bf-3/-4, which are reported in a new section appended
    below.

  what_is_complete_and_durable_independent_of_the_infrastructure_condition:
    - >-
      A full, new, independent implementation
      (`experiments/EXP-MONO-7f39bf/implementation/run_experiment.py`) of
      the CORRECTED partial-locus construction, built exactly per the
      specification's own `objective` (`.subs()` construction with the
      target-substitution step omitted) and H-MONO-6adf3c's own
      `mechanism` field. It reuses `harness/semaev.py` and
      `harness/toycurve.py` directly (frozen implementation base), and does
      not import, execute, or modify EXP-MONO-805a02's own frozen code
      (read-only reference only).
    - >-
      The m=5 branch decomposition (STAGE0 item 0b/0c/0d, named risks
      R1/R2) is derived and implemented as a genuinely new construction:
      4 branches (`2^{5-3}`) obtained via direct elliptic-curve arithmetic
      on the 3 fixed factor-base points (`u = x(e1*P1+e2*P2+e3*P3)`), each
      integrity-checked in code against the resultant-elimination quartic
      `S4_numeric_U(U)`. This is derived and coded, but its actual
      T-dependent-level count versus the idea's own predicted `m-2=3` was
      NOT measured at the specification's required scale (the code exists
      and would report this the moment it runs; see
      `implementation.md`'s own construction section for the full
      derivation and the reasoning for why 4 (not 3) branches is the
      structurally predicted count under this construction, pending
      Stage-0 confirmation by an actual run).
    - >-
      The p=431 curve was found by the specification's own deterministic
      lexicographic search, executed via live code during the one brief
      working-Bash window encountered during implementation: **A=1, B=1**
      (the very first pair tried, `tries=1`), `E: y^2 = x^3 + x + 1` over
      F_431, `#E(F_431) = 464 = 2^4 * 29`, trace `t = -32` (`-32 mod 431 !=
      0`, non-supersingular), largest prime-order subgroup **29** (>= the
      specification's own floor of 20). This is genuinely measured, not
      assumed, and is reproducible from `find_p431_curve()` in the
      implementation.
    - >-
      The Groebner-basis secondary-metric machinery (m=4 only) was built
      and its real cost measured during implementation (informal, disclosed
      in implementation.md): factor-base size 5/6/7/8 at p=211 measured
      1.4s / 11.0s / 44.6s / 150.0s respectively for
      `sympy.groebner(..., modulus=p, order="grevlex")` on the
      3-variable membership ideal -- a genuine measurement (not an
      estimate) that directly motivated the disclosed reduced-probe-size
      protocol choice (`GROEBNER_PROBE_FACTOR_BASE_SIZE = 6`) recorded in
      `implementation.md`.
    - >-
      One informal, reduced-scale pipeline smoke test (m=4, p=211,
      seed=20260905, `STAGE1_CANDIDATES=50`, `STAGE0_SAMPLE_T=5`) ran
      successfully end-to-end before the ENOSPC condition set in:
      STAGE0 `status=pass`, `deg_free_measured=4` (matches `2^{m-2}`
      prediction), `n_branches_T_dependent_discriminant=2` (matches the
      `m-2=2` prediction exactly at m=4), 0/5 root-set mismatches; STAGE1
      (50 trials) `n_pass=50`, `n_reject=0`,
      `false_positive_rate=0.34`. **This is explicitly NOT a run record
      and is not reported as evidence** -- 50 trials is far below the
      specification's own `>=1000` floor, `STAGE0_SAMPLE_T=5` is below the
      `>=20` floor, and `n_reject=0` across only 50 trials is itself an
      observation that would need re-checking at full scale (reported
      honestly regardless of direction once it runs). It is recorded here
      and in `implementation.md` purely to show the implementation is
      internally consistent and executes correctly, not as a substitute
      for the required battery.

