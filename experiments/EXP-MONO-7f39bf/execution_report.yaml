      those already-complete artifacts (no re-computation), and appended
      this section to execution_report.yaml. See each run's own
      manifest.yaml `status_reason` and `deviations_from_protocol` for the
      identical disclosure.

    stage0_forced_output_both_runs: >-
      Per STAGE0's own forced_output requirement (pass/fail per cell; exact
      polynomial degrees; exact non-constancy verdict per branch; exact
      T-dependent-level count versus the m-2 prediction), for both runs and
      all 6 cells (12 gate-checks x 2 tags = 24 individual gate evaluations
      per run):
      m=4 (p in {211,431,1009}, both interval_generator_based and
      random_x_subset tags, both runs): status pass in all cases;
      deg_free_measured=4 matches predicted 2^(m-2)=4; n_branches_total=2,
      n_branches_T_dependent_discriminant=2, matching the idea's own
      predicted m-2=2 exactly; root_set_check 0 mismatches of 25 sampled T
      in every case.
      m=5 (p in {211,431,1009}, both tags, both runs): status pass in all
      cases; deg_free_measured=8 matches predicted 2^(m-2)=8;
      n_branches_total=4, n_branches_T_dependent_discriminant=4 -- this
      does NOT match the idea's own predicted m-2=3
      (T_dependent_count_matches_prediction: false) in every one of the 12
      m=5 gate-checks across both runs. Every individual branch's
      disc_branch(T) was independently verified non-constant in T
      (disc_is_constant_in_T: false in all reported branches, both runs),
      and every branch's predicted root set matched independent
      brute-force root-finding exactly (0 mismatches of 25 sampled T per
      check, both runs). This is named_risk R1-CHARACTER-LEVEL-COUNT,
      reported here as the exact construction found (4 branches, not 3),
      per the specification's own invalidation_rules: reported plainly, not
      reconciled to the m-2 prediction, and reproduced identically under an
      independent replication seed.
    stage1_forced_output_both_runs: >-
      Per STAGE1's own forced_output (false-positive rate and
      true-negative-guarantee fraction per (p,m) cell; n_pass=1000 in every
      one of the 12 (2 runs x 6 cells) measured cells in both runs (the
      required >=1000-candidate floor was met exactly, not exceeded);
      n_reject=0 in every one of those same 12 cells, in BOTH the
      interval/generator-based measurement (Stage 1) and the
      random-x-subset measurement (Stage 1B) -- 24 of 24 reject-counts
      across both runs are exactly 0. Consequently the true-negative
      guarantee fraction (# REJECT independently confirmed root-free / #
      REJECT) is not_computable (0/0) in every cell of both runs, per the
      specification's own metric definition; this is reported here as a
      plain fact of the measurement, without characterizing what it
      implies for IDEA-20260807-5126f4's own predictions.
      Measured false-positive rates (interval/generator-based, RUN-3 seed
      20260905 / RUN-4 seed 20260906): p211 m4 0.328/0.284; p431 m4
      0.609/0.613; p1009 m4 0.798/0.785; p211 m5 0.128/0.047; p431 m5
      0.377/0.409; p1009 m5 0.641/0.633. Full per-cell numbers, including
