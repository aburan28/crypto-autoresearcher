      to completion, well within the 3600s/2GB budget, on both required
      replication seeds. All 6 (p,m) cells (p in {211,431,1009}, m in
      {4,5}) are present in both runs' raw-result.json and both runs'
      manifest.yaml (status: completed_valid). This section reports
      observations only, per the executor's own role: it draws no
      conclusion about whether IDEA-20260807-5126f4's predictions or
      HEUR-MONOIMP-1 are supported or refuted -- that judgment belongs to
      the Coordinator after independent Validator/Red-Team review.
    manifest_note: >-
      Both runs' own raw-result.json, command.txt, environment.json,
      stdout.log, and stderr.log were produced complete and intact by the
      original executing session; only manifest.yaml was missing for both,
      because that session's own agent connection dropped (a tooling/API
