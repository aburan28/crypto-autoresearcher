experiment:
  id: EXP-MONO-7f39bf
  hypothesis_id: H-MONO-6adf3c
  version: 1
  title: >-
    C_2^{m-2} character-tower membership filter at the CORRECTED
    partial locus (target T held generic/symbolic during tower
    construction; m-2 factor-base coordinates concrete) -- false-positive
    rate and field-operation cost versus enumerate-and-test

  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-09-05'
  coordinator_approval_rationale: >-
    APPROVED after independent read-through of this contract,
    H-MONO-6adf3c, and TASK-20260905-7ba385 by the orchestrating
    Coordinator. Standalone small-instance experiment under the classic
    lifecycle (docs/task-lifecycle.md steps 3-7), not a GOAL-MONO-001
    campaign batch -- draws on no exhausted campaign budget. Directly
    continues DEC-20260905-7c2ad9's own `next_action`, itself produced
    after a genuine defect in an earlier draft was caught by independent
    Validator+Red-Team review before archival (TASK-20260905-153d93);
    this design was written with that specific correction as its starting
    point, not from scratch. The `objective` field's own feasibility
    argument is verified against actual code (harness/semaev.py's fully
    symbolic resultant construction; EXP-MONO-805a02's own Stage 5/Stage
    2 precedent for the identical `.subs()` pattern this contract
    modifies), not assumed. Two genuinely new pieces of construction are
    named explicitly as risks (R1: m=5 character-level count unverified;
    R2: disc_branch(T) degree growth unverified) with a hard Stage 0 gate
    and an explicit invalidation rule requiring the Executor to report
    the actual construction found rather than silently patch the
    specification if it differs -- appropriate caution for the one part
    of this contract that is genuinely novel. Budget (3600s/2GB) is
    justified by name against EXP-MONO-805a02's own measured precedent
    (13.755s actual against a 1800s/2GB budget for structurally similar
    work), with the doubled wall-clock time explained by the added
    independent ground-truth root-finding pass across two factor-base
    loci. The p=431 curve is correctly left as a deterministic,
    auditable search procedure for the Executor rather than a fabricated
    (A,B) pair. Success criterion is decidable regardless of which
    direction any measured number points, per the design-experiment
    skill's own requirement.

  objective: >-
    (1) Build, ONCE per (curve, m) cell, the C_2^{m-2} character tower
    for the free summation coordinate with the m-2 factor-base
    coordinates specialized to concrete on-curve x-values and the target
    T left symbolic throughout construction -- the Validator's "third
    reading" per H-MONO-39b1f0's `review_findings_2026_09_05` and
    DEC-20260905-7c2ad9's `next_action`. (2) Verify computationally, as a
    hard precondition gate (Stage 0), that this construction is genuinely
    distinct from H-MONO-39b1f0's own already-decided full-locus case:
    the tower's discriminant/character chain must be a non-constant
    function of T, not a value that has already collapsed to a fixed F_p
    element. (3) Evaluate the tower cheaply, at use time, against many
    concrete candidate targets, and measure IDEA-20260807-5126f4's own
    two open predictions: (a) the filter's false-positive rate on the
    corrected partial locus (predicted below 1/2 at m=4), and (b) its
    field-operation cost per membership decision against the
    enumerate-and-test baseline D_trial(E) = m-1 group additions + O(1)
    lookup (IDEA-20260806-9d47e2; EXP-MONO-805a02's own
    preregistered_prediction and STAGE3-OPERATION-COUNT measurement,
    cited not re-derived).

    FEASIBILITY, VERIFIED BY READING CODE, NOT ASSUMED. `harness/semaev.py`
    builds `s4_expr(a,b)` by symbolic resultant elimination
    (`sympy.resultant(left, right, _t)`, lines 52-59) without ever
    substituting a numeric value for any of x1,x2,x3,x4 -- the returned
    expression is symbolic in all four throughout. Separately,
    `experiments/EXP-MONO-805a02/implementation/run_experiment.py`'s own
    `stage5_m4` (lines ~94-116) and `stage5_m5` (lines 466-505) functions
    already build exactly this kind of specialization for the FULL locus:
    `stage5_m4` computes `expr = S4.subs({x1: P1[0], x2: P2[0], x4sym:
    Rt[0]})`, leaving only x3 free; `stage5_m5` computes an m=5 analogue
    via one further resultant elimination
    (`sympy.resultant(S4_numeric_U, S3_part_fixedT, U)`), substituting
    P1,P2,P3 concretely and T concretely (`S3_part.subs(T, Rt[0])`)
    before eliminating. THE CORRECTED, GENERIC-T CONSTRUCTION THIS
    EXPERIMENT REQUIRES IS THE SAME CODE PATH WITH THE FINAL
    TARGET-SUBSTITUTION STEP REMOVED: `S4.subs({x1: P1[0], x2: P2[0]})`
    for m=4 (x3, x4sym both left symbolic), and
    `sympy.resultant(S4_numeric_U, S3_part, U)` for m=5 (T left symbolic,
    the `.subs(T, Rt[0])` line simply not executed). This is a mechanical,
    low-risk change to an already-working, already-tested code path, not
    speculative new infrastructure -- sympy's `.subs()` with a partial
    substitution dict is standard, documented behaviour. Further
    supporting evidence of low construction risk: EXP-MONO-805a02's own
    Stage 5 (`run_experiment.py` lines 508-529) already computationally
    verified that S4(x1,x2,x3,x4) is fully symmetric under every
    transposition of its four arguments, so which of the four slots plays
    "free root variable" versus "target T" is interchangeable by
    construction, not an arbitrary choice this record must separately
    justify.

    WHAT IS GENUINELY NEW AND NOT YET VERIFIED (named explicitly, not
    smoothed over): the explicit discriminant/character-TOWER
    decomposition of the resulting bivariate polynomial (the two-branch
    construction described in H-MONO-6adf3c's own `mechanism` field: a
    concrete quadratic in the resultant's auxiliary variable, giving two
    concrete branch values via direct elliptic-curve addition, followed
    by one quadratic-in-the-free-variable per branch whose discriminant
    is a genuine polynomial in T) has never been built or measured in
    this corpus. Stage 0 below is the computational check of that
    derivation, not an assumption it holds.

  what_this_is_not: >-
    NOT a re-test of H-MONO-39b1f0's own confirmed full-locus null
    control (falsification condition (c)); that result is cited from
    EXP-MONO-805a02/EV-MONO-08a31f and never re-run here. NOT an ECDLP
    attack, NOT an exponent claim in either direction (H-MONO-6adf3c's
    own `asymptotic_claim` is null). NOT a status change to KN-OPEN-009,
    H-MONO-45183a, or H-MONO-663fb4. NOT a write of any kind outside
    `experiments/EXP-MONO-7f39bf/`.

  inputs:
    reused_infrastructure:
      - path: harness/semaev.py
        role: >-
          s3_expr, s4_expr (Semaev summation polynomials, fully symbolic
          in all arguments before any substitution -- see `objective`
          above); build_factor_base for the interval/generator factor
          base and the random-subset null control; reused directly, not
          reimplemented.
      - path: harness/toycurve.py
        role: >-
          EllipticCurve (add, negate, mul, lift_x, is_on_curve), Point;
          reused directly for all group arithmetic, including the
          concrete t_+ = x(P1+P2), t_- = x(P1-P2) branch values.
    reference_implementation_read_only:
      - path: experiments/EXP-MONO-805a02/implementation/run_experiment.py
        role: >-
          Precedent for the exact `.subs()` construction this experiment
          modifies (stage5_m4, stage5_m5) and for the m=5
          resultant-elimination pattern (Stage 2's own
          "build S_5 by one further resultant elimination from S4 and
          S3"). Read as a REFERENCE for approach only. EXP-MONO-805a02 is
          `frozen: true`; this experiment does not import or execute its
          code as a live dependency, and does not modify it. A new,
          independent implementation is written under
          `experiments/EXP-MONO-7f39bf/implementation/`.
      - path: knowledge/findings/KN-FIND-c41ea9.md
        role: >-
          The unconditional complete-splitting theorem (m-1 of m
          symmetric arguments on-curve) that defines H-MONO-39b1f0's own
          already-decided full-locus case, cited to keep Stage 0's
          precondition check textually anchored to what it must NOT
          reduce to.

  controls:
    - id: STAGE0-HARD-GATE
      description: >-
        Per the battery's STAGE0 below. Hard gate: no Stage 1/2 number
        from a cell whose Stage 0 check fails or flags degeneracy is
        interpreted as evidence for or against IDEA-20260807-5126f4's
        predictions; it is reported as a degenerate-construction finding
        instead.
    - id: FULL-LOCUS-CITATION-NOT-RERUN
      description: >-
        H-MONO-39b1f0's own confirmed full-locus vacuity result
        (EXP-MONO-805a02 Stage 5 / EV-MONO-08a31f) is cited verbatim by
        ID wherever this record's own result set is compared against it.
        Recomputing it here would be redundant per DEC-20260905-7c2ad9's
        own `next_action` ("The full-locus vacuity control need not be
        re-run").
    - id: RANDOM-SUBSET-NULL
      description: >-
        Per IDEA-20260807-5126f4's own `null_object_control.secondary_nulls`:
        repeat the Stage 1 false-positive-rate measurement with a factor
        base of identical size drawn as a uniformly random x-subset of
        on-curve points (not the interval/generator-based factor base).
        If the measured false-positive rate is generic to the
        construction rather than an artifact of factor-base structure,
        the two rates should agree within sampling error; report both,
        do not average them.
    - id: COST-GATE-TOWER-CONSTRUCTION-CHARGED
      description: >-
        Per IDEA-20260807-5126f4's own `null_object_control.secondary_nulls`:
        report the resolvent route's total field operations INCLUDING
        computing the tower's discriminants (the one-time Stage 0
        construction cost), both charged once (un-amortized) and
        amortized per evaluation over the number of candidate targets
        actually tested in Stage 1. Never report only the per-evaluation
        Legendre-symbol cost as if construction were free.
    - id: DEGENERATE-CONSTRUCTION-CHECK
      description: >-
        Any (curve, m) cell whose Stage 0 discriminant chain is found to
        be constant in T (degree 0, i.e. it has already collapsed to a
        fixed F_p element despite T being left symbolic during
        construction) is excluded from the headline Stage 1/2 numbers and
        reported separately as a degenerate cell, with the exact
        polynomial shown, never silently dropped or averaged in.
    - id: GROUND-TRUTH-INDEPENDENT-CODE-PATH
      description: >-
        Stage 1's ground truth for "does a genuine factor-base root
        exist for candidate T" is computed by direct brute-force
        root-finding of the fully-specialized univariate polynomial at
        that concrete T (a second, independent code path from the
        character-tower filter itself), mirroring EXP-MONO-4b50b6's own
        dual-classifier convention (`classify_primary` vs
        `classify_secondary`). A disagreement between the filter's
        REJECT verdict and the ground truth on any sampled candidate is
        an instrument bug (the filter's discriminant chain was derived
        or evaluated incorrectly), never evidence that the idea's
        mechanism is wrong -- the filter's REJECT branch is supposed to
        be an exact necessary condition, not a heuristic one.
    - id: UNIT-DECLARATION-TRIPWIRE
      description: >-
        No group-operation-to-field-operation conversion constant is
        declared anywhere in this contract (per EXP-MONO-805a02's own
        identical control). Any code path that would require comparing
        the resolvent route's field-operation count against
        D_trial(E)'s group-operation count numerically MUST refuse to
        compute a ratio and report `refused_no_declared_conversion: true`
        instead of a number, UNLESS both routes are first converted to a
        common declared unit (field operations, with group addition
        costed as I + 2M + S per EXP-MONO-805a02's own convention if one
        exists there, or a freshly declared and reported constant if not
        -- report which).

  independent_variables:
    - name: m
      values: [4, 5]
    - name: p
      values: [211, 431, 1009]
    - name: locus
      values: [partial_locus_generic_T, random_subset_null]
    - name: factor_base_source
      values: [interval_generator_based, random_x_subset]

  metrics:
    primary:
      - "Stage 0 gate: pass/fail per (p, m) cell, plus the exact count of genuinely T-dependent (non-collapsed) character levels found, versus the idea's own predicted count m-2"
      - "False-positive rate of the character filter on the partial locus, per (p, m) cell"
      - "True-negative guarantee check: fraction of filter REJECT verdicts independently confirmed root-free (predicted 100%; any exception is failed_infrastructure)"
      - "Field operations per membership decision: resolvent route (tower construction charged separately, amortized and un-amortized) versus enumerate-and-test baseline D_trial(E), per (p, m) cell"
      - "Random-subset null: false-positive rate under a random-x-subset factor base, per (p, m) cell"
    secondary:
      - "Closed-form chi-density prediction for the false-positive rate (per HEUR-MONOIMP-1's own validation_plan) versus the measured rate, per (p, m) cell"
      - "Resolvent versus Groebner-basis membership-test field-operation ratio, where a comparable Groebner cell already exists in this lane or can be built with `harness/semaev.py`'s own `measure_s3_decomposition`-style machinery generalized to m in {4,5}"
      - "Table size and lookup count for the enumerate-and-test baseline's O(1) membership test (H2 accounting, per EXP-MONO-805a02's own convention)"

  heuristic_under_test: HEUR-MONOIMP-1
  preregistered_prediction:
    quantity: "False-positive rate of the m-2-level character filter on the corrected partial locus at m=4"
    formula: "< 1/2"
    source: "IDEA-20260807-5126f4's own `predictions[0]`, carried into H-MONO-6adf3c verbatim."

  scale_relevance:
    tier: toy
    justification: >-
      p in {211, 431, 1009}; m in {4,5}. No transfer or extrapolation to
      cryptographic scale is claimed. HEUR-MONOIMP-1 (indicativeness at
      larger m, p) is explicitly flagged as unsupported by rigorous
      argument and is itself under test, not assumed.
    correspondence: null

  tail_checks:
    - >-
      Compare the measured false-positive rate against the closed-form
      chi-density prediction (secondary metric above) at every (p, m)
      cell; report the gap explicitly rather than only a pass/fail
      against the 1/2 bar. A large, consistent gap is itself a result
      about HEUR-MONOIMP-1, per the idea's own `validation_plan`
      ("a mismatch is a result").
    - >-
      At the largest tested m (5), verify the tower-construction step
      terminates within the Stage-2-style timeout (below) at all three
      primes; report the exact wall-clock cost of construction versus
      evaluation separately, since m=5's deeper recursive elimination is
      where a hidden superlinear construction cost would first become
      visible.

  replication:
    seeds: [20260905, 20260906]
    independent_instances: 2

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 2.0
    maximum_memory_gb: 2
    maximum_runs: 2
    maximum_workers: 1
    budget_note: >-
      Small-scale symbolic/numeric work (sympy resultants of degree <= 8
      in the free coordinate, evaluated numerically at three toy primes;
      >= 1000 candidate-target evaluations per (p, m) cell for Stage 1
      plus its random-subset control). EXP-MONO-805a02's own precedent
      for structurally similar work (S_4/S_5 construction plus
      >= 10^5-attempt operation counts) budgeted 1800s/2GB and measured
      13.755s actual. This record's wall clock is set to 3600s (double
      that precedent, still far below the 8GB/600s-per-tool-call
      concerns this is not bound by) because Stage 1 here additionally
      requires an independent brute-force ground-truth root-find per
      candidate target (not just a filter evaluation), across two loci
      (interval and random-subset factor bases) and two m values at three
      primes -- more wall-clock-bearing work than EXP-MONO-805a02's own
      single-locus Stage 5. Memory stays at 2GB, matching precedent,
      because nothing in this contract builds a Macaulay/Groebner matrix
      at a size approaching the 8GB floor's justification (DREG's own
      7.16 GB peak); the largest object here is a degree-8, two-variable
      polynomial and a hash table sized to a toy factor base.

  stopping_rules:
    - >-
      Stage 0 is a hard gate: do not proceed to Stage 1 or 2 for any (p,
      m) cell until that cell's own Stage 0 checks pass or are reported
      as a named degeneracy per DEGENERATE-CONSTRUCTION-CHECK.
    - >-
      If the m=5 resultant/tower construction fails to terminate within
      300 seconds at any prime (per EXP-MONO-805a02's own identical
      stopping rule for its structurally analogous Stage 2), abort that
      cell as `failed_infrastructure` and report the timeout; do not fall
      back to a smaller m silently.
    - >-
      If total wall clock approaches the per-run budget, reduce the
      number of candidate-target samples for the largest untested (p, m)
      cell first, disclose the reduction explicitly in the run record,
      and never silently drop an entire (p, m) cell or an entire control
      (random-subset null, cost accounting) from the report.

  invalidation_rules:
    - >-
      Any post-hoc change to the m values, p values, the factor-base
      size, or the >= 1000-candidate-target floor after Stage 1 numbers
      have been observed requires a versioned `protocol_amendment`.
    - >-
      The reused-infrastructure paths (harness/semaev.py,
      harness/toycurve.py) are frozen as the required implementation
      base; substituting a different S_m or curve-arithmetic
      implementation requires an amendment.
    - >-
      The Stage 0 discriminant/character-tower CONSTRUCTION described in
      this record's own `objective` and in H-MONO-6adf3c's `mechanism`
      is the required starting derivation. If Stage 0 finds it does not
      hold as derived (e.g. a different number of genuinely T-dependent
      levels than predicted, or a different branch structure), the
      Executor reports the actual construction found and proceeds with
      Stage 1/2 using THAT verified construction, not the one assumed
      here -- this is a reportable finding, not grounds to silently patch
      this specification and re-run without a `protocol_amendment`.

  success_criterion: >-
    All of: Stage 0's gate is reported pass/fail/degenerate, explicitly,
    per (p, m) cell, including the exact count of genuinely T-dependent
    character levels found. For every cell where Stage 0 passes: the
    false-positive rate (Stage 1), the true-negative guarantee check, the
    random-subset null, and the field-operation cost comparison (Stage 2,
    with tower construction charged both amortized and un-amortized) are
    all reported, at all three primes and both m values. A run reporting
    all of the above is successful REGARDLESS of which direction any
    individual number points -- a false-positive rate at or above 1/2, a
    resolvent cost at or above the enumerate-and-test baseline, or a
    Stage-0-flagged degenerate cell are all fully decidable, reportable
    outcomes under this contract, not failures of it. Only a
    `failed_infrastructure` abort (per the stopping rules) or an
    unexplained gap against a stated required metric is a failed run.

  falsification_criterion: >-
    See H-MONO-6adf3c's `falsification_conditions` (carried over, not
    restated in full): condition (a) fires if the measured false-positive
    rate is ~1 on the (Stage-0-verified non-degenerate) partial locus;
    condition (b) fires if the resolvent field-operation count (tower
    construction included) is at or above the enumerate-and-test baseline
    at every tested m. Condition (c) is not tested here; it is already
    settled by H-MONO-39b1f0 and cited, not re-derived.

  required_artifacts:
    - implementation.md
    - implementation/ (source code)
    - runs/RUN-MONO-7f39bf-1/
    - runs/RUN-MONO-7f39bf-2/
    - execution_report.yaml

  battery:
    - id: STAGE0-GENERIC-CONSTRUCTION-PRECONDITION-GATE
      description: >-
        Hard gate, runs first, per (p, m) cell. Build g(x_free, T) =
        s4_expr(a,b) [m=4] or its m=5 one-further-resultant-elimination
        extension, with the m-2 factor-base coordinates substituted to
        concrete on-curve x-values and BOTH the free coordinate and T
        left as sympy symbols. (0a) Verify deg_{x_free}(g) == 2^{m-2}
        exactly (no degeneration from the substitution: the leading
        coefficient in x_free must not vanish at the chosen factor-base
        points) and verify g genuinely depends on T (is not constant in
        T). CAN FAIL -> failed_infrastructure. (0b) Construct the
        explicit two-branch decomposition (per this record's own
        `objective`/H-MONO-6adf3c's `mechanism`): concrete branch values
        via direct elliptic-curve addition/negation on the m-2 fixed
        points (zero polynomial arithmetic for this step), then one
        quadratic-in-x_free per branch with discriminant disc_branch(T),
        a polynomial in T. Verify by independent brute-force root-finding
        of g at >= 20 sampled concrete T values per prime that the
        decomposition's predicted root set matches exactly. CAN FAIL ->
        failed_infrastructure. (0c) Report, per branch and per (p,m)
        cell, whether disc_branch(T) is a non-constant polynomial in T
        (predicted: yes, for all branches, at all cells) -- this is the
        precondition distinguishing this construction from H-MONO-39b1f0's
        own already-decided full-locus case. A constant disc_branch(T) at
        any cell is reported as DEGENERATE-CONSTRUCTION-CHECK, not
        silently excluded from reporting. (0d) Report the total count of
        genuinely T-dependent (non-constant-discriminant) character
        levels found per cell, against IDEA-20260807-5126f4's own
        predicted count of m-2; a mismatch is reported as a first-class
        structural finding per the `invalidation_rules` above, not
        reconciled silently.
      forced_output: >-
        Pass/fail per cell; exact polynomial degrees; exact
        non-constancy verdict per branch; exact T-dependent-level count
        versus the m-2 prediction.
    - id: STAGE1-FALSE-POSITIVE-RATE
      description: >-
        m in {4,5} ONLY, p in {211,431,1009}, cells where Stage 0 passed
        only. Build a factor base of on-curve x-coordinates via
        `harness/semaev.py`'s `build_factor_base` (interval/generator
        scope, matching this lane's own convention). For >= 1000
        candidate targets T drawn uniformly among on-curve x-coordinates
        (matching EXP-MONO-805a02 Stage 5's own target-sampling
        distribution, for citability), evaluate the Stage 0 filter
        (chi(disc_branch(T)) for each branch) to decide PASS/REJECT.
        Independently determine ground truth per candidate (does a
        genuine factor-base-element root of g(x_free, T) actually exist)
        by brute-force root-finding plus explicit factor-base membership
        check -- a second, independent code path from the filter itself.
        Report false-positive rate = (# PASS with no genuine root) / (#
        PASS), and the true-negative guarantee check (# REJECT
        independently confirmed root-free) / (# REJECT), predicted 100%.
      forced_output: >-
        False-positive rate and true-negative-guarantee fraction per (p,
        m) cell; PREDICTED false-positive rate below 1/2 at m=4 per
        IDEA-20260807-5126f4, but report whichever direction is measured.
    - id: STAGE1B-RANDOM-SUBSET-NULL
      description: >-
        Repeat STAGE1 exactly, replacing the interval/generator factor
        base with a uniformly random x-subset of on-curve points of
        identical size, per RANDOM-SUBSET-NULL control above.
      forced_output: >-
        False-positive rate under the random-subset factor base, per (p,
        m) cell, reported alongside (not averaged with) STAGE1's own
        number.
    - id: STAGE2-FIELD-OPERATION-COST
      description: >-
        m in {4,5}, p in {211,431,1009}, cells where Stage 0 passed only.
        Instrument the resolvent route's total field operations
        (modular exponentiations for each Legendre symbol, O(log p) each;
        plus the one-time tower-construction cost -- polynomial
        arithmetic to build disc_branch(T) -- charged separately, both
        amortized over the Stage 1 candidate count and un-amortized).
        Compare against D_trial(E) = m-1 group additions + O(1) lookup
        (cited from IDEA-20260806-9d47e2 / EXP-MONO-805a02's own
        STAGE3-OPERATION-COUNT measurement; not re-derived here) under
        the UNIT-DECLARATION-TRIPWIRE control -- refuse a bare ratio
        unless a group-addition-to-field-operation conversion is declared
        and cited. Where a comparable m=4/5 Groebner-basis membership-test
        cost already exists in this lane (search `ledger/` and
        `experiments/` for RQ-MONO-001 Groebner cells at m>=4 before
        building a new one), cite it; otherwise build the minimal
        analogous measurement via `harness/semaev.py`'s
        `measure_s3_decomposition`-style machinery generalized to m in
        {4,5}, flagged explicitly as new work in the run record.
      forced_output: >-
        Field-operation count per route, per (p, m) cell, with the
        declared unit and conversion constant; ratio resolvent/enumerate
        and resolvent/Groebner where computable, `refused_no_declared_conversion:
        true` where not; PREDICTED ratio below 1 at m=4 and 5 per
        IDEA-20260807-5126f4, but report whichever direction is measured.

  observation_requirements:
    - "Report the exact reconciliation between the predicted m-2 T-dependent character-level count and the count actually found at Stage 0, per (p, m) cell."
    - "Report the search method and outcome for locating any pre-existing m>=4/5 Groebner-basis membership-test cell in this lane before building a new one for Stage 2."
    - "Report the curve found at p=431 by the deterministic search below, including its group order and largest prime-order subgroup, per this lane's own EXP-MONO-8ec0e5-style search-tries transparency convention."

  curve_selection:
    p_211: {A: 37, B: 57, provenance: "KN-FIND-c41ea9's committed curve, reused via EXP-MONO-805a02's FIXTURE_A/FIXTURE_B."}
    p_1009: {A: 17, B: 19, provenance: "EXP-MONO-805a02's own SECOND_A/SECOND_B."}
    p_431:
      provenance: >-
        p=431 is precedented in this exact RQ-MONO-001 lane
        (EXP-MONO-4b50b6's own pinned prime set {211,431,809,1601}), but
        that experiment used per-prime RANDOM curve panels, not one fixed
