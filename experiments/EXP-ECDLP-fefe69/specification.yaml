# EXP-ECDLP-fefe69
# Fibre and cover arithmetic. No character sum.
# Approved by DEC-20261002-f915d1.
experiment:
  id: EXP-ECDLP-fefe69
  hypothesis_id: H-ECDLP-fea0be
  source_idea: IDEA-20260920-6f7416
  question_id: RQ-ECDLP-160d89
  version: 1
  title: Fibre and cover arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-f915d1
  objective: >-
    Check the unequal-fibre bounds, the t-fold charges, and the
    subspace indices of a 2-dimensional space over a 5-element field.
  inputs:
    fibres: [1, 2, 3, 6]
    n: 12
    M: 4
    n_max: 6
    average: 3
    ratio_num: 2
    ratio_den: 1
    b: 2
    sqrt_2b: 2
    bound_max_num: 1
    bound_max_den: 4
    bound_avg_num: 1
    bound_avg_den: 8
    doubling_ceiling: 12
    t_values: [1, 2, 3]
    insertion: [1, 2, 3]
    candidates: [1, 4, 9]
    indices: [1, 5, 25]
    absent_index: 10
    nonzero_characters: 24
  controls:
    - >-
      The fibre-max bound is 1/4. The average bound is 1/8. Reporting
      the fibre-max bound as 1/8 invalidates the run.
    - >-
      At t = 2 the candidate factor is 4 and the insertion factor is
      2. Reporting the candidate factor as 2 invalidates the run.
    - >-
      The doubling ceiling is 12. Reporting another ceiling
      invalidates the run.
    - >-
      The subspace indices are 1, 5 and 25. Reporting 10 as one of
      them invalidates the run.
    - >-
      The nonzero characters number 24, which is 25 minus 1.
      Reporting 25 invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - fibre partition
    - route in {sums, products}
  metrics:
    primary:
      - bound_max
      - candidate_t2
      - absent_index
      - implementations_agree
    secondary:
      - bound_avg
      - nonzero_characters
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The bounds 1/4 and 1/8 and the candidate factor 4.
    formula: >-
      The largest fibre is at least the average n/M. With branching
      b = 2, twice the branching is a square and its square root is
      2. The fibre-max bound is n_max over n times that square root.
      The average bound replaces n_max by n/M. A t-fold cover
      multiplies insertion by t and candidates by t squared. Subspace
      indices of a 2-dimensional space over a prime field are the
      powers of that prime.
    source: >-
      IDEA-20260920-6f7416 states the unequal-fibre bound and the
      t-fold charge, read 2026-10-02. The comparisons were computed
      in this design session. That computation is not a run. No
      character sum was evaluated.
  scale_relevance:
    tier: toy
    justification: One partition of 12 and one prime field of 5 elements. No transfer to a walk.
    correspondence: null
  tail_checks:
    - The t = 3 row is required. Stopping at t = 2 and still reporting the factor 9 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the candidate factor at t = 2 is reported as 2, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The fibre-max bound is reported as 1/8.
    - The candidate factor at t = 2 is reported as 2.
    - The index 10 is reported as a subspace index.
    - The nonzero character count is reported as 25.
    - A character sum or a walk is reported.
  success_criterion: >-
    Both runs agree that the fibres sum to 12, the largest is 6, the
    bounds are 1/4 and 1/8, the doubling ceiling is 12, the cover
    factors are 1, 2, 3 and 1, 4, 9, the subspace indices are 1, 5
    and 25, and the nonzero characters number 24.
  falsification_criterion: >-
    The runs agree, the fibre-max bound stays 1/4, and any factor
    differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-ECDLP-fefe69/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-fefe69/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-fefe69/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-fefe69/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-fefe69/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-fefe69/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any character sum, Fourier coefficient, or walk.
    - Any claim that a branching escape is closed.
    - A cost model for unequal fibres beyond the bound comparison.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
