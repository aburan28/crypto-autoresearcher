  # --------------------------------------------------------------- deviations
  protocol_deviations:
    - id: D-1
      kind: implementation gap (implementation_error class for the affected cells; not evidence)
      detail: >-
        The frozen stopping rule says: "If PARI alginit ... fails ... at a
        prime: record the error, use the A2 fallback for that prime where
        possible, continue."
        - The driver recorded the error and continued. It computed A2 there
          (valid, R = 1, with PARI matdet through a separate matdet-only gp
          call).
        - It implements the A2 base-order fallback only when alginit
          SUCCEEDS and A1 fails C-ALG. The arms A3-A6 and the controls are
          computed through a PARI algebra object, so none of them ran at
          p = 9223372036854775837.
        - A post-run scratch diagnostic (below; not a run) shows that
          alginit(nfinit(y), [-2, -p], , 0), i.e. without the maximal-order
          computation, initialises at that prime. An A2-based fallback over
          such an algebra was therefore feasible in principle but was not
          implemented.
        Consequence: 64 cells are missing, and the prime is
        INCONCLUSIVE-CONSTRUCTION.
    - id: D-2
      kind: tool failure (recorded; never evidence)
      detail: >-
        PARI/GP 2.15.4 alginit(nfinit(y), [-2, -9223372036854775837]) raises
        error("impossible inverse in dvmdii: 0."). The post-run scratch
        diagnostic finds the error deterministic under setrand(1..6), and
        also with an explicit variable. The same call succeeds for the other
        tier M 5 mod 8 prime 9223372036854776077 and for all tier L primes.
        The diagnostic is not a run record, and no cell value was taken from
        it.
    - id: D-3
      kind: derived-label defect in driver.py tally() (mirrored in check.py)
      detail: >-
        Controls NOT COMPUTED at the missing prime are counted as failed
        controls. The recorded primary code is therefore INCONCLUSIVE-NEAR,
        where the contract's definition ("C-NEAR mismatch") dictates
        INCONCLUSIVE-CONSTRUCTION. The recorded list also includes a generic
        INCONCLUSIVE. No measurement is affected. The code was not edited
        after the run: raw-result.json and the code hashes are immutable.
        A corrected implementation belongs in any future run under a new
        RUN id.
    - id: D-4
      kind: documented executor choice (contract allows it)
      detail: >-
        A3: P was built as pO + (lift of the kernel mod p of the matrix
        Trd(e_i e_j) on O). This rests on the recalled fact P = p O^#. The
        contract allows the construction "at the executor's choice ...
        documented". It was verified per lattice by C-ALG (e), with the extra
        diagnostic [O:P] = p^2 (21/21).
    - id: D-5
      kind: literal reading, disclosed
      detail: >-
        A6: the off-diagonal entries H[i][j] (i < j) are drawn in
        [0, H[j][j]), per the frozen wording "diagonal entry of their column".
        This is not the canonical row-reduced HNF normalisation. Any upper
        triangular integer H with positive diagonal of product m gives an
        index-m full-rank sublattice, and the index was measured as |det H|
        (and independently from the bases).
    - id: D-6
      kind: added randomness control
      detail: >-
        PARI setrand(1) is called immediately before every alginit, so that
        alginit's internal randomness, if any, is fixed and recorded.
        Stage 1 and stage 2 structure constants are identical at all 21
        primes.
    - id: D-7
      kind: additional checks beyond the contract (none triggered)
      detail: >-
        - For A3/A4, the index and n(I) instruments (PARI versus Python) must
          agree, or the lattice is marked instrument-invalid.
        - For the rank-3 C-NEAR lattices, C-ALG requires trace-zero basis
          elements and containment in O or P.
        - The stage 2 structure constants must equal stage 1's.
        - For A6, H must equal the planned H, the form scale must equal the
          parent's, and the parent must be valid.
        - The precedence among several triggered codes
          (F-INFRA > F-INSTR > INVALID > F-NORM > F-SUB > INCONCLUSIVE-*) is
          an implementation choice. It did not matter here apart from D-3.
    - id: D-8
      kind: development executions before the run (disclosed; not run records)
      detail: >-
        - Scratch-only development executions before RUN-SSIQ-81bd08, all
          outside the repository:
          - One gp smoke test of build_lattices.gp at p = 7 (a frozen tier S
            prime), with non-protocol inputs: A4 seeds 1..20, identity A6
            matrices except one.
          - Driver development runs in a --dev-primes mode on primes OUTSIDE
            the frozen set: 29, 31, 41, 73, three primes just above 2^100,
            and three just above 2^200.
          - Two fault-injection tests:
            - A tampered raw-result.json: check.py exits 1.
            - A2 replaced by the non-maximal order Z<1,i,j,k> at p = 31: the
              code becomes INCONCLUSIVE-INSTRUMENT, as designed.
        - The p = 7 smoke test exposed an operator-precedence bug in the A5
          right-order computation, which gave non-maximal lattices. It was
          fixed before the run.
        - No value from any development execution is used anywhere.
    - id: D-9
      kind: environment capture defect (minor)
      detail: >-
        environment.json gp_version_full is empty (gp prints --version to
        stderr). version_short (2.15.4) and the binary sha256 are recorded.
    - id: D-10
      kind: note completed after the run
      detail: >-
        derivation-note.md existed before the run, so the S6 presence check
        passed. After the run only Section 9 was changed: the M-EXP baseline
        table was generated by script from raw-result.json, plus one sentence
        on arithmetic reading.

