  reason: >-
    Version 1 cannot reach any decisive code at p = 9223372036854775837.
    (1) Its stopping rule says "use the A2 fallback for that prime where
    possible", but its base_order_rule defines a fallback only for the case
    where alginit SUCCEEDS and A1 fails C-ALG. It gives no route to a PARI
    algebra object when alginit itself raises, and arms A3-A6 and the
    controls C-TRD, C-NOSCALE, C-NONMAX, C-NEAR are defined over that
    object. "Where possible" is therefore underdetermined, and the
    implementation read it as "only the Python A2 cell" (D-1). (2) The
    frozen text does not say how a control that was never computed enters
    the outcome codes, and the implementation counted it as a failed control,
    which mislabelled RUN-SSIQ-81bd08 INCONCLUSIVE-NEAR (D-3). (3) Version 1
    authorises exactly one run (budget.maximum_runs 1,
    execution_authorized_note), so completing the prime needs an
    authorisation this file supplies.

  # ---------------------------------------------------------------------------
  # (a) CONSTRUCTION FALLBACK WHEN alginit ITSELF RAISES
  # ---------------------------------------------------------------------------
  fallback_rule:
    applies_when: >-
      A call alginit(...) at a prime RETURNS A PARI ERROR, caught by iferr
      (as build_lattices.gp stage1 already catches it), with its message
      recorded. It does NOT apply to a timeout, gp crash, memory-cap kill or
      watchdog expiry: those stay under the version-1 stopping rule "STOP;
      report F-INFRA". isprime handling is unchanged.
    rule_text: >-
      ROUTE LADDER, tried in order at each prime, stopping at the first route
      that yields a valid base order. Every call is preceded by setrand(1)
      (the version-1 D-6 practice, now binding).
      R1 (version 1, unchanged): al = alginit(nfinit(y), [a, b]) with the
      frozen presentation (a, b) and the default maximal-order computation.
      If it does not raise, version 1 applies verbatim at this prime: A1 =
      the stored order O_0, base = A1 if A1 passes C-ALG, otherwise the
      version-1 A2 fallback inside this algebra subject to gate G-A2 below.
      No further route is tried at this prime.
      R2 (only if R1 raised): al = alginit(nfinit(y), [b, a]), the SAME
      quaternion algebra with the two generators swapped ((a, b)_Q and
      (b, a)_Q are isomorphic via i <-> j), with the default maximal-order
      computation. R2 must pass C-ALG (a) for the presentation (b, a)
      (ramification exactly {p, inf} by algramifiedplaces and Hilbert
      symbols), C-ALG (b) (Nrd(1) = 1, Nrd(2) = 4), and the check that the
      exported structure constants reproduce algmul on all 16 basis products.
      If R2 does not raise and its stored order passes C-ALG (c) and C-CROSS,
      that order IS the A1 cell at this prime (a PARI-computed maximal order
      of B_{p,inf}; falsification-bearing exactly as A1, R = 1 predicted), it
      is the base order, and A3, A4, A5, A6 and every control are computed in
      this algebra exactly as version 1 defines them. If R2 raises, or R2's
      algebra fails C-ALG (a)/(b)/structure constants, go to R3. If R2's
      stored order is computed but fails C-ALG (c) or C-CROSS, it is recorded
      as the A1 cell, EXCLUDED with its reasons (INCONCLUSIVE-CONSTRUCTION
      for that cell, as version 1), and the base order comes from R3.
      R3 (only if R1 raised and R2 gave no valid base order):
      al = alginit(nfinit(y), [a, b], , 0), the frozen presentation WITHOUT
      the maximal-order computation. R3 must pass C-ALG (a), C-ALG (b), the
      structure-constant check, and the defining relations of the recorded
      images of i, j, k (i^2 = a, j^2 = b, ij = -ji, k = ij). The base order
      O is then the spec's A2 hand-written order for the prime's class
      (specification arms.A2_hand_written_maximal_order, unchanged), mapped
      into this algebra's basis through the images of 1, i, j, k. O must pass
      C-ALG (c) in PARI coordinates and C-CROSS, and gate G-A2. If all hold,
      A3, A4, A5, A6 (the k = 0 lattice is "A1 (or fallback base O)", as
      version 1 already says) and every control are computed on O exactly as
      version 1 defines them. The A1 cell at this prime is then NOT COMPUTED
      (cause: construction; reason: PARI maximal-order computation raised
      under R1 and R2), unless R2 recorded it as excluded.
      GATE G-A2 (every A2-based base order, under R1 or R3): the Python A2
      cell at the same prime must be valid (C-ALG, C-CROSS) with R = 1
      exactly. If it is not, A2-based fallback is not available at that
      prime (a hand-written order that is not shown maximal must not become
      the base of falsification-bearing arms), and the version-1 D-STD
      reading of the A2 cell applies unchanged.
      STAGE CONSISTENCY: the route chosen at stage 1 is reused verbatim at
      stage 2 (same presentation, same maxord flag, setrand(1)). If stage 2
      raises, or its structure constants differ from stage 1's, no further
      route is tried at that prime and every PARI-side cell there is not
      computed (cause: construction).
      TERMINAL CASE: a prime at which every declared route fails to yield a
      valid base order STAYS INCONCLUSIVE-CONSTRUCTION for that prime, as the
      version-1 stopping rule says. Its A2 cell is still computed in Python,
      and every PARI-side cell (A1, A3, A4 x 20, A5 x 20, A6 x 22, C-TRD,
      C-NONMAX, C-NEAR, C-NOSCALE x 20) is listed as not computed with the
      route errors recorded. No further route may be improvised in the run.
    consequence_for_success: >-
      NOT CHANGED, STATED EXPLICITLY. S1 still requires all 946 planned
      lattices, including A1 at every prime. A prime resolved by R2 can
      contribute a valid A1 cell. A prime resolved only by R3 leaves its A1
      cell not computed, so S1 and therefore SUCCESS cannot hold; the outcome
      is then INCONCLUSIVE-CONSTRUCTION with that one blocking cell named
      (plus any others), even if every other cell is exact. This file does
      not redefine A1 to admit the hand-written order, because A1 is the
      independent PARI instrument and A2 already occupies the hand-written
      slot.
    recording: >-
      Per prime, raw-result.json prime_status carries: construction_route
      (R1 | R2 | R3 | none), every route attempted with its exact alginit
      call and its error message or null, presentation_used, maxord_flag,
      base (A1 | A2_fallback | none), and the G-A2 gate result where
      evaluated. M-VALID's "base-order fallback flag per prime" is reported
      as this route record. The manifest and execution report summarise it.

  # ---------------------------------------------------------------------------
  # (b) OUTCOME-CODE TALLY
  # ---------------------------------------------------------------------------
  tally_rule:
    cell_states: >-
      Every planned lattice (946 primary, 484 A6, 462 M-INDEX ideals) and
      every planned control value (C-TRD x 22, C-NONMAX x 22, C-NEAR x 22,
      C-NOSCALE x 440) has EXACTLY ONE state: COMPUTED_VALID;
      COMPUTED_EXCLUDED (C-ALG or C-CROSS failure, reasons listed); or
      NOT_COMPUTED, with a reason and a cause class, either CONSTRUCTION (no
      valid base order, a route failure, a stage inconsistency, or a parent
      lattice not computed) or INFRASTRUCTURE (timeout, crash, memory cap,
      watchdog).
    rule_text: >-
      AN UNCOMPUTED CONTROL IS "NOT COMPUTED", NEVER A MISMATCH, NEVER A
      FAILED CONTROL. A control's pass/mismatch verdict exists only for a
      COMPUTED value. NOT_COMPUTED controls and cells are listed in their own
      fields (controls_not_computed, cells_not_computed) and never appear in
      controls_failed or any mismatch list. Codes are triggered as follows,
      each from the specification's own definitions: INVALID iff a COMPUTED
      C-TRD, C-NOSCALE or C-NONMAX ratio (or the C-NONMAX index) on lattices
      passing C-CROSS differs from its exact pre-registered value;
      INCONCLUSIVE-NEAR iff a COMPUTED C-NEAR value on valid lattices differs
      from p^2/4 or p/4; F-NORM, F-SUB, F-INSTR and INCONCLUSIVE-INSTRUMENT
      exactly as version 1 defines them, on computed cells only;
      INCONCLUSIVE-CONSTRUCTION iff any cell is COMPUTED_EXCLUDED under C-ALG
      or any cell or control is NOT_COMPUTED with cause CONSTRUCTION (the
      version-1 stopping rule "a prime with no valid base order is
      INCONCLUSIVE-CONSTRUCTION"); F-INFRA iff any NOT_COMPUTED cause is
      INFRASTRUCTURE. The generic umbrella INCONCLUSIVE ("neither SUCCESS nor
      F-NORM/F-SUB ... with the blocking cells named") is listed only for a
      blocking cell that no specific code covers, for example a computed
      must-fail control with the correct ratio but R = 1 (version-1
      invalidation note, "it does block S4").
    success_unchanged: >-
      A NOT_COMPUTED cell or control is never a pass either. S1-S4 still
      require every planned lattice and every control at all 22 primes to be
      COMPUTED and to meet its criterion, so any NOT_COMPUTED item blocks
      SUCCESS and is named as a blocking cell.
    precedence: >-
      When several codes trigger, the primary label follows the order
      F-INFRA > F-INSTR > INVALID > F-NORM > F-SUB > INCONCLUSIVE-INSTRUMENT >
      INCONCLUSIVE-NEAR > INCONCLUSIVE-CONSTRUCTION > INCONCLUSIVE. This is
      the order RUN-SSIQ-81bd08's driver already used (D-7), now declared. The
      primary label never replaces the full triggered list and the blocking
      cells, which are always reported; the Coordinator reads the list.
    checker: >-
      check.py (version-2 file) recomputes the cell states, the triggered
      list, the primary label and the blocking cells under this rule,
      independently of the driver, and must agree exactly (S7).

  # ---------------------------------------------------------------------------
  # D-3 ADJUDICATION (RUN-SSIQ-81bd08, read under VERSION 1 only)
  # ---------------------------------------------------------------------------
  d3_adjudication:
    ruling: >-
      Under the frozen version-1 contract's own definitions, RUN-SSIQ-81bd08
      carries outcome code INCONCLUSIVE-CONSTRUCTION (a case of the umbrella
      INCONCLUSIVE), with blocking cells = the 64 PARI-side cells at
      p = 9223372036854775837 (A1, A3, A4_1..20, A5_1..20, A6_0..21, C-TRD,
      C-NONMAX, C-NEAR, C-NOSCALE_1..20). It does NOT carry
      INCONCLUSIVE-NEAR. The label "INCONCLUSIVE-NEAR" in its raw-result.json
      is a derived-label defect of driver.py tally() (mirrored in check.py),
      not the contract's code.
    basis: >-
      (1) The specification defines INCONCLUSIVE-NEAR as "C-NEAR mismatch"
      (falsification_criterion) and the C-NEAR control text says "A mismatch
      means ... outcome INCONCLUSIVE-NEAR". A mismatch requires a computed
      value; C-NEAR was not computed at the failed prime and returned exactly
      p^2/4 and p/4 at all 21 computed primes, so no mismatch exists.
      (2) The stopping rule states "a prime with no valid base order is
      INCONCLUSIVE-CONSTRUCTION for that prime", and the run had no base
      order at that prime (base = none). (3) INVALID is not triggered: it is
      defined by a control RATIO differing from its pre-registered value, and
      every computed ratio was exact. (4) F-NORM and F-SUB are not triggered:
      0 of 904 valid primary lattices and 0 of 462 valid sublattices have
      R != 1, and 0 of 441 evaluated ideals have [O : I] != n(I)^2.
      (5) F-INSTR and F-INFRA are not triggered (M-CROSS = 0; no timeout,
      crash, cap or watchdog). (6) SUCCESS fails on S1-S4 coverage only. The
      falsification_criterion's parenthetical "(C-ALG exclusions)" does not
      literally cover a prime with no base order; the stopping rule does, and
      the umbrella clause requires the blocking cells to be named, which they
      are.
    what_this_does_not_do: >-
      It does not re-score RUN-SSIQ-81bd08 under version 2, does not edit its
      raw-result.json, manifest or logs, does not merge its cells with any
      other run, and does not upgrade any of its measurements. The recorded
      string "INCONCLUSIVE-NEAR" stays in the immutable raw-result.json; this
      ruling states which code the version-1 contract dictates. The executor
      report (execution-report.yaml outcome) and manifest
      (outcome_code_contract) already state the same code.

  # ---------------------------------------------------------------------------
  # CHANGES (binding; numbered; additive)
  # ---------------------------------------------------------------------------
  changes:
    - id: C-1
      part: (a)
      target: specification stopping_rules[2] ("If PARI alginit or isprime fails ...")
      change: >-
        For an alginit that RAISES a PARI error, "use the A2 fallback for
        that prime where possible" is made precise as fallback_rule
        (routes R1 -> R2 -> R3, gate G-A2, stage consistency, terminal case).
        The terminal clause "a prime with no valid base order is
        INCONCLUSIVE-CONSTRUCTION for that prime" is unchanged. isprime and
        hang handling are unchanged.
    - id: C-2
      part: (a)
      target: specification arms.base_order_rule; arms.A1_pari_maximal_order (source only at an R2 prime)
      change: >-
        base_order_rule gains the R2 and R3 cases of fallback_rule and gate
        G-A2 for every A2-based base order (the version-1 path "A1 fails
        C-ALG" included). At an R2 prime only, the A1 cell's algebra is
        alginit(nfinit(y), [b, a]); A1 remains PARI's default maximal-order
        computation of B_{p,inf}, falsification-bearing, with prediction
        R = 1. A2 is untouched: always built in Python in the frozen (a, b)
        coordinates. DIRECTION: R2 can only add a falsification-bearing cell
        at a prime that version 1 left empty; G-A2 can only withhold an
        A2-based base, and at the one prime where it can bind in the planned
        run the A2 cell was already observed valid with R = 1 in
        RUN-SSIQ-81bd08 (A2 is seed-free and deterministic), so G-A2 was not
        chosen to move any outcome. G-A2 prevents a false F-NORM that a
        non-maximal hand-written base would produce in A3-A5.
    - id: C-3
      part: (a)
      target: specification metrics M-VALID (recording only)
      change: >-
        The per-prime base-order fallback flag is reported as the route
        record of fallback_rule.recording. No new metric and no new criterion.
    - id: C-4
      part: (b)
      target: outcome-code derivation (the mechanical application of success_criterion, falsification_criterion, invalidation_rules and the stopping rule)
      change: >-
        tally_rule applies, in the driver and independently in check.py.
        Uncomputed items are NOT_COMPUTED with a cause, never mismatches;
        they block SUCCESS and trigger INCONCLUSIVE-CONSTRUCTION or F-INFRA by
        cause. Precedence is declared. No criterion text, count or value
        changes.
    - id: C-5
      part: (c)
      target: specification budget.maximum_runs; execution_authorized_note ("additional runs" not authorised)
      change: >-
        Protocol version 2 authorises EXACTLY ONE run, RUN-SSIQ-004595, a
        FULL re-run over ALL 22 primes and every arm and control. The
        experiment then holds two run directories: RUN-SSIQ-81bd08
        (version 1, prior attempt, recorded as is) and RUN-SSIQ-004595
        (version 2, run of record for the experiment's outcome). No further
        run without a new Coordinator decision. A retry after an
        infrastructure failure needs a new RUN id and a decision; the run
        directory is never reused or overwritten.
    - id: C-6
      part: (c)
      target: run identity and comparability
      change: >-
        RUN-SSIQ-004595 keeps every version-1 input and implementation choice
        identical except what C-1 to C-4 change: the prime search and the 22
        primes, presentations, target norms, m_list, the A4 attempt cap,
        base_seed 20260926 and the seed derivation, the A3 construction
        (D-4), the literal A6 off-diagonal reading (D-5), setrand(1) before
        every alginit (D-6) and the additional validity checks (D-7). Its
        outcome code is derived from RUN-SSIQ-004595 ALONE; no cell of
        RUN-SSIQ-81bd08 is imported, pooled or used to fill a gap.
        REPRODUCIBILITY COMPARISON (report only, feeds no criterion): at the
        primes where both runs used route R1, the executor compares every
        lattice basis, exact Gram, both determinants, R and control value of
        RUN-SSIQ-004595 with RUN-SSIQ-81bd08, and writes the comparison to
        runs/RUN-SSIQ-004595/comparison-to-RUN-SSIQ-81bd08.json. Identity is
        expected (deterministic seeds and code). Any difference is an anomaly
        routed to independent review; it does not change the mechanical code.
        The 21 reproduced primes are a deterministic re-computation, not
        independent replication, and no record may count them as a second
        sample.
    - id: C-7
      part: (c)
      target: specification required_artifacts (additional version-2 paths; version-1 paths unchanged)
      change: >-
        The version-1 implementation files and derivation-note.md stay
        byte-identical, because RUN-SSIQ-81bd08's manifest binds their
        sha256 values and the note is the closure artifact under review.
        Version 2 adds:
        experiments/EXP-SSIQ-6916e8/implementation/v2/build_lattices.gp,
        experiments/EXP-SSIQ-6916e8/implementation/v2/driver.py,
        experiments/EXP-SSIQ-6916e8/implementation/v2/check.py, the full run
        package under experiments/EXP-SSIQ-6916e8/runs/RUN-SSIQ-004595/
        (manifest.yaml, raw-result.json, command.txt, environment.json,
        stdout.log, stderr.log, check.stdout.log, check.stderr.log,
        comparison-to-RUN-SSIQ-81bd08.json), and
        experiments/EXP-SSIQ-6916e8/execution-report-v2.yaml. The manifest
        records protocol_version 2 and this file's path and committed sha256.
        S6 is read against the existing derivation-note.md, which this run
        does not modify; the M-EXP table for RUN-SSIQ-004595 goes in
        raw-result.json and execution-report-v2.yaml.

  affected_runs: []
  affected_runs_note: >-
    EMPTY. RUN-SSIQ-81bd08 is not altered, not re-scored under version 2 and
    not superseded as a record; its code under version 1 is stated in
    d3_adjudication. RUN-SSIQ-004595 does not exist at the time of writing and
    is governed by protocol version 2 from its start.

  confirmatory_status: preserved
  confirmatory_status_basis: >-
    PRESERVED, with the post-run disclosure in pre_data_status. Every
    prediction is an exact value fixed in version 1 before any run and
    untouched here; no threshold, count, control value or criterion moves.
    The changes add construction routes that can only create
    falsification-bearing cells at a prime version 1 left empty, and fix a
    label rule that touched no measured value. What is NOT new evidence: the
    21 primes RUN-SSIQ-81bd08 already computed are deterministically
    re-computed (C-6), so the v2 run adds at most one prime of new
    measurement plus a determinism check.

  review_obligations: >-
    The post-run validator of RUN-SSIQ-004595 checks, in addition to the
    version-1 review plan: (1) the route ladder was entered only at primes
    where R1 raised, each attempt and error is recorded, and no unlisted
    route was used; (2) at an R2 prime, C-ALG (a) was checked for the
    presentation (b, a) and the A1 cell is PARI's stored order of that
    algebra; (3) at an R3 prime, G-A2 was evaluated and the mapped base
    reproduces the Python A2 Gram; (4) check.py's tally applies tally_rule
    and no NOT_COMPUTED item appears as a mismatch; (5) the comparison file
    shows identity at the shared R1 primes, or its differences are explained;
    (6) this file's d3_adjudication.

  asserts_nothing_about: >-
    Whether det(Hom(E, E'), deg) = p^2/16 holds, whether H-SSIQ-a9df38 is
    supported, or whether PARI's error indicates anything about the algebra
    at that prime (it is a tool failure, never evidence). It fixes how the
    frozen protocol is executed and labelled for one new run.
