  purpose: >-
    The single deterministic run of EXP-SSIQ-6916e8 v1. It computes exact
    Gram determinants of the reduced-norm form on arms A1-A6, plus controls
    C-TRD, C-NOSCALE, C-NONMAX, C-NEAR, C-ALG and C-CROSS, at the 22 frozen
    primes.
  status: completed
  validity: completed_valid
  validity_scope: >-
    The run's measurements cover 21 of 22 primes completely. At
    p = 9223372036854775837 (tier M, 5 mod 8), PARI alginit raised
    "impossible inverse in dvmdii: 0." in stage 1. Per the frozen stopping
    rule the error was recorded and the run continued. Arm A2 was still
    computed at that prime (valid, R = 1). No PARI-side base order existed
    there, so 64 PARI-side cells are recorded as missing with that reason:
    A1, A3, A4 x20, A5 x20, A6 x22, and the controls C-TRD, C-NONMAX,
    C-NEAR and C-NOSCALE x20. The frozen stopping rule makes this prime
    INCONCLUSIVE-CONSTRUCTION. The implementation did not attempt an A2-based
    fallback for an alginit FAILURE: its fallback path covers only the case
    where alginit succeeds but A1 fails C-ALG. See deviations D-1 and D-2.
  validity_reason: >-
    Every computed lattice (1450 records, excluding the 64 missing cells)
    passed C-ALG and C-CROSS. PARI matdet and Python Fraction elimination
    agree on every determinant. The algnorm Gram and the left-regular-
    representation Gram agree on every PARI-side lattice. check.py
    independently recomputed every Gram (Cayley-Hamilton route), every
    determinant (sympy Bareiss), every C-ALG flag and every count from
    raw-result.json, and exited 0 with verdict REPRODUCED. No timeout, crash,
    memory cap or watchdog event occurred. stderr.log is empty. The missing
    prime is a tool (PARI) construction failure. It is never mathematical
    evidence (AGENTS.md rule 3).

