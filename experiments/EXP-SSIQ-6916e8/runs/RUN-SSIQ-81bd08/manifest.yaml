  inputs:
    base_seed: 20260926
    seed_derivation: >-
      seed(arm, p, index) = int(sha256("20260926:<arm>:<p>:<index>").hexdigest()[:16], 16).
      A4: PARI setrand(seed("A4", p, k)) for k = 1..20, set immediately before
      the alpha search for ideal k; alpha is sampled uniformly from
      [0, N)^4 in base-order coordinates, capped at 1,000,000 attempts.
      A6: Python random.Random(seed("A6", p, k)) for k = 0..21 splits m over
      the four diagonal positions (one uniform position per prime factor with
      multiplicity) and draws the off-diagonal entries. PARI setrand(1) is
      called immediately before every alginit, which fixes any internal
      randomness of alginit. All per-prime seeds are listed in
      raw-result.json prime_status.<p>.{a4_seeds, a6_seeds}.
    sources_of_randomness: [A4 alpha (PARI random), A6 H matrices (Python random), alginit internal (fixed by setrand(1))]
