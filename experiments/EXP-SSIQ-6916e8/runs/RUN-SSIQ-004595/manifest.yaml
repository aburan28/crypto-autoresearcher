  inputs:
    base_seed: 20260926
    seed_derivation: >-
      Unchanged from version 1 (AMD-20260926-f9acf7 C-6).
      seed(arm, p, index) = int(sha256("20260926:<arm>:<p>:<index>").hexdigest()[:16], 16).
      - A4: PARI setrand(seed("A4", p, k)) for k = 1..20, set immediately
        before the alpha search for ideal k. alpha is sampled uniformly from
        [0, N)^4 in base-order coordinates, capped at 1,000,000 attempts.
      - A6: Python random.Random(seed("A6", p, k)) for k = 0..21 splits m over
        the four diagonal positions and draws the off-diagonal entries (literal
        reading D-5).
      - PARI setrand(1) is called immediately before EVERY alginit, on every
        route and at both stages (D-6, binding under v2).
      All per-prime seeds are listed in raw-result.json
      prime_status.<p>.{a4_seeds, a6_seeds}.
