    The single protocol-version-2 run of EXP-SSIQ-6916e8, the run of record
    for the experiment's outcome (AMD-20260926-f9acf7 C-5). It is a full
    re-run at all 22 frozen primes, covering every arm A1-A6 and every control
    (C-TRD, C-NOSCALE, C-NONMAX, C-NEAR, C-ALG, C-CROSS). Two changes from
    version 1: the route ladder R1 -> R2 -> R3 applies where alginit raises,
    and the tally_rule is corrected.
  status: completed
  validity: completed_valid
  validity_scope: >-
    All 22 primes were constructed:
    - 21 primes by route R1 (the version-1 call, unchanged).
    - p = 9223372036854775837 (tier M, 5 mod 8) by route R3. At that prime,
      R1 alginit(nfinit(y), [-2, -p]) and R2 alginit(nfinit(y), [-p, -2]) both
      raised "impossible inverse in dvmdii: 0.". R3
      alginit(nfinit(y), [-2, -p], , 0) initialised and passed C-ALG (a) and
      (b), the structure-constant check and the ijk relations. The base order
      is the specification's A2 order mapped into that algebra. Gate G-A2
      passed, and the mapped base passed C-ALG (c) and reproduces the Python
      A2 Gram. Stage 2 reused R3 verbatim, and its structure constants equal
      stage 1's.
    Of the 1946 planned items (946 primary lattices, 484 A6 sublattices, 462
    M-INDEX ideals, 506 control values), 1945 are COMPUTED_VALID and meet
    their pre-registered exact value. One is NOT_COMPUTED, cause
    CONSTRUCTION: the A1 cell at p = 9223372036854775837. There, PARI's
    maximal-order computation raised under R1 and R2, and the amendment does
    not admit the hand-written order as A1. No item is COMPUTED_EXCLUDED.
  validity_reason: >-
    Every computed lattice record (1517) passed C-ALG and C-CROSS. PARI matdet
    and Python Fraction elimination agree on every determinant. The algnorm
    Gram and the left-regular-representation Gram agree on every PARI-side
    lattice. check.py (v2) independently re-derived:
    - the presentations and Hilbert symbols (closed formulae);
    - the route ladder, gate G-A2 and the mapped base at the R3 prime;
    - every Gram (Cayley-Hamilton route) and determinant (sympy Bareiss);
    - every C-ALG flag, every item state, the triggered list, the primary
      label, the blocking cells and every count.
    It exited 0 with verdict REPRODUCED. No timeout, crash, memory cap or
    watchdog event occurred. stderr.log and check.stderr.log are empty. The
    PARI alginit errors are tool failures, recorded and never evidence
    (AGENTS.md rule 3).

