experiment:
  id: EXP-SSIQ-6916e8
  hypothesis_id: H-SSIQ-a9df38
  version: 1
  title: >-
    Determinant check for the rank-4 Hom-lattice closure: det(Hom(E, E'), deg)
    = p^2/16 exactly, verified on PARI-constructed maximal orders, two-sided
    ideals P, random left ideals and their right orders, and index-m
    sublattices at 22 primes (2 to ~2^255, all congruence classes), with
    mis-normalised, non-maximal and rank-3 nearby-object controls, plus the
    written derivation note that is the closure artifact.
  status: approved
  status_note: >-
    Designed and approved in one Coordinator session on 2026-09-26 under the
    AGENTS.md standing user authorization; approval decision
    DEC-20260926-e05697. Frozen at version 1. Designing is not a result;
    approval asserts protocol readiness, not truth of H-SSIQ-a9df38.
  approved_by: coordinator
  approved_at: '2026-09-26'
  approval_decision: DEC-20260926-e05697
  approval_basis: >-
    Standing user authorization recorded in AGENTS.md (ideas and experiments
    approved once the protocol is complete), plus the explicit user request of
    2026-09-26 to run ideate -> design -> run -> review on this target.
    Coordinator completeness check recorded in DEC-20260926-e05697.
  frozen: true
  frozen_at: '2026-09-26'
  execution_authorized: true
  execution_authorized_note: >-
    Authorized scope: implement the three fixed implementation files, write
    the derivation note, and execute exactly ONE run (RUN-SSIQ-81bd08) as
    defined below. Pure quaternion-lattice arithmetic. NOT authorized: any
    curve, isogeny or key construction, any attack on an isogeny instance,
    additional runs, or changes to the prime set, norms, indices or controls.
  execution_authorized_decision: DEC-20260926-e05697
  source_proposal: IDEA-20260926-e1b48e
  goal_id: GOAL-SSIQ-001
  question_id: RQ-SSIQ-9702af
  executor_task: TASK-20260926-7d20e4
  archived_by: TASK-20260926-73104c
  class: >-
    derivation-check / closure artifact. Exact-value normalisation test of a
    derivation-tier lemma. Not a heuristic-validation experiment and not a
    cost-model measurement: nothing is sampled against a distribution and no
    cost is claimed.
  objective: >-
    Produce the closure artifact for H-SSIQ-a9df38 and test its only
    computable inputs. (1) DERIVATION NOTE: a self-contained, step-by-step
    written argument that det(Hom(E, E'), deg) = p^2/16 for every
    supersingular pair over F_{p^2}, that full-rank sublattices of index m
    have determinant m^2 p^2/16, and hence that no rank-4 Hermite/Minkowski
    certificate inside a single Hom-module under deg certifies an exponent
    below 1/2; with the rank-3 nearby-object computation (det(P^0, Nrd/p) =
    p/4) and an explicit scope statement. This is the refutation/closure
    artifact at derivation tier (docs/claims-and-verification.md,
    "Refutation artifacts"). (2) COMPUTATION: exact rational determinants of
    Gram matrices of the reduced-norm form on explicit Z-bases at a frozen
    prime set, testing (a) det(O, Nrd) = p^2/16 for maximal orders, (b)
    [O : I] = n(I)^2 and det(I, Nrd/n(I)) = p^2/16 for P and for random left
    ideals, (c) the same for the right orders O_R(I) (other maximal-order
    types, i.e. other targets E'), and (d) det(L) = m^2 det(M) for random
    full-rank sublattices; each with controls that must FAIL the identity
    so the check is shown able to fail. A single mismatch surviving the
    instrument cross-check falsifies the closure as stated.
  objective_boundary: >-
    The computation tests the quaternion-side normalisation. It does NOT
    construct curves or isogenies and does NOT independently verify the
    Deuring isometry Hom(E, E') ~ (I, Nrd/n(I)), which the derivation note
    cites (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md line 244 for
    E' = E^{(p)}; general pair recalled). It says nothing about rank <= 3
    certificates, non-degree forms, or dimension g >= 2.

  environment:
    machine: 4 cores, 15 GB RAM
    software:
      - PARI/GP 2.15.4 at /usr/bin/gp (installed this session via apt pari-gp); record exact version string from gp per run
      - Python 3 with numpy and sympy (record versions per run); fractions from the standard library
    unavailable: Sage, Magma, fpylll (not used; not required)

  conventions:
    gram_matrix: >-
      For a quadratic form q on a Z-basis (e_1..e_n): A_ii = q(e_i),
      A_ij = (q(e_i + e_j) - q(e_i) - q(e_j)) / 2, so q(x) = x^T A x. det
      means det(A), an exact rational. This is the convention under which the
      pre-registered value is p^2/16. The trace-form matrix
      T_ij = Trd(e_i conj(e_j)) equals 2A for q = Nrd.
    ideal_norm: >-
      n(I) is MEASURED, never assumed: n(I) = gcd over the basis of the
      integers A_ii and 2A_ij of (I, Nrd), i.e. the gcd of all values of Nrd
      on I. The index [O : I] is MEASURED independently as |det| of the
      change-of-basis matrix expressing the I-basis in the O-basis.
    ratio: >-
      R(lattice, form) = det(Gram) * 16 / p^2, exact rational. The
      pre-registered value on every falsification-bearing lattice is R = 1.

  inputs:
    primes:
      tier_S: [2, 3, 5, 7, 11, 13, 17, 19, 23, 101, 103, 109, 113]
      tier_M: >-
        the two smallest primes > 2^63 in each class p = 3 mod 4,
        p = 5 mod 8, p = 1 mod 8 (6 primes), found by PARI nextprime with a
        proven isprime; the list is written to raw-result.json.
      tier_L: >-
        the smallest prime > 2^255 in each class p = 3 mod 4, p = 5 mod 8,
        p = 1 mod 8 (3 primes), found and proven the same way.
      total: 22
    algebra_presentation: >-
      B_{p,inf} = (a, b)_Q with: p = 2: (-1, -1); p = 3 mod 4: (-1, -p);
      p = 5 mod 8: (-2, -p); p = 1 mod 8: (-q, -p) with q the smallest prime
      q = 3 mod 4 with Legendre (p/q) = -1. Ramification is CHECKED (C-ALG),
      not assumed.
    arms:
      A1_pari_maximal_order: >-
        al = alginit(nfinit(y), [a, b]) with the default maximal-order
        computation; the stored order O_0 with Z-basis algbasis(al). Nrd from
        PARI algnorm (reduced norm) on basis-form elements. 1 per prime.
        FALSIFICATION-BEARING.
      A2_hand_written_maximal_order: >-
        The explicit order for the prime's class, built and evaluated ENTIRELY
        in Python (sympy/fractions) in (1, i, j, k) coordinates with
        Nrd(x0 + x1 i + x2 j + x3 k) = x0^2 - a x1^2 - b x2^2 + a b x3^2:
        p = 2: Z<1, i, j, (1+i+j+k)/2>; p = 3 mod 4: Z<1, i, (1+j)/2, (i+k)/2>;
        p = 5 mod 8: Z<1, (1+j+k)/2, (i+2j+k)/4, k>; p = 1 mod 8:
        Z<(1+i)/2, (j+k)/2, (i+c k)/q, k> with c the smallest nonnegative
        integer such that q | c^2 p + 1. Formulas are recalled
        (H-SSIQ-a9df38 structural_ingredients); the run verifies each is an
        order. Independent-instrument arm; 1 per prime. A mismatch here is
        D-STD (instrument/construction), not falsification, because its
        maximality rests only on a recalled formula.
      base_order_rule: >-
        Arms A3-A6 and controls C-NONMAX, C-NEAR use O_0 from A1 as the base
        order O. If A1 fails C-ALG at some prime, O from A2 is used there
        instead, and the fallback is recorded per prime (never silent).
      A3_two_sided_ideal_P: >-
        P = {x in O : p | Nrd(x)}, the unique two-sided ideal of reduced norm
        p, under Nrd/p. Construction method at the executor's choice
        (e.g. HNF of pO + O alpha for alpha in O with p | Nrd(alpha),
        alpha not in pO), documented. 1 per prime. FALSIFICATION-BEARING.
        This is the E' = E^{(p)} case of the lemma.
      A4_left_ideals: >-
        20 left O-ideals per prime with frozen target norms. Let l1 < l2 < l3
        be the three smallest primes different from p. Target norms, in order:
        l1^k for k = 1..8; l2^k for k = 1..6; l1*l2, l1^2*l2, l1*l2^2,
        l1^3*l2^3; l3; l1*l3. Construction: I = O alpha + O N for a seeded
        random primitive alpha in O with N | Nrd(alpha) (primitive: alpha
        not in l O for any prime l | N), Z-basis by HNF; any equivalent
        documented seeded method is acceptable. Form Nrd/n(I) with n(I)
        measured. 440 ideals in total. FALSIFICATION-BEARING.
      A5_right_orders: >-
        For each A4 ideal, O_R(I) = {x in B : I x subset I}, computed by exact
        linear algebra, Z-basis recorded, form Nrd. These are maximal orders
        of (generally) other types, i.e. End(E') for other targets E'.
        440 in total. FALSIFICATION-BEARING.
      A6_sublattices: >-
        Per prime, one random full-rank sublattice of each of the 22 lattices
        {A1 (or fallback base O), A3, A4 x 20}, under that lattice's form.
        Index list m_list = [2, 3, 4, 5, 6, 8, 12, 30, 97, 1024]; the k-th
        lattice (k = 0..21 in the order A1, A3, A4_1..A4_20) uses
        m = m_list[k mod 10]. Construction: a seeded random 4x4 integer
        upper-triangular HNF H with positive diagonal of product m and
        off-diagonal entries in [0, diagonal entry of their column); L = M H.
        The index is MEASURED as |det H|. Expected det(L) = m^2 det(M).
        484 in total. FALSIFICATION-BEARING for input (4).
    exact_arithmetic: >-
      All Gram entries and determinants are exact rationals. No floating
      point anywhere in a pass/fail decision. Gram entries are exported as
      exact rational strings.

  controls:
    - name: C-TRD (mis-normalised form; must fail)
      role: blocking pipeline integrity
      detail: >-
        On the base order O at every prime, the trace-form matrix
        T_ij = Trd(e_i conj(e_j)) without halving. Required: the measured
        ratio det(T) / det(A_Nrd) equals 16 exactly (algebraic identity
        T = 2A in rank 4), AND R(T) != 1 (so the identity check is shown able
        to fail on a wrong normalisation). Pre-registered value if the lemma
        holds: R(T) = 16.
    - name: C-NOSCALE (omitted /n(I); must fail)
      role: blocking pipeline integrity
      detail: >-
        For every A4 ideal, (I, Nrd) without dividing by n(I). Required:
        det(I, Nrd) / det(I, Nrd/n(I)) = n(I)^4 exactly, and R != 1 whenever
        n(I) > 1 (all target norms are > 1). Pre-registered value if the lemma
        holds: R = n(I)^4.
    - name: C-NONMAX (non-maximal order; must fail)
      role: blocking pipeline integrity
      detail: >-
        Z + 2O for the base order O at every prime (index 8 in O). Required:
        measured index 8, det(Z + 2O, Nrd) / det(O, Nrd) = 64 exactly, the
        trace-form determinant != p^2 (flagged non-maximal), and R != 1.
        Pre-registered value if the lemma holds: R = 64.
    - name: C-NEAR (rank-3 nearby object; lemma must not apply)
      role: blocking for the success headline; not falsification-bearing for the lemma
      detail: >-
        O^0 = {x in O : Trd(x) = 0} under Nrd and P^0 = {x in P : Trd(x) = 0}
        under Nrd/p, rank 3, 3x3 Gram. Pre-registered exact values (derived
        from Trd(O) = Z, Trd(P) = pZ, the orthogonality of 1 to trace-zero
        elements, and the index-2 inclusions Z + O^0 in O, pZ + P^0 in P):
        det(O^0, Nrd) = p^2/4 and det(P^0, Nrd/p) = p/4 at every prime.
        det(P^0, Nrd/p) = p/4 reproduces lever L1's recorded rank-3
        discriminant p/4 (exponent -> 1/3). A mismatch means the derivation
        note's nearby-object analysis is wrong: outcome INCONCLUSIVE-NEAR,
        not a falsification of the rank-4 lemma.
    - name: C-ALG (construction validity)
      role: blocking per lattice; failures are construction defects, never evidence
      detail: >-
        (a) PARI algramifiedplaces (or Hilbert symbols) show ramification
        exactly at {p, inf} for the chosen (a, b). (b) algnorm is the REDUCED
        norm: Nrd(1) = 1 and Nrd(2) = 4. (c) Every order (A1, A2, A5, base,
        Z + 2O) contains 1 in its Z-span, is closed under multiplication (all
        16 basis products in the Z-span), and has integral Nrd and Trd on its
        basis. (d) Every A4 ideal satisfies I subset O and O I subset I, and
        O_R(I) satisfies I O_R(I) subset I. (e) P satisfies O P subset P,
        P O subset P, and p | Nrd on its basis. (f) Measured index m of each
        A6 sublattice equals the planned m. A lattice failing C-ALG is
        excluded from R counting, listed in full, and makes its cell
        INCONCLUSIVE-CONSTRUCTION.
    - name: C-CROSS (two independent determinant and norm instruments)
      role: blocking per lattice
      detail: >-
        (i) Every determinant is computed by PARI matdet over Q AND by an
        independent Python exact routine (fractions.Fraction elimination or
        sympy Matrix.det) from the exported rational Gram entries; they must
        agree exactly. (ii) For PARI-side lattices, the Nrd Gram is computed
        twice: from algnorm, and in Python as the exact positive square root
        of det of the 4x4 left-regular representation matrix of each element
        built from exported structure constants (N_{B/Q}(x) = Nrd(x)^2),
        after verifying the exported structure constants reproduce algmul on
        all basis products. Disagreement makes that lattice
        INVALID-INSTRUMENT (F-INSTR), never mathematical evidence.
  independent_variables:
    - p (22 frozen primes across tiers S, M, L and classes 2, 3 mod 4, 5 mod 8, 1 mod 8)
    - lattice arm (A1, A2, A3, A4, A5, A6)
    - target ideal norm N (20 frozen values per prime, A4/A5)
    - sublattice index m (frozen m_list, A6)
    - form (Nrd, Nrd/n(I); controls Trd without halving, Nrd without /n(I))
  metrics:
    primary:
      - id: M-R
        definition: >-
          Exact rational R = det * 16 / p^2 for every lattice in A1, A2, A3,
          A4 (form Nrd/n(I)), A5; count of lattices with R != 1 per arm per
          prime, every such lattice listed in full with basis and Gram.
        planned_count: 22 primes x (1 + 1 + 1 + 20 + 20) = 946 lattices
      - id: M-SUB
        definition: >-
          Exact R_sub = det(L) * 16 / (m^2 p^2) with m the measured index, for
          every A6 sublattice; count with R_sub != 1, each listed in full.
        planned_count: 22 x 22 = 484 sublattices
      - id: M-INDEX
        definition: >-
          For every A4 ideal and A3's P: measured [O : I] versus measured
          n(I)^2; count of mismatches, each listed in full.
        planned_count: 22 x 21 = 462 ideals
    secondary:
      - id: M-CTRL
        definition: >-
          Per prime: C-TRD ratio (expect 16) and R(T); C-NONMAX index (expect
          8), ratio (expect 64) and R; C-NOSCALE ratio (expect n(I)^4) and R
          for each ideal; C-NEAR det(O^0, Nrd) (expect p^2/4) and
          det(P^0, Nrd/p) (expect p/4). Pass/fail per control.
      - id: M-CROSS
        definition: >-
          Count of determinant disagreements PARI vs Python and of Nrd-Gram
          disagreements algnorm vs regular representation; must be 0.
      - id: M-VALID
        definition: >-
          C-ALG outcomes per lattice; count of excluded lattices by reason;
          base-order fallback flag per prime.
      - id: M-NORMHIT
        definition: >-
          Per A4 ideal, measured n(I) versus target N (reported; a miss is a
          construction note, the R test uses measured n(I)).
      - id: M-EXP
        definition: >-
          Per prime, the implied certificate exponent log_p(det)/rank for
          A3 (rank 4) and for P^0 (rank 3), reported as exact det plus a
          float rendering, for the derivation note's baseline table only.
      - id: M-RES
        definition: wall clock and peak RSS of the run; PARI stack size used.
  heuristic_under_test: null
  heuristic_under_test_note: >-
    None. H-SSIQ-a9df38 carries no heuristic; this experiment checks exact
    identities.
  preregistered_prediction:
    quantity: >-
      Exact Gram determinants of the reduced-norm form on the listed
      lattices, and the ratios of the controls.
    formula: >-
      det(O, Nrd) = p^2/16 (A1, A2, A5); det(P, Nrd/p) = p^2/16 (A3);
      [O : I] = n(I)^2 and det(I, Nrd/n(I)) = p^2/16 (A4); det(L) = m^2 det(M)
      (A6); C-TRD det(T)/det(A) = 16, R(T) = 16; C-NOSCALE ratio n(I)^4;
      C-NONMAX index 8, ratio 64, R = 64; C-NEAR det(O^0, Nrd) = p^2/4 and
      det(P^0, Nrd/p) = p/4. All exact; no tolerance.
    source: >-
      IDEA-20260926-e1b48e claim and predictions (maximal-order discriminant
      p^2, [O : I] = n(I)^2, rescaling); frozen source
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md line 244 (Deuring isometry
      for E^{(p)}); GOAL-SSIQ-001 lever_corrections L1 (rank-3 trace-zero
      discriminant p/4); C-NEAR values derived by the Coordinator in
      H-SSIQ-a9df38 / DEC-20260926-e05697 from Trd(O) = Z and Trd(P) = pZ.
      Frozen before any run; never tuned.
  scale_relevance:
    tier: crypto
    justification: >-
      Tier L primes are ~256-bit (SQIsign NIST-I scale); tier M ~64-bit;
      tier S small, including the edge primes 2 and 3. The identity is exact
      at each tested prime; no extrapolation or transfer assumption is made
      from the sample to other p. The universal statement rests on the
      derivation note, not on the sample.
    correspondence: >-
      Deuring correspondence: Hom(E, E') with deg is isometric to
      (I, Nrd/n(I)) for a connecting left ideal I (frozen source line 244 for
      E' = E^{(p)} with I = P; general pair recalled, Kohel 1996 / Voight
      Ch. 42). Used to interpret quaternion lattices as Hom-lattices; NOT
      tested by the run.
  tail_checks:
    - >-
      EXTREMES: the identity must hold at the extreme cells with no special
      treatment: p = 2 and p = 3 (edge primes), tier L (~2^255), the largest
      ideal norm per prime (l1^3 l2^3 or l2^6), and m = 1024. A failure
      confined to extremes is reported as such with the cell listed.
    - >-
      CLASS COVERAGE: at least one prime of each class 3 mod 4, 5 mod 8,
      1 mod 8 in every tier, plus p = 2; reported as a coverage table.
  replication:
    seeds:
      base_seed: 20260926
      streams: >-
        PARI setrand and Python random.Random seeded deterministically from
        (base_seed, arm, p, index) with the derivation printed in the
        manifest; ideal elements alpha and HNF sublattice matrices are the
        only random objects.
      seed_free: primes, algebra presentations, target norms, m_list, A1, A2, A3, controls
    independent_instances: >-
      Two independent determinant instruments (PARI matdet; Python exact) on
      every lattice; two independent Nrd instruments (algnorm; left-regular
      representation) on PARI-side lattices; an order construction entirely
      outside PARI (A2) at every prime; 22 primes. A single run: the result is
      an exact identity, so repetition adds nothing; independent re-derivation
      is the job of the post-run validator.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
    watchdog_seconds: 3600
    watchdog_reason: >-
      Machine protection only: a stalled alginit or isprime at ~256-bit must
      not hold a core indefinitely. Expected runtime is seconds to minutes.
      Watchdog expiry checkpoints the task as infrastructure (F-INFRA); it is
      never evidence and never exhausts the campaign.
    note: >-
      Time/CPU advisory per docs/research-budget-policy.md; memory 4 GB and 1
      worker are machine protection on a 4-core, 15 GB host. maximum_runs 1 is
      a scientific count: one deterministic run, RUN-SSIQ-81bd08.
  stopping_rules:
    - >-
      Run all 22 primes to completion even after a mismatch; do not stop
      early on a favourable or unfavourable value (a mismatch is archived with
      its full basis and Gram, and the remaining cells still run).
    - >-
      If C-ALG (b) (reduced vs absolute norm) fails, STOP before computing any
      R: the Nrd instrument is wrong; report F-INSTR; no R values.
    - >-
      If PARI alginit or isprime fails or hangs at a prime: record the error,
      use the A2 fallback for that prime where possible, continue; a prime
      with no valid base order is INCONCLUSIVE-CONSTRUCTION for that prime.
    - >-
      Timeout, crash, memory cap, watchdog: STOP; report F-INFRA; archive
      partial outputs; never estimate unfinished cells.
  invalidation_rules:
    - >-
      Any floating-point value used in a pass/fail decision invalidates the run.
    - >-
      A determinant or Nrd disagreement between instruments (C-CROSS)
      invalidates that lattice (F-INSTR); it is excluded from R counting and
      listed.
    - >-
      A C-TRD, C-NOSCALE or C-NONMAX ratio differing from its exact
      pre-registered value (16, n(I)^4, 64; index 8) invalidates the whole
      run's R reading as pipeline-broken (INVALID), not as evidence in either
      direction. (A control returning R = 1 with the correct ratio is not an
      invalidation: it can only happen if the base lattice itself has R != 1,
      which is read under F-NORM; it does block S4.)
    - >-
      Computing n(I) or [O : I] from each other (e.g. setting n(I) =
      sqrt([O : I])) instead of measuring both invalidates arm A4.
    - >-
      Copying determinant values from any source instead of computing them is
      fabrication (AGENTS.md rule 5) and invalidates the record.
    - >-
      A run missing any AGENTS.md artifact-policy manifest field (exact
      command, git commit and dirty state, environment and versions including
      the gp version string, parameters and seeds, inference block, stdout,
      stderr, raw results, validity status and reason, timestamps and
      resources) is schema-incomplete and not evidence.
    - >-
      TIMEOUTS, CRASHES AND INFRASTRUCTURE FAILURES ARE NEVER NEGATIVE
      MATHEMATICAL EVIDENCE (AGENTS.md rule 3).
  success_criterion: >-
    DECIDABLE FROM THE METRICS ALONE. SUCCESS requires ALL of: (S1) M-R: all
    946 planned lattices pass C-ALG and C-CROSS and have R = 1 exactly;
    (S2) M-SUB: all 484 sublattices have measured index equal to planned m
    and R_sub = 1 exactly; (S3) M-INDEX: [O : I] = n(I)^2 exactly for all
    462 ideals (A3 and A4); (S4) M-CTRL: C-TRD, C-NOSCALE, C-NONMAX return
    exactly their pre-registered ratios and R != 1 at every prime/ideal, and
    C-NEAR returns exactly p^2/4 and p/4 at every prime; (S5) M-CROSS = 0;
    (S6) the derivation note exists and discharges proof obligations
    baseline, size, correctness and scope of H-SSIQ-a9df38 step by step,
    cites the interface obligation (Deuring) with its provenance, and
    contains the nearby-object computation and the exact scope statement;
    (S7) check.py, run independently on the archived raw-result.json,
    exits 0 and reproduces every count. Honest headline if all hold: "At 22
    primes from 2 to ~2^255 in every congruence class, the reduced-norm
    lattices corresponding to Hom(E, E') under deg (maximal orders, P, 440
    left ideals, 440 right orders) have Gram determinant exactly p^2/16, and
    full-rank sublattices scale as m^2; the normalisation inputs of the
    rank-4 closure are corroborated. The universal lemma rests on the
    derivation note (derivation tier, pending independent review); the
    Deuring interface is cited, not tested."
  falsification_criterion: >-
    DECIDABLE FROM THE METRICS ALONE. F-NORM: any lattice in A1, A3, A4 or
    A5 that passes C-ALG and C-CROSS with R != 1, or any A3/A4 ideal passing
    C-ALG with [O : I] != n(I)^2 -- the closure is FALSIFIED AS STATED and is
    withdrawn pending localisation (the offending basis and Gram are the
    counterexample artifact). F-SUB: any A6 sublattice passing C-ALG and
    C-CROSS with R_sub != 1 -- input (4) fails as computed; treated first as
    a suspected instrument defect and escalated to the Coordinator, never
    silently dropped. NOT FALSIFICATION: D-STD (A2 hand-written formula not an
    order or R != 1 -- a recalled formula is wrong; outcome
    INCONCLUSIVE-INSTRUMENT for the two-instrument headline);
    INCONCLUSIVE-NEAR (C-NEAR mismatch); INCONCLUSIVE-CONSTRUCTION (C-ALG
    exclusions); F-INSTR (instrument disagreement); INVALID (control ratio
    wrong); F-INFRA (timeout/crash/watchdog). Any outcome that is neither
    SUCCESS nor F-NORM/F-SUB is INCONCLUSIVE with the blocking cells named.
