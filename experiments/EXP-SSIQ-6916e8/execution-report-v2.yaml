  # --------------------------------------------------------------- deviations from protocol version 2 (stated plainly)
  protocol_deviations:
    - id: V2-D1
      kind: development executions before the run (C-13 / D-8 discipline; disclosed; not run records)
      detail: >-
        All development executions ran outside the repository, with outputs
        in the session scratch directory and none on the run directory:
        (a) A gp script at the FROZEN prime p = 9223372036854775837 (allowed
            by C-13). It found that R1 alginit(nfinit(y), [-2, -p]) and R2
            alginit(nfinit(y), [-p, -2]) raise "impossible inverse in dvmdii:
            0." and that R3 alginit(nfinit(y), [-2, -p], , 0) initialises.
            It computed no lattice, determinant or cell value.
        (b) A gp smoke test of the v2 stage1 at the dev prime p = 29 (not
            frozen), on R1/R2/R3 and the injection hook. The first attempt
            failed on a gp syntax error in the new route_call helper, which
            was fixed.
        (c) Two driver runs in --dev-primes mode on primes outside the frozen
            set: 29, 31, 41, 73, 37, 43 and 1267650600228229401496703205653
            (~2^100). Fault injection exercised R2 (31), R3 (41), the
            terminal case (73), G-A2 failure with a non-maximal A2 (37) and a
            stage-2 error (43). The first run exposed a defect: when stage 2
            raised, A2 lost its PARI matdet and was mislabelled as a C-CROSS
            disagreement. It was fixed before the run (see V2-D4).
        (d) check.py (v2) on the second dev output (all paths reproduced; the
            only disagreement was S6, because the scratch run has no
            derivation-note.md three levels up). A tampered copy (an
            uncomputed control inserted into controls_failed, and one altered
            R) made check.py exit 1 and name both defects.
        (e) compare_runs.py self-comparison of the dev output (0 differences).
        No value from any development execution is used anywhere.
        RUN-SSIQ-004595 recomputed everything, including p =
        9223372036854775837.
    - id: V2-D2
      kind: implementation choice within fallback_rule (disclosed)
      detail: >-
        At an A2-based base (R3 here), C-CROSS of the base order is evaluated
        on the stage-2 base record (algnorm Gram versus regular
        representation; PARI matdet versus Python), not before stage 2.
        Before stage 2, the mapped base is required to pass C-ALG (c) under
        the regular-representation instrument and to reproduce the Python A2
        Gram exactly. Had the stage-2 base failed C-CROSS, the dependent cells
        would have been excluded (base_valid) and F-INSTR would have
        triggered. Here the base passed both checks.
    - id: V2-D3
      kind: tightening (disclosed; no effect at any R1 prime)
      detail: >-
        The C-ALG flag base_valid in A3 and A4 now requires the base cell's
        C-ALG AND C-CROSS; v1 required C-ALG only. The comparison shows
        identical values at all 21 R1 primes.
    - id: V2-D4
      kind: implementation detail of "NOT_COMPUTED is never a mismatch" (not triggered)
      detail: >-
        If stage 2 raises, the A2 cell's PARI matdet comes from a separate
        matdet-only gp call (as at a prime with no base order), so no
        uncomputed instrument becomes a C-CROSS mismatch. Found in
        development (V2-D1 c). No stage 2 raised in the run.
    - id: V2-D5
      kind: C-4 made explicit (not triggered)
      detail: >-
        A gp stage call that returns no record at all (a crash or kill) raises
        InfraError, which gives F-INFRA and stops the run. v1 recorded it as
        a stage error instead. Only a caught PARI error (a record with
        'error') counts as a route failure.
    - id: V2-D6
      kind: interpretation (not triggered)
      detail: >-
        The version-1 global stopping rule "C-ALG (b) fails -> STOP, F-INSTR"
        is applied to R1 attempts only. A C-ALG (b) failure of an R2 or R3
        algebra is a route failure, as the amendment's R2/R3 text states
        ("R2 must pass ... C-ALG (b) ... If R2's algebra fails C-ALG (a)/(b)
        ... go to R3").
    - id: V2-D7
      kind: interpretation (not triggered)
      detail: >-
        Stage consistency ("every PARI-side cell there is not computed") also
        covers the A1 cell when A1 came from the same route. The stage-1 A1
        values would then be preserved in prime_status, not counted. An A1
        recorded (excluded) from R2 at a prime whose chosen route is R3 comes
        from a different algebra object and would stay as recorded.
    - id: V2-D8
      kind: metric bookkeeping (disclosed)
      detail: >-
        M-CROSS in driver.py (v2) keeps the version-1 counted set. It adds
        the A3/A4 index and n(I) instrument disagreements and the C-NONMAX
        index and trace-form-det instrument disagreements, which v1 used only
        as exclusion reasons. check.py (v2) buckets instrument checks by its
        own recomputation, so it compares whether M-CROSS is zero, not the
        exact count. Both are 0 here.
    - id: V2-D9
      kind: literal v2 reading (not triggered)
      detail: >-
        INVALID for C-NONMAX uses "on lattices passing C-CROSS" (the
        amendment's text). v1 used lattice_valid (C-ALG and C-CROSS).
