      - success_criterion S1 to S5 (the headline sentence is unedited; the qualifier is a consequence statement of A1)
      - falsification_criterion F0, F_agree, F_rep, F1, F5, F_ind, F6, F_acct
      - definitions of M1 to M9
      - certificate_semantics (every N > 0 row on every route carries a re-verified root-list certificate)
      - the candidate set (244 per census cell; 252 per Stage-1 cell)
      - the cells (stage 0, stage 1, C2 to C6, Band L, bridge, Band H)
      - seeds (base_seed 20260920 and the named sub-stream rule)
      - claim_tier
      - the field model K = F_2[z]/(z^131 + z^13 + z^2 + z + 1)
      - every tolerance (exact agreement everywhere)
      - stages and their order (no A2; revision design d5_ordering)
      - Stage-0 mechanics (no A3)
      - blind_from, stopping_rules and invalidation_rules (no tightening beyond A1-C1's per-route application of the Stage-1 and fixture requirements)
    tq_2_self_check: >-
      Field by field against the specification, this file touches only the
      I_indep route assignment on 44 named Band-L groups (A1), and the per-route
      application of the Stage-1 requirement and of C2 to C4 (A1-C1). The
      headline qualifier and the calibration statements are consequence
