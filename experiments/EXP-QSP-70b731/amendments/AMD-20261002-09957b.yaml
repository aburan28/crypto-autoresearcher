          C5K-np11 run I_direct only, as version 1 states.
        marginal_rows: >-
          stage2-bandL-n10 d 4 (88.43 days; stays on derivation (A)) and
          stage2-bandL-n11 d 5 (205.6 days; changed). A time factor of 3 either
          way flips exactly one of them (revision design
          route_table.horizon_robustness). The table is the scale-1 map.
        route_selection_rule: >-
          In code the route is looked up by the cell's name and lambda's degree
          in a literal table equal to this one (CI-3). It is never chosen by a
          degree, size or threshold computed from the cell.
      substitute_route:
        name: S-BERL
        definition: >-
          For L = X^(2^n') + lambda(X) in F_2[X]: compute rad(L), the product of
          its distinct irreducible factors, by the characteristic-2 squarefree
          algorithm. Find those factors by Berlekamp's method: take the left
          kernel of Q - I, where row i of Q is X^(2i) mod rad(L), each row built
          from the previous by one multiplication by X^2 and one reduction; then
          split by gcds with kernel polynomials reduced modulo the current
          factor. N_K(L) is the sum of deg f over the factors f whose degree
          divides n = 131. List every root in K of each such f, with its
          Frobenius orbit. A failed split or root search raises and never
          returns a count (CI-4). Steps: revision design WO-I-6 and WO-I-7.
        why_independent_of_I_direct: >-
          I_direct is N = deg gcd(X^(2^131) - X, L), by repeated squaring of X
          modulo L. Modulo L or any divisor of L, S-BERL forms residues X^e
          only with e < 2^(n'+1) (the Q rows), each from the previous by one
          multiplication by X^2 and one reduction. It forms no product of two
          residues and squares no residue. It applies neither Q nor any power of
          Q to a vector; its only matrix operations are forming Q - I and taking
          its left kernel. It takes gcds of L or of a divisor of L only with the
          formal derivative, another divisor of L, or a Berlekamp kernel
          polynomial reduced modulo the current factor. It reduces modulo L or a
          divisor of L nothing but Q rows, kernel polynomials and divisors of L.
          It decides the count from the factor degrees of L, never from a gcd
          with X^(2^n) - X. It is written by a different executor
          (TASK-20261002-38ffea), who reads no file of the bound closure and no
          r1/runner file (CI-1), on its own primitives. The operand-provenance
          trace and audit rules R0 to R4 (revision design WO-I-10, AC-7) make
          this rule mechanical. R-C8 demonstrated that they reject the six
          disguises D3a to D3f and pass S-BERL and A-DENSE on synthetic cells.
          Shared with I_direct: the input L and the generic notion of polynomial
          gcd.
      infeasibility_argument: >-
        DEC-20261002-c01bb7 R-ROUTE-RULE, applied exactly as the revision
        design's route_table.application_fixed_in_advance states. For each
        changed (cell, d), either (M) no engine of the declared I_indep set
        (E-NP, E-DEC) has a feasible memory verdict at degree B, or the declared
        gcd has none. E-NP's verdict holds up to about B = 5.59e8 (rho 122.8728
        bits per degree from VmPeak at 2^28). Or else (T) T_A = G x (131 x
        t_sq(B) + t_gcd(B)) exceeds 90 days, with t_sq the amortized E-NP
        squaring time and t_gcd the classical gcd's measured or fitted time.
        Composition and factorisation are excluded from T_A, which is optimistic
        toward derivation (A). The rates were measured under host contention,
        which can only lengthen them (revision design rate_tables.contention).
      where_derivation_A_runs_and_is_calibrated_by_C1_before_Band_H: >-
        Derivation (A) is cross-checked by C1 against I_direct at n = 131 on
        the bridge (244 rows; s = 1, q + 1 = 6) and on the 276 unchanged Band-L
        rows (n' = 8 to 14; s in {1, 4, 5, 9, 12}; q + 1 from 10 to 17). It is
        also checked against I_direct on the 756 Stage-1 rows (toy n; q + 1 in
        {2, 3}) and against forced counts on C2, C3 and C4 (A1-C1), all of which
        gate the census. Band H (n = 131, s = 1, q + 1 in {2, 3, 4}) runs the
        same derivation-(A) code path (one implementation; revision design
        WO-I-11, AC-8).
      consequence_for_S1: >-
        S1's text is unchanged: M1 = 0 and M2 = 0, I_direct equal to I_indep on
        every completed Band-L and bridge candidate. On the 2652 changed rows
        I_indep is S-BERL, so M1 = 0 there is agreement of two algorithmically
        independent instruments for N_K(L), and establishes the count on those
        rows. It is not a test of derivation (A) there. On the 276 unchanged
        Band-L rows and on the bridge, M1 = 0 and M2 = 0 remain agreement of
        derivation (A) with I_direct.
      consequence_for_the_headline: >-
        The frozen success-criterion headline sentence ("H-QSP-cd0c90 is
        SUPPORTED ON THE COMPLETED CELLS PENDING INDEPENDENT REVIEW -- I_direct
        and I_indep agreed on Band L (n' = 3..14) and bridge n' = 22; ...") is
        not edited. Under protocol version 2, any headline written from it
        carries this qualifier immediately after "agreed on Band L (n' =
        3..14)": "(I_indep by derivation (A) on the 16 (n', d) groups AMD-20261002-09957b
        leaves on derivation (A), 276 rows, and by the S-BERL factor-degree
        count on the other 44 groups, 2652 rows)". A headline without the
        qualifier overstates which instrument agreed and is not the honest
        headline of version 2. S1 to S5 and their decidability are unchanged.
      consequence_for_M1_to_M9: >-
        No definition changes. On S-BERL rows, M4's slack is null ("slack (if
        I_indep exposes it)"), and so is the per-cell JSON slack field, with
        the route recorded beside it. M6 records the forced fixtures on I_direct
        and on each I_indep route (A1-C1).

    - id: A1-C1
      label: A1-consequential
      title: Every I_indep route the census uses runs on Stage 1 and on C2 to C4 (tightening)
      supersedes: >-
        stages.stage_1.requirement ("I_direct and I_indep agree exactly on every
        candidate") and controls C2, C3 and C4 ("through I_direct and I_indep"),
        each now applied to every I_indep route the census uses, A-DENSE and
        S-BERL.
      text: >-
        On every candidate of stage1-toy-calibration/n11-np6, n13-np7 and
        n7-np3 (d = 2 to 7, 756 rows), both A-DENSE and S-BERL run, and each is
        compared exactly with I_direct. A disagreement of either route is the
        Stage-1 failure version 1 defines for I_indep. On C2 (7, 3), C3 (31,
        15) and C4 (12, 6), both routes run, and each must return the forced
        count. A wrong count from either route is F5 and STOPs, as version 1's
        stopping_rules[1] states. This only adds checks that can fail. It
        removes none.
      why_a_tightening: >-
        Without it, the 2652 S-BERL census rows would rest on a route never
        calibrated against I_direct or a forced fixture before the census, so
        D-4 ("each route calibrated") could not be discharged.
        DEC-20261002-6e68d8 R-AMD classifies the dual-route requirement as an
        A1-consequential tightening inside R-AMEND-SCOPE.
      consequence_for_S1: >-
        None on S1's text. Stage-1 and fixture outcomes gate the census as in
        version 1, now per route.
      consequence_for_the_pre_Band_H_calibration_per_depth:
        - depth_q_plus_1: 2
          band_h_cell: stage4-bandH-n66
          exact_references: >-
            Stage-1 cells (11, 6) and (13, 7) (q = 1). Every F_2 lambda of exact
            degree 2 to 7 is compared exactly with I_direct, on each route, at toy
            n only.
        - depth_q_plus_1: 3
          band_h_cell: stage4-bandH-n44
          exact_references: >-
            Stage-1 cell (7, 3) (q = 2) against I_direct, and fixtures C2 (7, 3),
            C3 (31, 15) and C4 (12, 6) against forced counts, on each route, at
            toy n only. C4 is vacuous for derivation (A) at r = 0, as the
            specification says.
        - depth_q_plus_1: 4
          band_h_cell: stage4-bandH-n33
          exact_references: >-
            NONE. No declared cell with an exact reference has q + 1 = 4. C5F-np33
            (n = 131, q + 1 = 4) is a null object without an exact reference.
            C6-np33 (q + 1 = 4) is checked only against Proposition 2's
            complete-splitting dichotomy; the DR-10 exact-count diagnostic is
            non-blocking and its formula's provenance is recalled. Depth 4 is
            exercised against brute force only on synthetic cells (revision design
            synthetic_cells).
        - depth_q_plus_1: 6 and above
          band_h_cell: none
          exact_references: >-
            At n = 131, derivation (A) is cross-checked by C1 against I_direct on
            the bridge (q + 1 = 6) and on the 276 unchanged Band-L rows (q + 1
            from 10 to 17). None has depth 2, 3 or 4.
      calibration_statement: >-
        The specification's sentence that Band-L and bridge agreement
        "calibrates it before Band H comparison" holds under version 2 in the
        narrower sense stated per depth above. Depths 2 and 3 are calibrated
        exactly, at toy n only. Depth 4 has no exact declared reference. The
        n = 131 calibration exercises depths of 6 and above, on 520 rows (244
        bridge, 276 Band L). A defect appearing only jointly at n = 131 and at
        depth 4 or less is not excluded by calibration. Band H's completeness
        still rests on derivation (A), as in version 1.

