          stage2-bandL-n9: {4: S-BERL, 5: S-BERL, 6: S-BERL, 7: S-BERL}
          stage2-bandL-n10: {5: S-BERL, 6: S-BERL, 7: S-BERL}
          stage2-bandL-n11: {5: S-BERL, 6: S-BERL, 7: S-BERL}
          stage2-bandL-n12: {6: S-BERL, 7: S-BERL}
          stage2-bandL-n13: {6: S-BERL, 7: S-BERL}
          stage2-bandL-n14: {7: S-BERL}
        changed_groups_count: 44
        changed_rows_count: 2652
        changed_by_reason:
          memory_and_time: 40 groups, 2364 rows
          time_only: 'stage2-bandL-n11 d 5 (205.6 days, marginal), stage2-bandL-n12 d 6 and stage2-bandL-n13 d 6 (794.3 days), stage2-bandL-n14 d 7 (1029 days); 288 rows'
        unchanged_derivation_A_census_rows:
          - 'Band L, 16 groups, 276 rows: n'' = 8 and 9 d 3; n'' = 10 and 11 d 3, 4; n'' = 12 and 13 d 3, 4, 5; n'' = 14 d 3, 4, 5, 6'
          - stage3-bridge-n22 every d (244 rows)
          - stage4-bandH-n33, -n44, -n66 every d (732 rows)
        controls_unchanged: >-
          C5F-np33, C6-np11 and C6-np33 run derivation (A) (A-DENSE). C5K-np33
          runs A-TWIST, the K-coefficient form of derivation (A) (revision design
