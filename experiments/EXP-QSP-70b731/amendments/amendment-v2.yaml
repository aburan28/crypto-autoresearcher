  design_ref: coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-4708f7/design/TASK-20261002-c5d9e7/repair-design.yaml
  precedence: >-
    Protocol version 2 = experiments/EXP-QSP-70b731/specification.yaml (version
    1) plus this file. This file governs wherever it names a field; every other
    field of version 1 governs unchanged.

  reason: >-
    Version 1 defines I_indep as resting on derivation (A) and "Used on ALL
    census cells". At n = 131 derivation (A)'s polynomial H has degree B =
    max(2^(n'-r), d^(q+1)), which on most of Band L is between about 2^25 and
    2^124 (repair-design route_table, D-C3). The design examined routes that
    would evaluate derivation (A) there without building H densely and found
    none (repair-design route_table.faithful_route_search; reducing H modulo L
    collapses to I_direct's own quantity). Under the specification's 8 GB,
    one-worker machine-protection ceiling, derivation (A) is infeasible on 2800
    of the 2928 Band-L rows by the cost argument below. D-4 therefore cannot be
    discharged inside the frozen fields on those rows.

  pre_data_assessment:
    status: POST-DATA
    exposures:
      - >-
        The QSP owner session (coordinator-qsp-run-20260921) produced and saw the
        outputs of the 16 run directories DEC-20261002-e0aa2b classified
        (K-INVALID).
      - >-
        The archived validator report of TASK-20261002-7eb899, read by this
        author, discloses which I_indep paths the bound closure took and on how
        many rows (F-04), and no N value.
    author_statement: >-
      The author of this amendment read nothing under
      experiments/EXP-QSP-70b731/runs/, no path in the specification's
      blind_from, no EV-QSP-a6aa4b and no DEC-20260917-* decision, and knows no
      run value of EXP-QSP-70b731 or EXP-QSP-33b442.
    consequence: >-
      The route table is a function of (n, n', d) and of declared cost-model
      parameters only (repair-design code_blocks.route_table_code); no
      measured value enters it. It changes which algorithm fills the I_indep
      column on named rows; it does not touch the preregistered prediction or
      any criterion, and it is written before any run of the successor closure.

  changes:
    - id: A1
      label: A1
      title: >-
        I_indep route per census and calibration cell where derivation (A) is
        shown infeasible
      supersedes: >-
        specification.inputs.instruments.I_indep as to which algorithm
        computes I_indep on the Band-L rows listed in route_table below (it
        remains derivation (A) on every other census row); stages.stage_1
        requirement and controls C2, C3, C4 ("through I_direct and I_indep"),
        each now applied to every route the census uses.
      route_table:
        key: cell name as in repair-design route_table.route_map, then degree d of lambda
        changed_rows:
          stage2-bandL-n3: {3: S-BERL, 4: S-BERL, 5: S-BERL, 6: S-BERL, 7: S-BERL}
          stage2-bandL-n4: {3: S-BERL, 4: S-BERL, 5: S-BERL, 6: S-BERL, 7: S-BERL}
          stage2-bandL-n5: {3: S-BERL, 4: S-BERL, 5: S-BERL, 6: S-BERL, 7: S-BERL}
          stage2-bandL-n6: {3: S-BERL, 4: S-BERL, 5: S-BERL, 6: S-BERL, 7: S-BERL}
          stage2-bandL-n7: {3: S-BERL, 4: S-BERL, 5: S-BERL, 6: S-BERL, 7: S-BERL}
          stage2-bandL-n8: {3: S-BERL, 4: S-BERL, 5: S-BERL, 6: S-BERL, 7: S-BERL}
          stage2-bandL-n9: {4: S-BERL, 5: S-BERL, 6: S-BERL, 7: S-BERL}
          stage2-bandL-n10: {4: S-BERL, 5: S-BERL, 6: S-BERL, 7: S-BERL}
          stage2-bandL-n11: {5: S-BERL, 6: S-BERL, 7: S-BERL}
          stage2-bandL-n12: {5: S-BERL, 6: S-BERL, 7: S-BERL}
          stage2-bandL-n13: {5: S-BERL, 6: S-BERL, 7: S-BERL}
          stage2-bandL-n14: {6: S-BERL, 7: S-BERL}
        changed_rows_count: 2800
        dual_route_cells:
          note: >-
            Every route the census uses (A-DENSE and S-BERL) runs on every
            candidate of these cells, each compared exactly with I_direct and,
            for C2 to C4, each required to return the forced count.
          cells:
            - stage1-toy-calibration/n11-np6 (all d = 2 to 7)
            - stage1-toy-calibration/n13-np7 (all d = 2 to 7)
            - stage1-toy-calibration/n7-np3 (all d = 2 to 7)
            - stage5-controls/C2 (7, 3, X^2+X)
            - stage5-controls/C3 (31, 15, X^128+X^8+X^2+X)
            - stage5-controls/C4 (12, 6, X)
        unchanged_derivation_A_rows:
          - stage2-bandL-n9 d = 3; stage2-bandL-n10 d = 3
          - stage2-bandL-n11 to n13 d = 3, 4
          - stage2-bandL-n14 d = 3, 4, 5
          - stage3-bridge-n22 every d
          - stage4-bandH-n33, n44, n66 every d
          - stage5-controls/C5F-np33, C6-np11, C6-np33 (A-DENSE); C5K-np33 (A-TWIST, the K-coefficient form of derivation (A), repair-design WO-I-5)
        unchanged_derivation_A_band_l_rows_count: 128
        route_selection_rule: >-
          In code the route is looked up by the cell's name and lambda's degree
          in a literal table equal to this one (CI-3); it is never chosen by a
          threshold computed from the cell.
      substitute_route:
        name: S-BERL
        definition: >-
          For L = X^(2^n') + lambda(X) in F_2[X]: compute rad(L), the product of
          its distinct irreducible factors; find those factors by Berlekamp's
          method (kernel of Q - I, where row i of Q is X^(2i) mod rad(L), built
          by repeated multiplication by X^2, then splitting by gcds with kernel
          polynomials); N_K(L) = the sum of deg f over the factors f whose degree
          divides n; list every root in K of each such f, with its Frobenius
          orbit. A failed split or root search raises; it never returns a count
          (CI-4). Steps: repair-design WO-I-6 and WO-I-7.
        why_independent_of_I_direct: >-
          I_direct is N = deg gcd(X^(2^n) - X, L), by repeated squaring of X
          modulo L. S-BERL never forms X^(2^k) modulo L or rad(L) for k >= 2,
          never squares a residue modulo L or rad(L), and computes no gcd with
          X^(2^n) - X; it decides the count from the factor degrees of L, by
          linear algebra over F_2 and gcds with kernel polynomials. It is written
          by a different executor (TASK-20261002-e0b22e) who reads no file of the
          bound closure and no r1/runner file (CI-1), with its own primitives
          (repair-design WO-I-10). Shared with I_direct: the input L and the
          generic notion of polynomial gcd. Checked by repair-design AC-7 and,
          on its known-false object, PTM-D3 and PTM-R5.
      infeasibility_argument: >-
        For each changed (cell, d), with B the derivation-(A) degree and G the
        number of candidates of degree d: either the memory floor of any dense
        construction, 2B bits, exceeds the 8 GiB ceiling, or the projected
        single-worker time of the G candidates exceeds a 30-day horizon under
        the more favourable of two declared models (P, no sub-quadratic
        GF(2)[X] engine, as H-QSP-cd0c90 records the program's engine state; E,
        bit-spread CPython-integer Karatsuba products with Barrett reduction),
        both with optimistic rates. The figures are repair-design
        session_computations D-C3, from code_blocks.route_table_code. The
        horizon is a design parameter, not a budget cap; the table is the same
        for every horizon between the largest unchanged derivation-(A) census
        group (8.29 days) and the smallest changed group (121.98 days) (D-C3
        summary line). Of the 2800 changed rows, 1812 fail the memory floor and
        988 fail only the time test.
      where_derivation_A_runs_and_is_calibrated_by_C1_before_Band_H: >-
        Derivation (A) is cross-checked by C1 against I_direct at n = 131 on
        the bridge (244 rows, every d; s = 1, q + 1 = 6) and on the 128
        unchanged Band-L rows (n' = 9 to 14; s in {1, 4, 9, 12}; q + 1 from 10
        to 15). It is also checked against I_direct on the 756 Stage-1 rows
        (toy n; q + 1 in {2, 3}) and against forced counts on C2, C3 and C4,
        all of which gate the census. Band H (n = 131, s = 1, q + 1 in {2, 3,
        4}) runs the same derivation-(A) code path (one implementation;
        repair-design WO-I-11, AC-8).
      consequence_for_S1: >-
        S1's text is unchanged: M1 = 0 and M2 = 0, I_direct equal to I_indep on
        every completed Band-L and bridge candidate. On the 2800 changed rows
        I_indep is S-BERL, so M1 = 0 there is agreement of two algorithmically
        independent instruments for N_K(L) and establishes the count on those
        rows; it is not a test of derivation (A) there. On the 128 unchanged
        Band-L rows and on the bridge, M1 = 0 and M2 = 0 remain agreement of
        derivation (A) with I_direct.
      consequence_for_the_pre_Band_H_calibration: >-
        The specification's sentence that Band-L and bridge agreement with
        I_direct "calibrates it before Band H" holds in a narrower sense: the
        derivation-(A) code path is cross-checked at n = 131 on 372 rows (244
        bridge, 128 Band L), none with Band H's composition depths q + 1 in {2,
        3, 4}, which are exercised only at toy n (Stage 1, C2) and on synthetic
        cells. A defect appearing only jointly at n = 131 and q + 1 at most 4 is
        not excluded by calibration. Band H's completeness still rests on
        derivation (A), as in version 1.
      consequence_for_reading_H_QSP_cd0c90_R2: >-
        Not a change to the hypothesis record, which is not edited. Any later
        evidence record must state that on 2800 Band-L rows the second
        instrument was S-BERL, not an instrument derived from derivation (A), so
        (R2)'s description of I_indep holds on 128 Band-L rows only.
      consequence_for_M1_to_M9: >-
        No definition changes. M4's slack is null on S-BERL rows ("slack (if
        I_indep exposes it)"); M6 records the forced fixtures on I_direct and on
        each I_indep route.

