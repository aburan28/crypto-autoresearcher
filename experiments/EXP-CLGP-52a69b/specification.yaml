experiment:
  id: EXP-CLGP-52a69b
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-0fafe8
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'BACKWARD REDUCTION ATTEMPT, WITH TWO INDEPENDENT OBSTRUCTIONS: an ECDLP oracle for every
    curve in the isogeny class does not solve Cl(O)-vectorization, because (i) Hom(Z/N, Cl(O)) = Hom(Cl(O),
    Z/N) = 0 whenever N > h(O), so the oracle''s answers admit no homomorphic transport, and (ii)
    vectorization inverts a TORSOR action rather than a group law -- and the strictly stronger Cl(O)-DLP
    oracle, available subexponentially by Hafner-McCurley, is already known not to suffice'
  status: draft
  objective: "(A) THE REDUCTION BEING ATTEMPTED, WITH ITS QUANTIFIER ORDER WRITTEN OUT.\n\n  FORALL\
    \ primes p > 3,\n  FORALL orders O with Z[pi] subset O subset O_K, K = Q(sqrt(t^2 - 4p)),\n  THERE\
    \ EXISTS a probabilistic polynomial-time oracle machine S\n  such that FORALL pairs (E, E') of\
    \ curves over F_p with\n    End_{F_p}(E) = End_{F_p}(E') = O,\n    Pr[ S^{DL}(p, E, E') = [a]\
    \ with [a] * E = E' ] >= 2/3,\n\nwhere DL is a discrete-logarithm oracle answering, at unit cost,\
    \ on ANY curve in the isogeny class and for ANY pair of points in a cyclic subgroup.\nORDER MATTERS\
    \ AND IS THE USUAL FAILURE POINT. S is quantified BEFORE the curve pair, so one machine must handle\
    \ all pairs -- this is the honest reading of \"vectorization reduces to ECDLP\". Three weaker\
    \ readings that must never be substituted:\n  (W1) FORALL (E, E') THERE EXISTS S_{E,E'} -- the\
    \ machine may depend on\n       the pair, hence may hardwire the answer. Vacuous.\n  (W2) FORALL\
    \ (E, E') THERE EXISTS a sequence of DL queries whose answers\n       DETERMINE [a] information-theoretically.\
    \ Possibly true and useless:\n       determination is not computation, and (C) shows the determination\n\
    \       map is not a homomorphism, so no algebraic extraction exists.\n  (W3) S is allowed unbounded\
    \ queries. Then S can enumerate Cl(O) and walk\n       -- but that is the sqrt(h) baseline achieved\
    \ WITHOUT the oracle, so\n       it is not a reduction, it is the incumbent.\n\n(B) WHAT THE ORACLE\
    \ ACTUALLY PROVIDES. DL inverts multiplication in a cyclic group of order N. Its answer space\
    \ is Z/N. The target answer space is Cl(O), a finite abelian group of order h = h(O). The reduction\
    \ must transport answers from the first to the second.\n(C) OBS-3, HOM-VANISHING -- AND IT IS\
    \ RIGOROUS, UNCONDITIONAL, AND TWO-SIDED. h(O) = O(sqrt(|disc O|) log|disc O|) with |disc O| =\
    \ |t^2 - 4p| <= 4p, so h(O) = O(sqrt(p) log p); and N = #E(F_p)/c >= (p + 1 - 2 sqrt(p))/c for\
    \ cofactor c. Hence N > h(O) whenever\n    c < (p + 1 - 2 sqrt p) / (C sqrt p log p),\ni.e. for\
    \ every cofactor up to roughly sqrt(p)/log p -- which comfortably includes all standardised curves\
    \ (c <= 8) and all curves this campaign tests. Given N prime and N > h, gcd(N, h) = 1, and therefore\n\
    \    Hom(Z/N, Cl(O)) = 0 and Hom(Cl(O), Z/N) = 0.\n(Proof, both directions, one line each: the\
    \ image of a homomorphism out of Z/N is a subgroup of Cl(O) of order dividing the prime N and\
    \ dividing h, hence trivial; the image of a homomorphism out of Cl(O) is a quotient of Cl(O) inside\
    \ Z/N, so its order divides gcd(h, N) = 1.) CONSEQUENCE: no group-homomorphic transport of oracle\
    \ answers exists in EITHER direction. This is the same counting fact that closes the forward homomorphic\
    \ route in IDEA-20260807-bbdcf3, applied here to the oracle's answer space.\n(D) OBS-4, THE TORSOR\
    \ OBSTRUCTION -- WHY EVEN A PERFECT GROUP ORACLE FOR THE RIGHT GROUP WOULD NOT SUFFICE, WHICH\
    \ IS THE A FORTIORI ARGUMENT. Vectorization is not a DLP. It is inversion of a FREE TRANSITIVE\
    \ ACTION of Cl(O) on a set X of curves: given x, y in X, find a with a . x = y. The set X carries\
    \ no group law and no basepoint-independent structure; the only handle is the evaluation map (a,\
    \ x) |-> a . x. Now the a fortiori step. The DLP INSIDE Cl(O) -- given ideal classes A, B with\
    \ B = A^k, find k -- is subexponential: Hafner-McCurley compute the structure of the class group\
    \ of an imaginary quadratic order in expected time L_{|D|}(1/2, sqrt(2) + o(1)) (Las Vegas; GRH-conditional\
    \ refinements give the exponent 3/sqrt(8)), and class-group DLP follows by the same index-calculus\
    \ machinery. Despite this, classical vectorization is still ~O(sqrt(h)) (KN-TECH-027) -- the group\
    \ side is subexponential and the TORSOR side is not. That gap is direct evidence that solving\
    \ a group does not solve its torsor. An ECDLP oracle is not even a Cl(O)-DLP oracle: it solves\
    \ a DIFFERENT group with which Cl(O) shares no nontrivial homomorphism by (C). So if the strictly\
    \ more relevant oracle does not suffice, the less relevant one a fortiori does not. HONESTY MARKER:\
    \ the a fortiori step is CONDITIONAL on the standing belief that classical vectorization costs\
    \ ~sqrt(h). That belief is an assumption of the field, not a theorem, and is labelled as such\
    \ below. OBS-3 is unconditional; OBS-4 is not.\n(E) THE SUBROUTINE ENUMERATION -- THE CHECKABLE\
    \ FORM OF THE ARGUMENT. Every known route to evaluating or inverting the class-group action decomposes\
    \ into these subroutines, and none of them is a DLP in a group of order N:\n  (E1) act by a small\
    \ prime ideal l = (ell, pi - lambda): find the\n       lambda-eigenspace of Frobenius on E[ell]\
    \ and quotient. Cost:\n       linear algebra mod ell. NOT a DLP.\n  (E2) express an arbitrary\
    \ class in terms of the chosen small primes:\n       relation-lattice CVP, the CSI-FiSh step (KN-LIT-3339).\
    \ NOT a DLP.\n  (E3) compute the structure of Cl(O): index calculus on ideals\n       (Hafner-McCurley).\
    \ This IS a DLP-flavoured computation, but in\n       Cl(O), and it is already subexponential\
    \ without any oracle.\n  (E4) find the connecting class from (E, E'): meet-in-the-middle or\n\
    \       kangaroo on the Cayley graph, ~sqrt(h). NOT a DLP; it is a\n       collision search in\
    \ a torsor.\nA backward reduction must speed up (E4), and (E4)'s only interface is the evaluation\
    \ map. A DL oracle offers no interface to it. Falsifying this record means exhibiting a fifth\
    \ subroutine, or a rewriting of (E4) as a DLP in a group of order N."
  resource_label: R4 (isogeny graph / class-group action -- the object being solved for) and R3 (End(E)
    as a ring -- ideals, norms, class number bounds). The ECDLP oracle is the GRANTED resource, not
    the consumed one.
  admissibility: admissible
  admissibility_argument: 'Admissible under the campaign filter, but note the filter is being used
    in an unusual direction here: the proposal does not attack ECDLP at all, it attacks vectorization
    USING ECDLP. Nothing applies an endomorphism to a point of G, so H-ENDO-001''s scalar collapse
    is irrelevant, and the closed oracle classes of KN-FIND-b7e091 (incidence, endomorphism-image)
    are not invoked. The resource named (R4) genuinely escapes the generic group because the class-group
    action moves between curves, which a generic group oracle cannot express. The proposal is then
    closed by OBS-3/OBS-4, not by the admissibility filter.'
  reachability_gate: 'T5 IS THE ENTIRE DIFFICULTY OF THE PROBLEM BEING SOLVED HERE, not an incidental
    cost. This proposal''s target IS reaching a specified curve, so the gate is not passed by design:
    reaching E'' from E is exactly vectorization at ~sqrt(h) = p^{1/4} action evaluations. Random
    walking to a UNIFORM curve is cheap (O(log p) steps under the GRH-conditional rapid mixing cited
    in T5), which is precisely the dichotomy T5 states, and the proposal exploits nothing from the
    cheap side. Consequently: any experiment here must budget sqrt(h) per solved instance and must
    cap h so the toy ladder terminates. Concretely, h <= 4096 keeps a single solve under a few thousand
    action evaluations.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): prove OBS-3 with the explicit cofactor threshold,
      and run the (E1)-(E4) literature audit. If a reviewer names a fifth interface or rewrites (E4)
      as a group DLP, the record is refuted before compute. STAGE 1 (minutes): toy enumeration of
      ordinary classes; record (p, t, D, f, O, h, N, c) per instance; compute h/N; collect the escape
      set N <= h. STAGE 2 (hours): implement the class-group action on toy classes (small split primes
      acting on curves, verified by orbit counting); measure MITM/kangaroo vectorization cost; fit
      against sqrt(h). STAGE 3 (hours, THE DISCRIMINATOR): re-run Stage 2 with an exact brute-force
      Cl(O)-DLP oracle granted for free; compute the cost ratio. Then run the identical measurement
      on the planted torsor null. STAGE 4 (zero compute): exhaustive homomorphism search at toy scale
      as a known-answer calibration, in both the gcd = 1 and gcd = N regimes.'
    mechanism: 'STEP 1 (zero compute). Freeze the quantifier order of (A) and the three weaker readings.
      Any subsequent argument is checked against it.

      STEP 2 (zero compute, symbolic, HARD GATE). Prove OBS-3 in the exact stated form, including
      the explicit cofactor threshold. Two one-line arguments plus the class-number bound. This is
      the unconditional core.

      STEP 3 (toy compute, cheap). VERIFY the threshold empirically rather than trusting the asymptotic:
      over a ladder of toy primes, enumerate ordinary curves, compute t, D, the conductor, O, h(O)
      (by counting reduced forms), N and c, and record the empirical distribution of h(O)/N. Predicted:
      h/N concentrated near p^{-1/2} times a log factor, and NEVER >= 1 for c small. The measurement
      also produces the ESCAPE SET: all toy instances with N <= h, which are handed to the boundary
      analysis.

      STEP 4 (zero compute). Run the subroutine enumeration (E1)-(E4) against the current literature
      and against this corpus, and record for each whether any known algorithm rewrites it as a DLP
      in a group of order N. Predicted: none. This step is a literature audit, and a positive hit
      is an ingredient rather than a disappointment.

      STEP 5 (toy compute, the interesting one). CHARGE the a fortiori argument instead of asserting
      it. On toy classes with h between 50 and 5000: (a) measure the cost of vectorization by kangaroo/MITM
      on the Cayley graph, in action evaluations, and fit against sqrt(h); (b) grant an ORACLE that
      solves DLP in Cl(O) (implemented by brute force at toy scale, so it is exact and free) and re-measure
      -- i.e. give the attacker the strictly stronger oracle; (c) confirm that (b) does not reduce
      the measured cost below (a). This makes the a fortiori step a MEASURED statement at toy scale
      rather than a conditional belief, which is the honest way to use it.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - planted torsor with a constructed group-to-torsor bridge -- the instrument MUST report a large
    oracle benefit there
  - orbit-count verification that the implemented action is free and transitive on the O-stratum (h
    curves, h classes)
  - known-answer homomorphism counting in both gcd regimes
  - baseline reproduction of sqrt(h) vectorization cost before any ratio is computed
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. The matched null for Step 5 is a PLANTED-BRIDGE
    torsor: build a synthetic free transitive action of Cl(O) on a set X of h labels in which the
    label of a . x is defined to be a SIMPLE function of a (e.g. its index under a fixed enumeration),
    so that a Cl(O)-DLP oracle provably DOES solve vectorization. The measurement pipeline of Step
    5(b) must show a large cost drop on this planted null. If it does not, the pipeline cannot detect
    an oracle benefit at all and every "no benefit" reading from the real torsor is void; the run
    set is INVALID, not negative. DECAY PARAMETER: h. The cost ratio (with oracle)/(without oracle)
    on the REAL torsor must stay at 1 +- noise as h grows over the ladder; on the PLANTED null it
    must fall like 1/sqrt(h). A benefit on the real torsor that does NOT decay away as h grows is
    the canonical artifact tell and means the toy implementation leaked structure the real problem
    lacks.'
  independent_variables: []
  metrics:
    primary:
    - h(O), N, c, h/N per instance, with the escape set listed explicitly
    - vectorization action-evaluation counts with and without the oracle
    - the same on the planted null, per h
    - fitted exponent of cost against h, with confidence interval
    secondary:
    - homomorphism counts per gcd regime
  heuristic_under_test: null
  preregistered_prediction:
    quantity: maximum over the toy instance set of h(O)/N, for instances with cofactor c <= 8
    formula: Strictly below 1 on 100 percent of such instances, and the fitted scaling of h/N against
      p has slope in [-0.65, -0.35] (predicted -1/2 up to logs). A single c <= 8 instance with h >=
      N falsifies the stated threshold and forces its recomputation.
    source: pre-registered in IDEA-20260807-0fafe8 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - TOY-SCALE h IS TINY. At p ~ 2^16, h can be under 100, where sqrt(h) and h differ by less than
    an order of magnitude and cost fits are unreliable. The ladder must reach h >= 1000 before any
    exponent fit is reported, and h must be printed with every measurement.
  - ACTION-EVALUATION COST IS NOT CONSTANT. Acting by a large-norm ideal costs more than by a small
    one. If the oracle-granted variant happens to use cheaper ideals, a spurious speedup appears.
    The metric must be action evaluations of a FIXED small-prime generator set, not wall clock.
  - CONDUCTOR STRATIFICATION. Curves in one isogeny class sit at different volcano levels with different
    O and different h. Mixing levels in one cost fit produces a meaningless exponent. Stratify by
    O.
  - THE ESCAPE SET IS SELECTED, NOT RANDOM. Instances with N <= h are found by search and are unrepresentative;
    any statistic computed on them is conditional on that selection and must be reported as such.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Strictly below 1 on 100 percent of such instances, and the fitted scaling of
    h/N against p has slope in [-0.65, -0.35] (predicted -1/2 up to logs). A single c <= 8 instance
    with h >= N falsifies the stated threshold and forces its recomputation.
  falsification_criterion:
  - A c <= 8 instance is found with h(O) >= N. OBS-3's threshold is wrong as stated; recompute it
    and rescope every conclusion that used it.
  - Granting the exact Cl(O)-DLP oracle reduces measured vectorization cost by more than a factor
    2, persistently as h grows, on real toy classes. OBS-4's a fortiori step is false; escalate for
    independent review before any interpretation.
  - The planted torsor null shows NO oracle benefit. Instrument blind; run set INVALID rather than
    negative.
  - A reviewer exhibits an interface (E5) to the class-group action that is a DLP in a group of order
    N. The subroutine enumeration is incomplete and the record is superseded.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-0fafe8
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
