experiment:
  id: EXP-TORS-e95087
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-1d9c5f
  question_id: RQ-TORS-8c7b79
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE RATIONAL-KERNEL COUNT OF psi_ell IS THE ONLY R5 QUANTITY THAT VARIES INSIDE AN ISOGENY
    CLASS: measure it as the ell-volcano level, stratify every campaign cost functional by it, and
    decide the sharp question of whether ell-torsion has ANY within-class content at all -- k-independent
    by construction, and stated so before the measurement rather than after'
  status: draft
  objective: "(A) THE SEPARATION THIS RECORD EXISTS TO MAKE. IDEA-20260807-c98c3d establishes that\
    \ the Elkies/Atkin classification is constant on an F_p-isogeny class, because it depends only\
    \ on (t, p, ell) and t is a class invariant. That constancy makes it a class fingerprint and simultaneously\
    \ makes it USELESS for distinguishing curves within a class -- which is exactly what L1 (RQ-ICINV-475b5e)\
    \ and L2 (RQ-VOLC-f6253b) need. The question this record asks is therefore forced: is there ANY\
    \ ell-torsion quantity that varies WITHIN a class? There is exactly one natural candidate, and\
    \ it is this:\n  kappa_ell(E) = the number of distinct F_p-rational order-ell subgroups of E,\n\
    \  equivalently the number of degree-(ell-1)/2 Galois-stable kernel polynomials\n  dividing psi_ell\
    \ over F_p, equivalently the number of F_p-rational\n  ell-isogenies out of E.\nkappa_ell is NOT\
    \ determined by t alone. When ell divides the conductor f of Z[pi] inside the endomorphism order,\
    \ the ell-isogeny graph on the class is a VOLCANO with more than one level, and kappa_ell takes\
    \ different values at different levels: at the crater a curve has the horizontal isogenies plus\
    \ the descending ones, at the floor it has only the ascending one. That is the standard Kohel\
    \ / Fouquet-Morain volcano picture, RELAYED as standard and NOT re-derived here, and it is marked\
    \ [open] in this record until the measurement in STEP 3 confirms the level stratification directly\
    \ on toy classes.\n(B) K-INDEPENDENCE, STATED FIRST. kappa_ell(E) reads only (p, a, b). It never\
    \ touches P or Q. It is therefore INDEPENDENT OF k BY CONSTRUCTION, and the static provenance\
    \ gate of IDEA-20260807-bd5d91 would reject any k-correlation study of it before it ran. No such\
    \ study is proposed. What is proposed is a STRATIFICATION: use kappa_ell as a covariate against\
    \ which OTHER measurements are grouped, which is a legitimate and different use of a curve-only\
    \ quantity.\n(C) THE DECISIVE QUESTION AND ITS TWO OUTCOMES. DECOMPOSITION.md section 5 pre-registers\
    \ the expectation that L2 shows NO effect stratified by volcano level. This record supplies the\
    \ instrument that makes that prediction testable and pre-registers the two branches:\n  OUTCOME\
    \ 1 -- every campaign cost functional measured on curves of a single\n    class is statistically\
    \ indistinguishable across kappa_ell strata, at the\n    pre-registered effect size. Then R5 has\
    \ no within-class content for those\n    functionals, L2's central prediction is confirmed with\
    \ a named mechanism\n    (the level is invisible to every functional the program measures because\n\
    \    each of them factors through data the level does not change), and the L2\n    lane closes\
    \ with an obstruction rather than a tally.\n  OUTCOME 2 -- some functional differs across strata\
    \ beyond the pre-registered\n    threshold and survives the nulls. Then the campaign has found\
    \ a\n    within-class varying quantity that correlates with cost, and the\n    reachability gate\
    \ T5 immediately becomes the binding question: is a\n    favourable level REACHABLE, given that\
    \ the level is changed only by\n    VERTICAL (ascending/descending) isogenies and that the number\
    \ of levels is\n    v_ell(f), typically 0 or 1 at toy scale? That question is answered in the\n\
    \    reachability_gate field of this record, in advance, so that OUTCOME 2\n    cannot be reported\
    \ as an attack.\n  There is no outcome in which the measurement means nothing: it either closes\n\
    \  L2's question or hands the campaign a target with a stated reachability cost.\n\n(D) THE MEASUREMENT\
    \ IS CHEAP AND SHARES ALL ITS MACHINERY. kappa_ell is a by-product of the kernel extraction already\
    \ required by IDEA-20260807-053a55: factor psi_ell over F_p (degree (ell^2-1)/2, at most 84 for\
    \ ell <= 13) and count the products of irreducible factors of total degree (ell-1)/2 whose root\
    \ set is closed under the x-only group law. The marginal cost over the transport primitive is\
    \ a counter."
  resource_label: R5
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE AS A RESOURCE USE. kappa_ell is read from the factorisation
    of psi_ell over F_p -- the Galois-module structure of E[ell] -- which the generic group oracle
    does not supply and cannot simulate, since a simulator holding only group handles has no access
    to psi_ell. So R5 genuinely escapes the generic model. It escapes it at the CURVE level only:
    kappa_ell is a property of E, never of a point, so it cannot by itself distinguish two targets.
    The honest position is therefore that this proposal''s resource is admissible and its OUTPUT is
    k-independent -- which is not a contradiction but the exact combination the L7 brief predicted
    for curve-level torsion statistics, and which is why the proposal is framed as a stratification
    instrument rather than as an attack.'
  reachability_gate: 'REQUIRED AND ANSWERED IN ADVANCE, because OUTCOME 2 would otherwise be misreported
    as an attack. IS A GOOD LEVEL REACHABLE, AND AT WHAT COST? (i) The level is changed ONLY by vertical
    (ascending or descending) ell-isogenies, and the number of levels available is v_ell(f), which
    is 0 or 1 for most toy classes and small even when non-zero. So the reachable variation is bounded
    by the conductor''s ell-valuation and is typically nil -- the goodness, if any, has a tiny dynamic
    range. (ii) Reaching a specified level is LOCAL and CHEAP when it exists: descending one level
    costs one Vélu step, and detecting the level costs one kappa_ell evaluation, which is O(polylog
    p). This puts the level squarely on the FAVOURABLE side of T5''s dichotomy -- goodness that is
    locally detectable at each step of a walk, not goodness identified only by a global address. (iii)
    THEREFORE, if OUTCOME 2 fires, the correct next question is NOT reachability (which is cheap)
    but MAGNITUDE: the level takes at most v_ell(f)+1 values, so any cost benefit is bounded by the
    spread across that handful of values and is a CONSTANT factor, never an exponent. This is stated
    before the measurement so that a stratum effect cannot be written up as an exponent claim.'
  inputs:
    procedure: 'STAGE 0 (zero compute): state the k-independence (claim B) and the two-branch pre-registration
      (claim C). STAGE 1 (hours): implement the kernel counter on top of the shared psi_ell code;
      validate on a flat class (must give constant kappa). STAGE 2 (the budget sink, hours to a day):
      enumerate toy classes at 16-20 field bits, searching for at least one class with v_ell(f) >=
      1 for some ell in L. Use the c98c3d fingerprint sieve as the pre-screen. If no such class is
      found within budget, STOP and report the SCOPE outcome. STAGE 3 (hours): build the ell-isogeny
      graph, verify the level structure and the horizontal/vertical propagation rule. STAGE 4 (hours):
      stratified measurement of rho step count, BSGS operation count and transport cost, with the
      permutation null, the different-class null and the k-resample null. STAGE 5 (minutes): the planted-positive
      check. BUDGET: ell capped at 13 (deg psi_13 = 84); field sizes capped at 20 bits for the FULL
      enumeration and 24 bits for a sampled one, with the sampling recorded. Division polynomials
      beyond ell = 13 are outside this contract.'
    mechanism: 'STEP 1 (implementation, shared) -- psi_ell over F_p for ell in {3,5,7,11,13}; factor
      over F_p; enumerate products of irreducible factors of total degree (ell-1)/2; test each candidate
      root set for closure under the x-only group law; count the survivors. Output kappa_ell(E) and
      the kernel polynomials themselves.

      STEP 2 (class enumeration) -- for a small toy class, enumerate every curve in the class. At
      16-20 field bits this is feasible by brute force over (a, b) with the fingerprint sieve of IDEA-20260807-c98c3d
      as a pre-screen and exact point counting as the confirmation. Record every curve''s j-invariant
      and kappa vector.

      STEP 3 (structure validation, the instrument''s own test) -- verify the volcano picture directly
      rather than assuming it: (i) build the ell-isogeny graph on the class from the extracted kernels;
      (ii) check that it decomposes into levels with the predicted degrees; (iii) check the propagation
      rule of the object_first block -- kappa_ell invariant along horizontal steps, changed along
      vertical ones; (iv) check that the number of levels equals v_ell(t^2 - 4p) up to the standard
      conductor bookkeeping, and record any discrepancy as a finding about the toy family rather than
      silently adjusting the model.

      STEP 4 (stratification) -- for each cost functional the campaign already measures, group the
      class''s curves by kappa vector and report the between-stratum versus within-stratum variance
      ratio, with the matched nulls below. The functionals in scope for THIS record are only the ones
      that are cheap and already implemented in this harness: matched Pollard rho step count (harness/rho.py),
      BSGS operation count, and the transport cost per Elkies step from IDEA-20260807-053a55. Gröbner/Semaev
      solving-degree functionals belong to L1 and are explicitly NOT run here; this record hands L1
      the strata.

      STEP 5 (the k-resample control, mandated by the lane) -- for every stratified measurement that
      involves points, resample k with the curve fixed and confirm the stratification result is unchanged.
      A stratification effect that moves when k is resampled is not a curve-level effect at all.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - flat-class calibration, kappa constant (blocking)
  - permutation null with preserved stratum sizes, >= 1000 permutations (blocking)
  - different-class null matched on N (blocking)
  - k-resample null with the curve fixed (blocking, mandated by RQ-TORS-8c7b79)
  - planted-positive kernel-counter functional (blocking)
  - transport-cost internal positive control (must stratify)
  - anomalous / smooth-order exclusion per KN-TECH-034 before any timing
  - 'NULL OBJECT (from the proposal): MANDATORY AND SUPPLIED, three matched nulls with their decay
    parameters. NULL-1 (RANDOM STRATIFICATION): re-run the entire stratified analysis with the curves
    assigned to strata at random, preserving the stratum SIZE distribution exactly. The between-stratum
    variance under random assignment is the reference; any real effect must exceed it. DECAY PARAMETER:
    the number of random assignments (at least 1000 permutations) -- the permutation null''s tail
    is what the observed statistic is scored against, and a p-value that does not stabilise as permutations
    grow means the statistic is not estimable. NULL-2 (DIFFERENT-CLASS NULL): the same measurement
    on curves of the SAME p but DIFFERENT classes, matched on N so that the rho and BSGS baselines
    are comparable. Between-class variance is the natural upper reference: if within-class between-stratum
    variance approaches between-class variance, the stratification is picking up class-level differences
    and the class enumeration is wrong. NULL-3 (THE CANONICAL L7 NULL): resample k with the curve
    fixed, at least 100 resamples per curve, for every functional that touches a point. DECAY PARAMETER:
    number of resamples -- an apparent effect must not shrink like M^{-1/2}, and one that does is
    instance noise. PLANTED POSITIVE (blocking): inject a synthetic functional that DOES depend on
    kappa_ell by construction (e.g. a counter of extracted kernels) and confirm the stratification
    analysis detects it at the pre-registered effect size. An analysis that cannot see a planted stratum
    effect cannot report a null.'
  independent_variables: []
  metrics:
    primary:
    - kappa_ell per (curve, ell) with the kernel polynomials recorded
    - stratum sizes per class per ell
    - v_ell(t^2 - 4p) per class, and the observed number of levels
    - between- and within-stratum variance per functional, with permutation p-values
    secondary:
    - all three nulls on the identical pipeline
    - class enumeration completeness (full or sampled, with the sampling rule)
  heuristic_under_test: null
  preregistered_prediction:
    quantity: kappa_ell across all curves of an enumerated FLAT class (v_ell(f) = 0)
    formula: Constant, on 100 percent of curves, for every ell in L. A variation on a flat class is
      an implementation error. BASIS - derivation from the relayed volcano picture; the flatness itself
      is verified from the exactly computed t^2 - 4p, so this is a KNOWN-ANSWER CALIBRATION rather
      than a discovery.
    source: pre-registered in IDEA-20260807-1d9c5f before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Stratum imbalance. A class split into one stratum of 40 curves and one of 2 has essentially no
    power; the permutation null will report this correctly but the write-up must state stratum sizes
    with every p-value or the reader will over-read a null.
  - Multiple testing. Five primes times three functionals times several classes is a lot of tests;
    the permutation null must be applied per test AND a family-wise correction declared in advance,
    or a spurious 99th-percentile hit is guaranteed somewhere.
  - Class-size confounding with N. Different classes have different N, and rho cost scales as sqrt(N);
    NULL-2 must match on N or it will detect the trivial effect instead of the interesting one.
  - The ramified case ell | (t^2 - 4p) with ell not dividing the conductor is distinct from the volcano-depth
    case and must be classified separately, or "depth" will be attributed to classes that have none.
  - Toy-scale conductor rarity. v_ell(f) >= 1 requires ell^2 | (t^2 - 4p) in the relevant sense; at
    16-20 bits with ell in {3,...,13} this is uncommon, which is the source of the SCOPE-outcome risk
    and is pre-registered rather than discovered.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Constant, on 100 percent of curves, for every ell in L. A variation on a flat
    class is an implementation error. BASIS - derivation from the relayed volcano picture; the flatness
    itself is verified from the exactly computed t^2 - 4p, so this is a KNOWN-ANSWER CALIBRATION rather
    than a discovery.
  falsification_criterion:
  - kappa_ell varies on a verified flat class. Kernel counter broken; nothing is reported.
  - kappa_ell changes along a verified HORIZONTAL isogeny step. Either the level classification or
    the transport is wrong; both are implicated and the line halts.
  - The planted-positive functional is not detected. The stratification analysis has no power and
    every null it produced is void, not negative.
  - Transport cost does not stratify by kappa. The strata are not capturing the structure they are
    defined to capture; the analysis is uninterpretable.
  - 'No enumerated class has more than one stratum within budget. SCOPE outcome: toy classes at these
    sizes lack volcano depth. Recorded as such, NOT as evidence that the level has no effect (AGENTS.md
    rule 6: negative evidence closes only the exact tested scope, and here nothing was tested).'
  - Class enumeration at 20 bits exceeds the wall-clock budget. INFRASTRUCTURE outcome under AGENTS.md
    rule 5.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-1d9c5f
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
