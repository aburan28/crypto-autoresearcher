experiment:
  id: EXP-FHEX-ea745a
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-3fc7b2; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-3fc7b2
  question_id: RQ-FHE-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Count homomorphic multiplications, rotations, key switches and levels consumed by a fixed
    bootstrapping-shaped pipeline across a parameter grid using a symbolic evaluator, and report elasticities
    against a parameter-independent null pipeline.
  objective: The one uncertainty a run reduces is whether the evaluation-side cost of a hypothetical
    FHE parameter change can be stated as a counted, implementation-independent quantity with a measured
    sensitivity, rather than as an adjective. (i) It validates a symbolic evaluator against a real
    toy evaluation at one grid point, requiring identical counts, which is the only thing that makes
    the counts trustworthy given that nothing is encrypted in the sweep itself. (ii) It produces the
    four counts across a parameter grid and the elasticity of each with respect to each swept parameter
    by central differences at two grid spacings, so spacing sensitivity is an output. (iii) It runs
    a parameter-independent null pipeline whose elasticities must be exactly zero, which is the correct
    null for a counting instrument and which distinguishes a real parameter sensitivity from a differencing
    artifact. The run computes no bit count anywhere, by design, so that no security number can be
    paired with these costs by accident.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for this pipeline shape, this
      parameter grid and these grid spacings, the counted operations take the measured values and
      their elasticities take the measured values, with the parameter-independent null returning exact
      zeros and the symbolic counter matching a real toy evaluation at the validation point. What
      does NOT follow: nothing about run time, throughput, or any library''s performance, since counts
      are not times and the contract does not translate them; nothing about whether any parameter
      change is warranted; and no security statement of any kind, since no security number is computed.
      The sparsity elasticity, if reported at all, is inherited entirely from a declared external
      input and carries no more authority than that input.'
  inputs:
    procedure: 'STAGE 0 (a day implementation): define the pipeline shape symbolically (linear transform
      as a baby-step giant-step rotation set, polynomial evaluation on a Paterson-Stockmeyer-shaped
      schedule, second linear transform) and implement a symbolic evaluator over a token type carrying
      only a level index, with four counters. STAGE 1 (hours): validate the symbolic counter against
      a real toy evaluation at one grid point, requiring identical counts; abort on mismatch. STAGE
      2 (seconds): sweep the 4-by-4-by-3 grid of polynomial degree, ring degree and modulus chain
      length at fixed sparsity, recording all four counts and per-stage breakdowns. STAGE 3 (seconds):
      compute central-difference elasticities at two grid spacings. STAGE 4 (seconds): run the parameter-independent
      null pipeline over the identical grid, requiring exact zeros. STAGE 5 (seconds): degenerate
      single-multiplication pipeline check against inspection. STAGE 6 (minutes): if and only if a
      sparsity-to-polynomial-degree input is supplied by the Coordinator, extend the sweep along the
      sparsity axis and report that elasticity flagged as input-inherited; otherwise record the axis
      as not run. STAGE 7 (minutes): emit the elasticity table and manifest.'
    instrument: 'Python 3 with no numerical dependencies for the symbolic evaluator: a token type
      carrying a level index, an operation dispatcher incrementing four integer counters, and a pipeline
      description in plain data. The validation arm reuses the audited exact toy scheme from the first
      contract in this bucket, instrumented with the same counters, so that symbolic and real counts
      are produced by the same counter code over different evaluators. Central differences computed
      in exact rational arithmetic. Run manifests through harness/runner.py conventions. No Sage,
      no external FHE library, and explicitly no timing instrumentation anywhere in the contract.'
    parameters: 'Ring degree N in {1024, 2048, 4096, 8192} as a symbolic parameter only, since nothing
      is encrypted in the sweep. Polynomial degree in {15, 31, 63, 127}. Modulus chain length in {8,
      12, 16}. Secret Hamming weight axis in {64, 128, 192, 256}, run only if the sparsity-to-degree
      input is supplied. Grid spacings: adjacent-point and every-other-point central differences.
      Validation point: N = 1024, polynomial degree 15, chain length 8, run as a real toy evaluation
      with the same counters. Null pipeline: identical shape with rotation set size and polynomial
      degree hard-coded. Degenerate pipeline: one multiplication.'
  controls:
  - Parameter-independent null pipeline where every elasticity must be exactly zero.
  - Validation of the symbolic counter against a real toy evaluation at one grid point, requiring
    identical counts.
  - Degenerate pipeline of a single multiplication, where the counts are known by inspection.
  - Two grid spacings, so the finite differences can be checked for spacing sensitivity.
  - Counts reported per stage as well as in total, so a spurious total cannot hide a miscount in one
    stage.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Null arm: a pipeline of the identical shape whose parameter dependence
    has been removed by hard-coding the rotation set size and the polynomial degree, so that every
    elasticity with respect to every swept parameter must be exactly zero. The same symbolic evaluator
    and the same finite-difference code run on it in the same invocation. For the signal arm to mean
    anything the null must return exact zeros; a nonzero elasticity in the null means the counter
    or the differencing is picking up something other than the parameter, and no signal number is
    usable. This is a null that must MATCH a known value rather than a distribution, which is the
    right null for a counting instrument.'
  independent_variables:
  - ring degree N
  - polynomial degree
  - modulus chain length
  - secret Hamming weight (conditional on the supplied input)
  - pipeline arm (signal versus parameter-independent null)
  metrics:
    primary:
    - homomorphic multiplication count per grid point
    - rotation count per grid point
    - key switch count per grid point
    - levels consumed per grid point
    - elasticity of each count with respect to each swept parameter
    secondary:
    - elasticities of the parameter-independent null pipeline, which must be exactly zero
    - per-stage count breakdown
    - agreement between symbolic and real counts at the validation point
    - elasticity difference between the two grid spacings
    - degenerate-pipeline counts against inspection
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The elasticity of each counted operation with respect to each swept parameter, and the
      elasticities of the parameter-independent null pipeline.
    formula: E(count, param) = d log(count) / d log(param), computed by central differences on the
      grid in exact rational arithmetic. Predicted E(multiplications, polynomial degree) >= 0.4; predicted
      E(rotations, ring degree) >= 0.3; predicted E = 0 exactly for every count and every parameter
      in the null pipeline; predicted symbolic and real counts identical at the validation point.
    source: Pre-registered in the parent proposal IDEA-20260816-3fc7b2 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The ring degrees swept are nominally realistic because nothing is encrypted: the
      symbolic evaluator counts control flow and its cost is independent of the parameter values,
      so the grid can name large parameters honestly. What is toy is the validation: the symbolic
      counter is checked against a real evaluation only at N = 1024 with polynomial degree 15, so
      the guarantee that the symbolic counts match reality is established at one small point and assumed
      across the grid. That assumption is the contract''s transfer statement and it is stated as such;
      a second validation point at a larger parameter would strengthen it and is listed as a derivation
      gap rather than silently omitted.'
    correspondence: null
  tail_checks:
  - Report counts at the largest grid point separately, since baby-step giant-step splits are integer-optimised
    and can behave non-monotonically exactly there.
  - Report elasticities computed at both grid spacings side by side and flag any sign change.
  - Report the per-stage breakdown at every grid point, so a spurious total cannot conceal a miscount
    in one stage.
  - Report the grid points at which an integer count fails to change between adjacent parameter values,
    since the elasticity there is spuriously zero rather than genuinely zero.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort as instrument failure if the symbolic and real counts differ at the validation point.
  - Abort if any elasticity of the parameter-independent null pipeline is nonzero.
  - Do not run the sparsity axis at all unless the sparsity-to-polynomial-degree input has been supplied
    and recorded; record it as not run otherwise.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Symbolic and real counts identical at the validation point, all null-pipeline
    elasticities exactly zero, and signal elasticities meeting the pre-committed values for polynomial
    degree and ring degree at both grid spacings.
  falsification_criterion:
  - Any nonzero elasticity in the parameter-independent null pipeline.
  - Symbolic and real counts differing at the validation point.
  - All signal elasticities within differencing noise, which is recorded as a measured insensitivity
    over this grid rather than as a failure.
  - Elasticities changing sign between the two grid spacings.
  - Degenerate single-multiplication counts disagreeing with inspection.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-3fc7b2
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must supply or explicitly withhold the sparsity-to-polynomial-degree dependence;
    without it the entire sparsity axis, which is the axis RQ-FHE-001's fourth target actually cares
    about, cannot be run, and the contract must not pretend otherwise.
  - A second validation point at a larger parameter is needed before the symbolic counts can be trusted
    across the whole grid; the design validates at one small point only.
  - The pipeline shape is a modelling choice with no canonical answer; the Coordinator must approve
    one and accept that elasticities are shape-relative.
  - Whether counted operations are an acceptable proxy for the cost RQ-FHE-001's fourth target has
    in mind, given that the contract explicitly refuses to translate counts into time, needs a ruling
    before the results are used in any prioritisation.
