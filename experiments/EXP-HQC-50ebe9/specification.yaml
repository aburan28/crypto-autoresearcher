experiment:
  id: EXP-HQC-50ebe9
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-HQC-1d9b21
  question_id: RQ-HQC-001
  goal_id: GOAL-HQC-001
  title: >-
    Review-required contract: the memory-charged ISD baseline for HQC key
    recovery under ISD-FC-2026 - a forced inequality M < G_Prange^{3/4}, a
    Prange null that can fail, a baby-step giant-step positive control, and a
    five-point FC-versus-memory ladder with a pre-declared shape
  assigned_to: executor

  objective: >-
    If separately approved, frozen and authorized, produce the (G, M, FC)
    triple - never a scalar - for Prange and Stern at HQC's key-recovery
    parameters at all three security levels, on ISD-FC-2026's declared basis
    with three sensitivity bases beside it; evaluate the derived necessary
    condition M < G_Prange^{3/4}; locate the full-cost-optimal memory for Stern
    and verify the FC-versus-memory curve has the shape nesting forces; and
    emit the same triple at Classic McEliece's and SDitH's parameters, which is
    the deliverable all three code-based goals name first and none has. This is
    a baseline and an accounting audit. NO ATTACK IS PROPOSED.

  what_this_is_not:
    - Not an attack, not a decoding of any instance, not a key recovery, and not an execution of any algorithm on any code.
    - Not a security-level statement about HQC, Classic McEliece, SDitH, or anything else. It produces the number an attack would have to beat, on a declared basis.
    - Not an adoption of ISD-FC-2026. That convention is PROPOSED and DEC-20260802-344883 D-6 left it pending; adoption is a Coordinator act and this contract does not perform it.
    - Not a transcription or endorsement of any published ISD cost figure. No such figure is required by any decisive stage.
    - Not crypto-tier evidence. Cost EXPRESSIONS are evaluated at crypto parameters; nothing is executed at them.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has happened.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      A run could support, at most: (a) exact integer values of G, M and FC for
      Prange and for Stern at each declared (N, K, W), on each of four declared
      accounting bases, under both weight readings; (b) the value of
      G_Prange^{3/4} and whether Stern's FC-optimal memory lies below it;
      (c) the shape and flattening point of FC*(M_max); (d) the statement that
      the pipeline reproduces n^{2/3+o(1)} for baby-step giant-step. It could
      NOT support any security level, any claim about MMT/BJMM/May-Ozerov
      beyond the necessary condition, any statement that a particular algorithm
      is best, or any tier above toy (RQ-HQC-001's ceiling; AGENTS.md rule 7,
      which a standardized algorithm makes more binding, not less).

  environment_declaration:
    checked_on: '2026-08-05'
    python: "3.11.15"
    numpy: "2.4.6 present but NOT used by this contract"
    sympy: "ABSENT"
    scipy: "ABSENT"
    note: >-
      Every stage uses only Python arbitrary-precision integers and Fractions.
      No solver, no CAS, no network, no numpy. This is a deliberate design
      constraint given that two scouting sweeps in this session disagreed about
      the container's contents; the check was run rather than inherited. A
      stage later found to need an absent dependency is an INFRASTRUCTURE
      REQUEST reported as infrastructure signal, never as negative mathematical
      evidence (AGENTS.md rule 5).

  inputs:
    hqc_key_recovery_instances:
      derivation: >-
        HQC's public key is (h, s = x + h.y) over F_2[X]/(X^n - 1) with x, y of
        weight w, so key recovery is [N, K] = [2n, n] syndrome decoding at
        weight W. Reading A: W = 2w (each of x, y has weight w). Reading B:
        W = w (the pair has total weight w). BOTH are computed and BOTH are
        reported; stage 0 resolves which SPEC section 4.1 intends.
      HQC-1: {n: 17669, N: 35338, K: 17669, W_A: 132, W_B: 66, claimed_bits: 128}
      HQC-3: {n: 35851, N: 71702, K: 35851, W_A: 200, W_B: 100, claimed_bits: 192}
      HQC-5: {n: 57637, N: 115274, K: 57637, W_A: 262, W_B: 131, claimed_bits: 256}
      provenance: >-
        SPEC Table 5 as transcribed and image-verified in
        coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-6344ed/dfr_model_transcription.md.
        STAGE 0 RE-READS TABLE 5 FROM THE PRIMARY PDF, because a neighbouring
        table in the same document carried an error worth 50.7 bits at NIST-5
        (DEC-20260802-344883 D-2, resolved in CORR-20260802-3ae664).
    nearby_object_instances:
      classic_mceliece: >-
        Parameters to be READ FROM PRIMARY TEXT in stage 0. NOT stated here,
        because this program has no record of them and stating remembered
        numbers would be a fabrication under AGENTS.md rule 9. If they cannot
        be obtained, that cell is reported as not run, with the routes tried.
      low_weight_regime: >-
        A synthetic (N, K, W) with W small enough that Prange is competitive on
        gate count alone, constructed from the parameters and declared in the
        manifest. Its purpose is to show the verdict is not basis-determined.
    positive_control_instances:
      bsgs_group_orders: [2**64, 2**80, 2**96, 2**112, 2**128]
    accounting_bases:
      primary: "ISD-FC-2026 U1 gate-ops, U2 full cost, U4 cube-root access"
      sensitivity_1: "planar access, Theta(M^{1/2}) per random access"
      sensitivity_2: "logarithmic addressing, Theta(log M) gate-ops per access"
      comparability_leg: "unit-cost RAM, memory free - required by U3 so the figure can be placed beside published ones without endorsing them"
    algorithms:
      prange: >-
        P = C(N-K,W)/C(N,W); G = (N-K)^2 . N / P as the coarse form, refined in
        stage 3 with an iterative-update variant and with the quasi-cyclic DOOM
        factor (at most sqrt(n)); M = Theta(N^2) bits with the constant
        declared.
      stern: >-
        P = C(K/2,p)^2 . C(N-K-l, W-2p)/C(N,W); L = C(K/2,p);
        M = 2 L (l + ceil(log2 L)) bits; per-iteration G = Gauss + 2 L l +
        (L^2 / 2^l) . (N-K-l); (p, l) optimised over an exhaustive box extended
        until the argmin is interior.
    memory_cap_ladder: >-
      M_max at 5 or more points spanning polynomial (N^2 bits) to unbounded,
      geometrically spaced, with the exact caps recorded.
    seed_derivation_rule: >-
      NOT APPLICABLE - every quantity in this contract is DETERMINISTIC. There
      is no sampling, no randomness, and therefore no seed. This is recorded
      explicitly rather than left blank so that a reviewer can confirm the
      absence is by design: a third party reproduces every number from the
      declared parameters and the declared formulas alone, bit-for-bit.

  independent_variables:
    - algorithm in {prange, stern}
    - accounting basis in {cube_root, planar, logarithmic, unit_cost_RAM}
    - weight reading in {A, B}
    - parameter set in {HQC-1, HQC-3, HQC-5, mceliece, low_weight, bsgs}
    - memory cap M_max across the ladder

  arms_and_controls:
    treatment: >-
      Stern's (G, M, FC) at the FC-optimal (p, l), per parameter set per basis.
    measured_null: >-
      NULL-PRANGE. The identical pipeline applied to Prange, whose memory is
      polynomial. FORCED VALUE DERIVED BEFORE THE RUN: FC - G <= 2 log2 N bits,
      i.e. at most 31 / 33 / 34 bits at the three levels. THIS NULL CAN FAIL -
      if the pipeline returns a superpolynomial gap for an algorithm that
      stores no lists, the memory accounting is fabricating occupancy and every
      number in the package is void. It is a null of the same shape (same
      pipeline, same phases, same charge rules) differing only in the presence
      of a list.
    positive_control: >-
      CTRL-BSGS. Baby-step giant-step at five group orders through the
      identical pipeline. The full-cost answer n^{2/3+o(1)} with optimal table
      size n^{1/3} is published, is carried in this corpus at confidence
      established (KN-TECH-035 relaying KN-LIT-094), and was already reproduced
      once inside this repository by TASK-20260728-007 objection F1 on the
      isogeny side. THE MEMORY CHARGE MUST MOVE THE OPTIMUM FROM n^{1/2} TO
      n^{1/3}. Declared threshold before the run: the fitted exponent of FC in
      log n must lie in [0.64, 0.69] and the optimal table exponent in
      [0.31, 0.36]. IF CTRL-BSGS FAILS, NO ISD NUMBER FROM THIS PACKAGE MAY BE
      REPORTED IN EITHER DIRECTION - the instrument cannot detect a penalty
      that is known to exist.
    graded_control: >-
      CTRL-LADDER. FC*(M_max) at >= 5 caps. NON-INCREASING at every step is
      forced by nesting of the feasible sets, so any increase is an
      implementation defect rather than a finding. The flattening point must
      agree with the analytic stationarity prediction to within one ladder
      step; disagreement localises the fault to the grid or the derivation and
      the package reports which.
    nearby_object_controls: >-
      (i) Classic McEliece's much lower rate, where the time-memory balance
      differs, and (ii) a low-weight regime where Prange is competitive on gate
      count alone. A pipeline that returns the same verdict at HQC, at
      McEliece and in the low-weight regime is reporting its accounting basis
      rather than its input, and the contract treats a uniform verdict as a
      flag requiring explanation before any conclusion is drawn.
    ordering_control: >-
      NULL-PRANGE and CTRL-BSGS are computed, recorded and sha256-committed
      BEFORE any Stern optimisation is run, and the pass/fail rules are
      executed on them first. Absence of that commitment is
      invalid_measurement.
    asymmetric_charge_audit: >-
      A mandatory phase-by-phase table - permutation, Gaussian elimination,
      list build, list query, candidate verification - recording for each phase
      the gate-ops charged, the accesses charged, the occupancy interval, and
      whether reads and writes are charged identically. ISD-FC-2026 U5 records
      that this exact defect (lookups charged, insertions not) was found in
      this program's own isogeny derivation and forced a withdrawn exponent.
      "None found" by the producer IS NOT A FINDING until an independent
      reviewer confirms it, and the contract requires that confirmation
      explicitly.
    comparability_policy: >-
      No figure here may be compared to a published ISD estimate without
      stating the conversion factor between accounting bases (ISD-FC-2026 U1).
      The unit-cost-RAM leg exists to make such a comparison possible WITHOUT
      asserting that any published figure is right or wrong; asserting that is
      outside this contract.

  stages_cheapest_first:
    - stage: 0
      name: reading
      compute: zero
      can_terminate_run: true
      content: >-
        Re-read SPEC Table 5 and section 4.1 from the primary PDF; resolve the
        weight reading and quote the sentence with a page reference. Obtain
        Classic McEliece's parameters from primary text or record the failure
        and the routes tried. Search for any published memory-charged ISD
        figure for these schemes and record the outcome either way.
    - stage: 1
      name: the forced inequality
      compute: "milliseconds, exact integers"
      can_terminate_run: true
      content: >-
        Compute G_Prange and the ceiling G_Prange^{3/4} at all three levels
        under both weight readings. THIS STAGE ALONE CAN TERMINATE THE LINE: if
        the ceiling sits below any list size the advanced family could possibly
        use, the family loses under full cost at these parameters and the
        deliverable is written without any further computation.
    - stage: 2
      name: controls
      compute: "seconds"
      can_terminate_run: true
      content: >-
        NULL-PRANGE and CTRL-BSGS, computed and committed before anything else
        is looked at. Failure of either terminates the package with an
        instrument-failure report and no ISD figure.
    - stage: 3
      name: Stern optimisation and refinement
      compute: "minutes"
      can_terminate_run: false
      content: >-
        Exhaustive (p, l) optimisation under G and under FC separately, with
        grid extension until the argmin is interior; then the Prange
        refinements (iterative Gaussian update, DOOM factor) with each
        refinement's effect on G and on the ceiling reported separately.
    - stage: 4
      name: ladder, sensitivity, and corollary cells
      compute: "minutes"
      can_terminate_run: false
      content: >-
        FC*(M_max) at >= 5 caps with the monotonicity verdict; the same
        computation on all four bases; the Classic McEliece, SDitH and
        low-weight cells; the asymmetric_charge_audit table.

  metrics:
    primary:
      - "(G, M, FC) triple per algorithm per parameter set per basis - never a scalar (ISD-FC-2026 U3)"
      - "log2 G_Prange and log2 G_Prange^{3/4} at the three levels, both weight readings"
      - "delta_G and delta_FC: bits the advanced side buys, uncharged and charged"
      - "FC*(M_max) at >= 5 caps with the monotonicity verdict and the flattening point"
    secondary:
      - CTRL-BSGS fitted exponents for FC and for the optimal table size
      - NULL-PRANGE gap FC - G in bits
      - optimal (p, l) under each objective, with the grid extent recorded
      - the asymmetric_charge_audit table and the name of its independent checker
      - the effect of each Prange refinement (iterative update, DOOM) reported separately
      - the resolved SPEC section 4.1 weight reading, quoted with a page reference
      - Classic McEliece and SDitH cells, or an explicit statement that parameters could not be obtained

  heuristic_under_test: HEUR-HQC-ISD-2

  preregistered_prediction:
    quantity: >-
      The necessary condition for a list-based ISD variant to beat the
      full-cost baseline at a given parameter set, and the Prange full cost it
      is measured against.
    formula: >-
      FC >= A . M^{1/3} with A = Omega(M/e), hence FC = Omega(M^{4/3}/e); and
      FC_Prange = G_Prange . poly(N) with
      G_Prange = (N-K)^2 . N . C(N,W)/C(N-K,W). Therefore the condition is
      M < G_Prange^{3/4}. Companion forced values, derived before any run:
      log2 G_Prange = 175.7 / 246.8 / 310.9 and the ceilings 2^131.8 /
      2^185.1 / 2^233.2 under reading A; and FC_Prange - G_Prange <= 2 log2 N.
    source: >-
      DERIVED in H-HQC-1d9b21 mechanism steps 2 and 3 from ISD-FC-2026 rules U2
      and U4 (read in full in-repo) plus elementary combinatorics. The indicative
      numbers were computed in the generation session that wrote this contract
      and are pre-registered, not measured; stage 1 re-derives them and the
      package halts if it cannot. NO PUBLISHED ISD EXPONENT IS USED as a source
      for any prediction here.

  scale_relevance:
    tier: toy
    justification: >-
      The distinction that governs this contract: a cost EXPRESSION evaluated
      at cryptographic parameters is not a cryptographic-scale MEASUREMENT.
      Nothing is executed at HQC's parameters and nothing could be. What
      transfers exactly is the arithmetic - binomial ratios and a composition
      rule are scale-free - and what does NOT transfer is any claim that the
      model is the right model, which is HEUR-HQC-ISD-2's business and is
      tested only through CTRL-BSGS. The corpus's own worked failures at this
      exact boundary are KN-FIND-f8c290 and KN-FIND-2a8b7e, which extrapolated
      one solve at p = 1009 to N = 2^256; this contract must not be cited as
      doing the reverse.
    correspondence: >-
      null - no correspondence trick, no sampling, no extrapolation. The
      relation between the toy tier and the crypto parameters is that the
      formulas are evaluated there directly and the MODEL, not the arithmetic,
      is what carries the uncertainty.

  tail_checks:
    - >-
      CTRL-BSGS is fitted across five group orders spanning 2^64 to 2^128 and
      the exponent must be stable across the range, not merely correct on
      average. A drifting exponent means the o(1) is not negligible at the
      sizes tested, which is exactly the open question KN-OPEN-017 states and
      which this contract must report rather than absorb.
    - >-
      The FC ladder is checked at BOTH ends - at the polynomial cap where
      Stern must degenerate to Prange (p = 0, l = 0), and at the unbounded cap
      where FC must equal the unconstrained optimum. A ladder that fits the
      middle and misses either end is describing a trend.
    - >-
      Every reported ratio is recomputed under the planar M^{1/2} basis. If the
      verdict flips between the cube-root and planar bases, the headline is a
      property of the spatial model rather than of the algorithms, and the
      package must say so in its first sentence.

  replication:
    seeds: []
    independent_instances: 2
    interpretation: >-
      NO SEEDS - every quantity is deterministic, and that is stated rather
      than left as an empty field. Replication means INDEPENDENT
      REIMPLEMENTATION: the (G, M, FC) triple for HQC-1 under the primary basis
      must be produced twice, by two independently written code paths that do
      not share a helper function, and the two must agree exactly on integers.
      A single implementation agreeing with itself is not a replication, and
      this program has a committed precedent for the failure - EV-MLKEM-013 and
      EV-MLKEM-018 disagree by a factor over the same archived script.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 2
    no_network_after_stage_0: true

  stopping_rules:
    - Do not execute unless this contract is separately reviewed, approved, frozen, archived, and authorized by a committed Coordinator decision. GOAL-HQC-001's committed next_action directs BATCH-004 to the DFR lane and this contract does not override it.
    - Halt at stage 1 and write the deliverable if the ceiling G_Prange^{3/4} already excludes every list size the advanced family could use.
    - Halt at stage 2 if NULL-PRANGE or CTRL-BSGS fails; report instrument failure and no ISD figure.
    - Halt if the Stern argmin remains on a grid boundary after extension beyond any physically statable memory.
    - Halt on budget exhaustion, reporting it as infrastructure signal with the stages completed.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Reporting G without M and FC, or FC without G - a direct ISD-FC-2026 U3 violation.
    - FC*(M_max) increasing at any ladder step, or delta_FC exceeding delta_G. Both are impossible under correct accounting.
    - Any asymmetric charge (read but not write, query but not build) left in the phase table, or an asymmetric_charge_audit not independently confirmed.
    - Any claim of locality under U4b without exhibiting the concrete addressing order. ISD-FC-2026 names this the most abusable rule in the convention; a described pattern is not an exhibited one.
    - Any use of a remembered or unsourced published ISD exponent anywhere in the package.
    - Any post-hoc change to the bases, thresholds, ladder points or formulas after any stage-3 number has been observed; such a change requires a versioned protocol amendment with confirmatory_status exploratory_only and is never an edit.

  success_criterion: >-
    This contract has NO current success outcome because it is not authorized
    for execution. If a later, separately approved and frozen successor is
    executed, its only positive disposition is: stage 0 resolves the weight
    reading with a quoted page reference; stage 1 reproduces the pre-registered
    G_Prange and ceilings to within 0.1 bits; NULL-PRANGE returns a gap of at
    most 2 log2 N bits; CTRL-BSGS returns fitted exponents inside their
    declared windows; the Stern optimisation returns an interior argmin under
    both objectives; FC*(M_max) is non-increasing at every step with its
    flattening point matching the analytic prediction within one step; the
    asymmetric_charge_audit is zero and independently confirmed; the two
    independent reimplementations agree exactly; and all four bases are
    reported side by side. THAT DISPOSITION ESTABLISHES A BASELINE ON A
    DECLARED BASIS AND NOTHING ELSE - no attack, no security level, no
    exponent improvement, and no claim about MMT, BJMM or May-Ozerov beyond the
    necessary condition.

  falsification_criterion: >-
    Any of: CTRL-BSGS outside its declared windows; NULL-PRANGE showing a
    superpolynomial gap; a non-monotone FC ladder; delta_FC exceeding delta_G;
    an argmin that will not come interior; or the two reimplementations
    disagreeing on an integer. Each is an instrument or implementation failure
    and none may be reported as a mathematical finding.

  planned_negative_disposition: >-
    PRE-DECLARED USABLE, because a re-costing exercise that can only succeed by
    finding a problem is a biased instrument. If the ceiling G_Prange^{3/4}
    comfortably exceeds every plausible list size at all three levels, then
    full cost does not bind at HQC's parameters, the family's ranking is
    unchanged, and THAT NEGATIVE IS THE DELIVERABLE ALL THREE CODE-BASED GOALS
    ASKED FOR. It is reported with its exact tested boundary - these parameter
    sets, these two algorithms, this access model, these weight readings - with
    the three sensitivity bases attached, and with forward guidance naming what
    remains open: the variants not costed from scratch, the o(1) question
    KN-OPEN-017 states, and the SDitH d-split constraint which this contract
    does not model.

  infrastructure_failure_disposition: >-
    A timeout, an out-of-memory kill, an unobtainable primary source, an API
    session limit, or any crash is recorded as INFRASTRUCTURE SIGNAL with its
    exact cause and is NEVER negative mathematical evidence about H-HQC-1d9b21
    or any code-based proposition (AGENTS.md rule 5). In particular, failure to
    obtain Classic McEliece's parameters or any published ISD figure is an
    infrastructure outcome; it reduces the package's coverage and says nothing
    about the mathematics. This goal has already lost one producer pair to an
    API session limit in BATCH-003, and those cards were preserved as failed
    with the work redone under new ids; the same handling applies here.

  required_artifacts_if_later_authorized:
    - Frozen approved specification with a freeze receipt binding its sha256.
    - Stage 0 reading record with verbatim quotations and page references, or an explicit record of which routes failed.
    - Exact-integer transcript of every G, M and FC, with the formula used printed beside each number.
    - NULL-PRANGE and CTRL-BSGS results with their sha256 commitment, written before any Stern optimisation.
    - The full (p, l) grid with the argmin, the grid extent, and the interiority check.
    - FC*(M_max) table with monotonicity verdict, flattening point, and the analytic stationarity prediction beside it.
    - The asymmetric_charge_audit phase table, signed by the independent checker.
    - Both independent reimplementations and a diff of their outputs.
    - All four accounting bases reported side by side, with conversion factors stated.
    - Manifest, environment, exact command, git commit and dirty-tree state, stdout, stderr, resource measurements, and the inference block.
    - Snapshot archive followed by independent Validator and Red Team sessions.

  approval_requirements:
    - Independent review confirms the Prange null can fail, CTRL-BSGS can fail, and the ladder shape is forced rather than fitted.
    - Independent review confirms no published ISD exponent is used anywhere as a source, and that every unobtained source is recorded as unobtained.
    - Independent review confirms the contract nowhere adopts ISD-FC-2026 and nowhere states a security level.
    - Coordinator separately approves and freezes a contract without editing this draft, and separately decides whether ISD-FC-2026 is adopted.
    - A committed Coordinator decision authorizes execution; GOAL-HQC-001's current next_action does not.

  approval_status: >-
    Pending review. No approved_by field is present because this contract is
    not approved and only the Coordinator may approve it (AGENTS.md rule 1).
