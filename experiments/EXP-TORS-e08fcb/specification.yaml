experiment:
  id: EXP-TORS-e08fcb
  hypothesis_id: H-TORS-3bed8a
  question_id: RQ-TORS-8c7b79
  goal_id: GOAL-ENDO-001
  source_idea: IDEA-20261006-38a54f
  version: 1
  title: >-
    Factor-degree multiset of psi_5 on y^2 = x^3 + 2x + 3 over F_13
    at [1]P and at [2]P
  status: review_required
  approved_by: null
  designed_at: '2026-10-07'
  frozen: false
  execution_authorized: false
  packaging_only: false
  approval:
    approved_by: null
    composing_decision: DEC-20261007-85749a
    withheld_reason: >-
      The launcher is missing, so the contract is not runnable.
      check_approval_capacity would not reject an approving
      decision on the count taken from origin/main: GOAL-ENDO-001
      holds 2 approved contracts with no run, and the cap in
      tools/portfolio_kpis.py is 3. There is no committed program
      that builds psi_5 from A = 2 and B = 3 over F_13, factors it
      into irreducibles, selects the least eligible point P, computes
      [2]P, and reports the unshifted and shifted factor-degree
      symmetric differences. experiments/EXP-ECTD-001/driver/divpoly.py
      returns coefficient lists from torsion_poly and does not factor
      them. experiments/EXP-ECTD-9e4248/driver/divpoly_ext.py extends
      the index of that recursion and does not compare k = 1 with
      k = 2. A search of origin/main for the phrases
      "shifted_symmetric_difference" and "degree_multiset_k1" under
      *.py and *.sage returned no path. A trial plan requires that
      driver. This session did not factor psi_5.
    implementation_authorized: false
    scientific_execution_authorized: false
    scientific_execution_scope: >-
      When a later approval adds the missing comparison and the goal
      still has room under check_approval_capacity, work only at
      p = 13 on y^2 = x^3 + 2x + 3. Do not transfer the multiset to
      another prime or to cryptographic size. Do not run Pollard rho.
    frozen: false
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
      applied: false

  objective: >-
    Decide whether the multiset of irreducible-factor degrees of the
    5-division polynomial of y^2 = x^3 + 2x + 3 over F_13, built from
    the coefficients alone, is the same at [1]P and at [2]P. The
    idea's prediction is that the symmetric difference is exactly 0.
    The concrete negative is a symmetric difference of at least 1
    after the shifted control separates x(P) from x([2]P). No faster
    discrete logarithm is in scope.

  inputs:
    prime: 13
    model: >-
      E: y^2 = x^3 + 2x + 3 over F_13. Coefficients A = 2, B = 3.
    polynomial: >-
      psi_5, the standard 5-division polynomial in x, built from
      (A, B) alone. Build it twice and require the two copies to be
      identical as polynomials.
    point_rule: >-
      P is the affine point with the least x-coordinate in
      {0, 1, ..., 12} that lies on E and is not 2-torsion. Compute
      [2]P by the group law. Do not run Pollard rho and do not build
      a factor base.

  controls:
    - id: two-builds-identical
      statement: >-
        The two unshifted polynomials, built separately from (A, B),
        are identical as polynomials. Otherwise the run is invalid.
    - id: eligible-point
      statement: >-
        An eligible P exists. If every affine point is 2-torsion, the
        setup fails and no multiset is scored.
    - id: shift-separates
      statement: >-
        If x(P) equals x([2]P), the shift control is undefined and the
        unshifted comparison is refused. If x(P) differs from x([2]P)
        and the shifted degree multisets agree, the shift control is
        blind and the unshifted comparison is refused.
    - id: twist-null
      statement: >-
        The least non-residue twist is factored and stored, and it is
        not used as the primary multiset.
    - id: ordinary-nonsingular
      statement: >-
        The model is nonsingular, and the trace is not divisible by
        13. A singular or supersingular model is not scored.

  independent_variables:
    - the scalar label on the second point, [1]P or [2]P
    - whether the polynomial is shifted by x([1]P) or by x([2]P)

  metrics:
    primary:
      - id: unshifted_symmetric_difference
        statement: >-
          The cardinality of the symmetric difference of the
          factor-degree multisets of the two unshifted copies of
          psi_5, which are the copies associated with [1]P and with
          [2]P. The idea's prediction is exactly 0. The concrete
          negative is a value of at least 1 after the shift control
          separates the x-coordinates.
      - id: shifted_symmetric_difference
        statement: >-
          The cardinality of the symmetric difference of the
          factor-degree multisets of psi_5(x - x([1]P)) and
          psi_5(x - x([2]P)). The idea's prediction is at least 1
          when the two x-coordinates differ.
    secondary:
      - id: x_P
        statement: the x-coordinate of P
      - id: x_2P
        statement: the x-coordinate of [2]P
      - id: trace
        statement: the trace of Frobenius of E over F_13
      - id: degree_multiset_k1
        statement: the factor-degree multiset of the unshifted psi_5
      - id: degree_multiset_k2
        statement: >-
          the factor-degree multiset of the second unshifted build,
          the one recorded beside [2]P

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says the factor degrees of psi_5 are a function of the
    curve coefficients alone. A missing eligible point, a blind
    shift control, or a singular or supersingular model voids the
    comparison and does not by itself replace the symmetric
    difference with another integer.

  preregistered_prediction:
    quantity: >-
      The pair (unshifted symmetric difference of the factor-degree
      multisets of psi_5 at [1]P and at [2]P, shifted symmetric
      difference of psi_5(x - x([1]P)) and psi_5(x - x([2]P))).
    formula: >-
      (unshifted_symmetric_difference, shifted_symmetric_difference)
      = (0, at least 1), when x(P) differs from x([2]P). The
      concrete negative, after the identical-build, eligible-point,
      shift, twist-null, and ordinary checks pass, is an unshifted
      symmetric difference of at least 1. Source idea
      IDEA-20261006-38a54f, predictions minimum_effect exactly 0 and
      at least 1. No factorisation was scored before this formula
      was written.
    source: >-
      IDEA-20261006-38a54f. RQ-TORS-8c7b79 asks whether ell-torsion,
      as a Galois module, carries public information about k.
      KR-RHO-13bf67, KR-RHO-755e35, and KR-IC-5a43e5 were opened in
      this session. None of them states this symmetric difference
      at p = 13.

  scale_relevance:
    tier: toy
    justification: >-
      The prime is 13. No transfer to another prime or to
      cryptographic size is assumed. The minimum effect is the
      idea's own: symmetric difference exactly 0 on the unshifted
      polynomials, and at least 1 on the shifted polynomials when
      the x-coordinates differ.
    correspondence: >-
      Direct factorisation of one degree-12 polynomial and of two
      shifts of it. No sampling shortcut is used.

  tail_checks:
    - >-
      The unshifted symmetric difference 0 meets the prediction, and
      only together with a shifted symmetric difference of at least 1.
      An unshifted difference of at least 1, with the checks passed,
      is the negative.
    - >-
      Factor order in a printed factorisation is not part of the
      multiset. The metric uses the sorted degrees.

  replication:
    seeds:
      - EXP-TORS-e08fcb|psi5|F13|unshifted
      - EXP-TORS-e08fcb|psi5|F13|shifted
    independent_instances: 1
    note: >-
      One later manifest would cover both builds and both shifts.
      No run id is minted in this session. The replication plan does
      not name a future run slot, because the trial plan is not
      frozen while status is review_required.

  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One later manifest would cover the frozen factorisation at
      p = 13. Wall-clock and CPU figures are not set. The 1 GB
      figure is machine protection for a prime of 13. A watchdog
      expiry is failed_infrastructure, not a symmetric difference.

  stopping_rules:
    - Stop after one reading row is named from the pinned factorisation.
    - Do not change the predicted difference 0 after seeing a multiset.
    - Do not factor a second claim prime in this contract.
    - A timeout or crash voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - Two unshifted builds that are not identical as polynomials void the run.
    - A missing eligible P, equal x-coordinates, a blind shift control, or a singular or supersingular model voids the run.
    - Using the twist multiset as the primary comparison voids the run.
    - Transferring the multiset to another prime or to cryptographic size voids the run.
    - A rho walk or a factor base is out of scope and voids the run.

  success_criterion: >-
    The two unshifted builds of psi_5 from A = 2 and B = 3 over F_13
    are identical as polynomials, an eligible P exists and is not
    2-torsion, x(P) differs from x([2]P), the model is nonsingular
    and ordinary, the shifted factor-degree symmetric difference is
    at least 1, and the unshifted factor-degree symmetric difference
    is exactly 0. That difference of 0 is the prediction of
    IDEA-20261006-38a54f. The conjunction is reachable as a failure
    when the checks pass and the unshifted symmetric difference is
    at least 1.

  falsification_criterion: >-
    The two unshifted builds are identical as polynomials, an
    eligible P exists, x(P) differs from x([2]P), the model is
    nonsingular and ordinary, the shifted factor-degree symmetric
    difference is at least 1, and the unshifted factor-degree
    symmetric difference is at least 1. That is the concrete
    negative. A missing point, a blind shift control, or a singular
    or supersingular model is not this sentence.

  decision_impact:
    on_positive: >-
      A later evidence review may record that, at p = 13 on
      y^2 = x^3 + 2x + 3, the unshifted factor-degree multisets of
      psi_5 agree and the shifted control separates x(P) from
      x([2]P), so the meter did not read k on this curve. The
      generic-group exponent stays 1/2. No knowledge entry is
      promoted from this design record.
    on_negative: >-
      A later evidence review may record that, at p = 13 on the
      same curve, the unshifted factor-degree multisets differ
      while the shifted control separates the x-coordinates, so
      explanation A is false for this implementation on this curve
      only. The generic-group exponent stays 1/2. The two outcomes
      name different symmetric differences, 0 and at least 1.

  required_artifacts:
    - experiments/EXP-TORS-e08fcb/runs/RUN-*/manifest.yaml
    - experiments/EXP-TORS-e08fcb/runs/RUN-*/raw-result.json
    - experiments/EXP-TORS-e08fcb/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: setup_invalid
      when: >-
        the two builds differ as polynomials, no eligible P exists,
        x(P) equals x([2]P), the shifted multisets agree while the
        x-coordinates differ, or the model is singular or supersingular
    - id: infrastructure
      when: the process aborts for memory or the process times out
    - id: multisets_differ
      when: >-
        the identical-build, eligible-point, shift, and ordinary
        checks pass, and the unshifted symmetric difference is at
        least 1
    - id: multisets_agree
      when: >-
        the identical-build, eligible-point, shift, and ordinary
        checks pass, the shifted symmetric difference is at least 1,
        and the unshifted symmetric difference is exactly 0
  reading_rule: >-
    Name exactly one row. multisets_agree is the only success row.
    multisets_differ is the concrete negative. setup_invalid and
    infrastructure are not the comparison with difference 0. Record
    both multisets, both symmetric differences, x_P, x_2P, and the
    trace beside the row. attack_claimed is false.
