experiment:
  id: EXP-ECDLP-5551b6
  hypothesis_id: H-ECDLP-5b4ade
  version: 1
  title: >-
    Interface test for a lift-stable tropical initial-form decoder, with the
    pruning-erased decoder as the cost baseline and the order-permuted decoder
    demoted to a forced-value null, the 0.70 gate charged in F_p operations
    rather than branch counts, and a curve-free matched random system deciding
    whether any pruning is elliptic
  status: draft
  objective: >-
    Test the INTERFACE the decoder must satisfy before any asymptotic question
    is worth asking, on exhaustive toy instances where the truth is known.
    Four gates, all blocking. Exact source recall 1.000000; verified
    false-source rate 0; a charged F_p-operation ratio at most 0.70 against the
    PRUNING-ERASED backend with the accepted-source sets identical; and that
    advantage stable across ten independent integral lifts of the same reduced
    system, with at least 0.15 absolute separation from a
    support-and-valuation-matched random polynomial system.
    The source proposal's own text names its baseline two ways, "branch-order
    erased" and "without tropical pruning". Those are different objects and only
    one of them can carry a 0.70 gate. This contract fixes the cost baseline as
    the pruning-erased decoder and retains the order-permuted decoder as a
    separate forced-value null at exactly 1.000, which is also what proves the
    implementation distinguishes ordering from pruning.
  inputs:
    curve_family: >-
      At least six public toy prime-field curves with prime-order subgroups at
      12, 14 and 16 bits, hygiene-screened per curve with the factored group
      order, the largest prime factor, and an explicit "#E(F_p) != p" check.
    arities: [3, 4]
    factor_base_sizes_per_cell: 2
    frozen_before_any_target: >-
      Factor base, arity, signed-source convention, integral polynomial model,
      coefficient lifts, valuation field, precision schedule, branch order and
      the independent verifier. All frozen and recorded before any target is
      sampled.
    lift_ensemble: >-
      Ten independent coefficient lifts obtained by adding declared p-multiples
      WITHOUT changing the reduced Semaev system, at increasing randomisation
      amplitude.
    curve_free_null_object: >-
      A random polynomial system matched in variable count, degree, monomial
      support, coefficient-valuation histogram and number of residue roots. It
      contains no curve.
    target_blinding: >-
      Each target is blinded as R + [t]P, with the public mask retained only for
      final verification.
  controls:
    - >-
      EXHAUSTIVE SOURCE TRUTH, BLOCKING. Full enumeration of every valid
      factor-base source tuple per instance through 16-bit subgroup order,
      against which recall is computed. No ratio is read until the
      pruning-erased baseline reproduces this set exactly.
    - >-
      COST BASELINE, THE PRUNING-ERASED DECODER. The identical
      residue-and-Hensel backend visiting every cell of the declared normal fan
      with the tropical membership test REMOVED. This is the denominator of the
      0.70 gate.
    - >-
      FORCED-VALUE NULL, BLOCKING. The ORDER-PERMUTED decoder, the identical
      cell set visited in randomly permuted branch priority. Its visited-branch
      ratio is forced to exactly 1.000 because permuting priority does not
      change which cells are visited. A value away from 1.000 means the
      implementation conflates ordering with pruning and nothing in the run is
      admissible.
    - >-
      NAMED NULL, BLOCKING, CURVE-FREE. The support-and-valuation-matched random
      polynomial system. CONSEQUENCE PRE-STATED, if the elliptic arm does not
      beat it by at least 0.15 absolute on the charged ratio, the pruning is
      solver behaviour and NO statement about elliptic structure, Semaev
      fibres, or the ECDLP may be drawn from this run whatever the ratio is.
    - >-
      PLANTED DEFECT OF KNOWN SIZE, BLOCKING. Disable exactly one branch class
      whose share of the exhaustive source set is computed in advance from the
      truth enumeration. Recall must drop by exactly that computed fraction. An
      instrument that still reports 1.000 cannot detect a lost source and voids
      every recall in the run.
    - >-
      PLANTED SPARSE INITIAL-FORM SYSTEM with a known unique Hensel lift, which
      the decoder must return exactly once with the correct multiplicity.
    - >-
      SOURCE-LABEL PERMUTATION preserving all tropical coordinates. The decoder
      must return the permuted labels, which shows it reads source identity from
      coordinate membership rather than from index order.
    - >-
      MATCHED BASELINES, MANDATORY UNDER RQ-ECDLP-002 CONSTRAINT 3. Pollard rho
      and memory-matched BSGS on the identical instances, in the same operation
      unit and converted base-field operations, with BSGS memory in bits.
  independent_variables:
    - subgroup size, 12, 14 and 16 bits
    - arity m in {3, 4}
    - factor-base size, two per cell
    - decoder arm, tropical, pruning-erased, order-permuted
    - integral lift, ten variants at increasing randomisation amplitude
    - object class, elliptic Semaev system versus matched random polynomial system
  metrics:
    primary:
      - exact source recall against exhaustive truth, dimensionless in [0,1]
      - verified false-source rate after elliptic point-sum checking, dimensionless
      - >-
        charged F_p-operation ratio against the pruning-erased decoder,
        dimensionless, with valuation computation and cell-membership testing
        charged to the tropical side
      - >-
        coefficient of variation of that ratio across the ten lifts,
        dimensionless
      - >-
        elliptic charged ratio minus matched-random-system charged ratio,
        dimensionless absolute difference
    secondary:
      - visited-branch ratio against the order-permuted decoder, forced to 1.000
      - visited-branch ratio against the pruning-erased decoder, reported beside the charged ratio
      - multiplicity recall and certificate pass fraction
      - initial-form cells, residue roots, Hensel branches, failures and retries per target
      - base-field operations, precision-limb operations, serialised bytes, wall time and peak memory
      - factor-base relation rank credit and complete masked-target ambiguity
      - matched rho and BSGS operation and memory counts
  heuristic_under_test: H-TROP-1
  preregistered_prediction:
    quantity: >-
      The charged F_p-operation ratio of the tropical decoder against the
      pruning-erased decoder, and the exact source recall against exhaustive
      truth.
    formula: >-
      ratio = (charged operations with the tropical membership test, including
      the cost of computing valuations and testing cell membership) divided by
      (charged operations of the identical backend visiting every cell of the
      declared normal fan). Predicted at most 0.70. Recall predicted exactly
      1.000000, since completeness is required and pruning may only remove cells
      that provably contain no source.
    source: >-
      Stated in H-ECDLP-5b4ade as an interface requirement derived from
      IDEA-20260814-c3af09, with the baseline disambiguated. It is not derived
      from any theorem and no theorem predicts 0.70; it is a declared bar below
      which the mechanism is not worth pursuing.
  band_non_degeneracy:
    checked_before_freezing: true
    arms_found_degenerate_and_repaired:
      - >-
        SOURCE ARM AMBIGUOUS, AND ONE READING HAS WIDTH ZERO.
        IDEA-20260814-c3af09 pre-registers "median visited-branch ratio versus
        the branch-order-erased decoder" at most 0.70, and its
        baseline_embedding describes that baseline as "with all valuation
        branches tied, or with branch priority randomly permuted... exactly the
        same residue/Hensel solver without tropical pruning". COMPUTED, those
        are two different objects with two different bands. If the baseline
        permutes branch PRIORITY it visits the identical cell set in a different
        order, so the visited-branch COUNT is identical instance by instance and
        the ratio is exactly 1.000 for every target, every size and every arity.
        Under that reading the 0.70 gate can never be met and its complement can
        never be missed, which is a width-zero band. If the baseline removes the
        tropical membership TEST it visits every cell of the normal fan and the
        ratio is the tropical pre-variety's share, genuinely below 1 whenever
        the pre-variety is proper.
      - >-
        REPAIR, COMPUTED, NOT A LOOSENED THRESHOLD. The cost baseline is FIXED
        as the pruning-erased decoder, and the order-permuted decoder is
        retained as a SEPARATE forced-value null whose ratio must come out at
        exactly 1.000. That null now does useful work, it demonstrates that the
        implementation distinguishes ordering from pruning, which is exactly the
        confusion that made the band ambiguous.
      - >-
        SECOND REPAIR, ON THE UNIT. The 0.70 gate is moved from a VISITED-BRANCH
        COUNT to a CHARGED F_p-OPERATION ratio with the tropical membership test
        charged to the tropical side. A branch-count win paid for by a more
        expensive per-branch test is not a win, and charging both sides in the
        same unit is what makes the ratio a cost statement. The branch count is
        retained as a secondary metric reported beside it.
    surviving_bands_and_their_separations:
      - >-
        CHARGED RATIO. Predicted at most 0.70 against a no-effect value of
        1.000, a separation of 0.30 absolute. The pruning-erased baseline can
        take any value in (0, 1] so nothing pins the statistic, and the
        order-permuted null at exactly 1.000 shows the instrument returning the
        no-effect value on demand. NON-DEGENERATE.
      - >-
        RECALL. Predicted exactly 1.000000 against a planted control that forces
        a computed drop equal to the disabled branch class's share of the
        exhaustive source set. Both endpoints are exercised. NON-DEGENERATE.
      - >-
        CURVE-FREE SEPARATION. Predicted at least 0.15 absolute against a
        no-structure value of 0. POWER RULE, if the pooled standard error of the
        difference across cells exceeds 0.05, the cell is declared UNDERPOWERED
        and the number of additional instances required to reach 0.05 under the
        observed variance is reported. The 0.15 threshold is never widened.
      - >-
        LIFT-ENSEMBLE COEFFICIENT OF VARIATION. Predicted at most 0.10 against
        an artifact signature of a monotone collapse toward 1 as randomisation
        amplitude grows. The amplitude ladder gives this a direction, so it is a
        decay control and not a single threshold.
  scale_relevance:
    tier: toy
    justification: >-
      Subgroup orders of 12, 14 and 16 bits, chosen because exhaustive source
      truth is enumerable there and nowhere larger. Every ratio and every recall
      is a statement about those cells. H-TROP-1's theta below 1/2 is
      UNTESTABLE AT REACHABLE SCALE, because validating it needs exhaustive
      truth at sizes this program cannot enumerate, and this contract makes no
      exponent claim and permits none to be read from it.
    correspondence: null
  tail_checks:
    - >-
      Maximum branch count and maximum ambiguity list length at each size,
      reported alongside the medians, so a favourable median cannot hide a tail
      in which the decoder degenerates to enumeration.
    - >-
      Stratify residue roots by Jacobian rank and report the singular stratum
      separately, since Hensel uniqueness does not cover it.
    - >-
      Compare the empirical branch-count CDF and its upper tail against the
      matched random ensemble, not just the means.
    - >-
      Report the single worst lift in the ensemble individually, so a favourable
      coefficient of variation cannot hide one lift on which the advantage
      collapses.
  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 6
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_runs: 8
    maximum_workers: 1
  stopping_rules:
    - >-
      Run the order-permuted forced-value null and the disabled-branch-class
      planted control FIRST. If the first does not return exactly 1.000 or the
      second does not drop recall by its computed fraction, halt. No charged
      ratio is read.
    - >-
      Stop before larger sizes if recall is below 1.000000 on any completed
      cell, if any branch depends on target-specific advice, or if the
      lift-decay control fires.
    - >-
      If the pooled standard error of the elliptic-minus-random difference
      exceeds 0.05, report the cell UNDERPOWERED with the required number of
      additional instances rather than widening the 0.15 threshold.
    - >-
      Stop at 16 bits. Exhaustive truth is not enumerable above it and a ratio
      without truth is not admissible here.
  invalidation_rules:
    - >-
      The charged ratio is computed against the ORDER-PERMUTED decoder rather
      than the pruning-erased one. That baseline has a forced value and its
      ratio is not a cost statement.
    - >-
      The cost of computing valuations and testing cell membership is omitted
      from the tropical side.
    - >-
      The two arms use different solver backends or different cost units, which
      would confound branch selection with implementation.
    - >-
      Known toy logarithms are used to index factor-base points. Source indices
      come only from public coordinate membership.
    - >-
      A lift, chart, branch order or precision is selected after a target is
      seen.
    - >-
      Cells are counted without residue-root multiplicity, which can hide the
      original source enumeration inside one large cell.
    - >-
      Tropical pre-variety membership is treated as tropical variety membership.
      Spurious cells must be retained as such by the residue and Hensel checks.
    - >-
      Any timeout, crash, unavailable software or invalid certificate is
      reported as evidence rather than as an infrastructure outcome, per
      AGENTS.md rule 5.
  success_criterion: >-
    All of the following on the same committed run set. The order-permuted null
    returns exactly 1.000 and the disabled-branch-class control drops recall by
    its computed fraction; exact source recall is 1.000000 and the verified
    false-source rate is 0 on every completed cell; the charged F_p-operation
    ratio against the pruning-erased decoder is at most 0.70 on each of three
    increasing sizes and both arities with identical accepted-source sets; the
    coefficient of variation across ten lifts is at most 0.10 with no monotone
    collapse toward 1; and the elliptic arm beats the support-and-valuation-
    matched random system by at least 0.15 absolute. Only that full combination
    licenses a successor asking about scaling. Anything weaker is reported as
    such and closes this version.
  falsification_criterion: >-
    Any of the following, scoped to the tested curves, subgroup sizes, arities,
    factor-base sizes, lift ensemble, precision schedule and budget. Any valid
    exhaustive source tuple absent from the output, or any accepted tuple
    failing independent point-sum verification, which falsifies the decoder
    interface. Or a charged ratio above 0.70 on any completed size or arity with
    identical accepted-source sets. Or a coefficient of variation above 0.10, or
    a monotone collapse toward 1 with increasing lift amplitude, which makes the
    advantage a coefficient-encoding artifact. Or a matched-random separation
    below 0.15, which makes the pruning solver behaviour and forbids any
    elliptic reading.
  required_artifacts:
    - implementation source at a pinned revision, with the tropical membership test isolated
    - the exhaustive source truth per instance
    - the frozen lift rule, precision schedule and branch order, recorded before any target
    - per-arm per-cell visited-cell lists, residue roots, Hensel branches, failures and retries
    - a replayable point-sum certificate for every accepted tuple
    - the order-permuted forced-value null's output
    - the disabled-branch-class planted control, with its computed expected recall drop stated first
    - the planted sparse initial-form system with its known unique Hensel lift
    - the source-label permutation arm's output
    - the ten lift variants' charged ratios, with the worst reported individually
    - the support-and-valuation-matched random system's full results in the same schema
    - matched rho and memory-matched BSGS operation and memory accounting
    - manifest per AGENTS.md artifact policy, including seeds, environment and dirty-tree state
  assigned_to: executor
  approved_by: null
