experiment:
  id: EXP-ALMIG-001
  hypothesis_id: H-ALMIG-001
  version: 1
  title: Content-addressed migration of Autolab tasks and results
  status: approved
  objective: >-
    Copy the selected Autolab task/result roots into inputs/refs, bind every
    selected path to SHA-256, catalog top-level tasks, and emit a canonical run receipt.
  inputs:
    source_repo: /Volumes/SSD990/autolab
    source_commit: dca04ac33e9ffcfc51edb3ae7e7bd558b1962d95
    source_dirty_expected: true
    roots: [tasks, research, experiments, output, research_ledger.md]
    destination: inputs/refs
  controls:
    - Compare SHA-256 on both source and destination for every selected file.
    - Record source dirty state instead of treating the Git commit as complete provenance.
    - Preserve relative paths and use atomic replacement for differing files.
    - Do not interpret, relabel, or promote historical scientific findings.
  independent_variables: [source_root, relative_path]
  metrics:
    primary: [files_verified, bytes_verified, mismatches]
    secondary: [tasks_cataloged, copied_files, excluded_files, tree_sha256]
  scale_relevance:
    tier: toy
    justification: Migration integrity is scale-independent; scientific content retains its source ceiling.
    correspondence: null
  replication:
    seeds: [deterministic_path_order]
    independent_instances: 1
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 8
    maximum_memory_gb: 4
    maximum_runs: 2
  stopping_rules:
    - Stop invalid if the source root is missing or no files are selected.
    - Stop invalid if a copied file fails its post-copy SHA-256 check.
  invalidation_rules:
    - Any selected destination file is missing or hash-mismatched.
    - Manifest paths escape the declared source or destination roots.
    - Source dirty state is omitted from the receipt.
  success_criterion: >-
    mismatch_count is zero; every source top-level task is cataloged; a
    deterministic file manifest, task catalog, migration summary, and canonical
    run receipt exist.
  falsification_criterion: >-
    One or more selected source files cannot be copied and verified byte-for-byte,
    or the generated catalog omits a top-level task package.
  required_artifacts:
    - inputs/archive_from_autolab/autolab-migration-20260802-r1/file_manifest.jsonl
    - inputs/archive_from_autolab/autolab-migration-20260802-r1/task_catalog.json
    - inputs/archive_from_autolab/autolab-migration-20260802-r1/migration_summary.json
    - experiments/EXP-ALMIG-001/runs/RUN-ALMIG-001-import-r1/manifest.yaml
    - experiments/EXP-ALMIG-001/runs/RUN-ALMIG-001-import-r1/command.txt
    - experiments/EXP-ALMIG-001/runs/RUN-ALMIG-001-import-r1/environment.json
    - experiments/EXP-ALMIG-001/runs/RUN-ALMIG-001-import-r1/stdout.log
    - experiments/EXP-ALMIG-001/runs/RUN-ALMIG-001-import-r1/stderr.log
    - experiments/EXP-ALMIG-001/runs/RUN-ALMIG-001-import-r1/raw-result.json
    - experiments/EXP-ALMIG-001/source-lock.yaml
    - experiments/EXP-ALMIG-001/execution-report.yaml
    - experiments/EXP-ALMIG-001/corrections/CORR-ALMIG-001.yaml
    - coordination/migrations/autolab-20260802/validation_report.yaml
    - docs/autolab-migration-20260802.md
  assigned_to: executor
  approved_by: coordinator
