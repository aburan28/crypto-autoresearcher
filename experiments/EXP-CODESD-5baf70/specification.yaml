experiment:
  id: EXP-CODESD-5baf70
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-bbff88; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-bbff88
  question_id: RQ-SDITH-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Grid measurement of emitted signature bytes and exactly enumerated soundness for a toy MPC-in-the-head
    shell across party counts 2 to 16, repetitions 1 to 4 and two tree shapes, with a null serializer
    and a relation-swap control.
  objective: 'The one uncertainty a run reduces is whether the size-versus-soundness tradeoff that
    governs every parameter choice in this family behaves as its analytic form says when both axes
    are measured rather than computed. Concretely: (i) whether the emitted byte count at each grid
    point exceeds the frozen analytic size formula, by how much, and whether that excess decomposes
    exactly into named serialization components, measured by instrumenting the serializer so the decomposition
    sums to the residue by construction; (ii) whether the Pareto frontier in (exactly enumerated soundness
    bits, measured median bytes) is non-monotone in party count at fixed soundness, measured by constructing
    the frontier over the full grid and listing the dominated points rather than discarding them;
    (iii) whether the residue''s components are paradigm-level or relation-specific, measured by re-running
    the entire grid with a second placeholder relation of different arity and marking every component
    that moves. A run does not reduce uncertainty about any deployed signature size, about any scheme''s
    parameter choice, or about security. It reduces uncertainty about whether a curve the family quotes
    can be reproduced by emitting bytes, and about where the two disagree.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for the declared toy
      shell, framing, placeholder relations and grid, the measured byte distributions, exactly enumerated
      soundness values, residues against the frozen formula, component decompositions and Pareto membership
      were as tabulated, with the null serializer showing zero residue. What does NOT follow: nothing
      about SDitH, FAEST or MQOM signature sizes or parameter choices, none of which have been read;
      no extrapolation of the frontier''s shape to soundness levels beyond the enumerable range; and
      no security consequence, since the run neither attacks nor evaluates any real scheme.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes) freeze the signature contents list, the framing rules, the
      analytic size formula and the grid in a fixture, in that order, before any serializer instrumentation
      exists. STAGE 1 (cost: hours human) implement prover, verifier, serializer and the instrumented
      byte attribution; implement NULL-SERIALIZER with its hand-computable count. STAGE 2 (cost: minutes
      compute) run completeness at every grid point; HALT at any point where honest acceptance is
      not exactly 1. STAGE 3 (cost: minutes compute) run the determinism check and the NULL-SERIALIZER
      residue check; HALT if the residue is nonzero. STAGE 4 (cost: tens of minutes compute) sign
      the declared message count at every grid point, recording byte distributions and component attributions.
      STAGE 5 (cost: up to two core-hours) run the transcript enumeration at every grid point within
      the cap; record which points exceeded it and mark them size-only. STAGE 6 (cost: tens of minutes)
      re-run STAGE 4 and STAGE 5 with NULL-RELATION and mark moving components. STAGE 7 (cost: minutes)
      construct the Pareto frontier over measured points only, list dominated points explicitly, and
      emit the curve with residue decomposition annotated per point.'
    instrument: 'Python 3.11 standard library: hashlib for commitments, itertools for enumeration,
      fractions.Fraction for exact soundness ratios, struct for deterministic serialization, random.Random
      with declared seeds. numpy 2.4.6 for distribution summaries. No Sage, no external cryptographic
      library, no compression library. Executed through harness/runner.py with immutable run records
      under an experiments/EXP-* directory, seeds and the resolved inference block in the manifest.'
    parameters: 'Party count N in {2, 4, 8, 16}; repetitions tau in {1, 2, 3, 4}; tree shape in {tau
      independent trees, one merged tree of tau times N leaves}; placeholder relation in {arity-3
      linear over F_4, arity-5 linear over F_16}; seed length 16 bytes; salt length 16 bytes. Messages
      per grid point: 200, each with a declared seed. Transcript enumeration cap: 5000000 (corruption,
      challenge) pairs per point, with points exceeding it marked size-only. Total grid: 4 times 4
      times 2 times 2 equals 64 points, 12800 signatures, plus enumeration at every point within cap.'
  controls:
  - NULL-SERIALIZER with hand-computable byte count; residue must be exactly zero.
  - NULL-RELATION with different arity; moving components are reclassified as scheme-level.
  - tau equal to 1, where the composition contribution to both axes is trivial and both must reduce
    to hand-computed values.
  - 'Honest-prover completeness check at every grid point: acceptance must be exactly 1 before any
    size is reported, so no size is measured on a broken shell.'
  - 'Byte-length determinism check: re-serializing the same logical signature must produce the identical
    byte string, or the size distribution is measuring nondeterminism.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): NULL-SERIALIZER: the identical logical signature content emitted through
    a deliberately minimal framing whose byte count is hand-computable from (N, tau, seed length,
    field size) alone, run in the same invocation. The residue against this null must be exactly zero
    at every grid point. If it is not, the byte instrumentation is measuring itself and no residue
    decomposition from the signal arm is admissible. A second null, NULL-RELATION, swaps the placeholder
    relation for one of different arity; components of R that move under it are, by definition, not
    paradigm-level, and this is how the attribution in claim (C) is measured rather than asserted.'
  independent_variables:
  - party count N
  - repetition count tau
  - tree shape (independent versus merged)
  - placeholder relation arity (signal versus NULL-RELATION)
  - serializer identity (instrumented versus NULL-SERIALIZER)
  metrics:
    primary:
    - measured signature byte length distribution per grid point
    - exactly enumerated soundness error per grid point
    - residue R equals measured median bytes minus formula bytes
    - component decomposition of R, summing to R exactly
    secondary:
    - Pareto frontier membership and the explicit dominated-point list
    - count of R components moving under NULL-RELATION
    - byte-length variance attributable to opening-size randomness
    - fraction of grid points that exceeded the enumeration cap
    - wall-clock seconds per grid point
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The relative residue rho(N, tau, shape) = R divided by measured median bytes, and the
      count P of Pareto-nondominated points among grid points with a measured soundness coordinate.
    formula: rho = (median_measured_bytes minus formula_bytes) / median_measured_bytes, with formula_bytes
      the frozen analytic expression evaluated at that grid point. Predicted rho is at least 0.02
      at N equal to 2 and decreasing in N. P is predicted to be at least 3; P equal to 1 would mean
      one point dominates everything and there is no tradeoff at this grid, which is the flat falsification
      of claim (A).
    source: Pre-registered in the parent proposal IDEA-20260816-bbff88 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are N up to 16, tau up to 4, field sizes 4 and 16, which places
      every measured soundness value in the range where enumeration is exact and every byte count
      in the hundreds-to-thousands range. Deployed parameters are orders of magnitude away on both
      axes. The transfer assumption is stated and NOT relied upon: the residue decomposition is a
      property of the declared framing, and only the DECOMPOSITION METHOD, not any number, is offered
      as transferable. No extrapolation of the frontier beyond the enumerable soundness range is performed
      or permitted.'
    correspondence: null
  tail_checks:
  - 'tau equal to 1: both axes must reduce to hand-computed values, and the composition components
    of R must be zero.'
  - 'N equal to 2: the smallest shell, where the entire signature is hand-countable byte by byte and
    must match.'
  - 'Merged versus independent tree at tau equal to 1: the two shapes must coincide exactly, since
    there is nothing to merge; a difference is an implementation bug.'
  - 'Grid points exceeding the enumeration cap: verify they carry no soundness coordinate anywhere
    in the emitted tables and are excluded from the frontier.'
  - 'Signatures of identical logical content re-serialized: byte-identical or the run halts.'
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt if NULL-SERIALIZER residue is nonzero at any grid point.
  - Halt if the component decomposition fails to sum to R exactly.
  - Halt if honest-prover completeness is not exactly 1 at any grid point.
  - Stop and report partial coverage if wall-clock exceeds four core-hours, marking uncompleted points
    explicitly rather than omitting them.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The null serializer shows exactly zero residue, the component decomposition sums
    to R exactly at every point, completeness is exactly 1 everywhere, and the run emits a Pareto
    frontier over measured (soundness, bytes) pairs with residue decompositions and the NULL-RELATION
    attribution marks attached to every component.
  falsification_criterion:
  - Nonzero residue against NULL-SERIALIZER, voiding the byte accounting.
  - Component decomposition does not sum to R, voiding the attribution.
  - R is non-positive everywhere, falsifying that serialization overhead is a measurable positive
    quantity.
  - Fewer than three Pareto-nondominated points among measured grid points.
  - Byte length nondeterministic under re-serialization.
  - Fewer than half the grid points complete enumeration within the cap, leaving the soundness axis
    too sparse to support a frontier.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-bbff88
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must approve the frozen analytic size formula and record its provenance as derived-here,
    since comparing against a formula written by the same session is the contract's main weakness
    and must be visible.
  - The signature contents list is a design choice of this shell; the Coordinator must decide whether
    it is defensible as a family member absent any specification.
  - Whether 200 messages per grid point is enough to characterize an opening-size distribution whose
    variance is itself unknown before the run.
  - Whether size-only points should appear on any emitted figure at all, given the risk a reader pairs
    them with a budgeted soundness value.
