experiment:
  id: EXP-PFDR-2c58eb
  hypothesis_id: H-PFDR-26bcee
  question_id: RQ-FBG-001
  idea_id: IDEA-20260830-772cff
  batch_id: BATCH-c64bee
  version: 1
  recorded_at: '2026-09-04'
  drafted_under_task: TASK-20260904-9c61a9
  status: draft
  approved_by: null
  approved_at: null
  assigned_to: executor
  status_note: >-
    Frozen at the design stage; NOT submitted for approval and NOT authorized for
    implementation. Nothing here moves RQ-FBG-001 to any branch of its decision
    target; only a Coordinator decision may do that.
  title: >-
    Measure the rank channel of the factor-base geometry family with a
    discriminator that can actually fire -- the NORMALISED rank advantage scaled
    by the MEASURED headroom, calibrated by a planted base whose overhead is
    exactly 1 -- because the source idea absolute threshold of 0.05 equals its own
    predicted ceiling for the total available headroom, which makes the original
    test width-zero at any measured headroom below that ceiling.
  claim_ceiling: >-
    A CHANNEL-SCOPED statement about yield, coverage and rank under a stated cost
    model. NOT a universal impossibility claim, NOT a claim about any geometry
    solve cost, and NOT a closure of the four surviving classes. A summary saying
    the family is killed without the channel qualifier closes an open claim it has
    no standing to close.
  claim_tier_basis: >-
    Toy tier for every measured input. The two size-free ingredients -- the
    conservation identity and the coverage bound -- are theorems in any finite
    abelian group and transfer mathematically; the rank overhead is NOT size-free
    and is measured only at the tested sizes.
  objective: >-
    Establish, IN THIS ORDER: (1) the symbolic ledger with both optima and their
    constants, as a frozen regression fixture; (2) that the rank instrument can
    SEE both ends of its range, by returning an overhead of exactly 1 on a planted
    base constructed to reach full rank in the minimum number of rows and infinity
    on a planted rank-deficient base; (3) THE MEASURED HEADROOM, which is the
    entire interval within which any geometry rank advantage can lie, reported
    with its interval BEFORE any panel value is read; (4) the normalised rank
    advantage across the geometry panel; (5) the coverage envelope recomputed at
    each cell own operating point, including a ceiling-attaining witness where the
    envelope is maximal; and (6) the CURVE-FREE null, which decides whether any of
    it is a statement about elliptic curves.
  band_non_degeneracy:
    statistic: 'the rank-saturation overhead of a geometry, compared against that of a matched random base'
    null_value: 'equal to the random base value'
    alternative: 'materially below it, i.e. a geometry that reaches full rank in fewer harvested rows'
    computed_check: >-
      THE SOURCE IDEA TWO NUMBERS ARE THE SAME NUMBER. It predicts the random-base
      overhead is at most 1.05 and falsifies the channel on any geometry at least
      0.05 BELOW the random base. But the overhead is at least 1 for EVERY base,
      trivially, because B+1 independent equations require at least B+1 rows. THE
      MAXIMUM POSSIBLE ADVANTAGE IS THEREFORE EXACTLY the random-base overhead
      minus 1, which under the record own prediction is at most 0.05. The
      falsification threshold thus requires the random base to sit EXACTLY at its
      predicted ceiling AND the geometry to sit EXACTLY at the floor; at any
      measured headroom below 0.05 -- the expected case -- the discriminator is
      width-zero and cannot fire in either direction.
    resolution: >-
      The reported statistic becomes the NORMALISED RANK ADVANTAGE: the random-base
      overhead minus the geometry overhead, divided by the random-base overhead
      minus 1. It is 0 under the null and exactly 1 at the maximum attainable
      advantage, so it fires whatever the headroom turns out to be. The MEASURED
      HEADROOM is reported beside it with its interval, and whenever the headroom
      is below the measurement resolution the rank arm is declared UNDERPOWERED
      and channel 3 is reported as NOT CLOSED rather than as closed on a statistic
      that could not have moved. A planted base with overhead exactly 1 is required
      to return a normalised advantage of exactly 1, which demonstrates the
      statistic spans its range.
  inputs:
    rungs: 'group orders of about 2^12, 2^14, 2^16 and 2^18; 4 curves and 4 seeds per rung'
    arity: '3'
    panel: >-
      the declared geometry panel, plus a matched random base at identical
      negation-collapsed effective size drawn in the same invocation, plus a
      ceiling-attaining witness at an operating point where the coverage envelope
      is maximal
    convention: >-
      frozen before any cell runs and identical across every arm compared;
      EFFECTIVE SIZE after negation collapse is used in every denominator, because
      a silent coordinate collision changes the operating point and therefore the
      envelope
    row_budget: 'ten times the required rank before an overhead of infinity is declared'
    harvest_order: 'declared, and the overhead recomputed under a random permutation of the same rows'
  controls:
    - id: CTRL-PLANTED-MINIMUM-OVERHEAD
      row_class: positive_control
      blocking: true
      object: >-
        a base and harvest order constructed so the first B+1 harvested rows are
        independent by construction
      forced_disposition: >-
        FORCED overhead exactly 1 and normalised advantage exactly 1. THIS IS THE
        DYNAMIC-RANGE DEMONSTRATION AT THE FAVOURABLE END and it is blocking:
        without it, "no geometry beats random on rank" is an unfalsifiable
        constant.
    - id: CTRL-PLANTED-RANK-DEFICIENT
      row_class: negative_control
      blocking: true
      object: 'a base with two duplicated elements'
      forced_disposition: >-
        FORCED overhead of infinity within the declared row budget. A pipeline
        that cannot detect a rank deficiency it was handed cannot report the
        random-base overhead at all.
    - id: CTRL-MEASURED-HEADROOM
      row_class: instrument
      blocking: true
      object: 'the random-base overhead minus 1, with its interval'
      forced_disposition: >-
        FORCED: computed and archived BEFORE any panel geometry value is read. It
        is the entire range in which any advantage can lie. A headroom below the
        measurement resolution DECLARES the rank arm UNDERPOWERED and channel 3
        NOT CLOSED.
    - id: CTRL-MATCHED-RANDOM-BASE
      row_class: null_object
      blocking: true
      object: 'a uniformly random base at identical negation-collapsed effective size, at least 12 draws per rung'
      forced_disposition: >-
        The null geometry for every channel, drawn in the same invocation as the
        panel arms so no sampling difference can be mistaken for a geometry
        difference.
    - id: CTRL-CEILING-ATTAINING-WITNESS
      row_class: positive_control
      blocking: true
      object: >-
        a base attaining the coverage ceiling, evaluated at an operating point
        where the envelope is MAXIMAL rather than where it is slack
      forced_disposition: >-
        MUST measure a coverage advantage near the envelope maximum and NEVER
        above it. Without this arm the envelope is tested only where it is slack,
        and a pass there is uninformative.
    - id: CTRL-CLOSED-FORM-TOTAL
      row_class: instrument
      blocking: true
      object: 'the sum of the fibre-size vector per cell'
      forced_disposition: >-
        FORCED deviation exactly 0 against the closed form, with integer counters,
        on every cell. A nonzero deviation is an implementation error and halts
        the battery.
    - id: CTRL-SYMBOLIC-FIXTURE
      row_class: baseline
      blocking: true
      object: 'the two ledger optima with their optimising base size and their exact constants'
      forced_disposition: >-
        FORCED EXACT, checked before any compute and again after. Failure means
        the ledger is mis-derived and nothing downstream stands.
    - id: CTRL-CURVE-FREE-NULL
      row_class: null_object
      blocking: true
      object: >-
        THE MANDATORY CURVE-FREE NULL. The identical conservation, coverage and
        rank-overhead measurement in an ABSTRACT cyclic group of the same order
        with an abstract base of the same size. No curve, no coordinate, no
        summation polynomial.
      forced_disposition: >-
        MEASURED AND REPORTED BESIDE EVERY CURVE ARM, with no predicted value.
        BLOCKING FOR ATTRIBUTION: conservation, the coverage bound and the
        overhead-at-least-1 bound are ALL group-theoretic, so this null is
        EXPECTED to reproduce them. WHEN IT DOES, the closure is a statement about
        factor-base geometry in finite abelian groups and NOT about elliptic
        curves or the ECDLP, and every artifact must say so in its own words.
    - id: CTRL-ARM-LABEL-VERIFICATION
      row_class: instrument
      blocking: true
      object: 'each panel arm constructed geometry against its declared label'
      forced_disposition: >-
        FORCED: verified against the committed source before any cell runs,
        because this corpus records a live harness path whose declared geometry
        and constructed geometry disagree. An arm that is not the geometry its
        label claims voids every number from it.
    - id: PARETO-RHO
      row_class: pareto_control
      blocking: false
      object: 'Pollard rho at 0.886 sqrt(N) with O(1) memory; van Oorschot-Wiener at its tradeoff curve'
      forced_disposition: >-
        The prior column of the ledger. NOTHING HERE IS COMPETITIVE and the
        contract says so: the ledger own floor matches the rho exponent and loses
        on memory, and its realistic variant loses on both.
  independent_variables:
    - 'group order across four rungs'
    - 'geometry arm across the panel, including the matched random null and the curve-free abstract-group arm'
    - 'curve and seed within a rung'
    - 'harvest order in {declared, randomly permuted}'
  metrics:
    primary:
      - 'rank-saturation overhead per arm per rung, with the row budget at which infinity is declared. UNITS: dimensionless ratio, at least 1 by construction'
      - 'MEASURED HEADROOM: random-base overhead minus 1, with its interval. UNITS: dimensionless. ARCHIVED BEFORE ANY PANEL VALUE IS READ.'
      - 'NORMALISED RANK ADVANTAGE per panel arm, and its minimum over the panel. UNITS: dimensionless, 0 at the null and 1 at the maximum attainable'
      - 'coverage advantage per cell against the envelope evaluated at that cell own operating point. UNITS: dimensionless ratio'
      - 'the operating point per cell, since the envelope is a function of it alone. UNITS: dimensionless'
      - 'ceiling-attaining witness advantage at the maximal operating point. UNITS: dimensionless ratio'
      - 'targets processed and solve attempts to the required number of independent relations, per arm. UNITS: counts'
      - 'fitted log-log cost slope per arm with a multiplicity-corrected interval, and the intercept ratios against the random arm. UNITS: dimensionless exponent'
      - 'CURVE-FREE null values for every metric above. UNITS: as above. THE ATTRIBUTION METRICS.'
    secondary:
      - 'closed-form total residual per cell, required exactly 0'
      - 'symbolic fixture pass or fail for both ledger optima'
      - 'overhead recomputed under a random row permutation, and the disagreement if any'
      - 'negation-collapse fraction and effective size per arm'
      - 'peak resident memory and wall time'
      - 'THE COMPUTED RUNG COUNT required for a stated slope separation, reported BEFORE the fit'
  heuristic_under_test: >-
    HEUR-001 (the random-base occupancy law behind the coverage envelope) and
    HEUR-002 (random-base rank saturation) of H-PFDR-26bcee. The rigorous half of
    HEUR-002 -- that the overhead is at least 1 for every base -- carries the
    one-sided conclusion whatever the measurement returns.
  preregistered_prediction:
    quantity: >-
      The measured headroom; the normalised rank advantage minimised over the
      panel; the coverage advantage against the per-cell envelope; the
      ceiling-attaining witness; the fitted slopes; the symbolic fixture; and the
      curve-free null.
    formula: >-
      Random-base overhead PREDICTED at most 1.05, and above 1.2 falsifies
      HEUR-002 and REOPENS the rank channel. MEASURED HEADROOM reported with NO
      predicted value and used to normalise. NORMALISED RANK ADVANTAGE PREDICTED 0
      within the null spread measured across the random draws; a panel value above
      the upper quantile of that spread exhibits a rank advantage. COVERAGE
      ADVANTAGE bounded above by the envelope at each cell own operating point and
      by its universal maximum. CEILING-ATTAINING WITNESS near the envelope
      maximum and never above it. FITTED SLOPES identical across geometries within
      one corrected interval. SYMBOLIC FIXTURE exact, including both constants.
      CURVE-FREE NULL measured with no predicted value.
    source: >-
      H-PFDR-26bcee claims (A) to (H) and predictions P1 to P10. The conservation
      identity, the coverage bound, the envelope maximum and the explicit
      statement that relation rank and independence are NOT captured were read
      verbatim by the drafting coordinator in the committed conservation finding.
      FIXED ON 2026-09-04, BEFORE ANY CELL RUNS, INCLUDING THE HEADROOM
      NORMALISATION AND THE UNDERPOWERED RULE.
  scale_relevance:
    tier: toy
    justification: >-
      Group orders at most about 2^18, generated curves, arity 3. The conservation
      identity and the coverage bound are theorems in any finite abelian group and
      their transfer is MATHEMATICAL rather than extrapolated; the rank overhead is
      a MEASURED quantity at the tested sizes and its asymptotic behaviour is not
      established. Four rungs give wide slope intervals, which is why the required
      rung count is computed and reported before the fit.
    correspondence: 'none; exact enumeration over the complete target set per cell'
  tail_checks:
    - >-
      THE CELL WITH THE SMALLEST MEASURED HEADROOM, reported individually, since
      that is where the normalised advantage is least resolvable and where an
      underpowered determination is most likely.
    - >-
      The single most extreme coverage advantage observed, reported against the
      envelope at its own operating point rather than against the universal
      maximum.
    - >-
      The maximum overhead excess observed across all random draws against the
      tail predicted by the random-matrix rank count, and the fraction of draws
      that never reach full rank within budget, predicted to be 0.
    - >-
      The overhead recomputed after a random permutation of the harvested rows; a
      rank staircase is order-sensitive, and disagreement between the two means
      the overhead is a property of the harvest order rather than of the base and
      is itself reportable.
  replication:
    seeds: ['4 seeds per rung, values recorded in the run package']
    independent_instances: 4
    reason: >-
      Four curves and four seeds per rung, with at least 12 independent random-base
      draws per rung so the null spread of the normalised advantage is MEASURED
      rather than assumed. The null spread is what the panel values are compared
      against.
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 200
    maximum_workers: 1
    notes: >-
      Exact decomposition enumeration over the complete target set plus an
      independence-tracking rank staircase. Peak memory is one count vector of
      length the group order plus a relation matrix of about ten times the base
      size by the base size plus two. NO Groebner basis is built anywhere, so this
      contract cannot meet the boolean lane memory wall; and such a stop would be
      an INFRASTRUCTURE outcome under AGENTS.md rule 5 in any case.
  stages:
    - id: stage-0-symbolic
      purpose: >-
        re-derive the ledger, verify both optima with their optimising base size
        and their exact constants, freeze them as a regression fixture, and
        recompute the envelope maximum INDEPENDENTLY rather than quoting it
      blocking: true
    - id: stage-1-instrument-range
      purpose: >-
        the planted minimum-overhead base and the planted rank-deficient base; the
        statistic must span its range
      blocking: true
    - id: stage-2-headroom
      purpose: >-
        measure the random-base overhead and its interval, archive the headroom,
        and apply the underpowered rule
      blocking: true
    - id: stage-3-rank-panel
      purpose: 'the normalised rank advantage across the panel, against the measured null spread'
    - id: stage-4-coverage
      purpose: >-
        recompute the coverage advantage against the per-cell envelope for every
        cell, including the ceiling-attaining witness at the maximal operating
        point
    - id: stage-5-ledger
      purpose: >-
        instrument the realised relation-collection cost to the required number of
        independent relations across the rungs, and fit log-log slopes with one
        multiplicity correction; the required rung count is computed and reported
        BEFORE the fit
    - id: stage-6-curve-free-null
      purpose: 'the abstract-group arm for every metric; BLOCKING FOR ATTRIBUTION'
      blocking: true
    - id: stage-7-report
      purpose: >-
        write the closure with its obstruction block -- quantity, value, units,
        error bars, runs and scope -- its argument, and its forward guidance
        naming the four surviving classes with their live record identifiers. Any
        channel whose limb failed is reported as NOT closed.
  stopping_rules:
    - 'STOP at stage 0 if the symbolic fixture fails on either optimum.'
    - >-
      STOP at stage 1 if the planted minimum-overhead base does not return exactly
      1, or the planted rank-deficient base does not return infinity within
      budget.
    - >-
      DECLARE UNDERPOWERED at stage 2 if the measured headroom is below the
      measurement resolution. The rank arm still runs, but channel 3 is reported
      as NOT CLOSED and no closure is claimed from it.
    - >-
      Stage 6 is NOT optional and is NOT conditional on any other outcome.
      Reporting any channel without the curve-free null beside it is an
      invalidation, not a shortcut.
    - 'HALT the battery on any cell whose fibre-size total deviates from the closed form.'
  invalidation_rules:
    - >-
      Using an ABSOLUTE threshold on the rank overhead difference INVALIDATES the
      inference: the arithmetic archived in stage 0 shows the total available
      headroom equals the source idea threshold, so an absolute test cannot fire.
      Only the normalised advantage against the measured null spread may be used.
    - >-
      Reading a panel value before the headroom is archived INVALIDATES the run.
    - >-
      Reporting channel 3 as CLOSED when the headroom was below the measurement
      resolution INVALIDATES the artifact.
    - >-
      Testing the coverage envelope only where it is slack, without the
      ceiling-attaining witness at the maximal operating point, INVALIDATES the
      coverage limb.
    - >-
      Using nominal rather than negation-collapsed effective size in any
      denominator INVALIDATES that cell, since the operating point and therefore
      the envelope depend on it.
    - >-
      Reporting any channel without the CURVE-FREE null beside it INVALIDATES the
      report; describing a bound the curve-free null reproduces as a statement
      about elliptic curves or the ECDLP INVALIDATES the artifact.
    - >-
      Quoting the exponent without the cost model INVALIDATES the statement: the
      choice of search and linear-algebra costs is doing most of the work.
    - >-
      Describing the result as a family-scoped kill, or as covering the solve
      channel, INVALIDATES the artifact. The conclusion is CHANNEL-SCOPED and a
      named geometry in the panel has a live filed claim on the solve channel.
    - >-
      Citing this contract as a universal impossibility claim INVALIDATES the
      citation.
  success_criterion: >-
    Decidable from the primary metrics, ALL of: (1) both ledger optima reproduce
    exactly with their optimising base size and constants, and the envelope
    maximum is recomputed independently; (2) the planted minimum-overhead base
    returns exactly 1 and the planted rank-deficient base returns infinity; (3)
    the measured headroom with its interval is archived before any panel value is
    read, and the underpowered rule is applied as written; (4) every arm reports
    its overhead, normalised advantage, coverage advantage against its own
    operating point, and cost-to-rank counts; (5) the ceiling-attaining witness is
    measured at the maximal operating point; (6) the required rung count for a
    stated slope separation is computed and reported before the fit; and (7) the
    CURVE-FREE null is reported beside every channel.
    SUCCESS IS BATTERY INTEGRITY, NOT A CLOSURE. A run that declares the rank arm
    underpowered and channel 3 NOT closed is a FULL SUCCESS.
  falsification_criterion: >-
    ANY of the following, evaluated in this order and reported by name.
    F1 CHANNEL 2 REOPENED: a measured coverage advantage exceeds the envelope at
    its own operating point, or exceeds the universal maximum anywhere.
    F2 CHANNEL 3 REOPENED: the random-base overhead exceeds 1.2 at any rung.
    F3 RANK ADVANTAGE EXISTS: the normalised advantage on some panel geometry
    exceeds the upper quantile of the measured null spread.
    F4 INSTRUMENT DEAD: the planted minimum-overhead base does not return exactly
    1 and a normalised advantage of exactly 1, or the planted rank-deficient base
    does not return infinity.
    F5 UNDERPOWERED, DECLARED: the measured headroom is below the measurement
    resolution. Channel 3 is reported as NOT CLOSED with the headroom attached.
    F6 THE FAMILY IS ALIVE: any geometry fitted slope differs from the random arm
    beyond the corrected interval.
    F7 LEDGER MIS-DERIVED: the symbolic fixture fails.
    F8 ATTRIBUTION DENIED: the curve-free null reproduces every bound. The closure
    is a statement about factor-base geometry in finite abelian groups and NOT
    about elliptic curves; no ECDLP language is permitted anywhere in the
    deliverable.
    F9 ALL LIMBS PASS: the question takes its scoped-kill branch, CHANNEL-SCOPED
    to yield, coverage and rank under the stated cost model, with the four
    surviving classes explicitly left open and each pointing at a live record.
  artifact_package_directory: experiments/EXP-PFDR-2c58eb/runs/RUN-001/
  required_artifacts:
    - 'experiments/EXP-PFDR-2c58eb/runs/RUN-001/headroom-arithmetic.md (the archived demonstration that the total available rank headroom equals the source idea absolute threshold, and the normalisation that replaces it, written BEFORE any panel value is read)'
    - 'experiments/EXP-PFDR-2c58eb/runs/RUN-001/symbolic-fixture.yaml (both ledger optima, their optimising base size, their exact constants, and the independently recomputed envelope maximum)'
    - 'experiments/EXP-PFDR-2c58eb/runs/RUN-001/instrument-range.yaml (the planted minimum-overhead base and the planted rank-deficient base with their dispositions)'
    - 'experiments/EXP-PFDR-2c58eb/runs/RUN-001/headroom.yaml (the random-base overhead and the measured headroom with intervals per rung, archived before stage 3, with its own timestamp and sha256)'
    - 'experiments/EXP-PFDR-2c58eb/runs/RUN-001/rank-panel.yaml (per arm per rung: overhead, normalised advantage, the measured null spread and its quantiles, the permuted-order recomputation)'
    - 'experiments/EXP-PFDR-2c58eb/runs/RUN-001/coverage.yaml (per cell: the operating point, the coverage advantage, the envelope at that operating point, and the ceiling-attaining witness at the maximal point)'
    - 'experiments/EXP-PFDR-2c58eb/runs/RUN-001/ledger.yaml (targets processed and solve attempts to the required relations per arm, fitted slopes with corrected intervals, intercept ratios, and the required rung count computed before the fit)'
    - 'experiments/EXP-PFDR-2c58eb/runs/RUN-001/curve-free-null.yaml (the abstract-group arm for every metric, with an explicit statement of what its agreement licenses and forbids)'
    - 'experiments/EXP-PFDR-2c58eb/runs/RUN-001/arm-label-verification.md (each panel arm constructed geometry checked against its declared label in the committed source)'
    - 'experiments/EXP-PFDR-2c58eb/runs/RUN-001/execution-report.md (stage by stage; the success-criterion checklist; which of F1 to F9 fired; per-file sha256; the inference block; peak memory and wall time; and an explicit statement that RQ-FBG-001 was not moved and that the conclusion is channel-scoped)'
  interpretation_limits:
    - >-
      NOT A UNIVERSAL IMPOSSIBILITY CLAIM. The claim is a bound on three named
      channels under a stated cost model.
    - >-
      CHANNEL-SCOPED, NOT FAMILY-SCOPED. A geometry in the panel has a live filed
      claim on the SOLVE channel, which this contract does not touch and cannot
      close.
    - >-
      Channels 2 and 3 are HEURISTIC-CONDITIONAL and the qualifier travels with
      every downstream citation. Channel 1 alone is unconditional.
    - >-
      THE COST MODEL IS A CHOICE AND IS DOING MOST OF THE WORK. A reader who
      quotes the exponent without the model has been misled.
    - >-
      Every bound here is group-theoretic, so the curve-free null is EXPECTED to
      reproduce it and the closure is expected to be a statement about finite
      abelian groups rather than about elliptic curves. Stated in advance so it
      cannot be softened afterwards.
    - >-
      Four rungs give wide slope intervals. "Identical slopes" may mean
      "underpowered", which is why the required rung count is computed and
      reported before the fit rather than assumed.
    - >-
      The envelope maximum is attained only at one operating point, and the frozen
      convention sits there. That is the MOST favourable point for the effect
      being bounded, which strengthens the conclusion -- but it also means a
      battery run at another convention would see a smaller envelope and could
      mistake convention for geometry.
    - >-
      NOVELTY IS NOT ADJUDICATED. Two of the three bounds are quoted from
      committed records and are not claimed as new; an unresolved internal
      domination check against a cost-expression record that no agent opened is
      carried openly and is the first thing a reviewer should clear.
  dominated_by: >-
    As an ATTACK: none is mounted, so Pollard rho, BSGS, van Oorschot-Wiener and
    the corpus own measured index-calculus position each dominate on time, memory
    and data. As a YIELD STATEMENT: strictly dominated by the committed
    conservation finding, which this contract quotes and does not extend. As a
    COVERAGE STATEMENT: dominated by the existing envelope argument, which already
    derived the maximum for all geometries; this contract adds nothing there and
    says so. As a RANK STATEMENT: no prior row -- the channel is recorded as
    uncaptured with zero measured values. UNRESOLVED: a cost-expression record
    that may dominate the ledger limb was NOT opened by any agent under this task,
    and clearing that check is the first thing a reviewer should do. NOT NULL ON
    ANY AXIS.
  sota_delta: >-
    Zero on every ECDLP cost axis. Content delivered: the first measured values
    for the rank channel, which currently has none, with a one-sided bound and a
    normalised statistic that can fire; a REPLACEMENT for an absolute threshold
    that equals its own predicted ceiling, with the arithmetic archived; the cost
    ledger with both optima and their constants; a curve-free null that decides
    the attribution; and a closure written with an obstruction block rather than
    as a count of null cells.
  id_allocation_provenance: >-
    EXP-PFDR-2c58eb pre-allocated by the tasking Coordinator in
    TASK-20260904-9c61a9 against IDEA-20260830-772cff. Nothing was minted.
  yaml_parse_disclosure: >-
    Written without an interpreter; prose values are folded block scalars or
    quoted scalars; no tabs; no duplicate keys to the author reading. The
    orchestrating session must run a strict parse and tools/validate_ledger.py.
