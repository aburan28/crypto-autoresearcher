# =============================================================================
# EXP-BINSTD-f018f4 -- VERSION 1 (APPROVED by DEC-20260930-210890) frozen
# contract for H-BINSTD-f379d5: Stage 0 arithmetic certificates + product-law
# floor / lattice rounding table; Stage 1 toy reachability/stability contrast
# on named E/F_16 cells over F_{2^20} and F_{2^28} at m=2,3.
#
# Source: IDEA-20260922-6cf862 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Absorbs review defects from
# analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-6cf862.yaml
# (verdict sound_with_corrections): matched-rho label sqrt(pi*r/(4k)); net
# gap sqrt(k)/k^(3/2); floor table in Stage 0; named toy curves.
#
# ZERO RUNS in this design packet. Stages 0-1 authorized for later executor
# TASK-20260930-5500fd. Larger cells / expensive arms deferred. No AUXIN.
# Amazon Bedrock prohibited. packaging_only false.
# =============================================================================
experiment:
  id: EXP-BINSTD-f018f4
  hypothesis_id: H-BINSTD-f379d5
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-6cf862
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Stage 0 subfield-emptiness certificates + phi-stable lattice census +
    product-law floor / lattice rounding table on five c2pnb rows; Stage 1
    reachability/stability contrast on named E/F_16 toy cells at m=2,3
  status: approved
  approved_by: DEC-20260930-210890
  approved_at: '2026-09-30'
  packaging_only: false
  approval:
    approved_by: DEC-20260930-210890
    composing_decision: DEC-20260930-210890
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 only.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stages 0-1 only. Stage 0 is arithmetic certificates (zero scientific
      group walks on deployed curves). Stage 1 is toy reachability/stability
      on the two named cells at m in {2,3}. Larger cells, (d,k) beyond the
      named pair, expensive exhaustive arms on F_{2^28} at m=3 beyond the
      frozen sample floor, and any deployed-curve attack run are NOT authorized.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (A) Certify structural emptiness of the F_q-rational factor base in G on
    the five composite-degree ANSI rows (and mechanically on named toys).
    (B) Record the obstruction as subgroup reachability inside KN-OPEN-020's
    high-degree class. (C) Independently recompute the phi-stable F_{2^16}
    lattice census, the corrected matched-rho closed form sqrt(pi*r/(4k)),
    the product-law floor per row, and the lattice rounding cost; then measure
    reachability/stability contrast on named Stage 1 cells.

  class: cost-model-measurement
  class_note: >-
    Dual class: Stage 0 is proof-oriented arithmetic / cost-model floor table
    (measured-vs-modeled separation for the product-law floor); Stage 1 is
    structure-validation / reachability census on toys. No exponent-moving
    claim. Heuristic-validation fields cover HEUR-BINSTD-f379d5-H1 at toy scale.

  corrections_absorbed:
    matched_rho_label: >-
      Use sqrt(pi*r/(4k)) (CORR-20260922-81aeab). Keep quoted rows 78.1, 94.0,
      125.8, 141.7, 173.6. Source IDEA labelled 0.886 sqrt(r)/sqrt(2k) — that
      LABEL is not used in this frozen contract.
    net_frobenius_quotient_gap: >-
      sqrt(k) on relation-dominated branch; k^(3/2) on LA-dominated; conditional
      on full factor-k relation gain; NO exponent moves. Source IDEA's
      sqrt(k/2) is the wrong-label alternative only.
    product_law_floor: >-
      Stage 0 deliverable: recompute independently the review's per-row floor
      table (plain / orbit-aware) and lattice rounding cost vs floor-optimal l.
    named_toy_cells: >-
      E/F_16 = F_2[t]/(t^4+t+1), A=0, B=t^3+1 (#E=12); over F_{2^20}
      (12*87421) and F_{2^28} (12*22366891); screen gcd(h,r)=1.

  scope:
    included:
      - >-
        Stage 0 (arithmetic; zero scientific trials on deployed curves):
        (i) independent factorisation of T^k-1 over F_{2^16} for
        k in {11,13,17,19,23}; dimension sets; subspace counts;
        (ii) h=q+1-t vs published cofactors; gcd(h,r) for five r
        (re-derived from audit / ANSI-secondary tables);
        (iii) q=2, k=131 baseline reproduction (dims {0,1,130,131});
        (iv) matched-rho closed form sqrt(pi*r/(4k)) vs kept rows;
        (v) product-law floor table per row (plain and orbit-aware) and
        lattice rounding cost (nearest stable F_q-dimension vs floor-optimal l)
        — review precompute frozen as expected values to recompute independently;
        (vi) five reachability-table cells for column "subfield-rational
        factor base" reading STRUCTURALLY EMPTY with emptying fact.
      - >-
        Stage 1 (toy executable cells): named admissible cells
        BIN-TOY-4-5-20 and BIN-TOY-4-5-28; arms (a)(b)(c)(d)+null;
        m in {2,3}; every claimed decomposition certificate-reverified by
        summing on the curve; Booth word-comparison measurement.
    excluded:
      - Any scientific group walk / attack run at deployed m >= 131
      - Toy (d,k) cells beyond the two named cells (unless protocol_amendment)
      - Exhaustive m=3 over all 22366891 G-targets on F_{2^28} (sample floor only)
      - Pricing the coarse-lattice successor seam as a separate table column
        beyond Stage 0 floor/rounding numbers
      - AUXIN / FROB / QSP / SEMBIN edits or values
      - Amazon Bedrock

  inputs:
    proposal: ledger/proposals/IDEA-20260922-6cf862.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-6cf862.yaml
    curve_audit: analysis/binstd-curve-audit/
    hypothesis: ledger/hypotheses/H-BINSTD-f379d5.yaml
    correction_ref: CORR-20260922-81aeab
    optional_code_refs:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
    cells:
      Stage0-c2pnb-rows:
        curves: [c2pnb176v1, c2pnb208w1, c2pnb272w1, c2pnb304w1, c2pnb368w1]
        k: [11, 13, 17, 19, 23]
        q: 65536
      Stage0-baseline-q2-k131:
        q: 2
        k: 131
        expected_dims: [0, 1, 130, 131]
        expected_f: 2
      BIN-TOY-4-5-20: >-
        E/F_16 = F_2[t]/(t^4+t+1), y^2+xy=x^3+(t^3+1), A=0, B=t^3+1
        (encoded 9), #E(F_16)=12, t_trace=5; over F_{2^20} with order
        12*87421 (r=87421 prime, gcd(h,r)=1). ord_5(16)=1 so every
        F_16-dimension available (mimics c2pnb272w1). F_{2^20} as
        F_16[u]/(irreducible quintic) or F_2[z]/(z^20+z^3+1) with F_16 as
        fixed field of z|->z^16. Recompute #E and gcd at setup; halt on
        disagreement.
      BIN-TOY-4-5-28: >-
        Same E/F_16 over F_{2^28}; order 12*22366891 (r=22366891, gcd=1).
        Recompute #E and gcd at setup; halt on disagreement.
    stage0_floor_expected_review_precompute:
      formula: >-
        min over l of m!*2^(N-(m-1)*l) + m*2^(2*l) with N=log2 r; orbit-aware
        variant relations/k, LA/k^2 (same minimisation that reproduces
        KN-FIND-aa2efc ECC2K-130 table)
      note: >-
        Frozen as EXPECTED VALUES for independent recomputation (measured/
        recomputed column vs modeled/expected column — never mixed).
      c2pnb176v1:
        N: 160
        rho_bits: 78.10
        plain_orbit_aware_bits:
          m3: [83.1, 77.9]
          m4: [68.0, 62.5]
          m5: [58.1, 52.3]
      c2pnb208w1:
        N: 192
        rho_bits: 93.98
        plain_orbit_aware_bits:
          m3: [99.1, 93.5]
          m4: [80.8, 74.9]
          m5: [68.8, 62.6]
          m6: [60.3, 53.9]
        lattice_note: >-
          Floor-optimal base ~33-40 bits at m=4-5; stable lattice offers
          F_q-dims {1,3,4,...}=16,48,64 bits — coarseness costs ~8-24 bits
          of base size (the priced rounding cost).
      c2pnb272w1:
        N: 256
        rho_bits: 125.79
        plain_orbit_aware_bits:
          m4: [106.4, 99.9]
          m5: [90.1, 83.3]
      matched_rho_kept_rows_bits: [78.1, 94.0, 125.8, 141.7, 173.6]

  controls:
    - name: positive_cofactor_targets
      object: >-
        Arm (b): same F_q-rational base against targets in the cofactor
        subgroup; MUST produce relations at the counting rate. Without it,
        arm (a)'s zero is uninterpretable.
    - name: null_nonsubfield_curve
      object: >-
        Ordinary binary curve over F_{2^{20}} (and optionally F_{2^{28}}) with
        B not in F_16; phi is not an endomorphism; no stability lattice;
        same base sizes. Any "emptiness" or "stability" signal that survives
        is an instrument artefact.
    - name: size_matched_nonstable_W
      object: >-
        Arm (d): F_16-subspace of matched size that is NOT phi-stable;
        isolates stability from size. Seed 20260926 for random non-stable W.
    - name: baseline_q2_k131
      object: >-
        Setting q=2, k=131 in the (C) formula MUST return f=2 and dims
        {0,1,130,131} (IDEA-20260918-9abf42 / KN-OPEN-095df5 reproduction).
    - name: orbit_union_size_matched
      object: >-
        Orbit-union set of the same size (KN-FIND-47da4e analogue at q=16)
        as the "is coarse lattice an artefact of demanding a subspace" control.
    - name: solver_free_ground_truth
      object: >-
        Every claimed decomposition re-verified by summing on the curve;
        exhaustive census where declared so no solver verdict is trusted
        without enumeration agreeing.
    - name: matched_rho_closed_form
      object: >-
        Modeled comparator sqrt(pi*r/(4k)); never mixed with measured toy
        operation counts in one column.

  independent_variables:
    - curve_cell  # Stage0-row | BIN-TOY-4-5-20 | BIN-TOY-4-5-28 | null_nonsubfield
    - k
    - m
    - arm  # a_EFq_G | b_EFq_cofactor | c_stable_V_W | d_nonsable_matched | null
    - W_dimension
    - W_seed

  metrics:
    primary:
      - independent_factor_count_of_T_k_minus_1_over_F_2_16
      - stable_subspace_dimension_set_per_k
      - cofactor_identity_check_per_curve
      - gcd_cofactor_subgroup_order_per_curve
      - decompositions_G_over_EFq
      - decompositions_cofactor_over_EFq
      - product_law_floor_bits_plain
      - product_law_floor_bits_orbit_aware
      - lattice_rounding_cost_bits
      - matched_rho_closed_form_bits
    secondary:
      - relations_per_attempt_stable_vs_size_matched_random
      - relation_matrix_rank_raw_and_orbit_quotient
      - orbit_canonicalisation_word_comparisons
      - certificate_pass_rate
      - subspace_count_per_k
      - net_frobenius_quotient_gap_relation_branch
      - net_frobenius_quotient_gap_LA_branch
      - peak_rss_bytes
      - wall_s
      - termination_reason

  heuristic_under_test:
    - HEUR-BINSTD-f379d5-H0
    - HEUR-BINSTD-f379d5-H1
    - HEUR-BINSTD-f379d5-H2

  preregistered_prediction:
    quantity: >-
      (A) decompositions_G_over_EFq = 0 on Stage 1 cells; (B) cofactor arm
      strictly positive; (C) factor counts 3,5,17,3,3 and dimension sets as in
      H-BINSTD-f379d5; matched-rho bits = kept rows under sqrt(pi*r/(4k));
      Stage 0 floor table agrees with frozen review precompute within 0.2 bits;
      net gap = sqrt(k) / k^(3/2) (conditional).
    formula: >-
      Emptiness: gcd(h,r)=1 ⇒ G ∩ E(F_q)={O}. Lattice: d=ord_k(2^16),
      f=1+(k-1)/d, dims = subset sums of factor degrees. Rho:
      log2(sqrt(pi*r/(4k))). Floor: min_l [m!*2^(N-(m-1)l) + m*2^(2l)].
      Net (relation): sqrt(k); net (LA): k^(3/2).
    source: >-
      IDEA-20260922-6cf862 (A)(C); analysis/binstd-idea-review-20260926/reviews/
      IDEA-20260922-6cf862.yaml; CORR-20260922-81aeab; KN-FIND-aa2efc floor form
    claim_tier: observational
    measured_vs_modeled: >-
      Stage 0 factorisations, gcd checks, and floor recomputations are
      RECOMPUTED arithmetic (labeled recomputed). Review precompute numbers are
      MODELED/EXPECTED comparators in a separate column — never mixed.
      Matched-rho bits are MODELED from sqrt(pi*r/(4k)). Stage 1 decomposition
      counts, relations-per-attempt, ranks, Booth word comparisons, wall_s,
      peak_rss are MEASURED. Net-gap figures are MODELED from the corrected
      closed forms and labeled conditional.

  scale_relevance:
    tier: toy_plus_deployed_arithmetic
    justification: >-
      Stage 0 is finite arithmetic at deployed parameters (certificates, not
      attack runs). Stage 1 measures at dk in {20,28}. Transfer to deployed
      176..368-bit subgroups is Stage 0 arithmetic only for emptiness/lattice;
      measured Stage 1 rates do not transfer without an explicit assumption
      (stated in H-BINSTD-f379d5-H1 validation plan).
    correspondence: >-
      ord_5(16)=1 on the toy mimics c2pnb272w1 (d=1, every dimension);
      coarser d on other deployed rows is Stage 0 census only in this contract.

  tail_checks:
    - >-
      Smoothest / most-relation-rich Stage 1 target vs counting-model Poisson
      tail (reported, not gated)
    - >-
      Extreme stable W: min/max relations-per-attempt over available dimensions
    - >-
      Screened-out toy cells (failed coprimality) listed explicitly

  optimistic_assumptions:
    - assumption: Full factor-k relation gain for net-gap figures
      bias_direction: >-
        Overstates IC/rho ratio improvement; figures are upper bounds
        conditional on realised gain (S2 rank question deferred)
    - assumption: Balance heuristic B^m/(m! N) attained not merely bounded
      bias_direction: May overstate relations-per-attempt on structured bases
    - assumption: Product-law floor ignores decomposition-oracle wall-clock
      bias_direction: Floor is an arithmetic lower bound, not a prediction of
        attack wall-clock; tables under this assumption are bounds
    - assumption: Rho closed-form comparator without measured group-op timing
      bias_direction: Comparator is modeled, labeled as such

  memory_accounting: >-
    Peak RSS measured on Stage 1. Dominant structures: factor-base list
    (|E(F_16)|=12 or |V_W|), relation matrix (raw and orbit-quotient), and
    for exhaustive arms the target enumeration buffer. Analytic sizes
    reconciled against peak_rss_bytes in the run summary. Stage 0 is
    arithmetic-only (negligible memory; still record peak_rss if a script runs).

  hidden_overhead_honesty: >-
    Per-attempt decomposition cost at arity m>=4 over F_{2^16} is disclosed as
    dominant and NOT estimated here. Gaudry q^{2-2/k} hides at least m! and at
    worst doubly-exponential-in-k constants. Headline asymptotic claim moves
    no exponent; constant-factor net gap is conditional.

  standardized_parameter_sets:
    - name: Stage0-five-c2pnb
      k: [11, 13, 17, 19, 23]
      q: 65536
    - name: Stage0-baseline-ECC2K130-lattice
      q: 2
      k: 131
    - name: Stage1-BIN-TOY-4-5-20
      field_bits: 20
      m: [2, 3]
      enumeration: exhaustive_on_G_and_cofactor
    - name: Stage1-BIN-TOY-4-5-28
      field_bits: 28
      m: [2, 3]
      enumeration: >-
        m=2 exhaustive on G and cofactor; m=3 sampled with
        N_targets >= 100000 (frozen scientific sample floor)
  affected_vs_safe_scope: >-
    AFFECTED (structural / arithmetic only): five composite-degree ANSI
    c2pnb rows under emptiness certificates and lattice census; toy cells
    named above. SAFE / untouched as attack cost: all deployed curves'
    asymptotic security; prime-extension binary rows; any claim of IC beating
    matched rho. No NIST security-level break claimed.

  replication:
    seeds: [20260926]
    independent_instances: 1
    independent_instances_note: >-
      Stage 0 is deterministic arithmetic. Stage 1 arms (a)(b) and stable
      dimensions are deterministic given the cell; non-stable W uses seed
      20260926; m=3 on F_{2^28} uses the same seed for target sampling.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 24
    maximum_workers: 1
  budget_note: >-
    Advisory. Stage 0 expected seconds; Stage 1 F_{2^20} exhaustive m=2
    minutes and m=3 tens of minutes in pure Python (review estimate);
    F_{2^28} m=2 larger but bounded by wall_clock_seconds_per_run;
    F_{2^28} m=3 uses frozen sample floor >=1e5, not full exhaustive.
    Null total_cpu_hours is valid under research-budget-policy. Scientific
    sample counts above are frozen; advisory wall-clock does not truncate
    them without recording failed_infrastructure.

  stopping_rules:
    - Stop Stage 0 after certificate file + floor table + lattice census artifacts are written.
    - Stop Stage 1 after both named cells complete declared arms at declared m (or hit wall clock with failed_infrastructure).
    - A timeout/crash is failed_infrastructure, never a mathematical miss.
    - If Stage 1 finds a certified G-target decomposition over E(F_q), halt further arms and archive the counterexample certificate before any decision.
    - If Stage 0 lattice factorisation disagrees with (C), halt Stage 1 and archive the disagreement.

  invalidation_rules:
    - Missing required artifacts invalidate the run.
    - Overwriting an existing run record invalidates the procedure.
    - Changing success/falsification criteria after observing outcomes without a versioned protocol_amendment invalidates interpretation.
    - Mixing measured/recomputed and modeled/expected numbers in one reported column invalidates the floor / rho tables.
    - Reading AUXIN/FROB/QSP run values into this experiment invalidates scope.
    - Any claim of deployed-curve break or exponent move invalidates the report.
    - Using a toy cell that fails gcd(h,r)=1 as a test of (A) without disclosing screening failure invalidates the emptiness reading.
    - Labelling net gap as unconditional (dropping the factor-k-gain condition) invalidates the asymptotic interpretation.

  success_criterion: >-
    Stage 0: certificate artifacts present; factor counts 3,5,17,3,3;
    dimension sets match H-BINSTD-f379d5; cofactor identities and gcd=1 on all
    five rows; q=2 k=131 baseline dims {0,1,130,131}; matched-rho closed form
    reproduces kept rows within 0.05 bits; product-law floor recomputation
    agrees with frozen review precompute within 0.2 bits; lattice rounding
    cost reported per row. Stage 1: on BIN-TOY-4-5-20, arm (a) returns 0 for
    all G-targets at m in {2,3}; arm (b) strictly positive; arms (c)/(d)/null
    report relations-per-attempt and ranks; certificates pass re-verification;
    Booth comparisons <= 3k. On BIN-TOY-4-5-28, same for m=2 exhaustive and
    m=3 at sample floor. All primary metrics decidable from predefined outputs.

  falsification_criterion: >-
    Any certified G-target decomposition over E(F_q); OR Stage 0 factorisation
    / dimension disagreement; OR matched-rho closed form off by >0.05 bits from
    kept rows; OR positive-control arm (b) returns 0; OR Booth cost superlinear
    in k; OR floor recomputation off by >0.2 bits from frozen review numbers
    without an identified bug in the recomputation that is fixed and re-run.

  required_artifacts:
    - experiments/EXP-BINSTD-f018f4/runs/RUN-*/raw-result.json
    - experiments/EXP-BINSTD-f018f4/runs/RUN-*/manifest.yaml
    - experiments/EXP-BINSTD-f018f4/runs/RUN-*/stdout.txt
    - stage0/certificate.yaml
    - stage0/lattice-census.yaml
    - stage0/product-law-floor-table.yaml
    - stage0/matched-rho-closed-form.yaml
    - stage0/reachability-table-cells.yaml
    - stage1/metrics-summary.json
    - stage1/coprimality-screen.yaml
    - implementation/ (gf2n + curve + census + Booth + Stage 0 scripts)

  assigned_to: executor
  executor_handoff: TASK-20260930-5500fd
  snapshot_task: TASK-20260930-7d5486

  cost_model_disclosure: >-
    Recomputed: Stage 0 factorisations, gcd, floor table, lattice rounding.
    Modeled/expected: review precompute floor numbers; matched-rho
    sqrt(pi*r/(4k)); conditional net-gap sqrt(k)/k^(3/2). Measured: Stage 1
    decomposition counts, ranks, Booth comparisons, wall_s, peak_rss.
    Optimistic assumptions listed above. Floor tables under those assumptions
    are bounds, not predictions of wall-clock attack cost.
