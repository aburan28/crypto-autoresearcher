experiment:
  id: EXP-PFDR-3d4706
  hypothesis_id: H-PFDR-df0127
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-2c45e2
  version: 1
  status: draft
  claim_tier: toy
  retrospective: false
  retrospective_note: >-
    PRE-REGISTRATION. No run exists. Thresholds and predictions are frozen before
    execution and change only by a versioned protocol_amendment filed BEFORE the
    affected data is generated. NOTHING HERE IS A MEASUREMENT.

  title: >-
    Rank deficits of the summation Macaulay matrix at the degeneration loci - the
    magnitude rather than the sign, contrasted against a matched curve-free system
    with a coefficient block of the same size, with the basis-size arm gated on a
    measured noise floor.

  objective: >-
    Measure how far the Macaulay rank actually drops at each degeneration locus and
    decide whether that drop is an elliptic-curve fact or is what specialising any
    polynomially-parametrised family with a vanishing coefficient block of the same
    size produces. The SIGN of the drop is fixed by lower semi-continuity of matrix
    rank and is therefore verified as an implementation check rather than tested. The
    experiment separately measures the run-to-run dispersion of basis size before
    comparing basis sizes at all, because the campaign's two existing data points
    carry no dispersion estimate.

  inputs:
    elliptic_arm:
      system: >-
        The summation system at arity 3, and at arity 4 if budget allows, in BOTH the
        factor-base-free and the factor-base-bearing formulation, reported separately
        and NEVER pooled, since the factor-base-bearing system's solving degree is
        pinned by the factor-base size rather than by the curve.
      loci: >-
        The eight known loci - the two trivial coefficient factors and the six
        weight-12 forms with coefficient blocks of sizes 48, 36, 6, 6, 4 and 1.
      degrees: >-
        Every degree up to and including the degree at which the rank profile
        stabilises. STABILISATION MUST BE DEMONSTRATED, not assumed; a conclusion
        drawn below it is about a truncation.
      generic_point: >-
        The rank over the function field of the two coefficients, plus a substitution
        check at coefficient pairs outside all eight loci.
    curve_free_matched_arm:
      construction: >-
        A system with the SAME variables, the SAME monomial support and coefficients
        polynomial in two indeterminates of the same degrees, in which a block of
        EXACTLY the same size as the elliptic locus under comparison - 48, then 36,
        then 6, then 4, then 1 - is deliberately forced to vanish on a declared
        codimension-one locus. NO ELLIPTIC CURVE, NO GROUP LAW AND NO SUMMATION
        POLYNOMIAL appears in its construction. At least 20 independent draws per
        block size.
      quantity: >-
        The rank deficit in rows at the planted locus, per degree, and its
        draw-to-draw spread across the 20 draws.
      purpose: >-
        THE BINDING CURVE-FREE NULL AND THE PRIMARY DISCRIMINATOR OF THIS CONTRACT.
        The sign of the deficit is identical on both arms by theorem; only the
        MAGNITUDE can separate them.
    generic_maximality_arm:
      construction: '1000 random coefficient pairs drawn from a recorded seed'
      quantity: 'the count of pairs whose rank exceeds the computed generic rank, predicted exactly 0'
    point_count_arm:
      construction: >-
        The count of rational solutions of the summation system inside a fixed window,
        at each of the eight loci and at generic points.
      purpose: >-
        THE PROVES-TOO-MUCH CONTROL. Point counts are NOT ranks and are NOT
        semi-continuous, so the argument must FAIL to give a direction here. An
        argument that proved a direction for point counts has proved too much and is
        wrong somewhere unexamined.
    basis_size_arm:
      noise_floor_first: >-
        BLOCKING. The run-to-run distribution of basis size and solve time is measured
        FIRST on repeated identical inputs, at least 20 repeats per configuration, and
        the minimum detectable effect is computed and FROZEN before any locus
        comparison is made. The campaign's two committed data points - plus 1.02
        percent over 6 curves at one trivial locus and plus 3.41 percent over 4 curves
        at the other, against 12 generic curves - carry no dispersion estimate at all,
        which is precisely the gap this gate closes.
      comparison: >-
        Basis size and the max-degree proxy at each locus against generic, at the
        reference prime and at one prime above 2 to the 20, at three factor-base
        densities, REPORTED PER LOCUS AND NEVER POOLED.
      naming: >-
        The max-degree proxy is reported under its true name. The committed harness
        annotates it in source as a proxy and NOT the degree of regularity, and this
        contract measures the Macaulay rank directly for the quantity the theorem is
        actually about.

  controls:
  - >-
    C-CURVEFREE-MATCHED (BINDING, THE PRIMARY DISCRIMINATOR). The matched curve-free
    system with a planted vanishing block of the same size. If its rank deficit is
    comparable to the elliptic one - within a factor of 2 of the elliptic deficit, or
    inside its own draw-to-draw spread - then the deficit is what any coefficient-block
    vanishing produces, it carries NO ELLIPTIC-CURVE CONTENT, and NO STATEMENT ABOUT
    ELLIPTIC CURVES OR THE ECDLP MAY BE QUOTED FROM THE RANK ARM in either direction.
    The record must say so in those words.
  - >-
    C-GENERIC-MAXIMAL (BLOCKING). 1000 random coefficient pairs, none of which may
    exceed the computed generic rank. A pair exceeding it means the generic computation
    was done at a special point and everything is void. This control HAS real range and
    catches the most likely implementation error.
  - >-
    C-NOISE-FLOOR (BLOCKING FOR THE BASIS-SIZE ARM). Run-to-run dispersion measured on
    repeated identical inputs before any locus comparison, with the minimum detectable
    effect computed and frozen.
  - >-
    C-POINT-COUNT (PROVES-TOO-MUCH). Rational solution counts in a fixed window must
    show NO consistent direction across the eight loci.
  - >-
    C-ORDER. Two monomial orders. The rank of a fixed-degree Macaulay matrix on a fixed
    monomial basis is order-independent, so a disagreement is an implementation error.
  - >-
    C-STABILISATION. The rank profile must be shown to have stabilised before any
    conclusion is drawn from it.
  - >-
    C-DENSITY. The rational-point density of the generic open set is COMPUTED - the
    eight loci carry about eight times the prime, out of the prime squared, coefficient
    pairs, that is about eight over the prime - and reported as a number rather than
    described as dense.
  - >-
    C-CITATION. Every external theorem is cited with a theorem number and an honest
    opened or not-opened status. An unmarked recollection presented as a checked source
    voids the citation and drops the record's status.
  - >-
    C-NULL-LOCUS (IMPLEMENTATION CHECK ONLY, LABELLED AS SUCH). Ten random weight-12
    loci, at which the rank must be generic. RECORDED WITH ITS LIMIT - a random
    weight-12 locus passes through generic points of the coefficient plane and is
    therefore generic by construction, so this control cannot fail except through a
    coding error and is NOT a discriminator. It is retained for that narrow purpose and
    is never cited as evidence that a difference is real.

  independent_variables:
  - arm - elliptic, curve_free_matched, generic_maximality, point_count
  - locus, the eight known loci and the planted curve-free loci at matched block sizes
  - degree, up to stabilisation
  - arity in {3, 4}
  - formulation - factor-base-free or factor-base-bearing
  - monomial order, two
  - prime, two

  metrics:
    primary:
    - >-
      rank_deficit, in ROWS, equal to the generic Macaulay rank minus the rank at the
      locus, per locus per degree per arm.
    - >-
      deficit_contrast, in rows, equal to the elliptic rank deficit minus the matched
      curve-free rank deficit at the same block size, together with the curve-free
      arm's draw-to-draw spread over 20 draws.
    - >-
      basis_size_ratio, dimensionless, per locus against generic, reported ONLY
      alongside the frozen minimum detectable effect from C-NOISE-FLOOR.
    secondary:
    - Macaulay rank profile per locus per arity per degree, both engines
    - Hilbert function of the quotient per locus, coefficientwise
    - non-zero entry count per locus, and the contrast table against rank
    - rational solution count in a fixed window per locus, and its direction
    - generic-maximality violation count over 1000 random pairs, predicted 0
    - the computed rational-point density of the degeneration set
    - the max-degree proxy per locus per prime, reported under its true name
    - run-to-run dispersion of basis size and solve time on repeated identical inputs
    - citation status per external theorem, with theorem numbers
    - characteristic-specific rank drops, reported separately
    - wall time and peak resident memory, INFRASTRUCTURE ONLY

  heuristic_under_test: HEUR-002

  preregistered_prediction:
    quantity: >-
      The rank deficit magnitude at each locus, and its contrast against the matched
      curve-free deficit.
    formula: >-
      rank_deficit at least 1 row at the 48-block locus at some degree below
      stabilisation. deficit_contrast at least a factor of 2 above the curve-free
      draw-to-draw spread if the effect is elliptic; consistent with zero if it is
      block vanishing. basis_size_ratio at least 1 minus the frozen minimum detectable
      effect at every locus.
    source: >-
      The SIGN of the deficit is a theorem - lower semi-continuity of matrix rank over
      a polynomial base, by minors - and is therefore verified as an implementation
      check and NOT predicted as a finding. The MAGNITUDE and the contrast are not
      predicted by any theorem available to this program and are exactly what the
      experiment measures. The basis-size band is not stated here because it is set by
      C-NOISE-FLOOR before the comparison runs; declaring it in advance without the
      measurement would be the error this contract exists to avoid.

  scale_relevance:
    tier: toy
    justification: >-
      Arity 3 and, budget permitting, arity 4, at a reference prime of about 10 to 12
      bits and one prime above 2 to the 20, at degrees up to rank stabilisation. The
      symbolic rank over the function field carries no scale. The tested scope is
      exactly that.
    correspondence: null

  tail_checks:
  - >-
    The highest degree at which the rank has NOT yet stabilised is reported, since a
    conclusion drawn before stabilisation is the most likely error mode.
  - >-
    The locus with the largest coefficient block should show the largest deficit if any
    deficit exists. A large deficit at the single-coefficient locus with none at the
    48-coefficient locus would refute the mechanism and is reported rather than
    absorbed.

  replication:
    seeds: [20260904, 20260905]
    independent_instances: 2
    seeds_policy: >-
      The symbolic elliptic arm is deterministic and uses no seed; reproducibility is by
      re-derivation in a second engine. The curve-free draws, the 1000 random
      coefficient pairs, the ten random loci and the repeated-input ordering are derived
      from a master seed recorded in the manifest and are reproducible from that seed
      and an index. Seeds are fixed before execution and never redrawn after an outcome
      is seen.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 16
    maximum_runs: 6
    maximum_workers: 1
    budget_note: >-
      Symbolic rank over the function field at arity 4 is the only heavy step; the
      arity-3 arm and the modular arms are cheap, and the theorem's verification does
      not require the arity-4 arm. The basis-size arm is separable and is gated on host
      load; a degraded timing run is an infrastructure receipt, never a result.

  stopping_rules:
  - >-
    SR1 BLOCKING. Verify symbolically that the Macaulay entries are polynomial in the
    two coefficients and pin the construction, before any rank is computed.
  - >-
    SR2 BLOCKING. C-GENERIC-MAXIMAL runs before any locus rank is reported. A single
    violation halts the run.
  - >-
    SR3 BLOCKING FOR THE BASIS-SIZE ARM. C-NOISE-FLOOR runs and the minimum detectable
    effect is frozen before any basis-size comparison.
  - >-
    SR4 BLOCKING. C-STABILISATION - no conclusion is drawn at degrees below the
    stabilisation degree, and the stabilisation degree is reported.
  - >-
    SR5. If any locus rank strictly EXCEEDS the generic rank, the run STOPS, re-checks
    whether the generic point was itself special, and reproduces in a second engine
    before recording anything - since that outcome contradicts the theorem and an
    implementation defect is overwhelmingly the likelier cause.
  - >-
    SR6. The basis-size arm is gated on host load and a degraded run is recorded as an
    infrastructure receipt, never as a result.
  - >-
    SR7. Budget exhaustion stops the run and reports the arities and degrees completed.

  invalidation_rules:
  - >-
    A random coefficient pair in C-GENERIC-MAXIMAL exceeds the computed generic rank.
  - >-
    The two monomial orders disagree on the rank of a fixed-degree Macaulay matrix on a
    fixed monomial basis.
  - >-
    A conclusion is drawn at a degree below the demonstrated stabilisation degree.
  - >-
    A basis-size comparison is reported without the frozen minimum detectable effect
    alongside it.
  - >-
    The factor-base-free and factor-base-bearing results are pooled anywhere.
  - >-
    C-NULL-LOCUS is cited as evidence that a difference is real rather than as an
    implementation check.
  - >-
    An external theorem is cited without a theorem number and an opened status.
  - >-
    A timeout, crash or memory exhaustion is recorded as failed_infrastructure and is
    NEVER counted as negative mathematical evidence.

  success_criterion: >-
    C-GENERIC-MAXIMAL, C-ORDER, C-STABILISATION and C-NOISE-FLOOR all discharged; a
    strictly positive rank deficit at the largest-block locus; deficit_contrast at least
    a factor of 2 above the curve-free draw-to-draw spread; basis_size_ratio at least 1
    minus the frozen minimum detectable effect at every locus; point counts showing no
    consistent direction; and the density of the degeneration set computed as a number.

  falsification_criterion: >-
    THE DECISION RULE, FIXED BEFORE EXECUTION. (F1) THE MATCHED CURVE-FREE SYSTEM SHOWS
    A COMPARABLE RANK DEFICIT - within a factor of 2 of the elliptic deficit or inside
    its own draw-to-draw spread - so the deficit is what any coefficient-block vanishing
    produces, it carries NO ELLIPTIC-CURVE CONTENT, and no statement about elliptic
    curves or the ECDLP may be quoted from the rank arm in either direction. The record
    must state that in those words. (F2) Basis size at any locus strictly SMALLER than
    generic beyond the frozen minimum detectable effect - the practical reading of the
    theorem fails, the monotonicity from quotient size to basis size is not what it
    appears, and the lane has a direction-correct effect to chase. This would reopen the
    algebraic half. (F3) A rank strictly EXCEEDING the generic rank - the theorem is
    contradicted; handled under SR5, and an implementation defect is the first
    hypothesis. (F4) A random pair in C-GENERIC-MAXIMAL exceeds the generic rank -
    everything is void. (F5) Rational-point counts move consistently in one direction
    across all eight loci - either the escape classification is wrong or the point
    counting is, and both are checked before either is believed. (F6) The cited
    semi-continuity theorems cannot be verified at stated theorem numbers - the external
    support is unconfirmed and the record's status drops to unverified rather than
    being asserted anyway.

  required_artifacts:
  - Macaulay rank profile per locus per arity per degree, from both engines and both orders
  - rank_deficit per locus per degree, in rows
  - curve-free matched-block deficits for all 20 draws per block size, with the spread
  - deficit_contrast per matched block size
  - Hilbert function of the quotient per locus
  - non-zero entry count per locus and the rank contrast table
  - rational solution count in a fixed window per locus, with the direction summary
  - generic-maximality violation count over 1000 random pairs
  - the computed rational-point density of the degeneration set, as a number
  - run-to-run dispersion of basis size and solve time on repeated identical inputs, and the frozen minimum detectable effect
  - basis size and max-degree proxy per locus per prime per factor-base density, reported under their true names and never pooled
  - the demonstrated rank stabilisation degree
  - citation status per external theorem, with theorem numbers and opened status
  - characteristic-specific rank drops, reported separately from the characteristic-zero statement
  - command, environment, seeds, engine names and versions, and resource measurements

  limitations:
  - >-
    THE SIGN OF THE INEQUALITY IS A THEOREM AND IS NOT A TEST. Lower semi-continuity of
    matrix rank over a polynomial base makes a rank exceeding the generic rank
    impossible, so the source idea's eight-of-eight prediction has a band of width zero
    and would confirm linear algebra rather than a mechanism. The design was changed to
    measure the deficit MAGNITUDE and its contrast against a matched curve-free system.
    Recorded in H-PFDR-df0127 band_non_degeneracy.
  - >-
    THE SOURCE IDEA'S OWN NULL IS ALSO WIDTH-ZERO AND IS DEMOTED. Ten random weight-12
    loci pass through generic points of the coefficient plane and are generic by
    construction, so that control cannot fail except through a coding error. It is
    retained as an implementation check under that name and never as a discriminator.
  - >-
    THE COMMITTED EVIDENCE IS TWO DATA POINTS, NOT ONE, AND NEITHER HAS A DISPERSION
    ESTIMATE. TASK-20260904-5423ad read the committed red-team notes and reports basis
    size moving plus 1.02 percent over 6 curves at one trivial locus and plus 3.41
    percent over 4 curves at the other, against 12 generic curves, with Groebner-seconds
    moving minus 0.44 and minus 0.67 percent, and with the record stating explicitly
    that no dispersion estimate is reported for any arm. The source idea describes the
    plus 3.41 percent figure as the one existing data point, which UNDERSTATES the
    support. C-NOISE-FLOOR exists because a direction with no dispersion estimate is not
    a measurement.
  - >-
    THE STEP FROM ALGEBRA SIZE TO WALL-CLOCK IS EMPIRICAL AND WEAK. The theorem bounds
    Hilbert functions, degrees of regularity, Betti numbers and reduced basis sizes; the
    step to time is HEUR-002 and it is the named weak link, not a hidden one.
  - >-
    THE CLOSURE IS SCOPED TO RANK-DEFINED FUNCTIONALS. It does not close relation
    density, factorisation type, the automorphism discount, sparse-matrix constants, or
    the multi-instance model, and the escape list is forward guidance rather than an
    afterthought.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. Whether the rank deficit
    has any consequence at cryptographic parameters is not testable here or by any
    reachable experiment - the factor-base-bearing Macaulay matrix at deployed
    factor-base sizes exceeds any budget this program has, and in that formulation the
    solving degree is pinned by the factor-base size rather than by the curve, so the
    quantity that would matter is both unmeasurable and, by the campaign's own
    argument, insensitive to the effect.
  - >-
    Generic over a finite field is not generic over an algebraically closed field, and
    the density is computed rather than invoked. At very small primes the argument would
    be vacuous.
  - >-
    NO COST MODEL, NO EXPONENT, NO ATTACK. This is a statement about a family.

  assigned_to: executor
  approved_by: null
