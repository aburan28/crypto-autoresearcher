    "methods": {
      "historical_audit": "Reconstruct and save exact p,a,b,P,Q,n,seed,zeta,B,ordered x bases, raw unsigned0/1 rows and target trace from source-pinned routines. Independently hash all arrays and compare every committed receipt field and every inline historical number. Provenance status distinguishes byte-archived matrix, deterministic replay matching receipt, and inline-only reconstruction. No replay output is relabelled an original matrix artifact. Exceptions such as truncated-orbit commutation indexing become retained historical reproduction outcomes; mathematical diagnostics continue on already reconstructed inputs without calling the failing reporting wrapper.",
      "membership_and_lambda": "Independently verify E order H, prime n, nP=O and Q in<P>. For each canonical y=min(y,p-y) lift, test n*Pi=O. Original logs are defined only on subgroup members; outside points remain explicitly out_of_scope for the literal M1 rather than assigned fake logs. Solve L²+L+1 modn and select the unique root with[L]P=phi(P); test phi(P) subgroup membership,lambda³=1 and lambda!=1. Both roots and the wrong-root residual are recorded. If neither root matches, record an exact premise failure with point certificate. Compute checker-only brute-force log table by repeated additionP over alln elements; do not expose it to collection or solves.",
      "orbit_map": "Record actual geometric x-orbit graph, all 1/2/3-position intersections, missing mates, fixed points and duplicate lifts. Canonical signs epsilon satisfy phi(Pi)=epsilon*Pj, so logPj=epsilon*lambda*logPi. Components use all phi and phi² links among available points, with signed lambda-power weights relative to least-index representative. Check cycle consistency. Columns outside subgroup are not silently folded into<P>. B/3 appears only as a clearly fractional source model unless complete length3 orbits are verified. Actual fold T has one representative per nonzero component and explicit zero-log columns.",
      "projected_diagnostic": "If some original lifts lie outside<P>, retain literal M1 failure-of-premise and separately project allPi by cofactorh=H/n when gcd(h,n)=1. Verify n*[h]Pi=O, merge only exact± equal projected points with signs, retain zero projections, and set projected right-hand side h*k. Projection, possible dimension change and all costs are disclosed. This supplementary valid subgroup system does not count as proving the original full-base logarithm premise. If gcd(h,n)!=1, no projection shortcut: keep primary algebra-inapplicable status; no replacement fixture.",
      "displacement": "Save four separately named quantities overF_n: historical implemented alpha=rank(M_sq-Z*M_sq*Z^-1) for firstB rows, or rank(MZ-M) if fewer thanB; historical specified alpha_gain=rank([M,ZM])-rank(M) only when dimensions conform; actual Sylvester rank rank(Z_row*M-M*Z_col) with independently declared row/column action; and classical nilpotent-shift rank. Square commutator requires a real row permutation, not proof from one shifted-row membership. Historical index-triple Z treats residual columns fixed; label it artificial when it disagrees with geometric orbit map. Never merge these alpha definitions.",
      "rank_and_equations": "For raw historical incidence M report dimensions, exactrank,nnz,nonzero rows and literal deficit(B-1)-rank(M), even if negative. It is not automatically a homogeneous logarithm relation. Independently retain exact signed multiplicities and target scalark for each verified actual decomposition: A*l=b overF_n. Verify all point identities and checker residuals. Report rank(A),rank([A|b]),full inhomogeneous targetB or actualfold dimensiond, and homogeneous elimination rows b0*Ai-bi*A0 for firstnonzerob0, with correcttargetB-1/d-1. If allb=0 retain homogeneous convention explicitly. The source determinacy/rank claim is evaluated per labelled matrix, never using a rank-qualified synthetic matrix as a real one.",
      "actual_decomposition": "Use exact original m2 search and an independent full signed completion checker. For m2 iterate firstsignedpoint and lookup target-minus-point by full coordinates; for m3 iterate two signed points in fixed base-index/sign order and lookup the third. Repeats retain integer multiplicity; opposite signs can cancel. Verify original curve sum equals target before emitting any row. AP arm restricts distinct sorted x supports to integer AP with d1..64 and no wrap; it uses the same signed completion and target law. Unrestricted x-interval arm also reported to distinguish base shape from support restriction.",
      "fold_and_solver": "Compute Aq=A*T with exact sparse field arithmetic and verify every folded row/RHS. Row count is R, column countd; never assert it is automatically(B/3)x(B/3). Select firstd linearly independent rows in arrival order by charged exact elimination, and solve squareAq*x=bq; if rank<d retain rank_unattained and do not pad. Dense independent RREF verifies solution and residuals in all rows. Full-space comparator uses originalA plus publicly derived orbit constraints to reach unique determination, charging their construction; omit redundant rows only with a recorded certificate. Also report the algebra-only fullB versus singled cost models without treating them as measured solves.",
      "wiedemann": "For square invertible matrixC and its actual RHSb, use scalar Wiedemann with5 frozen projection seeds. Drawu uniformlyF_n^d by SHA256 rejection. Record s_i=u^T*C^i*b fori0..2d inclusive, use exact Berlekamp–Massey, candidatex=-g(0)^-1*(g(C)-g(0)I)/C*b wheng(0)!=0, then verifyCx=b. A failed projection records all work and tries the next of5; no truth-assisted projection choice. Empty/noninvertible/g(0)=0 cases explicit. Matrix-vector ops include every multiply/add, Krylov storage, BM scalar arithmetic and final verification. Independent dense solve must agree, but its cost is separate verification and full audit totals.",
      "source_cost_models": "At every historicalB emit source structuredalpha²*B*log2B and historicalceil-log variant separately, sourcequotient2*(B/3)² and full2B², and actual dimension/nnz model2*d*nnz(Aq). Primary literal M2ratio uses source structured model divided by measured quotient Wiedemann field-multiplication counts, with modeled/modelled ratio additionally reported. Numerator remains model-only: no superfast solver implementing it has been supplied. Ifalpha0, literal model0 is shown as invalid zero-cost estimate alongside positive measured setup/solve, not repaired silently. Block diagonalization is the same orbit-coordinate map on the informative space; no second factor3 or9 is multiplied.",
      "full_costs": "Charge actual fixture/base construction, subgroup/projection checks needed by method, target generation, failed decomposition searches, signed reconstruction, orbit folding, row selection, solver retries, descent, final verification, preprocessing and storage. Checker-only brute logs are reported as audit cost and excluded from algorithmic information; full-audit total includes them. Densitypenalty2–3 and AP17.5 are source benchmarks only, measured anew with exact numerator/denominator and zeros. No multiply a measured penalty into already charged collection again.",
      "unit_calibration": "Primary costs are coordinatewise ECadd/double, F_padd/mul/inv, F_nadd/mul/inv, tablelookup/RNG/bytes, CPUwall/RSS and source modeledop columns. For the requested group-operation-equivalent summary, calibrate10000 nonexceptional referenceECadds,10000 modularmul/add/inv per modulus, five repeats on same host; operands SHA256-fixed and zero/noninvertible cases separated. Use median elapsedns per primitive divided by referenceECadd median; report min/maxrepeat sensitivity and charge calibration separately. This is a hardware-dependent measured conversion, never a mathematical equality of units. Also retain historical 4mul+15mul/inv=19F_pmul perECadd as an explicitly modeled comparator.",
      "baselines": "On each exacthistoricalP,Q run matchedBSGSceil√n with fullpoint keys and matchednegationrho using32 public increment pairs, hashpartition,Floyd,16 frozen restarts atmostn+1 transitions each. Use original source rho replay as calibration; new matched rho reports actual ops and baselinefailures. BSGS/rho never read secretk. Source0.886√n is modeled reference, not asserted measured identity. Report memory and failures alongside both modeled and actual ratios.",
      "synthetic_controls": "For each historical B,n and each 3 control seeds, set q=floor(B/3),s=B-3q. Generate three invertible qxq character blocks Cj=L_j*D_j*U_j overF_n: unit lower/upper triangular entries from SHA256, nonzero diagonalD_j; record all generation costs. Reassemble the3qx3q block-circulant matrix with the exact 3-point DFT using the verifiedlambda and append I_s. Save arbitrary public RHS. FullrankB, commutatorzero and exact reassembly/solution are hard known-answer gates. Solve allthreeblocks+residual for the fullRHS, and separately solve one character block for its projected RHS; the latter answers a smaller problem, so the source demand that a structured full solve always beat it is a cost hypothesis with no correctness force. Literal alpha²Bceil(logB)=0 is preserved as a model pathology, not a free solve. Add rankB-1 homogeneous control by making one diagonal coordinate zero and a checker-known nonzero kernel, with RHS0; no control claims full-rank and nonzero homogeneous kernel together. Degeneracy control M has firstk=floor(B/10) standard basis rows and remainingzeros; exactrankk and commutatorrank<=2k are mandatory, source smallalpha interpreted relativeB. Identity matrix and permutation matrix are nearby controls where smallalpha must not imply free work. Same-shape/row-weight random controls sample128 deterministic candidates with nonzero field coefficients, retain first with required independently verified rank or report rank_control_unavailable; selection/setup counted, no real rows replaced.",
      "ablation": "For every historical and actual matrix apply3 seeded Fisher-Yates column/index permutations in addition to actualphi action. For a square matrix use the same permutation on rows/columns only where that is the declared control, and retain fullroworder. Report source alpha~B qualitatively as alpha/B and rank-boundalpha<=2rank(M); quantitative diagnostic alpha>=.8*min(B,2rank(M)) is newly frozen, separately labelled. Failure on rank-deficient matrices does not invalidate the arithmetic. Also run actual no-appended-row and exact validphi-closure arms on samebase; preserve RHS shiftslambda*k and signed coefficient actions.",
      "replay_isolation": "Do not run historical main/script top level with its hardcodedoutputdirs. Copy the frozen pure routines into the new declared implementation, bind hashes/commit and instrument calls without altering selection/row semantics. Capture simulated originalreporting-wrapper exceptions into new run artifacts. Oldmatrix/run files are read-only. STR003/004 reference artifacts are exactcalibration only; no replacement for ninecase actualcost data.",
      "AP_calibration_detail": "Original17.5x p211,m3 is median across six source seeds; exact 17.5 cases20260720 and20260722 haveB15,n197,APsupply26,baseline455,curve(a,b)=(119,79),(24,55). Rawpenalties acrossseeds20260717..22 are12.6388888889,13,19.3103448276,17.5,21.4117647059,17.5. Recompute exact rational455/26 whereapplicable; source dirty-tree09ccb38b838ea17b562add2a439d85a60dc05ced and raw artifact bound separately fromnew replay. No universal17.5threshold atnewj0curves.",
      "prediction_scoring": "M1 literalzero residual is tested on originalsubgroup-defined columns; out-of-subgroup or missingorbit columns are counted as source_applicability_failure, never silently removed from the allinstance claim. Wrongroot nonzero is a control, not M1counterexample. M2 report everycostratio perarity/seed; source>=.5 and competingstrictdecrease r55>r204>r397 with each<.5 tested separately, with actualrank/solvequalification. Model/model and modeled/measured columns remain distinct. M3 primary literalrawdeficit uses historicalm2matrix for the threeheadlinecases, compared with priorSTR003 exactreportedrank; m3 and validsigned/homogeneous ranks are separate completions. M4 requires completedverifiedbase-logsolve anddescent, full costincludingfailures, and actualmatchedrho plusmodeled0.886sqrt(n) rows. IncompleteIC yields unknownratio, not artificialinfinity or claimed>=1; calibratedgroup-equivalent and same hostwallratio both reported, with sensitivitybounds. None ofthese finiteobservations automatically establishes source universalmechanism language.",
