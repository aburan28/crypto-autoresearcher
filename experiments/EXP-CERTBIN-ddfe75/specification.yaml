  # ---------------------------------------------------------------------------
  # OBJECT (reuses EXP-CERTBIN-e94b27 definitions by reference)
  # ---------------------------------------------------------------------------
  object:
    by_reference: >-
      Ring B, B_{<=d}, the descended equations f_0..f_16 of S_3(x_1, x_2, x_R),
      M_D (conventions of EXP-CERTBIN-4e92d7 object.macaulay_M_D), W_D and its
      iteration and fixpoint rule are EXACTLY as frozen in EXP-CERTBIN-e94b27
      object (ring, macaulay_M_D, mutant_closure_W_D). The engine implements
      them as closure.Closure(nv, D, neq).macaulay_closure and .w_closure.
    E_layout: >-
      A system is a 17 x 172 F_2 matrix E. Row k is f_k. Column j is the j-th
      monomial of mu_order(2, 18): degree ascending, then ascending sorted
      index tuple. So column 0 is the constant, columns 1..18 are
      v_0..v_17, and columns 19..171 are the 153 pairs. E_hex is a list of 17
      hex integers, bit j (LSB first) = column j (J1 F-1; written into the
      receipt, NA-5).
    parts: >-
      QUADRATIC columns 19..171. BILINEAR columns: the 81 pairs (i, 9+j) with
      i, j in 0..8. LINEAR columns 1..18. CONSTANT column 0. For S_3 at x_R,
      E_S3(x_R) (EXP-CERTBIN-4e92d7 object.descended_system) has nonzero
      entries only in bilinear, linear and constant columns. The quadratic
      part Qpart(x_R) is phi_{x_R}(Q) with phi(y) = y^2 + x_R y and
      Q_s = sum_{i+j=s} v_i v_{9+j}. The linear part Lpart(x_R) is
      [x_R^2 t^{2j}]_k on v_j and v_{9+j}. The constant is bit k of B.
    union_support: >-
      U_k = supp(E^0_k) union (union over j = 0..16 of supp(E^j_k)), with
      E^0 = E_S3(0) and E^j = E_S3(t^j) xor E^0 on the curve of curve.json.
      This is the rule of EXP-CERTBIN-e94b27 instances.build_instances and
      RT-20260924-d95e70 o2-declaration union_support. S_L = U cap (columns
      0..18), in row-major order (k ascending, then column ascending). This is
      the "S_3 support" on which random lower-degree bits are drawn.
      Coordinator reading, checked by C-SUPPORT: U_k contains all 81 bilinear
      and all 18 linear columns, plus the constant iff bit k of B is 1. The
      expected |S_L| is then 17 * 18 + popcount(B).
    closures_run: >-
      On every kept system of every arm:
      M_4 = Closure(18, 4, 17).macaulay_closure (rank, one, dims_by_deg, flat
      certificate if one); W_4 = Closure(18, 4, 17).w_closure (full record,
      flat certificate if one) plus a wdag-v1 certificate if one. On archived
      S_3 and null arms also M_3 = Closure(18, 3, 17).macaulay_closure
      (regression). On every system with a linear ell (rc_b): R'_3, R'_4
      (Closure(17, 3, 17) / Closure(17, 4, 17).macaulay_closure) and
      W'_4 = Closure(17, 4, 17).w_closure on the substituted system. NO
      closure with D >= 5.
    derived_per_instance: >-
      P = rank M_4 - dims_by_deg(M_4)[3] (rank of the degree-4 projection;
      L-TOP); fallen = dims_by_deg(M_4)[3]; linear_forms =
      dims_by_deg(M_4)[1] - dims_by_deg(M_4)[0].
    rc_b: >-
      ell-substituted fall profile (RC-B), per system:
      (1) Compute the left kernel of the 17 x 153 quadratic-column submatrix
          over F_2 with the executor's own elimination. If its dimension is
          not 1, RC-B is "not applicable (kernel dim d)". This is expected
          for N-CONV17, NULL-AFF62 and NULL-F262 (dim 0).
      (2) ell = sum_k c_k f_k for the kernel vector c. For S_3, N-CONV and
          N-CONVL, c_k must equal Tr(t^k / x_R^2) (C-ELL).
      (3) If ell's linear part is zero: constant 1 -> label
          REFUTED-AT-DEGREE-2 (1 in M_2); constant 0 -> label ELL-TRIVIAL.
          Neither is substituted.
      (4) Otherwise j* = the least index in ell's linear support. The
          substitution pi sets v_{j*} := ell + v_{j*} (an affine form in the
          other variables). Relabel the remaining 17 variables in ascending
          order as 0..16. pi(f_k) is reduced multilinearly (v^2 = v); its
          degree is <= 2.
      (5) Record rank R'_3, and rank, one and dims_by_deg (the fall profile,
          d = 0..4) of R'_4. T5_applicable iff dims_by_deg(R'_4)[3] ==
          rank R'_3. If applicable, the T5 prediction is: W_4 refuted iff 1
          in R'_4, and final_dim(W_4) = rank R'_4 + 834.
      (6) Semi-regular reference profiles. Substituted:
          [0, 0, 16, 288, 2328] (o2-declaration semi_regular_values; exact on
          20/20 N-ELL). Unsubstituted M_4 for systems without ell:
          [0, 0, 17, 323, 2771] (RT-20260924-d95e70 J8; exact on 124/124
          nulls).
      For S_3 the red team substituted v_0 := v_9 + c. Rule (4) reproduces
      that, because ell = v_0 + v_9 + Tr(B / x_R^2) on 92/92.
    certificate_format: >-
      certificates.jsonl.gz, one line per (instance, closure) refutation, with
      keys: key, closure, format, and the body.
      FORMAT flat-v1 (as RC-1): C = sorted list of (mu as sorted index list,
      k); claim sum_{C} mu*f_k = 1 in B. It certifies unsatisfiability and
      1 in rowspace(M_{2 + max|mu|}). It counts toward M_4 only when max
      |mu| <= 2. It NEVER counts toward W_4 unless max |mu| <= 2
      (RT-20260924-d95e70 J7 (a)).
      FORMAT wdag-v1 (RC-D; DEC-20260924-5b1c8e R-8; DEC-20260924-e61f3b
      NA-5): {"D": 4, "nv": 18, "nodes": [{"id": i, "rows": [[mu, k], ...],
      "prods": [[j, c], ...]}, ...], "output": o}. It defines
      poly(i) = sum_{(mu,k) in rows} mu*f_k + sum_{(j,c) in prods} v_j * poly(c)
      in B. It is VALID iff:
      (a) every child id c is less than i (topological order);
      (b) every |mu| <= D - 2 = 2 and every k is in 0..16;
      (c) every child c used in prods has deg poly(c) <= D - 1 = 3;
      (d) every node has deg poly(i) <= D;
      (e) poly(output) == 1.
      By induction every node lies in W_4. So a valid wdag-v1 certifies
      1 in W_4 and unsatisfiability. An M_4 refutation is a one-node wdag with
      no prods. Recommended construction for a refutation first reached at
      iteration i (not binding; the verifier does not care how): write the
      "1" row of iteration i as (basis rows of iteration i-1) + sum_j v_j *
      (fallen basis rows of iteration i-1 used with j). Collapse each of those
      19 groups into one node of level i-1, and recurse. Each level-0 group is
      a flat block of M_4 rows. An iteration-1 refutation then has at most 19
      level-0 blocks.
    verifier: >-
      experiments/EXP-CERTBIN-ddfe75/verifier/verify_nconv.py, run as a
      SEPARATE PROCESS after the closures. It imports nothing from impl/,
      from crypto_autoresearcher (any module), from any archived impl/ or
      from any review directory. From the run's instances.jsonl.gz generation
      records, curve.json and the seeds, it:
      (V1) rebuilds every system independently. Kept parts come from its own
           F_{2^17} arithmetic and own S_3 expansion (Qpart, Lpart, B bits) or
           from the definition of Q_k (N-CONV17). Drawn parts are
           re-derived by its own implementation of each draw rule from the
           seed (V3). Archived systems come from instance-sets.json and
           n-ell-instances.json, and for S_3 are cross-checked against its own
           construction;
      (V2) recomputes s for every kept system by its own exhaustive 2^18
           evaluation, and checks every listed solution of every satisfiable
           control;
      (V3) replays each arm's draw stream (numpy 2.4.6 PCG64, one generator
           per arm) with its own keep rule, and requires the same kept systems
           (by E_sha256) and the same attempt indices;
      (V4) verifies every certificate: flat-v1 by the sum; wdag-v1 by (a)-(e)
           with its own multilinear arithmetic;
      (V5) runs the negative controls (C-VERIFIER).
      Output: certificate-verification.json (per certificate: verified, format,
      failure reason, sizes, max |mu|, node count, max child degree),
      construction-verification.json and draw-replay-verification.json.

  # ---------------------------------------------------------------------------
  # INSTANCE SETS (arms)
  # ---------------------------------------------------------------------------
  instance_sets:
    xr144: >-
      The 144 slots in the order of instance-sets.json: U62 (listed order,
      ascending idx), then S62, then C20. Slot 0..143 carries (source set,
      idx, x_R). Expected sizes 62 + 62 + 20. A different archived count is a
      STOP (contract defect).
    archived_arms:
      S3-U62: 62 unsatisfiable S_3 systems, E_hex from instance-sets.json (U62).
      S3-C20: 20 unsatisfiable S_3 systems (C20).
      S3-S62: 62 satisfiable S_3 systems (S62). This is the S_3 soundness control, and it gives S_3's P at the S62 x_R.
      NULL-AFF62: 62 unsatisfiable same-support affine-null systems (N-AFF62 of RC-1, E_hex as archived). Effective family count 1 (one affine draw; OBJ-6).
      NULL-F262: 62 unsatisfiable random-F_2 systems on U (N-F262 of RC-1, E_hex as archived).
      NELL-A20: the 20 unsatisfiable N-ELL systems of RT-20260924-d95e70 (n-ell-instances.json). They serve as regression only, and are not pooled with N-ELL144.
    fresh_arms:
      N-CONV:
        role: PRIMARY
        seed: 2026092450101
        kept_part: Qpart(x_R) on quadratic columns, exactly as in E_S3(x_R).
        drawn_part: >-
          bits = g.integers(0, 2, size=|S_L|) (one call per attempt), placed
          on S_L. All other columns 0..18 are zero.
        identity_rejection: a draw equal to E_S3(x_R) is rejected (logged).
        slots: xr144
      N-CONVL:
        role: secondary ladder rung (curve constant only)
        seed: 2026092450102
        kept_part: Qpart(x_R) and Lpart(x_R), exactly as in E_S3(x_R).
        drawn_part: >-
          bits = g.integers(0, 2, size=|S_L cap column 0|) (one call per
          attempt), placed on the constant positions of S_L.
        identity_rejection: >-
          A draw equal to B's own bits is rejected (identity), and so is the
          all-zero draw (b' = 0, a singular curve). Both are logged.
        reading: >-
          Every N-CONVL system is the S_3 descent at x_R for the curve constant
          b' given by the drawn bits. These x_R are generally NOT x(2E)
          targets for that curve (confound, disclosed).
        slots: xr144
      N-CONV17:
        role: secondary ladder rung (convolution forms without the rank-16 cokernel)
        seed: 2026092450103
        kept_part: >-
          The quadratic columns of row k are exactly Q_k = sum_{i+j=k}
          v_i v_{9+j} (i, j in 0..8), for k = 0..16 (T = identity). There is
          no x_R dependence, and no linear fall at degree 2.
        drawn_part: bits = g.integers(0, 2, size=|S_L|) placed on S_L (as N-CONV).
        slots: 144 stream slots (x_R recorded as null)
      N-ELL144:
        role: nearby-object control (one linear fall, no tensor)
        seed: 2026092450104
        draw_rule: >-
          Exactly RT-20260924-d95e70 j9-ptm/o2-declaration.yaml `draw`:
          M = zeros(17 * 172); M[Upos] = g.integers(0, 2, size=Upos.size),
          with Upos = flatnonzero(U) row-major; then c = int(g.integers(0, 2));
          rows 0..15 are kept; row 16 is replaced by v_0 + v_9 + c.
        slots: 144 stream slots (x_R recorded as null)
    generator_rule: >-
      One numpy.random.Generator(numpy.random.PCG64(seed)) per fresh arm,
      numpy 2.4.6 (DEC-20260923-4d7a19 R-2), consumed in slot order and
      attempt order. No other call touches it. Arms are independent streams,
      so no arm's draws depend on another's.
    keep_rule: >-
      For each slot, attempts a = 0, 1, 2, ... up to 255. Each attempt makes
      one draw, applies the arm's rejections (identity, b' = 0, or duplicate
      of an already-kept system of the same arm by E_sha256), then computes s
      = the number of Boolean solutions by exhaustive evaluation over all 2^18
      assignments. The first draw with s = 0 is the slot's UNSATISFIABLE
      instance. The first draw with s >= 1 is its SATISFIABLE CONTROL. Other
      draws are discarded. Stop when both are filled. If attempt 255 passes
      with a role unfilled, that role is EXHAUSTED(cap) for the slot. This is
      recorded, never a result, and it reduces that arm's denominator. Every
      attempt is logged in draws-<ARM>.jsonl.gz (slot, attempt, E_sha256, s,
      outcome, and for N-CONVL the drawn b' bits).
    instance_record: >-
      instances.jsonl.gz, one line per kept system: key "<ARM>:<slot>" (the
      archived keys of RC-1 for archived arms), arm, role (unsat | sat),
      slot, source set, idx and x_R (or null), attempt, E_hex, E_sha256, s,
      and for satisfiable controls the list of solutions (as 18-bit integers).
    sizes_expected: >-
      Fresh: 4 arms x (144 unsatisfiable + 144 satisfiable) = 1152.
      Archived: 62 + 20 + 62 + 62 + 62 + 20 = 288. Total 1440 systems.

  # ---------------------------------------------------------------------------
  # CONTROLS -- each has a FAIL condition; each can fail on this run's data
  # (NA-5, F-J3-2), or is declared vacuous up front
  # ---------------------------------------------------------------------------
  controls:
    - id: C-ENGINE
      when: phase 0, BEFORE the first frozen draw and before any closure on run data
      what: >-
        (a) the tree_rule and ancestry of engine_provenance; (b) sha256 of
        src/crypto_autoresearcher/gf2/_kernels.c equals the pin, and the
        sha256 of every package file is recorded; (c) with
        CRYPTO_AR_GF2_BACKEND=native: `python3 tools/gf2_replay_rc1.py --json
        <run>/engine-provenance/replay-rc1.json` (FULL sweep, no --limit;
        the README reports about 110 s on 1 thread in its container) exits 0,
        reports 1062 records, 268 certificates checked and 0 mismatches;
        (d) `python3 -m pytest -q -rs tests/test_gf2_kernels.py` passes with
        0 failures and 0 skipped; (e) build_info backend native and
        source_sha256 equal to the pin. Outputs are kept verbatim under
        engine-provenance/, with timestamps that precede draws-*.jsonl.gz.
      fails_if: any item fails, or any draw file predates the C-ENGINE record. STOP; no draw (INV-1).
    - id: C-SRC
      what: every inputs.files sha256 equals its bound value.
      fails_if: any mismatch. STOP (INV-2).
    - id: C-SELF
      what: >-
        Seed S_selftest = 2026092450199. Checks: modulus irreducibility; field
        axioms on 10^4 triples; own E_S3 construction against direct F_{2^17}
        evaluation of S_3 on 10^3 (v, x_R); the exhaustive-s routine against
        naive per-assignment evaluation on 200 random systems; own
        substitution against direct evaluation (pi(f)(u') = f(u) for u
        extending u' through ell = 0) on 10^3 cases; and the engine's W_D on
        30 random small Boolean systems (6 variables, D in {3, 4}) against a
        brute-force literal fixpoint. At least 3 of those 30 must reach the
        fixpoint at iteration index >= 2, constructed if necessary and listed
        (F-J2-1). Also the wdag extractor on those systems where refuted,
        checked by the verifier's rules (a)-(e) in-process.
      fails_if: any item fails, or fewer than 3 small systems reach iteration index >= 2. STOP (INV-3).
    - id: C-FIX
      what: M_3 is 323 x 988, M_4 2924 x 4048, R'_3 306 x 834, R'_4 2618 x 3214.
      fails_if: any dimension differs. STOP (INV-3).
    - id: C-CONSTRUCT
      what: Own E_S3(x_R) equals the archived E_hex of instance-sets.json on all 144 x_R. Qpart and Lpart are therefore exactly S_3's.
      fails_if: any mismatch. STOP before phase 2 (INV-3).
    - id: C-SUPPORT
      what: >-
        U recomputed by the union_support rule. Its per-equation sizes equal
        the archived union_support_size_per_eq of p1-instances.json.gz, and U
        equals the union support implied by NULL-F262 (every NULL-F262 system
        lies inside U). The Coordinator reading of U_k (object.union_support)
        is checked and recorded true or false.
      fails_if: >-
        sizes differ, or a NULL-F262 system lies outside U: STOP (INV-3). A
        false Coordinator reading is NOT a failure. S_L is the rule's set
        whatever the reading, and the reading's failure is recorded.
    - id: C-REG
      what: >-
        The baseline fixture (KN-TECH-080). This is regression on archived
        arms through the run's own construction and the engine.
        (a) M_3/M_4 rank and "1 in R" flags equal the archived rank_3,
            one_in_R_3, rank_4 and one_in_R_4 on every S3-*, NULL-* system.
        (b) The W_4 engine record (every field the RC-1 engine wrote:
            iterations_to_fixpoint, dims, final_dim, one,
            one_first_iteration, dims_by_deg, new_fallen_per_iteration,
            stack_rows_per_iteration) equals closures.jsonl.gz on every S3-*,
            NULL-* system.
        (c) R'_4 fall profiles equal the red-team values (RT-20260924-d95e70
            J7 (b)): S3-U62 [1, 18, 154, 834, 2213] on 61 and
            [1, 17, 153, 833, 2212] on idx 893; S3-C20 [1, 18, 154, 834, 2213]
            on 20/20; on the 10 lowest-idx S3-S62,
            dims_by_deg[0..3] = [0, 18 - s, 154 - s, 834 - s]; ell's linear
            support is {v_0, v_9} on every S3-* system.
        (d) NELL-A20: the W_4 record equals the rows[].engine record of
            o2-engine-and-own.json on 20/20 (0 refuted, final_dim 3162), and
            R'_4 profile [0, 0, 16, 288, 2328] on 20/20.
      fails_if: any mismatch. STOP before phase 2; no fresh draw is made on a failed regression (INV-4).
    - id: C-ELL
      what: >-
        For every S3-*, N-CONV and N-CONVL system, the left kernel of the
        quadratic-column submatrix is 1-dimensional and equals
        c_k = Tr(t^k / x_R^2), computed by field arithmetic. For N-CONVL the
        linear support of ell is {v_0, v_9}.
      fails_if: any violation. This is a construction defect; the run is void (INV-8).
    - id: C-TOP
      what: >-
        L-TOP (H-CERTBIN-be6cbd). P(N-CONV system at slot) and P(N-CONVL
        system at slot), for both the unsatisfiable and the satisfiable one,
        equal P(S_3 at the same x_R) (S3-U62, S3-S62 or S3-C20). All 288
        N-CONV17 systems share one P.
      fails_if: any inequality. Kept part not kept, or engine defect; the run is void (INV-8).
    - id: C-T4
      what: >-
        On every system where rc_b substitutes (T4, generalized):
        final_dim(W_4) = final_dim(W'_4) + 834, and one(W_4) = one(W'_4).
        Where T5_applicable, the W_4 record meets the T5 prediction (written
        before phase 4, predictions-t5.jsonl.gz, sha256 in the phase log).
      fails_if: any violation. The run is void (INV-8); the report localizes it to the engine or to the substitution code.
    - id: C-WDAG
      what: >-
        For every W_4 refutation, the wdag extractor's iteration
        dimensions equal the engine record's dims, and one_first_iteration
        equals the depth used. Every refutation reported by the engine
        (M_4 or W_4) is submitted to the verifier.
      fails_if: a dimension mismatch (INV-8). A refutation with no wdag-v1 is UNCERTIFIED; that is reported and is not a failure.
    - id: C-ORACLE2
      what: >-
        s of every kept system is recomputed by the verifier (V2). Its
        satisfiable-control solution lists check. For archived arms s equals
        the archived s.
      fails_if: any disagreement. Every arm-dependent metric is void (INV-7).
    - id: C-DRAW
      what: The verifier's independent replay of every fresh arm's stream (V3) yields the same kept systems and attempt indices.
      fails_if: any difference. The fresh arms are void (INV-7).
    - id: C-PS
      what: >-
        Soundness on every satisfiable control (S3-S62 and the 4 x 144 fresh
        satisfiable controls): no M_4 or W_4 refutation. Where s <= 31,
        codim(W_4 in B_{<=4}) = 4048 - final_dim >= s (W_4 lies in
        I cap B_{<=4}, whose codimension is s by the Reed-Muller bound of
        RT-20260924-d95e70 J9 O1).
      fails_if: >-
        any refutation of a satisfiable control, or codim < s. The
        INSTRUMENT is falsified and the run is void (INV-5). If the
        certificate VERIFIES, the arm label is wrong instead, and INV-7
        applies too.
    - id: C-CERT
      what: Every submitted certificate is verified by the separate-process verifier. Counted metrics use verified certificates only.
      fails_if: any submitted certificate fails (INV-6).
    - id: C-VERIFIER
      what: >-
        Negative controls PER KIND (F-J3-1). A kind is a pair (closure, arm)
        in {M_4, W_4} x {every arm with >= 1 refutation}. For each kind, the
        executor builds at least 3 corrupted certificates of each type below
        from verified ones. They must be format-valid and algebraically
        wrong or discipline-violating.
        (a) one row removed;
        (b) one k changed;
        (c) degree violation. For W_4, the engine's flat certificate of a W_4
            refutation with max |mu| = 3, rewritten as a one-node wdag-v1
            (sum is 1, rule (b) violated), or a wdag whose child has degree 4
            (rule (c) violated). For M_4, a flat-v1 with max |mu| = 3
            submitted as an M_4 certificate;
        (d) a verified certificate re-keyed to another system of the same arm.
        The verifier must reject every one. Separately, its own f_k must
        equal the executor's E on every system (V1). Kind (c) is
        constructible only if some flat certificate has max |mu| = 3. If none
        exists in a kind, (c) is declared vacuous for it, with the reason.
      fails_if: any corrupted certificate accepted, or any construction disagreement (INV-6).
    - id: C-DET
      what: >-
        In a SEPARATE process: (a) regenerate every fresh arm's stream and
        compare the sha256 of each draws-<ARM>.jsonl.gz; (b) recompute M_4,
        W_4 and rc_b on the 10 lowest-slot N-CONV unsatisfiable systems, 5
        N-CONV satisfiable controls and 5 N-ELL144 systems; (c) recompute 20
        systems with threads = 1 and compare with the threaded records.
      fails_if: any difference (INV-9).

  independent_variables:
    - arm (S3-U62, S3-C20, S3-S62, N-CONV, N-CONVL, N-CONV17, N-ELL144, NELL-A20, NULL-AFF62, NULL-F262)
    - role (unsatisfiable, satisfiable control)
    - closure (M_4, W_4; R'_4 and W'_4 on substituted systems)

  metrics:
    primary:
      - id: MN1
        name: w4_refuted_NCONV
        definition: >-
          w = #{N-CONV unsatisfiable systems with a VERIFIED wdag-v1
          certificate for 1 in W_4}, out of n_C (144 minus EXHAUSTED slots),
          with an exact Clopper-Pearson 95% interval.
      - id: MN2
        name: w4_refuted_by_arm
        definition: Per unsatisfiable arm, the verified W_4 refutation count out of its size, with CP95. The S_3 reference is S3-U62 + S3-C20 (82) in-run.
      - id: MN3
        name: soundness_and_certificates
        definition: C-PS counts per arm and closure; certificates submitted, verified, failed and uncertified per (closure, arm, format).
    secondary:
      - Per arm, the M_4 refutation count with CP95 (verified flat-v1 with max |mu| <= 2).
      - Per arm, the W_4 rate on the unsatisfiable systems M_4 does not refute (the U62 analogue), with CP95.
      - N-CONV w stratified by x_R source (U62, S62, C20). The paired 2 x 2 table S_3 against N-CONV at W_4 on the 82 U62 + C20 x_R.
      - Per system, the M_4 fall profile dims_by_deg, rank M_4, P, fallen and linear_forms. The full W_4 record. The rc_b label, ell support, rank R'_3, R'_4 profile, T5_applicable and the W'_4 record.
      - Per arm, the fraction of systems whose substituted profile equals [0, 0, 16, 288, 2328] (arms with ell), or whose M_4 profile equals [0, 0, 17, 323, 2771] (arms without).
      - Per arm, on satisfiable controls with s <= 31, the fraction with codim(W_4) = s (W_4 is the vanishing ideal in degree <= 4).
      - Draw statistics per arm (attempts per slot, unsatisfiable fraction among draws, rejections by reason, EXHAUSTED count). Descriptive only.
      - Wall time and peak RSS per phase and closure. Reported; not a unit.
    primary_unit: verified refutations (counts of systems)

  preregistered_prediction:
    quantity: w (MN1), and the ladder order at W_4 (NC-DR-3, NC-DR-4)
    formula: >-
      E-TENSOR: w >= ceil(0.9 n_C) (130 at n_C = 144). E-LINEAR:
      w <= floor(0.1 n_C) (14). E-TENSOR falsified iff w <= floor(n_C / 2)
      (72); E-LINEAR falsified iff w > floor(n_C / 2) (73 or more). Derived,
      exact: C-TOP (L-TOP) and C-T4 (T4) on every applicable system.
      Soundness: 0 refuted satisfiable controls. N-ELL144: 0 refuted wherever
      T5 applies with the semi-regular profile.
    source: >-
      H-CERTBIN-be6cbd PN-1..PN-5, fixed before any N-CONV system exists.
      Thresholds mirror H-CERTBIN-5e71c9 PA-1 (90% / 10% / 50%). The
      reference rates are: S_3 386/386 at W_4 (DEC-20260924-e61f3b NA-4:
      82 RC-1-certified plus 304 Stage-1 flags); nulls 0/62 and 0/62 and
      N-ELL 0/20 (KN-FIND-5a8d3e); Stage-1 M_4 rate 324/386, CP95
      [0.799, 0.875] (KN-OPEN-3c8f51). The semi-regular reference profiles
      come from RT-20260924-d95e70 (J8; o2-declaration.yaml). L-TOP is derived
      in H-CERTBIN-be6cbd; T4/T5 are from o2-declaration.yaml.
  heuristic_under_test: null
  heuristic_under_test_note: No numbered heuristic is tested. The semi-regular description is read per arm (NC-DR-5), not validated as a heuristic.
  scale_relevance:
    tier: toy
    justification: >-
      n = 17, one curve, one V, 144 archived targets, synthetic families
      built on them. Nothing transfers to n = 19 (KN-OPEN-3c8f51 item B), to
      other curves or V (EXP-CERTBIN-3f06d1), or to off-x(2E) targets without
      measurement.
    correspondence: null
  tail_checks:
    - >-
      EXACT ARITHMETIC (RC-3). Every Clopper-Pearson bound and binomial tail
      uses exact integer/rational arithmetic (math.comb, fractions) or
      log-space summation at >= 50 significant digits (mpmath), reported as
      log10 where below 1e-12. No floating-point survival function is used
      below 1e-12.
    - >-
      POWER TABLE BEFORE DATA. trial-plan-v1.json carries an exact table of
      P(w >= 130), P(w <= 14) and P(w <= 72) at n = 144 for
      p in {0.03, 0.10, 0.50, 0.90, 0.97}. It is computed from the thresholds
      alone, before any draw.
    - >-
      SAMPLE-SIZE JUSTIFICATION (design arithmetic, Coordinator; the executor
      recomputes it exactly in the power table). One draw per archived x_R
      ties every N-CONV system to an RC-1 target, with zero new target
      sampling. At n = 144 the CP95 bound at 0/144 or 144/144 is about 0.025
      from the extreme. RC-1's 62/62 gave a lower bound of 0.9422
      (KN-FIND-5a8d3e), which is consistent with 1 - 0.025^(1/62). 144 thus
      separates the 90% and 10% thresholds from the 386/386 S_3 reference
      and the 0/62 nulls with margin, which n = 62 does less well.

  replication:
    seeds: [2026092450199, 2026092450101, 2026092450102, 2026092450103, 2026092450104]
    seeds_note: >-
      In order: S_selftest, N-CONV, N-CONVL, N-CONV17, N-ELL144 (as in
      instance_sets.fresh_arms). Archived arms use no seed. The seeds are checked unused in any existing
      specification (grep over experiments/*/specification.yaml); they are
      distinct from RC-1's 2026092430099 and N-ELL's 2026092431001.
    independent_instances: 1440
    plan: >-
      Within run: three construction-independent checks (C-CONSTRUCT and the
      verifier's V1 and V3), the theorem checks C-TOP and C-T4 on every
      applicable system, C-DET in a separate process, and regression against
      RC-1 and the red team. Author-independent verification is the review
      round's job (claim_tier_and_review).

  # ---------------------------------------------------------------------------
  # DECISION RULES (fixed now; applied mechanically)
  # ---------------------------------------------------------------------------
  decision_rules:
    - id: NC-DR-1
      rule: >-
        PRIMARY, KN-OPEN-3c8f51 item (A) on N-CONV. Compute w twice: L1 with
        UNCERTIFIED systems counted as not refuted, and L2 with them excluded
        from n_C. For each: "TENSOR" iff w >= ceil(0.9 n_C); "LINEAR" iff
        w <= floor(0.1 n_C); "MIXED" otherwise. Report w, n_C and CP95.
        E-TENSOR is FALSIFIED iff w <= floor(n_C / 2); E-LINEAR is FALSIFIED
        iff w > floor(n_C / 2). If L1 and L2 differ, the verdict is
        "UNDETERMINED (certification)", with both shown. If n_C < 120, the
        verdict is "NOT EVALUABLE (sample)".
    - id: NC-DR-2
      rule: >-
        At S_3's rate? "AT S_3's RATE" iff the CP95 interval of w / n_C
        overlaps the CP95 interval of 386/386 (the S_3 arm rate quoted per
        DEC-20260924-e61f3b NA-4); "BELOW S_3" otherwise. The same label is
        also reported against the in-run S3-U62 + S3-C20 count (secondary).
    - id: NC-DR-3
      rule: >-
        Ladder separations at W_4. For every pair of unsatisfiable arms (X, Y)
        among N-CONV, N-CONVL, N-CONV17, N-ELL144, NULL-F262, NULL-AFF62 and
        S_3 (82 in-run): "X ABOVE Y" iff the CP95 lower bound of X exceeds the
        CP95 upper bound of Y; "NOT DISTINGUISHED" otherwise. NULL-AFF62 is
        labelled "one affine draw" in every comparison.
    - id: NC-DR-4
      rule: >-
        PRIMARY COMPOSITE, item (A) reading at this cell. Applied in order:
        (1) "CONVOLUTION TENSOR" iff NC-DR-1 = TENSOR and N-CONV ABOVE
            N-ELL144 and N-CONV ABOVE NULL-F262.
        (2) "LOWER-DEGREE PART REQUIRED" iff NC-DR-1 = LINEAR. Sub-label from
            N-CONVL under the NC-DR-1 thresholds: TENSOR-level ->
            "SEMAEV LINEAR PART SUFFICES (curve constant not required)";
            LINEAR-level -> "CURVE CONSTANT REQUIRED (with the confound that
            the drawn curves' targets are not x(2E))"; otherwise "MIXED".
        (3) "MIXED" in every other case, with all rates shown.
        Appended reading from N-CONV17 under the NC-DR-1 thresholds:
        TENSOR-level -> "CONVOLUTION FORMS SUFFICE WITHOUT THE COKERNEL FALL";
        LINEAR-level with (1) -> "THE RANK-16 COKERNEL IS NEEDED";
        otherwise descriptive.
        Any case not covered is "not evaluable" with its reason.
    - id: NC-DR-5
      rule: >-
        RC-B random-model transfer, per arm. "SEMI-REGULAR TRANSFER HOLDS" iff
        >= 90% of the arm's systems have the reference profile
        (object.rc_b (6)); "FAILS" iff <= 10%; "MIXED" otherwise. Also the
        T5_applicable fraction. Descriptive; no verdict on any heuristic.
    - id: NC-DR-6
      rule: >-
        M_4 reading. Per arm, the M_4 count with CP95. "N-CONV M_4 AT STAGE-1
        RATE" iff its CP95 interval overlaps [0.799, 0.875]. Also the
        conditional W_4 rate on N-CONV systems that M_4 leaves unrefuted.
        Descriptive.
    - id: NC-DR-7
      rule: >-
        n = 19 control recommendation. Recorded by the executor, decided by
        the Coordinator after review. CONVOLUTION TENSOR -> the n = 19 cell
        quotes S_3-specificity against an N-CONV-type arm (same-support nulls
        insufficient). LOWER-DEGREE PART REQUIRED -> N-ELL-type and
        same-support nulls carry the contrast, and an N-CONVL-type arm
        discriminates. MIXED -> both arms.
    - id: NC-DR-8
      rule: >-
        Instrument. C-ENGINE, C-SRC, C-SELF, C-FIX, C-CONSTRUCT, C-SUPPORT,
        C-REG, C-ELL, C-TOP, C-T4, C-WDAG, C-ORACLE2, C-DRAW, C-PS, C-CERT,
        C-VERIFIER and C-DET must pass. Any failure applies its invalidation
        rule, and no NC-DR-1..7 verdict is issued for what it voids.
    - id: NC-DR-9
      rule: Primary verdicts are NC-DR-1 and NC-DR-4. Everything else is secondary.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    watchdog_seconds: 86400
    total_cpu_hours: null
    maximum_memory_gb: 3
    maximum_runs: 2
    maximum_workers: 1
    budget_note: >-
      CERTBIN is ECC; research time is unbudgeted (CLAUDE.md rule 11). The
      86,400 s watchdog (with checkpoint and --resume) is machine protection,
      and expiry is never a result. maximum_runs = 2 means one run plus one
      re-run after an INFRASTRUCTURE failure, with the failed attempt
      retained. maximum_workers = 1 process. Inside it, at most 3 engine
      threads (CRYPTO_AR_GF2_THREADS <= 3; engine_provenance.threads). The
      memory cap is 3 GB, because other CERTBIN executors may share the
      4-core, 15 GB machine.
    dominant_cost: >-
      Estimate only. About 1440 systems x (M_4, W_4, and on most R'_3, R'_4,
      W'_4). The engine README reports the whole RC-1 closure workload,
      heavier per system because it includes M_5 and W_5, at about 110 s on 1
      thread in its container. Add the exhaustive 2^18 evaluations of every
      draw (several thousand), the wdag extraction, and the verifier's
      pure-Python certificate re-execution, which is likely dominant. Hours,
      not days.

  stopping_rules:
    - id: SR-1
      rule: Slots, seeds, arms and keep rules are fixed. No arm is extended, trimmed or reordered after any output.
    - id: SR-2
      rule: C-ENGINE, C-SRC, C-SELF, C-FIX, C-CONSTRUCT, C-SUPPORT or C-REG failure stops the run BEFORE the fresh draws (phase 2). The failed attempt is retained.
    - id: SR-3
      rule: >-
        A watchdog expiry, crash or out-of-memory event checkpoints (per
        phase, per arm) and resumes with --resume. It is never a result. A
        resumed run must reproduce the draw-log hashes (C-DET (a)).
    - id: SR-4
      rule: No closure with D >= 5, no F4, and no new curve or target in this contract, whatever the outcome.
    - id: SR-5
      rule: EXHAUSTED(cap) slots are reported and excluded from the arm's denominator. They are never redrawn.

  invalidation_rules:
    - {id: INV-1, rule: 'C-ENGINE failure: nothing is drawn; the attempt is an infrastructure/provenance stop, reported to the Coordinator.'}
    - {id: INV-2, rule: 'C-SRC failure: the run is void (stop).'}
    - {id: INV-3, rule: 'C-SELF, C-FIX, C-CONSTRUCT or C-SUPPORT (sizes) failure: the run is void (stop).'}
    - {id: INV-4, rule: 'C-REG failure: the run is void (stop before phase 2).'}
    - {id: INV-5, rule: 'C-PS failure: the instrument is falsified; the run is void and is not evidence about H-CERTBIN-be6cbd.'}
    - {id: INV-6, rule: 'C-CERT or C-VERIFIER failure: MN1-MN3 and every refutation count are void.'}
    - {id: INV-7, rule: 'C-ORACLE2 or C-DRAW failure: every arm-dependent metric of the affected arms is void.'}
    - {id: INV-8, rule: 'C-ELL, C-TOP, C-T4 or C-WDAG (dimension) failure: construction or engine defect; the run is void.'}
    - {id: INV-9, rule: 'C-DET mismatch: the run is void.'}
    - {id: INV-10, rule: 'A void run is an implementation failure (AGENTS.md core rule 5). It says nothing about S_3, the tensor or the refutation degree.'}

  success_criterion: >-
    The run succeeds iff every control of NC-DR-8 passes; every kept system
    of every arm has a record for every closure due on it; and NC-DR-1..9
    each return a verdict or "not evaluable" with its reason. TENSOR, LINEAR
    and MIXED are all successes. UNDETERMINED and NOT EVALUABLE are
    informative outcomes with a declared successor.
  falsification_criterion: >-
    - E-TENSOR (H-CERTBIN-be6cbd C-T) is falsified iff w <= floor(n_C / 2)
      (72 at n_C = 144).
    - E-LINEAR is falsified iff w > floor(n_C / 2).
    NOT falsification: a void run (INV-1..INV-10), a watchdog expiry, an
    UNCERTIFIED refutation, an EXHAUSTED slot.

  coordinator_prior: >-
    Written before any N-CONV system exists. It is a prior, not a
    prediction, and it changes no threshold.
    (a) N-CONV: TENSOR about 65%, MIXED about 20%, LINEAR about 15%. Reason:
        by L-TOP, N-CONV shares S_3's top-degree cancellations. The red team
        found that the non-ell falls alone fill W^(1) for S_3. A random lower
        part should not lift more top syzygies to true syzygies than S_3's
        does.
    (b) N-CONV's M_4 rate is at least S_3's Stage-1 rate (about 55%).
    (c) N-CONV's substituted profiles are non-semi-regular on >= 90% of
        systems (about 65%).
    (d) N-CONVL is TENSOR-level (about 75%): it is S_3 with another constant.
    (e) N-CONV17: no confident prior (about 50% TENSOR-level).
    (f) N-ELL144 is refuted 0 times (about 95%; T4/T5 plus semi-regularity).
    (g) Certificates: every W_4 refutation gets a verified wdag-v1 (about
        80%). The likeliest failure is extractor effort or size, handled as
        UNCERTIFIED, not a wrong refutation.
    Most likely to be overturned: (a), and (e) in either direction.

  proof_search_map_audit:
    performed_by: coordinator (DEC-20260924-833c70), before approval
    baseline_fixture: C-REG (a)-(d) and C-FIX; C-ENGINE's full RC-1 replay before any draw.
    observation_collision: >-
      Passes by construction. The flat-certificate fiber is closed by
      wdag-v1 with per-node degree bounds, and C-VERIFIER (c) attacks exactly
      that fiber. Satisfiable controls in every arm are the collision search.
    quantifier_order: Stated in H-CERTBIN-be6cbd. Draws are fixed by seed and slot. The primary rate is unconditional over unsatisfiable draws.
    method_ceiling: >-
      W_4 is a degree-bounded closure. A non-refutation is a statement about
      degree-4 derivations only, not F4 step degree, and not a proof of
      hardness. A TENSOR verdict is sufficiency relative to the random-bit
      distribution, not an exact mechanism. Nearby-object controls: N-ELL144
      and the same-support nulls.
    representation_interfaces: >-
      Two interfaces carry proof obligations and have checks: the E_layout /
      support reading (C-SUPPORT, C-CONSTRUCT) and the generalized T4
      substitution (C-T4 on every applicable system).
    verdict: No audit failure. Approved.

  attention_contract:
    decisive_evidence: NC-DR-1 and NC-DR-4 on verified wdag-v1 certificates.
    positive_next_decision: >-
      CONVOLUTION TENSOR: record that KN-OPEN-3c8f51 item (A) at n = 17 is
      carried by phi_{x_R}(Q) relative to random lower parts. The n = 19
      design (DEC-20260924-e61f3b NA-3) carries an N-CONV-type arm as the
      discriminating control. The KN-OPEN successor states the tensor as the
      object of resolution criterion 3.
    negative_next_decision: >-
      LOWER-DEGREE PART REQUIRED: the n = 19 design carries N-ELL-type and
      N-CONVL-type arms. The mechanism search moves to the Semaev linear part
      or the curve constant, per the sub-label.
    inconclusive_decision: >-
      MIXED, UNDETERMINED or NOT EVALUABLE: a successor contract at n = 17
      with more draws per x_R, or with the certification fixed, before n = 19
      quotes any specificity against the tensor.
    local_ambiguity_rule: Any case the rules do not cover is recorded as "not evaluable" with its reason. No threshold is added after data.
    peripheral_exclusions: [D >= 5, F4, n = 19, new curves or targets, x(2E) modulation]
    rerank_trigger: Completion of this run triggers a CERTBIN rerank (the n = 19 design's approval gate, DEC-20260924-e61f3b NA-3).

  execution:
    run_id_rule: >-
      RUN_ID is minted by the dispatching session before launch
      (`python3 tools/allocate_id.py --next run --area CERTBIN`, then
      `--check`) and passed as $RUN_ID. The run directory is
      experiments/EXP-CERTBIN-ddfe75/runs/$RUN_ID/, and the id is recorded in
      the manifest and in engine-provenance/.
    environment: >-
      export CRYPTO_AR_GF2_BACKEND=native PYTHONDONTWRITEBYTECODE=1
      CRYPTO_AR_GF2_THREADS=3 (lower if the machine is shared more heavily;
      record it); python3 with numpy 2.4.6; mpmath optional for log-space tails.
    entry_point: experiments/EXP-CERTBIN-ddfe75/impl/driver.py
    engine_provenance_script: experiments/EXP-CERTBIN-ddfe75/impl/engine_provenance.py
    selftest: experiments/EXP-CERTBIN-ddfe75/impl/selftest.py
    verifier: experiments/EXP-CERTBIN-ddfe75/verifier/verify_nconv.py
    trial_plan: experiments/EXP-CERTBIN-ddfe75/trial-plan-v1.json
    trial_plan_rule: >-
      Written by the executor from this specification alone, before phase 0.
      It contains input paths and hashes, arms, seeds, slot order, keep rules,
      phases, output paths and the exact power table, and no computed closure
      value and no draw. Its sha256 is in the manifest.
    command: >-
      python3 experiments/EXP-CERTBIN-ddfe75/impl/engine_provenance.py --out
      experiments/EXP-CERTBIN-ddfe75/runs/$RUN_ID/engine-provenance &&
      python3 experiments/EXP-CERTBIN-ddfe75/impl/selftest.py --out
      experiments/EXP-CERTBIN-ddfe75/runs/$RUN_ID/selftest.json &&
      python3 experiments/EXP-CERTBIN-ddfe75/impl/driver.py --spec
      experiments/EXP-CERTBIN-ddfe75/specification.yaml --plan
      experiments/EXP-CERTBIN-ddfe75/trial-plan-v1.json --run-id $RUN_ID
      --out experiments/EXP-CERTBIN-ddfe75/runs/$RUN_ID [--resume]
    determinism_command: >-
      python3 experiments/EXP-CERTBIN-ddfe75/impl/driver.py --spec
      experiments/EXP-CERTBIN-ddfe75/specification.yaml --plan
      experiments/EXP-CERTBIN-ddfe75/trial-plan-v1.json --run-id $RUN_ID
      --out experiments/EXP-CERTBIN-ddfe75/runs/$RUN_ID --phase determinism
    verify_command: >-
      python3 experiments/EXP-CERTBIN-ddfe75/verifier/verify_nconv.py --run
      experiments/EXP-CERTBIN-ddfe75/runs/$RUN_ID --curve
      experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05/curve.json
      --archived experiments/EXP-CERTBIN-e94b27/runs/RUN-CERTBIN-c417e0/instance-sets.json
      --nell coordination/review/certbin-20260924-3d7e1a/reviews/TASK-20260924-d95e70/j9-ptm/n-ell-instances.json
      --out experiments/EXP-CERTBIN-ddfe75/runs/$RUN_ID
    phases:
      - 0 C-ENGINE (engine_provenance.py), C-SRC, C-SELF, C-FIX; trial plan hashed
      - 1 archived arms, C-CONSTRUCT, C-SUPPORT, C-REG (a)-(d), C-ELL on S3-*
      - 2 fresh draws (four arms, seeded), keep rules, draw logs
      - 3 rc_b (R'_3, R'_4) on every applicable system; predictions-t5.jsonl.gz written and hashed
      - 4 M_4, W_4 and W'_4 on every system; flat and wdag-v1 certificates; C-TOP, C-T4, C-WDAG
      - 5 C-DET (separate process, --phase determinism)
      - 6 verifier (separate process, verify_command), C-ORACLE2, C-DRAW, C-VERIFIER
      - 7 aggregation, decision rules, run report (--resume after phase 6)
    output_bound: >-
      Per-system records and certificates are gzipped JSONL. The run package
      stays below 150 MiB. If certificates would exceed it, keep every
      certificate of N-CONV, S3-U62 and S3-C20 and the first 20 of each other
      arm, and record the sha256 and size of the rest. The rest stay counted
      (they were verified in-run) but are flagged "not archived".
    dispatch_note: >-
      No batch queue exists for this lane, so tools/experiment_execution.py is
      not the launch path. The executor launches the commands above under
      TASK-20260924-7c1fb2 after TASK-20260924-f6c337 verifies.

  constraints:
    - No new curve or target is sampled. No deployed curve is an attack instance. No discrete logarithm is attempted.
    - A timeout, crash or environment restart is execution status, never negative mathematical evidence.
    - EXP-CERTBIN-4e92d7, EXP-CERTBIN-e94b27, RUN-CERTBIN-c417e0, coordination/review/ and src/crypto_autoresearcher/gf2/ are read only.
    - The package is imported, never copied or edited. No archived engine file is copied.

  artifact_paths:
    - experiments/EXP-CERTBIN-ddfe75/specification.yaml
    - experiments/EXP-CERTBIN-ddfe75/trial-plan-v1.json
    - experiments/EXP-CERTBIN-ddfe75/impl/
    - experiments/EXP-CERTBIN-ddfe75/verifier/
    - experiments/EXP-CERTBIN-ddfe75/runs/<RUN_ID>/ (exactly one run directory, id minted at dispatch)

  required_artifacts:
    - trial-plan-v1.json (before phase 0; includes the power table)
    - impl/README.md naming each module's responsibility, and impl/impl-provenance.json (imports of the package, the pinned commit, and a statement that no engine file was copied)
    - engine-provenance/ (tree and ancestry checks, per-file package sha256, build_info, replay-rc1.json plus stdout, pytest output; all timestamped before the first draw)
    - selftest.json (C-SELF, C-FIX)
    - inputs.json (input sha256 and the C-SRC comparison)
    - support.json (U, S_L, sizes, the Coordinator reading's truth value)
    - draws-N-CONV.jsonl.gz, draws-N-CONVL.jsonl.gz, draws-N-CONV17.jsonl.gz, draws-N-ELL144.jsonl.gz
    - instances.jsonl.gz (every kept system, archived arms included)
    - predictions-t5.jsonl.gz (hashed before phase 4)
    - closures.jsonl.gz (per system and closure; full records, rc_b fields, P, fallen, labels)
    - certificates.jsonl.gz, certificate-verification.json, construction-verification.json, draw-replay-verification.json, negative-controls-certificates.jsonl.gz, negative-controls-verification.json
    - instrument-checks.json (every C-* with pass/fail and violating systems)
    - decision-rules.json (NC-DR-1..9 with inputs, both NC-DR-1 labels)
    - cell-summary.json (MN1-MN3 and secondary metrics)
    - manifest.yaml (commands, git commit and dirty state, RUN_ID, environment, the engine block, input hashes, seeds, the inference block, per-phase timings, peak RSS, validity status, certificate kinds), raw-result.json, command.txt, environment.json, stdout.log, stderr.log
    - >-
      run-report.md: each NC-DR verdict; which of PN-1..PN-5 held, failed or
      were not evaluable; which parts (a)-(g) of the coordinator_prior were
      overturned; the E_hex bit layout; the independence disclosure (engine by
      the dispatching session; impl/ and verifier/ by the executor); the claim
      tier and scope statement verbatim.

  claim_tier_and_review:
    review_required: true
    default: >-
      review-adversarial, under a review_plan the Coordinator writes after
      the run snapshot TASK-20260924-40b2ca verifies and before any reviewer
      runs. Minimum joints:
      (1) AUTHOR-INDEPENDENT certificate verification. The validator writes
          its own verifier without reading impl/, verifier/ or
          src/crypto_autoresearcher/gf2/. It re-verifies EVERY counted wdag-v1
          and M_4 certificate, and re-decides s on every counted system.
      (2) A blind re-derivation from this specification alone of the N-CONV
          construction and of W_4 on 10 N-CONV systems (5 refuted, 5 not,
          selected by the plan).
      (3) A red team on the ladder reading ("tensor" against "Semaev linear
          part" against "curve constant"), on L-TOP and the generalized T4,
          and on whether uniform random bits on S_L are the right null for
          "not needed".
      Reviewers read from a dedicated worktree at the archive commit with
      PYTHONDONTWRITEBYTECODE=1 (NA-5).
    escalation: >-
      None expected. If an evidence decision would close a lane or record
      reject_scoped on this basis, review-breakthrough at max comes first
      (AGENTS.md rule 12).

  dependencies: []
  dependencies_note: >-
    Inputs must be committed on the branch: RUN-CERTBIN-c417e0 (archived by
    TASK-20260924-e27f93), the red-team directory (TASK-20260924-8f03d6),
    RUN-CERTBIN-3b7e05, and the engine at 934bee5. These are dispatch
    preconditions of TASK-20260924-7c1fb2.

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    fallback_reason: >-
      DEC-20260923-4d7a19 R-1 forward rule. Claude Code subagents inherit the
      session model; per-role model selection is process-level (CLAUDE.md
      model policy note). This is not a tier downgrade. The requested policy
      and effort are recorded in the manifest.
    degraded_allowed: false
    independent_session_required: false
