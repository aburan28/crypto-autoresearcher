experiment:
  id: EXP-ZKARG-1a879b
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-130f15; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-130f15
  question_id: RQ-WFS-e776b6
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustive out-of-domain evaluation of a single-register AIR quotient identity against enumerated
    false-trace families, measuring attained false-acceptance against the budgeted degree-over-field-size
    term at two field sizes
  objective: 'The one uncertainty a run reduces: how close a corrupted execution trace can drive the
    acceptance probability of a single out-of-domain quotient identity check toward the bound that
    arithmetization accounting budgets for it. Specifically (i) it computes, for each member of an
    enumerated false-trace family, the prover-optimal purported quotient within a frozen degree budget
    and the resulting failure locus, then evaluates the identity at every out-of-domain point so the
    acceptance rate is counted rather than estimated; (ii) it reports the maximum and the distribution
    of that rate per (p, n, d, family) and the ratio to the budgeted degree-over-field-size term,
    giving the measured-versus-budget number as the deliverable; (iii) it runs an honest-trace null
    that must accept everywhere and a random-polynomial null of matched degree through the identical
    evaluator, so that any near-ceiling clustering observed in the signal arm is attributable to trace
    corruption rather than to degree arithmetic, and so that agreement between arms is recorded as
    a controlled null with the geometry named. The run searches for no forgery, weakens no transform,
    and examines no system outside the AIR written for this contract.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the named single-register
      AIR at the named p, n and d, under the frozen purported-quotient degree budget and over the
      named false-trace families, the attained maximum acceptance rate of a single out-of-domain identity
      check is the tabulated value and its ratio to the budgeted term is the reported number, with
      the argmax trace exhibited. What does NOT follow: that any arithmetization or proof system is
      sound or unsound; that the result transfers to multi-register AIRs, to composed constraint systems,
      to cryptographic field sizes, or to any protocol not written here; that any deployed, third-party
      or standardized system has any property; and no attack, break, speedup or security consequence.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes) Freeze the AIR, the two primes, the trace lengths, the constraint
      degrees, the false-trace families, the purported-quotient degree budget, and the multiplicity
      convention. STAGE 1 (cost: minutes) Build the honest trace, verify the transition and boundary
      constraints, and run the honest-trace null requiring acceptance at every out-of-domain point;
      abort on failure. STAGE 2 (cost: minutes) Run the two degenerate controls, the always-satisfied
      and the never-satisfied constraint. STAGE 3 (cost: about one hour compute) For every false trace
      in the family compute the prover-optimal quotient by interpolation within the budget and evaluate
      the identity at all out-of-domain points, recording the acceptance count. STAGE 4 (cost: minutes)
      Run the random-polynomial null of matched degrees through the identical evaluator in the same
      invocation. STAGE 5 (cost: about half of stage 3) Recompute every failure locus by an independent
      factorisation routine and require zero disagreements. STAGE 6 (cost: minutes) Tabulate maxima,
      means, argmax traces, budgeted terms and ratios; emit the argmax traces as certificate artifacts.
      STAGE 7 (cost: equal to stages 3 to 5) Replay from the recorded seed and require identical counts
      before writing the run record.'
    instrument: Python 3, no Sage. A self-contained F_p module on Python integers; polynomial arithmetic,
      interpolation over a multiplicative subgroup, and exact division by the vanishing polynomial
      x to the n minus one implemented directly; an independently written factorisation routine for
      the cross-check that shares no code with the evaluator; numpy used only for batch evaluation
      tables and histogram assembly. Execution is wrapped by harness/runner.py so that commit, environment,
      timing, resources and seeds are captured and the run record is immutable, and the argmax traces
      are emitted as certificates whose failure loci the wrapper recomputes independently.
    parameters: 'Primes p in {65537, 786433}, both with large power-of-two-divisible p minus one so
      trace subgroups exist. Trace lengths n in {16, 64, 256}. Transition constraint degree d in {2,
      3, 4}, giving composed degrees d times n. False-trace families per cell: all single-cell corruptions
      crossed with 256 corruption values, all adjacent-pair patterns at one corruption value, and
      a structured splitting family capped at 512 traces. Out-of-domain evaluation is complete: all
      p minus n points per trace. Purported-quotient degree budget frozen at composed degree minus
      n. Total field operations bounded by about 2 to the 34 across all cells, enforced by the stopping
      rule.'
  controls:
  - Honest-trace null with an empty failure locus, requiring acceptance at every out-of-domain point.
  - Random-polynomial null of matched degrees through the identical evaluator in the same invocation.
  - Degenerate control with the constant-zero constraint, where every trace is honest and acceptance
    must be identically one.
  - Degenerate control with a constraint that no trace satisfies, whose failure locus must have density
    at most the degree over field size and must be nonempty.
  - Independent recomputation of each failure locus by polynomial factorisation rather than by exhaustive
    evaluation, with a required zero disagreement count.
  - Two field sizes and two trace lengths so that the reported ratio is not a coincidence of one modulus
    or one domain.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): NULL OBJECT: a random polynomial pair of the same degrees, with no
    trace structure and no honest execution behind it, pushed through the identical failure-locus
    computation and the identical exhaustive evaluation in the same invocation. The null must show
    a failure-set density consistent with a random nonzero polynomial of the same degree, that is,
    an acceptance rate near degree over field size with the same counting error, and must NOT show
    the near-ceiling clustering the signal arm is looking for. If the null clusters the same way,
    the clustering is a property of degree arithmetic rather than of trace corruption, and the record
    closes as a controlled null. A second null is the HONEST trace, whose failure set must be empty
    so that acceptance is exactly one, confirming the pipeline does not reject valid executions.'
  independent_variables:
  - constraint degree d
  - trace length n
  - field size p
  - false-trace family (single-cell, adjacent-pair, structured splitting, random-polynomial null)
  metrics:
    primary:
    - maximum measured false-acceptance rate per cell
    - measured-to-budget ratio per cell
    - argmax false trace and its failure-locus size
    - honest-trace acceptance rate
    - random-polynomial null acceptance distribution
    secondary:
    - mean and median acceptance rate over the family
    - histogram of failure-locus sizes
    - interpolation wall time per trace
    - factorisation cross-check disagreement count, required zero
    - peak memory per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The maximum, over the enumerated false-trace family, of the fraction of out-of-domain
      points at which the quotient identity accepts, reported per (p, n, d, family), together with
      its ratio to the budgeted term.
    formula: 'Budgeted term B equals (d times n) divided by (p minus n), the composed constraint degree
      over the number of candidate out-of-domain points. Pre-registered law: the measured maximum
      acceptance rate M satisfies M at most B for every trace, with equality attainable only when
      the corrupted composition splits completely with distinct roots outside the trace domain. The
      pre-registered null value for the random-polynomial arm is also B, since a random nonzero polynomial
      of the same degree has the same worst-case root count. The reportable quantity is the ratio
      M over B, pre-registered as at most 1.000.'
    source: Pre-registered in the parent proposal IDEA-20260816-130f15 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at p equal to 65537 and 786433 with trace lengths up to 256 and constraint
      degrees up to 4, chosen because exhaustive evaluation over every out-of-domain point is complete
      at those sizes and interpolation stays affordable. Transfer assumption, stated and not assumed
      true: extending the measured ratio to cryptographic field sizes presumes that attainment of
      the root-count ceiling is governed by the algebra of the corrupted composition rather than by
      the small modulus, which this run tests at two primes only. No cryptographic-scale conclusion
      is drawn, and structured-family cells are reported as lower bounds throughout.'
    correspondence: null
  tail_checks:
  - Report the single trace with the largest failure locus and confirm it does not exceed the composed
    degree.
  - Inspect the upper tail of the acceptance distribution and confirm no random-polynomial null sample
    reaches the signal-arm maximum.
  - Examine the largest-n cell separately, since the puncturing correction is largest there and would
    otherwise be averaged away.
  - Report the smallest nonzero acceptance count across the family to confirm no cell collapsed to
    zero through an interpolation failure.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt if any trace shows an acceptance count exceeding the composed degree or if the honest-trace
    null fails.
  - Cap the false-trace family at 32768 traces per cell; larger families are truncated and the cell
    is labelled as a lower bound.
  - Cap total wall time at eight hours; truncation reduces the (p, n, d) grid and is recorded as a
    budget outcome, never as evidence about soundness.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run succeeds if the honest-trace and degenerate controls pass, the factorisation
    cross-check reports zero disagreements, and the maximum acceptance rate, its ratio to the budgeted
    term, the argmax trace, and the null-arm distribution are reported for every attempted cell, whether
    or not the ratio approaches one.
  falsification_criterion:
  - Any trace shows an acceptance count exceeding the composed degree.
  - The honest-trace null fails to accept at every out-of-domain point.
  - The random-polynomial null matches the signal arm in both maximum and clustering, closing the
    record as a controlled null.
  - The measured-to-budget ratio stays below 0.5 in every cell, falsifying attainability for this
    AIR shape and closing with the named obstruction.
  - Factorisation cross-check disagrees with exhaustive evaluation on any trace.
  - Replay from the recorded seed does not reproduce the acceptance counts.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-130f15
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The purported-quotient degree budget is the single most consequential modelling choice and needs
    a Coordinator ruling, since setting it too low defines away the strongest prover and makes the
    measured margin an artifact.
  - The structured splitting family is described but not constructed; whether a corruption pattern
    exists that forces the composed polynomial to split over F_p is an open algebraic question this
    contract assumes can be attempted, not solved.
  - Whether the budgeted term should use p or p minus n as the denominator must be fixed, since at
    these small primes the two differ materially.
  - Whether a multi-register AIR cell should be included at reduced enumeration to show the instrument
    extends, or excluded to keep the claim clean.
