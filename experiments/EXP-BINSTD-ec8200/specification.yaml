# =============================================================================
# EXP-BINSTD-ec8200 -- VERSION 1 (APPROVED by DEC-20261002-b1ffa1) frozen
# contract for H-BINSTD-b1006d: Sylow-coprimality cofactor closure (A) +
# H_spent/H_unspent F2 builder code-read (Stage 0) + conditional toy yield
# (Stages 1-2) with cofactor-1 null.
#
# Source: IDEA-20260922-e3048d under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Unlocks the "spend the cofactor on decomposition" seam.
#
# ZERO RUNS in this design packet. Stages 0-2 authorized for executor
# TASK-20261002-09a7ee. No AUXIN. Amazon Bedrock prohibited.
# NO break. NO deployed attack. NO exponent claim.
# =============================================================================
experiment:
  id: EXP-BINSTD-ec8200
  hypothesis_id: H-BINSTD-b1006d
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-e3048d
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Sylow-coprimality cofactor closure + Stage-0 H_spent/H_unspent builder
    audit + conditional toy yield vs cofactor-1 null
  status: approved
  approved_by: DEC-20261002-b1ffa1
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-b1ffa1
    composing_decision: DEC-20261002-b1ffa1
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-2 authorized; Stages 1-2
      execute only if Stage 0 finds H_unspent in at least one builder.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0 (primary, cheapest): freeze preregistered predictions + Z/12
      Sylow reproduction check + code-read table for SEMBIN/DREG/QSP (and
      related F2) builders: restricted yes/no + code pointer + documented
      reason if any. ZERO yield cells before Stage-0 freeze. Stages 1-2 ONLY
      if Stage 0 finds H_unspent: toy cofactor-4 yield ratio (≥50 targets)
      and cofactor-1 null (ratio must be 1). No Stage 3. No deployed attack.
      No AUXIN. No Bedrock.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Certify that every full-translation group-homomorphism cofactor quotient
    of ECC2K-130 collapses to the standard order-ℓ reduction (part A), and
    decide by code-read whether existing F2 builders already spend the
    cofactor at the raw x-pool level (H_spent) or leave a ≤4× pool enlargement
    unexploited (H_unspent), with conditional toy yield + cofactor-1 null —
    filling the cofactor-decomposition seam of the RQ-BINSTD reachability
    table, or naming a concrete falsifying certificate / instrument defect.

  class: representation
  class_note: >-
    Primary class is representation / certificate (part A) with a code-read
    discriminator (Stage 0) and a conditional observational yield arm
    (Stages 1-2). Carries HEUR-BINSTD-e3048d-H0 (unconditional for A) and
    H1 (Sylow-2 geometry). Not an exponent-moving breakthrough experiment;
    part (B) at best is a disclosed constant-factor pool-size question.

  scope:
    included:
      - >-
        Stage 0. Freeze preregistered predictions (Z/12 exact; lean H_spent;
        if H_unspent then ratio ∈[1,4] predicted ~2; null ratio exactly 1);
        run symbolic Z/12 Sylow reproduction; audit named builder paths for
        cofactor-coset restriction with code pointers and reasons; emit
        stage0/builder-coset-table.json. ZERO Stage-1 yield before freeze.
      - >-
        Stage 1 (conditional on H_unspent). On a toy Koblitz curve of
        cofactor 4, n prime ≤41, with S×C verified by order factorisation:
        run the identified builder with and without the restriction, fixed
        arity m and other parameters, ≥50 random targets; measure
        relation-yield ratio; independently re-verify every counted relation
        by direct curve arithmetic.
      - >-
        Stage 2 (control, same budget class as Stage 1). Repeat on a
        cofactor-1 toy of matched field size; ratio must be exactly 1.
        Optionally vary Sylow-2 structure (Z/4 vs Z/2×Z/2) if both
        constructible (HEUR-H1).
    excluded:
      - Deployed relation search / index-calculus attack at n=131.
      - Magma/Sage/cypari2 provisioning as the success path (AUXIN forbidden).
      - Claiming an exponent move from a ≤4× pool enlargement.
      - Editing IDEA claim text; editing shared GOAL-ECDLP2M-001.yaml.
      - Amazon Bedrock.
      - Any break claim; any unconditional security claim about a deployed curve.
      - Asserting H_spent or H_unspent without a code pointer.

  inputs:
    proposal: ledger/proposals/IDEA-20260922-e3048d.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-b1006d.yaml
    question: ledger/questions/RQ-BINSTD-b6f698.yaml
    order_source: KN-LIT-661e97
    rho_baseline: KN-LIT-096
    optional_code_refs:
      - analysis/qsp-ecc2k130/qsp_ecc2k130.py
      - analysis/qsp-ecc2k130/explore/qsp_explore.py
      - analysis/frobenius-orbit-ecc2k130/orbit_fb_ecc2k130.py
      - analysis/binstd-curve-audit/README.md
      - experiments/EXP-BINSTD-178742/implementation/
    cells:
      certificate_arm:
        group: 'ECC2K-130 E(F_2^131), order 4·ℓ'
        toy_reproduction: 'Z/12 = Z/4 × Z/3 subgroup enumeration'
      stage0_builders:
        families: [SEMBIN, DREG, QSP, related_F2]
        report_fields: [builder_id, restricted, code_pointer, reason_if_documented]
      toy_arm:
        n_max: 41
        cofactor: 4
        min_targets: 50
        predicted_ratio_band: [1, 4]
        predicted_ratio_typical: 2
      null_arm:
        cofactor: 1
        required_ratio: 1.0
        matched_field_size: true
    seeds:
      master: 20261002
      stage1_targets: [20261002, 20261003]
      null_targets: [20261004]

  controls:
    - name: ctl_preregistered_predictions_freeze
      stage: 0
      blocking: true
      object: >-
        Preregistered predictions frozen in
        stage0/preregistered-predictions.json BEFORE any Stage-1 yield
        output; never edited afterward.
    - name: ctl_z12_sylow_reproduction
      stage: 0
      blocking: true
      object: >-
        Z/12 (or equivalent toy 4ℓ') subgroup enumeration + endomorphism
        preservation must PASS before part (A) is treated as certified in
        RESULTS.md.
    - name: ctl_code_pointer_required
      stage: 0
      blocking: true
      object: >-
        Every builder row in builder-coset-table.json carries a concrete
        code pointer (path + symbol/line) or an explicit not-found status
        with searched paths — never a bare yes/no.
    - name: ctl_cofactor1_null
      stage: 2
      blocking: true
      object: >-
        When Stages 1-2 run: cofactor-1 null yield ratio must equal exactly
        1.000; deviation → O-INSTRUMENT / O-REFUTE-B, not a lever finding.
    - name: ctl_relation_reverify
      stage: 1
      blocking: true
      object: >-
        Every relation counted under unrestricted convention is
        independently re-verified by direct curve arithmetic before credit
        (docs/claims-and-verification.md).
    - name: ctl_stdlib_preferred
      blocking: true
      object: >-
        Prefer stdlib / existing analysis arithmetic. Magma/Sage/cypari2 may
        not be provisioned mid-tick (AUXIN forbidden). Missing dependency →
        failed_infrastructure / O-IMPEDIMENT — not math falsification.
    - name: ctl_skip_stages_if_spent
      stage: 0
      blocking: false
      object: >-
        If Stage 0 finds H_spent on all audited builders, Stages 1-2 may be
        skipped with recorded reason; primary outcome O-CLOSED-SPENT still
        requires Z/12 pass + complete table.

  independent_variables:
    - builder_id
    - restriction_mode  # restricted | unrestricted
    - toy_n
    - toy_cofactor  # 4 | 1
    - sylow2_structure  # cyclic4 | klein | unknown
    - stage  # 0 | 1 | 2
    - seed

  metrics:
    primary:
      - sylow_reproduction_pass
      - builder_restriction_status  # per builder: restricted | unrestricted | not_found
      - builders_audited_count
      - h_unspent_builder_count
      - toy_yield_ratio_cofactor4
      - toy_yield_ratio_cofactor1_null
      - relations_verified_pass_rate
      - stage0_freeze_present
    secondary:
      - peak_rss_bytes
      - wall_s
      - targets_attempted
      - documented_restriction_reason
      - sylow2_structure_observed
      - termination_reason

  heuristic_under_test: HEUR-BINSTD-e3048d-H1

  preregistered_prediction:
    quantity: >-
      Z/12 Sylow reproduction PASS; Stage 0 leans H_spent (no restriction)
      on audited builders; IF any H_unspent then cofactor-4 yield ratio ∈[1,4]
      (typical ~2) AND cofactor-1 null ratio = 1.000 exactly.
    formula: >-
      (A) |G|=4ℓ, gcd(4,ℓ)=1 ⇒ G=S×C; endomorphisms preserve Sylow parts;
      subgroups decompose as (H∩S)×(H∩C); only informative full-translation
      quotient is C-projection.
      (B) yield_ratio = relations_unrestricted / relations_restricted on
      matched (m, n, seed) cells; null_ratio on h=1 must be 1.
    source: >-
      IDEA-20260922-e3048d claims (A)/(B); HEUR-BINSTD-e3048d-H0/H1;
      KN-LIT-661e97; KN-LIT-096.
    claim_tier: certificate_plus_code_read_plus_conditional_toy_observational
    measured_vs_modeled: >-
      Builder restriction status and code pointers are CODE-READ (not
      modeled). Yield ratios, RSS, and verification pass rates are MEASURED.
      Part (A) is CERTIFICATE algebra (exact). Never mix modeled attack
      exponents into this contract — none are claimed.

  scale_relevance:
    tier: structural_plus_toy
    justification: >-
      Part (A) and Stage 0 are certificate/code-read at ECC2K-130's published
      order and existing builder code (not an attack). Stages 1-2 are toy
      (n≤41) and do not transfer attack cost to deployed n=131.
    correspondence: null

  tail_checks:
    - >-
      Extreme: Z/12 fails → O-REFUTE-A; do not proceed to claim (A) closed.
    - >-
      Extreme: H_unspent with yield ratio >4 or <1 → O-REFUTE-B; localise.
    - >-
      Extreme: null ratio ≠ 1 → O-INSTRUMENT; do not treat as lever finding.
    - >-
      Stage 0 row without code pointer → incomplete; not a closed seam.

  optimistic_assumptions:
    - assumption: >-
        Stage 0 can locate the relevant builder paths under the declared
        optional_code_refs and sibling SEMBIN/DREG/QSP trees within budget.
      bias_direction: >-
        Missing paths → not_found rows / O-INSTRUMENT or O-IMPEDIMENT; never
        invent a restriction status.
    - assumption: >-
        If H_unspent, toy n≤41 cofactor-4 curves with verified S×C exist and
        finish ≥50 targets within advisory budget.
      bias_direction: >-
        Budget abort → O-IMPEDIMENT with measured quantity; Stage 0 table
        remains the primary deliverable.
    - assumption: >-
        Prediction lean toward H_spent is stated so H_unspent is surprising;
        it is NOT a frozen claim that Stage 0 must confirm.
      bias_direction: >-
        Confirmation bias risk; mitigated by requiring code pointers and
        freezing predictions before yield.

  memory_accounting: >-
    Peak RSS measured on any toy yield runs. Dominant structures: toy curve
    arithmetic and small candidate lists. No modeled FB memory column is
    claimed as measured RSS. Part (A)/Stage 0 are CPU-light (code read +
    symbolic check).

  hidden_overhead_honesty: >-
    No asymptotic attack formula is claimed. Any H_unspent gain is a
    disclosed ≤2-bit pool-size constant factor and does not change
    per-attempt solve cost or attempts-column success probability.

  replication:
    seeds: [20261002, 20261003, 20261004]
    independent_instances: 2
    independent_instances_note: >-
      Stage-0 code-read table must be reproducible from the same frozen
      builder path list (two independent reviewer/executor reads agree on
      restricted yes/no per path). Stage-1 dual seeds when executed.
      Primary certificate metrics must agree across complete_valid seeds.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2
    maximum_memory_gb: 4
    maximum_runs: 20
    maximum_workers: 1

  stopping_rules:
    - >-
      SR-1. Stage-0 preregistered-predictions freeze missing → stop; status invalid.
    - >-
      SR-2. Z/12 Sylow reproduction fails → O-REFUTE-A; do not claim (A) closed.
    - >-
      SR-3. Any builder row lacks code pointer and is not marked not_found →
      incomplete; do not emit O-CLOSED-SPENT.
    - >-
      SR-4. Stage 0 all H_spent → may skip Stages 1-2 with recorded reason;
      primary label O-CLOSED-SPENT if Z/12 pass + table complete.
    - >-
      SR-5. H_unspent found AND Stage-1 ratio outside [1,4] → O-REFUTE-B;
      do not retune frozen band.
    - >-
      SR-6. Null ratio ≠ 1 → O-INSTRUMENT; do not read as lever finding.
    - >-
      SR-7. Advisory budget exhausted → preserve partial artifacts;
      O-IMPEDIMENT with measured quantity; never negative math evidence.
    - >-
      SR-8. Do not escalate a ≤4× pool finding into an exponent or break claim.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze.
    - Provisioning Magma/Sage/cypari2/AUXIN as the success path.
    - Filing H_spent/H_unspent without code pointer (or not_found).
    - Claiming break / deployed attack / exponent move / unconditional insecurity.
    - Overwriting a prior RUN-* directory.
    - Editing shared GOAL-ECDLP2M-001.yaml or IDEA claim text.
    - Using Amazon Bedrock.
    - Running Stages 1-2 yield before Stage-0 freeze completes.
    - Treating null-ratio deviation as a positive lever finding.

  success_criterion: >-
    ALL of: (1) Stage-0 freeze present; (2) Z/12 Sylow reproduction PASS;
    (3) builder-coset-table.json covers declared families with code pointers
    or not_found; (4) exactly one of: O-CLOSED-SPENT (all H_spent) OR
    O-UNSPENT-LEVER (H_unspent + ratio∈[1,4] + null ratio=1); (5) no
    invalidation_rule fired. This fills the cofactor-decomposition seam
    column; it does NOT claim an ECDLP break or exponent move.

  falsification_criterion: >-
    ANY of: (F1) Z/12 Sylow reproduction fails (O-REFUTE-A); (F2) H_unspent
    with yield ratio outside [1,4] (O-REFUTE-B); (F3) null ratio ≠ 1 treated
    as lever finding; (F4) Magma/Sage provisioned as sole path to reported
    certificates; (F5) restriction status asserted without code pointer.
    Budget exhaustion and builder not_found (with searched paths) are NOT
    falsification of part (A).

  required_artifacts:
    - experiments/EXP-BINSTD-ec8200/implementation/
    - experiments/EXP-BINSTD-ec8200/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-ec8200/stage0/sylow-z12-report.json
    - experiments/EXP-BINSTD-ec8200/stage0/builder-coset-table.json
    - experiments/EXP-BINSTD-ec8200/stage0/api-freeze.md
    - experiments/EXP-BINSTD-ec8200/stage1/yield-report.json
    - experiments/EXP-BINSTD-ec8200/stage2/null-report.json
    - experiments/EXP-BINSTD-ec8200/runs/
    - experiments/EXP-BINSTD-ec8200/RESULTS.md

  procedure:
    stages:
      - id: S0-FREEZE
        text: >-
          Write stage0/preregistered-predictions.json and api-freeze.md;
          ZERO yield cells before freeze.
      - id: S0-Z12
        text: >-
          Enumerate Z/12 subgroups and check endomorphism preservation;
          write sylow-z12-report.json.
      - id: S0-CODE-READ
        text: >-
          Audit SEMBIN/DREG/QSP/related F2 candidate-generation paths;
          write builder-coset-table.json (restricted, pointer, reason).
      - id: S0-BRANCH
        text: >-
          If all H_spent → skip to RESULTS with O-CLOSED-SPENT (Z/12 must
          pass). If any H_unspent → proceed to Stages 1-2.
      - id: S1-TOY
        text: >-
          Toy cofactor-4 yield: restricted vs unrestricted, ≥50 targets,
          re-verify relations; write yield-report.json.
      - id: S2-NULL
        text: >-
          Cofactor-1 null; ratio must be 1; optional Sylow-2 split;
          write null-report.json.
      - id: S2-SUM
        text: >-
          Write RESULTS.md with exactly one O-* label; observations only;
          no ledger status edits.

  assigned_to: executor
  executor_handoff: TASK-20261002-09a7ee
  snapshot_task: TASK-20261002-6d2177

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
