# EXP-ECDLP-41aa46
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261003-ff6a5b.
experiment:
  id: EXP-ECDLP-41aa46
  hypothesis_id: H-ECDLP-b7685d
  source_idea: IDEA-20261003-37f753
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 19
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-ff6a5b
  objective: >-
    Check the counts 5, 4, and 2, the product 40, and the nearby gap 0.
  inputs:
    bit_length: 5
    doublings: 4
    additions: 2
    length_gap: 1
    doubling_gap: 2
    digit_product: 40
    digit_sum: 11
    nearby_a: 2
    nearby_b: 2
    nearby_gap: 0
    nearby_product: 4
  controls:
    - >-
      The bit length is 5. The doubling count is 4. The addition
      count is 2. Reporting the addition count as 4 drops the gap
      against the doubling count and invalidates the run.
    - >-
      Five exceeds four by 1. Four exceeds two by 2. The product
      of 5, 4, and 2 is 40. Their sum is 11.
    - >-
      Two readings of the addition count are both 2. Their gap is
      0 and their product is 4.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 19 has bit length 5, 4 doublings, and 2
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 5. Count 4 doublings. Count 2 additions.
      Multiply 5, 4, and 2. Subtract 2 from 2.
    source: >-
      IDEA-20261003-37f753 states the counts 5, 4, and 2, read
      2026-10-03. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 40 and the nearby gap 0 are required. A check that stops at the bit length 5 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 2 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 5.
    - The doubling count is not 4.
    - The addition count is not 2.
    - The product is not 40.
    - The addition count is reported as 4, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 5, that the doubling
    count is 4, that the addition count is 2, and that the product
    of those three counts is 40.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 2.
  required_artifacts:
    - experiments/EXP-ECDLP-41aa46/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-41aa46/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-41aa46/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-41aa46/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-41aa46/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-41aa46/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
