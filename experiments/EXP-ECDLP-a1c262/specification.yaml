          under-estimating reference and makes the factor-2 criterion
          arithmetically unreachable whenever the selected reference's own
          disagreement exceeds 0.5. Use |ln(ref/exact)| and report the relative
          form alongside.
        v1_superseded_verbatim: >-
          "reference_agreement_with_exact: |reference(u) - REF-EXACT(u)| /
          REF-EXACT(u), per rung, for each of REF-ASY-D, REF-ASY-X, REF-SP and
          REF-SHIFT. THE ARBITRATION TABLE." and, in
          C-A-NULL-REFERENCE-SHIFT, "REQUIRED OUTCOME: REF-SHIFT is REJECTED by
          the arbitration, i.e. its worst-rung relative disagreement with
          REF-EXACT at bits 16 strictly exceeds that of the selected principled
          reference by at least a factor of 2."
        v2_now: >-
          L(ref, u) = |ln(reference(u)/REF-EXACT(u))| is THE arbitration
          statistic; W = max over arbitrated rungs. Every criterion, selection
          rule and falsification condition is stated on L and W. The relative
          form is reported in every row with its saturation annotated, and the
