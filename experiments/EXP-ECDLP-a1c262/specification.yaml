experiment:
  id: EXP-ECDLP-a1c262
  hypothesis_id: H-ECDLP-d2aa2c
  question_id: RQ-ECDLP-002
  goal_id: null
  version: 1
  status: review_required
  claim_tier: toy
  title: >-
    Four-reference arbitration of the EXP-LPF-001 absolute smoothness reference
    against an EXACTLY COMPUTED smooth-number density at the bits-16 cell, with
    a knobbed null reference that must be rejected, run entirely on archived
    arrays with no new sampling and no curve arithmetic

  objective: >-
    Decide whether the archived departure of the KNOWN-UNIFORM calibration arm of
    RUN-LPF-001-calib from the asymptotic Dickman reference is a property of the
    REFERENCE or of the SAMPLER, by recomputing R(u) = p_hat(u)/reference(u) for
    the ARCHIVED uniform arm under four declared references plus one null
    reference, and arbitrating them against an EXACT count Psi(X, Bsm) at the
    bits-16 cell. The exact count is the arbiter because it is a theorem and has
    no fitted knob, and because the saddle-point estimator's primary source is a
    RECALLED citation no agent in this program has opened.
    THIS CONTRACT MOVES NO EXPONENT, MOUNTS NO ATTACK, AND MAKES NO STATEMENT
    ABOUT THE SEMAEV MAP OR THE REAL ARM OF EXP-LPF-001 IN EITHER DIRECTION.
    Repairing a reference is not an attack.

  independent_variables:
    - name: reference
      values: [REF-ASY-D, REF-ASY-X, REF-SP, REF-EXACT, REF-SHIFT]
    - name: cell_field_bits
      values: [16, 20]
    - name: rung_u_target
      values: [2, 3, 4, 5, 6]
    - name: archived_arm
      values: [OBJ-NULL-UNIF, OBJ-NULL-SYNTH, OBJ-CTRL-PRODUCT]

  inputs:
    archived_source_of_record:
      - experiments/EXP-LPF-001/results/calib/null_replicate_statistics.json
      - experiments/EXP-LPF-001/results/calib/dickman_reference_reproduction.json
      - experiments/EXP-LPF-001/results/calib/apparatus_identity_report.json
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/raw-result.json
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/manifest.yaml
      - experiments/EXP-LPF-001/implementation/lpf001_driver.py
    immutability: >-
      EVERY PATH ABOVE IS READ-ONLY. No file under experiments/EXP-LPF-001/ may
      be written, edited, moved, or regenerated by this experiment. Any write
      there invalidates the run.
    frozen_cell_constants_to_be_re_read_not_assumed:
      bits16: {p: 46663, X_equals_p_squared: 2177435569, D: 4294967296,
               X_over_D: 0.5069737250450999, n_per_sample_set: 130816,
               replicates: 200,
               bsm_ladder: [65536, 1626, 256, 84, 40]}
      bits20: {p: read from the archived bits-20 descriptor, X: p squared,
               D: 1099511627776, n_per_sample_set: 130816, replicates: 200,
               bsm_ladder: [1048576, 10321, 1024, 256, 102]}
      note: >-
        The bits-16 values are transcribed here from the committed descriptor so
        that a transcription error is detectable. The executor RE-READS them from
        the archived files and reports any mismatch as an invalidation, never as
        a finding. The bits-20 p is deliberately NOT transcribed because this
        coordinator did not read it; inventing it would be a fabrication.
    reference_definitions:
      REF-ASY-D: >-
        THE ARCHIVED INCUMBENT. rho(u_D) with u_D = ln(D)/ln(Bsm), rho solved
        from the Dickman delay equation. Reproduces the driver's own choice.
      REF-ASY-X: >-
        THE RANGE-CORRECTED ASYMPTOTIC, AND THE CHEAPEST ARM IN THE CONTRACT.
        rho(u_X) with u_X = ln(X)/ln(Bsm), X = p**2. Motivated by two verbatim
        facts in the committed driver: samples are drawn on [1, p**2] while u is
        computed from D. FIVE EVALUATIONS OF rho PER CELL, ZERO OTHER COST.
      REF-SP: >-
        The Hildebrand-Tenenbaum saddle-point density Psi(x,y)/x at x = X,
        y = Bsm, with alpha the unique positive root of
        sum_{p <= y} log(p)/(p**alpha - 1) = log(x) solved by bisection then
        Newton, to a declared and recorded tolerance. ITS PRIMARY SOURCE IS
        UNREAD BY THIS PROGRAM AND IT IS NEVER THE ARBITER.
      REF-EXACT: >-
        THE ARBITER. The exact density Psi(X, Bsm)/X, counted over the SAME
        RANGE [1, X] the sample is drawn from. Method A at bits 16: one
        segmented largest-prime-factor sieve over [1, X] in segments of at most
        10**7 entries, tracking the largest prime factor of every integer and
        counting, in a single pass, how many have largest prime factor <= Bsm
        for all five Bsm simultaneously. Method B (cross-check, one rung only):
        direct recursive enumeration of Bsm-smooth integers <= X at the
        u_target = 6 rung, where Bsm = 40 and only twelve primes are involved.
      REF-SHIFT: >-
        THE NULL REFERENCE. rho(1.15 * u_D). A deliberate, theory-free
        reparameterisation with a knob chosen before any computation and never
        tuned. It exists to test whether the arbitration has any power to
        separate a principled correction from a fit.

  metrics:
    primary:
      - name: R_per_rung_per_reference_per_cell
        unit: dimensionless ratio
        definition: >-
          R(u) = p_hat(u) / reference(u), where p_hat(u) is the archived
          200-replicate MEAN of STAT-RATE-u at that rung and reference(u) is the
          declared reference evaluated at that rung's Bsm. Reported to full
          machine precision, one row per (cell, rung, reference, arm).
      - name: R_exact_deviation_in_own_standard_errors
        unit: number of standard errors
        definition: >-
          (R_exact(u) - 1) / se_rel(u), where se_rel(u) = sd(u)/(sqrt(200)*mean(u))
          is computed from the ARCHIVED 200-replicate spread at that rung. THIS
          IS THE DECISION VARIABLE. Available only where REF-EXACT exists.
      - name: reference_agreement_with_exact
        unit: relative difference, dimensionless
        definition: >-
          |reference(u) - REF-EXACT(u)| / REF-EXACT(u), per rung, for each of
          REF-ASY-D, REF-ASY-X, REF-SP and REF-SHIFT. THE ARBITRATION TABLE.
      - name: exact_reference_scope_realised
        unit: list of (cell, rung) pairs
        definition: >-
          Exactly which (cell, rung) pairs REF-EXACT was computed for, with the
          method used, the wall-clock and peak RSS spent, and the reason for
          every pair where it was NOT computed. A pair not computed is reported
          as UNARBITRATED and never filled from an approximation.
    secondary:
      - name: max_rung_absolute_log_ratio
        unit: dimensionless
        definition: max_u |ln R(u)| per reference per cell.
      - name: archived_R_rederivation_table
        unit: dimensionless ratios plus pass/fail per rung
        definition: >-
          R(u) re-derived from the archived arrays at the ARCHIVED non-integer u
          under REF-ASY-D, compared against the values quoted in
          IDEA-20260802-001, with a per-rung pass/fail at 1 per cent relative.
      - name: limb_b_decidable_rung_count
        unit: integer out of 10
        definition: >-
          Rungs whose uniform-arm R(u) lies inside the frozen [1/8, 8] band, per
          reference. REPORTED, NEVER USED AS A CRITERION.
      - name: residual_monotonicity_in_u
        unit: increasing | decreasing | non-monotone, per reference per cell
        definition: >-
          Direction of ln R(u) across the five-rung ladder. The archived
          incumbent is strictly increasing; the artifact tell is a NON-MONOTONE
          post-correction residual.
      - name: product_arm_R_excess
        unit: dimensionless ratio
        definition: >-
          R(product arm) / R(uniform arm) per rung per reference. Derivably
          above 1.
      - name: rho_third_quadrature_discrepancy
        unit: relative
        definition: >-
          |rho_here(u) - rho_archived(u)| / rho_archived(u) at the five archived
          u per cell, where rho_here is solved by a scheme independent of the
          driver's composite-Simpson delay-equation solve.

  controls:
    - name: C-A-RHO-THIRD-QUADRATURE
      kind: instrument reproduction, blocking, zero compute
      blocking: true
      description: >-
        rho is re-solved here by a scheme independent of the driver's composite
        Simpson on a uniform grid, and must reproduce the archived
        rho_computed_by_driver values (1.0, 0.30685282258145957,
        0.048608388763315906, 0.0049109257010501225, 0.0003547247043376174,
        1.9649696569618583e-05 at u = 1..6) to better than 1e-3 relative.
        WHAT MAKES IT FAIL: rho(6) is about 2e-5, four and a half orders below
        rho(1), and a delay-equation solver with too coarse a grid or a wrong
        boundary condition on [0,1] loses relative accuracy fastest exactly
        there. A naive Simpson solve at step 0.01 is expected to miss 1e-3 at
        u = 6. Disagreement is an implementation failure and never a finding.
    - name: C-A-ARCHIVED-REDERIVATION
      kind: input-claim regression, blocking, zero compute
      blocking: true
      description: >-
        Re-derive R(u) for the archived uniform arm from the archived arrays and
        compare against the figures quoted in IDEA-20260802-001. WHAT MAKES IT
        FAIL, AND IT IS ALREADY HALF-FAILING: this coordinator's hand arithmetic
        on the committed means and the committed rho values at INTEGER u gives
        bits-16 ratios 1.17019, 1.45257, 2.05206, 4.49543, 11.15351, of which the
        first three match the quoted 1.1702, 1.4522, 2.0521 and the last two DO
        NOT match the quoted 4.5709 and 11.5937. The reconciliation this contract
        predicts is that rho must be evaluated at the ARCHIVED non-integer u
        (5.006009 and 6.012858 at bits 16), which is what the driver's
        u_star_formula does. If the re-derivation at archived u still misses the
        quoted values by more than 1 per cent, the quoted departure figures are
        wrong, the "figure to beat" is void, and the run reports that and stops.
        THE COORDINATOR ARITHMETIC ABOVE IS RECORDED AS A PRIOR AND IS NOT
        EVIDENCE; it is stated so that this control has a named way to fail.
    - name: C-A-NULL-REFERENCE-SHIFT
      kind: NULL OBJECT, blocking
      blocking: true
      description: >-
        THE NULL OBJECT OF THE SAME SHAPE, AND IT CAN FAIL. REF-SHIFT is
        rho(1.15 * u_D): a reference of the identical functional shape as the
        incumbent, with a single multiplicative knob fixed at 1.15 before any
        computation and never retuned. It encodes no theory whatsoever. It is
        run through the IDENTICAL arbitration as the three principled
        references. REQUIRED OUTCOME: REF-SHIFT is REJECTED by the arbitration,
        i.e. its worst-rung relative disagreement with REF-EXACT at bits 16
        strictly exceeds that of the selected principled reference by at least a
        factor of 2.
        WHAT MAKES IT FAIL, CONCRETELY: R(u) is a ratio with a free denominator,
        so any downward reparameterisation of u raises the reference at every
        rung and lowers R at every rung, in the same direction as the correction
        under test. If 1.15 happens to sit near ln(D)/ln(X) at these cells -
        and at bits 16 ln(D)/ln(X) is close to 1.032, while a fitted knob that
        also absorbs the finite-y error would sit higher - REF-SHIFT may track
        REF-EXACT about as well as REF-SP does. If it does, the arbitration
        cannot separate a correction from a fit, the reference-selection claim
        collapses to curve-fitting, and NO reference verdict is issued. This is a
        reachable outcome on the actual data, not a formality.
    - name: C-A-PRODUCT-ARM-DERIVABLE-SIGN
      kind: positive control with a derivable direction, blocking
      blocking: true
      description: >-
        The archived OBJ-CTRL-PRODUCT arm consists of products of two integers
        below p, which are PROVABLY and substantially smoother than uniform
        integers below p**2 - the driver states exactly this and calls it the
        derivable-smooth positive control. REQUIRED: under every declared
        reference, R(product arm) > R(uniform arm) at every rung, and
        R(product arm) > 1.
        WHAT MAKES IT FAIL: a recomputation pipeline that silently pairs the
        product arm's p_hat with the wrong rung, the wrong cell, or a reference
        evaluated at the product arm's own effective range would flatten the
        excess toward 1. An exact reference applied to the wrong sample is
        exactly the failure this catches, and it is not entailed by anything
        else in the design.
    - name: C-A-EXACT-COUNT-CROSS-METHOD
      kind: independent reimplementation of the arbiter, blocking
      blocking: true
      description: >-
        REF-EXACT at the bits-16 u_target = 6 rung (Bsm = 40, twelve primes) is
        computed TWICE by structurally different methods: Method A, the
        segmented largest-prime-factor sieve over [1, X]; Method B, direct
        recursive enumeration of 40-smooth integers <= X. The two integer counts
        must be EXACTLY EQUAL - not close, equal.
        WHAT MAKES IT FAIL: an off-by-one at a segment boundary, inclusion or
        exclusion of 1, an int64 overflow in the sieve's cofactor division, or a
        recursion that double-counts prime powers. Any of these produces a
        difference of at least 1 and voids the arbiter. THE ARBITER IS THE ONLY
        THING IN THIS DESIGN WITH NO EXTERNAL CHECK, SO IT GETS TWO
        IMPLEMENTATIONS.
    - name: C-A-SYNTH-IDENTITY-READBACK
      kind: instrument identity check, non-blocking, declared non-corroborative
      blocking: false
      description: >-
        The archived OBJ-NULL-SYNTH arm is, by the driver's own derivation, THE
        SAME DISTRIBUTION as OBJ-NULL-UNIF, because ENC-B is a bijection from
        [0,p) x [0,p) onto [1, p**2]. Its R must therefore match the uniform
        arm's R within the archived band under every reference.
        DECLARED IN ADVANCE, AS THE DRIVER ITSELF DECLARED IT: AGREEMENT HERE IS
        NOT CORROBORATION OF ANYTHING. It can only detect a recomputation bug
        that treats the two arms differently. It is recorded as non-blocking
        precisely because it is close to entailed.
    - name: C-A-NO-NEW-SAMPLING
      kind: procedural control, blocking
      blocking: true
      description: >-
        No sample is drawn. The uniform arm is the archived one. Redrawing it
        would confound a reference question with a sampling question, and the
        instance-variance question is a DIFFERENT contract (EXP-ECDLP-7edfd3).
        The run manifest must record zero calls to any sampler and the run
        directory must contain no newly generated sample array.
    - name: C-A-READ-ONLY-EXP-LPF-001
      kind: procedural control, blocking
      blocking: true
      description: >-
        A post-run check that no file under experiments/EXP-LPF-001/ changed:
        every input path's sha256 is recorded before and after and must be
        identical. WHAT MAKES IT FAIL: a helper that rewrites a JSON it parsed,
        or an import of the driver module that writes a cache next to it.

  heuristic_under_test: HEUR-SPREF-1

  preregistered_prediction:
    quantity: >-
      R_exact(u) = p_hat(u) / (Psi(X, Bsm)/X) for the archived uniform arm at the
      bits-16 cell, at the five archived rungs.
    formula: >-
      R_exact(u) = 1 within four times se_rel(u), where
      se_rel(u) = sd(u) / (sqrt(200) * mean(u)) is computed from the archived
      200-replicate spread. Equivalently
      |R_exact_deviation_in_own_standard_errors| <= 4 at every rung. The source
      proposal's looser window R_exact(u) in [0.90, 1.11] is retained verbatim as
      a SECONDARY pre-registration, as is its target
      max_u |ln R_sp(u)| <= 0.82 at both cells.
    source: >-
      The prediction is the definition of a uniform sample: if the archived arm
      is uniform on [1, X] and correctly factorised, its smoothness rate at bound
      Bsm estimates Psi(X, Bsm)/X, which is a counting theorem and not an
      approximation. THE PREDICTION IS FIXED BEFORE ANY RUN AND IS NEVER TUNED.
      Adjusting it after any run requires a versioned protocol_amendment under
      experiments/EXP-ECDLP-a1c262/amendments/.

  coordinator_prior:
    recorded_before_execution: true
    prior: >-
      RECORDED FIRST, PER AGENTS.md "Review architecture", AND EXPLICITLY NOT A
      COMPUTATION OF RECORD. This coordinator expects (i) that REF-ASY-X absorbs
      a substantial part of the bits-16 departure but NOT all of it at the top
      rung, because ln(X)/ln(D) is about 0.969 at that cell and the residual
      finite-y error at Bsm = 40 is separately of order unity by Hildebrand's own
      error term; (ii) that REF-EXACT places the archived uniform arm within a
      few standard errors of 1, i.e. branch (a); and (iii) that REF-SHIFT is
      rejected, but with less margin than would be comfortable. If (ii) fails the
      result is MORE valuable, not less, because it implicates the null arm of
      every LPF reading. A prior the run overturns is among the most informative
      outcomes available here and it is unrecoverable if written afterwards.

  scale_relevance:
    tier: toy
    justification: >-
      Two archived toy cells: a 16-bit field prime p = 46663 with X = p**2 =
      2177435569, and a 20-bit field prime with X = p**2 below 2**40. Five frozen
      smoothness rungs per cell. NO TRANSFER IS CLAIMED. A reference validated at
      X ~ 2**31 says nothing about the same estimator at cryptographic X, which
      is a different question and a different record. The exponent-relevance of
      the reference layer is an ARGUMENT about where the quantity appears in a
      cost expression, not an empirical result of this contract.
    correspondence: >-
      null - direct computation over archived arrays. No sampling
      correspondence is used and none is needed, because nothing is sampled.

  tail_checks:
    - >-
      The TOP RUNG IS THE TEST. Report u_target = 6 at bits 16 individually and
      never inside an average over rungs: it is the rung where the incumbent
      departure is largest, where rho is smallest, where the Hildebrand error
      term is largest, and where the exact count is cheapest. A design that
      reported only a pooled statistic would hide exactly the rung it exists for.
    - >-
      Report the archived arm's SMALLEST and LARGEST per-replicate p_hat at the
      top rung (archived: min 0.0001223091976516634, max 0.0003287059686888454
      at bits 16) against the exact density, so that the exact reference is
      checked against the realised replicate range and not only against the mean.
    - >-
      Report the exact smooth COUNT as an integer at every rung where REF-EXACT
      exists, alongside the density, so a later reader can recompute the density
      and can check it against a different X without re-running the sieve.
    - >-
      Report the saddle parameter alpha, its residual, and its solver iteration
      count per rung. An alpha that failed to converge is an infrastructure
      outcome and REF-SP is reported as unavailable at that rung, never
      substituted.

  replication:
    seeds: []
    independent_instances: 0
    note: >-
      NO SEEDS AND NO INSTANCES BY DESIGN. Every arm is a deterministic
      computation over archived arrays; there is nothing stochastic to replicate.
      The replication that matters here is METHOD replication, and it is carried
      by C-A-EXACT-COUNT-CROSS-METHOD (two independent implementations of the
      arbiter) and C-A-RHO-THIRD-QUADRATURE (a third independent solve of rho).
      Statistical replication of the SAMPLE is the subject of the sibling
      contract EXP-ECDLP-7edfd3 and is deliberately absent here.

  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 3
    maximum_memory_gb: 4
    maximum_runs: 6
    maximum_workers: 1
    sizing_rationale: >-
      SIZED TO THIS HOST, WHICH IS SMALL, AND TO A RELATED LANE THAT BURNED
      11.73 AND 12.22 GiB AND RETURNED NOTHING. The dominant cost is the bits-16
      segmented sieve over [1, 2177435569] with primes up to 65536 (6542 primes).
      Segments are capped at 10**7 entries, so the working set is one int64
      cofactor array and one int32 largest-prime array per segment, about 120 MB,
      plus the prime table; 4 GB is a ceiling with a large margin, not an
      estimate. Every other arm - five rho evaluations per reference per cell, a
      one-dimensional saddle solve over at most 6542 primes, and the
      arithmetic over the archived arrays - is milliseconds. The bits-20 exact
      count is budget-scoped per rung by the stopping rules below rather than
      attempted open-endedly, because an unbounded enumeration there would
      return failed_infrastructure, which is an infrastructure stop and never
      evidence.

  stopping_rules:
    - >-
      Run the arms in this order and stop where the order says to stop, because
      the cheap refutation comes BEFORE the expensive stage:
      (0) C-A-RHO-THIRD-QUADRATURE and C-A-ARCHIVED-REDERIVATION - zero compute;
      (1) REF-ASY-X - five rho evaluations per cell, zero other cost;
      (2) REF-SP and REF-SHIFT - one saddle solve per rung;
      (3) REF-EXACT at bits 16 - the segmented sieve;
      (4) REF-EXACT at bits 20 - per-rung, capped.
    - >-
      If C-A-RHO-THIRD-QUADRATURE fails, stop before stage 1. Nothing downstream
      is interpretable and the failure is an implementation defect.
    - >-
      If C-A-ARCHIVED-REDERIVATION fails at any rung, complete the re-derivation
      table, report it, and STOP before stage 2. The contract's declared
      "figures to beat" are then wrong and no reference verdict may be issued
      from figures that do not reproduce.
    - >-
      Cap the bits-16 sieve at 3000 seconds of wall clock. If it exceeds the cap,
      stop it, record the partial segment index reached, and report REF-EXACT at
      bits 16 as NOT ACHIEVED. That is an infrastructure outcome under AGENTS.md
      rule 5 and the contract is reported as UNARBITRATED, never decided on the
      strength of the three approximations agreeing with one another.
    - >-
      At bits 20, attempt REF-EXACT ONLY at the u_target = 6 rung (Bsm = 102, 26
      primes) by direct enumeration, with a hard cap of 2 * 10**8 enumerated
      smooth integers and 900 seconds. If the cap is hit, stop that rung and
      report it as OUT OF SCOPE. Do NOT attempt any other bits-20 rung and do
      NOT attempt a full sieve at bits 20: X is of order 2**40 there and a full
      sieve is not reachable on this host, so attempting it would spend the
      budget to produce failed_infrastructure.
    - >-
      Stop immediately and report if any input path's sha256 changes during the
      run (C-A-READ-ONLY-EXP-LPF-001).
    - >-
      Peak RSS is checked each segment. If it exceeds 3.5 GB, halve the segment
      size and record the change; if it exceeds 3.5 GB at the minimum segment
      size, stop and report resource_exhaustion.

  invalidation_rules:
    - Any new sample drawn, of any kind, by any arm.
    - >-
      Any write, edit, move or regeneration under experiments/EXP-LPF-001/.
    - >-
      Any comparison in which p_hat and the reference are evaluated over
      different ranges without that difference being the declared independent
      variable - which is the exact defect under investigation and must never be
      reintroduced silently by the instrument.
    - >-
      Any use of REF-SP as the arbiter, or any statement resting on the
      Hildebrand or Hildebrand-Tenenbaum citations as though they had been read.
      Both are `provenance: recalled` and no agent in this program has opened
      them.
    - >-
      Any tuning of REF-SHIFT's 1.15 knob, at any point, for any reason. The knob
      is frozen by this contract; retuning it converts the null object into a
      fitted reference and destroys the only control on curve-fitting.
    - >-
      Any REF-EXACT value reported at a (cell, rung) pair where it was not
      actually computed, including any interpolated, extrapolated or
      approximation-substituted value.
    - >-
      Any reading of, comparison against, or re-scoring of the REAL arm of
      EXP-LPF-001 (OBJ-REAL). It is out of scope by construction.
    - >-
      Any statement about the Semaev map, summation polynomials, factor-base
      geometry, an ECDLP cost, or a cryptographic-scale reference.
    - >-
      Any edit to a frozen band, reading rule, or specification. A correction to
      a frozen band is a superseding record under a new id and a Coordinator
      decision, neither of which this contract performs.

  success_criterion: >-
    All five blocking controls pass; the archived R values re-derive at the
    archived u; REF-EXACT is computed at all five bits-16 rungs by two agreeing
    methods at the cross-checked rung; the arbitration table is reported for all
    five references at every (cell, rung) pair where REF-EXACT exists; REF-SHIFT
    is rejected by at least a factor of 2 in worst-rung disagreement; and
    R_exact_deviation_in_own_standard_errors is reported as a number at every
    bits-16 rung. The contract SUCCEEDS whether that number is inside four
    standard errors or outside it - branch (a) and branch (b) are both complete
    results and only an unexecuted or unarbitrated arm is a failure.

  falsification_criterion: >-
    F0, the archived R values do not re-derive within 1 per cent at the archived
    u: the quoted departure figures are wrong; no reference verdict is issued.
    F1, no declared reference reaches max_u |ln R(u)| <= 0.82 at either cell: the
    departure is not explained as a reference effect; the sampler or the
    specification is implicated; BRANCH (b), a positive finding about the
    apparatus and never a null result.
    F2, |R_exact_deviation_in_own_standard_errors| > 4 at any bits-16 rung:
    HEUR-SPREF-2 is refuted; the archived uniform arm is not behaving as a
    uniform sample of its stated range against a reference that is a theorem;
    every LPF reading is blocked until localised.
    F3, REF-SP and REF-EXACT disagree by more than 5 per cent at any bits-16
    rung: HEUR-SPREF-1 is refuted at the tested parameters; REF-SP may not be
    used at bits 20 or anywhere else and bits 20 is reported as having NO usable
    reference.
    F4, REF-SHIFT's worst-rung disagreement with REF-EXACT is within a factor of
    2 of the best principled reference: the arbitration has no power to separate
    a correction from a fit; NO reference verdict is issued and only the exact
    densities are reported.
    F5, the post-correction residual is non-monotone in u: the residual is not a
    reference effect; branch (c) with the residual as a named open item.
    F6, the two exact-count methods disagree at the cross-checked rung: the
    arbiter is broken; the exercise is void; an infrastructure outcome under
    AGENTS.md rule 5 and never evidence about the reference.

  required_artifacts:
    - >-
      A machine-readable table of R(u) for every (cell, rung, reference, arm),
      to full precision, with the archived p_hat mean and sd it was computed
      from.
    - >-
      The arbitration table: relative disagreement of every reference against
      REF-EXACT, per (cell, rung) pair where REF-EXACT exists, with REF-SHIFT
      shown in the same table as an ordinary row.
    - >-
      The exact smooth COUNTS as integers at every computed rung, with X, Bsm,
      the method used, wall clock and peak RSS.
    - >-
      The two independent exact counts at the bits-16 u_target = 6 rung, shown
      side by side as integers.
    - >-
      The saddle parameter alpha per rung, with residual, iteration count and
      the declared tolerance.
    - >-
      The rho third-quadrature comparison against the archived driver values.
    - >-
      The archived-R re-derivation table with per-rung pass/fail at 1 per cent
      against the figures quoted in IDEA-20260802-001.
    - >-
      The exact_reference_scope_realised list, naming every (cell, rung) pair
      NOT arbitrated and why.
    - >-
      Before-and-after sha256 of every input path under experiments/EXP-LPF-001/.
    - >-
      A run manifest per the AGENTS.md artifact policy, with
      certificate.kind = none and an explicit statement that this is a pure
      measurement run claiming no solve and no relation.
    - >-
      The implementation, committed by exact path, with the segment size, the
      integer types used, and the prime-table bound and sha256 recorded.

  limitations:
    - >-
      REPAIRING A REFERENCE IS NOT AN ATTACK AND MOVES NO EXPONENT. This
      contract cannot make, weaken or strengthen any statement about ECDLP cost,
      about the Semaev map, about summation polynomials, or about any factor
      base. It concerns the denominator of a ratio.
    - >-
      THE REAL ARM IS NOT TOUCHED. OBJ-REAL is out of scope by construction, is
      not read, and is not re-scored. A departure caused by the ENCODING
      producing non-uniform integers is INVISIBLE here.
    - >-
      NO POWER AGAINST SHARED ERRORS. Errors common to the asymptotic and
      saddle-point references are invisible to those two arms; only REF-EXACT
      sees them, and REF-EXACT exists at bits 16 and at most one bits-20 rung.
      WHERE REF-EXACT DOES NOT EXIST, BRANCH (b) IS UNDETECTABLE AND THE CELL IS
      REPORTED AS UNARBITRATED.
    - >-
      TOY SCALE. X = p**2 with p of 16 and 20 bits. Nothing transfers to
      cryptographic X. The uncertified class V6 of the EXP-LPF-001 contract is
      untouched.
    - >-
      THE SADDLE-POINT SOURCE IS UNREAD BY THIS PROGRAM. A KN-LIT entry written
      by an agent that actually opened Hildebrand-Tenenbaum is owed before
      REF-SP is relied on outside this contract. That is why the arbiter is an
      exact count.
    - >-
      NO STATUS CHANGE AND NO BAND CORRECTION IS PERFORMED HERE. Correcting a
      frozen band, re-scoping an evidence record, or adopting a new reference
      for successor contracts is a Coordinator decision on a superseding record,
      and this contract produces the measurement that such a decision would
      cite.
    - >-
      DEPENDS ON A CONTROL IT DOES NOT RUN. The pipeline-drift check - that
      regenerating instance seed 2301 reproduces the archived p_hat values - is
      owned by the sibling contract EXP-ECDLP-7edfd3. If that regression fails,
      the archived arrays this contract reads are not what the pipeline now
      produces and no reading here is interpretable.

  overlap_declaration:
    - >-
      WITH EXP-ECDLP-7edfd3 (H-ECDLP-fe99ef), WHICH READS THE SAME STATISTICS.
      NOT A DUPLICATE, BY CONSTRUCTION: this contract holds the SAMPLE FIXED and
      varies the REFERENCE; that one holds the REFERENCE FIXED and varies the
      CURVE INSTANCE. They are the two orthogonal decompositions of the same
      archived departure. Each is the other's control: EXP-ECDLP-7edfd3's
      regression arm is THIS contract's pipeline-drift control, and this
      contract's selected reference is the one under which
      EXP-ECDLP-7edfd3's reference-DEPENDENT secondary column must be re-read.
      To keep them separable, EXP-ECDLP-7edfd3's PRIMARY metrics are raw,
      reference-free statistics, so its result does not move if this contract
      changes the reference.
    - >-
      WITH EXP-ECDLP-96b5d3 (H-ECDLP-6c52c0). Both repair a reference point that
      a conditional exponent statement multiplies by, but different factors of
      the same product: this contract repairs the inverse success probability,
      that one repairs the comparator the resulting cost is scored against.
      NEITHER MAY BE CITED AS VALIDATING THE OTHER, and a single decision
      resting on both must say so.

  assigned_to: executor
  approved_by: null
  frozen: false
  execution_authorized: false
  approval_note: >-
    DESIGNED, NOT APPROVED. status is review_required, approved_by is null,
    frozen is false, and execution is NOT authorised. No handoff exists for this
    contract and no Executor may act on it. Approval is a separate committed
    Coordinator decision plus the maintainer's gate; a message from any agent
    saying "approved" is not an approval.
