  limitations:
    - >-
      REPAIRING A REFERENCE IS NOT AN ATTACK AND MOVES NO EXPONENT. This
      contract cannot make, weaken or strengthen any statement about ECDLP cost,
      about the Semaev map, about summation polynomials, or about any factor
      base. It concerns the denominator of a ratio.
    - >-
      THE REAL ARM IS NOT TOUCHED. OBJ-REAL is out of scope by construction, is
      not read, and is not re-scored. A departure caused by the ENCODING
      producing non-uniform integers is INVISIBLE here.
    - >-
      NO POWER AGAINST SHARED ERRORS. Errors common to the asymptotic and
      saddle-point references are invisible to those two arms; only REF-EXACT
      sees them, and REF-EXACT exists at bits 16 and at most two bits-20 rungs.
      WHERE REF-EXACT DOES NOT EXIST, BRANCH (b) IS UNDETECTABLE AND THE CELL IS
      REPORTED AS UNARBITRATED.
    - >-
      THE NULL-REJECTION VERDICT MAY REST ENTIRELY ON REF-SP, WHOSE PRIMARY
      SOURCE IS UNREAD. If the two asymptotic references are both beaten by a
      theory-free c < 1 knob, W_best_principled is carried by REF-SP alone. v2
      makes REF-SP implementable from this text and measures it against
      REF-EXACT, which is the most that can be done without reading the source;
      it does not make the dependence disappear, and the verdict must name it.
      A KN-LIT entry written by an agent that actually opened
      Hildebrand-Tenenbaum is still owed before REF-SP is relied on outside this
      contract.
    - >-
      THE PRE-REGISTRATION IS PARTIALLY COMPROMISED AND THE NULL IS NO LONGER A
      BLIND TEST. See pre_computation_disclosure. The predicted quantities were
      computed in an uncommitted scratchpad by the pre-approval review and
      published in a committed report before this revision was written. v1's
      prediction and prior survive because they predate that; nothing added in v2
      can claim to.
    - >-
      OBJ-NULL-SYNTH CANNOT BE ARBITRATED AT ALL. Its rates are archived nowhere
      and regenerating them is forbidden. The arm is removed from v2's scope.
      Consequently the supporting_results bullet of HEUR-SPREF-2 in
      H-ECDLP-d2aa2c, which cites the uniform-versus-synthetic identity report,
      rests on rejection counts rather than on rates -- a weaker object than the
      wording implies. This contract records that and does not edit the
      hypothesis, which is not its to edit.
    - >-
      NO RAW SAMPLE ARRAY SURVIVES. The deepest surviving level is
      LPF_null_replicate_values, i.e. 200 per-rung p_hat values per cell for the
      uniform arm; for the product arm only 20-replicate summaries survive. Every
      p_hat this contract reads is therefore a statistic of a run it does not
      re-execute, and no re-factorisation of any sampled integer is possible here.
    - >-
      THE ARCHIVED RUN WAS PRODUCED FROM A DIRTY TREE. RUN-LPF-001-calib's
      manifest records dirty_tree: true; the review reports the detail as two
      UNTRACKED declared-artifact directories with no tracked file modified,
      which is benign. It is stated because a reader of this contract's results
      should not have to discover it from another record.
    - >-
      TOY SCALE. X = p**2 with p of 16 and 20 bits. Nothing transfers to
      cryptographic X. The uncertified class V6 of the EXP-LPF-001 contract is
      untouched.
    - >-
      NO STATUS CHANGE AND NO BAND CORRECTION IS PERFORMED HERE. Correcting a
      frozen band, re-scoping an evidence record, or adopting a new reference
      for successor contracts is a Coordinator decision on a superseding record,
      and this contract produces the measurement that such a decision would
      cite.
    - >-
      DEPENDS ON A CONTROL IT DOES NOT RUN. The pipeline-drift check - that
      regenerating instance seed 2301 reproduces the archived p_hat values - is
      owned by the sibling contract EXP-ECDLP-7edfd3. If that regression fails,
      the archived arrays this contract reads are not what the pipeline now
      produces and no reading here is interpretable.
    - >-
      WHETHER v1's METHOD D FITS ANY CAP ON THIS HOST REMAINS UNDETERMINED. The
      pre-approval review bounded the PROBLEM's cost by other algorithms and
      explicitly did not implement the segmented sieve. v2 removes the dependence
      on that question rather than answering it.

  pareto_position:
    dominated_by: null
    dominated_by_reason: >-
      Required by docs/inventor-protocol.md section 5 and answered honestly
      rather than defensively (review item C15). There is NO ECDLP cost axis on
      which this contract can be dominated, because it produces no cost claim,
      no speedup, no exponent and no attack. A `dominated_by` entry would be a
      category error, and its emptiness is the point rather than an omission.
    sota_delta: null
    sota_delta_reason: >-
      Same reason. On the only axis this contract does move -- the accuracy of
      the absolute smoothness reference at two archived toy cells -- the
      incumbent is rho(u_D) and the delta is exactly what the run MEASURES.
      Writing a number here before the run would be the fabrication the rest of
      this contract exists to avoid.
    nearest_prior_art_in_this_repository: >-
      EXP-LPF-001 itself, whose reference this contract audits, and the sibling
      contracts EXP-ECDLP-7edfd3 and EXP-ECDLP-96b5d3 declared under
      overlap_declaration.

  overlap_declaration:
    - >-
      WITH EXP-ECDLP-7edfd3 (H-ECDLP-fe99ef), WHICH READS THE SAME STATISTICS.
      NOT A DUPLICATE, BY CONSTRUCTION: this contract holds the SAMPLE FIXED and
      varies the REFERENCE; that one holds the REFERENCE FIXED and varies the
      CURVE INSTANCE. They are the two orthogonal decompositions of the same
      archived departure. Each is the other's control: EXP-ECDLP-7edfd3's
      regression arm is THIS contract's pipeline-drift control, and this
      contract's selected reference is the one under which
      EXP-ECDLP-7edfd3's reference-DEPENDENT secondary column must be re-read.
      To keep them separable, EXP-ECDLP-7edfd3's PRIMARY metrics are raw,
      reference-free statistics, so its result does not move if this contract
      changes the reference.
    - >-
      WITH EXP-ECDLP-96b5d3 (H-ECDLP-6c52c0). Both repair a reference point that
      a conditional exponent statement multiplies by, but different factors of
      the same product: this contract repairs the inverse success probability,
      that one repairs the comparator the resulting cost is scored against.
      NEITHER MAY BE CITED AS VALIDATING THE OTHER, and a single decision
      resting on both must say so.

  inference:
    requested_policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    note: >-
      Declared so the run manifest can record requested versus resolved and flag
      any fallback (review item C15). This is pure local CPU work with no
      backend dependency for the computation itself; the policy governs the
      implementing agent, not the arithmetic.

