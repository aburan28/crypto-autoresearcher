          its outcome is entailed by monotonicity of rho plus the committed
          incumbent R values, which makes it worthless as a null but genuinely
          useful as a plumbing check -- if the run ever reports
          W(REF-SHIFT-UP) <= W(REF-ASY-D) something is wired wrong. It costs five
