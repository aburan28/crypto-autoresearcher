experiment:
  id: EXP-ECDLP-a1c262
  hypothesis_id: H-ECDLP-d2aa2c
  question_id: RQ-ECDLP-002
  goal_id: null
  version: 2
  supersedes_version: 1
  status: review_required
  claim_tier: toy
  title: >-
    Four-reference arbitration of the EXP-LPF-001 absolute smoothness reference
    against an EXACTLY COMPUTED smooth-number density at the bits-16 cell, with
    a null reference knobbed IN THE COLLISION DIRECTION that must be rejected on
    a non-saturating log statistic, run entirely on archived arrays with no new
    sampling and no curve arithmetic

  objective: >-
    Decide whether the archived departure of the KNOWN-UNIFORM calibration arm of
    RUN-LPF-001-calib from the asymptotic Dickman reference is a property of the
    REFERENCE or of the SAMPLER, by recomputing R(u) = p_hat(u)/reference(u) for
    the ARCHIVED uniform arm under three principled references plus two knobbed
    null references, and arbitrating them against an EXACT count Psi(X, Bsm) at
    the bits-16 cell and at every bits-20 rung where an exact count is reachable.
    The exact count is the arbiter because it is a theorem and has no fitted knob,
    and because the saddle-point estimator's primary source is a RECALLED citation
    no agent in this program has opened.
    THIS CONTRACT MOVES NO EXPONENT, MOUNTS NO ATTACK, AND MAKES NO STATEMENT
    ABOUT THE SEMAEV MAP OR THE REAL ARM OF EXP-LPF-001 IN EITHER DIRECTION.
    Repairing a reference is not an attack.
    BUDGET SUB-FLOOR JUSTIFICATION, STATED IN THE OBJECTIVE BECAUSE
    templates/research-records.md REQUIRES IT THERE (review item C12).
    maximum_memory_gb is declared at 4, below the template's 8 GB floor, because
    every declared working set is bounded by construction and none approaches it.
    The exact-count methods are cost-proportional-to-COUNT, not to X.
    Method B materialises smooth integers only at rungs below a declared cap of
    10**7 integers (10**7 * 8 bytes = 80 MB as int64). Method C's Lucy_Hedgehog
    stage holds arrays of length about 2*sqrt(X); since X = p**2 exactly,
    sqrt(X) = p exactly, so that is about 2p entries -- of order 9.3e4 at bits 16
    and, with the bits-20 p the executor re-reads, of order 1.5e6, i.e. tens of
    megabytes as int64. Method A is a recursion whose memory is O(depth) in the
    prime index. Only the DEMOTED fallback Method D holds a large array, and it
    is segmented at 10**7 entries (one int64 cofactor array at 80 MB plus one
    int32 largest-prime array at 40 MB, about 120 MB per segment). 4 GB is
    therefore a ceiling with more than an order of magnitude of margin, not an
    estimate; declaring 8 GB would overstate the requirement on a host the
    related lane already exhausted at 11.73 and 12.22 GiB.
    THIS VERSION IS A REVISION, NOT AN APPROVAL. status is review_required,
    approved_by is null, frozen is false, execution_authorized is false.

  pre_computation_disclosure:
    blinding_status: COMPROMISED, AND THIS IS DISCLOSED RATHER THAN MANAGED AWAY
    what_happened: >-
      The independent pre-approval review recorded at
      coordination/reviews/approval-a1c262-20260904/validation_report.yaml
      (VAL-20260904-821aee) computed, in an uncommitted session-local scratchpad,
      most of the quantities this contract exists to compute: an independent rho
      solve at integer and archived non-integer u, the archived-R re-derivation,
      exact smooth counts at five bits-16 rungs and one bits-20 rung, R_exact and
      its deviation in archived standard errors at those rungs, saddle-point
      agreement figures, and worst-rung disagreement for the incumbent, the
      range-corrected asymptotic, the v1 null, a c < 1 null and a fitted knob.
      Those figures are published in a COMMITTED review report. The reviewer
      declared them not evidence, uncommitted, unmanifested and session-local,
      and said that to be cited any of them must be produced again by an approved
      run. That declaration is correct and this contract adopts it.
    consequence_for_this_contract: >-
      The agent that wrote this revision READ THOSE FIGURES BEFORE WRITING IT.
      Every threshold, ordering and null-object choice in v2 was therefore made
      with partial knowledge of the answers. This cannot be undone by any wording,
      so it is declared instead:
      (i) preregistered_prediction is CARRIED VERBATIM FROM v1 and is not
      touched, so its pre-registration survives -- it was frozen at the v1 design
      commit 4d7685379d2eceb91b3422f962f5a895ba76f436, before those figures
      existed. NO NEW PREDICTION IS ADDED IN v2.
      (ii) v1's coordinator_prior is carried VERBATIM for the same reason. The v2
      addendum to it is explicitly labelled as post-exposure and is NOT a prior.
      (iii) The null knob c = 20/23 = 1/1.15 is the value the review itself named
      AFTER measuring how it performs. It is frozen here anyway, because any
      other choice made by this agent would be equally post-exposure and less
      auditable, and because a knob chosen to be the reviewer's own suggestion is
      at least not chosen by the party whose design it tests.
      (iv) The declared thresholds k = 3 (F5) and the factor of 2 (null
      rejection) are conventional and structural, not fitted; but this agent
      cannot claim they were chosen blind, and does not.
    what_the_run_still_establishes: >-
      Reproduction by an approved, manifested run with committed code, over
      committed inputs, under declared controls -- which is the only thing that
      makes any of these numbers citable at all. Nothing in the review's
      scratchpad is committed, so an approved run is not confirming a record; it
      is creating the first one. It also independently tests whether the review's
      uncommitted figures are right, which nothing currently does.
    executor_obligation: >-
      The run report must state, as a declared fact, whether the implementing
      session read the numeric tables of VAL-20260904-821aee before writing its
      implementation. It is not forbidden -- a prohibition that cannot be checked
      is theatre -- but it must be recorded, because a cross-method agreement
      between an implementation and a figure it was written against is worth
      less than one between two blind implementations, and a later reader must be
      able to tell which happened.

  independent_variables:
    - name: reference
      values:
        - REF-ASY-D
        - REF-ASY-X
        - REF-SP
        - REF-EXACT
        - REF-SHIFT-DOWN
        - REF-FIT-CEILING
        - REF-SHIFT-UP
      note: >-
        REF-SHIFT-DOWN and REF-FIT-CEILING are the NULL CLASS. REF-SHIFT-UP is
        NEITHER a null nor a candidate: it is v1's superseded null, retained only
        as a declared instrument check (see declared_non_controls). REF-EXACT is
        the arbiter and is never scored as a candidate against itself.
    - name: cell_field_bits
      values: [16, 20]
    - name: rung_u_target
      values: [2, 3, 4, 5, 6]
    - name: archived_arm
      values: [OBJ-NULL-UNIF, OBJ-CTRL-PRODUCT]
      note: >-
        OBJ-NULL-SYNTH IS REMOVED IN v2 (review item C6). Its rates are not
        archived at any level -- the driver records only per-statistic rejection
        counts for it -- so the level was unpopulated and the required R table was
        not producible for it. Its only execution path, redrawing the arm, is
        forbidden by C-A-NO-NEW-SAMPLING and by the first invalidation rule.

  inputs:
    archived_source_of_record:
      - experiments/EXP-LPF-001/results/calib/null_replicate_statistics.json
      - experiments/EXP-LPF-001/results/calib/dickman_reference_reproduction.json
      - experiments/EXP-LPF-001/results/calib/apparatus_identity_report.json
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/raw-result.json
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/manifest.yaml
      - experiments/EXP-LPF-001/implementation/lpf001_driver.py
    immutability: >-
      EVERY PATH ABOVE IS READ-ONLY, AND SO IS EVERY OTHER PATH UNDER
      experiments/EXP-LPF-001/. No file there may be written, edited, moved,
      regenerated, or created by this experiment -- including files no declared
      input names, such as a __pycache__ directory produced by importing the
      driver. Any write there invalidates the run. lpf001_driver.py is READ as
      text and is NEVER imported or executed; if any helper must run in the same
      interpreter, it runs with bytecode writing disabled.
    frozen_cell_constants_to_be_re_read_not_assumed:
      bits16: {p: 46663, X_equals_p_squared: 2177435569, D: 4294967296,
               X_over_D: 0.5069737250450999, n_per_sample_set: 130816,
               replicates_uniform_arm: 200,
               bsm_ladder: [65536, 1626, 256, 84, 40]}
      bits20: {p: read from the archived bits-20 descriptor, X: p squared,
               D: 1099511627776, n_per_sample_set: 130816,
               replicates_uniform_arm: 200,
               bsm_ladder: [1048576, 10321, 1024, 256, 102]}
      replicates_product_arm: >-
        20, NOT 200 (review item C7). The archived OBJ-CTRL-PRODUCT arm is
        recorded in raw-result.json movement_rows with `replicates: 20`. This
        value is transcribed from the pre-approval review, which read it; this
        coordinator did not. THE EXECUTOR RE-READS THE REPLICATE COUNT PER ARM
        PER CELL and uses the value it reads. Every standard error in this
        contract is se_rel(u; arm) = sd(u; arm) / (sqrt(N_rep(arm)) * mean(u; arm))
        with N_rep read back, never assumed to be 200.
      note: >-
        The bits-16 values are transcribed here from the committed descriptor so
        that a transcription error is detectable, and the pre-approval review
        independently confirmed every one of them against the archive. The
        executor RE-READS them from the archived files and reports any mismatch
        as an invalidation, never as a finding. The bits-20 p is deliberately NOT
        transcribed because this coordinator did not read it; inventing it would
        be a fabrication. The review reports p = 767551, X = 589134537601 and
        X_over_D = 0.5358147405795535 for that cell; those are recorded here as a
        REVIEWER-REPORTED PRIOR from an uncommitted computation, and the executor
        reads the archive rather than these numbers.
    reference_definitions:
      REF-ASY-D: >-
        THE ARCHIVED INCUMBENT. rho(u_D) with u_D = ln(D)/ln(Bsm), rho solved
        from the Dickman delay equation rho(u) = 1 on [0,1] and
        u*rho'(u) = -rho(u-1) for u > 1. Reproduces the driver's own choice.
        PRINCIPLED CLASS -- zero parameters fitted to any archived or exact
        quantity.
      REF-ASY-X: >-
        THE RANGE-CORRECTED ASYMPTOTIC, AND THE CHEAPEST ARM IN THE CONTRACT --
        WHICH IS NOT THE SAME AS BEING THE CANDIDATE ANSWER, AND v1'S FRAMING IS
        CORRECTED HERE. rho(u_X) with u_X = ln(X)/ln(Bsm) = u_D * ln(X)/ln(D),
        X = p**2. Motivated by two verbatim facts in the committed driver:
        samples are drawn on [1, p**2] while u is computed from D. FIVE
        EVALUATIONS OF rho PER CELL, ZERO OTHER COST. It corrects the ARGUMENT
        error only and does nothing about the finite-y error, so it is not
        expected to carry the whole departure and the contract does not present
        it as a candidate answer. PRINCIPLED CLASS.
      REF-SP: >-
        THE SADDLE-POINT ESTIMATOR, WRITTEN DOWN IN FULL HERE AS AN
        IMPLEMENTATION CHOICE UNDER TEST AND NOT AS A CITED THEOREM (review item
        C5). PRINCIPLED CLASS -- it has no parameter fitted to any archived or
        exact quantity; alpha is determined by (x, y) alone.
        DEFINITION. For x = X and y = Bsm, let the primes p <= y be p_1..p_k and
        set
          f(s)   = ln zeta(s, y) = -sum_{p <= y} ln(1 - p**(-s))
          f'(s)  = -sum_{p <= y} ln(p) / (p**s - 1)
          f''(s) =  sum_{p <= y} (ln p)**2 * p**s / (p**s - 1)**2
        The saddle alpha is the unique positive root of -f'(alpha) = ln x, i.e.
          sum_{p <= y} ln(p) / (p**alpha - 1) = ln(x).
        The left side is strictly decreasing in alpha, tends to +infinity as
        alpha -> 0+ and to 0 as alpha -> +infinity, so for ln x > 0 the root
        exists and is unique; that is a property of the stated sum, checkable
        here, and not an appeal to any source.
        THE ESTIMATOR IS
          Psi_SP(x, y) = x**alpha * zeta(alpha, y) / (alpha * sqrt(2*pi*f''(alpha)))
        evaluated in logarithms to avoid overflow,
          ln Psi_SP = alpha*ln(x) + f(alpha) - ln(alpha) - 0.5*ln(2*pi*f''(alpha)),
        and REF-SP(u) = Psi_SP(X, Bsm) / X = exp(ln Psi_SP - ln X).
        SOLVER. Bracket by doubling outward from alpha = 1 until the sum
        straddles ln x, then bisect to a bracket width below 1e-12, then Newton
        using f''(alpha) as the derivative of the residual, stopping when
        |sum - ln x| <= 1e-12 * ln x or after 200 iterations. alpha, the
        residual, the iteration count and the bracket are recorded per rung. A
        rung whose solve does not meet the tolerance is reported as REF-SP
        UNAVAILABLE at that rung and is never substituted.
        PROVENANCE OF THE FORM, STATED PLAINLY. This expression is RECALLED by
        the coordinator writing this revision, and the same form is recalled
        independently in VAL-20260904-821aee. TWO RECOLLECTIONS ARE NOT A
        READING. This contract does NOT assert that this is the estimator of
        Hildebrand and Tenenbaum (1986), does NOT assert any error term for it,
        and does NOT rely on either recalled citation for anything. What it
        asserts is that the formula above is a fully specified, knob-free
        function of (x, y) that an executor can implement from this text alone,
        and that its accuracy at the tested parameters is MEASURED against
        REF-EXACT here and asserted nowhere else. IT IS NEVER THE ARBITER.
      REF-EXACT: >-
        THE ARBITER. The exact density Psi(X, Bsm)/X, counted over the SAME
        RANGE [1, X] the sample is drawn from, by the methods and in the cost
        order declared in exact_count_methods. CONVENTION, DECLARED: n = 1 is
        counted as Bsm-smooth for every Bsm, in every method, because 1 has no
        prime factor above any bound. This matters for the exact-equality
        cross-method control and nowhere else: the density effect of including
        or excluding it is 1/X = 1/2177435569 = 4.6e-10 at bits 16, which is
        about six orders of magnitude below the smallest archived se_rel, so it
        cannot affect any comparison against the sample. The executor states
        which convention the driver's own factorisation uses if that is readable,
        and reports it as a note, never as a correction.
      REF-SHIFT-DOWN: >-
        THE NULL OBJECT (review item C1). rho(c_null * u_D) with
        c_null = 20/23 = 1/1.15 exactly (0.8695652173913043 to sixteen digits;
        20/23 is exact in rationals and 1.15 = 23/20). A deliberate, theory-free
        reparameterisation with a knob FROZEN BY THIS CONTRACT BEFORE ANY
        COMPUTATION IN THIS EXPERIMENT and never tuned.
        WHY THIS DIRECTION AND NOT v1's. The collision the hypothesis itself
        names in proof_search_map.observation_collision is "ANY monotone
        reparameterisation u -> c*u with c < 1 raises the reference and lowers R
        at every rung". c < 1 is the direction that can collide with the
        correction under test; c > 1 is a direction in which rho is smaller, R is
        larger, and the null is pushed further from the exact count at every rung
        by monotonicity alone. v1 used c = 1.15 and therefore aimed the null away
        from the only region where it could collide.
        NULL CLASS. It is run through the IDENTICAL arbitration as the
        principled references and appears as an ordinary row in every table.
      REF-FIT-CEILING: >-
        THE DECLARED FITTED-KNOB CEILING (review item C1). c_fit is the single
        multiplier minimising the worst-rung log disagreement with REF-EXACT,
          c_fit = argmin_c  max_{u in arbitrated rungs} |ln( rho(c*u_D(u)) / REF-EXACT(u) )|,
        searched over the closed bracket c in [0.5, 1.5] by a dense scan at step
        0.001 followed by golden-section refinement to a bracket width below
        1e-6, per cell, over exactly the rungs where REF-EXACT exists at that
        cell. c_fit, the search bracket, the step, the achieved bracket width and
        the attained worst-rung value are all reported.
        IT IS REPORTED AND IT IS NEVER SELECTED, EVER. It is fitted on the very
        data it is scored against and has no independent content; it exists to
        state the ceiling that a one-parameter theory-free family reaches, so
        that a principled reference's performance can be read against something
        other than zero. Any use of it as a reference, in this contract or a
        successor, is an invalidation.
      REF-SHIFT-UP: >-
        v1's SUPERSEDED NULL, rho(1.15 * u_D), RETAINED AS AN INSTRUMENT CHECK
        AND EXPLICITLY NOT AS A CONTROL AND NOT AS A NULL. Five rho evaluations
        per cell, zero other cost. Its outcome is ENTAILED: rho is strictly
        decreasing, so rho(1.15*u_D) < rho(u_D) pointwise; and the archived
        incumbent R exceeds 1 at every bits-16 rung, so REF-ASY-D already
        under-estimates the exact density there, so an even smaller reference is
        strictly further from it. A run that reports
        W(REF-SHIFT-UP) <= W(REF-ASY-D) at any bits-16 rung set has a plumbing
        error, not a finding. See declared_non_controls.

  arbitration_rules:
    statistic: >-
      THE ARBITRATION STATISTIC IS THE LOG DISAGREEMENT (review item C2):
        L(ref, cell, u) = |ln( reference(u) / REF-EXACT(u) )|
      and the per-reference summary is the worst rung,
        W(ref, cell) = max over arbitrated rungs u of L(ref, cell, u).
      EVERY ratio comparison, selection rule, null criterion and falsification
      condition in this contract is stated on L and W and on nothing else.
    why_the_v1_statistic_was_replaced: >-
      v1 arbitrated on the relative form |ref - exact| / exact. For any reference
      BELOW the exact density that quantity equals 1 - ref/exact and is therefore
      bounded above by 1, so a "worse by at least a factor of 2" criterion is
      ARITHMETICALLY UNREACHABLE against any comparator whose own relative
      disagreement exceeds 0.5. All the references in play here under-estimate at
      the top rungs, so the v1 criterion was not a weak test but an impossible
      one over most of its domain.
    the_two_forms_are_inter_convertible_and_both_are_reported: >-
      With rel = |ref - exact|/exact and L as above,
        ref < exact  =>  rel = 1 - exp(-L)
        ref > exact  =>  rel = exp(L) - 1
      so no information is lost by reporting both, and the relative column stays
      in every table for readers who want it. WORKED ON THE PRE-APPROVAL REVIEW'S
      OWN UNCOMMITTED FIGURES, RECORDED HERE AS A PRIOR AND NOT AS DATA, PURELY
      TO SHOW THE ARITHMETIC IS THE ARITHMETIC CLAIMED:
        L = 5.2494 -> rel = 1 - exp(-5.2494) = 1 - 0.0052508 = 0.9947 (v1 null)
        L = 1.8980 -> rel = 1 - exp(-1.8980) = 1 - 0.1498670 = 0.8501 (REF-ASY-X)
        L = 2.4488 -> rel = 1 - exp(-2.4488) = 1 - 0.0864    = 0.9136 (REF-ASY-D)
      and the ratio the criterion tests differs by which form is used:
        on rel: 0.9947 / 0.8501 = 1.170  -> FAILS a factor-2 test
        on L  : 5.2494 / 1.8980 = 2.766  -> PASSES a factor-2 test
      SAME TWO REFERENCES, SAME DATA, OPPOSITE VERDICT. That is the whole of
      review item C2 and it is why the statistic, not the null, is the defect
      being repaired here.
    principled_class: [REF-ASY-D, REF-ASY-X, REF-SP]
    null_class: [REF-SHIFT-DOWN, REF-FIT-CEILING]
    class_definition: >-
      PRINCIPLED means: no parameter of the reference is fitted to any archived
      statistic or to any exact count. NULL means: at least one parameter is a
      free knob, whether frozen by declaration (REF-SHIFT-DOWN) or fitted to the
      comparison data (REF-FIT-CEILING). REF-SP is in the principled class
      despite its unread source, because the class is about fitted parameters and
      not about provenance; its provenance is handled separately by writing the
      estimator down in full and by measuring it against REF-EXACT rather than
      asserting it from a citation.
    selection_rule: >-
      A principled reference is SELECTED if L(ref, 16, u) <= ln(1.05) = 0.04879
      at every arbitrated bits-16 rung. If more than one qualifies, the one with
      the smallest W(ref, 16) is selected and the others are reported as also
      qualifying. If none qualifies, NONE IS SELECTED, which is a declared and
      reachable branch.
    comparator_for_the_null_criterion: >-
      THE COMPARATOR IS DEFINED ON EVERY BRANCH, INCLUDING "NONE SELECTED"
      (review item C3):
        W_best_principled(cell) = min over the principled references AVAILABLE at
        that cell of W(ref, cell),
      taken WHETHER OR NOT ANY REFERENCE IS SELECTED. A principled reference is
      "available" at a rung if it was computed there; REF-SP drops out of the min
      at any rung where its saddle solve did not meet tolerance, and that
      exclusion is reported. If NO principled reference is available at a cell,
      the null control reports NOT DECIDABLE at that cell and the contract stops
      rather than issuing a verdict.
    null_rejection_criterion: >-
      THE NULL IS REJECTED at a cell iff
        W(REF-SHIFT-DOWN, cell) >= 2 * W_best_principled(cell)
      evaluated on L, over exactly the rungs where REF-EXACT exists at that cell.
      DEGENERATE-CASE GUARD, DECLARED IN ADVANCE: the ratio is meaningful only if
      something is actually being resolved, so if
        max( W(REF-SHIFT-DOWN, cell), W_best_principled(cell) ) < 0.05
      the ratio is reported as UNINFORMATIVE, the null control is reported as
      UNDISCRIMINATING at that cell, and that fires the no-verdict branch exactly
      as a failure would. Without this guard a pair of references that both track
      the exact count to a fraction of a per cent could pass a factor-2 ratio on
      numerical noise.
      THE ABSOLUTE GAP W(REF-SHIFT-DOWN) - W_best_principled IS REPORTED
      ALONGSIDE THE RATIO AND IS NOT A CRITERION. It is reported because a ratio
      of 75 on a gap of 0.5 and a ratio of 2 on a gap of 2.0 are different
      situations and a reader must be able to tell them apart.
    the_dependence_this_criterion_creates_is_declared_not_hidden: >-
      READ THIS BEFORE READING ANY VERDICT. On the pre-approval review's
      uncommitted figures, W(REF-ASY-X) is about 1.898 at bits 16 while a c < 1
      knob reaches about 0.5235 with no tuning at all. If those figures are
      approximately right, then REF-ASY-X and REF-ASY-D are BOTH BEATEN BY THE
      NULL, and W_best_principled is carried entirely by REF-SP -- the one arm
      whose primary source is unread. Review item C5 states that C1 and C2
      "remove REF-SP's accidental role as the only reference able to reject the
      null". THIS CONTRACT DISAGREES: C1 and C2 do not remove that dependence,
      they EXPOSE it, because the dependence is a fact about the data and not an
      artifact of the metric. v2's answer is not to hide it but to (a) write
      REF-SP down in full so it is implementable and testable without the unread
      source, (b) measure it against REF-EXACT so its accuracy is data and not
      citation, and (c) REQUIRE the verdict to name which reference carried
      W_best_principled at each cell. A verdict carried by REF-SP is reported as
      a verdict carried by REF-SP, with the KN-LIT entry still owed.
    scope_of_arbitration: >-
      Arbitration happens only at (cell, rung) pairs where REF-EXACT was actually
      computed. A pair without REF-EXACT is UNARBITRATED, is listed as such, and
      is never filled from an approximation, an interpolation or an
      extrapolation.

  exact_count_methods:
    ordering_principle: >-
      COST-ORDERED BY SMOOTH COUNT, NOT BY LADDER POSITION (review items C10 and
      C11). Method A and Method B cost work proportional to the NUMBER OF SMOOTH
      INTEGERS, not to X. The smooth count falls steeply as Bsm falls, so the
      DECISION-BEARING rungs -- the high-u rungs where the archived departure is
      largest -- are the CHEAPEST, and they are computed FIRST. v1 made an O(X)
      segmented sieve the primary method and built its stopping rules, its
      "REF-EXACT NOT ACHIEVED" branch and its UNARBITRATED outcome around that
      single cost; that is demoted here to a fallback.
    method_A_recursive_count:
      description: >-
        Exact count of Bsm-smooth integers in [1, X] by recursion over the primes
        p_1 < ... < p_k <= Bsm. With Phi(x, j) = the number of integers in [1, x]
        all of whose prime factors lie among p_1..p_j,
          Phi(x, 0) = 1                      (only n = 1)
          Phi(x, j) = sum over e >= 0 of Phi( floor(x / p_j**e), j-1 )
        and Psi(X, Bsm) = Phi(X, k). Each smooth integer is generated exactly
        once, by its own factorisation, so there is no double counting of prime
        powers and n = 1 is counted once.
      cost_basis: >-
        THE WORK IS PROPORTIONAL TO THE NUMBER OF NODES OF THAT RECURSION, WHICH
        IS BOUNDED BY Psi(X, Bsm) TIMES A SMALL FACTOR, because every node
        corresponds to a distinct smooth integer prefix. It is NOT proportional
        to X. NO WALL-CLOCK FIGURE IS ASSERTED HERE; the executor measures and
        records wall clock and peak RSS per rung. What is asserted is the
        scaling, which follows from the recursion as written.
      memory: O(k) recursion depth plus the prime table; no large array.
    method_B_materialised_enumeration:
      description: >-
        Structurally different cross-check: generate the Bsm-smooth integers
        <= X explicitly (iteratively multiply out the prime powers into a list,
        pruning at X) and count the list length. Uses a different control flow
        and a different data structure from Method A, so a recursion bug and an
        enumeration bug do not coincide.
      applicability_cap: >-
        APPLIED ONLY at rungs whose Method A count is below 10**7 integers
        (10**7 int64 = 80 MB). At a rung above that cap Method B is not run and
        the cross-check at that rung is recorded as not performed, which is a
        scope note and not a control failure.
    method_C_one_large_prime_identity:
      validity_condition: >-
        APPLICABLE ONLY WHERE Bsm**2 > X, VERIFIED IN EXACT INTEGER ARITHMETIC BY
        THE EXECUTOR AT EACH RUNG BEFORE USE. Because X = p**2 exactly, that
        condition reduces to Bsm > p, which is checkable by comparing two
        integers the executor has already re-read. At bits 16 the u_target = 2
        rung has Bsm = 65536 and p = 46663, so 65536 > 46663 holds and
        65536**2 = 4294967296 > 2177435569 = X. At bits 20 the u_target = 2 rung
        has Bsm = 1048576 and the condition is Bsm > p, which the executor checks
        against the p it reads; the review reports p = 767551, which would
        satisfy it, and that is a prior, not an input.
      derivation_stated_in_full_so_it_is_auditable_not_recalled: >-
        If Bsm**2 > X then no n <= X has two prime factors above Bsm, since their
        product would exceed Bsm**2 > X. So every non-smooth n <= X has EXACTLY
        one prime factor P > Bsm, and can be written n = P*m with m <= X/P.
        Moreover m is automatically Bsm-smooth: m <= X/P < Bsm**2/Bsm = Bsm. So
        the non-smooth count is exactly sum over primes P in (Bsm, X] of
        floor(X/P), each n counted once. Hence
          Psi(X, Bsm) = floor(X) - sum_{Bsm < P <= X} floor(X / P).
      evaluation: >-
        The sum is evaluated by grouping the primes P by the distinct value of
        floor(X/P) -- there are O(sqrt X) = O(p) distinct values -- and using a
        prime-counting function evaluated at the O(sqrt X) breakpoints. pi(X/i)
        for all i is computed by the Lucy_Hedgehog dynamic programme, whose
        operation count scales as X**(3/4) = p**(3/2) since X = p**2. AS AN
        OPERATION COUNT AND NOT AS A RUNTIME: p**(3/2) is about 1.0e7 at bits 16
        (46663 * sqrt(46663), sqrt(46663) about 216) and, with the reviewer's
        reported bits-20 p = 767551, about 6.7e8 (767551 * 876). The executor
        re-derives both from the p it reads and MEASURES the wall clock; no
        runtime is asserted here.
    method_D_segmented_sieve_DEMOTED_TO_FALLBACK:
      description: >-
        v1's primary method, now the fallback: one segmented largest-prime-factor
        sieve over [1, X] in segments of at most 10**7 entries, tracking the
        largest prime factor of every integer and counting, in a single pass, how
        many have largest prime factor <= Bsm for all five Bsm simultaneously.
      cost_basis_and_why_it_is_demoted: >-
        Its work is Theta(X) regardless of Bsm, while Methods A and C are
        proportional to the smooth count and to X**(3/4) respectively. The
        pre-approval review's own limitation records that it did NOT implement
        this method, so whether it fits any cap on this host is UNDETERMINED by
        anything committed or uncommitted. v2 does not resolve that question; it
        removes the dependence on it.
      when_it_runs: >-
        ONLY if a Method A rung exceeds its per-stage cap, ONLY at bits 16, and
        ONLY IN A SEPARATE RUN charged against maximum_runs. It is never squeezed
        into the wall clock of the run that hit the cap.
    execution_order:
      - bits 16, u_target 6 (Bsm 40), Method A, then Method B at the same rung
      - bits 16, u_target 5 (Bsm 84), Method A, then Method B at the same rung
      - bits 16, u_target 4 (Bsm 256), Method A, then Method B if under the cap
      - bits 16, u_target 2 (Bsm 65536), Method C, with the fixture checks
      - bits 16, u_target 3 (Bsm 1626), Method A -- the largest bits-16 count
      - bits 20, u_target 2 (Bsm 1048576), Method C, if Bsm > p verifies
      - bits 20, u_target 6 (Bsm 102), Method A under a node cap
    execution_order_rationale: >-
      The three highest-u bits-16 rungs are where the archived departure is
      largest and are the cheapest by count, so they come first; the Method C
      rung is next because its cost is X**(3/4) and independent of the count; the
      u_target = 3 rung is last at bits 16 because its smooth count is the
      largest there. THIS ORDERING IS A COST ORDERING ONLY. No stage's RESULT
      halts the run -- only control failures do -- and no stage is described here
      as a refutation stage.

  metrics:
    primary:
      - name: R_per_rung_per_reference_per_cell_per_arm
        unit: dimensionless ratio
        definition: >-
          R(u) = p_hat(u) / reference(u), where p_hat(u) is the RECOMPUTED mean
          over the archived per-replicate values at that rung for that arm (see
          C-A-SUMMARY-RECOMPUTE) and reference(u) is the declared reference
          evaluated at that rung's Bsm. Reported to full machine precision, one
          row per (cell, rung, reference, arm), with the mean, the sd, the
          replicate count N_rep actually read back, and se_rel.
      - name: R_exact_deviation_in_own_standard_errors
        unit: number of standard errors
        definition: >-
          (R_exact(u) - 1) / se_rel(u; arm), where
          se_rel(u; arm) = sd(u; arm) / (sqrt(N_rep(arm)) * mean(u; arm)) with
          N_rep READ BACK PER ARM (200 for the uniform arm, 20 for the product
          arm per the archive). THIS IS THE DECISION VARIABLE FOR THE UNIFORM
          ARM. Available only where REF-EXACT exists. UNDEFINED and reported as
          UNDEFINED wherever se_rel is exactly zero, which happens at the
          entailed product-arm rungs.
      - name: reference_log_disagreement_with_exact
        unit: dimensionless, natural log
        definition: >-
          L(ref, u) = |ln(reference(u) / REF-EXACT(u))|, per rung, for every
          reference other than REF-EXACT itself, including both nulls and the
          retained instrument-check reference. THE ARBITRATION TABLE. W(ref) =
          max over arbitrated rungs is reported per reference per cell, together
          with which rung attained it.
      - name: reference_relative_disagreement_with_exact
        unit: relative difference, dimensionless
        definition: >-
          |reference(u) - REF-EXACT(u)| / REF-EXACT(u), reported ALONGSIDE the
          log form for every row, with the explicit annotation that it saturates
          at 1 from below and is therefore never used for any ratio criterion in
          this contract.
      - name: exact_reference_scope_realised
        unit: list of (cell, rung) pairs
        definition: >-
          Exactly which (cell, rung) pairs REF-EXACT was computed for, with the
          METHOD used, the exact integer count, the wall clock and peak RSS
          spent, and the reason for every pair where it was NOT computed. A pair
          not computed is reported as UNARBITRATED and never filled from an
          approximation.
      - name: null_rejection_outcome
        unit: ratio plus verdict token
        definition: >-
          Per cell: W(REF-SHIFT-DOWN), W_best_principled, which reference
          attained W_best_principled, their ratio, their absolute gap, and one of
          REJECTED, NOT_REJECTED, UNDISCRIMINATING, NOT_DECIDABLE per
          arbitration_rules.
    secondary:
      - name: max_rung_absolute_log_ratio
        unit: dimensionless
        definition: max_u |ln R(u)| per reference per cell, for the uniform arm.
      - name: archived_R_rederivation_table
        unit: dimensionless ratios plus two-tier pass/fail per rung
        definition: >-
          R(u) re-derived from the archived per-replicate arrays at the ARCHIVED
          non-integer u under REF-ASY-D, compared (tier 1) against the archived
          literal LPF_R_u_uniform_mean_over_replicates at 1e-5 relative and (tier
          2) against the figures quoted in IDEA-20260802-001 at 1 per cent
          relative. See C-A-ARCHIVED-REDERIVATION for what each tier can and
          cannot establish.
      - name: fitted_knob_ceiling
        unit: dimensionless knob plus attained worst-rung log disagreement
        definition: >-
          c_fit per cell with its search bracket, step, achieved bracket width
          and attained W, per REF-FIT-CEILING. REPORTED, NEVER SELECTED.
      - name: fitted_knob_transfer_across_cells
        unit: dimensionless log disagreement
        definition: >-
          The bits-16 c_fit evaluated at the bits-20 arbitrated rungs, and the
          bits-20 c_fit (if more than one bits-20 rung is arbitrated) evaluated
          at bits 16. A knob fitted at one cell has no reason to transfer to
          another, while a principled correction does; this is therefore a
          discriminator that does not depend on which single reference wins.
          NON-BLOCKING AND EXPLICITLY WEAK: with as few as one arbitrated
          bits-20 rung it is a one-point comparison and is reported as such.
      - name: limb_b_decidable_rung_count
        unit: integer out of 10
        definition: >-
          Rungs whose uniform-arm R(u) lies inside the frozen [1/8, 8] band, per
          reference. REPORTED, NEVER USED AS A CRITERION.
      - name: residual_monotonicity_in_u
        unit: increasing | decreasing | non-monotone-significant | non-monotone-within-noise, per reference per cell
        definition: >-
          Direction of ln R(u) across the five-rung ladder, WITH THE SIGNIFICANCE
          GATE OF F5 APPLIED. The archived incumbent is strictly increasing. A
          sign pattern that is non-monotone but within noise is reported as
          non-monotone-within-noise and is NOT the artifact tell.
      - name: product_arm_R_excess
        unit: dimensionless ratio
        definition: >-
          R(product arm) / R(uniform arm) per rung per reference. NOTE, STATED SO
          A READER DOES NOT COUNT IT FIVE TIMES: this ratio equals
          p_hat(product)/p_hat(uniform) identically, because the reference
          cancels. It is ONE statement about two archived arrays, not one per
          reference. The reference-DEPENDENT part of the product-arm check is
          R(product) > 1, which is five statements.
      - name: rho_third_quadrature_discrepancy
        unit: relative
        definition: >-
          |rho_here(u) - rho_archived(u)| / rho_archived(u) at integer u = 1..6
          AND at every archived non-integer u_recomputed at both cells, where
          rho_here is solved by a scheme independent of the driver's composite
          Simpson delay-equation solve.
      - name: dispersion_ratio_against_binomial
        unit: dimensionless ratio
        definition: >-
          se_rel(u; arm) divided by the binomial expectation
          sqrt( (1 - p_hat) / (N_rep * n_per_sample_set * p_hat) ), per rung per
          arm. For a correct uniform sample with independent replicates this is
          about 1. REPORTED AND EXPLICITLY NOT A CONTROL: a departure is
          ambiguous between a reader defect (wrong N_rep or wrong
          n_per_sample_set) and genuine overdispersion, and an ambiguous
          statistic may not invalidate a run. Its one sharp use is diagnostic of
          review item C7: reading N_rep as 200 where the archive says 20 moves
          this ratio by sqrt(10) = 3.162 at that arm, which is large enough to
          see. UNDEFINED where sd is exactly zero.

  controls:
    - name: C-A-RHO-THIRD-QUADRATURE
      kind: instrument reproduction, blocking, zero compute
      blocking: true
      description: >-
        rho is re-solved here by a scheme independent of the driver's composite
        Simpson on a uniform grid, and must reproduce the archived
        rho_computed_by_driver values (1.0, 0.30685282258145957,
        0.048608388763315906, 0.0049109257010501225, 0.0003547247043376174,
        1.9649696569618583e-05 at u = 1..6) AND the archived rho values at EVERY
        ARCHIVED NON-INTEGER u_recomputed at both cells, to better than 1e-6
        relative at every checked point. The archived values are re-read, not
        taken from this transcription.
        SCOPE, CORRECTED FROM v1 (review item C9). v1 gated only at integer
        u = 1..6, while the values the whole re-derivation divides by are at the
        archived NON-INTEGER u. The blocking gate now covers the load-bearing
        values.
        GATE, TIGHTENED FROM v1's 1e-3 TO 1e-6, AND WHY. The tier-1 leg of
        C-A-ARCHIVED-REDERIVATION compares a re-derived R against an archived
        literal at 1e-5 relative. If the rho gate were looser than that, tier 1
        would be testing the rho solver rather than the reader, which is not what
        it is for. Two independent solves of a first-order delay equation with an
        exact initial segment agree far inside 1e-6 when both are correct, so
        1e-6 costs a correct implementation nothing.
        WHAT MAKES IT FAIL, WITH A WITNESS THAT ACTUALLY FAILED. v1's declared
        witness -- "a naive Simpson solve at step 0.01 is expected to miss 1e-3
        at u = 6" -- IS FALSE and is withdrawn: the pre-approval review
        implemented exactly that and measured 1.6e-5 to 1.8e-5 relative,
        essentially FLAT in u, i.e. comfortably inside the old gate. A witness
        that does not fail invites an executor to accept a coarse solver as "the
        expected failure". THE REPLACEMENT WITNESSES ARE:
        (i) OBSERVED, NOT HYPOTHESISED -- the review's own first attempt used the
        general Chebyshev antiderivative coefficient b_k = (a_{k-1} - a_{k+1})/(2k)
        at k = 1 instead of the correct b_1 = a_0 - a_2/2, and returned
        rho(2) = 0.66040621003332844 and rho(6) = 0.33625063114738052 against
        archived 0.30685282258145957 and 1.9649696569618583e-05, i.e. relative
        errors of about 1.15 and 1.7e4. Recorded as a REVIEWER-REPORTED PRIOR
        from an uncommitted session, cited as a demonstration that this control
        catches real errors people actually make, not as data.
        (ii) CONSTRUCTIBLE BY THE EXECUTOR ON DEMAND -- imposing rho(u) = 1 only
        at u <= 0 instead of on the whole interval [0,1], or dropping the 1/u
        factor from u*rho'(u) = -rho(u-1), changes rho(2) at the first decimal
        place and fails the gate by many orders of magnitude at u = 6.
        (iii) A SIMPSON SOLVE AT A STEP COARSE ENOUGH TO ACTUALLY MISS 1e-6 --
        the executor is required to report the step at which its own alternative
        scheme first crosses the gate, so the gate's operating point is measured
        rather than asserted.
        Disagreement is an implementation failure and never a finding.
    - name: C-A-ARCHIVED-REDERIVATION
      kind: input-claim regression, blocking, zero compute
      blocking: true
      description: >-
        PREMISE CORRECTED IN v2 (review item C8, and ledger/corrections/
        CORR-20260904-f3aa7a.yaml which supersedes the same claim in
        DEC-20260904-3bb7fc). v1 said of this control "IT IS ALREADY
        HALF-FAILING". THAT SENTENCE IS DELETED AND IS WITHDRAWN. All five quoted
        bits-16 figures DO reproduce at the archived non-integer u; indeed they
        are not derived quantities at all but literals already present in
        experiments/EXP-LPF-001/results/calib/null_replicate_statistics.json as
        limb_b_absolute.rows[*].LPF_R_u_uniform_mean_over_replicates =
        1.170186146593335, 1.452189666846296, 2.0520520663207287,
        4.570887928556306, 11.593661937425654. The coordinator arithmetic that
        produced 4.49543 and 11.15351 was correct arithmetic on the WRONG
        DENOMINATOR -- rho at INTEGER u rather than at the archived u the figures
        were computed from.
        WHAT THIS CONTROL CAN THEREFORE DO, STATED HONESTLY: it is a DRIFT CHECK
        ON THIS RUN'S READER AND rho SOLVER. It cannot void the source proposal's
        figures, because a quantity read out of an archive cannot be voided by
        recomputing it.
        TIER 1, BLOCKING, TIGHT. Re-derive R(u) = recomputed_mean(p_hat at rung u)
        / rho_here(u_archived) for the uniform arm at both cells and compare
        against the archived literal above at 1e-5 relative per rung.
        NAMED FAILING INPUT, REAL AND REACHABLE: evaluate rho at the integer
        u_target instead of at the archived u_recomputed. The review reports that
        this gives 4.4954421457 and 11.1534950560 at bits-16 rungs 5 and 6,
        missing the literals by 1.65e-2 and 3.80e-2 relative -- three orders
        above this gate. A tier-1 failure is an implementation defect of THIS run,
        or an internal inconsistency in the archive between the literal and the
        arrays it was computed from; the run reports which by reference to
        whether C-A-RHO-THIRD-QUADRATURE and C-A-SUMMARY-RECOMPUTE passed, and
        stops either way.
        TIER 2, BLOCKING, LOOSE. Compare the ARCHIVED LITERAL against the figures
        quoted in IDEA-20260802-001 (bits 16: 1.1702, 1.4522, 2.0521, 4.5709,
        11.5937; bits 20: 1.1279, 1.3055, 1.6443, 2.4453, 5.0386) at 1 per cent
        relative. NAMED FAILING INPUT: a transcription error in the proposal, or
        a quote taken from a different cell or a different arm. A tier-2 failure
        is a defect in the SOURCE PROPOSAL'S QUOTATION, not in the archive and
        not in this run, and it is reported as such.
    - name: C-A-SUMMARY-RECOMPUTE
      kind: instrument reproduction, blocking, zero compute
      blocking: true
      description: >-
        NEW IN v2 (review item C13). Every p_hat mean and sd this contract uses
        is RECOMPUTED from the archived per-replicate arrays
        (null_replicate_statistics.json -> per_cell[*].LPF-CAL-A.
        LPF_null_replicate_values) rather than read from the archived summary,
        and the recomputation is then CHECKED against the archived summary
        (LPF_null_spread) at 1e-12 relative on the mean and 1e-12 relative on the
        sd. THE SD CONVENTION IS PINNED AS THE n-1 SAMPLE STANDARD DEVIATION;
        the population convention does not reproduce the archive and using it is
        an implementation defect, not a finding.
        THE REPLICATE COUNT IS READ BACK PER ARM PER CELL and reported; it is not
        assumed to be 200 anywhere.
        WHAT MAKES IT FAIL: computing sd with the population convention (which
        moves it by a factor sqrt(199/200) = 0.9975, i.e. 2.5e-3 relative, far
        above the gate); reading per_cell by list position rather than by the
        string key so that bits-20 arrays are labelled bits-16; or averaging
        across rungs before across replicates.
        WHERE PER-REPLICATE ARRAYS DO NOT EXIST -- which the review reports is
        the case for OBJ-CTRL-PRODUCT, archived only as movement_rows summaries
        over 20 replicates -- the summary is used AND THE ROW IS FLAGGED
        `source: archived_summary_not_recomputed`. A flagged row may not carry a
        blocking comparison.
    - name: C-A-NULL-REFERENCE-KNOB
      kind: NULL OBJECT, blocking
      blocking: true
      description: >-
        THE NULL OBJECT OF THE SAME SHAPE, AIMED IN THE DIRECTION THAT CAN
        COLLIDE (review items C1, C2, C3). REF-SHIFT-DOWN is rho(c_null * u_D)
        with c_null = 20/23 = 1/1.15 exactly: a reference of the identical
        functional shape as the incumbent, with a single multiplicative knob
        frozen before any computation in this experiment and never retuned. It
        encodes no theory whatsoever. It is run through the IDENTICAL arbitration
        as the principled references and appears as an ordinary row in every
        table. REF-FIT-CEILING is carried alongside it as the declared ceiling a
        one-parameter fit reaches, reported and never selected.
        REQUIRED OUTCOME AND ITS COMPARATOR ARE DEFINED ON EVERY BRANCH: the null
        is rejected iff W(REF-SHIFT-DOWN) >= 2 * W_best_principled on the LOG
        statistic, with W_best_principled defined whether or not any reference is
        selected, and with the degenerate-case guard, exactly as
        arbitration_rules states.
        WHAT MAKES IT FAIL, CONCRETELY, ON THIS DATA. R(u) is a ratio with a free
        denominator, so a downward reparameterisation of u raises the reference
        and lowers R at every rung, in the same direction as the correction under
        test. The pre-approval review reports, from uncommitted computation, that
        at c = 1/1.15 the theory-free knob reaches worst-rung L of about 0.5235
        at bits 16 against REF-ASY-X's 1.8980 -- THE FIT BEATING THE PRINCIPLED
        CORRECTION BY A FACTOR OF ABOUT 3.6 WITH NO TUNING AT ALL -- and that a
        fitted c near 0.8825 reaches about 0.4047. If those figures hold, the
        null is NOT rejected against REF-ASY-D or REF-ASY-X and the criterion can
        only be met by REF-SP. That is a REACHABLE OUTCOME ON THE ACTUAL DATA,
        it fires F4, no reference verdict is issued, and only the exact densities
        are reported.
        HONESTY ABOUT WHAT THIS CONTROL IS NOW WORTH (see
        pre_computation_disclosure). Because the review already measured this in
        an uncommitted scratchpad and published the result, the outcome is
        PARTIALLY FOREKNOWN to whoever reads that report. The control is
        therefore no longer a blind test of the design. It remains a real test of
        (a) this run's implementation, (b) whether the review's uncommitted
        figures are right, since nothing committed establishes them, and (c) the
        direction question itself, which is a fact about rho and the data rather
        than about anyone's expectation.
    - name: C-A-PRODUCT-ARM-DERIVABLE-SIGN
      kind: positive control with a derivable direction, blocking
      blocking: true
      description: >-
        The archived OBJ-CTRL-PRODUCT arm consists of products of two integers
        below p, which are PROVABLY and substantially smoother than uniform
        integers below p**2 -- the driver states exactly this and calls it the
        derivable-smooth positive control.
        CORRECTED IN v2 (review item C7) IN THREE WAYS.
        (1) REPLICATE COUNT. The arm is archived with 20 replicates, not 200.
        Every standard error for this arm uses N_rep = 20 as read back; using 200
        would understate it by sqrt(10) = 3.162.
        (2) THE FIRST CLAUSE IS ONE STATEMENT, NOT FIVE. R(product)/R(uniform) =
        p_hat(product)/p_hat(uniform) identically, because the reference cancels.
        REQUIRED, ONCE: p_hat(product) > p_hat(uniform) at every non-entailed
        rung. The genuinely reference-dependent requirement, which IS five
        statements, is R(product) > 1 under each declared reference.
        (3) ENTAILED RUNGS ARE LABELLED, NOT COUNTED AS MEASUREMENTS. At any rung
        with Bsm >= p, every product of two integers below p is Bsm-smooth by
        construction, so p_hat is exactly 1 with sd exactly 0. At bits 16 that is
        the u_target = 2 rung, since p = 46663 < 65536 = Bsm. The executor
        determines the entailed set by comparing the p and the ladder it re-reads,
        labels those rows ENTAILED, excludes them from the discriminating set,
        and reports NO se-normalised statistic there because se_rel is exactly
        zero and the quotient is undefined.
        WHAT MAKES IT FAIL: a recomputation pipeline that silently pairs the
        product arm's p_hat with the wrong rung, the wrong cell, or a reference
        evaluated at the product arm's own effective range would flatten the
        excess toward 1. An exact reference applied to the wrong sample is
        exactly the failure this catches at the non-entailed rungs, and it is not
        entailed by anything else in the design.
    - name: C-A-EXACT-COUNT-CROSS-METHOD
      kind: independent reimplementation of the arbiter, blocking
      blocking: true
      description: >-
        THE ARBITER IS THE ONLY THING IN THIS DESIGN WITH NO EXTERNAL CHECK, SO
        IT GETS INDEPENDENT IMPLEMENTATIONS AT MORE THAN ONE RUNG (review item's
        gap under C-A-EXACT-COUNT-CROSS-METHOD in the pre-approval report: v1
        cross-checked only the rung that needed it least).
        LEG 1, COUNT-METHOD EQUALITY AT THE CHEAP RUNGS. At bits-16 u_target = 6
        (Bsm 40) and u_target = 5 (Bsm 84), and at u_target = 4 (Bsm 256) if its
        count is below Method B's 10**7 materialisation cap, Method A and Method
        B must return EXACTLY EQUAL integers -- not close, equal.
        LEG 2, THE IDENTITY RUNG IS CHECKED WHERE ITS LOGIC IS LOAD-BEARING. At
        bits-16 u_target = 2 the count is produced by Method C, whose
        one-large-prime logic is used nowhere else. Before it is used at scale:
        (a) the validity condition Bsm**2 > X is verified in exact integer
        arithmetic; (b) Method C is validated against Method A on three
        pre-declared small fixtures with y**2 > x -- (x, y) = (1000, 37),
        (10000, 101), (100000, 331) -- with EXACT integer equality required at
        each; (c) Method A is ALSO attempted at the full rung, and if it
        completes within its stage cap the two must be exactly equal, while a cap
        hit is recorded as `not_cross_checked_at_scale`, which is a scope note
        and not a control failure.
        LEG 3, CHEAP CONSISTENCY, DECLARED ENTAILED. Every exact count must
        satisfy 1 <= Psi(X, Bsm) <= X and must be strictly decreasing along the
        ladder as Bsm decreases. THIS IS ENTAILED IF EVERY COUNT IS CORRECT and
        is therefore a consistency check, not independent corroboration; it is
        listed inside the blocking control only because a violation is
        unambiguously a defect.
        WHAT MAKES IT FAIL: an off-by-one at a segment boundary, inclusion or
        exclusion of 1 against the declared convention, an int64 overflow in a
        cofactor division, a recursion that double-counts prime powers, or a
        misgrouped floor(X/P) breakpoint in the Lucy_Hedgehog stage. Any of these
        produces a difference of at least 1 and voids the arbiter.
    - name: C-A-NO-NEW-SAMPLING
      kind: procedural control, blocking
      blocking: true
      description: >-
        No sample is drawn. The uniform arm is the archived one. Redrawing it
        would confound a reference question with a sampling question, and the
        instance-variance question is a DIFFERENT contract (EXP-ECDLP-7edfd3).
        The run manifest must record zero calls to any sampler and the run
        directory must contain no newly generated sample array.
        WHAT MAKES IT FAIL: any call to CalibrationCell.draw_uniform,
        draw_synth or the product drawer; any newly written sample array in the
        run directory; any use of a random number generator at all outside a
        declared and recorded tie-break with no effect on any reported number.
    - name: C-A-READ-ONLY-EXP-LPF-001
      kind: procedural control, blocking
      blocking: true
      description: >-
        WIDENED IN v2 FROM PER-INPUT-PATH HASHES TO A RECURSIVE TREE HASH (review
        item C14). Before and after the run, compute a single digest over the
        WHOLE SUBTREE experiments/EXP-LPF-001/ -- the sorted list of relative
        paths each with its sha256 -- and require the two digests to be
        identical. The per-input-path hashes are also recorded, as before.
        WHAT MAKES IT FAIL, AND WHY v1's VERSION MISSED IT: importing
        lpf001_driver as a module writes
        experiments/EXP-LPF-001/implementation/__pycache__/, which changes the
        tree while no declared input file's sha256 moves. v1 hashed only the
        declared inputs and would have passed. In addition to the widened hash,
        the driver is read as text and never imported, and any helper that runs
        in the same interpreter runs with bytecode writing disabled.

  declared_non_controls:
    preamble: >-
      ITEMS IN THIS SECTION ARE NOT CONTROLS AND MAY NOT BE COUNTED AS ONE. They
      are instrument checks whose outcome is entailed if the pipeline is correct.
      They are listed separately, and non-blocking, precisely so that nothing in
      the controls list is decorative -- which is the defect class review items
      C1, C2, C3, C4 and C9 are all instances of.
    items:
      - name: C-A-SHIFT-UP-DIRECTION-READBACK
        blocking: false
        description: >-
          REF-SHIFT-UP = rho(1.15 * u_D), v1's superseded null, is evaluated and
          reported. Its outcome is ENTAILED: rho is strictly decreasing, so
          REF-SHIFT-UP < REF-ASY-D pointwise; and the archived incumbent R
          exceeds 1 at every bits-16 rung, so REF-ASY-D already under-estimates
          the exact density there; hence L(REF-SHIFT-UP) > L(REF-ASY-D) at every
          such rung unconditionally. A run reporting otherwise has a plumbing
          error -- a sign flipped, a reference evaluated at the wrong u, or a
          reference paired with the wrong rung -- and that is the only thing this
          check can detect. It costs five rho evaluations per cell and it
          preserves an auditable record of exactly what v1's null did.
      - name: C-A-SYNTH-REJECTION-COUNT-READBACK
        blocking: false
        description: >-
          v1's C-A-SYNTH-IDENTITY-READBACK is WITHDRAWN as unexecutable: the
          OBJ-NULL-SYNTH arm's rates are archived nowhere, only per-statistic
          rejection counts survive, and the arm's only other execution path --
          redrawing it -- is forbidden by C-A-NO-NEW-SAMPLING and by the first
          invalidation rule. What replaces it is a plain READBACK of what IS
          archived: the per-statistic rejection counts for `uniform` and `synth`
          in apparatus_identity_report.json, reported verbatim in the results
          table with their cell keys. The review reports the bits-16 counts as
          uniform 0,0,0,0,1 and synth 0,0,0,1,1 across the five rungs; that is a
          reviewer-reported prior and the executor reports what it reads.
          WHAT MAKES EVEN THIS FAIL: a reader indexing per_cell by list position
          rather than by the string key '16'/'20' returns the bits-20 counts
          under the bits-16 label. That is a real reachable defect, which is why
          the readback is worth doing -- but it is NOT corroboration of anything
          about the synthetic arm, and the driver itself declared in advance that
          agreement between the uniform and synthetic arms never could be.
      - name: C-A-DISPERSION-DIAGNOSTIC
        blocking: false
        description: >-
          The dispersion_ratio_against_binomial metric, reported per rung per
          arm. NOT A CONTROL because a departure is ambiguous between a reader
          defect and genuine overdispersion, and an ambiguous statistic may not
          invalidate a run. Reported because a sqrt(10) = 3.162 shift in this
          ratio on the product arm is the visible signature of the replicate-count
          error review item C7 names, and because an unexplained departure on the
          uniform arm is a named open item worth carrying into the successor
          contract EXP-ECDLP-7edfd3.

  heuristic_under_test: HEUR-SPREF-1
  heuristic_under_test_note: >-
    The schema field takes one id. HEUR-SPREF-2 is ALSO under test here, by F2:
    R_exact at bits 16 outside four relative standard errors of 1 at any rung
    refutes it. Both heuristics are declared in H-ECDLP-d2aa2c with
    validation_experiment_ids [EXP-ECDLP-a1c262].

  preregistered_prediction:
    carried_verbatim_from_v1: true
    carried_verbatim_note: >-
      NOT TOUCHED BY THIS REVISION AND NOT RE-WORDED. It was frozen at the v1
      design commit 4d7685379d2eceb91b3422f962f5a895ba76f436, before the
      pre-approval review computed anything, and that is the only reason it is
      still a pre-registration at all. See pre_computation_disclosure. NO NEW
      PREDICTION IS ADDED IN v2.
    quantity: >-
      R_exact(u) = p_hat(u) / (Psi(X, Bsm)/X) for the archived uniform arm at the
      bits-16 cell, at the five archived rungs.
    formula: >-
      R_exact(u) = 1 within four times se_rel(u), where
      se_rel(u) = sd(u) / (sqrt(200) * mean(u)) is computed from the archived
      200-replicate spread. Equivalently
      |R_exact_deviation_in_own_standard_errors| <= 4 at every rung. The source
      proposal's looser window R_exact(u) in [0.90, 1.11] is retained verbatim as
      a SECONDARY pre-registration, as is its target
      max_u |ln R_sp(u)| <= 0.82 at both cells.
    formula_note_v2: >-
      The sqrt(200) in the formula above is correct AS WRITTEN, because this
      prediction is about the UNIFORM arm, which is archived with 200 replicates.
      Review item C7's correction applies to the PRODUCT arm's 20 replicates and
      to the general metric definitions, not to this prediction, which is
      therefore unchanged rather than silently reinterpreted.
    source: >-
      The prediction is the definition of a uniform sample: if the archived arm
      is uniform on [1, X] and correctly factorised, its smoothness rate at bound
      Bsm estimates Psi(X, Bsm)/X, which is a counting theorem and not an
      approximation. THE PREDICTION IS FIXED BEFORE ANY RUN AND IS NEVER TUNED.
      Adjusting it after any run requires a versioned protocol_amendment under
      experiments/EXP-ECDLP-a1c262/amendments/.

  coordinator_prior:
    recorded_before_execution: true
    v1_prior_carried_verbatim: >-
      RECORDED FIRST, PER AGENTS.md "Review architecture", AND EXPLICITLY NOT A
      COMPUTATION OF RECORD. This coordinator expects (i) that REF-ASY-X absorbs
      a substantial part of the bits-16 departure but NOT all of it at the top
      rung, because ln(X)/ln(D) is about 0.969 at that cell and the residual
      finite-y error at Bsm = 40 is separately of order unity by Hildebrand's own
      error term; (ii) that REF-EXACT places the archived uniform arm within a
      few standard errors of 1, i.e. branch (a); and (iii) that REF-SHIFT is
      rejected, but with less margin than would be comfortable. If (ii) fails the
      result is MORE valuable, not less, because it implicates the null arm of
      every LPF reading. A prior the run overturns is among the most informative
      outcomes available here and it is unrecoverable if written afterwards.
    v2_addendum:
      status: NOT A PRIOR, POST-EXPOSURE, RECORDED FOR AUDIT ONLY
      text: >-
        The agent writing v2 has read the pre-approval review's uncommitted
        figures and therefore has no prior left to record about outcomes those
        figures cover. What can honestly be recorded is where the v1 prior looks
        wrong in the light of them, stated as a correction to the prior's
        reasoning rather than as a new expectation:
        (a) clause (i) OVERSTATES REF-ASY-X. The review's arithmetic puts the
        argument-error correction at rho(u_X)/rho(u_D) = 1.7346 at the bits-16
        top rung, i.e. |ln| = 0.551 out of a total |ln 11.5937| = 2.4506, which is
        22.5 per cent of the effect, with the finite-y error dominating at every
        rung above u = 3. "A substantial part" is not the right description and
        the mechanism ordering in H-ECDLP-d2aa2c ("these two sources, IN THAT
        ORDER") is ordered by discovery, not by magnitude.
        (b) clause (iii) is superseded in its object: the null it names is v1's,
        which is aimed the wrong way. The v2 null is a different object and the
        v1 prior says nothing about it.
        (c) clause (ii) is exactly what the review's uncommitted computation
        already reports, which is why no v2 expectation about it is recorded --
        an expectation formed after reading the answer is not a prior and will
        not be dressed as one.

  scale_relevance:
    tier: toy
    justification: >-
      Two archived toy cells: a 16-bit field prime p = 46663 with X = p**2 =
      2177435569, and a 20-bit field prime with X = p**2 below 2**40. Five frozen
      smoothness rungs per cell. NO TRANSFER IS CLAIMED. A reference validated at
      X ~ 2**31 says nothing about the same estimator at cryptographic X, which
      is a different question and a different record. The exponent-relevance of
      the reference layer is an ARGUMENT about where the quantity appears in a
      cost expression, not an empirical result of this contract.
    correspondence: >-
      null - direct computation over archived arrays. No sampling
      correspondence is used and none is needed, because nothing is sampled.

  tail_checks:
    - >-
      The TOP RUNG IS THE TEST. Report u_target = 6 at bits 16 individually and
      never inside an average over rungs: it is the rung where the incumbent
      departure is largest, where rho is smallest, where any finite-y error is
      largest, and where the exact count is cheapest. A design that reported only
      a pooled statistic would hide exactly the rung it exists for.
    - >-
      Report the archived arm's SMALLEST and LARGEST per-replicate p_hat at the
      top rung (archived: min 0.0001223091976516634, max 0.0003287059686888454
      at bits 16, re-read and not assumed) against the exact density, so that the
      exact reference is checked against the realised replicate range and not
      only against the mean.
    - >-
      Report the exact smooth COUNT as an integer at every rung where REF-EXACT
      exists, alongside the density, so a later reader can recompute the density
      and can check it against a different X without re-running any method.
    - >-
      Report the saddle parameter alpha, its residual, its bracket and its solver
      iteration count per rung. An alpha that failed to converge is an
      infrastructure outcome, REF-SP is reported as unavailable at that rung, is
      never substituted, and drops out of W_best_principled with that exclusion
      recorded.
    - >-
      Report, at every arbitrated rung, both L and the relative form, so that the
      saturation identity rel = 1 - exp(-L) (for an under-estimating reference)
      is checkable row by row from the reported numbers alone.

  replication:
    seeds: []
    independent_instances: 0
    note: >-
      NO SEEDS AND NO INSTANCES BY DESIGN. Every arm is a deterministic
      computation over archived arrays; there is nothing stochastic to replicate.
      The replication that matters here is METHOD replication, and it is carried
      by C-A-EXACT-COUNT-CROSS-METHOD (independent implementations of the arbiter
      at three bits-16 rungs plus three declared fixtures for the identity
      method) and C-A-RHO-THIRD-QUADRATURE (an independent solve of rho at every
      load-bearing u). Statistical replication of the SAMPLE is the subject of the
      sibling contract EXP-ECDLP-7edfd3 and is deliberately absent here.

  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 9
    maximum_memory_gb: 4
    maximum_runs: 6
    maximum_workers: 1
    which_cap_binds: >-
      RECONCILED IN v2 (review item C12). v1 declared maximum_runs 6 at 5400 s
      per run with maximum_workers 1 and total_cpu_hours 3; those cannot both
      bind, since 6 * 5400 / 3600 = 9. total_cpu_hours is therefore set to 9,
      WHICH IS THE ARITHMETIC CEILING OF THE OTHER THREE FIELDS AND IS NOT AN
      ESTIMATE OF THE WORK. THE BINDING CAPS ARE the per-run wall clock (5400 s at
      one worker) and the per-stage caps in stopping_rules, whose sum for one
      full run is 300 + 60 + 300 + 900 + 1500 + 600 + 900 + 600 = 5160 s, leaving
      240 s for I/O and reporting inside the per-run cap. A run consumed by an
      infrastructure stop counts against maximum_runs.
    sizing_rationale: >-
      SIZED TO THIS HOST, WHICH IS SMALL, AND TO A RELATED LANE THAT BURNED
      11.73 AND 12.22 GiB AND RETURNED NOTHING. v1 sized the budget around an
      O(X) segmented sieve as the primary exact-count method; v2 demotes that to
      a fallback and sizes around count-proportional methods instead, so the
      dominant cost is now Method A at the bits-16 u_target = 3 rung, whose work
      is proportional to the number of 1626-smooth integers below X, and Method
      C's Lucy_Hedgehog stage at bits 20, whose operation count scales as
      X**(3/4) = p**(3/2). Every other arm -- five rho evaluations per reference
      per cell, a one-dimensional saddle solve over at most 6542 primes, a
      one-dimensional knob scan of about 1000 points times five rho evaluations,
      and the arithmetic over the archived arrays -- is bounded by a few million
      elementary operations. NO WALL-CLOCK FIGURE IS ASSERTED FOR ANY STAGE; each
      stage carries a cap and the executor measures and records what it spends.
      Memory is justified in the objective as the template requires.

  stopping_rules:
    - >-
      Run the stages in this order. THE ORDER IS A COST ORDER, NOT A REFUTATION
      ORDER: only a CONTROL failure halts the run, and no stage's own result
      halts anything. Per-stage wall-clock caps in seconds are declared in
      brackets and are checked by the runner.
      (0) C-A-RHO-THIRD-QUADRATURE, C-A-SUMMARY-RECOMPUTE and
          C-A-ARCHIVED-REDERIVATION, both tiers - zero compute [300]
      (1) REF-ASY-D, REF-ASY-X and REF-SHIFT-UP - rho evaluations only [60]
      (2) REF-SP and REF-SHIFT-DOWN - one saddle solve per rung [300]
      (3a) REF-EXACT bits 16 at u_target 6, 5, 4 by Method A, with Method B
           cross-checks [900]
      (3b) REF-EXACT bits 16 at u_target 3 by Method A [1500]
      (3c) REF-EXACT bits 16 at u_target 2 by Method C, with the three declared
           fixtures and the attempted Method A comparison [600]
      (4a) REF-EXACT bits 20 at u_target 2 by Method C, if Bsm > p verifies [900]
      (4b) REF-EXACT bits 20 at u_target 6 by Method A under a node cap [600]
      (5) REF-FIT-CEILING knob scan, which requires the exact counts and so runs
          last, inside the reporting headroom.
    - >-
      If C-A-RHO-THIRD-QUADRATURE fails, stop before stage 1. Nothing downstream
      is interpretable and the failure is an implementation defect.
    - >-
      If C-A-SUMMARY-RECOMPUTE fails, stop before stage 1. Every p_hat in the
      contract is then suspect and no comparison is interpretable.
    - >-
      If either tier of C-A-ARCHIVED-REDERIVATION fails at any rung, complete the
      re-derivation table, report it with the tier that failed, and STOP before
      stage 2. Tier 1 failing is an implementation defect of this run or an
      internal inconsistency in the archive; tier 2 failing is a defect in the
      source proposal's quotation. NEITHER outcome is a finding about the
      reference, and neither voids the archived literals.
    - >-
      Each stage stops at its declared cap. A capped stage records the partial
      state reached -- the rung index, and for Method A the node count consumed
      against its cap -- and reports the affected (cell, rung) pairs as REF-EXACT
      NOT ACHIEVED, which is an infrastructure outcome under AGENTS.md rule 5 and
      is reported as UNARBITRATED. The contract is NEVER decided on the strength
      of the three approximations agreeing with one another.
      BECAUSE THE STAGES ARE COST-ORDERED, A CAP HIT AT A LATE STAGE LEAVES THE
      DECISION-BEARING HIGH-u RUNGS ALREADY COMPUTED. That is the point of the
      reordering and it replaces v1's single all-or-nothing 3000 s sieve cap.
    - >-
      Method D (the O(X) segmented sieve) NEVER runs inside a run that hit a cap.
      If a bits-16 Method A rung caps out, Method D at that rung may be attempted
      in a SEPARATE run charged against maximum_runs, with its own 1800 s cap, and
      only at bits 16.
    - >-
      At bits 20, attempt exactly two rungs and no others. (i) u_target = 2 by
      Method C, CONDITIONAL on the executor verifying Bsm > p in exact integer
      arithmetic; if that condition fails, the rung is not attempted and is
      reported OUT OF SCOPE with the two integers shown. (ii) u_target = 6
      (Bsm = 102) by Method A with a hard cap of 2 * 10**8 recursion nodes. Do
      NOT attempt any other bits-20 rung and do NOT attempt a full sieve at
      bits 20: X is of order 2**40 there and an O(X) pass is not reachable on
      this host, so attempting it would spend the budget to produce
      failed_infrastructure. The remaining bits-20 rungs are declared OUT OF
      SCOPE because their smooth counts are far larger; the review's uncommitted
      estimates put them at order 1e9 and above, recorded as a prior and not as a
      measurement.
    - >-
      v1 FORBADE THE BITS-20 u_target = 2 RUNG AND v2 DOES NOT (review item C11).
      v1's stopping rule generalised "a full sieve at bits 20 is unreachable" to
      "no bits-20 rung is reachable", which foreclosed the one rung where the
      one-large-prime identity applies. That rung converts a declared-unarbitrated
      cell into a partially arbitrated one.
    - >-
      Stop immediately and report if the recursive tree hash of
      experiments/EXP-LPF-001/ changes during the run
      (C-A-READ-ONLY-EXP-LPF-001).
    - >-
      Peak RSS is checked at each stage boundary and, inside Method D if it runs,
      at each segment. If it exceeds 3.5 GB, halve the working set (segment size
      or materialisation chunk) and record the change; if it exceeds 3.5 GB at the
      minimum working set, stop and report resource_exhaustion.

  invalidation_rules:
    - Any new sample drawn, of any kind, by any arm.
    - >-
      Any write, edit, move, regeneration or creation under
      experiments/EXP-LPF-001/, including a __pycache__ directory, a lock file,
      or any artifact of importing the driver.
    - >-
      Any comparison in which p_hat and the reference are evaluated over
      different ranges without that difference being the declared independent
      variable - which is the exact defect under investigation and must never be
      reintroduced silently by the instrument.
    - >-
      Any use of REF-SP as the arbiter, or any statement resting on the
      Hildebrand or Hildebrand-Tenenbaum citations as though they had been read.
      Both are `provenance: recalled` and no agent in this program has opened
      them. Writing the estimator down in this contract does NOT discharge that:
      it makes REF-SP implementable and testable, and it asserts nothing about
      whose estimator it is or what error term it has.
    - >-
      Any tuning of REF-SHIFT-DOWN's c_null = 20/23 knob, at any point, for any
      reason. The knob is frozen by this contract; retuning it converts the null
      object into a fitted reference and destroys the only control on
      curve-fitting.
    - >-
      Any selection of REF-FIT-CEILING as a reference, or any use of c_fit as
      anything other than a reported ceiling, in this contract or a successor.
    - >-
      Any arbitration criterion, selection rule or falsification condition
      evaluated on the relative statistic |ref - exact|/exact rather than on
      L = |ln(ref/exact)|. The relative form is reported and is never a criterion.
    - >-
      Any REF-EXACT value reported at a (cell, rung) pair where it was not
      actually computed, including any interpolated, extrapolated or
      approximation-substituted value.
    - >-
      Any use of Method C at a rung where Bsm**2 > X was not verified in exact
      integer arithmetic.
    - >-
      Any reading of, comparison against, or re-scoring of the REAL arm of
      EXP-LPF-001 (OBJ-REAL). It is out of scope by construction.
    - >-
      Any statement about the Semaev map, summation polynomials, factor-base
      geometry, an ECDLP cost, or a cryptographic-scale reference.
    - >-
      Any edit to a frozen band, reading rule, or specification. A correction to
      a frozen band is a superseding record under a new id and a Coordinator
      decision, neither of which this contract performs.
    - >-
      Any statistic that divides by a standard error which is exactly zero, in
      place of reporting UNDEFINED at that row.

  success_criterion: >-
    All EIGHT blocking controls pass - C-A-RHO-THIRD-QUADRATURE,
    C-A-ARCHIVED-REDERIVATION, C-A-SUMMARY-RECOMPUTE, C-A-NULL-REFERENCE-KNOB,
    C-A-PRODUCT-ARM-DERIVABLE-SIGN, C-A-EXACT-COUNT-CROSS-METHOD,
    C-A-NO-NEW-SAMPLING and C-A-READ-ONLY-EXP-LPF-001, named here so the count
    is checkable rather than asserted; the archived R values re-derive at the
    archived u against the archived literals at tier 1 and against the quoted
    figures at tier 2; REF-EXACT is computed at all five bits-16 rungs, by two
    exactly agreeing methods at the cheap rungs and by a fixture-validated
    identity method at the Bsm = 65536 rung; the arbitration table is reported on
    the LOG statistic, with the relative form alongside, for every reference at
    every (cell, rung) pair where REF-EXACT exists; the null control returns one
    of REJECTED, NOT_REJECTED, UNDISCRIMINATING or NOT_DECIDABLE with its
    comparator named; the fitted-knob ceiling is reported and not selected; and
    R_exact_deviation_in_own_standard_errors is reported as a number at every
    bits-16 rung. The contract SUCCEEDS whether that number is inside four
    standard errors or outside it, and whether or not the null is rejected -
    branch (a), branch (b) and a no-verdict outcome are all complete results and
    only an unexecuted or unarbitrated arm is a failure.

  falsification_criterion: >-
    F0a, TIER 1: the re-derived R values do not match the archived literals
    within 1e-5 relative at the archived u. This run's reader or rho solver is
    defective, or the archive is internally inconsistent between its literals and
    its arrays; the run reports which by reference to the other stage-0 controls
    and stops. IT IS NOT A FINDING ABOUT THE SOURCE PROPOSAL'S FIGURES, which are
    literals in the archive and cannot be voided by recomputation
    (CORR-20260904-f3aa7a).
    F0b, TIER 2: the archived literals do not match the figures quoted in
    IDEA-20260802-001 within 1 per cent. The proposal misquotes the archive; the
    quoted "figure to beat" is corrected to the archived literal and the run
    reports that and stops.
    F1, no APPROXIMATE reference - the quantifier is restricted in v2 to
    REF-ASY-D, REF-ASY-X and REF-SP, because REF-EXACT is the arbiter and scoring
    it against itself is circular - reaches max_u |ln R(u)| <= 0.82 at either
    cell: the departure is not explained as a reference effect at the tested
    parameters; the sampler or the specification is implicated; BRANCH (b), a
    positive finding about the apparatus and never a null result.
    F2, |R_exact_deviation_in_own_standard_errors| > 4 at any bits-16 rung:
    HEUR-SPREF-2 is refuted; the archived uniform arm is not behaving as a
    uniform sample of its stated range against a reference that is a theorem;
    every LPF reading is blocked until localised.
    F3, REF-SP and REF-EXACT disagree by more than L = ln(1.05) = 0.04879 at any
    bits-16 rung: HEUR-SPREF-1 is refuted at the tested parameters; REF-SP may
    not be used at bits 20 or anywhere else and any cell without an exact count
    is reported as having NO usable reference. The 5 per cent threshold is
    unchanged from v1 and the hypothesis; only its expression is moved onto the
    log statistic, and ln(1.05) is that same threshold, not a new one.
    F4, W(REF-SHIFT-DOWN) < 2 * W_best_principled at bits 16, or the
    degenerate-case guard declares the comparison UNINFORMATIVE, or no principled
    reference is available: the arbitration has no power to separate a correction
    from a fit at these parameters; NO reference verdict is issued and only the
    exact densities are reported. The verdict must name which reference attained
    W_best_principled.
    F5, GATED ON SIGNIFICANCE IN v2 (review item C4): the post-correction
    residual is non-monotone in u AND the non-monotonicity is significant. FORMAL
    STATEMENT: with s(u) = ln R(u) and se(u) = se_rel(u; uniform arm) as the
    first-order standard error of s(u) by the delta method (since
    sd(ln m) = sd(m)/m to first order and the reference carries no sampling
    error), F5 fires iff there exist rungs i < j with
      s(u_j) - s(u_i) < -k * sqrt( se(u_i)**2 + se(u_j)**2 )
    AND rungs a < b with
      s(u_b) - s(u_a) > +k * sqrt( se(u_a)**2 + se(u_b)**2 ),
    i.e. a significant decrease AND a significant increase both present, with
    k = 3 FROZEN BY THIS CONTRACT IN ADVANCE. WHY v1's VERSION WAS BROKEN: it
    tested the SIGN PATTERN with no significance qualifier, so when a correction
    is perfect and the residual is pure sampling noise the sign pattern is
    non-monotone with probability close to 1 - meaning v1's F5 fired on its own
    declared success case, branch (a), and reported it as branch (c). k = 3 is a
    conventional three-sigma threshold on a difference of two independent means
    and is not fitted; but see pre_computation_disclosure, since this agent had
    already read residual figures consistent with it not firing and cannot claim
    the choice was blind.
    F6, two exact-count methods disagree at any cross-checked rung or fixture:
    the arbiter is broken; the exercise is void; an infrastructure outcome under
    AGENTS.md rule 5 and never evidence about the reference.

  required_artifacts:
    - >-
      A machine-readable table of R(u) for every (cell, rung, reference, arm),
      to full precision, with the RECOMPUTED p_hat mean and sd it was computed
      from, the replicate count N_rep read back for that arm and cell, se_rel,
      and a `source` flag distinguishing recomputed rows from archived-summary
      rows.
    - >-
      The arbitration table: L = |ln(ref/exact)| AND the relative form for every
      reference against REF-EXACT, per (cell, rung) pair where REF-EXACT exists,
      with REF-SHIFT-DOWN, REF-FIT-CEILING and REF-SHIFT-UP shown as ordinary
      rows, and W per reference per cell with the attaining rung named.
    - >-
      The null-rejection outcome per cell: W(REF-SHIFT-DOWN), W_best_principled,
      the reference that attained it, the ratio, the absolute gap, the
      degenerate-guard evaluation, and the verdict token.
    - >-
      c_fit per cell with its search bracket, scan step, achieved bracket width,
      attained W, and the cross-cell transfer evaluation.
    - >-
      The exact smooth COUNTS as integers at every computed rung, with X, Bsm,
      the METHOD used, the validity condition checked where Method C was used,
      wall clock and peak RSS.
    - >-
      The independent exact counts shown side by side as integers at every
      cross-checked rung, plus the three Method C fixtures (1000, 37),
      (10000, 101), (100000, 331) with both methods' integers.
    - >-
      The saddle parameter alpha per rung, with residual, bracket, iteration
      count and the declared tolerance, and an explicit UNAVAILABLE marker plus
      its effect on W_best_principled wherever the solve did not converge.
    - >-
      The rho third-quadrature comparison against the archived driver values at
