          exact_count_methods declares Method A (recursive count, work
          proportional to the smooth count), Method B (materialised enumeration,
          under a 10**7 cap), Method C (the one-large-prime identity with its
          derivation written out and its Bsm**2 > X validity condition verified in
          exact integer arithmetic, evaluated via Lucy_Hedgehog at X**(3/4) =
          p**(3/2) operations), and Method D (the O(X) sieve) DEMOTED to a
          fallback that runs only at bits 16, only after a Method A cap-out, and
          only in a separate run. The execution order is cost-ordered so the
          decision-bearing high-u rungs are computed first, and v1's single 3000 s
          all-or-nothing cap is replaced by per-stage caps.
        departure: >-
          NO RUNTIME IS ASSERTED ANYWHERE. The reviewer's measured timings
          (0.11 s, 0.60 s, 5.03 s, 72.9 s, 0.22 s and about 80 s total) are used
          ONLY as the rationale for the ORDERING and are labelled uncommitted
          priors; the caps are set from the cost bases and not from those numbers,
          and the executor measures. The reviewer's own limitation - that Method D
          was never implemented, so its fit to any cap is undetermined - is
          carried into limitations rather than resolved.
      - review_item: C11
        severity: named
        reviewer_asked: >-
          Do not forbid the bits-20 u_target = 2 rung; it is reachable by the same
          identity and converts a declared-unarbitrated cell into a partially
          arbitrated one.
        v1_superseded_verbatim: >-
          "At bits 20, attempt REF-EXACT ONLY at the u_target = 6 rung (Bsm = 102,
          26 primes) by direct enumeration ... Do NOT attempt any other bits-20
          rung and do NOT attempt a full sieve at bits 20."
        v2_now: >-
          Two bits-20 rungs are attempted: u_target = 2 by Method C, CONDITIONAL
          on the executor verifying Bsm > p (equivalently Bsm**2 > X, since
          X = p**2) in exact integer arithmetic and reporting the two integers
          compared; and u_target = 6 by Method A under a 2*10**8 node cap. The
          full-sieve prohibition at bits 20 stands, and the remaining three rungs
          stay out of scope with the reason stated.
        departure: >-
          The rung is enabled CONDITIONALLY rather than asserted reachable,
          because this coordinator has not read the bits-20 p and refuses to
          transcribe it. If the condition fails on the p actually archived, the
          rung is skipped and reported out of scope with the integers shown -
          which is a correct outcome, not a defect.
      - review_item: C12
        severity: named
        reviewer_asked: >-
          Reconcile the budget block (6 x 5400 s versus total_cpu_hours 3), and
          move the sub-floor memory justification into the objective.
        v1_superseded_verbatim: >-
          "budget: wall_clock_seconds_per_run: 5400, total_cpu_hours: 3,
          maximum_memory_gb: 4, maximum_runs: 6, maximum_workers: 1" with the
          memory justification inside sizing_rationale.
        v2_now: >-
          total_cpu_hours is set to 9 = 6 * 5400 / 3600, declared explicitly as
          the ARITHMETIC CEILING of the other three fields and not as an estimate,
          with which_cap_binds naming the per-run wall clock and the per-stage
          caps (summing to 5160 s) as the binding constraints. The memory
          sub-floor justification is moved into the objective as
          templates/research-records.md requires, and is rewritten around the
          actual v2 working sets.
        departure: >-
          THE CONTRADICTION IS RESOLVED UPWARD, NOT DOWNWARD. A reader might
          expect the tighter number to win. It does not, because 3 CPU-hours was
          never a computed quantity either - it was an unexamined field - and
          lowering maximum_runs to 2 to preserve it would remove the re-run
          headroom that an implementation defect in a seven-blocking-control
          contract will plausibly need. 9 is a ceiling, not a spending plan, and
          it is labelled as such.
      - review_item: C13
        severity: named
        reviewer_asked: >-
          Recompute mean and sd from LPF_null_replicate_values and check against
          LPF_null_spread rather than reading the summary; pin the sd convention
          as the n-1 sample sd; state in limitations that no raw sample array
          survives.
        v1_superseded_verbatim: >-
          "p_hat(u) is the archived 200-replicate MEAN of STAT-RATE-u at that
          rung" with no recomputation step and no sd convention.
        v2_now: >-
          New blocking control C-A-SUMMARY-RECOMPUTE: recompute from the
          per-replicate arrays, check against the archived summary at 1e-12
          relative on both mean and sd, pin the n-1 convention, read back N_rep
          per arm per cell, and flag any row that had to fall back to an archived
          summary as `source: archived_summary_not_recomputed` with a rule that
          such a row may not carry a blocking comparison. Limitations state that
          no raw sample array survives and that the archived run's manifest
          records dirty_tree: true.
        departure: >-
          ADDITION: the dispersion_ratio_against_binomial diagnostic, reported and
          explicitly NOT a control, because its one sharp use is to make the
          replicate-count error of C7 visible as a sqrt(10) = 3.162 shift, while
          a general departure is ambiguous between a reader defect and genuine
          overdispersion. An ambiguous statistic may not invalidate a run, so it
          is placed under declared_non_controls.
      - review_item: C14
        severity: named
        reviewer_asked: >-
          Widen C-A-READ-ONLY-EXP-LPF-001 from per-input-path hashes to a
          recursive tree hash so an import that writes __pycache__ under
          EXP-LPF-001 is caught.
        v1_superseded_verbatim: >-
          "A post-run check that no file under experiments/EXP-LPF-001/ changed:
          every input path's sha256 is recorded before and after and must be
          identical."
        v2_now: >-
          A single digest over the whole subtree (sorted relative paths each with
          its sha256), before and after, required identical; the per-input-path
          hashes are still recorded; plus an explicit prohibition on importing the
          driver and a requirement that any helper in the same interpreter run
          with bytecode writing disabled. The __pycache__ path is named as the
          failing input.
        departure: null
      - review_item: C15
        severity: minor
        reviewer_asked: >-
          Add dominated_by / sota_delta (both trivially null on every ECDLP cost
          axis, which is the point), and declare the executor run's requested
          inference policy.
        v1_superseded_verbatim: >-
          (absent from v1 entirely)
        v2_now: >-
          A pareto_position block with dominated_by null and sota_delta null,
          each carrying the reason rather than a bare null, plus a statement that
          on the one axis this contract does move - reference accuracy at two toy
          cells - the delta is what the run measures and writing it in advance
