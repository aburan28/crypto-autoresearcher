          absolute gap is reported but is deliberately NOT a criterion, because
          requiring an absolute gap of ln 2 would refuse to reject a null that is
          a factor of 1.7 off at the worst rung against a principled reference
          accurate to 0.7 per cent, which is plainly a discriminating situation.
      - review_item: C3
        severity: blocking
        reviewer_asked: >-
