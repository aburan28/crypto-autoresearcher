        departure: null
    additional_changes_not_requested_by_the_review:
      - id: A1
        change: >-
          A pre_computation_disclosure block declaring the pre-registration
          COMPROMISED. The review computed, in an uncommitted scratchpad, most of
          what this contract computes, and published the figures in a committed
          report; the agent writing v2 read them first. v1's prediction and prior
          are carried VERBATIM so their pre-registration survives; no new
          prediction is added; the null knob is the reviewer's own suggested value
          and is declared post-exposure; and the executor must record whether it
          read the review's numeric tables before implementing.
        why: >-
          This is a cost of item C1 that the reviewer did not weigh: asking for a
          new null AFTER measuring how that null performs cannot produce a blind
          control. The right response is disclosure, not a pretence of blindness.
      - id: A2
        change: >-
          F1's quantifier is restricted to the three APPROXIMATE references. v1's
          "no declared reference reaches max_u |ln R(u)| <= 0.82" ranged over
          REF-EXACT too, which makes F1 nearly implied by F2 and scores the
          arbiter against itself.
        why: >-
          Removes a circularity. The number 0.82 is untouched, so this is a
          quantifier clarification and not a moved goalpost.
      - id: A3
        change: >-
          The n = 1 smoothness convention is declared explicitly for every exact
          method, with its magnitude shown (1/X = 4.6e-10 at bits 16, about six
          orders below the smallest archived se_rel).
        why: >-
          It is load-bearing for the exact-integer-equality control and negligible
          for every comparison against the sample; both facts should be on the
          page rather than in an executor's head.
      - id: A4
        change: >-
          Method C's validity condition is stated as the exactly checkable integer
          comparison Bsm > p (equivalent to Bsm**2 > X because X = p**2), and its
          derivation is written out in full rather than cited.
        why: >-
          The identity is the only load-bearing step at the Bsm = 65536 rung and
          v1 did not contain it at all; a step no one can audit from the contract
          is the same defect as an unread citation.
      - id: A5
        change: >-
          A cross-cell fitted-knob transfer diagnostic: c_fit fitted at one cell
          evaluated at the other's arbitrated rungs.
        why: >-
          It is the one discriminator between a correction and a fit that does not
          depend on which single reference attains W_best_principled. Declared
          non-blocking and explicitly weak, since as few as one arbitrated bits-20
          rung makes it a one-point comparison.
      - id: A6
        change: >-
          A `declared_non_controls` section, holding every check whose outcome is
          entailed if the pipeline is correct.
        why: >-
          Five of the fifteen review items are instances of one failure mode: a
          decorative item counted as a control. Separating the two kinds
          structurally is cheaper than re-litigating each one.
    what_v2_still_cannot_do:
      - >-
        IT CANNOT MAKE THE NULL A BLIND TEST AGAIN. The answer is already
        published in a committed review report.
      - >-
        IT CANNOT REMOVE THE DEPENDENCE ON REF-SP. If the two asymptotic
        references are beaten by a theory-free knob, the null-rejection verdict
        is carried by the arm whose primary source is unread. v2 makes that arm
        implementable and testable and forces the verdict to name it; it does not
        make the dependence go away, and the owed KN-LIT entry is still owed.
      - >-
        IT CANNOT ARBITRATE OBJ-NULL-SYNTH, at all, ever, from committed state.
      - >-
        IT CANNOT SEE AN ENCODING-INDUCED DEPARTURE, cannot say anything about
        OBJ-REAL, and cannot transfer anything to cryptographic X.
      - >-
        IT CANNOT ESTABLISH THAT METHOD D FITS ANY CAP ON THIS HOST. That
        question is removed from the critical path, not answered.
      - >-
        IT CANNOT BE APPROVED BY ITS OWN CONTENTS. Answering a failed review is
        not passing one.
