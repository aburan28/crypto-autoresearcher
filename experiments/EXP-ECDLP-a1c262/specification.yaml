          is stated so the two are inter-convertible from the reported numbers.
          An invalidation rule forbids evaluating any criterion on the relative
          form.
        departure: >-
          ADDITION BEYOND WHAT WAS ASKED. A degenerate-case guard is added: if
          max(W_null, W_best_principled) < 0.05 the ratio is declared
