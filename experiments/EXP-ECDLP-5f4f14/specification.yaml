# EXP-ECDLP-5f4f14
# Stage-0 chord-slope fibres for H-ECDLP-8c879e.
# Frozen before the official run.
experiment:
  id: EXP-ECDLP-5f4f14
  hypothesis_id: H-ECDLP-8c879e
  source_idea: IDEA-20261006-76e571
  question_id: RQ-ECDLP-623a32
  goal_id: GOAL-ECDLP-001
  version: 1
  title: >-
    Chord-slope fibres under translation by one generator on one F_53 curve
  status: approved
  frozen: true
  designed_at: '2026-10-12'
  approved_by: coordinator
  approval_decision_id: DEC-20261012-ccc997
  execution_authorized: true
  objective: >-
    On the first eligible curve y^2 = x^3 + x + B over F_53, with B
    from 1 through 26, measure the chord slope from P to P+G. The
    positive reading is a loss of at least 1/5 and a split on at least
    half the slope values, written as two integer tests. A 500-draw
    null model must be usable or the claim is not scored. This is not
    a walk and it does not move the generic exponent.
  inputs:
    prime: 53
    curve_a: 1
    coefficient_limit: 26
    minimum_prime_factor: 17
    null_draws: 500
    null_redraws: 20
    seed_label: IDEA-20261006-76e571
    named_future_run_slot: RUN-ECDLP-42444c
  controls:
    - >-
      Every point used in a slope lies on the curve. A vertical chord
      is the sentinel and is not the residue 0. Two inverses must agree.
    - >-
      The second generator 2G is scored beside the primary row and does
      not decide it. If 2G is the identity, that side row is skipped.
    - >-
      The null model draws 500 functions from the domain onto the
      observed image. Fewer than four fifths of them splitting leaves
      the claim unscored.
  independent_variables:
    - the point P in the domain of the slope
  metrics:
    primary:
      - matrix_holds
      - beyond_matrix
    secondary:
      - scored
      - scanner_ok
  heuristic_under_test: >-
    IDEA-20261006-76e571: the slope loses at least a fifth of D and
    splits on at least half its values.
  preregistered_prediction:
    quantity: >-
      5*(|D| - |image|) is at least |D|, and twice the number of
      splitting values is at least the image size.
    formula: >-
      The positive reading is both inequalities on a scored curve.
      The negative reading is a scored curve that fails either one.
      An empty image or an unusable null model is not either reading.
    source: >-
      IDEA-20261006-76e571 fixes the integer tests for 1/5 and 1/2,
      and the 0.8 usability bar on 500 draws. Those bounds were fixed
      before this driver was executed.
  scale_relevance:
    tier: toy
    justification: >-
      One prime field of 53 elements and one curve. No walk is run.
    correspondence: null
  tail_checks:
    - No eligible B, or an empty image, leaves the claim unscored.
    - A point off the curve voids the cell.
  replication:
    seeds: []
    independent_instances: 1
    named_future_run_slot: RUN-ECDLP-42444c
    replication_note: >-
      One deterministic pass. The null-model labels are named in the driver.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 60
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one valid manifest for RUN-ECDLP-42444c.
    - Do not try a later B after the first eligible curve.
    - An unscored census is the recorded result. Do not move 1/5, 1/2, or 0.8.
  invalidation_rules:
    - A point used in a slope leaves the curve, or the two inverses disagree.
    - The sentinel is stored as the residue 0.
    - A timeout, crash, or missing image record.
  success_criterion: >-
    The manifest is valid, the scanner agrees, the null model is usable,
    the image is nonempty, 5*(|D| - |image|) is at least |D|, and twice
    the splitting count is at least the image size.
  falsification_criterion: >-
    The manifest is valid, the scanner agrees, the null model is usable,
    the image is nonempty, and either loss test or the split test fails.
  decision_impact:
    on_positive: >-
      Record that this one curve met both separators. Do not treat the
      slope as a sum-compatible index or as a faster discrete logarithm.
    on_negative: >-
      Record that this one curve missed a separator. Do not move the
      separators and do not start a walk from this manifest.
  required_artifacts:
    - experiments/EXP-ECDLP-5f4f14/runs/RUN-ECDLP-42444c/manifest.yaml
    - experiments/EXP-ECDLP-5f4f14/runs/RUN-ECDLP-42444c/raw-result.json
  assigned_to: executor
  launcher:
    trial_plan: experiments/EXP-ECDLP-5f4f14/trial-plan.json
    driver: experiments/EXP-ECDLP-5f4f14/implementation/run.py
    checker: experiments/EXP-ECDLP-5f4f14/implementation/check.py
  out_of_scope:
    - Any prime other than 53, and any second primary curve.
    - A walk, a factor base, and a security level.
