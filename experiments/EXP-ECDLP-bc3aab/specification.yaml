# EXP-ECDLP-bc3aab
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-83053a.
experiment:
  id: EXP-ECDLP-bc3aab
  hypothesis_id: H-ECDLP-2fc92b
  source_idea: IDEA-20261004-8ce853
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 4194303
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-83053a
  objective: >-
    Check the counts 22, 21, and 21, the product 9702, and the nearby gap 0.
  inputs:
    bit_length: 22
    doublings: 21
    additions: 21
    length_gap: 1
    doubling_gap: 0
    digit_product: 9702
    digit_sum: 64
    nearby_a: 21
    nearby_b: 21
    nearby_gap: 0
    nearby_product: 441
  controls:
    - >-
      The bit length is 22. The doubling count is 21. The addition
      count is 21. Reporting the addition count as 22 drops the gap
      against the bit length and invalidates the run.
    - >-
      Twenty-two exceeds twenty-one by 1. Twenty-one equals
      twenty-one, so that gap is 0. The product of 22, 21, and 21
      is 9702. Their sum is 64.
    - >-
      Two readings of the addition count are both 21. Their gap is
      0 and their product is 441.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 4194303 has bit length 22, 21 doublings, and 21
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 22. Count 21 doublings. Count 21 additions.
      Multiply 22, 21, and 21. Subtract 21 from 21.
    source: >-
      IDEA-20261004-8ce853 states the counts 22, 21, and 21, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 9702 and the nearby gap 0 are required. A check that stops at the bit length 22 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 21 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 22.
    - The doubling count is not 21.
    - The addition count is not 21.
    - The product is not 9702.
    - The addition count is reported as 22, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 22, that the doubling
    count is 21, that the addition count is 21, and that the product
    of those three counts is 9702.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 21.
  required_artifacts:
    - experiments/EXP-ECDLP-bc3aab/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-bc3aab/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-bc3aab/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-bc3aab/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-bc3aab/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-bc3aab/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
