# =============================================================================
# EXP-GFPN-05ff43 — Symmetrization-aware n=5 PDP ladder on EcGFp5
# Hypothesis: H-GFPN-9a29be / IDEA-20260920-a639a1
# Heuristic under test: HEUR-GFPN-DFLAT
# Approval: DEC-20260920-fe73de (standing user authorization 2026-09-06)
# =============================================================================
experiment:
  id: EXP-GFPN-05ff43
  hypothesis_id: H-GFPN-9a29be
  question_id: RQ-GFPN-c01af8
  goal_id: GOAL-GFPN-380702
  version: 1
  title: >-
    n=5 Gaudry PDP ladder on EcGFp5: raw / S_5 / 2-torsion⋊S_5 arms; D via FGLM;
    HEUR-GFPN-DFLAT; arithmetic-only band at p=2^64
  status: approved
  status_note: >-
    APPROVED 2026-09-20 by DEC-20260920-fe73de under AGENTS.md standing user
    authorization of 2026-09-06. Heuristic-validation + cost-model measurement
    contract. Preregistered prediction and HEUR-GFPN-DFLAT are frozen; never
    retune after a run. Approval authorizes implementation and ladder
    measurement as defined. Known-scalar instances only; every accepted
    decomposition requires an independently re-verified decomposition
    certificate. /run is a separate invocation. Amendments only under
    experiments/EXP-GFPN-05ff43/amendments/.
  approved_by: coordinator
  approved_at: '2026-09-20'
  approval_decision: DEC-20260920-fe73de
  approval_basis: >-
    Standing user authorization recorded in AGENTS.md on 2026-09-06.
    Coordinator completeness check is DEC-20260920-fe73de. User confirmation
    is not an outstanding gate.
  frozen: true
  frozen_at: '2026-09-20'
  execution_authorized: true
  execution_authorized_note: >-
    Authorized: toy-p' PDP ladder on EcGFp5-shaped curves; arms (i)(ii)(iii);
    FGLM degree and F_p op counts; D-flatness test; arithmetic-only projection
    to p=2^64; m=4 JV fallback on timeout; matched random controls;
    known-scalar verified instances. NOT authorized: attacking live systems,
    unknown-scalar solves presented as breaks, or extrapolating wall time.
  execution_authorized_decision: DEC-20260920-fe73de
  source_proposal: IDEA-20260920-a639a1
  designed_by: coordinator
  archived_by: TASK-20260920-40ef38
  class: heuristic-validation / cost-model measurement
  claim_tier: toy
  claim_tier_note: >-
    Direct measurement is on toy p' only. The p=2^64 band is modeled under
    HEUR-GFPN-DFLAT and is labeled modeled, never measured wall time.
  certificate:
    kind: decomposition
    kind_note: >-
      Every accepted m=5 (or m=4 fallback) relation MUST emit a decomposition
      certificate and be re-verified by code independent of the solver before
      the cell may be completed_valid (docs/claims-and-verification.md).
      Degree-only attempts that time out set certificate.kind none for that
      cell and validity invalid_measurement or not_measured — never
      negative_observation.
  objective: >-
    On EcGFp5-shaped double-odd curves over F_{p'^5}, measure ideal degree D
    (FGLM) and F_p operation counts for PDP arms (i) raw descended S_6,
    (ii) S_5 symmetrization, (iii) 2-torsion+S_5 (t_i = x_i + b/x_i), across a
    toy ladder of ≥3 primes spanning ≥12 bits; verify HEUR-GFPN-DFLAT
    (D flat within 10%); project an arithmetic-only full-ECDLP cost band at
    p = 2^64 − 2^32 + 1 next to the design-note ≥2^142 floor. Matched random
    controls with/without rational 2-torsion. Known-scalar instances only.
    m=5 timeout ⇒ not measured; m=4 Joux–Vitse fallback is the observable
    (KN-LIT-673219). Primary scope is EcGFp5; EcMasFp5-shaped prime-order
    curves may appear only as nearby-object controls (no 2-torsion arm).

  inputs:
    frozen_sources:
      - path: inputs/PORNIN-2022-274-ECGFP5/
        kn_lit: KN-LIT-8aff72
        role: EcGFp5 parameters and raw-system ≥2^142 floor
      - path: inputs/JOUX-VITSE-2010-157/
        kn_lit: KN-LIT-673219
        role: m=4 JV fallback method / F4-remake
      - path: research/equation-schemes-20260905/retrieved-pages/hal-00935050.txt
        kn_lit: null
        role: FHJRV symmetrized summation polynomials (arm iii)
      - path: inputs/ECMASFP5-HACKMD-2025/
        kn_lit: KN-LIT-47d541
        role: optional prime-order nearby-object shape (no arm iii)
    field:
      n: 5
      modulus_form: z^5 - c  # c chosen so irreducible over F_{p'}
      p_crypto: '18446744069414584321'  # 2^64 - 2^32 + 1; arithmetic-only band
    toy_ladder:
      rule: >-
        Select ≥3 primes p' spanning ≥12 bits between the smallest and largest
        (e.g. candidates near 2^12, 2^18, 2^24, and 2^30 if FGLM completes).
        Exact primes are computed by the executor with a deterministic
        primality test and recorded in the run; the drafting Coordinator does
        not invent unverified literals (AGENTS.md rule 9).
      min_primes: 3
      min_bit_span: 12
    curve_shapes:
      primary: >-
        EcGFp5-shaped double-odd y^2 = x(x^2 + 2x + c z) with c chosen so the
        group order is 2 · prime (or 2 · nearly-prime with recorded cofactor);
        rational 2-torsion point (0,0) required for arm (iii).
      control_random_with_2torsion: matched random ordinary curve with a rational 2-torsion
      control_random_without_2torsion: matched random ordinary curve without rational 2-torsion
      optional_ecmas_shape: >-
        EcMasFp5-shaped y^2 = x^3 + 3x + c z^4 prime-order (arms i–ii only)
    arms:
      - id: raw
        label: '(i) raw descended S_6'
        symmetrization: none
      - id: S5
        label: '(ii) S_5 elementary-symmetric'
        symmetrization: S_5
      - id: torsion_S5
        label: '(iii) 2-torsion + S_5'
        symmetrization: (Z/2)^4 rtimes S_5
        requires_rational_2torsion: true
    solver:
      primary: msolve or Macaulay2 F4 + FGLM over F_{p'}
      degree_measurement: FGLM ideal degree D
      cost_unit: F_{p'} field operations (instrumented), never wall time for transfer
    targets_per_cell: 20
    known_scalar: true

  controls:
    - name: n4_published_timing_anchor
      object: >-
        Reproduce one published n=4 Joux–Vitse / FHJRV decomposition timing
        within 2× on the same solver family before trusting n=5 cells.
      blocking: true
    - name: random_with_2torsion
      object: Random ordinary curve with rational 2-torsion at each p' (all three arms).
      blocking: true
    - name: random_without_2torsion
      object: Random ordinary curve without rational 2-torsion (arms i–ii only).
      blocking: true
    - name: degenerate_symmetrization_identity
      object: Identity symmetrization must reproduce arm (i) D and solutions exactly.
      blocking: true
    - name: orbit_lifting_verifier
      object: >-
        Independent verifier rejects any solution that does not lift to five
        factor-base points summing to R on the curve.
      blocking: true
    - name: known_scalar_instances
      object: Every target R = kG with k known; recovered decomposition verified against R.
      blocking: true

  independent_variables:
    - p_prime
    - curve_shape  # ecgfp5_shaped | random_2torsion | random_no_2torsion | optional_ecmas
    - arm  # raw | S5 | torsion_S5
    - m  # 5 primary; 4 fallback

  metrics:
    primary:
      - ideal_degree_D_per_arm
      - fp_operations_per_pdp
      - decomposition_success_rate
      - orbit_nonfreeness_ratio
      - D_variation_across_ladder
      - lifted_verified_points_per_success
      - projected_systems_at_p_2_64
      - projected_linear_algebra_cost_at_p_2_64
      - full_cost_band_bits_per_curve
      - heur_dflat_pass
    secondary:
      - wall_seconds_per_cell
      - peak_memory_bytes
      - m5_timeout_count
      - m4_fallback_D
      - m4_fallback_fp_ops
      - fglm_exponent_estimate
      - solver_id
      - certificate_verify_pass_rate

  heuristic_under_test: HEUR-GFPN-DFLAT
  preregistered_prediction:
    quantity: >-
      Ideal degree D per arm; D flatness; degree-drop ratios; arithmetic-only
      full-ECDLP cost band at p=2^64 for EcGFp5 arm (iii).
    formula: >-
      Under free orbits: D_raw ≈ 2^20, D_S5 ≈ 2^20/120, D_torsion_S5 ≈ 2^20/1920;
      measured ratios D_raw/D_sym ≥ 2^6 (S5) and ≥ 2^9 (torsion_S5) on every
      completed cell; HEUR-GFPN-DFLAT: relative D variation < 10% across ≥3
      primes spanning ≥12 bits; band bits =
      log2(N_systems · C_pdp) with N_systems from Gaudry double-large-prime
      balancing (~p^{2−2/5}) and C_pdp from measured F_p ops (D^2 floor and
      nominal 5·D^3 reported as the band edges). Design-note comparison
      constant: 142 (raw floor from KN-LIT-8aff72).
    source: >-
      IDEA-20260920-a639a1 / research/gfp5_deployed_curves_20260920.md;
      KN-LIT-8aff72 (raw floor); FHJRV HAL text (symmetrization);
      KN-LIT-673219 (m=4 fallback).
    claim_tier: toy
    optimistic_assumptions:
      - Free-orbit degree drop (actual D_sym ≥ D_raw/|G|; gap is measured).
      - FGLM exponent between 2 and 3 (both edges reported).
      - System count from design-note balancing; measured success rate replaces 1/m!.

  scale_relevance:
    tier: toy
    justification: >-
      D and F_p ops measured at toy p'. Transfer to p=2^64 is arithmetic-only
      under HEUR-GFPN-DFLAT (system counts × measured per-PDP ops). Wall time
      is never extrapolated. If HEUR-GFPN-DFLAT fails, the band is void for
      that arm.
    correspondence: null

  measured_vs_modeled:
    measured:
      - ideal_degree_D_per_arm
      - fp_operations_per_pdp
      - decomposition_success_rate
      - orbit_nonfreeness_ratio
      - D_variation_across_ladder
      - lifted_verified_points_per_success
    modeled:
      - projected_systems_at_p_2_64
      - projected_linear_algebra_cost_at_p_2_64
      - full_cost_band_bits_per_curve
    modeled_note: >-
      Modeled fields require heur_dflat_pass true for the arm; otherwise emit
      null with reason heur_dflat_failed.

  tail_checks:
    - >-
      Smoothest / lowest-D cell vs predicted free-orbit D: report
      D_sym · |G| / D_raw and flag if < 0.5 (severe non-freeness).
    - >-
      Highest per-PDP F_p op count on arm (iii): if still > 2^36 on completed
      cells, design-note floor essentially intact (falsification path).

  replication:
    seeds:
      - 2026092001
      - 2026092002
    independent_instances: 20
  replication_plan: >-
    ≥3 ladder primes × curve shapes × arms; 20 fresh known-scalar targets per
    cell. Seeds govern target/curve sampling streams; record every RNG source
    in the manifest.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 32
    maximum_runs: 64
    maximum_workers: 1
    per_cell_watchdog_seconds: null
    budget_note: >-
      Advisory nulls for wall/CPU. memory_gb=32 machine protection for FGLM.
      ECC unlimited. Per-cell soft watchdog may checkpoint; expiry is
      not_measured / resource_exhaustion, never negative evidence.

  stopping_rules:
    - Stop a cell when 20 targets are attempted or the per-cell watchdog fires.
    - Stop the ladder for an arm when ≥3 primes spanning ≥12 bits have completed D measurements (or all attempted cells timed out).
    - m=5 timeout or OOM ⇒ record not_measured; run m=4 JV fallback once per such cell; do not treat timeout as high degree.
    - Stop the experiment after primary metrics and heur_dflat_pass are recorded for every arm that has ≥1 completed m=5 cell, or after all cells are exhausted/timed out.

  invalidation_rules:
    - Missing required artifacts or certificate re-verify failure on an accepted decomposition ⇒ invalid_measurement for that cell.
    - Overwriting a run directory invalidates the procedure.
    - Using wall time to extrapolate to p=2^64 invalidates the cost band.
    - Scoring a timeout as evidence that D is large invalidates the run (rule 3).
    - Editing the preregistered_prediction after any run without an amendment invalidates subsequent scoring.
    - Unknown-scalar "break" claims are out of scope and invalidate the scientific boundary.
    - Counting solutions instead of verified lifted points invalidates success metrics.

  success_criterion: >-
    For each arm with ≥3 completed m=5 cells spanning ≥12 bits: D and
    fp_operations_per_pdp recorded; heur_dflat_pass decided; orbit_nonfreeness
    and lifted_verified_points recorded; if heur_dflat_pass, modeled band bits
    at p=2^64 emitted next to 142 with measured-vs-modeled labels. Arms that
    only have m=4 fallback report fallback metrics and heur_dflat_pass =
    not_applicable (insufficient m=5 D). Success is protocol completion with
    decidable metrics — not "128 broken".

  falsification_criterion: >-
    On completed m=5 EcGFp5-shaped cells: (F1) D_raw/D_torsion_S5 < 2^9 on any
    such cell; or (F2) heur_dflat_pass false (D variation >10% across the
    ladder); or (F3) arm-(iii) fp_operations_per_pdp remains > 2^36 on all
    completed cells; or (F4) EcGFp5-shaped D differs from random_2torsion
    control by >10% on matched cells (mechanism not generic). Timeouts do not
    fire F1–F4.

  required_artifacts:
    - experiments/EXP-GFPN-05ff43/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-GFPN-05ff43/runs/<RUN-ID>/command.txt
    - experiments/EXP-GFPN-05ff43/runs/<RUN-ID>/environment.json
    - experiments/EXP-GFPN-05ff43/runs/<RUN-ID>/stdout.log
    - experiments/EXP-GFPN-05ff43/runs/<RUN-ID>/stderr.log
    - experiments/EXP-GFPN-05ff43/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-GFPN-05ff43/runs/<RUN-ID>/ladder-table.yaml
    - experiments/EXP-GFPN-05ff43/runs/<RUN-ID>/heur-dflat.yaml
    - experiments/EXP-GFPN-05ff43/runs/<RUN-ID>/cost-band-p64.yaml
    - experiments/EXP-GFPN-05ff43/runs/<RUN-ID>/certificates/
    - experiments/EXP-GFPN-05ff43/implementation.md

  assigned_to: executor
  scientific_boundary: >-
    Toy measurement + arithmetic-only modeled band under HEUR-GFPN-DFLAT.
    Known-scalar instances only. No live-system attack. No wall-time
    extrapolation. m=5 timeout is not measured. EcMasFp5 full ladder is out of
    primary scope (optional nearby-object only). OA-SDH and cover audits are
    other GFPN experiments.
