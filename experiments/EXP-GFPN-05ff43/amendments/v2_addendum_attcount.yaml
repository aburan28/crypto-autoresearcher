  changes:
    RI-1_launch_multiplicity_bound_to_independent_counts:
      amends: gapattr RH-1 (additive - conditions on attribution; clauses (i)-(vi), the non-launch list and the gap rule unchanged); readbackfull RL-3 (the recorder-gap list gains named count failures)
      text: >-
        NORMATIVE. Terms. <dir> is the package's solver/ or health/
        directory; the SITE of solver/ is S-1 and of health/ is S-2.
        L(<dir>, <tag>) is the list, in launch order (RL-1 ordinal), of the
        launch records whose stdout_path is <dir>/<tag>.ms.log, and N is its
        length. The FILES OF THE TAG are <dir>/<tag>.ms, <tag>.ms.out,
        <tag>.ms.log, <tag>.ms.err and each of the last three followed by
        ".ssf-attempt<k>" for any k.
        (a) COUNTS AT S-1 AND S-2. For every (<dir>, <tag>) for which N >= 1,
            or for which the records below count at least one call:
            (i)   PER TAG: N equals the number of RB-1 attempt records
                  (readbackcover RB-1) of the site whose tag is <tag>, plus,
                  at S-1, the number of RL-2 pass-through records whose tag is
                  <tag>;
            (ii)  EVENT TAG: where solver-events.json records an SE-3 or HR-3
                  event of the site whose tag is <tag> (r3_resolve.py 276-279,
                  285-287, and their r4 counterparts), exactly ONE such event
                  exists; N equals the number of entries of its "attempts"
                  list (r3_resolve.py 270, 277), equals its accepted_attempt
                  (r3_resolve.py 313), and equals one plus the number of keys
                  of its renamed_files (r3_resolve.py 310); and the attempt
                  numbers its attempts list records are 1, 2, ..., N in that
                  order.
            (iii) PER SITE: the number of launch records whose stdout_path is
                  <dir>/<any tag>.ms.log equals, at S-1, the site counters
                  attempts_total plus passthrough_calls_gb_only_true
                  (r3_resolve.py 273, 383), and, at S-2, the site counter
                  attempts_total.
        (b) ONE LAUNCH PER OTHER OUTPUT PATH. Every stdout_path value that is
            not <dir>/<tag>.ms.log (a child job's child/<tag>.stdout, a
            callgrind child's <dir>/<tag>.callgrind.stdout, the comparator's
            comparator/stdout.log, a gp child's pari/<tag>.gp.stdout, and any
            other) is carried by AT MOST ONE launch record.
        (c) A FAILED COUNT IS A RECORDER GAP. If (a) fails for (<dir>,
            <tag>), the RL-3 recorder-gap list names a COUNT GAP (<dir>, <tag>,
            N and every count (a) read), and every file of the tag present is
            a recorder gap whatever clause of RH-1 would attribute it. If (a)
            (iii) fails for a site, the list names a SITE COUNT GAP (the site,
            the number of launch records and the counters read). If (b) fails
            for a stdout_path, the list names a DUPLICATE-PATH GAP (the path
            and the ordinals of the records carrying it), and every file RH-1
            attributes to any of those records is a recorder gap. A named gap
            of any of these kinds makes the verdict FAIL (RF-3 (a)), whether
            or not a file is present, as a recorder gap does.
        (d) FINAL FILES TO THE LAST RECORD ONLY. Where N >= 2 and (a) holds,
            <dir>/<tag>.ms, <tag>.ms.out, <tag>.ms.log and <tag>.ms.err are
            attributed by RH-1 (i) and (ii) only to the LAST record of L(<dir>,
            <tag>) (for an event tag, the accepted_attempt-th, which (a) (ii)
            makes equal to N); each earlier record of the list attributes, by
            RH-1 (vi), only the renamed files of its own attempt k, and nothing
            by (i) or (ii). A record outside L(<dir>, <tag>) whose argv names
            <dir>/<tag>.ms (a callgrind child, v2_solver.py 516-518) still
            attributes it by RH-1 (ii).
        (e) MONOTONE. (a)-(d) add conditions under which a file is a gap and
            remove attributions; they attribute no file RH-1 did not. PASS and
            PASS_ZL are not widened, and no verdict is added.
        (f) READS AND CLASS. (a)-(d) read the launch records, the RB-1
            attempt records, the RL-2 pass-through records, the SE-3 / HR-3
            events and the site counters of solver-events.json, read-only and
            after the driver has exited (as RH-7 bullet 1 states for RH-1).
            They are part of the RL-3 recorder-gap computation: class epsilon
            (SE-2 (5) recording); their verdict effect is RF-3 (a)'s,
            unchanged in kind.
        WHY. Every attempt of a re-solved tag carries the same stdout_path,
        stderr_path and argv (v2_driver.py 161-166; a1_health.py 141-147), so
        a positive source that names a file names it for every attempt, and
        the loss of one attempt's launch record left its files attributed to
        a sibling (CX-1). A positive source is sufficient only if it is unique
        to one launch; where it is shared, its MULTIPLICITY is checked here
        against counts that a different code path of the installing process
        writes (the resolve layer's per-attempt accounting RB-1, its
        pass-through records RL-2, the event's attempts list, accepted_attempt
        and renamed_files, and the site counters incremented for every
        attempt), so a lost launch record is a named gap. The callgrind launch
        needs no count of its own: callgrind runs only on outcome "ok"
        (v2_driver.py 207) and every SSF clause requires outcome
        degenerate_parametrisation or positive_dimensional (r3_resolve.py
        61-74), so a re-solved tag has at most one callgrind launch per solve
        call, and (b) covers a tag solved twice.
    RI-2_what_RH-1_attributes:
      amends: gapattr RH-1's WHY sentence (REPLACED; no clause changes)
      text: >-
        RH-1's WHY sentence ("WHY POSITIVE. Each clause names ... names exactly
        that file.") reads: "WHY POSITIVE. Clauses (i), (ii), (iii), (v) and
        (vi) each name the record from which the attribution is read (an argv
        element, the spec file the frozen driver writes before the launch,
        the event the r3 / r4 resolve layer writes in the installing
        process). Clause (iv) is the one directory clause, carried unchanged
        from childend RG-4 (b): it attributes every file under a directory
        that exactly one launch record's argv names (in the frozen launch
        set, comparator/ only, v2_driver.py 647-651); a lost comparator record
        leaves comparator/ files as gaps (review TASK-20260924-94cc33 LR-7), and
        a file written there by a process the rules do not know is attributed
        (review OB-1, IV-1; RGL-8). Where one positive source names a file for
        several launch records (the attempts of one tag), RI-1 binds the
        number of those records to counts written independently in the
        installing process; a file of a lost launch record is then a gap
        unless every such count was lost with it (RGL-9)."
    RI-3_development_checks_derivable_and_discriminating:
      amends: gapattr RH-6 (i) (19), (20) and (22) (read as below) and (i) (additive - (24)-(27))
      text: >-
        NORMATIVE. On the DELIVERED r4 code, in scratch development processes
        only (never in a package), with development STAND-INS as RF-6 words
        them:
        (i) (19), (20) read with RI-1: the third case ("one launch record of
