#
# THIS IS THE REMEDY what_the_readings_cannot_do NAMES: a targeted successor
# whose readings are failclosed's readings, UNCHANGED, applied to a review of
# this draft's DIFFERENCE from gapattr.
#
# The core change (RI-1) is the review's own cheapest mutation, generalised to
# every count the installing process writes independently of the launch
# recorder: the number of launch records of a solver or health tag must EQUAL
# the resolve layer's own count of that tag's calls and attempts, and a
# stdout_path of any other launch kind is carried by at most one launch
