  method_limits_declared:
    carried: RFL-1..RFL-7 of failclosed, RGL-1..RGL-5 of childend, RGL-6 and RGL-7 of gapattr and RGL-8 of attcount, unchanged. attcount's RGL-9 is REPLACED by RGL-10.
    RGL-10: >-
      The detectors RI-1, RJ-1 and RJ-3 read are written in the installing
      process: the RB-1 and RL-2 records, the SE-3 / HR-3 events and the site
      counters by the r4 layer through its single event writer, and
      raw-result.json by the frozen driver; RJ-2's script and the child jobs'
      spec files by the frozen code before the launch. A loss that removes a
      launch record AND every detector bound to it consistently is not
      detected by the detectors. It FAILs anyway whenever the launch left a
      file in the five directories (review TASK-20260924-be2daf OB-1: LN-3,
      LN-4b, LE-3), so the undetected class is the consistent loss of a
      launch that left no file (LN-6 meets no definition; LN-7b meets (ii)).
      At an event tag the event's attempts list is the attempt-record list, so
      the independent counts there are accepted_attempt, the renamed_files
      keys and the site counters (OB-10). An alteration of solver-events.json
      after the manifest records its hash FAILs the carried V-7 item; one
      between the launch and the manifest write is not detected by V-7 and is
      visible after the fact only through RL-3's listing hashes (OB-3; RGL-7).
      RL-1 (d) and RB-1's recording-failure rule remain the first line.
    RGL-11: >-
      RJ-4's closure rests on the six production call sites of the frozen
      run_child in hash-bound code (found by search and by the review's ast
      scan) and on the DV-18 (h) item on the delivered r4 code; RJ-2 rests on
      the frozen curve_facts writing the script before its launch (a1_pari.py
      91-96); RJ-3 on the frozen driver writing comparator.child for its one
      launch (v2_driver.py 650-655); RJ-1 on the frozen solve setting the key
      only where it calls callgrind_instructions (207-209). A callgrind launch
      after which callgrind_instructions raises leaves no returned result:
      the solve raises, the package fails, and the unmatched launch record is
      a CALLGRIND COUNT GAP (FAIL).
    RGL-12: >-
      Definition (ii) is read with an absent launch record as "not class (A)
      or (C)" (carried Coordinator decision (5) below). Under that reading a
      no-file lost-record launch of a kind without an independent detector is
      fail-open whatever its physical content (review CX-A: its child could
      not have executed argv). This draft binds every kind; it relies on no
      inference of execution or non-execution from a missing file.

