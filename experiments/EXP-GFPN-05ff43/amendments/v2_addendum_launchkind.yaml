      are named exactly by argv) (478-488). CORR-20260924-c248d6 records the
      statements they correct.
    RJF-6_confirmed_and_not_changed: >-
      BJ-0 held; BJ-2 held (no ordinary path launches two children with one
      stdout_path outside an event; every S-1 / S-2 attempt counted; 85
      reconstructed rows, no mismatch; callgrind launches equal the S-3
      records per tag on the two fixture packages, 283-284); BJ-3, BJ-4, BJ-5
      and BJ-6 held. RI-1's counts and RH-1's six clauses are therefore kept
      exactly; this draft adds detectors and gaps and attributes nothing.

  changes:
    RJ-1_callgrind_launch_count:
      amends: readbackcover RB-1 (additive - field (e) at S-1); attcount RI-1 (additive - a further count and named gap; its WHY sentence's last two sentences REPLACED)
      text: >-
        NORMATIVE.
        (a) RB-1 (e) AT S-1. Each S-1 attempt record (readbackcover RB-1)
            additionally records callgrind_result_present: true if the result
            the frozen solve() RETURNED for that attempt carries the top-level
            key "instructions_callgrind", false otherwise; copied from the
            returned result and from nothing else, as RB-1 requires. The frozen
            solve sets that key at one place only, v2_driver.py 209, inside
            `if callgrind_timeout and outcome == "ok"` (207), which calls
            callgrind_instructions, which launches exactly one child through
            run_child (v2_solver.py 517). It is a presence bit of one top-level
            key of the returned result: it reads no value inside
            res["instructions_callgrind"], no CG-3 field value and no
            callgrind-site record or count; VA-6 (c) and CC-5 are unchanged.
            S-2 attempt records carry no such field (a1_health.run_system
            launches no callgrind child; its one run_child is a1_health.py
            147). RL-2 pass-through records carry none (a gb_only solve
            returns at v2_driver.py 187-189, before 207).
        (b) THE COUNT. For every tag, Ncg(<tag>) is the number of launch
            records whose stdout_path is solver/<tag>.callgrind.stdout (the
            callgrind child, v2_solver.py 515-518). Ncg(<tag>) must EQUAL the
            number of S-1 attempt records whose tag is <tag> and whose
            callgrind_result_present is true. PER SITE: the number of launch
            records whose stdout_path is solver/<any tag>.callgrind.stdout must
            equal the number of S-1 attempt records with
            callgrind_result_present true.
        (c) A FAILED COUNT IS A RECORDER GAP. If (b) fails for a tag, the RL-3
            recorder-gap list names a CALLGRIND COUNT GAP (the tag, Ncg and the
            count read), and every file solver/<tag>.callgrind.stdout,
            <tag>.callgrind.stderr and <tag>.callgrind.out present is a
            recorder gap whatever clause of RH-1 would attribute it; if the
            per-site equality fails, a CALLGRIND SITE COUNT GAP is named
            (the number of callgrind launch records and the count read). A
            named gap of either kind makes the verdict FAIL (RF-3 (a)), whether
            or not a file is present, as RI-1 (c) words its gaps.
        (d) MONOTONE, READS AND CLASS, as RI-1 (e) and (f) word them: (b) and
            (c) add conditions under which a package FAILs and attribute no
            file; PASS and PASS_ZL are not widened and no verdict is added; the
            count reads the launch records and the S-1 attempt records
            read-only after the driver has exited, as part of the RL-3
            recorder-gap computation (class epsilon); callgrind_result_present
            is an RB-1 field (class epsilon, VC-1 (b)).
        (e) RI-1's WHY sentence: its last two sentences ("The callgrind launch
            needs no count of its own: ... and (b) covers a tag solved twice.")
            are REPLACED by: "A launch whose record is lost is detected only by
            evidence written independently of the launch recorder whose
            presence implies the launch. Files the child writes cannot be that
            evidence, because a child can fail before writing any (v2_solver.py
            188, 206-208; review TASK-20260924-be2daf CX-A). RI-1 (b)'s
            uniqueness bounds duplication, not loss. The callgrind launch is
            bound by RJ-1 to the returned result's key, which the frozen solve
            sets exactly when it calls callgrind_instructions (v2_driver.py
            207-209), which launches exactly once (v2_solver.py 517)."
    RJ-2_gp_script_is_launch_evidence:
      amends: childend RG-4 (b)'s non-launch list as gapattr RH-1 carries it (a1_pari.py 91-93 REMOVED; the effect is additive - a gap condition added)
      text: >-
        NORMATIVE. pari/<tag>.gp, written by the frozen curve_facts before its
        one launch (a1_pari.py 91-93) and named as the last whole element of
        that launch's argv (a1_pari.py 94), is no longer a frozen NON-LAUNCH
        write. It is attributed only as RH-1 (ii) attributes it, to the gp
        launch record whose argv names it; every run_child record carries argv
        from its first line (v2_solver.py 152), a refusal before fork
        included. A pari/<tag>.gp attributed to no launch record is a
        RECORDER GAP and the verdict is FAIL (RF-3 (a)). The other non-launch
        entries (a1_health.py 141-143 and 251) are unchanged. WHY: the script
        is written by the installing process before the launch and
        independently of the recorder, so its presence implies a gp launch;
        listing it as a non-launch write removed the only evidence a lost gp
        record leaves when the gp child writes nothing (review CX-A-gp 428;
        OB-8 486).
    RJ-3_comparator_launch_count:
      amends: attcount RI-1 (additive - a further count and named gap)
      text: >-
        NORMATIVE. The number of launch records whose stdout_path is
        comparator/stdout.log must equal 1 if the package's raw-result.json
        carries a mapping "comparator" with the key "child", and 0 otherwise.
        The frozen driver writes comp["child"] from the returned record of its
        one comparator launch (v2_driver.py 650, 652) and stores comp as
        raw["comparator"] (655) before either exit path (656-659). A mismatch
        names a COMPARATOR COUNT GAP (the number of comparator launch records
        and the key's presence) and makes the verdict FAIL (RF-3 (a)); every
        file under comparator/ is then a recorder gap whatever clause of RH-1
        would attribute it. Reads raw-result.json read-only after the driver
        has exited (class epsilon), as RB-2 (a) reads it. Monotone as RJ-1 (d).
        WHY: without it the lost-record detection of the comparator rests on
        its own files (RH-1 (iv); review 94cc33 LR-7) or, for a no-file
        failure, on the frozen item v2_check_run.py 66-67 firing because the
        comparator is the package's first capped launch and its failure ends
        the package (review CX-A-cmp 429; FC-4 465-467); the count makes the
