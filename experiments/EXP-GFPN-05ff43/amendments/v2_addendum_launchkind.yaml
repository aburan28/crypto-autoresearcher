  transfer_assumptions: >-
    (1) CPython 3.11 semantics as failclosed RFL-4 states them, and the
    operating-system behaviour childend RGL-1 states; a deviation yields
    `undetermined` or FAIL, except as RGL-6 states. (2) The frozen code is
    hash-bound, so the lines RJ-1..RJ-4 name are stable: the key
    instructions_callgrind is set only at v2_driver.py 209; curve_facts writes
    its script before its launch; the comparator's child record is stored
    before either exit path; the production run_child call sites are the six
    of RJ-4 (a). The r3 resolve layer's events, attempts, renamed_files,
    accepted_attempt and counters are carried into r4 unchanged, and RB-1 /
    RL-2 records are written for every call as readbackcover and readbackfull
    word them, with RB-1 (e) at S-1. (3) The detectors are read after the
    driver exits; they change no child's argv, env, limit or order. REG-1
    neutrality is shown on the r4 G1. (4) Nothing here transfers to 262151,
    16777291 or 1073741831 cells, which have not run, or to p = 2^64 - 2^32 +
    1.

