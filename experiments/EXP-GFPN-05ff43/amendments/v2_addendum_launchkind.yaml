# The TARGETED SUCCESSOR that DEC-20260924-babd04 orders after the DRAFT
# AMD-EXP-GFPN-05ff43-20260924-attcount (sha256
# 4154fd5206dde2987f9fe049e779078f7212c6d4afd23d9303e880946ea11a48) was
# decided NOT APPROVABLE AS WRITTEN under the readings it incorporates
# unchanged from failclosed, applied to the zero-run red-team review of its
# difference TASK-20260924-be2daf (archived by TASK-20260924-682890, commit
# e01f4d270):
# - RFR-1 FAILS on CX-A: a callgrind launch whose child fails to open its
#   stdout file (v2_solver.py 188, 206-208) leaves no file; with its launch
#   record lost, RI-1 (which counts only <dir>/<tag>.ms.log launches) sees
#   nothing and the package PASSes while a created child with no record has
#   no recorded pair (definition (ii), read with an absent record as "not
#   class (A) or (C)"). Lost-record class, not foreign-process. The gp launch
#   (CX-A-gp) is in the same position because its pre-launch script is listed
#   as a non-launch write.
# - RFR-2 HOLDS (85 reconstructed (site, tag) rows, no mismatch; N-1..N-13;
#   the RKR-4 (b) rows); RFR-3 and RFR-4 HOLD (RFR-4 confirmed in the review's
#   own words).
# - Fail-closed findings FC-1..FC-7 are never a bar; FC-1, FC-2 and FC-6 are
#   repaired here because they would stop the r4 stage by construction.
#
# THIS IS THE REMEDY what_the_readings_cannot_do NAMES: a targeted successor
# whose readings are failclosed's readings, UNCHANGED, applied to a review of
# this draft's DIFFERENCE from attcount.
#
# The core change is PRESENCE PER LAUNCH KIND. attcount bound the MULTIPLICITY
# of shared sources; a lost launch that leaves no file has no source to count.
# Each of the six production call sites of the frozen run_child (a closed set
# in hash-bound code) gets a lost-record detector written independently of the
# launch recorder whose presence implies the launch: RJ-1 (callgrind: a
# presence bit of the returned solve result), RJ-2 (gp: the script the frozen
# code writes before the launch), RJ-3 (comparator: raw-result.json's
# comparator.child), with RI-1 (msolve at S-1 and S-2) and the spec file (child
# jobs) as before; RJ-4 tables them, makes an unknown kind a gap and closes the
# set at stage time. Every change only adds conditions under which a package
# FAILs; none attributes a file RH-1 and RI-1 did not.
#
# It is an ADDITIVE addendum. It INCORPORATES attcount in full (RI-1..RI-6,
# RGL-8), and through it gapattr (RH-1..RH-8, RGL-6, RGL-7), childend
# (RG-1..RG-9, RGL-1..RGL-5), failclosed (RF-0..RF-8, RFL-1..RFL-7),
# readbackclose, readbackfull, readbackcover, valueclose with VA-1..VA-12 and
# everything they incorporate, UNCHANGED, except what RJ-1..RJ-8 replace or
# add; attcount's RGL-9 is REPLACED by RGL-10. Only what is replaced or added
# is written here.
#
# WHAT IT IS NOT: approved, evidence, a prediction, a hypothesis status move, a
# security statement, or a change to any frozen byte, msolve / valgrind /
# callgrind_annotate / gp / Sage binary, flag or argv, REG-1 item or exclusion,
# K, spacing, SF-2 (c) / HR-6 cap, DV-17 predicate, health-check seed, pattern,
# expected D or pass predicate, watchdog, envelope value, arm, cell, stream or
# reading rule. Approval is a later, separate Coordinator decision (reserved
# DEC-20260924-daf670 under reserved TASK-20260924-cf8471, ledger archive
# reserved TASK-20260924-cbce2f), which reads the ARCHIVED bytes of this file
# (addendum_sha256 in TASK-20260924-a571c7's receipt) and of the red-team
# review of its difference (TASK-20260924-d897a6, snapshot
# TASK-20260924-68cf6b).
# =============================================================================
