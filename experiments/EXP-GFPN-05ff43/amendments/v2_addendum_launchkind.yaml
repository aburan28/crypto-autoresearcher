    RJ-4_launch_kind_completeness:
      amends: attcount RI-1 (additive - an unknown-kind gap); failclosed / readbackfull DV-18 (h) (additive - a closure item)
      text: >-
        NORMATIVE.
        (a) THE TABLE. The production launches of the frozen trees are the
            calls of v2_solver.run_child at exactly six sites (RLR-2, as
            re-derived by review TASK-20260924-be2daf BJ-5,
            review-report.yaml 374-378). Each launch kind has a LOST-RECORD
            DETECTOR, i.e. evidence written independently of the launch
            recorder whose presence implies the launch:
            - LK-1 child job, v2_driver.py 101, stdout child/<tag>.stdout:
              the spec file child/<tag>.spec.json the frozen driver writes
              before the launch (98-99) and names as argv's last element (100);
              a lost record leaves it a recorder gap (RH-1 (ii) needs the
              record; review LCJ-1 FAIL; RI-3 (22)).
            - LK-2 msolve at S-1, v2_driver.py 166, stdout
              solver/<tag>.ms.log: RI-1 (a) (RB-1 attempt records, RL-2
              pass-through records, the SE-3 event, the site counters).
            - LK-3 callgrind, v2_solver.py 517, stdout
              solver/<tag>.callgrind.stdout: RJ-1.
            - LK-4 comparator, v2_driver.py 650, stdout comparator/stdout.log:
              RJ-3.
            - LK-5 msolve at S-2, a1_health.py 147, stdout
              health/<tag>.ms.log: RI-1 (a) (RB-1 attempt records, the HR-3
              event, the site counter).
            - LK-6 gp, a1_pari.py 96, stdout pari/<tag>.gp.stdout: RJ-2 (the
              pre-launch script file).
        (b) UNKNOWN KIND. A launch record whose stdout_path is of none of the
            six forms of (a) names an UNKNOWN-KIND GAP (its ordinal and
            stdout_path) in the RL-3 recorder-gap list and makes the verdict
            FAIL (RF-3 (a)). Monotone as RJ-1 (d).
        (c) CLOSURE ITEM. DV-18 (h)'s closure scan on the delivered r4 code and
            the frozen trees adds: the production call sites of
            v2_solver.run_child (by ast; every call through the module
            attribute V.run_child or the module global run_child, as review
            be2daf BJ-5 derived them) are exactly the six of (a), and no r4
            function calls run_child. Another site is a STOP (VA-12 (b)
            re-pointed).
        WHY: attcount bound the multiplicity of shared sources; loss must be
        bound per launch KIND. The kinds are a closed set in hash-bound code:
        six call sites of one frozen function. A table over them has a floor,
        unlike the execution-path enumerations that did not converge
        (KN-TECH-79d6b9); (b) makes a seventh kind FAIL at run time and (c)
        makes it STOP at stage time.
    RJ-5_development_checks:
      amends: attcount RI-3 ((25) read as below; stand-in level; additive - (28)-(32))
      text: >-
        NORMATIVE. On the DELIVERED r4 code, in scratch development processes
        only (never in a package), with development STAND-INS as RF-6 words
        them:
        (a) GAP-LEVEL EXPECTATIONS. RI-3 (25) reads: "the same objects
            evaluated under gapattr RH-1 as worded, i.e. with RI-1 (a) and (d)
            disabled in the scratch evaluator only, yield NO RI-1 named gap and
            NO recorder gap on LR-1, LR-2, LR-3 and LR-5 (as the review
            found); if they yield one, the check cannot see the repair, and it
            is a STOP." For every DV-18 object altered IN PLACE after the
            wrapper recorded the hash of solver-events.json, the expectation is
            stated at the gap level; the verdict is recorded, and the carried
            V-7 item's FAIL on the altered file (r3_check_run.py 153-158) is
            expected and is not the discriminant (review FC-1).
        (b) STAND-IN LEVEL. Every development stand-in of RI-3 (24), (26) and
            of (28)-(30) below replaces a callee BENEATH the SE-3 / HR-3
            wrapper (the executable the frozen run_child launches, or a
            function the frozen solve, run_system, callgrind_instructions,
            child_job or curve_facts calls), never solve or run_system
            themselves, so that RB-1 attempt records, events and site counters
            are written as in a package (review FC-6).
        (c) (28) THE CX-A DISCRIMINATING CONTROL: a development package in
                 which a callgrind child's open of its stdout file fails (a
                 stand-in, resolved at call time in the child, that raises for
                 names ending ".callgrind.stdout"; review be2daf
                 counterexamples.CX-A.cheapest_discriminating_control), its
                 launch record then removed in place: with RJ-1 disabled in the
                 scratch evaluator only, NO named gap and NO recorder gap (if
                 there is one, the check cannot see the repair: STOP); under
                 this draft, a CALLGRIND COUNT GAP and FAIL. The stand-in
                 changes no read of the parent (the parent opens no such name
                 with os.open; recorded in the DV-18 output).
            (29) a DV-18 (e) controls-a1 development package with its gp launch
                 record removed in place: pari/<tag>.gp a recorder gap, FAIL;
                 and one whose gp child's stdout open fails (a stand-in as in
                 (28), for names ending ".gp.stdout") with its record removed:
                 pari/<tag>.gp a recorder gap, FAIL.
            (30) a DV-18 (b) anchor-identity development package with its
                 comparator launch record removed in place: a COMPARATOR COUNT
                 GAP, FAIL.
            (31) a development package with one launch record appended in place
                 whose stdout_path is of none of RJ-4 (a)'s forms: an
                 UNKNOWN-KIND GAP, FAIL.
            (32) THE POSITIVE CONTROL: every unaltered development package of
                 RI-3 (19)-(27) and of (28)-(31), and every DV-18 (a), (b) and
                 (e) package, yields no named gap of any kind (COUNT, SITE
                 COUNT, DUPLICATE-PATH, CALLGRIND COUNT, CALLGRIND SITE COUNT,
                 COMPARATOR COUNT, UNKNOWN-KIND) and no recorder gap.
        IN PLACE, NOT MOVED, as RI-3 states it. STOP (VA-12 (b) re-pointed) on
        any failure of RI-3 (19)-(27) as read here or of (28)-(32). Every
        DV-18 output is a DEVELOPMENT OBSERVATION: never a gate package, never
        a result, never compared with a gate package for selection, never a
        reason to re-run anything; its values at development primes are toy
        harness values and never evidence about D.
