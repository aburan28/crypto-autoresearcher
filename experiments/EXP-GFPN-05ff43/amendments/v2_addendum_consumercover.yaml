    CC-2_consumer_dispositions_by_derived_value:
      new: true
      text: >-
        NORMATIVE. Definitions are those of pre_approval_readings below. For
        every classified site, every value that is a field of the site's
        child record, or is DERIVED from one, has exactly one disposition.
        Dispositions are stated per VALUE, so any consumer of a listed value
        is covered by the value's disposition, whoever reads it and wherever
        it is read. Every disposition below is REACHABILITY-INDEPENDENT: it
        applies whether or not a given consumer is reached by an r3 command.

        S-1 and S-2 (the wrapped msolve sites). CLASS RULE: every consumer
        with effect E1-E4 of an S-1 or S-2 record field, or of a value derived
        from one, is either
        (alpha) a reader of the result the SE-3 wrapper (S-1) or the HR-3
                wrapper (S-2) RETURNS, or of a value copied or derived from
                it; or
        (beta)  a reader of a file that the RECORDED attempt left under its
                original name (<tag>.ms, .ms.out, .ms.log, .ms.err).
        Disposition: covered by SE-2..SE-4 and HR-1..HR-8 as approved or
        incorporated. The one permitted exception is the frozen solve() and
        run_system() bodies themselves and the frozen functions they call
        inside the wrapped call (parse, classify, substitute), which ARE the
        attempt. A consumer that reads a renamed attempt file
        (<tag>...ssf-attempt<k>), reads a non-recorded attempt's result, or
        reads a site field from outside the wrapper while a wrapped call is
        in progress is OUTSIDE the class rule.

        S-3 (the callgrind site). Values and their dispositions:
        V-1  the record res["instructions_callgrind"] and its child mapping
             (v2_solver.py lines 519-547). Direct consumers:
             K-1 r2_reg1.compare (b) (r2_reg1.py lines 256-262; whole-entry
                 comparison minus X1..X17; effect E2 through R-7):
                 disposition CG-4, unchanged.
             K-2 the run wrappers' collect(raw, "rlimit_as_child_getrlimit")
                 (v2_run_wrapper.py line 202, a1_run_wrapper.py line 324,
                 r1_run_wrapper.py line 408, r2_run_wrapper.py line 474, and
                 any r3 derivative; generic key-name collection; effect E5,
                 building V-3): frozen and unchanged; records only.
             K-3 r1_reg1.compare (r1_reg1.py lines 168-174; whole-entry
                 comparison; effect E2 in the RETIRED r1 lineage):
                 disposition: retired; CC-5 forbids any r3 import from
                 implementation-v2-r1/.
             K-4 the copies into fixture and cell target rows (v2_driver.py
                 lines 360, 1180; effect E5): recorded copies.
             K-5 the frozen checker's walk (v2_check_run.py line 99) and
                 serialization test (line 103), and r2_check_run's
                 find_solver_records (lines 81-90) (effect E7; they react to
                 no callgrind key, premise-check.md lines 1249, 1264, 1288):
                 no disposition needed; the consumer census confirms E7.
        V-2  the REG-1 verdict and report (built by K-1). ANY consumer:
             disposition CG-4, unchanged (a REG-1 failure fails REG-1 as
             frozen, and R-7 refuses every later package).
        V-3  manifest resources.child_rlimit_as_read_back_by_getrlimit (built
             by K-2; it mixes the callgrind child's read-back with the
             primary children's). ANY consumer with effect E2: disposition
             CC-3. ANY consumer with effect E5 or E6: recorded or reported
             only (the three development harnesses r2_dv12.py line 261,
             r1_toy.py line 386 and a1_toy.py line 380 are E6).
        V-4  the frozen checker's verdict (v2_check_run.main, run unchanged by
             a1_check_run.main line 133, r1_check_run line 37 and r2_check_run
             lines 47, 70). ANY consumer: as frozen. A checker failure is
             read by CC-3 when its failing item is attributable to V-3's
             callgrind entry.
        V-5  the CG-3 records in solver-events.json (site
             "v2_driver.solve/callgrind"; r3 only). ANY consumer: record and
             report only. An r3 consumer with effect E1-E4 is a DV-11 STOP
             (CC-5).
        V-6  the callgrind log files <tag>.callgrind.stdout and .stderr, and
             the removed <tag>.callgrind.out and <tag>.cg.ms.out. Consumers:
             the CG-3 recording (r3) and DV-17 (development); any other
             consumer with effect E1-E4 is outside this table.
        EXPECTATION, NOT A RULE: no other consumer of an S-3 value with
        effect E1-E4 exists. CU-2 tests it; the reading, not this sentence,
        governs.

    CC-3_checker_failure_at_the_callgrind_site:
      replaces: launchcover CG-4's last paragraph (lines 355-358)
      text: >-
        In fixture and in cells with m = 4 (target 0) the callgrind record is
        recorded, REG-1 (b) compares it at G1 (CG-4), and ONE further check
        reads one of its fields: the frozen checker's cap check reads the
        callgrind child's cap read-back through V-3 (CORR-20260924-e78b7a).
        No other check reads a callgrind field, subject to CU-2. The wrappers
        and the checker stay frozen and unchanged; no field is removed from
        V-3 and no exclusion or tolerance is added.
        PRE-DECLARED READING:
        - A frozen-checker failure whose failing read-back entry equals the
          callgrind child's read-back recorded by CG-3 (CC-4), and does not
          equal any primary child's read-back in the same package, is an
          ENVELOPE OUTCOME AT S-3. The package fails as frozen and is handled
          by the frozen failure and contingency rules exactly as any other
          checker failure; no rule is added.
        - If it occurs in G1 or in any gate package, the lineage STOPS at an
          impediment. A new Coordinator decision reads the CG-3 records and
          rules. G1 is never re-run to obtain a pass. Any remedy is a new
          draft.
        - If the failing entry cannot be attributed (it equals both, or
          neither), it is read as an envelope outcome of unknown site, with
