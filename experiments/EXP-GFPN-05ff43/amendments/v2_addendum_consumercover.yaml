  # ---------------------------------------------------------------------------
  # PRE-DECLARED READINGS OF THE CONSUMER CENSUS (fixed now, before it runs)
  # ---------------------------------------------------------------------------
  pre_approval_readings:
    source: >-
      The archived outputs of TASK-20260924-5dfbfd (snapshot
      TASK-20260924-ad3f9a): consumer-census.md, consumer-census.json and
      cu_check.py under
      experiments/EXP-GFPN-05ff43/dev-evidence/consumer-census/. The census
      launches no msolve, valgrind, callgrind_annotate, gp, Sage or builder
      child and creates no run package. It reads source code and archived
      bytes only, and imports no module of the scanned trees.
    definitions: >-
      - CLASSIFIED MSOLVE SITE: S-1, S-2 and S-3 of CC-1, under the
        healthresolve definition (healthresolve lines 457-471, as
        incorporated).
      - SITE RECORD: every mapping built from a child launched at S-1, S-2 or
        S-3, with every key the enclosing frozen function sets on it:
        at S-1, the solve() result (v2_driver.py lines 158-214), its
        "solver" mapping (lines 150-154, 167-168) and every key solve() sets;
        at S-2, the run_system record and every key a1_health derives from
        it (census.md lines 300-308); at S-3, res["instructions_callgrind"]
        and its "child" mapping (v2_solver.py lines 519-547), including the
        fields that come from callgrind_annotate.
      - DERIVED VALUE: any value computed from a site-record field and stored
        or passed elsewhere: target and cell rows of raw-result.json,
        manifest.yaml (for example resources.child_rlimit_as_read_back_by_getrlimit
        and msolve_threads_executed), solver-events.json, REG-1 reports,
        checker verdicts, accounting outputs, execution reports and bundles.
        Derivation is followed TRANSITIVELY to a fixpoint.
      - ACCESS MODES: (m1) a literal key or attribute; (m2) generic
        key-name collection (a recursive function that gathers values by
        key name); (m3) a recursive walk that tests keys or values; (m4)
        whole-entry or whole-record comparison or hashing; (m5)
        serialization followed by a substring or regex test; (m6)
        iteration over a record's keys or items; (m7) reading a derived
        value; (m8) reading a file the site leaves (logs, outputs, renamed
        attempt files) by path or glob.
      - EFFECT CLASSES: E1 classifier or outcome class; E2 pass / fail check
        or gate (REG-1, checkers, preflight refusals and gate_pass included);
        E3 D, solution-set or degree computation; E4 scoring or aggregation
        into a reported statistic; E5 recorded copy or aggregate; E6
        report-only (prints, development bundles); E7 traverses without
        reacting (no output depends on the value).
      - CONSUMER: a function in a scanned file that accesses a site-record
        field or a derived value by any access mode.
      - SCANNED FILES: every .py file (and every generated-code string the
        census parsed; census.md lines 228-232) under
        experiments/EXP-GFPN-05ff43/implementation/,
        implementation-v2/, implementation-v2-a1/, implementation-v2-r1/ and
        implementation-v2-r2/; and every .py file under tools/, harness/ and
        orchestration/ that opens raw-result.json, manifest.yaml or
        solver-events.json of a run package, each with its HEAD sha256.
      - REACHABLE: reached by a command of either r2 plan (the census's
        method), by the r2 wrapper or checker processes, or by a repository
        tool that would read an r3 run package.
    CU-5_integrity: >-
      APPLIED FIRST. The consumer census is INCOMPLETE if any of these fails:
      - this draft's bytes equal the addendum_sha256 in TASK-20260924-a28f0e's
        receipt;
      - the launchcover draft hashes to c27ffe5c...f447, the healthresolve
        draft to ccb55334...291a70d, the seedresolve draft to
        dc714a44...ee81, and the solverevent draft to 011d4b2c...9b7f;
      - census.md, census.json and census_scan.py equal the
        TASK-20260924-c65bfb receipt's path_sha256;
      - premise-check.md, premise-check.json and lp_check.py equal the
        TASK-20260924-0957c2 receipt's path_sha256;
      - every implementation-v2/ file read equals the TASK-20260923-0fa03f
        phase-A receipt; every implementation-v2-a1/ file read equals the
        TASK-20260923-4ff597 receipt; every implementation-v2-r1/ file read
        equals the TASK-20260923-53a47d receipt; every implementation-v2-r2/
        file and both r2 plans read equal the TASK-20260924-5ca2a5 receipt;
        every v1 implementation/ file read equals the value the census
        recorded for it (census.md lines 152-183);
      - the check launched any solver, valgrind, callgrind_annotate, gp,
        Sage or builder child, or imported a module of a scanned tree.
      Files under tools/, harness/ and orchestration/ are bound by no
      receipt; their HEAD sha256 is recorded and they are not a bar.
      An incomplete census is never read. The approval act waits for a
      completed one.
    CU-1_site_table: >-
      The census compares CC-1 with census.json, entry by entry and field by
      field: file, argv line, launch line (and wrapper argv line for S-3),
      enclosing function, classified, reached_by_commands and reachable.
      EQUALITY RULE: line numbers, function names, booleans and command sets
      are equal when identical; a classified value is equal when it is the
      census.json value verbatim, or the boolean true where census.json
      carries true, or, for S-3 only, the DEC-20260924-afdc3b R-CG ruling on
      the census.json value; an UNSTATED field is UNEQUAL.
      READING: this draft is approvable as written ONLY IF every entry has 0
      differences and 0 unstated fields. Otherwise it is NOT approvable as
      written.
    CU-2_consumer_census: >-
      The census reports:
      (a) COMPLETENESS: for each access mode m1-m8, the method used and every
          hit in every scanned file, each with file, line, function, site,
          record or derived value, field, mode, effect class, reachability,
          and the rule or recorded manual reading that classified it; the
          derived values found, followed to a fixpoint; and the count of
          unclassified hits.
      (b) S-3: every consumer with effect E1-E4 of an S-3 record field or of
          a value derived from one, with the CC-2 value (V-1..V-6) and row it
          falls under, or "NOT COVERED".
      (c) S-1 and S-2: every consumer with effect E1-E4 of an S-1 or S-2
          record field or derived value, with its class (alpha, beta, or the
          permitted frozen-body exception) or "OUTSIDE THE CLASS RULE".
      (d) every CC-2 row (K-1..K-5) and whether the census finds it, with
          its reachability.
      READING: this draft is approvable as written ONLY IF
      - (a) is complete: every mode was searched in every scanned file and
        0 hits are unclassified; AND
      - (b) finds NO consumer "NOT COVERED"; AND
      - (c) finds NO consumer "OUTSIDE THE CLASS RULE".
      Otherwise it is NOT approvable as written, and the approval act orders
      a successor draft.
      NOT A BAR, ruled by the approval act: a CC-2 row the census does not
      find (over-listing disposes of nothing that runs); a reachability
      different from any expectation (every disposition is
      reachability-independent); consumers with effect E5, E6 or E7.
    CU-4_other_child_records: >-
      INFORMATIONAL. For every child launch the census lists that is not an
      msolve site (callgrind_annotate belongs to S-3; the builder, gp, Sage,
      version probes and host scans; census.md CN-4), every consumer with
      effect E1-E4 of its record or of a value derived from one, with file,
      line, mode and effect. The approval act rules on each, as
      DEC-20260924-afdc3b ruled CN-4. A gating input that depends on the
      clock or an unseeded random state and is not already disclosed in
      launchcover CG-9 is recorded and ruled. Not a bar.
    what_the_readings_cannot_do: >-
      They cannot change R, the DV-17 predicate or reference, the SF-1 clause
      list, K, the SF-2 (c) / HR-6 cap, REG-1, the exclusion list, any frozen
      wrapper, checker or comparator, HR-1..HR-8, CG-2..CG-6 or CC-2..CC-5. A
      failed reading makes this draft not approvable as written. It never
      licenses an approval with a changed rule, a removed field, an added
      exclusion or an added tolerance, which would need a new draft.

  # ---------------------------------------------------------------------------
  options_weighed:
    scope_note: >-
      These are options for the DEFECT LP-2 (iv) found (an undeclared gating
      reader of a callgrind field). The callgrind-site options CA..CF of
      launchcover (lines 672-737) are carried as the record of that choice;
      CA stands.
    UA_dispose_by_value_and_census_every_consumer:
      verdict: ADOPTED (CC-1..CC-8, CU-1, CU-2)
      why: >-
        - It closes the class, not the instance: a value disposed of once
          covers every present and future reader of it.
        - It keeps every approved criterion and every frozen file.
        - Its census is cheap (no solver) and its readings are fixed before
          it runs.
        - The one gating reader found (the cap check) is correct machine
          protection and already has a known reference value
          (premise-check.md lines 1298-1333); it gets a pre-declared reading
          instead of a change.
    UB_launchcover_option_CD:
      verdict: >-
        NOT ADOPTED FOR THIS DEFECT. It remains the declared route for its
        other two triggers (a DV-17 STOP; a REG-1 difference in callgrind
        fields coinciding with a CG-3 indicator), unchanged.
      why: >-
        CD re-measures the callgrind child on a log-visible SSF indicator
        (launchcover lines 711-726). The defect found is a reader of the
        child's cap read-back, which is not a function of msolve's clock
        seed. CD would add a third in-process replacement and would still
        leave the checker path undeclared. launchcover's LP-2 reading allows
        "a successor draft, route D or another" (lines 642-644).
    UC_exclude_the_callgrind_read_back_from_the_manifest_or_checker:
      verdict: REJECTED
      why: >-
        It would change a frozen wrapper or checker, and it would remove a
        machine-protection check right after a reader of it was found. The
        callgrind child runs under the same cap as the primary child
        (v2_driver.py line 209), so its read-back is a legitimate envelope
        observation.
    UD_approve_launchcover_with_a_condition:
      verdict: REJECTED
      why: >-
        launchcover's LP-2 reading makes a (iv) discrepancy a bar and forbids
        an approval with a changed rule (lines 642-644, 664-669). A condition
        adding CC-3 would be exactly that.
    UE_add_one_row_for_the_checker_only:
      verdict: REJECTED
      why: >-
        That is the one-reader-per-act pattern CORR-20260924-e78b7a records.
        Without a census over every access mode and derived value, the next
        act would likely find the next reader (for example the three
        development-harness readers of the derived manifest list, which the
        premise check's key search did not reach).

  transfer_assumptions: >-
    (1)-(5) as launchcover lines 739-744. (6) The consumer census is static.
    A consumer reached only through dynamic dispatch the census's method
    cannot resolve is caught, for the r3 layer, by DV-11's static consumer
    check (CC-5) and by DV-1's dynamic trace, which are its backstop. Nothing
    is assumed about code outside the scanned files.

  budget_impact:
    what_changes: >-
      - Consumer census: zero solver children, zero run packages, Python
        only.
      - r3 successor stage: as launchcover, plus the CC-5 static consumer
        check (no solver). DV-17 unchanged: derived bound 1 is 1334.4 s and
        worst case 648000 s (CC-8 (d)).
      - R2'' and R2b'': the same 31 + 11 packages. CC-4 adds one comparison
        per callgrind child and launches nothing.
    why_it_fits: >-
      ECC budgets are unlimited (CLAUDE.md rule 11). Memory is machine
      protection. The lineage uses 44 of 48 packages.
    if_it_does_not_fit: >-
      An exhausted envelope or checkpoint is an impediment with a recorded
      clears_when. It is never a mathematical result and never a silent drop.

