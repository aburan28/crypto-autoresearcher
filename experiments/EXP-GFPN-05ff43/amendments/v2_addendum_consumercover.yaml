# =============================================================================
# AMD-EXP-GFPN-05ff43-20260924-consumercover  --  DRAFT, NOT APPROVED
#
# The SUCCESSOR REMEDY that DEC-20260924-a7453e orders under LP-2 (iv) (and
# LP-1, strictly read) of the DRAFT AMD-EXP-GFPN-05ff43-20260924-launchcover
# (sha256 c27ffe5c15d13d1c1137bdba11944ac53f0e91c79d8f460a5d2b18066ca5f447,
# archived by TASK-20260924-b2b59a). That draft is NOT approvable as written.
#
# It is an ADDITIVE addendum to EXP-GFPN-05ff43 protocols 2-r2 and 2-a1-r2
# (seedresolve, approved with SC-1..SC-11 by DEC-20260924-15a77a). Most of its
# text is INCORPORATED BY REFERENCE from the launchcover draft at its bound
# sha256, which itself incorporates the healthresolve draft at
# ccb55334...291a70d. Only what changes is written here.
#
# WHY. The archived premise check (TASK-20260924-159c1b, snapshot
# TASK-20260924-0957c2) confirmed LP-2 (i), (ii), (iii), (v), (vi) and (vii),
# but found SIX readers of the callgrind child's record that launchcover's
# LP-2 (iv) said did not exist (CORR-20260924-e78b7a). One of them is a
# GATING reader: the frozen checker's cap check, reached through the
# wrappers' generic key-name collector. This is the third act in a row to
# find one more reader or launcher of a solver-child field
# (CORR-20260924-5b83a1, CORR-20260924-432f43, CORR-20260924-e78b7a). So this
# draft does not add one more row. It closes the CLASS in one pass:
# - its dispositions are stated per DERIVED VALUE, not per call site, so that
#   any reader of a value already disposed of is covered by construction;
# - it gates its own approval on a zero-run CONSUMER CENSUS
#   (TASK-20260924-5dfbfd) that enumerates every consumer of every field of
#   every classified-site child record, by every access mode, generic
#   collectors, walkers, whole-entry comparisons and derived values included,
#   across every tree and every lineage's wrappers and checkers.
#
# WHAT IT IS NOT: approved, evidence, a prediction, a hypothesis status move,
# or a security statement about EcGFp5 or EcMasFp5. It changes no msolve,
# valgrind or callgrind_annotate binary, flag or argv; no REG-1 item or
# exclusion; no frozen wrapper, checker or comparator; no health-check seed,
# pattern, expected D or pass predicate; no DV-17 predicate, R or reference;
# and no byte of any frozen file, draft, preserved r2 output, census or
# premise check. Approval is a later, separate Coordinator decision (reserved
# DEC-20260924-e6638d under reserved TASK-20260924-7a8167). That decision
# reads the ARCHIVED bytes of this file (snapshot TASK-20260924-a28f0e) and of
# the consumer census (snapshot TASK-20260924-ad3f9a).
# =============================================================================
