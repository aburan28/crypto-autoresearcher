      child.rlimit_as_child_getrlimit in every package with a callgrind
      child.
    P-4_the_class: >-
      Three consecutive acts each found one more launcher or reader of a
      solver-child field. A name search over a record's own keys cannot find
      a generic collector, a walker, a whole-entry comparison or a reader of
      a derived value. This draft therefore (a) disposes of DERIVED VALUES as
      classes and (b) requires a census over every access mode before
      approval (CU-2).

