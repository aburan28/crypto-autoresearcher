# AMD-EXP-GFPN-05ff43-20260923-solverevent  --  DRAFT, NOT APPROVED
#
# An ADDITIVE addendum to EXP-GFPN-05ff43 protocols 2-r1 and 2-a1-r1, which are:
# - the frozen specification read with AMD-EXP-GFPN-05ff43-20260923-reanchor-arm-iii
#   (sha256 e02d4976a5e773b9eee95aa4c376d6154e9c0a9da4e6c6118ed58748054924d3,
#   approved with AC-1..AC-6 by DEC-20260923-e788a1);
# - its addendum AMD-EXP-GFPN-05ff43-20260923-rung31 (sha256
#   2c5e052468e37111023dd116706149fb05d691e7188e26ae1e2c069bad792d0c, approved
#   with AA-1..AA-8 by DEC-20260923-8b2dbf);
# - the engineering repair AMD-EXP-GFPN-05ff43-20260923-paristack (sha256
#   856fdc1d7b71da0cd9073634066dcb2a9a66d69cd10adf4ff5a738f2618390c7, approved
#   with RC-1..RC-13 by DEC-20260923-80e280).
# Written under the Coordinator ruling act TASK-20260923-234811
# (DEC-20260923-582d6b), AFTER stage R1 of the repair STOPPED and BEFORE any
# repaired package exists.
#
# WHY. Stage R1 (TASK-20260923-a681f9) stopped under card R1-7 and
# DEC-20260923-80e280 RC-6. Two toy runs of the same toy G1 package at
# p' = 1033 fed msolve 0.6.5 BYTE-IDENTICAL input with identical flags, and
# msolve returned two different results: once an eliminating polynomial whose
# square-free part has degree 63 against a quotient dimension of 64 (classified
# degenerate_parametrisation, D undefined), once degree 64 (D = 64). Fifty
# further solves of the same input all gave 64 (implementation-v2-r1.md
# section 12, lines 624-673). Under protocols 2-r1 / 2-a1-r1 such an event, if
# it recurs, can fail REG-1 and the gate for a reason unrelated to the repair,
# and at a cell it removes a D value under a label ("non_generic_system") that
# names a property of the system rather than of the solver.
#
# WHAT. (1) A pre-declared, uniform, BOUNDED RE-SOLVE RULE for exactly one
# solver-side signature, applied by code to every solve, with every attempt
# preserved and reported; (2) REG-1 and the RC-6 probe restated to compare the
# ACCEPTED attempt, never tolerating a difference in D or any never-excludable
# field; (3) PYTHONHASHSEED="0" for package drivers, as the frozen wrappers
# set it (CORR-20260923-111265); (4) a new layer, plans and ids, because the r1
# plans are not final and the r1 ids are retired. K (the re-solve bound) and
# the REG-1 (d) comparison branch are fixed by PRE-DECLARED formulas applied
# to a zero-run solver characterization archived BEFORE approval.
#
# WHAT IT IS NOT: approved, evidence, a prediction, a hypothesis status move,
# or a security statement about EcGFp5 or EcMasFp5. It changes no msolve
# binary or flag, and no byte of any frozen file. Approval is a later,
# separate Coordinator decision (reserved DEC-20260923-d670c6 under reserved
# TASK-20260923-ad3016) that reads the ARCHIVED bytes of this file (snapshot
# TASK-20260923-4eee3b) and of the characterization (TASK-20260923-683f34).
# =============================================================================
