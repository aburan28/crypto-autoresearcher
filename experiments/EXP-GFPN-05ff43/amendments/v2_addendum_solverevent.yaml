          code. DV-1 is COMPLETE, including the no-computation start-up probe
          of the Sage comparator's PARI stack (implementation-v2-r1.md lines
          458-466). DV-6 includes the refused wrapper read-back of SE-3.
          DV-7 exercises every command both r2 plans invoke (or records why a
          command cannot run at toy scale), the checker on every toy package,
          REG-1 on a perturbed copy (must fail), the RC-8 receipt check, and
          the SE-5 probe.
        - DV-11 (msolve call paths): a static search of implementation-v2/,
          implementation-v2-a1/ and the layer for every msolve launch
          (MSOLVE, msolve_argv, run_child with an msolve argv) and every call
          site of solve, and a dynamic count in the toy lineage showing that
          the number of classified msolve children equals the number of
          attempts the wrapper made. Callgrind and gb_only launches are
          listed separately.
        - DV-12 (the re-solve path, forced): in a scratch toy copy only, a
          development shim (never reachable from a delivered entry) forces
          the classification of attempt 1 of one declared toy target to the
          NSP signature. The wrapper must rename, wait, re-solve and record,
          and the recorded result must equal the unforced run's. A second
          forced case makes all K + 1 attempts NSP and must end
          degenerate_parametrisation with D undefined exactly as frozen. A
          third forces an input-sha mismatch and must end the package failed.
        - DV-13 (hash seed): the driver child's PYTHONHASHSEED reads back "0"
          in every toy package, from the driver process, into the manifest.

    SE-9_stop_conditions_of_the_successor_stage:
      text: >-
        Paristack PS-9 and card-level R1-7 equivalents, plus: DV-11 finds a
        classified msolve launch outside the wrapper; DV-12 fails any case;
        the SE-5 probe finds a difference; DV-13 fails. A stop is an
        impediment for a new Coordinator decision, never evidence. No
        development check is re-run to obtain a pass. A re-run is permitted
        only after a failure with a recorded harness reason, with the failed
        attempt preserved (precedent RD-9, accepted by DEC-20260923-582d6b).

    SE-10_sequencing:
      text: >-
        NORMATIVE. Archives run alone. Solver-running tasks never overlap
        each other or any other solver process.
        RS-0  DONE. Stage R1 stopped (TASK-20260923-a681f9; claim released
              failed). Its outputs were committed for preservation in
              b90d48c0b.
        RS-1  This draft, with DEC-20260923-582d6b, is archived ALONE by
              TASK-20260923-4eee3b, verified and pushed.
        RS-2  The preservation archive TASK-20260923-53a47d binds the
              stopped-stage outputs and the DV-7 raw bundle, alone, verified
              and pushed. The BATCH-e409ca revision of DEC-20260923-582d6b is
              appended.
        RS-3  The zero-run characterization TASK-20260923-6599cf, then its
              snapshot TASK-20260923-683f34, alone.
        RS-4  The approval act (reserved TASK-20260923-ad3016) decides this
              draft on its ARCHIVED bytes as DEC-20260923-d670c6, applies
              CR-1..CR-5 to the ARCHIVED characterization, and fixes K and the
              (d) branch. If approved, it writes the successor stage card
              (reserved TASK-20260923-de3a7d), its two-phase archive, the R2'
              and R2b' run cards and their archive, reshapes BATCH-e409ca by
              appended revision (cancelling TASK-20260923-b53550,
              TASK-20260923-3aa31e, TASK-20260923-292052 and
              TASK-20260923-befe48 as superseded, re-pointing the review
              chain), checkpoints the goal, and is archived.
        RS-5  Successor stage (layer, plans, ids, DV-1..DV-13), zero runs.
        RS-6  Phase A of its archive binds the r2 layer and both r2 plans
              before any repaired run.
        RS-7  R2': G1, then REG-1, then G2, G3, G4; the post-gate packages
              only if the repaired gate passes. Report on any outcome.
        RS-8  Phase B binds the R2' packages and report.
        RS-9  R2b' behind the repaired gate and the controls_a1 image; its
              archive.
        RS-10 The review plan is written FIRST, with its prior, owning the
              joints of DEC-20260923-e788a1, DEC-20260923-034ba0,
              DEC-20260923-8b2dbf AA-7, DEC-20260923-80e280 RC-12, paristack
              RJ-1..RJ-4, and:
              SJ-1 the SE-3 wrapper, SE-2 recording and every
                   solver-events.json;
              SJ-2 the characterization and the derivation of K and of the
                   (d) branch, including the independence assumption;
              SJ-3 SE-6 and CORR-20260923-111265;
              SJ-4 the per-cell solver-event load, and whether any reading
                   rule's output depends on it.

  # ---------------------------------------------------------------------------
  # PRE-DECLARED READINGS OF THE CHARACTERIZATION (fixed now, before it runs)
  # ---------------------------------------------------------------------------
  characterization_readings:
    source: >-
      The archived outputs of TASK-20260923-6599cf (snapshot
      TASK-20260923-683f34): per-solve records and a summary for input
      classes C-1a (the event input, back to back), C-1b (the event input,
      paced at least 1.1 s apart), C-1c (the other 35 toy inputs of the same
      toy package), C-2 (the 36 archived inputs of RUN-GFPN-ac4487, verified
      against the TASK-20260923-0fa03f post-run receipt); diagnostics C-3;
      census C-4. Every solve uses the frozen argv of
      v2_solver.msolve_argv(threads=1) in a capped child via
      v2_solver.run_child, and is classified by the frozen
      parse_msolve_log / parse_msolve_param / rational_solutions /
      classify_solve with n_sub_fail = 0.
    CR-1_other_nondeterminism: >-
      If, for any single input in C-1a, C-1b, C-1c or C-2, two solves that
      both exited ok differ in anything other than the NSP signature -- a
      different printed quotient dimension; two ok-classified outputs with
      different parsed solution sets, eliminating degree or D; or a change of
      outcome class other than to or from the NSP signature -- then SE-2 does
      not cover the observed nondeterminism. This draft is NOT approvable as
      written. The approval act records the finding and orders a successor
      remedy by a new draft (for example a solver-invocation change,
      options_weighed (b)).
    CR-2_the_bound_K: >-
      For each class c in {C-1a, C-1b, C-1c, C-2}: n_c = solves whose child
      exited ok; x_c = those with the NSP signature; u_c = the one-sided 95%
      Clopper-Pearson upper bound, i.e. the p with P(Binomial(n_c, p) <= x_c)
      = 0.05. u_max = max over c of u_c. S_ub = an upper bound on the number
      of v2_driver.solve() calls with gb_only false that all packages of
      trial-plan-v2.json and trial-plan-v2-a1.json can make, derived from
      plan parameters and driver code (targets per cell, arms, fixture draw
      caps, controls) and recorded with its derivation. It is a parameter
      count, not an outcome.
      K = the least k in {2, 3, 4, 5} with S_ub * u_max^(k + 1) <= 0.01.
      If no such k exists, this draft is NOT approvable as written, and the
      approval act orders a successor remedy by a new draft.
    CR-3_the_REG-1_d_branch: >-
      d-parsed if, for any C-2 input, an ok-classified output differs in
      bytes from another ok-classified output of the same input or from the
      archived RUN-GFPN-ac4487 .ms.out, while its parsed comparison (SE-4 (d))
      agrees. Otherwise d-bytes. (A parsed disagreement is CR-1.)
    CR-4_mechanism: >-
      If C-3 establishes the mechanism (for example, the msolve source shows
      where randomness enters and how it is seeded), the approval act records
      it with provenance. It changes K or the (d) branch only through CR-1 to
      CR-3. It may justify a solver-invocation change only in a later, new
      draft, never mid-run.
    CR-5_integrity: >-
      If the characterization fails an integrity check (bundle or input hash
      mismatch, a child cap not settable, a reference file not matching its
      receipt), it is incomplete, and the approval act waits for a completed
      characterization. An incomplete characterization is never read as a
      rate.
    independence_assumption: >-
      CR-2 treats attempts in fresh processes started at least 2 s apart as
      independent draws. This is an ASSUMPTION, reviewed at SJ-2. C-1a and
      C-1b exist so that clustering in time, if present, is visible.
    transfer_to_ladder_primes: >-
      The rate at p' = 262151, 16777291 and 1073741831 cannot be
      characterized before the run without solving ladder systems (outcome
      blindness). CR-2 assumes it does not exceed u_max. SE-2 (7) makes every
      event visible after the fact; SJ-4 reviews it.

  # ---------------------------------------------------------------------------
  options_weighed:
    a_frequency_characterization:
      verdict: ADOPTED, as a zero-run precondition of approval (TASK-20260923-6599cf)
      why: >-
        Cheap, measures nothing about D, and is the only way to fix K and the
        (d) branch by declared formulas instead of by judgement. It also
        tests the rule's premise (CR-1) before any spend.
    b_solver_invocation_change:
      verdict: NOT ADOPTED NOW; the pre-declared successor route under CR-1 or CR-2
      why: >-
        (1) It changes msolve's algorithmic path relative to RUN-GFPN-ac4487
            and every archived v1 and v2 solve, so REG-1 would compare two
            solver paths and lose its reference.
        (2) `-c 0` makes msolve quit on a non-generic staircase that `-c 2`
            currently handles, at an unknown rate: more missing D, not less.
        (3) Whether `-c 1` is deterministic is not established; the quoted
            help text does not say.
        (4) No seed option of msolve 0.6.5 is established.
        (5) The mechanism is not established, so a flag change might remove
            nothing.
        C-3 collects the evidence (b) would need, without adopting it.
    c_bounded_re_solve_rule:
      verdict: ADOPTED (SE-1, SE-2)
      why: >-
        It removes the observed failure mode at its source, keeps the frozen
        solver path and flags, keeps every attempt, and cannot select among D
        values (SE-2 (4)).
    d_redefine_RC-6_and_REG-1:
      verdict: ADOPTED IN NARROW FORM (SE-4, SE-5)
      why: >-
        Both compare the RECORDED attempt with no tolerance on any value. The
        exclusion list gains nothing. Attempts are reported in full.
    rejected:
      - Widening the exclusion list to absorb D or an outcome class. Forbidden by PS-4 (e) and RC-6.
      - Re-running DV-7 until it passes. Outcome-seeking.
      - Proceeding on the r1 plans and accepting a possible REG-1 false failure. It leaves the gate and every cell exposed to an uncharacterized event, and mislabels solver events as non_generic_system.
      - Dropping REG-1. It removes the only before/after check of the layer.

