  # ---------------------------------------------------------------------------
  # THE DEFECTS
  # ---------------------------------------------------------------------------
  defects:
    D-SE-1_solver_outcome_not_reproducible:
      observation: >-
        implementation-v2-r1.md lines 637-653. Toy G1 (`fixture --p 1033`),
        target reg0, arm torsion_S3_norm. All 36 solver inputs were
        byte-identical between the two worlds; this one has sha256
        541b57b904e0c16956f9ea4615a32f1aaaae1cdfe7ca9c3b767f3b5f22d537c8.
        The argv shape was `msolve -v 2 -t 1 -f IN -o OUT -P 1` under the same
        10 GiB cap. World A printed "Degree of the square-free part: 63" and
        "Elimination polynomial is not squarefree", and the driver classified
        the arm degenerate_parametrisation. World B printed "Elimination
        polynomial has degree 64", and D = 64. Fifty further solves of the
        identical input in capped children, under each world's reconstructed
        environment and with no PYTHONHASHSEED, all matched world B.
      code_consequence: >-
        v2_solver.classify_solve (v2_solver.py lines 488-508) returns
        degenerate_parametrisation when the eliminating polynomial is not
        square-free (line 498), when its degree differs from the printed
        quotient dimension (lines 500-502), or when msolve's square-free part
        degree differs from it (lines 503-505). v2_driver.solve then sets
        D = None and D_defined false (lines 205-206). In the fixture, a fresh
        target with such an arm is REPLACED by the next seeded target
        (v2_driver.py lines 382-387), which changes the target set; a
        regression target with such an arm fails F-1 (lines 436-441). In a
        cell, the target is recorded not_measured with class
        "non_generic_system (R-5)" (lines 1184-1188). A D value that IS
        recorded is read from msolve's printed quotient dimension (lines
        199-204), before the parametrisation step, so the event can remove a
        D but cannot alter a recorded one.
      frozen_rule_it_touches: >-
        AMD-EXP-GFPN-05ff43-20260923-reanchor-arm-iii R-5 (lines 888-901):
        degenerate_parametrisation is "not a measured non-decomposition" and
        makes the target's D undefined. That stays true. What changes is only
        WHEN the class is recorded (SE-2).
    D-SE-2_hash_seed_premise:
      observation: >-
        DEC-20260923-80e280 RC-6's last sentence rests on a false premise
        (CORR-20260923-111265): RUN-GFPN-ac4487 ran with PYTHONHASHSEED="0"
        (v2_run_wrapper.py lines 177-178). The r1 wrapper follows the literal
        text and leaves it unset (r1_run_wrapper.py line 35; lines 351-359).

  established_and_not:
    established: >-
      On the stage-R1 host, msolve 0.6.5 at -t 1 with default genericity
      handling returned, on one byte-identical toy input at p' = 1033, a
      non-square-free parametrisation once in 52 recorded solves and a
      square-free one 51 times. The frozen classifier turns the former into
      degenerate_parametrisation with D undefined. RC-6's comparison caught
      it.
    not_established: >-
      - The MECHANISM. The dispatching session quotes `msolve -h`: "-c GEN
        Handling genericity: ... 2 - Change order of variables, then try
        adding a random linear form. (default)". The v2 driver passes no -c
        (v2_solver.py lines 331-334), so 2 applies. A random linear form is a
        plausible source; so is any other time- or state-seeded choice. None
        is established.
      - The RATE. One event in 52 solves of one input is compatible with
        per-solve rates from well under 1/1000 to about 1/10, and the solves
        may not be exchangeable (for example if a seed depends on the clock).
      - Whether the event can occur at p' = 4111, 16777291 or 1073741831, or
        at any other input. RUN-GFPN-ac4487's 36 solves at 4111 were all ok.

  # ---------------------------------------------------------------------------
  # CHANGES
  # ---------------------------------------------------------------------------
  changes:
    SE-1_event_signature:
      name: solver-side non-separating parametrisation (NSP)
      text: >-
        A call of v2_driver.solve with gb_only false has the NSP SIGNATURE iff
        its result has outcome `degenerate_parametrisation` and its reason is
        one of the three strings v2_solver.classify_solve produces at:
        (i)   line 498: "eliminating polynomial is not square-free";
        (ii)  lines 501-502: a reason beginning "eliminating polynomial degree ";
        (iii) line 505: a reason beginning "msolve reports square-free part degree ".
        The substitution-failure reason (line 507) is NOT the NSP signature,
        and neither is any other outcome class. Those keep their frozen
        handling exactly.

    SE-2_bounded_re_solve_rule:
      text: >-
        For EVERY call of v2_driver.solve with gb_only false, in EVERY package
        of both r2 plans, at every prime, arm, cell, target kind and package
        kind, applied by code and never by hand:
        (1) Attempt 1 is the frozen solve(), unchanged.
        (2) If an attempt has the NSP signature and fewer than K + 1 attempts
            have been made, the layer:
            (a) records that attempt: outcome, reason,
                dimension_of_quotient_printed, solution_info, input sha256,
                output sha256, argv, the child's getrlimit read-back, start
                and end UTC with microseconds, and wall seconds;
            (b) renames that attempt's solver/<tag>.ms.out, .ms.log and
                .ms.err by APPENDING ".nsp-attempt<k>" to the full name (so
                that no renamed file matches *.ms or *.ms.out). It keeps the
                bytes under the frozen retention rule (_retain,
                v2_driver.py lines 217-230) and always keeps their sha256;
            (c) waits at least 2 seconds after the attempt ended;
            (d) calls the frozen solve() again with identical arguments.
        (3) The arm's RECORDED result is the LAST attempt's result: either
            the first attempt without the NSP signature (whatever its class:
            ok, timeout, crashed, ...), or the (K + 1)-th attempt with it. In
            the second case the arm is degenerate_parametrisation with D
            undefined, exactly as frozen R-5 records it.
        (4) CONSISTENCY, checked before (3): every attempt's input sha256
            equals attempt 1's, and every attempt that printed a quotient
            dimension printed the same value. On a violation the layer writes
            the attempt records and raises; the package ends failed, read as
            implementation_error, and is never a result.
        (5) RECORDING: a run-root file solver-events.json (one entry per solve
            that had at least one NSP attempt: tag, the attempt records, the
            accepted attempt, the final outcome), rewritten atomically after
            each event, and a manifest block `solver_events` (K, the spacing,
            and counts of NSP attempts, re-solves, and solves still NSP after
            K + 1 attempts). raw-result.json is written by the frozen driver
            from the recorded result only, with no new field.
        (6) NEVER: for any other outcome class; for gb_only solves; for the
            callgrind child (whose output is never classified); by package
            re-run; per target, cell or outcome at anyone's discretion; or
            with any flag, input or cap different from attempt 1.
        (7) REPORTING: each execution report tabulates, per package and per
            cell, the NSP attempts, re-solves and solves still NSP after
            K + 1 attempts, with their tags. This is reported, never tuned,
            and never read as information about D.
      K: >-
        FIXED BY THE APPROVAL ACT from the archived characterization, by
        CR-2's formula, before any repaired run. K is an integer in
        {2, 3, 4, 5}. It is written into both r2 plans' `repair` block.
      why_it_is_not_outcome_seeking: >-
        The rule is declared before any repaired solve, applies to one
        solver signature regardless of the value D would take, is bounded, and
        preserves every attempt. A signature that reproduces K + 1 times keeps
        its frozen class. The quotient dimension is printed before the
        parametrisation step and must agree across attempts (4), so the rule
        cannot select among D values; it can only replace an unreproduced
        missing value with the solver's reproducible one.

    SE-3_implementation_boundary:
      text: >-
        The r2 layer adds exactly ONE function replacement to what
        AMD-EXP-GFPN-05ff43-20260923-paristack PS-2 permits: the module
        attribute v2_driver.solve is replaced, in-process, in both entry
        points, by a wrapper that implements SE-2 and calls the ORIGINAL
        function object. Order: in the v2 entry after `import v2_driver`; in
        the a1 entry after `import a1_driver`; in both before dispatch. Each
        entry reads back, before any command, that `v2_driver.solve` is the
        wrapper and that the wrapper's recorded original is the frozen
        function, and exits with code 2 otherwise (as RC-3 (d)); the read-back
        goes into pari-stack.json under `redirections` and into the manifest.
        v2_common.curve_order_pari is replaced only under P-B, as before. No
        frozen byte is edited. DV-11 must show that every classified msolve
        launch in the toy lineage passed through the wrapper; a classified
        msolve launch outside it is a STOP (SE-9).

    SE-4_REG-1_as_amended:
      replaces: AMD-EXP-GFPN-05ff43-20260923-paristack PS-4 regression_REG-1 items (d) and (e), as far as stated here
      text: >-
        REG-1 still compares G1 with RUN-GFPN-ac4487 after verifying every
        reference file against the TASK-20260923-0fa03f post-run receipt.
        (a) solver/*.ms: same file set, byte-identical. Unchanged.
        (b) raw-result.json fields as PS-4 (b) and the r1 comparator list
            them (implementation-v2-r1.md lines 298-303). These are the
            recorded (accepted) results by construction. Unchanged.
        (c) certificates: unchanged.
        (d) solver/*.ms.out of the recorded attempts (renamed attempt files
            do not match the glob), in ONE of two branches, chosen by the
            approval act from the archived characterization by CR-3 and
            written into both r2 plans' gate.regression before any repaired
            run:
            d-bytes:  byte-identical;
            d-parsed: for each file, equal parse kind, header degree,
                      eliminating-polynomial degree and square-free flag,
                      F_p-rational solution set as v2_solver.rational_solutions
                      returns it (as a set), and D. This is the alternative
                      PS-4 (d) itself already names.
        (e) The exclusion list is the r1 list X1..X17
            (implementation-v2-r1.md lines 328-373), carried verbatim into
            implementation-v2-r2.md, with X16 and X17 still open as review
            items. NOTHING is added to it. solver-events.json and the
            *.nsp-attempt<k> files are outside the compared file sets by the
            globs of (a), (c) and (d); they are not exclusions. The REG-1
            output lists each of them with its sha256, and quotes
            solver-events.json in full. REG-1 FAILS if solver-events.json is
            missing or does not parse, or if any SE-2 (4) consistency record
            shows a violation.
        The never-excludable list is unchanged (k, x_R, relation, beta, lam,
        u_values, relation_mod_T, D, solutions, verified, lifted_points). No
        tolerance is introduced on any value.

    SE-5_RC-6_probe_as_amended:
      replaces: DEC-20260923-80e280 RC-6, first part, for the successor stage
      text: >-
        The successor stage's DV-7 runs the toy G1 package twice, in separate
        processes, through the r2 wrapper and entry, both under SE-2 with the
        approved K:
        - world A with PYTHONHASHSEED "0", the package condition (SE-6);
        - world B with PYTHONHASHSEED "12345", set by a development-only
          override that no delivered code path can reach.
        If any field REG-1 compares (under the approved (d) branch) differs
        between the two worlds' RECORDED results, the stage STOPS and returns
        for a new Coordinator decision. NSP attempts and re-solves are
        recorded per world and are NOT by themselves a stop. The exclusion
        list may never absorb a difference in a never-excludable field. The
        probe is run ONCE; it is never repeated to obtain a pass.

    SE-6_PYTHONHASHSEED:
      replaces: DEC-20260923-80e280 RC-6, last sentence (read through CORR-20260923-111265)
      text: >-
        The r2 wrapper sets PYTHONHASHSEED="0" in the driver child's
        environment for every package of both r2 plans, exactly as
        v2_run_wrapper.py lines 177-178 and a1_run_wrapper.py line 299 do,
        and records the value in the manifest. DV-13 reads it back from the
        driver process. Reason: REG-1 compares G1 with a reference that ran
        under "0"; RC-6's own stated purpose is that G1 inherit the reference's
        condition.

