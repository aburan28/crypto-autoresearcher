  # ---------------------------------------------------------------------------
  # WHAT THE r2 STOP ESTABLISHES, AND WHAT IT DOES NOT
  # ---------------------------------------------------------------------------
  findings_carried:
    F-1_the_launch_outside_solve: >-
      a1_health.run_system (a1_health.py lines 140-220) writes the .ms from
      (NAMES, p, eqs) (line 143), builds the v2 cell argv
      v2_solver.msolve_argv(threads=1) (line 144), launches it in a capped
      child through v2_solver.run_child with timeout DEV_TIMEOUT_S = 1800
      (lines 53, 147), builds the log text as .ms.log + "\n" + .ms.err + "\n"
      (lines 157-162), parses, substitutes into the same eqs (lines 167-172)
      and classifies with v2_solver.classify_solve (line 182). The result's
      v2_outcome_class and v2_outcome_reason (lines 185-186) are that
      classification. Its pass predicate (lines 188-199) needs, among other
      things, a square-free eliminating polynomial of the expected degree,
      which is exactly what an SSF attempt lacks.
    F-2_how_the_plans_reach_it: >-
      a1_driver.py imports a1_health as H (line 38) and cmd_controls_a1 calls
      H.run(p, <run dir>/health, cap=ctx.cap) as check (d) (lines 129-133).
      H.run calls run_system through the module's global name, for the first
      draw of each pattern, for a seed-':2' re-draw on a failed first draw,
      and for reinvocations only when reinvoke_on_fail is true (lines
      232-245); controls-a1 passes no reinvoke_on_fail. controls-a1 --p
      1073741831 is package order 1 of trial-plan-v2-a1-r2.json, the
      addendum's blocking package (lines 681-698).
    F-3_what_the_r2_layer_showed: >-
      The r2 SE-3 wrapper (r2_resolve.py, preserved) re-solved exactly on the
      SSF signature in the forced cases DV-12 (a)-(g), and three natural SSF
      events at p' = 1033 re-solved to ok (implementation-v2-r2.md lines
      669-698). Development observations only; not a pass of any delivered r3
      code.
    not_established: >-
      - Whether a1_health.run_system is the ONLY classified msolve launch
        outside solve() reachable from the successor plans. The census
        TASK-20260924-1039eb establishes it (CN-1).
      - The SSF rate on the synthetic dense health systems at p' =
        1073741831. Nothing is assumed (transfer_assumptions (3)). The
        stage-1b development run of the same check at that prime passed both
        systems on the first draw (implementation-v2-a1.md lines 334-350);
        that is one development observation.

