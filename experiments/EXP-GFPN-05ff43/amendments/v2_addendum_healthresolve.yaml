  changes:
    HR-1_scope:
      extends: solverevent SE-2 (as incorporated), with seedresolve SF-1, SF-2, SF-3 and DEC-20260924-15a77a SC-11
      text: >-
        The bounded re-solve rule applies, unchanged in every parameter
        (K = 5, at most 6 attempts, 2 s spacing, the SF-2 (c) cap, the SE-2
        (4) and SF-2 (b) consistency checks, SE-2 (6) never-clauses), to EVERY
        call of a1_health.run_system made while any command of either r3 plan
        runs, in addition to every gb_only-false call of v2_driver.solve. No
        other function, site or process is added.
    HR-2_signature_at_the_health_site:
      amends: seedresolve SF-1 (applied to a second site; the clause list is unchanged)
      text: >-
        A run_system result has the SSF signature iff:
        (i)-(iv) its v2_outcome_class is degenerate_parametrisation and its
        v2_outcome_reason matches SF-1 clause (i), (ii), (iii) or (iv)
        exactly as SF-1 words them; or
        (v) its v2_outcome_class is positive_dimensional and its log text
        contains the exact string "[coefficients of linear form are randomly
        chosen]", the log text being <tag>.ms.log + "\n" + <tag>.ms.err + "\n"
        read exactly as a1_health.py lines 157-162 build it, after the frozen
        run_system returns.
        Every other result (ok; a child outcome other than ok; any failed
        check without an SSF clause) keeps its frozen handling exactly.
    HR-3_implementation_boundary:
      amends: solverevent SE-3 (as incorporated); DEC-20260924-15a77a card constraint ST-1 for the r3 stage
      text: >-
        The r3 layer adds exactly ONE further in-process function replacement
        to what SE-3 permits: the module attribute a1_health.run_system is
        replaced, in the a1 entry only, AFTER `import a1_driver` (which
        imports a1_health at a1_driver.py line 38) and before dispatch, by a
        wrapper that implements HR-4..HR-7 and calls the ORIGINAL function
        object with identical arguments. The complete set of permitted
        replacements is: v2_driver.solve (SE-3, both entries),
        a1_health.run_system (this clause, a1 entry), and
        v2_common.curve_order_pari under paristack P-B only.
        READ-BACK: before any command, the a1 entry checks that
        a1_health.run_system is the HR-3 wrapper, that the wrapper's recorded
        original is the frozen function (module a1_health, qualname
        run_system, code file implementation-v2-a1/a1_health.py, first line
        140, the object captured at install), and that a1_driver.H is the
        a1_health module object; the v2 entry checks that no module named
        a1_health is imported. Otherwise it exits 2 before any command
        (as RC-3 (d)). The read-back goes into pari-stack.json under
        `redirections` and into the manifest. No frozen byte is edited.
    HR-4_attempts_at_the_health_site:
      text: >-
        Attempt 1 is the frozen run_system, unchanged. On an attempt k with
        the SSF signature, while k < K + 1 = 6 and the HR-6 cap allows, the
        layer:
        (a) records the attempt: tag, p, pattern, v2_outcome_class,
            v2_outcome_reason, dimension_of_quotient_printed, solution_info,
            input sha256 (result input.sha256), output sha256 of <tag>.ms.out
            if it exists, the command (result command), the child's getrlimit
            read-back (result child.rlimit_as_child_getrlimit), the result's
            checks and pass, start and end UTC with microseconds, wall
            seconds, the clause, and whether the random-form string was in the
            log;
        (b) renames <tag>.ms.out, <tag>.ms.log and <tag>.ms.err in the
            run_system output directory by APPENDING ".ssf-attempt<k>" to the
            full name (SC-11 (a)), recording each renamed file's sha256 and
            size;
        (c) waits until at least 2.0 s after the attempt's recorded end
            (SC-11 (d));
        (d) calls the frozen run_system again with identical arguments.
        The RECORDED result is the last attempt's result object, returned
        UNMODIFIED to the frozen caller (a1_health.run), which writes
        health-<p>.json from recorded results only; the layer adds no field to
        it.
    HR-5_consistency_at_the_health_site:
      text: >-
        As SE-2 (4) with SF-2 (b), checked after every attempt: every
        attempt's input sha256 equals attempt 1's; every printed quotient
        dimension is the same; every attempt k >= 2 started at least 2.0 s
        after attempt k - 1's recorded end. On a violation the layer writes
        the attempt records and raises; the package ends failed, read as
        implementation_error, never as a result.
    HR-6_cap_at_the_health_site:
      text: >-
        SF-2 (c) with SC-11 (c) and (e): attempt 2 always starts on an SSF
        attempt 1; attempt k + 1 (k >= 2) starts only if the summed wall
        seconds of attempts 2..k are below the timeout the frozen run_system
        passes to run_child, read at call time as a1_health.DEV_TIMEOUT_S
        (1800 s; a1_health.py lines 53, 147). Otherwise the recorded result
        is attempt k's, and the event records resolve_cap_reached with the
        sums.
    HR-7_frozen_re_draw_and_reinvocation_unchanged:
      text: >-
        The frozen A1-7 (b) re-draw from seed + ':2' and the AA-3 (b)
        reinvocation (a1_health.py lines 236-245) are unchanged. They act on
        the RECORDED result of each wrapped call, and each of their calls of
        run_system is itself wrapped. Disclosed consequence, stated before any
        run: an SSF first draw is re-solved on the SAME system before the
        frozen code sees it, so the seed-':2' re-draw happens only when the
        recorded result still fails (a non-SSF failure, SSF after K + 1
        attempts, or a cap). The pass predicate (lines 188-199), the seeds,
        patterns, expected D values (8 and 64), flags and the check's
        solver-side signal classification (lines 200-218) are unchanged.
    HR-8_recording:
      amends: solverevent SE-2 (5) and SC-11 (b)
      text: >-
        The run-root solver-events.json carries every event of both sites,
        each event naming its site ("v2_driver.solve" or
        "a1_health.run_system"), with counters per site. The manifest block
        `solver_events` gives the SC-11 (b) counts per site. The execution
        report tabulates health-site events separately (SE-2 (7) and SF-2 (e),
        extended).
    HR-9_development_checks_and_stops:
