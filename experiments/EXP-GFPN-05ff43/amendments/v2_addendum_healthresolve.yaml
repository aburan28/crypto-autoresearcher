  # ---------------------------------------------------------------------------
  # PRE-DECLARED READINGS OF THE CENSUS (fixed now, before it runs)
  # ---------------------------------------------------------------------------
  pre_approval_readings:
    source: >-
      The archived outputs of TASK-20260924-1039eb (snapshot
      TASK-20260924-c65bfb): census.md, census.json and census_scan.py. The
      census launches no solver, gp, Sage or valgrind child and creates no run
      package. It reads source code and archived bytes.
    definitions: >-
      - A MSOLVE LAUNCH SITE is a call that starts a child process whose argv
        contains the msolve binary (v2_solver.MSOLVE, the literal
        /usr/bin/msolve, or an argv built by v2_solver.msolve_argv), directly
        or under another program (valgrind).
      - A launch is CLASSIFIED if its output or log enters
        v2_solver.classify_solve, any pass / fail check, a gate, an outcome
        class, or any recorded result field other than a cost measurement
        (wall, cpu or instruction counts).
      - A site is REACHABLE if the static call graph, followed through module
        attributes (for example H.run, D.solve, V.run_child, C.curve_order_pari),
        leads to it from the dispatch function of any command that
        trial-plan-v2-r2.json or trial-plan-v2-a1-r2.json invokes (their
        driver_args; the commands are those of the frozen plans), under the
        r2 entries' import order.
    CN-5_integrity: >-
      APPLIED FIRST. The census is INCOMPLETE if any of these fails:
      - this draft's bytes equal the addendum_sha256 in TASK-20260924-bc10a8's
        receipt;
      - the seedresolve draft hashes to dc714a44...ee81 and the solverevent
        draft to 011d4b2c...9b7f;
      - every implementation-v2/ file read equals the TASK-20260923-0fa03f
        phase-A receipt; every implementation-v2-a1/ file read equals the
        TASK-20260923-4ff597 receipt; every implementation-v2-r1/ file read
        equals the TASK-20260923-53a47d receipt; every implementation-v2-r2/
        file, both r2 plans, the r2 note and the stage-r2 bundle equal the
        TASK-20260924-5ca2a5 receipt;
      - the census launched any solver, gp, Sage or valgrind child.
      An incomplete census is never read. The approval act waits for a
      completed one.
    CN-1_msolve_launch_completeness: >-
      The census lists every msolve launch site in implementation/,
      implementation-v2/, implementation-v2-a1/, implementation-v2-r1/,
      implementation-v2-r2/ and every file those trees execute or import from
      outside them, each with file, line, enclosing function, whether it is
      classified, whether it is reachable, and from which commands.
      READING: this draft is approvable as written ONLY IF the reachable
      classified msolve launch sites are exactly two, the launch inside
      v2_driver.solve (v2_driver.py lines 165-166) and the launch inside
      a1_health.run_system (a1_health.py line 147), and every other reachable
      msolve launch is unclassified (the callgrind child, v2_driver.py line
      209 and v2_solver.py line 517, is expected). If any other reachable
      classified site exists, this draft is NOT approvable as written, and
      the approval act orders a successor draft that covers every site. An
      unreachable site is listed and is not a bar.
    CN-2_health_path_facts: >-
      The census confirms each of these with file and line, or names the
      discrepancy:
      (i)    run_system builds the log text as .ms.log + "\n" + .ms.err +
             "\n" (a1_health.py lines 157-162), as v2_driver.py lines 170-175
             do, and classifies with v2_solver.classify_solve (line 182) only
             when the child outcome is ok (lines 167-184);
      (ii)   the classify_solve reason strings SF-1 matches (v2_solver.py
             lines 497-508) are the ones run_system's result carries (lines
             182, 185-186);
      (iii)  every call of run_system in a1_health.run (lines 234, 237, 241,
             244) resolves the name through a1_health's module globals at
             call time, so replacing the attribute a1_health.run_system
             in-process reaches every call; and no module other than
             a1_health calls run_system;
      (iv)   every caller of a1_health.run and a1_health.run_system in the
             scanned trees, and which successor-plan commands reach each (at
             least a1_driver.py line 129, with reinvoke_on_fail false);
      (v)    the timeout run_system passes to run_child is DEV_TIMEOUT_S
             (lines 53, 147), 1800 s, read at call time;
      (vi)   the substitution premise at this site: run_system writes the
             .ms from (NAMES, p, eqs) with v2_arms.write_msolve_input (line
             143) and substitutes into the same eqs (line 172); dense_system
             draws every coefficient in [1, p - 1] (line 59); and, for the
             four systems a1_health.draw produces at p' = 1073741831 (both
             patterns, seeds a1_common.HEALTH_SEED and HEALTH_SEED + ":2"),
             generated in Python and written to the scratchpad with no
             solver, write_msolve_input(tmp, *_parse_ms_file(f)) reproduces f
             byte for byte (the PR-1 (a) round trip, v2_driver.py lines
             582-608 read through CORR-20260924-36ce25);
      (vii)  how the frozen code records a run_system result that fails its
             pass predicate (lines 188-199), and the pattern_pass and re-draw
             logic (lines 235-247);
      (viii) the maximum number of classified msolve launches one controls-a1
             command can make, confirming CORR-20260924-5b83a1 item 2 (6) or
             naming the discrepancy;
      (ix)   every watchdog or timeout that spans more than one run_system
             call in the controls-a1 package, so that HR-6's extra wall time
             is disclosed against it.
      READING: a discrepancy in (i), (ii), (iii) or (vi) makes this draft NOT
      approvable as written, because HR-2..HR-4 rest on them; the approval
      act orders a successor draft (options_weighed B or C). A discrepancy in
      (iv), (v), (vii), (viii) or (ix) is ruled on by the approval act, and a
      condition may fix it.
    CN-3_PARI_inventory: >-
      The census lists every in-process PARI entry (cypari2) and every child
      that runs PARI (gp, Sage) reachable from the successor plans' commands,
      each with file, line, process, the stack configuration it runs under
      (in-process: the PS-1 P-A values; gp: the values its script sets,
      a1_pari.py; Sage: the start-up probe values the stage-r2 bundle records
      under dv1/), and every (p', field degree) at which the plans reach it.
      READING: informational. An in-process PARI entry reached at a (p',
      degree) that DV-2's three points do not cover is recorded, and the
      approval act adds it to DV-2 by condition. It is not a bar.
    CN-4_other_child_launches: >-
      The census lists every other child launch reachable from the successor
      plans' commands (builder children, gp, Sage, valgrind,
      callgrind_annotate, git and host scans in the wrappers), with whether
      its output is classified and whether it can depend on a clock, a seed or
      the environment, read from the code. READING: informational. The
      approval act rules on each. None is in this draft's scope.
    what_the_readings_cannot_do: >-
      Change K, the SF-1 clause list, the cap, the d-parsed branch or HR-1..HR-8.
      A failed reading makes this draft not approvable as written. It never
      licenses an approval with a changed rule, which would need a new draft.

  # ---------------------------------------------------------------------------
  options_weighed:
    A_extend_the_rule_by_one_replacement:
      verdict: ADOPTED (HR-1..HR-9)
      why: >-
        - The same signature, K, spacing, cap, consistency and recording at
          both classified sites: no recorded classification anywhere in the
          lineage depends on the clock second of an FGLM seed, which is the
          purpose the approved rule states.
        - It reuses the frozen classifier's own output (v2_outcome_class and
          v2_outcome_reason), so no new classification is written.
        - It keeps every frozen byte, the argv, the seeds and the pass
          predicate, and leaves the frozen re-draw rule in place for every
          non-SSF failure.
        - The replacement is at the same granularity as SE-3 (one module
          attribute, read back before any command), and a1_health.run looks
          the name up at call time (CN-2 (iii) confirms it).
    B_declare_the_health_site_out_of_scope:
      verdict: NOT ADOPTED; the declared fallback if CN-2 (iii) fails
      why: >-
        Amend SE-3's DV-11 to list a1_health.run_system beside callgrind and
        gb_only as an exempt site, relying on the frozen A1-7 (b) re-draw.
        - It would treat one solver signature two ways in one lineage.
        - The re-draw changes the system rather than re-solving it, so the
          recorded health result of the first draw would still depend on the
          seed second.
        - A false failure of check (d) blocks every addendum package; the
          exposure sits on the addendum's blocking gate.
        - It rewrites the DV-11 criterion immediately after DV-11 failed.
          Permitted by amendment, but the weaker choice when a faithful
          extension exists.
    C_replace_v2_solver_run_child:
      verdict: REJECTED
      why: >-
        run_child launches every capped child (msolve, valgrind, gp, Sage,
        builders). A re-solve there runs before any classification and would
        also wrap gb_only, callgrind and non-solver children, all of which
        SE-2 (6) excludes.
    D_edit_a1_health_py:
      verdict: REJECTED
      why: A frozen byte, bound by the TASK-20260923-4ff597 phase-A receipt. Forbidden.
    E_drop_or_skip_check_d:
      verdict: REJECTED
      why: >-
        Check (d) is part of the approved controls_a1 definition (A1-2 (d);
        DEC-20260923-8b2dbf). Removing it changes a blocking control after a
        stop.
    F_run_unchanged_and_accept_the_exposure:
      verdict: REJECTED
      why: >-
        DV-11 would stop the stage again, and the addendum's gate would depend
        on the clock second.
    rejected_also:
      - Re-running DV-11 in a stage whose card forbids the replacement. It would stop again.
      - Choosing K or the cap from any observed health outcome. None exists, and none may be used.

  transfer_assumptions: >-
    (1) As seedresolve (1): the quotient dimension does not depend on the
        seed; SE-2 (4) checks it at both sites.
    (2) As seedresolve (2): failure events at distinct seeds are not
        systematically correlated (SJ-2). K is not derived from it.
    (3) Nothing is assumed about the SSF rate on the synthetic dense health
        systems at p' = 1073741831, or at any ladder prime. Every event is
        reported per site (HR-8).
    (4) The evidence is at toy scale only. Nothing transfers to
        p = 2^64 - 2^32 + 1 except under HEUR-GFPN-DFLAT as frozen.

  budget_impact:
    what_changes: >-
      - Census: zero solver children, zero run packages, Python only.
      - r3 successor stage: as the r2 stage, plus DV-16 and the amended DV-11.
        Zero run packages.
      - R2'' and R2b'': the same 31 + 11 packages. Extra health-site solves
        happen only on the SSF signature, at most K = 5 per wrapped call and
        at most 4 wrapped calls per controls-a1 command, each call's extra
        wall time below 2 x 1800 s (HR-6).
    why_it_fits: >-
      ECC budgets are unlimited (CLAUDE.md rule 11). Memory is machine
      protection (AC-1); every attempt has the same 10 GiB child cap. The
      lineage uses 44 of 48 packages.
    if_it_does_not_fit: >-
      An exhausted envelope or checkpoint is an impediment with a recorded
      clears_when, never a mathematical result and never a silent drop.

  proof_search_map_applicability: >-
    NOT REQUIRED for this kind (agents/coordinator.md "Proof-oriented dispatch
    gate"): a change to execution only, with no mechanism, observable,
    quantifier order, method ceiling or nearby object changed. The
    identifiability observation of DEC-20260924-15a77a (audit 2, the
    collision paths C-1..C-3 of rational_solutions) applies at the health
    site too; there the frozen pass predicate also requires the
    parametrisation to substitute modulo the eliminating polynomial
    (a1_health.py lines 72-115, 178-179), which covers every solution over
    the closure. SC-3 and SC-4 cover both sites (HR-13).

