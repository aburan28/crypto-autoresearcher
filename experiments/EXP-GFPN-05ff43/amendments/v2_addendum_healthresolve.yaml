# =============================================================================
# AMD-EXP-GFPN-05ff43-20260924-healthresolve  --  DRAFT, NOT APPROVED
#
# The REMEDY that DEC-20260924-bea197 orders for the STOP of the successor
# stage r2 (TASK-20260923-de3a7d, DV-11; implementation-v2-r2.md sections 1
# and 12).
#
# It is an ADDITIVE addendum to EXP-GFPN-05ff43 protocols 2-r2 and 2-a1-r2,
# which are:
# - protocol 2-r1 / 2-a1-r1 (the frozen specification read with
#   AMD-EXP-GFPN-05ff43-20260923-reanchor-arm-iii, sha256 e02d4976...24d3,
#   DEC-20260923-e788a1; AMD-EXP-GFPN-05ff43-20260923-rung31, sha256
#   2c5e0524...2d0c, DEC-20260923-8b2dbf; AMD-EXP-GFPN-05ff43-20260923-paristack,
#   sha256 856fdc1d...90c7, DEC-20260923-80e280);
# - read with AMD-EXP-GFPN-05ff43-20260924-seedresolve (sha256 dc714a44...ee81,
#   approved with SC-1..SC-11 by DEC-20260924-15a77a), which incorporates the
#   never-approved solverevent text (sha256 011d4b2c...9b7f) by reference;
# - read through CORR-20260924-36ce25 and CORR-20260924-5b83a1.
# Only what changes is written here.
#
# WHY. The approved re-solve rule (solverevent SE-2 with seedresolve SF-1..SF-3)
# reaches every call of v2_driver.solve. The frozen v2-a1 health check
# implementation-v2-a1/a1_health.py run_system launches msolve (line 147) and
# classifies its output with the same frozen classifier (line 182) OUTSIDE
# solve(). controls-a1 reaches it (a1_driver.py line 129), and its pass gates
# every other addendum package. Card ST-1 forbade the replacement that would
# reach it, so the stage stopped at DV-11 (CORR-20260924-5b83a1 item 1).
# This draft extends the SAME rule, unchanged, to that one launch site by ONE
# further in-process function replacement, and gates its own approval on a
# zero-run census of every msolve, PARI and gp launch path.
#
# WHAT IT IS NOT: approved, evidence, a prediction, a hypothesis status move,
# or a security statement about EcGFp5 or EcMasFp5. It changes no msolve
# binary, flag or argv, no health-check seed, pattern, expected degree or pass
# predicate, and no byte of any frozen file, draft, preserved r2 output or
# census. Approval is a later, separate Coordinator decision (reserved
# DEC-20260924-afdc3b under reserved TASK-20260924-71ccd9). That decision
# reads the ARCHIVED bytes of this file (snapshot TASK-20260924-bc10a8) and of
# the zero-run census TASK-20260924-1039eb (snapshot TASK-20260924-c65bfb).
# =============================================================================
