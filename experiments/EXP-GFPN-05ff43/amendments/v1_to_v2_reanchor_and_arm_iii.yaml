    DC-3_K5_replace_arm_iii:
      defect: >-
        Arm (iii) as built is the norm Q = A^2 - w^2 B^2 of the G2-invariant
        summation polynomial. It is invariant under (Z/2)^m x| S_m. It has
        arm (ii)'s support (20349 = 20349 at m = 5), and in the square
        analogues arm (ii)'s degree (64 = 64; 4096 = 4096). It cannot show
        the predicted drop (CORR-20260923-064d0d lines 47-83; red team K5,
        review-report.yaml lines 41-189). FHJRV's polynomial-ring form (Prop.
        8(i) / Prop. 13) needs b to be a square in F_q (hal-00935050.txt
        lines 480-490 and 668-669), or full 2-torsion (Remark 9, lines
        534-541). EcGFp5-shaped double-odd curves have neither: "may be
        double-odd ... only if neither b nor a^2 - 4b is a quadratic residue"
        (Pornin lines 871-875).
      construction_torsion_S5_rq:
        provenance: >-
          THIS CONSTRUCTION IS THE RED TEAM'S DERIVATION, NOT FHJRV'S PROP. 13
          FORM. It is derived at
          coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-404bf9/review-report.yaml
          lines 100-109 and specified at lines 752-765. It is recorded in
          CORR-20260923-064d0d lines 74-79 and KN-OPEN-9b4a2b lines 35-39.
          FHJRV's Prop. 13 ring K[s_1..s_{n-1}, e_n]
          (hal-00935050.txt lines 668-669) needs an affine involution f_T
          (Prop. 7, lines 452-454). That involution exists only when b is a
          square (Prop. 8(i), lines 480-490). The construction below is an
          invariant-FIELD construction on a rescaled base. The red team calls
          it analogous to FHJRV's Q_{phi,n} (Prop. 12, lines 600-611). That
          analogy is the red team's characterisation, and nothing below
          relies on it.
        which_translations_act: >-
          Only translation by T = (0,0) acts on x-values. The source is
          research/THM_QUOTIENT_DESCENT1.md, Lemma (lines 20-23) with its proof
          (lines 25-34): tau_T descends through the degree-2 quotient by
          iota_S if and only if 2T = O. Here S = O, so iota_O = [-1], and the
          quotient is x, or x/lam, which has the same fibres.
          CHECKED BY THIS ACT, AND ONLY THIS FAR:
          - The group-law computation at lines 31-34 is re-derived here:
            -(P+S) + T = -(P+T+S) iff T = -T iff 2T = O.
          - The "permutes fibres iff commutes with iota_S" step (lines 27-29)
            holds for generic P, because iota_S P != P there.
          NOT RELIED ON:
          - the Corollary (lines 36-51), beyond its rank-1 row;
          - research/THM_QUOTIENT_DESCENT1.lean, whose statement is an
            `axiom` (line 10) and carries no proof.
          On a double-odd curve E(F_q)[2] = {O, T}, because a^2 - 4b is a
          non-square (Pornin lines 871-875). So the acting group is
          (Z/2)^{m-1} x| S_m: even flips plus permutations (FHJRV G2,
          hal-00935050.txt lines 432-440). Translation acts by x -> b/x
          (FHJRV lines 502-503; implementation.md line 26), which on u = x/lam
          is u -> beta/u.
        definition:
          field_and_curve: >-
            F_q = F_{p'}[z]/(z^n - c) with n odd. The curve is
            y^2 = x(x^2 + a x + b) with T = (0,0) rational, and b is a
            non-square in F_q (EcGFp5-shaped; ladder.json records
            b_is_square_in_Fq false).
          rescaling: >-
            Fix beta in F_{p'}^* a non-square, recorded; the smallest one is
            the default. Because [F_q : F_{p'}] = n is odd, an element of
            F_{p'} is a square in F_q iff it is a square in F_{p'}, so beta is
            a non-square in F_q, b/beta is a square in F_q, and
            lam := sqrt(b/beta) in F_q exists. Record which root is chosen.
            (beta, lam) is fixed per (curve, p') BEFORE any target is drawn,
            and never depends on R.
          factor_base: >-
            {P in E(F_q) : x(P)/lam in F_{p'}}. It is T-stable. With
            u = x(P)/lam:
            x(P+T) = b/x(P) = lam^2 beta / (lam u) = lam (beta/u),
            so x(P+T)/lam = beta/u, which is in F_{p'}. This is FHJRV's
            section 3.2 condition (lines 330-335).
          unknowns: >-
            u_i := x(P_i)/lam in F_{p'} for i = 1..m, and t'_i := u_i + beta/u_i.
            The unknowns are sigma_k := e_k(t'_1..t'_m) for k = 1..m, and
            w := prod_i (u_i - beta/u_i).
          relation_polynomial: >-
            Take S_{m+1}(lam u_1, ..., lam u_m, x_R), of degree K = 2^{m-1} in
            each u_i. Normalise it by prod_i u_i^{K/2} into a Laurent
            polynomial that is invariant under even flips u_i -> beta/u_i and
            under S_m. That makes it an element of F_q[sigma] + w F_q[sigma],
            written A(sigma) + w B(sigma). Obtain A and B by exact
            interpolation with held-out verification, the same machinery as
            implementation.md lines 80-87.
            Degree bounds at m = 5 (K = 16):
            - A has sigma-degree <= 8, at most C(13,5) = 1287 monomials;
            - B has sigma-degree <= 7, at most C(12,5) = 792 monomials.
            At n = m = 3 the red team measured sigma-degree 2 for A, 1 for B,
            and 14 monomials in total (square_analogue_n3.json lines 43-50).
          equations_over_F_p: >-
            The n z-components of A(sigma) + w B(sigma) = 0, plus the relation
            w^2 - prod_i (t'_i^2 - 4 beta) = 0, written as a polynomial in
            sigma over F_{p'}. That is n + 1 equations in m + 1 unknowns, so
            the system is square at n = m. The identity used is
            (u - beta/u)^2 = (u + beta/u)^2 - 4 beta.
          lifting: >-
            For each F_{p'}-rational solution (sigma, w):
            1. Roots of X^m - sigma_1 X^{m-1} + ... + (-1)^m sigma_m give the
               t'_i. They must all lie in F_{p'}; otherwise reject, reason
               recorded.
            2. Each t'_i gives u_i from u^2 - t'_i u + beta = 0. Both roots
               must lie in F_{p'}; otherwise reject.
            3. Choose flips u_i <-> beta/u_i so that prod (u_i - beta/u_i) = w.
               The choice is unique up to G2. If no choice matches, reject
               with reason `w_sign_inconsistent`.
            4. Set x_i = lam u_i and lift to points; y must exist in F_q.
            5. Search signs eps_i for sum eps_i P_i in {R, R + T}.
            A relation equal to R + T is accepted with the flag
            `relation_mod_T`. It is a valid relation after doubling into the
            odd-order subgroup (FHJRV lines 338-341, "[m]R = [m]Q_1 + ...").
          certificate: >-
            The frozen decomposition certificate
            (specification lines 51-59; implementation.md lines 115-127). It
            ADDS beta, lam, the per-point check x(P_i)/lam in F_{p'}, and the
            relation_mod_T flag. The independent verifier checks every added
            field. A certificate that lacks them fails.
          m4_fallback: >-
            At n = 5, m = 4 the same construction applies with K = 8. The
            system is 6 equations in 5 unknowns, so it is overdetermined: a
            random target is decomposable with probability about
            1/(2^3 4! p'), and D is undefined on a non-decomposable one. It is
            the frozen stopping rule 3 fallback for arm (iii'), and it
            measures decomposition-test cost only (implementation.md lines
            251-255).
      arm_set_under_v2:
        - id: raw
          label: (i) raw descended S_{m+1}
          role: frozen arm; m = 5 recorded not_attempted by design (see DC-7 A-6)
        - id: S5
          label: (ii) S_5 elementary-symmetric on the x-base
          role: frozen arm
        - id: S5_rescaled
          label: (ii') S_5 elementary-symmetric on the rescaled base
          role: ADDED like-for-like reference for arm (iii') (T-2); same targets, same base
        - id: torsion_S5_rq
          label: (iii') F_p-rational (Z/2)^4 x| S_5 quotient on the rescaled base, order 1920
          role: REALISES frozen arm (iii) as labelled at specification line 117
        - id: torsion_S5_norm
          label: (iii-v1) norm of the G2-invariant polynomial, (Z/2)^5 x| S_5, order 3840
          role: LABELLED NEGATIVE CONTROL; never reported with group order 1920
      proof_search_map:
        bottleneck: >-
          Whether the F_p-rational (Z/2)^{m-1} x| S_m quotient lowers the
          square n = m = 5 system's ideal degree by 2^{m-1} relative to the S_5
          system on the same base, and whether that system completes within a
          stated envelope (KN-OPEN-9b4a2b).
        baseline_embedding:
          parameter_slice: >-
            THE n = m = 3 SQUARE ANALOGUE, A BLOCKING FIXTURE. It is built and
            solved by the rerun's own committed implementation, not by the red
            team's script. Setting:
            - field F_{p'}[z]/(z^3 - 2) at p' = 4111 and p' = 16777291;
            - the red team's curves: y^2 = x(x^2 + 2x + 7z) at 4111 and
              y^2 = x(x^2 + 2x + z) at 16777291, with b and a^2 - 4b both
              non-squares;
            - beta = 3 and beta = 2 respectively.
            (square_analogue_n3.json lines 14-18, 85, 98-102, 169.)
            Targets: the red team's four x_R values (lines 22, 54, 106, 138),
            as an exact regression, plus two fresh seeded random targets per
            prime.
          reproduction_check:
            F-1_expected_degrees_all_targets: >-
              Every target must give exactly the following D:
              - raw_x 384 (= 3! 4^3);
              - raw_u 384;
              - S3 on the x-base 64;
              - S3_rescaled 64;
              - torsion_S3_norm 64, with support identical to S3's
                35 monomials and total degree 4;
              - torsion_S3_rq 16, with A of sigma-degree 2, B of sigma-degree
                1, and 14 monomials.
              In particular D = 16 against 64 for S_3 and for the old arm
              (red team values, square_analogue_n3.json lines 23-50).
              The four regression targets must match exactly.
              A fresh random target whose system is not generic
              (positive_dimensional or degenerate_parametrisation, DC-6 R-5)
              is reported with its outcome class and replaced by the next
              seeded target. It is never silently dropped, and it counts as
              neither a pass nor a fail.
            F-2_identity_control: >-
              THE (sigma, w) SYSTEM MUST REPRODUCE THE RESCALED RAW u-SYSTEM'S
              SOLUTIONS, ORBIT BY ORBIT. Checked two ways.
              (a) Degree identity on every fixture target:
                  D(raw_u) = |G2| * D(torsion_S3_rq), i.e. 384 = 24 * 16 at
                  free orbits. Any deviation is reported with its non-freeness.
              (b) Solution identity on at least 2 targets per prime that are
                  decomposable by construction on the rescaled base (R = a sum
                  of 3 base points). The set of G2-orbits of the
                  F_{p'}-rational solutions of the raw u-system must equal,
                  orbit by orbit, the set of F_{p'}-rational (sigma, w)
                  solutions that lift. Record a bijection table.
              Planted targets are admissible HERE because n = m: the system is
              square, and D is the generic count, not a planted-orbit size.
              That is the object-C trap, which arises only when m < n
              (CORR-20260923-57177b).
            F-3_like_for_like_ratio: >-
              D(S3_rescaled) / D(torsion_S3_rq) = 4 = 2^{m-1} on every
              fixture target. The T-2 and T-3 arithmetic is exercised at
              n = 3 before it is used at n = 5.
            F-4_secondary_not_blocking: >-
              The n = m = 4 analogue over GF(4111^4) with b a square (red
              team: S4 4096, norm 4096, quotient 512; square_analogue_n4.json).
              It is run if feasible and reported. It is NOT blocking: it rests
              on one prime and was not reproduced, and at even degree the
              construction needs b a square (review-report.yaml lines
              717-721), so it is a different construction path.
            gate: >-
              F-1, F-2 and F-3 must all hold at both primes before ANY n = 5
              cell of ANY arm runs. A failure is an IMPLEMENTATION signal. It
              returns the task to the Executor with the mismatch listed. It is
              never a mathematical result about the quotient, and it never
              licenses an n = 5 cell.
        observation_collision:
          observable: >-
            The ideal degree D (msolve "Dimension of quotient") per arm, per
            target, on square n = m systems with random targets.
          distinct_preimage_search: >-
            KNOWN COLLISIONS, and what separates them:
            (1) The norm arm and the S_m arm have the SAME D and the same
                support (K5). D alone cannot show that a quotient was
                realised. Separators, each required on every built
                polynomial:
                - the monomial-support count (14 against 35 at n = m = 3);
                - a numeric SINGLE-FLIP TEST at random points: evaluate the
                  arm's relation function at (u_1..u_m) and at
                  (beta/u_1, u_2..u_m). torsion_rq must change from A + wB to
                  A - wB; the norm arm must be invariant.
            (2) Planted-target D at m < n equals the planted-orbit size for
                every symmetrized arm, whatever the group (object C,
                review-report.yaml lines 555-585). It is INADMISSIBLE as
                evidence of any drop. The v2 plan contains no
                constructed-solvable m < n cells.
            (3) D on a non-decomposable overdetermined system (m = 4, n = 5)
                is undefined and is the same for every arm. It is never read
                as a degree.
        constructive_transforms:
          - transform: representation_reduction
            proposed_object: >-
              The G2-invariant field of the rescaled u-variables, generated
              over F_{p'} by sigma(t') and w, with the single relation
              w^2 = prod(t'_i^2 - 4 beta).
            predicted_gain: >-
              D drops by 2^{m-1} against S_m on the same base. At m = 5 that
              is 2^20 -> 2^16, an EXTRAPOLATION from n = m = 3 and 4. The
              monomial count drops from 20349 to at most 2079, about 9.8x.
        quantifier_order: >-
          For each ladder prime p', with the prime fixed in ladder.json before
          any run: (beta, lam) is fixed per (curve, p') before any target is
          drawn. For every target R in the seeded stream, every arm is solved
          on the same R, and D(arm, p', R) is recorded. The ratio branches
          T-1 and T-2 quantify over the targets where both arms are measured.
          HEUR-GFPN-DFLAT is a statement about D(arm, p') for all p' on the
          ladder, per arm, as frozen (H-GFPN-9a29be lines 195-200). No
          witness may depend on R. A (beta, lam) chosen per target
          invalidates the cell.
        method_ceiling:
          strongest_certifiable_claim: >-
            On EcGFp5-SHAPED toy curves at the ladder primes, under the
            recorded envelope and msolve's build, the method can certify:
            - measured D per arm;
            - whether D_iii' is flat within 10% across three or more primes
              spanning 12 or more bits;
            - where the reference completes, the measured R_ref;
            - a MODELED band under the stated conventions.
            It cannot certify:
            - any security level;
            - the F4/FGLM cost at p = 2^64;
            - the decomposition probability at p = 2^64;
            - linear-algebra or memory cost;
            - any exponent.
            It also cannot show a drop larger than 2^{m-1} against S_m on the
            same base (T-2 ceiling).
          nearby_object_control: >-
            (1) A CURVE WITHOUT RATIONAL 2-TORSION MUST REFUSE: the
                random_no2torsion ladder curve, and the EcMasFp5-shaped
                prime-order curve if built. torsion_S5_rq must refuse at
                build and at cell level, with a RECORDED refusal, not a crash
                (DC-6 R-6). A torsion certificate on such a curve must fail
                the independent verifier.
            (2) random_with_2torsion, matched: a random curve with T = (0,0)
                and b a NON-SQUARE in F_q, the same square class as
                EcGFp5-shaped, so that the same rescaling path is exercised.
                It is run at every ladder prime for every arm it names (DC-6
                R-9). A b-square random control is optional and is reported
                separately.
            (3) The old norm arm, torsion_S{m}_norm, as a LABELLED NEGATIVE
                CONTROL. Expected D = D_S_m at n = m: 64 at n = m = 3 and
                4096 at n = m = 4. It is run in fixtures F-1 and F-4. At
                n = 5 it is run only where arm (ii) on the same targets
                completes, because its m = 5 shape is arm (ii)'s. Its group
                is reported as (Z/2)^m x| S_m of order 2^m m!.
        proof_obligations:
          - claim: Translation by T acts on the rescaled base as u -> beta/u, and no other translation acts on x-values of a double-odd curve.
            responsibility: interface
          - claim: The normalised relation function is G2-invariant and not (Z/2)^m x| S_m-invariant; verified numerically by the single-flip test on every built polynomial.
            responsibility: correctness
          - claim: A and B are exact, verified on held-out rows with zero mismatches.
            responsibility: correctness
          - claim: Every accepted relation lifts to m points with x(P_i)/lam in F_{p'} summing to R (or R + T, flagged), re-verified by code independent of the solver.
            responsibility: correctness
          - claim: D_iii' ~ 2^{(m-1)^2} at m = 5 is an extrapolation until measured.
            responsibility: size
          - claim: Decomposition probability 1/(2^{m-1} m!) and relations halved follow FHJRV lines 336-347 and are model inputs, not measurements.
            responsibility: success_probability
          - claim: Construction, specialisation, descent, solve and lifting are charged in the DC-4 unit identically in every arm.
            responsibility: runtime
          - claim: Every not_measured outcome is scoped to the DC-7 envelope and is never evidence about D.
            responsibility: scope
        not_applicable_reason: null

    DC-4_K6_cost_unit:
      choice: >-
        F3 IS DECLARED UNDECIDABLE UNDER v2, and the tail check at lines
        231-233 with it. An executed-instruction measurement is SPECIFIED and
        REPORTED. It is unscored, and it is not called an F_{p'} operation
        count.
      why_not_an_instrumented_F_p_count: >-
        msolve is an external binary with no field-operation counter
        (implementation.md D-2, lines 150-154). A counter-instrumented F4 is a
        separate implementation project. It would itself need validation
        against msolve's traces, and this card does not scope it. Instructions
        per proxy operation range from 6 to 101 across shapes (red team K6(d),
        review-report.yaml lines 286-290). So no fixed conversion turns an
        instruction count into F_{p'} operations, and the 2^36 threshold was
        set in F_{p'} operations.
      C-1_instruction_measurement: >-
        Per measured target, record the msolve child's user-space executed
        instructions.
        - Use hardware counters (perf stat -e instructions:u) where the host
          permits them. Otherwise use valgrind callgrind, total and inclusive
          in the F4 core, on the fixture shapes and the m <= 4 shapes only.
        - Record the method per row.
        - Where neither is available or affordable (callgrind at m = 5),
          record not_measured with the reason.
        - Report it next to msolve's printed CPU and single-thread wall time,
          under the DC-7 thread count.
        It is labelled "measured work proxy (instructions)". It is never
        converted to F_{p'} operations and never compared to 2^36.
      C-2_proxy_bracket: >-
        The nnz proxy (sum rows*cols*density) and the reduction proxy (sum
        (new+zero)*(rows-new-zero)*cols*density)
        (implementation.md lines 99-103) are reported as a BRACKET
        [nnz, reduction]. They are labelled "not a bound in either direction"
        (red team K6(d)(2)-(3): no bound direction, 2^8.4 spread). They never
        enter a band.
      C-3_construction_charged_identically: >-
        Charge the counted F_q operations of construction in EVERY arm,
        INCLUDING RAW, with the same OpCount instrument: per-target polynomial
        specialisation (or, for raw, the per-target grid construction),
        descent and lifting. Report them as raw counts of F_q mul, F_q inv
        and F_p mul, next to their mult-equivalent. In v1 the raw arm's
        construction was never charged (pdp_cell.py lines 562, 555; red team
        K6(c)).
      C-4_inversion_constant: >-
        Replace "1 F_q inv := 150 F_q mul" (symmetrize.py lines 88-89, 94),
        which is unsourced, with the frozen source's figure: "an inversion is
        only about 2.57 times the cost of a multiplication" (Pornin lines
        522-523). Cross-check against Pornin's cycle table: multiplication 49
        cycles, inversion 128 cycles (lines 501-519), ratio 2.61. The text's
        2.57 is used and the table's 2.61 is recorded next to it. The raw
        inversion COUNT is always reported, so any pricing can be recomputed.
        The 29 F_p mul per F_q mul convention is kept and labelled as a
        convention.
      F3_and_band_consequence: >-
        No measured-ops point estimate enters the band (DC-2 B-3). The band
        edges come from measured D only, which is the frozen formula's
        "D^2 floor and nominal 5 D^3 reported as the band edges" (line 190).
        F3 is reported as "undecidable (DC-4)" and never as passed or failed.
        This removes a falsification branch that K6 shows could never have
        been scored, and it removes it before any value exists: no m = 5 cell
        of any arm has a per-PDP figure.

    DC-5_K4_anchor_control:
      see: rulings.DC-5
      summary: >-
        v1's outcome stays FAILED. For v2, the blocking role passes to system
        identity plus trace identity. Wall clock is reported and is
        non-blocking. "n=4" is read as the (n-1) = 4-point decomposition on
        F_{p^5}.

    DC-6_record_defects_fixed_for_the_rerun:
      R-1_cap_and_attempt_counters: >-
        (CORR-20260923-3cbb89)
        - Each solver child reads back its own RLIMIT_AS with getrlimit
          after setting it, and logs it.
        - The manifest's resources block records that logged value in bytes.
          It never records a wrapper default (run_wrapper.py line 153).
        - A child that cannot set the cap refuses to start. This replaces the
          silent `ulimit -v` EPERM seen in 29 v1 logs.
        - Attempt counters come from outcomes:
          - targets_attempted = solver invocations started;
          - targets_measured;
          - one count per outcome class: ok, timeout, memory_exhausted,
            crashed, positive_dimensional, degenerate_parametrisation,
            not_attempted;
          - m5_timeout_count counts outcome == timeout only.
          This replaces pdp_cell.py lines 421-425.
      R-2_not_attempted_explicit: >-
        Write a v2 trial plan to experiments/EXP-GFPN-05ff43/trial-plan-v2.json
        and commit it BEFORE the first v2 run. It enumerates every planned
        (arm, curve_shape, p', m, target_kind) cell. Every planned cell ends
        with a terminal row: measured, not_measured (with class), or
        not_attempted (with reason). No planned cell may be silently absent.
        Targets skipped by an early stop are recorded as not_attempted with
        the stop reason, not with class resource_exhaustion (validator K1,
        review-report.yaml lines 229-240). The v1 trial-plan.json is not
        edited; its two recorded inconsistencies (validator CO-9, lines
        841-848) stay as recorded v1 defects. No v1 reserved run id, including
        RUN-GFPN-bb78e5, is reused.
      R-3_success_split_and_target_kind: >-
        (CORR-20260923-57177b)
        - cmd_raw fills decomposition_success_rate only for target_kind random,
          and success_rate_by_construction otherwise. This is the split
          cmd_cell already makes at pdp_cell.py lines 432-433, and it fixes
          line 563.
        - target_kind is written into EVERY per-run ladder-table.yaml,
          heur-dflat.yaml and aggregate row.
        - Relation counts deduplicate orderings: one signed-point multiset is
          one relation.
      R-4_anchor_thread_count: >-
        (CORR-20260923-1e2e67) The anchor manifests record the thread count
        from the solver command line actually executed (-t value). They never
        record the cell default.
      R-5_flag_degenerate_outcomes: >-
        (red team OOS-6, object A) Two outcome classes are added.
        - `positive_dimensional`: msolve reports positive dimension, or its
          output does not parse as a zero-dimensional parametrisation. This
          replaces the silent `if par and "error" not in par` at pdp_cell.py
          lines 380-382 and 539-541, and symmetrize.py line 537.
        - `degenerate_parametrisation`: msolve's log reports a non-square-free
          minimal polynomial, or any parsed solution fails substitution. EVERY
          parsed solution is substituted back into the descended system
          before lifting, because v1 trusted degenerate output
          (symmetrize.py lines 526-546).
        Neither class is a measured non-decomposition. Each is counted and
        reported. On a square n = m cell with random targets, either class
        makes that target's D undefined and records the reason.
      R-6_cmd_build_refusal: >-
        (OOS-2) cmd_build RECORDS a refusal row: arm, shape, reason
        "no rational 2-torsion" or "b-square class mismatch". It does not
        crash on max() of an empty list (pdp_cell.py lines 293, 312). The
        torsion arms' refusal on a curve without T is thereby a recorded
        nearby-object outcome.
      R-7_like_for_like_ratios: >-
        (OOS-1) Every degree ratio pairs two arms on the SAME targets and the
        SAME factor base: torsion_rq with S_rescaled; S with raw on the
        x-base. Cross-base, planted-target ratios (v1 degree_ratios_measured,
        pdp_cell.py lines 653-672) are not computed under v2.
      R-8_modeled_note_clarification: >-
        Disclosed clarification of specification lines 223-225, which is not
        a relabel. The three named modeled fields
        (projected_systems_at_p_2_64, projected_linear_algebra_cost_at_p_2_64,
        full_cost_band_bits_per_curve) are emitted separately.
        - When heur_dflat_pass is false, they are null with reason
          `heur_dflat_failed`.
        - When it is not_applicable, they are null with reason
          `heur_dflat_not_applicable`.
        v1's `heur_dflat_not_applicable` (RUN-GFPN-ca7b88/cost-band-p64.yaml
        lines 8, 12, 16) was the more accurate reading. It is NEVER to be
        relabelled `heur_dflat_failed`, which would read as F2 (validator K2,
        review-report.yaml lines 304-320).
      R-9_matched_controls_discharged_everywhere: >-
        random_with_2torsion (specification lines 132-134, "at each p' (all
        three arms)") is run at EVERY ladder prime for every arm it names:
        raw at m <= 4, S5, S5_rescaled, torsion_S5_rq, and torsion_S5_norm
        where arm (ii) runs. random_without_2torsion (lines 135-137, "arms
        i-ii") is run at every ladder prime for raw and S5, and records
        torsion_S5_rq's refusal. In v1 both were discharged only at
        p' = 4111, m = 4, and never for arm (i) (validator K2,
        review-report.yaml lines 321-333).
      R-10_inputs_retained: >-
        FROM THE VALIDATOR'S ARTIFACT CHECK, NOT IN THE CARD'S LIST. The
        msolve input files of every anchor and fixture target, and of target
        0 of every cell, are retained in the run package, or at least their
        sha256 where size forbids. v1 deleted them (pdp_cell.py lines 249,
        367, 415; validator review-report.yaml lines 68-75).
      R-11_implementation_committed_first: >-
        The v2 implementation (implementation/ and implementation.md) is
        committed by its own snapshot archive BEFORE ANY v2 run, including
        fixture F-1..F-3. Every v2 manifest records that commit and a clean
        tree for implementation/. In v1 the code was never committed before
        the runs (DEC-20260923-d86ff2 limitations).

    DC-7_memory_envelope:
      A-1_host: >-
        Each run records its host: CPU model, total RAM from /proc/meminfo,
        swap, and kernel. v1's host was a Xeon at 2.80 GHz with 16481980 kB
        of RAM and no swap (validator review-report.yaml lines 220-223;
        EV-GFPN-fc5950 boundaries).
      A-2_solver_cap: >-
        Every msolve child runs under RLIMIT_AS = 12884901888 bytes (12 GiB).
        The limit is set in the child and read back per DC-6 R-1. One solver
        child runs at a time on the host, and no other solver lane may run
        concurrently (goal max_concurrent). Builders (interpolation) run as
        separate run packages under the same cap, never concurrently with a
        solver. The arm (ii) and (ii') m = 5 interpolation matrices are about
        20349^2 entries of 8 bytes, about 3.3 GB.
      A-3_threads: >-
        msolve -t 1 for every scored cell, fixture and anchor. Single-thread
        figures keep wall time, CPU and instruction counts comparable across
        arms and with the anchor. v1's cells ran -t 4 and its anchors -t 1
        (CORR-20260923-1e2e67). The change is recorded, and it is not a
        scientific variable.
      A-4_machine_protection_first: >-
        The dispatching session's memory guard killed a v1 scratch probe at
        13.1 GB (implementation.md lines 224-228). If the guard's threshold
        leaves less headroom than 12 GiB plus the driver's own footprint, the
        Executor LOWERS the child cap. The lowered cap is recorded, and every
        not_measured outcome is scoped to the cap actually in force. A cap is
        machine protection, never a research budget (CLAUDE.md "Research
        budgets"). Its expiry or exhaustion is an infrastructure outcome.
      A-5_larger_host: >-
        A larger host is PERMITTED up to the contract's maximum_memory_gb 32
        (specification line 249), with the envelope recorded per run. It is
        not required. A cell that is not_measured under 12 GiB and is later
        measured on a larger host is reported as two envelope-scoped rows,
        never merged.
      A-6_scope_of_not_measured: >-
        Every not_measured row carries its envelope tuple: host RAM, cap
        bytes from the child, threads, msolve version, arm and construction,
        p', m, and the last F4 round reached. Any sentence about an absence
        uses that tuple, as the CORR-20260923-3cbb89 envelope sentence does.
        Raw at m = 5 is recorded not_attempted, with the reason "predicted
        D_raw ~ 2^26.9 (P-2), 2^6.9 above the S_5 shape that exhausted 11 GiB
        at the degree-33 round (RUN-GFPN-8f1b50); 17^5-node grid
        interpolation". This is a coverage record, not a measurement.
      A-7_run_count: >-
        v2 declares at most 48 run packages. They are counted separately from
        v1's 48 packages. The frozen maximum_runs 64 (line 250) was sized for
        v1, and budget.enforcement is `advisory` (line 246). maximum_workers
        stays 1. The early stop that was v1 deviation D-5 is PRE-DECLARED
        here: an m = 5 cell that records 2 consecutive memory_exhausted
        outcomes at the same F4 degree records its remaining targets as
        not_attempted. Any cell with a measured target continues to 20
        targets. No measured cell's sample count is reduced.

  # ---------------------------------------------------------------------------
  # RULINGS (card DC-5 and DC-8)
  # ---------------------------------------------------------------------------
  rulings:
    DC-5:
      subject: n4_published_timing_anchor (specification lines 127-131)
      facts: >-
        - RUN-GFPN-61bba9 timed 7.995 s (median, 25-bit, msolve -g 1 -t 1)
          against JV's own-C F4 row of 17.01 s. The ratio is 0.470, outside
          [0.5, 2.0] on the fast side (validator K4(e), review-report.yaml
          lines 561-581). Source row: inputs/JOUX-VITSE-2010-157/paper_fulltext.md
          lines 696-698. Hardware: 2.6 GHz Core 2 Duo (line 684).
        - System identity HOLDS strongly. The system was derived
          independently, and msolve produced an F4 trace identical round by
          round to all five 61bba9 logs. Recorded counts: 495 monomials,
          2471 terms, "#pairs reduced 10762" (lines 499-519).
        - The reference row was fixed in code before the measurement, but in
          no frozen record (lines 532-544).
        - The validator's identical computation took 5.88 s on a 2.10 GHz
          host (ratio 0.346, lines 577-581).
      options_weighed:
        accept_the_fast_side: >-
          REJECTED. The frozen band is two-sided (line 130, "within 2x").
          Accepting only its failing side, after seeing which side failed, is
          the post-hoc move the invalidation rule at line 269 forbids. A fast
          ratio also cannot tell "the genuine system on faster hardware" from
          "an easier system". Only system identity can.
        re_pin_to_F4_prime: >-
          REJECTED. JV's F4' row, 5.002 s at 25 bits (line 703), would give
          1.60 and pass. F4' is JV's variant with precomputed pair lists
          (lines 662-676, 706-710). It is a different algorithm from msolve's
          standard F4, so it is less "the same solver family" than the own-C
          F4 row. The code chose the own-C F4 row before the measurement. It
          was the row less favourable to passing (validator lines 538-540).
          Moving to the row that passes is picking a band because it passes,
          which DC-5 forbids.
        replace_with_system_and_trace_identity: >-
          ADOPTED. The control exists "before trusting n=5 cells" (line 130).
          What makes a cell trustworthy is that the pipeline builds and solves
          the GENUINE Joux-Vitse system. Timing against 2010 hardware tests
          that only weakly, and it moves by 1.4x between two modern hosts on
          an identical computation. Wall time is also barred from any
          transfer by the contract itself (lines 122 and 267).
      ruling: >-
        (1) v1 STAYS FAILED on its literal band. RUN-GFPN-61bba9's
            within_2x_literal false is not re-scored, not re-pinned, and not
            relabelled. No v1 result is re-read as having passed this control.
        (2) For v2 the blocking control is `jv_anchor_system_trace_identity`,
            which is ADDITIVE. The frozen text of n4_published_timing_anchor
            is not edited.
            - At p' = 16777291 (25 bits; ladder.json), the v2 implementation
              builds the (n-1) = 4-point S_4-symmetrized system on F_{p'^5}
              for at least 3 random targets.
            - It must match the independent derivation in structure: 4
              variables; 5 equations of total degree 8; 495 monomials in the
              union support; the per-target term count the derivation gives
              (2471 on the validator's targets). The validator's generator is
              coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-58953e/scratch/k4a_anchor_system.py,
              which is independent of the producer's code, and is run on the
              same targets.
            - Under msolve 0.6.5 -g 1 -t 1, the per-round F4 trace (degree,
              pairs, rows, columns, new, zero) must be IDENTICAL to the
              archived RUN-GFPN-61bba9 anchor_t*.ms.log traces. v1's traces
              were target-independent (validator lines 509-519).
            - If the solver build differs from msolve 0.6.5, trace identity is
              replaced by identity with a fresh run of the independent system
              on the same build, and the substitution is recorded.
        (3) The wall-clock ratio against JV's own-C F4 row is REPORTED with
            the host description. It is NON-BLOCKING.
        (4) This is a disclosed RELAXATION of a timing criterion. It is made
            before any v2 run, and nothing in v1 relied on the control
            passing: C-6 was already unsatisfied when the v1 cells ran
            (validator lines 575-577).
      n4_label_reading: >-
        ADOPTED: "n=4" means the (n-1) = 4-point decomposition on F_{p^5},
        i.e. n = 5, m = 4. It is the only reading with an instance in the
        frozen sources. JV's timing table is F_{p^5} with "5 equations ... of
        total degree 8 in 4 variables" (JV lines 678-680, 687-704). FHJRV's
        decomposition timings are for degree-5 extensions with the 6th
        summation polynomial (hal-00935050.txt lines 837-868). No frozen
        source has an extension-degree-4 timing (validator K4(d), lines
        545-560). The specification's own n is the extension degree (line 87),
        so the frozen label is a notation defect. It is read, not edited.

    DC-8:
      subject: EXP-GFPN-659e34 (frozen, approved; /run candidate under TASK-20260921-838c4a)
      ruling: >-
        A COMPANION AMENDMENT IS NEEDED BEFORE /run. It is drafted at
        experiments/EXP-GFPN-659e34/amendments/v1_to_v2_arm_iii_and_driver.yaml.
        Its operative clauses:
        - M-1: arm (iii) as built, `torsion_S4` (the same norm construction;
          CORR-20260923-064d0d; red team OOS-3), is KEPT on the cost ladder
          as a labelled negative control and DROPPED from the rate ladder.
        - M-2: the m = 4 driver's two silent loss paths become flagged
          outcome classes, with substitution checking and a blocking
          object-A completeness control.
        - M-3: the cost-unit declaration of DC-4 applies to
          fp_operations_per_attempt.
        Arms (i) and (ii) run as frozen, subject to M-2 and M-3.
      additional_finding_that_bears_on_the_ruling: >-
        FOUND BY THIS ACT, NOT NAMED IN DC-8, AND RECORDED RATHER THAN
        SUPPRESSED. 659e34's cost ladder measures "the FGLM ideal degree D_4
        per arm ... on 20 random X_r per cell without requiring success"
        (experiments/EXP-GFPN-659e34/specification.yaml lines 80-85, 141).
        At n = 5, m = 4 the descended system is 5 equations in 4 unknowns, so
        it is overdetermined. A random X_r decomposes with probability about
        1/(24 p') (H-GFPN-3366ea lines 243-246). Otherwise its ideal is the
        unit ideal and D_4 is undefined. That is exactly what v1 of this
        experiment recorded on its m = 4 random-target cells: 0/20 each, with
        D undefined (implementation.md lines 251-255; EV-GFPN-fc5950
        strength_basis). As frozen, therefore, the following cannot be scored
        on random X_r:
        - ideal_degree_D4_per_arm;
        - D4_variation_across_ladder;
        - heur_dflat4_pass;
        - F2, F3 and F4 of 659e34;
        - the D_4-band fallback of the work projection.
        HEUR-GFPN-DFLAT4's formal statement names "the FGLM ideal degree D_4,A
        of the descended (n-1)-point system" (H-GFPN-3366ea lines 206-211).
        Repairing the observable (for example, measuring D_4 on a square
        4-equation subsystem) changes the heuristic's object, which is a
        hypothesis-level change. It is outside this card's write scope, and
        the companion draft FLAGS it (its F-1) without amending it.
      consequence_for_the_next_action: >-
        The next action does NOT become `/run EXP-GFPN-659e34` under
        TASK-20260921-838c4a on this ruling alone. The approval decision for
        the companion draft must also decide F-1. Its options:
        (a) Record a correction on H-GFPN-3366ea for HEUR-GFPN-DFLAT4's
            object, then approve a further amendment that defines D_4.
        (b) Approve /run with every D_4-dependent output emitted
            not_applicable, with reason d4_undefined_on_random_targets, and
            the work projection null. This is what the frozen rules yield
            mechanically.
        Under (b) the run still measures |F|, the query count, the
        decomposition rate (HEUR-GFPN-RATE4) and per-attempt cost. It does
        not measure the work projection that goal criterion C2 needs.
      what_this_ruling_does_not_do: >-
        It does not approve the companion draft, edit 659e34's frozen
        specification, move H-GFPN-3366ea, or launch anything. The genuine
        F_p-rational quotient arm at m = 4 is NOT added to 659e34 here. It
        waits for this amendment's fixture F-1..F-3 to pass in EXP-GFPN-05ff43.

