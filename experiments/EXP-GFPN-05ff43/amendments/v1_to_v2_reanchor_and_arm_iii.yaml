  change:

    DC-2_K7_reanchor_prediction:
      defect: >-
        The frozen formula (specification line 184) anchors the design note's
        D ~ 2^20 to the RAW system. The design note's "5 equations with 5
        unknowns, and a total degree 2^{k-1} = 16 ... D ... close to
        2^{k(k-1)} = 2^20 ... O(D^2) ~ 2^40 ... at least 2^142"
        (inputs/PORNIN-2022-274-ECGFP5/paper_fulltext.md lines 138-149)
        describes the S_5-symmetrized system in e_1..e_5. Joux-Vitse attach
        that total degree and the 2^{n(n-1)} degree to the
        elementary-symmetric form
        (inputs/JOUX-VITSE-2010-157/paper_fulltext.md lines 281-287; line
        353). The frozen D_raw, D_S5 and D_torsion, and the band 2^121-2^132,
        are therefore off by 5! = 120. The band also omits the inverse success
        probability. Sources: CORR-20260923-27ce4f; red team K7,
        coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-404bf9/review-report.yaml
        lines 310-399.
      predictions_restated:
        P-1_D_S5: >-
          D_S5 ~ 2^20 = 16^5. This is the Bezout number, and the mixed volume,
          of five equations whose Newton polytope is the degree-16 simplex in
          e_1..e_5. It is the design note's own D (Pornin lines 145-146). The
          producer's arm (ii) is interpolated on C(21,5) = 20349 total-degree
          <= 16 monomials (implementation.md lines 80-84).
        P-2_D_raw: >-
          D_raw ~ 5! * 16^5 = 2^26.9. This is the mixed volume of five
          equations with Newton polytope in the box [0,16]^5 (red team K7(b),
          review-report.yaml lines 335-347). The n = m = 3 analogue attains the
          full-box count 3! * 4^3 = 384 exactly
          (coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-404bf9/scratch/k5k7/square_analogue_n3.json
          lines 23-27).
        P-3_D_iii_prime: >-
          D_iii' ~ 2^16 = 2^{(m-1)^2}, for the rescaled quotient of DC-3. STATED
          AS AN EXTRAPOLATION. It is the free-orbit count
          D_S5 / 2^{m-1} = 2^20 / 2^4. It is observed only in the red team's
          square analogues:
          - 16 at n = m = 3, two primes, reproduced by the dispatcher
            re-running the red team's script, which is not an independent
            derivation;
          - 512 at n = m = 4, one prime, b a square, not reproduced
            (KN-OPEN-9b4a2b lines 58-70).
          No m = 5 quotient system has been built by anyone.
        P-4_D_norm: >-
          D_norm ~ D_S5 = 2^20 for the old arm (iii), kept as a negative control.
          It has arm (ii)'s support: 20349 = 20349 at m = 5 (RUN-GFPN-42a000).
          In the square analogues it has arm (ii)'s degree: 64 = 64 and
          4096 = 4096 (CORR-20260923-064d0d lines 55-61).
        P-5_S5_rescaled: >-
          D_S5_rescaled ~ 2^20. This is the S_5 system on the rescaled factor
          base of DC-3. The change of variable x = lam u does not alter the
          total degree 16 of the symmetrized equation. It is the like-for-like
          reference for arm (iii'). Coordinator's derivation; checked at
          n = m = 3 by fixture F-3 below.
      thresholds_restated:
        T-1_frozen_ratios_on_measured_D_raw: >-
          D_raw / D_S5 >= 2^6 and D_raw / D_iii' >= 2^9 on every completed cell
          where D_raw is MEASURED on the same targets. The thresholds are
          unchanged from lines 185-186. Under the re-anchored model the
          free-orbit values are 2^6.9 and 2^10.9, so both thresholds sit below
          their free-orbit values, and neither is loosened by re-anchoring.
          Where D_raw is not measured, both ratios are recorded not_measured,
          with the reason. They are NEVER computed against 2^20 or any other
          constant.
        T-2_like_for_like_reference: >-
          R_ref := D_S5_rescaled / D_iii'. It is computed on the same m = 5
          targets and on the same (rescaled) factor base, and only where both
          arms are measured.
          - Predicted: R_ref = 2^4 at free orbits.
          - F1' fires when R_ref < 2^3 on any such EcGFp5-shaped cell, i.e.
            the drop falls short of the free-orbit value by more than a factor
            of 2. The slack mirrors the frozen tail check's factor 0.5 (line
            230).
          - CEILING: R_ref > 2^4 cannot occur for a correct construction,
            because each G2-orbit is a union of at most 2^{m-1} S_m-orbits.
            It is recorded as an INSTRUMENT ANOMALY, investigated, and never
            read as a larger gain.
        T-3_nonfreeness_two_sided: >-
          nonfreeness_iii' := 2^{m-1} * D_iii' / D_S5_rescaled, which is 1 at
          free orbits.
          - Report the value on every cell where it is defined.
          - Flag > 2 (the drop is short). This is the F1' region.
          - Flag < 1 (ceiling violated; anomaly).
          Also report D_sym * |G| / D_raw per the frozen tail check. Note
          that the frozen label "severe non-freeness" names the > side, while
          its test is < 0.5. Both sides are reported, and the frozen text is
          not edited.
        T-4_absolute_comparison_unscored: >-
          The measured D_iii' is REPORTED next to the extrapolated 2^16 as the
          ratio D_iii' / 2^16. This is a diagnostic. It is NOT a falsification
          branch and NOT a success condition, because scoring against a
          constant derived from 2^20 is what DC-2 forbids.
      F1_restated: >-
        Under v2, F1 fires on a completed m = 5 EcGFp5-shaped cell when either
        branch holds:
        - (F1) D_raw / D_iii' < 2^9, with D_raw and D_iii' both MEASURED on
          the same targets; or
        - (F1') D_S5_rescaled / D_iii' < 2^3, with both measured on the same
          targets and the same factor base.
        Timeouts and memory exhaustion fire neither branch (frozen line 288).
        Where the reference arm of a branch is not measured, that branch
        cannot fire, and the record says so.
      honest_expectation_about_m5_scoring: >-
        STATED BEFORE ANY RERUN SO THAT NO READER IS SURPRISED.
        - D_raw at m = 5 (~2^26.9) is not expected to be measurable on any
          envelope this program has. So F1 is not expected to be scoreable at
          m = 5.
        - The reference arm S5_rescaled has arm (ii)'s 20349-monomial shape.
          That shape exhausted 11 GiB in the degree-33 F4 round
          (RUN-GFPN-8f1b50; CORR-20260923-3cbb89). Under the DC-7 envelope it
          is expected to end not_measured. F1' is then not scoreable at m = 5
          either.
        In that case the 2^{m-1} drop is evidenced only at n = m = 3 (fixture
        F-3), and D_iii' at m = 5 is reported unscored against the
        extrapolation (T-4). This is a limit of the envelope and is recorded
        as one. It is not a reason to score against a constant.
      band_restated:
        B-1_model_and_charges: >-
          The band keeps the design note's own model:
          - relations needed ~ p^{2-2/5} = 2^102.4 at p = 2^64 - 2^32 + 1
            (Pornin lines 138-140; JV lines 362-365);
          - per-system cost edges D^2 (floor) and 5 D^3 (nominal; Pornin lines
            143-148, O(k D^3) with k = 5).
          ADDED, per the note's own cost bookkeeping and following
          JV "n! c(n,q) q^{2-2/n}" (JV line 365):
          - systems = relations x inverse success probability;
          - S_5 and raw: 1/5! (JV lines 329-349);
          - the (Z/2)^{m-1} x| S_m quotient: 1/(2^4 * 5!). FHJRV state that
            the reduced factor base divides the decomposition probability by
            m^{n-1} = 2^4 (research/equation-schemes-20260905/retrieved-pages/hal-00935050.txt
            lines 345-347), and give "2^4 x 5! x" one decomposition test per
            relation (line 854). Line 854 concerns a binary field; it is cited
            for the counting factor at n = 5, m = 2, which lines 345-347 state
            in general.
          - Factor-base halving for the quotient: relations needed x 1/2
            (FHJRV lines 336-344, "#F/m relations").
        B-2_restated_band_table_log2: >-
          Model arithmetic, not measurements, and not security findings.
          Each figure is written as D^2 edge / 5 D^3 edge.
          UNCHARGED (the design note's convention: systems = 2^102.4):
          - S_5, D = 2^20: 142.4 / 164.7 (the note's own figure; Pornin
            line 149);
          - raw, D = 2^26.9: 156.2 / 185.4;
          - quotient (iii'), D = 2^16: 134.4 / 152.7;
          - norm arm (old iii), D = 2^20: 142.4 / 164.7.
          CHARGED:
          - S_5: 5! 2^102.4 = 2^109.3 systems -> 149.3 / 171.6;
          - raw: 2^109.3 systems -> 163.1 / 192.4;
          - quotient (iii'): 2^4 5! 2^102.4 / 2 = 2^112.3 systems ->
            144.3 / 162.6;
          - norm arm on the phi-base: success 1/1920 by the red team's count,
            with halving -> 2^112.3 systems -> 152.3 / 174.6.
          Every charged figure except the norm arm's matches the red team's
          table (review-report.yaml lines 354-381). The norm-arm row is the
          Coordinator's arithmetic on the red team's success count
          (review-report.yaml lines 169-177).
        B-3_what_the_rerun_emits: >-
          For each arm with heur_dflat_pass true (the frozen gate, lines
          223-225), emit the band from the MEASURED D, in both conventions:
          - uncharged, next to 142.4;
          - charged, next to 149.3.
          In the charged convention the systems count uses the model's
          inverse success probability. A measured decomposition_success_rate
          replaces it only when at least one verified success exists, and then
          with its binomial interval. At p' = 4111 and 20 targets, the model
          expects about 0.01 successes for arm (iii'). A 0/20 measured rate is
          therefore expected, and it does not enter the band. The record says
          so.
        B-4_not_charged_and_flagged_optimistic: >-
          The following are NOT charged, as in the note and in v1:
          - linear algebra on ~p^{2-2/5} sparse rows;
          - memory;
          - the time-memory tradeoff;
          - symmetrized-polynomial construction amortisation;
          - the o(1) in FGLM's exponent.
          The halving of the balanced relation count is taken as a plain
          factor 1/2, and the balancing is not re-derived for the reduced
          base. Both are flagged OPTIMISTIC, and a time-memory statement is
          owed before any band is compared to 128 (red team
          cost_model_challenges, review-report.yaml lines 705-714).
        B-5_hypothesis_level_prediction_flagged: >-
          H-GFPN-9a29be predicts "Upper edge of EcGFp5 arm-(iii) band below
          2^135" (ledger/hypotheses/H-GFPN-9a29be.yaml lines 238-243). Under
          the re-anchored model the quotient's upper edge is 152.7 uncharged,
          or 162.6 charged. This amendment does not score, restate or retire
          that hypothesis-level prediction. The band is reported wherever it
          lands, and the reading belongs to the evidence-review decision.
      hard_coded_constants_the_rerun_must_replace:
        - locus: implementation/pdp_common.py lines 219-221
          content: D_raw_free_orbit 2^20, D_S5_free_orbit 2^20/120, D_torsion_S5_free_orbit 2^20/1920; group_orders raw 1, S5 120, torsion_S5 1920
          replacement: >-
            The P-1..P-5 predictions are recorded as predictions only, never
            as divisors. Group orders:
            - S5 = 120;
            - torsion_S5_rq = 2^4 * 120 = 1920;
            - torsion_S5_norm = 2^5 * 120 = 3840.
        - locus: implementation/pdp_cell.py lines 451-455
          content: orbit_nonfreeness_ratio_vs_predicted_raw computed with D_raw = 2^20
          replacement: T-3, against the measured like-for-like reference only
        - locus: implementation/pdp_cell.py line 661
          content: supplementary group table giving torsion_S{m} order 2^{m-1} m!
          replacement: >-
            torsion_S{m}_rq has order 2^{m-1} m!, and torsion_S{m}_norm has
            order 2^m m!. Supplementary constructed-solvable ratios are not
            computed at all (DC-6 R-7).
