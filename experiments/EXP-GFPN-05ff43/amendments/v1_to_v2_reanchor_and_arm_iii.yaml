# =============================================================================
# AMD-EXP-GFPN-05ff43-20260923-reanchor-arm-iii  --  DRAFT, NOT APPROVED
#
# A draft of an ADDITIVE, versioned protocol amendment of EXP-GFPN-05ff43,
# taking the protocol from v1 (the frozen specification) to v2 (the frozen
# specification read together with this record). It is written BEFORE ANY
# RERUN. Under v1, no m = 5 cell of any arm measured a degree, and no
# construction of the arm this amendment introduces has been built at n = 5 by
# anyone. It is written by the Coordinator under design card
# TASK-20260923-aa277e, following DEC-20260923-d86ff2.
#
# WHAT IT DOES. It addresses DC-2 through DC-7 of that card, each by name:
# - it re-anchors the preregistered prediction (K7);
# - it replaces arm (iii) with an F_p-rational (Z/2)^{m-1} x| S_m quotient on a
#   rescaled factor base, and keeps the old arm as a labelled negative
#   control (K5);
# - it declares the cost unit (K6);
# - it rules on the anchor control (K4);
# - it repairs the recorded accounting defects;
# - it states the memory envelope.
# The `rulings` block carries the DC-5 anchor ruling and the DC-8 ruling on
# EXP-GFPN-659e34.
#
# WHAT IT IS NOT: approved, evidence, a prediction of what a rerun will find,
# a hypothesis status move, or a security statement about EcGFp5 or EcMasFp5.
# Approval is a later, separate Coordinator decision with its own DEC id. That
# decision reads the ARCHIVED bytes of this file (snapshot TASK-20260923-64faac).
# =============================================================================
