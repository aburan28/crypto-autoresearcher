  # ---------------------------------------------------------------------------
  # THE CHANGE
  # ---------------------------------------------------------------------------
  change:

    PS-1_the_fix:
      primary_branch_P-A:
        what: >-
          In every process that the repair layer starts to run a v2 or v2-a1
          driver command, the entry point configures cypari2's process-wide
          PARI stack BEFORE it imports any v2 or v2-a1 module that can reach
          PARI and before it dispatches the command:
          - parisize    = 67108864 bytes (64 MiB);
          - parisizemax = 536870912 bytes (512 MiB).
          v2_common.curve_order_pari is NOT replaced under P-A. It runs
          byte-identically; only the process state it inherits differs.
        rule_for_the_values: >-
          - parisizemax is at most HALF of the declared driver_rss_limit_bytes
            1073741824 (trial-plan-v2.json line 85; DEC-20260923-e788a1 AC-1),
            which leaves at least 512 MiB for the Python driver. The recorded
            rusage maxrss (driver plus children) was 70750208 B in
            RUN-GFPN-ac4487 and 74854400 B in RUN-GFPN-3377f1
            (execution-report-v2.yaml lines 130 and 139).
          - parisize is about 8x the ceiling that overflowed (8003584 B), so
            ordinary calls need not grow the stack.
          - The envelope criterion the Executor must demonstrate (DV-2, DV-4):
            after every in-process call, the driver's VmHWM is at most
            805306368 B (768 MiB, three quarters of the driver limit), and the
            RSS reading the v2 code takes before a child launch is below
            1073741824 B.
          - No other value may be used without a new Coordinator decision.
            v1's `pari.allocatemem(2 * 10**9)` (implementation/ladder_select.py
            lines 23-25) shows the API on this pipeline, but its value exceeds
            the 1 GiB driver limit and is NOT admissible here.
        api: >-
          The Executor chooses the cypari2 call that sets both values (for
          example allocatemem(size, sizemax), or default('parisizemax', ...)
          then default('parisize', ...)) and documents it in
          implementation-v2-r1.md. The read-back below decides whether it
          worked, not the choice of call.
        read_back: >-
          MANDATORY IN EVERY PACKAGE. After configuring and before dispatching
          the command, the entry obtains a FRESH `cypari2.Pari()` handle,
          exactly as v2_common.py line 253 does, and reads default(parisize)
          and default(parisizemax). Unless both equal the configured values,
          the entry exits before any command runs; the refusal is recorded
          and is never a result. At exit, normal or by exception, it reads
          them again, together with /proc/self/status VmHWM and VmRSS, and
          writes pari-stack.json into the run directory. The wrapper copies it
          into manifest resources.pari_stack.
      fallback_branch_P-B:
        trigger: >-
          ONLY this infrastructure condition, established in stage R1: DV-2
          under P-A fails at some (p', degree, curve) point that DV-1 lists,
          with at least one of:
          (i) a PARI stack overflow at parisizemax 536870912;
          (ii) driver VmHWM above 805306368 B after the call;
          (iii) the read-back through a fresh cypari2.Pari() handle does not
               equal the configured values, i.e. the configuration does not
               reach the handle the v2 code obtains;
          AND the failure reproduces on one re-invocation in a fresh process.
          The trigger evidence goes into implementation-v2-r1.md verbatim: for
          each invocation, the command, exit status, the read-backs, VmHWM and
          the last 50 lines of stderr. No ladder, cell or fixture system solve
          bears on the trigger. A fault in the layer's own code is fixed
          within stage R1 and does not trigger P-B.
        what: >-
          Inside each entry process, the module attribute
          v2_common.curve_order_pari (called as C.curve_order_pari at
          v2_driver.py lines 308, 542 and 771) is replaced by a function with
          the same signature that computes #E(F_q) by running /usr/bin/gp in a
          CAPPED CHILD through v2_solver.run_child:
          - RLIMIT_AS 10737418240 set in the child and read back with getrlimit
            before exec; a child that cannot set it refuses to start;
          - one memory-heavy child at a time;
          - `default(parisize, 256000000); default(parisizemax, 4000000000)`,
            as implementation-v2-a1/a1_pari.py line 38;
          - the same ffgen / ellinit / ellcard expression, modulus and
            coefficient serialisation as v2_common.py lines 254-260;
          - it returns the integer N parsed from gp's output and raises on any
            child outcome other than ok.
          This is the ONLY v2 function any part of the repair may replace, and
          only under P-B. The child timeout is 7200 s (as a1_pari.py line 28),
          declared in each r1 plan's `repair` block, NOT in `watchdogs`: it is
          not a per-(arm, m) watchdog, a group-order child is not a solver
          cell, and its expiry is a failed parameter computation, never
          evidence. The child's getrlimit read-back is copied into manifest
          resources.pari_stack.
        envelope: >-
          4000000000 B of gp stack is inside the 10737418240 B child cap
          (AC-1). The driver's RSS is not affected.
        prior_signal: >-
          implementation-v2-a1.md lines 366-375: in stage 1b, /usr/bin/gp in a
          capped child computed ellcard for the three curves over
          GF(1073741831^5) with these stack defaults and matched the
          ladder.json orders. That is a development note on this host, not a
          run record. DV-2 is still required under P-B.
        if_P-B_also_fails: >-
          Stage R1 STOPS and returns the evidence. A new Coordinator decision
          follows. Nothing runs.
      finality: >-
        The branch written into the plans at phase A of the repair archive
        (P-A, or P-B with its trigger evidence) is final for this protocol
        version. Changing it needs a new Coordinator decision.

    PS-2_the_layer:
      paths: >-
        Stage R1 writes, and phase A of the repair archive binds:
        - experiments/EXP-GFPN-05ff43/implementation-v2-r1/ (new directory;
          its exact file list is fixed by the phase-A receipt);
        - experiments/EXP-GFPN-05ff43/implementation-v2-r1.md;
        - experiments/EXP-GFPN-05ff43/trial-plan-v2-r1.json;
        - experiments/EXP-GFPN-05ff43/trial-plan-v2-a1-r1.json.
        Stage R2 writes runs/<each id reserved in trial-plan-v2-r1.json>/ and
        experiments/EXP-GFPN-05ff43/execution-report-v2-r1.yaml.
        Stage R2b writes runs/<each id reserved in trial-plan-v2-a1-r1.json>/
        and experiments/EXP-GFPN-05ff43/execution-report-v2-a1-r1.yaml.
      roles_permitted: >-
        The layer contains exactly these roles (module names are the
        Executor's):
        (a) ENTRY POINTS, one for v2 driver commands and one for v2-a1 driver
            commands. Each applies PS-1, sets the redirections below
            in-process only, and calls the unchanged driver's main() with the
            package's driver_args from the r1 plan.
        (b) the r1 RUN WRAPPER (PS-5);
        (c) the r1 COMPLETION-GATE CHECKER (PS-5), including the REG-1
            comparator (PS-4);
        (d) the PLAN WRITER (PS-3);
        (e) the DEVELOPMENT CHECKS (PS-6).
      redirections_permitted: >-
        Module-level constants, set in-process only, and only these:
        - v2_common.PLAN_PATH -> trial-plan-v2-r1.json (v2_common.py line 32);
        - v2_common.TASK_ID -> the stage-R2 run card (v2_common.py line 46);
        - a1_common.PLAN_A1_PATH -> trial-plan-v2-a1-r1.json (a1_common.py line 40);
        - a1_common.V2_PLAN_PATH -> trial-plan-v2-r1.json (line 41);
        - a1_common.RECEIPT_V2_PHASE_B -> the repair archive's phase-B receipt (line 47);
        - a1_common.V2_GATE_PACKAGES -> the four r1 gate ids (line 62);
        - a1_common.TASK_ID_RUNS -> the stage-R2b run card (line 56);
        - a1_common.PROTOCOL_VERSION -> "2-a1-r1" (line 30).
        Any other redirection is permitted only if it names a plan, receipt,
        task id, run-id list or protocol-version label that this addendum
        re-points, and it is listed in implementation-v2-r1.md with its old
        and new values and a reason. No function, class or computation is
        replaced, except v2_common.curve_order_pari under P-B.
      out_of_scope: >-
        Everything else. In particular: arms, builders, interpolation,
        solvers and msolve flags, lifting, certificates, verifiers, scoring,
        reading rules (A1-3, A1-4, A1-5, AA-4), targets and streams,
        watchdogs, envelope values, the Sage comparator and its inputs, any
        new package kind, and any fix for anything the DV-1 inventory flags
        other than in-process PARI. If stage R1 finds that the v2 or v2-a1
        drivers cannot run from the r1 plans without editing a frozen byte or
        replacing a further function, it STOPS and returns the reason. It
        never edits.

    PS-3_plans_ids_and_ceiling:
      trial_plan_v2_r1: >-
        Derived mechanically from trial-plan-v2.json (sha256
        16f33e39b58277734f52b4b3c7353a9878ff6703a638a561541adb8f57e44e16,
        bound by phase A of TASK-20260923-0fa03f):
        - each of the 31 v2 packages (27 planned, 4 contingency) receives one
          new id; the map old -> new is recorded as `id_map` (31 entries);
        - every occurrence of an old v2 id anywhere in the plan (run_id,
          requires, gate.blocking_packages, driver_args, cells_enumeration and
          any other field) is replaced by its image;
        - declared metadata keys are added or changed: protocol_version
          "2-r1"; task_id (the stage-R2 card); written_by_task (the stage-R1
          card); archived_by; a `repair` block (this addendum's id and
          sha256, its approval decision, the PS-1 branch and values, and
          pari_child_timeout_s under P-B only); `gate.regression` (REG-1);
          id_map; v2_ids_never_reused (all 31 v2 ids); a1_ids_never_reused
