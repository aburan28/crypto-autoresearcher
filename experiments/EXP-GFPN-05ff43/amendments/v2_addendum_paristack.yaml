    PS-4_repaired_gate_and_regression:
      gate: >-
        The repaired gate is the r1 images of the four v2 gate packages, in the
        same order, with the same driver_args, content and requires chain:
        - G1: F-1..F-3 fixture, n = m = 3, p' = 4111;
        - G2: F-1..F-3 fixture, n = m = 3, p' = 16777291;
        - G3: jv_anchor_system_trace_identity, p' = 16777291;
        - G4: frozen controls.
        RUN-GFPN-ac4487 is NOT a gate member. It stays a valid, archived pass
        under the v2 code and the frozen wrapper, and it is REG-1's reference.
      regression_REG-1: >-
        G1 must reproduce RUN-GFPN-ac4487 on its deterministic content. The
        fixture streams are keyed by fixed labels, not run ids
        ('2026092001:v2:fixture:<p>:fresh' / ':planted',
        '2026092002:v2:fixture:<p>:basepoint', the build and grid streams;
        v2_driver.py lines 309 and 316; RUN-GFPN-ac4487 manifest lines
        70-75), and group orders are unique, so an unchanged pipeline yields
        the same bytes. Before comparing, the checker verifies every
        RUN-GFPN-ac4487 file it reads against the TASK-20260923-0fa03f
        post-run receipt path_sha256; a mismatch is fatal. Compared:
        (a) every retained solver input under solver/ (*.ms): same file set,
            byte-identical;
        (b) from raw-result.json: the D table per target and arm; the
            structure checks; F-2(a); the F-2(b) tables; F-3; the group order
            (69477519282); the rescaling (beta, lam, b_is_square_in_Fq); every
            fresh target's k and x_R; the planted targets;
            replaced_fresh_targets; certificate and verified counts: equal;
        (c) every certificate file: same file set, equal as JSON after
            removing only the fields declared non-deterministic under (e);
        (d) solver outputs (*.ms.out): byte-identical, unless (e) declares
            with a reason that msolve output carries non-deterministic
            content, in which case the parsed solution sets and D are
            compared;
        (e) the EXCLUSION LIST is declared in implementation-v2-r1.md in stage
            R1, before any repaired run, by reading RUN-GFPN-ac4487's archived
            bytes and the v2 code. Each entry carries its reason. Timestamps,
            wall and cpu seconds, rusage, pids, absolute paths, host readings
            and run-id, task-id and protocol-version labels may be excluded.
            The list may NEVER exclude k, x_R, relation, beta, lam, u_values,
            relation_mod_T, D, solutions, verified or lifted_points.
        REG-1 is evaluated by the r1 wrapper before it admits G2. Its outcome
        and the sha256 of the exclusion list are recorded in the manifest of
        G2 and of every later package (manifest gate.regression_REG-1). The
        execution report quotes the comparator output verbatim.
      gate_pass_rule: >-
        A gate_required r1 package, and every repaired addendum package, runs
        only when G1-G4 each have run_status completed_valid with gate_pass
        true (as the unchanged v2 driver records it) AND REG-1 passed.
        Repaired addendum packages 2-11 additionally require the image of
        controls_a1 completed_valid with gate_pass true.
      failure_reading: >-
        - A failure of G1-G4 ends stage R2 at the gate, with no post-gate and
          no addendum package. It is classified per DEC-20260923-e788a1 AC-5,
          unchanged: a mismatch confined to raw_u = 384 or S3_rescaled = 64 is
          "implementation or derivation"; anything else is an infrastructure
          or implementation signal.
        - A REG-1 failure ends stage R2 at the gate before G2. It is read as
          "the repair layer is not behaviour-neutral at 4111, or the pipeline
          is non-deterministic", naming both, and never as a result.
        - Neither is ever a mathematical result about the quotient. The
          repair of a repair is a successor task under a new Coordinator
          decision.
        - No contingency id is ever used for a gate package (contingency_rule
          unchanged).

    PS-5_wrapper_manifest_checker:
      refusals: >-
        The r1 wrapper reads each package's command from the committed r1
        plan, evaluates EVERY check below before creating any directory, and
        refuses (exit 2, nothing written, every failing reason printed)
        unless all hold. It has a --dry-run mode that evaluates the checks
        only.
        R-1  hashes: the v2 amendment (e02d4976...d3), the v2-a1 addendum
             (2c5e0524...0c) and this addendum (the value Act 4's decision
             binds) match.
        R-2  the run id is reserved in the r1 plan the package belongs to,
             and is none of: a v1 id, any of the 31 v2 ids, any of the 11
             v2-a1 ids.
        R-3  runs/<id> does not exist.
        R-4  implementation-v2/, implementation-v2.md and trial-plan-v2.json
             match the TASK-20260923-0fa03f phase-A receipt file by file, are
             tracked and clean, with no unbound file.
        R-5  implementation-v2-a1/, implementation-v2-a1.md and
             trial-plan-v2-a1.json match the TASK-20260923-4ff597 phase-A
             receipt file by file, are tracked and clean, with no unbound
             file.
        R-6  implementation-v2-r1/, implementation-v2-r1.md and both r1 plans
             match the repair archive's phase-A receipt file by file, are
             tracked and clean, with no unbound file.
        R-7  the PS-4 gate_pass_rule, for every gate_required repaired v2
             package and every repaired addendum package; REG-1 before G2.
        R-8  every package this one `requires` has a manifest.
        R-9  the plan's watchdogs object equals trial-plan-v2.json's exactly.
        R-10 no other solver-like process is running (v2_solver.other_solver_processes).
        R-11 the PS-3 ceiling.
        R-12 contingency_rule verbatim (trial-plan-v2.json line 185), within
             one r1 plan: --replaces names a planned, non-contingency,
             non-blocking package of the same plan whose manifest records
             failure_class infrastructure_error, not replaced before. Never a
             gate package; never across plans.
        R-13 the plan records its protocol_version label, this addendum's id
             and sha256, and its run card; neither TASK-20260923-cd932c nor
             TASK-20260923-6c7f55 appears in it as a task id.
      launch_rule: >-
        Each package is launched directly through the r1 wrapper, with no
        outer guard (no shell `timeout`, no wrapper around the wrapper) that
        is not declared in the plan (CORR-20260923-fb1be8 XD-2). A
        machine-protection guard of the dispatching session is declared in
        the task receipt before launch, with its threshold.
      manifest: >-
        Each r1 manifest records, as the v2 and v2-a1 manifests do, plus:
        - task_id (the r1 run card), protocol_version ("2-r1" or "2-a1-r1"),
          and the amendment blocks for v2, v2-a1 (addendum packages) and this
          addendum, each with id, sha256 and approval decision;
        - `derived_from`: the retired id whose place this package takes in
          the plan;
        - code.phase_a_commits, LITERALLY, each with its source (receipt
          commit_sha if backfilled, else git log -1 of the receipt): the
          TASK-20260923-0fa03f phase-A commit fb4597b2014b44a0c9528d48d3ab9997b46f038c,
          the repair archive's phase-A commit and, for addendum packages, the
          TASK-20260923-4ff597 phase-A commit
          36c3b0d2e05878a8df1209b5048f8ce14515c27f (CORR-20260923-fb1be8
          XD-1);
        - clean flags for all three implementation trees;
        - resources.pari_stack: the branch (P-A or P-B), the configured
          values, the read-backs at start and at exit, driver VmHWM and VmRSS
          at exit, and under P-B the gp child's getrlimit read-back;
        - gate.regression_REG-1 (from G2 on);
        - child RLIMIT_AS read back with getrlimit, threads executed, host
          RAM and swap, watchdogs and their equality with trial-plan-v2.json's;
        - dependency versions, with cypari2's version read through
          importlib.metadata (the v2 wrapper recorded '', RUN-GFPN-3377f1
          manifest line 59);
        - the inference block (requested policy, resolved binding as the
          session provides it, fallback_used). No model id is invented.
      checker: >-
        The r1 completion-gate checker:
        - runs v2_check_run's checks unchanged on repaired v2 packages, and
          a1_check_run's checks unchanged on repaired addendum packages, with
          plan paths redirected in-process;
        - adds: the r1 manifest fields above; a resources.pari_stack block
          whose read-backs equal the configured values in every package whose
          command reaches an in-process PARI call per DV-1 (P-A), or whose gp
          child read back 10737418240 (P-B); no file of any r1 package
          carries TASK-20260923-cd932c or TASK-20260923-6c7f55 as a task id;
          gate.regression_REG-1 recorded from G2 on;
        - is the REG-1 comparator (PS-4).

    PS-6_development_checks:
      rules: >-
        Stage R1 only. Development checks create no run package, report no
        number as a result, and are listed in implementation-v2-r1.md as
        development notes, with outputs in the session scratchpad. Each runs
        under AC-1 (10 GiB child cap read back with getrlimit, driver RSS at
        most 1 GiB, one memory-heavy process at a time, msolve -t 1) on a
        quiet machine. No ladder cell, build, fixture system or anchor system
        is solved at any ladder or fixture prime. Group-order computations of
        the fixture curves ARE required (DV-2); they are parameters, not
        results.
      DV-1_inventory: >-
        A static and dynamic inventory of EVERY PARI use reachable from every
        driver command that either r1 plan invokes (v2: fixture,
        anchor-identity, controls, fixture4, build, cells, aggregate; v2-a1:
        controls-a1, build, cells, aggregate-a1), in-process or in a child,
        each with its file:line, its process (driver in-process or capped
        child), and every (p', field degree, curve) at which the r1 plans
        will reach it.
        - Static: a search of implementation-v2/, implementation-v2-a1/ and
          the layer, plus the call graph from each command.
        - Dynamic: a trace of the toy integration (DV-7) recording every
          PARI entry, used only in the development harness, never in a
          delivered entry point.
        The list is compared with this addendum's three call sites (defect
        call_sites_found_by_this_act). Any addition is covered by DV-2. It
        must be established that no in-process PARI call is reached at a
        ladder prime (262151, 16777291 or 1073741831 at n = 5); if one is,
        DV-2 covers it at that exact point.
        Child-side PARI uses (a1_pari's gp; the Sage comparator run by the
        anchor-identity command, if it uses PARI) are listed with the stack
        configuration they run under, read from the code or from a
        no-computation start-up probe in a capped child. A child-side use left
        at a library default at its declared parameters is FLAGGED to the
        Coordinator in the note. It is not fixed here (out of scope) and does
        not by itself stop stage R1.
      DV-2_coverage_under_the_fix: >-
        For EVERY in-process PARI call of DV-1, at EVERY (p', degree, curve)
        it will meet in the r1 plans -- at least:
        - (4111, n = 3, the fixture_n3(4111) curve);
        - (16777291, n = 3, the fixture_n3(16777291) curve);
        - (4111, n = 4, the fixture_n4 curve);
        in a FRESH process that runs the layer's own configuration code
        exactly as an entry point does, call the UNCHANGED
        v2_common.curve_order_pari (P-A), or its P-B replacement, on the
        objects built by the unchanged v2_common.fixture_n3 / fixture_n4.
        Record: N; whether [N]G = O for the basepoint stream the package uses
        (v2_driver.py lines 309 and 543); the read-backs before and after;
        VmHWM and VmRSS after; wall time. Repeat once in a second fresh
        process.
        PASS iff every call returns, [N]G = O, the read-backs equal the
        configured values, VmHWM <= 805306368 B, both repetitions agree, and N
        at (4111, n = 3) equals 69477519282 (RUN-GFPN-ac4487).
      DV-3_negative_control: >-
        In a fresh process WITHOUT the layer's configuration, call the
        unchanged v2_common.curve_order_pari at (16777291, n = 3) on the
        fixture curve. It must reproduce the RUN-GFPN-3377f1 overflow
        ("ellcard: the PARI stack overflows", stderr.log line 20). Record the
        sizes reported. If it does NOT reproduce, the defect is not confirmed
        on this host: stage R1 STOPS and returns, because the fix's effect
        could not be demonstrated.
      DV-4_driver_envelope: >-
        After each DV-2 call, read the driver RSS with the same function the
        v2 code uses before a child launch (v2_solver), and confirm it is
        below 1073741824 B, in addition to DV-2's VmHWM bound.
      DV-5_plan_derivation: >-
        Both r1 plans: the canonical-JSON equality of PS-3 after the inverse
        id_map and removal of the declared metadata keys; watchdogs identical
        to trial-plan-v2.json's; 31 and 11 ids; no old id anywhere except in
        id_map, the never-reused lists and retired_ids; no forbidden task id;
        the plan writer regenerates both files byte-identically.
      DV-6_wrapper_refusals: >-
        Dry-runs, each refused with its expected reason, exit 2 and nothing
        written: R-1 (altered copies); R-2 with RUN-GFPN-ac4487,
        RUN-GFPN-3377f1, one retired planned v2 id, one retired v2
        contingency id, one v2-a1 id, one v1 id and an unreserved id; R-3;
        R-4, R-5 and R-6 (receipt mismatch and dirty tree, simulated
        in-process as implementation-v2-a1.md X-4 did); R-7 (gate not run,
        gate failed, REG-1 failed on a synthetic pair, controls_a1 image not
        passed); R-8; R-9; R-10 (simulated scan); R-11 (synthetic run
        directories at the ceiling); R-12 (contingency on a gate package,
        across plans, on a non-infrastructure class, twice); R-13; and an
        entry point whose PARI read-back does not match.
      DV-7_toy_integration: >-
        The layer end to end on a toy ladder with plans, ladder and runs
        redirected to scratch (precedents: v2 DN-8; implementation-v2-a1.md
        section 9 (a)): every driver command the r1 plans invoke, through the
        entry points and the r1 wrapper, or a recorded reason why a command
        cannot be exercised at toy scale; the r1 checker on every toy
        package; REG-1 on two toy runs of the same toy package (must pass)
        and on a copy with one deterministic field perturbed (must fail).
      DV-8_REG-1_exclusion_list: >-
        The PS-4 (e) exclusion list, with reasons. The comparator is run on
        RUN-GFPN-ac4487 against itself (must pass) and against a scratch copy
        with one deterministic field perturbed in each of (a)-(d) (each must
        fail).
      DV-9_no_edit: >-
        sha256 baselines taken before any write and re-taken after the last
        check: implementation-v2/, implementation-v2.md, trial-plan-v2.json
        (equal to the TASK-20260923-0fa03f phase-A receipt);
        implementation-v2-a1/, implementation-v2-a1.md, trial-plan-v2-a1.json
        (equal to the TASK-20260923-4ff597 phase-A receipt); implementation/
        including ladder.json; the specification; all amendment files; both
        existing run packages. All byte-identical. No byte code is written
        under any frozen tree (-B and PYTHONDONTWRITEBYTECODE=1).
      DV-10_ids: >-
        The 42 ids, each checked as a bare id with `--check`, and none in the
        v1, v2 or v2-a1 lists.

    PS-7_acceptance_conditions:
      AR-1_stage_R1: >-
        Stage R1 is complete, and phase A of the repair archive may run, only
        if:
        - DV-1 to DV-10 pass, with DV-3 reproducing the overflow;
        - P-A passes DV-2 at every point, OR the P-B trigger is met with its
          recorded evidence and P-B passes DV-2 at every point;
        - no frozen byte changed and no run package exists;
        - the four PS-2 paths exist, and implementation-v2-r1.md records: the
          branch; the values and the API; every read-back; the redirection
          list with old and new values; the REG-1 exclusion list; the DV-1
          inventory with any flags; every DV outcome; the id maps and the
          retirement lists.
      AR-2_gate: PS-4 gate_pass_rule, evaluated by the r1 wrapper.
      AR-3_every_package: >-
        The r1 checker passes on every package, or the package is recorded
        with the checker's failure verbatim and is not read as evidence. A
        certificate that fails re-verification makes its package invalid.
      AR-4_completion: >-
        The completion gates of TASK-20260923-cd932c (lines 329-339) and
        TASK-20260923-6c7f55, read through the id maps and the r1 labels:
        every planned cell ends in a terminal row; the controls are
        discharged at every prime; F3 is reported undecidable; the norm
        control carries order 3840; every accepted decomposition has a
        verified certificate; at most 44 packages exist in the lineage; each
        execution report classifies every package per agents/executor.md and
        states no supported or refuted conclusion.

    PS-8_sequencing:
      replaces: DEC-20260923-8b2dbf AA-2 SQ-5 to SQ-9
      text: >-
        NORMATIVE. Archives run alone. RS-3, RS-5 and RS-7 never overlap each
        other or any other solver-running process on the host (EC-10; AC-6).
        Each producer runs under a claimed lane, released on return.
        RS-0  DONE. SQ-5: stage 2 of TASK-20260923-cd932c ran and failed at
              the gate (RUN-GFPN-3377f1). SQ-6: phase B of
              TASK-20260923-0fa03f, commit f9188ae34.
        RS-1  This draft, with DEC-20260923-c1fb69, is archived ALONE by
              TASK-20260923-e830a0, verified and pushed. The dispatching
              session then appends the queue revision DEC-20260923-c1fb69
              authorizes, and runs tools/research_dispatch.py and
              tools/validate_dispatch_reference.py on it.
        RS-2  Act 4 (reserved TASK-20260923-b2ab1b) decides this draft on its
              ARCHIVED bytes, binding the sha256 from TASK-20260923-e830a0's
              receipt, as DEC-20260923-80e280. If approved, it writes the
              stage-R1 card (reserved TASK-20260923-a681f9), the two-phase
              repair archive (reserved TASK-20260923-b53550: phase A the
              stage-R1 paths, phase B the stage-R2 run packages and
              execution-report-v2-r1.yaml), the stage-R2 card (reserved
              TASK-20260923-3aa31e), and, as proposed, the stage-R2b card
              (spare TASK-20260923-292052) and its snapshot archive (spare
              TASK-20260923-befe48). It opens the repair batch (proposed
              BATCH-e409ca) with a validated queue that declares the successor
              review chain, and cancels BATCH-6b1c29's review-chain
              placeholders in the same revision. It checkpoints the goal and
              is ledger-archived by reserved TASK-20260923-8d9ccb.
        RS-3  Stage R1: implement the layer, write both r1 plans, run DV-1 to
              DV-10. Zero run packages.
        RS-4  Phase A of the repair archive binds the stage-R1 paths by
              sha256. Verified and pushed. Both r1 plans, and so the whole
              repaired run set, are fixed here, before any repaired
              measurement.
        RS-5  Stage R2: G1, then REG-1, then G2, G3, G4; only if the repaired
              gate passes, the 23 post-gate repaired v2 packages in plan
              order. execution-report-v2-r1.yaml on any outcome.
        RS-6  Phase B of the repair archive binds the stage-R2 run packages
              and the report. Verified and pushed.
        RS-7  Stage R2b: the repaired addendum packages in plan order, reading
              the repaired v2 packages from their phase-B bytes. Launched only
              if the repaired gate passed; otherwise a Coordinator decision
              records them not_attempted with the reason.
              execution-report-v2-a1-r1.yaml on any outcome.
        RS-8  The stage-R2b archive binds its run packages and report.
        RS-9  The review plan is written FIRST, with its recorded prior,
              covering execution-report-v2.yaml, execution-report-v2-r1.yaml,
              execution-report-v2-a1-r1.yaml, implementation-v2-a1/ and
              implementation-v2-r1/. It owns the joints of
              DEC-20260923-e788a1, DEC-20260923-034ba0 and DEC-20260923-8b2dbf
              AA-7, plus the repair joints:
              RJ-1 the PS-1 branch, its values and every read-back;
              RJ-2 REG-1 and its exclusion list;
              RJ-3 plan derivation and the id maps;
              RJ-4 the addendum re-pointing, including aggregate_a1 reading
                   the repaired v2 bytes from the repair archive.
              Independent validator and red-team review follow, then the
              evidence review.
      why_this_order: >-
        - Both r1 plans are fixed and hash-bound before any repaired package
          runs, so the repaired run set is chosen blind to repaired outcomes.
        - The v2-a1 run set was already fixed before any v2 measurement
          (DEC-20260923-034ba0 R-5); the a1-r1 plan changes only its ids and
          gate pointer, so that property is kept.
        - REG-1 runs before any spend at 16777291.
        - aggregate_a1 needs the repaired v2 cell bytes archived before it
          runs, so stage R2b follows phase B.

    PS-9_failure_handling:
      - DV-3 does not reproduce the overflow -> stage R1 STOPS and returns; new decision.
      - P-A fails DV-2 on a non-trigger condition, or P-B also fails -> stage R1 STOPS and returns; new decision.
      - The drivers cannot run from the r1 plans without a frozen-byte edit or a further function replacement -> stage R1 STOPS and returns.
      - Any repaired gate failure or REG-1 failure -> stage R2 ends at the gate (PS-4 failure_reading); no post-gate or addendum package; new decision.
