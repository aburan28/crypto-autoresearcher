  # ---------------------------------------------------------------------------
  # THE DEFECT
  # ---------------------------------------------------------------------------
  defect:
    id: D-PS-1
    statement: >-
      implementation-v2/v2_common.py curve_order_pari (lines 249-261) computes
      #E(F_q) by PARI ellcard through `cypari2.Pari()` (line 253) IN THE
      DRIVER PROCESS. Nothing in implementation-v2/ configures PARI's stack
      (no allocatemem, parisize or parisizemax; this act's search and the
      Executor's grep, execution-report-v2.yaml lines 76-82). At GF(4111^3)
      the call completes (RUN-GFPN-ac4487, order 69477519282,
      execution-report-v2.yaml line 100). At GF(16777291^3) it raises
      "PariError: ellcard: the PARI stack overflows (current size: 8003584;
      maximum size: 8003584)" (RUN-GFPN-3377f1 stderr.log lines 1-20), before
      any build, solve or capped child.
    call_sites_found_by_this_act: >-
      Three, all in v2_driver.py, all reaching v2_common.curve_order_pari:
      - line 308, fixture_core, reached from cmd_fixture (line 279) at
        p' = 4111 and p' = 16777291, n = 3 (gate packages 1 and 2);
      - line 542, cmd_fixture4, n = 4 fixture field (post-gate F-4 package);
      - line 771, cmd_controls, fixture_n3(4111) (line 764), n = 3 (gate
        package 4).
      No other use of PARI was found in implementation-v2/ (search for
      `cypari2|pari|ellcard|gp `). v2-a1 uses PARI only through /usr/bin/gp in
      a capped child (implementation-v2-a1/a1_pari.py lines 36-39, 87-96).
      DV-1 re-establishes this inventory; it does not rely on this act's
      search.
    class: >-
      implementation_error (CORR-20260923-bb8fa5): a resource-configuration
      defect of the implementation, deterministic at GF(16777291^3). Never
      evidence about D.
    consequence_for_the_frozen_wrappers: >-
      - v2_run_wrapper.py W-6 (lines 115-123) admits a gate_required package
        only when every id in trial-plan-v2.json gate.blocking_packages
        (lines 70-76) is completed_valid with gate_pass true. RUN-GFPN-3377f1
        is permanently failed, and W-3 (lines 100-102) and line 141 forbid
        re-running any gate package. No gate_required v2 package can run.
      - a1_run_wrapper.py A-6 (lines 20-22, 168-174) requires the same four
        v2 ids through a1_common.V2_GATE_PACKAGES (a1_common.py line 62). No
        gate_required addendum package can run.
      - Every v2 and v2-a1 path is frozen and archive-bound (phase A of
        TASK-20260923-0fa03f; phase A of TASK-20260923-4ff597).
      A new layer with new plans and ids is therefore the only additive route.

