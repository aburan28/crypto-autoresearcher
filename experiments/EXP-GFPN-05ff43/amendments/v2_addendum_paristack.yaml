# =============================================================================
# AMD-EXP-GFPN-05ff43-20260923-paristack  --  DRAFT, NOT APPROVED
#
# An ADDITIVE engineering-repair addendum to EXP-GFPN-05ff43 protocol v2
# (the frozen specification read with AMD-EXP-GFPN-05ff43-20260923-reanchor-arm-iii,
# sha256 e02d4976a5e773b9eee95aa4c376d6154e9c0a9da4e6c6118ed58748054924d3,
# approved with AC-1..AC-6 by DEC-20260923-e788a1) and to its addendum
# AMD-EXP-GFPN-05ff43-20260923-rung31 (sha256
# 2c5e052468e37111023dd116706149fb05d691e7188e26ae1e2c069bad792d0c, approved
# with AA-1..AA-8 by DEC-20260923-8b2dbf). Written under the Coordinator ruling
# act TASK-20260923-6b492f (DEC-20260923-c1fb69), AFTER the v2 gate failed and
# BEFORE any repaired package exists.
#
# WHY. The v2 blocking gate failed at RUN-GFPN-3377f1 (F-1..F-3 fixture at
# p' = 16777291): PARI ellcard over GF(16777291^3), called IN-PROCESS in the
# uncapped driver, overflowed a PARI stack whose ceiling nothing in
# implementation-v2/ configures (8003584 bytes). No D was computed. Under the
# frozen v2 and v2-a1 wrappers no gate_required package can ever run again,
# because both hard-require the v2 gate ids, one of which is a permanent
# failure (v2_run_wrapper.py lines 115-123 and 141; a1_run_wrapper.py lines
# 20-22 and 168-174).
#
# WHAT. Exactly one fix -- a PARI stack configuration for the in-process
# cypari2 calls (primary branch P-A), or, only on a named infrastructure
# trigger, the same calls moved into a capped gp child (fallback P-B) -- plus a
# new wrapper/plan layer that runs the UNCHANGED v2 and v2-a1 drivers with that
# fix and with the redirection needed to read new plans and new run ids. The
# gate is re-run in full under new ids, with a byte-level regression of the
# 4111 fixture against RUN-GFPN-ac4487. Nothing else changes.
#
# WHAT IT IS NOT: approved, evidence, a prediction, a hypothesis status move,
# or a security statement about EcGFp5 or EcMasFp5. It changes no byte of the
# frozen specification, either amendment, implementation/, implementation-v2/,
# implementation-v2.md, trial-plan-v2.json, implementation-v2-a1/,
# implementation-v2-a1.md or trial-plan-v2-a1.json.
# Approval is a later, separate Coordinator decision (reserved:
# DEC-20260923-80e280 under TASK-20260923-b2ab1b). That decision reads the
# ARCHIVED bytes of this file (snapshot TASK-20260923-e830a0).
# =============================================================================
