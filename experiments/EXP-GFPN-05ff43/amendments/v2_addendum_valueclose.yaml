  changes:
    VC-1_value_level_dispositions_added:
      amends: consumercover CC-2 (additive; one OUTSIDE clause narrowed)
      text: >-
        NORMATIVE. Added to CC-2. DERIVED, in CC-2 and here, includes
        CONTROL-DEPENDENT derivation: a value written under a test that reads
        a site value, or a value derived from one, is derived from it. Every
        disposition below is REACHABILITY-INDEPENDENT.

        (a) S-1 AND S-2: CLASS gamma, THE APPROVED WRAPPER BODIES. Added to the
            class rule as a second permitted exception, beside the frozen
            solve() / run_system() bodies. The body of the SE-3 wrapper and the
            body of the HR-3 wrapper, and the functions they call to implement
            their approved rules, ARE the approved mechanism. They read every
            attempt's result, recorded or not, test the SSF signature,
            check consistency and spacing, rename and hash attempt files, and
            write the event record. In the preserved r2 layer these are
            r2_resolve.solve (lines 203-280), _attempt_record (158-167),
            _consistency (170-184), _rename (187-199), _write (132-148),
            log_text, ssf_clause, _call_original and _wait_spacing. In r3 they
            are the functions DV-11's static consumer inventory (VC-3) lists
            with class gamma. Disposition: SE-2 (1)-(7) as amended by SF-1,
            SF-2 and SF-3 (K = 5), SC-11, HR-1..HR-8, and consumercover CC-4 /
            launchcover CG-3 recording, as approved or incorporated. A
            function inside a wrapper that does anything those rules do not
            prescribe is NOT gamma.

        (b) S-1 AND S-2: VALUE CLASS epsilon, THE EVENT RECORD. The SE-2 event
            record and every value derived from it, by data or control
            dependence:
            - the run-root solver-events.json (its events, attempt records,
              counters, consistency flag and violations, renamed_files,
              resolve_cap_reached, final_* fields) and the HR-3 wrapper's
              equivalent record;
            - the manifest block solver_events (K, spacing, counters, sha256,
              watchdog_after_resolve) and its S-3 extension (consumercover
              CC-4);
            - REG-1's listing, hashing and quotation of solver-events.json and
              of the renamed attempt files <tag>.ms.*.ssf-attempt<k> (SE-4
              (e));
            - the renamed attempt files themselves, their sha256 and sizes;
            - the SE-2 (4) / SF-2 (b) consistency raise, and the package
              failure it causes;
            - the per-package and per-cell event tables of each execution
              report (SE-2 (7), SF-2 (e)).
            ANY consumer. Disposition: SE-2 (4), (5) and (7), SF-2 (b), (c) and
            (e), SE-4 (e) and SC-11, as approved. A reader with effect E1-E4
            reads it only as a consistency, integrity, spacing or reporting
            check. Its failure is implementation_error (SE-2 (4)) or a REG-1
            failure (SE-4 (e)), never evidence about D, and it never selects
            among attempts' D values (SE-2 (4)). No r3 consumer outside
            gamma, and no consumer outside the r2 / r3 wrapper, checker or
            REG-1 functions, may use an epsilon value to choose a recorded
            result.

        (c) S-1 AND S-2: THE OUTSIDE CLAUSE, NARROWED. Consumercover lines
            330-333 are replaced by: "A consumer that is neither gamma nor a
            reader of an epsilon value, and that reads a renamed attempt file
            or a non-recorded attempt's result, is OUTSIDE the class rule. A
            consumer that reads a site field from outside the wrapper while a
            wrapped call is in progress is OUTSIDE the class rule." Nothing
            else in the class rule changes: alpha, beta and the frozen-body
            exception stand as written.

        (d) S-3: ROW K-6 under V-1.
            K-6 a1_driver.phase_b_check (a1_driver.py lines 257-273; the hash
                at line 268) and its use by cmd_aggregate_a1 (lines 282-298,
                371-375): a whole-file sha256 of every v2 raw-result.json the
                aggregate reads (which carry V-1 through the K-4 copies) and
                of the v2 aggregate, compared with the phase-B archive receipt
                (RC-8); its status sets data_ok, run_status and failure_class,
                and is recorded as v2_bytes_phase_B_check. Effect E1 / E2.
                Disposition: V-7.

        (e) S-3: VALUE V-7, INTEGRITY HASHES OF FILES CARRYING S-3 DATA. Every
            sha256 or byte comparison of a WHOLE file, or of a file set, that
            carries a V-1..V-6 value, against a recorded hash of the SAME
            file (an archive receipt, a manifest or plan field, a claim
            release), and every value derived from its result. ANY consumer.
            Disposition: an INTEGRITY CHECK, as frozen. It is invariant to
            every field value the file carries: it fails only if the bytes
            changed after they were recorded. A failure is an integrity or
            infrastructure outcome under the frozen rules (for aggregate_a1:
            run_status invalid or failed, failure_class invalid_measurement
            or infrastructure_error, a1_driver.py lines 371-373). It is never
            evidence about D, never read as a callgrind outcome or as a CC-3
            envelope outcome, and never a reason to re-run anything to obtain
            a pass. V-7 includes REG-1's verification of the RUN-GFPN-ac4487
            reference files against the TASK-20260923-0fa03f post-run receipt
            (SE-4; r2_reg1 Reader.read, r2_reg1.py line 124, which the census
            labels E5).
            A comparison of a file's CONTENT with a different file's content,
            or of fields, is NOT V-7; it stays under K-1..K-6 or is NOT
            COVERED.

        (f) Unchanged: every other value, class and row of CC-2, V-2..V-6 and
            their "ANY consumer" dispositions, alpha, beta and the frozen-body
            exception, and the EXPECTATION sentence (consumercover lines
            379-381), now read over K-1..K-6 and V-1..V-7.

