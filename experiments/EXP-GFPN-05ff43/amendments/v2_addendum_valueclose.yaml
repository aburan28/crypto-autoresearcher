    VC-3_DV-11_static_consumer_check_extended:
      amends: consumercover CC-5 (lines 426-441)
      text: >-
        Added to DV-11's STATIC part:
        - The r3 consumer inventory FOLLOWS CONTROL DEPENDENCE to a fixpoint:
          every branch whose test reads a site value or a derived value, and
          every statement it governs that sets an E1-E4 output, is listed.
        - Each listed r3 function carries exactly one of: alpha, beta,
          frozen-body, gamma, epsilon, or a V-1..V-7 value and row.
        - Every function listed as gamma is named with the approved rule
          clause (SE-2 (n), SF-n, SC-11 (x), HR-n, CG-3 / CC-4) it implements.
        STOP (SE-9, extended, as CC-5): an r3 consumer with effect E1-E4 that
        CC-2 with VC-1 does not cover; a gamma function doing anything its
        named clause does not prescribe; an r3 consumer that uses an epsilon
