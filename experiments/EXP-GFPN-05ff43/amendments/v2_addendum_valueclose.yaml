#
# The SUCCESSOR REMEDY that DEC-20260924-e6638d orders under CU-2 (b) and (c)
# of the DRAFT AMD-EXP-GFPN-05ff43-20260924-consumercover (sha256
# a900d757980b379c301393d51bde008847f5280fd0b6ac237ae1f67efce4eee0, archived
# by TASK-20260924-a28f0e). That draft is NOT approvable as written.
#
# It is an ADDITIVE addendum to EXP-GFPN-05ff43 protocols 2-r2 and 2-a1-r2
# (seedresolve, approved with SC-1..SC-11 by DEC-20260924-15a77a). ALL of the
# consumercover text is INCORPORATED BY REFERENCE at its bound sha256, which
# itself incorporates launchcover (c27ffe5c...f447) and, through it,
# healthresolve (ccb55334...291a70d). Only what is ADDED is written here.
# Nothing in consumercover is removed or narrowed, except one OUTSIDE clause
# that this draft narrows (VC-1 (c)).
#
# WHY. The archived consumer census (TASK-20260924-5dfbfd, snapshot
# TASK-20260924-ad3f9a) found no reader of an already-disposed value. It found
# two classes of value that consumercover never disposed of at value level:
# - V-1 was disposed of per DIRECT CONSUMER (K-1..K-5). A whole-file integrity
#   hash of v2 raw-result.json files (a1_driver.phase_b_check line 268, gating
#   cmd_aggregate_a1 lines 371-373) is a fifth kind of direct consumer.
# - The S-1 class rule gave the approved SE-3 wrapper's own body, and the SE-2
#   event record it writes, no class. Nine reads inside r2_resolve.py and the
#   SE-4 / SC-11 hash check r2_check_run.py line 213 are therefore OUTSIDE.
# CORR-20260924-838ff2 records the presumption. This draft adds value-level
# dispositions for exactly those values, so that any reader of them, found or
# not, is covered by construction.
#
# WHY NO NEW CENSUS. This draft changes no code, no scanned file and no
# consumer set, and it removes no disposition. So every consumer the archived
# census enumerated keeps the class or coverage the census gave it, and the
# 14 it did not cover are named here row by row. Its approval act decides it
# on the ARCHIVED census bytes (VR-2). DEC-20260924-e6638d
# no_new_census_ruling records the reasoning.
#
# WHAT IT IS NOT: approved, evidence, a prediction, a hypothesis status move,
# or a security statement about EcGFp5 or EcMasFp5. It changes no msolve,
# valgrind or callgrind_annotate binary, flag or argv; no REG-1 item or
# exclusion; no frozen wrapper, checker or comparator; no health-check seed,
# pattern, expected D or pass predicate; no DV-17 predicate, R or reference;
# and no byte of any frozen file, draft, preserved r2 output, census or
# premise check. Approval is a later, separate Coordinator decision (reserved
# DEC-20260924-e52eec under reserved TASK-20260924-20444a), which reads the
# ARCHIVED bytes of this file (snapshot TASK-20260924-4de205) and of the
# consumer census (snapshot TASK-20260924-ad3f9a).
# =============================================================================
