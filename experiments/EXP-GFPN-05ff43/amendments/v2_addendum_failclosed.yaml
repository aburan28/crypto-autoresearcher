# =============================================================================
# AMD-EXP-GFPN-05ff43-20260924-failclosed  --  DRAFT, NOT APPROVED
#
# The SUCCESSOR DRAFT that DEC-20260924-8fa3d4 orders after the DRAFT
# AMD-EXP-GFPN-05ff43-20260924-readbackclose (sha256
# f949951aca1ab011848048f7735b10d10413dd339e11046089b6f151aec4a48c) was
# decided NOT APPROVABLE AS WRITTEN under its own readings, applied to the
# close census TASK-20260924-e8da78 (snapshot TASK-20260924-71d070):
# - RKR-1 (b): RK-1 as worded records child_created FALSE for a created child
#   on P-16 (a raise at v2_solver.py 181 after fork() created the child and
#   before `pid` is bound) and on P-F2 after P-14a or P-16 (a raise in
#   _run_child_locked after fork, then a raise from lk.release() in run_child's
#   finally; the final traceback lacks the _run_child_locked frame).
# - RKR-6 (c): controls and controls-a1 write the run id into every
#   certificate (v2_driver 252 -> v2_lift 220). And DV-18 as worded cannot run:
#   in-process redirection does not reach the entry and checker child
#   processes (the r3 checks used shims RK-4 (a) never names), and the REG-1
#   NOT_EVALUABLE block fails the r3 REG-1 check item in development.
# - RKR-3 / RKR-4 (b) are left undecided on W-2 (not outcome-determinative);
#   PASS_ZL as worded also admits W-1, a wrapper-recorded infrastructure
#   failure.
#
# THIS IS A CHANGE OF APPROACH, NOT A SIXTH PATCH. Six drafts of this lineage
# (healthresolve, launchcover, consumercover, readbackcover, readbackfull,
# readbackclose) each failed a pre-declared EXACT-COVERAGE reading on a path,
# site or consumer that the next, finer census enumerated; the one approved
# draft (valueclose) failed at its gate on a recording gap. Implicit raise
# points have no finest granularity (any allocation can raise; asynchronous
# exceptions arrive at bytecode boundaries), so another exact-coverage reading
# would predictably fail again. This draft:
# (1) makes every r4 recording and verdict rule FAIL-CLOSED BY POSITIVE
#     EVIDENCE: a value not established from a named positive record is
#     `undetermined`, and `undetermined` can only produce FAIL and a designed
#     stop (RF-0..RF-3);
# (2) makes its readings MONOTONE: only a FAIL-OPEN counterexample or a
#     PLANNED-BASIS REFUSAL bars approval; a path on which the rules FAIL or
#     say `undetermined` is never a bar and never orders another census;
# (3) is checked before approval by an INDEPENDENT ZERO-RUN RED-TEAM REVIEW
#     that searches for fail-open counterexamples, with a known-answer control,
#     not by a sixth census (TASK-20260924-f5631b, archived by
#     TASK-20260924-0c2fdc);
# (4) moves the remaining uncertainty to the r4 stage's development checks on
#     the DELIVERED code (DV-18 as extended by RF-6).
#
# It is an ADDITIVE addendum. It INCORPORATES readbackclose in full (RK-1..RK-7,
# and through it readbackfull RL-1..RL-8, readbackcover RB-1..RB-8, valueclose
# with VA-1..VA-12 and everything they incorporate), UNCHANGED, except what
# RF-0..RF-8 replace or add. Only what is replaced or added is written here.
#
# WHAT IT IS NOT: approved, evidence, a prediction, a hypothesis status move, a
# security statement, or a change to any frozen byte, msolve / valgrind /
# callgrind_annotate / gp / Sage binary, flag or argv, REG-1 item or exclusion,
# K, spacing, SF-2 (c) / HR-6 cap, DV-17 predicate, health-check seed, pattern,
# expected D or pass predicate, watchdog, envelope value, arm, cell, stream or
# reading rule. Approval is a later, separate Coordinator decision (reserved
# DEC-20260924-844896 under reserved TASK-20260924-64c8fe, ledger archive
# reserved TASK-20260924-5816cd), which reads the ARCHIVED bytes of this file
# (addendum_sha256 in TASK-20260924-eb2540's receipt) and of the red-team
# review (TASK-20260924-f5631b, snapshot TASK-20260924-0c2fdc).
# =============================================================================
