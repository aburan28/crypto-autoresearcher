  pre_approval_readings:
    definitions: >-
      CAPPED CHILD, PATH, CHILD CREATED and PAIR READ BY PARENT as readbackclose
      defines them (lines 522-535). A CHILD THAT MAY HAVE EXECUTED ARGV: a
      created or possibly created child whose launch record is not class (A)
      or (C) of RF-3 (a). FAIL-OPEN: a package outcome, a path or a rule by
      which a package receives PASS or PASS_ZL, or a dependant is admitted,
      while (i) a pair the parent read (line 227 executed) is in no launch
      record, (ii) a child that may have executed argv has no recorded pair
      equal to the cap, (iii) a created or possibly created child is recorded
      child_created false, (iv) a record written in a process other than the
      installing one goes undetected, or (v) the outcome is wrapper-recorded.
      FAIL-CLOSED FINDING: a path or outcome on which these rules yield
      `undetermined`, FAIL or a stop. PLANNED BASIS OUTCOME: a driver-logic
      outcome (RF-0 (b)) that a dependant's frozen logic acts on. THE REVIEW:
      the zero-run red-team review TASK-20260924-f5631b as archived by
      TASK-20260924-0c2fdc. THE CENSUSES: TASK-20260924-e8da78 (archived by
      TASK-20260924-71d070), TASK-20260924-cab04e (TASK-20260924-ddfb69) and
      TASK-20260924-bf5724 (TASK-20260924-a01341).
    RFR-5_integrity:
      order: 1
      text: >-
        APPLIED FIRST. The approval act waits (no reading is applied) if any
        of these fails, as recorded in the archive receipts: this draft's
        bytes equal the addendum_sha256 in TASK-20260924-eb2540's receipt;
        readbackclose equals
        f949951aca1ab011848048f7735b10d10413dd339e11046089b6f151aec4a48c,
