  options_weighed:
    FA_sixth_patch_and_census: >-
      REJECTED. It would add a clause for P-16 and P-F2 and order a finer
      census. RFF-1 shows six successive exact-coverage readings failing on
      the next finer enumeration; L-11 shows the enumeration has no floor.
    FB_fail_closed_and_adversarial_review: >-
      ADOPTED. The property the science needs (AC-1: no package is a basis
      for anything unless every capped child that may have executed argv has
      its cap read-back recorded; otherwise stop) is monotone. It is met by
      rules that are exact on the normal paths (RKR-1 (a) holds on every path
      on which 227 executed) and FAIL everywhere else. A reviewer searching
      for fail-open counterexamples tests exactly that property; a new path
      that only yields FAIL cannot break it.
    FC_waive_the_65-67_item: >-
      REJECTED. It would rest the cap on the frozen code's inference instead
      of a record, the waiver DEC-20260924-1ce186 R-1 refused.
    FD_new_frozen_implementation_v3: >-
      REJECTED NOW. Changing the frozen commands to write per-child records
      would need a new protocol version and new REG-1 reference, and the
      defect found is in the approval readings and the development world,
      not in what the frozen code records on normal paths. REVISIT if the
      review finds a fail-open case the r4 layer cannot close.
    FE_close_the_lane: >-
