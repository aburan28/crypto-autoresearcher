  method_limits_declared:
    RFL-1: Grandchildren are not examined (RKL-1); a capped child's own children inherit its RLIMIT_AS by the kernel.
    RFL-2: >-
      A created child left waiting for the go byte when the parent raises
      before 236 is released when the parent process exits and then execs
      argv only after its own cap check (v2_solver.py 197-201): an inference
      from frozen code (RKL-2). Its package has already failed.
    RFL-3: Which path occurs is a run-time fact; every path here is static (RKL-3).
    RFL-4: >-
      RF-1 relies on documented interpreter behaviour for the host's Python
      (3.11, per the census run records): implicit exception chaining through
      __context__, frame locals reachable from a traceback until it is
      released, and tb_lineno. DV-18 (f) (vi)-(xiii) show it on the frozen
      function. Where the behaviour differs, RF-1 yields `undetermined` or
      FAIL, never a favourable value.
    RFL-5: >-
      On the fork-child path P-C the escaped child continues the caller's
      program without RLIMIT_AS until it exits; RF-1 (b) records that it
      happened (and fails the package) but does not stop it. That behaviour
      belongs to the frozen code and is not changed here.
    RFL-6: >-
      Class (C) rests on an inference from frozen, hash-bound code: a child
      that writes no "OK" report never reaches exec.
    RFL-7: >-
      O-2 (a lock held after an asynchronous raise at 167-170) makes later
      launches of the same process refuse before fork; the package has
      already failed. Not changed here.

