  findings_carried:
    RFF-1_non_convergence: >-
      Six drafts of this lineage each failed a pre-declared exact-coverage
      reading on a newly enumerated path, site or consumer:
      healthresolve CN-1 (DEC-20260924-afdc3b), launchcover LP-1 / LP-2 (iv)
      (DEC-20260924-a7453e), consumercover CU-2 (DEC-20260924-e6638d),
      readbackcover RBR-1 (DEC-20260924-650068), readbackfull RLR-1 and RLR-4
      (b) (DEC-20260924-a789e1), readbackclose RKR-1 (b) (DEC-20260924-8fa3d4).
      The granularity of the enumeration grew each round (launch sites,
      consumers, children, branches, raise points, bytecode boundaries and
      the fork-child path: close census md 190-236), and the close census
      declares that its interpreter behaviour is taken from documentation and
      compiled bytecode (L-11). There is no finest granularity at which an
      exact-coverage reading is known to close.
    RFF-2_raise_paths_end_in_a_failed_package: >-
      No frozen handler between v2_solver.run_child and the driver's entry
      point catches an exception on the frozen command paths read so far:
      v2_driver.main (1329-1348) has none, and the frozen driver catches only
      OSError at 145, 174 and 212. A raise leaving run_child ends the driver
      without a driver-written raw-result.json, and the r3 wrapper then records
      the package failed (infrastructure_error, or implementation_error on a
      consistency violation; r3_run_wrapper.py 483-509). So on every raise
      path the census found, record exactness never decided a verdict. Whether
      any r3 / r4 layer between run_child and the driver (the SE-3 and HR-3
      wrappers, P-B, the recorder), or any frozen a1 module (a1_driver,
      a1_health, a1_pari, whose handlers DEC-20260924-8fa3d4 did not read),
      catches such an exception is NOT established here and is a review joint
      (J-2).
    RFF-3_wrapper_recorded_outcomes: >-
      Close census RKR-3 and RKR-4 (b) (md 377-429, 476-492): W-1 (the driver
      exits or raises before any launch; the wrapper writes raw-result.json)
      receives PASS_ZL under RK-3 (b) as worded, which reads no run_status and
      no raw writer; W-2 (the entry refuses before any command) is FAIL with no
      infrastructure launch. On a W-1 or W-2 m = 5 package the m = 4
      package's _condition_met reads "no m = 5 cell" (v2_driver.py 1121-1122)
      and does not attempt its conditional arms, so admitting W-1 would let an
      infrastructure failure steer the frozen sequencing. The same holds, by
      DEC-20260924-8fa3d4's reading of the census rows (md 382, 385-396, 707;
      not a census result), for a package whose driver died after a launch
      whose pair was read: its raise-frame record makes the frozen item at
      66-67 pass and RK-3 (b) as worded gives PASS.
    RFF-4_development_world: >-
      Close census RKR-6 (md 552-692): launch reads info set by preflight
      (a); the REG-1 NOT_EVALUABLE block makes the r3 REG-1 check item
      (r3_check_run 327-330) fail on a development package (a); R-10 and an
      r4 analogue of R-6 can refuse outside RK-4 (a)'s list (b; L-14); the
      development label reaches raw-result.json (finish, v2_driver 78) and
      every certificate of controls and controls-a1 (v2_driver 252 -> v2_lift
      220) (c); in-process redirection does not reach the entry and checker
      child processes, which the r3 checks reached by shims replacing
      W.ENTRY_V2 / W.ENTRY_A1, K.FROZEN_LAUNCHER and W.git_tree_state and
      re-applying R3_TOY_CFG in the child (d; N-1, N-4).
    RFF-5_X-13: >-
      a1_check_run 79-84 reads the controls_a1 image's run_status and
      gate_pass (a checker item), named by neither RB-4 nor RK-3 (a) (close
      census md 468).
    RFF-6_observations: >-
      O-1 (`rec` unbound at 152), O-2 (an asynchronous raise at 167-170 can
      leave the host lock held until the SolverLock object is collected), O-3
      (a raise at 226-227 leaves an "OK soft hard" report with no pair read),
      O-4 (the fork-child path P-C: an asynchronous exception in the child
      before 183 leaves the frozen functions IN THE CHILD, which continues in
      the caller's frames without RLIMIT_AS) (close census md 208-236).

  changes:
    RF-0_fail_closed_principle:
      amends: every r4 recording and verdict rule of readbackcover, readbackfull and readbackclose (interpretive; additive)
      text: >-
        NORMATIVE.
        (a) POSITIVE EVIDENCE. Every r4 recorded value that feeds a verdict or
            an admission is either established from a positive record that the
            rule defining it names, or recorded as the literal `undetermined`.
            No r4 rule infers a favourable value from the absence of a record.
        (b) OUTCOME CLASSES. The r4 wrapper records, in every manifest,
            raw_result_writer: "driver" if raw-result.json exists and parses
            after the driver exits (written by the frozen command's finish());
            "wrapper" if the wrapper writes the fallback raw-result.json (as
            r3_run_wrapper.py 491-505 does, the close census's W-1 and W-2);
            `undetermined` otherwise (for example an unparseable file, as
            r3_run_wrapper.py 486-489). A DRIVER-LOGIC OUTCOME has
            raw_result_writer "driver". A WRAPPER-RECORDED OUTCOME has
            "wrapper". Only a driver-logic outcome can be a planned basis
            outcome.
        (c) MONOTONICITY. An `undetermined` value in any verdict or admission
            input yields FAIL. No r4 rule turns a missing, absent or
            `undetermined` value into PASS, PASS_ZL or an admission.
        (d) STOP. A FAIL of a package that a dependant reads or requires
            (every package except F-4 under RK-3 (d)) refuses the dependant as
            RL-4 words it, WHATEVER THE CAUSE: a designed stop for a new
            Coordinator decision, which may rule an R-12 contingency. It is
            never evidence and never a finding about D.
        (e) RECORD EXACTNESS on a package whose verdict is FAIL is best
            effort: recorded with its basis, never a bar to this draft, and
            never a reason to change a package verdict.
    RF-1_three_valued_child_created_and_process_identity:
      amends: readbackclose RK-1 (b) (replaces its child_created sentence), RK-2 (classes; additive)
      text: >-
        NORMATIVE.
        (a) ON RAISE, child_created is THREE-VALUED. The recorder examines, as
            RK-1 (b) does and read-only, the raised exception AND every
            exception reachable from it through __context__ and __cause__,
            each at most once and at most 16 in all (a longer chain or a cycle
            makes child_created `undetermined`); on each one's traceback it
            finds the frames whose code object IS the captured frozen
            run_child (first line 149) or _run_child_locked (first line 177).
            - true: the outermost frozen run_child frame's `rec` carries the
              key child_rlimit_report (key presence, any value), OR any frozen
              _run_child_locked frame on any traceback of the chain holds a
              local `pid` that is an int greater than 0;
            - false: ONLY IF `rec` is bound and lacks child_rlimit_report, or
              `rec` is unbound (a raise at 152 before it is stored; O-1), AND
              every frozen _run_child_locked frame on the chain has a traceback
              line (tb_lineno) below 181 and holds no `pid`, or there is none.
              Basis: the frozen function calls os.fork only at line 181 and
              binds `pid` only there (close census md 138-152), so a chain with no _run_child_locked frame at
              or after 181 and no report key positively excludes a fork;
            - `undetermined`: in every other case, in particular a frozen
              _run_child_locked frame at line 181 with no `pid` (P-16, and a
              failing fork alike), frame_inspection "not_found", or the chain
              limit.
            Everything else in RK-1 (b) is unchanged (the pair and report
            copied from `rec` where present; raised, raise_site, pid,
            readback_from "raise_frame_record"; no assignment, call or
            retained reference). When `rec` is unbound the record says
            rec "unbound". frame_inspection "not_found" stays an SE-2 (4)
            consistency violation.
        (b) PROCESS IDENTITY. At install the recorder stores the installing
            process id. If a recorder call ends (returns or re-raises) in a
            process other than the installing one (the fork-child path P-C,
            O-4), the recorder writes NO launch record; it writes, in that
            process, the file recorder-foreign-<pid>.json in the run root,
            carrying the installing pid, its own pid and the raised type (or
            null), and then returns or re-raises unchanged. It takes no other
            action there: it does not exit, signal or wait. Any such file
            makes the package's verdict FAIL (RF-3 (a)).
        (c) RK-2's per-launch classes gain: under (ii), "OK report, pair not
            read" (a raise at v2_solver.py 226-227; O-3); and a new (iv), every
            launch record whose child_created is `undetermined`. Recorded and
            reported; RF-3 reads them.
        (d) RK-1 (a), (c) and (d) are unchanged: the recorder RECORDS ONLY.
    RF-2_PASS_ZL_positive_evidence:
      amends: readbackclose RK-3 (b) (PASS_ZL; narrowing only)
      text: >-
        NORMATIVE. PASS_ZL requires RK-3 (b) (i)-(v) AND:
        (vi) raw_result_writer "driver" (RF-0 (b)): PASS_ZL never applies to a
             wrapper-recorded outcome (W-1, W-2), whose verdict is FAIL and
             whose dependants stop under RF-0 (d);
        (vii) the package kind is cells or fixture4, or a contingency package
             replacing one of them (the kinds for which the close census found
             driver-logic zero-call outcomes: Z-C5, Z-F4; md 377-383);
        (viii) no recorder-foreign file (RF-1 (b)) exists in the package.
        RK-3 (b) (iv)'s "EXACTLY ONE failing item ... and nothing else" reads
        as: the frozen checker's list of failing item lines, excluding its
        header line and, for an a1 package, the a1 checker's summary lines, is
        exactly the one line "no child RLIMIT_AS read-back recorded" (the
        output shapes the close census records, md 368-375). This is a
        narrowing statement of the output shape and adds no tolerance.
    RF-3_PASS_positive_child_classes_and_designed_stops:
      amends: readbackclose RK-3 (b) (PASS; narrowing only) and RK-3 (c) (replaced)
      text: >-
        NORMATIVE.
        (a) PASS additionally requires that EVERY launch record of the package
            is one of these positive classes:
            (A) child_created false, raised null: a refusal before fork,
                returned (v2_solver.py 153-169), recorded as the frozen driver
                records refused_to_start;
            (B) child_created true, raised null, pair_read_by_parent true: its
                pair is collected and compared with the cap by the frozen
                checker (v2_check_run.py 68-70), as every collected entry is;
            (C) child_created true, raised null, pair_read_by_parent false,
                the returned record carrying child_rlimit_report that is the
