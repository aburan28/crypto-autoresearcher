# =============================================================================
# AMD-EXP-GFPN-05ff43-20260923-rung31  --  DRAFT, NOT APPROVED
#
# An ADDITIVE addendum to protocol v2 of EXP-GFPN-05ff43. Protocol v2 is the
# frozen specification read with AMD-EXP-GFPN-05ff43-20260923-reanchor-arm-iii
# (sha256 e02d4976a5e773b9eee95aa4c376d6154e9c0a9da4e6c6118ed58748054924d3),
# approved with conditions AC-1..AC-6 by DEC-20260923-e788a1. This addendum is
# written BEFORE ANY v2 RUN PACKAGE EXISTS, under the Coordinator ruling act
# TASK-20260923-242cd0 (DEC-20260923-034ba0).
#
# WHY. The v2 ladder's EcGFp5-shaped curve at p' = 16777291 is not double-odd:
# order 4 * prime, b a square (CORR-20260923-6b3df2; CORR-20260923-52e096).
# Arm iii' (torsion_S5_rq) refuses there by design. On the frozen primary
# shape, v2 as approved therefore reaches only 13 and 19 bits, so
# HEUR-GFPN-DFLAT for every arm on that shape is not evaluable.
#
# WHAT. It ADDS the pre-selected, spec-conformant 31-bit rung p' = 1073741831
# of the frozen v1 ladder (ladder.json role "ladder", EcGFp5-shaped curve
# c = 372, order 2 * prime, b a non-square). At that rung it adds the SAME cell
# set that v2 runs at every ladder prime. It labels the c = 59 rows at
# 16777291 as off-shape. It declares the HEUR-GFPN-DFLAT evaluation set for
# every (arm, shape). It names new paths and development checks. It carries
# one pre-declared fallback (FB-1), triggered only by a named infrastructure
# condition.
#
# WHAT IT IS NOT: approved, evidence, a prediction, a hypothesis status move,
# or a security statement about EcGFp5 or EcMasFp5. It changes nothing in the
# frozen specification, the v2 amendment, DEC-20260923-e788a1,
# implementation-v2/, implementation-v2.md or trial-plan-v2.json.
# Approval is a later, separate Coordinator decision (reserved:
# DEC-20260923-8b2dbf under TASK-20260923-33484e). That decision reads the
# ARCHIVED bytes of this file (snapshot TASK-20260923-2e741f).
# =============================================================================
