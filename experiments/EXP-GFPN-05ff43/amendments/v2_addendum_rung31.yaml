  # ---------------------------------------------------------------------------
  # THE CHANGE
  # ---------------------------------------------------------------------------
  change:

    A1-1_added_rung_and_cells:
      rung: >-
        p' = 1073741831. It is 31 bits (ladder.json "p_bits": 31, line 442),
        with field F_{p'}[z]/(z^5 - 2) (line 443) and seed stream
        random.Random('2026092002:ladder:1073741831') (line 444). Its role in
        the frozen ladder is "ladder" (line 549). It is the "2^30 if FGLM
        completes" candidate that the frozen toy_ladder rule names
        (specification lines 90-98).
      curves: >-
        Exactly the three curves recorded in ladder.json for this rung. No new
        curve is selected.
        - ecgfp5_shaped: y^2 = x(x^2 + 2x + 372z) (line 447). Order
          1427247739228940340121025971786582198224700022 = 2 * prime,
          cofactor 2 (lines 462-463). b_is_square_in_Fq false (line 459).
          The order is 2 mod 4, so the curve is DOUBLE-ODD and inside the
          frozen primary shape (specification lines 100-103).
        - random_2torsion: cofactor 2 (line 497), b_is_square_in_Fq false
          (line 510).
        - random_no2torsion: cofactor 3 (line 533), no rational 2-torsion
          (line 514).
      cells: >-
        THE SAME CELL SET that trial-plan-v2.json enumerates for each of its
        ladder primes, with the same dispositions, conditions and refusals.
        The one difference is that no KI-1 refusal is expected, because b is
        a non-square here. Per shape:
        - m = 5, ecgfp5_shaped and random_2torsion:
          - torsion_S5_rq: run;
          - S5: run;
          - S5_rescaled: run, unconditionally (implementation-v2.md D2-4);
          - torsion_S5_norm: run only where S5 is measured in the same
            package (labelled negative control, group order 3840);
          - raw: not_attempted, for the DC-7 A-6 reason, verbatim as in
            trial-plan-v2.json.
        - m = 5, random_no2torsion:
          - S5: run;
          - torsion_S5_rq, S5_rescaled and torsion_S5_norm: recorded refusal,
            "no rational 2-torsion" (R-6, R-9);
          - raw: not_attempted, as above.
        - m = 4, every shape:
          - raw: run, unconditionally (R-9);
          - S4, S4_rescaled, torsion_S4_rq and torsion_S4_norm: run only if
            the matching m = 5 cell ran and measured no target
            (implementation-v2.md D2-13);
          - the refusals on random_no2torsion are recorded as in v2.
        targets_per_cell 20, random known-scalar targets.
      targets_and_parameters: >-
        - Target stream: random.Random('2026092001:v2:targets:1073741831:<shape>').
          This is v2's own pattern, keyed by (p', shape). No v1 or v2 stream
          has used p' = 1073741831. Stage 1b confirms this and records it.
        - (beta, lam) is fixed per (curve, p') before any target is drawn, by
          v2's rule: beta is the smallest non-square mod p'; lam = sqrt(b/beta)
          with the lexicographically smaller coefficient vector
          (implementation-v2.md section 2.2).
        - The construction and sample streams follow v2's pattern with
          p' = 1073741831.
      envelope: >-
        IDENTICAL TO v2. It comprises:
        - AC-1: RLIMIT_AS = 10737418240 set in the child and read back with
          getrlimit; driver RSS no more than 1 GiB; one memory-heavy process
          at a time; task envelope 11 GiB; msolve -t 1;
        - the A-6 envelope tuple on every not_measured row;
        - the A-7 pre-declared early stop;
        - every per-(arm, m) watchdog, builder timeout and callgrind timeout
          copied VERBATIM from trial-plan-v2.json lines 95-177, with the same
          callgrind scope (target 0 of every m <= 4 cell; m = 5 not_measured
          with the declared reason). The addendum wrapper REFUSES any package
          whose watchdog values differ from trial-plan-v2.json's (AC-6
          uniformity).

    A1-2_packages_and_count:
      packages: >-
        Written by stage 1b to trial-plan-v2-a1.json, in this order, each with
        a RUN-GFPN-* id minted by `python3 tools/allocate_id.py --next run
        --area GFPN` and confirmed with `--check`:
        1. controls_a1 (BLOCKING for the addendum):
           (a) known_scalar_instances independent recheck at p' = 1073741831,
               for all three shapes;
           (b) PARI ellcard recheck of the three orders against ladder.json,
               with the double-odd facts recorded for ecgfp5_shaped and
               random_2torsion: order mod 4 = 2, cofactor 2, and b non-square
               by the norm criterion;
           (c) (beta, lam) recorded for both 2-torsion shapes; the rq refusal
               on random_no2torsion;
           (d) the msolve characteristic check on the synthetic systems of
               A1-7 (b);
           (e) planted m < n instrument checks of the lifting path for
               torsion_S3_rq and S3_rescaled on the 31-bit ecgfp5_shaped curve
               (n = 5), each certificate passing the independent verifier.
               These are never degree evidence;
           (f) the single-flip and held-out checks on each polynomial it
               builds.
        2. build p' = 1073741831: m = 5 and m = 4, all shapes, refusal rows.
           The build list is identical to v2's per-prime build package
           (for example RUN-GFPN-3db273).
        3. cells p' = 1073741831, ecgfp5_shaped, m = 5.
        4. cells p' = 1073741831, random_2torsion, m = 5.
        5. cells p' = 1073741831, random_no2torsion, m = 5.
        6. cells p' = 1073741831, ecgfp5_shaped, m = 4.
        7. cells p' = 1073741831, random_2torsion, m = 4.
        8. cells p' = 1073741831, random_no2torsion, m = 4.
        9. aggregate_a1 (A1-5).
        10. contingency a1-1.
        11. contingency a1-2.
      count: >-
        11 packages: 9 planned plus 2 contingency. 31 + 11 = 42, within the
        48 ceiling (DC-7 A-7), which leaves 6 unreserved. The contingency ids
        follow trial-plan-v2.json's contingency_rule (line 185) verbatim, and
        they apply to addendum packages only. v2's four contingency ids apply
        to v2 packages only.
      gates: >-
        - controls_a1 runs only after all four v2 gate packages
          (RUN-GFPN-ac4487, RUN-GFPN-3377f1, RUN-GFPN-76420e and
          RUN-GFPN-b231c1) have run_status completed_valid and gate_pass true.
        - Packages 2-9 additionally require controls_a1 completed_valid with
          gate_pass true.
        - A controls_a1 failure ends the addendum's run at its gate. Its
          remaining packages are recorded not_attempted with the reason. The
          failure is an infrastructure or implementation signal, never a
          result. The repair is a successor task under a new Coordinator
          decision.
        - If the v2 gate fails, no addendum package runs (AC-5).

    A1-3_heur_dflat_evaluation_sets:
      rule: >-
        For each (arm, shape) there is a declared set S of rungs. A rung
        counts only if its m = 5 random cell has a defined cell D (D2-7).
        - An ELIGIBLE triple is any 3 rungs of S whose bit lengths span
          >= 12 bits, computed as in v2_scoring.py line 157.
        - heur_dflat_pass is TRUE iff at least one eligible triple has D at
          all three rungs and EVERY such triple has relative variation below
          the threshold, using v2_scoring.heur_dflat's definition and
          threshold unchanged.
        - It is FALSE iff any such triple fails.
        - It is not_applicable iff no eligible triple has D at all three
          rungs.
        - The output records the triples evaluated, the triples that could
          not be evaluated, and v2_scoring.heur_dflat applied to all measured
          rungs of S, labelled "all-points figure, descriptive".
        When S has exactly three rungs, this rule and v2_scoring.heur_dflat
        give the same verdict.
      sets:
        ecgfp5_shaped_primary: >-
          S = {4111, 262151, 1073741831} for torsion_S5_rq, S5, S5_rescaled
          and torsion_S5_norm. That is 13, 19 and 31 bits: a span of 18, with
          one eligible triple. The off-shape curve at 16777291 is NOT in S.
          raw: not_applicable (m = 5 not_attempted by design; A-6).
        random_2torsion: >-
          S = {4111, 262151, 16777291, 1073741831} for torsion_S5_rq, S5,
          S5_rescaled and torsion_S5_norm. The four eligible triples are
          {13,19,25}, {13,19,31}, {13,25,31} and {19,25,31} bits. v2's own
          triple is one of them. raw: not_applicable.
        random_no2torsion: >-
          S = {4111, 262151, 16777291, 1073741831} for S5. torsion_S5_rq,
          S5_rescaled and torsion_S5_norm are not_applicable (recorded
          refusals). raw: not_applicable.
        off_shape_non_double_odd: >-
          NOT EVALUATED. The (16777291, ecgfp5_shaped, c = 59) rows form no
          set and yield no verdict.
      under_FB-1: >-
        ecgfp5_shaped_primary S = {4111, 262151, 16777291/c_fb1}, where
        c_fb1 is the curve FB-1 selects: 13, 19 and 25 bits, a span of 12.
        The control sets are v2's {4111, 262151, 16777291}.
      band: >-
        The B-3 band for an arm on the primary shape is emitted only if that
        arm's primary-shape heur_dflat_pass is TRUE under this section. It is
        computed by v2_scoring.band_for_arm unchanged, and fed only with
        primary-shape rows of S. R-8 reasons apply unchanged:
        heur_dflat_not_applicable is never relabelled heur_dflat_failed.

    A1-4_off_shape_labelling:
      text: >-
        Every v2 row on (p' = 16777291, curve_shape ecgfp5_shaped) is read as
        `off_shape_non_double_odd`. That curve is y^2 = x(x^2 + 2x + 59z), with
        order 4 * prime and b a square (CORR-20260923-6b3df2). The rows are
        found in:
        - RUN-GFPN-3db273: its ecgfp5_shaped build and refusal rows;
        - RUN-GFPN-3be8a4 and RUN-GFPN-36cad2: every row;
        - RUN-GFPN-b231c1: its known-scalar recheck row at (16777291,
          ecgfp5_shaped). That row stays a valid gate check, because it tests
          group-law arithmetic, not a shape property;
        - RUN-GFPN-8f86cc: every figure that uses any of the rows above.
        Rules:
        (1) The rows run as planned and are recorded as produced. They are
            never deleted, re-run to replace them, or re-labelled in their
            bytes, because implementation-v2/ is frozen after phase A.
        (2) They are NOT primary-shape rows. They enter no primary-shape
            HEUR-GFPN-DFLAT set, no T-1, T-2, T-3, F1 or F1' score, no F4
            primary-vs-control comparison, and no B-3 band.
        (3) The `b-square class mismatch` refusals of torsion_S5_rq and
            S5_rescaled there are recorded refusals of the construction's
            precondition. They are never evidence about D or about the
            quotient.
        (4) The rows may be reported in a separately headed descriptive
            section: "EcGFp5-model curve with b a square, not double-odd;
            nearby object; no verdict".
        (5) Any v2 aggregate figure that uses them is "as-planned (v2);
            includes an off-shape rung". For the primary shape it is
            superseded FOR READING by aggregate_a1. It is never overwritten.
        The same label applies to the v1 rows that CORR-20260923-6b3df2 lists.

    A1-5_aggregate_a1_and_its_relation_to_the_v2_aggregate:
      text: >-
        aggregate_a1 is a separate package. It reads, read-only:
        - the v2 cell packages at 4111, 262151 and 16777291, from their
          phase-B-archived bytes (TASK-20260923-0fa03f);
        - the v2 aggregate RUN-GFPN-8f86cc;
        - the addendum packages.
        It never edits or supersedes any v2 manifest. It emits:
        (i) PRIMARY-SHAPE READING. For every arm on ecgfp5_shaped over
            {4111, 262151, 1073741831}: cell D per rung; T-1, T-2 and T-3 as
            v2 defines them (like-for-like only; thresholds at m = 5 only,
            D2-2); F1 and F1'; HEUR-GFPN-DFLAT per A1-3; the B-3 band per
            A1-3.
        (ii) CONTROL READING. HEUR-GFPN-DFLAT per A1-3 for random_2torsion
            and random_no2torsion. F4 matched comparisons (named shape
            against random_2torsion, same prime, same arm) at each primary
            rung: 4111, 262151 and 1073741831.
        (iii) OFF-SHAPE DESCRIPTIVE SECTION for (16777291, ecgfp5_shaped,
            c = 59), per A1-4 (4).
        (iv) RECONCILIATION. Every figure of RUN-GFPN-8f86cc is reproduced
            and labelled "as-planned (v2)". A figure that uses an off-shape
            row is marked "includes off-shape rung; not read for the primary
            shape". For the controls, v2's three-rung DFLAT figure is shown
            as one of the eligible triples.
        (v) Every planned v2 and addendum cell, with its terminal row, and
            any planned cell that has no row (R-2).
        The evidence-review decision reads (i) to (iii) from aggregate_a1.
        It cites RUN-GFPN-8f86cc as the as-planned record. If the addendum
        packages do not run or do not complete, (i) reports the primary-shape
        verdicts from the rows that exist. A1-3 then yields not_applicable
        wherever no eligible triple is measured. The v2 aggregate's
        primary-shape figures stay "includes off-shape rung; not read".

    A1-6_paths:
      stage_1b_writes: >-
        Written by TASK-20260923-4c64b5 (stage 1b: implement, do not run):
        - experiments/EXP-GFPN-05ff43/implementation-v2-a1/
        - experiments/EXP-GFPN-05ff43/implementation-v2-a1.md
        - experiments/EXP-GFPN-05ff43/trial-plan-v2-a1.json
        No run package is written by stage 1b.
      stage_2b_writes: >-
        Written by TASK-20260923-6c7f55 (stage 2b: run the addendum packages):
        - experiments/EXP-GFPN-05ff43/runs/<each RUN-GFPN-* id reserved in trial-plan-v2-a1.json>/
        - experiments/EXP-GFPN-05ff43/execution-report-v2-a1.yaml
      archive: >-
        TASK-20260923-4ff597, in two receipted phases:
        - phase A archives the stage-1b paths before any addendum run;
        - phase B archives the stage-2b paths before independent review.
      read_only: >-
        Every v1 and v2 path listed in does_not_rewrite. Every v2 run package.

    A1-7_stage_1b_requirements_and_development_checks:
      implementation: >-
        (1) ADDITIVE ONLY. No byte under implementation-v2/, and no byte of
            implementation-v2.md, trial-plan-v2.json, implementation/ or
            ladder.json, is changed. The addendum code may import the v2
            modules read-only, and may set module-level paths inside its own
            process (for example, which plan file is read). If stage 1b finds
            that the addendum cannot run without editing a v2 file, it STOPS
            and returns the reason. It never edits.
        (2) The addendum wrapper refuses unless all of the following hold:
            - the run id is reserved in trial-plan-v2-a1.json and is neither
              a v1 nor a v2 id;
            - implementation-v2/, implementation-v2.md and trial-plan-v2.json
              match the phase-A receipt of TASK-20260923-0fa03f and are clean;
            - implementation-v2-a1/, implementation-v2-a1.md and
              trial-plan-v2-a1.json are committed (phase A of
              TASK-20260923-4ff597) and clean;
            - the gates of A1-2 hold;
            - its predecessors have manifests;
            - its watchdog values equal trial-plan-v2.json's.
        (3) Every addendum manifest records, as the v2 manifests do:
            - task id TASK-20260923-6c7f55;
            - protocol_version "2-a1";
            - this addendum's id and sha256;
            - both phase-A commits;
            - both clean-tree flags;
            - the child RLIMIT_AS read back with getrlimit;
            - threads executed;
            - host RAM and swap;
            - the inference block (requested policy, resolved binding as the
              session provides it, fallback_used). No model id is invented.
        (4) The addendum completion-gate checker applies v2_check_run's
            checks. It adds checks for the addendum fields, the A1-4 label
            on every aggregate_a1 row it applies to, and the A1-3 triple
            accounting.
      development_checks: >-
        Development checks create no run package, report no number as a
        result, and are listed in implementation-v2-a1.md as development
        notes. Each runs under AC-1 (10 GiB child cap, one process at a time,
        msolve -t 1), with outputs in the session scratchpad.
        (a) Toy-ladder integration of the addendum driver, wrapper and
            aggregate, with the plan, ladder and runs redirected to scratch
            (as v2 DN-8). This includes the A1-3 triple logic on synthetic
            inputs, with 3 and 4 rungs, and the A1-4 labels.
        (b) MSOLVE CHARACTERISTIC CHECK at p' = 1073741831. msolve 0.6.5 runs
            with -t 1 and the same flags the v2 solver uses for cells. It
            solves two SYNTHETIC zero-dimensional systems with known degree,
            drawn from random.Random('2026092001:v2a1:health:1073741831'):
            dense systems in 3 variables of degrees (2,2,2) and (4,4,4),
            whose expected degrees are 8 and 64. The check parses the
            parametrisation and substitutes every solution.
            - Pass: exit 0, the dimension parsed as 0, D equal to the
              expected value, and every substitution passing.
            - On a mismatch, it retries once on a second seeded system (the
              seed string with the suffix ':2'), to separate a non-generic
              draw from a solver fault.
            No ladder curve, cell system or fixture system is solved at any
            prime.
        (c) PARI ellcard recheck of the three 31-bit ladder orders, and the
            norm-criterion class of b, as parameter verification.
        (d) The flint and pure-Python independent-verifier arithmetic at a
            31-bit characteristic, on synthetic planted relations (as v2
            DN-7). No solver is used.
        (e) Wrapper refusal dry-runs: unreserved ids, v1 ids, v2 ids,
            watchdog mismatch, and uncommitted trees.
        (f) Confirmation that no v1 or v2 stream key uses p' = 1073741831.

    A1-8_sequencing:
      text: >-
        The order is NORMATIVE. Archives run alone. No two solver-running
        steps overlap (EC-10; AC-6).
        (1) Phase A of TASK-20260923-0fa03f binds the 14 stage-1 paths as at
            filing commit 689716be5. The post-commit verifier accepts it, and
            it is pushed.
        (2) This addendum is approved, or not, by the separate decision
            DEC-20260923-8b2dbf. That decision is archived by
            TASK-20260923-58a958 and pushed.
        (3) Stage 1b (TASK-20260923-4c64b5) runs under a claimed lane
            (DEC-20260923-034ba0 ruling DP-3). It writes the A1-6 paths and
            runs the A1-7 development checks. It creates no run package.
        (4) Phase A of TASK-20260923-4ff597 binds the stage-1b paths by
            sha256. It is verified and pushed.
        (5) Stage 2 of TASK-20260923-cd932c runs under a claimed lane, as
            trial-plan-v2.json defines it, unchanged.
        (6) Phase B of TASK-20260923-0fa03f binds the v2 run packages and
            execution-report-v2.yaml. It is verified and pushed.
        (7) Stage 2b (TASK-20260923-6c7f55) runs under a claimed lane. It
            runs the addendum packages in trial-plan-v2-a1.json order,
            reading the v2 packages from their phase-B bytes.
        (8) Phase B of TASK-20260923-4ff597 binds the addendum packages and
            execution-report-v2-a1.yaml. It is verified and pushed.
        (9) The review_plan is written FIRST, with its recorded prior. It
            covers both reports. Independent validator and red-team review
            follow (DEC-20260923-e788a1 next_actions).
        Why stage 1b precedes stage 2:
        - the whole v2-a1 run set is then fixed and archived before any v2
          measurement exists;
        - the stage-1b executor sees no v2 outcome;
        - its solver-running development check (b) cannot overlap stage 2.
        If the addendum is not approved at (2), stage 2 waits for the
        Coordinator's disposition. That disposition names a successor remedy,
        or records that v2 runs alone and gives the reason.

    A1-9_fallback_FB-1:
      trigger: >-
        ONLY this infrastructure condition: development check A1-7 (b) fails
        at p' = 1073741831 on both seeded systems, AND stage 1b attributes the
        failure to the solver rather than to the addendum's own code. The
        solver-side evidence is a crash or signal, a refused characteristic,
        unparseable output, or a degree mismatch reproduced on the second
        system. The msolve stderr and exit status are recorded in the
        development notes. A failure in the addendum's own code is fixed
        within stage 1b and does not trigger FB-1. No measurement of any
        ladder object bears on the trigger.
      effect: >-
        Stage 1b writes the FB-1 plan instead of the 31-bit plan, and
        records the trigger evidence.
        - Rung: p' = 16777291, in the same field F_{p'}[z]/(z^5 - 2) as
          ladder.json line 334.
        - Curve c_fb1: y^2 = x(x^2 + 2x + c z) for the SMALLEST integer
          c >= 1 such that PARI ellcard gives order N = 2q with q proved
          prime (PARI isprime), and b = c z is a non-square by the norm
          criterion.
        - Recording: every c tried is logged with its outcome in
          experiments/EXP-GFPN-05ff43/implementation-v2-a1/ladder-a1.json.
          ladder.json is not changed.
        - Target stream: random.Random('2026092001:v2a1:targets:16777291:ecgfp5_shaped_fb1').
        - Packages:
          - controls_a1, restricted to c_fb1 (checks (a) to (c), (e) and (f)
            of A1-2, with (d) run at 16777291);
          - a build of c_fb1 only;
          - cells for c_fb1 at m = 5 and at m = 4;
          - aggregate_a1;
          - 2 contingency ids.
          That is 7 packages, 38 in total.
        - Matched controls at 16777291 are v2's random_2torsion and
          random_no2torsion rows. They are not re-run.
        - A1-3 applies with its under_FB-1 sets.
        The v2 c = 59 rows stay off-shape under A1-4.
      not_a_result: >-
        Neither the trigger nor FB-1 is evidence about any degree. A 31-bit
        solver fault is an infrastructure fact about msolve 0.6.5 on this
        host.

