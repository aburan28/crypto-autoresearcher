             (HR-1..HR-8).
        S-3  implementation-v2/v2_driver.py line 209 -> v2_solver.py lines
             516-517 (callgrind child: valgrind running the msolve argv).
             CLASSIFIED (CORR-20260924-432f43 item 1). Launched only inside a
