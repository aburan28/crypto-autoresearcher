  findings_carried:
    L-1_three_classified_sites: >-
      The reachable msolve launch sites are exactly three, and all three are
      CLASSIFIED under the healthresolve definition (census.md lines 234-245,
      289-354; c65bfb receipt census_values_verbatim.CN1_reading). No other
      reachable site exists, classified or not. Four unreachable sites and one
      unresolved v1 argv are listed (census.md lines 238-239, 243-244,
      277-279).
    L-2_health_site_premises_hold: >-
      CN-2 (i), (ii), (iii) and (vi) are confirmed with no discrepancy
      (census.md lines 358-415, 455-466). The round trip of the four health
      systems at p' = 1073741831 is byte-identical 4 of 4. HR-2..HR-4 stand on
      their premises.
    L-3_callgrind_site_facts: >-
      - The callgrind child runs only when a callgrind_timeout is passed and
        the attempt's outcome is ok (v2_driver.py line 207). That is after
        outcome, reason, D and solutions are set (lines 197-206). The msolve
        output <tag>.cg.ms.out is removed unread (lines 210-213).
      - It runs only in fixture (every ok target) and in cells with m <= 4
        (target 0), in both plans (census.md lines 281-287).
      - The r2 SE-3 wrapper passes callgrind_timeout unchanged to every
        attempt (r2_resolve.py lines 206-207, 224). So the callgrind child
        runs at most once per wrapped call, in the attempt the wrapper records,
        and only when that attempt is ok.
      - Its record holds non-cost fields that REG-1 (b) compares for the G1
        fixture package against RUN-GFPN-ac4487 (CORR-20260924-432f43 item 1).
      - RUN-GFPN-ac4487's solver directory retains <tag>.callgrind.stdout and
        <tag>.callgrind.stderr next to the primary logs. The callgrind stdout
        carries msolve's verbose log: fx_reg0_raw_x.callgrind.stdout lines
        239-240 and 317-318 equal fx_reg0_raw_x.ms.log lines 239-240 and
        317-318, read by search.
      These are the Coordinator's readings under TASK-20260924-71ccd9. The
      premise check LP-2 confirms them before approval.
    not_established: >-
      - Whether any REG-1-compared callgrind field varies with the clock
        second. Every SF-1 clause presupposes an ok child (v2_solver.py lines
        490-491), so an SSF event does not by itself change child.outcome,
        child.returncode or reason.
      - A change remains possible through three routes:
        (a) f4_core_function, if an FGLM-side change made another function
            whose name contains "f4" outrank ???:core_f4 in inclusive Ir;
        (b) a seed-dependent run length reaching callgrind_timeout (1800 s at
            m3) or the 10 GiB cap;
        (c) callgrind_annotate's 600 s timeout or an error, which is clock or
            environment, not seed.
      - The archived reference makes (a) and (b) look unlikely at G1, but
        that is an inference, not a measurement. All 36 archived
        f4_core_function values read "???:core_f4
        [/usr/lib/x86_64-linux-gnu/libneogb-0.6.5.so]" (raw-result.json lines
        747-7062, by search). The one entry read in full (lines 732-748)
        records child ok, returncode 0 and wall 3.815 s, with 746548497 of
        821725387 Ir in core_f4.
      - DV-17 tests ordinary seed variation directly. CG-3 records any
        log-visible SSF event.

