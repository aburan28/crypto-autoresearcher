        U-1..U-5  UNREACHABLE: v1 implementation/run_wrapper.py line 36
             (msolve -h); v1 implementation/symmetrize.py lines 392/399;
             k5k7/square_analogue.py line 157; k5k7/square_analogue_m4.py line
             26; and the unresolved operator argv at v1 run_wrapper.py line 98.
             Listed; not a bar. No r3 file imports or executes them.
    CG-2_the_callgrind_site_is_not_re_solved:
      text: >-
        The bounded re-solve rule (SE-2 as amended by SF-1..SF-3, HR-1..HR-7)
        is NOT extended to S-3.
        - SF-1's signature is read on the classify_solve result of a parsed
          output, or on the positive_dimensional class together with the
          random-form string. At S-3 no classify_solve result exists, because
          the frozen code removes the output unread (v2_driver.py lines
          210-213).
        - Every SF-1 clause presupposes an ok child (v2_solver.py lines
          490-491).
        - A re-run keyed to any recorded callgrind field would re-run on a
          signal that is not the SSF signature, which SE-2 (6) forbids
          (unchanged). It would also select among measurements.
        S-3 is covered instead by recording (CG-3), pre-measurement (CG-5),
        an unchanged comparison with a pre-declared reading (CG-4), and
        counting (CG-6).
    CG-3_recording_at_the_callgrind_site:
      amends: HR-8, SE-2 (5) and DEC-20260924-15a77a SC-11 (b)
      text: >-
        After every call of the ORIGINAL solve() made by the SE-3 wrapper
        whose result carries instructions_callgrind, the r3 wrapper reads
        <solver>/<tag>.callgrind.stdout and <tag>.callgrind.stderr (written at
        v2_solver.py line 517). It records, in the run-root solver-events.json
        under site "v2_driver.solve/callgrind":
        - the tag and the attempt number the wrapper recorded;
        - the sha256 and size of each file, or "absent";
        - on the log text stdout + "\n" + stderr + "\n", through the frozen
          V.parse_msolve_log: dimension_of_quotient, the fglm
          squarefree_degree and positive_dimension_reported;
        - whether the text contains "[coefficients of linear form are
          randomly chosen]";
        - the LOG-VISIBLE SSF INDICATOR (definitions below);
        - whether its printed quotient dimension equals the recorded attempt's
          dimension_of_quotient_printed;
        - the record's REG-1-compared fields, verbatim.
        It RECORDS ONLY. It triggers nothing and re-runs nothing. It adds no
        field to raw-result.json, and changes no recorded value and no file in
        the run directory other than solver-events.json. The manifest block
        `solver_events` gives three counts per site: callgrind children
        observed, those with a log-visible SSF indicator, and those with a
        quotient-dimension mismatch. The execution report tabulates the
        callgrind site separately (HR-8 extended). An absent file is recorded
        as absent, never inferred.
    CG-4_REG-1_unchanged_and_a_pre_declared_reading:
      text: >-
        REG-1 stays exactly as the r2 comparator implements SE-4 with the
        d-parsed branch. The exclusion list stays X1..X17, byte-identical
        (DV-8). No field is added to it or removed from comparison.
        PRE-DECLARED READING:
        - A REG-1 (b) difference in any instructions_callgrind field FAILS
          REG-1, as frozen, and R-7 refuses every later package.
        - G1 is never re-run to obtain a pass. The frozen contingency rule
          never replaces a gate package.
        - The lineage STOPS at an impediment. A new Coordinator decision reads
          the CG-3 records and DV-17 and rules. Any remedy is a new draft (for
          example route D below).
        - No exclusion is added after a difference is observed.
        - It is never evidence about D, the quotient, H-GFPN-9a29be or
          HEUR-GFPN-DFLAT.
        In cells (target 0, m <= 4) the callgrind fields are recorded and no
        check reads them. A non-ok callgrind child leaves instructions_user
        null, and that cost measurement is reported missing. It is never
        estimated and never re-measured.
    CG-5_DV-17_callgrind_field_reproducibility:
      amends: HR-9 (adds a development check)
      text: >-
        NEW, run in the r3 successor stage on the r3 development harness. No
        delivered entry can reach that harness.
        (a) INPUTS. Every RUN-GFPN-ac4487 raw-result.json target entry carrying
            instructions_callgrind, as LP-2 (vi) lists them. Each is run on
            its retained solver/<tag>.ms, verified against the
            TASK-20260923-0fa03f post-run receipt and copied to scratch.
        (b) PROCEDURE. For each entry, call the frozen
            v2_solver.callgrind_instructions (imported read-only) R = 10
            times, with:
            - argv V.msolve_argv(<scratch input>, <scratch cg out>,
              threads=1), gb_only false;
            - cap_bytes 10737418240;
            - timeout trial-plan-v2.json watchdogs callgrind_timeout_s.m3
              (1800 s).
            Each call starts at least 2.0 s after the previous call's recorded
            end, so each draw of the clock second is distinct (SC-11 (d)).
            Calls run one at a time, on a quiet machine.
            Record every returned record verbatim, the start and end UTC, and
            the CG-3 fields of each call's logs. Also record each scratch
            output classified as the characterization classified
            (characterization.md lines 101-112). That classification is a
            development observation only.
        (c) READING, FIXED NOW. DV-17 PASSES iff, for every entry and every
            call, each REG-1-compared field equals the reference entry's
            archived value. The fields are:
            - method and label;
            - child.outcome, child.returncode and
              child.rlimit_as_child_getrlimit;
            - the presence and value of reason;
            - f4_core_function;
            - the presence and value of f4_core_note.
            Anything else is a STOP (HR-9 STOPS, extended), reported with the
            entry, the call, the field, both values and the CG-3 fields. A
            re-run is permitted only after a failure with a recorded harness
            reason, with the failed attempt preserved (HR-9, unchanged).
        (d) R = 10 is fixed by declaration, before any callgrind child of this
            check runs. It is never tuned.
        (e) DISCLOSED LIMIT. The characterization saw no SSF-signature solve
            in 3600 default-flag solves of these inputs (characterization.md
            lines 131-139). It did see ordinary clock-seed variation change
            output bytes for one input (line 136). DV-17 therefore tests
            reproducibility of the compared fields under ordinary seed
            variation, under valgrind, in the r3 environment. A PASS says
            nothing about SSF events in callgrind children; CG-3 records those
            if they occur.
        (f) PRIME. p' = 4111 is the REG-1 reference prime. It is not a toy
            prime, and DV-17 is not a forcing check, so DV-16's prime rule
            does not apply. The precedent is the characterization's class C-2
            (development solves of these inputs, zero run packages).
            DV-17's values are harness values. The reference D values are
            archived in RUN-GFPN-ac4487, and nothing new about D is measured.
        (g) BUNDLE. Its outputs go into the SC-5 stage-r3-dv bundle under
            dv17/.
    CG-6_DV-11_as_amended_again:
      replaces: HR-9's DV-11 bullet (healthresolve lines 325-333)
      text: >-
        - STATIC: the search covers implementation-v2/, implementation-v2-a1/
          and the r3 layer. Its list of msolve launch sites must EQUAL S-1,
          S-2 and S-3 plus the r3 layer's own launches (none expected), each
          with its CG-1 disposition.
        - DYNAMIC, in the toy lineage (DV-7), per site:
          - S-1 msolve children equal the SE-3 wrapper's attempts (gb_only
            false) plus its pass-through calls (gb_only true);
          - S-2 msolve children equal the HR-3 wrapper's attempts;
          - S-3 valgrind children equal the wrapped solve() calls whose
