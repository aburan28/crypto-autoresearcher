  # ---------------------------------------------------------------------------
  # PRE-DECLARED READINGS OF THE PREMISE CHECK (fixed now, before it runs)
  # ---------------------------------------------------------------------------
  pre_approval_readings:
    source: >-
      The archived outputs of TASK-20260924-159c1b (snapshot
      TASK-20260924-0957c2): premise-check.md, premise-check.json and
      lp_check.py under
      experiments/EXP-GFPN-05ff43/dev-evidence/launchcover-premise/. The check
      launches no msolve, valgrind, callgrind_annotate, gp or Sage child and
      creates no run package. It reads source code and archived bytes, and it
      imports a frozen module read-only only where the import starts no
      computation and no child process.
    definitions: >-
      - MSOLVE LAUNCH SITE, CLASSIFIED and REACHABLE: exactly as healthresolve
        lines 457-471, unchanged.
      - REG-1-COMPARED CALLGRIND FIELDS: every key of an instructions_callgrind
        record, and of its child mapping, that exclusions X14-X17 do not
        remove (reg1-exclusion-list.json lines 35-42).
      - LOG-VISIBLE SSF INDICATOR, for a log text built as stdout + "\n" +
        stderr + "\n": the text contains "[coefficients of linear form are
        randomly chosen]"; OR the frozen parse_msolve_log gives an fglm
        squarefree_degree and a dimension_of_quotient that are both non-null
        and unequal (the log-only part of SF-1 clause (iii)). Clauses (i),
        (ii) and (iv), and the output-based part of (iii), are NOT computable
        at S-3, because the output is removed unread.
    LP-5_integrity: >-
      APPLIED FIRST. The premise check is INCOMPLETE if any of these fails:
      - this draft's bytes equal the addendum_sha256 in TASK-20260924-b2b59a's
        receipt;
      - the healthresolve draft hashes to ccb55334...291a70d; the seedresolve
        draft to dc714a44...ee81; the solverevent draft to 011d4b2c...9b7f;
      - census.md, census.json and census_scan.py equal the
        TASK-20260924-c65bfb receipt's path_sha256;
      - every implementation-v2/ file read equals the TASK-20260923-0fa03f
        phase-A receipt; every implementation-v2-a1/ file read equals the
        TASK-20260923-4ff597 receipt; every implementation-v2-r2/ file and
        both r2 plans read equal the TASK-20260924-5ca2a5 receipt;
      - every RUN-GFPN-ac4487 file read (raw-result.json, solver/*.ms,
        solver/*.ms.log, solver/*.ms.err, solver/*.callgrind.stdout,
        solver/*.callgrind.stderr) equals the TASK-20260923-0fa03f post-run
        receipt;
      - the check launched any solver, valgrind, callgrind_annotate, gp or
        Sage child.
      An incomplete check is never read. The approval act waits for a
      completed one.
    LP-1_site_coverage: >-
      The check compares CG-1's site list with census.json. It compares the
      reachable sites (file, line, enclosing function, classified, commands)
      and the unreachable sites and unresolved argv, and records every
      difference. READING: this draft is approvable as written ONLY IF
      CG-1's three reachable sites and five unreachable entries equal the
      census's lists exactly. Otherwise it is NOT approvable as written.
    LP-2_callgrind_site_facts: >-
      The check confirms each item with file and line, or names the
      discrepancy.
      (i)   v2_driver.solve launches the callgrind child only when
            callgrind_timeout is truthy and the attempt's outcome is ok (line
            207), after outcome, reason, D and solutions are set (lines
            197-206). It stores the record only at res["instructions_callgrind"]
            (line 209) and removes <tag>.cg.ms.out unread (lines 210-213).
      (ii)  The r2 SE-3 wrapper, which is the base of the r3 wrapper, passes
            callgrind_timeout unchanged to every attempt (r2_resolve.py lines
            206-207, 224). No attempt other than the recorded one can
            therefore launch a callgrind child.
      (iii) v2_solver.callgrind_instructions writes the child's stdout and
            stderr to <workdir>/<tag>.callgrind.stdout and .stderr (line 517).
            The msolve argv after the valgrind prefix equals the primary argv
            except for the output path (v2_driver.py lines 165 and 209). No
            code in the scanned trees removes or renames those two files. The
            only removals at S-3 are the callgrind out file (v2_solver.py
            lines 548-551) and <tag>.cg.ms.out.
      (iv)  The complete key set of instructions_callgrind (v2_solver.py
            lines 519-547) and the REG-1-compared subset. Also: no frozen, r1
            or r2 function other than r2_reg1.compare reads
            instructions_callgrind or any of its keys. That covers every
            classifier, check, gate, outcome class, D computation, scoring,
            aggregation and checker function (by search, listing every hit).
      (v)   The frozen parse_msolve_log returns, from a log text,
            dimension_of_quotient, the fglm squarefree_degree and
            positive_dimension_reported, under the names CG-3 uses.
      (vi)  THE REFERENCE. Every RUN-GFPN-ac4487 raw-result.json target entry
            that carries instructions_callgrind: the count; each entry's
            target list, index and tag; its REG-1-compared fields verbatim;
            its child.wall_seconds; and the presence and sha256 of its
            retained solver/<tag>.ms, <tag>.callgrind.stdout and
            <tag>.callgrind.stderr. No solver is run.
      (vii) THE ARCHIVED LOGS. For each (vi) entry, zero-solve readings on
            the retained <tag>.callgrind.stdout / .stderr pair, and the same
            on that tag's primary .ms.log / .ms.err pair:
            - printed quotient dimension;
            - squarefree_degree;
            - positive_dimension_reported;
            - random-form string present;
            - the log-visible SSF indicator.
            Also whether the two printed quotient dimensions agree.
      READING: a discrepancy in (i), (ii), (iii) or (iv) makes this draft NOT
      approvable as written, because CG-2..CG-6 rest on them. The approval act
      orders a successor draft, route D or another. (v), (vi) and (vii) are
      ruled on by the approval act. A condition may narrow CG-3's recorded
      fields to what (v) shows is computable. A reference entry that is itself
      anomalous is recorded and ruled on: a non-ok child, a reason, an
      f4_core_note, a null f4_core_function, a log-visible SSF indicator, or a
      quotient-dimension disagreement. No condition may change DV-17's
      predicate, R or its reference.
    LP-3_DV-17_feasibility: >-
      INFORMATIONAL. From (vi): N_ref, the sum of reference child.wall_seconds
      over the entries, and two derived bounds:
      - R x that sum, plus 2.0 s x R x N_ref spacing;
      - the worst case R x N_ref x 1800 s.
      These are derived, never measured. The approval act writes them into the
      r3 stage card's advisory budget.
    LP-4_environment: >-
      INFORMATIONAL. The resolved paths of valgrind, callgrind_annotate and
      msolve by shutil.which, with no launch. RUN-GFPN-ac4487's
      environment.json values for valgrind and msolve are quoted verbatim.
      The approval act records them. A difference from the reference host is
      disclosed and is not a bar; DV-17 is the check that detects its effect.
    what_the_readings_cannot_do: >-
      They cannot change R, the DV-17 predicate or reference, the SF-1 clause
      list, K, the SF-2 (c) / HR-6 cap, REG-1, the exclusion list,
      HR-1..HR-8 or CG-2..CG-6. A failed reading makes this draft not
      approvable as written. It never licenses an approval with a changed
      rule, which would need a new draft.

  # ---------------------------------------------------------------------------
  options_weighed:
    scope_note: >-
      These are options for the CALLGRIND site. The health-site options A..F
      of healthresolve (lines 569-622) are carried as the record of that
      choice. Their option A stands, and their option B was not needed,
      because CN-2 (iii) holds.
    CA_classify_record_premeasure_keep_REG-1:
      verdict: ADOPTED (CG-1..CG-6)
      why: >-
        - It names the site's true classification, so no inventory reads it as
          unclassified again.
        - It keeps every approved criterion: REG-1 and X1..X17 unchanged,
          SE-2 (6) unchanged.
        - It measures before believing. DV-17 tests, at the exact inputs REG-1
          compares, whether the compared fields reproduce across distinct
          clock seconds, under valgrind, in the r3 environment, before any
          stage spend on G1.
        - It makes any SSF event in a callgrind child observable (CG-3)
          without re-running a measurement child.
        - Its residual exposure is stated. A seed event that changed a
          compared field would STOP the lineage at REG-1. It would never
          record a wrong D, outcome or gate.
    CB_declare_the_callgrind_site_unclassified:
      verdict: REJECTED
      why: >-
        Narrowing CLASSIFIED so that it excludes regression comparisons would
        rewrite the definition the census applied, right after it found a
        site. That is the same objection healthresolve raised against its own
        route B. It would also leave the clock dependence of G1's comparison
        unexamined.
    CC_exclude_the_non_cost_callgrind_fields_from_REG-1:
      verdict: REJECTED
      why: >-
        - child.outcome, child.returncode, reason and f4_core_function are
          outside the list's permitted categories (reg1-exclusion-list.json
          line 6).
        - Excluding them would hide a real valgrind or annotate failure.
        - The list was declared before any repaired run and must not grow
          once its classification problem is known.
    CD_re_measure_on_a_log_visible_indicator:
      verdict: >-
        NOT ADOPTED. It is the DECLARED SUCCESSOR ROUTE if LP-2 (i)-(iv)
        fails, if DV-17 stops, or if a REG-1 difference in callgrind fields
        coincides with a CG-3 indicator.
      why: >-
        It would be a further in-process replacement of
        v2_solver.callgrind_instructions, which v2_driver reads at call time as
        V.callgrind_instructions, re-measuring once on a log-visible SSF
        indicator. It is not adopted now for four reasons:
        - it adds a third replacement;
        - its trigger sees only part of SF-1, because clauses (i), (ii) and
          (iv) need the output solve() removes;
        - it costs valgrind time;
        - it would re-run a measurement child for an exposure that no archived
          artifact shows.
    CE_drop_or_skip_callgrind:
      verdict: REJECTED
      why: >-
        It would change frozen driver arguments, or the watchdogs object that
        R-9 requires to equal trial-plan-v2.json exactly.
    CF_run_the_healthresolve_draft_as_written:
      verdict: REJECTED
      why: The pre-declared CN-1 reading forbids it (DEC-20260924-afdc3b).
    rejected_also:
      - Choosing R, or any DV-17 tolerance, from an observed callgrind result. None exists, and none may be used.
      - Reading a REG-1 difference in callgrind fields as a pass because the field is "only a measurement label".

  transfer_assumptions: >-
    (1)-(4) as healthresolve lines 624-633.
    (5) Nothing is assumed about the rate of SSF events in valgrind-hosted
        msolve children. DV-17 tests ordinary clock-seed variation at the 36
        archived RUN-GFPN-ac4487 inputs at p' = 4111 only. Nothing transfers
        to other primes, inputs or msolve builds.

  budget_impact:
    what_changes: >-
      - Premise check: zero solver children, zero run packages, Python only.
      - r3 successor stage: as healthresolve (DV-1..DV-16), plus DV-17. At
        R = 10 over the reference entries, DV-17 is R x N_ref callgrind
        children; LP-3 derives the bound. The one reference entry read in
        full took 3.815 s under valgrind (raw-result.json line 736). Zero run
        packages.
      - R2'' and R2b'': the same 31 + 11 packages. CG-3 reads two files per
        callgrind child and launches nothing.
    why_it_fits: >-
      ECC budgets are unlimited (CLAUDE.md rule 11). Memory is machine
      protection. Every DV-17 child has the same 10 GiB cap. The lineage uses
      44 of 48 packages.
    if_it_does_not_fit: >-
      An exhausted envelope or checkpoint is an impediment with a recorded
      clears_when. It is never a mathematical result and never a silent drop.

