  # ---------------------------------------------------------------------------
  # WHAT THE ARCHIVED CHARACTERIZATION ESTABLISHES, AND WHAT IT DOES NOT
  # ---------------------------------------------------------------------------
  findings_carried:
    F-1_mechanism: >-
      From the msolve 0.6.5 source (Ubuntu 0.6.5-1build2 source package; orig
      tarball sha256 equal to its dsc), read by TASK-20260923-6599cf,
      provenance retrieved (characterization.md lines 344-382):
      - fglm/fglm_core.c line 1434 calls srand(time(0)) in
        initialize_fglm_data, and lines 1435-1437 fill the projection vector
        with rand() % prime. It is reached on every prime-field -P 1 solve
        (msolve.c line 1824, fglm_core.c line 1693).
      - A projected minimal polynomial of degree below the quotient dimension
        prints exactly the world-A strings (fglm_core.c lines 830-864,
        1743-1763).
      - The -c 2 random linear form (msolve.c lines 634-750) calls
        srand(time(0)) at line 718 and prints "[coefficients of linear form
        are randomly chosen]" at line 716. It is taken only on the b == 2
        path; the b == 1 form is deterministic (lines 532-626).
      - No seed option exists (help text, characterization.md line 328).
      - `nm -D /usr/bin/msolve` lists srand, rand and time. That the binary
        was built from this source is the distribution's packaging claim.
    F-2_time_structure: >-
      Every consecutive pair of children that started and ended within one UTC
      second produced byte-identical output: 4,765 of 4,765. Both
      differing-output groups consist of consecutive solves inside one UTC
      second (characterization.md lines 242-258).
    F-3_three_outcomes_on_identical_input: >-
      - Mode A (stage R1, world A): NSP, reason (ii); D undefined under the
        frozen class (characterization.md lines 262-273).
      - Mode B (C-1a#247 to #250, one UTC second, 22:58:44Z): ok at
        n_sub_fail = 0, with D = 64 and eliminating degree 64 as in the other
        996 solves of that input, but a different F_p-rational solution set.
        The eliminating and denominator polynomials agree, and at least one
        parametrisation polynomial differs (characterization.md lines 206-226;
        summary.json lines 888-916; solves.jsonl lines 247-248).
      - Mode C (C-2#95 to #99, one UTC second, 23:33:19Z,
        ac4487/fx_reg1_S3_rescaled): the bytes differ from the archive, and
        the parsed comparison agrees (characterization.md lines 228-240).
    F-4_quotient_dimension_stable: >-
      No input showed a printed-quotient-dimension difference in 8,680
      default-flag solves (characterization.md line 226). The F4 rounds in
      stdout are identical in worlds A and B (line 320). The quotient
      dimension is printed before the FGLM sequence is generated (lines
      280-285).
    F-5_flag_diagnostics: >-
      Under -c 0 and -c 1 the event input gave world-B bytes 200 of 200 times
      each, over 41 distinct start seconds each. Under -c 1, the 12
      raw_x / raw_u RUN-GFPN-ac4487 inputs failed ("Computation failed", empty
      output), which the frozen classifier reads as positive_dimensional
      (characterization.md lines 330-342).
    F-6_census: >-
      0 of 565 retained msolve logs in the 50 archived run directories show the
      NSP signature; 370 print a quotient dimension. This covers retained logs
      only (characterization.md lines 384-409).
  not_established:
    - Whether mode B arises in the same FGLM step as mode A (characterization.md line 381).
    - The per-seed failure probability at any prime. Nothing is measured at 262151, 16777291 or 1073741831.
    - Whether failure events at distinct seeds are independent (glibc rand() streams for different seed values). This is reviewed at SJ-2.
    - That the .ms file a package writes is the system the frozen driver substitutes into. The supplementary diagnostic of characterization.md section 10 (lines 411-439) assumes it, and PR-1 checks it.
    - That the installed binary was built from the read source, beyond the packaging claim and the nm -D listing (characterization.md line 355).

  # ---------------------------------------------------------------------------
  # CHANGES
  # ---------------------------------------------------------------------------
  changes:
    SF-1_seed_sensitive_failure_signature:
      replaces: solverevent SE-1
      name: seed-sensitive solver failure (SSF)
      text: >-
        A call of v2_driver.solve with gb_only false has the SSF SIGNATURE iff
        its result has:
        (i)   outcome degenerate_parametrisation, reason "eliminating
              polynomial is not square-free" (v2_solver.py line 498); or
        (ii)  outcome degenerate_parametrisation, a reason beginning
              "eliminating polynomial degree " (lines 500-502); or
        (iii) outcome degenerate_parametrisation, a reason beginning "msolve
              reports square-free part degree " (lines 503-505); or
        (iv)  outcome degenerate_parametrisation, a reason ending "parsed
              solution(s) fail substitution into the descended system"
              (lines 506-507); or
        (v)   outcome positive_dimensional where the attempt's log text contains
              the exact string "[coefficients of linear form are randomly
              chosen]". The log text is .ms.log + "\n" + .ms.err + "\n", as
              solve() builds it at v2_driver.py lines 170-176.
        No other outcome class has the signature: ok, timeout,
        memory_exhausted, crashed, refused_to_start, or positive_dimensional
        without (v). Those keep their frozen handling exactly.
      why_these_clauses: >-
        Each clause is a failure class that a time(0)-seeded random choice on
        the frozen argv can produce (F-1):
        - (i) to (iii): the FGLM projection, whose failure strings are
          established from the source;
        - (iv): the parametrisation (mode B). This is observed, but its step is
          not established;
        - (v): the -c 2 random linear form. It is established from the source
          and was not reached in the characterization.
        A failure that does NOT depend on the seed reproduces on every attempt
        and keeps its frozen class (solverevent SE-2 (3)). So the widening can
        delay a frozen class but cannot remove one.
    SF-2_re_solve_rule_amendments:
      amends: solverevent SE-2 (incorporated)
      text: >-
        SE-2 (1)-(7) apply with SSF in place of NSP, with K from SF-3, and with
        these additions:
        (a) SPACING (SE-2 (2)(c), kept and grounded). Each attempt starts at
            least 2 s after the previous attempt ended. FGLM reads time(0)
            inside the child after the child starts, and every earlier
            attempt's FGLM began before that attempt ended. So the seed values
            of successive attempts are strictly increasing (F-1). Each attempt
            records its start and end UTC with microseconds. The seed second
            itself is not observable.
        (b) CONSISTENCY (SE-2 (4), extended). The layer also checks that every
            attempt started at least 2 s after the previous attempt's recorded
            end. A violation is handled as SE-2 (4) handles one: the attempt
            records are written, the layer raises, and the package ends failed
            as implementation_error, never as a result.
        (c) RE-SOLVE WALL-TIME CAP. Attempt 2 always starts when attempt 1 has
            the SSF signature (subject to K). For k >= 2, attempt k + 1 starts
            only if the summed wall seconds of attempts 2..k are below the
            timeout_s argument that solve() was called with (the frozen
            per-target timeout of that arm and m). Otherwise no further attempt
            starts, the recorded result is attempt k's (SSF, so the frozen
            class), and solver-events.json records "resolve_cap_reached". The
            extra wall time per target is therefore below 2 x per_target_timeout_s.
            The cap depends only on wall time and a frozen value, is declared
            before any run, and never selects among D values (SE-2 (4)).
        (d) PER-CELL WATCHDOG, UNCHANGED. The frozen per-cell no-measurement
            watchdog is evaluated between targets on wall time
            (v2_driver.py lines 1149-1154), and that time includes re-solves.
            Disclosed consequence: at m = 5 (per-target timeout 43200 s,
            watchdog 172800 s; trial-plan-v2.json lines 146-161), a cell whose
            first targets have SSF re-solves can reach the watchdog after fewer
            targets than one-attempt handling would. Every cell whose watchdog
            fires after a target with at least one re-solve is flagged
            `watchdog_after_resolve` in the execution report. Its not_attempted
            targets are never evidence (SJ-6).
        (e) REPORTING (SE-2 (7), extended). Counts are given per SSF clause
            (i)-(v), with every resolve_cap_reached and every
            watchdog_after_resolve.
    SF-3_K:
      replaces: solverevent SE-2 K and CR-2
      value: 5
      text: >-
        K = 5 (at most 6 attempts per solve, further bounded by SF-2 (c)). It is
        fixed BY DECLARATION: it is the largest value of the superseded draft's
        declared range {2, 3, 4, 5}, chosen without reference to any observed
        rate. Extra attempts cost wall time only on the SSF signature, bounded
        by SF-2 (c). The CR-2 formula is not used (DEC-20260923-d670c6 defect
        D-2: it counts solves, and under F-2 the back-to-back solves of one
        second share one seed). K is written into both r2 plans' `repair`
        block.
    SF-4_REG-1_d_branch:
      amends: solverevent SE-4 (d)
      value: d-parsed
      text: >-
        REG-1 (d) uses the d-parsed branch: equal parse kind, header degree,
        eliminating-polynomial degree and square-free flag, the F_p-rational
        solution set as v2_solver.rational_solutions returns it (as a set), and
        D, on the recorded attempts. Basis: the CR-3 reading of the archived
        characterization is d-parsed (summary.json lines 1374-1393: C-2#95 to
        #99 on fx_reg1_S3_rescaled, bytes differ from the archive and the
        parsed comparison agrees). That reading follows from the superseded
        draft's pre-declared rule applied to archived data, and it does not
        depend on CR-1. It is written into both r2 plans' gate.regression. The
        rest of SE-4 is as incorporated: no tolerance on any value, and nothing
        added to the exclusion list.
    SF-5_certification_note:
      standing: >-
        A Coordinator derivation, provenance internal. It is not a literature
        citation and is not yet reviewed (SJ-5). It justifies the design and is
        not relied on as evidence.
      text: >-
        Claim: an attempt that the frozen classifier calls ok, with substitution
        computed (v2_driver.py lines 192-197), carries a correct D, a correct
        eliminating polynomial and a correct F_p-rational solution set.
        (a) D is read from the printed quotient dimension (v2_driver.py lines
            199-204). It is printed before the seeded FGLM step (F-4), and
            SE-2 (4) requires it to agree across attempts.
        (b) The polynomial Berlekamp-Massey returns from a projected sequence
            divides the minimal polynomial of the multiplication operator,
            whose degree is at most D. So an eliminating polynomial of degree
            exactly D is that minimal polynomial, whatever the projection.
            classify_solve rejects every other degree (v2_solver.py lines
            500-505).
        (c) Every reported F_p-rational solution is substituted into the system
            (line 196). A wrong coordinate fails substitution (clause (iv)).
        (d) With a correct square-free eliminating polynomial of degree D and a
            separating linear form, the F_p-rational roots are in bijection
            with the F_p-rational solutions. So the reported set is complete.
        Consequence: any seed-driven difference that changes a field REG-1 or
        a cell records shows an SSF clause, and the re-solve rule reaches it.
        Open points for SJ-5: that msolve's parametrisation output is in shape
        position for the frozen linear forms; and how rational_solutions parses
        multiplicities.
    SF-6_development_checks_and_stops:
      amends: solverevent SE-8 and SE-9 (incorporated)
      text: >-
        DV-12 (re-solve path, forced, in a scratch toy copy through a
        development shim that no delivered entry can reach) covers these cases:
        (a) attempt 1 forced to SSF clause (ii); the recorded result must equal
            the unforced run's;
        (b) attempt 1 forced to SSF clause (iv) (substitution); the same
            requirement;
        (c) attempt 1 forced to SSF clause (v) through a shimmed log carrying
            the random-form string; the same requirement;
        (d) all K + 1 attempts forced SSF; the result must be
            degenerate_parametrisation with D undefined, exactly as frozen;
        (e) an input-sha mismatch forced; the package must end failed;
        (f) wall times shimmed so that the SF-2 (c) cap binds after attempt 2;
            the recorded result must be attempt 2's class, with
            resolve_cap_reached recorded;
        (g) an attempt forced to start less than 2 s after the previous end;
            the package must end failed (SF-2 (b)).
        DV-14 (spacing): in the toy lineage, every re-solve attempt in
        solver-events.json started at least 2 s after the previous attempt
        ended.
        Stops (SE-9, extended): any DV-12 case or DV-14 fails.
    SF-7_layer_plans_ids:
      amends: solverevent SE-7 (incorporated)
      text: >-
        SE-7 applies unchanged, with these notes:
        - The successor stage card is reserved TASK-20260923-de3a7d.
        - REFUSAL R-1 binds FIVE hashes: the three approved amendments, THIS
          draft (the value its approval decision binds), and the superseded
          draft whose text is incorporated
          (011d4b2c11f99d696281ccfdd4d65ece4fefcc6ae71de3de813049bbeb2d9b7f).
        - Each r2 plan's `repair` block names paristack, this draft and the
          superseded draft (the last as "incorporated by reference, never
          approved"), and records K = 5, the 2 s spacing, the SF-2 (c) cap and
          the d-parsed branch.
        - The 42 run ids are minted in the successor stage, as SE-7 says. The
          ceiling is 48, with 44 in use.
    SF-8_sequencing:
      replaces: solverevent SE-10 RS-0..RS-4
      text: >-
        NORMATIVE. Archives run alone. Solver-running tasks never overlap each
        other or any other solver process.
        RS-0'  DONE. Stage R1 stopped (TASK-20260923-a681f9). The
               characterization ran (TASK-20260923-6599cf) and was archived
               (TASK-20260923-683f34, ad08d9172). DEC-20260923-d670c6 found the
               superseded draft not approvable under CR-1.
        RS-1'  DEC-20260923-d670c6 and this draft are archived ALONE by
               TASK-20260923-df9fab, verified and pushed.
        RS-2'  The BATCH-e409ca revision DEC-20260923-d670c6 authorizes is
               appended.
        RS-3'  The zero-run, zero-solve premise check TASK-20260924-0652ce
               runs, then its snapshot TASK-20260924-3ee9a8, alone.
        RS-4'  The approval act (reserved TASK-20260924-4f14f0) decides this
               draft on its ARCHIVED bytes as reserved DEC-20260924-15a77a,
               applying PR-5, PR-1, PR-2, PR-3 and PR-4 in that order. If it
               approves, it writes the successor stage card (reserved
               TASK-20260923-de3a7d), its two-phase archive, the R2' and R2b'
               run cards and their archive. It reshapes BATCH-e409ca by
               appended revision, cancelling the seven review-chain
               placeholders and declaring their successors. It checkpoints the
               goal and is archived (reserved TASK-20260924-532053).
        RS-5 to RS-10 are as incorporated (solverevent lines 484-502). At
        RS-10 the review plan also owns:
        - SJ-5: the SF-5 certification note and the SF-1 clause list, checked
          against the msolve source;
        - SJ-6: the SF-2 (c) cap and the SF-2 (d) watchdog interaction, cell by
          cell.
        SJ-1..SJ-4 are read with SSF in place of NSP. SJ-2 covers the archived
        characterization, the premise check, and the independence of failures
        at distinct seeds.

  # ---------------------------------------------------------------------------
  # PRE-DECLARED READINGS OF THE PREMISE CHECK (fixed now, before it runs)
  # ---------------------------------------------------------------------------
  pre_approval_readings:
    source: >-
      The archived outputs of TASK-20260924-0652ce (snapshot
      TASK-20260924-3ee9a8): premise-check.md, premise-check.json and
      pc_check.py. The check launches no msolve child and creates no run
      package. It classifies archived outputs with the frozen code.
    output_set_O: >-
      O is the set of distinct default-flag msolve output byte-strings of the
      archived characterization, keyed by input:
      - the world A and world B outputs of the event input (in the DV-7
        bundle);
      - every distinct default-flag output in distinct-outputs.tar.gz;
      - the 36 archived RUN-GFPN-ac4487 .ms.out.
      Each output is classified with the log of a solve that produced exactly
      those bytes, taken from the bundle, from distinct-outputs.tar.gz or from
      RUN-GFPN-ac4487/solver/.
    PR-5_integrity: >-
      APPLIED FIRST. The check is INCOMPLETE if any of these fails:
      - this draft's bytes equal the addendum_sha256 in TASK-20260923-df9fab's
        receipt;
      - the superseded draft hashes to 011d4b2c...;
      - the five characterization files equal the TASK-20260923-683f34 receipt
        path_sha256;
      - the DV-7 bundle equals the TASK-20260923-53a47d receipt value;
      - every RUN-GFPN-ac4487 file read equals the TASK-20260923-0fa03f
        post-run receipt;
      - the check launched any msolve child.
      An incomplete check is never read. The approval act waits for a
      completed check.
    PR-1_substitution_premise: >-
      (a) For each of the 72 archived .ms inputs (the 36 toy inputs of the
          world-B toy G1 package in the bundle, including the event input, and
          the 36 RUN-GFPN-ac4487 inputs):
          write_msolve_input(tmp, *_parse_ms_file(f)) must reproduce f byte
          for byte. v2_arms.py lines 691-710 and v2_driver.py lines 582-604
          define these. An adapter between the two representations is allowed
          only if it changes no coefficient or exponent, and its code is
          recorded.
      (b) A code reading, with line numbers, must confirm three things:
          - v2_driver.solve writes the .ms from the same (names, p, eqs) it
            substitutes into (lines 162 and 196);
          - write_msolve_input drops only identically-zero equations;
          - v2_solver.substitute reduces modulo p (lines 473-485).
      If (a) fails for any file, or (b) finds a system difference other than
      dropped zero equations, clause (iv)'s coverage is unverified. This draft
      is then NOT approvable as written, and the approval act orders a
      successor remedy by a new draft (options_weighed a2 or e).
    PR-2_coverage: >-
      Each output in O is classified exactly as v2_driver.solve lines 170-197
      do it:
      - with substitution computed against _parse_ms_file of its input
        (n_sub_fail as line 196);
      - then classify_solve;
      - then the SF-1 signature.
      The readings:
      (a) ec54fd1520eafb2216fc1c6606db5f660b8867f8d176631b9da950acf10248ee
          (mode B) must have SSF clause (iv).
      (b) d2878f4f2b276162c78fd8b7fb31ae2fbc0a04984222a344fed047fef9cf07da
          (mode A) must have SSF clause (ii).
      (c) Every output in O whose SE-4 (d) parsed comparison differs from its
          input's modal output must have the SSF signature.
      (d) Every archived RUN-GFPN-ac4487 output must classify ok, with
          substitution_failures 0 and D equal to the D that
          RUN-GFPN-ac4487/raw-result.json records for that tag.
      (e) 7e283c2834f024429d50347a1cfb42d560b4eaf1b5643a818c96c9e58cb45f06
          (mode C) must classify ok with substitution_failures 0.
      Consequences:
      - If (a) or (c) fails, SSF does not cover the observed nondeterminism.
        This draft is NOT approvable as written, and the approval act orders a
        successor remedy by a new draft.
      - If (b) or (d) fails, the check contradicts an archived record. It is an
        integrity finding under PR-5, and the approval act waits.
      - If (e) fails, the reading is recorded, and the approval act rules on it
        before any approval.
      - Any other output in O that has the SSF signature (a seed-stable SSF
        input, for example a toy system) is recorded. In the toy lineage it
        would take K + 1 attempts and keep its frozen class. It is not a bar to
        approval.
    PR-3_code_facts: >-
      The check must confirm each of these with file and line, or name the
      discrepancy:
      (i)   substitution is computed for every gb_only-false solve whose child
            exited ok and whose output parses as param (v2_driver.py lines
            190-197);
      (ii)  the four classify_solve reason sites and their strings
            (v2_solver.py lines 488-508);
      (iii) every call site of solve() and its gb_only value (as listed in
            summary.json lines 942-999);
      (iv)  the per-cell no-measurement watchdog is evaluated only between
            targets (v2_driver.py lines 1141-1154);
      (v)   after solve() returns, .ms.log and .ms.err remain in solver/, and
            _retain (lines 217-231) removes at most the .ms and the .ms.out.
      A discrepancy in (i) or (ii) makes this draft NOT approvable as written,
      because SF-1 is written against those lines. A discrepancy in (iii), (iv)
      or (v) is ruled on by the approval act, and a condition may fix it.
    PR-4_log_availability: >-
      For each output in O, the check records whether a log of a solve that
      produced exactly those bytes was available. An output without one is
      listed as a gap and not classified. If the output of (a) or (b) has no
      log, that is an integrity finding under PR-5 (both are retained:
      characterization.md lines 441-452, and the bundle).
    what_the_readings_cannot_do: >-
      Change K, the SF-1 clause list, the cap or the (d) branch. A failed
      reading makes this draft not approvable as written. It never licenses an
      approval with a changed rule, which would need a new draft.

  # ---------------------------------------------------------------------------
  options_weighed:
    a1_pinned_clock_single_seed:
      verdict: REJECTED
      why: >-
        msolve has no seed option (F-1). Pinning time() for the child makes the
        output a deterministic function of the input, but a pinned seed that
        produces mode A or mode B for some input produces it EVERY time, with
        no way to recover. It removes the nondeterminism without removing the
        wrong or missing outputs.
    a2_pinned_seed_schedule:
      verdict: NOT ADOPTED NOW; the declared fallback if PR-1 or PR-2 (a)/(c) fails
      why: >-
        Attempt k runs with time() interposed to a declared clock value T_k,
        combined with the SF-1 trigger. This would make every package byte-
        reproducible, including the RC-6 probe. It needs a new component in the
        solver path (an LD_PRELOAD interposer or a faketime tool), whose
        availability on the host is not established. It changes the child's
        environment relative to RUN-GFPN-ac4487, whose seed seconds are
        unknown. And under d-parsed it adds nothing that SF-1 and SF-5 do not
        already give to the recorded fields.
    b_genericity_flags_c0_c1:
      verdict: REJECTED
      why: >-
        - The established randomness site is in FGLM (fglm_core.c line 1434).
          It is reached on every prime-field -P 1 solve independently of -c
          (F-1), so a flag change leaves it in place.
        - -c 1 fails 12 of the 36 archived RUN-GFPN-ac4487 inputs, which are
          solved under default flags (F-5). That is more missing D, not less.
        - -c 0 quits on a non-generic staircase.
        - 200 solves per flag on the event input, over 41 distinct seconds
          each, cannot show removal of a failure seen in 1 of 603 distinct
          start seconds under default flags (characterization.md lines 244-257).
        - REG-1 would compare two solver paths.
    c_bounded_re_solve_rule:
      verdict: ADOPTED, WIDENED (SF-1, SF-2, SF-3)
      why: >-
        - Re-solves at least 2 s apart are guaranteed distinct seeds (SF-2 (a)).
        - A failure that does not depend on the seed reproduces and keeps its
          frozen class.
        - The quotient dimension is printed before the seeded step and must
          agree across attempts, so the rule cannot select among D values.
        - It keeps the frozen solver path, flags and argv, so RUN-GFPN-ac4487
          remains REG-1's reference.
    d_substitution_check:
      verdict: ADOPTED AS A TRIGGER, not as a new check
      why: >-
        The frozen driver already computes substitution on every gb_only-false
        param solve (v2_driver.py lines 192-197). classify_solve already maps a
        failure to degenerate_parametrisation (v2_solver.py lines 506-507). The
        only change is that SSF re-solves on it. Its coverage rests on PR-1.
    e_two_seed_agreement:
      verdict: NOT ADOPTED NOW; second fallback
      why: >-
        Solving every system twice at distinct seeds and accepting only parsed
        agreement would catch even a difference that SF-5 says cannot alter a
        recorded field. But it doubles every solve, including m = 5 cells
        (per-target timeout 43200 s).
    rejected:
      - Widening the exclusion list to absorb D, an outcome class or a solution set. Forbidden by PS-4 (e) and RC-6.
      - Re-running DV-7 until it passes. Outcome-seeking.
      - Choosing K from the observed failure counts. That would be post hoc, because this draft is written after the characterization was read.
      - Dropping REG-1 or the RC-6 probe.

  transfer_assumptions: >-
    (1) The quotient dimension does not depend on the seed. F-4 supports this
        on the characterized inputs, and SE-2 (4) checks it on every re-solve.
    (2) Failure events at distinct seeds are not systematically correlated
        (reviewed at SJ-2). K is fixed and is not derived from this
        assumption.
    (3) Nothing is assumed about the rate at 262151, 16777291 or 1073741831.
        SE-2 (7) reports every event, and SJ-4 reviews the per-cell load.
    (4) The evidence is at toy scale only. Nothing transfers to
        p = 2^64 - 2^32 + 1 except under HEUR-GFPN-DFLAT as frozen.

  budget_impact:
    what_changes: >-
      - Premise check: zero msolve children, zero run packages, Python only.
      - Successor stage: as the superseded draft's SE-8, plus the DV-12 cases
        (a)-(g) and DV-14. Zero run packages.
      - R2' and R2b': the same 31 + 11 packages. Extra solves happen only on
        the SSF signature, at most K = 5 per solve, and their total extra wall
        time per target is below 2 x per_target_timeout_s (SF-2 (c)).
    why_it_fits: >-
      ECC budgets are unlimited (CLAUDE.md rule 11). Memory is machine
      protection (AC-1), and a re-solve has the same child cap. The lineage
      uses 44 of 48 packages.
    if_it_does_not_fit: >-
      An exhausted envelope or checkpoint is an impediment with a recorded
      clears_when. It is never a mathematical result and never a silent drop.

  proof_search_map_applicability: >-
    NOT REQUIRED for this kind (agents/coordinator.md "Proof-oriented dispatch
    gate"). This is a change to execution and to reproducibility checks. It
    changes no mechanism, observable, quantifier order, method ceiling or
    nearby object. The section 8 audits of DEC-20260923-e788a1 and
    DEC-20260923-8b2dbf stand unchanged.

  authorization: >-
    NONE WHILE DRAFT. Once a committed Coordinator decision approves this
    record, it authorizes only what that decision's cards define, in SF-8
    order. It authorizes:
    - NO attack, NO unknown-scalar solve and NO deployed-curve instance;
    - NO wall-time extrapolation;
    - NO use of any retired id (including the 42 r1 ids);
    - NO msolve flag or argv change, and NO time() interposition;
    - NO change to H-GFPN-9a29be's status or HEUR-GFPN-DFLAT's statement.
    The premise check TASK-20260924-0652ce is NOT authorized by this draft. It
    is a zero-run development task dispatched under DEC-20260923-d670c6.
    Amazon Bedrock is prohibited.

  non_claims:
    - NOT EVIDENCE. This record measures nothing.
    - NOT A CLAIM about msolve's correctness beyond the archived observations and the source reading, both cited with their provenance.
    - NOT A PREDICTION of any D, of the repaired gate's outcome, or of any verdict.
    - NOT A SECURITY CLAIM about EcGFp5 or EcMasFp5 in either direction.
    - NOT A HYPOTHESIS STATUS MOVE. H-GFPN-9a29be stays inconclusive; HEUR-GFPN-DFLAT stays untested.
    - NOT APPROVED, and not official until TASK-20260923-df9fab's commit is verified against Git.

