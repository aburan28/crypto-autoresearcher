             (ii) the copy with the (a) manifest's
                  resources.child_rlimit_as_read_back_by_getrlimit list EMPTIED
                  (that list only, never recomputed by the RB-2 collector).
                  Required: the frozen checker exits 1 and its output contains
                  the line "no child RLIMIT_AS read-back recorded"
                  (v2_check_run.py 66-67); the wrapper refuses the later
                  package on RB-4 (b), naming the (a) package; the admission
                  record for the (a) package carries that line.
             DISCRIMINANT: the frozen checker's read-back line appears in the
             admission record of (ii) and not in that of (i). Every failing
             item of (ii) beyond those of (i) is quoted and attributed to the
             emptied list; an item of (ii) not attributable to it is a STOP.
        (d2) THE ADMITTING BRANCH, on COHERENT development copies (the DV-18
             (i) method of readbackclose RK-4 (e): after each edit the
             manifest fields the carried V-7 item and hash checks read are
             recomputed with the delivered wrapper's functions). On the copy
             set of RK-4 (e) (5) in which every gate image G1..G4 (and, for an
             addendum package, the controls_a1 image) and every package the
             later package requires or reads has a copy whose r4 checker exits
             0 and whose REG-1 record is recorded PASS:
             (i)  the wrapper's `preflight` of the later package returns no
                  RB-4, RL-4, RK-3 or RF-3 refusal (it ADMITS), and the
                  admitted package's gate.gate_package_checker records each
                  gate image's command, exit status 0 and output;
             (ii) the same set with ONE gate image's
                  resources.child_rlimit_as_read_back_by_getrlimit list emptied
                  (that list only, never recomputed by the RB-2 collector;
                  every other field made coherent as above): the frozen
                  checker exits 1 on that image with the read-back line, and
                  the wrapper refuses the later package on RB-4 (b), naming
                  that image.
        (d3) Each of (d1) and (d2) records, per copy, the edits made (path,
             field, before and after sha256), the preflight output verbatim
             and every admission record.
        STOP (VA-12 (b) re-pointed) on any failure of (d1) or (d2). A harness
        fault is re-run only as R4S-9 permits (recorded harness reason; failed
