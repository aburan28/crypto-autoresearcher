        gate package, never a result, never compared with a gate package for
        selection, never a reason to re-run anything; its values are toy
        harness values and never evidence about D.
        WHY: (d1) shows RB-4 (b) refusing on the checker verdict of a real
        development package and nothing else; (d2) shows it admitting where
        every admission predicate can hold. A wrapper whose RB-4 (b) ignores
        the checker verdict fails (d1) (ii) and (d2) (ii); a wrapper that
        refuses every later package fails (d2) (i).
        PRE-DECLARED ALTERNATIVE (fixed here, before any review): if the
        review finds (d2) unsatisfiable in every development world the texts
