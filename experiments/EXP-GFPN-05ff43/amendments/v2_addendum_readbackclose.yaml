  findings_carried:
    RKF-1_raise_after_fork: >-
      Successor census RLR-1 (readbackfull-census.md 135-149, 241-291): the
      frozen run_child has no explicit raise, but the parent side can raise
      after fork: os.read (214), os.wait4 (223, 230, 244), os.write of the go
      byte (236; BrokenPipeError if the child exited in the window), and
      _perf_read (141 via 281; only where count_instructions is true, i.e.
      v2_driver.py:166). On 230, 236, 244 and 281 the pair has been set at 227
      in `rec`, the object run_child builds at 152 and passes at 171. The
      raise discards it. RL-1 as worded then records pair "absent" and
      child_created false for a created child (census L-6).
    RKF-2_empty_report: >-
      P-7: a child-side failure of os.chdir, os.open or os.dup2 before
      setrlimit (188-191) is swallowed at 206; the child exits 99; the parent
      reads an EMPTY report and returns refused_to_start with
      child_rlimit_report ''. No pair is ever read. The draft's NOT A BAR
      names only "the ERR setrlimit branch"; whether RL-1 (c)'s "carries"
      is a key-presence test is unstated (census L-7).
    RKF-3_zero_launch_packages: >-
      Census RLR-4 (b) (md 503-510, 540-550): v2_check_run.py 65-67 exits 1
      on any non-aggregate package whose collected read-back list is empty.
      (i) An m = 5 cells package whose runnable cells are all not_attempted
      "polynomial unavailable" (v2_driver.py 1071-1075) launches no capped
      child, is recorded completed_valid (1101), and is acted on by the m = 4
      package (_condition_met 1119-1126) and the aggregates; for
      random_no2torsion one failed S5 m = 5 build row suffices. (ii) A package
      whose every launch was refused before fork has no pair either.
    RKF-4_F-4_not_blocking: >-
      trial-plan-v2.json line 78 and trial-plan-v2-r3.json line 506: "F-4":
      "package 5 runs after the gate and is NOT blocking". The r3 plan
      `requires` chain orders G4 -> F-4 -> build 4111 (census md 493-501).
      RL-4 as worded makes build's admission depend on F-4's r4 checker exit.
    RKF-5_development_admission: >-
      r3_run_wrapper.py: preflight (231) and launch (423) are separate
      functions; main (403-420) launches only when preflight returns no
      refusal. In preflight, every v2-a1 package requires the gate packages
      (need_gate, 282), every package other than G1 requires REG-1 against
      G1 (285-287), R-8 requires each `requires` entry's manifest (290), and
      R-2 requires the run id to be reserved in the plan read (270-271). A
      development world without G1..G4 therefore refuses DV-18 (a) controls,
      (b) anchor-identity and (e) controls-a1 at preflight. NOT A CENSUS
      RESULT: DEC-20260924-a789e1's reading of the r3 wrapper, which the close
      census establishes (RKR-6).

  changes:
    RK-1_launch_record_on_every_path:
      amends: readbackfull RL-1 (b), (c) (replaces child_created; adds the raise path; additive otherwise)
      text: >-
        NORMATIVE.
        (a) ON RETURN. RL-1 (c) is unchanged except: child_created is the
            KEY-PRESENCE test of child_rlimit_report in the returned record
            (true whatever its value, the empty string included; the frozen
            function sets that key at v2_solver.py 220, before each of its
            returns after fork (225, 232, 308), and before none of its
            returns before fork (155, 160, 165, 169)). readback_from is
            "returned_record".
        (b) ON RAISE. Before re-raising the same exception unchanged, the
            recorder INSPECTS, READ-ONLY, the exception's traceback. At
            install (RL-5) it captures, from module v2_solver, the code
            object of the frozen run_child (the original RL-1 (a) names) and
            of the frozen _run_child_locked (qualname _run_child_locked, code
            file implementation-v2/v2_solver.py, first line 177). On a raise
            it finds the frames whose code object IS one of those two. From
            the OUTERMOST frame of the frozen run_child it reads the local
            `rec` (the record object built at 152 and passed to, and mutated
            by, _run_child_locked at 171), and copies from it, where present,
            rlimit_as_child_getrlimit, child_rlimit_report, outcome,
            refusal_reason and returncode. child_created is true if that
            `rec` carries the key child_rlimit_report, OR if a frame of the
            frozen _run_child_locked on the traceback holds a local `pid`
            that is an int greater than 0; false otherwise. It also records
            raised (the exception's type name), raise_site (the innermost
            frozen frame's function name and line number), the child pid
            where a frame holds it (report-only; epsilon), and readback_from
            "raise_frame_record". It never assigns to a frame local, calls or
            mutates a value it finds there, or keeps a reference to the
            traceback or any frame after the record is written. If no frame
            of the frozen run_child is found, it records frame_inspection
            "not_found" and child_created "undetermined"; that is an SE-2 (4)
            consistency violation (the package fails as implementation_error,
            never a result).
        (c) PAIR READ BY PARENT. Every launch record carries
            pair_read_by_parent: true if and only if the copied record
            carries rlimit_as_child_getrlimit (set only at v2_solver.py 227,
            which precedes the go byte at 236). A created child with
            pair_read_by_parent false is recorded with the pair "absent" and
            its child_rlimit_report as the record carries it (an ERR
            setrlimit report, the empty report, or the key missing when the
            raise preceded line 220).
        (d) RL-1 (d) and (e) are unchanged: the recorder RECORDS ONLY; no
            value it records selects a result, triggers a re-solve, changes a
            class, delays or reorders a launch, or alters argv, env, cwd,
            cap, timeout, lock or count_instructions. It adds no sleep, no
            guard and no function replacement.
    RK-2_accounting_of_launch_classes:
      amends: readbackfull RL-3 (additive)
      text: >-
        NORMATIVE. resources.child_readback_accounting additionally lists,
        per launch record: readback_from; and names (i) every launch with
        raised non-null, with child_created and pair_read_by_parent; (ii)
        every created child with pair_read_by_parent false, by class (ERR
        setrlimit report; empty report; report not read); (iii) every launch
        record with child_created false (refused or raised before fork).
        Recorded and reported, gating nothing by itself; RK-3 reads it. The
        frozen checker is UNCHANGED; its cap comparison of every collected
        entry applies to every source, the raise-frame records included.
    RK-3_admission_verdict_exact:
      amends: readbackfull RL-4 (additive; makes explicit); readbackcover RB-4 (unchanged)
      text: >-
        NORMATIVE.
        (a) NAMED READS. RL-4's admission covers, BY NAME, the reads of the
            successor census's table (readbackfull-census.md 442-455): X-03
            (G1 read by REG-1 at the admission of every package after G1, G3
            and G4 included), X-04 (every `requires` entry, subject to (d)),
            X-07 (_load_build), X-08 (_prior_cells, _condition_met), X-09
            (cmd_aggregate), X-10 (cmd_aggregate_a1) and X-11
            (v2_common.resolve_replacement, a1_driver._resolve: the
            contingency manifests), and any further read of an r4-lineage
            package the close census lists. RB-4 covers X-01 and X-02. NOT
            covered, by design: X-05 (R-12's failure_class read), X-06
            (existence and count only), X-12 and the X-03 reference (archived
            RUN-GFPN-61bba9 and RUN-GFPN-ac4487, outside the r4 lineage, bound
            by hash).
        (b) THE r4 VERDICT, INCLUDING ZERO LAUNCH. The r4 checker verdict of
            a package is PASS if the frozen checker, in its own process,
            exits 0 and every r4 check passes. It is PASS_ZL (zero launch)
            if ALL of these hold: (i) the package is not a gate package
            (G1..G4) and not the controls_a1 image; (ii) its launch_records
            list is EMPTY: the recorder, installed and read back under RL-5,
            recorded no call of v2_solver.run_child; (iii) RL-3 names no
            recorder gap and the package holds no child/*.meta.json,
            solver/*.ms.log, health/, comparator/ or pari/ file; (iv) the
            frozen checker exits 1 and its output lists EXACTLY ONE failing
            item, the line "no child RLIMIT_AS read-back recorded"
            (v2_check_run.py 66-67), verbatim, and nothing else; (v) every r4
            check passes. Otherwise it is FAIL. The verdict, the frozen
            checker's exit status and its output verbatim are recorded in the
            package's own manifest and in every admitting package's
            gate.required_package_checker. The SAME verdict is the package's
            own completion-gate verdict and the admission verdict of every
            package that reads it. RB-4 (b) for G1..G4 and the controls_a1
            image stays "exits 0": PASS_ZL never applies to them.
            PASS_ZL waives no item of any package that called run_child: one
            launch record, of any class, makes (ii) false.
            WHY, stated before any r4 package runs (no m = 5 cell has ever
            run under v2): the item at 65-67 is a proxy for "the package's
            capped children ran under the cap". Under RK-1 the recorder
            records every call of the only frozen function that sets
            RLIMIT_AS in a child (archived census; successor census RLR-2),
            so an empty launch_records list with no child file is a positive
            record that the package created no capped child, and the proxy
            is vacuous there. The frozen checker exits non-zero on such a
            package by design although the frozen dependants act on it
            (RKF-3 (i)).
        (c) DESIGNED STOP. A package whose verdict is FAIL and which has at
            least one INFRASTRUCTURE LAUNCH (a launch record with
            child_created false, raised non-null, or pair_read_by_parent
            false) is refused as RL-4 words it: the dependent chain STOPS at
            an impediment for a new Coordinator decision, which may rule an
            R-12 contingency run. This stop is the DESIGN, not a defect: an
            outcome whose basis includes launches that never released a
            capped workload under a recorded cap is not a planned basis
            outcome (RKF-3 (ii)). It is never evidence.
        (d) F-4 STAYS NOT BLOCKING. The frozen plan's gate rule "package 5
            runs after the gate and is NOT blocking" (trial-plan-v2.json
            line 78) is a scientific sequencing rule this repair keeps
            unchanged. The `requires` entry by which the next package of the
            r4 plan names the F-4 package is admitted by R-8's existence test
            only; F-4's r4 verdict is recorded under
            gate.required_package_checker and gates nothing. Every other
            `requires` entry carries RL-4 with the verdict of (b).
        (e) Unchanged: R-8's existence test; R-12; RB-4; the RL-4 stop and
            its "never evidence".
    RK-4_development_world_and_checks:
      amends: readbackcover RB-5 DV-18 (a)-(b); readbackfull RL-6 (e), (f), (g) (additive)
      text: >-
        NORMATIVE.
        (a) DEVELOPMENT WORLD FOR DV-18 (a), (b), (e). Each is run through
            the delivered r4 entry and the r4 run wrapper's EXECUTION path
            in a development process: RUNS and the plan paths redirected
            in-process to a scratch directory outside
            experiments/EXP-GFPN-05ff43/runs/ (as the r3 development checks
            redirect them; r3_run_wrapper.py 68); development COPIES of the
            r4 plans in which the package under test carries a development
            label as its run id and EVERY OTHER VALUE equals the r4 plan's.
            The wrapper's preflight is run first and its refusals are
            recorded verbatim; the refusals of the admission predicates whose
            predecessor packages do not exist in the development world (R-7
            gate packages, REG-1, R-7 controls_a1 image, R-8, RB-4, RL-4 /
            RK-3) are EXPECTED and listed; ANY OTHER refusal is a STOP. The
            execution path (the wrapper's launch, recording, manifest and
            checker steps) is then invoked in that process for the
            development package. No bypass flag, mode or argument is added to
