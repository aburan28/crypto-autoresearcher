      PASS, PASS_ZL, FAIL: as RK-3 defines them. READ-BACK SOURCE: RB-2
      (a)-(c), RL-3 (d)-(e), and a launch record whose pair was copied under
      RK-1 (a) or (b). THE ARCHIVED CENSUS: TASK-20260924-bf5724 as archived
      by TASK-20260924-a01341. THE SUCCESSOR CENSUS: TASK-20260924-cab04e as
      archived by TASK-20260924-ddfb69. THE CLOSE CENSUS: the zero-run,
      zero-solve census TASK-20260924-e8da78 as archived by
      TASK-20260924-71d070.
