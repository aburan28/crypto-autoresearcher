  options_weighed:
    RA_record_raise_path_from_frames: ADOPTED (RK-1). The pair is in the frozen function's own record object on every path on which the parent read it; reading that object from the traceback records it on the raise path without a second function replacement, and makes child_created true for every created child.
    RB_replace_os_fork_or_callees: >-
      REJECTED. A replacement of os.fork, os.write or the perf callees in
      packages would widen HR-3's closed list to process primitives, and a
      per-callee design is the per-site method this lane has found
      incomplete three times.
