# =============================================================================
# AMD-EXP-GFPN-05ff43-20260924-readbackclose  --  DRAFT, NOT APPROVED
#
# The SUCCESSOR DRAFT that DEC-20260924-a789e1 orders after the DRAFT
# AMD-EXP-GFPN-05ff43-20260924-readbackfull (sha256
# 0b6315d4b2ef810aa01d1890b39921f153b4d9017903cc5ce023b6dfddfaabc1) was
# decided NOT APPROVABLE AS WRITTEN under its own readings RLR-1 and RLR-4 (b),
# applied to the successor census TASK-20260924-cab04e (snapshot
# TASK-20260924-ddfb69):
# - RLR-1: created capped children with NO source under RB-1, RB-2, RL-1, RL-2
#   and RL-3 as worded, on branches the draft does not name "not a bar":
#   P-7 (a child failure before setrlimit; empty report; no pair) and P-14 /
#   P-15 (the frozen run_child RAISES after fork, so no record reaches RL-1,
#   which as worded then records pair "absent" and child_created FALSE for a
#   created child). On P-14 at 236 and on P-15 the pair had been set at
#   v2_solver.py 227 in the record the raise discards.
# - RLR-4 (b): the frozen checker v2_check_run.py 65-67 ("no child RLIMIT_AS
#   read-back recorded") exits 1 BY DESIGN on correctly recorded outcomes the
#   frozen dependants act on: (i) an m = 5 cells package that launches no
#   capped child because its runnable cells lack a polynomial (recorded
#   completed_valid; read by the m = 4 package's _condition_met and by the
#   aggregates), and (ii) a package whose every launch was refused before fork.
# - Also named: RL-4 through `requires` makes F-4's checker verdict gate the
#   next package, against the frozen plan's "NOT blocking" rule that the draft
#   itself keeps unchanged; and DV-18's development runs "through the r4 run
#   wrapper" cannot pass its admission predicates in a world without gate
#   packages (the census's L-9; DEC-20260924-a789e1 D-5).
#
# It is an ADDITIVE addendum. It INCORPORATES readbackfull in full (RL-1..RL-8,
# and through it readbackcover RB-1..RB-8, valueclose with VA-1..VA-12 and
# everything they incorporate), UNCHANGED, except what RK-1..RK-7 add or make
# explicit. Only what is ADDED is written here.
#
# THE IDEA. (1) Record the launch on the RAISE path too, by reading, and only
# reading, the frozen function's own record object from the exception's
# traceback frames: the pair is in it on every path on which the parent read
# it. (2) Classify every created child by one static fact, whether the parent
# read a pair (v2_solver.py 227), instead of by an enumeration of branches.
# (3) Make the admission verdict exact on packages that launch nothing, name
# the designed stops, and keep F-4 non-blocking. (4) Run DV-18 through the
# wrapper's execution path in development, with the admission preflight
# recorded, not bypassed.
#
# WHAT IT IS NOT: approved, evidence, a prediction, a hypothesis status move, a
# security statement, or a change to any frozen byte, msolve / valgrind /
# callgrind_annotate / gp / Sage binary, flag or argv, REG-1 item or exclusion,
# K, spacing, SF-2 (c) / HR-6 cap, DV-17 predicate, health-check seed, pattern,
# expected D or pass predicate, watchdog, envelope value, arm, cell, stream or
# reading rule. Approval is a later, separate Coordinator decision (reserved
# DEC-20260924-8fa3d4 under reserved TASK-20260924-7e9d3e, ledger archive
# reserved TASK-20260924-eb2540), which reads the ARCHIVED bytes of this file
# (addendum_sha256 in TASK-20260924-1ae107's receipt) and of the close census
# (TASK-20260924-e8da78, snapshot TASK-20260924-71d070).
# =============================================================================
