      REJECTED. P-15 is an S-1 solve that ran to completion under the cap;
      its read-back exists in memory and is discarded. Declaring it "not a
      bar" would repeat the failure-branch ruling DEC-20260924-650068
      rejected.
    RD_approve_readbackfull_with_conditions: >-
      REJECTED (DEC-20260924-a789e1). Its what_the_readings_cannot_do forbids
      an approval with an added tolerance or a waived checker item, and the
      raise-path recording is new normative text.
    RE_zero_launch_as_a_designed_stop: >-
      REJECTED. It would stop the ladder whenever one m = 5 build row fails,
      although the frozen plan's m = 4 conditional rule is designed for
      exactly that case; that changes a scientific sequencing rule.
    RF_close_the_lane: >-
      REJECTED. The obstruction is recording and admission wording in a layer
      not yet written. Nothing measured D. Closing C1's measured side on it
      would be premature closure.

  transfer_assumptions: >-
    (1) CPython keeps a raising frame's locals reachable from the exception's
    traceback until the traceback is released; the recorder reads them before
    re-raising. The r4 stage's DV-18 (f) (vi)-(vii) show it on the frozen
    function on the host's Python (3.11 per the successor census run record).
    (2) The frozen code is hash-bound, so the first lines RK-1 names are
    stable. (3) The recorder adds a Python call, a frame read and a file
    write in the parent after the frozen function returned or raised; it
    changes no child argv, env, limit or order. REG-1 neutrality of the r4
    layer is shown on its own G1, as before. (4) Nothing here transfers to
    262151, 16777291 or 1073741831 cells, which have not run, or to
    p = 2^64 - 2^32 + 1.

