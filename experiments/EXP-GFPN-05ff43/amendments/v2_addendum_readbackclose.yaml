  method_limits_declared:
    RKL-1: >-
      Grandchildren (census L-4) are not examined; a capped child's own
      children inherit its RLIMIT_AS by the kernel, and nothing here records
      them.
    RKL-2: >-
      A created child left waiting for the go byte when the parent raises
      before 236 (for example at 214 or 235) is released when the parent
      process exits (its read of the go pipe returns end-of-file at 202) and
      then execs argv. It execs only after its own check that soft and hard
      equal the cap (v2_solver.py 197-201): an INFERENCE FROM FROZEN CODE,
      not a recorded observation. Its launch record exists (RK-1 (b)); its
      run is not otherwise recorded, and the package it belongs to has
      already failed. A following package's R-10 refuses while it runs.
    RKL-3: >-
      Which path occurs is a run-time fact; every path here is static.

