  changes:
    RG-1_positive_child_end_evidence:
      amends: failclosed RF-1 (a new recorded value, additive) and RF-3 (a) (classes narrowed); readbackfull RL-1 (the recorder gains an after-fork observer; records only)
      text: >-
        NORMATIVE.
        (a) CHILD-END OBSERVER. At install, the RL-1 recorder registers, in the
            installing process only, ONE after-fork-in-parent callback
            (os.register_at_fork with after_in_parent only; nothing is
            registered for the child). The callback acts only while a recorder
            call is in progress in the installing process (a flag the recorder
            sets immediately before calling the captured frozen function and
            clears immediately after it returns or raises), and otherwise
            returns at once. On its FIRST invocation within a call it:
            (1) reads the calling thread's children from
                /proc/self/task/<tid>/children and takes the pids not present
                in the list the recorder read immediately before the call;
            (2) if there is exactly one such pid, opens on it ONE software
                perf counter (PERF_TYPE_SOFTWARE, PERF_COUNT_SW_TASK_CLOCK;
                disabled; enable_on_exec; inherit NOT set; exclude_kernel and
                exclude_hv set; read_format with total time enabled and
                running) with close-on-exec;
            (3) records the pid and the outcome, or the reason it could not
                (no or several new pids; the listing absent or unreadable;
                perf_event_open failing; a second invocation within the same
                call, which also marks the call).
            It catches every exception its own code raises and records the
            type; it writes nothing to any file, stream or pipe; it does
            nothing in the child. The frozen child cannot exec before this
            callback runs: it waits for the go byte (v2_solver.py 202), which
            the parent writes only at 236.
        (b) READ. After the frozen call returns or raises, the recorder reads
            the counter (value, time_enabled, time_running) and closes it. The
            launch record carries child_end_observer: {pid, opened, read,
            value, time_enabled_ns, time_running_ns, reason}.
        (c) CHILD END. Every launch record carries child_end, exactly one of:
            - "no_child": child_created false (RK-1 (a) on return, RF-1 (a)
              on raise) AND the callback did not fire during the call;
            - "exec": child_created true, raised null, the counter opened on
              exactly one new pid and read, and time_enabled_ns > 0 (the
              kernel enabled the counter at that process's exec, so its image
              was replaced by argv[0]);
            - "frozen_pre_exec_exit": child_created true, raised null, the
              counter opened on exactly one new pid and read with
              time_enabled_ns = 0 and value = 0 (no exec), and the returned
              record's (child_rlimit_report, returncode) is one of: a report
              starting "ERR setrlimit" with returncode 97 (v2_solver.py
              195-196) or 99 (206-208); the empty report with returncode 99
              (206-208); a report starting "OK" with returncode 98 (200-201)
              or 99 (206-208). These are the frozen child's own os._exit
              calls, which run no handler, no finally clause, no interpreter
              shutdown and no further Python code;
            - `undetermined`: in EVERY other case, in particular: raised
              non-null; child_created `undetermined`; the counter not opened
              or not read; no new pid or several; any other report and
              returncode pair with no exec (returncode 1, or a negative
              signal number, as an escaped or killed child leaves); the
              callback fired in a call whose record says child_created false.
        (d) CLASSES (RF-3 (a), narrowing only). Class (A) additionally
            requires child_end "no_child". Class (B) additionally requires
            child_end "exec", or "frozen_pre_exec_exit" with returncode 98 or
            99 (a hard-limit mismatch or an execv that raised after OK; both
            execute no argv). Class (C) additionally requires child_end
            "frozen_pre_exec_exit". A launch record whose child_end is
            `undetermined` is no class; it makes the verdict FAIL (RF-0 (c))
            with stop class "an `undetermined` value" (RF-3 (b)). PASS_ZL is
            unchanged (it admits no launch record).
        (e) WHAT CHANGES FOR DEFINITION (iv). A process other than the
            installing one can run recorder, entry or frozen caller code only
            by a created child that leaves the frozen child path by an
            exception. Such a child neither execs nor reaches a frozen
            os._exit, so its child_end is `undetermined` and its package
            FAILs, WHATEVER it wrote or failed to write. The evidence is
            produced by the kernel (the exec-enabled counter) and by the
            frozen child's own exit, and it is collected by the installing
            process after the frozen parent has reaped the child (every
            record eligible for class (B) or (C) was returned by the frozen
            function, which reaps the child before returning: v2_solver.py
            223, 230, 243-271). The verdict no longer depends, for any created
            child, on the absence of a recorder-foreign file; RF-1 (b)'s file
            stays as a second record and still FAILs the package when present
            (RF-2 (viii), RF-3 (a)).
        (f) The callback and the counter change no argv, env, cwd, cap,
            timeout, lock or count_instructions of the frozen call and no
            order of its steps; they create no process and write nothing. The
            frozen hardware instruction counter (v2_solver.py 126-136,
            233-235, 280-282) is a separate event of another type and is not
            read by RG-1. REG-1 neutrality of the r4 layer is shown on its own
            G1, as before.
    RG-2_infrastructure_stop_outcomes:
      amends: failclosed RF-0 (b) (outcome classes; additive); failclosed RF-3 (b) (unchanged; named here)
      text: >-
        NORMATIVE.
        (a) An INFRASTRUCTURE-STOP OUTCOME is an outcome whose
            raw_result_writer is "driver", whose package has at least one
            launch record, and from none of whose launch records the frozen
            checker collects a pair (so the frozen item "no child RLIMIT_AS
            read-back recorded", v2_check_run.py 65-67, fails): every launch of
            the package is an INFRASTRUCTURE LAUNCH as readbackclose RK-3 (c)
            defines it (child_created false, raised non-null, or
            pair_read_by_parent false; readbackclose lines 355-358).
        (b) RF-0 (b)'s sentence "A DRIVER-LOGIC OUTCOME has raw_result_writer
            'driver'" reads: "A DRIVER-LOGIC OUTCOME has raw_result_writer
            'driver' and is not an infrastructure-stop outcome." The recorded
            field raw_result_writer, and every rule that reads
            raw_result_writer "driver" (RF-2 (vi), RF-3 (a)), are unchanged.
        (c) NO VERDICT CHANGES. Such an outcome's verdict is FAIL (the frozen
            item, unchanged since v2), and it is a designed stop with stop
            class "an infrastructure launch" (RF-3 (b)). This clause changes
            which outcomes are planned basis outcomes, not what any outcome
            receives. PASS and PASS_ZL are not widened.
        (d) WHY, stated before any r4 package runs. readbackclose RK-3 (c)
            stated that such an outcome "is not a planned basis outcome"
            (lines 360-363), and its reading RKR-4 (b) exempted it; failclosed
            replaced RK-3 (c) by RF-3 (b) and its definitions dropped the
            exclusion (review PB-1). Every protocol version of this lineage,
            the approved r3 included, fails such a package by the frozen
            checker item (G4 RUN-GFPN-bfe956 failed on it; DEC-20260924-1ce186
            R-1), and admission is on the checker verdict since readbackfull
            RL-4. Its basis contains no launch that released a capped workload
            under a recorded cap. INCLUDED AND NAMED: a package whose every
            launch is refused before fork because the driver's own RSS exceeds
            1 GiB (v2_solver.py 156-160, the AC-1 envelope). It stops for a
            Coordinator decision, which may rule on it; it is never evidence
            and never a finding about D.
    RG-3_development_harness_feasible:
      amends: failclosed RF-4 (a) (1)-(3), (c) and (d) (sentences replaced or added as named)
      text: >-
        NORMATIVE.
        (a) RF-4 (a) (1) also lists the r4 counterpart of
            r3_common.LADDER_PATH as the wrapper reads it (r3_run_wrapper.py
            464). The development ladder and the fixture files RF-4 (a) (2)
            points at are byte-identical copies of the real files; the sha256
            of each copy and of each real file are recorded side by side in
            the DV-18 output; any difference is a STOP (review OB-9).
        (b) RF-4 (a) (2): the development shims wrap, replace or trace no
            function of any module. The run_child tracer of r3_dv7.py 301-314
            is NOT carried (it would make the RL-5 install read-back refuse;
            review FC-4).
        (c) RF-4 (a) (3): the synthetic development phase-A receipt carries
            commit_sha equal to the repository HEAD at the DV-18 run (the
            output of `git rev-parse HEAD`, recorded), as r3_dv12.py 119 does
