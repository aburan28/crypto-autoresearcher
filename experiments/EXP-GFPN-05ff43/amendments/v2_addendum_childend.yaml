#
# The core change (RG-1) replaces the absence-based condition by POSITIVE
# evidence of how every created child ended, produced by the kernel and
# collected by the installing process after the child is reaped: an
# exec-enabled counter shows that the child image was replaced by argv[0]; the
# frozen child's own os._exit codes show that it ended on the frozen pre-exec
# path. Any other end is `undetermined` and FAILs the package, whatever an
# escaped process did or failed to write.
#
# It is an ADDITIVE addendum. It INCORPORATES failclosed in full (RF-0..RF-8,
# RFL-1..RFL-7, and through it readbackclose RK-1..RK-7, readbackfull
# RL-1..RL-8, readbackcover RB-1..RB-8, valueclose with VA-1..VA-12 and
