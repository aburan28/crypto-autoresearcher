  method_limits_declared:
    carried: RFL-1..RFL-7 of failclosed, unchanged.
    RGL-1: >-
      RG-1 relies on operating-system behaviour of the host kernel: a counter
      opened with enable_on_exec is enabled at the monitored process's exec
      and its time_enabled then grows; a counter never enabled reads
      time_enabled 0 and value 0; /proc/self/task/<tid>/children lists the
      calling thread's live children; the after-fork-in-parent callback runs
      in the parent after fork() returns and before os.fork() returns. DV-18
      (f) (xiv)-(xx) show each on the host with the delivered code. Where the
      behaviour differs, child_end is `undetermined` and the package FAILs,
      never a favourable value.
    RGL-2: >-
      "frozen_pre_exec_exit" rests on the returncode set {97, 98, 99}, which
      the frozen child produces only by os._exit (v2_solver.py 196, 201, 208).
      An escaped child could produce one of those codes only if code on its
      unwinding path raised SystemExit with that code; the review found no
      handler on those paths other than the entries' main, which records and
      re-raises (review J-2, scans (2)-(3)). That no r3 or r4 code on an
      unwinding path raises SystemExit(97), (98) or (99) is a joint of the
      review of this draft and a DV-18 (h) closure item on the delivered
      code.
    RGL-3: Grandchildren are not examined (RFL-1); the counter is not inherited.
    RGL-4: >-
      A created child killed by a signal before exec (for example by the host
      out-of-memory killer) leaves child_end `undetermined`; its package FAILs
      and stops as an infrastructure condition, never a result.
    RGL-5: >-
      Which path occurs is a run-time fact (RFL-3); every statement here is
      static until DV-18 runs on the delivered code.

