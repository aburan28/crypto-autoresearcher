#   the entry's pari-stack.json write in that process goes undetected and the
#   parent's class (C) or (B) record admits PASS (definition (iv) as worded).
#   Root cause (review OB-7): the PASS and PASS_ZL rules read "no
#   recorder-foreign file" as the absence of an escape, a favourable value
#   inferred from an absence, contrary to failclosed RF-0 (a).
# - RFR-2 fails as worded on PB-1 (definitional): failclosed replaced
#   readbackclose RK-3 (c), whose text excluded outcomes with only
#   infrastructure launches from planned basis outcomes, and its definitions
#   carry no such exclusion.
