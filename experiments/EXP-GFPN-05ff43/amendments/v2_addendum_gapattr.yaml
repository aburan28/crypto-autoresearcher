    RGL-6: >-
      What stays unshown after the review of this draft and DV-18: that code
      of third-party modules on an escaped child's unwinding path, and
      interpreter shutdown, cannot end the process with 97, 98 or 99 or exec
      (review 1ecb7d CJ-1 residual; interpreter behaviours stated there with
