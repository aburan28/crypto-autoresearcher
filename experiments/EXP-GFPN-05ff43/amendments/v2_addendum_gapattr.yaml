  changes:
    RH-1_positive_output_attribution:
      amends: childend RG-4 (b) (the attribution sentence "A file under child/, ... no other launch record's argv names." REPLACED; the non-launch list and the gap rule unchanged)
      text: >-
        NORMATIVE. A file under child/, solver/, health/, comparator/ or pari/
        is ATTRIBUTED to a launch record R if, and only if, at least one of the
        following holds; each clause reads only records written in the
        installing process or by the frozen code before the launch:
        (i)   it is R's stdout_path or stderr_path (RG-4 (a));
        (ii)  it is a path that R's argv names exactly, as a whole element;
        (iii) CALLGRIND OUTPUT: R's argv contains an element of the form
              "--callgrind-out-file=<path>" (v2_solver.py 516) and the file is
              <path>;
        (iv)  it lies under a directory that R's argv names as a whole element
              and that no other launch record's argv names;
        (v)   CHILD-JOB OUTPUT: R's child_end is "exec"; the LAST element of
              R's argv is the path of a file <dir>/<tag>.spec.json under
              child/ of this package; that file parses as JSON and carries a
              string "out" equal to <dir>/<tag> (v2_driver.py 96-99); and the
              file is <out>.npz or <out>.meta.json (v2_child.py 38-42, 68, 80,
              100, 104). A spec file that is absent, unparseable, or whose
              "out" differs attributes nothing by this clause;
        (vi)  RENAMED ATTEMPT FILE: the file lies in <dir> (solver/ or
              health/) and its name is <tag> followed by one of ".ms.out",
              ".ms.log" or ".ms.err" and then the suffix ".ssf-attempt<k>"
              (the rename suffix as r3_resolve.py 231 applies it, and its r4
              counterpart); solver-events.json records, in an SE-3 or HR-3
              event whose tag is <tag>, renamed_files["attempt<k>"] containing
              that file name as a key (r3_resolve.py 235, 310); the package has
              at least k launch records whose stdout_path is
              <dir>/<tag>.ms.log; and R is the k-th of them in launch order. A
              renamed file with no such event entry, or with fewer than k such
              launch records, attributes nothing by this clause.
        A directory named by the argv of two launch records attributes nothing
        by (iv). The frozen NON-LAUNCH writes RG-4 (b) lists (a1_health.py
        141-143 and 251; a1_pari.py 91-93) stay listed and are not gaps. Every
        other file in those directories that is attributed to no launch record
        is a RECORDER GAP (RL-3), and a recorder gap makes the verdict FAIL
        (RF-3 (a)), as RG-4 (b) states.
        WHY POSITIVE. Each clause names the record from which the attribution
        is read (the spec file the frozen driver writes before the launch; the
        event the r3 / r4 resolve layer writes in the installing process; an
        argv element). No clause attributes a file by its directory alone, by
        a name pattern alone, or by the absence of another owner, so a file
        written by a launch whose record was lost stays a gap unless another
        record's own positive source names exactly that file.
    RH-2_cap_mismatch_stop_outcomes:
      amends: failclosed RF-0 (b) as childend RG-2 (b) re-reads it (outcome classes; additive); failclosed RF-3 (b) (a stop class named; no verdict change)
      text: >-
        NORMATIVE.
        (a) A CAP-MISMATCH STOP OUTCOME is an outcome whose raw_result_writer
            is "driver" and for which the frozen checker item "recorded
            RLIMIT_AS read-back ... != requested" (v2_check_run.py 68-70)
            fails: at least one collected pair differs from the requested cap
            (the P-8 / P-9 shapes, v2_solver.py 193, 197-201, 226-232).
        (b) RF-0 (b)'s sentence, as RG-2 (b) re-reads it, reads: "A
            DRIVER-LOGIC OUTCOME has raw_result_writer 'driver' and is neither
            an infrastructure-stop outcome (RG-2) nor a cap-mismatch stop
            outcome (RH-2)." The recorded field raw_result_writer, and every
            rule that reads raw_result_writer "driver" (RF-2 (vi), RF-3 (a)),
            are unchanged.
        (c) NO VERDICT CHANGES. Such an outcome's verdict is FAIL (the frozen
            item, unchanged since v2), and it is a designed stop whose RF-3 (b)
            stop record names the class "a cap read-back mismatch" and quotes
            the item. PASS and PASS_ZL are not widened.
        (d) WHY, stated before any r4 package runs. AC-1 admits no package as a
            basis unless every capped child that may have executed argv has a
            recorded pair EQUAL to the cap; an outcome with an unequal pair is
            the case AC-1 exists to stop, and letting it steer the m = 4
            conditional rule would let a cap failure steer the frozen
            sequencing. Every protocol version of the lineage fails it by the
            same frozen item. It meets the four conditions DEC-20260924-61b22c
            (R-OB-B_referent_narrowing) sets for a definitional exclusion: no
            verdict change; a frozen checker item common to every version; no
            launch of the class released a capped workload under a recorded
            cap equal to the requested cap; stated before the review of this
            draft and a joint of it.
    RH-3_development_harness_values:
      amends: childend RG-3 (e) (additive) and RG-3 (c) (wording)
      text: >-
        NORMATIVE.
        (a) RG-3 (e) gains SPEC VALUE BY PATH SUBSTITUTION. For every child-job
            launch of a development package, the DV-18 output records the
            spec file's "out" value as written and SUBSTITUTED by the same
            replacement RG-3 (e) applies to argv. The substituted value must
            equal <repository>/experiments/EXP-GFPN-05ff43/runs/<the plan
            package's run id>/child/<tag>, or be unchanged where the spec's
            "to_cache" is true (the cache directory, v2_common.py 42, lies
            outside the run directory); every other key of the spec file must
            equal, byte for byte after JSON canonical dump, the value the plan
            package's frozen driver would write (read from the same
            constructor, v2_driver.py 94-99, with the plan's run directory).
            A spec "out" under GFPN_RUN_DIR is then an accepted label field of
            RF-4 (d), like argv under RG-3 (e) (review FC-E). Any other
            difference is a STOP.
        (b) RG-3 (c) reads: "the synthetic development phase-A receipt carries
            commit_sha equal to the repository HEAD at the DV-18 run (the
            output of `git rev-parse HEAD`, recorded)." The citation "as
            r3_dv12.py 119 does" is withdrawn (r3_dv12.py 119 writes a
            non-commit placeholder; r3_check_run.py 255-256 tests presence
            only; review OB-A; CORR-20260924-3c831f item 1).
    RH-4_callback_exception_undetermined:
      amends: childend RG-1 (a) (additive) and RG-1 (c) (one further `undetermined` case)
      text: >-
        NORMATIVE. If the RG-1 after-fork-in-parent callback catches ANY
        exception while it runs during a recorder call (including one raised
        by a Python-level signal handler while the callback's bytecode runs),
        it records the exception's type and marks the call; the launch
        record's child_end is then `undetermined` (RG-1 (c)), and its package
        FAILs (RF-0 (c)). RG-1 (f) is read with this clause: absent such an
        exception the callback changes no value and no order of the frozen
        call; with one, the frozen parent may continue where it would
        otherwise have raised at v2_solver.py 181, and the record FAILs the
        package instead (review OB-C; CORR-20260924-3c831f item 3).
    RH-5_closure_items_extended:
      amends: childend RGL-2 (closure item) and failclosed / readbackfull DV-18 (h) (additive)
      text: >-
        NORMATIVE. DV-18 (h)'s closure scan on the DELIVERED r4 code adds:
        (a) EXEC HALF (review OB-F, X10). No r4 function reachable on an
            unwinding path from the frozen run_child to the r4 entries calls
            os.exec*, os.posix_spawn*, os.system, os.popen, subprocess.* or
            multiprocessing; RGL-2's SystemExit(97), (98), (99) item stays.
        (b) LIVE CHILDREN (review X6b, OB-D). No r4 code creates a child
            process of the installing thread outside the frozen run_child, or
            leaves one unreaped across a recorder call.
        (c) THIRD-PARTY LIST. The scan lists by name and installed version
            every third-party module the r4 entries import (flint, numpy,
            cypari2 and its signal layer, yaml, and any other), and records
            that their code on an unwinding path was NOT scanned unless the
            review of this draft read it (RGL-6).
        (d) ORDER. DV-18 (f) (xiv) (a real child that execs; time_enabled_ns
            > 0) and (xv) (a child that exits 99 without exec; time_enabled_ns
            0 and value 0: the negative control) run FIRST on the r4 host,
