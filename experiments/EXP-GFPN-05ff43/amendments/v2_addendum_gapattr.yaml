      that code. DV-18 (f) (xvi) and (xvii) exercise the escape with the
      delivered imports loaded; they show the behaviour on those paths, not
      its absence on all. Where the premise fails, the failure is an escaped
      child recorded "frozen_pre_exec_exit" or "exec": a FAIL-OPEN route,
      which is why this limit is stated here and not left to a review.
    RGL-7: >-
      RH-1 (v) and (vi) read files the frozen driver and the resolve layer
      write; an r4 package whose spec files or solver-events.json were altered
      after the launch would change attribution. Such an alteration by the
      frozen or r4 code is not known on any path; the r4 wrapper's
      post-completion listing records every file's sha256 (RL-3), so an
      alteration by anything else is visible after the fact, not prevented.

