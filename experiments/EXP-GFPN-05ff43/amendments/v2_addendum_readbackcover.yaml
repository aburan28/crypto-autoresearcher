# =============================================================================
# AMD-EXP-GFPN-05ff43-20260924-readbackcover  --  DRAFT, NOT APPROVED
#
# The SUCCESSOR REPAIR that DEC-20260924-1ce186 orders after the repaired r3
# gate of EXP-GFPN-05ff43 was ruled NOT ESTABLISHED: G1 (RUN-GFPN-f6a21a), G2
# (RUN-GFPN-902222), G3 (RUN-GFPN-f5412a) and REG-1 passed, but G4
# (RUN-GFPN-bfe956, the frozen `controls` command) fails its frozen
# completion-gate checker with "no child RLIMIT_AS read-back recorded".
#
# It is an ADDITIVE addendum to protocols 2-r3 and 2-a1-r3
# (AMD-EXP-GFPN-05ff43-20260924-valueclose, approved with VA-1..VA-12 by
# DEC-20260924-e52eec). EVERYTHING valueclose incorporates, and every VA
# condition, is INCORPORATED BY REFERENCE and UNCHANGED, except what RB-1..RB-8
# add. Only what is ADDED is written here.
#
# WHY. Three gaps with one root cause: the frozen `controls` command writes no
# per-child solve record into raw-result.json, and the r3 layer reads
# per-child facts only from raw-result.json.
# - The manifest's child read-back and threads lists come out empty
#   (r3_run_wrapper.py lines 510-511), so the frozen checker fails. The 11
#   builder read-backs sit in child/*.meta.json; the 8 wrapped msolve solves'
#   read-backs are recorded NOWHERE in the package (CORR-20260924-ec044e).
# - The r3 checker's SC-4 accounting enumerates S-1 attempts from
#   raw-result.json only, so G4's 8 attempts got no row (CORR-20260924-ec044e
#   item 2).
# - The r3 wrapper's R-7 admits later packages on run_status and gate_pass
#   alone, so it would have admitted RUN-GFPN-596fb2 (CORR-20260924-2a9fc7).
# And the command was never exercised before its gate run: the r3 DV-7 could
# not run `controls` or `anchor-identity` at toy scale, so G3 and G4 were
# SYNTHETIC rows there (implementation-v2-r3.md lines 534-537).
#
# WHAT IT IS NOT: approved, evidence, a prediction, a hypothesis status move, a
# security statement, or a change to any frozen byte, msolve / valgrind /
# callgrind_annotate binary, flag or argv, REG-1 item or exclusion, K, spacing,
# SF-2 (c) / HR-6 cap, DV-17 predicate, health-check seed, pattern, expected D
# or pass predicate, watchdog, envelope value, arm, cell, stream or reading
# rule. Approval is a later, separate Coordinator decision (reserved
# DEC-20260924-650068 under reserved TASK-20260924-53026a, ledger archive
# reserved TASK-20260924-833cde), which reads the ARCHIVED bytes of this file
# (addendum_sha256 in TASK-20260924-9c617a's receipt) and of the read-back
# census (TASK-20260924-bf5724, snapshot TASK-20260924-a01341).
# =============================================================================
