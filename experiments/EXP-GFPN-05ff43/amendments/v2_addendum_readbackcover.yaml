  # ---------------------------------------------------------------------------
  # PRE-APPROVAL READINGS (applied by the approval act, in order, to the
  # ARCHIVED read-back census and to this file's ARCHIVED bytes)
  # ---------------------------------------------------------------------------
  pre_approval_readings:
    definitions: >-
      A CAPPED CHILD is a process launched through the frozen
      v2_solver.run_child (or any other frozen function that sets RLIMIT_AS
      in a child), reachable from a command of trial-plan-v2-r3.json or
      trial-plan-v2-a1-r3.json. A READ-BACK SOURCE for it is a place the RB-2
      collector reads (raw-result.json by key name; child/*.meta.json; a
      solver-events.json attempt record written under RB-1 from a frozen
      function's RETURNED result) that carries its getrlimit pair. The
      census is the zero-run, zero-solve read-back census TASK-20260924-bf5724
      as archived by TASK-20260924-a01341.
    RBR-5_integrity:
      order: 1
