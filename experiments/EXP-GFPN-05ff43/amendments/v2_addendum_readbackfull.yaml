  changes:
    RL-1_launch_level_readback_record:
      amends: readbackcover RB-1 and RB-2 (additive); valueclose VC-1 (class gamma, value class epsilon; additive)
      text: >-
        NORMATIVE. Each r4 entry (v2 and a1), after importing the frozen
        modules and installing SE-3 (and, in the a1 entry, HR-3), and before
        dispatching any command, replaces the module attribute
        v2_solver.run_child by the LAUNCH RECORDER, a recording pass-through.
        The launch recorder:
        (a) calls the ORIGINAL frozen function object, captured at install
            (module v2_solver, qualname run_child, code file
            implementation-v2/v2_solver.py, first line 149), with identical
            positional and keyword arguments;
        (b) returns the object that call returned, unchanged and uncopied; if
            the call raises, it re-raises the same exception after recording;
        (c) before returning or re-raising, appends one LAUNCH RECORD to the
            run-root solver-events.json under the top-level key
            launch_records, in call order, and makes it durable before it
            returns (written by the layer's single event writer, which
            rewrites the file atomically). A launch record carries, copied
            from the returned record and the call's arguments and from nothing
            else:
            - ordinal; tag (the basename of the stdout_path argument); argv as
              the returned record carries it;
            - cap_bytes_requested;
            - rlimit_as_child_getrlimit as the returned record carries it
              (v2_solver.py 227), else the literal "absent" together with
              child_rlimit_report and refusal_reason as the record carries
              them;
            - outcome, and returncode where the record carries it;
            - child_created: true if the returned record carries
              child_rlimit_report (a fork happened), false otherwise (the
              refusals before fork, v2_solver.py 153-169);
            - raised: null, or the exception's type name;
            - the calling frame's file, function and line, and UTC start and
              end with microseconds (report-only; epsilon).
        (d) It RECORDS ONLY. No value it records selects a result, triggers a
            re-solve, changes a class, delays or reorders a launch, or alters
            argv, env, cwd, cap, timeout, lock or count_instructions. It adds
            no sleep and no guard. A recording failure is an SE-2 (4)
            consistency violation (package failed as implementation_error,
            never a result).
        (e) SE-3 (v2_driver.solve), HR-3 (a1_health.run_system), P-B and the
            RB-1 recording are unchanged and reach the frozen launch through
            it. RB-1's attempt records stay as readbackcover words them.
    RL-2_pass_through_calls_at_S-1:
      amends: readbackcover RB-1 (makes explicit; additive)
      text: >-
        NORMATIVE. RB-1's "EVERY attempt of EVERY wrapped call at S-1" is
        read, and implemented, as also covering every call that reaches the
        SE-3 entry with gb_only true (the pass-through the r3 layer counts
        apart, r3_resolve.py 382-387). For each such call the r4 wrapper
        records, in a PASS-THROUGH RECORD of solver-events.json (under
        passthrough_records, not an attempt record, and counted apart as r3
        counts it), RB-1 (a)-(d) copied from the result the frozen solve()
        returned: the tag and its retained .ms.out; result["solver"]
        ["rlimit_as_child_getrlimit"] or "absent"; result["threads_executed"]
        or "absent"; the frozen outcome class. Pass-through behaviour is
        otherwise unchanged. A pass-through record is never an SC-4 row: RB-3
        enumerates attempt records, and the carried SC-4 selection excludes
        every `-g` argv (r3_check_run.py 136).
    RL-3_collector_source_d_and_accounting:
      amends: readbackcover RB-2 (additive)
      text: >-
        NORMATIVE. RB-2's de-duplicated union gains (d) the
        rlimit_as_child_getrlimit pair of every launch record, and (e) of
        every pass-through record. resources.child_readback_accounting is
        computed PER LAUNCH: the number of capped children evidenced is the
        number of launch records with child_created true; for each, the
        sources (a)-(e) in which its pair was found; the named list of launch
        records with child_created true whose pair is "absent" (the ERR
        setrlimit branch), each with its child_rlimit_report; and the named
        list of RECORDER GAPS, i.e. child files in the package
        (child/*.meta.json, solver/*.ms.log, health/, comparator/, pari/)
        whose launch has no launch record. Recorded and reported, gating
        nothing by itself. The frozen checker is UNCHANGED; its cap
        comparison of every collected entry against
        child_rlimit_as_requested_bytes applies to every source.
    RL-4_admission_on_every_read_package_checker_verdict:
      amends: readbackcover RB-4 (additive); r3 R-8 as carried
      text: >-
        NORMATIVE. In addition to RB-4, the r4 run wrapper admits a package
        that reads, or is required to follow, another package of the r4
        lineage only if the r4 checker (the frozen checker in its own process
        plus the r4 checks), run by the wrapper at admission time on EACH such
        package, exits 0. This covers: every `requires` entry of either r4
        plan (R-8, whose existence test stays); the build package a cells
        package loads (v2_driver._load_build); the prior m = 5 package an
        m = 4 cells package reads (_prior_cells, _condition_met); every
        package the aggregate and aggregate_a1 read; and every further
        cross-package read of an r4-lineage package that the successor census
        lists (RLR-4). The admitted package's manifest records
        gate.required_package_checker per read package (command, exit status,
        output verbatim). A non-zero exit refuses the package and is
        recorded; the dependent chain STOPS at an impediment for a new
        Coordinator decision, and it is never evidence. Reads of archived
        packages outside the r4 lineage that are bound by hash
        (RUN-GFPN-61bba9 by anchor-identity; RUN-GFPN-ac4487 by REG-1) are
        unchanged. R-12 (contingency) is unchanged.
    RL-5_value_classes_and_permitted_replacements:
      amends: healthresolve HR-3 (the closed list of permitted replacements); readbackcover RB-7 (additive)
      text: >-
        - HR-3's complete set of permitted in-process function replacements
          becomes: v2_driver.solve (SE-3, both entries), a1_health.run_system
          (HR-3, a1 entry), v2_solver.run_child (RL-1, both entries), and
          v2_common.curve_order_pari under paristack P-B only. Nothing else.
        - INSTALL READ-BACK: before any command, each entry checks that
          v2_solver.run_child is the RL-1 recorder, that the recorder's
          captured original is the frozen function (module v2_solver,
          qualname run_child, code file implementation-v2/v2_solver.py,
          first line 149), and that the SE-3 and HR-3 wrappers' captured
          originals are unchanged; otherwise it exits 2 before any command
          (as RC-3 (d)). The read-back is recorded with the HR-3 read-back
          (pari-stack.json `redirections`) and in the manifest.
        - The launch recorder is class gamma with clause RL-1 (valueclose
          VC-1), bounded to copying what RL-1 lists. Launch records and
          pass-through records are value class epsilon (SE-2 (5) recording),
          read at E1-E4 only by the RB-2 / RL-3 collector (a K-2 derivative,
          effect E5), the RB-3 enumeration (E6), REG-1's SE-4 (e) test
          (unchanged) and the r4 checks' consistency tests.
        - For the S-3 callgrind child, the recorder's copy of its read-back is
          a K-2-derivative copy of V-3 (records only); CC-3 stays the only
          disposition of V-3 at E2.
        - DV-11's VC-3 inventory lists the recorder and every reader of launch
          and pass-through records with exactly one class; any other r4
          consumer of those values at E1-E4 is a DV-11 STOP.
    RL-6_development_checks:
      amends: readbackcover RB-5 DV-18 (additive)
      text: >-
        DV-18 is extended, on the DELIVERED r4 code, in the same development
        world rules as RB-5 (a)-(b) (scratch directory outside
        experiments/EXP-GFPN-05ff43/runs/, no reserved id, a development
        label):
        (c') for DV-18 (a) `controls` and (b) `anchor-identity`, in addition to
             RB-5 (c): every launch record with child_created true carries a
             pair equal to the cap; RL-3 lists no recorder gap; for (b), the
             anchor_comparator_system pass-through record carries the pair
             and the threads value.
        (e)  the frozen `controls-a1` command is run ONCE through the delivered
             r4 a1 entry and r4 run wrapper at the ladder prime the successor
             census names under RLR-7, with RB-5 (c)'s requirements and (c'):
             the frozen a1 checker exits 0; the r4 checks pass; no evidenced
             child without a read-back and no recorder gap; SC-4 has a row for
             every recorded ok S-1 attempt with a retained output (the 2 calls
             at a1_driver.py:166) and accounts every S-2 attempt the health
             report records.
        (f)  RECORDER BRANCH COVERAGE: with the RL-1 recorder installed over
             the frozen run_child in a scratch world, (i) one real trivial
             capped child killed by the frozen timeout (a development program
             that outlives the development timeout_s passed to it;
             count_instructions false) and (ii) one real trivial capped child
             that exits nonzero each yield a launch record with
             child_created true and a pair equal to the cap; and, with a
             development stand-in in place of the original (never in any
             package), (iii) a refusal before fork yields child_created false,
             (iv) a record without a pair (the ERR setrlimit shape) yields
             "absent" with the report, and (v) a raise is recorded and
             re-raised unchanged.
        (g)  INSTALL READ-BACK: a copy of each r4 entry with the RL-1
             replacement omitted exits 2 before any command.
        STOP (VA-12 (b) re-pointed) on any failure of (c'), (e), (f) or (g).
        Every DV-18 output is a DEVELOPMENT OBSERVATION: never a gate package,
        never a result, never compared with a gate package for selection,
        never a reason to re-run anything. Its values at development primes
        are toy harness values and never evidence about D.
    RL-7_REG-1_unchanged:
      amends: nothing
      text: >-
        UNCHANGED. DEC-20260924-650068 RBR-4 (b) ruled REG-1 of an r4 G1
        against RUN-GFPN-ac4487 well defined under RB-1; the same holds for
        launch and pass-through records: solver-events.json stays outside
        REG-1's compared sets by the globs (not by an exclusion); the SE-4 (e)
        test reads the candidate's file (exists, parses, the top-level
        consistency flag, the S-1 / S-2 events' consistency records) and
        quotes it verbatim; the added records add content and one more cause
        of the consistency flag (a recording failure), which can only fail
        REG-1, never pass it. No exclusion is added; X1..X17 unchanged.
    RL-8_binding_ids_ceiling:
      amends: readbackcover RB-6 (b) (count only)
      text: >-
        R-1 binds ELEVEN amendment hashes: the nine of DEC-20260924-e52eec
        VA-1, readbackcover's
        dcdb08451ec2d57f731d1ed826d58d2cf014d797092c44c9b7de8374af1cb84e, and
        this draft's addendum_sha256. protocol_version "2-r4" / "2-a1-r4".
        Each r4 plan's repair block names the eleven with standing, RB-1..RB-8
        and RL-1..RL-8. Paths, the 42 fresh ids minted and --checked by the
        stage, the 162 refused retired ids, the forbidden task ids of RB-6 (d),
        the ceiling of 48 packages over the ten plans, and RB-8's launch form
        are UNCHANGED.
    unchanged: >-
      Every scientific rule: arms, cells, streams, targets, fixtures F-1..F-4,
