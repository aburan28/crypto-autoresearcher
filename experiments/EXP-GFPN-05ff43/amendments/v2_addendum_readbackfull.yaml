  pre_approval_readings:
    definitions: >-
      CAPPED CHILD, as readbackcover defines it. BRANCH: ok, refused_meta,
      no_meta (timeout, memory_exhausted, crash, nonzero exit, pre-exec
      mismatch), ssf_earlier, recorded, passthrough, as the archived census
      defines them (readback-census.md 170-182), plus refused_before_fork (no
      child is created) and raised (the frozen function raises). READ-BACK
      SOURCE: RB-2 (a)-(c) as readbackcover words them, and RL-3 (d) launch
      records and (e) pass-through records. THE ARCHIVED CENSUS is
      TASK-20260924-bf5724 as archived by TASK-20260924-a01341. THE SUCCESSOR
      CENSUS is the zero-run, zero-solve census TASK-20260924-cab04e as
      archived by TASK-20260924-ddfb69.
    RLR-5_integrity:
      order: 1
      text: >-
        APPLIED FIRST. The approval act waits (no reading is applied) if any
        of these fails, as recorded in the archive receipts: this draft's
        bytes equal the addendum_sha256 in TASK-20260924-833cde's receipt;
        readbackcover equals
        dcdb08451ec2d57f731d1ed826d58d2cf014d797092c44c9b7de8374af1cb84e; the
        nine VA-1 files hash to DEC-20260924-e52eec bound_hashes; the archived
        census files equal the TASK-20260924-a01341 receipt's path_sha256; the
        successor census files equal the TASK-20260924-ddfb69 receipt's
        path_sha256; the 22 phase-A and 801 phase-B paths of
        TASK-20260924-f1fb0e equal their receipts; no file under
        experiments/EXP-GFPN-05ff43/implementation*/ and no trial plan has
        changed since dd103455380238ec2f20d17414de687acdcc822a.
    RLR-1_every_capped_child_on_every_branch_has_a_source:
      order: 2
      text: >-
        READING: approvable as written ONLY IF, for every capped-child
        instance of the archived census's RBR-1 table (I-01..I-26 with the
        I-24 variants) and every further capped launch the successor census
        finds, and for EVERY branch on which a child is created, at least one
        read-back source exists under RB-1, RB-2 (as incorporated), RL-1,
        RL-2 and RL-3 as worded. The successor census states, per reachable
        run_child call site and per branch, whether the frozen run_child
        returns (does not raise) and whether the record it returns carries
        rlimit_as_child_getrlimit. A created child with NO source on some
        branch makes the draft NOT approvable as written. NOT A BAR: the ERR
        setrlimit branch (no pair is ever taken; RL-1 records "absent" and
        RL-3 names it); grandchildren; refused_before_fork (no child); a child
        found in two sources.
    RLR-2_recorder_reach:
      order: 3
      text: >-
        READING: approvable as written ONLY IF every reachable run_child call
        site (the archived census's six: v2_driver.py 101, 166, 650;
        v2_solver.py 517; a1_health.py 147; a1_pari.py 96; and any further one
        the successor census finds) resolves run_child at CALL time through
        the module attribute v2_solver.run_child (an attribute lookup on the
        module object, or a global-name lookup inside module v2_solver), so
        that RL-1's replacement intercepts it; AND no module either r4 entry
        imports binds the frozen run_child object to another name, default
        argument, container, closure or class attribute before the entries
        install RL-1 (an import-time capture). A call site that is not
        intercepted makes the draft NOT approvable as written.
    RLR-3_pass_through_and_SC-4:
      order: 4
      text: >-
        READING: approvable as written ONLY IF (a) every gb_only S-1 call any
        command reaches returns to the SE-3 entry a result carrying
        result["solver"] with the pair and result["threads_executed"] (the
        archived census I-09, I-10 and threads table say so; the successor
        census confirms from code), and (b) the carried SC-4 selection
        excludes every `-g` argv, so that no pass-through record can become
        an SC-4 row, and RL-1..RL-3 change no wrapped call's enumeration
        (archived census RBR-2 carries over).
    RLR-4_cross_package_admission:
      order: 5
      text: >-
        READING: approvable as written ONLY IF
        (a) every read, by any command of either plan or by the r4 wrapper, of
            the recorded result of another package of the r4 lineage (the
            census lists each: wrapper predicates and driver-level reads,
            with file, line and field) is covered by RB-4 or RL-4 as worded;
            AND
        (b) for each kind of package so read, no correctly recorded outcome
            that a dependent package's frozen logic is designed to act on (for
            example an m = 5 cell recorded not_measured, read by
            "m5_not_measured", v2_driver.py 1119-1126) is one on which the
            frozen checker or an r4 check as specified exits non-zero by
            design. The census reads the frozen checkers' sources to state,
            per such outcome, whether any item fails it.
        A read not covered, or a planned basis outcome that the checker fails
        by design, makes the draft NOT approvable as written. NOT A BAR: reads
        of archived packages outside the r4 lineage bound by hash
        (RUN-GFPN-61bba9, RUN-GFPN-ac4487), named with their binding; R-12's
        failure_class read (DEC-20260924-650068 R-RB3-R-12 stands).
