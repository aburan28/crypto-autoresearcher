# AMD-EXP-GFPN-05ff43-20260924-readbackfull  --  DRAFT, NOT APPROVED
#
# The SUCCESSOR DRAFT that DEC-20260924-650068 orders after the DRAFT
# AMD-EXP-GFPN-05ff43-20260924-readbackcover (sha256
# dcdb08451ec2d57f731d1ed826d58d2cf014d797092c44c9b7de8374af1cb84e) was
# decided NOT APPROVABLE AS WRITTEN under its own reading RBR-1: the archived
# read-back census (TASK-20260924-bf5724, snapshot TASK-20260924-a01341) found
# - I-10, the gb_only solve anchor_comparator_system (v2_driver.py:711), with
#   no read-back source unless RB-1 is read to cover pass-through calls, which
#   it does not say; and
# - builder children with NO source on failure or refusal branches: I-11..I-14
#   (controls, no_meta), I-15 (controls, refused_meta and no_meta), I-20 (cells,
#   both plans, refused_meta and no_meta), I-25 (controls-a1, refused_meta and
#   no_meta).
# RBR-1: "a successor draft adds recording at that child."
#
# It is an ADDITIVE addendum. It INCORPORATES readbackcover in full (RB-1..RB-8
# and everything readbackcover incorporates, valueclose with VA-1..VA-12
# included), UNCHANGED, except what RL-1..RL-8 add or make explicit. Only what
# is ADDED is written here.
#
# THE IDEA. Every capped child is launched through ONE frozen function,
# v2_solver.run_child (the census: the only reachable frozen function that sets
# RLIMIT_AS in a child). It "never raises for child failures" and returns a
# record that carries the getrlimit pair on every branch on which the child
# reported it (v2_solver.py 151, 220-227). Recording that record at launch
# covers every capped child on every branch by construction, instead of site
# by site. It needs ONE further in-process function replacement, which this
# draft adds to healthresolve HR-3's closed list, with an install read-back.
#
# WHAT IT IS NOT: approved, evidence, a prediction, a hypothesis status move, a
# security statement, or a change to any frozen byte, msolve / valgrind /
# callgrind_annotate / gp / Sage binary, flag or argv, REG-1 item or exclusion,
# K, spacing, SF-2 (c) / HR-6 cap, DV-17 predicate, health-check seed, pattern,
# expected D or pass predicate, watchdog, envelope value, arm, cell, stream or
# reading rule. Approval is a later, separate Coordinator decision (reserved
# DEC-20260924-a789e1 under reserved TASK-20260924-02e34b, ledger archive
# reserved TASK-20260924-1ae107), which reads the ARCHIVED bytes of this file
# (addendum_sha256 in TASK-20260924-833cde's receipt) and of the successor
# census (TASK-20260924-cab04e, snapshot TASK-20260924-ddfb69).
# =============================================================================
