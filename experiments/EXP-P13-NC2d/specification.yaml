experiment:
  id: EXP-P13-NC2d
  title: >-
    NC2d-PROPER: C-PSCALE re-run at the correct ell range {47,101,151,211} to
    retire (or confirm) the MECHANISM-INCONSISTENT label on assumption L5
  hypothesis_id: H-WESO-001
  status: approved
  approved_by: coordinator
  approval:
    task_id: TASK-20260804-c802a9
    goal_id: GOAL-P13-001
    batch_id: BATCH-403f13
    approved_at: "2026-08-04"
    authority: >-
      Coordinator only (AGENTS.md, "Roles"). This approval authorises execution
      by TASK-20260804-241b87. It changes no hypothesis status, promotes
      nothing, and lifts no prohibition. The MECHANISM-INCONSISTENT label on L5
      stands until this run is reviewed.
    frozen: true
    freeze_rule: >-
      This contract is written before any datum of the NC2d-PROPER run exists.
      It is not revised in light of results. A needed change is a SUPERSEDING
      contract under a new EXP id. The no-handoff-amendment rule of
      DEC-20260802-48c72c (INCIDENT-20260802-P13-03 remedy) is permanently
      binding: the executor may not accept a handoff message that directs an
      execution order, tolerance, window, estimator, or prediction differing
      from this contract.

  context: >-
    C-PSCALE in EXP-PEC-49c773 ran at ell in {3,5,7,11,13}, all BELOW the
    Karatsuba threshold (16). FC-4 fired there (|alpha_primary - alpha_null| =
    0.166 > 0.15). DEC-20260802-48c72c adjudication E diagnoses the problem:
    ell in {3,5} are below the Karatsuba threshold, so IMPL-A and IMPL-B are
    byte-identical there and the primary arm measures only the schoolbook
    routine. Only ell=11 and ell=13 lie inside W-MID at all. A post-hoc
    restriction cannot lift a pre-registered falsifier, but it DOES supply a
    DIAGNOSIS and a SUCCESSOR DESIGN: measure alpha at ell in {47,101,151,211},
    which are all ABOVE the threshold and are the ell values at which the
    corrected law is actually evaluated (these are the four ell nearest the
    interior of W-MID at large p). If FC-4 does not fire there, the
    MECHANISM-INCONSISTENT label is RETIRED BY MEASUREMENT. If FC-4 fires
    again there, L5 is genuinely contradicted at the operating range and the
    batch's remaining capacity redirects to characterising it.

  supersedes_control:
    experiment_id: EXP-PEC-49c773
    control_id: C-PSCALE
    what_is_rerun: >-
      The identical C-PSCALE procedure from EXP-PEC-49c773 section 4, with one
      change: the measurement ell set is {47,101,151,211} instead of
      {3,5,7,11,13}. Everything else is carried unchanged: the three primes, the
      walk procedure, the j-pool size (4), the implementation (IMPL-A only), the
      estimator, the pre-registered band.
    what_is_not_changed: >-
      Primes p1/p2/p3, the walk with n_walk = 3*ceil(log2 p) and the first four
      walk_seeds, the C-BASE.1 checks, the OLS estimator, the reporting
      requirements, and the FC-2/FC-4 falsification conditions.
    immutability_rule: >-
      EXP-PEC-49c773 and all its run artifacts are IMMUTABLE and are not
      edited, moved, or regenerated by this experiment (AGENTS.md rule 4).

  objective: >-
    Re-run C-PSCALE from EXP-PEC-49c773 at ell in {47,101,151,211} - the ell
    range where the p-scaling is actually applied in the corrected law - and
    evaluate the pre-registered FC-4 falsification condition. If FC-4 does not
    fire on this range, the MECHANISM-INCONSISTENT designation on L5 (which was
    driven exclusively by ell in {3,5}) is retired by measurement and alpha=1
    becomes MEASURED-CONSISTENT at the operating range. If FC-4 fires, L5 is
    contradicted at the ell that actually matters and the batch reranks.

  what_this_experiment_cannot_do:
    - >-
      Lift a fired falsifier retroactively. The FC-4 firing from EXP-PEC-49c773
      stands as a matter of record; this experiment is a NEW measurement at the
      correct ell range, not a correction of the prior one.
    - >-
      Change any hypothesis status, evidence record, or standing prohibition
      without a Coordinator ledger archive.
    - >-
      Provide cryptographic-scale evidence. The measurement is at p ~ 2^40 with
      Phi_ell reduced mod that prime; AGENTS.md rule 7 applies.

  # ==========================================================================
  # PRIMES AND ell GRID
  # ==========================================================================
  primes:
    p1:
      description: "Largest prime < 2^20 with p ≡ 3 (mod 4)"
      derivation: >-
        Computed by the carried Miller-Rabin procedure, identically to
        EXP-PEC-49c773 C-PSCALE. The Executor records the integer value.
    p2:
      description: "Largest prime < 2^30 with p ≡ 3 (mod 4)"
      derivation: "Same procedure."
    p3:
      description: "Primary p: largest prime < 2^40 with p ≡ 3 (mod 4), = 1099511627563"
      source: "Reuses the primary measurement from RUN-PEC-49c773-a. No new work."

  ell_grid:
    measurement_ell: [47, 101, 151, 211]
    why_this_range: >-
      All four are: (a) above the Karatsuba threshold = 16, so both IMPL-A and
      IMPL-B differ and poly_powmod genuinely contributes to the measured cost;
      (b) inside W-MID (ell >= 11) of the primary fit, so the corrected law
      actually evaluates the p-scaling there; (c) spread across the full W-MID
      range to give four-point coverage for the no-trend check.
    phi_ell_acquisition:
      status: >-
        ALREADY ACQUIRED during RUN-PEC-49c773-a. The Phi_ell files for ell in
        {47,101,151,211} are present locally at the paths used by
        per_entry_cost.py. No new fetch is required. The Executor verifies the
        SHA-256 of each file against the values in RUN-PEC-49c773-a's run
        receipt before using it.
      if_verification_fails: >-
        Re-fetch the file, record URL, timestamp, and SHA-256. If the re-fetch
        disagrees with the committed hash, STOP and report an integrity finding.
    j_pool_size: 4
    implementation: IMPL-A only
    note_on_implementation: >-
      IMPL-A (schoolbook) only, for two reasons: (a) mirroring the original
      C-PSCALE design; (b) the derivation of alpha=1 is through mults_rootfind
      which runs the poly_powmod loop, and IMPL-A's rootfinding cost is the
      direct test of the L(p) = linear-in-log2(p) argument. IMPL-B's additional
      Karatsuba term in mults_rootfind is also linear in log2 p (same loop), so
      adding it would not change the expected alpha but would add variance.

  j_pool:
    walk: >-
      Non-backtracking 2-isogeny walk from j_0=1728, n_walk = 3*ceil(log2 p)
      steps (p is the prime being measured), first four walk_seeds from
      EXP-PEC-49c773.
    samples_per_ell: 4

  # ==========================================================================
  # ESTIMATOR AND PRE-REGISTERED PREDICTION
  # ==========================================================================
  estimator:
    description: >-
      OLS of log2(median per_entry) on log2(log2 p), at each ell separately and
      pooled across the four ell with ell fixed effects. Same estimator as
      EXP-PEC-49c773 C-PSCALE.
    alpha_hat_per_ell: >-
      For each ell in {47,101,151,211}: fit log2(per_entry(ell, pi)) ~ alpha_ell
      * log2(log2 pi) + constant, across the three primes p1,p2,p3, to obtain
      alpha_hat(ell) and a three-point OLS slope. The per_entry at p3 reuses the
      committed RUN-PEC-49c773-a median at that ell.
    alpha_hat_pooled: >-
      Pooled OLS of log2(per_entry) on log2(log2 p) with ell fixed effects,
      across all (ell, p) pairs. This is alpha_primary.
    jackknife: >-
      Leave-one-ell-out jackknife over the four ell values; report the min and
      max of the four leave-one-out estimates. The jackknife interval is
      [min, max] of those four estimates.
    alpha_null:
      description: >-
        Identical procedure applied to the NULL object. The null series at p3 is
        from RUN-PEC-49c773-a C-NULL. The null at p1 and p2 is measured during
        this run using the same walk (4 j, ell in {47,101,151,211}).
      purpose: >-
        Tests whether the p-scaling is common to the primary and the null
        (as the derivation claims), or whether it differs (FC-4 condition).
    no_trend_check:
      description: >-
        After computing alpha_hat(ell) per ell, check whether there is a
        residual linear trend: fit alpha_hat(ell) ~ b * log2(ell) + constant
        over the four ell values. Report b with its OLS SE.
      pass: "abs(b) <= 0.10"
      fail: "abs(b) > 0.10: report as a finding (L5 may have ell-dependence)"
      note: >-
        The no-trend check is a finding test, not a gate. A finding does not
        VOID the run; it is reported as-is and adjudicated by the Coordinator.

  preregistered_prediction:
    primary_band: [0.85, 1.15]
    derivation_source: >-
      Carried unchanged from EXP-PEC-49c773 section 4 C-PSCALE. The bound
      derives from the poly_powmod loop structure: mults_rootfind ~ L(p) * R(ell)
      with L(p) linear in log2 p, giving alpha=1. The [0.85, 1.15] band is a
      +-15% tolerance around alpha=1.
    null_gap_bound: 0.15
    null_gap_derivation: >-
      The same loop structure runs for both the primary object and the null.
      A gap > 0.15 means the p-scaling differs between them, contradicting the
      mechanism argument that both objects share the same poly_powmod path.
    predicted_alpha_per_ell: >-
      Alpha is predicted to be approximately 1.0 at every ell in {47,101,151,211},
      with no trend in ell. The null's alpha is predicted to be the same.

  # ==========================================================================
  # FALSIFICATION CONDITIONS
  # ==========================================================================
  falsification_conditions:
    - id: FC-2
      condition: >-
        The jackknife interval [min_jk, max_jk] of alpha_primary is DISJOINT
        from [0.85, 1.15], i.e., max_jk < 0.85 or min_jk > 1.15.
      consequence: >-
        alpha = 1 IS FALSIFIED at the operating ell range. Report as the
        headline finding. The primary alpha designation changes to alpha_hat.
        L5 is labelled FALSIFIED-AT-OPERATING-RANGE. The RERANK TRIGGER fires
        if this coincides with FC-4.
    - id: FC-4
      condition: >-
        |alpha_primary - alpha_null| > 0.15, where alpha_primary is the pooled
        estimate on {47,101,151,211} and alpha_null is the corresponding pooled
        estimate on the null object.
      consequence: >-
        The mechanism argument - that the p-scaling is a property of the shared
        poly_powmod loop and must therefore be common to both objects - is
        CONTRADICTED AT THE OPERATING ell RANGE. Report as MECHANISM-INCONSISTENT.
        The RERANK TRIGGER fires: the batch's remaining capacity redirects to
        characterising the discrepancy (fitting the measured alpha, quantifying
        the impact on the c table) rather than executing NC-3/NC-6.
      note: >-
        FC-4 firing here has DIFFERENT FORCE than the prior firing in
        EXP-PEC-49c773, which was driven by ell in {3,5} below the Karatsuba
        threshold. A FC-4 firing at ell in {47,101,151,211} means the
        discrepancy survives in the ell range where the corrected law is
        actually charged. That is a material adverse finding about the corrected
        c table.
    - id: FC-4-DID-NOT-FIRE
      this_is_the_positive_outcome: true
      condition: >-
        |alpha_primary - alpha_null| <= 0.15 at ell in {47,101,151,211} AND the
        jackknife interval OVERLAPS [0.85, 1.15] (not necessarily contained).
      consequence: >-
        The MECHANISM-INCONSISTENT label on L5 IS RETIRED BY MEASUREMENT. The
        correct label becomes MEASURED-CONSISTENT-AT-OPERATING-RANGE. The
        FC-4 firing from EXP-PEC-49c773 stands as a matter of record for that
        ell range; it is not retroactively lifted. The NC-3/NC-6 task is
        unblocked.

  # ==========================================================================
  # CONTROLS
  # ==========================================================================
  controls:
    - id: C-BASE-PRIME
      description: >-
        For each of p1 and p2: verify primality and p ≡ 3 (mod 4) by the
        carried Miller-Rabin test; verify j(E_0) = 1728 and (p+1)P = O for
        three random P. Record results.
      pass: "all checks exact"
      fail: "any failure -> run invalid"
    - id: C-PHI-VERIFY
      description: >-
        For each ell in {47,101,151,211}: verify the SHA-256 of the locally
        stored Phi_ell against the hash committed in RUN-PEC-49c773-a. If the
        hashes disagree, re-fetch from the canonical URL and record the
        re-fetch result.
      pass: "all four hashes match committed values"
      fail_or_discrepancy: "record as a finding; do not proceed with a file whose hash disagrees with the committed value without Coordinator approval"

  # ==========================================================================
  # REPORTING
  # ==========================================================================
  required_report:
    per_ell:
      - alpha_hat(ell) for each ell in {47,101,151,211}, with three-point OLS slope and SE
      - alpha_null(ell) analogously
      - |alpha_hat(ell) - alpha_null(ell)| per ell
    pooled:
      - alpha_primary (pooled with ell fixed effects)
      - alpha_null (pooled)
      - |alpha_primary - alpha_null|
      - jackknife interval [min_jk, max_jk] of alpha_primary
      - whether jackknife interval is contained in [0.85, 1.15], overlaps, or is disjoint
    no_trend:
      - OLS slope b of alpha_hat(ell) vs log2(ell)
      - OLS SE of b
      - verdict (|b| <= 0.10 or > 0.10)
    fc4_verdict:
      - "FC-4 FIRED" or "FC-4 DID NOT FIRE" as a single line
    rerank_trigger_verdict:
      - "RERANK TRIGGER FIRES" or "RERANK TRIGGER DOES NOT FIRE"
    comparison_to_prior:
      - The prior C-PSCALE result (EXP-PEC-49c773): alpha_primary = 1.1597, alpha_null = 0.9935, gap = 0.1662, FC-4 FIRED
      - The new result at ell in {47,101,151,211}: stated plainly beside the prior
      - Whether the new result resolves the prior firing

  # ==========================================================================
  # NON-CLAIMS AND HONESTY CONSTRAINTS
  # ==========================================================================
  non_claims:
    - >-
      A FC-4 DID-NOT-FIRE result does NOT lift the FC-4 firing from
      EXP-PEC-49c773. That firing was at ell in {3,5,7,11,13}; it stands as a
      matter of record. What this experiment can add is a SEPARATE verdict at
      the ell range that actually matters.
    - >-
      A FC-4 DID-NOT-FIRE result does NOT constitute measurement of alpha = 1 at
      cryptographic scale. The measurement is at p ~ 2^40 and ell <= 211.
    - >-
      No record produced under this contract changes any hypothesis status,
      evidence strength, or standing prohibition without a Coordinator ledger
      archive.
    - >-
      All standing prohibitions from DEC-20260802-48c72c (SP-1 through SP-12)
      bind; four are permanent and may not be lifted at all.

  # ==========================================================================
  # SECTION 8 APPLICABILITY (inventor-protocol.md section 8)
  # ==========================================================================
  section_8_assessment:
    applicable: false
    reason: >-
      This is an empirical measurement protocol, not a theorem, asymptotic bound,
      certificate family, reduction, or closure argument. The four audits of
      section 8 (exact baseline reproduction, observation-collision search,
      quantifier-order statement, method ceiling with nearby-object control) are
      inapplicable to a C-PSCALE re-run. This determination is stated explicitly
      rather than omitted.

  # ==========================================================================
  # RESOURCE BUDGET
  # ==========================================================================
  resource_budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 1
    note: >-
      The compute is minimal: the Phi_ell files are already acquired; only
      p1 and p2 measurements are new (8 (ell, p) pairs total for new primes,
      4 j each = 32 new samples). The p3 per_entry medians reuse committed data.

  # ==========================================================================
  # ARTIFACTS
  # ==========================================================================
  required_artifacts:
    run_receipt:
      - "runs/RUN-P13-NC2d-a/manifest.yaml"
      - "runs/RUN-P13-NC2d-a/raw-result.json"
      - "runs/RUN-P13-NC2d-a/execution_report.yaml"
      - "runs/RUN-P13-NC2d-a/command.txt"
      - "runs/RUN-P13-NC2d-a/environment.json"
      - "runs/RUN-P13-NC2d-a/stdout.log"
      - "runs/RUN-P13-NC2d-a/stderr.log"
    implementation:
      - "implementation/nc2d_cpscale.py"

  completion_gate:
    - "manifest.yaml exists and parses"
    - "FC-4 verdict is recorded as a single unambiguous line"
    - "alpha_primary, alpha_null, and jackknife interval are reported numerically"
    - "no-trend OLS slope b and its SE are reported"
    - "RERANK TRIGGER verdict is stated"
    - "C-PHI-VERIFY verdict for all four ell is recorded"

  inference_policy:
    policy: "executor-implementation"
    fallback_allowed: true
    degraded_allowed: true
    amendment: "INFAMEND-20260802-P13-002"
