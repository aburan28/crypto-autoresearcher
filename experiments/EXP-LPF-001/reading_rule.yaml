        Z < 2 by construction (D1). This experiment has NO CERTIFIED POWER AGAINST A
        DEEP-TAIL-ONLY DEPARTURE IN EITHER DIRECTION AT EITHER CELL.
      V9_new_at_this_freeze: >-
        ANY DEPARTURE VISIBLE ONLY AT u ABOUT 6, i.e. Bsm = 40 at bits 16 and
        Bsm = 102 at bits 20. STAT-RATE-u@u_target=6 is struck, the rung was already
        underpowered by POW-LPF-1's pre-datum arithmetic (n * rho(6) about 2.6), and
