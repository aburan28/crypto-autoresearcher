          measured_counts: 'bits 16 uniform 4, bits 16 synth 3, bits 20 uniform 3, bits 20 synth 1.'
          fires: false
          margin: 'ZERO at bits 16 uniform under the cut written here. See identity_binomial_cut_record.'
          producing_arm: 'CALIBRATION ARM ONLY. Resolved FALSE at this freeze and cannot change.'
        leg_2_product_control:
          measured: 'OBJ-CTRL-PRODUCT detected under DET-LPF-1 by all seven statistic ids at both cells, 20 of 20 rejections each. Shifts on the retained certifying ids run from 251.07 to 1097.12 null sd.'
          fires: false
          producing_arm: 'CALIBRATION ARM ONLY. Resolved FALSE at this freeze and cannot change.'
        leg_3_dickman:
          measured_worst_relative_discrepancy: 1.5441749690432644e-05
          threshold: 0.01
          fires: false
          producing_arm: >-
            MEASUREMENT ARM. run_measurement calls the Dickman solver and emits its
            own reproduction report, so this leg is re-evaluated on the measurement
            run's own solve. It is the one L-5 leg an achievable measurement can
            still satisfy.
        honest_caveat: >-
          TWO OF L-5's THREE LEGS ARE ALREADY RESOLVED FALSE ON ARCHIVED CALIBRATION
          DATA AND CANNOT CHANGE. That is a property of a calibration-first design
          and is not concealed. L-5 was ATTAINABLE when the calibration ran - a
          higher identity count or an undetected product control were both
          achievable measurements that did not occur - and it remains reachable
