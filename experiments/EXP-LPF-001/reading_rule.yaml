  branch_structure:
    id: BRANCH-LPF-1
    substitution_only_attestation: >-
      The six branch conditions and dispositions below are QUOTED from
      specification.yaml branch_structure at spec sha256
      0d6c946fb84073feae47865da9b787b7d7ba459617834644680a06bf886d1cda. NO BRANCH IS
      ADDED, REMOVED, MERGED, REORDERED OR REWORDED. The `substituted_numbers` block
      under each branch supplies measured values into forms the contract already
      fixed and states nothing the contract does not. The reviewer is asked to
      confirm this by whitespace-normalised comparison of every condition and
      disposition string.
    precedence: 'L-0, then L-1, then L-5, then EXACTLY ONE of L-2, L-3, L-4.'
    no_branch_keys_on_a_ledger_status:
      verified: true
      method: >-
        Every one of the six conditions was read clause by clause at this freeze. No
        condition reads the status field of any hypothesis, experiment, evidence,
        decision or goal record. The dispositions of L-2, L-3 and L-4 NAME status
        consequences for H-LPF-001, which is their proper place and is not a
        condition. This is the prospective half of OPEN-BATCH023-B and it holds.
    branches:
    - id: L-0
      condition: >-
        Any integrity failure - a short arm, a degenerate-draw count outside its
        declared band, a factor_base_sha256 mismatch against the EXP-EQD-001
        archived value, a DRIVER_SHA256 mismatch across the calibration/measurement
        boundary, a factorization-verification failure on any sample, an untraceable
        threshold, a stream collision between the calibration and measurement
        streams, the real_object_touched tripwire true in the calibration, or any
        timeout, crash, resource exhaustion or budget cancellation.
      disposition: >-
        THE RULE IS SUSPENDED. INSTRUMENT OR INFRASTRUCTURE FAILURE, never a
        mathematical result in either direction. H-LPF-001 does not move. No
        evidence record asserts any direction.
      substituted_numbers:
        expected_pairs_per_arm_per_cell: 130816
        factor_base_sha256_assertion: 'equality with the EXP-EQD-001 archived value, asserted by the driver per cell before any statistic is computed'
        driver_sha256: 786aeb0550d75fa3d0785aefbe50b121a24cacae584a4cadd79902c464722d65
        factorization_verified_fraction_required: 1.0
        stream_disjointness: >-
          Calibration stream offsets 100000 through 700000 against 900000 for
          measure_uniform_ks2; each seed is MASTER_SEED + offset + bits with bits in
          {16, 20}, nearest gap 199984, so no collision is reachable.
        threshold_traceability: >-
          Every band in this file names its array, its cell, its statistic id, its
          arm and its ascending rank. No threshold in this rule is untraceable.
        producing_arm: 'MEASUREMENT ARM (the run''s own integrity records), with the calibration-side tripwire already recorded false.'
    - id: L-1
      condition: >-
        THE ARTIFACT TELL. DECAY-LPF-1 fails - p_hat(u) is flat or non-monotone
        across the frozen u sweep on the real arm or on the uniform arm - or the
        PERTURB-MOVE-1 table records no movement at the top rung of a ladder the
        reading rule certifies.
      disposition: >-
        `inconclusive` ON THE INSTRUMENT with a named repair. A quantity that fails
        to decay when the parameter meant to destroy it increases is an artifact,
        not a finding (docs/inventor-protocol.md section 3).
      substituted_numbers:
        decay_leg_producing_arm: >-
          MEASUREMENT ARM for the real arm and for the fresh uniform arm. This is
          the leg the measurement can change and it is why L-1 is not decided in
          advance.
        decay_leg_calibration_state: >-
          On the calibration's OBJ-NULL-UNIF arm p_hat(u) is STRICTLY DECREASING
          across the five frozen rungs at both cells, verified by the validator
          against the archived 200-replicate means. The null does not fire L-1.
        movement_leg_producing_arm: >-
          CALIBRATION ARM ONLY. This leg reads already-archived data and is FALSE at
          this freeze by construction of the strikes - every certified ladder has a
          moving top rung. It cannot become true, and that is recorded as an honest
          property of the freeze rather than left implicit.
        certified_top_rung_minimum_absolute_shift: 1.5157382944804918
        certified_top_rung_minimum_location: 'OBJ-PLANT-SMOOTH, STAT-RATE-u@u_target=5, bits 20, gamma 0.05.'
    - id: L-5
      condition: >-
        APPARATUS FAILURE. The LPF-CAL-B identity count exceeds its frozen
        exact-binomial cut at either cell, OR OBJ-CTRL-PRODUCT is not detected by
        any certifying statistic at either cell, OR the driver's own Dickman
