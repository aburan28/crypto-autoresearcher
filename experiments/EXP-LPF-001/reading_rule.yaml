    RUN-LPF-001-measure remains gated on APPROVAL_DETERMINATION APPROVED in the
    TASK-20260801-055 snapshot receipt, and this file is not that gate.

  source_binding:
    specification_sha256: 0d6c946fb84073feae47865da9b787b7d7ba459617834644680a06bf886d1cda
    specification_commit: ba1567ee
    driver_sha256: 786aeb0550d75fa3d0785aefbe50b121a24cacae584a4cadd79902c464722d65
    calibration_snapshot_commit: 104d32faff09207740f980be3c7dc8faa3642110
    calibration_run_id: RUN-LPF-001-calib
    calibration_admissibility: >-
      ADMISSIBLE, returned by VAL-20260801-006 at TASK-20260801-051. The
      TASK-20260801-052 constraint "PROCEED ONLY IF TASK-20260801-051 RETURNED
      ADMISSIBLE" is satisfied.
    arrays_consumed:
