    status: 'NEW ANOMALY, opened by this freeze. Carried forward; routed to TASK-20260801-054.'
    finding_restated_with_the_measured_sequence: >-
      OBJ-PLANT-ROUGH / STAT-KS-DICK / bits 20 moves at an intermediate rung and
      then FAILS to move at the top rung. The measured shift sequence across
      gamma = 0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05 is -0.02048864,
      -0.04862445, -0.12221041, -0.35811835, -0.68709089, -1.40275045, -0.75872025
