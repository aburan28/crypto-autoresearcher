    - 'Any characterization of BATCH-021, BATCH-022, BATCH-023 or BATCH-024 as vacuous or worthless.'
    - 'Any edit to EV-EQD-001, EV-DS-001 through EV-DS-004, or to any EXP-DS-001, EXP-SMTH-001, EXP-EQD-001 or EXP-DEP-001 artifact.'

