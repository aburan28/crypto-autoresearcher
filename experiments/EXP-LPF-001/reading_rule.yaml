        by the retained statistics. The DETECTION floor under DET-LPF-1 at BOTH
        cells, from LPF_gamma_det_both_cells, is gamma = 0.002 for
        STAT-RATE-u@u_target=4, 0.005 for u_target=3, 0.01 for u_target=2 and 0.05
        for STAT-KS-DICK; STAT-RATE-u@u_target=5 is NONE_ON_LADDER at both cells.
      S2_rough_direction: >-
