      shift vector and its block indexing; the D9 sequence; the four top-rung
      movement profiles; the T_deep attainability numbers; every u_recomputed;
      every exact-binomial cut; and the L-2 / L-3 / L-4 null probabilities.

  # =====================================================================
  # 1. THE STOP-CONDITION CHECK, RUN BEFORE ANYTHING WAS FROZEN
  # =====================================================================
  stop_condition_check:
    id: STOP-RR052
    what_the_contract_makes_a_stop: >-
      ATTAIN-LPF-1 - "A BRANCH UNREACHABLE BY CONSTRUCTION IS A REVISE" - is the
      operative stop condition at this task. Its sharpest instantiation is
      ATTAIN-LPF-1 extension (iii) - a branch leg that reads only already-archived
      calibration data is satisfied or not before the measurement runs, and if it
      PRECEDES the substantive branches it makes them unreachable. The budget
      stopping_rules do not apply because this task authorizes and performs no run.
    checks:
    - check: L-1 second leg pre-firing
      text: >-
        L-1 fires if "the PERTURB-MOVE-1 table records no movement at the top rung
        of a ladder the reading rule certifies". This leg reads ONLY archived
        calibration data and L-1 precedes L-2, L-3 and L-4. If this reading rule
        certified any (family, cell, statistic) ladder whose gamma = 0.05 row
        carries LPF_movement_beyond_noise_flag false, L-1 would be satisfied before
        the measurement ran and L-2, L-3 and L-4 would be unreachable by
        construction - a REVISE and a non-execution.
      result: >-
        DOES NOT FIRE. Every ladder this rule certifies has a moving top rung, by
        the strikes recorded in certification below. The leg evaluates FALSE at the
        freeze and cannot be made true by the measurement arm. THAT IS THE STRIKE
        MECHANISM WORKING AS DESIGNED, not a defect, and it is recorded rather than
        left to be discovered.
    - check: CERT-LPF-1 exhaustion
      text: 'The certifying set is emptied by the strikes, leaving L-2 and L-3 without content.'
      result: >-
        DOES NOT FIRE. Five of the seven statistic ids are retained
        (STAT-RATE-u at u_target 2, 3, 4 and 5, and STAT-KS-DICK), each moving at
        the top rung of at least one ladder at BOTH cells, with measured shifts
        from 1.5 to 198 null sd. Two ids are struck.
    - check: TAIL-LPF-1 both-directions-absent strike
      text: 'If BOTH directional demonstrations for T_deep are absent the statistic is struck by TAIL-LPF-1 itself.'
      result: >-
        DOES NOT FIRE ON ITS OWN TERMS - the upward demonstration is present
        (OBJ-CTRL-PRODUCT above T_hi at both cells) and only the downward one is
        absent. STAT-TAIL-DEEP is nevertheless struck, by the DIFFERENT and
        independently sufficient CERT-LPF-1 ladder rule. See tail_deep_disposition.
    - check: any branch unreachable by construction
      result: >-
        NO. All six branches are reachable - see ATTAIN-RR-LPF-1. L-2, L-3 and L-4
        are DEMONSTRATED-REACHABLE with measured numbers; L-0 and L-5 are
        REACHABLE-IN-PRINCIPLE with the honest caveat that two of L-5's three legs
        are already resolved FALSE on archived calibration data and cannot change.
    - check: budget or infrastructure stop
      result: 'NOT APPLICABLE. No run is authorized or performed by this task.'
    verdict: >-
      THE STOP CONDITION DOES NOT FIRE. RR-LPF-1 AND ATTAIN-RR-LPF-1 ARE FROZEN.
      The freeze is possible only because the two statistics that no rung can move
      are struck; had they been retained, L-1 would have pre-fired and this task
      would have ended in a recorded non-execution instead.

  # =====================================================================
  # 2. THE CERTIFYING SET AFTER THE MEASURED STRIKES (CERT-LPF-1)
  # =====================================================================
  # Shape note: the driver's schema declares certifying_set_retained at the
  # CONTRACT granularity of statistic_family members. The id-level list is
  # carried separately.
  certifying_set_retained:
  - STAT-RATE-u
  - STAT-KS-DICK

  certifying_statistic_ids_retained:
  - 'STAT-RATE-u@u_target=2'
  - 'STAT-RATE-u@u_target=3'
  - 'STAT-RATE-u@u_target=4'
  - 'STAT-RATE-u@u_target=5'
  - STAT-KS-DICK

  certifying_statistic_ids_struck:
  - 'STAT-RATE-u@u_target=6'
  - STAT-TAIL-DEEP

  non_certifying_by_the_contract_and_not_by_a_strike:
  - id: STAT-KS2-CAL
    reason: >-
      DECLARED NON-CERTIFYING IN ADVANCE by ABS-REL-LPF-1 and CERT-LPF-1, for both
      limbs, because a two-sample statistic is blind by construction to any
      deviation both arms share (U1). It carries no band, no cut and no reject
      boolean here, and no branch of RR-LPF-1 reads it. It is also UNCOMPUTED in
      the calibration, which is the substance of OPEN-LPF049-A below.

  certification:
    id: CERT-RR052
    rule_applied_verbatim: >-
      CERT-LPF-1 - "A member that does not move on any rung of either ladder is
      STRUCK FROM THE CERTIFYING SET BY RR-LPF-1 at freeze time, with the strike
      recorded and justified, and its non-firing may never be reported as evidence
      about the intermediates." PERTURB-MOVE-1 - "RR-LPF-1 may certify power at a
      rung only where that table records a shift beyond noise. A RUNG WITH NO
      RECORDED MOVEMENT IS UNCERTIFIED. A FAMILY WHOSE TOP RUNG SHOWS NO MOVEMENT
      IS STRUCK FROM THE CERTIFIED LIST BY THE READING RULE RATHER THAN REPORTED AS
      LOW POWER."
    movement_criterion: >-
      LPF_movement_beyond_noise_flag, i.e. |plant_mean - null_mean| / null_sd >= 1
      in units of the MEASURED null standard deviation over the 200 LPF-CAL-A
      replicates at that cell, one row per (family, rung, cell, statistic) in
      results/calib/perturbation_movement_report.json. The alternative
      range-based reading recorded in every row is NOT used here and is NOT a cut;
      the validator confirmed the two readings agree on every inert statistic.
    top_rung_movement_table_gamma_0_05:
      units: measured null standard deviations, signed, read off the archived table
      'OBJ-PLANT-SMOOTH bits 16': {'STAT-RATE-u@u_target=2': 25.38211814958014, 'STAT-RATE-u@u_target=3': 70.69803425039191, 'STAT-RATE-u@u_target=4': 170.3398684821999, 'STAT-RATE-u@u_target=5': 4.928982381230005, 'STAT-RATE-u@u_target=6': -0.29042539371316506, 'STAT-KS-DICK': -4.277881482048617, 'STAT-TAIL-DEEP': -0.033754172769120405}
      'OBJ-PLANT-ROUGH bits 16': {'STAT-RATE-u@u_target=2': -11.247560419591414, 'STAT-RATE-u@u_target=3': -5.3454001367869255, 'STAT-RATE-u@u_target=4': -1.7006351034527154, 'STAT-RATE-u@u_target=5': -0.8291589260003631, 'STAT-RATE-u@u_target=6': -0.40896637073894554, 'STAT-KS-DICK': -4.198668668884978, 'STAT-TAIL-DEEP': -0.05634735253472052}
      'OBJ-PLANT-SMOOTH bits 20': {'STAT-RATE-u@u_target=2': 23.97639267785667, 'STAT-RATE-u@u_target=3': 66.4325394132197, 'STAT-RATE-u@u_target=4': 198.1358444438846, 'STAT-RATE-u@u_target=5': 1.5157382944804918, 'STAT-RATE-u@u_target=6': -0.4535086982265092, 'STAT-KS-DICK': 11.846436987916968, 'STAT-TAIL-DEEP': -0.24806266201390997}
      'OBJ-PLANT-ROUGH bits 20': {'STAT-RATE-u@u_target=2': -11.20630412294969, 'STAT-RATE-u@u_target=3': -4.179625884671969, 'STAT-RATE-u@u_target=4': -1.6050787109131792, 'STAT-RATE-u@u_target=5': -0.46233306936416657, 'STAT-RATE-u@u_target=6': -0.48091103648792977, 'STAT-KS-DICK': -0.7587202548567625, 'STAT-TAIL-DEEP': -0.3379820826156079}
      provenance: >-
        Rows 49-55, 98-104, 154-160 and 203-209 of the 210-row table in row order
        (per cell - OBJ-CTRL-PRODUCT, then OBJ-PLANT-SMOOTH at the seven frozen
        rungs, then OBJ-PLANT-ROUGH at the seven frozen rungs, each with the seven
        statistic ids in statistic_ids(bits) order). Re-derived in this session
        from the archived file and consistent with the validator's row-by-row
        recomputation.
    certified_ladders:
      note: >-
        A ladder is (family, cell, statistic). It is CERTIFIED only if its top rung
        gamma = 0.05 moves. Per-rung power is certified only at rungs whose own row
        moves; rungs below the movement floor are UNCERTIFIED and are listed as
        such.
      'OBJ-PLANT-SMOOTH':
        'STAT-RATE-u@u_target=2': {bits_16: certified, bits_20: certified, moving_rungs_bits_16: [0.002, 0.005, 0.01, 0.02, 0.05], moving_rungs_bits_20: [0.005, 0.01, 0.02, 0.05]}
        'STAT-RATE-u@u_target=3': {bits_16: certified, bits_20: certified, moving_rungs_bits_16: [0.001, 0.002, 0.005, 0.01, 0.02, 0.05], moving_rungs_bits_20: [0.002, 0.005, 0.01, 0.02, 0.05]}
        'STAT-RATE-u@u_target=4': {bits_16: certified, bits_20: certified, moving_rungs_bits_16: [0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05], moving_rungs_bits_20: [0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05]}
        'STAT-RATE-u@u_target=5': {bits_16: certified, bits_20: certified, moving_rungs_bits_16: [0.02, 0.05], moving_rungs_bits_20: [0.05]}
        'STAT-RATE-u@u_target=6': {bits_16: STRUCK, bits_20: STRUCK, moving_rungs_bits_16: [], moving_rungs_bits_20: []}
        'STAT-KS-DICK': {bits_16: certified, bits_20: certified, moving_rungs_bits_16: [0.02, 0.05], moving_rungs_bits_20: [0.02, 0.05]}
        'STAT-TAIL-DEEP': {bits_16: STRUCK, bits_20: STRUCK, moving_rungs_bits_16: [], moving_rungs_bits_20: []}
      'OBJ-PLANT-ROUGH':
        'STAT-RATE-u@u_target=2': {bits_16: certified, bits_20: certified, moving_rungs_bits_16: [0.005, 0.01, 0.02, 0.05], moving_rungs_bits_20: [0.005, 0.01, 0.02, 0.05]}
        'STAT-RATE-u@u_target=3': {bits_16: certified, bits_20: certified, moving_rungs_bits_16: [0.01, 0.02, 0.05], moving_rungs_bits_20: [0.02, 0.05]}
        'STAT-RATE-u@u_target=4': {bits_16: certified, bits_20: certified, moving_rungs_bits_16: [0.05], moving_rungs_bits_20: [0.05]}
        'STAT-RATE-u@u_target=5': {bits_16: STRUCK, bits_20: STRUCK, moving_rungs_bits_16: [], moving_rungs_bits_20: []}
        'STAT-RATE-u@u_target=6': {bits_16: STRUCK, bits_20: STRUCK, moving_rungs_bits_16: [], moving_rungs_bits_20: []}
        'STAT-KS-DICK': {bits_16: certified, bits_20: STRUCK, moving_rungs_bits_16: [0.01, 0.02, 0.05], moving_rungs_bits_20: []}
        'STAT-TAIL-DEEP': {bits_16: STRUCK, bits_20: STRUCK, moving_rungs_bits_16: [], moving_rungs_bits_20: []}
    strikes:
    - id: STRIKE-1
      target: 'STAT-TAIL-DEEP, struck from the certifying set at both cells'
      measured_basis: >-
        0 of 28 plant rung-cell rows carry a movement flag; the largest absolute
        shift over all 28 is 0.3379820826156079 null sd, at OBJ-PLANT-ROUGH
        gamma 0.05 bits 20. Under the tighter paired yardstick the validator
        applied (sd/sqrt(20), base-20 null mean) the largest excursion is 0.797,
        still below one.
      structural_basis_D1: >-
        THE INERTNESS IS STRUCTURAL AND NOT LOW POWER, AND THAT DISTINCTION IS
        LOAD-BEARING. The validator regenerated the planted values at the top rung
        gamma = 0.05 and computed their Z directly. The MAXIMUM Z over all 6541
        planted OBJ-PLANT-SMOOTH values is 4.957 at bits 16 and 4.643 at bits 20,
        while the null's tenth-largest Z is about 6.061 and 5.762. OBJ-PLANT-ROUGH
        is bounded by Z < 2 BY CONSTRUCTION. NO PLANTED VALUE AT ANY RUNG OF EITHER
        LADDER CAN ENTER THE TOP TEN OF THE Z DISTRIBUTION. The only effect a plant
        can have on T_deep is to EVICT null samples from that tail, which pushes
        T_deep slightly DOWN - and all 28 shifts are near zero and predominantly
        negative, exactly as that mechanism predicts.
      what_this_forbids_being_said: >-
        RAISING GAMMA OR THE REPLICATE COUNT WOULD NOT CHANGE THIS. The ladders are
        disjoint in construction from the statistic they were run to certify. No
        deliverable citing this experiment may describe STAT-TAIL-DEEP's inertness
        as "low power", as a sample-size limitation, or as a reason to extend the
        ladder. It is a construction mismatch between the perturbation objects and
        the deep tail, and it would be repaired only by a plant that places mass
        above Z about 6 - which neither frozen plant family does.
      is_this_the_third_such_instance: >-
        YES, AND IT IS RECORDED AS SUCH. RTB-040-2 found two of three declared
        certifying statistics at BATCH-024 structurally incapable of moving; this
        is the third distinct instance in this campaign, and the FIRST caught by a
        structural argument rather than only by measurement. That is the intended
        function of PERTURB-MOVE-1 and it worked. The standing lesson recorded for
        the roadmap - a certifying statistic must be checked for reachability by
        its own perturbation objects at DESIGN time, by deriving the support of the
        perturbed law against the region the statistic reads, not at calibration
        time by measuring a shift.
    - id: STRIKE-2
      target: 'STAT-RATE-u@u_target=6, struck from the certifying set at both cells'
      measured_basis: >-
        0 of 28 plant rung-cell rows carry a movement flag; the largest absolute
        shift over all 28 is 0.4808835 null sd. Under the tighter paired yardstick
        the largest excursion is 1.060, which is why the strike is stated on the
        contract's own |shift| >= 1 criterion over the archived table and not on a
        yardstick the contract did not freeze.
      structural_basis_D1_extended: >-
        THE SAME QUESTION D1 ASKS OF STAT-TAIL-DEEP, ASKED AND ANSWERED HERE. The
        rung is Bsm = 40 at bits 16 and Bsm = 102 at bits 20, i.e. u about 6.01 and
        5.99. OBJ-PLANT-SMOOTH replaces samples by products of primes at most
        Bsm(u = 4) - 256 at bits 16 and 1024 at bits 20 - which are 40-smooth or
        102-smooth only by accident, so the smooth plant adds almost nothing to
        p_hat at u = 6. OBJ-PLANT-ROUGH replaces samples by q*r with q above
        sqrt(X), which are never Bsm-smooth at any rung, so the rough plant can
        only remove the tiny number of u = 6 smooth samples it happens to displace.
        Both effects are second order against a null mean p_hat of 2.19e-04 and
        1.01e-04. THIS IS A CONSTRUCTION MISMATCH OF THE SAME KIND AS D1 AND IS NOT
        LOW POWER.
      the_role_its_uncertified_status_does_not_spoil: >-
        PRE-DECLARED BY THE CONTRACT, NOT INVENTED HERE. POW-LPF-1 already fixed
        before any datum that u = 6 "IS RECORDED, IS REPORTED, FEEDS DECAY-LPF-1,
        AND IS EXCLUDED FROM R(u) PASS OR FAIL, LABELLED UNDERPOWERED", and stated
        the sample size that would power it (n >= 1526718). That is exactly the
        BATCH-022 u = 6 precedent and it is honoured unchanged - the rung is
        measured, its p_hat and R(u) are reported for both arms, it participates in
        the DECAY-LPF-1 monotonicity check, and it certifies nothing.
    what_the_strikes_do_not_say: >-
      A STRIKE IS A STATEMENT ABOUT THE APPARATUS AND NEVER ABOUT THE
      INTERMEDIATES. Neither strike says anything about the Semaev map, HEUR-DS-1
      or H-LPF-001 in either direction. Per CERT-LPF-1 the non-firing of a struck
      statistic may never be reported as evidence about the intermediates, and
      under AP-4 neither may its firing be reported as power.

  tail_deep_disposition:
    id: TAIL-RR052
    tail_lpf_1_attainability_demonstration:
      mandatory_at_this_freeze: true
      part_a_band_and_measured_extremes:
        bits_16: {T_lo: 5.670318754295851, T_hi: 6.726484706460616, measured_min_of_200: 5.657939657036511, measured_max_of_200: 6.819540337065985, measured_mean: 6.0840393523072365, measured_sd: 0.20823397143444067}
        bits_20: {T_lo: 5.348261742073961, T_hi: 6.099011339823803, measured_min_of_200: 5.339285892609557, measured_max_of_200: 6.211879380709444, measured_mean: 5.697344336088978, measured_sd: 0.14212255386046166}
      part_b_upward_demonstration:
        object: OBJ-CTRL-PRODUCT
        bits_16: {measured_T_deep: 8.891942297505098, T_hi: 6.726484706460616, above_T_hi: true, margin_in_null_sd: 13.484365331244176}
        bits_20: {measured_T_deep: 8.075346336954999, T_hi: 6.099011339823803, above_T_hi: true, margin_in_null_sd: 16.732052276521735}
        verdict: 'PRESENT AT BOTH CELLS. The UPWARD direction of TAIL-LPF-1 is DEMONSTRATED.'
      part_c_downward_demonstration:
        object: 'OBJ-PLANT-ROUGH at the top rung gamma = 0.05'
        bits_16: {measured_T_deep: 6.072305919309115, T_lo: 5.670318754295851, below_T_lo: false, shift_in_null_sd: -0.05634735253472052}
        bits_20: {measured_T_deep: 5.64930945934857, T_lo: 5.348261742073961, below_T_lo: false, shift_in_null_sd: -0.3379820826156079}
        verdict: >-
          ABSENT AT BOTH CELLS. THE DOWNWARD DIRECTION OF TAIL-LPF-1 IS UNCERTIFIED,
          and the reason is the D1 construction mismatch - the rough plant's values
          have Z < 2 by construction and cannot occupy the deep tail, so they can
          only evict null members from it.
    the_two_readings_of_the_strike_rule_recorded_and_routed:
      open_item_id: OPEN-RR052-A
      reading_1_applied_here: >-
        CERT-LPF-1's ladder rule and TAIL-LPF-1's attainability clause are
        independent tests, and TAIL-LPF-1's "if BOTH are absent the statistic is
        struck" states a SUFFICIENT condition for striking, not a necessary one. It
        confers no immunity from CERT-LPF-1, which strikes any member that does not
        move on ANY rung of EITHER ladder. STAT-TAIL-DEEP moves on 0 of 28 plant
        rows, so it is struck. OBJ-CTRL-PRODUCT is expressly "a single object and
        not a ladder" (ALT-CLASS-LPF-1 S3 and the movement report's own
        where_each_family_moves_mass), so it cannot satisfy the ladder rule.
      reading_2_not_applied: >-
        TAIL-LPF-1 is the more specific rule about this statistic and its
        one-direction-absent case is exhaustively specified as UNCERTIFIED rather
        than STRUCK, so STAT-TAIL-DEEP is retained as certifying with only its
        downward direction uncertified.
      why_the_choice_is_recorded_rather_than_deferred: >-
        THIS ONE COULD NOT BE LEFT OPEN, AND THAT IS SAID PLAINLY. Under reading 2
        the reading rule would certify ladders whose top rungs do not move, L-1's
        second leg would be satisfied on already-archived data, and L-2, L-3 and
        L-4 would be unreachable by construction - the ATTAIN-LPF-1 stop condition,
        a REVISE and a non-execution of the whole measurement arm. Reading 1 is
        applied because it is the only reading under which the frozen branch
        structure can be honestly instantiated at all, and because the two rules do
        not in fact contradict. THE CONSEQUENCE OF THE CHOICE IS THEREFORE STATED
        RATHER THAN HIDDEN, and it is ROUTED TO TASK-20260801-054 - if the reviewer
        prefers reading 2, the correct outcome is NOT an edit of this file but a
        REVISE returning a recorded non-execution of the measurement arm.
      ats_lpf_1_clause_4_position: >-
        DECLARED. Clause 4 forbids the freezing Coordinator resolving an ambiguity
        discovered after a calibration number exists. This session's position is
        that reading 1 is an APPLICATION of unambiguous contract text rather than a
        resolution, because TAIL-LPF-1's clause is sufficient-not-necessary on its
        face. That position is itself routed for the reviewer to accept or reject,
        and the alternative and its full consequence are on the record above.
    role_retained_for_STAT_TAIL_DEEP:
      reads_no_branch: >-
        NO BRANCH OF RR-LPF-1 READS STAT-TAIL-DEEP. Its band is frozen below and
        the driver will compute its reject boolean and band position (it iterates
        every id in statistic_ids(bits) and cannot be told not to), but neither the
        rejection nor the non-rejection of STAT-TAIL-DEEP enters any branch
        condition, and neither may be cited as evidence about the intermediates in
        either direction (CERT-LPF-1, AP-4).
      what_may_still_be_said: >-
        Exactly this and no more - the apparatus's deep-tail statistic is
        DEMONSTRABLY CAPABLE of firing upward against a derivably smoother object
        (ALT-CLASS-LPF-1 class S3), with measured margins of 13.48 and 16.73 null
        sd at the two cells, and is DEMONSTRABLY INCAPABLE of being moved by either
        frozen plant ladder (classes S1 and S2) at any rung, for the structural
        reason in D1. Its measured value on the real arm is REPORTED beside its
        band as a descriptive number carrying no inference.

  # =====================================================================
  # 3. THE FROZEN BANDS. THR-LPF-1 SUBSTITUTION ONLY.
  # =====================================================================
  band_provenance:
    rule_quoted: >-
      THR-LPF-1 - "For every statistic in STAT-LPF-1 and every cell, the band is
      the [2nd, 199th] ASCENDING ORDER STATISTIC pair of that statistic's 200
