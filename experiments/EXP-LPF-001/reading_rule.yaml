# =========================================================================
# RR-LPF-1 - THE FROZEN READING RULE FOR EXP-LPF-001
# Frozen by TASK-20260801-052 (Coordinator). Reviewed at TASK-20260801-054.
# SUBSTITUTION ONLY: no branch added, removed, merged, reordered or reworded.
# Numbers substituted from the archived LPF-CAL-A / LPF-CAL-B / LPF-CAL-C /
# LPF-CAL-D / LPF-CAL-E arrays at snapshot 104d32faff09207740f980be3c7dc8faa3642110.
# THE CALIBRATION IS NON-EVIDENTIAL IN EITHER DIRECTION (CAL-LPF-1). This file
# states NO disposition about H-LPF-001, HEUR-DS-1 or any other hypothesis.
# CLAIM TIER: toy.
# =========================================================================
reading_rule:
  id: RR-LPF-1
  frozen: true
  experiment_id: EXP-LPF-001
  hypothesis_id: H-LPF-001
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-025
  frozen_by_task: TASK-20260801-052
  archived_by_task: TASK-20260801-053
  reviewed_by_task: TASK-20260801-054
  claim_tier: toy
  disposition_stated_by_this_file: null
  authority: >-
