      substituted_numbers:
        certifying_statistics_read: 'STAT-RATE-u@u_target=2, 3, 4 and 5, and STAT-KS-DICK - ten comparisons across the two cells.'
        bands_read: 'the frozen bands block above.'
        powered_rungs: 'u_target 2, 3, 4, 5 at both cells, fixed by POW-LPF-1 before any datum.'
        limb_b_decidability_at_those_rungs: 'TRUE at all four powered rungs at both cells (limb_b_decidability_map).'
        producing_arm: >-
          MEASUREMENT ARM for the real arm's statistics and its R(u); MEASUREMENT ARM
          for the fresh uniform arm's R(u) that sets the run-time decidability flag.
          Both legs read quantities the measurement produces.
        wording_note: >-
          The frozen disposition says "THESE THREE STATISTICS". After the strikes the
          statistics actually read are STAT-RATE-u and STAT-KS-DICK. THE FROZEN
          WORDING IS NOT EDITED; any deliverable quoting it must state that
          STAT-TAIL-DEEP was struck at freeze time and read nothing, so the licensed
          statement is narrower than the frozen sentence reads. This is recorded as
          part of OPEN-RR052-A and routed.
    - id: L-3
      condition: >-
        DEPARTURE. At least one certifying statistic lies OUTSIDE its archived band
        at BOTH cells in the SAME DIRECTION, or R(u) lies outside [1/8, 8] at a
        powered rung at BOTH cells while the uniform arm's R(u) at that rung lies
        inside.
      disposition: >-
        H-LPF-001 becomes `analyzed` with direction `weaken` ON HEUR-DS-1's TOY
        INSTANCE, scoped exactly to INT-1, ENC-B, Bfb = 512, the i < j enumeration,
        the two tested cells, the frozen Bsm ladder and the archived bands. A
        REFUTATION ARTIFACT IS MANDATORY AND MUST BE ARCHIVED BEFORE THE DECISION
        RELIES ON IT - deviation_certificate.json, listing the deviating rungs with
        the exact statistic values, the archived bands, and an INDEPENDENT
        RE-VERIFICATION of the largest prime factor of a stated random subsample by a
        second factorization path, with proof_status `counterexample_certificate`.
        `reject_scoped`, and in particular reject_scoped-as-impossibility, IS
        FORBIDDEN on this single unreplicated run. THE DIRECTION MUST BE STATED -
        smoother than reference and rougher than reference have opposite consequences
        for an index calculus and are never reported as one outcome.
      substituted_numbers:
        direction_definition_for_each_retained_statistic:
          'STAT-RATE-u@u_target=2..5': 'ABOVE band = SMOOTHER than the reference; BELOW band = ROUGHER. Unambiguous.'
          'STAT-KS-DICK': >-
            NON-DIRECTIONAL IN THE SMOOTHNESS SENSE. Band exit establishes a
            departure of the empirical Z-CDF from the Dickman CDF and not its
            direction, because the statistic is max(D+, D-) and D6 measured the
            argmax switching between cells at these parameters. See OPEN-RR052-D.
        refutation_artifact_required: 'results/measure/deviation_certificate.json, proof_status counterexample_certificate, written unconditionally under either outcome.'
        producing_arm: 'MEASUREMENT ARM for every leg.'
    - id: L-4
      condition: >-
        MIXED. A departure at exactly one cell, or a departure whose direction
        differs between cells, or LIMB B undecidable at a rung where LIMB A rejects.
      disposition: >-
        `inconclusive`, with the replication at a DIFFERENT curve instance per cell
        named as the single next action. H-LPF-001 stays `approved` and does not
        advance.
      substituted_numbers:
        limb_b_undecidable_rungs: 'bits 16 u_target = 6 only, which is underpowered and whose LIMB A statistic is struck. See OPEN-RR052-B for the two readings of "a rung where LIMB A rejects".'
        producing_arm: 'MEASUREMENT ARM for every leg.'
    forbidden_in_every_branch:
    - '`support` for H-LPF-001, H-SMTH-001, H-DS-001, H-EQD-001 or H-DEP-001.'
    - 'Validation or refutation of HEUR-DS-1 above the toy tier, in either direction.'
    - '`reject_scoped`, and in particular reject_scoped-as-impossibility.'
    - 'S1_met, F1_met, F2_met, structure_gate_passed - this experiment runs no search and cannot evaluate them.'
    - 'Any asymptotic, crypto-scale, medium-scale or affected-scheme claim; G1-G4 stay OPEN.'
