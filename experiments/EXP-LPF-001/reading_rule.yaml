      and 206 of 210 in row order) and identical to the validator's numbers. It is
      the only such row in the 210-row table, confirmed by the validator across all
      28 sequences.
    why_it_is_decision_relevant: >-
      THE STRIKE RULE KEYS ON THE TOP RUNG. PERTURB-MOVE-1 - "A FAMILY WHOSE TOP
      RUNG SHOWS NO MOVEMENT IS STRUCK FROM THE CERTIFIED LIST BY THE READING RULE
      RATHER THAN REPORTED AS LOW POWER." It is also the canonical artifact tell of
      docs/inventor-protocol.md section 3 - a quantity that failed to grow when the
      parameter meant to drive it grew.
    how_this_freeze_handles_it: >-
      THE ENTIRE OBJ-PLANT-ROUGH / STAT-KS-DICK LADDER AT BITS 20 IS STRUCK,
      INCLUDING ITS MOVING gamma = 0.02 RUNG. Harvesting the one intermediate rung
      that moved, out of a sequence whose top rung does not, is precisely the
      selective reading PERTURB-MOVE-1 was written to forbid, and certifying it
      would additionally satisfy L-1's second leg on archived data and make L-2,
      L-3 and L-4 unreachable. The strike is applied to the (family, cell,
      statistic) ladder and to nothing else - STAT-KS-DICK remains certifying,
      because its top rung moves under OBJ-PLANT-SMOOTH at BOTH cells (-4.278 and
      +11.846 null sd) and under OBJ-PLANT-ROUGH at bits 16 (-4.199 null sd).
    the_alternative_reading_recorded:
      open_item_id: OPEN-RR052-C
      status: 'ROUTED TO TASK-20260801-054.'
      alternative: >-
        Certify the gamma = 0.02 rung on its own row, on the ground that
        PERTURB-MOVE-1's per-rung permission ("RR-LPF-1 may certify power at a rung
        only where that table records a shift beyond noise") is satisfied there and
        the top-rung sentence is about families rather than rungs.
      not_applied_because: >-
        The two sentences are not in tension - the per-rung clause is a NECESSARY
        condition for certifying a rung and the top-rung clause is a SUFFICIENT
        condition for striking a family. Both are satisfied here in the direction of
        the strike. Recorded for the reviewer nonetheless.
    the_mechanism_D6_and_what_it_forbids: >-
      VAL-20260801-006 D6 diagnosed the cause by recomputing the two one-sided
      Kolmogorov-Smirnov suprema separately - the sign and the non-monotonicity are
      the D+ / D- ARGMAX SWITCHING across a near-crossing, an instrument property of
      max(D+, D-) rather than a distributional reversal. Under OBJ-PLANT-SMOOTH at
      gamma = 0.05 the null D+ / D- are 0.04919 / 0.00030 at bits 16 and
      0.03824 / 0.00006 at bits 20; the perturbed values are 0.04658 / 0.04382 at
      bits 16, where D+ still wins and the KS value falls, and 0.03642 / 0.04461 at
      bits 20, where D- overtakes and the KS value rises. CONSEQUENCE FROZEN HERE -
      THE SIGN OF A STAT-KS-DICK SHIFT CARRIES NO DIRECTIONAL INFORMATION NEAR THE
      CROSSING, and no deliverable may read the sign difference between cells as the
      two cells disagreeing about the direction of a perturbation.
    consequence_for_reading_a_STAT_KS_DICK_departure_under_L_3:
