      statement: >-
        A DISTINCTION THAT MUST NOT BE BLURRED IN EITHER DIRECTION. A rejection
        against a measured band is a valid rejection wherever it occurs, including
        in a direction whose POWER is uncertified - the band is an order statistic
        of a measured null and does not depend on any plant. What the strikes remove
        is the ability to CLAIM DETECTION CAPABILITY against a named alternative
        class, not the validity of a departure the apparatus happens to see. So a
        below-band rejection of STAT-RATE-u@u_target=5 at both cells would fire L-3
        legitimately, while V11 continues to say that no rough-direction power was
        certified at that rung.

  # =====================================================================
  # 8. THE FROZEN BRANCH SET, IN THE CONTRACT'S PRECEDENCE
