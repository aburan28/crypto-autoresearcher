      V10_new_at_this_freeze: >-
        ANY ROUGH-DIRECTION DEPARTURE DETECTABLE ONLY BY STAT-KS-DICK AT BITS 20, at
        any gamma. That ladder is struck under D9 and its sign carries no direction
        near the D+ / D- crossing (D6). Rough-direction power at bits 20 rests on
        STAT-RATE-u@u_target=2 and u_target=3 alone.
      V11_new_at_this_freeze: >-
        ANY ROUGH-DIRECTION DEPARTURE AT u = 5 AT EITHER CELL. The
        OBJ-PLANT-ROUGH / STAT-RATE-u@u_target=5 ladder is struck at both cells
        (top-rung shifts -0.829 and -0.462).
    the_ap_3_sentence: >-
      NO DELIVERABLE MAY DESCRIBE THIS EXPERIMENT AS HAVING POWER AGAINST
      "DEPARTURES FROM DICKMAN" WITHOUT NAMING WHICH OF S1, S2 OR S3 THE CLAIM RESTS
      ON AND WITHOUT CARRYING V1 THROUGH V11.
