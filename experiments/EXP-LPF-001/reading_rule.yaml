    - experiments/EXP-LPF-001/results/calib/perturbation_movement_report.json
    - experiments/EXP-LPF-001/results/calib/apparatus_identity_report.json
    - experiments/EXP-LPF-001/results/calib/dickman_reference_reproduction.json
    - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/raw-result.json
    reliance_on_the_validator_declared: >-
      DECLARED RATHER THAN SILENT. The following are RELIED ON from
      VAL-20260801-006 and were not re-derived by this session - the 210-row
      movement table reproduces at max discrepancy exactly 0.0 with zero
      misreported rows; 13600 factorizations re-verified by a second path with
