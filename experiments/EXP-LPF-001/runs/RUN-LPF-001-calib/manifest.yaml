  protocol_deviations: []
  anomalies:
    - id: ANOM-LPF049-1
      kind: unexpected_observation
      text: >-
        STAT-TAIL-DEEP records no movement beyond noise at ANY rung of EITHER
        perturbation ladder at EITHER cell; the largest recorded shift over all
        28 plant rung-cell pairs is 0.338 measured null standard deviations. It
        does move on OBJ-CTRL-PRODUCT (+13.48 sd at bits 16, +16.73 sd at
        bits 20, detected 20 of 20 at both cells). RECORDED, NOT INTERPRETED.
    - id: ANOM-LPF049-2
      kind: unexpected_observation
      text: >-
        STAT-RATE-u at u_target = 6 records no movement beyond noise at any
        rung of either ladder at either cell; the largest absolute shift is
        0.481 measured null standard deviations. STAT-RATE-u at u_target = 5
        moves only on OBJ-PLANT-SMOOTH at gamma 0.02 and 0.05 (bits 16) and at
        gamma 0.05 (bits 20), and never on OBJ-PLANT-ROUGH.
    - id: ANOM-LPF049-3
      kind: unexpected_observation
      text: >-
        The sign of the STAT-KS-DICK shift under OBJ-PLANT-SMOOTH at gamma 0.05
        differs between cells - minus 4.278 measured null sd at bits 16 and plus
        11.846 at bits 20. Both magnitudes exceed noise; only the direction
        differs. RECORDED, NOT INTERPRETED.
    - id: ANOM-LPF049-4
      kind: construction_accounting
      text: >-
        OBJ-PLANT-ROUGH construction fallbacks, where the replaced value was too
        small to admit a q*r construction with q above sqrt(X), are counted and
        reported rather than dropped. Worst case 182 of 130820 requested
        replacements (0.14 percent) at bits 16, gamma 0.05; 9 of 130820 at
        bits 20, gamma 0.05. OBJ-PLANT-SMOOTH had zero fallbacks at every rung.
    - id: ANOM-LPF049-5
      kind: recorded_ambiguity
      text: >-
        OPEN-LPF049-A. The frozen LPF-CAL-B note computes its exact binomial
        band from 20 x 4 x 1 = 80 comparisons per cell, but STAT-KS2-CAL is
        non-certifying and is not computed in the calibration while STAT-RATE-u
        spans five frozen rungs, so seven comparisons per replicate are
        available rather than four. Both aggregate readings and the full
        per-statistic counts are recorded; NEITHER IS RESOLVED HERE. Routed to
        TASK-20260801-054 under ATS-LPF-1 clause 4.
    - id: ANOM-LPF049-6
      kind: recorded_ambiguity
      text: >-
        LPF_movement_beyond_noise_flag is implemented as |shift| >= 1.0 measured
        null standard deviation, the literal reading of the metric definition.
        The alternative reading, the plant mean outside the [min, max] range of
        the 200 measured null replicates, is recorded in every row as
        movement_beyond_null_range_auxiliary_record and is explicitly NOT a
        decision variable, NOT a cut and NOT frozen. Routed to
        TASK-20260801-054.

  scope_caveats:
    - >-
      TOY TIER. Two toy field cells at D = 2**32 and D = 2**40. Nothing here
      transfers to crypto-scale D by any argument this contract offers (V6).
    - >-
      `bits` names the FIELD prime p and nothing else (RT047-B5). No discrete
      logarithm is computed, no relation is harvested and no search is run.
    - >-
      The calibration is NON-EVIDENTIAL. It freezes no threshold and no band;
      every interval it reports carries band_status recording that
      TASK-20260801-052 owns the freeze.
