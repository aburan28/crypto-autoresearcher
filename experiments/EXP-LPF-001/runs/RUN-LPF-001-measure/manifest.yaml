        nearer edge.
      per_comparison_false_fire_probability_of_the_frozen_band: 0.0199004975124378
      further_observation: >-
        At this cell and rung the frozen lower band edge coincides with the
        MINIMUM of the 200 measured LPF-CAL-A uniform replicates, the 1st and
        2nd ascending order statistics being tied, so the real arm's p_hat also
        lies below every one of those 200 null replicate values. RECORDED, NOT
        INTERPRETED.
      no_disposition: >-
