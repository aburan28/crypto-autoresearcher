        boolean means is TASK-20260801-083's to decide.

    limb_b_absolute:
      declaration_that_travels_with_every_number_below: LIMBB-DECL-RR066
      declaration_binding_quoted: >-
        THIS DECLARATION TRAVELS WITH EVERY LIMB B READING OF THIS EXPERIMENT.
        Any citation of LPF_limb_b_decidable_flag, of R(u), of the decidability
        map, of L-2's third conjunct, of L-3's second clause or of L-4's third
        clause carries it. A LIMB B statement made without it is incomplete.
      declaration_part_1: >-
        u is defined at D while the samples live on [1, p**2], with X/D about
        0.507 at bits 16 and 0.536 at bits 20, so u is systematically overstated
        relative to the sample range and rho(u) systematically under-predicts
        p_hat. R(u) on a correct uniform arm is therefore A BIASED ESTIMATOR of
        the thing LIMB B is named for. The sole non-decidable cell-rung, bits 16
        u_target = 6, is LARGELY A DEFINITIONAL ARTIFACT - under the reviewer's
        corrected u it moves from about 11.59 to about 6.68, inside the band.
        The frozen attribution to finite-X behaviour of rho alone is at best
        half right and must not be quoted alone.
      declaration_part_2: >-
        LIMB B IS NOT A SYMMETRIC 8x TEST at these cells. Because the uniform
        reference is not centred at 1, the upward headroom is 8.0 divided by the
        uniform arm's R(u) - 6.84, 5.51, 3.90 and 1.75 at bits 16 u_target 2 to
        5 and 7.09, 6.13, 4.87 and 3.27 at bits 20 - so at bits 16 u_target = 5
        LIMB B IS A 1.75x TEST AND NOT AN 8x TEST. Downward the headroom is at
        least 9.0 at every powered rung. No deliverable may describe LIMB B as
        an order-of-magnitude or symmetric factor-of-8 test at these cells.
      frozen_absolute_band: [0.125, 8.0]
      frozen_band_provenance: >-
        constant_factor_c = 8, inherited unchanged from EXP-DS-001 and frozen in
