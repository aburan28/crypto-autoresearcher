  scope_caveats:
    - >-
      TOY TIER. Two toy field cells at D = 2**32 and D = 2**40, p = 46663 and
      p = 767551. Nothing here transfers to crypto-scale D by any argument this
      contract offers.
    - >-
      `bits` names the FIELD prime p and nothing else (RT047-B5). No discrete
      logarithm is computed, no relation is harvested and no search is run.
    - >-
      The object measured is the half-arity m = 4, d_half = 2 partial-map
      intermediate under INT-1 and ENC-B, over the frozen deterministic
      512-element factor base. It is not the full Semaev relation, and no
      statement about relation yield follows from it here.
    - >-
      Every LIMB B number above carries LIMBB-DECL-RR066, including that LIMB B
      is a 1.75x test and not an 8x test at bits 16 u_target = 5, and that the
      bits 16 u_target = 6 non-decidability is largely a definitional artifact.
    - >-
      STAT-RATE-u@u_target=6 and STAT-TAIL-DEEP are STRUCK from the certifying
      set by RR-LPF-2. Their values are reported as observations only and read
      no branch, in either direction.
    - >-
      The uniform arm is the CALIBRATION OF THE APPARATUS and not the
      comparison (ABS-REL-LPF-1). No number in this run is a real-versus-uniform
      significance test.
