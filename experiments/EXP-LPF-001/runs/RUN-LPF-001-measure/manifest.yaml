  protocol_deviations:
    - id: DEV-079-1
      kind: contract_internal_inconsistency_recorded_not_repaired
      severity: recorded
      text: >-
        The frozen handoff constrains that "THE PILOT BUDGET GATE RUNS FIRST",
        but in the hash-bound driver run_pilot() is called only from
        run_calibration(); the measurement path in main() constructs
        Deadline(MEASURE_WALL_CLOCK_SECONDS = 5400) and enters run_measurement()
        with no pilot. The specification's own budget clause frames the pilot as
        a projection of THE FULL CALIBRATION COST, so the driver is consistent
        with the specification and the handoff sentence is broader than the
        frozen code. ATS-LPF-1 forbids editing the driver to add the gate, and
        editing it is exactly the tuning route this design exists to close, so
        the driver was executed unmodified.
      mitigation_taken: >-
        A pre-bulk projection was computed OUTSIDE the driver, before the
        invocation, by linear extrapolation of the pilot factorization rates
        measured and archived in RUN-LPF-001-calib. It is recorded in
        timing.pre_bulk_projection_MODELED and is labelled MODELED throughout.
        It projected 37.26 seconds against a 5400 second budget - abort false -
        and 18.0 seconds actually elapsed. The mitigation touched no repository
        file, changed no code and altered no scope.
      scope_effect: none
      amendment_requested: false
      amendment_note: >-
        No amendment is requested because no scope was reduced and no frozen
        quantity was adjusted. The inconsistency is recorded for the Coordinator
        and for TASK-20260801-081.
    - id: DEV-079-2
      kind: superseded_path_in_the_frozen_required_artifacts_list
      severity: recorded
      text: >-
        specification.yaml required_artifacts.reading_rule still names
        experiments/EXP-LPF-001/reading_rule.yaml (RR-LPF-1). The handoff and
        the TASK-20260801-078 authorization both bind this run to RR-LPF-2 at
        reading_rule_v2.yaml, and RR-LPF-2 passed independent review at
        TASK-20260801-068. The driver was therefore pointed at
        reading_rule_v2.yaml. RR-LPF-1 was neither read nor edited and its
        sha256 is unchanged. The specification was not edited to reconcile the
        list.
      scope_effect: none

  anomalies:
    - id: ANOM-079-1
      kind: unexpected_observation
      text: >-
        LPF_limb_b_decidable_flag came out FALSE at bits 20, u_target = 6, where
        the archived 200-replicate decidability map records TRUE. The run-time
        flag is computed from ONE fresh OBJ-NULL-UNIF replicate, whose R(u) here
        is 8.043358425482902, marginally above the frozen upper edge 8.0,
        against an archived 200-replicate mean of 5.0386. RR-LPF-2 DECLARED THIS
        POSSIBILITY IN ADVANCE - run_time_variability_of_the_flag_declared
        records that the measured 200-replicate range at this rung is 1.53 to
        8.81, which straddles 8, and states that "the u = 6 flag may come out
        either way and no branch reads it". Both non-decidable rungs are also
        the unpowered rungs POW-LPF-1 excluded before any datum, and both carry
        the struck statistic STAT-RATE-u@u_target=6. RECORDED, NOT INTERPRETED.
    - id: ANOM-079-2
      kind: unexpected_observation
      text: >-
        The single certifying reject, bits 16 STAT-RATE-u@u_target=2, is by FOUR
        SAMPLES out of 130816 - observed smooth count 46598 against a lower band
        edge that corresponds to exactly 46602 - and sits 0.024 measured null
        standard deviations outside the nearer edge. The frozen band's own
        per-comparison false-fire probability on a fresh correct draw is 4/201 =
        0.0199, and ten certifying comparisons were made. RECORDED WITH ITS
        MAGNITUDE, NOT INTERPRETED.
    - id: ANOM-079-3
      kind: unexpected_observation
      text: >-
        At bits 16 u_target = 2 the frozen lower band edge coincides exactly
        with the minimum of the 200 measured LPF-CAL-A uniform replicates - the
        1st and 2nd ascending order statistics are tied at 0.3562408268101761 -
        so at that rung the THR-LPF-1 [2nd, 199th] band is not strictly interior
        to the measured null range below. RECORDED, NOT INTERPRETED.
    - id: ANOM-079-4
      kind: unexpected_observation
      text: >-
        At bits 16 u_target = 6 the REAL arm's R(u) is 12.94, outside the frozen
        [1/8, 8] band, while the fresh uniform arm's R(u) at the same rung is
        10.11, also outside it. The rung is unpowered, its LIMB B flag is false,
        and its LIMB A statistic is struck, so it reads no branch. Reported here
        as an observation and under LIMBB-DECL-RR066, which records that about
        half the excess at the deep rungs is definitional rather than a property
        of the object.
    - id: ANOM-079-5
      kind: observation
      text: >-
        LPF_degenerate_count is 0 at both cells, as the contract predicted
        structurally for an i < j enumeration over distinct x-coordinates. Both
        arms carry the full 130816 samples with no exclusion.
    - id: ANOM-079-7
      kind: infrastructure_observation
      text: >-
        CONCURRENT ACTIVITY IN THE SHARED WORKTREE. Between the pre-run capture
        in git_status_prerun.txt and the completion of this package, three
        untracked files appeared that this task did not create and does not own
        - ledger/proposals/IDEA-20260802-001.yaml, -002.yaml and -003.yaml.
        A fourth untracked path,
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-065/,
        was already present before this run started. None of them is inside this
        task's write_scope and none was written, read or modified by this run.
        FLAGGED FOR TASK-20260801-080, which must stage ONLY the declared paths.
        No tracked file was modified by anything during the run window.
    - id: ANOM-079-6
      kind: recorded_ambiguity_carried_from_the_calibration
      text: >-
        The PERTURB-MOVE-1 movement table this run reports is the CALIBRATION
        artifact experiments/EXP-LPF-001/results/calib/perturbation_movement_report.json
        produced by RUN-LPF-001-calib, which is NON-EVIDENTIAL under CAL-LPF-1.
        The measurement arm computes no movement rows of its own - it touches
        no plant object. Seven of the twenty-eight plant rung-cell pairs are
        INERT under the |shift| >= 1.0 reading, all of them OBJ-PLANT-ROUGH -
        bits 16 at gamma 0.0005, 0.001, 0.002 and 0.005, and bits 20 at gamma
        0.0005, 0.001 and 0.002 - and the inert set is identical whether taken
        over all seven statistics or over the five retained certifying ones.
        The calibration's own ANOM-LPF049-1 and ANOM-LPF049-2 are carried
        forward unchanged.

