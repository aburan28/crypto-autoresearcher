      field_bits: 16
      statistic_id: STAT-RATE-u@u_target=2
      certifying: true
      value: 0.3562102495107632
      band_lower: 0.3562408268101761
      band_upper: 0.3625091731898239
      direction: BELOW_BAND
      band_position_in_null_sd: -0.023955253423476774
      magnitude_recorded_honestly: >-
        The band edges correspond to integer smooth counts of exactly 46602 and
        47422 out of 130816. The observed smooth count is 46598. THE REJECTION
        IS BY FOUR SAMPLES OUT OF 130816, a p_hat shortfall of 3.06e-05, and
