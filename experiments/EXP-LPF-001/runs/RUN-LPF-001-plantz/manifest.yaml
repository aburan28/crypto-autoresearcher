    plant_z_tail_report.json is expected to reproduce bit-for-bit, and the
    anchor block is the built-in check that the stream itself reproduced.

  protocol_deviations: []

  unexpected_observations:
    - id: UNEXP-PLANTZ-1
      text: >-
        The maximum planted Z at a cell is NOT attained at the top rung. At bits
        20 the largest regenerated smooth planted Z over the whole ladder is
        6.91606451193366, at gamma = 0.02 replicate 11, which is larger than the
        6.031412202025096 attained at gamma = 0.05 replicate 0. Recorded here
        because it is a number the maxima quoted upstream do not contain. It is
        recorded, not interpreted.
    - id: UNEXP-PLANTZ-2
      text: >-
        The slice gamma <= 0.05 is vacuous on these frozen ladders, which top out
        at gamma = 0.05, so it is identical to the whole-ladder slice. The
        gamma == 0.05 rung alone is a strictly narrower slice and the two give
        different eviction and insertion counts. Both are archived so that any
        later restatement names which one it means.
    - id: UNEXP-PLANTZ-3
      text: >-
        Exceedance of a replicate's own null tenth-largest Z is rare but nonzero
        and occurs only in the SMOOTH family - 3 of the 560 regenerated
        (family, cell, rung, replicate) instances contain at least one such
        plant, and in each of those 3 the planted T_deep is strictly ABOVE the
        null T_deep. In the ROUGH family it occurs zero times, consistent with
        the structural bound checked directly on all 462736 rough values.
    - id: UNEXP-PLANTZ-4
      text: >-
        A benign, gitignored side effect - importing the driver as a module
        creates experiments/EXP-LPF-001/implementation/__pycache__. It is
        covered by .gitignore, is not a declared artifact and enters no commit.
