      changed, added or removed relative to the prior manifest.
    precedence_rule: >-
      THE PRIOR MANIFEST GOVERNS EVERY FIELD IT CARRIES. If any value restated
      in this record ever differs from the corresponding value at
      c8812fb42bfc567259dbda36b5727ff19b466c093b8d57983d9a2b58409ab7a4, the
      prior hash-bound manifest is authoritative and this record is wrong and
      must itself be superseded. This rule exists because restatement carries
      transcription risk, and the risk is declared rather than assumed away.
    why_a_new_file_and_not_an_edit: >-
      AGENTS.md core rule 4 - results are immutable records and corrections
      create new records - and the "Durable research commits" clause forbidding
      history rewriting over pushed run records. The prior manifest is hash-bound
      in an attested archive receipt; editing it in place would invalidate that
      attestation and make an already-verified commit unverifiable. RR-LPF-2's
      own DEF-065-1 entry states the repair is "A SUPERSEDING MANIFEST RECORD
      ... never an edit of the archived manifest", and RTB-068 restated it as
      "RECORD, NOT EDIT".
    path_choice:
      chosen_path: experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/manifest_v2.yaml
      grounds:
      - >-
        It follows the supersession convention this campaign has already used
        for a frozen experiment-directory artifact - RR-LPF-1 at
        experiments/EXP-LPF-001/reading_rule.yaml was superseded by RR-LPF-2 at
        experiments/EXP-LPF-001/reading_rule_v2.yaml, a `_v2` sibling in the
        same directory, with the superseded file left byte-identical.
      - >-
        It sits INSIDE the run package it corrects, so a reader who opens the
        run directory cannot miss it. A correction filed only in ledger/ would
        leave the run directory looking uncorrected to anyone reading it
        directly, which is the failure mode a supersession is meant to prevent.
      - >-
        It is deliberately NOT named `manifest.yaml`. tools/validate_ledger.py
        discovers runs by the glob experiments/*/runs/*/manifest.yaml and
        registers each run id it finds; two files named `manifest.yaml` both
        claiming run id RUN-LPF-001-plantz would raise a duplicate-ID error
        that is emitted with force=True and therefore cannot be suppressed at
        all. Avoiding that is a hard constraint on the filename.
      - >-
        A new sibling RUN directory was rejected. There was one execution, not
        two; a second run directory would need command.txt, environment.json,
        stdout.log, stderr.log and raw-result.json beside it to satisfy
        check_run, and populating those by copying would present one execution
        as two run records. That is fabrication under AGENTS.md core rule 9.
    run_id_reuse_declared: >-
      This record carries the SAME run id, RUN-LPF-001-plantz, because it
      describes the SAME single execution. Giving it a new run id would assert a
      run that never happened. The consequence is declared - if any future tool
      widens its discovery glob to match this filename, it must treat this
      record as superseding the prior one rather than as a second run, or it
      will report a duplicate ID.

  # =====================================================================
  # VALIDATOR REACHABILITY - THE HALF OF DEF-065-1 THIS RECORD CANNOT CLOSE
  # =====================================================================
  validator_reachability:
    stated_plainly: >-
      THIS RECORD DOES NOT MAKE tools/validate_ledger.py STOP ERRORING, AND NO
      RECORD CAN. The tool discovers run manifests by the path glob
      experiments/*/runs/*/manifest.yaml and knows nothing about supersession.
      It will keep reading the prior manifest at its own path and keep reporting
      "run missing required field 'environment'" and "run missing required
      field 'inputs'" for exactly as long as that file exists unedited. This
      file is not matched by that glob and is therefore not read by the tool at
      all.
    what_this_record_does_close: >-
      The SUBSTANCE of DEF-065-1. The environment, inputs and resource
      measurements the schema asks for now exist as a committed, sourced,
      machine-readable record for this run, and a reader or tool that follows
      the supersession finds them.
    what_remains_open: >-
      The MECHANICAL half. Until the validator learns supersession, the run
      package does not index cleanly.
    routes_considered_and_rejected:
    - route: 'edit the prior manifest in place'
      rejected_because: >-
        It invalidates an attested archive receipt over a pushed run record.
        Forbidden by AGENTS.md rule 4 and by the explicit instruction governing
        this repair.
    - route: 'add the two error lines to tools/validate_ledger_baseline.txt'
      rejected_because: >-
        The baseline's own header states that lines may only ever be REMOVED and
        that adding one to absorb a new violation defeats the check. This is a
        new violation, introduced this session.
    - route: 'register the manifest in tools/legacy_run_inventory.yaml'
      rejected_because: >-
        That inventory grandfathers records that PREDATE the validator. This
        manifest was written on 2026-08-01, after it. Registering it there would
        launder a new defect as historical debt, which is worse than the defect.
    the_only_clean_mechanical_fix_named: >-
      A REVIEWED TOOL CHANGE, not a record. The narrow form is a supersession
      registry read by check_run - superseded path, superseding path, and both
      sha256 values - so the schema check is routed to the superseding record
      while the prior path stays hash-pinned and immutable. That is a change to
      a gate and it must not be made by the same session whose record is
      failing the gate. It needs its own task, its own tests alongside
      tools/test_goal_closure_quorum.py, and independent review.
    a_trap_for_whoever_wires_it: >-
      tier_of_run() in tools/validate_ledger.py does bits = int(bits) on
      inputs.parameters.field_bits. This run's field_bits is the LIST [16, 20],
      exactly as RUN-LPF-001-calib records it, and int() of a list raises
      TypeError rather than an error line. The path is only reached when an
      evidence record cites the run, and no evidence record cites this one, so
      it is latent today. Anyone routing this record into check_run must handle
      list-valued field_bits first.

