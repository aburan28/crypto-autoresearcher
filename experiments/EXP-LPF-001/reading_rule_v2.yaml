  band_provenance:
    rule_quoted: >-
      THR-LPF-1 - "For every statistic in STAT-LPF-1 and every cell, the band is
      the [2nd, 199th] ASCENDING ORDER STATISTIC pair of that statistic's 200
      LPF-CAL-A uniform-integer replicate values at that cell. The rejection rule
      is STRICTLY BELOW the lower or STRICTLY ABOVE the upper."
    arm: >-
      OBJ-NULL-UNIF - uniform random integers on [1, p**2] from the frozen
      calibration stream, n = 130816 per replicate, pushed through the identical
      factorization, largest-prime-factor, smoothness-indicator, CDF, ratio, KS and
      tail pipeline. THE APPARATUS CALIBRATION AND NOT THE COMPARISON
      (ABS-REL-LPF-1). No band below comes from OBJ-REAL, OBJ-NULL-SYNTH,
      OBJ-CTRL-PRODUCT or any plant arm.
    stage: 'LPF-CAL-A, 200 replicates, per cell.'
    array: >-
      experiments/EXP-LPF-001/results/calib/null_replicate_statistics.json at
      per_cell.<bits>.LPF-CAL-A.LPF_null_replicate_values.<statistic_id>, a
      200-element array per (cell, statistic id).
    operation: >-
      lower = sorted(array)[1] (ascending rank 2); upper = sorted(array)[198]
      (ascending rank 199). Every edge below was read from the driver's
      band_by_frozen_rule block, which carries lower_rank_ascending 2 and
      upper_rank_ascending 199 on every entry, and the validator independently
      recomputed the same ranks from the same arrays.
    per_comparison_false_fire_probability: 0.01990049751243781
    false_fire_derivation: '2/201 + 2/201 = 4/201, computed pre-datum from the order-statistic ranks alone.'
    tie_caveat_declared: >-
      DECLARED BECAUSE IT IS MEASURABLE IN THE ARRAYS. p_hat is a rational with
      denominator 130816 and ties between adjacent order statistics occur - at
      bits 16 the STAT-RATE-u@u_target=2 lower edge EQUALS the measured minimum,
      the STAT-RATE-u@u_target=5 upper edge EQUALS the measured maximum, and at
      bits 20 the STAT-RATE-u@u_target=2 and STAT-RATE-u@u_target=6 upper edges
      EQUAL their measured maxima. Where ranks tie, the probability of a fresh
      correct draw falling STRICTLY outside is strictly LESS than 4/201, so 0.0199
      is an UPPER BOUND on the per-comparison false-fire probability at those
      edges, never an understatement.
    completeness_and_D5: >-
      EVERY statistic id in statistic_ids(bits) carries a band and a null_spread
      entry at BOTH cells, including the two STRUCK ids. This is mandatory and not
      cosmetic - VAL-20260801-006 D5 established that _load_reading_rule accepts
      empty bands and null_spread mappings, that the per-statistic completeness
      check runs only inside run_measurement's per-cell loop AFTER
      deterministic_factor_base has enumerated, specialized and factored OBJ-REAL
      at that cell, and that a MISSING CELL KEY or a missing null_spread entry
      raises a bare KeyError caught by neither handler, crashing without writing
      the 'invalid' raw-result record. An incomplete file would therefore touch the
      real object and then abort with no package. The completeness is supplied here
      in full. HOISTING THE CHECK BEFORE deterministic_factor_base IS THE ACTUAL
      REPAIR AND IT CANNOT BE DONE IN THIS FREEZE - under ATS-LPF-1 clause 3 it is
      a Coordinator amendment producing a NEW driver under a NEW hash, and this
      task may not edit the hash-bound file. Carried forward as an open defect.
    d5_restated_for_this_file: >-
      THE MITIGATION IS SUPPLIED AGAIN IN FULL AND IS THE REASON THIS FILE MUST BE
      LOAD-TESTED BEFORE IT IS ARCHIVED. RR-LPF-2 carries both string cell keys
      '16' and '20' and all seven statistic ids under each, in BOTH bands and
      null_spread, and frozen true. TASK-20260801-054 independently confirmed the
      defect and confirmed that carrying rather than patching it is correct.

