# =========================================================================
# ATTAIN-RR-LPF-2 - THE ATTAINABILITY ARGUMENT, IN MEASURED NUMBERS
# COPIED FROM ATTAIN-RR-LPF-1 AND RE-CHECKED AGAINST THE REGENERATED LISTS.
# =========================================================================
attainability_argument:
  id: ATTAIN-RR-LPF-2
  supersedes: ATTAIN-RR-LPF-1
  discipline: ATTAIN-LPF-1
  requirement_quoted: >-
    "RR-LPF-1 freezes with an argument IN MEASURED NUMBERS that SOME ACHIEVABLE
    MEASUREMENT LANDS IN EVERY BRANCH, each branch classified DEMONSTRATED-REACHABLE
    or REACHABLE-IN-PRINCIPLE with which one said explicitly. A BRANCH UNREACHABLE
    BY CONSTRUCTION IS A REVISE."
  what_change_a_did_to_this_argument: >-
    NOTHING, AND THAT IS CHECKED RATHER THAN ASSUMED. Every demonstration below
    rests on band rejections, on interior LPF-CAL-A replicates, on measured R(u)
    ranges or on the rank-2 / rank-199 construction. NONE reads a moving_rungs
    list, and the three regenerated differences are at gamma = 0.005, 0.01 and
    0.001, rungs no demonstration cites. TASK-20260801-054 duty 1 independently
    reached the same verdict on the identical demonstrations - "NO BRANCH IS
    UNREACHABLE BY CONSTRUCTION."
  what_counts_as_an_achievable_measurement_here: >-
    STATED SO THE DEMONSTRATIONS CAN BE CHECKED. An achievable measurement is an
    output the frozen pipeline actually produces on some admissible input. The 200
    LPF-CAL-A uniform replicates, the 20 OBJ-CTRL-PRODUCT replicates and the 20
    replicates at each of the 28 plant rung-cell pairs are ACTUAL OUTPUTS of the
    identical code path, so a branch reached by one of them is DEMONSTRATED-REACHABLE
    with measured numbers. A branch reached only by an input the calibration did not
    produce is REACHABLE-IN-PRINCIPLE.

  per_branch:
  - branch: L-0
    classification: REACHABLE-IN-PRINCIPLE
    argument: >-
      No measured object lands here, correctly - the calibration completed valid with
      LPF_factorization_verified_fraction 1.0 on 68950136 factorizations, zero
      verification failures, the tripwire false, no budget event and peak RSS 0.164 GB
      against 8 GB. The refusal machinery WAS exercised by the validator - the driver
      refuses in measure mode with no approval receipt, with a PENDING receipt, and
      with an APPROVED receipt but no reading rule, in each case with status invalid
      and the tripwire still false. L-0 is reached by any integrity or infrastructure
      failure of the measurement run, which is achievable and is not demonstrated
      because demonstrating it would require breaking the run.
  - branch: L-1
    classification: REACHABLE-IN-PRINCIPLE
    argument: >-
      Reached through the DECAY-LPF-1 leg, which the MEASUREMENT ARM produces - the
      real arm's p_hat(u) monotonicity across the five frozen rungs is unmeasured and
      unknown at this freeze. The calibration's uniform arm is strictly decreasing at
      both cells, so the null does not fire the leg, which is the correct behaviour
      for a null and shows the leg is not trivially true. The MOVEMENT leg is FALSE by
      construction after the strikes and is stated as such above; L-1 does not depend
      on it for reachability.
  - branch: L-5
    classification: REACHABLE-IN-PRINCIPLE
    argument: >-
      Reached through leg 3, the Dickman reproduction, which the measurement run
      recomputes from its own solver. Legs 1 and 2 are resolved FALSE on archived
      calibration data and cannot change; they were attainable when the calibration
      ran and did not occur. THE HONEST STATEMENT IS THAT L-5 IS TWO-THIRDS SPENT,
      not that it is unreachable.
  - branch: L-2
    classification: DEMONSTRATED-REACHABLE
    argument: >-
      DEMONSTRATED BY MEASURED OUTPUTS OF THE IDENTICAL PIPELINE. For each of the five
      retained certifying ids at each cell, 198 of the 200 LPF-CAL-A replicate values
      lie at or inside the [rank 2, rank 199] band by construction of the band, and
      rejection is STRICT, so an interior replicate rejects nothing. At every POWERED
      rung at both cells the measured R(u) over all 200 replicates lies wholly inside
      [1/8, 8] - the ranges are 1.161 to 1.184, 1.410 to 1.483, 1.876 to 2.226 and
      3.659 to 5.346 at bits 16 and 1.116 to 1.140, 1.273 to 1.350, 1.516 to 1.785 and
      1.939 to 3.146 at bits 20, computed from the archived per-rung minima and maxima
      divided by the same rho. So a uniform replicate that is interior at both cells
      satisfies all three conjuncts of L-2, and such replicates exist in the archive.
    lands_here_from_the_ladders: >-
      ALSO REACHED BY MEASURED PLANT OBJECTS - OBJ-PLANT-SMOOTH at gamma = 0.0005
      produces no band rejection at either cell (largest excursion
      STAT-RATE-u@u_target=4 at 1.685 and 2.048 null sd against band edges of 2.071
      and 2.586), and OBJ-PLANT-ROUGH at gamma = 0.0005, 0.001, 0.002, 0.005 and 0.01
      likewise produces none (largest excursion STAT-RATE-u@u_target=2 at -2.061 and
      -2.217 against edges of -2.220 and -2.497). A REAL PERTURBATION BELOW THE
      DETECTION FLOOR LANDS IN L-2, which is exactly what "at the measured detection
      floor, and nothing more" in the L-2 disposition means.
    consistency_with_change_a: >-
      NOTED BECAUSE IT CUTS THE RIGHT WAY. The ROUGH rungs listed here as producing no
      band rejection include gamma = 0.005 and 0.01 at bits 16, which are precisely
      the rungs change (a) removed from the certified list. The two archived criteria
      agree, and the corrected list is the more consistent one.
  - branch: L-3
    classification: DEMONSTRATED-REACHABLE
    argument: >-
      DEMONSTRATED BY THREE DISTINCT MEASURED OBJECTS. (1) OBJ-CTRL-PRODUCT lands here
      at both cells - every retained certifying id is outside its band in the SAME
      direction (above) at both cells, with shifts 502.12, 580.18, 491.44, 378.36 and
      934.18 null sd at bits 16 and 479.60, 511.60, 508.98, 383.75 and 1097.12 at bits
      20. (2) OBJ-PLANT-SMOOTH at gamma = 0.001 and above lands here -
      STAT-RATE-u@u_target=4 is above band at both cells (3.406 and 4.036 null sd
      against edges 2.071 and 2.586). (3) OBJ-PLANT-ROUGH at gamma = 0.02 and above
      lands here - STAT-RATE-u@u_target=2 is below band at both cells (-4.366 and
      -4.566 against edges -2.220 and -2.497). L-3 is reachable in BOTH directions and
      by both plant families, which is the point of having two ladders.
    d2_caveat_travels: >-
      The product-control shifts quoted here MAY NOT BE READ AS EFFECT SIZES - D2, and
      at bits 16 STAT-RATE-u@u_target=2 is saturated at 1.0 with plant_sd 0.0, so its
      figure is censored. They are quoted only to show the branch is reached.
  - branch: L-4
    classification: DEMONSTRATED-REACHABLE
    argument: >-
      DEMONSTRATED IN BOTH OF ITS FIRST TWO CLAUSES BY MEASURED NUMBERS. Clause "a
      departure whose direction differs between cells" - OBJ-PLANT-SMOOTH at
      gamma = 0.05 read on STAT-KS-DICK is BELOW band at bits 16 (-4.278 null sd
      against a lower edge of -2.438) and ABOVE band at bits 20 (+11.846 against an
      upper edge of +2.357). That is a measured, archived, direction-differing pair
      produced by the identical pipeline. Clause "a departure at exactly one cell" -
      the archived LPF-CAL-A arrays contain, for every statistic at every cell,
      exactly the two replicate values that fall outside the band by construction of
      the rank-2 / rank-199 rule; for example the bits-16 STAT-KS-DICK minimum
      0.0474559686888454 is strictly below the bits-16 lower edge 0.04749419031311155,
      while 198 of the 200 bits-20 STAT-KS-DICK replicates are interior. The two cells
      are separate curve instances measured from disjoint streams, so a joint
      measurement that rejects at bits 16 and not at bits 20 is an achievable output
      of the pipeline and its two halves are both in the archive.
    third_clause_note: >-
      The third clause, "LIMB B undecidable at a rung where LIMB A rejects", is NOT
      demonstrated - the only non-decidable rung is bits 16 u_target = 6, whose LIMB A
      statistic is struck, so under OPEN-RR052-B READING A, as ruled, that clause
      cannot fire. A branch is reachable if ANY of its clauses is; L-4's first two are
      demonstrated.
    d6_caveat_travels: >-
      The direction-differing STAT-KS-DICK pair demonstrates the CLAUSE and may not be
      read as the two cells disagreeing about the direction of a perturbation - D6 and
      OPEN-RR052-D as ruled.
  verdict: >-
    NO BRANCH IS UNREACHABLE BY CONSTRUCTION. THE ATTAIN-LPF-1 STOP CONDITION DOES NOT
    FIRE AND RR-LPF-2 IS FROZEN.

  # ---------------------------------------------------------------------
  # THE END-TO-END NULL PROBABILITY OF THE FAVOURABLE BRANCH
  # COPIED FROM RR-LPF-1. NO PROBABILITY OR INTERVAL MOVES.
  # ---------------------------------------------------------------------
  null_probability_of_reaching_L2:
    why_this_number_is_required: >-
      RT048-B2 - a favourable branch that a correct null reaches with probability near
      1 is a branch that could not have failed, and a favourable branch a correct null
      almost never reaches is the BATCH-022 defect. THE NUMBER IS COMPUTED PRE-DATUM
      FROM THE MEASURED BANDS AND REPORTED EITHER WAY.
    model: >-
      A correct uniform sample of the same n at the same X at both cells. Ten
      comparisons - five retained certifying ids at each of two cells - each with a
      per-comparison false-fire probability of at most 4/201 = 0.0199005 by the
      order-statistic ranks alone. The R(u) legs contribute separately.
    band_leg:
      union_bound_lower: 0.800995
      union_bound_derivation: 'P(no rejection) >= 1 - 10 * 4/201.'
      independence_reference: 0.817910
      independence_derivation: '(1 - 4/201)**10, an idealization because the five statistics are computed from the same sample and are positively dependent.'
      comonotone_upper: 0.980100
      comonotone_derivation: '1 - 4/201, the value if all ten comparisons rejected together.'
      honest_statement: >-
        The exact value is not computable from the archive because the joint law of
        the five statistics across cells is not archived per replicate. It lies in
        [0.801, 0.980] and the independence reference is 0.818. THE DEPENDENCE IS
        POSITIVE (all five are monotone functionals of the same sample's smoothness),
        so the true value is at or above 0.818.
      the_stated_reason_is_wrong_and_is_carried_unrepaired: >-
        RTB-054-4, CARRIED RATHER THAN PATCHED. The per-replicate joint law WITHIN a
        cell IS archived - LPF_null_replicate_values carries all 200 values of every
        statistic in replicate order - and the two cells are drawn from disjoint
        independent streams, so the cross-cell law is independent by construction.
        Counting directly, 193 of 200 bits-16 and 191 of 200 bits-20 replicates are
        interior on all five retained ids simultaneously; rescaling the fresh-draw
        expectation by the measured clustering gives P(L-2 | correct null) about 0.85
        rather than 0.818. THE FROZEN INTERVAL [0.789, 0.980] CONTAINS THE CORRECTED
        VALUE AND NO CONCLUSION CHANGES, so the numbers are not edited - editing them
        would be a fifth change - and the correction travels with them.
    r_u_leg:
      measured_failures: '0 of 200 replicates at every powered rung at both cells.'
      derivation: >-
        From the archived per-rung minima and maxima divided by the driver's rho, the
        200-replicate R(u) range at every powered rung lies wholly inside [1/8, 8];
        the closest approach to an edge is bits 16 u_target = 5 with a maximum of
        5.346 against 8.
      rule_of_three_upper_bound_on_the_per_replicate_failure_rate: 0.015
      limb_b_declaration_travels: 'LIMBB-DECL-RR066. The closeness of that approach is the same fact the declaration states as a 1.75x headroom.'
    end_to_end:
      point_estimate: 0.818
      interval: [0.789, 0.980]
      interval_derivation: >-
        Lower edge = union-bound band leg 0.801 minus the rule-of-three allowance
        0.015 for the R(u) leg (0.786), widened to 0.789 by taking the R(u) allowance
        against the independence reference instead; upper edge = comonotone band leg
        with the measured 0/200 R(u) leg.
      reading: >-
        NEITHER FAILURE MODE IS PRESENT. A correct null reaches the favourable branch
        about 82 percent of the time - so L-2 is NOT a branch that could not have
        failed (it fails about 18 percent of the time on a correct sample), and it is
        NOT the BATCH-022 defect, where TAIL-DS-1 admitted a correct null with
        probability 1/e = 0.368 and was unsatisfiable in the deep tail. The measured
        contrast, 0.82 against 0.368, is the whole content of the TAIL-LPF-1 repair.
    null_probability_of_the_other_branches:
      L_3: >-
        About 0.001. Per statistic, P(both cells reject in the SAME direction) =
        2 * (2/201)**2 = 1.980e-04; over five retained statistics the union bound is
        9.90e-04. The R(u) route contributes 0 of 200 measured. SO A CORRECT NULL
        FALSELY DECLARES A DEPARTURE ABOUT ONCE IN A THOUSAND.
      L_4: >-
        About 0.18, the residual. P(exactly one cell rejects) for a given statistic is
        2 * 0.0199 * (1 - 0.0199) = 0.0390, which is about 197 times the
        same-direction-both-cells probability.
      what_this_design_bought_and_what_it_cost: >-
        STATED PLAINLY BECAUSE IT IS THE DESIGN'S CENTRAL TRADE. Requiring agreement
        at BOTH cells before declaring a departure buys strong protection against a
        false departure (about 0.1 percent) at the price of a substantial chance
        (about 18 percent) of landing INCONCLUSIVE on a perfectly correct sample. The
        dominant failure mode of this experiment on a correct null is L-4, not L-3.
        Anyone reading an L-4 outcome must read it as this design's most likely null
        outcome after L-2 and not as a hint of a departure.
    scope: >-
      These probabilities are properties of the frozen bands and ranks at the two toy
      cells. They are not, and may not be presented as, statements about HEUR-DS-1,
      about the Semaev map, or about anything at cryptographic scale.

  driver_shape_conformance:
    intended_shape: >-
      doc['reading_rule'] is a mapping carrying `frozen: true`, `bands`,
      `null_spread` and `certifying_set_retained`, which is what _load_reading_rule
      requires. `bands` and `null_spread` are keyed by the STRING cell labels '16' and
      '20', because run_measurement indexes them with str(bits). Within each cell both
      mappings carry EVERY id returned by statistic_ids(bits) - the five
      'STAT-RATE-u@u_target=<u>' ids in frozen ladder order plus 'STAT-KS-DICK' and
      'STAT-TAIL-DEEP' - with `lower` and `upper` floats in `bands` and at least `sd`
      in `null_spread`. Extra keys are carried and are ignored by the loader.
      identity_binomial_cut is present and is the integer 4.
    why_this_matters_more_here_than_anywhere_else: >-
      D5, UNREPAIRABLE IN THIS TASK. _load_reading_rule accepts empty bands and
      null_spread mappings; the per-statistic completeness check runs only inside
      run_measurement's per-cell loop AFTER deterministic_factor_base has enumerated,
      specialized and factored OBJ-REAL at that cell; and a MISSING CELL KEY raises a
      bare KeyError caught by neither handler, so an incomplete file would TOUCH THE
      REAL OBJECT and then crash without writing the 'invalid' raw-result record.
      THAT IS WHY THIS FILE MUST BE MECHANICALLY LOADED AND INDEXED, AND A NEGATIVE
      CONTROL RUN, BEFORE IT IS ARCHIVED.
    negative_control_expected: >-
      A load-and-index pass over both cells and all seven ids must raise no KeyError,
      and a deliberately truncated copy of this file must be the thing that fails,
      not this file.
    claim_tier: toy
    no_run_authorized_by_this_file: true
    no_disposition_stated_by_this_file: true
    no_commit_made_by_this_task: true

