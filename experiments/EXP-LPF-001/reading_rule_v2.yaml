  # =====================================================================
  # 4. THE APPARATUS-IDENTITY EXACT-BINOMIAL CUT (L-5 first leg)
  # COPIED FROM RR-LPF-1. THE CUT DOES NOT MOVE.
  # =====================================================================
  identity_binomial_cut: 4

  identity_binomial_cut_record:
    contract_text: >-
      LPF-CAL-B - "the leg fires only if the COUNT of rejections over the
      20 x 4 x 1 = 80 comparisons at that cell exceeds the exact binomial band at
      the same per-test stringency the thresholds already carry. The band is
      computed from 4/201 = 0.0199 and 80 comparisons and is written into RR-LPF-1
      as a frozen integer cut; the reviewer must recompute its false-fire
      probability and a value above 0.02 is a REVISE."
    cut_semantics: >-
      The cut is an integer c. THE LEG FIRES IFF the rejection count at that cell
      is STRICTLY GREATER THAN c. c is the smallest integer with
      P(Binomial(n, 4/201) > c) <= 0.02. NO UNBANDED EXISTENTIAL APPEARS ANYWHERE
      IN THIS RULE (ATTAIN-LPF-1 extension (ii)).
    the_comparison_count_is_ambiguous_and_is_recorded_not_resolved:
      open_item_id: OPEN-LPF049-A
      status: >-
        RULED BY TASK-20260801-054 - NON-DECISIONAL AT THIS CALIBRATION, with
        reading (i) at n = 60 selected as the count actually formed and the most
        stringent of the three. CARRIED AS RULED. This file re-opens nothing and
        the cut stays 4.
      why: >-
        The contract's n = 80 assumes four comparisons per replicate - STAT-RATE-u
        counted once, STAT-KS-DICK, STAT-TAIL-DEEP and STAT-KS2-CAL. STAT-KS2-CAL
        is NON-CERTIFYING and is UNCOMPUTED in the calibration, so the archived
        reading (i) count is 60 = 20 x 3 and the archived reading (ii) count is
        140 = 20 x 7 (STAT-RATE-u at each of the five frozen rungs plus the two
        others). Three candidate n therefore exist and the contract fixes only the
        rule, not which expansion of STAT-RATE-u it meant.
      cuts_computed_for_all_three_readings:
      - {reading: 'reading (i) as delivered', n: 60, cut: 4, false_fire_probability: 0.006882, next_lower_cut_would_be: 'c = 3 with P = 0.031695, above 0.02 and therefore inadmissible'}
      - {reading: 'the contract''s literal 20 x 4', n: 80, cut: 5, false_fire_probability: 0.005321, next_lower_cut_would_be: 'c = 4 with P = 0.021935, above 0.02 and therefore inadmissible'}
      - {reading: 'reading (ii), one comparison per statistic id', n: 140, cut: 7, false_fire_probability: 0.007293, next_lower_cut_would_be: 'c = 6 with P = 0.022712, above 0.02 and therefore inadmissible'}
      reviewer_recomputation_carried: >-
        RTB-054-5. Exact recomputation with math.comb at p = 4/201 gives, for
        n = 140, 0.007246 and 0.022567 rather than the 0.007293 and 0.022712
        recorded above, and 0.005322 rather than 0.005321 at n = 80; n = 60 agrees.
        EVERY CUT AND EVERY ADMISSIBILITY VERDICT IS UNCHANGED. The frozen figures
        above are NOT edited - that would be a fifth change - and the reviewer's
        more exact values are recorded beside them.
      computation_recorded: >-
        p = 4/201 = 0.019900497512437811 exactly, from the order-statistic ranks
        and not from any datum. P(X > c) computed as the exact binomial upper tail
        sum(C(n,i) p^i (1-p)^(n-i), i = c+1..n) in the freezing session. Every
        listed false-fire probability is below 0.02 and every next-lower candidate
        is above it, so each cut is the unique smallest admissible integer for its n.
      measured_counts_against_every_cut:
        archived: 'reading (i) 4/60, 3/60, 3/60, 1/60 and reading (ii) 4/140, 3/140, 3/140, 1/140 for (bits 16 uniform, bits 16 synth, bits 20 uniform, bits 20 synth). Maximum count observed anywhere - 4.'
        consequence: >-
          THE LEG DOES NOT FIRE UNDER ANY OF THE THREE READINGS. 4 does not exceed
          4, does not exceed 5 and does not exceed 7. The reading ambiguity is
          therefore NON-DECISIONAL at this calibration and the branch outcome is
          identical whichever the reviewer chooses.
        the_zero_margin_stated_plainly: >-
          UNDER THE MOST STRINGENT READING THE OBSERVED COUNT SITS EXACTLY ON THE
          CUT, WITH ZERO MARGIN. At n = 60 the cut is 4 and the bits-16 uniform
          count is 4. One further rejection would have fired L-5 and suspended the
          rule. That is not a comfortable margin and it is recorded rather than
          rounded away. TASK-20260801-054 confirmed and endorsed this as recorded.
      the_deviation_the_reviewer_bound: >-
        CARRIED AS RULED. The frozen contract literally fixes n = 80, whose cut is
        5, and this rule writes 4. The reviewer accepted that as a departure in the
        CONSERVATIVE direction - a lower cut fires more readily, and firing L-5
        SUSPENDS the rule and yields no disposition in any direction - and bound the
        consequence: IF ANY FUTURE RECORD NEEDS THIS LEG TO FIRE OR NOT FIRE, the
        choice becomes decisional and is then a Coordinator amendment under
        ATS-LPF-1 clause 4, never a reviewer or freezer interpretation.
      why_a_single_integer_is_nevertheless_written_in_the_field: >-
        The driver's schema declares identity_binomial_cut as one integer and the
        field must hold a value. It holds 4 - the SMALLEST and therefore MOST
        READILY FIRING of the three admissible cuts. That choice cannot manufacture
        a favourable outcome, because firing L-5 SUSPENDS THE RULE and yields no
        disposition in any direction; the conservative direction here is the low
        cut, and the low cut is what is written.

  # =====================================================================
  # 5. THE LIMB B DECIDABILITY MAP (ABS-REL-LPF-1)
  # COPIED FROM RR-LPF-1 UNCHANGED. NO ROW, FLAG OR BAND MOVES.
