        WORD - "NO CERTIFIED POWER AGAINST A DEEP-TAIL-ONLY DEPARTURE IN EITHER
        DIRECTION AT EITHER CELL". What changed is the GROUND. The superseded
        version rested on an impossibility claim for both families and on two
        unreproducible maxima; the restatement rests on a structural bound for the
        rough family and a measured negligible rate for the smooth family, and
