    strikes:
    - id: STRIKE-1
      target: 'STAT-TAIL-DEEP, struck from the certifying set at both cells'
      strike_status: >-
        THE STRIKE ITSELF IS UNCHANGED AND STANDS. Only its justification text is
        restated. RTB-054-2 said this in terms - "STRIKE-1 ITSELF STANDS. Its
        measured basis is unchanged and I reconfirmed it."
      measured_basis: >-
        0 of 28 plant rung-cell rows carry a movement flag; the largest absolute
        shift over all 28 is 0.3379820826156079 null sd, at OBJ-PLANT-ROUGH
        gamma 0.05 bits 20. Under the tighter paired yardstick the validator
        applied (sd/sqrt(20), base-20 null mean) the largest excursion is 0.797,
        still below one. COPIED FROM RR-LPF-1 UNCHANGED.

      # ---------------------------------------------------------------
      # CHANGE (b) - D1 RESTATED
      # ---------------------------------------------------------------
      structural_basis_D1_SUPERSEDED_VERBATIM: >-
        THE INERTNESS IS STRUCTURAL AND NOT LOW POWER, AND THAT DISTINCTION IS
        LOAD-BEARING. The validator regenerated the planted values at the top rung
        gamma = 0.05 and computed their Z directly. The MAXIMUM Z over all 6541
        planted OBJ-PLANT-SMOOTH values is 4.957 at bits 16 and 4.643 at bits 20,
        while the null's tenth-largest Z is about 6.061 and 5.762. OBJ-PLANT-ROUGH
        is bounded by Z < 2 BY CONSTRUCTION. NO PLANTED VALUE AT ANY RUNG OF EITHER
        LADDER CAN ENTER THE TOP TEN OF THE Z DISTRIBUTION. The only effect a plant
        can have on T_deep is to EVICT null samples from that tail, which pushes
        T_deep slightly DOWN - and all 28 shifts are near zero and predominantly
        negative, exactly as that mechanism predicts.
      why_the_superseded_text_is_withdrawn: >-
        THREE SEPARATE FAULTS, EACH ESTABLISHED BY EXECUTION AND NOT BY ARGUMENT.
        (1) THE NUMBERS WERE UNREPRODUCIBLE AND UNARCHIVED. 4.957 and 4.643 were
        taken over from VAL-20260801-006 without re-derivation, against a
        calibration package that does not archive planted Z values and therefore
        cannot check them. RTB-054 got 5.936 and 6.031; the full regeneration over
        all 925,816 plants, validated bit-for-bit at TASK-20260801-065, gets
        5.955369 at bits 16 and 6.916065 at bits 20. (2) THE COUNT WAS WRONG - 6541
        is not the number of top-rung smooth plants, which is 130,820 per cell.
        (3) THE UNIVERSAL CLAIM IS FALSE FOR THE SMOOTH FAMILY. Three planted
        values did enter a deep tail, and in all three the planted T_deep moved UP,
        which the stated eviction-only mechanism says cannot happen.
      structural_basis_D1_RESTATED:
        id: D1-v2
        what_this_replaces: 'One claim about a maximum, replaced by two claims of different kinds.'
        part_i_rough_STRUCTURAL:
          status: STRUCTURAL AND STATED AS STRUCTURAL
          derivation_from_source: >-
            From build_rough_replacement in the hash-bound driver. A replacement
            for a sample v <= X = p**2 is q*r with q a prime drawn in
            (p, v//64] and r a prime with r <= v // q. Hence
            r <= v // q <= p**2 / q < p < q, so q is strictly the largest prime
            factor, P_max = q exactly, and
            Z = ln(q r)/ln q = 1 + ln r / ln q < 2. The chain uses only the
            construction's own bounds and holds unconditionally - at every rung of
            the frozen ladder, at every gamma, at every replicate and at both
            cells.
          independent_confirmation: >-
            VAL-20260801-007 CC-6 and MR-6 re-checked all 462,736 regenerated rough
            plants in arbitrary-precision Python integers, testing q > p, q | m,
            r < q, r <= v//q and Z < 2, with the primality of q and of r
            additionally verified under a Miller-Rabin independent of the driver's
            is_prime. ZERO violations of every clause in every one of the 14 rough
            blocks. The maximum rough Z anywhere is 1.994781310510841 (bits 20,
            gamma 0.05) and 1.9941869527759615 at bits 16.
          consequence_for_the_deep_tail: >-
            Every measured null tenth-largest Z at both cells is above 5 - the
            LPF-CAL-A minima are 5.657939657036511 at bits 16 and
            5.339285892609557 at bits 20, and the freeze anchors are
            6.060618052804848 and 5.762382565494627. Since 2 < 5, NO ROUGH PLANT
            CAN OCCUPY A DEEP TAIL AT ANY RUNG, and the archive records exactly
            that - 0 exceedances and 0 insertions in all 280 rough
            (cell, rung, replicate) instances and over all 462,736 rough plants.
            THIS HALF OF D1 IS AIRTIGHT AND MAY BE STATED AS STRUCTURAL.
        part_ii_smooth_MEASURED_NOT_STRUCTURAL:
          status: 'MEASURED NEAR-DISJOINTNESS ON THE FROZEN LADDER. NOT STRUCTURAL. NO IMPOSSIBILITY IS CLAIMED.'
          why_no_structural_bound_exists: >-
            build_smooth_replacement returns a product of primes at most
            Bsm(u = 4) - 256 at bits 16 and 1024 at bits 20 - so the planted Z is a
            random variable bounded only by ln(X)/ln 2, and no argument from the
            construction excludes the deep tail. The smooth family has no analogue
            of the rough chain and none is claimed.
          the_measured_statement:
            scope: 'the WHOLE frozen smooth ladder - all seven rungs, both cells, 14 blocks, 463,080 planted values in 280 (cell, rung, replicate) instances.'
            exceedance_definition: 'a planted Z strictly greater than THAT replicate''s own null tenth-largest Z, the null being the same replicate''s unplanted uniform base.'
            per_replicate_exceedance_counts: >-
              3 of the 280 smooth instances carry exactly ONE exceeding plant and
              277 carry NONE. No instance carries two or more. For the rough
              family, 0 of 280.
            per_plant_exceedance_rate: >-
              3 of 463,080 smooth plants, i.e. about 6.5e-06 per plant. For the
              rough family 0 of 462,736, which is structural and not a rate.
            deep_tail_occupancy: >-
              Over 2,800 examined null deep-tail slots for the smooth family, the
              generator's own by_family aggregate records 3 insertions and 40
              evictions; for the rough family, 0 insertions and 39 evictions over
              2,800 slots.
            the_stable_upper_tail_statement: >-
              THE QUANTITY THAT DOES NOT DEPEND ON ONE INTEGER. At the rungs where
              the deep tail is read, the ARCHIVED 99.99th percentile of the planted
              Z distribution lies BELOW the null tenth-largest Z at both cells -
              5.535876141602368 against 6.060618052804848 at bits 16 gamma = 0.05,
              and 5.190061837472107 against 5.762382565494627 at bits 20
              gamma = 0.05. At the bits-20 gamma = 0.02 block, whose rank-1 maximum
              is the highest anywhere in the package, the p99.99 is 5.260801146064238,
              also below the anchor.
          the_rank_10_quantity_the_branch_actually_reads: >-
            STAT-TAIL-DEEP IS T_deep, THE TENTH LARGEST Z, AND IT IS THE ONLY
            DEEP-TAIL QUANTITY ANY BRANCH OR STRIKE READS. Across all 28 plant
            rung-cell rows its measured shift is below one null sd, largest
            |shift| 0.3379820826156079, and below one under the tighter paired
            yardstick as well, largest excursion 0.797. THAT MEASUREMENT IS WHAT
            STRIKE-1 RESTS ON AND IT IS UNAFFECTED BY EVERYTHING ELSE IN THIS
            RESTATEMENT.
          the_direction_correction: >-
            THE SUPERSEDED ONE-WAY MECHANISM IS WITHDRAWN AND NOT REPLACED BY
            ANOTHER. In each of the three exceedance instances the planted arm's
            T_deep moved UP, not down, by +0.16613459508532102 (bits 16,
            gamma 0.05, replicate 10), +0.04424795880325849 (bits 20, gamma 0.02,
            replicate 11) and +0.06166194166478878 (bits 20, gamma 0.05,
            replicate 0). The claim that "the only effect a plant can have on
            T_deep is to EVICT" is therefore FALSE for the smooth family and is
            withdrawn. What remains is a measurement - the net shift is small and
            predominantly negative over the 28 rows, and it is recorded as a
            measurement rather than as a mechanism.
          eviction_to_insertion_ratio:
            value: '40 evictions to 3 insertions, quotient 13.33'
            slice_named_in_full: 'OBJ-PLANT-SMOOTH, BOTH CELLS, ALL SEVEN RUNGS of the frozen ladder (gamma from 0.0005 to 0.05 inclusive), 14 blocks, 463,080 plants, 2,800 examined null deep-tail slots.'
            provenance: >-
              GENERATOR-EMITTED. aggregates.by_family."OBJ-PLANT-SMOOTH" of
              results/plantz/plant_z_tail_report.json, with the quotient emitted by
              the same generator under
              evictions_over_insertions_ARITHMETIC_ON_THE_ARCHIVED_COUNTS. This
              slice is quoted PRECISELY BECAUSE it is generator-emitted; see
              DEF-065-2.
            the_counts_are_quoted_and_not_recomputable: >-
              STATED BECAUSE VAL-20260801-007 REQUIRED IT. The null and planted
              top-ten INDEX SETS are not archived, only the resulting counts, so
              the eviction and insertion counts CANNOT be re-derived from the
              archive without regenerating. The validator did regenerate and found
              them correct. THIS FILE QUOTES AN ARCHIVED COUNT, NOT A RECOMPUTABLE
              ONE.
            the_two_are_not_independent_measurements: >-
              LOAD-BEARING AND STATED WHEREVER THE RATIO IS CITED. The identity
              evictions = insertions + promoted holds in all 28 blocks BY
              CONSTRUCTION of `promoted`, so the quotient is a bookkeeping
              relationship among counts that partition the same 2,800 slots, and
              is NOT the ratio of two independent estimates of anything. It may be
              read as a description of how the deep tail was disturbed and never as
              a test statistic or an effect size.
            the_gamma_slice_trap: >-
              `gamma <= 0.05` IS VACUOUS ON A LADDER TOPPING OUT AT 0.05 and
              selects all seven rungs; the archive shows this directly, since
              aggregates.by_family_gamma_le_0p05 is field-for-field identical to
              aggregates.by_family. The slice `gamma == 0.05` is a DIFFERENT slice -
              2 blocks, 261,640 plants, 19 evictions to 2 insertions, quotient 9.50 -
              and differs from the all-rungs quotient by 40 percent. THIS FILE
              QUOTES THE ALL-RUNGS SLICE AND NAMES IT AS SUCH. Any deliverable
              citing a ratio from this package must name family, cells and gamma
              slice; see DEF-065-5, under which the numeral pair 19:2 is by itself
              ambiguous between the SMOOTH gamma == 0.05 both-cells slice and the
              SMOOTH bits-20 all-rungs aggregate.
        part_iii_why_this_is_not_stated_as_a_maximum:
          basis: 'VAL-20260801-007 DEF-065-4, acted on rather than noted.'
          the_argument: >-
            A MAXIMUM IS THE WRONG OBJECT FOR A FROZEN STRUCTURAL CLAIM, AND THE
            CLASS OF STATEMENT IS THE PROBLEM RATHER THAN THE NUMBER. Four reasons,
            each checkable. (1) The driver's own docstring for stat_tail_deep
            records that rank ten and not rank one was chosen DELIBERATELY because
            "a single extreme order statistic has an unstable law and was the
            proximate cause of the TAIL-DS-1 defect" - so a rank-1 restatement
            would reintroduce, into the justification of a strike, exactly the
            instability the statistic being struck was designed to avoid.
            (2) The maximum has now been corrected three times - 4.957/4.643, then
            5.936/6.031, then 5.955369/6.916065 - and each correction was to the
            same rank-1 quantity. Three successive corrections to a maximum is that
            statistic behaving as documented, not three mistakes.
            (3) The current bits-20 figure rests on ONE planted integer - the
            next-highest replicate maximum in its own block is 5.5526405342442215,
            a gap of 1.36 in Z, that block's archived p99.99 is 5.260801146064238,
            and the block contains exactly ONE Bsm(u = 6)-smooth plant, which is
            that outlier. The maxima are driven by rare over-smooth construction
            accidents, not by gamma.
            (4) At bits 16 the top three rungs give 5.955369, 5.922396 and
            5.936052 - a spread of 0.033 - so "bits 16 peaks at gamma = 0.01" is a
            statement about the third decimal place of a rank-1 statistic. A
            different master seed would move both cells' maxima.
          what_is_therefore_asserted_instead: >-
            EVERY QUANTITY D1-v2 ASSERTS IS EITHER STRUCTURAL, OR A COUNT, OR A
            RATE, OR A HIGH-ORDER-STATISTIC PERCENTILE, OR THE RANK-10 QUANTITY THE
            BRANCH ITSELF READS. The per-cell maxima are recorded below as
            observations with their provenance and their instability declared, and
            NO clause of D1-v2, of STRIKE-1, of V8 or of any branch depends on
            them.
          the_maxima_recorded_as_observations_only:
            values: {SMOOTH_bits_16: 5.955368914587463, SMOOTH_bits_20: 6.91606451193366, ROUGH_bits_16: 1.9941869527759615, ROUGH_bits_20: 1.994781310510841}
            provenance: 'aggregates.by_family_and_cell of results/plantz/plant_z_tail_report.json, re-derived bit-for-bit by VAL-20260801-007 MR-2, which issued NO fourth correction.'
            per_cell_maximum_is_not_at_the_top_rung: >-
              UNEXP-PLANTZ-1, CONFIRMED INDEPENDENTLY. bits 20 SMOOTH peaks at
              gamma = 0.02 and bits 16 SMOOTH peaks at gamma = 0.01, in both cases
              above the gamma = 0.05 value. ROUGH peaks at the top rung at both
              cells, as its construction implies. This is recorded as an
              observation about a rank-1 statistic drawn from non-nested per-rung
              plant sets, and it is one of the reasons no claim here rests on a
              maximum.
            what_may_not_be_done_with_them: >-
              THESE FOUR NUMBERS ARE CORRECT FOR THIS MASTER SEED AND ARE NOT
              STABLE QUANTITIES. No deliverable may cite them as a bound, as a
              limit of what the smooth plant can reach, or as evidence that the
              deep tail is or is not reachable. A FOURTH CORRECTION TO THEM WOULD
              BE THE EXPECTED BEHAVIOUR OF THE STATISTIC AND WOULD FALSIFY NOTHING
              IN THIS FILE.
      what_this_forbids_being_said_SUPERSEDED_VERBATIM: >-
        RAISING GAMMA OR THE REPLICATE COUNT WOULD NOT CHANGE THIS. The ladders are
        disjoint in construction from the statistic they were run to certify. No
        deliverable citing this experiment may describe STAT-TAIL-DEEP's inertness
        as "low power", as a sample-size limitation, or as a reason to extend the
        ladder. It is a construction mismatch between the perturbation objects and
        the deep tail, and it would be repaired only by a plant that places mass
        above Z about 6 - which neither frozen plant family does.
      what_this_forbids_being_said_RESTATED:
        retained_unchanged: >-
          NO DELIVERABLE CITING THIS EXPERIMENT MAY DESCRIBE STAT-TAIL-DEEP'S
          INERTNESS AS "LOW POWER", AS A SAMPLE-SIZE LIMITATION, OR AS A REASON TO
          EXTEND THE LADDER. That prohibition is unchanged. What changes is its
          ground - for OBJ-PLANT-ROUGH it is the structural bound of part (i), and
          for OBJ-PLANT-SMOOTH it is the measured near-disjointness of part (ii) at
          the frozen rungs, not an impossibility.
        narrowed_gamma_sentence: >-
          "RAISING GAMMA OR THE REPLICATE COUNT WOULD NOT CHANGE THIS" IS RETAINED
          FOR OBJ-PLANT-ROUGH AND WITHDRAWN FOR OBJ-PLANT-SMOOTH. For the rough
          family it survives unrestricted, because Z < 2 holds for every gamma,
          every replicate and every cell, so no rough ladder however extended
          reaches a deep tail whose floor is above 5. For the smooth family it is
          FALSE - each planted position is a fresh draw from the same construction,
          so the EXPECTED NUMBER of planted values above the null tenth-largest Z
          scales approximately LINEARLY in gamma and in the replicate count. The
          archive shows the scale directly - at gamma = 0.05 the measured rate is
          about 0.05 insertions per replicate at each cell (1 insertion in 20
          replicates at bits 16 and 1 in 20 at bits 20), against about 0.55 and
          0.40 evictions per replicate. A ladder extended in replicates by an order
          of magnitude would be expected to place of order one plant per replicate
          in the deep tail, and this file makes no claim about such a ladder.
        newly_forbidden: >-
          NO DELIVERABLE MAY SAY THAT EITHER FROZEN PLANT FAMILY CANNOT PLACE MASS
          IN THE DEEP TAIL. The smooth family demonstrably did, three times in
          925,816 plants, and in all three the planted T_deep moved UP.
        what_is_still_true_and_may_still_be_said: >-
          The construction mismatch between the perturbation objects and the deep
          tail is REAL AND MEASURED at the frozen rungs, and it remains the reason
          STAT-TAIL-DEEP is struck rather than underpowered. It would be repaired
          only by a plant family that places SUBSTANTIAL mass above the null
          tenth-largest Z - about 6.06 at bits 16 and 5.76 at bits 20 - which
          neither frozen family does at any rung of the frozen ladder.
      is_this_the_third_such_instance: >-
        YES, AND IT IS RECORDED AS SUCH. RTB-040-2 found two of three declared
        certifying statistics at BATCH-024 structurally incapable of moving; this
        is the third distinct instance in this campaign, and the FIRST caught by a
        structural argument rather than only by measurement. That is the intended
        function of PERTURB-MOVE-1 and it worked. The standing lesson recorded for
        the roadmap - a certifying statistic must be checked for reachability by
        its own perturbation objects at DESIGN time, by deriving the support of the
        perturbed law against the region the statistic reads, not at calibration
        time by measuring a shift.
      the_correction_this_instance_additionally_teaches: >-
        ADDED AT THIS SUPERSESSION AND NOT A REVISION OF THE SENTENCE ABOVE. The
        derivation demanded at design time must be checked for which FAMILY it
        covers. Here it covered OBJ-PLANT-ROUGH exactly and OBJ-PLANT-SMOOTH not at
        all, and the frozen text extended it to both by assertion. A structural
        argument that is available for one object and asserted for two is the
        failure mode RTB-054-2 caught.
    - id: STRIKE-2
      target: 'STAT-RATE-u@u_target=6, struck from the certifying set at both cells'
      measured_basis: >-
        0 of 28 plant rung-cell rows carry a movement flag; the largest absolute
        shift over all 28 is 0.4808835 null sd. Under the tighter paired yardstick
        the largest excursion is 1.060, which is why the strike is stated on the
        contract's own |shift| >= 1 criterion over the archived table and not on a
        yardstick the contract did not freeze.
      structural_basis_D1_extended: >-
        THE SAME QUESTION D1 ASKS OF STAT-TAIL-DEEP, ASKED AND ANSWERED HERE. The
        rung is Bsm = 40 at bits 16 and Bsm = 102 at bits 20, i.e. u about 6.01 and
        5.99. OBJ-PLANT-SMOOTH replaces samples by products of primes at most
        Bsm(u = 4) - 256 at bits 16 and 1024 at bits 20 - which are 40-smooth or
        102-smooth only by accident, so the smooth plant adds almost nothing to
        p_hat at u = 6. OBJ-PLANT-ROUGH replaces samples by q*r with q above
        sqrt(X), which are never Bsm-smooth at any rung, so the rough plant can
        only remove the tiny number of u = 6 smooth samples it happens to displace.
        Both effects are second order against a null mean p_hat of 2.19e-04 and
        1.01e-04. THIS IS A CONSTRUCTION MISMATCH OF THE SAME KIND AS D1 AND IS NOT
        LOW POWER.
      copied_unchanged: >-
        STRIKE-2'S JUSTIFICATION IS COPIED FROM RR-LPF-1 VERBATIM AND IS NOT
        RESTATED. It was not faulted by RTB-054, it makes no impossibility claim,
        and its cross-reference to "D1" above should now be read as a reference to
        D1-v2 part (ii)'s KIND of argument - a measured construction mismatch - and
        not to the withdrawn universal claim. The archived plant-Z package
        corroborates it independently at the one place it can be checked: the
        bits-20 gamma = 0.02 block contains exactly ONE Bsm(u = 6)-smooth planted
        value in 52,320, and the bits-16 gamma = 0.05 block ten in 130,820.
      the_role_its_uncertified_status_does_not_spoil: >-
        PRE-DECLARED BY THE CONTRACT, NOT INVENTED HERE. POW-LPF-1 already fixed
        before any datum that u = 6 "IS RECORDED, IS REPORTED, FEEDS DECAY-LPF-1,
        AND IS EXCLUDED FROM R(u) PASS OR FAIL, LABELLED UNDERPOWERED", and stated
        the sample size that would power it (n >= 1526718). That is exactly the
        BATCH-022 u = 6 precedent and it is honoured unchanged - the rung is
        measured, its p_hat and R(u) are reported for both arms, it participates in
        the DECAY-LPF-1 monotonicity check, and it certifies nothing.
    what_the_strikes_do_not_say: >-
      A STRIKE IS A STATEMENT ABOUT THE APPARATUS AND NEVER ABOUT THE
      INTERMEDIATES. Neither strike says anything about the Semaev map, HEUR-DS-1
      or H-LPF-001 in either direction. Per CERT-LPF-1 the non-firing of a struck
      statistic may never be reported as evidence about the intermediates, and
      under AP-4 neither may its firing be reported as power.

