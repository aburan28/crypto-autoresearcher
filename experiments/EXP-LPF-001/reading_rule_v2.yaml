  # =====================================================================
  # 1. THE STOP-CONDITION CHECK, RE-RUN AGAINST THE REGENERATED LISTS
  # =====================================================================
  stop_condition_check:
    id: STOP-RR066
    re_run_rather_than_asserted: >-
      RE-RUN, NOT INHERITED. Change (a) alters which RUNGS carry certified
      per-rung power, so the ATTAIN-LPF-1 stop condition is evaluated again
      against the regenerated lists rather than carried over from STOP-RR052.
    what_the_contract_makes_a_stop: >-
      ATTAIN-LPF-1 - "A BRANCH UNREACHABLE BY CONSTRUCTION IS A REVISE" - is the
      operative stop condition at this task. Its sharpest instantiation is
      ATTAIN-LPF-1 extension (iii) - a branch leg that reads only already-archived
      calibration data is satisfied or not before the measurement runs, and if it
      PRECEDES the substantive branches it makes them unreachable. The budget
      stopping_rules do not apply because this task authorizes and performs no run.
    checks:
    - check: L-1 second leg pre-firing, re-evaluated on the regenerated lists
      text: >-
        L-1 fires if "the PERTURB-MOVE-1 table records no movement at the top rung
        of a ladder the reading rule certifies". This leg reads ONLY archived
        calibration data and L-1 precedes L-2, L-3 and L-4. If this reading rule
        certified any (family, cell, statistic) ladder whose gamma = 0.05 row
        carries LPF_movement_beyond_noise_flag false, L-1 would be satisfied before
        the measurement ran and L-2, L-3 and L-4 would be unreachable by
        construction - a REVISE and a non-execution.
      method: >-
        For each of the seventeen ladders this rule certifies, the gamma = 0.05
        row's flag was read from the regenerated raw flag table below and required
        true.
      result: >-
        DOES NOT FIRE, AND STILL DOES NOT FIRE AFTER CHANGE (a). All seventeen
        certified ladders carry a true flag at gamma = 0.05 - SMOOTH at both cells
        for STAT-RATE-u@u_target=2, 3, 4 and 5 and for STAT-KS-DICK, ROUGH at both
        cells for STAT-RATE-u@u_target=2, 3 and 4, and ROUGH STAT-KS-DICK at bits
        16. THE THREE REGENERATED DIFFERENCES ARE ALL AT NON-TOP RUNGS
        (gamma = 0.005, 0.01 and 0.001), SO NO CERTIFIED LADDER LOST OR GAINED ITS
        TOP RUNG AND NO LADDER'S certified-or-STRUCK STATUS CHANGED. The leg
        evaluates FALSE at this freeze and cannot be made true by the measurement
        arm.
    - check: CERT-LPF-1 exhaustion
      text: 'The certifying set is emptied by the strikes, leaving L-2 and L-3 without content.'
      result: >-
        DOES NOT FIRE. Five of the seven statistic ids are retained
        (STAT-RATE-u at u_target 2, 3, 4 and 5, and STAT-KS-DICK), each moving at
        the top rung of at least one ladder at BOTH cells, with measured shifts
        from 1.5 to 198 null sd. Two ids are struck. The retained and struck sets
        are UNCHANGED by change (a).
    - check: TAIL-LPF-1 both-directions-absent strike
      text: 'If BOTH directional demonstrations for T_deep are absent the statistic is struck by TAIL-LPF-1 itself.'
      result: >-
        DOES NOT FIRE ON ITS OWN TERMS - the upward demonstration is present
        (OBJ-CTRL-PRODUCT above T_hi at both cells) and only the downward one is
        absent. STAT-TAIL-DEEP is nevertheless struck, by the DIFFERENT and
        independently sufficient CERT-LPF-1 ladder rule, as ruled at
        TASK-20260801-054 under OPEN-RR052-A. See tail_deep_disposition.
    - check: any branch unreachable by construction
      result: >-
        NO. All six branches are reachable - see ATTAIN-RR-LPF-2. L-2, L-3 and L-4
        are DEMONSTRATED-REACHABLE with measured numbers; L-0 and L-5 are
        REACHABLE-IN-PRINCIPLE with the honest caveat that two of L-5's three legs
        are already resolved FALSE on archived calibration data and cannot change.
    - check: does change (a) remove any demonstration a branch's reachability rests on
      result: >-
        NO, AND THIS IS CHECKED RATHER THAN ASSUMED. L-3's demonstrated
        reachability rests on OBJ-CTRL-PRODUCT at both cells, on OBJ-PLANT-SMOOTH
        band exits at gamma >= 0.001 and on OBJ-PLANT-ROUGH band exits at
        gamma >= 0.02; L-2's rests on interior LPF-CAL-A replicates and on
        sub-floor plant rungs; L-4's rests on the archived direction-differing
        STAT-KS-DICK pair at gamma = 0.05 and on the rank-2 / rank-199 band
        construction. NONE of these reads a moving_rungs list, and all three
        differences are at rungs no demonstration cites.
    - check: budget or infrastructure stop
      result: 'NOT APPLICABLE. No run is authorized or performed by this task.'
    verdict: >-
      THE STOP CONDITION DOES NOT FIRE. RR-LPF-2 AND ATTAIN-RR-LPF-2 ARE FROZEN.
      As at RR-LPF-1, the freeze is possible only because the two statistics that
      no rung can move are struck; had they been retained, L-1 would have pre-fired
      and this task would have ended in a recorded non-execution instead.

