  limb_b_decidability_map:
    id: LIMBB-RR066
    copied_from: 'RR-LPF-1 limb_b_decidability_map (LIMBB-RR052), verbatim.'
    frozen_absolute_band: [0.125, 8.0]
    band_provenance: >-
      constant_factor_c = 8, inherited unchanged from EXP-DS-001 and frozen in
      THR-LPF-1.absolute_band_frozen_before_any_datum. IT IS NOT DERIVED FROM ANY
      CALIBRATION NUMBER AND HAS NOT MOVED.
    what_the_flag_means: >-
      LPF_limb_b_decidable_flag is TRUE at a rung iff the UNIFORM arm's own R(u)
      lies inside [1/8, 8] there. FALSE means LIMB B IS NOT DECIDABLE AT THAT RUNG
      BY THIS APPARATUS and is a statement about the apparatus and the asymptotic
      reference at a finite X, NEVER about the Semaev map in either direction.
      Non-decidability is a SATISFIED success criterion under SUCC-LPF-1, not a
      failure.
    source_arm: >-
      OBJ-NULL-UNIF. The values below are the CALIBRATION means over the 200
      LPF-CAL-A replicates, divided by the driver's own numerically solved rho at
      the recomputed u. This is ATS-LPF-1 clause 6(b) pre-disclosure, admitted in
      advance.
    rows:
      '16':
      - {u_target: 2, Bsm: 65536, u_recomputed: 2.0, powered: true, uniform_arm_R_u: 1.1702, limb_b_decidable: true}
      - {u_target: 3, Bsm: 1626, u_recomputed: 2.999875, powered: true, uniform_arm_R_u: 1.4522, limb_b_decidable: true}
      - {u_target: 4, Bsm: 256, u_recomputed: 4.0, powered: true, uniform_arm_R_u: 2.0521, limb_b_decidable: true}
      - {u_target: 5, Bsm: 84, u_recomputed: 5.006009, powered: true, uniform_arm_R_u: 4.5709, limb_b_decidable: true}
      - {u_target: 6, Bsm: 40, u_recomputed: 6.012858, powered: false, uniform_arm_R_u: 11.5937, limb_b_decidable: false}
      '20':
      - {u_target: 2, Bsm: 1048576, u_recomputed: 2.0, powered: true, uniform_arm_R_u: 1.1279, limb_b_decidable: true}
      - {u_target: 3, Bsm: 10321, u_recomputed: 3.000009, powered: true, uniform_arm_R_u: 1.3055, limb_b_decidable: true}
      - {u_target: 4, Bsm: 1024, u_recomputed: 4.0, powered: true, uniform_arm_R_u: 1.6443, limb_b_decidable: true}
      - {u_target: 5, Bsm: 256, u_recomputed: 5.0, powered: true, uniform_arm_R_u: 2.4453, limb_b_decidable: true}
      - {u_target: 6, Bsm: 102, u_recomputed: 5.994822, powered: false, uniform_arm_R_u: 5.0386, limb_b_decidable: true}
    the_single_non_decidable_cell_rung: >-
      BITS 16, u_target = 6, Bsm = 40, u_recomputed 6.012858. THE KNOWN-UNIFORM
      ARM'S OWN R(u) IS 11.5937, OUTSIDE THE FROZEN [1/8, 8] BAND, SO LIMB B IS NOT
      DECIDABLE THERE BY THIS APPARATUS. Confirmed independently by
      VAL-20260801-006 against a Dickman solution obtained by different quadrature,
      agreeing to four decimal places. It is a measured fact about the ASYMPTOTIC
      REFERENCE AT A FINITE X - the asymptotic rho under-predicts deep-tail
      smoothness at the toy X - and it is not a statement about the Semaev map.
    it_touches_no_branch: >-
      LOAD-BEARING AND STATED EXPLICITLY. The one non-decidable rung is ALSO the
      one rung POW-LPF-1 excluded from R(u) pass or fail before any datum, and its
      LIMB A statistic STAT-RATE-u@u_target=6 is STRUCK from the certifying set. So
      LIMB B is decidable at EVERY POWERED RUNG AT BOTH CELLS, L-2's third conjunct
      is satisfiable, and L-4's third clause cannot be triggered by this rung under
      the reading applied here.
    run_time_variability_of_the_flag_declared:
      finding: >-
        MEASURED AND DECLARED RATHER THAN ASSUMED CONSTANT. The map above is the
        200-replicate MEAN. The flag the driver computes at measurement time uses
        ONE fresh OBJ-NULL-UNIF replicate. Dividing the archived per-cell minima
        and maxima by the same rho gives the measured range of R(u) over the 200
        replicates - at bits 16 u_target = 6 it is 6.47 to 17.39, which STRADDLES
        8, and at bits 20 u_target = 6 it is 1.53 to 8.81, which also straddles 8.
        At EVERY POWERED RUNG at both cells the measured range lies wholly inside
        [1/8, 8] - the closest approach is bits 16 u_target = 5 at 3.66 to 5.35
        against an upper edge of 8. So the run-time flag is stable at every powered
        rung and variable only at the underpowered u = 6 rung.
      consequence: >-
        No powered rung's decidability can flip at run time on the evidence of 200
        measured replicates. The u = 6 flag may come out either way and no branch
        reads it.
    open_item_this_raises:
      open_item_id: OPEN-RR052-B
      status: >-
        RULED BY TASK-20260801-054 - READING A. "LIMB A rejects" means a rejection
        by a CERTIFYING statistic, so a struck statistic cannot trigger L-4's third
        clause, because CERT-LPF-1 read with AP-4 bars a struck statistic's firing
        from changing a disposition. CARRIED AS RULED; not re-opened.
      question: >-
        L-4's third clause reads "LIMB B undecidable at a rung where LIMB A
        rejects". Two readings. READING A - "LIMB A rejects" means a rejection by a
        CERTIFYING statistic, so a struck statistic such as
        STAT-RATE-u@u_target=6 cannot trigger it, which is the reading coherent
        with CERT-LPF-1's rule that a struck statistic's firing and non-firing are
        both unreadable. READING B - any statistic id's reject boolean counts,
        under which a struck statistic could divert the classification from L-2 to
        L-4 with probability about 0.0199 per cell whenever the u = 6 flag comes
        out false.

  # =====================================================================
  # 5b. CHANGE (d) - THE RTB-054-6 LIMB B DECLARATION. NEW BLOCK.
  # IT CHANGES NO NUMBER. IT DECLARES A LIMIT ON HOW LIMB B MAY BE READ.
  # =====================================================================
  limb_b_interpretation_declaration:
    id: LIMBB-DECL-RR066
    source: 'RTB-054-6, an undeclared interpretation limit found by the independent review at TASK-20260801-054 and repaired here by declaration.'
    binding: >-
      THIS DECLARATION TRAVELS WITH EVERY LIMB B READING OF THIS EXPERIMENT. Any
      citation of LPF_limb_b_decidable_flag, of R(u), of the decidability map, of
      L-2's third conjunct, of L-3's second clause or of L-4's third clause carries
      it. A LIMB B statement made without it is incomplete.
    it_moves_no_number: >-
      STATED FIRST BECAUSE IT IS THE POINT MOST EASILY MISREAD. NEITHER THE
      [0.125, 8.0] BAND NOR THE u_star_formula MOVES. Both are hash-bound
      pre-datum in specification.yaml at sha256
      0d6c946fb84073feae47865da9b787b7d7ba459617834644680a06bf886d1cda, and
      adjusting either after observing that the uniform arm sits at 4.5709 of an
      8.0 ceiling would be textbook post-hoc band adjustment. THIS IS A SCOPE
      STATEMENT AND NOT A REPAIR REQUEST. Every row of limb_b_decidability_map
      above is unchanged, including the bits-16 u = 6 flag false.
    part_1_the_definitional_mismatch:
      statement: >-
        u IS DEFINED AT D WHILE THE SAMPLES LIVE ON [1, p**2]. The frozen
        D_formula gives D = 2**32 at bits 16 and D = 2**40 at bits 20, and
        u = ln(D)/ln(Bsm); but every calibration and measurement sample is drawn
        on [1, p**2]. The archived ratio X/D is 0.5069737250450999 at bits 16 and
        0.5358147405795535 at bits 20 - the sample range is about half the range u
        is computed against.
      consequence: >-
        u IS SYSTEMATICALLY OVERSTATED RELATIVE TO THE SAMPLE RANGE AND rho(u)
        SYSTEMATICALLY UNDER-PREDICTS p_hat, SO R(u) ON A CORRECT UNIFORM ARM IS A
        BIASED ESTIMATOR OF THE THING LIMB B IS NAMED FOR. On a correct uniform
        sample R(u) should sit near 1 at every rung. It does not - the measured
        values rise monotonically in u, 1.1702, 1.4522, 2.0521, 4.5709 and 11.5937
        at bits 16 and 1.1279, 1.3055, 1.6443, 2.4453 and 5.0386 at bits 20.
      what_the_reviewer_recomputed: >-
        Recomputing u against the ACTUAL sample range gives R(u) about 1.063,
        1.199, 1.519, 2.998 and 6.684 at bits 16 and about 1.050, 1.134, 1.318,
        1.794 and 3.365 at bits 20. About half the excess is therefore definitional
        rather than a finite-X property of Dickman. These recomputed values are
        RECORDED AS THE REVIEWER'S DIAGNOSTIC AND ARE NOT SUBSTITUTED FOR ANY ROW
        OF THE MAP.
      the_sole_non_decidable_rung_is_largely_a_definitional_artifact: >-
        THE OPERATIVE FINDING. The single non-decidable cell-rung - bits 16,
        u_target = 6 - moves from R = 11.5937, OUTSIDE the frozen [1/8, 8] band, to
        about 6.68, INSIDE it, under the corrected u. The frozen text attributes
        its non-decidability entirely to "the asymptotic rho under-predicts
        deep-tail smoothness at the toy X"; THAT ATTRIBUTION IS AT BEST HALF RIGHT
        and must not be quoted alone. The frozen sentence is not edited; this
        declaration travels with it.
      it_changes_no_disposition: >-
        The rung remains flagged non-decidable, because the flag is computed from
        the frozen u_star_formula and the frozen band, both of which stand. It is
        also the rung POW-LPF-1 excluded from R(u) pass or fail before any datum
        and whose LIMB A statistic is struck, so no branch reads it either way.
    part_2_limb_b_is_not_a_symmetric_8x_test:
      statement: >-
        BECAUSE THE UNIFORM REFERENCE IS NOT CENTRED AT 1, THE [1/8, 8] BAND IS NOT
        AN 8x TEST IN BOTH DIRECTIONS AT THESE CELLS. At bits 16 u_target = 5 the
        uniform arm already sits at 4.5709 of an 8.0 ceiling, so the real arm needs
        to be only about 1.75x smoother than the uniform arm to exit the band
        there, against 8x if the reference were centred.
      smooth_direction_headroom_at_every_powered_rung:
        definition: '8.0 divided by the uniform arm''s measured mean R(u) at that rung - the multiplicative factor by which the real arm must exceed the uniform arm to exit the band upward.'
        bits_16: {u_target_2: 6.84, u_target_3: 5.51, u_target_4: 3.90, u_target_5: 1.75}
        bits_20: {u_target_2: 7.09, u_target_3: 6.13, u_target_4: 4.87, u_target_5: 3.27}
        reading: >-
          THE TEST TIGHTENS MONOTONICALLY IN u AND IS TIGHTEST AT BITS 16
          u_target = 5, WHERE IT IS A 1.75x TEST AND NOT AN 8x TEST.
      rough_direction: >-
        THE ASYMMETRY RUNS THE OTHER WAY BELOW. Against the lower edge 1/8 = 0.125
        the headroom is the uniform arm's R(u) divided by 0.125, which is at least
        9.0 at every powered rung at both cells (the smallest is bits 20
        u_target = 2 at 9.02) and 36.6 at bits 16 u_target = 5.
        LIMB B IS THEREFORE FAR MORE READILY EXITED UPWARD THAN DOWNWARD AT THESE
        CELLS, and a LIMB B exit's direction must be reported with that asymmetry
        stated.
      what_this_forbids: >-
        No deliverable may describe LIMB B as "an order-of-magnitude band", as a
        symmetric factor-of-8 test, or as equally sensitive in the two directions
        at these cells. A LIMB B exit at bits 16 u_target = 5 is a 1.75x
        observation and must be reported as one.
      what_this_does_not_do: >-
        IT DOES NOT MAKE LIMB B INVALID AND IT IS NOT A GROUND TO WIDEN OR RECENTRE
        THE BAND. A band exit against a pre-datum band remains a valid exit
        wherever it occurs; what this declaration constrains is the MAGNITUDE a
        reader may attribute to it.
    part_3_the_dread_lpf_1_link: >-
      TASK-20260801-054 CONFIRMED the per-cell reading of the frozen D_formula
      (DREAD-LPF-1) as the only admissible reading, and bound this caveat to the
      confirmation - "the reading is right; the resulting R(u) is a biased
      estimator of the thing LIMB B is named for, and that must be declared
      wherever LIMB B is read." THIS BLOCK IS THAT DECLARATION.

  # =====================================================================
  # 6. D9 - THE ABOVE-NOISE NON-MONOTONICITY AT A TOP RUNG
  # COPIED FROM RR-LPF-1. THE WHOLE-LADDER STRIKE IS PRESERVED AS RULED.
  # =====================================================================
  d9_handling:
    id: ANOM-LPF052-1
    status: >-
      CARRIED FORWARD. Opened by the RR-LPF-1 freeze; sequence CONFIRMED EXACTLY
      and the handling ruled CORRECT by TASK-20260801-054. Still open as an
      anomaly; not re-opened as a question.
    finding_restated_with_the_measured_sequence: >-
      OBJ-PLANT-ROUGH / STAT-KS-DICK / bits 20 moves at an intermediate rung and
      then FAILS to move at the top rung. The measured shift sequence across
      gamma = 0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05 is -0.02048864,
      -0.04862445, -0.12221041, -0.35811835, -0.68709089, -1.40275045, -0.75872025
      null sd, so LPF_movement_beyond_noise_flag is TRUE at gamma = 0.02 and FALSE
      at gamma = 0.05. It is the only such row in the 210-row table, confirmed by
      the validator across all 28 sequences and re-confirmed by the mechanical
      regeneration under MECH-MOVE-RR066, whose raw flag set for this ladder is
      exactly [0.02].
    why_it_is_decision_relevant: >-
      THE STRIKE RULE KEYS ON THE TOP RUNG. PERTURB-MOVE-1 - "A FAMILY WHOSE TOP
      RUNG SHOWS NO MOVEMENT IS STRUCK FROM THE CERTIFIED LIST BY THE READING RULE
      RATHER THAN REPORTED AS LOW POWER." It is also the canonical artifact tell of
      docs/inventor-protocol.md section 3 - a quantity that failed to grow when the
      parameter meant to drive it grew.
    how_this_freeze_handles_it: >-
      THE ENTIRE OBJ-PLANT-ROUGH / STAT-KS-DICK LADDER AT BITS 20 IS STRUCK,
      INCLUDING ITS MOVING gamma = 0.02 RUNG. Harvesting the one intermediate rung
      that moved, out of a sequence whose top rung does not, is precisely the
      selective reading PERTURB-MOVE-1 was written to forbid, and certifying it
      would additionally satisfy L-1's second leg on archived data and make L-2,
      L-3 and L-4 unreachable. The strike is applied to the (family, cell,
      statistic) ladder and to nothing else - STAT-KS-DICK remains certifying,
      because its top rung moves under OBJ-PLANT-SMOOTH at BOTH cells (-4.278 and
      +11.846 null sd) and under OBJ-PLANT-ROUGH at bits 16 (-4.199 null sd).
    preserved_at_this_supersession: >-
      UNCHANGED AND EXPRESSLY PRESERVED. See MECH-MOVE-RR066
      the_one_place_the_two_steps_differ and OPEN-RR066-A - the mechanical
      regeneration is applied without disturbing this strike, and the ladder's raw
      flag set is disclosed rather than written into its certification list.
    the_alternative_reading_recorded:
      open_item_id: OPEN-RR052-C
      status: >-
        RULED BY TASK-20260801-054 - "THE FREEZE IS CORRECT. STRIKING THE WHOLE
        OBJ-PLANT-ROUGH / STAT-KS-DICK / BITS-20 LADDER IS RIGHT AND IS NOT
        OVERCAUTIOUS." CARRIED AS RULED; not re-opened.
      alternative: >-
        Certify the gamma = 0.02 rung on its own row, on the ground that
        PERTURB-MOVE-1's per-rung permission ("RR-LPF-1 may certify power at a rung
        only where that table records a shift beyond noise") is satisfied there and
        the top-rung sentence is about families rather than rungs.
      not_applied_because: >-
        The two sentences are not in tension - the per-rung clause is a NECESSARY
        condition for certifying a rung and the top-rung clause is a SUFFICIENT
        condition for striking a family. Both are satisfied here in the direction of
        the strike. Recorded for the reviewer nonetheless.
    the_mechanism_D6_and_what_it_forbids: >-
      VAL-20260801-006 D6 diagnosed the cause by recomputing the two one-sided
      Kolmogorov-Smirnov suprema separately - the sign and the non-monotonicity are
      the D+ / D- ARGMAX SWITCHING across a near-crossing, an instrument property of
      max(D+, D-) rather than a distributional reversal. Under OBJ-PLANT-SMOOTH at
      gamma = 0.05 the null D+ / D- are 0.04919 / 0.00030 at bits 16 and
      0.03824 / 0.00006 at bits 20; the perturbed values are 0.04658 / 0.04382 at
      bits 16, where D+ still wins and the KS value falls, and 0.03642 / 0.04461 at
      bits 20, where D- overtakes and the KS value rises. CONSEQUENCE FROZEN HERE -
      THE SIGN OF A STAT-KS-DICK SHIFT CARRIES NO DIRECTIONAL INFORMATION NEAR THE
      CROSSING, and no deliverable may read the sign difference between cells as the
      two cells disagreeing about the direction of a perturbation.
    consequence_for_reading_a_STAT_KS_DICK_departure_under_L_3:
      open_item_id: OPEN-RR052-D
      status: >-
        RULED BY TASK-20260801-054 - THE FROZEN RULING IS CORRECT AND CONFIRMED,
        WITH AN ADDITIONAL BINDING. CARRIED AS RULED; not re-opened.
      statement: >-
        L-3's disposition requires that THE DIRECTION BE STATED, because smoother
        than reference and rougher than reference have opposite consequences for an
        index calculus. STAT-KS-DICK's band-exit direction is a direction IN THE
        STATISTIC, not in smoothness - a value above the band can arise from either
        one-sided supremum, and D6 shows the argmax does switch between cells at
        these parameters. THE SMOOTH-VERSUS-ROUGH DIRECTION UNDER L-3 MUST THEREFORE
        BE READ FROM STAT-RATE-u, whose direction is unambiguous (p_hat above band =
        smoother than the reference, below = rougher). A STAT-KS-DICK departure
        establishes THAT the empirical Z-CDF departs from the Dickman CDF and does
        not by itself establish WHICH WAY. This adds no branch and changes no
        condition; it constrains what may be written in the disposition.
      the_reviewer_extension_carried_in_force: >-
        THE SAME ARGUMENT BARS THE CONVERSE. A STAT-KS-DICK band exit that AGREES
        IN SIGN across the two cells may NOT be reported as directional agreement
        either, because the agreeing sign may be produced by different argmaxes.
        ONLY STAT-RATE-u ESTABLISHES DIRECTION.
    is_this_an_L_1_artifact_tell: >-
      NO, AND THE REASON IS STATED RATHER THAN ASSUMED. L-1's condition is specific
      - DECAY-LPF-1 fails, or the movement table records no movement at the top rung
      of A LADDER THE READING RULE CERTIFIES. After the strike, this rule certifies
      no ladder with an inert top rung, so the leg is false. The inventor-protocol
      concern that motivates L-1 is nevertheless real, is recorded as this anomaly,
      and is carried into ALT-CLASS-RR066 as an explicit uncertified item.

