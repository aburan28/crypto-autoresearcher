    carried_forward_not_remeasured:
      C0: >-
        The e_1-marginal re-randomization class certified at delta = 0.05 with a
        branch-level floor of delta = 0.02 by EV-EQD-001 - A STATEMENT ABOUT A
        DIFFERENT MEASUREMENT that does not transfer to this one.
    uncertified_after_this_experiment:
      V1: 'Any departure from the Dickman law that a matched-bitlength uniform sample exhibits at the same magnitude and sign - absorbed by LIMB A''s measured band by construction; only LIMB B can see it.'
      V2: 'Any departure of magnitude below the smallest ladder rung gamma = 0.0005, about 65 of the 130816 samples.'
      V3: 'Any departure visible only in the joint law of the largest and second-largest prime factors, in the full factorization pattern, or in the arithmetic of the factors themselves.'
      V4: 'Any departure at u outside the frozen sweep [2, 6], and in particular at u > 6 where this design is underpowered by its own declared arithmetic.'
      V5: 'Any object other than the two frozen toy cells, INT-1, ENC-B, m = 4, d_half = 2, Bfb = 512 and the i < j enumeration.'
      V6: 'THE ENTIRE QUESTION OF BEHAVIOUR AT CRYPTOGRAPHIC D. The toy D here is 2**32 and 2**40; NOTHING MEASURED HERE TRANSFERS UPWARD BY ANY ARGUMENT THIS CONTRACT OFFERS.'
      V7: 'The determinism-versus-small-x-window confound RT049-B6, untouched here as it was in BATCH-024.'
      V8_SUPERSEDED_VERBATIM_FROM_RR_LPF_1: >-
        ANY DEPARTURE VISIBLE ONLY IN THE DEEP TAIL OF THE Z DISTRIBUTION, above
        about Z = 6.06 at bits 16 and Z = 5.76 at bits 20. STAT-TAIL-DEEP is struck
        and NEITHER FROZEN PLANT FAMILY CAN PLACE MASS THERE - the smooth plant's
        maximum planted Z is 4.957 and 4.643 and the rough plant is bounded by
        Z < 2 by construction (D1). This experiment has NO CERTIFIED POWER AGAINST A
        DEEP-TAIL-ONLY DEPARTURE IN EITHER DIRECTION AT EITHER CELL.
      V8: >-
        ANY DEPARTURE VISIBLE ONLY IN THE DEEP TAIL OF THE Z DISTRIBUTION, above
        the measured null tenth-largest Z of about 6.06 at bits 16 and 5.76 at
        bits 20. STAT-TAIL-DEEP IS STRUCK. OBJ-PLANT-ROUGH PLACES NO MASS THERE AT
        ANY RUNG, STRUCTURALLY - Z < 2 by construction against a deep-tail floor
        above 5, and 0 exceedances in 462,736 regenerated rough plants (D1-v2 part
        (i)). OBJ-PLANT-SMOOTH PLACES NEGLIGIBLE MASS THERE AT THE FROZEN RUNGS -
        3 planted values in 463,080, a rate of about 6.5e-06 per plant, in 3 of 280
        (cell, rung, replicate) instances, with the archived 99.99th percentile of
