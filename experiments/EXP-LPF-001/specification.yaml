  # ==================================================================
  # 0. WHY A NEW EXPERIMENT ID, AND WHAT THIS DOES TO EXP-SMTH-001
  # ==================================================================
  relation_to_EXP_SMTH_001:
    id: SUP-LPF-1
    headline: >-
      EXP-LPF-001 SUPERSEDES EXP-SMTH-001 BY ADDITION UNDER A NEW ID. IT DOES NOT
      EDIT, AMEND, VERSION, RE-FREEZE OR RE-SCORE IT, AND IT DOES NOT DECLARE IT
      WRONG ABOUT ITS OBJECT.
    the_immutability_argument_stated_rather_than_assumed: >-
      EXP-SMTH-001 is FROZEN, hash-bound, filed at status `review_required`, NEVER
      APPROVED and NEVER RUN. Its defects are properties of its FROZEN DECISION RULES -
      TAIL-DS-1 in particular - and a defect in a frozen rule cannot be repaired inside
      the frozen file without destroying the only thing a freeze is for. AGENTS.md
      rule 4 and CLAUDE.md rule 2 therefore leave exactly one admissible route - a NEW
      record under a NEW id that states in terms what it takes over and what it
      changes. That is this contract. experiments/EXP-SMTH-001/specification.yaml
      stands as filed and is not read-modified, renamed, re-hashed or staged by any
      task of BATCH-025.
    why_a_new_id_is_MANDATORY_and_not_stylistic: >-
      THE MEASURED QUANTITY IS THE SAME AND THAT IS PRECISELY WHY THE ID MUST CHANGE.
      When EXP-EQD-001 followed EXP-SMTH-001 the argument was that the measured
      quantity differed. That argument is NOT available here and is not offered - this
      experiment measures the same quantity EXP-SMTH-001 was built to measure. What
      differs is the DECISION APPARATUS - the tail rule, the null's role, the threshold
      source, the enumeration, the perturbation ladders and the branch structure - and
      an experiment is individuated by its frozen apparatus as much as by its object.
      Filing this as EXP-SMTH-001 v2 would require editing a hash-bound file that an
      independent review rejected; filing it as a control on EXP-DS-001 is forbidden by
      CTRL-RT047-MATCHED-NULL.budget.new_dependencies, which bars summation-polynomial
      arithmetic in that lane.
    what_is_INHERITED_UNCHANGED_and_is_a_quotation_not_an_edit:
      - 'd_half[4] = 2 and the D_formula D(bits, m) = 2**(bits * d_half[m]), giving D = 2**32 at bits 16 and D = 2**40 at bits 20.'
      - 'u_star_formula u = ln(D) / ln(Bsm) with natural logarithms, every u RECOMPUTED from the integer Bsm and never asserted.'
      - 'constant_factor_c = 8, the frozen EXP-DS-001 constant, neither relaxed nor tightened.'
      - 'min_samples_per_bit_size = 100000.'
      - 'The integer Bsm ladders per cell, reused element by element.'
      - 'The Dickman reference values rho_1 .. rho_6, retained as a REPRODUCTION CHECK on the driver''s own numerical solution and never as a substitute for it.'
      - 'AP-1, the forbidden anti-pattern - flipping smoothness_abort on an EXP-DS-001 arm and calling the mechanism exercised is forbidden here as it was there.'
    what_is_REPLACED_and_why_each_replacement_is_a_repair_of_a_NAMED_defect:
      - id: REP-1
        replaces: TAIL-DS-1
        with: TAIL-LPF-1
        because: >-
          TAIL-DS-1 IS UNSATISFIABLE BY A CORRECT NULL. See tail_statistic_repair below
          for the full arithmetic. This is the single defect that ended BATCH-022 and it
          is repaired by calibration against a MEASURED null rather than against
          asymptotic theory.
      - id: REP-2
        replaces: 'the enumeration i <= j, n = C(513, 2) = 131328'
        with: 'the enumeration i < j, n = C(512, 2) = 130816'
        because: >-
          The second of the two named OPEN-BATCH023-A repairs. The diagonal i = j is a
          degenerate half-tuple and is excluded BY CONSTRUCTION rather than by a filter.
          130816 >= 100000 satisfies the frozen adequacy minimum with a 30.8 percent
          margin, and it matches the EXP-EQD-001 enumeration exactly, which makes the
          two lanes' sample sets comparable objects.
      - id: REP-3
        replaces: 'thresholds asserted from the asymptotic Dickman law'
        with: 'THR-LPF-1, order statistics of 200 MEASURED uniform-integer replicate sample sets at the same n and the same X'
        because: >-
          The first of the two named OPEN-BATCH023-A repairs, and AP-2. At the toy X the
          asymptotic rho is not the finite-sample law, most severely in the deep tail.
      - id: REP-4
        replaces: 'a design with no perturbation ladder at all'
        with: 'two perturbation ladders with PERTURB-MOVE-1 evaluated at EVERY rung'
        because: >-
          The BATCH-024 failure. A power certificate whose perturbations were never
          measured to move the statistic they certify against is not a power
          certificate. See perturbation_movement_discipline.
    what_this_supersession_does_NOT_say: >-
      It does not say EXP-SMTH-001 was worthless - it did the arithmetic that produced
      the Bfb = 512 enumeration floor, the ENC-B bijection and the u sweep, all of which
      are carried forward here. It does not re-score H-SMTH-001, which remains
      `specified` with no evidence in either direction and whose file no task of this
      batch edits. It states no disposition about H-DS-001, H-EQD-001, H-DEP-001,
      H-IC-001 or H-STR-002.

  # ==================================================================
  # 1. WHAT THIS EXPERIMENT IS
  # ==================================================================
  objective: >-
    SAMPLE THE ACTUAL HALF-ARITY SEMAEV PARTIAL-MAP INTERMEDIATES AT TWO FROZEN TOY
    CELLS, BOUNDED BY THE FROZEN D, AND FACTOR THEM. Record the largest prime factor
    and the B-smoothness indicator of every sample at every rung of a frozen smoothness
    ladder, compare the resulting distribution ABSOLUTELY against the Dickman rho(u)
    prediction and the Dickman largest-prime-factor law, and read that comparison
    against bands calibrated on 200 measured uniform-integer replicate sample sets at
    the same n and the same X. THIS IS THE MEASUREMENT HEUR-DS-1 IS ABOUT, AND NO
    EXPERIMENT IN THIS CAMPAIGN HAS EVER FACTORED AN INTEGER.
  what_this_experiment_is_NOT:
    - Not a search. No membership search, no relation harvest, no claw table, no naive or split arm.
    - Not a cost measurement. No wall-clock decision variable, no charged units, no cost identity, no R, no R_null, no assembled E.
    - Not an attack on any deployed curve or live key. No discrete logarithm is computed or claimed.
    - Not an instrument-characterization batch. The object measured is the real object, not a plant, and the plants exist only to certify the apparatus's power.
    - >-
      Not a validation or a refutation of HEUR-DS-1 above the toy tier under any branch,
      and not sufficient alone under ANY outcome to move any asymptotic claim toward
      `supported`.
    - Not a re-score of H-DS-001, H-SMTH-001, H-EQD-001, H-DEP-001, H-IC-001 or H-STR-002.
  claim_ceiling: >-
    TOY. The only claimable objects are the empirical smoothness and largest-prime-factor
    statistics of the frozen intermediate map INT-1 at the two named toy field sizes,
    under the frozen encoding, the frozen factor base and the frozen Bsm ladder, together
    with their comparison to the Dickman prediction and their position in the measured
    uniform-integer bands. NOT CLAIMABLE UNDER ANY OUTCOME - crypto-scale or
    medium-scale validity of HEUR-DS-1; any asymptotic exponent statement; any
    affected-scheme scope statement; any movement of the four asymptotic promotion gates
    G1-G4, which remain OPEN; S1_met, F1_met, F2_met or structure_gate_passed, none of
    which this experiment can evaluate because it runs no search; `support` for H-LPF-001,
    H-SMTH-001, H-DS-001, H-EQD-001 or H-DEP-001; `reject_scoped` on this single
    unreplicated run and in particular reject_scoped-as-impossibility; GOAL-ECDLP-001
    completion; and dominated_by null.

  heuristic_under_test: HEUR-DS-1
  heuristic_statement_quoted_verbatim_from_H_DS_001: >-
    "Intermediate degrees arising from half-arity Semaev partial maps on uniform random
    targets behave, for B-smoothness purposes, like uniform random integers of the same
    bitlength - the probability an intermediate is B-smooth is within a constant factor
    of Dickman rho(u) with u = log D / log B, where D bounds the intermediate degree."

  # ==================================================================
  # 2. THE ABSOLUTE-VERSUS-RELATIVE DESIGN STATEMENT
  # ==================================================================
  absolute_versus_relative:
    id: ABS-REL-LPF-1
    binding: >-
      BINDING ON EVERY DELIVERABLE THAT CITES THIS EXPERIMENT, AND CARRIED VERBATIM INTO
      THE HYPOTHESIS RECORD, THE READING RULE, THE EVIDENCE RECORD AND EVERY DECISION.
    text: >-
      HEUR-DS-1 IS AN ABSOLUTE CLAIM AGAINST A THEORETICAL REFERENCE, NOT A RELATIVE
      CLAIM AGAINST A SECOND SAMPLE, AND THIS EXPERIMENT IS BUILT ON THAT DISTINCTION
      RATHER THAN AROUND IT. The heuristic has two limbs and they are measured
      separately, read separately and reported separately. LIMB B, THE ABSOLUTE LIMB, is
      the claim that the probability an intermediate is B-smooth is within a constant
      factor of Dickman rho(u); it is tested by the ratio R(u) = p_hat(u) / rho(u) read
      against the FROZEN constant-factor band [1/8, 8] inherited unchanged from
      EXP-DS-001, and the reference rho(u) is THEORETICAL and is never replaced by a
      sample. LIMB A, THE RELATIVE LIMB, is the claim that the intermediates behave for
      B-smoothness purposes like uniform random integers of the same bitlength; it is
      tested by reading each certifying statistic against the MEASURED order-statistic
      band of 200 uniform-integer replicate sample sets at the SAME n and the SAME X.
      THE MATCHED-BITLENGTH UNIFORM-INTEGER ARM IS A CALIBRATION OF THE APPARATUS AND IS
      NOT THE COMPARISON. Its first duty is to measure how far a KNOWN-UNIFORM sample of
      this exact size at this exact X departs from the asymptotic Dickman prediction, so
      that the finite-X error of the reference is separated from any Semaev-specific
      departure; IF THE UNIFORM ARM ITSELF LEAVES THE [1/8, 8] BAND AT A RUNG, THEN LIMB
      B IS NOT DECIDABLE AT THAT RUNG BY THIS APPARATUS, and that is reported as a
      statement about the apparatus and the reference, never as a result about the
      Semaev map in either direction. A TWO-SAMPLE COMPARISON IS BLIND BY CONSTRUCTION TO
      ANY DEVIATION BOTH ARMS SHARE - this is ALT-CLASS-DEP-1's U1, established in this
      campaign and not hypothetical - and a departure from an asymptotic reference at a
      finite X is exactly the kind of deviation both arms share; therefore NO BRANCH OF
      RR-LPF-1 MAY BE SATISFIED BY A TWO-SAMPLE AGREEMENT ALONE, the two-sample statistic
      STAT-KS2-CAL is declared NON-CERTIFYING for both limbs, and no deliverable may
      report a two-sample agreement as evidence for HEUR-DS-1. CONFLATING THE CALIBRATION
      WITH THE COMPARISON IS WHAT MADE BATCH-023's RESULT BOUND HALF OF WHAT IT APPEARED
      TO, AND THIS CLAUSE EXISTS TO MAKE THAT CONFLATION IMPOSSIBLE TO COMMIT BY ACCIDENT.
    the_cost_of_the_measured_band_declared_rather_than_hidden: >-
      READING LIMB A AGAINST A MEASURED UNIFORM BAND HAS A PRICE AND IT IS DECLARED AS
      UNCERTIFIED CLASS V1, NOT BURIED. Any departure of the intermediates from the
      Dickman law that a matched-bitlength uniform sample exhibits at the same magnitude
      and the same sign is ABSORBED INTO THE BAND and is not detectable by LIMB A. That
      is not a defect of the band - it is the definition of "behaves like a uniform
      random integer of the same bitlength", which is the literal content of the limb.
      LIMB B exists precisely to catch that shared component, which is why the ratio
      R(u) is reported for the real arm AND for the uniform arm at every rung, side by
      side, in the same table, under every branch.

  # ==================================================================
  # 3. THE TAIL-STATISTIC REPAIR
  # ==================================================================
  tail_statistic_repair:
    id: TAIL-LPF-1
    the_defect_being_repaired: >-
      TAIL-DS-1, AS FROZEN IN EXP-SMTH-001 AND INHERITED THERE FROM EXP-DS-001, IS
      UNSATISFIABLE BY A CORRECT NULL. It sets p_ext to the model probability under rho
      of observing a sample at least as smooth as the SMOOTHEST N_j in the sample and
      passes iff p_ext * n >= 1. For a correct sample of n independent draws, n * p_ext
      evaluated at the sample maximum is asymptotically the standard exponential, so
      P(pass) = P(Exp(1) >= 1) = 1/e = 0.3679 ON A PERFECTLY CORRECT UNIFORM SAMPLE. A
      pass rule that a correct null fails about 63 percent of the time is not a test. It
      is worse than that here - at the toy X the asymptotic rho UNDER-PREDICTS deep-tail
      smoothness, which pushes the observed maximum further out and the pass probability
      lower still, and the direction of that error is exactly the direction that would be
      misread as a Semaev-specific finding. Both facts are computable from pre-datum
      quantities and neither needs a run.
    the_repair_in_one_sentence: >-
      THE DEEP-TAIL STATISTIC IS CALIBRATED AGAINST A MEASURED NULL, NEVER AGAINST
      ASYMPTOTIC THEORY, AND ITS ATTAINABILITY IS DEMONSTRATED WITH MEASURED NUMBERS
      BEFORE THE READING RULE IS FROZEN.
    statistic: >-
      T_deep = the TENTH LARGEST value of Z_j = ln(N_j) / ln(P_max(N_j)) over the sample
      set, where P_max is the largest prime factor and only samples with N_j > 1 and
      P_max(N_j) > 1 contribute. Rank 10 and not rank 1 DELIBERATELY - a single extreme
      order statistic has an unstable law and was the proximate cause of the defect above.
    reference_expectation_recorded_not_used_as_a_threshold: >-
      The rank-10 order statistic sits near the u solving n * rho(u) = 10, which at
      n = 130816 is rho(u) = 7.6e-5, between the frozen rho_5 = 0.00035473 and
      rho_6 = 0.000019650, i.e. u about 5.5. This arithmetic is RECORDED so the statistic
      is known in advance to probe the deep tail rather than the body. IT IS NOT A
      THRESHOLD AND NOTHING IS READ AGAINST IT.
    threshold: >-
      TWO-SIDED MEASURED BAND. THR-LPF-1 sets [T_lo, T_hi] to the 2nd and 199th ASCENDING
      order statistics of the 200 LPF-CAL-A uniform-integer replicate values of T_deep at
      that cell. The rejection rule is STRICTLY BELOW T_lo or STRICTLY ABOVE T_hi. The
      exact per-comparison false-fire probability on a fresh correct draw is
      2/201 + 2/201 = 4/201 = 0.0199, computed pre-datum from the order-statistic ranks
      and stated here so no later reader must reconstruct it.
    attainability_is_DEMONSTRATED_not_asserted: >-
      MANDATORY AT THE READING-RULE FREEZE. RR-LPF-1 must record, in measured numbers,
      (a) the measured [T_lo, T_hi] band and the measured minimum and maximum of the 200
      calibration values at each cell, (b) the measured T_deep of the derivable-smooth
      control OBJ-CTRL-PRODUCT, which must lie ABOVE T_hi, and (c) the measured T_deep at
      the top rung of the ROUGH ladder, which must lie BELOW T_lo. If either directional
      demonstration is absent, the corresponding direction of TAIL-LPF-1 is UNCERTIFIED
      and the reading rule must say so; if BOTH are absent the statistic is struck from
      the certifying set by the reading rule rather than carried as a statistic that
      cannot fire. TASK-20260801-054 checks this as a named duty and a missing
      demonstration is a REVISE.
    the_general_rule_this_instantiates: >-
      NO STATISTIC IN THIS EXPERIMENT IS READ AGAINST A THRESHOLD DERIVED FROM AN
      ANALYTIC LAW (RV012-A1), AND AP-2 BINDS - NO THRESHOLD MAY BE FROZEN THAT HAS NEVER
      BEEN MEASURED AGAINST ITS OWN NULL. The analytic law enters through the STATISTIC,
      where it belongs, because that is what makes the comparison absolute; the
      THRESHOLD is always a measured order statistic, because that is what makes it
      attainable at a finite X.

  # ==================================================================
  # 4. THE SAMPLED QUANTITY
  # ==================================================================
  intermediate_generation:
    id: INT-1
    name: frozen half-arity Semaev partial-map intermediate at m = 4
    inherited_verbatim_from: 'experiments/EXP-SMTH-001/specification.yaml intermediate_generation, quoted and not edited'
    step_1_partial_map: >-
      For m = 4 the meet-in-the-middle splits the 4-tuple (P1, P2 | P3, P4). The
      half-arity partial map sends an unordered half-tuple of factor-base x-coordinates
      (x_i, x_j) to the fibre of intermediate x-coordinates Z for which
      S_3(x_i, x_j, Z) = 0, where S_3 is the third Semaev summation polynomial over F_p.
    step_2_specialization: >-
      Specialize to f_ij(Z) = S_3(x_i, x_j, Z) in F_p[Z], of degree exactly
      d_half[4] = 2 in Z whenever its leading coefficient c_2 is nonzero mod p. Every
      half-tuple with c_2 == 0 mod p is recorded and counted as a DEGENERATE draw and is
      excluded from every statistic, with the exclusion count reported.
    step_3_invariants: >-
      Write f_ij(Z) = c_2 Z**2 + c_1 Z + c_0 over F_p and form
      e_1 = (-c_1) * c_2**(-1) mod p and e_2 = c_0 * c_2**(-1) mod p. The pair (e_1, e_2)
      determines and is determined by the root multiset, so it is a COMPLETE invariant of
      the partial map's image at that half-tuple, well defined whether the roots lie in
      F_p or in F_{p**2}.
    step_4_encoding:
      id: ENC-B
      role: THE ONLY DECISION ENCODING
      definition: 'N_ij = lift(e_1) * p + lift(e_2) + 1, with lift the representative in [0, p). Range exactly [1, p**2].'
      why_this_encoding: >-
        It is a BIJECTION from [0, p) x [0, p) onto [1, p**2]. That single fact is what
        lets the decision variables vary with the thing they measure and is what makes the
        matched-range uniform arm an exactly matched calibration.
      enc_a_is_NOT_a_decision_encoding: >-
        The product encoding M_ij = max(lift(e_1), 1) * max(lift(e_2), 1) appears in this
        experiment ONLY as the derivable-smooth apparatus control OBJ-CTRL-PRODUCT. It is
        NEVER a decision variable about HEUR-DS-1 and never cited as evidence for or
        against the heuristic in either direction.
    the_D_reading_that_EXP_SMTH_001_flagged_and_no_review_ever_adjudicated:
      id: DREAD-LPF-1
      statement: >-
        CARRIED FORWARD AS AN EXPLICIT REVIEWER DUTY BECAUSE IT WAS NEVER RULED ON. The
        BATCH-021 next_action named "D = 2**40" while also naming bits in {16, 20}. Under
        the frozen D_formula those are consistent only if "D = 2**40" names the bits = 20
        cell, D at bits = 16 being 2**32. THIS CONTRACT TAKES THAT READING and applies the
        frozen formula PER CELL. Forcing D = 2**40 at bits = 16 would redraft the frozen
        formula, which is forbidden. EXP-SMTH-001 flagged this for its reviewer and that
        review never completed, so the reading has stood unadjudicated for three batches.
        TASK-20260801-054 must CONFIRM OR REJECT IT EXPLICITLY and a rejection is a REVISE.
    range_matching_note: >-
      DECLARED AND LOAD-BEARING. N_ij lies in [1, p**2] and p**2 <= D = 2**(2*bits), with
      p**2 / D about 0.515 at the bits = 20 instance. THE UNIFORM CALIBRATION ARM IS DRAWN
      UNIFORMLY ON [1, p**2], NOT ON [1, D], so the real and calibration samples share an
      exactly matched range. D is retained ONLY as the frozen bound that defines u through
      the frozen u_star_formula. Drawing on [1, D] would introduce a range mismatch of
      about a factor 1.94 having nothing to do with Semaev structure - the class of
      non-structural difference RT047-B2 and RT048-B3 were about.
    bit_size_labelling_caveat: >-
      RT047-B5 DISCIPLINE APPLIES AND IS DISCHARGED RATHER THAN INHERITED. In this
      experiment `bits` names the FIELD prime p and nothing else. The prime-order subgroup
      order is irrelevant here because no discrete logarithm is computed, no relation is
      harvested and no search is run. No sentence in any deliverable may say "at 20 bits"
      without saying that it is the FIELD.

  # ==================================================================
  # 5. CELLS, FACTOR BASE, ENUMERATION, LADDER
  # ==================================================================
  cells:
    - bits: 16
      instance: generate_instance(2301, 16)
      D: 4294967296
      D_expr: 2**32
    - bits: 20
      instance: generate_instance(2301, 20)
      D: 1099511627776
      D_expr: 2**40
  cells_note: >-
    THE SAME TWO TOY INSTANCES AS EV-EQD-001 AND EXP-DEP-001, DELIBERATELY, so that the
    factor base and the fibre invariants of this measurement are the SAME OBJECTS the
    equidistribution lane measured and the two results compose. THIS IS NOT A REPLICATION
    OF ANYTHING and may never be counted toward `replicated`; RT049-CTRL-5, the actual
    replication at a different curve instance per bit size, remains owed and is not run
    here.

  factor_base:
    Bfb: 512
    notation_warning: >-
      READ THIS BEFORE ANY OTHER NUMBER IN THIS CONTRACT. Bfb is the FACTOR-BASE SIZE.
      Bsm is the SMOOTHNESS BOUND of the Dickman test. EXP-DS-001 writes both as B and
      that collision has already cost this lane one wasted measurement. Neither is ever
      written as B anywhere in this experiment, its driver, its artifacts or any
      deliverable that cites it.
    rule: >-
      Deterministic subset of E(F_p) of exact size 512, the first 512 x-coordinates in
      F_p in increasing integer order that are x-coordinates of points of E(F_p). Identical
      to the EXP-EQD-001 OBJ-REAL base. Record factor_base_sha256 over the canonical
      decimal newline-joined x-list and assert it equals the EXP-EQD-001 archived value.
    enumeration:
      rule: 'unordered half-tuples (i, j) with i < j. THE DIAGONAL IS EXCLUDED BY CONSTRUCTION, NOT BY A FILTER.'
      n: 130816
      n_derivation: 'n = C(512, 2) = 130816.'
      adequacy: '130816 >= min_samples_per_bit_size = 100000, a 30.8 percent margin.'
      why_i_lt_j_and_not_i_le_j: >-
        The second named repair of OPEN-BATCH023-A. It also makes this sample set the
        SAME index set EXP-EQD-001 enumerated, so the two measurements are of the same
        130816 objects.
    exhaustiveness: >-
      OBJ-REAL IS EXHAUSTIVE OVER THAT INDEX SET. It carries no sampling seed and no
      sampling noise at all and is reproducible from the factor base alone. The real arm
      is DETERMINISTIC; the only random quantities anywhere in this experiment are the
      calibration and plant streams.

  smoothness_ladder:
    variable: Bsm
    policy: >-
      Bsm is FROZEN as an integer ladder per cell, inherited element by element from
      EXP-SMTH-001. Every rho evaluation uses the RECOMPUTED u = ln(D)/ln(Bsm) from the
      integer Bsm, never a target value. NO Bsm MAY BE ADDED, REMOVED OR RE-ROUNDED AFTER
      ANY DATUM IS OBSERVED.
    bits_16:
      D: 4294967296
      ladder:
        - {u_target: 2, Bsm: 65536}
        - {u_target: 3, Bsm: 1626}
        - {u_target: 4, Bsm: 256}
        - {u_target: 5, Bsm: 84}
        - {u_target: 6, Bsm: 40}
    bits_20:
      D: 1099511627776
      ladder:
        - {u_target: 2, Bsm: 1048576}
        - {u_target: 3, Bsm: 10321}
        - {u_target: 4, Bsm: 1024}
        - {u_target: 5, Bsm: 256}
        - {u_target: 6, Bsm: 102}
    rho_reference_values:
      note: >-
        THE FROZEN REFERENCE TABLE, USED FOR THE PRE-DATUM ARITHMETIC IN THIS CONTRACT AND
        AS A REPRODUCTION CHECK. The RUN must compute rho by numerical solution of the
        Dickman delay equation and must record its own computed values beside these; a
        discrepancy above 1 percent at any tabulated point is a declared apparatus defect
        under branch L-5.
      rho_1: 1.0
      rho_2: 0.30685
      rho_3: 0.048608
      rho_4: 0.0049109
      rho_5: 0.00035473
      rho_6: 0.000019650
    power_and_adequacy:
      id: POW-LPF-1
      statement: >-
        R(u) pass or fail is evaluated ONLY at rungs where the model expects at least 30
        smooth samples, that is n * rho(u) >= 30. AT n = 130816, ARITHMETIC FROM THE FROZEN
        TABLE ABOVE - u = 2 expects about 40141, u = 3 about 6359, u = 4 about 642, u = 5
        about 46, and u = 6 about 2.6.
      consequence: >-
        POWERED RUNGS ARE u IN {2, 3, 4, 5}. u = 6 IS RECORDED, IS REPORTED, FEEDS DECAY-LPF-1,
        AND IS EXCLUDED FROM R(u) PASS OR FAIL, LABELLED UNDERPOWERED. The sample size that
        would power it is stated rather than hidden - n >= 30 / rho(6) = 1526718. DECLARED
        BEFORE THE RUN precisely so that a post-hoc exclusion is impossible.

  # ==================================================================
  # 6. OBJECTS
  # ==================================================================
  objects:
    - id: OBJ-REAL
      description: 'Genuine half-arity Semaev partial-map intermediates under INT-1 and ENC-B, exhaustive over the 130816 half-tuples i < j, at each cell.'
      role: 'THE QUANTITY HEUR-DS-1 IS ABOUT. Touched ONLY by the measurement arm.'
    - id: OBJ-NULL-UNIF
      description: >-
        Uniform random integers on [1, p**2] from the frozen calibration stream, n = 130816
        per replicate, pushed through the IDENTICAL factorization, largest-prime-factor,
        smoothness-indicator, CDF, ratio, KS and tail pipeline, with no code path differing
        except the source of the integers.
      role: >-
        THE APPARATUS CALIBRATION, AND NOT THE COMPARISON. See ABS-REL-LPF-1. It supplies
        every measured band in THR-LPF-1 and it supplies the finite-X error of the Dickman
        reference at this X. It is NEVER the object HEUR-DS-1 is compared against.
    - id: OBJ-NULL-SYNTH
      description: 'ENC-B applied to pairs (e_1, e_2) drawn uniformly from [0, p) x [0, p), same n, identical pipeline.'
      role: >-
        APPARATUS IDENTITY CONTROL, NOT AN INTERPRETIVE NULL. Because ENC-B is a bijection
        onto [1, p**2], OBJ-NULL-SYNTH and OBJ-NULL-UNIF are THE SAME DISTRIBUTION BY
        DERIVATION. Disagreement beyond the band is an implementation defect in the encoder
        or sampler, never a mathematical result. STATED IN ADVANCE so its agreement can
        never later be presented as corroboration.
    - id: OBJ-CTRL-PRODUCT
      description: 'N = max(lift(e_1), 1) * max(lift(e_2), 1) on uniformly drawn (e_1, e_2), same n, identical pipeline.'
      role: >-
        THE DERIVABLE-SMOOTH POSITIVE CONTROL AND THE APPARATUS POWER CERTIFICATE. A
        product of two integers each below p is provably and substantially smoother than a
        uniform integer below p**2, so its rejection is DERIVABLE IN ADVANCE. IF IT FAILS TO
        BE DETECTED, THE APPARATUS IS BROKEN AND THE RULE IS SUSPENDED UNDER L-5. BATCH-021
        had no such certificate and its favourable branch turned out unreachable.
    - id: OBJ-PLANT-SMOOTH-gamma
      description: >-
        A uniform calibration replicate in which a gamma fraction of the samples is REPLACED
        by integers of matched size constructed as products of primes at most Bsm(u = 4) for
        that cell, whose factorization and largest prime factor are KNOWN BY CONSTRUCTION.
      role: 'SMOOTH-DIRECTION PERTURBATION LADDER. Certifies power against an excess of smooth intermediates.'
    - id: OBJ-PLANT-ROUGH-gamma
      description: >-
        A uniform calibration replicate in which a gamma fraction of the samples is REPLACED
        by integers of matched size constructed as q * r with q a prime above sqrt(X), whose
        largest prime factor is KNOWN BY CONSTRUCTION.
      role: >-
        ROUGH-DIRECTION PERTURBATION LADDER, AND IT IS NOT OPTIONAL. HEUR-DS-1 can fail in
        EITHER direction - intermediates smoother than random or rougher than random are both
        departures, and only the smooth direction would help an attacker. Certifying power in
        one direction only and then speaking of power against "departures" is AP-3 in a new
        coat.
  plant_construction_note: >-
    BOTH PLANTS ARE BUILT BY REPLACEMENT WITH INTEGERS OF KNOWN FACTORIZATION, so a plant
    rung costs NO ADDITIONAL FACTORIZATION and the ladders are affordable at every rung.
    That is a deliberate design choice in service of PERTURB-MOVE-1 - the reason BATCH-024
    measured its ladders only at endpoints was cost, and removing the cost removes the excuse.
  ladders:
    LPF-LADDER-SMOOTH: [0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05]
    LPF-LADDER-ROUGH: [0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05]
    gamma_star: 0.01
    gamma_star_note: >-
      gamma_star = 0.01 is the CUT, frozen here before any datum. It is chosen to be
      directly comparable with EV-EQD-001's measured branch-level floor of delta = 0.02 in
      the e_1-marginal plant class and with the "about 1 percent of the 130816 half-tuples"
      figure EV-EQD-001 records as its largest consistent deviation, so the two floors compare
      as a ratio rather than as an impression. THE CAVEAT TRAVELS WITH THE RATIO - gamma counts
      REPLACED SAMPLES OF A SMOOTHNESS PERTURBATION and delta counted RE-RANDOMIZED e_1
      COORDINATES of a marginal-moving plant, so the ratio is a scale comparison and NOT a
      like-for-like one. RTB-040-3 charged BATCH-024 with reporting exactly such a ratio without
      its caveat, and the caveat is therefore frozen here rather than added later.

  # ==================================================================
  # 7. STATISTICS, THRESHOLDS, DETECTION
  # ==================================================================
  statistic_family:
    id: STAT-LPF-1
    members:
      - id: STAT-RATE-u
        limb: 'BOTH. R(u) against [1/8, 8] is LIMB B; p_hat(u) against the measured band is LIMB A.'
        quantity: 'p_hat(u) = the empirical fraction of samples with P_max(N_j) <= Bsm, at each ladder rung, and R(u) = p_hat(u) / rho(u).'
        certifying: true
      - id: STAT-KS-DICK
        limb: 'A, read against the measured band; the STATISTIC is absolute because it is computed against the Dickman law.'
        quantity: >-
          One-sample Kolmogorov-Smirnov distance between the empirical CDF of
          Z_j = ln(N_j)/ln(P_max(N_j)) and the classical Dickman largest-prime-factor CDF for
          uniform integers in (1, X]. COMPARING A CDF OF RAW POLYNOMIAL DEGREES TO rho IS A
          CATEGORY ERROR AND IS FORBIDDEN.
        certifying: true
      - id: STAT-TAIL-DEEP
        limb: 'A, read against the measured two-sided band per TAIL-LPF-1.'
        quantity: 'T_deep, the tenth largest Z_j.'
        certifying: true
      - id: STAT-KS2-CAL
        limb: 'NEITHER. Two-sample KS between the real arm and one fresh uniform arm.'
        quantity: 'Two-sample Kolmogorov-Smirnov distance between the real Z-sample and a fresh OBJ-NULL-UNIF Z-sample at the same n.'
        certifying: false
        why_non_certifying: >-
          DECLARED NON-CERTIFYING IN ADVANCE AND FOR A STATED REASON, NOT EXCLUDED LATER.
          A two-sample statistic is blind by construction to any deviation both arms share
          (U1), and HEUR-DS-1's absolute limb is exactly about a component both arms could
          share. It is retained because a LARGE two-sample distance would be informative as an
          apparatus signal, and it is recorded with no threshold and no reject boolean about
          either limb. NO BRANCH OF RR-LPF-1 READS IT AS A CERTIFYING STATISTIC.
    certifying_set:
      id: CERT-LPF-1
      members: [STAT-RATE-u, STAT-KS-DICK, STAT-TAIL-DEEP]
      the_batch024_lesson_applied: >-
        RTB-040-2 FOUND TWO OF THREE DECLARED CERTIFYING STATISTICS STRUCTURALLY INCAPABLE OF
        MOVING, AND THEIR IMMOBILITY WAS THEN CITED AS EVIDENCE. THAT MUST NOT RECUR. Membership
        of CERT-LPF-1 is PROVISIONAL until the calibration demonstrates, per statistic, per
        family and per rung, that the statistic moves on the object it is meant to certify
        against - PERTURB-MOVE-1. A member that does not move on any rung of either ladder is
        STRUCK FROM THE CERTIFYING SET BY RR-LPF-1 at freeze time, with the strike recorded and
        justified, and its non-firing may never be reported as evidence about the intermediates.

  thresholds:
    id: THR-LPF-1
    rule_frozen_before_any_datum: >-
      THE RULE IS FROZEN HERE; ONLY THE NUMBERS ARE SUPPLIED LATER. For every statistic in
      STAT-LPF-1 and every cell, the band is the [2nd, 199th] ASCENDING ORDER STATISTIC pair of
      that statistic's 200 LPF-CAL-A uniform-integer replicate values at that cell. The
      rejection rule is STRICTLY BELOW the lower or STRICTLY ABOVE the upper. The exact
      per-comparison false-fire probability on a fresh correct draw is 4/201 = 0.0199.
    absolute_band_frozen_before_any_datum: >-
      LIMB B's band is [1/8, 8] on R(u), inherited unchanged from EXP-DS-001's frozen
      constant_factor_c = 8. IT IS NOT DERIVED FROM ANY CALIBRATION NUMBER AND MAY NOT MOVE.
    which_direction_each_band_is_read: >-
      TWO-SIDED FOR EVERY STATISTIC AND FOR R(u), BECAUSE BOTH DIRECTIONS ARE REAL FAILURES.
      Intermediates smoother than the reference and intermediates rougher than the reference
      are both departures from HEUR-DS-1; only the first would help an attacker, and reporting
      only the first would be a one-sided instrument reported as a two-sided one.
    no_analytic_threshold: 'RV012-A1 BINDS. No threshold in this experiment is derived from an analytic law.'
    ap_2_binds: 'AP-2 BINDS. No threshold may be frozen that has never been measured against its own null.'

  detection_bar:
    id: DET-LPF-1
    statement: >-
      A perturbation rung is DETECTED at a cell by a certifying statistic iff the statistic
      rejects against its archived band in at least 19 of the 20 plant replicates at that rung
      AND the exact one-sided 95 percent lower Clopper-Pearson bound on that rate is at least
      0.75. At R_PLANT = 20 the first clause is exactly count >= 19 of 20.
    why_20_and_not_200_here: >-
      STATED RATHER THAN LEFT AS A DEFAULT. The 200-replicate budget is spent where it buys the
      THRESHOLDS, which is LPF-CAL-A, because a threshold is an order statistic and its
      resolution is what BATCH-023 lacked. The plant ladders run at 20 replicates per rung
      because they are POWER DEMONSTRATIONS at 14 rungs times 2 cells, and the coarseness of a
      19-of-20 bar is DECLARED here rather than discovered later - it resolves the detection
      floor to within one ladder step and no deliverable may state the floor more finely than
      the ladder resolves it. The lower Clopper-Pearson floor is 0.75 and not 0.90 for the same
      reason, and it is frozen here, before any datum.

  # ==================================================================
  # 7b. METRICS
  # ==================================================================
  metrics:
    block_policy: >-
      THIS BLOCK IS AN INVENTORY OF WHAT IS RECORDED AND IT ADDS NOTHING. NO STATISTIC, DECISION
      VARIABLE, THRESHOLD, BAND, LADDER RUNG, CUT OR BRANCH IS ADDED, REMOVED, RENAMED OR REDEFINED
      HERE. Every entry maps one-to-one onto a quantity already fixed by statistic_family,
      thresholds, detection_bar, branch_structure, calibration or process_disciplines, and ON ANY
      CONFLICT THOSE BLOCKS GOVERN AND THIS ONE IS WRONG. It exists because
      tools/validate_ledger.py REQUIRED["experiment"] names `metrics`, and because a reader should
      be able to see in one place what the run writes.
    no_threshold_number_appears_here: >-
      MANDATORY AND CHECKABLE. Not one rejection threshold, band edge, order-statistic rank,
      constant-factor bound, detection rate, confidence level, false-fire probability or ladder rung
      value appears anywhere in this block. THE REASON IS STRUCTURAL RATHER THAN STYLISTIC - under
      THR-LPF-1 and TAIL-LPF-1 the bands ARE MEASURED and DO NOT EXIST until the calibration
      completes, so any number written here would be either a fabrication or an analytic threshold,
      and RV012-A1 and AP-2 forbid both. The only integers that appear are structural parameters -
      the field bit sizes, the factor-base size, the arity, the sample count per set, the replicate
      counts and the rank of the deep-tail order statistic - and the reviewer should verify that
      claim by inspection at TASK-20260801-054.
    limb_b_absolute:
      - id: LPF_p_hat_u_real
        definition: 'Empirical fraction of OBJ-REAL samples with largest prime factor at most Bsm, at each rung of the frozen Bsm ladder, per cell.'
      - id: LPF_rho_u_computed
        definition: 'The driver''s own numerically solved Dickman rho at the recomputed u of each rung. THEORETICAL REFERENCE, recorded per rung per cell.'
      - id: LPF_R_u_real
        definition: 'R(u) = LPF_p_hat_u_real / LPF_rho_u_computed, per rung per cell. THE LIMB B DECISION VARIABLE.'
      - id: LPF_R_u_uniform
        definition: >-
          The identical ratio computed on the fresh OBJ-NULL-UNIF arm, per rung per cell. REPORTED
          BESIDE LPF_R_u_real IN THE SAME TABLE UNDER EVERY BRANCH, because LIMB B's decidability at
          a rung is a property of the uniform arm and not of the real one (ABS-REL-LPF-1).
      - id: LPF_limb_b_decidable_flag
        definition: >-
          Boolean per rung per cell - whether the uniform arm's R(u) lies inside the frozen
          constant-factor band. FALSE means LIMB B IS NOT DECIDABLE AT THAT RUNG BY THIS APPARATUS
          and is a statement about the apparatus, never about the Semaev map.
      - id: LPF_powered_flag
        definition: 'Boolean per rung - whether the rung is powered under POW-LPF-1. Fixed by the contract before any datum and recorded so the exclusion cannot be post-hoc.'
    limb_a_relative:
      - id: LPF_stat_values
        definition: 'Raw recorded value of every member of STAT-LPF-1 on every arm - real, uniform, identity, product and each plant rung - per cell.'
      - id: LPF_ks_dick
        definition: 'STAT-KS-DICK, the one-sample Kolmogorov-Smirnov distance between the empirical CDF of Z_j and the classical Dickman largest-prime-factor CDF.'
      - id: LPF_tail_deep
        definition: 'STAT-TAIL-DEEP, the tenth largest Z_j = ln(N_j)/ln(P_max(N_j)) over the sample set. Rank ten is a definition of the statistic, not a threshold.'
      - id: LPF_ks2_cal
        definition: >-
          STAT-KS2-CAL, the two-sample distance between the real Z-sample and a fresh uniform
          Z-sample. RECORDED WITH NO REJECT BOOLEAN AND NO BAND, because it is NON-CERTIFYING for
          both limbs by CERT-LPF-1 and no branch reads it.
      - id: LPF_reject_per_statistic
        definition: 'Boolean per statistic per arm per cell - the statistic outside its archived THR-LPF-1 band, in the direction recorded separately. The band is measured and is named, never quoted, here.'
      - id: LPF_band_position
        definition: 'The signed margin of each statistic to the nearer edge of its archived band, in units of the measured null standard deviation at that cell.'
    calibration_outputs:
      - id: LPF_null_replicate_values
        definition: 'Every statistic on each of the R_CAL uniform-integer replicate sample sets, per cell. THE ARRAY EVERY BAND IS AN ORDER STATISTIC OF.'
      - id: LPF_null_spread
        definition: 'Measured minimum, maximum, median and standard deviation of each statistic over those replicates, per cell. The DVV-LPF-1 variation evidence.'
      - id: LPF_apparatus_identity_counts
        definition: 'Count of rejections in the OBJ-NULL-UNIF versus OBJ-NULL-SYNTH comparisons, per cell, read against the frozen exact-binomial cut recorded in RR-LPF-1 and never as an existential.'
      - id: LPF_product_control_detected
        definition: 'Boolean per certifying statistic per cell - whether OBJ-CTRL-PRODUCT is detected. DERIVABLE IN ADVANCE; failure to detect is L-5 apparatus failure.'
      - id: LPF_dickman_reproduction
        definition: 'The driver''s own solved rho at each tabulated u beside the frozen reference table, with the relative discrepancy per point.'
    perturbation_movement:
      - id: LPF_movement_shift
        definition: >-
          THE PERTURB-MOVE-1 TABLE. One row per family, per rung, per cell, per certifying
          statistic, carrying the measured shift in units of the measured null standard deviation.
          A ROW IS MANDATORY FOR EVERY RUNG OF BOTH LADDERS; a missing row is an incomplete run.
      - id: LPF_movement_beyond_noise_flag
        definition: 'Boolean per row - whether the recorded shift exceeds the measured null spread. A rung whose flag is false is UNCERTIFIED by RR-LPF-1.'
      - id: LPF_detect_rate_smooth
        definition: 'Detection rate over the R_PLANT replicates at each rung of LPF-LADDER-SMOOTH, per certifying statistic per cell, with its exact two-sided Clopper-Pearson interval.'
      - id: LPF_detect_rate_rough
        definition: 'The same over LPF-LADDER-ROUGH.'
      - id: LPF_detect_ci_lower_one_sided
        definition: 'The exact one-sided lower Clopper-Pearson bound on each detection rate, at the confidence level DET-LPF-1 already fixes. Restates DET-LPF-1''s second clause and adds nothing.'
      - id: LPF_gamma_det
        definition: >-
          The smallest ladder rung at which a certifying statistic meets DET-LPF-1 at both cells,
          per family, or the literal NONE_ON_LADDER. Reported with the ratio to the frozen cut AND
          with the frozen caveat that gamma and delta count different operations, so the ratio is a
          scale comparison and not a like-for-like one.
    integrity_and_controls:
      - id: LPF_factorization_verified_fraction
        definition: 'Fraction of samples whose factorization was re-verified - every factor primality-tested and the product asserted equal to N. A PRE-REGISTERED POINT PREDICTION AT UNITY; any shortfall is L-0.'
      - id: LPF_factorization_verified_count
        definition: 'The absolute count behind that fraction, per arm per cell.'
      - id: LPF_degenerate_count
        definition: 'Number of half-tuples with c_2 = 0 mod p, counted, reported and excluded from every statistic.'
      - id: LPF_pairs_per_arm
        definition: 'Recorded sample count per arm. Structurally 130816 at both cells under the i < j enumeration; a departure is L-0.'
      - id: LPF_factor_base_sha256
        definition: 'sha256 of the canonical decimal newline-joined x-list, asserted equal to the EXP-EQD-001 archived value.'
      - id: LPF_driver_sha256
        definition: 'sha256 of lpf001_driver.py as executed, asserted equal to DRIVER_SHA256 bound at the calibration snapshot.'
      - id: LPF_real_object_touched
        definition: 'The calibration-arm tripwire. Structurally false in the calibration; true is L-0 and voids the batch.'
      - id: LPF_decay_monotone_flag
        definition: 'DECAY-LPF-1. Boolean per arm per cell - whether p_hat(u) decays across the frozen u sweep. False fires L-1 whatever else the run shows.'
      - id: LPF_pilot_projection
        definition: 'The measured factorization rate on the pilot and the extrapolated full-run cost. A BUDGET QUANTITY AND NEVER A DECISION VARIABLE.'
      - id: LPF_budget_event
        definition: 'Literal record of any wall-clock, memory or pilot-projection abort. Infrastructure signal under AGENTS.md rule 5 and never a result.'
    certificate_fields:
      - id: LPF_certificate_kind
        definition: 'none, correctly - no discrete logarithm is computed and no relation is claimed, so there is nothing to certify in the solve sense.'
      - id: LPF_deviation_certificate
        definition: >-
          Written UNCONDITIONALLY. If no deviation is found it records that with the measured
          margins; if one is found it lists the deviating rungs, the statistic values, the archived
          bands, THE DIRECTION of the departure, and an INDEPENDENT re-verification of the largest
          prime factor of a stated random subsample by a second factorization path. Under L-3 it is
          the mandatory refutation artifact and carries proof_status `counterexample_certificate`.

  # ==================================================================
  # 7c. SUCCESS CRITERION
  # ==================================================================
  success_criterion:
    id: SUCC-LPF-1
    form: 'COMPLETENESS, NOT DIRECTION. THIS IS THE CAMPAIGN''S STANDING RULE AND IT IS RESTATED HERE RATHER THAN REFERENCED.'
    statement: >-
      THIS EXPERIMENT SUCCEEDS IF IT PRODUCES A COMPLETE, VALID, INDEPENDENTLY REVIEWED MEASUREMENT
      THAT THE FROZEN READING RULE CAN CLASSIFY INTO EXACTLY ONE BRANCH - WHICHEVER BRANCH THAT IS.
      Concretely, ALL of the following hold: the calibration completed under CAL-LPF-1 and returned
      ADMISSIBLE at TASK-20260801-051; RR-LPF-1 and ATTAIN-RR-LPF-1 froze by substitution only and
      passed the four named duties at TASK-20260801-054; RUN-LPF-001-measure executed once with the
      hash-bound driver under a recorded APPROVAL_DETERMINATION; every declared arm, control and
      artifact is present with a value; every largest prime factor is re-verified and independently
      re-checked on a subsample by a second code path; the PERTURB-MOVE-1 table carries a row for
      every rung of both ladders; the R(u) table carries the real AND uniform arms at every rung;
      and TASK-20260801-060 classifies the result into exactly one of L-0, L-1, L-5, L-2, L-3 or L-4
      in the frozen precedence order and archives EV-LPF-001 scoped exactly to what was measured.
    what_success_is_NOT: >-
      SUCCESS IS NOT A FAVOURABLE BRANCH AND IT IS NOT AGREEMENT WITH DICKMAN. L-2 and L-3 are
      EQUALLY SUCCESSFUL outcomes of this experiment - a measured departure from the Dickman law at
      the toy cells is a first-class result and is arguably the more informative one. Defining
      success by direction is what turns a measurement into a search for a preferred answer.
    limb_b_non_decidability_is_a_SATISFIED_criterion_and_not_a_failure: >-
      LOAD-BEARING AND STATED EXPLICITLY BECAUSE IT LOOKS LIKE A FAILURE AND IS NOT. ABS-REL-LPF-1
      contemplates in advance that the uniform arm may itself leave the constant-factor band at a
      rung, in which case LIMB B IS NOT DECIDABLE AT THAT RUNG BY THIS APPARATUS. THAT OUTCOME
      SATISFIES SUCC-LPF-1. It is a MEASURED FACT ABOUT THE ASYMPTOTIC REFERENCE AT A FINITE X -
      precisely the quantity the uniform calibration arm exists to supply, and precisely the fact
      whose absence made BATCH-022's tail rule unsatisfiable - and recording it is a contribution,
      not a shortfall. What the run must do is REPORT the flag per rung and let RR-LPF-1 route the
      consequence; what it may not do is quietly read an undecidable rung as consistent, or as a
      departure, in either direction.
    failure_modes_that_are_NOT_failures_of_this_criterion: >-
      A branch of L-0, L-1 or L-5 means the rule is SUSPENDED and the outcome is inconclusive ON THE
      INSTRUMENT. That is an unsuccessful RUN and it is NOT a result about HEUR-DS-1 or H-LPF-001 in
      either direction. Likewise a pilot-projection abort, a budget event, a hash mismatch or a
      factorization-verification failure is INFRASTRUCTURE OR INSTRUMENT SIGNAL under AGENTS.md
      rule 5. In every such case OPEN-BATCH023-A SURVIVES INTACT and must be said to survive.
    what_no_outcome_can_achieve: >-
      NO OUTCOME OF THIS EXPERIMENT VALIDATES OR REFUTES HEUR-DS-1 ABOVE THE TOY TIER, moves any of
      the promotion gates G1 through G4, licenses `support` for any hypothesis in this lane, or
      supports any asymptotic, crypto-scale, medium-scale or affected-scheme claim. Uncertified
      class V6 states why nothing measured at D = 2**32 and 2**40 transfers upward by any argument
      this contract offers.

  # ==================================================================
  # 8. THE FIVE PROCESS DISCIPLINES
  # ==================================================================
  process_disciplines:
    attainability:
      id: ATTAIN-LPF-1
      statement: >-
        RR-LPF-1 freezes with an argument IN MEASURED NUMBERS that SOME ACHIEVABLE MEASUREMENT
        LANDS IN EVERY BRANCH, each branch classified DEMONSTRATED-REACHABLE or
        REACHABLE-IN-PRINCIPLE with which one said explicitly. A BRANCH UNREACHABLE BY
        CONSTRUCTION IS A REVISE. The reading rule must also carry a reading rule for itself -
        every clause admitting two readings must be recorded with both readings named and the
        choice ROUTED TO THE INDEPENDENT REVIEW rather than made by the freezing Coordinator.
      named_reviewer_duty: 'TASK-20260801-054, deliverable attainability_check.md. Rejection is a REVISE.'
      extension_at_this_batch: >-
        THREE ADDITIONS FROM THE BATCH-024 FAILURE. (i) NO BRANCH MAY KEY ON A LEDGER STATUS -
        the prospective half of OPEN-BATCH023-B, retained. (ii) NO BRANCH LEG MAY BE AN
        UNBANDED EXISTENTIAL OVER MANY COMPARISONS - every control leg that aggregates
        comparisons must carry an EXACT BINOMIAL BAND computed pre-datum from its own
        per-comparison level, and the reviewer must recompute that band's false-fire
        probability. BATCH-024's D-5 second leg was existential over 160 comparisons and
        false-fired with probability 0.798 on a correct apparatus. (iii) NO BRANCH MAY DEPEND
        ON A QUANTITY THE MEASUREMENT ARM CANNOT CHANGE - a leg reading only already-archived
        calibration data is satisfied or not before the measurement runs, and if it PRECEDES
        the substantive branches it makes them unreachable. The reviewer must check, leg by
        leg, which arm produces the quantity each leg reads.
    calibration_first_and_anti_tuning:
      id: ATS-LPF-1
      clause_1: >-
        THE CONTRACT COMMIT MUST BE A GIT ANCESTOR OF THE CALIBRATION COMMIT, and the tree at
        the contract commit must contain NO RUN ARTIFACT for this experiment. Verified against
        Git by TASK-20260801-054, not taken from prose.
      clause_2: >-
        NO CUT MAY MOVE. The threshold RULE, the order-statistic ranks, the [1/8, 8] absolute
        band, gamma_star, the two ladders, the Bsm ladders, the statistic family, the certifying
        set, DET-LPF-1 and THE WHOLE BRANCH STRUCTURE are hash-bound in THIS FILE before any
        datum exists. RR-LPF-1 may only SUBSTITUTE measured numbers into forms fixed here.
      clause_3: >-
        THE DRIVER IS AUTHORED COMPLETE AT CALIBRATION TIME, INCLUDING THE UNEXECUTED
        MEASUREMENT ENTRY POINT, and is hash-bound by the TASK-20260801-050 receipt as
        DRIVER_SHA256. The measurement arm must execute the IDENTICAL FILE, and
        TASK-20260801-058 must verify the hash equality across the calibration/measurement
        boundary against Git.
      clause_4: >-
        NO LATITUDE. Any ambiguity discovered after a calibration number exists is RECORDED as
        an open item with both readings stated and ROUTED TO TASK-20260801-054; the freezing
        Coordinator may not resolve it in either direction. A resolution that requires supplying
        a cut the frozen contract never fixed is an AMENDMENT and not an interpretation.
      clause_5: >-
        THE CALIBRATION ARM IS STRUCTURALLY BLIND TO THE REAL OBJECT. run_calibration must
        contain no reference to the deterministic factor base, to the Semaev specialization or
        to the measurement entry point, and must write real_object_touched = false as a tripwire.
        THE REVIEWER MUST VERIFY THIS AT THE LEVEL OF OBJECTS AND NOT MERELY OF LABELS -
        RTB-040-1 found a calibration that had truthfully recorded `ladder_rungs_executed: []`
        while in fact constructing, bit-identically, the object at the top rung of its ladder.
        A label-level check would have missed it and did.
      clause_6: >-
        DECLARED PRE-DISCLOSURES, LISTED EXHAUSTIVELY AND IN ADVANCE. (a) OBJ-CTRL-PRODUCT is
        measured in the calibration stage and its detection is derivable beforehand, so it
        foreshadows the apparatus's power though not the result. (b) The uniform arm's own R(u)
        values are measured in calibration and they partially foreshadow LIMB B's decidability
        at each rung. Both are admissible ONLY because the entire branch structure, both bands,
        both ladders, the cut and the statistic family are hash-bound here, before any datum,
        so the calibration can supply numbers and can never supply a choice. NO OTHER
        PRE-DISCLOSURE EXISTS; if the reviewer finds one, that is a REVISE.
    decision_variable_variation:
      id: DVV-LPF-1
      statement: >-
        EVERY DECISION VARIABLE MUST BE SHOWN TO VARY WITH WHAT IT MEASURES, BY MEASUREMENT.
        The calibration must record, per statistic and per cell, the measured spread of the 200
        uniform replicates and the measured shift produced by OBJ-CTRL-PRODUCT. A statistic
        whose 200 replicate values are constant, or whose value on the derivable-smooth control
        is inside its own band, is not a decision variable and RR-LPF-1 must strike it.
      decay_control:
        id: DECAY-LPF-1
        statement: >-
          THE CANONICAL ARTIFACT TELL, per docs/inventor-protocol.md section 3. p_hat(u) must
          DECAY as u increases across the frozen Bsm ladder, on the real arm and on the uniform
          arm alike. A flat or non-monotone smooth fraction across the u sweep is the signature
          of an apparatus defect and fires branch L-1, whatever else the run shows. The
          quantity that should decay is named, the parameter that should destroy it is named,
          and both are frozen here.
    alternative_class_declaration:
      id: ALT-CLASS-LPF-1
      binding: 'TRAVELS WITH EVERY STATEMENT OF THIS BATCH. A statement of power without its uncertified list is an overclaim by omission.'
      text: >-
        CERTIFIED AGAINST, AFTER THIS EXPERIMENT, CONDITIONAL ON A VALID RUN AND ONLY AT THE
        RUNGS WHERE PERTURB-MOVE-1 RECORDS MEASURED MOVEMENT - (S1) an excess of B-smooth
        integers at a gamma fraction of the samples, as generated by OBJ-PLANT-SMOOTH-gamma, at
        the ladder fractions measured and only those; (S2) an excess of rough integers at a
        gamma fraction, as generated by OBJ-PLANT-ROUGH-gamma, at the fractions measured; (S3)
        the derivable product-encoding smoothness excess of OBJ-CTRL-PRODUCT, which is a single
        object and not a ladder. CARRIED FORWARD AND NOT RE-MEASURED - (C0) the e_1-marginal
        re-randomization class certified at delta = 0.05 with a branch-level floor of
        delta = 0.02 by EV-EQD-001, which is a statement about a DIFFERENT measurement and does
        not transfer to this one. UNCERTIFIED AFTER THIS EXPERIMENT, AND THIS LIST IS PART OF
        THE RESULT - (V1) ANY DEPARTURE FROM THE DICKMAN LAW THAT A MATCHED-BITLENGTH UNIFORM
        SAMPLE EXHIBITS AT THE SAME MAGNITUDE AND SIGN, which LIMB A's measured band absorbs by
        construction and which only LIMB B can see; (V2) any departure of magnitude below the
        smallest ladder rung gamma = 0.0005, about 65 of the 130816 samples; (V3) any departure
        visible only in the joint law of the largest and second-largest prime factors, in the
        full factorization pattern, or in the arithmetic of the factors themselves, none of
        which is measured; (V4) any departure at u outside the frozen sweep [2, 6], and in
        particular any departure at u > 6 where this design is underpowered by its own declared
        arithmetic; (V5) any object other than the two frozen toy cells, INT-1, ENC-B, m = 4,
        d_half = 2, Bfb = 512 and the i < j enumeration; (V6) THE ENTIRE QUESTION OF BEHAVIOUR
        AT CRYPTOGRAPHIC D - the toy D here is 2**32 and 2**40, the Dickman asymptotics and
        their finite-X corrections both differ at crypto-scale D, and NOTHING MEASURED HERE
        TRANSFERS UPWARD BY ANY ARGUMENT THIS CONTRACT OFFERS; (V7) the
        determinism-versus-small-x-window confound RT049-B6, untouched here as it was in
        BATCH-024. NO DELIVERABLE MAY DESCRIBE THIS EXPERIMENT AS HAVING POWER AGAINST
        "DEPARTURES FROM DICKMAN" WITHOUT NAMING WHICH OF S1, S2 OR S3 THE CLAIM RESTS ON AND
        WITHOUT CARRYING V1 THROUGH V7.
      named_reviewer_duty: 'TASK-20260801-054, deliverable alternative_class_check.md, verified AGAINST DRIVER SOURCE and not against this prose.'
    perturbation_movement:
      id: PERTURB-MOVE-1
      status: 'NEW AT THIS BATCH. THE FIFTH DISCIPLINE, ADOPTED DIRECTLY FROM THE BATCH-024 FAILURE.'
      statement: >-
        EVERY PLANT, PERTURBATION OR CONTROL OBJECT THIS CONTRACT USES TO CERTIFY POWER MUST BE
        DEMONSTRATED TO MOVE THE STATISTIC IT IS MEANT TO MOVE, BY MEASUREMENT AT EVERY RUNG IT
        CERTIFIES, NOT AT ENDPOINTS ONLY. For each family, each rung and each certifying
        statistic, the calibration must record the measured shift in units of the measured null
        standard deviation at that cell, and write it into
        results/calib/perturbation_movement_report.json as a machine-readable table with one row
        per (family, rung, cell, statistic). RR-LPF-1 may certify power at a rung only where that
        table records a shift beyond noise. A RUNG WITH NO RECORDED MOVEMENT IS UNCERTIFIED. A
        FAMILY WHOSE TOP RUNG SHOWS NO MOVEMENT IS STRUCK FROM THE CERTIFIED LIST BY THE READING
        RULE RATHER THAN REPORTED AS LOW POWER.
      why_this_exists: >-
        AT BATCH-024 THE ANALOGOUS CONTROL CTRL-DEP-MONO WENT UNEVALUATED, AND THAT IS EXACTLY
        WHERE THE FAILURE HID. Two of three plant families were dependence-DESTROYING - their
        permutation was built from e_1 and fresh randomness only, never from e_2, so under an
        e_1-independent e_2 the joint law was EXACTLY UNCHANGED and they could not create the
        deviation they certified against. Measured on 40 paired replicates the sound family
        shifted the chi-squares by +7.33 and +1.96 null sigma at its rho = 0.05 rung and by
        +10182 and +2554 at rho = 1.0, while the two unsound families AT THEIR TOP RUNGS shifted
        +0.21 / +0.16 and +0.15 / +0.19 - indistinguishable from the null. NO ENDPOINT
        MEASUREMENT WOULD HAVE REVEALED THIS, because the endpoints that were measured belonged
        to the sound family. A per-rung movement table costs nothing here, because both plants
        are built by replacement with integers of known factorization.
      named_reviewer_duty: >-
        TASK-20260801-054, deliverable perturbation_movement_check.md. The reviewer must
        RE-DERIVE from driver source, independently, whether each plant can move each certifying
        statistic AT ALL, and must then check that derivation against the measured table row by
        row. A family that is invariant in law, or a rung with no recorded movement that the
        reading rule nevertheless certifies, is a REVISE.
    design_trap:
      id: DESIGN-TRAP-LPF-1
      statement: >-
        RECORDED IN THE CONTRACT RATHER THAN DISCOVERED IN REVIEW, AND STATED IN THIS LANE'S
        COORDINATES. A perturbation that REPLACES samples by fresh draws from the SAME
        largest-prime-factor law leaves every statistic in STAT-LPF-1 invariant in distribution
        and would return the nominal false-fire rate at every rung BY CONSTRUCTION, looking like
        a finding of zero power while measuring nothing. Both plants therefore replace samples
        with integers drawn from a law with a DEMONSTRABLY DIFFERENT Z-distribution -
        constructed smooth in one family and constructed rough in the other, in both cases with
        the largest prime factor KNOWN BY CONSTRUCTION rather than measured. The reviewer must
        RE-DERIVE THIS INDEPENDENTLY FROM SOURCE rather than accept it as written, and must state
        per family at what part of the Z-distribution its replacement moves mass and why it is
        not invariant. AN ASSERTED INVARIANCE ARGUMENT THAT NO INDEPENDENT SESSION HAS RE-DERIVED
        IS EXACTLY THE KIND OF CLAIM THIS PROGRAM HAS BEEN FAILING ON.

  # ==================================================================
  # 9. CALIBRATION STAGES
  # ==================================================================
  calibration:
    id: CAL-LPF-1
    non_evidential: >-
      THE CALIBRATION IS NON-EVIDENTIAL IN EITHER DIRECTION AND NO CALIBRATION NUMBER MAY BE
      CITED AS EVIDENCE ABOUT ANY HYPOTHESIS. It supplies thresholds, movement demonstrations and
      attainability numbers, and nothing else.
    stages:
      - id: LPF-CAL-A
        object: OBJ-NULL-UNIF
        replicates: 200
        per_cell: true
        produces: 'Every band in THR-LPF-1, the measured spread of every statistic, and the uniform arm''s own R(u) at every rung.'
      - id: LPF-CAL-B
        object: 'OBJ-NULL-UNIF versus OBJ-NULL-SYNTH, apparatus identity'
        replicates: 20
        per_cell: true
        produces: 'The apparatus-identity comparison, read through an EXACT BINOMIAL BAND and never as an existential.'
        the_batch024_defect_this_avoids: >-
          BATCH-024's apparatus-identity leg said "a rejection is an implementation defect" over
          160 comparisons at a per-comparison level of 0.00995 and therefore FALSE-FIRED WITH
          PROBABILITY 0.798 ON A CORRECT APPARATUS. Here the leg fires only if the COUNT of
          rejections over the 20 x 4 x 1 = 80 comparisons at that cell exceeds the exact binomial
          band at the same per-test stringency the thresholds already carry. The band is computed
          from 4/201 = 0.0199 and 80 comparisons and is written into RR-LPF-1 as a frozen integer
          cut; the reviewer must recompute its false-fire probability and a value above 0.02 is a
          REVISE.
      - id: LPF-CAL-C
        object: OBJ-CTRL-PRODUCT
        replicates: 20
        per_cell: true
        produces: 'The apparatus power certificate. DETECTION IS DERIVABLE IN ADVANCE; failure to detect is L-5 apparatus failure.'
      - id: LPF-CAL-D
        object: 'OBJ-PLANT-SMOOTH-gamma and OBJ-PLANT-ROUGH-gamma at EVERY rung'
        replicates: 20
        per_rung: true
        per_cell: true
        produces: 'The detection curve at every rung of both ladders AND the PERTURB-MOVE-1 movement table at every rung.'
      - id: LPF-CAL-E
        object: 'the Dickman solver'
        produces: >-
          dickman_reference_reproduction.json - the driver's own numerically solved rho at
          u = 1..6 beside the frozen table. A discrepancy above 1 percent at any tabulated point
          is an apparatus defect under L-5.
    forbidden_in_calibration:
      - 'Any OBJ-REAL sample, any deterministic factor-base x-list, any Semaev specialization, and any invocation of the measurement entry point.'
      - 'Any threshold, cut, rung, statistic or branch not already fixed in this file.'
    tripwire: 'real_object_touched, written false by the calibration and verified structurally by TASK-20260801-051 and TASK-20260801-054.'

  # ==================================================================
  # 10. THE FROZEN BRANCH STRUCTURE
  # ==================================================================
  branch_structure:
    id: BRANCH-LPF-1
    frozen_here_one_step_earlier_than_the_reading_rule: >-
      THE BRANCH CONDITIONS AND DISPOSITIONS BELOW ARE FROZEN IN THIS FILE, BEFORE ANY DATUM.
      RR-LPF-1 may substitute measured numbers into them and may do nothing else - no branch may
      be added, removed, merged, reordered or reworded, and the reviewer must verify that by a
      whitespace-normalised comparison of all conditions and dispositions.
    precedence: 'L-0, then L-1, then L-5, then EXACTLY ONE of L-2, L-3, L-4.'
    branches:
      - id: L-0
        condition: >-
          Any integrity failure - a short arm, a degenerate-draw count outside its declared band,
          a factor_base_sha256 mismatch against the EXP-EQD-001 archived value, a DRIVER_SHA256
          mismatch across the calibration/measurement boundary, a factorization-verification
          failure on any sample, an untraceable threshold, a stream collision between the
          calibration and measurement streams, the real_object_touched tripwire true in the
          calibration, or any timeout, crash, resource exhaustion or budget cancellation.
        disposition: >-
          THE RULE IS SUSPENDED. INSTRUMENT OR INFRASTRUCTURE FAILURE, never a mathematical result
          in either direction. H-LPF-001 does not move. No evidence record asserts any direction.
      - id: L-1
        condition: >-
          THE ARTIFACT TELL. DECAY-LPF-1 fails - p_hat(u) is flat or non-monotone across the
          frozen u sweep on the real arm or on the uniform arm - or the PERTURB-MOVE-1 table
          records no movement at the top rung of a ladder the reading rule certifies.
        disposition: >-
          `inconclusive` ON THE INSTRUMENT with a named repair. A quantity that fails to decay
          when the parameter meant to destroy it increases is an artifact, not a finding
          (docs/inventor-protocol.md section 3).
      - id: L-5
        condition: >-
          APPARATUS FAILURE. The LPF-CAL-B identity count exceeds its frozen exact-binomial cut at
          either cell, OR OBJ-CTRL-PRODUCT is not detected by any certifying statistic at either
          cell, OR the driver's own Dickman solution differs from the frozen table by more than
          1 percent at any tabulated point.
        disposition: >-
          THE RULE IS SUSPENDED. Apparatus failure, no disposition about HEUR-DS-1 or H-LPF-001 in
          either direction.
      - id: L-2
        condition: >-
          CONSISTENT. Every certifying statistic lies INSIDE its archived measured band at BOTH
          cells, AND R(u) lies inside [1/8, 8] at EVERY POWERED rung at BOTH cells, AND the
          uniform arm's own R(u) also lies inside [1/8, 8] at those rungs so LIMB B is decidable
          there.
        disposition: >-
          H-LPF-001 becomes `analyzed`. Disposition `replicate`. THE LICENSED STATEMENT IS THAT
          THE INTERMEDIATES ARE NOT DISTINGUISHED FROM THE DICKMAN PREDICTION BY THESE THREE
          STATISTICS AT THESE TWO TOY CELLS, AT THE MEASURED DETECTION FLOOR, AND NOTHING MORE.
          `support` is FORBIDDEN. HEUR-DS-1 IS NOT VALIDATED AT ANY TIER - a toy-cell consistency
          at D = 2**32 and 2**40 is not the heuristic, and V6 says why.
      - id: L-3
        condition: >-
          DEPARTURE. At least one certifying statistic lies OUTSIDE its archived band at BOTH
          cells in the SAME DIRECTION, or R(u) lies outside [1/8, 8] at a powered rung at BOTH
          cells while the uniform arm's R(u) at that rung lies inside.
        disposition: >-
          H-LPF-001 becomes `analyzed` with direction `weaken` ON HEUR-DS-1's TOY INSTANCE,
          scoped exactly to INT-1, ENC-B, Bfb = 512, the i < j enumeration, the two tested cells,
          the frozen Bsm ladder and the archived bands. A REFUTATION ARTIFACT IS MANDATORY AND
          MUST BE ARCHIVED BEFORE THE DECISION RELIES ON IT - deviation_certificate.json, listing
          the deviating rungs with the exact statistic values, the archived bands, and an
          INDEPENDENT RE-VERIFICATION of the largest prime factor of a stated random subsample by
          a second factorization path, with proof_status `counterexample_certificate`.
          `reject_scoped`, and in particular reject_scoped-as-impossibility, IS FORBIDDEN on this
          single unreplicated run. THE DIRECTION MUST BE STATED - smoother than reference and
          rougher than reference have opposite consequences for an index calculus and are never
          reported as one outcome.
      - id: L-4
        condition: 'MIXED. A departure at exactly one cell, or a departure whose direction differs between cells, or LIMB B undecidable at a rung where LIMB A rejects.'
        disposition: >-
          `inconclusive`, with the replication at a DIFFERENT curve instance per cell named as the
          single next action. H-LPF-001 stays `approved` and does not advance.
    forbidden_in_every_branch:
      - '`support` for H-LPF-001, H-SMTH-001, H-DS-001, H-EQD-001 or H-DEP-001.'
      - 'Validation or refutation of HEUR-DS-1 above the toy tier, in either direction.'
      - '`reject_scoped`, and in particular reject_scoped-as-impossibility.'
      - 'S1_met, F1_met, F2_met, structure_gate_passed - this experiment runs no search and cannot evaluate them.'
      - 'Any asymptotic, crypto-scale, medium-scale or affected-scheme claim; G1-G4 stay OPEN.'
      - 'dominated_by null.'
      - 'Any characterization of BATCH-021, BATCH-022, BATCH-023 or BATCH-024 as vacuous or worthless, which is premature closure under docs/inventor-protocol.md section 4.'
      - 'Any edit to EV-EQD-001, EV-DS-001 through EV-DS-004, or to any EXP-DS-001, EXP-SMTH-001, EXP-EQD-001 or EXP-DEP-001 artifact.'
    no_branch_keys_on_a_ledger_status: >-
      NO CONDITION OF ANY BRANCH ABOVE READS THE STATUS FIELD OF ANY HYPOTHESIS OR ANY OTHER
      LEDGER RECORD. Dispositions name status consequences, which is their proper place.
      TASK-20260801-054 must verify this clause explicitly at freeze time and return REVISE
      otherwise. This is the prospective half of OPEN-BATCH023-B, retained from BATCH-024 where
      it held.

  # ==================================================================
  # 11. RUNS, BUDGET, ARTIFACTS
  # ==================================================================
  runs:
    - id: RUN-LPF-001-calib
      stage: calibration
      authorized_by: 'CALIBRATION_AUTHORIZATION in the TASK-20260801-048 snapshot receipt'
      objects: 'OBJ-NULL-UNIF, OBJ-NULL-SYNTH, OBJ-CTRL-PRODUCT, OBJ-PLANT-SMOOTH-gamma, OBJ-PLANT-ROUGH-gamma. NO OBJ-REAL.'
    - id: RUN-LPF-001-measure
      stage: measurement
      authorized_by: 'APPROVAL_DETERMINATION APPROVED in the TASK-20260801-055 snapshot receipt'
      objects: 'OBJ-REAL at both cells, plus one fresh OBJ-NULL-UNIF arm per cell for STAT-KS2-CAL only.'
  budget:
    calibration_run_wall_clock_seconds: 14400
    measurement_run_wall_clock_seconds: 5400
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_runs: 2
    factorization_cost_is_the_binding_term_and_is_gated: >-
      THE ONE GENUINELY EXPENSIVE THING THIS CAMPAIGN HAS EVER PROPOSED IS FACTORING 26 MILLION
      INTEGERS, AND IT IS GATED RATHER THAN HOPED. The calibration factors 200 replicates times
      130816 samples times 2 cells for LPF-CAL-A; every plant rung reuses an archived replicate's
      factorization and replaces a gamma fraction with integers of KNOWN factorization, so the
      ladders add no factorization at all. BEFORE ANY BULK WORK the driver must run a PILOT of
      10000 factorizations per cell, measure the achieved rate, extrapolate the full calibration
      cost, and ABORT BEFORE STARTING if the projection exceeds the wall-clock budget. AN ABORT AT
      THAT GATE IS A BUDGET EVENT AND IS REPORTED AS ONE - it is L-0 instrument signal, never a
      result about anything, and it must never be converted into a reduced-scope run by the
      Executor's own decision. Reducing R_CAL below 200 requires a Coordinator protocol_amendment.
    new_dependencies: >-
      A factorization primitive is REQUIRED and is the first new dependency this lane has needed.
      The driver may use a pure-Python Pollard-Brent plus Miller-Rabin implementation carried in
      the experiment's own implementation directory, or an available library; either way the exact
      module and version go in environment.json, and every reported largest prime factor must be
      RE-VERIFIED by the driver itself - each returned factor tested for primality and the product
      of the factorization asserted equal to N - on 100 percent of samples, with the verification
      count written to results/*/factorization_verification.json. A FACTORIZATION THIS EXPERIMENT
      DID NOT VERIFY IS NOT A MEASUREMENT.
  stopping_rules:
    - 'Wall-clock or memory budget exceeded at either run - stop, record the budget event, report L-0. Never a result.'
    - 'Pilot projection above budget - abort before bulk work, report the projection, report L-0.'
    - 'Any factorization verification failure - stop immediately, report L-0. A wrong factorization silently poisons every statistic.'
  invalidation_rules:
    - 'A run whose driver sha256 differs from DRIVER_SHA256 is INVALID and is not evidence.'
    - 'A calibration whose real_object_touched tripwire is true is INVALID and the whole batch is a non-execution.'
    - 'A measurement run executed without APPROVAL_DETERMINATION APPROVED is INVALID and is not evidence.'
  required_artifacts:
    implementation:
      - experiments/EXP-LPF-001/implementation/lpf001_driver.py
      - experiments/EXP-LPF-001/implementation/implementation.md
    calibration_run:
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/manifest.yaml
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/raw-result.json
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/command.txt
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/environment.json
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/stdout.log
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/stderr.log
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/git_status_prerun.txt
    calibration_results:
      - experiments/EXP-LPF-001/results/calib/null_replicate_statistics.json
      - experiments/EXP-LPF-001/results/calib/perturbation_movement_report.json
      - experiments/EXP-LPF-001/results/calib/dickman_reference_reproduction.json
      - experiments/EXP-LPF-001/results/calib/apparatus_identity_report.json
    reading_rule:
      - experiments/EXP-LPF-001/reading_rule.yaml
    measurement_run:
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/manifest.yaml
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/raw-result.json
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/command.txt
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/environment.json
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/stdout.log
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/stderr.log
      - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/git_status_prerun.txt
    measurement_results:
      - experiments/EXP-LPF-001/results/measure/LPF_report.json
      - experiments/EXP-LPF-001/results/measure/absolute_comparison.json
      - experiments/EXP-LPF-001/results/measure/relative_band_comparison.json
      - experiments/EXP-LPF-001/results/measure/deviation_certificate.json
      - experiments/EXP-LPF-001/results/measure/factorization_verification.json
  manifest_policy: >-
    manifest.yaml AND NOT manifest.json, WITH THE REASON RECORDED. tools/validate_ledger.py globs
    experiments/*/runs/*/manifest.yaml and its check_run then requires command.txt,
    environment.json, stdout.log, stderr.log and raw-result.json beside it - note .log and not
    .txt. This mitigates OPEN-BATCH022-A for this experiment and REPAIRS NOTHING about the
    underlying indexing defect, which stands untouched. git_status_prerun.txt is an ADDITIONAL
    declared file and does not disturb check_run.
  certificate_policy: >-
    Claim tier toy; certificate kind none for any solve, because no discrete logarithm is computed
    and no relation is claimed. THE FACTORIZATION VERIFICATION IS THIS EXPERIMENT'S CERTIFICATE
    ANALOGUE and is mandatory at 100 percent of samples per docs/claims-and-verification.md.

  # ==================================================================
  # 12. INHERITED BINDING CONSTRAINTS AND STANDING CAVEAT
  # ==================================================================
  forbidden_anti_patterns:
