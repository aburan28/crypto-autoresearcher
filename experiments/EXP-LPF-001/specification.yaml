      statement: >-
        INHERITED VERBATIM AND STILL BINDING. Setting smoothness_abort on the existing EXP-DS-001
        arms and calling the H-DS-001 mechanism exercised is forbidden as a substitute for, or a
        supplement to, this experiment. At those parameters the flag causes is_B_smooth to be
        called on an identity-encoded curve x-coordinate below 2**20 with B = 64 - a STAND-IN, not
        the intermediate bounded by D that HEUR-DS-1 is about.
    - id: AP-2
      statement: 'No threshold may be frozen that has never been measured against its own null.'
    - id: AP-3
      statement: >-
        Certifying power against one constructible shape and then speaking of the whole
        alternative class is forbidden. ALT-CLASS-LPF-1 is the standing remedy and
        PERTURB-MOVE-1 is what makes it checkable.
    - id: AP-4
      statement: >-
        NEW AT THIS BATCH. Reporting a control leg as PASSED when its failing direction is
        unattainable, or reporting a statistic's non-firing as evidence when the statistic was
        never demonstrated capable of firing, is forbidden. Both occurred in this campaign and
        both were caught only by an independent session executing rather than reading.
