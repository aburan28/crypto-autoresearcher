experiment:
  id: EXP-ICINV-71ddb0
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-7c00e6
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'FILED AS A RECORDED CLOSURE, INADMISSIBLE ON ITS FACE: transporting one ECDLP instance to
    every member of its isogeny class and combining the resulting ensemble adds no congruence, because
    Tate''s theorem fixes N across the class so there is no second modulus to CRT against, and the
    ensemble is EXACTLY parallel collision search with h independent iteration functions at an extra
    isogeny evaluation per step -- strictly worse than parallel rho on one curve, with the exact cost
    ratio computed here'
  status: draft
  objective: "(A) THE ATTRACTIVE-LOOKING IDEA, STATED AT ITS STRONGEST BEFORE IT IS CLOSED. By T1,\
    \ an F_p-isogeny phi_i : E -> E_i of degree coprime to N maps (E, P, Q, k) to (E_i, phi_i(P),\
    \ phi_i(Q), k) WITH THE SAME k. A class has h ~ p^{1/2} members. So one instance becomes h instances\
    \ of the same secret, each on a different curve with a different coordinate representation, a\
    \ different factor base, a different summation polynomial and a different pseudo-random walk.\
    \ That is a genuine multiplication of DATA at polylog cost per member. The natural hope: combine\
    \ the h instances -- by CRT, by lattice reduction on an enlarged witness lattice, by pooling relations,\
    \ or by running h walks and looking for cross-curve collisions -- and beat 0.886 sqrt(N).\n(B)\
    \ THE OBSTRUCTION, NAMED AND STATED AS AN EQUALITY, NOT A DIFFICULTY.\n  (B1) NO SECOND MODULUS.\
    \ Every E_i in the class has #E_i(F_p) = p + 1 - t,\n    identical, by Tate's isogeny theorem.\
    \ So every transported instance\n    lives in a group of the SAME prime order N. CRT combines\
    \ congruences to\n    DISTINCT moduli; here every instance gives k mod N and nothing else. The\n\
    \    product of the moduli does not grow. THE INDEX OF THE WITNESS LATTICE\n    STAYS EXACTLY\
    \ N, WHATEVER h IS.\n  (B2) THE SCALAR ARGUMENT, IN ITS ISOGENY FORM. H-ENDO-001 states that\n\
    \    every endomorphism acts on the prime-order subgroup G as multiplication\n    by a scalar.\
    \ The same argument applies to an isogeny between class\n    members: phi_i restricted to G is\
    \ an injective homomorphism of\n    prime-order groups onto phi_i(G), hence an isomorphism, hence\
    \ -- after\n    identifying both with Z/N via generators -- multiplication by a unit.\n    Adding\
    \ r transported instances therefore adds r coordinates to the\n    witness lattice and NO NEW\
    \ CONGRUENCE; the meet-in-the-middle exponent\n    stays 1/2 and the constant grows.\n  (B3) GENERIC-GROUP\
    \ SIMULABILITY. The ensemble {(E_i, phi_i(P), phi_i(Q))}\n    is, as an abstract group-theoretic\
    \ object, h copies of one instance in\n    one cyclic group of order N, with the i-th copy related\
    \ to the first by\n    a known isomorphism. A generic-group algorithm can SIMULATE the whole\n\
    \    ensemble from one instance by choosing h random relabelings, so any\n    advantage the ensemble\
    \ confers is available in the generic model and is\n    therefore closed at exponent 1/2 by Shoup\
    \ (KN-TECH-005), by exactly the\n    argument KN-FIND-b7e091 uses for the incidence and endomorphism-image\n\
    \    oracles. THE ENSEMBLE IS A NEW ORACLE CLASS AND IT SIMULATES.\n  NAMED OBSTRUCTION (O-ONEMODULUS):\
    \ the isogeny class fixes the group order,\n  so transport multiplies representations without\
    \ multiplying moduli; a\n  family of representations of one congruence is generic-group simulable\
    \ and\n  closed at exponent 1/2.\n\n(C) THE QUANTITATIVE STATEMENT, WHICH IS THE PART WORTH RECORDING.\
    \ Running an independent rho walk on each of r transported curves is EXACTLY parallel collision\
    \ search with r distinct iteration functions on one group of order N. Total expected work to a\
    \ collision within one walk is unchanged at 0.886 sqrt(N) group operations; distributing it over\
    \ r processors divides WALL CLOCK by r and leaves TOTAL WORK identical, which is precisely KN-TECH-006's\
    \ parallel rho with distinguished points -- available WITHOUT any isogeny. And cross-curve collisions\
    \ do not help either: two walks on E_i and E_j collide in the abstract group iff their pulled-back\
    \ points coincide in G, which is exactly the same event as a collision between two walks on E\
    \ itself. So the ensemble buys:\n    speedup factor = 1, exactly,\n    extra cost per step = one\
    \ isogeny evaluation, i.e. sum of the small\n      prime degrees, poly(log p) field operations,\n\
    \    net effect = a STRICT SLOWDOWN by the isogeny-evaluation factor.\nThat is a closure with\
    \ an exact constant, not a qualitative dismissal.\n(D) WHAT WOULD HAVE TO CHANGE FOR IT TO ESCAPE,\
    \ WHICH IS THE FORWARD GUIDANCE THE CLOSURE STANDARD REQUIRES. The obstruction is exactly (B1),\
    \ so the escape routes are exactly the ways to obtain a SECOND MODULUS or a NON-SIMULABLE side\
    \ channel:\n  (E1) DIFFERENT SECRETS, not different representations. h instances with\n    DIFFERENT\
    \ k in the same group is the multi-instance problem, which is\n    genuinely different and is\
    \ RQ-MTGT-2cabee / L13's territory, where the\n    relevant bound is the multi-target birthday\
    \ accounting and the\n    Bernstein-Lange / Mihailescu preprocessing bounds. This record does\
    \ not\n    touch it and explicitly hands it over.\n  (E2) A GROUP OF A DIFFERENT ORDER. Not available\
    \ inside a class; available\n    across TWISTS (trace -t, order p + 1 + t) and across extension\
    \ fields.\n    The twist is a different class and its group has a different order, so\n    it\
    \ is the one place a genuine second modulus exists -- but the DLP\n    instance does not transport\
    \ to the twist (there is no F_p-isogeny), so\n    there is nothing to combine. Stated explicitly\
    \ because it is the first\n    thing a reader will propose.\n  (E3) DATA THAT IS NOT A GROUP ELEMENT.\
    \ The whole rest of this lane: the\n    FIELD-side data of each transported instance -- factor\
    \ bases, summation\n    polynomials, solving degrees -- is not simulable in the generic model\n\
    \    and is exactly what IDEA-20260807-0ff796, -0a3272, -692e9b and -427cf3\n    measure. So the\
    \ correct reading of this closure is not \"the isogeny\n    class is useless\" but \"the isogeny\
    \ class is useless AS A SOURCE OF GROUP\n    ELEMENTS, and its only possible value is as a source\
    \ of field-side\n    variation\" -- which is precisely the lane's live question.\n  (E4) PREPROCESSING\
    \ TRANSFER. Whether a table built on E retains value on\n    E_i after transport is a sharp, cheap\
    \ question and it is L13's\n    (RQ-MTGT-2cabee). This record's argument does not settle it, because\
    \ a\n    preprocessed table is not a group element and its transport is not\n    covered by (B3)."
  resource_label: 'R4 (the isogeny graph) NOMINALLY, but the resource is consumed only to produce
    GROUP ELEMENTS on other curves, which places the proposal on the wrong side of the DECOMPOSITION.md
    section 2 admissibility filter. The honest label is: R4 in, R-nothing out.'
  admissibility: inadmissible_generic_group
  admissibility_argument: 'FAILS THE FILTER, AND THE RECORD IS FILED ANYWAY AS THE BRIEF DIRECTS.
    The only thing the ensemble does with the isogenies is apply them to points of G. Section 2 of
    DECOMPOSITION.md closes exactly that: "a lane is inadmissible on its face if the only thing it
    does with phi is apply it to points of G". The mechanism of the closure is (B2) plus (B3): every
    transported copy is related to the original by an isomorphism of prime-order groups, so the ensemble
    is a generic-group object, simulable from one instance by random relabeling, and therefore subject
    to Shoup''s Omega(sqrt(N)) bound (KN-TECH-005) exactly as the incidence and endomorphism-image
    oracles are (KN-FIND-b7e091, EV-GGM-79e710, DEC-20260804-3b4258). The simulator is explicit and
    is written out in Step 2 below rather than asserted, so this record also discharges the RQ-GGMB-6eaabc
    obligation for this particular oracle class.'
  reachability_gate: NOT APPLICABLE AS A GATE, AND THE REASON IS ITSELF THE FINDING. T5 asks whether
    a COST-MINIMISING class member is reachable. This record's ensemble does not seek a minimiser
    at all -- it seeks to use ALL members at once -- so reachability of a specific curve is irrelevant
    to it. What IS relevant, and is recorded, is that visiting all h members costs h ~ p^{1/2} isogeny
    evaluations, which already equals the rho baseline in order of magnitude before any walk step
    is taken. So even if the ensemble had conferred an advantage, assembling it would have cost the
    baseline. That is a second, independent reason the direction is closed, and it is the same identification-cost
    barrier IDEA-20260807-c36472 identifies for the minimiser search.
  inputs:
    procedure: 'STAGE 0 (zero compute, THE DELIVERABLE): the witness-lattice computation of Step 1,
      the simulator of Step 2 written out in full, and the (E1)-(E4) forward guidance. This is a complete
      closure and needs no compute at all. STAGE 1 (minutes, HARD GATE): the r = 1 baseline reproduction
      -- a single transported instance must cost the same as the original. STAGE 2 (~1 hour): the
      r-curve cost ratio against the matched parallel-rho null over >= 30 seeds and r in {2, 4, 8},
      with the forced value 1.000 declared in advance. STAGE 3 (~1 hour): the cross-curve collision-rate
      control, which is the record''s own falsifier. Stage 0 alone discharges the record; Stages 1-3
      exist to make the quantitative statement in (C) an observation rather than an assertion, and
      to give the campaign a measured number for a claim it would otherwise make from theory alone.'
    mechanism: 'STEP 1 -- THE WITNESS-LATTICE COMPUTATION, EXPLICIT AND FINITE. Write the lattice
      generated by the relations available from r transported instances: each contributes phi_i(Q)
      = [k] phi_i(P), i.e. one relation modulo N in the single unknown k. Stack them: the resulting
      lattice in Z^{r+1} has the r-fold repeated congruence and its index in Z^{r+1} is EXACTLY N,
      not N^r. Compute the Hermite normal form symbolically for r = 1, 2, 3 and exhibit the index.
      This is a three-line computation and it is the closure''s core.

      STEP 2 -- THE EXPLICIT SIMULATOR, WHICH IS WHAT MAKES (B3) A PROOF AND NOT AN ASSERTION. Given
      generic-group access to one instance (G, P, Q) of order N, simulate the ensemble as follows:
      for each i, draw a uniformly random unit lambda_i in (Z/N)^*, and define the i-th "curve" to
      be the same group with encoding sigma_i(x) = sigma(lambda_i x) for a fresh random injective
      labeling sigma_i. Then the simulated (P_i, Q_i) = (sigma_i(1), sigma_i(k)) have exactly the
      distribution of a transported instance as seen by a generic algorithm, and every group operation
      on curve i is answered by one operation on the real oracle. Cost: O(1) per query. Therefore
      any algorithm using the ensemble yields an algorithm using one instance with the same query
      count, and Shoup''s Omega(sqrt(N)) applies. WHAT THE SIMULATOR DOES NOT COVER, stated plainly:
      it does not simulate the x-COORDINATES of the transported points, because those are field elements
      that depend on the actual curve equations. So the closure is exactly and only about the group-side
      ensemble, and (E3) survives it untouched.

      STEP 3 -- THE EXACT COST RATIO. Implement r-curve parallel rho at toy scale: r independent walks,
      one per transported curve, each using the standard iteration function on its own curve, with
      distinguished points pooled. Count TOTAL group operations to solve, and compare against (i)
      r-processor parallel rho on the ORIGINAL curve alone and (ii) single-thread rho. The prediction
      is that (i) and the ensemble have statistically identical total work, and the ensemble additionally
      pays the isogeny evaluations. Report the measured ratio with its confidence interval over >=
      30 seeds.

      STEP 4 -- THE ONE OBSERVATION THAT WOULD BREAK THE CLOSURE, LOOKED FOR DELIBERATELY. Cross-curve
      distinguished-point collisions: if a walk on E_i and a walk on E_j produce distinguished points
      whose pullbacks to G coincide MORE OFTEN than two independent walks on E would, then the isogenies
      are correlating the walks in a way the simulator does not capture, and the argument has a gap.
      Measure the cross-curve collision rate against the same-curve rate over >= 30 seeds. Predicted
      identical. This is the record''s own falsifier and it costs one extra counter.

      STEP 5 -- HAND OFF THE SURVIVORS. Write the (E1)-(E4) forward guidance into the record''s conclusion
      with the owning lane named for each, so the closure cannot be read as closing more than it does.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - matched null: r-processor parallel rho on the original curve
  - forced value 1.000 declared before the run
  - r = 1 baseline reproduction against 0.886 sqrt(N)
  - cross-curve versus same-curve collision rates
  - transport certificates: Q_i = [k] P_i re-verified on every member
  - the nearby object (distinct moduli) exhibited to show the closure turns on (B1)
  - 'NULL OBJECT (from the proposal): MANDATORY EVEN THOUGH THE RECORD IS A CLOSURE, because the cost
    measurement in Step 3 is a real measurement with a real artifact risk. MATCHED NULL: r-processor
    parallel rho on the ORIGINAL curve, with r independent random starting points and r independent
    iteration functions -- the same shape (r walks, one group, pooled distinguished points), differing
    only in that no isogeny is applied. DECAY PARAMETER: r. Any apparent ensemble advantage must VANISH
    as r grows relative to the matched null, because both are the same algorithm; an advantage that
    PERSISTS or GROWS in r is the artifact tell and almost certainly means the ensemble arm and the
    null arm are not using equivalent iteration functions. SECOND NULL: the cross-curve collision
    rate against the same-curve rate (Step 4), which must be equal. THIRD, DERIVED, NULL: the forced
    value. Both arms are the same algorithm, so the forced ratio is 1.000 before any run; observing
    1.000 is a passed control and NOT evidence, and observing anything else is a bug hunt, not a discovery.
    Stating the forced value in advance is what stops a 5% timing difference from being reported as
    a finding.'
  independent_variables: []
  metrics:
    primary:
    - witness-lattice Hermite normal form and index for r = 1, 2, 3
    - total group operations per arm per seed, with the ratio and its interval
    - cross-curve and same-curve collision counts
    - isogeny-evaluation overhead per step, measured
    secondary:
    - certificate pass/fail per transported instance
  heuristic_under_test: null
  preregistered_prediction:
    quantity: index of the witness lattice generated by r transported instances
    formula: EXACTLY N for every r >= 1. Not N^r, not rN, not anything growing in r. This is an exact
      symbolic computation with no statistical content.
    source: pre-registered in IDEA-20260807-7c00e6 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - ITERATION-FUNCTION ASYMMETRY. If the ensemble arm's walks use a different partition function or
    a different distinguished-point criterion from the null arm, the comparison measures the walk
    design and not the ensemble. Both arms must use the identical walk parameters.
  - ISOGENY EVALUATION COUNTED OR NOT. Whether the isogeny cost is charged changes the reported ratio.
    It IS charged, and the uncharged ratio is reported separately so the two are never confused.
  - SMALL N. At toy scale the rho step count has large relative variance; >= 30 seeds is a floor and
    the interval must be reported, not the mean.
  - FRUITLESS CYCLES. Negation-based walks on different curves can have different cycle behaviour;
    if one arm uses negation and the other does not, the constants differ for reasons unrelated to
    the ensemble.
  - SELECTIVE r. Reporting the r at which the ratio looks best is forking. All r are declared in advance
    and all are reported.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY N for every r >= 1. Not N^r, not rN, not anything growing in r. This
    is an exact symbolic computation with no statistical content.
  falsification_criterion:
  - The witness-lattice index exceeds N for some r. Then (B1) is wrong and the closure fails outright
    -- this is the cheapest possible falsifier and it is a symbolic computation.
  - The r = 1 transported instance solves measurably faster than the original. Contradicts T1 plus
    the isomorphism argument; triggers pause condition P3 and an independent review before anything
    is recorded.
  - The ensemble arm's total work is materially below the matched parallel-rho null, reproducibly.
    The simulator has a gap; escalate to RQ-GGMB-6eaabc and to a review-breakthrough session before
    any record states the excess.
  - Cross-curve collisions occur at a higher rate than same-curve collisions. The isogenies correlate
    the walks; the closure has a gap at exactly the point Step 4 was designed to probe.
  - A transport certificate fails. INFRASTRUCTURE failure under AGENTS.md rule 5; the instance is
    discarded and re-derived, and no mathematical conclusion is drawn from it.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
