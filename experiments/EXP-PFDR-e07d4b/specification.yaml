experiment:
  id: EXP-PFDR-e07d4b
  hypothesis_id: H-PFDR-1b2386
  question_id: RQ-FBG-001
  idea_id: IDEA-20260830-c5c614
  batch_id: BATCH-c64bee
  version: 1
  recorded_at: '2026-09-04'
  drafted_under_task: TASK-20260904-9c61a9
  status: draft
  approved_by: null
  approved_at: null
  assigned_to: executor
  status_note: >-
    Frozen at the design stage; NOT submitted for approval and NOT authorized for
    implementation. Nothing here moves RQ-FBG-001 to any branch of its decision
    target.
  title: >-
    Measure the yield lift and decomposability precision of a FROZEN grammar of
    representation-decidable predicates against a 1000-draw random-partition
    SELECTION NULL, with every threshold read off the MEASURED null rather than
    fixed in advance, with the slope arm power COMPUTED before the ladder runs, and
    with a CURVE-FREE pushforward null deciding whether any excess is about
    elliptic curves at all.
  claim_ceiling: >-
    A measured decay exponent for one statistic over one frozen grammar, one panel
    and one range at toy scale. A measured lift is NOT a speedup and NOT an
    attack: no solve is accelerated, no relation is collected and no discrete
    logarithm is computed. This contract measures neither coverage nor rank nor
    solve cost and may not be cited about any of them.
  claim_tier_basis: >-
    Toy tier. Cell totals are computed by EXHAUSTIVE enumeration over the complete
    target set, so there is no sampling error in the counts themselves and the
    only spread is across curves, seeds and the selection null.
  objective: >-
    Establish, IN THIS ORDER: (1) that the pipeline reproduces the conservation
    identity exactly, at the trivial one-cell partition and by an integer-exact
    total check per cell; (2) that the apparatus can SEE a lift that is known to
    be there, via an unrealizable log-space anchor of known approximate magnitude;
    (3) the MEASURED selection-null distribution of a maximum over a grammar of
    the given shape, from which every threshold is read; (4) the excess of the
    maximum lift over that null for the representation-side geometries; (5) the
    fitted decay exponent, interpreted only if the Stage 0 power computation shows
    the ladder can separate the two pre-registered values; and (6) the CURVE-FREE
    pushforward null, which governs the attribution.
  band_non_degeneracy:
    statistic: >-
      two. (i) the excess of the maximum lift over the random-partition selection
      null; (ii) the fitted slope of the logarithm of that excess against the
      logarithm of the group order.
    null_value: '(i) zero excess; (ii) a slope of minus one half, square-root cancellation'
    alternative: '(i) a positive excess; (ii) a slope of zero, the channel survives with the group order'
    computed_check: >-
      TWO DISTINCT DEGENERACY RISKS, HANDLED SEPARATELY. (i) The source idea fixes
      a minimum effect of 0.02 in the ratio. WHETHER 0.02 IS ABOVE OR BELOW THE
      SELECTION-BIAS FLOOR IS A PROPERTY OF THE GRAMMAR SIZE AND THE CELL SIZES
      AND IS NOT KNOWN BEFORE THE NULL IS MEASURED: with about thirty statistics
      maximised over, the upward bias of a maximum is comparable to every excess
      this program has recorded on the coverage channel, so a fixed 0.02 may sit
      entirely inside the null and be unable to fire. (ii) A slope fitted from
      four rungs with a multiplicity correction has a wide interval, and an
      interval containing BOTH minus one half and zero decides nothing -- which is
      the likely default rather than an unlucky outcome.
    resolution: >-
      (i) THE THRESHOLD IS THE UPPER QUANTILE OF THE MEASURED SELECTION-NULL
      DISTRIBUTION at that cell-size profile, computed from 1000 random partitions
      per profile, and NOT a fixed absolute number. Any excess below that quantile
      is reported as UNRESOLVED, never as an effect and never as an absence.
      (ii) STAGE 0 COMPUTES THE REQUIRED RUNG COUNT AND PRECISION for a stated
      separation between minus one half and zero at the achievable per-rung
      resolution, and REPORTS IT BEFORE THE LADDER RUNS. If four rungs cannot
      separate them, the slope arm is DECLARED UNDERPOWERED IN ADVANCE with the
      required rung count stated, and neither closure nor survival is claimed from
      it.
  inputs:
    rungs: 'group orders of about 2^12, 2^14, 2^16 and 2^18; 4 curves and 4 seeds per rung'
    arity: '3'
    convention: >-
      symmetric, so the decomposition count descends to the coordinate line and
      the pushforward is well defined; negation-collapsed EFFECTIVE size used in
      every denominator
    grammar: >-
      FROZEN IN THIS CONTRACT BEFORE ANY CELL RUNS: the top k bits of the target
      coordinate for k in {1, 2, 3}; the quadratic-residue class of the
      coordinate; the bottom k bits for k in {1, 2, 3}; a declared high-bit
      interval matching one panel geometry own interval; and, separately, the
      UNREALIZABLE LOG-SPACE ANCHOR on the top bits of the logarithm, which exists
      only for calibration and is labelled as such on every row.
    panel: >-
      matched random base (the geometry null), plus the declared structured
      geometries, plus the small-multiples arm which is the anchor own positive
      control
    pooling_rule: >-
      cells with expected total below 30 are pooled by a rule FROZEN IN STAGE 0,
      never after seeing results, because a cell that small has a relative
      standard deviation that swamps the effect size of interest
    grammar_scaling: >-
      held fixed in BIT DEPTH rather than in absolute cell count across the
      ladder, with both reported, because at the smallest rung an eight-cell
      partition has few hundred targets per cell and grammar resolution and group
      size would otherwise move together and confound the fitted slope
  controls:
    - id: CTRL-CLOSED-FORM-TOTAL
      row_class: instrument
      blocking: true
      object: 'the sum of the cell totals per cell'
      forced_disposition: >-
        FORCED EXACT against the closed form, deviation exactly 0 with integer
        counters. Any nonzero deviation is an implementation error and HALTS the
        battery.
    - id: CTRL-TRIVIAL-PARTITION
      row_class: baseline
      blocking: true
      object: 'the one-cell partition'
      forced_disposition: >-
        FORCED: lift and precision both exactly 1, reproducing the conservation
        identity. A pipeline that contradicts a committed identity is wrong.
    - id: CTRL-SELECTION-NULL
      row_class: null_object
      blocking: true
      object: >-
        1000 RANDOM PARTITIONS of the target set at the IDENTICAL cell-size
        profile, per arm and per profile
      forced_disposition: >-
        BLOCKING. Without it a maximum over a grammar is uninterpretable and every
        reported effect is selection bias. EVERY reported effect is an EXCESS over
        this measured null with its band, and every threshold is a quantile of it.
        Additionally: the MATCHED RANDOM BASE own maximum lift must sit INSIDE its
        own selection-null band at every rung; if it does not, the grammar or the
        null is broken and no other number in the run is readable.
    - id: CTRL-LOG-SPACE-ANCHOR
      row_class: positive_control
      blocking: true
      object: >-
        the UNREALIZABLE log-space predicate on the small-multiples base, which
        requires a discrete logarithm to evaluate and therefore cannot be used in
        any algorithm
      forced_disposition: >-
        MUST show a lift of at least 4.0, against a RELAYED reference value of
        about 8.01 at one recorded cell. THIS IS THE DYNAMIC-RANGE CONTROL: a lift
        of known approximate magnitude is planted where a discrete logarithm is
        allowed, and the apparatus must see it. Falling below 4.0 means the
        apparatus cannot see a lift that is known to be there and every null it
        reports is VOID. The pass threshold is set at HALF the relayed reference
        precisely because that reference is relayed and was not independently
        confirmed by any agent under this task.
    - id: CTRL-CURVE-FREE-PUSHFORWARD
      row_class: null_object
      blocking: true
      object: >-
        THE MANDATORY CURVE-FREE NULL. The identical grammar, identical selection
        null and identical excess statistic on an ABSTRACT cyclic group of the
        same order whose elements carry a synthetic representation label, with an
        abstract base of matched size. No curve, no coordinate line, no summation
        polynomial.
      forced_disposition: >-
        MEASURED AND REPORTED BESIDE EVERY CURVE ARM AT EVERY RUNG, with no
        predicted value. BLOCKING FOR ATTRIBUTION: the pushforward of a conserved
        count vector along a partition is defined for ANY finite abelian group with
        ANY labelling map. IF THE CURVE-FREE NULL REPRODUCES THE EXCESS AND ITS
        DECAY EXPONENT, the finding is about pushforwards of conserved vectors and
        NO artifact may describe it as a statement about elliptic curves,
        summation polynomials or the ECDLP.
    - id: CTRL-THREE-MATCHED-NULL-DEFINITIONS
      row_class: instrument
      blocking: true
      object: 'the definition of the matched null base'
      forced_disposition: >-
        Reported under THREE definitions -- nominal size, negation-collapsed
        effective size, and matched total multiset count -- so a lift cannot be
        manufactured by the choice of null definition.
    - id: CTRL-ARM-LABEL-VERIFICATION
      row_class: instrument
      blocking: true
      object: 'each panel arm constructed geometry against its declared label'
      forced_disposition: >-
        FORCED, verified against the committed source before any cell runs,
        because this corpus records a live harness path whose declared geometry
        and constructed geometry disagree. An arm that is not the geometry its
        label claims voids every number from it.
    - id: CTRL-IN-PROCESS-COST-RATIO
      row_class: instrument
      blocking: true
      object: 'the generation, predicate and solve costs'
      forced_disposition: >-
        MEASURED IN THE SAME PROCESS ON THE SAME MACHINE at every rung, over at
        least 200 solve attempts INCLUDING FAILURES, since a failed solve is the
        one being skipped and may cost differently from a successful one. The
        admissible filter density floor is RECOMPUTED from the measurement and
        never imported: the entire monetisation of both metrics rests on this
        ratio and it is the cheapest thing in the design to measure directly.
    - id: PARETO-RHO
      row_class: pareto_control
      blocking: false
      object: 'Pollard rho at 0.886 sqrt(N) with O(1) memory'
      forced_disposition: >-
        The prior column. NOTHING HERE APPROACHES IT and the contract says so; the
        corpus own measured index-calculus position is far behind rho, so even a
        large sustained lift would leave the method far from the frontier.
  independent_variables:
    - 'group order across four rungs'
    - 'geometry arm across the panel, including the matched random null and the curve-free abstract-group arm'
    - 'grammar member, including the separately labelled unrealizable anchor'
    - 'curve and seed within a rung'
    - 'null definition in {nominal, negation-collapsed, matched multiset count}'
  metrics:
    primary:
      - 'exact count vector and cell totals per arm, per rung, per grammar member. UNITS: integer counts'
      - 'closed-form total residual per cell. UNITS: integer, FORCED exactly 0'
      - 'one-cell baseline lift and precision. UNITS: dimensionless ratio, FORCED exactly 1'
      - 'yield lift per cell class, with bootstrap intervals. UNITS: dimensionless ratio'
      - 'decomposability precision per cell class, with bootstrap intervals. UNITS: dimensionless ratio'
      - 'the MEASURED selection-null distribution of the maximum lift and maximum precision per cell-size profile, from 1000 draws, with its quantiles. UNITS: dimensionless ratio. THE SOURCE OF EVERY THRESHOLD.'
      - 'excess of the maximum lift over the measured selection null, with its band, per arm per rung. UNITS: dimensionless ratio'
      - 'fitted slope of the logarithm of the excess against the logarithm of the group order, per arm, with a multiplicity-corrected interval. UNITS: dimensionless exponent'
      - 'log-space anchor lift on the small-multiples base per rung. UNITS: dimensionless ratio'
      - 'net solve-skipping gain, precision divided by the charged predicate and regeneration overhead. UNITS: dimensionless ratio'
      - 'CURVE-FREE pushforward null values for every metric above. UNITS: as above. THE ATTRIBUTION METRICS.'
    secondary:
      - 'measured generation, predicate and solve costs, and the derived admissible density floor'
      - 'negation-collapse fraction and effective size per arm'
      - 'peak resident memory and wall time per rung'
      - 'THE COMPUTED REQUIRED RUNG COUNT AND PRECISION for a stated slope separation, reported BEFORE the ladder runs'
      - 'the frozen pooling rule and which cells it pooled'
  heuristic_under_test: >-
    HEUR-001 (coordinate-line additive pseudorandomness, whose predicted decay
    exponent is the deliverable) and HEUR-002 (filter affordability, an engineering
    ratio measured in process rather than imported) of H-PFDR-1b2386.
  preregistered_prediction:
    quantity: >-
      The closed-form total; the one-cell baseline; the matched random base
      maximum lift against its own selection null; the log-space anchor; the
      excess for the representation-side geometries; the fitted slope; the net
      solve-skipping gain; and the curve-free pushforward null.
    formula: >-
      Closed-form total residual EXACTLY 0. One-cell baseline lift and precision
      EXACTLY 1. Matched random base maximum lift INSIDE its own selection-null
      band at every rung. Log-space anchor lift AT LEAST 4.0. Excess for the
      representation-side geometries compared against the UPPER QUANTILE OF THE
      MEASURED NULL, with no fixed absolute threshold. Fitted slope compared
      against TWO pre-registered values, minus one half and zero, WITH NO SIGN
      PRE-COMMITTED, because pre-committing would prejudge the exact quantity
      being measured. Net solve-skipping gain at least 1.05 to be worth anything.
      Curve-free pushforward null MEASURED with no predicted value.
    source: >-
      H-PFDR-1b2386 claims (A) to (H) and predictions P1 to P9. The conservation
      identity, the coverage envelope and the explicit statement that the identity
      says nothing about the DISTRIBUTION of the counts were read verbatim by the
      drafting coordinator. The log-space reference magnitude is RELAYED and was
      not independently confirmed, which is why the anchor threshold is set at half
      of it. FIXED ON 2026-09-04, BEFORE ANY CELL RUNS, INCLUDING THE GRAMMAR, THE
      PANEL, THE POOLING RULE, AND THE RULE THAT EVERY THRESHOLD COMES FROM THE
      MEASURED NULL.
  scale_relevance:
    tier: toy
    justification: >-
      Group orders at most about 2^18, generated curves, arity 3. A fitted
      exponent over four points with a multiplicity correction is a TREND WITH A
      WIDE INTERVAL, not an asymptotic rate, and may not be quoted as one. The
      required rung count for a stated separation is computed and reported before
      the ladder runs so that an underpowered fit is declared rather than
      discovered as a null.
    correspondence: 'none; exhaustive enumeration over the complete target set per arm'
  tail_checks:
    - >-
      The single most deviant cell at each rung against the maximum-of-many order
      statistic for that grammar size, which is the direct measure of how much of
      any excess is selection bias.
    - >-
      The variance-to-mean ratio of the cell totals, whose departure from 1
      measures exactly the algebraic dependence the pseudorandomness heuristic
      ignores, reported ALONGSIDE every lift rather than smoothed away.
    - >-
      The grammar member aligned by construction with one panel geometry own
      interval, reported SEPARATELY from the geometry-agnostic members: it is the
      most likely place to see a lift and also the least surprising and least
      transferable.
    - >-
      The smallest rung reported separately, since there the grammar resolution
      and the group size are closest together and the confound is largest.
  replication:
    seeds: ['4 seeds per rung, values recorded in the run package']
    independent_instances: 4
    reason: >-
      Four curves and four seeds per rung. The cell totals are exhaustive so they
      carry no sampling error; replication exists to estimate the spread across
      curves and seeds, and the selection null is estimated from 1000 partition
      draws per cell-size profile rather than from replication.
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 12
    maximum_memory_gb: 8
    maximum_runs: 400
    maximum_workers: 1
    notes: >-
      The dominant cost is the selection null at 1000 partitions per cell-size
      profile. Peak memory is one count vector of length the group order per arm.
      NO Groebner basis is built in the enumeration stages; solves run only for
      the in-process cost ratio, under a declared wall-clock cap, and a cap hit is
      an INFRASTRUCTURE stop under AGENTS.md rule 5 and never negative evidence.
  stages:
    - id: stage-0-freeze-and-power
      purpose: >-
        freeze the grammar, the panel, the pooling rule and the null definitions;
        verify each arm constructed geometry against its label from the committed
        source; and COMPUTE AND REPORT the required rung count and precision for a
        stated separation between the two pre-registered slope values
      blocking: true
    - id: stage-1-enumeration
      purpose: 'compute the complete count vector over the group by exact enumeration for each arm at each rung'
    - id: stage-2-pushforward
      purpose: >-
        form the cell totals and supports, compute lift and precision per cell
        class, and run the closed-form total check; HALT on any nonzero deviation
      blocking: true
    - id: stage-3-selection-null
      purpose: >-
        1000 random partitions at each cell-size profile, giving the MEASURED null
        distribution of a maximum over a grammar of that shape and every threshold
        used downstream
      blocking: true
    - id: stage-4-anchor
      purpose: 'the unrealizable log-space anchor on the small-multiples base at every rung'
      blocking: true
    - id: stage-5-slope
      purpose: >-
        fit the excess against the group order per geometry with one multiplicity
        correction, interpreted ONLY if stage 0 showed the ladder can separate the
        two pre-registered values
    - id: stage-6-curve-free-null
      purpose: 'the abstract-group pushforward arm at every rung; BLOCKING FOR ATTRIBUTION'
      blocking: true
    - id: stage-7-cost-ratio
      purpose: 'measure generation, predicate and solve costs in process and recompute the admissible density floor'
      blocking: true
  stopping_rules:
    - 'HALT at stage 2 on any nonzero closed-form total deviation. Implementation error; nothing is reported.'
    - 'HALT if the one-cell slice returns anything other than lift and precision exactly 1.'
    - >-
      HALT if the matched random base maximum lift exceeds its own selection-null
      band at any rung. The null is miscalibrated and no effect in the run is
      readable.
    - >-
      HALT if the log-space anchor falls below 4.0. The apparatus cannot see a
      lift that is known to be there and its nulls mean nothing.
    - >-
      DO NOT INTERPRET stage 5 if stage 0 declared the slope arm underpowered.
      Report the excesses and the computed required rung count, and claim neither
      closure nor survival.
    - 'Stage 6 is NOT optional. Reporting any excess without the curve-free null beside it is an invalidation.'
  invalidation_rules:
    - >-
      Using a FIXED ABSOLUTE THRESHOLD for the excess INVALIDATES the inference.
      Whether a given absolute value sits above the selection-bias floor is a
      property of the grammar size and the cell sizes and is not known before the
      null is measured; every threshold is a quantile of the MEASURED null.
    - >-
      Reporting a raw maximum lift rather than an excess over the selection null
      INVALIDATES the report.
    - >-
      Changing the grammar, the panel, the pooling rule, the null definitions or
      the anchor threshold after seeing results INVALIDATES the battery.
    - >-
      Fitting a slope after stage 0 declared the arm underpowered, or quoting a
      fitted exponent without its interval, INVALIDATES the statement.
    - >-
      Reporting any excess without the CURVE-FREE pushforward null beside it
      INVALIDATES the report; describing an excess the curve-free null reproduces
      as a statement about elliptic curves, summation polynomials or the ECDLP
      INVALIDATES the artifact.
    - >-
      Importing a solve-cost ratio rather than measuring it in process INVALIDATES
      the monetisation of both metrics.
    - >-
      Citing this contract about coverage, rank or solve cost INVALIDATES the
      citation: its observable provably fails to determine any of them.
    - >-
      Describing a measured lift as a speedup or an attack INVALIDATES the
      artifact. No solve is accelerated and no logarithm is computed.
  success_criterion: >-
    Decidable from the primary metrics, ALL of: (1) the grammar, panel, pooling
    rule and null definitions are frozen and each arm is verified against its
    label before any cell runs; (2) the required rung count and precision are
    computed and reported before the ladder runs; (3) the closed-form total
    residual is exactly 0 on every cell and the one-cell slice returns exactly 1;
    (4) the matched random base sits inside its own selection null and the
    log-space anchor exceeds 4.0; (5) every reported effect is an excess over the
    MEASURED selection null with its band; (6) the CURVE-FREE pushforward null is
    reported beside every curve arm at every rung; and (7) the cost ratio is
    measured in process and the admissible density floor recomputed from it.
    SUCCESS IS BATTERY INTEGRITY, NOT A PARTICULAR EXPONENT. A run that declares
    the slope arm underpowered is a FULL SUCCESS.
  falsification_criterion: >-
    ANY of the following, evaluated in this order and reported by name.
    F1 IMPLEMENTATION ERROR: any cell totals fail the closed-form check.
    F2 PIPELINE CONTRADICTS A COMMITTED IDENTITY: the one-cell slice is not
    exactly 1.
    F3 NULL MISCALIBRATED: the matched random base maximum lift exceeds its own
    selection-null band.
    F4 INSTRUMENT BLIND: the log-space anchor falls below 4.0.
    F5 UNDERPOWERED, DECLARED IN ADVANCE: the stage 0 computation shows four rungs
    cannot separate the two pre-registered slope values. Reported with the
    required rung count; no closure and no survival is claimed.
    F6 CHANNEL CLOSED: every representation-side excess lies inside the measured
    selection-null band at every rung. The channel is closed over the frozen
    grammar, the tested panel and the tested range -- the expected outcome -- and
    the deliverable is the measured band with its scaling, a bounded obstruction
    with a number rather than a verdict.
    F7 CHANNEL SURVIVES: the fitted slope interval contains zero and excludes
    minus one half for a representation-side geometry, AND the curve-free null
    does not reproduce it. The growth clause is met on a realizable channel.
    F8 ATTRIBUTION DENIED: the curve-free pushforward null reproduces the excess
    and its scaling. The finding is about pushforwards of conserved count vectors
    and not about elliptic curves.
    F9 FILTER UNAFFORDABLE: the net solve-skipping gain is below 1.0 at every rung
    once the measured predicate and regeneration costs are charged.
  artifact_package_directory: experiments/EXP-PFDR-e07d4b/runs/RUN-001/
  required_artifacts:
    - 'experiments/EXP-PFDR-e07d4b/runs/RUN-001/frozen-design.yaml (the grammar with every member written out, the panel, the pooling rule, the three null definitions, the anchor threshold and its relayed provenance, and this contract sha256)'
    - 'experiments/EXP-PFDR-e07d4b/runs/RUN-001/power.yaml (the computed required rung count and precision for a stated slope separation, ARCHIVED BEFORE THE LADDER RUNS)'
    - 'experiments/EXP-PFDR-e07d4b/runs/RUN-001/arm-label-verification.md (each arm constructed geometry checked against its declared label in the committed source)'
    - 'experiments/EXP-PFDR-e07d4b/runs/RUN-001/pushforward.yaml (per arm per rung per grammar member: cell totals, lift, precision, bootstrap intervals, closed-form residual)'
    - 'experiments/EXP-PFDR-e07d4b/runs/RUN-001/selection-null.yaml (the 1000-draw null distribution per cell-size profile with its quantiles, and every threshold derived from it)'
    - 'experiments/EXP-PFDR-e07d4b/runs/RUN-001/anchor.yaml (the unrealizable log-space anchor lift per rung, labelled unrealizable on every row)'
    - 'experiments/EXP-PFDR-e07d4b/runs/RUN-001/slopes.yaml (fitted slopes with multiplicity-corrected intervals, and the interpretation gate from the power file)'
    - 'experiments/EXP-PFDR-e07d4b/runs/RUN-001/curve-free-null.yaml (the abstract-group pushforward arm at every rung, with an explicit statement of what its agreement licenses and forbids)'
    - 'experiments/EXP-PFDR-e07d4b/runs/RUN-001/cost-ratio.yaml (measured generation, predicate and solve costs including failures, the ratio distribution with its spread, and the recomputed admissible density floor)'
    - 'experiments/EXP-PFDR-e07d4b/runs/RUN-001/execution-report.md (stage by stage; the success-criterion checklist; which of F1 to F9 fired; per-file sha256; the inference block; peak memory and wall time; and an explicit statement that RQ-FBG-001 was not moved and that no coverage, rank or solve-cost claim is made)'
  interpretation_limits:
    - >-
      A measured lift is NOT a speedup and NOT an attack. The cost ledger in the
      hypothesis is arithmetic over a cost model, not a measurement of a running
      algorithm.
    - >-
      A null closes the existential over ONE frozen grammar, ONE panel and ONE
      range. It says nothing about predicates outside the grammar, and the grammar
      is small and hand-chosen.
    - >-
      Toy scale, four rungs. A fitted exponent over four points with a
      multiplicity correction is a trend with a wide interval, not an asymptotic
      rate.
    - >-
      This contract measures neither coverage nor rank nor solve cost and may not
      be cited about any of them; its observable provably fails to determine them.
    - >-
      The dominant confounder is the selection bias of a maximum over a grammar,
      which is why every threshold is read off the measured null and why the null
      is blocking.
    - >-
      One grammar member is aligned by construction with one panel geometry own
      interval. That is where a lift is most likely, least surprising and least
      transferable, and it is reported separately.
    - >-
      A large lift is self-limiting: conservation applied to a cell caps the lift
      by the reciprocal of the filter density, so an arbitrarily large lift
      requires an arbitrarily selective filter and the net gain is capped by the
      affordable density, which is a MACHINE CONSTANT and not an asymptotic
      quantity.
    - >-
      NOVELTY IS NOT ADJUDICATED. No external source was fetched or read by any
      agent under this task.
  dominated_by: >-
    As an ATTACK: none is mounted, so every frontier row dominates on every axis.
    As a YIELD STATEMENT: strictly dominated by the committed conservation
    finding, which settles the whole-group case exactly and which this contract
    does not contest. As a COVERAGE STATEMENT: dominated by the existing envelope,
    which this contract does not contest either. As a MEASUREMENT OF THE
    RESTRICTED-TARGET CHANNEL: one log-space window at one cell was measured
    previously and explicitly left the representation-decidable case untested, so
    there is no prior row on this axis and this contract displaces nothing. NOT
    NULL ON ANY AXIS.
  sota_delta: >-
    Zero on every ECDLP cost axis. Content delivered: one sentence in an
    uncommitted objection converted into a measured decay exponent over a frozen
    grammar, a six-arm panel and four group sizes with a 1000-draw selection null;
    a measured net solve-skipping gain with the predicate and regeneration costs
    charged from an in-process measurement; the exponent arithmetic stating exactly
    how large a lift would have to be before it mattered; and a curve-free
    pushforward null that decides whether any of it concerns elliptic curves.
    Prior state on this axis: zero measured values.
  id_allocation_provenance: >-
    EXP-PFDR-e07d4b pre-allocated by the tasking Coordinator in
    TASK-20260904-9c61a9 against IDEA-20260830-c5c614. Nothing was minted.
  yaml_parse_disclosure: >-
    Written without an interpreter; prose values are folded block scalars or
    quoted scalars; no tabs; no duplicate keys to the author reading. The
    orchestrating session must run a strict parse and tools/validate_ledger.py.
