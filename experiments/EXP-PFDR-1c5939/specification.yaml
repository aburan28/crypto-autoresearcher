experiment:
  id: EXP-PFDR-1c5939
  hypothesis_id: H-PFDR-8a4f44
  question_id: RQ-ECDLP-002
  goal_id: GOAL-PATH-001
  batch_id: BATCH-2c45e2
  version: 1
  status: draft
  claim_tier: toy
  retrospective: false
  retrospective_note: >-
    PRE-REGISTRATION. No run exists. Thresholds and predictions are frozen before
    execution and change only by a versioned protocol_amendment filed BEFORE the
    affected data is generated. NOTHING HERE IS A MEASUREMENT.

  title: >-
    The required saving gamma(m, beta) for a multiplicative-subgroup factor base -
    symbolic derivation with a swept beta, an exact measurement of how lossy the
    union bound over character tuples actually is, and a curve-free arm that
    decides whether gamma is an elliptic-curve fact at all.

  objective: >-
    Convert a closure stated as "no known bound is strong enough" into a named
    external requirement, and then test whether that requirement is a fact about
    elliptic curves or about exponential-sum bookkeeping. Three components. (i)
    Re-derive the deficit symbolically from the character expansion, sweep beta so
    that the sign of gamma changes inside the tested range, and report gamma at
    the operating point. (ii) Measure exactly, at small subgroup index and small
    arity, how far the true total character-sum error sits below the union bound
    that the deficit uses - the one place the derivation could be materially
    loose. (iii) Run the identical derivation on a curve-free hypersurface of the
    same degree and dimension and report whether it gives the same number.

  inputs:
    symbolic_arm:
      arities: [2, 3, 4, 6]
      beta_sweep: 'beta from 0.20 to 0.80 in steps of 0.05, 13 points per arity'
      quantity: >-
        The deficit D(m, beta) and the required saving gamma(m, beta), derived
        from the character expansion of the windowed m-decomposition count over
        the set of points whose x-coordinate lies in the subgroup H of index d,
        with d = p^{1-beta}.
      degree_constant: >-
        Tracked symbolically as a function of m, since the summation polynomial's
        degree doubles with m. Holding it constant in m understates the deficit and
        is a declared error mode.
      engines: >-
        TWO independent computer-algebra engines sharing no code. Disagreement
        between them on any symbolic result voids that result.
    exact_expansion_arm:
      cells: 'd in {2, 3, 4, 5} crossed with m in {2, 3}'
      primes: 'toy primes of 16 to 24 bits, at least 20 per cell'
      quantity: >-
        The exact total error of the character expansion, computed by full
        enumeration, against d^m times the maximum single nontrivial sum. The ratio
        is the measured looseness of the union bound.
    curve_free_arm:
      construction: >-
        An absolutely irreducible hypersurface over the same prime field with the
        SAME degree and the SAME dimension as the summation hypersurface, generated
        with random coefficients under a recorded seed. NO ELLIPTIC CURVE, NO GROUP
        LAW AND NO SUMMATION POLYNOMIAL appears in its construction.
      quantity: >-
        The identical deficit derivation and the identical exact-expansion
        measurement, reported side by side with the elliptic arm.
      purpose: >-
        THE BINDING CURVE-FREE NULL. The deficit is predicted to be identical.
        Prediction and consequence are stated in advance so that neither outcome
        can be read after the fact.
    coverage_arm:
      bases:
      - 'the subgroup base - points whose x-coordinate lies in H'
      - 'a matched random subset of the same cardinality'
      - 'a coset of H of the same cardinality'
      quantity: >-
        Mean decompositions per target, variance across targets, and coverage - the
        fraction of targets with at least one decomposition - at m = 3, all in
        the same units of decompositions per target.

  controls:
  - >-
    C-CURVEFREE (BINDING). The curve-free hypersurface arm. Predicted result -
    the deficit is IDENTICAL to the elliptic arm. If it is, gamma carries no
    elliptic-curve content and NO STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP MAY
    BE QUOTED FROM THIS EXPERIMENT in either direction, and the record must say so
    in those words.
  - >-
    C-BASELINE-d1 (BLOCKING). At d = 1 the expansion must reduce term by term to
    the unrestricted decomposition count and the deficit must carry no
    nontrivial-character contribution. Failure halts the run before any swept cell
    is computed.
  - >-
    C-RANDOM-BASE. A random subset of equal size. The MEAN decomposition count must
    match the subgroup base exactly, since the mean is exact and base-independent.
    Anything else is a bug and voids the coverage arm.
  - >-
    C-COSET. A coset of H rather than H itself preserves multiplicative structure,
    so any difference between the two isolates the subgroup's own additive
    behaviour rather than its multiplicative structure.
  - >-
    C-IRREDUCIBILITY. Absolute irreducibility is checked per cell on both the
    elliptic and the curve-free hypersurface. A cell where it fails is reported and
    excluded; Weil-Deligne does not apply there and using it would be an error, not
    a measurement.
  - >-
    C-TWO-ENGINE. Every symbolic result is produced in two engines sharing no code.
    Disagreement voids that result.
  - >-
    C-DEGREE-CONSTANT. The deficit is computed once with the degree constant
    tracked in m and once with it held constant. The difference is reported, so
    that a reader can see exactly how much of gamma the constant carries.

  independent_variables:
  - arity m in {2, 3, 4, 6}
  - beta from 0.20 to 0.80 in steps of 0.05
  - arm - elliptic or curve_free
  - subgroup index d in {2, 3, 4, 5} for the exact arm
  - base type - subgroup, random, coset

  metrics:
    primary:
    - >-
      gamma(m, beta), the required saving, expressed as an exponent of p and
      therefore dimensionless, per cell, from the symbolic arm.
    - >-
      gamma(m, 1/m), the required saving at the operating point, dimensionless.
    - >-
      beta*, the value of beta at which gamma changes sign, dimensionless.
    - >-
      union_bound_looseness, dimensionless, equal to the exactly computed total
      character-sum error divided by d^m times the maximum single nontrivial sum,
      per (m, d) cell.
    - >-
      curve_free_deficit minus elliptic_deficit, dimensionless, per cell.
    secondary:
    - mean decompositions per target, per base type, at m = 3
    - variance of decompositions per target, per base type
    - coverage, the fraction of targets with at least one decomposition, per base type
    - the degree constant as a function of m, and gamma computed with and without it tracked
    - the literature scan table, one row per bound family with a yes or no on meeting gamma and an opened or not-opened status per source
    - wall time and peak resident memory, INFRASTRUCTURE ONLY

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      gamma at the operating point, its zero crossing, and the difference between
      the elliptic and curve-free deficits.
    formula: >-
      gamma(m, 1/m) = (m-1)/2 exactly, giving 0.5, 1.0, 1.5 and 2.5 at
      m = 2, 3, 4 and 6. beta* = (m+3)/(4m) exactly, giving 0.625, 0.500, 0.4375
      and 0.3750 at the same arities. curve_free_deficit minus elliptic_deficit
      equals 0 exactly.
    source: >-
      Derived by TASK-20260904-5423ad by arithmetic on the inequality stated in
      IDEA-20260808-726aa3, namely that the error beats the main term when
      m(1-beta) + (m-1)/2 exceeds m beta + (m-2), which rearranges to
      D = (m-1)/2 + 2 - 2 m beta. THE UNDERLYING INEQUALITY WAS NOT VERIFIED by
      that task and its symbolic re-derivation is this experiment's first gate; if
      it is wrong these predicted values are wrong with it and the corrected form
      is the deliverable.

  scale_relevance:
    tier: toy
    justification: >-
      The symbolic arm carries no scale - it is an identity in p, m and beta. The
      exact-expansion and coverage arms run at 16 to 24 bit primes with small
      subgroup index, which is the only regime where the full expansion of d^m
      character tuples is enumerable. No transfer to cryptographic p is claimed.
    correspondence: null

  tail_checks:
  - >-
    The largest single nontrivial character sum observed in each cell is compared
    against its Weil-Deligne bound. A sum EXCEEDING the bound indicates either an
    irreducibility failure or an implementation error and voids the cell.
  - >-
    The smallest union_bound_looseness observed across cells is reported with its
    (m, d), since a systematically small ratio is the one outcome that materially
    softens the closure.

  replication:
    seeds: [20260904, 20260905]
    independent_instances: 2
    seeds_policy: >-
      The symbolic arm is deterministic and uses no seed; its reproducibility is
      by exact re-derivation in a second engine rather than by reseeding. The
      curve-free hypersurface coefficients, the random-base draws and the coset
      representative are drawn from a master seed recorded in the manifest and are
      reproducible from that seed and an index. Seeds are fixed before execution
      and are never redrawn after an outcome is seen.

  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 2
    maximum_memory_gb: 8
    maximum_runs: 6
    budget_note: >-
      Below the 600-second floor in nothing; the symbolic arm is minutes and the
      exact arm is bounded by d^m enumeration at d at most 5 and m at most 3,
      which is at most 125 character tuples per cell. The binding cost is the
      coverage arm's target sweep.

  stopping_rules:
  - >-
    SR1 BLOCKING. C-BASELINE-d1 must pass before any swept cell is computed.
  - >-
    SR2 BLOCKING. The symbolic re-derivation must be completed and reported BEFORE
    any predicted value from the preregistered_prediction block is quoted. If the
    re-derivation disagrees with the stated form, the run reports the discrepancy
    as its headline and does not proceed to interpret gamma.
  - >-
    SR3. C-IRREDUCIBILITY is checked per cell; a failing cell is excluded and
    recorded, and its exclusion is not permitted to change any threshold.
  - >-
    SR4. If a cell with gamma at most 0 and beta at or below the operating point is
    found, the run STOPS and reports it as a certified cell requiring immediate
    computational test. That is a positive result and it ends this contract's
    scope.
  - >-
    SR5. Budget exhaustion stops the run and reports the cells completed. An
    infrastructure receipt, never a negative result.

  invalidation_rules:
  - >-
    The two symbolic engines disagree on any derived expression.
  - >-
    An observed character sum exceeds its Weil-Deligne bound in a cell certified
    absolutely irreducible.
  - >-
    The mean decomposition count differs between the subgroup base and the matched
    random base - the mean is exact and base-independent, so a difference is a bug.
  - >-
    The degree constant is held fixed in m anywhere in the reported deficit without
    the paired tracked-constant figure alongside it.
  - >-
    A literature-scan row is filled without an explicit opened or not-opened status
    for its source. An unmarked recollection presented as a checked source is a
    rule 9 violation and voids the scan.
  - >-
    A timeout, crash or engine failure is recorded as failed_infrastructure and is
    NEVER counted as negative mathematical evidence.

  success_criterion: >-
    The symbolic re-derivation reproduces the deficit form in both engines; gamma
    at the operating point equals the whole square-root exponent (m-1)/2 at every
    tested arity; the zero crossing is at (m+3)/(4m); union_bound_looseness is
    reported per cell; the literature scan is filed with an opened status per
    source; and the curve-free comparison is reported with its consequence applied.

  falsification_criterion: >-
    THE DECISION RULE, FIXED BEFORE EXECUTION. (F1) The symbolic re-derivation does
    not reproduce D = (m-1)/2 + 2 - 2 m beta - the source bookkeeping is wrong,
    every predicted number changes, and the corrected deficit is the result. (F2)
    gamma at most 0 at a cell with beta at or below the operating point - that cell
    is CERTIFIED BY EXISTING BOUNDS and the subgroup base is testable there
    immediately; this is a positive result and triggers SR4. (F3) A bound family
    with saving at least gamma is identified in the scan with an opened source -
    KN-FIND-c93d45's scope must be narrowed and the multiplicative-subgroup base
    reopened. (F4) THE CURVE-FREE ARM REPRODUCES THE DEFICIT EXACTLY - gamma is a
    fact about exponential-sum bookkeeping and NOT about elliptic curves; nothing
    from this experiment may be quoted as a statement about elliptic curves or the
    ECDLP, and the record must state that in those words. (F5)
    union_bound_looseness below 0.1 at two or more cells with a consistent trend in
    d - the deficit is overstated, gamma shrinks by the measured amount, and the
    closure softens correspondingly.

  required_artifacts:
  - the symbolic derivation of the deficit in both engines, with the intermediate expansion
  - gamma(m, beta) over the full sweep, per arity, as a table
  - gamma at the operating point and beta*, per arity, both engines
  - the degree constant as a function of m, and the paired gamma figures with and without it tracked
  - exactly computed total character-sum error and d^m times the maximum single sum, per cell
  - union_bound_looseness per cell
  - the curve-free arm's deficit table and its difference from the elliptic arm
  - absolute-irreducibility check result per cell, both arms
  - mean, variance and coverage per base type at m = 3, in decompositions per target
  - the literature scan table with an opened or not-opened status per source
  - the d = 1 baseline reduction fixture
  - command, environment, seeds, engine names and versions, and resource measurements

  limitations:
  - >-
    EVERY PREDICTED NUMBER RESTS ON AN UNVERIFIED INEQUALITY. TASK-20260904-5423ad
    derived them arithmetically from the source idea's stated inequality and did
    not verify that inequality. SR2 makes its re-derivation a blocking gate for
    exactly this reason.
  - >-
    THE SOURCE IDEA'S FALSIFIER COULD NOT FIRE AS WRITTEN AND THE DESIGN WAS
    CHANGED. Evaluated only at the operating point beta = 1/m, gamma equals
    (m-1)/2, which is strictly positive for every m at least 2, so the falsifier
    "gamma at most 0 at some admissible cell" was unreachable. beta is now swept
    from 0.20 to 0.80, which contains the computed zero crossing (m+3)/(4m) at
    every tested arity, so the sign change lies inside the tested range. Recorded
    in H-PFDR-8a4f44 band_non_degeneracy.
  - >-
    THE DEFICIT DEPENDS ON THE HYPERSURFACE ONLY THROUGH DEGREE AND DIMENSION, so
    it cannot by itself be an elliptic-curve fact. That is the reason the
    curve-free arm is binding rather than decorative, and the consequence of a zero
    difference is pre-stated in F4.
  - >-
    DERIVING gamma PRODUCES NO ATTACK. It does not weaken KN-FIND-c93d45; it makes
    that closure conditional on a stated external ingredient, which is the honest
    form for a closure whose obstruction is that no known bound suffices.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. Whether the true
    character sums behave as the union bound implies AT THE OPERATING POINT and at
    cryptographic p cannot be measured by this or any reachable experiment - the
    number of nontrivial character tuples is d^m, which at a deployed parameter is
    astronomically large, and the exact expansion is enumerable only at d at most 5
    and m at most 3. The measured looseness bounds the bookkeeping in the tested
    cells alone and its extrapolation to the operating point is an assumption
    stated as one, never a measurement.
  - >-
    For small d the subgroup is comparable in size to the whole field and the
    regime is not the operating point. Those cells are reported separately and do
    not speak to beta = 1/m.
  - >-
    The x-coordinates of the curve's points form a specific subset of the field of
    about half its size, so intersecting with the subgroup introduces a second bias
    which the coset control isolates and which is reported separately.
  - >-
    A literature scan that finds nothing is not evidence that nothing exists.
    Absence of a result is recorded as absence of a search result, with the
    families actually checked named.

  assigned_to: executor
  approved_by: null
