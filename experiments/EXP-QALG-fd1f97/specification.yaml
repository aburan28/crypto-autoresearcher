experiment:
  id: EXP-QALG-fd1f97
  hypothesis_id: H-QALG-82fb90
  derived_from_idea: IDEA-20260815-6ed3c9
  question_id: RQ-QALG-122b59
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Uniform baseline-attribution re-scoring of the portfolio's quantum cost claims, with
    a frozen mechanical enumeration rule, a positive and a negative control read first,
    per-regime verdicts, and contested baselines carried in both variants
  objective: >-
    The one uncertainty a run reduces is whether any of this program's quantum advantage
    claims rests on a generic classical baseline rather than on the best
    structure-exploiting classical algorithm for the same instance class. A run
    establishes (i) the claim set, enumerated by a MECHANICAL rule hash-committed before
    any re-scoring, so the audit cannot be steered by which claims are chosen; (ii) per
    claim and per stated regime, the ORIGINAL advantage as the claim states it and the
    RE-SCORED advantage against the best classical baseline documented in this corpus,
    both at the exponent level; (iii) the verdict per claim per regime, with contested
    baselines carried in BOTH variants and any claim whose verdict flips reported as
    undecided; (iv) the list of unscoreable claims, listed rather than skipped; and (v)
    both control outcomes, read before any audited claim. NO NEW ALGORITHM AND NO NEW
    BOUND IS PRODUCED, and a failed re-scoring re-labels an advantage rather than showing
    a quantum algorithm wrong.
  what_this_is_not:
    - >-
      Not a new algorithm, a new bound, or a new attack. It re-scores existing claims
      against existing baselines.
    - >-
      Not a demonstration that any quantum algorithm is incorrect. A failed re-scoring is a
      statement about a COMPARISON, not about an algorithm.
    - >-
      Not a durable verdict. Classical baselines move; every output carries its run date and
      its cited baseline, and the audit is explicitly a snapshot.
    - >-
      Not a status change to any audited record. Re-labelling travels as a superseding record
      under a new id and only by the Coordinator.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or
      evidence. No run has been executed under this contract.
  claim_ceiling:
    tier: evidentiary_audit
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: of the claims enumerated by the frozen rule at the recorded
      commit sha on the recorded date, this many were scoreable, this many failed re-scoring
      against the cited best classical baseline in at least one regime the claim itself
      states, this many flipped across contested-baseline variants and are undecided, and
      this many were unscoreable. WHAT DOES NOT FOLLOW: nothing about claims outside the
      enumeration; nothing about baselines not documented in this corpus; nothing about
      future classical algorithms; and NOT that any quantum algorithm is wrong.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, HARD GATE): write and HASH-COMMIT the mechanical enumeration
      rule - the predicate over committed records that decides whether a record asserts a
      quantum cost advantage - together with the scoring rule, the exponent-level comparison
      convention, and the two control claims. The frozen object is the RULE, not the list, so
      the audit is reproducible against a later corpus state. Nothing after this point may
      change the claim set.
      STAGE 1 (minutes): apply the rule at a recorded commit sha and emit the claim set, with
      each claim's stated classical baseline, stated regimes and stated advantage extracted
      verbatim. Classify each claim as scoreable, unscoreable (with the reason), or
      constant-factor (excluded by scope, with the reason).
      STAGE 2 (minutes, CONTROLS, read FIRST): run the full scoring pipeline on the
      uncontested-advantage control, which must SURVIVE, and on the known-inflated control,
      which must FAIL. If either misbehaves the harness is invalid and no audited verdict may
      be read.
      STAGE 3 (hours, symbolic): for each scoreable claim, identify the best
      structure-exploiting classical baseline documented in this corpus for the same instance
      class, cite it, and recompute the advantage at the exponent level at EVERY regime the
      claim states. Where the best baseline is contested, carry BOTH candidates and produce
      both ratios.
      STAGE 4 (minutes): assemble the per-claim, per-regime verdict table; mark any claim
      whose verdict flips across contested variants as UNDECIDED; rank the failing claims;
      and list the unscoreable ones with reasons.
      STAGE 5 (zero compute): write the scoped, dated deliverable with the forbidden readings
      stated explicitly.
    instrument: >-
      Reading and symbolic manipulation of documented complexity expressions. Python 3.11 only
      for the enumeration and for exact exponent arithmetic. NO algorithm is implemented, no
      instance is attacked, and no benchmark is run - so no timing in this contract is a
      measurement of anything, and the deliverable must not present any number as if it were.
      Recorded through harness/runner.py.
    parameters: >-
      The enumeration rule, the scoring rule, the exponent-level comparison convention and the
      two control claims, all frozen at STAGE 0. Every regime each claim itself states. Both
      candidates for every contested baseline. The commit sha at which the enumeration was
      applied, and the run date, both recorded prominently.
  controls:
    - >-
      POSITIVE CONTROL, forced value, read FIRST. A claim whose advantage is uncontested must
      SURVIVE re-scoring. If the harness retires it, the harness is choosing baselines wrongly
      and NO verdict from the run is admissible.
    - >-
      NEGATIVE CONTROL, forced value, read SECOND. A claim already known to be baseline-inflated
      must FAIL re-scoring. If it survives, the harness cannot detect inflation and every
      "survives" verdict it issues is uninformative - the control-that-cannot-fail failure this
      program has catalogued before.
    - >-
      FROZEN ENUMERATION CONTROL. The claim set comes from a mechanical rule hash-committed
      before any re-scoring. A hand-picked set makes the headline counts meaningless, and this
      is the single most likely way the audit would manufacture its own conclusion.
    - >-
      CONTESTED-BASELINE CONTROL. Where the best classical baseline is contested, BOTH
      candidates are carried and both ratios reported. A claim whose verdict flips is UNDECIDED,
      never resolved by preference. This is the guard against the audit's mirror failure -
      unfairly retiring sound claims by choosing an unrealistically strong baseline.
    - >-
      REGIME CONTROL. Verdicts are per regime, at every regime the claim itself states. A single
      verdict per claim would be wrong wherever an advantage survives in one regime and not
      another, and the count of such claims is reported.
    - >-
      SCOPE-CLASSIFICATION CONTROL. Claims whose advantage is at the constant-factor level are
      classified and EXCLUDED from exponent-level scoring, with the reason recorded. Retiring a
      constant-factor claim by a comparison never designed to see it would be the audit's own
      failure mode.
    - >-
      CITATION CONTROL. Every baseline used is cited to a record in this corpus. Where none is
      documented, the claim is UNSCOREABLE and is listed - never filled from recollection
      (AGENTS.md rule 5).
    - >-
      ORDERING CONTROL. Both controls are run, recorded and hash-committed BEFORE any audited
      claim's verdict is looked at.
  independent_variables:
    - the audited claim, drawn from the frozen enumeration
    - the parameter regime, among those the claim itself states
    - 'baseline: as the claim states it / best structure-exploiting, first candidate / second candidate where contested'
    - 'claim role: audited / positive control / negative control'
  metrics:
    primary:
      - name: rescored_advantage
        units: >-
          exponent-level ratio, expressed symbolically (e.g. a difference of exponents in the
          security parameter), per claim per regime per baseline candidate
        computed_as: >-
          cost of the best structure-exploiting classical baseline divided by the claimed
          quantum cost, at the exponent level, at each regime the claim states, alongside the
          same ratio computed with the baseline the claim itself names.
      - name: claims_failing_rescoring
        units: count, plus the ranked list
        computed_as: >-
          number of scoreable claims whose rescored_advantage is at or below parity in at least
          one stated regime where the original advantage was above parity, robustly across
          contested-baseline variants. This is the headline deliverable.
      - name: scoreable_fraction
        units: fraction of the enumerated claim set
        computed_as: >-
          claims classified scoreable divided by claims enumerated, with the unscoreable ones
          listed by reason.
      - name: positive_control_survives
        units: boolean
        computed_as: the uncontested-advantage control's verdict. Forced true.
      - name: negative_control_fails
        units: boolean
        computed_as: the known-inflated control's verdict. Forced to be a failure of re-scoring.
    secondary:
      - name: undecided_count
        units: count, plus the list
        computed_as: >-
          claims whose verdict flips between contested-baseline candidates. Reported as
          undecided, never resolved.
      - name: regime_dependence_count
        units: count, plus the list
        computed_as: claims surviving in one stated regime and failing in another.
      - name: constant_factor_excluded_count
        units: count, plus the list with reasons
        computed_as: claims classified as constant-factor and excluded from exponent-level scoring.
      - name: unscoreable_list
        units: list with a reason per entry
        computed_as: >-
          claims that do not state a baseline, a regime, or a comparable cost expression;
          listed rather than skipped, since their count is itself a finding about the corpus.
      - name: enumeration_provenance
        units: the frozen rule, its hash, the commit sha and the run date
        computed_as: recorded so the audit is reproducible against a later corpus state.
  heuristic_under_test:
    id: HEUR-QALG-82fb90-1
    formal_statement: >-
      For each audited instance class, the best structure-exploiting classical algorithm is
      identifiable from this corpus as it stands on the run date.
    validation_plan: >-
      SAMPLE: every claim in the frozen enumeration, each with its baseline cited to a corpus
      record. TAIL CHECK: classes where the classical state of the art is contested, reported
      with BOTH candidates and both ratios. TRANSFER: NONE - the audit is time-stamped, and a
      later classical algorithm supersedes affected verdicts through a new record rather than
      through an edit.
    second_heuristic:
      id: HEUR-QALG-82fb90-2
      formal_statement: >-
        Exponent-level comparison at the stated regimes suffices; constant-factor claims are
        classified and not scored.
      validation_plan: >-
        Every excluded claim is listed with its reason, so the exclusion is auditable and a
        claim split across levels by regime is visible rather than silently mis-classified.
  preregistered_prediction:
    quantity: >-
      The two control outcomes, the scoreable fraction, and the count of scoreable claims
      failing re-scoring.
    formula: >-
      Positive control SURVIVES and negative control FAILS - forced, and a violation voids the
      run. scoreable_fraction above one half. claims_failing_rescoring at least 1. Under the
      alternative that the portfolio's comparisons are already sound,
      claims_failing_rescoring = 0, which falsifies part (B3) and is recorded as a real
      reassuring result rather than as a null run.
    source: >-
      Pre-registered in the parent proposal IDEA-20260815-6ed3c9 (predictions and
      falsification_conditions, including "All claims survive. The portfolio's quantum
      comparisons are sound, which is reassuring and worth recording") before any run under
      this contract exists. Never tuned to data.
  scale_relevance:
    tier: not_applicable
    justification: >-
      No instances are computed and no parameter scale is exercised. The audit's boundary is
      the CLAIM SET, the corpus commit and the run date, and the record is scoped to those
      rather than to a parameter size. Saying "not applicable" here is a scoping statement, not
      an omission.
    correspondence: null
    transfer_assumption: >-
      None. The verdicts hold for the enumerated claims against the cited baselines on the
      recorded date, and the contract states that a moving baseline supersedes them.
  tail_checks:
    - >-
      Report both ratios - as-claimed and re-scored - for every claim, not only the verdict, so
      a reviewer can check the arithmetic rather than accept a label.
    - >-
      Report the per-regime table in full. A claim reported as "fails" without naming the regime
      is not a checkable statement.
    - >-
      Report both contested-baseline variants side by side wherever they exist, and flag every
      verdict flip.
    - >-
      Report the unscoreable list with a reason per entry; an audit that quietly drops the
      claims it could not score reports a biased failure count.
    - >-
      Report the frozen enumeration rule, its hash, the commit sha and the run date at the head
      of the deliverable, since every count is meaningless without them.
  replication:
    seeds: []
    seeds_note: >-
      Explicitly empty, not omitted. The audit is deterministic symbolic work over committed
      records; there is no sampling, so a seed would be decorative. Replication here means
      RE-APPLYING the frozen enumeration rule at the same commit sha and independently
      re-deriving the ratios, which is required below.
    independent_instances: 1
    repeat_count: 1
    blind_rederivation_required: true
    blind_rederivation_note: >-
      Because the run cannot vary, the meaningful replication is an independent re-derivation of
      each failing claim's two ratios from the cited baselines alone, by a reviewer who has not
      read the producer's scoring code. A re-labelling of any committed record must not become
      official without it.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1.0
    memory_gb: 2
    maximum_memory_gb: 2
    maximum_runs: 10
  stopping_rules:
    - >-
      Stop and void every verdict if either control misbehaves.
    - >-
      Stop scoring a claim and mark it UNSCOREABLE the moment its baseline or regime cannot be
      cited to a corpus record; do not fill the gap from recollection.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a
      stop, never a negative result (AGENTS.md rule 5).
    - >-
      The enumeration rule, the scoring rule, the comparison convention and the control claims
      are frozen at STAGE 0 and are not revised after any verdict is seen. In particular, the
      audit is NOT re-run with a stronger classical baseline chosen because the first pass
      produced no failures.
  invalidation_rules:
    - >-
      A timeout, crash or dependency failure makes the run failed_infrastructure and is NEVER
      negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run whose claim set was not produced by the frozen mechanical rule is completed_invalid:
      the headline counts would measure the auditor's selection rather than the corpus.
    - >-
      A run whose controls were not executed in the same invocation as the audited claims is
      invalid_measurement.
    - >-
      A run using a baseline not cited to a corpus record is completed_invalid for that claim -
      a missing baseline stays missing and the claim is unscoreable.
    - >-
      A run reporting a single verdict for a claim that states multiple regimes is
      invalid_measurement.
    - >-
      A run resolving a contested baseline by preference rather than reporting both variants is
      invalid_measurement.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and
      requires a new contract; it is never a repair of this one.
  success_criterion: >-
    The enumeration rule and its hash, the commit sha and the run date are recorded; the positive
    control survives and the negative control fails, both read before any audited claim; every
    enumerated claim is classified scoreable, unscoreable or constant-factor with a reason; and
    the run reports rescored_advantage and as-claimed advantage per claim per regime per baseline
    candidate, the ranked failing list, the undecided list and the unscoreable list. The
    hypothesis H-QALG-82fb90 is SUPPORTED if and only if both controls behave, scoreable_fraction
    exceeds one half, and claims_failing_rescoring is at least 1 robustly across contested
    variants.
  falsification_criterion:
    - >-
      claims_failing_rescoring is 0 with both controls behaving and a majority scoreable. Part
      (B3) is FALSIFIED and the portfolio's quantum comparisons are sound against the cited
      baselines at the stated regimes on this date. This is a real finding, recorded as one, and
      the audit is NOT re-run with a stronger baseline chosen to produce a failure.
    - >-
      scoreable_fraction is at or below one half. Part (B2) is FALSIFIED; the finding is that
      the portfolio's quantum claims do not state their baselines well enough to be audited.
    - >-
      Either control misbehaves. Part (B1) is FALSIFIED, the harness is invalid, and NOTHING may
      be concluded from any verdict.
    - >-
      A claim's verdict flips across contested-baseline variants. That claim is UNDECIDED by this
      audit and is reported as undecided.
    - >-
      A claim classified as failing turns out to be a constant-factor claim scored at the
      exponent level. The classification control failed and that verdict is withdrawn.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - the frozen enumeration rule with its hash, plus the commit sha and run date at which it was applied
    - >-
      raw-result.json carrying, per claim and per regime, the as-claimed advantage, the re-scored
      advantage under each baseline candidate, the cited baseline record, and the verdict - and
      not summaries
    - both controls' full scoring output, in the same file as the audited claims
    - the ranked list of claims failing re-scoring, each naming its baseline and its regime
    - the undecided list and the unscoreable list, each entry with its reason
    - the constant-factor exclusion list with reasons
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false. Approval is the user's
      gate because it authorizes execution and spends compute.
    - >-
      STAGE 0's enumeration-rule freeze is a HARD GATE. Without it the headline counts measure
      the auditor's choices rather than the corpus, and the contract's primary verdict would be
      unfalsifiable.
    - >-
      Both control claims must be NAMED in the frozen contract before dispatch. Choosing a
      control after seeing which claims fail would defeat both controls at once.
    - >-
      Because the run is deterministic, the blind re-derivation named under replication is a
      precondition of any re-labelling becoming official.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260815-6ed3c9
    authored_at: '2026-08-25'
    note: >-
      The two controls, the contested-baselines-in-both-variants rule, the per-regime
      requirement and the unscoreable-list requirement are taken from the parent proposal's
      null_object_control, controls, confounders and falsification_conditions. This contract
      adds two things the parent leaves implicit and says so: the enumeration of claims must be
      MECHANICAL and frozen, because otherwise the headline count is a property of the auditor;
      and constant-factor claims must be classified out, because retiring one by an
      exponent-level comparison would be the audit's own mirror failure. Budgets come from the
      parent's declared estimated_cost (implementation low, compute low).
  derivation_gaps:
    - >-
      The mechanical enumeration rule is NOT written here. It is the contract's most load-bearing
      gap: every count depends on it, and a rule written after the claims are known is not a
      rule. It is assigned to STAGE 0.
    - >-
      The two control claims are not named here. They must be named in the frozen contract, and
      naming them after seeing which claims fail would defeat both controls simultaneously.
    - >-
      The exponent-level comparison convention - how two cost expressions in different
      parameters are made comparable, and what counts as "at or below parity" - is unspecified
      and must be fixed before scoring, since it is where a verdict could be manufactured.
    - >-
      What makes a baseline "contested" needs a decision rule. Without one, the both-variants
      protection can be bypassed simply by declaring a baseline uncontested.
