# EXP-SSI-98cfd7
# Integer slice at depth 2. No isogeny is enumerated.
# Approved by DEC-20261005-031c2c.
experiment:
  id: EXP-SSI-98cfd7
  hypothesis_id: H-SSI-89db95
  source_idea: IDEA-20261004-e4c461
  question_id: RQ-SSI-1946c9
  version: 1
  title: Depth 2 versus depth 1
  status: approved
  frozen: true
  designed_at: '2026-10-05'
  approved_by: coordinator
  approval_decision_id: DEC-20261005-031c2c
  objective: >-
    Check the depths 2 and 1, the product 2, and the nearby gap 0.
  inputs:
    depth_hi: 2
    depth_lo: 1
    depth_gap: 1
    depth_product: 2
    depth_sum: 3
    nearby_a: 1
    nearby_b: 1
    nearby_gap: 0
    nearby_product: 1
  controls:
    - >-
      The two-step depth is 2. The one-step depth is 1. Reporting
      both depths as 1 drops the gap and invalidates the run.
    - >-
      Two exceeds one by 1. The product of 2 and 1 is 2. Their sum
      is 3.
    - >-
      Two one-step depths are both 1. Their gap is 0 and their
      product is 1.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {read, subtract}
  metrics:
    primary:
      - depth_hi
      - depth_lo
      - depth_gap
      - implementations_agree
    secondary:
      - depth_product
      - depth_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The two-step depth is 2 and the one-step depth is 1. The gap
      of two one-step depths is 0.
    formula: >-
      Read the depth 2. Read the depth 1. Subtract 1 from 2.
      Multiply 2 by 1. Subtract 1 from 1.
    source: >-
      IDEA-20261004-e4c461 writes a depth-two neighborhood and a
      one-step nearby control, read 2026-10-05. The gap, the
      product, and the sum were recomputed in this design session.
      That computation is not a run. No isogeny was enumerated.
  scale_relevance:
    tier: toy
    justification: Two written depths. No transfer to an isogeny walk.
    correspondence: null
  tail_checks:
    - The product 2 and the nearby gap 0 are required. A check that stops at the depth 2 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the depth 2 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The two-step depth is not 2.
    - The one-step depth is not 1.
    - The product is not 2.
    - Both depths are reported as 1, or an isogeny is enumerated.
  success_criterion: >-
    Both runs agree that the two-step depth is 2, that the one-step
    depth is 1, and that the product of those two depths is 2.
  falsification_criterion: >-
    The runs agree that the two-step depth is computed, and that
    depth is not 2.
  required_artifacts:
    - experiments/EXP-SSI-98cfd7/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SSI-98cfd7/runs/<RUN-ID>/command.txt
    - experiments/EXP-SSI-98cfd7/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SSI-98cfd7/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SSI-98cfd7/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-SSI-98cfd7/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any enumeration of an isogeny, orientation, or public-view fiber.
    - Any claim that a depth gap of 1 moves an exponent.
    - Any comparison with a cryptographic isogeny walk.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
