experiment:
  id: EXP-ICEX-01a79b
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-ICEX-a2e95b
  question_id: RQ-ICEX-001
  goal_id: GOAL-ICEX-001
  assigned_to: executor
  approved_by: null

  title: >-
    Review-required charging audit: does the ICEX convention of charging
    right-censored attempts at their cap bias the measured exponent, in which
    direction, and does scaling the cap with sqrt(ell) remove the bias from the
    fitted slope? Post-hoc capping of fully recorded generic-baseline runs, with
    the two admissible aggregates forced to opposite conclusions

  objective: >-
    If a later approval and execution authorization are granted, measure the
    censoring bias induced by the charging convention frozen in
    coordination/goals/GOAL-ICEX-001/batches/BATCH-001/tasks/TASK-20260731-021/
    ic_exponent_protocol.yaml, on arms whose true exponent is exactly 1/2 by
    construction; determine whether the two aggregates the frozen text admits
    move in opposite directions as derived; determine whether a FIXED cap
    contaminates the fitted slope while a sqrt(ell)-SCALED cap does not; and
    report the censoring fraction per cell per arm as a first-class metric,
    which the frozen artifact does not require anywhere. Whatever the outcome,
    report the budget feasibility ratio recomputed from committed text.

  what_this_is_not:
  - Not an ICEX measurement. No SDEG, MONO, or RELN feed is read, no C_IC is assembled, no icex_feed package is consumed, and no ICEX cell is sealed.
  - Not an index-calculus computation. No summation polynomial, no factor base, no relation search, no Groebner computation, no descent, no linear algebra.
  - Not a measurement of any index-calculus arm's censoring fraction or tail. No IC arm is run and none is simulated as if it had been.
  - Not an argument for charging timeouts as infinite or as negative mathematical evidence. AGENTS.md rule 5 and the frozen protocol's OBL-TERMINAL-VOCABULARY stand unqualified.
  - Not a measurement of the operational cost of a real timeout. Caps are applied POST HOC to fully recorded runs, which isolates the accounting effect and deliberately excludes partial-state loss, restart overhead, and cache effects.
  - Not a claim that any past ICEX conclusion is contaminated. EV-ICEX-001 records that no ICEX measurement has ever executed; this is a pre-execution audit.
  - Not an amendment, supersession, edit, or invalidation of any record. Only the Coordinator changes official status (AGENTS.md rule 1).
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: that on prime-field short-Weierstrass curves with subgroup orders
      of 8, 10, 12 and 16 bits, for Pollard rho (serial and negation) and BSGS,
      with caps applied post hoc at the declared multiples of sqrt(ell), the
      charged aggregate and the cost-per-certified-success aggregate depart from
      the uncensored cost by the derived ratios, the fitted ladder slope under a
      fixed cap departs from 1/2 in the derived direction, and the
      sqrt(ell)-scaled cap restores it. A run CANNOT support any statement about
      index-calculus cost or censoring, about ECDLP hardness, about any exponent
      at any scale, about crypto-scale relevance, or about whether the ICEX
      programme should proceed. Toy evidence is never crypto-scale evidence
      (AGENTS.md rule 7); rule 6 scoping binds every sentence of any resulting
      evidence record.

  inputs:
    field_bits: [8, 10, 12, 16]
    ladder_source: >-
      Chosen to EQUAL the frozen protocol's
      fixture_ladder.bit_sizes_toy_ordered [8, 10, 12, 16] exactly, so the
      analysis applies to the sealed design rather than to a ladder of this
      contract's choosing.
    hard_cap_bits: 16
    replicas_per_cell: 3
    attempts_per_replica: 64
    cap_multiples_c: [0.25, 0.5, 1.0, 2.0, 4.0]
    cap_regimes: [fixed_M_across_cells, M_equals_c0_sqrt_ell]
    fixed_M_definition: >-
      For the fixed-cap regime, M is fixed in STEP UNITS at
      M_fixed := round(1.0 * sqrt(ell_at_8_bits)), i.e. the cap that gives
      c = 1 at the SMALLEST cell, so that c = M_fixed/sqrt(ell) falls to about
      0.0625 at n = 16. Working in step units rather than wall-clock seconds is
      deliberate: converting the frozen 300-second cap to steps requires a
      per-step time, which is machine-dependent, and conflating time with steps
      would reintroduce exactly the unit defect audited by EXP-ICEX-b8b2b6.
    aggregates: [charged_aggregate, cost_per_certified_success_with_restart]
    arms: [rho_serial, rho_negation, bsgs, synthetic_censored]
    capping_mode: post_hoc_on_fully_recorded_uncensored_runs
    master_seed: 6117340
    domain: EXP-ICEX-01a79b/v1
    seed_derivation_rule: >-
      Every random value derives from seed(label, bits, arm, replica, attempt)
      := SHA-256 of the ASCII bytes of domain || "|" || label || "|" ||
      decimal(bits) || "|" || arm || "|" || decimal(replica) || "|" ||
      decimal(attempt), digests read big-endian unsigned. No other entropy
      source is permitted; os.urandom, time seeding, and unseeded random module
      state are forbidden and their presence is an invalidation. THIS RULE
      EXISTS SO A THIRD PARTY REPRODUCES EVERY INSTANCE BIT-FOR-BIT.
    prime_construction: >-
      For each bits value b: h = int(SHA-256(seed("prime", b, "-", 0, 0))),
      L = 2^(b-1), U = 2^b, c0 = L + 1 + 2*(h mod 2^(b-2)); test c_k = c0 + 2k
      for k = 0, 1, ... while c_k < U; a candidate is prime exactly when it
      exceeds 1, is odd, and has no odd divisor d in 3, 5, ...,
      floor(sqrt(c_k)) (deterministic trial division). The first prime is p. If
      c_k reaches U without a prime, terminate the cell as CONSTRUCTION_FAILURE;
      do not wrap, reseed, or substitute a nearby size.
    curve_construction: >-
      For t = 0, ..., 65535: a_t and b_t from SHA-256 of seed("curve-a"/"curve-b",
      b, "-", 0, t) reduced mod p; reject if (4 a_t^3 + 27 b_t^2) mod p = 0;
      compute #E(F_p) by the character sum; accept the first candidate that is
      ordinary (#E mod p != 1) and whose largest prime factor ell satisfies
      ell > #E/4. Record p, a, b, #E, ell, cofactor, and a generator P. If
      t = 65535 is rejected, terminate the cell as CONSTRUCTION_FAILURE.
    n_definition: >-
      n := log2(ell) from the ACTUAL subgroup order, never the nominal bit size;
      log2(ell) - bits is recorded per cell.
    rho_specification: >-
      r-adding walk with r = 20 partition classes assigned by
      (x-coordinate mod r); Brent cycle detection; each step charged as one
      group operation. EVERY ATTEMPT IS RUN TO COMPLETION AND ITS FULL STEP
      COUNT RECORDED. No cap is enforced during execution; all caps are applied
      afterwards to the recorded counts. The negation variant canonicalizes each
      point to min(y, p-y) and walks on ell/2 classes.
    bsgs_specification: >-
      m = ceil(sqrt(ell)); full baby table {jP : 0 <= j < m}; giant steps until
      a hit; every addition and doubling charged; peak dictionary size recorded.
      Run to completion, capped post hoc like rho.
    synthetic_specification: >-
      Right-censored cost variables drawn from three declared survival families
      -- Rayleigh (matching the birthday model), exponential (memoryless), and
      Pareto with tail index 1.5 (heavy) -- at matched means, so that the
      distribution-free half of the audit is exercised on tails the birthday
      model does not describe. Pure arithmetic, no cryptography.

  arms_and_controls:
    treatment: >-
      The CENSORED aggregates computed from the recorded runs at each cap
      multiple c, under both admissible aggregate definitions and both cap
      regimes. The treatment is the ACCOUNTING RULE, not an algorithm.
    measured_null: >-
      THE UNCENSORED ARM, c = infinity, computed from the IDENTICAL recorded
      runs. FORCED VALUES DERIVED BEFORE THE RUN: aggregate ratio EXACTLY 1.000,
      cost-per-success ratio EXACTLY 1.000, and the fitted ladder slope CI
      CONTAINING 0.500 (because rho's and BSGS's true group-operation exponents
      are exactly 1/2 by construction). THIS NULL CAN GENUINELY FAIL: if the
      uncensored slope excludes 0.500, the implementation is not the algorithm
      modelled, and NO censoring conclusion may be drawn from it. Because the
      censored and uncensored arms are the SAME RUNS, there is no between-arm
      confound whatsoever -- the design's central economy.
    positive_control: >-
      TWO, both of which MUST FIRE or no negative may be reported.
      (P1) SENSITIVITY AT c = 0.25, where the derived distortion is 5.07x
      downward in the charged aggregate: the measured ratio must land in the
      Monte Carlo band around 0.197413. If a 5x accounting distortion is
      invisible to the instrument, nothing about smaller ones may be concluded.
      (P2) THE REPAIR MUST FIRE: under M = c0 sqrt(ell) with c0 = 1, BOTH
      aggregates' fitted ladder slopes must have CIs containing 0.500. If the
      derived repair does not restore the slope, the diagnosis is wrong even if
      the bias is real, and the constructive recommendation is withdrawn.
    graded_controls: >-
      TWO, each with 5 points and each reporting monotonicity pass/fail per
      adjacent pair.
      (G-A) THE CAP LADDER c in {0.25, 0.5, 1, 2, 4}. FORCED: the charged
      aggregate ratio is 0.197413 / 0.382925 / 0.682689 / 0.954500 / 0.999937,
      MONOTONE INCREASING to 1 from below; the cost-per-success ratio is
      6.416425 / 3.258850 / 1.735051 / 1.103896 / 1.000272, MONOTONE DECREASING
      to 1 from above; the two families approach 1 from opposite sides and never
      cross. THE OPPOSITION IS THE DISCRIMINATING CONTENT.
      (G-B) THE TAIL LADDER: synthetic survival families {Rayleigh,
      exponential, Pareto(1.5)} at matched means, plus the two real arms.
      FORCED: at fixed c, the magnitude of |1 - ratio| is MONOTONE INCREASING in
      tail heaviness, with BSGS (nearly deterministic) smallest and Pareto(1.5)
      largest. This localises the mechanism to the tail beyond the cap rather
      than to the accounting rule alone.
    nearby_object_control: >-
      BSGS, whose cost is nearly deterministic -- ceil(sqrt(ell)) baby steps
      plus a uniform number of giant steps -- and which therefore has little
      mass beyond any cap set above its mean. FORCED: at every c <= 1, BSGS's
      |1 - ratio| must be at most HALF of rho's. This is the closest object
      where the hoped-for conclusion weakens, it is included because it cuts
      against the headline, and its failure would mean the effect is not driven
      by the tail and the mechanism is misattributed.
    ordering_control: >-
      COMMIT THE NULL BEFORE THE TREATMENT. The complete uncensored arm --
      construction transcript, per-attempt full step counts, uncensored
      aggregates, uncensored fitted slopes, and the survival goodness-of-fit
      output -- is written to disk and SHA-256 hash-committed BEFORE any cap is
      applied to any record. Absence of that commitment, or any modification of
      the uncensored record after a censored aggregate exists, is
      invalid_measurement. The survival goodness-of-fit verdict is likewise
      written down before any ratio is interpreted.
    comparability_policy: >-
      All aggregates at a cell derive from the SAME recorded runs, the SAME
      curve, the SAME subgroup, and the SAME group-operation charging
      vocabulary. Comparison to any artifact outside this contract -- including
      EXP-ICEX-b8b2b6, EXP-SMTH-*, EXP-DS-*, or any SDEG/MONO/RELN package -- is
      FORBIDDEN without a separately registered comparator contract naming both
      domains, streams, statistics, and failure dispositions. A shared master
      seed with any other contract does not imply stream or output equivalence.
    archive_check: >-
      Prior censoring-fraction measurements in this corpus: NOT AVAILABLE.
      EV-ICEX-001 records that no ICEX measurement or solver campaign was
      executed. A grep of the frozen protocol on 2026-08-05 found "censored"
      at exactly two lines (402 and 736) and no correction, no survival
      estimator, and no attempts-per-replica pin. This unavailability is
      recorded as unavailability, not as a passed check.

  independent_variables:
  - log2(subgroup order) n in {8, 10, 12, 16}
  - cap multiple c = M/sqrt(ell) in {0.25, 0.5, 1.0, 2.0, 4.0}
  - cap regime in {fixed_M_across_cells, M = c0 sqrt(ell)}
  - aggregate definition in {charged_aggregate, cost_per_certified_success_with_restart}
  - arm in {rho_serial, rho_negation, bsgs, synthetic_Rayleigh, synthetic_exponential, synthetic_Pareto1.5}

  metrics:
    primary:
    - ratio_aggregate[arm, cell, c] = E[min(X,M)] / E[X], estimated from the recorded attempt costs.
    - ratio_per_success[arm, cell, c] = (E[min(X,M)] / P(X <= M)) / E[X], same recorded costs.
    - Fitted ladder slope of log2(aggregate) on n, per aggregate, per cap regime, with CI.
    - censoring fraction q[arm, cell, c] = fraction of attempts with X > M -- a first-class metric that appears nowhere in the frozen artifact.
    - Budget feasibility ratio recomputed from committed text: maximum_attempts * per_attempt_wall / per_campaign_wall, and floor(per_campaign_wall / per_attempt_wall).
    secondary:
    - Kolmogorov-Smirnov statistic and p-value for the recorded rho step counts against exp(-t^2/(2 ell)), per cell, reported before any ratio is interpreted.
    - Empirical mean step count per cell against sqrt(pi ell/2), and empirical sd of log2(steps) against 0.925164 bits.
    - Monotonicity pass/fail per adjacent pair on both graded ladders.
    - Per-arm |1 - ratio| at each c, with the rho-versus-BSGS comparison explicit.
    - Construction transcript per cell (p, a, b, #E, ell, cofactor, generator, log2(ell) - bits).

  heuristic_under_test: HEUR-CEN-1

  preregistered_prediction:
    quantity: >-
      The two censoring ratio families for matched Pollard rho at cap multiples
      c in {0.25, 0.5, 1, 2, 4}, the censoring fraction at the same c, and the
      fitted ladder slopes under the two cap regimes.
    formula: >-
      ratio_aggregate(c) = erf(c/sqrt 2) = 2 Phi(c) - 1;
      ratio_per_success(c) = erf(c/sqrt 2) / (1 - exp(-c^2/2));
      q(c) = exp(-c^2/2);
      fixed cap => aggregate slope -> 0 and per-success slope -> 1;
      M = c0 sqrt(ell) => both slopes = 1/2 exactly.
      All follow from S(t) = exp(-t^2/(2 ell)) via
      E[min(X,M)] = int_0^M S = sqrt(pi ell/2) erf(M/sqrt(2 ell)) and
      P(X <= M) = 1 - exp(-M^2/(2 ell)).
    source: >-
      DERIVED IN-REPO in H-ICEX-a2e95b mechanism Parts 1-3 and in
      IDEA-20260805-45bf55. The survival function is HEUR-CEN-1, re-derived
      rather than cited; NO EXTERNAL SOURCE IS ASSERTED. Numeric values:
      ratio_aggregate 0.197413 / 0.382925 / 0.682689 / 0.954500 / 0.999937;
      ratio_per_success 6.416425 / 3.258850 / 1.735051 / 1.103896 / 1.000272;
      q 0.969233 / 0.882497 / 0.606531 / 0.135335 / 0.000335; budget ratio
      5.33333 and 24 full-length attempts.

  scale_relevance:
    tier: toy
    justification: >-
      The one-sided inequality E[min(X,M)] <= E[X] and the repair argument (both
      ratios depend on M and ell only through c, so a sqrt(ell)-scaled cap makes
      the bias constant) are DISTRIBUTION-FREE and SCALE-FREE, so a confirming
      measurement is a check of a derivation rather than an extrapolation. The
      SPECIFIC RATIO VALUES depend on the birthday model and are toy-scale
      measurements of a generic baseline. Nothing here says how an
      index-calculus arm behaves or what any exponent is at any scale.
    correspondence: >-
      null -- direct construction, no sampling correspondence. Post-hoc capping
      of recorded runs is exact resampling of the same data, not a
      correspondence trick, and it is labelled as such.

  tail_checks:
  - Kolmogorov-Smirnov fit of the recorded step counts to exp(-t^2/(2 ell)) at every cell, with the verdict written down BEFORE any ratio is interpreted. Declared consequence, fixed in advance: a failure voids the SPECIFIC forced numbers (which are then recomputed from the empirical survival and reported as empirical) and leaves the SIGN of the bias, the two-aggregate opposition, the repair, and the budget arithmetic unaffected, because those hold for every distribution.
  - Extreme-value check on the largest observed step count per cell against its predicted order statistic, since the whole audit concerns the right tail and a mis-modelled tail is the most likely source of error.
  - The synthetic tail ladder (Rayleigh, exponential, Pareto(1.5)) exercises the distribution-free half on tails the birthday model does not describe.
  - Independent recomputation of every preregistered constant by a second code path in exact or high-precision arithmetic before it is used as a prediction.

  replication:
    seeds: [6117340]
    seed_expansion: >-
      All per-attempt seeds derive from master_seed 6117340 through the
      seed_derivation_rule and are listed exhaustively in the sealed schedule
      before execution.
    independent_instances: 4
    planned_runs: 1
    interpretation: >-
      One run is a charging-convention audit. It cannot by itself support,
      reject, or validate any ECDLP proposition, any exponent, or any claim
      about index calculus. Its strongest possible output is a scoped statement
      about one accounting rule applied to generic baselines at four toy sizes.

  budget:
    wall_clock_seconds_per_run: 6300
    stage_wall_clock_seconds:
      stage0: 900
      stage1: 1800
      stage2: 1800
      stage3: 1800
    total_cpu_hours: 2
    maximum_memory_gb: 2
    maximum_runs: 1
    no_network: true

  stage_order_and_termination:
    principle: >-
      Strictly cheapest-first, and the cheapest gate is decisive. Stage 0 is one
      division on committed text and stage 1 is zero compute; either can end the
      line before any program is written.
    stage0:
      cost: zero compute, one division
      content: >-
        Recompute the budget feasibility ratio from the frozen artifact
        (maximum_attempts 128, per_attempt wall 300 s, per_campaign wall
        7200 s), and record from the Coordinator whether the per-attempt cap is
        intended fixed across cells or re-declared per cell at seal time.
      can_terminate: >-
        PARTIALLY. If the cap is per-cell and sqrt(ell)-scaled by intent,
        HEUR-CEN-2 is falsified, the slope result is VOID BY INTENT, the record
        says so plainly rather than salvaging it, and the run continues only for
        the level result, the aggregate ambiguity, the censoring fraction, and
        the budget arithmetic. If the budget ratio does not reproduce 5.33333
        and 24, that section is withdrawn without prejudice to the rest.
    stage1:
      cost: zero compute
      content: >-
        Re-derive by hand, and independently recompute in high-precision
        arithmetic, every SESSION-COMPUTED value in H-ICEX-a2e95b: the layer-cake
        identity, both closed forms, both five-value ratio tables, the
        censoring-fraction table, the two small-c limits (aggregate slope -> 0,
        per-success slope -> 1), and the constancy-of-bias argument for
        M = c0 sqrt(ell).
      can_terminate: >-
        YES, AND THIS IS THE PRIMARY FALSIFIER. Any disagreement halts the line
        at zero compute and routes to a superseding record. A closure at stage 1
        is a first-class deliverable.
    stage2:
      cost: seconds to minutes
      content: >-
        Run rho (serial, negation) and BSGS TO COMPLETION at all four cells,
        record every full attempt cost, run the survival goodness-of-fit, and
        hash-commit the uncensored arm.
      can_terminate: >-
        YES via the null. If the uncensored fitted slope CI excludes 0.500, the
        instrument is broken, the outcome is failed_infrastructure, and NO
        negative may be reported.
    stage3:
      cost: minutes
      content: >-
        Apply every cap post hoc under both regimes and both aggregates; compute
        all ratios, censoring fractions, and fitted slopes; run the synthetic
        tail ladder; report monotonicity and the deliverable required by
        falsification condition F9 of H-ICEX-a2e95b.
      can_terminate: NO -- it is the reporting stage and is mandatory under every outcome.

  stopping_rules:
  - Do not execute unless this contract is separately reviewed, approved, frozen, archived, and explicitly authorized by the Coordinator. GOAL-ICEX-001's committed next_action keeps ICEX non-executing and nothing here overrides it.
  - Stop at stage 1 if any hand derivation disagrees with a stated SESSION-COMPUTED value; emit the disagreement as the deliverable.
  - Stop at stage 2 if the uncensored null's fitted slope CI excludes 0.500; emit failed_infrastructure and report no negative about anything.
  - Stop before any cap is applied if the uncensored arm's hash commitment is absent.
  - Stop and emit CONSTRUCTION_FAILURE for a cell whose prime or curve construction terminates as specified; do not substitute a nearby size, reseed, or wrap.
  - Stop on exceeding any declared stage wall-clock, CPU, or memory budget; record the exhaustion as an infrastructure outcome.
  - Stop immediately if any stage requires reading an SDEG, MONO, or RELN artifact, assembling a C_IC, invoking a summation polynomial, or simulating an index-calculus cost distribution as if it had been measured. That is scope drift and it invalidates the package.

  invalidation_rules:
  - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
  - Any use of entropy outside the declared seed_derivation_rule.
  - Any enforcement of a cap DURING execution rather than post hoc, which would reintroduce the between-arm confound the design exists to eliminate.
  - Any modification of the committed uncensored record after a censored aggregate exists, or any absence of that hash commitment.
  - Any interpretation of a ratio before the survival goodness-of-fit verdict has been written down.
  - Any comparison to an artifact outside this contract without a separately registered comparator contract.
  - Any use of the nominal bit size in place of log2(ell).
  - Any statement in the run report that ascribes an index-calculus, ECDLP-cost, exponent, or crypto-scale meaning to any measurement here, or that reports a censoring fraction for an index-calculus arm (none is measured).
  - Any adjustment to a preregistered prediction after a corresponding number has been observed. A revision requires a versioned protocol_amendment marked exploratory_only and is never an edit (EV-IC-002 precedent).

  success_criterion: >-
    This draft has NO current success outcome because it is not authorized for
    execution. If a later, separately approved and frozen successor is executed,
    its only positive disposition is a complete charging-audit readout in which:
    (i) stage 1 reproduces every preregistered constant by an independent code
    path; (ii) the uncensored null returns ratios of exactly 1.000 and a slope
    CI containing 0.500, and is hash-committed before any cap is applied;
    (iii) positive controls P1 (sensitivity at c = 0.25) and P2 (the repair
    restores the slope) both fire; (iv) both graded ladders report monotonicity
    pass/fail per adjacent pair; (v) the nearby-object BSGS comparison is
    reported including the cell that cuts against the headline; (vi) the
    censoring fraction is reported per cell per arm per c; and (vii) the budget
    feasibility ratio is stated numerically. That disposition establishes no
    ECDLP attack, cost, exponent, crypto-scale, or deployed-scheme claim, and no
    status change for any record.

  falsification_criterion: >-
    The hypothesis H-ICEX-a2e95b is falsified, in whole or in the named part, by
    any of: measured aggregate ratios departing from erf(c/sqrt 2) beyond the
    Monte Carlo band WHILE the survival fit passes (kills the derivation); the
    two aggregates moving in the SAME direction with c (kills the opposition
    claim); the fixed-cap fitted slope staying inside the uncensored CI at every
    cell (kills the slope-contamination claim, leaving the level claim to be
    reported separately); the sqrt(ell)-scaled cap failing to restore a slope CI
    containing 0.500 (kills the diagnosis and withdraws the recommendation);
    BSGS being distorted as much as rho at the same c (mechanism misattributed);
    or the budget arithmetic failing to reproduce 5.33333 and 24 (withdraws that
    section). A stage-0 Coordinator statement that the cap is per-cell and
    sqrt(ell)-scaled voids the slope result BY INTENT and must be reported as
    such rather than worked around.

  infrastructure_failure_disposition: >-
    A timeout, crash, missing dependency, import failure, or exhausted budget is
    reported as an INFRASTRUCTURE SIGNAL and is NEVER negative mathematical
    evidence and never evidence about the frozen protocol (AGENTS.md rule 5 and
    OBL-TERMINAL-VOCABULARY). This contract is unusually exposed to the
    confusion it studies, so the rule is restated concretely: an execution that
    itself times out has produced NO censoring measurement, not a censoring
    measurement of itself. Environment probed 2026-08-05: numpy 2.4.6 imports;
    sympy and sage do NOT (ModuleNotFoundError). Every stage MUST run on the
    Python 3 standard library alone; numpy is optional. A stage requiring an
    absent dependency is an INFRASTRUCTURE REQUEST to the Coordinator, reported
    as not run rather than as failed. A failed positive control blocks every
    negative conclusion in the package.

  required_artifacts_if_later_authorized:
  - Frozen approved specification and a freeze receipt binding its SHA-256.
  - Stage-0 budget recomputation and the Coordinator's verbatim statement on the cap regime, with timestamps.
  - Stage-1 hand derivation and independent high-precision recomputation of every preregistered constant, side by side.
  - Construction transcript per cell (p, a, b, #E, ell, cofactor, generator, log2(ell) - bits) and its SHA-256.
  - Uncensored-arm hash commitment recorded before any cap is applied, with the survival goodness-of-fit verdict inside it.
  - Per-attempt full uncensored cost records for every arm, cell, replica, and attempt, with seeds and terminal status.
  - Both ratio tables and the censoring-fraction table at every c, per arm, per cell, with Monte Carlo bands.
  - Fitted ladder slopes under both cap regimes and both aggregates, with CIs.
  - Graded-ladder monotonicity tables with per-adjacent-pair pass/fail.
  - Synthetic tail-ladder output for Rayleigh, exponential, and Pareto(1.5).
  - Manifest, environment and dependency versions, exact command, git commit and dirty-tree state, requested policy, backend, resolved model identifier and probe-verification status, reasoning effort, stdout, stderr, timestamps, and resource measurements (AGENTS.md artifact policy).
  - Execution report, then a Coordinator snapshot archive, then independent validation and red-team review before any evidence record is written.

  approval_requirements:
  - Independent review confirms that the uncensored null can genuinely fail, that both positive controls can genuinely fail, and that caps are applied post hoc rather than enforced live.
  - Independent review confirms that no stage reads an SDEG/MONO/RELN artifact, assembles a C_IC, or simulates an index-calculus cost distribution.
  - Independent review confirms the pre-declared split between conclusions that survive a survival-model failure (the sign, the opposition, the repair, the budget arithmetic) and those that do not (the specific ratio values), and that this split was fixed before execution.
  - Coordinator separately approves and freezes a successor contract without editing this draft.
  - Coordinator separately authorizes execution, since GOAL-ICEX-001's next_action currently keeps ICEX non-executing (DEC-20260731-015 / EV-ICEX-001).

  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved; only the Coordinator approves an experiment (AGENTS.md rule 1).
