experiment:
  id: EXP-JMV-80e0c7
  hypothesis_id: H-JMV-71b222
  derived_from_idea: IDEA-20260807-63ab15
  question_id: RQ-JMV-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Double-transcription verification of the load-bearing JMV inputs including
    the degree and eigenvalue normalization conventions, plus a vertical
    level-graph connectivity and class-number census at enumerable sizes with a
    gating horizontal-connectivity forced value and a matched-degree random
    null

  objective: >-
    THE ONE UNCERTAINTY A RUN REDUCES -- two halves, run independently.
    PART V -- whether the inputs that two approved JMV hypotheses declare
    LOAD-BEARING AND UNVERIFIED can be established from the primary text, and
    whether the verified value AGREES with the value H-JMV-001 assumes. A run
    establishes V1, character-by-character agreement between two independent
    transcriptions of the verbatim table rows, the four cited statements and
    the degree and eigenvalue normalization conventions; V2, agreement or
    disagreement between the verified value and the assumed one; and V3,
    whether the conventions were located at all.
    PART G -- whether RQ-JMV-001's third declared knowledge gap, the
    cross-level case the source paper explicitly does not cover, is even
    formulable. A run establishes G1, horizontal connectivity as a gating
    forced value; G2, the number and sizes of the vertical graph's connected
    components at at least two conductor structures at p around 2^20; G3, the
    exact class-number ratio at each vertical level step; G4, the mixing
    statistic against a matched-degree random null; and G5, the level count per
    conductor.
    NO ECDLP ATTACK IS PROPOSED -- RQ-JMV-001's own constraint forbids one --
    and no status change to any record follows from any outcome.

  what_this_is_not:
    - >-
      Not an ECDLP attack, and not a step toward one. RQ-JMV-001's constraint
      forbids proposing one and this contract respects it.
    - >-
      Not a status change to H-JMV-001, H-JMV-002, RQ-JMV-001, or the existing
      corpus entry for the source paper. This run supplies the CONTENT a
      correction would need; making the correction is a Coordinator act on
      committed records.
    - >-
      Not a promotion of any knowledge entry. Any superseding literature entry
      is drafted as a run artifact and is archived, if at all, by a separate
      Coordinator ledger task with its provenance level stated explicitly.
    - >-
      Not a claim about cryptographic sizes. Part G runs where the level
      structure is fully enumerable and its extrapolation heuristic is recorded
      as unjustified.
    - >-
      Not approval, freezing, execution authorization, a run, an observed
      output, or evidence. approved_by is null.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE -- Part V, "the primary text states [these
      verbatim rows and statements] under [these transcribed conventions], and
      the value H-JMV-001 assumes [agrees / disagrees] with it"; Part G, "at
      the tested conductor structures at p around 2^20, the vertical level
      graph has [k] components of sizes [...], the class-number ratios at each
      step are [...], and its mixing statistic is [value] against a
      matched-degree random null of [value]." WHAT DOES NOT FOLLOW -- nothing
      about attack cost, nothing about cryptographic sizes, nothing about
      whether curves of the same order have the same difficulty, and no status
      transition for any committed record. Part V's tier is the documentary
      one; the toy label governs Part G and any pooled reading.

  inputs:
    procedure: >-
      STAGE 0 (zero compute) -- declare and hash, before retrieval -- the two
      conductor structures, the minimum level count below which a conductor is
      EXCLUDED, the mixing statistic, and the exact list of items to be
      transcribed (the table rows, the four cited statements, and the degree
      and eigenvalue normalization conventions). Record the values H-JMV-001
      and H-JMV-002 currently ASSUME, read verbatim from those committed
      records with paths and lines, so that the comparison target exists before
      the source is opened.
      STAGE 1 (agent hours, PART V) -- establish source reachability and
      RECORD the attempt (URL, HTTP status, timestamp). If unreachable, report
      SOURCE-BLOCKED and skip to Stage 2. Otherwise produce TWO INDEPENDENT
      transcriptions by different readers of every declared item, and compare
      character by character. Report V1, V2, V3.
      STAGE 2 (minutes to an hour, PART G) -- for each declared conductor
      structure at p around 2^20, enumerate the order lattice between Z[pi] and
      the maximal order; build the horizontal (same-level) graph and check
      connectivity as the GATING forced value; then build the vertical
      (level-changing) graph, report its components and their sizes, and
      compute the exact class-number ratio at every level step.
      STAGE 3 (minutes) -- build a matched-degree random graph on the same
      level set and compute the identical mixing statistic on both, reported on
      the same axes.
      STAGE 4 (zero compute) -- assemble V1-V3 and G1-G5, the exclusion list
      for conductors below the minimum level count, and the draft content for a
      corrected knowledge_gap and a superseding literature entry -- as CONTENT
      ONLY, with no transition performed.
    instrument: >-
      Part V -- document retrieval by the executor's fetch tooling with every
      attempt logged, and TWO independent human-or-agent readers producing
      separate transcription files that are diffed mechanically. A single
      reader's output is not admissible. A fetch that returns a
      model-summarised rendering rather than the source text is NOT a
      transcription source and must be recorded as such, because a paraphrase
      imported as a source is precisely the failure this design exists to
      prevent.
      Part G -- Python 3.11 with numpy; NO Sage and NO sympy, whose absence in
      this container is recorded in prior lane records and must be re-checked
      and recorded at run time. Order lattices, class numbers and level steps
      are computed in exact integer arithmetic; no floating-point class number
      is admissible. Recorded through harness/runner.py.
    parameters: >-
      Source -- arXiv math/0411378 (Jao-Miller-Venkatesan 2005). Transcription
      items -- the verbatim table rows relied on by H-JMV-001, the four cited
      results relied on by H-JMV-002, and the paper's degree and eigenvalue
      normalization conventions. Readers -- 2, independent. Part G -- at least
      2 conductor structures with several divisors, at p around 2^20, declared
      before retrieval; minimum level count declared before the run; mixing
      statistic declared before the run; matched-degree random null on the same
      level set.
  controls:
    - >-
      INDEPENDENT SECOND TRANSCRIPTION, BLOCKING -- two readers, compared
      character by character. This is the only control that can detect a
      paraphrase imported as a source, and a disagreement makes NEITHER
      admissible until reconciled.
    - >-
      ASSUMED-VALUE PRE-REGISTRATION -- the values H-JMV-001 and H-JMV-002
      currently assume are read verbatim from those committed records and
      hashed BEFORE the source is opened, so the comparison target cannot drift
      toward whatever the source turns out to say.
    - >-
      HORIZONTAL-CONNECTIVITY FORCED VALUE, GATING -- the same-level graph must
      come back connected at every tested conductor structure, as the source
      paper's own hypotheses assert. If the instrument cannot reproduce a
      component structure it is told is trivial, NO vertical result is
      admissible.
    - >-
      MATCHED-DEGREE RANDOM NULL -- a random graph on the same level set with
      matched degrees, run through the identical mixing computation. If mixing
      behaviour matches, the level structure carries nothing and no structural
      reading of the vertical graph is available.
    - >-
      LEVEL-COUNT SIZING CHECK -- a conductor structure whose level count falls
      below the declared minimum is EXCLUDED and its connectivity verdict is
      inadmissible. A two-vertex graph is connected for reasons that carry no
      information.
    - >-
      RETRIEVAL LOG -- every fetch attempt recorded with URL, HTTP status,
      timestamp and attempt count, so SOURCE-BLOCKED is distinguishable from
      not-attempted and from a source that exists but says nothing.
    - >-
      PROVENANCE-LEVEL CONTROL -- any drafted superseding literature entry
      states its provenance level explicitly, so a later reader cannot mistake
      a bulk-seed relay for a verified transcription. The existing entry's own
      self-declared unverified status is quoted in the draft.

  independent_variables:
    - "part (V transcription / G structural census)"
    - reader (two independent transcribers)
    - conductor structure
    - "graph type (horizontal / vertical / matched-degree random null)"
    - level step (for the class-number ratio)

  metrics:
    primary:
      - >-
        V1 transcription_character_agreement -- the number of characters at
        which the two independent transcriptions of the declared items differ.
        Unit -- dimensionless count. Required 0.
      - >-
        V2 assumed_versus_verified -- boolean agreement between the verified
        table value and the value H-JMV-001 assumes, with BOTH values printed.
        Unit -- boolean plus two values.
      - >-
        V3 convention_capture -- whether the degree and eigenvalue
        normalization conventions were located and transcribed verbatim, with
        their source location, or established ABSENT with the named search
        terms used. Unit -- categorical plus location or search terms.
      - >-
        G1 horizontal_component_count -- number of connected components of the
        same-level graph per conductor structure. Unit -- dimensionless count.
        GATING; required 1.
      - >-
        G2 vertical_component_count and component sizes -- number and sizes of
        connected components of the level-changing graph per conductor
        structure. Unit -- dimensionless count plus a size vector.
      - >-
        G4 mixing_statistic -- the declared mixing statistic computed on the
        vertical graph and on the matched-degree random null, on the same axes.
        Unit -- as declared at Stage 0.
    secondary:
      - >-
        G3 class-number ratio at each vertical level step, exact, per conductor
        structure
      - >-
        G5 level count per conductor structure, with the exclusion verdict
        against the declared minimum
      - both transcription files in full, and their mechanical diff
      - the retrieval log (URL, HTTP status, timestamp, attempts)
      - the pre-registered assumed values read from H-JMV-001 and H-JMV-002 with paths and lines
      - draft content for a corrected knowledge_gap and a superseding literature entry, with provenance level stated, as CONTENT ONLY
      - a recorded check of whether sage and sympy import

  heuristic_under_test: HEUR-JMV3-1
  preregistered_prediction:
    quantity: >-
      V1 = 0; V3 captured; G1 = 1 at every tested conductor; G2 = 1
      (connected); and G4 reported against the null.
    formula: >-
      V1 := the character-level diff count between the two transcriptions.
      V2 := (verified value equals assumed value). G1, G2 := component counts
      of the horizontal and vertical graphs. Under the NULL that the vertical
      structure carries no information, G4 on the vertical graph is
      indistinguishable from G4 on the matched-degree random null. Under the
      HYPOTHESIS that the cross-level case is structurally obstructed, G2 > 1
      at some tested conductor.
    source: >-
      Pre-registered in IDEA-20260807-63ab15 (predictions -- agreement of the
      verified transcription with the assumed value; connectivity of the
      vertical level graph) and restated as V1-V3, G1-G5 in H-JMV-71b222 before
      any run exists. THE VALUES H-JMV-001 AND H-JMV-002 ASSUME ARE NOT
      RESTATED IN THIS CONTRACT -- they must be read verbatim from those
      committed records at Stage 0 and hashed before the source is opened, so
      that the comparison target cannot drift.

  scale_relevance:
    tier: toy
    justification: >-
      Part G is executed at p around 2^20 precisely because RQ-JMV-001 scopes
      it there and because the level structure is FULLY ENUMERABLE at that
      size, making connectivity a computable yes-or-no rather than an estimate.
      THE TRANSFER ASSUMPTION IS STATED AND EXPLICITLY UNJUSTIFIED
      (HEUR-JMV3-1) -- class numbers grow with p and the structure may change
      qualitatively, so nothing about cryptographic sizes follows and the
      deliverable must say so in every conclusion. Part V has no scale of its
      own -- it is a documentary comparison and inherits whatever scale the
      paper's own statements carry, which is why its tier is recorded
      separately from the toy label governing Part G.
    correspondence: null

  tail_checks:
    - >-
      Report the largest connected component of the vertical graph and the
      number of isolated vertices, since "disconnected" with one large
      component and one isolated level means something different from an evenly
      split graph.
    - >-
      Report the extreme class-number ratios (largest and smallest step)
      separately, since a single anomalous step can dominate any mixing
      statement.
    - >-
      Report the transcription diff LOCATIONS, not only the count, so a single
      transposed digit is distinguishable from a systematically different
      reading.
    - >-
      Report whether any fetched rendering passed through a summarising model
      rather than returning source text, since such a rendering is not a
      transcription source at all.
    - >-
      Report the level count per conductor before the connectivity verdict, so
      an uninformative verdict is visible as uninformative.

  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 2
    note: >-
      Seeds govern only the matched-degree random null draws. The order-lattice
      enumeration, the connectivity computations and the class-number ratios
      are DETERMINISTIC and must be identical across seeds. For Part V,
      "independent instances" means TWO INDEPENDENT READERS, not two fetches by
      one reader -- a second fetch by the same reader replicates nothing that
      the diff is designed to catch.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1.0
    agent_hours_estimate: 4
    maximum_memory_gb: 4
    maximum_runs: 4

  stopping_rules:
    - >-
      If the source is unreachable, record SOURCE-BLOCKED with the full
      retrieval log and skip Part V entirely. Part G still runs, since it needs
      no source. A block is an access state, never evidence.
    - >-
      STOP Part V reporting if the two transcriptions disagree. Neither is
      admissible; the located discrepancy is the deliverable.
    - >-
      STOP all vertical reporting if the horizontal-connectivity forced value
      fails. The instrument defect is the deliverable.
    - >-
      EXCLUDE any conductor structure whose level count falls below the
      declared minimum, and report the exclusion. If both are excluded, Part G
      is UNTESTED, not answered.
    - >-
      Stop at maximum_runs, total_cpu_hours or the agent-hour estimate,
      whichever binds first. Budget exhaustion is a stop, never a negative
      result (AGENTS.md rule 5).

  invalidation_rules:
    - >-
      A timeout, crash, HTTP failure or missing dependency is
      failed_infrastructure or SOURCE-BLOCKED and is NEVER negative evidence
      (AGENTS.md rule 5).
    - >-
      A run reporting a transcription from a single reader is
      invalid_measurement -- the control the contract exists to apply was not
      applied.
    - >-
      A run whose transcription source was a model-summarised rendering rather
      than the source text is invalid_measurement; a paraphrase is not a
      transcription.
    - >-
      A run reporting vertical connectivity without the horizontal forced value
      and the matched-degree null executed in the same invocation is
      invalid_measurement.
    - >-
      A run whose assumed comparison values were read from H-JMV-001 or
      H-JMV-002 AFTER the source was opened is completed_invalid.
    - >-
      A run that performs any status change, edits any committed record, or
      writes a knowledge entry is completed_invalid -- those are Coordinator
      acts and this contract authorizes none of them.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT
      experiment and requires a new contract.

  success_criterion: >-
    The run is SUCCESSFUL as a measurement when -- (a) the Stage-0
    pre-registration, including the assumed values read from H-JMV-001 and
    H-JMV-002 with paths and lines, was hashed before retrieval; (b) either
    V1 = 0 with V2 and V3 reported, or SOURCE-BLOCKED is recorded with a full
    retrieval log; (c) G1 = 1 at every tested conductor structure; (d) G2, G3,
    G4 and G5 are reported per conductor with the matched-degree null on the
    same axes; and (e) any conductor below the minimum level count is excluded
    and the exclusion is reported. The hypothesis H-JMV-71b222 Part V is
    RESOLVED when V1 = 0 and V2 is reported in either direction; Part G is
    SUPPORTED at toy tier if G1 = 1 and G2 = 1 at every tested conductor with
    G4 distinguishable from the null, and is FALSIFIED if G2 > 1 anywhere.

  falsification_criterion:
    - >-
      V2 shows AGREEMENT between the verified value and the value H-JMV-001
      assumes. That hypothesis's arithmetic-audit claim has NO SUBJECT and is
      withdrawn, exactly as its own falsification conditions state. A clean,
      fully reachable negative.
    - >-
      V1 > 0 -- the two transcriptions disagree. Neither is admissible and
      nothing downstream may be reported until reconciled.
    - >-
      V3 ABSENT -- the paper does not state its degree and eigenvalue
      normalization conventions. H-JMV-002's factor-of-2 concern cannot be
      settled from the primary text; the absence with its search terms is the
      finding.
    - >-
      G1 > 1 -- the instrument fails to reproduce horizontal connectivity. NO
      vertical result is admissible; instrument defect.
    - >-
      G2 = 1 with fast mixing exceeding the matched-degree null. Part G's
      obstruction reading is FALSE -- the cross-level gap is not the
      obstruction it might be at these sizes, and order-only curve selection is
      better supported here than the source literature claims.
    - >-
      G4 shows the vertical graph mixing indistinguishably from the
      matched-degree random null. The level structure carries nothing; no
      structural reading of G2 is available and it is recorded as a controlled
      null.
    - >-
      G5 below the declared minimum at every tested conductor. Part G is
      UNTESTED rather than answered.

  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
    - raw-result.json carrying every per-conductor component count, component size vector, per-step class-number ratio and mixing statistic, not summaries
    - both transcription files in full, plus their mechanical character-level diff
    - the Stage-0 pre-registration with the assumed values read from H-JMV-001 and H-JMV-002, their paths and lines, hashed before retrieval
    - the full retrieval log (URL, HTTP status, timestamp, attempts), including a SOURCE-BLOCKED record if applicable
    - the horizontal-connectivity forced-value result and the matched-degree null, in the same file as the vertical arm
    - the level count and exclusion verdict per conductor structure
    - draft content for a corrected knowledge_gap and a superseding literature entry, with provenance level stated, marked explicitly as CONTENT ONLY and not a transition
    - a recorded check of whether sage and sympy import

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; approved_by is null and
      execution_authorized is false (AGENTS.md rule 1). Approval is the user's
      gate because it authorizes execution and spends compute.
    - >-
      The Stage-0 pre-registration, including the assumed values read verbatim
      from H-JMV-001 and H-JMV-002, must be committed and hashed BEFORE the
      source is opened. A comparison target recorded after reading the source
      is not a comparison target.
    - >-
      A Coordinator must confirm that approving this contract authorizes NO
      status change to H-JMV-001, H-JMV-002 or RQ-JMV-001, and NO knowledge
      promotion. The run produces draft content only.
    - >-
      A Coordinator must confirm the two conductor structures and the minimum
      level count before approval, because a Part-G verdict from an
      under-sized lattice is inadmissible and choosing the structures after
      seeing a result would be fitting.

  derivation_provenance:
    tool: coordinator-subagent design pass
    source_record: IDEA-20260807-63ab15
    authored_at: '2026-08-25'
    note: >-
      Metrics V1-V3 and G1-G5, the controls and the criteria render the parent
      proposal's two predictions, its three minimal_test controls and its three
      falsification conditions into quantities decidable from a recorded
      number. V3 (explicit capture of the degree and eigenvalue normalization
      conventions) is promoted to a primary metric because the parent proposal
      identifies it as the exact place a decisive factor of 2 would hide.
      Budgets come from the parent's declared estimated_cost (implementation
      low, compute low) with agent hours separated from CPU hours because
      retrieval dominates Part V. No field is invented; unsupplied values are
      listed in derivation_gaps.

  derivation_gaps:
    - >-
      THE ASSUMED VALUES ARE DELIBERATELY NOT RESTATED HERE. The parent
      proposal names them, but a contract that quotes a value from a hypothesis
      into a frozen fixture has copied rather than checked it. They must be
      read verbatim at Stage 0 with paths and lines recorded.
    - >-
      The two conductor structures and the minimum level count are not
      specified. A Coordinator must fix them before approval; a Part-G verdict
      from an under-sized lattice carries no information and choosing the
      structures afterwards would be fitting.
    - >-
      The mixing statistic is named but not defined. It must be declared at
      Stage 0, since the vertical-versus-null comparison is only meaningful if
      both are computed by the identical definition.
    - >-
      SOURCE REACHABILITY IS UNKNOWN AT DESIGN TIME. The parent proposal
      records a 2026-08-07 measurement that arXiv was reachable from this
      environment; that is not asserted as current, and the contract is written
      so that a block is a first-class reported state rather than an aborted
      run.
    - >-
      Whether the source paper states its normalization conventions at all is
      unknown. If it does not, V3 returns ABSENT and H-JMV-002's load-bearing
      input remains unverified for a documented reason -- which is a real
      outcome, not a failure of this design.
    - >-
      The parent proposal frames Part G as needing "any mixing statement
      formulable given the class-number ratio between adjacent orders." This
      contract measures the ratios and the connectivity but does NOT attempt to
      formulate a mixing statement; that is separate work with its own record,
      and the omission is disclosed rather than silently dropped.
