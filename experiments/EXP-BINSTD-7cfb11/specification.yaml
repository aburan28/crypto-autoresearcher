  id: EXP-BINSTD-7cfb11
  hypothesis_id: H-BINSTD-480fb5
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261002-7def74
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Sparse GF(2) fill-in ratio F vs surplus on toy |FB|=24 (n=17) with
    frozen β=16 and dual Python meters
  status: approved
  approved_by: DEC-20261003-40fe41
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  designed_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261003-40fe41 under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    ECC2K-130 solve. No n>=131 attack. Stage 2 (n∈{23,31}) not authorized
    here. Dual GF(2) meters are the runnable surface, not a missing-launcher
    detector.
  approval:
    approved_by: DEC-20261003-40fe41
    composing_decision: DEC-20261003-40fe41
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether F := nnz_after / nnz_initial stays ≤ 16 on n=17
    relation-like GF(2) matrices across surplus s∈{1.0,1.25,1.5,2.0}
    under a frozen Gauss–Jordan pin and dual-route agreement; deliver
    exactly one O-* label from H-BINSTD-480fb5.

  class: heuristic_validation
  class_note: >-
    Pre-registered fill-in band on a post-collection LA instrument.
    Not an exponent-moving breakthrough; no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Freeze |FB|, surplus, β=16, seeds, w=4, sparse-LA pin;
        dual probe (8×8 identity F=1 and 6×8 w=3 fixture).
      - >-
        Stage 1. n=17, |FB|=24, all four surplus levels, relation-like
        and Erdős–Rényi null; dual meters; RESULTS.md with exactly one
        O-* label.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Stage-2 n∈{23,31} under this card.
      - Editing IDEA claim text or GOAL-ECDLP2M-001.yaml.
      - Editing β after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.
      - Equating this meter with BW vs GE (IDEA-20261002-79a077).

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-7cfb11/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-7cfb11/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-7cfb11/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-7cfb11/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-7cfb11/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. Dual meters are the
      dual-implementation control. {run_dir} substituted by supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261002-7def74.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-480fb5.yaml
    n_stage1: 17
    fb_size:
      17: 24
      23: 32
      31: 40
    row_weight: 4
    surplus: [1.0, 1.25, 1.5, 2.0]
    beta: 16.0
    relation_seed: 2026100301
    er_seed: 2026100302
    probe_seed: 2026100303
    min_surplus_completed: 3

  controls:
    - name: twin_fill_in
      definition: >-
        route_sets.gauss_jordan_fill_in and route_bits.gauss_jordan_fill_in
        agree on nnz_initial, nnz_after, rank, and F on every measured matrix.
    - name: ctl_identity_probe
      definition: 8×8 identity has F=1 on both routes at Stage 0.
    - name: ctl_frozen_beta
      definition: β=16 frozen in stage0/preregistered-predictions.json before Stage 1.
    - name: ctl_shared_sparse_LA_pin
      definition: >-
        Left-to-right first unused pivot; XOR-clear that column from every
        other row (Gauss–Jordan over GF(2)).
    - name: ctl_frozen_V_and_surplus_schedule
      definition: >-
        Factor-base cardinality at n=17 is 24 and surplus
        s belongs to {1.0, 1.25, 1.5, 2.0}, frozen before Stage 1.
    - name: null_ER_same_shape_density
      definition: Erdős–Rényi p=w/|FB| matrices of matching shape at each surplus.
    - name: ctl_no_posthoc_beta_edit
      definition: check.py refuses band outcomes against a mutated β.
    - name: ctl_no_midtick_lib_provision
      definition: No Magma/Sage/AUXIN/Bedrock success path.

  independent_variables:
    - surplus in {1.0, 1.25, 1.5, 2.0}
    - matrix kind in {relation_like, er_null}
    - route in {sets, bits}

  metrics:
    primary:
      - fill_in_ratio_F
      - dual_route_agreement
      - surplus_levels_completed
    secondary:
      - rank
      - nnz_initial
      - nnz_after
      - F_er_null

  heuristic_under_test: HEUR-BINSTD-7def74-H1
  preregistered_prediction:
    quantity: fill_in_ratio_F on relation-like matrices
    formula: F := nnz_after_elim / nnz_initial ≤ 16
    source: >-
      IDEA-20261002-7def74 HEUR-BINSTD-7def74-H1. β=16 frozen in this
      specification before any official run. Design-time dual-route smoke
      checks are not Stage-1 evidence and did not retune β.

  scale_relevance:
    tier: toy
    justification: >-
      n=17 with |FB|=24 and weight-4 rows. No transfer to n≥131 or to a
      live Koblitz relation collector.
    correspondence: null

  tail_checks:
    - ≥3 of 4 surplus levels must complete before O-SUPPORT/O-FAIL-BAND.
    - Dual disagreement voids the table (O-ARTIFACT).
    - Identity probe F≠1 at Stage 0 invalidates the pin.

  replication:
    seeds: [2026100301, 2026100302, 2026100303]
    independent_instances: 2
    replication_note: >-
      Dual arithmetic routes are the two independent instances. Stage-2
      n∈{23,31} replication is not authorized.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stop after Stage 0 then Stage 1 as enumerated in trial-plan-v1.json.
    - Dual disagreement stops with O-ARTIFACT; do not edit β.
    - A crash is O-IMPEDIMENT, not a negative result.
    - Do not open Stage 2 under this card.

  invalidation_rules:
    - Either route imports the other.
    - β in preregistered-predictions.json differs from 16 at Stage 1.
    - Identity probe F is not 1.
    - Magma/Sage/AUXIN/Bedrock used as a success path.
    - A break/exponent/n≥131 claim is written into RESULTS.md.

  success_criterion: >-
    Dual routes agree; ≥3 surplus levels complete; F ≤ 16 on every
    completed n=17 relation-like cell (O-SUPPORT).

  falsification_criterion: >-
    Dual routes agree; ≥3 surplus levels complete; F > 16 on at least
    one completed n=17 relation-like cell (O-FAIL-BAND).

  required_artifacts:
    - experiments/EXP-BINSTD-7cfb11/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-7cfb11/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-7cfb11/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-7cfb11/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-7cfb11/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-7cfb11/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-7cfb11/RESULTS.md

  assigned_to: executor

  out_of_scope:
    - Any encoding, subspace sweep, or ECDLP solve.
    - Any comparison with rho at cryptographic size.
    - Stage-2 n∈{23,31}.
    - Rewriting IDEA-20261002-7def74 claim text.
    - Editing GOAL-ECDLP2M-001.yaml.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
