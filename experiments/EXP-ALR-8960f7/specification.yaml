experiment:
  id: EXP-ALR-8960f7
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-c80fdf; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-c80fdf
  question_id: RQ-ALR-002
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Threshold sweep of the nested projector weight across the characteristic: false-negative
    fraction against total target degree at primes 11 to 23, with unreduced integer preimages recorded
    and a matched random-integer-weight null'
  objective: 'The run reduces one uncertainty: where the below-characteristic assumption in H-ALR-002
    actually binds, and what happens immediately on the other side of it. (i) It generates instances
    at controlled total target degree D swept from a quarter of p to four times p at primes 11 through
    23, holding candidate structure fixed, computes chart-wise Fermat-projector traces as exact integers,
    records the unreduced weight vector, then reduces mod p, so that every subsequent observation
    is attributable to reduction rather than to computation. (ii) It compares the nonzero-residue
    support against an independently computed candidate support from direct group-law arithmetic on
    every instance, counts true candidates whose weight is a nonzero integer but zero residue, and
    reports the false-negative fraction per cell together with the smallest D at which any failure
    occurs at each prime. (iii) It runs a matched random-integer-weight null of identical total mass
    and support size through the identical reduction and comparison code path in the same invocation,
    so that any elliptic-specific behaviour is measured against the pure counting baseline. The run
    solves no instance, emits no locator for any live target, and contradicts nothing EV-ALR-002 established
    below the threshold.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: at primes 11 through 23, for the
      tested candidate structures and divisor constructions, the projector weight identity produces
      false negatives at the reported rate as a function of D/p, first failing at the reported D per
      prime, and departing from the matched random-integer-weight null by the reported amount. What
      does NOT follow: that the identity fails anywhere within the scope EV-ALR-002 asserts it, which
      is below the threshold and is untouched; that the boundary transfers to the recorded ALR curves
      near 10^5 or to any operational parameter; that anything follows for a live target; that the
      compact representation is unsound; or that any attack, speedup or security consequence exists.
      A measured threshold is a scope boundary on an identity, and scope boundaries are not defects.'
  inputs:
    procedure: 'STAGE 0, comparator setup, one hour: implement or reuse the independent group-law
      candidate-support computation in the style EV-ALR-002 used, and validate it on a handful of
      hand-checked instances. STAGE 1, instance generation, minutes: at each prime and each D on the
      grid, generate 200 instances with fixed candidate structure using exact toy curve arithmetic,
      recording chart count per instance. STAGE 2, exact trace computation, minutes: compute chart-wise
      gcd degrees as integers with no early reduction, and assert programmatically that no reduction
      has occurred before the preimage is stored. STAGE 3, reduction and comparison, seconds: reduce
      mod p, compare nonzero-residue support against comparator support, record every discrepancy
      with its integer preimage. STAGE 4, null arm, same cost: matched random integer weights at identical
      total mass and support, identical reduction and comparison. STAGE 5, controls, minutes: below-threshold
      band, candidate-structure sweep at fixed D, chart-count recording. STAGE 6, reporting, minutes:
      failure curve per prime, smallest failing D, null difference, and any below-threshold failure
      flagged as a fault rather than a result. Total compute a few CPU-minutes.'
    instrument: Python 3 with exact integer arithmetic and explicit deferred reduction, plus harness/toycurve.py
      for exact toy elliptic arithmetic, point generation and the independent group-law comparator
      that the certificate discipline relies on, and harness/runner.py for deterministic seeding,
      manifests and immutable run records. Polynomial gcd over F_p implemented directly in the experiment
      so that the reduction point is under explicit control. No sympy shortcut that might reduce early,
      no Sage, no external service.
    parameters: Primes p in {11, 13, 17, 19, 23}. Total target degree D on a grid of sixteen values
      from 0.25p to 4p. Candidate structure size c in {2, 3}, held fixed within a D-sweep and swept
      separately at fixed D. 200 instances per cell. Two arms, elliptic and matched random integer
      weights. Chart count recorded per instance. Total 5 primes times 16 D-values times 2 c-values
      times 200 instances times 2 arms = 64,000 instances at very small sizes.
  controls:
  - Matched random-integer-weight null at identical total mass and support size, same invocation,
    identical reduction code path.
  - Unreduced-preimage recording for every instance, so that every false negative is attributable
    to reduction and never to a computation fault.
  - Independent group-law candidate support comparator, the same comparator style EV-ALR-002 used,
    run on every instance rather than on a sample.
  - Below-threshold sanity band at D from 0.25p to 0.75p, where the false-negative fraction must be
    exactly zero.
  - 'Candidate-structure control: hold c fixed while sweeping D, and separately hold D fixed while
    sweeping c, so the two effects are not confounded.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Replace the projector-derived weights by uniformly random nonnegative
    integers on the same support with the same total mass D, reduce them mod p by the identical code
    path in the same invocation, and measure the identical false-negative statistic. The null gives
    the baseline rate at which a random weight vector of total mass D has a coordinate that is a nonzero
    multiple of p, which for random integers is approximately support size times D/(p * support size)
    in the relevant regime. The signal arm means something only if the elliptic arm departs from that
    baseline: colliding more would say the projector traces are unusually clustered at multiples of
    p, colliding less would say they are unusually spread. Equality is the expected and fully usable
    outcome, and it would establish that the threshold is a pure counting phenomenon with no elliptic
    content.'
  independent_variables:
  - characteristic_p
  - total_target_degree_D
  - candidate_structure_size_c
  - arm_elliptic_or_random_integer_weights
  metrics:
    primary:
    - false_negative_fraction_per_cell
    - smallest_total_target_degree_with_a_false_negative
    - candidate_support_agreement_rate
    - null_arm_false_negative_fraction
    secondary:
    - unreduced_integer_weight_distribution
    - chart_count_per_instance
    - below_threshold_band_failure_count
    - instances_with_masked_false_negative
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The fraction of instances in which at least one true candidate has a nonzero integer
      weight that is zero modulo p, as a function of D/p, per prime and per arm.
    formula: 'Predicted null: for weights modelled as independent nonnegative integers with mean D/c
      on each of c candidates, the chance that a given candidate''s weight is a nonzero multiple of
      p is approximately 1/p once the mean exceeds p, so the per-instance false-negative fraction
      is approximately 1 - (1 - 1/p)^c for D/p above one, and exactly zero for D < p. At p = 17 and
      c = 3 that is about 0.17 above threshold. Predicted signal: equality with the null within sampling
      error, which would establish the threshold as a counting phenomenon; a departure in either direction
      is the alternative and is reported with its sign.'
    source: Pre-registered in the parent proposal IDEA-20260816-c80fdf before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Primes 11 through 23, far below the recorded ALR curves near 10^5 and astronomically
      below any cryptographic parameter. These sizes are forced by the design: D must be able to exceed
      p with divisors small enough to generate and verify exactly, which is impossible at larger p.
      The transfer assumption, stated and not tested, is that the failure mechanism, reduction of
      an integer weight to zero, is characteristic-independent in form though not in location; the
      location D_crit is reported per prime and no value is claimed at any untested p.'
    correspondence: null
  tail_checks:
  - Inspect every below-threshold failure individually, since there should be none and each one is
    a bug report rather than a data point.
  - Report the masked-false-negative count separately, where a lost candidate is compensated by another
    supplying the same locator root, since aggregate locator agreement would hide those.
  - Examine the largest-D cells for saturation, where nearly every instance fails and the curve stops
    carrying information.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop the D sweep at 4p, where the failure fraction is expected to have saturated; do not extend
    it to make the effect look larger.
  - Abort and report a fault if any below-threshold false negative occurs or if the preimage assertion
    fires.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The below-threshold band shows zero false negatives at every prime, every reported
    false negative carries its unreduced integer preimage, the comparator agrees with the nonzero-integer-weight
    support in every below-threshold instance, and a failure curve against D/p is emitted per prime
    alongside the matched null column.
  falsification_criterion:
  - Any false negative below D = p.
  - The preimage assertion fires, indicating early reduction somewhere in the implementation.
  - The comparator disagrees with the nonzero-integer-weight support below threshold.
  - The failure fraction stays at zero above D = 3p, contradicting the modelled weight distribution.
  - Toy curve arithmetic cannot generate the intended candidate structures at the smallest primes.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-c80fdf
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - How to sweep total target degree without simultaneously changing chart structure is not fully
    specified here; a Coordinator must either accept chart count as a recorded covariate or require
    a construction that holds it fixed.
  - Whether the independent group-law comparator from EV-ALR-002 can be reimplemented in this environment,
    or must be reconstructed, needs confirmation before approval.
  - The correct weight model for the null arm, independent integers versus a model derived from gcd-degree
    statistics, is not settled and changes the predicted baseline; the contract should fix it before
    the run rather than after.
