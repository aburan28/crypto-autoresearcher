experiment:
  id: EXP-NTRUL-b69f49
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-2f344d; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-2f344d
  question_id: RQ-NTRU-9015ee
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Compute certified coefficient-to-canonical embedding distortion for the candidate NTRU ring
    polynomials with cyclotomic and clustered-root forced nulls, and convert it into a per-quantity
    cross-ring ambiguity budget
  objective: The uncertainty reduced is how much of any future cross-ring difference measured by this
    goal could be produced by the choice of coordinates alone. (i) Does the certified pipeline pass
    its two forced nulls, returning an interval containing exactly one for every cyclotomic polynomial
    and a large value for a deliberately clustered-root polynomial, since a pipeline that cannot return
    the forced value on a case where mathematics fixes the answer cannot be trusted on a case where
    it does not; (ii) how large is the certified distortion for the prime-degree irreducibles of the
    deployed shape at degrees 31, 61 and 127, reported as intervals with their widths so that a reader
    can see whether the number is resolved or merely bounded, and reported alongside the full singular-value
    spectrum because kappa alone hides whether the distortion is one outlier or a uniform spread;
    (iii) what per-quantity ambiguity does that distortion imply for the specific quantities this
    goal measures in coefficient coordinates, applying symbolically derived propagation rules so that
    the deliverable is an actionable floor rather than an abstract condition number. The run touches
    no lattice, no modulus and no reduction algorithm, and costs minutes, so it can precede any cross-ring
    campaign rather than being reconstructed afterwards to explain a result.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable claim: for the declared candidate polynomials,
      the certified distortion intervals and singular-value spectra are as tabulated, the forced nulls
      return their forced values, and the implied per-quantity ambiguity floors are as derived. What
      does NOT follow: nothing about which embedding is correct for NTRU; nothing about NTRU''s security
      or about any deployed parameter set; no claim that any existing measurement in this program
      is a coordinate artifact, since none has been made; and nothing about rings outside the declared
      candidate set.'
  inputs:
    procedure: 'STAGE 0, cost hours of implementation: implement rational interval arithmetic, certified
      complex root isolation with enclosure verification, and certified enclosures for extreme singular
      values of an interval matrix. STAGE 1, cost minutes: run the cyclotomic forced null at three
      degrees, requiring intervals containing one with width below the declared tolerance, and the
      clustered-root control, requiring a large kappa; gate everything on both. STAGE 2, cost minutes:
      independent verification of every root enclosure by evaluating the polynomial over the enclosure
      and checking the required conditions. STAGE 3, cost minutes to tens of minutes: compute certified
      kappa and the full spectrum for x^n minus one at two degrees and for prime-degree irreducibles
      at degrees 31, 61 and 127. STAGE 4, cost minutes: derive symbolically and verify on a synthetic
      example the propagation rules mapping log kappa into each measured quantity, then emit the per-quantity
      budget table. STAGE 5, cost capped: attempt degree 761 with a wall-clock cap, reporting completion
      or non-completion as a budget outcome under AGENTS.md rule 3 and never as a statement about
      the ring.'
    instrument: Pure Python 3 with the fractions module for exact rational interval endpoints; complex
      root isolation implemented directly, with enclosure verification by evaluating the polynomial
      over the enclosure; certified singular-value enclosures via an interval-respecting method on
      the Vandermonde Gram matrix, avoiding any external numerical library so that no unaudited floating-point
      path enters a certified number. All conventions, including the canonical-embedding normalisation,
      are declared in a configuration file committed with the contract. harness/runner.py wraps the
      run and records the configuration hash. No Sage.
    parameters: 'Candidate polynomials: three cyclotomics of degrees 32, 64 and 128 as the forced
      null; x^n minus one at n = 32 and n = 64; prime-degree irreducibles of the deployed shape at
      degrees 31, 61 and 127; one clustered-root polynomial of degree 32 as the opposite null; one
      degree-761 attempt with a wall-clock cap. Declared tolerance for the cyclotomic null: interval
      width below 1e-9 around one. Target interval width at degree 128: below 0.01 relative.'
  controls:
  - Cyclotomic forced null, kappa exactly one, gating the pipeline.
  - Clustered-root polynomial control, kappa large, confirming the pipeline can detect distortion.
  - Certified intervals throughout rather than floating-point values, so that every number carries
    a rigorous bound.
  - Independent verification of root enclosures by evaluating the polynomial at the enclosure endpoints
    and checking sign or modulus conditions.
  - Symbolic derivation of the per-quantity propagation rules checked against a synthetic example
    with a known answer.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The cyclotomic forced null: for every cyclotomic polynomial in the
    candidate set the pipeline must return a certified interval for kappa containing one and of width
    below a declared tolerance, because the Vandermonde of roots of unity is a scaled unitary matrix.
    This is a genuine null object of the same shape, a polynomial of the same degree run through the
    identical measurement, with a value forced by mathematics rather than by expectation. If the pipeline
    reports kappa away from one for a cyclotomic, every other entry in the table is void. A second
    null in the opposite direction: a deliberately badly conditioned polynomial with clustered roots,
    for which kappa must be large, confirming the pipeline can detect distortion at all rather than
    merely reporting one.'
  independent_variables:
  - defining polynomial within the declared candidate set
  - polynomial degree
  - working interval precision
  - measured quantity to which the budget is propagated
  metrics:
    primary:
    - certified interval for kappa per polynomial
    - certified extreme singular values
    - interval width per entry
    - per-quantity ambiguity floor after propagation
    - forced-null values for the cyclotomic and clustered cases
    secondary:
    - full singular-value spectrum shape per polynomial
    - root-enclosure verification pass rate
    - working precision required to reach the target interval width
    - wall-clock and completion status of the degree-761 attempt
  heuristic_under_test: null
  preregistered_prediction:
    quantity: kappa, the certified ratio of largest to smallest singular value of the normalised Vandermonde
      matrix of each candidate polynomial, and the per-quantity ambiguity floor derived from it.
    formula: 'kappa(P) = sigma_max(V) / sigma_min(V) where V is the normalised Vandermonde matrix
      of the complex roots of P, reported as a certified interval; the ambiguity floor for a rank-k
      covolume comparison across two rings is k * (log kappa_1 + log kappa_2) in the same log units,
      and for a norm ratio it is log kappa_1 + log kappa_2. Forced predictions: kappa exactly 1 for
      every cyclotomic; kappa at least 100 for the clustered-root control. Substantive prediction:
      kappa at least 1.5 for the degree-61 deployed-shape irreducible.'
    source: Pre-registered in the parent proposal IDEA-20260816-2f344d before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Degrees 31 to 128 for the certified table, with a capped attempt at degree 761
      which is a deployed-scale ring degree. The quantity computed is a property of a polynomial and
      involves no security claim, so degree is a cost parameter rather than a scope limit; the only
      transfer statement made is that a budget computed at degree 61 does not apply at degree 761,
      which is why the large-degree attempt exists and why its non-completion would be reported as
      a gap rather than papered over with an extrapolation.
    correspondence: null
  tail_checks:
  - The smallest singular value, where interval enclosures are loosest and where an ill-conditioned
    Vandermonde makes kappa hardest to certify.
  - Roots close to the unit circle or to each other, where enclosures must be tightest.
  - The largest degree attempted, where precision requirements may grow faster than budget.
  - Cyclotomic entries at the largest degree, where the forced value is hardest to certify tightly
    and where a pipeline weakness would first appear.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort if any cyclotomic forced null returns an interval excluding one.
  - Abort if the clustered-root control returns a small kappa.
  - Cap the degree-761 attempt in wall-clock and report non-completion as a budget outcome, never
    as a property of the ring.
  - Stop increasing working precision once the target interval width is met or a declared precision
    ceiling is reached, reporting which.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both forced nulls return their forced values, all root enclosures verify, and
    the certified kappa table plus the per-quantity ambiguity floors are emitted with interval widths
    attached, whatever the values.
  falsification_criterion:
  - A cyclotomic entry excluding one, voiding the table.
  - The clustered-root control returning a small kappa, showing the pipeline cannot detect distortion.
  - Interval widths so large that kappa is unresolved beyond a factor of two, making the budget unusable,
    which is reported as the result.
  - Root-enclosure verification failure on any entry.
  - Every non-cyclotomic candidate returning kappa below 1.05, refuting the premise that coordinate
    choice matters for these rings, a clean negative that licenses cross-ring comparison without a
    budget.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-2f344d
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The canonical-embedding normalisation convention must be declared and justified before the table
    is computed, since it moves every entry by a global factor.
  - The propagation rules mapping log kappa into each measured quantity are asserted for norm ratios
    and rank-k covolumes and must be derived and checked before the budget table is used as a gate.
  - The interval singular-value enclosure method is not specified in detail and its achievable tightness
    at degree 128 is unknown; a Coordinator should require a precision study before approval.
  - The exact defining polynomials standing in for the deployed shape must be written down and checked,
    since a misremembered polynomial would produce a correct number about the wrong ring.
