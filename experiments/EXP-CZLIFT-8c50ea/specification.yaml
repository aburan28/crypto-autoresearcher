experiment:
  id: EXP-CZLIFT-8c50ea
  hypothesis_id: H-CZLIFT-89e169
  source_idea: IDEA-20261009-105291
  question_id: RQ-CZLIFT-b9f765
  goal_id: GOAL-CZLIFT-1516d5
  version: 1
  title: 'Small points of E(K), K = Q(2^{1/3}), on the rank-0..5 ladder: cubic gain over E(Q) and coverage of E(F_p)
    at split primes'
  status: approved
  frozen: true
  designed_at: '2026-10-09'
  approved_by: coordinator
  approval_decision: DEC-20261009-575cd3
  execution_authorized: true
  status_note: Frozen at version 1 and approved 2026-10-09 by DEC-20261009-575cd3 under AGENTS.md 'Standing user
    authorization' and the user's request of 2026-10-09 to design and execute all accepted angles; driver and checker
    smoke-tested before freezing. Approval asserts nothing about H-CZLIFT-89e169.
  objective: Enumerate K-points x = alpha/d^2 with |coords(alpha)| <= hmax and d <= dmax by the exact square test
    in Z[theta]; record N_K(H), N_Q(H), the growth slope, and coverage against the uniform model at 12 split primes.
  inputs:
    curves:
    - 11a1
    - 37a1
    - 389a1
    - 5077a1
    - 234446a1
    - 19047851a1
    box:
      main:
        hmax: 32
        dmax: 4
      replication:
        hmax: 24
        dmax: 6
    split_primes: 12 primes p = 1 mod 3 with 2 a cube, between 101 and 5000
  controls:
  - 'The rational sub-count N_Q(H) (alpha with zero theta-coordinates) is the control: N_K >= N_Q always.'
  - Every recorded sample point is re-verified exactly in Z[theta] by the checker.
  - 11a1 (rank 0) must show no height dependence beyond its torsion over K at small heights.
  independent_variables:
  - curve
  - H
  - p
  metrics:
    primary:
    - cubic_gain_median
    - coverage_ratio_median
    - coverage_ratio_frac_above_1p5
    secondary:
    - growth.<curve>.slope_K
    - per-curve N_K and N_Q tables
  heuristic_under_test: null
  preregistered_prediction:
    quantity: cubic_gain_median, coverage_ratio_median, coverage_ratio_frac_above_1p5
    formula: cubic_gain_median in [1, 4]; coverage_ratio_median in [0.8, 1.2]; frac above 1.5 < 0.05; on both boxes
    source: H-CZLIFT-89e169 predictions
  scale_relevance:
    tier: toy
    justification: tested parameters as listed under inputs; no crypto-scale statement
    correspondence: null
  tail_checks:
  - every per-run primary metric is recorded so a near-miss on one seed can be compared with the other
  replication:
    seeds: []
    independent_instances: 2
    replication_note: two trials; a prediction counts only if it holds on both
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1
  stopping_rules:
  - Stop after the two planned trials have output_validated receipts.
  - A crash or timeout is failed_infrastructure; never a metric value.
  invalidation_rules:
  - The checker cannot reproduce its re-run subset from the recorded inputs.
  success_criterion: 'On both trials: cubic_gain_median in [1, 4], coverage_ratio_median in [0.8, 1.2], coverage_ratio_frac_above_1p5
    < 0.05.'
  falsification_criterion: On both trials cubic_gain_median > 4 or coverage_ratio_median outside [0.8, 1.2].
  decision_impact:
    on_positive: H-CZLIFT-89e169 moves to supported after review; the cubic-field count joins the global-lift obstruction
      record at degree 3.
    on_negative: A cubic gain above 4 or a coverage excess opens a larger-box follow-up with a red-team card.
  required_artifacts:
  - experiments/EXP-CZLIFT-8c50ea/runs/<RUN-ID>/manifest.yaml
  - experiments/EXP-CZLIFT-8c50ea/runs/<RUN-ID>/raw-result.json
  - experiments/EXP-CZLIFT-8c50ea/runs/<RUN-ID>/command.txt
  - experiments/EXP-CZLIFT-8c50ea/runs/<RUN-ID>/environment.json
  - experiments/EXP-CZLIFT-8c50ea/runs/<RUN-ID>/stdout.log
  - experiments/EXP-CZLIFT-8c50ea/runs/<RUN-ID>/stderr.log
  launcher:
    trial_plan: experiments/EXP-CZLIFT-8c50ea/trial-plan.json
    driver: experiments/EXP-CZLIFT-8c50ea/implementation/run.py
    checker: experiments/EXP-CZLIFT-8c50ea/implementation/check.py
    library:
    - harness/czlift_cubic.py
    - harness/czlift_run.py
  assigned_to: executor
  out_of_scope:
  - Any claim about a deployed curve.
