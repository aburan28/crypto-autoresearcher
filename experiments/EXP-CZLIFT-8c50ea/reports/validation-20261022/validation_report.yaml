    dropped_points_main: '9 x-values, all non-rational, all with a d = 2 or d = 3 denominator (the ramified primes;
      x has valuation -2 at the prime above 2 or 3): 37a1 x3, 5077a1 x5, 234446a1 x1'
    dropped_points_replication: The same 8 gcd drops that fall within H <= 24, plus 7 points with d = 5 (rational
      9/25, 6/25, 21/25, -14/25 and 24/25; two non-rational on 37a1). The latter never enter because d^2 = 25 > 24.
    verdict: breaks (definition)
    rows: j2_recompute_output.json part2_enumeration.<run>.curves.<curve>.by_H and x_in_spec_not_inferred_at_hmax;
