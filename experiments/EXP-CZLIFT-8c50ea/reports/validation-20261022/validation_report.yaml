  blind_rederivation:
    joint: J3
    sealed_before_blind_from: true
    seal: experiments/EXP-CZLIFT-8c50ea/reports/validation-20261022/blind/SHA256SUMS (sealed_at_utc 2026-10-22T08:42:11Z;
      re-verified with sha256sum -c after phase 2)
    sealed_sha256:
      blind/blind_points.py: c85584ff03635d087966914a1aa02a5b44017de222e4cb387a1c9f897229bf8e
      blind/blind_points_output.json: e2bf5488c346b088410665c368b995f39afa42e1e1273471528469ef6c69eca8
      blind/blind_points_stdout.log: 619edb36ff487424def4a7685602b676f4f79970fe3dd6a1438ef511e3864676
      blind/blind_interpretation.yaml: 67480e1b92f3cbc5e781a7fd6c91fd6e0ad25a1eeb65fa389209dfb0d6176c72
    method: G = d^6 f(alpha/d^2) is tested as a square in Z[theta] (the maximal order, disc -108) by two independent
      exact tests. Test A uses embedding candidates with exact int64 verification. Test B uses a norm filter plus
      characteristic-polynomial reconstruction with exact integer roots. The two agree on every (alpha, d) in both
      boxes, and every accepted point is re-verified on the Weierstrass equation in exact arithmetic over K.
    readings_sealed: Both boxes were sealed, because neither contains the other and "smallest setting" is ambiguous; the
      replication box has the smaller hmax and fewer candidates. Four count units were sealed (distinct x, affine
      points, points with O, (alpha, d) pairs), and each point carries min_h and min_d, so any H ladder can be rebuilt.
    sealed_values_points_with_O:
      11a1: {h32_d4: [5, 5], h24_d6: [5, 5]}
      37a1: {h32_d4: [33, 15], h24_d6: [39, 17]}
    recorded_values_N_K_N_Q_at_hmax:
      11a1: {RUN-CZLIFT-e7147a: [5, 5], RUN-CZLIFT-d6996f: [5, 5]}
      37a1: {RUN-CZLIFT-e7147a: [27, 15], RUN-CZLIFT-d6996f: [27, 15]}
    unit_match: The recorded unit is affine points (+-y) plus O; 11a1's 1 -> 3 -> 5 fixes it. Under that unit the
      sealed values are the ones shown.
    disagreement:
      37a1_h32_d4: N_K 33 sealed vs 27 recorded (difference 6). Three K-points are missing (x = -theta/2,
        theta^2 - theta/2, -(theta + theta^2)/3). N_Q agrees at 15.
      37a1_h24_d6: N_K 39 vs 27 (difference 12) and N_Q 17 vs 15 (difference 2). The same three points are missing,
        plus three d = 5 points (x = 21/25, (3 + theta - 8 theta^2)/25, (-8 - 11 theta + 13 theta^2)/25).
      11a1: agrees on both boxes.
    hand_check: For 37a1 (y^2 + y = x^3 - x), x = -theta/2 and y = (theta^2 - 1)/2 give
      y^2 + y = (2 theta - 1)/4 = x^3 - x, so the point is genuine. With alpha = -2 theta and d = 2,
      G = 16 theta^4 = (4 theta^2)^2.
    localisation: The sealed computation was compared with the producer's code only after the seal. Each missing point's
      minimal (alpha, d) passes the producer's own exact_sqrt (j2_borderline_output.json). The point is lost either
      because search_points skips gcd(c0,c1,c2,d) != 1 (harness/czlift_cubic.py:97) or because
      height() = max(|coords|, d^2) > H (:114). The specification's box is |coords(alpha)| <= hmax and d <= dmax, with
      no primitivity condition and no d^2 in the height.

