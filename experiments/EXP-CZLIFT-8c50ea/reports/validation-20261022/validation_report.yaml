  joint_summaries:
    J1: Custody is complete. Every artifact hash in both execution receipts and the ledger archive receipt recomputes.
      Command, revision, dirty flag, environment and the absence of seeds all agree with the frozen plan, and both
      planned trials are present exactly once.
    J2: >-
      The arithmetic from raw-result.json reproduces under the code's own definitions. The recorded quantities do not
      match the frozen definitions. (a) The point counts drop genuine K-points: a gcd(c0,c1,c2,d) = 1 skip at
      harness/czlift_cubic.py:97 removes points with denominators at the ramified primes 2 and 3, and a height
      max(|coords|, d^2) at :114 leaves dmax = 6 unused at H <= 24. (b) coverage_ratio_median is the upper middle
      element, not the median. (c) As a result, the replication trial is a strict sub-computation of the main trial,
      not an independent instance. The success and falsification outcomes do not change under the specification's
      definitions.
    J3: The sealed blind count for 37a1 disagrees with the recorded count on both boxes (33/15 vs 27/15 on hmax 32,
      dmax 4; 39/17 vs 27/15 on hmax 24, dmax 6). 11a1 agrees (5/5).
    PTM-1: On both boxes the 11a1 count is flat at 5, which equals E(K)_tors = Z/5 (proved below), and K = Q at every H.
      The control can detect only over-acceptance of non-points. It is structurally blind to the under-counting defect
