  control_checks:
  - control: 'The rational sub-count N_Q(H) is the control: N_K >= N_Q always.'
    result: holds
    detail: Holds at every H, for every curve, in both runs from raw, and under the specification box.
  - control: Every recorded sample point is re-verified exactly in Z[theta] by the checker.
    result: holds
    detail: All 54 points_sample rows per run (at most 10 per curve, lowest height first) are exact squares by my own
      Z[theta] arithmetic, not the producer's. Raw records only these samples, not the full point list, so distinct
      counts cannot be recomputed from raw alone; I recomputed them from my own enumeration.
  - control: 11a1 (rank 0) must show no height dependence beyond its torsion over K at small heights.
    result: holds
    detail: N_K = N_Q at every H. The count is 1, 1, 3, 3, 5, 5, (5); all growth is the two torsion x-values 5 and 16,
      and nothing else enters on either box. See PTM-1.
  - control: 'Invalidation rule: the checker cannot reproduce its re-run subset from the recorded inputs.'
    result: not_triggered
    detail: >-
      I evaluated the rule as written, as equality. The re-run subset (37a1, hmax 4, dmax 2) gives counts_K 4 = 19
      and counts_Q 4 = 11, equal to the recorded values in both runs. The checker itself only tests fresh <= recorded
      (check.py:33), which cannot detect an under-reproduction. The checker is not independent: it imports the
      producer's driver and harness. Running it myself returns rc 0 and "check ok" on both run directories.
  - control: replication (independent_instances 2; a prediction counts only if it holds on both)
    result: breaks
    detail: The replication run's counts_K, counts_Q and all 432 coverage cells are identical to the main run's at every
      shared H for all six curves. Because height() includes d^2, d <= 4 at every H <= 24, so dmax = 6 is never
      reached. The replication is a strict sub-computation of the main trial, not an independent instance.
  - control: stopping rules and budget
    result: holds
    detail: Two output_validated receipts exist and there was no crash or timeout. 2 runs were used of an advisory 4;
      wall times are far below 3600 s.
  - control: producer re-run
    result: holds
    detail: driver.measure_curve for 11a1 and 37a1 at hmax 24, dmax 6 with the recorded primes reproduces the raw
      records byte-for-byte after JSON round-trip (j2_addendum_output.json).

  proves_too_much:
  - id: PTM-1
    object: The rank-0 curve 11a1 over K.
    expected_failure_signature: The count on 11a1 must stay flat across the boxes; growth means the K-search accepts non-points.
    observed: 'N_K at hmax is 5 on both boxes (recorded and sealed blind), with K = Q at every H. Within each H ladder
      the count is 1 -> 3 -> 5. The steps are exactly the torsion points (5, 5), (5, -6) entering at H >= 5 and
      (16, 60), (16, -61) at H >= 16.'
    torsion_proof: >-
      5 is unramified in K; x^3 = 2 has the root 3 mod 5, so there is a degree-one prime above 5; 11a1 has
      good reduction at 5 and #E(F_5) = 5. Torsion injects there (p = 5 > e + 1), so E(K)_tors has order dividing 5,
      and E(Q)_tors = Z/5 gives E(K)_tors = Z/5. The gcd of #E(F_p) over degree-one primes 5..47 is 5.
    verdict: holds
    capability_note: The known-false conclusion is established only within the tested boxes. My exhaustive search
      (two exact methods) finds no non-torsion K-point of 11a1 in either box, but no artifact here computes the rank of
      11a1 over K. More important, the object can show only an over-acceptance failure. 11a1 has no non-rational
      K-points in either box, so a search that drops genuine points (the J2/J3 defect) leaves its count flat. PTM-1
      therefore cannot see the defect that was present. A control for that failure mode needs a curve with known K-points
      of valuation -2 at a ramified prime, such as 37a1 at x = -theta/2.

  null_object_checks:
  - quantity: coverage ratio (distinct residues / uniform-model expectation)
    same_shape_null: For each counted cell, I drew n_points uniform samples (with replacement) from a set of size N_p,
      over 1000 trials (seed 20261022), and took each trial's median across cells. The median of those trial medians is
      1.00477 (2.5-97.5 percent range 1.00433-1.00538). frac_above_1p5 and frac_below_0p5 were 0 in every trial.
    observed: Medians are 1.00773 (main) and 1.00743 (replication), above the null band. 273 of 300 and 221 of 240 cells
      have no collision, so the small K-points collide less often than uniform draws, which is the opposite of excess.
    can_the_instrument_detect_excess: >-
      No. Because distinct <= n_points, a cell's ratio is at most
      n / (N_p (1 - (1 - 1/N_p)^n)), which is at most 1.3089 (main) and 1.2632 (replication). frac_above_1p5 is
      therefore 0 for every possible point set. The median's upper edge 1.2 is also unreachable: if every cell were
      injective the median would be 1.00820 / 1.00785. Only a deficit, meaning heavy collisions below 0.8, could move
      the criterion.
    decay_statement: As p grows with the box fixed, the ceiling tends to 1, so the ratio tends to 1 for any point set
      and the statistic loses all discriminating power. Neither the frozen contract nor the run records state what the
      ratio should do as p increases. Per docs/inventor-protocol.md section 3 this is unaddressed.

  heuristic_validation_checks:
  - check: pre-registered prediction
    result: pass
    detail: The H-CZLIFT-89e169 predictions and the specification's preregistered_prediction were frozen at b553f64e3a
      (22:35:28Z), before the runs (22:44:33Z). The hypothesis file hash 375c7be2... equals the snapshot-receipt value
      and is unchanged since. heuristic_under_test is null.
  - check: sample integrity
    result: fail
    detail: >-
      This is a deterministic enumeration with no seeds. The enumerated set is not the frozen box: it omits
      genuine K-points (J2), and the replication box collapses into the main box. The sample procedure is in the code,
      but the manifest does not declare it.
  - check: correspondence validity
    result: not_applicable
    detail: No substitute sampler is used. Reduction at a split prime uses one of the three degree-one primes (the
      smallest cube root), a choice the contract does not make; the medians vary by at most 0.0009 across roots.
  - check: scale binding
    result: pass
    detail: The tier is toy; parameters are recorded in the manifests; no crypto-scale statement is made.

  cost_model_checks: []   # no cost table or cost claim in this experiment
  proof_architecture_checks: []   # not a proof-oriented task

  plan_specification_contradictions:
  - The J1 statement names "every manifest files_sha256 entry", but the manifests have no such block. I followed the
    specification's artifacts and checked the receipt bindings.
  - The J2 statement says "on both seeds", but the specification has seeds [] and two deterministic trials. I followed
    the specification.
  - The blind statement's "height box at its smallest setting" is ambiguous, because the two boxes are not nested. I
    sealed both.
  - The PTM-1 statement says "flat across the boxes", while the specification control says "no height dependence
    beyond its torsion". The count is flat across boxes and steps within each H ladder only by torsion. Both readings
    are reported.
  - 'The specification and the implementation contradict each other (the material one): the specification objective
    is "|coords(alpha)| <= hmax and d <= dmax". The implementation applies gcd(c0,c1,c2,d) = 1 and
    height = max(|coords|, d^2), and run.py''s own docstring restates the specification''s box. I followed the
    specification and sealed both readings (blind/ and j2_recompute_output.json).'

  verdict: failed
  verdict_basis: >-
    Custody holds (J1). The receipts are complete, bound and reproducible: the producer's code re-runs to
    identical bytes. But the recorded load-bearing quantities are not the frozen ones (J2), and they disagree with the
    sealed blind re-derivation (J3). N_K omits genuine K-points with ramified-prime denominators; dmax = 6 of the
    replication box is unused, so the replication is not an independent instance; and the coverage median is an
    upper-middle element. On the specification's definitions every success criterion still holds on both trials
    (cubic_gain_median 1.3830 / 1.3721, coverage median 1.0080-1.0089, frac above 1.5 = 0, max per-curve gain 2.294)
    and no falsification condition triggers. The failure is therefore in what the receipts record, not a reversal of
    the outcome. The remedy is an amendment or re-run with a corrected implementation, never an in-place repair. This
    report is a validation outcome only. It does not support or weaken H-CZLIFT-89e169, changes no status, and
    authorizes nothing.

  limitations:
  - The rank of 11a1 over K is not determined, so PTM-1's known-false conclusion is verified only inside the tested
    boxes.
  - Raw results hold only 10 sample points per curve. The full point sets and the distinct counts were recomputed from
    my own enumeration (two exact square tests that agree), not read from the run records.
  - Peak memory is not recorded and no runtime lock exists. The dispatch queue (dispatch_plan_sha256 bd0520a0...) is
    outside my read scope and was not verified.
  - 'Compute was kept modest: one process at nice 10. Blind enumeration took 14 s (11a1, 37a1, both boxes); the J2
    enumeration of all six curves and both boxes took 55 s; the producer re-run (11a1, 37a1 at hmax 24, dmax 6) and
    checker took 20 s. I did not re-run the producer''s full six-curve main-box search; the recorded counts were
    reproduced by my own enumeration instead.'
  - >-
      tools/check_review_independence.py will report the phase-2 reads of blind_from paths (implementation, harness,
      raw-result.json) as a leak. This plan assigns both phases to one task without a blind-phase split. The evidence of
      ordering is the seal: blind/SHA256SUMS, sealed 2026-10-22T08:42:11Z before the first phase-2 read, and re-verified
      afterwards. The seal time is self-recorded until the ledger archive commit binds it.
  - 'Interpretation joints are not owned here (PD-1, no red team): what these measurements mean for H-CZLIFT-89e169,
    and whether the coverage statistic can bear the claim, stay open for review-evidence.'

  artifact_paths:
