experiment:
  id: EXP-LHW-b49bc6
  hypothesis_id: H-LHW-e54b1b
  question_id: RQ-LHW-1877bb
  source_idea: IDEA-20260930-79abd9
  goal_id: null
  goal_id_note: >-
    RQ-LHW-1877bb has goal_ids []. Do not edit GOAL-ECDLP2M-001.yaml.
  predecessor_experiment_id: EXP-LHW-44a6ec
  predecessor_hypothesis_id: H-LHW-90bf21
  predecessor_note: >-
    EXP-LHW-44a6ec is the floor-square bound check for IDEA-20260930-750de2
    and forbids walks. This contract is a different idea (79abd9) and does
    not re-run 44a6ec.
  version: 1
  title: >-
    Stage-0 integer frontier freeze and Stage-1 dual-route millirho of
    W(m,w)+J_T versus matched random W' on four hash-realisable families
  status: approved
  approved_by: DEC-20261003-1c5b5a
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261003-1c5b5a under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    cryptographic-m attack. Stage 2 tables not authorized.
  approval:
    approved_by: DEC-20261003-1c5b5a
    composing_decision: DEC-20261003-1c5b5a
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes integer binomials, primes, millirho gates, T_GRID.
      Stage 1 counts |X+J| with twin bitmaps and writes exactly one O-* label.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide E1 vs E2 vs inconclusive for translation-walk sumset millirho on
    the frozen six-cell ladder under twin agreement and W_ap control.

  class: heuristic_validation
  class_note: >-
    Pre-registered millirho gates on an integer sumset instrument. Not an
    exponent-moving breakthrough; no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Dual-route freeze of C(m,w), next prime > 2^{m+2}, millirho
        gates 2000/8000, T_GRID, alpha gap 11/100; write hashed table.
      - >-
        Stage 1. For six cells and four families, ten walks per T in
        T_GRID, count |W+J|, |W'+J|, |W_ap+J|, decay ladder on Jd T=1024;
        emit exactly one O-* label.
    excluded:
      - Re-running EXP-LHW-44a6ec floor-square products.
      - Stage 2 R3/R4 tables, planted ECDLP, or elliptic consistency arm.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Editing IDEA-20260930-79abd9 claim text or GOAL-ECDLP2M-001.yaml.
      - Editing millirho gates after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.

  execution_surface:
    trial_plan: experiments/EXP-LHW-b49bc6/trial-plan.json
    command_stage0: >-
      python3 experiments/EXP-LHW-b49bc6/implementation/run.py --stage 0
      --trial-plan experiments/EXP-LHW-b49bc6/trial-plan.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-LHW-b49bc6/implementation/run.py --stage 1
      --trial-plan experiments/EXP-LHW-b49bc6/trial-plan.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. Twin bitmaps are the
      dual-implementation control. {run_dir} substituted by supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20260930-79abd9.yaml
    hypothesis: ledger/hypotheses/H-LHW-e54b1b.yaml
    cells: [[20, 2], [20, 3], [20, 5], [24, 3], [24, 4], [24, 6]]
    binom_20_2: 190
    binom_24_6: 134596
    e1_max_millirho: 2000
    e2_min_millirho: 8000
    t_grid: [16, 64, 256, 1024, 4096]
    walk_seed0: 2026100310
    wprime_seed0: 2026100320
    l20: 4194319
    l24: 67108879

  controls:
    - name: twin_card_sumset
      definition: route_a.card_sumset_a == route_b.card_sumset_b on every counted X+J
    - name: ctl_frozen_gates
      definition: millirho gates and T_GRID frozen in stage0/preregistered-predictions.json
    - name: ctl_binom_prime_freeze
      definition: Dual-route C(m,w) and next-prime match freeze.py integers
    - name: null_Wprime
      definition: Five W' of size |W| (blocking random-set null)
    - name: nearby_Wap
      definition: Arithmetic progression of size |W|; millirho ≥ 8000 at T=1024 Jd
    - name: decay_Wq
      definition: q_pct in {0,25,50,75,100}; monotone nonincreasing when millirho(q=0)>1000
    - name: ctl_no_posthoc_gate_edit
      definition: E1/E2 millirho integers are not edited after Stage 0
    - name: ctl_not_44a6ec_rerun
      definition: This card does not re-run EXP-LHW-44a6ec

  independent_variables:
    - name: stage
      levels: [0_integer_freeze, 1_millirho_sumsets]
    - name: cell
      levels: ['(20,2)', '(20,3)', '(20,5)', '(24,3)', '(24,4)', '(24,6)']
    - name: family
      levels: [Ja_radding, Jb_signed_bits, Jc_exchanges, Jd_unit]
    - name: T
      levels: [16, 64, 256, 1024, 4096]

  metrics:
    primary:
      - name: median_millirho
        unit: millirho
        definition: 1000 |W'+J| // |W+J| median over 10 walks and 5 W'
      - name: twin_agreement
        unit: boolean
      - name: wap_control_pass
        unit: boolean
    secondary:
      - name: card_W_plus_J
        unit: integer
      - name: card_J
        unit: integer
      - name: decay_millirho
        unit: millirho
      - name: wall_clock_seconds
        unit: seconds
      - name: peak_rss_bytes
        unit: bytes

  heuristic_under_test: HEUR-LHW-79abd9-H2

  preregistered_prediction:
    quantity: >-
      Median millirho versus W' is ≤ 2000 at all T≥64 for all families
      (E1) OR ≥ 8000 at T=1024 and rising at T=4096 on ≥2 cells (E2).
    formula: >-
      millirho = 1000 * |W'+J_T| // |W+J_T| at |W'|=|W|; J_T = distinct
      partial sums of a keyed-hash walk of length T.
    source: >-
      IDEA-20260930-79abd9 metrics M2/M3; frozen before Stage 1 in
      stage0/preregistered-predictions.json. Integer gates 2000 and 8000
      are the IDEA's rho≤2 and rho≥8 multiplied by 1000.

  scale_relevance:
    tier: toy
    justification: >-
      Exact bitmaps at m∈{20,24} only. No transfer of millirho into a
      cryptographic preprocessing exponent is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids millirho claims (O-ARTIFACT).
    - W_ap millirho < 8000 at T=1024 Jd → O-ARTIFACT.
    - Post-hoc gate edit → protocol invalid.

  seeds_and_replication:
    walk_seed0: 2026100310
    wprime_seed0: 2026100320
    walk_count: 10
    wprime_count: 5
    independent_instances: 6
    note: >-
      Six (m,w) cells are independent instances. Twin bitmaps are the
      replication instrument for each |X+J|.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4.0
    maximum_memory_gb: 4
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and frontier-table.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-LHW-e54b1b.
    - maximum_runs = 4.
    - Do not open Stage-2 under this card.
    - Do not re-run EXP-LHW-44a6ec.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure → O-ARTIFACT; do not read millirho as E1/E2.
    - E1/E2 without W_ap control → protocol invalid.
    - Re-running EXP-LHW-44a6ec under this card → protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming a cryptographic-m exponent move → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok on binomials and primes; Stage 1
    produces millirho panels and exactly one O-E1 / O-E2 / O-INCONCLUSIVE
    / O-ARTIFACT / O-IMPEDIMENT label in RESULTS.md with cited artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; post-hoc gate edit; E1/E2 without W_ap
    control; a claimed break/exponent under this card. (O-E1 is a valid
    scientific negative of O-E2, not a protocol fail.)

  required_artifacts:
    - experiments/EXP-LHW-b49bc6/trial-plan.json
    - experiments/EXP-LHW-b49bc6/trial-plan-v1.json
    - experiments/EXP-LHW-b49bc6/stage0/preregistered-predictions.json
    - experiments/EXP-LHW-b49bc6/stage0/frontier-table.json
    - experiments/EXP-LHW-b49bc6/stage1/panels.json
    - experiments/EXP-LHW-b49bc6/stage1/control-table.json
    - experiments/EXP-LHW-b49bc6/RESULTS.md
    - experiments/EXP-LHW-b49bc6/runs/<RUN-LHW-*>/
    - experiments/EXP-LHW-b49bc6/implementation/run.py
    - experiments/EXP-LHW-b49bc6/implementation/check.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
