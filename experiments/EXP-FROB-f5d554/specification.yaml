experiment:
  id: EXP-FROB-f5d554
  hypothesis_id: H-FROB-fcc539
  idea_id: IDEA-20260918-9abf42
  version: 1
  title: Divisor lattice of T^n + 1 and the n=7 stable-subspace count
  status: approved
  objective: >-
    Decide whether the frozen factor-degree table of H-FROB-fcc539 is
    reproduced by an independent factorization, and whether the n=7
    subspace enumeration matches that row.
  inputs:
    polynomial: T^n + 1 over F2
    rows:
      - {n: 7, order: 3, f: 3, divisors: 8, degrees: [1, 3, 3]}
      - {n: 11, order: 10, f: 2, divisors: 4, degrees: [1, 10]}
      - {n: 13, order: 12, f: 2, divisors: 4, degrees: [1, 12]}
      - {n: 17, order: 8, f: 3, divisors: 8, degrees: [1, 8, 8]}
      - {n: 19, order: 18, f: 2, divisors: 4, degrees: [1, 18]}
      - {n: 23, order: 11, f: 3, divisors: 8, degrees: [1, 11, 11]}
      - {n: 29, order: 28, f: 2, divisors: 4, degrees: [1, 28]}
      - {n: 31, order: 5, f: 7, divisors: 128, degrees: [1, 5, 5, 5, 5, 5, 5]}
      - {n: 37, order: 36, f: 2, divisors: 4, degrees: [1, 36]}
      - {n: 41, order: 20, f: 3, divisors: 8, degrees: [1, 20, 20]}
      - {n: 43, order: 14, f: 4, divisors: 16, degrees: [1, 14, 14, 14]}
      - {n: 131, order: 130, f: 2, divisors: 4, degrees: [1, 130]}
    n7_dimension_set: [0, 1, 3, 4, 6, 7]
    n131_complementary_degrees: [0, 1, 130, 131]
    n31_required_intermediate: 5
    composite:
      n: 9
      factor_degrees: [1, 2, 6]
      divisors: 8
      prime_formula_applies: false
    enumeration:
      n: 7
      modulus: x^7 + x + 1
      map: squaring
      expected_count: 8
  controls:
    - >-
      n=7 is computed twice, by factorization and by enumerating every
      squaring-stable subspace. Disagreement invalidates the run.
    - >-
      n=9 is composite. The prime formula does not apply. The factorization
      must report degrees 1, 2 and 6.
    - >-
      n=31 must contain complementary degree 5. The run records that
      intermediate degrees exist at that prime.
    - >-
      Every odd-n factorization reports gcd(T^n + 1, T^(n-1)) = 1.
  independent_variables:
    - n in the frozen row list, plus n=9
  metrics:
    primary:
      - factor_degree_multiset_by_n
      - n7_enumerated_count
      - n131_complementary_degrees
    secondary:
      - n31_contains_degree_5
      - n9_divisor_count
      - separable_flag_by_n
  heuristic_under_test: null
  preregistered_prediction:
    quantity: factor degrees of T^n + 1 and the n=7 stable-subspace count
    formula: >-
      For each odd prime row, f = 1 + (n-1)/ord_n(2), the factor degrees are
      one 1 and (f-1) copies of the order, and the divisor count is 2^f.
      Complementary degree of a divisor g is n - deg g. At n=131 the
      complementary degrees are 0, 1, 130, 131. At n=7 the enumeration
      finds 8 stable subspaces with dimension set {0, 1, 3, 4, 6, 7}.
      At n=9 the degrees are 1, 2, 6.
    source: >-
      IDEA-20260918-9abf42 table, recomputed by distinct-degree factorization
      while this contract was frozen. That recomputation is not an experiment
      run.
  scale_relevance:
    tier: toy
    justification: >-
      The largest factorization has degree 131. The only subspace enumeration
      is in a field of 128 elements. No transfer to a solving-stage cost or
      to a curve discrete logarithm is assumed.
    correspondence: null
  tail_checks:
    - >-
      n=31 includes degree 5. A universal claim of no intermediate stable
      degree fails at that single row.
    - >-
      n=23 and n=43 are required rows. Their f values are neither 2 nor the
      maximum in the table.
  replication:
    seeds: []
    independent_instances: 13
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after the listed factorizations, the separability gcds, and the n=7 enumeration.
    - Do not build a Macaulay matrix or a fall-degree comparison.
  invalidation_rules:
    - The n=7 enumeration and the n=7 factorization disagree.
    - A factor degree is reported from a floating-point computation.
    - n=9 is forced through the prime formula.
    - A row from the frozen list is omitted.
  success_criterion: >-
    The run is valid. Every prime row matches its frozen factor degrees,
    divisor count, and order. The n=7 enumeration finds 8 stable subspaces
    with dimension set {0, 1, 3, 4, 6, 7}. n=131 has complementary degrees
    exactly {0, 1, 130, 131}. n=31 includes degree 5. n=9 has degrees
    1, 2 and 6.
  falsification_criterion: >-
    The run is valid and some odd prime row has a factor-degree multiset
    different from the frozen row, or n=131 has a complementary degree
    outside {0, 1, 130, 131}.
  required_artifacts:
    - experiments/EXP-FROB-f5d554/runs/<RUN-ID>/command.txt
    - experiments/EXP-FROB-f5d554/runs/<RUN-ID>/factors.json
    - experiments/EXP-FROB-f5d554/runs/<RUN-ID>/stdout.txt
    - experiments/EXP-FROB-f5d554/runs/<RUN-ID>/stderr.txt
  assigned_to: executor
  approved_by: coordinator
  approval:
    decision_id: DEC-20261005-40d363
    basis: >-
      AGENTS.md standing user authorization of 2026-09-06. This record
      freezes the counting self-test. It does not start the executor.
    not_launched_because: >-
      GOAL-ECDLP2M-001 next_action names TASK-20261005-34c6e8 and opens no
      batch. Dispatch of TASK-20261005-8ed060 waits for a Coordinator
      decision that releases this experiment.
