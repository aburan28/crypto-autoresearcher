experiment:
  id: EXP-ECDLP-97a533
  hypothesis_id: H-ECDLP-a6d66b
  version: 1
  title: >-
    Three-phase verification protocol for the Weil-descent plus polynomial-method
    row in multivariate signature cost tables, with the literature phase HARD-
    BLOCKING the cost table under RQ-MQOM-001 constraint 1, and with the only
    genuinely measurable arm being the linear independence of the descended
    components
  status: draft
  objective: >-
    NOT AN ECDLP EXPERIMENT. The object is multivariate quadratic system
    solving for NIST Additional-Signature candidates; the "ECDLP" token in this
    contract's pre-allocated identifier is a naming artifact from the
    dispatching handoff's mislabelling and carries no scope.
    Establish, in a fixed order that cannot be reordered, three things. PHASE A,
    whether KN-LIT-3290 can be obtained at all and, if so, what its time and
    memory exponents and stated regime of validity actually say when read
    verbatim. PHASE B, whether this program's cost model can reproduce one
    published security row from a specification's own formula with exact integer
    agreement. PHASE C, whether the Weil descent implementation produces
    e*N linearly INDEPENDENT equations, which is the one quantity in the whole
    proposal that is neither forced by algebra nor read from a page. PHASE D,
    the cost table, is HARD-BLOCKED until Phase A completes with a verbatim
    reading, per RQ-MQOM-001 constraint 1.
    Phases A and B are verification protocols in the handoff's sense, they check
    an artifact against a reference and have a stated failing result. Phase C is
    a measurement with a planted defect.
  inputs:
    phase_a_source: >-
      KN-LIT-3290, Itai Dinur, "Cryptanalytic Applications of the Polynomial
      Method for Solving Multivariate Equation Systems over GF(2)". The corpus
      entry names local copies at "downloads/126960280 (1).pdf" and
      "downloads/126960280.pdf"; IDEA-20260808-51e40f reports neither was
      present on any filesystem reachable from its session. The Executor must
      locate or re-obtain the source and record exactly what it did.
    phase_b_sources: >-
      Round-3 specifications of MQOM, UOV, MAYO, SNOVA and QR-UOV. RQ-MQOM-001
      records that the Round-3 specification bundle has NOT been read by this
      program and that the primary NIST pages are unreachable from this harness
      under proxy CONNECT 403.
    phase_c_instances: >-
      Symbolic Weil descent at (q, N) = (16, 6) and (16, 8), that is e = 4, for
      100 random keys of each scheme shape, plus at least one PLANTED key whose
      descended system carries a known number of forced dependencies.
    phase_d_grid: >-
      Per published parameter set, the determined subsystem size N reached by
      the published attack, N_2 = N*log2(q) for q a power of 2, four candidate
      costs in BIT operations under one stated cost model, and the memory of
      each, at omega = 2 and omega = 2.81, at unbounded memory and at a
      2^80-bit cap.
  controls:
    - >-
      UNITS CONTROL, BLOCKING, RUN BEFORE ANY NEW ROW. Reproduce one published
      security row from the specification's own formula and require EXACT
      INTEGER agreement. A cost model that cannot reproduce the published
      number is not entitled to beat it.
    - >-
      ODD-q NEGATIVE CONTROL, FORCED VALUE. QR-UOV at odd q must return
      "descent inapplicable" and no delta. A pipeline that produces a delta at
      odd q is broken. The forced value makes this an instrument check, not
      evidence.
    - >-
      q = 256 SIGN CONTROL. UOV must show the polynomial method LOSING at
      omega = 2. A method that wins everywhere is not tracking the field size,
      which is the canonical artifact tell here.
    - >-
      DESCENT DEGENERACY CONTROL, FORCED VALUE. At e = 1, q = 2, the descent
      must be the identity map and the cost formula must reduce exactly to the
      undescended one.
    - >-
      PLANTED DEPENDENCY OF KNOWN SIZE, BLOCKING FOR PHASE C. Construct a key
      whose F_{2^e}-quadratic is chosen so that its descent carries exactly one
      forced linear dependency among the e components. The rank checker must
      report e*N - 1, not e*N. A checker that reports full rank on a planted
      deficiency cannot detect a real one and voids every zero it reports.
    - >-
      MEMORY-CAP CONTROL. The whole table recomputed at a 2^80-bit cap. Every
      row that wins only at unbounded memory is labelled as such IN THE TABLE,
      not in a footnote.
  independent_variables:
    - scheme, MQOM, UOV, MAYO, SNOVA, QR-UOV
    - field size q, powers of two and odd q as the negative control
    - omega, 2 and 2.81, both mandatory
    - memory cap, unbounded and 2^80 bits
    - descent size, (q, N) = (16, 6) and (16, 8) for Phase C
  metrics:
    primary:
      - >-
        c and c_mem, dimensionless exponents read VERBATIM from KN-LIT-3290,
        together with the paper's stated regime of validity, or the recorded
        outcome NOT OBTAINED
      - >-
        linear-dependency rate among the e components of each descended
        equation, dimensionless, over 100 random keys per size
      - >-
        units-control agreement, boolean exact integer match against one
        published security row
    secondary:
      - rank of the descended system per key, integer, against the predicted e*N
      - maximum total degree of the descended system per key, integer
      - equation and variable counts of the descended system per key, integers
      - e*, the derived crossover 2*omega/c, reported with its inputs
      - per-scheme verdict labels, WIN, LOSE or INAPPLICABLE, per omega column
      - time and memory in bit operations and bits for all four candidate costs per row
      - j*, the optimal hybrid split, per row
  heuristic_under_test: HA-1
  preregistered_prediction:
    quantity: >-
      (i) the verbatim time and memory exponents of KN-LIT-3290, and (ii) the
      linear-dependency rate among the e components of a Weil-descended
      quadratic over F_{2^e}.
    formula: >-
      (i) c strictly below 0.792, RECALLED as 0.6943 and NOT VERIFIED; c_mem
      unread and therefore reported UNRESOLVED rather than guessed. (ii)
      dependency rate exactly 0.000, so that the descended system has e*N
      independent equations in e*N variables and the m = n shape is preserved.
    source: >-
      (i) is a reading, not a derivation, and its source is the paper itself.
      (ii) follows from the F_2-linearity of the Frobenius for the DEGREE, which
      is a derivation and not tested, but NOT for the INDEPENDENCE, which is
      what this experiment measures.
  band_non_degeneracy:
    checked_before_freezing: true
    arms_found_degenerate_and_recorded_as_proofs:
      - >-
        DEGREE PRESERVATION IS NOT AN ARM. IDEA-20260808-51e40f pre-registers
        "degree exactly 2, e*N equations, e*N variables. Any degree-3 term
        falsifies the descent step." COMPUTED, this cannot fail. The Frobenius
        of F_{2^e} over F_2 is F_2-linear, so restriction of scalars carries a
        quadratic form over F_{2^e} to quadratic forms over F_2, always. Its
        falsifier would be a contradiction in linear algebra. RECORDED AS A
        PROOF in H-ECDLP-a6d66b's assumptions. It is retained here ONLY as an
        implementation regression fixture, explicitly testing the code and not
        the mathematics, and it is not counted as evidence for the hypothesis.
      - >-
        ODD-q INAPPLICABILITY IS NOT AN ARM. There is no F_2-structure at odd
        q, so the descent does not exist and "no delta" is forced. Retained as
        an instrument check with a forced value.
      - >-
        j* = 0 IS NOT AN ARM. The hybrid cost 2^{c*e*N + e*j*(1-c)} is strictly
        increasing in j whenever c < 1, so j* = 0 follows arithmetically once c
        is read. A nonzero j* would mean c is at or above 1, which the c
        reading already tests directly. Retained as a derived report.
      - >-
        e* IN [4, 10] IS NOT AN ARM. e* = 2*omega/c is a function of two
        numbers, so once c is read its value is determined. The band tests the
        arithmetic, not the science.
    surviving_measured_arm_and_its_separation: >-
      LINEAR INDEPENDENCE OF THE DESCENDED COMPONENTS. This is genuinely open:
      the Frobenius argument fixes the degree but says nothing about whether the
      e components of a descended equation are independent, and a systematic
      dependency would reduce the effective equation count below e*N and break
      the m = n shape the whole exponent rests on. Null value 0.000 dependencies
      over 100 keys per size. At a true dependency rate of 0.03 the probability
      of observing zero over 100 keys is 0.97^100 = 0.047, so 100 keys gives
      about 95 percent power against a 3 percent rate, and correspondingly more
      against anything systematic. The planted-dependency control forces exactly
      one dependency and the checker must report rank e*N - 1, which exercises
      the instrument's dynamic range in the direction that matters.
    curve_free_null_disposition: >-
      NOT APPLICABLE, AND RECORDED AS A PROOF RATHER THAN AN OMITTED ARM. The
      object under study is a multivariate quadratic system; there is no curve
      anywhere in it, so no curve-free object could be mistaken for a curve
      result. The corresponding risk here is the INVERSE one, that an MQ result
      is misread as an ECDLP result because of this contract's pre-allocated
      identifier. That is addressed by the scope statements in the objective and
      in H-ECDLP-a6d66b, not by an experimental arm.
  scale_relevance:
    tier: toy
    justification: >-
      The only computation performed is a symbolic Weil descent at
      (q, N) = (16, 6) and (16, 8), which is toy. Everything else is a read or
      an arithmetic table. No solver is run at any size, so this contract
      produces no evidence about how any algorithm behaves at scheme
      parameters, and it must never be cited as such.
    correspondence: null
  tail_checks:
    - >-
      Report every key on which the e components are linearly dependent
      individually, with its rank, rather than reporting only a pooled rate. A
      single systematic dependency is more informative than an average.
    - >-
      The paper's stated memory exponent must satisfy 0 < c_mem <= c. A reported
      memory exponent above its own time exponent indicates a misread and the
      reading is redone.
    - >-
      Report the full (D, d, k)-free grid of the four candidate costs at every
      parameter set, not the argmin alone, so a favourable minimum cannot be
      produced by selection.
  replication:
    seeds: [20260904, 20260905]
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 8
    maximum_runs: 4
    maximum_workers: 1
  stopping_rules:
    - >-
      PHASE A FIRST AND BLOCKING. If KN-LIT-3290 cannot be located or
      re-obtained, STOP and record the contract as BLOCKED. Do not proceed on
      recalled numbers, and do not report the blockage as a negative result
      about the method. Phase C may still be run and reported alone.
    - >-
      If Phase A returns c at or above 0.792, or a regime that excludes m = n,
      STOP. The record dies and that is the cheapest possible outcome.
    - >-
      PHASE B BLOCKS PHASE D. If the units control cannot reproduce a published
      row with exact integer agreement, the cost table is UNRUN and no row is
      admitted to any minimum.
    - >-
      If c_mem cannot be read, every row is reported as "time-only, memory
      UNRESOLVED". Substituting a guessed c_mem is forbidden and is an
      invalidation, not a stopping rule.
    - >-
      Phase C proceeds independently of Phases A, B and D, because it depends on
      no unread quantity.
  invalidation_rules:
    - >-
      Any number is asserted from KN-LIT-3290 without a verbatim reading, or the
      recalled 0.6943 is reported as the paper's content.
    - >-
      A guessed c_mem appears anywhere in the table.
    - >-
      The table is reported at a single omega.
    - >-
      The large-field convention d_reg = N+1 is applied to a GF(2) row.
    - >-
      Groebner-after-descent is compared against Groebner-before-descent. The
      comparison is always Groebner over F_q against polynomial method over
      GF(2), and that convention is stated in the cost model.
    - >-
      The planted-dependency control reports full rank e*N.
    - >-
      Any row is described as a break, or any scheme is described as broken. No
      solver is run in this contract.
    - >-
      Any timeout, crash, or unreachable network endpoint is reported as a
      mathematical result rather than an infrastructure outcome, contrary to
      AGENTS.md rule 5.
  success_criterion: >-
    All of the following. Phase A obtains KN-LIT-3290 and records c, c_mem and
    the stated regime verbatim, with c strictly below 0.792 and the regime
    including m = n; Phase B reproduces one published security row with exact
    integer agreement; Phase C reports a dependency rate of exactly 0.000 over
    100 keys at both sizes while the planted-dependency control reports rank
    e*N - 1; and Phase D emits the full table at both omega columns and both
    memory caps, with the odd-q control returning INAPPLICABLE and the q = 256
    row returning LOSE at omega = 2. Anything weaker is reported as such.
  falsification_criterion: >-
    Any of the following, each scoped to the read source, the tested descent
    sizes and the stated cost model. c read at or above 0.792 or outside the
    m = n regime; or c_mem read high enough that no row binds at a 2^80-bit
    cap; or a dependency rate above 0.000 with the planted control firing
    correctly, which breaks the m = n shape; or a units-control failure, which
    blocks the table; or any delta produced at odd q, which voids the pipeline.
    An inability to obtain the source is BLOCKED, not falsified.
  required_artifacts:
    - a Phase A reading record naming exactly what was located, how, and what was read
    - an upgraded KN-LIT entry for KN-LIT-3290 filed as a NEW record, never an edit
    - the verbatim quotations of the time exponent, memory exponent and regime of validity
    - the units-control reproduction, showing the specification formula, its inputs and the exact integers
    - symbolic descent transcripts for all 100 keys at each size, with degree, counts and rank
    - the planted-dependency key, its construction, and its measured rank
    - the full cost table at both omega columns and both memory caps, with the binding row per scheme
    - the odd-q and q=256 control outputs
    - manifest per AGENTS.md artifact policy, including seeds, environment and dirty-tree state
  assigned_to: executor
  approved_by: null
