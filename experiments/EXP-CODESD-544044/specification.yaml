experiment:
  id: EXP-CODESD-544044
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-8639e7; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-8639e7
  question_id: RQ-WFS-e776b6
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Compression-call counting of transcript-prefix reuse in a reference multi-round public-coin
    protocol across 4 to 24 rounds, three message-size profiles and two hash-chaining constructions,
    with block-aligned and no-change null layouts.
  objective: 'The one uncertainty a run reduces is whether the per-attempt cost that grinding accounting
    charges a state-restoration attacker is a constant or a function of where the attacker rewinds.
    Concretely: (i) whether the number of hash compression calls surviving a rewind to round r matches
    floor(prefix_bytes(r)/block_bytes) exactly under a state-retaining chaining construction, measured
    by an instrumented counter verified against a hand-counted fixture; (ii) whether the amortization
    ratio A(r) is monotone non-increasing in r and exceeds 2 in the first third of the rounds at multi-kilobyte
    transcripts, measured over the complete rewind-round axis rather than at the last block alone;
    (iii) whether the curve''s shape is set by the cumulative message-size profile rather than the
    round count, measured by sweeping three profiles at fixed round count and comparing shapes. The
    instrument''s validity is established in the same invocation by a block-aligned re-initializing
    layout where survival must be exactly zero and a no-change rewind where survival must equal the
    total. A run does not reduce uncertainty about any scheme''s forgery cost, and produces no forgery,
    since no relation and no false statement exist anywhere in it.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for the declared reference
      transcript layouts, the two chaining constructions and the declared profiles, the surviving
      compression-call counts and amortization ratios were as tabulated, agreeing or disagreeing with
      the floor formula by the reported amounts. What does NOT follow: nothing about SDitH, FAEST,
      MQOM or any third-party proof system, library or deployment, none of which is examined; no claim
      that any accounting charges the wrong per-attempt cost; and above all no attack estimate, since
      the reachable-challenge side of the trade is deliberately not measured and combining the two
      is refused by this contract.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes) declare the round counts, the three message-size profiles,
      the two chaining constructions and the block size, and freeze them. STAGE 1 (cost: hours human)
      implement the reference protocol layout, the instrumented hash wrapper and the rewind harness.
      STAGE 2 (cost: minutes) verify the counter against a hand-counted 3-block fixture; HALT on mismatch.
      STAGE 3 (cost: minutes) run NULL-BLOCK-ALIGNED across all r; HALT if any P(r) is nonzero. STAGE
      4 (cost: minutes) run NULL-NO-CHANGE across all r; HALT if surviving is not equal to total.
      STAGE 5 (cost: tens of minutes) run the full sweep: for each round count, profile, construction
      and rewind point, hash from scratch, rewind, modify one byte, and record executed and surviving
      calls with finalization calls in a separate column. STAGE 6 (cost: minutes) compare measured
      P(r) against the floor formula, compute A(r), check monotonicity, and apply the decay-in-r structural
      tell, labelling any flat curve as a suspected artifact in the emitted table. STAGE 7 (cost:
      minutes) emit curves for all three profiles overlaid at fixed round count.'
    instrument: Python 3.11 with a pure-Python reference compression function so calls can be counted
      exactly, cross-checked against hashlib for output equality at every transcript so the instrumented
      path is provably the same function. struct for deterministic layout serialization, random.Random
      with declared seeds for message content. No Sage, no external cryptographic library, no protocol
      relation. Run through harness/runner.py with immutable run records under an experiments/EXP-*
      directory.
    parameters: 'Round counts in {4, 8, 12, 16, 24}. Three message-size profiles per round count:
      uniform (equal bytes per round), front-loaded (first third carries half the bytes), and back-loaded
      (last third carries half), each summing to total transcript sizes in {1024, 4096, 16384} bytes.
      Chaining constructions: state-retaining with 64-byte block, and re-initializing per round. Rewind
      point r swept over every round. Byte modified at round r: the first byte, the middle byte and
      the last byte of that round''s message, three positions, since where the difference starts sets
      the surviving count. Repeats: 5 declared seeds per configuration to confirm determinism. Total
      configurations: 5 round counts times 3 profiles times 3 sizes times 2 constructions times average
      12 rewind points times 3 positions, about 3200 measurements.'
  controls:
  - 'NULL-BLOCK-ALIGNED with re-initialized chaining: P(r) must be exactly zero everywhere.'
  - 'NULL-NO-CHANGE: rewind with no modification, surviving count must equal total.'
  - Hand-counted fixture at a 3-block transcript verifying the instrumented counter before any sweep.
  - State-retaining versus re-initializing constructions run at identical layouts, so the construction
    is separated from the layout.
  - Three message-size profiles at fixed round count, separating profile effects from round-count
    effects.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): NULL-BLOCK-ALIGNED: a transcript layout in which every round message
    is padded to a whole number of hash blocks AND the chaining state is re-initialized at each round,
    so that no compression call can survive a rewind and P(r) must be exactly 0 for every r by construction.
    It runs through the identical instrumented wrapper in the same invocation. For the signal arm
    to mean anything, the null must report exactly zero survival at every r; any nonzero value means
    the counter is attributing calls it should not, and no P(r) from the signal arm is admissible.
    A second null, NULL-NO-CHANGE, rewinds to round r and changes NOTHING, where the surviving count
    must equal the total, bounding the counter from the other side.'
  independent_variables:
  - round count
  - message-size profile (uniform, front-loaded, back-loaded)
  - total transcript size
  - chaining construction (state-retaining versus re-initializing)
  - rewind round r and modified-byte position within the round message
  metrics:
    primary:
    - surviving compression calls P(r) per configuration
    - amortization ratio A(r) equals total calls from scratch divided by calls executed after rewind
    - measured P(r) minus floor(prefix_bytes(r)/block_bytes)
    - null-arm P(r), required exactly zero
    secondary:
    - finalization calls, reported separately and never merged into P(r)
    - total calls from scratch per configuration
    - cumulative prefix length modulo block size at each r
    - determinism across the 5 declared seeds
    - wall-clock seconds per configuration
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The formula residual F(r) = P_measured(r) minus floor(prefix_bytes(r) / block_bytes),
      for the state-retaining construction at every rewind point, and the amortization ratio A(r).
    formula: F(r) is predicted to be exactly 0 for every r, every profile and every transcript size
      in the state-retaining arm, where prefix_bytes(r) is the cumulative byte length of all messages
      and challenges strictly preceding the first modified byte. A(r) = C_total / (C_total minus P(r)),
      predicted monotone non-increasing in r and predicted to exceed 2 for r within the first third
      of rounds at total transcript size 4096 or larger. Nonzero F(r) anywhere falsifies claim (A)
      and its sign localizes whether finalization or padding is being miscounted.
    source: Pre-registered in the parent proposal IDEA-20260816-8639e7 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested transcript sizes run to 16 kilobytes and round counts to 24, which is a
      plausible range for signature transcripts but is a REFERENCE LAYOUT and not any scheme's. The
      transferable content is the floor formula and the shape dependence on the cumulative profile,
      both of which are construction properties rather than scale-dependent measurements; the absolute
      call counts transfer to nothing. No extrapolation to any deployed transcript is performed, and
      the RQ-WFS-e776b6 constraint forbidding examination of third-party systems is respected by construction,
      since only layouts built here are measured.
    correspondence: null
  tail_checks:
  - 'r equal to 0, modification at the first byte: P must be exactly 0, since nothing precedes the
    change.'
  - 'r equal to the last round, modification at the last byte: P must be maximal and A(r) must be
    at its smallest distance from the total.'
  - 'Re-initializing construction: P must be exactly 0 at every r; a nonzero value indicates state
    leakage in the implementation.'
  - 'Transcript exactly a whole number of blocks: verify no off-by-one in the floor formula at the
    boundary.'
  - 'Modified-byte position sweep within one round: P must be non-decreasing as the position moves
    later in the message.'
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt if the hand-counted fixture disagrees with the instrumented counter.
  - Halt if NULL-BLOCK-ALIGNED reports nonzero survival.
  - Halt if NULL-NO-CHANGE reports survival unequal to total.
  - Halt if the pure-Python reference compression function ever disagrees with hashlib on the same
    input, since the instrumented path would then not be the same function.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The instrumented counter matches the hand-counted fixture, both nulls behave
    exactly as constructed, the pure-Python path agrees with hashlib on every transcript, and the
    run emits P(r) and A(r) curves for all profiles and constructions with the formula residual F(r)
    reported at every point and finalization calls kept in a separate column.
  falsification_criterion:
  - Nonzero survival in NULL-BLOCK-ALIGNED.
  - Survival unequal to total in NULL-NO-CHANGE.
  - Nonzero formula residual F(r) anywhere in the state-retaining arm.
  - A(r) non-monotone in r.
  - A(r) flat in r, indicating an artifact rather than reuse.
  - Identical A(r) shapes across the three profiles at fixed round count, falsifying the profile-sets-the-shape
    claim.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-8639e7
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must decide whether a pure-Python reference compression function is acceptable
    as the instrument, given it is slower and its equivalence to hashlib must be demonstrated rather
    than assumed.
  - Whether the reference layouts are defensible as members of the family at all, given no specification
    is available and RQ-WFS-e776b6 forbids examining any third-party system to find out.
  - Whether finalization calls should ever be included in A(r); this record excludes them and the
    Coordinator must ratify that choice, since it changes every reported ratio.
