    over a degree-5 extension field. This session has no Bash/code-execution
    tool. The exact closed-form formula, and the structural constraints
    (|B_1| even by negation-closure, |B_1| a multiple of 5 by the
    Frobenius-orbit-of-size-n=5 argument, hence a multiple of 10) were
    derived and recorded BEFORE opening any blind_from file. After opening
    report.md/metrics.json/cost-model.json, |B_1|=110 (a multiple of 10, as
    required) was read off, and substituting it into the blind formula
    exactly reproduces the run's own reported ratio 5880/11
    (525 + 1050/110 = 5880/11). J5's formula and structural component holds
    exactly; its single-integer component is a disclosed partial
    (formula-verified, not independently integer-verified) rederivation, not
    a full independent recomputation of |B_1| itself.
