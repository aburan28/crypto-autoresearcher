    construction specified in amendment DEC-20260921-2f89d4. C3 and C4 are
    explicitly out of scope for this run per the handoff/amendment and are
    not present in this run's deliverables. The two slots of the `[2,2]`
    partition now use DISTINCT subspaces (basis_indices [0,1] and [0,2]) on
    both cells, independently confirmed by checker.py; the
    strictly-smaller-than-object verdict for C2 is unchanged from the
    defective run on both cells (True for FROB-SPLIT-q11n5, False for
    FROB-EQDEG-q19n5).

