run:
  id: RUN-FROB-91ee9c-ba442e
  experiment_id: EXP-FROB-91ee9c
  status: completed
  status_note: >-
    FULL COMPLETION of cell FROB-EXT-q13n7 (q=13, n=7), curve index 0 only
    (A=0, B=1, N=5230261), per DEC-20260921-f93b43 (v4). cell_status reached
    `ok`: the object curve was independently re-derived from scratch (not
    merely checked against RUN-FROB-91ee9c-7119f2's probe candidate) via the
    FULL object_selection eligibility test including the Frobenius scalar
    condition ord_N(mu)=n (verified by exhaustive charged lookup against
    independent point arithmetic -- the probe explicitly did not perform
    this check), and exactly reproduced the probe's recorded curve
    (curve_search_matches_prior_probe: true). The central measured finding:
    of the 5 achievable set-partitions (Bell(3)=5, slot-dimension multisets
    [6]/[4,2]/[2,2,2]), only the coarsest [6] partition (m=1) reaches
    object-arm status `ok` -- every individual atomic-factor kernel
    (dimension 2) has ZERO points of this specific order-N=5,230,261
    subgroup landing in it alone, so all four non-coarsest partitions are
    `empty_base`. Consequently object-arm I=1/1 and spread=1/1 by
    construction, and C2's per-dimension pool (built only for dimensions an
    `ok` object partition reaches) was only ever exercised at d=6 (pool size
    1) -- the [2,2,2] partition's anticipated three-mutually-distinct-
    dimension-2-subspace test (DEC-20260921-f93b43's stated rationale for
    this run) could not be exercised on this curve. This is reported as an
    honest structural/negative observation, not a resource or instrument
    failure: every control (C1-C7) computed and passed; C8 (checker.py)
    reports all_independent_checks_pass: true. Full wall-clock 1265.94s
    (~21.1 min), well inside the 10800s (3h) advisory budget; peak RSS
    ~1.09 GiB, well inside the 8 GiB cap.

