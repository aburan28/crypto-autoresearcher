  interpretation_limits:
    - Design approval is not evidence. Zero scientific runs exist for this experiment at intake.
    - >-
      Nothing measured here is an attack, a speedup, an exponent movement, or a
      security consequence for any curve. Deployed Koblitz and sect-family
      parameters are never instances.
    - >-
      The cost ratio prices the combinatorial half of relation collection only.
      Ranking slot counts by solve cost needs d_reg, which is contested
      (KN-OPEN-d218ec, Semaev Assumption 1, Nagao's fake-versus-true first fall
      degree in KN-LIT-71b758), and the omitted algebraic cost grows with the
      slot count.
    - >-
      Published prior art (KN-LIT-796, Galbraith-Granger-Merz-Petit, SAC 2020)
      reports that index calculus on subfield curves gains more from subfield
      structure than rho does and still loses outright at deployed sizes. This
      contract does not contradict that and may not be used to.
    - >-
      "Trace zero" here is a condition on the x-coordinate inside F_{q^n}, not
      the trace-zero subvariety of E(F_{q^n}), which is H-FROB-73df22's object.
    - Claim tier toy. Cross-curve replication may be absent, in which case any resulting evidence record is capped at strength `preliminary`.

  proof_search_map:
    bottleneck: >-
      Whether the slot count m, at fixed total slot dimension n-1, moves
      (U + 1 + extra)/p_m enough to be a real design axis, and whether the
      divisor lattice of x^n - 1 bounds the achievable minimum.
    baseline_embedding:
      parameter_slice: m = 1, single slot of dimension n-1 - the single-invariant-factor-base pipeline.
      reproduction_check: >-
        Closed form U = |B|/(2n), p_1 = |B|/(N-1), ratio from those two integers
        alone, checked symbolically and then against the enumerator's m = 1
        output. Control C1.
    observation_collision:
      observable: The pair (U, p_m) per configuration, and the derived ratio.
      distinct_preimage_search: >-
        Matched-cardinality random sets share U_neg exactly; matched-dimension
        non-stable subspaces share the dimension exactly. Both are run as arms
        (C3, C2) so a collision is observed rather than argued about.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The divisor lattice of x^n - 1 as the exact index set of Frobenius-stable slots; partitions as the exact index set of direct-sum configurations.
        predicted_gain: Exact finite enumerability of the design space at fixed total dimension. Diagnostic resolution, not attack cost.
      - transform: stronger_invariant
        proposed_object: ker Tr as the automatic ambient of every non-trivial factor kernel.
        predicted_gain: If verified, trace-zero costs nothing on top of Frobenius stability; if refuted, the two conditions are independent and prior assumptions must be corrected.
    quantifier_order: >-
      For every named cell, for every partition of the non-trivial irreducible
      factors, for every eligible object curve, enumerate ALL tuples and compute
      (U, p_m) exactly. The claim is existential in the partition: there exists a
      minimising partition, and in the split cell that minimum is at least a
      factor 4 below the m = 1 value. The witness may depend on cell and curve;
      it may NOT depend on any measured outcome, on any control-arm result, or on
      any hidden discrete logarithm - the partition set is fixed by the
      factorisation before any point is enumerated. No uniformity in n or q is
      claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        An exact, exhaustively enumerated (U, p_m, ratio) table over the full
        partition lattice of the tested cells with matched controls, plus an
        exact verification or refutation of the ker Tr identity. Nothing about
        solving cost, nothing outside the panel, nothing about any attack.
      nearby_object_control: >-
        FROB-NOLATTICE-q13n5 - same n, same total dimension, same construction,
        no non-trivial partition lattice - and the matched non-subfield null
        curve C4. A method reporting the same improvement factor on those has not
        identified the load-bearing structure.
    proof_obligations:
      - responsibility: baseline
        claim: C1 reproduces the single-invariant-base pipeline exactly, with I = 1 where no other partition exists.
      - responsibility: correctness
        claim: C8 re-verifies every tuple sum, membership, order and rational identity with code independent of the driver's enumeration.
      - responsibility: size
        claim: The dominant structure is sized analytically before the run and reconciled against measured peak RSS, with discrepancies reported.
      - responsibility: success_probability
        claim: p_m is exact over the whole prime-order subgroup by exhaustive enumeration, never sampled, in every core cell.
      - responsibility: interface
        claim: U_neg and U_frob are reported in separate presentations and never mixed; U_frob is null with a reason on non-stable arms.
      - responsibility: scope
        claim: The per-trial algebraic cost is not measured and no solve-cost ranking follows.
      - responsibility: strictness
        claim: Every improvement factor is an exact ratio of exact rationals with both endpoints reported and no achievable partition excluded.
    not_applicable_reason: null

  dominated_by: >-
    Unresolved. Not applicable as an attack result; this is a design-space
    diagnostic. The complete frontier against Frobenius-and-negation-class rho,
    GHS/Weil descent where applicable, and trace-zero methods is unmeasured for
    these cells, and the per-trial algebraic cost is outside the object.
  sota_delta:
    established_time_exponent_gain: 0
    established_memory_exponent_gain: 0
    established_data_query_gain: 0
    conditional_target: >-
      A within-cell improvement factor of at least 4 in the combinatorial cost
      ratio, i.e. 2 bits of finite combinatorial work, changing no asymptotic
      exponent.
    comparison_scope: Four named toy cells; global frontier unresolved.

