experiment:
  id: EXP-FROB-91ee9c
  hypothesis_id: H-FROB-d93575
  proposal_id: IDEA-20260914-e2e0cf
  question_id: RQ-FROB-7d8dd4
  version: 1
  status: approved
  assigned_to: executor
  approved_by: coordinator
  approval_decision: DEC-20260914-d04668
  approval_basis: >-
    AGENTS.md "Standing user authorization for ideas and experiments" (user
    instruction 2026-09-06, verbatim "all is approved. ideas/experiments should
    be always approved"). Approval becomes effective for dispatch only with a
    verified, committed and published snapshot of this contract, and is subject
    to the dependency ordering recorded in DEC-20260914-d04668 (the completed
    EXP-FROB-b8cf21 run TASK-20260907-ee1e3c must reach evidence review first).
  experiment_class: cost_model_measurement
  title: >-
    Direct-sum partition sweep of the Frobenius-stable factor-base lattice:
    exact (U, p_m) cost-ratio measurement across slot counts at fixed total
    slot dimension

  objective: >-
    Measure, exactly and exhaustively, the combinatorial relation-collection
    cost ratio (U + 1 + extra)/p_m over the FULL partition lattice of the
    Frobenius-stable factor-base slots of E(F_{q^n}), at fixed total slot
    dimension n - 1, in named toy cells chosen so that the factorisation type of
    x^n - 1 is the only structural variable; and verify or refute, exactly, that
    the direct sum of the non-trivial factor kernels is ker Tr_{F_{q^n}/F_q}.
    The deliverable is a concrete-cost table with measured and modelled columns
    kept strictly separate, not a binary test of a single number, and it prices
    the COMBINATORIAL HALF ONLY of relation collection.

  # ---------------------------------------------------------------- inputs
  inputs:
    field_representation: >-
      F_q = Z/qZ with q prime. F_{q^n} = F_q[z]/(g(z)) with g the
      lexicographically first monic irreducible of degree n ordered by
      coefficient tuple (constant coefficient first). Field elements are encoded
      as the integer sum_{i<n} a_i * q^i; points are ordered lexicographically by
      encoded (x, y). Every encoding decision is frozen here and may not be
      changed by the implementation.

    named_parameter_sets:
      - name: FROB-SPLIT-q11n5
        q: 11
        n: 5
        field_size: 161051
        approx_log2_field_size: 17.3
        p_divides_n: false
        expected_factorisation: >-
          ord_5(11) = 1 because 11 = 1 mod 5, so x^5 - 1 splits into five
          distinct linear factors over F_11: s = 4 non-trivial factors, each of
          degree d = 1.
        role: >-
          LATTICE CELL, maximal split. Achievable non-trivial slot-dimension
          multisets are exactly the integer partitions of 4 realisable as sums
          of 1s: (1,1,1,1), (2,1,1), (2,2), (3,1), (4). Slot count m sweeps
          1..4 at fixed total dimension 4. This is the cell in which the
          predicted improvement factor must appear.
        justification: >-
          Smallest field in the RQ toy window (about 2^16 to about 2^40) with a
          fully split x^n - 1 at prime n, so the partition lattice is as rich as
          n = 5 allows while exhaustive tuple enumeration costs at most
          q^{n-1} = 11^4 = 14641 tuples per partition. Shares (q, n) with the
          already-executed EXP-FROB-b8cf21 panel, so the two diagnostics are
          read on comparable instances at no extra cost.
      - name: FROB-EQDEG-q19n5
        q: 19
        n: 5
        field_size: 2476099
        approx_log2_field_size: 21.2
        p_divides_n: false
        expected_factorisation: >-
          19 = -1 mod 5, so ord_5(19) = 2 and x^5 - 1 = (x-1) * f1 * f2 over
          F_19 with deg f1 = deg f2 = 2: s = 2 non-trivial factors of EQUAL
          degree 2.
        role: >-
          LATTICE CELL with several EQUAL-DEGREE factors of degree greater than
          1, as required so that the partition lattice is not an artefact of
          degree-1 factors. Achievable multisets: (2,2) and (4); m sweeps 1..2
          at fixed total dimension 4.
        justification: >-
          Same n and same total non-trivial dimension as the other two core
          cells, so the only structural difference is the factorisation type.
          Enumeration costs at most 19^4 = 130321 tuples per partition.
      - name: FROB-NOLATTICE-q13n5
        q: 13
        n: 5
        field_size: 371293
        approx_log2_field_size: 18.5
        p_divides_n: false
        expected_factorisation: >-
          13 = 3 mod 5 and ord_5(3) = 4, so x^5 - 1 = (x-1) * f over F_13 with f
          irreducible of degree 4: s = 1, and the only Frobenius-stable
          dimensions are 0, 1, 4 and 5.
        role: >-
          MANDATORY NULL CELL FOR THE PARTITION AXIS. No non-trivial partition
          exists at total dimension n - 1 = 4, so the sweep collapses to a
          single configuration and the within-cell improvement factor is
          structurally bounded. If the object arm of the split cell and this
          cell show the same improvement factor, the effect is generic and is
          not a partition effect. This cell is what makes the design
          discriminating.
        justification: >-
          Matched to FROB-SPLIT-q11n5 on n, on total non-trivial dimension, on
          construction and on order of magnitude of the field, and differing in
          exactly one property: whether x^n - 1 factors non-trivially beyond
          (x-1). Enumeration costs at most 13^4 = 28561 tuples per partition.
      - name: FROB-EXT-q13n7
        q: 13
        n: 7
        field_size: 62748517
        approx_log2_field_size: 25.9
        p_divides_n: false
        expected_factorisation: >-
          13 = -1 mod 7, so ord_7(13) = 2 and x^7 - 1 = (x-1) * f1 * f2 * f3
          over F_13 with each deg f_i = 2: s = 3 equal-degree factors.
        role: >-
          EXTENSION CELL, ordered last, NOT load-bearing. Provides an m = 3
          point at fixed total dimension 6 and a second n. Its non-completion
          for resource reasons is recorded as a terminal status and is NEVER
          negative mathematical evidence, and the success and falsification
          criteria below do not depend on it.
        justification: >-
          Tests whether the effect survives a change of n while keeping equal-degree
          factors. Enumeration costs at most 13^6 = 4826809 tuples per partition,
          which is the largest single cost in the panel and the reason it is last.

    cell_execution_order:
      - FROB-SPLIT-q11n5
      - FROB-NOLATTICE-q13n5
      - FROB-EQDEG-q19n5
      - FROB-EXT-q13n7

    object_selection: >-
      Enumerate (A, B) in {0,...,q-1}^2 lexicographically for E: y^2 = x^3 + Ax + B
      over F_q, discarding singular curves (4A^3 + 27B^2 = 0) and supersingular
      curves (trace divisible by p). Compute #E(F_{q^n}) exactly. Accept the
      curve if there is a prime N with: N >= 17; N divides #E(F_{q^n}) to
      exponent exactly 1; N does not divide #E(F_q); and the q-power Frobenius pi
      acts on the order-N subgroup as multiplication by a scalar mu with
      ord_N(mu) = n, verified by exhaustive charged lookup against independent
      point arithmetic. Take the largest such N. Obtain G by scanning affine
      points in lexicographic order and taking the first whose cofactor-cleared
      image is nonzero; verify ord(G) = N independently. Accept the first TWO
      distinct j-invariants passing every test per cell. Record every rejected
      candidate with its reason. Exhausting the finite q^2 pool leaves the cell
      PARTIAL or INELIGIBLE, which is an instrument outcome and never a negative
      scientific result.

    factorisation_and_slots: >-
      Factor x^n - 1 over F_q exactly and assert squarefreeness. Assert the
      expected_factorisation recorded for the cell above; a mismatch is a frozen
      prediction that failed and is reported as such, not silently accepted.
      Build the F_q-linear matrix of pi on the polynomial basis of F_{q^n}.
      For each monic divisor g of x^n - 1, V_g = ker g(pi); certify
      dim V_g = deg g and pi-invariance of V_g by exact linear algebra. Enumerate
      the FULL set of partitions of {f_1,...,f_s} (the irreducible factors other
      than (x-1)); for a partition P = {J_1,...,J_m} set
      V_j = ker (prod_{f in J_j} f)(pi). Report the achievable slot-dimension
      multiset table per cell and compare it against the divisor lattice.
      The (x-1) factor is EXCLUDED from the primary sweep so that total slot
      dimension is exactly n - 1 in every partition; configurations that include
      it (total dimension n) are enumerated separately and reported in their own
      table, never pooled with the primary sweep.

    factor_base: >-
      B_j = {Q in <G> \ {O} : x(Q) in V_j}, built by enumerating <G> once and
      testing x-coordinate membership by exact linear algebra. B = union_j B_j.
      Record |B_j|, |B|, all pairwise intersection sizes, and whether the B_j are
      pairwise disjoint (they need not be; overlap is reported, never assumed
      away).

    extra: >-
      `extra` is the over-collection margin in the frozen cost formula. It is a
      declared protocol constant, NOT a measured quantity in this experiment.
      PRIMARY: extra = 0. SENSITIVITY (secondary only): extra in {8, 32}. The
      choice extra = 0 is an optimistic assumption and is listed as OA-1 below.

  # ------------------------------------------------- independent variables
  independent_variables:
    - named parameter cell (q, n) and therefore the factorisation type of x^n - 1
    - partition P of the non-trivial irreducible factors, and hence the slot count m and the slot-dimension multiset
    - arm: object / non-stable-matched-dimension / random-matched-cardinality / null-curve
    - relation-column presentation: negation-only versus Frobenius-plus-negation
    - eligible object curve within a cell (up to two distinct j-invariants)
    - extra in {0, 8, 32}, secondary only

  # ------------------------------------------------------------- metrics
  metrics:
    primary:
      - >-
        cost_ratio_neg(cell, curve, arm, P, extra=0) = (U_neg + 1 + extra)/p_m,
        as an EXACT RATIONAL with numerator and denominator reported separately.
        This is the metric named by the sibling implementation
        (/home/user/crypto/src/cryptanalysis/koblitz_factor_base_search.rs:
        "The expected number of trials to collect a determining system is
        `~ (U + 1 + extra) / p_m`, and that ratio is what this module
        minimises"). It is reported in the DERIVED-FROM-MEASURED column: both
        inputs are measured exactly, the combining formula is modelled and named.
      - >-
        p_m(cell, curve, arm, P) = |{R in <G>\{O} : R = Q_1 + ... + Q_m,
        Q_j in B_j}| / (N - 1), exact rational, obtained by EXHAUSTIVE
        enumeration of all prod_j |B_j| ordered tuples over the whole
        prime-order subgroup. No sampling in any core cell. MEASURED column.
      - >-
        U_neg = number of relation columns under the negation-only quotient =
        |B|/2 (exact; <G> has odd prime order so no point is its own negative).
        Defined on EVERY arm and the only cross-arm comparable presentation.
        MEASURED column.
      - >-
        U_frob = number of signed Frobenius orbit columns = |B|/(2n) when B is
        pi-stable (every signed Frobenius orbit has size exactly 2n because
        ord_N(mu) = n and n is an odd prime, so mu is neither 1 nor -1). Reported
        as null WITH A REASON on any arm whose slot set is not pi-stable. Never
        compared against U_neg. MEASURED column.
      - >-
        I(cell, curve) = cost_ratio_neg(coarsest achievable partition at total
        dimension n-1) / min over achievable partitions of cost_ratio_neg, exact
        rational. The dimensionless within-cell improvement factor; the ONLY
        quantity compared across cells.
      - >-
        spread(cell, curve, arm) = max/min of cost_ratio_neg across achievable
        configurations of that arm, exact rational.
      - >-
        trace_identity(cell): the exact triple (dim of the sum of ker f_j(pi)
        over non-trivial j, dim ker Tr, boolean set equality), with ker Tr
        computed independently from the matrix of u -> u + u^q + ... + u^{q^{n-1}}
        and NOT from h(pi).
    secondary:
      - achievable slot-dimension multiset table per cell, and its exact agreement or disagreement with the divisor lattice of x^n - 1
      - '|B_j|, |B|, pairwise intersections, prod_j |B_j| (the enumeration count), and the number of DISTINCT representable targets'
      - cost_ratio_neg at extra in {8, 32}; cost_ratio_frob at extra = 0 on pi-stable arms only
      - >-
        MODELLED column: modelled_|B_j| = q^{d_j}/c, modelled_U_neg = (1/2) sum_j
        modelled_|B_j|, modelled_p_m = min(1, prod_j modelled_|B_j| / (N-1)),
        modelled_cost_ratio = (modelled_U_neg + 1 + extra)/modelled_p_m, with
        c = #E(F_{q^n})/N the measured cofactor
      - measured/modelled discrepancy ratio per partition per arm, both endpoints reported
      - >-
        MODELLED column, per-trial algebraic system size under the chained-S_3
        presentation of KN-TECH-b18366: n(m-1) equations in n(m-2) + sum_j d_j
        variables at algebraic degree 3. Reported for context only; NOT combined
        with any measured number and NOT used in any ranking.
      - measured CPU seconds and wall seconds per cell, per curve, per arm, per partition
      - peak_rss_bytes, analytic_bytes, and their ratio (see memory_accounting)
      - every ineligible, partial, unmatched, refused or resource-exhausted cell with its terminal status and reason

    measured_modelled_separation: >-
      BINDING. metrics.json and cost-model.json carry three top-level, mutually
      exclusive objects: `measured` (instrumented counts and timings only),
      `modelled` (values computed from the frozen formulas above, each tagged
      with its formula string and its source), and `derived_from_measured`
      (values computed by a named formula from measured inputs only, each tagged
      with its formula string). NO COLUMN, ROW, OR JSON OBJECT MAY CONTAIN BOTH
      A MEASURED AND A MODELLED NUMBER. A file that mixes them invalidates the
      run under invalidation rule IR-6.

  heuristic_under_test: null
  heuristic_under_test_note: >-
    This experiment validates no heuristic and supports no heuristic-conditional
    claim. The modelled sizing formula is a frozen prediction under test, not an
    assumption the conclusion rests on.

  # -------------------------------------------------- preregistered prediction
  preregistered_prediction:
    quantity: >-
      The within-cell improvement factor I(cell, curve), and the modelled
      cost-ratio table against which the measured cost-ratio table is compared.
    formula: >-
      Modelled sizing, frozen before any run: with c = #E(F_{q^n})/N the
      cofactor and d_j = dim V_j, modelled_|B_j| = q^{d_j}/c;
      modelled_U_neg = (1/2) * sum_j modelled_|B_j|;
      modelled_p_m = min(1, (prod_j modelled_|B_j|)/(N-1));
      modelled_cost_ratio = (modelled_U_neg + 1 + extra)/modelled_p_m.
      Under this model the coarsest partition (single slot, dim n-1) gives
      modelled_cost_ratio ~ q^n/(2nc) up to the orbit convention, while a
      balanced two-slot partition gives ~ q^{(n+1)/2} * (2/(2n)) * c^{...}; the
      model therefore predicts a LARGE, non-monotone variation with an interior
      optimum at balanced slot dimensions. The concrete preregistered thresholds
      are: I(FROB-SPLIT-q11n5) >= 4; I(FROB-SPLIT-q11n5) >= 4 * I(FROB-NOLATTICE-q13n5);
      argmin slot count m >= 2 in FROB-SPLIT-q11n5.
    source: >-
      Derived inside this contract from the standard index-calculus balance of
      factor-base size against relation probability. IT IS NOT TAKEN FROM ANY
      PAPER'S THEOREM and no publication is cited as its authority. It is a
      MODEL: if the measurement disagrees with it, the measurement stands and
      the model is what failed, and that disagreement is itself a first-class
      deliverable of a cost-model measurement experiment.
    frozen_before_execution: true
    amendment_path: >-
      Any change to this prediction after any run requires a versioned
      protocol_amendment in experiments/EXP-FROB-91ee9c/amendments/. Runs already
      executed are never silently re-scored against a new prediction.

  # ------------------------------------------------------------ controls
  controls:
    - name: C1_baseline_single_slot
      design: >-
        The coarsest achievable partition (m = 1, single slot of dimension n-1)
        reproduces the single-invariant-factor-base pipeline. Its cost ratio must
        be computable from U and p_1 = |B|/(N-1) alone, WITHOUT tuple
        enumeration, and must agree exactly with the enumerator's m = 1 output.
        Disagreement invalidates the instrument; it says nothing about the
        hypothesis. I(cell) = 1 by construction when no other partition exists.
      isolates: the arithmetic of the ratio itself, and the enumerator against a closed form
    - name: C2_non_stable_matched_dimension
      design: >-
        For each object slot of dimension d_j, construct an F_q-subspace W of
        F_{q^n} of the SAME dimension d_j that is NOT pi-stable (certified by
        exhibiting w in W with pi(w) not in W). Take the lexicographically first
        such subspace and, independently, one drawn with each declared seed. Build
        B_W identically, form the matched slot configuration with the same slot
        count and the same dimension multiset, and compute p_m and U_neg
        identically. U_frob is null here WITH THE REASON "slot set not
        pi-stable".
      isolates: >-
        Frobenius stability from mere dimension. If the cost ratio and its spread
        reproduce the object's, the measurement is reading dimension, not
        stability.
    - name: C3_random_matched_cardinality
      design: >-
        Replace each B_j by a uniformly seeded, negation-closed random subset of
        <G> \ {O} of cardinality EXACTLY |B_j|, drawn without replacement with
        the declared seed, slots pairwise disjoint or overlapping exactly as the
        object's B_j are. Compute p_m and U_neg identically.
      isolates: >-
        Linear structure from cardinality. U_neg is identical to the object arm
        by construction, so any difference in the ratio is entirely a difference
        in p_m.
    - name: C4_matched_null_curve
      design: >-
        For each cell, select a curve E' over F_{q^n} that is NOT defined over any
        proper subfield, by scanning A' = z + a, B' = z + b for a, b in
        {0,...,q-1} in lexicographic order, rejecting singular curves and any
        curve with j' in F_q (tested by j'^q = j'), and taking the first with a
        prime N' of exponent 1 satisfying N/2 <= N' <= 2N. Verify a generator
        independently. E' has no q-power Frobenius endomorphism on its rational
        points, so no Frobenius-stable slot structure exists; slots are matched
        to the object's |B_j| by the C3 construction inside E'. Report p_m,
        U_neg and the spread.
      isolates: >-
        Subfield structure itself. THIS ARM IS MANDATORY. EXP-FROB-b8cf21's
        completed run measured a LARGER Delta_rank on its null arm than on its
        object arm at FROB-q7-n3-object01 (cover "1,2,3", negation-only
        presentation: object 5, null-seed2026090701 6, null-seed2026090702 7), so
        a design on this lattice without a null arm is not admissible. Note also
        that b8cf21's null was deliberately non-geometric (a membership-matched
        relabelling) and its own specification states it "cannot isolate a
        Frobenius effect"; C4 here is a GEOMETRIC null curve, which is the
        response to that declared limitation.
      claim_limit: >-
        C4 changes both the curve and the subfield structure, so a difference is
        attributable to "not a subfield curve" and not to Frobenius alone. C2 and
        C3 carry the finer attributions. No single control here isolates
        Frobenius causality, and none is presented as doing so.
    - name: C5_trace_identity_exact
      design: >-
        Compute the matrix T of u -> u + u^q + ... + u^{q^{n-1}} DIRECTLY (by
        repeated q-th powering), and independently the matrix of h(pi) with
        h(x) = 1 + x + ... + x^{n-1}. Assert T = h(pi) as matrices. Compute
        ker T. Compute the subspace sum of ker f_j(pi) over all non-trivial
        irreducible factors f_j, assert it is DIRECT (dimensions add), and assert
        set equality with ker T and dimension n - 1. Also assert
        ker (x-1)(pi) = F_q (the subfield) and that it is NOT contained in ker T
        unless p divides n.
      isolates: >-
        The structural prediction, verified rather than assumed. A failure here
        refutes the trace prediction of H-FROB-d93575 and must be reported
        prominently; it does not by itself invalidate the cost measurements.
    - name: C6_known_false_repeated_slot
      design: >-
        Offer the enumerator a configuration that repeats the SAME subspace in
        two slots, and a configuration whose slots are not disjoint as index
        sets. Neither is a partition. The enumerator must REFUSE both with an
        explicit reason and must not credit either as m = 2. Also offer the two
        degenerate endpoints: V = {0} (which must give p_m = 0 and trigger the
        denominator-zero rule) and V = F_{q^n} at m = 1 (which must give
        p_1 = |<G>\{O}|/(N-1) = 1 exactly, since every nonzero point of <G> has
        its x-coordinate in F_{q^n}).
      isolates: >-
        Proves-too-much for the enumerator: an instrument that credits a
        non-partition as a partition would manufacture the very effect the
        experiment is looking for.
    - name: C7_denominator_zero
      design: >-
        Whenever p_m = 0 the cost ratio is reported as null with
        denominator_zero: true and the exact numerator retained. It is NEVER
        reported as 0, as infinity, or as a large finite placeholder, and such a
        configuration is never silently dropped from a min or max.
      isolates: the min/max statistics from a division artefact
    - name: C8_independent_recheck
      design: >-
        A checker independent of the driver re-verifies, from the driver's raw
        output: every accepted tuple sum by signed point addition; every
        membership x(Q) in V_j by exact linear algebra; |B| divisible by 2n on
        every pi-stable arm; ord(G) = N; ord_N(mu) = n; and every reported
        rational arithmetic identity. The checker must not import the driver's
        enumeration code.
      isolates: implementation self-consistency from correctness

  # --------------------------------------------- optimistic assumptions
  optimistic_assumptions:
    - id: OA-1
      assumption: 'extra = 0 in the primary metric: no over-collection margin for rank deficiency.'
      direction_of_bias: >-
        UNDERSTATES the numerator, therefore understates the cost ratio, therefore
        flatters the attack. Sensitivity at extra in {8, 32} is reported as a
        secondary.
    - id: OA-2
      assumption: >-
        Every relation trial is charged as one unit. The per-trial
        polynomial-solving cost is not modelled at all in the primary metric.
      direction_of_bias: >-
        UNDERSTATES cost, and the omitted factor GROWS with the slot count m
        (KN-TECH-b18366: n(m-1) equations in n(m-2) + sum d_j variables at degree
        3), so it biases specifically AGAINST the coarse partitions and IN FAVOUR
        of the fine ones. This is the single most important bias in the table.
    - id: OA-3
      assumption: >-
        Every signed orbit column is assumed to be an independent unknown; no
        rank deficiency is measured here.
      direction_of_bias: >-
        UNDERSTATES the number of relations actually needed. EXP-FROB-b8cf21 is
        the experiment that measures rank on this lattice and its run has not yet
        been reviewed; until it has, this assumption is not merely optimistic, it
        is unaudited.
    - id: OA-4
      assumption: >-
        Factor-base construction, subgroup enumeration, orbit canonicalisation,
        witness storage and certificate verification are charged as instrument
        cost but are NOT folded into the cost ratio.
      direction_of_bias: UNDERSTATES total cost; the omission is larger for coarser partitions.
    - id: OA-5
      assumption: No descent, no target re-randomisation and no target transport cost.
      direction_of_bias: UNDERSTATES total cost uniformly.
    - id: OA-6
      assumption: >-
        p_m measured exhaustively over a toy prime-order subgroup is treated as
        the exact yield for THAT instance only.
      direction_of_bias: >-
        None for the tested instances - it is exact. It becomes a bias the moment
        anyone extrapolates it, and no extrapolation is performed here.
  table_label: >-
    Every table produced under these assumptions is labelled a BOUND on the
    combinatorial half, never a prediction of attack cost.

  # ------------------------------------------------------ hidden overhead
  hidden_overhead_disclosure: >-
    The headline ratio (U + 1 + extra)/p_m hides the entire ALGEBRAIC half of
    relation collection inside its "one trial" unit. Under the chained-S_3
    presentation the per-trial system has n(m-1) equations in n(m-2) + sum_j d_j
    variables at algebraic degree 3 (KN-TECH-b18366), and its solving cost is
    explicitly NOT established because it depends on the degree of regularity,
    which is contested: KN-OPEN-d218ec records that the surface in (n, m, t, k)
    separating d_F4 = 4 from d_F4 >= 5 is unknown, that Semaev's Assumption 1 is
    supported only at n <= 21, m <= 6 plus one cell at n = 40, and that it is
    open even whether this program's d_reg statistic is the quantity Semaev
    bounds; KN-LIT-71b758 separates the true first fall degree from the fake one
    taken modulo the field equations. The hidden factor therefore grows with the
    very axis this experiment sweeps. CONSEQUENCE, STATED ONCE AND BINDING: this
    experiment measures the combinatorial half only, and no output of it may be
    read as a solve-cost ranking of slot counts, as an algorithmic improvement,
    or as any statement about attack feasibility.

  # ------------------------------------------------------ memory accounting
  memory_accounting:
    dominant_structure: >-
      The hit set of distinct representable targets accumulated during tuple
      enumeration for one (curve, arm, partition).
    analytic_size: >-
      entries = min(prod_j |B_j|, N - 1); bytes_per_entry = 8 (each group element
      stored once as a canonical u64 index into the enumerated subgroup table);
      analytic_bytes = 8 * entries * load_factor, with load_factor frozen at 2.0
      for an open-addressing set at 50 percent occupancy. Secondary structures,
      sized and reported separately: the subgroup table (N entries, 16 bytes
      each), the slot point lists (sum_j |B_j| entries, 8 bytes each), and the
      exact-rational accumulator table (one entry per reported configuration).
    reconciliation: >-
      measured peak_rss_bytes is recorded per cell and reconciled against
      analytic_bytes plus the secondary structures; the ratio
      measured/analytic is reported in memory-accounting.json for every cell. A
      ratio above 4 or below 0.5 is REPORTED AS AN UNEXPLAINED DISCREPANCY in
      report.md and is not explained away, rounded away, or omitted.
    time_memory_tradeoff: >-
      A streaming variant that recomputes rather than stores the hit set trades
      the dominant memory term for a second enumeration pass. It is NOT used
      here, because storing it is affordable at these parameters; the
      availability of the tradeoff is recorded so that no reader mistakes the
      measured peak for an intrinsic requirement.
    machine_protection: >-
      maximum_memory_gb 8, maximum_workers 1. These are machine protection, not a
      research budget; exceeding them checkpoints the task (see SR-3) and is
      never a mathematical verdict.

  scale_relevance:
    tier: toy
    justification: >-
      Field sizes 11^5 = 161051, 13^5 = 371293, 19^5 = 2476099 and 13^7 =
      62748517, i.e. roughly 2^17 to 2^26, inside the RQ-FROB-7d8dd4 toy window
      of about 2^16 to about 2^40 with n prime. Every quantity is measured by
      exhaustive enumeration at these exact parameters. NO TRANSFER OR
      EXTRAPOLATION TO ANY LARGER PARAMETER IS PERFORMED OR LICENSED. The
      cross-cell comparison is confined to the dimensionless within-cell
      improvement factor precisely because absolute ratios at different q, N and
      cofactor are not comparable.
    correspondence: null

  tail_checks:
    - Report every cell, every curve, every arm and every partition separately; no pooling, no averaging across cells, and no omission of empty, refused, ineligible or resource-exhausted configurations.
    - Report both endpoints (argmax and argmin configurations, with their exact ratios) of every spread and every improvement factor, never the factor alone.
    - Report the extreme configurations explicitly: the partition with the smallest p_m and the partition with the largest U, with their exact values.
    - Report every configuration with p_m = 0 under the denominator-zero rule rather than dropping it.

  replication:
    seeds: [2026091401, 2026091402]
    independent_instances: 2
    plan: >-
      Up to two distinct object j-invariants per cell by the frozen selection
      rule; the two seeds drive ONLY the randomised controls C2 and C3 and the
      slot matching inside C4. The object arm is fully deterministic and has no
      seed dependence, which must be demonstrated by the run reporting identical
      object-arm outputs under both seeds. THE UNIT OF ANALYSIS IS THE
      WITHIN-CURVE PARTITION COMPARISON, so a cell that yields only one eligible
      curve still supports the primary comparison and is reported as PARTIAL.
      Cross-curve replication is a declared secondary; its absence caps the
      evidence strength of any resulting record at `preliminary` and that cap is
      stated here, before the run, rather than negotiated afterwards.

