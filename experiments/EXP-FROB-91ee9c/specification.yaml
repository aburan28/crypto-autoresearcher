  stopping_rules:
    - SR-1 Execute cells in the frozen cell_execution_order, completing each cell fully before starting the next, and preserving every terminal cell result even if a later cell fails.
    - SR-2 Run the C1, C5, C6 and C8 gates on the first cell BEFORE any full partition sweep; a gate failure stops the run and classifies the instrument invalid, preserving all artifacts.
    - SR-3 Memory above the 8 GiB machine-protection cap checkpoints the task as resource_exhaustion with partial artifacts preserved. This is an infrastructure outcome and yields no hypothesis verdict (AGENTS.md core rule 5).
    - SR-4 The extension cell FROB-EXT-q13n7 is attempted last and may terminate as not_run_resource without affecting the success or falsification criteria.
    - SR-5 A cell whose object pool is exhausted before two eligible curves are found is recorded PARTIAL (one curve) or INELIGIBLE (none). Do not widen the pool, substitute parameters, or reorder the lexicographic scan.
    - SR-6 Any change to a parameter, a metric definition, a control, a threshold or an outcome rule requires an additive protocol_amendment in experiments/EXP-FROB-91ee9c/amendments/ BEFORE further execution. Nothing in this file is edited.

  invalidation_rules:
    - IR-1 Any floating-point number in a reported rank, count, probability, ratio or improvement factor. All of these are exact integers or exact rationals.
    - IR-2 A p_m obtained by sampling in any CORE cell, or a sampled p_m anywhere that does not declare the sample size and the smallest probability it can resolve.
    - IR-3 A configuration credited as a partition when its slots repeat a subspace or its index sets overlap (C6 must have refused it).
    - IR-4 U_frob reported on an arm whose slot set is not pi-stable, or U_frob compared against U_neg in any table, statistic or claim.
    - IR-5 An unrecorded seed, an unrecorded rejected candidate, or a configuration omitted from the report because it was empty, refused or extreme.
    - IR-6 A measured number and a modelled number appearing in the same column, row or JSON object (see metrics.measured_modelled_separation).
    - IR-7 peak_rss_bytes absent, or a measured/analytic memory discrepancy outside [0.5, 4] left unreported.
    - IR-8 Artifact, hash or implementation mismatch; a checker that imported the driver's enumeration code; a fabricated completion; or an operational failure labelled as mathematical evidence.
    - IR-9 A reported improvement factor computed after excluding any achievable partition, or a min/max taken over a set from which denominator-zero configurations were silently dropped.

  success_criterion: >-
    ALL of the following, on committed artifacts: (1) the three CORE cells
    (FROB-SPLIT-q11n5, FROB-NOLATTICE-q13n5, FROB-EQDEG-q19n5) each complete
    with at least one eligible object curve and with all four arms populated;
    (2) controls C1, C5, C6, C7 and C8 all pass, and C5 in particular confirms
    dim(sum_j ker f_j(pi)) = n - 1 and set equality with ker Tr in every
    completed cell; (3) the achievable slot-dimension multiset table matches the
    divisor lattice of x^n - 1 exactly in every completed cell; (4)
    I(FROB-SPLIT-q11n5) >= 4 on at least one eligible object curve, with the
    argmin at slot count m >= 2; (5) I(FROB-SPLIT-q11n5) >=
    4 * I(FROB-NOLATTICE-q13n5); and (6) in every completed cell the spread of
    cost_ratio_neg on each of the C2, C3 and C4 control arms is STRICTLY SMALLER
    than the object arm's spread in that cell. Meeting this criterion establishes
    that the slot count is a real design axis on the tested cells under the
    frozen combinatorial cost model AND NOTHING ELSE - no attack, no speedup, no
    solve-cost ranking, no security consequence.

  falsification_criterion: >-
    ANY of the following, on complete and valid cells, falsifies the
    corresponding prediction of H-FROB-d93575: (a) the spread of cost_ratio_neg
    across achievable partitions at fixed total dimension is below 2 on every
    eligible object curve in every completed core cell - the axis is flat over
    the tested cells; (b) I(FROB-SPLIT-q11n5) < 4 * I(FROB-NOLATTICE-q13n5) -
    the improvement is not attributable to the partition lattice; (c) any of the
    C2, C3 or C4 control arms shows a spread greater than or equal to the object
    arm's in the same cell - the object-arm variation is not shown to be
    structural, which is exactly how EXP-FROB-b8cf21's null arm behaved for
    Delta_rank; (d) C5 finds the direct sum of non-trivial factor kernels is not
    ker Tr, or is not of dimension n - 1 - the trace prediction is refuted and
    every downstream record must treat trace-zero and Frobenius-stable as
    independent conditions; (e) the achievable slot-dimension multisets disagree
    with the divisor lattice - the module description is wrong at its root. Each
    of (a)-(e) is scoped to the exact cells in which it is observed. A failed
    control (C1, C6, C7, C8) invalidates the INSTRUMENT and falsifies nothing.

  decision_branches:
    positive: >-
      After independent validation and red-team review, propose a separately
      frozen experiment that adds the per-trial algebraic cost to the surviving
      partitions, paired with the matched Frobenius-and-negation-class rho
      baseline; and only then may any charged-pipeline comparison be designed.
      No claim of improvement leaves this experiment.
    negative: >-
      Record the measured obstruction as a quantity over its exact scope (the
      observed spread and improvement factors, with units and endpoints), run
      its resource_check, and rerank. Closes the slot-count axis only for the
      tested cells; it closes neither RQ-FROB-7d8dd4 nor any other FROB lane.
    inconclusive: >-
      Record the exact eligibility, matching, validity or infrastructure
      impediment with a concrete recheck. No hypothesis status transition.

