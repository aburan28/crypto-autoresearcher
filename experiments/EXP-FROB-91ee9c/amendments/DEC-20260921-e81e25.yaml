protocol_amendment:
  id: DEC-20260921-e81e25
  experiment_id: EXP-FROB-91ee9c
  version_from: 1
  version_to: 2
  recorded_at: '2026-09-21'
  predecessor_path: experiments/EXP-FROB-91ee9c/specification.yaml
  predecessor_sha256: 9d66c4f7914250a09a5083a3e97c85af9f26ba04755b906105c200d41c75daa4

  reason: >-
    NA-1 of ledger/decisions/DEC-20260921-3678fc.yaml (the /review-evidence
    round on run TASK-20260914-7119f2): success_criterion clause (6) and
    falsification_criterion clause (c) compare each core cell's C2/C3/C4
    control-arm spread against its object-arm spread "in that cell" / "in the
    same cell". The completed run computed the full C2/C3/C4 battery only on
    curve index 0 of each core cell (manifest.yaml
    protocol_deviations_summary item 2) -- an operational scope choice, not a
    frozen-contract requirement -- and curve index 0 is exactly the curve
    whose object arm is itself trivially flat (spread=1) in
    FROB-SPLIT-q11n5 and FROB-EQDEG-q19n5. The curve that actually shows
    non-trivial object-arm variation (curve index 1: FROB-SPLIT-q11n5
    A=1,B=2,N=10061, I=2055/451; FROB-EQDEG-q19n5 A=1,B=1,N=117991,
    I=6152/861) never received the battery, so clause (6)/(c) could not be
    evaluated (EV-FROB-2fe225, DEC-20260921-3678fc: decision inconclusive).
    This amendment authorizes exactly the recheck DEC-20260921-3678fc names:
    completing the C2/C3/C4 battery on the informative curves, under the
    control constructions already frozen in this specification, unchanged.

  changes:
    - >-
      budget.maximum_runs: the frozen value "1 -- one aggregate run covering
      the whole panel" is EXTENDED by exactly one additional bounded run,
      scoped ONLY to the work named below. maximum_runs becomes 2 for this
      contract as amended; no further run beyond this one is authorized by
      this amendment. The additional run's own budget (memory 8 GiB, 1
      worker, advisory time/CPU null) is otherwise identical to the frozen
      budget.
    - >-
      execution scope, additive only: the additional run computes the
      ALREADY-DEFINED C2_non_stable_matched_dimension,
      C3_random_matched_cardinality and C4_matched_null_curve controls
      (verbatim as specified in this contract's controls list; no
      redefinition of any control's design, isolation claim or claim_limit)
      against the SECOND eligible object curve of FROB-SPLIT-q11n5 (A=1,
      B=2, N=10061) and FROB-EQDEG-q19n5 (A=1, B=1, N=117991). The two
      declared seeds (2026091401, 2026091402) are reused unchanged for
      C2/C3. The object arm for these two curves is RECOMPUTED (not merely
      cited) as an internal consistency check and MUST reproduce the values
      already recorded for curve index 1 in RUN-FROB-91ee9c-7119f2's
      metrics.json and cost-model.json exactly (including
      I(FROB-SPLIT-q11n5)=2055/451 and I(FROB-EQDEG-q19n5)=6152/861); a
      mismatch invalidates the new run's instrument per the frozen
      invalidation rules and is reported as such, not silently reconciled.
    - >-
      FROB-NOLATTICE-q13n5's second eligible curve is explicitly EXCLUDED
      from this amendment's scope. Its achievable slot-dimension multiset is
      {0,4} on every curve by construction (one non-trivial factor of
      degree 4; specification.yaml's own
      named_parameter_sets.FROB-NOLATTICE-q13n5.expected_factorisation),
      already independently reconfirmed for BOTH of its curves in
      RUN-FROB-91ee9c-7119f2 (report.md section 3, certificates.json). This
      is a field-level structural fact, not a per-curve empirical unknown
      (the same status as the C5 ker-Tr identity, which is verified once
      per cell rather than per curve): spread=1 on every arm, on any curve,
      in this cell is already certain by algebra alone, independent of
      which curve is measured. Extending the battery to its second curve
      would reconfirm a known certainty, cannot bear on the FROB-SPLIT/
      FROB-EQDEG question this amendment exists to answer, and is excluded
      as non-informative rather than included for textual literalism alone.

  unchanged:
    - Every cell, curve, candidate set, and control DESIGN (C1 through C8), exactly as specified.
    - Every seed, metric definition, threshold, success_criterion, falsification_criterion and decision_branches clause, verbatim.
    - Every invalidation rule (IR-1..IR-9) and stopping rule (SR-1..SR-6).
    - The maximum_memory_gb and maximum_workers machine-protection caps.
    - >-
      Everything in RUN-FROB-91ee9c-7119f2 (curve index 0 of every core
      cell, and FROB-EXT-q13n7): it is not re-run, re-scored or edited. Its
      manifest, metrics, certificates and report remain exactly as
      committed in PR #1311, and it remains the sole basis for every
      finding in EV-FROB-2fe225 that did not depend on clause (6)/(c).

  affected_runs: []
  # RUN-FROB-91ee9c-7119f2 is not re-scored by this amendment; it remains a
  # complete, valid, immutable run. This amendment authorizes a NEW,
  # separate run only.
  confirmatory_status: preserved

  authority_decision: DEC-20260921-e81e25
  approved_by: coordinator
  approval_basis: >-
    AGENTS.md standing user authorization (2026-09-06, "all is approved.
    ideas/experiments should be always approved"), the original approval
    DEC-20260914-d04668 (EXP-FROB-91ee9c v1), and DEC-20260921-3678fc's own
    NA-1 next_action naming exactly this recheck as the concrete impediment
    resolution decision_branches.inconclusive requires. This amendment
    authorizes no run and no scope beyond what NA-1 names; it asserts
    nothing about H-FROB-d93575 and re-scores no completed run.

  binding: >-
    The Executor under ledger/handoffs/TASK-20260921-51bc02.yaml executes
    specification.yaml version 1 as modified by this amendment. The new run
    is recorded at experiments/EXP-FROB-91ee9c/runs/TASK-20260921-51bc02/,
    a directory disjoint from and never touching runs/TASK-20260914-7119f2/.
    Its manifest.yaml records contract version 2 with this amendment's
    path. On completion, a fresh /review-evidence round on the COMBINED
    evidence (both run directories) is the mechanism that resolves J3; this
    amendment authorizes execution only and changes no hypothesis status
    itself.
