protocol_amendment:
  id: DEC-20260921-f93b43
  experiment_id: EXP-FROB-91ee9c
  version_from: 3
  version_to: 4
  recorded_at: '2026-09-21'
  predecessor_path: experiments/EXP-FROB-91ee9c/specification.yaml
  predecessor_sha256: 9d66c4f7914250a09a5083a3e97c85af9f26ba04755b906105c200d41c75daa4

  reason: >-
    NA-2 of ledger/corrections/CORR-20260921-9dc350.yaml (the C2 audit's own
    next_action): "Completing FROB-EXT-q13n7... is the only route to a richer
    achievable-partition lattice for the 'several equal-degree factors'
    diagnostic FROB-EQDEG-q19n5 was meant to probe -- no curve or generator
    search inside FROB-EQDEG-q19n5's own cell can ever exceed its permanent
    Bell(2)=2 ceiling." FROB-EXT-q13n7 (q=13, n=7, s=3 equal-degree factors of
    degree 2, Bell(3)=5 achievable set-partitions: [6], [4,2], [2,2,2]) is
    already fully specified in this experiment's ORIGINAL v1 contract
    (named_parameter_sets, cell_execution_order, SR-4) -- it is not a new
    cell, and its construction, controls, and curve-selection rule are
    unchanged. RUN-FROB-91ee9c-7119f2 attempted it and recorded the SR-4
    permitted terminal state `not_run_resource`
    (work/FROB-EXT-q13n7.probe.json): the object-curve search completed in
    67.6s and identified two eligible curves (A=0,B=1,N=5,230,261 and
    A=1,B=0,N=3,109), but the full instrumented worker was cut off by a
    SELF-IMPOSED 540-second wall-clock checkpoint before the subgroup
    enumeration and its required C2 passes could complete. Peak RSS during
    that attempt never approached the 8 GiB machine-protection cap (observed
    under 300 MB) -- per the probe's own words, "this was purely a
    wall-clock scheduling decision," not a real resource exhaustion. Per
    CLAUDE.md's "Research budgets: progress first" (user instruction,
    2026-09-06): "Watchdog expiry checkpoints a task; it does not exhaust
    the campaign or require another user budget approval," and "CPU usage
    is measured for algorithm comparisons, not rationed by default." The
    probe's own throughput extrapolation (~7,000-8,000 point additions/sec)
    puts one full pass over N=5,230,261 at roughly 650-750 seconds; the
    corrected C2 construction (DEC-20260921-2f89d4) needs a pool of THREE
    independent subspaces at dimension 2 for the [2,2,2] partition (not one,
    as the original probe's cost model assumed for "one pass per distinct
    dimension") plus one each for dimensions 4 and 6, so a realistic
    estimate is 5-7 full passes for the object arm and C2 combined, on the
    order of 60-90 minutes of wall-clock, well within a machine-protection
    budget that was never threatened by memory. This amendment authorizes a
    properly resourced attempt.

  changes:
    - >-
      budget.maximum_runs: the value already extended to 3 by
      DEC-20260921-2f89d4 is further extended by exactly one additional
      bounded run, scoped ONLY to the work named below. maximum_runs becomes
      4 for this contract as amended; no further run beyond this one is
      authorized by this amendment.
    - >-
      execution scope, additive only: the additional run ATTEMPTS FULL
      COMPLETION of FROB-EXT-q13n7 (q=13, n=7) -- the object-curve search,
      the object arm across all achievable partitions ([6], [4,2],
      [2,2,2]), and the full control battery (C1, C2 with the corrected
      per-slot-independent construction from DEC-20260921-2f89d4, C3, C4,
      C5, C6, C7, C8) -- on the FIRST eligible object curve only (curve
      index 0 in the frozen object_selection ordering), matching the scope
      RUN-FROB-91ee9c-7119f2 used for the three core cells before NA-1
      extended coverage to curve index 1. Curve index 1 for this cell is
      explicitly OUT OF SCOPE for this amendment (it is not needed to get a
      first genuine data point on the richer lattice, and FROB-EXT-q13n7
      remains, per SR-4, non-load-bearing for H-FROB-d93575's
      success/falsification criteria either way).
    - >-
      budget.wall_clock_seconds for this specific run is set to an
      ADVISORY 10800 (3 hours), well above the ~60-90 minute point estimate,
      to prevent a repeat of the prior self-imposed premature checkpoint.
      This is advisory, not a hard machine-protection limit: per CLAUDE.md,
      only memory/concurrency limits and explicitly justified watchdogs are
      machine protection, and a watchdog checkpoint here (should the
      estimate prove wrong) is reported as such under SR-4's already-
      permitted `not_run_resource` terminal state, not treated as a second
      failure requiring further authorization to retry. The 8 GiB memory
      cap and 1-worker concurrency limit are UNCHANGED (never threatened in
      the prior attempt).
    - >-
      If the object-curve search re-derives DIFFERENT curves than the prior
      probe's (A=0,B=1,N=5,230,261 and A=1,B=0,N=3,109) -- which should not
      happen, since object_selection is a deterministic lexicographic scan
      over the same frozen field and curve family -- the run reports the
      discrepancy explicitly as an instrument finding rather than silently
      preferring either value.

  unchanged:
    - >-
      Every cell, curve, candidate set, and every control DESIGN (C1-C8),
      exactly as specified (as already amended for C2 by
      DEC-20260921-2f89d4).
    - Every seed, metric definition, threshold, invalidation rule (IR-1..IR-9), and stopping rule (SR-1..SR-6).
    - >-
      success_criterion and falsification_criterion, both of which are
      scoped to the three core cells only; FROB-EXT-q13n7 remains, per
      SR-4, explicitly non-load-bearing for either.
    - The maximum_memory_gb (8) and maximum_workers (1) machine-protection caps.
    - >-
      Everything in RUN-FROB-91ee9c-7119f2, RUN-FROB-91ee9c-51bc02, and
      RUN-FROB-91ee9c-819bc0: none is re-run, re-scored, or edited. Their
      manifests, metrics, certificates and reports remain exactly as
      committed. RUN-FROB-91ee9c-7119f2's `not_run_resource` terminal status
      for FROB-EXT-q13n7 is NOT overwritten or retracted -- it remains the
      accurate, immutable record of what that run actually did; this
      amendment authorizes a NEW, separate attempt.

  affected_runs: []
  confirmatory_status: not_applicable
  confirmatory_status_note: >-
    This run does not re-confirm a prior finding; FROB-EXT-q13n7 has never
    been completed, so this is the first attempt to obtain any measurement
    on this cell at all.

  authority_decision: DEC-20260921-f93b43
  approved_by: coordinator
  approval_basis: >-
    AGENTS.md standing user authorization (2026-09-06, "all is approved.
    ideas/experiments should be always approved"); CLAUDE.md's "Research
    budgets: progress first" instruction (2026-09-06), which directly
    governs this exact situation (a prior self-imposed watchdog checkpoint,
    not a real resource exhaustion, being retried with a realistic budget
    rather than treated as a closed question); the user's explicit
    selection of this next step in this session ("1", choosing "Complete
    FROB-EXT-q13n7" from a set of ranked options this Coordinator
    presented); and CORR-20260921-9dc350's own NA-2 naming this exact
    completion as the cheapest route to a richer diagnostic lattice. This
    amendment authorizes no run and no scope beyond what is named above; it
    asserts nothing about H-FROB-d93575 and re-scores no completed run.

  binding: >-
    The Executor under ledger/handoffs/TASK-20260921-ba442e.yaml executes
    specification.yaml version 1 as modified by DEC-20260921-e81e25,
    DEC-20260921-2f89d4, and this amendment. The new run is recorded at
    experiments/EXP-FROB-91ee9c/runs/TASK-20260921-ba442e/, a directory
    disjoint from and never touching any prior run directory. Its
    manifest.yaml records contract version 4 with this amendment's path. On
    completion, whether and how a completed FROB-EXT-q13n7 measurement
    bears on H-FROB-d93575 is a SEPARATE /review-evidence decision, not made
    by this amendment or by the Executor; this amendment authorizes
    execution only.
