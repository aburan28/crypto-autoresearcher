# EXP-GFPN-3d834b
# Integer slice at m = 3. No curve is enumerated.
# Approved by DEC-20261004-cfdc8f.
experiment:
  id: EXP-GFPN-3d834b
  hypothesis_id: H-GFPN-d3c9a1
  source_idea: IDEA-20261004-31991f
  question_id: RQ-GFPN-c01af8
  version: 1
  title: Power and complementary count at m = 3
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-cfdc8f
  objective: >-
    Check the counts 4 and 3, the product 12, and the nearby gap 0.
  inputs:
    m: 3
    exponent: 2
    power: 4
    complement: 3
    power_gap: 1
    power_product: 12
    power_sum: 7
    nearby_a: 4
    nearby_b: 4
    nearby_gap: 0
    nearby_product: 16
  controls:
    - >-
      Two to the power 2 is 4. Four minus one is 3. Reporting the
      complementary count as 4 drops the gap against the power and
      invalidates the run.
    - >-
      Four exceeds three by 1. The product of 3 and 4 is 12. Their
      sum is 7.
    - >-
      Two readings of the power are both 4. Their gap is 0 and
      their product is 16.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - power
      - complement
      - power_gap
      - implementations_agree
    secondary:
      - power_product
      - power_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      At m = 3 the power is 4 and the complementary count is 3.
      The gap of two powers is 0.
    formula: >-
      Compute 2 to the power 2. Subtract 1 from 4. Multiply 3 by 4.
      Subtract 4 from 4.
    source: >-
      IDEA-20261004-31991f writes the null-object fraction and the
      minimal test writes m = 3, read 2026-10-04. The power, the
      product, and the sum were recomputed in this design session.
      That computation is not a run. No curve was enumerated.
  scale_relevance:
    tier: toy
    justification: One written exponent. No transfer to a descent.
    correspondence: null
  tail_checks:
    - The product 12 and the nearby gap 0 are required. A check that stops at the power 4 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the power 4 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 2 is not 4.
    - Four minus one is not 3.
    - The product is not 12.
    - The complementary count is reported as 4, or a curve is enumerated.
  success_criterion: >-
    Both runs agree that the power is 4, that the complementary
    count is 3, and that the product of those two counts is 12.
  falsification_criterion: >-
    The runs agree that the power is computed, and that power is
    not 4.
  required_artifacts:
    - experiments/EXP-GFPN-3d834b/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-GFPN-3d834b/runs/<RUN-ID>/command.txt
    - experiments/EXP-GFPN-3d834b/runs/<RUN-ID>/stdout.log
    - experiments/EXP-GFPN-3d834b/runs/<RUN-ID>/stderr.log
    - experiments/EXP-GFPN-3d834b/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-GFPN-3d834b/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any enumeration of a curve, character sum, or solver run.
    - Any claim that a gap of 1 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
