# EXP-ECDLP-1ab0e2
# Power-quotient orders. No pairing ladder.
# Approved by DEC-20261002-b0203b.
experiment:
  id: EXP-ECDLP-1ab0e2
  hypothesis_id: H-ECDLP-695b7b
  source_idea: IDEA-20260920-376b00
  question_id: RQ-ECDLP-bc7a54
  version: 1
  title: Power-quotient orders
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-b0203b
  objective: >-
    Count nth-power images on six prime cells and check the trace
    identity for a group order equal to p - 1.
  inputs:
    cells_p: [11, 11, 13, 13, 17, 3]
    cells_n: [5, 7, 3, 5, 5, 2]
    quotients: [5, 1, 3, 1, 1, 2]
    images: [2, 10, 4, 12, 16, 1]
    unguarded_p: 13
    unguarded_n: 3
    unguarded_pm1: 12
    guarded_p: 3
    guarded_n: 2
    trace_p11: 2
    trace_p3: 2
  controls:
    - >-
      The quotient at (11, 7) is 1. Reporting 7 uses the dividing
      cell. That report invalidates the run.
    - >-
      The quotient at (11, 5) is 5. Reporting 1 there swaps the two
      cells. That report invalidates the run.
    - >-
      The cell (13, 3) divides 12 and is not equal to 12. Reporting
      equality invalidates the run.
    - >-
      The cell (3, 2) does equal p - 1. A group order equal to
      p - 1 has trace 2. At p = 11 the order-10 trace is 2, and at
      p = 3 the order-2 trace is 2. Reporting another trace
      invalidates the run.
    - >-
      For each prime n the gcd is 1 or n. Reporting another gcd
      invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - cell
    - route in {powers, gcd}
  metrics:
    primary:
      - quot_11_7
      - quot_11_5
      - unguarded_neq
      - implementations_agree
    secondary:
      - images
      - traces
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The six quotient orders.
    formula: >-
      The image of x to the n on the nonzero field elements has size
      (p - 1) / gcd(n, p - 1). The quotient order is that gcd. For
      prime n the gcd is 1 or n. A group order equal to p - 1 has
      trace p + 1 - (p - 1) = 2. The equality n = p - 1 needs n
      greater than (p - 1)/2 in addition to divisibility.
    source: >-
      IDEA-20260920-376b00 states the gcd criterion, read 2026-10-02.
      The images were counted in this design session. That count is
      not a run. No ladder was run.
  scale_relevance:
    tier: toy
    justification: Six prime cells. No transfer to a pairing.
    correspondence: null
  tail_checks:
    - The cell (13, 3) is required. Stopping at the trivial quotient and still reporting n = p - 1 there is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If (13, 3) is reported as equal to 12, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The quotient at (11, 7) is reported as 7.
    - The quotient at (11, 5) is reported as 1.
    - (13, 3) is reported equal to 12.
    - A trace other than 2 is reported for a group order equal to p - 1.
    - A pairing ladder or a cubical coordinate is reported.
  success_criterion: >-
    Both runs agree on the quotient orders 5, 1, 3, 1, 1 and 2, on
    the image sizes 2, 10, 4, 12, 16 and 1, that (13, 3) divides 12
    and is not equal to 12, that (3, 2) equals p - 1, and that both
    traces are 2.
  falsification_criterion: >-
    The runs agree, the quotient at (11, 7) stays 1, and any order
    differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-ECDLP-1ab0e2/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-1ab0e2/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-1ab0e2/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-1ab0e2/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-1ab0e2/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-1ab0e2/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any pairing ladder, cubical coordinate, or biextension.
    - Any claim that a representation is closed.
    - The unguarded reading that divisibility forces n = p - 1.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
