experiment:
  id: EXP-DIFFP-04082e
  version: 1
  title: >-
    THE MEMBERSHIP KEY'S FUNCTIONAL-DEPENDENCY GRAPH, THE RE-PARTITION OF EVERY
    DEPTH-1 VERDICT OF BATCH-efcae7 FROM THAT GRAPH ALONE, AND -- GATED ON THAT
    OUTPUT -- THE OFF-DIAGONAL CELLS OF THE FAMILY-BY-ROW MATRIX ADJUDICATED TWICE,
    ONCE AGAINST THE HONEST INSTRUMENT AND ONCE AGAINST ONE KNOWN-FALSE INSTRUMENT
  status: approved
  status_note: >-
