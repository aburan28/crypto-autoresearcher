  # ====================================================================
  objective: >-
    MAKE BATCH-efcae7's OWN OUTPUT READABLE, THEN MEASURE THE ONE THING IT COULD NOT.
    BATCH-efcae7 produced a per-component power profile over the complete depth-1
    ablation lattice of the adjudicator's strict membership key, and its close
    (DEC-20260824-c5bb72) measured that a DETECTED or NOT DETECTED verdict in that
    profile is not self-interpreting: of the six depth-1 rows, one is contingent on
    the instrument, one is entailed by the perturbing family's own declaration, one is
    a theorem of the key's functional-dependency graph, and three record only that no
    declared family looked. THAT PARTITION WAS READ OFF MEASUREMENTS. THIS CONTRACT
    ASKS WHETHER IT CAN BE DERIVED FROM THE KEY'S STRUCTURE ALONE, AND THEN USES THE
    DERIVED STRUCTURE TO BUY THE ONLY CELLS OF A FAMILY-BY-ROW MATRIX THAT CAN CARRY
    INFORMATION ABOUT THE INSTRUMENT.
    IN THREE GATED STAGES, IN THIS ORDER.
    (1) THE GRAPH. A per-primitive analysis of the committed `adjudicator.serialize()`
    that outputs, for each ORDERED pair (X, Y) of strict key components, whether Y is
    a deterministic function of X. Every claimed edge carries BOTH a written
    DERIVATION from committed source AND an EMPIRICAL WITNESS over a declared object
    population; an edge with a witness and no derivation is labelled `empirical_only`
    and the word "theorem" may not be used for it (H-1). A NULL-OBJECT CONTROL runs
    the same edge detector over a population where the dependency is absent by
    construction, so the detector has a demonstrated capacity to return NO EDGE.
    (2) THE PARTITION, AND IT IS THIS TASK'S OWN FALSIFICATION TEST. From the graph
    and from each declared family's own perturbation declaration -- AND WITHOUT
    READING BATCH-efcae7's VERDICT COLUMN -- re-derive the class of every depth-1 row:
    PROVABLY UNDETECTABLE BY ANY FAMILY, NOT PROBED BY A DECLARED FAMILY, PROBED AND
    GENUINELY NOT DETECTED, and for the DETECTED rows ENTAILED BY THE PERTURBING
    FAMILY'S OWN DECLARATION versus CONTINGENT ON THE INSTRUMENT. The derivation is
    written to its own file and the comparison against BATCH-efcae7's answers is made
    AFTERWARDS, with the order declared (H-2). THE PRE-REGISTERED TARGET IS 1 / 3 / 0
    / 1 / 1 SUMMING TO THE SIX ROWS. REPRODUCING IT AND REFUTING IT ARE BOTH RESULTS
    AND BOTH ARE REPORTED THE SAME WAY.
    Then the depth-2 subsets that BREAK a dependency are named from the graph, so the
    fifteen-subset depth-2 lattice is bought by argument rather than by compute.
    (3) THE OFF-DIAGONAL MATRIX, GATED ON STAGE 2. Six perturbing families d_X, one
    per strict key component, each moving X and holding every other key component
    fixed, are constructed BEHIND A WELL-FORMEDNESS GATE. The DIAGONAL cells are
    excluded and stated as theorems, because a family perturbing exactly S makes the
    row deleting S detected by construction. The cells the graph marks as forced are
    excluded and stated as theorems. THE REMAINDER IS ADJUDICATED TWICE -- once
    against the honest adjudicator and once against O-E, the per-primitive-blind
    KNOWN-FALSE instrument already built and measured by TASK-20260824-e9d21a and
    REUSED HERE RATHER THAN REBUILT -- and the COUNT OF DIFFERING CELLS is reported
    with its excluded-cell list and every exclusion's reason. TWO OUTCOMES ARE
    PRE-DISTINGUISHABLE AND BOTH ARE RESULTS: identical matrices mean the power
    profile is a function of the families' construction and of the dependency graph
    and carries no information about the instrument at all; any differing cell is a
    place where a verdict is contingent on the instrument, and the count is the
    measurement this program has never had. A DEGENERATE ALWAYS-MEMBER AND A
    DEGENERATE ALWAYS-NON-MEMBER INSTRUMENT ARE RUN THROUGH THE SAME COUNTING RULE, SO
    THE COUNT HAS A DEMONSTRATED CAPACITY TO BE LARGE; if they do not maximise it, the
    counting rule is broken and the run STOPS (H-6).
    Finally, and only after all of the above, RC-1 is discharged: the D-SHA1-INCODE
    sub-arm is folded into a RE-SCORED detection rule IN THE NEW MODULE -- never by
    editing the committed one -- and whether O-E is then caught is reported. ITS
    OUTCOME IS KNOWN IN ADVANCE (the Red Team measured O-E at MEMBER 520 of 520 on
    that arm where the honest instrument returns 0 of 520) AND IT IS REPORTED AS A
    CONFIRMATION OF A KNOWN OUTCOME, NEVER AS A DISCOVERY.
    NOTHING HERE IS A RESULT ABOUT MD5 OR SHA-1. No path is claimed new at any tier,
    no search is run, no source is acquired, no cost is projected, and a passing
    control is not a cryptanalytic improvement.

  objective_budget_floor_note: >-
    THE FIRST TWO STAGES ARE CHEAP BY DESIGN AND THE THIRD IS BOUNDED BY A MEASURED
    PROXY. The dependency analysis is a read of the committed serialiser plus a
    grouping over an already-constructed object population. The off-diagonal matrix
    reuses the committed census, the committed generators, the committed
    serialisation and the eight declared seeds; the Red Team's own fourteen-instrument
    sweep over this substrate, INCLUDING key construction, was measured at 33 s on one
    core (red-team-report.yaml J12 `cost`, THAT SESSION'S MEASUREMENT AND NOT THIS
    COORDINATOR'S). The declared per-run ceilings below sum to 330 s, which is an
    order of magnitude above that proxy and is deliberately generous. UNSPENT CEILINGS
    ARE REPORTED AS UNSPENT AND ARE NEVER REALLOCATED.

  # ====================================================================
  inputs:
    frozen_instrument_under_measurement: >-
      THE COMMITTED BATCH-f8bf86 ADJUDICATOR PACKAGE under harness/diffpath/, plus
      harness/__init__.py and harness/runner.py, AS READ-ONLY INPUTS. IT IS MEASURED
      AND NOT REPAIRED (IR-2). BATCH-efcae7's own new module
      harness/diffpath/controlpower.py is now COMMITTED and joins that read-only set:
      its projection, its census construction, its family-(d) generators, its
      attribution function and its `Row.record()` detection rule are INPUTS to this
      contract and may not be edited. EV-DIFFP-b16b01 records the committed source
      digest 953398c4bc92fc1075817987976e9c9582c2756f13eff3f68a357d87355646b7 for that
      module and 13 of 13 identical CTL-FROZEN criterion files; THOSE VALUES ARE
      QUOTED FROM A COMMITTED RECORD AND WERE NOT MEASURED BY THIS COORDINATOR
      (BR-6). RECOMPUTE THEM YOURSELF UNDER CTL-FROZEN-3.
    census: >-
      THE 16-ENTRY SYNTHETIC SHADOW CENSUS built by the committed `census.build_census`
      at the two planted-path seeds, 8 entries per primitive, every MD5 entry carrying
      a WEIGHT-1 message difference and every SHA-1 entry IN THE LINEARIZED CODE, at
      full step range. THE READABLE CENSUS IS ZERO ENTRIES AND THAT IS STATED BESIDE
      EVERY VERDICT THIS CONTRACT PRODUCES. Census completeness, carried as three
      counts that are NEVER SUMMED: readable 0 / quarantined_not_read 1 /
      acquisition_gap 8, with shadow_planted 16 carried separately.
    seeds: >-
      EXACTLY THE EIGHT SEEDS DECLARED BY EXP-DIFFP-4b165f, INHERITED BYTE-IDENTICALLY.
      NO NINTH SEED IS DECLARED, MINTED OR USED ANYWHERE IN THIS CONTRACT, and
      seed integrity is a hard validity item at the close: eight declared, exactly
      eight present in every manifest, no ninth anywhere in any inputs subtree. This
      contract needs no new seed because every family it constructs draws through the
      same seeded mechanism the committed module already exposes.
    the_known_false_instrument_is_reused_not_rebuilt: >-
      O-E IS TAKEN FROM
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-e9d21a/constructions/rt_instruments.py,
      where it is the instrument `proj_drop_on_primitive(["message_difference"],
      "sha1")` wrapped by class `Instr`, and its measured outcomes are in
      constructions/j8_results.json. REUSING IT RATHER THAN REBUILDING IT IS A HARD
      TERM (IR-11) FOR THREE REASONS: a rebuilt adversarial object is a new object and
      its agreement with the committed one would be an unchecked assumption; the
      committed object is the artifact an independent session actually measured; and
      rebuilding invites the author of the batch to re-imagine the adversary's object,
      which is the failure DEC-20260824-ad098e reversed a whole review architecture to
      avoid. If the object must be re-expressed in the new module for mechanical
      reasons, the re-expression is CHECKED against the committed j8_results.json
      integers and ANY DISAGREEMENT IS A STOP, reported as an infrastructure finding.
    records_that_are_inputs_and_are_not_re_litigated:
      - ledger/goals/GOAL-DIFFP-84d641.yaml -- its `next_action` is this batch's contract
      - ledger/decisions/DEC-20260824-c5bb72.yaml -- the BATCH-efcae7 close, its seven-way ranking, its successor gates and its corrections_owed
      - ledger/evidence/EV-DIFFP-b16b01.yaml -- the obstruction partition, its resource_check, and the per-component power profile
      - ledger/evidence/EV-DIFFP-b878aa.yaml -- the round-1 obstruction and O-7, superseded in framing and not in value
      - ledger/decisions/DEC-20260824-af6d5c.yaml -- the round-1 close
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-e9d21a/red-team-report.yaml -- J8, J9, J11, J12, J13 and constructions/
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-b61d11/validation-report.yaml
      - experiments/EXP-DIFFP-4b165f/specification.yaml -- the frozen batch-2 contract whose seeds, census, projection and control definitions this one inherits
      - ledger/corrections/CORR-20260824-cc2d27.yaml (5583 -> 3103)
      - ledger/corrections/CORR-20260824-e0088c.yaml (2094 -> 2089)
      - ledger/corrections/CORR-20260824-c1c8b1.yaml (the overstated `isolating_draw_per_component` string for step_delta)
      - ledger/corrections/CORR-20260824-a6fc43.yaml (EV-DIFFP-b878aa `run_ids` and its note)
      - ledger/corrections/CORR-20260824-ad7f2c.yaml (the goal head's `latest_verified_commit` and the FALSE assertion attached to it)
    corrected_values_that_bind_this_contract: >-
      READ THE FIVE CORRECTIONS BEFORE QUOTING ANY INTEGER FROM A BATCH-1 OR BATCH-2
      ARTIFACT. In particular: E6 step_range (0,0) conditions_satisfied is 2089 and NOT
      the 2094 that BATCH-f8bf86's execution report states in three places
      (CORR-20260824-e0088c); the family-(a) figure is 3103 and NOT 5583
      (CORR-20260824-cc2d27); and `isolating_draw_per_component` for step_delta means
      "no declared family produces a draw differing from ITS OWN SOURCE census entry in
      step_delta alone", which is strictly weaker than the emitted sentence, since
      family (a) DOES produce six draws differing from a MATCHED census entry in
      step_delta alone (CORR-20260824-c1c8b1). THIS CONTRACT'S OWN EMITTED STRINGS MUST
      QUANTIFY OVER WHAT THE FUNCTION COMPUTES (H-7).

  # ====================================================================
  key_components_under_analysis:
    the_six_strict_components: [primitive, length, message_difference, step_delta, block_index, in_linearized_code]
    note: >-
      THESE ARE THE SIX RUN-TIME-DERIVED STRICT KEY COMPONENTS OF THE COMMITTED
      SERIALISATION, as reported by BATCH-efcae7's complete depth-1 lattice. THE
      PRODUCER DERIVES THIS LIST AT RUN TIME FROM THE COMMITTED SERIALISER AND DOES
      NOT HARD-CODE IT FROM THIS CONTRACT; if the derived list differs from the six
      above in name, order or count, THAT IS A STOP and it is reported as a finding
      about the contract rather than worked around (IR-13). A contract that tells a
      producer the answer to a question the producer is supposed to measure is the
      shape of defect CORR-20260824-cc2d27 recorded when a defective integer was
      handed to a reviewer as an instruction.
    ordered_pairs_to_be_decided: >-
      All ordered pairs (X, Y) with X != Y over the derived component list, PER
      PRIMITIVE, which for six components is 30 ordered pairs per primitive and 60 in
      total. Every pair gets a verdict; a pair with no edge gets NO EDGE with the
      reason, and the reasons are not merged into a count.

  # ====================================================================
  ablation_and_projection_mechanism: >-
    UNCHANGED FROM EXP-DIFFP-4b165f AND INHERITED RATHER THAN REDEFINED. An ablated or
    adversarial instrument is built as a DECLARED PROJECTION on the serialised key
    applied INSIDE the orbit minimisation, over the SAME committed class and the SAME
    census, with named (name, value) pairs dropped or re-keyed. NO COMMITTED MODULE IS
    EDITED TO PRODUCE ONE. This is the mechanism BATCH-efcae7's Validator established
    is the SAME FUNCTION as deleting the pair from the serialiser and minimising, so
    the equivalence is established by reading the code and is not re-measured here.
    THE ONE EXTENSION THIS CONTRACT ADDS, DECLARED RATHER THAN ASSUMED: a projection
    may be CONDITIONAL ON THE PRIMITIVE, which the committed `controlpower.project()`
    cannot express and which is exactly why O-E lies outside BATCH-efcae7's declared
    lattice. The extension lives in the NEW module and changes nothing committed.

  # ====================================================================
  controls:

    CTL-FROZEN-3:
      what: >-
        Recompute the sha256 of every committed module under harness/diffpath/, plus
        harness/__init__.py and harness/runner.py, BEFORE the first run and AFTER the
        last, and compare the two sets and each to the committed values quoted in
        EV-DIFFP-b16b01.
      the_criterion_set_is_defined_so_that_PD_5_cannot_recur: >-
        THE CRITERION SET EXCLUDES THIS CONTRACT'S OWN REQUIRED NEW ARTIFACTS BY
        DEFINITION, AND THE EXCLUSION IS WRITTEN INTO THE CONTRACT RATHER THAN LEFT TO
        A PRODUCER TO INFER. harness/diffpath/depgraph.py and
        tests/test_diffpath_depgraph.py are REQUIRED ARTIFACTS OF THIS CONTRACT and are
        NOT in the identity criterion set; their digests are reported SEPARATELY,
        before and after, and their being identical to each other is a self-check and
        never an identity criterion. DEC-20260824-c5bb72 PD-5 adjudicated exactly this:
        folding a contract's own required artifact into an identity criterion designed
        to detect an illegitimate edit to a DIFFERENT object converts a true negative
        into a false positive. BATCH-efcae7's producer made the right call and had to
        declare it as a deviation because the contract did not say so. This contract
        says so.
      known_answer: IDENTICAL BEFORE AND AFTER on every file in the criterion set.
      failure_is_a_STOP: >-
        A single changed digest in the criterion set means a committed file was
        modified, which violates IR-2 and INVALIDATES THE ENTIRE RUN SET. Report the
        file, stop, and do not interpret any result.

    CTL-WF:
      what: >-
        THE WELL-FORMEDNESS GATE, AND IT IS A PRECONDITION RATHER THAN AN INSTRUMENT
        REPAIR. For every object this contract constructs, check that its REDUNDANT
        FIELDS ARE MUTUALLY CONSISTENT: `in_linearized_code` equals the committed
        `sha1_in_linearized_code(dv)` on every SHA-1 object; `length` is consistent
        with `primitive` and with the message-difference word count; `block_index`
        lies in its declared range; and the step range is well formed. A draw failing
        the gate is EXCLUDED AND REPORTED BY COUNT, PER FAMILY AND PER PRIMITIVE,
        NEVER SILENTLY DROPPED. A family EVERY draw of which fails the gate is reported
        as NOT CONSTRUCTIBLE, and its matrix row is reported as NOT CONSTRUCTIBLE --
        never as producing zero detections, which would be a false negative wearing an
        integer.
      why_it_is_in_scope_when_the_instrument_repairs_are_not: >-
        DEC-20260824-c5bb72 `successor_gates` item 2 makes a well-formedness gate a
        PRECONDITION OF EXECUTING ANY FAMILY THAT PERTURBS A FIELD OTHER FIELDS
        DETERMINE, because such a family as specified "would construct an object whose
        redundant fields contradict each other" and its detection "would mean nothing".
        Stage 3 requires six such families. The gate is therefore not an optional
        repair of the instrument but the condition under which stage 3's numbers mean
        anything, and it is built IN THE NEW MODULE, touching nothing committed. IT IS
        NOT VD-3, NOT VD-4, NOT THE {E4}/{E5} RESULT, NOT OBJ-3 AND NOT OBJ-4, ALL OF
        WHICH REMAIN OPEN AND UNREPAIRED BY THIS BATCH.
      known_answer_two_sided: >-
        THE GATE MUST BOTH ACCEPT AND REJECT, AND BOTH SIDES ARE REQUIRED. It must
        ACCEPT all 16 unmodified census entries and all their orbit images under the
        strict generator set. It must REJECT a deliberately constructed malformed
        object -- a SHA-1 entry with `in_linearized_code` flipped and the dv held fixed,
        which is exactly null family (e) as DEC-20260824-af6d5c P-4 specified it. A
        gate that accepts everything is not a gate and the run STOPS.

    CTL-DEP:
      what: >-
        THE FUNCTIONAL-DEPENDENCY GRAPH. For each ordered pair (X, Y) of derived strict
        key components, per primitive, decide whether Y is a DETERMINISTIC FUNCTION OF
        X on the declared object population: whether, grouping the population by X's
        value, Y is constant within every group.
      every_edge_needs_two_things_and_this_is_hard_term_H_1: >-
        (a) A WRITTEN DERIVATION from the committed source -- which function computes
        Y, from what, and why X determines its inputs -- committed as text in
        dependency-graph-result.json under that edge; and (b) AN EMPIRICAL WITNESS: the
        population size, the number of distinct X-groups, and the number of groups in
        which Y is constant, as integers.
        AN EDGE WITH A WITNESS AND NO DERIVATION IS LABELLED `empirical_only` AND THE
        WORD "THEOREM" MAY NOT BE USED FOR IT ANYWHERE IN ANY ARTIFACT OF THIS BATCH.
        AN EDGE WITH A DERIVATION AND A FAILING WITNESS IS A CONTRADICTION AND IS A
        STOP: report both, do not choose.
      the_declared_object_population: >-
        DECLARED HERE SO THE GRAPH'S SCOPE IS FIXED BEFORE IT IS COMPUTED. (i) the 16
        census entries; (ii) every orbit image of every entry under the strict
        generator set; (iii) every family-(d) draw the committed
        `controlpower` construction produces at the eight declared seeds, both
        deterministic and seeded arms; (iv) the 520 in-code perturbed SHA-1 objects the
        D-SHA1-INCODE sub-arm constructs. Population sizes are REPORTED AS INTEGERS per
        primitive and the graph's every claim is scoped to them.
      counterexample_certificate: >-
        A PAIR THE POPULATION REFUTES IS THE MOST VALUABLE OUTPUT THIS CONTROL CAN
        PRODUCE AND IS REPORTED IN FULL: the two objects, their X values, their Y
        values, and their provenance. It is a COUNTEREXAMPLE CERTIFICATE under
        docs/claims-and-verification.md and it is archived whether or not it changes a
        verdict.
      pre_registered_expectation: >-
        AT LEAST ONE EDGE IS EXPECTED AND ITS IDENTITY IS PRE-REGISTERED:
        in_linearized_code = f(message_difference) on SHA-1 objects at full step range,
        which TASK-20260824-e9d21a measured on 960 objects with ZERO exceptions. THAT
        MEASUREMENT IS AN INPUT AND ITS REPRODUCTION IS EXPECTED; WHAT IS NOT YET DONE
        AND IS THIS CONTROL'S REAL WORK IS THE DERIVATION.

    CTL-GRAPH-NULL:
      what: >-
        THE NULL-OBJECT CONTROL FOR THE EDGE DETECTOR, AND IT RUNS BEFORE ANY EDGE IS
        BELIEVED. Run the identical edge-detection procedure over a population where
        the dependency is ABSENT BY CONSTRUCTION, and require it to return NO EDGE.
      the_null_populations_at_least_two_are_required:
        - >-
          THE MD5 SUB-POPULATION for the pair (message_difference,
          in_linearized_code): on MD5 the flag has no defining function of the message
          difference in the committed source. If the detector reports an edge here it
          is reporting a property of a SMALL POPULATION rather than a dependency, and
          the reason -- 8 entries, one constant flag value -- must be named.
        - >-
          A SYNTHETIC INDEPENDENT-COORDINATE POPULATION: objects whose components are
          drawn independently within their declared ranges, subject to CTL-WF. The
          detector must return NO EDGE for every pair. If it returns an edge, THE
          DETECTOR IS VACUOUS AT THIS POPULATION SIZE and the run STOPS and says so.
      why_this_is_non_optional: >-
        docs/inventor-protocol.md requires a null-object control BEFORE belief. A
        procedure that reports "Y is constant within every X-group" will report an edge
        for ANY pair whenever the population has few enough distinct X values, and this
        program has already been burned once by an integer that was true and did not
        mean what a reader would take it to mean.

    CTL-PART:
      what: >-
        THE RE-PARTITION, DERIVED FROM THE GRAPH ALONE AND THEN COMPARED. For each of
        the six depth-1 rows, assign exactly one class using ONLY (i) the graph from
        CTL-DEP and (ii) the DECLARED PERTURBATION of each declared null family, read
        from the committed contract EXP-DIFFP-4b165f and the committed module. The five
        classes are PROVABLY_UNDETECTABLE_BY_ANY_FAMILY, NOT_PROBED_BY_A_DECLARED_FAMILY,
        PROBED_AND_GENUINELY_NOT_DETECTED, ENTAILED_BY_THE_PERTURBING_FAMILYS_OWN_DECLARATION,
        and CONTINGENT_ON_THE_INSTRUMENT. Each row carries the rule that assigned it.
      the_ordering_is_hard_term_H_2: >-
        THE DERIVATION IS WRITTEN TO ITS OWN FILE, `partition-derived.json`, AND THAT
        FILE IS COMPLETE BEFORE BATCH-efcae7's VERDICT COLUMN IS READ FOR COMPARISON.
        The comparison is written to a SECOND file, `partition-compared.json`. The
        producer states the order plainly and states what that statement rests on --
        which, exactly as BATCH-efcae7's reviewers said of their own
        derivation-before-reading, is an honest report of read order that no tool here
        can check. IT IS CORROBORATION, NOT PROOF. Say so in those words.
      the_pre_registered_target: >-
        provably undetectable 1 (in_linearized_code); not probed 3 (primitive, length,
        block_index); probed and genuinely not detected 0; entailed by construction 1
        (message_difference); contingent on the instrument 1 (step_delta). SUMS TO SIX.
        QUOTED FROM DEC-20260824-c5bb72 AND EV-DIFFP-b16b01 AND MEASURED BY THAT
        SESSION, NOT BY THIS COORDINATOR (BR-6).
      both_outcomes_are_results_and_are_reported_identically: >-
        REPRODUCING THE PARTITION means the profile is computable from the key's
        structure and the families' declarations, with no charged adjudication at all,
        which is a strictly stronger statement than the measurement that produced it.
        REFUTING IT -- any row whose derived class differs -- means either the graph is
        wrong or BATCH-efcae7's reading was, and WHICH ONE is determined by the
        derivation, not by which record is older. A refutation is written up as fully
        as a reproduction and is not softened.
      it_can_fail_informatively_and_this_is_stated_at_opening: >-
        IF THE GRAPH HAS EXACTLY ONE EDGE AND NO MORE, the partition collapses to what
        is already known, the reversal buys little, and that is a cheap fast negative
        rather than an expensive one. DEC-20260824-c5bb72 rank 1 named this outcome in
        advance and it is not a disappointment.

    CTL-DEPTH2:
      what: >-
        From the graph, classify all fifteen depth-2 subsets of the six components into
        those that BREAK A DEPENDENCY -- deleting a component together with every
        retained component that is a function of it -- and those that do not, with the
        reason per subset. Report all fifteen; do not report a count alone.
      pre_registered_expectation: >-
        EXACTLY ONE dependency-breaking subset, {message_difference,
        in_linearized_code}, which is already BATCH-efcae7's declared multi-deletion
        row 5. QUOTED from EV-DIFFP-b16b01 and DEC-20260824-c5bb72.
      what_this_buys_and_what_it_does_not: >-
        IT BUYS THE DEPTH-2 LATTICE BY ARGUMENT RATHER THAN BY COMPUTE, turning an
        obstruction that read "the depth-2 lattice is unmeasured and unaffordable" into
        a two-row question. IT DOES NOT MEASURE THE FOURTEEN NON-BREAKING SUBSETS, and
        the report must say that in those words: three of them are already MEASURED to
        pass a blind instrument (O-C, O-C-prime and the depth-3 O-C-double-prime,
        TASK-20260824-e9d21a's objects), so "does not break a dependency" NEVER means
        "cannot hide a known-false instrument".

    CTL-OFFDIAG:
      what: >-
        THE FAMILY-BY-ROW MATRIX, RESTRICTED TO THE OFF-DIAGONAL CELLS THE GRAPH MARKS
        AS CAPABLE OF CARRYING INFORMATION, ADJUDICATED TWICE.
      gate: >-
        THIS CONTROL DOES NOT RUN UNTIL CTL-PART HAS COMPLETED AND ITS OUTPUT IS
        WRITTEN. If CTL-PART stops, this control does not execute and its run is
        reported as GATED-NOT-RUN, which is a declared outcome and not a failure.
      the_families: >-
        SIX FAMILIES d_X, ONE PER DERIVED STRICT KEY COMPONENT, each perturbing X and
        holding EVERY other key component fixed, every draw passing CTL-WF.
        d_message_difference IS THE COMMITTED FAMILY (d) AND IS REUSED, NOT REBUILT.
        The other five are constructed in the new module by the declared projection
        mechanism's dual -- a perturbation rather than a deletion -- and each carries
        its PERTURBATION DECLARATION as text: exactly which components it moves and
        which it holds. A family whose declaration cannot be honoured because the
        component is determined by another (a live possibility for in_linearized_code
        and for primitive) is reported as NOT CONSTRUCTIBLE with the derivation that
        makes it so, and that is a FIRST-CLASS RESULT, not a gap.
      the_exclusions_and_every_one_carries_its_reason:
        diagonal: >-
          CELL (d_X, row deleting X) IS EXCLUDED AND ITS VALUE IS STATED AS A THEOREM,
          on the general rule TASK-20260824-e9d21a extracted at J13 and this program
          adopted: a family perturbing exactly the set S while holding every other key
          component fixed makes the row deleting S DETECTED BY CONSTRUCTION. Buying
          those six cells with compute would be paying for answers that are already
          proved.
        forced_by_the_graph: >-
          CELL (d_X, row deleting Y) IS EXCLUDED WHERE THE GRAPH FORCES ITS VALUE --
          where Y is a function of a component the row retains, or where the row
          retains a function-image of X so that deleting Y cannot change the verdict.
          Each excluded cell carries the edge that forces it.
        not_constructible: >-
          Cells whose family is NOT CONSTRUCTIBLE under CTL-WF are excluded and
          reported as such, never as zeros.
      the_two_instruments: >-
        (1) THE HONEST ADJUDICATOR, unmodified. (2) O-E, the per-primitive-blind
        known-false instrument, REUSED from TASK-20260824-e9d21a's committed
        constructions (IR-11).
      the_reported_quantity: >-
        THE COUNT OF DIFFERING CELLS, reported TOGETHER WITH the total number of cells
        adjudicated, the full excluded-cell list with each exclusion's reason, and the
        per-cell table itself. NEVER AS A FRACTION AND NEVER AS A PASS (IR-10, H-5).
      the_two_pre_distinguishable_outcomes: >-
        ZERO DIFFERING CELLS means the power profile over the adjudicated cells is a
        function of the families' construction and of the dependency graph and carries
        NO information about the instrument. ANY DIFFERING CELL is a place where a
        verdict is contingent on the instrument. BOTH ARE RESULTS AND NEITHER IS A
        DISAPPOINTMENT. Neither licenses a statement about MD5, SHA-1 or any
        difference space.

    CTL-NULL-OBJ:
      what: >-
        THE NULL-OBJECT CONTROL FOR THE COUNTING RULE ITSELF, RUN THROUGH THE IDENTICAL
        COUNTING CODE AS CTL-OFFDIAG.
      the_three_instruments_and_their_known_answers:
        honest_versus_honest: >-
          The honest adjudicator against itself. KNOWN ANSWER: ZERO differing cells. A
          nonzero answer means the adjudication is not deterministic at the declared
          seeds and IS A STOP.
        always_member: >-
          A degenerate instrument returning MEMBER for every object. KNOWN ANSWER:
          THE MAXIMAL differing-cell count over the adjudicated set, i.e. it differs
          from the honest instrument on every cell the honest instrument reports as
          NOT DETECTED.
        always_non_member: >-
          A degenerate instrument returning NON-MEMBER for every object. KNOWN ANSWER:
          it differs from the honest instrument on every cell the honest instrument
          reports as DETECTED, and it FAILS CTL-PLANT outright, which must be reported
          rather than hidden by the counting rule.
      failure_is_a_STOP_and_this_is_hard_term_H_6: >-
        IF THE TWO DEGENERATE INSTRUMENTS DO NOT PRODUCE THE PREDICTED EXTREMES, THE
        COUNTING RULE IS BROKEN AND EVERY CTL-OFFDIAG NUMBER IS UNINTERPRETABLE. Stop,
        report the counting rule's actual behaviour, and do not report a differing-cell
        count. A count with no demonstrated capacity to be large is the exact shape of
        the 96/96-and-0/3000 failure this goal exists to stop repeating.

    CTL-RC1:
      what: >-
        DISCHARGE RC-1 BY RE-SCORING, NEVER BY EDITING. The committed detection rule
        computes `strengthened_detected` from the family-(d) PRIMARY arm only. This
        control re-scores the same rows in the NEW module with the D-SHA1-INCODE
        sub-arm CARRIED IN, over the off-diagonal set, and reports whether O-E is then
        caught -- alongside the committed rule's own unmodified verdicts, side by side
        and never replacing them.
      its_outcome_is_known_in_advance_and_it_is_reported_as_such: >-
        TASK-20260824-e9d21a MEASURED that O-E returns MEMBER on 520 of 520 in-code
        objects where the honest adjudicator returns 0 of 520. THE FOLD THEREFORE
        CATCHES O-E WITH CERTAINTY AND NOT AS A QUESTION, and any report of this control
        that reads as a discovery is a contract violation. WHAT IS GENUINELY OPEN AND IS
        THIS CONTROL'S REAL CONTENT: whether the fold touches ANY OF THE OTHER FOUR
        SURVIVORS (O-D, O-C, O-C-prime, O-C-double-prime), which are blind to
        block_index, length and the flag rather than to the message difference and which
        no in-code arm can see. THE PRE-REGISTERED ANSWER IS THAT IT TOUCHES NONE OF
        THEM. Measuring that it touches none is the honest scope of what RC-1 buys.
      it_does_not_repair_the_committed_module: >-
        harness/diffpath/controlpower.py IS COMMITTED AND IS NOT EDITED (IR-2). The
        re-scored rule lives in harness/diffpath/depgraph.py, the committed rule's
        outputs are reported unchanged beside it, and no artifact of this batch states
        or implies that the committed rule has been fixed.

  # ====================================================================
  independent_variables:
    - name: key_component
      levels: the six derived strict key components, per primitive
    - name: primitive
      levels: [md5, sha1]
      note: EVERY GRAPH EDGE, EVERY PARTITION CLASS AND EVERY MATRIX CELL CARRIES ITS PRIMITIVE SCOPE. A result stated without one is a contract violation (H-4).
    - name: instrument
      levels: [honest, O-E, always_member, always_non_member]
    - name: perturbing_family
      levels: the six families d_X, of which d_message_difference is the committed family (d) reused
    - name: mode
      levels: [strict]
      note: >-
        STRICT ONLY, DECLARED AT OPENING RATHER THAN DISCOVERED IN THE REPORT.
        BATCH-efcae7's family-(d) column was strict only and the permissive column is
        recorded as NOT MEASURED rather than zero; TASK-20260824-e9d21a's own permissive
        sweep timed out at 580 s because E2 multiplies the SHA-1 variant list by 32.
        PERMISSIVE MODE IS OUT OF SCOPE HERE AND ITS CELLS ARE EMITTED AS null, NEVER
        AS 0 (H-8). This is a budget decision recorded as one, and it is NOT evidence
        that permissive mode would behave the same way.

  # ====================================================================
  hard_terms:
    H-1: >-
      EVERY CLAIMED DEPENDENCY EDGE CARRIES A WRITTEN DERIVATION FROM COMMITTED SOURCE
      **AND** AN EMPIRICAL WITNESS WITH ITS POPULATION SIZE AS AN INTEGER. An edge with
      a witness and no derivation is labelled `empirical_only`, and the words "theorem",
      "provable", "provably" and "impossible" MAY NOT BE USED FOR IT in any artifact of
      this batch. This is docs/claims-and-verification.md's refutation-artifact ordering
      applied to a positive claim: 960 objects with zero exceptions is a witness, not a
      proof, and a partition class named PROVABLY_UNDETECTABLE must rest on the
      derivation.
    H-2: >-
      THE PARTITION IS DERIVED BEFORE IT IS COMPARED, IN THAT ORDER, IN TWO SEPARATE
      FILES, AND THE ORDER IS DECLARED WITH AN HONEST STATEMENT OF WHAT THE DECLARATION
      RESTS ON. `partition-derived.json` is complete before `partition-compared.json`
      is begun. The producer states that no tool here can check read order and that the
      claim is corroboration rather than proof, in those words.
    H-3: >-
      EVERY EXCLUDED MATRIX CELL CARRIES ITS EXCLUSION REASON, and a cell excluded as a
      theorem carries the derivation or the graph edge that forces it. An excluded cell
      is never reported as a measured cell and never enters the differing-cell count's
      denominator silently.
    H-4: >-
      EVERY GRAPH EDGE, EVERY PARTITION CLASS, EVERY MATRIX CELL AND EVERY VERDICT
      CARRIES ITS PRIMITIVE SCOPE AND THE CENSUS COMPLETENESS BESIDE IT (readable 0 /
      quarantined_not_read 1 / acquisition_gap 8, NEVER SUMMED; shadow_planted 16
      carried separately). DEC-20260824-c5bb72's successor gate is explicit: a bare
      DETECTED or NOT DETECTED verdict quoted without its basis and its primitive scope
      is the 96/96-and-0/3000 failure one layer up.
    H-5: >-
      THE DIFFERING-CELL COUNT IS NEVER REPORTED AS A FRACTION, AS A PASS, AS A SCORE
      OR AS A MARGIN. It is reported as an integer beside the number of cells
      adjudicated, the excluded-cell list, and the per-cell table.
    H-6: >-
      CTL-NULL-OBJ's TWO DEGENERATE INSTRUMENTS MUST PRODUCE THE PREDICTED EXTREMES OR
      THE RUN STOPS AND NO DIFFERING-CELL COUNT IS REPORTED.
    H-7: >-
      EVERY EMITTED DESCRIPTIVE STRING QUANTIFIES OVER EXACTLY WHAT THE FUNCTION THAT
      EMITS IT COMPUTES. CORR-20260824-c1c8b1 records the cost of the alternative: a
      sentence that dropped the word OWN quantified over "a census entry" and "no
      declared family", which is strictly stronger than what was computed, and a reader
      was shown DETECTED beside an isolation claim of NO.
    H-8: >-
      AN UNMEASURED CELL, COLUMN OR MODE IS EMITTED AS `null` AND NEVER AS INTEGER 0,
      in every JSON artifact, so a machine consumer reading the JSON alone cannot
      misread it. DEC-20260824-c5bb72 `corrections_owed` routed exactly this defect from
      BATCH-efcae7 and it is fixed HERE, in this contract's own artifacts, without
      editing the committed one.
    H-9: >-
      AGGREGATE METRIC KEYS ARE NAMED AS AGGREGATES. A per-primitive total is not given
      a name that reads per-object. This is the second half of the same routed defect.
    H-10: >-
      RUN LOCATION IS A CONTRACT TERM AND IT IS `experiments/EXP-DIFFP-04082e/runs/<RUN-ID>/`.
      See `run_location` below. This is the first contract of this goal to name one, and
      DEC-20260824-c5bb72 records that the omission -- not the producer -- was the
      defect in batches 1 and 2.
    H-11: >-
      THE PRODUCER COMPOSES NO VERDICT. It records observations, tables, partitions,
      derivations and integers, and states its own limits. It does not decide whether
      the instrument is validated, whether the strengthening bought anything, whether
      any path is new, or anything about either difference space.

  # ====================================================================
  run_location:
    root: experiments/EXP-DIFFP-04082e/runs/<RUN-ID>/
    why_it_is_named_here: >-
      BECAUSE tools/validate_ledger.py REGISTERS RUNS FROM EXACTLY ONE GLOB,
      `experiments/*/runs/*/manifest.yaml`, AND THIS CAMPAIGN HAS NEVER WRITTEN THERE.
      Eleven run directories -- six under BATCH-f8bf86's producer task and five under
      BATCH-efcae7's -- lie outside it, so no evidence record of this goal has ever been
      able to cite a run by id, and EV-DIFFP-b16b01 carries `run_ids: []` for that
      reason. 281 experiment directories in this repository already use the root above.
      A PRODUCER THAT IS NOT TOLD WHERE TO WRITE CANNOT BE AT FAULT FOR WRITING WHERE THE
      HARNESS DOES NOT LOOK, and that omission was this Coordinator role's.
    the_measurement_that_must_happen_before_the_snapshot: >-
      WRITING RUNS WHERE THE VALIDATOR LOOKS MEANS THEY WILL BE SCHEMA-CHECKED BY
      `check_run` FOR THE FIRST TIME IN THIS CAMPAIGN, AND THAT MAY SURFACE THE
      INHERITED DEFECT THAT harness/runner.py DEFINES ITS INFERENCE BLOCK TWICE. THE
      PRODUCER MUST RUN tools/validate_ledger.py AFTER ITS RUNS EXIST AND BEFORE THE
      SNAPSHOT ARCHIVE, AND RECORD THE OUTPUT VERBATIM IN ITS EXECUTION REPORT --
      whether it passes or fails. TRADING ONE VALIDATOR ERROR FOR FIVE DIFFERENT ONES IS
      NOT A REPAIR, AND THE OBJECTION THAT IT MIGHT IS A PREDICTION UNTIL SOMEONE
      MEASURES IT.
    what_the_producer_does_if_check_run_rejects_the_manifests: >-
      IT DOES NOT EDIT harness/runner.py (IR-2) AND IT DOES NOT HAND-EDIT A MANIFEST.
      It writes a `manifest-supplement.yaml` beside each manifest carrying the complete
      AGENTS.md Artifact Policy field set -- which is BATCH-efcae7's own precedent,
      recorded in DEC-20260824-c5bb72's validity check -- reports the rejection verbatim
      as an INFRASTRUCTURE FINDING, and continues. The rejection is never a mathematical
      result in either direction. The ledger close decides whether `run_ids` may be
      cited; the producer decides nothing about it.
    the_eleven_existing_directories_are_not_touched_by_this_contract: >-
      THEIR RELOCATION IS A DECLARED SUCCESSOR TASK AND NOT THIS BATCH'S WORK, AND THE
      REPAIR IS A COPY, NEVER A MOVE: moving them would break two committed snapshot
      receipts' `path_sha256` bindings permanently and invalidate run-index.json's
      task-relative keys. That task must declare both source and destination paths at
      opening, MEASURE `check_run` acceptance BEFORE committing, state which copy
      `path_sha256` binds thereafter, and STOP AND REPORT if the copies cannot pass
      without editing an immutable manifest. NO TASK OF BATCH-145531 TOUCHES THEM.

  # ====================================================================
  metrics:
    - name: dependency_edges_per_ordered_pair
      unit: EDGE | NO EDGE | empirical_only, per ordered pair per primitive
      note: 60 ordered-pair verdicts in total. Reported as a table, never as a count of edges alone.
    - name: edge_witness_population_size
      unit: integer objects, per primitive
    - name: edge_witness_groups_constant
      unit: integer groups constant / integer groups total
    - name: counterexample_certificates
      unit: integer, with every certificate reported in full
    - name: graph_null_control_edges_returned
      unit: integer edges returned on each null population; known answer 0
    - name: partition_class_per_row
      unit: one of five class names, per row, with the assigning rule
    - name: partition_agreement_with_BATCH_efcae7
      unit: integer rows agreeing / 6, with every disagreement named on both sides
    - name: depth2_subsets_breaking_a_dependency
      unit: integer / 15, with all fifteen classified and reasons given
    - name: offdiagonal_cells_adjudicated
      unit: integer
    - name: offdiagonal_cells_excluded_by_reason
      unit: integer per reason (diagonal | forced_by_the_graph | not_constructible)
    - name: differing_cells_honest_versus_O_E
      unit: integer, beside cells adjudicated
    - name: differing_cells_null_object_controls
      unit: integer for each of honest-vs-honest, always_member, always_non_member
    - name: rc1_refold_verdict_change_per_instrument
      unit: CAUGHT | STILL PASSES, per surviving instrument (O-E, O-D, O-C, O-C-prime, O-C-double-prime)
    - name: wellformedness_gate_rejections
      unit: integer rejected / integer constructed, per family per primitive
    - name: frozen_digest_identity
      unit: integer identical / integer criterion files, before and after
    - name: wrapper_measured_wall_seconds_and_peak_rss
      unit: seconds, MiB, per run, with unspent ceilings reported AS UNSPENT

  heuristic_under_test: null
  heuristic_under_test_note: >-
    NULL, AND STATED RATHER THAN LEFT BLANK. This experiment carries no asymptotic
    claim, no conditional result and no numbered heuristic, so CLAUDE.md's
    heuristic-validation pairing requirement has nothing to attach to and the four
    supported-promotion gates are structurally unmet by a batch of this kind. NO RECORD
    OF THIS BATCH MAY REACH `supported`.

  # ====================================================================
  preregistered_prediction:
    note: >-
      THE COORDINATOR'S OWN ITEM-BY-ITEM PRIOR IS **NOT** WRITTEN HERE AND IS NOT
      WRITTEN IN batch.yaml EITHER. It is SEALED at
      coordination/goals/GOAL-DIFFP-84d641/sealed-priors/BATCH-145531/coordinator-prior-part-1.yaml,
      OUTSIDE THE BATCH DIRECTORY AND OUTSIDE EVERY REVIEWER READ SCOPE, because
      DEC-20260824-c5bb72 PD-3 measured that round 2's seal leaked through the review
      plan's mandatory `coordinator_prior` field into BOTH reviewers. The predictions
      below are only those a PRODUCER must be scored against, they are the ones already
      published in committed records, and they are quoted with their provenance.
    P-A:
      claim: The dependency graph contains the edge in_linearized_code = f(message_difference) on SHA-1 objects at full step range.
      provenance: MEASURED BY TASK-20260824-e9d21a on 960 objects with zero exceptions; quoted from red-team-report.yaml J9 and EV-DIFFP-b16b01. NOT MEASURED BY THIS COORDINATOR.
      falsifier: any SHA-1 object in the declared population whose flag differs from the committed sha1_in_linearized_code(dv).
    P-B:
      claim: The derived partition reproduces 1 / 3 / 0 / 1 / 1 over the six depth-1 rows.
      provenance: DEC-20260824-c5bb72 `per_component_power_table` and EV-DIFFP-b16b01 `obstruction.value`.
      falsifier: any row whose graph-derived class differs from the class that record assigns.
    P-C:
      claim: Exactly one depth-2 subset breaks a dependency, namely {message_difference, in_linearized_code}.
      provenance: red-team-report.yaml J9; EV-DIFFP-b16b01.
      falsifier: a second dependency-breaking subset, or zero.
    P-D:
      claim: The RC-1 refold CATCHES O-E and touches none of O-D, O-C, O-C-prime, O-C-double-prime.
      provenance: red-team-report.yaml J8 measured outcomes; DEC-20260824-c5bb72 rank 2.
      falsifier: O-E still passing the refolded rule, or any of the other four changing verdict.
    P-E:
      claim: NONE IS OFFERED FOR THE DIFFERING-CELL COUNT, DELIBERATELY.
      why: >-
        NO COMMITTED RECORD PREDICTS IT AND THE COORDINATOR'S OWN GUESS IS SEALED. A
        producer scored against a Coordinator's guess about the headline number is being
        told the answer, which is exactly the channel CORR-20260824-cc2d27 recorded when
        a defective integer reached a reviewer as an instruction. The producer measures
        it and reports it; the close scores the sealed prior against it.

  # ====================================================================
  scale_relevance: >-
    NONE IS CLAIMED, AND THE ABSENCE IS STATED RATHER THAN LEFT TO INFERENCE. This
    contract runs at census size zero against a 16-entry synthetic shadow population and
    measures a property of this program's own adjudication instrument. It does not run
    at cryptographic scale, it makes no statement that transfers to one, and nothing it
    produces bears on MD5's or SHA-1's difference space, on any published
    characteristic, on novelty, or on the security of any deployed system. THE ONE
    STRUCTURAL STATEMENT THAT MIGHT LOOK LIKE SCALE -- that a SHA-1 membership key's
    apparent 2560 bits are at most 512 plus one flag bit on IN-CODE objects -- IS SCOPED
    TO THIS CENSUS, WHERE EVERY PLANTED SHA-1 ENTRY IS IN THE LINEARIZED CODE, and is
    offered to GOAL-SHA1-001 with that scope attached rather than asserted.

  tail_checks:
    - >-
      THE FLATNESS CHECK, CARRIED FORWARD AS A STANDING TERM. BATCH-efcae7's outcome was
      EXACTLY FLAT in k across all five values because membership is exact equality on a
      tuple. Any quantity this contract reports that is exactly flat in a parameter
      supposed to modulate it MUST BE FLAGGED AS AN ARTIFACT TELL under
      docs/inventor-protocol.md section 3 and must not be cited as robustness. The
      5200-draw figure MAY NEVER BE QUOTED as evidence that rejection is robust to
      perturbation size.
    - >-
      THE SMALL-POPULATION CHECK ON EVERY EDGE. An edge detected over a population with
      few distinct X values is a property of the population. Every edge reports the
      number of DISTINCT X VALUES beside the group-constancy count, and an edge whose
      X takes fewer than three distinct values in the population is flagged
      LOW_DISTINCT_X and may not be labelled a theorem on the witness alone.
    - >-
      THE WEIGHT-1 CHECK. All eight planted MD5 entries carry a WEIGHT-1 message
      difference, which no real MD5 collision characteristic has. Any MD5 result whose
      value depends on that structure says so beside the number.

  replication:
    within_this_contract: >-
      THE PARTITION IS DERIVED TWICE BY DIFFERENT ROUTES AND BOTH ARE REPORTED: once
      from the graph plus the family declarations (CTL-PART), and once read from
      BATCH-efcae7's committed verdict column. Agreement is the interesting case and
      disagreement is the more interesting one.
    across_sessions: >-
      TWO SIBLING-BLIND INDEPENDENT REVIEW SESSIONS re-derive the load-bearing integers
      under BATCH-145531's review plan. Agreement between them counts as TWO
      observations only where mutual blindness demonstrably held, and as ONE where a
      common dependence exists. That composition is the ledger close's and not the
      producer's.
    what_is_NOT_replicated_and_is_named: >-
      TASK-20260824-e9d21a's five surviving adversarial instruments were built ONCE by
      ONE session and no second session has re-run them. THIS CONTRACT RE-RUNS EXACTLY
      ONE OF THEM, O-E, AND ONLY ON THE OFF-DIAGONAL SET. The other four remain
      unreplicated, which is why DEC-20260824-c5bb72 took `weaken` rather than
      `reject_scoped`, and nothing in this batch changes that.

  # ====================================================================
  run_plan:
    total_runs: 5
    run_1:
      id_suffix: frozen-and-dependency-graph
      controls: [CTL-FROZEN-3 pre-run, CTL-WF two-sided, CTL-DEP, CTL-GRAPH-NULL]
      ceiling_seconds: 60
      gate: none
      emits: dependency-graph-result.json, wellformedness-gate-result.json
    run_2:
      id_suffix: partition-derived-then-compared
      controls: [CTL-PART, CTL-DEPTH2]
      ceiling_seconds: 45
      gate: RUN 1 completed and its graph written
      emits: partition-derived.json THEN partition-compared.json, depth2-classification.json
    run_3:
      id_suffix: offdiagonal-honest-and-known-false
      controls: [CTL-OFFDIAG]
      ceiling_seconds: 105
      gate: >-
        RUN 2 COMPLETED AND `partition-compared.json` WRITTEN. If run 2 stopped, this
        run is reported as GATED-NOT-RUN, which is a declared outcome and not a failure
        and not evidence about anything.
      emits: offdiagonal-matrix-result.json
    run_4:
      id_suffix: null-object-counting-controls
      controls: [CTL-NULL-OBJ]
      ceiling_seconds: 60
      gate: RUN 3 completed or GATED-NOT-RUN; the counting rule is exercised either way
      emits: null-object-control-result.json
    run_5:
      id_suffix: rc1-refold-and-frozen-recheck
      controls: [CTL-RC1, CTL-FROZEN-3 post-run]
      ceiling_seconds: 60
      gate: RUN 3 completed
      emits: rc1-refold-result.json, frozen-recheck-result.json
  run_plan_arithmetic: >-
    60 + 45 + 105 + 60 + 60 = 330 seconds of declared per-run ceilings, inside the
    420 s task budget of TASK-20260824-68ba87. The measured proxy for the whole
    substrate is 33 s on one core (TASK-20260824-e9d21a J12), so the ceilings are an
    order of magnitude above the expectation, deliberately. UNSPENT CEILINGS ARE
    REPORTED AS UNSPENT AND ARE NEVER REALLOCATED WITHOUT A VERSIONED
    protocol_amendment.

  budget:
    executor_task_wall_clock_seconds: 420
    memory_gb: 4
    maximum_runs: 5
    maximum_runs_definition: >-
      COUNTS CHARGED EXPERIMENT RUNS UNDER THIS CONTRACT -- a run directory under
      experiments/EXP-DIFFP-04082e/runs/, a RUN-* identifier, a manifest, an armed
      deadline and a consumed ceiling. IT DOES NOT COUNT script executions, read-only
      probes, cold re-derivations or unit-test invocations. Defined explicitly because
      round 1's two reviewers read the field two different ways
      (DEC-20260824-af6d5c `budget_adjudication.red_team_run_count`).
    a_timeout_is_never_a_result: >-
      A TIMEOUT, CRASH, CEILING HALT OR IMPLEMENTATION FAILURE IS INFRASTRUCTURE SIGNAL
      AND NEVER A NEGATIVE MATHEMATICAL RESULT AND NEVER A FINDING ABOUT THE
      INSTRUMENT'S POWER, IN EITHER DIRECTION (AGENTS.md rule 5).

  # ====================================================================
  stopping_rules:
    - CTL-FROZEN-3 reports a changed digest in the criterion set -- STOP, name the file, interpret nothing (IR-2).
    - CTL-WF accepts the deliberately malformed object -- STOP, the gate is not a gate.
    - CTL-GRAPH-NULL returns an edge on the independent-coordinate population -- STOP, the edge detector is vacuous at this population size, say so.
    - CTL-DEP produces an edge with a derivation and a failing witness -- STOP, report both, choose neither.
    - CTL-NULL-OBJ's degenerate instruments do not produce the predicted extremes -- STOP, report the counting rule's behaviour, emit no differing-cell count (H-6).
    - The re-expressed O-E disagrees with the committed j8_results.json integers -- STOP, report as an infrastructure finding (IR-11).
    - The run-time-derived strict key component list differs from the six named in this contract -- STOP and report it as a finding about the contract (IR-13).
    - A ceiling is reached -- record the partial state, report the ceiling as consumed, and NEVER extend it in-run.
    - Work turns out to be validating a characteristic-search solver rather than measuring this instrument -- STOP and report for handoff to GOAL-MD5-001 (IR-9).

  # ====================================================================
  invalidation_rules:
    IR-1: >-
      DO NOT READ, PARSE, EXTRACT, FETCH OR RECONSTRUCT
      coordination/goals/GOAL-MD5-001/quarantine/** OR THE SAME CONTENT BY ANY OTHER
      ROUTE -- network, package index, a model's own memory reproduced into a file, or
      any retrieval index. This contract does not even re-hash the payload. Every task
      attests non-reading AND NAMES ITS MECHANISM. A breach invalidates the run set and
      is reported to GOAL-MD5-001 as a cross-goal contamination finding.
    IR-2: >-
      NO COMMITTED FILE UNDER harness/ MAY BE MODIFIED, AND THAT NOW INCLUDES
      harness/diffpath/controlpower.py. Only harness/diffpath/depgraph.py and
      tests/test_diffpath_depgraph.py may be written. tests/test_harness.py,
      tests/test_diffpath_adjudicator.py and tests/test_diffpath_controlpower.py are
      explicitly out of scope. CTL-FROZEN-3 measures this rule.
    IR-3: >-
      NO NETWORK ACQUISITION BY ANY ROUTE. AMD-20260824-DIFFP-ACQ-1 stands unchanged:
      Tier A refused by every route, TIER B BLOCKED PENDING A GOAL-MD5-001 DECISION --
      BLOCKED, NOT CLOSED -- Tier C permitted. No task under this contract holds
      web_search; fetching via the shell would route around a declared role boundary.
    IR-4: NO SEARCH over the difference space, no collision attempt, no cost projection, no attack-complexity figure of any kind.
    IR-5: STRICT AND PERMISSIVE ARE SEPARATE FIELDS AND ARE NEVER MERGED. Permissive is out of scope here and its cells are emitted as null (H-8).
    IR-6: >-
      NO CONTROL IS REPAIRED IN-RUN AFTER ITS DATA IS SEEN. Changing a family, a
      drop-set, a seed, a criterion, an exclusion rule or the counting rule after
      observing an outcome requires a versioned protocol_amendment.
    IR-7: >-
      EVERY RUN MANIFEST CARRIES code_path_fingerprint, AN ARMED DEADLINE, AND THE
      LITERAL EXPERIMENT ID `EXP-DIFFP-04082e` AT BOTH run.experiment_id AND
      run.inputs.parameters.experiment_id, PLUS THE FULL AGENTS.md ARTIFACT POLICY FIELD
      SET (in a manifest-supplement.yaml if the wrapper's own block is incomplete).
    IR-8: THE PRODUCER COMPOSES NO VERDICT (H-11).
    IR-9: >-
      IF THIS WORK TURNS OUT TO BE VALIDATING A CHARACTERISTIC-SEARCH SOLVER RATHER THAN
      MEASURING THIS GOAL'S OWN ADJUDICATION INSTRUMENT, STOP AND REPORT IT FOR HANDOFF
      TO GOAL-MD5-001. That ends a task, not this goal, and never both silently.
    IR-10: >-
      NEVER REPORT A PASS. Not "the suite passed", not "the graph checked out", not "N
      of M cells". The required forms are a per-pair edge table, a per-row partition with
      its assigning rule, a per-cell matrix with its exclusions, and integers with their
      populations.
    IR-11: >-
      O-E IS REUSED FROM TASK-20260824-e9d21a's COMMITTED constructions/, NOT REBUILT.
      Any mechanical re-expression is checked against the committed j8_results.json
      integers and a disagreement is a STOP.
    IR-12: A TIMEOUT, CRASH OR INFRASTRUCTURE FAILURE IS NEVER A MATHEMATICAL RESULT IN EITHER DIRECTION.
    IR-13: >-
      THE STRICT KEY COMPONENT LIST IS DERIVED AT RUN TIME FROM THE COMMITTED SERIALISER
      AND IS NEVER HARD-CODED FROM THIS CONTRACT. A difference from the six names above
      is a STOP and a finding about the contract.
    IR-14: >-
      NO IDEA-* IDENTIFIER MAY BE MINTED FROM TASK-20260824-873dc9's UNREVIEWED PROPOSAL
      SET, which remains gated pending a review of its Pareto `dominated_by` and
      `sota_delta` honesty and its novelty-status discipline.
    IR-15: >-
      NO RECORD PRODUCED UNDER THIS CONTRACT MAY STATE OR IMPLY THAT THE MD5 LANE IS
      CLOSED, EXHAUSTED, DEPRIORITISED ON THE MERITS OR SCREENED OUT. IT IS BLOCKED,
      WITH A NAMED UNBLOCKING ROUTE INTACT.

  # ====================================================================
  success_criterion: >-
    THIS CONTRACT SUCCEEDS WHEN IT PRODUCES, UNDER RUN DISCIPLINE AT THE DECLARED RUN
    ROOT, ALL OF: (1) a complete 60-cell ordered-pair dependency table per primitive
    with every claimed edge carrying BOTH a derivation and a witness and every
    derivation-less edge labelled `empirical_only`; (2) a null-object control showing
    the edge detector CAN return NO EDGE; (3) a five-class partition of all six depth-1
    rows derived from the graph alone, written before the comparison, with the
    agreement against BATCH-efcae7 reported row by row and every disagreement named on
    both sides; (4) a fifteen-subset depth-2 classification with the dependency-breaking
    subsets named; (5) the off-diagonal matrix adjudicated against the honest instrument
    and against O-E, with the differing-cell count reported beside the cells adjudicated
    and the full excluded-cell list with reasons; (6) null-object counting controls
    demonstrating the count's capacity to be large; and (7) the RC-1 refold's effect on
    each of the five surviving instruments.
    EITHER OUTCOME OF (5) SATISFIES THIS CRITERION. A differing-cell count of zero is a
    measurement that the profile carries no information about the instrument, and a
    nonzero count is a measurement of where it does. A FAILURE OF ANY CONTROL ALSO
    SATISFIES THIS CRITERION provided the failing case is reported with its integer
    counts and its named cause -- including CTL-PART refuting the pre-registered
    partition, which would say that either the graph or BATCH-efcae7's reading is wrong
    and which is more informative than agreement.
    IT DOES NOT SUCCEED BY PRODUCING A PASS, A FRACTION, OR A COUNT WITH NO DEMONSTRATED
    CAPACITY TO BE LARGE.

  falsification_criterion: >-
    THE CONTRACT'S OWN CENTRAL PROPOSITION -- that the depth-1 power profile is
    computable from the membership key's functional-dependency structure and the
    declared families' perturbation declarations, with no charged adjudication -- IS
    FALSIFIED BY ANY ROW WHOSE GRAPH-DERIVED CLASS DIFFERS FROM THE CLASS
    DEC-20260824-c5bb72 ASSIGNS IT, or by any depth-1 verdict the graph cannot classify
    at all. IT IS ALSO FALSIFIED, MORE INTERESTINGLY, IF THE GRAPH TURNS OUT TO BE
    TRIVIAL: if the only edge is the one already known, the partition collapses to what
    is already recorded and the reversal bought little. THAT OUTCOME WAS NAMED IN
    ADVANCE BY DEC-20260824-c5bb72 rank 1 AND IS A CHEAP FAST NEGATIVE RATHER THAN AN
    EXPENSIVE ONE; it is reported as such, and it would promote the full six-by-six
    matrix in the next ranking rather than this program's confidence in the profile.
    SEPARATELY: the claim that any NOT DETECTED verdict is PROVABLY UNDETECTABLE is
    falsified by the absence of a derivation for the edge that forces it, in which case
    the class is `empirical_only` and the word is not used (H-1).

  # ====================================================================
  required_artifacts:
    code:
      - harness/diffpath/depgraph.py -- the ONLY new module. The edge detector and its derivation records; the well-formedness gate; the six d_X family constructors; the off-diagonal cell selector with its exclusion rules; the two degenerate null instruments; the re-scored RC-1 detection rule; and the drivers. IT IMPORTS THE COMMITTED MODULES AND MODIFIES NONE OF THEM.
      - tests/test_diffpath_depgraph.py -- a NEW dedicated test file covering the edge detector against a known-edge and a known-no-edge population, the well-formedness gate on both sides, the exclusion rules, and the counting rule against the degenerate instruments. NO EXISTING TEST FILE IS EDITED.
    results:
      - dependency-graph-result.json -- 60 ordered-pair verdicts per primitive with derivations, witnesses, distinct-X counts, LOW_DISTINCT_X flags, `empirical_only` labels, and every counterexample certificate in full
      - wellformedness-gate-result.json -- the two-sided known answers and the per-family per-primitive rejection counts
      - graph-null-control-result.json -- edges returned on each null population, known answer 0
      - partition-derived.json -- WRITTEN FIRST, from the graph alone, with the rule that assigned each row
      - partition-compared.json -- WRITTEN SECOND, the row-by-row comparison against BATCH-efcae7 with every disagreement on both sides
      - depth2-classification.json -- all fifteen subsets with reasons, and the explicit statement that a non-breaking subset is not thereby safe
      - offdiagonal-matrix-result.json -- the per-cell table for both instruments, the excluded-cell list with reasons, the differing-cell count beside the cells adjudicated, and each family's PERTURBATION DECLARATION as text
      - null-object-control-result.json -- honest-vs-honest, always_member and always_non_member through the identical counting rule
      - rc1-refold-result.json -- the refolded verdict for each of the five surviving instruments beside the committed rule's own unmodified verdict
      - frozen-recheck-result.json -- CTL-FROZEN-3 before and after, with this contract's own required artifacts reported SEPARATELY and never inside the criterion set
      - run-index.json -- the index of every executed run, CARRYING A sha256 FOR EVERY FILE OF EVERY EXECUTED RUN
    every_declared_result_file_exists_even_when_its_run_does_not: >-
      A HARD REQUIREMENT, AND IT IS AN ARCHIVE-FRAGILITY FIX RATHER THAN BOOKKEEPING. A
      COMPLETED archive's `path_sha256` must cover EVERY declared artifact, so a result file
      that is simply absent because its run was gated would make the snapshot unable to
      complete. THEREFORE: if a run is GATED-NOT-RUN or stopped, ITS RESULT FILE IS STILL
      WRITTEN, carrying `status: GATED-NOT-RUN` or `status: STOPPED`, the gate or stop
      condition that fired, what had been computed before it fired, and `null` -- never 0 --
      for every quantity the run would have produced (H-8). AN EMPTY FILE IS NOT ACCEPTABLE
      AND A MISSING FILE IS NOT ACCEPTABLE; a declared outcome is reported as a declared
      outcome. This is the same lesson BR-7 of BATCH-efcae7 recorded about run directories,
      applied to the result files instead of dodged by not declaring them.
    runs: >-
      Run directories under experiments/EXP-DIFFP-04082e/runs/<RUN-ID>/ for every
      executed run: command, environment, seeds, manifest with code_path_fingerprint and
      an armed deadline, raw machine-readable results, stdout and stderr -- plus a
      manifest-supplement.yaml wherever the wrapper's own inference block is incomplete.
    report:
      - execution-report.yaml -- in the contract's declared order, WHOSE HEADLINE IS THE DEPENDENCY TABLE AND THE PARTITION AND NEVER A PASS; carrying the verbatim tools/validate_ledger.py output measured after the runs exist and before the snapshot; the quarantine non-reading attestation with its mechanism; the search_knowledge queries and outcomes verbatim; every deviation declared; unspent ceilings reported AS UNSPENT; and closing with the explicit statement that NO PATH IS CLAIMED NEW, NO SEARCH WAS RUN, NO SOURCE WAS ACQUIRED, NO COMMITTED INSTRUMENT WAS REPAIRED, and THE MD5 LANE IS BLOCKED RATHER THAN CLOSED.

  # ====================================================================
  interpretation_limits:
    - >-
      A DEPENDENCY EDGE IS SCOPED TO THE DECLARED OBJECT POPULATION AND TO THIS CENSUS.
      Every planted SHA-1 entry is IN THE LINEARIZED CODE, so an edge that holds because
      of that is an edge about this census. AN EDGE IS NOT A THEOREM ABOUT THE
      ADJUDICATOR IN GENERAL AND IS NEVER A THEOREM ABOUT SHA-1.
    - >-
      THE PARTITION IS A STATEMENT ABOUT WHAT THE DECLARED FAMILIES AND THIS KEY CAN
      REPORT. `NOT PROBED` IS A COVERAGE STATEMENT ABOUT THE DECLARED FAMILIES AND IS
      NOT EVIDENCE THAT A PROBING FAMILY WOULD FIND NOTHING.
    - >-
      THE DIFFERING-CELL COUNT IS A DIAGNOSTIC AND NOT A DECISION VARIABLE, NOT A SCORE
      AND NOT A MARGIN. Zero does not mean the instrument is bad and nonzero does not
      mean it is good; both are measurements of where a verdict is contingent.
    - >-
      `closest_distance` REMAINS A REPORTED DIAGNOSTIC AND IS NEVER A MARGIN, in every
      artifact, as it has been since batch 1.
    - >-
      THE OFF-DIAGONAL MATRIX USES ONE KNOWN-FALSE INSTRUMENT. FOUR FURTHER SURVIVORS
      (O-D, O-C, O-C-prime, O-C-double-prime) ARE NOT ADJUDICATED HERE AND REMAIN
      UNREPLICATED, and three of the six key components remain deletable SIMULTANEOUSLY
      without the committed suite noticing.
    - >-
      NOTHING HERE IS A CRYPTANALYTIC RESULT. A control suite whose profile becomes
      readable is a better-understood instrument. A PASSING CONTROL IS NOT AN
      IMPROVEMENT. With a readable census of ZERO a NON-MEMBER verdict carries no
      information about the literature at all.
    - >-
      CLAIM CEILING `analyzed`, NEVER `supported`, ON EVERY RECORD PRODUCED UNDER THIS
      CONTRACT. Two independent reviewers do not raise it and an evidence strength of
      `replicated` describes how many implementations produced a number, never what the
      number means.

  open_directions:
    - >-
      NULL FAMILY (e) -- a SHA-1 entry with in_linearized_code perturbed -- IS OPEN AND
      ITS REVISIT CONDITION IS AMENDED, NOT RELAXED. CTL-WF is the well-formedness gate
      DEC-20260824-c5bb72 made its precondition; this contract BUILDS the gate and does
      NOT build the family, so family (e) becomes executable by a later batch and is not
      executed here.
    - >-
      THE FULL SIX-BY-SIX MATRIX INCLUDING THE DIAGONAL AND THE FORCED CELLS. Not built,
      because its excluded cells are theorems; if the graph turns out trivial, this
      promotes.
    - >-
      THE FOUR UNREPLICATED SURVIVING INSTRUMENTS, and permissive mode for every one of
      them, in either direction. Unmeasured here and named as unmeasured.
    - >-
      THE RE-AIMED OBSERVATION-COLLISION DIRECTION (i) at many witnesses of the same
      message difference, still the only named route to the number that would make the
      equivalence's net error direction determinable.
    - >-
      TIER C SHA-1 DISTURBANCE-VECTOR ACQUISITION under AMD-20260824-DIFFP-ACQ-1, and
      the Tier B unblocking route through a GOAL-MD5-001 decision. NEITHER IS CLOSED AND
      NEITHER IS DEPRIORITISED ON THE MERITS; the revisit condition is this contract
      completing, or a GOAL-MD5-001 decision, whichever comes first.
    - >-
      THE ELEVEN EXISTING RUN DIRECTORIES' REGISTRATION BY COPY, with `check_run`
      acceptance MEASURED BEFORE COMMITTING and a STOP if the copies cannot pass without
      editing an immutable manifest.
    - >-
      THE HARNESS GAP, OFFERED AND NOT THIS GOAL'S TO FIX: a check at the SNAPSHOT
      archive that every run directory reachable from a task's run-index.json is
      discoverable by the validator's glob, which would have fired before two
      independent reviews were spent.
