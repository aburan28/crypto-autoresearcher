# EXP-BINSTD-c0bd79
# Parity-count identities. No curve.
# Approved by DEC-20261002-396981.
experiment:
  id: EXP-BINSTD-c0bd79
  hypothesis_id: H-BINSTD-107d6c
  source_idea: IDEA-20261001-39014f
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Parity-count identities
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-396981
  objective: >-
    Count even-parity tuples on a four-label set and check the
    trace of the degree-5 window span{1, t, t^2}.
  inputs:
    balanced_good: {1: 2, 2: 8, 3: 32, 5: 512}
    balanced_total: {1: 4, 2: 16, 3: 64, 5: 1024}
    aligned0_good: {1: 4, 2: 16, 3: 64, 5: 1024}
    aligned1_good: {1: 0, 2: 16, 3: 0, 5: 0}
    uneven_good: {1: 1, 2: 10, 3: 28, 5: 496}
    half_good: {1: 2, 2: 4, 3: 8, 5: 32}
    matched_factor: 2
    half_ratio_m3_num: 8
    half_ratio_m3_den: 32
    attempt_multiplier_m3: 2
    attempt_multiplier_m5: 8
    modulus: 37
    trace_one: 1
    trace_t: 0
    trace_t2: 0
    trace_t3: 1
    window_matches: 8
  controls:
    - >-
      An all-ones count of 0 at arity 2 is the reversed rule. The
      count is 16. Reporting 0 invalidates the run.
    - >-
      A half-size ratio of 2 at arity 3 is the matched-size
      factor. The half-size successes are 8 of 32. Reporting 2
      as that ratio invalidates the run.
    - >-
      A trace of 0 for t^3 is outside the window claim. The trace
      is 1. Reporting 0 invalidates the run.
    - >-
      A window mismatch is false. All eight elements of
      span{1, t, t^2} have trace equal to the constant bit.
      Reporting a mismatch invalidates the run.
    - Two counting routes. They must not import each other.
  independent_variables:
    - arity
    - route in {enumerate, binomial}
  metrics:
    primary:
      - aligned1_good
      - half_good_m3
      - window_matches
      - implementations_agree
    secondary:
      - uneven_good
      - trace_t3
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The all-ones counts 0, 16, 0 and 0, and the half-size count 8.
    formula: >-
      Even parity is the sum over even numbers of ones. A constant
      label of 1 sums to the arity modulo 2. The half-size window
      has 2^{1-m} as many successes as the balanced window. The
      trace is the sum of the Frobenius orbit.
    source: >-
      IDEA-20261001-39014f states the corrected parity rule and
      the factor 2 at matched size, read 2026-10-02. The tuples
      and the window traces were computed in this design session.
      That computation is not a run. The all-ones label is empty
      at odd arity and full at arity 2. No curve was built.
  scale_relevance:
    tier: toy
    justification: Four arities and one degree-5 window. No transfer to a standards row.
    correspondence: null
  tail_checks:
    - Arity 5 is required. Stopping after arity 3 and still reporting the arity-5 counts is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other counting route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the all-ones count at arity 2 is reported as 0, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The all-ones count at arity 2 is reported as 0.
    - The all-ones count at arity 3 is reported nonzero.
    - The half-size ratio at arity 3 is reported as 2.
    - Tr(t^3) is reported as 0.
    - A window element is reported with trace different from its constant bit.
    - A curve point or a standards census is reported.
  success_criterion: >-
    Both runs agree on the balanced counts 2, 8, 32 and 512, the
    all-zero counts 4, 16, 64 and 1024, the all-ones counts 0, 16,
    0 and 0, the uneven counts 1, 10, 28 and 496, the half-size
    counts 2, 4, 8 and 32, and eight window traces equal to the
    constant bit with Tr(t^3) = 1. The arity-2 all-ones count stays
    16. The arity-3 half-size count stays 8.
  falsification_criterion: >-
    The runs agree, the odd all-ones counts stay 0, the arity-2
    all-ones count stays 16, and any count differs from the
    preregistered table.
  required_artifacts:
    - experiments/EXP-BINSTD-c0bd79/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-c0bd79/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-c0bd79/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-c0bd79/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-c0bd79/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-c0bd79/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any curve, standards census, or decomposition search.
    - A claim that the parity label helps or does not help.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
