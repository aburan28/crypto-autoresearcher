experiment:
  id: EXP-ECDLP-166141
  hypothesis_id: H-ECDLP-98f679
  version: 1
  title: >
    Exact Euclidean remainder
    parent-from-polynomials calibrator
  status: approved
  approved_by: coordinator
  approved_at: '2026-09-08'
  approval_decision: DEC-20260908-da146d
  approval_basis: >
    Standing user authorization recorded in AGENTS.md on
    2026-09-06 (ideas and experiments always approved once
    the protocol is complete). Coordinator completeness
    check is DEC-20260908-da146d after TASK-20260908-fb36e3.
    User confirmation is not an outstanding gate.
  frozen: true
  frozen_at: '2026-09-08'
  execution_authorized: true
  execution_authorized_note: >
    Stage 0 only. Stages 1 and later remain unauthorized.
    This approval does not authorize Stage 1 of
    EXP-ECDLP-166141, EXP-ECDLP-1dc6e1, EXP-ECDLP-6b3d67,
    EXP-ECDLP-71c37d, EXP-ECDLP-2a466a, EXP-ECDLP-8eaf6a,
    or the earlier Stage-1-blocked experiments, and does
    not authorize Stage 2 of EXP-ECDLP-4be480. It does
    not form Semaev S_m and does not build a P1553
    recurrence or a transposed half-gcd.
  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-da146d
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-fb36e3
  source_proposal: IDEA-20260825-fc85c6
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-da146d under the standing 2026-09-06
    user authorization. Stage 0 is the exact Euclidean
    remainder calibrator.

  objective: >
    Evaluate the exact identity that on
    F_5[x] one has g=x+1, r=x^2+2x+3,
    remainder 2, and rejects the nearby
    evaluation of r at +1 whose value
    is 1, on one frozen family
    (REAL, KF, NULL). Stage 0 does not
    form Semaev S_m and does not
    authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL F_5[x]
      has remainder 2; KF eval-at-plus-one
      value 1 rejected; NULL empty pair
      rejected; modulus 0 rejected.
      Certificate kind none.
    formula: >
      Ring F_5[x]. Euclidean remainder
      rem = r mod g.
      REAL: g=x+1, r=x^2+2x+3,
      (x+1)^2+2 = r, rem=2.
      KF: r(1)=6≡1, rejected
      as a generic eval target.
    claim_tier: observational

  inputs:
    fixture:
      real_polys:
        modulus: 5
        g: [1, 1]
        r: [3, 2, 1]
        must_remainder: 2
      known_false:
        kind: eval_at_plus_one
        must_value: 1
        must_reject: true
      matched_null:
        kind: empty_pair
        must_reject: true
      invalid:
        - {modulus: 0, must_reject: true}

  controls:
    - name: known_false_eval
      object: KF evaluation of r at +1
    - name: matched_null
      object: empty (g,r) pair
    - name: invalid_modulus
      object: modulus 0

  independent_variables:
    - modulus
    - g
    - r
  primary_metrics:
    - fixture_pass
    - real_remainder_pass
    - known_false_eval_pass
    - reject_invalid_pass
    - null_empty_pass
  secondary_metrics: []
  seeds: [8]
  replication_plan: >
    One Stage 0 run. Deterministic
    exact polynomial tables. No sampling.
  budget:
    wall_clock_seconds: 120
    memory_gb: 2
    maximum_runs: 1
  stopping_rules:
    - Stop after the five gates are recorded.
    - A timeout is failed_infrastructure, not a mathematical miss.
  invalidation_rules:
    - Missing artifact paths invalidate the run.
    - Overwriting an existing run record invalidates the procedure.
  success_criterion: >
    All five Stage 0 gates true and
    certificate kind none on the
    frozen REAL / KF / NULL toys.
  falsification_criterion: >
    After fixture_pass, any REAL
    remainder miss or KF-eval accept
    at the frozen toys.
  success_criteria:
    - All five gates true and certificate kind none.
  falsification_criteria:
    - After fixture_pass, any REAL table miss or KF accept.
  required_artifacts:
    - raw-result.json
    - execution-report-s0.yaml
    - implementation/stage0_eucrem.py
  dependencies:
    - H-ECDLP-98f679
    - DEC-20260908-da146d
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
  scientific_boundary: >
    Stage 0 P-S0-EUCREM only. Not
    Semaev. Not a P1553 recurrence.
    Not a factor-base. Not CRT. Not
    a transposed half-gcd. Not Velu.
    Not a rho beat. No Stage 1 of
    EXP-ECDLP-166141. No Stage 1 of
    EXP-ECDLP-1dc6e1.
