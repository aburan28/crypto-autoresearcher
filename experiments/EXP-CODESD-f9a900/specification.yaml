experiment:
  id: EXP-CODESD-f9a900
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-722a94; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-722a94
  question_id: RQ-WFS-e776b6
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Known-answer calibration of a soundness-measuring pipeline against five protocols with declared
    exact soundness, plus three deliberately broken pipelines, emitting a deviation matrix and a diagnostic
    map from failing rung to implicated arithmetic path.
  objective: 'The one uncertainty a run reduces is whether soundness numbers produced anywhere in
    this bucket come from an instrument that returns known answers when the answer is known. Concretely:
    (i) whether the pipeline under test recovers the exact declared soundness of five trivially known
    protocols, measured as a signed rational deviation at three parameter settings per rung with rung
    order shuffled and labels opaque so no branch on identity is possible; (ii) whether the ladder
    has demonstrated detection power, measured by requiring three deliberately broken pipelines, a
    challenge-count off-by-one, a dropped composition exponent, and acceptance measured on true rather
    than false statements, each to be caught, with the catching rung checked against a diagnostic
    map written before the run; (iii) whether the deviation signatures distinguish the three break
    modes from one another, measured as the number of pairwise-distinct mutant rows in the deviation
    matrix. A run does not reduce uncertainty about any protocol''s soundness, since every rung''s
    value is known before the run starts. It reduces uncertainty about whether the other soundness
    measurements in this bucket are admissible at all, and produces the fixture they must pass.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for the five declared
      rungs at the declared parameter settings, the pipeline under test recovered the known soundness
      values with the reported deviations, and the ladder detected and distinguished the reported
      number of the three declared break modes. What does NOT follow: no claim that the pipeline is
      correct on non-trivial protocols; no claim that the three break modes exhaust the ways such
      a pipeline can be wrong; and nothing at all about SDitH, FAEST, MQOM or any real protocol, since
      no relation, field or scheme appears anywhere in the ladder.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes) declare the three break modes and freeze them, BEFORE the
      rungs are finalized, recording the order in the fixture so the mutants cannot be reverse-engineered
      from the ladder. STAGE 1 (cost: hours human) implement the five rungs behind a common interface
      with hand-derived exact soundness literals; obtain an independent re-derivation of each value
      and record both. STAGE 2 (cost: minutes) implement the reference pipeline, the pipeline under
      test, the three mutants and the no-op mutant. STAGE 3 (cost: seconds) run the reference pipeline
      across all rungs and settings; HALT if any deviation is nonzero. STAGE 4 (cost: seconds) run
      the no-op mutant and require exact agreement with the pipeline under test. STAGE 5 (cost: seconds)
      run the pipeline under test and the three mutants across all rungs and settings with shuffled
      order and opaque labels; emit the deviation matrix in exact rationals. STAGE 6 (cost: minutes)
      compare each mutant''s implicated rung against the diagnostic map, count detections and pairwise
      distinctions, and emit the fixture as an importable artifact with the mutants retained as regression
      tests.'
    instrument: 'Python 3.11 standard library: fractions.Fraction for all deviations, itertools for
      enumeration inside the pipeline under test, random.Random with a declared seed for rung-order
      shuffling. No numpy needed, no Sage, no cryptographic library, no hash. Run through harness/runner.py
      with the fixture written as an immutable artifact under an experiments/EXP-* directory so later
      records can cite the exact fixture version they passed.'
    parameters: 'Five rungs: always-accept; always-reject; k-out-of-n cut-and-choose with (n, k) in
      {(4,3), (8,7), (16,15)}; biased coin with b in {1/4, 1/3, 7/8}; tau-fold repetition of the cut-and-choose
      with tau in {2, 3, 4}. Three parameter settings per rung as listed. Five pipelines: reference,
      under-test, three mutants, plus the no-op duplicate of under-test. Deviation matrix is therefore
      6 pipelines by 5 rungs by 3 settings equals 90 exact rational entries. Shuffle seed declared;
      two independent shuffles run to confirm order-invariance.'
  controls:
  - The reference correct-by-construction pipeline, which must yield an all-zero deviation vector.
  - Three deliberately broken pipelines, each of which must be detected, with the implicated rung
    checked against the diagnostic map.
  - Shuffled rung order with opaque labels, so no pipeline can branch on rung identity.
  - A no-op mutant identical to the pipeline under test, which must produce the same deviation vector,
    guarding against nondeterminism in the harness.
  - Three parameter settings per rung, so a rung passing at one parameter cannot masquerade as passing
    everywhere.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a pipeline that is correct by construction: a trivial
    reference implementation that reads each protocol''s declared soundness and returns it. It must
    produce a deviation vector that is identically zero across all five rungs, in the same invocation
    as the pipeline under test. If it does not, the comparison harness itself is faulty and no deviation
    from the real pipeline is interpretable. The complementary requirement is that the three deliberately
    broken pipelines must NOT produce a zero vector: a ladder on which everything passes has no power,
    and the pair of requirements together is what makes a zero deviation from the real pipeline informative.'
  independent_variables:
  - pipeline identity (reference, under-test, no-op, three mutants)
  - rung identity (five protocols)
  - parameter setting within a rung
  - shuffle seed for rung ordering
  metrics:
    primary:
    - signed exact deviation per (pipeline, rung, setting)
    - count of break modes detected by at least one rung
    - count of break modes pairwise distinguished by deviation signature
    - agreement between the implicated rung and the pre-written diagnostic map
    secondary:
    - reference-pipeline deviation, required to be zero
    - no-op mutant agreement with under-test
    - order-invariance across the two shuffle seeds
    - wall-clock seconds for the full matrix
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'The detection-and-distinction pair (D, S): D is the number of the three break modes
      producing a nonzero deviation somewhere in the matrix, and S is the number of pairwise-distinct
      mutant deviation signatures.'
    formula: 'D = card{ m in mutants : exists (rung, setting) with deviation(m, rung, setting) not
      equal to 0 }; S = card of the set of distinct mutant deviation signature vectors. Predicted
      D equals 3 and S at least 2. D less than 3 identifies a blind spot and names the missing rung
      as the deliverable; S equal to 1 falsifies the diagnostic claim while leaving detection intact,
      and both outcomes are reportable results rather than failures.'
    source: Pre-registered in the parent proposal IDEA-20260816-722a94 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Every rung is deliberately trivial: parameters run to n equal to 16 and tau equal
      to 4 because larger values would exercise no additional arithmetic path. There is NO transfer
      assumption to any real protocol and none is offered; the fixture''s value is entirely as a gate,
      and the record states explicitly that passing it transfers only to the arithmetic paths the
      rungs exercise. Nothing here is extrapolated to any parameter regime.'
    correspondence: null
  tail_checks:
  - 'Always-accept rung: recovered soundness must be exactly 1, not 1 minus an epsilon.'
  - 'Always-reject rung: recovered soundness must be exactly 0, and must not be reported as a very
    small positive number.'
  - 'Biased coin at b equal to 7/8: a value near but not at the boundary, catching pipelines that
    clamp.'
  - 'tau equal to 1 in the repetition rung: must reduce exactly to the cut-and-choose value from the
    general code path.'
  - 'Two shuffle seeds: the matrix must be identical up to row and column permutation; any content
    difference indicates order dependence.'
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt if the reference pipeline produces any nonzero deviation.
  - Halt if the no-op mutant disagrees with the pipeline under test.
  - Halt if the two shuffle seeds produce materially different matrices.
  - Halt and report if any rung's hand-derived value fails independent re-derivation, since the known
    answer is then not known.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The reference pipeline shows exactly zero deviation across all 15 rung-setting
    cells, the no-op mutant agrees exactly with the pipeline under test, all three break modes are
    detected, and the run emits an importable fixture containing the rungs, the declared values with
    both derivations, the deviation matrix, the diagnostic map and the mutants as regression tests.
  falsification_criterion:
  - Reference pipeline deviation nonzero anywhere.
  - Any break mode passing all five rungs, revealing a ladder blind spot.
  - All three mutant signatures identical, falsifying the diagnostic mapping.
  - No-op mutant disagreement, indicating nondeterminism.
  - A rung value failing independent re-derivation.
  - Order dependence across shuffle seeds.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-722a94
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must decide whether the common protocol interface is defined here or inherited
    from whichever soundness record in this bucket is approved first, since defining it twice guarantees
    divergence.
  - Whether three break modes are enough to license the word calibration, or whether a larger mutant
    set is required before other records may cite a pass.
  - Who performs the independent re-derivation of each rung value, given it must not be the author
    of the pipeline under test.
