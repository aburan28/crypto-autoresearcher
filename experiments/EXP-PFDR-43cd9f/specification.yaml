experiment:
  id: EXP-PFDR-43cd9f
  hypothesis_id: H-PFDR-ebec07
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-2c45e2
  version: 1
  status: draft
  claim_tier: toy
  retrospective: false
  retrospective_note: >-
    PRE-REGISTRATION. No run exists. Thresholds and predictions are frozen before
    execution and change only by a versioned protocol_amendment filed BEFORE the
    affected data is generated. NOTHING HERE IS A MEASUREMENT.

  title: >-
    Separating irrationality from coset non-preservation - the even-cofactor arm as the
    only place the claim can be tested, with two curve-free nulls and a planted
    implementation defect of known size.

  objective: >-
    Enumerate the Mobius transformations of the x-line preserving the branch locus,
    confirm that their number is twice the automorphism order and is a function of the
    j-invariant alone, and then determine EXACTLY which of them preserve the x-image of
    the prime-order subgroup. The load-bearing arm is the even-cofactor one, because on
    a prime-order curve the two competing obstructions are confounded and the two
    quantities compared are equal by construction.

  inputs:
    j_family_arm:
      curves: >-
        Toy ordinary prime-field curves at characteristic greater than 3, covering the
        generic, harmonic and equianharmonic j-families, at primes up to about 2 to the
        20 so that the subgroup is enumerable.
      quantity: >-
        The branch locus including the point at infinity, the cross-ratio and its
        six-element orbit, the j-invariant, and the stabiliser order over the base field
        and over the splitting field, with every group element listed by its Mobius
        coefficients.
    even_cofactor_arm:
      curves: >-
        MANDATORY AND BLOCKING. Curves with EVEN cofactor and FULL rational two-torsion,
        with a large odd prime-order subgroup, at each j-family where such curves exist.
        At least 10 curves per available family.
      quantity: >-
        The order of the rational branch-locus stabiliser, the order of the subgroup
        preserving the x-image of the prime-order subgroup, and their ratio; plus the
        individual outcome of each of the THREE non-trivial rational translations tested
        separately.
      purpose: >-
        THE DECISIVE ARM. Here irrationality FAILS and only coset non-preservation
        stands. The predicted ratio is exactly 4 under coset non-preservation and
        exactly 1 or 2 if it fails, both exact small integers with no overlap, and the
        three translations give three independent chances to falsify.
    cofactor_sweep_arm:
      construction: 'curves with rational two-torsion order 1, 2 and 4 at each j-family'
      purpose: >-
        The predicted shape is one curve rising with the rational two-torsion order and
        one flat. If BOTH rise, coset non-preservation is false; if NEITHER rises, the
        rationality computation is broken. Stating the predicted shape of both curves in
        advance is what makes this a test rather than a description.
    twist_arm:
      construction: 'the quadratic twist of each curve, sharing its j'
      purpose: >-
        Must give the same stabiliser order over the splitting field and possibly a
        different rational part. Any difference in the splitting-field order refutes that
        the stabiliser is a function of j.
    curve_free_null_arms:
      random_four_point_set: >-
        A random four-point set on the projective line that is NOT the branch locus of
        any curve in the run, at the same prime. Its stabiliser must be computed by the
        SAME code and must come out 4 generically. NO CURVE ANYWHERE.
      random_subset: >-
        A random subset of the base field of the SAME cardinality as the x-image of the
        prime-order subgroup, in place of that x-image, tested against the same
        stabiliser elements. NO CURVE ANYWHERE.
    planted_defect_arm:
      construction: >-
        A deliberately defective variant that DROPS the point at infinity from the branch
        locus, turning a four-point set into a three-point set.
      known_defect_size: >-
        The stabiliser of a three-point set is the symmetric group on three letters, of
        order 6, in place of the correct 4. The defect therefore has a KNOWN and
        PREDICTED magnitude, and it is a plausible-looking wrong answer rather than an
        obvious crash, which is exactly why it is the right planted defect.
      purpose: >-
        DYNAMIC-RANGE CONTROL. The generic-curve baseline control must catch it by
        reporting 6 instead of 4. A control that does not catch a defect designed to look
        right cannot certify the run.

  controls:
  - >-
    C1 GENERIC-CURVE BASELINE (BLOCKING). Stabiliser 4 over the splitting field, 1 over
    the base field when the order is an odd prime, usable subgroup 1, automorphism order
    2 confirmed independently from j. Three families must give three different
    splitting-field values of 4, 8 and 12, which is a far stronger instrument test than a
    single comparison.
  - >-
    C2 CURVE-FREE NULL, RANDOM FOUR-POINT SET. Its stabiliser must come out 4 generically.
    If the code reports 8 or 12 on random sets at an appreciable rate it is finding
    structure that is not there and every number is void.
  - >-
    C3 CURVE-FREE NULL, RANDOM SUBSET. No stabiliser element should preserve a random
    subset of matched cardinality. If some element preserves a random set at
    non-negligible rate, the set-equality test is broken.
  - >-
    C4 COFACTOR SWEEP AS THE DECAY PARAMETER. The rational stabiliser order must GROW
    with the rational two-torsion order by exactly that factor while the preserving
    subgroup stays exactly half the automorphism order.
  - >-
    C5 TWIST CONTROL. The quadratic twist shares j and must give the same splitting-field
    stabiliser order.
  - >-
    C6 PLANTED-INFINITY DEFECT (BLOCKING). The deliberately defective branch locus must be
    caught by C1, which must report 6 rather than 4.
  - >-
    C7 TWO-ROUTE AUTOMORPHISM ORDER. The automorphism order computed from j must equal the
    enumerated stabiliser order divided by the two-torsion order, on every curve. Two
    independent routes to the same integer on every curve is the validation.
  - >-
    C8 BASELINES-MATCHED. Parallel Pollard rho with distinguished points and BSGS on the
    same curves in the same charged unit, so that no group-order count in this experiment
    is read as an attack result.

  independent_variables:
  - arm - j_family, even_cofactor, cofactor_sweep, twist, curve_free nulls, planted_defect
  - j-family - generic, harmonic, equianharmonic
  - rational two-torsion order in {1, 2, 4}
  - field - base field or splitting field

  metrics:
    primary:
    - >-
      stabiliser order over the splitting field, an integer, per curve. Predicted exactly
      4, 8 or 12 by j-family.
    - >-
      stabiliser order over the base field, an integer, per curve.
    - >-
      order of the subgroup preserving the x-image of the prime-order subgroup, an
      integer, per curve. Predicted exactly half the automorphism order.
    - >-
      preservation_ratio, a dimensionless integer ratio equal to the base-field stabiliser
      order divided by the preserving-subgroup order, on the even-cofactor arm. PREDICTED
      EXACTLY 4 on curves with full rational two-torsion.
    secondary:
    - per curve - the prime, the coefficients, j, the cross-ratio and its six-element orbit, the subgroup order and the cofactor
    - rational two-torsion order and the rational two-torsion x-coordinates
    - the explicit Mobius coefficients of every stabiliser element
    - which specific elements preserve the x-image, named individually
    - per-translation outcome on the even-cofactor arm, three independent tests per curve
    - agreement of the automorphism order computed from j with the enumerated quotient
    - curve-free null outcomes - random four-point stabiliser orders and random-subset preservation counts
    - planted-infinity defect detection outcome
    - matched Pollard rho and BSGS charged operations, and BSGS memory in bits
    - wall time and peak resident memory, INFRASTRUCTURE ONLY

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      The three stabiliser orders and their ratio on the even-cofactor arm.
    formula: >-
      Splitting-field stabiliser order exactly 4, 8, 12 at generic, harmonic and
      equianharmonic j. Base-field stabiliser order exactly the rational two-torsion order
      times half the automorphism order. Preserving-subgroup order exactly half the
      automorphism order, that is 1, 2 or 3, INDEPENDENT of the rational two-torsion
      order. preservation_ratio exactly 4 on curves with full rational two-torsion.
    source: >-
      Derived from the classical trichotomy of a four-point set on the projective line
      and from the elementary fact that a group of odd prime order contains no element of
      order two, so the subgroup and its translate by a two-torsion point are disjoint.
      Every predicted value is an exact small integer computed by exhaustive enumeration,
      so there is no fitted threshold anywhere.

  scale_relevance:
    tier: toy
    justification: >-
      Primes up to about 2 to the 20, bounded by the requirement that the prime-order
      subgroup be enumerable, since the test is an exact set equality rather than a
      sample. The claim being tested is an exact finite-group statement, so no statistical
      power question arises and no transfer assumption is needed for the mathematics - but
      the IMPLEMENTATION is verified only at those sizes and the record says so.
    correspondence: null

  tail_checks:
  - >-
    The cross-ratio and its six-element orbit are reported per curve and the classification
    into the three families must agree with j computed from the coefficients. The six
    cross-ratio values giving one j are the classical redundancy and are a free internal
    consistency check.
  - >-
    The maximum stabiliser order observed anywhere is reported and must not exceed 12.
    A larger value is impossible over a prime field with characteristic greater than 3 and
    indicates a defect.

  replication:
    seeds: [20260904, 20260905]
    independent_instances: 2
    seeds_policy: >-
      One master seed per run recorded in the manifest, from which curve selection, the
      random four-point sets and the random subsets are drawn by a declared deterministic
      stream and are reproducible from that seed and an index. The stabiliser enumeration
      itself is exhaustive and deterministic and uses no seed. Seeds are fixed before
      execution and never redrawn after an outcome is seen.

  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 4
    maximum_runs: 6
    budget_note: >-
      Below the template memory floor because the largest object is an enumerated subgroup
      of at most about 2 to the 20 elements. The reason is stated here rather than left as
      an unexplained departure.

  stopping_rules:
  - >-
    SR1 BLOCKING. C6 runs first - the planted-infinity defect must be caught by C1, which
    must report 6 rather than 4. A run whose baseline control does not catch a defect
    designed to look right cannot certify anything and stops.
  - >-
    SR2 BLOCKING. C1 must pass on the generic family, with all three families giving 4, 8
    and 12 over the splitting field, before any even-cofactor curve is touched.
  - >-
    SR3 BLOCKING. THE EVEN-COFACTOR ARM IS MANDATORY. If no curve with full rational
    two-torsion and a large odd prime-order subgroup can be constructed at the available
    primes, THE RUN REPORTS THAT AS ITS RESULT and does NOT report the cofactor-one arm as
    a confirmation - because on cofactor-one curves the compared quantities are equal by
    construction and cannot disagree.
  - >-
    SR4. If any non-trivial rational stabiliser element preserves the x-image of the
    prime-order subgroup, the run STOPS IMMEDIATELY, records the curve and the element,
    and escalates - GOAL-ENDO-001 pause condition P3 fires and work halts for an
    independent review-adversarial session BEFORE any record states the excess.
  - >-
    SR5. Budget exhaustion stops the run and reports the curves completed. An
    infrastructure receipt, never a negative result.

  invalidation_rules:
  - >-
    The planted-infinity defect is not caught by C1.
  - >-
    The random four-point null reports enlarged stabilisers at an appreciable rate.
  - >-
    A random subset of matched cardinality is preserved by some stabiliser element at
    non-negligible rate.
  - >-
    The splitting-field stabiliser order is not twice the independently computed
    automorphism order on any curve.
  - >-
    The cross-ratio orbit classification disagrees with j on any curve.
  - >-
    The point at infinity is not handled explicitly as a branch point anywhere in the
    implementation.
  - >-
    Any stabiliser order exceeds 12.
  - >-
    The cofactor-one arm is reported as a confirmation of coset non-preservation.
  - >-
    A timeout, crash or memory exhaustion is recorded as failed_infrastructure and is
    NEVER counted as negative mathematical evidence.

  success_criterion: >-
    C6, C1, C2, C3 and C7 all discharged; splitting-field stabiliser orders exactly 4, 8
    and 12 by j-family on every curve; base-field stabiliser order exactly the rational
    two-torsion order times half the automorphism order; preserving-subgroup order exactly
    half the automorphism order on every curve including every even-cofactor curve; and
    preservation_ratio exactly 4 on every curve with full rational two-torsion, with all
    three non-trivial translations failing to preserve the x-image individually.

  falsification_criterion: >-
    THE DECISION RULE, FIXED BEFORE EXECUTION. (F1) On a curve with rational two-torsion,
    SOME non-trivial rational stabiliser element preserves the x-image of the prime-order
    subgroup. The usable cheap symmetry group is then larger than the automorphisms modulo
    inversion, the walk ceiling rises to the square root of the automorphism order times
    the rational two-torsion order, and GOAL-ENDO-001 pause condition P3 fires under SR4 -
    work stops for an independent review-adversarial session before any record states the
    excess. This is the only outcome that could change a constant. (F2) The splitting-field
    stabiliser order is not twice the automorphism order on some curve, or the cross-ratio
    classification disagrees with j - implementation defect, run INVALID. (F3) The
    curve-free random four-point null reports enlarged stabilisers at an appreciable rate -
    the enumeration finds structure that is not there and every number is void. (F4) The
    curve-free random subset is preserved by some element - the set-equality test is
    broken. (F5) THE MAIN NEGATIVE AND THE INTENDED DELIVERABLE - every prediction holds.
    The lane acquires a derived rather than quoted ceiling, an explicit accounting of the
    missing factor, and a third obstruction class independent of the two it already has. It
    must be recorded with the surviving open item named - the quotient over the full group
    of rational points for table-based mechanisms - together with the identity that summing
    a relation over translated points shifts the sum by a multiple of the translation, or
    the work is not finished.

  required_artifacts:
  - per curve - prime, coefficients, j, cross-ratio and its six-element orbit, subgroup order, cofactor
  - rational two-torsion order and the rational two-torsion x-coordinates per curve
  - stabiliser order over the base field and over the splitting field, with every element listed by its Mobius coefficients
  - the order and identity of the elements preserving the x-image of the prime-order subgroup
  - preservation_ratio per even-cofactor curve, and the three per-translation outcomes individually
  - the cofactor-sweep table with both predicted curves - one rising, one flat - and the measured ones
  - twist-arm comparison of splitting-field stabiliser orders
  - curve-free random four-point stabiliser order distribution
  - curve-free random-subset preservation counts
  - planted-infinity defect detection outcome, with the reported order
  - two-route automorphism order agreement per curve
  - explicit assertion that the point at infinity was handled as a branch point
  - matched Pollard rho and BSGS charged operations, and BSGS memory in bits
  - pass or fail per control
  - command, environment, seeds, library versions, and resource measurements

  limitations:
  - >-
    THE COFACTOR-ONE ARM CANNOT TEST ANYTHING AND IS LABELLED AS AN INSTRUMENT CHECK. On a
    curve of prime order there is no rational two-torsion, so the rational stabiliser IS
    the set of elements preserving the x-image, by construction. The two quantities the
    source idea compares are equal there with no alternative attainable, and a design run
    only on such curves would report agreement with a prediction that could not have
    disagreed. That is why the even-cofactor arm is mandatory and blocking. Recorded in
    H-PFDR-ebec07 band_non_degeneracy.
  - >-
    THE MATHEMATICS IS CLASSICAL AND IS NOT CLAIMED AS NEW. The trichotomy, the group
    structure and the two-torsion translation formula are textbook. What may be new to this
    program is the assembly into a ceiling argument and the naming of coset
    non-preservation as an obstruction distinct from the two the lane already has.
  - >-
    NO ATTACK, NO EXPONENT, NO SPEEDUP. The whole content is worth at most a factor of the
    square root of 2 even in the counterfactual where coset non-preservation failed. The
    stakes are bounded and are stated so nobody reads the record as promising more.
  - >-
    THE AFFINE-COORDINATE TRAP IS REAL AND IS PLANTED DELIBERATELY. An implementation
    working in affine coordinates silently drops the point at infinity, turning a four-point
    set into a three-point set whose stabiliser has order 6 - a wrong answer that looks
    plausible. C6 plants exactly that defect and C1 must catch it.
  - >-
    THE FACTOR IS CLOSED FOR THE SUBGROUP AND EXPLICITLY NOT FOR THE FULL GROUP OF RATIONAL
    POINTS. Table-based and factor-base mechanisms over the full group survive, and the
    identity that makes them unpromising is attached so the next session starts from the
    obstruction.
  - >-
    SCOPED TO PRIME FIELDS WITH CHARACTERISTIC GREATER THAN 3, ORDINARY CURVES, AND ODD
    PRIME-ORDER SUBGROUPS. Extension fields where Frobenius supplies further cheap maps,
    characteristic 2 and 3, supersingular curves and composite-order subgroups are outside
    every argument here.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. The empirical arm requires
    enumerating the prime-order subgroup and is bounded at about 2 to the 20 by memory. The
    CLAIM does not depend on scale, since coset non-preservation is elementary group theory
    - but the completeness of the IMPLEMENTATION is verified only at those sizes and no
    larger verification is claimed.
  - >-
    THIS EXPERIMENT MEASURES NO COST. It counts group elements. A ceiling is not a
    measurement and the two must not be conflated.

  assigned_to: executor
  approved_by: null
