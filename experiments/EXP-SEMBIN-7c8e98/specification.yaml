# EXP-SEMBIN-7c8e98
# Stage-0 refutation-degree certificate for H-SEMBIN-371c51.
# Frozen before the official run.
experiment:
  id: EXP-SEMBIN-7c8e98
  hypothesis_id: H-SEMBIN-371c51
  source_idea: IDEA-20261010-066c44
  question_id: RQ-SEMBIN-fa2e3f
  goal_id: GOAL-SEMBIN-5078bc
  version: 1
  title: >-
    Closure degree of one chained summation system over F_32
  status: approved
  frozen: true
  designed_at: '2026-10-12'
  approved_by: coordinator
  approval_decision_id: DEC-20261012-b4ec9c
  execution_authorized: true
  objective: >-
    Build the chained system S_3(u,x1,x2) and S_3(u,x3,z) over
    F_2[z]/(z^5+z^2+1), with each x in the span of 1 and z. Take the
    first z in 1..31 whose system has no Boolean solution. The
    refutation degree is the least D in 1..4 such that the
    variable-closure contains the constant 1, or 5 if none does.
  inputs:
    field: "F_2[z]/(z^5+z^2+1)"
    subspace: "span of 1 and z"
    target_order: "integers 1 through 31"
    bound: 4
    column_count: 562
    named_future_run_slot: RUN-SEMBIN-9ecb77
  controls:
    - >-
      The modulus sends z^5 to z^2+1. The column count is 562.
      The selected system has no solution. Deriving 1 on a system
      that still has a solution invalidates the cell.
    - >-
      The unit polynomial refutes at degree 1. A single linear
      equation does not refute by degree 4. The empty system does not.
  independent_variables:
    - the constant target z, chosen as the first unsatisfiable value
  metrics:
    primary:
      - matrix_holds
      - beyond_matrix
    secondary:
      - planted_ok
  heuristic_under_test: >-
    IDEA-20261010-066c44: an unsatisfiable chained system is
    refuted at degree exactly 4.
  preregistered_prediction:
    quantity: >-
      The refutation degree of the selected system equals 4.
    formula: >-
      The positive reading is degree 4. The negative reading is any
      other degree on a valid manifest. A missing refutation is
      stored as 5.
    source: >-
      IDEA-20261010-066c44 states that D_W stays 4. The equality
      was fixed before this driver was executed.
  scale_relevance:
    tier: toy
    justification: >-
      Eleven bits and one target. The idea's ladder through m = 6
      is not this contract.
    correspondence: null
  tail_checks:
    - >-
      Column count is 562. A larger field is not this contract.
    - >-
      A satisfiable selected system invalidates the cell.
  replication:
    seeds: []
    independent_instances: 1
    named_future_run_slot: RUN-SEMBIN-9ecb77
    replication_note: >-
      One deterministic pass. The target order is fixed.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 60
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one valid manifest for RUN-SEMBIN-9ecb77.
    - Do not add a field, a batch, or a second target.
    - A missed matrix is the recorded result. Do not change the bound.
  invalidation_rules:
    - The column count is not 562.
    - No unsatisfiable target exists, or a planted check fails.
    - A timeout, crash, or missing degree.
  success_criterion: >-
    The manifest is valid, planted_ok is true, and the refutation
    degree equals 4.
  falsification_criterion: >-
    The manifest is valid, planted_ok is true, and the refutation
    degree is not 4.
  decision_impact:
    on_positive: >-
      Record that this one system is refuted at degree 4. Do not
      treat that as a rate at m = 5 and do not claim an exponent.
    on_negative: >-
      Record that this system is not refuted at degree exactly 4.
      Do not publish an m-ladder from this manifest.
  required_artifacts:
    - experiments/EXP-SEMBIN-7c8e98/runs/RUN-SEMBIN-9ecb77/manifest.yaml
    - experiments/EXP-SEMBIN-7c8e98/runs/RUN-SEMBIN-9ecb77/raw-result.json
  assigned_to: executor
  launcher:
    trial_plan: experiments/EXP-SEMBIN-7c8e98/trial-plan.json
    driver: experiments/EXP-SEMBIN-7c8e98/implementation/run.py
    checker: experiments/EXP-SEMBIN-7c8e98/implementation/check.py
  out_of_scope:
    - Any m other than 3, any n other than 5, and any batch of curves.
    - A direct summation polynomial, a deployed curve, and an exponent claim.
