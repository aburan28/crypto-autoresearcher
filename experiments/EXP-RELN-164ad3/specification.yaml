      "target_rule": "Uniform without-replacement nonzero group scalars for50 fixed targets; target scalars retained for the graph-label audit, never used to infer a decomposition without point verification. Full coverage enumerates every nonzero target, not only these50. Histogram tests use only target P across independent bases to avoid treating shared-base targets as independent trials.",
      "sampler": "SHA256 counter stream on UTF8 EXP_ID|stage|cell|base_index|replicate_seed|counter; increment counter per32-byte block and rejection-sample integers uniformly without modulo bias. Uniform B-subsets use partial Fisher-Yates on sorted on-curve x-class representatives; at larger fields use uniform x rejection to on-curve nonzero non-2torsion classes and reject duplicates, which is uniform over classes. Canonical representative is lex lesser of Q,-Q. Include both signs in W once. No outcome-dependent resampling.",
      "ap_q": "q in{0,1/4,1/2,3/4,1}; t=round_half_up(q*B). Retain B-t classes chosen uniformly without replacement from AP classes{x([j]P):1<=j<=B}, then add t classes uniformly from the complement of the retained set in ALL n classes. Thus q1 is exactly uniform random B-subset and q0 exact AP. Do not forbid reselecting removed AP classes. Use paired random streams across q; monotonicity is a source prediction, not a sampler identity. Report every q mean and paired difference; replicated negative differences beyond3SE count against monotonicity after sampler controls pass.",
      "certificate": "Primary m2/m3 counts size-m multisets of signed nonzero points from W, repetitions allowed, with lex nondecreasing point indices. Secondary m2 forbids the same signed point repeated and removes its single loop. Targets R!=O for graph law and coverage normalization N-1; zero-target counts reported separately. m3 includes supports of1,2 or3 distinct x-classes, never silently restricted to3-uniform edges."
