    "methods": {
      "stage0": "For each of three distinct-j8bit full-prime-order curves, enumerate all2-decompositions of every R!=O by looping P1 in E{O,R}, setting P2=R-P1 and canonicalizing multiset. Label classes by[j](R/2),j=1..n. Certify all edges, loop at1, path endpoints1/2, n-1 nonloop edges and N-2 ordered solutions. Audit small abstract groups N=7,11,17 and even-order nearby curves; an even-order result lies outside the theorem rather than automatically disproving it.",
      "stage1": "Before sampled enumeration, write/hash exact rational m2 tables p_loop=1-C(n-B,B)/C(n,B), p_no_loop=1-C(n-B+1,B)/C(n,B). Binom(a,b)=0 for invalid ranges. B1 andBn boundary slices checked exactly. Compute full PMF by integer dynamic program scanning the stated path and tracking selected count, previous bit, loop endpoint bit and induced-edge count; verify no-loop PMF against the source runs formula. Report exact ratios to reported B^2/(2p), source rounded anchors and B^2/n mean without accepting asymptotic error claims as proven.",
      "stage2": "Uniform B-subset on abstract Z/N classes, using identical sampled class indices mapped to each real R-label path. Actual point-multiset enumeration and abstract adjacency must agree exactly for every chosen base/target, independently of statistical thresholds. Same-order second distinct-j curve at8/10/12: scan same finite fixture pool for full order equal to first curve and use transported indices; exhaustion is unmatched control/inconclusive, not replaced order.",
      "stage3": "For each main cell and both seeds, enumerate all nondecreasing signed multisets from each of200 bases, retain per-target c(R), coverage on nonzero targets and exact checksums. m2 graph DP predictions and random-base empirical coverage/histograms are compared. AP q cohorts use200 bases perq/seed, q0 repeated deterministic base reported once with zero sampling variance; q1 is exactly the random law, and paired q changes are all reported. Exact AP coverage bound is computed using actual modular sumset; source factor3 and monotonicity assertions remain hypotheses.",
      "stage_m3": "At target P enumerate all signed3-multisets of the full nonzero group by ordered two-point completion, canonicalizing the resulting third point and multiset. Retain class-support size1/2/3, multiplicity and distinct support events; remove supersets only for a separately labelled minimal-event family. Enumerate the full multiset event and the source distinct-three-class restriction separately to expose lost repeated-class solutions. For a support e, fixed-size probability=(B)_{|e|}/(n)_{|e|}; Bernoulli probability=theta^{|e|},theta=B/n. Compute mu and ordered intersecting-pair Delta with union-size counts, verifying small-group pair enumeration against incidence-bucket counts.",
      "janson": "Evaluate the SOURCE proposed fixed-B bracket using fixed-size mu/Delta/pmax and label it conjectural, since disjoint events are also dependent. Retain M6 empirical inclusion/violation as a test of that source assertion. In a separate200-base Bernoulli cohort percell/seed apply the retrieved product-measure Janson bound to distinct minimal support events: lower exp(-mu/(1-pmax)), upper min(1,exp(-mu+Delta/2)), with theta1 handled exactly. These bounds are not transferred to fixed-B sampling. Exact small N=7,11,17 enumeration over all vertex subsets and every B checks both models, full events and3-uniform omissions. Report bracket width and relative width/(B^2/n), not an asserted O constant. A model-assumption failure does not stop the independently valid m2 test.",
      "stats": "Coverage SE=sample SD over200 independent bases/sqrt200, separately percell/seed; exact DP target PMF gives additional reference. M2 within3SE passes source compatibility; >4SE on both seeds flags replicated discrepancy,3–4SE inconclusive. M4 target-P counts use fixed expected bins merged from largest c downward until each expected count>=5; require at least3 bins, chi-square alpha0.01, no fitted parameters. If fewer bins mark test_ineligible, not PASS. AP differences use paired-base SE; source literal monotonicity and factor3 tested separately from implementation validity. M6 uses empirical no-hit proportion with binomial SE, and reports literal point-estimate inclusion plus3SE interval relation, both seeds. Zero SE uses exact equality, not division by0.",
      "costs": "Keep coordinatewise vectors: EC additions/doublings, base-field mul/add/inversion, integer/rational arithmetic and operand bits, equality/table lookups, random draws, oracle calls, CPU/wall,RSS,data/storage/I/O. Charge fixture/base/lookup construction, failed sampling, exact enumeration, spectral/probability work, all certificates and checks. Distinguish algorithm-only and full audit totals; no unexplained sum of unlike units or free cached ground truth. Report denominator-zero cases explicitly.",
      "pareto": "For one fixed public challenge Q=[s]P per distinct selected p, s=SHA256(EXP_ID|baseline|p) mod(N-1)+1 held checker-only: ordinary BSGS with b=ceil(sqrtN), fixed-width full point keys and independently verified solution; matched negation-quotient rho with32 public increment pairs generated by the experiment counter RNG, x-coordinate hash partition, canonical +/- point and coefficient sign updates, Floyd cycle detection,16 fixed restart seeds and at most N+1 point-state transitions per restart. Record every failed/degenerate collision and all group calls/table/storage; a failed finite rho attempt is baseline_incomplete, never evidence of attack advantage. The0.886sqrtN reference is modeled context, not forced measured equality. No reuse of secret s by solvers.",
      "heuristic_target_audit": "HEUR-1 validation retains20 targets: use the first20 of the frozen50 nonzero targets, build/certify the full signed-multiset support family and exact mu/Delta for each target at every m3 cell. A transport shortcut is permitted only with an independently checked explicit scalar bijection of all point/event labels; its setup and checking costs are charged. Report per-target Poisson residual and bracket, and the smallest no-hit probability across cells as the source tail check.",
      "sampler_audit": "HEUR-2: independently draw10000 single x-classes per curve using the sampler before base tests. Compare exact expected frequency10000/n to all class counts; when expected<5, deterministically group consecutive canonical class indices into bins with expected>=5, no fitted parameters. Chi-square alpha.01, both seeds. Report nominal failures and measured deviations; replicate with independent seed before excluding M2. Formal uniformity follows conditional rejection from uniform x, exactly1/n per eligible class; no point-count O-error is asserted. Also exhaust the small abstract B-subset sampler rank map to certify uniformity."
