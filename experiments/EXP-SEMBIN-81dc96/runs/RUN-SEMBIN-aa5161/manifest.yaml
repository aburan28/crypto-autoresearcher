    dirty: true
    dirty_paths:
      - '?? experiments/EXP-SEMBIN-81dc96/code/run_wrapper.py'
      - '?? experiments/EXP-SEMBIN-81dc96/runs/'
    dirty_note: >
      The only untracked paths at execution time were this run directory
      itself, which cannot exist in the commit that produces it, and the
      provenance wrapper that created it. Both are committed in the snapshot
      commit that archives this manifest. The two files that compute every
      number here -- joint_balance.py and independent_arith.py -- were already
      committed at 017250253 and are unmodified in the recorded commit, which
      is what reproducibility of this run requires.
    command: python3 joint_balance.py --out <run_dir>/raw-result.json
    command_exact_path: command.txt
    wrapper: experiments/EXP-SEMBIN-81dc96/code/run_wrapper.py
    determinism: >
      Deterministic and seedless: the derivation consumes only the frozen
      paper's formulas and an integer parameter sweep, and draws no random
      value. Re-running at the same commit reproduces raw-result.json
      byte-for-byte apart from its embedded provenance block; this was checked
      against an earlier execution of the identical code at commit bee864367.
