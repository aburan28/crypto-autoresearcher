    preregistered_prediction_refuted: true
    preregistered_prediction_note: >
      The contract predicted t* < m* strictly at every n. Observed t* = m*
      everywhere, under all three solving-cost readings. The contract's
      success criterion states explicitly that a boundary optimum at every n
      satisfies it equally, so this is a recorded refutation of the
      Coordinator's prior and not a failed run. The direction of the
      correction is MORE favourable to the paper than the paper's own
      argument: Semaev declined t < m as asymptotically indifferent, and the
      computation says his choice is optimal at concrete n as well.
    certificate:
      kind: none
      verified: true
      verifier: no-claim
      note: >
        Pure derivation. No discrete log is solved, no factor-base relation is
        claimed, and no polynomial system is solved, so there is nothing to
