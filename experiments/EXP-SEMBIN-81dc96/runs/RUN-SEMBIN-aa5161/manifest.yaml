  purpose: >
    Re-solve Semaev 2015's two-stage cost balance JOINTLY over the factor-base
    parameter m and the chain length t, instead of over m alone with t = m
    fixed as eqs. (15)-(17) do, and charge the n^{4 omega} solving cofactor
    that the analytic optimization absorbs. Reports the joint optimum, its
    interiority, the crossover shift against the t = m solution, and the
    ceiling discrepancy between the k = n/m and k = ceil(n/m) readings.
  status: completed
  stage: derivation
  code:
