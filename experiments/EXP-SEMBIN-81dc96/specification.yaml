experiment:
  id: EXP-SEMBIN-81dc96
  hypothesis_id: H-SEMBIN-b1708c
  version: 1
  title: >-
    Re-solve Semaev's two-stage balance jointly over (m, t) instead of at t = m, and
    recompute it with the n^{4 omega} cofactor charged rather than absorbed
  status: analyzed
  status_history:
    - status: approved
      at: '2026-09-13'
      by: coordinator
      ref: DEC-20260913-ebd639
    - status: completed
      at: '2026-09-13'
      by: executor
      run_id: RUN-SEMBIN-aa5161
      note: >-
        Derivation run archived under experiments/EXP-SEMBIN-81dc96/runs/RUN-SEMBIN-aa5161/.
        Status was left at approved on the contract head; completed is recorded here so
        DEC-20260913-74e208's from: completed is reachable.
    - status: analyzed
      at: '2026-09-13'
      by: coordinator
      ref: DEC-20260913-74e208
      note: >-
        Applied from DEC-20260913-74e208 official_transitions. Reviewed and composed.
  objective: >-
    Take up the trade Semaev identifies and declines. Section 3 step 3: for t < m the
    solving time "drops dramatically" while the solving probability is "relatively
    lower", the trade "may be positive", and he declines it because it "does not affect
    the asymptotical running time estimates". That reason is correct about the exponent
    and silent about the crossover n, which is what the Section 4.5.2 four-curve
    conclusion turns on. The balance in eqs. (15)-(17) was optimized over m with t = m
    held fixed; optimizing over (m, t) jointly is a different optimization and its
    optimum has never been located.
    A second, opposite correction is computed in the same run. Stage 1 carries
    n^{4 omega}; at omega = 3 that is n^{12}, which is 2^{109.9} at n = 571 -- larger
    than the 2^{2n/m} stage-2 term the balance is struck against (2^{95.2} at m = 12).
    The asymptotic statement is untouched by a polynomial factor by construction; the
    concrete numbers are not. The two corrections move the crossover in opposite
    directions and must be reported separately and both.
    The experiment must also carry, not resolve, a reading ambiguity the freezing
    arithmetic exposed: eq. (15) is derived at k = ceil(n/m), but Table 3's stage-1
    column reproduces only from m! 2^{n/m} n^{4 omega}, i.e. with k taken as the real
    number n/m. Where m divides n the readings agree; elsewhere the ceiled form is
    strictly cheaper and the published table uses the un-ceiled one -- while the
    relation store that EXP-SEMBIN-f4a17b charges is 2^{ceil(n/m)}. Both readings are
    computed.
    This is derivation from published formulas. No curve, no factor base, no Groebner
    basis, no field arithmetic.
  inputs:
    cost_model_table3_reading: >-
      stage 1 = m! * 2^{n/m} * n^{4 omega}; stage 2 = 2^{2n/m}; the form that reproduces
      all 36 Table 3 cells within 0.7%
    cost_model_ceiled_reading: >-
      stage 1 = m! * 2^k * n^{4 omega} * 2^{n - mk}; stage 2 = 2^{k omega'};
      k = ceil(n/m)
    yield_law: >-
      eq. (11), P = 1 - exp(-2^{tk-n}/t!), as published; if EXP-SEMBIN-354a75 has
      produced a corrected law, the optimization is reported under BOTH
    chain_length: 'released from t = m to every integer t in [2, m]'
    heur006_readings:
      - k_fixed_by_m: 'factor base fixed by m; only the number of summands varies'
      - k_reoptimized_with_t: 'the larger optimization, computed as a second variant'
    frozen_source: inputs/SEMAEV-2015-310/
    n_range_dense: 'every integer n in [250, 600]'
    n_range_asymptotic: [1000, 10000, 100000]
    m_range: 'every integer m in [2, 30]'
    t_range: 'every integer t in [2, m]'
    omega_variants: [2.376, 2.807, 3.0]
    omega_prime_variants: [2.0, 3.0]
    table3_reproduction_n: [100, 150, 200, 250, 300, 310, 350, 400, 409, 450, 500, 571]
  controls:
    - kind: baseline
      design: >-
        Constrain the joint optimization to t = m and confirm it reproduces Semaev
        exactly: all 36 Table 3 cells within 0.7%, argmin over m giving 11 at n = 409 and
        12 at n = 571 as Table 3 states, m* ~ sqrt(2 ln2 n / ln n), c = 2/(2 ln 2)^{1/2}
        ~ 1.6986, and the crossover at n = 302 under the un-ceiled reading. This is the
        exact old-method boundary; failure here stops the derivation.
    - kind: known_false
      design: >-
        A control cost model in which the solving-cost factor is made INDEPENDENT of t,
        so only the yield term varies and the optimum must lie at t = m by construction.
        If the machinery reports an interior optimum there, it has a bug and every
        reported t* is void. This is the proves-too-much control applied to an
        optimization: an argument that finds an interior optimum where none can exist is
        wrong somewhere.
    - kind: matched_null
      design: >-
        A second control model with the yield term removed entirely, whose optimum must
        be t = 2. Together with the previous control this pins both endpoints of the
        machinery's behaviour.
    - kind: invalid_input
      design: >-
        t > m, t < 2, m = 1, m > n. All must be rejected rather than evaluated.
    - kind: flatness_probe
      design: >-
        At every n, record the full cost surface over (m, t) and the width of the region
        within 2x of the optimum. An argmin read off a flat valley is a tie-break
        artifact, and this is the control that exposes it -- the most likely way this
        derivation produces a spurious positive.
    - kind: arithmetic_independence
      design: >-
        Recompute n^12 at n = 571 (2^{109.9}), stage 2 at m = 12 (2^{95.2}) and their
        gap (2^{14.7}), plus the Table 3 reproduction ratios, in a second independently
        written routine that does not import the first. Blind re-derivation of the
        load-bearing quantities rather than a re-run of the same code.
  independent_variables:
    - t, released from t = m over [2, m]
    - m
    - n
    - omega and omega'
    - k reading (un-ceiled as in Table 3; ceiled)
    - HEUR-006 reading (k fixed by m; k re-optimized with t)
    - cofactor treatment (absorbed as in the paper's analytic optimization; charged)
    - yield law (eq. 11 as published; corrected law if available)
  metrics:
    primary:
      - t_star_per_n
      - m_star_per_n
      - is_optimum_interior
      - crossover_n_joint_optimum
      - crossover_n_cofactor_charged
      - fitted_exponent_constant_c
    secondary:
      - cost_surface_over_m_t_per_n
      - near_optimal_region_width
      - improvement_factor_joint_vs_t_equals_m
      - table3_reproduction_ratio_per_cell
      - ceiling_discrepancy_bits_per_n
      - cofactor_vs_stage2_gap_bits
      - reading_disagreement_flag
  heuristic_under_test: HEUR-006
  preregistered_prediction:
    quantity: >-
      The minimizer (m*, t*) of the joint objective at each n, and the crossover against
      2^{n/2} that follows.
    formula: >-
      t* < m* strictly at every integer n in [250, 600]; crossover at n0 with
      310 - n0 >= 5 taking the paper's stated 310 as reference and reporting the shift
      against the freezing session's 302 as well; fitted c agreeing with 1.6986 to the
      fit's own resolution over n up to 10^5, because the (m, t) feasible set has size
      O(n / log n) and a polynomial factor cannot move 2^{c sqrt(n ln n)}; and, in the
      OPPOSITE direction, charging n^{4 omega} in the analytic optimization moving the
      crossover upward by at least 5 in n. Exact arithmetic to be matched:
      n^12 = 2^{109.9} at n = 571 against stage 2 = 2^{95.2} at m = 12, a gap of
      2^{14.7}.
    source: >-
      Semaev Section 3 step 3 for the declined trade and Table 2 for its two sides;
      eqs. (15)-(17) for the balance; Section 4.5.2 and Table 3 for the crossover;
      inputs/SEMAEV-2015-310/tables.yaml derived_checks for the n = 302 recomputation and
      the 0.7% reproduction; the polynomial-feasible-set argument derived in
      H-SEMBIN-b1708c mechanism.
  scale_relevance:
    tier: crypto
    justification: >-
      The parameters are cryptographic because the crossover lives there, but the
      evidence is derivational: nothing is executed and nothing could be at these n.
      Every row is a heuristic estimate under Semaev's own cost model, inheriting his
      Assumption 1 (HEUR-005) and his eq. (11) (HEUR-006). The tier labels the parameters
      of the derivation and asserts nothing about achievable cost.
    correspondence: null
  tail_checks:
    - >-
      Report the full (m, t) cost surface and the near-optimal width at every n, not only
      the argmin. A flat valley makes t* a tie-break artifact and the crossover shift
      non-robust, which must be said rather than discovered later.
    - >-
      Report the crossover as a curve over n, so a transition sitting inside a flat
      region is visible.
    - >-
      Report the two corrections -- joint optimum and charged cofactor -- separately and
      their net. Quoting the favourable one alone would be selective reporting of a
      two-sided calculation.
    - >-
      Report whether the two HEUR-006 readings agree qualitatively about interiority. If
      they do not, the result is reading-dependent on an ambiguity in the published text
      and must be reported as unresolved rather than settled by choosing the more
      favourable reading.
    - >-
      Report the ceiling discrepancy per n between the two k readings.
  replication:
    seeds: []
    independent_instances: 1
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 900
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 20
    maximum_workers: 1
  stopping_rules:
    - >-
      Stop and report a procedure defect if the t = m constrained baseline fails to
      reproduce Table 3 to 0.7% or to recover m* and c.
    - >-
      Stop if either control model returns the wrong optimum (t = m for the
      t-independent-solving-cost model; t = 2 for the no-yield model). The machinery is
      then void.
    - >-
      Stop if the independent arithmetic re-derivation disagrees on any load-bearing
      quantity, and localize the disagreement before proceeding.
    - >-
      Report a fitted c materially different from 1.6986 as an implementation defect and
      stop. A polynomial feasible set cannot move the exponent, so such a result refutes
      the code rather than establishing an improvement -- and treating it as an
      improvement is the single most damaging misreading this experiment could produce.
  invalidation_rules:
    - >-
      The record is invalid if a crossover shift is described as an exponent improvement.
      No exponent movement is claimed or possible from this route.
    - >-
      The record is invalid if only one of the two corrections is reported.
    - >-
      The record is invalid if the yield law used is not stated, since the optimization
      inherits it.
    - >-
      The record is invalid if the extension of the published formulas to t < m is done
      by inventing an interpolation rather than by substituting t where the published
      expression carries a chain length. Where the substitution is ambiguous, both
      readings are computed and the ambiguity is recorded.
    - >-
      Any statement presented as a claim about achievable cost, rather than about
      Semaev's cost model, is invalid.
  success_criterion: >-
    The t = m baseline reproduces Table 3 to 0.7% and recovers m* and c; both control
    models return their forced optima; the independent arithmetic agrees; and the joint
    (m, t) optimum is reported per n over [250, 600] with its cost surface and
    near-optimal width, together with the crossover under the joint optimum and,
    separately, under the charged cofactor. A BOUNDARY optimum at every n satisfies the
    criterion equally: it closes KN-OPEN-94f456 as an optimization question at the cost
    of one derivation, which is a result and not a failure. The criterion additionally
    requires the exponent constant to be reported as unchanged, explicitly.
  falsification_criterion: >-
    A boundary optimum t* = m* at every n in [250, 600] refutes the first clause and
    shows Semaev's choice optimal under his own model. A crossover shift under 5 in n
    refutes the effect-size clause while leaving t* < m* intact. A non-monotone or flat
    surface making t* a tie-break artifact refutes robustness. The two HEUR-006 readings
    disagreeing qualitatively makes the result reading-dependent. Either control model
    returning the wrong optimum voids the machinery. A fitted c differing materially
    from 1.6986 refutes the implementation.
  required_artifacts:
    - the full (m, t) cost surface per n, machine-readable
    - t*, m*, interiority flag and near-optimal width per n
    - crossover curve per correction (joint optimum; charged cofactor) and their net
    - the Table 3 reproduction table with per-cell ratios, under the t = m constraint
    - recovered m*(n) and fitted c, with the fit's resolution
    - the ceiling-discrepancy table between the two k readings
    - results under both HEUR-006 readings, with the agreement flag
    - both independent arithmetic implementations and their agreement check
    - all six control outcomes
    - the exact command, git commit and dirty-tree state
    - the yield law used, named and cited
    - stdout and stderr
  assigned_to: executor
  approved_by: DEC-20260913-ebd639
  approval_basis: >-
    Standing user authorization of 2026-09-06. Approval asserts protocol completeness,
    not that H-SEMBIN-b1708c is true.
  dependencies: []
  independence_note: >-
    Pure derivation; no Groebner engine, no curve, no machine headroom beyond
    arbitrary-precision arithmetic. Ranked first in GOAL-SEMBIN-cbf422 because it decides
    whether KN-OPEN-94f456 is a live lane before any measurement budget is committed to
    the topology or subspace comparisons. Its results are conditional on Assumption 1
    (HEUR-005) and eq. (11) (HEUR-006); EXP-SEMBIN-7e1371 and EXP-SEMBIN-354a75 can
    invalidate them later, and if EXP-SEMBIN-354a75 delivers a corrected yield law the
    optimization is rerun under it with the published-law result kept as the comparison
    baseline.
  interpretation_limits:
    - >-
      This is a statement about SEMAEV'S COST MODEL, not about achievable cost. It
      inherits Assumption 1 and eq. (11); either being wrong invalidates it.
    - >-
      NO EXPONENT IMPROVEMENT IS CLAIMED OR POSSIBLE from this route. The (m, t) feasible
      set at fixed n is polynomial in n, so the joint optimum differs from the t = m
      optimum by a polynomial factor, which 2^{c sqrt(n ln n)} absorbs identically.
    - >-
      A crossover shift in either direction says nothing about whether any curve is
      attackable. Both sides of the crossover are heuristic estimates, and the memory
      axis -- EXP-SEMBIN-f4a17b's subject -- is absent from both.
    - >-
      No claim about the security of any deployed curve, in either direction. The FIPS
      binary curves appear only as values of n.
