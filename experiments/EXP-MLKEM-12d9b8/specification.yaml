# TASK-20260814-1b47ba (GOAL-QALG-001 BATCH-dbf57a). EXP-MLKEM-12d9b8 was
# pre-allocated by this batch's own dispatch_queue.json. This contract is
# APPROVED by this same filing task (status: approved, approved_by:
# coordinator) because every docs/task-lifecycle.md step-4 field below is
# either filled with real content or explicitly marked not_applicable with a
# stated reason -- see the design-report at
# coordination/goals/GOAL-QALG-001/batches/BATCH-dbf57a/tasks/TASK-20260814-1b47ba/design-report.yaml
# for the field-by-field completeness check. APPROVAL DOES NOT AUTHORIZE
# DISPATCH: the paired handoff (ledger/handoffs/TASK-20260814-807901.yaml)
# explicitly may not be dispatched to the Executor until
# TASK-20260814-11516e's independent red-team report is read and any
# objection resolved. This batch does not dispatch the Executor.
experiment:
  id: EXP-MLKEM-12d9b8
  hypothesis_id: H-MLKEM-36f511
  question_id: RQ-QALG-457b41
  goal_id: GOAL-QALG-001
  version: 1
  status: approved
  frozen: true
  approved_by: coordinator
  execution_authorized: false
  # execution_authorized stays false at filing time: approval freezes the
  # protocol (AGENTS.md rule 1, SKILL.md step 4) but this batch's own
  # objective text is explicit that dispatch of the paired handoff is held
  # for TASK-20260814-11516e's red-team report. A later Coordinator act
  # (recording that hold cleared) flips this field before any run.
  evidence_eligible: false
  # No run has occurred; nothing here is evidence yet.
  claim_tier: derivation
  # See H-MLKEM-36f511.statement: closed-form arithmetic over exact stated
  # parameters, not an empirically-scaled run; toy/medium/crypto (which
  # describe tested run scale) do not cleanly apply, per H-MLKEM-11aabf's own
  # established precedent for its exact-census conjunct.

  title: >-
    Closed-form realizability audit: can standard linear self-reduction from
    ML-KEM's k in {2,3,4} real Module-LWE rows supply Simon 2026's required
    Q = k*n^(c+1) samples within its own noise/faulty-rate budget

  objective: >-
    Compute, for each of ML-KEM-512/768/1024, a decidable three-way verdict
    (realizable within budget / unrealizable / not computable from available
    sources) on whether standard linear self-reduction from that level's
    k in {2,3,4} real MLWE public-key rows can approach Simon 2026's own
    stated Q = k*n^(c+1) (c >= 12) sample requirement without exceeding that
    algorithm's own stated 1/O(log n) faulty-sample tolerance, at ML-KEM's
    actual (non-asymptotic) parameters under the explicitly disclosed
    n := k*256 working definition. No ML-KEM implementation, no lattice
    software, no quantum simulation, and no attack of any kind is authorized
    or performed. This is the primary deliverable IDEA-20260813-02479f itself
    names as the cheapest, most decisive gate on the entire ML-KEM DCP-route
    family (RQ-QALG-457b41), to be resolved before any more expensive design
    or compute (e.g. IDEA-20260813-4aecda's Lemma-3 audit) is authorized.

  what_this_is_not:
    - Not an attack on ML-KEM, not a key recovery attempt, and not a certificate of any kind.
    - Not a verification or refutation of Simon 2026's Lemma 3, Lemma 4, or any other part of KN-LIT-e204ab; that is IDEA-20260813-4aecda's separate, not-yet-authorized audit.
    - Not a claim that Simon 2026's algorithm is correct or incorrect; every numeric output takes the paper's own stated constants at face value for the arithmetic, and KN-LIT-e204ab's unverified status is disclosed throughout.
    - Not an approval, freezing, or execution of any run beyond this contract's own gated stages; approval of this specification is not dispatch authorization (see status block above).
    - Not a use of any ML-KEM secret, key, or decapsulation oracle anywhere; every quantity is computable from Simon's own stated formulas and ML-KEM's public, standardized parameters.

  claim_ceiling:
    tier: derivation
    exact_scope_a_run_could_support: >-
      A completed run could support, at most: (1) a source-cited pin of
      Simon's "n" definition (already done at design time, carried into
      inputs below); (2) exact numeric values of Q at each standardized level
      and each swept c; (3) a closed-form noise-variance-vs-combination
      formula with its m=1/m=2 baseline checks; (4) an exact combinatorial
      ceiling on distinct low-variance combinations from k real rows; (5) IF
      stage 0's conversion chain is derivable within budget, an effective
      faulty-rate comparison against 1/O(log n) with an exact numeric margin;
      OTHERWISE a reported "not computable from available sources" outcome.
      NOTHING ELSE. In particular no outcome may be quoted as an ML-KEM
      attack, a speedup, a security-margin revision, or a verdict on Simon
      2026's correctness.

  source_refs:
    proposal: ledger/proposals/IDEA-20260813-02479f.yaml
    hypothesis: ledger/hypotheses/H-MLKEM-36f511.yaml
    goal: ledger/goals/GOAL-QALG-001.yaml
    goal_checkpoint: ledger/goals/GOAL-QALG-001/checkpoints/BATCH-d4b33f.yaml
    question: ledger/questions/RQ-QALG-457b41.yaml
    dcp_paper_extracted_text: inputs/DCP-SIMON-2026/paper_extracted_text.txt
    kn_lit_e204ab: knowledge/literature/KN-LIT-e204ab.md
    kn_lit_21383c: knowledge/literature/KN-LIT-21383c.md
    kn_open_8a5965: knowledge/open-problems/KN-OPEN-8a5965.md
    kn_tech_d1bc4f: knowledge/techniques/KN-TECH-d1bc4f.md

  inputs:
    ml_kem_parameters:
      ML-KEM-512: {k: 2, q: 3329, eta1: 3, eta2: 2}
      ML-KEM-768: {k: 3, q: 3329, eta1: 2, eta2: 2}
      ML-KEM-1024: {k: 4, q: 3329, eta1: 2, eta2: 2}
      source: FIPS 203, as staged in inputs/MLKEM-DUAL-SOURCES-20260802/fips203.
      cbd_variance_formula: "Var(CBD(eta)) = eta/2, exact."
    n_definition:
      pinned_literal_definition: >-
        Simon's "n" is the dimension of the SVP/LWE lattice the reduction
        operates over (inputs/DCP-SIMON-2026/paper_extracted_text.txt, pages
        1-3: "p(n)-SVP is the problem of finding a non-zero vector in an
        n-dimensional lattice"; DCP group order 2N ~ 2^(n+1) post-BKSW,
        Regev's original quadratic blow-up N ~ 2^(n^2) removed by BKSW). This
        pin is source-cited and design-time-complete; it is not recomputed by
        this experiment's runtime.
      working_substitution_for_ml_kem: >-
        n := k*256 (module rank times ring degree). EXPLICITLY DISCLOSED,
        UNVERIFIED WORKING DEFINITION -- BKSW's reduction is stated for
        unstructured LWE, not Module-LWE, and KN-OPEN-8a5965's own Q2 names
        this bridge as fully open. Every stage-2 onward output must carry
        this caveat verbatim or by direct reference; the run must not drop it
        in any summary line (matching docs/claims-and-verification.md's
        conditional-qualifier discipline).
      giving_n: {ML-KEM-512: 512, ML-KEM-768: 768, ML-KEM-1024: 1024}
    simon_constants:
      Q_formula: "Q = k_simon * n^(c+1)"
      c_minimum_stated: 12
      c_sensitivity_sweep: [12, 13, 15, 20]
      condition: "k_simon > c (Simon's own stated condition on his internal parameter k_simon)"
      faulty_rate_tolerance: "1/O(log n)"
      symbol_collision_warning: >-
        Simon's paper uses "k" for its OWN internal group/repetition
        parameter (k_simon > c); ML-KEM's module rank is ALSO conventionally
        "k" (k in {2,3,4}). These are DIFFERENT quantities. Every artifact
        this experiment produces must write k_simon and k_mlkem distinctly
        and never conflate them; this is a required_artifacts item below, not
        a stylistic preference.
      source: inputs/DCP-SIMON-2026/paper_extracted_text.txt; knowledge/literature/KN-LIT-e204ab.md.
    self_reduction_model:
      construction: >-
        A virtual sample v = sum_{i in S} c_i * (a_i, b_i), S a subset of the
        k_mlkem real rows with |S| = m <= k_mlkem, c_i bounded public
        coefficients (magnitude bound B), optionally blinded by fresh public
        randomness that does not change the error-term variance accounting.
      variance_formula_under_test: "Var(sum_i c_i * e_i) = sum_i c_i^2 * Var(e_i), e_i ~ CBD(eta) independent."
      combinatorial_ceiling_definition: >-
        The number of DISTINCT (S, coefficient-vector) choices with
        |S| = m <= k_mlkem and each |c_i| <= B, up to the equivalences that do
        not change v's distribution (e.g. sign symmetry where applicable),
        computed exactly, not estimated.
    stage_0_conversion_chain:
      required_object: >-
        A citable, checkable formula or argument converting a given self-
        reduction noise-variance inflation into an effective approximation
        factor a(n) (equivalently, an effective DCP faulty rate 1/a(n)),
        comparable against Simon's stated 1/O(log n) tolerance, per
        KN-TECH-d1bc4f's stated (but not formula-level) relationship "Regev's
        reduction converts a(n)-approximate lattice problems into DCP
        instances with faulty-sample rate 1/a(n)".
      currently_available_sources: >-
        knowledge/literature/KN-LIT-21383c.md (Regev 2004, summary only, "Paper
        not read"); knowledge/techniques/KN-TECH-d1bc4f.md (states the
        relationship qualitatively, not as a formula); knowledge/open-problems/
        KN-OPEN-8a5965.md; inputs/DCP-SIMON-2026/paper_extracted_text.txt
        (states the reduction's existence and DCP group-order
        parameterization only). Regev 2004's and BKSW's full derivations are
        NOT staged in this repository's inputs/ as of this filing.
      gating_rule: >-
        If the Executor can derive or locate (e.g. via literature reading
        authorized under this contract's stage-0 budget) a citable formula or
        a self-contained derivation for this conversion, it is archived as a
        derivation-note artifact and stage 1 onward proceeds using it. If not,
        the run reports "NOT COMPUTED: conversion chain unavailable from
        available sources" for the faulty-rate comparison specifically, and
        proceeds with stages 1-3 (variance formula, Q computation,
        combinatorial ceiling) reported on their own terms -- these remain
        individually decidable and informative even without stage 0 (e.g. the
        combinatorial ceiling alone can already show the achievable distinct-
        sample count is astronomically short of Q, which is informative
        regardless of the exact faulty-rate conversion).
    seeds:
      applicability: >-
        NOT APPLICABLE: this experiment is a deterministic closed-form
        arithmetic/symbolic computation with no random sampling anywhere.
        Every quantity (Q, the variance formula, the combinatorial ceiling,
        the stage-0 conversion if derived) is independently re-derivable by
        any reviewer from the stated inputs and formulas alone, without a
        seed, without re-running anything stochastic. No master_seed is
        defined and none is needed.

  controls:
    - >-
      BASELINE-EMBEDDING CONTROL (stage 1, required before any other stage's
      output is trusted): the general variance formula must reduce exactly to
      eta/2 at m = 1 (zero inflation) and to exactly eta at m = 2 with unit
      coefficients (CBD convolution property). A formula that fails either
      check is a derivation defect, not a finding, and halts the run.
    - >-
      TRIVIAL-FLOOR CONTROL: the degenerate case Q <= k_mlkem (no self-
      reduction needed) must be confirmed trivially realizable before the
      astronomically larger required Q is evaluated -- a sanity check on the
      formula's low end.
    - >-
      FALSIFYING CONTROL (the experiment's own core mechanism, per this
      task's constraints): a pure formula comparison, no simulation needed --
      the exact combinatorial ceiling on distinct low-variance virtual
      samples achievable from k_mlkem <= 4 real rows is compared directly
      against the exact numeric value of Q; either the ceiling is reached
      (falsifying "unrealizable") or it is not (supporting "unrealizable"),
      decidable from the two numbers alone.
    - >-
      SENSITIVITY CONTROL: the realizability verdict is reported across the
      full c sensitivity sweep {12, 13, 15, 20}, since larger c increases Q
      (worse for realizability) but, per KN-OPEN-8a5965, also changes the
      algorithm's own failure-probability bound -- the tradeoff is reported,
      never fixed at one arbitrary c.
    - >-
      SYMBOL-COLLISION CONTROL: every artifact keeps k_simon and k_mlkem
      visibly distinct (see inputs.simon_constants.symbol_collision_warning);
      an artifact that conflates them anywhere is treated as invalid and must
      be corrected before the run's outputs are read.

  independent_variables:
    - ML-KEM standardized level (512 / 768 / 1024, i.e. k_mlkem in {2,3,4})
    - c (Simon's own internal parameter, swept over {12, 13, 15, 20})
    - m (number of real rows combined per virtual sample, 1 <= m <= k_mlkem)
    - B (coefficient magnitude bound, swept over a small explicit grid the Executor records, e.g. {1, 2, eta1, eta2})

  metrics:
    primary:
      - "n_pinned: the source-cited definition of Simon's n, and the disclosed working substitution n := k*256 per level."
      - "Q_table: exact numeric Q = k_simon * n^(c+1) at each level and each swept c."
      - "variance_formula: the closed-form noise-variance-vs-(m,B) formula, with its m=1/m=2 baseline checks passing."
      - "combinatorial_ceiling: the exact count of distinct low-variance virtual samples achievable from k_mlkem real rows, as a function of m and B."
      - "realizability_verdict: the three-way verdict per level, with exact numeric margin where computable, across the c sensitivity sweep."
    secondary:
      - "stage_0_disposition: whether the noise-variance-to-faulty-rate conversion chain was derived, and if so, the derivation-note artifact path; if not, the explicit not-computed disposition."
      - "trivial_floor_check: confirmation that Q <= k_mlkem is realizable without self-reduction."
      - "symbol_collision_audit: a written confirmation that no artifact conflates k_simon and k_mlkem."

  heuristic_under_test: HEUR-MLKEM-36f511-1

  preregistered_prediction:
    quantity: >-
      (i) the exact Q_table at c = 12 and the sensitivity sweep; (ii) the
      combinatorial_ceiling at each level; (iii) the realizability_verdict.
    formula: >-
      (i) Q = k_mlkem * (k_mlkem*256)^(c+1) at each level, evaluated exactly.
      (ii) combinatorial_ceiling <= (2B+1)^(k_mlkem) for the coefficient-bound
      construction defined in inputs.self_reduction_model (an upper bound on
      distinct low-variance combinations from only k_mlkem <= 4 real rows).
      (iii) PREDICTED (not yet confirmed, and not privileged over the
      opposite outcome by this contract's own decision rule): "unrealizable"
      at all three levels, because combinatorial_ceiling is expected to sit
      astronomically below Q_table for any B small enough to keep noise
      variance/faulty-rate inside budget -- but the run must report whichever
      of the three verdicts the actual arithmetic produces, and F2/F3 in
      H-MLKEM-36f511 are both fully specified, decidable outcomes.
    source: >-
      H-MLKEM-36f511 (statement, mechanism, proof_search_map,
      HEUR-MLKEM-36f511-1); IDEA-20260813-02479f's own minimal_test and
      predictions. NO EXTERNAL SOURCE IS CITED FOR THE FINAL NUMERIC MARGIN
      BEYOND SIMON'S OWN STATED CONSTANTS AND ML-KEM'S OWN STANDARDIZED
      PARAMETERS, and no theorem number, page, or table from Regev 2004 or
      BKSW is asserted anywhere in this contract beyond what
      inputs/DCP-SIMON-2026/paper_extracted_text.txt itself states.

  scale_relevance:
    tier: null
    justification: >-
      Not applicable in the toy/medium/crypto sense: this is a closed-form
      derivation over exact stated parameters and exact stated formulas, not
      an empirically-scaled run (see claim_tier: derivation above). ML-KEM's
      parameters used (q = 3329, n up to 1024 under the working definition)
      are the ACTUAL standardized values, not a toy extrapolation of them.
    correspondence: null

  tail_checks:
    - >-
      Extreme-c check: report the realizability verdict at both the paper's
      own stated minimal c = 12 and at a materially larger c = 20, to confirm
      the direction of the tradeoff (larger c enlarges Q, worsening
      realizability, per KN-OPEN-8a5965) is reproduced by the arithmetic
      rather than assumed.
    - >-
      Extreme-B check: report the combinatorial ceiling at both a minimal
      coefficient bound (B = 1) and a bound large enough to make the ceiling
      approach Q (if any exists within a defensible noise budget), so the
      reviewer can see the full tradeoff curve rather than one point on it.

  replication:
    seeds: []
    independent_instances: 0
    interpretation: >-
      NOT APPLICABLE: DETERMINISTIC, INDEPENDENTLY RE-DERIVABLE BY ANY
      REVIEWER. Every quantity computed by this experiment is a closed-form
      arithmetic/symbolic evaluation of Simon's own stated formulas and
      ML-KEM's own standardized parameters; there is no sampling, no random
      seed, and no source of run-to-run variation. "Replication" here means
      an independent reviewer re-deriving the same numbers from the same
      inputs by hand or with independent code, which is exactly what
      required_artifacts below is structured to make possible, rather than
      re-running with a different seed.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 0.25
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
    note: >-
      Small by design: symbolic/exact-integer arithmetic and, at most,
      bounded literature reading for stage 0 (no lattice software, no ML-KEM
      implementation, no quantum simulation, no numerical optimization). The
      only way this budget is exceeded is stage 0's literature-reading effort
      running long, in which case stage 0's gating_rule (report "not computed"
      and proceed with stages 1-3) applies rather than extending the budget.

  stopping_rules:
    - Do not execute unless execution_authorized is separately flipped true by a later Coordinator act (see status block above) and the paired handoff's dispatch hold is cleared.
    - Stop the whole run if stage 1's baseline-embedding control fails (F1).
    - Stop stage 0 at its allotted share of the budget and report "NOT COMPUTED: conversion chain unavailable" rather than extending it; proceed to stages 1-3 regardless.
    - Stop at the first wall-clock, memory, or run-count ceiling and report what was covered rather than truncating silently.

  invalidation_rules:
    - Any execution while execution_authorized is false or the dispatch hold named in ledger/handoffs/TASK-20260814-807901.yaml is uncleared.
    - Any change to Q's formula, the variance-additivity formula, or the c sensitivity grid after any number has been observed (requires a versioned protocol_amendment).
    - Any artifact that conflates k_simon and k_mlkem (symbol-collision control).
    - Any claim that a favorable (realizable) verdict establishes Simon 2026's correctness, or that an unfavorable (unrealizable) verdict refutes it -- this experiment is silent on Lemma 3 and the base reduction's noise rate by design.
    - Reporting a realizability verdict for the faulty-rate axis specifically without either the stage-0 derivation artifact or the explicit "not computed" disposition attached.

  success_criterion: >-
    A run is successful (produces a reportable, decidable disposition) under
    ANY of these three mutually exclusive, individually complete outcomes,
    each fully specified in advance: (a) REALIZABLE -- the combinatorial
    ceiling and, if stage 0 is discharged, the effective faulty rate both stay
    within Simon's stated budget at the required Q, at some standardized
    level, robustly across the c sweep; (b) UNREALIZABLE -- the combinatorial
    ceiling (and, if stage 0 is discharged, the effective faulty rate) fall
    short of what's needed at the required Q, at some standardized level,
    robustly across the c sweep; (c) stages 1-3 complete and are reported in
    full (Q table, variance formula with passing baseline checks,
    combinatorial ceiling) while stage 0's faulty-rate comparison specifically
    is reported "NOT COMPUTED: conversion chain unavailable from available
    sources" -- an honest, complete, non-negative disposition per AGENTS.md
    rule 5. A run that reports NEITHER a verdict NOR an explicit "not
    computed" disposition for the faulty-rate axis is incomplete, not
    successful.

  falsification_criterion: >-
    H-MLKEM-36f511 is falsified, in whole or in the named part, by any of:
    (F1) the noise-variance formula does not reduce to eta/2 at m = 1 or to
    eta at m = 2 -- the baseline embedding is wrong and nothing downstream may
    be reported until corrected; (F2) the realizability verdict is
    "realizable within budget" at any standardized level, robustly across the
    c sweep -- refutes this hypothesis's predicted severity and redirects
    scrutiny to IDEA-20260813-4aecda / IDEA-20260813-0cf345 for that level.
    (F3, the hypothesis's own predicted outcome, is NOT a falsification --
    see H-MLKEM-36f511.falsification_conditions for the full symmetric
    statement.) Stage 0's "not computed" disposition (F4) is explicitly NEVER
    a falsification of anything and is never defaulted to either verdict.

  required_artifacts:
    - Frozen approved specification (this file) with a freeze receipt binding its SHA-256, produced by this batch's snapshot archive (TASK-20260814-8a0fea).
    - The source-pin citation for Simon's n (page/line reference into inputs/DCP-SIMON-2026/paper_extracted_text.txt) as a standalone, independently checkable note.
    - Stage 0's outcome: either the derivation-note artifact for the noise-variance-to-faulty-rate conversion (independently checkable step by step, per docs/claims-and-verification.md's derivation-note discipline) or the explicit "not computed" disposition with the sources checked named.
    - The Q table (all levels x all swept c values), as raw exact integers or exact symbolic expressions, not floating-point approximations that could hide the astronomical scale involved.
    - The variance formula derivation with its m=1 and m=2 baseline-check outputs shown explicitly.
    - The combinatorial-ceiling derivation and its final numeric value(s) at the swept B grid, per level.
    - The realizability verdict table (three-way, per level, per swept c), with exact numeric margins wherever computable.
    - A written symbol-collision audit statement confirming k_simon and k_mlkem were kept distinct throughout.
    - Manifest, environment, exact commands or symbolic-computation transcript, timestamps, and resource measurements, per AGENTS.md's Artifact policy.
    - Snapshot archive followed by independent validation and red-team review before any evidence record is written from this run.

  assigned_to: executor
