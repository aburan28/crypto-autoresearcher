protocol_amendment:
  experiment_id: EXP-MLKEM-12d9b8
  hypothesis_id: H-MLKEM-36f511
  goal_id: GOAL-QALG-001
  amendment_ordinal: 1
  filename_convention_note: >-
    v1.yaml denotes amendment ordinal 1, advancing the frozen protocol from
    base version 1 to resulting version 2. It is not a second copy of
    version 1 (docs/task-lifecycle.md "Protocol amendments": "After approval
    the protocol is frozen. Any later change requires a versioned
    protocol_amendment... never an edit of the frozen prediction").
  base_version: 1
  resulting_version: 2
  authored_by: coordinator
  authored_at: '2026-09-06'
  approved_by: coordinator
  approved_at: '2026-09-06'

  reason: >-
    Resolves MLKEM-OBJ-1 (moderate), the sole objection against
    EXP-MLKEM-12d9b8 requiring action per red-team report RT-20260814-41d4cc
    (coordination/goals/GOAL-QALG-001/batches/BATCH-dbf57a/tasks/TASK-20260814-11516e/red_team_report.yaml),
    as directed by ledger/decisions/DEC-20260814-1445a1.yaml's next_actions
    item (a). MLKEM-OBJ-2 (minor) was independently confirmed sound by the
    red team and is untouched by this amendment. MLKEM-OBJ-3
    (informational) required no action and is untouched. This is the
    versioned protocol_amendment DEC-20260814-1445a1 directed a follow-up
    batch to produce; it does not itself clear the dispatch hold on
    ledger/handoffs/TASK-20260814-807901.yaml -- clearing that hold is a
    separate, later Coordinator decision act citing this amendment (see
    next_step below).

  applies_to: future_runs_only
  affected_runs: none
  affected_runs_note: >-
    No run of EXP-MLKEM-12d9b8 has ever executed (execution_authorized has
    been false since filing and remains false; see authority_boundary
    below), so there is no historical run record for this amendment to
    reclassify, downgrade, or otherwise touch.

  # =====================================================================
  # MLKEM-OBJ-1: THE DEFECT, TRANSCRIBED FROM THE RED-TEAM REPORT.
  # =====================================================================
  objection_addressed:
    id: MLKEM-OBJ-1
    severity: moderate
    source: >-
      RT-20260814-41d4cc, coordination/goals/GOAL-QALG-001/batches/BATCH-dbf57a/tasks/TASK-20260814-11516e/red_team_report.yaml,
      objections[0].
    finding_verbatim_summary: >-
      The red team independently computed that F2 (REALIZABLE) is
      combinatorially foreclosed for ANY coefficient bound B compatible with
      ML-KEM's own ring structure: at ML-KEM-512 (k_mlkem=2, n=512), Simon's
      own stated minimal c=12 gives Q = 2*512^13 = 2*2^117 ~ 3x10^35. Even at
      B = ML-KEM's own modulus q = 3329 -- already beyond anything the
      contract's own example grid explores, and already physically
      meaningless since ML-KEM arithmetic is mod q -- the combinatorial
      ceiling caps at (2*3329+1)^4 ~ 2x10^15 for the largest level (k=4),
      roughly 20 orders of magnitude short of Q even at its smallest
      standardized value. The contract does not disclose this gap (unlike
      its careful disclosure of the stage-0 gap), and the tail_checks
      "extreme-B check" instruction has no operational stopping rule: an
      Executor either stays inside the tiny example grid and trivially
      reproduces the predicted outcome, or searches an unbounded B with no
      principled ceiling.
    two_required_controls_from_the_report:
      - >-
        Add a stage-0-independent justification for any B considered in the
        tail_checks extreme-B search (e.g., cap B at ML-KEM's own modulus q)
        OR state that the extreme-B check's conclusion follows from the
        modulus bound alone and does not require stage 0.
      - >-
        Add one disclosure sentence stating the order-of-magnitude gap this
        review computed, so a reader is not left to infer F2 is a live,
        uncertain outcome when it is essentially foreclosed by ML-KEM's own
        ring structure independent of anything the run computes.

  # =====================================================================
  # THE CHANGES.
  # =====================================================================
  changes:
    - id: MLKEM-CHG-1-DISCLOSE-F2-CEILING-GAP
      closes: >-
        Required control 2 above (the disclosure sentence).
      field_scope: preregistered_prediction.formula
      operation: append_disclosure_addendum
      old_text_superseded_verbatim: >-
        (iii) PREDICTED (not yet confirmed, and not privileged over the
        opposite outcome by this contract's own decision rule): "unrealizable"
        at all three levels, because combinatorial_ceiling is expected to sit
        astronomically below Q_table for any B small enough to keep noise
        variance/faulty-rate inside budget -- but the run must report whichever
        of the three verdicts the actual arithmetic produces, and F2/F3 in
        H-MLKEM-36f511 are both fully specified, decidable outcomes.
      new_text: >-
        (iii) PREDICTED (not yet confirmed, and not privileged over the
        opposite outcome by this contract's own decision rule): "unrealizable"
        at all three levels, because combinatorial_ceiling is expected to sit
        astronomically below Q_table for any B small enough to keep noise
        variance/faulty-rate inside budget -- but the run must report whichever
        of the three verdicts the actual arithmetic produces, and F2/F3 in
        H-MLKEM-36f511 are both fully specified, decidable outcomes.

        DISCLOSURE ADDENDUM (added by this amendment, per MLKEM-OBJ-1):
        independent arithmetic (RT-20260814-41d4cc) already shows the gap is
        not merely "expected" but overwhelming and computable in advance of
        any run: at ML-KEM-512 (k_mlkem=2, n=512), Q = k_simon*n^(c+1) at
        Simon's own stated minimal c=12 is 2*512^13 = 2*2^117 ~ 3x10^35, while
        combinatorial_ceiling <= (2B+1)^k_mlkem caps at (2*3329+1)^4 ~ 2x10^15
        even at the largest level (k_mlkem=4) and the most generous
        ring-compatible bound B = q = 3329 (ML-KEM's own modulus; see
        MLKEM-CHG-2 for why B cannot meaningfully exceed q). The gap is
        therefore roughly 20 orders of magnitude, independent of c's sweep
        value, independent of m, and independent of stage 0's faulty-rate
        conversion. F2 (REALIZABLE) REMAINS A COHERENT, FULLY SPECIFIED
        OUTCOME TYPE under this contract's success_criterion and
        falsification_criterion -- the run must still report whichever
        verdict the actual arithmetic produces (AGENTS.md rule 5; this
        amendment does not authorize defaulting the reported verdict to F3)
        -- but a reader of this contract is no longer left to infer that F2
        is comparably likely to F3: it is disclosed here, before dispatch,
        as combinatorially foreclosed for any B compatible with ML-KEM's own
        ring structure.
    - id: MLKEM-CHG-2-BOUND-EXTREME-B-CHECK
      closes: >-
        Required control 1 above (operational stopping rule for the
        extreme-B check), and independently discharges CONSEQUENCE named in
        MLKEM-OBJ-1 (the tail-check instruction "has no operational stopping
        rule").
      field_scope: tail_checks[1] (the "Extreme-B check" item)
      operation: replace_unbounded_search_with_named_ceiling_and_stopping_rule
      old_text_superseded_verbatim: >-
        Extreme-B check: report the combinatorial ceiling at both a minimal
        coefficient bound (B = 1) and a bound large enough to make the ceiling
        approach Q (if any exists within a defensible noise budget), so the
        reviewer can see the full tradeoff curve rather than one point on it.
      new_text: >-
        Extreme-B check: report the combinatorial ceiling at (i) a minimal
        coefficient bound B = 1, and (ii) B CAPPED AT ML-KEM'S OWN MODULUS
        q = 3329 (FIPS 203, all three standardized levels). B = q IS THE
        OPERATIVE CEILING FOR THIS CHECK AND MUST NOT BE EXCEEDED: ML-KEM
        arithmetic is defined over Z_q, so any coefficient magnitude B' > q
        induces no new distinct residue class beyond those already reachable
        at B = q under inputs.self_reduction_model's own construction --
        coefficients beyond the modulus add no new distinct virtual sample.
        B = q is therefore the maximum physically meaningful bound compatible
        with ML-KEM's own ring structure, and the combinatorial ceiling at
        B = q is the single, named endpoint of this tail check, not a
        starting point for further search. THIS SPECIFIC SUB-CLAIM (the
        ceiling at B = q, and its numeric comparison against Q_table) FOLLOWS
        FROM THE MODULUS BOUND AND combinatorial_ceiling_definition ALONE; it
        does NOT require stage 0's noise-variance-to-faulty-rate conversion
        chain to resolve, and it must be reported at both B = 1 and B = q
        regardless of stage 0's disposition (derived, or "NOT COMPUTED" per
        the gating_rule). The Executor stops the extreme-B sweep at B = q and
        must not search any B > q looking for an undefined "defensible noise
        budget" -- that phrase, and the unbounded search it invited, is
        superseded in full by this fixed, named ceiling.
    - id: MLKEM-CHG-3-ANNOTATE-F2-FALSIFICATION-CLAUSE
      closes: >-
        Cross-references MLKEM-CHG-1's disclosure into the falsification
        criterion itself, so the disclosure is visible wherever F2 is
        defined in this contract, not only in preregistered_prediction.
      field_scope: falsification_criterion (the F2 clause)
      operation: append_cross_reference_annotation
      old_text_superseded_verbatim: >-
        (F2) the realizability verdict is "realizable within budget" at any
        standardized level, robustly across the c sweep -- refutes this
        hypothesis's predicted severity and redirects scrutiny to
        IDEA-20260813-4aecda / IDEA-20260813-0cf345 for that level.
      new_text: >-
        (F2) the realizability verdict is "realizable within budget" at any
        standardized level, robustly across the c sweep -- refutes this
        hypothesis's predicted severity and redirects scrutiny to
        IDEA-20260813-4aecda / IDEA-20260813-0cf345 for that level. F2
        remains this contract's defined, fully specified outcome type and,
        if the arithmetic actually produces it, still triggers the stated
        redirection in full; see this amendment's MLKEM-CHG-1 disclosure
        addendum (preregistered_prediction.formula) for the independently
        computed ~20-order-of-magnitude combinatorial gap that makes F2
        foreclosed under any B compatible with ML-KEM's own ring structure --
        disclosed for a reader's benefit, never as authorization to report
        F2 as excluded a priori or to skip computing and reporting whichever
        verdict the actual arithmetic at each level and c produces.

  objections_not_actioned:
    - id: MLKEM-OBJ-2
      severity: minor
      disposition: >-
        NO ACTION. Independently confirmed sound by the red team itself
        ("The flagged mid-design gap (stage-0 conversion chain) was handled
        honestly, not smoothed over -- independently confirmed"). Untouched
        by this amendment per this task's own instruction not to touch it.
    - id: MLKEM-OBJ-3
      severity: informational
      disposition: >-
        NO ACTION NEEDED. The red team found stage 0's literature dependency
        already has a clean, non-defaulting escape valve (F4) and no hold was
        warranted on this point. Untouched by this amendment.

  # =====================================================================
  # WHAT REMAINS OPEN / UNATTEMPTED.
  # =====================================================================
  what_remains_open:
    - >-
      Stage 0's noise-variance-to-faulty-rate conversion chain remains
      genuinely unresolved (unchanged by this amendment) -- the contract's
      own F4 disposition ("NOT COMPUTED: conversion chain unavailable from
      available sources") continues to govern that axis, exactly as before.
    - >-
      This amendment does not flip execution_authorized and does not clear
      the dispatch hold on ledger/handoffs/TASK-20260814-807901.yaml. Both
      remain a separate, later Coordinator decision act that must cite this
      amendment's id and record that MLKEM-OBJ-1 is resolved.
    - >-
      H-MLKEM-36f511 (the ledger hypothesis record) itself still carries the
      "equally live... not dispreferred" framing in its own `statement`
      field, unedited by this amendment (out of this task's write_scope,
      which is confined to experiments/EXP-MLKEM-12d9b8/amendments/). The
      red team's required_controls explicitly accepted disclosure in EITHER
      the hypothesis or the experiment contract ("add one disclosure
      sentence to H-MLKEM-36f511 OR EXP-MLKEM-12d9b8"); this amendment
      discharges that control via the experiment contract, which is the
      document the Executor actually reads to execute the run, so the
      hypothesis record's own text is left as an open item for a future
      ledger correction to align, not a blocking defect for dispatch.
    - >-
      This amendment resolves interpretation and discloses a pre-computed
      arithmetic gap only; it asserts no new realizability verdict, computes
      no run output, and authorizes no execution.

  historical_run_integrity:
    rescoring: not_applicable
    reclassification: not_applicable
    amendment_of_run_record: not_applicable
    artifact_mutation: not_applicable
    statement: >-
      No run record exists for EXP-MLKEM-12d9b8 as of this amendment; there
      is nothing historical for this amendment to touch.

  authority_boundary:
    claim_ceiling: protocol_repair_only_no_compute_no_status_transition
    execution_authorized_by_this_amendment: false
    dispatch_hold_cleared_by_this_amendment: false
    experiment_status_transition: none
    hypothesis_status_transition: none
    goal_status_transition: none
    scientific_interpretation_authority: none

  nonclaims:
    - No claim that H-MLKEM-36f511 is supported, refuted, or advanced by this amendment.
    - No claim that F2 (REALIZABLE) is impossible in any absolute sense -- only that it is combinatorially foreclosed under standard linear self-reduction with coefficient bound B compatible with ML-KEM's own ring structure, per the disclosed arithmetic, and the run must still compute and report whichever verdict the actual numbers produce at each level and c.
    - No claim that stage 0's conversion-chain gap is resolved by this amendment.
    - No claim that MLKEM-OBJ-1 is the only remaining consideration before dispatch; TASK-20260814-807901's own DO NOT DISPATCH notice and this batch's ledger-archive step still govern whether dispatch may proceed.
    - No authorization of execution, and no clearing of the dispatch hold; both are named as the next Coordinator act, not performed here.

  next_step: >-
    A Coordinator decision citing this amendment (experiments/EXP-MLKEM-12d9b8/amendments/v1.yaml)
    must record that MLKEM-OBJ-1 is resolved before ledger/handoffs/TASK-20260814-807901.yaml
    may be dispatched to the Executor; that decision is a separate act from
    this amendment (see AGENTS.md rule 1: only the Coordinator changes
    hypothesis status or approves experiments, and this amendment itself
    does not perform that act).

  confirmatory_status: preserved
  confirmatory_rationale: >-
    No run has ever executed against EXP-MLKEM-12d9b8; this amendment
    resolves a design-time disclosure/decidability defect identified by
    independent red-team review before any compute was spent, per
    DEC-20260814-1445a1's own characterization ("narrow, protocol-level
    defects... resolvable by a versioned protocol_amendment without
    re-scoping either experiment or re-running any design work"). No
    pre-registered prediction, success criterion, or falsification criterion
    is narrowed, widened, or reversed by this amendment -- F2 and F3 remain
    exactly as decidable and exactly as unprivileged relative to each other
    as before; only a disclosure and an operational search bound are added.

