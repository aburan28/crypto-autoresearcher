  version: 1
  title: >-
    Stage 0 Lemma V / Theorem W / H1 worksheet; Stage 1 Python A(1) census
    of the elliptic-curve log-graph versus pairing-preserving NULL-1 on
    field_bits 10..16
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-04'
  approval_decision: DEC-20261004-7129c9
  packaging_only: false
  designed_at: '2026-10-04'
  frozen: true
  frozen_at: '2026-10-04'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261004-7129c9 under AGENTS.md standing user authorization
