      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. {run_dir} is substituted by
      the process supervisor. trial-plan.json is a byte-identical twin of
      trial-plan-v1.json.
  approval:
    approval_decision: DEC-20261004-7129c9
    composing_decision: DEC-20261004-7129c9
    rule: >-
      Approved under AGENTS.md "Standing user authorization for ideas and
      experiments" (user, 2026-09-06: "all is approved. ideas/experiments should
      be always approved") once the protocol was complete. Approval does not
      assert the hypothesis is true. Stages 0-1 only.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      section: Standing user authorization for ideas and experiments
      instruction_date: '2026-09-06'
      quotation: 'all is approved. ideas/experiments should be always approved'
      renewed_user_approval_required: false

  objective: >-
    Decide, on Python-enumerable prime-order toys at field_bits 10..16, whether
    the maximal agreement A(1) of Gamma_E with degree-1 graphs sits inside the
    pairing-preserving NULL-1 band (O-E-RANDOM / H1) or exhibits a power or
    Weil-tight incidence signature (O-E-POWER / O-E-WEIL-TIGHT), after a
    zero-run Stage-0 worksheet that freezes Lemma V, Theorem W (audit K=8),
    regime arithmetic and the H1 first-moment table.

  class: heuristic-validation
  class_note: >-
    Heuristic-validation of H1 at toy scale, with Theorem W as the rigorous
    ceiling control. No exponent-moving claim.

  claim_tier_and_scope:
    claim_tier: toy
    statement: >-
      Exact A(1) incidence census on self-generated field_bits {10..16} curves
      versus NULL-1. No discrete-logarithm solve. No deployed curve.
    sota_delta: zero on every ECDLP cost axis
    dominated_by: rho / van Oorschot-Wiener at 0.886 sqrt(n)
    certificate_kind: agreement_list
    certificate_note: >-
      Argmax line (a,b) and its agreement list are re-verifiable by independent
      evaluation of a*x+b against stored logs. No DL solve certificate.
    affected_vs_safe: No deployed or standardized curve is touched.

  scope:
    included:
      - 'Stage 0 (zero scientific trials): Lemma V, Theorem W, regime arithmetic, H1 table, retrieval status, self-checks, precommit hashes'
      - 'Stage 1: field_bits {10..16}; A(1) census; NULL-1; planted positives; j=0 expected orbit; anomalous ceiling when found; Theorem W audit'
    excluded:
      - Stage 2 A(2), bivariate affine census, windowed A(1,E)
      - Magma/Sage/AUXIN/Bedrock success paths
      - Deployed curves and cryptographic p
      - Editing GOAL-ECDLP2M-001.yaml or IDEA-20261003-cd1903

  stages:
    stage_0:
      name: Zero-run Theorem W / H1 worksheet
      deliverables:
        - stage0/preregistered-predictions.json
        - stage0/theorem-w.yaml
        - stage0/h1-prediction-table.yaml
        - stage0/retrieval-status.yaml
        - stage0/precommit-hashes.json
        - stage0/selfchecks.json
      blocks_stage_1_until: >-
        Stage-0 self-checks pass and precommit-hashes.json is written BEFORE
        any curve enumeration. A failed self-check halts Stage 1.
    stage_1:
      name: Python A(1) census versus NULL-1
      deliverables:
        - stage1/cells.yaml
        - stage1/ladder.json
        - stage1/census.json
        - stage1/decision-rules.json
        - RESULTS.md

  freeze:
    field_bits: [10, 11, 12, 13, 14, 15, 16]
    curves_per_size_declared: 20
    null1_per_size_declared: 20
    executed_taper:
      "10-12": 20
      "13-14": 10
      "15-16": 4
    weil_K: 8
    planted_fracs: [0.5, 0.6, 0.7]
    seeds_base: 2026100400
    ratio_note: taper is a disclosed Python wall-clock bound, not a silent change of H1 thresholds

  inputs:
    field_bits: [10, 11, 12, 13, 14, 15, 16]
    weil_K: 8
    implementation: experiments/EXP-ECDLP-02bd1c/implementation/run.py

  controls:
    - 'NULL-1 pairing-preserving relabelled Z/n (blocking generic-group null)'
    - 'Planted affine agreement on NULL-1 (blocking positive)'
    - 'Identity calibration A(0)=1 and two-point floor A(1)>=2 (Stage 0)'
    - 'Theorem W audit ratio <= 1 (blocking)'
    - 'j=0 expected orbit (n-1)/6 when a j=0 curve is present'
    - 'Anomalous ceiling arm when a CM toy is found (model-blindness control)'
    - 'Timeouts/crashes are O-IMPEDIMENT, never E-RANDOM/POWER/WEIL'

  independent_variables:
    - field_bits in {10..16}
    - arm in {curve, null1, planted, j0, anomalous}
    - curve/null seed

  metrics:
    primary:
      - A1
      - null1_percentile_band
      - fitted_theta
      - outcome_label
      - theorem_w_audit_ratio
    secondary:
      - planted_recovered
      - j0_orbit_count
      - peak_rss_bytes
      - executed_curves_per_size

  heuristic_under_test: H1
  preregistered_prediction:
    quantity: A(1) maximal collinear points of Gamma_E over non-vertical lines
    formula: >-
      E-RANDOM inside NULL-1 95% band with theta < 0.1; E-POWER theta>=0.15 or
      exceedances; E-WEIL-TIGHT A(1)>=0.05 sqrt(p) ln p at two largest sizes;
      H1 first-moment (d+1) ln p / ln((d+1) ln p)
    source: >-
      IDEA-20261003-cd1903 predictions and minimal_test, copied 2026-10-04; executed taper for
      bits>12 disclosed as Python wall-clock bound
  scale_relevance:
    tier: toy
    justification: >-
      field_bits 10..16 with Python enumeration. Transfer to cryptographic p is
      not claimed.
    correspondence: null
  tail_checks:
    - Top lines per size with agreement lists re-verified
    - Planted positives must recover; Theorem W audit must stay <= 1

  replication:
    seeds_base: 2026100400
    independent_instances: 'per-size curve/null draws'
    replication_note: Sizes are the replication axis; taper disclosed above.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 3
    maximum_workers: 1

  stopping_rules:
    - 'Stage 0 completes or Stage 1 does not start'
    - 'Theorem W audit violation voids the mathematical reading'
    - 'Planted miss yields O-ARTIFACT and stops scoring'
    - 'A crash, timeout, or memory abort is O-IMPEDIMENT / failed_infrastructure'
    - 'Stop after Stages 0-1; do not start Stage 2'

  invalidation_rules:
    - Dual meters / null use a different A(1) implementation than the object
    - Magma, Sage, AUXIN, or Bedrock is selected as a success path
    - H1 / E-* thresholds are edited after any Stage-1 read
    - 'IDEA-20261003-cd1903 or GOAL-ECDLP2M-001.yaml is edited'

  success_criterion: >-
    Stage 0 self-checks pass. Stage 1 emits exactly one of O-E-RANDOM,
    O-E-POWER, O-E-WEIL-TIGHT, O-INCONCLUSIVE, O-ARTIFACT, O-IMPEDIMENT from
    the frozen decision rules, with census tables and controls archived.

  falsification_criterion: >-
    O-E-RANDOM is false under the idea's F1. O-E-WEIL-TIGHT is false under F2.
    Audit or planted failures void the run.

  outcome_table:
    O-E-RANDOM: A(1) inside NULL-1 band; theta < 0.1; planted pass; audit pass
    O-E-POWER: theta >= 0.15 or NULL exceedances at >=2 sizes on >=25% curves
    O-E-WEIL-TIGHT: A(1) >= 0.05 sqrt(p) ln p at the two largest sizes
    O-INCONCLUSIVE: controls pass but neither RANDOM nor POWER/WEIL decides cleanly
    O-ARTIFACT: planted miss, audit violation, or null decay failure
    O-IMPEDIMENT: curve search exhausted, timeout, crash; not a mathematical result

  required_artifacts:
    - experiments/EXP-ECDLP-02bd1c/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-02bd1c/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-02bd1c/runs/<RUN-ID>/RESULTS.md
    - experiments/EXP-ECDLP-02bd1c/stage0/preregistered-predictions.json
    - experiments/EXP-ECDLP-02bd1c/stage0/precommit-hashes.json
    - experiments/EXP-ECDLP-02bd1c/stage1/census.json
    - experiments/EXP-ECDLP-02bd1c/stage1/ladder.json
  required_artifacts_note: >-
    Supervisor-generated files per trial (launch.json, execution-receipt.json,
    command.txt, environment.json, stdout.log, stderr.log, check.stdout.log,
    check.stderr.log) are reserved to the process supervisor.

  assigned_to: executor
  amazon_bedrock: NOT SELECTED
  out_of_scope:
    - Magma or Sage tabulated discrete logs
    - AUXIN records
    - 'Any "run: Magma" success path'
    - GOAL-ECDLP2M-001.yaml
    - Stage 2 A(2)/bivariate/windowed arms
    - Deployed curves
