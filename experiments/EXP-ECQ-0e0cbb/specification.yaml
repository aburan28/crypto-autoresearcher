experiment:
  id: EXP-ECQ-0e0cbb
  version: 1
  hypothesis_id: H-ECQ-0ed5c8
  question_id: RQ-ECQ-80f23c
  goal_id: GOAL-ECQ-002
  batch_id: BATCH-8b08ef
  title: >-
    High-ceiling low-content stratum of Mestre's rank-12 quartic construction: squarefree-filtered
    enumeration, full-coverage rank search, and the owed null objects

  contract_provenance: >-
    PRE-REGISTERED. AUTHORED BEFORE ANY PRODUCER RAN AND BEFORE ANY RUN OF THIS EXPERIMENT EXISTS.
    THIS IS THE FIRST EXP RECORD IN THIS CAMPAIGN THAT IS A PROTOCOL RATHER THAN A RECEIPT, and the
    distinction is the whole point of DEC-20260823-ee9162 N1(h) making the contract a dispatch
    blocker rather than an open item. Its four predecessors are named here so no reader has to infer
    the difference, and each of them said so honestly about itself: EXP-ECQ-89de3c (GOAL-ECQ-001),
    EXP-ECQ-139c9f (BATCH-f2341e), EXP-ECQ-7ea4c3 (BATCH-da59ec) and EXP-ECQ-a7d948 (BATCH-541940)
    were ALL authored after execution as index shims, written to make run references resolve, and
    every one of them states in its own contract_provenance that it is not a pre-registered contract
    and does not retroactively supply one. This record supplies one. It is frozen at the commit that
    introduces it; the producer TASK-20260823-827765 must not start until that commit exists, and any
    change to this file after the producer starts is a versioned protocol_amendment, never an edit.
  what_this_contract_does_not_do: >-
    It does not close the four-consecutive-batch finding recorded at DEC-20260823-ee9162 R9(d) and
    R21, and it does not reach backwards. EV-ECQ-8ee697's experiment_ids stays empty and its
    experiment_ids_note stands exactly as written. What is fixed here is BATCH-8b08ef and nothing
    before it.

  status: approved
  approved_by: coordinator
  approved_at: '2026-08-23'
  assigned_to: executor
  assigned_task_id: TASK-20260823-827765

  objective: >-
    Decide, at full coverage of a stratum deliberately built to be favourable, whether the tuple
    lever of Mestre's rank-12 quartic construction reaches a certified rank->=12 curve below the
    published construction-class benchmark -- or whether the campaign's density-and-rate obstruction,
    so far measured at 37.0 percent coverage of the load-bearing set, survives being finished. The
    experiment changes WHAT IS ENUMERATED rather than searching the same census harder, because the
    reason the stratum is untested is a quantity: ONE family of ceiling >= 13 below log P2 = 5 in an
    exhaustive census of 13077, two below 6, twelve below 7.

  standing_negative: >-
    NO RECORD CELL HAS BEEN TAKEN BY THIS CAMPAIGN IN THREE BATCHES, ON ANY METRIC, AT ANY RANK
    THRESHOLD. Best exhibited at certified rank >= 12 is naive height 86.77369390941135. RANK >= 31
    OVER Q REMAINS AN OPEN WORLD RECORD (30, Alpoge-Howell 2026) AND NOTHING IN THIS EXPERIMENT IS
    PROGRESS TOWARD IT. No ECDLP claim, no speedup claim and no asymptotic-complexity claim is made
    or implied, so the four asymptotic promotion gates are not engaged.

  inputs:
    hypothesis: ledger/hypotheses/H-ECQ-0ed5c8.yaml
    review_plan: coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/review_plan.yaml
    binding_prior_review: >-
      coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/tasks/TASK-20260823-33a825/objections.yaml
      (sha256 4f59a071490a6367021e14436887e0a962bb80c1a3ee5e600f8878a4521ead69), whose
      next_concrete_action and resource_reading BIND IN PREFERENCE TO ANY PARAPHRASE, including this
      contract's protocol section.
    frozen_frontier: coordination/goals/GOAL-ECQ-002/baseline/frontier_20260823.json
    frozen_snapshot: coordination/goals/GOAL-ECQ-002/baseline/icarm_database_20260823.json
    frozen_snapshot_sha256: 118db069fcfc0cddc61bb00a235736202f01dc72d608b3c743bd342935cadc59
    prior_census: >-
      coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/tasks/TASK-20260823-416e78/tuple_envelope_scan.json
      -- the 13391 measured families, including the 46 load-bearing ones and the 2114 (family, t)
      pairs among them that were never searched.
    prior_pipeline: >-
      coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/tasks/TASK-20260823-416e78/scripts/, whose
      surface, admissibility and ceiling code two blind reviewers re-derived from scratch and found
      correct. Reuse it; do not rewrite it. Its REPORT PROSE is a different matter -- report.md
      sections 2, 3, 5 and 6 are superseded by DEC-20260823-ee9162 and may not be used as the
      mechanism for anything.

  constants_are_read_never_written: >-
    NO FRONTIER OR BENCHMARK VALUE APPEARS AS A LITERAL IN THE PROTOCOL, IN CODE, OR IN A COMPARISON.
    The r >= 12 cell is read at run time from frontier_20260823.json (threshold 12,
    min_naive_height); the construction-class benchmark is read at run time from
    icarm_database_20260823.json (entry id 1, naive_height). THE RUN ABORTS if either read value
    differs from the audit value recorded in H-ECQ-0ed5c8. Audit values, LABELLED AS AUDIT VALUES AND
    NOT AS PROTOCOL CONSTANTS: cell 69.33884136527462, benchmark 79.32867457792244. The value 79.329
    is a rounded transcription, rounded in the direction that makes the benchmark easier to beat
    (validator F7), and must appear nowhere.

  protocol:
    step_1_prefilter_first:
      what: >-
        Apply the squarefree-discriminant pre-filter FIRST -- before any height evaluation, any
        Mestre-Nagao ordering, and any rank search. For each admissible canonical tuple, compute the
        surface discriminant over the finite T-line and test it for repeated roots by ONE RESULTANT
        on the degree-20 polynomial. Discard families whose finite discriminant is far from
        squarefree, i.e. whose reducible finite contribution puts the Shioda-Tate ceiling below 13.
      why_first: >-
        It is cheaper than a single one of the 73 height evaluations it replaces, and in the
        exhaustive spread <= 74 box it cuts the measurement set from 13077 families to 90.
        BATCH-541940 spent essentially its whole measurement budget on families that structurally
        could not host the target GENERIC rank.
      status_of_the_filter: >-
        AN EFFICIENCY HEURISTIC WITH MEASURED SUPPORT, NEVER AN IMPOSSIBILITY CLAIM. The Shioda-Tate
        ceiling bounds the GENERIC rank over Qbar(T); a specialisation over Q is at least the generic
        rank and can exceed it (KN-FIND-6b3e17). Measured support: across 5169 searched fibres with a
        computed ceiling, none exceeded its family's ceiling and seven attained it, over |t| <= 800.
        The discarded families are discarded for cost, and no claim whatever is made that a family of
        ceiling <= 11 cannot host a rank-12 specialisation.
      required_records: >-
        The discard count, the retained count, the measured per-tuple cost of the filter, and the
        soundness argument. Every attempted tuple is persisted with a status and a reason.
    step_2_enumeration_box:
      what: >-
        Enumerate admissible canonical integer 6-tuples over a spread box ENLARGED beyond the
        spread <= 74 exhaustive census, sized so that the pre-filter yields at least a few hundred
        families of Shioda-Tate ceiling >= 13 at log P2 below 6. The box is the producer's to choose
        and to declare; what is fixed here is the TARGET it must hit and the fact that the box, its
        enumeration order and its canonicalisation are recorded before the counts are read.
      target_stratum: ceiling >= 13 AND log P2 < 6
      thresholds_are_frozen: >-
        Ceiling >= 13 and log P2 < 6 are pre-declared in H-ECQ-0ed5c8. CHANGING EITHER AFTER SEEING
        THE ENUMERATION REQUIRES A VERSIONED protocol_amendment RECORD and must be reported as one.
        Widening to ceiling >= 12, or relaxing log P2, after the count comes in short is exactly the
        move this clause exists to prevent.
      ceilings: >-
        Every ceiling is computed FROM THE FAMILY'S OWN FIBRE CONFIGURATION as
        18 - sum_v deg(v)(m_v - 1), with the Euler check sum(deg * v_disc) = 24 = 12d reported per
        family. The generic elliptic-K3 bound 18 is never read. THE CONSTRUCTION'S OWN CAP IS 15:
        every admissible family measured so far carries a multiplicative fibre at T = infinity of
        type I_4 (13352 of 13391) or I_6 (39). The steerable quantity is the number of REDUCIBLE
        FINITE fibres, not the fibre at infinity, which is near-constant and stratifies nothing.
    step_3_rank_search:
      what: >-
        Rank-search ALL families of the target stratum, PLUS the 2114 previously unsearched
        (family, t) pairs of BATCH-541940's 46 load-bearing families -- including the six of those 46
        that were never searched at all -- across the FULL declared 73-value T-box with |t| <= 800.
      caps: >-
        NO HEIGHT CAP AND NO FAMILY CAP. BATCH-541940's runs 006 and 011 carried --max-families 60,
        --t-per-family 40 and 30, and --height-cap 120 and 130, so the box searched was smaller than
        the declared T-box by construction as well as by budget. Neither kind of cap is permitted
        here.
      certification: >-
        Every reported rank is a CERTIFIED LOWER BOUND from exhibited points verified in exact
        arithmetic. No floating point anywhere in a certification. pari_ellrank_r_low,
        pari_ellrank_r_high and the alarm status are carried into the ICARM-format record, because
        C1' names the ICARM verifier and BATCH-541940's submission-format deliverable dropped that
        field.
    step_4_controls:
      RT_CONTROL_2_true_null: >-
        A bottom rung that ACTUALLY has no rational sections: q irreducible of degree 6 whose Galois
        group admits no index-2 subgroup fixing a section pair (S_6 suffices), still solving phi = 0
        for admissibility. VERIFIED, NOT ASSUMED: exhibit that ellrank finds no more points than the
        random-curve null at matched height, and check whether the trace P + P^sigma of a
        Galois-conjugate pair at the envelope argmin is a rational point of infinite order. The
        BATCH-541940 k = 0 rung was not a null object -- 12 of 15 at rank >= 3 against 0 of 79 random
        curves at matched height -- so the 12-sections-against-0 contrast has never been run.
      RT_CONTROL_3_random_curve_null: >-
        Random elliptic curves at matched ICARM naive height, h approximately 60, 70, 80, 93 and 100,
        n = 200, same instrument and same alarm. Below n = 200 it is a BOUND and is reported as a
        bound, never as a distribution.
      intercept_replication: >-
        The flat-arm intercept regression (reported slope 0.8132, R^2 0.7732, n 13391) recomputed by
        a SECOND implementation over the same population, with a run record. It is the campaign's
        best positive result and currently rests on one reviewer's unarchived code.
      baseline_fixture: >-
        Before any new number is read: reproduce Mestre's published tuple A envelope at
        79.6237719007 at t = 4, and reproduce the ICARM naive height of at least five frozen board
        curves from their a-invariants to 0.0. A pipeline that fails either fixture is not measured
        with.
      provenance_control: >-
        EVERY reported curve is checked against the frozen snapshot BY curve_key AND BY a-invariants,
        and against Cremona's tables. Both keys, because BATCH-541940 reported frozen board curve id
        108 as its own at rank thresholds 3, 4 and 5; Cremona, because C1' names it and NO CREMONA
        CHECK HAS BEEN PERFORMED ANYWHERE IN THIS CAMPAIGN. A rediscovered board curve is reported as
        a STRONG EXTERNAL POSITIVE CONTROL and never as this program's own curve.
    step_5_priority_order_under_budget: >-
      If wall clock bites, STOP AND REPORT rather than silently truncating, in this order:
      (1) pre-filtered enumeration and the stratum population count; (2) full-coverage rank search of
      the target stratum; (3) the 2114 unsearched fibres of the existing 46; (4) RT-CONTROL-2;
      (5) RT-CONTROL-3 at n = 200; (6) the intercept replication; (7) identification of frozen board
      curve id 162 among BATCH-541940's 5092 certified curves and the board check on the r >= 2 row
      (25.4297). The provenance control of step 4 is NOT in this ordering: it is mandatory on every
      curve the producer reports, whatever the budget does.

  independent_variables:
  - the canonical integer 6-tuple (the lever under test)
  - the spread box of the enumeration
  - the specialisation parameter t over the fixed 73-value T-box
  - the number of rational sections 2k, in the null ladder only

  controls:
  - id: CTL-PREFILTER-SOUNDNESS
    control: >-
      The pre-filter must have NO FALSE NEGATIVES on the ceiling->=13 target set. Demonstrate it
      rather than assert it: on a sub-box, compute the full fibre census for every admissible tuple
      and confirm that every family of ceiling >= 13 survives the filter.
    failure_meaning: >-
      One surviving counterexample means the experiment searched the wrong set and the negative
      branch cannot be claimed at all.
  - id: CTL-PROVES-TOO-MUCH-A
    control: >-
      Mestre's published tuple A (-17, -16, 10, 11, 14, 17), rank >= 11 over Q(T). PASS is: ceiling
      assigned >= 11 (measured as 15) and the tuple NOT discarded by the pre-filter.
    failure_meaning: A ceiling below 11 falsifies the ceiling computation.
  - id: CTL-PROVES-TOO-MUCH-B
    control: >-
      A generic ceiling-9 family with six finite I_2 fibres, of the class holding 13257 of 13391
      families. PASS is: the pre-filter DISCARDS it.
    failure_meaning: >-
      A filter that keeps this filters nothing, and the entire cost argument for the experiment
      collapses.
  - id: CTL-NULL-OBJECT
    control: RT-CONTROL-2 and RT-CONTROL-3 as specified in the protocol, step 4.
    failure_meaning: >-
      A bottom rung that retains rational rank is not a null object, and any contrast measured
      against it is not the contrast it is reported as.
  - id: CTL-BASELINE-FIXTURE
    control: Tuple A at 79.6237719007 and five board heights recomputed from a-invariants to 0.0.
    failure_meaning: An implementation that fails the fixture is not measured with.
  - id: CTL-PROVENANCE
    control: Board check on both keys plus Cremona, on every reported curve.
    failure_meaning: >-
      An unchecked curve cannot satisfy C1' condition (1) or (2), and a rediscovery reported as novel
      is the error BATCH-541940 made.

  metrics:
    primary:
    - stratum_population_count_ceiling_ge_13_and_log_p2_lt_6
    - coverage_fraction_target_stratum_numerator_over_denominator
    - coverage_fraction_2114_previously_unsearched_fibres_numerator_over_denominator
    - min_naive_height_at_certified_rank_ge_12_over_the_searched_stratum
    secondary:
    - prefilter_discard_count_and_retained_count
    - prefilter_cost_per_tuple_seconds
    - shioda_tate_ceiling_from_own_fibre_configuration
    - euler_check_sum_deg_v_disc
    - certified_rank_versus_naive_height_curve
    - random_curve_rank_null_distribution_by_height_band
    - true_null_rung_rank_distribution
    - flat_arm_intercept_regression_slope_r2_n
    - per_threshold_comparison_against_the_frontier_read_at_run_time
    - attempted_rows_with_status_and_reason
  coverage_is_a_contract_term_not_a_hope: >-
    EVERY coverage figure is reported as NUMERATOR OVER DENOMINATOR, overall and per ceiling class,
    beside every negative statement in every deliverable. BATCH-541940 reported none, both reviewers
    charged it, and a reviewer had to reconstruct 37.0 percent from run records. A negative without
    its coverage fraction does not satisfy this contract.

  preregistered_prediction:
    quantity: >-
      The stratum population count, the coverage fraction reached, and the minimum minimal-model
      naive height at certified rank >= 12 over the searched stratum.
    formula: >-
      Population >= 200 families of ceiling >= 13 at log P2 < 6 (against 2 in the exhaustive 13077
      census). Coverage target 1.00. Minimum height at certified rank >= 12: the Coordinator's
      recorded prior P2 is that it lands ABOVE the benchmark read at run time and below the current
      86.77369390941135, i.e. branch B rather than branch A.
    reference_rate_for_judging_a_zero: >-
      P(certified rank >= 12 | searched fibre) as measured in BATCH-541940 across ceiling->=13
      fibres: 0.002 at h in [80, 90], 0.006 at [90, 100], 0.044 at [100, 120]. Empirical, one
      implementation, and used ONLY to judge whether a zero is informative -- never as a claim about
      the construction.
    source: >-
      H-ECQ-0ed5c8 predictions and falsifiable_prediction_both_branches_named_in_advance;
      DEC-20260823-ee9162 R8 for the rate table and the density figures.

  success_criterion: >-
    DECLARED IN ADVANCE, IN THREE BRANCHES THAT EXHAUST THE OUTCOME SPACE, MATCHING H-ECQ-0ed5c8
    EXACTLY.
    BRANCH A -- THE LEVER MOVES RANK 12. At least one curve of CERTIFIED rank >= 12 whose
    minimal-model naive height is strictly below the construction-class benchmark READ FROM THE
    FROZEN SNAPSHOT AT RUN TIME, absent from the frozen snapshot by curve_key AND by a-invariants and
    absent from Cremona's tables. Branch A means BATCH-541940's central interpretive move was wrong
    and C1' becomes REACHABLE -- NOT MET: C1' additionally requires the frozen r >= 12 cell, first
    exhibition by this program, ICARM-verifier acceptance, and the live board re-read at submission.
    BRANCH B -- THE LEVER CLOSES WITH A MEASURED OBSTRUCTION. Coverage 1.00 of the enumerated target
    stratum AND of the 2114 previously unsearched fibres, reported as numerator over denominator,
    returning NO certified rank->=12 fibre below the benchmark read at run time. Branch B is a
    COMPLETE RESULT: it upgrades a density-and-rate statement measured at 37 percent coverage to one
    measured at full coverage of a stratum built to be favourable.
    BRANCH C -- NEITHER. Coverage below 1.00 for any reason, or an enumeration that fails to populate
    the stratum. The coverage fraction and the population count ARE the result.
    THE EXPERIMENT SUCCEEDS AS AN EXPERIMENT IN ALL THREE BRANCHES, provided the coverage fraction,
    the population count and the branch label are reported. It fails only by reporting a branch it
    did not earn.

  branch_c_is_not_an_escape_hatch:
    rule: >-
      Branch C obliges MORE reporting, not less, and it carries a pre-declared informativeness test
      so that a truncated run cannot be dressed as a bounded negative and cannot be waved away as
      nothing either.
    when_a_partial_negative_is_WORTH_REPORTING_as_a_bounded_negative: >-
      When the searched sub-benchmark set is large enough that a zero is unlikely under the reference
      rate: compute the EXPECTED NUMBER of successes as sum over searched fibres of the reference
      rate for that fibre's height band, and report it. If the expected count is at least 3 -- so
      that P(observing zero) is at most about 0.05 under that rate -- the zero is a bounded negative
      and must be reported as one, with its coverage fraction, its expected count and its implied
      P(zero) attached.
    when_a_partial_negative_is_UNINFORMATIVE: >-
      When the expected count is below 3, and ESPECIALLY below 1. THE CANONICAL WORKED CASE IS ALREADY
      IN THE RECORD: BATCH-541940 searched 296 ceiling->=13 fibres below h = 80 and found zero at rank
      12, but at a rate of 0.002 that set predicts 0.6 successes, so THE ZERO WAS CONSISTENT WITH THE
      RATE AND NOT INFORMATIVE ABOUT IT (DEC-20260823-ee9162 R8(ii)). A repeat of that arithmetic must
      be labelled the same way, in the report, in the words "consistent with the measured rate and not
      informative about it".
    what_may_never_be_said_under_branch_C: >-
      That the lever is closed; that the stratum is empty; that the construction cannot reach the
      benchmark. Branch B is the only branch that supports any of those, and only at coverage 1.00.
    infrastructure_clause: >-
      A wall-clock stop, PARI alarm, crash or memory exhaustion BOUNDS COVERAGE AND IS NEVER NEGATIVE
      MATHEMATICAL EVIDENCE (AGENTS.md rule 5). The reportable consequence of a timeout is a smaller
      denominator-relative numerator, nothing else.

  falsification_criterion: >-
    THE LEVER IS FALSIFIED AT RANK 12, for this construction and this scale, by BRANCH B. THE
    POPULATION CLAIM IS FALSIFIED if the enlarged pre-filtered box yields fewer than 200 families of
    ceiling >= 13 at log P2 < 6 -- the untested region is then untestable by this enumeration, which
    is itself a measured statement and must be reported as one. THE MECHANISM CLAUSE IS FALSIFIED if
    the flat-arm intercept regression fails to replicate, i.e. returns R^2 materially below 0.7232 on
    a second implementation; the campaign's best positive result is then withdrawn and
    DEC-20260823-ee9162 R3(g) is superseded. NOT FALSIFIED by failing to reach the r >= 12 cell, and
    NOT FALSIFIED by any infrastructure outcome.

  heuristic_under_test: >-
    The squarefree-discriminant pre-filter as a SELECTION heuristic: that a family worth spending
    rank-search budget on is one whose finite discriminant is squarefree or nearly so. Its
    falsification condition is CTL-PREFILTER-SOUNDNESS -- one exhibited ceiling->=13 family that the
    filter discards. It is not, and may not become, a claim that the discarded families cannot host
    rank 12 over Q.

  scale_relevance:
    tier: null
    tier_reason: >-
      The toy/medium/crypto ladder describes security parameters and no security parameter appears
      here. Setting a tier would import a claim this experiment does not make. The field is present
      and explicitly null so a reader cannot mistake it for an overlooked one.
    justification: >-
      The scale that matters is the frozen ICARM board's, and the tested scale is the enumerated
      tuple box: admissible canonical integer 6-tuples over a declared spread box, one fixed 73-value
      T-box with |t| <= 800, the ICARM naive-height convention, rank as a certified LOWER bound, PARI
      2.15.4 / cypari 2.5.6 / Python 3.11.15 on one 4-core machine, against the frozen snapshot of
      2026-08-23T00:43Z.
    transfer_assumptions: >-
      NONE ARE MADE. Nothing transfers outside Mestre's construction, nothing is quantified over all
      tuples or all rational t, and no result here bears on any other fibration or construction.

  replication:
    seeds: [20260823]
    independent_instances: 1
    independent_instances_note: >-
      One producer instance, as the campaign budget allows. Independence is supplied by the two blind
      reviewers of BATCH-8b08ef under review_plan.yaml, one of which owes a blind re-derivation of
      the height and the ceiling from their statements alone -- not by re-running this producer.

  budget:
    wall_clock_seconds_per_run: 3600
    task_wall_clock_seconds_total: 3600
    total_cpu_hours: 4.0
    maximum_memory_gb: 4
    maximum_runs: 80
    maximum_workers: 1
    artifact_size_budget:
      committed_total_mib: 25
      per_file_mib: 5
      exceptions_declared: []
      rule: >-
        Per DEC-20260823-ee9162 R15 and the TASK-20260823-827765 handoff, which declares it non-null.
        Raw per-fibre dumps that would exceed either figure are REDUCED AT SOURCE to summary rows, or
        retained OUT OF BAND with sha256, row count and exact regeneration command in the run record.
        NEVER CAPPED whatever the budget: manifest.yaml, command.txt, environment.json, stdout.log,
        stderr.log and a machine-readable summary of results.
  budget_note: >-
    THE BINDING CAP IS 3600 s FOR THE WHOLE TASK, not per run; wall_clock_seconds_per_run is set
    equal to it because the schema requires a per-run figure and no single run may exceed the task.
    HONEST FRAMING OF WHAT REMAINS: this sits inside roughly 7.1 ks nominally left of the campaign's
    21600 s, under an accounting convention that charges PRODUCER WALL CLOCK ONLY and therefore
    UNDERSTATES TRUE CONSUMPTION -- the BATCH-541940 red team alone reported about 2600 s of its own
    compute, and validator and archival sessions are unmeasured. It is a measurement convention, not
    a claim. BATCH-8b08ef is the fourth and last batch of a declared maximum of four; no extension is
    granted and none is implied.

  stopping_rules:
  - >-
    TASK WALL CLOCK 3600 s. On reaching it, STOP AND REPORT: emit every completed row, the coverage
    fraction reached with numerator and denominator, and the branch label. A wall-clock stop is an
    INFRASTRUCTURE OUTCOME that BOUNDS COVERAGE and is never negative mathematical evidence.
  - >-
    PER-FIBRE PARI ALARM. Record every alarm with the fibre it fired on; an alarmed fibre counts as
    ATTEMPTED-NOT-MEASURED in the coverage denominator, never as a searched fibre that found nothing.
  - MEMORY 4 GB. On breach, stop the run and record the breach; do not silently reduce the box.
  - >-
    RUN COUNT 80. A run that dies on a bad flag or a crash is superseded by a successor run and both
    are recorded, as RUN-ECQTUP-416e78-009 and -010 were.
  - >-
    BRANCH-A EARLY REPORT. If a certified rank->=12 curve below the benchmark appears, DO NOT STOP the
    coverage work: branch A and the coverage fraction are both reportable, and a claimed cell routes
    to review-breakthrough under review_plan.yaml's escalation rule.

  invalidation_rules:
  - >-
    ANY frontier or benchmark value hard-coded, transcribed or rounded rather than read at run time
    INVALIDATES every comparison that used it. The abort-on-mismatch assertion must be present in the
    code and exercised in the run.
  - >-
    ANY rank certified with floating point, or reported without the exhibited points verified on the
    curve in exact arithmetic, INVALIDATES that certification.
  - >-
    ANY attempted row lost to an arithmetic difference between attempted and measured, with no tuple
    and no reason recorded, INVALIDATES the coverage figure that row belongs to. 462 families
    vanished that way in BATCH-541940.
  - >-
    ANY ceiling read from the generic K3 bound 18 rather than computed from the family's own fibre
    configuration INVALIDATES the stratification that used it.
  - >-
    ANY null-ladder rung whose reported n differs from its generated n without the attrition
    disclosed, or whose matched comparison drops rows on a criterion correlated with the manipulated
    variable, INVALIDATES that rung's contrast. Both happened in BATCH-541940 -- 55 and 52 percent
    differential attrition, and 52 of 440 rows dropped on a criterion that selects on the manipulated
    variable.
  - >-
    ANY network call, and ANY submission to the ICARM endpoint, INVALIDATES THE RUN OUTRIGHT. Nothing
    is submitted in this experiment.
  - >-
    A change to the target thresholds after the enumeration has run, made without a versioned
    protocol_amendment record, invalidates the branch claim that rests on it.

  run_path_requirement:
    decision: >-
      RUNS ARE WRITTEN DIRECTLY UNDER experiments/EXP-ECQ-0e0cbb/runs/RUN-<id>/ FROM THE START. This
      contract REQUIRES it; it does not permit a post-hoc port.
    why: >-
      tools/validate_ledger.py indexes runs only at experiments/*/runs/*/manifest.yaml, while this
      campaign's producers write into a BATCH directory, so every evidence record's run references
      have resolved to nothing and been repaired afterwards by an index shim -- four times
      (EXP-ECQ-89de3c, EXP-ECQ-139c9f, EXP-ECQ-7ea4c3, EXP-ECQ-a7d948). EXP-ECQ-7ea4c3's own
      recurrence_note said it was written so the pattern would not be rediscovered a fourth time, and
      it was rediscovered a fourth time. A DOCUMENTARY REMEDY FOR A MECHANICAL DEFECT DOES NOT WORK
      (DEC-20260823-ee9162 R21). This is the first batch whose contract exists before its producer,
      and therefore the first that can adopt the mechanical fix rather than pay for a fifth port.
    what_lands_where: >-
      RUN RECORDS -- manifest.yaml, command.txt, environment.json, stdout.log, stderr.log,
      raw-result.json -- under experiments/EXP-ECQ-0e0cbb/runs/. DELIVERABLES -- report.md,
      stratum_enumeration.json, rank_search_coverage.json, best_candidates.json, null_controls.json,
      intercept_replication.json -- under the batch task directory exactly as
      TASK-20260823-827765's artifact_paths declare. Each manifest carries run.experiment_id
      EXP-ECQ-0e0cbb from the start, so nothing needs mapping later.
    queue_amendment_required_before_dispatch: >-
      THE PRODUCER CANNOT SATISFY THIS AS THE QUEUE STANDS. TASK-20260823-827765's write_scope is the
      batch task directory alone. Add `experiments/EXP-ECQ-0e0cbb` to that task's write_scope in
      coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/dispatch_queue.json and in the mirrored
      ledger/handoffs/TASK-20260823-827765.yaml BEFORE dispatch. Two consequences, both checked:
      no other task in the queue writes under experiments/, so write-scope disjointness is
      unaffected; and the snapshot archive TASK-20260823-8ea188, whose constraint is to DERIVE the
      archived set from the producer's write_scope, must derive it from BOTH scopes -- its read_scope
      already covers experiments/. If that amendment is not made, the producer writes runs in the
      batch tree, this clause is violated, and the violation is recorded as a procedure deviation
      rather than papered over with a fifth port.

