# =============================================================================
# EXP-ICPERF-a5a78a -- Frozen contract for H-ICPERF-71a809: side-constrained
# core leaf-count reduction on Trimoska S_4 / WDSat, with IDEA-20260926-a79052
# folded as Stage-0 membership / E-NULL inspection arm (DX-04).
#
# Source: IDEA-20260915-eee7e4 under RQ-ICPERF-94c86e / GOAL-ICPERF-e6b6a4.
# Approved: DEC-20261002-74ce9e. Snapshot: TASK-20261002-caae2b.
# Executor: TASK-20261002-47c468.
#
# PTR-ICPERF (DEC-20260928-63addc) routes design to this goal. Stages 0-2.
# ZERO RUNS in the design session. No AUXIN. No Bedrock.
# Claim tier: measurement / constant-factor. No attack / exponent claim.
# =============================================================================
experiment:
  id: EXP-ICPERF-a5a78a
  version: 1
  hypothesis_id: H-ICPERF-71a809
  question_id: RQ-ICPERF-94c86e
  source_idea: IDEA-20260915-eee7e4
  related_idea_ids:
    - IDEA-20260926-a79052
    - IDEA-20260915-3f1964
    - IDEA-20260915-0d8e90
    - IDEA-20260915-3476de
  goal_id: GOAL-ICPERF-e6b6a4
  designed_by_task: TASK-20261002-caae2b
  snapshot_task: TASK-20261002-caae2b
  executor_task: TASK-20261002-47c468
  title: >-
    Side-constrained core: Stage-0 membership census + a79052 E-NULL
    inspection; Stage-1 baseline c reproduction + four-variant WDSat panel
    at (17,6)/(19,6)/(21,7); Stage-2 side classification and exactly one O-*
  status: approved
  approved_by: DEC-20261002-74ce9e
  approval:
    approved_by: DEC-20261002-74ce9e
    standing_authorization: >-
      AGENTS.md standing user authorization (2026-09-06). Protocol complete;
      Coordinator checked required fields before approving.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    execution_state: approved frozen contract; awaiting /run under TASK-20261002-47c468

  objective: >-
    (1) Freeze Stage-0 worksheet: |V_E|/|V| census on V for primary cells;
    re-derive a79052 membership identity Tr(x)=Tr(1/x)+Tr(a); inspect
    oracle-A sampling for E-NULL (may close a79052 seam at zero compute);
    freeze preregistered predictions. (2) Stage-1: reproduce unconstrained
    c medians 0.945/0.971/0.974; generate four variants per target
    (unconstrained, blocking, re-encoding, random-subset); run WDSat
    default; record conflicts/decisions/wall_s/status/model. (3) Stage-2:
    classify every model by side; compute ratios; emit exactly one O-*
    label. Observations only.

  claim_tier: measurement
  claim_tier_note: >-
    Constant-factor leaf-count measurement at toy cells. No IC-vs-rho claim,
    no deployed-curve verdict, no exponent move. Missing WDSat →
    O-IMPEDIMENT, never evidence against H-ICPERF-71a809.

  class: measurement
  class_note: >-
    Cost-model / instrument measurement with a pre-registered comparative
    prediction (H1 + leaf-count reading). Not a heuristic-validation of an
    asymptotic theorem.

  inputs:
    proposal: ledger/proposals/IDEA-20260915-eee7e4.yaml
    hypothesis: ledger/hypotheses/H-ICPERF-71a809.yaml
    decision: ledger/decisions/DEC-20261002-74ce9e.yaml
    question: ledger/questions/RQ-ICPERF-94c86e.yaml
    folded_proposal: ledger/proposals/IDEA-20260926-a79052.yaml
    side_table_source: ledger/proposals/IDEA-20260915-3f1964.yaml
    exhaustive_core_law: ledger/proposals/IDEA-20260915-0d8e90.yaml
    ranking_decision: ledger/decisions/DEC-20260928-63addc.yaml
    sibling_groebner_pointer: >-
      EXP-ICPERF-a55313 (PR #1600) — residual Groebner column; related_idea
      pointer only; do not edit that contract under this card.
    read_only_instruments:
      - experiments/EXP-CERTBIN-e94b27/impl/ (oracle-A / gf2n / curve for a79052 arm)
    off_limits:
      - Editing IDEA-20260915-eee7e4 / IDEA-20260926-a79052 claim text.
      - Editing shared GOAL-ICPERF-e6b6a4/goal.yaml.
      - Opening IDEA-20260926-89886c / which-algebra NA-2 under this card.
      - Magma / Sage / AUXIN as success path.
      - Amazon Bedrock.
      - Any run at n>=131 or any deployed-curve attack claim.
      - Treating missing WDSat as evidence against the leaf-count prediction.

  controls:
    - name: unconstrained_baseline
      description: >-
        Shipped-cell unconstrained WDSat; must reproduce c medians before
        any constrained ratio is read.
    - name: random_subset_known_false
      description: >-
        Random subset of V of size |V_E| per block, same encoding; must
        match conflict ratio and must NOT remove twist roots on S.
    - name: null_matched_boolean
      description: >-
        Matched random Boolean systems with the same number of appended
        width-l clauses; measures propagation overhead only.
    - name: soundness_reconstruction
      description: >-
        Every S target's table-known E-decompositions must be found by the
        constrained instance.
    - name: a79052_e_null_inspection
      description: >-
        Stage-0 code/sampling inspection of oracle A for E-NULL; closes or
        escalates the folded seam item without a separate EXP.

  independent_variables:
    - name: cell
      levels: ['(17,6)', '(19,6)', '(21,7)']
    - name: encoding_variant
      levels: [unconstrained, blocking_clauses, reencoding_l_minus_1, random_subset]
    - name: target_class
      levels: [side0_certified_U, S]

  primary_metrics:
    - name: median_unsat_conflict_ratio_blocking
      definition: >-
        median(conflicts, unconstrained U) / median(conflicts, blocking U)
        per cell; predicted in [6, 8].
    - name: median_unsat_conflict_ratio_reencoding
      definition: >-
        Same with re-encoding arm; predicted in [7.5, 8.5].
    - name: twist_side_root_fraction_constrained_S
      definition: >-
        Fraction of constrained S models classified twist-side; predicted 0.
    - name: outcome_label
      definition: >-
        Exactly one of O-GAIN / O-PROP-DOMINATES / O-UNSOUND / O-NOT-SIDE /
        O-ARTIFACT / O-IMPEDIMENT.
    - name: soundness_pass
      definition: >-
        Boolean; true iff every table-known E-decomposition is recovered
        under constraint.

  secondary_metrics:
    - name: constrained_c
      definition: constrained conflicts / |V_E|^3 per cell.
    - name: median_wall_s_ratio
      definition: unconstrained/constrained wall_s; predicted >= 4.
    - name: decisions_count
      definition: WDSat decisions; under (i) ≈ |V_E|^3 up to depth-(l-1) refutations.
    - name: V_E_over_V
      definition: '|V_E|/|V| from Stage-0 census.'
    - name: peak_rss_bytes
      definition: Peak RSS beside every timed stage.
    - name: wall_clock_seconds
      definition: Wall clock per target and per arm aggregate.
    - name: a79052_e_null_verdict
      definition: >-
        Stage-0 inspection label: E-NULL-SETTLED / E-NULL-OPEN / E-NULL-ARTIFACT.

  seeds_and_replication:
    master_seed: 20261002ee
    targets_per_cell_per_class: 20
    cells: ['(17,6)', '(19,6)', '(21,7)']
    variants_per_target: 4
    cheapest_discriminator: >-
      (17,6) blocking vs unconstrained on 20 side-0 certified-U targets.
    replication: >-
      Single primary replication under this card; seed and instance-set rule
      frozen in stage0/preregistered-predictions.json. Second seed out of
      scope unless O-ARTIFACT triggers a repair amendment.

  budget:
    wall_clock_seconds: 14400
    memory_gb: 1
    maximum_runs: 1
    cpu_note: >-
      Advisory. Stage 0 is zero/low compute. Stage 1 estimate ~480 WDSat
      runs (3 cells × 40 targets × 4 variants), each ≤30 s at (21,7)
      constrained. Freeze scientific sample counts; do not expand cells or
      claim deployed impact with leftover wall clock.

  stopping_rules:
    - Stage 0 must freeze predictions and |V_E| census before any Stage-1 ratio is read.
    - Baseline c reproduction failure → O-ARTIFACT; do not read constrained ratios.
    - Soundness failure → O-UNSOUND; stop; do not expand cells.
    - Missing / unbuildable WDSat → O-IMPEDIMENT; do not substitute Magma/Sage/AUXIN.
    - Timeout / OOM / crash → failed_infrastructure / O-IMPEDIMENT; never negative evidence.
    - After exactly one O-* is decided, stop; no n>=131 or deployed-curve expansion.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze invalidates subsequent stages.
    - Changing solver, branching order, or seed mid-arm without an amendment invalidates ratios.
    - Mixing EXP-ICPERF-a55313 Groebner RESULTS into this card without amendment is out of scope.
    - Any claim of exponent / deployed break in RESULTS.md invalidates the scientific read (scope defect).

  success_criterion: >-
    Decidable from the primary metrics before any run. The experiment SUCCEEDS
    as a measurement (either scientific direction) when all of: (1) Stage 0
    worksheet present with |V_E|/|V| census, a79052 membership re-derivation,
    E-NULL inspection verdict, and predictions frozen in
    stage0/preregistered-predictions.json before Stage 1; (2) unconstrained
    baseline c reproduces the shipped medians within the frozen tolerance, OR
    exactly one of O-ARTIFACT / O-IMPEDIMENT is named with no ratio read;
    (3) exactly one O-* label in RESULTS.md decidable from primary metrics
    alone; (4) soundness_pass recorded (or O-UNSOUND named); (5) peak RSS
    reported beside every timed stage; solver name, version, and build hash
    recorded; (6) Magma / Sage / AUXIN / Bedrock were not used as the success
    path. Scientific direction (gain vs prop-dominates vs unsound vs not-side)
    is read from the O-* label and does not alter success-as-measurement.

  falsification_criterion: >-
    Stated before any run, scoped to cells (17,6)/(19,6)/(21,7) with WDSat
    default. H-ICPERF-71a809's leaf-count prediction is falsified by
    O-PROP-DOMINATES (conflict ratio below 4 with blocking AND below 6 with
    re-encoding on side-0 certified-U). Encoding soundness is falsified by
    O-UNSOUND (known E-decomposition lost, or any twist-side root under
    constraint). Side-specificity is falsified by O-NOT-SIDE (random-subset
    control ratio differs from side-constrained by more than 25%). Baseline
    non-reproduction or impure DIMACS diff is O-ARTIFACT (instrument defect):
    run void; not directional evidence. Timeout / crash / missing WDSat is
    O-IMPEDIMENT / failed_infrastructure, never negative mathematical
    evidence. No outcome under this card asserts an IC-vs-rho, deployed-curve,
    or exponent claim.

  success_criteria:
    - Stage 0 worksheet + preregistered-predictions.json frozen before Stage 1.
    - Baseline c reproduced OR O-ARTIFACT/O-IMPEDIMENT named.
    - Exactly one O-* label in RESULTS.md, decidable from primary metrics alone.
    - soundness_pass recorded or O-UNSOUND named.
    - Memory reported beside time; solver name/version/build hash recorded.
    - No Magma/Sage/AUXIN/Bedrock used as success path.

  falsification_criteria:
    - Per H-ICPERF-71a809 falsification_conditions (ratio bands, soundness, twist roots, random-subset mismatch).

  required_artifacts:
    - experiments/EXP-ICPERF-a5a78a/stage0/preregistered-predictions.json
    - experiments/EXP-ICPERF-a5a78a/stage0/V_E_census.md
    - experiments/EXP-ICPERF-a5a78a/stage0/a79052-membership-e-null.md
    - experiments/EXP-ICPERF-a5a78a/RESULTS.md
    - experiments/EXP-ICPERF-a5a78a/runs/*/manifest.json
    - experiments/EXP-ICPERF-a5a78a/runs/*/metrics.jsonl

  stages:
    - id: 0
      name: freeze_and_a79052_arm
      description: >-
        Zero/low compute. Census |V_E|; re-derive a79052 identity; E-NULL
        inspection; freeze predictions.
    - id: 1
      name: wdsat_four_variant_panel
      description: >-
        Reproduce baseline c; run four variants × 40 targets × 3 cells.
    - id: 2
      name: classify_and_label
      description: >-
        Side-classify models; compute ratios; emit exactly one O-*.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
