# =============================================================================
# EXP-BINSTD-c05a0f -- VERSION 1 (APPROVED by DEC-20261002-91a6dd) frozen
# contract for H-BINSTD-61dad7: HOLD-X4 abscissa-density Weil vacuity
# certificate + toy H_random / H_struct density census with ordinary-curve
# control.
#
# Source: IDEA-20260926-cafcf1 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
#
# ZERO RUNS in this design packet. Stages 0-4 authorized for executor
# TASK-20261002-c76e5e. No AUXIN. Amazon Bedrock prohibited.
# NO break. NO attack. NO exponent. Control / structural certificate only.
# =============================================================================
experiment:
  id: EXP-BINSTD-c05a0f
  hypothesis_id: H-BINSTD-61dad7
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260926-cafcf1
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Weil vacuity of subspace abscissa density (l<=66 at n=131) plus toy
    density census F0–F3 with ordinary-curve control (HOLD-X4)
  status: approved
  approved_by: DEC-20261002-91a6dd
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-91a6dd
    composing_decision: DEC-20261002-91a6dd
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-4 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3, 4]
    scientific_execution_authorized_note: >-
      Stage 0 is zero-compute certificate authoring (vacuity table, support
      corrections, Weil-constant sourcing/flag). Stages 1-3 are exact
      integer density counts on GF(2^n) via gf2n.py. Stage 4 is the reading.
      No Magma/Sage. No AUXIN. No Bedrock. No curve/ECDLP decomposition run.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Freeze the Weil-vacuity certificate and HB1-2 / 8fe0ef H1 support
    corrections at Stage 0; reproduce the RC-1 abscissa-count anchor; measure
    F0–F3 densities on Koblitz E_0 and matched ordinary controls at
    n in {17,19,23}; deliver exactly one O-* label from H-BINSTD-61dad7 —
    unlocking HOLD-B's restatement precondition and correcting vacuous Weil
    support on the yield column.

  class: measurement
  class_note: >-
    Control / structural-certificate experiment with a toy measurement
    census. Carries HEUR-BINSTD-cafcf1-H1 (H_random). Not an exponent-moving
    breakthrough experiment; no ECDLP attack table produced.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond arithmetic/authoring). Write
        stage0/preregistered-predictions.json and stage0/vacuity-certificate.md
        freezing: vacuity table for n in {17,19,23,131}; abscissa-condition
        re-derivation; Weil-bound constant sourced or TW-07-flagged;
        HB1-2 and 8fe0ef H1 support-correction notes; F1 threshold 0.75 at
        (17,8); F3 excess +3; extreme-value formulas; seed base 2026092671;
        check whether IDEA-20260915-eee7e4 already states vacuity (if yes,
        record O-PRIOR-STATED note without withdrawing Stages 1-4).
      - >-
        Stage 1. Exact abscissa count of RC-1 V={deg<9} at n=17; require
        256±40 before Stage 2.
      - >-
        Stage 2. F0 random subspaces (200 draws/cell) on E_0 and ordinary
        control at every (n,l) in the frozen grid; empirical mean/sd vs
        binomial.
      - >-
        Stage 3. F1/F2/F3 on E_0 and ordinary control; maxima with N and
        extreme-value predictions; greedy dimensions with restart count.
      - >-
        Stage 4. RESULTS.md with exactly one O-* label from the hypothesis
        distinguishable_outcomes; scope ceiling ≤2^m restated.
    excluded:
      - Magma/Sage/cypari2/AUXIN provisioning as the success path.
      - Amazon Bedrock.
      - Editing IDEA-20260926-cafcf1 claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Claiming break / exponent / ECC2K-130 attack from this contract.
      - Treating infra failure as mathematical evidence against vacuity
        or H_random.
      - Running any curve-point ECDLP / PDP / SAT cell under this card.
      - Extrapolating toy density maxima to l=33 at n=131.
      - Overwriting experiments/EXP-CERTBIN-e94b27/impl/gf2n.py in place
        without a documented copy/wrapper under this experiment's
        write_scope.

  inputs:
    proposal: ledger/proposals/IDEA-20260926-cafcf1.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-61dad7.yaml
    question: ledger/questions/RQ-BINSTD-b6f698.yaml
    hold_decision: ledger/decisions/DEC-20260928-63addc.yaml
    curve_blindness: ledger/proposals/IDEA-20260922-1a081a.yaml
    torsion_inversion: ledger/proposals/IDEA-20260922-29b1c5.yaml
    subspace_kloosterman_peer: ledger/proposals/IDEA-20260915-8fe0ef.yaml
    prior_vacuity_check: ledger/proposals/IDEA-20260915-eee7e4.yaml
    field_instrument: experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
    review_brief: analysis/binstd-idea-review-20260926/BRIEF.md

  controls:
    - name: stage0_vacuity_and_support_correction
      description: >-
        Stage 0 must freeze vacuity table (incl. l<=66 at n=131), re-derive
        abscissa condition, source-or-flag Weil constant, and record HB1-2 /
        8fe0ef H1 support corrections before any density run.
    - name: rc1_anchor
      description: >-
        Stage 1 exact count of RC-1 V={deg<9} within 256±40; failure is
        O-ARTIFACT.
    - name: F0_binomial_null
      description: >-
        200 random subspaces per (n,l) on both curves; mean/sd vs binomial;
        E_0 vs ordinary agreement within one sd of the mean.
    - name: ordinary_curve_control
      description: >-
        BLOCKING for H_struct: every family maximum reported on E_0 and on
        the matched ordinary curve of the same n.
    - name: extreme_value_beside_maximum
      description: >-
        Every family maximum carries family size N and the Stage-0
        extreme-value prediction.
    - name: yield_ceiling
      description: >-
        RESULTS.md restates that even O-H-STRUCT is at most 2^m in yield
        (4 bits at m=4), never an exponent.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_anchor, 2_F0_null, 3_F123_families, 4_reading]
    - name: field_degree_n
      levels: [17, 19, 23]
    - name: subspace_dimension_l
      levels: grid_per_n
    - name: family
      levels: [F0, F1, F2, F3]
    - name: curve_shape
      levels: [koblitz_E0, ordinary_control]

  metrics:
    primary:
      - name: vacuity_table_frozen
        unit: boolean
        definition: Stage-0 vacuity table present for n in {17,19,23,131}.
      - name: rc1_abscissa_count
        unit: count
        definition: Exact abscissa count of RC-1 V={deg<9} at n=17.
      - name: family_max_density
        unit: density
        definition: Maximum abscissa density per (family, n, l, curve).
      - name: extreme_value_prediction
        unit: density
        definition: Stage-0 extreme-value prediction beside each maximum.
    secondary:
      - name: F0_mean_sd
        unit: count
        definition: Empirical mean and sd of F0 abscissa counts vs binomial.
      - name: greedy_max_dimension
        unit: dimension
        definition: F3 greedy maximal dimension per curve per n.
      - name: wall_clock_seconds
        unit: seconds
        definition: Measured wall clock (reported; not a pre-committed claim).
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS of the density driver (memory honesty).

  heuristic_under_test: HEUR-BINSTD-cafcf1-H1

  preregistered_prediction:
    quantity: >-
      Stage-0 vacuity table and support corrections; Stage-1 RC-1 count;
      Stage-2 F0 binomial band; Stage-3 F1/F2/F3 maxima vs extreme-value
      (direction of H_struct NOT predicted — H_random is the predicted
      reading); Stage-4 single O-* label.
    formula: >-
      vacuity iff l <= n/2 + 1;
      at n=131 every l <= 66;
      RC-1 count in [216, 296];
      F1 (17,8) H_struct threshold = 0.75;
      F3 H_struct if dim > log2(n)+1 + 3 at two n;
      H_random predicted for F0–F3 on both curves.
    source: >-
      ledger/proposals/IDEA-20260926-cafcf1.yaml predictions + HOLD-X4
      (DEC-20260928-63addc); frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: control_certificate
    justification: >-
      Vacuity at n=131 is arithmetic (no crypto-scale solve). Toy census
      at n<=23 validates H_random / H_struct; transfer of density maxima
      to n=131 is explicitly forbidden — only vacuity transfers.
    correspondence: >-
      Completeness of the vacuity statement is arithmetic on a recalled
      Weil O(2^{n/2}) bound. Toy measurement does not certify n=131
      densities.

  tail_checks:
    - >-
      Anchor outside 256±40 voids all science readings (O-ARTIFACT).
    - >-
      F0 E_0 vs ordinary disagreement >1 sd of mean → O-ARTIFACT.
    - >-
      Any H_struct reading without ordinary-control contrast at two n
      is invalid under this contract.
    - >-
      Claiming density at l=33,n=131 from toy cells is out of scope.

  replication:
    seeds: [2026092671, 2026092672, 2026092673, 2026092674]
    independent_instances: 1
    note: >-
      Seeds govern F0 draws, F1 base U, F2 basis construction, and F3
      restarts. Scientific sample is the frozen (n,l,family) grid, not
      expandable by leftover wall clock into a curve attack.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 2.0
    maximum_memory_gb: 4
    maximum_runs: 4
    maximum_workers: 1
    note: >-
      Advisory only (docs/research-budget-policy.md). Scientific requirement
      is Stage-0 certificate + Stages 1-3 grid + Stage-4 reading — not
      expandable into n=131 density sampling or ECDLP work under this card.

  stopping_rules:
    - >-
      SR-1. Stage 0 freeze complete before any density implementation run.
    - >-
      SR-2. If Stage 1 anchor fails → O-ARTIFACT; do not run Stages 2-3
      until instrument repaired via amendment.
    - >-
      SR-3. If Stage 2 F0 null is not binomial or E_0/ordinary disagree →
      O-ARTIFACT; do not claim O-H-RANDOM / O-H-STRUCT.
    - >-
      SR-4. Advisory budget exhausted → O-IMPEDIMENT; never negative
      evidence.
    - >-
      SR-5. Do not escalate any density finding into an exponent /
      ECC2K-130 attack claim under this card.
    - >-
      SR-6. If eee7e4 already states vacuity → record O-PRIOR-STATED for
      novelty (B); continue Stages 1-4 for the census.

  invalidation_rules:
    - Editing stage0/preregistered-predictions.json after Stage-0 freeze.
    - Claiming O-H-STRUCT without ordinary-control contrast at two n.
    - Claiming an exponent move or ECC2K-130 break from this contract.
    - Extrapolating toy maxima to l=33 at n=131 as measured densities.
    - Provisioning Magma/Sage/cypari2/AUXIN as the success path.
    - Using Amazon Bedrock.
    - Editing IDEA-20260926-cafcf1 claim text or shared GOAL-ECDLP2M-001.yaml.
    - Overwriting a prior RUN-* directory.
    - Overwriting EXP-CERTBIN-e94b27 gf2n.py in place without documented path.
    - Treating O-IMPEDIMENT or infra failure as mathematical evidence.

  success_criterion: >-
    ALL of: (1) Stage-0 freeze present with vacuity table + support
    corrections; (2) Stage-1 RC-1 anchor passes OR named O-ARTIFACT stop;
    (3) Stage-2 F0 null artifacts present OR named O-ARTIFACT /
    O-IMPEDIMENT stop; (4) Stage-3 family maxima with N and extreme-value
    predictions when claiming O-H-RANDOM or O-H-STRUCT; (5) RESULTS.md
    names exactly one O-* label; (6) no invalidation_rule fired. This
    delivers the HOLD-X4 certificate and census; it does NOT claim any
    curve is broken and does NOT itself promote a KN-FIND (later review /
    curation gate).

  falsification_criterion: >-
    ANY of: (F1) Stage-1 anchor outside 256±40 with a claimed science
    reading (O-ARTIFACT); (F2) F0 E_0/ordinary disagreement with a claimed
    O-H-RANDOM/O-H-STRUCT; (F3) Magma/Sage/AUXIN/Bedrock used as success
    path; (F4) exponent / break claim under this card. Budget exhaustion
    is O-IMPEDIMENT, not falsification of vacuity or HEUR-BINSTD-cafcf1-H1.

  required_artifacts:
    - experiments/EXP-BINSTD-c05a0f/implementation/
    - experiments/EXP-BINSTD-c05a0f/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-c05a0f/stage0/vacuity-certificate.md
    - experiments/EXP-BINSTD-c05a0f/stage1/rc1-anchor.json
    - experiments/EXP-BINSTD-c05a0f/stage2/f0-null.json
    - experiments/EXP-BINSTD-c05a0f/stage3/family-maxima.json
    - experiments/EXP-BINSTD-c05a0f/runs/
    - experiments/EXP-BINSTD-c05a0f/RESULTS.md

  procedure:
    stages:
      - id: S0-FREEZE
        text: >-
          Write preregistered-predictions.json and vacuity-certificate.md;
          open eee7e4 for prior-stated check; ZERO density runs before freeze.
      - id: S1-ANCHOR
        text: >-
          Exact RC-1 V={deg<9} abscissa count; write stage1/rc1-anchor.json;
          stop on O-ARTIFACT.
      - id: S2-F0
        text: >-
          F0 200 draws/cell on E_0 and ordinary; write stage2/f0-null.json
          with mean/sd vs binomial.
      - id: S3-F123
        text: >-
          F1/F2/F3 on both curves; maxima with N and extreme-value;
          greedy dims; write stage3/family-maxima.json.
      - id: S4-READING
        text: >-
          Write RESULTS.md with exactly one O-* label; restate ≤2^m ceiling;
          preserve raw manifests under runs/; cite RUN IDs; no ledger
          status edits; do not edit HOLD-B / 1a081a under this card.

  assigned_to: executor
  executor_handoff: TASK-20261002-c76e5e
  snapshot_task: TASK-20261002-f03389

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
