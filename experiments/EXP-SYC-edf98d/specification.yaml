      disposition: REPAIRED_BY_RELABEL
      approach_chosen: relabel_to_half_up_rounding_keep_stored_values
      approach_rejected: recompute_the_three_rows_to_true_truncation
      why_relabel_was_chosen_over_recompute: >-
