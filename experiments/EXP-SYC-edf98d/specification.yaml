        certification_status: >-
          NON-CERTIFYING. A per-tuple overflow probability of order 1e-2 is not
          a safety margin.
        falsification_condition: >-
          Exhibit a nonnegative integer-valued X with E[X]=mu and
          P(X >= 33) > mu/33 (impossible, so the lemma is not falsifiable), or
