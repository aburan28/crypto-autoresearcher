          - {bits: 21, gamma_x: 5/18, mu: '0.4454493590701696', per_tuple_markov_bound: '0.013498465426'}
          - {bits: 24, gamma_x: 5/18, mu: '0.3968502629920499', per_tuple_markov_bound: '0.012025765545'}
          - {bits: 27, gamma_x: 5/18, mu: '0.3535533905932738', per_tuple_markov_bound: '0.010713739109'}
          - {bits: 30, gamma_x: 5/18, mu: '0.3149802624737183', per_tuple_markov_bound: '0.009544856439'}
        ceiling_row: {gamma_x: 1/3, mu: '1.0000000000000000', per_tuple_markov_bound: '0.030303030303'}
        independent_corroboration: >-
          The committed Red Team report TASK-20260813-e04de4 records the same
          range endpoints for the equal-mean construction,
          gamma_5_over_18_per_tuple_overflow_probability_range
