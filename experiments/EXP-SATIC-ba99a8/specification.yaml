    routes on frozen samples at n=5 (Stage 0) and n=17 (Stage 1).
  inputs:
    cells:
      - {n: 5, ell: 2, modulus: 37, B: 1, tuples: 20, seed: 2026100305}
      - {n: 17, ell: 6, modulus: 131081, B: 1, tuples: 100, seed: 2026100317}
    routes: [school, expand, sylvester, product]
    amazon_bedrock: NOT SELECTED
  controls:
    - Dual routes must not import each other (run.py uses s3_eval.py; check.py re-derives and does not import s3_eval.py or run.py).
    - Tuples with a = x_R are excluded and counted.
    - Known-false XOR-sum of inner S_3 values scaled by (a+x_R)^4 is not the resultant.
    - Frozen seeds 2026100305 and 2026100317 are not retuned after any run.
    - JSON freeze files use list rows with integer n.
  independent_variables:
    - n in {5, 17}
    - route in {school, expand, sylvester, product}
  metrics:
    primary:
      - identity_agree
      - school_expand_agree
      - implementations_agree
    secondary:
      - skipped_a_eq_xr
      - false_sum_equals_resultant
      - kept
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Identity agreement rate on kept tuples.
    formula: >-
      Res_X(S_3(x_2,x_3,X), S_3(X,a,x_R)) = (a+x_R)^4 S_3(x_2,x_3,u_+) S_3(x_2,x_3,u_-)
      whenever a != x_R and S_3(X,a,x_R) splits in F.
    source: >-
      IDEA-20260930-c5466b claim and proof_search_map, read 2026-10-03.
      Formula copied; idea claim text not rewritten.
  scale_relevance:
    tier: toy
    justification: n=5 and n=17 field arithmetic only. No transfer to W_D or crypto scale.
    correspondence: null
  tail_checks:
    - Known-false XOR-sum control on n=17.
    - Independent check.py re-sample of the same seeds.
  replication:
    seeds: [2026100305, 2026100317]
    independent_instances: 2
    replication_note: The second instance is the independent check.py dual meter.
  budget:
