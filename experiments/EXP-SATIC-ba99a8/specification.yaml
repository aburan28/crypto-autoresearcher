    wall_clock_seconds_per_run: 1800
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after Stage 0 then Stage 1 as enumerated in the trial plan.
    - A crash is incomplete, not a negative mathematical result.
    - Skip non-splitting G; do not count as identity failure.
  invalidation_rules:
    - check.py imports run.py or s3_eval.py.
    - Magma, Sage, AUXIN, or Bedrock is used.
    - An ECDLP-solve or exponent or n>=131 claim is written.
    - Freeze JSON uses string n or a dict keyed by n instead of list rows with integer n.
    - Stage 1 runs before Stage 0 freeze files exist.
  success_criterion: >-
    Stage 0 O-STAGE0-OK with 20/20 n=5 identity and school/expand agreement;
    Stage 1 O-SUPPORT with 100/100 n=17 identity and school/expand agreement
    and false_sum_equals_resultant = 0; check.py OK on both runs.
  falsification_criterion: >-
    A kept tuple at n=5 or n=17 with sylvester != product, with seeds and
