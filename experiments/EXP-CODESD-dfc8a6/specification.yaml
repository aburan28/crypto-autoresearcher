experiment:
  id: EXP-CODESD-dfc8a6
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-77e7d2; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-77e7d2
  question_id: RQ-MQOM-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Sensitivity sweep of one MPC-in-the-head soundness-and-size accounting expression across
    three scheme-like parameter shapes plus one uniform-random null shape, emitting a paradigm-versus-scheme
    attribution table in exact rational arithmetic.
  objective: 'The single uncertainty a run reduces is whether the three-candidate coincidence, three
    NIST Round-3 signature schemes sharing one proof paradigm over three different hard problems,
    has any content at the level of the accounting each of them performs. Concretely: (i) whether
    a single expression with at most eight free arguments can state both the per-repetition soundness
    error and the signature-size formula for a code-shaped, a binary-circuit-shaped and a small-field-MQ-shaped
    tuple, measured by whether three independently authored implementations agree to within one bit
    at every shape; (ii) which terms of that expression move the slack S at all three shapes and which
    move it at exactly one, measured as exact rational derivatives rather than as prose; (iii) whether
    the resulting paradigm column is a property of the family or merely of the algebraic form of the
    expression, measured by whether a uniform-random parameter tuple carrying no scheme identity reproduces
    the same column when pushed through the identical code path in the same invocation. A run does
    not reduce uncertainty about any scheme''s security, about whether any published bound is tight,
    or about what any specification says. It reduces uncertainty about whether the cross-scheme comparison
    this bucket is built on can be made decidable at all, and it does so cheaply enough that a negative
    answer is affordable.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for the four parameter
      tuples actually evaluated, under the declared expression E and the declared perturbation steps,
      the following terms moved the slack at all shapes and the following at exactly one, with these
      exact rational derivatives. What does NOT follow: nothing about the security, soundness, tightness
      or parameter choices of SDitH, FAEST or MQOM as deployed; nothing about what any specification
      contains; and no statement that any published bound is loose, since S is a difference against
      a model authored here and a nonzero S is first evidence about the model.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes) freeze the argument box and generate four parameter tuples,
      three scheme-like and one uniform-random, writing them to an immutable fixture before any sweep
      code is written. STAGE 1 (cost: hours of human time) author E three times by three separate
      code paths over fractions.Fraction, each producing per-repetition soundness, composed soundness
      and size in bytes. STAGE 2 (cost: seconds) evaluate all three authorships at all four tuples;
      record pairwise disagreement in bits; HALT the lane and report the disagreement as the result
      if any pair exceeds one bit. STAGE 3 (cost: seconds) run the degenerate controls: tau equal
      to one must zero every composition-derived term; N equal to two must reproduce a hand-computed
      fixture. STAGE 4 (cost: seconds) perturb each argument at two step sizes, recompute S, record
      exact rational derivatives at all four tuples. STAGE 5 (cost: seconds) assign columns by the
      declared threshold, then demote from the paradigm column every term the random tuple also produces.
      STAGE 6 (cost: minutes) emit the table with per-cell provenance labels, both step sizes, and
      the raw derivatives so the threshold can be revisited by any reader.'
    instrument: 'Python 3.11 standard library only: fractions.Fraction, math.comb, itertools. No numpy
      required and no Sage. Run under harness/runner.py so the manifest records the resolved inference
      block; results written as an immutable run record under an experiments/EXP-* directory per AGENTS.md
      rule 2. No cryptographic library is loaded because no cryptography is executed.'
    parameters: 'Four parameter tuples. Argument box, all ILLUSTRATIVE: lambda in {128, 192, 256};
      N in {8, 16, 32, 64, 128, 256}; tau in {8, 12, 16, 24, 32, 48}; tree_shape in {tau independent
      trees, one merged tree}; grind_bits in {0, 4, 8, 12, 16}; field_size in {2, 4, 16, 251, 256};
      opening_cost in bytes per revealed node in {16, 24, 32}; relation_soundness as an opaque rational
      in {0, 1/field_size, 2/field_size}. Perturbation steps: relative 1/100 and 1/1000 for real-valued
      arguments, plus or minus one for integer arguments. Sample size: all four tuples times eight
      arguments times two step sizes equals 64 derivative evaluations per authorship, 192 total.'
  controls:
  - The uniform-random fourth shape run in the same invocation through the identical sweep.
  - Three independent authorships of E whose mutual disagreement gates the lane before any attribution
    is reported.
  - A degenerate shape with tau equal to one, where repetition composition is the identity and every
    composition-derived term must vanish; a nonvanishing term there is an implementation bug, not
    a finding.
  - A shape with N equal to two, the smallest party count, where the per-repetition soundness term
    takes a hand-computable value that is checked against a fixture.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The fourth parameter shape drawn uniformly at random from the declared
    argument box, carrying no scheme identity, run through the IDENTICAL sensitivity sweep in the
    same invocation. For the signal arm to mean anything the null must place at least one term in
    a DIFFERENT column than the three scheme-like shapes do. If the random tuple reproduces the same
    paradigm column exactly, then the column is a property of the algebraic form of E and not of the
    family, and the entire signal arm is reported as a controlled null with no attribution content.'
  independent_variables:
  - parameter tuple identity (three scheme-like, one uniform-random null)
  - which argument of E is perturbed
  - perturbation step size (1/100 versus 1/1000)
  - authorship of E (three independent implementations)
  metrics:
    primary:
    - exact rational dS/dargument per argument per tuple
    - column assignment per term (paradigm, scheme, none, artifact-of-model)
    - pairwise authorship disagreement in bits per tuple
    - count of paradigm-column terms surviving null demotion
    secondary:
    - S in bits per tuple
    - number of free arguments actually needed per tuple
    - column stability across the two perturbation step sizes
    - wall-clock seconds for the full sweep
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The number of terms of E that land in the paradigm column at all three scheme-like tuples
      AND are NOT reproduced by the uniform-random tuple.
    formula: 'P = card{ t in terms(E) : |dS/dt| > theta at all three scheme-like tuples AND |dS/dt|
      <= theta at the random tuple }, with theta declared before the run as one part in ten thousand
      of |S| at that tuple. Predicted P is at least 2; P equal to 0 is the flat falsification.'
    source: Pre-registered in the parent proposal IDEA-20260816-77e7d2 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The tested parameters are the four declared tuples in the illustrative argument
      box, at lambda values 128 to 256 but with no instance solved and no cryptography executed, so
      the computation is exact and scale-free in compute terms. The transfer assumption is explicit
      and weak: the table describes the DECLARED EXPRESSION at the DECLARED TUPLES. Transfer to any
      real scheme requires a Stage 0 filing of that scheme''s actual tuple, which this environment
      cannot perform, and until then no cell of the table is a statement about a deployed parameter
      set.'
    correspondence: null
  tail_checks:
  - 'tau equal to one: every composition-derived derivative must be exactly zero.'
  - 'N equal to two: the per-repetition soundness term must match a hand-computed rational fixture
    exactly.'
  - 'grind_bits equal to zero: the grinding term must drop out of every column.'
  - 'field_size equal to two with relation_soundness zero: S must be finite and the size formula must
    remain positive; a negative byte count is an instrument failure and halts the lane.'
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report if any two authorships of E disagree by more than one bit at any tuple.
  - Halt if any degenerate control (tau equal to one, N equal to two) fails its fixture.
  - Halt if column assignments differ between the two perturbation step sizes for more than one term,
    since the derivative regime is then not established.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Three independently authored implementations of E agree to within one bit at
    all four tuples, all degenerate controls pass, and the sweep emits a complete four-column attribution
    table whose paradigm column after null demotion is nonempty and stable across both perturbation
    step sizes.
  falsification_criterion:
  - 'P equals 0: no term is paradigm-level after null demotion, so the shared-paradigm coincidence
    has no accounting content at this abstraction.'
  - The random null tuple reproduces the entire paradigm column, showing the column is an artifact
    of E's algebraic form.
  - Authorship disagreement exceeds one bit, falsifying that E is well-defined enough to be authored
    independently.
  - More than eight free arguments are needed at any tuple, falsifying claim (A).
  - Column assignments are unstable between step sizes for more than one term.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-77e7d2
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must decide whether the illustrative argument box is acceptable at all given that
    no specification has been read, or whether the lane is blocked until a KN-LIT filing supplies
    at least one real tuple.
  - The threshold theta is declared here as one part in ten thousand; the Coordinator must accept
    or replace it before freezing, since it alone decides column membership.
  - Whether three independent authorships are affordable, or whether two plus a fixture set is the
    practical gate.
