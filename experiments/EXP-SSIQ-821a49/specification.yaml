# =============================================================================
# EXP-SSIQ-821a49 — version 1, approved by DEC-20261006-ac14d7.
# Frozen census of the two minimal-degree readings in
# IDEA-20261006-b6ce60. Success is the idea's prediction: the
# symmetric difference of the multisets is empty, and the curve-side
# 5-smooth fraction differs from 10/14 by more than 0.15. A finished
# census with a nonempty difference, or with an absolute gap of at
# most 0.15, is the concrete negative. This design session did not
# enumerate a j-invariant and did not compute a degree. No discrete
# logarithm is authorized. Source idea bytes are copied unchanged from
# origin/design/ssi-2f5c3f-cartier.
# =============================================================================
experiment:
  id: EXP-SSIQ-821a49
  hypothesis_id: H-SSIQ-4cae0e
  question_id: RQ-SSIQ-9702af
  source_idea: IDEA-20261006-b6ce60
  version: 1
  title: >-
    Curve-side and quaternion-side minimal degrees at the first prime
    past 5500, and the gap from 10/14
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-ac14d7
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that the multisets are equal, does not
      assert that the gap exceeds 0.15, and does not assert that the
      exponent moves.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Census every supersingular j in F_{p^2} at the smallest prime
      p >= 5500, compute the least separable degree to j^p and the
      least Nrd/p on one maximal order per j, and compare the multisets
      and the exact rational gap from 10/14. Do not change the prime
      rule, the degree ceiling 14, the smoothness bound 5, or the
      threshold 0.15. Do not search for a discrete logarithm and do
      not run a walk.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether, at the smallest prime p >= 5500, the multiset of
    least separable degrees d(j) from each supersingular j to j^p
    equals the multiset of least reduced norms Nrd/p, and whether the
    curve-side 5-smooth fraction differs from 10/14 by more than 0.15.
    A finished nonempty symmetric difference is the concrete negative
    for the isometry check. A finished absolute gap of at most 0.15,
    once the multisets are equal, is the concrete negative for the
    uniform-model miss. No faster isogeny algorithm is in scope.

  inputs:
    p_rule: smallest prime at least 5500
    p_candidate: 5501
    X: 14
    cube_check: >-
      14^3 = 2744 and 15^3 = 3375. X equals 14 when 2*2744 <= p and
      2*3375 > p. If that fails, the row is instrument_failure and no
      fraction is scored.
    primality: >-
      Reconfirm that p_candidate is prime by trial division by every
      prime at most 73, and that no integer from 5500 through
      p_candidate-1 is prime. 73^2 = 5329 and 79^2 = 6241, so a
      composite candidate below 6241 has a prime factor at most 73.
      If p_candidate is not the smallest prime at least 5500, or if
      it is not strictly below 6750, the row is instrument_failure.
    smoothness_bound: 5
    uniform_ratio: '10/14'
    gap_threshold: '3/20'
    ten_smooth_integers: [1, 2, 3, 4, 5, 6, 8, 9, 10, 12]
    supersingular_test: >-
      Enumerate supersingular j-invariants in F_{p^2} by the classical
      supersingular polynomial, or by an equivalent Hasse-invariant
      test on one short-Weierstrass model per candidate j. Do not
      scan the points of E(F_{p^2}). One representative per j.
    degree_search: >-
      For each supersingular j, if j^p = j then d(j) = 1. Otherwise
      d(j) is the least integer ell with 2 <= ell <= 14 such that the
      modular polynomial Phi_ell satisfies Phi_ell(j, j^p) = 0 and a
      cyclic kernel of degree ell is retained. If no such ell exists,
      record d(j) as absent. An absent value is a multiset element.
      It is not replaced by a larger search after the fact.
    quaternion_reading: >-
      For each supersingular j, take one maximal order in the
      quaternion algebra ramified at p and infinity corresponding to
      that j. On the unique two-sided ideal of reduced norm p, take
      the least value of Nrd(alpha)/p. That integer is the
      quaternion-side reading. If a sampler emits only one order for
      a Gal(F_{p^2}/F_p) pair {j, j^p} with j different from j^p,
      duplicate that integer so both j-invariants appear. If either
      side fails to emit one item per enumerated j, the row is
      instrument_failure.
    exact_gap: >-
      Let n be the number of curve-side values and s the number of
      those values that are 5-smooth positive integers, meaning not
      divisible by any prime greater than or equal to 7. Absent is
      not 5-smooth. The absolute gap exceeds 3/20 exactly when
      10 * |14*s - 10*n| > 21*n. It is at most 3/20 when that
      inequality fails. A floating-point comparison voids the run.
      Record the gap as the reduced fraction |14*s - 10*n| / (14*n),
      which is |s/n - 10/14|.
    symmetric_difference: >-
      Compare multiplicities. The size of the symmetric difference is
      the sum, over every integer and over the symbol absent, of the
      absolute difference of the two multiplicities. The size is 0
      exactly when the multisets are equal.

  controls:
    - id: five-smooth-count
      statement: >-
        Recompute by trial division how many integers in {1,...,14}
        are 5-smooth. The count must equal 10 before the gap is
        scored. Any other count is instrument_failure.
    - id: subfield-degree
      statement: >-
        Every supersingular j already in F_p has d(j) = 1. A larger
        value invalidates both fractions and is instrument_failure.
    - id: ordinary-control
      statement: >-
        On y^2 = x^3 + x + a over F_p, for the smallest a in {1,2,3,4,5}
        that gives a nonsingular ordinary curve, the same degree search
        returns no isogeny of degree at most 14 from the curve to its
        conjugate. A hit is instrument_failure. Ordinary means the
        trace #E(F_p)-(p+1) is not 0. Singular means
        4*1^3 + 27*a^2 is 0 in F_p. If no such a exists, the row is
        instrument_failure.
    - id: gal-duplication
      statement: >-
        A quaternion sample that emits one order for a pair
        {j, j^p} with j different from j^p is duplicated before the
        multisets are compared. Forgetting the duplicate is not a
        mathematical difference of degrees.

  independent_variables:
    - supersingular j-invariant in F_{p^2}
    - reading in {curve-side degree, quaternion norm}
    - 5-smooth versus not, on the curve-side values

  metrics:
    primary:
      - id: symmetric_difference_size
        statement: >-
          The size of the symmetric difference of the two d_min
          multisets, as a nonnegative integer. Zero is the idea's
          equality prediction.
      - id: smooth_gap
        statement: >-
          The absolute gap between the curve-side 5-smooth fraction
          and 10/14, as a reduced rational, together with whether it
          is strictly greater than 3/20.
    secondary:
      - id: census_counts
        statement: >-
          the number of supersingular j-invariants, the number whose
          j lies in F_p, and the number of absent curve-side degrees
      - id: tail_counts
        statement: >-
          the curve-side counts of the values 7, 11, 13, and 14, and
          of absent
      - id: heur1_flag
        statement: >-
          true when the multisets are equal and the absolute gap is
          at most 3/20, which is the falsifier of HEUR-1, and false
          when the gap is strictly greater than 3/20. The flag is
          not scored when the multisets differ.

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 is the finite ratio 10/14 at X = 14. A gap of at most 0.15
    is the row gap_within. Do not relabel that row as an unequal
    multiset, and do not relabel an unequal multiset as a gap.

  preregistered_prediction:
    quantity: >-
      The symmetric difference of the curve-side and quaternion-side
      minimal-degree multisets, and the absolute gap between the
      curve-side 5-smooth fraction and 10/14.
    formula: >-
      The symmetric difference is empty, and the absolute gap is
      strictly greater than 0.15, written as the exact threshold
      3/20. The concrete negative is a finished nonempty difference,
      or a finished gap of at most 3/20 once the multisets are equal.
      Source idea IDEA-20261006-b6ce60. No j-invariant was enumerated
      before this formula was frozen.
    source: >-
      IDEA-20261006-b6ce60. The archived paper's Heuristic 1 and
      Theorem 1.4, opened in this session, supply the Dickman tail
      in a window X = 14 does not meet. They do not predict 10/14.
      Section 4 of that paper is the isometry being compared, not a
      prediction that the multisets match at this prime.

  scale_relevance:
    tier: toy
    justification: >-
      The census is every supersingular j at one prime near 5500.
      log2 of that prime is below the question's stated toy window
      of log2(p) in [20, 60]. No transfer to that window, and none
      to a SQIsign prime, is assumed. The full census replaces a
      sample-size calculation: every supersingular j is scored, so
      there is no draw whose tail probability must be resolved by
      extra samples. The threshold 0.15 is the idea's minimum
      effect, not a fitted quantile.
    correspondence: >-
      The Deuring isometry of the archived Section 4 identifies the
      least degree E -> E^{(p)} with the least Nrd/p on the two-sided
      ideal of reduced norm p. This experiment computes both sides
      at this prime. It does not use the isometry to skip the curve
      side, and agreement here is not a sample at cryptographic size.

  tail_checks:
    - >-
      Record the curve-side counts of 7, 11, 13, 14, and absent
      beside the 5-smooth fraction. Those four integers are the
      non-5-smooth members of {1,...,14} named by the source idea.
    - >-
      Record the subfield count of j with d(j) = 1. Subfield curves
      are part of S and are not dropped before the gap is scored.

  replication:
    seeds:
      - EXP-SSIQ-821a49|census
    independent_instances: 1
    note: >-
      The census is deterministic. One is the number of primes. There
      is no shuffle sample.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One run manifest covers the full census at this prime.
      Wall-clock and CPU figures are advisory and null. The 8 GB
      memory figure is machine protection for the modular-polynomial
      and quaternion arithmetic. A watchdog expiry is
      failed_infrastructure, not a nonempty symmetric difference and
      not a gap of at most 0.15.

  stopping_rules:
    - Stop after the census, the controls, and exactly one reading row are recorded.
    - Do not change p, X, the smoothness bound, or the threshold after seeing a degree.
    - Do not extend the modular-polynomial search past degree 14.
    - A timeout voids the run. It does not fill either negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - Any prime other than the smallest prime at least 5500 voids the run.
    - A floating-point gap comparison voids the run.
    - instrument_failure is an instrument row. It is not an unequal multiset and it is not a gap.
    - Dropping a subfield j before the fraction is scored voids the run.
    - Scoring the ordinary control curve inside S voids the run.

  success_criterion: >-
    The census finishes, the instrument checks pass, both sides emit
    one item per supersingular j, the symmetric difference is empty,
    and the curve-side absolute gap from 10/14 is strictly greater
    than 0.15. This is the prediction of IDEA-20261006-b6ce60. It is
    reachable as a failure when the finished symmetric difference has
    size at least 1, and it is reachable as a failure when the
    multisets are equal and the absolute gap is at most 0.15.

  falsification_criterion: >-
    The census is fully scored, the instrument checks pass, and either
    the two multisets differ by at least one integer, or the multisets
    are equal and the curve-side 5-smooth fraction lies at most 0.15
    away from 10/14. Those are the two concrete negatives named with
    the source idea. A supersingular j in F_p with d(j) greater than
    1, and an ordinary control hit, are instrument rows. None of these
    is an infrastructure event.

  required_artifacts:
    - experiments/EXP-SSIQ-821a49/runs/RUN-*/manifest.yaml
    - experiments/EXP-SSIQ-821a49/runs/RUN-*/stdout.txt
    - experiments/EXP-SSIQ-821a49/runs/RUN-*/stderr.txt
    - experiments/EXP-SSIQ-821a49/runs/RUN-*/census.csv
    - experiments/EXP-SSIQ-821a49/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        p is not the smallest prime at least 5500, p is not below
        6750, X is not 14, the 5-smooth count in {1,...,14} is not
        10, a supersingular j in F_p has d(j) greater than 1, the
        ordinary control has a conjugate isogeny of degree at most
        14, no ordinary control curve exists, either side fails to
        emit one item per j, or the gap comparison is not exact
    - id: multiset_differs
      when: >-
        the instrument checks pass and the symmetric difference has
        size at least 1
    - id: gap_within
      when: >-
        the instrument checks pass, the symmetric difference is
        empty, and the absolute gap is at most 3/20
    - id: both_met
      when: >-
        the instrument checks pass, the symmetric difference is
        empty, and the absolute gap is strictly greater than 3/20
  reading_rule: >-
    Name exactly one row, the first whose condition holds in the order
    listed. both_met is the only success row. multiset_differs is the
    concrete negative for the isometry check. gap_within is the
    concrete negative for the uniform-model miss. instrument_failure
    is not a difference and is not a gap. Record n, s, the reduced
    gap, the symmetric-difference size, the tail counts, and
    attack_claimed false beside the row. Those fields do not change
    the row.
