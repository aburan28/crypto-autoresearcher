      instance and is not authorized under this card.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and methodological-note.json.
    - Stage 1 complete with three-arm-yield/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-BINSTD-2cea8d.
    - maximum_runs = 4.
    - Do not open Stage-2 under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure or cert_fail → O-ARTIFACT; do not read ratios as support.
    - Walk used as a pool source → protocol invalid.
    - Reporting H_alt from Stage 1 alone → protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an exponent move → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok, empty_pool_hits=0, and density
    match ≤10%; Stage 1 produces pairwise ratios (or a named
    O-ARTIFACT/O-IMPEDIMENT/O-INCONCLUSIVE stop); RESULTS.md names exactly
    one O-* label from H-BINSTD-2cea8d with cited artifacts.

  falsification_criterion: >-
