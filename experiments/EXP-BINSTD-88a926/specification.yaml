        preregistered-predictions.json (list rows with integer n) BEFORE
        Stage 1. Inline M2/M1 formulas recorded, not scored as the claim.
      - >-
        Stage 1. Three arms at n=17, m=2, ≥200 attempts, N=96: normal-HW,
        poly-HW, uniform. Dual-route certificates. Pairwise ratios vs
        [0.7,1.4]. RESULTS.md with exactly one O-* label.
    excluded:
