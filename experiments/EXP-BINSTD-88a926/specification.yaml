  inputs:
    source_idea: ledger/proposals/IDEA-20261001-d53638.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-2cea8d.yaml
    literature:
      - knowledge/literature/KN-LIT-661e97.md
    related:
      - experiments/EXP-BINSTD-a3cfee/specification.yaml
      - docs/claims-and-verification.md
    cells:
      - {n: 17, c_nb: 4, c_pb: 4, N: 96, attempts: 200}
    yield_ratio_band: [0.7, 1.4]
    density_match_max: 0.10
    walk: false

  controls:
    - name: uniform_size_matched_pool
      definition: Arm C is uniform affine points, size N, no HW filter.
    - name: density_match_within_10pct
      definition: binomial densities of (c_nb) and (c_pb) match within 10%.
    - name: schoolbook_decomposition_reverify
      definition: Route B schoolbook P+Q==R on every counted hit.
    - name: twin_add
      definition: TableField add equals schoolbook add on every counted hit.
    - name: empty_pool_null
      definition: mitt on empty pool yields zero hits.
    - name: no_walk_rejection_sampling_only
      definition: Pools built by rejection sampling; walk forbidden.
    - name: inline_uniform_m1_m2_gate
      definition: >-
        Out-of-band pairwise ratios are O-INCONCLUSIVE unless
        min(relerr_M1, relerr_M2) ≤ 0.5 on the uniform arm.
    - name: ctl_no_posthoc_band_edit
      definition: Yield band [0.7,1.4] frozen in preregistered-predictions.json.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_three_arm_n17]
    - name: arm
      levels: [normal_hw, poly_hw, uniform]
    - name: basis
      levels: [normal, polynomial, none]

  metrics:
    primary:
      - name: yield_ratio_nb_over_pb
        unit: dimensionless
        definition: p_hat(normal-HW) / p_hat(poly-HW); band [0.7,1.4].
      - name: twin_agreement
        unit: boolean
        definition: Table add equals schoolbook add on every counted hit.
      - name: certificate_pass_rate
        unit: dimensionless
        definition: schoolbook re-verify pass rate on counted hits.
    secondary:
      - name: yield_ratio_nb_over_uni
        unit: dimensionless
      - name: yield_ratio_pb_over_uni
        unit: dimensionless
      - name: density_rel_err
        unit: dimensionless
      - name: uniform_relerr_M1
        unit: dimensionless
      - name: uniform_relerr_M2
        unit: dimensionless
      - name: wall_clock_seconds
        unit: seconds
      - name: peak_rss_bytes
        unit: bytes

  heuristic_under_test: HEUR-BINSTD-d53638-H1

  preregistered_prediction:
    quantity: >-
      Pairwise Semaev m=2 yield ratios among {normal-HW, poly-HW, uniform}
      at n=17 with matched density and equal N.
    formula: >-
      ratios in [0.7, 1.4]; binomial dens(c) = sum_{k=0..c} C(n,k)/2^n
    source: >-
      IDEA-20261001-d53638 HEUR-BINSTD-d53638-H1; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Composition instrument on n=17 only under this card. No transfer
      of a toy ratio into a deployed-curve attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids ratio claims (O-ARTIFACT).
    - Density match failure → O-ARTIFACT.
    - Uniform instrument fail → O-INCONCLUSIVE (band not read as H_alt).
    - Empty-pool hit → O-ARTIFACT.

  seeds_and_replication:
    pool_seed: 202610035638
    r_seed: 202610035639
    nb_seed: 202610035641
    pb_seed: 202610035642
    uni_seed: 202610035643
    independent_instances: 1
    note: >-
