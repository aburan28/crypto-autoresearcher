      - Any ECDLP solve or deployed-curve attack.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Stage-2 n=23 replication under this card.
      - Editing IDEA-20261001-d53638 claim text or GOAL-ECDLP2M-001.yaml.
      - Retuning the [0.7,1.4] band after observing Stage 1 outcomes
        without a protocol_amendment.
      - Reporting H_alt from a single cell.
      - Treating infra failure as mathematical evidence.

  execution_surface:
