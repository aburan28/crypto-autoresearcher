experiment:
  id: EXP-ECDLP-3c1bc0
  hypothesis_id: H-ECDLP-0e7bf2
  version: 1
  title: Exhaustive special-j rational-isogeny closure audit
  status: approved
  frozen: true
  frozen_on: '2026-08-08'
  objective: >-
    Enumerate every F_p-rational odd-prime kernel in the declared special-j
    toy cells, construct the quotient by exact Velu arithmetic, and separate
    split/nonexceptional closure from ramified, repeated-Frobenius, and
    non-F_p-rational controls.
  inputs:
    prime_list: [101, 103, 107, 109, 113, 127, 131, 137, 139, 149, 151, 157, 163, 167, 173, 179, 181, 191]
    families:
      - id: j0
        j: 0
        cm_discriminant: -3
        rationality_condition: p % 3 == 1
      - id: j1728
        j: 1728
        cm_discriminant: -4
        rationality_condition: p % 4 == 1
    degrees: [3, 5, 7, 11, 13]
    arithmetic: harness.toycurve.EllipticCurve plus harness.isogeny_class.velu_odd
  controls:
    - id: CTRL-MAP
      description: Every quotient coefficient and sampled Velu image is checked on the target curve; failures invalidate the cell.
    - id: CTRL-KERNEL-COMPLETE
      description: Every order-ell point is canonicalized into a unique subgroup; no favorable kernel is selected.
    - id: CTRL-SPLIT-STRATA
      description: CM Legendre symbol, ramification, and Frobenius discriminant are recorded before interpreting j preservation.
    - id: CTRL-NONRATIONAL
      description: p values where the special-j automorphism is not F_p-rational are held out as nearby-object controls.
    - id: CTRL-ORDER
      description: Source and quotient point counts are recomputed independently and must match for a valid isogeny.
  independent_variables: [family, p, twist, ell, cm_split_symbol, frobenius_discriminant_mod_ell, rational_cm_available]
  metrics:
    primary:
      - split_nonexceptional_special_j_preservation_rate
      - split_nonexceptional_target_automorphism_match_rate
      - valid_map_certificate_rate
    secondary:
      - enumerated_kernel_count
      - exceptional_stratum_counts
      - nonrational_control_target_j_distribution
  preregistered_prediction:
    quantity: split/nonexceptional quotient closure
    formula: >-
      For every valid source/kernel with rational_cm_available=true,
      ell not dividing the CM discriminant, and Frobenius discriminant nonzero
      modulo ell, target_j == source_j and target_aut_order == source_aut_order.
    source: H-ECDLP-0e7bf2 proof-search mechanism; finite audit only
  scale_relevance:
    tier: toy
    justification: >-
      Full point and kernel enumeration is intentionally bounded to small
      prime fields; no result transfers directly to cryptographic size.
    correspondence: null
  tail_checks:
    - Verify no nonexceptional rational-CM cell is silently classified as an exception.
    - Report all exceptional and nonrational counterexamples separately.
  replication:
    seeds: [101, 103, 107, 109, 113, 127, 131, 137, 139, 149, 151, 157, 163, 167, 173, 179, 181, 191]
    independent_instances: 1
  budget:
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 0.1
    maximum_memory_gb: 2
    maximum_runs: 1
  stopping_rules:
    - Stop after all declared primes, twists, degrees, and unique kernels are enumerated.
    - Stop and mark infrastructure failure if a quotient or sampled image is not on its target curve.
  invalidation_rules:
    - A kernel not proven to have exact order ell invalidates that cell.
    - A source/target order mismatch invalidates that cell and the run cannot support interpretation.
    - A timeout is infrastructure evidence only.
  success_criterion: >-
    All valid split/nonexceptional rational-CM cells preserve the source special
    j and the expected rational automorphism order, while all map/order checks
    pass and the exceptional/nonrational strata are separately reported.
  falsification_criterion: >-
    At least one valid split/nonexceptional rational-CM cell leaves the special
    j locus or loses the expected rational automorphism order.
  required_artifacts:
    - experiments/EXP-ECDLP-3c1bc0/runs/RUN-ECDLP-3c1bc0-001/manifest.yaml
    - experiments/EXP-ECDLP-3c1bc0/runs/RUN-ECDLP-3c1bc0-001/raw-result.json
    - experiments/EXP-ECDLP-3c1bc0/runs/RUN-ECDLP-3c1bc0-001/stdout.log
    - experiments/EXP-ECDLP-3c1bc0/runs/RUN-ECDLP-3c1bc0-001/stderr.log
    - experiments/EXP-ECDLP-3c1bc0/runs/RUN-ECDLP-3c1bc0-001/command.txt
    - experiments/EXP-ECDLP-3c1bc0/runs/RUN-ECDLP-3c1bc0-001/environment.json
  assigned_to: executor
  approved_by: coordinator
  approval_decision_id: DEC-20260808-bd7dc9
