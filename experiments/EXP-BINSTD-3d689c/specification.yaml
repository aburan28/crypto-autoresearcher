# EXP-BINSTD-3d689c
# Degree gaps and toy-ratio brackets. No search.
# Approved by DEC-20261002-a0b092.
experiment:
  id: EXP-BINSTD-3d689c
  hypothesis_id: H-BINSTD-7b6461
  source_idea: IDEA-20260922-9e5383
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Field-size gaps and toy-ratio errors
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-a0b092
  objective: >-
    Subtract the nine named degree pairs. Cross-multiply the five toy
    ratios against their deployed ratios. Check primality of the stated
    multipliers and null degrees. Reject an error of at most 10
    percentage points on pair 3.
  inputs:
    gaps:
      - {left: 176, right: 191, gap: 15}
      - {left: 208, right: 191, gap: 17}
      - {left: 208, right: 239, gap: 31}
      - {left: 272, right: 239, gap: 33}
      - {left: 272, right: 359, gap: 87}
      - {left: 304, right: 239, gap: 65}
      - {left: 304, right: 359, gap: 55}
      - {left: 368, right: 359, gap: 9}
      - {left: 368, right: 431, gap: 63}
    toys:
      - {d: 4, k: 7, n: 31, dk: 28}
      - {d: 2, k: 17, n: 31, dk: 34}
      - {d: 2, k: 19, n: 37, dk: 38}
      - {d: 4, k: 7, n: 31, dk: 28}
      - {d: 2, k: 19, n: 37, dk: 38}
    brackets:
      pair1_relative_under_2_percent: true
      pair2_relative_under_1_percent: true
      pair3_points_above_10: true
      pair3_points_below_12: true
      pair4_points_above_5: true
      pair4_points_below_6: true
      pair5_points_above_tenth: true
      pair5_points_below_fifth: true
    nine_is_prime: false
    thirty_three_is_prime: false
  controls:
    - >-
      Pair 3's error being at most 10 percentage points is false.
      Reporting that invalidates the run.
    - >-
      Reporting 9 or 33 as prime invalidates the run.
    - Two integer routes. They must not import each other.
  independent_variables:
    - pair
    - route in {cross_multiply, repeat_module}
  metrics:
    primary:
      - gaps
      - dk_at_most_41
      - d_divides_16
      - brackets
      - pair3_at_most_10_rejected
      - implementations_agree
    secondary:
      - prime_bits
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Nine gaps and eight bracket bits.
    formula: >-
      A gap is the absolute difference of the two degrees. A percentage-
      point error is 100 times the absolute difference of the toy
      fraction and the deployed fraction. Relative error divides that
      difference by the deployed fraction. Compare by cross-multiplication,
      not by floating point.
    source: >-
      IDEA-20260922-9e5383 gap list and toy pairs, read 2026-10-02.
      The comparisons were recomputed in this design session. That
      computation is not a run. The written 10-point figure on pair 3
      is below the exact error. No search was run.
  scale_relevance:
    tier: toy
    justification: Integer comparisons of named degrees. No transfer to a conflict count.
    correspondence: null
  tail_checks:
    - Pair 5 is required. Stopping after pair 3 and still reporting the pair-5 bracket is invalid.
  replication:
    seeds: []
    independent_instances: 5
    replication_note: Deterministic. The second run is the other integer route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If pair 3 is reported at most 10 percentage points off, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - Pair 3 is reported at most 10 percentage points off.
    - 9 or 33 is reported prime.
    - A search or a conflict count is reported.
  success_criterion: >-
    Both runs agree on the nine gaps, the five products at most 41, the
    five divisors of 16, the primality bits, and the eight bracket bits.
    Pair 3 stays strictly above 10 percentage points. The integers 9 and
    33 stay composite.
  falsification_criterion: >-
    The runs agree, pair 3 stays above 10 points, 9 and 33 stay
    composite, and any gap, product, or bracket bit differs from the
    preregistered table.
  required_artifacts:
    - experiments/EXP-BINSTD-3d689c/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-3d689c/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-3d689c/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-3d689c/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-3d689c/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-3d689c/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any WDSat run or conflict ratio.
    - A claim that subfield structure helps or does not help.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
