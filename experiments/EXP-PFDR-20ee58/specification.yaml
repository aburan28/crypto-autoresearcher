experiment:
  id: EXP-PFDR-20ee58
  hypothesis_id: H-PFDR-9aadc0
  question_id: RQ-PFDR-ae2fba
  idea_id: IDEA-20260903-cf63ad
  version: 1
  recorded_at: '2026-09-03'
  drafted_under_task: TASK-20260903-b5d2ae
  battery_position: 4 of 6
  title: >-
    The prime-field digit twin of the binary chained Semaev system: extra-
    syzygy deficit at D in {5..8} on the chained t = 3 tree with a free
    internal node, s in {3, 4, 5}, against a Koszul-only baseline, with the
    binary n = 12 calibration of the ported meter and the s = 1 slice tied
    to IDEA-20260830-cb8e46's chained encoding
  status: review_required
  approved_by: null
  assigned_to: executor
  objective: >-
    Decide whether KN-FIND-006's binary 8 dim V deficit has any prime-field
    existence on the chained tree: M1 (characteristic-2 artifact, deficit 0
    at every D <= 8) against M2 (chaining-graph property, deficit(8) affine
    in s with nonzero slope, p-independent) against M3 (neither). STAGE 0
    (zero compute, hard gate): the one-page derivation of (S2)-(S3) --
    verify by hand that the degree-4 part of E1 contains x_1^2 x_2^2 and
    E2's degree-4 part is u^2 x_3^2, and the counterexample f = a_1 + a_2 to
    f^2 = f. STAGE 1 (instrument): the shared F_p meter extended with a free
    variable u and the cumulative-multiplier deficit convention, CALIBRATED
    on the committed binary n = 12 chained system: it must return
    deficit(3) = 1 and deficit(4) = 31 with null 0 (KN-FIND-006) before any
    prime-field number is read. STAGE 2 (baseline slice): s = 1, d = B in
    {4, 8}: the generator list must equal cb8e46's chained J symbolically;
    its graded ranks are recorded as a frozen fixture. STAGE 3 (separating
    cells): d = 2, s in {3, 4, 5}, p in {4099, 16411, 65537}, 6 curves of
    generic j, planted targets, D in {5, 6, 7, 8}, arms SEM, NULL-SUPPORT,
    NULL-TOPOLOGY, non-curve cubic; the DECIDING CELL is (s = 3, D = 8), an
    886-row by 2304-column rank per arm; s = 6 at D <= 6 only; (s = 6,
    D = 8) excluded by name. STAGE 4 (decay checks): the p-ladder at fixed
    s = 4 and the curve spread. STAGE 5 (zero compute): fit deficit(8)
    residual against s; declare M1, M2, M3 or unresolved by the pre-
    registered rule. Budget note: budgets are at or above the template
    floors; the largest cell (s = 5, D = 8) is 5310 x 56751 over F_p, about
    2.4 GB dense-equivalent, so the memory cap is raised to 16 GB and the
    column cap to 60,000 for this contract; the run granularity is one
    (s, p) cell over all curves, targets, degrees and arms.
  inputs:
    tree: 'E1 = S_3(x_1, x_2, u), E2 = S_3(u, x_3, x_R); u free in F_p; x_R constant; leaves x_k = sum_{i<s} 2^i a_{k,i} with a(a - 1) = 0'
    cells: 'd = 2; s in {3, 4, 5} (s = 6 at D <= 6 only); p in {4099, 16411, 65537}; D in {5, 6, 7, 8}'
    curves_and_targets: '6 curves of generic j per p with at least three on-curve x in [0, 2^s); planted: u = x(P_1 + P_2), x_R = x(P_1 + P_2 + P_3) with x(P_k) in the window; certificates by independent point addition'
    deficit_definition: 'deficit(D) = rows(D) - rank(Mac_D) - koszul(D) with rows m E_i over multilinear-in-a, free-in-u monomials m of degree <= D - 4 (cumulative multipliers), koszul(8) = 1, koszul(D < 8) = 0'
    matrix_sizes: 'rows at D = 8: 886 / 2372 / 5310 at s = 3 / 4 / 5; columns at D = 8: 2304 / 12381 / 56751; s = 6 at D = 6: 49024 columns'
    binary_calibration_arm: 'the committed GF(2) chained system at n = 12 (k = 4) from the EXP-DREG-001 builder; expected deficit(3) = 1, deficit(4) = 31, support-matched null 0, under the same cumulative convention KN-FIND-006 used'
    s1_slice: 's = 1, d = B in {4, 8}: generators must equal cb8e46''s chained J = (S_3(x_1, x_2, u), S_3(u, x_3, x_R), fV(x_1), fV(x_2), fV(x_3)) with the interval base, generator for generator'
    shared_meter: >-
      REQUIRED INPUT (shared prerequisite, DEC-20260903-8cdf8d next_actions
      item 1): the F_p port of experiments/EXP-SBRG-60c55e/driver/
      macaulay.py extended with (i) a free variable, (ii) the cumulative-
      multiplier deficit convention, (iii) a Koszul count, with (a) the
      p = 2 known answer against KN-FIND-006 under the SAME convention and
      (b) the planted-syzygy positive control passed in the same manifest
      lineage.
    artifact_budget: 'the rank-drop rate at p = 4099 from EXP-PFDR-fd901a; any nonzero null deficit within that budget is a rank-drop event, not a baseline failure'
  controls:
    - id: CTRL-BINARY-CALIBRATION
      blocking: true
      object: 'the committed GF(2) chained system at n = 12'
      forced_disposition: >-
        deficit(3) = 1 and deficit(4) = 31 with null 0, exactly; a miss
        blocks every prime-field number.
    - id: CTRL-S1-SLICE
      blocking: true
      object: 's = 1, d in {4, 8}'
      forced_disposition: >-
        Symbolic identity with cb8e46's J; graded ranks recorded as a
        frozen fixture (no prime-field chained graded-rank instrument exists
        to compare against; the fixture is for future instruments).
    - id: NULL-SUPPORT
      blocking: true
      object: 'each generator replaced by a uniformly random polynomial on the identical monomial support; 5 seeds per cell'
      forced_disposition: >-
        deficit exactly 0 at every D <= 8 (Koszul-only baseline), up to the
        small-p rank-drop budget; a nonzero value beyond the budget means
        the baseline or the meter is wrong and nothing else is read.
    - id: NULL-TOPOLOGY
      blocking: true
      object: 'random polynomials with the same variable sets and multidegree, u shared between the two (IDEA-20260808-11b8c7''s construction carried to F_p); 5 seeds per cell'
      forced_disposition: >-
        Its deficit is the topological floor any Semaev-specific claim must
        exceed; realised degree distribution reported.
    - id: NEARBY-NON-CURVE-CUBIC
      blocking: true
      object: 'the S_3 formula evaluated at the coefficients of a singular Weierstrass cubic (4 A^3 + 27 B^2 = 0), same tree and digit generators, planted via the formula''s own roots'
      forced_disposition: >-
        A deficit matching SEM means the effect is about the S_3 formula,
        not the curve; reported.
    - id: CTRL-P-LADDER
      blocking: true
      object: 'SEM at s = 4, p in the three sizes, 6 curves each'
      forced_disposition: >-
        A structural deficit is p-independent within the null's seed
        spread; a deficit varying with p at fixed s is the canonical
        artifact tell and is reported as suspected artifact before M2.
    - id: CTRL-CURVE-SPREAD
      blocking: true
      object: 'SEM across the 6 curves at fixed (s, p)'
      forced_disposition: >-
        Within the null's seed band under M2; a curve-dependent deficit is
        M3.
    - id: CTRL-CERTIFICATES
      blocking: true
      object: 'every planted decomposition'
      forced_disposition: >-
        Re-verified by independent point addition; a failure invalidates
        the draw.
    - id: CTRL-MEMORY-PREFLIGHT
      blocking: true
      object: 'column and row count per cell before allocation'
      forced_disposition: >-
        Abort above 60,000 columns or 4 GiB dense-equivalent working set
        (sparse representation expected far below); aborted cells recorded
        as not computable in budget, by name.
    - id: CTRL-CONFOUNDERS-NAMED
      blocking: false
      object: >-
        (i) the CRT / complete-splitting artifact of IDEA-20260830-cb8e46:
        the twin inherits J's ideal-level degeneracy at every s, so a
        nonzero deficit is a generator-level fact and never an ideal
        invariant. (ii) the output-degree proxy of IDEA-20260807-899c5e: no
        Groebner degree is read; the solve bit sol(D) of IDEA-20260806-
        7ea402 is a covariate only. (iii) the multilinear reduction a^2 -> a
        is not homogeneous; the meter's degree convention is frozen and
        identical across arms. (iv) with two generators the system is far
        from overdetermined; deficits at D <= 8 concern low-degree
        multipliers only, and a deficit at D > 8 is out of reach and said
        so.
      forced_disposition: >-
        Named and excluded by construction.
  independent_variables:
    - 's in {3, 4, 5} (6 at D <= 6)'
    - 'p in {4099, 16411, 65537}'
    - 'D in {5, 6, 7, 8}'
    - 'arm: SEM | NULL-SUPPORT | NULL-TOPOLOGY | non-curve cubic'
    - 'curve (6 per p), planted target, null seed (5)'
  metrics:
    primary:
      - 'rows(D), ncols(D), rank(D), koszul(D), deficit(D) per (cell, arm, curve, target), D in 5..8'
      - 'deficit(8) on SEM minus deficit(8) on NULL-TOPOLOGY, fitted against s in {3, 4, 5} with slope and intercept and CI'
      - 'p-ladder spread and curve spread of deficit(8) at fixed s'
      - 'binary calibration integers and the s = 1 symbolic identity'
      - 'NULL-SUPPORT deficit per cell (forced 0)'
    secondary:
      - 'realised degree distribution of both null generators'
      - 'sol(D) per cell as a covariate (IDEA-20260806-7ea402), not a claim'
      - 'peak RSS, wall time, pre-flight counts, aborted cells with parameters'
      - 'certificate pass/fail per planted target'
  heuristic_under_test: 'HEUR-001 (Koszul-genericity of the support-matched null) and HEUR-002 (structural-Betti reading) of H-PFDR-9aadc0; the main M1/M2/M3 decision through the SEM arm'
  preregistered_prediction:
    quantity: >-
      deficit(D) on NULL-SUPPORT (forced), the binary calibration integers
      (forced), and the SEM deficit vector with its s-slope at D = 8.
    formula: >-
      NULL-SUPPORT: deficit(D) = 0 for all D <= 8 at every cell. Binary
      calibration: deficit(3) = 1, deficit(4) = 31, null 0. SEM: M1
      predicts deficit(D) = 0 for all D <= 8 at every s, p and curve (honest
      prior 0.75); M2 predicts deficit(8) - deficit_topology(8) = alpha s +
      beta with alpha's CI excluding 0 and residuals p-independent (prior
      0.10); an s-independent positive constant at some D in {5, 6, 7}
      (prior 0.15) reads as M2's constant term or M3. Decision resolution is
      one integer per s point; an interval spanning branches is unresolved.
    source: >-
      IDEA-20260903-cf63ad (S2)-(S4) and its P1-P4; KN-FIND-006 for the
      calibration integers; IDEA-20260830-cb8e46 for the s = 1 slice. Fixed
      on 2026-09-03 before any run; never adjusted afterward.
  scale_relevance:
    tier: toy
    justification: >-
      p <= 2^16, s <= 5 at D = 8, m = 3, d = 2; nothing at cryptographic
      scale and no extrapolation in s. p-independence at fixed s is the
      structural tell here and is separately calibrated by EXP-PFDR-fd901a.
    correspondence: 'none; direct computation at the tested primes'
  tail_checks:
    - >-
      The cell with the largest observed NULL-SUPPORT deficit over seeds,
      reported with its realised generator degrees and compared with the
      small-p rank-drop budget.
    - >-
      The maximum deviation of SEM deficit(8) across curves at fixed (s, p)
      against the null band (HEUR-002's tail check).
    - >-
      The largest cell (s = 5, D = 8) reported individually with its
      pre-flight counts and peak RSS.
  replication:
    seeds:
      - 'curve seeds 4101..4106 per prime (curve k uses 4100 + k)'
      - 'one planted target per curve, target seed 1 (a second target, seed 2, on the deciding cell only)'
      - 'null seeds 7, 11, 13, 17, 19 per (cell, arm)'
      - 'non-curve cubic seeds 51, 53, 59'
    independent_instances: >-
      6 curves per (s, p) x 3 primes x 3 s = 54 SEM cells at D = 8 (plus the
      D < 8 layers), 5 null seeds per null arm per cell. Justification: the
      deficit is an exact integer per cell; 6 independent curves per prime
      exceed the 3-curve minimum and give the curve-spread tell; 5 seeds
      bound each null's spread; three s points are the minimum for an
      affine fit with a slope CI, which is why the decision resolution is
      declared as one integer per point.
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 80
    maximum_memory_gb: 16
    maximum_runs: 60
    maximum_workers: 1
    notes: >-
      One run = one (s, p) cell over all curves, degrees and arms (9 main
      cells at s in {3, 4, 5}, 3 cells at s = 6 with D <= 6, the calibration
      and s = 1 runs), with re-runs. The (s = 5, D = 8) cell is 5310 x
      56751 per arm over F_p; sparse elimination is expected in minutes per
      arm, dense-equivalent about 2.4 GB, hence the 16 GB cap. Above the
      template floors.
  stages:
    - id: stage-0-derivation
      purpose: '(S2)-(S3) by hand; the degree-4 parts; the f^2 != f counterexample'
      dominant_operation: writing
      machine_compute: none required
    - id: stage-1-instrument
      purpose: 'free-variable extension; cumulative deficit; binary n = 12 calibration'
      dominant_operation: exact rank over GF(2) and F_p
      machine_compute: minutes
    - id: stage-2-s1-slice
      purpose: 'symbolic identity with cb8e46''s J; frozen fixture'
      dominant_operation: symbolic algebra and exact rank
      machine_compute: seconds
    - id: stage-3-separating-cells
      purpose: 'd = 2, s in {3, 4, 5}, three primes, D in {5..8}, all arms'
      dominant_operation: sparse exact rank over F_p on up to 56751 columns
      machine_compute: hours
    - id: stage-4-decay-checks
      purpose: 'p-ladder at s = 4; curve spread'
      dominant_operation: exact rank over F_p
      machine_compute: included in stage 3 cells
    - id: stage-5-analysis
      purpose: 'affine fit; M1 / M2 / M3 / unresolved'
      dominant_operation: writing
      machine_compute: none required
  stopping_rules:
    - >-
      Stop before Stage 2 if the binary calibration does not return 1 and
      31 with null 0; record the instrument finding.
    - >-
      Stop before Stage 3 if the s = 1 slice is not symbolically identical
      to cb8e46's J.
    - >-
      Stop Stage 3 at the deciding cell (s = 3, D = 8) if NULL-SUPPORT shows
      a nonzero deficit beyond the small-p budget on more than one seed;
      nothing else is read.
    - >-
      If SEM shows a nonzero deficit at the deciding cell, run the p-ladder
      and curve spread at s = 3 before advancing to s = 4.
    - >-
      Stop when all planned cells have a terminal state; no iteration or
      tuning.
  invalidation_rules:
    - >-
      A timeout, OOM or crash on any cell is failed_infrastructure and is
      never evidence about the deficit.
    - >-
      A run whose shared meter has not passed the p = 2 known answer under
      the cumulative convention and the planted-syzygy positive control in
      the same manifest lineage is invalid.
    - >-
      A planted target whose certificate fails invalidates the draw.
    - >-
      A deficit computed under a convention different from the calibration
      arm's, or a subset-column rank, invalidates the cell.
    - >-
      Any cell mixing arms with different frozen degree conventions is
      invalid.
  success_criterion: >-
    Decidable from the primary metrics: the calibration integers reproduce,
    the s = 1 slice is identical, NULL-SUPPORT is 0 at every cell within
    the budget, and the SEM residual vector at D = 8 over s in {3, 4, 5}
    falls into exactly one pre-registered branch. M1 (all residuals 0
    within spread, the EXPECTED branch) is a success of the control: the
    binary 8 dim V law is a characteristic-2 phenomenon at the tested cells
    and its import into RQ-PFDR-ae2fba's degree column is closed with the
    obstruction named (Frobenius-linearity of squaring and the Boolean
    idempotent law, both absent). M2 (slope CI excluding 0, p-independent,
    curve-independent) is a mechanism finding routed to independent review
    and to a solve-bit follow-up, never a cost finding. Neither changes any
    hypothesis status by itself.
  falsification_criterion: >-
    ANY of: F1 -- Stage 0 finds a degenerate subset-sum or an idempotent
    affine P (the derivation is wrong; the hypothesis is superseded); F2 --
    NULL-SUPPORT nonzero beyond the small-p budget (baseline or meter wrong;
    no twin value is read); F3 -- calibration miss (port broken); F6 --
    residuals constant in s or varying with p (artifact or M3, reported
    with the tell that fired); an unresolved interval spanning branches
    (reported as unresolved, not rounded). Each is a negative outcome
    decidable from the primary metrics.
  required_artifacts:
    - 'experiments/EXP-PFDR-20ee58/runs/<run-id>/manifest.yaml (command, commit, dirty-tree hash, environment, seeds, parameters, deficit convention, inference block, timing, peak RSS, per-file sha256)'
    - 'experiments/EXP-PFDR-20ee58/runs/<run-id>/raw-result.json (rows, ncols, rank, koszul, deficit per (cell, arm, curve, D); null degree distributions; sol(D); certificate results; pre-flight counts)'
    - 'experiments/EXP-PFDR-20ee58/runs/<run-id>/stdout.log and stderr.log'
    - 'experiments/EXP-PFDR-20ee58/stage0-derivation.md ((S2)-(S3) written out and checked by hand)'
    - 'experiments/EXP-PFDR-20ee58/stage2-s1-fixture.yaml (the symbolic identity with cb8e46''s J and the recorded graded ranks)'
    - 'experiments/EXP-PFDR-20ee58/analysis.md (deficit tables per arm, the affine fit with CI, p-ladder and curve-spread tables, branch declaration, aborted cells by name, verdict against the frozen criteria)'
  interpretation_limits:
    - >-
      No attack, no exponent, no security claim; a control between two
      mechanisms for a measured binary law.
    - >-
      A nonzero deficit is a generating-set property whose cost image is
      zero unless the solve bit flips (IDEA-20260806-7ea402); M1 closes the
      binary-import route, not KN-OPEN-002.
  id_allocation_provenance: >-
    EXP-PFDR-20ee58 pre-allocated by the tasking Coordinator in
    TASK-20260903-b5d2ae (fourth experiment id, in order). No state was
    scanned for a next free number.
  yaml_parse_disclosure: >-
    Written by the Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no duplicate
    keys to the author's reading. The orchestrator must run the strict parse
    and tools/validate_ledger.py before this contract is relied on.
