experiment:
  id: EXP-ECDLP-b8b15e
  hypothesis_id: H-ECDLP-debab1
  version: 1
  title: >-
    Verification protocol - score the committed internal-finding corpus on a
    five-test closure-promotion gate under a rubric frozen and hashed before any
    record is opened, with a six-record frozen strong/weak separation null, a
    five-variant redaction ladder in which exactly one test is removed at a time,
    a measured count of independent re-derivations, and one worked blind
    re-derivation demonstration
  status: draft
  status_note: >-
    DRAFT. Not review_required and not approved. Coordinator design freeze
    converting IDEA-20260808-8e13ff into a verification protocol under
    TASK-20260904-43152a. Not snapshot-committed, not independently reviewed, NO
    RUN AUTHORIZED. This contract creates no permission to promote anything and
    changes no record's status.
  objective: >-
    Measure the pass rate of the committed internal-finding corpus on each of
    five closure-durability tests, check that the gate separates records the
    corpus already treats as strong from those it treats as weak, count how many
    findings have received an independent re-derivation under an operational
    definition, and demonstrate that definition once. What artifact is checked
    (each committed internal-finding entry), against what reference (the hashed
    five-test rubric), and what result fails it (a test scoring 0 with the
    missing element named, or a not-applicable branch without a stated reason)
    are all fixed before any record is opened for scoring.
  inputs:
    scored_set: >-
      Every committed internal-finding entry present at run time. THE SET SIZE IS
      REPORTED AS A MEASURED FLOOR WITH THE ENUMERATION RULE STATED, never as an
      exact corpus count and never taken from the source proposal, per this
      repository's convention that a whole-corpus count asserts a floor.
    reference_rubric: >-
      Written and HASHED BEFORE ANY ENTRY IS OPENED, into results/rubric.md, with
      the exact textual condition under which each test scores 1. T1 NAMED
      OBSTRUCTION - one sentence which, if false, reopens the lane, stated as a
      property of the object; a COUNT of mechanisms tried scores 0 and never
      becomes 1 by being longer. T2 QUANTITATIVE FORM - the obstruction predicts
      a threshold, exponent, or equality rather than a direction; "blocked"
      scores 0, a stated inequality or equality scores 1. T3 NEARBY-OBJECT
      DISSOLUTION - a NAMED object on which the obstruction fails, together with
      the observation of whether the closure fails there too; a not-applicable
      branch requires a STATED REASON and is scored NA, not 1 and not 0, and NA
      counts are reported separately from passes. T4 ESCAPE CLAUSE - the exact
      quantity that would have to change for the lane to reopen. T5 MODEL AND
      RESOURCE SCOPE - the model the closure's force comes from and the resources
      it does NOT cover, taken from the corpus resource taxonomy, which the run
      must OPEN AND QUOTE before scoring T5 on any record.
    re_derivation_definition: >-
      A closure counts as RE-DERIVED only if a session that did not originate it
      was given the PREMISES and the CLAIM SHAPE but NOT the conclusion, derived
      the obstruction independently, and ran a bounded counterexample search at
      the stated boundary, with its report committed. Reviewed-and-not-objected-
      to does NOT count and is tallied separately as UNREFUTED.
  controls:
    - id: NULL-FROZEN-STRONGWEAK
      description: >-
        NAMED SEPARATION NULL, FROZEN AND HASHED BEFORE SCORING, CAN FAIL. Three
        records the corpus already treats as strong and three it treats as weak
        or superseded, selected and written to results/control_set.yaml with
        their hashes before any scoring begins. The gate must score every strong
        record strictly above every weak one.
      failure_meaning: >-
        Failure to separate means the gate measures something other than closure
        quality and EVERY corpus-wide count it produced is VOID. This is the
        two-directional instrument check and it is a real possible outcome.
    - id: CTRL-REDACTION-LADDER
      description: >-
        DEMONSTRATED DYNAMIC RANGE, PLANTED DEFECTS OF KNOWN SIZE. Take one
        record that scores 5 of 5 and produce FIVE redacted variants, each with
        exactly one of T1-T5 removed by deleting the specific sentences the
        rubric's condition for that test relies on. The gate must return exactly
        4 on each variant AND must name exactly the redacted test.
      failure_meaning: >-
        A variant scoring anything other than 4, or naming the wrong test, means
        the gate is not resolving the five tests independently and every score is
        VOID. This is what converts the gate from something that returns a number
        into an instrument with a demonstrated, localized response to a defect of
        known size and known location.
    - id: CTRL-CONTAINS-EXISTING-STANDARD
      description: >-
        The gate must CONTAIN the existing closure standard as a proper subset:
        every record that passes the existing named-obstruction and
        forward-guidance requirements must score 1 on T1 and 1 on T4. Checked on
        the frozen control set before the corpus is scored.
      failure_meaning: >-
        A gate that fails records the existing standard passes is not an
        extension of it but a replacement, and would make its corpus counts
        incomparable with the existing process.
    - id: CTRL-BLIND-SCORING
      description: >-
        The scorer is not told which records are in NULL-FROZEN-STRONGWEAK or
        which are redaction variants. Where that is impractical, both sets are at
        minimum frozen and hashed in advance and the scoring order is randomised
        from the declared seed.
      failure_meaning: >-
        A scorer that knows the expected answers is measuring its own
        expectations rather than the records.
    - id: CTRL-BLIND-REDERIVATION-DEMO
      description: >-
        ONE WORKED DEMONSTRATION OF THE REPLICATION DEFINITION. A non-originating
        session receives the premises and the claim shape of exactly one closure,
        WITHOUT the conclusion, and records what obstruction it reaches. The
        paths it may not read (the closure's own record, its report, its
        implementation) are named in the run manifest before it starts, and its
        report declares what it actually read.
      failure_meaning: >-
        Its output is recorded WHETHER OR NOT IT AGREES. A disagreement is the
        informative outcome and must not be discarded; it means that closure needs
        a superseding record.
    - id: CTRL-NONORIGINATING-SCORER
      description: >-
        Neither the scoring session nor the re-deriving session may have
        originated any record in the scored set, and each declares what it wrote.
      failure_meaning: >-
        An author scoring its own round has an obvious conflict; a scored set
        containing the scorer's own records is reported with those records
        excluded and the exclusion counted.
    - id: CTRL-CURRENT-STATUS-READ
      description: >-
        The status and next_action of the owning goal are read at run time and
        quoted verbatim. The design session found `status: completed` on
        2026-09-04, contradicting the source proposal's pause flag; the run must
        record the current value rather than inherit either reading.
      failure_meaning: >-
        Inheriting a stale gate would attach this work to a record state that no
        longer exists.
  independent_variables:
    - 'gate test, in {T1, T2, T3, T4, T5}'
    - 'record class, in {committed corpus entry, frozen strong control, frozen weak control, redaction variant}'
    - 'scorer session identity'
  metrics:
    primary:
      - >-
        per-record five-bit score with each test in {PASS, FAIL, NA}, the missing
        element named for every FAIL, the stated reason recorded for every NA,
        and the exact sentence relied on quoted for every PASS.
      - >-
        pass rate per test, T1 through T5, as a dimensionless fraction, with NA
        counts reported separately from the denominator and the denominator
        stated.
      - >-
        separation statistic on NULL-FROZEN-STRONGWEAK: minimum strong score
        minus maximum weak score, an integer in gate tests passed.
      - >-
        number of committed findings that have received an independent
        re-derivation under the operational definition, an integer, with the
        UNREFUTED tally reported separately.
      - >-
        scored-set size, an integer, REPORTED AS A MEASURED FLOOR with the
        enumeration rule stated.
    secondary:
      - 'CTRL-REDACTION-LADDER returned scores and named tests, five rows against five planted redactions.'
      - 'CTRL-CONTAINS-EXISTING-STANDARD result on each control record.'
      - 'the records where the gate score most disagrees with the corpus existing treatment, by name, in both directions.'
      - 'the blind re-derivation report, its declared sources_read, and whether its obstruction matches the committed one.'
      - 'rubric hash and the timestamp at which it was written, both preceding every score.'
  heuristic_under_test: HEUR-GATE-1
  preregistered_prediction:
    quantity: 'The five per-test pass rates and their ordering.'
    formula: >-
      No formula. Pre-registered: T1 pass rate above 0.9; T3 the LOWEST of the
      five and below 0.5; strict separation of the frozen strong and weak
      controls; a small, possibly zero, count of independent re-derivations. The
      ORDERING is the load-bearing prediction, not the numbers.
    source: >-
      IDEA-20260808-8e13ff's predictions block, with the corpus-size figure
      removed and replaced by a measured floor per this repository's convention.
  scale_relevance:
    tier: null
    justification: >-
      NO MEASUREMENT IS MADE AT ANY SCALE. This is a reading and scoring protocol
      producing facts about records. `tier` is null rather than `toy` because a
      scale label would falsely imply a measurement.
    correspondence: null
  tail_checks:
    - >-
      The individual records where the gate's score most disagrees with the
      corpus's existing treatment, reported BY NAME and in BOTH directions,
      rather than only the separation statistic. Those are where the gate is
      either wrong or informative, and both need to be visible.
    - >-
      Every T3 NA branch is listed individually with its stated reason, because
      the NA branch is the obvious place for scores to be inflated.
    - >-
      The record with the largest gap between its T1 score and its T2 score,
      since a named obstruction without a quantitative form is the specific
      failure the gate exists to catch.
  replication:
    seeds:
      - 'RUN-ECDLP-b8b15e-1 (write and hash the rubric; freeze the control set; build and score the redaction ladder): master seed 20260904081'
      - 'RUN-ECDLP-b8b15e-2 (score the committed corpus; re-derivation census; current-status read): master seed 20260904082'
      - 'RUN-ECDLP-b8b15e-3 (blind re-derivation demonstration by a non-originating session): master seed 20260904083'
    independent_instances: 6
    replication_note: >-
      SEEDS POLICY. The only randomness is the SCORING ORDER, drawn from the
      declared master seed so a scorer cannot infer control membership from
      position; the derived order is recorded in each manifest. The rubric hash
      is recorded in all three manifests to prove the same instrument was used.
      `independent_instances: 6` is the frozen control set size. RUN-3's
      blind_from path list is fixed in its manifest BEFORE it starts and its
      report declares what it actually read, so the blindness is checkable rather
      than promised. No seed or rubric may change after RUN-1; a changed rubric
      is a NEW contract.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 3
    budget_feasibility_note: >-
      Zero compute; the cost is reading and one short re-derivation session.
      Wall clock and memory are at the template floors and are not the binding
      constraint. The binding constraint is the size of the committed corpus,
      which the run reports and which bounds RUN-2 - if it cannot be scored
      within the cap, the run stops and names the unscored entries.
  stopping_rules:
    - >-
      ST-0 RUBRIC GATE. No record may be scored until results/rubric.md exists
      and its hash is recorded, and until the T5 resource taxonomy - the R1-R8
      table of analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md
      section 2 - has been re-quoted into results/t5_taxonomy.md with its
      artefact path and content hash.
    - >-
      ST-1 PER-RUN CAP. 600 seconds per run; on approaching the cap the run STOPS
      and names every entry not scored. A partial score table with a named gap is
      a result and its denominator is stated.
    - >-
      ST-2 STOP AND REPORT ON AMBIGUITY. A record whose text does not resolve a
      test's condition either way is scored AMBIGUOUS with the text quoted, never
      resolved by inference and never silently scored FAIL.
    - >-
      ST-3 NO INTERPRETATION AND NO PROMOTION. The run package emits the score
      table, the pass rates, the re-derivation census and the demonstration
      report. It must NOT promote or demote any record, must not create or edit
      any KN-FIND entry, must not propose a template change as an action, and
      must not write an evidence or decision record.
    - >-
      ST-4 NO RETRO-DEMOTION. Retro-scoring output is labelled DIAGNOSTIC on
      every row. A low score on an older record measures the template of its era,
      and the report must say so on the row, not only in a preamble.
  invalidation_rules:
    - >-
      INV-SEPARATION. NULL-FROZEN-STRONGWEAK does not separate: every
      corpus-wide count is VOID.
    - >-
      INV-LADDER. CTRL-REDACTION-LADDER does not return exactly 4 with exactly
      the redacted test named on each of the five variants: every score is VOID.
    - >-
      INV-SUBSET. CTRL-CONTAINS-EXISTING-STANDARD fails on any control record:
      the gate is not an extension of the existing standard and its counts are
      not comparable with it.
    - >-
      INV-RUBRIC-DRIFT. The rubric hash differs between runs: the runs did not
      use the same instrument and are not comparable.
    - >-
      INV-CONFLICT. The scoring session originated a record in the scored set and
      that record was not excluded: INVALID for that record.
    - >-
      INV-BLINDNESS. The re-deriving session read any path in its declared
      blind_from list: the demonstration is VOID, and this is reported rather
      than repeated with a different session.
    - >-
      INV-INFRASTRUCTURE. A missing or unreadable record is recorded with its
      terminal status and IS INFRASTRUCTURE SIGNAL, never a gate failure of that
      record.
  success_criterion: >-
    S1. The rubric and the T5 taxonomy are frozen and quoted before any scoring;
    NULL-FROZEN-STRONGWEAK separates strictly; CTRL-REDACTION-LADDER returns
    exactly 4 with the correct test named on all five variants;
    CTRL-CONTAINS-EXISTING-STANDARD passes; and the five pass rates, the
    re-derivation count and the scored-set floor are emitted with every FAIL
    naming its missing element and every NA carrying a stated reason. S1 MET
    means the gate's readings are admissible as facts about what the committed
    records contain. IT MAKES NO CLOSURE TRUE OR FALSE, RAISES NO EVIDENCE TIER,
    AND SAYS NOTHING ABOUT ANY ELLIPTIC CURVE.
  falsification_criterion: >-
    F1. T3's pass rate is NOT the lowest of the five. The gate's central
    prediction in H-ECDLP-debab1 is falsified and the record says so. F2. Every
    committed entry passes all five tests under a gate that also separates the
    controls: the gate is not discriminating and should be DISCARDED rather than
    adopted - a real possible outcome and good news. F3. The blind re-derivation
    reaches a DIFFERENT obstruction for a closure the corpus treats as settled:
    that closure needs a superseding record and the replication definition has
    justified itself in one instance. F4, VOIDING RATHER THAN FALSIFYING: any
    invalidation rule fires. F5, DECLARED IN ADVANCE AND BINDING UNDER EVERY
    OUTCOME: no output of this experiment may be quoted as a statement about
    elliptic curves or the ECDLP, and no output may be used to demote a committed
    record.
  required_artifacts:
    - experiments/EXP-ECDLP-b8b15e/results/rubric.md
    - experiments/EXP-ECDLP-b8b15e/results/rubric_hash.txt
    - experiments/EXP-ECDLP-b8b15e/results/t5_taxonomy.md
    - experiments/EXP-ECDLP-b8b15e/results/control_set.yaml
    - experiments/EXP-ECDLP-b8b15e/results/redaction_variants/
    - experiments/EXP-ECDLP-b8b15e/results/score_table.json
    - experiments/EXP-ECDLP-b8b15e/results/pass_rates.json
    - experiments/EXP-ECDLP-b8b15e/results/rederivation_census.json
    - experiments/EXP-ECDLP-b8b15e/results/goal_status_verbatim.md
    - experiments/EXP-ECDLP-b8b15e/results/summary.json
    - experiments/EXP-ECDLP-b8b15e/runs/RUN-ECDLP-b8b15e-1/manifest.yaml
    - experiments/EXP-ECDLP-b8b15e/runs/RUN-ECDLP-b8b15e-1/results.json
    - experiments/EXP-ECDLP-b8b15e/runs/RUN-ECDLP-b8b15e-1/stdout.log
    - experiments/EXP-ECDLP-b8b15e/runs/RUN-ECDLP-b8b15e-2/manifest.yaml
    - experiments/EXP-ECDLP-b8b15e/runs/RUN-ECDLP-b8b15e-2/results.json
    - experiments/EXP-ECDLP-b8b15e/runs/RUN-ECDLP-b8b15e-2/stdout.log
    - experiments/EXP-ECDLP-b8b15e/runs/RUN-ECDLP-b8b15e-3/manifest.yaml
    - experiments/EXP-ECDLP-b8b15e/runs/RUN-ECDLP-b8b15e-3/results.json
    - experiments/EXP-ECDLP-b8b15e/runs/RUN-ECDLP-b8b15e-3/stdout.log
  required_artifacts_note: >-
    results/rubric.md and rubric_hash.txt must exist and be recorded in RUN-1's
    manifest before any record is scored, and the same hash appears in RUN-2 and
    RUN-3. redaction_variants/ holds the five variants with a sidecar declaring
    which test each removed, written before scoring. RUN-3's manifest carries its
    blind_from path list, fixed before it starts, and its report carries the
    paths it actually read.
  run_plan:
    - id: RUN-ECDLP-b8b15e-1
      description: 'write and hash the rubric; quote the T5 taxonomy; freeze the control set; build and score CTRL-REDACTION-LADDER and CTRL-CONTAINS-EXISTING-STANDARD'
    - id: RUN-ECDLP-b8b15e-2
      description: 'score the committed internal-finding corpus; re-derivation census with UNREFUTED tallied separately; current goal status read'
    - id: RUN-ECDLP-b8b15e-3
      description: 'blind re-derivation demonstration on one closure by a non-originating session, with a declared blind_from list'
  provenance:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    independent_session: false
    independent_review_status: 'NOT YET REQUESTED. Contract is at `draft`.'
    design_session_verification_note: >-
      The Coordinator subagent that wrote this contract read the
      completion_criteria, status and next_action fields of
      ledger/goals/GOAL-FIND-001.yaml by pattern search on 2026-09-04. It
      CONFIRMS the source proposal's quotation of the completion criterion
      verbatim, and CONTRADICTS the proposal's pause flag: the record reads
      `status: completed`. It read AGENTS.md's inventor-protocol section in full.
      EXTENDED READ, 2026-09-04: it subsequently opened
      analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md section 2 and
      CONFIRMS the T5 resource taxonomy is the R1-R8 table there, as
      IDEA-20260808-8e13ff characterises it, with a "Why it escapes the GGM"
      column that is what makes T5 non-vacuous. RUN-1 still re-quotes and hashes
      it so the T5 scores bind to a recorded version rather than to a location.
      It did NOT open docs/inventor-protocol.md, any KN-FIND entry, or any of the
      decisions the proposal cites; those remain scheduled for RUN-1 and RUN-2
      and are not asserted here. The proposal's figure of 57 committed entries is
      NOT adopted; the count is reported as a measured floor.
  source_refs:
    - ledger/hypotheses/H-ECDLP-debab1.yaml
    - ledger/proposals/IDEA-20260808-8e13ff.yaml
    - ledger/goals/GOAL-FIND-001.yaml
    - ledger/questions/RQ-FIND-001.yaml
    - AGENTS.md
    - docs/inventor-protocol.md
    - docs/claims-and-verification.md
  assigned_to: executor
  approved_by: null
