# =============================================================================
# EXP-BINSTD-6fd454 -- VERSION 1 (APPROVED by DEC-20261003-efb053) frozen
# contract for H-BINSTD-c16539: independent replication of
# EV-BINSTD-d3a6be / EXP-BINSTD-871156 under a second diversity catalog seed
# 202610039715 and independent twin meters. Source IDEA-20261003-43f871 /
# RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001. NOT a re-run of EXP-BINSTD-871156.
#
# Stages 0-1 authorized. Zero runs at design freeze. No AUXIN. Amazon
# Bedrock prohibited. NO break. NO attack. NO exponent. Stage 2 unauthorized.
# =============================================================================
experiment:
  id: EXP-BINSTD-6fd454
  hypothesis_id: H-BINSTD-c16539
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261003-43f871
  goal_id: GOAL-ECDLP2M-001
  predecessor_experiment_id: EXP-BINSTD-871156
  predecessor_evidence_id: EV-BINSTD-d3a6be
  predecessor_decision_id: DEC-20261003-963219
  version: 1
  title: >-
    Independent replication: second seed + independent meters test
    Spearman ρ(r_Tr, N_nl) ≤ −0.70 on n=17 toys (not a re-run of EXP-BINSTD-871156)
  status: approved
  approved_by: DEC-20261003-efb053
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261003-efb053 under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    ECC2K-130 solve. No n>=131 attack. Do not re-run EXP-BINSTD-871156 (seed 202610038196) or v1.
    Stage 2 not authorized here.
  approval:
    approved_by: DEC-20261003-efb053
    composing_decision: DEC-20261003-efb053
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized. Cites
      EV-BINSTD-d3a6be / DEC-20261003-963219 NA-2.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes rank-diversity-seeking V catalogs (≥24, ≤128), Spearman
      band −0.70, new seeds, encoder pin, twin probes, Stage-1 pre-screen.
      Stage 1 runs n=17 ℓ∈{3,4} with twin meters; FORALL admission floors
      before package band; RESULTS.md with exactly one O-* label.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    After EV-BINSTD-d3a6be, decide whether a rank-diversity-seeking catalog
    meets FORALL admission floors (esp. ≥3 distinct r_Tr on (17,4)) and then
    whether Spearman ρ(r_Tr, N_nl) ≤ −0.70 on Stage-1 cells. Deliver exactly
    one O-* label from H-BINSTD-c16539.

  class: heuristic_validation
  class_note: >-
    Pre-registered Spearman band on an encoding-structure instrument with
    catalog-power repair after EV-BINSTD-d3a6be. Not an exponent-moving
    breakthrough; no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Rank-diversity-seeking freeze (≥24, ≤128 shapes; shifted
        poly, geo, twists, coordinate ℓ-subsets, random expanders) for
        (n,ℓ)∈{17,19,23}×{3,4}; freeze preregistered-predictions.json
        (band −0.70, seeds 202610039715/202610039716, admission gates,
        encoder pin); twin self-check; Stage-1 cells pre-screen.
      - >-
        Stage 1. For (n,ℓ)∈{(17,3),(17,4)} measure twin r_Tr and twin N_nl;
        FORALL ADMISSION GATE (≥3 distinct r_Tr, ≥2 distinct N_nl) before
        Spearman band; write panels/control-table/RESULTS.md.
    excluded:
      - Re-running EXP-BINSTD-871156 (seed 202610038196) or v1 seed 202610038782.
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Stage-2 n=19,23 panels and shuffled-linear null under this card.
      - Editing IDEA claim text or GOAL-ECDLP2M-001.yaml.
      - Editing the −0.70 band after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.
      - Reading package O-SUPPORT/O-FAIL-BAND without FORALL admission floors.
      - Inventing O-FAIL-BAND from floors-unmet (prefer O-INCONCLUSIVE → ℓ-scoped HEUR).

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-6fd454/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-6fd454/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-6fd454/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-6fd454/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-6fd454/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. implementation/run.py +
      check.py + gf2n.py + product_space.py + encode_s3.py are the
      hash-bound sources. Twin meters are the dual-implementation control.
      {run_dir} is substituted by the process supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261003-43f871.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-c16539.yaml
    predecessor_evidence: ledger/evidence/EV-BINSTD-d3a6be.yaml
    spearman_band: -0.70
    catalog_seed: 202610039715
    forbidden_parent_seed: 202610038196
    forbidden_v1_seed: 202610038782
    min_catalog: 24
    max_catalog: 128
    stage1_cells:
      - {n: 17, ell: 3}
      - {n: 17, ell: 4}

  controls:
    - name: twin_rTr_Nnl
      definition: >-
        encode_s3 r_Tr and N_nl path A == path B on every measured V.
    - name: ctl_fixed_dim_V
      definition: Every Stage-1 V has exactly ℓ basis elements (dim ℓ).
    - name: ctl_frozen_V_catalog
      definition: Catalog frozen in stage0/v-catalog.json before Stage 1 (≥24 shapes).
    - name: ctl_admission_floors_before_band
      definition: ≥3 distinct r_Tr and ≥2 distinct N_nl required before band reading.
    - name: ctl_shared_xorsat_pin
      definition: Encoder pin frozen in preregistered-predictions.json.
    - name: ctl_frozen_spearman_band_before_runs
      definition: Spearman band −0.70 frozen before Stage 1.
    - name: ctl_no_posthoc_band_edit
      definition: Band constant not edited after Stage-0 freeze.
    - name: ctl_not_prior_catalog_rerun
      definition: catalog_seed ∉ {202610038196, 202610038782}; check.py refuses prior seeds.
    - name: null_shuffled_linear_block_rank
      definition: >-
        Stage 2 only (NOT AUTHORIZED). Named so the Stage-1 reading cannot
        silently claim the null.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_spearman_n17]
    - name: cell
      levels: ['(17,3)', '(17,4)']

  metrics:
    primary:
      - name: spearman_rTr_vs_Nnl
        unit: dimensionless
        definition: Spearman ρ(r_Tr, N_nl) across the frozen rank-diverse catalog after floors.
      - name: floors_met
        unit: boolean
        definition: distinct_rTr≥3 and distinct_Nnl≥2 on the cell.
      - name: band_holds
        unit: boolean
        definition: floors_met and spearman_rTr_vs_Nnl ≤ −0.70.
      - name: twin_agreement
        unit: boolean
        definition: Twin r_Tr and N_nl meters agree on every measured V.
    secondary:
      - name: r_Tr
        unit: integer
      - name: N_nl
        unit: integer
      - name: distinct_rTr
        unit: integer
      - name: distinct_Nnl
        unit: integer
      - name: catalog_size
        unit: integer
      - name: bootstrap_ci_95
        unit: interval
      - name: wall_clock_seconds
        unit: seconds

  heuristic_under_test: HEUR-BINSTD-878222-H1

  preregistered_prediction:
    quantity: >-
      After admission floors, Spearman ρ(r_Tr, N_nl) ≤ −0.70 on each Stage-1
      cell under the frozen rank-diversity-seeking catalog.
    formula: >-
      r_Tr = F_2-rank of Trace pure-linear block; N_nl = count of nonlinear
      clauses retaining a non-pivot variable after Trace-linear elimination;
      floors = (distinct_rTr>=3 and distinct_Nnl>=2); rho = Spearman(r_Tr, N_nl);
      band holds iff floors and rho <= -0.70.
    source: >-
      ledger/proposals/IDEA-20261003-43f871.yaml predictions; EV-BINSTD-d3a6be
      floor failure; frozen before Stage 1 in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Encoding-structure instrument on n=17 only under this card. No transfer
      of a Spearman band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids band claims (O-ARTIFACT).
    - Floors unmet → O-INCONCLUSIVE (not O-SUPPORT / not invent O-FAIL-BAND).
    - Forbidden v1 seed → O-ARTIFACT.
    - Bootstrap CI reported beside point estimate; band decision uses point ρ after floors.

  seeds_and_replication:
    catalog_seed: 202610039715
    bootstrap_seed: 202610039716
    independent_instances: 2
    note: >-
      Cells (17,3) and (17,4) are independent instances. Twin meters are the
      replication instrument for each V. Not a re-run of EXP-BINSTD-871156 seed 202610038196 or v1 202610038782.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and v-catalog.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-BINSTD-c16539.
    - maximum_runs = 4.
    - Do not open Stage-2 under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure → O-ARTIFACT; do not read band as support.
    - Re-using parent seed 202610038196 or v1 seed 202610038782 → O-ARTIFACT / protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok true on probes and catalog_seed ≠
    v1; Stage 1 produces admission-gated Spearman ρ(r_Tr, N_nl) vs ≤−0.70
    band for each Stage-1 cell with twin agreement (or a named
    O-ARTIFACT/O-IMPEDIMENT/O-INCONCLUSIVE stop); RESULTS.md names exactly
    one O-* label from H-BINSTD-c16539 with cited artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; post-hoc Spearman-band edit; v1 seed reuse;
    a claimed break/exponent under this card. (O-FAIL-BAND is a valid
    scientific negative of O-SUPPORT after floors, not a protocol fail.)

  required_artifacts:
    - experiments/EXP-BINSTD-6fd454/trial-plan-v1.json
    - experiments/EXP-BINSTD-6fd454/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-6fd454/stage0/v-catalog.json
    - experiments/EXP-BINSTD-6fd454/stage1/
    - experiments/EXP-BINSTD-6fd454/RESULTS.md
    - experiments/EXP-BINSTD-6fd454/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-6fd454/implementation/run.py
    - experiments/EXP-BINSTD-6fd454/implementation/check.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
