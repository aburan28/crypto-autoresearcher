<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>EXP-ECDLP-422afc: decomposing fraction vs preregistered band (RUN-ECDLP-06bb83, EV-ECDLP-9d41e7)</title>
  <rect x="0" y="0" width="640" height="470" fill="#ffffff"/>
  <!-- preregistered band [0.25, 0.75]: y = 340 - 375 f -->
  <rect x="80" y="58.75" width="520" height="187.5" fill="#d9f0d3" stroke="none"/>
  <text x="595" y="74" text-anchor="end" fill="#2d6a2d">preregistered success band [0.25, 0.75]</text>
  <!-- formula 1/2 -->
  <line x1="80" y1="152.5" x2="600" y2="152.5" stroke="#2d6a2d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="595" y="147" text-anchor="end" fill="#2d6a2d">p^(m beta - 1)/m! = 1/2</text>
  <!-- axes -->
  <line x1="80" y1="340" x2="600" y2="340" stroke="#000"/>
  <line x1="80" y1="40" x2="80" y2="340" stroke="#000"/>
  <g text-anchor="end">
    <text x="72" y="344">0.0</text>
    <text x="72" y="306.5">0.1</text>
    <text x="72" y="269">0.2</text>
    <text x="72" y="231.5">0.3</text>
    <text x="72" y="194">0.4</text>
    <text x="72" y="156.5">0.5</text>
    <text x="72" y="119">0.6</text>
    <text x="72" y="81.5">0.7</text>
    <text x="72" y="44">0.8</text>
  </g>
  <g stroke="#000">
    <line x1="76" y1="340" x2="80" y2="340"/><line x1="76" y1="302.5" x2="80" y2="302.5"/>
    <line x1="76" y1="265" x2="80" y2="265"/><line x1="76" y1="227.5" x2="80" y2="227.5"/>
    <line x1="76" y1="190" x2="80" y2="190"/><line x1="76" y1="152.5" x2="80" y2="152.5"/>
    <line x1="76" y1="115" x2="80" y2="115"/><line x1="76" y1="77.5" x2="80" y2="77.5"/>
    <line x1="76" y1="40" x2="80" y2="40"/>
  </g>
  <text x="22" y="190" transform="rotate(-90 22 190)" text-anchor="middle">fraction of x in F_p that decompose (dimensionless)</text>
  <g text-anchor="middle">
    <text x="190" y="358">p = 101 (|F| = 5)</text>
    <text x="340" y="358">p = 211 (|F| = 6)</text>
    <text x="490" y="358">p = 307 (|F| = 9)</text>
    <text x="340" y="376">prime (frozen list; one deterministic pass each, n = 1, exact counts)</text>
  </g>
  <!-- derived upper bound |F|(|F|-1)/p -->
  <g stroke="#c0392b" stroke-width="3">
    <line x1="150" y1="265.74" x2="230" y2="265.74"/>
    <line x1="300" y1="286.68" x2="380" y2="286.68"/>
    <line x1="450" y1="252.05" x2="530" y2="252.05"/>
  </g>
  <!-- measured fraction (RUN-ECDLP-06bb83, unpublished) -->
  <g fill="#000">
    <circle cx="180" cy="276.88" r="5"/>
    <circle cx="330" cy="290.24" r="5"/>
    <circle cx="480" cy="265.49" r="5"/>
  </g>
  <!-- post-hoc Poisson model (not preregistered) -->
  <g fill="none" stroke="#7f7f7f" stroke-width="1.5">
    <path d="M204,272.68 L210,278.68 L204,284.68 L198,278.68 Z"/>
    <path d="M354,287.60 L360,293.60 L354,299.60 L348,293.60 Z"/>
    <path d="M504,263.80 L510,269.80 L504,275.80 L498,269.80 Z"/>
  </g>
  <!-- legend -->
  <g font-size="10">
    <rect x="80" y="392" width="520" height="70" fill="#ffffff" stroke="#999"/>
    <circle cx="96" cy="408" r="5" fill="#000"/>
    <text x="108" y="412">measured fraction c(p)/p: 0.168, 0.133, 0.199 (RUN-ECDLP-06bb83, working tree, unpublished)</text>
    <line x1="86" y1="426" x2="106" y2="426" stroke="#c0392b" stroke-width="3"/>
    <text x="112" y="430">derived exact ceiling |F|(|F|-1)/p: 0.198, 0.142, 0.235 (EV-ECDLP-9d41e7 D1-D3)</text>
    <path d="M96,439 L102,445 L96,451 L90,445 Z" fill="none" stroke="#7f7f7f" stroke-width="1.5"/>
    <text x="108" y="449">post-hoc Poisson model, NOT preregistered: 0.164, 0.124, 0.187</text>
  </g>
</svg>
