# EXP-ECDLP-422afc
# Stage-0 decomposition fraction for H-ECDLP-a1fc69.
# Frozen before the official run.
experiment:
  id: EXP-ECDLP-422afc
  hypothesis_id: H-ECDLP-a1fc69
  source_idea: IDEA-20261009-f24f8a
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  version: 1
  title: >-
    Enumeration fraction for m=2, beta=1/2 on y^2 = x^3 + x + 1
  status: approved
  frozen: true
  designed_at: '2026-10-12'
  approved_by: coordinator
  approval_decision_id: DEC-20261012-a0ba67
  execution_authorized: true
  objective: >-
    For each frozen prime, enumerate unordered pairs from the size
    factor base and count how many x-coordinates in F_p satisfy
    Semaev S3 with at least one pair. Compare the fraction to 1/2.
    Do not fit an exponent and do not claim an index-calculus speedup.
  inputs:
    curve: "y^2 = x^3 + x + 1"
    primes: [101, 211, 307]
    m: 2
    beta: 0.5
    factor_base: >-
      x in 0 .. floor(sqrt(p))-1 for which x^3 + x + 1 is a square in F_p.
      The point representative uses the least nonnegative square root.
    pairs: unordered pairs with x1 < x2
    formula: "p^(m*beta - 1) / m! = 1/2"
    tolerance: 0.25
    named_future_run_slot: RUN-ECDLP-06bb83
  controls:
    - >-
      Planted sum: the first two factor-base points in increasing x,
      added by the chord-and-tangent law, must give S3 = 0. Failure
      invalidates the cell.
    - >-
      The same S3 polynomial is evaluated by the driver and again by
      the checker on that planted triple.
  independent_variables:
    - prime, from the frozen list, not chosen after a fraction
  metrics:
    primary:
      - fraction
      - abs_error
    secondary:
      - factor_base_size
      - pair_checks_per_target
      - decomposing_count
      - planted_s3_zero
  heuristic_under_test: >-
    IDEA-20261009-f24f8a reproduction check: the enumeration baseline
    reproduces the decomposition fraction p^{m beta - 1} / m!.
  preregistered_prediction:
    quantity: >-
      fraction = (number of x in F_p with some factor-base pair
      satisfying S3) / p. abs_error = |fraction - 1/2|.
    formula: >-
      Every abs_error is at most 0.25. The negative reading is every
      abs_error strictly above 0.25, with the planted identity holding.
    source: >-
      IDEA-20261009-f24f8a required metric for the decomposition
      fraction. The band 0.25 was fixed for these three toy primes
      before the fractions were computed. It is not an exponent.
  scale_relevance:
    tier: toy
    justification: >-
      Three primes through 307 and only the m = 2, beta = 1/2
      enumeration cell. No transfer to 2^20 or to a Groebner solver.
    correspondence: null
  tail_checks:
    - >-
      Pair checks per target equal |F|*(|F|-1)/2. A different count
      means the scan was not the full unordered enumeration.
    - >-
      A prime with factor_base_size below 2 invalidates the cell.
  replication:
    seeds: []
    independent_instances: 3
    named_future_run_slot: RUN-ECDLP-06bb83
    replication_note: >-
      One deterministic sweep of three primes. The idea's seeds are
      not used because no random sample is drawn.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one valid manifest for RUN-ECDLP-06bb83.
    - Do not add a prime, a beta, an m, or a solver in this contract.
    - A table that meets neither criterion is the recorded result. Do not change 0.25.
  invalidation_rules:
    - The planted sum does not satisfy S3 = 0.
    - A prime, curve, m, or beta differs from this specification.
    - The factor base has fewer than two points.
    - A timeout, crash, or partial cell table.
  success_criterion: >-
    The manifest is valid, planted_s3_zero is true on every cell, and
    every abs_error is at most 0.25.
  falsification_criterion: >-
    The manifest is valid, planted_s3_zero is true on every cell, and
    every abs_error is strictly above 0.25.
  decision_impact:
    on_positive: >-
      Record that the m = 2, beta = 1/2 enumeration fraction sits
      within 0.25 of 1/2 at these three primes. Do not fit an exponent
      and do not schedule SAT or Groebner from this pass alone.
    on_negative: >-
      Record that every prime misses the band. Do not treat that as an
      exponent below 0.9. A later contract may ask whether the same
      formula holds at one larger prime with the same m and beta.
  required_artifacts:
    - experiments/EXP-ECDLP-422afc/runs/RUN-ECDLP-06bb83/manifest.yaml
    - experiments/EXP-ECDLP-422afc/runs/RUN-ECDLP-06bb83/raw-result.json
  assigned_to: executor
  launcher:
    trial_plan: experiments/EXP-ECDLP-422afc/trial-plan.json
    driver: experiments/EXP-ECDLP-422afc/implementation/run.py
    checker: experiments/EXP-ECDLP-422afc/implementation/check.py
  out_of_scope:
    - m = 3, beta other than 1/2, SAT, Groebner, Coppersmith, and any exponent fit.
    - Primes outside 101, 211, and 307.
    - Any deployed curve, any private key, and any claim of a cost below p^{1/2}.
