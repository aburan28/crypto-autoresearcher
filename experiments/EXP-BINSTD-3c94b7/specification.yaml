# EXP-BINSTD-3c94b7
# Two-bit basis-substitution arithmetic. No 131-bit basis.
# Approved by DEC-20261002-814b0a.
experiment:
  id: EXP-BINSTD-3c94b7
  hypothesis_id: H-BINSTD-dce30c
  source_idea: IDEA-20260922-99294c
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Two-bit basis-substitution arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-814b0a
  objective: >-
    Check the trial remainders of 131, the weight of the named
    polynomial, and the two-bit images of one monomial.
  inputs:
    n: 131
    trial_primes: [2, 3, 5, 7, 11]
    remainders: [1, 2, 1, 5, 10]
    trial_square: 121
    next_square: 144
    exponents: [131, 13, 2, 1, 0]
    weight: 5
    rejected_weight: 3
    original_degree: 2
    original_terms: 1
    det_invertible: 1
    det_singular: 0
    invertible_poly_degree: 2
    invertible_poly_terms: 2
    invertible_bool_degree: 2
    invertible_bool_terms: 2
    singular_poly_degree: 2
    singular_poly_terms: 1
    singular_bool_degree: 1
    singular_bool_terms: 1
  controls:
    - >-
      The remainders are 1, 2, 1, 5 and 10, and 12^2 is 144. Reporting
      131 as composite invalidates the run.
    - >-
      The named exponents have weight 5. Reporting the weight as 3
      invalidates the run.
    - >-
      The invertible Boolean image is y0 + y0*y1, degree 2, two terms.
      Reporting one term, or a degree above 2, invalidates the run.
    - >-
      The singular Boolean image is y0, degree 1. Reporting that degree
      as 2 invalidates the run.
    - >-
      The polynomial-ring singular image is y0^2, degree 2. Reporting
      that degree as 1 invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {trial, images}
    - route in {products, determinants}
  metrics:
    primary:
      - invertible_bool_terms
      - invertible_bool_degree
      - implementations_agree
    secondary:
      - weight
      - singular_bool_degree
      - singular_poly_degree
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The invertible Boolean image has two terms and degree 2.
    formula: >-
      x0 = y0 and x1 = y0 + y1. The product is y0^2 + y0*y1 in the
      polynomial ring. The Boolean rule y0^2 = y0 leaves y0 + y0*y1.
      The singular pair x0 = y0 and x1 = y0 leaves y0^2 in the
      polynomial ring and y0 after the Boolean rule.
    source: >-
      IDEA-20260922-99294c states the pentanomial and the degree claim,
      read 2026-10-02. The products and the trial were computed in this
      design session. That computation is not a run. No basis was built.
  scale_relevance:
    tier: toy
    justification: One monomial and two matrices of size 2. No transfer to n = 131.
    correspondence: null
  tail_checks:
    - The polynomial-ring singular degree 2 is required. A check that applies the Boolean rule in that ring is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the invertible Boolean term count is not 2, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - 131 is reported as composite.
    - The weight is reported as 3.
    - The invertible degree is reported as above 2.
    - The invertible Boolean image is reported as one term.
    - The singular Boolean degree is reported as 2.
    - The polynomial-ring singular degree is reported as 1.
    - A 131-bit basis is built or a solver is run.
  success_criterion: >-
    Both runs agree that the remainders are 1, 2, 1, 5 and 10, that
    the weight is 5, that the invertible Boolean image is y0 + y0*y1
    with degree 2 and two terms, and that the singular Boolean image
    is y0 with degree 1.
  falsification_criterion: >-
    The runs agree, 131 stays prime, the weight stays 5, and the
    invertible Boolean image is not two terms of degree 2.
  required_artifacts:
    - experiments/EXP-BINSTD-3c94b7/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-3c94b7/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-3c94b7/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-3c94b7/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-3c94b7/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-3c94b7/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any 131-bit basis, normal basis, or field construction.
    - Any solver, Groebner run, or measured solving degree.
    - Any claim that sparsity moves an exponent at n = 131.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
