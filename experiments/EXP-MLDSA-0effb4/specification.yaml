experiment:
  id: EXP-MLDSA-0effb4
  hypothesis_id: H-MLDSA-0a1d86
  derived_from_idea: IDEA-20260821-60ba98
  question_id: RQ-MLDSA-ffa0f5
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Per-predicate rejection-rate census and total-variation identity check for a non-conforming
    ML-DSA signer - a positive arm with a derived non-zero forced value, two null arms with forced
    value zero, a graded sweep with interior points, per-key dispersion over 32 keys, and a crossover
    table whose every cell is labelled measured, derived or theorem
  objective: >-
    The one uncertainty a run reduces is what a signer that skips a signing-only rejection check
    actually leaks, stated as a named term rather than as an open question. The identity that answers
    it is a theorem, so the empirical content is the RATE and the instrument's ability to measure it.
    A run establishes (i) whether the estimator has power, by requiring it to recover the derived
    non-zero forced value on a signer that omits the first-stage conjunction - an estimator that
    cannot recover a distance of that size can certify nothing about a vanishing one; (ii) the
    estimator's finite-sample floor, from two conforming signers under the same key with different
    seeds, which decides how small a rate is reportable at all; (iii) the structural null, from a
    signer omitting a predicate derived to be unreachable at two parameter sets, where the forced
    value is zero AND the transcripts must be byte-identical; (iv) the per-predicate rate census -
    marginal, conditional and attributed-first-failure rates with confidence intervals, and every
    zero count reported as an upper bound with its sample size; and (v) the crossover table, one over
    the rate per predicate per parameter set, each cell labelled measured, derived-under-a-heuristic,
    or theorem.
    NOT A BREAK, NOT A FORGERY, NOT A WEAKNESS IN ML-DSA AS STANDARDIZED. Every signature is produced
    by a party holding the signing key. Nothing bears on the underlying lattice problems in any
    direction. Timing, power, electromagnetic and memory channels are out of scope entirely.
  what_this_is_not:
    - >-
      Not an attack, a forgery, a key-recovery result, or a statement that ML-DSA as standardized is
      weak. Every object is emitted by a party holding the signing key.
    - >-
      Not a side-channel experiment. Timing, power, emissions, memory and the attempt count are out
      of scope and belong to a different goal.
    - >-
      Not a claim that any quantity is or is not recovered. The named term bounds an advantage
      difference; it is never restated as a recovery claim in either direction.
    - >-
      Not a novelty claim. The identity is elementary and may already appear in the rejection-sampling
      literature; if it does, this is a rediscovery and is reported as one.
    - >-
      Not a status change to any hypothesis, evidence record, decision or goal record, and not a
      promotion of any knowledge entry.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: standardized_parameter_set_bounded_sensitivity
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the three standardized parameter sets, over the executed keys
      and attempts, each rejection predicate fired at the reported rate with the reported interval or
      the reported upper bound plus sample size; the estimator recovered or failed to recover the
      derived forced value; and the crossover table takes the reported values with each cell labelled
      by its basis. WHAT DOES NOT FOLLOW - no statement about a rate below the finite-sample floor;
      no measured value for the vanishing predicate at the smallest parameter set, which is DECLARED
      OUT OF BUDGET IN ADVANCE; no side-channel statement; no recovery claim; and specifically NOT
      that the identity has been VERIFIED by the run - the identity is a theorem carried by an
      archived derivation, and the run checks the instrument and the premise, not the algebra.
  inputs:
    procedure: >-
      STAGE 0 (reading and algebra, zero compute, TERMINATING GATE): re-read the standard's signing
      algorithm and its repetition table from PRIMARY TEXT under a run record. The parent proposal
      relies on a corpus transcription and labels it a re-verification target. Write out the
      three-line proof of the identity and have it checked symbolically by an independent dispatch.
      If the conforming accept set is not a subset of the omitting one for some predicate, STOP and
      restate for that predicate. Freeze the estimator's declared low-dimensional statistic, the
      intervals, the graded sweep grid, the tolerance band and the sensitivity target; hash them.
      STAGE 1 (measurement, minutes): instrument one reference signer to record, per ATTEMPT, the
      truth value of ALL rejection predicates (not just the first to fire) and the emitted-or-not
      flag. Run at least 10^5 attempts per parameter set, over 32 keys. Report each predicate's
      marginal rate, its rate conditioned on the others passing, and the attributed-first-failure
      rate, each with a confidence interval, and with an explicit UPPER BOUND PLUS SAMPLE SIZE
      wherever the count is zero. This alone discharges the vanishing rows to the achieved
      sensitivity and settles the crossover for the predicates whose rates are measurable.
      STAGE 2 (the identity, minutes): build the signer that omits the first-stage conjunction. Run
      NULL-1 (two conforming signers, same key, different seeds), NULL-2 (a signer omitting a
      predicate derived unreachable at two parameter sets) and the POSITIVE ARM, all on the identical
      estimator path, with NULL-1's verdict COMMITTED FIRST. Check that the estimator returns the
      derived non-zero forced values on the positive arm and zero on both nulls, and that NULL-2's
      transcripts are byte-identical.
      STAGE 3 (the tight case, hours, DECLARED OPTIONAL): at a synthetic cell with the threshold
      parameter lowered so the vanishing predicate fires in a measurable range, run the graded sweep
      over five values, exhibit a violating-but-verifying signature, re-verify it under a SECOND
      INDEPENDENT verifier, and measure the verifier-visible fraction. The true-parameter rate of the
      vanishing predicate at the smallest parameter set is DECLARED OUT OF BUDGET IN ADVANCE rather
      than attempted and abandoned.
      STAGE 4 (zero compute): assemble the crossover table with every cell labelled measured,
      derived-under-a-heuristic, or theorem, together with the per-key dispersion, the finite-sample
      floor, and an explicit refusal statement for every rate below it.
    instrument: >-
      Python; a reference ML-DSA signer written from the Stage 0 primary text, instrumented at the
      attempt level. The estimator operates ONLY on the declared low-dimensional statistic - the
      firing indicator of each predicate plus the verification-outcome indicator - and NEVER on raw
      signatures, since a plug-in total variation on a large alphabet is biased upward and can
      approach 1 at any affordable sample size. Where a PAIRED design is possible - replaying the
      same masking-vector sequence into both signers - it is used and reported alongside the unpaired
      estimate, and the difference between them is itself a diagnostic. The second verifier for
      Stage 3 is written by a separate dispatch with a disjoint write scope. Recorded through the
      program's run wrapper with a manifest.
    parameters: >-
      All three standardized parameter sets; at least 10^5 signing attempts per parameter set; 32
      keys per parameter set; the graded sweep over five values of the threshold parameter at the
      synthetic cell, giving at least three interior points; confidence intervals by an exact method
      for binomial proportions; tolerance band on the positive arm's forced values admitting the
      standard's own tabulated residual as recorded in the sibling proposals. All frozen and hashed
      in Stage 0.
  controls:
    - >-
      NULL-1, TWO CONFORMING SIGNERS, same key, different seeds, blocking and load-bearing - forced
      value zero, so whatever the estimator returns here is its FINITE-SAMPLE FLOOR at the executed
      sample size. Its verdict is committed FIRST, before any signal arm. This is the arm that
      catches an estimator computing a plug-in distance on raw signatures, which would return
      something near 1 and make every arm look significant.
    - >-
      NULL-2, STRUCTURAL, blocking - a signer omitting a predicate DERIVED UNREACHABLE at two
      parameter sets, where the two signers are bit-for-bit identical on every input. Forced value
      zero AND byte-identical transcripts. NULL-1 and NULL-2 must AGREE within their intervals; if
      they do not, the estimator responds to something other than the omission and no signal-arm
      number is reportable.
    - >-
      POSITIVE ARM WITH A DERIVED NON-ZERO FORCED VALUE, blocking - a signer omitting the first-stage
      conjunction, whose rate is fixed in advance from the standard's repetition table. The estimator
      must return those values within its interval and the tabulated residual. An estimator that
      cannot recover a distance of that size has no power to certify anything about a vanishing one,
      and the whole instrument is void.
    - >-
      GRADED ARM, FIVE VALUES WITH FOUR INTERIOR POINTS - the threshold parameter swept so the
      predicate's rate runs across several orders of magnitude down to zero. The estimated distance
      must track the rate MONOTONICALLY and hit the floor at the last point. Two endpoints do not
      give a sign; a statistic that does not decay as the threshold rises is the canonical artifact
      tell.
    - >-
      MULTI-KEY ARM - 32 keys per parameter set, so the per-key dispersion of each rate is REPORTED
      rather than assumed away. The quantifier order in the hypothesis forbids a single rate across
      keys, and a design that pooled keys would silently make that forbidden claim.
    - >-
      SECOND INDEPENDENT VERIFIER for any exhibited violating signature. A certificate re-verified by
      only one implementation is not a certificate.
    - >-
      PAIRED VERSUS UNPAIRED DIAGNOSTIC - where the same masking-vector sequence can be replayed into
      both signers, report both the paired and the unpaired estimate; their difference exposes the
      attempt-counter coupling that is the identity's only real failure mode.
    - >-
      RATE-DEFINITION RECEIPT - all three rate definitions (marginal, conditional on the others,
      attributed-first-failure) are reported for every predicate, since a crossover table built from
      the wrong one is wrong by up to the other predicates' rates.
  independent_variables:
    - parameter set, all three standardized values
    - 'predicate omitted: none (conforming) / the first-stage conjunction / the compressed-public-key predicate / the hint-weight predicate'
    - key, over 32 per parameter set
    - threshold parameter on the graded sweep, five values
    - 'estimator design: paired versus unpaired'
  metrics:
    primary:
      - name: positive_arm_estimated_distance
        units: total variation distance, dimensionless, in the closed interval 0 to 1, per parameter set
        computed: >-
          The declared low-dimensional statistic's estimate of the distance between the conforming
          signer and the first-stage-omitting signer, per parameter set, with its interval. Compared
          against the forced values derived in Stage 0 from the standard's repetition table, with the
          tolerance band admitting the tabulated residual.
      - name: null1_finite_sample_floor
        units: total variation distance, dimensionless, in the closed interval 0 to 1
        computed: >-
          The same estimator applied to two conforming signers under the same key with different
          seeds, whose true value is zero. Whatever it returns is the floor. Committed before any
          signal arm.
      - name: null2_distance_and_transcript_equality
        units: >-
          total variation distance (dimensionless) plus a boolean transcript byte-equality flag, at
          the two parameter sets where the rate is derived to be exactly zero
        computed: >-
          The estimator's value and a byte-for-byte comparison of the two signers' transcripts over a
          frozen fixture of key-message pairs. Both required - zero and true.
      - name: per_predicate_rates
        units: >-
          three probabilities per predicate per parameter set (marginal, conditional, attributed-first),
          each with a confidence interval, or an upper bound plus sample size where the count is zero
        computed: >-
          Counted over at least 10^5 attempts per parameter set with all predicates evaluated per
          attempt, by an exact binomial interval method. A zero count is NEVER reported as a
          probability; it is reported as an upper bound with its sample size.
      - name: crossover_table
        units: >-
          reciprocal of the rate, in signatures (hedged mode) or distinct messages (deterministic
          mode), per predicate per parameter set
        computed: >-
          One over the conditional rate, per cell, with EVERY cell labelled measured,
          derived-under-a-heuristic, or theorem, and with the hedged versus deterministic reading
          stated in the cell.
    secondary:
      - name: graded_sweep_monotonicity
        units: estimated distance at each of five threshold values, plus a monotonicity flag
        computed: >-
          The estimator's value at each swept threshold, with the flag computed as whether the
          sequence tracks the rate monotonically and reaches the floor at the last point.
      - name: per_key_dispersion
        units: >-
          standard deviation and full range of each rate over 32 keys, per predicate per parameter set
        computed: Computed across keys and reported, never pooled into a single rate.
      - name: paired_versus_unpaired_gap
        units: difference between the two estimates, dimensionless
        computed: >-
          Reported wherever a paired design is possible; a material gap is the diagnostic for the
          attempt-counter coupling.
      - name: verifier_visible_fraction
        units: dimensionless fraction, at the synthetic cell only
        computed: >-
          Fraction of emitted violating signatures that FAIL verification at the synthetic cell,
          measured directly rather than inherited, with its ratio to the leak rate reported.
      - name: exhibited_violating_signature
        units: signature bytes plus two verification outcomes plus the producing seed
        computed: >-
          A signature violating the omitted predicate that nevertheless verifies, re-verified under a
          second independent verifier.
      - name: attempts_and_keys_executed
        units: exact integers
        computed: Attempts per parameter set and keys per parameter set actually executed.
  heuristic_under_test:
    numbered_heuristics:
      - id: H1
        formal_statement: >-
          NONE LOAD-BEARING FOR THE IDENTITY. The total variation equals the rate by the definition of
          conditioning and the subset relation between the two accept sets; the hybrid bound follows
          from independence of signing queries given the key, which holds by construction in hedged
          mode. This entry exists to record that the headline is UNCONDITIONAL and that its only
          assumptions are evidentiary.
        rigorous_side: >-
          Elementary - for nested conditioning the supremum of the difference equals one minus the
          inner conditional probability, attained at the inner event. Hybrid argument over independent
          queries.
        validation_route: >-
          Symbolic re-derivation by a SECOND, independent dispatch in Stage 0, plus the positive arm's
          recovery of the derived forced values at the executed sample size, which is an empirical
          check of the identity at a value where it is measurable.
      - id: H2
        formal_statement: >-
          For the compressed-public-key predicate at the smallest parameter set only, the rate takes a
          vanishing value inherited verbatim from a sibling proposal, derived under an independence
          assumption across coefficients and across the challenge's summands.
        rigorous_side: >-
          Exact envelope bound, exact convolution of the uniform law, exact residue-class count; the
          INDEPENDENCE is not proved.
        validation_route: >-
          NOT validated at the derived magnitude by anything affordable, and this is stated as an open
          gap rather than papered over. What IS validated - Stage 1 measures the predicate to the
          achieved sensitivity and checks the hint-weight distribution against its derived bulk
          statistics, which tests the same law in the bulk; a bulk failure invalidates the tail number
          regardless.
      - id: H3
        formal_statement: >-
          A signature violating the omitted predicate nevertheless verifies with probability close to
          1, inherited from a sibling proposal. LOAD-BEARING ONLY for the secondary testability ratio.
        rigorous_side: >-
          The hint-correctness condition is sufficient rather than necessary, so the failure set is
          strictly smaller than the violation set.
        validation_route: >-
          Directly measurable at the synthetic cell in Stage 3, where violations are common. This is
          the one arm that turns an inherited derivation into a measurement, at a parameter set that
          is NOT the standard's, and the transfer to true parameters is an explicit assumption rather
          than a result.
  preregistered_prediction:
    quantity: >-
      The tuple (positive_arm_estimated_distance, null1_finite_sample_floor,
      null2_distance_and_transcript_equality, per_predicate_rates, crossover_table).
    formula: >-
      positive_arm_estimated_distance equals the values derived in Stage 0 as one minus the reciprocal
      of the standard's repetition figure at each parameter set, within the estimator's interval and
      the tabulated residual the sibling proposals record. null1_finite_sample_floor strictly below
      the smallest rate the run intends to report, and specifically below 0.01, otherwise no rate
      below the floor is reportable and the campaign is sized wrongly. null2 distance exactly zero AND
      transcripts byte-identical at the two parameter sets where the rate is derived zero.
      per_predicate_rates - the compressed-public-key predicate NOT observed firing at the achieved
      sensitivity, reported as an upper bound with its sample size; the hint-weight predicate's
      crossover of order a few hundred, which is the row most likely to be wrong and the cheapest to
      measure. crossover_table spanning from roughly one signature for the first-stage conjunction to
      unbounded for the derived-zero cells.
      THE HONEST EXPECTATION IS THAT THE VANISHING PREDICATE IS NOT OBSERVED FIRING AT ALL, and a
      zero there is the expected, reportable, bound-shaped outcome rather than a disappointment.
    source: >-
      Pre-registered in the parent proposal IDEA-20260821-60ba98 (predictions and
      null_object_control blocks) before any run under this contract exists. The numeric forced values
      are DERIVED, not measured, and this contract deliberately requires Stage 0 to re-derive them
      from re-read primary text rather than transcribing them from the proposal, because a forced
      value copied from prose is not a forced value.
  scale_relevance:
    tier: standardized_parameter_set
    justification: >-
      Executed at all three standardized parameter sets rather than at a reduced scale, because the
      rates under test are properties of those parameter sets and a reduced-parameter signer would
      have different rates. There is therefore no scale transfer assumption for the measured rows. The
      binding limit is SENSITIVITY, not scale - at least 10^5 attempts per parameter set resolves
      rates down to roughly one in 10^5, and the vanishing predicate's derived rate is many orders of
      magnitude below that. The contract therefore DECLARES that row out of budget in advance and
      reports it as an upper bound with its sample size, rather than attempting it and abandoning it.
      Stage 3's synthetic cell is explicitly NOT a standardized parameter set, and its transfer to
      true parameters is stated as an assumption rather than a result.
    correspondence: >-
      Exact for Stages 1 and 2; Stage 3 is a synthetic cell whose relationship to the standard's
      parameters is an explicit assumption.
  sample_size_justification: >-
    The census sample size is derived from the smallest rate the run intends to RESOLVE rather than
    from the smallest rate that exists. With N attempts per parameter set and an exact binomial
    interval, a predicate not observed firing yields a one-sided upper bound of roughly three over N;
    at the declared floor of 10^5 attempts that is roughly three in 10^5, which is the achieved
    sensitivity and is what every zero row reports. The derived rate of the vanishing predicate is far
    below this, so no attempt count within the declared budget could measure it, and the contract
    states this BEFORE the run and reports a bound rather than a value. Where a Coordinator wants a
    lower bound reported, the required N follows from the same formula and must be funded by amendment
    before the run.
  tail_checks:
    - >-
      Report every zero count as an UPPER BOUND with its sample size, never as a probability and never
      as "does not fire". This is the single most important reporting rule in the contract.
    - >-
      Report the per-key range of every rate, not only its mean over keys, since the quantifier order
      allows the rate to depend on the key and a pooled rate would make a forbidden claim.
    - >-
      Report the hint-weight distribution's bulk statistics against their derived values, since the
      tail number for the vanishing predicate rests on the same law and a bulk failure invalidates the
      tail number regardless.
    - >-
      Report all three rate definitions per predicate, since they differ by up to the other
      predicates' rates and a crossover table built from the wrong one is wrong by that factor.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
    keys_per_parameter_set: 32
    note: >-
      Seeds drive independent attempt streams; keys are a separate axis and are never pooled into a
      single rate. The symbolic re-derivation in Stage 0 is performed by a second, independent
      dispatch and is a control rather than a replication seed.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 30
  stopping_rules:
    - Halt if the standard cannot be re-read from primary text in Stage 0; forced values are not derived from a transcription of a transcription.
    - Halt if the conforming accept set is not a subset of the omitting one for some predicate; restate for that predicate before proceeding.
    - Halt if the estimator misses the derived forced values on the positive arm; no other arm may be read.
    - Halt if NULL-1 and NULL-2 disagree beyond their intervals; the estimator responds to something other than the omission.
    - >-
      Do NOT attempt the vanishing predicate's rate at true parameters. It is declared out of budget
      in advance, and a partially completed attempt at it is not evidence of anything.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop,
      never a negative result (AGENTS.md rule 5).
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
      and is NEVER negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run in which the estimator was applied to RAW SIGNATURES rather than to the declared
      low-dimensional statistic is invalid_measurement. The plug-in distance on a large alphabet is
      biased upward toward 1 and would make every arm look significant.
    - >-
      A run whose NULL-1 verdict was not committed BEFORE the signal arms is invalid_measurement,
      because a floor established afterwards is not a floor.
    - >-
      A run whose null arms were not executed on the identical estimator path as the signal arms is
      invalid_measurement.
    - >-
      Any exhibited violating signature that is not re-verified under a second independent
      implementation is not a certificate and the run is completed_invalid for that claim.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT experiment and requires a new
      contract; it is never a repair of this one.
  success_criterion: >-
    The run is successful when ALL of the following hold and are read off the predefined metrics:
    (1) Stage 0's primary-text re-read is filed and the symbolic re-derivation by an independent
    dispatch agrees; (2) null1_finite_sample_floor is committed first and lies strictly below 0.01;
    (3) null2 returns distance zero AND byte-identical transcripts at the two derived-zero parameter
    sets, and agrees with NULL-1 within intervals; (4) positive_arm_estimated_distance recovers the
    Stage 0 derived forced values within the estimator's interval and the tabulated residual;
    (5) per_predicate_rates are reported for all three definitions with intervals, and every zero
    count is reported as an upper bound with its sample size; and (6) crossover_table is delivered
    with every cell labelled measured, derived-under-a-heuristic, or theorem, together with the
    per-key dispersion.
    Note that (5) is satisfied by a zero row reported as a bound. NOT observing the vanishing
    predicate is the expected outcome and is a result, not a failure.
  falsification_criterion:
    - >-
      The estimator does not return the derived forced values on the positive arm within its interval
      and the tabulated residual - THE INSTRUMENT HAS NO POWER and no other arm may be read. Either
      the estimator is not measuring the quantity or the derived values are wrong, and deciding which
      comes before anything else is written.
    - >-
      null1_finite_sample_floor exceeds the rate being estimated at some parameter set - no rate below
      that floor is reportable there. The outcome is a SAMPLE-SIZE statement, never evidence that the
      predicate does not fire.
    - >-
      NULL-2 returns a nonzero distance or non-identical transcripts at the two derived-zero parameter
      sets - either the inherited envelope derivation is WRONG, which would be far more interesting
      than this record, or the instrument is. Deciding which comes first.
    - >-
      Some predicate's omission is shown to change the emitted law by MORE than its firing rate - the
      identity is FALSE AS APPLIED and this record is superseded. The one mechanism that could produce
      this is the attempt-counter coupling, and the paired-versus-unpaired diagnostic is what hunts
      it.
    - >-
      Stage 1 measures the compressed-public-key predicate firing above the achieved sensitivity at
      any parameter set - the inherited envelope derivation or its independence assumption is wrong,
      the crossover table is WITHDRAWN, and that is the result.
    - >-
      The graded sweep is non-monotone in the rate - the estimated distance cannot be read
      directionally and no signed statement about any arm is made.
    - >-
      At the synthetic cell the verifier-visible fraction is near the leak rate, i.e. violating
      signatures almost always fail verification - the predicate is SELF-ENFORCING after all, which
      contradicts the inherited derivation and would be the single most interesting outcome available
      from this design.
  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved inference block and environment
    - the Stage 0 primary-text fetch receipt, with URL, HTTP status, byte count and sha256
    - the archived three-line derivation of the identity and the independent symbolic re-derivation, both before any measurement
    - the frozen estimator statistic, intervals, sweep grid, tolerance band and sensitivity target, with their hash
    - raw-result.json carrying per-attempt predicate truth values and emitted flags, per key, not summaries
    - NULL-1's verdict with its commit timestamp preceding the signal arms
    - NULL-2's distance and its transcript byte-equality output over the frozen fixture
    - the positive arm's estimate against the Stage 0 derived forced values
    - the crossover table with every cell's basis label and its hedged-versus-deterministic reading
    - the per-key dispersion of every rate over 32 keys
    - any exhibited violating-but-verifying signature, its two verification outcomes, and the producing seed
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Approval is required before execution and is the USER's gate, because it authorizes execution
      and spends compute. This contract is review_required and NOT approved; approved_by is null and
      execution_authorized is false.
    - >-
      The parent proposal is PROOF-ORIENTED and carries a proof_search_map. Per KN-TECH-080 and the
      Coordinator's proof-oriented dispatch gate, that map must be audited before implementation -
      in particular its bottleneck (the coupling between the two signers' loops), its baseline
      embedding at both boundary values of the rate, its observation collision (a conforming signer
      whose key makes the predicate fire at the same rate), its quantifier order (the rate depends on
      the KEY and the quantifier over adversaries comes after it), and its nearby-object control.
    - >-
      Stage 0's primary-text re-read is a precondition. The forced values on the positive arm are the
      instrument's only power check, and a forced value inherited from a transcription of a
      transcription is not a check.
    - >-
      The symbolic re-derivation must be performed by a SECOND, independent dispatch. A single agent
      deriving and then confirming its own three lines provides no independent check.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260821-60ba98
    authored_at: '2026-08-25'
    note: >-
      The identity, the named term, the tight lower bound, the three null arms, the graded sweep, the
      multi-key requirement and the three numbered heuristics are transcribed from the parent
      proposal's claim, mechanism, null_object_control, predictions, minimal_test and
      heuristic_assumptions blocks. This contract deliberately does NOT copy the parent's numeric
      forced values into the metric definitions; Stage 0 must re-derive them from re-read primary
      text, because the parent itself records its numbers as coming from a corpus transcription that
      is a re-verification target. Budgets come from the parent's declared estimated_cost
      (implementation low, compute low) through the program's cost table.
  derivation_gaps:
    - >-
      The numeric forced values for the positive arm are NOT written into this contract. They must be
      derived in Stage 0 from re-read primary text and frozen there. The Coordinator must confirm the
      derivation before Stage 2, because those values are the instrument's only power check.
    - >-
      The tolerance band on the positive arm is specified as admitting the residual the sibling
      proposals record between the standard's table and their own recomputation, but that residual's
      exact size must be read from those committed records rather than from prose, and the band fixed
      before Stage 2.
    - >-
      The exact form of the declared low-dimensional statistic - which indicators, and how they are
      combined into a distance estimate - is named but not fully specified here. It must be fixed in
      Stage 0, since the estimator's floor and its power both depend on it.
    - >-
      Whether a paired design is achievable at all, given that the omitting signer's attempt counter
      advances differently, is not settled here. If it is not, the unpaired estimator's larger variance
      must be accounted for in the interval, and the identity's only real failure mode loses its
      cheapest diagnostic.
    - >-
