experiment:
  id: EXP-BINSTD-a8bfd8
  hypothesis_id: H-BINSTD-85e778
  question_id: RQ-NISTBIN-06157b
  source_idea: IDEA-20260922-cdca3a
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    HOLD-I: Stage-0 tensor sparsity freeze plus Stages 1-3 descended-system
    support, same-weight/relabelling/basis-invariance controls, and deferred
    WDSat/ANF E1-vs-E2 classification at matched (m,t,l,V)
  status: analyzed
  status_updated_by: DEC-20261003-021bb4
  status_updated_at: '2026-10-03'
  status_update_note: >-
    Stages 0-1 analyzed under EV-BINSTD-71eabe / DEC-20261003-021bb4
    (expand) after re-admit tip 460add6f89. Stages 2-3 remain authorized
    by DEC-20261002-b1f692. Prior #1622 EV/DEC never on main.
  approved_by: DEC-20261002-b1f692
  approved_at: '2026-10-02'
  # Top-level frozen/execution_authorized are what tools/experiment_execution.py
  # load_plan reads (nested approval.frozen alone is not sufficient).
  # Surfaced additively by AMD-EXP-BINSTD-a8bfd8-20261003-admission.
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  packaging_only: false
  execution_authorized_stages: [0, 1, 2, 3]
  execution_authorized_note: >-
    Stages 0-3 authorized by DEC-20261002-b1f692 under AGENTS.md standing
    user authorization (2026-09-06). Trial-plan-v1 admits Stages 0-1 first
    under TASK-20261003-a5391d. No Magma/Sage/AUXIN/Bedrock. No NIST/ANSI
    solve. No security-difference claim from modulus weight w.
  approval:
    approved_by: DEC-20261002-b1f692
    composing_decision: DEC-20261002-b1f692
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-3 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3]
    scientific_execution_authorized_note: >-
      Stage 0 freezes irreducible pairs and tensor monomial counts at
      m in {7,11,15}. Stage 1 builds matched (m,t=2,l) descended systems and
      records support / XOR length. Stage 2 runs same-weight, fixed-V,
      matched-width relabelling (9d12bd), and fixed-modulus basis-change
      (99294c) controls. Stage 3 runs WDSat/ANF when a vendored solver is
      present; otherwise records O-IMPEDIMENT and still emits RESULTS.md from
      Stages 0-2. No Magma/Sage. No AUXIN. No Bedrock. No NIST/ANSI solve.
    frozen: true
    execution_state: >-
      approved frozen contract; trial-plan-v1 + implementation/run.py admit
      Stages 0-1 under TASK-20261003-a5391d
      (AMD-EXP-BINSTD-a8bfd8-20261003-admission)
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-a8bfd8/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-a8bfd8/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-a8bfd8/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-a8bfd8/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-a8bfd8/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. implementation/run.py +
      check.py are the hash-bound sources. Stage 0 freezes tensors before
      Stage 1. {run_dir} is substituted by the process supervisor.

  objective: >-
    Isolate reduction-polynomial Hamming weight w as a priced confound on
    descended-system support, XOR-clause length, per-conflict time and peak
    memory; classify E1 vs E2 on conflict count when a solver is available;
    deliver exactly one O-* label from H-BINSTD-85e778.

  class: control
  class_note: >-
    Control / heuristic-validation measurement of modulus-weight effects.
    Protects every V-selection / Frobenius-stability wall-time reading.
    Not an exponent-moving breakthrough.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond tiny Python). Enumerate irreducible
        weight-3 and weight-5 moduli at m in {7,11,15} (23 optional);
        build F_2-multiplication tensors; write
        stage0/preregistered-predictions.json and stage0/tensor-census.json
        freezing monomial counts, per-output XOR lengths, and predicted
        pentanomial/trinomial ratios; freeze E1 c-band [0.9,1.0] and
        N_leaf band [0.95,1.05].
      - >-
        Stage 1. Generate t=2 Weil-descent summation systems over each
        modulus at matched (m,l) with l in {6,7,8} and fixed V; record
        total monomial support and mean XOR-clause length; write
        stage1/support-census.json.
      - >-
        Stage 2. Controls: (i) two distinct trinomials and two pentanomials
        at one m (same-weight); (ii) fixed-V across moduli; (iii) matched-
        width random F_2-linear relabelling null (9d12bd); (iv) fixed-
        modulus F_2-basis change invariance of solution-set shape (99294c);
        write stage2/controls.json.
      - >-
        Stage 3. If vendored WDSat/ANF (e.g. inputs/TRIMOSKA-WDSAT-2024) is
        importable: run both modulus arms at matched (m,t,l,V) with identical
        solver flags; record conflict count, per-conflict time, peak memory;
        classify E1 vs E2; write stage3/solver-arm.json. Else write
        stage3/impediment.json with O-IMPEDIMENT and proceed to RESULTS.md.
      - >-
        RESULTS.md with exactly one O-* label; memory beside time; confound
        statement (D) stated as priced control for future V comparisons.
    excluded:
      - Any NIST/ANSI/ECC2K-130 deployed-degree decomposition / ECDLP solve as a claimed result.
      - Magma/Sage/cypari2/AUXIN/Bedrock as success path.
      - Editing IDEA-20260922-cdca3a / f37254 / 9d12bd / 99294c claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Editing EXP-BINSTD-644d2f (HOLD-J) artifacts (read-only when reused).
      - Reading w as a security difference (proves-too-much control).
      - Treating infra / missing-solver as evidence against (A)/(B)/E1.

  inputs:
    idea: ledger/proposals/IDEA-20260922-cdca3a.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-85e778.yaml
    decision: ledger/decisions/DEC-20261002-b1f692.yaml
    hold_decision: ledger/decisions/DEC-20260924-99ce20.yaml
    consolidated_representation: ledger/proposals/IDEA-20260922-f37254.yaml
    consolidated_sparsity: ledger/proposals/IDEA-20260922-9d12bd.yaml
    consolidated_invariance: ledger/proposals/IDEA-20260922-99294c.yaml
    exhaustive_core_law: ledger/proposals/IDEA-20260915-0d8e90.yaml
    fips_polys: inputs/FIPS186-4-BINARY-CURVES/source_record.yaml
    hold_j_shared_generator_readonly: experiments/EXP-BINSTD-644d2f/
    reusable_impl_readonly:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/common.py

  controls:
    - name: same_weight_irreducibles
      description: >-
        Two distinct irreducible trinomials (and two pentanomials) of the
        same degree must give equal support and (E1) equal conflict count
        up to relabelling — isolates w from the specific polynomial.
    - name: fixed_V_across_moduli
      description: >-
        Hold the factor-base subspace V identical across modulus arms so
        any support/conflict difference is attributable to w alone.
    - name: matched_width_random_relabelling
      description: >-
        9d12bd discriminator: random invertible F_2-linear relabelling of
        each l-bit block matched in clause-width to the pentanomial arm;
        must not reproduce unmatched-relabelling N_leaf blowup.
    - name: fixed_modulus_basis_change
      description: >-
        99294c section: change F_2-basis at fixed p(t); solution-set shape
        / fully-determined indicators must agree.
    - name: proves_too_much_security
      description: >-
        Forbid reading "trinomial degrees are weaker targets"; under E1
        the search exponent is modulus-blind and rho margins order by m.

  independent_variables:
    - name: modulus_weight
      levels: [3, 5]
    - name: field_degree_m
      levels: [7, 11, 15]
    - name: factor_base_dimension_l
      levels: [6, 7, 8]
    - name: summation_arity_t
      levels: [2]
    - name: control_arm
      levels: [primary, same_weight, relabel_matched, basis_change]

  primary_metrics:
    - name: distinct_quadratic_monomials
      definition: Count of distinct quadratic monomials in the m multiplication-tensor outputs.
    - name: descended_total_support
      definition: Total monomial support of the descended t=2 system.
    - name: mean_xor_clause_length
      definition: Mean XOR-clause length of the descended Boolean system.
    - name: leaf_count_ratio
      definition: >-
        leaf_count(pentanomial)/leaf_count(trinomial) at matched (m,l);
        predicted in [0.95,1.05] (9d12bd).
    - name: conflict_count
      definition: >-
        WDSat/ANF UNSAT conflict count (Stage 3); E1 iff within c-band
        across moduli.
    - name: peak_rss_bytes
      definition: Peak solver RSS; first-class beside time.

  secondary_metrics:
    - name: per_conflict_time_seconds
    - name: clause_width_ratio
    - name: substitution_variable_count_ratio
    - name: basis_invariance_indicators_agree
      definition: Boolean; 99294c section.

  seeds_and_replication:
    stage0_note: >-
      Deterministic enumeration of irreducibles; seed stream recorded for
      any randomized V draw and for Stage-2 relabelling matrices.
    stage2_relabel_seeds: 16
    stage3_seeds: 8
    replication_plan: >-
      Stage 0-1 are exhaustive over the frozen (m, modulus-pair) table.
      Stage 2 relabelling uses ≥16 independent invertible matrices.
      Stage 3 uses ≥8 seeds per (m,l,modulus) when solver present.

  budget:
    wall_clock_seconds: 14400
    memory_gb: 6
    maximum_runs: 8
    note: >-
      Advisory. Stage 3 may stop early with O-IMPEDIMENT if no solver.
      Scientific sample counts above are frozen; CPU estimates are not
      rationing gates.

  stopping_rules:
    - SR-1. Stage 0 freeze before any Stage-1 RESULTS reading.
    - SR-2. If Stage 0 tensor census fails (A) → O-A-FALSE; stop before Stage 3.
    - SR-3. If Stage 1 support claim fails (B) → O-B-FALSE; Stage 3 optional.
    - SR-4. If Stage 2 same-weight or fixed-V control fails → O-ARTIFACT.
    - SR-5. Missing Stage-3 solver → O-IMPEDIMENT recorded; RESULTS.md still emitted from Stages 0-2.
    - SR-6. Budget abort / crash → failed_infrastructure / O-IMPEDIMENT; never negative evidence against E1.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze.
    - Changing solver flags between modulus arms.
    - Changing V between modulus arms on the primary comparison.
    - Treating missing solver as falsification of (A)/(B)/E1.
    - Claiming a NIST/ANSI security difference from w.
    - Using Magma/Sage/AUXIN/Bedrock as the success path.

  success_criterion: >-
    Stages 0-2 complete with artifacts present; RESULTS.md names exactly
    one of O-E1-CONFIRMED, O-E2, O-A-FALSE, O-B-FALSE, O-9d12bd-FALSE,
    O-99294c-FALSE, O-ARTIFACT, O-IMPEDIMENT; every primary metric for
    executed stages recorded; Stage-0 bands frozen before Stage 1; Stage 3
    either classified E1/E2 or recorded as O-IMPEDIMENT without blocking
    Stages 0-2 deliverables.

  falsification_criterion: >-
    (A) falsified iff weight-3 and weight-5 tensors give equal distinct-
    quadratic-monomial counts at matched m in {7,11,15} (→ O-A-FALSE).
    (B) falsified iff descended support is equal or larger for the
    trinomial at matched (m,t,l) (→ O-B-FALSE). E1 falsified (→ O-E2) iff
    Stage-3 conflict counts differ beyond the frozen c-band under fixed
    solver flags and fixed V. 9d12bd falsified iff matched-width
    relabelling fails the N_leaf discriminator as predefined.
    Instrument falsified (→ O-ARTIFACT) on same-weight/control failure.

  required_artifacts:
    - stage0/preregistered-predictions.json
    - stage0/tensor-census.json
    - stage0/derivations-note.md
    - stage1/support-census.json
    - stage2/controls.json
    - stage3/solver-arm.json OR stage3/impediment.json
    - RESULTS.md
    - runs/<RUN-BINSTD-*>/manifest.yaml

  protocol_amendments: []
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
