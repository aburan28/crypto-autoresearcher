experiment:
  id: EXP-HAWKL-a26a1a
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-b3478d; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-b3478d
  question_id: RQ-HAWK-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Matched module-versus-plain lattice pairs at equal dimension and determinant: eligibility-filtered
    isometry-invariant battery, paired permutation tests, two same-shape nulls, and a tautology verdict
    on every separator.'
  objective: 'The one uncertainty a run reduces is whether module structure over the cyclotomic ring
    is detectable in a HAWK-shaped lattice by any cheap isometry invariant when everything else about
    the instance is held fixed. Concretely: (i) whether a matched pair can be built at all - equal
    dimension, exactly equal determinant, identical declared construction rule and seed, differing
    only in ring-linearity of the generating basis - and at what rejection cost, itself a measurement
    of how constrained module bases are; (ii) which members of a frozen invariant battery, after filtering
    for eligibility by constancy across 100 random unimodular re-bases, separate the arms at ring
    degrees 4, 8 and 16, with standardised effect sizes and paired permutation p-values, and whether
    those effect sizes grow monotonically with n as genuine structure should rather than staying flat
    as an artifact would; (iii) whether any separator survives a tautology verdict, that is, whether
    it discovers something or merely reads back the ring-linearity imposed by construction. A run
    performs no lattice reduction, calls no estimator, runs no solver, and makes no statement about
    the difficulty of either arm. The intended downstream use is to tell a Coordinator whether module
    structure is an object-level property at reachable scale or only an operation-level one.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for HAWK-SHAPED instances
      generated by one declared deterministic seeded rule at ring degrees 4, 8 and 16, with dimension
      and determinant matched exactly across arms, invariant X separates module from plain arms with
      standardised effect size e and paired permutation p-value p, growing or not growing across n,
      and surviving or not surviving the tautology verdict, with both same-shape nulls reported alongside.
      What does NOT follow: nothing about whether either arm is harder to solve; nothing about HAWK,
      whose Round-3 specification is unread here and whose key generation is not used; nothing about
      ring degrees above those tested and no extrapolation to deployed parameters; nothing about the
      module-LIP to nrd-PIP reduction, which is untouched; and no statement about HAWK''s security
      in either direction.'
  inputs:
    procedure: 'STAGE 0 (cost: hours, zero compute). Freeze the construction rule, the seed schedule,
      the short-vector radius as an explicit formula in the determinant, the invariant battery and
      the permutation-test protocol in the specification, before any generation. STAGE 1 (cost: minutes).
      Eligibility pre-check: build one lattice per ring degree, apply 100 random unimodular re-bases,
      keep only invariants constant across all of them, emit the drop list. STAGE 2 (cost: minutes
      at degree 4, tens of minutes at degree 8). Generate 200 matched signal pairs per ring degree
      with exact determinant matching by rejection, recording rejection rates per arm. STAGE 3 (cost:
      same order). Generate 200 null pairs of each kind, plain-plain and module-module, by the identical
      code path in the same invocation. STAGE 4 (cost: hours at degree 16). Compute the eligible battery
      on every lattice: exhaustive short-vector enumeration to the frozen radius, automorphism order
      by orbit-stabiliser on those vectors, Gram rank modulo 2, 3, 5 and 7. STAGE 5 (cost: minutes).
      Paired permutation tests, 10000 shuffles, on the signal pair and both nulls, with the frozen
      multiple-comparison correction. STAGE 6 (cost: hours of human work). Tautology verdict per separator,
      including the artificial ring-compatible-Gram plain control. STAGE 7 (cost: minutes). Emit through
      harness/runner.py with seeds, rejection rates, drop list, all effect sizes and p-values, and
      the largest completed ring degree.'
    instrument: Python 3 with exact integer arithmetic throughout; integer matrices as tuples of tuples;
      sympy for cyclotomic polynomial reduction and modular rank; numpy for permutation-test bookkeeping
      only. Short-vector enumeration is a hand-written exact-integer Fincke-Pohst-style recursion
      in the harness rather than a dependency on any external lattice library; if fpylll happens to
      be installed it is used only as an independent cross-check arm on a subsample and its absence
      is not a failure. No computer-algebra system and specifically no Sage. Instance generation follows
      the HAWK-SHAPED declared-rule discipline inherited from H-HAWK-c7a551 and the EXP-HAWK-a2f34a
      lineage. Runs and manifests through harness/runner.py.
    parameters: 'Ring degrees n in {4, 8, 16}, lattice dimensions 2n in {8, 16, 32}; ring degree 32
      (dimension 64) attempted only for the cheap battery members and only if the degree-16 stage
      completes within budget. 200 matched signal pairs per degree; 200 null pairs of each of two
      kinds per degree. Short-vector radius frozen at 1.5 times the 2n-th root of the determinant.
      Eligibility check: 100 random unimodular re-bases. Permutation shuffles: 10000. Modular ranks
      at primes 2, 3, 5, 7. All seeds declared in the specification.'
  controls:
  - 'Eligibility pre-check: every invariant must be constant across 100 random unimodular re-bases
    before entering the comparison; the drop list is reported.'
  - 'Null pair one: two plain lattices, different seeds, identically matched and identically tested,
    same invocation.'
  - 'Null pair two: two module lattices, different seeds, identically matched and identically tested,
    same invocation.'
  - 'Tautology verdict: for each separating invariant, check whether it is a deterministic function
    of the imposed ring-linearity, for instance by recomputing it on a plain lattice artificially
    given a ring-compatible Gram; if so it is recorded as reading back the construction.'
  - 'Determinant-matching audit: report the rejection rate and confirm matched pairs have exactly
    equal determinants, since an unmatched determinant would separate the arms trivially.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a same-shape pair with NO structural difference:
    two plain 2n-dimensional lattices generated by the identical rule with different seeds, matched
    on dimension and determinant exactly as the signal pair is, run through the identical battery
    and identical permutation test in the same invocation. For the signal arm to mean anything the
    null pair must show effect sizes consistent with zero and permutation p-values uniform across
    the battery; if the null pair shows the same separations as the module-versus-plain pair, the
    battery is detecting the seed or the matching procedure rather than module structure and every
    signal-arm number is void. A second null - two module lattices with different seeds - runs identically,
    and the two nulls together bound the within-arm variability that any between-arm claim must exceed.'
  independent_variables:
  - arm (module versus plain)
  - ring degree n in {4, 8, 16}
  - invariant identity within the frozen battery
  - pair kind (signal, plain-plain null, module-module null)
  metrics:
    primary:
    - standardised effect size per eligible invariant per ring degree, signal pair
    - paired permutation p-value per eligible invariant, signal pair
    - the same two quantities on both null pair kinds
    - monotonicity of effect size across ring degree
    secondary:
    - eligibility drop list and the re-basis variance that caused each drop
    - determinant-matching rejection rate per arm
    - automorphism group order distribution per arm
    - short-vector count distribution per arm
    - largest ring degree completed within budget
  heuristic_under_test: null
  preregistered_prediction:
    quantity: e_aut(n), the standardised effect size of log automorphism-group order between the module
      and plain arms at ring degree n, reported together with its tautology verdict.
    formula: 'e_aut(n) = (mean over module arm of log|Aut| minus mean over plain arm of log|Aut|)
      divided by the pooled within-arm standard deviation over the 200 matched pairs. Predicted: e_aut(n)
      > 0 and increasing in n, with a median automorphism-order ratio of at least 2n, since ring-unit
      multiplication supplies automorphisms the plain arm need not have. This is deliberately the
      prediction most likely to be a tautology, and the contract requires the tautology verdict to
      be reported next to it; a confirmed prediction carrying a tautology verdict counts as no evidence
      for claim (B).'
    source: Pre-registered in the parent proposal IDEA-20260816-b3478d before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Ring degrees 4, 8 and 16 (dimensions 8, 16, 32), chosen because exhaustive short-vector
      enumeration and orbit-stabiliser automorphism computation are exact and complete there and budget-bound
      above. These are far below any deployed parameter. NO transfer to HAWK's parameters is assumed
      or performed; the only extrapolation offered is the growth DIRECTION of an effect size across
      the three tested degrees, used solely as the artifact test from docs/inventor-protocol.md section
      3 and never as a forecast. Instances are HAWK-SHAPED by declared rule, matching the scope discipline
      already recorded in H-HAWK-c7a551.
    correspondence: null
  tail_checks:
  - Check pairs where the determinant-matching loop needed an unusually large number of rejections,
    and report whether their invariants are atypical - a sign the matching is biasing the sample.
  - Check the lattices with the largest and smallest automorphism orders in each arm individually,
    confirming the orbit-stabiliser search terminated rather than truncated.
  - Check the smallest ring degree, where the plain and module arms may coincide by accident, and
    report the coincidence rate.
  - Check invariants with zero variance across both arms, which carry no information and must be excluded
    from the multiple-comparison count.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt and report if exact determinant matching cannot achieve 200 pairs at ring degree 8 within
    the declared rejection budget, reporting the rejection rate as the result.
  - Halt the ladder at whichever ring degree the battery stage exceeds its wall-clock budget, and
    report the largest completed degree rather than reporting partial batteries as complete.
  - Halt if the eligibility pre-check drops more than half the battery, reporting the battery as unfit
    before running any arm comparison.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run emits, for every eligible invariant at every completed ring degree, a
    standardised effect size and paired permutation p-value on the signal pair reported side by side
    with the same statistics on both same-shape nulls, plus the monotonicity verdict across degrees
    and an explicit tautology verdict on every separator - with the null pairs showing permutation
    p-values consistent with uniformity.
  falsification_criterion:
  - No eligible invariant separates the arms at any completed ring degree.
  - Every separator receives a tautology verdict.
  - Either null pair shows separations comparable to the signal pair, voiding the battery.
  - Separating effect sizes are flat rather than monotone across ring degree.
  - Determinant matching is infeasible within the rejection budget, so the arms differ in more than
    one variable.
  - More than half the battery fails the eligibility pre-check.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-b3478d
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The declared HAWK-SHAPED construction rule must be fixed by the Coordinator, including the entrywise
    distribution and the determinant-matching strategy; different rules give different rejection rates
    and possibly different separations, and the rule is not derivable from anything in this corpus.
  - Whether determinant matching or genus matching is the right control is not settled here; genus
    matching would be stronger and harder, and the Coordinator must choose before freezing.
  - The multiple-comparison correction across the battery is unspecified and materially affects every
    p-value and the size of the separator list.
