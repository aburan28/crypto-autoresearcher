# =============================================================================
experiment:
  id: EXP-FROB-f495ea
  hypothesis_id: H-FROB-f3d248
  question_id: RQ-FROB-7d8dd4
  source_idea: IDEA-20261002-8f26ce
  goal_id: GOAL-FROB-6333a9
  version: 1
  title: >-
    Artin-Schreier order-131 census: genus-1 gate plus hit counts at
    genus 5 (deg 11) and genus 6 (deg 13) over F_2
  status: approved
  approved_by: DEC-20261002-cf888a
  approved_at: '2026-10-02'
  frozen: true
  frozen_at: '2026-10-02'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261002-cf888a under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    ECC2K-130 solve. No n>=131 attack. Ladder eliminant = Stage 2, not
    authorized here.
  approval:
    approved_by: DEC-20261002-cf888a
    composing_decision: DEC-20261002-cf888a
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes genus-1 census and preregistered predictions. Stage 1
      runs genus-5/6 hit counts with genus-2 histogram and dual-count
      controls; writes RESULTS.md with exactly one O-* label. No Magma/Sage.
      No AUXIN. No Bedrock. No ECC2K-130 solve.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether the Artin-Schreier normal-form family at genus 5 or 6
    over F_2 contains a model with 131 | #Jac(F_2)=P(1); deliver exactly
    one O-* label from H-FROB-f3d248.

  class: measurement
  class_note: >-
    Arithmetic-table / structural-certificate measurement of explicit AS
    models. Not an exponent-moving breakthrough; no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0 (tiny Python). Enumerate AS normal forms of degree 3;
        require N_1 in {1,2,3,4,5} with dual point-count agreement; freeze
        stage0/preregistered-predictions.json and stage0/genus1-census.json.
      - >-
        Stage 1. Enumerate AS normal forms of degrees 11 and 13; compute
        N_1..N_g, L-polynomial, P(1); report hit counts for 131 | P(1);
        genus-2 P(1) histogram (H1 tail); dual-count spot checks; write
        stage1/panels.json, stage1/control-table.json, RESULTS.md with
        exactly one O-* label. Ladder eliminant degree recorded as
        UNMEASURED_STAGE2.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Stage-2 ladder eliminant computation under this card.
      - Editing IDEA-20261002-8f26ce claim text or GOAL-FROB-6333a9.yaml.
      - Treating infra failure as mathematical evidence.

  execution_surface:
    trial_plan: experiments/EXP-FROB-f495ea/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-FROB-f495ea/implementation/run.py --stage 0
      --trial-plan experiments/EXP-FROB-f495ea/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-FROB-f495ea/implementation/run.py --stage 1
      --trial-plan experiments/EXP-FROB-f495ea/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. implementation/run.py +
      check.py + gf2.py are the hash-bound sources. {run_dir} is substituted
      by the process supervisor.

  inputs:
    target_prime: 131
    ladder_primes: [19, 23, 31, 41]
    genera: {1: 3, 2: 5, 5: 11, 6: 13}
    source_idea: ledger/proposals/IDEA-20261002-8f26ce.yaml
    hypothesis: ledger/hypotheses/H-FROB-f3d248.yaml
    open_problem: knowledge/open-problems/KN-OPEN-095df5.md

  controls:
    - name: genus1_N1_universe
      definition: Every deg-3 normal form has N_1 in {1,2,3,4,5}.
    - name: dual_point_count
      definition: >-
        point_count_as and point_count_as_alt agree on five fixed forms
        per genus before hits are kept.
    - name: genus2_weil_ceiling
      definition: Every genus-2 P(1) lies in 1..34.
    - name: tau_canonicalisation_cost
      definition: Predicted cost one field addition (recorded, not timed as claim).

  independent_variables:
    - name: stage
      levels: [0_genus1_freeze, 1_hit_table]
    - name: genus
      levels: [1, 2, 5, 6]

  metrics:
    primary:
      - name: hit_count_g5
        unit: integer
        definition: Number of deg-11 normal forms with 131 | P(1).
      - name: hit_count_g6
        unit: integer
        definition: Number of deg-13 normal forms with 131 | P(1).
      - name: genus1_census_ok
        unit: boolean
        definition: All deg-3 N_1 in {1,2,3,4,5} with dual agreement.
    secondary:
      - name: normal_form_count
        unit: integer
        definition: Orbit-reduced form counts per degree.
      - name: genus2_histogram_P1
        unit: map
        definition: Multiset of P(1) at genus 2.
      - name: wall_clock_seconds
        unit: seconds
        definition: Measured wall clock (reported; not a pre-committed claim).
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS if available (secondary).

  heuristic_under_test: H1

  preregistered_prediction:
    quantity: >-
      Genus-1 N_1 universe {1,2,3,4,5}; Stage-1 hit counts are integers;
      O-HIT iff hit_g5+hit_g6>=1 else O-EMPTY (after controls).
    formula: >-
      N_k = 1 + 2|{x in F_{2^k} : Tr(f(x))=0}|;
      L via Newton on P_j=2^j+1-N_j; P(1)=sum a_i.
    source: >-
      ledger/proposals/IDEA-20261002-8f26ce.yaml predictions +
      proof_search_map; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Point counts only over F_{2^k} for k<=6. Hit counts are family-scoped
      integers. No transfer of a hit into an n=131 attack is claimed.
    correspondence: null

  tail_checks:
    - Genus-2 P(1) outside 1..34 voids the instrument (O-ARTIFACT).
    - Dual-count disagreement voids hit claims (O-ARTIFACT).

  replication:
    seeds: []
    independent_instances: 2
    note: >-
      Enumeration is deterministic (no RNG). Genus-5 and genus-6 tables are
      independent instances. Dual-count is the replication instrument.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 2.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and genus1-census.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-FROB-f3d248.
    - maximum_runs = 4.
    - Do not open Stage-2 eliminant under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Genus-1 census fail → O-ARTIFACT; do not read hit counts as support.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n=131 exponent move → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with genus1_census_ok true (N_1 in {1,2,3,4,5}
    and dual agreement); Stage 1 produces integer hit_count_g5 and
    hit_count_g6 with control table (or a named O-ARTIFACT/O-IMPEDIMENT
    stop); RESULTS.md names exactly one O-* label from H-FROB-f3d248 with
    cited artifacts.

  falsification_criterion: >-
    Any of: genus-1 N_1 outside {1,2,3,4,5}; dual point-count disagreement;
    genus-2 Weil-ceiling violation; a claimed break/exponent under this
    card. (O-EMPTY is a valid scientific negative of O-HIT, not a protocol
    fail.)

  required_artifacts:
    - experiments/EXP-FROB-f495ea/trial-plan-v1.json
    - experiments/EXP-FROB-f495ea/stage0/preregistered-predictions.json
    - experiments/EXP-FROB-f495ea/stage0/genus1-census.json
    - experiments/EXP-FROB-f495ea/stage1/
    - experiments/EXP-FROB-f495ea/RESULTS.md
    - experiments/EXP-FROB-f495ea/runs/<RUN-FROB-*>/
    - experiments/EXP-FROB-f495ea/implementation/run.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
