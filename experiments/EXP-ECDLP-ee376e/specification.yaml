experiment:
  id: EXP-ECDLP-ee376e
  hypothesis_id: H-ECDLP-d5beef
  version: 1
  title: >-
    Crossbred admissibility margin of the descended binary Semaev system,
    computed from committed rank data over a fully published grid, with a
    semi-regular arm supplying a known-admissible positive and the source
    proposal's split-versus-random row count removed as forced
  status: draft
  objective: >-
    NOT A PRIME-FIELD EXPERIMENT. The object is binary-field ECDLP, ordinary
    curves over F_{2^n} reduced by Weil descent to boolean systems over GF(2).
    Decide, at zero solver cost, whether the crossbred algorithm is ADMISSIBLE
    at all on the descended chained-Semaev system, by computing the
    admissibility margin M(D, d, k) from committed EXP-DREG-001 rank artifacts
    over a declared grid, and by comparing the chaining-subtree split against
    matched random splits and against a support-matched semi-regular system. If
    a margin is non-negative anywhere, charge the crossbred cost on the
    Petit-Quisquater diagonal against a TRANSCRIBED published
    F4-at-first-fall cost, with memory beside time. If no margin is
    non-negative while the semi-regular arm admits one, the record delivers a
    named obstruction with a number, which the source proposal itself calls its
    realistic value.
  inputs:
    committed_artifacts: >-
      experiments/EXP-DREG-001 run artifacts at n in {12, 15, 18}. Existence
      confirmed by directory listing in TASK-20260904-c063e5; CONTENTS NOT
      READ, and it is NOT established that any of them records a k-degree
      profile. See the blocking precondition.
    degrees_D: [3, 4, 5]
    splits: >-
      One chaining-subtree split, plus at least three random splits of matched
      size k, per (n, D). Boolean field equations are assigned to one side of
      the split and the assignment is recorded.
    d_grid: >-
      All d from 0 up to D, swept in full. The complete (D, d, k) grid is
      published; the argmin or argmax alone is never reported.
    omega_values: [2, 2.81]
    published_baseline: >-
      The F4-at-first-fall cost for binary Weil-descent ECDLP, recomputed from
      the published formula with its inputs TRANSCRIBED from the primary source
      named in KN-LIT-7607. That source was NOT opened in TASK-20260904-c063e5
      and its formula is not in this contract.
    semiregular_null: >-
      Support-matched semi-regular systems at the same n and the same Macaulay
      dimensions, carrying no chaining graph.
  controls:
    - >-
      BLOCKING PRECONDITION, CHECKED BEFORE ANY MARGIN IS COMPUTED. Do the
      committed EXP-DREG-001 artifacts record k-degree profiles at the required
      (n, D)? If not, the margin computation is a NEW computation, its cost is
      re-estimated, and this arm is reported UNRUN rather than concluded. The
      source proposal lists this as its own confounder and it is not resolved
      by assumption here.
    - >-
      BLOCKING PRECONDITION, SECOND. Crossbred's admissibility condition must
      be stated precisely, with its source. KN-TECH-053, read in full, records
      verbatim that "The crossbred algorithm's construction and parameterisation
      were not obtained at all". A margin computed from a misremembered
      condition is worthless in both directions, so the condition is
      transcribed from an obtained source or the arm is reported UNRUN.
    - >-
      KNOWN-ADMISSIBLE POSITIVE CONTROL, BLOCKING, AND THE INSTRUMENT'S DYNAMIC
      RANGE. The support-matched semi-regular system, on which crossbred is
      known to be usable. The calculator must find at least one (D, d, k) with
      M at or above 0 there. A calculator that reports M negative everywhere on
      a system where crossbred works is wrong, and every negative it reports on
      the Semaev arm is void.
    - >-
      RANDOM-SPLIT ARM at matched k. This is the arm that decides whether the
      chaining graph contributes anything, but ONLY through the margin
      difference and never through a raw row count, see band_non_degeneracy.
    - >-
      PUBLISHED-BASELINE REPRODUCTION, BLOCKING FOR THE COST STAGE. The
      F4-at-first-fall cost is recomputed from the published formula with its
      inputs transcribed, not recalled. If it cannot be transcribed the
      comparison is UNRUN and no curve is plotted.
    - >-
      PARAMETER-SWEEP HONESTY, BLOCKING REPORTING RULE. The whole (D, d, k)
      grid is published. Reporting the argmin alone is an invalidation, not a
      presentational choice, because crossbred's cost model has several free
      parameters and is easy to make look good by tuning.
    - >-
      MEMORY COLUMN, MANDATORY. The partial Macaulay matrix at degree D over
      n' = nm variables is the dominant memory term and published
      F4-at-first-fall costings routinely omit it. It is reported beside time
      on every row, and against rho's O(1) memory.
  independent_variables:
    - system size n in {12, 15, 18}
    - Macaulay degree D in {3, 4, 5}
    - split type, chaining subtree versus matched random
    - split size k, swept
    - k-degree bound d, swept from 0 to D
    - system class, descended Semaev versus support-matched semi-regular
    - omega, 2 and 2.81
  metrics:
    primary:
      - >-
        M(D, d, k), the admissibility margin, an integer, the RANK of degree-D
        Macaulay rows with k-degree at most d minus the count of non-k
        monomials of degree at most d requiring elimination
      - >-
        M_subtree minus M_semiregular at matched (D, d, k) and matched split
        size, an integer, the structural quantity
      - >-
        charged crossbred cost against the transcribed published
        F4-at-first-fall cost, in log_2 operations as a curve in n on the
        diagonal, at both omega values
    secondary:
      - raw count of degree-D rows with k-degree at most d, per split, integer
      - rank of that row set, integer, reported separately from the count
      - total Macaulay dimension per (n, D), integer
      - partial Macaulay peak memory per row of the cost table, in bits
      - the split achieving the maximum margin, and whether it is a subtree split
      - deficit values recomputed from committed artifacts, checked against KN-FIND-006
  heuristic_under_test: HA-1
  preregistered_prediction:
    quantity: >-
      The sign of the maximum admissibility margin M over the declared grid,
      and the margin difference between the chaining-subtree split and the
      support-matched semi-regular system.
    formula: >-
      Crossbred is admissible at (D, d, k) exactly when M(D, d, k) is at least
      0, where M is the rank of the low-k-degree degree-D Macaulay rows minus
      the number of non-k monomials of degree at most d that must be
      eliminated. Outcome (A) is max M at or above 0; outcome (B) is max M
      strictly negative at every n while the semi-regular arm admits a point.
    source: >-
      The margin is defined in H-ECDLP-d5beef. The admissibility condition it
      operationalises is RECALLED, not documented in this corpus, per
      KN-TECH-053's own disclosure; transcribing it is a blocking precondition
      of this contract.
  band_non_degeneracy:
    checked_before_freezing: true
    arms_found_degenerate_and_repaired:
      - >-
        SOURCE ARM REJECTED AS DEGENERATE, AND THE SOURCE'S OWN RIGOROUS
        INGREDIENT IS WHAT FORCES IT. IDEA-20260808-fc5e3e pre-registers, as
        its first prediction, that "Under the subtree split the count should be
        much larger than under a random split of the same size", with the
        falsifier "If the subtree split shows NO advantage over a random split,
        the structural premise fails". COMPUTED, the advantage cannot fail to
        appear. The proposal's own HA-1 states the rigorous part, "rows
        supported entirely within a subtree have k-degree 0 with respect to any
        k disjoint from that subtree; the chaining graph guarantees such rows
        exist". A subtree split is therefore GUARANTEED to place a whole block
        of rows at k-degree 0, while a random split of the same size scatters
        the same rows across the k-variables and in expectation places strictly
        fewer there. The comparison is a theorem about the construction, its
        nominated falsifier is unreachable, and a positive result from it would
        certify nothing.
      - >-
        REPAIR, COMPUTED, NOT A LOOSENED THRESHOLD. The row COUNT comparison is
        demoted to a descriptive secondary metric and the discriminator is
        replaced by the ADMISSIBILITY MARGIN M, defined on RANK rather than on
        row count and net of the monomials that must be eliminated. Rank is
        exactly where the forcing argument stops, since guaranteeing that rows
        exist says nothing about whether they are independent, and the source's
        own HA-1 concedes this in the words "whether there are ENOUGH of them
        and whether they are independent". Subtracting the elimination
        requirement is what turns a count into a decision.
      - >-
        SECOND REPAIR, ON THE STRUCTURAL CLAIM. A raw positive margin could
        arise merely because the system is large, since M scales with the
        Macaulay dimension. The structural quantity is therefore the DIFFERENCE
        between the subtree margin and the support-matched semi-regular margin
        at matched dimension, which is zero if the chaining graph contributes
        nothing.
    surviving_bands_and_their_separations:
      - >-
        MARGIN SIGN. M is an integer whose magnitude scales with the Macaulay
        dimension, which KN-FIND-006 records for this family as growing from
        about 29,418 to 145,881 predicted monomials across n. The statistic is
        therefore free to take values of either sign at magnitudes four to five
        orders above unit resolution, and nothing in the construction pins it
        near zero. Its sign is open in both directions and it decides the
        record. NON-DEGENERATE.
      - >-
        KNOWN-ADMISSIBLE POSITIVE. The semi-regular arm must return at least
        one non-negative margin, which exercises the calculator in the positive
        direction on a system where the answer is known independently. Without
        it a uniformly negative Semaev result is indistinguishable from a
        calculator that can only return negatives.
      - >-
        The deficit values recomputed from committed artifacts are checked
        against KN-FIND-006's exact figures, deficit(D=3) = 1 and
        deficit(D=4) = 8k - 1, and against the null arm's exact deficit of 0.
        These are FORCED reproduction checks on the pipeline, not evidence.
  scale_relevance:
    tier: toy
    justification: >-
      n in {12, 15, 18}, which are toy system sizes for this family, and per
      RQ-ALBIN-001 historical imports are empirical_only unless independently
      re-verified. The cost curve on the Petit-Quisquater diagonal is an
      EVALUATED FORMULA at every n, never a measured cost, and its crossover if
      any is a statement about two cost models. Cryptographic n is UNTESTABLE
      AT REACHABLE SCALE and no promotion beyond toy tier is available at any
      outcome.
    correspondence: null
  tail_checks:
    - >-
      Report the split achieving the maximum admissible margin and check
      whether it is a subtree split or a random one. If the best split is
      random, the structural story is wrong even if the margin is adequate.
    - >-
      Report the margin at every grid point, including the worst, so that a
      single favourable point cannot stand for the grid.
    - >-
      Report the ratio of rank to raw row count per split, so that a large row
      count masking heavy dependence is visible.
  replication:
    seeds: [20260904, 20260905]
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 6
    maximum_memory_gb: 16
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - >-
      STEP 0, BLOCKING. Check both preconditions, k-degree profiles present in
      committed artifacts, and crossbred's admissibility condition transcribable
      from an obtained source. If either fails, report UNRUN with the reason and
      stop. Do not proceed on a recalled condition.
    - >-
      STEP 1, BLOCKING. Run the semi-regular known-admissible control. If it
      admits no (D, d, k), halt; the calculator is wrong and no Semaev margin
      is read.
    - >-
      STEP 2. Compute the full grid on the Semaev arm and on the random-split
      arms. If max M is strictly negative everywhere, STOP at outcome (B) and
      do not run the cost stage. The obstruction is the deliverable.
    - >-
      STEP 3. Only if max M is non-negative, transcribe the published formula
      and charge the cost curve. If the formula cannot be transcribed, the cost
      comparison is UNRUN.
    - >-
      STEP 4. Only if steps 2 and 3 are both favourable, run ONE small
      end-to-end crossbred solve at n = 12 as a plumbing check. It is a
      plumbing check and not a result.
    - >-
      Stop at D = 5 or when the partial Macaulay at the next D would exceed the
      memory cap, and report which.
  invalidation_rules:
    - >-
      The margin is computed from a row COUNT rather than from a RANK.
    - >-
      The argmin or argmax over (D, d, k) is reported without the full grid.
    - >-
      The published baseline is recalled rather than transcribed.
    - >-
      The partial Macaulay memory is omitted from any row of the cost table.
    - >-
      The identifiers "E2-02", "E2-03", "E2-07" or "E2-08" are cited as though
      they resolved to records. They are internal generator labels that leaked
      into the ledger and are defined nowhere, a defect documented in
      ideas/rescreen-20260808/slice1.md. No claim in this contract may rest on
      them.
    - >-
      Any result is promoted above toy tier, contrary to RQ-ALBIN-001's
      constraints.
    - >-
      Any timeout, crash, or memory exhaustion is reported as a mathematical
      result rather than as an infrastructure outcome, per AGENTS.md rule 5.
  success_criterion: >-
    One of two complete outcomes, both of which are successes for this
    contract. OUTCOME A, the semi-regular control admits a point, the
    preconditions pass, max M over the grid is non-negative on the Semaev arm,
    M_subtree minus M_semiregular is positive, and the charged crossbred cost
    curve is plotted against a transcribed published baseline at both omega
    values with memory beside time. OUTCOME B, the semi-regular control admits
    a point, the preconditions pass, and max M is strictly negative at every
    grid point at every n, delivering a named obstruction with a measured
    margin and a stated scope. Anything else is UNRUN or void, not a result.
  falsification_criterion: >-
    HA-1 is falsified, scoped to n in {12, 15, 18}, D in {3, 4, 5}, the
    declared splits and the transcribed admissibility condition, when max M is
    strictly negative at every grid point while the semi-regular control admits
    at least one. The structural premise is separately falsified when
    M_subtree minus M_semiregular is not positive, which reaches outcome (B) by
    the cheapest route. The cost claim is falsified when the charged crossbred
    curve lies above the transcribed published curve across the whole diagonal
    at both omega values.
  required_artifacts:
    - the precondition check output, naming which committed artifacts carry k-degree profiles
    - the transcribed crossbred admissibility condition with its obtained source, filed as a new KN-LIT entry
    - the full (D, d, k) grid of margins for every split and every system class, published entire
    - rank and raw row count reported separately at every grid point
    - the semi-regular known-admissible control's results, reported before any Semaev margin
    - the deficit reproduction check against KN-FIND-006's exact figures
    - the transcribed published F4-at-first-fall formula with its inputs, if the cost stage runs
    - the two cost curves at both omega values with memory beside time, if the cost stage runs
    - the n = 12 plumbing solve, if step 4 runs, labelled a plumbing check
    - manifest per AGENTS.md artifact policy, including seeds, environment and dirty-tree state
  assigned_to: executor
  approved_by: null
