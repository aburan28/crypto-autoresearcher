# EXP-ECDLP-911c16
# Rational substitution for two theta coefficients. No character sums.
# Approved by DEC-20261001-90802d.
experiment:
  id: EXP-ECDLP-911c16
  hypothesis_id: H-ECDLP-208a11
  source_idea: IDEA-20260920-a58be0
  question_id: RQ-ECDLP-160d89
  version: 1
  title: Which theta coefficient leaves a positive cross-energy remainder
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-90802d
  objective: >-
    Compare the off-spectrum coefficients M/(16b) and M/(4b) with the lower
    bound coefficient M/(2b). Record the ratios and the remainders after
    subtracting the ratio twice. Check the numeric point M = 16, b = 4.
  inputs:
    lower_coefficient: M/(2*b)
    good_off_coefficient: M/(16*b)
    bad_off_coefficient: M/(4*b)
    numeric: {M: 16, b: 4}
    predicted:
      good_ratio: "1/8"
      good_remaining: "3/4"
      bad_ratio: "1/2"
      bad_remaining: "0/1"
      bad_label: does_not_suffice
  controls:
    - The larger theta is labeled does_not_suffice. Labeling it suffices invalidates the run.
    - Two arithmetic implementations. They must not import each other.
  independent_variables:
    - implementation
    - threshold in {good, bad}
  metrics:
    primary:
      - good_ratio
      - good_remaining
      - bad_ratio
      - bad_remaining
      - numeric_matches_symbolic
      - bad_label
      - implementations_agree
    secondary:
      - numeric_lower
      - numeric_good_off
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The four rationals and the numeric agreement.
    formula: >-
      good_ratio = (M/(16b)) / (M/(2b)) = 1/8.
      bad_ratio = (M/(4b)) / (M/(2b)) = 1/2.
      remaining = 1 - 2*ratio.
    source: >-
      IDEA-20260920-a58be0 claims B1 and B2, read 2026-10-01. The ratios
      were reduced by hand in this design session. That reduction is not a
      run. No character sum was computed.
  scale_relevance:
    tier: toy
    justification: Identities in two positive integers. No group and no curve.
    correspondence: null
  tail_checks:
    - M and b cancel. A routine that fails when M and b are coprime is invalid.
  replication:
    seeds: []
    independent_instances: 1
    replication_note: Deterministic. The second run is the other arithmetic.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the larger theta is labeled suffices, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either implementation imports the other.
    - bad_label is not does_not_suffice.
    - A character sum or a discrete logarithm is reported.
  success_criterion: >-
    Both runs agree, the good ratio is 1/8, the good remaining is 3/4, the
    bad ratio is 1/2, the bad remaining is 0, the numeric point matches,
    and the bad threshold is labeled does_not_suffice.
  falsification_criterion: >-
    The runs agree, the bad threshold is labeled does_not_suffice, and the
    good ratio is not 1/8 or the good remaining is not 3/4 or the numeric
    point disagrees.
  required_artifacts:
    - experiments/EXP-ECDLP-911c16/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-911c16/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-911c16/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-911c16/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-911c16/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-911c16/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Character sums and fibre partitions.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
