# EXP-ECDLP-9f75a2
# Refutation-degree count arithmetic. No system is solved.
# Approved by DEC-20261003-9f07bd.
experiment:
  id: EXP-ECDLP-9f75a2
  hypothesis_id: H-ECDLP-f0c763
  source_idea: IDEA-20260930-ba8184
  question_id: RQ-ECDLP-f0a7b0
  version: 1
  title: The s list versus the two crosses
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-9f07bd
  objective: >-
    Check the product 6720, the sum 6, and the product 64.
  inputs:
    s_sum: 30
    s_product: 6720
    bounded_sum: 6
    full_sum: 80
    full_product: 967680
    half_product: 720
    cross_hi: 8
    cross_lo: 8
    cross_product: 64
  controls:
    - >-
      The product of 4, 5, 6, 7, and 8 is 6720. Dropping 4 leaves
      1680 and invalidates the run.
    - >-
      Four plus 2 is 6. The full degrees sum to 80 and multiply to
      967680. The half thresholds multiply to 720.
    - >-
      The cross of 9/10 against 1/2 is 8. The cross of 1/2 against
      1/10 is 8. Their product is 64. The s sum is 30.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {product, sum, cross}
    - route in {multiply, add}
  metrics:
    primary:
      - s_product
      - bounded_sum
      - cross_product
      - implementations_agree
    secondary:
      - full_sum
      - full_product
      - half_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The product of 4, 5, 6, 7, and 8 is 6720. Four plus 2 is 6.
      The product of the two crosses is 64.
    formula: >-
      Multiply 4, 5, 6, 7, and 8. Add 4 and 2. Cross 9/10 with 1/2
      and 1/2 with 1/10, then multiply the crosses.
    source: >-
      IDEA-20260930-ba8184 states the s list 4 through 8, the degree
      4, the bounded degree 2, the rung 6, and the percents 90, 50,
      and 10, read 2026-10-03. It does not name the field prime as
      an integer. The products were recomputed in this design
      session. That computation is not a run. No system was solved.
  scale_relevance:
    tier: toy
    justification: Five listed s values and three written percents. No transfer to a refutation degree.
    correspondence: null
  tail_checks:
    - The sum 6 and the product 64 are required. A check that stops at the product 6720 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the product 6720 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The product is not 6720.
    - The sum is not 6.
    - The cross product is not 64.
    - The value 4 is dropped from the s list, or a system is solved.
  success_criterion: >-
    Both runs agree that the product of 4, 5, 6, 7, and 8 is 6720,
    that 4 plus 2 is 6, that the full degrees sum to 80, and that
    the product of the two crosses is 64.
  falsification_criterion: >-
    The runs agree that the product of 4, 5, 6, 7, and 8 is
    computed, and that product is not 6720.
  required_artifacts:
    - experiments/EXP-ECDLP-9f75a2/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-9f75a2/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-9f75a2/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-9f75a2/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-9f75a2/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-9f75a2/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any Groebner solve, Mobius transform, or refutation-degree reading.
    - Any claim that a slope is 0, 1/2, or 1.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
