experiment:
  id: EXP-ASCON-7a1602
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-cfe83d; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-cfe83d
  question_id: RQ-ASCON-2dfd8b
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Enumerate exhaustively over a declared short-length class whether the customized-XOF absorb-sequence
    encoder is injective on (customization string, message) pairs, with a defect-injected sibling
    encoder as the same-invocation null
  objective: 'The one uncertainty a run reduces is whether the mode''s syntactic commitment -- the
    padded, domain-separated block sequence entering the permutation -- distinguishes every pair of
    distinct (Z, M) inputs within a declared finite class. Concretely: (i) does exhaustive enumeration
    over all (Z, M) with lengths in the declared range and symbols in the declared alphabet produce
    two distinct pairs with identical absorb sequences, and if so what is the explicit certificate;
    (ii) does the identical search, run in the same invocation against a sibling encoder with the
    customization-string length prefix deliberately removed, recover exactly the closed-form predicted
    number of boundary-shift collisions, which is the only evidence that the search can see a collision
    at all; (iii) does the encoder reproduce every declared standard test vector before enumeration
    begins, which is the gate separating a measurement of the standard from a measurement of a program-invented
    fiction. The permutation is stubbed throughout and no cryptographic computation occurs. The run''s
    product is a certificate, or a coverage statement with its class boundary named exactly and its
    unenumerated region named.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: over the exact enumerated
      class C (declared lengths, declared alphabet, declared encoder pinned to declared test vectors),
      the absorb-sequence map was injective / was not injective as witnessed by the attached certificate,
      while the same-invocation defect-injected null returned N collisions matching its closed-form
      prediction. WHAT DOES NOT FOLLOW: nothing about inputs outside C, nothing about the full alphabet
      if a reduced one was used, nothing about the permutation, nothing about output distinguishability
      even for a genuine encoder collision without further argument, and nothing whatsoever about
      the security of Ascon-CXOF128 or of any deployed device.'
  inputs:
    procedure: 'STAGE 0 (human time, blocking): obtain and file the standardized specification and
      its test vectors; without this the run does not start. Cost: unbounded in this environment and
      recorded as such. STAGE 1 (about a day): implement the absorb-sequence encoder with the permutation
      stubbed, plus a second independent implementation for cross-checking. Cost: implementation only.
      STAGE 2 (minutes): run the test-vector gate through the full mode; halt on any mismatch. STAGE
      3 (seconds to minutes of CPU): enumerate the declared class, canonicalise, insert into a collision
      dictionary, and re-verify every candidate by direct byte comparison. STAGE 4 (seconds, same
      invocation): run the identical enumeration against the defect-injected null encoder and against
      a random-output encoder, comparing counts to the closed-form and birthday predictions. STAGE
      5 (minutes): cross-check a random 1 percent of absorb sequences between the two implementations.
      STAGE 6 (minutes): emit the run record with the class boundary, the unenumerated region, both
      arms'' counts, the implementation diff and the seeds.'
    instrument: Python 3.11 standard library for the encoder and the enumeration; a pinned pure-Python
      Ascon permutation used ONLY to reproduce the mode's declared test vectors at the gate, never
      inside the enumeration; hashlib for absorb-sequence keys; pytest for the vector gate and the
      tail checks; harness/runner.py for the manifest, seeds and the inference block. No Sage, no
      computer algebra system, no SAT solver, no network access.
    parameters: 'Customization string length |Z| in 0..3 bytes; message length |M| in 0..3 bytes;
      alphabet reduced to 4 declared symbols, giving a class of roughly 3 times 10 to the 5 pairs;
      a widened secondary sweep at |Z|,|M| in 0..2 over the full 256-symbol alphabet as a robustness
      check where feasible. Test-vector set: every vector the standard declares for the customized
      XOF. Cross-check sample 1 percent of enumerated pairs. Two seeds for the random-output null
      encoder.'
  controls:
  - Defect-injected null encoder (customization-string length prefix removed), identical search, same
    invocation, with the implementation diff attached.
  - Random-output null encoder of matched output length, which must produce collisions at the birthday
    rate for the enumerated count, calibrating the collision detector itself.
  - 'Test-vector gate: the encoder must reproduce every declared standard test vector through the
    full mode before enumeration starts, and the run halts otherwise.'
  - Independent re-verification of every candidate collision by direct byte comparison outside the
    hash table, so a dictionary bug cannot manufacture a hit.
  - Second implementation of the encoder by a different code path used to cross-check a random 1 percent
    sample of absorb sequences.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A DEFECT-INJECTED SIBLING ENCODER, built by the same code with one
    declared change -- the customization-string length prefix removed, so that (Z || M) is absorbed
    without a boundary marker -- enumerated by the IDENTICAL search routine over the IDENTICAL class
    in the SAME process invocation. For the signal arm''s negative result to mean anything, the null
    arm must return a nonzero and roughly predictable number of collisions: the count of pairs that
    differ only by moving bytes across the Z/M boundary. If the null returns zero, the search cannot
    see collisions at all and the signal arm''s silence is a property of the search, not of the encoder.
    A second null runs a randomly permuted-output encoder of the same output length, which must return
    collisions at the birthday rate for the enumerated count.'
  independent_variables:
  - encoder arm (standardized / defect-injected null / random-output null)
  - customization-string length |Z| across the declared range
  - message length |M| across the declared range
  - alphabet size (reduced 4-symbol class versus full-byte secondary sweep)
  metrics:
    primary:
    - signal-arm collision count over the declared class
    - defect-injected null collision count versus its closed-form prediction
    - random-output null collision count versus the birthday expectation
    - test-vector agreement rate at the gate
    secondary:
    - enumerated class size, stated exactly
    - cross-implementation agreement rate on the 1 percent sample
    - distribution of absorb-sequence lengths across the class
    - wall-clock and peak memory for the enumeration
  heuristic_under_test: null
  preregistered_prediction:
    quantity: N_null, the number of colliding pairs recovered by the identical search against the
      length-prefix-removed encoder over the declared class.
    formula: For an encoder that absorbs Z || M with no boundary marker, two pairs collide exactly
      when their concatenations are equal, so N_null equals the number of unordered pairs {(Z1,M1),(Z2,M2)}
      with Z1||M1 = Z2||M2 and (Z1,M1) distinct from (Z2,M2); over the declared class this equals
      the sum over each concatenation string s in the reachable set of C(k(s), 2), where k(s) is the
      number of admissible splits of s into a Z-part and an M-part with both lengths inside the declared
      ranges. This is computed in closed form BEFORE the run and the measured N_null must equal it
      exactly.
    source: Pre-registered in the parent proposal IDEA-20260816-cfe83d before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are short customization strings and messages over a reduced
      alphabet, chosen so the word exhaustive is literal rather than aspirational. The transfer assumption
      is stated and is weak in one direction only: a collision found at short lengths is a genuine
      encoder defect independent of scale, while injectivity at short lengths transfers to longer
      inputs ONLY under the additional assumption that the encoder''s boundary rules do not change
      behaviour at block boundaries beyond those enumerated -- an assumption this experiment does
      NOT test, which is why the secondary sweep deliberately includes at least one length that crosses
      a rate boundary and the unenumerated region is named in the deliverable.'
    correspondence: null
  tail_checks:
  - Empty customization string with nonempty message, and the mirror case, which are the classic boundary
    inputs for a separation defect.
  - Inputs whose total length lands exactly on a rate block boundary, where padding rules fire differently.
  - Inputs whose total length is one byte short of and one byte past a rate boundary.
  - Maximum-length pair in the declared class, confirming no truncation occurs in the encoder or the
    dictionary key.
  - A hand-built pair known to collide under the defect-injected encoder, asserted to be found by
    the search as a positive control on the detector.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt before enumeration if any declared test vector fails.
  - Halt and report a detector defect if the defect-injected null returns zero collisions or a count
    differing from the closed-form value.
  - Stop enumeration at the declared class boundary; do not extend the class after seeing the signal-arm
    result, since post-hoc extension would convert a coverage statement into a search.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The encoder passes every declared test vector, the enumeration covers the declared
    class exactly and exhaustively, the defect-injected null returns exactly its closed-form collision
    count and the random-output null returns collisions at the birthday rate, and the signal arm's
    collision count is reported with the class boundary and unenumerated region named -- whichever
    value that count takes.
  falsification_criterion:
  - Any declared test vector fails at the gate.
  - The defect-injected null returns zero collisions, or a count not equal to the closed-form prediction.
  - The random-output null's collision count is inconsistent with the birthday expectation, indicating
    a broken detector.
  - The two independent encoder implementations disagree on any cross-checked absorb sequence.
  - A candidate collision passes the dictionary but fails independent byte comparison.
  - The declared class cannot be enumerated within budget, in which case the exhaustive claim is withdrawn
    and the result is reported as a partial coverage statement -- a budget outcome, never mathematical
    evidence.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-cfe83d
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The standardized customized-XOF encoder is not pinned in this environment. A Coordinator must
    obtain SP 800-232 and its test vectors and file them as KN-LIT entries, because RQ-ASCON-2dfd8b
    forbids designing an experiment until both documents are filed.
  - The declared-class convention must be reconciled with GOAL-BLAKE-001's tree-mode enumeration convention,
    per GOAL-ASCON-001's non-duplication clause, or an explicit refusal recorded.
  - The nine other proposals matched by the domain.separation grep were seen by filename only; a Coordinator
    must read them and confirm none already occupies this surface.
  - The choice of exactly one injected defect for the null is arbitrary; a Coordinator should decide
    whether a second, subtler defect arm is required for the null to be a fair test of detector sensitivity.
