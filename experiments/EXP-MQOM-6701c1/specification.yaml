experiment:
  id: EXP-MQOM-6701c1
  hypothesis_id: H-MQOM-c1bf10
  derived_from_idea: IDEA-20260805-7d97be
  question_id: RQ-MQOM-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    The matched unstructured null for the structured-MQ family - exact Macaulay rank on an
    MQOM-shaped random arm against a frozen semi-regular prediction, with a graded oil-dimension
    sweep, a forced positive control at o = floor(n/2), a seed control that reports spread before
    model error, and a verdict written on the null arm before any structured arm is read
  objective: >-
    The one uncertainty a run reduces is whether this program can measure a structured MQ map
    against anything. A run establishes (i) whether the exact degree-D Macaulay rank of an
    MQOM-shaped random map matches a semi-regular prediction FROZEN before any linear algebra, at
    every reachable cell with nv >= 6 and across at least three seeds - which is a direct test of a
    model many contracts in this corpus inherit; (ii) whether the rank is coefficient-independent as
    that model asserts, measured as seed-to-seed spread and reported BEFORE any model error;
    (iii) whether a hidden oil space of dimension o produces a rank deficit that grows with o, with
    a positive control at o = floor(n/2) where the deficit is forced by the existence of a
    linear-algebra solution; and (iv) the environment probe recording exactly which algebra backends
    are and are not available. The deliverable is an instrument plus a calibration curve, not an
    extrapolation. No attack on any scheme is proposed and no cell may be read as a statement about
    deployed parameters.
  what_this_is_not:
  - >-
    Not an attack on MQOM, UOV, MAYO, QR-UOV or SNOVA, not a break, not a distinguisher, and not a
    new MQ solver. It is a control.
  - >-
    Not a reproduction of any published structural attack, and not a use of any relayed result. The
    2026 results relayed in the parent proposal were not read and no number from them enters any
    computation here.
  - >-
    Not a statement about deployed parameters. Everything reachable is toy - n at most about 12 over
    F_2 and about 8 over the larger fields, against MQOM's own 48 to 320.
  - >-
    Not a statement about MQOM's forgery bound, its seed-tree machinery, or its implementation.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the executed (q, nv, m, D, o, seed) cells, the exact Macaulay rank
      does or does not equal the frozen semi-regular prediction; the seed-to-seed spread takes a stated
      value; the rank deficit as a function of oil dimension takes stated values with a stated
      monotonicity verdict; and the positive control does or does not fire. WHAT DOES NOT FOLLOW - no
      statement about any deployed parameter set of any scheme; no break; no exponent; and specifically
      NOT that a structured scheme is or is not weakened, since the structured arm is a hand-built SHAPE
      and is labelled UOV-SHAPED throughout.
  inputs:
    procedure: >-
      STAGE 0, zero compute, minutes - record the environment probe VERBATIM. The numpy version, the
      sympy import result, the sage import result, and the exact failure line of the repository's
      existing first-fall instrument. This answers, on the record, which algebra backend is available
      and states that the existing Macaulay lineages in this corpus measure a DIFFERENT object.
      STAGE 1, zero compute, seconds - evaluate the semi-regular series in exact integer arithmetic for
      EVERY planned cell and freeze the predicted rank table BEFORE any linear algebra is run. Commit it
      as the pre-registration and hash it. Also evaluate, at every planned m = nv cell out to D_max,
      whether a_D is strictly positive, so the "no semi-regular solving degree at m = nv" prediction is
      frozen as an exact integer statement rather than an assertion.
      STAGE 2, minutes to an hour, F_2 cells - measure exact GF(2) Macaulay rank for the o = 0 NULL ARM
      at n = m in {4, 6, 8, 10, 12} and D in {2, 3, 4}, three seeds per cell. Report null-arm agreement
      and seed-to-seed spread, and WRITE THE VERDICT ON THE NULL ARM, before any structured arm is read.
      STAGE 3, F_2 - the graded oil sweep at the largest affordable n, o over {0, 1, 2, 3, 4, floor(n/2)},
      identical seeds, identical monomial support, three seeds per cell. Report the deficit curve, its
      monotonicity per adjacent pair, and the positive-control deficit at o = floor(n/2) with m <= o.
      STAGE 4, optional and OUTSIDE the completion gate - the same at n = m in {4, 6, 8} over F_16 and
      F_256 with a table-driven field. If the port does not land inside budget, report it as
      infrastructure and stop.
      STAGE 5, zero compute - the ARCHIVE CHECK. List every archived rank measurement in this corpus and
      state its applicability explicitly; the existing boolean chained-Semaev measurements are NOT
      applicable and the non-applicability is recorded rather than claimed as a passed check.
    instrument: >-
      Pure Python exact linear algebra over a table-driven finite field of size 2, 16 or 256. Over F_2 the
      field equations are carried, so columns are squarefree monomials of degree at most D and rows are
      products reduced modulo x_i^2 = x_i. Ranks are exact integers; there is no floating point anywhere.
      The repository's existing d_reg tooling is F_2-by-construction and cannot be imported without Sage,
      so the port is part of the work and is declared as a cost. Recorded through harness/runner.py.
    parameters: >-
      q in {2, 16, 256}. Over F_2, n = m in {4, 6, 8, 10, 12}; over F_16 and F_256, n = m in {4, 6, 8}.
      D in {2, 3, 4}, with D_max frozen in Stage 1 and never chosen after seeing where a deficit appears.
      Oil dimension o over {0, 1, 2, 3, 4, floor(n/2)}, with the positive-control cell additionally
      constrained to m <= o. Three seeds per cell, seeds derived from the declared replication seeds.
      Monomial support and degree histogram matched between arms as a CHECKED PRECONDITION recorded per
      cell, not as an intention.
  controls:
  - >-
    NULL OBJECT OF THE SAME SHAPE, forced value derived before the run, ABLE TO FAIL - the o = 0 arm IS
    the MQOM-shaped map, and its predicted rank at every cell is the exact integer C(nv+D, D) - a_D
    computed and committed in Stage 1. It can fail at every single cell. This is the null the structured-MQ
    goals have never had.
  - >-
    POSITIVE CONTROL, MUST FIRE - a UOV-shaped system at o = floor(n/2) with m <= o, where the oil space
    gives a linear-algebra solution and the Macaulay rank MUST fall below the semi-regular prediction.
    Threshold declared before the run - strictly positive deficit at D = 3. If the instrument does not fire
    here, NO negative result may be reported from any arm at all.
  - >-
    GRADED CONTROL with at least four interior points and monotonicity reported per adjacent pair - o swept
    over {0, 1, 2, 3, 4, floor(n/2)} at fixed (q, n, m). This localises at which o the deficit turns on
    rather than leaving "the instrument saw nothing".
  - >-
    SEED CONTROL - at least three seeds per cell, with the seed-to-seed spread of the measured rank reported
    BEFORE any model error is reported. Semi-regularity asserts the rank is coefficient-independent, so a
    nonzero spread at any cell is itself a refutation of the assumption at that size and must be reported
    first.
  - >-
    SUPPORT-MATCHING PRECONDITION, checked per cell - the two arms must share (q, n, m), the monomial support
    and the degree histogram. A cell where they do not is not measured and is recorded as excluded. This
    corpus has a worked failure from comparing arms that differed in the parameter that forced the statistic.
  - >-
    VERDICT-ON-THE-NULL-FIRST, blocking - the decision rule is executed and the verdict committed on the
    o = 0 arm before any structured arm is read.
  - >-
    D_max FREEZE - D_max is fixed in Stage 1 before any linear algebra. Choosing it after seeing where a
    deficit appears would be fitting.
  - >-
    ARCHIVE CHECK, zero compute - every archived rank measurement in this corpus is listed with an explicit
    applicability statement. The existing boolean chained-Semaev lineages measure a different object at a
    different construction and are NOT applicable; that non-applicability is recorded, never claimed as a
    passed check.
  independent_variables:
  - field size q
  - number of variables nv and number of equations m
  - Macaulay degree D
  - oil dimension o, with o = 0 being the matched null
  - seed
  metrics:
    primary:
    - >-
      rank_measured per (q, nv, m, D, o, seed) - the exact rank of the degree-D Macaulay matrix over the
      stated field, an integer, with the elimination order and the field-equation convention stated.
    - >-
      null_arm_model_agreement - fraction of o = 0 cells with nv >= 6 whose rank_measured equals the frozen
      Stage 1 prediction C(nv+D, D) - a_D, dimensionless. FORCED 1.00.
    - >-
      seed_to_seed_spread per cell - max minus min of rank_measured across seeds, in ranks. FORCED 0.
      Reported BEFORE any model error.
    - >-
      rank_deficit per (q, n, m, D, o) - frozen prediction minus rank_measured, in ranks, averaged over
      seeds with the per-seed values also reported.
    - >-
      graded_monotonicity - pass or fail per adjacent pair of oil dimensions on whether rank_deficit is
      non-decreasing, plus whether at least one step is strictly positive.
    - >-
      positive_control_deficit - rank_deficit at o = floor(n/2) with m <= o at D = 3, in ranks. FORCED
      strictly greater than 0.
    - >-
      saturation_count_at_m_equals_nv - the number of m = nv cells where rank_measured reaches
      C(nv+D, D) at some D at or below D_max, an integer. FORCED 0.
    secondary:
    - >-
      discrimination_ratio - rank_measured in the structured arm divided by rank_measured in the matched null
      arm at identical (q, n, m, D, support), dimensionless. Exactly 1.00 at o = 0 by construction.
    - >-
      the frozen Stage 1 predicted rank table, cell by cell, as exact integers with its hash.
    - >-
      the verbatim Stage 0 environment probe, including the exact import failure line of the existing
      instrument.
    - >-
      instrument_port_status - which of F_2, F_16, F_256 completed, reported not predicted.
    - >-
      per-cell wall clock and peak memory, which bound the reachable n and are reported so the ceiling is a
      measurement rather than an assertion.
    - >-
      the support-matching precondition result per cell, and the list of excluded cells with reasons.
  heuristic_under_test: HEUR-MQOM-NULL-1
  preregistered_prediction:
    quantity: >-
      null_arm_model_agreement over all o = 0 cells with nv >= 6; saturation_count_at_m_equals_nv; and
      positive_control_deficit.
    formula: >-
      rank_D = C(nv+D, D) - a_D below the solving degree, where a_D is the coefficient of z^D in
      (1 - z^2)^m / (1 - z)^(nv + 1); predicted agreement 1.00 at every cell with nv >= 6. At m = nv the
      series collapses to (1+z)^nv / (1-z), so a_D is a partial sum of binomial coefficients and is strictly
      positive for every D - hence no semi-regular solving degree exists at MQOM's own shape and
      saturation_count_at_m_equals_nv is predicted EXACTLY 0. positive_control_deficit is predicted strictly
      greater than 0 at D = 3. Under the null that the instrument has no power, the graded deficit curve is
      flat at every o including o = floor(n/2).
    source: >-
      The series is the MQOM v2.1 specification's own semi-regular model, section 4.2, as transcribed in
      IDEA-20260805-be7738 and quoted by the parent proposal IDEA-20260805-7d97be. It is taken as a CANDIDATE
      TO TEST, not as an authority. The m = nv collapse and the strict positivity of a_D were evaluated in the
      parent proposal's ideation session out to D = 60 at the nine listed MQOM (q, n=m) pairs; that is a
      derivation from the series, not a measurement, and Stage 1 re-evaluates it in exact integer arithmetic
      before any rank is measured.
  scale_relevance:
    tier: toy
    justification: >-
      Exact rank over a small field in pure Python is affordable to about n = 12 over F_2 and about n = 8 over
      F_16 and F_256 at D at most 4, against MQOM's own n of 48 to 320. That gap is not bridged and no
      extrapolation is attempted - the deliverable is an INSTRUMENT PLUS A CALIBRATION CURVE, precisely
      because this program has a recorded history of toy-to-cryptographic leaps failing. The one transfer that
      the design does rely on is stated and is narrow - that a rank deficit visible at reachable n is evidence
      the instrument CAN see oil structure at all, which is why the positive control at o = floor(n/2) is
      forced and blocking rather than merely expected.
    correspondence: null
  tail_checks:
  - >-
    Report the per-seed ranks at every cell, not only their spread, so that a single anomalous seed is visible
    rather than averaged into a deficit.
  - >-
    Report the largest D reached at each n with its wall clock and peak memory, so the instrument's ceiling is
    a measured boundary that downstream records can cite rather than infer.
  - >-
    Report, for every cell where rank_measured differs from the frozen prediction, the exact difference and
    whether it replicates across at least two seeds - a single-seed disagreement is not a refutation.
  - >-
    Report the deficit at each o separately per D, since a deficit visible only at the largest D is a different
    statement from one visible at D = 2, and pooling would hide which.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 6.0
    maximum_memory_gb: 16
    maximum_runs: 30
  stopping_rules:
  - >-
    HALT the interpretation of every arm if the positive control at o = floor(n/2) with m <= o produces no
    deficit at D = 3. Nothing negative may be reported from any arm.
  - >-
    Order cells smallest-first and stop adding cells when a cell exceeds its wall clock or memory; report
    exactly which cells were covered. An uncovered cell is uncovered, never an inferred value.
  - >-
    Stage 4's F_16 and F_256 port is OUTSIDE the completion gate. If it does not land inside budget, report it
    as infrastructure and stop; the F_2 cells stand on their own.
  - >-
    Stop at the declared cell set and the frozen D_max. No cell, degree or oil dimension is added after any
    rank is seen.
  - >-
    Stop at maximum_runs, total_cpu_hours or maximum_memory_gb, whichever binds first. Budget exhaustion is a
    stop, never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure and is NEVER
    negative mathematical evidence (AGENTS.md rule 5). In particular, an incomplete port is an infrastructure
    outcome and never a statement about any scheme.
  - >-
    A run whose null arm was not executed in the same invocation, at the same cells, with the same seeds and
    the same monomial support as the structured arm, is invalid_measurement - the comparison this contract
    exists to make was not made.
  - >-
    A run that reads or reports any structured-arm result before the null-arm verdict is committed is
    invalid_measurement, because the ordering control is the only defence against a threshold adjusted to a
    known deficit.
  - >-
    A run whose D_max was chosen after any rank was measured is completed_invalid.
  - >-
    A run reporting an approximate or floating-point rank is completed_invalid; ranks are exact integers.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a new
    contract; it is never a repair of this one.
  success_criterion: >-
    The instrument is delivered and the matched null is established when ALL of the following hold, each
    decidable from the primary metrics -
    (1) the Stage 1 predicted rank table was frozen and hashed before any linear algebra;
    (2) seed_to_seed_spread is 0 at every measured cell;
    (3) null_arm_model_agreement is 1.00 over every o = 0 cell with nv >= 6;
    (4) saturation_count_at_m_equals_nv is 0;
    (5) positive_control_deficit is strictly greater than 0 at D = 3;
    (6) graded_monotonicity is non-decreasing at every adjacent pair with at least one strictly positive step;
    (7) the Stage 0 environment probe and the Stage 5 archive check are recorded verbatim.
    Failure of (5) means nothing is reportable. Failure of (6) alone means the instrument has no power at
    these sizes, which is a measured limitation and is reported with its exact boundary. Failure of (2), (3)
    or (4) is a refutation of the semi-regular model at the tested size and is reported FIRST.
  falsification_criterion:
  - >-
    Any o = 0 cell at nv >= 6 whose exact rank differs from the frozen prediction, replicated across at least
    two seeds. HEUR-MQOM-NULL-1 is REFUTED at that size, scoped exactly to the tested (q, nv, m, D). This is
    the most consequential outcome available and requires independent replication before any downstream record
    cites it.
  - >-
    Nonzero seed_to_seed_spread at any cell. Semi-regularity's coefficient-independence claim is refuted at
    that size, and it is reported before any model error.
  - >-
    A saturation at m = nv. The frozen prediction's underlying series identity is false as applied; the
    pre-registration is superseded, not edited.
  - >-
    positive_control_deficit is 0. Instrument broken - infrastructure signal under AGENTS.md rule 5, never a
    mathematical negative, and no arm is interpretable.
  - >-
    graded_monotonicity is flat at every step INCLUDING o = floor(n/2). HEUR-MQOM-NULL-2 is falsified - the
    instrument has no power at the reachable sizes. This is a genuine negative about the INSTRUMENT, is
    reported with its exact boundary, and it forbids any statement about UOV, MAYO, QR-UOV or SNOVA.
  - >-
    Seed-to-seed spread comparable to or larger than the deficits measured. The instrument is measuring noise
    and must be reported as doing so, not as a fit.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
  - the frozen Stage 1 predicted rank table with its hash, committed before any linear algebra ran
  - raw-result.json carrying rank_measured per (q, n, m, D, o, seed) as exact integers, with the field, elimination order and field-equation convention stated
  - the null arm's measurements and its committed verdict, demonstrably written before any structured arm was read
  - the graded oil sweep with per-adjacent-pair monotonicity verdicts and the positive-control cell
  - the verbatim Stage 0 environment probe including the exact import failure line
  - the Stage 5 archive check listing every archived rank measurement in this corpus with its applicability statement
  - per-cell wall clock and peak memory, and the list of cells not covered
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator drafting does not confer approval. This contract is review_required and is NOT approved;
    approved_by is null and execution_authorized is false. Approval is the user's gate because it authorizes
    execution and spends compute.
  - >-
    The F_16 and F_256 port is real work in a container with no algebra system. Approval should be given with
    Stage 4 explicitly OUTSIDE the completion gate, so that a partial port is an accepted outcome rather than
    a failure that pressures the run into reporting something else.
  - >-
    The monomial support and degree histogram matching rule must be written precisely before approval. "Matched"
    is the load-bearing word in this whole design and a matching rule agreed after the fact would void the
    comparison.
  - >-
    The positive-control cell requires m <= o = floor(n/2), which at n = m is not satisfiable. The specific
    (q, n, m, o) tuple used for the positive control must therefore be named before approval; it necessarily
    departs from the n = m schedule used elsewhere and that departure must be explicit.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260805-7d97be
    authored_at: '2026-08-25'
    note: >-
      The instrument definition, the frozen semi-regular prediction, the m = nv collapse, the six named controls
      including verdict-on-the-null-first and the archive check, the graded oil sweep and the forced positive
      control at o = floor(n/2) are taken from the parent proposal's mechanism, predictions and minimal_test,
      restated as measurable quantities with units. Every numeric prediction is a DERIVATION from the
      specification's series performed during ideation, never a measurement. Boilerplate identical across
      contracts by program rule comes from the fixed table. Budgets follow the parent's declared medium
      implementation and low compute.
  derivation_gaps:
  - >-
    The positive control requires m <= o with o = floor(n/2), which contradicts the n = m schedule the rest of
    the design uses. The parent proposal does not reconcile this. The contract requires the control's tuple to
    be named separately before approval, and until it is, the design's one MUST-FIRE control is unspecified.
  - >-
    The reachable n is an engineering unknown. The parent proposal estimates n at most about 12 over F_2 and
    about 8 over the larger fields but has not measured it, so the schedule may not reach the sizes at which
    HEUR-MQOM-NULL-2 could be tested at all. The contract orders cells smallest-first and reports coverage,
    which converts the unknown into a measured boundary but does not remove it.
  - >-
    The monomial support matching rule is stated as a requirement without a precise definition. Over F_2 with
    field equations carried, "same support" needs a definition covering the squarefree reduction; without one,
    two arms could be matched by one reading and not by another.
  - >-
    The parent proposal cites relayed 2026 structural results as the motivation for the family needing a null
    right now. Neither paper was read and no number from them is used anywhere in this contract. The motivation
    is therefore RELAYED and must not be cited from this record as support for anything.
  - >-
    A_D's strict positivity at m = nv was verified in the ideation session out to D = 60 at nine specific
    (q, n=m) pairs. That is a finite check of an identity claimed for all D, and Stage 1 re-runs it only over
    the planned cells. The identity itself is not proved here and is carried as a frozen prediction that can
    fail.
