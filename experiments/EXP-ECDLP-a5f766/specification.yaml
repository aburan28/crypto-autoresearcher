experiment:
  id: EXP-ECDLP-a5f766
  hypothesis_id: H-ECDLP-a3598b
  version: 1
  title: Exact first-order deformation-jet audit with a varying torsion-family control
  status: review_required
  objective: Freeze an exact symbolic and synthetic finite-field audit of J, the first coefficient of
    x^2/A, including active gauge invariance, pullback covariance, the constant-family null, and an explicit
    varying 3-torsion flex control. Separate etale-section uniqueness from coordinate response in a varying
    family. This contract is unapproved and authorizes zero executions. A future 2 GiB ceiling below the
    template's default is sufficient for this bounded degree-first-order algebra and exhaustive counts
    only at p<=17; no large symbolic ideal, point-search corpus or cryptographic-scale work is allowed.
  inputs:
  - ledger/hypotheses/H-ECDLP-a3598b.yaml
  - IDEA-20260905-3e9133
  - IDEA-109
  - KN-OPEN-3417fc
  - experiments/EXP-ECDLP-a5f766/design.md
  - 'Base E: y^2=x^3+3*x-11, P=(3,5), n=3, at p in [7,11,13,17].'
  - 'Families C: constant; V: s=5+epsilon,A=6*s-27,B=s^2-18*s+54,P=(3,s); G: active u=1+epsilon applied
    to C.'
  - 'Formal ring: k[epsilon]/epsilon^2, localized at A0,u0; invert 2,3 where needed.'
  controls:
  - name: constant_family
    construction: C with all first-order coefficients zero; apply every declared gauge and pullback.
    expected: J=0 on all 32 C rows.
  - name: pure_model_gauge
    construction: G obtained from C by active u=1+epsilon; transform curve and point together.
    expected: Raw x1=6 before further actions, but J=0 on all 32 G rows.
  - name: varying_flex_known_false_control
    construction: V, with tangent y=3*x+s-9 and residual cubic (x-3)^3.
    expected: Smooth nonidentity order-3 section; J=-6 before pullback and -6*c after pullback on all
      32 V rows.
  - name: parameter_convention
    construction: Apply pullback epsilon->c*epsilon to the entire actively transformed family, c in [1,2].
    expected: F0 unchanged, J multiplied by c; do not use the inverse passive convention.
  - name: independent_coefficient_arithmetic
    construction: Independently implement coefficient formula and direct dual-number arithmetic; no calling
      one from the other.
    expected: Exact agreement for F0 and J on all 96 rows.
  - name: order_zero_and_collision
    construction: Reproduce F0=x0^2/A0; compare C/G and P/-P under the same transformations.
    expected: C/G jet equality and sign collisions retained explicitly; no claim of injective encoding.
  - name: ordinary_eligibility
    construction: Four exhaustive point counts and separately computed Hasse coefficients of (x^3+3*x-11)^((p-1)/2).
    expected: Agreement between p not dividing p+1-#E(F_p) and nonzero Hasse coefficient; at least one
      eligible prime needed for ordinary-stratum success.
  - name: invalid_input_rejections
    construction: Four independent predicate tests for p=3, A0=0, n=p, and singular A0=-3,B0=2.
    expected: All four rejected before jet interpretation; never count as mathematical counterexamples.
  independent_variables:
    characteristic:
    - 7
    - 11
    - 13
    - 17
    section_family:
    - C
    - V
    - G
    active_gauge_u0:
    - 1
    - 2
    active_gauge_v:
    - 0
    - 1
    pullback_c:
    - 1
    - 2
    fixed_torsion_order: 3
    fixed_truncation_order: 1
    action_order: Apply gauge u=u0*(1+v*epsilon), then pull back every coefficient by epsilon->c*epsilon.
  metrics:
    primary:
    - 'Six certificate groups: expansion; active model action; pullback law; constant/pure-gauge null;
      flex identities; scoped etale-section lemma. Record PASS/FAIL/UNRESOLVED for each.'
    - Exact nonzero symbolic residual count, target 0; a missing proof remains UNRESOLVED.
    - Per-row expansion, gauge, covariance, order-zero and independent-arithmetic failure counts over
      96 rows, each target 0.
    - Nonzero constant/pure-gauge jets among 64 rows, target 0.
    - Flex-jet mismatches against -6*c among 32 rows, target 0.
    - Ordinary eligible-prime count among 4; at least 1 for ordinary-stratum success, never silently replace
      primes.
    secondary:
    - Four eligibility cross-check outcomes and exact point counts, traces and Hasse coefficients.
    - Four invalid-input rejection outcomes, target four correct rejections.
    - C/G and P/-P collision outcomes, with retained transformed coordinates.
    - Planned versus executed row count, per-stage wall time, peak memory and source/artifact hashes.
  heuristic_under_test: null
  preregistered_prediction:
    quantity: First coefficient J of F=x^2/A and its scoped transformation laws.
    formula: J=2*x0*x1/A0-x0^2*A1/A0^2; active u gives J'=J; pullback epsilon->c*epsilon gives J_pullback=c*J;
      J_C=J_G=0; J_V=-6 before pullback. Etaleness gives uniqueness, not a blanket zero derivative in
      a varying family.
    source: Internal proposal IDEA-20260905-3e9133 and preregistered derivation obligations in design.md;
      not an observed result.
  scale_relevance:
    tier: toy
    justification: Exact universal first-order identities plus 96 deterministic small-field controls audit
      conventions and a scoped lemma. Finite agreement alone does not establish a universal proof, mixed-characteristic
      transfer or ECDLP relevance. Ordinary eligibility is measured separately.
    correspondence: null
  tail_checks: []
  replication:
    seeds: []
    independent_instances: Four fixed special fibers, not a random or statistically independent population;
      96 deterministic transformed rows, six certificate groups, four eligibility cross-checks and four
      rejection tests. No randomness is used, so a seed is inapplicable. Later independent validation
      must use separate arithmetic and a blind re-derivation of load-bearing formulas.
  budget:
    wall_clock_seconds_per_run: 1200
    total_cpu_hours: 0.334
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
  stage_budgets:
  - stage: preconditions_and_eligibility
    wall_clock_seconds: 120
  - stage: symbolic_certificates_and_scoped_lemma
    wall_clock_seconds: 600
  - stage: finite_controls
    wall_clock_seconds: 240
  - stage: immutable_artifact_production
    wall_clock_seconds: 240
  budget_interpretation: Future proposed ceilings only; current design handoff maximum_runs is 0. No stage
    borrowing or automatic reruns.
  stopping_rules:
  - Stop on an invalid ordinary/smoothness/torsion precondition for a proposed primary case; retain auxiliary
    labeling where explicitly allowed.
  - Stop on eligibility-method disagreement, arithmetic inconsistency, an unexpected nonzero null or failed
    expected identity; preserve the first discrepancy and all prior rows.
  - Stop at the first exhausted stage, total wall/CPU or memory ceiling; record partial evidence and no
    completed result.
  - Stop on lost provenance or inability to bind the approved contract and implementation hashes.
  - No replacement primes, expanded precision, scalar-recovery work, or automatic retry is permitted.
  invalidation_rules:
  - Direct and coefficient calculations share an implementation of the expression they purportedly independently
    check.
  - Active model scaling is confused with its inverse, or parameter pullback is confused with passive
    renaming.
  - A point's coordinates or curve coefficients are omitted from an action.
  - Nonordinary controls are used to claim ordinary-stratum coverage, or nonsmooth/n-noninvertible cases
    are interpreted in scope.
  - Observed rows, unexpected events, missing certificates or costs are omitted or silently replaced.
  - Evidence is fabricated, overwritten, detached from its source commit, or produced before frozen approval.
  success_criterion: All six certificate groups have complete exact supporting certificates or scoped
    proofs; all expected residuals and row-level failure counts are zero; all 96 rows and four rejection
    tests are retained; four eligibility methods agree and at least one prime is ordinary. The false blanket
    derivative rule fails the varying-flex control while the constant null succeeds. This is only a candidate
    exact-audit result, requiring later independent review and Coordinator decision before any status
    promotion.
  falsification_criterion: An independently confirmed in-scope controlled counterexample violates an asserted
    transformation/constant-family law or the explicit flex/scoped-lemma obligation. Unproved obligations,
    missing ordinary eligibility, failed implementation or resource exhaustion are inconclusive. Rejection
    of the deliberately false blanket derivative rule is an expected positive control, not negative evidence
    against the research direction or IDEA-109.
  decision_paths:
    positive: Seek independent scoped review, then consider a separate design for the canonical-versus-arbitrary
      comparison; no automatic approval or ECDLP claim.
    negative: Coordinator records only the independently established exact falsified scope and a concrete
      corrected successor; no lane closure by count or fatigue.
    inconclusive: Preserve partial immutable artifacts; name missing proof, eligible fixture or implementation
      repair in a new design/hand-off; retain active campaign and unpromoted claims.
  required_artifacts:
  - manifest.json
  - inputs.json
  - environment.json
  - symbolic-certificates.json
  - lemma-proof.md
  - eligibility.csv
  - finite-controls.csv
  - rejection-controls.json
  - metrics.json
  - execution-report.md
  - stdout.log
  - stderr.log
  - source/direct_dual_numbers.py
  - source/coefficient_reference.py
  - source/symbolic_audit.py
  artifact_binding: All future artifacts belong to a newly allocated immutable run directory under experiments/EXP-ECDLP-a5f766.
    Manifest binds the approved specification hash, input and source hashes, commit, exact commands, runtime
    and dependency versions, artifacts and measured costs. No run directory is authorized now.
  later_review_requirements:
  - A committed Coordinator review_plan must precede any claim-changing review, declare prior, owned joints,
    blindness and known-false control.
  - Independent validator checks exact receipts, counts, eligibility and separate implementations.
  - Blind re-deriver receives the quantity statement and parameters without producer implementation or
    report.
  - Red team challenges the constant-versus-varying-family inference, IDEA-109 scope and all claimed transfer.
  - Resolve review-adversarial at xhigh without silent downgrade; a proposed breakthrough, closure or
    established-evidence contradiction requires nondegradable review-breakthrough at max.
  assigned_to: executor
  approved_by: null
  execution_authorized: false
  design_handoff: TASK-20260906-cb38ee
  design_archive_handoff: TASK-20260906-d018d5
