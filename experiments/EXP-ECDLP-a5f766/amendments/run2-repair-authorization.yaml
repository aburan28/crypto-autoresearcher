protocol_amendment:
  id: run2-repair-authorization
  experiment_id: EXP-ECDLP-a5f766
  contract_version: 2
  contract_path: experiments/EXP-ECDLP-a5f766/approved-contract-v2.yaml
  contract_sha256: a81b1476954d80d8042d697299f2522a6658431b17380f3ef423cb5403c6c79d
  amended_at: '2026-09-07'
  amended_by: coordinator-a5f766-run (Coordinator, in-process)
  decision_ref: DEC-20260907-f2c2e5
  kind: infrastructure_repair_run_authorization
  science_changed: false
  summary: >-
    Additive authorization of exactly one repair run RUN-ECDLP-a5f766-002
    after RUN-ECDLP-a5f766-001 was classified failed_infrastructure
    (implementation crash in stage-3 orchestration; no scientific stage or
    expected identity failed). The frozen contract bytes are NOT edited; every
    prediction, control, grid, metric, stage budget, stop rule, invalidation
    rule, and artifact requirement applies to RUN-ECDLP-a5f766-002 unchanged.
  changes:
    - field: budget.maximum_runs
      frozen_value: 1
      effect: >-
        The single approved run was consumed by the crashed attempt. One
        additional immutable run (RUN-ECDLP-a5f766-002) is authorized solely
        as an infrastructure repair, under the unchanged per-run ceilings
        (1200 s wall, 2 GiB nominal, 1 worker, stage budgets 120/600/240/240 s)
        and unchanged total CPU envelope.
  not_changed:
    - preregistered_prediction (read-only)
    - controls
    - independent_variables grid (96 rows)
    - metrics and targets
    - stopping_rules and invalidation_rules
    - required_artifacts
    - success_criterion / falsification_criterion / decision_paths
  predecessors_preserved:
    - runs/RUN-ECDLP-a5f766-001 (immutable, terminal receipt written, frozen source snapshot retained)
  design_basis: >-
    design.md: "There is one planned execution with no automatic reruns; a
    corrected implementation requires a fresh immutable run." This rerun is
    Coordinator-authorized and recorded before execution, not automatic.
