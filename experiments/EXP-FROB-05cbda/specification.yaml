# =============================================================================
# EXP-FROB-05cbda — version 1, not approved. Specified from
# IDEA-20261006-83c197 / H-FROB-be16c9. Status is review_required.
# check_approval_capacity rejects an approving decision:
# GOAL-FROB-6333a9 already holds 5 approved contracts with no run
# (cap 3): EXP-FROB-30006a, EXP-FROB-7d51ae, EXP-FROB-ad6a6d,
# EXP-FROB-ec08b5, EXP-FROB-f495ea. The contract is also not runnable:
# the missing driver is a program that reports the total degree of
# one Weil-descended S_3 system on an explicit dimension-2 quotient
# and on a matched subspace.
# analysis/couveignes-lercier-131/weil_census.py enumerates classes
# for modulus 131 and does not emit that degree. A trial plan
# requires status approved. Success is the source idea's prediction:
# the dimension-2 count differs from 0, and the S_3 degree gap is
# at least 1 when a quotient is written. The concrete negative is a
# dimension-2 count of 0. This session did not enumerate a class.
# Source idea bytes are blob
# 2ab555fdf1972ad118d0f5200b9b6936a617688a.
# =============================================================================
experiment:
  id: EXP-FROB-05cbda
  hypothesis_id: H-FROB-be16c9
  question_id: RQ-FROB-7d8dd4
  goal_id: GOAL-FROB-6333a9
  source_idea: IDEA-20261006-83c197
  version: 1
  title: >-
    Dimension-2 Weil class count and one S_3 degree at the smallest
    excluded prime over F_2
  status: review_required
  approved_by: null
  designed_at: '2026-10-07'
  frozen: false
  execution_authorized: false
  packaging_only: false
  approval:
    approved_by: null
    composing_decision: DEC-20261007-6ceaac
    withheld_reason: >-
      check_approval_capacity rejects an approval of this contract.
      python3 tools/portfolio_kpis.py --capacity GOAL-FROB-6333a9
      reports approved_unrun=5 against cap 3, headroom 0. The five
      contracts are EXP-FROB-30006a, EXP-FROB-7d51ae,
      EXP-FROB-ad6a6d, EXP-FROB-ec08b5, and EXP-FROB-f495ea. This
      decision does not retire one of them. The launcher is also
      missing. There is no committed program that writes one
      explicit dimension-2 quotient over F_2 and reports the total
      degree of one Weil-descended S_3 system on that set and on a
      matched-cardinality subspace.
      analysis/couveignes-lercier-131/weil_census.py is the n = 131
      class enumerator and is not that degree instrument. A trial
      plan requires status approved, which this capacity check
      refuses. This session did not enumerate a class and did not
      compute a degree.
    implementation_authorized: false
    scientific_execution_authorized: false
    scientific_execution_scope: >-
      When a later approval both frees a capacity slot and adds the
      missing S_3 degree driver, work only at q = 2, genus 2, and
      the recomputed smallest excluded prime. Score one dimension-1
      control at prime 5, one class count, and at most one explicit
      quotient. Do not run a relation collection. Do not use
      y^2 = x^3 + x + 1. Do not transfer a degree to n = 131.
    frozen: false
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
      applied: false

  objective: >-
    Decide whether the dimension-2 class count at the smallest
    excluded prime is different from 0 and, when an explicit
    quotient is written, whether the S_3 total-degree gap is at
    least 1. The concrete negative is a dimension-2 count of 0.
    No faster discrete-logarithm algorithm is in scope.

  inputs:
    field: F_2, and the extension F_{2^n} at the recomputed prime n.
    exclusion_conditions: >-
      A prime fails both dimension-1 conditions when it does not
      divide q + 1 = 3 and it lies outside the Hasse interval
      (0.17, 5.83) recorded in KN-OPEN-095df5. The predicted
      smallest such prime is 7. The instrument recomputes it.
    census: >-
      Integer real Weil polynomials of genus 2 over F_2. The
      unfiltered class count must be 35 before any divisibility
      filter is scored. The figure 35 is the calibration stated in
      analysis/couveignes-lercier-131/weil_census.py, opened and
      not run in this session. A different total voids the run.
    quotient: >-
      If the filtered count is positive, one explicit model of an
      abelian surface over F_2 with a rational cyclic subgroup of
      order n, and one affine coordinate of the quotient by that
      subgroup. If no model is written, the degree clause is not
      scored as success.
    subspace: >-
      One F_2-subspace of F_{2^n} whose cardinality equals the
      quotient set. The curve y^2 = x^3 + x + 1 is not used. Point
      counts of that curve are not the metric.
    dimension_1_control: >-
      The elliptic quotient at prime 5, which lies in the Hasse
      interval. The same degree instrument must return a numeric
      S_3 degree. If it cannot, the dimension-2 measurement is void.

  controls:
    - id: prime-recompute
      statement: >-
        The smallest excluded prime is recomputed from the two
        conditions before any degree is scored. A result other than
        7 is the parameter_wrong row.
    - id: class-total
      statement: >-
        The unfiltered dimension-2 class count over F_2 is 35. Any
        other total is instrument_failure.
    - id: dimension-1-numeric
      statement: >-
        The dimension-1 control at prime 5 returns a numeric S_3
        degree. A non-numeric return voids the dimension-2 degree.
    - id: cardinality
      statement: >-
        The two factor bases have the same cardinality, and that
        cardinality is at least 2. Size 0 or 1 is instrument_failure.
    - id: excluded-curve
      statement: >-
        y^2 = x^3 + x + 1 is not used. Using it voids the run.

  independent_variables:
    - whether the arm is the dimension-2 quotient or the matched subspace
    - whether the control is the dimension-1 quotient at prime 5
    - the recomputed excluded prime

  metrics:
    primary:
      - id: class_count
        statement: >-
          Number of dimension-2 abelian-surface isogeny classes over
          F_2 whose rational point count is divisible by the
          recomputed smallest excluded prime. The idea's prediction
          is different from 0. The concrete negative is 0.
      - id: degree_gap
        statement: >-
          Total degree of one descended S_3 system on the quotient
          set, minus the total degree of one S_3 system on the
          matched subspace, when an explicit quotient exists. The
          idea's prediction is a gap of at least 1. A gap of at most
          0 is the second negative.
    secondary:
      - id: excluded_prime
        statement: the recomputed smallest excluded prime
      - id: degree_quotient
        statement: the quotient-set S_3 total degree, when a model exists
      - id: degree_subspace
        statement: the matched subspace S_3 total degree, when scored
      - id: degree_dimension_1
        statement: the numeric S_3 degree of the prime-5 control
      - id: cardinality
        statement: the common factor-base cardinality
      - id: model_written
        statement: whether an explicit quotient was written

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says the divisibility count is an exact census. The
    unfiltered total 35 is the calibration. HEUR-2, that the S_3
    degree is at least the kernel order, is scored only when a
    model exists. A degree below that order fails HEUR-2 and does
    not by itself replace the gap test against the subspace.

  preregistered_prediction:
    quantity: >-
      The dimension-2 class count at the recomputed smallest
      excluded prime, and the S_3 total-degree gap when an explicit
      quotient is written.
    formula: >-
      class_count is different from 0, and degree_gap >= 1 when a
      quotient is written. The concrete negative is class_count = 0
      after the dimension-1 control returns a number and the
      recomputed prime is 7. degree_gap <= 0 with a written model
      is a second negative. Source idea IDEA-20261006-83c197. No
      class count and no degree were computed before this formula
      was written.
    source: >-
      IDEA-20261006-83c197, predictions minimum_effect different
      from 0 and >= 1. KN-OPEN-095df5, KR-IC-b0fcda, KR-IC-73db3f,
      KR-IC-f5c584, and KR-RHO-037e22 were opened in this session.
      They do not state the dimension-2 count at n = 7.

  scale_relevance:
    tier: toy
    justification: >-
      The predicted prime is 7. The question's toy window starts
      near 2^16. No transfer to n = 131 is assumed. The minimum
      effects are the idea's own: a count different from 0, and a
      degree gap of at least 1.
    correspondence: >-
      Direct enumeration of genus-2 Weil polynomials over F_2. No
      Deuring correspondence is used.

  tail_checks:
    - >-
      class_count different from 0 meets the existence prediction.
      A count of 0 with the instrument checks passed is the
      negative. No third threshold is introduced after the census
      is seen.
    - >-
      When a model is written, degree_gap >= 1 meets the degree
      prediction. A gap of at most 0 is the second negative.

  replication:
    seeds:
      - EXP-FROB-05cbda|claim|deterministic
    independent_instances: 1
    note: >-
      One later manifest would cover the census, the dimension-1
      control, and at most one quotient. No run id is minted in
      this session. The replication plan does not name a future run
      slot, because the trial plan is not frozen while status is
      review_required.

  budget:
    enforcement: advisory
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One later manifest would cover the frozen census. Wall-clock
      and CPU figures are not set. The 4 GB figure is machine
      protection for one genus-2 enumeration and one S_3 degree. A
      watchdog expiry is failed_infrastructure, not a class count.

  stopping_rules:
    - Stop after a reading row is named from the class count and, if a model exists, the degree gap.
    - Do not change the thresholds 0 and 1 after seeing a count or a degree.
    - Do not run a relation collection or a discrete-log solve.
    - A timeout or crash voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - An unfiltered class count other than 35, a non-numeric dimension-1 degree, a factor-base size below 2, or use of y^2 = x^3 + x + 1 voids the run.
    - Treating a Weil-polynomial existence count as an explicit group law voids the run.
    - Transferring a degree at this prime to n = 131 voids the run.

  success_criterion: >-
    The instrument checks pass, the recomputed smallest excluded
    prime is 7, class_count is different from 0, an explicit
    quotient is written, the two factor bases have equal cardinality
    at least 2, and degree_gap is at least 1. The count clause and
    the gap clause are the predictions of IDEA-20261006-83c197. The
    conjunction is reachable as a failure when the instrument checks
    pass, the prime is 7, and class_count is 0.

  falsification_criterion: >-
    The instrument checks pass, the recomputed smallest excluded
    prime is 7, and class_count is 0. That is the concrete negative.
    A written quotient with degree_gap at most 0 is a second
    negative and is not this sentence. A recomputed prime other
    than 7 is a parameter failure and is not this sentence. A
    positive count with no explicit quotient is not support and is
    not this sentence. A calibration failure and a crash are not
    this negative.

  decision_impact:
    on_positive: >-
      A later evidence review may record that this toy census has
      class_count different from 0 and degree_gap at least 1 on one
      explicit quotient. The rho exponent stays 1/2. No knowledge
      entry is promoted from this design record, and n = 131 is not
      decided.
    on_negative: >-
      A later evidence review may record that this toy census has
      class_count 0 with the instrument checks passed and the prime
      equal to 7, so the existence half is falsified here only. The
      rho exponent stays 1/2. The two outcomes name different
      counts.

  required_artifacts:
    - experiments/EXP-FROB-05cbda/runs/RUN-*/manifest.yaml
    - experiments/EXP-FROB-05cbda/runs/RUN-*/raw-result.json
    - experiments/EXP-FROB-05cbda/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        the unfiltered class count is not 35, the dimension-1
        control is not numeric, a factor-base cardinality is below
        2, or y^2 = x^3 + x + 1 is used
    - id: infrastructure
      when: the process aborts for memory or the process times out
    - id: parameter_wrong
      when: the instrument checks pass and the recomputed smallest excluded prime is not 7
    - id: nonexistence
      when: >-
        the instrument checks pass, the prime is 7, and class_count
        is 0
    - id: degree_not_higher
      when: >-
        the instrument checks pass, the prime is 7, class_count is
        different from 0, an explicit quotient is written, and
        degree_gap is at most 0
    - id: degree_untested
      when: >-
        the instrument checks pass, the prime is 7, class_count is
        different from 0, and no explicit quotient is written
    - id: degree_gap
      when: >-
        the instrument checks pass, the prime is 7, class_count is
        different from 0, an explicit quotient is written, the
        cardinalities match and are at least 2, and degree_gap is
        at least 1
  reading_rule: >-
    Name exactly one row. degree_gap is the only success row.
    nonexistence is the concrete negative. degree_not_higher is the
    second negative. degree_untested is not support. parameter_wrong
    falsifies the stated prime and is not a class count.
    instrument_failure and infrastructure are not counts. Record the
    prime, the class count, both degrees when they exist, the
    cardinality, model_written, and attack_claimed false beside the
    row. Those fields do not change the row.
