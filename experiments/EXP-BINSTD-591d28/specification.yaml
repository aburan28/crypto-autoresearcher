    justification: >-
      Executable measurement at n=17; n=131 dimension table is exact
      arithmetic (no transfer heuristic for dims). Spurious-factor
      direction only transfers under H1; certificate (A) needs no
      heuristic.
    correspondence: null

  tail_checks:
