  controls:
    - name: exact_enumeration_ground_truth
      description: >-
        Genuine decompositions by exhaustive enumeration over V^m
        (blocking). Disagreement with lifted e-solutions → O-ARTIFACT.
    - name: product_space_dim_fixture
      description: >-
        At RC-1 (n=17, l=6, m=3) dims 6,11,16 must match k(l-1)+1 exactly
        (P2 blocking C-BASE).
    - name: size_matched_random_subspace
      description: >-
        Random subspace of matched dimension; predicted P3 ≥ P1 (faster
        saturation). Required for any saturation reading.
    - name: subfield_symbolic_baseline
      description: >-
        Stage-0 symbolic: V=F_q implies V^{(k)}=V, unknowns m log2 q;
        proves-too-much object where symmetrisation works.
    - name: ordinary_frobenius_null
      description: >-
        Ordinary RC-1 with 17 unrelated targets as null for P4; a
        Koblitz-only drop absent here is reportable a77711 F2.

  independent_variables:
    - name: l
      levels: [4, 5, 6]
      role: primary cell size; controls product-space dims and exhaustive feasibility
    - name: subspace_kind
      levels: [polynomial_basis, random_matched]
      role: Stage 1 vs Stage 2
    - name: curve_arm
      levels: [rc1_ordinary, koblitz_n17]
      role: Stage 1/2 vs Stage 3 Frobenius arm

  metrics:
    primary:
      - name: spurious_factor
        unit: dimensionless
        definition: >-
          (e-space solutions with e_k free in V^{(k)}) / (genuine V^m
          decompositions), pooled over targets per (l, subspace_kind)
      - name: product_space_dims
        unit: integers
        definition: dim V^{(k)} by explicit span for k=1..m
      - name: lift_agreement
        unit: fraction
        definition: >-
          genuine decompositions recovered by lifting / genuine by
          enumeration (must be 1.0)
    secondary:
      - name: orbit_closure_ratio
        unit: dimensionless
        definition: >-
          W_4 work on 17-conjugate orbit system / (17 × one instance),
          Koblitz vs ordinary
      - name: wall_time_seconds
        unit: s
      - name: peak_rss_bytes
        unit: bytes

  heuristic_under_test: H1
  preregistered_prediction:
    quantity: spurious_factor at RC-1 m=3, l in {4,5,6}
    formula: >-
      m! * 2^{sum_k dim V^{(k)} - m*l} with dim V^{(k)}=min(k(l-1)+1, n);
      predicted ≈ 2^{9.6}, 2^{13.6}, 2^{17.6} at l=4,5,6; band factor 4;
      surprise if ratio < 8 at l=6 with lift_agreement=1
    source: >-
      IDEA-20260926-120d6a claim (C) / H1; genuine count conservation
      KN-FIND-007; uniform-fibre heuristic for F_2^N → F_2^n

  scale_relevance:
