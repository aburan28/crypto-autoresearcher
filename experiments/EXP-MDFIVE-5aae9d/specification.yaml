experiment:
  id: EXP-MDFIVE-5aae9d
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-520dda; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-520dda
  question_id: RQ-MDFIVE-6870c1
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Sweep predicate width and step index measuring expected local-tweak counts for matched difference
    and value predicates on MD5, with a random-bijection null and XOR and rotation ablations.
  objective: 'The run reduces one uncertainty: whether forcing a difference is cheaper than forcing
    a value of the same width at the same place in the same function, under one routine that cannot
    tell which it is doing. As parts: (i) it produces expected and median tweak counts with exhaustion
    rates for both predicate families across a declared sweep, so the comparison is a distribution
    comparison and not a single anecdote; (ii) it validates the instrument by requiring the random-bijection
    null to show a ratio of one, which is the only outcome consistent with a primitive that offers
    no cancellation, and treats any other null outcome as invalidating rather than as a weaker pass;
    (iii) it attributes any observed ratio structurally by ablating modular addition and rotation
    separately, so the result names a feature rather than reporting a bare number. The run reduces
    no uncertainty about attack complexity in either setting and produces no path, no collision and
    no preimage. If the ratio is one on MD5 as well, that closes the constraint-type reading of the
    asymmetry with a measured value, an explicit routine scope, and forward guidance to the schedule
    and mode candidates, which is a complete deliverable under docs/inventor-protocol.md section 4.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: under the declared memoryless resample
      routine, the declared predicate families and widths, and the declared step indices on full MD5,
      the mean tweak count for value predicates exceeds that for difference predicates by factor R,
      with the null at 1.0 and the stated ablation attribution. What does NOT follow: nothing about
      the cost of any actual collision or preimage technique, no lower bound on either, no claim that
      difference constraints are generally cheaper, and nothing about MD5''s security.'
  inputs:
    procedure: STAGE 0 pin and validate MD5 against RFC 1321 test vectors and build the random-bijection
      null primitive behind the same interface; cost hours. STAGE 1 implement the single resample
      routine and the two predicate factories, and write down the width-matching argument before running
      anything; cost hours plus review. STAGE 2 measure the trivially-satisfied-bit fraction for the
      difference family at every cell; cost minutes, and a fraction above the threshold halts the
      run for redesign. STAGE 3 run the full sweep for both families on MD5 with the declared budget;
      cost minutes to an hour depending on censoring. STAGE 4 run the identical sweep on the null
      primitive in the same invocation; same cost. STAGE 5 run the XOR and rotation ablations at reduced
      cell count. STAGE 6 run the halved-budget control. STAGE 7 compute ratios with bootstrap intervals,
      report exhaustion rates, and emit the manifest and per-cell arrays.
    instrument: Python 3.11 with numpy for batched 32-bit arithmetic, run under harness/runner.py
      for seeds, wall-clock ceiling and the manifest inference block. Purpose-written RFC 1321 MD5
      with per-step state access, validated against hashlib.md5. The null primitive is a per-step
      128-bit bijection keyed by the message word, implemented behind the identical interface in the
      same module so the routine cannot distinguish them. No Sage, no solver, no external cryptanalysis
      library.
    parameters: 'Predicate widths k in {1, 2, 4, 8, 12, 16}. Step indices t in {2, 6, 10, 14}, all
      within round 1 so that unconsumed words are guaranteed. Instances per cell: 10^4. Tweak budget
      per instance: 2^16. Declared input difference for the difference family: a single-bit difference
      in message word 0, fixed for the whole run. Ablations at k in {4, 8} and t in {6, 10} only.
      Halved-budget control at 2^15 across the same reduced grid.'
  controls:
  - Random-bijection null primitive with the identical routine, predicates and sweep, in the same
    invocation.
  - Trivial-bit accounting per cell, so difference predicates that are free by construction are subtracted
    before any ratio is formed.
  - A width-matched control in which the value predicate is placed on a different word of the state
    than the difference predicate, checking that the effect is not an artefact of predicate placement.
  - XOR-ablated primitive, isolating whether the cancellation depends on modular addition.
  - A shuffled-budget control in which the budget is halved, confirming that reported means are not
    budget-truncation artefacts.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a primitive of the same shape whose step function
    is a fresh random bijection per step keyed by the message word, so no algebraic cancellation between
    two parallel executions is available. The identical routine, the identical predicate families
    and the identical sweep run against it in the same invocation. The null must show the difference-family
    and value-family tweak-count curves coinciding at every (k, t), because with a random bijection
    a difference predicate of width k is satisfied with probability 2^-k just as a value predicate
    is. If the null shows a separation, the measurement is reading the routine or the predicate construction
    and not the primitive, and the signal arm is uninterpretable.'
  independent_variables:
  - 'predicate type: difference versus value'
  - predicate width k
  - step index t
  - 'primitive arm: MD5, random-bijection null, XOR-ablated, rotation-ablated'
  metrics:
    primary:
    - mean tweak count per cell
    - median tweak count per cell
    - value-to-difference ratio per cell and pooled
    - exhaustion rate per cell
    secondary:
    - trivially-satisfied-bit fraction per cell
    - bootstrap interval of the pooled ratio
    - ratio under each ablation
    - ratio under the halved budget
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The pooled value-to-difference expected-tweak-count ratio R on MD5 over round-1 cells,
      and the same ratio R_null on the random-bijection null.
    formula: 'R = mean over declared (k,t) cells of E[T_value(k,t)] / E[T_diff(k,t)], where T is the
      number of uniform resamples of the free message word until the k-bit predicate holds, censored
      at 2^16. Predicted: R >= 2.0 on MD5; R_null in [0.8, 1.25].'
    source: Pre-registered in the parent proposal IDEA-20260816-520dda before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: The sweep runs on full MD5 with its real 32-bit words and real constants, so there
      is no reduced-size primitive and no size extrapolation. The toy designation refers to compute
      cost and to the deliberately narrow predicate widths, which are limited to 16 bits because the
      budget must dominate 2^k for the value family to produce uncensored means. The stated transfer
      assumption is that a ratio measured at widths up to 16 bits is indicative of, and not equal
      to, behaviour at the widths a real path imposes; nothing in the record depends on that transfer
      holding.
    correspondence: null
  tail_checks:
  - The null ratio must be within [0.8, 1.25] or the run is invalid rather than weakly positive.
  - Exhaustion rates must stay below 50 percent in every cell contributing to the reported ratio.
  - Halving the budget must not move the pooled ratio by more than 20 percent.
  - Trivially-satisfied-bit fraction must be below 0.25 in every difference cell before that cell
    is used.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt if the trivial-bit fraction exceeds threshold at STAGE 2; the predicate families are then
    not width-matched and the design must change before any measurement.
  - Halt if the null ratio falls outside its band.
  - Enforce the per-instance tweak budget strictly and record censoring rather than extending it.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: MD5 shows a pooled round-1 ratio of at least 2.0 with a bootstrap interval excluding
    1.25, the random-bijection null shows a ratio within [0.8, 1.25], exhaustion stays below 50 percent
    in the contributing cells, and the whole sweep is reproducible from the manifest seeds.
  falsification_criterion:
  - Pooled MD5 ratio below 2.0 or its bootstrap interval containing 1.25.
  - Null ratio outside [0.8, 1.25].
  - Trivial-bit fraction above 0.25 anywhere in the contributing cells.
  - Exhaustion above 50 percent in contributing cells.
  - Ratio unchanged by both ablations, leaving the effect structurally unattributed.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-520dda
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must approve the width-matching argument between the two predicate families; if
    difference predicates are effectively narrower than value predicates of the same nominal width,
    the whole ratio is an artefact.
  - The choice of declared input difference for the difference family needs a ruling, since a different
    choice changes trivial-bit counts and could change the ratio.
  - A ruling is needed on whether pooling across round-1 steps is legitimate or whether each step
    must be reported separately.
