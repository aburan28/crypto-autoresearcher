    - native_terminal_status
    - resource_status
    - last_completed_and_active_stage
    secondary:
    - operational_phase_ms
    - sampled_peak_rss_bytes
    - artifact_bytes
    - missing_receipts
    - actual_cpu_if_recorded
  replication:
    independent_instances: 1
