  budget:
    enforcement: advisory
    maximum_memory_gb: 8
    maximum_runs: 1
    maximum_workers: 1
  machine_protection:
    rss_scope: Native worker sampled envelope, not OS hard cap or public wrapper total.
    sampling_interval_ms: 25
    monitor_grace_ms: 100
    compact_certificate_max_bytes: 2097152
    output_postrun_admission_max_bytes: 268435456
