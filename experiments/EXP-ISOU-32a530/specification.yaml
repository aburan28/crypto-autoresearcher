  - Trace COMPLETED alone or point action alone cannot establish map degree/admission.
  success_criterion: Retain valid stage evidence and honest native terminal/resource
    observation; no mathematical promotion.
  falsification_criterion: Concrete trace ordering/identity or acceptance change under
    the fixed artifact; a watchdog censor is inconclusive about the mathematics.
  decision_impact:
    on_positive: Commission independent scoped evidence review before any frontier
      claim.
    on_negative: Preserve concrete failure or censor and rank the next discriminating
      action; no silent retry.
  required_artifacts:
  - Canonical outer run companions, exact native resources/results, raw logs/partial
    outputs and hashes, report/PDF and snapshot binding.
