contract_declarations:
  no_degree_was_measured: NO degree of regularity, first-fall degree or d_F4 was measured,
    estimated, guessed or asserted anywhere in this run. No Groebner engine is installed on
    this host (magma, sage, Singular and msolve are all absent, recorded in environment.json)
    and this program's own first-fall instruments import sage.all. Arm C reports F_2-degrees
    of explicitly constructed coordinate polynomials under an affine substitution, which is
    a different quantity from a solving degree.
  groebner_engines_probed_and_absent:
    magma: false
    sage: false
    Singular: false
    msolve: false
  heur_a1t_status: HEUR-A1T remains UNVALIDATED on this host. The deciding measurement --
    whether the typed solving degree rises with m while the untyped one does not -- is separate
    future work needing an algebra engine this host does not have. Every cost consequence
    of typing reported here is conditional on it.
  vendored_field_arithmetic:
    source_path: experiments/EXP-SEMBIN-354a75/code/binary_field.py
    vendored_path: experiments/EXP-SEMBIN-92724f/code/binary_field.py
    source_sha256: 50ef59f6fc91de09e9f1d613c4f44081c4aedf6ee5e6fd95ab54bc3cc197fbe6
    vendored_sha256: 50ef59f6fc91de09e9f1d613c4f44081c4aedf6ee5e6fd95ab54bc3cc197fbe6
    sha256_values_match: true
    statement: the vendored copy is byte-identical to its source; it was copied, not edited,
      and no divergence was needed
  measured_versus_modeled:
    measured:
    - arm D exact image sizes, domain sizes and fibre multiplicities (exhaustive integer counts)
    - arm D exact counting-layer ratios (exact rational identities)
    - arm B monomial counts per equation per degree (exact counts over a constructed Boolean
      system)
    - arm C F_2-degrees of constructed coordinate polynomials (exact Hamming-weight maxima)
    modeled:
    - 'every cost surface, stage-1 and stage-2 value, saving in bits, argmin, near-optimal
      width, required-degree floor, subset-sum corner value and nearby-object value: these
      are closed-form evaluations of Semaev''s eqs. (15)-(16) under Galbraith-Gebregiyorgis''s
      substitutions, not timings of any program'
    optimistic_assumptions_carried_from_the_specification:
    - HEUR-A1T (typed solving cost no worse than untyped) is assumed, not tested; it is the
      premise every typed cost number depends on
    - the per-solve cost is taken as n^{4 omega}, uniformly polynomial in n with no dependence
      on m
    - linear algebra is charged as omega' in the exponent of the relation-store size
    - log2 N = 2 log2 n is assumed in the required-degree floor
    - the yield exponent n - mk is used raw (paper_raw), which permits a formal relation probability
      above 1 where mk > n; capped and exact-p variants are computed alongside it and reported
      separately
  scale_and_transfer: the exact enumeration arms ran at n in {12, 15, 17}, group orders 3984
    to 130992. These are exhaustive counts at those parameters and nothing more. The untyped
    images at these n are tens of elements, so a ratio is dominated by which x-values happen
    to lie on the curve; no asymptotic statement transfers from them without an argument this
    run does not make. The cost-model arms are closed-form and carry no scale limit, but they
    are modeled rather than measured.
  observations_only: no evidence record was written, no hypothesis status was changed, no
    ledger record was created or amended, and nothing outside experiments/EXP-SEMBIN-92724f/code/
    and experiments/EXP-SEMBIN-92724f/runs/RUN-SEMBIN-cbd770/ was written. The polynomial-time
    branch of the cost model is a REDUCTIO against a premise, never a claimed algorithm.
stopping_rules_evaluated:
  rule_1_arm_d_gate:
    fired: true
    detail: the frozen prediction (ratio = m! within 10% at every enumerated cell) was not
      met at any of the 7 cells, and the frozen falsification threshold (a ratio under m!/2
      at any cell) was crossed at all 7
  rule_2_baseline:
    fired: true
    detail: satisfied under the un-ceiled reading Table 3 actually uses (35/36 inside 0.7%,
      the one miss at 0.704% being inside the table's printed rounding); NOT satisfied under
      ceil(n/m), where 16 of 36 cells miss, by up to 211%. The requirement to reproduce the
      same printed numbers under BOTH readings is not satisfiable, because Table 3's arithmetic
      uses the non-integer n/m. Recorded as a PROCEDURE DEFECT in the contract's k-reading
      clause, not as a failure of the reproduction.
  rule_3_builder_mismatch:
    fired: false
    detail: 'equation count, variable count, maximum Boolean degree and degree-3 support are
      identical typed versus untyped in all 160 draws. Per-degree MONOMIAL COUNTS differ substantially
      (largest single discrepancy 97 monomials at degree 2), so the two systems are the same
      shape but not the same polynomials: typing is free in counts and degree and is not free
      in density.'
  rule_4_degenerate_typing_null:
    fired: false
    detail: 'no typed effect survived: image-size ratio exactly 1 and image support elementwise
      identical at all 28 rows, and the typed cost formula rejected every degenerate draw.
      The pipeline is not producing the effect by itself.'
  rule_5_nearby_objects:
    fired: false
    detail: the argument collapsed NEITHER nearby object to polynomial time. On Galbraith-Gebregiyorgis's
      symmetrised presentation it fails because their per-summand variable cost is not uniformly
      polynomial in m; on Trimoska et al.'s search-side setting it fails because their exponent
      n + l contains no m-growing term to delete. Both are the required proves-too-much outcome.
  rule_6_resources:
    fired: false
    detail: wall clock 64.3 s against a 3600 s cap; peak RSS 0.217 GB against a 4 GB cap;
      1 worker; 1 run of 40 permitted. No cell hit a resource limit and no impediment was
      recorded.
  rule_7_no_degree:
    fired: false
    detail: no degree of any kind was measured or asserted
