protocol_deviations:
- deviation: the run did NOT halt after arm D's gate fired; phases 1b-5 were executed
  governing_text_for_halting:
  - 'specification.yaml stopping_rules[0]: ''Stop the whole experiment and record the hypothesis
    REFUTED if the typed-over-untyped image-size ratio is not about m! at the enumerated cells.'''
  - 'handoff completion_gate[0]: ''... if the ratio is not about m! the hypothesis is recorded
    refuted and the run stops there'''
  governing_text_for_continuing:
  - 'handoff completion_gate[1..10]: the degenerate-typing null, the Table 3 reproduction
    under both k readings with c'' recovered symbolically, the shuffled-type null, the subset-sum
    corner, both nearby objects, all four invalid inputs, the exhaustiveness control and the
    vendored-sha256 statement are each required gate items in their own right'
  - 'specification.yaml success_criterion: enumerates deliverables from the baseline and from
    arms A, B and C, and states that a ratio far from m! ''satisfies the criterion'' rather
    than terminating it'
  - 'specification.yaml required_artifacts: 18 items spanning the baseline and arms A, B and
    C'
  - 'specification.yaml invalidation_rules[1] and [2]: the RUN is invalid if the exhaustiveness
    control shows order-dependent image sizes or if the degenerate-typing null does not return
    exactly 1. Arm D''s refutation is therefore not admissible as a measurement until those
    two controls have been run, so halting before them would leave the gate''s own finding
    unverified.'
  stated_rationale_of_the_halt_rule: 'the rule''s own text gives its purpose as ORDER and
    COST: ''It is a seconds-long check and it gates everything downstream; running the expensive
    arms first and the cheap refutation last would be the wrong order and is forbidden here.''
    The order was obeyed literally: arm D ran first, before every other phase, and its gate
    was evaluated and recorded before any later phase started.'
  budget_effect_of_continuing: none material. The whole run, all phases, fits inside a small
    fraction of the 3600 s / 4 GB budget, so continuing spent no budget the halt rule was
    protecting.
  what_was_NOT_done:
  - the frozen prediction was not adjusted, re-scoped or re-scored
  - no later phase's result was used to soften, reinterpret or overturn arm D's recorded observation
  - no hypothesis status was changed and no evidence record written
  - no degree of any kind was measured, estimated or asserted
  requested_of_the_coordinator: adjudicate this branch. If the halt was meant literally and
    unconditionally, phases 1b-5 of this run are surplus and may be disregarded without touching
    arm D's observation, which is complete and self-contained in image-sizes.json. An amendment
    fixing the precedence between stopping_rules[0] and completion_gate[1..10] would remove
    the ambiguity for the successor contract.
  gate_state_at_the_branch:
    stop_condition_fired: true
    prediction_met_at_every_cell: false
    falsification_threshold_crossed_at_some_cell: true
- deviation: three execution attempts were made; the first two terminated on implementation
    errors in the driver and produced no measurement
  attempt_1: 'ZeroDivisionError in arm_d_draw: a typed coset V + v_i containing no curve point
    gives a typed domain of 0, and the random-map reference divided by it. Classified implementation_error.
    Fixed by recording the empty-coset case as its own outcome (status empty_typed_base, ratio
    exactly 0) rather than crashing; those draws are retained in full and are reported alongside
    the ratio statistics.'
  attempt_2: 'AttributeError: families.random_basis does not exist; the helper lives in image_enum.
    Classified implementation_error. Fixed by calling image_enum.random_basis.'
  attempt_3: 'completed. A defect was then found by inspection in the Galbraith-Gebregiyorgis
    nearby-object control: its polynomiality flag compared two values at a single n against
    a fixed 10-bit slack, which cannot separate G(m) = 2^m from a polynomial G at n = 283.
    Replaced by a growth discriminator across n up to 10^7, which separates all five declared
    families correctly. The final run is attempt 4.'
  classification: implementation_error, then instrument fix
  not_evidence: none of these is evidence about H-SEMBIN-c59e50 in either direction (core
    rule 5). They are recorded because failed attempts are retained, not discarded.
