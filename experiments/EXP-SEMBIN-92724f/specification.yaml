experiment:
  id: EXP-SEMBIN-92724f
  hypothesis_id: H-SEMBIN-c59e50
  version: 1
  title: >-
    Localise Semaev 2015's exponent constant to the m! symmetry factor, and test the
    coset-typed removal of it by exact enumeration, algebraic identity and symbolic
    F_2-degree expansion -- with no algebra engine and no degree measurement
  status: analyzed
  status_history:
    - status: approved
      at: '2026-09-13'
      by: coordinator
      ref: DEC-20260913-cb5ee2
    - status: completed
      at: '2026-09-13'
      by: executor
      run_id: RUN-SEMBIN-cbd770
      note: >-
        Run archived under experiments/EXP-SEMBIN-92724f/runs/RUN-SEMBIN-cbd770/ by
        TASK-20260913-a10003 (commit 24f5a574a), manifest status completed_valid,
        64 s wall, 0.22 GB peak. Status was left at approved on the contract head at
        the time; completed is recorded here under DEC-20260913-2386b5 so that its
        from: completed is reachable. The frozen protocol below is unchanged.
    - status: analyzed
      at: '2026-09-13'
      by: coordinator
      ref: DEC-20260913-2386b5
      note: >-
        Evidence record EV-SEMBIN-4614e7 composed from REVIEW-SEMBIN-20260913-run2
        joints J4 and J5 (TASK-20260913-7ca970). H-SEMBIN-c59e50 approved -> weakened.
        Two contract-wording defects recorded there as PD-G (halt-rule precedence) and
        PD-H (k-reading clause); the frozen protocol is not edited.
  objective: >-
    Test the four parts of H-SEMBIN-c59e50 that are testable WITHOUT a Groebner
    engine, and separate them cleanly from the one part that is not.
    (A) DERIVATION. Confirm that log2(m!) is the unique m-growing term in the
    two-stage balance of eqs. (15)-(16), that equating the stages returns
    c' = sqrt(2 ln 2) = 1.17741 and c = 2/c' = 1.698644, and that the typed objective
    -- eq. (15) with Galbraith-Gebregiyorgis's three substitutions -- is monotone
    DECREASING in m over the whole feasible range with no interior optimum.
    (B) ALGEBRAIC IDENTITY. Build the coset-typed and untyped chained Boolean systems
    independently by Weil descent and compare them COEFFICIENT-WISE, not by count, to
    test whether typing is free in equation count, variable count and algebraic
    degree.
    (C) AFFINE INVARIANCE. Expand deg_{F_2} S_3(u, v_1+y_1, v_2+y_2) and
    deg_{F_2} y_1 S_3(u, v_1+y_1, v_2+y_2) symbolically and decide whether Semaev's
    Section 4.5 d_ff = 4 argument transfers to the typed system.
    (D) EXACT IMAGE SIZE, WHICH RUNS FIRST AND GATES EVERYTHING. Enumerate the typed
    family prod_i (V + v_i) and the untyped multiset family from V exhaustively,
    count the distinct achievable sums EXACTLY, and compare the ratio against the
    predicted m!. This costs seconds and can refute the whole hypothesis by itself.
    The experiment measures NO DEGREE and asserts nothing about d_F4. That is not a
    scoping convenience: no Groebner engine is installed on the execution host (no
    MAGMA, Sage, Singular or msolve) and this program's own first-fall instruments
    src/ic_first_fall_fast.py and src/semaev_tree.py both import sage.all. The degree
    arm is a separate future contract, and reporting an unmeasured degree here would
    be the exact failure this contract is structured to prevent.
  inputs:
    frozen_source: inputs/SEMAEV-2015-310/
    cost_model: >-
      Semaev eqs. (15)-(16) unchanged for the untyped arm. For the typed arm exactly
      three substitutions, all Galbraith-Gebregiyorgis's own accounting: yield 1/P
      becomes 2^{n-mk} in place of m! 2^{n-mk}; relation count becomes m 2^k in place
      of 2^k; stage 2 becomes (m 2^k)^{omega'} in place of 2^{k omega'}. No other
      term changes, and the net saving is therefore (m-1)! and never m!.
    curve: >-
      E/F_{2^n}: Y^2 + XY = X^3 + A X^2 + B, with B = 1 and seeded random B, used
      ONLY for arm D's image-size enumeration. Arms A and C use no curve at all.
    field_arithmetic: >-
      Vendor a byte-identical copy of experiments/EXP-SEMBIN-354a75/code/binary_field.py
      into this experiment's own code directory and record the sha256 of both copies.
      A run package must be self-contained and reproducible after the other
      experiment's directory changes, and a shared import across two immutable
      artifact packages is exactly how a later reader gets a different answer from
      the same manifest. Do not edit the vendored copy; if it needs a fix, report the
      fix and the divergence rather than silently forking the arithmetic.
    subspace_variants: [low_degree_polynomial, random_k_dimensional]
    translate_families:
      - additive_cosets: 'V + v_i, Galbraith-Gebregiyorgis section 4.2'
      - multiplicative_translates: 'g_i V'
    enumeration_cells:
      - {n: 12, k: 2, m: 6}
      - {n: 12, k: 3, m: 4}
      - {n: 12, k: 4, m: 3}
      - {n: 15, k: 3, m: 5}
      - {n: 15, k: 4, m: 4}
      - {n: 17, k: 3, m: 6}
      - {n: 17, k: 4, m: 4}
    cost_surface_n: 'every integer n in [100, 1000], plus 10^4 and 10^5'
    cost_surface_m: 'every integer m in [2, n]'
    omega_variants: [2.376, 2.807, 3.0]
    omega_prime_variants: [2.0, 3.0]
    k_readings: [unceiled_n_over_m_as_in_table3, ceil_n_over_m]
    builder_cells:
      - {n: 12, t: 2, k: 6}
      - {n: 12, t: 3, k: 4}
      - {n: 15, t: 3, k: 5}
      - {n: 17, t: 2, k: 9}
    coset_draws_per_cell: 20
    seeds: [20260913301, 20260913302, 20260913303, 20260913304, 20260913305]
  controls:
    - kind: baseline
      design: >-
        Reproduce all 36 numeric cells of Table 3 in inputs/SEMAEV-2015-310/tables.yaml
        to the 0.7% already established there, under BOTH k readings, and recover
        m* ~ sqrt(2 ln 2 n / ln n) and c = 1.6986 in the untyped arm. Acceptance
        additionally requires recovering c' = sqrt(2 ln 2) SYMBOLICALLY with log2(m!)
        exhibited as its unique carrier: fitting the number 1.6986 without exhibiting
        the carrier would not identify the carrier, and the carrier is the claim.
    - kind: matched_null
      design: >-
        DEGENERATE TYPING. Set v_1 = ... = v_m, so the typed family IS the untyped
        family while remaining formally typed. Every typed effect must vanish
        EXACTLY here -- image-size ratio 1, cost surface identical to the untyped
        arm, builder output identical coefficient-wise. An effect that survives is
        an artifact of the coset-shift bookkeeping rather than of typing, and voids
        every typed number in the run.
    - kind: matched_null
      design: >-
        SHUFFLED TYPES. m distinct cosets drawn, then permuted at random per tuple
        before summing. The image size must be unchanged, since the sum is
        permutation-invariant; a change means the enumeration is order-sensitive and
        is not counting what it claims to count.
    - kind: known_false
      design: >-
        THE SUBSET-SUM CORNER. Run the typed cost formula at m = n, k = 1, where the
        decomposition problem IS subset-sum over n group elements and no
        polynomial-time solve is believed to exist. The formula MUST be shown to
        return a polynomial value there, because that return is the reductio. A
        formula that refuses to return a value there, or that returns an exponential
        one, has been silently patched and the monotonicity claim is void.
    - kind: known_false
      design: >-
        PROVES-TOO-MUCH ON TWO NEARBY OBJECTS whose conclusion is known false, and
        the argument must FAIL on both. (i) Galbraith-Gebregiyorgis's own setting:
        the single summation polynomial S_{m+1} in elementary symmetric coordinates,
        where coset typing demonstrably costs extra variables and their own measured
        benefit is "moderate" and "not conclusive". (ii) Trimoska et al.'s
        search-side removal, total O~(2^{n+l}), worse than 2^{n/2} because their
        solve is exponential in l. An argument that also collapses either of these
        to polynomial time has proved too much and is wrong somewhere nobody has
        read closely enough.
    - kind: representation_control
      design: >-
        The typed family built with additive cosets V + v_i and with multiplicative
        translates g_i V, at matched k. Both remove the m!. If only one changes the
        measured image size, the effect is about the representation rather than
        about typing, and the run must say so rather than attributing it to typing.
    - kind: invalid_input
      design: >-
        Four inputs that must be REJECTED rather than scored: coset representatives
        not in pairwise distinct cosets of V (the types collapse, the m! is not
        removed, and a small saving must not be reported); m > n or k < 1; t = 1,
        where eq. (5) has no equations; a V that is not an F_2-subspace.
    - kind: exhaustiveness
      design: >-
        For the smallest enumeration cell, count the image twice by two independent
        tuple orderings and confirm identical image sizes and identical fibre-size
        multisets. An order-dependent count is incomplete.
  independent_variables:
    - m
    - k
    - n
    - typing (untyped multiset family; additive coset typing; multiplicative translates; degenerate typing)
    - omega and omega'
    - k reading (ceiled or un-ceiled)
    - subspace variant
    - curve coefficient B
    - draw of the coset representatives
  metrics:
    primary:
      - exact_image_size_typed
      - exact_image_size_untyped
      - image_size_ratio_typed_over_untyped
      - predicted_ratio_m_factorial
      - fitted_cprime_and_c_from_untyped_balance
      - typed_objective_argmin_in_m_per_n
      - typed_minus_untyped_stage1_saving_bits
      - builder_coefficientwise_equality
      - f2_degree_of_S3_under_affine_substitution
    secondary:
      - fibre_size_distribution_and_poisson_tail
      - table3_36cell_residuals_both_k_readings
      - required_degree_floor_coefficient_per_omega
      - near_optimal_region_width_in_m
      - enumeration_seconds_per_cell
      - peak_resident_gb
  heuristic_under_test: HEUR-YT
  preregistered_prediction:
    quantity: >-
      The ratio of exactly enumerated distinct achievable sums, typed over untyped,
      against the predicted m!; and the shape in m of the typed cost objective.
    formula: >-
      image_size_ratio_typed_over_untyped = m! to within 10% at every enumerated
      cell, with the absolute typed image size matching 2^{mk}(1 + o(1)) whenever
      mk <= n - 3; the typed objective monotone DECREASING in m over 2 <= m <= n at
      every tested n with the argmin at the boundary and NO interior optimum;
      typed-minus-untyped stage-1 saving exactly log2((m-1)!) to within 0.1 bit;
      the untyped balance returning c' = 1.17741 and c = 1.698644 with log2(m!) as
      the unique m-growing term; deg_{F_2} S_3 and deg_{F_2} y_1 S_3 both 3 under
      every affine substitution; and the required-degree floor coefficient
      0.196 at omega = 3 and 0.248 at omega = 2.376.
    source: >-
      H-SEMBIN-c59e50 and IDEA-20260913-8138a0; Semaev eqs. (11), (15)-(17) and
      Section 4.5 in inputs/SEMAEV-2015-310/paper_fulltext.md;
      Galbraith-Gebregiyorgis 2014/806 section 4.2 for the three substitutions and
      for the (m-1)! net.
  known_defect_to_resolve: >-
    IDEA-20260913-8138a0's sota_delta quotes the typed stage-1 saving as "25.25 bits
    at n = 571, m = 12; 21.8 bits at n = 571, m = 11; 15.3 bits at n = 283, m = 8".
    The first two are log2((m-1)!) as the claim states; the third is log2(8!) =
    15.299, i.e. log2(m!), where log2((m-1)!) = log2(7!) = 12.299. Re-derive all
    three from scratch and report the corrected figure explicitly. Do NOT edit the
    proposal: it is an immutable ledger record and the correction belongs in this
    run's output and in the evidence record that follows.
  scale_relevance:
    tier: >-
      mixed, and the mixture is deliberate. Arms A and C are DERIVATIONS and carry no
      scale at all -- they are exact statements about published formulas and about
      F_2-degrees, evaluated at cryptographic n as easily as at toy n. Arm D is TOY:
      n <= 17, chosen so 2^{mk} <= 2^{17} tuples can be enumerated and the image
      counted EXACTLY rather than estimated.
    justification: >-
      Exactness is the point of arm D. The quantity under test is a ratio predicted
      to be m!, and at small mk - n a sampled image size has variance comparable to
      the effect; sampling is the cheapest way to manufacture a discrepancy that is
      not there. Arms A and C are where the cryptographic-scale content lives, and
      they need no measurement.
    correspondence: >-
      None claimed between arm D's n <= 17 and any cryptographic n. Arm D tests
      whether coset typing multiplies the reachable-image size by m! -- a
      counting-theoretic statement whose mechanism (the domain is m! times larger and
      both maps are near-injective below saturation) does not depend on n, but whose
      MEASURED value is claimed only over the enumerated cells. The transfer
      assumption is stated in one sentence and is falsifiable: if the ratio degrades
      systematically as mk approaches n across the enumerated cells, the near-
      injectivity premise is failing and no extrapolation is permitted.
  tail_checks:
    - >-
      Report the fibre-size distribution, not only the image size. A heavy-tailed
      fibre distribution means the image is concentrated and refutes HEUR-YT even
      when the mean image size matches its prediction, so the most-hit and least-hit
      fibres are reported against the Pois(2^{mk-n}) tail.
    - >-
      Report the image-size ratio per coset draw, all 20, not their mean. A mean of
      m! is consistent with some draws collapsing (representatives accidentally in
      the same coset or in a small multiplicative subgroup) and others exceeding it.
    - >-
      Report the near-optimal region width in m -- the set of m within 2x of the
      objective's value at the boundary. Monotonicity with a flat tail and
      monotonicity with a steep one support the "missing constraint" reading to very
      different degrees, and an argmin alone hides the difference.
    - >-
      Report the largest coefficient-wise discrepancy found by the builder
      comparison over all draws, not whether any was found. A single mismatch in one
      draw is the informative case and a pass rate hides it.
  replication:
    seeds: [20260913301, 20260913302, 20260913303, 20260913304, 20260913305]
    independent_instances: 20
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 40
    maximum_workers: 1
  stopping_rules:
    - >-
      RUN ARM D FIRST. Stop the whole experiment and record the hypothesis REFUTED if
      the typed-over-untyped image-size ratio is not about m! at the enumerated
      cells. It is a seconds-long check and it gates everything downstream; running
      the expensive arms first and the cheap refutation last would be the wrong order
      and is forbidden here.
    - >-
      Stop and report a procedure defect if the untyped arm fails to reproduce
      Table 3's 36 cells to 0.7% under both k readings, or fails to recover m* and
      c = 1.6986. Every later comparison would be against a miscalibrated baseline.
    - >-
      Stop and report the mismatch AS THE FINDING if the coefficient-wise builder
      comparison fails: every later typed-untyped comparison would be between two
      different systems.
    - >-
      Stop the whole run if the degenerate-typing null shows any typed effect
      surviving. The pipeline is then producing the effect by itself.
    - >-
      Stop and diagnose, never report, if the argument collapses either nearby object
      to polynomial time. That is a proves-too-much failure and it means the argument
      is wrong, not that the objects are fast.
    - >-
      Stop the cell and record an impediment with its recheck if peak RSS or wall
      clock exceeds the declared cap. Resource exhaustion is never negative
      mathematical evidence.
    - >-
      Do not measure, estimate, guess or assert any degree of regularity, first-fall
      degree or d_F4. No engine is installed; an unmeasured degree reported as
      measured would be a fabrication under core rule 9.
  invalidation_rules:
    - >-
      Any enumeration cell where the image was not counted exhaustively is invalid as
      a ratio measurement and is recorded as unreached with the size of the domain it
      needed. Sampling is never substituted for enumeration.
    - >-
      The run is invalid if the exhaustiveness control shows order-dependent image
      sizes or fibre multisets.
    - >-
      The run is invalid if the degenerate-typing null does not return ratio exactly
      1 and a cost surface identical to the untyped arm.
    - >-
      A typed cost number computed from a draw whose representatives were NOT
      verified pairwise-distinct modulo V is invalid, since the types collapse and
      the m! is not removed.
    - >-
      Any statement about a solving degree is invalid in this run by construction,
      including a statement that a degree is PLAUSIBLY 4. The contract measures no
      degree.
  success_criterion: >-
    Arm D returns an exact image-size ratio with its per-draw spread and its
    fibre-size tail at every declared cell; the degenerate-typing null returns
    exactly 1; the untyped arm reproduces Table 3 and recovers c' and c with log2(m!)
    exhibited as the unique m-growing term; the typed objective's shape in m is
    reported per n with the near-optimal width; the builder comparison returns a
    coefficient-wise verdict; the affine-invariance expansion returns a symbolic
    verdict; both nearby objects are run and the argument's behaviour on each is
    reported; and the required-degree floor is re-derived with its coefficient per
    omega. A ratio indistinguishable from m! satisfies the criterion, and so does a
    ratio far from m! -- the second REFUTES the hypothesis, which is an equally good
    outcome and must not be presented as a failure.
  falsification_criterion: >-
    An image-size ratio materially below m! (under m!/2) at any cell refutes HEUR-YT
    and with it the zero-cost clause, killing the hypothesis. An interior minimum in
    m in the typed objective at any tested n refutes the exponent localisation and
    the missed rising term must be named. A builder mismatch refutes the zero-cost
    clause. An affine-invariance expansion reaching F_2-degree 4 refutes the transfer
    THEOREM rather than the assumption, which would be a genuinely informative
    outcome since it would identify the coset shift as what the first-fall argument
    is sensitive to. The argument collapsing either nearby object indicates the
    argument is wrong.
  required_artifacts:
    - exact image sizes typed and untyped, per cell per draw, retained in full rather than aggregated
    - the fibre-size distribution per cell and its Poisson tail comparison
    - the full typed and untyped cost surfaces over (n, m) at every (omega, omega') and both k readings, as data rather than as argmins
    - the 36-cell Table 3 reproduction with its residuals under both k readings
    - the symbolic derivation of c' = sqrt(2 ln 2) and c = 1.698644 with every m-dependence exhibited term by term
    - the three re-derived typed stage-1 saving figures, including the corrected n = 283 m = 8 value
    - coefficient-wise typed-versus-untyped builder comparison per cell per draw
    - the written-out symbolic expansion of deg_{F_2} S_3 and deg_{F_2} y_1 S_3 under the affine substitution
    - the required-degree floor re-derived with its coefficient at each omega
    - all eight control outcomes, each stated separately
    - both nearby-object outcomes with the reason the argument does or does not go through
    - the exact command, git commit and dirty-tree state, environment and versions
    - the sha256 of the vendored binary_field.py and of its source, and a statement that they match
    - random seeds, the exact V basis, and the coset representatives per draw
    - peak resident memory and wall clock per cell
    - stdout and stderr, retained for failed and unreached cells
    - a machine-readable results table keyed by (n, m, k, typing, translate_family, subspace, B, seed, draw)
    - an explicit statement that no degree was measured and that HEUR-A1T remains unvalidated on this host
  assigned_to: executor
  approved_by: DEC-20260913-cb5ee2
  approval_basis: >-
    Standing user authorization of 2026-09-06. Approval asserts protocol
    completeness, not that H-SEMBIN-c59e50 is true. The Coordinator independently
    re-derived c' = sqrt(2 ln 2) = 1.17741, c = 1.698644, the stage-coefficient
    equality, the floor coefficients 0.19624 and 0.24777, the n = 571 floor value
    1.861 and the n ~ 3400 crossing before approving, and found one inconsistent
    figure in the originating proposal, recorded above under known_defect_to_resolve.
  dependencies: []
  independence_note: >-
    Depends on NO degree measurement and inherits neither Assumption 1 nor
    Assumption 2, because arms A and C are derivations and arm D counts rather than
    solves. It may therefore run concurrently with everything else in SEMBIN, and it
    is runnable on a host with no algebra engine -- which is this host. Arm D shares
    its field arithmetic with EXP-SEMBIN-354a75 by VENDORED COPY rather than by
    import, so neither run package depends on the other's directory.
  interpretation_limits:
    - >-
      NO DEGREE IS MEASURED. HEUR-A1T is carried as an explicitly unvalidated
      premise, and the deciding measurement -- whether the typed solving degree rises
      with m while the untyped one does not -- is separate future work needing an
      algebra engine this host does not have.
    - >-
      The polynomial-time branch is a REDUCTIO, not a result. If a summary of this
      run reads as "ECDLP in n^{14}", the summary is wrong.
    - >-
      An image-size ratio of m! confirms the DOMAIN counting, i.e. that typing
      removes the symmetry cap. It says nothing about whether the typed system is
      solvable, and the cost consequence is conditional on HEUR-A1T which this run
      does not test.
    - >-
      The monotonicity result is a statement about SEMAEV'S COST MODEL under GG's
      accounting, and its force is diagnostic: a cost model with no interior optimum
      has lost a constraint. It is not a claim that large m is a good choice.
    - >-
      The floor 0.196 sqrt(n / ln n) evaluates to 1.86 at n = 571, BELOW Assumption
      1's 4, so no contradiction with Assumption 1 at FIPS-labelled parameters
      follows from the floor alone. The concrete-n force comes from the monotonicity,
      not the floor, and conflating them would overstate the result at small n.
    - >-
      Diem's use of different factor bases was NOT chased and is the single most
      likely place for closer prior art. Named so a reviewer can look.
    - >-
      No claim about the security of any deployed curve, in either direction.
