experiment:
  id: EXP-ECDSA-dad4fd
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-ECDSA-a23475
  question_id: RQ-ECDSA-87625f
  goal_id: GOAL-ECDSA-001
  batch_id: null

  title: >-
    Ordering-stability audit of the published nonce-leakage frontier under five
    charging conventions frozen before any row is read, with a matched
    independent null, a correlated tradeoff null whose forced values are exact,
    and an inverting positive control

  objective: >-
    If separately approved, frozen and authorized, decide two things about the
    PUBLISHED resource rows for ECDSA key recovery from partial nonce leakage,
    before GOAL-ECDSA-001 spends six batches assembling a frontier from them:
    whether the reported peak-memory figures are comparable across rows at all
    (C1: does any row's stored input volume exceed its reported peak memory),
    and whether the rows' pairwise ordering survives a frozen set of five
    charging conventions (C2, C3). The deliverable is an ORDERING-STABILITY
    statistic with its null, plus the explicit list of pairs that may be stated
    as Pareto facts and the list that may not. This contract is a DESIGN DRAFT:
    no run has occurred, no table has been transcribed, and nothing here is
    evidence.

  what_this_is_not:
    - Not an attack, not a key recovery, and not an implementation of any attack. Nothing is solved and nothing is measured on a computer beyond arithmetic on a transcribed table.
    - Not a claim that any published figure is wrong. C1's two admissible readings are "the reported memory excludes streamed input" and "a figure is mistaken", and the contract reports which the sources support rather than choosing.
    - Not a claim that any algorithm is faster, slower, cheaper or more expensive than another. Every conclusion is of the form "the REPORTED numbers, under convention K, order as follows".
    - Not an allegation about any paper. A row identified as Pareto-dominated is dominated AS REPORTED; papers optimise the axis they declare, and the point is that a defender reads the frontier rather than the declaration.
    - Not a statement about the ECDLP in either direction (GOAL-ECDSA-001.non_duplication; KN-OPEN-011 owns that question and it stays with GOAL-ECDLP-001 and GOAL-PATH-001).
    - Not a statement about where the 1-bit boundary sits at 256 bits.
    - Not a binding instruction to GOAL-RSA-001. The convention is OFFERED; that goal may decline it and record why.
    - Not approval, freezing, execution authorization, a run, or evidence. No approved_by field is present.

  claim_ceiling:
    tier: not_applicable_to_an_attack
    scope: >-
      No attack tier applies because no attack is run. The ceiling that DOES
      apply is provenance: a row transcribed from a primary source read in full
      may support a statement about that source's reported figures; a row
      relayed from an excerpt may support NOTHING above "as reported,
      unverified", and every statistic is computed twice -- once on all rows
      and once with relayed rows excluded -- with both values reported. A
      conclusion that survives only with relayed rows included is stated as
      resting on unverified figures IN THE SENTENCE THAT STATES IT.
    explicitly_out_of_reach: >-
      Any conclusion about 256-bit deployed curves, about the intrinsic cost of
      either attack family, about the correctness of any published result, or
      about the ECDLP.

  inputs:
    conventions:
      K1: T only (compute wall clock), the convention most papers report
      K2: M only (reported peak working memory)
      K3: A * T with A = max(M, V), area-time
      K4: A * T^2 with A = max(M, V), area-time-squared / full cost
      K5: T + Q/rho, acquisition-charged end-to-end
    area_definition: max(M, V)
    area_sensitivity_variant: M + V
    bytes_per_signature: [40, 64, 96]
    bytes_per_signature_derivation: >-
      40 = two 160-bit integers (r, s); 64 = (r, s) plus a 160-bit hash, or two
      256-bit integers; 96 = (r, s, h) at 256-bit order. Endpoints only; no
      single value is asserted, and stage 0 reads the released code's actual
      storage format if it can be obtained.
    rho_grid: [1.0e2, 1.0e3, 1.0e4, 1.0e5, 1.0e6, 1.0e7, 1.0e8]
    rho_infinity_regime: >-
      Reported in parallel at every point: the archive regime in which the
      attacker already holds the signatures, K5 collapses to K1, and only V
      binds. Both regimes appear in every deliverable (HEUR-EC-4).
    synthetic_rows_per_null: 200
    null_seeds: [11, 22, 33]
    master_seed: 4166493
    domain: EXP-ECDSA-dad4fd/v1
    seed_derivation_rule: >-
      Synthetic rows are drawn by SHA-256 over the ASCII byte string
      domain || "|" || label || "|" || decimal(null_seed) || "|" ||
      decimal(row_index) || "|" || decimal(axis_index), read as a big-endian
      unsigned integer, mapped to [0,1) by dividing by 2^256, and then mapped
      onto the target log-range by linear interpolation in log10. Labels are
      from the fixed set {"null-a-T", "null-a-M", "null-a-Q", "null-b-T"}. A
      third party reproduces every synthetic row bit-for-bit from
      (master_seed, domain, label, null_seed, row_index, axis_index).
    null_a_ranges: >-
      Per-axis log10 ranges are TAKEN FROM THE ASSEMBLED PUBLISHED TABLE at
      stage S1 -- min and max of log10 T, log10 M, log10 Q across the published
      rows -- so the null is MATCHED in marginal spread rather than merely
      random. The ranges are recorded before the null is drawn.
    null_b_construction: >-
      Rows on a single curve M*T = C at fixed Q: draw T on the same log10 range
      as null A, set M = C/T with C chosen so the M range matches the published
      rows' M range, and set Q to the published rows' median Q for every row.
    positive_control_pair: >-
      P = (T 100, M 1, Q 2^20) and P' = (T 50, M 1000, Q 2^20), in the units
      of the assembled table.
    environment_declaration: >-
      MEASURED BY THE PROPOSING SESSION ON 2026-08-06, OUTSIDE THE HARNESS,
      TO BE RE-MEASURED IN-HARNESS: python3 3.11.15; numpy 2.4.6 PRESENT;
      sympy, fpylll, gmpy2, ecdsa ABSENT; 4 cores; 15 GiB RAM. None of the
      absent packages is needed: this contract is pure-Python arithmetic on a
      table.

  stage_order_and_cheapest_decisive_gate:
    principle: >-
      The dominant cost of this contract is READING, not computing. Stages are
      ordered so that the cheapest arithmetic runs before any statistic that
      depends on assembling a large table, and so that a partial acquisition
      still yields a complete C1 result.
    stages:
      - id: S0
        purpose: >-
          Source acquisition, ZERO COMPUTE. Declared preference order, per
          RQ-ECDSA-87625f.constraints and the session ANGLE-BRIEF's measured
          network status: (1) the public repository README table named in
          RQ-ECDSA-87625f.provenance (raw.githubusercontent measured at HTTP
          200); (2) ePrint ABSTRACT pages (measured 200); (3) arXiv; (4)
          author-hosted copies. eprint.iacr.org/YYYY/NNNN.pdf is measured at
          403 and its failure is expected, not a surprise. Record per source
          the exact URL, HTTP status, and either verbatim transcription or an
          explicit non-acquisition statement. Additionally sought, and recorded
          as found or not found: whether each source states (a) the stored
          format and size per signature, and (b) whether its reported peak
          memory includes input signature volume.
        can_terminate: >-
          No, but it BOUNDS the deliverable: below 6 obtained rows, no
          stability statement is made at all and the package reduces to C1 plus
          a recorded acquisition failure. A total acquisition failure is an
          infrastructure outcome (AGENTS.md rule 5) matching
          GOAL-ECDSA-001.pause_conditions clause 2, and the arithmetic is then
          run on the relayed rows with every output labelled a sensitivity
          analysis over unverified inputs.
      - id: S1
        purpose: >-
          Transcribe every obtained row with its provenance label; record the
          per-axis log10 ranges; compute V = Q*b at all three b values and the
          V/M ratio per row. ZERO COMPUTE.
        can_terminate: >-
          YES for C1, in either direction. This is the cheapest decisive gate
          in the contract: if V/M <= 1 for every row at every b, C1 is refuted
          in one table and the result is recorded.
      - id: S2
        purpose: >-
          Instrument gate. Implement the five conventions and the stability
          detector; run the POSITIVE CONTROL pair and BOTH NULLS; verify the
          nulls' forced values. Report the detector's verdicts on the controls
          BEFORE the published rows are evaluated.
        can_terminate: >-
          YES. If the positive control is not flagged, or if null B does not
          reproduce its exact forced values, the detector is misimplemented and
          NOTHING in the run may be reported.
      - id: S3
        purpose: >-
          Evaluate the five conventions on the published rows; compute the
          pairwise sign matrix, the stability fraction, the unstable-pair list
          with each pair's crossover parameter, the simultaneously-dominated
          row list, and the inverted-pair count as a function of rho.
        can_terminate: No; it is the main measurement.
      - id: S4
        purpose: >-
          Sensitivity and honesty passes: recompute every statistic with A
          replaced by M + V; recompute every statistic with relayed rows
          excluded; split the stability fraction into homogeneous
          (same paper and hardware) and heterogeneous pairs for HEUR-EC-3.
        can_terminate: No.
      - id: S5
        purpose: >-
          Write the offered convention in scheme-neutral terms for
          GOAL-RSA-001, with its query axis instantiated there as sieving
          relation output rather than as signatures, stated as an offer and as
          an analogy that has not been validated.
        can_terminate: No.

  independent_variables:
    - charging convention K1..K5
    - acquisition rate rho
    - bytes per signature b
    - area definition (max(M,V) versus M+V)
    - provenance filter (all rows versus primary-read rows only)

  arms_and_controls:
    treatment: >-
      The assembled published rows, each labelled with provenance in
      {primary-read, README-relayed, secondary-relayed, this-program-measured}.
    measured_null_a: >-
      MATCHED INDEPENDENT NULL. 200 synthetic rows with (T, M, Q) drawn
      independently on the SAME per-axis log10 ranges as the published rows,
      three seeds. FORCED VALUE DERIVED BEFORE THE RUN: for rows with
      independent continuous coordinates, sign(T_i - T_j) and sign(M_i - M_j)
      are independent symmetric signs, so P(K1 and K2 agree on a pair) = 1/2
      EXACTLY, and therefore the all-five-convention stability fraction is
      BOUNDED ABOVE BY 0.5. THIS NULL CAN FAIL: a measured null stability
      materially above 0.5 means the synthetic rows are correlated by
      construction, the generator is defective, and the null is invalid.
    measured_null_b: >-
      CORRELATED TRADEOFF NULL, and the one that carries the interpretation.
      200 rows on a single curve M*T = C at fixed Q. FORCED VALUES DERIVED
      BEFORE THE RUN: (i) K1-versus-K2 agreement is EXACTLY 0 on every pair,
      because M is a strictly decreasing function of T along the curve;
      (ii) K3 = max(M,V)*T gives EXACT TIES on every pair whose M > V, because
      A*T = M*T = C there; (iii) on pairs whose M < V, A = V is constant across
      rows (Q is fixed), so K3 orders them strictly by T, identically to K1.
      A control returning anything else is misimplemented. THIS NULL IS THE
      NEARBY OBJECT WHERE THE HOPED-FOR CONCLUSION FAILS: these rows are
      perfectly comparable and lie on ONE frontier, yet they are maximally
      order-unstable between K1 and K2. If the audit cannot separate null B
      from the published rows, "unstable" does not mean "incomparable" and C3's
      interpretation collapses -- which is exactly
      RQ-ECDSA-87625f.decision_target's distinction.
    positive_control: >-
      THE DETECTOR MUST FIRE. The inserted pair P = (T 100, M 1, Q 2^20) and
      P' = (T 50, M 1000, Q 2^20): K1 ranks P' first, K2 and K3 and K4 rank P
      first. If the stability detector does not flag this pair as unstable, it
      is broken and every stability number in the run is void and no negative
      may be reported.
    graded_control: >-
      Sweep rho over the seven-point grid and report the inverted-pair count as
      a function of rho. FORCED SHAPE: MONOTONE NON-INCREASING, because a
      higher acquisition rate shrinks the Q/rho term and the K5 ordering must
      converge to K1's. A non-monotone curve is the canonical artifact tell
      (docs/inventor-protocol.md section 3) applied to a cost model: it means
      the evaluator is wrong, not the attacks. The grid has five interior
      points so a failure localises to a rho decade.
    ordering_control: >-
      Run and hash-commit the positive control and BOTH nulls, and record their
      verdicts, BEFORE any published row is evaluated under any convention.
      Absence of that commitment is invalid_measurement. This matters more than
      usual here because the conventions are chosen by the same session that
      predicts an inversion.
    provenance_control: >-
      Every statistic is computed twice: on all rows, and with every
      non-primary-read row excluded. Both values are reported side by side. A
      conclusion that survives only with relayed rows included is labelled as
      resting on unverified figures in the sentence that states it.
    comparability_policy: >-
      Rows are labelled homogeneous (same paper, same hardware) or
      heterogeneous, and the stability fraction is reported separately for each
      (the HEUR-EC-3 validation). If the two differ by more than 0.25,
      heterogeneous comparisons are reported as UNINTERPRETABLE rather than as
      frontier points, and C3 is restricted to homogeneous pairs.

  metrics:
    primary:
      - V/M per row at b in {40, 64, 96}, with V = Q*b, and the count of rows with V > M.
      - Ordering-stability fraction of the published rows under K1..K5, against both nulls.
      - The explicit unstable-pair list, each entry naming the flipping convention and its crossover parameter value (rho* for K5; the b at which V overtakes M for K3/K4).
      - Count and identity of rows dominated simultaneously on T, M and Q by another row.
      - Inverted-pair count as a function of rho over the seven-point grid.
    secondary:
      - Every row's five cost values and the full pairwise sign matrix.
      - Every statistic recomputed with A = M + V instead of max(M, V).
      - Every statistic recomputed with relayed rows excluded.
      - Stability fraction split into homogeneous and heterogeneous pairs.
      - Fraction of sources stating whether reported peak memory includes input volume, and fraction stating the stored bytes per signature.
      - The S0 acquisition log with per-source HTTP status.

  heuristic_under_test: HEUR-EC-3, HEUR-EC-4, HEUR-EC-8

  preregistered_prediction:
    quantity: >-
      (Q1) V/M for the highest-Q published row; (Q2) the acquisition crossover
      rate rho* for the two 1-bit secp160r1 rows; (Q3) the ordering-stability
      fraction of the published rows relative to null A.
    formula: >-
      Q1: V/M = Q*b/M.
      Q2: rho* = (Q_F - Q_L)/(T_L - T_F).
      Q3: stability(published) <= stability(null A) - 0.15.
    source: >-
      All three DERIVED IN-REPO in H-ECDSA-a23475.mechanism. Q1 is a
      definition; Q2 is the solution of T_L + Q_L/rho = T_F + Q_F/rho; Q3 is
      the hypothesis. No external theorem is cited. THE FORMULAS ARE
      PRE-REGISTERED, NOT THE NUMBERS: if the re-read primary table differs
      from the relayed figures, the same formulas are evaluated on the new
      inputs and both results are reported.
    frozen_reference_values: >-
      Computed from the figures quoted in RQ-ECDSA-87625f.provenance, WHICH
      THAT RECORD LABELS AS READ FROM A REPOSITORY README IN EXCERPT AND
      EXPLICITLY UNVERIFIED, and used here only as sensitivity inputs:
      Row L (Q = 2^25, T = 49440 s, M = 1939 GiB), Row F (Q = 2^36,
      T = 16740 s, M = 850 GiB). Then V(F) at b = 40 is 2560 GiB and V/M(F) =
      3.01; at b = 64, 4096 GiB and 4.82. V/M(L) = 0.00064 at b = 40.
      rho* = 68685922304/32700 = 2.1005e6 signatures/second. Compute-only
      K4: 1939*49440^2 = 4.7395e12 against 850*16740^2 = 2.3819e11, L/F =
      19.90. K5 ratios T_F/T_L: 828.2 at rho = 1e3, 130.5 at 1e4, 1.727 at 1e6,
      1.000 at rho*, 0.3525 at 1e8; K4 with acquisition at rho = 1e3 gives
      F/L = 3.007e5. Null A stability upper bound: 0.5, exact.
      Null B: K1-vs-K2 agreement exactly 0; K3 exact ties on all M > V pairs.

  scale_relevance:
    tier: not_applicable
    justification: >-
      No instance is executed, so no scale is tested and the notion of
      transferring across scale does not apply. What DOES scale is the
      convention itself: K1..K5 are defined over abstract (T, M, Q) and are
      offered to GOAL-RSA-001 unchanged, with the query axis instantiating
      there as sieving relation output rather than as signatures.
    limit: >-
      The analysis is only as good as the transcribed rows, and the rows'
      provenance is the binding constraint, not their scale.
    correspondence: null

  tail_checks:
    - >-
      Report the pair with the SMALLEST finite rho* as well as the largest.
      A pair whose rho* is far outside any plausible deployment range is
      effectively order-stable on the query axis and should be reported as
      such, rather than counted as an inversion.
    - >-
      Report the b value at which each K3/K4 flip occurs. If every flip needs
      b above 96 bytes, the volume mechanism is not doing the work and the
      inversions are coming from elsewhere; say so.
    - >-
      Report the stability fraction as a function of the number of rows
      included, adding rows in provenance order. A statistic that moves
      sharply as the last relayed rows are added is being carried by them.

  replication:
    seeds: [11, 22, 33]
    independent_instances: 3
    replication_note: >-
      The published rows are DATA, not draws; there is nothing to reseed on the
      treatment side, and saying otherwise would be false. The seeds replicate
      the two NULLS only, and the treatment side's replication is instead a
      PROVENANCE replication: every row is transcribed twice, independently,
      and a transcription mismatch invalidates that row.

  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 1
    maximum_runs: 1
    stage0_wall_clock_seconds: 5400
    stage1_wall_clock_seconds: 600
    stage2_to_S5_wall_clock_seconds: 1800
    network_allowed_in_S0_only: true
    budget_basis: >-
      Pure-Python arithmetic on a table of at most a few dozen rows plus 600
      synthetic rows. The dominant cost is S0 reading, which is bounded by wall
      clock rather than by compute.

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived, and authorized. It carries no approved_by field.
    - Stop before evaluating any published row if the control and null commitment hashes are absent.
    - Stop the whole package if the positive control pair is not flagged, or if null B misses any of its three exact forced values.
    - Stop the stability analysis and report only C1 if fewer than 6 published rows are obtained.
    - Stop S0 at its wall-clock ceiling and record which sources were and were not obtained; an unobtained source is UNOBTAINED, never evidence about the attacks.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any convention, rho value, b value, or statistic added or altered after any published row has been evaluated. The convention set is frozen at S0.
    - Any row entering the analysis without a provenance label, or any statistic reported without its relayed-rows-excluded twin.
    - Any transcription of a row that does not match its independent second transcription.
    - Any statement that an algorithm is faster, cheaper or better than another, as opposed to a statement about reported numbers under a named convention.
    - Any use of a relayed figure without the word unverified in the same sentence.
    - Any statement about the ECDLP, or any citation of this contract toward KN-OPEN-011.

  infrastructure_failure_disposition: >-
    A network failure, a 403 on a source, an unobtainable table, or a source
    that exists but does not report an axis is INFRASTRUCTURE OR DOCUMENTATION
    SIGNAL and is NEVER negative mathematical evidence and never evidence about
    any attack (AGENTS.md rule 5). The session ANGLE-BRIEF measures
    eprint.iacr.org PDF bodies at 403 on this network, so partial acquisition
    is the EXPECTED case and is designed for: the deliverable degrades
    gracefully from full stability analysis, to C1 on whatever rows exist, to a
    recorded acquisition failure plus the frozen formulas, and each degradation
    level is a legitimate reportable outcome.

  success_criterion: >-
    This draft has no current success outcome: it is not authorized for
    execution. If a separately approved, frozen successor is executed, its only
    positive disposition is a complete package in which (1) the S0 acquisition
    log records every attempted source with its status and either a verbatim
    transcription or an explicit non-acquisition; (2) V/M is reported per row
    at all three b values; (3) the positive control was flagged and both nulls
    reproduced their exact forced values, all committed before any published
    row was evaluated; (4) the stability fraction is reported for the published
    rows and both nulls, split homogeneous/heterogeneous, and recomputed
    without relayed rows and under A = M + V; (5) the unstable-pair list, the
    simultaneously-dominated-row list, and the monotone inverted-pair-versus-rho
    curve are all reported; and (6) the offered convention is written in
    scheme-neutral terms. That disposition establishes NO attack claim, NO
    crypto-scale claim, and NO ECDLP claim.

  falsification_criterion: >-
    H-ECDSA-a23475 is falsified by any of: V/M <= 1 for every row at every b in
    {40, 64, 96} in the re-read primary table (C1 withdrawn); the published
    rows' stability fraction at or above null A's (C2 and C3 refuted, and the
    negative -- that charging does not discriminate this family and
    GOAL-ECDSA-001's premise is weakened -- is the deliverable); a primary
    source stating explicitly that its reported peak memory includes input
    volume for the rows in question (C1 collapses to a misreading and is
    recorded as one); or a non-monotone inverted-pair-versus-rho curve (the
    evaluator is wrong and nothing is reported).

  outcomes:
    no_execution_authorization: >-
      The only current disposition: review_required draft, no run, no evidence,
      no inference.
    future_ordering_stability_report: >-
      Only after separate approval, freezing, authorization and valid
      execution. Scoped to the reported figures under the named conventions,
      with provenance carried per row.
    planned_negative: >-
      A DELIVERABLE, NOT A FAILURE, and arguably the more useful outcome: if
      charging changes no ordering, GOAL-ECDSA-001 learns before batch two that
      its premise does not hold and can redirect its remaining five batches to
      the reproduction ladder, which is what its own next_action prioritises.
    partial_acquisition: >-
      Legitimate and pre-planned. The deliverable degrades to C1 plus a
      recorded acquisition failure, and the frozen formulas stand ready for
      whatever rows a later batch obtains.
    infrastructure_or_integrity_failure: >-
      Inconclusive infrastructure signal; never evidence about the attacks, the
      leakage model, or the ECDLP.

  required_artifacts:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - S0 acquisition log: per source, URL, HTTP status, timestamp, and verbatim transcription or explicit non-acquisition statement.
    - The assembled row table with every axis, provenance label, hardware description, and both independent transcriptions.
    - Per-row V computation at b in {40, 64, 96} and the V/M ratios.
    - Control and null commitment hashes with their verdicts, timestamped before any published-row evaluation.
    - Full pairwise sign matrix under every convention and every rho.
    - Stability fractions: published, null A, null B, homogeneous, heterogeneous, relayed-excluded, and under A = M + V.
    - The unstable-pair list with crossover parameters, and the simultaneously-dominated-row list.
    - The scheme-neutral convention statement offered to GOAL-RSA-001.
    - Manifest, environment, exact command, stdout, stderr, and an execution report.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - Independent review confirms the convention set and rho grid were frozen before any row was read, and that the quantifier order in H-ECDSA-a23475 (one frozen convention set for all pairs, not a convention chosen per pair) is what the implementation enforces.
    - Independent review confirms null B's three forced values are correctly derived and that the detector can actually fail them.
    - Red team specifically challenges the convention-shopping risk and the HEUR-EC-3 comparability assumption.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
    - User separately authorizes execution after receiving the approved frozen package.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved, and only the Coordinator may approve it (AGENTS.md rule 1).

  assigned_to: executor
