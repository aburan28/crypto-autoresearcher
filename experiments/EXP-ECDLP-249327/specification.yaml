experiment:
  id: EXP-ECDLP-249327
  hypothesis_id: H-ECDLP-e0ab87
  version: 1
  title: >-
    Fire the additive transfer and solve a certified discrete logarithm on the
    family's anomalous curve, with a trace-two nearby control at matched
    discriminant and size, an independent-solver check where one is affordable,
    and a random-Q leakage null whose power against a 10 percent leak is above
    0.9999
  status: draft
  objective: >-
    Replace a syntactic trace-equality flag, which has never been shown to fire,
    with a certified solve. Produce discrete_log certificates that an
    independent verifier re-checks by recomputing k times P from scratch, at
    every size from 30 bits to the roughly 204-bit Anomalous row, and record
    zero verified successes on a trace-two curve built the same way at matched
    size and matched CM discriminant, and on Curve25519 and BN(2,254).
    The value is entirely as a fired instrument and a reusable
    certificate-producing artifact. A SOLVE ON A DELIBERATELY BROKEN CURVE IS
    NOT A BREAK. The additive transfer already IS the best known algorithm on
    trace-one curves, so this ties the frontier and advances nothing, and it is
    dominated on SCOPE by rho, which applies to every curve whereas this applies
    to a measure-zero family.
  inputs:
    toy_curve_construction: >-
      Complex multiplication with 4p equal to one plus the absolute value of D
      times s squared, at trace one. USABLE DISCRIMINANT POOL IS SEVEN, NOT
      NINE, and s must be ODD. For p to be an integer, 1 + |D| s^2 must be
      divisible by 4; when |D| is even, that is |D| in {4, 8}, the quantity is
      congruent to 1 modulo 4 and is never divisible for any s. The pool is
      therefore |D| in {3, 7, 11, 19, 43, 67, 163} with s odd. At least THREE
      distinct discriminants must be used per size and the number used must be
      recorded, since a solver secretly depending on one discriminant would pass
      a single-discriminant ladder.
    sizes: [30, 40, 60, 80]
    instances_per_toy_size: 25
    headline_row: >-
      The roughly 204-bit Anomalous row from RQ-SCURVE-84a540, 10 instances,
      preceded by a re-sourcing attempt whose outcome is recorded either way.
    negative_controls:
      trace_two: >-
        Curves with trace two at each size, built by the same CM route with
        4p equal to four plus the absolute value of D times s squared, same
        discriminant, same field size, same construction pedigree, one integer
        of trace away. 100 attempts.
      cross_curve: >-
        Curve25519 and BN(2,254) at full size, 100 attempts each, AFTER model
        conversion is done and verified.
    random_Q_null: >-
      100 instances on an anomalous curve where Q is drawn as a RANDOM CURVE
      POINT and no k is ever computed.
    verifier: >-
      harness/toycurve.py at a recorded revision, which must be re-read and
      confirmed to perform exact arithmetic at 204 bits before the headline row
      runs. Its docstring is reported to scope it to about 32 bits; that reading
      was NOT verified by the designing Coordinator.
  controls:
    - >-
      POSITIVE, BLOCKING AND ESCALATING. Constructed anomalous curves at 30, 40,
      60 and 80 bits. The instrument must FIRE at every size, 25 out of 25 with
      verified certificates. This is the control the campaign's existing plan
      could not supply, because its positive control asks only for a trace
      value.
    - >-
      NEARBY-OBJECT NEGATIVE, THE SHARP ONE. Trace-two curves at each size, same
      CM discriminant, same construction, matched field size, one integer of
      trace away. Zero verified successes required. This is the control that
      isolates the trace as the load-bearing structure.
    - >-
      NEGATIVE, FULL SIZE, CROSS-CURVE. Curve25519 and BN(2,254). These match on
      nothing except being elliptic curves, so they are WEAKER controls than the
      trace-two curves and are labelled as such; their value is that they are
      the curves the campaign actually cares about.
    - >-
      INDEPENDENT-SOLVER CONTROL. Baby-step giant-step at 30 and 40 bits,
      requiring exact integer equality on k. This distinguishes a correct solver
      from a self-consistent wrong one, which certificate verification alone
      cannot do when the same wrong lift is used to construct and to check. The
      record must state at which size independent-SOLVER checking stopped and
      that only independent-VERIFIER checking continued above it.
    - >-
      LEAKAGE NULL, SAME SHAPE, AND THE CONTROL THAT CATCHES THE WORST FAILURE
      MODE HERE. 100 instances on an anomalous curve where Q is a random curve
      point and no k is ever computed. It must still succeed, because in a group
      of prime order p every non-identity point is a multiple of P. Predicted
      100 out of 100. If the solver succeeds only on instances constructed as k
      times P, the harness is leaking k and every solve is void.
    - >-
      DEGENERATE-INPUT CONTROL. P the identity, Q the identity, and Q equal to
      P, each handled explicitly rather than by accident.
    - >-
      CURVE-CONSTRUCTION CONTROL. Every constructed curve records its p-times-G
      witnesses for at least three independent G plus a primality certificate
      for p at a stated tier, and at 30 bits an independent brute-force point
      count over all x in F_p giving the exact group order.
  independent_variables:
    - field size, 30, 40, 60, 80 and about 204 bits
    - trace, one for the treatment and two for the nearby control
    - CM discriminant, at least three of the seven usable values per size
    - instance construction, k times P versus random curve point
    - curve provenance, constructed versus named, Curve25519 and BN(2,254)
  metrics:
    primary:
      - >-
        verified solve count per size on constructed anomalous curves, integer
        out of 25, each with a certificate re-verified by an independent module
      - >-
        exact integer agreement count between the additive-transfer solver and
        baby-step giant-step at 30 and 40 bits, integer out of 25
      - >-
        verified solve count on the roughly 204-bit Anomalous row, integer out
        of 10
      - >-
        verified solve count on the trace-two nearby control, integer out of 100
        at each size
      - >-
        random-Q null solve rate, dimensionless in [0,1], out of 100
    secondary:
      - per instance, the certificate of curve, P, Q and k, the verification outcome, and the ORDER OF P
      - per instance, the solver field-operation count and wall clock
      - per negative control attempt, the FAILURE MODE, which is the measured part
      - the CM construction transcript per toy curve with its p-times-G witnesses
      - the number of distinct CM discriminants used per size
      - the 30-bit brute-force point count against p
      - the Anomalous re-sourcing outcome, with sources attempted and results
      - verifier_commit and the exact harness/toycurve.py revision used
      - the model-conversion transcript for Curve25519, with its verification
  heuristic_under_test: H3
  preregistered_prediction:
    quantity: >-
      Verified solve counts on the treatment and on each control, and the
      random-Q null solve rate.
    formula: >-
      100 out of 100 across the toy ladder and 10 out of 10 at 204 bits, because
      the additive transfer is deterministic and has no failure probability on a
      trace-one curve. Exactly zero on the trace-two control and on Curve25519
      and BN(2,254), because when the trace is not one, p times the lift of P
      does not lie in the kernel of reduction and the formal-logarithm step is
      inapplicable. Random-Q null rate 1.000, equal to the k-times-P rate,
      because every non-identity point of a prime-order group is a multiple of
      P.
    source: >-
      KN-TECH-033, read verbatim in this task for the trace-one isomorphism and
      for the applicability limit that the attacks do not degrade gracefully but
      simply do not apply. The construction pool correction is derived in
      H-ECDLP-e0ab87.
  band_non_degeneracy:
    checked_before_freezing: true
    forced_quantities_recorded_as_proofs_not_arms:
      - >-
        THE ZERO ON THE CROSS-CURVE NEGATIVES IS FORCED AND IS THEREFORE NOT THE
        INFORMATIVE PART. On a curve whose trace is not one, multiplication by p
        does not land in the kernel of reduction, so the map the solver applies
        is not defined and a verified success is impossible up to implementation
        error. Recording "zero successes" as though it were a measured
        discriminator would be recording a theorem. WHAT IS MEASURED INSTEAD is
        the FAILURE MODE per attempt, which is not forced, since the code could
        crash, could decline to produce a k, or could emit a k that fails
        verification, and only the third demonstrates that the certificate
        discipline rather than an exception is doing the work.
      - >-
        The trace-two control's zero is forced by the same theorem, but the
        control is retained as a MEASURED arm because what it establishes is
        different, that the solver's failure tracks the TRACE and not the field,
        the size, the model or the provenance. Curve25519 differs from the
        Anomalous row in all four simultaneously; the trace-two curve differs in
        one integer.
      - >-
        A CURVE-FREE NULL IS NOT REQUIRED HERE, AND THAT IS RECORDED AS A PROOF
        RATHER THAN AN OMITTED ARM. The metric is a discrete_log certificate,
        which is curve-specific BY CONSTRUCTION, because verification is a
        scalar multiplication performed on the stated curve. No non-curve object
        can produce a verifying certificate on E, so there is no signature a
        curve-free object could reproduce and no ECDLP-misreading risk of the
        kind the standing scope constraint exists to catch.
    surviving_bands_and_their_separations:
      - >-
        LEAKAGE NULL, WITH COMPUTED POWER. Predicted rate 1.000 on both arms.
        Under a true 10 percent leak effect, that is a random-Q rate of 0.90,
        the probability of observing zero failures in 100 instances is 0.9 to
        the 100th, about 2.7e-5, so the test has power above 0.9999 against a 10
        percent gap and above 0.99 against a 5 percent gap. This is the sharpest
        discriminator in the contract and it costs the same as the main run.
        NON-DEGENERATE.
      - >-
        INDEPENDENT-SOLVER AGREEMENT. Predicted exact integer equality on 25 of
        25 at 30 and 40 bits. A systematically wrong but self-consistent
        implementation produces certificates that verify against its own lift,
        so certificate checking alone cannot detect it; BSGS shares no code with
        the lift and can. NON-DEGENERATE, and it is the only arm that can catch
        that failure mode.
      - >-
        SIZE LADDER. 100 out of 100 across 30 to 80 bits and 10 out of 10 at 204
        bits, against the alternative that a size-dependent defect first appears
        above 80 bits, which is H2 and has no rigorous support. The certificate
        check runs at every size, so the alternative is DETECTED even though it
        cannot be prevented.
      - >-
        DISCRIMINANT SPREAD. At least three of the seven usable discriminants
        per size, against the artifact that a solver secretly depends on
        discriminant minus three and passes a single-discriminant ladder.
  scale_relevance:
    tier: crypto
    justification: >-
      The headline row is a roughly 204-bit prime, above the 96-bit crypto-tier
      boundary the certificate discipline sets, and the toy ladder spans 30 to
      80 bits. THE TIER DESCRIBES THE TESTED SCALE AND NOT THE IMPORTANCE. The
      algorithm applies to a set of curves whose density among Hasse-admissible
      orders is about four times the square root of p divided by p, vanishing at
      cryptographic size, so the exponent is spectacular and the applicability
      is negligible; reporting the first without the second would be the central
      dishonesty available here and is forbidden by the invalidation rules.
    correspondence: null
  tail_checks:
    - >-
      Instances chosen to include k near zero, k near p minus one, and k of low
      Hamming weight, since those are where an off-by-one or truncation defect
      surfaces first.
    - >-
      Per-size success rates reported separately and NEVER pooled, so that a
      size-dependent defect cannot be averaged away.
    - >-
      Confirm no constructed curve is supersingular by checking that the trace
      is one and not zero, and that j matches the intended discriminant.
    - >-
      Report the order of P alongside every k, since the certificate identifies
      k only modulo that order and is otherwise ambiguous.
  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 8
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - >-
      BLOCKING PRECONDITION, BEFORE ANY RUN. Read harness/toycurve.py and
      docs/claims-and-verification.md directly and record what they say. If
      toycurve.py cannot verify at 204 bits, the crypto-tier certificate is NOT
      emitted and the gap is reported; the solver's own arithmetic may never be
      substituted for the independent verifier.
    - >-
      BLOCKING PRECONDITION, SECOND. Convert Curve25519 to short Weierstrass
      form, or extend the solver to Montgomery form, and VERIFY the conversion,
      before its negative control is claimed to have run. A negative that fails
      because of a model mismatch rather than because of the trace is vacuous.
    - >-
      STAGE 1 FIRST, the cheapest valid discriminator. One 30-bit anomalous
      curve, 25 instances, requiring exact agreement with BSGS, certificate
      verification, and zero successes out of 25 on a 30-bit trace-two curve
      built the same way. If any of the three fails, HALT. This settles whether
      the instrument exists at all before any larger parameter is touched.
    - >-
      Proceed up the ladder only on a clean previous rung. Independent-SOLVER
      checking stops where BSGS becomes unaffordable, and the record states at
      which size it stopped rather than implying it continued.
    - >-
      HALT IMMEDIATELY on any verified success on the trace-two control, on
      Curve25519 or on BN(2,254). Exclude implementation error first, escalate
      to independent review-breakthrough scrutiny per AGENTS.md rule 12, and
      make no statement outside the repository until it is excluded.
  invalidation_rules:
    - >-
      Any recovered k is accepted without independent re-verification by a
      module that shares no lift code with the solver. Per the certificate
      discipline a failed certificate makes a run invalid_measurement, NOT a
      negative observation.
    - >-
      The verifier and the solver share the lift implementation, which lets a
      wrong lift verify against itself.
    - >-
      A single CM discriminant is used across a whole ladder, or the number used
      is not recorded.
    - >-
      An even discriminant, |D| in {4, 8}, is used for a trace-one construction.
      No such p is an integer and any curve so labelled is misconstructed.
    - >-
      The Curve25519 negative is claimed without a verified model conversion.
    - >-
      A live key, wallet or deployed target is used. RQ-SCURVE-d9b7d2's scope
      prohibits live keys and restricts targets to public named-curve
      parameters, generated controls and public certificates.
    - >-
      The exponent statement is reported without the scope statement, that is
      without the vanishing density of trace-one curves at cryptographic size.
    - >-
      The 204-bit row is cited as reproducing any published example when the
      re-sourcing attempt returned no primary specification.
    - >-
      Field operations are counted differently for the solver and for the rho
      formula it is compared against, which would make the ratio meaningless.
    - >-
      Any timeout, crash, or unavailable dependency is reported as a
      mathematical result rather than an infrastructure outcome, per AGENTS.md
      rule 5.
  success_criterion: >-
    All of the following on the same committed run set. Both blocking
    preconditions pass; 25 out of 25 verified solves at each of 30, 40, 60 and
    80 bits across at least three distinct usable CM discriminants; exact
    integer agreement with BSGS on 25 out of 25 at 30 and at 40 bits; 10 out of
    10 verified solves at the roughly 204-bit Anomalous row, each with a
    certificate; zero verified successes on the trace-two nearby control at
    every size and on Curve25519 and BN(2,254), with the failure mode recorded
    per attempt; and a random-Q null rate of 1.000 matching the k-times-P rate.
    The deliverable is a fired instrument and a reusable certificate, not a
    break, and the write-up must say so.
  falsification_criterion: >-
    Any of the following, scoped to the constructed curves, the tested sizes and
    discriminants, the named curves used as controls, the pinned implementation
    and the budget. A certificate that fails independent verification at any
    size, which is invalid_measurement and not a negative. Or BSGS disagreement
    on k at 30 or 40 bits, which is a wrong implementation certificate checking
    might not have caught. Or any verified success on the trace-two control, on
    Curve25519, or on BN(2,254), which halts everything. Or a random-Q null rate
    materially below the k-times-P rate, which means the harness leaks k and
    voids every solve. Or failure at 204 bits after full success at 80 bits,
    which falsifies H2, withdraws the headline certificate and reports the
    threshold size as a useful negative for the campaign's other instruments. Or
    a constructed curve failing its own p-times-G check or its 30-bit
    brute-force count.
  required_artifacts:
    - implementation source at a pinned revision, with the lift and the verifier as separate modules
    - the blocking-precondition record, stating what harness/toycurve.py and docs/claims-and-verification.md actually say
    - one discrete_log certificate per solved instance, with curve, P, Q, k and the ORDER OF P
    - the independent verification log, produced by code sharing no lift with the solver
    - the CM construction transcript per toy curve, with p-times-G witnesses and a primality certificate
    - the 30-bit brute-force point count against p
    - the BSGS agreement table at 30 and 40 bits, with the size at which independent-solver checking stopped
    - per-attempt failure MODE records for the trace-two, Curve25519 and BN(2,254) controls
    - the Curve25519 model-conversion transcript and its verification
    - the random-Q null's full results beside the k-times-P results
    - the degenerate-input control's handling of P and Q at the identity and Q equal to P
    - the Anomalous re-sourcing record, with sources attempted and outcomes
    - solver field-operation counts per size, with the counting convention stated
    - manifest per AGENTS.md artifact policy, including seeds, environment and dirty-tree state
  assigned_to: executor
  approved_by: null
