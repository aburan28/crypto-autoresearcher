# EXP-FROB-215af4
# Genus-formula arithmetic. No curve.
# Approved by DEC-20261002-f9df71.
experiment:
  id: EXP-FROB-215af4
  hypothesis_id: H-FROB-c722b7
  source_idea: IDEA-20261002-8f26ce
  question_id: RQ-FROB-7d8dd4
  version: 1
  title: Genus-formula arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-f9df71
  objective: >-
    Check that degrees 3, 11 and 13 have genera 1, 5 and 6, and that
    degree 12 leaves the odd remainder 11.
  inputs:
    degree_1: 3
    genus_1: 1
    degree_5: 11
    genus_5: 5
    degree_6: 13
    genus_6: 6
    even_degree: 12
    even_remainder: 11
    shifted_genus_11: 6
    monic_3: 8
    monic_11: 2048
    monic_13: 8192
    multiples_5: 51
    product_5: 6681
    remainder_5: 44
    ceiling_5: 6725
    multiples_6: 299
    product_6: 39169
    remainder_6: 32
    ceiling_6: 39201
  controls:
    - >-
      Ten divided by 2 is 5. Reporting the genus of degree 11 as 6
      invalidates the run.
    - >-
      Twelve minus 1 is 11, which is odd. Reporting an integer genus
      for degree 12 invalidates the run.
    - >-
      Twice 5 plus 1 returns 11. Twice 6 plus 1 returns 13. Twice 1
      plus 1 returns 3.
    - >-
      6725 minus 6681 is 44. 39201 minus 39169 is 32. Two to the 11
      is 2048.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - route in {subtract_then_halve, double_then_add}
  metrics:
    primary:
      - genus_5
      - genus_6
      - even_remainder
      - implementations_agree
    secondary:
      - monic_11
      - remainder_5
      - remainder_6
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Degree 11 has genus 5, degree 13 has genus 6, and degree 12
      leaves remainder 11.
    formula: >-
      Subtract 1 from the degree and divide by 2 when the difference
      is even. Multiply 131 by 51 and by 299 and subtract from the
      ceilings.
    source: >-
      IDEA-20261002-8f26ce states odd degrees 11 and 13 and the
      ceilings 6725 and 39201, read 2026-10-02. The quotients were
      computed in this design session. That computation is not a run.
      No curve was enumerated.
  scale_relevance:
    tier: toy
    justification: Integers. No transfer to a Jacobian.
    correspondence: null
  tail_checks:
    - The odd remainder 11 is required. A check that stops at degree 11 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the genus 5 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - Ten divided by 2 is not 5.
    - Twelve divided by 2 is not 6.
    - Degree 12 is reported as having an integer genus.
    - The genus of degree 11 is reported as 6.
    - A curve is enumerated or an eliminant is computed.
  success_criterion: >-
    Both runs agree that the genera are 1, 5 and 6, that degree 12
    leaves the odd remainder 11, that 6725 minus 6681 is 44, and that
    39201 minus 39169 is 32.
  falsification_criterion: >-
    The runs agree that 11 minus 1 is 10, and 10 divided by 2 is not 5.
  required_artifacts:
    - experiments/EXP-FROB-215af4/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-FROB-215af4/runs/<RUN-ID>/command.txt
    - experiments/EXP-FROB-215af4/runs/<RUN-ID>/stdout.log
    - experiments/EXP-FROB-215af4/runs/<RUN-ID>/stderr.log
    - experiments/EXP-FROB-215af4/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-FROB-215af4/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any curve enumeration or character sum.
    - Any claim that genus 5 supplies a factor base.
    - Any measured eliminant degree.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
