experiment:
  id: EXP-ALECF-bd6443
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-67a1b4; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-67a1b4
  question_id: RQ-ALECF-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Compute the gate-count partition residual on every committed ALECF log row in exact arithmetic,
    calibrate the metric against an interpreter where completeness holds by construction, and narrow
    the set of readings consistent with all rows.
  objective: 'The one uncertainty a run reduces is how much of a reported operation stream the reported
    gate categories actually account for, and whether that shortfall is stable enough to be attributed.
    Concretely: (i) computed in exact rational arithmetic over all 130 committed data rows across
    the three ALECF logs, what is the residual fraction one minus (toffoli plus clifford) divided
    by ops, what is its distribution, and at exactly which rows does it change; (ii) does the residual
    metric calibrate correctly on an instrument where partition completeness is guaranteed by construction,
    returning exactly zero on complete reports and exactly the omitted category''s share when one
    category is deliberately withheld; (iii) among an enumerated set of candidate readings of what
    the ops column counts, which are consistent with every committed row, and does the reconstruction
    procedure avoid returning readings for synthetic logs that are complete, which is the false-positive
    control without which any narrowing is noise-fitting. A run does not claim to know what the uncounted
    operations are, does not claim the original counting was erroneous, does not affect the committed
    scores (which use Toffoli count and peak width only and reproduce exactly), and claims no attack
    or security consequence. The deliverable is the per-row residual table, the calibration result,
    the consistent-reading set or an explicit empty set, and the false-positive rate.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: on the committed bytes of
      the three ALECF results.tsv files at the audited hashes, the residual fraction takes the measured
      per-row values; the residual metric calibrates as measured on interpreter-generated logs; and
      among the enumerated candidate readings, the measured subset is consistent with every row. WHAT
      DOES NOT FOLLOW: no conclusion about what the uncounted operations are, no conclusion that the
      original campaign counted anything incorrectly, no conclusion about the committed scores'' correctness,
      nothing about the circuits, nothing about 256-bit quantum cost, and no attack or security consequence.
      A residual is a statement about the relation among reported columns and about nothing else,
      and a nonzero residual is fully consistent with a deliberate and correct reporting choice that
      this repository simply does not hold the documentation for.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes): record sha256 for the three committed results.tsv files and
      freeze the audited paths. STAGE 1 (cost: under an hour): parse all 130 data rows with exact
      rational arithmetic and compute the residual per row; report the distribution and the exact
      rows at which it changes. STAGE 2 (cost: two hours, reusing the interpreter): tag every emitted
      operation with a category by construction and verify residual exactly zero across five circuit
      kinds; then withhold one category and verify the residual equals its exact share. STAGE 3 (cost:
      two to three hours): enumerate candidate readings of the ops column, express each as a testable
      relation among the columns, and evaluate each against every committed row, retaining only readings
      consistent with all. STAGE 4 (cost: one hour): generate synthetic complete and incomplete logs,
      30 of each, and run the reconstruction to measure the false-positive and true-positive rates.
      STAGE 5 (cost: under an hour): report the per-row residual table, the calibration results, the
      consistent-reading set (possibly empty), and the reconstruction rates, with every committed
      number traceable to a hashed input.'
    instrument: 'Python 3.11 standard library only: fractions.Fraction for exact arithmetic on the
      fractional committed counts, csv for tab-separated parsing, hashlib for artifact hashing, and
      the classical basis-state reversible interpreter built for this bucket''s tooling contract,
      extended so that every emit path assigns a category tag and the completeness invariant is asserted
      rather than assumed. pytest for the calibration controls. harness/runner.py for the run record.
      No Sage, no numerical libraries for the core arithmetic (floating point would obscure exactly
      the quantities being measured), no hardware, no network, and no attempt to execute the Autolab
      Rust harness, which is not present in this repository.'
    parameters: 'Three committed logs with 8, 114 and 8 data rows, 130 rows total, all audited. Interpreter
      calibration: 5 circuit kinds times 2 report modes (complete, one category withheld). Candidate
      readings: at least 4 enumerated, each expressed as an exact relation. Synthetic validation logs:
      30 complete and 30 incomplete, with omitted-category shares drawn across the range 0.05 to 0.35
      to bracket the observed residuals. All arithmetic in exact rationals with no floating-point
      intermediate.'
  controls:
  - Interpreter-generated logs with a partition complete by construction, on which the residual must
    be exactly zero.
  - Interpreter-generated logs with one category of known share deliberately omitted, on which the
    residual must equal that share exactly.
  - 'Reconstruction false-positive control: the procedure run on complete synthetic logs must return
    no reading claiming an uncounted category.'
  - Exact rational arithmetic throughout, so that a residual of 2107349.831 is not confused with a
    floating-point artifact.
  - Hash-first discipline on every committed artifact read, with sha256 recorded before parsing.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a synthetic log generated from a circuit whose category
    partition is complete by construction, so its true residual is exactly zero, plus a second synthetic
    family in which one category of known share is deliberately omitted from the report. The identical
    residual computation and reconstruction procedure runs on both in the same invocation as the committed-data
    measurement. For the signal arm to mean anything the null must show: exactly zero residual on
    the complete family, and a residual equal to the omitted category''s exact share on the incomplete
    family, with the reconstruction procedure identifying the omitted category and, on the complete
    family, identifying none. A reconstruction procedure that finds an explanation for a zero residual
    is fitting noise, and every reading it offers for the committed rows would then be uninterpretable.'
  independent_variables:
  - log row
  - package
  - report mode (complete versus one category withheld)
  - candidate reading
  - synthetic log completeness
  metrics:
    primary:
    - residual fraction per committed row
    - interpreter residual under complete and withheld report modes
    - consistent-reading set membership
    - reconstruction false-positive rate
    secondary:
    - residual distribution summary per package
    - row indices at which the residual changes
    - reconstruction true-positive rate on incomplete synthetic logs
    - sha256 of each audited artifact
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The residual fraction R per committed row, and the calibration values of R on interpreter-generated
      logs.
    formula: 'R(row) = 1 minus (toffoli(row) plus clifford(row)) divided by ops(row), evaluated in
      exact rational arithmetic. Pre-registered values recomputed from committed bytes and predicted
      to be reproduced by the run: on the shared prefix row with toffoli 3942753.000, clifford 22627118.169
      and ops 28677221, R equals 0.0734851480553154 to the reported precision; on EXP-ALECF-001''s
      final row with toffoli 1316080.523, clifford 5530669.476 and ops 9759245, R equals 0.2984; on
      EXP-ALECF-003''s final row with toffoli 1423722.774, clifford 5534004.299 and ops 10122449,
      R equals 0.3126. Calibration predictions: R equals exactly 0 on complete interpreter logs, and
      R equals exactly the withheld category''s share on withheld-mode logs.'
    source: Pre-registered in the parent proposal IDEA-20260816-67a1b4 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The audited artifacts are toy-tier imports whose own evidence record fixes claim
      tier toy as a hard ceiling (EV-ALECF-001), and the calibration circuits are toy reversible arithmetic
      at small widths. No parameter is swept toward cryptographic scale and no extrapolation is performed:
      the tested scope is exactly the 130 committed rows and the interpreter-generated calibration
      logs. The one stated transfer assumption is that the residual metric, being pure arithmetic
      on reported columns, is scale-independent by construction, which is a property of the definition
      rather than a claim about circuits.'
    correspondence: null
  tail_checks:
  - Inspect the rows at which the residual changes to confirm the change is abrupt rather than gradual,
    which distinguishes a redefinition from drift.
  - Check the 114-row log for internal residual variation invisible in the head and tail, since only
    that package has enough rows to show a distribution.
  - Examine rows where the correct field is not OK, if any exist, since a failed run's counts may
    follow different conventions.
  - Check whether any candidate reading fits the prefix rows but not the final rows, which would itself
    be evidence of a mid-campaign redefinition.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Terminate after all 130 committed rows and the declared calibration and synthetic sets; the audit
    is exhaustive by construction.
  - Abort if any audited artifact's sha256 does not match the value recorded at STAGE 0.
  - Abort and report an instrument failure if the interpreter returns a nonzero residual on a complete-partition
    circuit.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run reproduces the pre-registered residual values from hashed committed bytes
    in exact arithmetic, passes both calibration controls exactly, reports the full per-row residual
    distribution with its change points, and reports the consistent-reading set together with the
    reconstruction's false-positive and true-positive rates.
  falsification_criterion:
  - The interpreter returning a nonzero residual on a complete-partition circuit.
  - The withheld-category calibration returning a residual different from the omitted share.
  - Reconstruction false-positive rate above 0.05 on complete synthetic logs.
  - Recomputed residuals on committed rows differing from the pre-registered values, indicating a
    parsing error.
  - The consistent-reading set being empty, which closes the reconstruction in the negative while
    leaving the residual measurement intact.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-67a1b4
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The candidate readings of the ops column are enumerated by the author and their completeness cannot
    be certified; a Coordinator must decide whether the record states the consistent set as a narrowing
    with an open-ended caveat, which is the honest option.
  - Whether a nonzero residual should become a required field in this program's run-record schema
    for any counting artifact is a program-level policy decision and is deliberately not pre-judged
    here.
  - The five interpreter circuit kinds for calibration are unspecified and must be named before approval.
  - It must be decided whether the 114-row package's internal residual distribution warrants separate
    reporting, since it is the only package with enough rows to support a distribution at all.
