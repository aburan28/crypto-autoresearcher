# EXP-BINSTD-c3090b
# Window-count arithmetic. No cover is built.
# Approved by DEC-20261003-a52384.
experiment:
  id: EXP-BINSTD-c3090b
  hypothesis_id: H-BINSTD-f677d0
  source_idea: IDEA-20261002-26c628
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Composite count versus the prime count
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-a52384
  objective: >-
    Check the excess 11, the inclusive count 25, and the product 66.
  inputs:
    lo: 17
    hi: 41
    inclusive: 25
    span: 24
    span_gap: 1
    primes: 7
    prime_sum: 197
    prime_product: 10131543907
    composites: 18
    composite_excess: 11
    hour_cap: 6
    excess_product: 66
    class_sum: 25
    cap_gap: 1
  controls:
    - >-
      Eighteen minus 7 is 11. Reporting 18 as 7 invalidates the run.
    - >-
      The product of 11 and 6 is 66. Eighteen plus 7 is 25. Forty-one
      minus 17 is 24, and 25 exceeds 24 by 1.
    - >-
      The prime sum is 197 and the prime product is 10131543907.
      Forty-one minus 40 is 1.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {count, excess, product}
    - route in {difference, product}
  metrics:
    primary:
      - composite_excess
      - excess_product
      - implementations_agree
    secondary:
      - inclusive
      - prime_product
      - span_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Eighteen exceeds 7 by 11. Twenty-five exceeds 24 by 1. The
      product of 11 and 6 is 66.
    formula: >-
      Count the integers from 17 through 41. Separate primes from
      composites. Subtract 7 from 18. Multiply 11 and 6.
    source: >-
      IDEA-20261002-26c628 states the window from 17 through 41 and
      the hour cap 6, read 2026-10-03. It does not name a genus
      ceiling. The counts were recomputed in this design session.
      That computation is not a run. No cover was built.
  scale_relevance:
    tier: toy
    justification: One written window and one written hour cap. No transfer to a genus.
    correspondence: null
  tail_checks:
    - The product 66 and the inclusive count 25 are required. A check that stops at the excess 11 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the excess 11 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The excess is not 11.
    - The inclusive count is not 25.
    - The product is not 66.
    - A cover is built, or 18 is reported as 7.
  success_criterion: >-
    Both runs agree that 18 minus 7 is 11, that the inclusive count
    is 25, that 25 exceeds 24 by 1, and that the product of 11 and 6
    is 66.
  falsification_criterion: >-
    The runs agree that 18 minus 7 is computed, and that difference
    is not 11.
  required_artifacts:
    - experiments/EXP-BINSTD-c3090b/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-c3090b/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-c3090b/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-c3090b/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-c3090b/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-c3090b/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any cover, genus reading, or curve construction.
    - Any claim that a composite degree stays under an unnamed ceiling.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
