experiment:
  id: EXP-GGMB-b902c5
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-fd2d89
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE CANONICAL-HEIGHT ORACLE IS NON-SIMULABLE AND QUANTITATIVELY USELESS, AND CM MAKES IT
    WORSE RATHER THAN BETTER: any lift in which the height data depends on k must satisfy h(Q~) =
    k^2 * h(P~), so its coordinates carry about N^2 bits and writing it down already costs more than
    solving the instance; and the CM constraint that lane L9 hoped would bite instead FIXES the curve,
    removing exactly the freedom Xedni used to force small-height lifts, so the minimal height of
    a global point reducing to a specified P grows like N^{2/r} with a rank r one no longer gets to
    choose'
  status: draft
  objective: "(A) THE ORACLE. CHT(h) returns the canonical height h_hat(h~) of a lift h~ of the handle\
    \ h to a curve of characteristic zero, or the height pairing <P~, Q~> of the lifted basis. Resource\
    \ R6 (lifts to Z_p or to a number field). This is the oracle form of DECOMPOSITION lane L9 and\
    \ of the Xedni family.\n(B) THE FIRST ADJUDICATION. NON-SIMULABLE, in the (N-weak) sense: the\
    \ answer is a function of characteristic-zero data -- which lift was chosen -- and not of the\
    \ linear form lambda. A generic simulator cannot produce it.\n(C) THE SECOND ADJUDICATION, WHICH\
    \ IS THE ONE THAT DECIDES. SELF-COMPUTABLE: the adversary chooses the lift, so it holds the lifted\
    \ coordinates, and the canonical height of a rational point is computable in polynomial time by\
    \ standard archimedean-plus-non-archimedean decomposition. Verdict PUB, cell (b) of IDEA-20260807-5876b8.\
    \ The oracle framing is empty and the real question is whether the LIFTING ALGORITHM helps.\n\
    (D) THE QUANTITATIVE CLOSURE, AND IT IS A NUMBER RATHER THAN AN INTUITION. Split on whether the\
    \ lift respects the relation.\n  CASE 1 -- THE LIFT DOES NOT RESPECT Q = [k]P. Then P~ and Q~\
    \ are two points\n    chosen by the adversary with no relation between them, so the height\n \
    \   pairing <P~, Q~> is a function of the adversary's own choices and of the\n    lifted curve.\
    \ It is INDEPENDENT OF k: the same lift is available for\n    every k, and resampling k with the\
    \ curve, P, Q~ and the lift held fixed\n    changes no height. So the height data carries exactly\
    \ zero bits about k.\n    This is the same obstruction IDEA-20260807-413fcc names, applied to\
    \ a\n    handle-taking oracle whose answer nonetheless factors through\n    adversary-chosen data.\n\
    \  CASE 2 -- THE LIFT RESPECTS Q = [k]P, i.e. Q~ = [k]P~ in the global\n    Mordell-Weil group.\
    \ Then the canonical height is a quadratic form, so\n      h_hat(Q~) = k^2 * h_hat(P~).\n    With\
    \ k of size about N, and h_hat(P~) bounded below by a positive\n    constant for a non-torsion\
    \ point (Lang's conjecture direction aside, any\n    specific non-torsion point has a specific\
    \ positive height), h_hat(Q~) is\n    about N^2. Canonical height is essentially the logarithm\
    \ of the\n    coordinate size, so Q~ has coordinates of about N^2 bits. WRITING THE\n    WITNESS\
    \ DOWN COSTS ABOUT N^2 BITS, WHICH EXCEEDS THE 0.886*sqrt(N) GROUP\n    OPERATIONS OF RHO BY A\
    \ FACTOR OF ABOUT N^{1.5}. The oracle is\n    realizable only at a cost that is worse than the\
    \ baseline by an exponent\n    of 1.5, not by a constant.\n  THERE IS NO CASE 3. Either the lift\
    \ encodes the relation, and then it is\n  astronomically large; or it does not, and then it says\
    \ nothing about k.\n  That dichotomy IS the Xedni failure mechanism (Jacobson-Koblitz-Silverman-\n\
    \  Stein-Teske, relayed via KN-LIT-020/021 and DECOMPOSITION L9), restated as\n  an oracle adjudication\
    \ with the exponent written out.\n\n(E) THE CM SHARPENING, WHICH IS WHAT L9 ACTUALLY ASKED AND\
    \ WHICH GOES THE WRONG WAY. DECOMPOSITION L9 asks whether \"the CM structure of the canonical\
    \ lift constrains the lifted points enough to make height/regulator arguments bite\", and demands\
    \ that any variant \"state how CM changes that specific quantity\". It changes it ADVERSELY, for\
    \ a structural reason:\n  Xedni's whole device is to choose the CURVE to fit the POINTS -- lift\
    \ the\n  points first with small coordinates, then solve for a curve through them.\n  That works\
    \ because the curve has free coefficients.\n  A CM CONSTRAINT REMOVES EXACTLY THAT FREEDOM. Requiring\
    \ the lifted curve to\n  have CM by a specified order pins its j-invariant to a root of the Hilbert\n\
    \  class polynomial H_D, so the curve is determined up to twist and one can no\n  longer solve\
    \ for it through chosen points.\n  The consequence is a counting statement. On a fixed curve over\
    \ a number\n  field K of Mordell-Weil rank r, the number of points of canonical height at\n  most\
    \ B grows like B^{r/2}. To find a global point reducing to a SPECIFIED\n  point of E(F_p) one\
    \ must search a set of size at least about N, hence\n    minimal height about N^{2/r}.\n  Xedni\
    \ buys a large effective r by moving the curve; CM forbids that, and CM\n  curves over their natural\
    \ fields of definition have small rank -- rank\n  zero occurs, in which case NO non-torsion global\
    \ point exists at all and\n  the reduction map's image is finite, so P and Q are simply not reductions\n\
    \  of anything.\n  SO THE HONEST ANSWER TO L9 IS: CM does not make heights bite, it removes\n\
    \  the only lever Xedni had. Filed here because it is an ORACLE adjudication\n  with a named quantity,\
    \ which is what the lane asked for.\n  [The Mordell-Weil counting asymptotic and the rank behaviour\
    \ of CM curves\n  are RELAYED standard facts, NOT re-derived here; the Serre-Tate canonical\n\
    \  lift is p-adic and carries no archimedean canonical height at all, which is\n  an independent\
    \ reason the \"canonical lift\" reading of L9 does not connect\n  to a height argument. Both flagged.]\n\
    \n(F) WHAT WOULD REFUTE IT. Exhibit a lifting construction, CM-constrained or not, producing a\
    \ global point of canonical height o(N^2) that reduces to a specified Q with Q = [k]P respected.\
    \ By (D) Case 2 that contradicts the quadraticity of the canonical height, so a refutation must\
    \ be a refutation of the height being a quadratic form -- which it is -- or must be using a different\
    \ height, and naming which height is then the whole content. That is a sharp and unusually well-posed\
    \ falsification target."
  resource_label: 'R6 (lifts to Z_p or characteristic zero), with R3 (End as a ring) in the CM variant.
    CLAIMED AND GENUINE -- the oracle really does consume characteristic-zero data. VERDICT: the resource
    is consumed and is quantitatively insufficient, by an exponent of 1.5 in Case 2 and by zero information
    in Case 1.'
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE: the oracle''s answer is not a function of the group-operation
    transcript, it does not merely apply an endomorphism to points of G, and it consumes resource
    R6, which DECOMPOSITION section 2 lists as escaping the generic model ("a different group"). The
    admissibility filter passes it. The closure here is therefore NOT a genericity closure -- it is
    a COST closure, which is a different and stronger kind, and the record is careful to say so: the
    lane dies on arithmetic, not on the GGM.'
  reachability_gate: 'APPLIES IN AN UNUSUAL FORM AND IS DISCHARGED BY COST. L9''s analogue of T5 is
    "is a good LIFT reachable, and at what cost?" The answer from (D) Case 2 is quantitative: a relation-respecting
    lift exists mathematically -- the global Mordell-Weil group of a curve of positive rank contains
    [k]P~ -- but its coordinates carry about N^2 bits, so it is unreachable by an exponent of 1.5
    over the rho baseline, not by a constant. And (E) says the CM route, which might have been hoped
    to shrink the search, instead removes the freedom that made Xedni''s search possible at all. Good
    objects exist and are astronomically far away; that is a cleaner disposition than "no good object
    exists" and it is the honest one.'
  inputs:
    procedure: 'STAGE 0 (zero compute, 1 hour, HARD GATE): the two adjudications, the case split,
      the N^2 computation, and the reconciliation with DECOMPOSITION L9''s recorded exponent. If the
      case split is not exhaustive, stop. STAGE 1 (zero compute): the CM direction-of-effect argument,
      with both relayed facts flagged and a Stage-0 literature obligation to confirm or drop them.
      STAGE 2 (toy compute, <= 10 min, HARD GATE): ARM 4, the planted small-height lift. The search
      must find it. STAGE 3 (toy compute, <= 20 min): ARMS 1 and 2 over the p ladder and the rank
      ladder, with rank-zero curves as a separate control. STAGE 4 (toy compute, included): ARM 3,
      the target-resampling null. STAGE 5 (zero compute): write the L9 answer and its forward guidance,
      naming the trace-one p-adic route as the one lifting mechanism that pays and its coincidence
      as the reason.'
    mechanism: "STEP 1 (zero compute) -- THE TWO ADJUDICATIONS: non-simulable (N-weak), self-computable,\
      \ verdict PUB. Two paragraphs.\nSTEP 2 (zero compute) -- THE CASE SPLIT of (D). Write out h_hat([k]P~)\
      \ = k^2 h_hat(P~), substitute k about N, convert height to coordinate bit-length, and state\
      \ the N^2 figure and the N^{1.5} ratio against 0.886*sqrt(N). Then write the Case 1 independence\
      \ argument. State that the split is exhaustive.\nSTEP 3 (zero compute) -- THE CM SHARPENING\
      \ of (E). State that CM pins the j-invariant to a root of H_D, so the curve cannot be solved\
      \ for through chosen points; state the B^{r/2} counting asymptotic and the resulting N^{2/r}\
      \ minimal height; note the rank-zero degenerate case where the reduction map's image is finite.\
      \ Flag the two relayed facts.\nSTEP 4 (toy compute, <= 30 minutes) -- THE MEASUREMENT, AND IT\
      \ IS A REAL ONE RATHER THAN A CONFIRMATION OF ARITHMETIC. At small p (p <= 2^14, small enough\
      \ that global point searches terminate):\n  ARM 1, NON-CM: take an elliptic curve over Q of\
      \ known rank r with good\n    reduction at p; for a specified point R in E(F_p), search for\
      \ the\n    smallest-height rational point reducing to R; record that minimal height\n    as\
      \ a function of p and r.\n  ARM 2, CM: the same measurement on a CM curve over Q (j = 0 and\
      \ j = 1728\n    are the accessible cases, with D_0 = -3 and -4) of known rank.\n  ARM 3, NULL:\
      \ resample the target R uniformly with the curve and the lift\n    machinery held fixed; the\
      \ minimal-height DISTRIBUTION must be unchanged,\n    confirming the quantity depends on the\
      \ curve and not on which point was\n    asked for. This is the canonical artifact control and\
      \ it is the same one\n    DECOMPOSITION prescribes for lane L7.\n  ARM 4, PLANTED: choose a\
      \ rational point S of known small height, reduce it\n    to get R = S mod p, and ask for the\
      \ minimal-height lift of R. The\n    procedure must find something of height at most h_hat(S).\
      \ A search that\n    misses a planted small-height lift is broken and every large-height\n \
      \   result it produced is void.\nPREDICTION: minimal height grows like p^{2/r} in both arms,\
      \ with the CM arm no better and typically worse because its r is smaller; and no arm produces\
      \ a relation-respecting lift at any height, because Case 2's N^2 is unreachable even at p =\
      \ 2^14 (N^2 about 2^28 in the height exponent, i.e. coordinates with tens of millions of digits).\n\
      STEP 5 (zero compute) -- WRITE THE L9 ANSWER: CM removes Xedni's lever rather than supplying\
      \ a new one; forward guidance is that the only lifting route known to pay is the trace-one formal-group\
      \ logarithm, whose coincidence is named and is out of the target family."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - planted small-height lift (ARM 4, blocking)
  - target resampling with curve fixed (ARM 3, the canonical artifact control, blocking)
  - p ladder {2^8, 2^10, 2^12, 2^14} as the decay test
  - rank ladder r in {0, 1, 2}, with rank 0 required to produce nothing
  - trace-one curve excluded from the arms and retained as the proving-too-much boundary check
  - good reduction at p verified per curve; factored group order recorded
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, and it is ARM 3 plus ARM 4. NULL DIRECTION
    (ARM 3): resample the target point R with the curve and the lift machinery fixed. The minimal-height
    distribution must be UNCHANGED, because by (D) Case 1 the height data does not depend on which
    point was asked for beyond its being a uniform residue. A measured dependence on R would mean
    the search is exploiting something about R and is the one result here that would be worth chasing.
    PLANTED DIRECTION (ARM 4): a point with a known small-height lift must have that lift found. A
    search that misses it cannot support any "no small lift exists" statement, and every such statement
    it produced is void. DECAY PARAMETER: p, over {2^8, 2^10, 2^12, 2^14}. The minimal height must
    GROW with p, like p^{2/r}. A minimal height that does NOT grow with p is the canonical artifact
    tell -- it would mean the search is finding torsion or is not actually constrained to reduce to
    R -- and it voids the arm. SECOND DECAY PARAMETER: the rank r, compared across curves of rank
    0, 1, 2. Rank 0 must produce NO non-torsion lift at all; that is the sharpest single prediction
    in the record and it is cheap.'
  independent_variables: []
  metrics:
    primary:
    - minimal canonical height per (curve, p, target), with the search bound
    - fitted exponent of minimal height against p, per rank
    - CM versus non-CM comparison at matched p and rank
    - non-torsion point count on rank-zero curves
    secondary:
    - ARM 3 distribution comparison over 200 resampled targets
    - ARM 4 pass/fail
  heuristic_under_test: null
  preregistered_prediction:
    quantity: minimal canonical height of a rational point reducing to a specified point of E(F_p),
      as a function of p over {2^8, 2^10, 2^12, 2^14}
    formula: Grows with p, consistent with a p^{2/r} scaling; the fitted exponent must be positive
      with the fit reported. A minimal height flat in p means the search is finding torsion or is
      not enforcing the reduction constraint, and the arm is void.
    source: pre-registered in IDEA-20260807-fd2d89 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - TORSION. Torsion points have canonical height zero and reduce to specific residues. A search that
    returns torsion "solves" the minimal-height question trivially and meaninglessly. Torsion must
    be excluded explicitly and the exclusion recorded.
  - RANK DETERMINATION. Ranks of curves over Q are not always easy to compute and a wrong rank invalidates
    the matched comparison. Only curves with confidently known rank should be used, and the source
    of each rank recorded.
  - HEIGHT NORMALISATION. Canonical heights come in several normalisations differing by a factor of
    2 or by the field degree. All arms must use one normalisation and it must be stated; a cross-arm
    comparison in mixed normalisations measures the normalisation.
  - VACUOUS CONFIRMATION AT RANK ZERO. A rank-zero curve confirms every no-small-lift statement by
    having no points at all. It is a control, not an arm, and mixing it into the arms would inflate
    the result.
  - RELAYED-FACT CREEP in (E). The B^{r/2} asymptotic and CM rank behaviour are flagged. If a downstream
    record cites them as established on the strength of this proposal, that is a citation failure
    originating here.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Grows with p, consistent with a p^{2/r} scaling; the fitted exponent must be
    positive with the fit reported. A minimal height flat in p means the search is finding torsion
    or is not enforcing the reduction constraint, and the arm is void.
  falsification_criterion:
  - The case split is not exhaustive -- a third kind of lift is exhibited. The closure fails and the
    record is superseded.
  - The quadraticity argument is wrong for the height actually relevant, e.g. because a different
    height or a quotient makes the dependence linear. Then the N^2 becomes N and the gap against rho
    shrinks from an exponent to a factor, which materially weakens the closure without eliminating
    it.
  - 'ARM 4 fails: a planted small-height lift is not found. The search cannot support any "no small
    lift" statement and every large-height result is void.'
  - ARM 3 shows a dependence on the requested target. (D) Case 1 is wrong; chase it.
  - The CM arm shows lower minimal heights than the non-CM arm at matched rank. (E)'s direction of
    effect is wrong, L9 reopens, and independent review is required before any record states it.
  - Global point searches do not terminate at p <= 2^14 within budget. INFRASTRUCTURE outcome under
    AGENTS.md rule 5, reported as such, never as a null.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
