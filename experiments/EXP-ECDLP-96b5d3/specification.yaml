experiment:
  id: EXP-ECDLP-96b5d3
  hypothesis_id: H-ECDLP-6c52c0
  question_id: RQ-ECDLP-002
  goal_id: null
  version: 1
  status: review_required
  claim_tier: toy
  title: >-
    Two-part contract: a ZERO-COMPUTE audit of whether this repository's
    comparator convention carries a memory-matched column, gated first and able
    to falsify the whole record by exhibiting one; then a toy discrimination
    between the preprocessing frontier law and the no-advantage rival law at
    sigma = 1/3, which is the discriminating point because DEC-20260806-8f7e4f
    already found sigma = 0 is not

  objective: >-
    PART 1, AUDIT, ZERO COMPUTE, BLOCKING AND FIRST. Determine whether any
    committed record in this repository states a comparator threshold with the
    generic baseline evaluated at the CANDIDATE'S OWN MEMORY, rather than at the
    S = O(1) corner. Emit the two-column threshold table for point-decomposition
    index calculus at m = 3..10, in exponents and in bits at N = 2**256, and the
    Pareto verdicts that follow. IF THE AUDIT EXHIBITS A MEMORY-MATCHED COLUMN,
    THE RECORD'S CLAIM IS FALSIFIED AND NOTHING ELSE RUNS.
    PART 2, MEASUREMENT, TOY. Implement the known preprocessing chain
    construction and decide between two pre-registered rival laws for online
    cost at memory N**sigma, at the discriminating setting sigma = 1/3.
    NO ATTACK IS MOUNTED. NO ECDLP EXPONENT MOVES. TOTAL COST (OFFLINE PLUS
    ONLINE) REMAINS AT OR ABOVE N**(1/2) AT EVERY SIGMA, AND NO NOVELTY IS
    CLAIMED FOR THE CONSTRUCTION: KN-LIT-013 already records that a construction
    achieves S*T**2 ~ N, and DEC-20260806-8f7e4f refuted the source proposal's
    contrary framing.

  independent_variables:
    - name: sigma_log_N_memory
      values: [0, 0.1667, 0.25, 0.3333]
    - name: realised_N
      values: [near 2**18, near 2**20, near 2**22]
    - name: group_arm
      values: [elliptic_curve, z_mod_N_relabelled]
    - name: walk_arity_r
      values: [16, 64, 256]
    - name: stopping_rule_regime
      values: [at_rule, sixteen_times_above_rule]
    - name: amortization_policy
      values: [per_instance, per_curve, per_parameter_set]

  inputs:
    audit_search_paths:
      - ledger/hypotheses
      - ledger/proposals
      - ledger/decisions
      - ledger/evidence
      - ledger/questions
      - knowledge/techniques
      - knowledge/literature
      - knowledge/findings
      - knowledge/open-problems
      - experiments (specification.yaml files only)
      - ideas/catalogue-20260805
    audit_classification_rule: >-
      Every hit on a comparator statement - any threshold against 0.886*sqrt(N),
      "sqrt(N)", "birthday bound", "exponent 1/2", "rho baseline", or
      "B = rho 1/2" - is classified into exactly one of:
      MEMORY-BLIND (baseline stated at O(1) memory while the candidate is charged
      its own memory), MEMORY-MATCHED (baseline evaluated at the candidate's
      memory), or NOT-A-COMPARATOR. Counts are reported per class per path. A
      single MEMORY-MATCHED hit falsifies the record's claim and is reported with
      its record id and its exact quoted sentence.
    committed_anchors_to_be_re_read_not_assumed:
      - >-
        knowledge/techniques/KN-TECH-005.md - records
        S*T**2 = Omega~(n) with preprocessing, source_refs KN-LIT-011 and
        KN-LIT-013, and a "Program usage" section that reduces the technique to
        "B = rho 1/2".
      - >-
        knowledge/literature/KN-LIT-013.md - records that the bound is tight,
        that "a construction achieves S*T**2 ~ N", and that "with advice the
        online cost *can* beat the classic sqrt(N) generic bound". ITS OWN
        "Not verified here" SECTION STATES THE FULL PAPER WAS NOT READ.
      - >-
        ledger/decisions/DEC-20260806-8f7e4f.yaml - the binding prior verdict on
        the source proposal.
    curve_generation: >-
      The committed harness curve generator, with declared seeds. The realised
      subgroup order N is recorded per instance and every prediction is
      evaluated at the REALISED N, never at the nominal power of two.
    memory_unit: >-
      GROUP ELEMENTS, declared here and before any row is filled. Every reported
      memory figure restates the unit. A comparison against a record counting
      memory in bits is licensed only after both are restated in the same unit,
      and a record counting "table entries of unstated width" licenses no
      comparison at all.

  metrics:
    primary:
      - name: comparator_class_census
        unit: counts per class per path, plus the id and quoted sentence of every
          MEMORY-MATCHED hit
        definition: >-
          The audit's classification of every comparator statement found. A
          FLOOR-STYLE result: it asserts what was found in the searched paths on
          the branch state at the time of search, and never a permanent count.
      - name: median_online_group_operations
        unit: group operations
        definition: >-
          Median over at least 200 independent targets per cell of the number of
          group operations performed by the ONLINE stage alone, to recovery of a
          certified log. Reported with the interquartile range and the number of
          targets that failed within the restart cap.
      - name: rival_law_selection_at_sigma_one_third
        unit: LAW_A | LAW_B | NEITHER, per realised N
        definition: >-
          LAW_A (preprocessing frontier) predicts median online operations
          proportional to sqrt(N/S); LAW_B (no advantage) predicts proportional
          to sqrt(N), flat in sigma. Selection requires the measured median to
          sit within a factor of 2 of one law's prediction and at least a factor
          of 4 from the other's. NEITHER is a legitimate and reportable outcome.
      - name: offline_group_operations_charged
        unit: group operations
        definition: >-
          Actually executed offline operations per cell, charged and reported
          SEPARATELY and never folded into the online column.
      - name: three_column_cost_table
        unit: exponents and bits at N = 2**256
        definition: >-
          Offline, online and TOTAL, per sigma, per amortization policy. A table
          in this contract carries three columns or it carries none.
      - name: two_column_threshold_table
        unit: time exponent and bits at N = 2**256, m = 3..10
        definition: >-
          Required oracle-cost exponent to beat sqrt(N) versus to beat
          sqrt(N/B*) at B* = N**(1/(m+1)). The columns must differ by exactly
          1/(2*(m+1)).
      - name: exact_distinct_coverage
        unit: count of distinct group elements
        definition: >-
          Counted EXACTLY with a bitset over the subgroup, per cell, against the
          predicted (1-o(1))*S*L.
    secondary:
      - name: fitted_tau_on
        unit: exponent, with interval
        definition: >-
          Fitted exponent of median online operations in realised N at fixed
          sigma. REFUSED AND REPORTED AS UNFITTED whenever three sizes cannot
          support it or the interval exceeds 0.10.
      - name: measured_sigma_plus_two_tau_on
        unit: dimensionless
        definition: Read off the measured numbers at every cell.
      - name: hit_rate_uniformity_chi_square
        unit: chi-square statistic and p-value
        definition: >-
          Hit indicator binned by target x-coordinate residue class, testing
          HEUR-PRE-2's target-independence.
      - name: pareto_row_verdicts
        unit: DOMINATED | NOT-DOMINATED per row, with the dominating row named
        definition: >-
          Rows: rho, BSGS, algebra-free meet-in-the-middle, two-term index
          calculus at B*, and the preprocessed chain table at each sigma. Each
          row names the SOURCE OF ITS MEMORY, because the exponent triple does
          not identify an algorithm.
      - name: peak_rss_bytes
        unit: bytes
        definition: Measured per cell, reconciled against S group elements.

  controls:
    - name: C-B-AUDIT-CAN-FALSIFY
      kind: audit gate, blocking, zero compute, FIRST
      blocking: true
      description: >-
        The corpus audit runs before any group operation and can end the record.
        WHAT MAKES IT FAIL, CONCRETELY AND REACHABLY: any committed record that
        states a threshold with the baseline evaluated at the candidate's own
        memory. The nearest such candidates already known to exist are
        catalogue A1-4, which composes S*T**2 = Omega~(N) with index calculus to
        derive B >~ N**(1/3), and IDEA-20260805-c06631, whose rho rows carry a
        peak_memory column. A1-4 uses the bound in the LOWER-bound direction to
        constrain the candidate; if the audit finds it, or any other record,
        using it in the UPPER-bound direction to raise the BASELINE, the record's
        claim is falsified and the deliverable becomes a documentation note
        naming that record. THIS IS NOT A FORMALITY: DEC-20260806-8f7e4f already
        refuted this proposal's novelty framing on exactly this kind of finding,
        by opening KN-LIT-013.
      dispatcher_note: >-
        The absence result, if it survives, is a FLOOR over the searched paths at
        the searched branch state. It is never reported as "the corpus does not
        contain one", only as "the enumerated paths, searched at commit X, did
        not contain one", with the search commands recorded verbatim so a later
        reader can re-run them.
    - name: C-B-NULL-ZN-SAME-SHAPE
      kind: NULL OBJECT of the same shape, blocking
      blocking: true
      description: >-
        Replace the elliptic curve by Z/N with a random relabelling into the same
        coordinate range; keep the IDENTICAL walk, the IDENTICAL chain builder
        and the IDENTICAL online procedure. FORCED VALUE: the measured
        tau_on(sigma) curve must be IDENTICAL within the reported intervals,
        because the construction uses nothing elliptic - it is a generic-group
        algorithm and KN-TECH-005 applies to it in full.
        WHAT MAKES IT FAIL, CONCRETELY: a step function keyed on a curve-specific
        quantity. Curve x-coordinates cover only about half of F_p and points come
        in plus-or-minus-y pairs, so a step index computed as (x mod r) is NOT
        uniform on the curve while it is uniform on the relabelled Z/N, and the
        two arms' collision statistics separate. Equally, an implementation that
        shortcuts recovery using a y-sign or a point-compression collision would
        make the curve arm OUTPERFORM the null. Either way the implementation is
        exploiting structure it does not declare and the measurement is void.
        This null is unusual in that its expected outcome is AGREEMENT, and
        disagreement is the defect rather than the finding - which is stated in
        advance so agreement can never later be presented as corroboration of the
        frontier law.
    - name: C-B-RIVAL-LAW-PREREGISTERED
      kind: competing-hypothesis control, blocking
      blocking: true
      description: >-
        LAW B, the no-advantage law - online cost Theta(sqrt(N)) at every sigma -
        is written into this contract as a NAMED RIVAL with its own numeric
        predictions at every cell, not as a strawman. Selection between Law A and
        Law B is by the pre-registered margin rule and NEITHER is a permitted
        outcome.
        WHY THIS CONTROL EXISTS AND WHAT IT REPLACES: the source proposal ranked
        itself first on a sigma = 0 known-answer calibration, and
        DEC-20260806-8f7e4f found that calibration NOT DISCRIMINATING because Law
        B passes it identically. Ranking a design on a control that cannot fail
        is exactly the defect the last review round refuted. The sigma = 0 cell
        is retained here ONLY as an implementation check (C-B-RHO-REPRODUCTION)
        and is explicitly stripped of its discriminating role.
    - name: C-B-RHO-REPRODUCTION
      kind: implementation check, blocking, EXPLICITLY NON-DISCRIMINATING
      blocking: true
      description: >-
        At sigma = 0 the construction degenerates to a single chain and must
        reproduce Pollard rho: median online operations within 25 per cent of
        sqrt(pi*N/2) at every realised N.
        WHAT MAKES IT FAIL: a sign error or an off-by-one in the stopping rule,
        or an online walk that counts steps rather than group operations.
        DECLARED IN ADVANCE AND NOT ARGUED WITH: PASSING THIS CONTROL SUPPORTS
        NEITHER LAW. Law B passes it identically. It detects an implementation
        defect and nothing else, and no ranking, priority or verdict in this
        contract may rest on it.
    - name: C-B-DEGENERATE-MUST-SATURATE
      kind: forced-failure control, blocking
      blocking: true
      description: >-
        Set L so that S*L**2 = 16*N, sixteen times above the stopping rule.
        Chains must merge, EXACT distinct coverage counted by a bitset must fall
        materially below S*L, and measured online cost must stop improving.
        WHAT MAKES IT FAIL: if distinct coverage stays within noise of S*L at 16
        times above the rule, HEUR-PRE-1's coverage model is wrong and every
        online-time prediction resting on it is void. This is reachable: at
        N = 2**18 with small r the walk's departure from a random function is
        largest and constants dominate, and it is precisely the regime where the
        occupancy model is least trustworthy.
    - name: C-B-PLANTED-POSITIVE
      kind: positive control with an independently verified certificate, blocking
      blocking: true
      description: >-
        Plant a target whose log is a known multiple of a stored chain's start.
        Recovery must be exact and the certificate must be re-verified by code
        INDEPENDENT of the solver: recompute [k]P from scratch with the curve
        arithmetic module and compare to Q, in the run wrapper and never in the
        attack code, per docs/claims-and-verification.md.
        WHAT MAKES IT FAIL: a sign error in the log bookkeeping across the
        offline-chain and online-walk offsets, which is the single most likely
        defect in this construction and which no aggregate timing statistic would
        reveal. An instrument that cannot recover a planted log has no power and
        NO NEGATIVE MAY BE READ FROM ANY OTHER ARM.
    - name: C-B-LOWER-BOUND-TRIPWIRE
      kind: contradiction tripwire, blocking
      blocking: true
      description: >-
        Compute sigma + 2*tau_on from the MEASURED numbers at every cell. Any
        cell returning materially below 1 is either a measurement error or a
        contradiction of the generic preprocessing lower bound recorded at
        KN-TECH-005. The run HALTS at that cell and is routed to review; it is
        NOT reported as a result.
        WHAT MAKES IT FAIL: the measured quantity is free to come out below 1 -
        for instance if the online counter omits the table-lookup or
        distinguished-point test, or if targets that failed within the restart
        cap are dropped from the median rather than counted. Nothing in the
        construction forces the measured value to 1, which is what makes this a
        control rather than an identity.
    - name: C-B-THREE-COLUMN-OR-NONE
      kind: reporting control, blocking
      blocking: true
      description: >-
        Every cost table carries offline, online and TOTAL columns, and every
        table is emitted once per amortization policy. A table with fewer than
        three columns, or a single number not qualified by its policy,
        invalidates the run.
        WHAT MAKES IT FAIL: the natural presentation. The online exponent is the
        interesting number and the offline exponent is the debit; presenting the
        first without the second is the exact inflation this contract exists to
        prevent, and the check is mechanical because judgement is what fails here.
    - name: C-B-NEARBY-OBJECT-EXTENSION-FIELD
      kind: nearby-object control, blocking, zero compute
      blocking: true
      description: >-
        Apply the identical accounting to the extension-field setting, where
        index calculus demonstrably works. The corrected comparator must NOT turn
        the known extension-field advantage into a non-advantage.
        WHAT MAKES IT FAIL: if the memory-matched baseline at the relevant memory
        exceeds the recorded extension-field exponent, the ACCOUNTING is wrong -
        because a correct accounting cannot erase an advantage that is known to
        exist - and the audit reports the accounting defect rather than closing a
        lane. This is the proves-too-much control applied to an argument rather
        than to a measurement.
    - name: C-B-ARCHIVE-DISAGREEMENT-READBACK
      kind: contradiction reporting control, blocking, zero compute
      blocking: true
      description: >-
        Re-read IDEA-20260805-c06631's rho rows and IDEA-20260731-013's gamma
        definition and record, in the run artifact, the exact sentence in each
        that this contract's numbers contradict or do not contradict. Under the
        AGENTS.md retrieval policy the disagreement is REPORTED and no status
        change to either record is proposed.
        WHAT MAKES IT FAIL: finding that c06631 or 013 already carries the
        offline/online split, which would make this contract's measurement
        redundant with a committed record.

  heuristic_under_test: HEUR-PRE-1

  preregistered_prediction:
    quantity: >-
      Median online group operations to certified recovery, per (realised N,
      sigma) cell, for both group arms.
    formula: >-
      LAW A (frontier, the hypothesis): median = c_A * sqrt(N/S) with
      S = round(N**sigma), so the exponent in N at fixed sigma is (1-sigma)/2.
      LAW B (no advantage, the rival): median = c_B * sqrt(N), flat in sigma.
      At sigma = 1/3 the two differ by a factor N**(1/6): 8.0 at N = 2**18,
      10.1 at 2**20, 12.7 at 2**22. SELECTION RULE, FIXED HERE AND NEVER TUNED:
      a law is selected at a size only if the measured median is within a factor
      of 2 of its prediction AND at least a factor of 4 from the other's; the
      constants c_A and c_B are calibrated ONCE at sigma = 0, where both laws
      coincide, and are then held fixed across the whole sweep.
    source: >-
      LAW A is the frontier S*T**2 = Theta(N) whose achievability is recorded at
      knowledge/literature/KN-LIT-013.md ("a construction achieves S*T**2 ~ N",
      "with advice the online cost *can* beat the classic sqrt(N) generic
      bound"); THAT RECORD'S OWN "Not verified here" SECTION STATES THE FULL
      PAPER WAS NOT READ BY THIS PROGRAM. LAW B is the corpus's own operative
      convention, recorded at knowledge/techniques/KN-TECH-005.md as
      "B = rho 1/2" with no memory-matched column, and is the reading under which
      Shoup's Omega(sqrt(p)) bound is applied at every memory setting.
      DEC-20260806-8f7e4f establishes that these two laws are indistinguishable
      at sigma = 0 and separate at sigma = 1/3, which is why sigma = 1/3 is the
      decision cell.

  coordinator_prior:
    recorded_before_execution: true
    prior: >-
      RECORDED FIRST PER AGENTS.md "Review architecture". This coordinator
      expects (i) the audit to find NO memory-matched comparator column, because
      KN-TECH-005's Program usage section reduces the technique to "B = rho 1/2"
      and this coordinator read that section in full; (ii) Law A to be selected
      at sigma = 1/3 at all three sizes, because the construction is elementary
      and the frontier is recorded as tight; and (iii) the fitted exponent to be
      REFUSED as unfitted at three sizes. The outcome that would most change this
      program's practice is (i) failing - a committed record already carrying the
      memory-matched column - because it would mean the correction was already
      available and unused, which is a different and more uncomfortable finding
      than the one the record proposes.

  scale_relevance:
    tier: toy
    justification: >-
      Realised prime subgroup orders near 2**18, 2**20 and 2**22, at most 23
      bits. THE EXPONENT STATEMENT IS A DERIVATION AND IS SCALE-INDEPENDENT; THE
      MEASUREMENT IS NOT. Transfer assumption, stated and NOT discharged: that
      the coverage and hit-rate models validated at these sizes continue to hold
      at cryptographic N. No correspondence exists that would let chain coverage
      be sampled at cryptographic N - the analogue of the Deuring correspondence
      does not exist for this quantity - and that absence is stated here rather
      than glossed. The concrete-cost table at N = 2**256 is therefore a MODELLED
      table, labelled as such, never a measured one.
    correspondence: null

  tail_checks:
    - >-
      Report the maximum number of online restarts required before a hit, per
      cell, against the geometric tail implied by HEUR-PRE-2. Report the count of
      targets that exhausted the restart cap, separately, and INCLUDE THEM in the
      denominator of every rate; dropping them would bias the median downward and
      is the most likely way this instrument would manufacture Law A.
    - >-
      Report the largest observed chain-merge cluster size against the predicted
      Poisson tail, per cell, at the stopping rule and at 16 times above it.
    - >-
      Report the sigma = 1/3, N = 2**22 cell individually and never inside a
      pooled statistic: it is the single cell where the two laws are furthest
      apart and where the design's whole discriminating power sits.
    - >-
      Report the WORST-agreeing (N, sigma) cell for the selected law
      individually, not averaged.

  replication:
    seeds: [3001, 3011, 3019, 3023, 3037, 3041, 3049, 3061, 3079, 3083]
    independent_instances: 10
    note: >-
      Ten independently generated curve instances per size, with the realised N
      recorded for each. Cell statistics are reported PER INSTANCE and pooled
      only after the between-instance spread is reported, because pooling before
      reporting the spread is the defect that EXP-ECDLP-7edfd3 exists to measure
      in a sibling lane.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 4
    maximum_memory_gb: 2
    maximum_runs: 8
    maximum_workers: 1
    sizing_rationale: >-
      SIZED TO THIS HOST, WHICH IS SMALL, AND TO A RELATED LANE THAT BURNED 11.73
      AND 12.22 GiB AND RETURNED ZERO RANKS. The dominant cell is sigma = 0 at
      the largest size, where S = 1 and L = sqrt(N) is about 2048: offline about
      2*10**3 group operations and online at most 2*L per target over 200
      targets, so under 10**6 group operations. Every other cell is cheaper,
      because offline S*L and online L both fall as sigma rises with S*L**2 = N
      held. Across three sizes, four sigma values, two group arms, three walk
      arities and ten instances the total stays in the low 10**8 group
      operations, which is minutes of pure Python, not hours. MEMORY IS
      STRUCTURALLY TRIVIAL: the stored table is S group elements with S at most
      N**(1/3) = 162 at the largest size, and the largest single allocation in
      the contract is the exact-coverage bitset over the subgroup, 2**22 bits =
      512 KB. The 2 GB ceiling is a guard, not an estimate. If any cell
      approaches it, the implementation is wrong.

  stopping_rules:
    - >-
      RUN ORDER IS PART OF THE CONTRACT AND THE CHEAP REFUTATION COMES FIRST:
      (0) C-B-AUDIT-CAN-FALSIFY, C-B-NEARBY-OBJECT-EXTENSION-FIELD and
      C-B-ARCHIVE-DISAGREEMENT-READBACK - zero compute;
      (1) the symbolic derivation and the two-column threshold table - zero
      compute;
      (2) C-B-PLANTED-POSITIVE and C-B-RHO-REPRODUCTION at the smallest size;
      (3) the sigma sweep at the smallest size, then the two larger sizes;
      (4) the Z/N null arm, mirroring every cell already run;
      (5) C-B-DEGENERATE-MUST-SATURATE.
    - >-
      If the audit exhibits a MEMORY-MATCHED comparator column, STOP after stage
      0. The record's claim is falsified, the deliverable is a documentation note
      naming that record and quoting its sentence, and NO group operation is
      spent.
    - >-
      If the symbolic derivation does not return sigma + 2*tau_on = 1, STOP after
      stage 1 and report which branch fired: below 1 contradicts the committed
      lower bound (derivation wrong), above 1 puts the construction off the
      frontier (headline fails).
    - >-
      If C-B-PLANTED-POSITIVE fails, STOP. The instrument has no power and no
      negative may be read from any arm.
    - >-
      If C-B-LOWER-BOUND-TRIPWIRE fires at any cell, HALT that cell, preserve its
      artifacts, and route to review. Do not report it as a result and do not
      continue past it in the same run.
    - >-
      Cap each target at 8 online restarts with fresh offsets r_0. Targets that
      exhaust the cap are COUNTED, reported, and included in every denominator.
    - >-
      Cap any single cell at 300 seconds. A cell that exceeds it is stopped and
      recorded as resource_exhaustion, which is an infrastructure outcome under
      AGENTS.md rule 5 and never a null result about either law.
    - >-
      If peak RSS exceeds 1.5 GB at any point, stop and report
      resource_exhaustion; at these parameters that indicates an implementation
      defect rather than a genuine requirement.

  invalidation_rules:
    - Any claim of novelty for the chain construction, at any point.
    - >-
      Any presentation of an online exponent without the offline exponent and the
      total beside it, or of any number without the amortization policy it is
      valid under.
    - >-
      Any use of the sigma = 0 cell as a discriminating control, or any ranking,
      priority or verdict resting on it. DEC-20260806-8f7e4f found it
      non-discriminating and that finding binds.
    - >-
      Any exclusion of restart-cap failures from a median or a rate denominator.
    - >-
      Any statement that this record improves an ECDLP exponent, weakens any
      deployed curve, or bears on the security of any standardized parameter set.
    - >-
      Any exponent fit reported from three sizes without its interval, or any fit
      reported at all when the interval exceeds 0.10.
    - >-
      Any comparison against a record counting memory in a different unit without
      both being restated in group elements first.
    - >-
      Any status change proposed to IDEA-20260805-c06631, IDEA-20260731-013,
      IDEA-20260803-fa9839, catalogue A1-4 or A1-13. Disagreement is REPORTED.
    - >-
      Any assertion about the contents of Corrigan-Gibbs and Kogan beyond what
      knowledge/literature/KN-LIT-013.md records, since that record's own "Not
      verified here" section states the full paper was not read.
    - >-
      Any use of the exponent triple (sigma, tau_on, tau_off) to argue that two
      algorithms are the same. The collision is guaranteed and every table row
      must instead name the SOURCE OF ITS MEMORY.
    - >-
      Any re-derivation or adjustment of B* = N**(1/(m+1)). It is QUOTED from
      committed records and every threshold row is conditional on that
      convention.

  success_criterion: >-
    The audit completes with its census and its search commands recorded; the
    symbolic derivation returns sigma + 2*tau_on = 1 and the two-column threshold
    table differs by exactly 1/(2*(m+1)) at every m in 3..10; all eight blocking
    controls pass; and at sigma = 1/3 a rival-law selection (LAW_A, LAW_B or
    NEITHER) is reported at each of the three sizes under the pre-registered
    margin rule, with the three-column cost table emitted once per amortization
    policy. THE CONTRACT SUCCEEDS UNDER ANY OF THE THREE SELECTIONS; only an
    unexecuted arm, a failed blocking control, or a table missing a column is a
    failure.

  falsification_criterion: >-
    The comparator-mismatch claim is FALSIFIED if the audit exhibits any
    committed record stating a memory-matched comparator column; the deliverable
    becomes a documentation note and no measurement runs.
    The frontier derivation is FALSIFIED if sigma + 2*tau_on != 1 symbolically.
    The ACHIEVABILITY arm is FALSIFIED if LAW_B is selected at sigma = 1/3 at all
    three sizes with the planted positive passing: the chain coverage is not
    realised at reachable sizes, and only the comparator mismatch survives as an
    open question rather than a correction.
    HEUR-PRE-1 is FALSIFIED if exact distinct coverage stays within noise of S*L
    at the cell set 16 times above the stopping rule, or falls materially below
    it at a cell at the rule.
    HEUR-PRE-2 is FALSIFIED if the hit-rate chi-square rejects target-independence
    at a cell whose other controls all pass.
    The INSTRUMENT is VOID if the Z/N null arm differs materially from the curve
    arm, if the planted positive fails, or if the lower-bound tripwire fires.
    The quantified correction 1/(2*(m+1)) is WRONG if the two threshold columns
    agree at any m.

  required_artifacts:
    - >-
      The audit census, with the exact search commands, the commit searched, per
      class counts per path, and the id plus quoted sentence of every
      MEMORY-MATCHED hit found.
    - >-
      The symbolic derivation of (sigma, tau_on, tau_off) with
      sigma + 2*tau_on stated, and its check against the bound recorded at
      KN-TECH-005.
    - >-
      The two-column threshold table for m = 3..10, in exponents and in bits at
      N = 2**256, with the B* convention it is conditional on named in every row.
    - >-
      The three-column (offline, online, total) cost table, emitted once per
      amortization policy, at every sigma.
    - >-
      The Pareto table with a DOMINATED / NOT-DOMINATED verdict per row, each row
      naming the SOURCE OF ITS MEMORY.
    - >-
      Per-cell median and mean online group operations with interval and sample
      size, for BOTH group arms side by side, per instance and then pooled.
    - >-
      Offline group operations actually executed per cell, charged separately.
    - >-
      Exact distinct-coverage counts from the bitset, at the stopping rule and at
      16 times above it.
    - >-
      The planted-positive recovery with its certificate, kind discrete_log,
      verified true by independent recompute, with the verifier commit recorded.
    - >-
      Restart-cap failure counts per cell, and the maximum restarts observed.
    - >-
      The realised N per instance and per seed, with the curve parameters.
    - >-
      The declared memory unit, restated on every table.
    - >-
      The extension-field nearby-object check and its verdict.
    - >-
      The archive-disagreement readback, quoting the exact sentences from
      IDEA-20260805-c06631 and IDEA-20260731-013.
    - >-
      A run manifest per the AGENTS.md artifact policy, with peak_rss_bytes per
      cell.

  limitations:
    - >-
      NO ATTACK AND NO EXPONENT MOVED. Total cost (offline plus online) remains
      at or above N**(1/2) at every sigma. Nothing here bears on the security of
      any deployed curve. THE ONLY THING THAT MOVES IS THE NUMBER A CANDIDATE
      MUST BEAT, and it moves in the direction that makes this program's positive
      claims HARDER.
    - >-
      NO NOVELTY IS CLAIMED AND THE CONTRARY FRAMING WAS ALREADY REFUTED.
      KN-LIT-013 records that a construction achieves S*T**2 ~ N;
      DEC-20260806-8f7e4f refuted IDEA-20260806-3b91c7's presentation of this as
      a gap in the corpus. This contract measures whether the corpus's THRESHOLDS
      are stated against that frontier, which is a different and narrower
      question.
    - >-
      THE LITERATURE ANCHOR IS ITSELF UNREAD AT SOURCE. KN-LIT-013's own "Not
      verified here" section states the full paper was not read and that the
      bound, its tightness and the CDG generalization are relayed from the ePrint
      abstract and secondary sources. Nothing in this contract may assert the
      paper's contents beyond that record.
    - >-
      TOY TIER FOR EVERY MEASUREMENT, realised N below 2**23. Three sizes cannot
      support an exponent fit and the fit is refused when the interval is wide.
      The concrete-cost table at N = 2**256 is MODELLED, never measured, and is
      labelled a rough bound with its optimistic assumptions flagged.
    - >-
      THE PREPROCESSING BOUND MAY NOT BIND INDEX CALCULUS AT ALL. It is a
      generic-group bound and index calculus is non-generic; catalogue A1-4
      already flags the composition as non-binding, and this contract does not
      touch that question. It changes the BASELINE, not any statement about
      whether the bound constrains a candidate.
    - >-
      THE AMORTIZATION POLICY IS A POLICY, NOT A RESULT. HEUR-PRE-3 is not
      empirically falsifiable and is discharged only by reporting three columns.
      Choosing among the policies is a Coordinator decision this contract cannot
      make.
    - >-
      B* = N**(1/(m+1)) IS QUOTED, NOT RE-DERIVED, and rests on a mean-yield
      convention whose instance-level error bars are the subject of
      EXP-ECDLP-7edfd3.
    - >-
      NO PROMOTION GATE IS IN PLAY. This contract moves no asymptotic-complexity
      claim toward `supported`, so the four gates in agents/coordinator.md are
      not engaged, and no result here may be presented as satisfying them.

  overlap_declaration:
    - >-
      WITH EXP-ECDLP-a1c262 (H-ECDLP-d2aa2c). Both repair a reference point that
      a conditional exponent statement multiplies by, but different factors of
      the same per-attempt-cost times inverse-success-probability product: that
      contract repairs the inverse success probability, this one repairs the
      comparator the resulting cost is scored against. NEITHER MAY BE CITED AS
      VALIDATING THE OTHER. They share no metric, no artifact and no arm.
    - >-
      WITH EXP-ECDLP-7edfd3 (H-ECDLP-fe99ef). This contract QUOTES the two-term
      optimum B* = N**(1/(m+1)) whose underlying mean-yield convention that
      contract measures the error bars of. THE DEPENDENCY RUNS ONE WAY: if
      EXP-ECDLP-7edfd3 re-scopes the yield convention, this contract's threshold
      table is re-read at the new B* by a superseding record and never by an
      edit. This contract does NOT re-derive B* and must not be read as
      validating it.

