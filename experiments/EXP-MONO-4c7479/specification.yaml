  required_artifacts:
    - Frozen approved specification with a freeze receipt binding its SHA-256.
    - Stage-0 symbolic derivation transcript (exact-integer, term-by-term).
    - >-
      Per-base-point classification log, RETAINED IN FULL (not summarized):
      for every (e1,e2) in F_p^2 at every one of the 6 cells, the character
      triple, predicted class, arm (a) observed class, arm (b) observed
      class, the stratum membership (none / i / ii / iii), and the
      agreement flags. RETENTION POLICY AND RATIONALE: total row count is
      ~1.65x10^5 across all 6 cells (see `cost_note`); at a generous ~100
