experiment:
  id: EXP-MONO-4c7479
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-08-30'
  hypothesis_id: H-MONO-0b3def
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  batch_id: null
  batch_id_note: >-
    No batch is asserted. GOAL-MONO-001 is `paused` with its campaign budget
    exhausted (maximum_batches: 3, BATCH-003 was the third); assigning this
    contract to a batch and granting fresh budget from GOAL-PATH-001 are
    Coordinator acts and are not performed here. This contract does not
    execute the instrument GOAL-MONO-001's `next_action` rejected: that
    rejection is scoped to the generic-fibre census AS A RELATION-RATE PROBE
    at every m; this contract's census is a group-theory check of the
    monodromy claim, targets m=3 only, and makes no relation-rate claim
    (see H-MONO-0b3def S7 / `what_this_is_not` below).

  title: >-
    Stage 0-1 ONLY of IDEA-20260830-1a08f9's minimal_test: a zero-compute
    symbolic identity check followed by an exhaustive, dual-arm classification
    of the m=3 symmetric-base Semaev cover's Frobenius action at p=101 and
    p=211, against the D_4 = Z/2 wr S_2 monodromy claim of H-MONO-0b3def.

  objective: >-
    Now approved, frozen and execution_authorized: decide -- at toy scale and
    scoped strictly to p in {101,211} -- whether the geometric/arithmetic
    monodromy of the m=3 symmetric-base Semaev cover is exactly D_4 with an
    empty exceptional locus, by (i) a zero-compute symbolic check of the
    Stage-3 coefficient identities against KN-FIND-a8990a's committed
    discriminant identity, then (ii) exhaustively classifying every base
    point (e1,e2) in F_p^2 by two independent computational arms, against a
    random-quartic S_4 null control, a matched ordered-base control, and
    counted (not pooled) excluded strata. As of approval, no run has
    happened yet, no observation is reported, and nothing here is
    evidence.

  scope_decision: >-
    THE SOURCE PROPOSAL'S minimal_test HAS FOUR STAGES (0: symbolic; 1:
    exhaustive census at p=101,211; 2: sampled census at p=1009 plus the
    full control suite; 3: an ordered-base reproduction at p=1009 scale).
    ONLY STAGES 0 AND 1 ARE IN SCOPE FOR THIS CONTRACT. Stage 2 (p=1009
    sampling, HEUR-WREATH-1/2/3's full three-point validation, and the CM /
    j=0 / j=1728 / full-2-torsion legs of the curve panel) and Stage 3 (a
    standalone p=1009-scale ordered-base reproduction) are explicitly OUT OF
    SCOPE and are named as FUTURE WORK, not silently dropped -- see
    `future_work` below. A matched ordered-base control AT p in {101,211},
    reusing the Stage-1 data, IS in scope (it is cheap and is one of the
    idea's mandatory controls even at toy p).

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection.
    - >-
      Not an ECDLP cost, runtime, asymptotic, exponent, cryptographic-scale,
      or deployed-scheme claim, in either direction.
    - >-
      Not a closure of KN-OPEN-009, RQ-MONO-001, or GOAL-MONO-001; not a
      status change to any of them, KN-FIND-a8990a, or any hypothesis.
      Coordinator authority alone (AGENTS.md rule 1).
    - >-
      Not the m>=4 census GOAL-MONO-001's `next_action` forbids commissioning
      in the generic-fibre-cycle-type instrument's form: this contract is
      m=3 only and is not a relation-rate probe (H-MONO-0b3def's S7).
    - >-
      Not a claim about m>=4, about characteristic 2 or 3, about singular
      curves, or about any base other than the symmetric base (e1,e2).
    - >-
      Not yet executed and not evidence: approved and frozen as of
      2026-08-30 (see `coordinator_approval_rationale`), but no run has
      happened at the time this contract was written.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: that on the declared 3-curve generic-ordinary panel at each
      of p=101 and p=211, exhaustively over all p^2 base points, the two
      independent classification arms agreed off the declared
      instrument-degeneracy stratum; that exactly 8 distinct labelled
      permutations were realized per curve or fewer (naming which); that the
      five class densities matched or deviated from 1/8:1/4:1/8:1/4:1/4; that
      the matched ordered-base control reproduced or failed to reproduce
      KN-FIND-a8990a Theorem B's two-cycle-type law; and that the
      random-quartic control did or did not reproduce S_4 Chebotarev
      densities. The D_4/wreath GROUP STATEMENT itself is a derivation
      (H-MONO-0b3def mechanism STEP 1-5); its validity comes from the proof,
      not from this run, which checks it.
    what_no_outcome_can_support: >-
      No outcome establishes anything about m>=4, about relation rates, or
      about the factor-base sublocus (which is a declared non-discriminating
      control here, per S7 -- forced identity, never reportable as a
      finding). No outcome converts to a cost, exponent, or crypto-scale
      claim. No outcome closes KN-OPEN-009 (Stage 2/3, and the m>=4
      question, are untouched). Toy evidence is never crypto-scale evidence
      (AGENTS.md rule 7).

  inputs:
    field_bits_note: >-
      p=101 (7 bits) and p=211 (8 bits). Every run manifest MUST carry
      field_bits for both primes tested in that run.
    primes: [101, 211]
    m: 3
    curve_construction: >-
      SHORT WEIERSTRASS y^2 = x^3 + A x + B over F_p, p in {101, 211}. Panel
      curves are FIXED, small, hand-verified (A, B) pairs -- no search
      procedure is required and none is specified, because the panel is
      small enough to state directly and verifying non-singularity
      (4A^3 + 27B^2 mod p != 0) is a single computation the Executor repeats
      as its first construction step.
    curve_panel_committed:
      - {p: 101, A: 1, B: 1, disc_check: "4*1+27*1=31 mod 101 = 31 (nonzero)"}
      - {p: 101, A: 2, B: 3, disc_check: "4*8+27*9=275 mod 101 = 73 (nonzero)"}
      - {p: 101, A: 4, B: 1, disc_check: "4*64+27=283 mod 101 = 81 (nonzero)"}
      - {p: 211, A: 1, B: 1, disc_check: "31 mod 211 = 31 (nonzero)"}
      - {p: 211, A: 2, B: 3, disc_check: "275 mod 211 = 64 (nonzero)"}
      - {p: 211, A: 4, B: 1, disc_check: "283 mod 211 = 72 (nonzero)"}
    curve_panel_note: >-
      3 generic-ordinary curves at EACH of p=101 and p=211 -- 6 (p, A, B)
      cells total, ALL COMMITTED to run. The Executor MUST re-verify each
      disc_check independently before use (a construction failure there is
      infrastructure signal, never mathematical evidence). CM curves, j=0
      (A=0), j=1728 (B=0), and a curve with full rational 2-torsion are
      DELIBERATELY OUT OF SCOPE for this contract (see `future_work`):
      including them would require additional construction and verification
      work (confirming a CM discriminant at these tiny primes is nontrivial
      to do honestly; j=0/j=1728 are cheap to construct but their inclusion
      is deferred together with the rest of the curve-panel prediction K7,
      which this contract does not attempt to test) and is not needed to
      decide the primary metrics below. Prediction K7 (curve-panel spread
      including CM/j=0/j=1728) is therefore UNTESTED by this contract.
    base_construction: >-
      For each committed (p, A, B): enumerate e1, e2 over the full range
      0..p-1 x 0..p-1 (p^2 pairs total: 10,201 at p=101, 44,521 at p=211).
      For each (e1,e2), compute D = e1^2 - 4 e2 mod p (discriminant of
      x^2 - e1 x + e2), and classify into exactly one of three regimes
      before any further work:
        REGIME split (D is a nonzero QR mod p): t1, t2 = (e1 +/- sqrt(D)) *
          inverse(2) mod p, both distinct elements of F_p.
        REGIME ramified (D == 0): t1 = t2 = e1 * inverse(2) mod p -- EXCLUDED
          STRATUM (i), reported with its own count, not classified further.
        REGIME inert (D is a non-residue): t1, t2 are Frobenius-conjugate
          elements of F_{p^2} \ F_p. Represent F_{p^2} = F_p[w]/(w^2 - d) for
          a FIXED non-residue d (e.g. the least non-residue by increasing
          search from 2), so any element is (u, v) meaning u + v w; then
          Frobenius on F_{p^2} is exactly (u, v) -> (u, -v) mod p (standard
          conjugation, since w^p = -w for this basis, p odd). t1 = e1 * inv(2)
          + delta, t2 = e1 * inv(2) - delta, where delta^2 = D * inv(4) in
          F_{p^2} (delta is a square root of the non-residue D/4, computed in
          the (u,v) representation, e.g. via Tonelli-Shanks-in-F_{p^2} or by
          direct case analysis on d).
      This construction touches only integer/modular arithmetic; no external
      library is required (see `environment_preconditions`).

  arms_and_controls:
    arm_a_direct_group_arithmetic: >-
      INDEPENDENT PATH 1. From t1, t2 (in F_p, or in F_{p^2} as an
      Frobenius-conjugate pair) compute y1^2 = f(t1) = t1^3 + A t1 + B and
      y2^2 = f(t2), each in the same field as its t_i. Lift each to an actual
      point: if f(t_i) is a nonzero square in that field, y_i = its square
      root (either choice; the sign is a labelling convention fixed once per
      point and used consistently for both +-P_i); if f(t_i)=0, y_i=0
      (EXCLUDED STRATUM (ii) contribution -- see below); if f(t_i) is a
      non-residue in that field, lift into the (further) quadratic
      extension -- over F_p that is F_{p^2} = F_p[w]/(w^2-d) as fixed in
      `base_construction`, and over F_{p^2} that is
      F_{p^4} = F_{p^2}[z]/(z^2 - f(t_1)), represented as (a,b) meaning
      a + b z with a, b in F_{p^2}. This second lift is NOT optional: in the
      inert regime f(t_1) is a square in F_{p^2} exactly when chi(c0)=+1, so
      chi(c0)=-1 puts y_i in F_{p^4}\F_{p^2}, and that is precisely the
      predicted 4-cycle locus at density 1/4. Form the
      four LABELLED points P1=(t1,y1), -P1=(t1,-y1), P2=(t2,y2), -P2=(t2,-y2)
      with a FIXED labelling convention recorded once per curve and reused
      for every base point (labelling is a confounder named in
      H-MONO-0b3def; an implementation that relabels per point over- or
      under-counts the group). Apply Frobenius DIRECTLY to each point's
      coordinates: (x,y) -> (x^p, y^p), computed per coordinate as: unchanged
      if the coordinate is in F_p; as (u,-v) under the fixed F_{p^2} basis if
      it lies in F_{p^2}\F_p; and, if it lies in F_{p^4}\F_{p^2}, as the
      GENUINE p-power map of F_{p^4} on the (a,b) representation --
      (a + b z)^p = a^p + b^p (z^p), with a^p, b^p the F_{p^2} conjugations
      and z^p computed once per point as an explicit F_{p^4} element by
      repeated squaring of z. Conjugation on the F_{p^2} basis is NOT the
      p-power map of F_{p^4} and MUST NOT be substituted for it; an
      implementation lacking F_{p^4} arithmetic cannot realize the 4-cycle
      class at all and would false-falsify P2. Read off the resulting
      permutation of {P1,-P1,P2,-P2} by matching images to the labelled set;
      its cycle type is arm (a)'s classification. THIS ARM NEVER COMPUTES
      c1, c0, OR h(Y).
    arm_b_quartic_factoring: >-
      INDEPENDENT PATH 2. Compute c1 = e1^3 - 3 e1 e2 + A e1 + 2B and
      c0 = e2^3 + A e2 (e1^2-2e2) + B(e1^3-3e1e2) + A^2 e2 + A B e1 + B^2
      DIRECTLY from (e1,e2) -- NEVER via t1, t2 or f(t1), f(t2) -- and form
      h(Y) = Y^4 - c1 Y^2 + c0 mod p. Factor h as a GENERAL quartic (the
      routine must NOT exploit the biquadratic shortcut of solving
      Z^2-c1 Z+c0=0 for Z=Y^2, which would silently collapse this arm back
      onto arm (a)'s computation of f(t1),f(t2)): find roots in F_p by
      testing all p residues (or a faster root-finder), remove found linear
      factors by explicit polynomial division, then determine the
      degree-2/degree-4 structure of any degree>=2 remainder by
      distinct-degree factorization -- computing g(Y) = Y^{p^2} mod h(Y) via
      repeated-squaring polynomial exponentiation and testing
      gcd(g(Y)-Y, h(Y)): a remainder of degree 4 means two irreducible
      quadratic factors (cycle type contribution 2^2 or, combined with any
      found roots, a mixed type); gcd of degree 0 (constant) means the
      quartic remainder is irreducible (cycle type contribution 4). The
      factorization-degree PARTITION of {1,2,3,4} read off this process IS
      arm (b)'s classification, reported in the same five-class vocabulary
      as arm (a) (1^4, 2.1.1, 2^2, 3+1, 4). THIS ARM IS INVALID (by
      construction, not by implementation error) wherever h has a repeated
      root while the four points of Phi remain distinct -- EXCLUDED STRATUM
      (iii): e1^2 - e2 + A = 0. Points in stratum (iii) are still run
      through arm (b) and logged, but any arm (a)/arm (b) disagreement there
      is EXPECTED and MUST NOT be counted toward the primary
      zero-disagreement metric.
    independence_requirement: >-
      Arms (a) and (b) MUST be implemented as genuinely separate code paths
      sharing no intermediate value (arm (a) never touches c1, c0, h; arm
      (b) never touches t1, t2, f(t1), f(t2)) so that a shared conceptual
      error cannot pass both (H-MONO-0b3def's authorship-asymmetry
      confounder). A reviewer must be able to read the two implementations
      and confirm no shared subroutine computes both t_i and (c1,c0).
    character_triple_recipe_check: >-
      A THIRD, cheap check computed alongside arm (a): the predicted class
      from the S6 recipe using chi = Legendre symbol. chi(D)=+1 (split
      regime): predicted identity if chi(f(t1))=chi(f(t2))=+1, sigma_i if
      exactly one is -1, sigma1 sigma2 if both are -1. chi(D)=-1 (inert
      regime): predicted 2^2 if chi(c0)=+1, predicted 4-cycle if chi(c0)=-1.
      Compare the predicted class against arm (a)'s observed class,
      per-instance, off the excluded strata. This is REQUIRED_METRIC P3
      below and is one of H-MONO-0b3def's own falsification conditions.
    excluded_strata_i_ii_iii: >-
      EACH STRATUM IS COUNTED SEPARATELY, NEVER POOLED WITH THE PRIMARY
      CLASSIFICATION OR WITH EACH OTHER. (i) e1^2-4e2=0 (t1=t2): expected
      count exactly p (one e2 per e1, since inverse(4) exists for p odd).
      (ii) f(t1) f(t2) = 0 (a t_i a 2-torsion x-coordinate of E): count
      depends on how many roots f has in F_p for that specific curve (0, 1,
      or 3); report the observed count and f's root count on that curve
      together, with no forced value asserted in advance beyond "consistent
      with f's actual root count". (iii) e1^2-e2+A=0 (instrument-only
      degeneracy for arm (b)): expected count exactly p (one e2 per e1),
      overlapping strata (i)/(ii) at O(1) points which are also reported.
    factor_base_sublocus_control: >-
      DECLARED IN ADVANCE NON-DISCRIMINATING (idea's S7/Theorem C). Within
      the already-computed split-regime (chi(D)=+1) data, filter to
      (e1,e2) pairs where BOTH f(t1) and f(t2) are nonzero squares (i.e.
      both t_i are themselves on-curve F_p-rational "factor-base" x
      -coordinates). No separate computation is required: this is a
      re-filter of Stage-1 data already produced. FORCED: 100% identity
      class on this sublocus (chi(f(t1))=chi(f(t2))=+1 forces identity by
      the S6 recipe already tested elsewhere). ITS PASSING MUST NEVER BE
      REPORTED AS AN INDEPENDENT FINDING -- it is a consistency check on the
      recipe, already implied by the character-triple-recipe check passing
      generally.
    matched_ordered_base_control: >-
      Reuses the split-regime (chi(D)=+1) (t1,t2) VALUES ALREADY COMPUTED in
      Stage 1 -- for each such value with t1 != t2, both orderings (t1,t2)
      and (t2,t1) are included (the diagonal t1=t2 case is stratum (i) and
      excluded here too); for each ordered pair, classify the Frobenius
      cycle type on the SAME labelled four-point object WITHOUT the
      tau-identification (i.e. treat t1, t2 as a fixed ordered pair rather
      than derived from a symmetric (e1,e2) that could equally have produced
      (t2,t1)). Report the realized       cycle-type counts. FORCED: exactly zero 4-cycles, and every realized
      type drawn from {1^4, 2.1.1, 2^2}. Over a split pair Frobenius acts by
      sign flips only, so all three of those types occur -- identity, a single
      sigma_i (type 2.1.1, a 2-cycle with two fixed points), and
      sigma_1 sigma_2 (type 2^2). KN-FIND-a8990a Theorem B's two-type law is
      a statement about the degree-2 T-fiber, whose non-identity class is
      fixed-point-free; it is NOT a two-type law for this labelled
      four-point object, and forcing zero 2.1.1 here would confuse the
      T-cover with Phi. The Theorem B reproduction this control provides is
      the absence of 4-cycles over split pairs. A failure here is a falsifier of
      the record's own baseline-embedding reproduction check
      (H-MONO-0b3def proof_search_map.baseline_embedding), not merely of
      this control.
    random_quartic_null_control: >-
      NULL OBJECT, KNOWN-FULL, MUST EMIT WHAT D_4 CANNOT. For each of p=101
      and p=211, draw 2,000 uniformly random monic quartics
      Y^4 + b3 Y^3 + b2 Y^2 + b1 Y + b0 over F_p using the seed rule below,
      discarding any quartic that is not squarefree (checked via gcd(h,h')=1
      using the polynomial Euclidean algorithm mod p) and redrawing at the
      NEXT draw index j+1 -- never retried in place under the same j, per
      `random_quartic_control_seed_rule`. Classify EACH by THE SAME arm (b) code
      path (general quartic factoring, distinct-degree method) used above --
      not a special-cased routine. FORCED: S_4 Chebotarev densities
      1/24 (1^4), 1/4 (2.1.1), 1/8 (2^2), 1/3 (3+1), 1/4 (4) within 3
      binomial standard errors. If the classifier cannot emit 3+1 here, its
      report of "3+1 never occurs" on the Semaev instrument is empty and NO
      NEGATIVE MAY BE REPORTED FROM ANY ARM.

  stage_order_and_terminating_stage:
    principle: Cheapest decisive gate first. STAGE 0 IS ZERO-COMPUTE AND CAN END THE CONTRACT.
    stage_0:
      name: symbolic coefficient-identity gate
      compute: "none to seconds; symbolic/exact-integer only"
      description: >-
        Emit the three T-coefficient identities of the mechanism's STEP 1
        (leading (e1^2-4e2), middle -2[e1(e2+A)+2B], constant
        (e2-A)^2-4Be1) symbolically over Z[e1,e2,A,B], confirming each is a
        polynomial in (e1,e2) with the stated form by direct substitution
        from harness/semaev.py's `s3_expr` output. Then emit c1, c0 from
        STEP 3 and check c0 = disc_T S_3 / 16 against KN-FIND-a8990a's
        committed identity disc_T S_3 = 16 f(t1) f(t2), by expanding both
        sides in Z[t1,t2,A,B] and comparing term-by-term (exact integer
        coefficients, not a numeric spot-check).
      terminates_the_run_if: >-
        Any identity mismatch. The derivation is wrong; the hypothesis is
        withdrawn by a superseding record; no further compute is spent.
    stage_1:
      name: exhaustive dual-arm census at p=101 and p=211, plus controls
      compute: "minutes; see budget/cost_note"
      description: >-
        For each of the 6 committed (p,A,B) cells: enumerate all p^2 base
        points; run arm (a), arm (b), and the character-triple-recipe check
        on every point; separate the three excluded strata; run the
        matched-ordered-base control and the factor-base-sublocus control as
        re-filters of the same data; run the random-quartic null control
        (2,000 draws) once per p (shared across the 3 curves at that p,
        since the null does not depend on the curve).
      terminates_the_run_if: >-
        The random-quartic control fails to reproduce S_4 densities (in
        particular fails to emit any 3+1) -- an instrument failure; NOTHING
        may be reported about the Semaev arms from that p's cells.

  metrics:
    primary:
      - >-
        P1: per-instance disagreement count between arm (a) and arm (b),
        off excluded stratum (iii), per (p,A,B) cell. FORCED 0. (Points
        inside strata (i)/(ii) are excluded from both arms' primary
        classification entirely, per `excluded_strata_i_ii_iii`.)
      - >-
        P2: number of distinct labelled four-point permutations realized by
        arm (a), per (p,A,B) cell. FORCED exactly 8.
      - >-
        P3: per-instance agreement between arm (a)'s observed class and the
        class predicted by the character-triple recipe, off excluded
        strata, per cell. FORCED 1.000 (zero mismatches).
    secondary:
      - >-
        Five class-density counts (identity, {sigma_i}, sigma_1 sigma_2,
        block-swap involutions, 4-cycles) per cell, against forced values
        1/8, 1/4, 1/8, 1/4, 1/4, each within 3 binomial standard errors.
      - >-
        Matched-ordered-base control: realized cycle-type counts per cell.
        FORCED exactly 0 four-cycles, with every realized type in
        {1^4, 2.1.1, 2^2}.
      - >-
        Random-quartic control: factorization-type histogram per p against
        S_4 Chebotarev densities (1/24, 1/4, 1/8, 1/3, 1/4), within 3
        binomial standard errors.
      - >-
        Factor-base-sublocus control: percentage identity class (forced
        100%), reported but declared non-discriminating in advance -- never
        an independent finding.
      - >-
        Excluded-strata counts (i), (ii), (iii) per cell, each reported
        separately with f's actual root count on that curve for stratum
        (ii).
      - >-
        HEUR-WREATH-2 check: realized-class count over F_{p^2} vs F_p per
        curve (must match).
      - Curve construction transcript: p, A, B, disc_check value per cell.
      - Wall time, peak memory, and operation counts per stage, per cell.

  preregistered_prediction:
    - quantity: Stage-0 identity check
      value: exact term-by-term equality in Z[e1,e2,A,B] and Z[t1,t2,A,B]
      formula: "c0 = disc_T S_3(t1,t2,T) / 16 = f(t1) f(t2)"
      source: "H-MONO-0b3def mechanism STEP 1/3; KN-FIND-a8990a identity, cited not re-derived."
    - quantity: P1 (primary)
      value: "0 exactly, off excluded stratum (iii)"
      formula: "Arm (a) and arm (b) compute the same Galois-theoretic object by independent routes."
      source: H-MONO-0b3def falsification_conditions item 3 (character-triple form); this is its arm-vs-arm analogue.
    - quantity: P2 (primary)
      value: "exactly 8, every cell"
      formula: "|D_4| = 8; STEP 5's inertia-generation lower bound."
      source: H-MONO-0b3def prediction 3 / falsification_conditions item 4.
    - quantity: P3 (primary)
      value: "1.000 exactly, every cell"
      formula: "S6 Frobenius recipe."
      source: H-MONO-0b3def prediction 4 / falsification_conditions item 3.
    - quantity: class densities
      value: "1/8, 1/4, 1/8, 1/4, 1/4 within 3 s.e. and O(1/p)"
      formula: "S6 recipe densities over uniform (e1,e2)."
      source: H-MONO-0b3def prediction 5.
    - quantity: matched ordered-base control
      value: "0 four-cycles; realized types contained in {1^4, 2.1.1, 2^2}"
      formula: >-
        Over a split pair Frobenius acts by sign flips only, so no 4-cycle
        arises (KN-FIND-a8990a Theorem B's fixed-point-free non-identity
        class lives on the degree-2 T-fiber, not on this four-point object).
      source: H-MONO-0b3def proof_search_map.baseline_embedding.reproduction_check.
    - quantity: random-quartic control
      value: "1/24, 1/4, 1/8, 1/3, 1/4 within 3 s.e."
      formula: S_4 Chebotarev densities for a uniformly random squarefree monic quartic.
      source: source proposal `controls` item 1; H-MONO-0b3def falsification_conditions item 6.

  seeds_and_reproducibility:
    exhaustive_arms_are_seed_free: >-
      Arms (a), (b), the character-triple check, the excluded-strata split,
      the matched-ordered-base control, and the factor-base-sublocus control
      all iterate DETERMINISTICALLY over every (e1,e2) in F_p^2 (or a
      derived re-filter of that same enumeration). No randomness is used and
      none is needed; two runs on the same code and inputs must produce
      bit-identical per-cell outputs.
    random_quartic_control_seed_rule: >-
      Only the random-quartic null control consumes randomness. Domain
      string "EXP-MONO-4c7479/v1". Each drawn coefficient b_i (i=0..3) for
      draw index j at prime p uses
      SHA256(domain || "|" || "quartic-coeff" || "|" || decimal(p) || "|" ||
      decimal(j) || "|" || decimal(i) || "|" || decimal(counter)) mod p,
      big-endian unsigned interpretation, with rejection sampling against
      modulo bias (reject digests >= floor(2^256/p)*p) and `counter`
      incremented on each rejection. A drawn quartic failing the
      squarefreeness check (gcd(h,h') != 1) is discarded and re-drawn at the
      next draw index j+1 (not re-seeded, not retried in place), and the
      discard is counted and reported.
    master_seeds: [20260830, 20260831]
    master_seed_use: >-
      The `domain` string above is independent of any master seed (the
      random-quartic draws are fully determined by (domain, p, draw index,
      coefficient index, counter) alone); the two master seeds instead label
      two INDEPENDENT REPLICATION RUNS that each use a DIFFERENT domain
      suffix ("run-20260830" and "run-20260831" appended to the domain
      string), so the two runs draw genuinely different quartic samples.
      Any discrepancy between the two runs' histograms beyond sampling noise
      is reported before any control-band verdict is read.

  replication:
    planned_runs: 2
    seeds: [20260830, 20260831]
    interpretation: >-
      P1, P2, P3, the class-density counts, the excluded-strata counts, and
      the matched-ordered-base control are exhaustive and seed-invariant by
      construction: any run-to-run difference in them is an implementation
      defect (non-determinism bug), not sampling noise, and voids the cell.
      Only the random-quartic control's histogram is expected to vary
      between the two runs, and its run-to-run spread must be reported
      before any control-band verdict is read.

  budget:
    wall_clock_seconds_per_run: 1200
    total_cpu_hours: 0.75
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
    below_template_floor_rationale: >-
      templates/research-records.md's stated budget floors
      (wall_clock_seconds_per_run >= 600, maximum_memory_gb >= 8) are sized
      to avoid truncating a real computation to an arbitrary small window.
      This contract deliberately sets a SMALLER wall-clock cap (1200s, still
      above the 600s single-tool-window floor) and a much smaller memory cap
      (1GB) because the actual work is genuinely tiny: at most
      6 cells x (10,201 + 44,521)/2-scale enumeration ~= 1.6x10^5 base-point
      classifications total, each a handful of modular arithmetic operations
      (see `cost_note`), plus 2 x 4,000 random-quartic draws. Declaring
      floor-sized caps here would misrepresent the scope of a toy-scale
      exhaustive census as needing a full tool window or gigabytes of
      memory, neither of which is true.
    cost_note: >-
      Per (p,A,B) cell, Stage 1 processes p^2 base points (10,201 at p=101,
      44,521 at p=211); across the 3 curves per p this is at most
      3 x 44,521 ~= 1.34x10^5 points at p=211 plus 3 x 10,201 ~= 3.06x10^4 at
      p=101, total ~= 1.65x10^5 base-point classifications. Arm (a) is O(1)
      modular arithmetic (one sqrt-mod-p or F_{p^2} conjugation, one curve
      addition-free coordinate read) per point; arm (b) is O(1) polynomial
      root-finding by direct evaluation over F_p (a handful of Y-values to
      test given the biquadratic structure means only Z=Y^2 candidates need
      resolving before any general-quartic fallback is invoked) plus, on
      the rare irreducible-remainder branch, a handful of polynomial
      multiplications of degree <=4 mod p for the distinct-degree check
      (repeated squaring to compute Y^{p^2} mod h(Y) is O(log(p^2)) ~= 16-18
      multiplications at these sizes). This is trivially seconds of pure
      Python at these primes, not minutes; the 1200s per-run cap and 0.75
      total CPU-hour budget are generous margins, not tight estimates. The
      random-quartic control (2,000 squarefree quartics per p per run, each
      requiring at most p residue tests plus an occasional distinct-degree
      check) is of the same order of magnitude and does not change this
      estimate materially.

  environment_preconditions:
    requirement: >-
      Pure Python 3 standard library only: integer arithmetic, `pow(x, e,
      m)` for modular exponentiation and modular inverse (`pow(x, -1, m)`),
      and hand-written F_{p^2} arithmetic (as (u,v) pairs) and polynomial
      arithmetic mod p (as coefficient lists). NO sympy, NO sage, NO numpy,
      NO g6k, NO fpylll are required for any primary metric; nothing in this
      contract is blocked by their absence.
    if_a_precondition_fails: >-
      Any interpreter failure, a curve construction failing its disc_check,
      or a non-terminating root search is `failed_infrastructure` and is
      reported as infrastructure signal, NEVER as negative mathematical
      evidence against H-MONO-0b3def (AGENTS.md rule 5).

  infrastructure_failure_disposition: >-
    Any timeout, crash, memory-cap breach, or construction failure is
    recorded with its exact cause and classified `failed_infrastructure` or
    `invalid`. Such an outcome supports and weakens NOTHING and may not be
    cited as evidence about the monodromy claim or the ECDLP.

  stopping_rules:
    - >-
      This contract is now approved, frozen and execution_authorized
      (approved_by: coordinator, 2026-08-30; see
      `coordinator_approval_rationale`). Do not execute any FUTURE amendment
      to this contract unless it is likewise separately reviewed, approved,
      frozen and authorized.
    - Stop at Stage 0 if any symbolic identity fails. Spend no further compute.
    - >-
      Stop a cell's interpretation (report instrument failure, not a
      Semaev-arm result) if its random-quartic control fails to reproduce
      S_4 densities, in particular fails to emit any 3+1.
    - >-
      Stop the whole contract's interpretation if the matched-ordered-base
      control returns any 4-cycle, or any type outside {1^4, 2.1.1, 2^2}: the
      baseline reproduction check has failed and no symmetric-base result
      may be interpreted until it is understood.
    - Stop on any budget breach, reporting it as infrastructure signal.

  invalidation_rules:
    - Any execution while `frozen`, `execution_authorized`, or `evidence_eligible` is false.
    - Any missing curve-construction transcript, disc_check value, or seed record.
    - Any run manifest lacking field_bits for both tested primes.
    - Any cell reporting P1 without separately reporting the stratum-(iii) count it excluded.
    - Any cell reporting a raw class-density count without its forced-value comparison.
    - >-
      Any post-hoc change to a pre-registered band, tolerance, or exclusion
      rule after any Stage-1 number has been observed. Such a change
      requires a versioned protocol amendment marked exploratory_only and is
      never a silent edit.
    - >-
      Any report of the factor-base-sublocus control's 100%-identity result
      as an independent finding (it is declared non-discriminating in
      advance).

  success_criterion: >-
    THIS CONTRACT IS NOW APPROVED AND EXECUTION_AUTHORIZED; no run has
    happened yet, so no outcome is reported here. When executed, its
    positive disposition is: Stage 0 passes as exact
    identities; P1 = 0 and P2 = 8 and P3 = 1.000 at every one of the 6
    cells; the five class densities fall within band at every cell; the
    matched-ordered-base control returns 0 four-cycles, with every realized
    type in {1^4, 2.1.1, 2^2}, at every cell; the random-quartic control reproduces S_4 Chebotarev
    densities at both primes; and the factor-base-sublocus control returns
    100% identity (reported, not claimed as a finding). THAT DISPOSITION
    SUPPORTS EXACTLY the scoped statement in `claim_ceiling` and nothing
    more: it establishes no ECDLP claim, no m>=4 statement, and does not
    close KN-OPEN-009 or GOAL-MONO-001.

  falsification_criterion: >-
    Any of: (a) the Stage-0 identity failing; (b) P1 > 0 off stratum (iii)
    at any cell; (c) P2 < 8 at any cell (the exceptional-locus signal, a
    falsifier of the record's central claim, not a hoped-for result); (d)
    P3 < 1.000 at any cell; (e) the matched-ordered-base control returning a
    4-cycle or any type outside {1^4, 2.1.1, 2^2}, with the random-quartic control
    passing; (f) a class-density deviation of order p^{-1/2} rather than
    O(1/p) between p=101 and p=211, with controls passing (a two-point
    ladder gives limited but nonzero power to see this).

  outcomes:
    no_execution_authorization: >-
      SUPERSEDED BY APPROVAL 2026-08-30 (see `coordinator_approval_rationale`);
      retained to show the pre-approval disposition this contract carried
      while `review_required`. Before approval: no run, no observation, no
      evidence, no inference.
    future_controlled_confirmation_toy: >-
      The expected outcome per the derivation: all primary metrics pass at
      both primes on all 6 cells, the controls behave as forced, and the
      derivation in H-MONO-0b3def is corroborated (not proved by this run;
      its validity rests on the proof) at toy scale.
    future_deviation_found: >-
      Any falsification_criterion item triggers with controls passing.
      Escalated to independent review-adversarial per AGENTS.md rule 12
      before any hypothesis-status change is considered; not to be reported
      as a routine negative.
    instrument_failure: >-
      Random-quartic control fails, or arm(a)/arm(b) disagree outside
      stratum (iii) in a pattern traceable to a shared implementation error.
      Inconclusive instrument signal; never evidence.
    infrastructure_or_integrity_failure: >-
      See `infrastructure_failure_disposition`. Never mathematical evidence.

  scale_relevance:
    tier: toy
    justification: >-
      p in {101, 211} only; m=3 only; 6 (curve, prime) cells, all
      generic-ordinary. The group-theoretic claim (D_4 monodromy) is
      scale-free and holds by derivation for every p > 3 and every
      non-singular curve; a toy run CHECKS specific numerical consequences
      of it rather than establishing them by scale. Nothing here transfers
      to cryptographic-scale p, and nothing here addresses m>=4.
    correspondence: null

  future_work:
    - >-
      Stage 2: sampled census at p=1009 on the same 6-cell curve
