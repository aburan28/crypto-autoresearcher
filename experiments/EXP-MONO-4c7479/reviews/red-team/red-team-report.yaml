        near-exact magnitude at the largest cells (e.g. p=211, A=4,B=1:
        predicted -9.83 s.e. vs observed -10.23 s.e. for identity).
      status: CONFIRMED as a genuine falsifier of HEUR-WREATH-3 /
        falsification_conditions item 5, SCOPED to that heuristic and to
        the identity/sigma1_sigma2 densities specifically -- it does not
        touch the upper-bound (containment in D_4), lower-bound
