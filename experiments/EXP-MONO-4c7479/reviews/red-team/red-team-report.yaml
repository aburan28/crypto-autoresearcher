  full_j2_derivation: |
    OBJECT IDENTIFICATION (per KN-FIND-a8990a Theorem A/B, read in full).
    At m=3, n=2: the roots of S_3(t1,t2,T) are the x-coordinates of the
    signed sums eps1*P1+eps2*P2, eps_i in {+1,-1}. The map
    (eps1,eps2) -> x(eps1 P1+eps2 P2) is exactly 2-to-1 because flipping
    BOTH signs negates the point, and x(-R)=x(R). So the 4 sign patterns
    collapse to exactly 2 T-roots: x(P1+P2) and x(P1-P2). Theorem A states
    Gal(S_3/L) = (Z/2)^2/Delta, Delta = <sigma1 sigma2> (the DIAGONAL
    sign flip), of order 2^2/2 = 2 -- matching deg_T S_3 = 2 exactly.

    THE TOWER. Let sigma1, sigma2 be the generators of Gal(k(t1,t2,y1,y2)/
    k(t1,t2)) = (Z/2)^2 that H-MONO-0b3def's own STEP 2 builds (sigma_i:
    P_i -> -P_i, i.e. y_i -> -y_i, fixing the other point). This full
    (Z/2)^2 acts on the labelled 4-point set {P1,-P1,P2,-P2}. Delta =
    <sigma1 sigma2> is a SUBGROUP of this (Z/2)^2, of index 2, and its
    fixed field is exactly k(t1,t2,x(P1+P2),x(P1-P2)) = the splitting
    field of S_3(t1,t2,T) (since sigma1 sigma2 sends P1+P2 -> -(P1+P2) and
    P1-P2 -> -(P1-P2), fixing both x-coordinates, and nothing smaller does).
    So: Gal(S_3/L) = (Z/2)^2 / Delta, i.e. Theorem B's Galois group is a
    QUOTIENT of the tower H-MONO-0b3def's own mechanism builds, NOT the
    same group, and NOT (as S5 assumed) directly readable as "the" Galois
    group acting on the four points.

    THE QUOTIENT MAP AND ITS FIBRES (answers task question 1). The
    quotient map (Z/2)^2 -> (Z/2)^2/Delta sends:
      id            -> trivial (Delta-coset {id, sigma1 sigma2})
      sigma1 sigma2 -> trivial (same coset, since sigma1 sigma2 IS the
                       generator of Delta)
      sigma1        -> nontrivial (coset {sigma1, sigma2}, since
                       sigma2 = sigma1 * (sigma1 sigma2) and
                       sigma1 sigma2 is in Delta)
      sigma2        -> nontrivial (same coset as sigma1)
    So "Frobenius = id or sigma1sigma2 on the 4 points" <=> "T-roots fixed"
    <=> S_3(a,T) splits into 2 linear factors <=> c(t1)=c(t2) (Theorem B's
    first case). "Frobenius = sigma1 or sigma2 on the 4 points" <=>
    "T-roots swapped" <=> S_3(a,T) is 1 irreducible quadratic <=> c(t1) !=
    c(t2) (Theorem B's second case). This is a completely well-defined,
    checkable map, and it shows Theorem B's two-type dichotomy is a
    coarsening that MERGES {id, sigma1sigma2} into one type and merges
    {sigma1, sigma2} into the other -- it does not, and cannot, distinguish
    id from sigma1sigma2, nor does it forbid sigma1/sigma2 alone; it simply
    reports a courser invariant (whether the two T-roots swap) that is
    blind to three of the four richer group elements' individual identity.

    STRICT ORDERED BASE, GROUP-THEORETICALLY (answers task question 2). Over
    k(t1,t2) with NO tau (t1,t2 already in the base field, no swap element
    in the Galois group), Gal(k(t1,t2,y1,y2)/k(t1,t2)) = <sigma1,sigma2> =
    (Z/2)^2, order 4 exactly, with the four elements acting on
    {P1,-P1,P2,-P2} as:
      id            : 4 fixed points               -> cycle type 1^4
      sigma1        : (P1 -P1) fixed, P2,-P2 fixed  -> cycle type 2.1.1
      sigma2        : (P2 -P2) fixed, P1,-P1 fixed  -> cycle type 2.1.1
      sigma1 sigma2 : (P1 -P1)(P2 -P2)               -> cycle type 2^2
    THREE distinct cycle types among the group's four elements -- exactly
    what the Executor's control observed, and group order 4 (not the group
    order 2 that governs Theorem B's own smaller object).

    NO HIDDEN CORRELATION FROM "COMMON QUADRATIC" (answers task question 3).
    Any two DISTINCT field elements t1 != t2 are, trivially, the two roots
    of the quadratic x^2 - (t1+t2)x + t1 t2; being "roots of a common
    quadratic" imposes no algebraic constraint on t1,t2 beyond distinctness
    -- (e1,e2) ranges over F_p^2 with e1^2-4e2 a nonzero square exactly as
    (t1,t2) ranges over all ordered pairs of distinct field elements. There
    is no arithmetic identity forcing chi(f(t1)) and chi(f(t2)) to agree.
    This is confirmed independently and numerically below
    (verification_computations): the observed 1^4:2.1.1:2^2 proportions in
    the control match, cell by cell, the values predicted purely from the
    curve's own (S,N) = (#squares, #nonsquares of f) counts via elementary
    combinatorics (S(S-1) : 2SN : N(N-1), normalized), with no adjustable
    parameter and no reference to arm (a)'s internal code. sigma_i
    ("2.1.1") realized alone is therefore not merely possible but the
    single LARGEST bucket at every cell, exactly as 2SN/[(p-Z)(p-Z-1)] ~
    1/2 predicts for balanced S,N.

    VERDICT ON QUESTION 4. {1^4, 2.1.1, 2^2} IS the mathematically correct
    realized set for the object the Executor's control actually built (arm
    (a)'s own four-point machinery fed the ordered pair directly, per
    ordered_base_control.py and implementation.md item 1's own literal
    reading of the contract text). The original hypothesis's own S5 claim
    ("Theorem B forces ... one of 1^4 and 2^2") and the pre-edit
    baseline_embedding.reproduction_check text ("require the ordered arm to
    reproduce Theorem B's two-type law") are a CITATION/DERIVATION ERROR:
    they misapply Theorem B's statement about the SMALLER, order-2-quotient
    T-line object onto the FINER, order-4, four-labelled-point object that
    H-MONO-0b3def's own mechanism (STEP 2) separately and correctly builds.
    This is not a falsifier of anything in H-MONO-0b3def's own STATEMENT
    (a)-(d) (the D_4 monodromy over the symmetric base): that claim was
    never about this control's forced value, and the control's own separate
    documented purpose (baseline_embedding) is satisfied in substance by a
    DIFFERENT, correct check -- zero 4-cycles over the ordered base, which
    IS observed at every cell (0 four-cycles, matching the part of the
    forced claim that is actually implied by S_3's degree being 2, since a
    4-cycle on the labelled points would require an order-4 element, and
    (Z/2)^2 has none). The control's *literal* forced-value text (as
    originally written, pre-edit) is wrong; the underlying D_4 claim is
    untouched. This finding is reached independently of, and by different
    reasoning than, the disputed out-of-band edit -- via (i) the
    Delta-quotient group theory above, (ii) the internal inconsistency
    between the hypothesis's own S5 and its own S6 recipe (S6, applied to
    literal ordered pairs where chi(e1^2-4e2)=+1 automatically, already
    predicts all three types), and (iii) an exact numerical match between
    combinatorial (S,N)-based predictions and the observed per-cell counts
    (below), which also functions as a partial, code-independent
    corroboration of arm (a)'s classifier (informative for the concurrent
    J1 review, not a substitute for it).

  full_j3_derivation: |
    SETUP. Let p be prime, E: y^2=f(x) nonsingular over F_p, Z = #{roots of
    f in F_p} (0, 1, or 3), S = #{x not a root of f : f(x) is a nonzero
    square}, N = #{x not a root of f : f(x) is a nonsquare}. Then
    S+N=p-Z and, from the standard point-count identity (also stated in
    H-MONO-0b3def's own HEUR-WREATH-3 rigorous_support), S=(p-t-Z)/2,
    N=(p+t-Z)/2, where t = p+1-#E(F_p) is the trace of Frobenius; hence
    S-N = -t exactly.

    Over the split regime (chi(e1^2-4e2)=+1, i.e. t1,t2 both in F_p,
    t1 != t2), the symmetric-base census counts unordered pairs {t1,t2}:
      identity      count = C(S,2) = S(S-1)/2
      sigma_i       count = S*N
      sigma1_sigma2 count = C(N,2) = N(N-1)/2
    (verified this equals the observed matched_ordered_base_control ORDERED
    counts up to the expected factor of 2, and equals the symmetric-base
    per-cell class_density_report counts up to a normalizing constant --
    both checked numerically below.)

    THEOREM B'S ACTUAL CANCELLATION. KN-FIND-a8990a Theorem B bounds
    |(S^n+N^n)/q^n - 2^{-(m-2)}| = O(1/q) for the MERGED class
    (c(a1)=c(a2), i.e. identity+sigma1_sigma2 combined). Substituting
    S=(p-Z)/2-t/2, N=(p-Z)/2+t/2:
      S^2+N^2 = [(p-Z)^2 + t^2] / 2
    -- an EVEN function of t. The linear-in-t terms from S^2 and N^2 have
    OPPOSITE sign and cancel exactly in the sum; only the t^2 = O(p) term
    survives, giving a deviation of order t^2/(p-Z)^2 = O(1/p). This IS the
    "trace cancels at first order" phenomenon Theorem B proves, and it is
    why `sigma_i` (which is proportional to 2SN = [(p-Z)^2-t^2]/2, ALSO
    even in t) is observed within 3 s.e. at every one of the 6 cells: no
    linear term exists to detect.

    WHY IT DOES NOT COVER identity AND sigma1_sigma2 SEPARATELY. These are
    S(S-1) and N(N-1) INDIVIDUALLY, not their sum. Their DIFFERENCE:
      S(S-1) - N(N-1) = (S-N)(S+N-1) = -t * (p-Z-1)
    is LINEAR and ODD in t -- it does NOT cancel. To leading order,
      identity_density  ~ (1/2)*S(S-1)/[(p-Z)(p-Z-1)] ~ 1/8 - t/(4(p-Z))
      sigma1sigma2_dens ~ (1/2)*N(N-1)/[(p-Z)(p-Z-1)] ~ 1/8 + t/(4(p-Z))
    (the leading factor 1/2 restates the split-regime population being
    about half the total census; the O(1/(p-Z)) term is the genuine,
    deterministic, curve-trace-driven bias). This is a t/p = O(p^{-1/2})
    effect for generic curves, since |t| = Theta(sqrt(p)) is the typical
    case (Hasse bound |t| <= 2 sqrt(p), and t is emphatically NOT
    generically o(sqrt(p))).

    S.E.-NORMALIZED PREDICTION. For an exhaustive p^2-point census, the
    binomial s.e. of a class with forced density 1/8 scales as
    SE_density ~ sqrt((1/8)(7/8)) / (p-Z) = 0.3307/(p-Z) (since n ~
    (p-Z)^2). Combining with the deviation above:
      deviation_in_SE(identity)      ~ -t / (4*0.3307) ~ -0.756 * t
      deviation_in_SE(sigma1_sigma2) ~ +0.756 * t
    Notably this predicted ratio is APPROXIMATELY INDEPENDENT OF p to
    leading order -- it depends only on the curve's own trace t, not on
    which prime the curve happens to be tested at. This is the reason a
    naive "does the s.e. deviation shrink between p=101 and p=211" check
    on THIS 3-different-curves-per-prime panel is not diagnostic by itself
    (per the contract's own disclosed caveat): different curves carry
    different t, and t itself grows in typical magnitude with sqrt(p), so
    the deviation-in-SE should be expected to GROW in typical/worst case
    as p increases (up to ~0.756*2*sqrt(p) at the Hasse-bound extreme),
    never shrink towards 0 -- the opposite of what an O(1/p)-only,
    no-p^{-1/2}-term claim requires.

    VERIFICATION_COMPUTATIONS (exact, from independently computed t,S,N,Z
    for each curve, script run this session):
      p=101 A=1 B=1: t=-3,  Z=0 -> predicted identity dev_SE ~ +2.27, observed +1.52
      p=101 A=2 B=3: t=6,   Z=1 -> predicted identity dev_SE ~ -4.54, observed -5.81
      p=101 A=4 B=1: t=-10, Z=3 -> predicted identity dev_SE ~ +7.56, observed +4.67
      p=211 A=1 B=1: t=-11, Z=0 -> predicted identity dev_SE ~ +8.31, observed +7.74
      p=211 A=2 B=3: t=8,   Z=1 -> predicted identity dev_SE ~ -6.05, observed -7.38
      p=211 A=4 B=1: t=13,  Z=0 -> predicted identity dev_SE ~ -9.83, observed -10.23
    (sign convention: dev_SE = -0.756*t using the leading-order formula
    above; residual discrepancies of order 20-40% are consistent with the
    O(1/(p-Z)) next-order terms dropped in the linearization, the "-1"
    combinatorial corrections, and Z != 0 adjustments not carried to second
    order.) The `sigma1_sigma2` column reproduces the same magnitudes with
    the opposite sign at every cell (e.g. p=211 A=4 B=1: predicted +9.83,
    observed +9.33). This is a close, sign-correct, same-order-of-magnitude
    match obtained ENTIRELY from S,N,Z (i.e. from the curve's own point
    counts, independent of arm (a)'s or arm (b)'s code), which is strong
    evidence the observed deviations are a real deterministic property of
    these specific curves and this specific class definition, not
    statistical noise and not a code defect.

    ANSWERS TO THE THREE SUB-QUESTIONS.
    (a) NOT an artifact of a too-tight s.e. band at small p. The predicted
    deviation is a real, computable, deterministic function of (t,p) that
    matches the observed magnitude to good precision at BOTH p=101 and
    p=211. Loosening the s.e. band would hide a genuine, derivable,
    non-decaying-relative-to-SE effect, not correct a miscalibrated test.
    (b) YES, there is a precise, derived reason `identity` and
    `sigma1_sigma2` specifically (not `sigma_i`, `block_swap_involution`,
    `four_cycle`) are affected: they are exactly the two elements of
    Delta = <sigma1 sigma2>, i.e. the two central elements of D_4 in this
    presentation, and they are also exactly the two-way split of Theorem
    B's own single merged "c(a1)=c(a2)" class by WHICH shared sign (+1 or
    -1) rather than mere agreement -- a split Theorem B's cancellation
    proof does not reach, because it operates on S^2+N^2 (even in t), not
    on S^2 and N^2 individually. `sigma_i` corresponds to Theorem B's OTHER
    merged class (2SN, also even in t) and is untouched by construction;
    the inert-regime classes (`block_swap_involution`, `four_cycle`) are
    controlled by a distinct character sum over F_{p^2} whose leading
    quantity is t_2 = t^2-2p (already even in t), plausibly explaining
    their good behavior, though this secondary claim was not derived to
    the same rigor as the split-regime case and is named as the concrete
    next check.
    (c) The two-different-curves-per-prime panel is NOT independently
    diagnostic of O(1/p) vs O(1/sqrt(p)) growth (the contract's own
    caveat), because t varies across the panel's curves independently of
    p. But the ANALYTIC derivation above is diagnostic on its own terms,
    without needing the empirical growth-rate fit: it shows the deviation
    is proportional to t, hence generically Theta(sqrt(p)) in absolute
    density terms is wrong (it's actually O(t/p) which for typical curves
    is O(1/sqrt(p))), and in s.e.-normalized terms is Theta(t) -- i.e.
    unbounded-in-p in the worst case, not shrinking. This is diagnostic of
    p^{-1/2}, not O(1/p), scaling.

    VERDICT: BREAKS -- specifically, HEUR-WREATH-3 as literally stated (
    "equidistributes ... up to an error of order 1/p, with no term of
    order p^{-1/2}") is falsified for the `identity` and `sigma1_sigma2`
    densities, and falsification_conditions item 5 is triggered exactly as
    written ("A class density deviating from its forced value by order
    p^{-1/2} ... while controls pass[: random-quartic control passes at
    every cell, arm(a)/arm(b) agreement is exact, P2=8 everywhere] ... the
    O(1/p) claim is wrong"). This is SCOPED: it falsifies the individual
    class-density prediction and HEUR-WREATH-3, not the D_4
    containment/realization/recipe claims (S6's own per-instance recipe
    check, P3, remains 1.000 exactly at every cell -- the group-theoretic
    machinery correctly PREDICTS which class occurs per instance; the
    defect is purely in the CLAIMED EQUIDISTRIBUTION RATE of two of the
    five classes, not in whether the classes/mechanism are correct).

  heuristic_challenges:
    - heuristic_id: HEUR-WREATH-3
      challenge: >-
        The random_model_justification claims "the trace enters only
        through products in which it cancels at first order, the same
        phenomenon KN-FIND-a8990a Theorem B records and proves for the
        ordered base." This is true for the MERGED classes Theorem B
        actually treats (identity+sigma1_sigma2 combined, and sigma_i
        alone) but FALSE for the finer identity/sigma1_sigma2 split that
        H-MONO-0b3def's own class-density prediction additionally makes.
        The heuristic's random-model justification does not transfer to
        the finer object it is invoked to support; see full_j3_derivation.
      disposition: falsified for identity and sigma1_sigma2 at the tested
        scope (p in {101,211}); not falsified for sigma_i,
        block_swap_involution, four_cycle at the tested scope.
    - heuristic_id: HEUR-WREATH-1
      challenge: >-
        Not independently re-derived in this review (out of my assigned
        joints J2/J3); noted only that its own validation design
        (measured realized-permutation count = 8 at every cell) held per
        the execution report, so at the tested scope this heuristic is not
        load-bearing, exactly as the record itself predicts should happen
        if it holds.
      disposition: not attacked; outside J2/J3 scope, flagged for
        completeness only.

