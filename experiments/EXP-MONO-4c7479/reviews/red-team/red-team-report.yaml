        and the degree-4 field k(t1,t2,y1,y2)/k(t1,t2) that H-MONO-0b3def's
        own mechanism (STEP 2) builds directly, whose Galois group is the
        FULL (Z/2)^2 = <sigma1,sigma2> (order 4, not order 2) acting on the
        four labelled points {P1,-P1,P2,-P2}. See "full_j2_derivation"
        below for the complete group-theoretic argument, worked
        independently of the disputed out-of-band edit.
      status: CONFIRMED as a genuine citation/mapping error, independently
        re-derived (not taken on faith from the out-of-band edit).
    - id: OBJ-J3-1
      target: >-
        H-MONO-0b3def HEUR-WREATH-3 and its class-density prediction /
        falsification_conditions item 5 ("each [class] within 3 binomial
        s.e. AND within an O(1/p) window ... must NOT be of order p^{-1/2}")
      statement: >-
        The individual `identity` and `sigma1_sigma2` class densities are
        NOT covered by the O(1/p) cancellation KN-FIND-a8990a Theorem B
        actually proves. Theorem B's proven cancellation applies to the
        SUM S^2+N^2 (Theorem B's own merged "c(a1)=c(a2)" class, i.e.
        identity+sigma1_sigma2 together) and to the product 2SN (the
        "c(a1)!=c(a2)" class, i.e. sigma_i) -- both of which are EVEN
        functions of the curve's trace t. But `identity` and
        `sigma1_sigma2` individually decompose that merged class by S(S-1)
        vs N(N-1), whose DIFFERENCE is exactly -t*(p-Z-1): an ODD, linear,
        non-cancelling function of t. This produces a density deviation of
        order t/p and, normalized by the exhaustive census's own binomial
        s.e. (which shrinks like 1/p), a deviation-in-s.e. of order t --
        which is Theta(sqrt(p)) for generic/typical curves. This is
        exactly the p^{-1/2}-type first-order-trace signature that the
        hypothesis's own falsification_conditions item 5 names as a
        two-sided falsifier. See "full_j3_derivation" below; the
        analytic prediction matches the observed s.e. deviations at all 6
