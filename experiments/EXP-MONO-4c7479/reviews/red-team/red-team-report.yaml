        attack (hold the "two-cycle-type" invariant fixed, vary the
        underlying object from 2 roots to 4 points) cleanly separates the
        two objects and identifies exactly where S5 over-generalizes.
    - attack: quantifier_order (applied to J3)
      finding: >-
        HEUR-WREATH-3's formal_statement quantifies over "(e1,e2) in
        F_p^2" uniformly, but the class-density PREDICTION implicitly
        needs the bound to hold UNIFORMLY IN THE CURVE (i.e. for every t
        in the Hasse interval), not merely in expectation over curves. The
        derivation above shows the bound genuinely fails for curves with
        |t| = Theta(sqrt(p)) -- i.e. for MOST curves, not an exceptional
        few -- so the quantifier order silently assumed ("for a
        /the/ curve, the density is within O(1/p)") is not license to
        average over curves; the falsification criterion is per-curve and
        is triggered per-curve.

