      result: PASS
      detail: "Run 1: 36.28s. Run 2: 36.12s. Both far under the 1200s cap; no timeout."
    - check: memory budget (1GB cap)
      result: PASS
      detail: "Run 1: 68,616,192 bytes peak RSS. Run 2: 68,698,112 bytes. Both ~6.4% of the 1GB (1,073,741,824 byte) cap."
    - check: maximum_runs (2)
      result: PASS
      detail: "Exactly 2 run directories exist; manifest.yaml for each records status completed_valid."
    - check: no infrastructure failure, timeout, or crash
      result: PASS
      detail: "Both manifests: budget_breach false; execution_report.yaml: infrastructure_failures/timeouts/crashes all empty lists."
    - check: random-quartic control stopping rule ("must emit 3+1")
      result: PASS
      detail: >-
        Independently recomputed binomial SE bands (see random-quartic
        control check above) confirm all 4 (prime x run) histograms fall
        within 3 s.e. of forced S4 Chebotarev densities and all emit 3+1;
        the stage_1 terminates_the_run_if clause was therefore correctly
        NOT triggered, and Stage-1 Semaev-arm results were correctly not
        stopped from interpretation.
    - check: Stage-0 gate correctly evaluated as PASS before Stage-1 ran
      result: PASS
      detail: >-
        stage0_transcript.json (byte-identical both runs) shows all 8
        sub-checks PASS, matching my own independent symbolic re-derivation;
        raw-result.json confirms stage1_executed=true, consistent with the
        stated gate logic in run_experiment.py (stage 1 only proceeds if
        stage0_result["all_pass"] is true).

  findings:
    - id: F1
      severity: material
      title: >-
        The out-of-band-edit disclosure is incomplete and materially
        mischaracterizes what specification.yaml text the Executor actually
        ran against; DEV-1's "anomaly" framing does not hold against the
        specification text that was actually in force.
      scope_statement: >-
        This is a pure record-consistency finding within J1's mandate to
        "verify command, revision... against the frozen contract." It takes
        NO position on whether the matched-ordered-base control's CHOSEN
        OBJECT (arm a's 4-point machinery fed an ordered pair) is a Galois-
        theoretically faithful reproduction of KN-FIND-a8990a Theorem B --
        that remains squarely the Red Team's remit.
      evidence:
        - >-
          git log --all -- experiments/EXP-MONO-4c7479/specification.yaml
          shows exactly three commits touching this file: e367f28bb (freeze/
          approve, 2026-08-30 12:26:58 -0700, Dispatch Test), 5f0d0dec1
          (Cursor Agent <cursoragent@cursor.com>, 2026-08-30 19:36:59 UTC =
          12:36:59 -0700), and a1269ac26 (Cursor Agent, 2026-08-30 19:43:19
          UTC = 12:43:19 -0700).
        - >-
          coordination/tasks/TASK-20260830-8c214e/snapshot-receipt.json's
          out_of_band_edit_disclosure names ONLY a1269ac26 as "the" out-of-
          band edit ("a commit (a1269ac26...) edited the FROZEN, approved
          specification.yaml... This is the SECOND out-of-band edit by this
          same external git identity found in this session"). It does not
          mention 5f0d0dec1 anywhere. The count of out-of-band edits to THIS
          experiment's frozen contract is therefore undercounted by one: two
          edits, not one, both by the same unauthorized external identity,
          both committed directly with no versioned protocol_amendment
          (experiments/EXP-MONO-4c7479/amendments/ is empty).
        - >-
          `git merge-base --is-ancestor 5f0d0dec1 d810634a6` returns true,
          and `git diff 5f0d0dec1 d810634a6 -- specification.yaml` is empty:
          the specification.yaml tree state at d810634a6 (the commit BOTH
          run manifests record as "the Executor's start commit" / code.commit)
          is BYTE-IDENTICAL to 5f0d0dec1's post-edit version, not to
          e367f28bb's original frozen text.
        - >-
          The disclosure states: "the Executor built and ran against the
          ORIGINAL (pre-edit) specification text at commit d810634a6...and
          never saw this edit." This is FALSE for 5f0d0dec1: that edit
          predates d810634a6 and IS the text at d810634a6. It is true only
          of a1269ac26 (which lands 18s after d810634a6, and whose content
          is a smaller, second-order propagation of 5f0d0dec1's correction
          into claim_ceiling/cost_note/environment_preconditions prose, per
          `git diff 5f0d0dec1 a1269ac26`).
        - >-
          5f0d0dec1's diff against e367f28bb (`git diff e367f28bb 5f0d0dec1
          -- specification.yaml`) is the commit that actually introduces
          BOTH corrections the receipt's content_assessment attributes to
          "the edit": (i) the explicit F_{p^4}-arithmetic requirement in
          `arms_and_controls.arm_a_direct_group_arithmetic` ("This second
          lift is NOT optional...an implementation lacking F_{p^4}
          arithmetic cannot realize the 4-cycle class at all and would
          false-falsify P2"), and (ii) the matched_ordered_base_control
          FORCED-value correction from "exactly 2 distinct cycle types
          {1^4,2^2}, zero 2.1.1" to "exactly zero 4-cycles, and every
          realized type drawn from {1^4, 2.1.1, 2^2}". a1269ac26 only
          propagates consequences of these into other paragraphs; it does
          not introduce either correction itself.
        - >-
          Consequence for arm (a)'s F_{p^4} implementation: the Executor's
          arm_a.py was NOT built independently of this edit as the
          disclosure implies ("independently corroborated... reached the
          same substantive conclusions independently"); the frozen text the
          Executor actually read from its own recorded start commit already
          explicitly instructed building F_{p^4} arithmetic and named the
          exact bug to avoid ("Conjugation on the Fp2 basis is NOT the
          p-power map of Fp4 and MUST NOT be substituted for it"). The
          arithmetic itself is independently verified CORRECT by this
          report regardless of provenance (see fp4-sqrt-and-frobenius-hand-
          verification above) -- this finding is about the disclosure's
          narrative of independence, not about whether the code works.
        - >-
          Consequence for DEV-1: execution_report.yaml's
          matched_ordered_base_control_summary states "OBSERVED RESULT DOES
          NOT MATCH THE CONTRACT'S FORCED VALUE... The forced value is
          'exactly two distinct cycle types {1^4, 2^2}, zero 4-cycles, zero
          2.1.1... types.'" and every per-cell row in execution_report.yaml
          carries `matches_forced_value: false`. That quoted "forced value"
          is the PRE-5f0d0dec1 wording. It is not the wording of
          specification.yaml as currently committed, NOR as it stood at the
          Executor's own recorded start commit d810634a6 -- both of which
          read "FORCED: exactly zero 4-cycles, and every realized type drawn
          from {1^4, 2.1.1, 2^2}." The observed data (independently
          recomputed above: types {1^4,2.1.1,2^2} realized, zero 4-cycles,
          at every cell) SATISFIES that clause exactly. `grep -rn
          "matches_forced_value" implementation/` returns nothing: this
          field is not computed anywhere in the code or present in
          raw-result.json; it is an assertion added only in the human-
          authored execution_report.yaml, and it does not match the
          specification text that governed the run.
      recommendation: >-
        (1) The Coordinator's ledger archive should record a corrected
        out-of-band-edit disclosure naming BOTH 5f0d0dec1 and a1269ac26,
        and correcting the false "ran against the ORIGINAL pre-edit text"
        claim. (2) DEV-1, as currently written in execution_report.yaml and
        implementation.md/ordered_base_control.py's docstring, should be
        read by Red Team/Coordinator as comparing observed data against a
        SUPERSEDED forced-value wording, not the wording actually in force;
        under the wording in force, the numeric result is NOT an anomaly.
        Whether the underlying CONTROL OBJECT choice (arm a's 4-point
        machinery on an ordered pair, versus the smaller literal Theorem-B
        object) is itself a valid reproduction of KN-FIND-a8990a Theorem B
        is unaffected by this finding and remains open for Red Team's
        Galois-theoretic adjudication.
    - id: F2
      severity: minor
      title: HEUR-WREATH-2 interpretation (DEV-2) is a declared, in-advance choice, not a silent substitution
      evidence: >-
        implementation.md item 2 and execution_report.yaml DEV-2 both state,
        before results are reported, that an F_{p^2}-rational-base exhaustive
        census (p^4 points) is infeasible within budget and was not costed
        in the contract's own cost_note; the substitute (split-vs-inert
        partition disjointness/coverage check on the existing F_p-base
        census) is declared as the reading used. This is disclosed
        appropriately per AGENTS.md rule 8 ("Unexpected observations must be
        recorded, not silently discarded") and core rule 2 (deviations
        documented, not silently absorbed); not a correctness defect.
      recommendation: none required; correctly disclosed.

  heuristic_validation_checks:
    - check: pre-registered prediction
      result: PASS
