validation_report:
  id: VAL-20260830-mono4c7479
  task_id: validator-mono-4c7479
  experiment_id: EXP-MONO-4c7479
  hypothesis_id: H-MONO-0b3def
  joint_owned: J1-correctness-and-consistency
  scope_note: >-
    This report renders a verdict ONLY on J1 (correctness and internal
    consistency of what was actually executed): Stage-0 symbolic identities,
    arm (a)/arm (b) independence, P1/P2/P3 recomputation, F_p^4 arithmetic
    correctness, determinism across the two runs, and budget/stopping-rule
    compliance. It does NOT adjudicate whether DEV-1 (the matched-ordered-
    base-control anomaly) or the class-density anomaly falsifies
    H-MONO-0b3def, nor the deep Galois-theoretic question of whether the
    control's chosen object is a faithful reproduction of KN-FIND-a8990a
    Theorem B -- both are explicitly the concurrent Red Team session's
    remit. Where this report's own recomputation bears on how DEV-1 should
    be READ (see finding F1 below), that is reported as a fact about the
    record's internal consistency, not as a re-adjudication of what DEV-1
    would mean for the hypothesis if it were real.

  snapshot_verification:
    snapshot_commit: 1dabdb7e227f817677faaac573bb4a4cd1020bef
    snapshot_commit_reachable_from_head: true
    snapshot_commit_message: >-
      snapshot(TASK-20260830-8c214e): bind EXP-MONO-4c7479 execution (2 runs,
      Stage 0-1) before independent review
    working_tree_matches_committed_snapshot: true
    method: >-
      git merge-base --is-ancestor 1dabdb7e2 HEAD (true); git status
      --porcelain on experiments/EXP-MONO-4c7479/ and
      ledger/hypotheses/H-MONO-0b3def.yaml (clean); recomputed sha256 of all
      44 non-null path_sha256 entries in
      coordination/tasks/TASK-20260830-8c214e/snapshot-receipt.json against
      the working tree -- 0 mismatches.
    verdict: >-
      This is a genuine Coordinator-committed snapshot, not a working-tree-
      only receipt. Refusal condition does not apply.

  artifact_checks:
    - check: all 44 declared archive_artifact_paths present and hash-matched
      result: PASS
      detail: 44/44 sha256 matches against coordination/tasks/TASK-20260830-8c214e/snapshot-receipt.json.
    - check: exactly 2 run directories exist (maximum_runs 2)
      result: PASS
      detail: "RUN-MONO-4c7479-20260830 and RUN-MONO-4c7479-20260831 only."
    - check: amendments/ directory empty (no versioned protocol_amendment ever filed)
      result: NOTED
      detail: >-
        experiments/EXP-MONO-4c7479/amendments/ is empty and has never been
        committed to. Both out-of-band edits to specification.yaml (see F1)
        were made as direct commits, not as protocol_amendment records, in
        violation of the frozen contract's own approval_status text ("Any
        later change...requires a versioned protocol_amendment...never a
        silent edit").

  metric_recomputations:
    - id: stage0-hand-rederivation
      description: >-
        Independent, from-scratch (pen-and-paper, cross-checked with a fresh
        symbolic expansion, NOT by re-reading stage0.py/mpoly.py) derivation
        of the three claimed identities using e1=t1+t2, e2=t1*t2:
        T2=(t1-t2)^2=e1^2-4e2; T1=-2[(t1+t2)(t1t2+A)+2B]=-2[e1(e2+A)+2B];
        T0=(t1t2-A)^2-4B(t1+t2)=(e2-A)^2-4Be1; c1=f(t1)+f(t2)=e1^3-3e1e2+Ae1+2B
        (via t1^3+t2^3=e1^3-3e1e2); c0=f(t1)f(t2)=e2^3+Ae2(e1^2-2e2)+B(e1^3-3e1e2)+A^2e2+ABe1+B^2
        (full expansion in s=e1,q=e2 carried out termwise). Then
        disc_T(S3)=T1^2-4*T2*T0 was expanded fully in s,q,A,B and shown
        term-by-term identical to 16*c0.
      result: CONFIRMED
      detail: >-
        All three T-coefficient forms and both c1, c0 forms match the
        contract's claimed formulas exactly; disc_T(S3) = 16*f(t1)*f(t2)
        confirmed as an exact polynomial identity in Z[t1,t2,A,B] by my own
        expansion (16q^3-32Aq^2+16A^2q+16Bs^3-48Bqs+16Aqs^2+16ABs+16B^2 on
        both sides). Then cross-checked against the actual committed
        stage0_transcript.json in both run directories: all 8 sub-checks
        (s3_is_exactly_quadratic_in_x3, T2/T1/T0_..._matches_e1e2_form,
        c1_equals_f_t1_plus_f_t2, c0_equals_f_t1_times_f_t2,
        disc_T_S3_equals_16_f_t1_f_t2, c0_claimed_scaled_16_equals_disc_T)
        report PASS, and are byte-identical between both runs (seed-free,
        as required).
    - id: p1-p2-p3-exhaustive-recompute-p101-A1-B1
      description: >-
        Full exhaustive independent recomputation of all 10,201 (e1,e2) in
        F_101^2 for the p=101,A=1,B=1 cell, using freshly-written code (never
        importing arm_a.py/arm_b.py/fp_common.py/polymod.py): a fresh
        Frobenius-permutation classifier (own Fp/Fp2/Fp4 tower, own square
        roots via brute-force tables) for "arm a", and a DELIBERATELY
        DIFFERENT algorithm for "arm b" -- direct biquadratic Z=Y^2
        substitution plus Legendre-symbol tests on the two Z-roots, rather
        than polymod.py's distinct-degree factorization -- so the two checks
        share no code path with each other OR with the repo's arms.
      result: CONFIRMED, ZERO MISMATCHES
      detail: >-
        stratum_i=101 (expected p), stratum_ii=0, stratum_iii=101 (expected
        p); P1_compared=9999 (matches execution_report.yaml exactly),
        P1_disagree=0; P2=8 distinct permutations found (explicit list:
        identity, 2 x sigma_i, sigma1_sigma2, 2 x block_swap_involution, 2 x
        four_cycle -- matches |D4|=8 structurally); P3 ratio 1.0 over all
        10,100 points off strata i/ii (recipe agreed with arm-a class at
        every point, including stratum iii). Row-by-row cross-check against
        the ACTUAL logged runs/RUN-MONO-4c7479-20260830/per_base_point_log/p101_A1_B1.ndjson:
        0 mismatches out of 10,100 stratum="none" rows between my
        independent classification and the Executor's real logged
        arm_a_class/arm_b_label for every single point.
    - id: p1-p2-recompute-p211-A1-B1
      description: >-
        Same fully independent method extended to the p=211,A=1,B=1 cell
        (all 44,521 points), to extend confidence to the second, larger
        prime named in the falsification_criterion (f) p-ladder.
      result: CONFIRMED, ZERO MISMATCHES
      detail: >-
        stratum_i=211, stratum_ii=0, stratum_iii=211 (all match); P1_compared=44101
        (matches execution_report.yaml exactly); P1_disagree=0; P2=8; 0
        mismatches against the actual logged p211_A1_B1.ndjson rows over all
        44,521 points.
    - id: five-point-hand-spotcheck-p101-A1-B1
      description: >-
        Per the task's minimum requirement, 5 concrete (e1,e2) pairs at
        p=101,A=1,B=1 spanning split-both-plus (identity), split-one-minus
        (sigma_i), split-both-minus (sigma1_sigma2), inert-chi(c0)=+1
        (block_swap_involution), inert-chi(c0)=-1 (four_cycle), found by a
        fresh search script and verified by independent frobenius-orbit
        computation, then cross-read against the actual ndjson rows.
      result: CONFIRMED (subsumed by the exhaustive recompute above, reported
        separately since it was the explicitly requested minimum)
      detail: >-
        (e1,e2)=(0,1): split, chi(f1)=chi(f2)=+1, predicted+observed=identity
        (row also flags stratum=iii, since 0^2-1+1=0 -- arm_a still classifies
        correctly there, arm_b's degenerate label is correctly excluded from
        P1 by the stratum-iii flag). (0,6): split, one -1, predicted+observed=
        sigma_i. (0,4): split, both -1, predicted+observed=sigma1_sigma2.
        (0,3): inert, chi(c0)=+1, predicted+observed=block_swap_involution.
        (0,2): inert, chi(c0)=-1, predicted+observed=four_cycle. All 5 rows
        read from runs/RUN-MONO-4c7479-20260830/per_base_point_log/p101_A1_B1.ndjson
        match my independent hand/script derivation exactly, including the
        recipe agreement flag.
    - id: fp4-sqrt-and-frobenius-hand-verification
      description: >-
        For (e1,e2)=(0,2), p=101,A=1,B=1 (the concrete inert chi(c0)=-1
        instance above): imported ONLY fp_common.py's Fp2/Fp4 classes
        (isolated, no other module) to obtain the code's actual
        fp4.sqrt_of_fp2_nonsquare(f1) output and fp4.e/fp4.s constants, then
        (a) verified f1's square root by multiplying the code's returned
        root using MY OWN independently-written Fp4 multiplication formula
        (not calling fc.Fp4.mul), and (b) independently re-derived and
        computed the genuine Frobenius formula frob(A,B)=(conj(A),conj(B)*s)
        with s=e^{(p-1)/2}, verified s^2 = conj(e)/e algebraically and
        numerically, and compared my own independent frob() against the
        code's fp4.frob() on the concrete y1.
      result: CONFIRMED
      detail: >-
        (a) my_fp4_mul(y1,y1) == (f1,(0,0)) exactly: y1=((0,0),(94,18)),
        y1^2 recovers f1=(1,91) precisely. (b) my_frob(y1) == fp4.frob(y1)
        == ((0,0),(31,22)) exactly; frob^2(y1), frob^3(y1) are both distinct
        from y1 and from each other, frob^4(y1)==y1 (genuine order-4
        behaviour on this element, necessary for a 4-cycle). Explicitly
        constructed the WRONG hypothesis -- naive Fp2-conjugation reapplied
        with NO s-twist -- and showed it gives frob^2(y1)==y1 (order <=2,
        CANNOT produce a 4-cycle), confirming the *s factor is not a
        cosmetic detail but the exact ingredient that makes frob genuinely
        order-4 on Fp4\Fp2 elements, and that the actual code is NOT the
        naive-conjugation bug. Also built the full 4-point permutation for
        this instance independently (own Fp4 tower, own labelled points) and
        confirmed it is a genuine single 4-cycle: 0->2->1->3->0, matching
        the ndjson row's arm_a_class=four_cycle exactly.
    - id: matched-ordered-base-control-full-recompute-p101-A1-B1
      description: >-
        Full independent recomputation of the matched-ordered-base control's
        cycle-type counts for p=101,A=1,B=1 (enumerating every split t-pair
        from (e1,e2), both orderings, off strata i/ii, via a freshly-written
        classify_from_t_pair-equivalent).
      result: CONFIRMED, EXACT MATCH
      detail: >-
        Independent recompute: {'1^4': 2652, '2^2': 2352, '2.1.1': 5096},
        n_instances=10100. Executor-reported (execution_report.yaml, same
        cell): count_1_4=2652, count_2_2=2352, count_2_1_1=5096,
        n_instances=10100. EXACT match on every count. The raw DATA behind
        DEV-1 is correct and reproducible; see finding F1 for what this
        implies about the DEV-1 anomaly's framing, which is a separate
        question from the data's correctness.

  control_checks:
    - control: arm-independence (approval_requirements item 3)
      result: PASS
      detail: >-
        arm_a.py imports only `fp_common`; grep confirms no occurrence of
        `c1`, `c0`, `arm_b`, or `polymod` anywhere in arm_a.py. arm_b.py
        imports only `polymod`; grep confirms no occurrence of `t1`, `t2`,
        `f_of`, or `lift_y` anywhere in arm_b.py. fp_common.py (shared by
        both) contains only generic Fp/Fp2/Fp4 field arithmetic with no
        notion of t1/t2/c1/c0, matching the contract's own "shared mulmod"
        carve-out. run_experiment.py calls `arm_a.classify_point(...)` and
        `arm_b.classify_point(...)` as two independently-produced results
        and only COMPARES them (`arm_a_shape == arm_b_label`) -- it never
        feeds one arm's intermediate into the other. recipe.py IS fed
        quantities from both arms (f1,f2 from arm a; c0 from arm b), which
        the contract explicitly permits since it is declared a third,
        non-independence-bound check, not one of the two arms being tested
        for agreement. The exhaustive zero-mismatch recomputation above
        (fresh code, structurally different arm-b algorithm) additionally
        rules out the specific risk named in the task ("both arms silently
        agree because of a shared bug") -- a shared-bug artifact would not
        also reproduce correctly against a THIRD, differently-coded
        classifier.
    - control: excluded-strata accounting (approval_requirements item 4)
      result: PASS
      detail: >-
        Stratum i (e1^2-4e2=0) counted separately, exactly p at every cell,
        both runs, independently reproduced (101 at p=101, 211 at p=211).
        Stratum ii (f(t1)f(t2)=0) counted separately with f's actual root
        count reported per curve, consistent (0/1/3 roots -> 0/p/3p points
        exactly) -- independently reproduced for p101_A1_B1 (0 roots -> 0
        points) and p211_A1_B1 (0 roots -> 0 points). Stratum iii
        (e1^2-e2+A=0) counted separately, exactly p at every cell, both
        runs, independently reproduced. P1 excludes stratum iii only (as the
        contract specifies -- arm b is invalid there by construction, arm a
        is not); P3 is computed off strata i/ii only, per its own text.
        Overlaps (0-3 points) reported per cell, not double-counted.
    - control: matched-ordered-base control data integrity
      result: PASS (data); see finding F1 for the anomaly-framing question
      detail: See metric_recomputations id matched-ordered-base-control-full-recompute-p101-A1-B1.
    - control: factor-base-sublocus control
      result: PASS (not independently recomputed at full scale; spot-checked
        conceptually)
      detail: >-
        100% identity reported at every cell, both runs; declared
        non-discriminating in advance and not reported as an independent
        finding, per the invalidation_rules. This is a re-filter of already-
        verified Stage-1 data (chi(f1)=chi(f2)=+1 forces "identity" by the
        already-confirmed S6 recipe), so it is not separately re-derived
        here beyond noting internal consistency with the P3 recomputation
        above (which already exhaustively confirms recipe correctness,
        including on this exact sublocus, for the two cells recomputed).
    - control: random-quartic S_4 null control
      result: PASS
      detail: >-
        Independently recomputed the binomial-SE band check for
        p=101/run-20260830's histogram ({'1^4':88,'2.1.1':506,'2^2':235,
        '3+1':673,'4':498}, n=2000) against forced densities
        (1/24,1/4,1/8,1/3,1/4): all 5 deviations (4.67, 6.0, -15.0, 6.3,
        -2.0 raw counts vs expected 83.3/500/250/666.7/500) fall within 3
        binomial standard errors (8.94/19.36/14.79/21.08/19.36 respectively)
        by direct computation. 3+1 is emitted at every (prime,run) cell (4/4),
        satisfying the instrument-adequacy gate. This is the null-object
        control required by docs/inventor-protocol.md S3: it is drawn from
        the same shape (uniform random monic squarefree quartic) with no
        elliptic-curve structure, classified by literally the same code path
        as the Semaev arm, and its passing licenses interpreting arm (b)'s
        output at all. It is NOT itself the "parameter meant to destroy the
        signal" control (there is no such decay-parameter test in this
        toy-scale exhaustive census; see limitations).
    - control: determinism across the two replication runs
      result: PASS
      detail: >-
        Independently diffed (not merely re-read the Executor's own
        determinism_check claim): per_base_point_log/p211_A2_B3.ndjson byte-
        identical (diff empty); stage0_transcript.json byte-identical;
        curve_construction_transcript.json byte-identical; raw-result.json
        identical after stripping master_seed, total_wall_seconds,
        peak_rss_bytes, random_quartic_control, and per-cell wall_seconds
        (the only documented run-varying fields). sha256 of all 6
        per_base_point_log files matched exactly across both run
        directories (computed independently via shasum). Random-quartic
        histograms DIFFER between runs as required (e.g. p=101 '1^4': 88 vs
        78), and both runs still emit 3+1 and pass the SE band.

  budget_and_stopping_rule_checks:
