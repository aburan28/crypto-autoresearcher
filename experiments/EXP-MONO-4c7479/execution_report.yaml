  protocol_deviations:
    - id: DEV-1-ordered-base-control-object
      description: >-
        The matched-ordered-base control was implemented per the literal
        text of `arms_and_controls.matched_ordered_base_control` (arm (a)'s
        own four-point Frobenius machinery, fed the ordered (t1,t2) pair
        directly). Read against the cited finding KN-FIND-a8990a, Theorem B
        concerns a different, smaller object (the two roots of
        S_3(t1,t2,T) under a regular Z/2 action, for which "no single-
        sign-flip type" is close to definitional). This implementation
        choice is documented in `implementation.md` item 1 and in
        `implementation/ordered_base_control.py`'s own docstring. The
        observed result (below) does not match the contract's forced value
        under this literal reading.
      resolution: not resolved here; reported as an anomaly for Coordinator/
        review disposition, per falsification_criterion (e)'s own framing
        ("a falsifier of the record's own baseline-embedding reproduction
        check, not merely of this control").
    - id: DEV-2-heur-wreath-2-interpretation
      description: >-
        "HEUR-WREATH-2 check: realized-class count over F_{p^2} vs F_p" is
        read as a partition check between the split-regime (F_p-rational
        t-values) and inert-regime (F_{p^2}-only t-values) subpopulations of
        the SAME F_p-base census, not a separate exhaustive census over an
        F_{p^2}-rational base (p^4 points, infeasible within the 1200s/1GB
        budget and not costed in the contract's own cost_note). See
        `implementation.md` item 2.
      resolution: interpretation declared in advance of running; result
        reported below under `heur_wreath_2_check` per cell.
    - id: DEV-3-random-quartic-counter-reset
      description: >-
        The random-quartic control's per-coefficient rejection-sampling
        `counter` is reset to 0 at the start of each of the 4 coefficients'
        own draw sequence (not carried across coefficients), per
        `implementation.md` item 3. The seed rule text does not explicitly
        state either convention.
      resolution: declared choice; does not affect reproducibility given
        the exact rule is now recorded here and in the code.

