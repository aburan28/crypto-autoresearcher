  class_density_summary: >-
    identity and sigma1_sigma2 fall OUTSIDE the 3-binomial-standard-error
    band (against forced 1/8, 1/8) at 5 of 6 cells (all except p=101 curve
    A=1,B=1, which is within band on all 5 classes); sigma_i,
    block_swap_involution, and four_cycle are within band at every cell
    (against forced 1/4, 1/4, 1/4). Deviations range up to ~10.2 binomial
    standard errors (p=211, A=4, B=1, identity class). This is reported as
    a raw observation with no interpretation: the frozen contract's own
    falsification_criterion (f) names "a class-density deviation of order
    p^{-1/2} rather than O(1/p)" as the pattern of concern, and explicitly
    notes the two-prime ladder used here (with DIFFERENT curves at each
    prime, not the same curve reduced at two primes) "gives limited but
    nonzero power to see this" -- no O(1/p) vs O(p^{-1/2}) determination is
    made here; that comparison requires the reviewer's judgment against the
    exact wording of the falsification criterion.

  matched_ordered_base_control_summary: >-
    OBSERVED RESULT DOES NOT MATCH THE CONTRACT'S FORCED VALUE, at every
    cell, both runs (deterministic, bit-identical across runs). The forced
    value is "exactly two distinct cycle types {1^4, 2^2}, zero 4-cycles,
    zero 2.1.1 (single-sign-flip) types." All 6 cells instead realize
    THREE cycle types (1^4, 2.1.1, 2^2), with 2.1.1 the largest bucket at
    every cell (e.g. p=211 A=1,B=1: 1^4=12210, 2.1.1=22200, 2^2=9900, zero
    4-cycles). Zero 4-cycles IS observed at every cell (matching that part
    of the forced claim). See DEV-1 above: this may reflect an
    implementation-vs-intended-object ambiguity in the control's own text
    rather than a finding about H-MONO-0b3def; reported here as a REQUIRED
    ANOMALY per falsification_criterion (e)'s own framing, not resolved,
    not interpreted, not treated as evidence against or for the hypothesis.

  factor_base_sublocus_control_summary: >-
    100% identity class at every cell, both runs (forced: 100%). Per the
    frozen contract, NOT reported as an independent finding -- it is a
    declared-in-advance non-discriminating consistency check on the
    character-triple recipe.

