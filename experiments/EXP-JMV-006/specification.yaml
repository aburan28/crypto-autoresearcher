experiment:
  id: EXP-JMV-006
  hypothesis_id: H-JMV-002
  version: 1
  title: Equidistribution vs equal cost - full-level census of dlog cost proxies within one isogeny level.
  status: draft
  objective: >-
    Corollary 1.2 proves cost equality UP TO the reduction's polylog overhead. It does not
    prove that dlog cost is constant across a level. Measure whether the level-internal spread
    of per-curve cost proxies exceeds measurement noise, at a scale where an ENTIRE level can
    be enumerated.
  inputs:
    field_sizes: "p ~ 2^18 .. 2^22, chosen so a full level has h ~ 500-2000 curves"
    level: one fixed level per isogeny class (all curves with the same End(E))
    enumeration: every curve in the chosen level, not a sample
  controls:
    - "Noise floor (the control that decides the experiment): same-curve seed-to-seed variance of each proxy. The level-internal spread must beat this to mean anything."
    - "Variance band: random curves of DIFFERENT order, giving the unrelated-curve spread."
    - "Label-permutation test: shuffle curve labels and recompute the spread statistic, so significance comes from a null distribution rather than from eyeballed extremes."
    - "Positive control: a curve with deliberately smooth group order must show a visibly lower rho cost, confirming the proxy can detect a genuine difficulty difference."
  independent_variables: [curve within the level]
  metrics:
    primary:
      - "exact Pollard-rho iteration count under a FIXED, curve-independent partition rule, averaged over many seeds"
      - "m=3 Semaev decomposition yield over a canonically defined factor base"
    secondary: [j-invariant, group structure, permutation-test p-value, spread / noise-floor ratio]
  replication:
    seeds: [20260726, 20260727, 20260728, 20260729, 20260730, 20260731, 20260732, 20260733]
    independent_instances: 8
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 16
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
    - Fixed seed count per curve, fixed in advance; no adaptive extension for curves that look like outliers.
  invalidation_rules:
    - A curve-dependent rho partition rule invalidates the run; the partition must not depend on curve coefficients, or the proxy measures the rule rather than the curve.
    - Incomplete level enumeration invalidates the census (a partial level is a sample and loses the whole point).
    - Failure of the smooth-order positive control invalidates the proxy.
  success_criterion: >-
    A full-level distribution for each proxy with a permutation-test p-value, and a spread /
    noise-floor ratio.
  falsification_criterion: >-
    Level-internal spread lies within same-curve seed noise, i.e. "same difficulty" holds at
    the constant-factor level too and gap G2 closes at toy scale.
  required_artifacts: [runs/<id>/manifest.yaml, raw.json, stderr.txt, analysis.md, level_census.csv]
  claim_tier: toy
  claim_boundary: >-
    Toy tier. A negative result says nothing about P-256 or any cryptographic curve, and the
    record must state that. A positive result (measurable spread) would NOT contradict
    Theorem 1.1 - a spread smaller than the reduction overhead is fully compatible with it -
    and must not be written up as a counterexample to JMV.
  relation_to_prior:
    - "EV-ISO-001 sampled 3 isogeny neighbours of one base curve and found yields inside the control band. This is the whole-level version with a proper null distribution and can detect a spread a 3-point sample cannot. It must cite EV-ISO-001 and explicitly report agreement or conflict."
  notes:
    - "If a spread is found, EXP-JMV-007 (cross-level stratification, design only, gap G3) becomes worth scheduling. If not, EXP-JMV-007 is uninformative and should stay deferred."
  assigned_to: executor
  approved_by: null
