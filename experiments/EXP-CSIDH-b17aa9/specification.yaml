# EXP-CSIDH-b17aa9
# Factor-size arithmetic. No sieve.
# Approved by DEC-20261002-53fa67.
experiment:
  id: EXP-CSIDH-b17aa9
  hypothesis_id: H-CSIDH-0b4446
  source_idea: IDEA-20260926-81ae2d
  question_id: RQ-CSIDH-64343f
  version: 1
  title: Factor-size arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-53fa67
  objective: >-
    Check the product of the five integers, the logarithm bounds, and
    the two cross gaps of the written ratio.
  inputs:
    factors:
      - 3
      - 37
      - 1407181
      - 51593604295295867744293584889
      - 31599414504681995853008278745587832204909
    product: 254652442229484275177030186010639202161620514305486423592570860975597611726191
    small_prime: 1407181
    trial_bound: 1186
    ratio_num: 1345
    ratio_den: 2571
    low_thousandths: 723
    high_thousandths: 724
    low_gap: 1063741
    high_gap: 2656496
    log_n_low_num: 2571
    log_n_low_den: 10
    log_n_high_num: 2572
    log_n_high_den: 10
  controls:
    - >-
      The five integers multiply to the stated product. Reporting
      another product invalidates the run.
    - >-
      The cross gap above 723/1000 is 1063741 and the cross gap below
      724/1000 is 2656496. Reporting the ratio as exactly 723/1000
      invalidates the run.
    - >-
      The product logarithm lies strictly above 2571/10 and strictly
      below 2572/10. Reporting it as at most 2571/10 invalidates the
      run.
    - >-
      1407181 is prime. Reporting a proper divisor invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {product, ratio}
    - route in {multiplication, powers}
  metrics:
    primary:
      - product
      - low_gap
      - implementations_agree
    secondary:
      - high_gap
      - log_n
      - small_prime
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The cross gap above 723/1000 is 1063741.
    formula: >-
      Compare 1345 times 1000000 with 2571 times 723 squared, and with
      2571 times 724 squared. The five-integer product is compared with
      the stated integer. The logarithm bounds are tenth-power
      comparisons with powers of two.
    source: >-
      IDEA-20260926-81ae2d states the factors and the ratio 0.723, read
      2026-10-02. The products were computed in this design session.
      That computation is not a run. No sieve was run.
  scale_relevance:
    tier: toy
    justification: One integer product and two cross gaps. No transfer to a sieve.
    correspondence: null
  tail_checks:
    - The 135-bit factor bound, strictly above 269/2, is required. A check that stops at the three small factors is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the product disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The product is not the stated integer.
    - The ratio is reported as exactly 723/1000.
    - The product logarithm is reported as at most 2571/10.
    - 1407181 is reported as composite.
    - A sieve is run or a security level is stated.
  success_criterion: >-
    Both runs agree that the five integers multiply to the stated
    product, that the cross gaps are 1063741 and 2656496, and that the
    product logarithm lies strictly above 2571/10 and strictly below
    2572/10.
  falsification_criterion: >-
    The runs agree, the five integers multiply to the stated product,
    and the cross gap is not 1063741.
  required_artifacts:
    - experiments/EXP-CSIDH-b17aa9/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CSIDH-b17aa9/runs/<RUN-ID>/command.txt
    - experiments/EXP-CSIDH-b17aa9/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CSIDH-b17aa9/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CSIDH-b17aa9/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CSIDH-b17aa9/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any sieve, quantum circuit, or security verdict.
    - Any claim that the two large factors are prime.
    - Any measured query count.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
