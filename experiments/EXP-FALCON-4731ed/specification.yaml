experiment:
  id: EXP-FALCON-4731ed
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-e5c333; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-e5c333
  question_id: RQ-FNDSA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Flip-rate counting between an exact-arithmetic and an emulated p-bit Klein sampler replayed
    on shared randomness tapes, sweeping mantissa width and dimension, with determinism nulls and
    a shifted-threshold positive control.
  objective: 'The uncertainty a run reduces is whether the coupling route gives a usable, cheaply
    measurable upper bound on sampler divergence at precisions and dimensions where the divergence
    itself cannot be measured. In parts: (i) whether two independently implemented samplers can be
    driven from a shared bit tape with exact replay determinism, evidenced by both null arms reading
    exactly zero flips over 10^7 tapes and by the tape-reuse control being bitwise identical; (ii)
    what the flip rate is as a function of mantissa width and lattice dimension, and whether the fitted
    law matches the registered geometric-and-multiplicative form with a stable boundary-density constant
    and a decision count that tracks the instrumented one; (iii) at d = 4, where the companion enumeration
    instrument supplies the true total variation, how loose the coupling bound actually is, expressed
    as the ratio of flip rate to total variation. A run does not reduce uncertainty about deployed
    parameters, about exploitability, or about whether any flip is observable to an adversary who
    does not hold the tape, and the procedure contains no step that could be read as addressing those.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: for the specific pair of sampler
      implementations and toy bases built in this run, at d in {2, 4, 8, 16}, sigma in {1.5, 2.0}
      and p in {12, 16, 20, 24, 28, 32}, the flip rate takes the reported values with the reported
      confidence intervals, its dependence on precision and dimension has the reported fitted form,
      and at d = 4 the ratio of flip rate to enumerated total variation is the reported number. WHAT
      DOES NOT FOLLOW: nothing about FN-DSA parameter sets, nothing about any released implementation,
      nothing about whether a flip is detectable from a signature, nothing about the number of signatures
      needed for any attack, and nothing about security. A flip rate bounds a distributional distance
      from above; it is not a distance, not a distinguisher, and not a cost.'
  inputs:
    procedure: 'STAGE 0, cost under one hour: freeze bases, widths, precision grid, tape length, tie-handling
      rule and the output-level flip definition. STAGE 1, cost about two days of implementation: build
      the tape abstraction and rewrite both samplers as pure functions of it. STAGE 2, cost minutes:
      run the tape-reuse determinism control on 10^5 tapes, requiring bitwise identical decisions.
      STAGE 3, cost about one hour: run both null arms over 10^7 tapes each; HALT AND REPORT INSTRUMENT
      FAILURE IF EITHER IS NONZERO. STAGE 4, cost about one hour: run the shifted-threshold positive
      control at three shift sizes. STAGE 5, cost about one day of compute: sweep precision over 12
      through 32 crossed with dimension over 2, 4, 8 and 16 at 10^7 tapes per cell, five bases per
      cell. STAGE 6, cost about one hour: at d = 4 only, run the companion enumeration instrument
      and form the flip-rate to total-variation ratio. STAGE 7, cost under an hour: fit the registered
      law and report the boundary-density constant, decision count, slopes and all confidence intervals.'
    instrument: Pure Python 3 for the sampler pair and the tape abstraction, with p-bit arithmetic
      emulated over Python integers using the same emulator validated in the companion enumeration
      entry, so a single validated emulator serves both. The tape is generated by the standard library
      secrets module from a recorded seed and expanded deterministically. numpy is used only for confidence
      intervals and least-squares fits. Run manifests through harness/runner.py. No Sage, no external
      computer algebra, no network.
    parameters: 'Dimensions d in {2, 4, 8, 16}. Widths sigma in {1.5, 2.0}. Mantissa widths p in {12,
      16, 20, 24, 28, 32}. Tapes per cell 10^7, giving relative error near 30 percent at a flip rate
      of 1e-6 and near 3 percent at 1e-4. Five independently generated toy bases per (d, sigma) cell.
      Cells: 4 x 2 x 6 x 5 = 240 signal cells, plus two null arms at 10^7 tapes each and three positive-control
      shift sizes. Determinism control at 10^5 tapes. Injected threshold shifts in {1e-2, 1e-3, 1e-4}.'
  controls:
  - 'Null arm one: identical p-bit implementation against itself under leaf-order relabeling, must
    read exactly zero flips over all tapes.'
  - 'Null arm two: exact against exact under two equivalent exact evaluation orders, must read exactly
    zero.'
  - 'Positive control: one decision threshold shifted by a known amount, flip rate must be proportional
    to that shift across 1e-2, 1e-3 and 1e-4.'
  - 'Cross-instrument control at d = 4: compare the measured flip rate against the enumerated total
    variation from the companion entry and confirm the coupling inequality direction holds.'
  - 'Tape-reuse control: rerun a fixed subset of 10^5 tapes and confirm bitwise identical flip decisions,
    establishing replay determinism.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null arm replays TWO INSTANCES OF THE SAME p-bit implementation
    on the same tapes, differing only in an irrelevant relabeling such as loop order over already-independent
    leaves. The measured flip rate must be exactly zero over all 10^7 tapes: any nonzero reading means
    the replay harness is not deterministic and every signal reading is an artifact of unrepeatable
    state. A second null replays exact against exact under two equivalent exact evaluation orders
    and must also read exactly zero. A positive control replays the p-bit implementation against a
    version with one decision threshold shifted by a known relative amount and must read a flip rate
    proportional to that shift.'
  independent_variables:
  - mantissa width p
  - lattice dimension d
  - Gaussian width sigma
  - toy basis index
  metrics:
    primary:
    - flip rate with Clopper-Pearson interval
    - fitted slope of log2 flip rate against mantissa width
    - fitted proportionality of flip rate to the instrumented decision count
    - ratio of flip rate to enumerated total variation at d = 4
    secondary:
    - per-depth first-divergence profile
    - instrumented decisions per signature
    - tape replay throughput
    - fraction of flips attributable to tie cases
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The flip rate as a joint function of mantissa width and the instrumented number of decisions
      per signature.
    formula: f(p, L) = K * L * 2^(-p), with K the boundary-density constant, defined as the average
      probability density of the decision variable evaluated at its threshold in units of one unit
      in the last place. K is fitted once at d = 4 and p = 20 and then held fixed for every other
      cell, so every other cell is a prediction rather than a fit.
    source: Pre-registered in the parent proposal IDEA-20260816-e5c333 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at d in {2, 4, 8, 16} against a deployed dimension of 1024 or 2048, at
      sigma in {1.5, 2.0} against a deployed sigma of order 165, and at mantissa widths 12 through
      32 against a deployed 53. TRANSFER ASSUMPTION, STATED AND NOT ASSUMED TRUE: the registered law
      is multiplicative in the decision count and geometric in precision, which if it held would extrapolate,
      but this contract performs no extrapolation and reports no extrapolated number. The dimension
      range spans a factor of eight in decision count precisely so multiplicativity is tested rather
      than assumed.'
    correspondence: null
  tail_checks:
  - Report the per-depth first-divergence profile and flag any cell where more than half the flips
    originate at a single depth, indicating one dominant decision rather than a distributed effect.
  - Separate flips arising from exact ties at a threshold and report their fraction; a tie-dominated
    flip rate is not a precision measurement.
  - Check the Clopper-Pearson lower bound is above zero in every cell reported as nonzero, and report
    cells with zero observed flips as upper bounds only.
  - At d = 4, verify the coupling inequality direction against the enumerated total variation in every
    precision cell where both are available.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt and report instrument failure if either null arm is nonzero at STAGE 3.
  - Halt any cell after 10^7 tapes regardless of whether a flip was observed, and report a one-sided
    upper bound rather than extending the budget to manufacture a point estimate.
  - Halt the p = 32 column if fewer than 10 flips are observed across all bases, and report the achieved
    precision reach as a measured limit.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both null arms read exactly zero, the determinism control is bitwise identical,
    the positive control is proportional to the injected shift, and the flip rate is estimated with
    a Clopper-Pearson relative width below 50 percent in at least 80 percent of the signal cells.
  falsification_criterion:
  - A nonzero null arm or a non-identical determinism control.
  - Positive control flip rate not proportional to the injected shift within a factor of two.
  - Fitted slope of log2 f against p outside the interval from -1.15 to -0.85.
  - Flip rate failing to scale with the instrumented decision count across the four dimensions, within
    a factor of two.
  - Measured flip rate below the enumerated total variation at any d = 4 cell, violating the coupling
    inequality.
  - More than half of all flips attributable to exact ties, meaning the measurement is of tie-handling
    rather than of precision.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-e5c333
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The definition of a decision, and hence of the count L, must be pinned to specific lines of the
    implementation before freezing; the record uses it as if unambiguous and it is not.
  - The tie-handling rule at decision thresholds is unspecified and directly determines whether a
    tie-dominated flip floor exists.
  - The boundary-density constant is defined loosely as a density in units of one unit in the last
    place; the Coordinator must fix its exact definition and estimator.
  - Whether this record should be filed independently or merged as an amendment to IDEA-20260813-d50a10
    is a Coordinator decision this record cannot make for itself.
