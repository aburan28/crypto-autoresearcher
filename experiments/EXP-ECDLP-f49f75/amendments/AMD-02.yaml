protocol_amendment:
  id: AMD-02
  experiment_id: EXP-ECDLP-f49f75
  filed: '2026-10-15T07:20Z'
  filed_before_affected_data: true
  reason: >-
    Launcher defect found by the frozen positive control (planted decomposition
    must lie in the Groebner variety). For m = 2 the target coordinate x(T) was
    written into the Singular script as a bare integer, so x(T)^2 was evaluated
    in Singular 32-bit int arithmetic and overflowed for p > 46340. In
    RUN-ECDLP-f49f75-01 the Groebner arms (A, B, C; std and slimgb) of cells
    m = 2, L = 8, 9, 10, 11 (p = 17..23 bits) therefore solved a wrong
    polynomial: planted_in_variety fell to 2/4, 1/4, 0/4, 0/4. Cells m = 2,
    L <= 7 (p < 2^15.5; every planted check passed) and the enumeration arm E
    (pure Python) are unaffected. m = 3 never squares a bare integer
    (x(T) only multiplies ring variables), so RUN-ECDLP-f49f75-02 is
    unaffected; its planted checks are the confirming control.
  invalidation: >-
    Per the frozen invalidation rule, the Groebner arms of RUN-01 cells
    m = 2, L = 8..11 are invalid, including the arm-A retirement at L = 9.
    The rows stay in RUN-01 unedited; analysis excludes them.
  change: >-
    Launcher fix: every numeric constant in the summation polynomial is passed
    as number(...) (field arithmetic). Verified before re-running on the
    failing instances (m = 2, L = 8, 9: planted_in_variety true for arms B, C)
    and as a regression on m = 2, L = 5 and m = 3, L = 3 (unchanged timings,
    planted true). Re-execute cells m = 2, L = 8..11 as RUN-ECDLP-f49f75-03
    with amendments/trial-plan-run03.json (same seeds, arms, solvers, timeout,
    instance counts, stopping rule), after RUN-02 finishes so the runs do not
    share cores.
  thresholds_changed: false
  success_or_falsification_criteria_changed: false
