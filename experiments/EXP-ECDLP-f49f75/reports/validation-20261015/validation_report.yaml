      falsification_criterion_met: true
      falsification_disjuncts: {A_at_or_above_B_ge_80pct_both_solvers: true, m3_A_retired_no_later_than_B_and_C: true}
    - name: independent re-execution (HEAD launcher, idle host, same seeds)
      cells: [m2L3, m2L4, m2L5, m2L6, m2L7, m2L8, m3L3, m3L4]
      deterministic_fields_compared: 2656
      mismatches: 0
      timing_ratio_rerun_over_recorded: >-
        m3L3 0.95-1.15; m3L4 0.89-0.99; m2L8 (RUN-03) 0.95-1.15; RUN-01 cells >=30 ms 0.94-1.10 except m2L7 B std 0.73
        and A slimgb 0.81
