      result: pass
      evidence: 248/248 non-excluded planted ok Groebner results true (A 31+31, B 47+47, C 46+46); 0 random-target rows carry the flag
      note: 3 degenerate planted targets (m2L3 inst1 A/B/E, m2L3 inst2 C, m2L4 inst0 C) not resampled
    - name: positive control fired on the defect
      result: pass
      evidence: RUN-01 m=2 L=8..11 planted true fell to A 2/4, B 2/4, C 3/4 (L8); B 1/4, C 0/4 (L9); 0/4 (L10, L11)
    - name: negative/null control (arm C) and encoding control (arm B)
      result: pass
      evidence: B/C median ratio 0.93-1.27 across all timed cells and both solvers
    - name: dynamic range
      result: pass
      evidence: B std m=2 L=6..11 7.5 -> 107962 ms; m=2 -> m=3 jump at L=4 1 -> 5049 ms; cells m=2 L<=5 at 1 ms resolution
    - name: instrument control (std and slimgb)
      result: pass
      evidence: both solvers give the same direction in every joint cell
    - name: launcher encodes the fibre x(R+<K>)
      result: pass
      evidence: >-
        launcher asserts present; independent Velu/EC recomputation for 18 instances matches steps, c, V; brute-force
        F_p fibre == V; eliminating w's from arm A's chain ideal gives arm B's degree-2^L polynomial (m2L5, m2L7, m3L4);
        vdim(A)==vdim(B) on 94/94 pairs
    - name: overflow mechanism and m=3 invariance (AMD-02)
      result: pass
      evidence: >-
        Singular-evaluated S differs pre-fix vs fixed at m=2 L=8 inst1, L=9, L=11; identical at m=2 L=7, L=8 inst0 and
