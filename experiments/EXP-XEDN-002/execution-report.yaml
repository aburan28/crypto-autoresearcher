  runs_budgeted: 6

  # ------------------------------------------------------------------ budget
  budget_usage:
    wall_clock_seconds_used_by_runs: 992.142
    wall_clock_seconds_budget: 5400
    largest_single_run_seconds: 954.263
    per_run_seconds_budget: 1800
    cpu_hours_used: 0.90
    cpu_hours_budget: 2
    peak_memory_gb_used: 0.44          # RUN-XEDN-002-C, 447.8 MB
    memory_gb_budget: 4
    runs_used: 5
    maximum_runs: 6
    unrecorded_probe_time: >-
      sizing and throughput probes were run before the recorded runs (in /tmp,
      not artifacts, small-p only) to measure predicate throughput and check the
      closed forms at p = 5, 7. They were not individually timed, so no number is
      reported for them; they are not part of any run record and none of their
      output is used as evidence. Recorded-run wall clock (992 s) plus any
      plausible probe allowance stays well inside the 5400 s budget.
    censoring: >-
      no work unit was censored by a timeout or a memory cap. The one budget-driven
      scope reduction is arm B's coverage at p = 11 and p = 13 (see
      protocol_deviations), which was planned before execution and recorded in the
      run's planned_coverage, not truncated mid-run.

  # ------------------------------------------------------------- deviations
  protocol_deviations:
    - id: DEV-1
      what: >-
        Arm B was contracted as exhaustive over the FULL slot space at
        p in {5, 7, 11, 13}. Full-space exhaustion with the frozen predicate was
        achieved at p = 5 and p = 7 only. At p = 11 and p = 13 the run exhausted
        complete b-marginals for 12 and 6 explicitly listed monic quadratics
        (9.92% and 3.55% of the slot space).
      why: >-
        the full spaces need about 11,000 and 51,000 CPU seconds at the measured
        throughput, over the 1800 s per-run and 2 CPU-hour budget. The task
        instruction explicitly permitted a complete, exactly specified sub-slice
        with the coverage stated.
      mitigation: >-
        the full spaces at p = 11 and p = 13 are covered exactly by arm C's
        independent section fibering (no frozen-predicate call), whose totals equal
        N_hit(p) exactly; and the enumerated marginals confirm the per-x invariance
        the closed form predicts. No partial enumeration is described as
        exhaustive anywhere in the artifacts.
      residual_risk: >-
        a frozen-predicate anomaly confined to an untested x at p = 11 or 13 would
        not have been seen by arm B. Control 1 and arm C bound this: 596 million
        dual classifications with zero disagreements, and arm C's independent
        totals match.
    - id: DEV-2
      what: >-
        Arm C was contracted for p in {5, 7, 11} with 13 only if it fit the memory
        cap. It completed p = 13 as well (peak 447.8 MB against the 4 GB cap), so
        the histogram covers one size more than the minimum.
      why: the vectorized accumulation into a preallocated bincount array is small.
      mitigation: none needed; this is extra coverage, not reduced coverage.
    - id: DEV-3
      what: >-
        A fifth run record exists for arm A. RUN-XEDN-002-A was written with an
        unverified inference.resolved_model, and RUN-XEDN-002-A2 re-ran the same
        deterministic script with the identifier verified from the harness.
      why: >-
        run records are immutable, so the correction had to be a new run ID rather
        than an edit.
      mitigation: >-
        both records are retained; the defective one is listed under runs.invalid
        with its reason, and analysis.md cites A2.
    - id: DEV-4
      what: >-
        Control 2 uses a planted surface whose b has degree 5, so it sits outside
        the frozen deg b = 6 family.
      why: >-
        the planted instance was fixed by EXP-XEDN-001 and the contract names it
        explicitly; it could not be changed without altering a frozen input.
      mitigation: >-
        reported as a deviation in the control verdict and in analysis.md; the
        control is treated as a test of the enumerator and predicate, never as a
        member of the census population.
    - id: DEV-5
      what: >-
        The specification's iso-triviality control expects the count of iso-trivial
        surfaces to be "exactly zero for this family". Under the standard
        definition (constant j) the count is the whole family.
      why: a(t) = 0 forces j = 0 identically; this is a property of the frozen family.
      mitigation: >-
        both readings are reported with their counts and reasoning; nothing was
        excluded; the discrepancy is recorded as a finding for the Coordinator
        rather than resolved by the executor.
    - id: DEV-6
      what: >-
        An artifact self-check (implementation/verify_artifacts.py) was added
        beyond the contracted arms. It re-derives the closed forms without
        importing the experiment library, validates the run-record schema,
        cross-checks every analysis.md table against raw-result.json, and
        re-executes a sample of the recorded work.
      why: to make the executor completion gate mechanically checkable.
      mitigation: >-
        it is a check on the reproduction package, not a measurement: it has no run
        record, produces no evidence, and consumed no run slot. Reproduce with
        `python3 experiments/EXP-XEDN-002/implementation/verify_artifacts.py --reproduce`
        (reported 259 checks, 0 failures at commit e18c9bc).

  # ------------------------------------------------------------ observations
  observations:
    - >-
      N_slots(p) = (p-1)*p^8 and N_hit(p) = p^2*(p^4 - 3p^3 + 2p^2 + p - 1)/2, so
      P_lift(p) = (1 - 2/p + p^-3)/(2p^3) exactly.
    - >-
      The exact finite-size exponent rises monotonically from 2.509078 (5->7) to
      2.996544 (431->809); the limiting exponent is 3 exactly, with constant 1/2.
    - >-
      Exhaustive frozen-predicate enumeration matches the closed form exactly on
      every enumerated slice: full space at p = 5 and 7, complete b-marginals at
      p = 11 and 13. 596,268,874 slots dually classified, 0 disagreements.
    - >-
      P[>= 9 distinct degree-(2,3) hit slots] is exactly 0 at p = 5, 7, 11 and
      1.346645e-06 at p = 13 (78 of 57,921,708 surfaces), below p^-1 at every
      computed size.
    - >-
      Exactly p^2 slots per size are the excluded y = 0 degenerate section; adding
      them changes P_lift by O(p^-4) relative and changes no exponent.
    - >-
      The frozen predicate is exactly "nonzero perfect square with squarefree
      root"; dropping the squarefree requirement multiplies P_lift by
      (p^4-2p^3-1)/(p^4-3p^3+2p^2+p-1) (1.2303 at p = 5, 1.0100 at p = 101) and
      changes no exponent.
    - >-
      The closed form predicts 0.002740 hits in the 5,760 slots the p = 101 smoke
      examined, so the observed 0 was the expected outcome (P = 0.997264).
  anomalies:
    - >-
      P[>= s hit slots] for s >= 2 and the maximum hit slots per surface oscillate
      with p mod 3 (max 3, 6, 3, 9 at p = 5, 7, 11, 13). Traced to the j = 0
      family's mu_3 automorphism for p = 1 mod 3 and to the F_p^*-scaling action on
      monic x for surfaces whose b has symmetric monomial support; verified by
      orbit checks with zero violations. The scaling action does not explain every
      section-rich surface (a p = 13 surface with trivial stabiliser also has 9
      hits), so this is recorded as an open structural observation.
    - >-
      Every member of the frozen family has j = 0, i.e. the family is iso-trivial
      in the standard sense, which is the class the originating research direction
      (candidate B2) intended to exclude. Recorded as a formalisation finding.
    - >-
      The mean number of hit slots per surface is smooth and monotone
      (0.0608, 0.0512, 0.0372, 0.0326) while P[>= 1] is not proportional to it:
      the clumping ratio is 1.117 at p = 7, 13 versus 1.044, 1.033 at p = 5, 11.

  # ------------------------------------------------------------ gate verdict
  gate_verdict:
    authority: >-
      OBSERVATION ONLY. The Executor states how the observations fall against the
      frozen criteria and changes no record status. Promotion, rejection, closure,
      and any hypothesis or experiment status change are the Coordinator's.
    success_criterion_met: false
    success_criterion_detail: >-
      clause 1 fails: the exact exponents at the four contracted sizes are
      2.985781, 2.993178, 2.996544 (OLS 2.991664), all >= 1/2, and alpha = 3 is
      not excluded but is the exact limit. Clause 2 fails: P[>= 9 sections] is 0 at
      p = 5, 7, 11 and 1.35e-06 at p = 13, below p^-1 at every size under both the
      slot and the point convention.
    falsification_criterion_conditions_met: true
    falsification_criterion_detail: >-
      clause 1 holds: alpha >= 1/2 at every size and the limit is exactly the
      codimension-3 value alpha = 3, with the exact identity
      2*p^3*P_lift = 1 - 2/p + p^-3. Clause 2 holds in intent but not literally:
      P[>= 9 sections] is far below p^-1 at every computed size, yet it is
      identically zero at three of the four sizes, so no decay RATE is defined and
      "decaying faster than p^-1" cannot be asserted as a measured rate.
    scope_of_any_closure_the_coordinator_may_draw: >-
      this surface family (a = 0, deg b = 6 exactly), this section shape (x monic
      of degree 2, deg y <= 3), this predicate, and these sizes only.

  # -------------------------------------------------------------- boundaries
  boundaries:
    - >-
      An exact count removes SAMPLING error only, not MODEL error. If the frozen
      family or the frozen predicate is the wrong formalisation of the xedni idea,
      this experiment has answered a possibly wrong question exactly. The census
      itself produced four concrete instances of that risk: (a) every member has
      j = 0 and is iso-trivial in the standard sense, the class candidate B2
      intended to exclude; (b) monic x is a restriction rather than a
      normalisation, costing a factor p per surface; (c) the gate quantity is a
      per-slot rate and is Theta(p^-3) under both the monic and the free-x
      convention, so the tested exponent is insensitive to a change that moves the
      per-surface answer from Theta(p^-1) to Theta(1); (d) a(t) = 0 removes exactly
      the parameters the prescribed-target count needs.
    - >-
      Arm D is a scoped parameter-counting lemma, not an unconditional no-go for
      lifting. Lemma D1 is rigorous but only an upper bound; Lemma D2's two
      counting steps are marked heuristics verified in three configurations; and
      the prescribed construction at m = 9 on the full rational elliptic family is
      NOT excluded by the count (dim <= 1). Nothing here proves that no lifting
      attack exists.
    - >-
      Distinct is not independent. Arm C counts distinct sections of a single
      degree shape, an upper bound on the number of independent ones. No
      Mordell-Weil rank, height pairing, or torsion structure was computed; r <= 8
      is a literature input (Shioda-Tate), not a result of this experiment.
    - >-
      Toy scale only. Exhaustive verification reached p <= 13; closed-form
      evaluation reached p = 809 (10 bits). Nothing here is a statement about
      cryptographic curves, and nothing here is an attack. Claim tier: toy.
    - >-
      This experiment does not supersede the audited-route records. The
      inconclusive ECFG-P1543 and ECFG-P1547 results in
      ledger/FINDING-PF-IC-001.md stand exactly as recorded; nothing here adds to,
      replaces, or reinterprets them.
    - >-
      The infeasibility of the EXP-XEDN-001 phase-2 sampling design is a
      METHODOLOGY observation, never evidence about the mathematics (AGENTS.md
      rule 5). The exact rates now known (4.76e-07 at p = 101, 9.42e-10 at
      p = 809) show that design could not have produced a nonzero count in its
      budget; the mathematical content of the gate rests on the exact values, not
      on the earlier design's failure.
    - >-
      No solve and no relation is claimed, so every run sets
      certificate.kind: none (docs/claims-and-verification.md). There is nothing to
      certify in a counting experiment.
    - >-
      Arm B's frozen-predicate coverage at p = 11 and p = 13 is a stated fraction
      of the slot space (9.92% and 3.55%), not the whole of it. Any statement that
      the frozen predicate was exhaustively validated applies to p = 5 and p = 7.

