        at the measured ~5.2 us per dually classified slot the two full spaces
        (2,143,588,810 and 9,788,768,652 slots) need about 11,000 and 51,000 CPU
        seconds, over the 1800 s per-run and 2 CPU-hour contract budget.
      full_space_covered_instead_by: >-
        arm C, whose vectorized section fibering is a bijective reindexing of the
        whole incidence set and makes no frozen-predicate call; its totals equal
        N_hit(p) exactly at p = 5, 7, 11, 13.
      totals:
        slots_enumerated: 596268874
        frozen_predicate_calls: 596268874
        independent_reference_calls: 596268874
        frozen_vs_independent_disagreements: 0
        censored_work_units: 0
      x_invariance: >-
        the per-x hit count took exactly one value at each size (152, 738, 5450,
        11160), as Lemma 1.1 of derivation.md requires.
    C_section_histogram:
      terminal_state: completed
      run_id: RUN-XEDN-002-C
      sizes_completed: [5, 7, 11, 13]
      largest_completed_size: 13
      sizes_skipped: []
      memory_binding: false          # peak 447.8 MB against the 4 GB cap
      totals_match_closed_form: true
      counting_convention: >-
        one hit slot = one x admitting a section (y and -y are the same slot);
        points = 2 * slots exactly, verified by every per-surface count being even.
      P_at_least_s_hit_slots:
        s1:  {p5: 5.824000e-02, p7: 4.361278e-02, p11: 3.600723e-02, p13: 2.915712e-02}
        s2:  {p5: 2.240000e-03, p7: 5.503659e-03, p11: 1.136286e-03, p13: 2.398375e-03}
        s3:  {p5: 3.200000e-04, p7: 1.606473e-03, p11: 8.071977e-05, p13: 7.487348e-04}
        s4:  {p5: 0, p7: 2.776621e-04, p11: 0, p13: 1.755128e-04}
        s5:  {p5: 0, p7: 1.289145e-04, p11: 0, p13: 5.588578e-05}
        s6:  {p5: 0, p7: 9.916503e-05, p11: 0, p13: 1.279313e-05}
        s7:  {p5: 0, p7: 0, p11: 0, p13: 1.009984e-05}
        s8:  {p5: 0, p7: 0, p11: 0, p13: 2.019968e-06}
        s9:  {p5: 0, p7: 0, p11: 0, p13: 1.346645e-06}
      max_hit_slots_on_any_surface: {p5: 3, p7: 6, p11: 3, p13: 9}
      p_inverse_for_comparison: {p5: 0.200000, p7: 0.142857, p11: 0.090909, p13: 0.076923}
      multi_section_requirement: >-
        s >= r+1 sections are needed for a relation among specialised sections and
        the Shioda-Tate bound r <= 8 for a rational elliptic surface (literature
        input, not re-derived here) gives s >= 9. Observed P[>= 9 slots] is 0 at
        p = 5, 7, 11 and 1.346645e-06 at p = 13 (78 of 57,921,708 surfaces),
        i.e. below p^-1 at every computed size, by a factor 5.7e4 at p = 13.
        Under the point convention P[>= 9 points] = P[>= 5 slots] =
        0, 1.289145e-04, 0, 5.588578e-05, also below p^-1 everywhere.
      no_decay_rate_for_s9: >-
        the s = 9 event is empty at three of the four sizes, so no decay exponent
        for s = 9 is defined. The honest statement is "far below p^-1 at every
        size computed, and exactly zero at three of them", not a fitted rate.
      distinct_vs_independent: >-
        the histogram counts DISTINCT sections of one degree shape, which is an
        UPPER BOUND on the number of independent ones (P and -P are always
        dependent, and two distinct slots may also be dependent). No Mordell-Weil
        rank, height pairing, or torsion computation was performed.
    D_scoped_codimension_lemma:
      terminal_state: completed
      recorded_in: derivation.md section 2 (statement, hypotheses H1-H6, proofs)
      supporting_run: RUN-XEDN-002-A2 (arm_d_parameter_grid, arm_d_free_x_exact)
      statement_one_line: >-
        For y^2 = x^3 + a(t)x + b(t) with deg a <= A, deg b <= B and sections of
        shape (deg x <= d, deg y <= e), the section-existence condition is
        rigorously bounded by P_slot <= p^(E-B) with M_0 = max(3d, A+d, B) and
        E = min(e, floor(M_0/2)) (Lemma D1), and a parameter count gives
        c_slot = max(B, 3d, 2e, A+d) - e with P_slot = Theta(p^-c_slot)
        (Lemma D2, marked as a count, verified exactly in three configurations);
        hence alpha < 1/2 forces c = 0, which requires at least as many section
        parameters as surface parameters.
      frozen_family_instance: >-
        c_slot = 3, attained exactly: P_lift = Theta(p^-3) with constant 1/2.
      c_zero_regime: >-
        c_surf = 0 occurs exactly for the small-height integral shapes with
        UNNORMALISED x, the largest being deg a <= 4, deg b <= 6, deg x <= 2,
        deg y <= 3 (the rational elliptic surface shape). Verified exactly in the
        a = 0 slice: P_slot^free = (p-1)(p^3+1)/(2p^7) and the mean number of
        sections per surface tends to 1/2.
      prescribed_target: >-
        prescribing the fibre at t_0 and m target points costs 2 + m conditions
        and leaves dim <= dim_a + B - 1 - m - sum_i c_surf,i, so the c_surf = 0
        abundance is destroyed once m > dim_a + B - 1 (m >= 6 for the frozen
        a = 0, B = 6 family; m >= 11 for the full rational elliptic family).
      not_a_no_go: >-
        at m = 9 on the full rational elliptic family the count gives dim <= 1,
        i.e. NOT negative: this parameter count does NOT exclude the classical
        prescribed xedni construction, whose recorded failure mechanism is
        different (a bound on relation-coefficient size, KN-LIT-021). Arm D is a
        scoped parameter-counting lemma, not an unconditional no-go for lifting.
      uncovered_cases: >-
        listed in full in derivation.md section 2.6: non-integral sections (poles
        in t), section degrees outside the (d, e) grid computed, char p = 2, 3,
        non-isotrivial families with a != 0 tested empirically, base fields other
        than F_p(t), higher-genus or higher-dimensional bases, non-generic strata
        where the counting heuristic H4/H5 can fail (measured to fail for the
        symmetric b of section-rich surfaces), Mordell-Weil independence as
        opposed to section count, and the number-field xedni setting.

  # ---------------------------------------------------------------- per control
  controls:
    control_1_frozen_predicate_vs_independent:
      verdict: pass
      evidence: >-
        complete reachable f-space at p = 5 (62,500) and p = 7 (705,894) against
        square-root extraction plus a discriminant squarefreeness test; sympy
        factorisation over GF(p) on all 62,500 at p = 5; 2 x 100,000 random
        sextics at p = 101 (seeds 20260718 and 20260724) with 2,500 sympy
        cross-checks each; plus all 596,268,874 arm-B slots. Zero disagreements
        anywhere. Frozen hits equal the closed form (152, 738 per x) and
        mathematical squares equal theirs (187, 857).
      finding: >-
        the frozen predicate is a strictly narrower test than "is a square": it
        rejects squares whose root is not squarefree. That is a semantic fact, not
        a disagreement with the independent implementation of the same semantics;
        both the frozen-semantics count and the mathematical-square count are
        reported separately in every table.
    control_2_planted_section_recovery:
      verdict: pass_with_recorded_deviation
      evidence: >-
        at p = 101 all 10,201 monic quadratics were enumerated for the planted
        b = y*^2 - x*^3 with x* = t^2 + 5t + 3, y* = t^3 + 2t^2 + 4t + 7; exactly
        one hit, at (x0, x1) = (3, 5), reproducing the EXP-XEDN-001 smoke result
        "1 section, planted control recovered".
      deviation: >-
        the planted b has degree 5, not 6 (the t^6 coefficients of y*^2 and x*^3
        are both 1 and cancel), so the planted surface lies OUTSIDE the frozen
        deg b = 6 census family. It is a valid recovery control on the enumerator
        and the predicate, and it is NOT a member of the population arm A counts.
        The EXP-XEDN-001 smoke recorded the same degree
        (planted_surface_b_degree: 5).
    control_3_smoke_consistency:
      verdict: pass
      evidence: >-
        P_lift(101) = 4.756857e-07 predicts 0.002740 expected hits in the smoke's
        5,760 slots, so P(observe 0) = 0.997264; the one-sided 95% upper limit on
        the rate given 0 hits is 5.201e-04 and contains the closed-form rate. The
        smoke's part-4 negative control is consistent too: exact rate
        (p-1)/(2p^4) predicts 0.0961 squares in 200,000 random sextics, observed
        0, P(0) = 0.9084.
      finding: >-
        the p = 101 smoke could not have detected this rate. Its 0 is the expected
        outcome and carries almost no information about the exponent.
    control_4_isotriviality:
      verdict: discharged_with_finding
      evidence: >-
        narrow reading (iso-trivial = constant coefficients): exactly 0 surfaces,
        as the specification anticipated, because deg b = 6 excludes constant b.
        Standard reading (constant j, equivalently mutually isomorphic smooth
        fibres): EVERY surface in the family is iso-trivial, because a(t) = 0
        forces j = 1728*4a^3/(4a^3 + 27b^2) = 0 identically; the family is a family
        of sextic twists of Y^2 = X^3 + 1. Exactly (p-1)*p members (20, 42, 110,
        156 at p = 5, 7, 11, 13, verified by enumeration) are isomorphic over
        F_p(t) to a constant curve, namely b = c*(t + a0)^6.
      exclusions_applied: none
      finding: >-
        the EXP-XEDN-001 contract constraint "iso-trivial surfaces must be
        detected and excluded" is not satisfiable for this family as frozen:
        excluding the iso-trivial members under the standard reading would empty
        the family. Recorded for the Coordinator as a formalisation finding; no
        surface was excluded from any count and no contract was changed.
    control_5_degenerate_y0_section:
      verdict: pass
      evidence: >-
        exactly p^2 slots have x^3 + b = 0 (b = -x^3, one per x, all inside the
        family since deg(-x^3) = 6); verified 25, 49, 121, 169 at p = 5, 7, 11, 13
        and all rejected by the frozen predicate. Counting them would raise P_lift
        by 6.6e-03 relative at p = 5 and 9.0e-05 at p = 13, and changes no
        exponent.
    extra_structural_check_not_a_contract_control:
      verdict: consistent
      evidence: >-
        for p = 1 mod 3 the j = 0 family has the automorphism x -> zeta*x, which
        fixes x^3: 624 orbit checks at p = 7 and 708 at p = 13, zero violations.
        The monic scaling action x(t) -> lambda^-2 x(lambda t) explains the
        section-rich surfaces with symmetric b (at p = 7, b = t^6 + 2 has
        stabiliser all of F_7^* and its 6 monic hits form one orbit; at p = 13,
        b = 3t^6 + 10t^3 + 9 has stabiliser {1,3,9} and its 9 monic hits form
        three orbits of size 3). It does not explain all of them: a p = 13 surface
        with trivial stabiliser also has 9 hits.
      why_recorded: >-
        arm C showed an unexpected p mod 3 oscillation in P[>= s] for s >= 2 and
        in max hit slots. AGENTS.md rule 8 requires recording it rather than
        discarding it.

  # -------------------------------------------------------------------- runs
  runs:
    completed:
      - id: RUN-XEDN-002-A2
        arm: A (and the arm D parameter tables)
        wall_clock_seconds: 2.332
