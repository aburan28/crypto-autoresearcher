        summed_worker_cpu_seconds: 3216.8
      - id: RUN-XEDN-002-C
        arm: C
        wall_clock_seconds: 13.771
        peak_memory_mb: 447.8
        validity: valid
      - id: RUN-XEDN-002-CTRL
        arm: controls 1-5 plus the structural check
        wall_clock_seconds: 19.434
        peak_memory_mb: 66.3
        validity: valid
    invalid:
      - id: RUN-XEDN-002-A
        classification: invalid_record_metadata
        reason: >-
          the run's computation is correct and its raw-result.json is identical to
          RUN-XEDN-002-A2's (same deterministic script, same commit), but its
          manifest recorded an UNVERIFIED inference.resolved_model string. Run
          records are immutable, so the directory is left exactly as written and
