          receipt, not a measurement error and not a mathematical result.
        wall_clock_seconds: 2.342
        peak_memory_mb: 242.6
        note: >-
          the manifest inside runs/RUN-XEDN-002-A/manifest.yaml still reads
          status: completed / validity: valid because it was frozen before the
          defect was found and must not be edited. This report is the record of
          its invalidity.
    failed: []
    censored: []
