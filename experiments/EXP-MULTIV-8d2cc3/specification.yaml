experiment:
  id: EXP-MULTIV-8d2cc3
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-41ab94; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-41ab94
  question_id: RQ-UOV-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Stage-gated construction and exhaustive ground-truth validation of a shared UOV-family kernel:
    one core, four transform plugins, one null generator, and a forced-value release report.'
  objective: 'The uncertainty reduced is whether the four schemes in this bucket can be measured by
    one validated instrument, and whether that instrument''s outputs can be trusted at the parameters
    where measurements will actually be run. Stated as parts: (i) the run implements a core with no
    scheme-specific branches and four transform plugins, and reports the branch count as a primary
    metric, so the one-core claim is falsified mechanically rather than argued; (ii) at every configuration
    below the enumeration ceiling it verifies the planted secret exhaustively, enumerates all candidate
    secrets and compares the count against a closed form taken from a cited in-repo source, and feeds
    every non-secret to the certificate checker to establish a zero acceptance rate, which together
    constitute a stronger validation than any current in-repo multivariate instrument has; (iii) it
    produces a forced-value report listing each quantity whose value was known before the run alongside
    the measured value, and it blocks release on any mismatch, so that later proposals cite a gate
    rather than an assurance. The run measures no security property, claims no attack, and produces
    no statement about any scheme; a failure at any gate is the informative outcome and is reported
    as such.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supported scope is: the kernel, at the configurations
      listed in its report, reproduces the listed forced values exactly, rejects every enumerated
      non-secret, and constructs each of the four scheme shapes from a core containing the reported
      number of scheme-specific branches, all under the recalled transform definitions recorded on
      the report''s first page. What does NOT follow: nothing about the security, cost, or structure
      of any scheme; no claim that the kernel is correct at configurations above the exhaustion boundary,
      which is stated per scheme; and no claim that it matches any real implementation of any of the
      four schemes, since none is read here.'
  inputs:
    procedure: 'STAGE 0, interface freeze (cost: human, days): write the slot decomposition, the plugin
      interface, and the forced-value list with a cited source per value. STAGE 1, core plus plain
      UOV (cost: medium): implement and run the four-gate check at q = 2, n = 8, o = 3, m = 3; do
      not proceed on failure. STAGE 2, null generator (cost: low): implement and gate on zero enumerated
      secrets and on a rate-1 acceptance of a planted null secret. STAGE 3, transforms one at a time
      (cost: high): add each plugin, run its degenerate-parameter byte-exactness control and its own
      exhaustive gate before adding the next. STAGE 4, awkward configurations (cost: medium): reducible
      quotient polynomial, ell = 3, k = 3, characteristic 3. STAGE 5, forced-value report (cost: low):
      measured versus expected for every listed quantity, plus the exhaustion boundary per scheme.
      STAGE 6, release decision (cost: human): release only on a fully passing report; publish the
      failing report otherwise.'
    instrument: Python 3 with exact F_q arithmetic via precomputed tables for q in {2, 3, 4, 8, 16};
      polynomial and matrix-algebra arithmetic implemented directly for the ring transforms; canonical
      reduced-row-echelon subspace enumeration with a visit-count assertion; the certificate checker
      as a separate module with no import path to any generator. Interfaces documented in the run
      package so later experiments can depend on them. Driven by harness/runner.py for seeds, manifests
      and the inference block. No computer algebra system and no Sage.
    parameters: 'Validation configurations: q in {2, 3, 4}; flattened n in {6, 8, 9}; o in {2, 3};
      m in {2, 3}; deg f in {1, 2, 3} including one reducible f; ell in {1, 2, 3}; k in {1, 2, 3};
      seed expander in {identity, hash-based}. Every configuration admitted only if its closed-form
      candidate count is at most 10^7. At least one awkward configuration per scheme is mandatory.
      Forced-value list has at least six entries drawn from cited in-repo sources.'
  controls:
  - Null generator with no planted secret, whose enumerated valid-secret count must be exactly 0.
  - 'Non-secret rejection sweep: every enumerated candidate that is not a valid secret is fed to the
    checker, which must accept none.'
  - Enumeration completeness assertion against closed-form counts, catching an iterator that silently
    skips candidates.
  - 'Dimension-arithmetic assertion: every construction''s actual flattened dimensions checked against
    the slot-arithmetic prediction.'
  - 'Degenerate-transform control: each transform at its identity parameter (k = 1, deg f = 1, ell
    = 1, identity expander) must reproduce the core''s output exactly, byte for byte.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null generator is a first-class component rather than a control
    bolted on: it produces uniformly random quadratic maps at any requested flattened dimensions,
    optionally with a planted isotropic subspace and no algebra structure. Its release gate is that
    the certificate checker accepts a planted null secret at rate exactly 1 and accepts non-secrets
    at rate exactly 0, and that a null map with no planted secret has an enumerated valid-secret count
    of exactly 0 at every tiny configuration. If the null generator cannot meet those forced values,
    no measurement built on this kernel has a trustworthy control arm, and that is precisely the failure
    mode this proposal exists to make visible before ten experiments inherit it.'
  independent_variables:
  - scheme configuration (core plus transform stack)
  - field size q
  - algebra dimension or quotient degree
  - whipping factor k
  - transform at identity parameter versus active
  metrics:
    primary:
    - scheme-specific branch count in the core
    - certificate acceptance rate on non-secrets
    - enumerated valid-secret count versus closed-form count
    - count of forced values reproduced exactly
    secondary:
    - dimension-arithmetic assertion pass rate
    - degenerate-transform byte-exactness result
    - exhaustive-validation boundary per scheme
    - plugin line counts, as a check that logic was not hidden in plugins
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'The forced-value report: for each of at least six quantities with a closed form known
      before the run, the measured value produced by the kernel.'
    formula: 'Frozen forced values include: the number of o-dimensional subspaces of F_q^n equals
      the Gaussian binomial [n choose o]_q, whose value at (q, n, o) = (2, 8, 3) is 97155; the certificate
      acceptance rate on non-secrets equals exactly 0; the rank of the quotient-ring pairing element
      equals ell - deg gcd(a, f) as recorded in H-QRUOV-e8ae3e P1; each transform''s flattened dimension
      multipliers as declared in its plugin; the enumerated valid-secret count of a null map with
      no planted secret equals exactly 0; and each transform at its identity parameter reproduces
      the core output byte for byte.'
    source: Pre-registered in the parent proposal IDEA-20260816-41ab94 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Every validated configuration has candidate-secret count at most 10^7, which is
      the ceiling that makes exhaustion possible and therefore makes the validation exhaustive rather
      than sampled. This is the defining constraint of the proposal rather than an incidental one:
      the gate is only as strong as the exhaustion, so the boundary is reported per scheme and no
      validity is claimed above it. There is no transfer assumption because there is nothing to transfer
      - the kernel''s behaviour at larger configurations is explicitly unvalidated and downstream
      records must say so.'
    correspondence: null
  tail_checks:
  - a reducible quotient polynomial, where H-QRUOV-e8ae3e's CRT split makes the algebra non-local
  - ell = 3 with q = 2, the most degenerate algebra configuration
  - characteristic 3, to catch conventions that silently assume characteristic 2
  - the configuration nearest the 10^7 ceiling, where enumeration cost and memory are worst
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - do not implement transform i+1 until transform i passes every gate
  - admit no configuration above the 10^7 candidate ceiling; an excluded configuration is reported
    as unvalidated, never as passing
  - block release on any forced-value mismatch and publish the failing report rather than patching
    the expectation
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Every admitted configuration passes its exhaustive gate, the certificate checker
    accepts no non-secret anywhere, at least six forced values are reproduced exactly with their sources
    cited, and the core's scheme-specific branch count is reported alongside the exhaustion boundary
    per scheme.
  falsification_criterion:
  - A scheme-specific branch is required in the core, falsifying the one-core claim.
  - The certificate checker accepts any non-secret.
  - An enumerated count disagrees with its cited closed form.
  - A degenerate-transform control is not byte-exact against the core.
  - The null generator yields a nonzero enumerated valid-secret count.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-41ab94
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The plugin interface is described but not specified; a Coordinator must fix it before Stage 1,
    because changing it after three plugins exist is the failure this proposal is meant to prevent.
  - Whether a shared kernel should be a research artifact under the ledger's immutability rules or
    ordinary tooling outside them is a governance question this proposal cannot settle and that affects
    how corrections to it are recorded.
  - The forced-value list has at least six entries in principle but only four are named here with
    sources; the remainder must be chosen and cited before approval.
  - All four transform definitions are recalled and UNVERIFIED, and all four anchor questions constrain
    experiment design pending primary sources; approval must state how that applies to an instrument
    rather than to a measurement.
