experiment:
  id: EXP-PFDR-a76b91
  hypothesis_id: H-PFDR-2139a5
  version: 1
  title: Native definition and quantifier certificate audit (container-executed successor)
  status: approved
  objective: Separate certified finite counterexamples from unsupported transfers or asymptotic conclusions.
  inputs:
    source_idea: IDEA-20260905-df55e9
    source_snapshot: 989d62f62
    native_fixture:
      field_sizes:
      - 3
      - 5
      ring: Ordinary F_q[w,x,y,z], with no added field equations or quotient reductions.
      generators:
      - x^2-x
      - x*y-1
      - w^q-w
      - w^(q-1)*z^(q-1)-1
      term_order: Graded reverse lexicographic, w>x>y>z.
    signatures: Record field, ordered generators, quotient, term order, algorithm, degree convention, target
      domain, and quantifiers.
    source:
      citation: https://arxiv.org/pdf/2112.05579
      provenance: retrieved
      verified_by: codex-root/2026-09-05
      locations: Example 4.4 and Theorem 3.1; exact definition compatibility is a prerequisite.
  controls:
  - Native q=3 and q=5 fixtures must be reconstructed unchanged.
  - Two altered signatures impose Boolean quotient relations on the native fixtures; ordinary certificates
    must be rejected for these signatures without an interface proof.
  - The finite table must not be accepted as disproof of an unspecified uniform constant.
  - The target x_R=9 on y^2=x^3+2*x+15 over F_19 must be checked for rational-point admissibility before using
    an all-affine witness in a rational-target claim.
  independent_variables:
  - Native field size q in [3,5].
  - Ordinary versus deliberately altered quotient signature.
  - Equality, supplied-constant, existential-constant, and target-domain claim forms.
  metrics:
    primary:
    - Exact count of incorrectly accepted claims among eight fixture records.
    - Native first-fall and last-fall certificates; solving-degree bounds only when the cited theorem's interface
      is proved.
    secondary:
    - Certificate-checker agreement, resource use, and incompatibility reasons.
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Native degree triples and invalid acceptance count.
    formula: 'q=3: (d_ff,d_lf,sd)=(3,5,5); q=5: (3,9,9); invalid acceptances=0.'
    source: Retrieved source predictions and the proposal; not new observations.
  scale_relevance:
    tier: toy
    justification: Eight finite audit fixtures; no prime-digit transfer or asymptotic inference.
    correspondence: null
  tail_checks:
  - No statistical population is sampled and no tail claim is made.
  replication:
    seeds:
    - 0
    independent_instances: 0
    labelled_fixture_count: 8
    deduplication: Hash canonical field, generators, quotient, order, claim, and constant; repeated deterministic
      evaluations are checker replications, not new samples.
  protocol:
    run_groups:
    - group: 1
      fixtures: Native q=3 and q=5 polynomial systems.
      procedure: Reconstruct the source definitions before arithmetic. For each degree from zero through 10,
        form exact Macaulay rows and the iterated V_F,D closure by multiplication of current consequences when
        product degree is at most D, iterating exact row reduction to a fixed point. Columns use descending
        total degree then the declared monomial order; pivot rows are normalized with deterministic leftmost
        pivots. For each current row whose degree is at most D-1, multiply by each variable in w,x,y,z order
        and reduce again until no rank increases. This degree-filtered basis spans every low-degree consequence
        needed for multiplication. Retain every derivation. Use the paper's native first-fall definition with
        its trivial-syzygy convention; a one-generator quotient-layer meter is not an implementation of this
        definition. If that interface is unresolved, record unmeasured.
    - group: 2
      fixtures: Altered Boolean quotient signatures of each native system.
      procedure: Run signature matching only; reject reuse of the ordinary degree certificate and report incompatible.
        No altered degree prediction is asserted.
    - group: 3
      fixtures: Claims forall native systems sd=d_ff; and forall native systems sd-d_ff<=1.
      procedure: Use a certified q=3 native witness to refute each explicit finite universal claim; otherwise
        return inconclusive.
    - group: 4
      fixtures: Claim that the finite q table disproves any uniform gap constant; and transfer of the F_19
        all-affine tuple to the rational-target domain.
      procedure: Reject the first inference by quantifier order; enumerate y in F_19 for the second and report
        its exact admissibility decision.
    completeness: "An ordinary last-fall upper bound D requires a degree-compatible Gr\xF6bner basis of the\
      \ same ideal, checked by all Buchberger pairs, with each basis element certified in V_F,D and both ideal\
      \ inclusions certified. The division argument giving that upper bound must be retained. A matching lower\
      \ witness must have degree less than k, belong to V_F,k, and not belong to V_F,k-1. Without matching\
      \ bounds report an interval, never an exact last-fall value. Measuring solving degree is excluded from\
      \ version 1. The source's predicted values remain control predictions; finite claims may use only solving-degree\
      \ bounds derived from certified native last-fall bounds after the cited theorem's hypotheses are checked.\
      \ Largest output-basis degree is never a last-fall value."
    arithmetic: Exact modular arithmetic only; retain canonical monomial columns and independently verifiable
      row certificates.
    implementation_gate: Freeze producer and checker source hashes and source-definition audit before the first
      measurement. No implementation currently exists by this specification's assertion.
  run_ids:
    group_1: RUN-PFDR-20260907-587a55
    group_2: RUN-PFDR-20260907-2b0b0f
    group_3: RUN-PFDR-20260907-d934ea
    group_4: RUN-PFDR-20260907-f0b0d7
  execution_environment:
    backend: Docker (tools/audit_process.py docker backend); the host is macOS 26.6-arm64, whose kernel
      rejects every RLIMIT_AS/RLIMIT_DATA set (reproduced 2026-09-07 with Python 3.13.1, both interpreters;
      see DEC-20260907-a39256 context). The frozen driver's hard 8 GiB RLIMIT_AS therefore executes inside a
      pinned Linux container, where the same setrlimit call succeeds (verified in the pinned image).
    image:
      digest: sha256:1c633a1d80264a1ff31824a06a5b8ea8566e6277bd7af4fa5db6dd993d4ec4de
      base: autolab-ecc2k130-pollard-rho-check@sha256:720d528b40bbd2f559ea1ccbd38d337829a98cfcd1d6b5c2e0f4c42c68dd6e3e
        (Ubuntu 22.04.5, CPython 3.10.12) plus `apt-get install -y --no-install-recommends git` (git 2.34.1),
        required by the driver's manifest commit/dirty capture. Built locally 2026-09-07; the built digest is
        the binding identity, verified by tools/audit_process.py before every launch (Id + Os readback).
    container_bounds: --network=none --read-only --memory 8589934592 --memory-swap 8589934592 --cpus=1
      --pids-limit=64 --cap-drop=ALL --security-opt=no-new-privileges --tmpfs /tmp:rw,nosuid,nodev; workspace
      bind-mounted read-only at /work; limit readback asserted by the launcher.
    supervisor: >-
      tools/audit_process.py (as committed on main via PR 804); writes launch.json before resource
      setup and a terminal receipt.json; exclusive output directories; no mutable tag is ever pulled.
    canonicalization: The container workspace is read-only, so the driver's in-container receipt writes are
      skipped by design (driver delta D3); the host-side adapter.py assembles the canonical
      schema-conforming run record from the supervisor receipt plus the driver's stdout payload and validates
      it against schemas/run-manifest.schema.json before the group is considered recorded.
    python_in_payload: '3.10.12 (container); the host interpreter is not the payload interpreter'
  driver_deltas_vs_predecessor:
    statement: The v2 driver is the v1 driver with exactly these six changes and no others (diff committed
      alongside this contract); fixture evaluation, checker call, seeds, limits, and status logic are
      byte-identical.
    deltas:
      D1: Run IDs re-minted to the run_ids block above (v1 IDs are permanently consumed by the failed
        attempt's immutable receipts; the driver refuses to overwrite an existing receipt directory).
      D2: experiment_id updated to this contract's id.
      D3: The runs/ mkdir is OSError-guarded; in the read-only container workspace the driver skips its
        in-container writes and the stdout payload becomes the canonical channel (host adapter persists it).
      D4: The manifest dirty flag is computed from actual `git status --short` instead of a hardcoded true
        (truthfulness; the v1 tree was in fact dirty, the v2 clone is clean).
      D5: The final stdout line additionally carries run_id, the full certificate dict, and the full driver
        manifest, so the host adapter can reconstruct every canonical field without re-execution.
      D6: Nothing else. The RLIMIT_AS/RLIMIT_CPU calls, signal.alarm, frozen-hash self-assertion, fixture
        loop, and checker invocation are unchanged.
  interface_resolution_note: >-
    The unresolved native grading / zero-top-form interface recorded in source-audit.md remains unresolved
    in this successor as well; groups 1 and 3 therefore remain unmeasured-by-design exactly as in the v1
    disposition (DEC-20260906-280035). The proposed explicit convention in docs/first-fall-audit-repair.md
    (ordinary-ring top forms first, then map into the truncated ring with prequotient slot weights) is
    noted for a future amendment, NOT adopted here: this successor executes the frozen v1 protocol, in which
    an unresolved interface is recorded as unmeasured and never assumed.
  budget:
    wall_clock_seconds_per_run: 900
    maximum_memory_gb: 8
    total_cpu_hours: 1
    maximum_runs: 4
    maximum_workers: 1
    stages:
    - name: native controls
      maximum_runs: 1
      wall_clock_seconds: 900
    - name: signature controls
      maximum_runs: 1
      wall_clock_seconds: 900
    - name: finite claims
      maximum_runs: 1
      wall_clock_seconds: 900
    - name: quantifier and domain controls
      maximum_runs: 1
      wall_clock_seconds: 900
    accounting: Four sequential runs sum to 3600 seconds; implementation, checking, and all controls are charged
      within these caps.
  stopping_rules:
  - Stop a run at 900 seconds, 8 GiB, or degree 10; retain partial evidence and mark censoring.
  - Stop arithmetic on an unresolved native-definition interface; metadata fixtures may still complete.
  - No replacement fixtures or parameter expansion in this version.
  invalidation_rules:
  - Changed generators, quotient, term order, or syzygy convention without a prior amended contract.
  - Unretained code, inexact ranks, missing derivations, or treating repeated degrees as independent data.
  - Claiming exact last fall from a plateau or largest output-basis degree.
  receipt_completion_criterion: All eight fixture attempts and their completed, invalid, or censored states
    are retained.
  success_criterion: All eight decisions complete correctly, both native controls have the certificates required
    by the finite claims, and no invalid claim is accepted. Missing decisive certificates yield inconclusive.
  falsification_criterion: A fully checked invalid acceptance falsifies this instrument's fixture claim; disagreement
    on a native degree control triggers source and implementation review rather than immediate literature refutation.
  required_artifacts:
  - specification hash, source-definition audit, and canonical eight-fixture input manifest
  - producer and checker sources with hashes, exact commands, commit and dirty-tree state
  - environment and dependency versions; model policy, resolved identifier, verification and fallback provenance
  - stdout, stderr, timestamps, resource measurements, and all attempted-run receipts
  - "exact matrices, monomial orders, row derivations, Gr\xF6bner certificates, degree bounds, and raw decision\
    \ table"
  - report identifying incompatible signatures, incomplete certificates, and the scope of every decision
  - supervisor launch and receipt records (image digest, container id, memory boundary) for every group
  assigned_to: executor
  approved_by: DEC-20260907-c9b61c
  execution_authorized: true
  execution_authorization: User instruction recorded in DEC-20260906-dd1676 (re-filed as DEC-20260907-a39256
    after the original uncommitted filing was lost to a concurrent checkout; see that record for the verbatim
    user quote and scope), executed under this successor per DEC-20260907-c9b61c.
  review_requirements:
  - Execution needs a committed approval and bounded dispatch; this record authorizes no run.
  - Before claim-changing review, commit a plan with prior, unique joint owners, blindness, known-false controls,
    and a blind re-derivation excluding producer code and reports.
  - A proposed contradiction or closure requires independent review-breakthrough at max without degradation.
  next_decisions:
    positive: After independent verification, permit only the audited native interfaces to inform later designs.
    negative: Repair the specific rejected signature or instrument before using its degree comparison.
    inconclusive: Retain the unresolved interface or bound and design its cheapest certificate prerequisite.
  predecessor_experiment_id: EXP-PFDR-845d33
  predecessor_specification_sha256: 141498a66abf92f159cf0af72210ff30d96888506d7af8b38de98fe9900a81ca
  predecessor_semantic_equivalence: >-
    The protocol, eight fixtures, four bounded run groups, seeds, budget, prediction, stopping rules, and
    invalidation rules are unchanged from the predecessor (user-authorized scope of DEC-20260906-126882 and
    DEC-20260907-a39256). The changes are administrative and platform-level: new run IDs (D1), contract id
    (D2), read-only-workspace receipt channel (D3), dirty-flag truthfulness (D4), canonical stdout payload
    (D5), and a Linux container execution environment in which the frozen 8 GiB hard memory limit is
    enforceable.
  frozen: true
