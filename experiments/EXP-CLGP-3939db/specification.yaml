experiment:
  id: EXP-CLGP-3939db
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-bbdcf3
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE SIZE GAP PRICED HONESTLY, IN BOTH DIRECTIONS: because h(O) ~ sqrt(p) while N ~ p, a
    bridge could carry at most HALF of k -- and half of k is exactly enough to move the ECDLP exponent
    from 1/2 to 1/4 by kangaroo on the residual interval -- so the prize is real; the same inequality
    h(O) < N is precisely what forces Hom(Z/N, Cl(O)) = 0 and kills every homomorphic bridge, and
    the record states the exact hypothesis that would have to fail for the route to reopen'
  status: draft
  objective: "(A) THE TWO NUMBERS, AND WHY THE GAP CUTS BOTH WAYS. For an ordinary E/F_p with Frobenius\
    \ trace t, discriminant D = t^2 - 4p and End_{F_p}(E) = O:\n  h(O) = O( sqrt(|D|) log|D| ) = O(\
    \ sqrt(p) log p )   [unconditional]\n  h(O) = |D|^{1/2 + o(1)}                             [Siegel,\
    \ ineffective]\n  N    = #E(F_p)/c >= (p + 1 - 2 sqrt p)/c            [Hasse]\nSo the class group\
    \ is QUADRATICALLY SMALLER than the point group. This single inequality is the hinge of the whole\
    \ lane, and it does two opposite things at once. That is the content of this record.\n(B) THE\
    \ PRIZE, COMPUTED. Suppose -- counterfactually -- that some efficiently computable map delivered\
    \ the class-group coordinate of a k-dependent curve, i.e. delivered k mod M for some M ~ h ~ sqrt(N).\
    \ Then:\n  - obtaining that coordinate by SEARCH over Cl(O) costs O(sqrt(h)) =\n    O(N^{1/4})\
    \ action evaluations (KN-TECH-027 baseline; meet-in-the-\n    middle or kangaroo on the Cayley\
    \ graph);\n  - the residual unknown is k in an interval of width N/M ~ sqrt(N),\n    solved by\
    \ Pollard's kangaroo/lambda method in ~2 sqrt(N/M) = O(N^{1/4})\n    group operations;\n  - TOTAL:\
    \ N^{1/4 + o(1)} time.\nThat is an EXPONENT MOVE from 1/2 to 1/4 on prime-field ECDLP -- the class\
    \ of result docs/target-result-profile.md exists to chase. The lane is therefore NOT a curiosity,\
    \ and a shrug is not an acceptable deliverable. Note also the CEILING: Cl(O) has h elements, so\
    \ ANY bridge into it carries at most log2 h ~ (1/2) log2 N bits. A bridge cannot deliver all of\
    \ k. The best conceivable version of this route is exactly the half-and-half split above, and\
    \ its exponent is exactly 1/4, never lower. Stating the ceiling before searching is what keeps\
    \ the search honest.\n(C) WHAT WOULD HAVE TO BE TRUE -- FOUR CONDITIONS, EACH SEPARATELY NECESSARY.\
    \ For the prize in (B) to be collectable there must exist a family of maps psi_{E,P} : G -> Cl(O)\
    \ (or into the isogeny class, which is a Cl(O)-torsor) such that:\n  (C1) COMPUTABILITY. psi is\
    \ evaluable in polynomial time from public data\n       (E, P, Q) with no discrete logarithm.\n\
    \  (C2) NON-CONSTANCY. psi([k]P) varies with k, on a set of k of density\n       bounded away\
    \ from zero.\n  (C3) STRUCTURE. psi is compatible enough with the arithmetic of Z/N that\n   \
    \    recovering psi(Q) yields a CONGRUENCE on k -- not merely a\n       correlation. Anything\
    \ less gives at most a distinguisher, and a\n       distinguisher on curves is not a bit of k.\n\
    \  (C4) IN-CLASS LANDING. psi's image lies in the isogeny class of E, so\n       that the class-group\
    \ search of (B) applies.\n(C3) is where \"structure\" must be made precise, and the only precise\
    \ version available is: psi is a GROUP HOMOMORPHISM G -> Cl(O), possibly after composing with\
    \ a torsor trivialisation.\n(D) OBS-5, THE COUNTING KILL -- THE SAME INEQUALITY, USED AGAINST\
    \ THE ROUTE. G has PRIME order N. If N > h(O) then gcd(N, h(O)) = 1, and the image of any group\
    \ homomorphism psi : G -> Cl(O) is a subgroup of Cl(O) whose order divides the prime N and divides\
    \ h; hence the image is trivial and psi = 0. Therefore (C2) and (C3) are INCOMPATIBLE: any psi\
    \ satisfying (C3) in its precise form is constant, violating (C2). The threshold is explicit:\
    \ N > h(O) holds whenever the cofactor satisfies\n  c  <  (p + 1 - 2 sqrt p) / (C sqrt p log p)\
    \  ~  sqrt(p) / (C log p),\nwhich covers every standardised curve (c <= 8) by an enormous margin.\
    \ THE GAP IS THUS SELF-DEFEATING: it is large enough to make the prize worth p^{1/4}, and it is\
    \ large enough to force gcd(N, h) = 1 and kill the only precise version of (C3).\n(E) THE EXACT\
    \ ESCAPE HYPOTHESIS, STATED SO IT CAN BE ATTACKED. OBS-5 needs N > h(O). Two ways out, both named\
    \ here rather than left implicit:\n  (E1) N <= h(O), i.e. cofactor above ~sqrt(p)/log p. Then\
    \ N | h is\n       possible and a nonzero homomorphism EXISTS abstractly. This is a\n       real\
    \ regime, constructible at toy scale, and it is probed by the\n       minimal test. PREDICTED\
    \ OUTCOME: existence does not give\n       computability -- Cl(O) has no canonical Z/N-quotient\
    \ attached to\n       the curve, and pinning one requires the class group structure\n       (L_{|D|}(1/2)\
    \ by Hafner-McCurley) AND an identification that the\n       curve data does not supply. So a\
    \ SECOND obstruction is predicted to\n       appear exactly where the first lapses, and finding\
    \ out whether it\n       does is the experiment.\n  (E2) Drop (C3)'s homomorphism requirement.\
    \ Non-homomorphic psi are not\n       excluded by counting. This is the honest residual open class\
    \ and\n       the record does NOT close it. What the record does is price it: a\n       non-homomorphic\
    \ psi still cannot carry more than log2 h bits by\n       (B)'s ceiling, so even the best non-homomorphic\
    \ bridge caps the\n       route at exponent 1/4.\n\n(F) THE DELIVERABLE. Either a named quantity\
    \ (the prize, 1/2 -> 1/4, with its ceiling), a named obstruction (OBS-5, unconditional, with an\
    \ explicit cofactor threshold), and a named residual class (E1, E2) -- or, if the escape regime\
    \ experiment surprises, a live lead. Both outcomes are informative, which is the quality bar."
  resource_label: 'R3 (End(E) as a ring: class number, ideal classes) with R4 as the setting (the
    class group acts on curves). The mechanism consumes the ARITHMETIC of O, not any group operation
    on G.'
  admissibility: admissible
  admissibility_argument: 'Admissible: the resource is h(O) and the group structure of Cl(O), which
    are invisible to a generic group oracle for G -- a generic oracle cannot even express "the class
    number of the endomorphism ring". Nothing here applies an endomorphism to a point of G, so H-ENDO-001
    does not bite and the oracle classes closed in KN-FIND-b7e091 are not used. The proposal is admissible
    and is then closed by OBS-5, a counting obstruction that is strictly stronger and cheaper than
    the admissibility filter.'
  reachability_gate: 'T5 IS BINDING AND IS PRICED INTO THE PRIZE, not waved at. The counterfactual
    bridge would deliver an ADDRESS in Cl(O) -- a global coordinate -- which T5 says is exactly the
    expensive kind of information: reaching a SPECIFIED curve costs ~sqrt(h) = p^{1/4}. That cost
    is not an objection to the prize; it IS the first term of the prize, and the record carries it
    explicitly rather than assuming the address is free. The cheap side of T5 (a uniformly random
    curve is reachable in O(log p) steps under GRH-conditional rapid mixing) is unusable here, because
    a random curve''s address is known by construction and therefore carries no information about
    the instance. So this lane sits squarely on the expensive side of the dichotomy and its accounting
    says so.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): the three symbolic results -- prize, ceiling, OBS-5
      with explicit threshold. If OBS-5''s threshold does not cover c <= 8, stop and restate. STAGE
      1 (minutes): toy enumeration producing (p,t,D,f,O,h,N,c) and the distributions of h/N, log2
      h/log2 N, gcd(N,h). STAGE 2 (minutes, THE COST-MODEL CALIBRATION): kangaroo on full and planted-half
      intervals; check against 2 sqrt(W). STAGE 3 (hours): the planted-bridge synthetic family end
      to end; must exhibit the 1/4 exponent and must decay to 1/2 as M -> 1. STAGE 4 (hours, THE ESCAPE-REGIME
      EXPERIMENT): construct instances with N | h; compute Cl(O) structure; enumerate Z/N-quotients;
      test presentation independence. STAGE 5 (zero compute): write the residual class (E2) with its
      ceiling.'
    mechanism: "STEP 1 (zero compute). Write the prize computation of (B) with explicit constants:\
      \ kangaroo on width W costs ~2 sqrt(W); class-group MITM costs ~c sqrt(h) action evaluations;\
      \ total N^{1/4} with the two constants and the cost of ONE action evaluation carried through,\
      \ not hidden.\nSTEP 2 (zero compute). Prove the ceiling: log2 h <= (1/2) log2 |D| + O(log log\
      \ |D|) <= (1/2) log2 (4p) + O(log log p), so a bridge into Cl(O) carries at most half of k's\
      \ bits. This bounds the ROUTE, not just one attempt, and it is what makes the record a closure\
      \ rather than a report.\nSTEP 3 (zero compute, HARD GATE). Prove OBS-5 with the explicit cofactor\
      \ threshold. Unconditional.\nSTEP 4 (toy compute). Measure the two numbers rather than trusting\
      \ the asymptotics: over a ladder of toy primes, enumerate ordinary curves, compute (t, D, f,\
      \ O, h(O), N, c), and produce the empirical joint distribution of (h/N, log2 h / log2 N, gcd(N,\
      \ h)). Predicted: log2 h / log2 N concentrates near 1/2; gcd(N, h) = 1 on essentially all small-cofactor\
      \ instances.\nSTEP 5 (toy compute, THE ESCAPE-REGIME EXPERIMENT). Construct the regime (E1)\
      \ deliberately: search toy parameters for ordinary curves whose prime subgroup order N DIVIDES\
      \ h(O). This is feasible at toy scale because N can be made small (large cofactor) while |D|\
      \ ~ 4p keeps h large. For each such instance:\n  (a) confirm a nonzero homomorphism Cl(O) ->\
      \ Z/N exists, by computing the\n      structure of Cl(O) and exhibiting its Z/N-quotients; count\
      \ them;\n  (b) ask whether any is CANONICAL -- i.e. determined by (E, P, N) with no\n      arbitrary\
      \ choice. Test operationally: recompute the quotient from a\n      DIFFERENT but equivalent\
      \ presentation of Cl(O) (different generator\n      set, different reduction convention) and\
      \ check whether the same\n      quotient map is obtained. A \"canonical\" map must be presentation\n\
      \      independent;\n  (c) if a canonical map is found, test whether composing it with any\n\
      \      publicly computable instance-to-Cl(O) map is non-constant in k --\n      which loops\
      \ back to OBS-1 of IDEA-20260807-5d7606.\nPREDICTED: (a) yes, (b) no, (c) moot. A YES at (b)\
      \ is the single most valuable outcome in this lane and would be escalated immediately.\nSTEP\
      \ 6 (zero compute). Record the residual class (E2) with its priced ceiling, and hand it to the\
      \ R1 lanes."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - planted-bridge synthetic family -- MUST show the 1/4 exponent and MUST decay to 1/2 as M -> 1
  - kangaroo cost-model calibration against 2 sqrt(W) before any hypothetical is priced
  - presentation-independence test for any candidate canonical quotient (two generator sets, two reduction
    conventions)
  - rho baseline at 0.886 sqrt(N) on the same instances
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, and it is a PLANTED-BRIDGE control because
    the predicted result is a null. Construct a synthetic instance family in which a bridge EXISTS
    BY CONSTRUCTION: take an abstract cyclic group A of order N, a subgroup B <= A of index M with
    M | h, and define a fake "class coordinate" chi(Q) := (k mod M) mapped into a fixed Z/M-quotient
    of a synthetic Cl of order h with M | h. Run the entire detection and exponent-accounting pipeline
    on that family. It MUST report a non-constant bridge, MUST recover k mod M, and the measured total
    solve cost MUST fall to ~ sqrt(h) + sqrt(N/M). A pipeline that fails to recover the planted half
    is blind and every null it reports on real curves is void: the run set is INVALID, not negative.
    DECAY PARAMETER: M, the modulus the planted bridge carries. As M -> 1 the measured speedup must
    decay to 1 and the recovered-bit count to 0. A reported speedup that does NOT decay as M -> 1
    is the canonical artifact tell and indicates the harness is leaking k through the instance generator.'
  independent_variables: []
  metrics:
    primary:
    - h(O), N, c, gcd(N,h), log2 h/log2 N per instance
    - kangaroo operation counts, full interval and half interval
    - planted-family total cost versus N, with fitted exponent and CI
    - escape-set size, and per-instance quotient counts and presentation-independence verdicts
    secondary:
    - decay curve of planted speedup against M
  heuristic_under_test: null
  preregistered_prediction:
    quantity: log2 h(O) / log2 N over toy ordinary curves with cofactor c <= 8
    formula: Concentrated in [0.40, 0.60] with median within 0.05 of 0.50 at the largest toy p. A
      median outside that band means the quadratic gap is not the right model at these sizes and the
      prize accounting must be redone with the measured exponent.
    source: pre-registered in IDEA-20260807-bbdcf3 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - TWO DIFFERENT p^{1/4}s. KN-TECH-029's p^{1/4} is the supersingular isogeny problem via the F_p-subgraph
    (Delfs-Galbraith) and the Biasse-Jao-Sankar quantum bound. The p^{1/4} here is sqrt(h) on an ORDINARY
    class plus kangaroo. Reporting one as the other would be a serious error and the write-up must
    name which is meant every time.
  - TOY-SCALE h IS SMALL AND NOISY. Cohen-Lenstra-type fluctuation in h(D) is large at small |D|,
    so log2 h / log2 N has heavy spread. Report the full distribution, never a single instance.
  - VOLCANO LEVEL CHANGES h. Curves in one class at different levels have different O and different
    h(O). Stratify, and use the conductor formula to predict the level-to-level ratio as a check on
    the implementation.
  - COFACTOR SELECTION. Instances in the escape regime are found by searching for large cofactors
    and are unrepresentative by construction. Every statistic on them is conditional on that search
    and must say so.
  - ACTION-EVALUATION COST. The prize counts sqrt(h) ACTION EVALUATIONS, not group operations. One
    action evaluation is polynomial but much more expensive than a point addition. A prize quoted
    in mixed units would be dishonest; the record fixes the unit and carries the conversion.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Concentrated in [0.40, 0.60] with median within 0.05 of 0.50 at the largest toy
    p. A median outside that band means the quadratic gap is not the right model at these sizes and
    the prize accounting must be redone with the measured exponent.
  falsification_criterion:
  - A presentation-independent (canonical) Z/N-quotient of Cl(O) is found in the escape regime AND
    composes with a publicly computable instance map to give something non-constant in k. The lane
    is LIVE; escalate to independent review before any further interpretation.
  - The planted family fails to exhibit the 1/4 exponent. The cost model is wrong; the prize in (B)
    is not established and must be withdrawn until the model is fixed. This does not resurrect the
    bridge, but it voids the quantitative half of the record.
  - log2 h / log2 N is measured far from 1/2 at the largest toy p in a way that persists as p grows.
    The quadratic gap model is wrong at these sizes; rescope every statement that used it.
  - A red-team argument shows (C3) can be weakened to a non-homomorphic condition that still yields
    a congruence. OBS-5 no longer covers the route; the record is superseded, and the ceiling (which
    is unconditional) is what survives.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-bbdcf3
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
