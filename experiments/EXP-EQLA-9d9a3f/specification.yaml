experiment:
  id: EXP-EQLA-9d9a3f
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-d6956c
  question_id: RQ-EQLA-0d3f40
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: DOES THE FACTOR g SURVIVE BEING CHARGED? The phi-stable factor base needs only B/g relations
    instead of B, but only if folded relations arrive independently and only if the orbit constraint
    does not depress the decomposition rate - measure the rank-arrival excess and the density penalty
    together and report the single number that decides the lane, (density penalty) / g, which the
    program's own prior measurements place at almost exactly 1
  status: draft
  objective: "(A) THE ONLY SAVING THE LANE HAS, AND ITS TWO PRECONDITIONS. On a phi-stable factor\
    \ base of size B with orbit length g, the factor-base logarithms are determined by B/g independent\
    \ unknowns (IDEA-20260807-0e4d83), so B/g relations suffice where a generic base of size B needs\
    \ B. That factor g is the whole relation-side content of the L5 lane. It is real ONLY IF both\
    \ of these hold:\n  PRECONDITION 1 (INDEPENDENCE). Folded relation rows arrive like generic\n\
    \    vectors of their weight in F_N^{B/g}, so that B/g + O(1) of them reach\n    full informative\
    \ rank. If instead the excess grows with B, more\n    relations are needed and the factor g is\
    \ partly or wholly eaten.\n  PRECONDITION 2 (DENSITY). A random target decomposes over the phi-stable\n\
    \    base of size B at the same rate as over a generic base of the same size\n    B. If the orbit\
    \ constraint depresses the rate by a factor delta, each\n    relation costs delta times more and\
    \ the net relation-side saving is\n    g / delta, not g.\nNET RELATION-SIDE SAVING = g / (delta\
    \ * (1 + excess / (B/g))). THE PROGRAM'S OWN PRIOR NUMBERS PUT THIS AT ABOUT 1. EV-STR-002 recorded\
    \ a \"density penalty ~2-3x\"; g = 3. If delta = 3 the saving is exactly zero. Nobody has measured\
    \ delta and the excess together, on matched arms, with the denominator being INFORMATIVE rank\
    \ rather than row count - and until that is done the lane does not know whether its one claimed\
    \ saving exists.\n(B) WHY THE EXISTING MEASUREMENT DOES NOT SETTLE IT. EV-STR-003 O-11 reports\
    \ \"the one reproducible effect ... searches per relation row, phi arm against random arm, 0.692/1.811,\
    \ 0.364/1.154, 0.383/1.136 and 0.770/2.466 - ratios 2.62x, 3.17x, 2.97x and 3.20x, i.e. r = 3\
    \ at every instance\". That denominator is ROWS. Two of every three rows on the phi arm are sigma-shifts\
    \ of the third and contribute exactly zero informative rank (IDEA-20260807-0e4d83, FACT 2). So\
    \ the measured factor 3 in searches-per-row is exactly what a 3-fold row-inflation produces, and\
    \ it is consistent with a searches-per-INFORMATION ratio of 1.0 - no saving at all - and equally\
    \ consistent with a genuine 3x. The two readings differ by a factor of 9 and the committed data\
    \ cannot distinguish them, because the informative denominator was never computed. This proposal\
    \ computes it.\n(C) THE THIRD EFFECT, WHICH IS NEW AND MAY CUT EITHER WAY. Folding can ANNIHILATE\
    \ columns. The fold is tilde-r_s = sum_{t=0}^{g-1} lambda^t r_{sigma^t(i_s)}. A relation whose\
    \ support meets orbit s in ALL g positions with equal coefficients folds to 1 + lambda + ... +\
    \ lambda^{g-1} = 0 in that column - the column vanishes. A relation meeting an orbit in 2 of 3\
    \ positions folds to 1 + lambda != 0 but with a DIFFERENT coefficient from a single hit. So the\
    \ folded matrix has a different weight law from the unfolded one, with a computable rate of column\
    \ annihilation, and the annihilation is exactly what produces the free relations of IDEA-20260807-61049d\
    \ when the whole row is one orbit. Predicted rate of a weight-m relation meeting some orbit in\
    \ all g positions: about C(m, g) (g/B)^{g-1} for m >= g - negligible at large B, non-negligible\
    \ at the toy B values this lane has used, which is precisely where its numbers come from. Measuring\
    \ it is cheap and it is a candidate explanation for the rank deficiencies of 4, 6, 30 and 67 that\
    \ EV-STR-003 O-9 recorded without explanation.\n(D) THE DECISION THIS PRODUCES. One number:\n\
    \  charged_searches_per_unit_informative_rank(phi arm)\n  --------------------------------------------------\
    \ =: RHO\n  charged_searches_per_unit_informative_rank(generic arm, same B)\nRHO < 1 means the\
    \ phi structure genuinely buys relation-collection work and the lane has a real, if constant,\
    \ saving of 1/RHO. RHO >= 1 means it does not, and then the entire L5 lane reduces to a factor\
    \ g^2 = 9 on a stage that EV-STR-001 measured at 0.4% to 3% of the charged total - a total effect\
    \ under 3%, which is a closure on cost grounds with the obstruction being arithmetic rather than\
    \ algebraic. Both outcomes are deliverables and both are stated before measurement."
  resource_label: 'R1 + R3. R1: the factor base is defined by x-coordinates as field elements and
    the orbit constraint is a condition on those field elements; the decomposition rate is a statement
    about field data. R3: the fold weights are powers of lambda, an invariant of End(E) acting on
    G.'
  admissibility: admissible
  admissibility_argument: 'Admissible with the ceiling attached. The measured quantities are rates
    of decomposition over sets of field elements and ranks over F_N - neither is a group-oracle output,
    and the orbit is generated by field multiplication. The resource is therefore genuinely non-generic.
    Its VALUE, however, is capped by the same argument that closes the lane''s other proposals: the
    informational content of the orbit structure is generic-group simulable (KN-FIND-b7e091 Oracle
    D), so no exponent can arise and none is claimed. The honest statement is that this record measures
    whether a bounded constant is 1 or 3, and says so.'
  reachability_gate: 'T5''s isogeny-walk form does not apply: one curve, all three arms on it, no
    movement between curves. T4 binds: the orbit structure requires D_0 = -3 (g = 3) or D_0 = -4 (g
    = 2 on x-coordinates), class-determined and unreachable from a generic curve at any cost, so ARM
    PHI does not exist for a generic prime-field curve and ARM GEN is the only arm there. Within the
    D_0 = -3 family the object is free: the orbit-closed factor base costs B multiplications by zeta.
    SCOPE NOTE, not an attack claim: secp256k1 has a = 0 and lies in the family; this record''s own
    predicted outcome is that the relation-side saving there is 1, i.e. none.'
  inputs:
    procedure: 'STAGE 0 (zero compute): freeze the RHO bands, the low-power exclusion rule and the
      target budget computed from the expected hit rate. Pre-registration is what makes the decision
      meaningful and EV-STR-003 recorded a pre-registration limitation in exactly this lane. STAGE
      1 (minutes, HARD GATE): the planted-dependency positive control - inject k dependent folded
      rows, confirm the excess rises by exactly k. STAGE 2 (hours, the main run): three arms at matched
      B, at three B values spanning an order of magnitude, at least 5 seeds each, with the declared
      target budget. Emit per-attempt records so that arrival curves, not just endpoints, are archived.
      STAGE 3 (minutes): compute delta, excess, RHO, and RHO against ARM QUOT. STAGE 4 (minutes):
      the (C) side-effect measurements - orbit-collision rates, folded weight law, annihilated columns.
      STAGE 5 (hours at small p only): the sumset coverage enumeration for HEUR-L5-11, which is what
      made EV-STR-001 decisive and which no later record in this lane has repeated. STAGE 6 (minutes):
      the c-sweep decay test using the IDEA-20260807-1e673d generator for the matrix side and a graded
      factor-base construction for the curve side. This is the most compute-expensive record in the
      L5 set and it is still hours of pure Python at toy scale, because the arms share every code
      path.'
    mechanism: "STEP 1. Matched arms at identical B, identical curve, identical arity, identical search\
      \ budget:\n  ARM PHI    - factor base = B/g complete phi-orbits (B columns, B/g unknowns)\n\
      \  ARM GEN    - factor base = B x-coordinates drawn by the generic rule\n               (B columns,\
      \ B unknowns)\n  ARM QUOT   - factor base = B/g x-coordinates drawn by the generic rule\n  \
      \             (B/g columns, B/g unknowns) - the SIZE-OF-QUOTIENT control,\n               which\
      \ isolates whether the phi arm's advantage is anything\n               more than having fewer\
      \ unknowns\nARM QUOT is the control the lane has never run and it is the sharpest one: if ARM\
      \ PHI and ARM QUOT have the same arrival curve per unit search, the phi structure contributes\
      \ exactly nothing beyond shrinking the unknown count, and the correct algorithm was always \"\
      use a smaller factor base\".\nSTEP 2. Measure, per arm, per attempt: decomposition found (yes/no),\
      \ the support, the folded row, and the informative-rank increment. Emit the arrival curve A(t)\
      \ directly.\nSTEP 3. Extract the three numbers:\n  delta  = hit_rate(ARM GEN) / hit_rate(ARM\
      \ PHI)          [density penalty]\n  excess = (base relations at which A first reaches its arm's\
      \ target)\n           minus the target                                [independence]\n  RHO\
      \    = (attempts per unit informative rank on ARM PHI)\n           / (attempts per unit informative\
      \ rank on ARM GEN)\nand report RHO against ARM QUOT as well.\nSTEP 4. Measure the folding side-effects\
      \ of (C): the fraction of harvested relations whose support meets some orbit in 2 positions\
      \ and in g positions; the folded row-weight law against the unfolded one; the number of columns\
      \ annihilated by folding; and whether annihilation correlates with the informative-rank increments\
      \ that failed to fire.\nSTEP 5. The nulls and the decay sweep (see null_object_control), then\
      \ the single decision: RHO < 1 or RHO >= 1, with the pre-registered inconclusive band declared\
      \ in advance.\nSTEP 6. Charge honestly. Report the linear-algebra share of the charged total\
      \ for each arm using the measured attempt counts and the measured solve costs, so that the g^2\
      \ linear-algebra factor is placed against the share it applies to - which EV-STR-001 measured\
      \ at 0.4% to 3% and which nothing in this record is expected to change."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - ARM QUOT - generic factor base of size B/g, same unknowns, no structure
  - ARM GEN - generic factor base of size B, the size-matched control
  - NULL 2 - matched random matrix through the same rank-arrival code
  - planted-dependency positive control of declared size k
  - c-sweep over factor-base orbit-closure fraction as the decay test
  - zero-hit and low-power cells reported explicitly, following EV-STR-001's practice of recording
    14 of 36 zero-hit instances rather than smoothing
  - matched Pollard rho with negation (0.886 sqrt(N/6) on these curves) and matched BSGS, in group
    operations, for the Pareto row
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. NULL 1 - ARM QUOT, the size-of-quotient
    control: a GENERIC factor base of size B/g on the same curve with the same arity and budget. It
    has the same number of unknowns as ARM PHI and none of its structure. PREDICTED: the same arrival
    curve per unit search as ARM PHI, within seed noise. If so, the phi structure contributes nothing
    beyond the unknown count and the lane''s relation-side content is exactly "use a smaller factor
    base", which needs no endomorphism at all. NULL 2 - MATCHED RANDOM MATRIX with identical shape,
    density and column-orbit partition (from the generator of IDEA-20260807-1e673d), fed through the
    same rank-arrival code. It supplies the reference excess for genuinely random rows and hence the
    baseline against which ARM PHI''s excess is judged. The excess of a random sparse matrix over
    F_N is O(1) with a known distribution; a measured phi-arm excess indistinguishable from it means
    PRECONDITION 1 holds. DECAY PARAMETER: the orbit closure fraction c of the FACTOR BASE - the fraction
    of factor-base elements that lie in complete orbits, swept from 0 (a generic base) to 1 (fully
    orbit-closed). Every quantity attributed to the phi structure - delta, the annihilation rate,
    the folded weight law - must vary monotonically in c and must equal its ARM GEN value at c = 0.
    A quantity that is flat in c is not measuring the orbit structure. PLANTED POSITIVE: inject a
    set of relations constructed to be linearly dependent after folding by a declared amount k. The
    measured excess must rise by exactly k. An instrument that does not see a planted dependency cannot
    certify independence, and every PRECONDITION 1 verdict it returns is void.'
  independent_variables: []
  metrics:
    primary:
    - hit count, attempt count and hit rate per arm per cell
    - delta with its standard error
    - arrival curve A(t) per arm per seed, archived per attempt
    - excess per arm per seed, with the empirical defect distribution
    secondary:
    - RHO against ARM GEN and against ARM QUOT, with bands applied
    - orbit-collision rates at 2 and at g positions
    - folded and unfolded row weight distributions; annihilated column count
    - m-fold sumset coverage and maximum multiplicity per arm (small p only)
    - linear-algebra share of the charged total per arm
    - sha256 of each factor base and each row list
    - matched rho and BSGS group-operation counts and BSGS memory
  heuristic_under_test: null
  preregistered_prediction:
    quantity: delta = hit_rate(ARM GEN) / hit_rate(ARM PHI) at matched B
    formula: 'PREDICTED in [1, 4] and most likely near 1. The reasoning: the phi-orbit constraint
      does not restrict which m-subsets are admissible (unlike the AP constraint of EV-STR-001), it
      only correlates the factor base''s positions in F_p; if the orbits are equidistributed, delta
      should be close to 1, and EV-STR-002''s "2-3x" would then be a small-B or insufficient-target
      artifact. A measured delta above 4 puts the lane in the EV-STR-001 regime and closes the relation-side
      saving outright.'
    source: pre-registered in IDEA-20260807-d6956c before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - INSUFFICIENT TARGETS. EV-STR-002's density penalty is explicitly recorded as measured with too
    few targets at large B. A repeat of that error would make delta meaningless. The target budget
    is pre-computed and declared.
  - SHARED TARGET SEQUENCE. If the arms are run on different random targets, target-to-target variance
    contaminates delta. The arms must consume the SAME target sequence, which also makes the comparison
    paired and much tighter.
  - B = ceil(sqrt(N)) IS NOT A NEUTRAL CHOICE. IDEA-20260727-001's confounder list notes that at that
    B the relation COUNT alone is sqrt(N), already equal to matched rho before any solve cost. Any
    end-to-end statement at that B is predetermined; this record therefore reports a RATIO between
    arms at fixed B and does not attempt an end-to-end verdict.
  - TOY-SCALE HIT RATES. At small p the hit rate can be so high that the factor base's shape barely
    matters, or so low that no cell has power. Three B values spanning an order of magnitude, with
    the low-power exclusion rule, exist to detect this.
  - COLUMN ANNIHILATION AT SMALL B. The (C) effect scales as (g/B)^{g-1} and is therefore a toy-scale
    artifact by construction. Any conclusion drawn from it must be labelled as applying to the toy
    regime and NOT extrapolated - the honest reading is that it may explain past toy measurements,
    not that it matters at scale.
  - DEDUPLICATION. The committed harness deduplicates rows; a deduplicated harvest understates attempts
    per unit rank on whichever arm produces more duplicates, which is the phi arm by construction.
    Dedup must be off or logged per row.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'PREDICTED in [1, 4] and most likely near 1. The reasoning: the phi-orbit constraint
    does not restrict which m-subsets are admissible (unlike the AP constraint of EV-STR-001), it
    only correlates the factor base''s positions in F_p; if the orbits are equidistributed, delta
    should be close to 1, and EV-STR-002''s "2-3x" would then be a small-B or insufficient-target
    artifact. A measured delta above 4 puts the lane in the EV-STR-001 regime and closes the relation-side
    saving outright.'
  falsification_criterion:
  - The planted-dependency control does not raise the measured excess by exactly k. The independence
    instrument is broken; every PRECONDITION 1 verdict is void and nothing about the factor g is established.
  - RHO lands at or above 0.9. The relation-side factor g does not survive being charged; the L5 lane's
    total content is the g^2 linear-algebra factor on a 0.4-3% stage, i.e. under 3% of a charged total,
    and that is a closure on arithmetic grounds. This is the predicted outcome.
  - RHO lands at or below 0.5. The phi structure buys genuine relation- collection work; independent
    review before any interpretation; the lane reopens with a measured constant.
  - The excess grows measurably with B on ARM PHI and not on NULL 2. Folded relations are systematically
    dependent for a reason not yet identified; that reason becomes the lane's next question and the
    factor g is correspondingly reduced by a measured amount.
  - ARM PHI and ARM QUOT differ materially. Then the phi structure does something a smaller generic
    factor base does not, which is the one result in this record that would be genuinely surprising
    and would require replication before interpretation.
  - delta exceeds 4. The lane enters the EV-STR-001 regime (supply/coverage failure) and the sumset
    coverage measurement of STAGE 5 becomes the decisive follow-up rather than a control.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-d6956c
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
