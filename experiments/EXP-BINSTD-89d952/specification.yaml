# =============================================================================
# EXP-BINSTD-89d952 -- VERSION 1 (APPROVED by DEC-20261001-cd5f55) frozen
# contract for H-BINSTD-a177b6: Stage 0 HOLD-T corrected affordability table
# (no /mu) + cancelation + stable-V census; Stage 1 n=19 m=3 l=5 two-arm
# pure-Python S_4/W_4 shape-blind cost control; Stage 2 feasibility /
# instrument_unavailable. Source IDEA-20260922-493606 under RQ-BINSTD-b6f698
# / GOAL-ECDLP2M-001. Absorbs HOLD-T defects from
# analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-493606.yaml
# (verdict defective / return_for_revision).
#
# ZERO RUNS in this design packet. Stages 0-2 authorized for later executor
# TASK-20261001-e15653. No AUXIN. Amazon Bedrock prohibited.
# packaging_only false.
#
# certificate.kind vocabulary (docs/claims-and-verification.md):
#   discrete_log | decomposition | key_recovery | none
# Verified planted finds may use decomposition; pure cost/refutation
# observations use none. Do NOT invent non-vocabulary kinds.
# =============================================================================
experiment:
  id: EXP-BINSTD-89d952
  hypothesis_id: H-BINSTD-a177b6
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-493606
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Stage 0 HOLD-T table without /mu + cancelation + stable-V census;
    Stage 1 n=19 m=3 l=5 Koblitz vs ordinary S_4/W_4 arm_ratio~1 control;
    Stage 2 feasibility / instrument_unavailable
  status: analyzed
  approved_by: DEC-20261001-cd5f55
  approved_at: '2026-10-01'
  analyzed_by: DEC-20261001-6ebb11
  analyzed_at: '2026-10-01'
  analyzed_note: >-
    EV-BINSTD-5cd3c9 / DEC-20261001-6ebb11: Stages 0-2 terminal; Stage 0
    gates pass; Stage 1 DO-5 instrument_unavailable; decision refine.

  packaging_only: false
  approval:
    approved_by: DEC-20261001-cd5f55
    composing_decision: DEC-20261001-cd5f55
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. HOLD-T defects absorbed. Does NOT
      claim a break or rho competitiveness. Source /mu differential is the
      named falsifiable alternative, not the primary success criterion.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stages 0-2. Stage 0 is arithmetic/census (zero scientific group walks
      on deployed curves). Stage 1 is toy n=19 only. Stage 2 is feasibility /
      instrument_unavailable reporting. CNF-XOR/WDSat arms are NOT authorized
      as success dependencies. n in {29,37} FORBIDDEN as Frobenius-stable
      measurement cells. Deployed-curve attacks and exponent claims are NOT
      authorized. Amazon Bedrock prohibited.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (A) Commit the HOLD-T-corrected affordability table 2^{ml}/m! (no /mu),
    show orbit cancelation, and census stable-V emptiness at n=29,37.
    (B) At n=19,m=3,l=5 measure Koblitz vs ordinary S_4/W_4 cost with
    pre-registered arm_ratio in [0.8,1.25] (shape-blind equality).
    (C) Reject the source /mu alternative unless arm_ratio < 1/38 with
    certificates (escalate). Report instrument_unavailable honestly.

  class: control-measurement
  class_note: >-
    Shape-blind control measurement with corrected accounting. Not a
    smoothness-CDF heuristic-validation of an asymptotic attack, and not a
    cost-model claiming cryptanalytic impact. HEUR ids are falsification
    hooks. Measured vs recomputed vs inherited columns stay separate. No
    exponent-moving claim. Source shape-differential is named alternative.

  corrections_absorbed:
    remove_mu_column: >-
      HOLD-T: per-instance divisor mu=n does not exist (a77711 A1/A2);
      table uses 2^{ml}/m! only; cancelation shown explicitly.
    forbid_n_29_37: >-
      HOLD-T: n=37 and n=29 host no mid-dimension tau-stable V; forbidden
      as Frobenius-indexed measurement cells.
    instrument_replan: >-
      HOLD-T: WDSat/CaDiCaL missing; Stage 1 uses pure-Python S_4/W_4 from
      EXP-CERTBIN-e94b27; feasibility is first metric.
    anchor_honesty: >-
      HOLD-T: b40e6d ~2.8e6 is a design estimate, labelled unmeasured.
    primary_prediction_equality: >-
      HOLD-T: arm_ratio ~1 is the primary prediction; source differential
      is the falsifiable alternative.
    successor_seam: >-
      HOLD-T: true m>=4 measurement without symmetry claim routes to
      CERTBIN S_5 extension; this packet does not close that gap.

  scope:
    included:
      - >-
        Stage 0 (arithmetic; zero scientific trials on deployed curves):
        (i) write corrected affordability table for frozen (m,l) cells;
        (ii) show cancelation n*2^{ml}/(m!*n)=2^{ml}/m!;
        (iii) recompute ord_n(2) and mid-dim stable-V emptiness for
        n in {17,19,23,29,31,37,41}; (iv) note b40e6d as design estimate;
        (v) methodological note (HOLD-T, no CNF-XOR, no rho claim).
      - >-
        Stage 1 (toy executable): two-arm S_4/W_4 at n=19,m=3,l=5 —
        ordinary CERTBIN cell vs Koblitz y^2+xy=x^3+1; 100 targets/arm;
        5 seeds; planted+random; dual random-V null; certificate-verify
        finds; report arm_ratio, refutation_rate, ops_per_attempt.
      - >-
        Stage 2: feasibility / peak_rss / instrument_unavailable report
        for S_4 Macaulay at 15 variables; optional within-budget seed
        replication summary.
    excluded:
      - CNF-XOR / WDSat / CaDiCaL leaf-count arms as success criteria
      - Measurement cells at n in {29, 37} claiming tau-stable mid-dim V
      - Any scientific attack run on deployed curves (n>=131)
      - Filing a break claim or rho-competitiveness claim
      - Editing AUXIN / source IDEA claim text / prior EXP-BINSTD packets
      - Amazon Bedrock
      - Treating recalled literature as retrieved without verified_by
      - Using non-vocabulary certificate.kind values on run manifests
      - Silently treating unexpected arm_ratio < 0.5 as support of source /mu

  inputs:
    proposal: ledger/proposals/IDEA-20260922-493606.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-493606.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-a177b6.yaml
    idea_a77711: ledger/proposals/IDEA-20260906-a77711.yaml
    idea_7ab503_corrected: ledger/hypotheses/H-BINSTD-74b002.yaml
    kn_find_47da4e: knowledge/findings/KN-FIND-47da4e.md
    idea_32f96d: ledger/proposals/IDEA-20260807-32f96d.yaml
    optional_code_refs:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/macaulay.py
      - experiments/EXP-CERTBIN-e94b27/impl/closure.py
      - experiments/EXP-CERTBIN-e94b27/impl/common.py
    cells:
      Stage0-corrected-table:
        frozen_entries:
          - {m: 3, l: 8, formula: '2**(m*l)//math.factorial(m)', value: 2796202}
          - {m: 4, l: 8, formula: '2**(m*l)//math.factorial(m)', value: 178956970}
          - {m: 5, l: 6, formula: '2**(m*l)//math.factorial(m)', value: 8947848}
          - {m: 4, l: 5, formula: '2**(m*l)//math.factorial(m)', value: 43690}
        cancelation: 'n * 2**(m*l) / (math.factorial(m) * n) == 2**(m*l) / math.factorial(m)'
        note: >-
          Integer floor values; floating review numbers 2,796,202.7 etc. are
          the same quotients. Source /mu columns deliberately absent.
      Stage0-stable-v-census:
        n_list: [17, 19, 23, 29, 31, 37, 41]
        expected_empty_mid_dim: [29, 37]
        stage1_n: 19
        stage1_note: >-
          ord_19(2)=18; no mid-dim stable V claimed; Stage 1 uses random
          polynomial-basis V of dim 5, not a tau-stable subspace.
      Stage1-two-arm:
        n: 19
        m: 3
        l: 5
        targets_per_arm: 100
        planted_fraction: 0.5
        v_dim: 5
        admissibility: 'm*(l-1)=12 <= 19'
        ordinary:
          A: 46693
          B: 306147
          h: 2
          note: DEC-20260926-901ea1 SUPPORT cell (review)
        koblitz:
          equation: 'y^2 + x*y = x^3 + 1'
          order_hint: '4 * 130873 with 130873 prime (review-computed; Stage 1 re-verifies)'
        seeds: [20260922, 20260926, 20261001, 20261002, 20261003]
        watchdog_seconds_per_target: 120
      Stage2-feasibility:
        inherit: Stage1-two-arm
        report: peak_rss_bytes, macaulay_build_ok, instrument_unavailable

  controls:
    - name: within_arm_second_random_V
      object: >-
        Second random 5-dim V on the same arm bounds run-to-run spread
        before any cross-arm difference is read.
    - name: planted_decomposable_targets
      object: >-
        Half of targets planted as sum of three V-points; solver must find
        what exhaustive enumeration finds (soundness).
    - name: exhaustive_ground_truth
      object: >-
        3-fold enumeration over V (unordered triples) for planted targets;
        certificate-verify every claimed find independently of the solver.
    - name: forbidden_n_guard
      object: >-
        n in {29,37} must not appear as Frobenius-stable measurement cells.
    - name: certificate_kind_vocabulary
      object: >-
        Every run manifest result.certificate.kind is one of
        discrete_log | decomposition | key_recovery | none.
    - name: no_mu_encoding
      object: >-
        Stage 1 MUST NOT encode a per-instance mu-orbit / canonical-
        representative constraint; that is the unsound source IDEA form.
    - name: rho_claim_guard
      object: >-
        No artifact may claim competitiveness with rho or a deployed break.

  independent_variables:
    - stage  # 0 | 1 | 2
    - arm  # ordinary | koblitz
    - seed
    - v_draw  # primary | null_second
    - target_kind  # planted | random

  metrics:
    primary:
      - stage0_table_match
      - stage0_cancelation_pass
      - stage0_census_empty_29_37
      - arm_ratio_ops_median
      - refutation_rate_per_arm
      - certificate_pass_rate
      - source_mu_alternative_rejected
    secondary:
      - ops_per_attempt_median
      - ops_per_attempt_max
      - peak_rss_bytes
      - wall_s
      - termination_reason
      - instrument_unavailable
      - macaulay_build_ok
      - within_arm_v_null_spread

  heuristic_under_test:
    - HEUR-BINSTD-a177b6-H0
    - HEUR-BINSTD-a177b6-H1
    - HEUR-BINSTD-a177b6-H2

  preregistered_prediction:
    quantity: >-
      (A) Stage 0 table entries equal floor(2^{ml}/m!) for frozen cells;
      cancelation identity holds; n=29,37 empty for mid-dim V;
      (B) Stage 1 arm_ratio in [0.8, 1.25] when both arms complete;
      (C) source /mu alternative (arm_ratio ~ 1/n) rejected unless
      arm_ratio < 1/38 with certificates (escalate);
      (D) certificate_pass_rate = 1.0;
      (E) NO break / rho-competitiveness claim under any outcome;
      (F) instrument_unavailable allowed as infrastructure (DO-5).
    formula: >-
      N_leaf_corrected(m,l) = 2**(m*l) / factorial(m);
      cancelation: n * N_leaf_corrected / n = N_leaf_corrected;
      arm_ratio = median(ops_koblitz) / median(ops_ordinary).
    source: >-
      HOLD-T review concrete_experiment + H-BINSTD-a177b6; a77711 cancelation
    claim_tier: observational
    measured_vs_modeled: >-
      Stage 0 table and census are RECOMPUTED arithmetic (labeled
      recomputed); source IDEA /mu numbers are INHERITED rejected
      comparators in a separate column. Stage 1 ops/refutation rates are
      MEASURED. Any modeled 2^{ml}/m! leaf counts stay in a separate
      labeled column and are NOT mixed with measured S_4 op counts.

  scale_relevance:
    tier: toy
    justification: >-
      Stage 0 is number theory / integer arithmetic. Stage 1–2 are n=19
      toys chosen by HOLD-T as the cheapest shape-control cell that does
      not require a tau-stable V. No transfer of measured costs to
      deployed n>=131 is claimed. Corrected accounting at large n is the
      same cancelation identity, already frozen under H-BINSTD-74b002.
    correspondence: null

  sample_size_justification: >-
    Stage 0: complete census of the frozen n-list and four table cells.
    Stage 1: 100 targets/arm × 5 seeds is the HOLD-T concrete plan; expected
    to resolve arm_ratio within the null band vs a factor-n win (1/19) with
    large separation if either prediction holds. Within-arm second V is the
    spread control.

  tail_checks:
    - Any Stage 0 table cell mismatch is a hard fail (not averaged).
    - Report max ops_per_attempt per arm separately from the median.
    - >-
      Watchdog-dominated arms: report instrument_unavailable / censored;
      do not treat as negative math evidence (rule 3).
    - arm_ratio < 0.5 replicated → escalate, do not invent a mu story.

  replication:
    seeds:
      - 20260922
      - 20260926
      - 20261001
      - 20261002
      - 20261003
    independent_instances: >-
      Stage 0 deterministic. Stage 1 primary seed 20260922; remaining seeds
      replicate arm_ratio. Within each seed, primary V and null_second V.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 24
    maximum_workers: 1

  stopping_rules:
    - >-
      Stage 0 complete when corrected-table.yaml, cancelation-certificate.yaml,
      stable-v-census.yaml, and methodological-note.md are written.
    - >-
      Stage 1 complete when arm-comparison.yaml, per-arm metrics, and
      controls-report.yaml are written OR instrument_unavailable.yaml
      documents S_4/W_4 infeasibility.
    - >-
      Stage 2 may start after stage1/ exists (or after Stage 1
      instrument_unavailable). Complete when feasibility-report.yaml is
      written.
    - Advisory wall-clock: checkpoint and report; never fabricate completion.
    - Hard stop if Stage 0 table/census fails.

  invalidation_rules:
    - Stage 0 table disagreeing with floor(2^{ml}/m!) on a frozen cell
    - Stage 0 cancelation identity failing as written
    - Dual/inherited comparison columns missing or mixed unlabeled
    - Encoding a per-instance mu-orbit constraint in Stage 1
    - Using n in {29,37} as Frobenius-stable measurement cells
    - Run manifest certificate.kind outside vocabulary
    - timeout/crash/OOM → failed_infrastructure, not negative math evidence
    - Amazon Bedrock invocation attempted → abort
    - Claiming retrieved provenance without verified_by / without reading
    - Filing a break or rho-competitiveness claim
    - Treating unexpected differential as support of source /mu without escalation

  success_criterion: >-
    Stage 0: stage0_table_match=true; stage0_cancelation_pass=true;
    stage0_census_empty_29_37=true. Stage 1: certificate_pass_rate=1.0 on
    claimed finds; arm_ratio in [0.8,1.25] OR instrument_unavailable=true
    with infrastructure reason; source_mu_alternative_rejected=true when
    both arms complete. Success does NOT include a break or rho claim, and
    does NOT require closing the m>=4 corpus gap.

  falsification_criterion: >-
    Stage 0 arithmetic/census failure; Stage 1 arm_ratio < 1/38 with
    verified certificates (escalate contradiction); certificate_pass_rate
    < 1. Distinguish infrastructure via invalidation_rules / DO-5.

  required_artifacts:
    - experiments/EXP-BINSTD-89d952/stage0/corrected-table.yaml
    - experiments/EXP-BINSTD-89d952/stage0/cancelation-certificate.yaml
    - experiments/EXP-BINSTD-89d952/stage0/stable-v-census.yaml
    - experiments/EXP-BINSTD-89d952/stage0/methodological-note.md
    - experiments/EXP-BINSTD-89d952/stage1/arm-comparison.yaml
    - experiments/EXP-BINSTD-89d952/stage1/controls-report.yaml
    - experiments/EXP-BINSTD-89d952/stage1/instrument_unavailable.yaml
    - experiments/EXP-BINSTD-89d952/stage2/feasibility-report.yaml
    - experiments/EXP-BINSTD-89d952/runs/*/manifest.yaml
    - experiments/EXP-BINSTD-89d952/runs/*/raw-result.json
    - experiments/EXP-BINSTD-89d952/runs/*/stdout.log
  required_artifacts_note: >-
    Stage 1 must produce arm-comparison.yaml OR instrument_unavailable.yaml
    (decisive paths). Prefer exactly one decisive path; a partial attempt
    may log both only if abandoned mid-run is disclosed. Stage 2
    feasibility-report.yaml always required after Stage 1 terminal state.

  procedure:
    stage0:
      - >-
        Compute floor(2**(m*l)/factorial(m)) for frozen (m,l); write
        corrected-table.yaml with an inherited rejected /mu column from the
        source IDEA for audit, clearly labeled rejected.
      - Write cancelation-certificate.yaml showing the algebra identity.
      - >-
        Recompute ord_n(2) and list mid-dim stable dimensions for n_list;
        assert 29 and 37 empty; write stable-v-census.yaml.
      - >-
        Write methodological-note.md (HOLD-T; no CNF-XOR; b40e6d estimate;
        certificate.kind vocabulary; no rho claim; successor CERTBIN seam).
    stage1:
      - Confirm stage0/ exists and Stage 0 gates passed.
      - >-
        Construct ordinary and Koblitz curves over F_{2^19}; verify order
        hints or document deviation.
      - >-
        For each seed and arm: draw V (primary + null_second); draw 100
        targets (half planted); run S_4 build + W_4 closure with watchdog;
        enumerate planted ground truth; certificate-verify finds.
      - >-
        Aggregate arm_ratio, refutation_rate, ops distributions; write
        arm-comparison.yaml and controls-report.yaml.
      - >-
        If S_4 cannot be built or watchdogs dominate both arms: write
        instrument_unavailable.yaml (infrastructure).
      - Every run manifest sets an allowed certificate.kind.
    stage2:
      - Confirm Stage 1 terminal artifact exists.
      - >-
        Write feasibility-report.yaml (peak_rss, macaulay_build_ok,
        whether further seeds were run, DO outcome id).

  optimistic_assumptions_disclosed:
    - >-
      Assuming S_4 Macaulay at 15 variables fits in 4 GiB is optimistic;
      feasibility is the first Stage-1 metric (HOLD-T estimated_cost).
    - >-
      Review's #E=4*130873 for the Koblitz cell is inherited; Stage 1 must
      re-verify or document mismatch (construction error, not a finding
      against shape-blindness).
    - >-
      Equality prediction assumes no residual shape effect beyond the false
      mu story; an unexpected differential is escalated, not absorbed.
    - >-
      Treating CNF-XOR leaf counts as interchangeable with S_4 op counts
      would be invalid; columns stay separate.

  memory_accounting: >-
    Stage 0 negligible. Stage 1–2: peak_rss_bytes measured per run;
    dominant structure is the S_4 Macaulay matrix at 15 variables over F_2
    — reconcile measured RSS against analytic size in feasibility-report.yaml.

  assigned_to: executor
  dominated_by: >-
    n/a for attack cost. Control measurement clarifying false mu story;
    sota_delta is corrected accounting + shape-blind toy check.
  sota_delta:
    time: Zero cryptanalytic movement; rejects false shape-affordability lever.
    memory: Feasibility metric only at toy scale.
    data_queries: N/A.
