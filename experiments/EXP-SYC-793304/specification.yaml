  blocker_repairs:

    PRODUCER-POLICY-RESOLUTION-BINDING:
      severity: blocking
      checkpoint_statement_verbatim: >-
        The frozen producer receipt requested coordinator-orchestration-code but
        launched gpt-5.6-sol while the frozen binding resolved that policy to
        gpt-5.6-terra. The receipt verifies a short probe, not the later
        authoring tokens; no permitted fallback or inference amendment repairs
        this mismatch.
      disposition: REPAIRED
      repair_summary: >-
        Requested policy and resolved model are written as separate fields in
        every artifact of this task. The resolution is propagated verbatim from
        committed records rather than invented, and is independently
        cross-checked against committed configuration by direct file read. The
        receipt's scope is the authoring session itself; no probe session was
        launched, so the probe-versus-authoring gap that caused the predecessor
        defect does not exist here and is recorded as none.
      requested_policy: coordinator-orchestration-code
      resolved_model_id: anthropic:claude-opus-5
      resolution_command: python3 -m orchestration.adapter resolve --role coordinator
      resolution_command_output: coordinator-orchestration-code -> anthropic:claude-opus-5 (effort=high)
      resolution_command_executed_by_this_session: false
      resolution_output_source: >-
        propagated verbatim from three committed records that carry it as a
        given: the task card task_card.resolution_command_output, the handoff
        inference.resolution_command_output, and the batch contract
        required_successor_repairs[PRODUCER-POLICY-RESOLUTION-BINDING].propagated_provenance_fact
      independent_static_cross_check:
        method: >-
          direct read of committed configuration files by this authoring
          session; no process launched, no probe performed, no digest computed
        facts_read:
          - orchestration/model-bindings.yaml defaults.backend = anthropic
          - orchestration/model-bindings.yaml bindings.anthropic.coordinator-orchestration-code.model = claude-opus-5
          - orchestration/model-bindings.yaml bindings.anthropic.coordinator-orchestration-code.provenance = runtime-verified, last_probed = null
          - orchestration/model-policies.yaml policies.coordinator-orchestration-code.reasoning_effort = high
          - .claude/agents/coordinator.md frontmatter effort = high, model = inherit
        consistency: >-
          The propagated resolution string is consistent with committed state on
          all three components (policy, backend-resolved model, effort). This is
          a configuration cross-check, not a backend probe.
      why_no_probe_is_possible_here:
        agent_file: .claude/agents/coordinator.md
        declared_tools: Read, Grep, Glob, Write, Edit, SendMessage
        consequence: >-
          This role has no command-execution tool, so this session could not
          launch a separate probe process even in principle. A
          probe-versus-authoring split is therefore not merely absent but not
          constructible in this session.
      residual_limitation_disclosed: >-
        The model binding is an authoring-session self-attestation
        cross-checked against committed configuration. It is not a third-party
        cryptographic attestation, this runtime exposes no session UUID to the
        agent and none is invented, and the anthropic binding carries
        last_probed: null so no `adapter doctor --probe` confirmation exists in
        committed state. The completion gate asked for a gap-free binding of
        requested policy, resolved model, and the authoring session, and that is
        what is delivered; it did not ask for, and this runtime cannot produce,
        an external attestation.

    HA2-EXPECTATION-NOT-TAIL:
      severity: blocking
      checkpoint_statement_verbatim: >-
        The HA-2 values are expectations only. They give no tuplewise,
        simultaneous-tail, or worst-case guarantee, so a positive-probability
        thirty-third distinct value remains compatible with the stated mean.
      disposition: REPAIRED_WITH_PROVED_UNAVAILABILITY_OF_SIMULTANEOUS_TAIL
      repair_summary: >-
        Two of the three requested contracts are supplied with justification and
        falsification conditions (a negative worst-case contract and a sharp
        tuplewise tail contract). The third, a non-vacuous simultaneous
        familywise tail, is proved unavailable from the committed hypothesis
        record, and the exact cost of its absence is stated prominently here and
        in design-repair-report.yaml. The equal-mean counterexample is retained
        as a mandatory negative KAT.
      source_hypothesis:
        id: H-SYC-b854f4
        HA-2_formal_statement_verbatim: >-
          The fixed public family/model rule has E[X]=N^(-1/3+gamma_x+o(1)); the
          decision-changing target is gamma_x>5/18 together with every Boolean
          bridge gate.
        HA-3_formal_statement_verbatim: >-
          For gamma_x<1/3, kappa_N=E[X^2]/E[X]=N^o(1), Y/max(1,X)=N^o(1), and
          p_N/E[X]=N^o(1) with exponent zero.
      frozen_literals_propagated_verbatim:
        source: >-
          ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-080a9c.yaml
          preserved_repairs.ha2_expectation_values and
          gamma_x_one_third_expectation_margin, with the bits mapping from
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-86fd69/batch.yaml
          required_successor_repairs[HA2-EXPECTATION-NOT-TAIL]
        re_derived_from_memory: false
        cap_over_expected_X_margin_gamma_x_5_over_18:
          bits_18: '64.000000000000'
          bits_21: '71.837571091800'
          bits_24: '80.634947193272'
          bits_27: '90.509667991878'
          bits_30: '101.593667325965'
        ceiling_cap_over_expected_X_margin_gamma_x_1_over_3: '32.000000000000'
        values_are: expectations_only_no_tuplewise_no_simultaneous_tail_no_worst_case
      expected_X_literals_carried_from_immutable_predecessor:
        source: >-
          experiments/EXP-SYC-b11b38/specification.yaml
          five_item_overlays.RT-68EA16-OBJ1-DERIV1-uncalibrated-against-HA2.ha2_calibration.rows,
          independently recomputed and confirmed by TASK-20260813-dec63b and
          TASK-20260813-e04de4
        finite_ladder_convention: >-
          For the arithmetic KAT only, set the unspecified o(1) correction to
          zero and use N=2^bits. These decimals are symbolic finite reference
          values, not observed estimates or rigorous finite-N tail bounds.
        rows:
          - bits: 18
            N: 262144
            L: 64
            gamma_x_5_over_18_expected_X: '0.5000000000000000'
            gamma_x_1_over_3_expected_X: '1.0000000000000000'
          - bits: 21
            N: 2097152
            L: 128
            gamma_x_5_over_18_expected_X: '0.4454493590701696'
            gamma_x_1_over_3_expected_X: '1.0000000000000000'
          - bits: 24
            N: 16777216
            L: 256
            gamma_x_5_over_18_expected_X: '0.3968502629920499'
            gamma_x_1_over_3_expected_X: '1.0000000000000000'
          - bits: 27
            N: 134217728
            L: 512
            gamma_x_5_over_18_expected_X: '0.3535533905932738'
            gamma_x_1_over_3_expected_X: '1.0000000000000000'
          - bits: 30
            N: 1073741824
            L: 1024
            gamma_x_5_over_18_expected_X: '0.3149802624737183'
            gamma_x_1_over_3_expected_X: '1.0000000000000000'
        carried_forward_serialization_limitation: >-
          Carried unchanged from TASK-20260813-dec63b: the stored bits=21
          expected-X string follows binary64 .16f formatting; exact-real decimal
          half-up rounding at sixteen places would end in 1697. This is a
          non-blocking serialization-convention limitation, and it is restated
          rather than silently normalized.

      overflow_threshold_definition:
        capacity: 32
        width: U8_0_through_31
        overflow_event: >-
          X >= 33, i.e. a thirty-third distinct retained value whose zero-based
          candidate_index is 32 and therefore outside U8_0_through_31
        rule_inherited_from: EXP-SYC-12de89
        rule: >-
          any realized tuple occupancy above 32 invalidates without truncation,
          replacement, sampling, or silent saturation
        weakened_by_this_successor: false

      contract_1_worst_case:
        id: HA2-WORSTCASE-C1
        status: SUPPLIED_AND_NEGATIVE
        kind: deterministic worst-case contract
        statement: >-
          Every retained candidate must originate from a charged
          selected_pair_comparisons event, so per-tuple occupancy is
          deterministically bounded by 8*(L-1).
        formula: selected_pair_comparisons[bits] / 98304 = 8*(L(bits)-1)
        rows:
          - {bits: 18, L: 64, bound: 504, exceeds_capacity_by: 472}
          - {bits: 21, L: 128, bound: 1016, exceeds_capacity_by: 984}
          - {bits: 24, L: 256, bound: 2040, exceeds_capacity_by: 2008}
          - {bits: 27, L: 512, bound: 4088, exceeds_capacity_by: 4056}
          - {bits: 30, L: 1024, bound: 8184, exceeds_capacity_by: 8152}
        conclusion: >-
          A worst-case contract exists and it is negative: capacity 32 is not
          worst-case adequate at any ladder size. This is a genuine contract,
          not an absence of one, and it is the reason the overflow-invalidation
          rule is mandatory rather than precautionary.
        falsification_condition: >-
          Exhibit a realized retained candidate not traceable to a charged
          selected_pair_comparisons event, or a realized tuple occupancy above
          8*(L-1). Either falsifies the event-census cost model itself.
        preserved_unweakened: true

      contract_2_tuplewise_tail:
        id: HA2-TUPLEWISE-C2
        status: SUPPLIED_SHARP_AND_NON_CERTIFYING
        kind: tuplewise (per-tuple) tail contract derived from HA-2 alone
        lemma_L1_statement: >-
          X is a nonnegative integer-valued count, so Markov's inequality gives
          P(X >= 33) <= E[X]/33 = mu/33 for any law with mean mu.
        lemma_L1_sharpness: >-
          Among nonnegative integer-valued laws with mean mu <= 33, the bound
          mu/33 is attained, so it is the best possible bound derivable from the
          mean alone. The extremal law is exactly the mandated negative KAT:
          X=33 with probability mu/33 and X=0 otherwise. No strengthening is
          available without an additional, separately stated assumption.
        assumption_number: >-
          numbered heuristic dependence: HA-2 only (mean); no independence, no
          concentration, and no higher moment is assumed by this contract
        serialization_convention: twelve decimal places, truncation of the long division
        rows:
          - {bits: 18, gamma_x: 5/18, mu: '0.5000000000000000', per_tuple_markov_bound: '0.015151515152'}
          - {bits: 21, gamma_x: 5/18, mu: '0.4454493590701696', per_tuple_markov_bound: '0.013498465426'}
          - {bits: 24, gamma_x: 5/18, mu: '0.3968502629920499', per_tuple_markov_bound: '0.012025765545'}
          - {bits: 27, gamma_x: 5/18, mu: '0.3535533905932738', per_tuple_markov_bound: '0.010713739109'}
          - {bits: 30, gamma_x: 5/18, mu: '0.3149802624737183', per_tuple_markov_bound: '0.009544856439'}
        ceiling_row: {gamma_x: 1/3, mu: '1.0000000000000000', per_tuple_markov_bound: '0.030303030303'}
        independent_corroboration: >-
          The committed Red Team report TASK-20260813-e04de4 records the same
          range endpoints for the equal-mean construction,
          gamma_5_over_18_per_tuple_overflow_probability_range
          '0.009544856439_to_0.015151515152'. That agreement is expected because
          the counterexample is precisely the Markov extremal law; it is quoted
          here as an independent recomputation of the same quantity, not as
          authority.
        certification_status: >-
          NON-CERTIFYING. A per-tuple overflow probability of order 1e-2 is not
          a safety margin; it is an overflow probability roughly one in seventy
          per tuple at the ceiling slice.
        falsification_condition: >-
          Exhibit a nonnegative integer-valued X with E[X]=mu and
          P(X >= 33) > mu/33 (impossible, so the lemma is not falsifiable), or
          show that the compiler field candidate_index is not the nonnegative
          count X that HA-2 governs (which falsifies the applicability, not the
          inequality).

      contract_3_simultaneous_tail:
        id: HA2-SIMULTANEOUS-C3
        status: NOT_SUPPLIED_AND_PROVED_UNAVAILABLE_FROM_COMMITTED_HEURISTICS
        kind: simultaneous (familywise) tail over the 98304 tuples per size
        lemma_L2_first_moment_union_bound:
          statement: >-
            A union bound over the 98304 accounting tuples per size gives
            P(any tuple overflows) <= 98304 * mu / 33 = 2978.909090909091 * mu.
          serialization_convention: six decimal places
          rows:
            - {bits: 18, gamma_x: 5/18, familywise_bound: '1489.454545'}
            - {bits: 21, gamma_x: 5/18, familywise_bound: '1326.953145'}
            - {bits: 24, gamma_x: 5/18, familywise_bound: '1182.180856'}
            - {bits: 27, gamma_x: 5/18, familywise_bound: '1053.203409'}
            - {bits: 30, gamma_x: 5/18, familywise_bound: '938.297567'}
          ceiling_row: {gamma_x: 1/3, familywise_bound: '2978.909091'}
          vacuity: >-
            Every value exceeds 1 by two to three orders of magnitude, so the
            bound is vacuous at every ladder size and at both gamma_x slices. It
            is recorded because a vacuous bound is a result, not a gap.
          non_vacuity_requirement:
            condition: mu <= 33/98304 = 11/32768
            exact_literal: '0.000335693359375'
            shortfall_factor_equals_the_familywise_bound: true
            interpretation: >-
              HA-2's mean would have to be smaller by a factor of at least
              938.297567 (bits 30) and at most 1489.454545 (bits 18) at
              gamma_x=5/18, and by 2978.909091 at the gamma_x=1/3 ceiling,
              before even a vacuity-free union bound existed. The gap is not
              marginal and cannot be closed by choosing a different ladder size
              within the frozen scope.
          union_bound_conservatism_note: >-
            The union bound requires no independence, which is why it is used
            here. HA-2 supplies no independence across tuples either, so a
            Poissonization or inclusion-exclusion refinement is not available
            as an alternative.
        lemma_L3_second_moment_route_also_vacuous:
          statement: >-
            Using HA-3's kappa_N = E[X^2]/E[X], Markov applied to X^2 gives
            P(X >= 33) = P(X^2 >= 1089) <= kappa*mu/1089, and the familywise
            bound is 98304*kappa*mu/1089. Non-vacuity requires
            kappa*mu <= 1089/98304 = 363/32768.
          exact_literal_threshold: '0.011077880859375'
          why_it_fails: >-
            For nonnegative integer X, X^2 >= X pointwise, so E[X^2] >= E[X] and
            therefore kappa >= 1 always. The smallest mu anywhere on the frozen
            ladder is 0.3149802624737183 at bits 30 under gamma_x=5/18. Hence
            kappa*mu >= 0.3149802624737183 > 0.011077880859375 at every ladder
            size and at both gamma_x slices, so the second-moment familywise
            bound is vacuous for every admissible kappa.
          conclusion: >-
            Adding HA-3's second-moment shape does not rescue the familywise
            bound. The obstruction is not the crudeness of the first moment.
        lemma_L4_zero_o1_convention_is_not_tail_safe:
          statement: >-
            The frozen zero-o(1) arithmetic convention must not be extended from
            HA-2's mean arithmetic to HA-3's kappa. Applying o(1)=0 to
            kappa_N = N^o(1) forces kappa = 1 exactly; but for a nonnegative
            integer X, E[X^2] = E[X] holds if and only if X is supported on
            {0,1} almost surely, which forces P(X >= 33) = 0.
          why_this_matters: >-
            A convention that yields P(overflow)=0 by fiat is not a certificate;
            it is the conclusion assumed. It also contradicts the design's own
            worst-case contract posture, under which occupancy up to 8*(L-1) is
            admissible. The convention is therefore admitted for HA-2 mean
            arithmetic only, exactly as the predecessor declared, and is
            explicitly refused for any tail statement.
          falsification_condition: >-
            Exhibit a nonnegative integer-valued X with E[X^2] = E[X] and
            P(X >= 2) > 0. None exists, so the degeneracy is real and the
            refusal stands.
        lemma_L5_what_would_be_required:
          statement: >-
            A non-vacuous familywise bound requires strictly more than the
            first two moments: either an explicit finite-N upper-tail assumption
            at the thirty-third value (for example a Poisson-type or exponential
            concentration statement for X), or a genuine higher-moment control,
            or an explicit dependence structure across the 98304 tuples.
          worked_bound: >-
            For any integer m >= 1, Markov on X^m gives
            P(X >= 33) <= E[X^m]/33^m, and E[X^m] >= mu for nonnegative integer
            X, with equality only in the degenerate {0,1} case of L4. Even in
            that degenerate best case, the familywise bound at bits 18 requires
            33^m >= 98304*0.5 = 49152; since 33^3 = 35937 < 49152 <= 1185921 =
            33^4, no moment order below four suffices there, and any usable
            moment order must be justified by a new assumption that does not
            exist in H-SYC-b854f4.
          status_of_that_assumption: >-
            NOT ASSUMED HERE. It is named as the required future numbered
            heuristic and its validation control, not adopted. This producer has
            no authority to approve an experiment and does not.
        mandatory_negative_kat_retained:
          id: NKAT-HA2-EQUAL-MEAN
          source: TASK-20260813-e04de4 required control CTRL-HA2-TAIL-BOUNDARY
          construction: >-
            For any displayed mean mu, let X=33 with probability mu/33 and X=0
            otherwise. Then E[X]=mu exactly, every displayed margin is preserved
            exactly, and a thirty-third distinct value occurs with positive
            probability.
          status: MANDATORY_AND_RETAINED
          full_specification_and_expected_values: verification-and-null-kats.yaml
        cost_of_the_missing_simultaneous_tail:
          - >-
            Capacity 32 is not certified adequate in any probabilistic sense at
            any ladder size, and the deterministic worst case says it is not
            adequate at all.
          - >-
            The thirty-third-distinct-value overflow rule remains mandatory and
            unavoidable: it is the only line of defence, and its firing
            probability cannot be bounded away from 1 across a full ladder.
          - >-
            No bound on the probability of mid-run invalidation exists, so
            per-attempt-cost times inverse-success-probability bookkeeping is
            unavailable. Consequently no cost, frontier, dominance, speedup, or
            advantage claim is admissible from this design even after a future
            implementation and even if that implementation runs to completion.
          - >-
            The prospective schedule of 450000 planned / 562500 hard wall
            seconds and 988 planned / 1235 hard CPU hours is exposed to
            invalidation at an unquantified probability. That is a budget risk
            this design cannot price; it is disclosed rather than assumed away.
          - >-
            Promotion gate 2 (every conditional dependence an explicit numbered
            heuristic with archived validation evidence or a scheduled
            validation experiment) is unsatisfied on the HA-2 axis, which caps
            any dependent claim below `supported` regardless of the other gates.
          - >-
            The only routes to a certificate change the frozen design and are
            therefore NOT taken here: (a) adopt a new numbered finite-N tail
            heuristic with an archived validation experiment sampling the
            occupancy distribution at ladder scale and checking tail
            consistency, or (b) widen candidate_index capacity to at least
            8*(L-1)+1, which at bits 30 means at least 8185 admissible values and
            therefore at least a 14-bit index, at least doubling the per-index
            width from U8 and so strictly worsening all three already-open
            output, archive, and communication residuals. Neither is authorized
            by this task and neither is performed.

    SYSTEM-PEAK-LIVE-CONCURRENCY:
      severity: blocking
      checkpoint_statement_verbatim: >-
        System peak must be computed as
        max_t(shared(t)+sum_j concurrent_nonshared_shard_j(t)-dedup(t)), not as
        a maximum over isolated per-shard peaks. The required KAT binds eight
        simultaneous shards, one staggered shard, and shared allocation counted
        exactly once.
      disposition: REPAIRED
      defect_being_replaced:
        predecessor_rule_verbatim: >-
          composition: maximum_over_all_concurrently_live_stage_and_shard_snapshots
          with bsgs_formula "[max(S_peak_lower,B_peak_lower), max(S_peak_upper,B_peak_upper)]"
        why_it_is_wrong: >-
          A maximum across workers is not aggregate live memory. With shared
          bytes zero and all eight non-shared shards holding one byte at the same
          instant, the per-shard maximum returns 1 while the system peak is 8.
          The defect is undercounting by up to eightfold, and a maximum over
          isolated per-shard peaks is the defect, not the fix.
      frozen_rule:
        formula: 'peak_live_bytes_system = max_t( shared(t) + sum_j concurrent_nonshared_shard_j(t) - dedup(t) )'
        index_range_j: 1 through 8
        axis_class: maximum
        scalar_collapse: forbidden
      synchronized_time_base:
        clock: >-
          one host monotonic clock (CLOCK_MONOTONIC_RAW), single source for
          every allocate and free event of the shared/setup context and of all
          eight shards
        event_model: >-
          each stream contributes timestamped signed byte deltas; shared(t) and
          each nonshared_j(t) are right-continuous step functions of t on that
          single timeline
        evaluation: >-
          the aggregate expression is evaluated at EVERY event timestamp in the
          merged event set, which is finite; a step function attains its maximum
          at an event timestamp, so the census is exact
        sampling_forbidden: >-
          periodic or poll-based peak estimation is forbidden because it can
          only undercount; a sampled census is apparatus invalidity, not a peak
        multi_host_rule: >-
          all eight shards and the shared context must execute on one host under
          one clock. If any stream is produced on a different host, no
          synchronized time base exists, the aggregate is undefined, and the
          census invalidates. No cross-host peak may be reported.
        clock_skew_tolerance: >-
          zero tolerance by construction: a single clock source is required
          rather than a bounded-skew reconciliation, because a skew bound would
          have to be measured and no measurement exists in a zero-run design
      dedup_term:
        definition: >-
          dedup(t) = sum over physical pages P live at time t of
          (c_P(t) - 1) * bytes(P), where c_P(t) is the number of distinct
          accounting terms among {shared, nonshared_1..nonshared_8} that charge
          page P at time t
        range: 0 <= dedup(t) <= sum_j nonshared_j(t)
        evidence_requirement: >-
          dedup(t) must be evidenced by a page-level census. Any duplication
          that is not proved is set to zero, so an unproved dedup can never
          reduce the reported peak
        shared_counted_exactly_once: >-
          shared(t) charges shared allocation once. If an implementation instead
          charges shared bytes into each shard's own term, the duplicates must
          appear in dedup(t) so that the total still counts them exactly once.
          Both accountings must produce identical peaks; KAT-PEAK-3 enforces this
      bounds_and_their_meaning:
        lower_bound: 'max_j max_t nonshared_j(t) <= peak_live_bytes_system'
        upper_bound: 'peak_live_bytes_system <= max_t shared(t) + sum_j max_t nonshared_j(t)'
        lower_bound_tight_only_if: at most one shard is ever live at a time
        upper_bound_tight_only_if: all per-shard peaks and the shared peak coincide in time
        rejected_rules:
          - id: max-of-shards
            behaviour: undercounts by up to a factor of 8
            rejected_by_kat: KAT-PEAK-1
          - id: sum-of-independent-maxima
            behaviour: overcounts by up to a factor of 8
            rejected_by_kat: KAT-PEAK-2
          - id: shared-charged-per-shard-without-dedup
            behaviour: overcounts shared bytes eightfold
            rejected_by_kat: KAT-PEAK-3
          - id: shared-dropped
            behaviour: undercounts by the shared allocation
            rejected_by_kat: KAT-PEAK-4
          - id: sampled-census
            behaviour: can miss the peak entirely
            rejected_by_kat: KAT-PEAK-6
      interval_arithmetic:
        formula_lower: 'max_t( shared_lo(t) + sum_j nonshared_lo_j(t) - dedup_hi(t) )'
        formula_upper: 'max_t( shared_hi(t) + sum_j nonshared_hi_j(t) - dedup_lo(t) )'
        dedup_lo_default: 0 unless a page-level census proves more
        replaces: >-
          the predecessor per-stream forms
          "[max(S_peak_lower,R_peak_lower), max(S_peak_upper,R_peak_upper)]" and
          "[max(S_peak_lower,B_peak_lower), max(S_peak_upper,B_peak_upper)]"
        applies_to: candidate stage, rho stage, and BSGS stage alike
      stage_reporting_rule: >-
        The reported peak_live_bytes axis value is the single global max over t
        across the whole run. Per-stage aggregates may be reported for diagnosis
        only, and their maximum equals the global value only if the stages are
        time-disjoint, which must be evidenced by the merged event set and never
        assumed.
      census_completeness:
        required_streams: 9
        stream_list: shared/setup context plus each of the eight BSGS shards
        missing_any_stream: invalidates
        averaging_or_dividing: forbidden
        reuse_of_a_five_way_maximum: forbidden
        shard_sensitivity_disclosure_retained: >-
          Widening BSGS from five to eight shards changes the set of
          simultaneously live shard allocations and can change the system peak.
          No analytic shard-invariance is asserted.
      kats_frozen_in: verification-and-null-kats.yaml
      measured_values_present: false
      new_residual_created_by_this_repair:
        id: PEAK-AGGREGATE-FIT-UNPROVED
        statement: >-
          Under the corrected rule the maximum_memory_gb ceiling of 2 binds an
          aggregate over nine concurrently live streams rather than a maximum
          over per-shard streams. The corrected aggregate can exceed any single
          per-shard figure by up to eightfold. No static byte figure and no
          measurement exists, so fit under the unchanged 2 GB ceiling is
          UNPROVED and is disclosed as newly open.
        cap_raised: false
        disposition: OPEN_DISCLOSED_NEW
        honesty_note: >-
          This residual exists because the repair is correct, not because the
          design regressed. The predecessor's rule concealed it by undercounting.

