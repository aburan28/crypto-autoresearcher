experiment:
  id: EXP-HQCX-7d27e5
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-3994ef; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-3994ef
  question_id: RQ-HQC-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Composition-gap measurement for HQC at reduced parameters: deployed two-stage decoder versus
    exact maximum-likelihood decoding of the whole concatenated code on identical error vectors, with
    two exact-zero fail-closed gates'
  objective: 'The one uncertainty a run reduces: how much of HQC''s deployed decoding failure probability
    is a property of the CODE and how much is the cost of DECODING IT IN TWO STAGES. A run establishes
    (i) the exact four-cell contingency between the deployed decoder and an exact maximum-likelihood
    decoder of the whole concatenated code on identical error vectors, of which two cells are forced
    to be exactly empty by mathematics and therefore serve as fail-closed gates on the instrument;
    (ii) the composition gap P[D = 1] and its ratio to the deployed failure rate across a ladder in
    the number of inner blocks, which is the quantity that tells any later reader how much of a model-versus-measurement
    discrepancy could ever be a decoder story; and (iii) a decomposition of the gap by cause, separating
    wrong-inner-codeword events from outer-radius-exceeded events. A gap indistinguishable from zero
    is a licensing bound and is reported as such. No attack, break, speedup or security consequence
    is claimed here or would follow from a run. No statement is made about what the published literature
    does or does not contain; this environment cannot reach external literature. No direction is declared
    impossible.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: at the executed inner and outer codes
      and the executed ladder in n_e, the composition gap P[D = 1] takes a stated value with stated
      confidence intervals, and both forced-empty cells are empty. WHAT DOES NOT FOLLOW: nothing about
      deployed HQC parameters, where exact ML is not computable and the measurement cannot be made;
      nothing about the correctness of the specification''s analytic DFR model; no attack and no security
      consequence - a positive gap means the deployed decoder is conservative, which is the opposite
      direction from a break; and no proposal to change HQC''s decoder, whose practicality is not
      addressed.'
  inputs:
    procedure: 'STAGE 0 (zero compute): fix the outer codes whose codeword sets are enumerable, compute
      the exact ML cost per trial for each, and declare the cause taxonomy for STAGE 4 before any
      data exists. STAGE 1 (minutes): implement exact concatenated ML by enumeration over the outer
      codeword set; verify against brute force at the smallest rung. STAGE 2 (minutes, T = 10^5):
      the n_e = 1 identity null; require D exactly zero. STAGE 3 (an hour, T = 10^5 to 10^6 per rung):
      the ladder n_e in {2, 3, 5, 7, 12, 18} subject to the ML affordability cap, filling the four-cell
      contingency at each rung with the empty-cell gate enforced. STAGE 4 (minutes): decompose D by
      the declared cause taxonomy. STAGE 5 (minutes): weakened-outer-radius positive control. STAGE
      6 (zero compute): report the decomposition, the ratio ladder and both gate states.'
    instrument: 'Python 3.11 with numpy; NO Sage. Deployed decoder: the shared numpy fast Walsh-Hadamard
      inner ML routine plus a threshold outer stage, kept in int32 so scores are exact. Exact concatenated
      ML: enumerate the outer codeword set, expand each to its concatenated codeword, and score by
      summing per-block integer correlations, vectorised over the codeword set with numpy; verified
      against a brute-force loop at the smallest rung. Outer codes constructed as small Reed-Solomon
      codes over GF(16) and GF(32) with a pure-Python field implementation written from its definition
      and unit-tested against exhaustive multiplication tables. Recorded through harness/runner.py
      with a frozen seed ladder.'
    parameters: 'Inner codes RM(1,4) length 16 and RM(1,5) length 32, duplication 1. Outer codes:
      Reed-Solomon over GF(16) with dimension 2 (256 codewords) and dimension 3 (4096 codewords),
      and over GF(32) with dimension 2 (1024 codewords), giving exact ML costs of 256, 4096 and 1024
      block-score evaluations per trial. n_e ladder {1, 2, 3, 5, 7, 12, 18} truncated at each outer
      code''s length. n = 227 and n = 587 with ord_n(2) = n-1 checked at run time. Input weights tuned
      on a disjoint seed stream to a deployed failure rate near 1e-2 so that the gap is estimable.
      T = 10^5 per rung, raised to 10^6 at n_e = 5 and n_e = 7.'
  controls:
  - 'n_e = 1 identity null: D must be exactly zero, fail-closed.'
  - 'Empty-cell gate: ''deployed succeeds, ML fails'' must be exactly empty at every rung, fail-closed.'
  - Pairing on identical error vectors so D is a per-trial observation with cancelled variance.
  - Weakened-outer-radius positive control, where the gap must widen in the predicted direction.
  - Independent verification that the ML decoder's score is the true correlation sum, by exhaustive
    comparison against brute-force enumeration at the smallest rung.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): TWO nulls, both free and both executable in the same invocation. NULL-1,
    the n_e = 1 identity: with a single inner block the deployed decoder is maximum likelihood for
    the whole code, so D must be exactly 0 over the entire corpus. NULL-2, the empty-cell gate: the
    cell ''deployed succeeds, ML fails'' must be exactly empty at every n_e, because ML cannot lose
    to a suboptimal decoder on the same codeword set. FOR THE SIGNAL ARM TO MEAN ANYTHING BOTH MUST
    HOLD EXACTLY: a non-zero D at n_e = 1 proves the comparison or the ML implementation is wrong;
    a non-empty fourth cell proves the ML decoder is not ML. Neither is a statistical test - both
    are exact zero requirements, which is the strongest control available and costs nothing to run.
    A third, positive control: at a deliberately weakened outer radius the gap must widen in the predicted
    direction, demonstrating the instrument responds to the composition rather than to noise.'
  independent_variables:
  - number of inner blocks n_e
  - outer code parameters (field size and dimension)
  - inner block length
  - 'decoder: deployed two-stage versus exact concatenated ML'
  - outer radius (positive-control arm only)
  metrics:
    primary:
    - four-cell contingency at each n_e
    - P[D = 1] with confidence interval at each n_e
    - ratio P[D = 1] / P[deployed fails] at each n_e
    - count in the forbidden fourth cell
    - D at n_e = 1
    secondary:
    - decomposition of D by declared cause
    - exact ML cost per trial at each outer code
    - P[ML fails] at each rung
    - positive-control gap widening under weakened outer radius
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The ratio r(n_e) := P[D = 1] / P[deployed fails] at n_e = 5 and n_e = 7, and the two
      forced-zero gate counts.
    formula: 'The exact decomposition P[deployed fails] = P[ML fails] + P[D = 1] holds by definition
      of the four cells, given that the cell ''deployed succeeds, ML fails'' is empty. Predicted:
      D = 0 exactly at n_e = 1; fourth-cell count = 0 at every rung; r(7) >= 0.05; and r monotone
      increasing across the executed ladder. Under the null that the composition costs nothing, r(n_e)
      = 0 at every n_e and the decomposition degenerates to P[deployed fails] = P[ML fails].'
    source: Pre-registered in the parent proposal IDEA-20260816-3994ef before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Executed at inner block lengths 16 and 32 with outer codes of dimension 2 to 3
      over GF(16) and GF(32), chosen because exact maximum-likelihood decoding of the concatenation
      requires the outer codeword set to be enumerable. Those outer dimensions are far below deployed
      HQC's, and the design states plainly that the measurement CANNOT be made at deployed parameters,
      which is why no transfer heuristic is offered. What the ladder gives instead is the trend of
      the composition gap in n_e within the affordable regime, reported as a measured trend across
      the executed rungs and not extrapolated beyond them.
    correspondence: null
  tail_checks:
  - Report the number of D = 1 events per rung and refuse any rung with fewer than 50.
  - Check the forbidden fourth cell separately within each decile of the error weight, since a rare
    tie-handling divergence would concentrate there.
  - Verify the exact-ML scores against brute force on a random subsample at every rung, not only at
    the smallest.
  - Report the gap separately for trials where the deployed decoder failed by exactly one block over
    the outer radius, which is the boundary case where the composition cost is largest.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Abort everything if D is non-zero at n_e = 1.
  - Abort a rung if the forbidden fourth cell is non-empty, and investigate rather than report.
  - Abort a rung whose exact ML cost exceeds the declared per-trial budget, and record the affordability
    cap rather than approximating ML.
  - Stop at the declared ladder; the cause taxonomy is frozen before data generation.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both forced-zero gates hold exactly, the brute-force verification of ML scores
    passes at every rung, and the run reports the four-cell contingency and r(n_e) with confidence
    intervals across the executed ladder.
  falsification_criterion:
  - 'D is non-zero at n_e = 1: the instrument is void and no gap is reportable.'
  - 'The forbidden fourth cell is non-empty: the ML decoder is not ML.'
  - 'P[D = 1] is indistinguishable from zero at every rung: the composition costs nothing measurable
    at these sizes and the bound is the recorded obstruction.'
  - 'r(n_e) is non-monotone: the growth claim is withdrawn and per-rung values are reported without
    a trend.'
  - 'The positive control fails to widen the gap: the instrument does not respond to the composition
    and its null is uninterpretable.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-3994ef
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The cause taxonomy for decomposing D must be written out and frozen before data generation; as
    sketched here it names two causes, and a Coordinator should confirm those are exhaustive and mutually
    exclusive or the decomposition will not sum.
  - Whether the deployed outer stage should be modelled as a pure threshold on the number of failed
    blocks or as an explicit Reed-Solomon decode must be settled, since the two coincide only if the
    outer decoder is exactly bounded-distance and that equivalence should be recorded as a derivation.
  - The affordability cap on exact ML is stated as a per-trial budget but the budget itself is not
    fixed here and must be, since it determines where the ladder truncates.
  - The argument that the tested small outer dimensions are informative about larger ones is not made
    and is deliberately not claimed; a Coordinator should decide whether the contract is worth approving
    on the trend alone.
