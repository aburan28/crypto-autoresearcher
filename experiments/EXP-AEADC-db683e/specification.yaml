experiment:
  id: EXP-AEADC-db683e
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-9fbe84; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-9fbe84
  question_id: RQ-AEADC-8db132
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Enumerate all vectors in a declared finite class under four AEAD associated-data serialization
    conventions and report exact fibre counts, minimal colliding vectors and first-failure arities
    against pre-registered closed-form predictions
  objective: 'The one uncertainty a run reduces is whether the vector-input serialization surface
    of an AEAD mode is injective over a fully enumerated class, and at what arity and length it first
    is not. Concretely: (i) for each of the four declared conventions, what is the exact fibre-count
    table over all vectors in the class, what is the minimal colliding pair as bytes, and at what
    (arity, total length) does injectivity first fail; (ii) does each count agree with the closed-form
    prediction derived by hand and pre-registered before the enumerator runs, since disagreement falsifies
    a structural argument and is worth more than the count; (iii) is the enumerator able to see collisions
    at all, established by the naive-concatenation positive control whose count is predicted exactly,
    so that the zero expected for length-prefixed encoding is a verified injectivity statement rather
    than a silent failure. A run also settles a framing question for this bucket by checking that
    the three non-algebraic conventions give byte-identical tables under an ideal permutation and
    a real primitive, and by separating the accumulator convention''s combinatorial fibre from any
    part that moves with the primitive.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the four conventions as
      specified in stage 1, over all vectors on a two-symbol alphabet with arity at most 4 and total
      length at most 16 symbols, the serialization map had exactly the reported fibre structure, with
      the listed minimal colliding vectors, and the positive control reproduced its closed-form count.
      What does NOT follow: nothing about AES-GCM-SIV, CCM, or any named construction, since the conventions
      are declared models; no forgery, attack, break or security consequence, since a serialization
      collision becomes a security statement only under conditions not established here; nothing about
      vectors outside the enumerated class, in alphabet, arity or length; and no statement about what
      any published design does.'
  inputs:
    procedure: 'STAGE 0, zero compute, hours of human effort: specify the four conventions completely,
      including empty-component and trailing-empty handling, and hash the specification. STAGE 1,
      zero compute: derive closed-form collision counts for naive concatenation and separator joining,
      and the injectivity argument for length prefixing; record with a file hash. STAGE 2, minutes:
      implement the four conventions and their deserializers, validating each on a fixture set. STAGE
      3, minutes: enumerate the class -- all vectors over {0x00, 0x01} with arity 1 to 4 and total
      length 0 to 16 -- serializing each and building an exact fibre table per convention. STAGE 4,
      minutes: run the accumulator convention twice, once with a seeded ideal permutation and once
      with a pinned real primitive, and diff the tables. STAGE 5, minutes: run the round-trip deserialization
      check over every vector under every convention declared injective. STAGE 6, zero compute: emit
      fibre counts, minimal colliding vectors, first-failure arities, prediction deltas and the primitive
      diff into an immutable run record via harness/runner.py.'
    instrument: 'Python 3, standard library only: four serialization functions, four deserializers,
      an exact fibre enumerator keyed by length-tagged byte tuples, and a closed-form prediction module
      written before the enumerator. The accumulator convention uses a seeded lazily-sampled bijection
      for its ideal-primitive arm and a pinned pure-Python block cipher validated against published
      test vectors for its real arm. Manifest emission and seeding via harness/runner.py, following
      the pattern of harness/ctrl_valueshuffle.py. No Sage, no network, no key material outside the
      accumulator arm.'
    parameters: Alphabet {0x00, 0x01}. Arity 1 to 4 inclusive. Total length 0 to 16 symbols inclusive,
      giving on the order of a few million vectors across all arities. Four conventions. Separator
      byte fixed at 0x00, chosen deliberately to lie inside the alphabet so that separator ambiguity
      is reachable. Length-prefix field width 1 byte. Accumulator over a 128-bit block with the doubling
      map fixed in stage 1, run at both primitive slots. Empty components permitted at every position
      including trailing.
  controls:
  - Naive concatenation as the positive control, with a closed-form predicted count fixed in stage
    2.
  - 'Primitive-substitution null: identical enumeration under ideal and real primitives, requiring
    byte-identical tables for the three non-algebraic conventions.'
  - Pre-registered hand-derived counts recorded with a file hash before the enumerator runs.
  - 'Round-trip deserialization: every serialization declared injective is decoded back to its vector
    and verified componentwise.'
  - 'Empty-component sweep: vectors containing empty components and trailing empties are enumerated
    explicitly rather than skipped, since they are where arity ambiguity concentrates.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls in the same invocation. NULL ONE, positive control: naive
    concatenation, whose collision count inside the class is computable in closed form in stage 2
    and must be reproduced exactly; if the enumerator does not find those collisions, every zero it
    reports elsewhere is meaningless. NULL TWO, primitive substitution: for the accumulator convention,
    the entire enumeration is run twice, once with a seeded ideal permutation and once with a pinned
    real primitive, and the two collision tables are compared. The combinatorial part of the count
    must be identical across the two; any part that differs is a primitive property and is reported
    separately and never as a mode result. For the three non-algebraic conventions null two must produce
    byte-identical tables, since their counts cannot depend on a primitive at all.'
  independent_variables:
  - serialization convention
  - vector arity
  - total vector length
  - presence and position of empty components
  - primitive slot occupant, for the accumulator arm only
  metrics:
    primary:
    - exact fibre-count table per convention
    - number of colliding vector pairs per convention within the class
    - minimal colliding vector pair per convention, as bytes
    - first (arity, total length) at which injectivity fails, per convention
    - signed difference between pre-registered closed-form and enumerated counts
    secondary:
    - maximum fibre size per convention
    - count of round-trip deserialization failures
    - byte-level table diff across primitive slots
    - enumeration wall-clock and peak memory
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The collision count of naive concatenation and of separator joining inside the class,
      and the zero predicted for length-prefixed encoding.
    formula: For naive concatenation, two vectors collide exactly when their concatenations are equal
      as strings, so the fibre above a string s of length n is the set of compositions of n into at
      most 4 parts, and the total number of colliding pairs in the class is the sum over all strings
      s of length at most 16 over the two-symbol alphabet of C(f(s), 2), where f(s) is the number
      of compositions of the length of s into at most 4 nonnegative parts; this sum is evaluated exactly
      in stage 1. For separator joining without escaping, a collision occurs exactly when a component
      contains the separator byte, and the count is the number of vector pairs whose separator-joined
      forms coincide, evaluated by the same closed form restricted to strings containing the separator.
      For length-prefixed encoding, the predicted count is zero, since the prefix makes each component
      self-delimiting and the arity is recoverable by decoding.
    source: Pre-registered in the parent proposal IDEA-20260816-9fbe84 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The class is toy in alphabet, arity and length, and is EXHAUSTIVE within those
      bounds, which is the design: the answer is an exact integer with no sampling and no extrapolation.
      The stated transfer assumption is that arity and separator ambiguity, if a convention has it,
      manifests at small arity and short components rather than only at large ones -- an assumption
      the positive control directly exercises, since naive concatenation is expected to collide at
      arity 2 and total length 2. Nothing is projected outside the class; a collision requiring a
      richer alphabet or longer components would be missed, and that limitation is reported alongside
      every count rather than buried.'
    correspondence: null
  tail_checks:
  - Vectors consisting entirely of empty components are enumerated explicitly at every arity.
  - Trailing-empty vectors are compared against their shorter counterparts, which is the classic arity
    ambiguity.
  - Maximum-length vectors at maximum arity are checked for enumeration truncation.
  - Fibres of size greater than two are reported separately, since a large fibre is qualitatively
    different from a pairwise collision.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report the enumerator invalid if the naive-concatenation control returns fewer collisions
    than its closed form.
  - Halt if round-trip deserialization fails under a convention declared injective.
  - If enumeration exceeds two core-hours, report the sub-class actually enumerated and make no claim
    about the remainder.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: A completed enumeration in which the naive-concatenation control reproduces its
    closed-form count exactly, the three non-algebraic conventions give byte-identical tables across
    primitive slots, and each convention carries an exact fibre count with its minimal colliding vector
    or a verified zero, reported against its pre-registered prediction.
  falsification_criterion:
  - The positive control undercounts against its closed form, invalidating the enumerator.
  - The length-prefixed convention returns a nonzero count, falsifying the stage-1 injectivity derivation.
  - A non-algebraic convention's table differs across primitive slots.
  - Round-trip deserialization fails anywhere under a convention declared injective.
  - The accumulator arm's combinatorial and primitive-dependent fibres cannot be separated, leaving
    that column uninterpretable.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-9fbe84
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Empty-component and trailing-empty handling is named as the decisive rule but not fixed for all
    four conventions; the Coordinator must pin it, since it alone can move every count.
  - The doubling map of the accumulator convention is referenced structurally and must be specified
    exactly before the two-primitive arm means anything.
  - The claim that the accumulator's combinatorial fibre is separable from its primitive-dependent
    fibre is asserted and needs a written argument before approval.
  - The two-symbol alphabet is chosen for enumerability, without an argument that a first collision
    cannot require a richer alphabet.
