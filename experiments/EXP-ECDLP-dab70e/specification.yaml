  status_note: >
    Frozen at version 1 and approved 2026-09-13 by
    DEC-20260913-064cb8 under the standing 2026-09-06
    user authorization. Stage 0 is the exact quadratic
    residue of affine x calibrator.

  objective: >
    Evaluate the exact identity that on
    p=19, A=1, B=-1, P=(2,3) one has
    [2]P=(16,11), chi_2(x)=18 and
    chi_2(x')=1, and rejects the nearby
    invariance claim that chi_2(x')=18,
    on one frozen family (REAL, KF,
    NULL). Stage 0 does not form a real
    Gamma orbit, does not run a unary-
    closure census, does not run Miller
    or Tate, and does not authorize
    Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL has
      chi_2(x)=18, chi_2(x')=1; KF
      invariance claim rejected
      because chi_2(x')=1; NULL empty
      character rejected; x=0
      rejected as the zero fibre.
      Certificate kind none.
    formula: >
      Affine doubling then u^9.
      REAL: P=(2,3), [2]P=(16,11),
      chi_2(x)=18, chi_2(x')=1.
      KF: claim chi_2(x')=18, actual 1,
      rejected as a generic
      doubling-character target.
    claim_tier: observational

  inputs:
    fixture:
      real_curve:
        p: 19
        A: 1
        B: -1
        P: [2, 3]
        P2: [16, 11]
        must_chi: 18
        must_chi_prime: 1
      known_false:
        kind: constant_chi_prime
        claimed_chi_prime: 18
        must_chi_prime: 1
        must_reject: true
      matched_null:
        kind: empty_character
        must_reject: true
      invalid:
        - {x_zero: true, point: [0, 1], must_reject: true, zero_fibre: true}

  controls:
    - name: known_false_constant
      object: KF claim chi_2(x') equals 18
    - name: matched_null
      object: empty character
    - name: invalid_x_zero
      object: x=0 zero fibre

  independent_variables:
    - point
    - affine_chart
  metrics:
    primary:
      - fixture_pass
      - real_character_pass
      - known_false_constant_pass
      - reject_invalid_pass
      - null_empty_pass
    secondary: []
  primary_metrics:
