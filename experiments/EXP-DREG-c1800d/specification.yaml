# EXP-DREG-c1800d
# Degree-cap accounting identities. No Macaulay matrix.
# Approved by DEC-20261002-13aff6.
experiment:
  id: EXP-DREG-c1800d
  hypothesis_id: H-DREG-25816f
  source_idea: IDEA-20260916-e6540d
  question_id: RQ-DREG-bd6c86
  version: 1
  title: Degree-cap accounting identities
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-13aff6
  objective: >-
    Check the Boolean counts, the rounding of sqrt(2/ln 2), and
    the two-unit cap step on the toy ladder.
  inputs:
    n_ladder: [12, 15, 18, 21, 24]
    m: 3
    N_ladder: [24, 30, 36, 42, 48]
    ceil_ladder: [4, 5, 6, 7, 8]
    series_k: 20
    ln2_lo_num: 42299423848079
    ln2_lo_den: 61025172848640
    ln2_hi_num: 42299426619419
    ln2_hi_den: 61025172848640
    const_lo_num: 16986
    const_lo_den: 10000
    const_hi_num: 16987
    const_hi_den: 10000
    N24: 24
    one_unit_omega2: 576
    step_omega2: 331776
    step_omega3: 191102976
    harm12_num: 58301
    harm12_den: 27720
    harm15_num: 835397
    harm15_den: 360360
    harm18_num: 10190221
    harm18_den: 4084080
    harm21_num: 13684885
    harm21_den: 5173168
    harm24_num: 990874363
    harm24_den: 356948592
    thresh_above_num: 947
    thresh_above_den: 5000
    thresh_below_num: 379
    thresh_below_den: 2000
    written_006_num: 6
    written_006_den: 100
  controls:
    - >-
      A value of sqrt(2/ln 2) that is at most 16986/10000 or at
      least 16987/10000 is false. The series upper bound through
      k = 20 lies strictly below the first cutoff, and the partial
      sum lies strictly above the second. Reporting the written
      truncation 1.6986 as the closed form invalidates the run.
    - >-
      ceil(12/3) is 4. A different ceiling on any ladder cell
      whose n is divisible by 3 invalidates the run.
    - >-
      The step from cap 4 to cap 6 is N to the 2 omega. At N = 24
      and omega = 2 that factor is 331776. The one-unit power 576
      is not that factor. Reporting 576 as the two-unit step
      invalidates the run.
    - >-
      At N = 24 and omega = 3 the two-unit factor is 191102976.
      Reporting another integer invalidates the run.
    - >-
      The n = 24 threshold 2 to the power -12/5 is strictly above
      947/5000 and strictly below 379/2000. It is also strictly
      above 6/100. Reporting it as at most 6/100 invalidates the
      run.
    - >-
      A kill exponent n/10 that meets or exceeds sqrt(n ln n) on
      one of the five cells is false. The harmonic lower bound
      exceeds n/100 on each cell. Reporting otherwise invalidates
      the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - n
    - route in {series, cross}
  metrics:
    primary:
      - constant_sides
      - step_omega2
      - step_omega3
      - implementations_agree
    secondary:
      - thresh_sides
      - harm_sides
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The constant sides and the N = 24 step factors.
    formula: >-
      N equals n times (m minus 1). At m = 3 that is 2n, and
      ceil(n/3) equals n/3 on this ladder. The per-attempt power
      at pi = 1 and cap 4 is that N to the 4 omega. The constant
      sqrt(2/ln 2) is compared with 16986/10000 and 16987/10000
      by the series ln 2 = sum of 1/(k 2^k). The partial sum
      through k = 20 is a lower bound. Adding 1/(21 * 2^20) is an
      upper bound. The cap step from 4 to 6 multiplies by N to
      the 2 omega. The kill comparison uses the harmonic sum from
      2 through n as a lower bound for ln n. The n = 24 threshold
      comparison is 2^12 against (5000/947)^5 and against
      (2000/379)^5.
    source: >-
      IDEA-20260916-e6540d states the ladder, the written constant
      1.6986, the cap step, and the kill exponent 0.1 n, read
      2026-10-02. The inequalities were computed in this design
      session. That computation is not a run. No matrix was built
      and no concrete-estimate table was reopened.
  scale_relevance:
    tier: toy
    justification: Five integer cells. No transfer to a yield or a curve.
    correspondence: null
  tail_checks:
    - The n = 24 row is required. Stopping at n = 12 and still reporting the threshold sides is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the two-unit step is reported as 576, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - sqrt(2/ln 2) is reported at most 16986/10000 or at least 16987/10000.
    - A ladder ceiling differs from n/3.
    - The two-unit step at N = 24 is reported as 576.
    - The omega = 3 step is reported different from 191102976.
    - The n = 24 threshold is reported at most 6/100.
    - A harmonic lower bound is reported at most n/100.
    - A Macaulay matrix, a yield, or a degree fall is reported.
  success_criterion: >-
    Both runs agree on the counts 24, 30, 36, 42 and 48, the
    ceilings 4, 5, 6, 7 and 8, the series bounds
    42299423848079/61025172848640 and
    42299426619419/61025172848640, the constant strictly above
    16986/10000 and strictly below 16987/10000, the step factors
    331776 and 191102976, the five harmonic fractions, and the
    n = 24 threshold strictly above 947/5000, strictly below
    379/2000, and strictly above 6/100.
  falsification_criterion: >-
    The runs agree, the constant stays strictly above 1.6986 and
    strictly below 1.6987, and any ladder entry differs from the
    preregistered table.
  required_artifacts:
    - experiments/EXP-DREG-c1800d/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-c1800d/runs/<RUN-ID>/command.txt
    - experiments/EXP-DREG-c1800d/runs/<RUN-ID>/stdout.log
    - experiments/EXP-DREG-c1800d/runs/<RUN-ID>/stderr.log
    - experiments/EXP-DREG-c1800d/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-DREG-c1800d/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any Macaulay matrix, rank profile, or degree-fall measurement.
    - Any application of a last-fall-degree bound, and any random quadratic planted-solution audit.
    - Any yield ladder, relation-rank comparison, or concrete-estimate table.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
