# =============================================================================
# EXP-GFPN-726eb2 — SafeCurves-style certificate audit of EcGFp5 + EcMasFp5
# Hypothesis: H-GFPN-ee4d45 / IDEA-20260920-63a902
# Approval: DEC-20260920-fe73de (standing user authorization 2026-09-06)
# =============================================================================
experiment:
  id: EXP-GFPN-726eb2
  hypothesis_id: H-GFPN-ee4d45
  question_id: RQ-GFPN-c01af8
  goal_id: GOAL-GFPN-380702
  version: 1
  title: >-
    SafeCurves-style certificate audit of EcGFp5 and EcMasFp5 (order, twist,
    embedding, CM, rigidity, figure provenance)
  status: approved
  status_note: >-
    APPROVED 2026-09-20 by DEC-20260920-fe73de under AGENTS.md standing user
    authorization of 2026-09-06. Protocol completeness verified (controls,
    metrics, budget, stopping/invalidation rules, required artifacts,
    decidable success and falsification criteria, certificate.kind none).
    Approval authorizes implementation and audit measurement as this contract
    defines. It does NOT authorize an ECDLP attack or any discrete-log solve.
    Execution of scientific trials requires a separate /run invocation — not
    this design/coordinate session. Any change requires a versioned
    protocol_amendment under experiments/EXP-GFPN-726eb2/amendments/.
  approved_by: coordinator
  approved_at: '2026-09-20'
  approval_decision: DEC-20260920-fe73de
  approval_basis: >-
    Standing user authorization recorded in AGENTS.md on 2026-09-06
    (ideas and experiments always approved once the protocol is complete).
    Coordinator completeness check is DEC-20260920-fe73de. User confirmation
    is not an outstanding gate.
  frozen: true
  frozen_at: '2026-09-20'
  execution_authorized: true
  execution_authorized_note: >-
    Authorized: regenerate SafeCurves-style certificates for EcGFp5 and
    EcMasFp5; reproduce SCURVE control; emit provenance table for the 142-bit
    and 101.93 figures. NOT authorized: PDP/index-calculus attack, OA-SDH,
    cover genus computation (owned by other GFPN ideas), or any DL solve.
  execution_authorized_decision: DEC-20260920-fe73de
  source_proposal: IDEA-20260920-63a902
  designed_by: coordinator
  archived_by: TASK-20260920-717d6c
  class: audit
  claim_tier: observational
  certificate:
    kind: none
    kind_note: >-
      Pure parameter audit (docs/claims-and-verification.md). Regenerated
      factorization / point-count artifacts are audit certificates, not
      discrete-log or decomposition certificates. No ECDLP solve is claimed.
  objective: >-
    Produce a certificate-bearing SafeCurves-style audit table for EcGFp5
    (inputs/PORNIN-2022-274-ECGFP5) and EcMasFp5 (inputs/ECMASFP5-HACKMD-2025):
    regenerate order/cofactor, embedding degree, CM discriminant bits, twist
    order factorization and twist-security bits; confirm rigidity of the
    published parameter searches; and emit a figure-provenance table that tags
    the design-note "142-bit" field-security figure and EcMasFp5's 101.93-bit
    twist self-report as computed / inherited / asserted. Reuse SCURVE audit
    patterns. Instrument control: one prior SCURVE-audited curve must
    reproduce its certificate before GFPN curves are scored. No attack cost.

  inputs:
    curves:
      EcGFp5:
        source: inputs/PORNIN-2022-274-ECGFP5/
        kn_lit: KN-LIT-8aff72
        source_record: SRC-PORNIN-2022-274-ECGFP5
        p: '18446744069414584321'
        note: >-
          Published double-odd model and security section from frozen ePrint
          2022/274; exact equation/modulus as stated in paper_fulltext.md.
      EcMasFp5:
        source: inputs/ECMASFP5-HACKMD-2025/
        kn_lit: KN-LIT-47d541
        source_record: SRC-ECMASFP5-HACKMD-2025
        p: '18446744069414584321'
        note: >-
          Published prime-order model and self-reported twist/field figures
          from frozen HackMD note.
    literature_context:
      - inputs/GORLA-MASSIERER-2014-1403/
      - KN-LIT-edd7ba
    scurve_patterns: >-
      Reuse certificate schemas and verification wrappers from prior
      EXP-SCURVE-* audit tooling already in the repository; do not invent a
      parallel unverified point-counting path.
    figures_under_provenance_audit:
      - id: field_security_142
        claimed_bits: 142
        claimed_by: EcGFp5 design note (raw Gaudry floor); inherited by EcMasFp5 note
      - id: twist_security_101_93
        claimed_bits: 101.93
        claimed_by: EcMasFp5 design note self-report

  controls:
    - name: scurve_control_curve
      object: >-
        One curve already carrying a SCURVE certificate package; re-run must
        match prior certificate bytes (or hash) before GFPN scoring.
      blocking: true
    - name: regenerated_not_copied
      object: >-
        Order/factorization certificates must be recomputed; copying integers
        from the design notes without recomputation invalidates the run.
      blocking: true
    - name: public_parameters_only
      object: No keys, signatures, or live systems; published equations only.
      blocking: true

  independent_variables:
    - curve_id  # EcGFp5 | EcMasFp5 | scurve_control
    - criterion  # order, cofactor, embedding_degree, cm_disc, twist, rigidity

  metrics:
    primary:
      - order_certificate
      - cofactor
      - embedding_degree
      - cm_discriminant_bits
      - twist_order_factorization
      - twist_security_bits
      - rigidity_reproduced
      - figure_provenance_table
      - scurve_control_certificate_match
    secondary:
      - wall_seconds
      - peak_memory_bytes
      - sea_method_id
      - factorization_method_id
      - model_deviation_notes

  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Per-criterion pass/fail with regenerated certificate; provenance tags for
      142-bit and 101.93 figures.
    formula: >-
      Audit completeness: every primary metric decided for both named curves;
      control match true; at least field_security_142 tagged inherited on
      EcMasFp5 and twist_security_101_93 tagged after recomputation.
    source: IDEA-20260920-63a902 / H-GFPN-ee4d45 (internal)
    claim_tier: observational

  scale_relevance:
    tier: crypto
    justification: >-
      Audit runs at the deployed Goldilocks p = 2^64 − 2^32 + 1. No transfer
      assumption; parameters are the published ones.
    correspondence: null

  tail_checks: []

  replication:
    seeds: []
    independent_instances: 1
  replication_plan: >-
    One deterministic audit run per curve plus the SCURVE control. Point
    counting and factorization are deterministic given the published model;
    record tool versions in environment.json.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_runs: 4
    maximum_workers: 1
    budget_note: >-
      Wall/CPU advisory nulls per docs/research-budget-policy.md. memory_gb=8
      is machine protection. ECC unlimited (GOAL-GFPN-380702).

  stopping_rules:
    - Stop when both named curves and the SCURVE control have all primary metrics recorded (or explicitly marked not_verifiable).
    - A timeout or SEA/tool crash is failed_infrastructure / resource_exhaustion, never a mathematical miss on either curve.
    - Stop and invalidate if the SCURVE control certificate fails to match before GFPN scoring begins.

  invalidation_rules:
    - Missing required artifact paths invalidate the run.
    - Overwriting an existing run record invalidates the procedure.
    - Copying order/twist integers from design notes without regenerated certificates invalidates the audit.
    - Claiming an ECDLP solve, PDP cost band, OA-SDH cost, or cover genus from this experiment invalidates the scientific boundary.
    - Scoring results after a failed SCURVE control match invalidates GFPN rows.

  success_criterion: >-
    scurve_control_certificate_match is true; for both EcGFp5 and EcMasFp5 every
    primary metric is present with a regenerated certificate or an explicit
    not_verifiable reason; figure_provenance_table includes tags for
    field_security_142 and twist_security_101_93. Success is audit completeness,
    not agreement with self-reports.

  falsification_criterion: >-
    After a passing SCURVE control, a self-reported numeric figure (order,
    twist_security_bits, cm_discriminant_bits) fails independent recomputation
    by more than the declared rounding tolerance (0.01 bit for 101.93; exact
    integer match for orders). That criterion row is FAIL and is the finding;
    the run remains valid measurement. Instrument falsification: control mismatch.

  required_artifacts:
    - experiments/EXP-GFPN-726eb2/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-GFPN-726eb2/runs/<RUN-ID>/command.txt
    - experiments/EXP-GFPN-726eb2/runs/<RUN-ID>/environment.json
    - experiments/EXP-GFPN-726eb2/runs/<RUN-ID>/stdout.log
    - experiments/EXP-GFPN-726eb2/runs/<RUN-ID>/stderr.log
    - experiments/EXP-GFPN-726eb2/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-GFPN-726eb2/runs/<RUN-ID>/audit-table.yaml
    - experiments/EXP-GFPN-726eb2/runs/<RUN-ID>/figure-provenance.yaml
    - experiments/EXP-GFPN-726eb2/runs/<RUN-ID>/certificates/
    - experiments/EXP-GFPN-726eb2/implementation.md

  assigned_to: executor
  scientific_boundary: >-
    Parameter audit only. No Semaev S_m evaluation, no Groebner/FGLM PDP, no
    OA-SDH, no GHS cover genus, no DLP solve, no rho beat claim.
