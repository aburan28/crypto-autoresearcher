experiment:
  id: EXP-ECTD-9e4248
  hypothesis_id: H-ECTD-19017a
  goal_id: GOAL-ECTD-001
  source_proposal: IDEA-20260731-017
  version: 1
  title: >-
    Vertical-conductor Semaev/Macaulay meter discontinuity screen across
    ordinary F_p isogeny volcanoes, with matched horizontal baseline and KS
    primary statistic
  status: review_required
  approved_by: null
  frozen: true
  frozen_on: '2026-08-06'
  frozen_by_task: TASK-20260806-e693bb
  claim_tier: toy
  confirmatory_status: exploratory
  confirmatory_status_note: >-
    First vertical-conductor meter measurement for RQ-ECTD-001 family (2).
    Confirmatory only about the named toy conductor steps after independent
    review and a completed valid run set; never crypto-scale, never
    Galbraith path-finding hardness, never a trapdoor existence claim alone.

  objective: >-
    Measure whether the Semaev/FB/Macaulay meter vector already frozen by
    EXP-ECTD-001 discontinuously jumps (>=100x on a primary meter, or d_reg
    moves by >=2) across a vertical conductor step (prime q >= 17) in an
    ordinary F_p isogeny volcano, compared against a matched horizontal
    (same-level, ell-neighbor) baseline sample, using a pre-registered
    two-sample KS test as the primary decision statistic across >=8
    independent vertical edges. A confirmed discontinuity licenses only a
    follow-on path-hiding/detection experiment on the nominated endpoint --
    not a trapdoor claim, and not a statement about Galbraith path-finding
    or isogeny-evaluation hardness, which this experiment does not measure.

  claim_ceiling: >-
    Toy-tier presence/absence of a >=100x (or d_reg-2) Semaev/Macaulay
    discontinuity across >=8 vertical conductor steps at N in [40,60] bits,
    under the frozen meter/FB/solver conventions this experiment shares with
    EXP-ECTD-001. NOT CLAIMABLE UNDER ANY OUTCOME: crypto-scale ECDLP
    exponent improvement; Teske-class trapdoor existence; path-hiding
    success; Galbraith conductor-gap PATH-FINDING hardness (a distinct,
    unmeasured claim); isogeny-evaluation hardness; reopening H-ECTD-001 or
    H-ISO-001 beyond their own scoped results; GOAL-ECTD-001 completion. All
    four asymptotic-claim promotion gates remain OPEN.

  what_this_experiment_is_NOT:
    - Not a cryptanalytic attack on any deployed curve or live key.
    - >-
      Not a trapdoor construction (no secret path, no public-detection test;
      a confirmed discontinuity only nominates a candidate for a SEPARATE,
      future path-hiding/detection EXP).
    - >-
      Not a measurement of Galbraith's algorithmic path-finding hardness
      across the conductor gap -- that is a distinct claim about computing
      the connecting isogeny, not about whether algebraic meters jump.
    - Not a horizontal (within-class) EXP -- that is EXP-ECTD-001, already run and weakened at 40-bit N (DEC-20260806-4a9604).
    - Not an ordinary trapdoor-DDH gate (IDEA-20260731-018 / future EXP).
    - Not a reopen of H-ISO-001's short-neighbor rejected_scoped result, or of H-ECTD-001's weakened result, as global.

  heuristic_under_test: HEUR-ECTD-VERT-1
  preregistered_prediction:
    quantity: >-
      Two-sample KS distance between the multiset of vertical conductor-step
      meter ratios and the multiset of matched horizontal ell-neighbor meter
      ratios (identical primary meters, identical FB/solver convention,
      identical N range); per-edge maximum primary-meter ratio.
    formula: >-
      Primary decision: KS(vertical_ratios, horizontal_ratios) at the
      pre-registered alpha, computed BEFORE inspecting per-edge ratios.
      discontinuity_nominates_endpoint fires iff KS rejects exchangeability
      at alpha AND >=1 vertical edge has a primary-meter ratio >=100 (or
      d_reg delta >=2). continuity_scoped fires iff all >=8 vertical edges
      have every primary meter ratio in [0.1,10] AND KS does not reject
      exchangeability. The two branches are mutually exclusive and exhaustive
      given the completion gate below; a run that completes fewer than 8
      edges cannot fire either and resolves to resource_incomplete instead.
    source: >-
      IDEA-20260731-017; revise conditions independently re-verified applied
      at TASK-20260806-e693bb (see H-ECTD-19017a.yaml notes); HEUR-ECTD-VERT-1
      is a test hypothesis only (JMV motivates within-level mixing, not
      cross-level exchangeability, which this experiment tests directly).

  scale_relevance:
    tier: toy
    justification: >-
      Direct volcano enumeration, Vélu-formula vertical isogeny construction,
      and per-curve GB/Macaulay meters at N in [40,60] bits only. No
      correspondence to crypto-scale classes is claimed.
    correspondence: null

  tail_checks:
    - id: TAIL-ECTD-VERT-EXCEEDANCE
      check: >-
        Report extreme-value exceedance of the largest observed vertical
        ratio vs the horizontal-sample distribution under the pre-registered
        KS null; if the reported discontinuity is not extreme under that
        null, do not call it a discontinuity hit.
    - id: TAIL-ECTD-VERT-PERM-STABLE
      check: >-
        Reusing EXP-ECTD-001's TAIL-ECTD-PERM-STABLE convention: after
        shuffling curve labels within the vertical-edge sample while holding
        the ratio multiset fixed, the unshuffled identity of any claimed
        discontinuous edge must be unchanged; otherwise the claim is a
        labeling artifact.

  decision_table:
    primary_statistic: KS(vertical_ratios, horizontal_ratios) plus per-edge max ratio
    branches:
      - id: discontinuity_nominates_endpoint
        condition: >-
          KS rejects exchangeability at the pre-registered alpha AND >=1
          vertical edge has primary-meter ratio >=100 (or d_reg delta >=2)
        interpretation: >-
          Nominates the crater/floor endpoint as a candidate private
          endpoint for a later, separate path-hiding experiment. Does NOT
          establish Galbraith path-finding hardness and does NOT establish a
          trapdoor.
      - id: continuity_scoped
        condition: >-
          All >=8 prime conductor steps have all primary Semaev/FB/Macaulay
          meter ratios in [0.1,10] AND KS does not reject exchangeability vs
          the horizontal sample
        interpretation: >-
          Equation-dependent Semaev discontinuity across those conductor
          steps absent at toy scale. Named obstruction for RQ-ECTD-001 family
          (2), Semaev-meter channel only. Forward guidance: path-finding
          hardness (Galbraith), non-Semaev private advantages, and DDH
          (IDEA-20260731-018) remain open. NOT a proof that vertical Teske
          analogues are impossible.
      - id: instrument_void
        condition: >-
          End-ring/conductor computation disagrees with the constructed
          isogeny's actual degree on >1 edge, OR the GLV/CM
          endomorphism-cost instrument fails its expected move on the known
          GLV pair while Semaev meters are simultaneously mis-attributed as
          the discontinuity signal
        interpretation: Harness void; no mathematical claim on H-ECTD-19017a.
      - id: resource_incomplete
        condition: Budget exhaustion before >=8 vertical edges (and their matched horizontal sample) complete
        interpretation: Incomplete; not a continuity or discontinuity claim.

  inputs:
    n_bit_range: [40, 60]
    min_vertical_edges: 8
    matched_horizontal_sample_size: 8
    conductor_prime_candidates: [17, 19, 23, 29, 31]
    isogeny_degrees_ell_horizontal: [2, 3, 5, 7]
    meters_primary:
      - semaev_m3_relation_density
      - semaev_m4_relation_density
      - fb_decomposition_probability
      - groebner_solving_degree_d_reg
      - macaulay_rank_defect_at_first_fall
    factor_base_rule: >-
      Identical deterministic FB convention to EXP-ECTD-001, frozen in the
      run driver and hashed into each run manifest; identical convention
      across every vertical edge, its horizontal comparison sample, and all
      null arms. Reuse EXP-ECTD-001's driver/ meter functions unchanged
      wherever the object (a single curve's own (a,b,p) and meter vector) is
      identical; do not reimplement or re-tune them for this experiment.
    solver_budget: >-
      Fixed F4/GB wall and memory budget per curve, identical to
      EXP-ECTD-001's, recorded in the run manifest; timeouts labeled
      infrastructure (not hardness).
    endomorphism_ring_computation: >-
      Trace t from N = p+1-t (N from EXP-ECTD-001's own order-finding
      routine); discriminant D_pi = t^2 - 4p; conductor factored from D_pi
      relative to the field discriminant. New driver code relative to
      EXP-ECTD-001 (which has no conductor/volcano logic) -- this is the
      experiment's principal implementation risk and cost driver, named
      explicitly rather than assumed solved.
    class_invariant_negative_control: >-
      Include one known GLV/CM curve pair as an instrument check confined to
      the SEPARATE endomorphism-evaluation-cost channel; never promoted as
      Semaev sub-rho or vertical-discontinuity evidence (CTRL-GLV-CHANNEL
      below).

  controls:
    - id: CTRL-HORIZONTAL-BASELINE
      method: >-
        Matched horizontal ell-isogeny neighbor pairs at the same volcano
        level as each vertical edge's floor curve, using EXP-ECTD-001's own
        neighbor-walking code unchanged. Expect ratio ~1 (JMV-motivated,
        already characterized by H-ECTD-001/H-ISO-001).
      pass_condition: >-
        Horizontal ratio sample collected on >=8 independent pairs, matched
        in N-bit range to the vertical sample, for the primary KS statistic.
    - id: CTRL-GLV-CHANNEL
      method: >-
        One known GLV/CM curve pair, measured on a SEPARATE
        endomorphism-evaluation-cost channel only -- must not be misreported
        as Semaev sub-rho or as vertical Semaev discontinuity.
      pass_condition: >-
        Any Semaev meter movement on the GLV instrument pair is recorded but
        explicitly not promoted as vertical-discontinuity evidence in the
        decision_table branches above.
    - id: CTRL-COORDINATE-NULL
      method: >-
        Permute curve equations' Weierstrass models by F_p-isomorphism on a
        subsample of vertical-edge curves.
      pass_condition: >-
        Meter values are invariant (up to the frozen FB convention) under
        the isomorphism, i.e. not a coordinate artifact.
    - id: CTRL-PERMUTATION
      method: >-
        Within-vertical-edge-sample curve-label permutation holding the
        ratio multiset fixed; report whether any claimed discontinuous edge
        identity is stable after unshuffle (TAIL-ECTD-VERT-PERM-STABLE).
      pass_condition: Claimed discontinuous edges are permutation-stable.
    - id: CTRL-END-RING-CERTIFICATE
      method: >-
        Mandatory: independently verify each constructed vertical isogeny's
        actual degree and kernel against the claimed conductor step (Vélu
        codomain order-preservation check, reused from EXP-ECTD-001's
        verify_order_preserved, plus a conductor recomputation from the
        codomain curve's own trace).
      pass_condition: >-
        Verified degree/conductor step matches the claim on every edge; else
        instrument_void.
    - id: CTRL-RHO
      method: >-
        Matched Pollard rho baseline on the same N, reusing EXP-ECTD-001's
        driver/rho_bsgs.py `pollard_rho_plain` unchanged. Per
        CORR-20260806-2f98f4, this experiment does NOT cite any
        negation-map-specific figure for the substitution; if a
        negation-folded variant is wanted here, it must be actually built
        and measured, not assumed or backfilled from literature.
      pass_condition: Valid rho receipt per completed vertical edge; baseline only.
    - id: CTRL-BSGS
      method: Matched BSGS cost on the same N, reusing EXP-ECTD-001's driver/rho_bsgs.py unchanged.
      pass_condition: Reported alongside rho.
    - id: CTRL-NO-CLASS-INVARIANT-ENDPOINT
      method: >-
        Embedding-degree / anomalous / smooth-order detectors on any curve
        nominated as a candidate endpoint under discontinuity_nominates_endpoint.
      pass_condition: >-
        Nominated candidate endpoints are not class-invariant weak curves.
        If discontinuity_nominates_endpoint never fires, this control's
        precondition never arises and it is recorded as a genuine structural
        N/A explicitly in the run report -- not left unrecorded (per
        DEC-20260806-4a9604 finding F-2's disposition on EXP-ECTD-001, which
        this experiment's driver must not repeat).

  independent_variables:
    - conductor_prime_q
    - n_bits
    - meter_id
    - object_kind: [vertical_floor, vertical_crater, horizontal_neighbor, glv_instrument, coordinate_null]

  metrics:
    primary:
      - vertical_ratio_per_meter
      - horizontal_ratio_per_meter
      - ks_distance_vertical_vs_horizontal
      - delta_d_reg_per_edge
      - permutation_stable_discontinuity: boolean
      - end_ring_certificate_verified: boolean
      - decision_branch: discontinuity_nominates_endpoint | continuity_scoped | instrument_void | resource_incomplete
    secondary:
      - per_edge_meter_vector_floor_and_crater
      - glv_instrument_endomorphism_cost_channel
      - matched_rho_group_ops
      - matched_bsgs_group_ops
      - timeout_count_infra

  replication:
    seeds: [301, 302, 303, 304, 305, 306, 307, 308]
    seed_policy: >-
      Eight master seeds each attempt to build one vertical conductor-step
      edge (a floor/crater ordinary curve pair with prime-order N in [40,60]
      bits, conductor step q drawn from {17,19,23,29,31}) plus its matched
      horizontal-neighbor comparison sample. Additional seeds may be drawn if
      a seed fails edge construction (End-ring computation disagreement,
      failed order-preservation check, or no q-divisible conductor found
      within the attempt budget); record failures as infrastructure, not
      continuity/discontinuity.
    independent_instances: 8
    planned_runs:
      - id: RUN-ECTD-9e4248-impl
        purpose: >-
          Implement conductor/volcano computation, vertical isogeny
          construction via Vélu's formulas, and the CTRL-END-RING-CERTIFICATE
          check; smoke on one vertical edge plus its horizontal comparison
          pair. Reuse EXP-ECTD-001's meter/rho/bsgs code unchanged.
      - id: RUN-ECTD-9e4248-screen
        purpose: Full >=8-vertical-edge screen with matched horizontal sample and GLV instrument, within budget.

  budget:
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: 60
    maximum_memory_gb: 16
    maximum_runs: 2

  stopping_rules:
    - Stop a curve's GB arm at the frozen solver budget; label timeout as infrastructure.
    - Stop the experiment when total_cpu_hours exhausted; incomplete edges → resource_incomplete.
    - On CTRL-END-RING-CERTIFICATE failure on >1 edge, stop and report instrument_void.

  invalidation_rules:
    - >-
      CTRL-END-RING-CERTIFICATE fails on >1 vertical edge → void for
      mathematical claims.
    - Factor-base convention differs across any measured curve → void.
    - >-
      Class-invariant curve nominated as secret endpoint under
      discontinuity_nominates_endpoint → void for endpoint reading.
    - GLV instrument channel result promoted as Semaev vertical-discontinuity evidence → void, per CTRL-GLV-CHANNEL.
    - Fabricated or missing meter, conductor, or certificate artifacts → void.

  success_criterion: >-
    Valid decision_branch recorded with all required controls present
    (including the end-ring certificate and permutation checks); claim_tier
    remains toy.

  success_criteria:
    - >-
      Valid decision_branch recorded with all required controls present
      (including CTRL-END-RING-CERTIFICATE and CTRL-PERMUTATION).
    - >-
      claim_tier remains toy; no trapdoor, path-finding-hardness, or
      exponent language in the run report.

  falsification_criterion: >-
    continuity_scoped under valid end-ring certificates: H-ECTD-19017a's
    discontinuity prediction fails at tested toy scope (scoped Semaev-channel
    null, not a Galbraith path-finding or family-wide barrier).

  falsification_criteria:
    - >-
      continuity_scoped under valid end-ring certificates: H-ECTD-19017a's
      discontinuity prediction fails at tested toy scope (scoped
      Semaev-channel null, not a Galbraith path-finding or family-wide
      barrier).
    - instrument_void: no evidence against the mathematical hypothesis.

  required_artifacts:
    - exact command / driver version
    - git commit and dirty-tree state
    - environment.json
    - per-edge meter tables, vertical and horizontal (machine-readable)
    - end-ring / conductor certificates per edge
    - GLV instrument channel receipt (isolated)
    - coordinate-null receipts
    - permutation stability table
    - matched rho/BSGS receipts
    - stdout/stderr
    - raw-result.json with decision_branch

  analysis_plan: >-
    Pre-register decision_table branches and the KS alpha before any run. Do
    not tune thresholds post-hoc. Report HEUR-ECTD-VERT-1 status only via the
    KS test against the matched horizontal sample, never via JMV citation
    alone. Cite EXP-ECTD-9e4248 / RUN-* IDs, and EXP-ECTD-001 / H-ECTD-001 for
    the shared horizontal baseline and meter definitions, in any conclusion.
