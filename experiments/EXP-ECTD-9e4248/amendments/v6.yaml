  operative_version_statement: >-
    Version 2 remains the only operative approved protocol. Amendments v3,
    v4, and v5 are immutable rejected review_required proposals and remain
    byte-for-byte historical records. Amendment ordinal 6 is a prospective
    additive proposal over base version 2. It would result in version 3 only
    after the separately frozen snapshot, eight-row static witness snapshot,
    fresh independent adversarial review, and later faithful Coordinator
    determination. This package creates none of those authorities.

  scientific_question_preserved_verbatim: >-
    Measure whether the Semaev/FB/Macaulay meter vector already frozen by
    EXP-ECTD-001 discontinuously jumps (>=100x on a primary meter, or d_reg
    moves by >=2) across a vertical conductor step (prime q >= 17) in an
    ordinary F_p isogeny volcano, compared against a matched horizontal
    (same-level, ell-neighbor) baseline sample, using a pre-registered
    two-sample KS test as the primary decision statistic across >=8
    independent vertical edges. A confirmed discontinuity licenses only a
    follow-on path-hiding/detection experiment on the nominated endpoint --
    not a trapdoor claim, and not a statement about Galbraith path-finding
    or isogeny-evaluation hardness, which this experiment does not measure.

  reason: >-
    Prospectively repair the v5 q=29 parity obstruction and the v5 universal
    modulo-three subgroup-order obstructions using the smallest frozen class
    changes, then close the six source/serialization/control/decision design
    blocker families without performing a witness search or curve experiment.
    The map is outcome-independent. No accepted arithmetic witness is asserted.

