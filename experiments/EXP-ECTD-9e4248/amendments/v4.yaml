          When effective_planting=false, every m3, m4, factor-base-probability, and Groebner/Macaulay representative target uses the frozen ordinary random-point constructor.
          When effective_planting=true, m3 targets are actual sums of two sampled factor-base points, m4 targets are actual sums of three sampled factor-base points, and factor-base-probability targets are actual sums of two sampled factor-base points.
