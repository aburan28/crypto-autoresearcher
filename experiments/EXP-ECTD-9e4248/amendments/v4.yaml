  static_feasibility_obstruction:
    id: ECTD-V4-STATIC-OBS-DK7-MOD8
    status: blocking_protocol_design_obstruction
    affected_slots:
      - {seed: 301, target_N_bits: 40, D_K: -7, q: 29, horizontal_ell: 2}
      - {seed: 305, target_N_bits: 52, D_K: -7, q: 23, horizontal_ell: 2}
      - {seed: 308, target_N_bits: 60, D_K: -7, q: 29, horizontal_ell: 2}
    frozen_interpretation: >-
      p is an odd prime, N is the odd prime full group order #E(F_p),
      t=p+1-N, and Delta_pi=t^2-4p must equal q^2*D_K exactly.
    derivation:
      - For odd p and odd prime N, t=p+1-N is odd.
      - For odd t and odd p, t^2-4p is congruent to 5 modulo 8.
      - For odd q, q^2 is congruent to 1 modulo 8.
      - Negative seven is congruent to 1 modulo 8, so q^2*(-7) is congruent to 1 modulo 8.
      - Therefore t^2-4p cannot equal q^2*(-7) under the frozen interpretation.
    consequence: >-
      The three D_K=-7 slots cannot admit a candidate under the frozen exact
      prime/full-group-order semantics. Their counter search terminates
      resource_incomplete and the complete eight-slot conjunction cannot pass.
      No implementation, target access, or experiment run may proceed under
      this v4 proposal. A separately authorized additive successor must revise
      the construction semantics explicitly; this task may not choose a
      cofactor, enlarge the Frobenius conductor, replace D_K, replace q, or
      substitute widths.
    review_instruction: >-
      The fresh independent Red Team must treat this as a blocking approval
      issue and return the proportional protocol disposition; it must not
      pretend the success-producing map is total or waive the obstruction
      because the rejection map is deterministic.
    claim_boundary: >-
      This is a static protocol-consistency obstruction only. It is not a run,
      target observation, impossibility result for conductor mechanisms, or
      evidence for or against H-ECTD-19017a.

