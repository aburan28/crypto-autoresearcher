        experiment_id: EXP-ECTD-9e4248
        amendment_ordinal: 5
      integer_encoding: decimal_JSON_number_because_all_input_integers_are_below_2_pow_53
      object_serialization: RFC_8785_JCS_UTF8_no_BOM_no_terminal_LF
      hash_for_receipt: SHA256_exact_serialized_bytes
    pseudorandom_expansion:
      function: SHAKE256
      input: exact_canonical_input_object_bytes
      output_bytes: 32
      byte_order: big_endian_unsigned_integer_z
      domain_separation_is_in_canonical_schema_and_fields: true
      no_hidden_seed_or_rng_state: true
    trace_residue_class:
      D_K_minus_7:
        modulus_L: 32
        least_nonnegative_trace_residue_r: 0
      D_K_minus_8:
        modulus_L: 8
        least_nonnegative_trace_residue_r: 2
      D_K_minus_11:
        modulus_L: 2
        least_nonnegative_trace_residue_r: 1
      D_K_minus_19:
        modulus_L: 2
        least_nonnegative_trace_residue_r: 1
      verification: >-
        For the selected r and L, ((t-2)^2-f_pi^2*D_K) is divisible
        by 4*h whenever t is congruent to r modulo L.
    exact_interval_construction:
      definition:
        - lower_N = 2^(target_N_bits-1)
        - upper_N_exclusive = 2^target_N_bits
        - t_min is the least nonnegative t congruent to r modulo L for which N(t) >= lower_N
        - t_max is the greatest nonnegative t congruent to r modulo L for which N(t) < upper_N_exclusive
        - count = 1 + (t_max-t_min)/L
        - t = t_min + L*(z mod count)
        - p = (t^2 - f_pi^2*D_K)/4
        - M = p + 1 - t
        - N = M/h
      integer_operations: exact_unbounded_integers
      square_root_boundary_rule: integer_isqrt_plus_monotone_adjustment_until_both_N_bounds_hold
      empty_interval_disposition: resource_incomplete
      postconditions:
        - t is congruent to r modulo L
        - p is integral
        - M is integral
        - M is divisible by h
        - N is integral
        - N.bit_length() equals target_N_bits
        - M equals h*N
        - M equals p+1-t
        - t^2-4*p equals f_pi^2*D_K
    deterministic_primality:
      domain: 0 <= candidate < 2^64
      algorithm: strong_Miller_Rabin_after_trial_division_by_2_3_5_7_11_13_17_19_23_29_31_37
      ordered_bases: [2, 325, 9375, 28178, 450775, 9780504, 1795265022]
      base_reduction: a_mod_n
      witness_order: exactly_as_listed
      accepted_if: p_and_N_both_pass_and_every_postcondition_passes
    ordered_rejection_codes:
      - INPUT_SERIALIZATION_MISMATCH
      - EMPTY_TRACE_INTERVAL
      - NONINTEGRAL_P
      - NONINTEGRAL_N
      - N_BIT_LENGTH_MISMATCH
      - P_NOT_ODD
      - N_NOT_ODD
      - P_COMPOSITE
      - N_COMPOSITE
      - HASSE_BOUND_FAILURE
      - ORDER_IDENTITY_FAILURE
      - DISCRIMINANT_IDENTITY_FAILURE
      - ACCEPTED
    one_code_per_counter: first_applicable_in_this_order
    witness_unknown_at_authoring_time: true
    no_accepted_counter_asserted_here: true

  static_witness_task_contract:
    task_id: TASK-20260813-ef0e3a
    report_path: coordination/goals/GOAL-ECTD-001/batches/BATCH-33b207/ectd-v5-subgroup-order-repair/tasks/TASK-20260813-ef0e3a/static-witness-report.yaml
