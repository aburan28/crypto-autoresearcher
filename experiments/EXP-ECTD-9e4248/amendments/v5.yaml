        primality: PRIMALITY
        cm_curve: CM_CURVE
        kernel: KERNEL
        conductor: CONDUCTOR
      details: exact_code_specific_mapping_with_no_unlisted_keys
      code_specific_details:
        P_COMPOSITE: [p]
        N_COMPOSITE: [N]
        N_BIT_LENGTH_MISMATCH: [N, expected_bits, observed_bits]
        ORDER_IDENTITY_FAILURE: [p, t, M, h, N]
        DISCRIMINANT_IDENTITY_FAILURE: [p, t, D_K, f_pi]
        COUNTER_CAP_EXHAUSTED: [first_counter, last_counter, evaluated]
      unrecognized_or_missing_detail: invalid_before_target
    implementation_independence_rule: >-
      A byte string not produced by these exact schemas and JCS rules is a
      mismatch even if it parses to an equal mathematical value.

  prospective_CM_curve_and_kernel_contract:
    status: frozen_design_not_implemented
    arithmetic_witness_is_not_a_curve_witness: true
    curve_selection:
