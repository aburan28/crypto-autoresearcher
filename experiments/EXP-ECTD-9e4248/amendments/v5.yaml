      - searching beyond counter 4999
      - row, seed, width, D_K, q, ell, h, or f_pi substitution
      - curve or isogeny construction
      - target access or meter execution
      - rho, BSGS, or GLV execution
      - scientific interpretation or status change

  canonical_serialization_contract:
    JSON:
      profile: RFC_8785_JCS
      encoding: UTF-8
      BOM: prohibited
      terminal_LF: prohibited
      object_property_order: recursive_UTF16_code_unit_lexicographic_as_required_by_JCS
      arrays: preserve_declared_order
      booleans_and_null: lowercase_JSON_tokens
      unsafe_integer_rule: >-
        Every integer with absolute value greater than 9007199254740991 is a
        base-10 string matching zero or [1-9][0-9]*, prefixed by '-' only when
        negative. No leading plus or leading zero is permitted.
      rationals:
        schema: {numerator: exact_decimal_string, denominator: positive_exact_decimal_string}
        normalization: gcd_one_denominator_positive
    field_element:
      schema: {field: Fp, modulus_p: exact_decimal_string, value: exact_decimal_string}
      value_range: 0_le_value_less_than_p
    affine_point:
      infinity_schema: {field: Fp, modulus_p: exact_decimal_string, infinity: true}
      finite_property_set: [field, modulus_p, infinity, x, y]
      finite_infinity_value: false
      coordinates: least_nonnegative_exact_decimal_strings
      ordering: infinity_first_then_x_then_y
    polynomial:
      coefficient_order: ascending_degree
      coefficients: canonical_field_elements
      monic_normalization: required
      trailing_zero_coefficients: prohibited
    rejection_record:
