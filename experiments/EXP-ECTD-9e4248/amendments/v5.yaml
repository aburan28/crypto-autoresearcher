  operative_version_statement: >-
    Version 2 remains the only operative approved protocol. Amendments v3 and
    v4 were independently reviewed as REVISE and never became operative.
    Amendment ordinal 5 is an additive proposal over base version 2 and would
    result in version 3 only after two truthful content-first snapshots, a
    bounded static arithmetic-witness search, fresh independent adversarial
    review, and a later Coordinator approval decision. This file grants none of
    those later authorities.

  reason: >-
    Repair the exact modulo-eight inconsistency and determinism defects exposed
    in immutable v4 without altering any prior byte. The repair distinguishes
    the prime subgroup order N from the full group order M=hN, derives the
    Frobenius trace from M, and selects the Frobenius conductor and cofactor
    prospectively for each CM discriminant class. It also freezes a total
    arithmetic candidate map, exact serialization, endpoint-local whole-ring
    certificates, undefined-statistic behavior, and terminal classifications.
    The existence of accepted arithmetic candidates is deliberately not
    assumed: a separate Executor task must search the predeclared counter
    domain and record either the first accepted witness or a bounded no-hit for
    every row. These are protocol-integrity facts only, never evidence for or
    against H-ECTD-19017a.

