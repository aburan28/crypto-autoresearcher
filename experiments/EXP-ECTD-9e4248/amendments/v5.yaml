  repaired_order_semantics:
    notation:
      N: prime subgroup order used by later DLP controls
      h: exact positive cofactor
      M: full curve group order over F_p
      t: Frobenius trace
      D_K: fundamental CM discriminant
      f_pi: conductor of the Frobenius order inside the maximal order
      Delta_pi: Frobenius discriminant
    normative_equalities:
      - M = h * N
      - M = p + 1 - t
      - t = p + 1 - M
      - Delta_pi = t^2 - 4*p
      - Delta_pi = f_pi^2 * D_K
    primality_requirements:
      - p is an odd prime
      - N is an odd prime
    prohibited_legacy_interpretation: N_equals_full_group_order
    class_mapping:
      '-7':
        f_pi_formula: 2*q
        cofactor_h: 8
        auxiliary_conductor_primes: [2]
        explanation: >-
          The extra factor 2 in f_pi and cofactor 8 make the congruence class
          compatible while keeping q as the intended vertical depth. Any
          future whole-conductor certificate must account independently for
          both 2 and q.
      '-8':
        f_pi_formula: q
        cofactor_h: 2
        auxiliary_conductor_primes: []
      '-11':
        f_pi_formula: q
        cofactor_h: 1
        auxiliary_conductor_primes: []
      '-19':
        f_pi_formula: q
        cofactor_h: 1
        auxiliary_conductor_primes: []
    no_other_mapping_permitted: true
    derivation_identity: >-
      Substituting p=M+t-1 into Delta_pi=f_pi^2*D_K yields
      (t-2)^2 - 4*h*N = f_pi^2*D_K. The static search must verify this
      identity exactly with integers for every accepted row.

