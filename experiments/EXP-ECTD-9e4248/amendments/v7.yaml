    size_bytes: 9421
    sha256: 8a90c94b5a2b7101b4266224c441f34552cb786ed51120c4396df87c22fe312f
  keyed_rng:
    algorithm: ECTD-SHAKE256-RANDBELOW-v1
    key_fields: [domain, curve_id, meter_subseed, meter_id, sample_index, attempt_index, draw_index]
    arm_key_forbidden: true
    rejection_block_bits: 256
    receipts_bind: [key, attempt_bytes, accepted_integer, modulus, consuming_predicate]
  atomic_triplet:
    ordinary: {plant_requested: false, planting_code_enabled: true, effective: false}
    planted: {plant_requested: true, planting_code_enabled: true, effective: true}
    disabled_negative: {plant_requested: true, planting_code_enabled: false, effective: false}
    same_curve_and_meter_subseed: true
    ordinary_disabled_unplanted_target_bytes_identical: true
  exact_per_arm_schedule:
    semaev_m3_raw_samples: 6
    semaev_m4_raw_samples: 6
    factor_base_decomposition_raw_samples: 24
    shared_groebner_macaulay_targets: 1
  raw_first_requirements:
    - All three arms use the same raw predicate and arm-blind reducer functions.
    - Factor-base decomposition evaluates and retains every ordered pair, without early exit.
    - Primary densities and probabilities are exact hit/trial ratios derived only from residues.
    - Groebner timeout and unobserved Macaulay fall are resource limits, never fabricated values.
    - An arm flag selects target construction only and never assigns a metric, hit, or success.
  decision_requirements:
    - At least eight complete typed vertical edges and all matched horizontal/control receipts.
    - Ratios, band flags, extreme flags, and instrument validity are replay-derived.
    - resource_incomplete and instrument_void precede the sole exact KS computation.
    - The unchanged v2 three data-bearing branches are recomputed as an exhaustive partition.

