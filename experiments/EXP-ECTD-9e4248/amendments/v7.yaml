o2_typed_certificate_replay:
  verifier: experiments/EXP-ECTD-9e4248/amendments/v7/certificate-replay.py
  fixtures: experiments/EXP-ECTD-9e4248/amendments/v7/known-answer-fixtures.json
  positive_fixture_count: 1
  positive_scope: sole-fixed-tiny-protocol-neutral-non-target-known-answer
  exact_domain:
    base_prime_maximum: 257
    extension_degree_maximum: 3
    admitted_division_primes: [2, 3]
  replay_components:
    - finite and extension field construction with irreducibility
    - nonsingular curve, model, twist identity, and exhaustive tiny point order
    - exact prime order-N point
    - q and ell division polynomials and all cyclic lines
    - Frobenius line orbits and canonical stable kernels
    - Velu coefficients, codomains, and full tiny image tables
    - dual Velu maps and both pointwise degree-composition identities
    - endomorphism order from an explicit Z[pi] basis and fundamental discriminant
    - independently recomputed whole conductors with explicit 2-adic and q-adic obligations
    - exact identity, uniqueness, ordering, and cross-list correspondence
  exclusions:
    - no scheduled tuple
    - no 40-60-bit subgroup order
    - no target or meter
    - no feasibility or scientific inference

o3_control_and_meter_path:
