experiment:
  id: EXP-EQLA-a468c4
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-9ecc6f
  question_id: RQ-EQLA-0d3f40
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'CLOSURE WITH THE OBSTRUCTION NAMED: the commutant of a finite abelian group acting on a
    phi-stable factor base is a PRODUCT OF FULL MATRIX ALGEBRAS of size B/g, which admits no superfast
    solver - so the alpha^2 B log B cost model of H-STR-002 is imported from nilpotent-shift Toeplitz
    theory and does not apply, the entire available saving is g in relations and g^2 in linear-algebra
    operations, block-diagonalisation and orbit-quotienting are THE SAME saving and must not be multiplied,
    and g <= 3 on the x-coordinates of any prime-field curve'
  status: draft
  objective: "(A) WHAT THE PROGRAM'S COST MODEL ASSUMES. H-STR-002, IDEA-20260726-002 and the committed\
    \ harness all price the structured solve at alpha^2 * B * ceil(log2 B), and compare it to Wiedemann\
    \ at 2 B^2. That formula is the Toeplitz-like/displacement-rank cost of Kailath-Kung-Morf type\
    \ theory, whose superfast divide-and-conquer solvers require the displacement operators to be\
    \ NILPOTENT lower-shift matrices Z with Z^B = 0. The reason is structural: Schur complements of\
    \ Toeplitz-like matrices are again Toeplitz-like with controlled displacement rank, which is what\
    \ makes the recursion close. EV-STR-003 recorded this as an OPEN cost-model objection (RT-CM-1:\
    \ \"displacement-rank theory applied to a finite-order permutation rather than a nilpotent shift\"\
    ) and explicitly stated that RT-CM-1 through RT-CM-6 \"remain OPEN and must not be described as\
    \ settled\". This record settles RT-CM-1, in the negative, with an argument.\n(B) THE OBSTRUCTION,\
    \ NAMED. The operator actually used in this lane is Sigma, the permutation matrix of the phi-action\
    \ on the factor base, of FINITE ORDER g (g = 3 on the x-coordinates of a j = 0 curve). A matrix\
    \ M with M Sigma = Sigma M lies in the COMMUTANT of the representation of C_g on F_N^B. Since\
    \ gcd(g, N) = 1 and F_N contains a primitive g-th root of unity (forced: lambda has multiplicative\
    \ order g in (Z/N)^*, so g | N - 1), Maschke and Wedderburn give\n  F_N^B = direct sum over the\
    \ g characters of C_g of eigenspaces, each of\n  dimension B/g, and\n  Commutant = product over\
    \ j = 0..g-1 of M_{B/g}(F_N),\na product of g FULL matrix algebras of size B/g. There is no proper\
    \ structure inside a full matrix algebra: a generic element of M_{B/g}(F_N) has no displacement\
    \ structure with respect to any nilpotent shift, its inverse costs (B/g)^omega dense or 2 (B/g)\
    \ matrix-vector products sparse, and no log-factor solver exists or is claimed to exist in the\
    \ literature for it. THE OBSTRUCTION IS THEREFORE: g-fold equivariance buys exactly a g-fold block\
    \ split and nothing inside the blocks; the blocks are generic; and \"superfast\" is unavailable\
    \ because the displacement operator has finite order rather than being nilpotent.\n(C) THE ARITHMETIC,\
    \ STATED HONESTLY AND WITHOUT DOUBLE COUNTING.\n  Dense: B^3 becomes g (B/g)^3 = B^3 / g^2.  Gain\
    \ g^2.\n  Sparse Wiedemann: 2 B * nnz becomes sum_j 2 (B/g) nnz_j <= 2 (B/g) nnz.\n    Gain g.\
    \ (Each Fourier block is (B/g) x (B/g) with nnz_j at most the\n    number of nonzero group-algebra\
    \ entries, which is at most nnz / g when\n    each g x g circulant block carries one nonzero coefficient.)\n\
    \  THESE ARE CONSTANT FACTORS, NOT EXPONENTS. This record claims NOTHING more\n  than a constant\
    \ factor and identifies no place where more could come from\n  over a prime field.\nTHE DOUBLE-COUNTING\
    \ TRAP, which is the real content of (C). One is tempted to compose the g-fold block split with\
    \ the g-fold orbit quotient of IDEA-20260727-001 and claim g^2 in the sparse case. That is wrong,\
    \ and the reason is exact: the orbit-quotient fold r -> sum_t lambda^t r_{sigma^t(i)} IS the isotypic\
    \ projection onto the lambda-eigenspace, written in orbit-representative coordinates (IDEA-20260807-0e4d83).\
    \ They are the same map. Block-diagonalising and then quotienting quotients twice. THE CORRECT\
    \ ACCOUNTING, against a size-matched generic factor base with B columns and B independent unknowns:\
    \ g fewer relations needed (B/g instead of B) and g^2 fewer linear-algebra operations (2 (B/g)^2\
    \ w instead of 2 B^2 w), because only ONE of the g blocks is informative and the other g-1 need\
    \ never be formed. That is precisely the published Frobenius-orbit reduction of Galbraith-Granger-Merz-Petit\
    \ (eprint 2020/1315: \"a reduction by a factor of 1/n\" in polynomial systems and \"an acceleration\
    \ of the linear algebra step ... by a factor n^2\"), with their extension degree n replaced by\
    \ g.\n(D) WHY g IS BOUNDED BY 3 OVER A PRIME FIELD, WHICH IS WHERE THE LANE ENDS. The group acting\
    \ must (i) map the factor base to itself, (ii) be realisable on x-coordinates by a map cheap enough\
    \ not to swamp the saving, and (iii) act on G so that orbit logarithms are related by publicly\
    \ known scalars - without (iii) there is no reduction in unknowns and hence no saving at all.\
    \ Over F_p the maps satisfying all three are the units of End_{F_p}(E), i.e. Aut(E), of order\
    \ 2 (generic), 4 (D_0 = -4) or 6 (D_0 = -3). On X-COORDINATES the negation acts trivially - (x,\
    \ y) and (x, -y) share x - so an x-coordinate factor base has ALREADY spent the factor 2, and\
    \ the residual group is mu_3 for j = 0 and mu_2 for j = 1728. Hence g <= 3, marginal sparse gain\
    \ <= 3, marginal dense gain <= 9, over the baseline every implementation already uses. On subfield\
    \ curves the analogous group is generated by Frobenius and has order n, unbounded in the field\
    \ extension degree - which is exactly why eprint 2020/1315 is a real result there and why its\
    \ analogue here is a constant.\n(E) THE FORWARD GUIDANCE, which is what makes this a closure and\
    \ not a fatigue report. What remains open after this obstruction:\n  (i) Groups acting on the\
    \ factor base that do NOT act as scalars on G -\n    set-symmetries of the factor-base defining\
    \ condition, or the S_m\n    permutation of summands. These change the POLYNOMIAL SYSTEM and hence\n\
    \    relation-collection cost (lane L4), not the linear algebra; and\n    EV-EQJ-001 measured\
    \ that for S_3 semidirect (Z/2)^3 the ranks do not\n    split at all, so the block route there\
    \ is worse, not better.\n  (ii) Endomorphisms of norm > 1 whose eigenvalue has large multiplicative\n\
    \    order, giving g unbounded. That is a genuine attempt at a super-constant\n    and it is written\
    \ up separately as IDEA-20260807-45a69f, whose predicted\n    obstruction is different (generic-group\
    \ simulability) and must be\n    checked on its own terms.\n  (iii) Structure in the SPARSITY\
    \ PATTERN rather than in the group action -\n    whether equivariance changes the column-weight\
    \ distribution enough to\n    alter structured Gaussian elimination (IDEA-20260807-d20846).\n\
    \  (iv) Whether the g-fold relation saving survives the density penalty at\n    all (IDEA-20260807-d6956c).\
    \ If it does not, even the constant is zero.\nNOTHING HERE DECLARES ANY DIRECTION IMPOSSIBLE.\
    \ It names one obstruction, argues it, and says what is left."
  resource_label: 'audit: consumes no resource. This record prices the R1 + R3 mechanism that the
    other L5 proposals consume; it makes no measurement requiring a curve and mounts nothing.'
  admissibility: admissible
  admissibility_argument: 'An audit consumes no resource and cannot be inadmissible on the resource-naming
    ground. Its conclusion, however, bears directly on admissibility: the mechanism it prices is admissible
    (the equivariance is realised by field operations on x-coordinates, not by group-oracle outputs)
    and is nonetheless capped at a constant, which is the outcome the DECOMPOSITION section 2 filter
    predicts for any lane whose informational content reduces to scalar action on G. The record is
    therefore a worked instance of the filter rather than an exception to it.'
  reachability_gate: 'T5''s isogeny-walk form does not apply; no curve is moved between. T4 binds
    and is the sharpest statement available: g = 3 requires D_0 = -3 and g = 2 (on x-coordinates)
    requires D_0 = -4, both fixed by the isogeny class and unreachable by any walk from a class lacking
    them. So the ceiling of this record is not merely small, it is unreachable for the generic prime-field
    curve at any cost - g = 1 there and the entire lane is empty. Cost of reaching a good object from
    a generic curve: infinite. Within the D_0 = -3 family the object is free (B multiplications by
    zeta). SCOPE NOTE, not an attack claim: secp256k1 has a = 0 and lies in the family, so the ceiling
    applies to it and equals a factor of at most 9 on a stage worth at most 3%.'
  inputs:
    procedure: 'This is an argument; its "test" is a symbolic audit plus a cheap measurement, and
      it costs almost nothing. STAGE 0 (zero compute): STEP 4, the literature obligation. Run it FIRST,
      because a positive hit inverts the record. STAGE 1 (seconds): STEP 1 idempotent known-answer
      test, per instance. STAGE 2 (seconds): STEP 2 isomorphism/reassembly check, on random equivariant
      matrices and on a curve-derived one. STAGE 3 (minutes): STEP 3, all four cost models on identical
      instances, in field operations, with peak memory beside each. STAGE 4 (minutes): NULL 1 across
      equivariance fraction c; NULL 3 non-coprime synthetic. STAGE 5 (zero compute): STEP 5 retrodiction
      of EV-EQJ-001, then write the closure at the section-4 standard.'
    mechanism: "This is an ARGUMENT, not an experiment, and its steps are proof steps. It is nonetheless\
      \ falsifiable at every one of them and each is cheap to check symbolically at toy scale.\nSTEP\
      \ 1. Establish the split. Verify gcd(g, N) = 1 and that F_N contains a primitive g-th root of\
      \ unity (forced: lambda has order g mod N). Construct the g idempotents e_j = (1/g) sum_t zeta^{-jt}\
      \ Sigma^t explicitly over F_N; verify e_j e_k = delta_{jk} e_j and sum_j e_j = I numerically.\
      \ This is a known-answer test of the whole framework and takes milliseconds.\nSTEP 2. Exhibit\
      \ the isomorphism. For a random equivariant M, compute the g blocks and verify that block multiplication\
      \ reproduces the blocks of M^2, and that reassembly from blocks returns M exactly. This establishes\
      \ computationally that no information is lost, which is the section-2 verdict.\nSTEP 3. Price\
      \ the three cost models on the SAME instance, in the SAME unit (field operations), with memory\
      \ reported beside time:\n  (a) plain Wiedemann on the full B x B equivariant system: 2 B * nnz;\n\
      \  (b) blockwise Wiedemann on all g blocks: sum_j 2 (B/g) nnz_j;\n  (c) Wiedemann on the single\
      \ informative block: 2 (B/g) nnz_lambda;\n  (d) the H-STR-002 model alpha^2 B ceil(log2 B) with\
      \ the measured alpha.\nReport all four. The claim is (b)/(a) about 1/g, (c)/(a) about 1/g^2,\
      \ and that (d) is not a valid cost for ANY of them because no algorithm achieving it on a finite-order-commutant\
      \ matrix is exhibited. Whoever wishes to defend (d) must exhibit the algorithm; the burden is\
      \ stated here explicitly.\nSTEP 4. The literature obligation, discharged before the argument\
      \ is reported as a closure. Search for any superfast (softly linear in B) solver for matrices\
      \ commuting with a finite-order permutation, i.e. for block-circulant systems with generic blocks.\
      \ The expected finding is that the standard method IS the DFT block-diagonalisation, giving\
      \ exactly the factor g, and that superfast methods require displacement with respect to nilpotent\
      \ shifts. If instead such a solver is found, THIS RECORD IS WRONG and the finding is an ingredient\
      \ of enormous value to the lane - so the search is run to succeed, not to confirm.\nSTEP 5.\
      \ The nearby-object control, run before the closure is written. Apply the same argument to the\
      \ S_m action on summands (EV-EQJ-001's object), where the group does not act as a scalar on\
      \ G, and check that the argument predicts what was measured there: blocks with multiplicity,\
      \ no reduction in unknowns, and hence NO saving - which is what \"LA factor (all-blocks) = 0.25\
      \ exactly at all cells\" reports. An argument that cannot retrodict the one measured instance\
      \ of block-splitting this program already has is not ready to be a closure.\nSTEP 6. Write the\
      \ closure at the docs/inventor-protocol.md section 4 standard: named obstruction (B), argument\
      \ (STEPS 1-5), forward guidance (E). Explicitly NOT a claim that any direction is impossible."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - NULL 1 - matched random equivariant matrix, identical shape, density and column-orbit structure,
    swept over the equivariance fraction c.
  - NULL 2 - the S_m summand action; the argument must predict EV-EQJ-001's measured non-splitting.
  - NULL 3 - synthetic non-coprime instance where Maschke fails.
  - g = 1 and g = n limiting cases, symbolically.
  - Matched Pollard rho with negation and BSGS in group operations for the Pareto row, even though
    nothing is attacked.
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING even for an argument, because the argument''s
    empirical limb (STEP 3) reports measured ratios. NULL 1 - MATCHED RANDOM EQUIVARIANT MATRIX: a
    random matrix of identical shape, density and column-orbit structure, made exactly Sigma-equivariant
    by construction, with NO curve behind it. PREDICTED: identical block sizes, identical ratios (b)/(a)
    about 1/g and (c)/(a) about 1/g^2. The ratios are properties of the ALGEBRA, so the null must
    match, and its matching is the calibration that forbids reporting the factor g as an elliptic-curve
    finding. DECAY PARAMETER: the equivariance fraction c, the fraction of rows that are exact Sigma-shifts.
    As c falls from 1 to 0 the blocks stop being well-defined, the reassembly check of STEP 2 must
    fail, and the measured ratios must degrade smoothly to 1 (no saving). A ratio that stays at 1/g
    for a non-equivariant matrix means the blocks are being formed from a matrix they do not describe,
    and every number is void. NULL 2 - THE NEARBY OBJECT (STEP 5): the S_m summand action, where the
    argument predicts NO saving and EV-EQJ-001 measured none. A version of this argument that predicted
    a saving there would be falsified by an existing committed run set. NULL 3 - NON-COPRIME ORDER:
    a synthetic instance with g | N (constructible only synthetically here, since g in {2, 3} and
    N is a large prime, so it must be built as an abstract matrix problem over a small F_N with N
    = g). Maschke fails, the split must degrade to block-triangular, and the measured ratio must be
    worse than 1/g. This checks that the argument''s hypotheses are load-bearing rather than decorative.'
  independent_variables: []
  metrics:
    primary:
    - idempotent orthogonality residuals (must be exactly zero over F_N)
    - reassembly exactness flag per matrix and per c
    - nnz, nnz_j for each j, and the measured nnz_j / (nnz / g)
    - all four cost-model values in field operations, plus peak memory
    secondary:
    - the three ratios in predictions, curve arm and null arm
    - within-orbit support-collision fraction per instance (HEUR-L5-6)
    - the literature search log for STEP 4, with what was searched and found
  heuristic_under_test: null
  preregistered_prediction:
    quantity: blockwise_sparse_cost / plain_sparse_cost (all g blocks)
    formula: In [0.8/g, 1.2/g] on both the curve arm and NULL 1, i.e. about 1/3 for g = 3. A ratio
      materially below 1/g on the curve arm and not on the null would mean the curve contributes structure
      the algebra does not explain and would be the one interesting event.
    source: pre-registered in IDEA-20260807-9ecc6f before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - COST UNITS. EV-STR-003 recorded RT-CM-6, non-comparable units, as OPEN. All four cost models must
    be reported in the SAME unit (field multiplications in F_N) with memory beside them, or the comparison
    repeats the defect.
  - alpha = 0 DEGENERACY. RT-CM-2 records that the H-STR-002 model prices an alpha = 0 matrix at zero
    operations. Any comparison including model (d) must handle alpha = 0 explicitly rather than reporting
    a zero cost.
  - THE BASELINE IS ALREADY NEGATION-QUOTIENTED. Comparing the phi structure against a baseline that
    has not spent the factor 2 inflates the apparent gain from 3 to 6. Every reported ratio must name
    which baseline it uses.
  - RECTANGULAR SYSTEMS. Relation matrices are R x B with R > B. The commutant argument is stated
    for square matrices; for rectangular ones the correct statement is about the module map, and the
    block sizes are (R/g) x (B/g). EV-STR-003 recorded that the rectangular limb of the committed
    displacement code was NEVER EXERCISED in 16 of 16 cells, so this is not a hypothetical gap.
  - PARALLELISM. A g-fold block split is embarrassingly parallel; a plain Wiedemann is not, but Coppersmith
    block Wiedemann is. Comparing serial operation counts while one side is trivially parallel and
    the other needs blocking is a real confounder for any wall-clock statement, and no wall-clock
    statement is made here for that reason.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: In [0.8/g, 1.2/g] on both the curve arm and NULL 1, i.e. about 1/3 for g = 3.
    A ratio materially below 1/g on the curve arm and not on the null would mean the curve contributes
    structure the algebra does not explain and would be the one interesting event.
  falsification_criterion:
  - STEP 4 finds a softly-linear solver for generic-block block-circulant or finite-order-commutant
    systems. The named obstruction is false, the ceiling moves, and this record is superseded by one
    that adopts the solver. This is the outcome the record would most like to be wrong about and it
    is checked first.
  - The measured blockwise ratio is materially below 1/g on the curve arm and NOT on the matched null.
    The algebra does not explain the saving and something curve-specific is present; independent review
    before any interpretation.
  - The reassembly check fails at c = 1. The block construction is wrong and every cost number in
    the record is void - an instrument failure, not a mathematical result.
  - The argument fails to retrodict EV-EQJ-001's non-splitting. It does not capture the distinction
    between scalar and non-scalar group actions, and it is not ready to be a closure.
  - Someone exhibits a factor base over F_p, stable under a group of order g > 3 acting on x-coordinates
    by maps of degree o(B) and acting on G by publicly known scalars. The ceiling g <= 3 is false
    as stated and the lane reopens. IDEA-20260807-45a69f is the deliberate attempt to do exactly this.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-9ecc6f
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
