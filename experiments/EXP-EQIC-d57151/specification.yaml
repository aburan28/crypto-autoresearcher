experiment:
  id: EXP-EQIC-d57151
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-b42544
  question_id: RQ-EQIC-8cb959
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE L4 MEASUREMENT CONTRACT: the primary quantity for every phi-stable factor-base claim
    is RANK INCREMENT PER SUCCESSFUL DECOMPOSITION SEARCH over the reduced unknown set, never relation
    rows per search, measured against a CARDINALITY-MATCHED random factor base on the same curve and
    same targets, with an orbit-breaking parameter epsilon whose increase must destroy any phi-attributed
    effect'
  status: draft
  objective: "(A) THE ARITHMETIC THAT DECIDES THE WHOLE LANE. Let E/F_p have j = 0 (a = 0, p = 1 mod\
    \ 3) with automorphism phi(x, y) = (zeta_3 x, y), and let G = <P> have prime order N. In End(E)\
    \ the relation 1 + phi + phi^2 = 0 holds, so phi acts on G as multiplication by a scalar lambda\
    \ in Z/N with lambda^2 + lambda + 1 = 0 (mod N) (H-ENDO-001, KN-FIND-b7e091). Let the factor base\
    \ V be a union of m phi-orbits of x-coordinates, |V| = 3m. Write l_j for the discrete log of a\
    \ chosen lift of the j-th orbit representative. Then log(phi^c(P_j)) = lambda^c * l_j, so the\
    \ linear system has m unknowns, NOT 3m. A collected relation\n  R_t = sum_i eps_i * phi^{c_i}(P_{j_i}),\
    \   R_t = a_t P + b_t Q,\ncontributes exactly ONE equation\n  a_t + b_t k = sum_i eps_i * lambda^{c_i}\
    \ * l_{j_i}  (mod N),\nwith eps_i in {+1, -1} (negation acts trivially on x, so the sign is part\
    \ of the lift choice) and coefficients in {+-1, +-lambda, +-lambda^2}. Applying phi to that relation\
    \ returns lambda times the SAME equation. Its rank increment is exactly ZERO.\n(B) THE CONSEQUENCE,\
    \ WHICH IS THE THING THIS PROPOSAL MAKES MEASURABLE. An orbit-closure step that emits phi(R) and\
    \ phi^2(R) alongside R produces THREE ROWS and ONE INDEPENDENT EQUATION. Any metric of the form\
    \ \"relation rows per search\", \"hit rate\", or \"searches per relation row\" therefore reads\
    \ a factor of 3 that is pure bookkeeping. The honest comparison at matched cardinality |V| = 3m\
    \ is: the phi-stable base needs m successful searches to reach full rank, the cardinality-matched\
    \ random base needs 3m, and the per-search success probability is the same for both (approximately\
    \ |V|^2 / 2N at arity 2, a function of |V| only). The saving is exactly the factor r = 3, it lives\
    \ entirely in the UNKNOWN COUNT, and it is the classical automorphism-quotient saving already\
    \ recorded in this repository as the known baseline (DEC-20260727-009 R5; EV-STR-003 O-11) and\
    \ in the external literature (Tsakou-Ionica, see novelty_screen).\n(C) WHAT THIS PROPOSAL IS.\
    \ Not a mechanism and not an attack: it is the instrument that makes every other L4 proposal citable.\
    \ It specifies (i) the primary metric, (ii) the cardinality-matched null, (iii) the decay parameter\
    \ epsilon, and (iv) three pre-registered numbers that a correct instrument MUST reproduce. If\
    \ the instrument fails any of the three, no L4 measurement means anything and the lane stops until\
    \ it is repaired.\n(D) THE THREE PRE-REGISTERED INSTRUMENT NUMBERS.\n  I1. rank_increment_per_successful_search\
    \ = 1.000 exactly, in BOTH arms, at\n      every tested instance. Any value above 1 in the phi\
    \ arm contradicts\n      H-ENDO-001 on that instance and is an unexpected observation that must\n\
    \      be recorded under AGENTS.md rule 8, not smoothed away.\n  I2. successful_searches_to_full_rank(random,\
    \ |V| = 3m) /\n      successful_searches_to_full_rank(phi, |V| = 3m) = 3.00, within the\n    \
    \  sampling band declared below. Not 2.6, not 3.2 -- those were\n      rows-per-search ratios\
    \ measured on a different quantity.\n  I3. rows_emitted_per_successful_search = 3.00 in the phi\
    \ arm under orbit\n      closure and 1.00 in the random arm, WITH rank increment 1.000 in both.\n\
    \      I3 beside I1 is the explicit exhibition of the bookkeeping factor."
  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: 'This proposal mounts no attack and consumes no non-generic resource: it
    defines metrics, a null, and a decay parameter. It is admissible in the trivial sense that it
    claims nothing about ECDLP hardness. Note the asymmetry it exists to police: the metric it REPLACES
    (rows per search) is exactly the quantity a generic-group simulator could also inflate, because
    emitting phi(R) requires only one scalar multiplication in G and is therefore simulable (KN-FIND-b7e091,
    Oracle D). A measurement that rewards simulable work is measuring the simulator, not the curve.'
  reachability_gate: 'NOT APPLICABLE and stated rather than omitted. This proposal moves between no
    curves: every arm runs on ONE fixed curve, and the only thing that varies is the factor base.
    T5 (the isogeny-class reachability gate) does not bind. The scope limit that DOES bind is T4:
    j = 0 requires D_0 = -3, so the curve family this instrument is defined on cannot be reached by
    walking from a curve whose isogeny class lacks it, and no amount of instrument quality changes
    that.'
  inputs:
    procedure: 'STAGE 0 (zero compute): write the reduced-row record format and the lambda check.
      STAGE 1 (minutes): planted-signal control -- rank meter must return 1, 0, 0 on three dependent
      rows. HARD GATE. STAGE 2 (minutes): lambda verification phi(P) == [lambda] P on every generated
      instance. HARD GATE. STAGE 3 (about an hour): ARM P, ARM R, ARM R-small at field_bits in {12,
      16, 20}, seeds {1, 2, 3}, arity 2, |V| = 3m with 3m = ceil(sqrt(N)) rounded down to a multiple
      of 3, at least 20 target streams per cell, recording all five metrics. STAGE 4 (about an hour):
      the epsilon ladder {0, 1/3, 2/3, 1} at the largest affordable instance. STAGE 5 (zero compute):
      report I1, I2, I3 and the epsilon curve. Every arm reuses harness/toycurve.py, harness/semaev.py::_find_decomposition
      and harness/endomorphism_la.py::_generate_j0_instance / _build_phi_invariant_factor_base unmodified
      for instance and base generation; only the row record and the metric are new code, and the committed
      measurement function _measure_displacement_rank is NOT called.'
    mechanism: "STEP 1 -- REDUCED-COORDINATE RELATION ROWS. Replace the bare 0/1 incidence vector\
      \ of harness/endomorphism_la.py::_collect_relations with a record (a_t, b_t, [(j_i, c_i, eps_i)])\
      \ naming, per summand, the orbit index j_i, the phase c_i in Z/3 and the sign eps_i. From it\
      \ build the reduced row vector over Z/N with entry eps_i * lambda^{c_i} at column j_i, and the\
      \ right-hand side a_t + b_t k, kept symbolic in k as the pair (a_t, b_t). lambda is computed\
      \ once by solving lambda^2 + lambda + 1 = 0 mod N and verified by checking phi(P) == [lambda]\
      \ P with the harness point arithmetic. This is the step DEC-20260727-009 R3 records as never\
      \ having been performed (\"rows are bare 0/1 incidence vectors ... no linear system with a right-hand\
      \ side has ever been assembled\"); performing it is a prerequisite for any rank measurement\
      \ and asserts nothing about H-STR-002.\nSTEP 2 -- THE PRIMARY METRIC. After each successful\
      \ search, recompute rank over F_N of the accumulated reduced matrix (incremental Gaussian elimination;\
      \ m <= a few hundred at toy scale). Record the increment. Report rank_increment_per_successful_search,\
      \ and separately rows_emitted_per_successful_search, so I1 and I3 are visible side by side.\n\
      STEP 3 -- THE CARDINALITY-MATCHED NULL, WHICH IS THE WHOLE POINT. Arms are run on the SAME curve,\
      \ SAME target stream (same a_t, b_t seeds), SAME arity, SAME budget:\n  ARM P: V = union of\
      \ m phi-orbits, |V| = 3m, unknowns m.\n  ARM R: V = 3m uniformly drawn on-curve x-coordinates,\
      \ |V| = 3m,\n         unknowns 3m.\n  ARM R-small: V = m uniformly drawn on-curve x-coordinates,\
      \ |V| = m,\n         unknowns m. This is the FORBIDDEN comparison, run deliberately and\n  \
      \       labelled as such, because it is the one that manufactures a fake\n         advantage:\
      \ it matches unknown counts while mismatching cardinality,\n         so its success probability\
      \ is 9x lower at arity 2. Reporting ARM P\n         against ARM R-small is the specific error\
      \ this contract exists to\n         prevent, and having the number in the record makes the error\n\
      \         visible rather than arguable.\n\nSTEP 4 -- THE DECAY PARAMETER epsilon. Fix |V| =\
      \ 3m. For epsilon in {0, 1/3, 2/3, 1}, build V by taking (1 - epsilon) * m complete phi-orbits\
      \ and filling the remaining 3 * epsilon * m slots with uniformly drawn on-curve x-coordinates\
      \ that are NOT in any selected orbit; the unknown count is then (1 - epsilon) m + 3 epsilon\
      \ m. epsilon = 0 is ARM P and epsilon = 1 is ARM R. THE DECAY REQUIREMENT: every quantity attributed\
      \ to phi-stability must move monotonically from its ARM P value to its ARM R value as epsilon\
      \ increases. A quantity that stays flat across epsilon is an artifact of the construction or\
      \ of the bookkeeping, and is reported as an artifact.\nSTEP 5 -- THE PLANTED-SIGNAL DIRECTION.\
      \ An instrument that cannot detect a signal is as useless as one that hallucinates one. Plant\
      \ a known linear dependency: inject, into ARM R, three rows that are exact scalar multiples\
      \ of each other. The rank meter must report increments 1, 0, 0. If it does not, the meter is\
      \ broken and nothing else is run."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - ARM R, cardinality-matched random factor base, same curve and stream
  - ARM R-small, the deliberately size-mismatched forbidden comparison
  - epsilon ladder {0, 1/3, 2/3, 1} at fixed |V|
  - planted dependent rows (anti-null), must give increments 1, 0, 0
  - per-instance verification that phi(P) == [lambda] P
  - every collected relation carries a decomposition certificate re-verified by semaev.verify_decomposition_certificate
    independently of the collector (docs/claims-and-verification.md)
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, and this record IS the null-object specification
    for lane L4. MATCHED NULL: ARM R, a uniformly drawn factor base of the SAME cardinality 3m on
    the SAME curve with the SAME target stream and seeds -- matched on curve, p, N, |V|, arity, target
    sequence, budget and solver, and differing ONLY in whether V is a union of phi-orbits. DECAY PARAMETER:
    epsilon, the fraction of orbits replaced by unaffiliated random points at fixed |V| = 3m; every
    phi-attributed quantity must move monotonically to its ARM R value as epsilon goes 0 -> 1/3 ->
    2/3 -> 1. A quantity flat in epsilon is the canonical artifact tell (docs/inventor-protocol.md
    section 3). ANTI-NULL (planted signal): three deliberately dependent rows injected into ARM R
    must produce rank increments 1, 0, 0. NEGATIVE CONTROL ON THE FORBIDDEN COMPARISON: ARM R-small
    is run and reported precisely so that the size-mismatched comparison is visible as a number rather
    than available as an argument.'
  independent_variables: []
  metrics:
    primary:
    - rank_increment_per_successful_search, per arm, per epsilon
    - rows_emitted_per_successful_search, per arm
    - successful_searches_to_full_rank, per arm, per target stream
    - per-search decomposition success probability, per arm
    secondary:
    - unknown count and |V| recorded explicitly per arm (the size control)
    - sha256 of the factor base and of the reduced row list per cell
    - wall-clock and peak RSS per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: rank_increment_per_successful_search
    formula: 'Exactly 1.000 in ARM P and in ARM R at every instance and every epsilon. The pre-registered
      discrimination: a measured value above 1.000 in ARM P would mean a phi-image relation carried
      new information, contradicting H-ENDO-001 on that instance -- which would be the single most
      important observation the lane could produce and must be reported, not filtered. A measured
      value below 1.000 means duplicate or dependent rows are being counted as successes and the collection
      code is wrong.'
    source: pre-registered in IDEA-20260807-b42544 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - DUPLICATE TARGETS. The committed _collect_relations skips a target whose x-coordinate was already
    seen. A repeated target yields a proportional row and a zero rank increment that has nothing to
    do with phi. Targets must be drawn with recorded (a_t, b_t) and de-duplicated on (a_t, b_t), not
    on x.
  - FACTOR-BASE TRUNCATION. _build_phi_invariant_factor_base returns xs[:B], which cuts a partial
    orbit whenever B mod 3 != 0 and silently drops coordinates during any orbit closure (EXP-STR-004
    derivation note, Lemma 4a and Theorem 2). This lane must fix |V| to a multiple of 3 so the truncation
    tail is empty, and must record B mod 3 per cell.
  - SIGN AND NEGATION. Negation acts trivially on x-coordinates, so each base x carries a +- pair
    of points and each relation carries signs eps_i. A collector that drops the sign produces rows
    that are wrong over Z/N even though they look right as incidence vectors. This is the most likely
    concrete bug and the certificate re-verification is what catches it.
  - SMALL m. At m below about 10 the searches-to-full-rank ratio has large relative variance and the
    [2.70, 3.30] band is not meaningful; the band applies only at cells where m >= 16, and smaller
    cells are reported without a verdict.
  - lambda AMBIGUITY. lambda^2 + lambda + 1 = 0 has two roots mod N; the phase convention must fix
    which one, consistently with the chosen zeta_3, or the reduced rows are built with the wrong coefficients
    and the rank is wrong.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'Exactly 1.000 in ARM P and in ARM R at every instance and every epsilon. The
    pre-registered discrimination: a measured value above 1.000 in ARM P would mean a phi-image relation
    carried new information, contradicting H-ENDO-001 on that instance -- which would be the single
    most important observation the lane could produce and must be reported, not filtered. A measured
    value below 1.000 means duplicate or dependent rows are being counted as successes and the collection
    code is wrong.'
  falsification_criterion:
  - The planted-signal control does not return increments 1, 0, 0. Instrument broken; nothing is reported
    and the lane halts.
  - phi(P) != [lambda] P on a generated instance. That instance is invalid (bad zeta_3 or bad lambda
    root); it is excluded and recorded, and it is NOT evidence about anything mathematical.
  - The ARM R / ARM P searches-to-full-rank ratio falls outside [2.70, 3.30]. Either the arithmetic
    in claim (A) is wrong at toy scale -- which would be a major finding requiring its own record
    -- or the collection code is double-counting. Both dispositions are pre-registered and the record
    must say which was checked first.
  - Any quantity attributed to phi-stability is flat across the epsilon ladder. That quantity is an
    artifact and may not be reported as a phi effect.
  - Exact rank over F_N is not affordable at the largest instance within budget. That is an INFRASTRUCTURE
    outcome under AGENTS.md rule 5, recorded as such, and it is not evidence about rank increments.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-b42544
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
