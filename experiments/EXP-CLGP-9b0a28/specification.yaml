experiment:
  id: EXP-CLGP-9b0a28
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-cb672c
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE BRIDGE DETECTOR, AND THE NULL IT MUST CLEAR FIRST: a mutual-information instrument that
    measures how many bits any class-group-derived statistic of an ECDLP instance carries about k,
    calibrated against two matched nulls (resample k with the curve fixed, resample the curve with
    k fixed) and against a family of PLANTED bridges of known bit-width -- so that the lane''s expected
    zero is a MEASURED zero with a stated detection floor, rather than an assertion'
  status: draft
  objective: "(A) THE PROBLEM THIS SOLVES. Every other L10 proposal in this batch predicts a null:\
    \ the bridge from ECDLP to Cl(O) is constant, or zero, or simulable. Under docs/inventor-protocol.md\
    \ section 3 a reported signal is an artifact until measured against a matched null -- and symmetrically,\
    \ a reported NULL is meaningless without a stated DETECTION FLOOR. \"We found no correlation\"\
    \ is not a result unless the instrument is known to be able to find one. This record builds the\
    \ instrument that makes the lane's negatives citable, and its central output is not a p-value\
    \ but a floor: THE SMALLEST BRIDGE WIDTH THIS PIPELINE COULD HAVE DETECTED AT THIS SAMPLE SIZE.\n\
    (B) THE MEASURED QUANTITY. For an isogeny class fixed by (p, t), define a STATISTIC as any efficiently\
    \ computable map\n    S : (E, P, Q) -> a finite alphabet A,\nwhere the computation may use the\
    \ class group, the isogeny graph, and the endomorphism ring, but no discrete logarithm. Measure\
    \ the empirical mutual information I(S ; k) over instances with the curve fixed and k uniform\
    \ on (Z/N)^*, in bits, together with the Miller-Madow bias correction and a permutation-based\
    \ null distribution. The candidate statistic list, fixed in advance so it cannot be tuned after\
    \ seeing data:\n  S1  the class-group coordinate of E/<Q> relative to E -- i.e. the\n      canonical\
    \ kernel-ideal bridge of IDEA-20260807-5d7606;\n  S2  the class of the ideal (N, pi - 1), and\
    \ its order in Cl(O);\n  S3  the vectorization vector of E against a fixed base curve E_0 in the\n\
    \      class, expressed in the small-prime generating set;\n  S4  the crater position of the curve\
    \ reached by a DETERMINISTIC walk\n      whose step choices are derived from bits of x(Q) as a\
    \ field element\n      -- the one R1-flavoured statistic in the list, included precisely\n   \
    \   because the CAGG closure of IDEA-20260807-1b7241 does not cover it;\n  S5  the number of F_p-rational\
    \ ell-isogenies from E for each small ell\n      (a pure curve statistic, expected to be k-independent\
    \ and included\n      as an internal negative control);\n  S6  the low bits of the j-invariant\
    \ of E/<Q>.\nStatistics S1, S2, S5 are curve-only and are PREDICTED to give exactly zero; including\
    \ them is how the instrument's own bias is measured. S4 and S6 are the only entries that can be\
    \ nonzero on structural grounds, and S4 is the only one this batch does not already have an argument\
    \ against.\n(C) THE TWO NULLS, WHICH ARE DIFFERENT AND BOTH REQUIRED.\n  NULL-A (RESAMPLE k, FIX\
    \ THE CURVE). Draw fresh k with (E, P) fixed. Any\n  statistic that is a function of the curve\
    \ alone is EXACTLY constant here,\n  so its measured I must be the estimator's bias and nothing\
    \ else. This\n  null calibrates the FLOOR: the measured I on S1/S2/S5 IS the bias, and\n  no statistic\
    \ may be called informative unless it exceeds it. This is the\n  canonical control the campaign's\
    \ lane L7 already identifies as decisive.\n  NULL-B (RESAMPLE THE CURVE, FIX k). Draw a fresh\
    \ curve from the class\n  with k held fixed. Any statistic that varies here but not in NULL-A\
    \ is\n  reading curve identity, not k. This separates \"the statistic moves\" from\n  \"the statistic\
    \ moves WITH k\", which is the confusion that turns a\n  correlation into a false mechanism.\n\
    A statistic is called a candidate bridge only if I is above the NULL-A floor AND the dependence\
    \ survives NULL-B stratification.\n(D) THE PLANTED-BRIDGE LADDER -- THE POSITIVE DIRECTION, WHICH\
    \ IS MANDATORY. An instrument that cannot see a bridge proves nothing by not seeing one. Construct\
    \ synthetic instance families carrying a bridge of KNOWN width b bits: pick M | h with log2 M\
    \ = b, fix an arbitrary embedding of Z/M into Cl(O) (arbitrary is fine -- the point is detection,\
    \ not canonicity), and define the planted statistic S_plant(Q) := image of (k mod M). Sweep b\
    \ over {0, 1, 2, 4, 8, 12, 16}. Measure I(S_plant ; k) and require it to track b. THE OUTPUT IS\
    \ THE DETECTION FLOOR b_min(n): the smallest b at which the instrument reliably separates the\
    \ planted family from NULL-A at the sample size n. Every negative result the lane reports is then\
    \ quotable as \"no bridge of width above b_min(n) bits, at this scale\" -- a bounded, honest,\
    \ falsifiable statement instead of an assertion of nothing.\n(E) THE DISCRIMINATION. Three outcomes,\
    \ all informative:\n  OUTCOME 1 (predicted). Every real statistic sits at the NULL-A floor\n \
    \ while the planted ladder tracks b down to a small b_min. Then the lane's\n  negatives acquire\
    \ a stated resolution and the other eight proposals'\n  nulls become citable.\n  OUTCOME 2. Some\
    \ real statistic exceeds the floor and survives NULL-B.\n  That statistic is a candidate bridge;\
    \ it must then be checked against the\n  log2 h ceiling of IDEA-20260807-bbdcf3 (it cannot exceed\
    \ (1/2) log2 N\n  bits) and converted, or not, into a congruence. This is the branch that\n  would\
    \ reopen the lane, and S4 is where it would most plausibly appear.\n  OUTCOME 3. The planted ladder\
    \ does NOT track b. The instrument is\n  broken; nothing about real curves may be reported, and\
    \ the run set is\n  invalid rather than negative."
  resource_label: 'Audit: consumes no resource. The instrument MEASURES statistics built from R3 and
    R4 (and, for S4 only, R1), but the proposal itself mounts no attack and consumes no resource in
    the campaign''s sense.'
  admissibility: admissible
  admissibility_argument: 'Admissible as an instrument. The statistics measured are drawn from R3/R4
    (class group, ideals, isogeny graph) and one from R1 (x(Q) as a field element), all of which are
    outside the generic group. No statistic is a group-operation output, so H-ENDO-001''s scalar collapse
    does not apply. Note the deliberate design point: S4 is included EXACTLY because it lies in the
    residual open class that IDEA-20260807-1b7241''s CAGG closure cannot reach, so the instrument
    probes the one place the lane''s closure argument does not cover.'
  reachability_gate: 'T5 APPLIES TO THE STATISTICS, NOT TO THE PROPOSAL, AND IT DIVIDES THE LIST INTO
    TWO PRICE CLASSES -- which is itself part of the deliverable. LOCALLY EVALUABLE, cheap at any
    scale: S1, S2, S5, S6 and S4 all require only computations at or adjacent to E, so they are exactly
    the "detectable by a local test evaluable at each step of a walk" case that T5 says a lane needs.
    GLOBAL ADDRESS, expensive: S3 requires the curve''s class-group coordinate relative to a base
    curve, i.e. a vectorization, at ~sqrt(h) = p^{1/4}. So S3 is affordable at toy scale ONLY, and
    a positive on S3 would be a T5 casualty rather than an attack -- the record says so in advance
    so that a positive is not over-read. This split is the practical content of the reachability gate
    for L10 and later proposals should inherit it.'
  inputs:
    procedure: 'STAGE 0 (zero compute): pre-register the statistic list, coarsening rules, estimator,
      null procedure and thresholds. Freeze. STAGE 1 (hours): instance generator over one toy class;
      uniformity test on the drawn k. STAGE 2 (hours, HARD GATE): the planted ladder; extract b_min(n).
      Halt if the ladder does not track b. STAGE 3 (hours): NULL-A and NULL-B on S1-S6; report I,
      bias, permutation null, and b-equivalent width. STAGE 4 (hours): the n-decay test at three sample
      sizes. STAGE 5 (hours): the h-ladder, checking the sign of any excess''s dependence on h. STAGE
      6 (minutes): run the natural composite-order positive control from IDEA-20260807-e9d57c through
      the identical pipeline. STAGE 7 (zero compute): report the floor and the headline sentence.'
    mechanism: 'STEP 1 (zero compute, and FROZEN BEFORE ANY DATA). Fix the statistic list S1-S6, the
      alphabet coarsening for each (so |A| <= n/50), the estimator (plug-in with Miller-Madow correction),
      the null procedure (permutation of k labels, 10^3 permutations), and the decision thresholds.
      Pre-registration is what prevents the classic failure of this design, which is choosing the
      statistic after seeing which one looks interesting.

      STEP 2 (toy compute). Build the instance generator: enumerate a toy isogeny class (fixed p,
      t), compute Cl(O) and the action, pick E and P, and generate n instances by drawing k uniformly.
      n = 10^5 per cell is reachable in pure Python at 16-24 bits.

      STEP 3 (toy compute, HARD GATE, THE PLANTED LADDER). Run the whole pipeline on the synthetic
      planted families at b in {0,1,2,4,8,12,16}. Extract b_min(n). If the measured I does not track
      b -- specifically, if it fails to rise above the NULL-A floor by b = 4 -- the instrument is
      broken and the line halts here before any real statistic is measured. This gate is deliberately
      placed BEFORE the real measurement so that a broken instrument cannot produce a publishable-looking
      null.

      STEP 4 (toy compute). Run NULL-A and NULL-B on the real statistics S1-S6. Report I with its
      permutation null distribution, its bias estimate, and the b-equivalent width of any excess.

      STEP 5 (toy compute, THE DECAY TEST). Repeat Step 4 at n in {10^3, 10^4, 10^5}. Every measured
      I on a true null MUST fall like 1/n. A quantity that does NOT fall with n is the canonical artifact
      tell named in the inventor protocol and in this batch''s brief, and it identifies a leak in
      the generator rather than a bridge.

      STEP 6 (toy compute). Repeat across a ladder of h. If any excess is found, check whether it
      decays as h grows -- a genuine bridge should NOT decay with h (it should carry up to log2 h
      bits), while a finite-size artifact should. This is the one place where the expected behaviours
      of signal and artifact differ in SIGN under the same parameter, which makes h the sharpest available
      discriminator.

      STEP 7 (zero compute). Report the floor. The headline sentence the lane is entitled to is exactly:
      "no class-group statistic in the frozen list carries more than b_min(n) bits about k, on this
      instance family, at p <= 2^24".'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - NULL-A, resample k with the curve fixed
  - NULL-B, resample the curve with k fixed
  - synthetic planted ladder over b -- MUST track b
  - natural composite-order bridge -- MUST be detected
  - internal known-answer controls S1, S2, S5, provably constant
  - uniformity test on the generated k
  - alphabet-coarsening monotonicity check (I must not increase under coarsening)
  - 'NULL OBJECT (from the proposal): THIS PROPOSAL IS ITSELF A NULL-OBJECT INSTRUMENT, so the field
    is filled with the controls that validate the instrument rather than the mechanism. MATCHED NULL
    OF THE SAME SHAPE: NULL-A (resample k, curve fixed) and NULL-B (resample curve, k fixed) -- both
    produce instance sets of exactly the same shape, size and alphabet as the real measurement, differing
    only in which coordinate is resampled. DECAY PARAMETER, PRIMARY: the sample size n. Every measured
    I on a true null must fall like (|A| - 1)/(2 n ln 2). A measured I that fails to fall when n grows
    tenfold is the canonical artifact tell and halts the line. DECAY PARAMETER, SECONDARY AND MORE
    DIAGNOSTIC: h. A finite-size artifact must decay as h grows; a genuine bridge must NOT (its capacity
    is log2 h, which grows). The opposite predicted signs under the same parameter make h the discriminating
    knob rather than merely a robustness check. POSITIVE CONTROLS, BOTH REQUIRED: the synthetic planted
    ladder (tunable width) and the natural composite-order bridge of IDEA-20260807-e9d57c (genuine
    curve arithmetic). Failing either voids the run set.'
  independent_variables: []
  metrics:
    primary:
    - I(S;k) in bits per (statistic, n, h, cell), with bias estimate and permutation-null quantiles
    - b_min(n) per sample size
    - the n-decay ratio per statistic
    - the h-dependence of any excess, with its sign
    secondary:
    - alphabet size |A| per statistic after coarsening
    - pass/fail of every gate control
  heuristic_under_test: null
  preregistered_prediction:
    quantity: measured I(S ; k) in bits for the curve-only statistics S1, S2, S5, under NULL-A, at
      n = 10^5
    formula: Below the Miller-Madow bias estimate (|A| - 1)/(2 n ln 2) plus two permutation-null standard
      deviations, on 100 percent of cells. Predicted essentially exactly zero, since these statistics
      are provably constant in k. An excess here is an instrument or generator fault, not a finding.
    source: pre-registered in IDEA-20260807-cb672c before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - ESTIMATOR BIAS. Plug-in mutual information is positively biased by roughly (|A| - 1)/(2 n ln 2).
    At |A| = 100 and n = 10^3 that is about 0.07 bits, which is large enough to look like a signal.
    Miller-Madow correction plus the permutation null are both applied, and the raw and corrected
    values are both reported.
  - POST-HOC STATISTIC SELECTION. With six statistics and several cells, a 5 percent threshold will
    fire somewhere. The list is frozen in advance, the multiple-comparison correction is declared
    in Stage 0, and any statistic added later is reported as exploratory and never as confirmatory.
  - COARSENING CHOICE. Mutual information is monotone under coarsening, so a coarsening chosen after
    seeing the data can only destroy signal -- but a coarsening chosen to CREATE apparent structure
    (e.g. binning on a k-correlated boundary) can manufacture it. The rule is frozen and the monotonicity
    check is run.
  - SMALL CLASSES. At h < 20 the alphabet for S3 is tiny and I saturates at log2 h, which can look
    like a ceiling effect or like nothing at all depending on the reading. Require h >= 100 for any
    interpreted cell and report h with every number.
  - 'GENERATOR LEAKAGE. The single most dangerous confounder: if instances are generated by a loop
    whose seed schedule correlates with k, EVERY statistic will appear informative. The n-decay test
    and the S1/S2/S5 known-answer controls exist to catch exactly this, and both must pass before
    any real number is read.'
  - S3 IS EXPENSIVE AND CIRCULAR AT SCALE. Vectorizing against a base curve costs sqrt(h) and is affordable
    only at toy scale. Its measured value is legitimate here, but a positive on S3 would NOT immediately
    be an attack, because computing S3 at crypto scale already costs p^{1/4}. This is recorded so
    a positive is not misread.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Below the Miller-Madow bias estimate (|A| - 1)/(2 n ln 2) plus two permutation-null
    standard deviations, on 100 percent of cells. Predicted essentially exactly zero, since these
    statistics are provably constant in k. An excess here is an instrument or generator fault, not
    a finding.
  falsification_criterion:
  - The planted ladder fails to track b. Instrument broken; run set INVALID rather than negative;
    nothing about real curves may be reported.
  - A curve-only statistic (S1, S2, S5) shows I above the floor. Generator or estimator fault; halt
    and debug. These are provably constant in k, so an excess is definitionally an artifact.
  - Measured I on a true null fails to decay like 1/n. The canonical artifact tell; the pipeline leaks
    and every number is void.
  - S4 shows a persistent excess surviving NULL-B and the n-decay test. The lane's closure does NOT
    cover this case; escalate for independent review. This is a falsification of the lane's expectation,
    not of the instrument, and it is the outcome that would justify the whole batch.
  - b_min(n) exceeds the ceiling (1/2) log2 N at the tested sizes. The instrument cannot resolve any
    bridge the theory allows, so its negatives say nothing and must not be quoted; scale up or report
    only the floor.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-cb672c
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
