experiment:
  id: EXP-POLYMAC-6395fb
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-d7d873; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-d7d873
  question_id: RQ-POLYMAC-7c89e4
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Two-by-two of field crossed with authentication-key persistence, with two non-deployed cells,
    measuring exact multi-query forgery optima and their growth in q against a random-function generic
    null and a no-op refresh plumbing check
  objective: The uncertainty reduced is whether the difference between the two deployed constructions
    in how their authentication key behaves across nonces is a bigger contributor to multi-query forgery
    growth than the field is, and whether the union-of-root-sets model used throughout this batch
    describes anything the null does not already produce. (i) Construct refresh counterparts to both
    persistent cells in which exactly one variable - the persistence of the authentication key across
    queries - is changed, verified by a configuration diff and a no-op refresh control that must reproduce
    the persistent cell exactly. (ii) Compute the exact optimal q-query acceptance probability in
    all four cells over a q sweep, by maximum union popcount where the key persists and by the exact
    independent-key formula where it does not, so that every number is counted rather than estimated.
    (iii) Run the identical two-by-two under a random-function digest to obtain the generic persistence
    effect, so that the polynomial-specific component is what remains after subtraction and is compared
    against the resolution floor. The run does not compare the security of the deployed constructions
    and does not model any real key-derivation procedure.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: at n in {12, 16} and L = 4, with
      the declared strategy family, the idealised mask and the independence idealisation of refresh,
      the optimal q-query acceptance probability in each of the four cells is exactly the tabulated
      value, the persistence effect is the tabulated difference, and the field-by-persistence interaction
      is the tabulated number with its prime-sweep spread. WHAT DOES NOT FOLLOW: no comparison of
      the deployed constructions'' security; no claim that per-nonce key derivation provides or removes
      any property, since independence is not derivation; nothing about deployed q values or widths;
      no attack; and no attribution of the interaction to the field alone, since the encoding correction
      from a separate contract in this batch is unresolved.'
  inputs:
    procedure: 'STAGE 0 (cost: hours, human): freeze the refresh operator, the strategy family, and
      the configuration-diff procedure. STAGE 1 (cost: seconds): build all cells and diff their configuration
      blocks, asserting exactly one variable differs between each persistent and refresh pair; halt
      on failure. STAGE 2 (cost: minutes per cell): compute per-query root-set cardinalities via the
      shared enumeration. STAGE 3 (cost: minutes): compute the persistent cells'' maximum union popcount
      over the strategy family for q in {1, 2, 4, 8}, and the refresh cells'' exact independent-key
      probabilities from the same cardinalities. STAGE 4 (cost: seconds): run the no-op refresh check
      and assert exact reproduction of the persistent cell. STAGE 5 (cost: minutes): repeat every
      stage for the random-function null cells. STAGE 6 (cost: minutes): sweep the five primes at
      each width for the prime cells. STAGE 7 (cost: seconds): emit the two-by-two, the persistence
      effects, the interaction, the null subtraction and the manifest.'
    instrument: Python 3 standard library. Binary field by shift-and-XOR with pinned reduction polynomial;
      prime field with native int. Root sets as Python int bitmaps with union by bitwise OR and cardinality
      by popcount. Refresh cells use no union at all, computing the independent-key probability exactly
      from recorded per-query cardinalities, which is what keeps the two regimes from sharing a code
      path that could hide the effect. Configuration blocks emitted as sorted key-value text and diffed
      mechanically. Manifest and inference block via harness/runner.py. No Sage, no network.
    parameters: 'Widths n in {12, 16}; five largest primes below 2^n per width. Message length L =
      4 primary, L = 8 as a secondary slice. Query counts q in {1, 2, 4, 8}. Cells: 2 fields crossed
      with 2 persistence regimes, signal and null versions of each, plus one no-op refresh cell per
      field. Achievable-difference strategy family capped at 2^18 members per (cell, q). Three fixed
      seeds for the refresh draws, with persistent-cell results required seed-independent.'
  controls:
  - No-op refresh cell, which must reproduce the persistent cell exactly.
  - Random-function null in all four cells, giving the generic persistence effect analytically and
    by measurement.
  - Five-prime sweep per width for the prime cells.
  - 'Single-variable assertion: the refresh cells differ from their persistent counterparts in exactly
    one code parameter, checked by diffing the recorded configuration blocks.'
  - Per-query root-set cardinalities recorded in both regimes so that the refresh formula and the
    persistent union use the same inputs.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The random-function null runs in all four cells in the same invocation,
    and it is the control that separates generic union savings from polynomial-specific ones: for
    any function, persistent queries share a key space and their accepted-key sets can overlap, so
    a persistence effect exists in the null too and its size is computable analytically. For the signal
    cells to mean anything, their persistence effect must EXCEED the null''s by more than the resolution
    floor; if it does not, the union savings are generic and the polynomial structure contributes
    nothing at these parameters. A second control is a NO-OP refresh: a cell in which a fresh key
    is drawn per query but from the same distribution and then discarded in favour of the persistent
    key, which must reproduce the persistent cell exactly - confirming that the refresh plumbing itself
    does not change the measurement.'
  independent_variables:
  - field type (binary extension, prime)
  - key persistence (persistent, per-nonce refresh, no-op refresh)
  - digest type (polynomial signal, random-function null)
  - query count q
  metrics:
    primary:
    - optimal q-query acceptance probability per (cell, q)
    - per-query increment per (cell, q)
    - persistence effect per field at each q
    - field-by-persistence interaction term
    - signal persistence effect minus null persistence effect
    secondary:
    - per-query root-set cardinalities per cell
    - no-op refresh discrepancy (required zero)
    - configuration diff output per cell pair
    - prime-sweep spread of the interaction
    - wall clock per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The persistence effect Pi(field) = P_opt(persistent, q = 4) minus P_opt(refresh, q =
      4) in each field, and the interaction I = Pi(binary) minus Pi(prime), each reported alongside
      the corresponding null-cell quantities.
    formula: 'In a persistent cell, P_opt(q) is the maximum over strategy-family q-tuples of the cardinality
      of the union of their root sets, divided by the key-space size. In a refresh cell, P_opt(q)
      = 1 minus the product over the q queries of (1 minus the per-query root-set cardinality divided
      by the key-space size), computed exactly from the same cardinalities. Predicted: the refresh
      cells'' per-query increment is constant in q to within the floor; the no-op refresh cell reproduces
      the persistent cell exactly; the null cells exhibit a nonzero generic persistence effect whose
      magnitude is computable analytically.'
    source: Pre-registered in the parent proposal IDEA-20260816-d7d873 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: n in {12, 16} with q up to 8, chosen because the union over the strategy family
      is exhaustively searchable and the key space is enumerable, so every cell's number is exact
      and the interaction has no sampling error. No extrapolation to deployed widths or query counts
      is made; in particular the q-growth measured here is not projected, since saturation of the
      union in a small key space is a toy-scale phenomenon that the contract explicitly flags rather
      than extrapolates.
    correspondence: null
  tail_checks:
  - q = 1 must give identical values in persistent and refresh cells, since with one query persistence
    cannot matter - a hard consistency check
  - the largest q, where the persistent union may saturate the key space, must be inspected and reported
    as saturated rather than read as a rate
  - the null cells' analytic generic effect must be compared against their measured effect and agree
    within the floor
  - the L = 8 secondary slice must be run at q = 1 and q = 4 at minimum, so slice dependence is bounded
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - halt if the configuration diff shows more than one differing variable between any persistent and
    refresh pair
  - halt if the no-op refresh cell does not reproduce the persistent cell exactly
  - stop increasing q once the persistent union saturates the key space, recording the q at which
    saturation occurred
  - cap total wall clock at 3600 seconds; on exceeding, drop the five-prime sweep to two primes and
    record the reduction
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All eight signal and null cells plus the no-op checks complete in one invocation,
    q = 1 agrees exactly between persistent and refresh cells, the no-op refresh reproduces the persistent
    cell exactly, and the persistence effects and interaction are emitted with the null subtraction
    and the prime-sweep spread.
  falsification_criterion:
  - no-op refresh does not reproduce the persistent cell
  - q = 1 values differ between persistent and refresh cells
  - refresh per-query increment drifts with q
  - configuration diff shows more than one differing variable
  - signal persistence effect does not exceed the null's by more than a floor unit
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-d7d873
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must rule on whether an independently drawn key is an acceptable idealisation
    of per-nonce derivation for the purpose of isolating persistence; the contract flags this as its
    largest modelling gap and does not resolve it.
  - The encoding correction from the achievable-difference contract in this batch should be available
    before the interaction is attributed to the field, or the attribution must remain open.
  - The resolution floor from the ladder contract is required for the null subtraction to be meaningful
    and must be scheduled first.
  - Whether the strategy family may differ between persistence regimes - it should not, but the union
    search and the independent-key formula consume it differently - needs a Coordinator ruling to
    keep the single-variable discipline intact.
