protocol_amendment:
  experiment_id: EXP-CSIDH-c65945
  hypothesis_id: H-CSIDH-3eaede
  goal_id: GOAL-QALG-001
  amendment_ordinal: 1
  filename_convention_note: >-
    v1.yaml denotes amendment ordinal 1, advancing the frozen protocol from
    base version 1 to resulting version 2. It is not a second copy of
    version 1 (docs/task-lifecycle.md "Protocol amendments": "After approval
    the protocol is frozen. Any later change requires a versioned
    protocol_amendment... never an edit of the frozen prediction").
  base_version: 1
  resulting_version: 2
  authored_by: coordinator
  authored_at: '2026-09-06'
  approved_by: coordinator
  approved_at: '2026-09-06'

  reason: >-
    Resolves CSIDH-OBJ-1 (major), CSIDH-OBJ-2 (moderate), and CSIDH-OBJ-3
    (minor) against EXP-CSIDH-c65945, per red-team report RT-20260814-41d4cc
    (coordination/goals/GOAL-QALG-001/batches/BATCH-dbf57a/tasks/TASK-20260814-11516e/red_team_report.yaml),
    as directed by ledger/decisions/DEC-20260814-1445a1.yaml's next_actions
