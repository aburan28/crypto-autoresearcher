      remain a separate, later Coordinator decision act that must cite this
      amendment's id and record that CSIDH-OBJ-1/2/3 are resolved.

  historical_run_integrity:
    rescoring: not_applicable
    reclassification: not_applicable
    amendment_of_run_record: not_applicable
    artifact_mutation: not_applicable
    statement: >-
      No run record exists for EXP-CSIDH-c65945 as of this amendment; there
      is nothing historical for this amendment to touch.

  authority_boundary:
    claim_ceiling: protocol_repair_only_no_compute_no_status_transition
    execution_authorized_by_this_amendment: false
    dispatch_hold_cleared_by_this_amendment: false
    experiment_status_transition: none
    hypothesis_status_transition: none
    goal_status_transition: none
    scientific_interpretation_authority: none

  nonclaims:
    - No claim that H-CSIDH-3eaede is supported, refuted, or advanced by this amendment.
    - No claim about whether any of the four primary sources (CSI-FiSh, Kuperberg 2005, Regev 2004, Ettinger-Hoyer) actually contain a citable reduction satisfying CSIDH-OBJ-2's operative test -- this Coordinator has not read them.
    - No claim that WebSearch/WebFetch/crypto-kb MCP retrieval currently works or currently fails for an Executor session -- only that this Coordinator session's own tool surface lacks them, tested and disclosed above.
    - No claim that CSIDH-OBJ-1/2/3 are the only remaining considerations before dispatch; TASK-20260814-a82a19's own DO NOT DISPATCH notice and this batch's ledger-archive step still govern whether dispatch may proceed.
    - No authorization of execution, and no clearing of the dispatch hold; both are named as the next Coordinator act, not performed here.

  next_step: >-
    A Coordinator decision citing this amendment (experiments/EXP-CSIDH-c65945/amendments/v1.yaml)
    must record that CSIDH-OBJ-1, CSIDH-OBJ-2, and CSIDH-OBJ-3 are resolved
    before ledger/handoffs/TASK-20260814-a82a19.yaml may be dispatched to the
