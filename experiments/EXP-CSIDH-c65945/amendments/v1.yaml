  # =====================================================================
  # LIVE RETRIEVAL-TOOL TEST, PERFORMED BEFORE DRAFTING CSIDH-OBJ-1's FIX,
  # AS THIS TASK REQUIRED.
  # =====================================================================
  live_retrieval_tool_test:
    requested_by_task: >-
      "FIRST, before drafting the fix: check whether WebSearch/WebFetch and
      the crypto-kb MCP retrieval tools actually work in THIS session right
      now... test it, e.g. with one real WebSearch query and one crypto-kb
      search_knowledge query, and record what you found."
    result: >-
      COULD NOT BE PERFORMED, AND NOT BY NETWORK FAILURE: this Coordinator
      subagent's declared tool surface for this runtime
      (.claude/agents/coordinator.md line 10: "tools: Read, Grep, Glob,
      Write, Edit, SendMessage") does not include WebSearch, WebFetch, or
      any crypto-kb MCP tool (search_knowledge, get_context, get_source,
      find_related) at all. This session's actual available-function list,
      presented in its own system context, confirms exactly that set --
      no web or retrieval tool was ever offered to invoke, so no query
      (successful or failed) could be attempted from inside this session.
      This is a DIFFERENT finding from the red team's own cited documented
      failure ("WebSearch returned a backend model error on every query
      attempted"; "crypto-kb MCP tools unavailable this session") -- that
      prior finding describes tools that WERE present but errored; this
      session's finding is that the tools are ABSENT FROM ITS OWN ROLE
      CONTRACT, a structural property of the Coordinator role under this
      runtime binding, not a transient outage. Both findings point the same
      direction and are recorded, not conflated.
    interpretation: >-
      This is itself evidence supporting CSIDH-OBJ-1's underlying concern,
      independent of whether retrieval happens to work in whichever session
      an Executor is eventually dispatched into: tool availability for
      web/retrieval access is not a fixed property of "this program" but
      varies by role and by session, so a contract that budgets literature
      access as routine ("citation-plus-arithmetic-check") without a named
      escape valve for every required source is fragile exactly along the
      axis this test probed. Per this task's own framing, the escape valve
      below is added regardless of what this test found -- "a control that
      only matters when it's needed is not thereby unnecessary."
    disposition: >-
      Because retrieval could not be tested live from this session, this
      amendment does NOT assert that retrieval currently works or currently
      fails for an Executor session; it discloses the untested state
      honestly and relies entirely on the escape-valve fix (CSIDH-CHG-1
      below) to make the contract decidable regardless of which way live
      retrieval behaves when an Executor is actually dispatched.

  # =====================================================================
  # CSIDH-OBJ-1 (MAJOR): THE DEFECT, TRANSCRIBED FROM THE RED-TEAM REPORT.
  # =====================================================================
  objection_1_addressed:
    id: CSIDH-OBJ-1
    severity: major
    source: >-
      RT-20260814-41d4cc, objections[4] (coordination/goals/GOAL-QALG-001/batches/BATCH-dbf57a/tasks/TASK-20260814-11516e/red_team_report.yaml).
    finding_verbatim_summary: >-
      None of the four primary sources this contract's applicability audit
      requires at page/section/lemma granularity (CSI-FiSh/BKSW 2019,
      Kuperberg 2005, Regev 2004, Ettinger-Hoyer) are staged in inputs/;
      three of four are marked "Paper not read" by this program's own
      knowledge curators (KN-LIT-21383c, KN-LIT-2c8264, KN-LIT-071);
      Ettinger-Hoyer has no knowledge-base entry at all. The contract's only
      BLOCKED/NOT-COMPUTED escape valve names CSI-FiSh access failure alone.
      An Executor who cannot reach Kuperberg 2005, Regev 2004, or
      Ettinger-Hoyer within budget has no named terminal disposition to
      report into -- exactly the "class-group-order re-derivation hides real
      work" pattern this task was asked to check for, relocated to the
      literature requirement.

  changes:
    - id: CSIDH-CHG-1-SYMMETRIC-ESCAPE-VALVES
      closes: >-
        The consequence named in CSIDH-OBJ-1: no named terminal disposition
        for failure to access Kuperberg 2005, Regev 2004, or Ettinger-Hoyer.
      field_scope: stopping_rules
      operation: add_three_symmetric_blocked_not_computed_escape_valves
      old_text_superseded_verbatim: >-
        Stop and report NOT-COMPUTED / BLOCKED, an infrastructure outcome
        rather than a mathematical finding (AGENTS.md rule 3/5), if the
        primary CSI-FiSh source (paper text and/or reference implementation)
        cannot be accessed within budget.
      new_text_full_stopping_rules_list:
        - >-
          [UNCHANGED, retained verbatim] Stop and report NOT-COMPUTED /
          BLOCKED, an infrastructure outcome rather than a mathematical
          finding (AGENTS.md rule 3/5), if the primary CSI-FiSh source (paper
          text and/or reference implementation) cannot be accessed within
          budget.
        - >-
          [NEW] Stop and report NOT-COMPUTED / BLOCKED, an infrastructure
          outcome rather than a mathematical finding (AGENTS.md rule 3/5), if
          Kuperberg 2005 ("A Subexponential-Time Quantum Algorithm for the
          Dihedral Hidden Subgroup Problem") cannot be accessed within
          budget. This disposition covers Kuperberg's own stated group-order
          hypothesis specifically; it does not by itself invalidate the
          baseline_embedding.reproduction_check gap, which remains
          separately out of this experiment's scope per
          H-CSIDH-3eaede.proof_search_map.
        - >-
          [NEW] Stop and report NOT-COMPUTED / BLOCKED, an infrastructure
          outcome rather than a mathematical finding (AGENTS.md rule 3/5), if
          Regev 2004 ("Quantum Computation and Lattice Problems", the source
          underlying KN-LIT-21383c and KN-TECH-d1bc4f's a(n)-SVP-to-DCP
          reduction) cannot be accessed within budget.
        - >-
          [NEW] Stop and report NOT-COMPUTED / BLOCKED, an infrastructure
          outcome rather than a mathematical finding (AGENTS.md rule 3/5), if
          Ettinger-Hoyer (the source this contract's own
          inputs.audited_construction and H-CSIDH-3eaede.mechanism name as
          one of Simon 2026's cited predecessors, for its exact stated
          group-order hypothesis) cannot be accessed within budget, OR if no
          citable primary-source text stating Ettinger-Hoyer's group-order
          hypothesis can be located at all within budget (this contract's
          own applicability audit does not currently possess a
          knowledge-base entry or a staged primary text for Ettinger-Hoyer to
          check that hypothesis against -- see CSIDH-OBJ-1's own finding
          that "Ettinger-Hoyer... has NO knowledge-base entry at all"). This
          escape valve covers BOTH inaccessibility of a known source and the
          prior, more basic gap that this program does not yet have a
          verified citation identifying which specific Ettinger-Hoyer
          publication states the hypothesis in question.
      composability_rule_added: >-
        If MORE THAN ONE of the four sources triggers its own BLOCKED /
        NOT-COMPUTED escape valve within the same run, the run reports each
        triggered valve individually (naming which source(s) were
        inaccessible and why) rather than collapsing them into a single
        generic "literature access failed" line -- an independent reviewer
        must be able to see exactly which of the four sources were reached
        and which were not, matching this contract's own
        citation-completeness control's discipline.
      applicability_outcome_interaction: >-
        A triggered escape valve for ANY of the four sources means
        metrics.primary.applicability_outcome (outcome A or B) MAY NOT be
        reported for the group-order-hypothesis question that specific
        source was needed to check -- exactly as CSI-FiSh's existing escape
        valve already governs the class_group_order_match metric. A partial
        pattern (e.g., CSI-FiSh, Kuperberg, and Regev all reached, but
        Ettinger-Hoyer's escape valve triggers) is reported as a PARTIAL
        applicability audit: whichever comparisons the reached sources
        support are reported with full citations, and the specific
        comparison(s) requiring the unreached source are reported
        NOT-COMPUTED, not silently folded into an overall A or B verdict.
    - id: CSIDH-CHG-2-BUDGET-NOTE-DISCLOSES-LITERATURE-RISK
      closes: >-
        The remaining half of CSIDH-OBJ-1's consequence: "the budget note's
        own framing... says nothing about the literature-access risk."
      field_scope: budget.note
      operation: append_literature_access_risk_disclosure
      old_text_superseded_verbatim: >-
        Intentionally small: this is a factorization lookup/verification and
        a close literature read, not a compute campaign. Below the 8GB
        memory floor noted in templates/research-records.md by design and
        stated why: primality-checking a published factorization and
        reconciling a product against a several-hundred-bit integer is
        arithmetic on numbers of a few hundred bits, not a lattice-reduction
        or sieving computation. A from-scratch re-derivation of CSIDH-512's
        class number by BSGS or an analytic/GRH-heuristic method -- which the
        CSI-FiSh authors themselves report as a substantial computation in
        its own right -- is explicitly OUT OF SCOPE of this contract; the
        verification strategy here is citation-plus-arithmetic-check, not
        re-derivation from a blank slate, exactly to keep this task small per
        its own budget constraint.
      new_text: >-
        Intentionally small: this is a factorization lookup/verification and
        a close literature read, not a compute campaign. Below the 8GB
        memory floor noted in templates/research-records.md by design and
        stated why: primality-checking a published factorization and
        reconciling a product against a several-hundred-bit integer is
        arithmetic on numbers of a few hundred bits, not a lattice-reduction
        or sieving computation. A from-scratch re-derivation of CSIDH-512's
        class number by BSGS or an analytic/GRH-heuristic method -- which the
        CSI-FiSh authors themselves report as a substantial computation in
        its own right -- is explicitly OUT OF SCOPE of this contract; the
        verification strategy here is citation-plus-arithmetic-check, not
        re-derivation from a blank slate, exactly to keep this task small per
        its own budget constraint.

        LITERATURE-ACCESS RISK DISCLOSURE (added by this amendment, per
        CSIDH-OBJ-1): this budget note's "not a compute campaign" framing
        correctly rules out the expensive from-scratch class-number
        re-derivation alternative, but says nothing on its own about a
        SEPARATE, real risk: as of this amendment, none of the four primary
        sources the applicability audit must cite at page/section/lemma
        granularity (CSI-FiSh eprint 2019/498, Kuperberg 2005, Regev 2004,
        Ettinger-Hoyer) are staged under inputs/; three of four have
        knowledge-base entries this program's own curators marked
        "confidence: reported" / "citation_verified: web" / "Paper not read"
        (KN-LIT-21383c, KN-LIT-2c8264, KN-LIT-071), and the fourth
        (Ettinger-Hoyer) has no knowledge-base entry at all. This
        Coordinator's own live_retrieval_tool_test (see this amendment's
        top-level field of that name) could not determine from this session
        whether an Executor session's retrieval tools (WebSearch, WebFetch,
        crypto-kb MCP) work, because this Coordinator role's own tool
        surface does not include them. The Executor should therefore budget
        an explicit, early preflight step within this contract's 1800s wall
        clock to attempt access to all four sources, and must invoke
        CSIDH-CHG-1's escape valve(s) for any source(s) not reached within
        that budget rather than treating literature access as guaranteed
        by this note's "routine" framing.

  # =====================================================================
  # CSIDH-OBJ-2 (MODERATE): THE UNPINNED A/B BOUNDARY.
  # =====================================================================
  objection_2_addressed:
    id: CSIDH-OBJ-2
    severity: moderate
    source: >-
      RT-20260814-41d4cc, objections[5].
    finding_verbatim_summary: >-
      metrics.primary.applicability_outcome defines A as "N... either
      literally matches Simon 2026's stated N=2^n presentation OR has a
      citable, stated reduction to it that preserves the construction's
      proven/sketched hypotheses." Standard dihedral-HSP/DCP literature is
      understood in the field to handle general group order N via
      well-known base-2 embedding conventions, which could satisfy this test
      almost automatically (A close to inevitable) OR a strict reading could
      disqualify any non-literal presentation (landing on B) -- both
      readings are defensible from the current text, and nothing pins which
      one governs.
    resolution_adopted: >-
      RESOLVED TOWARD THE STRICTER OF THE TWO READINGS: outcome A requires
      an EXPLICIT, page/section/lemma-citable statement, IN THE TEXT OF ONE
      OF THE FOUR AUDITED PRIMARY SOURCES THEMSELVES (Simon 2026 and/or
      Regev 2004, Kuperberg 2005, Ettinger-Hoyer), that the construction's
      N=2^n presentation extends to a general group order N via a NAMED
      technique (e.g., a stated binary padding/embedding of a general-order
      group into a 2^n-element universe for n := ceil(log2 N), or an
      explicit statement that the argument's stated theorem applies to Z_N
      for general N with n so defined) -- WITH that technique's own stated
      preconditions independently checked to hold for CSIDH-512's actual N
      and the group order the CJS reduction (KN-LIT-071) actually supplies.
      The Executor's OWN background knowledge that "such embeddings are
      standard in the HSP/DCP literature" -- however true in general -- MAY
      NOT itself supply the citable reduction; only an explicit statement
      located in the audited primary-source text may. If no such explicit
      textual statement is located within budget, the audit reaches outcome
      B.
    justification_for_this_reading: >-
      (1) It does not manufacture a reduction technique for the audited
      sources that they do not themselves state -- a self-supplied
      padding/embedding argument invented by the Executor would be new
      derivation work, but this experiment is explicitly scoped throughout
      (its own budget note, and H-CSIDH-3eaede's own framing of this
      experiment as "a baseline-reproduction / applicability audit") as
      citation-plus-arithmetic-check, never symbolic re-derivation --
      consistent with H-CSIDH-3eaede.proof_search_map's own
      constructive_transforms item, which already frames the needed object
      as "an explicit padding/embedding technique CITED IN THE DCP
      LITERATURE," not one the Executor derives itself. (2) It matches this
      contract's own citation-completeness control's existing discipline
      ("every claim... must cite an exact page/section/lemma of primary
      source text... not a paraphrase from memory") -- a reduction argument
      supplied from the Executor's general training/background knowledge
      rather than from the cited text IS a paraphrase from memory in exactly
      the sense that control already forbids, so this resolution is a
      tightening consistent with an existing rule, not an arbitrary new one.
      (3) It closes the red team's own named risk that A would be "close to
      structurally inevitable" and "far less discriminating than its 'cheap,
      decisive gate' framing... claims" if any reader's general field
      knowledge could satisfy the test; requiring the citation to come from
      the audited text itself restores the gate's discriminating power. This
      resolution does NOT foreclose outcome A: if a citable reduction
      genuinely exists in the primary-source text (which this Coordinator
      has not verified, having no access to that text -- see this
      amendment's live_retrieval_tool_test), the audit still reaches A on
      finding it.
    field_scope: metrics.primary.applicability_outcome
    operation: pin_the_A_B_boundary_with_an_operative_test
    old_text_superseded_verbatim: >-
        applicability_outcome: categorical, exactly one of -- A
        (APPLICABLE-AS-STATED: N, or the specific group order the CJS
        reduction, KN-LIT-071, actually supplies as the DCP instance's
        modulus, either literally matches Simon 2026's stated N=2^n
        presentation or has a citable, stated reduction to it that preserves
        the construction's proven/sketched hypotheses) or B
        (NOT-APPLICABLE-AS-STATED: no such match or citable reduction is
        found in the audited primary sources, so applying the construction
        to CSIDH-512 would be an extrapolation beyond what those sources
        state).
    new_text: >-
        applicability_outcome: categorical, exactly one of -- A
        (APPLICABLE-AS-STATED: N, or the specific group order the CJS
        reduction, KN-LIT-071, actually supplies as the DCP instance's
        modulus, either literally matches Simon 2026's stated N=2^n
        presentation OR has a citable, stated reduction to it that preserves
        the construction's proven/sketched hypotheses) or B
        (NOT-APPLICABLE-AS-STATED: no such match or citable reduction is
        found in the audited primary sources, so applying the construction
        to CSIDH-512 would be an extrapolation beyond what those sources
        state).

        OPERATIVE TEST FOR "citable, stated reduction" (added by this
        amendment, per CSIDH-OBJ-2, resolving the boundary toward the
        stricter reading -- see resolution_adopted and
        justification_for_this_reading above): a reduction counts toward
        outcome A if and only if (i) it is stated EXPLICITLY, in the text of
        Simon 2026 (KN-LIT-e204ab) and/or one of its cited predecessors
        (Regev 2004, Kuperberg 2005, Ettinger-Hoyer) as actually read by the
        Executor -- a named technique with a page/section/lemma citation,
        not an inference from general HSP/DCP field knowledge; AND (ii) the
        Executor independently checks and documents that the named
        technique's own stated preconditions hold for CSIDH-512's actual N
        (or the group order the CJS reduction actually supplies). Absent
        both (i) and (ii) within budget, report outcome B.

  # =====================================================================
  # CSIDH-OBJ-3 (MINOR): CONTROL NAME/ROLE OVERCLAIMS ITS EPISTEMIC WEIGHT.
  # =====================================================================
  objection_3_addressed:
    id: CSIDH-OBJ-3
    severity: minor
    source: >-
      RT-20260814-41d4cc, objections[6].
    finding_verbatim_summary: >-
      inputs.second_independent_citation names "the CSI-FiSh reference
      implementation's own parameter file" as an example second source. That
      file was produced by the same authors from the same underlying
      computation as the CSI-FiSh paper itself, so agreement between the two
      is very likely a check that the same number was transcribed
      consistently across two of the same authors' own publications, not an
      independent re-derivation or cross-check against a second,
      differently-computed source. The control's NAME ("Cross-source
      agreement control") and its role description invite a reader to credit
      it with more epistemic weight than "two citations of one computation
      agree" actually supplies -- even though the contract's own prose is
      already careful ("independently obtained citations", never
      "independently computed").
    field_scope: controls[0]
    operation: rename_and_annotate_scope_of_control
    old_text_superseded_verbatim: >-
        Cross-source agreement control: the class-group order N and its
        factorization must be independently obtained from >= 2 distinct
        sources (the CSI-FiSh paper itself, plus a second independent
        citation per inputs.second_independent_citation) and shown to agree
        exactly before any applicability conclusion is drawn. Disagreement
        triggers invalidation_rules, not a reported finding.
    new_text: >-
        Cross-citation consistency control (RENAMED by this amendment from
        "Cross-source agreement control" per CSIDH-OBJ-3, to avoid
        overstating its epistemic weight -- see disclosure below): the
        class-group order N and its factorization must be independently
        obtained from >= 2 distinct citations (the CSI-FiSh paper itself,
        plus a second independent citation per
        inputs.second_independent_citation) and shown to agree exactly
        before any applicability conclusion is drawn. Disagreement triggers
        invalidation_rules, not a reported finding.

        SCOPE DISCLOSURE (added by this amendment, per CSIDH-OBJ-3): if
        inputs.second_independent_citation's own example source (the CSI-FiSh
        reference implementation's own parameter file) is the one actually
        used, this control checks CITATION CONSISTENCY -- that the same
        number was transcribed identically across two of the same authors'
        own publications describing the same underlying computation -- NOT
        an independent mathematical re-derivation of N by a second,
        differently-computed source. This distinction does not change what
        the control verifies (exact numeric agreement between the two
        obtained citations, as before); it changes only what a passing
        result may be understood to establish, matching this contract's own
        already-careful body language ("independently obtained citations",
        never "independently computed") rather than the control's own prior
        name, which invited more credit than that language supports. If the
        Executor instead locates a genuinely differently-computed second
        source (e.g., a later paper's own independent re-derivation of
        CSIDH-512's class number, rather than a same-authorship parameter
        file), that stronger form of agreement should be noted explicitly as
        such when reported, since it would carry more epistemic weight than
        the citation-consistency baseline this control guarantees at minimum.
    cross_reference_annotation:
      field_scope: inputs.second_independent_citation
      old_text_superseded_verbatim: >-
          A second, independently obtained citation for the same class-group
          order (e.g. the CSI-FiSh reference implementation's own parameter
          file, or a later paper that independently cites or re-derives the
          same figure), required for the cross-source agreement check below
          -- not merely re-reading the same PDF twice.
      new_text: >-
          A second, independently obtained citation for the same class-group
          order (e.g. the CSI-FiSh reference implementation's own parameter
          file, or a later paper that independently cites or re-derives the
          same figure), required for the cross-citation consistency check
          below (RENAMED by this amendment from "cross-source agreement
          check"; see controls[0] and its scope disclosure for why) -- not
          merely re-reading the same PDF twice.

  # =====================================================================
  # WHAT REMAINS OPEN / UNATTEMPTED.
  # =====================================================================
