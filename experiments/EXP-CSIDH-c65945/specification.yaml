experiment:
  id: EXP-CSIDH-c65945
  hypothesis_id: H-CSIDH-3eaede
  version: 1
  title: >-
    CSI-FiSh CSIDH-512 class-group-order re-derivation and Simon-2026
    zero-noise DCP specialization applicability audit
  status: approved
  objective: >-
    Independently re-obtain CSIDH-512's exact class-group order N from
    CSI-FiSh (Beullens-Kleinjung-Vercauteren 2019) with its full prime
    factorization, cross-verified against >= 2 independent sources; then
    audit, with exact citations, whether Simon 2026's (KN-LIT-e204ab,
    UNVERIFIED preprint) zero-noise (a(n) -> infinity) DCP specialization is
    a legitimate instantiation of the paper's own stated theorem when the
    dihedral group's order is this actual, concrete N -- rather than the
    N=2^n symbolic presentation the paper's own text uses. This is a
    baseline-reproduction / applicability check testing ONLY premise (i) of
    H-CSIDH-3eaede: it does not attempt to verify Simon 2026's Lemma 3, does
    not compute or compare any concrete time/query cost, and is NOT yet a
    claim that the specialization works or that CSIDH is affected.

  inputs:
    target_instance: >-
      CSIDH-512, the original CSIDH parameter set (Castryck, Lange,
      Martindale, Panny, Renes, "CSIDH: An Efficient Post-Quantum
      Commutative Group Action") at NIST security level 1, as adopted by
      CSI-FiSh.
    class_group_order_source: >-
      Beullens, Kleinjung, Vercauteren, "CSI-FiSh: Efficient Isogeny Based
      Signatures Through Class Group Computations" (2019; IACR ePrint
      2019/498) -- the primary published source of CSIDH-512's exact
      class-group order and its factorization. The executor obtains the
      exact value and its stated factorization directly from this primary
      source (paper text and/or the authors' reference implementation /
      parameter files); no numeric value is asserted anywhere in this
      contract or in H-CSIDH-3eaede, to avoid fabricating a figure this
      Coordinator design task has no tool to verify.
    second_independent_citation: >-
      A second, independently obtained citation for the same class-group
      order (e.g. the CSI-FiSh reference implementation's own parameter
      file, or a later paper that independently cites or re-derives the same
      figure), required for the cross-source agreement check below -- not
      merely re-reading the same PDF twice.
    audited_construction: >-
      Simon 2026's zero-noise DCP erasure construction (KN-LIT-e204ab) and
      its cited predecessors (Regev 2004 / KN-LIT-21383c, Kuperberg 2005 /
      KN-LIT-2c8264, Ettinger-Hoyer), read from primary source text for
      their exact stated group-order hypothesis (the paper's own N=2^n
      bit-recursion presentation) and any stated reduction from general N.

  controls:
    - >-
      Cross-source agreement control: the class-group order N and its
      factorization must be independently obtained from >= 2 distinct
      sources (the CSI-FiSh paper itself, plus a second independent
      citation per inputs.second_independent_citation) and shown to agree
      exactly before any applicability conclusion is drawn. Disagreement
      triggers invalidation_rules, not a reported finding.
    - >-
      Factorization-integrity control: every prime factor in the published
      factorization of N is independently primality-checked (a standard
      primality test, e.g. Miller-Rabin plus a deterministic certificate
      where feasible), and the product of the stated factors is verified to
      equal the stated N -- a purely arithmetic, machine-checkable control
      independent of trusting either citation's prose.
    - >-
      Known-answer control (harness sanity check): before touching
      CSIDH-512's class-group order, the same primality-check-and-product-
      reconciliation procedure is run on a small imaginary-quadratic
      discriminant with a textbook-known class number (e.g. a discriminant
      with h = 1, independently tabulated in standard references), to
      confirm the verification method itself is correctly implemented
      before it is trusted on the CSIDH-512-scale value.
    - >-
      Citation-completeness control on the applicability audit itself: every
      claim in the applicability determination (outcome A or B, see
      metrics.primary below) must cite an exact page/section/lemma of
      primary source text (KN-LIT-e204ab and/or its cited predecessors), not
      a paraphrase from memory -- so an independent reviewer can re-check
      the audit's reasoning without re-deriving it from scratch.

  independent_variables: >-
    None. This is a deterministic verification and literature-audit task,
    not a parameter sweep -- there is no varied experimental factor. The
    only structured comparison is between independently-obtained sources
    (literature citation vs. a second independent citation vs. direct
    arithmetic verification of the published factorization), which is
    covered under controls above, not as an independent variable.

  metrics:
    primary:
      - >-
        class_group_order_match: boolean -- do the >= 2 independently
        obtained citations for CSIDH-512's class-group order N agree
        exactly, and does the published factorization's product equal the
        stated N with every factor independently primality-verified?
      - >-
        applicability_outcome: categorical, exactly one of -- A
        (APPLICABLE-AS-STATED: N, or the specific group order the CJS
        reduction, KN-LIT-071, actually supplies as the DCP instance's
        modulus, either literally matches Simon 2026's stated N=2^n
        presentation or has a citable, stated reduction to it that preserves
        the construction's proven/sketched hypotheses) or B
        (NOT-APPLICABLE-AS-STATED: no such match or citable reduction is
        found in the audited primary sources, so applying the construction
        to CSIDH-512 would be an extrapolation beyond what those sources
        state).
    secondary:
      - >-
        discrepancy_log: any mismatch found between independently-obtained
        values, logged with its magnitude and a documented, non-speculative
        account of the likely cause (e.g. differing conventions for the
        class group of the order vs. the maximal order).
      - >-
        citation_completeness: fraction of applicability-audit claims backed
        by an exact, checkable primary-source citation (target: 100%; any
        claim not so backed is flagged, not silently included).

  heuristic_under_test: null
  # This experiment validates no numbered heuristic (HEUR-CSIDH-3eaede-1 /
  # H1 concerns premise (ii)'s bias arithmetic and is explicitly NOT tested
  # here -- see H-CSIDH-3eaede.heuristic_assumptions).

  preregistered_prediction:
    quantity: >-
      not_applicable: this is a baseline-reproduction / applicability audit
      (docs/task-lifecycle.md step 4), not a heuristic-validation experiment
      per .claude/skills/design-experiment/SKILL.md's "Experiment class
      patterns" -- no probabilistic quantity or distributional prediction is
      made or tested.
    formula: null
    source: null

  scale_relevance:
    tier: crypto
    justification: >-
      The class-group order N being independently re-derived and the
      applicability question being audited are CSIDH-512's actual,
      standardized parameters (per docs/claims-and-verification.md's
      mechanical rule: >96-bit field / recognized cryptographic-size curve
      family), not a toy or reduced substitute -- deliberately, since
      premise (i)'s structural-form question (does N admit Simon 2026's
      N=2^n presentation) is itself scale-dependent and would not be
      answered by a toy N. This crypto-tier label covers ONLY the
      applicability finding; it is not a crypto-scale cost measurement, and
      no concrete time/query cost is produced by this experiment (see
      H-CSIDH-3eaede's interpretation_limits).
    correspondence: null
    # Direct: CSIDH-512's own published class-group order is used, not a
    # sampled or extrapolated proxy for it.

  tail_checks: []
  # not_applicable: no distributional claim is tested by this experiment;
  # there is no tail, bulk, or extreme-value comparison to check.

  replication:
    seeds: []
    independent_instances: 0
    # not_applicable: deterministic, independently re-derivable by any
    # reviewer. Class-group-order lookup/verification and the primary-source
    # applicability audit have no random component; there is nothing a seed
    # or repeated draw would resolve. The "replication" that matters here is
    # the >= 2-independent-citation cross-source agreement control above,
    # which is a control, not a seeded/randomized replication and is
    # recorded there rather than invented as a seed list.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 0.5
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: null
  # Intentionally small: this is a factorization lookup/verification and a
  # close literature read, not a compute campaign. Below the 8GB memory
  # floor noted in templates/research-records.md by design and stated why:
  # primality-checking a published factorization and reconciling a product
  # against a several-hundred-bit integer is arithmetic on numbers of a few
  # hundred bits, not a lattice-reduction or sieving computation. A
  # from-scratch re-derivation of CSIDH-512's class number by BSGS or an
  # analytic/GRH-heuristic method -- which the CSI-FiSh authors themselves
  # report as a substantial computation in its own right -- is explicitly
  # OUT OF SCOPE of this contract; the verification strategy here is
  # citation-plus-arithmetic-check, not re-derivation from a blank slate,
  # exactly to keep this task small per its own budget constraint.

  stopping_rules:
    - >-
      Stop once (a) N and its full factorization have been obtained from
      >= 2 independent sources and cross-verified (product reconciliation
      plus per-factor primality check), and (b) the applicability
      determination (outcome A or B) has been reached and documented with
      exact citations.
    - >-
      Stop and report NOT-COMPUTED / BLOCKED, an infrastructure outcome
      rather than a mathematical finding (AGENTS.md rule 3/5), if the
      primary CSI-FiSh source (paper text and/or reference implementation)
      cannot be accessed within budget.

  invalidation_rules:
    - >-
      If the >= 2 independently obtained class-group-order values disagree
      and the discrepancy cannot be resolved and documented within budget,
      the run is INVALID for the applicability conclusion -- do not silently
      prefer one source or proceed to the applicability audit on an
      unresolved N.
    - >-
      If the executor substitutes a toy, truncated, or approximate N for
      CSIDH-512's actual published N without flagging it as such, the run is
      invalid against this contract's crypto-scale claim (scale_relevance
      above).
    - >-
      A timeout, crash, or tool/access failure while attempting to reach the
      primary source is an infrastructure failure per AGENTS.md rule 3, and
      is never reported as a negative applicability finding (outcome B).
    - >-
      Any applicability-audit claim lacking an exact primary-source citation
      (contrary to the citation-completeness control) invalidates that
      specific claim; the audit as a whole is invalid until every claim it
      relies on is cited or explicitly flagged as uncited and excluded from
      the conclusion.

  success_criterion: >-
    The run is SUCCESSFUL -- produces a decidable, reportable outcome for
    this contract, independent of which way the substantive finding comes
    out -- if: (1) CSIDH-512's exact class-group order N is obtained from
    CSI-FiSh's own published source, with its full prime factorization
    independently verified (every factor primality-checked, the product
    reconciled against the stated N), and a second independent citation is
    checked and found in exact agreement; AND (2) the applicability audit
    reaches one of the two decidable, mutually exclusive outcomes -- A
    (APPLICABLE-AS-STATED) or B (NOT-APPLICABLE-AS-STATED), as defined in
    metrics.primary.applicability_outcome -- with the supporting citations
    recorded for whichever outcome is reached.

  falsification_criterion: >-
    Outcome B (NOT-APPLICABLE-AS-STATED) is the decidable NEGATIVE outcome
    for H-CSIDH-3eaede's premise (i): it falsifies, at CSIDH-512's actual
    scale, the claim that the zero-noise specialization is a legitimate
    instance of Simon 2026's own stated theorem -- without requiring any
    evaluation of Lemma 3, matching IDEA-20260813-e6d55d's own
    falsification_conditions item 1, now instantiated at a concrete N. A
    class-group-order mismatch that cannot be reconciled (see
    invalidation_rules) is NOT a falsification of the hypothesis; it is an
    evidence-integrity failure and is reported as invalid, not negative.

  required_artifacts:
    - >-
      A written applicability-audit report (yaml or markdown) citing exact
      page/section/lemma references from Simon 2026 (KN-LIT-e204ab) and its
      cited predecessors, stating outcome A or B with reasoning any
      independent reviewer can re-check without re-deriving it.
    - >-
      The independently obtained CSIDH-512 class-group order N and its full
      prime factorization, with the primality-check method and result for
      each factor, and citations to both independent sources
      (inputs.class_group_order_source and
      inputs.second_independent_citation).
    - >-
      A reconciliation note if the two sources disagree (per
      invalidation_rules), or an explicit "exact agreement" statement if
      they do not.
    - >-
      An explicit statement of the group order N' actually supplied to the
      DCP/dihedral-HSP instance by the CJS reduction (KN-LIT-071), with a
      citation, distinguished from the raw class number itself if the two
      differ (e.g. because the class group is not cyclic, or a subgroup or
      quotient is used).
    - >-
      A run record reaching a terminal status per docs/task-lifecycle.md
      step 6 (completed_valid / completed_invalid /
      failed_infrastructure / failed_implementation /
      resource_exhaustion / cancelled_by_budget), filed under
      experiments/EXP-CSIDH-c65945/runs/.

  assigned_to: executor
  approved_by: coordinator
