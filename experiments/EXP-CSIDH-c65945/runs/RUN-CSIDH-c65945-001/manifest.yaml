      write_scope authorizes fixing.
    - >-
      Kuperberg 2005 (Section 5, Algorithm 2, p.4) supplies an explicit,
      citable, named technique for extending HIS OWN sieve algorithm from
      N=2^n to general N (Chinese-remainder decomposition plus an
      automorphism-based relabeling) -- a real, positive-adjacent finding
      that does NOT itself satisfy CSIDH-OBJ-2's operative test for the
      audited construction (Simon 2026's different, noise-tolerant erasure
      technique), but is preserved here per this program's "record, never
      discard" rule rather than omitted for looking like it complicates a
      clean negative result. See applicability_audit.md Section 2c.

