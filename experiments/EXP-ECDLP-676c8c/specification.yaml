# EXP-ECDLP-676c8c
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261003-fa648c.
experiment:
  id: EXP-ECDLP-676c8c
  hypothesis_id: H-ECDLP-e1a9ae
  source_idea: IDEA-20261003-841c98
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-2 table versus width-1 table
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-fa648c
  objective: >-
    Check the table sizes 2 and 1, the product 2, and the nearby gap 0.
  inputs:
    width_hi: 2
    width_lo: 1
    table_hi: 2
    table_lo: 1
    table_gap: 1
    table_product: 2
    table_sum: 3
    nearby_a: 1
    nearby_b: 1
    nearby_gap: 0
    nearby_product: 1
  controls:
    - >-
      Two to the power 1 is 2. Two to the power 0 is 1. Reporting
      both tables as size 1 drops the gap and invalidates the run.
    - >-
      Two exceeds one by 1. The product of the two sizes is 2.
      Their sum is 3.
    - >-
      Two width-1 tables each store 1. Their gap is 0 and their
      product is 1.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-2 table stores 2 entries. The width-1 table stores
      1. The gap of two width-1 tables is 0.
    formula: >-
      Compute 2 to the power 1. Compute 2 to the power 0. Subtract
      1 from 2. Multiply 2 by 1. Subtract 1 from 1.
    source: >-
      IDEA-20261003-841c98 states the widths 2 and 1 and the sizes
      2 and 1, read 2026-10-03. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 2 and the nearby gap 0 are required. A check that stops at the size 2 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 2 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 1 is not 2.
    - Two to the power 0 is not 1.
    - The gap is not 1.
    - The product is not 2.
    - Both tables are reported as size 1, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-2 table stores 2 entries, that
    the width-1 table stores 1, and that 2 exceeds 1 by 1.
  falsification_criterion: >-
    The runs agree that the width-2 table size is computed, and
    that size is not 2.
  required_artifacts:
    - experiments/EXP-ECDLP-676c8c/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-676c8c/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-676c8c/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-676c8c/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-676c8c/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-676c8c/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 1 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
