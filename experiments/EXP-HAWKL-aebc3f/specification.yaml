experiment:
  id: EXP-HAWKL-aebc3f
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-eed484; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-eed484
  question_id: RQ-HAWK-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Measure whether cheap pre-solve features predict exact stage-one principality labels for
    bounded-norm ideals in small CM fields, against a label-shuffling null, a constant-label null
    field and an operation-count cost ratio.
  objective: 'The one uncertainty a run reduces is whether membership in the easy stratum is knowable
    before paying for a solve, or only after. Concretely: (i) whether a corpus of at least 2000 ideals
    in a small CM field can be labelled EXACTLY for stage-one principality within a frozen budget,
    with the class balance and the labelling operation count recorded - if it cannot, the run reports
    a budget limit and stops; (ii) whether any member of a feature set frozen before labels were seen
    discriminates those labels on held-out norm targets, measured as area under the ROC curve and
    referenced to the exact null distribution obtained by shuffling the same labels 2000 times in
    the same invocation, so that the threshold for counting is empirical rather than conventional;
    (iii) whether any such discrimination is operationally meaningful, decided by the ratio of feature-computation
    operations to labelling operations - a detector that costs as much as the label is not a detector
    - and by the gap between random and target-grouped splitting, which exposes memorisation. A run
    implements no part of the nrd-PIP algorithm, forms no nrd-PIP instance, runs no subfield solver,
    and reopens nothing KN-OPEN-028 closed.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: in a declared CM field
      of degree 4 (and possibly 8) over Q with declared discriminant and class number, over a declared
      set of relative-norm targets, with a declared labelling budget B defining the label, a frozen
      feature set achieves test-set area a on target-grouped splits against a shuffling null whose
      99th percentile is p, at a feature-to-label operation-count ratio r. What does NOT follow: nothing
      about the route''s easy instances, because the label is an explicitly named stage-one principality
      proxy and not subfield-solver success; nothing about the DENSITY of any stratum, which is a
      separate quantity settled in direction by KN-OPEN-028; nothing about fields larger than those
      tested; nothing about stage-two short-generator recovery, which KN-TECH-081 records as a different
      problem; and no statement about HAWK''s security in either direction.'
  inputs:
    procedure: 'STAGE 0 (cost: a day of human work). Freeze, in the specification and in this order:
      the fields, the relative-norm target set, the labelling budget B, the feature set, the splitting
      scheme and the evaluation protocol. The commit order is recorded so that features demonstrably
      predate labels. STAGE 1 (cost: minutes). Compute class group and unit group of each field exactly;
      halt if not exactly computable. STAGE 2 (cost: hours, the dominant cost). Generate and exactly
      label at least 2000 ideals across at least 20 norm targets by exhaustive bounded principality
      search, recording per-instance operation counts and flagging any instance where the search hit
      the budget. STAGE 3 (cost: minutes). Compute the frozen features on every instance, recording
      per-instance operation counts. STAGE 4 (cost: minutes). Target-grouped train/test split; fit
      one threshold rule per feature and one logistic model; evaluate area on held-out targets. Repeat
      with a random split for the memorisation comparison. STAGE 5 (cost: minutes). Label-shuffling
      null, 2000 permutations, same invocation. STAGE 6 (cost: minutes). Class-number-1 null field
      through the identical pipeline. STAGE 7 (cost: seconds). Cost-ratio computation. STAGE 8 (cost:
      minutes). Emit through harness/runner.py with all areas, the null distribution, class balance,
      cost ratios and the budget-hit flags.'
    instrument: 'Python 3 with exact integer arithmetic; sympy for number-field polynomial arithmetic,
      small-integer factorisation and normal forms; hand-written exact routines in the harness for
      ideal generation, norm computation and bounded principality search, shared with the density
      contract in this batch so both use one labelling implementation. scikit-learn is NOT required:
      the threshold rules are computed directly and the logistic model is a short hand-written gradient
      fit, so the contract has no heavyweight dependency and no hidden model capacity. numpy for the
      area-under-curve and permutation bookkeeping only. No computer-algebra system and specifically
      no Sage. Operation counts are instrumented counters, not timings, so results are hardware-independent.
      Runs, seeds and manifests through harness/runner.py.'
    parameters: 'Fields: one CM field of degree 4 over Q with class number greater than 1 and declared
      discriminant; one class-number-1 null field of the same degree; optionally one degree-8 field.
      Relative-norm targets: at least 20, spanning distinct factorisation types. Instances: at least
      2000 labelled, target-balanced as far as possible. Labelling budget B: frozen search-region
      size, declared. Feature set: approximately 6 frozen features (number of prime factors of the
      norm, largest prime factor, ramification pattern at primes 2, 3, 5, norm size class). Splits:
      target-grouped (primary) and random (comparison). Permutations: 2000. Seeds declared.'
  controls:
  - Label shuffling within the test set, 2000 permutations, same invocation, giving the exact null
    distribution at this sample size and class balance.
  - 'Class-number-1 null field where the label is constant: the pipeline must yield no usable area.'
  - Random split versus target-grouped split, both reported, so memorisation is visible rather than
    hidden.
  - 'Cost-ratio control: operation counts for feature computation and for labelling, reported per
    instance, since a detector must be cheaper than the thing it replaces.'
  - Feature-freeze commit order recorded in the specification, so that features demonstrably predate
    labels.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both in the same invocation. Null one, LABEL SHUFFLING:
    permute the exact labels within the test set 2000 times and recompute the area under the curve
    each time, giving the exact null distribution of the metric at this sample size and class balance;
    a predictor counts only if its area exceeds the 99th percentile of that distribution. Null two,
    RANDOM SAME-SHAPE INSTANCES: replace the structured ideal corpus with ideals drawn from a field
    of the same degree but with class number 1, where every instance is principal and the label is
    constant; the pipeline must report an undefined or chance-level area there, confirming it does
    not manufacture discrimination from a degenerate label. For the signal arm to mean anything, null
    one must produce a distribution centred at 0.5 with the observed area outside its upper tail,
    and null two must not produce a usable area at all.'
  independent_variables:
  - feature identity within the frozen set
  - split scheme (target-grouped versus random)
  - field (signal, class-number-1 null, optional degree-8)
  - relative-norm target
  metrics:
    primary:
    - per-feature test-set area under the ROC curve, target-grouped split
    - all-feature model area, target-grouped split
    - label-shuffling null distribution centre and 99th percentile
    - feature-computation to labelling operation-count ratio
    secondary:
    - random-split minus grouped-split area gap
    - class balance and labelled-instance count
    - number of instances where the labelling search hit budget B
    - class-number-1 null field pipeline result
    - per-feature value distributions
  heuristic_under_test: null
  preregistered_prediction:
    quantity: A_best, the maximum over the frozen feature set of the target-grouped test-set area
      under the ROC curve for predicting the exact stage-one principality label in the degree-4 signal
      field.
    formula: 'A_best = max over frozen features f of AUC(f; held-out targets), with AUC computed by
      the standard rank statistic on the held-out set. Counts as detection only if A_best > Q99, where
      Q99 is the 99th percentile of the distribution of the same statistic over 2000 random permutations
      of the held-out labels computed in the same invocation. Predicted: A_best >= 0.60 and A_best
      > Q99. The alternative outcome, A_best <= Q99, is a fully reportable measured obstruction and
      relocates the route''s load-bearing quantity from stratum density to per-draw solve cost.'
    source: Pre-registered in the parent proposal IDEA-20260816-eed484 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'CM fields of degree 4 (optionally 8) over Q with small declared discriminants,
      chosen because class group, unit group and exhaustive bounded principality are all exactly computable
      there. These are far smaller than the fields arising in the setting of interest and NO transfer
      is assumed or offered. Two separate scope limits are stated in every output: the field size,
      and the fact that the label is a stage-one principality proxy under a frozen budget B rather
      than subfield-solver success. The contract''s conclusions are scoped by name to the declared
      fields, targets, budget and feature set.'
    correspondence: null
  tail_checks:
  - 'Check instances where the labelling search hit budget B: these are label-ambiguous and must be
    excluded from the primary evaluation and counted separately.'
  - Check norm targets whose instances are all one label, which contribute nothing to area and can
    distort grouped splitting.
  - Check the highest-scoring instances under the best feature and inspect them individually, to confirm
    the feature is not proxying for the sampling design.
  - Check the area estimate's stability by recomputing it on bootstrap resamples of the held-out targets,
    reporting the interval alongside the point estimate.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt and report a budget limit if fewer than 2000 instances can be exactly labelled.
  - Halt if the label-shuffling null is not centred at 0.5.
  - Halt if the class-number-1 null field yields a usable area despite a constant label.
  - Halt if more than 20 percent of instances hit the labelling budget, since the label is then too
    ambiguous to support any detection claim.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run emits per-feature and all-feature target-grouped areas with bootstrap
    intervals, the empirical label-shuffling null distribution from the same invocation, the feature-to-label
    operation-count ratio, the random-versus-grouped split gap, class balance, and the budget-hit
    count - with the shuffling null centred at 0.5 and the constant-label null field yielding no usable
    area.
  falsification_criterion:
  - 'No feature and no model exceeds the shuffling null''s 99th percentile (a measured obstruction:
    no cheap detector at this scale).'
  - The shuffling null is not centred at 0.5.
  - The class-number-1 null field yields a usable area.
  - Area collapses from random to target-grouped splitting (memorisation).
  - The feature-to-label operation-count ratio exceeds 1.
  - More than 20 percent of instances hit the labelling budget, making the label ambiguous.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-eed484
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The labelling budget B defines the label rather than merely parameterising it; the Coordinator
    must set it and must accept that every conclusion is scoped to that choice.
  - Whether stage-one principality within budget is an acceptable proxy for 'unusually easy' at all
    is a judgement the Coordinator must make explicitly, since it is the contract's weakest joint
    and the entry does not defend it.
  - The feature set must be approved before the labelled corpus exists; the Coordinator should verify
    the commit order rather than trusting it.
  - Whether a degree-8 arm is worth its cost, given that no extrapolation is licensed, is a Coordinator
    decision.
