experiment:
  id: EXP-SHATWO-4ce28b
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-8d3980; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-8d3980
  question_id: RQ-SHATWO-f196c7
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Self-tested step-reduced certificate chain for SHA-256: schema, dual independent verifiers,
    a birthday-search self-test certificate at 40-bit truncation, and a 400-member corruption and
    random-pair null battery'
  objective: The one uncertainty a run reduces is whether this program can verify a step-reduced hash
    certificate correctly, which is a prerequisite for every certificate-bearing claim in this bucket
    and is currently untested. (i) It produces the certificate schema, the canonical serialization,
    two independently written step-reduced evaluators cross-checked on 10^6 random inputs at every
    step count from 1 to 64, and a verifier that recomputes the claimed relation from the messages
    and never reads a claimed digest, anchoring the whole chain at s = 64 against hashlib on the NIST
    test vectors as RQ-SHATWO-f196c7's constraints require. (ii) It exercises the chain end to end
    today, without waiting on any published attack, by producing a genuine self-test certificate through
    birthday search on a 40-bit-truncated step-reduced output - about 2^20 evaluations, no cryptanalysis
    - and requiring both verifiers to accept it. (iii) It measures the chain's discrimination by requiring
    both verifiers to reject 100 percent of a 200-member single-mutation corruption battery covering
    every schema field and 100 percent of 200 random-pair certificates of matched shape, so that the
    accept verdict carries information rather than reflecting a verifier that accepts everything.
    A run does NOT reduce uncertainty about whether any published step-reduced attack can be reproduced,
    which RQ-SHATWO-f196c7's own KN-LIT constraint blocks and which this contract declines by declaration.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope: for the declared schema version, the two
      named implementations, the declared corruption family and the declared truncation, the verification
      chain accepted a genuine self-test certificate and rejected the null battery at the emitted
      rates, and the two evaluators agreed at the emitted rate across step counts 1 to 64. WHAT DOES
      NOT FOLLOW: any ability to FIND a collision at any nontrivial step count, since verifying and
      searching are different capabilities; that the 40-bit-truncated self-test collision is cryptanalysis,
      which it is not; that any published attack has been reproduced, since none was attempted and
      the receipt records BLOCKED; that complexity claims are verifiable by this machinery, which
      they are not; and nothing about SHA-256 at any step count, full 64-step SHA-256, HMAC-SHA-256,
      TLS certificate chains, code signing, or Bitcoin.'
  inputs:
    procedure: 'STAGE 0 (hours, human): write and hash the preregistration - schema fields, serialization
      conventions including endianness and padding, the corruption family definition with at least
      one mutation per field, truncation width, and the forced values. STAGE 1 (half a day, human;
      minutes machine): implement two step-reduced SHA-256 evaluators independently, parameterized
      by step count and initial chaining value; validate both against hashlib on the NIST test vectors
      at s = 64; cross-check them on 10^6 random inputs at every step count from 1 to 64 and abort
      on any disagreement. STAGE 2 (hours, human): write the verifier as a pure recomputing function
      and the canonical serializer and parser. STAGE 3 (minutes, machine): birthday search on the
      40-bit-truncated step-reduced output to produce the self-test certificate, about 2^20 evaluations;
      verify it with both verifiers. STAGE 4 (minutes, machine): generate and run the 200-member corruption
      battery and 200 random-pair certificates through both verifiers, requiring rejection of every
      one. STAGE 5 (minutes): serialization round-trip control on every certificate. STAGE 6 (minutes):
      emit the reproduction receipt recording zero published attacks reproduced, the KN-LIT blocking
      condition, and what would unblock it, plus the run manifest with seeds and the resolved inference
      block.'
    instrument: Python 3.11 throughout; hashlib from the standard library as the third independent
      anchor at s = 64 against NIST test vectors; two hand-written step-reduced SHA-256 evaluators
      in pure Python with different internal representations, one word-oriented and one bit-oriented;
      a plain dict-based birthday-search routine for the self-test; JSON with a declared canonical
      form for certificate serialization; harness/runner.py for the run manifest, deterministic seeds
      and the inference block. No SAT solver is needed, no computer-algebra system, and no Sage.
    parameters: 'Word width 32, block 512 bits, step counts 1 to 64 for the cross-check; self-test
      certificate at one declared step count with output truncated to 40 bits; birthday search over
      about 2^20 random messages with a fixed seed. Corruption battery: 200 certificates, at least
      20 per schema field, one mutation each. Random-pair battery: 200 certificates with independent
      uniform messages of matched length. Cross-implementation check: 10^6 random inputs per step
      count, seeds fixed in the preregistration. Serialization round trip applied to all 401 certificates.'
  controls:
  - Corruption battery of at least 200 single-mutation certificates spanning every schema field, rejected
    by both verifiers in the same invocation.
  - 200 random-pair certificates of matched shape, rejected by both verifiers.
  - Two independently written step-reduced evaluators cross-checked on 10^6 random inputs at every
    step count from 1 to 64.
  - hashlib as a third independent anchor at s = 64 against the NIST test vectors.
  - 'Round-trip serialization control: every certificate serialized, reparsed and re-verified, with
    the verdict required to be identical.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The corruption battery is the null object and it runs in the same invocation
    as the accept test: a family of certificates of identical shape that are wrong by construction,
    one mutation each, at least 200 of them spanning every field of the schema, plus 200 certificates
    whose message pairs are independent uniform random values with the same lengths. For the accept
    verdict to mean anything, both verifiers must reject 100 percent of the corruption battery and
    100 percent of the random-pair certificates, while accepting the genuine self-test certificate.
    A verifier that accepts anything in either null family is not a verifier, and its acceptance of
    the genuine certificate carries no information at all.'
  independent_variables:
  - verifier implementation (two independent)
  - certificate class (genuine, single-mutation corruption, random pair)
  - mutated schema field
  - step count for the cross-implementation check
  metrics:
    primary:
    - accept verdict on the genuine certificate per verifier
    - rejection rate over the corruption battery per verifier and per field
    - rejection rate over the random-pair battery per verifier
    - cross-implementation agreement rate per step count
    secondary:
    - serialization round-trip verdict stability
    - birthday-search evaluation count to first collision
    - wall-clock per stage
    - reproduction receipt status string
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The rejection rate over the combined 400-member null battery (200 single-mutation corruptions
      plus 200 random-pair certificates), computed separately for each of the two verifiers, alongside
      the accept verdict on the single genuine self-test certificate.
    formula: 'reject_rate(V) = (number of null-battery certificates on which verifier V returns reject)
      / 400, for V in {V1, V2}. Frozen thresholds: PASS requires reject_rate(V1) = reject_rate(V2)
      = 1.0 exactly, accept on the genuine certificate from both verifiers, cross-implementation agreement
      = 1.0 at every step count from 1 to 64, and verdict stability across serialization round trip
      on all 401 certificates. Any deviation is FAIL and stops the certificate-bearing work in this
      bucket until the chain is rebuilt.'
    source: Pre-registered in the parent proposal IDEA-20260816-8d3980 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The evaluators run at the FULL SHA-256 parameter set - 32-bit words, 512-bit block,
      step counts 1 to 64 - so the verification chain itself is not scaled down at all. What is scaled
      down, deliberately, is only the self-test certificate: its output is truncated to 40 bits so
      that a genuine collision is reachable by birthday search in about 2^20 evaluations. The transfer
      assumption stated: that a chain which correctly accepts and rejects at 40-bit truncation behaves
      identically at full width, which is true of the code path by construction since truncation is
      a parameter, but is not separately measured. No extrapolation of any kind is made toward an
      attack.'
    correspondence: null
  tail_checks:
  - Report rejection counts per mutated schema field, not only pooled, so a field with a blind spot
    is visible rather than averaged away.
  - Check the boundary step counts s = 1 and s = 64 explicitly in the cross-implementation comparison,
    since chaining-value handling degenerates at both ends.
  - Check a certificate whose two messages are identical, which must be rejected as a trivial non-collision
    by both verifiers.
  - Report the birthday-search evaluation count against the 2^20 expectation, since a wildly different
    count indicates the truncation is not what the schema says.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and FAIL on the first acceptance of any null-battery certificate by either verifier.
  - Halt and FAIL on the first cross-implementation disagreement at any step count.
  - Stop the birthday search at 2^24 evaluations without a collision and record it as an instrument
    fault, since at 40-bit truncation that outcome indicates the truncation is misimplemented.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both verifiers accept the genuine self-test certificate, reject all 400 null-battery
    certificates, agree with each other on 10^6 inputs at every step count from 1 to 64, match hashlib
    at s = 64 on the NIST vectors, and preserve every verdict across serialization round trip - and
    the reproduction receipt is emitted recording zero published attacks reproduced with its blocking
    condition named, which is a complete deliverable rather than an omission.
  falsification_criterion:
  - Either verifier accepts any single-mutation corrupted certificate, falsifying the chain's discrimination.
  - Either verifier accepts a random-pair certificate at 40-bit truncation, falsifying the verifier
    outright.
  - The two evaluators disagree at any step count, falsifying the independence anchor.
  - A verdict changes across serialization round trip, falsifying the canonical form.
  - The identical-message certificate is accepted, falsifying the relation semantics.
  - The corruption family leaves a schema field untested, falsifying the coverage claim.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-8d3980
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Two implementations written in one session by one agent are not genuinely independent, and hashlib
    anchors them only at s = 64; a Coordinator must decide whether that residual is acceptable or
    require a third implementation from a separate session.
  - The semi-free-start relation semantics - whether the chaining value is fixed before or after the
    feed-forward - is a convention this contract declares but does not derive, and it must be settled
    before any semi-free-start certificate is emitted.
  - No argument establishes that correct behaviour at 40-bit truncation implies correct behaviour
    at full width beyond the fact that truncation is a code parameter.
  - The reproduction receipt's BLOCKED status depends on the KN-LIT filing constraint in RQ-SHATWO-f196c7,
    and a Coordinator must confirm that constraint still stands before approval.
