    enumerate GL_2 partitions, does not touch Z/6,
    does not count E[ell] kernels, does not identify
    a rho cost, does not classify the O2-line W, and
    does not change H-ECDLP-92e64c, H-ECDLP-881d63,
    H-ECDLP-9a1388, H-ECDLP-7f5b05, H-ECDLP-e54f8c,
    H-ECDLP-a69bea, H-ECDLP-38f4b4, H-ECDLP-a23318,
    H-ECDLP-536b21, H-ECDLP-3f68f6, H-ECDLP-b51c3d,
    H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb,
    H-ECDLP-77caa5, H-ECDLP-07c7c6, H-ECDLP-2ade73,
    or H-ECDLP-a3598b.
  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-f35143
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-90ba21
  source_proposal: IDEA-20260902-63dbc0
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-f35143 under the standing 2026-09-06
    user authorization. Stage 0 is the exact M1/M2/M3
    identity calibrator at n=5. Complete GL_2/AGL_2
    census, Z/6 nearby-object census, E[ell] kernel
    count, and rho cost identification are later
    stages and are not run here.

  objective: >
    Evaluate the exact integer identities
    M1=d(n-1)+1, M2=2, M3=n+1 on one
    frozen family (REAL, KF, NULL) at
    n=5 and decide whether the tuple-
    closure count calibrator works.
    Stage 0 does not enumerate
    partitions and does not authorize
    Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL M1=4,
      M2=2, M3=6; KF wrong-divisor
      M1=3 not 4; NULL zero-count
      M1=0 not 4; n=4 and n=1
      rejected. Certificate kind none.
    formula: >
      d(k)=|{i : 1<=i<=k, k%i==0}|.
      M1=d(n-1)+1. M2=2. M3=n+1.
      Frozen n=5: d(4)=3, M1=4,
      M2=2, M3=6. KF uses d(n)+1
      so M1_kf=d(5)+1=3.
      FORCED Stage 0: fixture_pass,
      real_count_pass,
      known_false_wrong_divisor_pass,
      reject_invalid_pass,
      null_zero_pass all true.
    source: >
      ledger/proposals/IDEA-20260902-63dbc0.yaml
      Stage 1 (a)-(c) counts as Stage 0
      hard-gate identities.
      Provenance internal; read in this design session.

  design_tightening_stage0_is_instrument_not_audit: >
    IDEA-20260902-63dbc0 Stage 0 is
    write-theorems and Stage 1 is the
    complete GL_2/AGL_2 census at n in
    {5,7,11,13} plus Z/6 and E[ell]
    controls. Stage 0 here is a
    disclosed tightening: the three
    count identities at one frozen
    prime n=5, not the census, not
    Z/6, not E[ell], not rho cost
    identification. Exact integer
    M1/M2/M3 identities are the only
    Stage 0 arm.

  inputs:
    fixture:
      n_frozen: 5
      real:
        id: REAL
        must_M1: 4
        must_M2: 2
        must_M3: 6
        role: real_identity
      known_false:
        id: KF
        wrong_divisor: true
        must_M1: 3
        must_not_equal_real: true
        role: known_false_wrong_divisor
      matched_null:
        id: NULL
        kind: zero_count
        must_M1: 0
        must_not_equal_real: true
        role: matched_null_zero_count
      invalid:
        - id: n-composite
          n: 4
          must_reject: true
        - id: n-one
          n: 1
          must_reject: true
      working_model: >
        Exact M1/M2/M3 identity at frozen
        n=5. Not a GL_2 census. Not a
        Z/6 census. Not an E[ell] kernel
        count. Not a rho beat.
      do_not_enumerate_gl2: true
      do_not_touch_z6: true
      do_not_count_ell_kernels: true

  independent_variables:
    - object in the frozen family
    - whether d is taken of n-1 or of n
    - whether n is the frozen prime 5

  null_object:
    name: zero-count at n=5
    construction: >
      Replace the divisor formula by
      the zero count. M1=0, which is
      not 4. This is the nearby-object
      control with the structure term
      removed.
    non_degeneracy_check: >
      known_false_wrong_divisor_pass must
      be true before any REAL identity
      is read as a measurement.
    dynamic_range_demonstration: >
      n=4 and n=1 must be rejected
      before an identity is read as a
      census.

  controls:
    - KF wrong-divisor M1=3 (known-false / proves-too-much)
    - REAL identity M1=4, M2=2, M3=6
    - NULL zero-count rejection of collapse
    - n=4 and n=1 rejection
    - exact integer arithmetic, no floats
    - n frozen before any partition is enumerated

  metrics:
    primary:
      - fixture_pass boolean
      - real_count_pass boolean
      - known_false_wrong_divisor_pass boolean
      - reject_invalid_pass boolean
      - null_zero_pass boolean
    secondary:
      - REAL M1 M2 M3
      - KF M1
      - NULL M1
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      Frozen integer identities at n=5.
      No transfer to a GL_2 census,
      Z/6 object, E[ell] kernel, or
      cryptographic n.
    correspondence: null

  tail_checks:
    - REAL is M1=4, M2=2, M3=6
    - KF is M1=3
    - NULL is M1=0
    - n=4 and n=1 are rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      real_count_pass,
      known_false_wrong_divisor_pass,
      reject_invalid_pass, and
      null_zero_pass. A miss classifies
      the run failed_infrastructure if it is
      a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-TUPLE.
    - Stages 1 and later are not authorized.
    - Do not enumerate GL_2 partitions.
    - Do not touch Z/6.
    - Do not count E[ell] kernels.
    - Do not identify a rho cost.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing the frozen n=5 after this freeze
    - Enumerating partitions because a frozen identity fails
    - Reading Stage 0 as a GL_2 census, Z/6 object, E[ell] kernel count, or a decoder
    - Reading Stage 0 as an ECDLP advantage or a rho beat
    - Authorizing Stage 1 of EXP-ECDLP-114eb2 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-821bc5 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-735974 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-fdae20 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-089e80 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-b3f975 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-daf1bb from this contract
    - Authorizing Stage 1 of EXP-ECDLP-0d1336 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-1aa0f8 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-79f8c4 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-628891 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-9e9536 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-90f602 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-4be480 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-6a97f4 from this contract
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Editing EXP-ECDLP-a5f766 or H-ECDLP-a3598b
    - Changing H-ECDLP-92e64c, H-ECDLP-881d63, H-ECDLP-9a1388, H-ECDLP-7f5b05, H-ECDLP-e54f8c, H-ECDLP-a69bea, H-ECDLP-38f4b4, H-ECDLP-a23318, H-ECDLP-536b21, H-ECDLP-3f68f6, H-ECDLP-b51c3d, H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73
    - Dispatching EXP-ECDLP-df601f from BATCH-5a5091

  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, real_count_pass,
    known_false_wrong_divisor_pass,
    reject_invalid_pass, and
    null_zero_pass are true, and the
    run manifest carries certificate.kind
    none. Success is instrument
    reproduction, not a partition census
    and not an attack.

  falsification_criterion: >
    A certified KF miss of the gap 3\neq4
    after fixture_pass is a scoped miss
    of P-S0-TUPLE. A certified REAL identity
    miss after fixture_pass is a scoped
    miss of P-S0-TUPLE. Infrastructure bugs
    are not mathematics. Stage 0 does not
    test P-S1-ENUM.

  required_artifacts:
    - Stage 0 raw-result.json with the five gates
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - Frozen toy identity at n=5.
    - Not a GL_2 census. Not a Z/6 census.
    - Not an E[ell] kernel count. Not a rho cost.
    - Not a rho beat. Not the O2-line W.
    - No decoder. No cryptographic transfer.
    - No Stage 1 of 114eb2. No Stage 1 of 821bc5.
      No Stage 1 of 735974. No Stage 1 of fdae20.
      No Stage 1 of 089e80. No Stage 1 of b3f975.
      No Stage 1 of daf1bb. No Stage 1 of 0d1336.
      No Stage 1 of 1aa0f8. No Stage 1 of 79f8c4.
      No Stage 1 of 628891. No Stage 1 of 9e9536.
      No Stage 1 of 90f602. No Stage 2 of 4be480.
      No Stage 2 of 6a97f4. No Stage 17 of 420e73.
      No Stage 5 of a98ea9.
    - Certificate kind none. No solve or attack.
    - O2-line W is not classified.
    - EXP-ECDLP-a5f766 remains another lane.
    - Do not enumerate GL_2 partitions.
    - Do not dispatch EXP-ECDLP-df601f from BATCH-5a5091.
