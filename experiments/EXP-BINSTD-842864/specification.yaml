# =============================================================================
# EXP-BINSTD-842864 -- VERSION 1 (APPROVED by DEC-20261001-60369f) frozen
# contract for H-BINSTD-944a66: exact Rolle-pruned Weil-polynomial census
# at g=5,6 over F_2 for 131 | h(3), with LMFDB unfiltered completeness
# control and g<=4 baseline reproduction.
#
# Source: IDEA-20260926-5c26f9 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Extends KN-OPEN-095df5 past dimension 4. ZERO RUNS in this design packet.
# Amazon Bedrock prohibited. packaging_only false.
#
# certificate.kind vocabulary (docs/claims-and-verification.md):
#   discrete_log | decomposition | key_recovery | none
# Run manifests MUST use certificate.kind: none (structural census).
# =============================================================================
experiment:
  id: EXP-BINSTD-842864
  hypothesis_id: H-BINSTD-944a66
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260926-5c26f9
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Exact g=5,6 Weil census over F_2 for 131|h(3); LMFDB completeness
    control; g<=4 baseline reproduction
  status: approved
  approved_by: DEC-20261001-60369f
  approved_at: '2026-10-01'
  packaging_only: false
  approval:
    approved_by: DEC-20261001-60369f
    composing_decision: DEC-20261001-60369f
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Does NOT claim a break, factor base,
      or rho competitiveness. Structural certificate column only.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0 arithmetic + g<=4 reproduction; Stage 1 g=5,6 filtered and
      unfiltered census with sympy hit re-verification; Stage 2 nearby-object
      toy-moduli controls. No curve ECDLP runs. No Amazon Bedrock.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (A) Recompute Weil ceilings and 131-multiples (51 at g=5, 299 at g=6).
    (B) Reproduce g<=4 filtered zero and unfiltered counts 5,35,215,1645.
    (C) Run exact Rolle+Sturm census at g=5,6 filtered by 131|h(3) and
    unfiltered; match LMFDB 14325/164937 unfiltered or declare outcome C.
    (D) Re-verify every hit with sympy; emit N_r, a_r; run toy-moduli
    nearby-object controls.

  class: measurement
  class_note: >-
    Structural-certificate / enumeration measurement. Not a smoothness
    heuristic-validation CDF experiment and not a cryptanalytic cost-model.
    Measured counts stay separate from the advisory H1 runtime model.
    No exponent-moving claim.

  scope:
    included:
      - >-
        Stage 0: ceilings-and-multiples.yaml (expect 6725/51, 39201/299);
        baseline-g4-reproduction.yaml against exact_targets.json
        (0 hits; 104 and 234220 scanned; counts 5,35,215,1645);
        preregistered-predictions.yaml BEFORE Stage 1 g=5,6 claims;
        methodological-note.md (forbid numerical weil_census.py reuse).
      - >-
        Stage 1: implement exact Rolle-pruned integer-Sturm enumerator;
        unfiltered class counts at g=5,6 vs LMFDB 14325, 164937;
        filtered hits at modulus 131; sympy re-verify every hit;
        write exact_targets_g56.json (+ per-hit P,h,N_r,a_r);
        ambiguous-near-boundary count must be reported.
      - >-
        Stage 2: nearby-object controls — modulus 5 at g=1 (must find
        5-point class); modulus 1 returns all classes; toy moduli from
        IDEA-20260926-80209d at g<=3 where hand answers exist.
    excluded:
      - Any scientific ECDLP / GHS / decomposition attack at n >= 131
      - Reusing numerical analysis/couveignes-lercier-131/weil_census.py
      - Claiming a Jacobian from a_r >= 0 alone
      - Claiming transfer to dimension >=7
      - AUXIN edits
      - Amazon Bedrock
      - Claiming a break or any curve's attack cost
      - Treating timeout as outcome A (exclusion)

  inputs:
    proposal: ledger/proposals/IDEA-20260926-5c26f9.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-944a66.yaml
    open_problem: knowledge/open-problems/KN-OPEN-095df5.md
    baseline_script: analysis/couveignes-lercier-131/exact_targets.py
    baseline_json: analysis/couveignes-lercier-131/exact_targets.json
    numerical_census_json: analysis/couveignes-lercier-131/census.json
    related:
      - ledger/proposals/IDEA-20260926-6f2601.yaml
      - ledger/proposals/IDEA-20260926-80209d.yaml
      - ledger/proposals/IDEA-20260918-9abf42.yaml
    cells:
      Stage0-arithmetic:
        ceilings_g5_g6: [6725, 39201]
        multiples_g5_g6: [51, 299]
      Stage0-baseline:
        max_dim: 4
        expected_hits: 0
        expected_scanned_g3: 104
        expected_scanned_g4: 234220
        expected_unfiltered: [5, 35, 215, 1645]
      Stage1-census:
        dimensions: [5, 6]
        modulus: 131
        expected_unfiltered_lmfdb: [14325, 164937]
      Stage2-controls:
        mod5_g1: must_find_5_point_class
        mod1: hits_equal_unfiltered
        toy_moduli: [17, 19, 23, 29, 31, 37, 41]

  controls:
    - name: g4_baseline_reproduction
      object: >-
        Filtered zero and unfiltered counts at g<=4 must match
        exact_targets.json / LMFDB 1645 before g=5,6 claims.
    - name: lmfdb_completeness
      object: >-
        Unfiltered enumerator counts must equal 14325 (g=5) and 164937 (g=6).
    - name: dual_box_test
      object: >-
        Integer Sturm and sympy count_roots agree on every hit and on a
        random sample of >=10^4 pruned nodes.
    - name: null_modulus
      object: >-
        Modulus 5 at g=1 finds the 5-point class; modulus 1 returns all.
    - name: toy_ladder
      object: IDEA-20260926-80209d toy moduli at g<=3 with hand-derived answers.
    - name: no_numerical_census
      object: weil_census.py must not be imported or reused.
    - name: certificate_kind_vocabulary
      object: >-
        Every run manifest result.certificate.kind is one of
        discrete_log | decomposition | key_recovery | none.
    - name: no_break_guard
      object: No break / attack-cost / Jacobian-sufficiency claim.

  independent_variables:
    - dimension_g
    - modulus
    - filtered  # true = 131|h(3); false = unfiltered class count
    - box_test_impl  # integer_sturm | sympy

  metrics:
    primary:
      - unfiltered_class_count_per_g
      - filtered_hit_count_per_g
      - ambiguous_near_boundary_count
      - multiples_below_ceiling_g5
      - multiples_below_ceiling_g6
      - baseline_g4_hit_count
    secondary:
      - exact_tests_performed
      - rolle_survivors_per_level
      - wall_s
      - peak_rss_bytes
      - sympy_hit_agreement
      - place_count_a_r_nonneg_flags
      - termination_reason

  heuristic_under_test:
    - HEUR-BINSTD-944a66-H0
    - HEUR-BINSTD-944a66-H1

  preregistered_prediction:
    quantity: >-
      (A) Multiples of 131 below ceilings: exactly 51 (g=5), 299 (g=6).
      (B) Unfiltered class counts: exactly 5,35,215,1645,14325,164937.
      (C) Hit count at g=5,6: NO DIRECTION PREDICTED (zero and small
      positive both live).
      (D) ambiguous-near-boundary: exactly 0.
    formula: >-
      Ceiling(g) = 2 a_g - 1 with a_g from (3+2√2)^g + (3-2√2)^g = 2 a_g;
      #targets = floor(Ceiling/131); unfiltered count = |{h real-rooted
      in box}|; filtered = those with h(3)≡0 (mod 131).
    source: >-
      IDEA-20260926-5c26f9 arithmetic and LMFDB retrieval; KN-OPEN-095df5
      g<=4 baseline; H-BINSTD-944a66.
    claim_tier: observational
    measured_vs_modeled: >-
      Class counts, hit lists, ambiguous flags, exact-test counts, wall_s,
      and peak_rss are MEASURED. HEUR-H1 runtime (~minutes g=5, hours g=6)
      is a MODELED prior and is never written into a measured column as if
      observed. Timeout is infrastructure, not a measured exclusion.

  scale_relevance:
    tier: medium
    justification: >-
      Enumeration up to abelian-variety dimension 6 over F_2 — the LMFDB-
      complete range. Not a curve attack at n=131; contribution is a
      structural certificate column for Couveignes–Lercier existence.
    correspondence: >-
      Direct enumeration of Weil polynomials (Honda–Tate over F_2);
      no Deuring sampling correspondence required.

  tail_checks:
    - Smoothest / extremal hit (if any) re-checked by sympy independently.
    - If filtered hits > ~100 at g=6, re-check box test before believing B.
    - Any ambiguous-near-boundary > 0 forces outcome C (widen brackets).
    - Rolle survivor count at level g-1 compared to class count at g-1 (H1).

  replication:
    seeds: []
    independent_instances: >-
      Deterministic enumeration (seed-free). Dual implementation agreement
      (integer Sturm vs sympy) is the replication stand-in. Toy-moduli
      Stage 2 is an independent nearby-object replication of the instrument.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 86400
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 12
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete when ceilings, baseline reproduction, predictions, and methodological note are written.
    - Stage 1 complete when unfiltered counts at g=5,6 and filtered hit lists (possibly empty) are written with ambiguous count and sympy agreement flags — OR infrastructure failure recorded.
    - Stage 2 complete when nearby-object control results are written.
    - Advisory wall-clock: checkpoint and report; never fabricate exclusion.

  invalidation_rules:
    - Claiming outcome A with LMFDB count mismatch or ambiguous>0
    - Importing or calling numerical weil_census.py
    - timeout/crash/OOM → failed_infrastructure, not negative math evidence
    - Amazon Bedrock invocation attempted → abort
    - certificate.kind outside vocabulary → invalid run
    - Upgrading a_r>=0 to "is a Jacobian" in any artifact → protocol violation

  success_criterion: >-
    Stage 0: ceilings 51/299 and g<=4 baseline match committed.
    Stage 1: unfiltered g=5,6 counts reported vs LMFDB; filtered hit list
    (possibly empty) with sympy agreement; ambiguous count reported —
    deciding A, B, or C from predefined rules.
    Stage 2: nearby-object controls written.
    Decidable without attack runs.

  falsification_criterion: >-
    Multiples ≠ 51/299; OR g<=4 baseline mismatch; OR unfiltered counts
    mismatch without recovery; OR sympy disagrees on a reported hit.
    Timeout is NOT falsification of exclusion.

  required_artifacts:
    - experiments/EXP-BINSTD-842864/stage0/ceilings-and-multiples.yaml
    - experiments/EXP-BINSTD-842864/stage0/baseline-g4-reproduction.yaml
    - experiments/EXP-BINSTD-842864/stage0/preregistered-predictions.yaml
    - experiments/EXP-BINSTD-842864/stage0/methodological-note.md
    - experiments/EXP-BINSTD-842864/stage1/exact_targets_g56.json
    - experiments/EXP-BINSTD-842864/stage1/unfiltered-counts.yaml
    - experiments/EXP-BINSTD-842864/stage1/filtered-hits.yaml
    - experiments/EXP-BINSTD-842864/stage1/sympy-reverification.yaml
    - experiments/EXP-BINSTD-842864/stage2/nearby-object-controls.yaml
    - experiments/EXP-BINSTD-842864/runs/*/manifest.yaml
    - experiments/EXP-BINSTD-842864/runs/*/raw-result.json
    - experiments/EXP-BINSTD-842864/runs/*/stdout.log

  procedure:
    stage0:
      - Recompute a_g ceilings and 131-multiples; write ceilings-and-multiples.yaml.
      - Run / re-verify g<=4 via exact_targets.py or new enumerator --max-dim 4; write baseline-g4-reproduction.yaml.
      - Write preregistered-predictions.yaml BEFORE g=5,6 filtered claims.
      - Write methodological-note.md forbidding numerical weil_census.py.
    stage1:
      - Implement exact_targets_g56.py (integer Sturm, Rolle DFS, congruence pin).
      - Run unfiltered census at g=5,6; compare to 14325, 164937.
      - Run filtered census modulus 131; record hits with P,h,N_r,a_r.
      - Sympy-reverify every hit and sample pruned nodes; write sympy-reverification.yaml.
      - If ambiguous>0 or count mismatch → label outcome C; do not claim A.
    stage2:
      - Modulus 5 at g=1; modulus 1 identity; toy moduli ladder controls.
      - Write nearby-object-controls.yaml.

  optimistic_assumptions:
    - assumption: >-
        HEUR-H1 survivor counts stay within 10× of class counts so g=6
        finishes in hours on one core
      bias_direction: >-
        Underestimates wall-clock if pruning is weaker; mitigated by
        advisory budget + amendment path for cheap filters — never by
        claiming A on timeout
    - assumption: >-
        LMFDB header counts quoted in IDEA-20260926-5c26f9 are exact
      bias_direction: >-
        A transcription error would look like enumerator incompleteness;
        re-fetch before blaming the instrument (IDEA confounder)

  memory_accounting: >-
    Dominant structure is recursion depth <=6 plus hit list and optional
    survivor counters. Expected peak RSS well under 1 GiB; report measured
    peak_rss_bytes. No attack-scale table memory.

  assigned_to: executor
  dominated_by: >-
    Matched rho on ECC2K-130 / standardized binary rows; this experiment
    is a certificate column, not an attack-cost improvement.
  sota_delta:
    time: Zero exponent; deterministic census only.
    memory: Unchanged for attack surfaces.
    data_queries: N/A; extends KN-OPEN-095df5 exclusion or produces candidates.
  impediments_declared:
    - id: IMP-H1-runtime-g6
      what_is_blocked: >-
        Completion of g=6 unfiltered/filtered census within advisory
        single-core hours if HEUR-H1 underestimates survivors
      condition: >-
        Level-(g-1) survivor count or wall-clock projects >10× estimate
      clears_when: >-
        Cheap necessary filters added via protocol_amendment, OR parallel
        a_1 split authorized, OR longer advisory wall-clock accepted
      recheck: >-
        Inspect stage1 survivor-per-level counters; compare to 10×14325
      asserts_nothing_about: >-
        Mathematical emptiness at g=5,6; timeout ≠ exclusion
