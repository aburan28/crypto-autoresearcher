  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-39f596 under the standing 2026-09-06
    user authorization. Stage 0 is the exact
    split/inert Gauss-norm calibrator.
    Coppersmith, Semaev S_m, Velu, and the
    yield ratio k are later stages and are
    not run here.

  objective: >
    Evaluate the exact integer identity
    that a split-prime Gauss-norm table
    is well-defined and that the same
    construction rejects an inert prime,
    on one frozen family (REAL, KF,
    NULL) in Z[i], and decide whether
    the residue-norm calibrator works.
    Stage 0 does not run Coppersmith
    and does not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL p=13
      shortest-lift norms equal
      [0, 1, 4, 4, 2, 1, 2, 2, 1, 2,
      4, 4, 1]; KF inert p=7 is
      rejected; NULL empty residue
      list rejected; p=0 rejected.
      Certificate kind none.
    formula: >
      Ring Z[i]. A rational prime p
      splits iff p ≡ 1 (mod 4). For
      split p=13, π = 2+3i and the
      π-lattice is Z(2,3)+Z(-3,2).
      The shortest lift of residue x
      is a minimum-norm vector in
      the coset (x,0) + lattice.
      Frozen REAL norms for x=0..12
      are [0, 1, 4, 4, 2, 1, 2, 2,
      1, 2, 4, 4, 1], with one
      shortest-vector representative
      family
      (0,0),(1,0),(2,0),(0,2),
      (-1,-1),(0,-1),(1,-1),(-1,1),
      (0,1),(1,1),(0,-2),(-2,0),
      (-1,0). Frozen KF: p=7 ≡ 3
      (mod 4) is inert and the
      split construction is
      rejected. NULL is the empty
      residue list. Invalid is p=0.
      FORCED Stage 0: fixture_pass,
      real_norm_pass,
      known_false_inert_pass,
      reject_invalid_pass,
      null_empty_pass all true.
    source: >
      ledger/proposals/IDEA-20260906-09b937.yaml
      quadratic-order residue
      representation as Stage 0
      hard-gate identity on frozen
      toys. Provenance internal;
      read in this design session.

  design_tightening_stage0_is_instrument_not_audit: >
    IDEA-20260906-09b937 Stage 0 here is
    a disclosed tightening: the
    split/inert Gauss-norm calibrator
    only, not the proposal's
    Coppersmith / E1-01 eps-hat, not
    Semaev S_m, not a yield ratio k,
    not a 1D-versus-2D comparison.
    Exact integer identities are the
    only Stage 0 arm.

  inputs:
    fixture:
      ring: Z[i]
      real_split:
        id: REAL
        kind: split
        p: 13
        p_mod_4: 1
        pi: [2, 3]
        lattice_basis: [[2, 3], [-3, 2]]
        must_norms: [0, 1, 4, 4, 2, 1, 2, 2, 1, 2, 4, 4, 1]
        role: real_split_gauss
      known_false:
        id: KF
        kind: inert
        p: 7
        p_mod_4: 3
        must_reject: true
        role: known_false_inert
      matched_null:
        id: NULL
        kind: empty_residues
        must_reject: true
        role: matched_null_empty_residues
      invalid:
        - id: p-zero
          p: 0
          must_reject: true
      working_model: >
        Exact split/inert Gauss-norm
        calibrator in Z[i].
        Not Coppersmith. Not Semaev
        S_m. Not Velu. Not a yield
        ratio k. Not elliptic M_S.
        Not an (L,b) meter. Not an
        Aut census. Not an orbit
        cost. Not a 1D-versus-2D
        eps-hat comparison. Not a
        rho beat.
      do_not_run_coppersmith: true
      do_not_form_semaev: true
      do_not_run_velu: true
      do_not_claim_yield_k: true
      do_not_form_elliptic_ms: true
      do_not_run_lb_meter: true
      do_not_enumerate_aut: true
      do_not_cost_orbit: true
      do_not_compare_eps_hat: true

  independent_variables:
    - object in the frozen family
    - whether p splits in Z[i]
    - whether p is the frozen positive prime

  null_object:
    name: empty residue list at frozen ring
    construction: >
      Replace the residue list by
      the empty set. The Gauss-norm
      table is not read. This is
      the nearby-object control
      with the residue term
      removed.
    non_degeneracy_check: >
      known_false_inert_pass must
      be true before any REAL
      identity is read as a
      measurement.
    dynamic_range_demonstration: >
      p=0 must be rejected before
      an identity is read as a
      census.

  controls:
    - KF inert p=7 rejection (known-false / proves-too-much)
    - REAL split p=13 frozen 13-tuple of norms
    - NULL empty-residue rejection of collapse
    - p=0 rejection
    - exact integer arithmetic, no floats
    - ring frozen before any Coppersmith solve is run

  metrics:
    primary:
      - fixture_pass boolean
      - real_norm_pass boolean
      - known_false_inert_pass boolean
      - reject_invalid_pass boolean
      - null_empty_pass boolean
    secondary:
      - REAL norms
      - REAL shortest-vector representatives
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      Frozen Gauss-norm identity at
      p=13 and inert reject at p=7.
      No transfer to Coppersmith,
      Semaev S_m, a yield ratio, or
      cryptographic p.
    correspondence: null

  tail_checks:
    - REAL norms equal the frozen 13-tuple
    - KF inert p=7 is rejected
    - NULL empty residue list is rejected
    - p=0 is rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      real_norm_pass,
      known_false_inert_pass,
      reject_invalid_pass, and
      null_empty_pass. A miss classifies
      the run failed_infrastructure if it is
      a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-QRESIDUE.
    - Stages 1 and later are not authorized.
    - Do not run Coppersmith.
    - Do not form Semaev S_m.
    - Do not run Velu.
    - Do not claim a yield ratio k.
    - Do not form elliptic M_S.
    - Do not run an (L,b) meter.
    - Do not enumerate Aut.
    - Do not cost an orbit.
    - Do not compare 1D-versus-2D eps-hat.
    - Do not identify a rho cost.
    - No attack is run. Certificate kind none.

