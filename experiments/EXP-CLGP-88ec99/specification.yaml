experiment:
  id: EXP-CLGP-88ec99
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-e9d57c
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE ONE BRIDGE THAT IS NOT CONSTANT, EXHIBITED AND PRICED TO ZERO: on a curve whose target
    subgroup is cyclic of order ell^e the kernel-ideal bridge DOES vary with k -- it returns an ideal
    of norm ell^{e - v} where v = v_ell(k) -- so the class group really does learn something about
    the discrete logarithm; the leaked quantity is exactly v_ell(k), which Pohlig-Hellman already
    yields free in O(e) group operations, so the bridge is real, computable, non-constant and worth
    precisely nothing, and it serves as the batch''s natural (non-synthetic) positive control'
  status: draft
  objective: "(A) WHY THIS RECORD EXISTS. A closure whose obstruction is \"the bridge is constant\"\
    \ (IDEA-20260807-5d7606, OBS-1) is only as good as its demonstration that the bridge CAN be non-constant.\
    \ Otherwise the argument might be proving something vacuous -- \"curves are not points\" -- rather\
    \ than something about primality. This record supplies the nearby object on which the obstruction\
    \ fails, computes exactly what it leaks, and prices that leak against the incumbent. It is the\
    \ batch's non-synthetic positive control, and it is also a small self-contained result.\n(B) THE\
    \ CONSTRUCTION. Let E/F_p be ordinary with End_{F_p}(E) = O, and let G = <P> be CYCLIC of order\
    \ N = ell^e for a small prime ell, with Q = [k]P. Then\n    <Q> = <[k]P> has order ell^{e - v},\
    \  where v = min(v_ell(k), e),\nso the subgroup generated by the target now DEPENDS on k -- through\
    \ v and only through v. The Deuring kernel-ideal correspondence assigns to it an ideal a_v of\
    \ norm ell^{e-v}, and the quotient curve\n    E_v := E/<Q> = [a_v]^{-1} * E\nis a curve in the\
    \ isogeny class whose class-group coordinate is [a_v]^{-1}. So the composite point-to-curve-to-class-group\
    \ bridge\n    beta : Q |-> [a_{<Q>}] in Cl(O)\ntakes e + 1 distinct values as k ranges over Z/ell^e,\
    \ one for each v in {0, 1, ..., e}. THE BRIDGE IS NON-CONSTANT. OBS-1 fails here exactly as predicted,\
    \ and the reason is visible: the subgroup lattice of a cyclic ell^e group is a CHAIN with e +\
    \ 1 elements, whereas for prime order it has two, only one of which is nonzero.\n(C) THE EXACT\
    \ LEAK, AND ITS EXACT PRICE. Applying a vectorization oracle to (E, E_v) returns [a_v], whose\
    \ norm reveals ell^{e - v} and hence v = v_ell(k). That is log2(e + 1) bits, and it is ALL the\
    \ bridge carries: the fibres of beta are the sets {k : v_ell(k) = v}, of sizes (ell - 1) ell^{e\
    \ - v - 1}, so beta is exactly the v_ell projection and nothing more. THE PRICE OF THE SAME INFORMATION\
    \ BY THE INCUMBENT: compute [ell^j] Q for j = 0, 1, ..., e and take the first j with [ell^j] Q\
    \ = O. That is at most e scalar multiplications by ell, i.e. O(e log ell) group operations --\
    \ and it is a strict subroutine of Pohlig-Hellman, which on a group of order ell^e solves the\
    \ ENTIRE discrete logarithm in O(e sqrt(ell)) group operations. So the bridge delivers, at the\
    \ cost of a vectorization (~sqrt(h) = p^{1/4} action evaluations), a quantity obtainable in O(e\
    \ log ell) point operations by a first-year textbook method, on a group where the whole problem\
    \ is already easy. NET: SPEEDUP FACTOR = 0. The bridge is real, computable, non-constant, and\
    \ Pareto-dominated on every axis by an entirely elementary computation.\n(D) THE STRUCTURAL LESSON,\
    \ WHICH IS THE TRANSFERABLE PART. The point-to-curve bridge's information content is exactly\n\
    \    log2 (number of distinct subgroups generated by elements of G)\n  = log2 (number of divisors\
    \ of N),\nbecause the bridge factors through <Q> and nothing else. For N prime that is log2 2\
    \ = 1 bit (zero or not), which is why OBS-1 bites. For N = ell^e it is log2(e + 1). For general\
    \ N it is log2 d(N), the divisor count. And d(N) <= N^{o(1)} for every N, so:\n    THE CANONICAL\
    \ POINT-TO-CURVE BRIDGE CARRIES AT MOST o(log N) BITS\n    ABOUT k, FOR EVERY GROUP ORDER N WHATSOEVER,\n\
    and the bits it does carry are exactly the Pohlig-Hellman valuations, which are free. This is\
    \ strictly stronger than OBS-1: it closes the canonical bridge not only for prime N but for ALL\
    \ N, with a quantitative bound (divisor function) instead of a case analysis. Cryptographic curves\
    \ have N prime or nearly so, so d(N) is 2 or a small constant, and the bound is not merely asymptotic\
    \ there -- it is 1 bit.\n(E) THE DISCRIMINATION. Three outcomes, all informative:\n  OUTCOME 1\
    \ (predicted). Measured bridge information equals log2(e + 1)\n  exactly, measured leak equals\
    \ v_ell(k) exactly, and the measured\n  vectorization cost to obtain it exceeds the Pohlig-Hellman\
    \ subroutine\n  cost by orders of magnitude. The control is calibrated, OBS-1 is shown\n  non-vacuous,\
    \ and (D) is confirmed.\n  OUTCOME 2. Measured bridge information EXCEEDS log2(e + 1). Then beta\n\
    \  does not factor through <Q> as claimed, the correspondence is being\n  mis-implemented or the\
    \ theory is wrong; either way it is a significant\n  event and halts the line for review.\n  OUTCOME\
    \ 3. The bridge measures as CONSTANT even at e >= 2. The\n  instrument cannot see a bridge, and\
    \ every constancy verdict elsewhere in\n  the batch is void."
  resource_label: 'R3 (End(E) as a ring: the kernel-ideal correspondence, ideal norms, Cl(O)) and
    R4 (the class-group action, used to identify E/<Q> by its class-group coordinate).'
  admissibility: admissible
  admissibility_argument: 'Admissible in form: the resource is the ideal structure of O, which is
    invisible to a generic group oracle, and the mechanism never applies an endomorphism to a point
    of G. But the honest verdict has a second layer, and the record states it rather than hiding it:
    the INFORMATION the resource yields (v_ell(k)) is itself generic-group computable in O(e) operations,
    so although the resource escapes the GGM, its OUTPUT does not. That is a distinction worth recording
    once and precisely -- escaping the generic group is necessary for a lane and is not sufficient,
    and this is the cleanest concrete instance of the gap in the campaign so far.'
  reachability_gate: 'T5 IS THE REASON THE PRICING COMES OUT THE WAY IT DOES, and this record is the
    batch''s clearest demonstration of the gate''s force. The bridge identifies a SPECIFIED curve
    E/<Q>, and recovering its class-group coordinate is exactly the expensive side of the T5 dichotomy:
    ~sqrt(h) = p^{1/4} action evaluations. Meanwhile the SAME information is available by a local
    test costing O(e) group operations -- the Pohlig-Hellman subroutine -- which is T5''s "locally
    detectable" case in its purest form. So this record instantiates both sides of the dichotomy on
    one instance and shows the local route winning by orders of magnitude. Anything a future L10 proposal
    wants from a global address must beat this comparison, and the comparison is measured rather than
    argued.'
  inputs:
    procedure: 'STAGE 0 (zero compute): derive the fibre sizes and the divisor bound. STAGE 1 (minutes):
      build the ell^e instance family with cyclicity verified; build the prime-order null family and
      the non-cyclic control. STAGE 2 (minutes, HARD GATE): tabulate beta against v; check the distinct-value
      count and the fibre-size histogram against the exact predictions. This gate is the cheapest
      calibration in the batch. STAGE 3 (minutes): measure I(beta ; k) with the IDEA-20260807-cb672c
      instrument, unchanged, and compare against the predicted entropy. STAGE 4 (hours): the three-cost
      pricing P1, P2, P3, with the isogeny step price measured, not assumed. STAGE 5 (minutes): the
      e-sweep decay test down to e = 1, and the general -N divisor check.'
    mechanism: "STEP 1 (toy compute). Construct the instance family: ordinary curves over small p\
      \ whose group order is divisible by ell^e for ell in {2, 3, 5} and e in {1, ..., 6}, with G\
      \ taken to be the cyclic ell^e-subgroup. Verify cyclicity explicitly -- E(F_p) can have rank\
      \ 2 at ell, and a non-cyclic G changes the subgroup lattice from a chain to a richer poset and\
      \ would change every count below. Non-cyclic instances are recorded separately, not discarded,\
      \ because they are their own interesting case.\nSTEP 2 (toy compute). For each instance and\
      \ for many k: compute <Q>, its order ell^{e-v}, the kernel ideal a_v, the quotient curve E_v,\
      \ and the class-group coordinate of E_v relative to E by exhaustive walk (toy scale makes this\
      \ exact). Tabulate beta's value against v. PREDICTED: beta takes exactly e + 1 values; beta(k)\
      \ depends on k only through v; the fibre sizes are (ell - 1) ell^{e-v-1} for v < e and 1 for\
      \ v = e.\nSTEP 3 (toy compute). Measure the information: I(beta ; k) via the instrument of IDEA-20260807-cb672c,\
      \ run unchanged. PREDICTED: exactly H(v) = -sum_v pr_v log2 pr_v with pr_v = (ell-1)/ell^{v+1}\
      \ (and the residual mass at v = e), which for ell = 2 is close to 2 bits and is ALWAYS at most\
      \ log2(e+1) and typically well below it. The record predicts the ENTROPY, not merely \"nonzero\"\
      , so the control is quantitative.\nSTEP 4 (toy compute, THE PRICING). Measure, in the same unit,\
      \ three costs on identical instances:\n  (P1) obtain v by the Pohlig-Hellman subroutine: repeated\
      \ multiplication\n       by ell until the identity. Counted in point operations.\n  (P2) obtain\
      \ v via the bridge: compute E/<Q>, then vectorize (E, E/<Q>)\n       by kangaroo on the Cayley\
      \ graph. Counted in action evaluations,\n       then converted to point-operation equivalents\
      \ by the measured\n       per-step price.\n  (P3) solve the ENTIRE discrete logarithm by Pohlig-Hellman:\n\
      \       O(e sqrt(ell)) point operations.\nPREDICTED: P1 << P3 << P2 by large margins, i.e. the\
      \ bridge is more expensive than solving the whole problem outright. Stating the prediction as\
      \ an ORDERING of three measured costs makes it falsifiable in a way a single ratio would not\
      \ be.\nSTEP 5 (toy compute, THE DECAY). Sweep e down to 1 and confirm the measured information\
      \ decays to 0 bits and the number of distinct beta values decays to 1. This is the decay test\
      \ that links this record to OBS-1: the same instrument, the same family, one parameter varied,\
      \ and the signal must vanish exactly where the theory says it does.\nSTEP 6 (zero compute).\
      \ Generalise to arbitrary N and state the divisor bound of (D). Verify at toy scale on a handful\
      \ of curves with N having several distinct prime factors, where the bridge's value count must\
      \ equal d(N)."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - prime-order family -- the same pipeline MUST report 1 value and 0 bits
  - non-cyclic G at rank 2 -- value count must match the cyclic-subgroup count, a different and computable
    number
  - e = 1 slice reproducing IDEA-20260807-5d7606's numbers exactly
  - measured isogeny-step price before any cost conversion
  - Pohlig-Hellman baseline measured, not quoted
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, and here the roles invert -- this record
    IS the positive control, so its null is the PRIME-ORDER family. Matched null of the same shape:
    identical pipeline, identical instrument, identical sample size, on curves with G of PRIME order
    (which is precisely IDEA-20260807-5d7606''s family). There the measured bridge information must
    be 0 bits at the instrument''s floor and the distinct-value count must be exactly 1. DECAY PARAMETER:
    e. Sweeping e from 6 down to 1 must drive the measured information from H(v) down to 0 and the
    value count from e+1 down to 1, continuously and monotonically. A measured information that does
    NOT decay as e -> 1 is the canonical artifact tell: it would mean the pipeline is reading something
    other than the subgroup lattice, most likely a generator leak, and every number in the batch that
    used this instrument would be void. SECOND NULL: a non-cyclic G (rank 2 at ell). The subgroup
    lattice is no longer a chain, so the predicted value count changes from e+1 to the number of cyclic
    subgroups of a rank-2 ell-group -- a different, computable prediction. Getting THAT number right
    too is a strong check that the pipeline is genuinely reading the lattice.'
  independent_variables: []
  metrics:
    primary:
    - distinct value count of beta per instance, per e
    - fibre-size histogram against predicted (ell-1) ell^{e-v-1}
    - I(beta ; k) in bits against predicted entropy
    - P1, P2, P3 in point-operation equivalents, per instance
    secondary:
    - the e-decay curve of information and value count
    - d(N) versus measured value count on the general-N check
    - h and the measured isogeny-step price per instance
  heuristic_under_test: null
  preregistered_prediction:
    quantity: number of distinct values of beta over sampled k, per instance, as a function of e
    formula: Exactly e + 1 for cyclic G of order ell^e, on 100 percent of instances. Fewer means the
      instrument is blind; more means beta does not factor through <Q> and the theory is wrong. Both
      are decisive and neither is a soft outcome.
    source: pre-registered in IDEA-20260807-e9d57c before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - NON-CYCLIC ell-TORSION. E(F_p) can have rank 2 at ell, in which case G as chosen may not be cyclic
    and the subgroup lattice is not a chain. Cyclicity is verified per instance and non-cyclic instances
    go to the control arm with their own prediction.
  - VELU COST GROWTH. Computing E/<Q> costs O(ell^{e-v}) by Velu, so P2's price depends on v and is
    cheapest exactly where the information is least. Reporting a single averaged P2 would hide this;
    P2 is reported per v.
  - SMALL h. Vectorization on a tiny class is nearly free and would make P2 look competitive for reasons
    that vanish at scale. Require h >= 100 and report h with every cost.
  - ell = 2 SPECIALS. At ell = 2 the 2-torsion structure interacts with the curve's 2-isogeny graph
    and with the twist, and 2-power subgroups behave differently from odd ones. Report ell = 2 separately
    and never pooled.
  - CONDUCTOR AND ell. If ell divides the conductor f of O, the ell-volcano has depth and the kernel
    ideal's behaviour changes (the correspondence requires ell coprime to the conductor for the crater
    statement). Choose ell coprime to f and verify per instance.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Exactly e + 1 for cyclic G of order ell^e, on 100 percent of instances. Fewer
    means the instrument is blind; more means beta does not factor through <Q> and the theory is wrong.
    Both are decisive and neither is a soft outcome.
  falsification_criterion:
  - beta takes more than e + 1 values on a cyclic ell^e instance. It does not factor through <Q>;
    the divisor bound is wrong; halt and review, because this would ALSO weaken IDEA-20260807-5d7606's
    closure and would be the most consequential outcome in the lane.
  - The prime-order null shows more than one value. Instrument or theory failure; every constancy
    claim in the batch is void until resolved.
  - Measured information does not decay to the floor as e -> 1. Artifact tell; the instrument leaks
    and the batch's nulls are void.
  - P2 measures below P3, i.e. the bridge route is cheaper than Pohlig-Hellman. Escalate for independent
    review; the pricing conclusion is withdrawn until replicated with the isogeny-step price re-measured.
  - The general-N value count differs from d(N). The (D) generalisation is false as stated and must
    be restated for the cases that hold.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-e9d57c
