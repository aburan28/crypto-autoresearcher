experiment:
  id: EXP-REP-002
  hypothesis_id: H-REP-001
  version: 1
  title: m=3 chained PDP solving degree, Edwards native (8 vars) vs Weierstrass Semaev chained.
  status: approved
  objective: Test the m>=3 leg of H-REP-001 (untested by EXP-REP-001) — does the model change d_reg at m=3?
  controls: [Weierstrass Semaev chained (the T1 baseline); non-degeneracy check (dim/vdim/planted-root) per arm]
  independent_variables: [curve model, factor-base degree d in {4,6,8}]
  metrics: {primary: [d_reg per (model,d), wall-time], secondary: [vdim=#decompositions]}
  replication: {seeds: [1,2,3], independent_instances: 3}
  budget: {wall_clock_seconds_per_run: 150, maximum_runs: 60}
  success_criterion: Edwards m=3 d_reg strictly below Weierstrass Semaev m=3 at matched d.
  falsification_criterion: Edwards and Weierstrass Semaev d_reg equal at every d (model-invariant at m=3).
  required_artifacts: [runs/<id>/manifest.yaml, raw.json, stderr.txt, analysis.md]
  assigned_to: executor
  approved_by: coordinator
