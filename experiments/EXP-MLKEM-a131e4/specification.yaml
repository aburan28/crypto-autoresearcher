experiment:
  id: EXP-MLKEM-a131e4
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-MLKEM-0c0a6e
  question_id: RQ-MLKEM-003
  goal_id: GOAL-MLKEM-004
  source_idea: IDEA-20260805-5a4409
  assigned_to: executor

  title: >-
    Parseval energy budget of the dual-FFT distinguisher in MATZOV's own
    geometry: forced-value audit of the across-candidate second moment, with a
    matched null whose value is derived pre-run and a graded positive control of
    forced slope 1

  authority_note: >-
    THIS CONTRACT IS NOT APPROVED, NOT FROZEN, AND AUTHORIZES NOTHING. Only the
    Coordinator may approve an experiment (AGENTS.md rule 1) and no `approved_by`
    field is present. GOAL-MLKEM-004 is `closed_at_budget` with `next_action:
    NONE`, and DEC-20260805-0b3e11 NA-1 records that opening a successor "is a
    user decision and is not taken here". This contract is written so that such a
    decision, if taken, has a costed first batch to point at. It does not take
    it, does not reopen the goal, and proposes no status change to any record.
    The open dispute in CORR-20260805-527ffc about which decision closed
    GOAL-MLKEM-004 is untouched and unadjudicated here.

  objective: >-
    Decide, at toy dimensions and inside MATZOV's own (k_lat, k_enum, k_fft)
    geometry, whether the across-candidate SECOND MOMENT of the dual-FFT
    distinguisher's score vector departs from the value MATZOV.Nf's independence
    structure forces, and express any departure as the signed correction
    N_required = N_Nf * (1 + delta) with delta measured. The exact energy identity
    sum_{s'}|That(s')|^2 = D * sum_u |T[u]|^2 makes the forced value computable
    before any data are taken, which is what separates this contract from the six
    batches of GOAL-MLKEM-004 in which the forcing of the observable was
    established only by reviewers, after the fact.

  what_this_is_not:
    - Not an attack on ML-KEM, on LWE, or on anything. No attack is implemented or run.
    - Not a break, a speedup, a cost reduction, or an exponent claim of any kind.
    - Not a statement about FIPS 203 parameter sets, in either direction. Toy scale throughout.
    - Not a test of the independence heuristic. It tests one moment of it; the maximum of dependent scores is measured and explicitly not settled.
    - Not a validation or refutation of MATZOV 2022, Guo-Johansson, Ducas-Pulles, or Carrier et al. None of those papers has been read.
    - Not a re-opening of GOAL-MLKEM-004, not an adjudication of CORR-20260805-527ffc, and not a status change to EV-MLKEM-015 or any other record (rule 12 remains UNMET and UNWAIVED).
    - Not an approval, a freeze, an execution authorization, a run, an observation, or evidence.
    - Not a comparison against any archived number of GOAL-MLKEM-004: the geometry differs deliberately, so cross-batch comparison is FORBIDDEN by this contract rather than caveated.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: at sieved dual dimensions d' = m + k_lat in {40, 50, 60}, moduli
      q in {127, 257}, FFT block k_fft in {2, 3, 4} with k_enum = 0, one sieve
      algorithm (g6k bgj1) on one instrument lineage (KN-TECH-14efa5), at least
      three independent instances per cell, the measured value and sign of
      delta = (C - C_forced)/N, and the corresponding factor (1 + delta) on
      MATZOV.Nf's sample count -- stated as a property of the tested cells and of
      the pinned estimator, with the maximum-of-dependent-scores question
      unresolved. A run cannot support any statement about ML-KEM's security
      categories, about FIPS 203 dimensions, about whether the dual attack beats
      the primal attack (KN-OPEN-016), or about the independence heuristic as a
      whole.

  inputs:
    lwe_family:
      convention: "row: A in Z_q^{m x n}, b = A s + e mod q"
      m_values: [30, 35, 40]
      n_rule: "n = k_lat + k_fft with k_lat chosen so that d' = m + k_lat is in {40, 50, 60}"
      q_values: [127, 257]
      secret_distribution: "centred binomial, eta = 2"
      error_distribution: "rounded Gaussian, sigma = 2"
      family_rationale: >-
        Deliberately the same instance family as GOAL-MLKEM-004's archived
        instances (m = 35, n = 25, q = 127, centred binomial eta = 2, rounded
        Gaussian sigma = 2, read from that campaign's vectors.json parameters
        block), so that the ONLY intentional difference is the sieved lattice.
        This is a design property, not a licence to compare numbers across the
        two.
    split:
      k_enum: 0
      k_fft_values: [2, 3, 4]
      k_lat_rule: "k_lat = n - k_fft"
      beta_sieve_rule: "beta_sieve = d' = m + k_lat, so deltaf(beta_bkz)'s exponent is 0"
      admissibility_precheck: >-
        Before any sieve, re-run the unmodified exhaustive enumeration over all
        (k_enum, k_fft) with k_enum + k_fft <= n that
        BATCH-f75059's compare.py performs, and require the admissible set to
        contain exactly the intended tuple. Empty set => the cell is void.
    fft:
      p_rule: >-
        For each cell, p is chosen as the smallest integer >= 2 such that
        D = p^{k_fft} realises the target load factor lambda = N/D in
        {0.25, 1, 4, 16}, with N the pool size. At least one cell per q uses a p
        DIVIDING q, so that the rounding is exact and HEUR-PAR-4's arm exists.
      binning: "u_i = round(p * w_i / q) mod p componentwise, w_i = A_fft^T x_i mod q taken in [0,q)"
      table: "T[u] = sum_{i : u_i = u} exp(2 pi i z_i / q), z_i = (x_i . b) mod q in [0,q)"
    pool:
      target_sizes_N: [4096, 16384]
      sieve: "g6k bgj1 on the dual basis [[I_m, A_lat],[0, q I_{k_lat}]] after LLL"
      certificate: >-
        y_lat = A_lat^T x mod q re-verified for every emitted vector by integer
        arithmetic computed independently of g6k, as BATCH-d2a728 did. Reported
        as checked_entries and violating_entries. Any violating entry voids the
        cell.
    controls_parameters:
      null_draws_per_cell: 16
      duplication_fractions: [0.0, 0.02, 0.05, 0.10, 0.20]
      load_factor_ladder: [0.25, 1, 4, 16]
      instances_per_cell: 3
      coherent_neighbourhood: >-
        Declared here and not tuned: the set of s' in Z_p^{k_fft} whose
        componentwise offset from the bin representative of s_fft is at most 1 in
        each coordinate (a closed 3^{k_fft} box).
    archived_positive_control_substrate:
      path: coordination/goals/GOAL-MLKEM-004/batches/BATCH-f75059/tasks/TASK-20260803-5f11b7/vectors.json
      contents_as_opened: >-
        Opened during contract drafting: keys task, batch, goal, note,
        parameters, A, secret, e_batch1_realisation, candidates, certificate, x,
        y; x has shape 17919 x 35 and y 17919 x 25; parameters record m = 35,
        n = 25, d = 60, q = 127, sieve bgj1, n_vectors 17919, and a full seed
        block. The file is READ-ONLY input; it is never modified.
      use: >-
        PC-1 only. Its geometry is the full-dual one, so no comparison against
        MATZOV.Nf is made from it and no number from it enters any headline.
    seeds:
      master_seed: 20260805
      domain: "EXP-MLKEM-a131e4/v1"
      derivation_rule: >-
        Every random draw uses seed = int.from_bytes(SHA256(ASCII(domain || "|"
        || label || "|" || decimal(cell_index) || "|" || decimal(counter))),
        "big"), where label is one of: instance, secret, error, sieve, null_u,
        null_phase, duplicate, rowperm, nonsieve, bkz. Counters advance by one
        per draw within a label and are recorded. numpy Generator is constructed
        as numpy.random.default_rng(seed mod 2**63). A third party reproduces
        every instance bit-for-bit from (master_seed, domain, label, cell_index,
        counter) alone.
      declared_before_execution: true
    instrument:
      required: "passagemath/Sage + fpylll + g6k per KN-TECH-14efa5"
      availability_as_measured_during_drafting: >-
        numpy 2.4.6 imports in this container's base interpreter; `import
        fpylll`, `import g6k` and `import estimator` all fail with
        ModuleNotFoundError. Recorded as a fact of the drafting environment. Every
        sieve stage is therefore an infrastructure request under AGENTS.md rule 3
        and MUST rebuild and verify the instrument, recording the rebuild in the
        receipt.
      estimator: >-
        lattice-estimator pinned at commit
        3e48ef421ec256afddb3e7d2249a77eab6e9ba12, run Sage-free through
        tools/sage_free_estimator/shim, with
        tools/sage_free_estimator/known_answer_control.py re-passed at exact
        equality (delta 0.0) BEFORE any Nf value is used.

  independent_variables:
    - sieved dual dimension d' = m + k_lat in {40, 50, 60}
    - FFT block size k_fft in {2, 3, 4}
    - load factor lambda = N/D in {0.25, 1, 4, 16}
    - modulus q in {127, 257}, including one p | q cell per q
    - arm in {real_sieve, null_u, duplicate_f, rowperm, nonsieve_bkz, nonsieve_random, archived_full_dual}

  arms_and_controls:
    treatment: >-
      REAL. The certified g6k bgj1 pool on the (m + k_lat)-dimensional dual
      lattice. delta computed per assumption set (1)-(9) of H-MLKEM-0c0a6e.
    measured_null: >-
      NULL-U, the matched null of the right shape, with its forced value derived
      before the run. u_i drawn iid uniform on Z_p^{k_fft}; phases
      z_i = u_i . s_fft + xi_i mod q with xi_i resampled WITH REPLACEMENT from the
      measured real-arm residual phase multiset {y_lat,i . s_lat + x_i . e mod q}.
      Identical N, D, p, q, identical scoring code, identical estimator.
      FORCED VALUE: E[delta_null] = 0 exactly, because the model's structure holds
      by construction. Band: |mean delta_null| <= 2 * sd_pred(delta_null) with
      sd_pred from HEUR-PAR-2 evaluated at the cell's own (N, D, abar).
      IT CAN FAIL: skirt leakage or rounding dependence would move it, and that
      failure is a finding about the MODEL and is pre-registered as such.
      This is the control DEC-20260805-0b3e11 records as absent from all six
      batches of GOAL-MLKEM-004 (C2 clause d).
    positive_control_graded: >-
      PC-2, and the effect MUST appear. From a base pool of distinct vectors,
      build pools in which a fraction f of entries are exact duplicates of other
      entries, f in {0, 0.02, 0.05, 0.10, 0.20}. FORCED VALUE delta = f EXACTLY:
      an exact duplicate pair shares bin and phase and contributes cos(0) = 1 in
      both orders, adding exactly f*N to C. Acceptance: least-squares slope of
      measured delta on f inside [0.8, 1.2], monotone non-decreasing across all
      five points, and the f = 0 point inside NULL-U's band. IF PC-2 DOES NOT
      FIRE, THE INSTRUMENT IS BROKEN AND NO NEGATIVE RESULT MAY BE REPORTED FROM
      ANY ARM OF THIS EXPERIMENT.
    positive_control_free: >-
      PC-1, on the archived full-dual pool. There every y coordinate is short by
      construction, so the bins collapse and delta must be LARGE AND POSITIVE.
      Zero new compute, numpy only, no sieve. If delta is small there the
      estimator is wrong and stages 2 to 4 are not authorized.
    separating_control: >-
      ROWPERM. Keep the real pool's bin occupancy EXACTLY and destroy only the
      pairing between bin and phase, by permuting the phase multiset across
      vectors. Forced consequence: any delta carried purely by occupancy survives;
      any delta carried by bin/phase alignment does not. This is the arm that
      distinguishes the two causes a non-zero delta could have, and it is
      REQUIRED, not optional -- the batch-6 red team reached the same
      decomposition by ablation and this contract runs it by construction.
    nearby_object_control: >-
      NON-SIEVE families at MATCHED NORMS: (a) LLL/BKZ basis rows of the same
      dual lattice, (b) random lattice points of matched norm distribution.
      Batch 4 of GOAL-MLKEM-004 found a valid non-sieve BKZ family separating at
      5.4311 against the sieve's 1.2704 on that campaign's observable, and a
      family not in the lattice at all separating at 12.1507 (EV-MLKEM-ba6c25).
      If |delta_sieve - delta_nonsieve| is below 3 sd_pred, the headline must
      state that delta is not a property of sieve output.
    ordering_control: >-
      The null arm is generated, measured, hashed and COMMITTED before the real
      arm's delta is computed, and the frozen decision rule is executed on NULL-U
      and on PC-2 with the labels written to disk first. Absence of that
      commitment makes the package invalid_measurement. If the rule assigns the
      same label to NULL-U and to PC-2 at f = 0.20 it discriminates nothing and
      must be rewritten before the real arm is read.
    known_answer_controls:
      - "Parseval residual < 1e-12 on EVERY arm of EVERY cell (identity; can fail only through implementation error)"
      - "C computed by bin accumulation equals C computed by explicit pair enumeration, at one small cell, to 1e-12"
      - "Degenerate table: a pool with all vectors in one bin and identical phase gives C = N(N-1) exactly"
      - "Nf(beta_bkz=45) == Nf(beta_bkz=300) when beta_sieve = m + k_lat (reproduces BATCH-f75059 KA-5)"
      - "Nf independent of p when k_fft = 0 (reproduces BATCH-f75059 KA-3)"
      - "tools/sage_free_estimator/known_answer_control.py passes at exact equality before any Nf value is used"
    comparability_policy: >-
      CROSS-BATCH COMPARISON IS FORBIDDEN. No statistic from this experiment may
      be compared against any archived number of BATCH-d2a728, BATCH-f75059,
      BATCH-c45baf, BATCH-d3a45a, BATCH-a2bb63 or BATCH-4bc9bc. The sieved lattice
      differs by construction, so a shared parameter name does not imply a shared
      object. The only permitted use of archived material is PC-1, whose output is
      an instrument check and never a comparand. A comparison across the two
      geometries may be made only by a separately registered comparator contract
      naming both designs, both vector families, the statistic, the expected
      relation and the failure disposition.

  metrics:
    primary:
      - id: M1
        name: parseval_residual
        definition: "|sum_{s'}|That(s')|^2 / D - sum_u |T[u]|^2| / sum_u |T[u]|^2"
        per: "arm x cell"
      - id: M2
        name: delta
        definition: "(C - C_forced)/N, C = sum_u |T[u]|^2 - N, C_forced = (N^2 abar^2 - N)/D, abar measured on the pool"
        per: "arm x cell x instance"
      - id: M3
        name: delta_excised
        definition: "M2 recomputed with the declared coherent neighbourhood of s_fft removed from the energy budget"
        per: "arm x cell x instance"
      - id: M4
        name: nf_correction_bits
        definition: "log2(1 + delta), the signed correction to MATZOV.Nf's sample count implied by (IV)"
        per: "arm x cell"
    secondary:
      - id: M5
        name: sd_pred_delta
        definition: "closed-form HEUR-PAR-2 standard deviation, computed at the cell's own (N, D, abar) BEFORE the real arm is read"
      - id: M6
        name: sd_emp_delta_null
        definition: "empirical sd of delta over the 16 NULL-U draws; compared against M5 as HEUR-PAR-2's own test"
      - id: M7
        name: occupancy_chi2
        definition: "chi-square of the bin occupancy against multinomial(N, uniform on D bins), reported separately from delta"
      - id: M8
        name: skirt_energy
        definition: "(energy in the declared coherent neighbourhood minus |That(s_fft)|^2)/N, against Nf's exp(k_fft/3 (sigma_s pi/p)^2)"
      - id: M9
        name: d_eff
        definition: "exp(max over wrong candidates of score^2 / (N (1 + delta))); the residual the energy identity does NOT determine"
      - id: M10
        name: argmax_correct_fraction
        definition: "fraction of instances in which the correct candidate is the argmax over the k_fft block (regime check)"
      - id: M11
        name: certificate_counts
        definition: "checked_entries and violating_entries of the dual-membership certificate, per cell"
      - id: M12
        name: measured_vs_predicted_length
        definition: "mean ||(x, y_lat)||^2 against Nf's lsigma_s^2, per cell; reported, no target asserted"

  heuristic_under_test: HEUR-PAR-2

  preregistered_prediction:
    quantity: >-
      The collision energy C of the dual-FFT table, and through it the departure
      delta of the across-candidate second moment from the value MATZOV.Nf's
      independence structure forces.
    formula: >-
      sum_{s' in Z_p^{k_fft}} |That(s')|^2 = D * sum_u |T[u]|^2   (character
      orthogonality, exact);  sum_u |T[u]|^2 = N + C;
      C_forced = (N^2 abar^2 - N)/D   (the model's own two-term energy split);
      delta = (C - C_forced)/N;   N_required = N_Nf * (1 + delta);
      sd_pred(delta) = sqrt(2 * (N(N-1)/D) * (1 - abar^4)/2) / N   (HEUR-PAR-2,
      leading order).
      FORCED VALUES FIXED BEFORE ANY RUN: delta_null = 0 exactly;
      delta_duplicate(f) = f exactly; degenerate one-bin identical-phase table
      gives C = N(N-1) exactly; Parseval residual 0.
    source: >-
      Character orthogonality on Z_p^{k_fft} (elementary, derived in
      H-MLKEM-0c0a6e; no external citation asserted). The forced value C_forced
      and the bit conversion are derived from estimator/lwe_dual.py class MATZOV,
      lines 539-556, at commit 3e48ef421ec256afddb3e7d2249a77eab6e9ba12, READ
      during contract drafting and transcribed verbatim in H-MLKEM-0c0a6e's
      mechanism. THE MATZOV PAPER WAS NOT READ; stage 0 replaces every inference
      about the published analysis with a quotation or records that the source
      could not be obtained.

  stages:
    - id: S0
      name: "reading and algebra"
      compute: "zero"
      can_terminate_the_run: true
      description: >-
        Obtain MATZOV 2022 (pp. 29, 37-39) and Ducas-Pulles; quote the advantage
        law, the union-bound term and the independence statement verbatim, or
        record that the source could not be obtained and restate every downstream
        finding as being about the pinned estimator alone. Re-derive (I), (II),
        (III), (IV) and HEUR-PAR-2's variance on paper and have them checked.
        TERMINATES THE RUN if Ducas-Pulles already measure this quantity (the
        hypothesis is dominated and is withdrawn) or if the paper's Nf carries a
        covariance term the pinned code drops (a larger finding, routed under
        rule 12 rather than absorbed).
    - id: S1
      name: "archived-data positive control PC-1"
      compute: "minutes, numpy only, no sieve, read-only on archived input"
      can_terminate_the_run: true
      description: >-
        Compute T, C, abar, C_forced and delta on the archived full-dual pool at
        several (k_fft, p). Forced expectation: delta LARGE AND POSITIVE, because
        y is short in every coordinate there and the bins collapse. Also verify
        the pair-enumeration cross-check and the degenerate-table known answer.
        TERMINATES THE RUN if delta is small: the estimator does not measure what
        it is supposed to measure and nothing further may be run.
    - id: S2
      name: "instrument rebuild, admissibility precheck, estimator control"
      compute: "~1 CPU-hour"
      can_terminate_the_run: true
      description: >-
        Rebuild and verify the KN-TECH-14efa5 instrument and record the rebuild
        in the receipt. Re-pass tools/sage_free_estimator/known_answer_control.py
        at exact equality. Run the unmodified admissibility enumeration on each
        cell's parameters and require exactly the intended tuple. TERMINATES on a
        failed rebuild (INFRASTRUCTURE, never mathematics), a failed estimator
        control, or an empty admissible set.
    - id: S3
      name: "controls, before the real arm is read"
      compute: "~1 CPU-hour"
      can_terminate_the_run: true
      description: >-
        NULL-U at 16 draws per cell; PC-2 graded at five duplication fractions;
        the load-factor ladder on NULL-U; HEUR-PAR-2's sd check (M5 vs M6). The
        frozen decision rule is executed and its labels committed to disk here.
        TERMINATES if PC-2 does not fire or if the null band and the empirical
        null sd disagree by more than a factor of 2 without a recorded switch to
        the empirical distribution.
    - id: S4
      name: "the real arm, the separating and nearby-object arms, the dimension sweep"
      compute: "~3 CPU-hours"
      can_terminate_the_run: false
      description: >-
        REAL, ROWPERM, non-sieve BKZ and non-sieve random arms at >= 3 instances
        per cell, across d' in {40, 50, 60}; regime check M10; M8 and M9 reported
        alongside; HEUR-PAR-3's monotonicity in dimension reported and never
        extrapolated beyond it.
  stage_ordering_rationale: >-
    Cheapest-first and decisive-first. S0 and S1 need no instrument at all and
    either can end the line; S1 in particular runs on data this repository
    already holds. This ordering is the direct answer to the pattern
    DEC-20260805-0b3e11 records, in which six batches each spent a full budget
    before their observable's status was known.

  replication:
    seeds: [20260805, 20260806, 20260807]
    seeds_note: >-
      These are the three instance-level master seeds; every draw within a run is
      derived from them by the seed derivation rule in `inputs.seeds`, so the
      full seed set is reproducible from three integers and the rule.
    independent_instances: 3
    independent_instances_note: >-
      Three per cell is a floor and a completion gate, not an aspiration.
      EV-MLKEM-2cd08b lists "One instance, one database" first among its
      boundaries; a cell measured at one instance is reported as
      NOT-REPLICATED and may not appear in a headline.

  budget:
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 6
    maximum_memory_gb: 16
    maximum_runs: 12
    stage_budgets:
      S0: "10800 s wall clock, zero compute"
      S1: "1800 s wall clock"
      S2: "3600 s wall clock"
      S3: "3600 s wall clock"
      S4: "10800 s wall clock"
    budget_rationale: >-
      Deliberately small. GOAL-MLKEM-004 closed at budget rather than on the
      merits, so a successor's first batch must be cheap enough to be worth
      authorizing: two of the five stages need no instrument, and the sieved
      lattice is SMALLER than the one that campaign ran (the instrument record
      shows bgj1 at dimension 70 in 335.2 s and gauss_sieve at dimension 50 in
      0.94 s).

  stopping_rules:
    - "SR1: S0 finds the quantity already measured by Ducas-Pulles. STOP; the hypothesis is withdrawn by a superseding record."
    - "SR2: S0 finds the paper's Nf carries a covariance term the pinned code drops. STOP the measurement; the finding is a rule-12 routed instrument statement."
    - "SR3: PC-1 does not return a large positive delta. STOP before S2; the estimator is wrong."
    - "SR4: the instrument cannot be rebuilt per KN-TECH-14efa5. STOP and report INFRASTRUCTURE. This is never negative mathematical evidence."
    - "SR5: PC-2 does not fire (slope outside [0.8, 1.2] or non-monotone). STOP; no negative result may be reported from any arm."
    - "SR6: the admissible-tuple enumeration returns the empty set for a cell. That cell is void; if all cells are void, STOP."
    - "SR7: M10 below 0.9 at every cell. STOP and report the cell family as OUT OF REGIME with its exact boundary; do not report any comparison against Nf."
    - "SR8: the wall-clock or CPU budget is exhausted. Report what was covered, per cell, and report the remainder as uncovered. Budget exhaustion is never a result."

  invalidation_rules:
    - "Any violating entry in the dual-membership certificate voids its cell."
    - "Parseval residual above 1e-12 on any arm voids the package until fixed."
    - "The null arm's labels not committed before the real arm is computed: invalid_measurement."
    - "Any change to the frozen definitions (1)-(9) of H-MLKEM-0c0a6e after any number is observed, without a versioned exploratory_only amendment: invalid_measurement."
    - "A cell measured at fewer than 3 instances may not appear in a headline; reported as NOT-REPLICATED."
    - "Use of any archived GOAL-MLKEM-004 statistic as a comparand: invalid_measurement (comparability_policy)."
    - "Any sentence in an output artifact asserting an ML-KEM security consequence: invalid_package."

  infrastructure_failure_disposition: >-
    A timeout, crash, OOM, missing dependency, failed instrument rebuild, or
    unavailable source is recorded as INFRASTRUCTURE SIGNAL and is NEVER negative
    mathematical evidence (AGENTS.md rule 5). Specifically: `import g6k` failing
    is not evidence about the independence heuristic; a failed clone of the
    pinned estimator is not evidence about Nf; an unobtainable MATZOV PDF is not
    evidence that the code and the paper agree. Each such event is recorded with
    its exact command, exit status and stderr, and the affected stage is reported
    as NOT RUN rather than as returning a null result. GOAL-MLKEM-004's own
    pause_conditions record this disposition and it is inherited verbatim.

  scale_relevance:
    tier: toy
    justification: >-
      delta is a dimensionless ratio of energies, which is what makes a
      cross-scale statement expressible at all; but its VALUE depends on the
      sieved dimension, on the load factor and on the modulus, and nothing in
      this contract establishes that dependence converges. The bridge to FIPS 203
      dimensions is HEUR-PAR-3 and only HEUR-PAR-3, which is UNVALIDATED and
      whose own falsification condition may forbid extrapolation entirely. The
      dimension sweep at three sieved dimensions is that heuristic's test and is
      the successor task DEC-20260805-0b3e11 NA-1 names first.
    correspondence: null
    correspondence_note: >-
      None. There is no sampling correspondence that reaches cryptographic
      dimensions here, and none is claimed. Toy dimensions are measured directly
      and reported as toy.

  tail_checks:
    - "Energy profile over the whole candidate group, not only its mean: the fraction of total energy in the top 1, 10 and 100 candidates, compared against the independence model's order statistics."
    - "The largest single wrong-candidate score against its predicted extreme-value probability under variance N(1+delta)/2, per cell."
    - "Occupancy tail: the largest bin count against the multinomial maximum-cell distribution, reported beside M7."
    - "The p | q cell against its non-dividing partner at matched D, isolating rounding dependence (HEUR-PAR-4)."

  success_criterion: >-
    ALL of the following, and the package is INCOMPLETE without every one:
    (a) M1 below 1e-12 on every arm of every cell;
    (b) the degenerate-table and pair-enumeration known answers exact;
    (c) PC-1 returns a large positive delta;
    (d) PC-2's slope in [0.8, 1.2], monotone over all five fractions, f = 0
        inside the null band;
    (e) |mean delta_null| <= 2 * sd_pred at every cell, and M6 within a factor 2
        of M5, or the switch to the empirical null distribution recorded;
    (f) the null labels committed before the real arm was computed, verifiable
        from artifact hashes and timestamps;
    (g) at least 3 instances per reported cell and at least 3 sieved dimensions;
    (h) M2 reported for REAL, ROWPERM, both non-sieve arms and NULL-U, with
        M4 stated as a signed number of bits AND the sentence "Parseval decides
        the second moment and not the maximum" carried with it;
    (i) M9 reported with its spread and explicitly NOT claimed to be settled;
    (j) every out-of-regime cell reported as such rather than silently dropped.
    SUCCESS IS DEFINED BY THE MEASUREMENT BEING ADMISSIBLE, NOT BY delta HAVING
    ANY PARTICULAR VALUE. An unresolved delta at every cell satisfies this
    criterion and is a validated-second-moment result; GOAL-MLKEM-004's
    scope_discipline states that "agreement is as publishable as departure" and
    that "this goal's symmetric failure mode would be needing the model to be
    wrong".

  falsification_criterion: >-
    The hypothesis H-MLKEM-0c0a6e is falsified, in whole or in the named part, by
    ANY of:
    (F1) S0 finding the quantity already measured externally, or the paper's Nf
         carrying a covariance term the code drops -- P2's forced value is then
         not the model's assertion;
    (F2) M1 above 1e-12 -- P1's identity is not implemented, and the package is
         void rather than falsified;
    (F3) PC-2 failing to fire -- the instrument does not measure collision
         energy, and NO NEGATIVE RESULT MAY BE REPORTED;
    (F4) mean delta_null outside its pre-derived band -- (III) is not the forced
         value and the record must name which of HEUR-PAR-1 and HEUR-PAR-4
         accounts for it;
    (F5) M6 differing from M5 by more than a factor 2 -- HEUR-PAR-2's closed form
         is refuted and every band-based verdict is void;
    (F6) M10 below 0.9 at every cell -- the toy scale cannot host the comparison,
         which is a NAMED OBSTRUCTION and must be reported as one;
    (F7) delta in the real arm indistinguishable from delta in both non-sieve
         arms at matched norms -- delta is not a property of sieve output and the
         headline must say so.

