    - "specification.yaml (this file) with its sha256, unmodified during execution"
    - "S0 reading report: verbatim quotations with page references, or an explicit record that a source could not be obtained, per source"
    - "instrument rebuild transcript with the exact commands, versions, and the KN-TECH-14efa5 verification outputs"
    - "estimator known-answer control output at exact equality, with the pin commit hash and a clean-tree statement"
    - "admissibility enumeration output per cell, including the enumerated pair count and the admissible set"
    - "vectors_<cell>.json: x, y_lat, w, z, u per emitted vector, plus A, secret, error realisation, and all seeds"
    - "certificate_<cell>.json: checked_entries, violating_entries, method, and the independent integer-arithmetic recomputation"
    - "null_commit_<cell>.json: the null arm's statistics, labels and hashes, written and hashed BEFORE the real arm is computed"
    - "results.json: every metric M1-M12 per arm per cell per instance, with seeds"
    - "report.md, byte-identical to results.json['report_markdown'] at a declared sha256 (the provenance discipline EV-MLKEM-2cd08b records as the campaign's cleanest)"
    - "receipt.json: commands, exit codes, wall clock, peak RSS, environment versions, git commit and dirty-tree state, requested policy, resolved model id, model_verified status"
    - "an explicit statement of every stage NOT run and why, with infrastructure failures separated from decisions"

  reviewer_notes:
    for_the_validator:
      - "Recompute M2 from vectors_<cell>.json independently, without the producer's code. The bin/phase pair is all that is needed."
      - "Check that C_forced used abar MEASURED on the pool (assumption 6) and not Nf's abar; the two are reported side by side and confusing them inflates delta."
      - "Verify the null labels' commit precedes the real arm by artifact hash and timestamp, not by narrative."
      - "Check PC-2's forced value independently: an exact duplicate pair adds exactly 2 to C, so delta must equal f. This is arithmetic, not statistics."
    for_the_red_team:
      - "The obvious attack is that delta is dominated by skirt leakage rather than by collision structure. M3 exists for you; if M2 and M3 differ materially the headline must be M3."
      - "The second obvious attack is that ROWPERM does not preserve everything it claims to preserve. Check the occupancy multiset explicitly."
      - "The third is that this contract has replaced one forced quantity with another. Test it: construct an object with no lattice, no sieve and no dual family whose delta matches the real arm's. The contract predicts you CAN, at matched occupancy and matched phase alignment, and that this is a feature -- but if you can do it at matched occupancy and MISmatched alignment, the separating control failed."
      - "Look for any sentence in report.md that upgrades a second-moment result into a statement about the independence heuristic, about the union bound, or about ML-KEM. The contract forbids all three."

