# EXP-BINSTD-afb5ee
# Cap-versus-span arithmetic. No RSS probe.
# Approved by DEC-20261003-f2ca94.
experiment:
  id: EXP-BINSTD-afb5ee
  hypothesis_id: H-BINSTD-cb872e
  source_idea: IDEA-20261001-20561e
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Cap gap and cell count
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-f2ca94
  objective: >-
    Check the span gap 3, the product 309825, and the cell count 10.
  inputs:
    n_min: 17
    n_max: 31
    cap: 2
    twice_min: 34
    span_gap: 3
    gap_17_19: 15
    gap_19_23: 15
    gap_23_29: 17
    gap_29_31: 27
    gap_product: 309825
    gap_sum: 77
    tenths_gap: 30
    tenths_quotient: 3
    n_count: 5
    ell_count: 2
    cell_count: 10
    bound_count: 2
    reuse: 5
  controls:
    - >-
      Twice 17 minus 31 is 3. Reporting 31 over 17 as at least 2
      invalidates the run.
    - >-
      Twice 17 minus 19 is 15. Twice 19 minus 23 is 15. Twice 23
      minus 29 is 17. Twice 29 minus 31 is 27. The product of 3,
      15, 15, 17, and 27 is 309825. Their sum is 77.
    - >-
      Twenty times 17 minus 10 times 31 is 30. Thirty divided by 10
      is 3. Reporting the tenths gap as 3 invalidates the run.
    - >-
      Five times two is 10. The written band formula does not
      contain n, so the distinct bound count is 2 and each bound
      is reused 5 times.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {span, tenths, cells}
    - route in {cross_gap, tenths_form}
  metrics:
    primary:
      - span_gap
      - gap_product
      - implementations_agree
    secondary:
      - tenths_quotient
      - cell_count
      - reuse
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The span gap is 3. The product of the five gaps is 309825.
      The cell count is 10.
    formula: >-
      Subtract 31 from twice 17. Multiply that gap by the four
      consecutive gaps. Separately multiply five by two.
    source: >-
      IDEA-20261001-20561e states the n list and the cap 2.0, read
      2026-10-03. The gaps were recomputed in this design session.
      That computation is not a run. No RSS was measured.
  scale_relevance:
    tier: toy
    justification: Five listed n values and one written cap. No transfer to a solver.
    correspondence: null
  tail_checks:
    - The cell count 10 and the tenths quotient 3 are required. A check that stops at the span gap 3 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the span gap 3 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The span gap is not 3.
    - The product is not 309825.
    - The tenths quotient is not 3.
    - The cell count is not 10.
    - RSS is measured, or a numeric alpha or M0 is reported as a measured band.
  success_criterion: >-
    Both runs agree that twice 17 minus 31 is 3, that the consecutive
    gaps are 15, 15, 17, and 27, that their product with 3 is 309825,
    that the tenths gap 30 divided by 10 is 3, and that five times two
    is 10.
  falsification_criterion: >-
    The runs agree that twice 17 is 34, and 34 minus 31 is not 3.
  required_artifacts:
    - experiments/EXP-BINSTD-afb5ee/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-afb5ee/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-afb5ee/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-afb5ee/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-afb5ee/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-afb5ee/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any RSS probe, encoder, solver, or wall-time measurement.
    - Any claim that peak memory stays inside a band.
    - Any numeric alpha or M0. The proposal left both unnamed.
    - Any comparison with rho.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
