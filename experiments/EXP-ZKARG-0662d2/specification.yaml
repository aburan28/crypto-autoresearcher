experiment:
  id: EXP-ZKARG-0662d2
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-6f4272; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-6f4272
  question_id: RQ-WFS-e776b6
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Decompose the composed soundness level of one fixed reference argument into exact named terms,
    compose them under four named orders, and report the residual against the headline number and
    the spread across orders
  objective: 'The one uncertainty a run reduces: how much of a quoted composed security level is determined
    by its input terms and how much by choices made while combining them, for one argument where every
    input can be written down. Specifically (i) it produces a complete term ledger in which each named
    soundness term carries an exact value in bits, a provenance pointer to the computation producing
    it, and an explicit status of exact, stated or missing, so that no number in the total is anonymous
    and no missing term is silently filled; (ii) it composes the ledger under four named and defensible
    orders, reports each total and its signed residual against the headline number, and reports the
    spread across orders as a single number in bits, which is the measure of how under-determined
    the headline is by its own inputs; (iii) it runs a null argument whose composition admits a single
    order and must therefore return zero residual and zero spread, plus a perturbation null that must
    move the total by an exactly predicted amount, so that any spread observed in the signal arm is
    attributable to the terms and their combination rather than to the pipeline. The run examines
    no implementation, executes no protocol, and asserts nothing about any quoted level outside this
    contract.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the reference argument
      and parameter set defined in this contract, the exact values and statuses of the named terms
      are the tabulated ledger, the composed totals under the four named orders are the reported numbers,
      and their spread is the reported bit figure. What does NOT follow: that any real parameter set
      is adequate or inadequate; that any quoted level anywhere is wrong or right, since none is examined;
      that the named composition orders exhaust the defensible ones, so the spread is a lower bound
      over that set; that terms marked stated are measurements; and no attack, break, speedup or security
      consequence.'
  inputs:
    procedure: 'STAGE 0 (cost: hours of writing) Define the reference argument, its full parameter
      set, its headline bit level, the complete list of named terms with intended provenance, and
      the four composition orders, in a written specification frozen before any code. STAGE 1 (cost:
      minutes) Populate the ledger: compute the exact terms, mark the stated ones, and mark any missing
      ones with the reason. STAGE 2 (cost: seconds) Compose under each named order in exact rational
      arithmetic and report each total in bits. STAGE 3 (cost: seconds) Compute the signed residual
      against the headline number under each order and the spread across orders. STAGE 4 (cost: seconds)
      Run the one-round null and the perturbation null through the identical pipeline in the same
      invocation and require their forced values. STAGE 5 (cost: seconds) Run the missing-term control
      and the all-zero degenerate control. STAGE 6 (cost: minutes) Sweep each term by plus and minus
      one bit and record its sensitivity coefficient. STAGE 7 (cost: hours) Have a second implementation
      written from the frozen specification alone recompute every total and require an exact match
      before the run record is written.'
    instrument: 'Python 3 standard library only, no Sage: fractions.Fraction for every term and every
      composition step, decimal.Decimal at 60-digit context for bit conversion and printing, and plain
      dataclasses for the ledger entries carrying value, provenance and status. The composition orders
      are implemented as explicit named functions over the ledger rather than as a single parameterised
      expression, so that an order cannot be silently changed. The second implementation for the cross-check
      is written from the frozen written specification and shares no code. Execution is wrapped by
      harness/runner.py so commit, environment, timing and seeds are captured and the run record is
      immutable, and the ledger plus every total is emitted as a certificate artifact the wrapper
      recomputes independently.'
    parameters: 'Reference argument: 3 rounds, challenge space size 256, 16 parallel repetitions,
      32 queries per repetition, query domain size 4096, corruption rate 0.01, commitment output length
      128 bits with a stated collision term, headline level 80 bits. Named terms: per-round soundness,
      round union, repetition exponent, query detection, challenge-sampling deviation, commitment
      collision, adversary query budget at 2 to the 40. Four composition orders as named in the specification.
      Sensitivity sweep: plus and minus one bit on each of the seven terms, fourteen recomputations.
      Secondary parameter point with 64 repetitions and 128 queries to check whether the spread grows
      with repetition count. Print precision 60 digits, reporting 40 significant digits.'
  controls:
  - One-round null argument with a single defensible composition order, requiring zero residual and
    zero spread.
  - 'Perturbation null: move one ledger entry by a known number of bits and require the total to move
    by exactly the predicted amount.'
  - 'Missing-term control: deliberately mark one term missing and confirm the pipeline refuses to
    emit a total rather than substituting a default.'
  - Degenerate control with all terms equal to zero bits, where every order must give the same total.
  - Independent recomputation of the composed total by a second implementation written from the written
    specification alone, with a required exact match.
  - Exact-versus-floating-point comparison reported only to show which terms floating point would
    erase.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): NULL OBJECT: a reference argument constructed so that its exact non-interactive
    soundness is known in closed form by design, for example a single-round protocol with a single
    challenge and a single attainable challenge, for which every term is exact and the composition
    has only one defensible order. This runs through the identical ledger pipeline and the identical
    composition machinery in the same invocation. For the signal arm to mean anything the null must
    return a residual of exactly zero and an order spread of exactly zero. If the null returns a nonzero
    spread, the spread is being generated by the pipeline itself rather than by the terms, and no
    signal-arm spread may be reported. A second null perturbs one ledger entry by a known number of
    bits and requires the composed total to move by exactly the amount the sensitivity coefficient
    predicts, confirming the sensitivity sweep is measuring the arithmetic and not noise.'
  independent_variables:
  - composition order
  - repetition count
  - which term is perturbed in the sensitivity sweep
  - arm (reference argument versus one-round null)
  metrics:
    primary:
    - each term's exact bit value with status
    - composed total per named order
    - signed residual against the headline number per order
    - spread in bits across orders
    - per-term sensitivity coefficient
    secondary:
    - count of terms by status exact, stated or missing
    - spread at the secondary parameter point with 64 repetitions
    - null-arm residual and spread
    - second-implementation disagreement count, required zero
    - number of terms a floating-point recomputation would erase
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The composed soundness level in bits under each named composition order, its signed
      residual against the headline level, and the spread defined as the maximum total minus the minimum
      total across the named orders.
    formula: 'Let e_round, e_union, e_rep, e_query, e_sample, e_collision and Q denote the named terms
      in bits. Primary order O1: total equals minus log2 of ((2 to the minus e_round times rounds)
      to the power repetitions times 2 to the minus e_query) minus log2 Q, with the collision term
      added outside. Orders O2 through O4 permute whether the round union is taken before or after
      the repetition exponent and whether the collision term is charged inside or outside that exponent,
      each written explicitly in the specification. Pre-registered values: for the one-round null
      all four orders coincide and the spread is exactly zero; the sensitivity coefficient of a term
      entering linearly is exactly 1 and of a term inside the repetition exponent is exactly the repetition
      count.'
    source: Pre-registered in the parent proposal IDEA-20260816-6f4272 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: The parameter set is a toy reference chosen so that every term has an exact computation
      available at parameters this program can produce, with 16 and 64 repetitions and a 4096-position
      query domain. The arithmetic itself is exact at any size, so there is no numerical scale limit;
      the toy label reflects that the argument, its parameters and its headline number are all defined
      by this contract and correspond to nothing outside it. The only transfer assumption is that
      the same ledger structure would apply at other parameters, which is a structural claim about
      the accounting and not a numerical extrapolation.
    correspondence: null
  tail_checks:
  - Report the maximum and minimum composed totals across orders individually rather than only their
    spread, since the spread hides which order is extreme.
  - Report the single term with the largest sensitivity coefficient and confirm it is the one the
    composition structure predicts.
  - Check the secondary 64-repetition point separately, since spread driven by an exponent grows with
    the exponent and averaging would hide it.
  - Report every term whose exact value falls below 2 to the minus 30 bits, since those are the entries
    a reader would be tempted to drop and dropping them changes the total by a computable amount.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt if the one-round null returns a nonzero residual or spread.
  - Halt if the missing-term control emits a total.
  - Halt and report a partial ledger without any total if more than half the terms are marked stated
    or missing.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run succeeds if all nulls and controls return their forced values, the second
    implementation matches exactly, and the complete term ledger with statuses, the four composed
    totals, the residuals, the spread and the sensitivity coefficients are reported, whether or not
    the spread is material.
  falsification_criterion:
  - The one-round null returns a nonzero residual or spread.
  - The perturbation null does not move the total by the predicted amount.
  - The missing-term control emits a total.
  - The second implementation disagrees on any total.
  - The spread is exactly zero at both parameter points, falsifying the conjecture that composition
    order is a free parameter here and closing with the obstruction that the pipeline is order-determined
    at these shapes.
  - More than half the terms are stated or missing, in which case no total may be reported at all.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-6f4272
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The commitment collision term has no exact computation in this program and will be a stated input;
    the Coordinator must decide whether a ledger with a stated dominant term is worth composing at
    all or whether the record should stop at the ledger.
  - The four composition orders must be written out explicitly in the specification; the proposal
    names their structure but does not fix the formulas, and the spread depends entirely on that fixing.
  - Whether the headline level of 80 bits should be chosen independently of the terms, for example
    by a stated parameter-selection rule, so that the residual is not tautological.
  - Whether terms produced by sibling contracts in this bucket may be cited as provenance before those
    contracts have run, or whether this record must wait on them.
