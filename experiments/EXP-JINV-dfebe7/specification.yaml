# =============================================================================
# EXP-JINV-dfebe7 — version 1, not approved. Specified from
# IDEA-20261006-79bd0d / H-JINV-c9c8ef. Status is review_required.
# check_approval_capacity would reject an approving decision:
# GOAL-ENDO-001 holds 10 approved contracts with no run, cap 3.
# The missing driver is a scaling-automorphism counter over F_13.
# A search of origin/main for "scaling automorphism" and "u^6 = 1"
# under *.py and *.sage returned no path. There is no trial-plan.json.
# Success is the source idea's prediction: the counts are 6 and 2.
# The concrete negative is count_generic >= 3 or count_j0 != 6 on a
# valid pair. This session did not score a u. Source idea bytes are
# blob 5d2841d26d3e108bb75267bd38ee0bf53065194f.
# =============================================================================
experiment:
  id: EXP-JINV-dfebe7
  hypothesis_id: H-JINV-c9c8ef
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  source_idea: IDEA-20261006-79bd0d
  version: 1
  title: >-
    Scaling-automorphism census of two short-Weierstrass models over F_13
  status: review_required
  approved_by: null
  designed_at: '2026-10-07'
  frozen: false
  execution_authorized: false
  packaging_only: false
  approval:
    approved_by: null
    composing_decision: DEC-20261007-d765ba
    withheld_reason: >-
      check_approval_capacity would reject an approving decision.
      GOAL-ENDO-001 already holds 10 approved contracts with no run
      (cap 3). The launcher is also missing, so the contract is not
      runnable. There is no committed program that, over F_13,
      enumerates u in F_13-star, keeps u when A u^4 = A and
      B u^6 = B, counts distinct pairs (u^2, u^3) on y^2 = x^3 + 1
      and on y^2 = x^3 + x + 1, computes j and the traces, and
      checks that u = 1 is kept on both models and u = -1 is kept
      on the second. A search of origin/main for the phrases
      "scaling automorphism" and "u^6 = 1" under *.py and *.sage
      returned no path. A trial plan requires that driver. This
      session did not score a u.
    implementation_authorized: false
    scientific_execution_authorized: false
    scientific_execution_scope: >-
      When a later approval adds the missing counter and the goal
      has room under check_approval_capacity, work only at p = 13
      on these two models. Do not transfer the counts to another
      prime or to cryptographic size. Do not run Pollard rho.
    frozen: false
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
      applied: false

  objective: >-
    Decide whether the number of distinct scaling maps on
    y^2 = x^3 + 1 over F_13 is exactly 6 and the number on
    y^2 = x^3 + x + 1 over F_13 is exactly 2. The concrete
    negative is a count of 3 or more on the second model, or a
    count other than 6 on the first, after the models pass the
    ordinary and nonsingular checks. No faster discrete logarithm
    is in scope.

  inputs:
    prime: 13
    model_j0: >-
      E_0: y^2 = x^3 + 1 over F_13. Coefficients A = 0, B = 1.
    model_generic: >-
      E_gen: y^2 = x^3 + x + 1 over F_13. Coefficients A = 1, B = 1.
    scan: >-
      Every u in 1 through 12. Keep u when A u^4 = A and
      B u^6 = B. Count distinct pairs (u^2, u^3). Do not run
      Pollard rho.

  controls:
    - id: identity-kept
      statement: >-
        u = 1 is kept on both models. Otherwise the scan is invalid.
    - id: negation-kept
      statement: >-
        u = -1 is kept on E_gen. Otherwise the scan is invalid.
    - id: j-generic
      statement: >-
        j(E_gen) is computed from the curve coefficients and is
        neither 0 nor 1728. Otherwise the non-special arm is invalid.
    - id: ordinary-nonsingular
      statement: >-
        Both models are nonsingular, and neither trace is divisible
        by 13. A singular or supersingular model is not scored.

  independent_variables:
    - which model is scored, E_0 or E_gen
    - the unit u in F_13-star

  metrics:
    primary:
      - id: count_j0
        statement: >-
          The number of distinct pairs (u^2, u^3) that preserve
          y^2 = x^3 + 1 over F_13. The idea's prediction is exactly 6.
      - id: count_generic
        statement: >-
          The number of distinct pairs (u^2, u^3) that preserve
          y^2 = x^3 + x + 1 over F_13. The idea's prediction is
          exactly 2. The concrete negative includes a value of 3
          or more.
    secondary:
      - id: j_generic
        statement: the j-invariant of E_gen
      - id: trace_j0
        statement: the trace of Frobenius of E_0 over F_13
      - id: trace_generic
        statement: the trace of Frobenius of E_gen over F_13

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says the non-special model has exactly the two scalings
    u = plus or minus 1, and the j = 0 model has gcd(6, p - 1) = 6
    solutions of u^6 = 1 at p = 13. A missing identity voids the
    counts and does not by itself replace them with another pair
    of integers.

  preregistered_prediction:
    quantity: >-
      The pair (count of scaling automorphisms of E_0, count of
      scaling automorphisms of E_gen) over F_13.
    formula: >-
      (count_j0, count_generic) = (6, 2). The concrete negative,
      after the identity, negation, j, and ordinary checks pass,
      is count_generic >= 3 or count_j0 != 6. Source idea
      IDEA-20261006-79bd0d, predictions minimum_effect exactly 6
      and exactly 2. No u was scored before this formula was
      written.
    source: >-
      IDEA-20261006-79bd0d. RQ-JINV-8fc13a asks whether a special
      j confers an ECDLP advantage beyond the sqrt(|Aut|) constant.
      KR-RHO-0528e7 was opened in this session. It states the
      constants sqrt(6) and sqrt(4) and does not state these two
      integers at p = 13.

  scale_relevance:
    tier: toy
    justification: >-
      The prime is 13. No transfer to another prime or to
      cryptographic size is assumed. The minimum effect is the
      idea's own: the integers 6 and 2.
    correspondence: >-
      Direct enumeration of twelve units. No sampling shortcut
      is used.

  tail_checks:
    - >-
      The pair (6, 2) meets the prediction. A generic count of 3
      or more, or a j = 0 count other than 6, with the checks
      passed, is the negative.
    - >-
      Counting raw u rather than distinct pairs (u^2, u^3) is not
      a passing row. The metric is the number of distinct maps.

  replication:
    seeds:
      - EXP-JINV-dfebe7|scan|F13|E0
      - EXP-JINV-dfebe7|scan|F13|Egen
    independent_instances: 1
    note: >-
      One later manifest would cover both models. No run id is
      minted in this session. The replication plan does not name
      a future run slot, because the trial plan is not frozen
      while status is review_required.

  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One later manifest would cover the frozen scan of twelve
      units. Wall-clock and CPU figures are not set. The 1 GB
      figure is machine protection for a prime of 13. A watchdog
      expiry is failed_infrastructure, not a count.

  stopping_rules:
    - Stop after one reading row is named from the pinned scan.
    - Do not change the integers 6 and 2 after seeing a count.
    - Do not scan a second claim prime in this contract.
    - A timeout or crash voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - A missing u = 1, a missing u = -1 on E_gen, a j(E_gen) in {0, 1728}, or a singular or supersingular model voids the run.
    - Transferring the counts to another prime or to cryptographic size voids the run.
    - A rho walk is out of scope and voids the run.

  success_criterion: >-
    u = 1 is kept on both models, u = -1 is kept on E_gen,
    j(E_gen) is neither 0 nor 1728, both models are nonsingular
    and ordinary, the number of distinct scaling maps on
    y^2 = x^3 + 1 over F_13 is exactly 6, and the number on
    y^2 = x^3 + x + 1 over F_13 is exactly 2. Those two integers
    are the prediction of IDEA-20261006-79bd0d. The conjunction
    is reachable as a failure when the checks pass and the generic
    count is 3 or more, or the j = 0 count is not 6.

  falsification_criterion: >-
    u = 1 is kept on both models, u = -1 is kept on E_gen,
    j(E_gen) is neither 0 nor 1728, both models are nonsingular
    and ordinary, and either the generic scaling count is 3 or
    more or the count on y^2 = x^3 + 1 is not 6. That is the
    concrete negative. A missing identity, a special j on E_gen,
    or a singular or supersingular model is not this sentence.

  decision_impact:
    on_positive: >-
      A later evidence review may record that the scaling counts
      at p = 13 are 6 and 2, with the identity, negation, j, and
      ordinary checks passed. The generic-group exponent stays
      1/2, and the constants stay the sqrt(6) and sqrt(2) already
      priced in KR-RHO-0528e7. No knowledge entry is promoted from
      this design record.
    on_negative: >-
      A later evidence review may record that, at p = 13, the
      generic scaling count is 3 or more or the j = 0 count is
      not 6, with the same checks passed, so explanation A is
      false at this prime only. The generic-group exponent stays
      1/2. The two outcomes name different pairs of integers.

  required_artifacts:
    - experiments/EXP-JINV-dfebe7/runs/RUN-*/manifest.yaml
    - experiments/EXP-JINV-dfebe7/runs/RUN-*/raw-result.json
    - experiments/EXP-JINV-dfebe7/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: setup_invalid
      when: >-
        u = 1 is missing on either model, u = -1 is missing on
        E_gen, j(E_gen) is 0 or 1728, or either model is singular
        or supersingular
    - id: infrastructure
      when: the process aborts for memory or the process times out
    - id: count_mismatch
      when: >-
        the identity, negation, j, and ordinary checks pass, and
        the generic count is 3 or more or the count on E_0 is not 6
    - id: counts_6_and_2
      when: >-
        the identity, negation, j, and ordinary checks pass, and
        the counts are exactly 6 on E_0 and exactly 2 on E_gen
  reading_rule: >-
    Name exactly one row. counts_6_and_2 is the only success row.
    count_mismatch is the concrete negative. setup_invalid and
    infrastructure are not the comparison with (6, 2). Record
    both counts, j_generic, and both traces beside the row.
    attack_claimed is false.
