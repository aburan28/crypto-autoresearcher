  objective: >
    Evaluate the exact identities that
    TIER2 is unreachable on the frozen
    3-node DAG when SDEG is fail-only,
    reject the shuffled same-retirement
    claim, and report unconstrained
    ranges as retiring nothing.
  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL retires
      TIER2 only; KF shuffled
      same-retirement rejected; NULL
      unconstrained retires nothing.
      Certificate kind none.
    formula: >
      TIER2 reachable iff every parent
      has admissible value pass.
      REAL parents SDEG={fail},
      RELN={pass} => unreachable.
    source: IDEA-20260815-0253b6 mechanism (internal)
    claim_tier: observational
  inputs:
    fixture:
      real_graph:
        nodes: [SDEG, RELN, TIER2]
        edges:
          - {src: SDEG, dst: TIER2}
          - {src: RELN, dst: TIER2}
        admissible:
          SDEG: [fail]
          RELN: [pass]
        conjunction: all_parents_pass
        must_retire: [TIER2]
        must_keep: [SDEG, RELN]
      known_false:
        kind: shuffled_same_retirement
        edges:
          - {src: RELN, dst: TIER2}
        must_reject: true
      matched_null:
        kind: unconstrained_admissible
        admissible:
          SDEG: [pass, fail]
          RELN: [pass, fail]
        must_retire: []
  controls:
    - name: known_false_shuffled_same
      object: KF claim shuffled graph has the same retirement set
    - name: matched_null
      object: unconstrained admissible ranges
  independent_variables:
    - edges
    - admissible
  metrics:
    primary:
