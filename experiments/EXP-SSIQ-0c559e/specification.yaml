experiment:
  id: EXP-SSIQ-0c559e
  hypothesis_id: H-SSIQ-055a36
  derived_from_idea: IDEA-20260821-167fd9
  question_id: RQ-SSIQ-9702af
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Measured shard-invariant closure at S in {1,4,16} plus a pre-registered predicate battery testing
    whether the codomain set C(E) is separable from a shape-matched null C(E''), calibrated by the
    derived factor-about-0.46 midpoint bias and by an F_p positive control that must score AUC 1.0
  objective: >-
    The one uncertainty a run reduces is whether the memory exponent of the claw step is reachable at
    all by the only two routes that survive the arithmetic: rebuild-and-shard, and streaming
    recognition of C(E). A run establishes (i) the MEASURED invariant ratio (time^2 x memory)/N^3 for a
    toy rebuild-and-shard implementation at S in {1, 4, 16}, whose FORCED value is exactly S and whose
    departure would withdraw the arithmetic closure -- the most consequential negative available here;
    (ii) the AUC of every member of a PRE-REGISTERED predicate family separating C(E) from the
    SHAPE-MATCHED null C(E'') at three primes and three list radii, with a bootstrap interval and a
    multiple-comparison correction fixed in advance; (iii) the battery's RESOLUTION FLOOR, which is what
    makes any negative interpretable; (iv) the calibration arms -- the F_p positive control which must
    score AUC 1.0, and the planted-midpoint arm which must recover a bias that is provably present at
    magnitude about 0.46 -- without which no negative may be recorded; and (v) the within-list codomain
    collision count against its forced value N^2/p. NO EXPONENT IS CLAIMED TO MOVE and the modal
    expected outcome is a bounded negative.
  what_this_is_not:
    - >-
      Not an exponent improvement and not an algorithm. Nothing here states, implies, or is structured
      to suggest that a p^{1/4} algorithm over F_{p^2} exists, is likely, or is nearly obtained.
    - >-
      Not a claim that C(E) is incompressible. A negative here is scoped to ONE finite family of cheap
      statistics of j at toy scale and says nothing about recognisers using quaternion-side data.
    - >-
      Not a quantum costing and not an instantiation of parallel collision search; both are owned
      elsewhere and this contract is entirely classical.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: "at the tested primes and sample sizes, no member of the pre-registered
      predicate family separates C(E) from C(E'') by more than the derived midpoint bias, with
      resolution floor r" -- or the negation, naming the predicate. Plus: "a measured rebuild-and-shard
      implementation returns invariant ratio S at S in {1,4,16}", which is a calibration of an
      arithmetic closure and not an experimental result about the closure's validity in general. WHAT
      DOES NOT FOLLOW: no statement that C(E) is incompressible; nothing about quaternion-side
      recognisers; nothing at cryptographic p; no exponent movement; and no claim that a
      constant-density filter is a memory-exponent improvement.
  inputs:
    procedure: >-
      STAGE 0 (ZERO COMPUTE, and it is the deliverable that stands alone). Write out the shard
      accounting, the predicate classification, the recogniser reduction and the midpoint inequality
      delta_{E'} <= delta_E, with the frozen symbolic fixture checking S N^3 against N^3 and the two VW
      endpoints (w = N reproducing the incumbent, w = poly(log p) reproducing p^{1/2+o(1)}). If the
      accounting fails its own fixture, STOP. STAGE 1 (small compute). At three primes with log2 p in
      [20, 40], build L(E,X,B) and C(E) exactly, plus the shape-matched null C(E''), the uniform null
      and the F_p positive control. Assert the degeneracy gate |C(E)| at most 0.1 |V| at every prime.
      STAGE 2 (the battery). Evaluate the PRE-REGISTERED predicate family, fixed before any data is
      seen, with strict held-out splitting BY CURVE for the supervised arm and the multiple-comparison
      correction applied as declared. STAGE 3 (calibration and decay). Run the decay control at three
      list radii X and the planted-midpoint calibration, whose forced values are 1.00 on midpoints
      against about 0.46 on generic list codomains. STAGE 4 (the shard measurement). Implement
      rebuild-and-shard at S in {1, 4, 16} and measure (time^2 x memory)/N^3 against the forced value S.
      STAGE 5 (zero compute). Report AUC per predicate per null per prime per radius, the resolution
      floor beside EVERY negative, and -- if and only if a candidate survives -- its acceptance density
      q, its fitted exponent c across primes, and its position against 2 alpha + mu < 3.
    instrument: >-
      Exact enumeration of L(E,X,B) and C(E) at toy primes. The predicate family is FROZEN before any
      data is seen: F_p-coordinate (Tr(j), Nm(j)) marginal and joint histograms; the delta-statistic
      (exact distance-to-conjugate) of the codomain; for ell in {2,3,5} the root-count pattern of the
      modular polynomial over F_{p^2}; the Frobenius-orbit-quotient occupancy vector; and a supervised
      baseline (regularised logistic regression plus one gradient-boosted model) on the concatenation of
      those plus raw F_p-coordinate bits. The supervised split is BY CURVE, never by sample, and the
      report must state that a memorising model is not a recogniser because storing the model is storing
      the set. Recorded through harness/runner.py.
    parameters: >-
      Three primes with log2 p in [20, 40], declared numerically and frozen. Three list radii X,
      declared and frozen. Shard counts S in {1, 4, 16}. Degeneracy gate |C(E)| at most 0.1 |V|,
      mandatory. Multiple-comparison correction over 5 predicate groups x 3 nulls x 3 primes x 3 radii,
      fixed in advance and reported with the correction stated. Bootstrap resamples for every AUC
      interval declared before any run. RESOLUTION NOTE, derived rather than measured: at log2 p = 40,
      N is of order 10^4 to 10^5, so an AUC advantage below about 0.02 is not resolvable at that sample
      size; the experiment can only EXCLUDE biases above its stated resolution floor and must report
      that floor rather than the phrase "no signal".
  controls:
    - >-
      PRIMARY NULL, SHAPE-MATCHED C(E''): the codomain set of an INDEPENDENT uniformly random
      supersingular E'', at matched cardinality and matched degree profile (same B, same X, same
      smooth-degree multiset). This preserves everything about being a smooth-reachable set and destroys
      only the dependence on the specific E. FORCED VALUE AUC = 0.5 for every predicate, because a
      recogniser for C(E) must use E. A predicate scoring 0.5 here but high against the uniform null has
      recognised reachable-set-ness and is DISQUALIFIED. Getting this null right is the single design
      decision that separates this measurement from a codomains-look-random study.
    - >-
      SECONDARY DIAGNOSTIC, UNIFORM RANDOM SUBSET at matched size. The instrument must score WELL ABOVE
      0.5 here, because C(E) really is structured; a failure means the instrument is dead and NO negative
      may be read from it. This is a diagnostic, not a test.
    - >-
      POSITIVE CONTROL WITH A KNOWN ANSWER, THE F_p LOCUS: the predicate "j in F_p" must score AUC 1.0.
      This is the nearby object where a sublinear recogniser is KNOWN to exist, and it calibrates the
      battery's power. Failure here voids every negative.
    - >-
      DERIVED-BIAS CALIBRATION: the true claw midpoint's delta-statistic, whose bias is predicted to be
      a factor about 0.46 in density and NOTHING MORE. The battery must recover a bias of that size on
      planted instances; if it cannot, it has no power to detect anything smaller and every negative it
      reports is bounded by its own resolution.
    - >-
      DECAY CONTROL at three list radii X. A genuine E-specific signal must DECAY as X grows because
      longer smooth walks mix; an advantage constant in X is recorded as an artifact.
    - >-
      SYMBOLIC FIXTURE for the shard and VW accountings, run at Stage 0 as a blocking gate, and applied
      to any candidate scheme so that no scheme can be reported as an improvement without being placed
      on the same axis as VW.
    - >-
      DEGENERACY GATE |C(E)| at most 0.1 |V|. At log2 p = 20 the vertex set has only a few hundred
      curves and C(E) may be most of it, making every AUC meaningless.
    - >-
      SUPERVISED-LEAKAGE CONTROL: the train/test split is BY CURVE, not by sample, since a model that
      memorises C(E) is not a recogniser -- storing the model is storing the set.
  independent_variables:
    - prime, one of three declared values with log2 p in [20, 40]
    - list radius X, one of three declared values
    - >-
      null arm, one of shape-matched C(E''), uniform random subset, F_p locus positive control, or
      planted-midpoint calibration
    - predicate group, one of the five pre-registered groups
    - shard count S, one of 1, 4, 16
  metrics:
    primary:
      - >-
        best_predicate_auc_vs_shape_matched_null, units AUC in [0,1], computed per predicate per prime
        per radius with a bootstrap interval and the pre-registered multiple-comparison correction
        applied, against the shape-matched null C(E''). FORCED NULL VALUE 0.5.
      - >-
        battery_resolution_floor, units AUC advantage, computed as the smallest AUC advantage
        distinguishable at the achieved sample size, REPORTED ALONGSIDE EVERY NEGATIVE. A negative
        without this number is not reportable.
      - >-
        shard_invariant_ratio, units dimensionless, computed as measured (time^2 x memory) divided by
        N^3 for a rebuild-and-shard implementation at S in {1, 4, 16}. FORCED VALUE exactly S.
      - >-
        midpoint_delta_inequality_rate, units a rate in [0,1], computed as the empirical
        Pr[delta_{E'} <= delta_E] over planted claw midpoints (FORCED 1.00, a theorem) and over generic
        list codomains (predicted about 0.46 under the density law)
    secondary:
      - >-
        acceptance_density_q and its fitted exponent c across primes, units a density in [0,1] and a
        dimensionless exponent, computed for any predicate achieving a non-null AUC. Only q = N^{-c}
        with c stable across primes moves mu; a constant q is a constant-factor saving.
      - >-
        auc_vs_uniform_null, units AUC, the instrument-alive diagnostic; must be well above 0.5
      - >-
        fp_locus_positive_control_auc, units AUC; must be 1.0 for the trivial predicate
      - >-
        decay_slope_in_X of any advantage, units AUC per radius step, with an interval over three radii
      - >-
        within_list_codomain_collision_count, units count, against the forced value about N^2/p
      - >-
        shard_balance_ratio, units dimensionless, computed as max_i |D_i intersect C(E)| divided by
        (N/S), for both admissible predicate types. FORCED VALUE 1 + o(1).
      - >-
        degeneracy_gate_status per prime, units a boolean plus |C(E)|/|V|
      - >-
        wall_seconds and peak_rss_gb per stage
  heuristic_under_test:
    id: H1
    formal_statement: >-
      CODOMAIN EQUIDISTRIBUTION. For a uniformly random supersingular E and parameters (X, B) with
      |C(E)| at most |V|/10, the set C(E) is indistinguishable from a uniformly random subset of the
      same size of the supersingular vertex set, by any statistic computable from the j-invariants alone
      in time poly(log p) per element, up to the derived midpoint bias delta_{E'} <= delta_E.
    companion_heuristic:
      id: H2
      formal_statement: >-
        MIDPOINT BIAS MAGNITUDE. Under the conjugate-degree density law, Pr[delta <= delta_E] equals
        (delta_E/(p/2)^{1/3})^{3/2}, so the derived midpoint constraint confers an advantage of exactly
        that size -- about 0.46 at a typical instance -- and no more.
    scale_access_and_transfer: >-
      Access is by exact enumeration of C(E) at toy primes; there is no correspondence permitting
      sampling at cryptographic scale. TRANSFER ASSUMPTIONS, RECORDED: (T1) an AUC measured at log2 p in
      [20, 40] bounds no AUC at cryptographic p and is reported as a toy-scale bound only; (T2) the
      battery covers statistics of j and NOT quaternion-side data, so a negative is scoped to that
      family; (T3) the shape-matched null shares the degree profile but not the curve, so it controls
      for reachable-set structure and for nothing else.
    sample_size_justification: >-
      Derived from the smallest advantage the design must resolve, not chosen by convenience. At
      log2 p = 40, N is of order 10^4 to 10^5, so the AUC standard error at that sample size makes
      advantages below about 0.02 unresolvable; the design therefore declares a candidate threshold of
      0.55 (an advantage of 0.05, comfortably above the floor) and REQUIRES the measured floor to be
      reported beside every negative so that "no separation" is always read as "no separation above r".
  preregistered_prediction:
    quantity: >-
      The best predicate's AUC against the shape-matched null C(E''), and the measured shard invariant
      ratio at S in {1, 4, 16}.
    formula: >-
      Predicted, before any run: best_predicate_auc_vs_shape_matched_null = 0.5 within its bootstrap
      interval at every prime and radius (the FORCED null value); shard_invariant_ratio = S exactly;
      midpoint_delta_inequality_rate = 1.00 on planted midpoints and about 0.46 on generic list
      codomains; fp_locus_positive_control_auc = 1.0; within_list_codomain_collision_count about N^2/p;
      shard_balance_ratio = 1 + o(1). Under the alternative, some predicate reaches corrected AUC at
      least 0.55 with an interval excluding 0.5, replicated at three primes and decaying in X.
    source: >-
      Pre-registered in the parent proposal IDEA-20260821-167fd9, whose predictions block states every
      forced value above and whose null_object_control fixes the shape-matched null as primary before
      any run exists. The predicate family is enumerated there and is frozen before any data is seen.
      Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at three primes with log2 p in [20, 40], where C(E) is directly enumerable and the nulls
      are constructible at matched size and matched degree profile. That enumerability is the design: the
      forced values (AUC 0.5 against the shape-matched null, AUC 1.0 for the F_p positive control, a
      factor-0.46 midpoint bias) are all available BEFORE the run. The cost is that at these sizes an AUC
      advantage below about 0.02 is not resolvable, so the experiment can only exclude biases above a
      stated size -- and it must report that size rather than the phrase "no signal".
    correspondence: null
  tail_checks:
    - >-
      Report the resolution floor beside EVERY negative; a negative without it is not reportable.
    - >-
      Report every predicate's AUC, not only the maximum, so the multiple-comparison correction is
      auditable and a 0.55 arising by chance is visible as such.
    - >-
      Report the decay slope in X with its interval; an advantage CONSTANT in X is an artifact and is
      reported as one.
    - >-
      Report the within-list collision count against N^2/p explicitly; a count materially above it is
      either a bug or the second success channel and must not be absorbed.
    - >-
      Report |C(E)|/|V| per prime against the 0.1 degeneracy gate, so a prime excluded for degeneracy is
      visible rather than silently dropped.
    - >-
      Report the shard balance ratio's maximum over shards, not its mean, since an unbalanced partition
      is a tail phenomenon and would change the S accounting.
  replication:
    seeds:
      - 20260821
      - 20260822
      - 20260823
    independent_instances: 3
  budget:
    wall_clock_seconds: 10800
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: 8.0
    memory_gb: 16
    maximum_memory_gb: 16
    maximum_runs: 24
  stopping_rules:
    - >-
      Stage 0's symbolic fixture is a blocking gate. If the shard accounting fails its own fixture, or
      the VW endpoints do not reproduce, STOP; nothing else is recorded.
    - >-
      Run the F_p positive control and the planted-midpoint calibration BEFORE any negative is read. If
      either fails, stop and report the instrument limit; do not record a closure.
    - >-
      Exclude and report any prime failing the degeneracy gate |C(E)| at most 0.1 |V|; no AUC from it is
      reported.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop,
      never a negative result (AGENTS.md rule 5).
    - >-
      The predicate family, the 0.55 threshold, the multiple-comparison correction, the primes, radii
      and shard counts are frozen before any data is seen and are not revised afterwards.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure and
      is NEVER negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run whose SHAPE-MATCHED null arm is missing, or whose null arm was not executed in the same
      invocation as the signal arm, is invalid_measurement: the comparison the contract exists to make
      was not made. A run that used ONLY the uniform null answers a different question and is likewise
      invalid for this hypothesis.
    - >-
      A run in which the F_p positive control does not score AUC 1.0, or the planted-midpoint
      calibration does not recover the derived bias, is invalid for recording any negative; the
      deliverable is the instrument's limit.
    - >-
      A run whose supervised arm split by SAMPLE rather than by CURVE is invalid_measurement, because a
      memorising model is not a recogniser.
    - >-
      A run reporting a negative WITHOUT its resolution floor is invalid_measurement: it produced no
      bound.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a
      new contract; it is never a repair of this one.
  success_criterion: >-
    The run succeeds as a MEASUREMENT when all of the following hold and are reported: the Stage 0
    symbolic fixture passes for S N^3, N^3 and both VW endpoints; every included prime passes the
    degeneracy gate; the F_p positive control scores AUC 1.0 and the uniform-null diagnostic scores well
    above 0.5; the planted-midpoint calibration returns 1.00 on midpoints and a generic rate in
    [0.35, 0.60]; AUC against the SHAPE-MATCHED null is reported for every predicate, prime and radius
    with bootstrap intervals and the declared multiple-comparison correction, ACCOMPANIED BY THE
    RESOLUTION FLOOR; the measured shard invariant ratio is reported at S in {1, 4, 16}; and the
    within-list collision count and shard balance ratios are reported against their forced values. Each
    is decidable from the primary metrics above. Note explicitly: AUC 0.5 everywhere and AUC 0.6
    somewhere are BOTH successes of the measurement; the criterion is completeness, and the scientific
    verdict is read from the falsification criteria below.
  falsification_criterion:
    - >-
      A predicate achieves corrected AUC at least 0.55 against the SHAPE-MATCHED null, replicated at
      three primes, with a bootstrap interval excluding 0.5 and the advantage DECAYING in X. H1 IS
      FALSIFIED: C(E) is recognisable at some level and the memory lever is open. The candidate goes
      straight to a costed (alpha, mu) evaluation against 2 alpha + mu < 3, and its acceptance density q
      and fitted exponent c decide whether it touches mu at all.
    - >-
      The measured shard invariant ratio at S in {4, 16} is not S. THE ARITHMETIC CLOSURE IS WITHDRAWN
      and the accounting must be redone. This is the most consequential negative available, since the
      closure is the part that stands without any experiment.
    - >-
      Any sampled planted midpoint has delta_{E'} > delta_E. The two-line composition derivation is
      wrong; this is a transcription-error check and it is included precisely because such errors survive
      review.
    - >-
      The planted-midpoint calibration fails to recover the derived bias, or the F_p positive control
      does not score AUC 1.0. The battery has no power at the scale of an effect that is provably
      present; every negative is VOID and must be reported as an instrument limit, never as a closure.
    - >-
      The within-list codomain collision count is materially above N^2/p. Either a bug or the second
      success channel behaving unexpectedly; it must be reported rather than absorbed.
    - >-
      NOT a falsification: an advantage CONSTANT in the list radius X. That is the canonical artifact
      signature and is reported as an artifact unless a mechanism for its constancy is exhibited.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and inference
      block, environment, and the frozen predicate family, threshold and multiple-comparison correction
    - >-
      raw-result.json carrying every per-predicate, per-prime, per-radius, per-null AUC with its
      bootstrap samples, not summaries, plus the resolution floor per cell
    - >-
      the shape-matched null arm, the uniform diagnostic, the F_p positive control and the
      planted-midpoint calibration, all in the same file as the signal arm
    - >-
      the Stage 0 symbolic fixture's output for S N^3, N^3 and both VW endpoints
    - >-
      the measured shard implementation's (time, memory) pairs and invariant ratios at S in {1, 4, 16}
    - >-
      the pre-registration text with the frozen predicate family, written before the first run and hashed
    - >-
      certificate kind none for the battery; any claimed recogniser candidate carries its acceptance
      density, fitted exponent and (alpha, mu) position, evaluated by the same symbolic fixture
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator authorship does not confer approval. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false (AGENTS.md rule 1). Approval is
      the user's gate because it authorizes execution and spends compute.
    - >-
      Stage 0 is zero-compute and stands alone as a deliverable. It may be approved independently of
      Stages 1-4, and the arithmetic closure it produces does not depend on any run.
    - >-
      The parent proposal carries a proof_search_map; it must be audited against KN-TECH-080 before the
      battery is authorized.
    - >-
      A recogniser candidate surviving the shape-matched null triggers mandatory routing to an
      independent review-adversarial session before any statement is recorded. That routing must be
      fixed in the handoff, not decided after the result.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260821-167fd9
    authored_at: '2026-08-25'
    note: >-
      Every metric, forced value, control and falsification condition is transcribed from the parent
      proposal's predictions, null_object_control, minimal_test, required_metrics and
      falsification_conditions blocks, or from its heuristics H1 and H2. The resolution-floor requirement
      is the proposal's own survival_score observation ("an AUC advantage below about 0.02 is not
      resolvable, so the experiment can only exclude biases above a stated size, and the record must
      report that size rather than 'no signal'") promoted here to a blocking deliverable and an
      invalidation rule. Boilerplate identical across contracts by program rule comes from a fixed table.
      Budgets come from the parent's declared estimated_cost of implementation medium and compute low,
      widened for three primes times three radii times five predicate groups times four null arms.
  derivation_gaps:
    - >-
      The three primes and three list radii are not fixed numerically by the parent proposal. They must
      be declared before approval, since both the decay control and the degeneracy gate depend on them.
    - >-
      The multiple-comparison correction is required but not specified. Five predicate groups times three
      nulls times three primes times three radii is a large family, and a 0.55 WILL appear by chance
      without a correction fixed in advance; the exact correction must be named in the frozen contract.
    - >-
      The rebuild-and-shard toy implementation is not specified. What "time" and "memory" are measured as
      (steps and peak resident bytes, or something else) must be pinned, or the forced value S is not
      decidable from the measurement.
    - >-
      The bootstrap procedure and resample count for the AUC intervals are unspecified and must be
      declared before approval.
    - >-
      Whether the delta-statistic predicate can be computed within poly(log p) per element at these toy
      primes is not established. If it cannot, that predicate is outside the recogniser class the
      hypothesis is about, and including it would weaken the negative rather than strengthen it.
