# EXP-DREG-44db1f
# Complete short-Weierstrass census over F_5.
# Not a fall profile. Approved by DEC-20261001-94dd52.
experiment:
  id: EXP-DREG-44db1f
  hypothesis_id: H-DREG-97ba53
  source_idea: IDEA-20260922-805a59
  question_id: RQ-DREG-c8ae8d
  version: 1
  title: F_5 curve census and the trace-2 class
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-94dd52
  objective: >-
    Visit every (A, B) in F_5 squared. Exclude singular curves. Count points
    on the rest. Check the gauge (u^4 A, u^6 B) on (1, 0) for every nonzero u.
  inputs:
    p: 5
    model: y^2 = x^3 + A x + B
    predicted:
      pairs_visited: 25
      nonsingular_count: 20
      order_multiplicities: {2: 1, 3: 2, 4: 3, 5: 2, 6: 4, 7: 2, 8: 3, 9: 2, 10: 1}
      trace_2_curves: [[1, 0], [1, 2], [1, 3]]
      order_6_supersingular: true
      gauge_seed: [1, 0]
      gauge_units: 4
  controls:
    - Order-6 curves are labeled supersingular. Labeling any of them ordinary invalidates the run.
    - Two visit orders, A-then-B and B-then-A. They must not import each other.
    - All 25 pairs are visited. A census that skips a pair is invalid.
  independent_variables:
    - visit order
    - coefficient pair
  metrics:
    primary:
      - pairs_visited
      - nonsingular_count
      - order_multiplicities
      - trace_2_curves
      - order_6_labeled_supersingular
      - gauge_j_constant
      - implementations_agree
    secondary:
      - singular_count
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The nonsingular census, the order histogram, and the trace-2 triple.
    formula: >-
      Singular when -16(4A^3 + 27B^2) = 0. Order is 1 plus the number of
      affine points, two or one or zero according as the right-hand side is
      a nonzero square, zero, or a nonsquare. Trace t = 6 - order.
      Supersingular when 5 divides t.
    source: >-
      Design-time Python enumeration on 2026-10-01. IDEA-20260922-805a59 was
      read for the class-census requirement. No Semaev system was built.
      That enumeration is not a run of this experiment.
  scale_relevance:
    tier: toy
    justification: Prime 5. No transfer to a larger isogeny class.
    correspondence: null
  tail_checks:
    - The order-10 curve is a single pair. Both implementations must include it.
  replication:
    seeds: []
    independent_instances: 25
    replication_note: Deterministic. The second run reverses the loop order.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If a pair is skipped or an order-6 curve is labeled ordinary, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either implementation imports the other.
    - pairs_visited is not 25.
    - order_6_labeled_supersingular is false.
    - A fall degree or a discrete logarithm is reported.
  success_criterion: >-
    Both runs agree, 25 pairs are visited, 20 are nonsingular, the order
    multiplicities match, the trace-2 curves are exactly (1, 0), (1, 2),
    and (1, 3), the order-6 curves are supersingular, and all four gauge
    units preserve j of (1, 0).
  falsification_criterion: >-
    The runs agree, the visit and supersingularity gates pass, and the
    nonsingular count, the order multiplicities, or the trace-2 set differs
    from the preregistered table.
  required_artifacts:
    - experiments/EXP-DREG-44db1f/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-44db1f/runs/<RUN-ID>/command.txt
    - experiments/EXP-DREG-44db1f/runs/<RUN-ID>/stdout.log
    - experiments/EXP-DREG-44db1f/runs/<RUN-ID>/stderr.log
    - experiments/EXP-DREG-44db1f/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-DREG-44db1f/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Semaev systems and fall degrees.
    - Any prime other than 5.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
