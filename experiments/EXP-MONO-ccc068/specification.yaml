experiment:
  id: EXP-MONO-ccc068
  hypothesis_id: H-MONO-d36283
  derived_from_idea: IDEA-20260805-a9a95d
  question_id: RQ-MONO-001
  version: 1
  status: withdrawn_duplicate_never_executed
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  status_note_2026_09_04: >-
    Withdrawn per DEC-20260904-732cbe as a duplicate contract on the same
    parent proposal (IDEA-20260805-a9a95d) as EXP-MONO-c819ba, which
    already completed its own full, independently-reviewed resolution
    cycle. Never approved, never executed -- zero compute spent.

  duplication_note: >-
    STATED FIRST. A contract for the SAME parent proposal IDEA-20260805-a9a95d already
    exists as EXP-MONO-c819ba, bound to H-MONO-663fb4, also review_required. This
    contract exists only because the dispatching session assigned these identifiers; the
    drafting coordinator subagent mints none and did not choose to duplicate. A
    COORDINATOR MUST ADJUDICATE - supersede one under a decision record, or withdraw one
    - BEFORE EITHER IS APPROVED. Two contracts on one proposal is a bookkeeping failure,
    not a replication design, and approving both would double-charge a budget for one
    question.

  title: >-
    Exact second-moment character identity for factor-base decomposition counts, with
    the subgroup positive control forced to N/h - 1, at least 30 matched random
    symmetric nulls, a factor-base-size ladder required to decay, and a documentary
    reading stage that must run before any compute

  objective: >-
    The one uncertainty a run reduces is whether the relation-rate half of KN-OPEN-009 -
    GOAL-MONO-001's declared objective - is governed by the factor base's character bias
    rather than by any property of the summation cover, and whether the real
    x-coordinate factor base is distinguishable from a matched random symmetric subset
    of the same size on that statistic. A run establishes (i) whether every relayed
    cross-goal claim in the parent record survives being read against the record it came
    from, which is zero compute and can change the record's status by itself; (ii) the
    exact-identity residual at m = 1 through 4, which is forced and cannot be fitted;
    (iii) the subgroup positive control against its forced value N/h - 1, without which
    no negative may be reported from any arm; (iv) Var_real/Var_null and
    (C/F)_real/(C/F)_null at m = 3 and 4 against at least 30 matched nulls; and (v) the
    graded factor-base-size ladder, which must decay. No attack, no exponent and no
    cryptographic-scale statement follows from a run.

  what_this_is_not:
    - >-
      Not an attack and not a cost claim. A measured character bias is one term in a cost
      model; converting it into a cost would require charging relation collection AND the
      linear-algebra stage, which this contract does not do.
    - >-
      Not a closure of KN-OPEN-009. It relocates the relation-rate half to a better-posed
      quantity; the imprimitivity half belongs to a different record.
    - >-
      Not a status change to any record, goal, finding or open problem, and not a
      correction to any KN-FIND - any correction arising from the reading stage
      supersedes under a new id.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run has
      been executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE. On the pinned curve panel at p up to about 3000, for
      symmetric factor bases in the declared families and m in {1, 2, 3, 4}, with targets
      ranging over all of G: the exact identity holds to exact arithmetic; the subgroup
      control returns exactly N/h - 1; the real x-coordinate base's variance and
      normalized character bias sit at the reported RATIOS against matched random
      symmetric subsets; and the F-ladder decays. WHAT DOES NOT FOLLOW - no value of C at
      cryptographic scale; no attack; no exponent; no cost; no resolution of this
      corpus's own dispute about the analogous constant, which is REPORTED rather than
      resolved; and no closure of KN-OPEN-009.

  inputs:
    procedure: >-
      STAGE 0 (zero compute, minutes). Verify the m = 1 closed form F(N-F)/N^2
      symbolically. If the derivation fails here nothing else runs.
      STAGE 1 (zero compute, reading, HARD GATE BEFORE ANY COMPUTE). Read IN FULL every
      record the parent proposal relays rather than cites - the conservation-mean
      finding, the recorded alpha values, the decisions carrying the max-C dispute, and
      the decision bounding the spectral-gap route by |S| = O(1) - and record VERBATIM
      what each actually claims. Correct or withdraw every relayed statement accordingly.
      A finding that any is misdescribed is a deliverable in its own right and may change
      this record's status before a single cycle is spent.
      STAGE 2 (pure Python, minutes). Exhaustively compute N_m(R) for ALL R on the toy
      curves for m = 1 to 4 by direct convolution in exact integer arithmetic, and check
      the exact identity against the character-side computation with the declared
      tolerance.
      STAGE 3 (minutes). The real x-coordinate factor base against at least 30 matched
      random symmetric nulls of identical size on the same curve with the same m and the
      same target set. REPORT RATIOS, NEVER RAW STATISTICS.
      STAGE 4 (minutes). The subgroup positive control against its forced value N/h - 1,
      the coset-union second positive control at an intermediate bias, and the graded
      factor-base-size ladder over {N/16, N/8, N/4, N/2} with the decay trend and its
      sign.
      STAGE 5 (minutes). The pinned curve panel - random ordinary, CM, j = 0, j = 1728 -
      at fixed p and fixed F, with the panel spread of (C/F)_real and CM and j = 0/1728
      flagged separately.
      STAGE 6 (zero compute). Assemble the table with ordered AND multiset counts at
      every cell, and state the corpus dispute as a dispute rather than selecting a value.
    instrument: >-
      Python 3.11 with numpy; no CAS and no solver is required. The primary metric is
      computed by exhaustive convolution in EXACT integer arithmetic, using the group's
      actual structure to index characters rather than a hard-coded cyclic discrete log,
      so curves with full 2-torsion are handled correctly. The character side is computed
      in floating point only as a cross-check with a declared tolerance. Recorded through
      harness/runner.py.
    parameters: >-
      Toy primes p up to about 3000, at least four values so a trend in p is visible.
      Pinned curve panel per p - random ordinary, CM, j = 0, j = 1728. Factor-base
      families - real x-coordinate base, at least 30 matched random symmetric subsets, a
      proper subgroup of order h, a union of two subgroup cosets. Sizes F over
      {N/16, N/8, N/4, N/2}. m in {1, 2, 3, 4}. Targets - ALL R in G, exhaustively. Both
      ordered and multiset conventions at every cell. Seeds 20260825, 20260826, 20260827
      for the null draws.

  controls:
    - >-
      MATCHED NULL, SAME SHAPE, CAN FAIL. A uniformly drawn SYMMETRIC subset of E(F_p) of
      IDENTICAL size F, on the SAME curve, with the SAME m and the SAME target set, at
      least 30 draws. Var_real/Var_null and (C/F)_real/(C/F)_null are reported, never raw
      values. Nothing forces the real factor base to look random, so this control can
      fail.
    - >-
      POSITIVE CONTROL WITH AN EXACT FORCED VALUE, MANDATORY AND BLOCKING. FB = a proper
      subgroup H of order h, where N_m(R) = h^{m-1} on H and 0 off it, relative deviation
      is exactly N/h - 1 and C/F = 1. If the instrument does not reproduce this EXACTLY it
      cannot detect an exceptional factor base and NO NEGATIVE RESULT MAY BE REPORTED
      FROM ANY ARM.
    - >-
      SECOND POSITIVE CONTROL AT A REALISTIC EFFECT SIZE. A coset-union factor base whose
      spectrum is computable in closed form but whose bias is intermediate, testing
      sensitivity away from the extreme.
    - >-
      GRADED CONTROL WITH AT LEAST THREE INTERIOR POINTS AND MONOTONICITY REPORTED. F over
      {N/16, N/8, N/4, N/2} at fixed curve and m. The bound predicts decay as F grows;
      A STATISTIC THAT DOES NOT DECAY WHEN THE PARAMETER MEANT TO DESTROY IT INCREASES IS
      THE CANONICAL ARTIFACT TELL, and this ladder exists to expose exactly that.
    - >-
      CALIBRATION CONTROL DECLARED IN ADVANCE NOT TO BE EVIDENCE. m = 1 gives F(N-F)/N^2
      for every set, so real and null agree by construction. Its passing is recorded as a
      PASS OF THE CALIBRATION and may NEVER be reported as a null result - the failure
      mode of a control that cannot fail is catalogued in this corpus as a live defect.
    - >-
      CONVENTION CONTROL. Ordered tuple counts AND multiset counts at every cell, because
      convention conflation is the most likely explanation of a spurious factor in this
      exact lane.
    - >-
      READING GATE. STAGE 1 must complete before any compute. Every cross-goal statement
      in the parent record is relayed and unverified, and proceeding on the relayed
      version would build a measurement on an unread claim.

  independent_variables:
    - m in {1, 2, 3, 4}
    - 'factor-base family: real x-coordinate / matched random / subgroup / coset union'
    - factor-base size F over the ladder
    - 'curve class: random ordinary / CM / j = 0 / j = 1728'
    - p
    - 'counting convention: ordered versus multiset'

  metrics:
    primary:
      - >-
        Exact-identity residual per (curve, factor base, m), computed as the absolute
        difference between the convolution-side variance and the character-side
        expression, both computed independently; reported absolute at m = 1 and relative
        at m >= 2.
      - >-
        Var_real over Var_null at m = 3 and 4, computed as the real base's variance
        divided by the mean variance over at least 30 matched null draws, with the null
        draws' standard deviation reported beside it.
      - >-
        (C/F)_real over (C/F)_null, computed the same way, where C is the maximum over
        nontrivial characters of |Shat| and F is the base size.
      - >-
        Subgroup-control relative deviation, max_R |N_m(R)/(F^m/N) - 1|, against the
        forced value N/h - 1, reported as an exact comparison.
      - >-
        Graded F-ladder trend, the relative deviation at each of the four sizes together
        with the SIGN of its change, which must be decreasing.
      - >-
        Curve-panel spread of (C/F)_real, the coefficient of variation across the panel at
        fixed p and F, with CM and j = 0/1728 flagged individually.
    secondary:
      - C, F and C/F for the real and null arms, per cell.
      - C/sqrt(F) and its trend in p, as the HEUR-CHR-2 validation.
      - Ordered and multiset counts at every cell, and their ratio against the combinatorial prediction.
      - The coset-union control's measured bias against its closed form.
      - The STAGE 1 reading record - what each relayed source actually says, verbatim.
      - Wall time and peak memory per cell.

  heuristic_under_test: HEUR-CHR-2
  heuristic_under_test_note: >-
    The contract validates HEUR-CHR-2 of H-MONO-d36283 - square-root cancellation for the
    full x-coordinate factor base - by MEASURING C directly on the pinned panel at
    several p and reporting C/sqrt(F) and its trend, rather than by selecting a value from
    a corpus that carries several inconsistent ones. HEUR-CHR-1 and HEUR-CHR-3 are also
    exercised: the first by the forced m = 1 residual, the third by the ordered-versus-
    multiset convention arm. The heuristic-validation obligations - the heuristic stated
    formally and numbered, a pre-registered prediction with its source, sample size
    derived from the smallest quantity to be resolved, a comparison metric with tail
    checks, and a synthetic control on matched uniform objects - are met by the numbered
    statements on the hypothesis, the preregistered_prediction block below, the 30-draw
    null with its stated spread, the ratio metrics with the tail checks listed, and the
    matched random symmetric subset respectively.

  preregistered_prediction:
    quantity: >-
      Var_real/Var_null at m = 3 and 4, and (C/F)_real/(C/F)_null, on the real
      x-coordinate factor base against at least 30 matched random symmetric subsets.
    formula: >-
      Var_real/Var_null predicted within [0.7, 1.4]; (C/F)_real/(C/F)_null predicted
      1.00 plus or minus 0.15. Under the alternative that the factor base is structurally
      biased, the ratio exceeds 1.5 and that is the exceptional-locus signal in the
      correct argument slot; below 0.7 the base is MORE uniform than random, which is also
      a finding. The subgroup control's forced value is exactly N/h - 1, derived before
      the run - for instance exactly 1 at h = N/2 and exactly 3 at h = N/4.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-a9a95d predictions block and
      restated in H-MONO-d36283 before any run under this contract exists. The forced
      values come from the derivation in that record's mechanism, not from any
      measurement. Never tuned to data.

  scale_relevance:
    tier: toy
    justification: >-
      Executed at p up to about 3000 because the primary metric is an EXHAUSTIVE
      convolution over all targets in exact arithmetic - the design refuses a sampled
      variance where an exact one is affordable, and exactness is what makes the m = 1
      calibration unfakeable. THE IDENTITY IS SCALE-FREE and may be cited as a derivation
      at any scale; THE MEASURED BIAS IS TOY and no measured C may be extrapolated. The
      transfer assumption is stated and is narrow, and is deliberately NOT used: the
      barrier reading for the full x-coordinate base at cryptographic scale is
      conditional on HEUR-CHR-2, which this contract measures rather than assumes.
    correspondence: >-
      The identity is a statement about a finite abelian group and does not mention the
      curve, so its FORM transfers unchanged to the extension-field setting; its measured
      VALUES do not transfer anywhere, and the two must not be conflated.

  tail_checks:
    - >-
      Report the null draws' standard deviation beside every ratio; a ratio inside [0.7,
      1.4] whose null spread is itself 0.5 wide has not established anything.
    - >-
      Report the smallest and largest null draw, not only the mean, since C is a maximum
      over characters and maxima have heavy upper tails.
    - >-
      Report the number of characters achieving within 1 percent of C, since a C attained
      by a single character is a different object from one attained by many.
    - >-
      Report the m = 1 residual per cell explicitly and label it CALIBRATION, so its
      passing can never be counted as a null result.
    - >-
      Report the F-ladder's sign at every step, not only its endpoints; a non-monotone
      ladder with matching endpoints would pass a two-point check and fail the real one.

  replication:
    seeds: [20260825, 20260826, 20260827]
    independent_instances: 3
    repeat_count_per_cell: 1
    note: >-
      The measured statistic on the real factor base is deterministic given the curve, so
      seeds vary the null ensemble. At least 30 null draws are taken per cell, which is
      where the variability that the ratios are judged against lives; three seeds give
      three independent ensembles for a stability check on the ensemble itself.

  budget:
    wall_clock_seconds: 3600
    wall_clock_seconds_note: Per run. total_cpu_hours bounds the whole contract.
    total_cpu_hours: 3.0
    memory_gb: 8
    maximum_runs: 30

  stopping_rules:
    - >-
      Stop the entire contract if the exact identity fails at any m in exact arithmetic,
      and report only that; the derivation or the implementation is wrong.
    - >-
      Stop and report if the subgroup positive control does not return exactly N/h - 1.
      The instrument is broken and NO NEGATIVE MAY BE REPORTED FROM ANY ARM.
    - >-
      Do not proceed past STAGE 1 on the relayed version of any cross-goal claim. A
      relayed claim that cannot be checked because the record is unreadable is reported
      as unchecked and the dependent statement is withdrawn, not assumed.
    - >-
      Truncate the p panel at the largest p reached within budget and report the trend as
      weakened. A budget stop is never a negative result (AGENTS.md rule 5).
    - Stop at maximum_runs or total_cpu_hours, whichever binds first.

  invalidation_rules:
    - >-
      A timeout, crash or memory exhaustion makes the run failed_infrastructure and is
      NEVER negative evidence about the statistic.
    - >-
      A run in which the matched null arm was not executed in the same invocation as the
      real arm is invalid_measurement.
    - >-
      A run reporting RAW statistics rather than ratios against the matched null is
      invalid_measurement, because the comparison this contract exists to make was not
      made.
    - >-
      A run in which the subgroup positive control was not executed is
      invalid_measurement; a negative from any other arm is then uninterpretable.
    - >-
      A run whose character indexing assumes a cyclic group is invalid_measurement on any
      curve with full 2-torsion.
    - >-
      A run reporting only one counting convention is invalid_measurement, since the
      convention is exactly where this lane suspects an existing double count.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and
      requires a new contract.

  success_criterion: >-
    ALL of the following, each decidable from the primary metrics. (1) STAGE 1 completed
    and every relayed cross-goal statement recorded as confirmed, corrected or unchecked.
    (2) The exact-identity residual is 0 at m = 1 in exact arithmetic and below 1e-10
    relative at m = 2, 3, 4 at every cell. (3) The subgroup positive control returns
    relative deviation exactly N/h - 1 and C/F = 1. (4) The graded F-ladder decays
    monotonically. (5) At least 30 matched null draws were computed per cell in the same
    invocation, and every reported quantity is a ratio with its null spread. A run meeting
    (1) to (5) is VALID, and its verdict on H-MONO-d36283 (M4) is then read directly:
    (M4) is SUPPORTED IN SCOPE if Var_real/Var_null lies in [0.7, 1.4] at m = 3 and 4 and
    (C/F)_real/(C/F)_null lies in [0.85, 1.15] at every cell, and is FALSIFIED otherwise.

  falsification_criterion:
    - >-
      The exact identity failing at any m falsifies (M1); the record is withdrawn by a
      superseding record, never repaired.
    - >-
      The subgroup control not returning exactly N/h - 1 falsifies the INSTRUMENT; no
      result from any arm is reportable.
    - >-
      Var_real/Var_null outside [0.7, 1.4] at m = 3 or 4 with all controls passing
      FALSIFIES (M4) and is the positive outcome the goal was created to find - a
      relation-rate deviation in the factor base. It is listed here rather than as a hope
      because the record predicts no deviation.
    - >-
      The F-ladder failing to decay while the controls pass falsifies the reduction (M3):
      the measured quantity is not the one the bound governs.
    - >-
      A CM or j = 0 curve standing beyond 3 sigma of the random-ordinary panel falsifies
      the curve-independence reading and requires independent replication before any
      status change.
    - >-
      Measured C/sqrt(F) trending upward in p falsifies HEUR-CHR-2, which withdraws the
      barrier reading of consequence (M3) entirely.
    - >-
      A STAGE 1 reading showing the conservation mean is not the ordered mean F^m/N under
      any convention falsifies HEUR-CHR-3 and the identification of N_m with the relation
      rate must be redone.

  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - the STAGE 1 reading record, quoting verbatim what each relayed source actually claims
    - raw-result.json with per-cell residuals, variances, C values and both counting conventions
    - the at-least-30 matched null draws per cell, in the same file as the real arm
    - the subgroup and coset-union positive controls' measurements, with their forced values beside them
    - the graded F-ladder with its per-step sign
    - the curve-panel table with CM and j = 0/1728 flagged separately
    - C/sqrt(F) and its trend in p, as the HEUR-CHR-2 validation output

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and NOT
      approved; approved_by is null and execution_authorized is false. Approval is the
      USER's gate because it authorizes execution and spends compute.
    - >-
      DUPLICATION MUST BE ADJUDICATED FIRST. EXP-MONO-c819ba covers the same parent
      proposal. One must supersede or be withdrawn under a decision record before either
      is approved.
    - >-
      STAGE 1 IS A HARD GATE. No compute may proceed on the relayed version of any
      cross-goal claim.
    - >-
      The subgroup positive control must remain in the frozen protocol; without it no
      negative from any arm is interpretable.
    - >-
      GOAL-MONO-001's status and campaign budget are not asserted here. Batch assignment
      and any budget reopening are Coordinator acts and are not performed by this contract.

  derivation_provenance:
    tool: coordinator subagent, /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260805-a9a95d
    authored_at: '2026-08-25'
    note: >-
      Every stage, control, metric and forced value is taken from the parent proposal's
      mechanism, minimal_test, controls, predictions and falsification_conditions blocks.
      The parent record also carries a SESSION-COMPUTED note - a pure-Python check of the
      variance identity on a cyclic group of order 31 while the record was being written -
      which is explicitly NOT a run, has no manifest and is not evidence; it is not cited
      here as support and STAGE 2 re-derives the check in-harness. Budgets come from the
      parent's estimated_cost (implementation low, compute low). No measurement, timing,
      run or citation is invented.

  derivation_gaps:
    - >-
      The exact toy primes and the exact curve panel are not fixed here; the contract
      fixes the RULE (four p values, four curve classes) and the achieved panel must be
      recorded, since a panel spread quoted over an unrecorded panel is not checkable.
    - >-
      Whether 30 null draws give a spread tight enough to make the [0.7, 1.4] band
      decidable is not known in advance. If the null spread swallows the band, the honest
      outcome is that the measurement cannot discriminate, and more draws - not a wider
      band - is the response.
    - >-
      The corpus's own dispute about the analogous character-sum constant is REPORTED, not
      resolved, by this contract. A reader wanting a value will not find one here, and
      that is deliberate.
    - >-
      The identification of N_m with the collected relation rate (HEUR-CHR-3) is settled
      by reading at STAGE 1, not by measurement. If the reading is ambiguous, the
      dependent consequences of the reduction must be reported as conditional on an
      unsettled identification.
