  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 4
    maximum_runs: 3
    budget_feasibility_note: >-
      DERIVED BY ARITHMETIC ON COMMITTED FIGURES AND LABELLED AN ESTIMATE, NOT A
      MEASUREMENT. The dominant cost is not the random draws but the clearing of one
      N-length boolean array per replicate. The 48-tuple primary arm is HALF the
      byte-clear work of EXP-YIELD-002's two 48-tuple arms, whose committed figure
      is 8.05e8 byte-clears, so about 4.0e8 here. The high-precision block is 10
      tuples in 2 legs at 10000 replicates - the four m = 3 tuples contribute the
      committed 1.70e10 byte-clears and the six m = 2 tuples contribute about
      1.74e10, for about 3.44e10 in total, roughly twice the committed block. The
      known-answer arm operates at N = 11 and is negligible. Total random draws are
      below 5.2e8. Peak memory is one boolean array of length at most 261707, i.e.
      below 0.3 MB, plus the parsed input documents, so the 4 GB cap is not
      approached. EXP-YIELD-002's three runs together consumed a MEASURED 15.0
      seconds; on the byte-clear ratio this contract is ESTIMATED at of order 30
      seconds in total, against a per-run cap of 600 seconds. ALL FIGURES IN THIS
      NOTE ARE ESTIMATES OR QUOTED MEASUREMENTS AS MARKED, AND THEY ARE MAGNITUDES.
      A run that cannot finish inside its cap STOPS AND REPORTS a bounded partial
      result naming exactly which tuples it did not reach, under IV-5; it must not
      overrun silently and must not compress by fabricating a figure.

