      - id: IN-3
        path: experiments/EXP-YIELD-002/runs/RUN-YIELD-002-NULL-REPAIRED/results.json
        bound_commit: c7189f80225bad0d0d2aa28cbbbb11e672d30dd6
        sha256: 73bb3ae1a8b1b9fffa4b1f83e76b12738efbbacb5a60631781b4cad3a61dcaf8
        role: >-
          THE REPLICATION REFERENCE, AND IT SUPPLIES NO PARAMETER. It supplies the
          committed EXP-YIELD-002 repaired arm's per-tuple z_sem vector and its
          derived per-tuple seeds, used for exactly two purposes - the per-tuple
          replication difference delta_z of observation OM-7, which feeds nothing,
