experiment:
  id: EXP-YIELD-003
  hypothesis_id: null
  hypothesis_id_note: >-
    NULL AND DELIBERATELY SO. EXP-YIELD-003 TESTS NO HYPOTHESIS. It is a
    REPLICATION, under a fresh master seed, of the primary arm of EXP-YIELD-002,
    which was itself an INSTRUMENT CONTROL ON EXP-YIELD-001's control object
    CTRL-NULL-SUMSET. The only thing it can address is whether ONE POST-HOC
    AGGREGATE STATISTIC of that instrument reproduces under a different random
    stream. H-YIELD-001 is named here ONLY as the hypothesis this experiment
    CANNOT MOVE IN EITHER DIRECTION, and it stays at `specified` under every
    outcome. H-IC-001, H-STR-002 and H-SUBRES-001 stay `weakened`, with
    DEFER-BATCH009-001's undischarged EXP-STR-004 replication obligation still
    binding H-STR-002's next transition in either direction; H-ENDO-001 stays
    `approved`, which carries no evidential standing; H-GGM-001 stays
    `specified`; H-FCP-001 stays `analyzed`. No hypothesis record is read,
    written, created or cited as moved by this contract.

  heuristic_under_test: null
  heuristic_under_test_note: >-
    NULL. No heuristic is under test. HEUR-1, the counting heuristic B^m/(m! p),
    is NOT tested, NOT validated, NOT weakened, and is not a measured quantity
    anywhere in this contract.

  version: 1
  title: >-
    Fresh-master-seed re-execution of the EXP-YIELD-002 repaired-null arm at the
    48 declared parameter tuples, with the DEV-4 seed-string defect repaired and
    the high-precision block extended to six pre-registered m = 2 tuples,
    reporting the mean, standard deviation and standard error of z_sem over the
    48 tuples as an observation feeding no criterion

  status: review_required
  status_note: >-
    `review_required` AND NOT `approved`, AND THIS FILE WILL NEVER SAY OTHERWISE.
    This contract is frozen by TASK-20260729-031, snapshot-committed by
    TASK-20260729-032, and receives an INDEPENDENT NON-ORIGINATING PRE-EXECUTION
    REVIEW at TASK-20260729-033 before any compute is spent. NO RUN OF THIS
    CONTRACT IS AUTHORIZED BY ITS EXISTENCE. The contract in force at execution is
    the COMMITTED BLOB at the TASK-20260729-032 commit, not the working-tree file.

  approval_determination_location:
    why_this_block_exists: >-
      STRUCTURAL PROPHYLAXIS AGAINST CARRIED DEFECT D-1, WHICH THIS PROGRAM CANNOT
      REPAIR AND MUST NOT REPEAT. experiments/EXP-YIELD-001/specification.yaml
      still reads `status: review_required` with `approved_by: null` at its
      snapshot commit 82327a02bb3041af70566a3f8edfb4468dd2d52d even though its own
      execution gate was met by committed records, because the transition was
      never recorded anywhere and the file is immutable. That defect is
      UNREPAIRED, is not repaired by this contract, and its only correct
      resolution is DEC-20260729-001's experiment_status_transition block. The
      same prophylaxis was applied to EXP-YIELD-002 and IT WORKED: that file also
      reads `review_required` with `approved_by: null` by design, and its APPROVED
      determination lives in the TASK-20260729-030 snapshot receipt at
      5174001c37cc6e3b27fb468e0742d7732976a5de and in DEC-20260729-002.
    the_route_declared_in_advance: >-
      THE APPROVAL DETERMINATION FOR EXP-YIELD-003 IS NOT A FIELD IN THIS FILE AND
      MUST NOT BE SOUGHT HERE. It is recorded in TWO separate, appendable,
      hash-bound artifacts, the first of which is PRE-EXECUTION - (1) the
      TASK-20260729-034 snapshot_commit_receipt.json, which records the
      Coordinator's determination VERBATIM AND AT THE MOMENT IT IS MADE, together
      with every pre-dispatch condition TASK-20260729-033 imposes, and which is
      committed BEFORE TASK-20260729-035 is dispatched and therefore before any
      draw exists; and (2) DEC-20260729-003, as a formal
      experiment_status_transition block.
    do_not_misread_the_null: >-
      STATED IN THIS FILE'S OWN TEXT BECAUSE A READER OF THIS BLOB ALONE WILL
      OTHERWISE DRAW THE WRONG CONCLUSION. `status: review_required` and
      `approved_by: null` are FROZEN VALUES BY DESIGN. THEY ARE NOT EVIDENCE THAT
      THIS CONTRACT WAS NEVER APPROVED, and a later approval is NOT a licence to
      edit either field. A receipt that records NOT APPROVED is read as NOT
      APPROVED; no later record may attribute an APPROVED determination to a
      receipt that does not carry it.
    this_file_is_never_edited: >-
      experiments/EXP-YIELD-003/specification.yaml is frozen at `review_required`
      with `approved_by: null` and IS NEVER EDITED AFTER TASK-20260729-032 COMMITS
      IT, under any outcome, including approval. The substantive gate is a PASS at
      TASK-20260729-033; a REVISE verdict authorizes no run.

  objective: >-
    Discharge ONE condition and nothing else. RT-20260729-021 made its own reading
    of the single unexplained observation in BATCH-012 - the aggregate z_sem mean
    of +0.361024 over the 48 declared tuples, against a standard error of 0.140729
    - CONDITIONAL ON RC-21A BEING DISPATCHED FIRST. RC-21A was not dispatched, the
    BATCH-012 budget being consumed, so DEC-20260729-002 recorded the shift as
    UNEXPLAINED AND UNREPLICATED and ADOPTED NO EXPLANATION FOR IT, on the red
    team's own stated terms. EXP-YIELD-003 re-executes the same repaired arm at the
    same 48 tuples under a fresh master seed so that the mean, standard deviation
    and standard error of z_sem over the 48 tuples exist a second time, under an
    independent stream, as OBSERVATIONS FEEDING NO CRITERION.

  what_this_contract_exists_to_do_and_nothing_else: >-
    STATED FIRST AND NOT SOFTENED. THIS CONTRACT EXISTS TO DISCHARGE THE CONDITION
    NAMED IN THE OBJECTIVE ABOVE AND NOTHING ELSE. It answers no question about
    decomposition yield, moves no hypothesis, moves no exponent, tests no
    heuristic, and resolves no research question. It is INSTRUMENT MAINTENANCE. Its
    own pre-registered resume condition, carried verbatim below, states that NO
    CONCLUSION ABOUT THE PROCESS IS DRAWN FROM IT EITHER WAY. Recording it as
    anything more would be the failure mode this program exists to avoid.

  admission_and_ceiling: >-
    CARRIED AND BINDING ON EVERY DOWNSTREAM RECORD.
    EXP-YIELD-003 IS NOT AN EXPONENT-DECIDING SCREEN AND IS NOT EVEN AN INSTRUMENT
    CONTROL ON A CONTROL. IT IS A REPLICATION OF AN INSTRUMENT CONTROL ON A
    CONTROL, admitted under docs/target-result-profile.md rule A1's building-block
    clause only because an unexplained systematic offset in a control the program
    intends to reuse is a defect in a building block. IT MOVES NO EXPONENT AND
    CANNOT MOVE ONE, and no later record may quote any part of it as target-class,
    as an exponent result, as an attack, as an attack improvement, as a
    cryptanalytic result, as a closure or as an impossibility claim.
    ITS CLAIM TIER IS CAPPED AT TOY. It CAN MEET NO COMPLETION CRITERION OF
    GOAL-ECDLP-001 UNDER ANY OUTCOME. It changes no hypothesis status. It COMPUTES
    NO OCCUPANCY-NORMALISED EFFICIENCY E AND NO YIELD RATIO R, and no such figure -
    including the value 0.85, which appears in the committed EXP-YIELD-001 v2
    amendment clause C-3 as a HYPOTHETICAL WORKED CASE and never as a measurement -
    is computed, quoted or reported anywhere in this contract, in its driver, in
    its run records, or in any record derived from them.
    IT DOES NOT UN-FIRE INV-4 AND DOES NOT RE-DISPOSE IT. INV-4 fired at 4 of the
    49 criterion-evaluable cells of the BATCH-011 package and that firing stands
    untouched under every outcome here. It DECLARES INV-5 NEITHER FIRED NOR NOT
    FIRED. No branch of the EXP-YIELD-001 v2 outcome_disposition_table is evaluated
    by it.
    IT TOUCHES NO COST MODEL, AND NO OUTCOME OF IT YIELDS ANY COST-MODEL
    CONSEQUENCE WHATEVER. No index-calculus cost model is re-charged, flagged or
    defended.
    All four asymptotic-claim promotion gates in agents/coordinator.md remain OPEN
    and none is attempted, because there is no asymptotic claim here to gate. No
    closure quorum is claimed or claimable (INT-BATCH013-D). A TIMEOUT, CRASH,
    RESOURCE EXHAUSTION OR IMPLEMENTATION FAILURE IS INFRASTRUCTURE SIGNAL AND IS
    NEVER A NEGATIVE MATHEMATICAL RESULT about P_pred, about the shift, about the
    diagnostic, about the occupancy null, about decomposition yield or about
    anything else. NON-EXECUTION IS NEVER RECORDED AS A RESULT.

  there_is_no_success_criterion_and_that_is_the_design:
    statement: >-
      EXP-YIELD-003 HAS NO SUCCESS CRITERION AND NO FALSIFICATION CRITERION ON ITS
      PRIMARY QUANTITY, AND THAT IS DELIBERATE RATHER THAN AN OMISSION. The mean,
      the standard deviation and the standard error of z_sem over the 48 declared
      tuples are OBSERVATIONS FEEDING NO CRITERION. No verdict, no branch, no
      invalidation rule, no threshold and no hypothesis transition depends on the
      value of the replicated z_sem mean.
    why: >-
      THE WHOLE POINT IS THAT THE STATISTIC IN QUESTION FIRES NOTHING AND NEVER
      DID. In EXP-YIELD-002 the aggregate z_sem mean was a POST-HOC TAIL-CHECK
      OBSERVATION, outside all four criteria, and DEC-20260729-002 rationale R-8
      records that it did not damage and could not have manufactured the realised
      branch. Giving its replication a criterion would invent a test that the
      original never had, and would let a batch of instrument maintenance be
      reported as a decisive measurement. IT IS NOT ONE.
    what_this_contract_does_carry_instead: >-
      TWO THINGS AND NO MORE. FIRST, INVALIDATION RULES, which are INTEGRITY CHECKS
      ON THE RUN and not criteria of any hypothesis or of any statistic. SECOND,
      the RESUME CONDITION carried verbatim below, which disposes of an INSTRUMENT
      NOTE and of nothing else.
    no_criterion_may_be_added_later: >-
      No threshold, acceptance region, band, window, decision rule or
      pass-or-fail reading may be attached to the replicated z_sem mean, its sd,
      its SEM, its sign count, the high-precision block, or any quantity derived
      from them, by the run records, by the reviews, by EV-ECDLP-010, by
      DEC-20260729-003 or by any later record. Attaching one would be a post-hoc
      success criterion, which agents/coordinator.md forbids without a versioned
      protocol_amendment recorded before the change.

  resume_condition_carried_verbatim_from_DEC_20260729_002_NA_1:
    text: >-
      If the replicated mean is within about 0.14 SEM of zero, the shift is
      recorded as chance and closed. If it reproduces above about +0.25 SEM, the
      driver, the numpy build and the platform become the objects of the next
      control. NO CONCLUSION ABOUT THE PROCESS IS DRAWN FROM IT EITHER WAY, and no
      conclusion about decomposition yield is drawn from it in any case.
    it_is_carried_verbatim_and_is_not_narrowed: >-
      The text above is quoted VERBATIM from ledger/decisions/DEC-20260729-002.yaml
      next action NA-1, field resume_condition_stated_in_advance, and from the
      BATCH-013 dispatch_queue.json block of the same name. It is not weakened, not
      paraphrased, not narrowed, and carries no escape clause.
    what_it_disposes_of: >-
      AN INSTRUMENT NOTE, AND NOTHING ELSE. It disposes of one unexplained
      aggregate statistic of one curve-free control process. It disposes of no
      hypothesis, no research question, no efficiency, no cost model, no census
      reading and no yield claim. Its own last sentence says so.
    the_unassigned_region_is_named_and_is_recorded_as_inconclusive: >-
      NAMED BEFORE DATA SO THAT IT CANNOT BE ASSIGNED AFTER IT. The two named
      branches do not cover the line. The first branch covers a replicated mean in
      the closed interval from about -0.14 to about +0.14; the second covers a
      replicated mean above about +0.25. TWO REGIONS ARE ASSIGNED TO NEITHER
      BRANCH - the half-open interval above about +0.14 and at most about +0.25,
      and everything below about -0.14. A REPLICATED MEAN IN EITHER UNASSIGNED
      REGION IS RECORDED AS INCONCLUSIVE ON THE SHIFT. It is NEVER rounded,
      argued or assimilated to the nearer named branch, and it is never reported
      as a reproduction or as a closure. This clause adds no branch and moves no
      threshold; it names the gap the resume condition leaves and fixes its
      disposition before the number exists.
    it_is_not_a_criterion: >-
      The resume condition is a rule about WHAT THE PROGRAM DOES NEXT with an
      instrument note. It is not a success criterion, not a falsification
      criterion, and not a test of anything. Its two numeric thresholds - about
      0.14 and about +0.25 - are the ONLY numeric dispositions in this contract and
      both are carried verbatim from DEC-20260729-002 NA-1 rather than chosen here.

  the_constrained_sentence_binding_every_record_this_contract_produces: >-
    NO RECORD MAY SAY THE REPAIRED NULL LANDS ON P_pred. IT LANDS AT OR SLIGHTLY
    ABOVE IT, by an amount larger than the declared second-order biases account
    for and, on the committed record as it stands, unexplained. This constraint is
    adopted from DEC-20260729-002 rationale R-8 and from RT-20260729-021 objection
    RT21-6, and it binds this contract, its driver, its three run records, its
    results summary, EV-ECDLP-010 and DEC-20260729-003.

  instrument_independence:
    zero_curve_arithmetic: >-
      ZERO CURVE ARITHMETIC IS SPECIFIED ANYWHERE IN THIS CONTRACT AND NONE MAY BE
      IMPLEMENTED. No elliptic-curve point addition, no doubling, no scalar
      multiplication, no curve-order computation, no curve selection, no generator
      selection, no discrete-logarithm table, no factor base, no sum set, no
      census, no summation polynomial, no Groebner basis and no polynomial system
      solve. The experiment is a BALLS-IN-BINS SIMULATION OVER THE INTEGER RESIDUE
      UNIVERSE from 0 to N-1 on already-recorded integer parameters. If the driver
      needs a curve operation to satisfy any clause of this contract, the clause is
      defective and the Executor STOPS AND REPORTS under ST-3 rather than
      implementing one.
    forbidden_imports: >-
      THE DRIVER MUST NOT IMPORT, EXECUTE, OR READ INTO ITSELF any curve code or
      any part of the EXP-YIELD-001 or EXP-YIELD-002 instruments as CODE. Named
      explicitly for this contract - harness/endomorphism_la.py, every other module
      under harness/, everything under tools/, everything under orchestration/,
      experiments/EXP-YIELD-001/driver/yield_census.py and
      experiments/EXP-YIELD-002/driver/repaired_null.py. The permitted dependencies
      are the Python standard library and numpy, and nothing else. Reading the
      committed JSON DATA files named under `inputs` is permitted and required;
      importing or executing any Python file other than the single driver is not.
    RC_F_position_carried_unchanged: >-
      RC-F IS UNDISCHARGED AND THIS CONTRACT DOES NOT DISCHARGE IT, DOES NOT CLAIM
      TO, AND MAKES NO PROGRESS ON IT. Its resume condition is unchanged - either
      commit the SHA-256 of the pre-dry-run BATCH-011 driver, or have a session
      that has read NEITHER that driver NOR the EXP-YIELD-002 contract text
      re-derive the antipodal occupancy null from the EXP-YIELD-001 v2 clause C-4
      text alone and reproduce the four recorded failing cells. THE NON-DISCHARGE
      IS ENDORSED by VAL-20260729-001 NARROW-6 and by RT-20260729-021 RT21-10 and
      is not re-argued here. This contract makes the position no better, and it
      makes it no worse either - it re-executes a process the Coordinator
      transcribed, so nothing in it is an independent re-derivation, and NO CARD IN
      BATCH-013 MAY DECLARE RC-F DISCHARGED.
    RC_B_position_carried_unchanged: >-
      RC-B IS OPEN AND IS UNTOUCHED AND UNTOUCHABLE BY THIS CONTRACT. It is the
      multi-curve control at the out-of-band cells - re-run the census at k = 12,
      m = 3 at the two out-of-band factor bases on at least 20 further prime-order
      curves over p = 4099 under the same deterministic interval rule - and it is
      the ONLY control separating an interval-structure effect at small N from a
      property of the single curve y^2 = x^3 + 4x + 8. It requires curve compute and
      this contract specifies zero. Carried as DEFER-BATCH012-001, unretracted.

  inputs:
    binding_rule: >-
      AN INPUT THAT IS NOT HASH-BOUND IS NOT AN INPUT. Every quantity this
      experiment consumes is read from one of the files below, and the driver
      VERIFIES the SHA-256 of each file before reading it. A hash mismatch fires
      IV-1 and no run of this contract is evidence.
    hash_provenance_statement: >-
      THE THREE SHA-256 VALUES BELOW ARE QUOTED FROM COMMITTED RECEIPTS AND
      COMMITTED SUMMARY FILES AND WERE NOT COMPUTED BY THE AUTHORING SESSION, WHICH
      HAS NO SHELL. IN-1 and IN-2 are quoted from the committed EXP-YIELD-002
      specification at f291a624610458fc7ad40b5cf174447517ce97e5, which in turn
      quotes the TASK-20260729-006 receipt binding the BATCH-011 package at
      2fb2bb7a111d999859612e52990eea7dc6bbac1a. IN-3 is quoted from the committed
      experiments/EXP-YIELD-002/results/summary.json field
      source_results_files.REPAIRED.sha256 at commit
      c7189f80225bad0d0d2aa28cbbbb11e672d30dd6. IF ANY QUOTED HASH DOES NOT MATCH
      THE FILE AS READ, IV-1 FIRES AND THE RUN STOPS AND REPORTS - a mismatch is
      never repaired in flight and never assumed to be a transcription slip.
    files_read:
      - id: IN-1
        path: experiments/EXP-YIELD-001/runs/RUN-YIELD-001-NULL-RANDOM-SUMSET/results.json
        bound_commit: 2fb2bb7a111d999859612e52990eea7dc6bbac1a
        sha256: 040207f85a3444a3377cdf5c86175fb70de6e47280f91c09a516f7a65d2125cd
        role: >-
          THE PRIMARY AND SUFFICIENT PARAMETER INPUT, UNCHANGED FROM EXP-YIELD-002.
          Its `cells` array IS the 49 criterion-evaluable cells of the BATCH-011
          package. Per cell it supplies k, p, N, beta, m, L, B, C_red,
          C_red_is_even, replicates, P_pred, the antipodal arm's mean and sd and
          relative_sd and both z values, lambda_C_red_over_N, the
          P_pred_decomposition block carrying S_m_minus_2_used, exp_minus_lambda
          and S_m_minus_2_term, and the per-cell DERIVED SEEDS of the BATCH-011
          run under master seed 110501.
      - id: IN-2
        path: experiments/EXP-YIELD-001/results/summary.json
        bound_commit: 2fb2bb7a111d999859612e52990eea7dc6bbac1a
        sha256: 2287b277b6f6ce842230ca13bf1217a8ba34cc6da1d2d362123502810f7b2aeb
        role: >-
          CROSS-CHECK ONLY. It supplies n_evaluable_on_measured_B = 49 and
          n_eval_denominator = 49, against which the driver checks that IN-1's
          cells array carries exactly 49 entries. It supplies no quantity that IN-1
