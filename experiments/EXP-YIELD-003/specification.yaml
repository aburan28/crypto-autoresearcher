      - >-
        the committed BATCH-011 antipodal mean and sd per cell, and the committed
        EXP-YIELD-002 repaired-arm z_sem per tuple - QUOTED. SAMPLED in origin,
        QUOTED here, and labelled SAMPLED wherever reported.
      - >-
        the replicated mean and sd at every tuple, every z statistic this contract
        computes, and every high-precision block quantity - SAMPLED by Monte
