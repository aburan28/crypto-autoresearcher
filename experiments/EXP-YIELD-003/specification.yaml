  declared_cell_set:
    rule_RC_C: >-
      RC-C BINDS UNCHANGED AND THE 48 TUPLES ARE THE SAME 48. The declared set is
      the 49 criterion-evaluable cells of the BATCH-011 package, DE-DUPLICATED ON
      MEASURED B WITHIN EACH (k, m) COLUMN, so that the declared count counts
      DISTINCT FACTOR-BASE PARAMETER TUPLES. Exactly one duplicate exists in the
      package and the merge turns 49 into 48.
    merged_cells_named: >-
      (k = 12, beta = 0.325, m = 3) AND (k = 12, beta = 0.350, m = 3) ARE MERGED.
      Both have p = 4099, N = 4001, identical measured B = 22, identical
      C_red = 1782, identical S_1 size 22 and identical P_pred =
      1452.1510155838187, so they select the same factor base and are one
      parameter tuple. No other pair of cells in the package shares a measured B
      within its (k, m) column.
    merged_tuple_reference_rule: >-
      UNCHANGED FROM EXP-YIELD-002 AND CARRIED FOR CONTINUITY. For the merged tuple
      T-12-3-B22 the binding committed reference is the FIRST-LISTED occurrence in
      IN-1's cells array, namely the beta = 0.325 entry, with committed mean
      1438.82 and committed sd 20.207699302768514 at 100 replicates. The tuple is
      DRAWN ONCE, not twice, which is what de-duplication means, and its seed
      string uses round(beta x 1000) = 325.
    declared_tuple_count: 48
    declared_tuple_count_is_a_count: >-
      PRED-ID, EXTENDED. `48` IS A COUNT. The 48 members are NAMED INDIVIDUALLY in
      section 2 of the observation feasibility table at
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-013/tasks/TASK-20260729-031/observation_feasibility_table.md,
      which is MANDATORY READING for the reviewer and for any reader of a result.
      No statement anywhere in this contract or in any record derived from it
      settles a set question on this count.
    tuple_naming: >-
      Each declared tuple carries the immutable label T-k-m-BB formed as
      T-<k>-<m>-B<B>, which is unique across the declared set and is identical to
      the label EXP-YIELD-002 used for the same tuple.
    split_by_arity: >-
      29 tuples at m = 2 and 19 tuples at m = 3, totalling 48. BOTH FIGURES ARE
      COUNTS and both member lists are named in observation feasibility table
      section 2.
    the_four_INV_4_failing_tuples_named_and_reported_separately:
      - 'T-18-3-B16 - k = 18, beta = 0.200, m = 3, N = 261707, B = 16, C_red = 688'
      - 'T-16-3-B16 - k = 16, beta = 0.225, m = 3, N = 65633, B = 16, C_red = 688'
      - 'T-18-3-B24 - k = 18, beta = 0.225, m = 3, N = 261707, B = 24, C_red = 2312'
      - 'T-18-3-B28 - k = 18, beta = 0.250, m = 3, N = 261707, B = 28, C_red = 3668'
    the_four_are_reported_separately: >-
      Every results artifact reports these four tuples in their own block, labelled
      INV-4-FAILING TUPLES OF THE BATCH-011 PACKAGE, in addition to reporting them
      inside the 48. `four` IS A COUNT and the four members are named immediately
      above. Reporting them separately is a REPORTING requirement and confers no
      criterion, no threshold and no separate disposition - THERE IS NO CRITERION
      IN THIS CONTRACT TO CONFER. It does NOT re-open, re-dispose or un-fire INV-4.
    no_cell_is_added_and_none_is_dropped: >-
      NO TUPLE OUTSIDE THE COMMITTED CRITERION-EVALUABLE SET IS RUN, and no tuple
      inside it is dropped for any reason. IN-1 records NOISE_LIMITED false at all
      49 cells; that is quoted as an observation and is not a rule of this
      contract.

  process_specification:
    it_is_the_same_process_and_that_is_the_point: >-
      THE PROCESS IS IDENTICAL TO EXP-YIELD-002's P-REPAIRED, CLAUSE FOR CLAUSE.
      Nothing about the process is varied, improved, corrected or extended. The
      ONLY things that change between EXP-YIELD-002 and EXP-YIELD-003 are the
      MASTER SEEDS, the ARM LABELS in the seed string, the membership of the
      high-precision block, and the fact that this contract has no criterion. If
      the process were changed, the replicated statistic would not be the same
      statistic and the replication would answer nothing.
    universe: >-
      THE BIN UNIVERSE IS THE INTEGER RESIDUE SET from 0 to N-1, one bin per group
      element, with bin 0 being the IDENTITY BIN. N is QUOTED per tuple from IN-1
      and is odd and prime at all four field sizes - N = 4001 at k = 12, 16619 at
      k = 14, 65633 at k = 16 and 261707 at k = 18. No group, curve or point object
      is constructed; the universe is an integer index range and nothing more.
    bin_structure: >-
      The map sending g to (N - g) mod N has EXACTLY ONE FIXED POINT, g = 0. The
      N - 1 non-identity residues therefore partition into (N-1)/2 antipodal-pair
      bins, and the identity bin stands alone. The quantity measured is the number
      of distinct BINS covered, not the number of ORBITS touched.
    P_REPAIRED:
      id: P-REPAIRED
      statement: >-
        ONE REPLICATE AT A TUPLE with parameters N, C_red and s, where s is the
        size of S_(m-2), is - STEP 1, PRE-MARK. Choose s DISTINCT bins UNIFORMLY AT
        RANDOM WITHOUT REPLACEMENT from all N bins, and mark them. The identity bin
        0 IS ELIGIBLE and is chosen with probability s/N like every other bin. A bin
        chosen in step 1 is marked ONCE and contributes ONCE to the distinct count.
        STEP 2, THROW. Repeat exactly C_red/2 times, each repetition independent of
        every other and of step 1 - draw g uniformly at random from the integers 0
        to N-1 WITH REPLACEMENT, and mark BOTH bin g and bin (N - g) mod N. STEP 3,
        COUNT. Report the number of distinct marked bins. ORDER IS BINDING - step 1
        strictly precedes step 2 within a replicate, and both consume the same
        per-tuple random stream in that order.
      identity_bin_may_be_pre_marked: >-
        YES, AND IT IS A DECISION CARRIED UNCHANGED FROM EXP-YIELD-002, NOT AN
        OVERSIGHT. The uniform choice is over ALL N bins with the identity bin
        included. The structurally exact alternative is NOT run here and is
        deferred with its cost stated at DEFER-BATCH013-001 below.
      identity_bin_may_be_hit: >-
        YES. A throw with g = 0 marks bin 0 only, because (N - 0) mod N = 0, so that
        throw covers ONE bin rather than two. This is not corrected, not rejected
        and not resampled. It occurs with probability 1/N per throw.
      odd_C_red_rule: >-
        C_red IS QUOTED FROM IN-1 AND IS NEVER RECOMPUTED FROM B. All 49 committed
        cells record C_red_is_even true and the largest declared C_red is 91922 at
        T-18-3-B82. IF THE DRIVER EVER READS AN ODD C_red FOR A DECLARED TUPLE, that
        can only be a read or parse error - it fires IV-1 INPUT INTEGRITY, the run
        STOPS AND REPORTS, NO THROW IS PERFORMED at that tuple, and the run is not
        evidence. C_red/2 is therefore always an exact integer and no rounding rule
        is needed or permitted.
      the_named_calls_and_the_stream_order_carried_from_C_3d_and_C_19c: >-
        DETERMINISM IS A PROPERTY OF THE NAMED CALL AND ITS POSITION IN THE STREAM,
        NOT OF THE DISTRIBUTION. Within one replicate at one tuple, and in this
        order - step 1 consumes exactly one call
        rng.choice(N, size=s, replace=False, shuffle=True), OMITTED ENTIRELY when
        s = 0 and omitted entirely in any P-ASRECORDED leg, which has no step 1;
        step 2 then consumes exactly one call
        rng.integers(0, N, size=C_red // 2, dtype=numpy.int64), whose returned array
        is consumed in index order, each entry g marking bin g and bin (N - g) mod N.
        No other draw is taken from that generator inside the replicate, and
        replicates consume the one per-tuple generator SEQUENTIALLY without
        re-seeding.
      the_shuffle_keyword_is_load_bearing: >-
        NAMED IN FULL RATHER THAN LEFT TO THE API DEFAULT, CARRYING RT29-6 AND C-19c
        FORWARD. shuffle=True and shuffle=False return the same SET of pre-marked
        bins but LEAVE THE GENERATOR IN DIFFERENT STATES, so the following
        rng.integers call differs. The keyword is therefore part of the process
        specification and not a cosmetic detail, and the numpy version pin below is
        load-bearing for the same reason.
    P_ASRECORDED:
      id: P-ASRECORDED
      statement: >-
        THE COMPARABILITY PROCESS, USED ONLY INSIDE THE HIGH-PRECISION BLOCK.
        Identical to P-REPAIRED WITH STEP 1 DELETED - repeat exactly C_red/2 times,
        draw g uniformly at random from the integers 0 to N-1 with replacement, mark
        bin g and bin (N - g) mod N, then count distinct marked bins. Nothing is
        pre-marked.
      it_is_not_a_48_tuple_arm_here: >-
        STATED SO THAT THE ARM COUNT IS NOT MISREAD. EXP-YIELD-002 ran P-ASRECORDED
        at all 48 tuples as its comparability arm feeding IV-1. EXP-YIELD-003 DOES
        NOT. Its only use of P-ASRECORDED is as the second leg of the
        high-precision block at the 10 named block tuples, and that block feeds no
        criterion, no threshold, no invalidation rule and no verdict. NO
        COMPARABILITY INVALIDATION RULE OF THE IV-1 KIND EXISTS IN THIS CONTRACT,
        because there is no criterion here for a comparability anchor to anchor.
    exact_mean_of_P_REPAIRED_carried_for_reference: >-
      CARRIED FOR REFERENCE AND FEEDING NOTHING. Write A = (1 - 2/N)^(C_red/2) and
      C = (1 - 1/N)^(C_red/2). Bin j survives unmarked exactly when it is not
      pre-marked AND not hit, and the two events are independent because step 1 and
      step 2 use independent randomness. The probability that j is not pre-marked is
      1 - s/N for every j by symmetry of the uniform s-subset. The probability that
      j is not hit is A for j nonzero and C for j = 0. Hence
      E[distinct] = N - (1 - s/N)[(N-1) A + C]. This is EXACT, requires no
      approximation, and is the known-answer target used by IV-3 case KA-3. It was
      derived in the frozen EXP-YIELD-002 specification, independently re-derived by
      RT-20260729-016 and again by TASK-20260729-020, and it is NOT re-adjudicated
      here.
    the_declared_positive_second_order_bias_carried_unchanged: >-
      CARRIED FROM THE COMMITTED PACKAGE AND NOT RE-DERIVED. The exact process mean
      sits ABOVE P_pred by at most 0.131 bins across the declared set, and in
      standard-error-of-the-mean units the committed measurement at all 48 tuples
      gives bias divided by sem in the interval from 0.00468 to 0.07542 with mean
      0.02638, within the declared envelope of 0.0895 standard errors. THESE ARE
      MAGNITUDES, not counts. THE CONSEQUENCE IS THE ONE DEC-20260729-002 RECORDS -
      the declared second-order biases account for only about +0.0264 of the
      +0.361024 aggregate, roughly an order of magnitude too small, and this
      contract adopts no explanation for the remainder.
    what_is_NOT_simulated: >-
      NO SUM SET IS BUILT. NO FACTOR BASE IS BUILT. NO CENSUS IS RE-OPENED. The size
      of S_m is not recomputed, not read, not estimated and not reported. The
      experiment simulates the NULL CONTROL OBJECT ONLY.

  controls:
    - id: CTRL-003-REPLICATE-REPAIRED
      run_id: RUN-YIELD-003-REPLICATE-REPAIRED
      description: >-
        THE PRIMARY ARM. Process P-REPAIRED at all 48 declared tuples, at the
        C-14 replicate schedule fixed below, under master seed 130301, reporting
        per tuple the SAMPLED mean, the SAMPLED sd, the SAMPLED relative sd, the
        replicate count, the derived standard error of the mean, and BOTH
        standardized residuals against the QUOTED unchanged P_pred.
      feeds: >-
        NO CRITERION. It produces the primary OBSERVATION OM-5 and the secondary
        observations, all of which feed nothing.
    - id: CTRL-003-HIGHPREC
      run_id: RUN-YIELD-003-HIGHPREC
      description: >-
        THE HIGH-PRECISION BLOCK, EXTENDED PER RC-21B AND WITH DEV-4 REPAIRED.
        Both processes P-REPAIRED and P-ASRECORDED at the 10 named block tuples -
        the four m = 3 INV-4-failing tuples the EXP-YIELD-002 block used and six
        m = 2 tuples selected by the pre-registered deterministic rule below - at
        10000 replicates per leg per tuple, under master seed 130501, with THE TWO
        LEGS SEEDED SEPARATELY under the distinct arm labels HIGHPREC-REPAIRED and
        HIGHPREC-ASRECORDED.
      feeds: >-
        NOTHING. THIS BLOCK FEEDS NO CRITERION, NO THRESHOLD, NO INVALIDATION RULE
        AND NO VERDICT. Its numbers may not be substituted for, averaged with,
        pooled with, or compared against any other quantity of this contract to
        produce a disposition. It is reported and labelled and nothing else.
    - id: CTRL-003-KNOWNANSWER
      run_id: RUN-YIELD-003-KNOWNANSWER
      description: >-
        THE SIMULATOR CORRECTNESS ARM. Known-answer checks of this contract's own
        simulator against exactly computable expectations at synthetic parameters,
        plus explicit checks of the pre-marking and of the identity-bin accounting,
        plus an exact-arithmetic reproduction of the QUOTED P_pred at the four
        INV-4-failing tuples, under master seed 130401. Every case, its exact
        target and its numeric tolerance are enumerated in invalidation rule IV-3.
      feeds: 'IV-3 only. It is an integrity check on the run and not a criterion.'

  independent_variables:
    - >-
      declared parameter tuple, 48 values, each a QUOTED record of k, N, m, B,
      C_red, the size of S_(m-2) and P_pred taken from IN-1. `48` is a COUNT and
      the members are named in observation feasibility table section 2.
    - 'arity m in the set {2, 3}, which fixes the size of S_(m-2) as 1 or B'
    - >-
      process, in the set {P-REPAIRED, P-ASRECORDED}, with P-ASRECORDED occurring
      ONLY as the second leg of the high-precision block
    - >-
      denominator reading, in the set {standard error of the mean, single-replicate
      standard deviation}, both REPORTED at every one of the 48 tuples per RC-E and
      neither a criterion here

  metrics:
    primary:
      - >-
        OM-1 mu_rep, the mean distinct occupancy of process P-REPAIRED over the
        tuple's replicate count. SAMPLED.
      - >-
        OM-2 s_rep, the sample standard deviation of the same replicates with
        denominator n_rep - 1, and sem_rep = s_rep/sqrt(n_rep). SAMPLED; n_rep is
        DETERMINED.
      - >-
        OM-3 z_sem = (mu_rep - P_pred)/sem_rep, the standardized residual under the
        standard-error-of-the-mean reading. SAMPLED numerator and denominator over a
        DETERMINED P_pred.
      - >-
        OM-4 z_sd = (mu_rep - P_pred)/s_rep, the standardized residual under the
        literal single-replicate-standard-deviation reading. SAMPLED numerator and
        denominator over a DETERMINED P_pred. Reported at every one of the 48
        tuples per RC-E; no tuple reports only one reading.
      - >-
        OM-5 THE PRIMARY OBSERVATION - the mean, the sample standard deviation with
        denominator 47, and the standard error sd/sqrt(48) of the z_sem vector over
        the 48 declared tuples. SAMPLED. IT FEEDS NO CRITERION. The full sorted
        48-entry z_sem vector is reported verbatim beside these three numbers.
    secondary:
      - >-
        OM-6 the sign of (mu_rep - P_pred) per tuple, and n_neg, the count of
        declared tuples with a strictly negative sign. SAMPLED. `n_neg` IS A COUNT
        and the run record names the tuples it counts. NO WINDOW, THRESHOLD OR
        AGGREGATE-SIGN CRITERION OF THE CR-4 KIND EXISTS IN THIS CONTRACT and none
        may be applied to n_neg by any later record.
      - >-
        OM-7 delta_z per tuple, the difference between this run's z_sem and the
        committed EXP-YIELD-002 repaired-arm z_sem QUOTED from IN-3 at the same
        tuple label, together with its 48-tuple mean, sd and standard error.
        SAMPLED. IT FEEDS NOTHING. It is included because it is the direct
        replication comparison a reader will otherwise construct by hand and get
        wrong, and because the two draws are independent by construction, their
        master seeds and arm labels both differing.
      - >-
        OM-8 the high-precision block quantities at the 10 block tuples - per leg,
        the mean, sd and standard error at 10000 replicates, and the
        repaired-minus-as-recorded difference with the standard error of that
        difference computed under the independence the DEV-4 repair restores.
        SAMPLED. IT FEEDS NOTHING, AND SEE THE PROHIBITION AT
        the_high_precision_difference_column_prohibition BELOW.
      - >-
        OM-9 lambda, exp(-lambda), T, P_pred, N, B, C_red, the size of S_(m-2) and
        n_rep per tuple. DETERMINED, each also QUOTED from IN-1 and cross-checked to
        1e-9 absolute.
      - >-
        OM-10 per-run wall clock, peak resident memory, total random draws consumed,
        and the complete environment block required by the platform clause.
        MEASURED.
    labelling_rule_RC_8: >-
      RC-8 BINDS UNCHANGED. EVERY REPORTED QUANTITY CARRIES AN EXPLICIT `label`
      FIELD READING EXACTLY ONE OF `DETERMINED`, `QUOTED`, `SAMPLED` OR `MEASURED`,
      PER QUANTITY AND PER TUPLE, IN EVERY results.json AND IN summary.json. NOTHING
      THAT IS ESTIMATED MAY BE LABELLED DETERMINED. A statistic derived from SAMPLED
      inputs is SAMPLED however exact its arithmetic.

  preregistered_prediction:
    quantity: >-
      NONE. NO QUANTITY IS PREDICTED BY THIS CONTRACT. The schema field is present
      and is filled with this statement rather than deleted, so that a reader
      cannot mistake an absent field for an omitted prediction. The mean, standard
      deviation and standard error of z_sem over the 48 declared tuples are
      OBSERVATIONS FEEDING NO CRITERION and no value of them is predicted, expected,
      hoped for or registered.
    formula: >-
      NONE. NO PREDICTIVE FORMULA IS REGISTERED. The exact mean of P-REPAIRED,
      E[distinct] = N - (1 - s/N)[(N-1)(1 - 2/N)^(C_red/2) + (1 - 1/N)^(C_red/2)],
      is carried above as a REFERENCE and as the known-answer target of IV-3 case
      KA-3, which is an integrity check on the simulator and not a prediction about
      the replicated statistic.
    source: >-
      NOT APPLICABLE. DEC-20260729-002 next action NA-1 specifies the replication
      and specifies that its output is an observation feeding no criterion; it
      registers no prediction and this contract registers none on its behalf.
    why_no_prediction_is_registered: >-
      BECAUSE REGISTERING ONE WOULD MANUFACTURE A TEST THE ORIGINAL NEVER HAD. The
      statistic being replicated was a post-hoc tail-check observation of
      EXP-YIELD-002, outside all four of that contract's criteria. A prediction
      registered now would be a prediction about a quantity whose first realisation
      is already committed and already read, which is not a pre-registration in any
      sense that matters, and it would convert instrument maintenance into an
      apparently decisive measurement.

  confirmatory_status: exploratory_only
  confirmatory_status_basis: >-
    RC-G, MANDATORY AND EASILY MISSED, STATED PLAINLY AND NOT SOFTENED. Under
    docs/task-lifecycle.md section 5, a test whose inputs are quantities ALREADY
    COMMITTED has an outcome PARTLY DETERMINED BY DATA ALREADY IN HAND, so it
    CANNOT be confirmatory. Every N, B, C_red, m, size of S_(m-2) and P_pred
    consumed here was recorded, committed and read before this contract was
    written, and so was the first realisation of the very statistic being
    replicated. THIS CONTRACT IS THEREFORE `exploratory_only`, and a second,
    independent reason applies - IT HAS NO CRITERION AT ALL, and a contract with no
    criterion cannot be confirmatory of anything.
    NO EFFICIENCY MAY BE COMPUTED AGAINST A REPAIRED NULL WITHOUT A FRESH
    PRE-REGISTRATION, AND THIS CONTRACT AUTHORISES NONE. A confirmatory test of the
    yield heuristic requires FRESH CELLS - new curves per size, or new sizes - with
    the repaired null pre-registered before they are measured, AND THIS CONTRACT IS
    EXPRESSLY NOT THAT TEST.
    PRE-REGISTRATION ORDER AND CONFIRMATORY STANDING ARE DIFFERENT PROPERTIES AND
    THIS CONTRACT HAS THE FIRST AND NOT THE SECOND. Order is a property of COMMIT
    ORDER - no draw of this contract exists at the moment it is committed, and a
    third party can check that against Git. Standing is a property of PROTOCOL
    STABILITY over data the protocol has not seen. The two are not interchangeable
    and no downstream record may upgrade one into the other.

  observation_definitions:
    denominator_reading_RC_E: >-
      RC-E BINDS UNCHANGED. BOTH READINGS ARE COMPUTED AND REPORTED AT EVERY ONE OF
      THE 48 TUPLES AND NO TUPLE REPORTS ONLY ONE - the standard-error-of-the-mean
      reading with denominator sem_rep = s_rep/sqrt(n_rep), and the
      single-replicate standard-deviation reading with denominator s_rep at ddof
      n_rep - 1. HERE BOTH ARE OBSERVATIONS AND NEITHER IS A CRITERION. The
      distinction is retained because on the BATCH-011 package the choice of
      denominator moved the INV-4 firing count from 4 of 49 to 22 of 49, which
      makes it the single most easily fudged quantity in this design, and because
      the statistic being replicated is defined on the first reading.
    replicate_schedule_fixed_to_C_14: >-
      FIXED TO THE AMENDED EXP-YIELD-001 CLAUSE C-14 SCHEDULE AND NOT RAISED - 100
      replicates where C_red is at most 10^4; 30 replicates where C_red is above
      10^4 and at most 10^6; 10 replicates where C_red exceeds 10^6. REALISED ON THE
      DECLARED SET - 37 tuples at 100 replicates and 11 tuples at 30 replicates.
      BOTH FIGURES ARE COUNTS and both member lists are NAMED in observation
      feasibility table section 2. THE 10-REPLICATE TIER IS UNREACHABLE HERE,
      because the largest C_red among the 48 declared tuples is 91922 at
      T-18-3-B82; the tier is stated so the schedule is quoted whole rather than
      truncated to the reachable part.
    why_the_replicate_count_is_not_raised: >-
      STATED IN THE CONTRACT BECAUSE IT IS THE MOST TEMPTING CHANGE AVAILABLE AND IT
      IS FORBIDDEN. THE WHOLE PURPOSE OF THIS EXPERIMENT IS TO REPRODUCE THE SAME
      STATISTIC UNDER A FRESH SEED. z_sem is a ratio whose denominator is itself
      estimated at n_rep replicates, so raising n_rep changes the law of z_sem, not
      merely its precision - the sd of z_sem under a centred null is
      sqrt((n_rep-1)/(n_rep-3)), which is a function of n_rep alone. A replication
      at a different replicate count would therefore be a DIFFERENT STATISTIC and
      would answer a different question. Separately, raising the count would sharpen
      the standard error of the mean against the two known second-order terms, which
      at ten times the count sit near 0.28 standard errors and at a hundred times
      near 0.9 - approaching a 3-standard-error scale with no measurement fault
      existing at all. Holding the schedule at C-14 keeps the reading EXACTLY the
      reading DEC-20260729-002 names.
    no_unquantified_comparative_word_RC_D: >-
      RC-D BINDS UNCHANGED. The words `shrink`, `closer`, `consistent with`,
      `essentially`, `comparable`, `substantially`, `approximately` and `about` ARE
      FORBIDDEN AS DISPOSITIVE LANGUAGE and appear nowhere in this contract as the
      means by which a number is disposed of. The two resume-condition thresholds -
      about 0.14 and about +0.25 - are the only numeric dispositions in this
      contract and they are carried VERBATIM from DEC-20260729-002 NA-1, where the
      word `about` already stands; it is carried rather than sharpened because
      sharpening a threshold carried verbatim would be a silent protocol change.
    set_identity_not_cardinality_PRED_ID_EXTENDED: >-
      D-2 PROPHYLAXIS, EXTENDED BY THIS CONTRACT AND BINDING ON EVERY STATEMENT IT
      MAKES AND ON EVERY RECORD DERIVED FROM IT. THE ORIGINAL RULE - every
      pre-registered per-tuple expectation is a NAMED, ENUMERATED TUPLE LIST, and
      any comparison of a realised outcome against a pre-registered expectation is
      evaluated on SET IDENTITY, which tuples, and NEVER on CARDINALITY, how many; a
      realised set whose COUNT matches a predicted count while its MEMBERS differ is
      recorded as a FAILED PREDICTION and never as a successful one.
      THE EXTENSION, AND WHY IT IS NEEDED. PRED-ID as written in EXP-YIELD-002 bound
      only that contract's CRITERIA. It did NOT bind that contract's own POWER
      CURVE, and that is exactly where the same failure recurred - a column
      reporting a COUNT of tuples was read as a MAGNITUDE by three successive
      sessions and produced a FALSE numeric sentence that survived three independent
      pre-execution reviews. THE CARDINALITY-NOT-IDENTITY FAILURE HAS NOW RECURRED
      THREE TIMES IN THIS LINEAGE. PRED-ID THEREFORE BINDS, IN THIS CONTRACT, NOT
      ONLY ANY PREDICTION BUT EVERY POWER, SENSITIVITY, COUNT AND MAGNITUDE
      STATEMENT THE CONTRACT MAKES ABOUT ITSELF. EVERY STATEMENT THAT REPORTS A
      COUNT OF TUPLES SAYS IN TERMS THAT IT IS A COUNT AND NAMES THE TUPLES OR
      NAMES THE EXACT TABLE SECTION WHERE THEY ARE NAMED; EVERY STATEMENT THAT
      REPORTS A MAGNITUDE SAYS IN TERMS THAT IT IS A MAGNITUDE. A statement that
      does neither is a defect in this contract and is reported as one.

  primary_observation:
    id: OM-5
    definition: >-
      Let z_1 through z_48 be the values of z_sem at the 48 declared tuples,
      indexed by the tuple ordering of observation feasibility table section 2. The
      primary observation is the triple - the arithmetic mean of the 48 values; the
      sample standard deviation of the 48 values with denominator 47; and that
      standard deviation divided by the square root of 48. All three are SAMPLED.
    it_feeds_no_criterion: >-
      STATED AGAIN AT THE POINT OF DEFINITION RATHER THAN ONLY IN THE ABSTRACT. No
      threshold is applied to any of the three numbers by this contract, by its
      driver, by its run records or by its results summary. The run package reports
      them, reports the full sorted z_sem vector, and stops.
    the_committed_first_realisation_quoted_for_the_reader: >-
      QUOTED, NOT PREDICTED, AND NOT A TARGET. The committed EXP-YIELD-002 repaired
      arm recorded a z_sem mean of 0.36102368504276455 with sample sd
      0.9750016841736118 over the 48 tuples, hence a standard error of 0.140729 and
      t = 2.5654. THESE ARE MAGNITUDES. They are quoted here so that the reader of
      the replication has the first realisation in front of them, and they are NOT
      a value this contract expects, predicts, or evaluates the replication against.
    the_reader_is_warned_about_one_reading: >-
      A REPLICATED MEAN NEAR THE COMMITTED ONE IS NOT A CONFIRMATION OF ANYTHING
      ABOUT THE PROCESS, and a replicated mean near zero is not a refutation of
      anything about the process. Under either outcome the process is the same
      process, and the resume condition's own last sentence governs.

  success_criterion: null
  success_criterion_note: >-
    NULL, AND THE NULL IS THE DESIGN. See
    there_is_no_success_criterion_and_that_is_the_design above. The schema field is
    present and explicitly null rather than absent, so that a reader cannot mistake
    an omitted field for an overlooked one. NOTHING IN THIS CONTRACT SUCCEEDS OR
    FAILS ON A MEASURED VALUE.
  falsification_criterion: null
  falsification_criterion_note: >-
    NULL, FOR THE SAME REASON, AND THE CONSEQUENCE IS STATED PLAINLY - NO OUTCOME
    OF EXP-YIELD-003 FALSIFIES ANYTHING. It cannot refute the exact mean identity,
    which is a theorem for the specified process; it cannot refute P_pred; it
    cannot refute the BATCH-011 reading; and it cannot refute or support any
    hypothesis. THE ABSENCE OF A FALSIFICATION CRITERION IS A LIMIT ON WHAT THIS
    EXPERIMENT IS, NOT A LOOPHOLE IN IT.

  power_and_sensitivity_statement:
    the_governing_fact: >-
      THIS CONTRACT HAS NO CRITERION, THEREFORE IT HAS NO POWER AGAINST ANY
      ALTERNATIVE, AND IT MAKES NO SENSITIVITY CLAIM ABOUT A SHORTFALL OF ANY
      FRACTION OF T. There is no detection curve here, because nothing is detected.
    RT21_1_prohibition_observed: >-
      THE EXP-YIELD-002 CLAUSE C-20 POWER SENTENCE IS FALSE AS TO ITS FIVE-PER-CENT
      CLAUSE AND IS NOT REPRODUCED HERE, IN WHOLE OR IN PARAPHRASE. Its obligation
      bound records produced FROM THE EXP-YIELD-002 CONTRACT; EXP-YIELD-003 is a
      different contract, so that obligation does not reach this file, and this
      file does not import it. THE CORRECTION IS ON THE RECORD at DEC-20260729-002
      fields power_limit_sentence_C_20_correction_carried_beside_it and
      corrections_by_supersession.SUP-C, and any record that quotes the sentence
      carries the correction beside it, verbatim.
    no_mandatory_sentence_clause_is_created: >-
      THIS CONTRACT CREATES NO CLAUSE MAKING ANY SENTENCE MANDATORY ON ANY
      DOWNSTREAM RECORD. The C-20 mechanism - widening a self-critical sentence into
      an obligation binding every later record - is precisely how a false numeric
      claim propagated verbatim into a commit message and an archive receipt that
      are both immutable. A limit that can only be carried and never corrected in
      the carrying is worse than one stated once and re-derived. What this contract
      binds instead is a RULE, PRED-ID EXTENDED, which constrains HOW statements are
      made rather than mandating a particular sentence.
    the_only_sensitivity_statement_this_contract_makes: >-
      ONE, AND IT IS ABOUT THE MEASURABILITY OF ITS OWN OBSERVATION RATHER THAN
      ABOUT ANY ALTERNATIVE HYPOTHESIS. THE STANDARD ERROR OF THE 48-TUPLE z_sem
      MEAN UNDER THE INDEPENDENT-STREAM DESIGN OF THIS CONTRACT IS A MAGNITUDE OF
      ABOUT 0.1467, derived in observation feasibility table section 3 as
      sqrt((37 x 99/97 + 11 x 29/27)/48)/sqrt(48), where 37 and 11 are COUNTS whose
      members are named in table section 2 and 99/97 and 29/27 are the variances of
      a t variate at 99 and 29 degrees of freedom. CONSEQUENCE, STATED AS A
      MAGNITUDE - the two resume-condition thresholds sit at about 0.95 and about
      1.70 of that standard error, so THIS DESIGN CANNOT SEPARATE ITS OWN TWO
      RESUME BRANCHES SHARPLY, and the unassigned interval between them is not a
      drafting oversight but a real region this measurement lands in with
      non-negligible probability. The pre-data branch probabilities are worked in
      observation feasibility table section 4 AND ARE FLAGGED THERE AS HAND-DERIVED
      AND NOT MACHINE-VERIFIED.
    the_flagging_is_deliberate: >-
      RECORDED AGAINST THIS SESSION RATHER THAN IN ITS FAVOUR. The RT21-1 failure
      was a numeric claim inside a frozen contract that three independent reviews
      called correct. EVERY SELF-REFERENTIAL NUMERIC CLAIM THIS CONTRACT MAKES IS
      THEREFORE MARKED WITH ITS DERIVATION STATUS AT THE POINT OF USE, and the ones
      the authoring session could not evaluate with an interpreter are marked
      HAND-DERIVED AND NOT MACHINE-VERIFIED and are listed in
      left_open_for_the_reviewer. None of them binds anything, because this contract
      has nothing for a number to bind.

  observation_feasibility_summary:
    table_ref: >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-013/tasks/TASK-20260729-031/observation_feasibility_table.md
      - MANDATORY READING FOR TASK-20260729-033 AND FOR ANY READER OF A RESULT.
      DEFER-BATCH009-003 requires a feasibility table; there is no success criterion
      here to make feasible, so the table is an OBSERVATION FEASIBILITY TABLE. Every
      invalidation rule is evaluated there with the arithmetic shown at the exact
      tuples that will run and is marked CAN FIRE or CANNOT FIRE, and the primary
      observation's measurability is shown per tuple and in aggregate.
    headline_findings_of_the_table: >-
      RECORDED HERE SO THE CONTRACT DOES NOT HIDE ITS OWN WEAKNESSES BEHIND A
      REFERENCE. ALL SEVEN INVALIDATION RULES CAN FIRE and none was removed, but
      they divide into two kinds and the table says which each is - IV-1, IV-2, IV-5,
      IV-6 and IV-7 are MECHANICAL INTEGRITY CHECKS with no chance-alarm rate at
      all, which fire only on a real defect; IV-3 is the only rule with a chance
      component, and its total chance-alarm probability under a correct simulator is
      a MAGNITUDE of about 8.2e-4, carried by the three tolerance-bearing cases KA-3,
      KA-4 and KA-6, the other five cases being zero-tolerance or DETERMINED; IV-4 is
      the infrastructure rule and fires on infrastructure, which is never a
      mathematical result. THE PRIMARY OBSERVATION IS MEASURABLE AND ITS PRECISION IS
      POOR RELATIVE TO THE QUESTION IT IS ASKED - see
      power_and_sensitivity_statement.the_only_sensitivity_statement_this_contract_makes.
      NO INVALIDATION RULE WAS REMOVED OR REPLACED BEFORE THE FREEZE, and the table
      records that fact rather than leaving a silent absence.

  invalidation_rules:
    - >-
      IV-1 INPUT INTEGRITY. The SHA-256 of IN-1, IN-2 or IN-3 as read differs from
      the value pinned in inputs.files_read; or the SHA-256 of either file named in
      inputs.the_two_extra_files_read_only_for_IV_2 differs from the value pinned
      there; or IN-1's cells array does not carry exactly 49 entries; or IN-2 does
      not report n_evaluable_on_measured_B = 49; or de-duplication on measured B
      within (k, m) columns does not yield exactly 48 tuples; or any declared tuple
      reports an odd C_red; or the driver's independently recomputed lambda,
      exp(-lambda), T or P_pred differs from the QUOTED value by more than 1e-9
      absolute at any tuple. CONSEQUENCE - the run STOPS AND REPORTS immediately,
      performs no further throw, writes all three artifact files with the terminal
      status recorded, and IS NOT EVIDENCE.
    - >-
      IV-2 SEED INTEGRITY AND COLLISION. The driver derives every seed of this
      experiment, records the exact seed STRING beside the derived 64-bit integer in
      results.json, and checks four things. IV-2a FIRES if any two derived seeds of
      EXP-YIELD-003 coincide. IV-2b FIRES if any derived seed of EXP-YIELD-003
      coincides with any derived seed recorded in the three committed EXP-YIELD-002
      run results.json files. IV-2c FIRES if any derived seed of EXP-YIELD-003
      coincides with any derived seed recorded in IN-1. IV-2d FIRES if the arm label
      field of any seed string is not exactly one of the four enumerated labels
      REPLICATE-REPAIRED, KNOWNANSWER, HIGHPREC-REPAIRED and HIGHPREC-ASRECORDED, or
      if the two high-precision legs at any block tuple produce the same seed string.
      CONSEQUENCE - the run STOPS AND REPORTS, performs no further throw, and IS NOT
      EVIDENCE. THE SCOPE OF THIS RULE IS STATED HONESTLY - IV-2b and IV-2c compare
      against the seeds recorded in files this contract reads and hash-binds, which
      covers the 105 EXP-YIELD-002 derived seeds and the derived seeds IN-1 records
      for the BATCH-011 antipodal arm; IT DOES NOT COVER EVERY BATCH-011 DERIVED
      SEED, because the other BATCH-011 run records are outside this contract's
      permitted inputs. What covers those instead is the DECLARED MASTER-SEED BLOCK
      DISJOINTNESS below, which is a design fact and NOT a proof about derived
      seeds, since the derivation is a SHA-256 digest whose outputs are not
      predictable from the master seed. That residual is disclosed rather than
      claimed away.
    - >-
      IV-3 SIMULATOR KNOWN-ANSWER DEFECT. Every case below is run in
      RUN-YIELD-003-KNOWNANSWER under master seed 130401 with the stated exact
      target and the stated numeric tolerance. A MISMATCH BEYOND TOLERANCE AT ANY
      CASE FIRES IV-3 AND THE ENTIRE RUN SET IS INVALID and is never evidence about
      P_pred, about the shift or about anything else.
      KA-1 ZERO THROWS. N = 11, s = 3, C_red = 0, 1000 replicates. Exact target
      distinct = 3 in EVERY replicate. TOLERANCE ZERO.
      KA-2 FULL PRE-MARKING. N = 11, s = 11, C_red = 8, 1000 replicates. Exact
      target distinct = 11 in EVERY replicate. TOLERANCE ZERO.
      KA-3 EXACT EXPECTATION. N = 11, s = 3, C_red = 8, hence 4 throws, 10^6
      replicates. Exact target computed by the driver from the closed form
      E = N - (1 - s/N)[(N-1)(1 - 2/N)^(C_red/2) + (1 - 1/N)^(C_red/2)], which at
      these values is 11 - (8/11)[10 x (9/11)^4 + (10/11)^4]. TOLERANCE - the
      empirical mean must satisfy the absolute difference from the target being at
      most 4.000 times the empirical sd divided by the square root of 10^6. The
      driver records the target to full double precision from the closed form and
      hard-codes no decimal.
      KA-4 PRE-MARKING UNIFORMITY. N = 11, s = 3, C_red = 0, 10^6 pre-markings. For
      EACH of the 11 bins the empirical marginal frequency must satisfy the absolute
      difference from 3/11 being at most 4.000 times sqrt((3/11)(8/11)/10^6) =
      0.00178145. The admissible interval and the numeric half-band are recorded per
      case in results.json AND in summary.json - NARROW-1 records that the
      EXP-YIELD-002 condensed summary projection wrote tolerance as null for KA-4
      and KA-6, and that cosmetic omission is repaired here by requiring the field
      in both files.
      KA-5 PRE-MARKING WITHOUT REPLACEMENT AND COUNTED ONCE. In the same 10^6
      pre-markings of KA-4, reusing the KA-4 stream and taking no draw of its own,
      the number of distinct marked bins must equal 3 in EVERY pre-marking.
      TOLERANCE ZERO.
      KA-6 IDENTITY-BIN ACCOUNTING. N = 11, s = 0, C_red = 2, hence one throw, 10^6
      replicates. The distinct count must be 1 whenever g = 0 and 2 otherwise, in
      EVERY replicate, TOLERANCE ZERO on that implication; and the empirical
      frequency of distinct = 1 must satisfy the absolute difference from 1/11 being
      at most 4.000 times sqrt((1/11)(10/11)/10^6) = 0.00114993, with the admissible
      interval and half-band recorded in both files.
      KA-7 ANTIPODAL PAIRING. In the same 10^6 replicates of KA-6, reusing the KA-6
      stream and taking no draw of its own, the marked bin set must equal exactly the
      set containing g and (11 - g) mod 11 in EVERY replicate. TOLERANCE ZERO.
      KA-8 P_pred REPRODUCTION AGAINST THE COMMITTED PACKAGE. At the four
      INV-4-failing tuples, recompute P_pred = N(1 - exp(-C_red/N)) + the size of
      S_(m-2) times exp(-C_red/N) by exact double-precision arithmetic from the
      QUOTED N, C_red and size of S_(m-2), and require agreement with the QUOTED
      P_pred to an absolute difference of at most 1e-9 at all four. This case is
      DETERMINED, not SAMPLED, and consumes no random number.
      SEEDING - generators are seeded for KA-1, KA-2, KA-3, KA-4 and KA-6 only;
      KA-5 reuses the KA-4 stream, KA-7 reuses the KA-6 stream, and KA-8 is
      DETERMINED and takes none.
    - >-
      IV-4 INFRASTRUCTURE. A timeout, crash, resource exhaustion, budget
      cancellation or implementation failure is recorded with its terminal status in
      the manifest and IS INFRASTRUCTURE SIGNAL. IT IS NEVER A NEGATIVE MATHEMATICAL
      RESULT about P_pred, about the shift, about the diagnostic, about the occupancy
      null, about decomposition yield or about anything else, and it is never
      recorded as a result. NON-EXECUTION IS NEVER RECORDED AS A RESULT.
    - >-
      IV-5 INCOMPLETE COVERAGE. Any arm that does not measure all of its declared
      tuples names EVERY tuple it did not reach, by tuple label, with the reason, in
      results.json and in the manifest. A PARTIAL RESULT WITH A NAMED GAP IS A
      RESULT; A SILENTLY TRUNCATED ONE IS NOT. No unreached tuple may be reported as
      measured, no estimate may be substituted for a measurement that did not happen,
      and the primary observation OM-5 is NOT COMPUTED AT ALL unless all 48 tuples
      were measured - a mean over fewer than 48 is a different quantity and is
      reported under a different name with its member set enumerated.
    - >-
      IV-6 SCOPE BREACH. The driver imports or invokes any forbidden module, or
      computes any elliptic-curve operation, or computes or reports any
      occupancy-normalised efficiency E or yield ratio R, or reads any file not
      named in `inputs`, or writes any file outside the eleven required artifacts,
      or applies any threshold to any quantity of this contract. THE RUN IS INVALID
      and the Executor STOPS AND REPORTS rather than repairing the protocol in
      flight.
    - >-
      IV-7 ENVIRONMENT DISCLOSURE DEFECT. Any of the six required environment
      strings - sys.version, sys.executable, platform.platform(), platform.machine(),
      platform.processor() and numpy.__version__ - is absent from a manifest or from
      results.json; or any of them is recorded after the first draw of that run
      rather than before it; or more than one numpy version is used across the three
      arms; or the numpy version differs from the version recorded before the first
      draw of the first arm. THE SCOPE OF THE SINGLE-VERSION RULE IS THE THREE ARMS
      AND ONLY THE THREE ARMS. PP-1's re-execution of the primary arm under a second
      interpreter build is EXPRESSLY OUTSIDE IT and records its own six environment
      strings separately; a numpy version difference between the three arms and PP-1
      is EXPECTED under PP-1 case two and DOES NOT FIRE IV-7. What fires IV-7 is a
      version change inside the three arms' own execution, or a missing or
      late-recorded environment string anywhere, PP-1's own block included.
      CONSEQUENCE - ST-3 STOP AND REPORT, the run writes all
      three artifact files with the terminal status recorded, and IS NOT EVIDENCE.
      THE PIN IS LOAD-BEARING - numpy does not guarantee bit-identical Generator
      output across versions, and the shuffle keyword of step 1 leaves the generator
      in a version-dependent state, so an unrecorded version makes the run
      irreproducible in principle rather than merely in practice.

  stopping_rules:
    - >-
      ST-1 PER-RUN CAP. 600 seconds and 4 GB per run. On approaching the cap the run
      STOPS and names EXPLICITLY every declared tuple not reached, with the reason,
      under IV-5.
    - >-
      ST-2 ARM ORDER. The arms execute in the declared order
      RUN-YIELD-003-KNOWNANSWER, RUN-YIELD-003-REPLICATE-REPAIRED,
      RUN-YIELD-003-HIGHPREC, so that a simulator defect is caught before any
      observation quantity is produced, and so that a cap bind costs the block that
      feeds nothing before it costs the primary observation. Within an arm, tuples
      execute in the order they appear in IN-1's cells array.
    - >-
      ST-3 STOP AND REPORT ON AMBIGUITY. If this contract cannot be executed as
      written - in particular if any quantity this contract says is QUOTED cannot be
      located unambiguously in the file it names, or if any process clause requires a
      curve operation, or if the enumerated arm-label set does not cover a label the
      driver needs - the Executor STOPS AND REPORTS and does NOT repair the protocol
      in flight. THIS IS THE RULE THAT WORKED IN BATCH-012 - DEV-4 was found and
      declared rather than silently patched, and the declaration is what made the
      defect repairable here. Any deviation, however small, is recorded in the
      manifest as a declared protocol deviation and reported; it is never applied
      silently.
    - >-
      ST-4 NO INTERPRETATION. The run package contains OBSERVATIONS ONLY. It must
      not state a disposition of the resume condition, must not write an evidence or
      decision record, must not touch any hypothesis status, must not re-dispose
      INV-4, must not adjudicate INV-5, must not say anything about decomposition
      yield, and must not describe the replication as a fresh-platform replication.
      Interpretation belongs to TASK-20260729-037, TASK-20260729-038 and
      DEC-20260729-003.
    - >-
      ST-5 NO POST-HOC PROTOCOL CHANGE. No replicate count, seed, tuple set, block
      membership, denominator reading, tolerance or rule in this contract may be
      changed after any number produced under it is visible, except by a versioned
      protocol_amendment recorded BEFORE the change and independently re-reviewed by
      a non-originating session. Under the BATCH-013 execution gate RC-13 at most ONE
      such cycle is permitted and only if TASK-20260729-033 returns REVISE; a second
      REVISE, for any reason and at any severity, ends the batch as a non-execution,
      and NON-EXECUTION IS NEVER RECORDED AS A RESULT. Any cycle-cap ruling is
      assigned to a session that did NOT author the amendment it authorises.

  matched_baseline_position_RC7:
    status: DECLARED INAPPLICABLE
    reason: >-
      DECLARED INAPPLICABLE WITH THE REASON, RATHER THAN SKIPPED OR SATISFIED BY A
      FABRICATED FIGURE. RC-7 requires a matched-baseline position in TIME and
      MEMORY inside the contract. EXP-YIELD-003 SOLVES NO INSTANCE, RECOVERS NO
      DISCRETE LOGARITHM, COMPUTES NO RELATION AND TOUCHES NO CURVE - it is a
      balls-in-bins simulation of a control object over an integer residue range.
      There is no algorithmic task against which Pollard rho or baby-step
      giant-step could be a matched baseline, so no such baseline is quoted and
      quoting one would be decoration. No specialized baseline is named either, for
      the same reason.
    what_stands_unretracted_and_is_not_restated_as_a_result_of_this_batch: >-
      The BATCH-011 cost position stands unretracted at EV-ECDLP-008 observation
      O-11 - the census cost 28,384 to 2,604,442 times a measured Pollard-rho solve
      of the same instance, in a single declared operation unit - and is NOT
      restated as a result of BATCH-013 and is not re-derived here. This contract
      produces no operation-count comparison of any kind.

  scale_relevance:
    tier: toy
    justification: >-
      THE PARAMETERS ARE QUOTED FROM A TOY-TIER PACKAGE AND NOTHING HERE RAISES THE
      TIER. Four toy prime fields at 12, 14, 16 and 18 field bits, with the group
      orders 4001, 16619, 65633 and 261707 quoted from IN-1; one prime-order curve
      per size in the source package, chosen by a deterministic rule; x-interval
      factor bases anchored at 0 on the frozen 17-point beta grid; m in the set
      {2, 3}; unweighted decomposition with coefficients in the set {+1, -1}; one
      implementation, one budget, one platform; and a SINGLE UNREPLICATED SOURCE RUN
      SET, four field sizes on one curve each, which is a SIZE SERIES AND NOT A
      REPLICATION. NOTHING MEASURED HERE IS EVIDENCE ABOUT CRYPTOGRAPHIC-SIZE CURVES
      IN EITHER DIRECTION, and no correspondence, isometry or transport argument to
      scale is offered or available.
    what_this_experiment_is_scoped_to: >-
      EVERY SENTENCE OF EVERY CONCLUSION DRAWN FROM THIS EXPERIMENT IS SCOPED TO the
      48 declared parameter tuples; to the four tested field sizes k in the set
      {12, 14, 16, 18} and their quoted group orders; to the frozen beta grid 0.200
      to 0.600 in steps of 0.025 as realised in the source package; to arities m in
      the set {2, 3}; to the x-interval factor-base convention with B measured and
      not modelled; to the one prime-order curve per size of the source package; to
      THIS simulator, THIS driver, THIS numpy build, THIS interpreter build, THIS
      platform and THIS budget; and to the occupancy CONTROL OBJECT alone rather
      than to any measured decomposition quantity.
    correspondence: >-
      null - direct simulation of a declared analytic process. No correspondence
      argument of any kind is used and none is available.

  tail_checks:
    - >-
      The full sorted 48-entry z_sem vector reported verbatim beside its count,
      mean, sample sd, minimum, maximum and the counts of absolute value above 1,
      above 2 and above 3, with the standard-normal expectations for 48 draws beside
      them. OBSERVATIONS. NO TEST IS PERFORMED, NOTHING FIRES, NO p-VALUE IS
      COMPUTED, and each reported count states in terms that it is a count.
    - >-
      The largest absolute z_sem over the 48 tuples, reported WITH ITS TUPLE LABEL.
      A MAGNITUDE, reported with the name of the tuple attaining it, never as a
      count.
    - >-
      The distribution of z_sd across the 48 tuples, reported in the same shape as
      z_sem. OBSERVATIONS, feeding nothing.
    - >-
      The 48-entry delta_z vector of OM-7, reported sorted and verbatim with its
      mean, sd and standard error. OBSERVATIONS, feeding nothing.

  replication:
    seeds:
      - 'RUN-YIELD-003-REPLICATE-REPAIRED - master seed 130301, arm label REPLICATE-REPAIRED'
      - 'RUN-YIELD-003-KNOWNANSWER - master seed 130401, arm label KNOWNANSWER'
      - 'RUN-YIELD-003-HIGHPREC repaired leg - master seed 130501, arm label HIGHPREC-REPAIRED'
      - 'RUN-YIELD-003-HIGHPREC as-recorded leg - master seed 130501, arm label HIGHPREC-ASRECORDED'
    seed_block_disjointness_declared: >-
      THE THREE MASTER SEEDS 130301, 130401 AND 130501 ARE FRESH AND ARE DECLARED
      DISJOINT FROM EVERY MASTER SEED THIS LINEAGE HAS USED. They are disjoint from
      EXP-YIELD-002's four master seeds 120201, 120301, 120401 and 120501, and from
      BATCH-011's block 110200 to 110799 inclusive, which contains the six BATCH-011
      master seeds 110201, 110301, 110401, 110501, 110601 and 110701. The three
      values are pairwise distinct. THIS IS A DESIGN FACT ABOUT MASTER SEEDS AND IS
      NOT A PROOF ABOUT DERIVED SEEDS - the derivation is a SHA-256 digest, so a
      derived-seed coincidence is not excluded by master-seed disjointness and is
      excluded instead, to the extent the permitted inputs allow, by invalidation
      rule IV-2.
    seed_derivation_binding: >-
      FULLY SPECIFIED SO THAT NO SEED AND NO SAMPLING METHOD IS LEFT TO THE
      EXECUTOR'S JUDGEMENT. For a tuple the per-tuple seed is the LOW 64 BITS,
      interpreted as an unsigned little-endian integer, of the SHA-256 digest of the
      ASCII string formed by joining with the single character pipe and nothing
      else, in this exact order and with no whitespace - the decimal master seed,
      the arm label, the decimal k, the decimal round(beta x 1000), the decimal m,
      the decimal B, the decimal C_red. round(beta x 1000) is used rather than beta
      so that no floating-point formatting choice can change a seed. That integer
      seeds one numpy.random.default_rng generator per tuple per arm-label, and
      every replicate at that tuple consumes that one generator SEQUENTIALLY without
      re-seeding, with the pre-marking draw taken BEFORE the throwing draws within
      each replicate. The derived per-tuple seed AND the exact seed string are
      recorded in results.json beside every number they produced.
    knownanswer_seed_derivation: >-
      The KNOWNANSWER arm seeds each case from the string formed by joining with the
      single character pipe, in this exact order and with no whitespace - the decimal
      master seed 130401, the arm label KNOWNANSWER, the case label from KA-1 to
      KA-8, the decimal N, the decimal s and the decimal C_red; the low 64 bits of
      the SHA-256 digest, interpreted as an unsigned little-endian integer, seed one
      numpy.random.default_rng per seeded case. Keying on the CASE LABEL is what
      keeps KA-1 and KA-4 distinct, since both have N = 11, s = 3 and C_red = 0.
    the_DEV_4_repair_named_and_bounded:
      what_the_defect_was: >-
        EXP-YIELD-002's seed rule enumerated the arm labels as EXACTLY REPAIRED,
        ASRECORDED, KNOWNANSWER and HIGHPREC, and its high-precision block ran BOTH
        processes at the same four tuples under the single label HIGHPREC. No field
        of the seed string distinguished the process, SO THE CONTRACT AS WRITTEN
        MANDATED A SHARED SEED FOR THE TWO PROCESSES THE BLOCK EXISTS TO COMPARE.
        The Executor took the enumerated label literally and DECLARED the defect
        rather than inventing a label outside the frozen set, which was correct.
      the_fix_and_no_other: >-
        THE ENUMERATED ARM-LABEL SET IS EXTENDED SO THAT THE TWO HIGH-PRECISION LEGS
        ARE DISTINGUISHABLE, AND NOTHING ELSE ABOUT THE DERIVATION CHANGES. The
        closed enumerated set of arm labels for EXP-YIELD-003 is exactly the four
        strings REPLICATE-REPAIRED, KNOWNANSWER, HIGHPREC-REPAIRED and
        HIGHPREC-ASRECORDED. The block is re-derived under the last two, so the two
        legs at a block tuple have DIFFERENT seed strings and therefore INDEPENDENT
        streams. No other repair is invented, and the seed string's field order,
        joining character, digest, bit-width and endianness are unchanged.
      the_set_is_closed_and_that_closure_is_the_structural_repair: >-
        IF THE DRIVER NEEDS AN ARM LABEL OUTSIDE THE FOUR ENUMERATED STRINGS, THAT
        IS ST-3 STOP AND REPORT AND IV-2d FIRES. The DEV-4 failure was an
        enumeration that did not cover the arms the contract ran; making the
        coverage checkable by a rule, rather than trusting the enumeration to be
        complete, is what stops it recurring.
      what_the_fix_does_not_repair: >-
        THE FIX REPAIRS EXP-YIELD-003 ONLY AND REPAIRS NOTHING IN THE COMMITTED
        EXP-YIELD-002 PACKAGE, WHICH IS IMMUTABLE. The committed high-precision
        difference column stays unusable forever.
    the_high_precision_difference_column_prohibition: >-
      BINDING ON EVERY RECORD BATCH-013 PRODUCES, BEFORE AND AFTER THE FIX. NO
      RECORD MAY QUOTE A HIGH-PRECISION DIFFERENCE COLUMN AS A CONFIRMATION OF T -
      not EXP-YIELD-002's and not EXP-YIELD-003's. For EXP-YIELD-002's the reason is
      RT21-8 and NARROW-3 - its two legs share a per-tuple seed under DEV-4, so its
      measured repaired-minus-as-recorded differences are common-random-number
      estimates whose streams are offset rather than independent, AND ITS ERROR BAR
      IS QUANTIFIED NOWHERE in the committed package. For EXP-YIELD-003's the reason
      is different and is stated separately so the two are not conflated - its legs
      ARE independent and its standard error IS computed, but this contract has no
      criterion, registers no prediction about T, and will not have one attached
      after the fact; the column is an OBSERVATION and a confirmation reading of it
      would be exactly the post-hoc criterion
      no_criterion_may_be_added_later forbids.
    high_precision_block_membership:
      the_four_m_3_tuples_carried_from_EXP_YIELD_002:
        - T-18-3-B16
        - T-16-3-B16
        - T-18-3-B24
        - T-18-3-B28
      why_they_are_carried: >-
        CARRIED UNCHANGED SO THAT THE EXTENDED BLOCK CONTAINS THE OLD BLOCK. They
        are the four INV-4-failing tuples of the BATCH-011 package. RT-20260729-021
        objection RT21-6 and required control RC-21B record that they are a
        DELIBERATELY SELECTED SUBSET - all m = 3, all high N, all four INV-4
        failures - and that is the defect RC-21B exists to correct, not a virtue.
      the_six_m_2_tuples_and_the_rule_that_chose_them:
        rule: >-
          PRE-REGISTERED, DETERMINISTIC, STATED BEFORE DATA, AND KEYED ONLY ON
          DETERMINED QUANTITIES. Order the 29 declared m = 2 tuples by lambda =
          C_red/N ASCENDING, where lambda is QUOTED from IN-1 as
          lambda_C_red_over_N. The selected six are THE THREE WITH THE SMALLEST
          LAMBDA AND THE THREE WITH THE LARGEST LAMBDA. Ties, if any existed, would
          be broken by the order of first appearance in IN-1's cells array; the 29
          quoted lambda values are pairwise distinct as quoted to eight decimal
          places, so no tie arises.
        why_this_rule: >-
          BECAUSE LAMBDA IS THE ONLY PARAMETER THAT DRIVES THE PROCESS, AND THE RULE
          KEYS ON NOTHING SAMPLED. lambda, and therefore the selection, is DETERMINED
          arithmetic on committed integer constants; NO SAMPLED QUANTITY, no z
          statistic, no residual and no committed mean enters the rule, SO IT CANNOT
          BE TUNED TO THE DATA IN EITHER DIRECTION. Taking both extremes rather than
          a contiguous band spans the realised lambda range, so that if any offset
          depended on lambda the block would show it across the widest available
          span.
        the_selected_six_named_with_their_quoted_lambda:
          - 'T-18-2-B34 - lambda 0.00220858, the smallest of the 29'
          - 'T-18-2-B44 - lambda 0.00369879, the second smallest'
          - 'T-18-2-B58 - lambda 0.00642703, the third smallest'
          - 'T-14-2-B118 - lambda 0.41891811, the third largest'
          - 'T-16-2-B246 - lambda 0.46101809, the second largest'
          - 'T-12-2-B62 - lambda 0.48037991, the largest of the 29'
        the_selection_is_verifiable_and_the_verification_is_ordered: >-
          THE SIX NAMES ABOVE WERE SELECTED BY THE AUTHORING SESSION BY HAND FROM
          THE 29 QUOTED LAMBDA VALUES, WITHOUT AN INTERPRETER. The RULE is the
          binding object and the NAMES are its stated consequence. TASK-20260729-033
          IS REQUIRED TO RE-APPLY THE RULE TO IN-1 AND TO CONFIRM OR CONTRADICT THE
          SIX NAMES; a contradiction is a defect in this contract to be reported as
          a numbered objection, and the RULE governs over the names if they ever
          disagree.
      the_block_is_ten_tuples: >-
        `ten` IS A COUNT and its members are the four named above plus the six named
        above. Each of the ten is run in BOTH legs at 10000 replicates, giving 20
        seeded streams, and `20` IS A COUNT whose members are the ten tuples crossed
        with the two arm labels.
      the_block_feeds_nothing: >-
        RESTATED AT THE POINT OF DEFINITION. THE WHOLE BLOCK FEEDS NO CRITERION, NO
        THRESHOLD, NO INVALIDATION RULE AND NO VERDICT, and it is never pooled with,
        averaged into, substituted for or compared against the primary observation
        OM-5 or any quantity of the 48-tuple arm.
    stream_independence_declaration: >-
      EVERY ARM AND EVERY LEG OF THIS EXPERIMENT USES INDEPENDENT STREAMS, because
      the arm labels are pairwise distinct and the master seeds are pairwise
      distinct, so no two seed strings coincide. Common random numbers are NOT used
      anywhere. The independence is what makes the standard error of the
      high-precision difference column computable at all, and it is what IV-2
      checks rather than assumes.
    independent_instances: 48
    replication_honesty_note: >-
      48 PARAMETER TUPLES ARE NOT 48 REPLICATIONS OF A RESULT, AND THIS EXPERIMENT
      IS NOT A REPLICATION OF A FINDING. They are 48 parameter points of one
      simulation of one analytic process, drawn on one platform under one
      implementation in one batch, all of whose parameters come from a SINGLE
      UNREPLICATED SOURCE RUN SET of four field sizes on one curve each. WHAT IS
      REPLICATED HERE IS ONE STATISTIC OF ONE INSTRUMENT UNDER ONE NEW RANDOM
      STREAM. No strength above `preliminary` may be claimed from the pair of run
      sets, and `reject_scoped` on either is FORBIDDEN by agents/coordinator.md -
      the correct pair, if the evidence points that way, is `weaken` plus a NAMED
      replication.

  platform_and_interpreter_disclosure:
    it_is_mandatory: >-
      THIS CLAUSE IS MANDATORY, IS THE CLAUSE MOST LIKELY TO BE FUDGED, AND IS
      ENFORCED BY INVALIDATION RULE IV-7.
    what_must_be_recorded_before_the_first_draw: >-
      The driver records, IN EVERY MANIFEST AND IN EVERY results.json, BEFORE THE
      FIRST DRAW OF THAT RUN, the exact strings returned by sys.version,
      sys.executable, platform.platform(), platform.machine(),
      platform.processor() and numpy.__version__. ONE numpy version is used across
      all three arms, all 48 tuples, all ten block tuples and all eight
      known-answer cases; any mid-batch change fires IV-7 and ST-3 STOP AND REPORT.
      No version is named in this contract, because the authoring session has no
      shell and NAMING A VERSION IT HAS NOT OBSERVED WOULD BE FABRICATION.
    the_committed_reference_environment_quoted: >-
      QUOTED FROM THE COMMITTED EXP-YIELD-002 MANIFEST AT
      c7189f80225bad0d0d2aa28cbbbb11e672d30dd6 AND NOT OBSERVED BY THIS SESSION -
      python_version begins `3.13.1 (v3.13.1:06714517797, Dec  3 2024, 14:00:22)`,
      platform `macOS-26.6-arm64-arm-64bit-Mach-O`, machine `arm64`, processor
      `arm`, numpy `2.4.0`.
    PP_1_the_interpreter_build_attempt:
      it_is_an_attempt_and_it_is_required: >-
        THE EXECUTOR MUST ATTEMPT to obtain a GENUINELY DIFFERENT INTERPRETER BUILD
        from the committed 3.13.1, RECORD EXACTLY WHAT IT OBTAINED AND EXACTLY WHAT
        IT COULD NOT, and SAY SO PLAINLY if nothing differed. SILENTLY OMITTING THE
        ATTEMPT IS FORBIDDEN, and so is claiming portability that was not tested.
      what_the_dispatcher_reports_and_what_this_session_verified: >-
        THE DISPATCHING ORCHESTRATOR REPORTS THAT python3.11, python3.13 AND
        python3.14 ARE INSTALLED ON THE EXECUTING HOST, so a different interpreter
        BUILD is testable. THE AUTHORING SESSION HAS NO SHELL AND VERIFIED NONE OF
        THAT; it is recorded as a dispatcher report, not as an observation of this
        session, and the Executor records what it actually finds.
      the_procedure: >-
        The Executor enumerates the interpreter builds available on the host,
        records for each the exact sys.version and sys.executable and whether numpy
        imports there and at which exact version, and then - IF AND ONLY IF a build
        different from the primary one has an importable numpy - RE-EXECUTES THE
        PRIMARY 48-TUPLE ARM UNDER THAT BUILD, under the SAME master seed 130301 and
        the SAME arm label REPLICATE-REPAIRED, and records the resulting 48-tuple
        z_sem mean, sd and standard error as a SECOND, SEPARATELY LABELLED
        OBSERVATION inside RUN-YIELD-003-REPLICATE-REPAIRED's results.json.
      it_is_not_a_fourth_run_and_it_is_not_an_arm: >-
        PP-1 IS A DECLARED SUB-BLOCK OF RUN-YIELD-003-REPLICATE-REPAIRED. It creates
        no fourth run identifier, no fourth run directory and no additional artifact
        path, so the declared artifact set and the committed artifact set stay
        equal. It feeds no criterion and is never pooled with, averaged into or
        substituted for the primary observation OM-5.
      what_PP_1_can_and_cannot_show_stated_before_it_runs: >-
        STATED IN ADVANCE SO IT CANNOT BE READ AGAINST THE NUMBERS, AND IT IS THE
        SUBTLE PART OF THIS CLAUSE. CASE ONE - if the second build carries THE SAME
        numpy version, the numpy Generator stream is fixed by the numpy version and
        the seed, not by the CPython build, so a BIT-IDENTICAL result is what a
        correct pipeline produces; PP-1 then tests ONLY that the interpreter build
        does not change the arithmetic, and it CANNOT separate a driver property
        from a build property, because it produces the same numbers by construction.
        A DIFFERENCE IN CASE ONE WOULD BE A FINDING ABOUT THE PIPELINE and is
        reported as one. CASE TWO - if the second build carries A DIFFERENT numpy
        version, the stream changes entirely, so PP-1 is a SECOND FRESH-STREAM DRAW
        that also happens to be under a different build; it therefore CONFOUNDS
        build with stream and cannot attribute any difference to either. CASE THREE
        - if no second build has an importable numpy, PP-1 records NOT OBTAINED with
        the exact failure, and nothing about builds is established. IN ALL THREE
        CASES THE PLATFORM DOES NOT CHANGE.
      no_fabrication: >-
        If a build is unavailable, or numpy is absent there, or the re-execution
        fails, the run records the exact command attempted and the exact failure and
        marks PP-1 NOT OBTAINED. IT DOES NOT ESTIMATE, SIMULATE, INFER OR OMIT THE
        RESULT, and a NOT OBTAINED PP-1 is not a negative result about anything.
    the_platform_cannot_vary_and_this_is_stated_plainly: >-
      A GENUINELY DIFFERENT OPERATING SYSTEM AND A GENUINELY DIFFERENT MACHINE
      ARCHITECTURE ARE NOT AVAILABLE. This harness runs on ONE macOS arm64 machine.
      The Executor states that PLAINLY in every manifest and in results.json rather
      than leaving it to be inferred from an absent field, and NO RECORD PRODUCED BY
      THIS BATCH MAY DESCRIBE THIS EXPERIMENT AS A FRESH-PLATFORM REPLICATION.

