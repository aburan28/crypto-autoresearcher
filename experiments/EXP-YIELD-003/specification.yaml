      - >-
        P_pred - QUOTED from IN-1. DETERMINED. It is UNCHANGED by this contract,
        is never recomputed against a repaired process, never adjusted and never
        refitted.
      - >-
        lambda = C_red/N, exp(-lambda), and T = the size of S_(m-2) times
