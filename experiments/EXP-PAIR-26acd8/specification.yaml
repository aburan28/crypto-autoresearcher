# =============================================================================
# EXP-PAIR-26acd8 — version 1, review_required. Specified from
# IDEA-20261006-2cd127 / H-PAIR-79f258. GOAL-ECDLP-001 does not state
# an approval-queue cap. python3 tools/portfolio_kpis.py --capacity
# GOAL-ECDLP-001 on the shared checkout reported approved_unrun=7 and
# headroom=0. Four of those contracts are on origin/main with status
# approved, that goal_id, and no run files: EXP-ECDLP-08f99d,
# EXP-ECDLP-b2e5d1, EXP-SEMAEV-a097b5, EXP-SMTH-9d04ba. An approving
# DEC-20261007 would be rejected by check_approval_capacity. This
# contract therefore stays review_required. Success is the source
# idea's prediction: I_shift - I_ell >= 2 and b >= 2, with the control
# gap at most 1. The concrete negative is that the instrument checks
# pass and at least one of those three comparisons fails. This
# session did not enumerate the pairs. Source idea bytes are blob
# d6a4c0c82038f5582b0615b99ebb00bd677d8074.
# =============================================================================
experiment:
  id: EXP-PAIR-26acd8
  hypothesis_id: H-PAIR-79f258
  question_id: RQ-ECDLP-623a32
  goal_id: GOAL-ECDLP-001
  source_idea: IDEA-20261006-2cd127
  version: 1
  title: >-
    Image of x(P+T) times x(Q) on y^2 = x^3 - x over F_17
  status: review_required
  approved_by: null
  designed_at: '2026-10-07'
  frozen: true
  execution_authorized: false
  packaging_only: false
  approval:
    approved_by: null
    composing_decision: DEC-20261007-07512a
    implementation_authorized: false
    scientific_execution_authorized: false
    scientific_execution_scope: >-
      When a later decision approves this contract, work only on
      y^2 = x^3 - x with T = (1, 0) and y^2 = x^3 + x with
      T_0 = (0, 0), both over F_17. Score I_shift minus I_ell, the
      branching b, and the control gap. Do not search for a discrete
      logarithm and do not add a prime to the claim.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
      applied: false
      not_applied_because: >-
        check_approval_capacity refuses a DEC-20261007 whose decision
        approves an experiment with goal_id GOAL-ECDLP-001 while that
        goal already holds at least four approved contracts with no
        run. The goal record does not itself state that cap.

  objective: >-
    Decide whether I_shift minus I_ell is at least 2, whether b is at
    least 2, and whether the same gap on the control curve is at most
    1. The concrete negative is that the instrument checks pass and
    at least one of those three comparisons fails. No faster discrete
    logarithm is in scope.

  inputs:
    curve: >-
      A = -1, model y^2 = x^3 - x over F_17. T = (1, 0). The driver
      checks that T lies on the curve and has order 2.
    curve_0: >-
      A = 1, model y^2 = x^3 + x over F_17. T_0 = (0, 0). The driver
      checks that T_0 lies on the curve and has order 2.
    pairs: >-
      Ordered pairs of affine points (P, Q). P is not the torsion
      point of that curve. Q ranges over every affine point, including
      the torsion point. Products are in F_17. Pairs with a zero
      factor stay in the count. Their zero bin is reported separately.
    addition: >-
      Chord-and-tangent addition in experiments/EXP-PAIR-26acd8/implementation/run.py.
      The checker is experiments/EXP-PAIR-26acd8/implementation/check.py.
      Translation by T is not replaced by a pre-simplified rational map.
    field_shift: >-
      The null operation replaces x(P+T) by x(P)+1 and keeps x(Q).

  controls:
    - id: field-shift
      statement: >-
        On the same pairs, replace x(P+T) by x(P)+1. The success gap
        is I_shift minus I_ell.
    - id: second-curve
      statement: >-
        Repeat the product and the field shift on y^2 = x^3 + x with
        T_0 = (0, 0). Success requires that control gap to be at most 1.
    - id: order-two
      statement: >-
        T and T_0 lie on their curves and double to infinity. One
        failure voids the run.
    - id: affine-translate
      statement: >-
        For every domain point, translation by the torsion point is
        affine. One point at infinity voids the run.
    - id: generic-label
      statement: >-
        Replace the enumerated x(P) values by 0, 1, 2, and so on, taken
        modulo 17, add 1 in F_17, and multiply by the same x(Q) list.
        Record that image size. It is an instrument comparison. It does
        not choose the reading row.
    - id: nonsingular-shape
      statement: >-
        17 is odd and both A coefficients are nonzero in F_17.

  independent_variables:
    - which of the two frozen equations is measured
    - whether the first factor is translated by its order-2 point or shifted by adding 1

  metrics:
    primary:
      - id: gap
        statement: >-
          I_shift minus I_ell on y^2 = x^3 - x. The idea's prediction
          is a difference of at least 2. The concrete negative includes
          a difference of at most 1, with the instrument checks passed.
      - id: branching
        statement: >-
          b, the largest number of distinct translated products inside
          one fiber of the untranslated product. The prediction is at
          least 2. The concrete negative includes b equal to 0 or 1.
      - id: gap0
        statement: >-
          I_shift0 minus I_ell0 on y^2 = x^3 + x. The prediction is at
          most 1. The concrete negative includes a control gap of at
          least 2.
    secondary:
      - id: I_ell
        statement: image size of x(P+T) times x(Q) on E
      - id: I_shift
        statement: image size of (x(P)+1) times x(Q) on E
      - id: L_integers
        statement: >-
          The pair (n_S, number of distinct untranslated products). L
          is log2 of the first minus log2 of the second. The integers
          are recorded. L is not a success threshold.
      - id: zero bins
        statement: counts of pairs whose product is 0, kept in the images
      - id: I_generic
        statement: image size of the arithmetic-progression label control

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 is the claim that the translated product image on E is at
    least 2 smaller than the field-shift image, that b is at least 2,
    and that the control curve's gap is at most 1. The F_29 repeat in
    the source idea is not part of this contract.

  preregistered_prediction:
    quantity: >-
      The image gap and the branching of x(P+T) times x(Q) on
      y^2 = x^3 - x over F_17, compared with the field shift and with
      y^2 = x^3 + x.
    formula: >-
      I_shift - I_ell >= 2 and b >= 2, and I_shift0 - I_ell0 <= 1.
      The concrete negative is that the instrument checks pass and at
      least one of those three comparisons fails. Source idea
      IDEA-20261006-2cd127. The pairs were not enumerated before this
      formula was written.
    source: >-
      IDEA-20261006-2cd127. KR-RHO-13bf67, KR-RHO-fb88e6,
      KR-RHO-5b1c0a, KR-RHO-6654ba, KR-IC-5a43e5, and KR-IC-46d822
      were opened in this session and do not state this image gap.

  scale_relevance:
    tier: toy
    justification: >-
      F_17 is below a cryptographic field. No transfer to a larger
      prime is assumed. The sample is these two equations. The minimum
      effect is the idea's own gap of 2 and branching of 2.
    correspondence: >-
      Direct enumeration of affine points. No Deuring correspondence
      is used.

  tail_checks:
    - >-
      Success is the conjunction of the three inequalities. A single
      failed comparison is the negative. No third threshold is
      introduced after the images are seen.
    - >-
      The zero bin is written into the artifact. It does not choose
      the reading row by itself.

  replication:
    seeds:
      - EXP-PAIR-26acd8|claim|deterministic
    independent_instances: 1
    future_run_slot: RUN-PAIR-20f63c
    note: >-
      The enumeration is deterministic. The replication plan names one
      future run slot, RUN-PAIR-20f63c, which the trial plan binds and
      this session does not launch. The order-2 check and the
      affine-translate check are the replication of the instrument.
      The source idea's F_29 repeat is a later contract, not this slot.

  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One manifest covers both curves and the label control. The 1 GB
      figure is machine protection for the pair lists. A watchdog
      expiry is failed_infrastructure, not a value of the gap.

  stopping_rules:
    - Stop after one reading row is named.
    - Do not change either equation and do not replace the thresholds 2 and 1 after seeing the images.
    - Do not let the generic-label image choose the row.
    - A timeout voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - A torsion point that is not order 2, or a translation that lands at infinity, voids the run.
    - Scoring any curve other than the two frozen curves voids the run.
    - Replacing chord-and-tangent addition by a pre-simplified rational map voids the run.

  success_criterion: >-
    The instrument checks pass, I_shift minus I_ell is at least 2, b
    is at least 2, and the image gap on y^2 = x^3 + x is at most 1.
    This is the prediction of IDEA-20261006-2cd127. It is reachable as
    a failure when the instrument checks pass and at least one of
    those three comparisons fails.

  falsification_criterion: >-
    The instrument checks pass and at least one comparison fails:
    I_shift minus I_ell is less than 2, or b is 0 or 1, or the image
    gap on y^2 = x^3 + x is at least 2. A calibration failure and a
    timeout are not this negative.

  decision_impact:
    on_positive: >-
      A later evidence review may record that these two equations at
      p = 17 have a translated-product image at least 2 smaller than
      the field-shift image, with branching at least 2, and with the
      control gap at most 1. The generic exponent stays 1/2. No
      knowledge entry is promoted from this design record.
    on_negative: >-
      A later evidence review may record that the prediction fails on
      this scope: the gap on E is at most 1, or b is at most 1, or the
      control gap is at least 2. The generic exponent stays 1/2. The
      two outcomes name different inequalities.

  required_artifacts:
    - experiments/EXP-PAIR-26acd8/runs/RUN-PAIR-20f63c/manifest.yaml
    - experiments/EXP-PAIR-26acd8/runs/RUN-PAIR-20f63c/raw-result.json
    - experiments/EXP-PAIR-26acd8/runs/RUN-PAIR-20f63c/reading.yaml

  assigned_to: executor
