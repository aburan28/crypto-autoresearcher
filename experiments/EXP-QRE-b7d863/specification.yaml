experiment:
  id: EXP-QRE-b7d863
  hypothesis_id: H-QRE-6265e5
  derived_from_idea: IDEA-20260809-593de3
  question_id: RQ-QRE-6dba8c
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Validated Toffoli count for this program's own reversible modular-arithmetic
    layer - dual independent counters, exact classical simulation of the emitted
    circuit, and a closed form scored only on held-out bit widths

  objective: >-
    The one uncertainty a run reduces is whether this program can state a Toffoli
    count for the modular-arithmetic layer that is its own computation rather than a
    citation, and whether that count has a closed form trustworthy enough to quote at
    a width nobody built. A run establishes (i) whether the constructed circuits
    compute their intended modular functions reversibly with clean ancillae, checked
    against an independently written reference; (ii) whether two independently
    implemented gate counters agree exactly at every width; (iii) the exact Toffoli,
    CNOT and ancilla counts per (family, width, modulus); and (iv) whether a closed
    form fitted on {4, 6, 8, 10} predicts the counts at held-out widths {12, 16} with
    zero residual. No quantum feasibility claim, no timeline, and no statement about
    any cryptographic system follows from a run.

  what_this_is_not:
    - >-
      Not a quantum resource estimate. A gate count is one input to an estimate whose
      other inputs - error-correction overhead, physical error rates, architecture -
      are absent here entirely.
    - >-
      Not a validation, refutation, confirmation or comparison of any published
      circuit construction. It measures the construction implemented in this program.
    - >-
      Not a statement about when or whether any cryptographic system is at risk.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run has
      been executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE. For the modular adder, multiplier and exponentiator
      as constructed in this program, at bit widths 4 to 16 and the declared moduli,
      over the Toffoli/CNOT/X gate set: the circuits do or do not compute their
      intended functions reversibly with clean ancillae; the exact gate counts are the
      reported integers; and a stated closed form does or does not reproduce them at
      held-out widths. WHAT DOES NOT FOLLOW - no count for any other construction; no
      count at cryptographic width except as a MODELLED value derived from a formula
      that survived held-out prediction and labelled modelled; no depth, qubit, T-count
      or T-depth claim; no resource estimate; and no security consequence of any kind.

  inputs:
    procedure: >-
      STAGE 0 (zero compute). Declare, before any circuit is built, the fitting set
      {4, 6, 8, 10}, the held-out set {12, 16}, the closed-form ansatz family the
      construction schema implies, and the sample size per width. Hash the declaration.
      STAGE 1 (minutes). Emit the gate list for each (family, width, modulus). Count
      by post-hoc traversal of the emitted list. SEPARATELY, count by accumulation
      inside the builder, in a code path that does not read the emitted list. Require
      exact integer agreement on Toffoli, CNOT and ancilla counts.
      STAGE 2 (minutes). Simulate each emitted circuit on computational-basis inputs:
      exhaustively where n <= 6, otherwise on 1000 inputs drawn from a frozen seed.
      Compare against an independently written modular-arithmetic reference. Check
      every ancilla returns to zero. Check invertibility by composing the circuit with
      its reverse and requiring recovery of the input.
      STAGE 3 (minutes). Fit the declared closed form to the FITTING SET ONLY. Predict
      the held-out widths. Report the residual as an exact integer. A fit re-scored on
      the fitting set is not reported as validation.
      STAGE 4 (zero compute). Assemble the count table with the measured/modelled
      boundary marked, and state explicitly whether extrapolation beyond width 16 is
      permitted by the held-out result.
    instrument: >-
      Python 3.11, pure Python plus numpy. Circuits are emitted as explicit gate lists;
      simulation applies the gate list directly to an integer register, which is exact
      because Toffoli, CNOT and X preserve computational-basis states. The reference
      modular arithmetic lives in a separate module using Python integers and is not
      imported by the builder. Two counters live in separate modules. No quantum
      simulator dependency, no state-vector simulation. Recorded through
      harness/runner.py.
    parameters: >-
      Families - modular adder, modular multiplier, modular exponentiator. Widths -
      fitting set {4, 6, 8, 10}, held-out set {12, 16}. Moduli per width - one prime,
      one odd composite, one power of two, all at the top of the width. Inputs -
      exhaustive for n <= 6, else 1000 random inputs from seed 20260825. Gate set -
      Toffoli, CNOT, X. The closed-form ansatz and the fitting/held-out split are
      frozen at STAGE 0 and are not revised after seeing a residual.

  controls:
    - >-
      INDEPENDENT REFERENCE. The intended modular function is computed by a module
      that the circuit builder does not import. A self-consistent builder checked
      against itself checks nothing.
    - >-
      DUAL INDEPENDENT COUNTERS. One traverses the emitted gate list; one accumulates
      at construction time. Exact agreement is required. Two counters sharing a helper
      are not two counters, and the contract requires the modules be disjoint.
    - >-
      REVERSIBILITY CONTROL. Each circuit composed with its inverse must recover every
      tested input, and every ancilla must return to zero. An irreversible step makes
      the count meaningless in the fault-tolerant setting.
    - >-
      NULL OBJECT - THE DELIBERATELY BROKEN CIRCUIT. Inject a single known fault (one
      Toffoli's controls swapped, in a separate arm that is never merged into the
      reported circuit) and require the simulation check to FAIL on it. A correctness
      check that has never been shown to fail is not a check; this is the cheapest
      possible demonstration that it can.
    - >-
      NULL OBJECT - THE DELIBERATELY WRONG COUNTER. Run the count comparison against a
      counter with a known off-by-one on one block type, in the same throwaway arm,
      and require the agreement check to FAIL on it.
    - >-
      HELD-OUT SPLIT, DECLARED BEFORE ANY CIRCUIT IS BUILT. A formula scored on the
      widths it was fitted to cannot fail, which is precisely the failure mode this
      control removes.
    - >-
      MODULUS CONTROL. Three moduli per width, including a power of two, because
      modular reduction paths commonly branch there and a width-only count would hide
      the branch.

  independent_variables:
    - 'circuit family: modular adder / modular multiplier / modular exponentiator'
    - bit width n
    - modulus class (prime, odd composite, power of two)
    - 'counter: traversal versus construction-time accumulation'
    - 'arm: reported circuit versus deliberately faulted null circuit'

  metrics:
    primary:
      - >-
        Toffoli count per (family, width, modulus), reported as an exact integer by
        each of the two counters, with the agreement flag.
      - >-
        Simulation agreement fraction per (family, width, modulus), computed as the
        number of tested inputs whose circuit output equals the independent reference
        divided by the number of tested inputs.
      - >-
        Ancilla cleanliness fraction, computed the same way over the requirement that
        every ancilla register equals zero after execution.
      - >-
        Held-out residual, computed as the exact integer difference between the closed
        form evaluated at each held-out width and the measured Toffoli count there,
        where the closed form was fitted on the fitting set only.
      - >-
        Invertibility fraction, the fraction of tested inputs recovered by the circuit
        composed with its reverse.
    secondary:
      - CNOT count and ancilla count per (family, width, modulus), both counters.
      - Total gate count and circuit length as emitted.
      - Simulation wall time per width, as a feasibility record for larger widths.
      - Null-arm results - the faulted circuit's agreement fraction and the faulted counter's disagreement.
      - The fitted coefficients of the closed form and the ansatz they belong to.
      - Peak memory of the emitter at width 16.

  heuristic_under_test: null
  heuristic_under_test_note: >-
    Explicitly null. H-QRE-6265e5 carries no numbered heuristic. The closed form is
    not a heuristic about a distribution; it is an algebraic identity claimed of a
    deterministic construction, and it is tested by held-out prediction rather than by
    distributional comparison. Calling it a heuristic would misstate what is at risk.

  preregistered_prediction:
    quantity: >-
      The held-out residual of the fitted Toffoli-count closed form at widths 12 and
      16, together with the simulation agreement fraction at every width.
    formula: >-
      residual(n) := f_hat(n) - T_measured(n), where f_hat is the declared ansatz
      fitted on widths {4, 6, 8, 10} only. Predicted residual(12) = residual(16) = 0
      exactly, because a gate count of a deterministic construction is combinatorial.
      Predicted simulation agreement = 1.000 at every width. Under the alternative
      that the construction has an uncaptured width-dependent branch, residual is a
      nonzero integer and extrapolation is refused.
    source: >-
      Pre-registered in the parent proposal IDEA-20260809-593de3, whose predictions
      block states "matches the construction's closed form exactly, since the count is
      combinatorial rather than empirical" and "one" for simulation agreement. The
      held-out split is this contract's addition and is declared at STAGE 0 before any
      circuit is built; it is the only thing that makes the first prediction capable
      of failing.

  scale_relevance:
    tier: toy
    justification: >-
      Widths 4 to 16 are far below any cryptographic width, and they are chosen
      because exact classical simulation of the emitted circuit is the validation and
      it must remain affordable. The transfer assumption is stated and is narrow - that
      a closed form which reproduces the exact integer count at two widths outside the
      set it was fitted to is the construction's own count function - and it is
      explicitly NOT a claim that anything about the construction's behaviour at
      cryptographic width was measured. Any count quoted above width 16 is MODELLED.
    correspondence: null

  tail_checks:
    - >-
      Report the count at each modulus separately, never averaged; a width-only count
      that hides a modulus dependence is the most likely silent error here.
    - >-
      Report the residual as an exact integer, never a relative error; a relative
      error near zero on a count in the millions can still be a wrong formula.
    - >-
      Report which inputs failed, if any, rather than only the failure fraction, since
      a systematic failure (e.g. only on inputs at or above the modulus) localizes the
      defect and a random one does not.
    - >-
      Report the null-arm results in the same file, so that a reader can see the
      correctness check demonstrated failing before crediting it passing.

  replication:
    seeds: [20260825, 20260826, 20260827]
    independent_instances: 3
    repeat_count_per_cell: 1
    note: >-
      Counts are deterministic and do not need repetition; the seeds vary only the
      random input sample used for the simulation check, so three seeds give three
      independent correctness samples at each width above 6.

  budget:
    wall_clock_seconds: 1800
    wall_clock_seconds_note: Per run. total_cpu_hours bounds the whole contract.
    total_cpu_hours: 2.0
    memory_gb: 4
    maximum_runs: 20

  stopping_rules:
    - >-
      Stop and report if the null arm's faulted circuit PASSES the correctness check,
      because the check is then inoperative and nothing downstream is interpretable.
    - >-
      Stop the family and report if simulation agreement falls below 1.000 at any
      width; no count is reported for that family.
    - >-
      Stop and report if the two counters disagree; localizing the discrepancy is the
      deliverable and no count is published until it is localized.
    - >-
      Reduce the held-out set to width 12 only, under a filed protocol_amendment, if
      width 16 exceeds the wall clock; the weakened check is reported as weakened and
      never as the original.
    - >-
      Stop at maximum_runs or total_cpu_hours. Budget exhaustion is a stop, never a
      negative result (AGENTS.md rule 5).

  invalidation_rules:
    - >-
      A timeout, crash or dependency failure makes the run failed_infrastructure and
      is NEVER negative evidence about the construction.
    - >-
      A run in which the closed form was fitted on any held-out width is
      invalid_measurement; the held-out check is the only part of this contract that
      can fail and contaminating it removes the experiment's content.
    - >-
      A run in which the two counters share a module is invalid_measurement, because
      the independence the agreement check assumes does not exist.
    - >-
      A run whose reference module imports the builder is invalid_measurement for the
      same reason.
    - >-
      A run in which the null arm was not executed in the same invocation is
      invalid_measurement.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment
      and requires a new contract.

  success_criterion: >-
    ALL of the following, each decidable from the primary metrics. (1) The null arm's
    faulted circuit fails the correctness check and the faulted counter fails the
    agreement check, demonstrating both checks operative. (2) Simulation agreement,
    ancilla cleanliness and invertibility are all exactly 1.000 at every executed
    (family, width, modulus). (3) The two independent counters agree as exact integers
    on Toffoli, CNOT and ancilla counts at every executed cell. (4) The held-out
    residual is exactly 0 at every held-out width. A run meeting (1) to (4) supports
    H-QRE-6265e5 (Q1), (Q2) and (Q3) in scope and licenses use of the closed form to
    state MODELLED counts at untested widths. A run meeting (1) to (3) but not (4)
    supports (Q1) and (Q2), REFUTES (Q3), and the deliverable is the measured table
    with extrapolation explicitly refused.

  falsification_criterion:
    - >-
      Simulation agreement below 1.000 at any width falsifies (Q1) for that family;
      the circuit does not compute the intended function and no count is reported.
    - >-
      Ancillae not returned to zero, or invertibility below 1.000, falsifies (Q1) and
      makes the count incomparable to any fault-tolerant count.
    - >-
      Counter disagreement at any width falsifies (Q2); at least one counter is wrong
      and no count may be published until the discrepancy is localized.
    - >-
      A nonzero held-out residual at any held-out width falsifies (Q3). The
      construction contains a width-dependent branch the ansatz does not capture, and
      no count may be quoted at any width that was not built.
    - >-
      A count that depends on the modulus at fixed width beyond exact equality means
      the count function has two arguments, not one; (Q3) as stated is falsified and
      the corrected two-argument table is the deliverable.
    - >-
      The faulted null circuit passing the correctness check falsifies the
      INSTRUMENT, and no result from any arm may be reported.

  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - >-
      the STAGE 0 declaration - ansatz family, fitting set, held-out set, sample sizes
      - written before any circuit was built and hashed
    - raw-result.json with per-input simulation outcomes, not only fractions
    - the emitted gate lists, or their sha256 plus lengths, per (family, width, modulus)
    - both counters' integer outputs side by side, per cell
    - the null arm's measurements, in the same file as the signal arm
    - the fitted coefficients, the held-out predictions, and the exact integer residuals

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and NOT
      approved; approved_by is null and execution_authorized is false. Approval is the
      USER's gate because it authorizes execution and spends compute.
    - >-
      The STAGE 0 declaration must be hashed and archived before STAGE 1 runs. A
      held-out split declared after a residual is seen is not a held-out split.
    - >-
      Any use of the resulting count in a downstream resource estimate is a separate
      decision and is not authorized by approving this contract.

  derivation_provenance:
    tool: coordinator subagent, /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260809-593de3
    authored_at: '2026-08-25'
    note: >-
      Families, counting-method duplication, simulation validation and reversibility
      control come from the parent proposal's mechanism and controls blocks. The
      HELD-OUT SPLIT and the two NULL ARMS are this contract's additions, added
      because the proposal as written could not fail: a formula scored on the widths
      it was fitted to always fits, and a correctness check never shown to fail is not
      evidence. Budgets come from the parent's estimated_cost (implementation medium,
      compute low). No measurement, timing, run or citation is invented.

  derivation_gaps:
    - >-
      The parent proposal names "published reversible modular arithmetic
      constructions" as RECALLED, REQUIRED READS and none has been read by this
      program. The contract therefore measures A construction assembled here from a
      schema, and the schema's provenance must be recorded in the run manifest as
      recalled. No published count is reproduced or compared, and any record doing so
      later would need the source filed as a KN-LIT entry first.
    - >-
      The closed-form ansatz family is declared at STAGE 0 but is not fixed in this
      contract, because it follows from the schema the executor implements. A
      Coordinator must fix it at approval time; choosing an ansatz after seeing the
      counts is the single most likely way this contract silently becomes a fit.
    - >-
      Depth, qubit count, T-count and T-depth are not measured. A count without them
      cannot rank two constructions, and the goal's later totals must not treat this
      contract as having supplied them.
    - >-
      1000 random inputs per width is a sample, not a proof of correctness above width
      6. The residual risk of a fault on an untested input is real and is not
      quantified here; exhaustive checking is affordable only to width 6.
