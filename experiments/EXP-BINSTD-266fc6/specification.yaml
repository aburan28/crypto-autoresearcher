# Part-2 CERT-LABEL/QUOT/BIND independence under planted single-axis faults.
# Source: IDEA-20261001-2b71e5 / H-BINSTD-953387 / RQ-BINSTD-b6f698 /
# GOAL-ECDLP2M-001. Stages 0-1 only. ZERO RUNS in this design packet.
# No AUXIN. Amazon Bedrock prohibited. Unlocks /run admission via
# trial-plan-v1.json + implementation/run.py (stub fixtures).
# =============================================================================
experiment:
  id: EXP-BINSTD-266fc6
  hypothesis_id: H-BINSTD-953387
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-2b71e5
  goal_id: GOAL-ECDLP2M-001
  parent_experiment_id: EXP-BINSTD-178742
  version: 1
  title: >-
    Planted single-axis CERT-LABEL/QUOT/BIND independence bake-off at n=17
    (Stages 0-1; stub fixtures admit without curve libs)
  status: approved
  approved_by: DEC-20261003-63fca9
  approved_at: '2026-10-03'
  frozen: true
  execution_authorized: true
  approval:
    approved_by: DEC-20261003-63fca9
    composing_decision: DEC-20261003-63fca9
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete. Approval does not assert the hypothesis is true.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Freeze the planted-fault API (Stage 0), then measure the 3x3
    accept/reject matrix for CERT-LABEL/QUOT/BIND under single-axis plants
    on >=50 stub (or later live) relations at n=17 (Stage 1), with no-fault,
    triple-fault, and off-certificate null controls. Report E-INDEPENDENT or
    E-COUPLED (or control/impediment outcomes). No O-SUPPORT claim.

  class: instrument
  class_note: >-
    Instrument validating HEUR-BINSTD-2b71e5-H1 at toy/stub scale. Not an
    exponent-moving or cost-model experiment.

  scope:
    included:
      - >-
        Stage 0: freeze planted-fault API + preregistered predictions +
        control list BEFORE any Stage-1 rate. Zero scientific rates in Stage 0.
      - >-
        Stage 1: n=17, >=50 relations x 3 single-axis plants; 3x3 matrix;
        controls ctl_no_fault_all_green, ctl_triple_fault_all_red,
        null_object_random_bit_flip_off_certificate_bytes.
    excluded:
      - Stage 2 n=23 replicate (requires a later decision)
      - Magma / Sage / AUXIN / Bedrock as success path
      - O-SUPPORT / break / exponent / n>=131 transfer
      - Editing EXP-BINSTD-178742 frozen specification bytes
      - Reading Part-2 ranks as scientific support from this EXP alone

  inputs:
    proposal: ledger/proposals/IDEA-20261001-2b71e5.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-953387.yaml
    parent_contract: experiments/EXP-BINSTD-178742/specification.yaml
    parent_part2_surface: experiments/EXP-BINSTD-178742/implementation/typed/part2_surface.py
    trial_plan: experiments/EXP-BINSTD-266fc6/trial-plan-v1.json
    implementation:
      - experiments/EXP-BINSTD-266fc6/implementation/run.py
      - experiments/EXP-BINSTD-266fc6/implementation/check.py

  controls:
    - id: ctl_no_fault_all_green
      role: positive control — unplanted relations must keep all three certificates accepting
    - id: ctl_triple_fault_all_red
      role: positive control — triple plant must keep all three rejecting
    - id: ctl_single_axis_plant_label
      role: treatment — plant label only
    - id: ctl_single_axis_plant_quot
      role: treatment — plant quot only
    - id: ctl_single_axis_plant_bind
      role: treatment — plant bind only
    - id: null_object_random_bit_flip_off_certificate_bytes
      role: null object — flip bytes outside certificate predicates; certificates must stay green

  independent_variables:
    - planted_axis: [none, label, quot, bind, triple, null_off_cert]
    - n: [17]
    - fixture_kind: [stub_synthetic]

  metrics:
    primary:
      - id: on_axis_reject_rate
        definition: Fraction of planted relations where the matching certificate rejects
        threshold: '>=0.99 per axis for E-INDEPENDENT'
      - id: off_axis_accept_rate
        definition: Fraction where each non-planted certificate accepts under a single-axis plant
        threshold: '>=0.99 for E-INDEPENDENT'
    secondary:
      - id: no_fault_red_rate
        definition: Fraction of unplanted relations with any certificate rejecting
        threshold: '<=0.01 or bake-off void'
      - id: cross_talk_rate
        definition: Off-axis reject rate under a single-axis plant
        threshold: '>=0.05 names E-COUPLED if on-axis also weak'

  heuristic_under_test: HEUR-BINSTD-2b71e5-H1
  preregistered_prediction:
    quantity: on_axis_reject_rate and off_axis_accept_rate at n=17
    formula: 'P(reject|plant=axis) >= 0.99 and P(accept|plant!=axis) >= 0.99'
    source: IDEA-20261001-2b71e5 / HEUR-BINSTD-2b71e5-H1

  scale_relevance:
    tier: toy
    justification: >-
      n=17 stub fixtures only in Stages 0-1. No transfer to n>=131. Live
      Part-2 replacement is a disclosed future amendment, not this contract.
    correspondence: null

  tail_checks:
    - id: TC-CONTROLS
      check: no-fault / triple-fault / null-object must pass before E-INDEPENDENT is read

  replication:
    seeds: [2026100326715]
    independent_instances: 50

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: 2
    maximum_memory_gb: 2
    maximum_runs: 3
    maximum_workers: 1

  stopping_rules:
    - id: SR-S0
      rule: Stage 1 does not start until Stage-0 API + predictions exist with hashes recorded
    - id: SR-CONTROL
      rule: If no-fault red_rate >=0.01, stop and report O-CONTROL-FAIL
    - id: SR-BUDGET
      rule: Advisory 2 CPU-hours; overrun is O-IMPEDIMENT, not falsification

  invalidation_rules:
    - id: INV-1
      rule: Editing preregistered-predictions.json after any Stage-1 outcome invalidates interpretation
    - id: INV-2
      rule: Using Magma/Sage/AUXIN/Bedrock as the success path invalidates the run
    - id: INV-3
      rule: Claiming O-SUPPORT / break / exponent from this EXP alone invalidates the report
    - id: INV-4
      rule: Mixing stub and live fixtures in one matrix without an amendment invalidates comparison

  success_criterion: >-
    Stage-0 freeze artifacts exist with recorded hashes before Stage 1, and
    Stage 1 returns exactly one of E-INDEPENDENT, E-COUPLED, or O-CONTROL-FAIL
    with a complete 3x3 matrix on >=50 n=17 relations and passing artifact
    checks — a measurement success in either scientific direction.

  falsification_criterion: >-
    HEUR-BINSTD-2b71e5-H1 independence reading is falsified iff Stage-1
    controls pass AND any on-axis reject_rate <0.99 or any off-axis
    accept_rate <0.99 while the report still claims E-INDEPENDENT (the honest
    label is then E-COUPLED). O-IMPEDIMENT / budget abort is not falsification.

  required_artifacts:
    - experiments/EXP-BINSTD-266fc6/implementation/run.py
    - experiments/EXP-BINSTD-266fc6/implementation/check.py
    - experiments/EXP-BINSTD-266fc6/trial-plan-v1.json
    - experiments/EXP-BINSTD-266fc6/stage0/planted-fault-api.json
    - experiments/EXP-BINSTD-266fc6/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-266fc6/stage1/matrix-n17.json
    - experiments/EXP-BINSTD-266fc6/runs/
    - experiments/EXP-BINSTD-266fc6/RESULTS.md

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.

  archive:
    snapshot: TASK-20261003-f6dbbc
    binding_mode: content_at_commit
    commit_sha: null
