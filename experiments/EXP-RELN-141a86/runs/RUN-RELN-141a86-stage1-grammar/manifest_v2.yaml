  timeline:
    - >-
      2026-09-07T20:42:54Z through 2026-09-08T07:18:08Z: approximately 21
      successive launches of stage1_grammar_driver.py in this run directory,
      each killed by either a container restart (this session's disclosed,
      recurring infrastructure limitation -- see
      RUN-RELN-141a86-stage0c-pexist-extended/manifest.yaml's
      restart_history) or, twice, a real bug (an OverflowError in
      stage1_fit_engine.py's held_out_error and, separately, its
      _weighted_sse training objective, both from e_se ** 2 / term ** 2
      exceeding float range on legitimately huge-but-finite predictions from
      the ZN_interval positive control and high-complexity candidates on the
      random arms; diagnosed and fixed this dispatch, both instances,
      `**` replaced by explicit multiplication -- see implementation.md's
      "Crash diagnosis and fix" section for the full diagnosis). Prior to
      this dispatch's checkpoint-resume fix (below), every one of these ~21
      relaunches restarted the grammar ENUMERATION from complexity 1 (only
      the row-level own-enumeration/E-arm-holdout table caches were
      resumable), so real progress on complexity climbing was effectively
      capped near complexity 4-5 across this entire window despite the table
      data itself being cheap (~1s) to rebuild on each relaunch.
    - >-
      This dispatch (2026-09-08) diagnosed the climb-loss root cause (
      stage1_grammar_driver.py's main() never read enumeration-checkpoint.json
      / pareto-fronts-raw.json back in on startup) and implemented a genuine
      per-complexity-level checkpoint-resume fix (build_level_exprs()
      factored out; startup re-derives, by registration only, never
      re-fitting or re-scoring, every already-completed level, verifying the
      re-derived new_registered count against the original at every level
      before trusting the resume; front_state reloaded verbatim on success).
      Verified by a real SIGKILL-and-resume regression test
      (source/test_stage1_grammar_resume.py) against copies of this run's own
      real cached data, asserting byte-identical front_state between an
      uninterrupted control run and a killed-and-resumed run. Commits
      eb3ed46bc (fix + test) and 923a0840a (production application).
    - >-
      PID 3440 (the launch at 2026-09-08T07:18:08.656670Z, driver-progress.log
      line 1810 -- the last of the ~21 pre-checkpoint-resume-fix relaunches,
      but the FIRST to run with both the held_out_error and _weighted_sse
      overflow fixes simultaneously applied, per the "Relaunch, honestly
      reported" section of implementation.md) was deliberately left
      undisturbed by this dispatch's checkpoint-resume-fix development (fix
      built and tested in a separate temp directory, never touching PID
      3440's own files) and ran uninterrupted for the rest of its natural
      lifetime. It exhaustively completed complexity levels 1 through 6 for
      all 14 targets (level-by-level cumulative elapsed_seconds_total per
      enumeration-checkpoint.json: L1=0.607s, L2=1.083s, L3=26.85s,
      L4=243.415s, L5=4108.41s, L6=39500.881s) and stopped itself, on its own,
      at 2026-09-08T18:16:29.616426Z with stopped_reason=wall_clock_cap
      (39500.9s >= the contract's 21600s stage1_grammar_fits advisory
      ceiling; the cap check fires only between levels, so the slow level 6
      pushed total elapsed well past the nominal cap before the check ran --
      a pre-existing property of the cap check, disclosed, not a bug
      introduced by this dispatch). No container restart or crash ended PID
      3440; it exited cleanly on its own wall-clock-cap logic. This is the
      run's real, exhaustive, complexity-6 result: pareto-fronts-raw.json's
      front_state for every one of the 14 targets was written by, and only
      by, PID 3440.
    - >-
      Immediately after PID 3440 exited (confirmed via ps/kill -0), a
      separately-dispatched agent relaunched the fixed driver as PID 16763
      (2026-09-08T18:16:54.662495Z) with the identical command in
      command.txt. Its resume path activated correctly in production:
      "RESUME: found checkpoint complete through complexity 6" ->
      "RESUME: enumeration state rebuilt through complexity 6 (new_registered
      counts matched at every level, confirming byte-identical re-derivation)
      ... resuming fit/score at complexity 7" (driver-progress.log,
      2026-09-08T18:17:13.633175Z) -- the levels-1-6 rebuild (registration
      only) took ~19s, versus the many hours PID 3440 spent actually scoring
      those levels, and complexity 7 began scoring fresh. This is the exact
      checkpoint-resume mechanism working correctly in a real production
      run, not just in the isolated regression test, and is recorded here as
      a genuine, verified fact about the fix -- separately from the scope
      decision below.
    - >-
      THE COORDINATOR (a later session, this same 2026-09-08) then
      deliberately killed PID 16763 (SIGTERM, confirmed dead) to enforce a
      STANDING PRIOR DECISION recorded in commit 83b4739ee: cap this
      experiment's exhaustive search at C_complete=6, given the demonstrated
      combinatorial per-level cost growth documented in that commit's own
      message (level 6 alone consumed ~9.8 of the run's ~11 total hours; the
      growth pattern level4(243s) -> level5(3865s) -> level6(35392s) predicts
      level 7 would be substantially more expensive still). This was NOT a
      correction of the checkpoint-resume fix (which worked exactly as
      designed and is retained, verified, in source/stage1_grammar_driver.py
      and source/test_stage1_grammar_resume.py for any future dispatch that
      needs it) -- it was a deliberate scope/cost judgment, legitimate under
      the contract's own stopping_rules ("If enumeration at some complexity
      C <= 12 does not complete within the Stage-1 grammar budget, the
      engine reports the largest completed complexity C_complete ... not
      reaching C_max is a scoping fact, not a failure"). PID 16763 never
      completed or checkpointed any part of complexity 7:
      pareto-fronts-raw.json's last_updated_utc
      (2026-09-08T18:16:29.539344Z) and enumeration-checkpoint.json's
      last_updated_utc (2026-09-08T18:16:29.537685Z) are both unchanged from
      the state PID 3440 wrote; zero additional wall-clock compute
      contributed to this run's terminal data. No exact SIGTERM timestamp is
      separately logged by the driver (a SIGTERM produces no log line); it
      occurred sometime after 2026-09-08T18:17:13.633175Z (PID 16763's last
      log line) and before this manifest was written.
    - >-
      No process for this run is alive as of this manifest (PID 3440: exited
      naturally; PID 16763: killed by the Coordinator). No further compute is
      authorized or pending for this run directory; extending complexity 7+
      requires a new Coordinator decision and, if authorized, a new run.
