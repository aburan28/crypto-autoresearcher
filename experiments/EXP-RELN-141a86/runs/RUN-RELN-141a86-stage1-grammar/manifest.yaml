    immutability (which binds from the snapshot commit onward).

  scope_and_protocol_deviation_disclosure: >-
    specification.yaml assigns own-enumeration data generation to a
    separate "Stage 0e" run, not authorized by this handoff's write_scope
    (runs/RUN-RELN-141a86-stage1*/ and source/ only). Because (a)
    sibling_enumeration's primary source EXP-RELN-f202be was checked and
    found FIELD-INCOMPATIBLE with this contract's adapter validation (its
    curve_results.json carries an m=2 x-class signed-energy / forced-
    negation-gap statistic set -- E3_direct, delta_reduced,
    forced_negation_gap_measured, predicate_T_S -- not the Delta/E_m/R_k
    field set specification.yaml's sibling_enumeration.primary_source
    clause requires the adapter to validate against; no R_k field, no
    generic 'Delta'/'E_m' field, different convention entirely), and (b)
    EXP-FB3-001 has no N=2^20 run at all (runs/ contains only N14, N16,
    N18, FAMILY, CTRL), own-enumeration data was generated INLINE inside
    THIS stage1-grammar run directory (source/stage1_own_enumeration.py,
    written this dispatch, calling count_vectors.py -- Stage-0b/0e module,
    UNCHANGED -- for the exact FFT-based cyclic convolution) rather than in
    a separate Stage-0e run directory this handoff cannot create. This is a
    disclosed protocol deviation from the stage attribution in
    specification.yaml stage_budgets (own enumeration performed under
    Stage 1's write_scope instead of a dedicated Stage 0e run), NOT a
    deviation from the scientific method itself: the same exact,
    deterministic FFT-based count-vector code is used, every draw is
    seeded deterministically and disclosed, and the resulting cache file
    (own-enumeration-cache.jsonl) is a permanent, inspectable artifact of
    this run directory.

  data_availability_gap_disclosure: >-
    Own enumeration in Z/N (a plain cyclic group, no elliptic-curve group
    law) is a valid surrogate ONLY for arms whose definition does not
    depend on genuine EC x-coordinate structure: the random-base arm
    (E_matched_random_analog, standing in for HEUR-H1's held_out_
    transfer_anchor control, "INV-A1 evaluated on the RANDOM arms at
    2^20") and the ZN_interval / ZN_random_relabelled controls (natively
    defined in Z/N, no surrogate needed). It is explicitly NOT used to
    synthesize E_x_interval_high_bit_interval / E_small_height /
    E_coset_union data: a Z/N arithmetic interval is qualitatively
    DIFFERENT structure from an elliptic-curve x-coordinate interval (it
    IS the ZN_interval positive control, predicted and required to DEPART
    from INV-A1), and substituting it for the E-arms would be exactly the
    geometry-substitution invalidation_rules forbid. CONSEQUENCE, STATED
    PLAINLY: the E x-interval arms (fb3_unsigned_m3 pack, high_bit_
    interval/small_height/coset_union geometries -- the pack
    later_review_requirements names for the independent validator's blind
    re-derivation) have NO available held-out 2^20 data in this run
    environment. Their Pareto front (arm_label prefix E_arms_fb3_*) is
    fitted on committed FB3 N<=2^18 training data only; every held-out
    field for those rows is reported as "not_available_no_2^20_fb3_data"
    in stage1_fb3_table.py output, never estimated or approximated by the
    Z/N surrogate. Closing this gap requires either a genuine
    EXP-FB3-001 N=2^20 run or an EXP-RELN-f202be-equivalent battery
    measuring the Delta/E_m/R_k field set at 2^20 on the SAME
    fb3_unsigned_m3 convention -- neither exists yet and neither is
    created by this run.

