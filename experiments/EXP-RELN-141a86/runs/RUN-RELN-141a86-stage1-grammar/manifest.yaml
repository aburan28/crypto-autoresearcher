  status_note: >-
    A detached background job launched by this executor turn, still running
    independently of it when this manifest was written. Per this
    experiment's own established precedent (RUN-RELN-141a86-stage0c-
    pexist-extended), this manifest records status 'running' honestly
    rather than waiting for completion; a LATER task must read this run
    directory's live artifacts (driver-progress.log, own-enumeration-
