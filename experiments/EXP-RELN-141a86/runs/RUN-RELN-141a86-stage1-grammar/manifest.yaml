  expected_timeline_disclosure: >-
    A pre-launch smoke test (this dispatch, discarded scratch directory)
    measured own-enumeration table construction (200 null draws + 9 curve
    rows per (rung, B) cell, 4 rungs x 3 B-ladder values = 12 cells) taking
    roughly 60-70s per cell at N=262147 and an estimated ~4x that at
    N=1048583 (FFT cost scales with N and this contract's prime-N
    requirement forces a non-power-of-2 FFT, empirically ~4x slower than a
    power-of-2 FFT of comparable size) -- so table construction alone is
    expected to take on the order of 20-30 minutes BEFORE grammar
    enumeration+fitting even begins. Given this environment's observed
    container survival window (on the order of 20-30 minutes, per this
    session's restart_history in RUN-RELN-141a86-stage0c-pexist-extended),
    it is a realistic, anticipated possibility that this run is killed by
    a container restart before table construction completes, in which case
    a relaunch of the identical command resumes from the row-level cache
    (own-enumeration-cache.jsonl) rather than restarting from zero. This is
    disclosed here BEFORE the outcome is known, not fitted to it
    afterward.

