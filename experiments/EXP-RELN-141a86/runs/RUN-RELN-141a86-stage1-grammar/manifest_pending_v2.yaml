  scope_and_protocol_deviation_disclosure: 'specification.yaml assigns own-enumeration data generation
    to a separate "Stage 0e" run, not authorized by this handoff''s write_scope (runs/RUN-RELN-141a86-stage1*/
    and source/ only). Because (a) sibling_enumeration''s primary source EXP-RELN-f202be was checked and
    found FIELD-INCOMPATIBLE with this contract''s adapter validation (its curve_results.json carries
    an m=2 x-class signed-energy / forced- negation-gap statistic set -- E3_direct, delta_reduced, forced_negation_gap_measured,
    predicate_T_S -- not the Delta/E_m/R_k field set specification.yaml''s sibling_enumeration.primary_source
    clause requires the adapter to validate against; no R_k field, no generic ''Delta''/''E_m'' field,
    different convention entirely), and (b) EXP-FB3-001 has no N=2^20 run at all (runs/ contains only
    N14, N16, N18, FAMILY, CTRL), own-enumeration data was generated INLINE inside THIS stage1-grammar
    run directory (source/stage1_own_enumeration.py, written this dispatch, calling count_vectors.py --
    Stage-0b/0e module, UNCHANGED -- for the exact FFT-based cyclic convolution) rather than in a separate
    Stage-0e run directory this handoff cannot create. This is a disclosed protocol deviation from the
    stage attribution in specification.yaml stage_budgets (own enumeration performed under Stage 1''s
    write_scope instead of a dedicated Stage 0e run), NOT a deviation from the scientific method itself:
    the same exact, deterministic FFT-based count-vector code is used, every draw is seeded deterministically
    and disclosed, and the resulting cache file (own-enumeration-cache.jsonl) is a permanent, inspectable
    artifact of this run directory.'
  data_availability_gap_disclosure: 'Own enumeration in Z/N (a plain cyclic group, no elliptic-curve group
    law) is a valid surrogate ONLY for arms whose definition does not depend on genuine EC x-coordinate
    structure: the random-base arm (E_matched_random_analog, standing in for HEUR-H1''s held_out_ transfer_anchor
    control, "INV-A1 evaluated on the RANDOM arms at 2^20") and the ZN_interval / ZN_random_relabelled
    controls (natively defined in Z/N, no surrogate needed). It is explicitly NOT used to synthesize E_x_interval_high_bit_interval
    / E_small_height / E_coset_union data: a Z/N arithmetic interval is qualitatively DIFFERENT structure
    from an elliptic-curve x-coordinate interval (it IS the ZN_interval positive control, predicted and
    required to DEPART from INV-A1), and substituting it for the E-arms would be exactly the geometry-substitution
    invalidation_rules forbid. CONSEQUENCE, STATED PLAINLY: the E x-interval arms (fb3_unsigned_m3 pack,
    high_bit_ interval/small_height/coset_union geometries -- the pack later_review_requirements names
    for the independent validator''s blind re-derivation) have NO available held-out 2^20 data in this
    run environment. Their Pareto front (arm_label prefix E_arms_fb3_*) is fitted on committed FB3 N<=2^18
    training data only; every held-out field for those rows is reported as "not_available_no_2^20_fb3_data"
    in stage1_fb3_table.py output, never estimated or approximated by the Z/N surrogate. Closing this
    gap requires either a genuine EXP-FB3-001 N=2^20 run or an EXP-RELN-f202be-equivalent battery measuring
    the Delta/E_m/R_k field set at 2^20 on the SAME fb3_unsigned_m3 convention -- neither exists yet and
    neither is created by this run.'
  data_availability_gap_RESOLVED_update: 'SUPERSEDES the disclosure immediately above; that text is left
    unedited as the honest original record, not deleted. A follow-up executor dispatch (commit 26a5c9519,
    agent report for "Build f202be N20 held-out adapter") built experiments/EXP-RELN-141a86/source/ stage1_e_arm_holdout.py:
    it reuses EXP-FB3-001/implementation/ fb3_core.py UNMODIFIED (real elliptic-curve arithmetic, not
    a Z/N surrogate) at bits=20 -- a length EXP-FB3-001 itself never ran, so no collision with its existing
    curves under the identical seed formula -- to generate 4 new real prime-order curves and compute exact
    E_x_interval_high_bit_interval / E_small_height / E_coset_union decomposition counts via count_vectors.py''s
    cyclic convolution (the same frozen Stage-0b/0e module). Its self-test reproduces the committed RUN-FB3-001-N14/high_bit_interval/curve_index=1
    cell bit-for-bit (9 fields matched exactly) before any 2^20 curve was generated. Run as a detached,
    per-(geometry,curve_index)-checkpointed background process (and, after a real crash surfaced a mid-cell
    resumability gap, further hardened with intra-cell checkpointing every 25 of 200 null-draws, commit
    46fe1eca9, verified by an actual kill-and-resume test, not just unit tests). Reached genuine, verified
    completion at 2026-09-08T05:45:09Z: e-arm-holdout-cache.jsonl carries all 12 rows (3 geometries x
    4 curves), and e-arm-holdout-stderr.log''s final line reads "DONE: 12 rows total in cache ...". The
    E x-interval arms therefore DO now have real, non-surrogate held-out 2^20 data. build_targets() in
    stage1_grammar_driver.py (source inspected, not assumed) calls _load_e_arm_holdout_rows() once at
    each of its own process starts, reading the cache file fresh from disk -- so no special "fresh run"
    is required beyond the grammar driver''s own ordinary mechanical restart cycle; any driver invocation
    that starts AFTER 2026-09-08T05:45:09Z (confirmed: the cycle launched at 2026-09-08T06:08:5xZ, PID
    1741) reads the complete 12-row set, verified live by its own held_out_rms_null_se metrics appearing
    against E_arms_fb3_* targets from complexity level 2 onward in that cycle''s driver-progress.log.
    Cycles that STARTED before 05:45:09 (including the one killed by the 20th container restart, whose
    tail is visible in driver-progress.log around 05:44-05:45) used whatever partial held-out set existed
    at their own startup and are superseded, not authoritative, for E-arm held-out scoring -- their train-side
    (non-held-out) results for other targets are unaffected and still valid. stage1_fb3_table.py''s "not_available_no_2^20_fb3_data"
    marker described above no longer applies going forward; any output already written under that marker
    predates this resolution.'
