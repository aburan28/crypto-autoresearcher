  resume_decision:
    outcome: restarted_from_level_1_with_cross_check
    reason: >-
      checkpoint-INV-7_p_exist.json (prior run) stores only per-level
      summary counts, never the in-memory by_complexity expr-tree dict or
      the seen_string_hashes/seen_fp_hashes dedup sets; those cannot be
      reconstructed from the counts alone. Genuine resume would require
      serializing millions of canonical expression trees plus two large
      hash sets per checkpoint write. Levels 1-8 cost only ~1800s (per the
      prior checkpoint's own timings) versus a many-hour cost for level 9,
      so re-deriving levels 1-8 from scratch was judged the reasonable
      choice over that engineering investment. A --resume-from-checkpoint
      flag was added to target_enumerate_worker_checkpoint.py that performs
      a cross-check (not a state transplant): it compares this run's own
      levels 1-8 cumulative_registered counts against the prior checkpoint
      once/if this invocation exits cleanly.
    live_determinism_check_during_post_launch_verification: >-
      Levels 1-6 observed live during the 2-5 minute post-launch check
      reproduced cumulative_registered counts of 6, 20, 179, 949, 8087,
      54078 -- IDENTICAL to the prior run's checkpoint at the same levels,
      confirming the restart is deterministic and reproducing the same
      enumeration before it proceeds past where the prior attempt stopped.

