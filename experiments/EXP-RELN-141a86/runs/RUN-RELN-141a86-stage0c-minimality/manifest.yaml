  method:
    name: targeted_minimality
    description: >-
      Per target: (a) exhaustive, hash-deduplicated, checkpointed enumeration
      of the target's leaf pack strictly BELOW its own canonical complexity
      (canonical_complexity - 1), confirming no expression at any completed
      level numerically matches the target (via numeric-fingerprint
      equivalence on the frozen engine's own fixed sample grid); (b) direct
      construction of the known closed form in grammar_engine's own
      representation, node-counted by the unchanged grammar_engine.node_count,
      verified against the real control table for zero residual. (a)+(b)
      together prove the known form is the UNIQUE minimal-complexity match --
      methodologically distinct from, and never conflated with, blind-search
      discovery (which is what INV-A4/INV-A6 achieved).
    checkpointing:
      implementation: experiments/EXP-RELN-141a86/source/grammar_engine_checkpoint.py
      mechanism: write-to-temp-file, fsync, os.replace (atomic rename), directory fsync, after every completed complexity level
      self_test: PASS (identical by_complexity_counts to grammar_engine_lean.enumerate_lean on degree_table maxc=6)
      real_sigkill_survival_test: >-
        PASS. Live worker process killed with `kill -9` after ~6s (mid-level-6
        construction); freshly-read checkpoint file on disk contained 5
        complete level records (levels 1-5) with correct cumulative counts
        and timestamps; --out result file absent (as expected for a hard
        kill); no leftover .tmp-<pid> file.
    caps:
      external_hard_wall_clock_seconds: 6000.0
      external_hard_memory_gb: 13.0
      internal_soft_wall_clock_seconds: 5700.0
      internal_soft_memory_gb: 11.0
      cap_justification: >-
