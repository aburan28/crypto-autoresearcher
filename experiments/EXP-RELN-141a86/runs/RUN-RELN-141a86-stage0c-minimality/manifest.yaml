run:
  id: RUN-RELN-141a86-stage0c-minimality
  experiment_id: EXP-RELN-141a86
  status: invalid_measurement
  status_note: >-
    Not itself a scientific negative or positive result about H-RELN-427bfd.
    This run implements TASK-20260907-6333af / DEC-20260907-2a3727: a
    TARGETED-MINIMALITY structural-recovery attempt (methodologically
    distinct from blind search) at the Stage-0c hard recovery gate, for the
    three controls that ended resource_exhaustion twice under blind search
    (RUN-RELN-141a86-stage0bcde, RUN-RELN-141a86-stage0c-repair). Per-level
    checkpointing was implemented and demonstrated to survive a real SIGKILL.
    INV-1 (canonical complexity 9), INV-7 p_fail (complexity 9), and INV-8
    (complexity 10) all CLEARED via targeted minimality: exhaustive
    enumeration strictly below the target complexity found no numeric match,
    and direct construction of the known closed form confirmed it exists at
    exactly the canonical complexity with zero residual on real data. INV-7
    p_exist (complexity 11) was ALSO attempted (substantial time remained)
    but again ended resource_exhaustion: levels 1-8 completed exhaustively
    with no match, but the required levels 9-10 were not reached within the
    6000s external hard wall-clock cap. Status is invalid_measurement at the
    RUN level because one of the five pre-registered recovery controls
    (INV-7 p_exist) remains not-affirmatively-recovered by either method;
    per the contract's own stopping_rules this is reported to the
    Coordinator as an open question, not resolved by the executor. Per
    specification.yaml invalidation_rules ("Timeout, out-of-memory ... is
    failed_infrastructure for that stage or arm, never a negative or
    positive result"), the p_exist portion is resource_exhaustion, never a
    scientific result. Stage 1/Stage 2 were NOT attempted in this run
    (explicit per the handoff's own instruction not to unilaterally decide).
