candidate_list:
  source: ledger/hypotheses/H-RELN-427bfd.yaml candidate_invariants (19 entries, transcribed verbatim by id/statement/status; expression forms and node counts are this stage's own construction in the frozen grammar notation, not present in the source record)
  frozen_grammar_ref: experiments/EXP-RELN-141a86/runs/RUN-RELN-141a86-stage0a/grammar.yaml
  node_counting_rule_ref: >-
    specification.yaml frozen_pipeline.primary_engine.grammar.node_counting_rule;
    computed programmatically by source/grammar_engine.py node_count() on the
    canonical form, never hand-counted.
  contract_pre_stated_verification: >-
    The contract states six canonical node counts before any run: INV-1 mean
    -> 9; INV-7 p_fail -> 9 and p_exist -> 11; INV-8 d_reg -> 10; INV-A4
    coverage -> 7 and Delta -> 3; INV-A6 Delta -> 7. This engine's own
    node_count() function, run on hand-built expression trees for each,
    reproduced all six EXACTLY: no disagreement found. See
    execution-report.md for the full comparison table.
  entries:
    - id: INV-1
      statement: >-
        For every base D of B distinct elements of a finite abelian group of
        order N and every m >= 1, sum_r c_D(r) = C(B+m-1, m); hence the mean
        per-target count mu = C(B+m-1, m)/N depends on (B, m, N) only.
      status: proved
      expression: div(binomial(sub(add(B,m),CONST[1]),m),N)
      expression_prose: mu = binomial(B+m-1, m) / N
      canonical_node_count: 9
      contract_pre_stated: true
      contract_stated_value: 9
      match: true
      pack: fb3_unsigned_m3_and_enum_unsigned_m3

    - id: INV-2
      statement: >-
        sum_r c_D(r)^2 = E_m(D) := #{ordered pairs (A, A') of size-m multisets
        from D with sum A = sum A'}. Hence Var_r[c_D] = E_m/N - mu^2 and the
        dispersion index Delta(D) := Var/mean = E_m/M - mu. Since the M
        diagonal pairs give E_m >= M, Delta >= 1 - mu.
      status: provable_elementary
      expression: sub(div(E_m,M),mu)
      expression_prose: Delta = E_m/M - mu
      canonical_node_count: 5
      note: >-
        STRUCTURAL IDENTITY, not a fittable closed form in the frozen grammar
        leaves: E_m is itself a measured/fitted statistic, not a base or
        derived leaf of any convention pack (leaves_by_pack has no E_m
        entry). Node count computed by treating E_m as a one-node leaf for
        this identity check only, exactly as the contract does for `conc`
        in the INV-A6 check. Not an SR search target; used to convert a
        measured E_m into Delta.
      contract_pre_stated: false
      pack: not_applicable_identity_only

    - id: INV-2prime
      statement: >-
        For D of B elements drawn i.i.d. uniformly from Z/N (N prime, with
        replacement), E[E_m(D)] = M + M(M-1)/N and E[Delta] = 1 - 1/N
        exactly. CORRECTION carried from the source proposal: the program's
        random base is B DISTINCT logs, and the distinct-element correction
        is of order mB/N (INV-A1), which dominates the 1/N term for every
        B >= 2.
      status: provable_elementary
      expression: sub(CONST[1],div(CONST[1],N))
      expression_prose: E[Delta]_with_replacement = 1 - 1/N
      canonical_node_count: 5
      contract_pre_stated: false
      pack: enum_zn_and_sidon

    - id: INV-2doubleprime
      statement: >-
        If W = -W with |W| = 2B and m = 3, then for every Q in W the B
        multisets {P, -P, Q} sum to Q, so c_W(Q) >= B on W and
        E_3(W) >= 2B * B^2 = |W|^3/4, forcing exactly 2B^2 = |W|^2/2
        multisets out of M = C(2B+2,3). CORRECTION: forced term dominates
        random excess iff |W|^3 < 9N; at the operating point |W| = 2B,
        B = (6N)^(1/3), |W|^3 = 48N > 9N, so the random term dominates.
      status: provable_elementary
      expression: div(pow(W,CONST[3]),CONST[4])
      expression_prose: forced_lower_bound_term = |W|^3 / 4
      canonical_node_count: 5
      note: >-
        This is the forced-mass lower-bound term only, not a full Delta
        expression; the full statement is a case-split inequality (dominant
        term depends on |W|^3 vs 9N), which is not itself a single grammar
        expression. Recorded on the symmetric_m3 pack (W leaf).
      contract_pre_stated: false
      pack: symmetric_m3

    - id: INV-3
      statement: >-
        The affine group of Z/N acts on bases with c_{uD+t}(ur+mt) = c_D(r);
        a uniformly random B-subset is invariant in law under this action,
        so for any FIXED target set S the expected lift
        rho(S) = E[sum_{r in S} c_D(r)]/(|S| mu) equals exactly 1.
      status: provable_elementary
      expression: CONST[1]
      expression_prose: rho(S) = 1 (constant, no free B/N/m-dependence)
      canonical_node_count: 1
      note: >-
        The discriminating content (a pushforward along an x-defined S) is
        not expressible in this grammar's leaf set; only the trivial
        constant-1 statement for a FIXED target set is a grammar expression
        here.
      contract_pre_stated: false
      pack: not_applicable_trivial_constant

    - id: INV-4
      statement: >-
        With ORDERED-tuple energy E^ord_m(D), the trivial character
        contributes B^(2m)/N, and if |S_D(chi)| <= K for chi != 1 then
        E^ord_m <= B^(2m)/N + K^(2m-2) B by Parseval. TWO THRESHOLDS: beats
        the trivial bound B^(2m-1) once B > K; certifies the random value
        only when B >> p^(m/(2m-1)).
      status: provable_elementary
      expression: add(div(pow(B,mul(CONST[2],m)),N),mul(pow(K,sub(mul(CONST[2],m),CONST[2])),B))
      expression_prose: E^ord_m_bound = B^(2m)/N + K^(2m-2) * B
      canonical_node_count: 17
      note: >-
        K (the character-sum bound constant) is not a leaf of any declared
        convention pack; treated as a free leaf for node-counting only. This
        is a BOUND, not an exact closed form, and is not itself an SR
        fitting target under this contract (INV-4 is cited as the proof
        route for the discriminating content, INV-4c).
      contract_pre_stated: false
      pack: not_applicable_bound_only

    - id: INV-4c
      statement: >-
        CONJECTURE (open target): for x-interval bases on prime-order curves
        and B in [p^(1/3), p^(1/2)], E_3(D) = (1+o(1))(M + M^2/N), i.e.
        Delta(D) = Delta_random (1+o(1)); the x-interval base carries no
        excess 3-fold additive energy beyond the random law.
      status: open
      expression: null
      expression_prose: >-
        No independent closed form; the null form conjectures Delta equal
        (to leading order) to INV-A1's Delta_random. Its node count, if the
        null form is used as the SR target, is INV-A1's count (9); no
        separate expression exists for the open (alive) alternative.
      canonical_node_count: null
      contract_pre_stated: false
      pack: null

    - id: INV-5a
      statement: >-
        L(4O) = span{1,x,y,x^2}; P_1+P_2+P_3+P_4 = O iff the four points are
        the intersection of E with a conic alpha x^2 + beta x + gamma y +
        delta = 0. At m=3, c_D(R) counts such conics through -R with the
        other three intersections in D; at m=2, lines through -R meeting D
        twice.
      status: provable_elementary
      expression: null
      expression_prose: null
      canonical_node_count: null
      note: >-
        Not applicable (proves_too_much_control: n/a). An exact
        reformulation on the curve in terms of a conic family; it is not a
        Z/N-testable statement and has no closed form in the (N,B,m,M,mu)
        leaf grammar.
      contract_pre_stated: false
      pack: null

    - id: INV-5b
      statement: >-
        CONJECTURE: the mass of k-rich targets for an x-interval base is
        bounded by a point-conic incidence bound over F_p in the two-
        parameter conic family of INV-5a, giving an upper bound on cluster
        mass decaying in k faster than the random-law Poisson tail would
        allow beyond some k_0(B,p).
      status: open
      expression: null
      expression_prose: null
      canonical_node_count: null
      note: >-
        Open; no closed form conjectured yet. The instrument's role for this
        candidate is comparative (measured R_k against the Poisson tail
        reference function), not fitting a grammar expression for INV-5b
        itself.
      contract_pre_stated: false
      pack: null

    - id: INV-6
      statement: >-
        Sigma_m(D) = Sigma_{m-1}(D) + D: if R is m-decomposable then R - P is
        (m-1)-decomposable for some P in D. Decomposability propagates along
        translation-by-D edges with an arity shift.
      status: provable_elementary
      expression: null
      expression_prose: null
      canonical_node_count: null
      note: >-
        Definitional set-recursion (Sigma_m(D) = Sigma_{m-1}(D) + D over
        sets), not a scalar closed-form expression in the (N,B,m) grammar;
        not applicable as an SR target.
      contract_pre_stated: false
      pack: null

    - id: INV-7
      statement: >-
        On a prime-order curve, for a uniformly random B-subset V of the
        n = (N-1)/2 x-classes and any target R != O, P[R has a signed
        2-decomposition over V] = 1 - C(n-B,B)/C(n,B) (loop counted), and
        c(R) follows the runs distribution of a random B-subset of a path.
      status: provable_elementary
      sub_expressions:
        - name: p_fail
          expression: div(binomial(sub(n,B),B),binomial(n,B))
          expression_prose: p_fail = binomial(n-B, B) / binomial(n, B)
          canonical_node_count: 9
          contract_pre_stated: true
          contract_stated_value: 9
          match: true
        - name: p_exist
          expression: sub(CONST[1],div(binomial(sub(n,B),B),binomial(n,B)))
          expression_prose: p_exist = 1 - p_fail
          canonical_node_count: 11
          contract_pre_stated: true
          contract_stated_value: 11
          match: true
      pack: enum_xclass_signed_m2

    - id: INV-8
      statement: >-
        The semi-regular reference degree of the m-variable decomposition
        system with generator degrees (D_S, B, ..., B) is
        d_reg = ceil((m(B-1) + D_S)/2), the index of the first non-positive
        coefficient of (1+z+...+z^(B-1))^m (1 - z^(D_S)).
      status: provable_elementary
      expression: ceil(div(add(mul(m,sub(B,CONST[1])),D_S),CONST[2]))
      expression_prose: d_reg = ceil((m*(B-1) + D_S) / 2)
      canonical_node_count: 10
      contract_pre_stated: true
      contract_stated_value: 10
      match: true
      pack: degree_table

    - id: INV-9
      statement: >-
        Delta(D) >= 1 - mu with equality iff D is a B_m set in the multiset
        sense (all m-fold sums with repetition distinct); under-dispersion
        is the signature of a low-energy base, and Bose-Chowla B_3 bases
        attain the floor.
      status: provable_elementary
      expression: sub(CONST[1],mu)
      expression_prose: Delta_floor = 1 - mu
      canonical_node_count: 3
      note: >-
        Same expression form as INV-A4's Delta clause (both are "1 - mu");
        INV-9 states it as a floor (inequality with equality condition),
        INV-A4 as the exact value attained by B_3 sets.
      contract_pre_stated: false
      pack: enum_zn_and_sidon

    - id: INV-A1
      statement: >-
        NEW (derived, unreviewed). For D a uniformly random B-subset of Z/N
        (N prime, DISTINCT elements) and m < N,
        E[Delta(D)] = 1 - m(B-1)/N + O((1+mu)/N). At m=3,
        Delta_random = 1 - 3(B-1)/N + O((1+mu)/N).
      status: provable_elementary
      expression: sub(CONST[1],div(mul(m,sub(B,CONST[1])),N))
      expression_prose: Delta_random = 1 - m*(B-1)/N
      canonical_node_count: 9
      note: >-
        At m=3 fixed (m replaced by the constant leaf 3 rather than the
        variable leaf m), the tree shape and node count are unchanged (9):
        a variable leaf and a bound-constant leaf both count as 1 node
        under the frozen rule.
      contract_pre_stated: false
      pack: fb3_unsigned_m3_and_enum_unsigned_m3

    - id: INV-A2
      statement: >-
        NEW. At m=2 in the x-class convention, for a uniformly random
        B-subset V, E[#{R != O : c(R) >= k}] = (N-1) P_runs[c >= k], with
        P_runs the two-term loop mixture of the runs law (86cd30 Cor. 2d).
      status: provable_elementary
      expression: mul(sub(N,CONST[1]),P_runs)
      expression_prose: E[R_k] = (N-1) * P_runs[c >= k]
      canonical_node_count: 5
      note: >-
        P_runs[c>=k] is an external reference function (evaluated
        numerically per the contract's metrics block, "REFERENCE FUNCTIONS
        evaluated numerically"), not a grammar leaf of any declared pack;
        treated as a one-node leaf for this node count only. Not itself a
        grammar-search target -- a comparison reference.
      contract_pre_stated: false
      pack: not_applicable_reference_function

    - id: INV-A3
      statement: >-
        NEW. Exact count of forced negation clusters at m=3 as a function of
        |W|: exactly |W|^2/2 multisets of type {P,-P,Q}, each Q in W
        receives |W|/2 of them, targets outside W receive none, and the
        induced dispersion floor is
        Delta(W) >= (|W|^3/4 + M - |W|^2/2)/M - mu.
      status: provable_elementary
      expression: sub(div(sub(add(div(pow(W,CONST[3]),CONST[4]),M),div(pow(W,CONST[2]),CONST[2])),M),mu)
      expression_prose: Delta_floor(W) = (|W|^3/4 + M - |W|^2/2) / M - mu
      canonical_node_count: 17
      contract_pre_stated: false
      pack: symmetric_m3

    - id: INV-A4
      statement: >-
        NEW as a stated formula. For any B_3 set D (all 3-multiset sums
        distinct) with M <= N, coverage(D) = M/N = C(B+2,3)/N exactly; and
        Delta(D) = 1 - mu for such D.
      status: provable_elementary
      sub_expressions:
        - name: coverage
          expression: div(binomial(add(B,CONST[2]),CONST[3]),N)
          expression_prose: coverage = binomial(B+2, 3) / N
          canonical_node_count: 7
          contract_pre_stated: true
          contract_stated_value: 7
          match: true
        - name: Delta
          expression: sub(CONST[1],mu)
          expression_prose: Delta = 1 - mu
          canonical_node_count: 3
          contract_pre_stated: true
          contract_stated_value: 3
          match: true
      pack: enum_zn_and_sidon

    - id: INV-A5
      statement: >-
        NEW. Third factorial moment under the random model: with
        T = sum_r c(c-1)(c-2), E[T] = T_2/N^2 + T_1/N + O(.); to leading
        order (1/N) E[T] = mu^3 (1+o(1)), the Poisson third factorial
        moment, so skewness of the random count vector is mu^(-1/2)(1+o(1)).
      status: conjecture
      expression: mul(N,pow(mu,CONST[3]))
      expression_prose: T_leading = N * mu^3
      canonical_node_count: 5
      note: >-
        Records only the stated leading-order term (1/N)E[T] = mu^3
        rearranged as T ~= N*mu^3; the full E[T] = T_2/N^2 + T_1/N + O(.)
        expansion is not a single bounded-complexity closed form and is not
        transcribed as such.
      contract_pre_stated: false
      pack: fb3_unsigned_m3_and_enum_unsigned_m3

    - id: INV-A6
      statement: >-
        Convention-translation identity for the committed FB3 tables: with
        conc = (1/N) sum_r c(r)(c(r)-1), Var_r[c] = conc + mu - mu^2 and
        Delta = conc/mu + 1 - mu; hence the 144-cell table yields Delta and
        E_3 = N(conc+mu) exactly without any rescaling.
      status: provable_elementary
      expression: sub(add(div(conc,mu),CONST[1]),mu)
      expression_prose: Delta = conc/mu + 1 - mu
      canonical_node_count: 7
      contract_pre_stated: true
      contract_stated_value: 7
      match: true
      note: >-
        `conc` supplied as a leaf for this identity check only, exactly as
        the contract's node_counting_rule text specifies.
      pack: not_applicable_identity_only

  entry_count: 19
  contract_pre_stated_summary:
    note: >-
      The contract's node_counting_rule prose pre-states node counts for
      5 recovery-control invariants (INV-1, INV-7, INV-8, INV-A4, INV-A6),
      two of which (INV-7, INV-A4) each carry two named sub-values, for
      7 individual stated node-count values in total. All 7 are verified
      below.
    total_pre_stated_values: 7
    all_matched: true
    targets:
      - {id: INV-1, sub: mean, expected: 9, computed: 9, match: true}
      - {id: INV-7, sub: p_fail, expected: 9, computed: 9, match: true}
      - {id: INV-7, sub: p_exist, expected: 11, computed: 11, match: true}
      - {id: INV-8, sub: d_reg, expected: 10, computed: 10, match: true}
      - {id: INV-A4, sub: coverage, expected: 7, computed: 7, match: true}
      - {id: INV-A4, sub: Delta, expected: 3, computed: 3, match: true}
      - {id: INV-A6, sub: Delta, expected: 7, computed: 7, match: true}
