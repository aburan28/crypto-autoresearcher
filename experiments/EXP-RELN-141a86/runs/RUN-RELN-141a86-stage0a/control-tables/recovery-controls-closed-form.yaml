control_tables:
  purpose: >-
    Stage-0a closed-form control tables per the contract's own note: SYMBOLIC
    formulas and their per-target canonical node counts only. NO measured
    cell (FB3, DREG, sibling enumeration) is read or evaluated here; the
    numeric evaluation of these formulas against measured data is Stage 0b
    onward (stage0b_control_tables / stage0c_engines_on_controls), explicitly
    out of scope for this dispatch.
  controls:
    - name: stage0_recovery_INV1_conservation_mean
      formula: mu = binomial(B+m-1, m) / N
      formula_at_fixed_m3: mu = B(B+1)(B+2) / (6N)
      canonical_node_count: 9
      gate: recovered at <= 9 nodes with zero residual on integer-exact data
      grammar_expr: div(binomial(sub(add(B,m),CONST[1]),m),N)

    - name: stage0_recovery_INV7_m2_exact_law
      formula_p_fail: p_fail = binomial(n-B, B) / binomial(n, B)
      formula_p_exist: p_exist = 1 - p_fail
      n_definition: n = (N-1)/2 (x-classes)
      canonical_node_count_p_fail: 9
      canonical_node_count_p_exist: 11
      gate: >-
        p_fail recovered at <= 9 nodes, p_exist at <= 11 nodes, zero residual
        on the closed-form table; exhaustive-table comparison and residual
        within 200-draw sampling error are Stage 0b/0c items, not this stage.
      grammar_expr_p_fail: div(binomial(sub(n,B),B),binomial(n,B))
      grammar_expr_p_exist: sub(CONST[1],div(binomial(sub(n,B),B),binomial(n,B)))

    - name: stage0_recovery_INV8_semiregular_degree
      formula: d_reg = ceil((m*(B-1) + D_S) / 2)
      generating_function_definition: >-
        d_reg = index of first non-positive coefficient of
        (1 + z + ... + z^(B-1))^m (1 - z^(D_S))
      canonical_node_count: 10
      gate: recovered at <= 10 nodes with zero residual
      grammar_expr: ceil(div(add(mul(m,sub(B,CONST[1])),D_S),CONST[2]))

    - name: stage0_recovery_INVA4_sidon_floor
      formula_coverage: coverage = binomial(B+2, 3) / N
      formula_Delta: Delta = 1 - mu
      canonical_node_count_coverage: 7
      canonical_node_count_Delta: 3
      gate: >-
        coverage recovered at <= 7 nodes, Delta at <= 3 nodes, zero residual;
        max_count = 1 in every cell (a measured-data check, Stage 0b)
      grammar_expr_coverage: div(binomial(add(B,CONST[2]),CONST[3]),N)
      grammar_expr_Delta: sub(CONST[1],mu)

    - name: stage0_recovery_INVA6_convention_identity
      formula: Delta = conc/mu + 1 - mu
      identity_derivation: Var_r[c] = conc + mu - mu^2 (one line from sum c^2 = sum c(c-1) + sum c)
      canonical_node_count: 7
      gate: >-
        recovered at <= 7 nodes with zero residual; the per-cell numeric
        identity check (variance vs conc+mean-mean^2 to 1e-9 relative on all
        committed FB3 cells) is Stage 0b, not this stage.
      grammar_expr: sub(add(div(conc,mu),CONST[1]),mu)

  node_counts_verified_by: >-
    experiments/EXP-RELN-141a86/source/grammar_engine.py node_count() on the
    canonical form of each grammar_expr above; all seven individual values
    (INV-1 mean=9, INV-7 p_fail=9, p_exist=11, INV-8 d_reg=10, INV-A4
    coverage=7, INV-A4 Delta=3, INV-A6 Delta=7) match the contract's own
    pre-stated values exactly (see candidate-list.yaml
    contract_pre_stated_summary and execution-report.md).
