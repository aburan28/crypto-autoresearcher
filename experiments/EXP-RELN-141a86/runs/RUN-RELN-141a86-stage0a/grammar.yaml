grammar:
  source: >-
    Faithful transcription of experiments/EXP-RELN-141a86/specification.yaml
    frozen_pipeline.primary_engine.grammar, verbatim.
  binary_operators: [add, sub, mul, div, pow, binomial]
  unary_operators: [log, exp, floor, ceil]
  leaves_by_pack:
    fb3_unsigned_m3_and_enum_unsigned_m3: [N, B, m, M, mu, CONST]
    enum_xclass_signed_m2: [N, B, n, M, mu, CONST]
    symmetric_m3: [N, B, W, M, mu, CONST]
    degree_table: [m, B, D_S, CONST]
    dreg_semaev_D5: [n_vars, CONST]
    enum_zn_and_sidon: [N, B, m, M, mu, CONST]
  derived_leaf_definitions: >-
    n = (N-1)/2; M = binomial(B+m-1, m); mu = M/N; W = |D u -D| = the
    effective symmetric size B' read from the record; CONST is a free
    constant placeholder fitted after structural enumeration. Derived
    leaves are provided as leaves so that an exact law is reachable at low
    complexity; a leaf is one node whether primitive or derived.
  node_counting_rule: >-
    Complexity = number of nodes in the expression tree, every operator
    application counting 1 and every leaf (variable or constant) counting
    1; a derived leaf counts 1; pow counts 1 plus its two children;
    binomial counts 1 plus its two children. Implemented as node_count() in
    source/grammar_engine.py: unary node = 1 + count(child); binary node
    (including pow and binomial) = 1 + count(left) + count(right); leaf
    (including CONST) = 1.
  canonical_node_counts_pre_stated:
    INV-1_mean: 9
    INV-7_p_fail: 9
    INV-7_p_exist: 11
    INV-8_d_reg: 10
    INV-A4_coverage: 7
    INV-A4_Delta: 3
    INV-A6_Delta: 7
  complexity_cap: 12
  complexity_cap_note: >-
    C_max = 12 nodes. Enumeration is over canonical forms (commutative
    operands ordered, constant subtrees folded, algebraic duplicates
    removed by symbolic simplification) and further deduplicated by the
    numeric fingerprint of the expression on the fit table. If the
    enumeration at some complexity C <= 12 does not complete within the
    Stage-1 grammar budget, the engine reports the largest completed
    complexity C_complete and every coverage statement is scoped to
    C_complete; not reaching C_max is a scoping fact, not a failure and not
    a result.
  constant_fitting: >-
    On integer- or rational-valued targets (means, totals, degrees, exact
    probabilities) constants are reconstructed as exact rationals with
    denominator <= 64 by continued fractions from the least-squares value;
    on real-valued targets (Delta, E_m and R_k measured on a specific base)
    constants are least-squares fitted and are additionally refitted per
    rung subset for the constants-absorb-N check. At most two free
    constants per expression.
  tie_breaking_seed: 20260906
  tie_breaking_seed_note: >-
    Exists only for the optional random restart of the constant fitter;
    never used to break ties in enumeration order or in fit-error ties
    (those break by canonical string ascending).
  enumeration_order: >-
    By complexity ascending, then by canonical string ascending; ties in
    fit error broken by the canonical string, never by the seed.
  implementation_ref: experiments/EXP-RELN-141a86/source/grammar_engine.py
