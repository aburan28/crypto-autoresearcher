run:
  id: RUN-RELN-141a86-stage0c-repair
  experiment_id: EXP-RELN-141a86
  status: invalid_measurement
  status_note: >-
    Not a scientific negative or positive result. This is a repair attempt
    (TASK-20260907-f41930) at the Stage-0c hard recovery gate for the three
    controls (INV-1 mean, INV-7 p_fail/p_exist, INV-8 d_reg) that ended
    resource_exhaustion in RUN-RELN-141a86-stage0bcde. A memory-lean,
    hash-deduplicated, externally memory-and-wall-clock-monitored
    re-implementation of the SAME frozen grammar (grammar_engine_lean.py,
    which imports grammar_engine.py UNCHANGED, preserving both of its prior
    bugfixes) was validated exactly against the frozen engine on every case
    the frozen engine could complete (up to 427,569 forms), then run on all
    four real targets (INV-1 mean at complexity 9; INV-7 p_fail at
    complexity 9; INV-7 p_exist at complexity 11; INV-8 d_reg at complexity
    10), sequentially, each as its own real subprocess with continuous
    external /proc-based memory polling every 2 seconds and a hard
    wall-clock/memory backstop independent of the worker's own internal
    check. ALL FOUR again ended in resource_exhaustion -- this time
    wall-clock/CPU bound (each stuck inside a single complexity level's
    construction for the full ~100-minute allotment, peak RSS 7.6-13.0 GB,
    never exceeding the 15 GB host total) rather than the prior attempt's
    uncontrolled-growth memory exhaustion at 1.7-4.9 GB. Per
    specification.yaml invalidation_rules ("Timeout, out-of-memory ... is
    failed_infrastructure for that stage or arm, never a negative or
    positive result") and stopping_rules ("Stop at the end of Stage 0c if
    any recovery control is not recovered on the primary engine ...
    instrument failure, not evidence"), and per the handoff's own
    instruction ("IF FEWER THAN ALL THREE RECOVER: stop at Stage 0c ... Do
    NOT proceed to Stage 1"), Stage 1/Stage 2 were NOT attempted. INV-A4 and
    INV-A6 (already PASS in RUN-RELN-141a86-stage0bcde) were carried
    forward unchanged and not re-run.
