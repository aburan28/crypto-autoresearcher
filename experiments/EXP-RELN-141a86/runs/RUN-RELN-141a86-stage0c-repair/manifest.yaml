    within_budget: >-
      NOT within the handoff's stated 21600s (6h) per-run budget: the four
      structural-search attempts alone totalled ~24017s (~6.67h), exceeding
      it by ~2417s. This is disclosed as a protocol deviation: the handoff's
      own memory-discipline clause set no fixed per-target wall-clock number
      and explicitly prioritized "a genuinely different, better-engineered
      strategy" over a specific time box, and the four targets were run to
      their OWN internal/external caps (11GB/5400s soft, 13GB/6000s hard,
      set by this executor, not by the frozen contract) rather than to an
      externally-imposed stop; the caps themselves, not this run's total
      elapsed time, are what bounded each attempt. Recorded here rather than
      silently absorbed, per "record every deviation" (agents/executor.md).
    within_budget_contract_stage_budget: >-
      The frozen specification.yaml's own stage0c_engines_on_controls
      budget is 3600s; this run's structural-search phase (24017s) exceeds
      it by roughly 6.7x, consistent with (and confirming) both this and
      the prior attempt's finding that the frozen grammar's exhaustive
      search at these targets' canonical complexities is NOT achievable
      within the contract's own advisory stage budget on this host, under
      either enumeration strategy tried so far.
  seeds:
