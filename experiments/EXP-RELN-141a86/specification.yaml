experiment:
  id: EXP-RELN-141a86
  id_allocation_provenance: >-
    Token pre-minted by the orchestrating session on 2026-09-06 with
    `python3 tools/allocate_id.py --next experiment --area RELN` and confirmed
    free with `--check` before this contract was authored. Not derived by
    scanning state; not re-minted here.
  hypothesis_id: H-RELN-427bfd
  source_proposal: IDEA-20260906-1f6bfe
  question_id: RQ-RELN-61638a
  version: 1
  title: >-
    Recovery-gated symbolic regression over decomposition-count statistics:
    frozen grammar search plus pinned PySR, pre-committed candidate list,
    held-out 2^20 rung, proves-too-much controls, every survivor a proof
    obligation
  status: review_required
  objective: >-
    Freeze a deterministic symbolic-regression instrument and point it at the
    measured summary statistics of the decomposition-count vector c_D(r) --
    dispersion index Delta, multiset additive energy E_m, k-rich counts R_k
    (k = 1..8), coverage R_1/N and the third factorial moment T -- as
    functions of (N, B, m, geometry, convention), on the committed
    EXP-FB3-001 tables and on exhaustive count-vector summaries at
    N in {2^14, 2^16, 2^18, 2^20} with an off-diagonal B-ladder. Stage 0
    must recover five pre-registered laws (INV-1, INV-7, INV-8, INV-A4,
    INV-A6) with constants free, at or below their canonical node counts and
    zero residual, and must see the known over-dispersion of the Z/N interval
    and small-multiples bases, before any new expression is reported. Stage 1
    fits every statistic on N <= 2^18 and predicts the held-out 2^20 rung,
    reporting the full Pareto front of (complexity, held-out error in null
    SE) per statistic, arm and engine, scored against the candidate list
    fixed in H-RELN-427bfd. Stage 2 converts each survivor into a proof
    obligation with a proves-too-much control outcome and schedules a 2^22
    counterexample search before any proof attempt. The decidable outcome is
    NULL (every E x-interval survivor is the random law INV-A1; the
    hypothesis's prediction) or ALIVE (an expression beyond INV-A1 predicts
    2^20 and passes its controls); both are reportable; an unrecovered
    Stage-0 control is instrument failure and yields neither. This contract
    is unapproved and authorizes zero executions.

  inputs:
    committed_fb3_cells:
      paths:
        - experiments/EXP-FB3-001/runs/RUN-FB3-001-N14/raw-result.json
        - experiments/EXP-FB3-001/runs/RUN-FB3-001-N16/raw-result.json
        - experiments/EXP-FB3-001/runs/RUN-FB3-001-N18/raw-result.json
        - experiments/EXP-FB3-001/runs/RUN-FB3-001-FAMILY/raw-result.json
        - experiments/EXP-FB3-001/runs/RUN-FB3-001-CTRL/raw-result.json
      fields: >-
        In the `cells[]` array of the N14/N16/N18 files: geometry,
        bits_target, N, B, curve_index, rep_seed, cell_seed,
        evaluation_domain, terminal_state, exact_total, closed_form_total,
        closed_form_total_ok, stats.{n_targets, sum_counts, mean, coverage,
        concentration, variance, max_count}, null_source,
        metrics.{mean, coverage, concentration}.{cell, null_mean, ratio,
        null_ratio_band_95, p_two_sided} and
        metrics.{mean, coverage, concentration}.null_detail.{n_null, null_sd,
        null_band_95, null_min, null_max}, extra.{window_W, x_min, x_max,
        window_density}. NOTE (read off the committed file, first cell of
        N18): the null standard deviation is stored at
        metrics.<stat>.null_detail.null_sd, not at metrics.<stat>.null_sd as
        the proposal wrote; the adapter reads the committed path. FAMILY
        (aggregates, analytic_arm block) and CTRL (control geometries
        small_multiples_H017, qr_walk_H016, symmetric arm) are read for the
        control tables and the symmetric-convention pack.
      convention: >-
        m = 3; UNSIGNED multisets from B distinct logs; whole-group targets
        (evaluation_domain whole_group only; held-out-half cells are
        excluded from every fit); B = ceil((6N)^(1/3)); conc = (1/N) sum_r
        c(r)(c(r) - 1); Delta is DERIVED by the identity INV-A6
        (Delta = conc/mu + 1 - mu; E_3 = N(conc + mu)) and never by
        rescaling; null_sd of the 200 shared matched-random draws is the
        per-cell null SE. Every row carries a `convention` column with the
        literal value fb3_unsigned_m3.
    dreg_series:
      paths:
        - ledger/EV-DREG-001.yaml
        - ledger/EV-DREG-002.yaml
        - ledger/EV-DREG-003.yaml
      fields: >-
        These records carry the Semaev-arm rank, sr_pred and deficit values
        in PROSE annotation lines, not numeric fields (confirmed by grep of
        EV-DREG-001 on 2026-09-06). The adapter transcribes (n_vars, rank,
        sr_pred, deficit) = (12, 28,096, 29,418, 1,322), (15, 69,073,
        70,935, 1,862), (17, 125,099, 126,922, 1,823), (18, 143,882,
        145,881, 1,999) and records file path and line number of each
        transcribed value in inputs.json; a transcription that cannot be
        located at a line is reported as missing, never estimated.
      convention: >-
        n_vars is a variable count of a polynomial system, not a group
        order; D_S = 5; four points; no held-out rung exists. PREDICTION
        TARGET ONLY: the three lowest-complexity fits emit hashed
        n_vars = 21 values (P6); nothing is fitted-and-reported. Row
        convention literal dreg_semaev_D5.
    sibling_enumeration:
      primary_source: >-
        The count-vector summaries of EXP-RELN-f202be (IDEA-20260906-d1494b,
        designed in parallel), read from
        experiments/EXP-RELN-f202be/runs/*/summary.json IF that contract is
        approved, executed and its snapshot archived before this experiment's
        Stage 1 opens. Fields expected per cell: geometry, group (E or ZN),
        N, B, m, curve_index, seed, E_m, Delta, R_k for k in 1..8, coverage,
        third_factorial_moment, null_mean and null_sd per statistic. The
        adapter validates the field set against this list and reports any
        missing field; it never fills one in.
      fallback_source: >-
        OWN ENUMERATION STAGE (Stage 0e of this contract), run if
        EXP-RELN-f202be is absent or incomplete at Stage-1 open: exact
        multiset count vectors c_D over the whole group by cyclic
        convolution of the indicator of log(D) (Polya/cycle-index
        combination of the m-fold, (m-1,1)- and m-fold-dilate convolutions so
        that MULTISETS, not ordered tuples, are counted; N prime so every
        dilation is a bijection), O(N log N) per cell, for the geometries and
        parameters in independent_variables, with 200 matched-random draws
        per cell for null_mean and null_sd. Discrete logs are known by
        construction for measurement only. The run report states which
        source was used; if both exist, BOTH are fitted and their agreement
        is a secondary metric.
      convention: >-
        Row convention literals enum_unsigned_m3, enum_xclass_signed_m2
        (the x-class convention of INV-7, loop counted), enum_zn_m3,
        enum_zn_m2, sidon_zn_q3m1. Cells are never merged across
        conventions.
    sibling_predictor_tables:
      paths: >-
        The three tables of EXP-RELN-82f487 (IDEA-20260906-79ff48: top
        features, partial-dependence curves, measured lift rho(D, pi)),
        OPTIONAL. If present at Stage-1 open, SR regresses the predictor's
        output and the lift on those features as an additional statistic
        pack; if absent, the pack is empty and the run report says so. No
        stage of this contract blocks on it.
      convention: pack literal predictor_82f487; leaf set per that pack's declared feature columns.
    ledger_records:
      - ledger/hypotheses/H-RELN-427bfd.yaml
      - ledger/proposals/IDEA-20260906-1f6bfe.yaml
      - ledger/questions/RQ-RELN-61638a.yaml
      - knowledge/findings/KN-FIND-007.md
      - experiments/EXP-FB3-001/conservation.md
      - ledger/proposals/IDEA-20260906-86cd30.yaml
      - ledger/proposals/IDEA-20260808-093497.yaml

  frozen_pipeline:
    primary_engine:
      name: exhaustive_grammar
      description: >-
        From-scratch bounded grammar search, exhaustive up to the complexity
        cap, deterministic, with the enumeration count reported per
        complexity.
      grammar:
        binary_operators: [add, sub, mul, div, pow, binomial]
        unary_operators: [log, exp, floor, ceil]
        leaves_by_pack:
          fb3_unsigned_m3_and_enum_unsigned_m3: [N, B, m, M, mu, CONST]
          enum_xclass_signed_m2: [N, B, n, M, mu, CONST]
          symmetric_m3: [N, B, W, M, mu, CONST]
          degree_table: [m, B, D_S, CONST]
          dreg_semaev_D5: [n_vars, CONST]
          enum_zn_and_sidon: [N, B, m, M, mu, CONST]
        derived_leaf_definitions: >-
          n = (N-1)/2; M = binomial(B+m-1, m); mu = M/N; W = |D u -D| = the
          effective symmetric size B' read from the record; CONST is a free
          constant placeholder fitted after structural enumeration. Derived
          leaves are provided as leaves so that an exact law is reachable at
          low complexity; a leaf is one node whether primitive or derived.
        node_counting_rule: >-
          Complexity = number of nodes in the expression tree, every operator
          application counting 1 and every leaf (variable or constant)
          counting 1; a derived leaf counts 1; pow counts 1 plus its two
          children; binomial counts 1 plus its two children. Canonical node
          counts of the control targets under this rule, written here before
          any run: INV-1 mean = binomial(B+m-1, m)/N -> 9; INV-7 p_fail =
          binomial(n-B, B)/binomial(n, B) -> 9, and p_exist = 1 - p_fail
          -> 11; INV-8 d_reg = ceil((m*(B-1)+D_S)/2) -> 10; INV-A4
          coverage = binomial(B+2, 3)/N -> 7 and Delta = 1 - mu -> 3;
          INV-A6 Delta = conc/mu + 1 - mu -> 7 (with conc supplied as a
          leaf for that identity check only). The Stage-0 gate for each
          control is 'recovered at or below its canonical node count'; the
          proposal's uniform '<= 10' presupposed an unstated counting rule and
          is replaced by this per-target rule, which is at least as strict for
          every control.
        complexity_cap: >-
          C_max = 12 nodes. Enumeration is over canonical forms (commutative
          operands ordered, constant subtrees folded, algebraic duplicates
          removed by symbolic simplification) and further deduplicated by the
          numeric fingerprint of the expression on the fit table. If the
          enumeration at some complexity C <= 12 does not complete within the
          Stage-1 grammar budget, the engine reports the largest completed
          complexity C_complete and every coverage statement is scoped to
          C_complete; not reaching C_max is a scoping fact, not a failure and
          not a result.
        constant_fitting: >-
          On integer- or rational-valued targets (means, totals, degrees,
          exact probabilities) constants are reconstructed as exact rationals
          with denominator <= 64 by continued fractions from the least-squares
          value; on real-valued targets (Delta, E_m and R_k measured on a
          specific base) constants are least-squares fitted and are
          additionally refitted per rung subset for the constants-absorb-N
          check. At most two free constants per expression.
        tie_breaking_seed: 20260906
        enumeration_order: >-
          By complexity ascending, then by canonical string ascending; ties
          in fit error broken by the canonical string, never by the seed --
          the seed exists only for the optional random restart of the
          constant fitter and is recorded.
    secondary_engine:
      name: pysr_pinned
      pinning: >-
        PySR at ONE exact release, pinned by version string, PyPI wheel
        sha256, Julia version and SymbolicRegression.jl version and tree
        hash, recorded in experiments/EXP-RELN-141a86/environment.lock.json
        at Stage 0a BEFORE any measured table is read and archived in the
        Stage-0 snapshot. The Coordinator does not assert a version number
        from memory (the proposal's own rule); once archived, the lock file
        is part of the frozen contract by this clause. A PySR or Julia
        version at any later stage that differs from the lock is
        failed_infrastructure for the PySR arm, never a result; the arm is
        dropped from every claim and the primary engine stands alone. If the
        pinned release cannot be installed in the run environment, the same
        applies.
      settings: >-
        deterministic = True, procs = 0, multithreading = False,
        random_state = 20260906, the same binary and unary operator sets as
        the grammar (binomial supplied as a custom operator), maxsize = 12
        for the C_max-comparable front plus a second run at maxsize = 20
        reported as 'stochastic-search only' beyond 12, niterations fixed
        and recorded, no warm start, loss = squared error weighted by
        1/null_sd^2 per cell.
      bit_identity_gate: >-
        Every PySR fit is run twice at the same seed and settings; the two
        hall-of-fame files must be byte-identical. A mismatch is
        failed_infrastructure for the arm (falsification condition F-PYSR of
        H-RELN-427bfd); the arm is dropped and the report says so.
      agreement_rule: >-
        Every PySR expression of complexity <= C_complete must be re-found by
        the exhaustive engine or it is reported as 'stochastic-search only';
        every exhaustive-engine front expression PySR misses is a recorded
        PySR completeness failure at that complexity (HEUR-H2).
    ordering_control: >-
      Stage 0a writes candidate-list.yaml (the 17 INV entries of
      H-RELN-427bfd with their expressions and canonical node counts),
      grammar.yaml (operators, leaf sets, node rule, C_max, seed),
      environment.lock.json and the closed-form control tables; computes
      candidate-list-hash.txt (sha256 over the concatenation, in that order);
      and STOPS. Those files are archived by a Coordinator snapshot commit
      before Stage 0b reads any measured table. The Stage-1 manifest must
      record the same hash and the archive commit; a mismatch invalidates
      Stage 1.

  controls:
    - name: stage0_recovery_INV1_conservation_mean
      construction: >-
        Table (N, B, m, mean) from committed_fb3_cells stats.mean at m = 3
        (all whole-group untyped cells) and from the enumeration source at
        m in {2, 3}; both engines, all constants free, leaf set of the
        matching pack.
      expected: >-
        binomial(B+m-1, m)/N (or B(B+1)(B+2)/(6N) at fixed m = 3) recovered at
        <= 9 nodes with zero residual on every row (integer-exact data); an
        algebraically equivalent form accepted after symbolic simplification.
    - name: stage0_recovery_INV7_m2_exact_law
      construction: >-
        (a) Exhaustive m = 2 enumeration in the x-class convention (V a
        random B-subset of the n = (N-1)/2 x-classes, loop counted) over 200
        random bases per cell on prime-order curves at 8, 10, 12, 14 and 16
        bits, B on the off-diagonal ladder, yielding p_exist per cell;
        (b) the closed-form table 1 - binomial(n-B, B)/binomial(n, B). The
        two tables are compared first; on disagreement beyond the binomial
        sampling error of 200 draws the control is REPLACED by the
        exhaustive table and the disagreement is reported to the
        IDEA-20260906-86cd30 lane. Then both engines fit p_fail and p_exist.
      expected: >-
        Tables agree; p_fail = binomial(n-B, B)/binomial(n, B) recovered at
        <= 9 nodes and p_exist = 1 - p_fail at <= 11 nodes, zero residual on
        the closed-form table; on the exhaustive table, residual within the
        200-draw sampling error.
    - name: stage0_recovery_INV8_semiregular_degree
      construction: >-
        Table (m, B, D_S, d_reg) generated by exact integer convolution: the
        first non-positive coefficient of (1 + z + ... + z^(B-1))^m
        (1 - z^(D_S)) for m in {2, 3, 4}, B in {4..64}, D_S in {3, 5, 7};
        both engines, degree_table leaf set.
      expected: >-
        ceil((m(B-1) + D_S)/2) recovered at <= 10 nodes with zero residual.
    - name: stage0_recovery_INVA4_sidon_floor
      construction: >-
        Bose-Chowla B_3 bases in Z/(q^3 - 1) for q in {29, 41, 67, 101}
        (log-space construction; not x-decidable), m = 3, count vectors
        enumerated exactly; table (N, B, coverage, Delta).
      expected: >-
        coverage = binomial(B+2, 3)/N at <= 7 nodes and Delta = 1 - mu at
        <= 3 nodes, zero residual; max_count = 1 in every cell; the pipeline
        must recover the under-dispersion floor.
    - name: stage0_recovery_INVA6_convention_identity
      construction: >-
        Zero-compute check on ALL committed FB3 cells (288 typed and untyped
        plus control geometries, whole_group domain): variance versus
        concentration + mean - mean^2 to floating precision; then the fit
        Delta = conc/mu + 1 - mu with conc, mu supplied as leaves.
      expected: >-
        Identity holds in every cell to within 1e-9 relative; Delta identity
        recovered at <= 7 nodes with zero residual. Any cell violating the
        identity is reported by cell id and the convention translation for
        that cell is withheld, never rescaled.
    - name: zn_interval_positive_control_proves_too_much
      construction: >-
        Z/N (N prime, same rungs) with the interval base [1, B] at m = 3
        and m = 2, exact count vectors; fitted with the enum_zn leaf set
        exactly as an E arm would be. BLOCKING for any null verdict.
      expected: >-
        The Delta front's best expression grows like B^2 (E_3 like B^5) and
        is NOT algebraically equivalent to INV-A1; the random-law expression
        has held-out error > 5 null SE there. An elliptic-curve-specific
        expression must FAIL on this object. If INV-A1 fits within tolerance
        the instrument is blind to over-dispersion and no E-arm null may be
        reported.
    - name: small_multiples_positive_control_with_decay_ladder
      construction: >-
        The small-multiples log-space base {1..B} (FB3 geometry
        small_multiples_H017, concentration ratio 188 / 480 / 1224 at
        2^14 / 2^16 / 2^18 from RUN-FB3-001-CTRL) plus, in the enumeration
        source, the decay ladder replacing a fraction q in {0, 0.25, 0.5,
        0.75, 1} of the base by random logs.
      expected: >-
        Fitted excess Delta - Delta_random falls monotonically to zero at
        q = 1; a flat excess is the artifact signature and voids the arm; at
        q = 0 the front's best expression is not INV-A1.
    - name: relabelled_zn_random_structure_destruction_null
      construction: >-
        Z/N with a uniformly random B-subset, same rungs and B-ladder, 4
        independent draws per cell playing the role of curves; fitted
        identically to the E arms.
      expected: >-
        Every survivor on this arm is a random-set law; any E-arm survivor
        ALSO found here is re-filed as a random-set law and no curve claim is
        made (falsification condition F6 of the proposal).
    - name: matched_random_null_per_cell
      construction: >-
        For every cell the same statistic on 200 uniformly random B-subsets
        (committed null_mean / null_detail.null_sd for FB3; 200 fresh draws,
        seeds derived per cell, in the enumeration source).
      expected: >-
        Provides null_mean and null_sd per cell; every E-arm expression is
        scored against the null-arm expression, never against zero;
        Delta_null at 2^14 and 2^16 from the committed FB3 nulls agrees with
        1 - 3(B-1)/N within 3 SE (P2) and rejects 1 - 1/N by > 10 SE at
        2^14.
    - name: constants_absorb_N_check
      construction: >-
        Every front expression with a free real constant is refitted on each
        rung subset separately (N frozen); the drift of the constant across
        rungs is compared with its own least-squares uncertainty.
      expected: >-
        A true law's constant drifts by less than its uncertainty; an
        expression whose constant drifts by more is flagged 'constant absorbs
        N-dependence' and cannot be a survivor.
    - name: convention_translation_identity_check
      construction: >-
        For the FB3 pack, Delta computed by INV-A6 from (conc, mean) is
        compared with Delta computed from the stored variance column
        (variance/mean); for the enumeration pack, conc and Delta are
        computed independently from the count vector and compared.
      expected: >-
        Agreement to 1e-9 relative in every cell; a mismatch is reported by
        cell and resolved only by reading the record's convention, never by
        rescaling.
    - name: held_out_transfer_anchor
      construction: >-
        INV-1 and INV-7 fitted on N <= 2^18 only, evaluated on the 2^20 (and
        2^22 if present) rung; INV-A1 evaluated on the RANDOM arms at 2^20.
      expected: >-
        Zero held-out error for INV-1 and INV-7; INV-A1 within 3 null SE on
        the random arms, which fixes the reference tolerance for the E arms
        (HEUR-H3). If INV-A1 misses on the random arm no E-arm verdict is
        issued.
    - name: identifiability_off_diagonal
      construction: >-
        The Delta front is computed twice: on diagonal-only cells
        (B = ceil((6N)^(1/3))) and on all cells including the B-ladder; the
        observation-collision set (distinct expressions within 1 SE of the
        best) is sized in both.
      expected: >-
        At least 3 members on diagonal-only data, at most 1 with the ladder
        (P5). If the set does not shrink, no B-versus-N claim is made.
    - name: enumeration_reproduction
      construction: >-
        The own-enumeration code (if used) is run on the FB3 configuration
        at 2^14 for one cell per untyped geometry, reconstructing the base
        from the committed extra.{x_min, x_max} window and curve parameters
        where the raw-result stores them.
      expected: >-
        exact_total equals the committed closed_form_total in every cell;
        where the base is reconstructible, stats.{mean, coverage,
        concentration, variance, max_count} match the committed values
        exactly; where it is not, the cell is reported not_reconstructible
        and the own-enumeration arm is validated by the closed-form total,
        the m = 2 exhaustive table and the INV-A4 Sidon cells only.
    - name: pysr_bit_identity
      construction: >-
        Second PySR run at the same seed and settings on every control and
        Stage-1 table.
      expected: Byte-identical hall-of-fame outputs; otherwise the arm is failed_infrastructure.
    - name: ordering_control
      construction: >-
        candidate-list-hash.txt computed at Stage 0a and archived before any
        measured table is read; the Stage-1 manifest records the hash and the
        archive commit.
      expected: Hashes match; a mismatch invalidates Stage 1 and 2.

  independent_variables:
    data_source: [committed_fb3_cells, sibling_enumeration_EXP-RELN-f202be, own_enumeration, dreg_series, sibling_predictor_tables_optional]
    statistic: [Delta, E_m, R_1, R_2, R_3, R_4, R_5, R_6, R_7, R_8, coverage, third_factorial_moment]
    arity_m: [2, 3]
    rungs_log2_N: [14, 16, 18, 20]
    held_out_rung_log2_N: 20
    counterexample_rung_log2_N: 22
    B_ladder: >-
      {round(B0/2), B0, 2*B0} with B0 = ceil((6N)^(1/3)) at every rung in the
      enumeration source; B0 only in the committed FB3 cells.
    geometry:
      - E_x_interval_high_bit_interval
      - E_small_height
      - E_coset_union
      - E_matched_random
      - ZN_interval_1_to_B
      - ZN_random_relabelled
      - sidon_bose_chowla_B3
      - small_multiples_log_space_with_decay_ladder
      - symmetric_D_union_minus_D
    convention_pack: [fb3_unsigned_m3, enum_unsigned_m3, enum_xclass_signed_m2, enum_zn_m3, enum_zn_m2, sidon_zn_q3m1, symmetric_m3, degree_table, dreg_semaev_D5, predictor_82f487]
    complexity_cap: [12]
    engine: [exhaustive_grammar, pysr_pinned]
    curves_per_rung: 4
    matched_random_draws_per_cell: 200

  metrics:
    primary:
      - >-
        Per statistic, arm, convention pack and engine: the Pareto front of
        (complexity in nodes, held-out error at 2^20) where held-out error is
        the root-mean-square over held-out cells of
        |e(cell) - observed(cell)| / null_sd(cell), with the curve-cluster
        bootstrap interval of that error; every front point carries its
        observation-collision set (all expressions within 1 null SE of it).
      - >-
        Per front expression: the pre-committed-list verdict 'matches
        candidate X' / 'matches no candidate' / 'contradicts candidate X',
        decided by symbolic equivalence against the expressions in
        candidate-list.yaml.
      - >-
        Per survivor (expression within 1 SE of the best held-out error that
        is not on the proved list): its held-out 2^20 prediction error in
        null SE on every curve, its improvement over INV-A1 in null SE, its
        replication count over curves, and its fibre (the arms on which it
        holds within 1 SE, including the relabelled Z/N random arm and the
        Z/N interval arm).
      - >-
        The recovery-control table: for each of INV-1, INV-7, INV-8, INV-A4,
        INV-A6 and each engine, recovered (yes/no), complexity at recovery,
        residual, canonical node count, and PASS/FAIL against the gate; plus
        PASS/FAIL for the Z/N interval and small-multiples positive controls
        and the decay-ladder monotonicity.
      - >-
        P2 zero-compute check: Delta_null from the committed 2^14, 2^16 and
        2^18 FB3 null means versus 1 - 3(B-1)/N and versus 1 - 1/N, in null
        SE, per rung.
      - >-
        k-rich profile: measured R_k versus the Poisson-tail reference
        N P[Poisson(mu) >= k] (m = 3) and versus the runs-law reference
        INV-A2 (m = 2), in null SE, for every k with expected count >= 5, per
        arm and rung; the largest k at which they agree; whether any excess
        at a fixed k grows across rungs.
    secondary:
      - Enumerated expression count per complexity and pack; C_complete reached per pack within budget.
      - Run wall clock and peak RSS per stage; PySR wall clock per table.
      - Expression sets at equal held-out error (observation-collision sets) with their sizes on diagonal-only versus ladder data (P5).
      - PySR-versus-grammar agreement rate on the front up to C_complete; PySR completeness misses per complexity; 'stochastic-search only' expressions above C_complete.
      - Constants-absorb-N drift per expression with a free real constant.
      - The three hashed n_vars = 21 DREG predictions with their complexities (P6), emitted at Stage 1 and scored never within this experiment.
      - Agreement between sibling_enumeration and own_enumeration statistics when both exist.
      - Which data sources were present at Stage-1 open (sibling battery, predictor tables).

  heuristic_under_test: HEUR-H1
  heuristic_under_test_note: >-
    HEUR-H1 (random-base model, INV-A1) is validated by the P2 zero-compute
    check, the exhaustive small-N averaging and the Monte Carlo tail checks
    below; HEUR-H2 and HEUR-H3 are validated by the engine-agreement metric
    and the held-out transfer anchor respectively (H-RELN-427bfd
    heuristic_assumptions).

  preregistered_prediction:
    quantity: >-
      (a) Delta on the E x-interval arms (high_bit_interval, small_height,
      coset_union, and the enumeration source's x-interval bases) at the
      held-out 2^20 rung; (b) the k-rich counts R_k there; (c) Delta_null on
      the committed 2^14 / 2^16 FB3 nulls; (d) the identity of every
      survivor against the pre-committed candidate list.
    formula: >-
      (a) Delta = 1 - m(B-1)/N + O((1+mu)/N), i.e. at m = 3
      Delta = 1 - 3(B-1)/N + O((1+mu)/N) (INV-A1), with no front expression
      beating it by more than 1 null SE on any E arm (NULL, predicted);
      (b) R_k = N P[Poisson(mu) >= k] within 3 null SE at m = 3 for every k
      with expected count >= 5, and R_k = (N-1) P_runs[c >= k] (INV-A2) at
      m = 2; (c) Delta_null = 1 - 3(B-1)/N within 3 SE at 2^14 and 2^16, and
      1 - 1/N rejected by > 10 SE at 2^14; (d) the pre-committed candidate
      list against which every front expression is scored, by id: INV-1,
      INV-2, INV-2prime, INV-2doubleprime, INV-3, INV-4, INV-4c, INV-5a,
      INV-5b, INV-6, INV-7, INV-8, INV-9, INV-A1, INV-A2, INV-A3, INV-A4,
      INV-A5, INV-A6 -- with INV-4c the open target predicted to be
      CONFIRMED in its null form (Delta = Delta_random (1 + o(1))) and the
      Z/N interval arm predicted to depart with Delta of order B^2. The
      Poisson tail and the runs law are REFERENCE FUNCTIONS evaluated
      numerically for metric (b); they are not grammar targets. Prediction
      P6 emits three hashed n_vars = 21 DREG values with complexities, not a
      claim.
    source: >-
      H-RELN-427bfd candidate_invariants (carried from IDEA-20260906-1f6bfe):
      INV-A1 derived in-record (unreviewed); INV-1 from KN-FIND-007; INV-7
      and INV-A2 from IDEA-20260906-86cd30 Theorem 2 and Corollary 2d
      (proposal status); INV-8 from IDEA-20260808-093497; the Poisson
      reference from the Janson bracket of 86cd30. Written before any run;
      never adjusted afterward except by a versioned amendment.

  scale_relevance:
    tier: toy
    justification: >-
      N <= 2^20 fitted, 2^22 for counterexample search only, prime-order
      curves with discrete logs known by construction for measurement only.
      No transfer beyond 2^22 is assumed; the only extrapolation inside the
      design is the held-out rung (HEUR-H3), and it is anchored by the exact
      laws INV-1 and INV-7 transferring with zero error. Nothing here is an
      ECDLP speedup claim or a crypto-scale statement.
    correspondence: null

  tail_checks:
    - >-
      Largest observed c(r) over all cells of each random arm and rung
      against the Poisson extreme-value prediction for N draws at mean mu;
      reported per rung with the predicted probability of the observed
      maximum.
    - >-
      Smallest observed Delta over all bases and arms against the Sidon floor
      1 - mu (INV-9); a value below the floor is an implementation error, not
      a discovery, and invalidates the run.
    - >-
      Exhaustive averaging over ALL B-subsets at N in {31, 61}, B in {4, 5},
      m in {2, 3}: E[E_m] against M + (M(M-1) - P_prop)/N exactly, isolating
      the O(M^2/N^2) remainder of INV-A1.
    - >-
      Monte Carlo over 10^4 random bases at N ~ 2^14 and 2^16 on the
      B-ladder: empirical distribution of Delta and of R_k against
      Poisson(mu), per k with expected count >= 5.

  replication:
    seeds:
      - grammar tie-break / constant-fitter restart seed 20260906
      - PySR random_state 20260906, run twice for bit identity
      - curve generation seed 20260906 for the own-enumeration source (4 prime-order curves per rung, parameters recorded in inputs.json)
      - matched-random null draw i of cell c seeded by sha256('EXP-RELN-141a86|' + convention + '|' + N + '|' + B + '|' + m + '|' + geometry + '|' + curve_index) truncated to 32 bits, plus i
      - curve-cluster bootstrap 2000 resamples, seed 20260906
    independent_instances: >-
      4 independent prime-order curves per rung (the committed FB3 curves at
      2^14 / 2^16 / 2^18; 4 generated curves at 2^20 and 2^22 in the own
      source, or the sibling battery's curves); replicate seeds do not
      resample deterministic x-line geometries (FB3 analysis.md pseudo-
      replication caveat), so every error bar is a curve-cluster bootstrap
      over curves, and 'replicated' means 'holds on >= 3 of the 4 curves'.
      Random arms use 4 independent draws per cell as their instances.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 40
    maximum_memory_gb: 16
    maximum_runs: 8
    maximum_workers: 4
    sizing_note: >-
      Advisory per docs/research-budget-policy.md. Sized for a host with at
      least 8 cores and 32 GB; a smaller host lowers maximum_workers and
      maximum_memory_gb in the handoff without amending the scientific
      protocol. Count vectors at 2^22 are 4M int64 entries (32 MB); the
      grammar enumeration at C_max = 12 over 6-leaf packs is the dominant
      cost and is bounded by C_complete scoping rather than by extending the
      budget. Workers above 1 are permitted only for embarrassingly parallel
      per-pack enumeration that has passed parallel.verify_determinism.
  stage_budgets:
    - stage: stage0a_freeze_and_hash
      wall_clock_seconds: 600
      note: zero measured data read; produces candidate-list.yaml, grammar.yaml, environment.lock.json, control closed-form tables, candidate-list-hash.txt; STOPS for snapshot archive
    - stage: stage0b_control_tables
      wall_clock_seconds: 1800
      note: exhaustive m = 2 enumeration at 8-16 bits; integer convolution for INV-8; Sidon cells; INV-A6 identity sweep over all FB3 cells
    - stage: stage0c_engines_on_controls
      wall_clock_seconds: 3600
      note: both engines on the five control tables and the two positive controls; PySR twice; HARD GATE
    - stage: stage0d_zero_compute_P2
      wall_clock_seconds: 300
      note: Delta_null from committed 2^14 / 2^16 / 2^18 FB3 nulls versus INV-A1 and 1 - 1/N
    - stage: stage0e_own_enumeration_if_needed
      wall_clock_seconds: 14400
      note: only if EXP-RELN-f202be summaries are absent or incomplete; 2^14..2^20, B-ladder, all geometries, 200 null draws per cell
    - stage: stage1_grammar_fits
      wall_clock_seconds: 21600
      note: exhaustive engine on every statistic pack; Pareto fronts; collision sets; scoring; C_complete reported
    - stage: stage1_pysr_fits
      wall_clock_seconds: 21600
      note: PySR on the same tables, twice; agreement with the grammar engine
    - stage: stage2_proof_obligations
      wall_clock_seconds: 3600
      note: survivors.json with proof routes, proves-too-much outcomes (already in the tables) and the 2^22 counterexample-search plan; the 2^22 search itself is a separate run authorized only by the positive decision path
  budget_interpretation: >-
    Advisory ceilings for a future handoff; this design authorizes zero
    runs. No stage borrowing; a stage that exhausts its ceiling reports
    C_complete or partial tables as such and is not a result.

  stopping_rules:
    - >-
      Stop after Stage 0a and wait for the Coordinator snapshot archive of
      the frozen files and hash; Stage 0b may not read a measured table
      before that archive is verified.
    - >-
      Stop at the end of Stage 0c if any recovery control is not recovered
      on the primary engine or either positive control is fitted by the
      random law within tolerance; report the failing control; Stage 1 does
      not run (instrument failure, not evidence).
    - >-
      Stop at the end of Stage 0d if Delta_null disagrees with INV-A1 by more
      than 3 SE at 2^14 or 2^16: INV-A1 drops to conjecture and the Stage-1
      reference is the MEASURED random arm, which requires a versioned
      amendment before Stage 1 runs.
    - >-
      Stop on any exhausted stage ceiling, wall clock, CPU or memory limit;
      preserve completed tables and the largest completed complexity; report
      partial state; never extend silently.
    - >-
      Stop on lost provenance (hash mismatch of candidate-list-hash.txt,
      environment lock mismatch, missing input path).
    - >-
      No automatic retries, no grammar or C_max change, no leaf added, no
      convention rescaled, no constant fixed by hand after a table is read.

  invalidation_rules:
    - Any Stage-0 recovery control not recovered on the primary engine, or recovered only above its canonical node count without the degraded-instrument flag propagated to every later bound.
    - Any fit that saw the held-out 2^20 rung (or 2^22) in its training table, including through a derived leaf or a constant fitted on it.
    - A convention mismatch resolved by rescaling a statistic to another record's convention rather than by reading each record's convention into the `convention` column.
    - The Z/N interval positive control fitted by the random-law expression within tolerance, or a flat decay-ladder excess on the small-multiples arm, with any E-arm null nonetheless reported.
    - A candidate-list, grammar or environment hash that does not match the archived Stage-0a files.
    - A single 'best' expression reported where the observation-collision set has more than one member.
    - PySR results used in any claim after a failed bit-identity re-run or a version differing from the lock.
    - >-
      Timeout, out-of-memory, solver or tool crash, or Julia/PySR
      installation failure in any stage is failed_infrastructure for that
      stage or arm, never a negative or positive result.
    - Any row with missing null_sd, missing convention literal or a non-whole-group evaluation domain entering a fit.
    - Evidence fabricated, overwritten, detached from its source commit, or produced before frozen approval.

  success_criterion: >-
    Decidable from the primary metrics. The experiment SUCCEEDS as a test of
    H-RELN-427bfd when (1) the recovery-control table shows every one of
    INV-1, INV-7, INV-8, INV-A4, INV-A6 recovered on the primary engine at or
    below its canonical node count with zero residual, the Z/N interval and
    small-multiples positive controls PASS, the ordering and hash controls
    PASS, and the held-out transfer anchor PASSES; and (2) EITHER the NULL
    outcome holds -- on every E x-interval arm every Delta front expression
    within 1 null SE of the best held-out error at 2^20 is scored 'matches
    candidate INV-A1' (algebraically equivalent), no expression beats INV-A1
    by more than 1 null SE, and R_k lies within 3 null SE of the Poisson tail
    (m = 3) / runs law (m = 2) for every k with expected count >= 5 -- which
    CONFIRMS the hypothesis's prediction and is reported with the measured
    energy excess and its bootstrap interval per rung; OR the ALIVE outcome
    holds as defined in the falsification criterion, which is an equally
    valid and reportable completion that REFUTES the predicted null. In both
    cases the scored candidate list (every INV entry marked matched /
    unmatched / contradicted per statistic) and survivors.json are produced.
    The null outcome is a result, not an instrument failure. Any outcome
    remains a candidate finding requiring independent review and a
    Coordinator decision before any status change.
  falsification_criterion: >-
    The hypothesis's PREDICTED NULL is falsified when, with every gate in
    clause (1) of the success criterion passing, some expression for Delta,
    E_3 or an R_k on an E x-interval arm with explicit N- or B-dependence
    beyond INV-A1 (scored 'matches no candidate' or 'contradicts INV-A1' /
    'contradicts INV-4c') has held-out error at 2^20 at least 5 null SE
    better than INV-A1, holds within 1 SE on at least 3 of the 4 curves, is
    ABSENT from the relabelled Z/N random arm's front, is not algebraically
    equivalent to the Z/N interval arm's expression, and passes the
    constants-absorb-N check (ALIVE). That survivor becomes a proof
    obligation with a scheduled 2^22 counterexample search; it is not
    evidence of ECDLP structure. NOT falsification: any Stage-0 gate failure
    (instrument failure -> inconclusive); INV-A1 missing P2 (INV-A1 drops to
    conjecture; the null is re-based on the measured random arm by
    amendment); a survivor found also on the Z/N random arm (random-set law,
    re-filed); an observation-collision set that does not shrink with the
    ladder (verdict scoped to the diagonal); resource exhaustion or tool
    failure (failed_infrastructure).

  decision_paths:
    positive: >-
      (Either NULL or ALIVE with all gates passing.) NULL: Coordinator
      records the null-separated finding at toy scale with grammar,
      C_complete, rungs and conventions; INV-4c's null form and INV-A1 gain
      empirical support at the tested scale (never above claim tier toy);
      the cluster question of RQ-RELN-61638a(i) is redirected to the
      pushforward lift of IDEA-20260830-c5c614 with INV-A1 as its analytic
      null; INV-A1 is handed to a proof note as a separate task. ALIVE: each
      survivor becomes a proof_obligation with its convention, proof route,
      proves-too-much fibre and a 2^22 counterexample search run FIRST as a
      separate authorized run; only a survivor of that search is opened as a
      proof attempt; no curve claim, no exponent, no crypto-scale statement.
      Both paths require independent review and a committed decision.
    negative: >-
      (A gate fails.) Coordinator records instrument failure with the failing
      control, the recovery complexity achieved and the engine; the
      hypothesis stays untested; a successor contract with a repaired grammar
      or engine is designed under a new experiment ID; no null or alive
      verdict is reported and nothing is closed by count or fatigue.
    inconclusive: >-
      Gates pass but the E-arm verdict cannot be decided: the best expression
      beats INV-A1 by between 1 and 5 SE, or replicates on fewer than 3
      curves, or the collision set at the front does not shrink with the
      ladder, or the sibling battery's 2^20 cells and the own enumeration
      disagree. Preserve every immutable artifact; name the missing rung,
      curve or ladder cell; design the discriminating successor (a fifth B
      value at 2^20, or the 2^22 rung) as a new handoff; retain the active
      question and un-promoted candidates.

  required_artifacts:
    - manifest.json
    - inputs.json
    - environment.json
    - environment.lock.json
    - grammar.yaml
    - candidate-list.yaml
    - candidate-list-hash.txt
    - control-tables/
    - recovery-controls.json
    - p2-delta-null-check.json
    - pareto-fronts/<statistic>-<pack>-<engine>.json
    - collision-sets.json
    - scored-candidate-list.json
    - k-rich-profile.json
    - tail-checks.json
    - dreg-n21-predictions.json
    - survivors.json
    - pysr-agreement.json
    - enumeration-summaries/ (own source only)
    - execution-report.md
    - stdout.log
    - stderr.log
    - source/grammar_engine.py
    - source/constant_fit.py
    - source/adapters_fb3_dreg_enum.py
    - source/pysr_harness.py
    - source/count_vectors.py
    - source/controls_m2_exhaustive_and_convolution.py
  artifact_binding: >-
    All future artifacts belong to newly allocated immutable run directories
    under experiments/EXP-RELN-141a86/runs/ (one per stage group: Stage 0a,
    Stage 0b-0e, Stage 1, Stage 2, and a separate run for any 2^22
    counterexample search). Each manifest binds the approved specification
    hash, candidate-list-hash.txt and its archive commit, input path hashes
    (including the exact FB3 raw-result.json hashes and, if used, the
    EXP-RELN-f202be summary hashes), source hashes, environment.lock.json
    hash, exact commands, seeds, requested_policy and resolved inference
    block, wall clock and peak RSS per stage. candidate-list-hash.txt must be
    archived by a Coordinator snapshot commit before any Stage-0b or later
    run is created. No run directory is authorized now.

  later_review_requirements:
    - >-
      A committed Coordinator review_plan must precede any claim-changing
      review, declaring the prior (0.85 null on the E x-interval Delta arm,
      0.05 alive, per the proposal), the owned joints (convention adapters,
      node-counting rule, constant fitter, held-out isolation), blindness,
      and the known-false controls (Z/N interval, small multiples).
    - >-
      Independent validator re-derives BLIND one Pareto front (the Delta
      front on the E x-interval arm, m = 3, fb3_unsigned_m3 pack) from the
      statement of the statistic, the grammar.yaml and the raw tables alone,
      without the producer's engine, report or fronts; agreement of the
      front up to C_complete is required before any verdict is accepted.
    - >-
      Validator checks: run counts and stage completeness, manifest schema,
      seed integrity and bit identity, raw/summary agreement (fronts
      recomputable from the stored per-cell errors), null_sd provenance per
      cell, held-out isolation (no 2^20 value in any training table), and
      that every collision set is reported as a set.
    - >-
      Red team attacks the selection-over-expressions confound (C1): whether
      thousands of tried expressions make a 5-SE held-out improvement
      expected by chance under the grammar's size; whether the pre-committed
      list was actually fixed before the fit; whether a constant absorbs N;
      whether the convention packs leak; and whether the grammar is shaped so
      that only the random law is expressible (C6).
    - >-
      Resolve review-adversarial at xhigh without silent downgrade; a
      proposed ALIVE survivor advancing toward any status above proposed, or
      any contradiction of an established finding (KN-FIND-007), requires
      nondegradable review-breakthrough at max.
    - >-
      Any proof note or counterexample certificate that settles a candidate
      invariant is archived as its own record; this specification and
      H-RELN-427bfd are never edited to record it.

  assigned_to: executor
  approved_by: null
  execution_authorized: false
  design_handoff: null
  design_archive_handoff: null
  yaml_parse_disclosure: >-
    Authored without a shell and not machine-parsed by its author; every
    prose value is a folded block scalar or a plain scalar without ': ' or
    ' #'; no tabs. The orchestrating session must run the strict parse and
    tools/validate_ledger.py before this contract is relied on.
