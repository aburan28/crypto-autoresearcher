protocol_amendment:
  experiment_id: EXP-RELN-141a86
  amendment_ordinal: 1
  version_from: 1
  version_to: 2
  filename_convention_note: >-
    THE FILENAME IS v1.yaml BECAUSE THIS IS THE FIRST AMENDMENT TO THIS
    CONTRACT, NOT BECAUSE IT PRODUCES CONTRACT VERSION 1. The contract is
    frozen at version 1; this amendment produces version 2.
  filed_at: '2026-09-07'
  filed_by: coordinator (orchestrating session, RQ-RELN-61638a)
  recorded_by_decision: DEC-20260907-057ffe
  status: filed_after_the_affected_data_is_generated
  claim_tier: toy

  applies_to: >-
    The Stage-0c stopping_rules clause "Stop at the end of Stage 0c if any
    recovery control is not recovered on the primary engine ... Stage 1
    does not run" and the success_criterion clause requiring "every one of
    INV-1, INV-7, INV-8, INV-A4, INV-A6 recovered ... at or below its
    canonical node count with zero residual", SOLELY as they apply to the
    INV-7 p_exist sub-target (canonical node count 11, pack
    enum_xclass_signed_m2). No other recovery control, sub-target, or
    stage is touched. Nothing in RUN-RELN-141a86-stage0bcde,
    -stage0c-repair, -stage0c-minimality, or -stage0c-pexist-extended is
    edited, re-scored, or reinterpreted; every recorded number stands
    exactly as measured (AGENTS.md rules 2 and 4).

  reason: >-
    INV-7 p_exist's part (b) (direct construction) is already affirmatively
    settled: the known closed form
    sub(CONST[1],div(binomial(sub(n,B),B),binomial(n,B))) has EXACTLY the
    canonical node count (11) and zero residual (to float64 epsilon,
    1.1e-16) on all 15 real control-table rows, recorded identically across
    three independent runs (stage0bcde, stage0c-repair, stage0c-minimality).
    What remains open is part (a), the exhaustive minimality search strictly
    below complexity 11: it is complete and clean through level 8 (no
    match, RUN-RELN-141a86-stage0c-minimality) but has never completed
    level 9 despite three attempts -- twice at a 6000s cap
    (stage0bcde, stage0c-repair) and, in RUN-RELN-141a86-stage0c-pexist-
    extended, twice more at a 72000s cap with per-level checkpointing
    proven durable against a real SIGKILL. All four p_exist attempts ended
    in resource_exhaustion / failed_infrastructure, never a match, never a
    negative result. The two pexist-extended relaunches specifically each
    died to a container restart before completing level 9, and did so at
    or before roughly the same ~30-minute mark it independently takes to
    re-derive levels 1-8 from scratch (a fact recorded live during this
    session and cited in RUN-RELN-141a86-stage0c-pexist-extended/manifest.yaml's
    restart_history). This makes the from-scratch-relaunch strategy for
    reaching level 9 unreliable on the current infrastructure: without a
    true resume capability (serializing the full in-memory dedup state,
    not just per-level summary counts -- disclosed as not yet built, per
    that run's resume_decision block), the job may keep re-deriving levels
    1-8 indefinitely without ever completing level 9's construction, let
    alone the further level 10 the contract's own max_complexity=10
    (canonical_complexity(11)-1) requires for a full pass. The user was
    asked (AskUserQuestion) how to proceed among: build true resume first,
    keep retrying as-is, amend the gate to accept the 4-of-5 state, or stop
    for now; the user chose "Amend the gate to accept 4-of-5".

  the_freeze_is_NOT_fully_intact_and_that_is_stated_rather_than_hidden: >-
    This amendment accepts, going forward, a WEAKER form of "recovered" for
    INV-7 p_exist specifically: existence at the canonical complexity with
    zero residual (part (b), fully proven), plus exhaustive non-existence
    of any match at complexity <= 8 (part (a), proven only that far, not
    through 9-10 as the original gate required). This is a genuine, disclosed
    relaxation of the minimality proof's completeness for this one
    sub-target -- it does NOT retroactively claim complexity 9 or 10 were
    searched, and it does NOT claim the known form is proven unique-minimal
    the way INV-1, INV-7 p_fail, and INV-8 are (those three completed
    exhaustive search one full level below their own target and are
    unaffected by this amendment). A reader who wants the stricter original
    standard applied can see exactly where it stops: level 8 is the last
    exhaustively completed level, per checkpoint-INV-7_p_exist.json in
    RUN-RELN-141a86-stage0c-minimality, unedited by this amendment.

  changes:
    - id: G1
      field: >-
        stopping_rules[[Stop at the end of Stage 0c if any recovery control
        is not recovered ...]] and success_criterion's recovery-control
        clause, solely for the INV-7 p_exist sub-target.
      kind: gate_relaxation_partial_recovery_accepted_under_disclosed_infrastructure_limit
      decided_by: >-
        THE USER, this session (AskUserQuestion: "Amend the gate to accept
        4-of-5"), implemented by the Coordinator. Recorded in
        DEC-20260907-057ffe.
      from: >-
        INV-7 p_exist must be "recovered on the primary engine ... at or
        below its canonical node count with zero residual" via exhaustive
        search through complexity 10 (max_complexity = canonical(11) - 1),
        exactly as INV-1, INV-7 p_fail, and INV-8 were.
      to: |-
        INV-7 p_exist is treated as PARTIALLY RECOVERED, carrying a
        mandatory degraded-minimality flag into every later stage, when
        BOTH of the following hold (both already true as of this filing):
        (i) direct construction confirms the known closed form has exactly
        the canonical node count (11) with zero residual on the real
        control table [SATISFIED: RUN-RELN-141a86-stage0c-minimality,
        part_b, residual 1.1e-16, 15 rows]; (ii) exhaustive search strictly
        below the canonical complexity has completed through AT LEAST
        complexity 8 with no match [SATISFIED: level 8, 3,314,145
        cumulative forms, RUN-RELN-141a86-stage0c-minimality]. Under this
        relaxed standard, Stage 1 is authorized to run treating the
        Stage-0c gate as passed (5 of 5 controls: INV-1, INV-7 p_fail,
        INV-8, INV-A4, INV-A6 fully recovered per the ORIGINAL standard;
        INV-7 p_exist PARTIALLY recovered per this amended standard).
        Levels 9-10 remain unsearched for p_exist; this fact and the
        degraded-minimality flag below travel with every later artifact
        that cites INV-7's recovery.
      degraded_minimality_flag_propagation_requirement: >-
        Every Stage 1, Stage 2, evidence, or knowledge-promotion artifact
        that reports INV-7 (either sub-expression) as "recovered" MUST
        state explicitly: "p_exist's minimality is proven only through
        complexity 8; complexities 9-10 are unsearched due to disclosed,
        repeated infrastructure failure (three container-restart deaths,
        RUN-RELN-141a86-stage0c-pexist-extended), not ruled out by
        computation." No artifact may drop this qualifier or state INV-7
        p_exist's minimality as fully established. This mirrors, and is
        modeled directly on, the existing invalidation_rules clause for a
        control "recovered only above its canonical node count without the
        degraded-instrument flag propagated to every later bound" -- same
        mechanism, applied to an incomplete-below rather than
        above-canonical recovery.
      what_this_change_is_not: >-
        IT IS NOT A CLAIM THAT LEVELS 9 OR 10 WERE SEARCHED, EXHAUSTIVELY
        OR OTHERWISE. It is not a claim that INV-7 p_exist's known form is
        the unique minimal-complexity match -- only that no LOWER-complexity
        match exists through level 8, and that the known form exists
        exactly at complexity 11. It is not a finding about the
        dispersion index Delta or the m=2 runs-distribution claim in
        INV-7's own statement (H-RELN-427bfd), which this control does not
        itself test. It does not touch INV-1, INV-7 p_fail, INV-8, INV-A4,
        or INV-A6, all of which remain fully recovered under the ORIGINAL,
        unamended standard.
      why_level_8_and_not_a_lower_or_higher_bar: >-
        Level 8 is not an arbitrary concession -- it is the highest level
        RUN-RELN-141a86-stage0c-minimality actually completed exhaustively
        for this exact target (3,314,145 forms enumerated and hash-
        deduplicated, checkpointed durably), so accepting it as the
        partial-recovery floor asserts nothing beyond what was genuinely
        computed. A lower bar (e.g. level 6) would discard real, already-
        paid-for compute; a higher bar (level 9 or 10) is exactly the
        infrastructure-blocked step this amendment exists to route around.

  stage1_execution_note: >-
    This amendment authorizes Stage 1 to run; it does not itself execute
    Stage 1. A separate handoff (TASK-20260907-8fd098) dispatches the
    exhaustive grammar engine (stage1_grammar_fits) across every statistic
    pack under the now-passed gate. PySR (stage1_pysr_fits) was already
    recorded unavailable in this environment
    (RUN-RELN-141a86-stage0a/environment.lock.json); if still unavailable,
    that half of Stage 1 is reported as a disclosed tooling gap
    (failed_infrastructure for that arm only), never silently skipped or
    substituted, per the contract's own PySR invalidation_rule.

  unchanged_and_still_frozen:
    - >-
      Every other stopping_rule and invalidation_rule not named in change
      G1, including Stage 0d's Delta_null-vs-INV-A1 stop, the observation-
      collision "single best expression" rule, the PySR bit-identity
      re-run rule, and the missing-provenance stop.
    - >-
      Grammar, leaf sets, node-counting rule, complexity cap 12, and the
      19-entry candidate list (candidate-list-hash.txt unchanged,
      re-verifiable at f1aec620f8cb19318e6d6459174bd79b80daf6dd46fdacf6afdf2468c7cac7f2).
    - >-
      success_criterion's NULL/ALIVE scientific classification (the
      held-out transfer anchor, the Poisson-tail / runs-law tail checks,
      the observation-collision handling) in full; this amendment changes
      only what counts as INV-7 p_exist's recovery-control PASS, not what
      counts as a NULL or ALIVE verdict on the hypothesis itself.
    - claim_tier toy; no ECDLP claim under any outcome.

  what_this_amendment_does_not_do:
    - >-
      It does not promote or demote H-RELN-427bfd. Status stays proposed
      pending Stage 1/2 results and independent review.
    - >-
      It does not make any of the four resource_exhaustion attempts on
      INV-7 p_exist into evidence, positive or negative. Infrastructure
      failures are categorically not evidence (AGENTS.md rule 3).
    - >-
      It does not authorize a scientific conclusion on H-RELN-427bfd. Any
      eventual NULL/ALIVE classification from Stage 1/2 still requires the
      contract's later_review_requirements (independent validator, red-team,
      review-adversarial at xhigh) before it backs a claim.
    - >-
      It does not close the door on completing INV-7 p_exist's full
      minimality later (e.g. if true checkpoint-resume is built, or the
      environment proves more stable): a future run that DOES clear level
      9-10 with no match would simply upgrade p_exist from partial to full
      recovery under the ORIGINAL standard, superseding the partial flag
      via a new run and evidence record, never by editing this one.
    - >-
      It does not change EXP-RELN-f202be or EXP-RELN-82f487, which are
      separate contracts under RQ-RELN-61638a with their own approval
      decisions and amendments.

  approved_by: coordinator
  approved_at: '2026-09-07'
  approved_by_note: >-
    Approved on filing. The relaxed standard was decided by the user this
    session, not inferred by this Coordinator, and every input (part (a)'s
    level-8 completion, part (b)'s zero-residual construction, the three
    resource_exhaustion timings and the container-restart evidence) is
    already committed in immutable run artifacts, independently
    re-checkable by anyone from those files. What review is still owed is
    unchanged: the contract's later_review_requirements apply in full to
    Stage 1/2's eventual NULL/ALIVE classification before it backs any
    claim, and the degraded-minimality flag above must appear in every one
    of those artifacts.
  approval_scope_limit: >-
    This approval authorizes the INV-7 p_exist gate relaxation and Stage 1
    execution under the amended standard. It does not authorize any change
    to EXP-RELN-f202be or EXP-RELN-82f487 and does not itself constitute a
    scientific decision on H-RELN-427bfd.

