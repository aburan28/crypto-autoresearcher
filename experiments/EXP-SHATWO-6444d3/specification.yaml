experiment:
  id: EXP-SHATWO-6444d3
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-6df779; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-6df779
  question_id: RQ-SHATWO-f196c7
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Joint deficit-and-frontier spectrum over a 60-member sampled family of SHA-256/16 variants
    differing only in the two sigma rotation-and-shift triples, with a permutation null and a random-tap
    comparison family
  objective: 'The one uncertainty a run reduces is whether the solver-free deficit integer and the
    solver-measured reachable step count respond to the same design choice. (i) It constructs a family
    of 60 primitives that differ from SHA-256/16 only in the two sigma rotation-and-shift triples,
    holding recurrence taps, word width, block size, step count and compression function identical,
    and computes both coordinates on every member by the two frozen pipelines already used elsewhere
    in this bucket, so that a design-versus-search question becomes a two-axis point cloud. (ii) It
    reduces the artifact uncertainty in two ways executed in the same invocation: a 10000-draw permutation
    null against which any rank correlation over 60 points is scored, without which structure would
    be read into a small cloud, and a random-tap comparison family swept identically so that a correlation
    found where there is no design to speak of is visible. (iii) It refuses to report a correlation
    at all unless a resolution gate passes first - the deficit''s between-member spread must exceed
    its within-member spread across sampled carry classes by at least a factor of two - so that a
    first coordinate which does not distinguish family members is declared as such rather than correlated
    anyway. A run does NOT reduce uncertainty about whether any triple is a better design, about 32-bit
    SHA-256, or about whether any association is a mechanism.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope: for the 60 sampled sigma triples at word
      width 16, under the declared degeneracy exclusion rule, the frozen condition-support family
      and carry-class rule, the frozen CNF encoder, the named solver version and the frozen budget,
      the deficit and reachable step count took the emitted values per member, the rank correlation
      between them took its emitted value, and that value did or did not fall outside the 10000-draw
      permutation null. WHAT DOES NOT FOLLOW: that any triple including SHA-256''s is a better or
      worse design, which this record forbids as a claim; that a correlation identifies a mechanism
      rather than an association; that any value transfers to 32-bit SHA-256; that a low reachable
      step count for any member means no characteristic exists for it; and nothing about full 64-step
      SHA-256, HMAC-SHA-256, TLS certificate chains, code signing, or Bitcoin.'
  inputs:
    procedure: 'STAGE 0 (hours, human): write and hash the preregistration - the sampling rule for
      triples, the degeneracy exclusion rule, family size, seeds, carry-class rule, budget, and the
      resolution-gate threshold. STAGE 1 (minutes, machine): sample the 60 triples, apply exclusions,
      and record the excluded set with reasons. STAGE 2 (minutes, machine): compute the deficit integer
      for every member in every sampled carry class by the existing rank pipeline; compute the resolution
      gate and HALT REPORTING OF ANY CORRELATION if it fails, emitting the gate result as the deliverable.
      STAGE 3 (hours, machine): confirm the instrument''s planted-signal gate has passed by citing
      its run id; do not proceed otherwise. STAGE 4 (the bulk, bounded by declared wall clock): measure
      the reachable step count for every member, 5 seeds each, at the frozen budget, verifying every
      returned assignment. STAGE 5 (same scale, reduced): sweep 20 random-tap family members identically
      for NULL-T. STAGE 6 (minutes): compute rank correlations and 10000-draw permutation nulls for
      both families, report SHA-256''s percentile position on each axis without interpretation, and
      emit the run manifest with seeds, encoder hash, solver version and resolved inference block.'
    instrument: Python 3.11 throughout; numpy for uint64 bit-packed GF(2) elimination in the deficit
      pipeline and for the permutation null; PySAT with a pinned CaDiCaL or Kissat build for the frontier
      pipeline, version fixed for the whole sweep; two independently written pure-Python SHA-256/16
      implementations, reparameterized by sigma triple, for certificate verification; harness/runner.py
      for manifests, deterministic seeds and the inference block. No computer-algebra system and no
      Sage.
    parameters: 'Word width 16, block 16 words = 256 bits, step ladder bracketing the pilot frontier.
      Family: 60 sampled sigma triple pairs, each triple two rotation amounts in 1..15 and one shift
      amount in 1..15, sampled uniformly with repeated-amount and zero-shift cases excluded by the
      declared rule; SHA-256''s own scaled triples included as a labelled member. Carry classes: all-zero
      plus 8 sampled per member. Seeds 301..305 per member. NULL-T: 20 random-tap members at the same
      settings. Permutation null: 10000 draws. Resolution-gate threshold: between-member spread at
      least twice within-member spread.'
  controls:
  - NULL-P permutation null with 10000 random pairings of the two coordinate vectors, in the same
    invocation.
  - NULL-T random-tap family swept identically, with its own permutation null.
  - Resolution gate comparing between-member deficit spread against within-member carry-class spread,
    computed and reported before any correlation.
  - Certificate verification of every returned assignment against an independently written reduced-width
    implementation.
  - The planted-signal instrument gate from the companion contract in this bucket, cited by run id
    as a precondition rather than re-run here.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls in the same invocation. NULL-P permutation null: recompute
    the rank correlation on 10000 random pairings of the two coordinate vectors across family members,
    giving the null distribution against which the observed correlation is scored - this is the only
    defence against reading structure into a 60-point cloud. NULL-T random-tap family: repeat the
    entire sweep on a family whose recurrence taps are themselves randomized rather than SHA-256''s,
    so that any correlation found in the signal family can be compared against one found where there
    is no design to speak of. For the signal arm to mean anything, the observed correlation must fall
    outside the NULL-P distribution; if the NULL-T family shows the same correlation, the association
    is a property of the two pipelines'' shared dependence on constants rather than of SHA-256''s
    structure, and the result is recorded as a controlled null.'
  independent_variables:
  - sigma0 rotation-and-shift triple
  - sigma1 rotation-and-shift triple
  - family (signal versus NULL-T random tap)
  - seed
  - carry class
  metrics:
    primary:
    - deficit integer per member
    - reachable step count per member per seed
    - rank correlation between the two coordinates over the family
    - permutation-null percentile of that correlation
    secondary:
    - between-member versus within-member deficit spread ratio
    - CNF variable and clause counts per member
    - certificate verification rate
    - SHA-256's percentile position on each axis
    - excluded degenerate triples with reasons
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The Spearman rank correlation between the deficit integer and the seed-median reachable
      step count across the 60 signal-family members, and its percentile within a 10000-draw permutation
      null; plus the resolution-gate ratio computed before either.
    formula: 'gate_ratio = (standard deviation of the deficit across the 60 members, at the all-zero
      carry class) divided by (mean over members of the standard deviation of the deficit across that
      member''s 8 sampled carry classes). Frozen rule: if gate_ratio < 2.0, report the gate result
      and DO NOT report any correlation. Otherwise rho = Spearman(deficit, seed-median reachable step
      count) over the 60 members, scored against 10000 random pairings; rho outside the central 95
      percent of the permutation null is scored ASSOCIATED, inside is scored NOT ASSOCIATED, and the
      NULL-T family must be scored NOT ASSOCIATED for the signal arm''s score to be read at all.'
    source: Pre-registered in the parent proposal IDEA-20260816-6df779 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Word width 16, 256-bit block and step ladders in the low tens, chosen because
      a 60-member family with 5 seeds each is affordable only at reduced width; at w = 32 the solver
      arm alone would exceed the campaign budget by orders of magnitude. The transfer assumption stated
      and NOT tested: that the constant-dependence measured at w = 16 has any counterpart at w = 32.
      No numeric value here may be quoted against 32-bit SHA-256, no extrapolation across width is
      performed, and the word-width scaling entry in this bucket is the separate contract that would
      probe width transfer at all.'
    correspondence: null
  tail_checks:
  - Report the full 60-member point cloud, not only the correlation, so a cloud driven by two outliers
    is visible.
  - Report the excluded degenerate triples in full with the exclusion reason for each.
  - Report per-member CNF variable and clause counts next to the reachable step count, so a correlation
    with encoding size is visible on inspection.
  - Report the per-member seed spread of the reachable step count, so members whose second coordinate
    is unresolved are identifiable.
  - Check members whose rotation amounts coincide modulo the word width, which are degenerate at toy
    width for reasons specific to that width.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: 12.0
    maximum_memory_gb: 8
    maximum_runs: 60
  stopping_rules:
  - Halt and report only the gate result if gate_ratio < 2.0; do not compute or report any correlation.
  - Do not run at all unless the companion planted-signal instrument gate has passed and its run id
    is cited.
  - Halt on any returned assignment that fails independent certificate verification.
  - Stop at the 60 preregistered members; do not extend the family after seeing the cloud.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The gate result, the full 60-member point cloud with both coordinates and their
    spreads, the rank correlation with its 10000-draw permutation null, the NULL-T comparison, and
    SHA-256's uninterpreted percentile position are all emitted - including when the gate fails and
    no correlation is reportable, since a measured failure of the deficit to resolve the family is
    the cleanest obstruction this contract can produce.
  falsification_criterion:
  - gate_ratio below 2.0, falsifying the deficit's ability to resolve the family and closing the correlation
    reading at the tested width.
  - The NULL-T random-tap family is scored ASSOCIATED, falsifying the premise that any association
    is a property of SHA-256's structure.
  - The observed correlation falls inside the permutation null, falsifying the joint predictive reading
    of the deficit at the tested width.
  - Any returned assignment fails independent certificate verification.
  - Seed spread of the reachable step count within members exceeds the between-member spread, falsifying
    the second coordinate's resolution.
  - The companion planted-signal gate has not passed, in which case the second coordinate is uninterpretable
    and no result may be recorded.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-6df779
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The uniform sampling distribution over rotation and shift amounts is a convention with no argument
    attached; a Coordinator must accept it or specify a structured alternative.
  - The degeneracy exclusion rule shapes the family and is declared rather than derived; the excluded
    set is reported but the rule itself is unjustified.
  - No argument establishes that 60 members and 5 seeds resolve the correlation at the effect sizes
    of interest; the permutation null will report power only after the fact.
  - This contract depends on both the rank pipeline and the planted-signal instrument gate from companion
    proposals in this bucket and cannot be approved before both have passed.
