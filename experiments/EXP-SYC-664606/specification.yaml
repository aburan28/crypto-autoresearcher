      idea.eta_complete_coverage_contract.threshold_rows in the bound
      mathematical source. Recompute and integer-certify each floor; any
      mismatch or failed certificate invalidates the fixture.
    pseudo_true_rule: >-
      Use all twelve width-10^-36 reference rectangles at
      idea.eta_complete_coverage_contract.pseudo_true_brackets. Certify each
      by directed-rounding interval Newton at 512 bits before any coverage fit.
    acceptance: >-
      In every gamma-by-eta cell require 500<=covered<=512,
      lower_misses<=7, and upper_misses<=7. All twelve cells must pass; no
      simultaneous familywise-coverage claim is permitted.
    early_stop: >-
      Stop only if covered_so_far+remaining<500, lower_misses>7,
      upper_misses>7, a fit fails, a bracket is uncertified, or a hard cap is
      reached. Preserve partial records. Favorable stopping and regeneration
      are forbidden.

