  estimand:
    name: uniform_public_model_family_marginal_boolean_probability
    exact_definition: >-
      p_N=E_C,Q[(1/4) sum_{m=0}^3 E_root S(C,Q,m,root)]. Curves and targets
      are outer draws; models and roots are nested observations, not four
      independent restarts.
    tracked_root_tuple: [D, Y, X, V, S]
    definitions:
      D: selected cross-pair denominator, diagnostic only
      Y: multiplicity-weighted exact matches
      X: number of distinct exact matching A values
      V: number of distinct matches whose scalar independently verifies
      S: '1[V>=1], the runtime success variable'
    reference_order: 16777216
    eta_values: [-4, 0, 4]
    model: >-
      For fixed eta, log p_i=alpha+beta*log(N_i/16777216)
      +eta*(N_i^(-1/3)-16777216^(-1/3)), with free alpha and beta and
      0<p_i<1.
    slope_identity: gamma_s=beta+1/3 exactly
    estimator: >-
      For each fixed eta, maximize the equal-size, equal-curve, equal-model,
      equal-root composite Bernoulli log likelihood. A deterministic
      interval-Newton solve at 384-bit precision must isolate the unique
      interior root to width below 2^-120, then round gamma to signed Q21.104.
      Failure to isolate is nonconvergence; no estimator substitution is allowed.
    exposure_rule: D is omitted; offset_D=0 and offset_floor=0 exactly
    source_subtree_bindings:
      root_random_variables: 2fa8fc370e2a8aa7a97368aef0cad9738bfbc516dad7e2448c40ee72d8bbe4a6
      boolean_success_derivation: 9d5bcbe0af4ca6d4df6ca7663205354686227d02deb33b152184af16b5557cd7
      assumptions: b9d363abaa5e7c7959415a2bb924baca8161757a49ff53af1816eaf2b6c4629b
      heuristic_assumptions: d8a676a9fbf65ae3c303db1c35925b0f5fcadd1c73d286472b56cc391e56c0ca
      marginal_boolean_estimand: 21985f63d32501e6ecbceea809577ff3a178eab2c3c9b14b8d3b4c8eb2f8d5c9
