  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  objective: >
    Evaluate the exact identities that
    e=alpha/2 is independent of m on
    the frozen grid and hits the four
    level-set values, and reject the
    nearby rank-4-Minkowski-gives-1/3
    claim, on one frozen family
    (REAL, KF, NULL).
  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL
      m-independent; level set
      {1/2,1/3,1/4,1/6}; KF rejected;
      NULL e-falls-with-m rejected.
      Certificate kind none.
    formula: >
      r=2*m^2; log_p det = m^2*alpha;
      e=(1/r)*log_p det = alpha/2.
    source: IDEA-20260817-230971 mechanism (internal)
    claim_tier: observational
  inputs:
    fixture:
      real_grid:
        m: [1, 2, 3, 4]
        alpha: ['1', '2/3', '1/2', '1/3']
        formula: e = alpha/2
        expected_e: ['1/2', '1/3', '1/4', '1/6']
        must_m_independent: true
        must_level_set: true
      known_false:
        kind: minkowski_rank4_gives_one_third
        claimed_e: '1/3'
        minkowski_e: '1/2'
        must_reject: true
      matched_null:
        kind: e_decreases_with_m
        dummy_formula: e = 1/(2*m)
        must_reject: true
  controls:
    - name: known_false_rank4_one_third
      object: KF claim Minkowski rank 4 yields e=1/3
    - name: matched_null
      object: m-dependent dummy exponent
  independent_variables:
    - m
    - alpha
  metrics:
    primary:
      - fixture_pass
      - m_independent_pass
      - level_set_pass
      - known_false_rank4_minkowski_pass
      - null_m_dependent_pass
    secondary: []
  primary_metrics:
    - fixture_pass
    - m_independent_pass
    - level_set_pass
