# =============================================================================
# EXP-BINSTD-372679 -- Frozen contract for H-BINSTD-c72284: HOLD-S
# supersession — K-163 hosts no Frobenius-stable subspace; H1-PRIME
# relabelling null on linear sigma-stable bases; H2 removed.
#
# Source: IDEA-20261001-b98944 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved: DEC-20261002-84a9b7. Snapshot: TASK-20261002-3ea53f.
# Executor: TASK-20261002-870a1e.
#
# Supersedes IDEA-20260922-2a3771 content (HOLD-S); original not edited.
# Stages 0-1 authorized under this card. Stage 2+ SAT census is a successor
# amendment, not authorized here. ZERO RUNS in the design session.
# No AUXIN. No Bedrock. Claim tier: control / toy. No attack / exponent claim.
# =============================================================================
experiment:
  id: EXP-BINSTD-372679
  version: 1
  hypothesis_id: H-BINSTD-c72284
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-b98944
  supersedes_idea: IDEA-20260922-2a3771
  related_idea_ids:
    - IDEA-20261001-93e740
    - IDEA-20261001-e740ce
    - IDEA-20260926-9c5694
    - IDEA-20260906-a77711
  goal_id: GOAL-ECDLP2M-001
  designed_by_task: TASK-20261002-3ea53f
  snapshot_task: TASK-20261002-3ea53f
  executor_task: TASK-20261002-870a1e
  title: >-
    HOLD-S supersession: Stage-0 ord/lattice/H1-PRIME worksheet; Stage-1
    setup + fixture B0 + H2 self-check at n in {17,23,31} — relabelling
    null instrumentation (SAT census deferred)
  status: approved
  approved_by: DEC-20261002-84a9b7
  approval:
    approved_by: DEC-20261002-84a9b7
    standing_authorization: >-
      AGENTS.md standing user authorization (2026-09-06). Protocol complete;
      Coordinator checked required fields before approving.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    execution_state: approved frozen contract; awaiting /run under TASK-20261002-870a1e

  objective: >-
    (1) Freeze Stage-0 zero-compute worksheet: ord_n(2) and stable-subspace
    lattices at n in {17,23,31,131,163}; confirm ord_163(2)=162 and dims
    {0,1,162,163}; freeze H1-PRIME band (>=0.95), cell table, withdrawn
    n^{-m} comparator, H2-removed note. (2) Stage-1: build Koblitz toys and
    ordinary nulls at n=17/23/31; construct stable bases; run fixture B0
    (gauge j=0 equals arm (c) after renaming; H2 abscissa orbit-constancy
    self-check; encoding export structure). Observations only. SAT conflict-
    count census (Stage 2+) is NOT authorized under this card.

  claim_tier: control
  claim_tier_note: >-
    Toy control / instrumentation at m in {2,3}, n in {17,23,31}. No
    IC-vs-rho claim, no deployed-curve verdict, no exponent move.
    Infrastructure failure → O-IMPEDIMENT, never evidence.

  inputs:
    proposal: ledger/proposals/IDEA-20261001-b98944.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-c72284.yaml
    decision: ledger/decisions/DEC-20261002-84a9b7.yaml
    worksheet: >-
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-04a6be/revision/TASK-20260929-3907b4/revision-worksheet.yaml
    related:
      - ledger/proposals/IDEA-20260922-2a3771.yaml
      - ledger/proposals/IDEA-20261001-93e740.yaml
      - ledger/proposals/IDEA-20261001-e740ce.yaml
      - ledger/proposals/IDEA-20260926-9c5694.yaml
      - ledger/proposals/IDEA-20260906-a77711.yaml
      - ledger/decisions/DEC-20260924-99ce20.yaml
      - ledger/decisions/DEC-20260928-63addc.yaml
      - ledger/decisions/DEC-20260929-1eded2.yaml
      - knowledge/findings/KN-FIND-47da4e.md
    hold_r_pointer: >-
      EXP-BINSTD-0e0666 (PR #1604) — HOLD-R A2-prime / C1 census; read-only
      pointer; do not edit that contract under this card.
    hold_x5_pointer: >-
      EXP-CERTBIN-a14350 (PR #1565) — Propositions T/Sigma ceiling; read-only.
    off_limits:
      - Editing IDEA-20261001-b98944 / 2a3771 claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Opening IDEA-20260926-89886c / which-algebra NA-2 under this card.
      - Magma / Sage / AUXIN as success path.
      - Amazon Bedrock.
      - Any run at n>=131 or any deployed-curve attack claim.
      - Measuring n=41 or 43 under this card (H-FROB-a5bf86 scope).
      - Treating KN-FIND-47da4e as evidence about linear stable bases.

  controls:
    - name: fixture_B0
      description: >-
        (i) Gauge-fixed orbit encoding restricted to j=0 equals arm (c)
        after variable renaming (clause/XOR structure). (ii) H2 abscissa
        orbit-constancy self-check: Tr(x+a+b/x^2) invariant under x->x^2
        for random nonzero x. (iii) Encoding export structure present for
        arms (a)(b)(c) in normal basis and (c) in polynomial basis.
    - name: ordinary_curve_null
      description: >-
        Ordinary curve over the same field (b not in F_2); same V; Stage-1
        admits the curve; SAT ratios deferred to Stage 2+.
    - name: two_bases_arm_c
      description: Arm (c) exported in normal and polynomial bases.
    - name: ord_lattice_worksheet
      description: >-
        Stage-0 recomputes ord_n(2) and stable dims; must match preregistered
        table including {0,1,162,163} at n=163.

  independent_variables:
    - name: field_degree
      levels: [17, 23, 31]
    - name: base_kind
      levels: [stable_V, window_deg]
    - name: subspace_dim_l
      levels: [8, 9, 10, 11, 12, 15, 16]
    - name: curve_shape
      levels: [koblitz_a1, koblitz_a0, ordinary]
    - name: arity_m
      levels: [2, 3]
    - name: encoding_arm
      levels: [rep_shift, orbit_gauge, plain]

  primary_metrics:
    - name: ord_n_table
      definition: >-
        ord_n(2) at n in {17,23,31,131,163}; must equal
        {8,11,5,130,162} respectively.
    - name: stable_dims_163
      definition: Exact set {0,1,162,163}.
    - name: fixture_B0_pass
      definition: Boolean; all B0 subchecks true, or O-ARTIFACT named.
    - name: h2_selfcheck_pass
      definition: Boolean; abscissa orbit-constancy holds on sampled x.
    - name: outcome_label
      definition: >-
        Exactly one of O-RELABEL-READY / O-ORD / O-ARTIFACT / O-IMPEDIMENT
        for Stages 0-1 (SAT directional labels reserved for Stage 2+).

  secondary_metrics:
    - name: cell_table
      definition: Admissible (n,m,l) cells frozen at Stage 0.
    - name: encoding_export_sizes
      definition: Variable / clause / XOR-row counts per arm export.
    - name: peak_rss_bytes
      definition: Peak RSS beside every timed stage.
    - name: wall_clock_seconds
      definition: Wall clock per stage aggregate.

  seeds_and_replication:
    master_seed: 2026100299
    stage1_h2_samples: 256
    cheapest_discriminator: >-
      Stage 0 ord_163(2) and Stage-1 B0 at n=17 (seconds). SAT median ratios
      at n=17,l=8 are the Stage-2 cheapest discriminator (deferred).
    replication: >-
      Single primary replication under this card; seed and cell table frozen
      in stage0/preregistered-predictions.json.

  budget:
    wall_clock_seconds: 7200
    memory_gb: 4
    maximum_runs: 4
    cpu_note: >-
      Advisory. Stage 0 is zero compute. Stage 1 is setup + structural
      fixture. Freeze scientific sample counts; do not expand to Stage-2 SAT
      census, n>=131, or n in {41,43} under this card.

  stopping_rules:
    - Stage 0 must freeze predictions before any Stage-1 metric is read.
    - Fixture B0 failure → O-ARTIFACT; do not proceed to SAT.
    - Stage-0 ord/lattice mismatch → O-ORD; stop.
    - Timeout / OOM / crash → failed_infrastructure / O-IMPEDIMENT; never negative evidence.
    - After exactly one O-* is decided for Stages 0-1, stop; no Stage-2 under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze invalidates subsequent stages.
    - Claiming SAT ratio outcomes without a Stage-2 amendment is out of scope.
    - Any claim of speedup / exponent / deployed break in RESULTS.md invalidates the scientific read.
    - Citing KN-FIND-47da4e as evidence about linear stable bases is a scope defect.

  success_criterion: >-
    Decidable from the primary metrics before any run. The experiment SUCCEEDS
    as a Stages 0-1 measurement when all of: (1) Stage 0 worksheet present with
    ord_n(2) table matching {17:8,23:11,31:5,131:130,163:162}, stable dims at
    163 equal to {0,1,162,163}, H1-PRIME band >=0.95, cell table, and H2-removed
    note, frozen in stage0/preregistered-predictions.json before Stage 1;
    (2) Fixture B0 passes (gauge j=0 == arm (c); H2 self-check; encoding
    exports present) OR exactly one of O-ARTIFACT / O-IMPEDIMENT / O-ORD is
    named with no SAT-ratio read; (3) exactly one O-* label in RESULTS.md
    decidable from primary metrics alone (O-RELABEL-READY / O-ORD / O-ARTIFACT
    / O-IMPEDIMENT); (4) peak RSS reported beside every timed stage;
    (5) Magma / Sage / AUXIN / Bedrock were not used as the success path.

  falsification_criterion: >-
    Stated before any run, scoped to Stages 0-1 instrumentation. H-BINSTD-c72284
    claim (S1) is falsified by O-ORD (Stage-0 ord/lattice disagrees with the
    preregistered table, in particular any stable dim at n=163 outside
    {0,1,162,163}). Fixture B0 failure is O-ARTIFACT (instrument / soundness
    defect): run void; not directional evidence about H1-PRIME. H1-PRIME
    directional falsification (replicated median ratio < 0.95) requires the
    Stage-2 SAT census and is OUT OF SCOPE for this card's authorized stages;
    a Stage-2 successor amendment carries that criterion. Timeout / crash is
    O-IMPEDIMENT, never evidence.

  success_criteria:
    - Stage 0 worksheet present with ord table, dims_163, H1-PRIME band, cells, H2-removed note.
    - Fixture B0 pass (or O-ARTIFACT/O-IMPEDIMENT/O-ORD named).
    - Exactly one O-* label in RESULTS.md, decidable from primary metrics alone.
    - Memory reported beside time.
    - No Magma/Sage/AUXIN/Bedrock used as success path.

  falsification_criteria:
    - Per H-BINSTD-c72284 falsification_conditions for Stages 0-1 (ord arithmetic, B0).
    - Stage-2 ratio falsifiers deferred to a successor amendment.

  required_artifacts:
    - experiments/EXP-BINSTD-372679/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-372679/stage0/worksheet-note.md
    - experiments/EXP-BINSTD-372679/stage1/fixture-B0.json
    - experiments/EXP-BINSTD-372679/stage1/curves-and-bases.json
    - experiments/EXP-BINSTD-372679/implementation/run.py
    - experiments/EXP-BINSTD-372679/implementation/check.py
    - experiments/EXP-BINSTD-372679/trial-plan-v1.json
    - experiments/EXP-BINSTD-372679/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-372679/RESULTS.md

  stages:
    - id: 0
      name: zero_compute_worksheet
      description: >-
        Recompute ord_n(2) and stable dimensions; freeze H1-PRIME band,
        cell table, withdrawn n^{-m} comparator, H2-removed note.
      compute: none
    - id: 1
      name: setup_and_fixture_B0
      description: >-
        Build fields/curves/stable bases; export encoding structures; run
        fixture B0 and H2 self-check; emit O-RELABEL-READY if ready for SAT.
      compute: setup
    - id: 2
      name: sat_relabelling_census
      description: >-
        DEFERRED. 50 UNSAT + 20 SAT per cell; arms (a)(b)(c); median ratios;
        emit O-RELABEL / O-STRUCTURE / O-TRIPWIRE. Requires protocol amendment
        authorizing Stage 2 and a working SAT binary.
      compute: deferred
      cheapest_valid_discriminator: n=17, l=8, arms (a)(b)(c) on 50 UNSAT

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-372679/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-372679/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-372679/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-372679/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-372679/trial-plan-v1.json
      --run-dir {run_dir}
    check_command: >-
      python3 experiments/EXP-BINSTD-372679/implementation/check.py {run_dir}

  protocol_amendments_path: experiments/EXP-BINSTD-372679/amendments/
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
