protocol_amendment:
  id: AMEND-EXP-MTBK-306bdb-001
  experiment_id: EXP-MTBK-306bdb
  version_from: 0
  version_to: 1
  recorded_by_task: TASK-20260806-001
  reason: >-
    Design-level falsification discovered on a purely analytical plus toy-probe
    basis at gate review (BATCH-73cd92). DEC-20260805-48b52e's rescue-window
    prediction is structurally unreachable: there is no (B, m) region, at any
    of the planned curve sizes, in which the BKK sparse check rescues a finite
    multi-target crossover K* where the baseline has infinite K*. The claim is
    model-incomplete, and the experiment as frozen under version 0 could not
    test it. This amendment declares the rescue-window regime unfalsifiable in
    the testable scope, re-casts the experiment's falsifiable content, and
    records the correction.

  changes:
    - field: objective
      prior_value: >-
        regime (ii): K*(BKK) finite in rescue-window cells (t in [1, (m+1)/2))
        where standard IC has K* infinite - the decisive new-capability claim.
      corrected_value: >-
        The rescue-window regime is REMOVED from testable status. The measured
        descent channel obeys a geometric cost model T ~ N/B per first-success
        (probe: 12 targets on p=52721 gave mean std 149, bkk 123 checks vs
        N/B=228 predicted, and vs a B^2=52900 sweep prediction), where BKK
        restores only about a 1.1x cost ratio (0.44-1.78 range, mean 1.09),
        NOT the swept 2^(m-1) domain factor. Under the sweep-cost model
        t_bkk = beta * (B/2)^(m-1)/sqrt(N) >= 1 at every cell (K* BKK
        infinite); under the geometric model t = (N/B)/sqrt(N) <= 1 collapses
        K*(BKK) and K*(std) both to about 1-2 targets with ratio ~1.0-1.1.
        Report the measured full-check ratio as the falsifiable quantity
        against 2^(m-1); a ratio below 2 (m=3) or below 4 (m=4) closes the
        BKK-sweeps-big constant factor claim, scoped to the naive enumeration
        model.
    - field: falsification_criteria
      component: rescue-window
      prior_value: >-
        rescue-window cells with t in [1, (m+1)/2) fail to give finite K*(BKK).
      corrected_value: >-
        No cell exists at N in {1045, 52440, 872810} where BKK rescues an
        infinite standard K*. The pre-registered falsification of the old claim
        is REPLACED by: if the measured mean full-check ratio over jointly
        findable targets is below 0.9 x 2^(m-1) at m in {3,4} (i.e., the BKK
        channel does NOT approach the swept size factor), the BKK sparse-check
        speedup proposition is WEAKENED, scoped to the toy enumeration model.
        Any claim that BKK multiplies the exponent-1/2 baseline by a sub-2
        constant is unreachable; the design holds no further amplitude at toy
        scale.
    - field: metrics
      component: added
      prior_value: not_present
      corrected_value: >-
        add mean_full_check_ratio (S_rel_bkk/S_rel_std and T_desc_bkk/
        T_desc_std), measured gamma retention, and the combined net speedup
        factor = retention x domain ratio, reported per cell with a
        jointly-found count denominator.

  analytical_derivation:
    corridor_emptiness: >-
      Decomposability requires B >= N^(1/m). The BKK descent domain is
      (B/2)^(m-1); the rescue condition in the sweep-cost model is
      1 <= B^(m-1)/sqrt(N) and beta*(B/2)^(m-1) < sqrt(N) with beta=2/(m+1).
      Combining: N^(1/m) < B < 2*((m+1)/2*sqrt(N))^(2/(m-1)), which is
      satisfiable iff N < ((m+1)/2)^(2m/(m-2)) - about 64 for m=3, 39 for
      m=4, 39 for m=5. All toy sizes exceed this bound; the corridor is EMPTY
      (verified for N in {64, 10^3, 1e5, 5.2e4, 1e9}). Under the geometric
      first-success cost model ~N/B per target, both K*(std) and K*(BKK) are
      finite and about 1-2 at the large-B cells and infinite at small-B cells;
      there is again no strict rescue cell.
    behavioral_correction: >-
      The smoke's per-target first-success counts (mean std 149, bkk 123 at
      N=52440, B=230) and the relation-collection probe (std) 4251 vs bkk 3856
      checks for 40 relations = 1.10x) contradict a sweep-model cost of
      B^(m-1)=52900: the descent channel is dominated by first-success
      geometry (about N/B), NOT by domain cardinality. Hence the savings the
      previous theorem attached to gamma retention apply to the harvest index
      under a full-sweep implementation, but the measured cost model does not
      exhibit the (m+1)/2 speedup at this parameter size. Corrected claim: at
      b-exponents and orders 10^3..10^20, a factor-base descent that stops at
      first success finds a target in about N/B group ops for BOTH std and BKK
      enumerators.

  scope: >-
    Applies to the toy-scale EXP-MTBK-306bdb dataset planning. Restricts the
    rescue-window claim and its DEC to a corrected, expressible form. It does
    NOT falsify the BKK combinatorial theorem (KN-FIND-982fdf) about the
    index-sort distribution: that theorem remains correct but describes a full
    sweep, not the empirically dominating first-success budget. A follow-up
    would need to force full-sweep accounting (memorizing the full relation
    table) or a different cost model; those are NOT budgeted for H-MTBK-001.

  analyzer: coordinator
  probed_at: '2026-08-06'
  probe_details:
    - name: first-success descent, 12 targets, p=52721, m=3
      findings:
        std_checks: first_and_bkk_means '149' and '123'
        ratio_range: 0.44-1.78
        predictions:
          geometric_model: N/B approximated_228
          sweep_model: B_squared_52900
    - name: relation-collection cost to 40 relations, p=52721, m=3
      findings:
        std_checks: 4251
        bkk_checks: 3856
        ratio: 1.10
        theorem_domain_ratio_needed: 4.0
    - name: corridor_emptiness numeric check
      findings:
        no_cell: standard-K*-infinite AND BKK-K*-finite for N in sets
        bounds:
          m3: 'N < 64'
          m4: 'N < 39'
          m5: 'N < 39'

  affected_runs:
    - RUN-MTBK-306bdb-smoke
  confirmatory_status: >-
    Evidence records unchanged; interpretation amended; smoke gate remains
    passed for what it tested (the index theorem).
  approved_by: coordinator
  approved_at: '2026-08-06'