findings:
  - id: SMOKE-FIND-001
    severity: blocking_for_full_run
    statement: >-
      The BKK pre-test as modeled (require >= m-1 indices below the half-way
      mark) does not change the number of full group-add checks: S_rel
      full_checks identical (45333 both), T_desc identical (100002 both).
      The model does not reproduce the (m+1)/2 factor of KN-FIND-c7d31e.
    mechanism: >-
      The theorem's factor applies to the sparse membership-test enumeration
      itself (typed index subsets, KN-FIND-c7d31e), which the smoke's simple
      pre-test does not implement; pruned scans only shift the scan count,
      not the add count.
  - id: SMOKE-FIND-002
    severity: metric_honesty
    statement: >-
      Counting full group-add checks is the correct unit (the factor applies
      there), but the BKK check must be reimplemented as the actual
      group-law-index subset enumeration from EXP-BKK-001/EXP-BKKMV-002
      before any crossover measurement is meaningful.
  - id: SMOKE-FIND-003
    severity: expected_scale_behavior
    statement: >-
      T_desc budget exhaustion at this size (F=230, N=52440) matches
      EXP-MTIC-001's regime where descent >= sqrt(N); K* infinite in this
      cell, so the smoke cell is outside the rescue window. Rescue-window
      cells require the b exponent > 0.5 cells or larger F.
actions_required_before_full_run:
  - Reimplement the BKK sparse check by porting the typed-index-subset
    enumeration from EXP-BKKMV-002's bkk1/bkkmv2 sage code into the Python
    driver.
  - Add a unit test asserting factor >= (m+1)/2 on full_checks at m=3 on the
    smoke curve before dataset execution.
  - Rerun the smoke; the gate passes when bkk_full_checks < std_full_checks
    by factor >= 2/(m+1) = 0.5 at m=3.
