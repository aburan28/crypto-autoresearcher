execution_report:
  experiment_id: EXP-MTBK-306bdb
  hypothesis_id: H-MTBK-001
  status: completed
  validity:
    status: valid
    reason: >-
      Full 30-cell frozen-grid harness run completed (both with and without rho
      baseline control) and produced measurement-only records. No evidence supports
      a breakthrough under the current toy protocol.
  run_tally:
    completed_valid: 7
    completed_invalid: 0
    failed_infrastructure: 0
    failed_implementation: 0
    resource_exhaustion: 0
    cancelled_by_budget: 0
    total_terminal_records: 7
    planned_runs: 7
    note: >-
      The canonical full protocol run is RUN-MTBK-306bdb-full-rho; a parallel
      full-norho run is preserved as a control variant.
  runs:
    completed:
      - id: RUN-MTBK-306bdb-full-rho
        status: completed_valid
        outcome: >-
          30 cells (5 seeds × 3 m values × 2 b-exponent values) completed.
          K*_std and K*_bkk were finite and identical for every cell (K*=1),
          median ratio samples = 1.0 for all 30 cells.
      - id: RUN-MTBK-306bdb-full-norho
        status: completed_valid
        outcome: >-
          Identical structure to full-rho except rho baseline skipped; identical
          wall-clock and tuple-check scaling profile, confirming harness stability.
  exploratory_runs:
    status: completed
    runs:
      - id: RUN-MTBK-306bdb-cap-sweep4
        note: >-
          std cap = 50, bkk cap = 20000, seed=1, m in {3,4,5}, b in {0.6,0.7}.
          Observed K* std/bkk differences at (m,b)=(3,0.6) and (3,0.7) with
          K*_bkk=1 and K*_std=2.
      - id: RUN-MTBK-306bdb-cap-sweep5
        note: >-
          std cap = 1, bkk cap = 20000, seeds 1..5, m=3,b in {0.6,0.7}.
          One cell hit K*_std=inf while K*_bkk=1: seed=4,m=3,b=0.6.
      - id: RUN-MTBK-306bdb-cap-sweep6
        note: >-
          std cap = 1, bkk cap = 20000, seeds 1..5, m in {4,5}, b in {0.6,0.7}.
          20 cells total; multiple cells had K*_std=inf with K*_bkk=1.
      - id: RUN-MTBK-306bdb-cap-sweep7
        note: >-
          std cap = 1, bkk cap = 20000, seeds 1..5, m in {3,4,5}, b in {0.6,0.7}.
          All 30 cells had K*_bkk < K*_std, with 4 cells where K*_std=inf.
      - id: EXPERIMENT-16-seed-sweep-mtb3-5-target50-200seeds
        note: >-
          Direct in-memory rerun (16-bit fixed instances) with seeds 1..200,
          m∈{3,4,5}, b∈{0.6,0.7}, target_count=50, check caps 20k.
          Checked cells: 1200. Mismatches: 0. All observed K*_pairs were (1,1).
      - id: EXPERIMENT-16-seed-sweep-mtb6-8-target20-100seeds
        note: >-
          Direct in-memory rerun (16-bit fixed instances) with seeds 1..100,
          m∈{6,7,8}, b∈{0.6,0.7}, target_count=20, check caps 20k.
          Checked cells: 600. Mismatches: 0. All observed K*_pairs were (1,1).
      - id: EXPERIMENT-16-seed-distribution-50seeds
        note: >-
          Distribution audit (16-bit, seeds 1..50, m∈{3,4,5}, b∈{0.6,0.7},
          target_count=50) produced Counter K* pairs with a single entry:
          {(1,1): 300}. Mismatches: 0.
      - id: EXPERIMENT-16-seed-sweep-b03-m3-200seeds
        note: >-
          Out-of-protocol sensitivity check: b=0.3, m=3, seeds 1..200, 16-bit,
          target_count=50. Checked cells: 200. Mismatches: 171.
          Distribution included both finite and inf values (e.g., kstd counters: 1:40,
          2:40, ... and kbkk counters: inf:42, etc.), indicating protocol sensitivity to
          sparse factor-base size.
      - id: RUN-MTBK-16-b30-seed1-5-norho
        note: >-
          Non-canonical sensitivity check over {b=0.3,0.6}, seeds 1..5, m∈{3,4,5},
          16-bit, rho skipped. b=0.3 produced 11/15 cells with K*_bkk > K*_std
          (and 0 cases where std was worse); b=0.6 produced 15/15 equal K* pairs.
      - id: RUN-MTBK-16-b30-seed1-30-b03-only-norho
        note: >-
          Out-of-protocol exploratory sweep for b=0.3, seeds 1..30, m∈{3,4,5},
          16-bit, rho skipped. 90 cells completed; 72 had K*_bkk > K*_std and 17 had
          equality (finite ratio samples: 85). Median finite K* ratio was 3.0.
      - id: RUN-MTBK-16-b30-seed1-30-b06-only-norho
        note: >-
          Out-of-protocol exploratory sweep for b=0.6, seeds 1..30, m∈{3,4,5},
          16-bit, rho skipped. 90 cells completed; all K* pairs equal (ratio 1.0).
      - id: RUN-MTBK-20-b30-seed1-5-b03-only-norho
        note: >-
          20-bit exploratory sweep for b=0.3, seeds 1..5, m∈{3,4,5}, rho skipped.
          15 cells completed; 14 had K*_bkk > K*_std and 1 had inf-related edge case.
      - id: RUN-MTBK-20-b30-seed1-5-b06-only-norho
        note: >-
          20-bit control sweep for b=0.6, seeds 1..5, m∈{3,4,5}, rho skipped.
          15 cells completed; all K* pairs equal (ratio 1.0).
  frozen:
