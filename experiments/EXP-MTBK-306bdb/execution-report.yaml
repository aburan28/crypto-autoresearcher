      mean_group_ops: 410.34
      max_group_ops: 1542
    smoke_gate_reused: passed
  primary_metrics_full_rho:
    run_id: RUN-MTBK-306bdb-full-rho
    wall_clock_seconds: 4.756058
    cpu_seconds: 4.790397
    memory_mb: 65.828125
    S_rel_std_full_checks: 22.84
    S_rel_bkk_full_checks: 42.52
    T_desc_std_full_checks: 24.3
    T_desc_bkk_full_checks: 51.72
    ratio_median: 1.0
    ratio_samples: 30
    cells_total: 30
    cells_ok: 30
  theorem_gate_observations:
    trials_per_cell: 20000
    passing_cells: 25
    failing_cells: 5
    note: >-
      Theorem-index trial failures occurred in five cells:
      (seed,m,b) = (2,3,0.6), (3,5,0.6), (4,5,0.6), (5,3,0.6), (5,5,0.6).
      Remaining 25 cells passed the gate with empirical gamma >= 0.5*(m+1)/2^m.
  breakthrough_assessment:
    observed_gain: none
    reason: >-
      Measured first-success target index K* was 1 in all cells, so ratio of K*
      channels is 1.0 and does not indicate a measurable speedup regime shift.
      If the target is to observe regime transition evidence, this requires
      tighter/deeper targets or altered cap policy.
      Additional sweeps at b=0.3 (both 16-bit and limited 20-bit) consistently
      showed K*_bkk >= K*_std, with occasional inf/edge cases; this is the inverse
      of a speedup and does not qualify as a breakthrough signal.
    status: inconclusive
