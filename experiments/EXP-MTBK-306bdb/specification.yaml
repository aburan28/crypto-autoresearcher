experiment:
  id: EXP-MTBK-306bdb
  hypothesis_id: H-MTBK-001
  goal_id: GOAL-ECDLP-001
  source_proposal: IDEA-20260805-0cd03f
  title: >-
    Multi-target index calculus with the BKK sparse-check speedup: measured
    crossover K*(BKK) = ceil(s*beta/(1-t*beta)) versus the no-BKK baseline,
    with beta = 2/(m+1), and the rescue-window prediction t in [1, (m+1)/2)
  status: draft
  version: 1
  claim_tier: toy
  objective: >-
    Measure, on the same toy instances used by EXP-MTIC-001, the relation
    collection cost S_rel and per-target descent cost T_desc with the BKK
    sparse-check speedup enabled, and with the identical code path with the
    BKK check disabled (null control). Compute the measured multi-target
    crossover K* per instance under both conditions and compare
    K*(BKK)/K*(std) against the theory prediction R_theory = beta*(1-t)/(1-t*beta)
    with beta = 2/(m+1). Decide which regime holds at toy scale:
    (i) R_measured ~ R_theory: algebraic model confirmed;
    (ii) K*(BKK) finite in rescue-window cells (t in [1, (m+1)/2)) where
    standard IC has K* infinite: the decisive new-capability claim; or
    (iii) R_measured deviates from R_theory by more than 25% relative:
    interaction, escalate, no promotion.
  heuristic_assumptions: []
  inputs:
    instances:
      description: >-
        5 toy prime-field short-Weierstrass curves y^2 = x^3 + a*x + b,
        p ~ 1000 (F_1009 family), prime-order subgroup N in (p-200, p+200).
        Deterministic seeds; frozen by SHA-256 in frozen-instances.yaml.
    factor_bases:
      description: >-
        F = {P : x(P) < t} with |F| ~ B for b in {0.6, 0.7}: B = round(p^b),
        t = smallest threshold attaining |F| >= B. Frozen.
    targets:
      description: >-
        50 per (curve, b) for T_desc measurement, matched rho baseline on the
        same targets; scalars recorded.
  factors:
    curves: 5
    curve_seed_set: [1, 2, 3, 4, 5]
    field_bits: [16]
    b: [0.6, 0.7]
    m: [3, 4, 5]
    min_prime_order_bits: 14
    target_count: 50
    target_streams: [desc, harv]
  controls:
    - null_no_bkk: >-
        bit-exact no-BKK code path (single flag) on the same instances;
        yields S_rel_std, T_desc_std, K*(std). Null object identical in shape.
    - non_interference: >-
        factor-base log table target-independence; two disjoint target batches
        must produce identical collected logs (adopted from EXP-MTIC-001).
    - rho_baseline: matched per-target Pollard on the same targets.
    - smoke: >-
        tiny m=3 run held to completion before the full dataset, reviewed
        before extension
  metrics:
    - S_rel_bkk_full_checks
    - S_rel_std_full_checks
    - T_desc_bkk_full_checks
    - T_desc_std_full_checks
    - K_star_bkk
    - K_star_std
    - ratio_measured
    - wall_clock_seconds
    - memory_mb
  budget:
    wall_clock_seconds: 600
    memory_gb: 8
    maximum_runs: 1
  stopping_rules:
    - description: >-
        any cell exceeding expected median cost by >10x or with per-target check
        cap exhaustion: stop target/measurements, mark timed-out, do not synthesize
        into finite K*.
  required_artifacts:
    - specification.yaml
    - frozen-instances.yaml
    - implementation.md
    - execution-report.yaml per config
    - raw JSON per config (attempt timings, relations, failure modes)
    - stats table (K*(std), K*(BKK), ratio per cell)
    - analysis.md preregistered comparison to R_theory
  falsification_criteria:
    - description: >-
        median measured ratio deviates from R_theory by more than 25% relative
    - description: >-
        rescue-window cells with t in [1, (m+1)/2) fail to give finite K*(BKK)
    - description: >-
        S_rel_BKK/S_rel_std < beta or T_desc_BKK/T_desc_std < beta (factor not
        reached in both channels)
  success_criterion: >-
    Criterion A (algebraic model): median measured K*(BKK)/K*(std) within 25%
    relative of R_theory = beta*(1-t)/(1-t*beta) across completed cells, with
    beta = 2/(m+1). Criterion B (per-channel): measured full-check ratio
    S_rel_BKK/S_rel_std and T_desc_BKK/T_desc_std within 25% of the sweep
    factor, in both channels. Criterion C (rescue window, v0 prediction):
    cells with beta*(B/2)^(m-1) < sqrt(N) and B^(m-1) >= sqrt(N) give finite
    K*(BKK) where the standard run is infinite. AMEND-001 revises scope: the
    v1 protocol keeps A/B and drops C (structurally empty at toy sizes); the
    falsifiable rescue quantity is re-cast as the measured full-check ratio
    against 2^(m-1).
  review_gate:
    review_required: true
    review_roles: [validator, reviewer]
    preconditions:
      - description: >-
          smoke gate passes: BKK full-checks factor >= 2/(m+1) at m=3 on the
          smoke curve, before full dataset execution
  status_history:
    - event: drafted
      at: '2026-08-05'
      by: coordinator
      note: >-
        Contract transcribed from TASK-20260805-007; EXP id EXP-MTBK-306bdb.
        Smoke run (RUN-MTBK-306bdb-smoke) surfaced SMOKE-FIND-001/002/003;
        dataset held pending BKK check reimplementation.
    - event: smoke_gate_blocked
      at: '2026-08-05'
      by: coordinator
      note: >-
        DEC-20260805-48b52e: full dataset not approved under the proxy BKK
        model. BATCH-124 reimplements the typed-index-subset BKK enumeration.
    - event: smoke_gate_passed
      at: '2026-08-05'
      by: coordinator
      note: >-
        v2 smoke driver implements the correct BKK enumeration and verifies the
        theorem's exact combinatorial content (gamma 0.49997 vs 0.5; speedup
        1.99988 vs 2.0 at m=3, 200k trials). SMOKE-FIND-004 corrected the v1
        proxy gate. Dataset blocked on design-honesty item SMOKE-FIND-003
        (rescue-window cells require b >= 0.6 or larger N) and Executor full
        run dispatch.
    - event: status_draft_to_review_required
      at: '2026-08-05'
      by: coordinator
      note: >-
        DEC-20260805-d4b182: smoke gate passed; proceed to Executor full
        dataset once the rescue-window design note is recorded in an amendment.
    - event: amendment_approved
      at: '2026-08-06'
      by: coordinator
      note: >-
        SMOKE-FIND-003 closure requirement recorded: full dataset now uses
        b in {0.6, 0.7}, five fixed 16-bit seeds {1..5}, and both harvest and
        descent target batches per curve.
