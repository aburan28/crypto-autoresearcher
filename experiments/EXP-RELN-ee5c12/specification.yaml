    "methods": {
      "stage0": "For every selected 8-bit base and m=1,2,3 enumerate each size-m multiset once in nondecreasing index order. Compute Ctot=binom(L+m-1,m), exact c(R), support and energy. Verify sum_R c=Ctot, sum_M 1/c(sumM)=support, sum_M c(sumM)=sum_R c^2, and #R with c=k=(Ctot/k)*P_M(cM=k). S=Ctot means a deterministic census, not random draws. m1 has c=1 on W. Use independent point addition and integer/rational arithmetic.",
      "stage1": "Uniform multiset sampler: bijection i1<=...<=im in0..L-1 to strictly increasing j_t=i_t+t-1 in0..L+m-2; uniform combinatorial rank from0..Ctot-1 and exact unrank. Exhaustively verify bijection at L<=8,m<=4 and compare all oracle answers with brute enumeration at 8/10-bit toy cells. Sorting iid indices is a deliberately biased negative-control sampler, never the primary sampler.",
      "counting_oracle": "Split every sorted global multiset at a=ceil(m/2), b=floor(m/2). Enumerate left a-multisets into full EC-point-key table carrying counts by maximum index; enumerate right b-multisets and query left sum R-sum(right) with max(left)<=min(right). This boundary condition gives exactly one decomposition per global multiset, including repeats. m2 is singleton/singleton, m3 pair/singleton, m4 pair/pair. O has its own full-point key. Precompute prefix counts over sorted maximum indices, charge sorting/build/storage; independently reconstruct sampled counted pairs and verify no x-only merging.",
      "stage2": "All 32 toy cells and anchor: exhaustive full multiset census for every 20 random bases and every q arm, both seeds; hash c(R) tables before estimator streams are generated. Stream or external-sort counts within memory; largest 16-bit B retained. Full census is only toy ground truth and its complete cost is reported.",
      "stage3": "For each base draw S=400 independent uniform multisets with replacement. R=sumM; record cM>=1, Z=(Ctot/N)/cM, Y=Ctot*cM. Their sample means estimate coverage and energy. Draw 400 independent uniform targets from full group for T=1[c(R)>0] using identical exact oracle. Record every call, failure, multiplicity and stage cost. Paired abstract cyclic arm uses checker-derived logs with same multiset/target indices; logs do not enter measured curve oracle.",
      "extension": "Run the same 20 bases, S400, two seeds and exact counting algorithm in all 18 extension cells, without a full B^m census. Every sampled multiset sum and oracle boundary/completeness algorithm must pass toy certification. Store oracle table hashes and counts/certificates; no claim of exact extension coverage or bias ground truth. AP q arm applies at extension too with its own charged oracle; process/memory checkpoint is incomplete, never a source falsification.",
      "zero_fibre": "Primary statistics include R=O. For m2, c(O)=B and planted mass B/Ctot exactly; independently verify. Report zero and nonzero strata and recombine by actual weights. Poisson(mu) remains the literal M3 target, mu=Ctot/N; exact nonzero runs-law size bias plus the O atom is an additional diagnostic, not a replacement prediction.",
      "statistics": "Toy per-base exact Var(Z)=(1/Ctot)*sum_R c(R)*(Ctot/(N*c(R))-coverage)^2 over c>0, and Var(T)=p(1-p). SE of S-sample mean=sqrt(exact variance/S). Report each base/seed z and pooled mean z using independent base contributions. M2 within3SE; replicated bias means same-signed |z|>3 in both seeds for cell aggregate, with per-base outcomes retained. Zero SE demands exact equality. M3 pool equal400 samples per base using mixture of each base Poisson(mu); tail c>=3 means cM>=3, hence cM-1>=2. Merge high count bins downward to expected>=5; >=3 bins needed; chi-square alpha.01 each seed. m3 >2x Poisson tail in both seeds is structure. Report exact weighted finite-fibre law separately.",
      "cost_comparison": "For each comparable cost coordinate j, ratio_j=Var(T)*mean_cost_T,j/(Var(Z)*mean_cost_Z,j), amortizing each setup over exactly S400 and retaining cold/setup/steady components. Also oracle-call-only ratio labelled idealized. M4 compare each ratio with [2/mu^2,8/mu^2] for mu<=.2; no hidden choice of favorable coordinate or sum across units. ratio<1 refutes that coordinate cost model; zero cost or variance yields explicit undefined/zero/infinite cases. Compare empirical sample variance as calibration, exact variance is primary in toy. Extension lacks exact variance and reports finite-sample intervals only.",
      "ap": "q in{0,1/4,1/2,3/4,1}; t=round_half_up(q*B). Retain B-t classes chosen uniformly without replacement from AP classes{x([j]P):1<=j<=B}, then add t classes uniformly from the complement of the retained set in ALL n classes. Thus q1 is exactly uniform random B-subset and q0 exact AP. Do not forbid reselecting removed AP classes. Use paired random streams across q; monotonicity is a source prediction, not a sampler identity. Report every q mean and paired difference; replicated negative differences beyond3SE count against monotonicity after sampler controls pass.",
      "ap_tests": "M5 energy ratio AP/random computed per cell from exact toy census; q0 threshold>=10 for every B>=8. q energy means should decrease, with any increase >3 paired SE across both seeds a replicated violation; q1 vs random within3SE. Compare coverage too. These quantitative predictions may fail despite a correct sampler. Extension uses estimated energy and uncertainty, no exact verdict when intervals overlap.",
      "cost_accounting": "Keep coordinatewise vectors: EC additions/doublings, base-field mul/add/inversion, integer/rational arithmetic and operand bits, equality/table lookups, random draws, oracle calls, CPU/wall,RSS,data/storage/I/O. Charge fixture/base/lookup construction, failed sampling, exact enumeration, spectral/probability work, all certificates and checks. Distinguish algorithm-only and full audit totals; no unexplained sum of unlike units or free cached ground truth. Report denominator-zero cases explicitly.",
      "pareto": "For one fixed public challenge Q=[s]P per distinct selected p, s=SHA256(EXP_ID|baseline|p) mod(N-1)+1 held checker-only: ordinary BSGS with b=ceil(sqrtN), fixed-width full point keys and independently verified solution; matched negation-quotient rho with32 public increment pairs generated by the experiment counter RNG, x-coordinate hash partition, canonical +/- point and coefficient sign updates, Floyd cycle detection,16 fixed restart seeds and at most N+1 point-state transitions per restart. Record every failed/degenerate collision and all group calls/table/storage; a failed finite rho attempt is baseline_incomplete, never evidence of attack advantage. The0.886sqrtN reference is modeled context, not forced measured equality. No reuse of secret s by solvers.",
      "extension_statistics": "For extension S400 estimates report sample variance and distribution-free simultaneous95% Hoeffding intervals using Z in[Ctot/(N*Ctot),Ctot/N] and Y in[Ctot,Ctot²], with union bound over declared cells/bases/seeds/q; these conservative bounds may be uninformative. No exact M2 bias claim or exact M4 variance verdict without toy truth.",
