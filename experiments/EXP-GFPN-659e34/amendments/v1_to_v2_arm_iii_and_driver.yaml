    M-2_silent_loss_paths:
      defect: >-
        Object A of TASK-20260923-404bf9, at p' = 11 on curve C2 with
        N = 1400, found 13 verified decompositions against N f = 11.29, with
        a 99% interval of [4, 21]. The exhaustive test recovered 295 of 324
        decomposable x-values. All 29 misses were SILENT:
        - 22 were positive-dimensional 2-sum systems, recorded as measured
          non-decompositions (pdp_cell.py lines 380-382 of EXP-GFPN-05ff43);
        - 7 were degenerate msolve parametrisations, accepted without
          substitution (symmetrize.py lines 526-546).
        Source: review-report.yaml lines 465-514 and OOS-6 at lines 873-885.
      requirement_outcome_classes: >-
        Every attempt ends in exactly one class: ok, no_solution, timeout,
        memory_exhausted, crashed, positive_dimensional,
        degenerate_parametrisation, or not_attempted.
        - positive_dimensional and degenerate_parametrisation are NEVER
          counted as non-decompositions.
        - Both are counted per cell and excluded from the rate numerator AND
          denominator. They are reported beside the rate with their count, so
          that the rate is honest about what was decided.
        - Every parsed solution is substituted back into the descended system
          before lifting.
        This is the same rule as AMD-EXP-GFPN-05ff43-20260923-reanchor-arm-iii
        DC-6 R-5.
      requirement_flagged_attempt_resolution: >-
        Every rate-ladder attempt that ends positive_dimensional or
        degenerate_parametrisation is resolved by an independent
        decomposability check on that X_r. The check is a meet-in-the-middle
        of signed 2-sums of F, using code sharing nothing with the solver
        path. Its verdict is recorded beside the attempt. If X_r is
        decomposable, the attempt is also recorded as a decomposition the
        solver path missed. Flagged attempts are expected to be rare at
        p' >= 2^10 (red team extrapolation, review-report.yaml lines 515-524),
        so the check is affordable. If they are not rare, that is itself a
        finding and is reported.
      control_completeness_object_A: >-
        BLOCKING, BEFORE THE RATE LADDER. Run the object-A protocol on the
        v2 driver:
        - p' = 11, curve C2, y^2 = x(x^2 + 2x + 10z) over F_11[z]/(z^5 - 2);
        - the producer's seeded target stream, N = 1400;
        - the 324-target completeness set;
        - the exact truth set of the red team's independent PARI/GP
          enumeration
          (coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-404bf9/scratch/objA/,
          review-report.yaml lines 415-446).
        PASS requires both:
        (i) the verified count on the 1400 targets lies inside [4, 21];
        (ii) every one of the 324 decomposable targets is recovered, or
             carries a flagged class whose flagged-attempt resolution
             confirms it. Zero silent misses.
        A failure is an instrument defect. It returns to the Executor and is
        never a statement about the rate. The red team's harness deviations
        (review-report.yaml lines 447-463) are declared again if reused.
      what_M_2_does_not_decide: >-
        Red team OOS-5 notes that drawing targets from the largest-prime
        subgroup can concentrate decomposable points pathologically at small
        p' (review-report.yaml lines 861-872). A check against an exact count
        at one rate-ladder prime needs an enumeration of signed 4-sums, about
        10^11 at p' ~ 2^10. That exceeds this draft's specification and is
        flagged as F-3, not amended.

    M-3_cost_unit:
      ruling: >-
        The DC-4 declaration of AMD-EXP-GFPN-05ff43-20260923-reanchor-arm-iii
        applies to fp_operations_per_attempt:
        - no F_{p'} operation counter exists for msolve;
        - executed instructions are recorded (perf counters, or callgrind
          where affordable), labelled as a measured work proxy and never
          converted;
        - the nnz and reduction proxies are reported as a bracket that is not
          a bound;
        - construction, the scalar multiplication [r]X and lifting are charged
          identically in every arm, with raw counts reported;
        - F_q inversion is priced at 2.57 F_q mul
          (inputs/PORNIN-2022-274-ECGFP5/paper_fulltext.md lines 522-523),
          replacing 150.
        So the frozen work formula's C_pdp4 branch is unavailable. Its
        fallback branch, [D_4^2, 4 D_4^3] (line 274), is subject to F-1.
      tail_check_reading: >-
        The tail check "Highest fp_operations_per_attempt on the S4 arm: if
        the projected work_bits exceeds 100 ..." (lines 333-337) depends on
        projected_work. It is not_applicable wherever projected_work is null,
        and the record says so.

  # ---------------------------------------------------------------------------
  flagged_for_a_future_decision_and_NOT_amended_here:
    F-1_D4_undefined_on_random_X_r: >-
      FOUND BY THIS DESIGN ACT, and not named in DC-8. RECORDED AND NOT
      AMENDED, because the repair is hypothesis-level.
      - The cost ladder measures "the FGLM ideal degree D_4 per arm ... on 20
        random X_r per cell without requiring success" (specification lines
        80-85, 141).
      - The descended n = 5, m = 4 system is 5 equations in 4 unknowns, so it
        is overdetermined. A random X_r decomposes with probability about
        1/(24 p') (H-GFPN-3366ea lines 243-246, the rate heuristic's own
        count). Otherwise its ideal is the unit ideal, and there is no finite
        nonzero degree.
      - EXP-GFPN-05ff43's m = 4 random-target cells recorded exactly this:
        0/20 decompositions and D undefined (implementation.md lines 251-255;
        EV-GFPN-fc5950 strength_basis).
      CONSEQUENCE, as frozen: the following cannot be evaluated on the
      intended object; they would be emitted not_applicable or fire
      vacuously:
      - ideal_degree_D4_per_arm;
      - D4_variation_across_ladder;
      - heur_dflat4_pass;
      - F2 (DFLAT4), F3 ("D_4 on the S4 arm not at least 2^3 below the raw
        arm") and F4 (matched D_4);
      - the D_4-band fallback of projected_work (lines 272-275, 320-323).
      Under the frozen modeled_note, projected_work then stays null for
      every arm, and goal criterion C2's work figure is not produced.
      WHY NOT REPAIRED HERE: HEUR-GFPN-DFLAT4's formal statement names "the
      FGLM ideal degree D_4,A of the descended (n-1)-point system"
      (H-GFPN-3366ea lines 206-211). An observable that is defined on random
      targets, such as the degree of a square 4-equation subsystem, is a
      different object. Substituting it by experiment amendment would
      restate the heuristic by another route, which is the rewrite the
      precedent AMD-EXP-SEMBIN-4fa22c-20260921-lemma4 warns against.
      OPTIONS for the approval decision, either of which it can take without
      re-deriving:
      (a) Record a correction on H-GFPN-3366ea that restates
          HEUR-GFPN-DFLAT4's object, then approve a further amendment that
          defines D_4 on it. Under any square-subsystem reading, the frozen
          absolute prediction "raw <= 8^4 = 2^12" (line 269) carries the same
          m!-type mis-anchor as EXP-GFPN-05ff43's K7:
          - S4 ~ 8^4 = 2^12, the Bezout number of total degree 8 in 4
            variables;
          - raw ~ 4! 8^4 ~ 2^16.6, the box mixed volume.
          The ratio threshold 2^3 in F3 survives, since 4! = 2^4.6 >= 2^3.
          The Coordinator's derivation, unreviewed.
      (b) Run as frozen with every D_4-dependent output emitted
          not_applicable, with reason d4_undefined_on_random_targets, and
          projected_work null. The run still yields:
          - |F| and projected_queries_bits (arithmetic);
          - the decomposition rate and HEUR-GFPN-RATE4;
          - per-attempt instruction counts;
          - verified SDHP answers.
    F-2_shape_anchor_trivial_pass: >-
      jv_system_shape_anchor (lines 182-189) requires "reduced degrevlex
      Groebner basis has <= 329 generators". On a random X_r the reduced basis
      is {1}, so the bound passes vacuously. JV's 329 counts bases built
      during the computation (JV paper_fulltext.md lines 711-713). The
      approval decision may strengthen this control additively. One way is
      to adopt the system-plus-trace identity control of
      AMD-EXP-GFPN-05ff43-20260923-reanchor-arm-iii rulings.DC-5 at a prime
      where msolve -g 1 does not crash; the 17-bit p' = 65551 crashes
      (CORR-20260923-1e2e67). Not amended here.
    F-3_subgroup_concentration: >-
      Red team OOS-5 (review-report.yaml lines 861-872). No affordable
      exact-count check at a rate-ladder prime is specified. Flagged.
    F-4_genuine_m4_quotient_arm_absent: >-
      The F_p-rational (Z/2)^3 x| S_4 quotient on the rescaled base exists at
      n = 5, because the degree is odd (AMD-EXP-GFPN-05ff43-20260923-reanchor-arm-iii
      DC-3). It is NOT added here. It waits until that amendment's blocking
      fixtures F-1..F-3 pass. Its SDHP use would also need relations modulo
      T handled in the odd-order subgroup. Until then H-GFPN-3366ea's torsion
      prediction is untested by this contract.

