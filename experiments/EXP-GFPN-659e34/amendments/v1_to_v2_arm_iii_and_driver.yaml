        It is cheap, and it replicates K5 at m = 4 in a second experiment.
      ruling_rate_ladder: >-
        DROPPED from the rate ladder. Its rate on the phi-base is a property
        of the norm construction, not of the (Z/2)^3 x| S_4 mechanism.
        Measuring it would cost about 8x S4's attempts: under the frozen cap
