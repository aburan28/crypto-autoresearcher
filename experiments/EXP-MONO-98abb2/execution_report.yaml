  unexpected_observation_disclosed:
    summary: >-
      On the found curve h_+ = h_- = 1 exactly. Algebraically, D_sum =
      h_+*n_- + h_-*n_+ reduces to n_+ + n_- at h_+=h_-=1, and D_prod =
      h_+*h_-*(n_+ + n_-) reduces to 1*(n_+ + n_-) = n_+ + n_- at
      h_+=h_-=1 as well -- the two formulas are IDENTICAL on the diagonal
      h_+ = h_- in {0, 1} (more generally D_sum = D_prod iff, at h_+=h_-=h,
      h = h^2, i.e. h in {0,1}), independent of n_+, n_-. Consequently this
      run's exact match against D_sum does NOT, by itself, exclude D_prod
      on this specific curve, contrary to the specification's own stated
      expectation for M3 ("Predicted to differ from 0 whenever h_+, h_- >=
      1 and n_+, n_- > 0"), which holds off the h_+=h_-=1 diagonal but not
      on it. This is reported as a plain arithmetic fact, not an
      interpretation of hypothesis status. See implementation.md for the
      full derivation.
    not_a_protocol_deviation: >-
      This is a property of the two named formulas at the specific
      (h_+, h_-) the fixed, unbiased search order happened to reach first,
      not a change to the search order, range, or comparison logic.

