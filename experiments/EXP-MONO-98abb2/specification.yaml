experiment:
  id: EXP-MONO-98abb2
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-09-04'
  hypothesis_id: H-MONO-1297d7
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  coordinator_approval_rationale: >-
    APPROVED. This is DEC-20260904-e9df3f's own named high-priority
    next_action: the first test of the FULL bivariate closed form (both
    h_+ and h_- nonzero simultaneously), completing the picture
    KN-FIND-edd62c left open. Cheap (same pipeline, seconds of compute),
    pre-registers a named interaction-shaped rival before any run, and
    independently re-verifies (rather than assumes) a candidate curve an
    independent reviewer already identified.

  title: >-
    Does the full bivariate D3 closed form (D = h_+ n_- + h_- n_+) survive
    exactly on a curve with BOTH h_+ >= 1 and h_- >= 1, excluding a named
    multiplicative-interaction rival?

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection.
    - Not an ECDLP cost, runtime, exponent, or cryptographic-scale claim.
    - >-
      Not a re-run of EXP-MONO-4e6faa or EXP-MONO-ee06e2 (both stand on
      their own) -- this experiment specifically targets the JOINT
      (h_+>=1, h_->=1) regime neither of those curves could test.
    - Not a test of the non-split strata.
    - Not a re-scoping of H-MONO-93bc4d's own already-closed collision-rate formula.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: whether, on a specific found curve with h_+>=1 and h_->=1
      simultaneously, the additive closed-form prediction matches an
      exhaustive census exactly while a named multiplicative rival does
      not. A match completes (not merely extends) KN-FIND-edd62c's own
      disclosed scope gap; any other outcome is reported exactly as
      observed, including the possibility that the pure h_- and h_+
      slices remain individually correct even if a joint interaction term
      is needed.
    what_no_outcome_can_support: >-
      No outcome supports any relation-rate, cost, exponent, or
      cryptographic-scale claim. No outcome resolves the non-split strata
      or the cross-lane H-MONO-93bc4d question.

  inputs:
    construction_reused: >-
      EXP-MONO-0e6e8f's own already-independently-verified Q_e(T)
      construction and classification method, and EXP-MONO-ee06e2's own
      already-independently-verified Stage-0/1/2 pipeline structure,
      reused unmodified except for the Stage-0 filter (h_+ >= 1 AND h_- >= 1
      simultaneously) and the Stage-2 rival (D_prod instead of D_quad).
    domain: EXP-MONO-98abb2/v1
    search: >-
      Scan ordinary curves (varying A,B) at toy primes in [101,2000], SAME
      fixed ascending order as EXP-MONO-4e6faa/EXP-MONO-ee06e2 (prime asc,
      then A asc, then B asc), until a curve with Z=3 AND h_+ >= 1 AND
      h_- >= 1 is found. Disclose the exact number of curves scanned
      before success, or exhaustion. Do NOT hard-code or special-case
      (A,B)=(1,11) at p=103, the pair Red Team's own prior review already
      found -- the fixed search order decides, independently re-verifying
      rather than assuming that finding.
    census: >-
      On the found curve, exhaustively enumerate the distinct-split (Z=3)
      residual stratum's own base points, classify each via the
      already-verified Q_e(T) construction, and tabulate exact
      #1^4, #2+1+1, #2+2 counts.

  stage_order:
    stage_0:
      name: search for a Z=3, h_+>=1 AND h_->=1 curve
      compute: seconds to minutes
      description: >-
        Scan curves as described above. Report success (with the exact
        curve, its n_+, n_-, h_+, h_- values) or exhaustion of the
        declared range (a reportable non-finding per HEUR-CELL-3, not a
        falsification -- though very unlikely given the Red Team's own
        prior computationally-confirmed candidate).
    stage_1:
      name: exhaustive distinct-split census on the found curve
      compute: minutes
      description: >-
        Reusing EXP-MONO-0e6e8f's own verified construction, exhaustively
        classify every distinct-split base point on the found curve into
        the five-class scheme, and tabulate the #1^4, #2+1+1, #2+2 counts.
    stage_2:
      name: exact comparison -- observed vs. additive-sum vs. multiplicative rival
      compute: seconds
      description: >-
        Compute BOTH D_sum = h_+ n_- + h_- n_+ (the frozen D3 formula,
        unmodified, now with both terms nonzero) and D_prod =
        h_+ * h_- * (n_+ + n_-) (the named multiplicative-interaction
        rival) from the found curve's own (n_+, n_-, h_+, h_-) values,
        BEFORE reading Stage 1's own results. Compare each formula's own
        predicted #1^4, #2+1+1 EXACTLY (zero tolerance) against Stage 1's
        own observed counts. Report R1_sum, R2_sum and R1_prod, R2_prod
        explicitly, whether zero or not.

  metrics:
    primary:
      - "M1: R1_sum = observed #1^4 - D_sum-predicted #1^4 (exact integer, zero-tolerance)"
      - "M2: R2_sum = observed #2+1+1 - D_sum-predicted #2+1+1 (exact integer, zero-tolerance)"
    secondary:
      - "M3: R1_prod, R2_prod -- the same residuals against the named multiplicative rival, for discrimination context."
      - "M4: the found curve's own (p, A, B, n_+, n_-, h_+, h_-) values, disclosed in full."
      - "M5: the number of curves scanned in Stage 0 before success (or exhaustion)."

  preregistered_prediction:
    - quantity: M1, M2
      value: "Exactly 0, under the additive D3 formula (unchanged, applied bivariately)."
      formula: "D_sum = h_+ n_- + h_- n_+; see H-MONO-1297d7's own statement field."
      source: IDEA-20260904-4f614a mechanism, unmodified.
    - quantity: M3
      value: >-
        Predicted to differ from 0 whenever h_+, h_- >= 1 and n_+, n_- > 0
        (since D_sum != D_prod there) -- named before any run so a match
        with D_sum is genuinely discriminating.
      formula: "D_prod = h_+ * h_- * (n_+ + n_-); named here as the rival under test, not endorsed."
      source: H-MONO-1297d7's own mechanism field.

  replication:
    planned_runs: 1
    seeds: [20260904006]
    interpretation: >-
      Deterministic once the search order and range are fixed; exact
      reproducibility from the recorded curve and search order.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 900
    maximum_cpu_seconds: 900
    maximum_peak_rss_bytes: 134217728
    maximum_total_disk_bytes: 10485760
    maximum_workers: 1
    no_network: true

  environment_preconditions:
    consequence: NO CAS AND NO SOLVER IS REQUIRED. Pure Python, reusing already-verified implementations.
    if_a_precondition_fails: >-
      A missing interpreter or an arithmetic exception is
      `failed_infrastructure`, never negative mathematical evidence.
      Exhaustion of the Stage-0 search range without finding a qualifying
      curve is NOT an infrastructure failure -- it is a reportable, valid,
      non-evidentiary outcome per HEUR-CELL-3.

  infrastructure_failure_disposition: >-
    Any crash is recorded with its exact cause and classified
    `failed_infrastructure`. Supports and weakens NOTHING about
    H-MONO-1297d7 or IDEA-20260904-4f614a.

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen and authorized. (Satisfied here.)
    - Stop and report the Stage-0 search outcome plainly if the declared range is exhausted.
    - Do not silently discard a disconfirming Stage-2 residual, for either prediction.
    - Do not hard-code, special-case, or search-order-bias toward (A,B)=(1,11) at p=103.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Any post-hoc widening of the Stage-0 search range after observing a result.
    - Any reporting of Stage-2 residuals that omits R1_sum, R2_sum, R1_prod, or R2_prod.
    - Hard-coding the search to land on the previously-named (A,B)=(1,11) pair.

  success_criterion: >-
    A run is well-formed evidence if: Stage 0's search outcome is reported
    with the exact curve or exact scan count; Stage 1's exhaustive census
    is reported in full; Stage 2's exact residuals against BOTH
    predictions are reported plainly, whether zero or not.

  falsification_criterion: >-
    Any nonzero R1_sum or R2_sum on a found h_+>=1, h_->=1 curve, correctly
    constructed and verified.

  outcomes:
    additive_form_confirmed_interaction_rival_excluded: >-
      A qualifying curve is found, R1_sum=R2_sum=0 exactly, and R1_prod or
      R2_prod is nonzero. The additive, non-interacting form of the closed
      form is confirmed for the joint regime -- this completes
      KN-FIND-edd62c's own disclosed scope gap.
    additive_form_falsified: >-
      A qualifying curve is found but R1_sum or R2_sum is nonzero. The
      simple additive form is falsified for the joint regime specifically,
      requiring a corrected cross-term; the individually-tested h_+=0 and
      (by the derivation's symmetry, presumably) h_-=0 slices are not
      thereby falsified, but the general closed form as currently stated
      would need correction.
    both_forms_falsified: >-
      Neither prediction matches exactly. Reported plainly as a genuinely
      surprising result requiring a fresh derivation attempt.
    no_qualifying_curve_found: >-
      The declared search range is exhausted without finding a qualifying
      curve. Reported as a valid, non-evidentiary occupancy finding per
      HEUR-CELL-3 -- very unlikely given the Red Team's own prior finding.
    infrastructure_or_construction_failure: See infrastructure_failure_disposition. Never mathematical evidence.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      Toy scale only; no transfer to cryptographic scale. A single
      confirmed joint-regime match is a real but limited completion of the
      tested picture, not a proof for every (h_+, h_-) combination.

  required_artifacts_if_later_authorized:
    - Frozen approved specification (this file).
    - Stage-0 search outcome (curve found or range exhausted, with exact scan count).
    - Run manifest, command, environment, raw-result.json with the found curve's own full parameters and the exhaustive census's own exact counts.
    - Independent Validator + Red Team review before any citation of this result.

  approval_requirements:
    - This contract is DEC-20260904-e9df3f's own named high-priority next_action.
    - Independent review confirms the found curve's own h_+>=1/h_->=1 status, that the search was not biased toward the previously-named (A,B) pair, and the exact residual computations for both predictions.

  approval_status: >-
    APPROVED 2026-09-04 by the Coordinator; see `coordinator_approval_rationale` above.

  source_refs:
    - ledger/hypotheses/H-MONO-1297d7.yaml
    - ledger/proposals/IDEA-20260904-4f614a.yaml
    - ledger/decisions/DEC-20260904-e9df3f.yaml
    - ledger/evidence/EV-MONO-fae201.yaml
    - knowledge/findings/KN-FIND-edd62c.md
    - experiments/EXP-MONO-ee06e2/implementation/run_linear_vs_quadratic.py
    - experiments/EXP-MONO-ee06e2/reviews/red-team/red-team-report.yaml
    - experiments/EXP-MONO-0e6e8f/implementation/run_uncond_census.py

  inference:
    requested_policy: executor-implementation
    reasoning_effort: medium
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
