    - >-
      UNEXPECTED OBSERVATION, DISCLOSED PLAINLY (not a protocol deviation,
      but recorded here for visibility alongside the others): on the FOUND
      curve, h_+ = h_- = 1 exactly, which makes D_sum = h_+*n_- + h_-*n_+
      = n_+ + n_- and D_prod = h_+*h_-*(n_+ + n_-) = 1*1*(n_+ + n_-) =
      n_+ + n_- ALGEBRAICALLY IDENTICAL whenever h_+ = h_- = 1 (both
      reduce to n_+ + n_-, independent of any distinction between the two
      formulas' mechanisms). Consequently D_sum = D_prod = 100 on this
      specific curve, and BOTH R1/R2 residual pairs are exactly zero
      against BOTH predictions -- the run does NOT discriminate between
      the additive and multiplicative hypotheses on this particular
      curve, even though it does confirm the additive D3 formula survives
      exactly in the joint (h_+>=1, h_->=1) regime. This was not
      anticipated by the pre-registered outcome list in specification.yaml
      (which framed a match with D_sum and a mismatch with D_prod as the
      expected confirming outcome, since "D_sum != D_prod whenever both
      h_+, h_- >= 1 and n_+, n_- > 0" per H-MONO-1297d7's own statement) --
      that inequality claim is FALSE specifically at h_+ = h_- = 1, the
      minimal value for both, which is exactly the value the fixed search
      order's first hit landed on. See implementation.md for the full
      derivation and discussion; no interpretation of what this means for
      the hypothesis's status is offered here.

  anomalies:
