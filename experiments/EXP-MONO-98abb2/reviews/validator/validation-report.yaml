        own (D3) notation block ("D := h_+ * n_- + h_- * n_+") and
        H-MONO-1297d7's own statement field ("D_prod = h_+ * h_- *
        (n_+ + n_-)"), not from the task prompt's paraphrase.
      stratum_enumeration:
        base_points_enumerated: 161700
        expected_C_100_3: 161700
        match: true
      own_observed_five_class_counts:
        "1^4": 42436
        "2+2": 112256
        "2+1+1": 7008
