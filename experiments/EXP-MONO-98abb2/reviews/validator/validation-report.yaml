        161,700-point census exactly (42436/112256/7008), and both R1_sum=
        R2_sum=0 and R1_prod=R2_prod=0, matching C(100,3) exactly. Both
        predictions coincide numerically (100=100) and both match the
        observed census exactly -- the run does confirm D_sum on this curve
        but does NOT, by itself, discriminate D_sum from D_prod, exactly as
        CORR-20260904-e526e0 discloses.

  # ==================================================================
  # J2 -- COINCIDENCE ALGEBRA AUDIT
  # ==================================================================
  j2_coincidence_algebra_audit:
    part_1_diagonal_substitution:
      method: "sympy symbolic substitution h_+ = h_- = h into D_sum and D_prod (j2_algebra.py)."
      result: >-
        D_sum(h,h,n_+,n_-) = h*(n_++n_-);  D_prod(h,h,n_+,n_-) = h^2*(n_++n_-).
        D_sum - D_prod = -h*(h-1)*(n_++n_-). For n_++n_- > 0, this is 0 iff
        h*(h-1)=0, i.e. h in {0,1}.
      at_this_curve: >-
        h_+ = h_- = 1, n_+=58, n_-=42: D_sum = 1*100 = 100, D_prod =
        1^2*100 = 100. Exactly the observed coincidence.
      verdict: >-
        CONFIRMED, exactly as CORR-20260904-e526e0 and the task card's
        coordinator_prior state. This is a genuine algebraic identity of
        the two named formulas at the specific point the fixed search order
        reached first (h_+=h_-=1 is the MINIMAL pair admissible under the
        Stage-0 filter h_+>=1 AND h_->=1), not a coding bug, not a
        coincidence of this particular n_+/n_- split, and not an artifact
        of the census/classifier: it holds for every n_+, n_- whatsoever
        once h_+=h_-=1, and is fully explained by the diagonal substitution
        above.

    part_2_general_h_plus_neq_h_minus_question:
      question: >-
        For h_+ != h_- (both nonnegative integers), does D_sum = D_prod have
        a solution for SOME choice of positive integers n_+, n_- > 0? I.e.
        does requiring h_+ != h_- in a follow-up's Stage-0 filter fully
        close the coincidence loophole, or could another (h_+,h_-,n_+,n_-)
        combination still coincide?
      setup: >-
        D_sum = D_prod  <=>  h_+ n_- + h_- n_+ = h_+ h_- (n_+ + n_-)  <=>
        n_- * h_+ * (1 - h_-)  +  n_+ * h_- * (1 - h_+)  =  0.
        Write a=h_+, b=h_-, x=n_+, y=n_- (a,b nonnegative integers, a != b;
        x,y strictly positive integers, per H-MONO-1297d7's own outcome (I)
        domain "n_+, n_- > 0").
      case_analysis:
        - {case: "a=0, b>0", result: "equation reduces to b*x=0; x>0 forces no solution (unless b=0, excluded by a!=b)."}
        - {case: "b=0, a>0", result: "by symmetry, equation reduces to a*y=0; y>0 forces no solution."}
        - {case: "a=1, b != 1", result: "equation reduces to y*(1-b)=0; y>0 forces b=1, excluded."}
        - {case: "b=1, a != 1", result: "by symmetry, x*(1-a)=0; x>0 forces a=1, excluded."}
        - {case: "a>1, b>1, a != b", result: "the two terms n_-*a*(1-b) and n_+*b*(1-a) have STRICTLY OPPOSITE signs (one positive, one negative, since exactly one of (1-a),(1-b) is negative and the other... both negative in this range, but the a-1 and b-1 factors combine to force the ratio y/x = b(a-1)/(a(1-b)) to be strictly negative whenever a,b>1 and a!=b), so no positive (x,y) solves the equation. Verified both symbolically (sympy factor/solve) and by exhaustive bounded search."}
      exhaustive_bounded_search: >-
        Brute-force search over h_+, h_- in [0,12] with h_+ != h_-, and
        n_+, n_- in [1,500] each (a grid of 13*12*500*500 = 39,000,000
        combinations, run to completion in this review): ZERO
        counterexamples found. No (h_+,h_-,n_+,n_-) with h_+ != h_- and
        n_+,n_- both strictly positive makes D_sum equal D_prod.
      conclusion: >-
        h_+ != h_- is BOTH NECESSARY AND SUFFICIENT to guarantee D_sum !=
        D_prod, PROVIDED n_+ > 0 and n_- > 0 (both, not merely their sum).
        The only coincidence pairs are the diagonal h_+ = h_- = h with h in
        {0,1} (h=1 being the nontrivial case realized on this run's curve;
        h=0 forces D_sum = D_prod = 0 trivially and is in any case excluded
        by this experiment's own Stage-0 filter h_+>=1 AND h_->=1). There is
        NO other (h_+,h_-) pair, equal or unequal, at which a coincidence
        can occur for any positive n_+, n_-.
      caveat_on_the_n_plus_n_minus_gt_0_precondition: >-
        A genuinely degenerate corner exists if n_+=0 or n_-=0 is allowed
        (e.g. h_-=0 or h_+=1 with n_-=0 makes D_sum=D_prod=0 trivially
        regardless of h_+ != h_-) -- but this corner is inaccessible in the
        declared toy-prime search domain: by the Hasse bound |t| <= 2*sqrt(p)
        and n_+ - n_- = -t, n_+ + n_- = p - Z, having n_-=0 (or n_+=0) would
        require p - Z <= 2*sqrt(p), which fails for every prime p >= 101 in
        the declared [101,2000] range (2*sqrt(101) ~ 20.1, versus p-Z >= 98).
        So for every curve reachable by this program's own Stage-0 search at
        these primes, n_+ > 0 and n_- > 0 strictly, and the caveat is
        academic, not a live loophole. This is disclosed rather than
        silently assumed.
      verdict: >-
        CORR-20260904-e526e0's own proposed fix ("require h_+ != h_- in a
        follow-up's Stage-0 filter") IS SUFFICIENT to guarantee D_sum and
        D_prod differ on every curve such a follow-up's search could
        produce, given the always-true-at-these-scales precondition
        n_+, n_- > 0 above. No other (h_+, h_-) coincidence point exists.
        This directly answers claim_under_review item (e): the proposed fix
        fully closes the loophole for the D_prod rival specifically.

  # ==================================================================
  # PROVES-TOO-MUCH CONTROL (review_plan.proves_too_much)
  # ==================================================================
  proves_too_much_control:
    purpose: >-
      Confirm this reviewer's own general coincidence-checking method
      (substitute the curve's own (h_+,h_-,n_+,n_-) into D_sum and a named
      rival, and/or solve symbolically for when they agree) correctly
      reproduces the two ALREADY-INDEPENDENTLY-VERIFIED non-coincidence
      outcomes on EXP-MONO-4e6faa's and EXP-MONO-ee06e2's own archived
      curves, before trusting this report's own J2 verdict above.
    target_1_EXP-MONO-4e6faa:
      curve: "p=101, A=1, B=0, n_+=48, n_-=50, h_+=0, h_-=1 (read from that experiment's own execution_report.yaml/raw-result.json, a DIFFERENT experiment's already-archived material, not this experiment's blind_from set)"
      named_rival: "\"E[4]-alone\": the theory that only E's own rational 4-torsion matters, i.e. it drops the h_- term entirely: D_E4alone = h_+ * n_-, forced to 0 here since h_+=0."
      own_recompute: {D_lin: 48, D_E4alone: 0, equal: false}
      general_coincidence_condition_solved: "D_lin = D_E4alone  <=>  h_-*n_+ = 0  <=>  h_-=0 (since n_+>0)."
      applied_here: "h_- = 1 != 0, so predicted to differ."
      archived_residuals: "R1=48, R2=-144 (both nonzero, per this task's own prompt and EXP-MONO-4e6faa's execution_report.yaml)."
      match: true
      verdict: "Method correctly predicts non-coincidence; matches the already-archived nonzero residuals."
    target_2_EXP-MONO-ee06e2:
      curve: "p=101, n_+=52, n_-=46, h_+=0, h_-=3 (read from that experiment's own execution_report.yaml)"
      named_rival: "D_quad = h_+ * n_- + (h_-)^2 * n_+, per H-MONO-fa4cb9's own mechanism field."
      own_recompute: {D_lin: 156, D_quad: 468, equal: false}
      general_coincidence_condition_solved: "at h_+=0: D_lin = D_quad  <=>  h_-*n_+ = h_-^2*n_+  <=>  h_-(1-h_-)=0 (n_+>0)  <=>  h_- in {0,1}."
      applied_here: "h_- = 3, not in {0,1}, so predicted to differ."
      archived_residuals: "R1_quad=-312, R2_quad=936 (both nonzero, per EXP-MONO-ee06e2's execution_report.yaml)."
      match: true
      verdict: "Method correctly predicts non-coincidence; matches the already-archived nonzero residuals."
    structural_observation: >-
      The coincidence set for D_quad ({h_-: 0,1}) has the SAME shape as for
      D_prod ({h: 0,1}): both named rivals are constructed so that their
      h-dependent term agrees with D_sum's own linear term at h=0 and h=1
      (0^2=0, 1^2=1, 1*1=1 -- any polynomial or product-form rival p(h)*n
      with p(0)=0 and p(1)=1 will coincide with the linear term h*n
      EXACTLY at those two boundary values). This is a structural property
      of "minimal admissible h" Stage-0 filters (h_->=1, or h_+>=1 AND
      h_->=1): the first h value such a filter admits is generically h=1,
      which is systematically also the first value at which many
      plausible non-linear/multiplicative rivals coincide with the linear
      form -- a pattern, not a one-off, and directly relevant to J3's own
      "is this the second time" question (owned by red-team, noted here
      only because J2's own algebra is what establishes it).
    conclusion: >-
      CONTROL PASSES on both target objects. This reviewer's general
      method (symbolic solve for the coincidence condition, then
      substitute the curve's own reported values) neither spuriously
      predicts a coincidence that was not observed, nor misses a
      coincidence that was observed, on either prior curve. J2's verdict
      above on the general h_+ != h_- question is therefore trusted.

