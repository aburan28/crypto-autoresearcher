  # ==================================================================
  # J1 -- INDEPENDENT CURVE CONSTRUCTION AND CENSUS AUDIT
  # ==================================================================
  j1_curve_construction_and_census_audit:
    part_a_curve_and_twist_construction:
      method: >-
        Standalone Python (independent_curve_construction.py), written from
        scratch for this review: own Euler-criterion Legendre-symbol
        function, own brute-force root finder for f(X)=X^3+X+11 mod 103,
        own n_+/n_- tally by direct iteration, own curve-order formula
        (N = 1 + 2*n_+ + Z), own smallest-non-residue search for the twist
        parameter d, own A_tw=A*d^2 mod p / B_tw=B*d^3 mod p reduction, own
        full (x,y) point enumeration (brute-force sqrt search, not a
        shortcut), own elliptic-curve group law (add/double/negate,
        standard affine Weierstrass formulas implemented independently),
        own repeated-doubling scalar multiplication, and own 2-/4-torsion
        counters (2P==O and doubling-twice==O, applied to every enumerated
        point of both E and E^d). Imports NOTHING from RC.pt_add,
        RC.curve_order, RC.qe_from_sym/UC.classify_fibre, or any file under
        experiments/EXP-MONO-0e6e8f or experiments/EXP-MONO-815525.
      results:
        p: 103
        A_B: [1, 11]
        f_roots: [12, 26, 65]
        Z: 3
        order_E_bruteforce: 120
        trace_t: -16
        d_nonresidue: 3
        A_twist_recomputed: 9
        B_twist_recomputed: 91
        order_Etwist_bruteforce: 88
        twist_sanity_N_plus_Ntw_eq_2p_plus_2: true
        tau_via_own_group_law: 4
        tau_tw_via_own_group_law: 4
        E4_bruteforce: 8
        Ed4_bruteforce: 8
        n_plus: 58
        n_minus: 42
        h_plus: 1
        h_minus: 1
      confirmation_table:
        - {claim: "f(X)=X^3+X+11 has exactly 3 distinct roots mod 103", predicted: 3, own_result: 3, match: true}
        - {claim: "#E(F_103) = 120", predicted: 120, own_result: 120, match: true}
        - {claim: "d=3 is a quadratic non-residue mod 103", predicted: true, own_result: true, match: true}
        - {claim: "A_tw = A*d^2 mod 103 = 9", predicted: 9, own_result: 9, match: true}
        - {claim: "B_tw = B*d^3 mod 103 = 91", predicted: 91, own_result: 91, match: true}
        - {claim: "#E^d(F_103) = 88", predicted: 88, own_result: 88, match: true}
        - {claim: "N + N_tw == 2p+2 (twist identity)", predicted: true, own_result: true, match: true}
        - {claim: "tau = Z+1 = 4", predicted: 4, own_result: 4, match: true}
        - {claim: "#E(F_103)[4] = 8", predicted: 8, own_result: 8, match: true}
        - {claim: "#E^d(F_103)[4] = 8", predicted: 8, own_result: 8, match: true}
        - {claim: "h_+ = (8-4)/4 = 1", predicted: 1, own_result: 1, match: true}
        - {claim: "h_- = (8-4)/4 = 1", predicted: 1, own_result: 1, match: true}
        - {claim: "n_+ = 58", predicted: 58, own_result: 58, match: true}
        - {claim: "n_- = 42", predicted: 42, own_result: 42, match: true}
      verdict: >-
        HOLDS. All fourteen independently-checked facts (Z, tau, #E, #E^d,
        #E[4], #E^d[4], h_+, h_-, n_+, n_-, and three internal identities)
        confirmed exactly by from-scratch code sharing no line with RC/UC.

    part_b_blind_census_and_D_computation:
      method: >-
        Own driver script (independent_census_driver.py), structurally
        independent of run_bivariate_test.py (never read before this step):
        own eligible-set construction (F_103 minus the 3 roots of f, size
        100, cross-checked == n_+ + n_-), own re-derivation of n_+/n_- from
