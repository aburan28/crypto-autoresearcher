  claim_under_review: >-
    Per TASK-20260904-f8c4dd, scoped to J3 and J4 only. J3: does
    CORR-20260904-e526e0 correctly and completely characterize the defect
    it self-discloses (the D_sum=D_prod coincidence at h_+=h_-=1), in
    particular its own scope_of_error claim that EV-MONO-91bca2 and
    EV-MONO-fae201 are unaffected, and is "low" severity the right call, or
    is there a nameable recurring pattern given this is arguably the second
    time this sub-thread's search-then-compare design has landed on the
    least-discriminating admissible point? J4: is the correction's own
    proposed fix ("require h_+ != h_-" in the next Stage-0 filter)
    sufficient to guarantee D_sum != D_prod for every positive integer
    n_+, n_- the search could produce, or could a residual coincidence
    survive even with h_+ != h_-?

  objections:
    - id: OBJ-J3i-1
      target: "J3(i) -- independent re-check of EXP-MONO-4e6faa's own
        rival-differs claim (E[4]-alone vs D_sum)"
      statement: >-
        CONFIRMED, independently. On the tested curve (p=101, A=1, B=0;
        n_+=48, n_-=50, h_+=0, h_-=1): D_sum = h_+*n_- + h_-*n_+ =
        0*50 + 1*48 = 48. The named rival "the invariant is #E[4] alone"
        depends only on h_+ (it discards the twist's #E^d[4]=h_- entirely),
        so on this curve it predicts D_rival = 0 (since h_+=0). These are
        48 vs 0 -- unambiguously different, and this is not a coincidence
        of this specific curve: because the rival structurally sets
        D_rival=0 whenever h_+=0 (it has literally no h_- term), and
        D_sum=h_-*n_+ at h_+=0, the two formulas can ONLY coincide on an
        h_+=0 curve if h_-*n_+=0, i.e. h_-=0 or n_+=0 -- both excluded by
        the experiment's own filter (h_->=1) and by n_+>0 being guaranteed
        whenever the stratum is nonempty. So EV-MONO-91bca2's own reported
        residuals (residual_1^4: 48, residual_2plus1plus1: -144, both
        nonzero) are exactly what the algebra requires, not a lucky draw.
        EXP-MONO-4e6faa's comparison was safe by CONSTRUCTION of the rival
        (an impoverished, h_--blind formula essentially never ties with a
        formula that has a nonzero h_- term), which is a structurally
        different, more robust situation than EXP-MONO-98abb2's D_sum vs
        D_prod comparison (two formulas of comparable richness that are
        DESIGNED to look different in general but happen to collapse to
        the same value on a measure-zero set of parameter points). CORR's
        bottom-line claim ("unaffected") holds for this experiment, but its
        phrasing ("independently verified... actually differed... before
        drawing a conclusion") slightly overstates how much active checking
        this specific case needed: no boundary sweep was required here
        because the rival is structurally incapable of tying with D_sum
        whenever h_->0, n_+>0 -- a different (stronger) safety property
        than "someone checked the boundary and it happened to be fine,"
        which is what actually happened for EXP-MONO-ee06e2 (see OBJ-J3i-2)
        and what did NOT happen for EXP-MONO-98abb2 itself (the disclosed
        defect).
    - id: OBJ-J3i-2
      target: "J3(i) -- independent re-check of EXP-MONO-ee06e2's own
        rival-differs claim (D_lin vs D_quad at h_-=3)"
      statement: >-
        CONFIRMED, independently, AND this is the load-bearing finding for
        J3(ii) below. At h_+=0: D_lin = h_-*n_+ and D_quad = (h_-)^2*n_+.
        These are equal iff h_-*n_+ = (h_-)^2*n_+ iff (since n_+>0)
        h_- = (h_-)^2 iff h_- in {0,1} -- an EXACT algebraic analogue,
        substituting h_- for h in the diagonal case, of the very identity
        CORR-20260904-e526e0 itself derives for h_+=h_-=h (h=h^2 iff
        h in {0,1}). On the tested curve (p=101, A=1, B=33; n_+=52, n_-=46,
        h_+=0, h_-=3): D_lin=3*52=156, D_quad=9*52=468, genuinely different
        (156 != 468), because h_-=3 is safely off the {0,1} coincidence
        set. This was NOT an accident of the search: EV-MONO-91bca2's own
        red-team verdict (recorded BEFORE EXP-MONO-ee06e2 was designed)
        explicitly states "h_-=1 cannot distinguish the claimed linear
        form... from other functional forms that would agree at h_-=1
        (e.g. a quadratic...)" -- i.e. the h_-in{0,1} degeneracy for a
        linear-vs-quadratic comparator was ALREADY IDENTIFIED, BY NAME, in
        this exact sub-thread, and EXP-MONO-ee06e2's own Stage-0 filter was
        deliberately tightened to h_->=2 specifically because of that prior
        finding (confirmed by EV-MONO-fae201's own text: "found by the SAME
        fixed search order as EXP-MONO-4e6faa (adjusted only to require
        h_->=2)"). So CORR's claim that EXP-MONO-ee06e2 "independently
        verified [its rival] actually differed... before drawing a
        conclusion" is ACCURATE and, more importantly, is accurate for a
        traceable reason: this sub-thread had already learned this exact
        lesson once. That makes it directly relevant to J3(ii): the defect
        CORR now discloses is not merely "the same general kind of
        oversight" as an abstract category (the "conditioning trap") -- it
        is a recurrence of a SPECIFIC, already-instantiated, already-fixed
        algebraic pattern (two candidate formulas coincide exactly at the
        threshold value(s)={0,1} of whichever parameter a Stage-0 filter
        requires to be ">=1") that this program's own citation graph
        (H-MONO-1297d7 cites EV-MONO-fae201 and EXP-MONO-ee06e2 directly)
        made available at zero additional search cost.
    - id: OBJ-J3i-3
      target: "J3(i) -- is scope_of_error's claim about KN-FIND-edd62c
        accurate?"
      statement: >-
        HOLDS. KN-FIND-edd62c was promoted from EV-MONO-91bca2 and
        EV-MONO-fae201 jointly, both of which (per OBJ-J3i-1/2) tested
        rivals that genuinely differed from D_sum/D_lin on their own tested
        curves, and via a mechanism (OBJ-J4-4 in EXP-MONO-ee06e2's own
        prior red-team report, cited there) that was independently
        re-derived to structurally force linearity, not merely observed to
        fit. Nothing in CORR-20260904-e526e0's own finding (a coincidence
        specific to the D_sum-vs-D_prod comparator at h_+=h_-=1) touches
        either archived comparator (E[4]-alone; D_quad) or either archived
        curve (h_-=1,h_+=0; h_-=3,h_+=0). scope_of_error's claim about
        KN-FIND-edd62c is therefore accurate and needs no amendment.
    - id: OBJ-J3ii-1
      target: "J3(ii) -- is 'low' severity supportable given OBJ-J3i-2?"
      statement: >-
        NOT FULLY SUPPORTABLE AS WRITTEN. CORR's own severity field justifies
        "low" purely on run-validity grounds ("the run is still valid
        evidence for the additive form; it merely fails to discriminate"),
        which is correct as far as it goes for THIS SINGLE RUN's own
        evidentiary status. But severity here should also reflect what the
        defect says about the RELIABILITY OF THE DESIGN PROCESS that
        produces this sub-thread's specifications, and on that axis "low"
        understates the finding. OBJ-J3i-2 establishes that this is not a
        first-time, isolated algebra slip: the identical family of
        coincidence (two rival closed-form comparators agreeing at the
        minimal admissible threshold value(s) of a Stage-0 ">=1" filter)
        was already discovered, named, and correctly remediated ONE
        EXPERIMENT EARLIER in this exact sub-thread (EV-MONO-91bca2's own
        J4, acted on by EXP-MONO-ee06e2's h_->=2 filter). The design of
        EXP-MONO-98abb2's bivariate Stage-0 filter (h_+>=1 AND h_->=1,
        with no additional exclusion) is the DIRECT two-variable analogue
        of the univariate mistake this sub-thread had already avoided once
        for the univariate case. A specification-time process that had
        just fixed this exact issue in one dimension and then reintroduced
        its exact two-dimensional analogue in the very next specification
        is a recurring process gap, not a one-off. Recommend upgrading
        severity from "low" to "medium" -- not because the run itself is
        compromised (it is not; CORR is right that it remains valid,
        non-discriminating evidence), but because "low" as currently
        justified speaks only to the run's evidentiary status and is silent
        on the fact that the SAME failure mode recurred despite an
        available, cheap, already-archived precedent that a specification-
        time check against this sub-thread's own prior evidence records
        would have caught.
    - id: OBJ-J3ii-2
      target: "J3(ii) -- naming the pattern explicitly"
      statement: >-
        YES, a general, nameable pattern is worth stating, and it should be
        stated more precisely than the task prompt's own draft phrasing
        ("minimal satisfying values are combinatorially the most common"),
        which is not quite the mechanism at work here (occupancy/commonness
        is a Stage-0 SEARCH property; what actually bites in both
        instances is a Stage-2 COMPARISON property). The precise statement,
        derived from the two confirmed instances above:
        'THRESHOLD-FILTER DEGENERACY: when a Stage-0 filter admits a
        parameter h via a lower-bound condition h>=k (k typically 1), and
        Stage-2 compares two closed-form functions of h that are
        DESIGNED to differ in the generic case (e.g. a linear form vs a
        quadratic or multiplicative form in h), those two functions
        generically agree on a small, algebraically characterizable set of
        h-values close to the filter's own boundary (here, h in {0,1} for
        h^k vs h forms, or h_+=h_-=1 for h_+h_- vs h_++h_- forms) --
        because a low-degree polynomial identity in h has few roots, and a
        filter with threshold k=1 is disproportionately likely to admit
        its OWN minimal boundary value first under a fixed ascending
        search order, precisely landing on the coincidence set. This is a
        Stage-2 comparator-design risk, not a Stage-0 sampling-bias risk:
        the fix is not "search more randomly" but "solve the comparator
        equality algebraically over the ENTIRE admissible parameter
        region the Stage-0 filter can produce, not just the generic case,
        before freezing the specification" -- which is close to, but more
        precise than, CORR's own next_action text, and should be stated as
        a STANDING checklist item for this sub-thread (any future D-vs-
        rival comparator design), not merely as a one-off correction.'
    - id: OBJ-J4-1
      target: "J4 -- is h_+ != h_- sufficient? (own algebra)"
      statement: >-
        YES, IT IS SUFFICIENT -- proved directly, not merely spot-checked.
        Compute the general difference:
          D_prod - D_sum
            = h_+ h_- (n_+ + n_-) - (h_+ n_- + h_- n_+)
            = n_+ (h_+ h_- - h_-) + n_- (h_+ h_- - h_+)
            = h_- (h_+ - 1) n_+  +  h_+ (h_- - 1) n_-.
        This identity is exact and holds for ALL h_+, h_-, n_+, n_- (no
        case split needed to derive it). Under this sub-thread's own
        Stage-0 filter (h_+ >= 1 AND h_- >= 1, retained unchanged), both
        (h_+ - 1) >= 0 and (h_- - 1) >= 0, and h_+, h_-, n_+, n_- are all
        > 0, so BOTH terms on the right are >= 0, hence D_prod - D_sum >= 0
        identically. The sum of two nonnegative terms is zero iff both are
        zero: h_-(h_+-1)n_+ = 0 iff h_+=1 (since h_-,n_+>0), and
        h_+(h_--1)n_- = 0 iff h_-=1 (since h_+,n_->0). So, GIVEN h_+,h_->=1:
        D_prod = D_sum for SOME positive n_+,n_- if and only if it holds
        for ALL positive n_+,n_- (the difference doesn't depend on n_+,n_-
        once h_+,h_- are fixed -- exactly matching execution_report.yaml's
        own disclosed observation that the coincidence is "independent of
        n_+, n_-"), and this happens if and only if h_+=h_-=1 EXACTLY. Since
        "h_+ != h_-" excludes (1,1) as one of its excluded cases (1=1 is
        false only when they differ, so h_+=h_-=1 is excluded by h_+!=h_-),
        the proposed fix DOES close the loophole: there is no OTHER
        (h_+,h_-) pair with h_+ != h_- where the two formulas can coincide
        for any positive n_+,n_-, because the unique coincidence set over
        the entire admissible domain (h_+,h_->=1) is the single point
        {(1,1)}, which already has h_+=h_-.
    - id: OBJ-J4-2
      target: "J4 -- is h_+ != h_- the RIGHT (tightest) fix?"
      statement: >-
        SUFFICIENT BUT NOT TIGHT, and a cleaner replacement is available
        from the same identity. Because the ONLY coincidence point in the
        entire domain h_+,h_->=1 is (1,1) (OBJ-J4-1), "h_+ != h_-" is a
        STRICTLY STRONGER exclusion than necessary: it also forbids every
        SAFE diagonal point h_+=h_-=k for k>=2 (e.g. h_+=h_-=2: D_prod -
        D_sum = h_-(h_+-1)n_+ + h_+(h_--1)n_- = 2*1*n_+ + 2*1*n_- =
        2(n_++n_-) > 0, genuinely non-coincident, yet "h_+ != h_-" would
        block a future search from ever reaching or testing this curve).
        This matters concretely for this sub-thread: a natural, cheap
        follow-up after the "require h_+ != h_-" fix closes THIS gap would
        be to test whether the additive form ALSO survives when h_+=h_-
        is nonzero but NOT the degenerate value 1 (e.g. h_+=h_-=2 or 3),
        which is a strictly stronger and more informative confirmation of
        the additive/non-interacting mechanism than any h_+ != h_- curve
        alone could provide (since h_+ != h_- curves never test whether
        equal, nonminimal h_+ and h_- values behave additively). RECOMMEND:
        replace "require h_+ != h_-" with the exact, minimal condition
        derived directly from the identity above -- "require NOT
        (h_+ = 1 AND h_- = 1)", equivalently "require max(h_+,h_-) >= 2"
        given the existing h_+,h_->=1 floor is retained. This is both
        necessary and sufficient (not merely sufficient) for the found
        curve to discriminate D_sum from D_prod, and it strictly enlarges
        the admissible search space relative to "h_+ != h_-" (it still
        permits diagonal points), which both gives Stage 0 more curves to
        choose from (cheaper to satisfy, so a fixed ascending search will
        likely still land near p=103 or nearby) and preserves the option
        of a future diagonal-point test as a DISTINCT, still-informative
        experiment in its own right.
    - id: OBJ-J4-3
      target: "J4 -- process recommendation, not just the filter condition"
      statement: >-
        Beyond the specific filter fix, recommend the next specification's
        own text INCLUDE the general identity
        'D_prod - D_sum = h_-(h_+-1)n_+ + h_+(h_--1)n_-' (or the Validator's
        / Executor's own equivalent derivation) verbatim, together with the
        explicit statement that this proves the coincidence set is EXACTLY
        {(1,1)} over the whole admissible domain -- not merely a claim that
        "differs whenever h_+ != h_-" (true but weaker, and reconstructible
        only by re-deriving the algebra a second time). Recording the full
        identity, rather than only its corollary, is what makes the
        specification's own preregistered_prediction section auditable
        BEFORE freezing, closing the exact gap that produced
        CORR-20260904-e526e0 in the first place: an assertion ("D_sum !=
        D_prod whenever...") that was never checked against its own
        filter's admissible boundary before being written down as a
        two-sided falsification condition.

