        RC-J4-2 in EXP-MONO-ee06e2's own prior red-team report already
        recommended for the STEP 4/5 mechanism -- the same discipline this
        sub-thread applied there should now also apply to comparator-
        equality claims, not only to the underlying combinatorial
        derivation.

  narrowest_supported_statement: >-
    CORR-20260904-e526e0 correctly identifies and correctly diagnoses the
    D_sum=D_prod coincidence at h_+=h_-=1 (independently re-derived here via
    a general identity that also fully characterizes the coincidence set:
    exactly the single point {(1,1)} over the whole h_+,h_->=1 domain).
    scope_of_error's factual claim that EV-MONO-91bca2 and EV-MONO-fae201
    are unaffected HOLDS on independent re-check of both experiments' own
    rival-vs-D3 comparisons (OBJ-J3i-1, OBJ-J3i-2) -- no undisclosed
    coincidence exists in either prior run. However, the correction record
    as written UNDERSTATES two things that should be added, not merely
    implied: (1) the exact same class of degeneracy (a linear-form
    comparator tying with a rival at a filter's own minimal threshold
    value, h in {0,1}) was ALREADY discovered and fixed once earlier in
    this identical sub-thread (EV-MONO-91bca2's own J4, acting on
    EXP-MONO-ee06e2's h_->=2 filter), making this a recurrence of a known,
    citable, sub-thread-local pattern rather than a fresh instance of an
    abstract category -- this supports raising severity from low to
    medium; (2) the proposed fix ("require h_+ != h_-") IS mathematically
    sufficient (proved here, not merely asserted) but is not the tightest
    correct condition -- "require max(h_+,h_-) >= 2" (equivalently, exclude
    exactly (h_+,h_-)=(1,1)) is the exact necessary-and-sufficient
    condition given the existing h_+,h_->=1 floor, and should replace or
    supplement the correction's own next_action text.

