experiment:
  id: EXP-ARGON-e26dbb
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-1128f8; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-1128f8
  question_id: RQ-ARGON-141710
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Cell-level cost of node-level depth-reducing sets on the multi-pass Argon2 lane graph under
    in-place overwrite, with a t=1 forced-value control, a multiplicity-matched null, and a cell-aligned
    greedy comparison
  objective: The one uncertainty a run reduces is how many memory cells a node-level depth-reducing
    set of a given size actually frees, given that a t-pass evaluation maps roughly t*m graph nodes
    onto m cells by in-place overwrite. (i) The magnitude question is answered by running the lane's
    existing greedy heuristic unchanged and then counting, in one pass over its output, how many cells
    have all of their nodes removed -- an exact integer computation requiring no new heuristic and
    no new approximation. (ii) The attribution question -- whether any shortfall reflects the RFC
    indexing or merely the arithmetic of distributing a set across cells with multiplicity t -- is
    answered by a null with matched node count, edge count and multiplicity, checked against an independently
    derived analytic prediction so the null itself is validated rather than trusted. (iii) The instrument
    question -- whether the shortfall is a property of the graph or of a node-level heuristic that
    has no reason to align its choices within cells -- is answered by a cell-aligned greedy variant
    and by the node-level penalty it pays. The run produces no attack, proposes no strategy, and makes
    no statement about the security or adequacy of any parameter set; the cell-aligned variant exists
    solely as an instrument comparison.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: for the constructed p=1 multi-pass
      lane graphs at the declared cells, under the verified in-place overwrite rule, the removal sets
      produced by the lane''s existing greedy heuristic at the declared threshold free the reported
      number of memory cells, the efficiency ratio takes the reported values, the matched null takes
      its reported measured and analytic values, and the cell-aligned variant achieves the reported
      saving at the reported node-level penalty. WHAT DOES NOT FOLLOW: nothing about any adversary,
      since no strategy is proposed and the cell-aligned variant is an instrument rather than an attack;
      nothing about optimal removal sets, which this lane cannot compute; nothing about the correctness
      of the node-level accounting, which may be exactly right for depth arguments; nothing about
      multi-lane graphs or recommended parameters; and no statement whatsoever about Argon2''s security
      or the adequacy of any parameter set.'
  inputs:
    procedure: 'STAGE 0 (cost: hours of human time): verify the in-place overwrite rule directly against
      KN-LIT-7f3c21 and write it into the contract verbatim; declare the efficiency-ratio definition,
      the null construction and the analytic null prediction in a pre-registration file. STAGE 1 (cost:
      medium human time): rebuild the lane''s per-lane graph with explicit (pass, position) node indexing
      and an explicit node-to-cell map, rather than the flattened counter the existing code uses.
      STAGE 2 (cost: negligible): run the t=1 forced-value check; halt on any deviation from exactly
      1.0. STAGE 3 (cost: reuses existing budget): run the lane''s greedy heuristic unchanged across
      the parameter grid. STAGE 4 (cost: negligible): one pass over each removal set computing per-cell
      removal counts, fully freed cells and the efficiency ratio. STAGE 5 (cost: low): build twenty
      draws of the multiplicity-matched null, run the identical pipeline, and compare against the
      analytic prediction. STAGE 6 (cost: low): run the cell-aligned greedy variant and report its
      node-level penalty and cell-level saving. STAGE 7 (cost: negligible): run the monotonicity-in-t
      check. No attack, no credential data, no hardware measurement.'
    instrument: Python 3 with numpy for the pass-indexed graph builder and the cell-counting pass;
      the lane's existing greedy depth-reducing-set implementation imported unchanged, so the ratio
      applies to the removal sets actually produced by the instrument in use; a small modification
      of that heuristic for the cell-aligned variant, kept in the same file with a flag so the two
      share every other code path; harness/runner.py for seeding, parameter capture and manifests;
      exact integer arithmetic throughout, with floating point confined to the reported ratio. Plain
      JSON serialization of every removal set so the cell counting can be independently re-derived
      by a third party without re-running the heuristic. No Sage, no computer-algebra system.
    parameters: p=1. Variants Argon2i and Argon2id. t in {1, 2, 3, 6}, where t=1 is the forced-value
      control, 1 and 3 match the RFC 9106 recommended pass counts, and 6 extends the monotonicity
      check. q in {1024, 4096}. Greedy depth threshold at 50 percent of native depth t*q-1, matching
      H-ARGON-ef2f0b so the ratio applies directly to that hypothesis's quantities. Twenty independent
      draws of the multiplicity-matched null per cell. Ten synthetic input draws for the data-dependent
      portions. Cell-aligned greedy variant run at every cell with t >= 2. All seed material synthetic
      and generated in-run; no password, credential, leaked corpus or third-party dataset at any stage.
  controls:
  - Forced value at t=1, where nodes and cells coincide and the ratio must be exactly 1.0.
  - Matched null with same node count, edge count and node-to-cell multiplicity, twenty draws.
  - Analytic null prediction under an independence approximation, cross-checking the measured null
    by an independent route.
  - The cell-aligned greedy variant, establishing whether any gap is a property of the graph or of
    the node-level heuristic's indifference to cells.
  - 'Monotonicity check: the efficiency ratio must weakly decrease as t increases, since more nodes
    share each cell; a non-monotone ratio is an artifact signature.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A null graph with the same node count t*m, the same edge count, the
    same one-reference-edge-per-node structure, and the same node-to-cell multiplicity t, but with
    reference targets drawn uniformly from the eligible history rather than by the RFC rule. The identical
    greedy heuristic and the identical cell-counting pass run on it in the same invocation. The null
    must show an efficiency ratio determined by the arithmetic of spreading a removal set of the same
    size across m cells -- a quantity that can also be computed analytically under an independence
    approximation, giving two independent predictions for the null that must agree with each other.
    For the real arm to mean anything, the null''s measured and analytic ratios must agree, and the
    real arm''s ratio must lie outside the null''s spread over twenty draws. If they coincide, the
    correct record is a controlled null with real content: the efficiency ratio is a counting artifact
    of multi-pass graphs and carries no information about Argon2''s indexing, which would settle the
    question at low cost and prevent a later record from reading structure into it.'
  independent_variables:
  - t, in {1, 2, 3, 6}
  - q, in {1024, 4096}
  - variant, in {Argon2i, Argon2id}
  - heuristic, in {node-level greedy, cell-aligned greedy}
  - arm, in {real graph, multiplicity-matched null}
  metrics:
    primary:
    - node-to-cell efficiency ratio per cell of the grid
    - number of fully freed cells versus node-level removal-set size
    - measured null efficiency ratio with twenty-draw spread, against its analytic prediction
    - node-level penalty of the cell-aligned variant for a matched cell-level saving
    secondary:
    - per-cell removal-count distribution
    - monotonicity of the ratio in t
    - forced-value check result at t=1
    - fraction of cells one node short of being freed
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The node-to-cell efficiency ratio of the removal sets produced by the lane's existing
      greedy heuristic, and its difference from the multiplicity-matched null.
    formula: Efficiency ratio E = F / (|S| / t), where S is the node-level removal set returned by
      the greedy heuristic at the declared depth threshold and F is the number of memory cells all
      of whose t nodes lie in S. E is forced to exactly 1.0 at t=1. Predicted E < 0.6 at t=3. Predicted
      E weakly decreasing in t. Null E compared against its analytic independence-approximation prediction
      within a declared tolerance.
    source: Pre-registered in the parent proposal IDEA-20260816-1128f8 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at p=1 and q in {1024, 4096}, two to four binary orders below the second
      RFC 9106 recommended tuple''s per-lane block count. The efficiency ratio is a dimensionless
      conversion factor whose value depends on t and on how the removal set distributes across cells,
      and its dependence on q is expected to be weak because it is a density of completed thresholds
      rather than an extensive quantity -- but that expectation is itself checked by including two
      q values rather than assumed. The transfer assumption is stated: a ratio measured at q=4096
      is not asserted to hold at recommended q, and the two-point q sweep exists to show the direction
      of any movement. The extension to p>1 is structural, since the cell index becomes (lane, position),
      and is stated but not run.'
    correspondence: null
  tail_checks:
  - Inspect the fraction of cells that are exactly one node short of being freed, since a removal
    set concentrated just below threshold would make the ratio highly sensitive to small changes in
    the heuristic.
  - Inspect the per-cell removal-count distribution rather than only its summary, since a bimodal
    distribution and a uniform one with the same mean imply very different alignments.
  - Inspect the t=6 cells, where multiplicity is highest and the ratio should be furthest from 1,
    as the strongest test of the monotonicity requirement.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt if the t=1 forced-value check returns anything other than exactly 1.0.
  - Halt if the measured null disagrees with its analytic prediction beyond the declared tolerance,
    since the null would then be unvalidated.
  - Stop and report partial results if wall clock exceeds two hours, recording completed cells; incompleteness
    is a budget outcome and never a claim about the ratio.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The t=1 forced value returns exactly 1.0, the measured null agrees with its analytic
    prediction within tolerance, and the efficiency ratio, the per-cell removal-count distribution,
    the null comparison and the cell-aligned variant's penalty are reported per cell -- irrespective
    of whether the real arm separates from the null.
  falsification_criterion:
  - Efficiency ratio at t=1 is not exactly 1.0.
  - Efficiency ratio at t=3 exceeds 0.6.
  - Measured null disagrees with its analytic prediction beyond tolerance.
  - Efficiency ratio is non-monotone in t.
  - Cell-aligned greedy achieves cell savings at zero node-level penalty.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-1128f8
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The in-place overwrite rule must be read directly from KN-LIT-7f3c21 and written into the contract
    verbatim before approval; it is the record's entire premise and was not among the claims independently
    verified per EV-ARGON-209ece.
  - The analytic null prediction under an independence approximation is asserted to exist but is not
    derived here; the Coordinator must require the derivation and its tolerance before the null can
    serve as a validated control.
  - The cell-aligned greedy variant's preference rule is described qualitatively; its exact tie-breaking
    must be fixed, since an under-specified variant cannot support a claim about the node-level penalty.
  - Whether the all-or-nothing definition of a freed cell is the right one, as opposed to a partial-occupancy
    measure, is a definitional choice with consequences and is left open.
