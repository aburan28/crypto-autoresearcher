  supervisor_child_receipts_in_order:
    - {role: canonical_producer, expected_exit_code: 0}
    - {role: checkpoint_fault_control, expected_exit_code: 75}
    - {role: checkpoint_resume_control, expected_exit_code: 0}
    - {role: isolated_independent_verifier, expected_exit_code: 0}

  independent_verifier_separation:
    separate_process: true
    producer_outputs_closed_before_start: true
    no_in_memory_producer_state: true
    crypto_lib_dependency: false
    producer_package_dependency: false
    shared_implementation_components: []
    forbidden_verifier_source_markers:
      - crypto_lib
      - include!
      - '#[path'
      - ../producer/
      - p192-weighted-cm =
    requirements:
      - Independently implement shell indexing and virtual candidate encoding.
      - Independently regenerate the all-and-only factor base.
      - Independently implement norm division, u64 factorization, roots, orientations, certificate encoders, ideal replay, REL-v2 encoding, disposition parsing, root aggregation, and checkpoint replay.
      - Recompute every BOX-0 status and byte hash; sampling is forbidden.
      - Read only closed producer bytes and predecessor artifacts; never call producer verification code.
      - Snapshot and hash every producer source artifact before and after verification and require byte equality.

  supervisor_custody:
    source_arithmetic: forbidden
    launch_sequence:
      - validate_dispatch_decision_and_clean_sources
      - snapshot_predecessor_and_binary_hashes
      - launch_canonical_producer
      - close_and_snapshot_all_producer_outputs
      - launch_fault_control_expect_75
      - inject_and_fsync_exact_uncommitted_suffixes
      - launch_resume_control
      - compare_all_producer_outputs_roots_counters_prefixes
      - launch_isolated_independent_verifier
      - prove_producer_sources_stable
      - rehash_predecessor_sources_and_binaries
      - write_checkpoint_resume_control
      - write_independent_agreement
      - write_dependency_audit
      - write_supervisor_receipt_after_all_stage_artifacts
      - write_command_environment_framed_streams_raw_result_and_manifest
    refusal_conditions:
      - Decision missing, uncommitted, unauthorized, malformed, or not bound to exact argv and hashes.
      - Protocol checkout is dirty; its HEAD is not the decision commit; the protocol commit is not a strict ancestor; the exact decision is not a regular committed blob; or any protected blob mode/bytes differ at protocol commit, decision commit, or current checkout.
      - RUN_DIR or CONTROL_DIR exists before launch; a path is non-normalized or contains a symlink component; or an output/control/audit path overlaps any predecessor, decision/protocol, binary, repository, or package path except AUDIT_FILE as the literal RUN_DIR/dependency-audit.json child.
      - Source tree dirty, wrong HEAD, non-release binary, or binary hash mismatch.
      - Predecessor binding or any Role-1 PASS gate fails.
      - Child exit differs from its frozen expected code.
      - Producer artifacts change after closure or while verifier runs.
      - Restart-control outputs differ from canonical producer outputs.
      - Any producer or independent check is missing, duplicated, reordered, or not PASS.

  dispatch_decision:
    schema: p192-wcm-role2-box0-dispatch-authorization-v1
    requirements:
      - Fresh Coordinator decision under standing user authorization.
      - Exact admitted protocol, producer, verifier, and supervisor commits or binary hashes.
      - Exact predecessor run id and six predecessor artifact hashes.
      - Exact clean protocol repository/package checkout; decision path is PROTOCOL_REPOSITORY_PATH/ledger/decisions/DECISION_ID.json.
      - Fully resolved normalized absolute RUN_DIR, CONTROL_DIR, AUDIT_FILE, per-role repository/package, binary, predecessor, and factor-base paths with no symlink or forbidden overlap.
      - Exact resolved producer fresh/fault/resume, verifier, and supervisor argv arrays.
      - execution_authorized=true only in the later decision, never in this addendum.
    pre_dispatch_rule: >-
      Before creating either output directory, the supervisor derives decision
      commit D from the clean protocol checkout HEAD, requires admitted protocol
      commit P to be a strict ancestor of D, and requires the exact canonical
      decision bytes at its frozen relative path to equal a regular mode-100644
      Git blob committed at D and to be absent at P.  Every protected
      protocol/interface path is a regular mode-100644 blob with identical bytes
      at P, at D, and in the current checkout.  The supervisor hashes the raw
      decision bytes once and carries decision id, absolute path, D, SHA-256,
      protocol repository path, package path, and clean checkout state into the
      receipt, environment, and success or failure raw result.
    post_run_rule: >-
      Admission requires a post-run validation against the same committed
      decision.  It rehashes every predecessor and run artifact, validates every
      canonical document/JSONL/binary byte stream, replays all status and
      checkpoint conservation, binds exact child argv/commits/binaries to the
      decision, requires restart/agreement/audit/receipt PASS, and requires the
      exact final directory and manifest inventories.  A schema-valid document
      or receipt alone is not cross-document evidence.

  admission_gates:
    - Immutable base hashes pass and this additive payload passes SHA256SUMS.
    - Native producer, independent verifier, and non-arithmetic supervisor are implemented, clean, release-built, tested, and independently reviewed.
    - Role-1 factor-base source provenance and Role-2 producer provenance are separately stated but equal the same clean commit; only verifier and supervisor provenance may name distinct clean commits.
    - The hash-bound Role-1 predecessor passes every producer, independent-verifier, agreement, and supervisor gate before Role-2 dispatch.
    - A fresh Coordinator Role-2 decision binds exact hashes and resolved argv.
    - Producer and verifier regenerate all 262148 candidates with invalid=0 and unresolved=0.
    - The checkpoint/restart control and independent agreement pass.

  claim_boundary:
    permitted_after_valid_role2: >-
      Exact finite BOX-0 counts, roots, retained candidate/relation identifiers,
      and independent replay verdicts only.
    prohibited:
      - Calling Role-2 interface validation or implementation a scientific run.
      - Calling a retained or complete relation a weak curve.
      - Extrapolating BOX-0 counts outside the frozen finite shell.
      - Treating invalid, unresolved, timeout, crash, or resource exhaustion as a mathematical null.
      - Launching BOX-1 before BOX-0 and its independent verification pass.
    current_state: >-
      No Role-2 native implementation or run is admitted by this addendum.
      execution_authorized remains false and scientific_results remains empty.
