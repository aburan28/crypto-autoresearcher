experiment:
  id: EXP-SCURVE-1a8daf
  hypothesis_id: H-SCURVE-ec34c4
  proposal_id: IDEA-20261006-767793
  version: 2
  amendment_decision: DEC-20261007-0ed467
  amendment_path: experiments/EXP-SCURVE-1a8daf/amendments/protocol-amendment.v2.yaml
  version_1_specification: experiments/EXP-SCURVE-1a8daf/specification.yaml
  title: Prospective weighted principal-CM relation search for the P-192 isogeny class
  status: approved
  execution_authorized: false
  scientific_status: not_started
  result_status: no_result
  objective: >-
    Exhaust deterministic centered principal-element boxes, recover complete
    and partial oriented ideal relations, cancel all non-mappable primes
    exactly, and test whether any explicit subgroup-preserving loop produces a
    fully charged end-to-end advantage.  This contract freezes a new family;
    it does not reuse EXP-SCURVE-647ade or report a search result.

  provenance_and_dependencies:
    protocol_base:
      repository: https://github.com/aburan28/crypto-autoresearcher
      base_commit: 96d15ed85c00fbbdd6205beb2bdf02099c576fb5
      base_ref: origin/main
    native_source:
      pull_request: https://github.com/aburan28/crypto/pull/1507
      reviewed_head: 315c7b417305db4f34ad01cb07c18ca2c55181ee
      role: Norm equation, exact ideal orientation, and certificate core only.
      dispatch_gate: >-
        Fetch the PR head, verify the exact commit, require a clean build and
        focused tests, and record the final admitted source commit.  The
        segmented sieve, partial recombination, optimizers, maps, and runner
        are not implied by the reviewed head and must pass separate admission.
    prior_archive:
      pull_request: https://github.com/aburan28/crypto-autoresearcher/pull/1942
      reviewed_head: 5ed7dfbbc02a975e5919bc03b3020f1931e30813
      role: >-
        External prior evidence and boundary comparison only.  Its experiment
        IDs, execution count, results, and branch are immutable and are not
        imported into this family.
    non_reuse_rule: >-
      EXP-SCURVE-647ade names a different L<=2^48 generator-word census.  No
      run below consumes, extends, or is counted as a run of that experiment.

  inputs:
    curve:
      name: NIST P-192 / secp192r1
      model: short Weierstrass y^2 = x^3 + a*x + b over F_p
      p: '6277101735386680763835789423207666416083908700390324961279'
      a: '6277101735386680763835789423207666416083908700390324961276'
      b: '2455155546008943817740293915197451784769108058161191238065'
      generator:
        x_hex: 188DA80EB03090F67CBF20EB43A18800F4FF0AFD82FF1012
        y_hex: 07192B95FFC8DA78631011ED6B24CDD573F977A11E794811
      n: '6277101735386680763835789423176059013767194773182842284081'
      cofactor: 1
      trace_t: '31607402316713927207482677199'
      exact_identities:
        icv1: icv1-fp192-t31607402316713927207482677199-52e4af59
        ec1: EC1P192Cp192h5531c4a08bdb
        curve_uid: urn:ec-record:1:sha256:5531c4a08bdb64b6e86a6e30e9a08aa57edef7af15ac5f6d4d2a83a53bf2f646
      identity_gate:
        - Recompute every identity from the serialized field, curve, generator, order, and cofactor.
        - Verify nonsingularity, G!=O, [n]G=O, and exact #E(F_p)=n from the admitted certificates.
        - Reject before search if any text value, derived value, or identity differs.
    cm_order:
      frobenius_definition: pi is the p-power Frobenius (x,y)->(x^p,y^p) in the geometric endomorphism ring.
      frobenius_polynomial: X^2 - t*X + p
      discriminant_D_pi: '-24109379060336110122544161233113975664949272517896865359515'
      discriminant_D_K: '-24109379060336110122544161233113975664949272517896865359515'
      discriminant_D_End: '-24109379060336110122544161233113975664949272517896865359515'
      discriminant_D: '-24109379060336110122544161233113975664949272517896865359515'
      factorization: -5 * 11 * 31 * C
      C: '14140398275856956083603613626459809774163796198179979683'
      exact_equalities:
        - t^2 - 4*p = D
        - p + 1 - t = n
        - D = -5*11*31*C
      order_assumption: >-
        D_pi=t^2-4p is the Frobenius-order discriminant, D_K is the
        fundamental field discriminant, and D_End is the geometric
        endomorphism-order discriminant.  The certificate must prove
        D_pi=D_K=D_End and End_over_Fbar_p(E)=Z[pi]=O_(D_K); this equality is
        not inferred merely from the phrase CM discriminant.
      mandatory_certificate_gate:
        - Replay native primality certificates for p, n, and C or record authoritative pinned-standard provenance where the contract expressly permits it.
        - Verify p does not divide t (indeed 0<abs(t)<p), so E is ordinary and End^0 over the algebraic closure is the imaginary quadratic field Q(pi).
        - Verify D is squarefree, D=1 mod 4, and fundamental.
        - >-
          Verify the Frobenius-order conductor is one and explicitly derive
          D_pi=D_K=D_End: Z[pi] is already maximal, so the geometric
          endomorphism order containing it cannot be larger.
        - Verify D<-4, hence the unit group of O_D is exactly {+1,-1}; no omitted CM units enlarge the sign/conjugation quotient.
        - Independently replay the integral-basis multiplication pi^2=t*pi-p.
      claim_boundary: >-
        Until every item in the certificate gate passes, maximality and the
        factor base are assumptions and every planned run remains blocked.

  centered_norm_search:
    algebra:
      alpha: u + v*pi
      norm: N(alpha) = u^2 + t*u*v + p*v^2
      centered_coordinate: x = 2*u + t*v
      norm_equation: 4*N(alpha) = x^2 + abs(D)*v^2
      parity: x congruent to t*v modulo 2
      non_scalar_lower_bound:
        expression: ceil(abs(D)/4)
        value: '6027344765084027530636040308278493916237318129474216339879'
        interpretation: Every v!=0 element has norm at least this value; it is not a search result.
    equivalence_and_primitivity:
      - >-
        Since units are {+1,-1}, use v>0 and x>=0 as one fundamental
        domain for the action generated by alpha->-alpha and
        alpha->conjugate(alpha).  In (x,v), these act as (-x,-v) and
        (x,-v); -conjugation flips x while preserving v.  The x=0 boundary
        has a stabilizer and appears once.
      - For each pair set u=(x-t*v)/2 exactly and require integral u.
      - Let g=gcd(abs(u),v).  Rows with g>1 are scalar multiples; record them as normalized duplicates of (u/g,v/g) and exclude them from smoothness-yield and relation counts.
      - >-
        Completeness of that exclusion follows because alpha=g*alpha0 adds
        the rational ideal (g): at split primes its two conjugate valuations
        cancel in the signed coordinate, at ramified primes it contributes an
        even valuation, and inert content is scalar.  Since t is odd and
        u,v are both divisible by g, x/g=2*(u/g)+t*(v/g) is integral; the
        normalized point lies in the same or an earlier nested box.
      - Scalars v=0 are excluded from search and retained only as controls.
    boxes:
      - id: BOX-0
        canonical_shell_id: BOX-0
        v_min: 1
        v_max: 8
        x_min: 0
        x_max: 65536
        raw_pair_count: 262148
        shell: Entire box.
      - id: BOX-1
        canonical_shell_id: BOX-1-minus-BOX-0
        v_min: 1
        v_max: 64
        x_min: 0
        x_max: 1048576
        raw_pair_count: 33554464
        shell: BOX-1 set-minus BOX-0.
        shell_raw_pair_count: 33292316
      - id: BOX-2
        canonical_shell_id: BOX-2-minus-BOX-1
        v_min: 1
        v_max: 256
        x_min: 0
        x_max: 4194304
        raw_pair_count: 536871040
        shell: BOX-2 set-minus BOX-1.
        shell_raw_pair_count: 503316576
    exact_iteration_order: >-
      Process canonical shell IDs BOX-0, BOX-1-minus-BOX-0, and
      BOX-2-minus-BOX-1.  These ASCII spellings are the serialized shell_id
      values; mathematical set-minus notation is descriptive only.  Within each shell,
      sort by increasing v and then increasing x.  For each v, start at
      x=(t*v mod 2), which equals v mod 2 because t is odd, and increment x by
      two through the inclusive bound.  Membership is never reordered or
      pruned by smoothness estimates or empirical weights.
    scalar_sieve_reference_box:
      canonical_shell_id: REF-0
      v_min: 1
      v_max: 2
      x_min: 0
      x_max: 1024
      raw_pair_count: 1025
      purpose: >-
        Frozen producer-versus-independent-verifier byte comparison only.  It
        does not add candidates to the scientific census or authorize timing.
    candidate_index: >-
      Zero-based within each named shell in exact iteration order.  Every byte
      stream and certificate carries both shell_id and this shell-local index.
    stream_encoding_and_digest: >-
      Let S=u32be(UTF8-byte-length(shell_id))||UTF8(shell_id).  A candidate
      record is u64be(v)||u64be(x).  Partition each shell's exact ordered stream
      into logical shards of 1048576 records; the last shard may be short.
      For shard i with n_i records and byte concatenation R_i, define
      C_i=SHA256(ASCII "P192-WCM-CANDIDATE-SHARD-v1\0" || S || u64be(i) ||
      u64be(n_i) || R_i).  For h shards define
      C_shell=SHA256(ASCII "P192-WCM-SHELL-ROOT-v1\0" || S || u64be(h) ||
      concat_(i=0..h-1)(u64be(i)||u64be(n_i)||C_i[32])).  In canonical shell
      order BOX-0, BOX-1-minus-BOX-0, BOX-2-minus-BOX-1, define
      C_family=SHA256(ASCII "P192-WCM-FAMILY-ROOT-v1\0" || u32be(3) ||
      concat_shells(S||C_shell[32])).  No byte-order mark, separator, or
      trailing newline is present.  Parallel workers may compute shards but
      may not change these logical boundaries or aggregation bytes.  Expected digests
      are intentionally pending until an admitted producer and independent
      generator agree; counts above are derived arithmetic, not measured output.
    disposition_digest: >-
      A coverage root alone is insufficient.  For each candidate emit, in
      candidate-index order, u8(status) || u64be(candidate_index) ||
      u8(has_certificates).  has_certificates is one exactly for statuses 1, 2,
      and 3 and is then followed by candidate_certificate_sha256[32] ||
      factorization_certificate_sha256[32]; it is zero for every other status
      and no digest bytes follow.  Status codes are frozen as
      0=nonprimitive_duplicate, 1=complete, 2=one_large_prime,
      3=two_large_prime, 4=rejected, 5=invalid, 6=unresolved.  Shard and root
      this compact indexed stream using the candidate shard's same boundaries.
      For shard i let f_i be its first candidate index, n_i its record count,
      and T_i the concatenated disposition records.  Define
      D_i=SHA256(ASCII "P192-WCM-DISPOSITION-SHARD-v1\0" || S || u64be(i) ||
      u64be(f_i) || u64be(n_i) || T_i).  For h shards define
      D_shell=SHA256(ASCII "P192-WCM-DISPOSITION-SHELL-ROOT-v1\0" || S ||
      u64be(h) || concat_(i=0..h-1)(u64be(i)||u64be(f_i)||u64be(n_i)||D_i[32])).
      In the same canonical three-shell order define
      D_family=SHA256(ASCII "P192-WCM-DISPOSITION-FAMILY-ROOT-v1\0" ||
      u32be(3) || concat_shells(S||D_shell[32])).  No field from the candidate
      root grammar is implicit.  The archive manifest binds both roots; a missing,
      duplicated, out-of-order, or noncanonical has_certificates value is invalid.
    disposition_decision_tree: >-
      Status 0 is used exactly when gcd(abs(u),v)>1.  For a primitive row,
      statuses 1, 2, and 3 are the three retained residual classes below.
      Let L=2147483647.  After exhaustive exact algebraic-base division, R>L^2
      proves by inequality that R cannot be a permitted one-/two-LP residual
      and assigns status 4 without factoring R.  Only R<=L^2 enters the frozen
      deterministic u64 primality/factorization path.  Within that path status
      4 is a fully resolved, mathematically valid residual outside the retention
      policy (more than two LP factors).  Status 5 is an invariant
      violation and invalidates the shell/run: factor/product mismatch, a
      missed algebraic-base divisor, an inert factor, both split orientations
      after primitive normalization, ramified valuation above one, or malformed
      encoding/certificate.  Status 6 is an algorithmic/resource inability to
      finish exact factorization, primality, roots, orientation, or certificate
      replay; it makes the shell INCOMPLETE.  Neither 5 nor 6 is silently
      converted to 4, and a shell containing either cannot advance.

  factor_bases_and_smoothness:
    rational_prime_generation: Deterministic Eratosthenes sieve in increasing order; p itself is excluded.
    kronecker_classification:
      split: kronecker(D,ell)=+1
      ramified: kronecker(D,ell)=0
      inert: kronecker(D,ell)=-1
      ell_2: D mod 8 = 5, so 2 is inert and absent.
    algebraic_sieve_base:
      bound_inclusive: 65521
      members: All and only split or ramified rational primes ell<=65521, in increasing ell order.
      purpose: Relation collection only; membership does not imply a practical explicit map.
    mappable_base:
      bound_inclusive: 113
      members: Every split or ramified rational prime ell<=113, in increasing ell order.
      exact_members: [5, 11, 13, 23, 31, 37, 43, 73, 89, 101, 103, 107, 113]
      directed_orientation_count: 23
      purpose: Final target relation support after exact high-column elimination.
      current_demonstrated_kernel_codomain_frontier:
        maximum_ell: 43
        exact_members: [5, 11, 13, 23, 31, 37, 43]
        directed_orientation_count: 11
        evidence:
          repository: https://github.com/aburan28/crypto
          artifact_commit: aea4dbb0983a37f6463fdbde96e6884871586357
          reviewed_descendant_commit: 315c7b417305db4f34ad01cb07c18ca2c55181ee
          isogeny_routes_sha256: 719846b30348a718d4369c189be74b2d7e52b8de9eb7f0be7f591768183eeba6
          paths:
            - research/isogeny_walk_p192_20261004/runs/p192-ell61-radius2/isogeny_routes.json
        boundary: >-
          These degrees have prior kernel/codomain artifacts, not the point-map,
          dual, subgroup, terminal-isomorphism, or HOT/COLD certificates required
          by this protocol.  Degrees 73, 89, 101, 103, 107, and 113 remain
          unavailable until those exact artifacts and costs pass admission.
      admitted_map_support_at_protocol_freeze:
        exact_members: []
        directed_orientation_count: 0
        boundary: No P-192 degree is mappable under this protocol until the exact directed map-and-cost gate passes.
      obligation: >-
        A used member is still unavailable until both split-root directions,
        or for a ramified prime its unique edge plus directed dual, have
        explicit maps and costs passing admission.
    split_orientation: >-
      Compute both roots of r^2-t*r+p=0 mod ell.  The smaller integer root
      r0 in [0,ell) names positive P=(ell,pi-r0); the larger root r1 names
      conjugate Pbar and a negative exponent.  Store both roots and verify
      r0+r1=t mod ell and r0*r1=p mod ell.
    ramified_orientation: >-
      For the unique ramified prime ideal P, P^2=(ell), so its class order
      divides two (P itself may be principal).  Store its valuation modulo two
      and separately store every removed rational scalar factor.  For primitive
      alpha, v_P(alpha) is zero or one; removed content g contributes
      2*v_ell(g).  Ramified squares are never counted as non-scalar hits.
    primitive_valuation_rule: >-
      Factor N(alpha) by the algebraic base, but determine ideal valuations by
      exact ideal arithmetic/HNF (including prime-power lifts), not only by
      rational divisibility.  A primitive alpha may not retain an inert ideal
      factor or both conjugate orientations after scalar normalization; any
      such event is an invalid-control failure.
    primitive_factor_lemma: >-
      For gcd(u,v)=1: an inert q cannot divide N(alpha), because O_D/q is a
      field and norm zero would force alpha=0 mod q; at split q, both P and
      Pbar cannot divide (alpha), because P*Pbar=(q) would force q|u and q|v;
      at ramified q, v_P(alpha)<=1 because P^2=(q).  Test all three statements
      on fixtures and reject violations.
    exact_ideal_convention: >-
      In the integral basis (1,pi), P_r=(ell,pi-r) has column HNF generated by
      (ell,0) and (-r,1).  The principal ideal (u+v*pi) is generated by columns
      (u,v) and (-p*v,u+t*v).  Higher split valuations use a Hensel-lifted root
      and ideal-power HNF.  The signed split coordinate is
      v_(P_r0)(alpha)-v_(P_r1)(alpha); rational congruence u+v*r=0 mod ell is
      only a first-divisibility check, never the certificate.
    exhaustive_sieve_rule: >-
      Every primitive candidate receives exact division and valuation
      accounting, either directly or after a rigorously one-sided segmented
      residue-class score proves which factors remain to divide.  A floating
      log score or heuristic threshold may propose work but may never reject a
      candidate.  Include prime-power markings, bounded-memory shards,
      checkpoint/resume with shard hashes, and exact phase counters.
    checkpoint_schema: >-
      Each shell has its own checkpoint-chain.jsonl.  Checkpoints occur only
      after disposition.bin, retained-candidates.jsonl, and every retained
      relation/certificate append for a complete logical shard are closed and
      fsynced.  Candidate record bytes R_i are a virtual deterministic stream:
      they are regenerated from the exact shell iterator on resume and are not
      persisted as a separate candidate-shard artifact.  Disposition records
      T_i are persisted in disposition.bin.  checkpoint-chain.jsonl contains one
      RFC-8785 object plus LF per completed shard, written to a same-directory
      temporary file, fsynced, and atomically renamed.  Each object has exactly
      schema, curve_uid, protocol_commit, producer_commit,
      producer_binary_sha256, factor_base_sha256, shell_id, shard_index,
      first_candidate_index, record_count, candidate_shard_sha256,
      disposition_shard_sha256, next_candidate_index, phase_counters,
      committed_outputs, and previous_checkpoint_sha256; schema is
      p192-wcm-checkpoint-v1.  committed_outputs has exactly the four keys
      disposition.bin, retained-candidates.jsonl, complete-relations.jsonl,
      and partial-relations.jsonl.  Each value has exactly byte_length and
      prefix_sha256; byte_length is a minimal nonnegative decimal string and
      prefix_sha256 hashes exactly that committed prefix.
      protocol_commit is the final admitted protocol Git commit and
      producer_commit is the same final admitted native producer Git commit
      recorded as factor-base source_commit; both are lowercase 40-hex.  SHA
      fields are lowercase 64-hex, and the first previous hash is 64 zeroes;
      later values hash the prior canonical object bytes without its LF.
      phase_counters are cumulative and shell-local and have exactly seen,
      primitive, duplicate, complete, one_lp, two_lp, rejected, invalid,
      unresolved as minimal nonnegative decimal strings.  Every checkpoint
      satisfies seen=next_candidate_index, seen=duplicate+primitive, and
      primitive=complete+one_lp+two_lp+rejected+invalid+unresolved.  Resume
      first validates the last committed checkpoint, then regenerates and
      rehashes all completed candidate shards, rereads and rehashes all
      completed disposition shards, requires
      contiguous shard indices and candidate intervals with no gap/duplicate,
      and resumes only at next_candidate_index.  After validating each
      committed prefix hash, resume truncates each append file to its recorded
      byte_length before accepting or deleting any next-shard temporary data;
      a shorter file or prefix mismatch invalidates the shell.  Temporary,
      partial, or uncommitted suffix bytes for the next shard are never treated
      as complete.  Checkpoints never enter the candidate or disposition roots.
      Clean and interrupted/resumed controls must yield byte-identical final
      files, roots, and counters; otherwise the shell is invalid.
    large_prime_rules:
      bound_inclusive: 2147483647
      maximum_count: 2
      complete: Residual R=1 after exact base division.
      one_large_prime: >-
        R=q, where 65521<q<=2147483647, q is deterministically proven prime,
        kronecker(D,q)=+1, and its exact oriented ideal valuation is stored.
      two_large_prime: >-
        R=q1*q2 exactly, where 65521<q1<=q2<=2147483647, both factors are
        deterministically proven prime, both split in O_D, multiplicity is
        retained, and both exact orientations are stored.  The residual fits
        below 2^62; factorization and multiplication are checked without
        probabilistic acceptance.
      rejected_status_4:
        - R>(2147483647)^2 after exhaustive exact algebraic-base division; the inequality alone proves it cannot satisfy the retained LP policy.
        - For R<=(2147483647)^2, deterministic u64 factorization proves more than two prime factors with multiplicity or a prime above 2147483647.
      invalid_status_5:
        - A primitive residual contains an inert prime or a missed prime at or below 65521.
        - A partial is treated as a complete relation before its large-prime boundary cancels exactly.
        - Exact factor/product or oriented ideal invariants disagree.
      unresolved_status_6:
        - Primality, exact factorization, roots, oriented ideal valuation, or certificate replay cannot finish within the frozen implementation/resource gate.

  relation_encoding_and_recombination:
    factor_base_manifest: >-
      Canonical JSON (RFC 8785) binds D, t, p, both bounds, every ell,
      Kronecker class, roots, positive orientation, schema, and algebraic
      source commit.  Map availability is deliberately absent so relation IDs
      remain stable.  A frozen schema requires every integer outside the
      interoperable JSON range [-2^53+1,2^53-1] to be a minimal canonical
      decimal string; numeric/string types may not vary across producers.  Its
      SHA-256 is embedded in every candidate and relation.  source_commit is
      the exact final admitted producer Git commit, encoded as 40 lowercase
      hexadecimal characters; it is not the earlier reviewed prerequisite head.
      If J is the exact no-newline JSON byte string, factor-base.sha256 is
      hex(SHA256(J)) || ASCII "  factor-base.json\n", with lowercase hex.
    factor_base_manifest_schema:
      schema_value: p192-wcm-factor-base-v1
      exact_top_level_keys: [schema, curve_uid, p, t, D, algebraic_bound, mappable_bound, source_commit, entry_count, entries]
      big_integer_fields: [p, t, D]
      big_integer_encoding: Minimal base-10 strings; zero is "0", negatives have one leading minus, and leading zeroes are forbidden.
      bounded_integer_encoding: JSON numbers exactly representable in the interoperable range.
      entries: >-
        An array in strictly increasing ell.  Each object has exactly
        {ell,kind,kronecker,roots,positive_root_index}; kind is numeric 0 split
        or 1 ramified, kronecker is respectively 1 or 0, roots are increasing
        JSON integers in [0,ell), with length two for split and one for
        ramified, and positive_root_index is always zero.  entry_count equals
        the array length.  UTF-8 RFC-8785 bytes have no BOM or trailing newline.
      first_entry_fixture: '{"ell":5,"kind":1,"kronecker":0,"positive_root_index":0,"roots":[2]}'
    map_support_manifest: >-
      A separate versioned manifest binds directed source/target UIDs, map and
      kernel certificate hashes and cost records for admitted maps only.
      Attempt outcomes, including unavailable and failed records, live in the
      separate map-attempt-dispositions.jsonl with their exact hashed records
      in map-attempt-evidence.jsonl.  Mapped candidates reference the manifest
      SHA-256; updating map support never rewrites an algebraic candidate or
      relation ID.
    map_support_manifest_schema: >-
      map-support.json is UTF-8 RFC-8785 JSON with exact top-level keys schema,
      curve_uid, factor_base_sha256, source_commit, record_count, and records;
      schema is p192-wcm-map-support-v1.  source_commit is the exact final
      admitted map producer Git commit as 40 lowercase hex.  Records are strictly sorted by
      (source_uid,target_uid,ell,root,orientation) and each has exactly those
      five keys plus kernel_certificate_sha256,
      map_certificate_sha256, dual_certificate_sha256,
      hot_cost_sha256, and cold_setup_cost_sha256.  orientation is positive,
      negative, or ramified; all five digest fields are lowercase 64-hex
      strings.  Terminal isomorphisms belong to the composite-candidate
      certificate and terminal-isomorphisms.jsonl, not an intermediate edge.
      record_count equals
      the array length.  The JSON
      bytes have no BOM or trailing newline.  map-support.sha256 is lowercase
      hex SHA-256 of those exact bytes, two ASCII spaces, the literal
      "map-support.json", and one LF.  The strict manifest at protocol freeze
      has records=[] and record_count=0; no degree is implicitly admitted.
    map_attempt_dispositions_schema: >-
      map-attempt-dispositions.jsonl has one RFC-8785 object plus LF for every
      frozen directed panel member in panel order.  Each object has exactly
      panel_index, relation_id, directed_variant_id, status, reason_code,
      map_support_record_indices, and evidence_sha256.  status is REALIZED,
      UNAVAILABLE, FAILED, or UNRESOLVED.  For REALIZED, the support field is
      the ordered array of zero-based map-support.json record indices used by
      the composite edge circuit, in edge order with duplicates retained for
      repeated edges; it must equal the composite certificate's ordered index
      array.  For every other status it is the empty array.  evidence_sha256
      is always lowercase SHA-256 of the exact corresponding RFC-8785 object
      bytes in map-attempt-evidence.jsonl, excluding its one terminating LF.
      No member may be omitted or duplicated.
    map_attempt_evidence_schema: >-
      map-attempt-evidence.jsonl has exactly one RFC-8785 object plus LF per
      frozen directed panel member, at the same zero-based line/panel index as
      map-attempt-dispositions.jsonl.  Each object has exactly schema,
      panel_index, relation_id, directed_variant_id, status, reason_code,
      map_support_record_indices, and composite_certificate_sha256; schema is
      p192-wcm-map-attempt-evidence-v1.  Identity, status, reason, and the
      ordered support-index array must equal the disposition.  REALIZED
      requires a nonempty support array and a lowercase SHA-256 of the exact
      corresponding RFC-8785 composite-map-certificates.jsonl object bytes,
      excluding LF; every other status requires an empty array and null
      composite_certificate_sha256.  Thus evidence_sha256 has one defined byte
      target for successes, failures, unavailability, and unresolved attempts.
    integer_encoding: >-
      nat(z) for z>=0 is u32be(byte_length) followed by minimal unsigned
      big-endian magnitude, with zero encoded by length zero.  sint(z) is one
      sign byte (0 zero, 1 positive, 2 negative) followed by nat(abs(z)); zero
      must use sign zero.  This arbitrary-precision encoding is used for every
      exponent and coefficient; no i64 truncation is permitted.
    coordinate_vector:
      split: Arbitrary-precision signed exponent v_P(alpha)-v_Pbar(alpha) at the canonical smaller root.
      ramified: Canonical bit in {0,1}; even valuation is recorded as a removed scalar.
      order: Increasing ell, with one coordinate per algebraic-sieve-base split or ramified prime; map-admission state is irrelevant.
      zero_policy: Zero entries are omitted from serialization but restored from the manifest index.
    generator_normalization: >-
      Before hashing a non-scalar principal generator beta=a+b*pi, compute
      x_beta=2*a+t*b and choose the unique representative in the same
      {unit,conjugation} fundamental domain b>0 and x_beta>=0; x_beta=0 keeps
      its single stabilized representative.  Conjugation jointly replaces
      (z,c,beta) by (-z,-c,conjugate(beta)), followed by the required unit sign;
      replay HNF after this joint transformation.  Never canonicalize beta
      while leaving its relation vector/source coefficients unchanged.  Scalar
      b=0 rows are classified separately and never enter the relation lattice.
      Directed conjugate variants are derived only after this normalization.
    candidate_certificate_bytes: >-
      ASCII "P192-WCM-CAND-v1\0" || u8(type) ||
      u32be(len(curve_uid)) || UTF8(curve_uid) || factor_base_sha256[32] ||
      u32be(len(shell_id)) || UTF8(shell_id) || u64be(candidate_index) ||
      u64be(v_box) || u64be(x_box) || sint(u) || sint(v) || nat(N) ||
      nat(scalar_content) || u32be(factor_count) || rational_factors ||
      u32be(small_entry_count) || small_entries || u32be(lp_entry_count) ||
      lp_entries.  type is 0 complete, 1 one-LP, 2 two-LP.  A rational factor
      is nat(prime)||nat(exponent) and this list contains exactly the
      algebraic-sieve-base part of N, in increasing prime order; residual LPs
      occur only in lp_entries and are not duplicated here.  The out-of-band
      sqrt(D) control binds C in its separate control certificate and is not a
      retained CAND-v1 record.  A small entry is
      u32be(ell)||u8(kind)||sint(exponent), with kind 0 split and 1 ramified;
      no other kind is valid.  An LP entry is
      u32be(q)||u32be(smaller_root)||u32be(larger_root)||u8(sign)||nat(multiplicity),
      with sign 1 smaller-root/positive and 2 larger-root/negative.  All lists
      are in increasing prime order.  candidate_id is lowercase hex SHA-256 of
      these bytes.  This binds partial type, incidence, shell, centered point,
      norm, factorization, and scalar content.
    factorization_certificate_bytes: >-
      ASCII "P192-WCM-FACT-v1\0" || candidate_sha256[32] || nat(N) ||
      u32be(factor_count) || rational_factors || nat(residual) ||
      u8(residual_type) || u32be(lp_entry_count) || lp_entries.
      candidate_sha256 is exactly the raw 32-byte SHA-256 whose lowercase-hex
      rendering is candidate_id and whose same raw bytes appear as
      candidate_certificate_sha256 in the disposition record.  Rational
      factors and LP entries use exactly the candidate-certificate encodings
      and ordering.  rational_factors again contain only algebraic-base
      factors.  residual_type is 0 complete, 1 one-LP, or 2 two-LP and
      must equal the candidate type; residual is respectively 1, q, or q1*q2.
      The verifier recomputes every deterministic primality/Kronecker/root
      check and the exact product N=(product prime^exponent)*residual.
      factorization_certificate_sha256 is SHA-256 of these bytes.
    relation_bytes: >-
      ASCII "P192-WCM-REL-v2\0" || u32be(len(curve_uid)) || UTF8(curve_uid)
      || factor_base_sha256[32] || sint(beta_a) || sint(beta_b) || nat(N_beta)
      || nat(scalar_content) || u32be(entry_count) || entries ||
      u32be(source_count) || sources.  Each entry is
      u32be(ell)||u8(kind)||sint(exponent), increasing ell, kind 0 split and 1
      ramified; ramified exponents must equal one.  Each source is
      candidate_or_relation_sha256[32]||sint(combination_coefficient), sorted
      by source digest.  A direct complete row has one source coefficient one;
      a recombined row lists every nonzero source.  relation_id is lowercase
      hex SHA-256 of these bytes.
    direct_certificate:
      - Exact alpha=(u,v), N(alpha), complete rational factorization, scalar part, and oriented ideal factorization.
      - >-
        Recomputed coordinate vector, form composition to principal, and
        independent ideal-HNF equality using P_r columns (ell,0),(-r,1) and
        principal columns (u,v),(-p*v,u+t*v).
      - >-
        Record lambda=u+v mod n for alpha and
        lambda_bar=u+(t-1)*v mod n (equivalently u+p*v mod n) for conjugate(alpha),
        with lambda*lambda_bar=N(alpha) mod n.  Conjugation is not scalar negation.
    partial_matrix: >-
      Give each split large prime q one signed column using its smaller-root
      orientation.  For partial i store small row s_i and exact sparse large
      row l_i.  Recombination coefficients c are valid only when the exact
      arbitrary-precision product sum_i c_i*l_i is the zero vector.  Split
      small coordinates sum over Z.  For ramified ell, define
      w_ell=sum_i c_i*s_(i,ell), r_ell=w_ell mod 2 in {0,1}, and
      formal k_ell=(w_ell-r_ell)/2.  J uses P_ell^r_ell and its norm uses
      ell^r_ell; never map, cost, or serialize abs(w_ell) as a canonical
      ramified exponent.  Under the integral-conjugate realization below,
      conjugation fixes a ramified P: exact replay computes
      h_ell=sum_i abs(c_i)*s_(i,ell) and removes scalar exponent
      (h_ell-r_ell)/2.  The signed k_ell is only a parity/ILP variable and
      never certifies positive scalar content.
    deterministic_recombination: >-
      Sort partials by candidate_id, the SHA-256 of their candidate certificate
      bytes.  A signed-graph
      fundamental-cycle pass may propose squarefree combinations, using
      lexicographic vertices and edges, but it is never authoritative or a
      completeness certificate.  Compute a saturated Z-basis K of ker(L^T)
      with an exact fraction-free HNF/SNF certificate, verify L^T*K=0, sort
      basis vectors by (l1 norm, support, signed lexicographic coefficients),
      and search only coefficient combinations inside the separately frozen
      solver bound abs(c_i)<=1048576.  The kernel is infinite; exhaustion of
      that bounded combination search is never called exhaustion of the
      kernel.  Realize negative coefficients integrally as
      A(c)=product_(c_i>=0) alpha_i^c_i times
      product_(c_i<0) conjugate(alpha_i)^(-c_i), with every ideal orientation
      dualized in the latter product.  Certify (A(c))=(g)*J(z) for a positive
      integer g, beta=unit*A(c)/g in O_D, and nat(scalar_content)=g; derive g
      from the actual conjugated ideal multiset, including paired split
      valuations and the ramified h formula, not from formal parity variables.  For the
      mixed-module projection z form
      J(z)=product P0^max(z,0)*P1^max(-z,0), with ramified bit factors.  Obtain
      beta=a+b*pi independently and certify HNF(J)=HNF((beta)) and
      N(beta)=product_split ell^abs(z_ell) times
      product_ram ell^r_ell exactly, where every ramified r_ell is the
      projected bit in {0,1}, never the pre-projection signed valuation.
      Any scalar removed from a
      pre-normalized product is recorded separately and is absent from J and
      this equality.  Reapply the ceil(abs(D)/4) bound to every non-scalar beta and
      issue a new relation certificate; do not assume a formal quotient of
      source alphas is already its primitive generator.
    high_column_elimination: >-
      Build the exact relation matrix for complete and recombined rows.  Find
      a saturated Z-basis for the kernel of columns 113<ell<=65521 with an
      exact HNF/SNF certificate, independently replay zero high support, and
      search only the same frozen coefficient bound.  Only then send relations
      supported on the mappable base to map construction.  No high-degree edge
      is silently assigned zero cost, and bounded search is not called complete
      enumeration of the infinite kernel.
      Every retained combination then repeats the complete certificate
      pipeline: mixed-module parity/scalar accounting, joint generator/vector
      normalization, J(z) and principal HNF equality, exact norm and lower
      bound, both eigenvalues, ordered sources, and a fresh relation_id.  A
      high-column kernel vector plus source certificates is not map-admissible.
    coordinate_manifest_schema: >-
      Each kernel stage writes UTF-8 RFC-8785 JSON with exact top-level keys
      schema, stage, factor_base_sha256, column_count, and columns; schema is
      p192-wcm-coordinate-manifest-v1 and stage is lp or high-column.  Columns
      are sorted by increasing prime and have exactly index, kind, prime,
      roots, positive_root_index, coefficient_module, and
      orientation_convention.  index is contiguous zero-based; kind is split,
      ramified, or large_prime; roots are increasing JSON integers, length two
      for split/large_prime and one for ramified; positive_root_index is zero;
      coefficient_module is Z for split/large_prime and Zmod2 for ramified;
      orientation_convention is signed_smaller_root or ramified_bit.  LP
      columns contain every dynamic oriented large-prime boundary appearing in
      the ordered partial rows.  High-column columns contain every algebraic-
      base coordinate with ell>113, whether or not its observed column is zero.
      The exact filenames are lp-coordinate-manifest.json and
      high-column-coordinate-manifest.json.  Each JSON has no BOM/newline.  If
      J is its exact JSON byte string and F its literal JSON filename, its
      sidecar F with suffix .json replaced by .sha256 contains
      hex(SHA256(J)) || ASCII "  " || F || LF, with lowercase hex.
    kernel_certificate_schema: >-
      Canonical RFC-8785 JSON with exact top-level keys schema, stage,
      coordinate_manifest_sha256, ordered_row_ids, matrix_rows, matrix_cols,
      matrix_entries, kernel_cols, kernel_entries, left_inverse_entries,
      rank_minor_rows, rank_minor_cols, rank_minor_determinant, and
      producer_hnf_sha256.  schema is p192-wcm-kernel-proof-v1; stage is lp or
      high-column.  Dimensions are JSON integers; every matrix, kernel,
      left-inverse, and determinant entry is a minimal signed decimal string,
      stored row-major.  For A of size r by m and K of size m by k, the
      three flattened arrays have lengths r*m, m*k, and k*m respectively;
      rank_minor_rows and rank_minor_cols are strictly increasing zero-based
      index arrays of length m-k, and the determinant is recomputed exactly.
      The
      independent verifier checks A*K=0, H*K=I_k for the supplied k by m H,
      and the supplied nonzero (m-k)-by-(m-k) minor of A.  These prove
      that K is the full saturated integer kernel; the producer HNF digest is
      provenance only and is never trusted as the independent proof.
    duplicate_rule: >-
      Quotient only exact global sign/conjugation equivalences, identical
      serialized vectors, and explicit scalar multiples.  Do not divide a row
      by gcd(exponents) unless a new principal alpha certificate proves the
      divided row.
    directed_variant_rule: >-
      One algebraic relation_id canonically represents the pair alpha and
      conjugate(alpha), but emit directed_variant_id suffixes ":positive" and
      ":negative".  Retain and map/cost both variants independently; global
      conjugation must not collapse direction-specific HOT or COLD costs.
    chain_order: >-
      Realize a directed variant by increasing ell, repeating each signed split
      orientation abs(exponent) times, followed at that same ell by its
      ramified bit when applicable.  Use the admitted deterministic
      short-Weierstrass Velu/kernel formula, reduce every coefficient to its
      least residue in [0,p), retain its exact codomain representation without
      an implicit isomorphic rescaling, and assign that representation its own
      EC1/UID.  Any explicit model conversion is a separately hashed and
      charged map.  This canonical order and model rule, not
      commutativity of ideal classes, defines the measured path.  Role 5 uses
      unit-weight structural discovery only; after every frozen panel member
      is attempted, role 6 ranks realized paths from their actual tuples.  This
      version does not claim cost optimality over other edge permutations.

  candidate_generation_and_post_map_ranking:
    phase_order: >-
      Role 5 generates and hash-freezes a finite structural candidate panel
      without map availability, timings, HOT/COLD tuples, or Q32 weights.  Role
      6 then calibrates Q32, attempts every frozen directed panel member in
      cost-independent canonical order, records exact map dispositions and raw
      tuples, and only afterward forms Pareto layers and Q32 display rankings.
      There is no cost feedback into relation discovery and no second lattice
      search.  Thus unavailable maps or a role-6 timeout cannot bias which
      panel members were proposed; omitted role-6 dispositions make coverage
      INCOMPLETE.
    structural_common_input: >-
      Exact mixed relation module Z^(split) direct-sum (Z/2Z)^(ramified) of
      nonzero primitive certified relation vectors and relation-to-alpha
      certificates.  No direction/source-specific map cost exists at this
      stage.  LLL/BKZ use an integer lift with formal auxiliary generators
      2*e_ram; ILP may instead use explicit parity variables.  Auxiliary
      generators are tagged scalar identities, never presented or retained
      alone as non-scalar relation rows.  Every output projects ramified
      coordinates modulo two, moves even pairs into scalar content, and is
      replayed in the mixed module.
    structural_objectives:
      - Use unit coordinate weights only; HOT, COLD, Q32, degree medians, and map availability are forbidden inputs.
      - Record projected l1, support, maximum ell, exact norm bit length, and coefficient l1 for diagnostics.
      - ILP schedule A lexicographically minimizes projected l1, support, maximum ell, then coefficient l1; schedule B swaps the first two fields.
    lll:
      implementation_choice: fplll 5.5.0 proved LLL, binary and strategy hashes pinned at admission.
      parameters:
        delta: 99/100
        eta: 51/100
        precision_bits: 256
        maximum_swaps: 10000000
        input_orders:
          - relation_id lexicographic
          - reverse relation_id lexicographic control
      budget: One proved reduction per input order using unit coordinate weights.
    bkz:
      implementation_choice: fplll 5.5.0 deterministic single-thread BKZ; every output is candidate-only until exact replay.
      seed: '0x5031393257434d31'
      block_sizes: [20, 30, 40]
      tours_per_block: 2
      enumeration_node_cap_per_tour: 10000000
      auto_abort: false
      rerandomization: false
      initialization_and_snapshots: >-
        For each input order, each block size starts independently from that
        order's final proved-LLL basis, runs exactly two tours, and snapshots
        the entire terminal basis after tour one and tour two.
      budget: At most 6 tours per input order; node-cap exhaustion is censored, not negative evidence.
    ilp:
      implementation_choice: SCIP 9.2.1 deterministic single-thread MILP, binary hash pinned at admission.
      formulation: >-
        Integer coefficients c form the split coordinates z=R^T*c; split every
        signed split z_j into z_j^+-z_j^-.  For each ramified column impose
        sum_i c_i*R_(i,r)=b_r+2*k_r with binary b_r and integer k_r; only b_r
        survives projection.  Enforce zero high columns and nonzero after this
        mixed-module projection, with abs(c_i)<=1048576.  Run structural
        schedules A and B in both input orders.  A final incumbent is retained
        even when its solve is censored, with the censoring state attached.
      node_cap: 50000000
      wall_clock_seconds: 259200
      relative_gap: 0
      exactness_rule: >-
        Feasible solutions are independently replayed with exact integers.
        The word optimal is permitted only when a zero-gap/proof record is
        independently checked; otherwise report BEST_FOUND_WITHIN_BUDGET.
    structural_panel_retention: >-
      Retain every nonzero, non-scalar, independently replayed row of each of
      the two terminal proved-LLL bases; every such row in each of the twelve
      BKZ tour snapshots; and the one final feasible ILP incumbent, if any, for
      each of two schedules in each input order.  Derive both directed variants,
      deduplicate by (relation_id,directed_variant_id), and sort by that pair.
      If r is the lifted relation-basis rank, this rule emits at most 28*r+8
      directed records before deduplication.  No timing, weight, map outcome,
      or arbitrary top-k cap may filter it.  The RFC-8785 manifest
      structural-candidate-panel.json binds factor-base and source-artifact
      hashes, solver binary/strategy/receipt hashes, every ordered relation and
      directed-variant certificate hash, censoring labels, and candidate_count;
      structural-candidate-panel.sha256 uses the standard lowercase-hex,
      two-space, literal-filename, LF sidecar convention.
    post_map_ranking: >-
      Role 6 iterates the frozen panel only in increasing
      (relation_id,directed_variant_id), attempts and certifies each exact
      chain, and emits exactly one REALIZED, UNAVAILABLE, FAILED, or UNRESOLVED
      disposition per member.  A timeout or missing disposition makes the
      stage INCOMPLETE.  Only after all dispositions are closed are three exact
      componentwise Pareto decompositions computed over REALIZED members: one
      on the six HOT components, one on the six COLD_TOTAL components, and one
      on the joint 12-vector HOT||COLD_TOTAL.  In each decomposition, x
      dominates y iff every component of x is <= the corresponding component
      of y and at least one is strictly smaller; layer zero is the nondominated
      set and later layers are obtained by iterative removal.  Q32 produces
      the pair (hot_q32,cold_q32) and orders display lexicographically by
      (joint_layer,hot_layer,cold_layer,hot_q32,cold_q32,relation_id,
      directed_variant_id).  It cannot alter map attempt order, membership,
      disposition, any raw dominance relation, or layer membership.
      selected-vectors.json is exactly joint layer zero, sorted by that display
      key; it is not a claim of global or lattice-wide cost optimality.
      realized-panel-ranking.json preserves every disposition, both raw tuples,
      all three layer indices, both Q32 totals, and the display rank.
    solver_admission:
      - Exact-kernel fixtures and D=-23 controls pass in two row orders.
      - Reversing row order does not change the accepted lattice, only candidate discovery order.
      - Every panel vector is reconstructed from source rows and independently certified.
      - The panel hash is fixed before role 6 opens any calibration, map, or cost output.

  cost_contract:
    tuple_field_order:
      - FpM
      - FpS
      - FpI
      - FpAddSub
      - polyCoeffM
      - logicalBytesRW
    tuple_semantics: >-
      Every component is an unsigned arbitrary-precision integer.
      polyCoeffM counts actual base-field coefficient products, not opaque
      polynomial-library calls.  The tuple buckets are disjoint: FpM excludes
      every base-field product already charged to polyCoeffM, while FpS and
      the remaining fields likewise record only operations not charged to
      another bucket.  logicalBytesRW is attributable bytes read plus written.
      Peak RSS and artifact bytes are separate nonadditive metrics.
    HOT: >-
      Sum the fixed tuple over online evaluation of every directed edge,
      intermediate model conversion, terminal F_p-isomorphism, subgroup check,
      and candidate action on G.  The generic subgroup proof plus G is the
      pre-holdout control; role 6 contains no planted Q or substitute curve-
      point panel.  Planted points are derived only after role 7's salt reveal
      and receive separate transfer certificates and whole-attack accounting
      there.  Prebuilt immutable maps may be reused; cache population is
      excluded only when the arm and baseline both start from the same declared
      hot state.
    COLD_SETUP: >-
      Sum the same tuple from an empty experiment cache over root and kernel
      construction, isogeny and dual maps, all model conversions, verification,
      serialization/deserialization, and cleanup.  Failed candidate builds
      are charged to selection cost.
    COLD_TOTAL: >-
      Componentwise COLD_SETUP + HOT.  Every edge and composite record must
      satisfy this identity exactly; the report may abbreviate COLD_TOTAL as
      COLD only after stating the identity.
    directed_edge_rule: >-
      Store a separate record for each actual source UID, target UID, ell,
      root, and positive/negative/ramified orientation.  Never reuse a
      prime-keyed or generator-median cost as a measured path cost.  No proxy
      ranks or filters the frozen panel before its canonical map attempts;
      final tuples sum realized directed-edge records and terminal costs.
    discovery_cost: >-
      Report relation search and solver costs separately.  A whole-method cold
      claim includes them, rejected-candidate costs, and map certification in
      the unamortized total.  An amortized view is additional only and must
      freeze and report the public-precomputation reuse count N.
    whole_attack_ledger: >-
      The map tuple is not a complete DLP ledger.  Any exact-consumer amendment
      must add arbitrary-precision, non-saturating phase counts for map/action
      load and validation; target-independent and target-dependent setup;
      branches and starts; group additions and doublings; each psi, inverse,
      negation, orbit comparison, and canonicalization; Z_n additions,
      multiplications, and inversions; point encodings and comparisons; hash
      calls and bytes; distinguished-point probes, reads, writes, and full-key
      comparisons; dead trails, cycles, and restarts; collision recovery; final
      verification; and cleanup.  Instrumented count replay and uninstrumented
      timing may be separate only when they hash-bind identical inputs and
      outputs.  HOT includes all per-target work from the declared prevalidated
      map state; COLD includes the unamortized discovery/construction total plus
      HOT.  Failures and timeouts remain in every denominator.
    ratio_estimand_gate: >-
      No scalar advantage ratio is defined in this version.  Q32 remains
      ranking-only and may never price a cryptographic claim.  The exact-
      consumer amendment must preregister measured uninstrumented CPU cycles as
      the implementation-scoped scalar estimand while retaining raw tuples and
      a separate conservative full-order security valuation.  Componentwise
      dominance remains diagnostic but cannot satisfy the scalar ratio claim
      tiers in this version.  Wall time is supportive and the rule may not
      change after targets are opened.
    secondary_metrics:
      - CPU cycles and wall nanoseconds by phase
      - peak resident bytes and archive bytes
      - number of unavailable, failed, duplicate, and rejected candidates
    q32_projection:
      status: ranking_only
      normalization: FpM weight equals 2^32.
      calibration_panel: >-
        Sixteen deterministic nonzero field inputs are rejection-sampled from
        SHAKE256("P192-WCM-Q32-v1"||u32be(index)).  Use one warmup and 11
        measured repetitions per primitive in deterministic ABBA order.
      rule: >-
        For component k, take the median paired time ratio to FpM within each
        fixed case, then the median across cases, and round 2^32 times that
        ratio to nearest integer with ties to even.  Bytes use identically
        scheduled pinned-buffer read/write microkernels.  Hash the environment,
        raw samples, formula, and resulting integer vector.
      prohibitions:
        - Q32 may rank only fully dispositioned realized frozen-panel candidates; it may not change boxes, factor-base membership, smoothness, relation acceptance, panel membership, map-attempt order, raw Pareto dominance, or certificate validity.
        - A scalarized Q32 total may not replace the raw HOT/COLD tuples or establish cryptographic security.
        - Recalibration on another host creates a new ranking artifact; it does not rewrite this contract.
      sensitivity: >-
        Report median, MAD, IQR, full case range, and leave-one-case-out
        candidate-rank stability.  The 16 fixed cases are a coverage panel, not
        iid population draws; do not attach a population confidence interval.

  explicit_map_and_transfer_certificates:
    edge_certificate_fields:
      - source ICV1, EC1, curve UID, full coefficients, field, and subgroup tuple
      - target identities and full coefficients
      - ell, both Frobenius roots, selected orientation, and oriented ideal identifier
      - >-
        Global orientation proof on the actual source: with Frobenius
        pi_source:(x,y)->(x^p,y^p), certify the scheme-theoretic intersection
        E[ell] intersect ker(pi_source-[r]) = E[(ell,pi_source-r)] as a
        separable cyclic subgroup scheme of order ell, by
        quotient-algebra/torsion evidence.  The full ker(pi_source-[r]) is
        generally much larger; root metadata alone is insufficient.
      - kernel polynomial coefficients and SHA-256
      - rational map numerators/denominators, exceptional divisor, coefficient SHA-256, and field of definition
      - dual map and symbolic dual-composition equality [ell]
      - input/output point identities, calibration case, codomain normalization isomorphism, and raw HOT/COLD_SETUP/COLD_TOTAL tuples
    composite_certificate_fields:
      - Ordered signed relation vector and exact edge list, including every intermediate curve identity.
      - >-
        Product degree, ordered edge-circuit hash, projective edge-by-edge
        evaluator, per-edge exceptions, and accumulated costs.  An expanded
        composite rational function or global pole polynomial is not required
        at approximately 192-bit degree.
      - >-
        Terminal F_p-isomorphisms eta_pos and eta_conj back to the exact source
        EC1/UID, not merely equal j-invariant, plus independently recorded
        units epsilon_pos and epsilon_conj in {+1,-1} proving eta_pos composed
        with Phi_pos=[epsilon_pos*beta] and eta_conj composed with
        Phi_conj=[epsilon_conj*conjugate(beta)].
      - >-
        Exact beta=(a,b), norm, lambda_positive=epsilon_pos*(a+b) mod n,
        lambda_conjugate=epsilon_conj*(a+(t-1)*b) mod n, the corresponding
        unit-adjusted norm-product check, and relation/HNF references.
    pre_holdout_generator_subgroup_certificate:
      - Verify gcd(product_degree,n)=1.
      - >-
        Prove each separable ell-map restricts to an isomorphism on the
        order-n subgroup because gcd(ell,n)=1; its inverse there is
        [ell^(-1) mod n] composed with the dual.  Point checks below are
        controls supplementing, not replacing, this proof.
      - On every edge verify G_i!=O, [n]G_i=O, phi_i(G_i)=G_(i+1), and dual_i(G_(i+1))=[ell]G_i.
      - For the terminal loop psi verify psi(G)=[lambda]G.
      - >-
        Compute ord_n(lambda) only with a factorization/order certificate for
        n-1.  If that certificate is unavailable, record order unknown and
        block orbit-payoff claims while retaining an otherwise valid map
        certificate.  Record the generated action with negation and every
        exceptional-point exclusion.
    holdout_planted_point_certificate: >-
      Role 7, never role 6, emits planted-point-subgroup-certificates.jsonl.
      For each revealed Q=[d]G and every edge, verify
      phi_i(Q_i)=[d]G_(i+1) and the matching dual identity; at the terminal
      loop verify psi(Q)=[lambda]Q.  Bind the target record, role-6 map-support
      digest, exact consumer binary/contract, and independent replay receipt.
    transfer_cost_rule: >-
      Charge forward maps, required duals, model conversions, endpoint
      isomorphism, exceptional handling, subgroup validation, and recovery of
      the answer in the source representation.  A DLP is not easier merely
      because it was moved to an isogenous curve.

  attack_consumers:
    exact_consumer_freeze_gate:
      status: blocking_before_holdout_dispatch
      required_amendment: >-
        Before P192-WCM-HOLDOUT, a versioned protocol amendment must freeze the
        matched candidate and generic DLP algorithms byte-for-byte: state
        representation and coefficient invariants; partition and update rule;
        increment-table derivation; candidate orbit/canonicalization rule;
        baseline negation handling; distinguished-point predicate; collision
        detection and recovery; termination/success rule; memory and
        parallelism; target derivation; and HOT/COLD whole-attack accounting.
        It must also distinguish a bounded-interval algorithm from a full-group
        rho algorithm.  A 2^28/2^32/2^36 planted key may use an admitted
        interval BSGS/kangaroo only for functional evidence unless the
        candidate action is proved to preserve the interval algorithm's exact
        equivalence and recovery semantics.  Full-group rho at order n is not
        made executable by choosing a small planted scalar.
      boundary: >-
        The current planted target schedule is a functional/map holdout only.
        It cannot yield an end-to-end DLP ratio or satisfy any advantage tier
        until that amendment is approved.  A mapped scalar action and
        ord_n(lambda) alone are insufficient.
    orbit_rho:
      eligibility: >-
        Requires a certified nonzero lambda, a complete order certificate,
        explicit cheap psi/psi_inverse circuits on the order-n subgroup, and a
        proven equivariant rho walk and partition.
      effective_action: >-
        H=<lambda,-1> in F_n^*.  Compute m=|H| exactly.  On the nonzero
        prime-order subgroup every scalar H-orbit has size m; O is excluded.
        Any smaller implemented action must name its subgroup and prove its
        size.  No sqrt(m) iteration gain is assumed merely from ord_n(lambda).
      accounting: >-
        Charge orbit representative selection, every psi/dual evaluation,
        partition/hash work, cycle detection, distinguished-point handling,
        exceptional cases, preprocessing, and recovery.  Compare the same
        success probability and target distribution with matched generic rho.
      maximum_explicit_orbit_size: 64
      larger_order_rule: >-
        Orders above 64 require a separately certified non-enumerative
        canonicalization/walk implementation; otherwise the orbit lane is
        unavailable, not projected as free speedup.
    decomposition:
      eligibility: >-
        Construct the exact kernel lattice generated by (n,0) and
        (-lambda,1), derive and certify a balanced basis, and show the actual
        scalar or multi-scalar algorithm consuming the decomposition.
      accounting: >-
        Charge decomposition, both scalar multiplications, psi evaluations,
        additions, precomputation, memory, exceptional handling, and recovery.
        Determinant or eigenvalue order alone is not a speedup.
    promotion_rule: >-
      A candidate must name and implement at least one consumer above.  A cheap
      endomorphism, eigenvalue, or abstract ideal loop without that consumer
      cannot pass scoped_advantage or any weakness tier.

  controls:
    - >-
      Positive algebra control: maximal order D=-23, canonical reduced form of
      norm 2, and its order-three relation g_2^3=1; require exact form, ideal,
      alpha, encoding, and recombination replay.
    - >-
      P-192 algebra control: alpha=sqrt(D)=2*pi-t with (u,v)=(-t,2), norm
      abs(D), and factorization 5*11*31*C.  Algebra must pass; mappable/payoff
      gates must reject the unavailable C-degree edge and its scalar action on
      E(F_p)[n].
    - P-192 ramified-square rows for ell in {5,11,31} must classify as scalar and never as non-scalar hits.
    - Every inert/Atkin prime deliberately injected into a factor base or residual must be rejected.
    - Mutating one root, orientation sign, exponent, alpha coordinate, norm factor, LP endpoint, or HNF column must fail the independent verifier.
    - A partial set with one unmatched oriented large-prime column must not recombine; adding its exact conjugate control must cancel it.
    - Toy explicit-root Velu and kernel-polynomial maps must agree on codomain, points, dual composition, and exceptions.
    - A terminal curve with equal j-invariant but wrong F_p twist/UID must fail; the correct F_p-isomorphism control must pass.
    - A map mutation sending G to O, outside the order-n subgroup, or to the wrong eigenvalue must fail.
    - Shuffling Q32 weights may alter post-map display ranking but must leave relation IDs, structural-panel membership and hash, map-attempt order/dispositions, and exact raw Pareto dominance unchanged.
    - All-ones and one-component-perturbed Q32 weights obey the same invariance; missing, duplicate, zero, overflowed, or wrong-orientation calibration records are invalid.
    - Reverse row order and independent HNF/SNF implementations must generate the same certified relation lattice.
    - A small admitted reference box scanned by the scalar reference implementation and segmented sieve must have byte-identical sorted records and roots.
    - Forward/reverse generation and one-worker/eight-worker shard computation must recompose to identical shell and family roots.
    - Residual fixtures immediately below, at, and immediately above the large-prime boundary must classify exactly as frozen.
    - Matched baseline A/A timing and operation-count controls must contain ratio 1.00 within their preregistered interval.

  independent_variables:
    - BOX-0, BOX-1 shell, and BOX-2 shell
    - complete, one-large-prime, and two-large-prime relation path
    - direct, recombined, LLL, BKZ, and ILP candidate construction
    - HOT and COLD start state
    - valid artifacts and single-field control mutations

  metrics:
    primary:
      - exact raw, primitive, duplicate, complete, partial, rejected, and unresolved counts per shell with stream digests
      - exact direct/recombined relation IDs, rank, high-column cancellation, alpha/norm/lambda, and independent replay verdicts
      - complete frozen-panel map dispositions and Pareto-front raw HOT and COLD tuples for every realized loop
      - subgroup-preservation, terminal-isomorphism, action-order, and planted-point replay verdicts
      - matched end-to-end operation ratio, wall-time ratio, success rate, and conservative security-bit delta
    secondary:
      - optional descriptive smoothness and semismooth yield by norm-bit and v strata; their boundaries are not frozen and the diagnostic must be omitted unless a pre-dispatch amendment freezes them
      - Q32 ranking totals and rank stability, never substituted for raw costs
      - LLL swaps, BKZ nodes/tours, ILP nodes/gap, censored solver cells, CPU time, wall time, memory, and disk
      - unavailable map coverage and cost paid by rejected candidates

  statistical_treatment:
    deterministic_census: >-
      Box membership, exact factorization disposition, and relation counts are
      finite-census outputs.  Report exact integers and digests; do not attach
      binomial confidence intervals or extrapolate a null beyond the boxes.
    smoothness_model: >-
      Random-integer smoothness predictions are planning diagnostics only.
      Norm-bit and v strata are optional descriptive diagnostics: no bin
      boundaries are frozen in this version, so a conforming v2 run omits
      them.  Their omission does not block the exact finite census or any
      primary metric.  A versioned pre-dispatch amendment is required only if
      a future run will report or interpret those strata; after such an
      amendment, report observed/predicted ratios with all cells, but do not
      use a p-value to accept or reject a curve weakness.
    calibration: >-
      For 16 fixed cases and 11 paired repetitions, report case medians,
      median absolute deviations, IQR, full range, and leave-one-case-out
      rank sensitivity.  Preserve ABBA pairing and include failed measurements.
      Repetitions characterize measurement noise; the fixed case panel
      does not license a population confidence interval.
    planted_end_to_end: >-
      The current schedule reserves 31 targets per interval at widths 28, 32,
      and 36 for transfer and bounded-interval recovery correctness only.  It
      has no speed-ratio estimand.  Before candidate selection, a coordinator
      commits SHA-256(salt) for a uniformly generated 32-byte salt but keeps
      salt sealed.  After exactly one candidate, binary, and consumer are hash-
      frozen, reveal salt and, for width w and zero-based index i, choose the
      first counter c>=0 for which the big-endian u64 returned by the first
      eight bytes of SHAKE256("P192-WCM-TARGET-v1\0" || salt[32] || u16be(w) ||
      u32be(i) || u32be(c)) masked by (2^w-1) is nonzero; that value is d.
      Archive canonical compressed SEC1 Q=[d]G.  The solver receives only
      (Q,w), never d; reveal d only after its output digest is committed, then
      replay [d]G=Q.  Record the salt commitment, reveal, counters, d values,
      and Q bytes.  These are public known-answer targets after reveal.
      Only an approved exact-consumer amendment may activate matched timings;
      that amendment must freeze identical targets/stopping rules, ABBA order,
      the interval or full-group semantics, a primary rung, paired median and
      geometric-mean ratios, 10000 target-cluster bootstrap resamples with seed
      0x50313932424f4f54, and exact two-sided Clopper--Pearson 95% success
      intervals.  Until then all ratio and confidence-interval fields are null.
    multiplicity: >-
      HOT and COLD are co-primary and must both pass; no post-hoc selection.
      Solver variants are discovery mechanisms, not independent confirmations.
    replication: >-
      Rebuild from the committed source and protocol on two distinct
      independent hosts or isolated environments with no shared build/cache
      workspace, one invocation per reserved replication seed, and replay the
      selected candidate and matched baseline.  Without both runs, any
      advantage remains preliminary.
    selection_holdout_separation: >-
      Calibration, relation discovery, and solver outputs are selection data.
      Commit the sealed target salt, then freeze exactly one directed candidate,
      its binary, and its attack consumer before revealing the salt or deriving
      planted target scalars and timing-order material.  If
      more than one candidate enters holdout, a new preregistered familywise
      rule is required; post-hoc winner selection is invalid.

  weakness_and_claim_rules:
    structural_candidate: A non-scalar independently verified principal relation; never called a weak curve.
    mapped_candidate: A structural candidate with complete map, terminal, and generator-subgroup certificates; still not a speed claim.
    holdout_transfer_verified: A mapped candidate whose role-7 planted-point certificates all pass; still not a speed claim.
    scoped_advantage: >-
      The exact consumer freeze gate is closed; both HOT and COLD paired 95%
      whole-attack ratio intervals have upper endpoints below 1.00; all 31
      primary functional targets pass in both arms; controls pass; and both
      reserved independent replication instances have the same direction.
    material_weakness_candidate: >-
      In addition to scoped advantage, both conservative ratios are <=0.80 and
      the exact action/order analysis explains the gain.  This label reports a
      reproducible implementation-level candidate, not a general ECDLP break.
    weak_curve_within_scope: >-
      The fully charged full-order work-factor derivation, including orbit
      quotient and per-step costs, has a conservative security loss of at
      least 1.0 bit (cost ratio <=0.5) in both HOT and COLD models; the lower
      endpoint of the 95% security-loss interval exceeds 1.0 bit; all map and
      subgroup certificates pass; and both independent replications agree.  A
      bounded-interval planted run alone cannot satisfy this label.
    prohibited_claims:
      - A relation count, low degree, small Q32 score, or faster single microbenchmark is a weak curve.
      - A timeout or empty/incomplete shell proves P-192 strong.
      - Toy or bounded-interval recovery directly measures full-order P-192 security.
      - An endpoint curve is weaker without charging transport back to the exact source problem.

  replication:
    seeds:
      - 5782965481073003825
      - 5782965481234481492
      - 5782965480959917908
    independent_instances: 2
    seed_semantics: >-
      These are reserved respectively for the primary consumer panel and the
      two independent replication instances.  They authorize no invocation in
      this version; the exact-consumer amendment must bind each seed, binary,
      argv, stopping rule, and host receipt before roles 7 or 8 can dispatch.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 259200
    total_cpu_hours: 4096
    maximum_memory_gb: 128
    maximum_runs: 8
    maximum_workers: 32
    maximum_disk_gb: 512
    resource_semantics: >-
      Limits protect the execution environment and freeze this family.  A
      limit reached yields censored/incomplete, never a mathematical null.

  planned_run_family:
    manifest: research/p192-weighted-cm-20261007-v2/run-family.yaml
    run_count: 8
    status: all_pending_not_executed
    dispatch_rule: >-
      The repository's supervised run entry point creates fresh immutable run
      manifests only after every admission gate passes.  The eight planned
      labels freeze roles and order.  Labels 1 through 6 are supervised
      composite stages: a non-arithmetic wrapper closes the producer outputs,
      then launches a separately built verifier with no crypto_lib dependency
      and archives both child receipts before advancement.  Labels 7 and 8 are
      nondispatchable with null argv until the exact-consumer amendment binds
      the primary panel and both independent replication invocations, including
      all three reserved seeds.  Canonical RUN IDs
      are newly allocated and rechecked at dispatch because content-only IDs
      are not reservations.  Labels are not receipts and not evidence.

  stopping_rules:
    - Stop invalid before search if identity, order, maximality, factor-base, encoding, or mandatory positive/negative controls fail.
    - Complete every admitted shell in exact iteration order; a resource stop marks that shell and every broader null claim incomplete.
    - Do not launch BOX-1 until BOX-0 artifacts and independent verification pass; likewise BOX-2 follows BOX-1.
    - A mapped candidate may advance to end-to-end testing only after every frozen structural-panel member has a terminal role-6 disposition; finding a hit never truncates a shell or panel.
    - Stop positive only after a candidate meets the declared claim tier and independent replication completes.
    - Stop scoped-null only after all three shells, recombination, high-column elimination, solver budgets, applicable maps, and controls complete.
    - No adaptive boxes, bases, large-prime bounds, solver budgets, or extra runs are admitted under this immutable version.

  invalidation_rules:
    - Scientific execution begins from a dirty tree, an unpinned source, or a protocol hash different from the committed archive.
    - Search membership, acceptance, or stopping changes because of timing, Q32 weights, a promising candidate, or an observed yield.
    - Any candidate lacks exact norm, oriented ideal, recombination, high-column, alpha, or independent HNF replay.
    - A graph cycle is accepted without exact large-prime matrix cancellation.
    - A relation using ell>113 is called mappable without exact elimination or an explicitly built and charged map.
    - A relation using any ell<=113 is placed on the realized Pareto front or sent to a consumer without an admitted directed map-and-cost record for that exact source, root, and orientation.
    - Missing/failed maps, targets, timings, or baseline cells are dropped from a ratio.
    - An abstract identity or bounded planted solve is reported as a full-order weak-curve result.

  success_criterion: >-
    At least one non-scalar relation is independently certified, exactly reduced
    to the mappable base, realized as an explicit terminal loop preserving the
    order-n subgroup, and meets one of the preregistered fully charged advantage
    tiers against the matched baseline with all controls and replication.
  falsification_criterion: >-
    If all three shells and every downstream gate complete validly and no
    candidate reaches mapped advantage, record only
    NO_WEAKNESS_FOUND_WITHIN_SCOPE for this finite protocol.  If any required
    stage is censored or unavailable, record INCOMPLETE, not falsification.

  admission_gates:
    - Native source PR commit and every added implementation commit are pinned, clean, tested, and independently reviewed.
    - This specification, run-family manifest, report, diagram source/SVG/PDF, and SHA-256 manifest are committed and hash-bound.
    - The producer and independent verifier agree on tuple identities, factor-base digest, controls, box counts, and the REF-0 candidate and disposition shard/shell roots.
    - >-
      The independent ideal verifier shares no factorization, form-composition,
      ideal-power, HNF/SNF, or certificate-replay implementation with the
      producer.  Calling the producer's verify function is mutation detection,
      not independent verification.
    - Solver binaries, strategies, seeds, threads, node/time limits, and environment are frozen.
    - HOT/COLD instrumentation passes primitive accounting, A/A, and map controls.
    - The exact consumer and matched generic baseline amendment is committed and approved before the holdout role; without it no end-to-end or weakness claim is executable.
    - A Coordinator dispatch decision names the exact committed experiment and source revisions; this planning approval is not itself a run receipt.

  required_artifacts:
    - canonical experiments/EXP-SCURVE-1a8daf/runs/RUN-*/manifest.yaml plus command.txt, environment.json, stdout.log, stderr.log, and raw-result.json for each executed role; any native run.yaml is a separate scientific artifact
    - identity.json, primality certificates, maximal-order.json, factor-base.json, and factor-base.sha256
    - candidate-stream.json with shell counts/digests, compact indexed binary disposition shards/schema/roots, checkpoint-chain.jsonl, and retained-candidate JSONL only
    - complete-relations.jsonl, partial-relations.jsonl, lp-coordinate-manifest.json and lp-coordinate-manifest.sha256, high-column-coordinate-manifest.json and high-column-coordinate-manifest.sha256, recombination-kernel.json, high-column-kernel.json, and independent replay receipts
    - lll.json, bkz.json, ilp.json, solver logs, structural-candidate-panel.json and structural-candidate-panel.sha256, exact vectors, gaps, and censoring reasons
    - q32-calibration.json with raw samples, operation-weights.json, realized-panel-ranking.json, and selected-vectors.json; raw HOT/COLD tuples remain separate
    - map-attempt-dispositions.jsonl and map-attempt-evidence.jsonl plus map-support.json and map-support.sha256 containing only exactly admitted directed maps; the protocol-freeze manifest is empty
    - edge-certificates.jsonl, composite-map-certificates.jsonl, generator-subgroup-certificates.jsonl, and terminal-isomorphisms.jsonl
    - planted-targets.json, planted-point-subgroup-certificates.jsonl, matched-baseline.jsonl, paired-results.jsonl, statistical-summary.json, and two independent replication receipts
    - stdout.log, stderr.log, resource-metrics.json, environment.json, and rejected/unavailable candidate ledger
    - >-
      dated REPORT.md, editable DOT, SVG, PNG, rendered PDF,
      ARTIFACT_INDEX.md, and SHA256SUMS covering the exact published protocol
      payload except SHA256SUMS itself and the snapshot receipt; the enclosing
      Git archive commit and snapshot receipt bind the manifest and receipt
      without a self-reference

  assigned_to: executor
  approved_by: coordinator
  approval_decision: DEC-20261007-0ed467
  claim_ceiling: No scientific result exists; future claims are limited by weakness_and_claim_rules.
