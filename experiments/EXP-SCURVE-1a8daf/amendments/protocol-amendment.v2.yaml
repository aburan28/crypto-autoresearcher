protocol_amendment:
  experiment_id: EXP-SCURVE-1a8daf
  version_from: 1
  version_to: 2
  filed_at: '2026-10-07'
  filed_by: coordinator
  approved_by: coordinator
  status: approved_design_unexecuted
  approval_decision: DEC-20261007-0ed467
  execution_authorized: false
  scientific_run_performed: false
  scientific_results: []
  affected_runs: []
  confirmatory_status: reset
  identity_and_precedence: >-
    This amendment is identified by approval decision DEC-20261007-0ed467
    and its repository path; no unallocated amendment identifier is used.
    For execution and evaluation of EXP-SCURVE-1a8daf version 2, this record
    and specification.v2.yaml govern wherever the immutable hypothesis mirror
    H-SCURVE-ec34c4 differs.  In particular, they supersede that hypothesis's
    mappable_prime_bound 4093 with target bound 113 and supersede weighted
    lattice optimization before map construction with a cost-blind structural
    panel followed by exhaustive panel map attempts and only then cost-aware
    raw Pareto layering/selection followed by Q32 display ranking.  The
    substantial pre-data revision resets confirmatory
    status; affected_runs is empty because no scientific run exists.
  applies_to: >-
    Future implementation, admission, and execution only.  Version 1 and its
    review bundle remain immutable historical design records; no RUN id or
    observation exists to reinterpret.
  version_1_binding:
    commit: 4b9207ea3751de5b1986e28b627ae4476f4ead4f
    specification_path: experiments/EXP-SCURVE-1a8daf/specification.yaml
    specification_sha256: 1ab37f9247b837c2280bb9ae23be5a4012cfd6dc3f7a9b99151c24b5c310dbdc
    run_family_path: research/p192-weighted-cm-20261006/run-family.yaml
    run_family_sha256: b615d59e46144845801294c204fc7071b307581e21dc8f06f0c6939b1f92c2b2
    report_path: research/p192-weighted-cm-20261006/REPORT.md
    report_sha256: 28bfe54cfb294c5bdc5c5821caeb90e8f7e25abdf279105932a09c896636df00
  version_2_binding:
    specification_path: experiments/EXP-SCURVE-1a8daf/amendments/specification.v2.yaml
    run_family_path: research/p192-weighted-cm-20261007-v2/run-family.yaml
    report_path: research/p192-weighted-cm-20261007-v2/REPORT.md
    checksum_manifest: research/p192-weighted-cm-20261007-v2/SHA256SUMS
  reason: >-
    Pre-execution review found that version 1 was not dispatchable: its map
    bound lacked an admitted exact-map implementation and reproducible
    resource contract; its
    producer/verifier, stream, checkpoint, kernel, map, and consumer contracts
    were insufficiently independent or byte-exact; and its weighted optimizer
    consumed costs produced only by its successor map stage.  Because v1 was
    already committed, the repairs are additive rather than edits.
  changes:
    - id: A1
      field: factor_bases_and_smoothness.mappable_base
      from: Bound 4093 without an admitted exact map implementation.
      to: >-
        Target bound 113 with all 13 exact split/ramified primes and 23
        directions; strict admitted map-support is empty.  The narrower
        kernel/codomain artifact frontier through 43 is cited to immutable
        crypto commit aea4dbb0983a37f6463fdbde96e6884871586357 and is not
        represented as point-map support.
    - id: A2
      field: centered_norm_search and relation encodings
      from: Candidate coverage and retained-row artifacts lacked a complete independent byte contract.
      to: >-
        Exact shell IDs/order, 16-byte records, candidate/disposition shard,
        shell, and family roots, FACT/CAND aliases, one-sided residual rejection,
        coordinate manifests, saturated-kernel witnesses, and REF-0 agreement.
    - id: A3
      field: checkpoint_schema
      from: Resume did not bind committed append-file prefixes or exact commits.
      to: >-
        Per-shell cumulative checkpoints bind final protocol/producer commits,
        conservation identities, regenerated candidate bytes, persisted
        disposition bytes, committed append-prefix lengths/hashes, truncation,
        and clean-versus-resumed byte equality.
    - id: A4
      field: independent_verification
      from: Producer self-replay could satisfy verifier-shaped outputs.
      to: >-
        Roles 1 through 6 are composite stages requiring a separately built
        verifier with no crypto_lib dependency and independent ideal,
        HNF/SNF, factorization, and certificate replay.
    - id: A5
      field: candidate_generation_and_post_map_ranking
      from: Weighted solver depended circularly on Q32 and directed costs produced by the later map stage.
      to: >-
        Role 5 freezes a deterministic cost-blind structural panel with a
        finite retention bound.  Role 6 attempts every panel variant in ID
        order, then computes separate HOT, COLD_TOTAL, and joint 12-component
        Pareto layers; Q32 only orders display after raw layers exist.
    - id: A6
      field: map and holdout evidence split
      from: Pre-holdout map artifacts implicitly required planted points that did not yet exist.
      to: >-
        Role 6 certifies generic subgroup structure, generator action, and
        admitted maps only; role 7 separately certifies every revealed planted
        point.
        Map attempt dispositions are separate from the admitted-only support
        manifest.
    - id: A7
      field: consumer and replication roles
      from: Executable-looking templates lacked an exact consumer and replication bindings.
      to: >-
        Roles 7 and 8 have null argv until a versioned exact-consumer amendment
        binds the primary seed, candidate, baseline, scalar estimand, target
        commitment, and two distinct isolated replication environments.
    - id: A8
      field: statistics and claims
      from: Unspecified strata and map-only tuples could be overread as statistical or security evidence.
      to: >-
        Unfrozen strata are optional descriptive diagnostics and are omitted
        unless a future amendment freezes them; finite censuses use exact
        counts; map Q32 is ranking-only; scalar advantage requires whole-attack
        CPU-cycle ratios, target-cluster intervals, full-order valuation, and
        two independent replications.
  binding: >-
    Any future implementation or run for EXP-SCURVE-1a8daf must use
    specification.v2.yaml together with this amendment and the v2 run family.
    Version 1 is nondispatchable and is never rewritten.  A fresh Coordinator
    decision naming final clean implementation and protocol commits remains
    mandatory before any RUN manifest is allocated.
  claim_ceiling: PROTOCOL_DESIGNED_UNEXECUTED
  knowledge_promotion:
    promoted: []
    reason: No relation search, map census, timing, recovery, or replication ran.
