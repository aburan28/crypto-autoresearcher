  independent_verifier:
    sequencing: >-
      The non-arithmetic supervisor runs the producer first, waits for exit,
      closes and hashes every producer artifact, then starts the separately
      built verifier.  It hashes the same producer bytes again after verifier
      exit and refuses any difference.
    required_independence: >-
      The verifier receives only paths and immutable bytes.  It has no
      crypto_lib dependency, no producer process state, and shares no
      factorization, form-composition, ideal-power, HNF/SNF, candidate iterator,
      candidate/disposition encoder, root aggregator, or certificate-replay
      implementation with the producer.  The frozen SEC2 metadata constants are
      public protocol inputs, not a shared implementation.  Producer
      verification.json is input provenance only and cannot satisfy any
      verifier check.
    agreement_rule: >-
      The supervisor creates independent-agreement.json only after both
      verification records close.  It compares exactly the eight binding values
      in their frozen order and fails closed on a missing, duplicate, unequal,
      invalid, or unresolved field.

  admission_gate:
    - Immutable base hashes and exact original role-1 argv/output list match.
    - Every JSON artifact obeys its exact schema, canonicalization, and cross-binding.
    - Every binary child obeys its exact byte grammar and referenced hash/length.
    - Identity, maximal-order, factor-base, and the exact role-1 controls pass.
    - REF-0 has 1025 ordered dispositions, invalid=0, unresolved=0, and matching independent roots.
    - Producer and independent verifier exit zero; closed producer bytes remain unchanged.
    - Independent agreement and supervisor receipt both have overall_status PASS.
    - Final protocol, producer, verifier commits and exact binary hashes are pinned in a fresh dispatch decision.
    - execution_authorized remains false until that separate decision exists.

  prohibitions:
    - Do not edit or reinterpret the immutable v1 or archived v2 records.
    - Do not launch a scientific run from this addendum.
    - Do not use REF-0 as census, relation, timing, or claim evidence.
    - Do not invent expected REF-0 digest constants before independent agreement.
    - Do not accept unknown JSON keys, alternate filenames, type drift, missing artifacts, or implicit defaults.
    - Do not use a dirty, abbreviated, placeholder, or reviewed-only source commit as the final source binding.
    - Do not let either child create its own independent-verifier receipt or agreement record.
    - Do not convert invalid or unresolved dispositions to rejected.
