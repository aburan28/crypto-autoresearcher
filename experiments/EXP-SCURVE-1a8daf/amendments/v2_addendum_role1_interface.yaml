role1_interface_addendum:
  schema: p192-wcm-role1-interface-addendum-v1
  experiment_id: EXP-SCURVE-1a8daf
  protocol_version: 2
  interface_revision: 1
  filed_at: '2026-10-07'
  status: interface_frozen_unexecuted
  approval_basis: direct_user_instruction_2026-10-07
  approval_decision: null
  execution_authorized: false
  scientific_run_performed: false
  scientific_results: []
  affected_runs: [P192-WCM-PREFLIGHT]
  claim_ceiling: PROTOCOL_INTERFACE_ONLY_NO_RESULT

  immutable_base:
    archive_commit: ad0f9f488b8e9796f490e40338d858c1062cbfbe
    amendment_path: experiments/EXP-SCURVE-1a8daf/amendments/protocol-amendment.v2.yaml
    amendment_sha256: af43c91b9ab941158dd8a589fa6115f49b917b693f8cd1655f625e14a08611e8
    specification_path: experiments/EXP-SCURVE-1a8daf/amendments/specification.v2.yaml
    specification_sha256: 34fb190ff222a37f2a626d18ba26b3e710a96c2d6eb11a5ab12dd561a4317484
    run_family_path: research/p192-weighted-cm-20261007-v2/run-family.yaml
    run_family_sha256: 4bbb9c81318dceeba93734fce50dd96574513afa0c31e8c9ea8f310d91e7c6d6
    snapshot_receipt_path: coordination/p192-weighted-cm-20261007/archives/TASK-20261007-66d44b/snapshot-receipt.json
    precedence: >-
      The three bound v2 records remain immutable and govern every scientific,
      arithmetic, enumeration, status, and claim rule.  This addendum fills only
      the previously unspecified role-1 serialization, artifact-location,
      control-staging, agreement, and source-binding interfaces.  It cannot
      authorize a run or relax a v2 failure condition.

  stage_binding:
    planned_run_label: P192-WCM-PREFLIGHT
    ordinal: 1
    role: composite_producer_and_isolated_verifier
    status: pending_not_executed
    predecessor: null
    producer_argv_template:
      - p192_weighted_cm
      - preflight
      - --curve
      - p192
      - --sieve-bound
      - '65521'
      - --map-bound
      - '113'
      - --large-prime-bound
      - '2147483647'
      - --positive-control
      - D=-23
      - --reference-shell
      - REF-0
      - --reference-v-max
      - '2'
      - --reference-x-max-inclusive
      - '1024'
      - --out
      - RUN_DIR
    independent_verifier_argv_template:
      - p192_weighted_cm_verify
      - preflight
      - --source
      - RUN_DIR
      - --out
      - RUN_DIR/independent-verification.json
    immutable_v2_required_outputs:
      - identity.json
      - maximal-order.json
      - factor-base.json
      - factor-base.sha256
      - controls.json
      - reference-box.json
      - verification.json
      - independent-verification.json
      - independent-verifier-receipt.json
    addendum_required_children:
      - reference-box/candidate-records.bin
      - reference-box/disposition.bin
      - reference-box/certificates.bin
      - independent-agreement.json
    ownership:
      producer:
        - identity.json
        - maximal-order.json
        - factor-base.json
        - factor-base.sha256
        - controls.json
        - reference-box.json
        - reference-box/candidate-records.bin
        - reference-box/disposition.bin
        - reference-box/certificates.bin
        - verification.json
      independent_verifier:
        - independent-verification.json
      non_arithmetic_supervisor:
        - independent-agreement.json
        - independent-verifier-receipt.json
    location_rule: >-
      Every relative path is beneath the one resolved RUN_DIR.  A path is used
      literally with slash separators; dot segments, symlinks, alternate names,
      shell expansion, implicit defaults, and writes outside RUN_DIR are
      forbidden.  The supervisor creates a fresh RUN_DIR and refuses an
      existing path.

  source_commit_binding:
    protocol_commit: >-
      The final clean crypto-autoresearcher Git commit containing the immutable
      v2 base and this addendum, encoded as exactly 40 lowercase hexadecimal
      characters.  The producer build requires the environment variable
      P192_WCM_PROTOCOL_COMMIT to carry this value, refuses every build when it
      is absent or malformed, and embeds it in the executable; the executable hash
      therefore binds it.  It is never accepted from runtime environment,
      command-line input, a dirty tree, a null, a zero-filled value, or an
      abbreviated revision.  The verifier reads it from the closed producer
      artifacts rather than accepting a second value.
    source_commit: >-
      The final clean native-producer Git commit, encoded as exactly 40
      lowercase hexadecimal characters.  The producer build requires
      P192_WCM_SOURCE_COMMIT, refuses every build when it is absent or malformed,
      and embeds it in the executable.  Where Git metadata is present, every
      build refuses a value unequal to HEAD.  A release build additionally
      refuses a dirty tree.  A non-release debug/test build may proceed dirty
      only with an explicit build warning and is never admission eligible.  It is the
      factor-base.json source_commit and is repeated byte-for-byte in every
      producer, verifier, agreement, and receipt JSON.  The reviewed prerequisite head
      315c7b417305db4f34ad01cb07c18ca2c55181ee is not substituted unless it is
      also the final admitted implementation commit.
    verifier_commit: >-
      The final clean independent-verifier Git commit as 40 lowercase hex.  It
      is supplied at verifier build time as P192_WCM_VERIFIER_COMMIT; the build
      refuses an absent or malformed value and embeds it in the executable.
      Where Git metadata is present, every build refuses a value unequal to
      HEAD.  A release build additionally refuses a dirty tree.  A non-release
      debug/test build may proceed dirty only with an explicit build warning
      and is never admission eligible.  Runtime input cannot override it, and it may equal
      neither a placeholder nor an uncommitted workspace state.
    binary_binding: >-
      The supervisor hashes exact executable bytes before either child starts.
      Producer and verifier binary SHA-256 values are lowercase 64-hex and are
      repeated in their verification records and the supervisor receipt.  The
      producer build receipt records P192_WCM_PROTOCOL_COMMIT and
      P192_WCM_SOURCE_COMMIT by name and their embedded non-secret values; the
      verifier build receipt similarly records P192_WCM_VERIFIER_COMMIT.  The
      runtime environment cannot override any of them.

  offline_reference_binding:
    document: SEC2 version 2.0
    document_url: https://www.secg.org/sec2-v2.pdf
    document_sha256: 87b8f3703364ed5b21ba8582e411cc0cbf477bcaa3f4f45e0d6580d1c00d9952
    document_byte_length: 306784
    section: 2.2.2
    parameter_name: secp192r1
    replay_rule: >-
      Producer and verifier each compile the six metadata constants above and
      independently compare them plus the exact p/n values and named P-192 tuple
      against maximal-order.json and identity.json.  The PDF is not a runtime
      input, vendored asset, or shared implementation component.  A separate
      read-only provenance audit may fetch the URL and confirm byte length/hash;
      that audit is optional operational corroboration and never network work in
      Role 1.

  canonical_json:
    encoding: UTF-8 RFC-8785 JSON
    bom: forbidden
    trailing_newline: forbidden
    duplicate_keys: forbidden
    unknown_keys: forbidden
    integers_within_interoperable_range: JSON numbers
    arbitrary_precision_integers: >-
      Minimal base-10 strings: zero is "0"; a negative has one leading minus;
      no leading plus or leading zero is permitted.
    sha256: exactly 64 lowercase hexadecimal characters
    git_commit: exactly 40 lowercase hexadecimal characters
    enum_case: exact
    path_encoding: UTF-8 relative slash-separated path with no dot segment
    array_order: semantically binding

  common_record_types:
    verdict:
      exact_keys: [check_id, status]
      check_id: nonempty ASCII token
      status: [PASS, FAIL]
    artifact:
      exact_keys: [path, byte_length, sha256]
      path: canonical relative path
      byte_length: nonnegative JSON integer
      sha256: lowercase 64-hex of exact file bytes
    binding_values:
      exact_keys:
        - curve_tuple_sha256
        - cm_order_tuple_sha256
        - factor_base_sha256
        - control_results_sha256
        - reference_candidate_shard_sha256
        - reference_candidate_shell_sha256
        - reference_disposition_shard_sha256
        - reference_disposition_shell_sha256
      field_type: lowercase 64-hex
    primality_proof:
      variants:
        authoritative_standard:
          exact_keys:
            - method
            - value
            - standard_id
            - edition
            - section
            - document_url
            - document_sha256
            - document_byte_length
            - parameter_name
          method: authoritative_standard
          applicability: >-
            Permitted only for maximal-order.json subjects p and n.  It is
            forbidden for C and for every recursive Pocklington factor.
          encoding: >-
            value is the identical canonical positive decimal subject value;
            standard_id is "SEC2"; edition is "2.0"; section is "2.2.2";
            document_url is "https://www.secg.org/sec2-v2.pdf";
            document_sha256 is
            "87b8f3703364ed5b21ba8582e411cc0cbf477bcaa3f4f45e0d6580d1c00d9952";
            document_byte_length is the JSON integer 306784; parameter_name is
            "secp192r1".  These values identify the exact published P-192
            parameter table, not a secondary web page or recalled source.
          replay: >-
            The verifier compares all frozen provenance metadata and the exact
            named P-192 tuple/value against its independently compiled constants.
            That authoritative pinned metadata/tuple comparison is the
            primality provenance gate for p and n.  A fixed-base probable-prime consistency check may be
            reported separately but is explicitly not a primality proof and is
            neither required nor accepted in place of the provenance gate.
        trial_division_u32:
          exact_keys: [method, value]
          method: trial_division_u32
          value: canonical positive decimal string no greater than 4294967295
          replay: Trial-divide by every prime not exceeding floor(sqrt(value)).
        pocklington_v1:
          exact_keys: [method, value, cofactor, factors, witnesses]
          method: pocklington_v1
          value: canonical positive decimal string
          cofactor: canonical positive decimal string
          factors: >-
            Nonempty array in increasing numeric prime order.  Each object has
            exactly prime, exponent, and proof.  prime is a canonical positive
            decimal string, exponent is a positive JSON integer, and proof for
            that same prime recursively uses only trial_division_u32 or
            pocklington_v1; authoritative_standard is forbidden here.
          witnesses: >-
            Array in the same order as factors.  Each object has exactly prime
            and base as canonical positive decimal strings.  Replay requires
            value-1=cofactor*product(prime^exponent), F=product(prime^exponent)
            with F^2>value, base^(value-1)=1 mod value, and
            gcd(base^((value-1)/prime)-1,value)=1 for every distinct prime.

  json_artifacts:
    identity.json:
      schema_value: p192-wcm-identity-v1
      exact_top_level_keys:
        - schema
        - experiment_id
        - protocol_version
        - protocol_commit
        - source_commit
        - curve
        - derived
        - checks
        - overall_status
      curve_exact_keys:
        - name
        - model
        - p
        - a
        - b
        - generator_x_hex
        - generator_y_hex
        - n
        - cofactor
        - trace_t
        - icv1
        - ec1
        - curve_uid
      curve_encoding: >-
        p, a, b, n, and trace_t are canonical decimal strings; cofactor is the
        JSON integer 1; coordinates are exactly the 48 uppercase hexadecimal
        digits serialized by specification.v2.yaml, including Gy's leading 07.
      derived_exact_keys: [group_order, frobenius_discriminant]
      derived_encoding: canonical decimal strings
      check_ids_in_order:
        - serialized_tuple_matches_protocol
        - identities_recomputed
        - nonsingular
        - generator_nonidentity
        - generator_order_n
        - exact_group_order_n
      status_rule: overall_status is PASS iff every ordered check is PASS

    maximal-order.json:
      schema_value: p192-wcm-maximal-order-v1
      exact_top_level_keys:
        - schema
        - experiment_id
        - protocol_version
        - protocol_commit
        - source_commit
        - curve_uid
        - order
        - primality
        - checks
        - overall_status
      order_exact_keys: [p, n, t, D_pi, D_K, D_End, D, C, factorization]
      order_encoding: >-
        All integer fields are canonical decimal strings.  factorization is the
        exact ASCII string "-5 * 11 * 31 * C".
      primality: >-
        Array of exactly three objects in subject order p, n, C.  Each object
        has exactly subject, value, and proof and carries the identical value
        from the named order field.  The p and n proofs are exactly the frozen
        authoritative_standard SEC2 records above.  C uses pocklington_v1;
        authoritative_standard is forbidden for C.  Recursive Pocklington
        factors use pocklington_v1 or trial_division_u32 only.
      check_ids_in_order:
        - p_prime
        - n_prime
        - C_prime
        - p_not_divide_t
        - trace_absolute_value_below_p
        - ordinary
        - discriminant_identity
        - group_order_identity
        - discriminant_factorization
        - D_squarefree
        - D_congruent_1_mod_4
        - D_fundamental
        - frobenius_conductor_one
        - endomorphism_order_maximal
        - discriminants_equal
        - unit_group_plus_minus_one
        - integral_basis_multiplication
      status_rule: overall_status is PASS iff every ordered check is PASS

    controls.json:
      schema_value: p192-wcm-controls-v1
      exact_top_level_keys:
        - schema
        - experiment_id
        - protocol_version
        - protocol_commit
        - source_commit
        - curve_uid
        - factor_base_sha256
        - controls
        - control_results_sha256
        - overall_status
      control_record: >-
        Each record has exactly control_id, status, and assertions.  assertions
        is an ordered array of objects having exactly assertion_id and passed;
        passed is JSON boolean.  status is PASS iff every passed value is true.
      results_digest: >-
        SHA256(ASCII "P192-WCM-CONTROL-RESULTS-v1\0" || RFC8785(controls)),
        where controls is the exact array stored in this file.
      status_rule: overall_status is PASS iff every control status is PASS

    reference-box.json:
      schema_value: p192-wcm-reference-box-v1
      exact_top_level_keys:
        - schema
        - experiment_id
        - protocol_version
        - protocol_commit
        - source_commit
        - curve_uid
        - factor_base_sha256
        - shell_id
        - bounds
        - candidate_count
        - shard_count
        - candidate_records
        - candidate_shards
        - candidate_shell_sha256
        - disposition_records
        - disposition_shards
        - disposition_shell_sha256
        - certificates
        - status_counts
        - complete
      bounds_exact_keys: [v_min, v_max, x_min, x_max_inclusive]
      candidate_records_exact_keys: [path, byte_length, sha256]
      candidate_shard_exact_keys:
        - shard_index
        - first_candidate_index
        - record_count
        - records_sha256
        - candidate_shard_sha256
      disposition_records_exact_keys: [path, byte_length, sha256]
      disposition_shard_exact_keys:
        - shard_index
        - first_candidate_index
        - record_count
        - byte_offset
        - byte_length
        - records_sha256
        - disposition_shard_sha256
      certificates_exact_keys: [path, byte_length, sha256, record_count]
      status_counts_exact_keys:
        - nonprimitive_duplicate
        - complete
        - one_large_prime
        - two_large_prime
        - rejected
        - invalid
        - unresolved
      fixed_values: >-
        shell_id is REF-0; bounds are {v_min:1,v_max:2,x_min:0,
        x_max_inclusive:1024}; candidate_count is 1025; shard_count is 1;
        candidate_shards and disposition_shards each contain exactly the shard
        index 0 with first_candidate_index 0 and record_count 1025.  Candidate
        byte_length is 16400.  Paths are the three frozen reference-box child
        paths.  Status counts are nonnegative JSON integers summing to 1025.
        complete is true iff invalid=unresolved=0 and every record was consumed.
        A candidate_family_sha256 or disposition_family_sha256 key is forbidden.
      digest_cross_bindings: >-
        candidate_records.sha256 and candidate_shards[0].records_sha256 are both
        lowercase hex SHA256(R_0), the exact bytes of
        reference-box/candidate-records.bin.  disposition_records.sha256 and
        disposition_shards[0].records_sha256 are both lowercase hex SHA256(T_0),
        the exact bytes of reference-box/disposition.bin.  The shard-root fields
        use the distinct domain-separated v2 preimages and must not be replaced
        by either raw-file hash.  certificates.sha256 hashes the exact complete
        certificate-store file.  certificates.record_count equals
        status_counts.complete + status_counts.one_large_prime +
        status_counts.two_large_prime.
      admission_rule: >-
        A Role-1 result is admission-eligible only when candidate_count records
        were consumed, complete is true, status_counts.invalid is zero, and
        status_counts.unresolved is zero.  An internally consistent artifact
        with complete false is not an admissible Role-1 result.

    verification.json:
      schema_value: p192-wcm-verification-v1
      exact_top_level_keys:
        - schema
        - experiment_id
        - protocol_version
        - protocol_commit
        - source_commit
        - role
        - producer_binary_sha256
        - artifacts
        - bindings
        - checks
        - overall_status
      role_value: producer_self_check
      artifact_paths_in_order:
        - identity.json
        - maximal-order.json
        - factor-base.json
        - factor-base.sha256
        - controls.json
        - reference-box.json
        - reference-box/candidate-records.bin
        - reference-box/disposition.bin
        - reference-box/certificates.bin
      artifact_rule: >-
        artifacts uses the common artifact record, in path order above, and
        hashes exact closed bytes.  It excludes verification.json to avoid
        self-reference and excludes all verifier/supervisor outputs.
      bindings_type: binding_values
      check_ids_in_order:
        - identity_pass
        - maximal_order_pass
        - factor_base_pass
        - controls_pass
        - ref0_count_1025
        - ref0_candidate_encoding
        - ref0_candidate_root
        - ref0_disposition_encoding
        - ref0_disposition_root
        - ref0_certificate_store
        - source_commit_consistent
      status_rule: overall_status is PASS iff every ordered check is PASS

    independent-verification.json:
      schema_value: p192-wcm-independent-verification-v1
      exact_top_level_keys:
        - schema
        - experiment_id
        - protocol_version
        - protocol_commit
        - source_commit
        - verifier_commit
        - role
        - verifier_binary_sha256
        - source_artifacts
        - bindings
        - independence
        - checks
        - overall_status
      role_value: isolated_independent_verifier
      source_artifact_paths_in_order:
        - identity.json
        - maximal-order.json
        - factor-base.json
        - factor-base.sha256
        - controls.json
        - reference-box.json
        - reference-box/candidate-records.bin
        - reference-box/disposition.bin
        - reference-box/certificates.bin
        - verification.json
      independence_exact_keys:
        - separate_process
        - producer_outputs_closed_before_start
        - no_in_memory_producer_state
        - crypto_lib_dependency
        - shared_implementation_components
      independence_fixed_values: >-
        The first three fields are true; crypto_lib_dependency is false;
        shared_implementation_components is the empty array.
      check_ids_in_order:
        - source_inventory_complete
        - source_hashes_stable
        - identity_rederived
        - maximal_order_rederived
        - primality_proofs_replayed
        - factor_base_regenerated
        - controls_replayed
        - ref0_order_regenerated
        - ref0_candidate_bytes_equal
        - ref0_candidate_roots_equal
        - ref0_dispositions_regenerated
        - ref0_disposition_bytes_equal
        - ref0_disposition_roots_equal
        - ref0_certificates_replayed
        - source_commit_consistent
      bindings_type: binding_values
      status_rule: overall_status is PASS iff independence has its fixed values and every ordered check is PASS

    independent-agreement.json:
      schema_value: p192-wcm-independent-agreement-v1
      exact_top_level_keys:
        - schema
        - experiment_id
        - protocol_version
        - protocol_commit
        - source_commit
        - producer_verification_sha256
        - independent_verification_sha256
        - comparisons
        - overall_status
      comparison_record: >-
        Each comparison has exactly field, producer, verifier, and equal.
        producer and verifier are lowercase 64-hex; equal is a JSON boolean.
      comparison_fields_in_order:
        - curve_tuple_sha256
        - cm_order_tuple_sha256
        - factor_base_sha256
        - control_results_sha256
        - reference_candidate_shard_sha256
        - reference_candidate_shell_sha256
        - reference_disposition_shard_sha256
        - reference_disposition_shell_sha256
      status_rule: overall_status is PASS iff all eight records exist in exact order and every equal is true

    independent-verifier-receipt.json:
      schema_value: p192-wcm-independent-verifier-receipt-v1
      exact_top_level_keys:
        - schema
        - experiment_id
        - protocol_version
        - protocol_commit
        - source_commit
        - verifier_commit
        - run_dir
        - wrapper
        - producer
        - verifier
        - producer_artifacts_before
        - producer_artifacts_after
        - dependency_audit
        - agreement_path
        - agreement_sha256
        - overall_status
      wrapper_exact_keys: [binary_sha256, contains_curve_arithmetic]
      child_exact_keys:
        - binary_sha256
        - commit
        - build_profile
        - worktree_clean
        - argv
        - exit_code
        - stdout_sha256
        - stderr_sha256
        - started_sequence
        - completed_sequence
      dependency_audit_exact_keys:
        - verifier_crypto_lib_found
        - shared_implementation_components
        - audit_method
        - audit_output_sha256
      fixed_values: >-
        wrapper.contains_curve_arithmetic is false.  Each child build_profile is
        release and worktree_clean is true; a non-release or dirty binary cannot
        receive a PASS receipt.  Producer child commit equals
        source_commit; verifier child commit equals verifier_commit.  Producer
        argv is the resolved frozen producer template and verifier argv is the
        resolved frozen verifier template, replacing every RUN_DIR token or
        prefix with exactly run_dir.  Exit codes are zero.  Sequence integers
        satisfy producer.started < producer.completed < verifier.started <
        verifier.completed.  Before and after arrays are common artifact
        records in the independent verifier source-artifact order and are byte-
        for-byte equal.  verifier_crypto_lib_found is false and
        shared_implementation_components is empty.  agreement_path is exactly
        independent-agreement.json.  overall_status is PASS only when every
        child, inventory, audit, independent verification, and agreement gate
        passes.

  digest_projections:
    curve_tuple_sha256: >-
      SHA256(ASCII "P192-WCM-CURVE-TUPLE-v1\0" || RFC8785(identity.json.curve)).
    cm_order_tuple_sha256: >-
      SHA256(ASCII "P192-WCM-CM-ORDER-TUPLE-v1\0" || RFC8785(maximal-order.json.order)).
    factor_base_sha256: Raw SHA-256 of exact factor-base.json bytes.
    control_results_sha256: controls.json.control_results_sha256.
    reference_roots: Exact raw-root lowercase-hex renderings from reference-box.json.

  reference_box:
    shell_id: REF-0
    v_min: 1
    v_max: 2
    x_min: 0
    x_max_inclusive: 1024
    raw_pair_count: 1025
    shard_count: 1
    literal_index_mapping:
      - indices: 0..511
        v: 1
        x: 2*i+1
      - indices: 512..1024
        v: 2
        x: 2*(i-512)
    order_rule: >-
      Iterate i from 0 through 1024 inclusive using only the two literal
      mappings above.  This sentence expressly applies the v2 parity iterator
      to REF-0.  Reverse traversal may be a control computation only; serialized
      output is always in increasing i.  No estimate, factor, status, thread,
      or worker result may reorder, omit, or duplicate a candidate.
    scientific_exclusion: >-
      REF-0 records, dispositions, yields, and costs do not enter BOX-0, any
      scientific shell/family root, any relation count, or any timing claim.
    resume_scope: >-
      REF-0 is one short 1025-record logical shard and has no legal mid-shard
      checkpoint or resume mode.  The logical shard size remains 1048576; it is
      not shrunk to manufacture checkpoints.  Its three child binaries are
      written to same-directory temporary paths, closed, fsynced, and atomically
      renamed only when the sole shard and roots complete.  Role 1 has no
      external second-build or two-RUN_DIR comparison, does not inject or claim
      recovery from a process stop, and forbids reopening an existing RUN_DIR.
      Its determinism control is exactly the in-memory comparison frozen below.
      The v2 checkpoint-chain and interrupted-resume contract remains mandatory
      for Roles 2 through 4; Role 1 neither emits nor claims a checkpoint-chain
      or resume artifact.
    determinism_control:
      execution: two_independent_complete_in_memory_ref0_regenerations_per_implementation
      implementations_in_order: [producer, isolated_independent_verifier]
      regenerations_per_implementation: 2
      start_candidate_index: 0
      complete_candidate_count: 1025
      streams_compared_in_order:
        - candidate_records_bytes
        - disposition_records_bytes
        - certificate_store_bytes
      roots_compared_in_order:
        - candidate_shard_sha256
        - candidate_shell_sha256
        - disposition_shard_sha256
        - disposition_shell_sha256
      counters_compared_in_order:
        - nonprimitive_duplicate
        - complete
        - one_large_prime
        - two_large_prime
        - rejected
        - invalid
        - unresolved
      equality_rule: >-
        Within each implementation, the two regenerations independently create
        the complete REF-0 state from index zero in memory.  All three exact byte
        streams, all four roots, and all seven counters must be pairwise equal.
      external_process_or_run_directory_comparison_claimed: false
      crash_or_resume_claimed: false

  binary_artifacts:
    reference-box/candidate-records.bin:
      bytes: concat for i=0..1024 of u64be(v_i) || u64be(x_i)
      byte_length: 16400
      header: none
      footer: none
      bom_separator_newline: forbidden
      shard_rule: >-
        The entire file is R_0 for shard index 0 and n_0=1025.  Candidate shard
        and shell roots use the unchanged v2 domain separators and preimages.
        records_sha256 is SHA256 of these raw R_0 bytes, without a domain
        separator.
    reference-box/disposition.bin:
      bytes: >-
        T_0, the concatenation in candidate-index order of u8(status) ||
        u64be(candidate_index) || u8(has_certificates), followed iff status is
        1, 2, or 3 by candidate_certificate_sha256[32] ||
        factorization_certificate_sha256[32].
      status_codes:
        0: nonprimitive_duplicate
        1: complete
        2: one_large_prime
        3: two_large_prime
        4: rejected
        5: invalid
        6: unresolved
      certificate_flag: one exactly for status 1, 2, or 3; zero otherwise
      header: none
      footer: none
      bom_separator_newline: forbidden
      shard_rule: >-
        The entire file is T_0 with shard index 0, first index 0, and count 1025.
        Disposition shard and shell roots use unchanged v2 preimages.
        records_sha256 is SHA256 of these raw T_0 bytes, without a domain
        separator.
    reference-box/certificates.bin:
      bytes: >-
        ASCII "P192-WCM-REF-CERT-STORE-v1\0" || u64be(k) followed by k entries.
        Each entry is u64be(candidate_index) || u32be(candidate_byte_length) ||
        candidate_certificate_bytes || u32be(factorization_byte_length) ||
        factorization_certificate_bytes.  Certificate bytes are exactly the
        v2 CAND-v1 and FACT-v1 grammars.
      entry_rule: >-
        Entries are strictly increasing by candidate_index and exist exactly
        once for each disposition having status 1, 2, or 3; k equals that
        count.  The two embedded byte hashes equal the raw hashes carried by
        the matching disposition.  Lengths are minimal values encoded in the
        fixed-width unsigned fields; no alignment, padding, footer, newline,
        unreferenced certificate, or trailing byte is permitted.

  role1_control_subset:
    exclusion_rule: >-
      Role 1 executes exactly the controls below.  Toy-map, terminal-twist,
      mapped-generator, Q32-ranking, and A/A timing controls remain mandatory
      only in their later applicable roles and cannot block role-1 advancement.
    controls_in_order:
      - control_id: D23-ORDER3
        assertions:
          - canonical_reduced_form_norm_2
          - ideal_matches_form
          - alpha_certificate_valid
          - encoding_replays
          - relation_g2_cubed_identity
      - control_id: P192-SQRT-D
        assertions:
          - alpha_coordinates_minus_t_2
          - norm_equals_abs_D
          - factorization_equals_5_11_31_C
          - algebra_passes
          - C_degree_map_unavailable
          - C_scalar_action_rejected
      - control_id: P192-RAMIFIED-SQUARES
        assertions: [ell_5_scalar, ell_11_scalar, ell_31_scalar]
      - control_id: INERT-FACTOR-REJECTION
        assertions: [base_injection_rejected, residual_injection_rejected]
      - control_id: MUTATION-REJECTION
        assertions:
          - root_mutation_rejected
          - orientation_sign_mutation_rejected
          - exponent_mutation_rejected
          - alpha_coordinate_mutation_rejected
          - norm_factor_mutation_rejected
          - lp_endpoint_mutation_rejected
          - hnf_column_mutation_rejected
      - control_id: LP-CANCELLATION
        assertions: [unmatched_orientation_rejected, exact_conjugate_cancels]
      - control_id: REF0-SCALAR-SEGMENTED
        assertions:
          - candidate_bytes_equal
          - candidate_shard_root_equal
          - candidate_shell_root_equal
          - disposition_bytes_equal
          - disposition_shard_root_equal
          - disposition_shell_root_equal
          - retained_records_equal
      - control_id: REF0-DIRECTION-WORKERS
        assertions:
          - forward_reverse_candidate_root_equal
          - forward_reverse_disposition_root_equal
          - one_eight_worker_candidate_root_equal
          - one_eight_worker_disposition_root_equal
          - independent_in_memory_ref0_regenerations_streams_roots_counters_equal
      - control_id: LP-BOUNDARY
        assertions:
          - q_L_minus_1_not_prime_rejected_as_lp
          - q_L_prime_split_accepted_as_one_lp
          - q_L_plus_1_out_of_range_rejected_as_lp
          - residual_L_is_one_large_prime
          - residual_L_squared_is_two_large_prime_with_multiplicity_two
          - residual_L_squared_plus_one_is_rejected_by_inequality

