    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether median N_var(GP)/N_var(rand) ≤ 1−δ on Stage-1 toy cells
    under twin agreement and |Δ dim(V·V)|≤1 matching; deliver exactly one
