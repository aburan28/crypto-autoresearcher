  class: heuristic_validation
  class_note: >-
    Pre-registered δ band on a construction-family instrument. Not an
    exponent-moving breakthrough; no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Freeze δ=0.10, ε=0.15, GP seed roster, catalog_seed,
        encoder pin; twin self-check on probe GP V; write
        preregistered-predictions.json and v-catalog.json.
      - >-
        Stage 1. For (n,ℓ)∈{(17,3)} build ≥8 GP/random matched pairs with
        |Δ dim(V·V)|≤1; write stage1/panels.json, stage1/control-table.json,
        RESULTS.md with exactly one O-* label. (17,4) deferred after Stage-0
        match-feasibility disclosure.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Stage-2 multi-n panels and random-vs-random null under this card.
      - Editing IDEA-20261002-adb7bb claim text or GOAL-ECDLP2M-001.yaml.
      - Editing δ after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.
      - Reopening reject_scoped bands (8bdf86 ell89, 591d28 H1 factor-4).
      - Redesigning already-designed IDEA-20261001-6d1b48 / 878222 / 20561e /
        febbe1 / f20e41 / 94078e or the ell4 successor of 8196d7.

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-6c199f/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-6c199f/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-6c199f/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-6c199f/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-6c199f/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. implementation/run.py +
      check.py + gf2n.py + product_space.py + encode_s3.py are the
      hash-bound sources. Twin meters are the dual-implementation control.
      {run_dir} is substituted by the process supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261002-adb7bb.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-5c4afb.yaml
    delta: 0.10
    epsilon_null: 0.15
    catalog_seed: 2026100327
    stage1_cells:
      - {n: 17, ell: 3}
    stage1_deferred_cells:
      - {n: 17, ell: 4, reason: 'unstructured random dimVV support gap vs GP'}

  controls:
    - name: twin_dimVV_Nvar
      definition: >-
        dimVV path A == path B and N_var path A == path B on every measured V.
    - name: ctl_matched_dim_VV_within_1
      definition: Every reported pair satisfies |dimVV_GP − dimVV_rand| ≤ 1.
    - name: ctl_frozen_delta_epsilon
      definition: δ=0.10 and ε=0.15 frozen in preregistered-predictions.json.
    - name: ctl_shared_encoder_pin
      definition: Encoder pin frozen in preregistered-predictions.json.
    - name: ctl_min_matched_pairs
      definition: ≥8 matched pairs required; else O-INCONCLUSIVE.
    - name: ctl_no_posthoc_delta_edit
      definition: δ constant not edited after Stage-0 freeze.
    - name: null_random_vs_random_pairs
      definition: >-
        Stage 2 only (NOT AUTHORIZED). Named so the Stage-1 reading cannot
        silently claim the null.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_matched_ratio_n17]
    - name: cell
      levels: ['(17,3)']
    - name: v_family
      levels: [geometric_progression, random_matched]

  metrics:
    primary:
      - name: median_Nvar_ratio_GP_over_random
        unit: dimensionless
        definition: >-
          Median of N_var(GP)/N_var(rand) across matched pairs with
          |Δ dim(V·V)| ≤ 1.
      - name: band_holds
        unit: boolean
        definition: median_Nvar_ratio_GP_over_random ≤ 1−δ (= 0.90).
      - name: twin_agreement
        unit: boolean
        definition: Twin dimVV and N_var meters agree on every measured V.
      - name: matched_pair_count
        unit: integer
        definition: Number of pairs satisfying the match rule.
    secondary:
      - name: dimVV_GP
        unit: integer
      - name: dimVV_rand
        unit: integer
      - name: N_var_GP
        unit: integer
      - name: N_var_rand
        unit: integer
      - name: wall_clock_seconds
        unit: seconds

  heuristic_under_test: HEUR-BINSTD-adb7bb-H1

  preregistered_prediction:
    quantity: >-
      Median N_var(GP)/N_var(rand) ≤ 1−δ with δ=0.10 on each Stage-1 cell
      after twin agreement, across ≥8 matched pairs.
    formula: >-
      For each GP V, sample random dim-ℓ V until |dimVV_GP-dimVV_rand|<=1;
      ratio = N_var(GP)/N_var(rand); band holds iff median(ratio) <= 0.90.
    source: >-
      ledger/proposals/IDEA-20261002-adb7bb.yaml predictions; frozen before
      Stage 1 in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Construction-family instrument on n=17 only under this card. No transfer
      of a δ band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids band claims (O-ARTIFACT).
    - Fewer than 8 matched pairs → O-INCONCLUSIVE (not O-SUPPORT).
    - Match-rule violations must not appear in reported pairs.

  seeds_and_replication:
    catalog_seed: 2026100327
    gp_seeds: [3, 5, 7, 9, 11, 13, 17, 19, 21, 25, 27, 33]
    independent_instances: 1
    note: >-
      Cell (17,3) is the authorized Stage-1 instance. Twin meters are the
      replication instrument for each V. (17,4) deferred.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 2.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and v-catalog.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-BINSTD-5c4afb.
    - maximum_runs = 4.
    - Do not open Stage-2 under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure → O-ARTIFACT; do not read band as support.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok true on probes; Stage 1 produces
    median N_var(GP)/N_var(rand) vs ≤1−δ band for each Stage-1 cell with twin
    agreement and |Δ dimVV|≤1 matching (or a named
    O-ARTIFACT/O-IMPEDIMENT/O-INCONCLUSIVE stop); RESULTS.md names exactly
    one O-* label from H-BINSTD-5c4afb with cited artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; post-hoc δ edit; a claimed break/exponent
    under this card. (O-FAIL-BAND is a valid scientific negative of
    O-SUPPORT, not a protocol fail.)

  required_artifacts:
    - experiments/EXP-BINSTD-6c199f/trial-plan-v1.json
    - experiments/EXP-BINSTD-6c199f/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-6c199f/stage0/v-catalog.json
    - experiments/EXP-BINSTD-6c199f/stage1/
    - experiments/EXP-BINSTD-6c199f/RESULTS.md
    - experiments/EXP-BINSTD-6c199f/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-6c199f/implementation/run.py
    - experiments/EXP-BINSTD-6c199f/implementation/check.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
