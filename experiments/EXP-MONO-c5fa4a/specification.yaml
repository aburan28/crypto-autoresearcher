# EXP-MONO-c5fa4a
# Integer slice of two written orders. No curve is enumerated.
# Approved by DEC-20261006-6a6989.
experiment:
  id: EXP-MONO-c5fa4a
  hypothesis_id: H-MONO-5e0edb
  source_idea: IDEA-20261005-70b25b
  question_id: RQ-MONO-001
  version: 1
  title: Wreath order 8 versus degree-4 order 4
  status: approved
  frozen: true
  designed_at: '2026-10-06'
  approved_by: coordinator
  approval_decision_id: DEC-20261006-6a6989
  objective: >-
    Check the orders 8 and 4, the product 32, and the nearby gap 0.
  inputs:
    order_hi: 8
    order_lo: 4
    order_gap: 4
    order_product: 32
    order_sum: 12
    nearby_a: 4
    nearby_b: 4
    nearby_gap: 0
    nearby_product: 16
  controls:
    - >-
      The wreath order is 8. The degree-4 order is 4. Reporting
      both orders as 4 drops the gap and invalidates the run.
    - >-
      Eight exceeds four by 4. The product of 8 and 4 is 32. Their
      sum is 12.
    - >-
      Two readings of the degree-4 order are both 4. Their gap is
      0 and their product is 16.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {read, subtract}
  metrics:
    primary:
      - order_hi
      - order_lo
      - order_gap
      - implementations_agree
    secondary:
      - order_product
      - order_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The wreath order is 8 and the degree-4 order is 4. The gap
      of two degree-4 orders is 0.
    formula: >-
      Read the order 8. Read the order 4. Subtract 4 from 8.
      Multiply 8 by 4. Subtract 4 from 4.
    source: >-
      IDEA-20261005-70b25b writes a wreath stabiliser of order 8
      and a degree-4 closure of order 4, read 2026-10-06. The gap,
      the product, and the sum were recomputed in this design
      session. That computation is not a run. No curve was enumerated.
  scale_relevance:
    tier: toy
    justification: Two written orders. No transfer to a monodromy group.
    correspondence: null
  tail_checks:
    - The product 32 and the nearby gap 0 are required. A check that stops at the order 8 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the order 8 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The wreath order is not 8.
    - The degree-4 order is not 4.
    - The product is not 32.
    - Both orders are reported as 4, or a curve is enumerated.
  success_criterion: >-
    Both runs agree that the wreath order is 8, that the degree-4
    order is 4, and that the product of those two orders is 32.
  falsification_criterion: >-
    The runs agree that the wreath order is computed, and that
    order is not 8.
  required_artifacts:
    - experiments/EXP-MONO-c5fa4a/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-MONO-c5fa4a/runs/<RUN-ID>/command.txt
    - experiments/EXP-MONO-c5fa4a/runs/<RUN-ID>/stdout.log
    - experiments/EXP-MONO-c5fa4a/runs/<RUN-ID>/stderr.log
    - experiments/EXP-MONO-c5fa4a/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-MONO-c5fa4a/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any enumeration of a curve, Frobenius element, or monodromy group.
    - Any claim that an order gap of 4 moves an exponent.
    - Any comparison with a summation-polynomial solver.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
