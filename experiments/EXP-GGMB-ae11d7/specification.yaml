experiment:
  id: EXP-GGMB-ae11d7
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-63056d
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE L12 ADJUDICATION PROCEDURE: a six-question decision tree with a fixed verdict alphabet,
    a mandatory witness artifact per verdict, and a declared ceiling of one hour of agent work and
    sixty seconds of compute per oracle, so that "is this oracle generic-group simulable?" becomes
    a routine pre-compute gate any lane runs on its own oracle instead of a bespoke argument the audit
    lane must write fourteen times'
  status: draft
  objective: "(A) THE PROBLEM THIS SOLVES. GOAL-ENDO-001 completion criterion C3 requires that EVERY\
    \ oracle class invented by ANY lane be adjudicated as simulable or non-simulable with an explicit\
    \ argument. There are fourteen lanes. The only adjudication the corpus contains (KN-FIND-b7e091,\
    \ four oracles) was a bespoke analysis, and bespoke analyses do not scale to fourteen lanes generating\
    \ oracles continuously. Without a procedure, C3 is either unmet or met by assertion.\n(B) THE\
    \ THEORETICAL BASIS, IN ONE SENTENCE. Let lambda be the map sending a group handle to its formal\
    \ linear form (alpha, beta) in (Z/N)^2. GENERIC- GROUP SIMULABILITY IS EXACTLY THE INVENTOR-PROTOCOL\
    \ LOSSY-PROJECTION TEST WITH PROJECTION lambda: an oracle is simulable when its answer is a function\
    \ of lambda plus non-encoding public data, i.e. when the oracle's own tracked object propagates\
    \ through the projection that the group operations preserve; it escapes when its answer needs\
    \ the coordinates lambda discards. This identity is what makes the audit mechanical, and it is\
    \ stated here so the procedure is not a checklist with no theory under it.\n(C) THE PROCEDURE.\
    \ Six questions, asked in this order. Each terminates in a verdict from the fixed alphabet {SIM,\
    \ PUB, COST, PRIV, OPEN}. Each verdict requires a specific artifact, and a verdict without its\
    \ artifact is not a verdict.\n  Q0  FREEZE THE SPECIFICATION. Write the oracle as\n      O : (handles\
    \ h_1..h_r ; field/public args) -> answer type, and state\n      its QUANTIFIER STRUCTURE: is\
    \ it a VERIFY oracle (checks a supplied\n      object) or a SEARCH oracle (returns an object asserted\
    \ to exist)?\n      Two oracles with the same signature and different quantifier structure\n \
    \     are DIFFERENT ORACLES with different simulator costs. No further\n      question may be\
    \ asked until this is frozen.\n      ARTIFACT: the frozen signature with its quantifier structure.\n\
    \  Q1  IS THE ANSWER INDEPENDENT OF ALL HANDLES -- a function of the curve\n      data and adversary-supplied\
    \ field elements only? If yes: verdict SIM\n      with T_sim = 0 group operations, and additionally\
    \ the answer carries\n      zero bits about k (see IDEA-20260807-413fcc).\n      ARTIFACT: the\
    \ explicit public function.\n  Q2  DOES THE ANSWER FACTOR THROUGH lambda? I.e. is there f with\n\
    \      answer = f(lambda(h_1), .., lambda(h_r), p, a, b, N, args), computable\n      without k?\
    \ If yes: verdict SIM. Compute T_sim = cost(f) in group\n      operations, AND STATE IT -- a SIM\
    \ verdict without T_sim is incomplete\n      because a large T_sim makes the closure quantitatively\
    \ vacuous\n      (IDEA-20260807-7270d1).\n      ARTIFACT: the explicit f and the explicit T_sim.\n\
    \  Q3  IS THE ANSWER COMPUTABLE IN poly(log p) TIME BY THE REAL ADVERSARY,\n      which holds\
    \ (p, a, b, N, P, Q) as concrete data and knows the linear\n      form it used to build each handle?\
    \ If yes: verdict PUB. The oracle\n      hands the adversary nothing it did not have; the GGM\
    \ adjudication is\n      SILENT, not negative; the lane must be re-posed as a charged algorithm.\n\
    \      ARTIFACT: the poly-time algorithm computing the answer.\n  Q4  IS THE ANSWER COMPUTABLE\
    \ AT ALL WITHOUT k? If no: verdict PRIV. The\n      oracle is not realizable by an adversary and\
    \ is not an attack model.\n      (KN-FIND-b7e091's Oracle A is the type case.)\n      ARTIFACT:\
    \ the argument that the answer determines k, or vice versa.\n  Q5  THE ONLY REMAINING CELL: the\
    \ oracle is realizable at superpolynomial\n      cost C. Verdict COST. The adjudication is now\
    \ arithmetic, not logic:\n      state C, state the query count q an actual algorithm would need,\
    \ and\n      evaluate q*C + g against 0.886*sqrt(N).\n      ARTIFACT: the pair (C, q) with the\
    \ source of each, and the arithmetic.\n  If Q0-Q5 cannot be answered within the declared budget:\
    \ verdict OPEN, with\n  the exact question that blocked and what would unblock it. OPEN IS A LEGAL\n\
    \  AND HONEST VERDICT and is strictly better than a guessed SIM.\n\n(D) THE QUANTIFIER-FORM OBLIGATION,\
    \ WHICH IS WHERE SIMULABILITY ARGUMENTS ACTUALLY DIE. Any non-SIM verdict must declare which of\
    \ two statements it establishes:\n  (N-weak)  there exist two instances with identical generic\
    \ transcript\n            distributions and different oracle answers -- so no simulator\n    \
    \        that is a FUNCTION OF lambda ALONE is correct;\n  (N-strong) for every efficient generic\
    \ simulator there is a distinguisher.\n(N-weak) does not imply (N-strong): a simulator may lazily\
    \ SAMPLE consistent answers instead of computing them. Every existing non-simulability verdict\
    \ in this corpus is (N-weak). The procedure requires the label, and reporting (N-weak) as (N-strong)\
    \ is the lane's characteristic overclaim.\n(E) THE BUDGET, WHICH IS PART OF THE CLAIM. The procedure\
    \ is asserted to terminate on a well-specified oracle in <= 60 minutes of agent work and <= 60\
    \ seconds of compute, with no Groebner basis, no curve enumeration, and no run record. If a lane's\
    \ oracle cannot be adjudicated in that budget, the verdict is OPEN and the oracle is flagged as\
    \ under-specified -- which is itself the useful output, because an oracle nobody can specify in\
    \ an hour is an oracle nobody can implement.\n(F) WHAT WOULD REFUTE IT. Any oracle for which two\
    \ competent independent adjudications, both following the procedure, return different verdicts.\
    \ That is an inter-rater failure and it means the procedure's questions are not well-posed. The\
    \ design includes the inter-rater check for exactly this reason, and a failure is the useful result."
  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: Consumes no non-generic resource; it is the instrument that decides which
    resource other lanes consume. Admissible as tooling under DECOMPOSITION.md section 4, lane L12,
    whose stated decisive test is "an explicit simulator, or an explicit proof that none exists" --
    this proposal is the bounded-time procedure for producing one or the other, plus the third and
    fourth outcomes (PUB, PRIV) that the binary framing has no slot for.
  reachability_gate: 'NOT APPLICABLE: no curve motion is proposed. The procedure does, however, adjudicate
    oracles that PROPOSE curve motion, and for those Q0 must record whether the oracle''s answer requires
    reaching a SPECIFIED curve (which costs the vectorization problem, ~p^{1/4} classically per DECOMPOSITION.md
    T5) or a RANDOM one (O(log p) steps under GRH). That cost enters at Q5 as part of C and must not
    be omitted, because an oracle whose implementation includes an unreachable curve has C = infinity
    for practical purposes.'
  inputs:
    procedure: 'STAGE 0 (2-3 hours, zero compute): write the runbook and the oracle schema. STAGE
      1 (HARD GATE, 2 hours, zero compute): adjudicate the nine-oracle control set and compare against
      the nine pre-registered verdicts. A single mismatch halts everything downstream. STAGE 2 (HARD
      GATE, zero compute): the decay controls -- re-adjudicate three control oracles with r in {0,
      8, 64, 256} random bits appended and with d in {0, 2} irrelevant handle arguments. Every verdict
      must be invariant. STAGE 3 (2 hours, zero compute): the inter-rater check on three oracles,
      run in independent sessions. STAGE 4 (<= 10 agent-hours, <= 10 minutes compute): adjudicate
      the ten campaign candidate classes, recording elapsed time per oracle. STAGE 5 (zero compute):
      publish the verdict table and the measured budget, and bind the schema into the next batch''s
      proposal requirements. TOY COMPUTE IS USED ONLY to instantiate (N-weak) witnesses concretely
      on p <= 2^20 curves so a third party can check them. It does not bound the verdicts, which are
      arguments.'
    mechanism: 'STEP 1 -- WRITE THE RUNBOOK as a single markdown page with the six questions, the
      five verdicts, the artifact required per verdict, the composition table, and the frozen simulator
      knowledge set {handles, group oracle, p, a, b, N, lambda} with its explicit exclusions {coordinates
      of P and Q, k}.

      STEP 2 -- ENCODE THE ORACLE SPECIFICATION SCHEMA. A machine-readable YAML block: name, signature,
      handle arity, field-argument list, answer type, quantifier structure (verify | search), and
      the lane that proposed it. This is what Q0 produces and it is the only input the procedure needs.

      STEP 3 -- CALIBRATE ON THE FROZEN CONTROL SET before adjudicating anything new. The set is supplied
      by IDEA-20260807-5ddd98 and must include, at minimum: the pure group-operation oracle (must
      return SIM, T_sim = 1); the public-curve-data oracle (SIM, T_sim = 0); KN-FIND-b7e091''s Oracle
      C in verify form (SIM, T_sim = O(m)) and Oracle D (SIM, T_sim = O(log N)); Oracle A (PRIV);
      Oracle B (PUB); the x-coordinate oracle (PUB); the DLP oracle (COST, with C = best known DLP
      cost); and the sham random-answer oracle (SIM, T_sim = 0). Nine specifications, nine required
      verdicts, all pre-registered. ANY MISMATCH HALTS THE PROCEDURE AND VOIDS ITS OUTPUT.

      STEP 4 -- INTER-RATER CHECK. Two independent adjudications of the same three oracles, by sessions
      that do not see each other''s verdicts, with agreement measured on the verdict symbol AND on
      the order of magnitude of T_sim or C. Disagreement on the symbol is a design failure of the
      procedure. Disagreement on the magnitude only is a documentation failure and is repaired by
      tightening Q2/Q5.

      STEP 5 -- RUN IT on the campaign''s ten named candidate oracle classes and publish the verdict
      table, with the elapsed time per oracle recorded so the budget claim in (E) is measured rather
      than asserted.

      STEP 6 -- BIND IT. Every subsequent BATCH proposal in GOAL-ENDO-001 that names an oracle carries
      its verdict record. A lane that proposes an oracle without one is incomplete in the same way
      a proposal without dominated_by is incomplete.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - nine-oracle frozen control set with pre-registered verdicts (blocking)
  - 'sham random-answer oracle: must be SIM, T_sim = 0 (null direction)'
  - 'DLP oracle: must be COST (planted-signal direction)'
  - 'anomalous-curve p-adic-log oracle on a trace-one toy curve: must be PUB AND must surface the
    O(log p) implementing algorithm (planted-signal direction, and the harder of the two)'
  - decay controls in r (appended random bits) and d (irrelevant handles)
  - 'inter-rater: two independent sessions, three oracles'
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, and this instrument needs BOTH directions
    because it is an instrument (GOAL-ENDO-001 criterion C4, RQ-INSTR-f8faa0). REJECTS A MATCHED NULL:
    the sham oracle O_rand returning uniform random answers of the correct type must be adjudicated
    SIM with T_sim = 0. An instrument that awards O_rand anything else is manufacturing structure.
    DETECTS A PLANTED SIGNAL: the DLP oracle must be adjudicated COST, and the anomalous-curve p-adic-logarithm
    oracle on a trace-one toy curve (KN-TECH-033) must be adjudicated PUB WITH AN IMPLEMENTING ALGORITHM
    THAT SOLVES THE INSTANCE IN O(log p) -- i.e. the procedure must not merely label it, it must surface
    that the labelled algorithm is an attack. An instrument that returns a bland PUB for the Smart-attack
    oracle without surfacing the O(log p) implementing algorithm has failed the planted-signal direction
    and is void. DECAY PARAMETER: r, the number of independent uniform random bits appended to the
    oracle''s answer. Every verdict must be invariant in r for r in {0, 8, 64, 256}. A verdict that
    moves with r is reading noise. SECOND DECAY PARAMETER: d, the number of irrelevant handle arguments
    added to the signature; verdict must be invariant in d while T_sim may grow.'
  independent_variables: []
  metrics:
    primary:
    - verdict symbol, T_sim or C, and artifact per oracle
    - quantifier form (N-weak / N-strong) per non-SIM verdict
    - control-set reproduction count out of nine
    - inter-rater agreement count out of three
    secondary:
    - elapsed agent minutes and compute seconds per oracle
    - count of OPEN verdicts and the blocking question for each
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'control-set reproduction: number of the nine pre-registered verdicts reproduced'
    formula: 9 of 9 on the symbol, and T_sim/C within one order of magnitude on all nine. 8 or fewer
      voids the procedure and it may not be used to adjudicate anything. Pre-registered before the
      runbook is written.
    source: pre-registered in IDEA-20260807-63056d before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - SPECIFICATION LAUNDERING. A lane that wants a NON-SIM verdict can get one by writing its oracle
    with extra encoding-dependence it does not need. Q0's freeze plus the artifact requirement is
    the defence, and the adjudicator must ask whether the encoding-dependence is load-bearing for
    the lane's actual mechanism.
  - VERDICT AS RANKING. SIM/PUB/COST is not an ordering by danger; the x-coordinate / Smart-attack
    collision proves it. Any downstream use of the symbol as a priority signal is a misuse and should
    be caught in review.
  - ADJUDICATOR ANCHORING. An adjudicator who has read the lane's proposal knows what verdict the
    lane wants. The inter-rater check should use a session that has seen the frozen signature and
    NOT the motivating proposal.
  - BUDGET GAMING. "Adjudicated in 45 minutes" is worthless if the 45 minutes produced a guess. The
    artifact requirement is what makes the time meaningful; a verdict whose artifact is a paragraph
    of prose asserting the conclusion has not been adjudicated.
  - TOY-SCALE LEAKAGE. The (N-weak) witnesses are exhibited at p <= 2^20. They are illustrations of
    an argument, not measurements, and must never be reported as toy-scale evidence for a verdict.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 9 of 9 on the symbol, and T_sim/C within one order of magnitude on all nine.
    8 or fewer voids the procedure and it may not be used to adjudicate anything. Pre-registered before
    the runbook is written.
  falsification_criterion:
  - The control set does not reproduce all nine pre-registered verdicts. The procedure is void and
    no verdict it produced may be cited.
  - Independent adjudicators disagree on a verdict symbol. The questions are not well-posed; the procedure
    is a draft, not an instrument, and must be revised under a new record rather than patched.
  - A verdict changes when r random bits are appended or d irrelevant handles are added. The procedure
    is reading noise.
  - 'The Smart-attack oracle receives PUB without the implementing algorithm being surfaced. The planted-signal
    direction has failed: the procedure can label an attack as harmless, which is the worst failure
    mode available to it, and it is void until Q3''s artifact requirement is strengthened.'
  - More than 2 of 10 campaign oracles exceed the 120-minute ceiling. Claim (E) is false; record the
    measured budget honestly and either relax the claim or simplify the questions. This falsifies
    the ROUTINENESS claim, not the correctness claim, and the two must not be conflated in the write-up.
  - A lane exhibits an oracle for which the composition table gives the wrong verdict. The table is
    repaired under a superseding record, and every compound verdict derived from it is re-derived.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-63056d
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
