# EXP-SSI-474826
# Residual ambiguity of depth-two Phi_2 walks after the middle label.
# Frozen before any run. Counts below are a prediction, not a result.
experiment:
  id: EXP-SSI-474826
  hypothesis_id: H-SSI-991d0e
  source_idea: IDEA-20261004-e4c461
  question_id: RQ-SSI-1946c9
  goal_id: GOAL-SSI-2fa82a
  version: 1
  title: >-
    Middle-label endpoint fibers on the Phi_2 graph at p=7, 11, 19
  status: approved
  frozen: true
  designed_at: '2026-10-05'
  approved_by: coordinator
  approval_decision_id: DEC-20261005-850856
  objective: >-
    Build the Phi_2 neighbor relation, group depth-two walks by
    the pair (start, middle), and count the pairs that still
    reach more than one endpoint.
  inputs:
    primes: [7, 11, 19]
    supersingular_j:
      7: [6]
      11: [0, 1]
      19: [7, 18]
    phi2: >-
      -X^2 Y^2 + X^3 + Y^3 + 1488 X^2 Y + 1488 X Y^2
      - 162000 X^2 - 162000 Y^2 + 40773375 X Y
      + 8748000000 X + 8748000000 Y - 157464000000000
    predicted_neighbors:
      7: {6: [6]}
      11: {0: [1], 1: [0, 1]}
      19: {7: [7, 18], 18: [7, 18]}
    predicted_fibers:
      7:
        - {start: 6, middle: 6, endpoints: [6]}
      11:
        - {start: 0, middle: 1, endpoints: [0, 1]}
        - {start: 1, middle: 0, endpoints: [1]}
        - {start: 1, middle: 1, endpoints: [0, 1]}
      19:
        - {start: 7, middle: 7, endpoints: [7, 18]}
        - {start: 7, middle: 18, endpoints: [7, 18]}
        - {start: 18, middle: 7, endpoints: [7, 18]}
        - {start: 18, middle: 18, endpoints: [7, 18]}
    predicted_ambiguous_middles:
      7: 0
      11: 2
      19: 4
    predicted_separated_middles:
      7: 1
      11: 1
      19: 0
    predicted_max_endpoint_fiber:
      7: 1
      11: 2
      19: 2
    predicted_full_walk_disagreements:
      7: 0
      11: 0
      19: 0
  controls:
    - >-
      Loop control. At p=7 the only pair is (6, 6) and its only
      endpoint is 6, so ambiguous middles are 0.
    - >-
      One separated step. At p=11 the pair (1, 0) has endpoint
      set {1}, and the pairs (0, 1) and (1, 1) do not.
    - >-
      Full-neighbor control. At p=19 every pair has endpoint set
      {7, 18}, so separated middles are 0.
    - >-
      Full publication. A walk that also publishes its end has
      endpoint disagreement 0.
    - >-
      Two formulas. One evaluates the monomial Phi_2. The other
      evaluates the cubic in Y with coefficients
      1,
      -X^2 + 1488 X - 162000,
      1488 X^2 + 40773375 X + 8748000000,
      X^3 - 162000 X^2 + 8748000000 X - 157464000000000.
      They must not import each other's neighbor lists.
  independent_variables:
    - prime in {7, 11, 19}
    - phi2_formula in {monomial, cubic}
  metrics:
    primary:
      - neighbor_sets
      - middle_fibers
      - ambiguous_middles
      - separated_middles
      - max_endpoint_fiber
      - routes_agree
    secondary:
      - full_walk_disagreements
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: >-
      Neighbor sets and the (start, middle) endpoint fibers under
      inputs. Ambiguous middles are 0, 2, 4. Separated middles
      are 1, 1, 0. The largest endpoint fiber has size 1, 2, 2.
    formula: >-
      A walk is a triple (j0, j1, j2) with Phi_2 edges on distinct
      neighbor j-invariants. The fiber of (j0, j1) is the set of
      j2 reached from that pair. The pair is ambiguous when that
      set has size greater than 1.
    source: >-
      IDEA-20261004-e4c461, specialized to the middle label on
      this Phi_2 graph. The fibers were computed in the design
      session and are not a run.
  scale_relevance:
    tier: toy
    justification: >-
      Three primes and at most two vertices. No transfer to a
      cryptographic isogeny encryption scheme.
    correspondence: null
  tail_checks:
    - >-
      p=7 and the pair (1, 0) at p=11 must be reported. Dropping
      either separated cell invalidates the batch.
    - >-
      Neighbor lists and endpoint lists are sorted increasingly.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: >-
      Deterministic. One manifest per prime and Phi_2 formula.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - Stop after six valid manifests.
    - Do not add a prime, a level, or a vertex.
    - Do not continue a cell after the formulas disagree.
  invalidation_rules:
    - The two Phi_2 formulas disagree.
    - A neighbor outside the frozen supersingular set is added.
    - Edge multiplicity is treated as a distinct middle.
    - A timeout, crash, or missing manifest.
  success_criterion: >-
    All six manifests are valid, the formulas agree, neighbor sets
    and middle fibers match, ambiguous middles are 0, 2, and 4,
    separated middles are 1, 1, and 0, the largest endpoint fiber
    has size 1, 2, and 2, and full-walk disagreements are 0.
  falsification_criterion: >-
    The formulas agree and any neighbor set, middle fiber,
    ambiguous-middle count, separated-middle count, or largest
    fiber differs from the table. A formula disagreement does not
    meet this criterion.
  required_artifacts:
    - experiments/EXP-SSI-474826/runs/<run-id>/command.txt
    - experiments/EXP-SSI-474826/runs/<run-id>/stdout.txt
    - experiments/EXP-SSI-474826/runs/<run-id>/stderr.txt
    - experiments/EXP-SSI-474826/runs/<run-id>/result.json
    - experiments/EXP-SSI-474826/runs/<run-id>/middles.json
  assigned_to: executor
  out_of_scope:
    - A CSIDH or SiGamal implementation.
    - Any prime outside {7, 11, 19}.
    - Depth other than 2.
    - Multiplicity-weighted transition probabilities.
    - Editing the unlabeled walk contract.
