experiment:
  id: EXP-ICEX-b02f77
  hypothesis_id: H-ICEX-5acf1c
  derived_from_idea: IDEA-20260807-32f96d
  question_id: RQ-ICEX-001
  batch_id: BATCH-d6838c
  version: 1
  title: >-
    THE FIRST MEASURED COST CELL AT ARITY 4, OR AN HONEST CENSORING FRONTIER-
    paired m4-over-m3 charged-cost ratios on the SAME curves at the SAME field
    size, replacing a CI-exclusion test that the committed m = 3 interval makes
    impossible to cross, with a matched rho arm on every instance, a
    support-matched curve-free null at every arity, and every censored cell
    recorded as a one-sided bound rather than discarded
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. The ICEX cost model is DECREASING in arity while the
    Semaev polynomial degree grows doubly-exponentially in arity, and the corpus
    contains ZERO measured cost cells at m greater than 3. EV-R6-001 records
    VERBATIM that the m = 4 arm was censored entirely and that no m = 4
    measurement exists in that evidence, with even F = 6 at ell about 2^10.5
    exceeding 300 seconds. Which of the two opposed effects wins on this solver
    stack has therefore never been measured.
    (B) THE BAND PROBLEM THIS CONTRACT FIXES, COMPUTED BEFORE THE DESIGN. The
    source proposal discriminator is -any m = 4 value with a CI that excludes the
    m = 3 value-. The committed m = 3 value is alpha = 2.074 with bootstrap 90
    percent CI (1.565, 2.621), HALF-WIDTH 0.53. The whole effect the cost model
    predicts is (1+gamma)/12, about 0.52 at gamma = 5.2. Adding an m = 4 fit own
    interval, exclusion would need a shift of roughly 1.0 - about twice the
    predicted effect. THE DISCRIMINATOR CANNOT FIRE AND THE DESIGN IS BROKEN AS
    WRITTEN. It is replaced by a PAIRED RATIO on matched instances, where the
    per-curve and per-target variance cancels instead of being estimated twice.
    (C) THE REPLACEMENT AND ITS DYNAMIC RANGE. R(ell) = charged cost per target at
    m = 4 over charged cost per target at m = 3, same curve, same ell, same
    solver, same seed, same unit. DERIVED- under the cost model with gamma
    m-independent, R = ell^{-(1+gamma)/12}, about 0.024 at ell = 2^10.5. Under
    degree growth, R is far above 1. BANDS FROZEN HERE- R below 1/3 reads as the
    1/m gain; R above 3 reads as degree growth; R in [1/3, 3] is INCONCLUSIVE and
    is reported as such. Two explanations two orders of magnitude apart across a
    one-order band.
    (D) THE PRIMARY DELIVERABLE. THE CENSORING FRONTIER. Every m = 4 cell in the
    corpus is censored, so the most likely honest output of this contract is the
    largest (m, F) that completes within a declared 3600-second per-cell budget,
    with each censored cell carrying the ONE-SIDED BOUND R > budget / cost_m3. AN
    EMPTY CENSORED INVENTORY AT m = 5 IS TREATED AS SUSPICIOUS, NOT AS SUCCESS.
    (E) WHAT IS NOT DECIDED. RQ-ICEX-001 in either direction; the EXP-ICEX-146ff5
    dispute, which this contract does not touch; and the crossover arity at
    cryptographic ell, which is unreachable.
  inputs:
    cost_unit: >-
      CHARGED COST IS COUNTED IN GROUP-OPERATION EQUIVALENTS, with the conversion
      from algebraic-solver work DECLARED AND FROZEN BEFORE ANY CELL RUNS and the
      raw solver operation counts reported alongside. WALL-CLOCK SECONDS ARE THE
      BUDGET AND CENSORING VARIABLE ONLY. THE PAIRED RATIO R HAS THE SAME UNIT ON
      BOTH SIDES and contains no wall-clock term. Memory is reported per cell in
      allocator BYTES with a peak.
    unit_discipline: >-
      BINDING. Every value carries a tag in {group_ops, solver_ops, bytes,
      seconds, dimensionless}. Cross-tag arithmetic requires a named recorded
      conversion. No ratio in this contract mixes tags, and no wall-clock figure
      is divided by an operation count anywhere.
    frozen_before_execution: >-
      The Groebner engine and its version, the monomial order, the extraction
      method, the group-operation conversion, the ell ladder, the B tuning rule
      matching the counting heuristic across m, the seed lists shared across
      arities, the per-cell budget of 3600 seconds, and the bands 1/3 and 3 on R.
      None may change after any cell runs; a change is a versioned
      protocol_amendment and a new contract version.
    pairing_discipline: >-
      THE RATIO IS PAIRED OR IT IS NOT REPORTED. Each R value comes from one
      curve, one ell, one target set and one seed, solved at m = 3 and at m = 4
      with the same engine and the same conversion. A ratio assembled from
      different curves, different ell or different seeds is INADMISSIBLE and the
      harness refuses to emit one.
    censoring_discipline: >-
      A cell exceeding its 3600-second budget is recorded as CENSORED with the
      budget, the elapsed time, the last completed solver stage, the peak memory
      and the derived ONE-SIDED BOUND R > budget / cost_m3 at that ell. Censoring
      is an infrastructure receipt under AGENTS.md rule 5 and is NEVER counted as
      evidence about the arity axis in either direction.
    procedure: >-
      STAGE 0 (blocking regression). Reproduce EV-R6-001 at m = 3 for
      F in {12, 14, 16}- fitted alpha inside CI90 [1.565, 2.621], d_reg median
      2.0, and the matched rho exponent inside CI90 (0.4813, 0.5161) with all
      recoveries exact. A miss HALTS the run; this stack is then not the one that
      produced the committed anchor and no m = 4 number would be admissible.
      STAGE 1 (arity feasibility probe, cheap, decides the shape of the run). At
      the SMALLEST ell only, attempt one m = 4 cell and one m = 5 cell at the
      smallest B satisfying the counting-heuristic match, each under the full
      3600-second budget. Record whether either completes. THE OUTCOME OF THIS
      PROBE IS ITSELF A DELIVERABLE and is recorded before anything else is
      attempted.
      STAGE 2 (paired main arms). For each ell in the ladder and each curve, run
      m = 3 and m = 4 on the SAME target set with the SAME seed and record R. Then
      attempt m = 5 on the same instances. Report every completing R and every
      censored one-sided bound.
      STAGE 3 (curve-free null at every arity). Repeat stage 2 on support-matched
      random polynomial systems of the same dimension and support, containing no
      curve equation, through the identical code path and counters. Report the
      real-over-null charged-cost ratio per arity against the committed m = 3
      value of 1.3 to 1.5.
      STAGE 4 (solving degree). Record the measured solving degree per cell per
      arity against the 2^{m-2} scaling, with the engine and monomial order named
      on every row.
      STAGE 5 (report). Emit the censoring frontier table, the paired R table with
      its band verdicts, the one-sided bound inventory, the real-over-null table,
      the solving-degree table, the decomposition-stage-versus-total split, and
      the rho ratio on every instance.
    mechanism: >-
      STEP 1. One decomposition harness parameterised by arity, one charged
      counter, one censoring rule, one reporting path, shared by the m = 3, m = 4,
      m = 5, curve-free and rho arms.
      STEP 2. B is tuned per arity so the counting heuristic is MATCHED across m,
      and the decomposition stage is reported SEPARATELY from the total because
      changing B changes the linear-algebra stage.
      STEP 3. Every recovered decomposition carries a certificate reverified
      independently of the solver; an unverified decomposition is a failure and
      not a decomposition.
      STEP 4. Every cell reports its ratio to the matched rho run on the SAME
      instance, so no arity number is ever quoted in isolation.
      STEP 5. Every row is reported as (arm, m, ell, B, curve, seed, engine,
      order, charged group ops, solver ops, solving degree, success, peak bytes,
      wall seconds, censored flag), never as a scalar.
    instrument: >-
      The existing Semaev decomposition harness with an arity parameter, an
      explicit charged-operation counter, an allocator-level memory probe and a
      hard per-cell wall-clock censoring rule. The memory risk is the m = 5
      Macaulay object; the cap is enforced and an exceedance is recorded as
      CENSORED-BY-MEMORY, coded SEPARATELY from time censoring because they are
      different mechanisms.
  controls:
    - >-
      CONTROL 1, m = 3 REGRESSION AGAINST THE COMMITTED ANCHOR (blocking). Fitted
      alpha inside CI90 [1.565, 2.621] and d_reg median 2.0 at F in {12, 14, 16}.
    - >-
      CONTROL 2, MATCHED RHO ON EVERY INSTANCE (blocking). Fitted rho exponent
      inside CI90 (0.4813, 0.5161) with every recovery exact. Every arity number is
      reported as a ratio to rho on the same instances. A rho arm that misses its
      committed exponent is an INSTRUMENT FAILURE and the run is INVALID.
    - >-
      CONTROL 3, CURVE-FREE SUPPORT-MATCHED NULL AT EVERY ARITY (blocking for
      interpretation). Random polynomial systems of the same dimension and support
      with no curve equation, through the identical code path. PRE-STATED
      CONSEQUENCE, FROZEN HERE- if the m = 4 real-over-null charged-cost ratio
      lies in [1.0, 2.0], matching the committed m = 3 value of 1.3 to 1.5, then
      the arity result is a statement about polynomial-system size and shape and
      NO RESULT OF THIS EXPERIMENT MAY BE QUOTED AS A STATEMENT ABOUT ELLIPTIC
      CURVES OR THE ECDLP.
    - >-
      CONTROL 4, EXPLICIT CENSORING INVENTORY (blocking on interpretation). Every
      censored cell recorded with budget, elapsed time, last completed stage, peak
      memory, censoring mechanism (time or memory) and its one-sided bound. AN
      EMPTY CENSORED INVENTORY AT m = 5 IS SUSPICIOUS AND MUST BE INVESTIGATED
      BEFORE THE RUN IS ACCEPTED.
    - >-
      CONTROL 5, PLANTED DECOMPOSITION OF KNOWN SIZE (blocking). At each arity,
      construct a target as the sum of m known factor-base points and require the
      solver to recover exactly that decomposition. REQUIRED MAGNITUDE- recovery
      of the planted tuple, verified by an independent recomputation. A solver
      that cannot recover a planted decomposition at an arity cannot be used to
      report a cost at that arity, and its cells are INVALID rather than negative.
    - >-
      CONTROL 6, ENGINE AND ORDER PINNING. Engine version and monomial order
      recorded on every row, because both change the solving degree materially. A
      row without them is inadmissible.
  independent_variables:
    - arity m in {3, 4, 5}
    - field size ell over a three-point ladder including the committed anchor cells
    - factor-base size B, tuned per m to match the counting heuristic
    - arm in {REAL curve, NULL support-matched, RHO control}
  metrics:
    primary:
      - >-
        paired ratio R(ell, curve, seed) = charged cost per target at m = 4 over
        charged cost per target at m = 3, same instance, same unit (dimensionless)
      - >-
        censoring frontier- the largest F completing within budget at each m, with
        the censoring mechanism named (time or memory)
    secondary:
      - charged group-operation equivalents and raw solver operations per cell
      - one-sided bound R > budget / cost_m3 per censored cell (dimensionless)
      - measured solving degree per cell against the 2^{m-2} scaling
      - decomposition success probability per cell
      - real-over-null charged-cost ratio per arity (dimensionless)
      - ratio to matched rho on the same instances, per cell (dimensionless)
      - decomposition stage cost reported separately from total
      - peak allocator bytes per cell
      - wall-clock seconds per cell, for budget and censoring only
  heuristic_under_test: HEUR-ARITY-1
  preregistered_prediction:
    quantity: >-
      The paired charged-cost ratio between arity 4 and arity 3 on matched
      instances, and the real-over-support-matched-null cost ratio at arity 4.
    formula: >-
      R = ell^{(1+gamma)(1/4 - 1/3)} = ell^{-(1+gamma)/12} if gamma is
      m-independent, about 0.024 at ell = 2^10.5 with gamma = 5.2; R far above 1
      if degree growth dominates. Bands- R below 1/3, R above 3, otherwise
      inconclusive. The null ratio predicted in [1.0, 2.0] to match the committed
      m = 3 value of 1.3 to 1.5.
    source: >-
      FINDING-PF-IC-001 cost model total approximately ell^{(1+gamma)/m} with
      gamma in [4.57, 5.86], and EV-R6-001 committed m = 3 anchor alpha = 2.074
      with CI90 (1.565, 2.621) and its support-matched null ratio 1.3 to 1.5. Both
      read directly for this contract; FINDING-PF-IC-001 as a declared partial
      read of its first 711 lines.
  scale_relevance:
    tier: toy
    justification: >-
      ell in the neighbourhood of 2^10.5 to 2^12.2, matching the committed anchor
      cells. The dimensionless paired ratio is the part with any chance of
      transferring; the censoring frontier is a property of THIS solver stack on
      THIS host and transfers nowhere. TRANSFER ASSUMPTION, STATED- HEUR-ARITY-1
      claims only that the SIGN of the paired ratio is stable in ell, not its
      magnitude, and even that is an assumption rather than a consequence of the
      cost model.
    correspondence: null
  tail_checks:
    - >-
      The maximum observed solving degree per cell against the 2^{m-2} prediction,
      not only the median, since a degree tail is exactly what censors the
      deciding cells.
    - >-
      The distribution of per-target charged cost within a cell, reported as
      quantiles, because a mean over a heavy tail at m = 4 would misstate R.
  replication:
    seeds: >-
      Listed explicitly in the run manifest before stage 2 and SHARED ACROSS
      ARITIES so every R is paired. At least 3 curves and at least 8 targets per
      cell where the budget permits; the achieved counts are reported per cell and
      a cell below them is reported as REDUCED REPLICATION, not silently pooled.
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 40.0
    maximum_memory_gb: 16
    maximum_runs: 60
  stopping_rules:
    - >-
      Per-cell wall-clock budget 3600 seconds. On exceedance the cell is CENSORED
      with its one-sided bound and the run continues to the next cell.
    - >-
      Memory cap 16 GB per cell. On exceedance the cell is CENSORED-BY-MEMORY,
      coded separately from time censoring because the mechanisms differ.
    - >-
      Stage 0 regression failure HALTS the run.
    - >-
      Stage 1 probe failing at BOTH m = 4 and m = 5 at the smallest ell ends the
      arity arms; the run then delivers the censoring frontier and the m = 3
      regression only, and records that outcome as its result.
    - >-
      Total wall-clock at the declared cap; remaining cells recorded as NOT
      ATTEMPTED, not as failures.
  invalidation_rules:
    - >-
      Any decomposition entering a cost figure without an independently reverified
      certificate invalidates the cell.
    - >-
      Any R assembled from different curves, ell or seeds invalidates the ratio.
    - >-
      The planted-decomposition control failing at an arity invalidates every cell
      at that arity.
    - >-
      The matched rho arm missing its committed exponent CI invalidates the run.
    - >-
      A row emitted without its engine version and monomial order is inadmissible.
    - >-
      Any arm using a counter or conversion not shared with the others invalidates
      the comparison.
  success_criterion: >-
    The stage 0 regression reproduces the committed m = 3 anchor and rho control;
    the planted-decomposition control passes at every arity attempted; the
    censoring frontier is emitted with mechanisms named; and either at least one
    paired R is measured with its band verdict, or every m = 4 cell is censored
    and recorded with its one-sided bound. SUCCESS IS THE EXISTENCE OF THE
    MEASUREMENT OR OF AN HONEST CENSORING FRONTIER, not a particular direction.
  falsification_criterion: >-
    R above 3 at every completing ell falsifies the monotone-in-m reading of the
    cost model at tested scope and confirms the degree-growth obstruction by
    measurement. R below 1/3 at every completing ell falsifies the standing
    treatment of large m as closed and requires independent review before any
    description. R inside [1/3, 3] is INCONCLUSIVE and is reported plainly as
    such. No m = 4 cell completing at any setting is an INSTRUMENTAL obstruction
    under AGENTS.md rule 5 and falsifies nothing mathematical.
  required_artifacts:
    - exact command, git commit and dirty-tree state, environment and versions
    - the frozen parameter file with engine version, monomial order, conversion, ell ladder, B rule, seeds, budgets and bands
    - stage 1 arity feasibility probe outcome, recorded before any other arity work
    - per-cell raw records (arm, m, ell, B, curve, seed, engine, order, charged ops, solver ops, degree, success, bytes, seconds, censored flag and mechanism)
    - per-decomposition certificates and their independent reverification results
    - the paired R table with band verdicts, one row per (ell, curve, seed)
    - the one-sided bound inventory for every censored cell
    - the censoring frontier table with mechanisms named
    - the real-over-null charged-cost ratio table per arity
    - the matched rho table with exponent, constant and per-instance ratios
    - the solving-degree table against the 2^{m-2} scaling
    - the decomposition-stage-versus-total split per cell
    - planted-decomposition control outcomes per arity
    - stdout, stderr, timestamps, resource measurements
    - inference block- requested policy, backend, resolved model id, effort, fallback, degraded requirements
  assigned_to: executor
  approved_by: null
  limitations:
    - >-
      TOY SCALE. THE CROSSOVER ARITY AT CRYPTOGRAPHIC ell IS NOT TESTABLE AT ANY
      SCALE THIS PROGRAM CAN REACH- the m = 5 Semaev construction alone is already
      near the host limit at toy ell. This is stated rather than the claim being
      quietly shrunk to whatever completed.
    - >-
      CENSORING IS NOT RANDOM. It correlates with exactly the cells that would
      decide the question. Any conclusion drawn from the completing cells must
      carry that statement.
    - >-
      A timeout, crash or memory exhaustion is an infrastructure receipt under
      AGENTS.md rule 5 and is never negative mathematical evidence about arity.
      Total censoring at m = 4 means the obstruction is INSTRUMENTAL and the
      record says so.
    - >-
      Matching the counting heuristic across m changes B, which changes the
      linear-algebra stage; the decomposition stage is therefore reported
      separately from the total and a merged figure is not a comparison.
    - >-
      IF THE CURVE-FREE NULL RATIO AT m = 4 MATCHES ITS m = 3 VALUE, NOTHING HERE
      IS AN ELLIPTIC-CURVE OR ECDLP STATEMENT. Pre-stated so it cannot be
      renegotiated after the data.
    - >-
      This contract does not adjudicate the EXP-ICEX-146ff5 dispute and takes no
      position on it. That contract status is approved_execution_withheld.
    - >-
      claim_tier toy. No attack, no exponent moved, sota_delta zero. Even a
      favourable arity trend leaves index calculus far above rho at these sizes.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter. Every prose value is
    a folded block scalar; no tabs; no duplicate keys to the author reading. THIS
    AGENT COULD NOT RUN A STRICT YAML PARSE OR tools/validate_ledger.py AND DID
    NOT DO SO; the orchestrating session must run both before this contract is
    reviewed.
