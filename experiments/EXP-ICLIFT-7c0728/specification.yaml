experiment:
  id: EXP-ICLIFT-7c0728
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-ICLIFT-d31664
  question_id: RQ-FB3-001
  goal_id: GOAL-ICLIFT-001
  idea_id: IDEA-20260805-a7a716
  title: >-
    Ceiling audit of the factor-base coverage channel: derive and confirm
    coverage(D) <= min(1, mu), evaluate the frozen-size ceiling and its slope,
    and test whether the Bose-Chowla control queued by DEC-20260724-020 can
    falsify anything

  objective: >-
    Establish, with a derivation first and a bounded confirmation second, that
    the coverage advantage of ANY factor-base geometry over a matched random base
    of the same size is bounded by min(1, mu)/cov_rand -- hence by
    e/(e-1) = 1.5819767 under the occupancy denominator -- uniformly in N, m and
    the geometry; and audit the specific falsifying control that
    DEC-20260724-020's next_actions queue for itself, which this contract
    predicts is incapable of falsifying that decision as specified. Secondary
    objective: supply the factor-base lane with the designed null objects it has
    never had, each with a forced value derived before the run.

  what_this_is_not:
    - Not a discrete-logarithm computation, relation collection, decomposition solve, or ECDLP attack of any kind.
    - Not a claim that any factor base is good, useful, or worth adopting.
    - Not a cost, runtime, speedup, asymptotic, exponent, crypto-scale, or deployed-scheme claim.
    - Not a re-run of EXP-FB3-001 and not a revision of its verdict; the six pre-registered geometries are NOT re-measured on mean yield, which DEC-20260724-020 correctly calls waste.
    - Not an assertion of "structured factor bases cannot help index calculus", "the coverage channel is closed", or "the F3 family is dead" -- the three sentences DEC-20260724-020 forbids.
    - Not a measurement of the decomposition solve, the linear-algebra stage, relation rank, relation independence, or any non-uniform target measure.
    - Not evidence. No approval exists, no execution authorization exists, and no run has occurred.
    - Not an edit to any existing record. Every finding about an existing record is reported for a Coordinator to act on and is acted on by nobody here.

  claim_ceiling:
    tier: toy
    scope: >-
      A run under this contract could support, at most: (a) that the derivation
      of coverage(D) <= min(1, mu) and of sup f(mu) = e/(e-1) is correct as
      written, which is scale-free algebra and not a measurement; (b) that at
      N in {2^12, 2^14, 2^16, 2^18, 2^20} with m in {2, 3, 4} and known
      construction-time logs, the measured coverage of every tested base lies
      under that ceiling and the four designed bases return their forced values;
      (c) that the archived Bose-Chowla configuration does or does not correspond
      to mu ~= 0.2071. It could NOT support any statement about the exponent of a
      real attack, about prime-field index calculus at cryptographic scale, about
      the solve, or about relation independence. Toy evidence is never
      crypto-scale evidence (AGENTS.md rule 7).

  scale_relevance:
    tier: toy
    justification: >-
      The BOUND is an identity in (B, m, N) with no free parameters, so its
      correctness does not depend on scale and the measurements are a CHECK of a
      derivation rather than an extrapolation from one. The MEASUREMENTS are toy:
      N <= 2^20, discrete logs known by construction, counting cost far above the
      cost of solving the same instance by rho. Every conclusion drawn from a
      measured number is scoped to N <= 2^20; every conclusion drawn from the
      algebra is scoped to the frozen convention and the harvest-one model and to
      nothing else.
    correspondence: null

  environment_declaration:
    verified_in_session: >-
      numpy 2.4.6 imports successfully in this container; sympy and Sage do NOT
      (both raise ModuleNotFoundError). PyYAML 6.0.1 is present. This resolves
      the environment disagreement recorded between two scouting sweeps in favour
      of numpy being present, and it is recorded here because the contract must
      not silently assume a solver.
    requirement: >-
      Pure Python plus numpy only. No computer-algebra system, no solver, no
      network. If any stage is found to need one, that is an INFRASTRUCTURE
      REQUEST, not an experiment, and it is reported as such (AGENTS.md rule 5).

  inputs:
    group_orders_N: [4096, 16384, 65536, 262144, 1048576]
    arities_m: [3, 2, 4]
    matched_size_rule: "B = the least integer with B^3 >= 6*N, computed in exact integer arithmetic"
    matched_sizes_expected:
      "16384": 47
      "65536": 74
      "262144": 117
    swept_mu_targets: [0.05, 0.2, 0.5, 1.0, 2.0, 5.0]
    swept_size_rule: >-
      For each target mu*, B is the least integer with C(B+m-1, m) >= mu* * N.
      The achieved mu is recorded exactly and the targets are labels only; no
      result is reported against the target, always against the achieved value.
    group_model: >-
      The additive group Z_N. The frozen battery used prime-order elliptic-curve
      groups with known logs; every quantity in this contract depends only on the
      abstract group structure, so Z_N is used and THIS SUBSTITUTION IS DECLARED
      RATHER THAN HIDDEN. Arm E below re-runs one cell on a generated
      prime-order curve to demonstrate the substitution is inert; if it is not,
      the curve results govern and the Z_N results are reported as a
      counter-check only.
    base_families:
      - id: RAND
        role: null object
        construction: uniformly random B-subset of the group, without replacement
      - id: SIDON
        role: positive control
        construction: >-
          Greedily constructed B_3 set: start empty, scan candidates in a
          seed-determined order, admit a candidate iff every 3-multiset sum
          involving it is distinct from all existing 3-multiset sums. THE B_3
          PROPERTY IS THEN VERIFIED DIRECTLY by checking that all C(B+2,3) sums
          are pairwise distinct. Provenance of any named construction is
          therefore irrelevant to the result.
      - id: AP
        role: designed-failure null
        construction: the arithmetic progression {1, 2, ..., B}
      - id: GREEDY
        role: treatment
        construction: >-
          Greedy low-collision selection against the whole-group coverage
          objective with NO train/held-out split -- the corrected form
          DEC-20260724-020's red team identifies (the frozen arm understated its
          own geometry by about 9x by optimizing a training half).
    master_seed: 20260805
    seed_derivation_rule: >-
      For every random draw, seed = int.from_bytes(SHA-256(ASCII of
      "EXP-ICLIFT-7c0728/v1|" + arm_id + "|" + str(N) + "|" + str(m) + "|" +
      str(B) + "|" + str(replicate_index) + "|" + str(master_seed))[:8],
      "big"), used to key a Python random.Random instance. Every seed, every
      arm_id, and every achieved (N, m, B, mu) is written to the run manifest, so
      a third party reproduces every instance bit for bit.
    replicate_count_random_arms: 32
    archived_artifacts_read:
      - experiments/EXP-FB3-001/analysis.md
      - experiments/EXP-FB3-001/conservation.md
      - experiments/EXP-FB3-001/execution-report.yaml
      - experiments/EXP-FB3-001/runs/RUN-FB3-001-N14
      - experiments/EXP-FB3-001/runs/RUN-FB3-001-N16
      - experiments/EXP-FB3-001/runs/RUN-FB3-001-N18
      - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/tasks/TASK-20260724-233/red_team_report.yaml
    archived_artifacts_note: >-
      READ ONLY. Nothing under experiments/EXP-FB3-001 or under coordination/ is
      written, moved, or modified by this contract. EV-FBG-001 records that
      experiments/EXP-FB3-001/specification.yaml is not machine-parseable YAML;
      if it cannot be read, that is recorded as an infrastructure observation and
      the reconciliation arm reports NOT PERFORMED, never agreement.

  stages:
    - id: S0
      name: derivation
      cost: pen and paper, zero compute
      terminating: true
      description: >-
        Write out, in full, (i) conservation sum_T Y_D(T) = C(B+m-1, m);
        (ii) the pigeonhole ceiling coverage(D) <= min(1, mu) with the equality
        case; (iii) the two-sided form mu - Coll/(2N) <= coverage <= min(1, mu);
        (iv) sup_{mu>0} min(1, mu)/(1 - e^-mu) = e/(e-1) at mu = 1. IF ANY OF
        THESE FAILS, THE RUN TERMINATES HERE and the failure is the deliverable.
    - id: S1
      name: frozen-size ceiling and slope
      cost: seconds
      terminating: false
      description: >-
        Evaluate the integer B, M1, mu, cov_rand and f(mu) at N = 2^14, 2^16,
        2^18 with m = 3, and the slope of f versus log2 N. Invert f at the
        archived value 1.1071 on both branches. Report to 6 decimals.
    - id: S2
      name: designed-base measurement at matched size
      cost: minutes
      terminating: false
      description: >-
        Measure mean-yield ratio, coverage, coverage ratio and Coll for RAND,
        SIDON, AP and GREEDY at the three frozen sizes with m = 3. THE NULL AND
        DESIGNED-FAILURE ARMS (RAND, AP) ARE COMPUTED, WRITTEN AND HASHED BEFORE
        SIDON OR GREEDY IS LOOKED AT.
    - id: S3
      name: graded mu sweep
      cost: minutes
      terminating: false
      description: >-
        At N = 2^18 and m = 3, sweep B so the achieved mu covers the six targets,
        and report the measured coverage ratio of each arm against the predicted
        f(mu). Report monotonicity and the location of the maximum.
    - id: S4
      name: convention and substitution checks
      cost: minutes
      terminating: false
      description: >-
        Repeat S2 at N = 2^16 with m = 2 and m = 4 (does the ceiling remain
        m-free?), and repeat one S2 cell on a generated prime-order elliptic
        curve with known logs to demonstrate the Z_N substitution is inert.
    - id: S5
      name: archived-configuration reconciliation
      cost: minutes, reading only
      terminating: false
      description: >-
        Read the archived red-team configuration for the Bose-Chowla probe and
        report its (N, B, m) and the implied mu against the predicted 0.2071. If
        the artifact cannot be read or does not record the configuration, report
        NOT PERFORMED.
  cheapest_decisive_stage: >-
    S0. It is pen and paper, it can end the entire line, and nothing after it is
    worth running if it fails. S1 is the second cheapest and independently
    settles whether the frozen slope-versus-log2-N null of zero is correct.

  independent_variables:
    - group order N
    - arity m
    - base size B (equivalently the achieved mu)
    - base family (RAND / SIDON / AP / GREEDY)
    - group model (Z_N versus a generated prime-order curve)

  controls:
    - RAND, the matched random null, with its forced value derived pre-run
    - SIDON, the verified-B_3 positive control, which must attain the ceiling exactly
    - AP, the designed-failure null, whose two forced values can each fail independently
    - the graded mu sweep with six interior points
    - the ordering control (nulls committed before treatments are read)
    - the m sweep and the curve-versus-Z_N substitution check

  arms_and_controls:
    treatment:
      - id: A-SIDON
        description: verified B_3 base at matched and swept sizes
      - id: A-GREEDY
        description: whole-group-objective greedy base, the corrected form of the frozen greedy arm
    measured_null:
      - id: N-RAND
        description: >-
          32 independent uniformly random B-subsets per cell, same code path,
          same counter, same group.
        forced_value: >-
          coverage = 1 - (1 - 1/N)^{M1}, i.e. 0.675200 / 0.657917 / 0.648146 at
          N = 2^14 / 2^16 / 2^18 with m = 3 and matched B; Coll ~ M1*mu. DERIVED
          BEFORE THE RUN. CAN FAIL: a departure above 2% refutes HEUR-ICL-C1 at
          that size.
      - id: N-AP
        description: the arithmetic-progression base {1..B}, deterministic.
        forced_value: >-
          mean-yield ratio EXACTLY 1.000000 (conservation) and coverage EXACTLY
          (3B-2)/N, i.e. 349/262144 = 0.001331 at N = 2^18, B = 117, a coverage
          ratio of 0.00205. BOTH HALVES CAN FAIL AND FAIL INDEPENDENTLY: a mean
          ratio other than 1 means conservation is mis-implemented; a coverage
          other than (3B-2)/N means the counter double-counts.
    positive_control:
      - id: P-SIDON
        description: >-
          The SIDON arm doubles as the positive control. Its B_3 property is
          verified directly by pairwise distinctness of all C(B+2,3) sums.
        forced_value: >-
          coverage EXACTLY M1/N whenever mu <= 1, and Coll EXACTLY 0.
        blocking_rule: >-
          IF P-SIDON DOES NOT RETURN BOTH FORCED VALUES, THE INSTRUMENT IS BROKEN
          AND NO NEGATIVE RESULT MAY BE REPORTED FROM ANY ARM (inventor protocol
          section 3; AGENTS.md rule 5).
    graded_control:
      - id: G-MU
        description: >-
          Six interior points of achieved mu at fixed N = 2^18, m = 3, reporting
          the coverage ratio of SIDON against the predicted f(mu).
        forced_shape: >-
          Unimodal, tending to 1 at both extremes, with its unique maximum at
          mu = 1 and value e/(e-1). A measured curve that is monotone, or peaks
          elsewhere, localises the failure to the occupancy denominator rather
          than leaving "it did not work".
    ordering_control: >-
      N-RAND and N-AP are computed, serialized and SHA-256-hashed, and the
      decision rule is executed on them, BEFORE A-SIDON or A-GREEDY is read. If
      the rule emits the same verdict on N-RAND as on A-SIDON, it discriminates
      nothing and must be rewritten before the treatment arms are opened.
    comparability_policy: >-
      Every arm within a cell uses the identical group, identical N, identical B,
      identical m, identical counting code and identical target space. Arms
      differ ONLY in how the base is chosen. Ratios are always reported against
      the matched-random arm measured in the same cell, never against the
      occupancy formula alone; the formula-based ratio is reported as a second
      column so the heuristic and unconditional readings are both visible.

  metrics:
    primary:
      - id: M1-CEILING-CHECK
        definition: >-
          max over all measured cells and arms of
          [measured coverage / min(1, achieved mu)]. Exact rational where
          possible.
      - id: M2-RATIO-VS-F
        definition: >-
          measured coverage ratio (arm / matched-random, same cell) minus the
          predicted f(achieved mu), per cell.
      - id: M3-CEILING-SLOPE
        definition: >-
          slope of f(mu_N) versus log2 N over N = 2^14, 2^16, 2^18 at matched B,
          m = 3.
    secondary:
      - id: M4-COLL
        definition: >-
          Coll(D) = sum_T Y(Y-1) per arm per cell, and the ratio
          Coll(arm)/Coll(RAND).
      - id: M5-MEAN-RATIO
        definition: >-
          measured mean-yield ratio per arm per cell (expected exactly 1 for
          every arm, by conservation; a conservation self-check).
      - id: M6-MU-INVERSION
        definition: >-
          the two roots of f(mu) = 1.1071 and the mu implied by the archived
          Bose-Chowla configuration if readable.
      - id: M7-SUBSTITUTION
        definition: >-
          |coverage(Z_N cell) - coverage(curve cell)| at the matched
          N = 2^16, m = 3 cell.

  heuristic_under_test: HEUR-ICL-C1

  preregistered_prediction:
    quantity: >-
      The coverage ceiling and its evaluation at the frozen sizes, and the forced
      values of the four designed bases.
    formula: >-
      coverage(D) <= min(1, mu) with mu = C(B+m-1, m)/N;
      cov_rand = 1 - (1 - 1/N)^{M1};
      f(mu) = min(1, mu)/(1 - e^-mu), sup f = e/(e-1) = 1.5819767 at mu = 1;
      f(mu_N) = 1.481042 / 1.519949 / 1.542863 at N = 2^14 / 2^16 / 2^18 with
      B = 47 / 74 / 117 and M1 = 18424 / 70300 / 273819;
      slope of f versus log2 N over those three sizes = +0.015455 per bit;
      coverage(SIDON) = M1/N exactly and Coll(SIDON) = 0 exactly for mu <= 1;
      coverage(AP) = (3B-2)/N exactly with mean-yield ratio exactly 1;
      f^{-1}(1.1071) = 0.207059 on the mu < 1 branch and 2.335736 on the mu > 1
      branch.
    source: >-
      Derived in H-ICLIFT-d31664 and IDEA-20260805-a7a716 from conservation plus
      pigeonhole plus the occupancy heuristic HEUR-ICL-C1. No external theorem is
      cited and none is needed. The numerical values were computed in session
      from those formulas with exact integer arithmetic for B and M1; they are
      recorded here BEFORE any run so they cannot be tuned to data.

  tail_checks:
    - >-
      The extreme cell: at the largest swept mu (5.0) the predicted ratio returns
      to near 1. A measured ratio still near its maximum there is the canonical
      artifact tell -- a quantity that fails to decay when the parameter meant to
      destroy it increases -- and triggers invalidation rule I4.
    - >-
      The pigeonhole edge: at N = 2^18 with matched B = 117, C(119,3) = 273819 >
      262144 = N, so NO B_3 set of that size exists. The SIDON arm must therefore
      FAIL TO CONSTRUCT at that exact cell, and reporting a "verified B_3 set" of
      size 117 there is an integrity failure, not a result.
    - >-
      The m = 2 and m = 4 cells must return the same ceiling constant e/(e-1);
      an m-dependence in the constant refutes the derivation's m-freeness.

  replication:
    seeds: [20260805, 20260806, 20260807, 20260808]
    independent_instances: 32

  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 1
    maximum_memory_gb: 4
    maximum_runs: 8

  stopping_rules:
    - Stop at S0 if any derivation step fails; report the failure as the result.
    - >-
      Stop after S2 if P-SIDON fails its forced values; the instrument is broken
      and nothing further may be interpreted.
    - >-
      Stop at the wall-clock or CPU budget. A budget stop is reported as a budget
      stop with the completed cells listed; it is never reported as a negative
      result about the ceiling.
    - >-
      Do not add cells, arms, sizes or geometries beyond those declared. In
      particular, do NOT re-run any of the six frozen EXP-FB3-001 geometries on
      mean yield; the conservation identity settles that arm and
      DEC-20260724-020 already says spending compute on it is waste.

  invalidation_rules:
    - id: I1
      rule: >-
        Any measured coverage strictly above min(1, achieved mu) in any cell
        invalidates the counter for that cell; the cell is marked invalid and the
        counter is repaired before anything else is read.
    - id: I2
      rule: >-
        Any measured mean-yield ratio differing from 1 by more than 1e-12 in an
        exact-counting cell invalidates that cell: conservation is exact and a
        departure is an implementation defect.
    - id: I3
      rule: >-
        A "verified B_3" set whose pairwise-distinctness check was not actually
        executed invalidates every SIDON result; the verification is not optional
        and may not be inferred from the construction.
    - id: I4
      rule: >-
        A measured coverage ratio that does not decay toward 1 as mu increases
        past 1 invalidates the sweep as a measurement of the predicted curve and
        is reported as a suspected artifact of the implementation.
    - id: I5
      rule: >-
        Any write, move or modification of a file outside
        experiments/EXP-ICLIFT-7c0728/ invalidates the whole package as a
        scope violation.

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory, unreadable archived artifact, missing
    dependency, or unparseable frozen specification is INFRASTRUCTURE SIGNAL and
    is recorded as such with the exact command, exit status and resource state.
    IT IS NEVER NEGATIVE MATHEMATICAL EVIDENCE ABOUT THE HYPOTHESIS (AGENTS.md
    rule 5). Specifically: if experiments/EXP-FB3-001/specification.yaml cannot
    be parsed -- which EV-FBG-001 records as its actual state -- stage S5 reports
    NOT PERFORMED and no reconciliation is claimed in either direction. If a
    swept cell exceeds memory, that cell is reported as censored with its
    parameters, and the growth and slope metrics are recomputed over the cells
    that completed, with the censoring disclosed beside every affected number.

  success_criterion: >-
    ALL of the following, and the contract is deliberately written so that
    "success" means the derivation survived, not that anything was found:
    (1) S0 completes with all four derivation steps written out and internally
    consistent; (2) M1-CEILING-CHECK <= 1.0 in every measured cell, i.e. no arm
    exceeds the pigeonhole ceiling; (3) P-SIDON returns coverage exactly M1/N and
    Coll exactly 0 in every cell where a B_3 set of the required size exists, and
    FAILS TO CONSTRUCT at the cells where the pigeonhole forbids one;
    (4) N-AP returns mean-yield ratio exactly 1 and coverage exactly (3B-2)/N;
    (5) M3-CEILING-SLOPE is reproduced as +0.015455 per bit to 5 decimal places;
    (6) the graded sweep traces a unimodal curve peaking at achieved mu closest
    to 1, with maximum value within 2% of f at that achieved mu.
  falsification_criterion: >-
    ANY of the following falsifies H-ICLIFT-d31664 as stated and must be reported
    as such rather than reinterpreted: (a) a measured coverage ratio strictly
    above min(1, mu)/measured-cov_rand in any valid cell; (b) a verified B_3 set
    whose coverage is not exactly M1/N; (c) measured random-base coverage
    departing from 1 - e^-mu by more than 2% at any size with 32 draws, which
    withdraws the constant e/(e-1) though not the exact ceiling; (d) the archived
    Bose-Chowla probe shown to have been run at achieved mu ~ 1 with a genuinely
    verified B_3 set, which is impossible by pigeonhole and therefore falsifies
    either the archived configuration record or this derivation; (e) an
    m-dependence in the ceiling constant.

  required_artifacts:
    - the S0 derivation, written out in full, committed before any compute
    - per-cell exact integers B, M1, achieved mu, coverage numerator and denominator, Coll
    - the SHA-256 of the serialized null arms, recorded before the treatment arms were opened
    - the pairwise-distinctness verification transcript for every SIDON set, including its failures
    - the graded sweep table with achieved mu, measured ratio and predicted f(mu) per point
    - the m = 2 / m = 4 and curve-versus-Z_N substitution tables
    - the archived-configuration reading, or an explicit NOT PERFORMED with the reason
    - exact command lines, seeds, git commit, dirty-tree state, environment versions, wall clock and peak memory per run
    - an explicit statement of which stage terminated the run, if any, and why

  reporting_obligations:
    - >-
      Report the ceiling as a CEILING and never as an achievable advantage. At
      mu > 1 the value 1 is unattainable by any set, and no B_3 set of the matched
      size exists at N = 2^18.
    - >-
      Report both the heuristic-denominator ratio and the measured-denominator
      ratio for every arm, so the conditional and unconditional readings are both
      visible.
    - >-
      Report the harvest-one and harvest-all readings side by side: under
      harvest-all the channel is worth exactly 1, under harvest-one at most
      1.582, and the "no growth" conclusion holds under both.
    - >-
      Report the EV-FBG-001 parenthetical finding (that a rank-deficient AP base
      is tied on MEAN but not on COVERAGE) as a correction candidate for a
      Coordinator, with the exact numbers. Do not edit EV-FBG-001.
    - >-
      Report, without editing anything, the record-integrity observation that
      ledger/goals/GOAL-ICLIFT-001.yaml's BATCH-001 and BATCH-002 checkpoints
      cite decision ids DEC-20260724-007/008/009 while the decisions that
      actually carry this goal's content are DEC-20260724-020, -021 and -022;
      the cited ids resolve to unrelated records. This is a citation-resolution
      defect for the Coordinator, not a mathematical finding, and nothing in this
      contract depends on which reading is correct.

  assigned_to: executor
  approved_by: null
  review_notes: >-
    Submitted for Coordinator review only. status is review_required, frozen is
    false, execution_authorized is false, evidence_eligible is false, and
    approved_by is null and must remain null until a Coordinator sets it
    (AGENTS.md rule 1). No run has occurred and no evidence exists.
