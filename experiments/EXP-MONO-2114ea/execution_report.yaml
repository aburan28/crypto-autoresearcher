      reject at alpha=0.05 at every tested k and at the full panel size --
      this establishes the achievable-significance ceiling before any
      draw is spent, per KN-TECH-95a42b's discipline extended to the
      Fisher combination's own effective degrees of freedom. Not an
      observed result.

  stage0_exact_planted_elevation_precommitment:
    method: >-
      For every pool curve and every fraction, the perturbed factor
      base's own Shat(chi) spectrum is computed directly
      (conv.py::character_spectrum) and independently reconstructed via
      linearity of the Fourier transform (Shat_perturbed = Shat_orig -
      Shat_removed + Shat_added). The two are compared entrywise.
    max_relative_spectrum_error_across_all_45_curve_fraction_combinations: 6.423313441807612e-13
    tolerance: 1e-9
    all_gates_passed: true
    parity_adjustment_disclosure: >-
      round(fraction * F) is odd for some (curve, fraction) combinations,
      with no self-negating (2-torsion or (0,0)) candidate available on
      either the removal or addition side at these toy sizes -- an odd
      symmetric swap is then infeasible. Decremented by 1 to the nearest
      even count in that case (disclosed per-cell as
      count_parity_adjusted=true / count_requested_raw vs count in
      raw-result.json's stage0_per_curve_elevation), decided from a pure
      swap-candidate parity check made BEFORE any Stage-2/3 number was
      observed, not a post-hoc change. See implementation.md decision 3
      for the full accounting: 22 of 45 (curve, fraction) combinations
      were adjusted; several land at count=0 (no perturbation actually
      applied at that specific (curve, fraction) pair, because F is small
      and no odd slot was available).

