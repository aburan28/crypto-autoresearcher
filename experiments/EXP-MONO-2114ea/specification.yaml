experiment:
  id: EXP-MONO-2114ea
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-09-05'
  coordinator_approval_rationale: >-
    APPROVED after independent read-through of this contract and
    H-MONO-d9dc51 by the orchestrating Coordinator, including cross-
    checking (via the GitHub contents API against origin's true tip, not
    the local working tree, since the drafting subagent had no Bash/gh
    access and could only verify locally) that EXP-MONO-b1423c's own
    cited budget figures (wall_seconds=4.518084764480591,
    peak_rss_bytes=40124416) and the existence of the reused
    stats.py/conv.py/controls.py files match origin exactly. This
    operationalizes IDEA-20260831-3fa5c9/H-MONO-d9dc51's own named
    follow-up (both reviewers of EXP-MONO-b1423c recommended exactly this
    "multi-curve, mild-perturbation positive control" as the concrete
    next step). The known-erratum correction to falsification_conditions[2]
    is applied correctly and explicitly (see H-MONO-d9dc51's own
    `known_erratum_correction` field). The 5-cell L-shaped grid reading of
    the idea's own "fraction ladder... and, at the middle rung, across
    panel sizes" text (rather than a full 3x3 Cartesian product) is
    concurred with as the more textually faithful reading and the more
    budget-efficient one; nothing forecloses a future record running the
    full grid if a reviewer judges this one's resolution insufficient.
    Budget (600s/0.5GB) is justified by name against two precedents in
    this exact lane (EXP-MONO-b1423c's measured single-curve rate;
    EXP-MONO-b19c6b's measured ~100-curve panel rate), with a >=4x safety
    margin over the linear-scaling projection. Success criterion is
    decidable under either of H-MONO-d9dc51's own two mutually exclusive
    outcomes, per the design-experiment skill's own requirement.
  hypothesis_id: H-MONO-d9dc51
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  batch_id: null
  batch_id_note: >-
    No batch is asserted. GOAL-MONO-001 is `active` with open impediments
    (IMP-1, unrelated m=3 rule-12 review gate) that do not block this
    record's own standalone-branch authority, matching the standing
    authority all prior contracts in this three/four-experiment lane have
    used; this draws on none of GOAL-MONO-001's batch campaign budget.

  title: >-
    Graded multi-curve positive control: does H-MONO-663fb4's own
    Fisher-combined statistic have ANY power to detect a planted, mild,
    multi-curve effect -- the regime it was actually introduced for -- as
    opposed to the single-extreme-outlier regime EXP-MONO-b1423c already
    showed it structurally cannot detect?

  objective: >-
    Discharge H-MONO-d9dc51's own two mutually exclusive outcomes (A: the
    Fisher-combined statistic has genuine detection power in the
    many-mild-curves regime; B: it fails everywhere it has ever been
    tested, an actionable finding about a "co-equal primary metric") by
    measuring the statistic's detection-power surface across a
    perturbation-fraction x panel-size grid of planted, graded, multi-curve
    effects, reusing this lane's own already-validated instrument
    unmodified.

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection at scale.
    - Not an ECDLP cost, runtime, asymptotic, exponent, cryptographic-scale, or deployed-scheme claim.
    - >-
      Not a re-litigation of EXP-MONO-b19c6b's own "controlled null
      confirmed" reading for the per-curve Holm/permutation statistic on
      the REAL (unperturbed) factor base, which this record does not
      touch beyond reading its archived raw p-values as background.
    - >-
      Not a re-test of EXP-MONO-b1423c's own single-extreme-outlier
      finding beyond the mandatory reproduction gate (Stage 1 below),
      which exists only to certify this contract's own implementation
      against that already-committed result before any new cell is
      interpreted.
    - Not a claim on GOAL-ECDLP-001's or GOAL-RELN-001's territory.
    - Not approved for any purpose beyond what this record states once run.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: whether the Fisher-combined statistic, computed exactly as
      EXP-MONO-b19c6b's own frozen `stats.py` defines it, rejects (or
      fails to reject) a panel containing a planted, graded, multi-curve
      subgroup-coset perturbation at the tested fractions (2%,5%,10%) and
      panel sizes (5,10,15), mixed into EXP-MONO-b19c6b's own realized
      random-ordinary background panel, at m=4. This establishes whether
      the statistic's machinery has practical detection power at these
      panel sizes for THIS perturbation mechanism and THIS effect-size
      grid -- it does NOT establish anything about a different
      perturbation mechanism, a different grid resolution, or whether any
      REAL curve exhibits such an effect.
    what_no_outcome_can_support: >-
      No outcome establishes the asymptotic size of C; no outcome converts
      a measured deviation into a cost or an exponent; no outcome
      transfers to crypto scale. A REJECT at some tested cell does not
      confirm K3/K4's exceptional-locus branch for the real x-coordinate
      factor base (the planted perturbation is a DIFFERENT, known object,
      not evidence about real curves); a FAIL-TO-REJECT across the whole
      grid would be a significant, reportable finding about the
      statistic's practical sensitivity ceiling at this sample budget, not
      proof it can never detect anything at any effect size whatsoever.

  inputs:
    reused_frozen_implementation: >-
      experiments/EXP-MONO-b19c6b/implementation/{fields,curve,conv,
      groupstate,stats}.py, BYTE-IDENTICAL, no modification permitted. This
      is the exact, twice-independently-reviewed Fisher-combined
      implementation (`fisher_combined_pvalue` in stats.py, cross-checked
      against scipy.stats.chi2.sf to 4.4e-14 max error by the Red Team;
      `permutation_pvalue` and `holm_bonferroni`, also unchanged since
      EXP-MONO-670aa6) whose sensitivity is under test. Do not reimplement
      any of these five files; import and call them directly, mirroring
      EXP-MONO-b1423c's own `implementation/run.py` reuse pattern exactly
      (see that file's own header comment for the precedent).
    reused_subgroup_construction: >-
      experiments/EXP-MONO-c819ba/implementation/controls.py::
      subgroup_control, reused VERBATIM (byte-for-byte) via the same
      source-verbatim-diff-at-runtime check EXP-MONO-b1423c's own
      `implementation/run.py::verify_subgroup_control_source_verbatim`
      performs, for the Stage 1 RO3 reproduction cells only. Do not
      reconstruct this function from prose.
    reused_stage1_reproduction_target: >-
      EXP-MONO-b1423c's own already-committed RO3 result
      (execution_report.yaml `S5_known_positive_cell_raw_pvalues` and
      `S1_S4_fisher_combined_mixed_panels` blocks): RO3 (p=307, A=269, B=6,
      N=288, n1=3, n2=96), cells h=N/2=144 and h=N/4=72, both at the
      permutation floor (S5 raw p-value 4.999750012499375e-05 on both
      statistics, both cells) and both mixed-panel Fisher combinations
      (S1=S2=0.5197796626550032 for Var; S3=S4=0.47085766077181307 for
      C/F) failing to reject at 0.05.
    reused_curve_panel: >-
      EXP-MONO-b19c6b's own RUN-MONO-b19c6b-1 archived random-ordinary
      panel, read directly from
      experiments/EXP-MONO-b19c6b/runs/RUN-MONO-b19c6b-1/raw-result.json
      (`stage3_per_curve_raw_pvalues.random-ordinary`, 48 curves, and the
      corresponding `primary_panel_construction` records giving each
      curve's p, A, B, N, group structure and realized factor base) --
      NOT re-generated. Curve selection for perturbation: sort the 48
      realized curve_ordinals numerically ascending; the first 15 form the
      fixed "candidate-for-perturbation" pool; for panel size k in
      {5,10,15}, the first k of that pool are the PERTURBED curves for
      that cell, and the remaining 48-k curves (the rest of the archived
      panel, always including the 33 candidate-pool curves not selected at
      k<15) are the UNPERTURBED BACKGROUND for that cell's full-panel
      Fisher arm. This selection rule is fixed here, before any run, and
      may not be revised after any result is observed.
    planted_perturbation_construction: >-
      For each selected curve and each perturbation fraction r in
      {0.02, 0.05, 0.10}: let F be that curve's own already-realized
      x-coordinate factor base (F=N/4, per EXP-MONO-b19c6b's own
      `primary_factor_base_size`). Fix ONE proper-subgroup coset of that
      curve's own group (constructed via `subgroup_control`-style
      coordinate arithmetic on the curve's own (n1,n2) presentation,
      choosing the subgroup of the smallest index h>1 that the curve's own
      N admits, exactly as EXP-MONO-c819ba's/EXP-MONO-b1423c's
      `subgroup_control` already does for RO3 -- generalized here to
      whatever (n1,n2) each panel curve realizes). Replace
      round(r * F) of the factor base's own elements (a fixed, disclosed,
      deterministically-selected sub-list, e.g. the first round(r*F)
      elements in the factor base's own construction order) with that many
      elements of the fixed coset not already in the factor base,
      preserving symmetry (FB=-FB) by construction (swap in +/- pairs, or
      the self-negating element only when it is the exact remaining odd
      slot, mirroring EXP-MONO-b1423c's own
      `draw_symmetric_null_subset` self-negating-point handling). The
      resulting perturbed factor base has the SAME size F as the
      unperturbed one.
    exact_planted_elevation_precommitment: >-
      STAGE 0 GATE (see `stopping_rules`): before any of the 20000 null
      draws for a perturbed curve are spent, compute the perturbed factor
      base's own Shat(chi) spectrum via `conv.py::character_spectrum` and
      report its own exact C/F and (via `var_from_character_side`) its own
      exact Var at m=4, comparing that DIRECTLY-COMPUTED value against a
      closed-form prediction derived from H-MONO-663fb4 mechanism step (5)
      (the subgroup spectrum Shat(chi)=h on the annihilator of H, 0
      elsewhere) applied to a PARTIAL replacement -- i.e. Shat_perturbed =
      Shat_original + sum over swapped-in coset elements' characters minus
      sum over swapped-out original elements' characters. This is an
      exact algebraic identity (Fourier transform is linear), not an
      approximation; a mismatch between the directly-computed spectrum and
      this closed-form reconstruction is `failed_infrastructure`
      (implementation defect), never evidence.
    matched_null_panel_construction: >-
      For each panel size k in {5,10,15}: the SAME k curve identities used
      for perturbation at that k, with NO perturbation applied (their real,
      already-archived, unperturbed x-coordinate factor base and its
      already-archived raw p-values, read directly from
      RUN-MONO-b19c6b-1's raw-result.json), combined with the identical
      48-k-curve background used in the corresponding perturbed cell,
      through the identical full-panel and oracle Fisher-combination code
      paths. This isolates whether the FISHER COMBINATION ITSELF (not the
      background composition) spuriously rejects when no planted effect is
      present.
    null_draws_per_curve: 20000
    null_draws_note: >-
      Matches this lane's own design-time-verified draw count exactly
      (KN-TECH-95a42b, reused unchanged in EXP-MONO-b19c6b and
      EXP-MONO-b1423c). ONE 20000-draw null population is computed per
      selected curve (keyed on that curve's own (p, F), not on
      perturbation fraction or panel size), because the null distribution
      of a random F-sized symmetric subset on a fixed curve does not
      depend on which specific F-sized subset (perturbed or original) is
      being scored against it -- this population is reused, unmodified,
      across every fraction and panel-size cell that curve participates
      in. This is the load-bearing compute-saving fact this contract's own
      budget below depends on; a re-derivation of a fresh null population
      per grid cell instead of per curve would be a protocol deviation and
      must be disclosed, not silently absorbed.
    fisher_floor_vs_threshold_stage0_check: >-
      STAGE 0 GATE, PERFORMED BEFORE ANY DRAW IS SPENT: report the
      per-curve permutation floor (1/20001 ~= 0.00005, unchanged from this
      lane's prior design-time checks) against the Fisher combination's
      own effective degrees of freedom at k in {5,10,15} pooled p-values
      (df=2k=10,20,30) and at the full-panel size (df up to 2*48=96,
      matching EXP-MONO-b19c6b's own already-verified regime). Report
      explicitly whether a panel of all-floor p-values (the maximally
      extreme case at each k) would reject at alpha=0.05 under
      `chi2_sf_even_df`, so the ceiling on achievable significance at each
      panel size is known before any run, exactly mirroring
      KN-TECH-95a42b's discipline extended from per-cell floors to the
      combination's own effective sample size.
    master_seed: 20260901
    domain: EXP-MONO-2114ea/v1
    seed_derivation_rule: >-
      Every null-subset draw for a perturbed or matched-null-panel curve
      uses SHA-256 of domain || "|" || decimal(master_seed) || "|" ||
      "null-subset" || "|" || decimal(p) || "|" || decimal(F) || "|" ||
      decimal(curve_ordinal) || "|" || decimal(draw_index), big-endian
      unsigned, rejection-sampled against modulo bias, identical mechanism
      to EXP-MONO-b19c6b's own `controls.py::draw_symmetric_subset` /
      EXP-MONO-b1423c's own `draw_symmetric_null_subset`. Keying on (p, F,
      curve_ordinal) rather than perturbation fraction is deliberate and
      is what makes the null-population-reuse above well-defined and
      reproducible: a third party holding domain and master_seed
      reproduces every draw bit-for-bit regardless of which grid cell
      requests it.

  arms_and_controls:
    stage0_zero_compute_gate: >-
      `exact_planted_elevation_precommitment` and
      `fisher_floor_vs_threshold_stage0_check` above, both reported before
      any of Stage 1-3's compute is spent. Failure of either halts the run
      as `failed_infrastructure`.
    stage1_reproduction_gate: >-
      HARD GATE. Re-run the RO3 h=N/2 and h=N/4 cells exactly as
      EXP-MONO-b1423c's own `implementation/run.py` does (reusing that
      file's own subgroup-reconstruction-verification and S1-S5 logic),
      and require the reproduced S5 raw p-values and S1-S4 mixed-panel
      Fisher combined p-values to match EXP-MONO-b1423c's own archived
      values (see `reused_stage1_reproduction_target`) to the same 1e-9
      relative tolerance EXP-MONO-b1423c's own dual-path control uses. A
      mismatch is `failed_infrastructure`; no Stage 2/3 arm is computed.
    stage2_planted_panel_measurement: >-
      For each (perturbation fraction, panel size) cell in the grid
      (all 3 fractions at panel size 10 [the middle rung of the panel-size
      ladder], plus all 3 panel sizes at fraction 5% [the middle rung of
      the fraction ladder] -- a 5-cell L-shaped grid sharing the (5%,10)
      cell, per IDEA-20260831-3fa5c9's own text "the perturbation-fraction
      ladder... and, at the middle rung, across panel sizes"; NOT the full
      3x3=9-cell Cartesian product, which the idea's own text does not
      request): construct the perturbed panel, compute each perturbed
      curve's own per-curve permutation p-value (Var and C/F, m=4) against
      its own reused 20000-draw null population, form the full-panel
      Fisher combination (perturbed curves + unperturbed background),
      form the oracle Fisher combination (perturbed curves only), and
      report the per-curve Holm-corrected outcome across the FULL k+48-k
      mixed panel as the existing comparator, alongside every
      Fisher-combined result.
    stage2_matched_null_panel_control: >-
      MANDATORY, at every tested panel size (5,10,15), per
      `matched_null_panel_construction` above: report the full-panel and
      oracle Fisher combinations for the UNPERTURBED matched panel,
      confirming no spurious rejection before any perturbed cell at that
      panel size is interpreted as a positive finding.
    stage3_detection_power_surface: >-
      PRIMARY DELIVERABLE. Report reject/no-reject (at alpha=0.05) for
      full-panel, oracle, and per-curve-Holm arms across every Stage-2
      grid cell, plus the smallest tested cell (by fraction, then by panel
      size) at which the full-panel arm first rejects, if any; if none
      rejects, report that explicitly as a bounded negative result over
      the tested grid (per H-MONO-d9dc51's own quantifier_order).
    dual_path_control: >-
      Route 1 (direct convolution, `conv.py::convolution_tower`) vs route
      2 (FFT-derived, `conv.py::cell_stats_fft` /
      `stat_bundle_from_coords`) on every perturbed and matched-null-panel
      real-arm cell, same 1e-9 relative tolerance as EXP-MONO-b1423c.
    comparability_policy: >-
      This record does NOT license any comparison of its own numbers with
      EXP-MONO-c819ba's, EXP-MONO-670aa6's, or EXP-MONO-b19c6b's own
      archived cells beyond the specific reuse declared above (reading,
      not recomputing, the background panel and the RO3 reproduction
      target).

  metrics:
    primary:
      - "T1: full-panel Fisher-combined p-value (Var and C/F, each grid cell)."
      - "T2: oracle perturbed-curves-only Fisher-combined p-value (Var and C/F, each grid cell)."
      - "T3: matched-null-panel full-panel and oracle Fisher-combined p-values (Var and C/F, each panel size)."
      - "T4: per-curve Holm-corrected reject/no-reject outcome on the same planted panels, every grid cell."
      - "T5: Stage 1 RO3 reproduction cells' S5 raw p-values and S1-S4 mixed-panel Fisher combined p-values, checked against EXP-MONO-b1423c's own archived values."
    secondary:
      - Stage 0 exact planted C/F elevation per perturbation fraction, per curve, compared against the closed-form reconstruction.
      - Stage 0 Fisher floor-vs-threshold report at k in {5,10,15,48-k+k}.
      - Dual-path route1/route2 agreement on every real-arm cell.
      - Var_real, C_real/F, and their ratio to the matched null's mean/median, per curve, per fraction.

  preregistered_prediction:
    - quantity: T5 (Stage 1 reproduction)
      value: >-
        Exact match (to 1e-9 relative) with EXP-MONO-b1423c's own archived
        S5/S1-S4 values. This is a hard gate, not a two-sided prediction:
        any mismatch halts the run as `failed_infrastructure`.
      source: experiments/EXP-MONO-b1423c/execution_report.yaml
    - quantity: T1/T2 (full-panel and oracle Fisher-combined, across the grid)
      value: >-
        TWO-SIDED, GENUINELY OPEN, per H-MONO-d9dc51's own predictions: at
        the mildest cell (2% perturbation, 5 curves) more-likely-than-not
        no rejection; at the strongest tested cell (10% perturbation, 15
        curves) a realistic chance of rejection, especially in the oracle
        arm. Neither direction is assumed; both are reportable outcomes.
      source: H-MONO-d9dc51 predictions; IDEA-20260831-3fa5c9.
    - quantity: T3 (matched null-panel arm)
      value: >-
        No rejection (full-panel or oracle) at any tested panel size, at
        alpha=0.05. A rejection here is a specificity failure, reported
        prominently, and would undercut interpretation of any T1/T2
        rejection at that panel size.
      source: KN-TECH-7745e6 (null-calibration discipline).

  scale_relevance:
    tier: toy
    justification: >-
      p in [100,3000] (inherited from EXP-MONO-b19c6b's own reused panel),
      up to 15 perturbed curves, m=4, n=20000 permutation draws per curve.
      No transfer to cryptographic scale, F_{q^n}, or any cost/exponent
      statement is claimed, unchanged from every predecessor in this lane.
    correspondence: null

  tail_checks:
    - >-
      The matched-null-panel arm's own empirical rejection behavior across
      the three tested panel sizes is the tail check for
      HEUR-MONO-FISHER-1's independence assumption, per H-MONO-d9dc51's
      own falsification_condition on that heuristic.

  replication:
    seeds: [20260901]
    independent_instances: 1

  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.33
    maximum_memory_gb: 0.5
    maximum_runs: 1
    maximum_workers: 1
    cost_note: >-
      Precedent, named exactly, per this lane's own convention: (1)
      EXP-MONO-b1423c's own execution_report.yaml records RUN-MONO-b1423c-1
      at wall_seconds=4.518084764480591, peak_rss_bytes=40124416, for 2
      known-positive cells x 20000 null draws each (40,000 total draws) on
      a single fixed curve (RO3, N=288) -- this contract's own Stage 1
      reproduces exactly that workload. (2) EXP-MONO-b19c6b's own
      execution_report.yaml records RUN-MONO-b19c6b-1/2 at
      wall_seconds=373.36/432.59, peak_rss_bytes=219758592/230981632, for
      a ~100-curve panel (its own specification.yaml `budget.cost_note`
      estimates ~2,000,000 draws per run across both the null-object and
      null-subset arms) -- an observed rate on the order of ~5,000 draws/
      second including full curve-construction, group-structure, and FFT
      spectrum overhead, at field_bits up to 11 (the SAME curve panel this
      contract reuses). This contract's own Stage 2 needs at most 15
      curves x one 20000-draw null population each = 300,000 draws (per
      `inputs.null_draws_note`, a population is computed ONCE per curve
      and reused across every fraction/panel-size cell, not redrawn per
      cell), plus Stage 1's own 40,000 draws: ~340,000 draws total.
      Scaling EXP-MONO-b19c6b's own observed rate linearly projects
      ~68-136s; curve construction itself is skipped entirely here (the
      panel is READ from RUN-MONO-b19c6b-1's raw-result.json, not
      reconstructed), so the true figure should be faster, not slower,
      than that projection. wall_clock_seconds_per_run=600 sets a
      generous >=4x safety margin over the projection while matching this
      lane's own established floor (EXP-MONO-b1423c's identical
      600s ceiling) and the program-wide budget-floor guidance
      (templates/research-records.md `budget` schema comment:
      wall_clock_seconds_per_run >= 600, one full tool window).
      maximum_memory_gb=0.5 (536870912 bytes) is set BELOW the
      program-wide 8GB floor guidance, justified by precedent: this
      contract processes at most 15 curves' worth of null-draw arrays and
      FFT spectra simultaneously (fewer than EXP-MONO-b19c6b's own 100-curve
      panel, which peaked at 231MB), so 512MB is a >=2x safety margin over
      the most memory-intensive precedent in this exact lane, not an
      unjustified small cap.
    maximum_total_disk_bytes: 268435456

  environment_preconditions:
    consequence: NO CAS AND NO SOLVER IS REQUIRED, unchanged from all four prior contracts in this lane.
    if_a_precondition_fails: >-
      A missing interpreter, a failed symmetry/subgroup-construction check,
      or a Stage 0/Stage 1 gate failure is `failed_infrastructure`,
      reported as infrastructure signal, NEVER negative mathematical
      evidence (AGENTS.md rule 3).

  infrastructure_failure_disposition: >-
    Any timeout, crash, or construction/gate failure is recorded with its
    exact cause and classified `failed_infrastructure` or `invalid`.
    Supports and weakens NOTHING about H-MONO-d9dc51 or H-MONO-663fb4 or
    the ECDLP.

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen and authorized. (NOT yet satisfied.)
    - >-
      STOP if the Stage 0 exact-elevation precommitment check finds the
      directly-computed spectrum disagreeing with the closed-form
      reconstruction beyond 1e-9 relative -- this is an implementation
      defect in the perturbation construction, not evidence; report as
      `failed_infrastructure`.
    - >-
      STOP if the Stage 1 RO3 reproduction cells fail to match
      EXP-MONO-b1423c's own archived values (`reused_stage1_reproduction_target`)
      to 1e-9 relative tolerance.
    - Stop on any dual-path route1/route2 disagreement beyond 1e-9 relative on any real-arm cell, reporting as infrastructure signal.
    - Stop on any budget breach, reporting it as infrastructure signal.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Any modification to the reused fields/curve/conv/groupstate/stats.py implementation files, or to c819ba's subgroup_control.
    - Any recomputation (rather than direct reuse) of RUN-MONO-b19c6b-1's background panel or its already-archived raw p-values.
    - Any redraw of a curve's 20000-draw null population per grid cell rather than once per curve (a protocol deviation from `null_draws_note`, requiring disclosure, not silent absorption).
    - Any report of T1/T2/T3 without also reporting T5 (the Stage 1 reproduction gate result) and the Stage 0 gate reports.
    - >-
      Any post-hoc change to the fraction ladder, panel-size ladder, the
      curve-selection rule, or the Fisher-combined statistic's definition
      after any Stage-2/3 number has been observed. Requires a versioned
      protocol amendment marked exploratory_only, never a silent edit.

  success_criterion: >-
    A run is well-formed evidence (regardless of which of H-MONO-d9dc51's
    two mutually exclusive outcomes, A or B, it supports) if: Stage 0's
    two gates pass; Stage 1 reproduces EXP-MONO-b1423c's own archived
    values; the background panel and RO3 reproduction target are reused
    unmodified, not recomputed; T1-T5 are reported with exact values at
    every declared grid cell, both statistics, both the full-panel and
    oracle arms, plus the per-curve Holm comparator; the matched
    null-panel control is reported at every panel size; the dual-path
    control shows no threshold breach. THAT DISPOSITION SUPPORTS EXACTLY
    the scoped statement in `claim_ceiling` and nothing more, and is
    decidable under EITHER outcome A or outcome B: a full-panel or oracle
    rejection at some tested cell (with the null-panel control clean at
    that panel size) is well-formed evidence for outcome A; a clean
    null-panel control at every panel size combined with no rejection
    anywhere in the grid is well-formed evidence for outcome B. Both
    readings are decidable from the same required artifacts; this record
    does not need to know in advance which will obtain.

  falsification_criterion: >-
    Any of: (a) Stage 0's exact-elevation check failing (infrastructure,
    not evidence); (b) Stage 1 failing to reproduce EXP-MONO-b1423c's
    archived values (infrastructure, not evidence); (c) the matched
    null-panel arm rejecting at a rate materially above alpha=0.05 at any
