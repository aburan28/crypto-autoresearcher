experiment:
  id: EXP-JMV-005
  hypothesis_id: H-JMV-002
  version: 1
  title: Tightness of the Proposition 3.1 rapid-mixing bound on ordinary isogeny graphs.
  status: draft
  objective: >-
    Measure how much slack separates the proven mixing bound from real mixing on the JMV
    generator set, and supply the empirical walk length that anchors the EXP-JMV-004 cost model.
  inputs:
    discriminants: 30 fundamental D < 0 with class number h in [500, 50000]
    generator_bound_m: [64, 256, 1024]
    subset_sizes: "|S| = h / polylog(h), several values"
    walk_lengths: geometric grid from 1 to 4x the proven bound
  controls:
    - "Positive control: exact uniform sampling from Cl(O). Measured TV distance must go to 0 and hitting rate to |S|/h."
    - "Negative control: walk using only l = 2 (degree ~2). Must mix visibly slower than the full generator set; if it does not, the metric is insensitive and the run is void."
    - "Reference line: the proven r from Prop 3.1, r >= log(2h/|S|^{1/2}) / log(k/c)."
    - "Backtracking control: compare backtracking vs non-backtracking walks; report both rather than silently choosing one."
  independent_variables: [discriminant, m, walk length, subset size, walk type]
  metrics:
    primary: [total-variation distance to uniform vs steps, hitting probability of S vs steps, empirical mixing time]
    secondary: [ratio empirical_mixing_time / proven_r, spectral gap from EXP-JMV-003 for the same D]
  replication:
    seeds: [20260726, 20260727, 20260728, 20260729, 20260730]
    independent_instances: 5
  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_runs: 25
  stopping_rules:
    - Fixed walk-count budget per (D, m); no adaptive extension based on interim results.
  invalidation_rules:
    - Failure of the uniform-sampling positive control invalidates the run.
    - Failure of the l=2 negative control to mix more slowly invalidates the metric.
  success_criterion: >-
    A measured mixing time with error bars per (D, m), and the slack ratio against the
    proven bound across the discriminant range.
  falsification_criterion: >-
    Measured mixing SLOWER than the proven bound. Under GRH that is a contradiction, so it is
    treated first as a bug signal: it must be independently replicated and the class-group
    discrete-log code re-verified before any interpretation is recorded.
  required_artifacts: [runs/<id>/manifest.yaml, raw.json, stderr.txt, analysis.md, mixing.csv]
  claim_tier: medium
  claim_boundary: >-
    Mixing behaviour on the tested discriminants only. Not a statement about cryptographic-size
    class groups except through the explicit scaling analysis in EXP-JMV-004.
  notes:
    - "This measures mixing on Cl(O) as an abstract group, NOT the cost of realizing each step as an actual isogeny computation over F_q; that cost is EXP-JMV-004's concern. The two must not be conflated in the write-up."
  assigned_to: executor
  approved_by: null
