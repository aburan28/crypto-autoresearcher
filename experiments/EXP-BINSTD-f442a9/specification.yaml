# =============================================================================
experiment:
  id: EXP-BINSTD-f442a9
  hypothesis_id: H-BINSTD-0dd2ce
  question_id: RQ-BINSTD-b6f698
  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-2e63c3
  unit: U-HOLDH
  source_ideas:
    lead: IDEA-20260922-d11575
    consolidated: [IDEA-20260922-0e3641]
  version: 1
  supersedes: null
  status: review_required
  approved_by: null
  designed_by: coordinator (TASK-20261002-9f9ce5)
  recorded_at: '2026-10-02'
  audit_sheet: coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-2e63c3/design/TASK-20261002-9f9ce5/proof-search-map-audit.yaml
  review_plan: coordination/review/binstd-h-20261002-2e63c3/review-plan.yaml

  title: >-
    U-HOLDH: the descent-lattice census of the five composite-degree ANSI X9.62
    rows as a frozen baseline fixture, a toy-scale verification of the collapse
    statement (C1') with negative and positive controls, toy-scale validation
    of the numbered heuristics H-DL-1 (split density) and H-DL-2 (complexity
    law), and the memory-charged cost table rebuilt from the validated
    heuristics, every row conditional

  objective: >-
    Reduce four uncertainties, none of them about any curve's security. (1)
    Whether the conorm-norm image of the prime-order part is zero on collapsed
    lanes of toy subfield cells while it is non-zero on the open lanes of the
    same cells (toy-scale check of (C1'), whose deployed form is conditional on
    OB-1). (2) Whether the split density of reduced divisors on GHS covers of
    genus 8 matches 1/g! within 0.5 bit, with the tail of the factor-count
    distribution consistent (H-DL-1). (3) Whether the double-large-prime
    relation-collection trial count scales as q^(2 - 2/g) with a constant inside
    the declared range [1, g!] (H-DL-2). (4) What the charged cost rows of MM-1
    become on the ten small-genus deployed cells when the H-DL-2 constant range
    is replaced by the measured one. Every deployed-row figure stays a
    conditional design figure.

  decision_it_changes: >-
    Whether the program's first memory-charged, linear-algebra-charged cost
    table for the composite-degree ANSI rows can be stated as resting on
    validated toy-scale heuristics (with explicit transfer assumptions) rather
    than on a recalled law, and whether the 25 collapsed cells may be carried as
    STRUCTURALLY_EMPTY_COND_OB1 with a toy-scale check of the conclusion beside
    the source's own computation.

  # ---------------------------------------------------------------------------
  inputs:
    parameter_source:
      command: >-
        openssl ecparam -name NAME -param_enc explicit -text -noout for NAME in
        c2pnb176v1, c2pnb208w1, c2pnb272w1, c2pnb304w1, c2pnb368w1, c2tnb191v1,
        c2tnb239v1, preceded by openssl version (C-8 form)
      secondary_source_note: >-
        OpenSSL named-curve tables (secondary). The committed audit dump
        analysis/binstd-curve-audit/binary-curve-params.txt and the session's C-8
        dump agree on every declared row (stage0_census PARAMS_AGREE lines). ANSI
        X9.62 itself was not read (K-IMP-ANSI, OB-5).
    frozen_code: >-
      The six code blocks of the audit sheet, extracted by its pinned method
      E-1 and bound by the reference_sha256 recorded there: stage0_census,
      cost_table, decision_rules, null_calibration, dry_call, toy_admissibility.
      Any executor code (the GHS cover, conorm-norm and index-calculus
      implementations of the toy arms) is new code written under this contract
      and is recorded with its own sha256 in each run manifest.
    frozen_design_figures: >-
      The audit sheet's session_computations C-3 (census), C-4 (cost table),
      C-5 (null false-fire table), C-6 (dry call), C-7 (toy admissibility) and
      C-8 (parameter dump) outputs, each with its sha256. These are design
      figures, never results.
    source_fixture: >-
      MMT Table 3 as transcribed in
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-04a6be/reading/TASK-20260929-0be49c/reading-note.yaml
      (bound by TASK-20260929-26849f, path_sha256
      e967afcf13326a50339eb0036fe84598999d46a84049fdab89f7e100fa1094f7), embedded
      in stage0_census as MMT_TABLE3.

  # ---------------------------------------------------------------------------
  declared_cells:
    deployed_rows:
      names: [c2pnb176v1, c2pnb208w1, c2pnb272w1, c2pnb304w1, c2pnb368w1]
      lanes_by_role: [COLLAPSED_C1, COLLAPSED_C2, COLLAPSED_C4, COLLAPSED_C8, BASELINE_C16, OPEN_N16, OPEN_N8, OPEN_N4, OPEN_N2, IDENTITY]
      role_rule: >-
        For divisor c of N = 16k: IDENTITY if c = N; BASELINE_C16 if c = 16;
        COLLAPSED_C<c> if c divides 16 and c < 16; OPEN_N<N/c> otherwise. The
        census computes the role independently (lane_role from lcm(c, d_AB)) and
        prints DECLARED_ROLES_MATCH; every arm selects lanes by these names.
      computation_allowed: arithmetic on published coefficients only
    prime_control_rows:
      names: [c2tnb191v1, c2tnb239v1]
      lanes_by_role: {c2tnb191v1: [OPEN_N191, IDENTITY], c2tnb239v1: [OPEN_N239, IDENTITY]}
    fixtures:
      - name: KOBLITZ-176
        definition: y^2 + xy = x^3 + 1 over F_(2^176) with c2pnb176v1's field polynomial
      - name: B8-176
        definition: >-
          A = 0, B' = Tr_(F_(2^176)/F_(2^8))(y) for the first seeded draw y of
          random.Random(20261003).getrandbits(176) with B' in F_(2^8) \ F_(2^4)
          and Tr_(F_(2^8)/F_2)(B') = 1
      - name: UNIFORM-176
        definition: A = 0, 32 draws of B' from random.Random(20261002).getrandbits(176), B' != 0
    fixture_rule: >-
      Coefficient arithmetic only. No group order, point or cover is computed on
      any fixture.
    toy_cells:
      rule: >-
        E: y^2 + xy = x^3 + B over F_(2^d) (A = 0), attacked over
        K = F_(2^(d k')), k' odd prime. Field moduli: d = 2, x^2 + x + 1; d = 4,
        x^4 + x + 1; d = 8, x^8 + x^4 + x^3 + x + 1. B is the first integer
        2, 3, ... (polynomial basis) satisfying AR-1 (B generates F_(2^d); for
        d = 8, Tr_(F_(2^8)/F_2)(B) = 0; for d in {4, 8} the OPEN_N4 lane has
        m = 4; l', the largest prime factor of L = #E(K)/#E(F_(2^d)), satisfies
        l' > h and log2 l' >= log2(L)/2). Lanes by role exactly as for deployed
        rows with 16 replaced by d.
      cells:
        - {name: TC-A, d: 4, k_prime: 5, arms: [ARM-C1-NEG, ARM-C1-POS, ARM-C1-INSTR]}
        - {name: TC-B, d: 4, k_prime: 7, arms: [ARM-C1-NEG, ARM-C1-POS, ARM-C1-INSTR]}
        - {name: TC-C, d: 8, k_prime: 5, arms: [ARM-C1-NEG, ARM-C1-POS, ARM-C1-INSTR, ARM-H1, ARM-H2]}
        - {name: TC-D1, d: 2, k_prime: 11, arms: [ARM-C1-NEG, ARM-C1-POS, ARM-C1-INSTR]}
        - {name: TC-D2, d: 2, k_prime: 13, arms: [ARM-C1-NEG, ARM-C1-POS, ARM-C1-INSTR]}
        - {name: TC-D3, d: 2, k_prime: 17, arms: [ARM-C1-NEG, ARM-C1-POS, ARM-C1-INSTR]}
        - {name: TC-D4, d: 2, k_prime: 19, arms: [ARM-C1-NEG, ARM-C1-POS, ARM-C1-INSTR]}
        - {name: TC-E, d: 4, k_prime: 11, arms: [ARM-H1, ARM-H2]}
        - {name: TC-F, d: 4, k_prime: 13, arms: [ARM-H1, ARM-H2]}
      admissibility: >-
        Evaluated at design time by C-7 (toy_admissibility; output embedded in
        the audit sheet). All nine cells were admitted there with their chosen B,
        h, #E(K), the factorisation of L, l' and gcd(l', h) = 1. Those values fix
        the cells; the executor re-derives them as its first act (IR-1 analogue
        for toy cells, IR-6).
      shared_base_curves: >-
        Disclosed design property: TC-A and TC-B share the base curve B = 0x9
        over F_16, TC-E and TC-F share B = 0x8 over F_16, and TC-D1 to TC-D4 share
        B = 0x2 over F_4 (C-7). They are independent descent instances (different
        K and l'), not independent base curves.
      scale_bound: >-
        ARM-C1 cells have d k' <= 41 (the proposal's bound). ARM-H1 and ARM-H2
        use TC-E (d k' = 44) and TC-F (d k' = 52) as well, with reason: g = 8 needs
        q >= 2^10 so that g^2/q <= 2^-4 (AR-2), and a slope fit needs three q
        values; the only d k' <= 41 OPEN_N4 lane with q >= 2^10 is TC-C. The
        heuristic arms solve no ECDLP instance and run no attack; no cell reaches
        N = 131.

  # ---------------------------------------------------------------------------
  arms:
    - name: ARM-S0
      role: baseline fixture regression (DC-H2, DH-4)
      cells: all deployed rows, prime-control rows and fixtures
      procedure: >-
        Extract stage0_census by method E-1, verify its reference sha256, run the
        C-8 command and then stage0_census exactly as in the audit sheet's C-3
        command line. Compare the sha256 of the rerun census JSON with the frozen
        census_r2.json sha256
        bf23acf74bbf30867fc2fe7cf7bc53643f6ec657afa9f902e076634eaa1e746a. The
        JSON carries no interpreter version or file path; the stdout does, so
        stdout is compared line by line with those two environment lines
        excluded and the result is reported, not used as the gate.
      outcome_rule: decision_rules.stage0_regression -> PASS | INVALID (IR-1)
    - name: ARM-CELL
      role: the deployed cell verdict (DH-2 trichotomy)
      cells: every deployed row lane by role; prime-control lanes; KOBLITZ-176 lanes
      procedure: >-
        For each cell, build the input of decision_rules.cell_verdict from the
        frozen census and from ARM-COST, and record the verdict. Input fields:
        n, collapsed and l_coprime_def_field_order as printed by the census;
        g_min = 2^(m-1) when m < 13 (branch resolved at source, MMT p.16) and
        2^(m-1) - 1 when m >= 13 (branch open, OB-3), with g_min = 1 when m = 1;
        cond7 as printed; regime_ratio = g_min / c; cost_available true exactly
        when ARM-COST printed a cost row for the lane.
      outcomes: >-
        IDENTITY_NO_DESCENT | STRUCTURALLY_EMPTY_COND_OB1 | NO_DESCENT_G1 |
        OPEN_COLLAPSE_HYPOTHESIS_FAILS | OPEN_COLLAPSE_UNCERTIFIED |
        OPEN_COND7_UNESTABLISHED | OPEN_LARGE_GENUS_LAW | OPEN_COST_UNAVAILABLE |
        DEFINED_WITH_COMPUTED_COST
      note: >-
        The collapse test is applied first, so cost data never moves a collapsed
        cell (PTM-E). A STRUCTURALLY_EMPTY verdict is conditional on OB-1 by
        construction of its name. No verdict compares any row with matched rho.
    - name: ARM-C1-INSTR
      role: instrument gate G-COVER for the toy collapse verification
      cells: TC-A, TC-B, TC-C, TC-D1, TC-D2, TC-D3, TC-D4
      procedure: >-
        The executor implements the GHS construction (cover C over F_(2^c) and
        the map phi from E(K) to J_C(F_(2^c)) as norm of conorm) for every lane
        named in ARM-C1-NEG and ARM-C1-POS. Gate: (i) the cover's genus equals
        2^(m-1) or 2^(m-1) - 1 for the C-7 value of m; (ii) phi(P + Q) =
        phi(P) + phi(Q) and phi(O) = 0 on N_PAIRS_MIN = 32 random pairs of points
        of E(K) per lane.
      outcome_rule: decision_rules.c1_instrument -> PASS | FAIL
    - name: ARM-C1-POS
      role: positive control of the collapse verification (DH-7(e))
      lanes: {TC-A: [OPEN_N2, OPEN_N4], TC-B: [OPEN_N2, OPEN_N4], TC-C: [OPEN_N2, OPEN_N4], TC-D1: [OPEN_N2], TC-D2: [OPEN_N2], TC-D3: [OPEN_N2], TC-D4: [OPEN_N2]}
      procedure: >-
        On the open lane, sample S_MIN_C1 = 64 points P = [#E(K)/l'] R of order l'
        (R uniform in E(K), seeded, P != O) and compute phi(P).
      prediction_argued: >-
        Non-zero image on every sample. Argument, not assumption: (a) on an open
        lane F_q(A, B) = K, so lemma L6 shows the collapse argument cannot be
        applied (its hypothesis l' coprime to #E(F_q(A, B)) fails); (b) MMT
        Remark 22 (retrieved) states that when F_q(a, b) = F_(q^n) the descent
        "should yield a map phi whose kernel does not contain the subgroup of
        order r", and Hess's abstract (retrieved, abstract only) states the
        non-kernel property for the general construction; (c) phi restricted to
        the cyclic group of prime order l' is either injective or zero, so the
        outcome is all-or-nothing and a mixed result is an instrument defect;
        (d) C-7's degeneracy rule DG-3 checked that the Weil upper bound of
        #J_C(F_q) exceeds l' on every positive lane, so a non-zero image is
        possible. The control can fail: a zero image on every sample returns
        CONTROL_FAIL.
      outcome_rule: decision_rules.c1_positive -> CONTROL_PASS | CONTROL_FAIL | INSTRUMENT_DEFECT | INVALID
      on_control_fail: >-
        ARM-C1 on that cell is INVALID. A CONTROL_FAIL is never read as evidence
        against Hess or against (C1'); it is reported, flagged for a
        review-breakthrough round (TH-2 territory), and stops the negative lanes
        of that cell from being read.
    - name: ARM-C1-NEG
      role: negative-lane check of (C1') at toy scale
      lanes: {TC-A: [COLLAPSED_C1, COLLAPSED_C2], TC-B: [COLLAPSED_C1, COLLAPSED_C2], TC-C: [COLLAPSED_C2, COLLAPSED_C4], TC-D1: [COLLAPSED_C1], TC-D2: [COLLAPSED_C1], TC-D3: [COLLAPSED_C1], TC-D4: [COLLAPSED_C1]}
      lane_exclusions: >-
        TC-C COLLAPSED_C1 (m = 7, g = 64 over F_2) is not declared: cover genus 64
        is outside the instrument's declared range (g <= 8); the class is covered
        by TC-C's COLLAPSED_C2 and COLLAPSED_C4 lanes. Baseline lanes (g = 1, the
        cover is E itself and phi is the subfield trace) are not declared:
        uninformative by DG-2.
      procedure: As ARM-C1-POS, on the collapsed lane, same S_MIN_C1 = 64.
      prediction: Zero image on every sample (lemmas L1 to L4, under OB-1's toy instance).
      outcome_rule: >-
        decision_rules.c1_negative(n_samples, n_nonzero, instrument outcome,
        positive outcome of the same cell) -> CONSISTENT | REFUTED | INVALID.
        REFUTED requires a passing instrument gate and a CONTROL_PASS on the same
        cell.
    - name: ARM-H1
      role: validation arm of H-DL-1 (split density, distribution and tail)
      lanes: {TC-C: [OPEN_N4], TC-E: [OPEN_N4], TC-F: [OPEN_N4]}
      parameters: >-
        g = 8 on all three (C-7: m = 4); q = 2^10 (TC-C), 2^11 (TC-E), 2^13 (TC-F).
      procedure: >-
        Cover sample. Fix seeded points P, Q of order l' in E(K) on the lane and
        draw S = H1_SAMPLES = 2^24 divisors D = [a] phi(P) + [b] phi(Q) with a, b
        uniform modulo l' (seeded). For each D record, from its Mumford
        polynomial u (degree 8): whether u splits into linear factors over F_q
        (k_cover), the number of distinct roots of u in F_q (histogram over
        0..8), and whether every irreducible factor of u has degree at most 2
        (n_2smooth). Null sample. One imaginary hyperelliptic curve of genus 8
        over the same F_q, y^2 + h(x) y = f(x) with f monic of degree 17 and
        deg h <= 8 drawn from a seeded generator and accepted only if smooth; D
        = [a] D1 + [b] D2 for seeded random degree-one divisors D1, D2, a and b
        uniform below 2^64; the same S and statistic (k_null).
      statistic_and_thresholds: >-
        r = log2(k / S * g!) with a 99 percent Wilson interval. AR-2 admission
        (2 log2 g - log2 q <= -4). DR-H1: INVALID_NULL if the null interval lies
        outside [-1, 1]; VALIDATED if the cover interval lies inside [-0.5, 0.5];
        FALSIFIED if the cover interval lies outside [-1, 1]; INCONCLUSIVE
        otherwise. DR-H1-TAIL: total variation between the root-count histogram
        and the fixed-point law of a uniform random permutation of 8 letters,
        TAIL_PASS at <= 0.02 with the 2-smooth interval inside [-0.5, 0.5] bit of
        I_8/8! = 764/40320; TAIL_FAIL above 0.05 or with the 2-smooth interval
        outside [-1, 1]; TAIL_INCONCLUSIVE otherwise.
      sample_size_and_power: >-
        S = 2^24 gives about 416 expected splits per curve at p = 1/8!. Power and
        false-fire figures are the C-5 output (audit sheet), stated beside DR-H1
        below.
      outcome_rule: decision_rules.h1_outcome(h1_admit, h1_bulk, h1_tail) -> VALIDATED | FALSIFIED | INCONCLUSIVE | INVALID_NULL | NOT_ADMITTED
    - name: ARM-H2
      role: validation arm of H-DL-2 (complexity law and constant)
      lanes: the OPEN_N4 lanes of TC-C, TC-E and TC-F jointly (grid name TC-C+TC-E+TC-F)
      procedure: >-
        On each lane's cover, run the double-large-prime relation collection:
        factor base F = the ceil(q^(7/8)) degree-one places of smallest
        x-coordinate (integer order in the polynomial basis, one place per
        x-coordinate up to the hyperelliptic involution); random walk D =
        [a] phi(P) + [b] phi(Q); a trial yields a full relation if u splits over
        F, a partial one if u splits into linear factors with at most two outside
        F; partial relations are joined in a union-find large-prime graph and
        every independent cycle counts as one relation; stop when full relations
        plus independent cycles reach |F| + 10. Record trials, F_q
        multiplications, the final relation matrix's mean row weight and the
        peak memory. H2_REPLICATES = 3 replicate runs per q with distinct seeds;
        log2 trials is the mean over replicates.
      cap: SR-3, at 2 g! q^(2 - 2/g) trials per replicate.
      outcome_rule: >-
        decision_rules.h2_outcome over the three (log2 q, log2 trials, censored)
        points with g = 8 -> VALIDATED | FALSIFIED | INCONCLUSIVE |
        INVALID_INSUFFICIENT.
    - name: ARM-COST
      role: the charged cost table rebuilt from the validated heuristics (DC-H3, DH-5)
      procedure: >-
        Rerun cost_table on the frozen census with one pre-registered
        substitution and nothing else. If DR-H2 is VALIDATED, the kappa range
        becomes [min measured log2 kappa - 0.5, max measured log2 kappa + 0.5],
        printed at its two ends and its midpoint; if the measured mean row weight
        exceeds 2 g, LA_WEIGHT_FACTOR becomes the measured weight divided by g. If
        DR-H2 is INCONCLUSIVE, the stated range [0, log2 g!] stays and every row
        is labelled H-DL-2 UNVALIDATED. If DR-H2 or DR-H1 is FALSIFIED, no cost
        row is produced and the small-genus cells read OPEN_COST_UNAVAILABLE.
      output_label: >-
        Conditional design figures under MM-1, H-DL-1, H-DL-2 and TA-1 to TA-3.
        No verdict. The executor writes no sentence comparing a row with matched
        rho; the table's columns carry the numbers.

  # ---------------------------------------------------------------------------
  controls:
    - >-
      CTRL-1 baseline embedding: the BASELINE_C16 cell of every deployed row
      returns m = 1, g candidates (1, 0) (frozen census; ARM-S0).
    - >-
      CTRL-2 Koblitz-shaped fixture KOBLITZ-176: m = 1 in every lane, no descent,
      no cost row (PTM-C).
    - >-
      CTRL-3 B in F_(2^8) fixture B8-176: m <= n/2 in the four lanes whose
      declared roles are OPEN_N16, OPEN_N8, OPEN_N4 and OPEN_N2 (the same code
      path that yields the n/2 + 1 lower bound on the deployed rows).
    - >-
      CTRL-4 uniform-B null UNIFORM-176: m = n per lane with the probability
      P(m = n) printed by stage0_census from the factor degrees of x^n - 1 over
      F_2 (the stated probability), observed counts beside expected.
    - >-
      CTRL-5 prime-degree rows c2tnb191v1 and c2tnb239v1: divisor lattice
      {1, N}, one OPEN lane with m = N (genus 2^(N-1)), no cost row (PTM-A).
    - >-
      CTRL-6 positive control of the collapse verification: the open lanes of
      each ARM-C1 toy cell (ARM-C1-POS), with its argued prediction.
    - >-
      CTRL-7 null object of the same shape for H-DL-1: a random smooth genus-8
      imaginary hyperelliptic curve over the same F_q (ARM-H1 null sample).
    - >-
      CTRL-8 synthetic comparison rows PTM-D (rho entered as an IC row; rho time
      with 2^40 entries of memory) through the cost comparison, printed by
      cost_table at every deployed row.
    - >-
      CTRL-9 instrument gate G-COVER (ARM-C1-INSTR), genus and homomorphism
      checks, before any negative lane is read.

  independent_variables:
    - deployed row (five) and lane role (ten), arithmetic only
    - toy cell (nine) and lane role
    - q in {2^10, 2^11, 2^13} at g = 8 for the heuristic arms
    - the H-DL-2 constant kappa (cost table parameter; replaced by the measured range under ARM-COST's rule)
    - machine-model sensitivity P in {2^10, 2^20, 2^30} and RHO_AREA in {2^10, 2^16, 2^22} (cost table)

  metrics:
    primary:
      - ARM-C1-NEG outcome per (toy cell, collapsed lane), with n_nonzero out of 64
      - DR-H1 outcome and r with its 99 percent interval per OPEN_N4 lane, cover and null
      - DR-H2 outcome, fitted slope and log2 kappa per q
    secondary:
      - ARM-C1-POS and ARM-C1-INSTR outcomes per cell
      - root-count histogram total variation and 2-smooth ratio per lane (DR-H1-TAIL)
      - relation matrix mean row weight, F_q multiplications per trial, peak memory per ARM-H2 run
      - the ARM-COST table (conditional design figures)
      - ARM-CELL verdict per deployed cell
      - wall-clock and peak_rss_bytes per run (measured), beside the modelled memory

  heuristic_under_test: [H-DL-1, H-DL-2]
  preregistered_prediction:
    - quantity: split density of Mumford u on genus-8 GHS covers (H-DL-1)
      formula: >-
        p_split = (1/g!)(1 + delta), |log2(1 + delta)| <= 0.5 for 2^10 <= q <= 2^13;
        root-count law P(J = j) = (1/j!) sum over i <= g - j of (-1)^i / i!;
        2-smooth fraction I_g / g! (I_8 = 764)
      source: >-
        Internal derivations in the audit sheet (count of totally split monic
        polynomials C(q + g - 1, g); inclusion-exclusion for fixed points of
        permutations). Panario-Gourdon-Flajolet is a recalled pointer and
        supports nothing.
    - quantity: relation-collection trials of the double-large-prime variant (H-DL-2)
      formula: N_trials = kappa q^(2 - 2/g), log2 kappa in [0, log2 g!], slope 1.75 at g = 8
      source: >-
        The contract's own heuristic, in the form of the Gaudry-Thome-Theriault-Diem
        law (KN-LIT-92caf4, abstract-level corpus entry, treated as recalled;
        supports nothing).
    - quantity: conorm-norm image of the order-l' part (C1')
      formula: zero on every admitted collapsed toy lane; non-zero on every open toy lane of the same cell
      source: lemmas L1 to L6 of H-BINSTD-0dd2ce (proofs in the audit sheet) under OB-1

  scale_relevance:
    tier: toy
    justification: >-
      Deployed rows are arithmetic only (census and cost formulas on published
      coefficients). Toy cells: K = F_(2^(d k')) with d k' in {20, 22, 26, 28,
      34, 38, 40} for ARM-C1 and q in {2^10, 2^11, 2^13} (d k' up to 52) for the
      heuristic arms. Transfer to deployed q = 2^(4k) (2^44 to 2^92) is by TA-1,
      TA-2 and TA-3 of H-BINSTD-0dd2ce, distance 31 to 82 bits of log2 q; TA-2
      (kappa constant in q) is the least supported and the cost table carries
      kappa as a range for that reason.
    correspondence: null

  tail_checks:
    - DR-H1-TAIL root-count histogram against the permutation fixed-point law (total variation)
    - DR-H1-TAIL 2-smooth fraction against I_8/8! (interval in bits)
    - ARM-H2 per-replicate spread of log2 trials reported beside the mean (no rule; descriptive)

  replication:
    master_seed: 20261002
    seed_rule: >-
      Run seeds are the successive random.Random(20261002).getrandbits(64)
      values assigned in the order of run_names below; IR-5 requires them
      pairwise distinct.
    run_names:
      - S0
      - C1-TC-A
      - C1-TC-B
      - C1-TC-C
      - C1-TC-D1
      - C1-TC-D2
      - C1-TC-D3
      - C1-TC-D4
      - H1-TC-C
      - H1-TC-E
      - H1-TC-F
      - H2-TC-C-r1
      - H2-TC-C-r2
      - H2-TC-C-r3
      - H2-TC-E-r1
      - H2-TC-E-r2
      - H2-TC-E-r3
      - H2-TC-F-r1
      - H2-TC-F-r2
      - H2-TC-F-r3
      - COST
    independent_instances: >-
      Seven toy cells for ARM-C1 (three distinct base curves; disclosed above),
      three q values for ARM-H1 and ARM-H2, three replicates per q for ARM-H2.

  # ---------------------------------------------------------------------------
  stopping_rules:
    - id: SR-1
      rule: >-
        ARM-C1-NEG on a lane stops at the first non-zero image (the lane's
        outcome is then decided by c1_negative given the same cell's instrument
        and positive outcomes); otherwise it stops at 64 samples.
      false_fire_under_null: >-
        0 of 20000 under the structural null ((C1') true, instrument correct),
        Wilson 95 percent upper bound 0.00019 (C-5 run 3, line SR-1/C1 REFUTED).
    - id: SR-2
      rule: >-
        ARM-H1 runs exactly S = 2^24 samples per curve; no early stop. A
        machine-protection watchdog stop checkpoints the run and is
        infrastructure, never a result.
      false_fire_under_null: not applicable (no data-dependent stop)
    - id: SR-3
      rule: >-
        ARM-H2 caps each replicate at 2 g! q^(2 - 2/g) trials (one bit above the
        declared kappa range); a cap hit is recorded as censored and DR-H2 reads
        it as FALSIFIED (kappa > 2 g! implied).
      false_fire_under_null: >-
        0 of 60000 replicate draws at each of log2 kappa = 0, 7.65 and 15.30
        under H-DL-2 exact, Wilson 95 percent upper bound 0.00006 (C-5 run 3).
  invalidation_rules:
    - id: IR-1
      rule: >-
        The ARM-S0 rerun census JSON sha256 differs from the frozen census_r2.json
        sha256 (decision_rules.stage0_regression on the two digests). Every arm
        reading the census is INVALID until reconciled. The executor attaches the
        field-wise diff; a difference confined to the last unit of a float is
        reported as a serialization difference for the reviewing composer and is
        never silently ignored.
      false_fire_under_null: >-
        0 of 20000 under a deterministic rerun, Wilson 95 percent upper bound
        0.00019 (C-5 run 3).
    - id: IR-2
      rule: ARM-C1-INSTR returns FAIL on a cell. ARM-C1 on that cell is INVALID.
      false_fire_under_null: >-
        0 of 20000 under a correct implementation (structural null), upper bound
        0.00019 (C-5 run 3). The instrument's own error rate is what the gate
        measures at execution and is not calibrated here.
    - id: IR-3
      rule: ARM-C1-POS returns anything but CONTROL_PASS on a cell. The negative lanes of that cell are INVALID.
      false_fire_under_null: >-
        0 of 20000 under phi correct and the non-kernel expectation (structural
        null), upper bound 0.00019 (C-5 run 3).
    - id: IR-4
      rule: DR-H1's null interval lies outside [-1, 1] bit. That lane's ARM-H1 outcome is INVALID_NULL.
      false_fire_under_null: >-
        0 of 20000 under H-DL-1 exact at g = 8 and S = 2^24, upper bound 0.00019
        (C-5 run 3).
    - id: IR-5
      rule: Two runs share a seed. Both runs are INVALID.
      false_fire_under_null: >-
        0 of 20000 draws of 64 seeds of 64 bits, upper bound 0.00019; exact
        birthday bound 1.1e-16 (C-5 run 3).
    - id: IR-6
      rule: >-
        A toy cell's re-derived B, h, #E(K), l' or lane m differs from the C-7
        design figure. That cell is INVALID for every arm.
      false_fire_under_null: 0 by construction (deterministic arithmetic, frozen code)
  admission_rules:
    - id: AR-1
      rule: The toy-cell admissibility rule above (decision_rules.toy_cell_admissible; evaluated by C-7).
      false_fire_under_null: 0 by construction (deterministic parameter arithmetic; no stochastic input)
    - id: AR-2
      rule: ARM-H1 admits a lane only if 2 log2 g - log2 q <= -4.
      false_fire_under_null: 0 by construction (deterministic in g and q)

  decision_rules:
    code: decision_rules block of the audit sheet (reference sha256 pinned there); every rule is selected by declared cell, arm and lane name
    rules:
      - id: DR-CELL
        function: cell_verdict
        false_fire_under_null: not applicable (deterministic on the frozen census)
      - id: DR-C1
        function: c1_negative with c1_positive and c1_instrument
        false_fire_under_null: >-
          REFUTED in 0 of 20000 under the structural null, upper bound 0.00019
          (C-5 run 3).
      - id: DR-H1
        function: h1_bulk with h1_admit and h1_outcome
        false_fire_under_null: >-
          FALSIFIED in 0 of 20000 under H-DL-1 exact (g = 8, S = 2^24), upper
          bound 0.00019; VALIDATED 19999, INCONCLUSIVE 1. Power: FALSIFIED in 4864
          of 5000 at a true deviation of -1.5 bit and in 5000 of 5000 at +1.5 bit;
          INCONCLUSIVE in every trial at plus or minus 0.75 bit (C-5 run 3).
      - id: DR-H1-TAIL
        function: h1_tail
        false_fire_under_null: >-
          TAIL_FAIL in 0 of 20000 under the permutation law, upper bound 0.00019;
          TAIL_PASS 20000 (C-5 run 3).
      - id: DR-H2
        function: h2_outcome
        false_fire_under_null: >-
          FALSIFIED in 0 of 20000 at each of log2 kappa = 0, 7.65 and 15.30 under
          H-DL-2 exact, upper bound 0.00019; VALIDATED 20000 at each. Power:
          FALSIFIED in 5000 of 5000 at a slope error of plus or minus 0.6;
          INCONCLUSIVE at plus or minus 0.3 (C-5 run 3).
    reachability: >-
      C-6 (dry call, audit sheet) feeds every declared (cell, arm, lane) name of
      the grid and planted cases reaching every declared outcome of every arm;
      its REACH lines show no missing outcome. C-5 shows the FALSIFIED outcomes
      of DR-H1 and DR-H2 are reached from generative alternatives (power lines).
    degeneracy_audit: >-
      C-7 prints a degeneracy verdict for every declared (toy cell, arm, lane)
      from parameter arithmetic only (DG-2 g = 1 uninformative, DG-3 Weil bound
      below l', AR-2 finite-q admission); every declared toy lane passed.

  success_criterion: >-
    The experiment is complete and valid when ARM-S0 is PASS, ARM-C1 has a
    non-INVALID outcome on at least four of the seven ARM-C1 cells including at
    least one of each of d = 2, 4 and 8, ARM-H1 has a non-INVALID outcome on all
    three lanes, ARM-H2 has an outcome other than INVALID_INSUFFICIENT, and
    ARM-COST has been rerun under its substitution rule. Scientific readings,
    fixed now: (C1') is CONSISTENT AT TOY SCALE if every non-INVALID ARM-C1-NEG
    lane is CONSISTENT; H-DL-1 is VALIDATED AT TOY SCALE if ARM-H1 is VALIDATED on
    all three lanes; H-DL-2 is VALIDATED AT TOY SCALE if ARM-H2 is VALIDATED. None
    of these readings is a statement about any deployed row; the cost table they
    feed stays conditional on TA-1 to TA-3.
  falsification_criterion: >-
    (C1') is REFUTED AT TOY SCALE by any ARM-C1-NEG REFUTED. H-DL-1 is FALSIFIED by
    any ARM-H1 FALSIFIED. H-DL-2 is FALSIFIED by ARM-H2 FALSIFIED. Any outcome
    INVALID, INVALID_NULL, NOT_ADMITTED or INCONCLUSIVE is not evidence in either
    direction; a timeout, crash or implementation failure is infrastructure.
  hypothesis_mapping: >-
    For the composer of the eventual evidence review, fixed before any run:
    support for H-BINSTD-0dd2ce at toy scale needs (C1') CONSISTENT, H-DL-1 and
    H-DL-2 VALIDATED, ARM-S0 PASS; any REFUTED or FALSIFIED weakens the part it
    names and only that part; OB-1 remains open whatever the arms return, so
    (C1')'s deployed form never moves past conditional on this experiment alone.

  # ---------------------------------------------------------------------------
  cost_model:
    name: MM-1
    unit_time: >-
      Bit operations. An F_(2^w) multiplication costs w^2 (schoolbook); a Z/l
      multiplication costs (log2 l)^2; additions are uncharged except in the LA
      matrix-vector product, where each entry costs log2 l.
    unit_memory: bits
    machine: >-
      P processors (reference P_REF = 2^20) sharing one memory; wall time in
      bit-operation ticks; full cost FC = (P + memory_bits / RHO_AREA) x wall
      time per phase, summed over phases, with RHO_AREA = 2^16 bits per
      processor-equivalent (the 1996 van Oorschot-Wiener machine-design price
      ratio, KN-LIT-73f7e1, about 2^15.9). The same model prices both arms.
    rho_arm: >-
      Iterations W = sqrt(pi l / (4k)) (CORR-20260922-81aeab); per-iteration cost
      10 N^2 bit operations (RHO_MULTS_PER_ITER = 10 F_(2^N) multiplications,
      flagged as a model choice); distinguished points numbering P x 2^10 at
      3 log2 l bits each (KN-LIT-73f7e1 upper-bound accounting); wall time
      (W/P + 1/theta) x t_iter with theta set so the table holds P x 2^10 points.
    ic_arm: >-
      Per small-genus lane (g / log2 q <= 1): relation collection kappa
      q^(2 - 2/g) trials of g^2 (1 + log2 q) F_q multiplications each (TRIAL_COEF
      = 1, flagged optimistic); factor base D = q^(1 - 1/g); sparse linear algebra
      by Wiedemann, D^2 (3 w log2 l + 7 (log2 l)^2) bit operations with row
      weight w = 2g (LA_WEIGHT_FACTOR, replaced by the measured weight under
      ARM-COST's rule), memory D (w (log2 D + 1) + 4 log2 l) bits, parallel over
      at most P_LA_MAX = 2^10 nodes with communication uncharged (flagged
      optimistic); relation memory 4 D (g + 2)(log2 q + 1) bits; individual
      descent g! q trials (factor base q^(1 - 1/g), smoothness q^(-1)/g!);
      target map 2 n g^2 F_(2^N) multiplications (unsourced model term,
      flagged). Large-genus lanes (ratio above 1) carry no cost row.
    regime_ratio: g / log2 q, printed for every lane; the small-genus law is applied only at ratio <= 1
    optimistic_assumptions:
      - Polylogarithmic factors of the reported O~(q^(2-2/g)) law set to 1 (favours the IC arm).
      - TRIAL_COEF = 1 F_q multiplication per g^2 (1 + log2 q) (favours the IC arm).
      - LA communication between nodes uncharged (favours the IC arm).
      - Schoolbook squares for every multiplication on both arms (raises both; the large-field rho arm more).
      - Descent-map cost unsourced (2 n g^2 F_(2^N) multiplications).
      - TA-2, kappa constant in q (favours the IC arm if kappa grows).
    overestimating_factors:
      - The rho arm's 10 F_(2^N) multiplications per iteration with schoolbook squares (Karatsuba or hardware would lower it).
      - The 3 log2 l bits per distinguished point (an upper bound per KN-LIT-73f7e1).
    parallelism: >-
      Rho parallelises linearly with P (VOW); relation collection and descent
      linearly with P; linear algebra with at most P_LA_MAX nodes.
    time_memory_tradeoff: >-
      Rho trades distinguished-point density against table size (VOW eq. (5) as
      restated in KN-LIT-73f7e1); the IC arm trades factor-base size against
      relation-collection time through q^(1-1/g), and its LA memory is
      not tradeable below D w log2 D bits. The cost table prints a sensitivity
      grid over P and RHO_AREA on the OPEN_N4 lanes.
    o1_and_polylog_disclosure: >-
      The reported law hides polylogarithmic factors (set to 1 here) and the
      Wiedemann and descent terms carry model constants; the large-genus regime
      (Enge-Gaudry L(1/2) law, recalled) hides an o(1) in its exponent and is not
      used at all.
    affected_vs_safe_scope: >-
      Scope statement, asserting no verdict. Affected by this contract's
      figures: the five composite-degree ANSI X9.62 parameter sets, as
      conditional cost rows on their n = 2 and n = 4 lanes and as
      STRUCTURALLY_EMPTY_COND_OB1 cells on c dividing 16. Outside its scope:
      every prime-degree binary curve (FIPS, SECG and c2tnb rows, lattice
      {1, N}), the n = 8 and n = 16 lanes (OPEN), every isogenous curve and every
      cover outside the GHS/Hess Artin-Schreier construction. Neither list says
      that any parameter set is secure or insecure.
    concrete_cost_design_figure: >-
      The audit sheet's C-4 output (sha256 recorded there) is the design-time
      table at the stated kappa range, embedded verbatim and labelled a design
      figure. ARM-COST replaces it at execution under the substitution rule above.

  # ---------------------------------------------------------------------------
  budget:
    enforcement: advisory
    policy: docs/research-budget-policy.md (estimates advisory; machine protection binds)
    wall_clock_seconds_per_run:
      S0: 900
      C1: 14400
      H1: 172800
      H2: 172800
      COST: 120
    total_cpu_hours: null
    total_cpu_hours_note: Advisory and not estimated; CPU is measured per run for the report.
    maximum_memory_gb: 16
    maximum_runs: 21
    maximum_runs_note: >-
      One run per name in replication.run_names. An infrastructure retry after a
