# review-breakthrough at max, tripwire T2). Zero runs in this batch.
#
# OUTCOME DISCIPLINE (TH-1, DH-11). No success criterion, prediction or outcome
# of this contract is a statement that any deployed or standardized row sits
# below its matched rho, or that any curve is broken, weakened or safe. Every
