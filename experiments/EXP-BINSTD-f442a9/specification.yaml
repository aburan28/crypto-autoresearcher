  required_artifacts:
    - per run, the manifest (exact command, git commit and dirty state, environment and versions, seeds, requested policy, resolved model, fallback and degraded fields, timestamps, peak_rss_bytes, wall-clock)
    - per run, stdout and stderr verbatim
    - per run, raw machine-readable results (JSON) including every count the decision rule reads
    - the extracted code blocks with their sha256 matching the audit sheet, and the executor's own implementation files with sha256
    - ARM-S0 rerun output and its sha256 comparison
    - ARM-C1 per-sample records (seed, point, image in Mumford form) for every declared lane
    - ARM-H1 per-curve counts, histogram and 2-smooth count; the null curve's equation
    - ARM-H2 per-replicate trials, F_q multiplications, matrix row weight and peak memory
    - the ARM-COST table and the ARM-CELL verdict table, each labelled conditional
    - the decision-rule outcomes with the inputs they read, produced by decision_rules exactly as frozen

  assigned_to: executor
  inference_for_execution:
    policy: executor-implementation
    fallback_allowed: true
    degraded_allowed: false

  interpretation_limits:
    - Zero runs exist. Every number in the audit sheet is a design figure.
    - >-
      Toy-scale outcomes are statements about the toy cells only. Their bearing
      on the deployed rows is through TA-1 to TA-3 and OB-1, stated, never
      assumed silently.
    - No outcome of any arm is a statement about any curve's security, and no figure of the cost table is a verdict (TH-1).
    - >-
      The toy cells have A = 0, so condition (7) holds on every toy lane; the
      deployed collapsed cells with Tr(A) = 1 (OB-2 cells, listed by C-3) are not
      directly covered by ARM-C1.
    - Covers outside the GHS/Hess Artin-Schreier construction are out of scope.

