# EXP-ECDLP-bfbe6f
# Stage-0 Semaev S_3 worksheet for H-ECDLP-cba67a.
# Frozen before the official run.
experiment:
  id: EXP-ECDLP-bfbe6f
  hypothesis_id: H-ECDLP-cba67a
  source_idea: IDEA-20261006-06fe5e
  question_id: RQ-ECDLP-001
  goal_id: GOAL-ECDLP-001
  version: 1
  title: >-
    Twelve S_3 residues on y^2 = x^3 + x + 2 over F_41
  status: approved
  frozen: true
  designed_at: '2026-10-12'
  approved_by: coordinator
  approval_decision_id: DEC-20261012-85abf0
  execution_authorized: true
  objective: >-
    On E: y^2 = x^3 + x + 2 over F_41, evaluate the KN-TECH-002
    polynomial S_3 at the six chord sums of (0, 17), (1, 2), (3, 14),
    and (5, 3), and again at third coordinate 7. The positive reading
    is six zeros on the true sums and the six residues 13, 33, 35, 11,
    28, 38 in pair order. This is not a discrete logarithm.
  inputs:
    prime: 41
    curve: "y^2 = x^3 + x + 2"
    points: [[0, 17], [1, 2], [3, 14], [5, 3]]
    pairs: [[0, 1], [0, 3], [0, 5], [1, 3], [1, 5], [3, 5]]
    third_coordinate: 7
    expected_at_seven: [13, 33, 35, 11, 28, 38]
    named_future_run_slot: RUN-ECDLP-8f5190
  controls:
    - >-
      Each of the four points satisfies the curve equation in expanded
      form and in Horner form. The discriminant 4*a^3 + 27*b^2 is
      nonzero modulo 41.
    - >-
      Each of the twelve triples is evaluated by a per-operation
      reduction and by a delayed Horner form. Disagreement voids the cell.
    - >-
      S_3(x, x, 7) for each planted x is recorded and is not an input
      to the success test.
  independent_variables:
    - the unordered pair among the four planted x-coordinates
  metrics:
    primary:
      - matrix_holds
      - beyond_matrix
    secondary:
      - planted_ok
      - true_sum_nonzero_count
  heuristic_under_test: >-
    IDEA-20261006-06fe5e: the six true sums vanish, and the six values
    at third coordinate 7 are the listed residues.
  preregistered_prediction:
    quantity: >-
      true_sum_nonzero_count is 0 and the six values at third
      coordinate 7 equal 13, 33, 35, 11, 28, 38 in pair order.
    formula: >-
      The positive reading is that exact match. The negative reading
      is a nonzero true sum or any other residue, on a valid manifest.
    source: >-
      IDEA-20261006-06fe5e states both the six zeros and the six
      residues. That pair was fixed before this driver was executed.
  scale_relevance:
    tier: toy
    justification: >-
      One 41-element field and twelve polynomial evaluations. No
      factor base and no cryptographic prime are in this contract.
    correspondence: null
  tail_checks:
    - A point off the curve invalidates the cell.
    - An implementation disagreement invalidates the cell.
  replication:
    seeds: []
    independent_instances: 1
    named_future_run_slot: RUN-ECDLP-8f5190
    replication_note: >-
      One deterministic pass. No seed is drawn.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 60
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one valid manifest for RUN-ECDLP-8f5190.
    - Do not add a pair, a second curve, or a factor base.
    - A missed matrix is the recorded result. Do not change the residues.
  invalidation_rules:
    - A planted point fails the curve equation, or the two evaluations disagree.
    - A chord sum is the point at infinity.
    - A timeout, crash, or missing value.
  success_criterion: >-
    The manifest is valid, planted_ok is true, every true-sum value is
    0, and the six values at third coordinate 7 are 13, 33, 35, 11, 28,
    and 38 in pair order.
  falsification_criterion: >-
    The manifest is valid, planted_ok is true, and either some true-sum
    value is nonzero or some value at third coordinate 7 differs from
    that list.
  decision_impact:
    on_positive: >-
      Record that this one curve matches the twelve pre-registered
      residues. Do not treat that as an index-calculus speedup.
    on_negative: >-
      Record that the worksheet missed the pre-registered residues.
      Do not replace the list and do not charge a decomposition cost.
  required_artifacts:
    - experiments/EXP-ECDLP-bfbe6f/runs/RUN-ECDLP-8f5190/manifest.yaml
    - experiments/EXP-ECDLP-bfbe6f/runs/RUN-ECDLP-8f5190/raw-result.json
  assigned_to: executor
  launcher:
    trial_plan: experiments/EXP-ECDLP-bfbe6f/trial-plan.json
    driver: experiments/EXP-ECDLP-bfbe6f/implementation/run.py
    checker: experiments/EXP-ECDLP-bfbe6f/implementation/check.py
  out_of_scope:
    - S_4, a factor base, and any prime other than 41.
    - A discrete logarithm, Pollard rho, and a security level.
