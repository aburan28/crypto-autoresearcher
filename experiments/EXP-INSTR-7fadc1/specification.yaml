experiment:
  id: EXP-INSTR-7fadc1
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-c015f5
  question_id: RQ-INSTR-f8faa0
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'A DECAY-PARAMETER TABLE FOR ALL FOURTEEN LANES, ANCHORED BY A CLOSED-FORM NULL FOR THE ONE
    DECAY TEST THE CAMPAIGN HAS ALREADY RUN: the windowed liftable-count within-class variance should
    be W(1 - W/p)/4, a pinned-character-sum (Brownian-bridge) law with no free parameter, and the
    committed run''s own six windows match it to within 7.7 percent while the run''s printed verdict
    says "NOT explained by the trace identity -- investigate" because its pass criterion demands zero
    variance where the archived derivation predicts Var(z)/4'
  status: draft
  objective: "(A) THE CAMPAIGN HAS EXACTLY ONE DECAY TEST AND ITS PASS CRITERION CONTRADICTS ITS OWN\
    \ DERIVATION. harness/run_icinv.py::window_decay sweeps the window W and reports the mean within-class\
    \ variance of the liftable-x count. The verdict line reads: decay_verdict = \"consistent with\
    \ the trace identity ...\" if full[\"mean_within_class_count_variance\"] < 1e-9, else \"NOT explained\
    \ by the trace identity -- investigate\". But the identity the same run VERIFIES on every row\
    \ (harness/exp_icinv.py::liftable_count_identity, _liftable_identity_holds: identity_verified)\
    \ is\n  #{x in F_p : x^3+ax+b is a square} = (#E(F_p) - 1 + z)/2,  z = #2-torsion x's.\nWithin\
    \ a class #E is constant, so the identity predicts within-class variance EXACTLY Var(z)/4 -- not\
    \ zero. Zero would require z to be class-invariant, which the same module's two_torsion_x_count\
    \ docstring explicitly denies.\n(B) THE ARITHMETIC, FROM THE COMMITTED RUN, EXACT TO 13 SIGNIFICANT\
    \ FIGURES. RUN-ICINV-p4001-a (EXP-ICINV-180a0d, commit e34afdd0c3137c038042cae7c68495c700977afd)\
    \ records, in raw-result.json, Var(two_torsion_x) = 1.0053951126626468 for the classes of trace\
    \ 30 and -30 (n = 138 each) and 0.9896907216494846 for the classes of trace 18 and -18 (n = 98\
    \ each). The mean over the four classes of Var(z)/4 is\n  (1.0053951126626468 + 0.9896907216494846)\
    \ / 8 = 0.24938572928901642,\nagainst the reported\n  full_field_liftable_within_class_count_variance\
    \ = 0.24938572928898783.\nThe two agree to 2.9e-14. The quantity the run flags as \"NOT explained\"\
    \ is explained, exactly, by the derivation the run itself verified. The verdict is a threshold\
    \ mis-specification, not a finding, and it currently stands in the campaign's gating-lane run\
    \ record.\n(C) THE MISSING PIECE: THE SIGNAL DOES NOT DECAY, BUT THE STATISTIC BEING WATCHED CANNOT\
    \ DECAY. The same block reports permutation_p_value = 0.0 at five of six windows (W = 125, 500,\
    \ 1000, 2000, 4001) and 0.003 at W = 250. A p-value of 0.0 from 1000 permutations is not a valid\
    \ estimate, and more importantly the p-value is FLAT while the effect size collapses: observed/null\
    \ within-variance ratio is 0.9566, 0.9631, 0.9456, 0.9441, 0.8574, 0.0015 across W = 125, 250,\
    \ 500, 1000, 2000, 4001. A three-order-of-magnitude collapse in the effect size is invisible in\
    \ the reported significance. Under docs/inventor-protocol.md section 3 the decay test must watch\
    \ the quantity that is supposed to decay; watching a p-value that saturates at the resolution\
    \ floor is the canonical way to make an artifact look stable.\n(D) THE CLOSED-FORM NULL THIS PROPOSES,\
    \ WITH NO FREE PARAMETER. Write S_W = sum_{x < W} chi(x^3+ax+b). Then the liftable count in [0,W)\
    \ is (W + S_W)/2 up to the 2-torsion correction. Over the FULL field S_p = -t EXACTLY, so S_W\
    \ is a partial sum pinned at both ends: a discrete bridge. Model the chi values as a fair +-1\
    \ walk conditioned on its endpoint, giving\n  Var(S_W) = W(1 - W/p)   and hence   Var(liftable\
    \ count in [0,W)) = W(1-W/p)/4,\nwith the residual at W = p being exactly the 2-torsion term Var(z)/4.\
    \ THIS MODEL HAS NO FITTED PARAMETER. Against RUN-ICINV-p4001-a's six windows -- and this comparison\
    \ is POST-HOC and is labelled so, since I computed it after reading the committed numbers:\n \
    \ W = 125:  predicted 30.2737, measured 30.0435, ratio 0.9924\n  W = 250:  predicted 58.5947,\
    \ measured 63.0785, ratio 1.0765\n  W = 500:  predicted 109.3789, measured 110.1848, ratio 1.0074\n\
    \  W = 1000: predicted 187.5156, measured 196.3660, ratio 1.0472\n  W = 2000: predicted 250.0625,\
    \ measured 242.6782, ratio 0.9705\n  W = 4001: predicted 0 plus Var(z)/4 = 0.2493857, measured\
    \ 0.2493857\nFive windows within 7.7 percent from a parameter-free model, and the sixth exact.\
    \ If this holds prospectively at other p and other classes, the campaign's most significant reported\
    \ signal (liftable_density, permutation p = 0.0005) is fully accounted for by a character-sum\
    \ fluctuation and a 2-torsion count, both computable in negligible time from the curve equation,\
    \ and it carries no ECDLP attack content of any kind. That is a clean, citable negative with a\
    \ named mechanism, which is exactly the deliverable analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md\
    \ section 5 item 5 predicts the campaign is most likely to produce.\n(E) THE GENERAL DELIVERABLE:\
    \ ONE DECAY PARAMETER PER LANE, DECLARED BEFORE MEASUREMENT, WITH THE MEANING OF NON-DECAY STATED\
    \ IN ADVANCE.\n  L1  isogeny-class invariance. PARAMETER: the isogeny-walk length r from a base\n\
    \      curve. Under T5's GRH-conditional rapid mixing, the correlation between\n      C(E) and\
    \ C(E_r) must decay toward the class mean as r grows past the\n      mixing time. NON-DECAY MEANS:\
    \ either C is class-constant (zero variance,\n      so nothing to decay -- distinguishable because\
    \ the variance itself is\n      zero) or the walk is not mixing (a walk-implementation fault).\
    \ Secondary\n      parameter: the permutation blocking depth of IDEA-20260807-34754f.\n  L2  volcano\
    \ level. PARAMETER: ell taken outside the set of primes dividing the\n      conductor f. For such\
    \ ell the volcano is flat, every curve is at the\n      crater, and the level stratification is\
    \ degenerate. NON-DECAY MEANS: the\n      measured \"level effect\" is not a level effect, since\
    \ there are no levels.\n      This is a free and decisive control.\n  L3  j-invariant and CM discriminant.\
    \ PARAMETER: |D_0|. Past |D_0| = 4 the\n      automorphism group is {+-1} and the rho discount\
    \ is exactly sqrt(2)\n      (KN-TECH-018). NON-DECAY MEANS: a claimed CM effect that persists\
    \ at large\n      |D_0| is not CM structure; it is something correlated with the sampling of\n\
    \      discriminants and must be named.\n  L4  phi-equivariant relation collection. PARAMETER:\
    \ the orbit-closure\n      convention -- progressively remove the appended phi-shifted rows. This\
    \ is\n      not a new idea: DEC-20260727-009 rationale R2 measured exactly this\n      one-variable\
    \ comparison and found the factor base moved the metric by\n      0, 0, 2, 1 while the appended\
    \ rows moved it by order B. NON-DECAY MEANS\n      the effect is in the factor base rather than\
    \ the closure convention, which\n      would be the interesting direction. This record proposes\
    \ only the decay\n      instrument and asserts nothing about H-STR-002 in either direction; the\n\
    \      instrument question there is UNADJUDICATED per DEC-20260727-009 and stays\n      so.\n\
    \  L5  phi-equivariant linear algebra. PARAMETER: the fraction of rows randomly\n      permuted\
    \ before the displacement rank is measured. NON-DECAY MEANS the\n      quantity is a row-order-independent\
    \ algebraic invariant; FULL DECAY at a\n      small permuted fraction means it is an emission-order\
    \ bookkeeping\n      quantity. Both readings are named here in advance and NEITHER is asserted,\n\
    \      per DEC-20260727-009's instrument_question_disposition, which forbids any\n      downstream\
    \ record calling phi_alpha an artifact or calling it validated.\n  L6  endomorphism-accelerated\
    \ walks. PARAMETER: |Aut(E)|. On |Aut| = 2 curves\n      the measured speedup over negation-only\
    \ rho must be exactly 1. NON-DECAY\n      MEANS an accounting error, since no endomorphism speedup\
    \ can exist where\n      there is no endomorphism.\n  L7  ell-torsion correlated with k. PARAMETER:\
    \ k resampled with the curve\n      fixed. Any curve-only statistic's correlation with k must\
    \ vanish under\n      resampling. NON-DECAY MEANS k has leaked into the statistic's computation.\n\
    \  L8  pairings. PARAMETER: the embedding degree k_emb. Transfer cost must grow\n      with k_emb.\
    \ NON-DECAY MEANS the cost model is not charging the extension\n      field.\n  L9  canonical\
    \ lifts. PARAMETER: p-adic precision. Lifted-point height must\n      grow toward the Jacobson-Koblitz-Silverman-Stein-Teske\
    \ regime. NON-DECAY\n      (a height that stops growing) MEANS the lift has collapsed onto a\n\
    \      degenerate or torsion solution, which is an implementation outcome.\n  L10 class-group\
    \ action. PARAMETER: h(O). Any claimed reduction's cost must\n      scale with h. NON-DECAY MEANS\
    \ the reduction is not solving vectorization\n      and the quantifier order should be re-examined.\n\
    \  L11 curve models. PARAMETER: whether the factor base is defined invariantly or\n      by a\
    \ model-specific x-coordinate rule. A model effect that survives an\n      invariantly defined\
    \ factor base is a genuine model effect; one that\n      vanishes was a reindexing. This is the\
    \ same test as\n      IDEA-20260807-efc8de's Family 2, applied at the model level.\n  L12 the\
    \ GGM boundary. NO DECAY PARAMETER EXISTS AND THAT IS RECORDED RATHER\n      THAN OMITTED: the\
    \ lane's output is a simulator or a proof that none\n      exists, both of which are discrete\
    \ and neither of which is a measured\n      signal. Its control is a nearby-object control, not\
    \ a decay test.\n  L13 multi-target preprocessing. PARAMETER: the transport degree d. A\n    \
    \  preprocessing table's residual value on the transported curve must decay\n      with d. NON-DECAY\
    \ MEANS either a genuinely degree-independent transfer --\n      which would be a real result\
    \ and routes straight into T1's cost model --\n      or that the measured \"value\" is not specific\
    \ to the table, which the\n      shuffled-table null distinguishes.\n  L14 this lane. PARAMETER:\
    \ the number of planted-signal families a null\n      survives. See IDEA-20260807-efc8de."
  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: No oracle, no attack, no resource. The record instruments every other lane's
    signals; the closed-form null of (D) is a statement about a character sum, which is R1-flavoured
    data but is consumed here as a NULL rather than as an attack ingredient. Neither KN-FIND-b7e091
    nor H-ENDO-001 applies, since nothing here proposes an algorithm on G.
  reachability_gate: REQUIRED FOR ONE ROW AND ANSWERED THERE. L1's decay parameter is the isogeny-walk
    length r, which does move between curves. At toy p the walk is cheap -- each step is a Velu isogeny
    of small degree plus a certificate (IDEA-20260807-257001) -- and a RANDOM neighbour is what the
    decay test needs, which is exactly the cheap side of T5. No specified curve is targeted anywhere,
    so the vectorization side of T5 is never invoked. The rest of the table involves no movement between
    curves at all.
  inputs:
    procedure: 'STAGE 0 (zero compute, and it is the cheapest discriminator in the entire lane): recompute
      (1.0053951126626468 + 0.9896907216494846)/8 and compare with 0.24938572928898783. Agreement
      to 12 significant figures settles claim (B) with no execution whatsoever. Disagreement supersedes
      this record. STAGE 1 (minutes): repair the pass criterion; re-run the frozen slice; confirm
      the verdict flips. STAGE 2 (an hour): the matched random-bridge null at p = 4001, same class
      sizes, same windows. STAGE 3 (hours): the prospective test at three new p and four new classes
      each. STAGE 4 (zero compute): write the fourteen-row table; propose the decay_parameter contract
      field to the Coordinator. STAGE 5 (minutes): the negative controls -- the group order N and
      a coefficient hash -- through the identical apparatus.'
    mechanism: 'STEP 1 -- FIX THE COMMITTED DECAY VERDICT. Change the pass criterion from variance
      < 1e-9 to |measured - Var(z)/4| < tol, with tol declared. Re-run the frozen slice; the verdict
      must flip to "consistent". Record the flip as a correction to the instrument, not as new evidence
      about isogeny classes.

      STEP 2 -- PRE-REGISTER THE BRIDGE LAW AND TEST IT PROSPECTIVELY. The post-hoc match in (D) is
      not evidence. Declare Var(count in [0,W)) = W(1-W/p)/4 + [W = p] Var(z)/4 in the contract, with
      a tolerance of 10 percent, and test it at NEW p (at least three values) and NEW classes not
      used in RUN-ICINV-p4001-a. Report the ratio measured/predicted per (p, class, W).

      STEP 3 -- REPLACE THE WATCHED STATISTIC EVERYWHERE. Every decay table reports the EFFECT SIZE
      (observed/null variance ratio, or observed/predicted for a closed-form null) as the primary
      column and the p-value as secondary, with the p-value''s resolution floor 1/(B+1) printed beside
      it so a floored value cannot be read as strong.

      STEP 4 -- WRITE THE FOURTEEN-ROW TABLE AND MAKE IT A CONTRACT FIELD. Each lane''s experiment
      contract gains a required decay_parameter block: the parameter, the argument that increasing
      it destroys the structure, the predicted decay law where one exists, the tolerance, and the
      pre-declared meaning of non-decay. A lane contract without it is not approvable. This is the
      enforcement mechanism that makes the table binding rather than advisory.

      STEP 5 -- THE NEGATIVE CONTROL FOR THE DECAY TEST ITSELF. Apply the whole apparatus to a quantity
      KNOWN to be class-invariant with certainty: the group order N. Its within-class variance is
      identically zero at every value of every parameter, so its decay curve is flat at zero. A decay
      test that reports a nonzero slope for N is broken.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - matched random-bridge null (i.i.d. signs pinned to -t)
  - the group order N, which must give a flat-at-zero decay curve
  - a hash of (a,b), which must give a flat-at-null decay curve
  - the p-value floor 1/(B+1) printed beside every p-value
  - the frozen RUN-ICINV-p4001-a slice, reproduced before anything new is run
  - 'NULL OBJECT (from the proposal): MANDATORY, and here it is layered. NULL FOR THE BRIDGE LAW:
    a matched random FUNCTION null. Replace chi(f(x)) by an i.i.d. fair +-1 sequence conditioned to
    sum to -t, and measure the same windowed variance. If the curve data matches the random-bridge
    null within tolerance, then the windowed liftable count carries no curve-specific information
    beyond (N, z) and the campaign must say so. If it deviates systematically, the deviation is the
    residual worth naming and is bounded by Weil. NULL FOR THE DECAY APPARATUS: the group order N,
    which is exactly class-constant, giving a flat-at-zero decay curve; and a quantity known to be
    pure noise (a hash of the curve coefficients), giving a flat-at-null curve. The apparatus must
    produce the correct flat line for both. DECAY PARAMETER OF THE DECAY TEST: the number of permutation
    draws B and the tolerance tol. As B grows the p-value floor 1/(B+1) must fall and any conclusion
    that flips when it does was resting on the floor.'
  independent_variables: []
  metrics:
    primary:
    - measured and predicted within-class variance per (p, class, W), with ratio
    - Var(z) per class and the derived Var(z)/4
    - observed/null effect-size ratio and permutation p-value per cell, with floor
    - the repaired decay_verdict on the frozen slice
    secondary:
    - the fourteen-row table, with the meaning of non-decay per lane
  heuristic_under_test: null
  preregistered_prediction:
    quantity: measured within-class variance of the windowed liftable count divided by W(1-W/p)/4,
      at three new p and at least four classes each
    formula: 'Ratio in [0.9, 1.1] at every cell with W <= p/2. Pre-registered failure: any cell outside
      [0.75, 1.33] falsifies Heuristic D1 at that p and the record is superseded rather than amended.
      The post-hoc ratios from RUN-ICINV-p4001-a -- 0.9924, 1.0765, 1.0074, 1.0472, 0.9705 -- are
      the reason for the 10 percent tolerance and are NOT counted as confirming evidence.'
    source: pre-registered in IDEA-20260807-c015f5 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - THE BRIDGE MODEL IGNORES WEIL CORRELATION. chi values along a cubic are not independent; Weil
    bounds the deviation but does not give the distribution. The matched random-bridge null is what
    quantifies the residual, and any systematic excess is the residual worth naming.
  - WINDOW ENDPOINT EFFECTS. The window starts at 0, which is not a random point; x = 0 and small
    x are special (f(0) = b). Rotating the window start is a cheap robustness check and must be run.
  - SMALL z SUPPORT. z takes values in {0, 1, 3}, so Var(z) is estimated from a three-point distribution
    and is noisy at small class sizes. Report Var(z) with its own standard error.
  - THE p-VALUE FLOOR. At B = 1000, five of six committed cells report exactly 0.0. Any decay conclusion
    drawn from p-values alone at this B is drawn from the floor.
  - MIXING TIME IS UNMEASURED FOR L1's WALK PARAMETER. T5's rapid mixing is GRH-conditional and cited,
    not proved, in DECOMPOSITION.md. L1's decay parameter therefore needs an empirically measured
    mixing time at toy p before "r past the mixing time" means anything, and that measurement is part
    of L1's contract, not an assumption this record may make.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'Ratio in [0.9, 1.1] at every cell with W <= p/2. Pre-registered failure: any
    cell outside [0.75, 1.33] falsifies Heuristic D1 at that p and the record is superseded rather
    than amended. The post-hoc ratios from RUN-ICINV-p4001-a -- 0.9924, 1.0765, 1.0074, 1.0472, 0.9705
    -- are the reason for the 10 percent tolerance and are NOT counted as confirming evidence.'
  falsification_criterion:
  - Stage 0's arithmetic does not agree to 12 significant figures. Claim (B) is withdrawn and the
    "NOT explained" verdict stands as a genuine open question.
  - The prospective bridge-law test puts any cell outside [0.75, 1.33] at W <= p/2. Heuristic D1 is
    falsified at that p; the closed-form null is withdrawn and the campaign returns to a permutation
    null for this functional.
  - The repaired verdict does not flip on the frozen slice. The diagnosis is wrong.
  - The group-order negative control produces a nonzero decay slope. The apparatus is broken and nothing
    from it is reported.
  - The matched random-bridge null differs materially from the curve data. Then the liftable density
    DOES carry curve-specific information beyond (N, z), which would be the interesting outcome and
    would move the campaign's centre of gravity to characterising it.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-c015f5
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
