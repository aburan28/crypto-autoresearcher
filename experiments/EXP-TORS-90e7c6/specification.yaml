experiment:
  id: EXP-TORS-90e7c6
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-df906f
  question_id: RQ-TORS-8c7b79
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'PRIME-ORDER CONGRUENCE RIGIDITY, AND THE ONE MEASUREMENT IT LEAVES OPEN: on a group of prime
    order every EXACTLY propagating projection is injective or constant, so no lossy tracked object
    exists there at all -- which forces every surviving L7 candidate into the probabilistic regime,
    and the cheapest probe of that regime is the propagation defect of the small-prime division-polynomial
    residue vector v(R) = (psi_ell(x(R)))_{ell <= 13}, a genuinely point-dependent, publicly computable,
    non-homomorphic torsion statistic'
  status: draft
  objective: "(A) THE RIGIDITY THEOREM, WHICH IS THE ECDLP-SPECIFIC FORM OF THE LOSSY-PROJECTION TEST.\
    \ Let G be a group of prime order N. Let S be any set and v: G -> S any map. Suppose v PROPAGATES,\
    \ i.e. there exists F: S x S -> S with v(R + R') = F(v(R), v(R')) for all R, R' in G. Then v is\
    \ injective or constant. PROOF: suppose v(R) = v(R') with R != R'. For every S' in G, v(R + S')\
    \ = F(v(R), v(S')) = F(v(R'), v(S')) = v(R' + S'). Writing T = R + S' and D = R' - R != O this\
    \ says v(T) = v(T + D) for all T in G. Since N is prime and D != O, D generates G, so v is invariant\
    \ under translation by every element of G, hence constant. QED. No hypothesis on S or F is used\
    \ -- F need not be associative, computable, or well-behaved.\n(B) WHY THIS IS THE LANE'S -- AND\
    \ ARGUABLY THE PROGRAM'S -- CENTRAL STRUCTURAL FACT. docs/inventor-protocol.md section 2 demands\
    \ that a tracked object be a genuinely LOSSY projection whose discarded part is discarded COMPATIBLY\
    \ with the target's operations, so the retained part still propagates deterministically. Theorem\
    \ (A) says that on a prime-order group those two requirements are jointly unsatisfiable: compatible-with-the-operation\
    \ forces non-lossy or total loss. That is a direct, elementary partial answer to KN-OPEN-019 (\"\
    what object does each ECDLP attack family track, and is the enumeration closed?\"): it explains\
    \ why the symmetric-side taxonomy does not port. Differential, linear, integral and division-property\
    \ objects are all exact lossy projections that survive one round; on a prime-order subgroup no\
    \ such object exists. The enumeration is not closed by this -- it is REDIRECTED, which is the\
    \ closure standard of docs/inventor-protocol.md section 4.\n(C) THE FOUR ESCAPES THE THEOREM EXPLICITLY\
    \ LEAVES OPEN, STATED BEFORE ANY MEASUREMENT SO THAT THE MEASUREMENT CANNOT BE TUNED TO THEM.\n\
    \  E1 -- PROBABILISTIC PROPAGATION. v(R+R') is determined by (v(R), v(R')) only\n    with probability\
    \ q over R, R'. The theorem forces q < 1 for any lossy v,\n    but says NOTHING about how far\
    \ below 1. Symmetric-key cryptanalysis lives\n    entirely at q < 1. THIS IS THE ESCAPE THIS PROPOSAL\
    \ MEASURES.\n  E2 -- AUXILIARY STATE. v propagates only when supplemented by extra data\n    a(R);\
    \ then the real object is (v, a) and the question is whether (v, a) is\n    still lossy. The elliptic-net\
    \ construction (KN-TECH-009, Stange\n    KN-LIT-018) is exactly this pattern and is the named\
    \ prior art.\n  E3 -- OBJECTS NOT ON G. E[ell] is (Z/ell)^2, NOT of prime order: it has\n    ell+1\
    \ proper non-trivial subgroups and therefore genuine lossy quotients.\n    Those quotients are\
    \ precisely the ell-isogenies. The theorem thus predicts\n    that L7's only real objects live\
    \ on E[ell] rather than on G, which is why\n    IDEA-20260807-053a55 and IDEA-20260807-1d9c5f\
    \ are separate proposals and\n    why they are curve-level.\n  E4 -- OBJECTS NOT TRACKED UNDER\
    \ THE GROUP LAW. Pollard rho tracks a\n    collision in a walk, which is not a congruence; the\
    \ theorem does not touch\n    it. This is consistent with rho being the incumbent.\n\n(D) THE\
    \ POINT-DEPENDENT, PUBLICLY COMPUTABLE TORSION DATA, NAMED EXPLICITLY AS THE LANE DEMANDS. For\
    \ odd primes ell, the ell-th division polynomial psi_ell(x) in F_p[x] has degree (ell^2 - 1)/2\
    \ -- 4, 12, 24, 60, 84 for ell = 3, 5, 7, 11, 13 -- and its roots are exactly the x-coordinates\
    \ of the non-zero ell-torsion points of E over F_pbar. Define, for a point R != O,\n  v_L(R) =\
    \ ( psi_ell(x(R)) )_{ell in L},  L = {3, 5, 7, 11, 13}.\nHOW IT IS OBTAINED WITHOUT A DISCRETE\
    \ LOGARITHM: psi_ell is computed once per curve from the standard division-polynomial recurrence\
    \ over F_p[x] (polynomial arithmetic of degree <= 84, seconds in sympy), and then EVALUATED at\
    \ the known field element x(R) in (ell^2-1)/2 field multiplications by Horner. Both P and Q are\
    \ given in the instance, so v_L(P) and v_L(Q) are computable by anyone. This is genuinely POINT-dependent\
    \ -- it changes when R changes with E fixed -- and it is genuinely NON-HOMOMORPHIC, so it is precisely\
    \ the complement that IDEA-20260807-6eab6a's coprimality theorem does not reach. DOES IT LEAK\
    \ ANYTHING ABOUT k? The honest answer this record asserts in advance: almost certainly not in\
    \ any usable way, and the reason is (A). Knowing v_L(Q) is strictly less than knowing Q, and Q\
    \ is already public. The ONLY way v_L could help is by propagating, so that a search over k could\
    \ be run in v_L-space instead of in G -- and (A) says exact propagation is impossible for any\
    \ lossy v_L. So the entire question reduces to E1: HOW BADLY does v_L fail to propagate?\n(E)\
    \ THE OBSERVABLE, AND WHY BOTH OUTCOMES ARE DELIVERABLES. Define the PROPAGATION DEFECT of a projection\
    \ v at sample size M:\n  d(v) = 1 - (expected fraction of sampled pairs (R, R') for which the\
    \ value\n  v(R + R') is uniquely determined by the observed pair (v(R), v(R'))),\nestimated by\
    \ bucketing M sampled pairs on the key (v(R), v(R')) and measuring how often a bucket contains\
    \ more than one distinct v(R + R') value.\n  OUTCOME 1 -- d(v_L) is statistically indistinguishable\
    \ from d(v_null) for a\n    matched null projection of the same image size. Then the psi_ell structure\n\
    \    contributes nothing beyond the SHAPE of the projection, the object is\n    closed, and the\
    \ closure has a named mechanism ((A) plus a measured\n    defect), not a tally. This is the predicted\
    \ outcome and it is a result.\n  OUTCOME 2 -- d(v_L) is materially BELOW the matched null at the\
    \ same image\n    size. Then a genuinely lossy, better-than-random-propagating object over\n \
    \   the ECDLP has been exhibited. Under (A) it still cannot reach d = 0, but\n    a measured gap\
    \ is a candidate answer to KN-OPEN-019 and would be the first\n    one this program has. It would\
    \ require independent review before any\n    interpretation (AGENTS.md rule 12) and would still\
    \ be nowhere near an\n    attack: converting q < 1 propagation into a key recovery needs a separate\n\
    \    proposal with its own cost accounting.\n  There is no outcome in which the measurement means\
    \ nothing."
  resource_label: R5
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE, and the argument is specific rather than generic. The admissibility
    filter of DECOMPOSITION.md section 2 excludes lanes whose only use of a map is to apply it to
    points of G, because End(G) = Z/N makes every such map a scalar (H-ENDO-001) and the resulting
    oracles are GGM-simulable (KN-FIND-b7e091). v_L applies NO group map to G. psi_ell is a polynomial
    over F_p whose roots are the x-coordinates of E[ell]; evaluating it at x(R) returns a FIELD ELEMENT
    that the generic group oracle does not provide, exactly as R1 escapes by returning x-coordinates
    as field data. Formally: a GGM simulator handed only group handles cannot produce psi_ell(x(R)),
    because it has no access to x(R) at all. So v_L is outside the generic model. WHAT THIS DOES NOT
    BUY: being outside the model is necessary, not sufficient. Theorem (A) is a lower-bound-free,
    model-free obstruction that applies to v_L anyway, which is why this proposal''s honest expectation
    is a controlled null and why it is filed as a measurement rather than as an attack.'
  reachability_gate: 'NOT APPLICABLE, and stated rather than omitted. This proposal moves between
    no curves: every measurement is on one fixed curve with its own points. T5 imposes no cost. Cross-curve
    reachability enters L7 only in IDEA-20260807-053a55 and IDEA-20260807-631e80. One consequence
    worth recording for those records: the truncation ladder T1..T4 is defined from psi_ell, which
    changes with the curve, so v_L is NOT transport-stable -- an isogeny does not carry v_L(R) to
    v_L(phi(R)) by any known relation, and any future proposal that assumes it does must prove it
    first.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): the rigidity proof plus its composite-order counter-check.
      If the argument does not distinguish the two, the proposal ends. STAGE 1 (hours): implement
      psi_ell for ell in {3,5,7,11,13} over F_p and validate against three known-answer checks --
      degree equals (ell^2-1)/2; the roots of psi_ell in F_p are exactly the x-coordinates of the
      F_p-rational ell-torsion, cross-checked by multiplying points by #E/ell; and psi_ell(x(R)) =
      psi_ell(x(-R)). STAGE 2 (HARD GATE, minutes): the defect estimator on the composite-order fixture
      and on the identity planted positive. Both must return d = 0. STAGE 3 (hours): the primary measurement
      -- 5 seeds x {16, 20, 24} field bits x truncations T1..T4 x M in {10^3, 10^4, 10^5}. STAGE 4
      (hours): NULL-A, NULL-B, NULL-C on the identical pipeline. STAGE 5 (only if OUTCOME 2 fires):
      the 2-step and 4-step decay test. Division-polynomial degrees are capped at ell <= 13 (deg <=
      84) precisely because psi grows as ell^2/2 and the polynomial arithmetic, not the field size,
      is the cost driver in pure Python; ell = 17 would be degree 144 and ell = 19 degree 180, which
      is where the per-curve setup starts to dominate the measurement and is therefore excluded from
      the declared ladder.'
    mechanism: "STEP 1 (zero compute, HARD GATE) -- write the rigidity proof and check it against\
      \ a nearby object where it must FAIL: a group of composite order n = ell * N, on which the reduction\
      \ mod the N-part IS a lossy propagating projection. If the argument cannot distinguish the prime-order\
      \ from the composite-order case it is wrong and the line ends here.\nSTEP 2 (implementation,\
      \ medium) -- a standalone driver. (a) Division polynomials over F_p by the standard recurrence,\
      \ built once per curve for ell in {3,5,7,11,13} and cached; degrees 4, 12, 24, 60, 84. (b) Evaluation\
      \ at x(R) by Horner. (c) The truncation ladder T0..T4. (d) A pair sampler drawing R, R' uniformly\
      \ from G by R = [r]P for uniform r (this uses the KNOWN r, which is legitimate because we are\
      \ measuring a property of the map, not solving an instance -- but the map itself never receives\
      \ r, and the driver must assert that separation in code).\nSTEP 3 (the primary measurement)\
      \ -- for each curve, each truncation level, and each sample size M in a declared ladder, bucket\
      \ the M sampled pairs on the key (v(R), v(R')) and compute the defect d = fraction of buckets\
      \ containing more than one distinct v(R+R') value, weighted by bucket occupancy. Report d with\
      \ a bootstrap confidence interval. Report also the image entropy H(v) in bits, so that d is\
      \ always read against how much the projection retained.\nSTEP 4 (THE NULLS, all three of them,\
      \ run on the identical pipeline).\n  NULL-A, MATCHED-SHAPE NULL: replace psi_ell by a uniformly\
      \ random polynomial\n    over F_p of the SAME degree (ell^2-1)/2 and the same number of distinct\n\
      \    roots in F_p, and rerun everything. This is the object null: it removes the\n    torsion\
      \ meaning while preserving the shape. If d agrees, the measurement is\n    about shape and no\
      \ torsion claim may be made.\n  NULL-B, IMAGE-SIZE NULL: replace v by a random function G ->\
      \ S with the same\n    image-size distribution (a keyed hash truncated to the same entropy).\
      \ This\n    separates \"psi_ell propagates\" from \"any map with this image size\n    propagates\
      \ this well by accident\".\n  NULL-C, THE CANONICAL k-RESAMPLE (mandated by RQ-TORS-8c7b79 and\
      \ by the L7\n    brief): hold (E, P) fixed and resample k, recomputing every statistic that\n\
      \    touches Q. Any quantity that appears to depend on k must be shown to move\n    under this\
      \ resample in the correct direction; a statistic that reads only\n    (p, a, b) and not (P,\
      \ Q) is k-independent BY CONSTRUCTION and is flagged\n    statically before any run by the gate\
      \ in IDEA-20260807-bd5d91.\n\nSTEP 5 (decay test, blocking before belief) -- if OUTCOME 2 fires\
      \ at one group operation, repeat at 2 and 4 operations. A genuine propagation signal must DECAY\
      \ with the number of operations. A defect gap that is identical at 1, 2 and 4 operations is\
      \ the canonical artifact signature named in docs/inventor-protocol.md section 3 and is reported\
      \ as an instrument finding, not as structure."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - NULL-A matched-shape polynomial null (blocking)
  - NULL-B matched image-size random-function null (blocking)
  - NULL-C k-resample with the curve fixed (blocking, mandated by RQ-TORS-8c7b79)
  - composite-order fixture, must give d = 0 (blocking baseline)
  - identity planted positive, must give d = 0 (blocking instrument check)
  - negation self-test psi_ell(x(R)) = psi_ell(x(-R)) (blocking instrument check)
  - root cross-check of psi_ell against explicitly computed ell-torsion points
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING; three matched nulls, each with its decay
    parameter. NULL-A (object null): psi_ell replaced by a random polynomial of the same degree and
    same F_p-root count. DECAY PARAMETER: the number of primes |L| in the vector. A genuine torsion
    signal should strengthen as more ell are stacked (more torsion structure retained); a shape artifact
    should not move. A gap that is identical at |L| = 1 and |L| = 5 is an artifact tell. NULL-B (image-size
    null): a keyed hash truncated to the same entropy. DECAY PARAMETER: sample size M. A finite-sample
    defect difference shrinks like M^{-1/2}; a real one does not. Required M ladder: 10^3, 10^4, 10^5
    pairs. NULL-C (the canonical L7 null): resample k with (E, P) held fixed, at least 100 resamples
    per cell. Any statistic that still appears to correlate with k under this resample is an artifact
    by construction, per RQ-TORS-8c7b79''s decision_target. DECAY PARAMETER: field bits -- a small-p
    coincidence (tiny N, smooth cofactor) must weaken from 16 to 20 to 24 bits; a signal that is constant
    in field size while the group grows is reported as suspect. PLANTED POSITIVE (blocking in the
    other direction): inject a projection that provably DOES propagate exactly -- the identity map
    v(R) = R, and the reduction-mod-N-part map on a deliberately composite-order group. The instrument
    must report defect 0 for these. An instrument that reports a non-zero defect for the identity
    cannot measure defects at all and every null it produced is void.'
  independent_variables: []
  metrics:
    primary:
    - propagation defect d per (curve, truncation, M, field bits), with bootstrap CI
    - retained entropy H(v) in bits per truncation
    - bucket occupancy distribution per cell (to detect degenerate estimator cells)
    - NULL-A, NULL-B, NULL-C defects on the identical pipeline
    secondary:
    - k-resample correlation statistics and their null percentiles
    - pass/fail of every gate control
    - wall-clock per stage and peak memory
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Propagation defect d(v_L) at truncation T1 (quadratic characters, |L| = 5) minus the
      matched NULL-A defect, at M = 10^5 pairs, 20 field bits
    formula: 'PRE-REGISTERED TWO-BRANCH RULE. |d(psi) - d(NULL-A)| <= 0.01 in absolute terms records
      OUTCOME 1, a controlled null: psi_ell structure invisible in propagation. d(psi) <= d(NULL-A)
      - 0.05 records OUTCOME 2 and triggers mandatory independent review before any interpretation.
      Anything strictly between is declared INCONCLUSIVE in advance so that neither branch is reachable
      by rounding. BASIS - the thresholds are PRE-REGISTERED TOLERANCES chosen a priori from the bucket-occupancy
      arithmetic (243^2 buckets, 10^5 pairs, ~1.7 pairs per bucket, so per-bucket noise is the dominant
      term); they are UNTESTED EXPECTATIONS, not measurements.'
    source: pre-registered in IDEA-20260807-df906f before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Degenerate bucket occupancy. At high-entropy truncations nearly every bucket is a singleton and
    d is trivially 0 for reasons of sample size, not structure. The occupancy metric is mandatory
    and any cell with median occupancy below 2 is reported as degenerate, not as d = 0.
  - Toy-scale image ratio. At 16-24 bits, |image(T1)| = 243 against |G| ~ 10^4 to 10^7 is a far larger
    ratio than at cryptographic size, biasing the measurement TOWARD apparent propagation. Disclosed
    in assumptions; the field-bit ladder is the only defence available at this scale and it is a weak
    one.
  - 'Accidental smoothness of #E(F_p) at toy scale (KN-TECH-030 obligation 2) and the anomalous case
    #E = p (KN-TECH-033). Both must be excluded per KN-TECH-034 before a curve enters the run set;
    an unexplained propagation signal should trigger those checks before any interpretation.'
  - Sampling R = [r]P uses a known r. The driver must keep r out of the statistic's input path, and
    the static provenance gate of IDEA-20260807-bd5d91 must be run over the statistic's implementation
    to confirm it. A statistic that reads r is measuring its own input.
  - 'Character convention. chi(0) must be fixed (this record fixes it to 0, a third symbol) and reported,
    because psi_ell(x(R)) = 0 exactly when R is ell-torsion, which is rare but not impossible on curves
    with ell | #E.'
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'PRE-REGISTERED TWO-BRANCH RULE. |d(psi) - d(NULL-A)| <= 0.01 in absolute terms
    records OUTCOME 1, a controlled null: psi_ell structure invisible in propagation. d(psi) <= d(NULL-A)
    - 0.05 records OUTCOME 2 and triggers mandatory independent review before any interpretation.
    Anything strictly between is declared INCONCLUSIVE in advance so that neither branch is reachable
    by rounding. BASIS - the thresholds are PRE-REGISTERED TOLERANCES chosen a priori from the bucket-occupancy
    arithmetic (243^2 buckets, 10^5 pairs, ~1.7 pairs per bucket, so per-bucket noise is the dominant
    term); they are UNTESTED EXPECTATIONS, not measurements.'
  falsification_criterion:
  - 'STAGE 0''s composite-order counter-check fails to separate: the rigidity argument as written
    also "proves" something false about composite order. The theorem is misstated and the record is
    superseded rather than amended.'
  - The identity planted positive returns d > 0. Instrument broken; nothing is reported.
  - The composite-order fixture returns d > 0. Same disposition.
  - psi_ell(x(R)) != psi_ell(x(-R)) for some odd ell. The division-polynomial construction is wrong;
    every number downstream is void.
  - NULL-A matches d(psi) within the pre-registered band. No psi-specific conclusion may be drawn;
    the honest report is that at toy scale the propagation defect of this object measures its SHAPE,
    and that IS the result.
  - A reported d = 0 at a genuinely lossy truncation level. This contradicts theorem (A) and must
    be replicated independently before being reported as anything other than a suspected estimator
    bug (degenerate buckets are the most likely cause and the occupancy metric exists to catch it).
  - Pure-Python polynomial arithmetic at ell = 13 exceeds the wall-clock budget before any cell resolves.
    That is an INFRASTRUCTURE outcome under AGENTS.md rule 5, is recorded as such, and is not evidence
    about propagation.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
