# EXP-DREG-32409e
# Locus membership and reading rules. No fall profile.
# Approved by DEC-20261002-684ac6.
experiment:
  id: EXP-DREG-32409e
  hypothesis_id: H-DREG-92d20a
  source_idea: IDEA-20260922-fac3e7
  question_id: RQ-DREG-c8ae8d
  version: 1
  title: Locus membership and reading rules
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-684ac6
  objective: >-
    Count the roots of three cubics at four primes and apply the
    locus reading rules to five integer rows.
  inputs:
    roots_01: [1, 3, 1, 3]
    roots_10: [3, 1, 1, 3]
    roots_11: [0, 0, 1, 1]
    primes: [5, 7, 11, 13]
    o2_row: [4, 4, 6, 4, 0, 4]
    falsified_row: [5, 4, 6, 4, 0, 4]
    matched_row: [4, 4, 4, 4, 0, 4]
    blocked_hamming: [4, 4, 6, 4, 1, 4]
    blocked_gauges: [4, 4, 6, 4, 0, 3]
    gauge_gate: 4
  controls:
    - >-
      The model (0, 1) is on the locus at prime 5 even though it
      has one root. Calling it generic invalidates the run.
    - >-
      The model (1, 1) at prime 11 has one root and product 1.
      Calling it a locus invalidates the run. Three roots are
      required for the torsion clause.
    - >-
      The row 4, 4, 6, 4 with distance 0 and four models is O2.
      The row 5, 4, 6, 4 is falsified. The row 4, 4, 4, 4 is
      matched, not O2. Swapping those labels invalidates the run.
    - >-
      Distance 1 blocks O2. Three gauge models block O2. Issuing
      O2 on either blocked row invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - prime
    - route in {evaluate, recount}
  metrics:
    primary:
      - roots_11_at_11
      - o2_row
      - blocked_gauges
      - implementations_agree
    secondary:
      - roots_01
      - matched_row
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The root count of (1, 1) at prime 11 and the O2 row.
    formula: >-
      Evaluate x cubed plus a x plus b at every field element. Three
      roots are full 2-torsion. Vanishing of a or of b is already a
      locus. O2 requires equal locus integers, a floor gap of at
      least 1, distance 0, and at least four gauge models. A rise on
      the locus is the falsified row. Equal integers on both curves
      are the matched row.
    source: >-
      IDEA-20260922-fac3e7 states the locus conditions and the O2
      split, read 2026-10-02. The roots were counted in this design
      session. That count is not a run. No profile was measured.
  scale_relevance:
    tier: toy
    justification: Four primes and five rows. No transfer to a fall profile.
    correspondence: null
  tail_checks:
    - The prime-11 row of (1, 1) is required. Stopping at the empty root lists and still calling one root a locus is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If (1, 1) at prime 11 is reported as a locus, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - (1, 1) at prime 11 is reported as a locus.
    - (0, 1) at prime 5 is reported as generic.
    - The matched row is reported as O2.
    - The falsified row is reported as O2.
    - A blocked row is reported as O2.
    - A fall profile is reported.
  success_criterion: >-
    Both runs agree on the root counts 1, 3, 1, 3 and 3, 1, 1, 3
    and 0, 0, 1, 1, that (1, 1) is generic at all four primes, that
    the four-model row is O2, that the risen locus row is falsified,
    that the equal row is matched, and that distance 1 and three
    gauge models both block O2.
  falsification_criterion: >-
    The runs agree, (1, 1) at prime 11 stays generic, and any root
    count differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-DREG-32409e/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-32409e/runs/<RUN-ID>/command.txt
    - experiments/EXP-DREG-32409e/runs/<RUN-ID>/stdout.log
    - experiments/EXP-DREG-32409e/runs/<RUN-ID>/stderr.log
    - experiments/EXP-DREG-32409e/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-DREG-32409e/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any fall profile, Macaulay matrix, or isogeny walk.
    - Any claim that a special model is easier.
    - An O2 label from fewer than four gauge models.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
