experiment:
  id: EXP-FAEST-ae5d9f
  hypothesis_id: H-FAEST-9c935b
  question_id: RQ-FAEST-001
  goal_id: GOAL-FAEST-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  approved_by_absent_reason: >-
    Only the Coordinator approves an experiment (AGENTS.md rule 1). This is a
    review_required draft; no approved_by field exists and none may be added
    by this role.

  title: >-
    Build the admissibility-gated matched baseline table for all twelve FAEST
    parameter sets: pin nu and c from source, derive E[S], declare the cost
    convention, and test the incumbent 2^126.1 comparator against the FAEST
    adversary's actual data budget

  objective: >-
    If separately approved and authorized, replace the unqualified figure
    "matched AES-128 baseline 2^126.1" -- currently written into
    IDEA-20260731-002, -003, -004, -005 and the GOAL-FAEST-001 BATCH-001
    checkpoint -- with a convention-indexed table of ADMISSIBLE baselines, one
    row per deployed parameter set, carrying (a) nu, the number of OWF block
    pairs the public key publishes; (b) E[S], the expected number of secrets
    consistent with that public key; (c) the admissible-baseline cost under a
    declared convention; and (d) a per-attack admissibility verdict D <= nu for
    every published AES key-recovery attack whose data complexity can be read.
    The most likely outcome RAISES the baseline, i.e. makes FAEST look
    STRONGER than this program has recorded, and the contract is written so
    that this comfortable direction is not privileged.

  what_this_is_not:
    - Not an attack on FAEST, not a forgery, and not a forgery cost model.
    - Not an attack on AES and not a claim that any published AES result is wrong.
    - >-
      Not a claim that KN-LIT-2701's figures are false. The paper has NOT been
      read; the entry's own body says its claims are relayed from an abstract
      without verification. The contract reports what the entry contains and
      what it lacks.
    - >-
      Not a status change, correction, supersession or edit of KN-LIT-2701,
      KN-LIT-7619, any IDEA record, or GOAL-FAEST-001. Those are Coordinator
      acts.
    - Not an exponent result. The total correction is about one bit.
    - Not approval, freezing, execution authorization, a run, an observation, or evidence.

  claim_ceiling:
    tier: medium
    exact_scope_a_run_could_support: >-
      "For faest-ref at commit <sha>, the twelve deployed parameter sets
      publish nu block pairs and admit E[S] expected witnesses as tabulated;
      under convention <X> the admissible matched baseline is <B> bits per set;
      and published attack <a> with data complexity <D> is admissible /
      inadmissible." NOTHING MORE. `medium` because the parameters are the
      deployed ones and the arithmetic is exact, `not crypto` because no
      security claim about FAEST follows and AGENTS.md rule 7 forbids dressing
      a comparator table as one. If the biclique data figure cannot be
      obtained, every admissibility verdict for that attack is reported as
      UNDETERMINED and the tier of that row is `design_only` -- an
      infrastructure outcome, never a result.

  inputs:
    source_pin:
      repository: https://github.com/faest-sign/faest-ref
      fetch_channel: >-
        raw.githubusercontent.com file paths, MEASURED WORKING 2026-08-06
        (owf.c, owf.h, faest_impl.c/h, instances.c/h, meson.build, bavc.c,
        README.md all HTTP 200).
      required_commit_sha: MUST BE PINNED AT STAGE 0. The motivating read used the moving ref 'main'.
      required_file_sha256: [meson.build, owf.c, owf.h, instances.c, instances.h, faest_impl.c]
    provisional_table_read_2026_08_06:
      note: >-
        (kappa = lambda = secret bits; c = 8 * owf_output_size = constraint
        bits; nu = beta = published OWF block pairs). PROVISIONAL until the
        stage-0 pin.
      rows:
        faest_128s:    {kappa: 128, c: 128, nu: 1, owf_input_size: 16, owf_output_size: 16}
        faest_128f:    {kappa: 128, c: 128, nu: 1, owf_input_size: 16, owf_output_size: 16}
        faest_em_128s: {kappa: 128, c: 128, nu: 1, owf_input_size: 16, owf_output_size: 16}
        faest_em_128f: {kappa: 128, c: 128, nu: 1, owf_input_size: 16, owf_output_size: 16}
        faest_192s:    {kappa: 192, c: 256, nu: 2, owf_input_size: 16, owf_output_size: 32}
        faest_192f:    {kappa: 192, c: 256, nu: 2, owf_input_size: 16, owf_output_size: 32}
        faest_em_192s: {kappa: 192, c: 192, nu: 1, owf_input_size: 24, owf_output_size: 24}
        faest_em_192f: {kappa: 192, c: 192, nu: 1, owf_input_size: 24, owf_output_size: 24}
        faest_256s:    {kappa: 256, c: 256, nu: 2, owf_input_size: 16, owf_output_size: 32}
        faest_256f:    {kappa: 256, c: 256, nu: 2, owf_input_size: 16, owf_output_size: 32}
        faest_em_256s: {kappa: 256, c: 256, nu: 1, owf_input_size: 32, owf_output_size: 32}
        faest_em_256f: {kappa: 256, c: 256, nu: 1, owf_input_size: 32, owf_output_size: 32}
    frozen_formulas:
      expected_witnesses: "E[S] = 1 + (2^kappa - 1) * 2^(-c), exact rational arithmetic"
      admissible_search_cost: "T_search = 2^kappa / (E[S] + 1), expected OWF evaluations"
      admissibility_gate: "attack a is admissible for set p iff data(a) <= nu(p)"
      conventions_to_report:
        - "CONV-A: charge 2^kappa for exhaustive key search (the loosest common convention)"
        - "CONV-B: charge 2^(kappa-1) (expected-work convention, unique witness)"
        - "CONV-C: charge 2^kappa / (E[S] + 1) (expected work to ANY witness) -- the one this contract argues is correct for FAEST"
    reduced_scale_validation_cell:
      purpose: validate HEUR-FF-1's first moment
      construction: >-
        A fully specified 16-bit toy permutation family: state = four nibbles;
        S-box = multiplicative inverse in GF(2^4) with the AES-style affine
        wrapper stated byte-exactly in the run report; two rounds; key = 16
        bits XORed in each round; kappa = c = 16. Enumerate all 2^16 keys for
        each of 1000 random (x, y) instances drawn from real keys, and record
        the empirical distribution of S.
      forced_value: "mean(S) = 2 - 2^-16 = 1.9999847..., to within three standard errors"
    seeds:
      master_seed: 11533471
      seed_derivation_rule: >-
        Per-cell seed = int.from_bytes(sha256(ascii("EXP-FAEST-ae5d9f/v1" ||
        "|" || cell_label || "|" || decimal(replicate_index))).digest()[:8],
        "big"); toy instances drawn by slicing a SHAKE256 stream keyed by that
        seed, 16 bits per key and 16 per input, consumed in that order. A third
        party reproduces every instance bit-for-bit.
      replicate_indices: [0, 1, 2]

  arms_and_controls:
    treatment: >-
      Compute nu, E[S] and T_search for all twelve deployed sets under all
      three conventions; apply the admissibility gate to every AES
      key-recovery attack whose (T, D) can be sourced.
    measured_null: >-
      NULL-192, THE ONLY SETS WITH c > kappa: faest_192s and faest_192f.
      FORCED VALUE DERIVED BEFORE THE RUN: E[S] = 1 + 2^-64, i.e. NO
      multiplicity correction and a unique witness, while the other ten sets
      give 2 - 2^-kappa. THIS NULL CAN FAIL: a pipeline that reports ~2
      everywhere is keyed to the set label rather than to (kappa, c), and no
      other number from the run may then be reported.
    positive_control: >-
      POS-TRUNC, synthetic set with c = kappa - 8 and everything else
      unchanged. FORCED VALUE: E[S] = 1 + (2^kappa - 1) 2^-(kappa-8) ~ 257,
      i.e. an ~8.0-bit reduction in admissible baseline. THE EFFECT MUST
      APPEAR. If the instrument cannot see an 8-bit effect it cannot be
      trusted with a 0.58-bit one, and NO NEGATIVE MAY BE REPORTED FROM ANY
      CELL.
    graded_control: >-
      GRAD-C, five interior points: c in {kappa-16, kappa-8, kappa, kappa+8,
      kappa+16} at kappa = 128. REQUIRED MONOTONICITY: E[S] strictly
      decreasing in c, T_search strictly increasing in c and saturating at
      2^kappa/2 for c >> kappa. A non-monotone point localises an arithmetic
      or overflow defect rather than leaving "it did not work".
    ordering_control: >-
      NULL-192, POS-TRUNC, GRAD-C and the reduced-scale validation are
      executed, recorded and hash-committed BEFORE any deployed-set treatment
      number is computed or looked at, and before any attempt is made to fetch
      the biclique paper. The commitment sha256 is written into the run record
      first.
    comparability_policy: >-
      A cost may be compared to another cost ONLY within one declared
      convention, and every reported figure carries its convention tag.
      Comparing a CONV-C baseline against a literature figure quoted under an
      unknown convention is FORBIDDEN and is an invalidation condition; where
      the literature convention is unknown the row records UNKNOWN CONVENTION
      rather than a comparison.
    record_integrity_arm: >-
      A read-only audit arm, executed last and reported separately: enumerate
      the files citing KN-LIT-2701, record for each what it uses the entry for
      (a time figure, a data figure, a venue, an author list), and record which
      of those uses the entry actually supports. NO FILE IS EDITED. The output
      is a list for the Coordinator.

  metrics:
    primary:
      - "nu(parameter_set) for all twelve sets, from the pinned source."
      - "E[S](parameter_set), exact rational, for all twelve sets."
      - >-
        admissible_baseline_bits(parameter_set, convention) for all twelve
        sets and all three conventions.
      - >-
        admissibility verdict per (published attack, parameter set), or
        UNDETERMINED with the reason.
    secondary:
      - "D_biclique read from the paper, with page reference, or UNAVAILABLE."
      - "Empirical mean and variance of S in the reduced-scale cell, versus the forced value."
      - "The three control outputs (NULL-192, POS-TRUNC, GRAD-C) with monotonicity verdicts."
      - "The declared NIST category convention, quoted verbatim from its source, or UNREAD."
      - "The list of citing records whose baseline value would change, by id, with the delta in bits."

  heuristic_under_test: HEUR-FF-1

  preregistered_prediction:
    quantity: "nu per set; E[S] per set; D_biclique; admissible_baseline_bits for the 128-bit sets."
    formula: >-
      nu = beta, predicted 1 for faest_128s/f and all six EM sets and 2 for
      faest_192s/f and faest_256s/f.
      E[S] = 1 + (2^kappa - 1) 2^-c, predicted 2 - 2^-kappa for TEN sets and
      1 + 2^-64 for faest_192s and faest_192f ALONE -- a sharp two-of-twelve
      prediction that can fail.
      D_biclique predicted >= 2^32; D <= 8 falsifies the admissibility
      correction outright.
      admissible_baseline_bits >= 126.4 for the 128-bit sets under CONV-C,
      i.e. STRICTLY ABOVE the 2^126.1 currently recorded.
    source: >-
      Derived in H-FAEST-9c935b mechanism (i)-(vi) from faest-ref owf.c,
      owf.h, faest_impl.c, instances.c/h and meson.build read on 2026-08-06,
      plus linearity of expectation. The 2^126.1 figure and the recalled 2^88
      data figure are RELAYED / RECALLED-UNVERIFIED and are inputs to be
      checked, never premises.

  scale_relevance:
    tier: medium
    justification: >-
      The parameter table and the arithmetic are at the deployed sets, so no
      cross-scale extrapolation occurs. The reduced-scale cell (kappa = c = 16)
      validates only HEUR-FF-1's first moment and is labelled toy; NOTHING
      about AES-128 is inferred from it.
    correspondence: >-
      null -- no sampling correspondence. The toy cell tests a counting
      identity, not a cipher property, and its result transfers only as a
      check on the identity.

  tail_checks:
    - >-
      Check E[S] against a direct enumeration in the toy cell: the identity
      must reproduce the empirical mean to three standard errors.
    - >-
      Check the c >> kappa limit: T_search must converge to 2^kappa / 2, the
      unique-witness value, and not overshoot.
    - >-
      Check the c << kappa limit: E[S] must equal 2^(kappa-c) to within one
      unit and T_search must fall by kappa - c bits, matching POS-TRUNC.

  replication:
    seeds: [0, 1, 2]
    independent_instances: 12
    planned_runs: 1
    interpretation: >-
      The deployed-set arithmetic is deterministic and needs no replication;
      the seeds apply only to the reduced-scale validation cell, where three
      independent 1000-instance batches are run and their spread is reported
      before any conclusion about HEUR-FF-1.

  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 1
    maximum_memory_gb: 1
    maximum_runs: 1
    network_use: >-
      Permitted ONLY in stage 0 (pin the faest-ref commit) and stage 3 (attempt
      to obtain the biclique paper's data complexity). Stages 1, 2 and 4 run
      offline.

  stopping_rules:
    - Do not execute unless separately approved, frozen, archived and authorized by the Coordinator.
    - >-
      STOP AT STAGE 0 if the pinned source's parameter table differs from the
      provisional table. Every derived number is void; supersede rather than
      patch.
    - >-
      STOP if NULL-192 reports E[S] ~ 2. The computation is keyed to the set
      label; report the defect and nothing else.
    - >-
      STOP if POS-TRUNC does not report E[S] ~ 257. The instrument cannot see
      an 8-bit effect; no negative may be reported.
    - >-
      DO NOT STOP if the biclique paper cannot be fetched. Record the
      admissibility verdicts as UNDETERMINED, complete every offline metric,
      and report the fetch failure as infrastructure (AGENTS.md rule 5).
    - Stop on budget exhaustion, reporting the stage reached.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any treatment number computed before the control results file is hash-committed.
    - Any comparison of costs across different or unknown conventions.
    - >-
      Any use of the recalled 2^88 data figure, or of any KN-LIT-2701 body
      figure, as an input rather than as a value under test.
    - Any edit to any existing repository file, including any literature entry.
    - Any reported baseline lacking its convention tag.

  success_criterion: >-
    THIS DRAFT HAS NO SUCCESS OUTCOME BECAUSE IT IS NOT AUTHORIZED TO RUN. A
    later approved, frozen successor SUCCEEDS when: (1) the pinned source
    matches the frozen table; (2) NULL-192 reports E[S] ~ 1 while the other ten
    sets report ~2; (3) POS-TRUNC reports ~257; (4) GRAD-C is monotone at every
    adjacent pair; (5) the reduced-scale cell matches 2 - 2^-16 within three
    standard errors; (6) all three tail checks pass; and (7) a complete
    twelve-row, three-convention admissible-baseline table is produced with
    every admissibility verdict either issued or explicitly UNDETERMINED with
    its reason. SUCCESS DOES NOT REQUIRE THE INCUMBENT 2^126.1 TO BE
    INADMISSIBLE: a run that finds the biclique data complexity to be at most
    nu, and therefore that 2^126.1 stands, has succeeded and has removed a real
    uncertainty.

  falsification_criterion: >-
    H-FAEST-9c935b is falsified at the tested scope if (a) D_biclique <= 8,
    voiding (B1); or (b) the pinned table gives different nu or c, voiding the
    reading; or (c) the reduced-scale validation refutes HEUR-FF-1's first
    moment, so that (B2) must be restated as measured rather than derived; or
    (d) NULL-192 or POS-TRUNC fails, in which case nothing is concluded at all.
    Each closes exactly the tested scope: one implementation, one commit,
    twelve parameter sets, three conventions.

  outcomes:
    no_execution_authorization: The only current disposition. No run, no observation, no evidence.
    incumbent_inadmissible: >-
      D_biclique > nu. Deliverable: the corrected table, and a note that four
      existing proposals' success criteria are stated against an inadmissible
      comparator. NO CLAIM THAT ANY OF THEM IS WRONG -- their computations are
      untouched; only the comparator moves.
    incumbent_admissible: >-
      D_biclique <= nu. Deliverable: the incumbent stands, the multiplicity
      correction still applies, and the goal gains a verified comparator with a
      stated adversary model. A confirmation is a result.
    undetermined_by_source_access: >-
      The paper cannot be fetched. Deliverable: nu, E[S] and the three-convention
      table are still produced; the admissibility column reads UNDETERMINED with
      the fetch evidence attached. INFRASTRUCTURE, NOT MATHEMATICS.
    infrastructure_or_integrity_failure: >-
      Any crash, moved ref or budget exhaustion is reported as infrastructure
      signal and is NEVER negative evidence about FAEST, about AES, or about
      H-FAEST-9c935b (AGENTS.md rule 5).

  stage_order_and_terminating_stage:
    - >-
      STAGE 0 (network, minutes): pin the faest-ref commit sha; record per-file
      sha256; re-read the twelve parameter rows and owf.c's OWF shapes. CAN
      TERMINATE (source mismatch).
    - >-
      STAGE 1 (pen and paper, zero compute): derive nu, E[S] and the
      three-convention table. THIS STAGE ALONE PRODUCES THE PRINCIPAL
      DELIVERABLE, which is why it runs before any network attempt.
    - >-
      STAGE 2 (offline, minutes): controls -- NULL-192, POS-TRUNC, GRAD-C -- and
      the reduced-scale HEUR-FF-1 validation; hash-commit. CAN TERMINATE
      (control failure).
    - >-
      STAGE 3 (network, may fail): obtain the biclique paper; read the data
      complexity of the full-AES-128 attack with a page reference; apply the
      gate. Failure here is infrastructure and does not terminate the run.
    - >-
      STAGE 4 (offline, read-only): the record-integrity arm over the files
      citing KN-LIT-2701. No file is edited.

  required_artifacts:
    - Frozen approved specification and a freeze receipt binding its sha256.
    - Pinned faest-ref commit sha and per-file sha256.
    - Verbatim source excerpts for the twelve parameter rows and for owf.c's OWF definitions.
    - The declared cost conventions, quoted, with their sources or an explicit UNREAD marker.
    - Control results file and its sha256 commitment, timestamped before treatment.
    - The twelve-row, three-convention admissible-baseline table with exact rational E[S].
    - Reduced-scale validation raw data, seeds, and the empirical mean and spread of S.
    - D_biclique with source and page, or a recorded fetch failure with the HTTP evidence.
    - The read-only list of KN-LIT-2701 citing records and what each relies on.
    - Environment record: Python version, platform, and confirmation that only stdlib was used.

  approval_requirements:
    - Independent review confirms the parameter table against the pinned source, row by row.
    - Independent review confirms NULL-192 and POS-TRUNC can actually fail.
    - >-
      Independent review confirms that no step treats a relayed or recalled
      figure as an input.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
    - >-
      Coordinator decides separately whether any literature entry warrants a
      superseding record. THIS CONTRACT PROPOSES NONE AND EDITS NOTHING.

  approval_status: >-
    Pending Coordinator review. No approved_by field is present because this
    draft is not approved and this role may not approve it.

  assigned_to: executor
