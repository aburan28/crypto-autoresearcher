experiment:
  id: EXP-GLVFB-5f287d
  hypothesis_id: null
  hypothesis_id_note: >-
    Focused benchmark extension. The exact orbit-folding identity already exists
    in EXP-EQLA-164b34; this experiment measures charged end-to-end consequences
    rather than proposing a new theorem.
  question_id: RQ-EQLA-0d3f40
  related_question_ids:
    - RQ-EQIC-8cb959
    - RQ-ICPERF-94c86e
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    GLV factor-base quotient: end-to-end cost of one logarithm unknown per
    order-3 orbit after relation-density and sparse-linear-algebra costs are charged

  objective: >-
    Measure whether a complete order-3 GLV-closed factor base gives a practical
    reduction in total work per recovered independent logarithm once the whole
    pipeline is charged. The experiment does not re-test the exact identity
    x_{phi(P)} = lambda*x_P. It tests whether retaining B physical factor-base
    points while storing only B/3 independent logarithm unknowns is better than
    both a generic B-point base and a generic B/3-point base.

  novelty_delta: >-
    Endomorphism-invariant factor bases and eigenvalue-weighted orbit
    representatives are prior art, and EXP-EQLA-164b34 already specifies the
    informative-rank folding identity. The new measurement is a three-arm,
    end-to-end cost comparison with the relation-density tradeoff, matrix
    sparsity, memory, and sparse-LA work all in the denominator.

  mathematical_setup:
    curve_family: >-
      j=0 short-Weierstrass curves E: y^2=x^3+b over F_p, p=1 mod 3,
      with a prime-order phi-stable subgroup G=<P>.
    automorphism: phi(x,y)=(beta*x,y), beta^3=1, beta!=1.
    subgroup_action: phi(P)=[lambda]P with lambda^2+lambda+1=0 mod N.
    factor_base_rule: >-
      ARM_GLV uses complete length-3 phi-orbits only. One representative
      logarithm is stored per orbit; a point orientation contributes coefficient
      1, lambda, or lambda^2 to that representative column.

  arms:
    - id: ARM_GLV
      description: >-
        B physical factor-base points arranged in B/3 complete GLV orbits;
        B/3 independent log columns after folding.
    - id: ARM_GEN
      description: >-
        Generic factor base with B physical points and B independent log columns.
    - id: ARM_QUOT
      description: >-
        Generic factor base with B/3 physical points and B/3 independent log
        columns. This is the size-of-unknown-space control.
    - id: NULL_RANDOM
      description: >-
        Matched sparse random relation matrices with the same row-weight and
        column-count distributions, used only to validate the LA instrumentation.

  inputs:
    procedure: >-
      For each toy j=0 instance and each declared B divisible by 3, build all
      three arms before sampling targets. Feed the identical target sequence to
      every arm. For each target, run the same decomposition method and solver
      configuration. Every accepted decomposition is re-added on the curve and
      verified. ARM_GLV folds each point to its canonical orbit representative
      while carrying its exact lambda orientation. Accumulate rows until the
      independent-column rank target is reached or the frozen target budget
      expires. Then run the same sparse-LA backend on the resulting systems.
    parameter_grid:
      bit_sizes: [12, 14, 16, 18]
      arities: [2, 3]
      physical_factor_base_sizes: >-
        At least three B values per bit size, all divisible by 3 and spanning
        at least a 4x range where feasible.
      seeds: [20260918, 20260919, 20260920]
      target_sequence: identical across arms within a cell.

  controls:
    - >-
      Complete-orbit gate: sigma^3 must be identity, every ARM_GLV orbit must
      have length 3, and no truncation may split an orbit.
    - >-
      Lambda-root gate: pin the correct root by checking one known toy discrete
      log pair and verify lambda^3=1, lambda!=1, and 1+lambda+lambda^2=0 mod N.
    - >-
      ARM_QUOT distinguishes a genuine benefit from simply using fewer unknowns.
    - >-
      Same-target paired sampling across arms prevents target difficulty from
      masquerading as a factor-base effect.
    - >-
      NULL_RANDOM must reproduce expected rank-arrival and sparse-LA accounting
      on synthetic matrices before curve measurements are interpreted.
    - >-
      Report the automorphism-adjusted rho baseline from KN-TECH-018 for every
      instance. No unadjusted rho comparison is admissible on j=0 curves.

  metrics:
    primary:
      - verified_relations_per_target_attempt
      - target_attempts_per_verified_relation
      - verified_relations_to_full_informative_rank
      - decomposition_seconds_per_verified_relation
      - total_seconds_to_full_informative_rank
      - matrix_columns
      - matrix_rows
      - matrix_nnz
      - peak_matrix_bytes
      - sparse_la_iterations
      - sparse_la_seconds
      - end_to_end_seconds
    secondary:
      - physical_factor_base_size
      - independent_log_unknowns
      - orbit_orientation_histogram
      - duplicate_relation_rate_before_dedup
      - row_weight_distribution_before_and_after_folding
      - canonicalization_seconds
      - factor_base_build_seconds
      - exact_rank_arrival_curve
      - charged_ratio_ARM_GLV_over_ARM_GEN
      - charged_ratio_ARM_GLV_over_ARM_QUOT

  benchmark_contract:
    incumbent_relation_pipeline: >-
      Use the strongest currently runnable Semaev/function-first configuration
      for the same curve family, arity, target sequence, and factor-base rule.
      Do not change solver settings between arms.
    icperf_reference: RQ-ICPERF-94c86e
    rho_reference: KN-TECH-018
    decision_metric: >-
      The treatment metric is end-to-end seconds per full informative-rank
      system and seconds per verified relation, not matrix dimension alone.
    success_threshold: >-
      ARM_GLV must improve the paired median end-to-end cost by at least 20%
      versus ARM_GEN while also beating ARM_QUOT on either relation yield per
      target attempt or total time. A pure matrix-memory reduction without
      charged-time improvement is recorded as a memory result, not a speedup.

  scale_relevance:
    tier: toy
    secp256k1_correspondence: >-
      The same order-3 GLV algebra applies to secp256k1. Toy results establish
      implementation behavior and scaling trends only; they do not establish
      cryptographic-scale relation collection or an ECDLP attack.

  stopping_rules:
    - >-
      Stop a cell if the complete-orbit or lambda-root gate fails. That is an
      implementation failure, not evidence against the mechanism.
    - >-
      Stop at the frozen target budget for the cell and retain all partial rows.
    - >-
      Do not silently increase B, arity, target count, or timeout after observing
      a favorable or unfavorable trend.
    - >-
      If an apparent end-to-end result beats the applicable rho baseline, route
      it to independent adversarial review before interpretation.

  invalidation_rules:
    - Any accepted relation that fails independent curve re-addition invalidates the run.
    - Any GLV row whose orientation cannot be mapped back exactly invalidates the run.
    - Any arm using a different target sequence or solver configuration is invalid.
    - Any comparison that omits relation-density cost or canonicalization cost is invalid.
    - A timeout, crash, or memory exhaustion is failed infrastructure, never negative evidence.

  success_criterion: >-
    Produce complete paired measurements for all three arms, with verified
    relations, exact rank-arrival curves, sparse-LA measurements, and charged
    end-to-end ratios. Scientific success means the experiment discriminates the
    arms; it does not require ARM_GLV to win.

  falsification_criterion:
    - >-
      ARM_GLV has no end-to-end advantage over ARM_GEN once relation-density and
      solver cost are charged.
    - >-
      ARM_GLV is indistinguishable from ARM_QUOT after normalizing for unknown
      count, showing that the GLV closure contributes no extra relation-side value.
    - >-
      The relation-density penalty cancels the LA/memory savings within error.

  required_artifacts:
    - specification.yaml
    - manifest.yaml
    - command.txt
    - environment.json
    - raw-result.json
    - results.jsonl
    - rank-arrival.csv
    - matrix-metrics.json
    - verification-report.json

  source_refs:
    - EXP-EQLA-164b34
    - RQ-EQLA-0d3f40
    - RQ-EQIC-8cb959
    - RQ-ICPERF-94c86e
    - KN-TECH-018
    - coordination/intake/cm-factor-base-20260905/source-context.md
    - research/ideas/glv_index_calculus_experiment_matrix.md

  assigned_to: executor
  approved_by: null
