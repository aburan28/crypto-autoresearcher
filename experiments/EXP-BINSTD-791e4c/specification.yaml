# Spearman ρ(r_Tr, N_nl) ≤ −0.70 plus shuffled-linear null, after
# EV-BINSTD-56c2bc / EV-BINSTD-d3a6be. Source IDEA-20261003-3dbdad /
# RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# NOT a re-run of EXP-BINSTD-dbca92 / 871156 / 6fd454 / 8196d7.
# NOT Stage-2 under EXP-BINSTD-dbca92.
#
# ZERO RUNS in this design packet. Stages 0-2 authorized for later
# executor TASK-20261003-59008b. No AUXIN. Amazon Bedrock prohibited.
# NO break. NO attack. NO exponent. No KN-FIND.
# =============================================================================
experiment:
  id: EXP-BINSTD-791e4c
  hypothesis_id: H-BINSTD-336a46
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261003-3dbdad
  goal_id: GOAL-ECDLP2M-001
  successor_of: EXP-BINSTD-dbca92
  predecessor_experiment_id: EXP-BINSTD-dbca92
  predecessor_evidence_id: EV-BINSTD-56c2bc
  predecessor_decision_id: DEC-20261003-95d6b8
  parent_experiment_id: EXP-BINSTD-871156
  parent_evidence_id: EV-BINSTD-d3a6be
  version: 1
  title: >-
    n∈{19,23} Trace→N_nl Spearman ≤−0.70 after unique-pair floors ≥4, plus
    shuffled-linear null (not a re-run of dbca92 / 871156 / 6fd454 / 8196d7)
  status: approved
  approved_by: DEC-20261003-c5aef5
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  designed_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1, 2]
  execution_authorized_note: >-
    Stages 0-2 authorized by DEC-20261003-c5aef5 under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    ECC2K-130 solve. No n>=131 attack. Do not re-run EXP-BINSTD-dbca92
    (seed 202610034821), EXP-BINSTD-871156 (202610038196),
    EXP-BINSTD-6fd454 (202610039715), or EXP-BINSTD-8196d7 (202610038782).
    Do not open Stage-2 under EXP-BINSTD-dbca92. No KN-FIND. This design
    tick does not launch /run.
  approval:
    approved_by: DEC-20261003-c5aef5
    composing_decision: DEC-20261003-c5aef5
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-2 authorized. Cites
      EV-BINSTD-56c2bc / DEC-20261003-95d6b8 NA-2 and EV-BINSTD-d3a6be.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0 freezes rank-diversity-seeking V catalogs for n∈{19,23} ℓ∈{3,4}
      (≥24, ≤128), Spearman band −0.70, seed 202610033364, unique-pair floors
      4/4/4, encoder pin, twin probes, Stage-2 auth. Stage 1 runs those four
      cells with twin meters; FORALL admission floors before package band.
      Stage 2 runs shuffled-linear null when Stage-1 is O-SUPPORT. RESULTS.md
      with Stage-1 then Stage-2 O-* labels. No Magma/Sage/AUXIN/Bedrock.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    After EV-BINSTD-56c2bc (replicate of EV-BINSTD-d3a6be), decide whether
    HEUR-BINSTD-878222-H1 holds on n∈{19,23} after unique-pair floors ≥4, and
    whether a shuffled-linear null of the same shape fails the anti-band.
    Deliver Stage-1 then Stage-2 O-* labels from H-BINSTD-336a46.

  class: heuristic_validation
  class_note: >-
    Pre-registered Spearman band plus same-shape shuffled-linear null on an
    encoding-structure instrument. Not an exponent-moving breakthrough; no
    ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Rank-diversity-seeking freeze (≥24, ≤128 shapes) for
        (n,ℓ)∈{19,23}×{3,4} only; freeze preregistered-predictions.json
        (band −0.70, seeds 202610033364/365/366, unique-pair floors 4/4/4,
        encoder pin, four-seed forbidden gate, Stage-2 null definition);
        twin self-check. No n=17 Stage-1 freeze on this card.
      - >-
        Stage 1. For (n,ℓ)∈{19,23}×{3,4} measure twin r_Tr and twin N_nl;
        FORALL ADMISSION GATE (≥4 distinct r_Tr, ≥4 distinct N_nl, ≥4 unique
        pairs) before Spearman band; write panels/control-table/RESULTS.md.
      - >-
        Stage 2. When Stage-1 is O-SUPPORT: permutation r_Tr null + resample
        r_Tr from observed support vs anti-band −0.70; write
        stage2/null-results.json and append Stage-2 section to RESULTS.md.
    excluded:
      - Re-running EXP-BINSTD-dbca92 / seed 202610034821.
      - Re-running EXP-BINSTD-871156 / seed 202610038196.
      - Re-running EXP-BINSTD-6fd454 / seed 202610039715.
      - Re-running EXP-BINSTD-8196d7 / seed 202610038782.
      - Opening Stage-2 under EXP-BINSTD-dbca92's Stages 0-1 card.
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Editing IDEA claim text or GOAL-ECDLP2M-001.yaml.
      - Editing the −0.70 band after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.
      - Reading package O-SUPPORT without unique-pair ≥4 floors.
      - Promoting KN-FIND.

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-791e4c/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-791e4c/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-791e4c/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-791e4c/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-791e4c/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage2: >-
      python3 experiments/EXP-BINSTD-791e4c/implementation/run.py --stage 2
      --trial-plan experiments/EXP-BINSTD-791e4c/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. Twin-B meters copied from
      EXP-BINSTD-dbca92. {run_dir} substituted by supervisor. trial-plan.json
      is a byte-identical copy of trial-plan-v1.json. Stages 0-2 all admitted
      on trial-plan-v1.

  inputs:
    source_idea: ledger/proposals/IDEA-20261003-3dbdad.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-336a46.yaml
    predecessor_evidence_ids:
      - EV-BINSTD-56c2bc
      - EV-BINSTD-d3a6be
    spearman_band: -0.70
    catalog_seed: 202610033364
    bootstrap_seed: 202610033365
    null_seed: 202610033366
    forbidden_seeds: [202610038196, 202610038782, 202610039715, 202610034821]
    min_catalog: 24
    max_catalog: 128
    floor_rTr: 4
    floor_Nnl: 4
    floor_unique_pairs: 4
    stage1_cells:
      - {n: 19, ell: 3}
      - {n: 19, ell: 4}
      - {n: 23, ell: 3}
      - {n: 23, ell: 4}

  controls:
    - name: twin_rTr_Nnl
      definition: encode_s3 r_Tr and N_nl path A == path B on every measured V.
    - name: ctl_fixed_dim_V
      definition: Every Stage-1 V has exactly ℓ basis elements (dim ℓ).
    - name: ctl_frozen_V_catalog
      definition: Catalog frozen in stage0/v-catalog.json before Stage 1 (≥24 shapes).
    - name: ctl_admission_floors_before_band
      definition: ≥4 distinct r_Tr, ≥4 distinct N_nl, ≥4 unique pairs before band.
    - name: ctl_unique_pairs_anti_collapse
      definition: unique_pairs < 4 ⇒ O-INCONCLUSIVE (blocks 3-point Spearman collapse).
    - name: ctl_shared_xorsat_pin
      definition: Encoder pin frozen in preregistered-predictions.json.
    - name: ctl_frozen_spearman_band_before_runs
      definition: Spearman band −0.70 frozen before Stage 1.
    - name: ctl_no_posthoc_band_edit
      definition: Band constant not edited after Stage-0 freeze.
    - name: ctl_not_prior_catalog_rerun
      definition: >-
        catalog_seed ∉ {202610038196, 202610038782, 202610039715, 202610034821};
        check.py refuses prior seeds.
    - name: null_shuffled_linear_block_rank
      definition: >-
        Stage 2 AUTHORIZED when Stage-1 is O-SUPPORT. Permute observed r_Tr
        against fixed N_nl; independently resample r_Tr from observed support
        (matched cardinality). Null fails anti-band iff ci95_lo > −0.70.

  independent_variables:
    - name: stage
      levels: [0_freeze_n19_n23, 1_spearman_n19_n23, 2_shuffled_linear_null]
    - name: cell
      levels: ['(19,3)', '(19,4)', '(23,3)', '(23,4)']

  metrics:
    primary:
      - name: spearman_rTr_vs_Nnl
        unit: dimensionless
        definition: Spearman ρ(r_Tr, N_nl) across the frozen rank-diverse catalog after floors.
      - name: floors_met
        unit: boolean
        definition: distinct_rTr≥4 and distinct_Nnl≥4 and unique_pairs≥4 on the cell.
      - name: band_holds
        unit: boolean
        definition: floors_met and spearman_rTr_vs_Nnl ≤ −0.70.
      - name: shuffled_linear_null_ci95_lo
        unit: dimensionless
        definition: 95% lower CI of Spearman under permutation / resample r_Tr nulls.
      - name: twin_agreement
        unit: boolean
        definition: Twin r_Tr and N_nl meters agree on every measured V.
    secondary:
      - name: r_Tr
        unit: integer
      - name: N_nl
        unit: integer
      - name: distinct_rTr
        unit: integer
      - name: distinct_Nnl
        unit: integer
      - name: unique_pairs
        unit: integer
      - name: catalog_size
        unit: integer
      - name: bootstrap_ci_95
        unit: interval
      - name: wall_clock_seconds
        unit: seconds

  heuristic_under_test: HEUR-BINSTD-878222-H1

  preregistered_prediction:
    quantity: >-
      After unique-pair admission floors, Spearman ρ(r_Tr, N_nl) ≤ −0.70 on
      each Stage-1 cell under seed 202610033364; then shuffled-linear null
      ci95_lo > −0.70 on FORALL those cells.
    formula: >-
      r_Tr = F_2-rank of Trace pure-linear block; N_nl = count of nonlinear
      clauses retaining a non-pivot variable after Trace-linear elimination;
      floors = (distinct_rTr>=4 and distinct_Nnl>=4 and unique_pairs>=4);
      rho = Spearman(r_Tr, N_nl); band holds iff floors and rho <= -0.70;
      null fails anti-band iff permutation or resample ci95_lo > -0.70.
    source: >-
      ledger/proposals/IDEA-20261003-3dbdad.yaml; EV-BINSTD-56c2bc replicate
      of EV-BINSTD-d3a6be; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Encoding-structure instrument on n∈{19,23} only under this card. No
      transfer of a Spearman band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids band claims (O-ARTIFACT).
    - Floors unmet (including unique_pairs<4) → O-INCONCLUSIVE.
    - Forbidden prior seed → O-ARTIFACT.
    - Bootstrap CI reported beside point estimate; band decision uses point ρ after floors.
    - Null decision uses permutation/resample ci95_lo vs −0.70.

  seeds_and_replication:
    catalog_seed: 202610033364
    bootstrap_seed: 202610033365
    null_seed: 202610033366
    independent_instances: 4
    note: >-
      Cells (19,3),(19,4),(23,3),(23,4) are independent instances. Twin meters
      are the replication instrument for each V. Not a re-run of parent seeds.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 6.0
    maximum_memory_gb: 2
    maximum_runs: 6
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and v-catalog.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - Stage 2 complete with stage2/null-results.json when Stage-1 is O-SUPPORT, OR O-STAGE2-SKIPPED.
    - RESULTS.md names Stage-1 and (when run) Stage-2 O-* labels from H-BINSTD-336a46.
    - maximum_runs = 6.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure → O-ARTIFACT; do not read band as support.
    - Re-using any forbidden seed → O-ARTIFACT / protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.
    - Promoting KN-FIND under this card → protocol invalid.
    - Opening Stage-2 under EXP-BINSTD-dbca92 → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok true on probes and catalog_seed ∉
    forbidden quadruple; Stage 1 produces unique-pair-gated Spearman ρ vs
    ≤−0.70 band for each Stage-1 cell with twin agreement (or a named
    O-ARTIFACT/O-IMPEDIMENT/O-INCONCLUSIVE stop); Stage 2 produces shuffled-
    linear null labels when Stage-1 is O-SUPPORT (or O-STAGE2-SKIPPED);
    RESULTS.md names the O-* labels from H-BINSTD-336a46 with cited artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; post-hoc Spearman-band edit; forbidden seed
    reuse; a claimed break/exponent/KN-FIND under this card. (O-FAIL-BAND and
    O-NULL-ALSO-IN-ANTI-BAND are valid scientific negatives, not protocol fails.)

  required_artifacts:
    - experiments/EXP-BINSTD-791e4c/trial-plan-v1.json
    - experiments/EXP-BINSTD-791e4c/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-791e4c/stage0/v-catalog.json
    - experiments/EXP-BINSTD-791e4c/stage1/
    - experiments/EXP-BINSTD-791e4c/stage2/
    - experiments/EXP-BINSTD-791e4c/RESULTS.md
    - experiments/EXP-BINSTD-791e4c/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-791e4c/implementation/run.py
    - experiments/EXP-BINSTD-791e4c/implementation/check.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
