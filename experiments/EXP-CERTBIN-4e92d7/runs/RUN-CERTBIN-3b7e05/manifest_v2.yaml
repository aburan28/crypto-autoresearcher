  protocol_interpretations_and_deviations:
  - 'I-1 curve draw: A = integers(0, 2^17) then B = integers(0, 2^17) per draw from S_curve; B = 0 is
    redrawn and counted; the first (A, B) with #E = h*q, h in {2, 4}, q prime (Miller-Rabin, fixed bases)
    is accepted; every rejected draw is recorded.'
  - 'I-2 subgroup points: from S_pts, x = integers(0, 2^17); the lift is deterministic, y = x*H(c) with
    c = x + A + B/x^2 and H the half-trace (x != 0), y = sqrt(B) (x = 0); a non-liftable x is redrawn
    and counted; P = [h](x, y), redrawn if O; then k_Q = integers(1, q) (uniform in [1, q-1]) and Q =
    [k_Q]P.'
  - 'I-3 curve targets: per draw a = integers(0, q) then b = integers(0, q); R = [a]P + [b]Q, redrawn
    (counted) if R = O. A ''draw'' is one (a, b) pair.'
  - I-4 the 1000 test targets of a family are 1000 accepted distinct x_R (duplicates and reference x_R
    rejected and counted). Targets with x_R in V are KEPT as the degenerate stratum (not redrawn) and
    excluded from every arm statistic and entropy, per the strata block.
  - 'I-5 reference_rule: every candidate drawn from the reference stream counts as a draw (including rejected
    duplicates, degenerate x_R and R = O redraws for curve streams); scanning stops at 3 unsat + 2 sat
    or at 500 draws. References are ordered U1, U2, U3 (unsat, in scan order) then S1, S2.'
  - 'I-6 F-AFF references: the F-S3 reference sequence is the S_ref stream re-generated from its seed
    with the same rejection rules (R = O, duplicate x_R, degenerate x_R); it is scanned from the start
    and each candidate is classified by oracle B of THIS F-AFF draw; the first 3 unsat and 2 sat are taken
    (up to 500 draws). F-AFF test targets use the r bits of the 1000 F-S3 test targets in draw order (degenerate
    ones inherit the degenerate stratum).'
  - 'I-7 F-AFF draw d: from S_nullAff_draw{d}, E''^0 then E''^j for j = 0..16, each by one integers(0,
    2, size=|supp|) call over the support positions of E^0 (resp. E^j) in row-major order of the 17 x
    172 matrix (columns in ''mu order'': degree ascending, then sorted index tuple lexicographic).'
  - 'I-8 F-NULLF2: one instance = one integers(0, 2, size=|U|) call over U = union_k U_k positions in
    row-major order; an instance identical to an earlier one (or to a reference) is rejected and counted.
    F-NULLF2 has no degenerate stratum and no oracle A.'
  - 'I-9 F-PLANT: F_V is enumerated exactly (x in V ascending; for x != 0 both points ordered by y; x
    = 0 gives (0, sqrt B)) and sorted by (x, y); each draw is two integers(0, |F_V|) calls from S_plant;
    rejections (P_1 = +-P_2, z in V, duplicate z, z an F-S3 target or reference) are counted. F-PLANT
    is scored against the 5 F-S3 references and the F-S3 modal reference (all 200 targets) and, per the
    modal rule applied per family, also against its own modal reference (targets 101..200).'
  - 'I-10 F-RANDX: x_R = integers(0, 2^17). References reject duplicates and degenerate x_R; test targets
    reject duplicates and reference x_R, and keep degenerate x_R as the degenerate stratum. Secondary
    cross-scoring is against the 5 F-S3 references and the F-S3 modal reference.'
  - 'I-11 maximizing reference (DR-3, DR-6, DR-7): the argmax of the unsat-arm T_strict retention at D
    = 4 over (U1, U2, U3, modal); ties go to the first in that order. Every per-reference value is also
    reported.'
  - 'I-12 M3 lower-bound case: the pooled Clopper-Pearson 95% upper bound is taken for 0 successes over
    the summed non-degenerate unsatisfiable arm sizes of F-AFF-1..3.'
  - 'I-13 M3 bootstrap (point case): 10^4 resamples, generator PCG64(S_selftest); for F-S3, F-AFF-1, F-AFF-2,
    F-AFF-3 in that order, one integers(0, n, size=(10^4, n)) call resamples the non-degenerate unsat
    arm; the modal reference''s retention in a resample uses the resampled targets with idx > 100.'
  - I-14 M2 / hazards for the modal reference use targets 101..N only; r-dependence (sampled) is evaluated
    over the scored non-degenerate targets. For F-NULLF2, dependence and K are over replay survivors (as
    the spec states).
  - 'I-15 C-UNIF: every F-RANDX reference including the modal (101..1000) at both D; the ''99.9% binomial
    interval'' is the equal-tailed acceptance region [lo, hi] of Binomial(n, 2^-K_rank) with at most 0.05%
    mass on each side outside it.'
  - 'I-16 tail check ''largest trace-class size vs uniform-over-distinct-traces null'': Monte Carlo, 1000
    replicates per (family, D, granularity), one generator PCG64(S_selftest) consumed in the fixed order
    families x D x granularity.'
  - 'I-17 trace encodings (canonical JSON, no whitespace, sha256): T_rank = the integer rank; T_set =
    [[sorted pivot columns],[sorted Z_D]]; T_strict = [[p,c],...]; T_ops = [[p,c,[sorted X]],...]. Target-vs-reference
    matches are decided by content (hash equality is cross-checked and any disagreement recorded).'
  - I-18 C-AFF is also applied to F-PLANT instances and all classified reference-scan candidates; the
    direct-replay check runs on the first 20 targets (draw order) of every affine-route family (F-S3,
    F-S3-REV, F-PLANT, F-RANDX, F-AFF-1..3) against every reference including cross-family and modal ones.
    For F-AFF the 'direct' instance is compared with a second, independent combination code path.
  - I-19 C-DET (phase 7, separate process) re-eliminates the 5 F-S3 references, the F-S3 modal reference
    and all 1000 F-S3 test targets at D = 3 and 4, and compares T_ops hashes.
  - I-20 PS0-PS3 are evaluated on every reference and every target of every family at both D (including
    degenerate targets). PS2 compares T_set by hash; for F-S3 it also includes F-PLANT; F-PLANT itself
    is covered through the F-S3 references.
  - I-21 rational_flag is computed for curve-algebra families only (F-S3, F-S3-REV, F-PLANT, F-RANDX);
    the lift is the deterministic lift of I-2 and the four sign combinations are covered by testing x(P_1
    + P_2) and x(P_1 - P_2) against x_R.
  - I-22 pruned dense bytes = rows_pruned * cols_pruned / 8 (not rounded); DR-6 compares this number with
    233,472 and 32.
  - 'I-23 workers: 1 (no sharding; the serial-vs-sharded demonstration is therefore not needed and not
    run).'
  - 'I-24 DR-2: a clause that cannot be evaluated makes the verdict ''not evaluable'' only if no evaluable
    clause decides it; the M3 consistency clause accepts ''not estimable'' as the spec states. DR-3: an
    M3 lower bound < 10 or a not-estimable M3 leaves the M3 clauses unknown.'
  - I-25 phase 7 runs as the declared determinism command in a separate process after phases 1-6; phase
    8 then runs via the declared resume form (driver command + --resume).
