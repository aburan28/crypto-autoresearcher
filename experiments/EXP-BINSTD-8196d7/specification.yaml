    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether Spearman ρ(r_Tr, N_nl) ≤ −0.70 on Stage-1 toy cells under
    twin agreement; deliver exactly one O-* label from H-BINSTD-b102b7.

  class: heuristic_validation
  class_note: >-
    Pre-registered Spearman band on an encoding-structure instrument. Not an
    exponent-moving breakthrough; no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Freeze V catalog (≥12 shapes) for Stage-1 and Stage-2
        candidate cells; freeze preregistered-predictions.json (band −0.70,
        seeds, encoder pin, Trace extractor); twin self-check on probe V.
      - >-
        Stage 1. For (n,ℓ)∈{(17,3),(17,4)} measure twin r_Tr and N_nl across
        the frozen catalog; write stage1/panels.json,
        stage1/control-table.json, RESULTS.md with exactly one O-* label.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Stage-2 multi-n panels and shuffled-linear null under this card.
      - Editing IDEA-20261001-878222 claim text or GOAL-ECDLP2M-001.yaml.
      - Editing the Spearman band after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.
      - Reopening reject_scoped bands (8bdf86 ell89, 591d28 H1 factor-4).
      - Designing IDEA-20261001-febbe1 / 20561e / f20e41 (already designed).

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-8196d7/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-8196d7/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-8196d7/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-8196d7/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-8196d7/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. implementation/run.py +
      check.py + gf2n.py + product_space.py + encode_s3.py are the
      hash-bound sources. Twin meters are the dual-implementation control.
      {run_dir} is substituted by the process supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261001-878222.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-b102b7.yaml
    spearman_band: -0.70
    catalog_seed: 202610038782
    stage1_cells:
      - {n: 17, ell: 3}
      - {n: 17, ell: 4}

  controls:
    - name: twin_rTr_Nnl
      definition: >-
        encode_s3 r_Tr and N_nl path A == path B on every measured V.
    - name: ctl_fixed_dim_V
      definition: Every Stage-1 V has exactly ℓ basis elements (dim ℓ).
    - name: ctl_frozen_V_catalog
      definition: Catalog frozen in stage0/v-catalog.json before Stage 1 (≥12 shapes).
    - name: ctl_shared_xorsat_pin
      definition: Encoder pin frozen in preregistered-predictions.json.
    - name: ctl_frozen_spearman_band_before_runs
      definition: Spearman band −0.70 frozen before Stage 1.
    - name: ctl_no_posthoc_band_edit
      definition: Band constant not edited after Stage-0 freeze.
    - name: ctl_distinct_rTr_floor
      definition: ≥3 distinct r_Tr values required; else O-INCONCLUSIVE.
    - name: null_shuffled_linear_block_rank
      definition: >-
        Stage 2 only (NOT AUTHORIZED). Named so the Stage-1 reading cannot
        silently claim the null.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_spearman_n17]
    - name: cell
      levels: ['(17,3)', '(17,4)']

  metrics:
    primary:
      - name: spearman_rTr_vs_Nnl
        unit: dimensionless
        definition: Spearman ρ(r_Tr, N_nl) across the frozen ≥12-shape catalog.
      - name: band_holds
        unit: boolean
        definition: spearman_rTr_vs_Nnl ≤ −0.70.
      - name: twin_agreement
        unit: boolean
        definition: Twin r_Tr and N_nl meters agree on every measured V.
    secondary:
      - name: r_Tr
        unit: integer
      - name: N_nl
        unit: integer
      - name: distinct_rTr
        unit: integer
      - name: bootstrap_ci_95
        unit: interval
      - name: wall_clock_seconds
        unit: seconds

  heuristic_under_test: HEUR-BINSTD-878222-H1

  preregistered_prediction:
    quantity: >-
      Spearman ρ(r_Tr, N_nl) ≤ −0.70 on each Stage-1 cell after twin
      agreement, across the frozen ≥12-shape catalog.
    formula: >-
      r_Tr = F_2-rank of Trace pure-linear block; N_nl = count of nonlinear
      clauses retaining a non-pivot variable after Trace-linear elimination;
      rho = Spearman(r_Tr, N_nl); band holds iff rho <= -0.70.
    source: >-
      ledger/proposals/IDEA-20261001-878222.yaml predictions; frozen before
      Stage 1 in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Encoding-structure instrument on n=17 only under this card. No transfer
      of a Spearman band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids band claims (O-ARTIFACT).
    - Catalog with <3 distinct r_Tr → O-INCONCLUSIVE (not O-SUPPORT).
    - Bootstrap CI reported beside point estimate; band decision uses point ρ.

  seeds_and_replication:
    catalog_seed: 202610038782
    bootstrap_seed: 202610038783
    independent_instances: 2
    note: >-
      Cells (17,3) and (17,4) are independent instances. Twin meters are the
      replication instrument for each V.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 2.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and v-catalog.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-BINSTD-b102b7.
    - maximum_runs = 4.
    - Do not open Stage-2 under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure → O-ARTIFACT; do not read band as support.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok true on probes; Stage 1 produces
    Spearman ρ(r_Tr, N_nl) vs ≤−0.70 band for each Stage-1 cell with twin
    agreement (or a named O-ARTIFACT/O-IMPEDIMENT/O-INCONCLUSIVE stop);
    RESULTS.md names exactly one O-* label from H-BINSTD-b102b7 with cited
    artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; post-hoc Spearman-band edit; a claimed
    break/exponent under this card. (O-FAIL-BAND is a valid scientific
    negative of O-SUPPORT, not a protocol fail.)

  required_artifacts:
    - experiments/EXP-BINSTD-8196d7/trial-plan-v1.json
    - experiments/EXP-BINSTD-8196d7/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-8196d7/stage0/v-catalog.json
    - experiments/EXP-BINSTD-8196d7/stage1/
    - experiments/EXP-BINSTD-8196d7/RESULTS.md
    - experiments/EXP-BINSTD-8196d7/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-8196d7/implementation/run.py
    - experiments/EXP-BINSTD-8196d7/implementation/check.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
