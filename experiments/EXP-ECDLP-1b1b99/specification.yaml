        wall_clock_seconds: 600
        cpu_hours: 0.16666666666666666
        maximum_memory_gb: 8
        parallel_shards: 1
  stopping_rules:
    - "Stop at first failed exact control; preserve all outputs and issue invalidity report."
    - "Stop on any stage CPU/wall or 8 GiB process-group RSS cap; retain partial coverage as inconclusive, never negative."
    - "Stop after fixed panel and matrix; no search for extra favorable curves or q beyond4096."
  invalidation_rules:
    - "Missing dual/level/subgroup certificate, incorrect β identity, hidden scalar access, per-input memoization, missing setup costs or unrecorded baseline choice invalidates affected comparison."
    - "A timing block failing 0.1 CPU second target after100 repeats is below resolution; do not infer a ratio from it. Repeated run budget cannot be silently expanded."
  success_criterion: "Complete valid six-class panel; R4096>=1.20 for all six classes in both seeds and every coordinate arm; mandatory top baseline and full search charges included. This nominates only the known auxiliary calibration for independent verification."
  falsification_criterion: "Complete valid six-class panel and R4096<=1 for all six classes in both seeds and every coordinate arm: no amortized gain of the specified kind at the tested scale. Any mixed outcome, gain below20%, missing panel or unstable timing is inconclusive for the declared hypothesis."
  decision_branches:
    positive: "Independently verify the full-cost crossover; only then decide whether a separate ECDLP-use reduction is worth designing. No scaling or execution auto-authorized."
    negative: "Record measured cost gap and the exact panel; consider whether construction overhead is a reusable resource or whether a different auxiliary operation merits a new proposal. No closure of isogeny arithmetic."
    inconclusive: "Record which selection, correctness, timing or effect threshold failed. Rerank before any amendment; do not widen q or fixture ranges automatically."
  tail_checks:
    - "Report worst class/floor/coordinate cost ratio and all failed discovery candidates; no best-endpoint-only headline."
  overlap:
    nearest:
      - "IDEA-20260807-3f5545"
      - "IDEA-20260905-7c2cc1"
      - "EXP-ECTD-9e4248"
    difference: "Those inspected records concern conductor-stratified Semaev/Macaulay functionals or mixed Hecke differences. This fixes the known CM endomorphism evaluation and its setup/transport cost as a reusable calibration. No claim that nobody has studied endomorphism acceleration."
  artifact_binding: "All required paths are relative to this experiment directory. <run-id> is allocated and collision-checked by the execution control plane before any future run, then bound once in its approved Executor handoff; this design creates no run id or run record. Manifest must record exact command, commit/dirty state, environment/backend, model provenance, seeds, UTC timestamps, resource measurements and validity. Fixtures retain accepted/rejected candidates and certificates; raw.jsonl retains every cell/attempt; costs separates measured and modeled quantities; report states coverage and decision branch."
  operation_count_rule: "Only explicitly instrumented arithmetic yields measured operation counts. Opaque Sage/PARI/library arms report operation counts unavailable, plus measured CPU/wall/RSS; never infer exact counts from elapsed time. The primary comparison is CPU, using the same process/backend and declared timing convention."
  randomness:
    hash: "SHA256, UTF-8 bytes of JSON.stringify([experiment_id,purpose,[p,A,B,r,k,u,arm],seed,counter]); JSON has no whitespace; integers decimal; unused numeric tuple fields0; seed and counter are nonnegative integers. Read digest as unsigned256-bit big-endian integer. Separate counter starts0 for each complete tuple excluding counter."
    uniform: "To draw uniform integer in[0,n), reject digest >= floor(2^256/n)*n; increment counter on every digest including rejection; accepted output is digest mod n. For n=1 output0 and consume one digest. No platform PRNG or modulo-biased draws."
    purposes: "Use exactly query for input scalars, control for random control scalars, field_x for extension point coordinates, target for spectral target scalar, shuffle for Fisher-Yates. Each list follows increasing query/control/coordinate index. Arm is0 except shuffled partitions1..7. Scalar timing seed is the declared seed. Fixture selection has no randomness."
    shuffle: "Fisher-Yates starts from canonical sorted input and for i=n-1 down to1 draws j uniformly in[0,i], then swaps entries i,j. Curve subgroup point order is infinity first, then increasing integer x and y; extension coefficient-vector order is increasing integer sum_j a_j p^j."
    pairing: "For query/control/field_x/target streams, use original unscaled curve coefficients A,B with u=0 and arm=0 so coordinate models share the same underlying sampled inputs. For shuffle use original A,B and actual u in1,2,3 and actual arm1..7. In all cases k is actual embedding degree for character experiment and0 otherwise. Counter persists globally for each complete stream tuple across all calls; never reset between draws. Spectral target is selected once per fixture/seed before any u or shuffle. Volcano floor-specific A,B are original normalized floor coefficients; query lists for coordinate variants are exact transports of the same samples."
  evidence_eligibility_note: "evidence_eligible:false describes this unexecuted design record. Future run evidence eligibility requires an explicit committed approval/lock that names this frozen specification and its permitted claim scope; no results are forbidden merely because their prospective design was not itself evidence."
