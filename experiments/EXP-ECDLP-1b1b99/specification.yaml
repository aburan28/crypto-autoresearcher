  id: "EXP-ECDLP-1b1b99"
  hypothesis_id: "H-ECDLP-234ae4"
  source_proposal: "IDEA-20260905-1dd2e5"
  title: "Charged conductor-3 CM auxiliary-map calibration across a j=1728 volcano"
  objective: "Measure a real representation-dependent auxiliary computation, [3λ]P, rather than an unspecified easy operation or an ECDLP claim. Freeze a deliberately small known-resource panel; determine whether transport can pay in single-query and explicitly amortized settings. Baseline and coordinate controls precede timing."
  inputs:
    selection: "Enumerate primes p in increasing order in [2^12,2^13), [2^14,2^15), [2^16,2^17), with p=1 mod4. For E0:y^2=x^3-x require nonsingular ordinary E0, trace t!=0, integer fπ=sqrt((4p-t^2)/4), v3(fπ)=1, and full rational E0[3] (nine points, eight nonzero, four distinct cyclic kernels). Let r be the largest prime divisor of N=#E0(Fp); require r>=127, r!=3,p, v_r(N)=1. Select first two eligible p per interval before any timing. Search at most 4096 prime candidates total and stop at preparation budget. Never replace a selected slow instance."
    field_and_points: "Field elements canonical integers 0..p-1. Choose iota as the smaller square root of -1. Choose G0 by scanning affine points lexicographically in (x,y), multiplying by N/r, taking first nonzero output; at most 4096 x values. Record all candidate work. Enumerate rational 3-kernel generators canonically (pair ±K shares a kernel), sort by kernel polynomial coefficients. Construct all four normalized Vélu φj and their exact duals ψj; certify duals and normalize codomain model/isomorphism explicitly."
    levels: "E0 has maximal order Z[i]. Require all four distinct quotient models to have conductor 3, using a certificate of Dπ=-4 fπ² and the degree-3 downward edge from maximal order with 3 inert in Q(i); count rational 3-isogenies on each quotient as a crosscheck, retaining multiplicities and exceptional-j bookkeeping. Independent mathematical review must certify this level rule before execution. A missing certificate is unavailable_fixture, never an assumed label."
    eigenvalue: "Calculate the two square roots ±λ of -1 modulo r, test both [λ]G0 against i(G0), choose the unique match; charge modular square root and both scalar multiplications. Gi=φi(G0) is nonzero, order r; require ψi(Gi)=[3]G0. m=(3λ mod r)."
    queries: "q in [1,16,256,4096], independent input points Rj=[sj]Gi with sj uniformly drawn from 1..r-1 by SHA256 rejection sampling. Repetition is allowed and flagged when q>r. No per-input cache, full multiplication table or scalar labels are supplied to timed evaluator. Generator/fixture labels live only in verifier input; normal form of public curve, r,m, φ,ψ is allowed."
    unavailable_fixture: "If fewer than two eligible classes per interval or a certificate/point search cap fails, retain the partial panel and report incomplete/inconclusive. Do not expand ranges, lower r, alter v3(fπ) or substitute a different CM family."
  controls:
    - id: "composition"
      description: "On G0/Gi and 128 seed-derived public scalars per endpoint verify dual identities, i²=-1 and β=[m]; replay every measured output against the fastest declared scalar baseline."
    - id: "coordinate"
      description: "Repeat equivalent workloads under (x,y)→(u²x,u³y), u=2,3, including equation/map conjugation. Both arms use the same backend and coordinate convention, and conversion/setup is charged. Structural operation counts should match after canonical normalization; discrepant counts are an instrument warning requiring explanation before interpretation."
    - id: "level"
      description: "Compare maximal E0 direct [3]i against scalar m, and all four conductor-3 floors against one another. The four floors are paired endpoints within one class, not independent classes. Do not call top-vs-floor timing a causal conductor effect: special automorphism and map form are intentionally linked."
    - id: "identity_transport"
      description: "φ=ψ=identity on the same curve with direct i is a map-overhead calibration; report its setup separately. A deliberately wrong eigenvalue sign must fail a nonzero-point identity check."
    - id: "label_permutation"
      description: "Permute floor labels and reaggregate the same costs; class summary must be unchanged. Do not assign significance to permutation of only two genuinely different arithmetic levels."
  independent_variables:
    - "p interval and class"
    - "top versus conductor-3 floor; four paired floor maps"
    - "coordinate scaling u=1,2,3"
    - "q=1,16,256,4096"
    - "algorithm arm and seed"
  metrics:
    primary:
      - "Per-class fully charged total CPU ratio Rq=Tbest_scalar(q)/Ttransport(q), with all four floors aggregated with equal weight. Report q=1 separately; success primary is q=4096."
      - "Break-even q*: least q in frozen query ladder with Rq>=1, or >4096; no interpolated empirical claim."
    secondary:
      - "Construction/evaluation/verification CPU and wall seconds, peak RSS, map degree/coefficient bytes, field multiplications/squarings/inversions, group operations and table bytes."
      - "One-shot ratio; each floor and each coordinate arm; minimum/maximum per-class ratio; cold and warm totals kept separate."
  algorithms:
    transport: "For each floor evaluate ψi(R), i(result), φi(result); this returns [3λ]R, NOT [λ]R. No omitted multiplication by 3 inverse. Source floor known via fixture construction; all forward discovery costs are included. General backward path search from an arbitrary floor is outside the measured interface."
    baseline: "Compare binary double-and-add, width-w nonadjacent scalar multiplication w=2,3,4,5 including every per-point table, and pinned library scalar multiplication [m]R. Scalar is fixed but points vary. Choose fastest baseline using only seed 606101 at q=256; freeze choice before reporting confirmatory seed 606103. Also report the oracle minimum across these arms as a conservative descriptive comparator and disclose selection. No unsupported claim to best possible scalar algorithm. On E0 add direct [3]i as mandatory known-resource baseline."
    cost_formula: "Let Cshared be only constructing the supplied public source curve equation, verifying nonsingularity, reading supplied public N and r and their primality/divisibility certificates, and reading supplied m. Primary Ttransport(q)=Cshared+Cdiscovery_all_candidates+Cpointcount_factor+Ckernel_search+Cmaps+Clevel_cert+Ceigenvalue_sign+Cnormalization+sum_q(Cψ+Ci+Cφ+Cverify). Primary Tscalar(q)=Cshared+Calgorithm_selection+Cscalar_setup+sum_q(Cmul+Cverify). Discovery, point counting/factorization used to find the chosen source, level certificates, maps and λ-sign identification are unique to transport and never canceled or credited to the scalar branch. Cshared is included on both primary totals and may be canceled only in a separately labelled secondary table. Query-generation cost is shared experimental scaffolding, reported separately; scalar labels never reach either evaluator. Charge actual timing repetitions to resource budget; normalize only to the declared q workload. Setup is counted once per class batch, never spread across unrelated classes."
  preregistered_prediction:
    quantity: "Full auxiliary gain at q=4096"
    formula: "R4096>=1.20 on all six classes, both measurement seeds, each coordinate arm; a deliberately demanding finite-panel target rather than a distribution theorem."
    source: "Coordinator empirical hypothesis H-ECDLP-234ae4; no retrieved source asserts this numeric gain."
  replication:
    seeds:
      - 606101
      - 606103
    independent_instances: 6
    unit: "Class is the unit; four floors and coordinate models are paired controls, not independent replicates."
    timing: "Warm one untimed call per arm; then seven timed blocks per workload, each repeating the entire query list until >=0.1 CPU seconds or 100 repeats. Report median block CPU, all blocks and repeats. Charge actual repeated execution to run resource budget; normalize per workload for cost table. Alternate arm order by seed and report wall/CPU disagreement."
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 2
    maximum_memory_gb: 8
    maximum_runs: 1
    maximum_workers: 1
  resource_estimate:
    wall_clock_seconds: 7200
    cpu_hours: 2
    maximum_memory_gb: 8
    maximum_runs: 1
    dominant_cost: "Fixture discovery and instrumented repeated auxiliary evaluations."
    dominant_stage_id: "measure"
    stages:
      - id: "prepare"
        purpose: "Deterministic fixtures, levels, duals and eigenvalue certificates"
        wall_clock_seconds: 2400
        cpu_hours: 0.6666666666666666
        maximum_memory_gb: 8
        parallel_shards: 1
      - id: "audit"
        purpose: "Correctness, sign, coordinates and baseline freeze"
        wall_clock_seconds: 1200
        cpu_hours: 0.3333333333333333
        maximum_memory_gb: 8
        parallel_shards: 1
      - id: "measure"
        purpose: "Frozen matrix of full-cost measurements"
        wall_clock_seconds: 3000
        cpu_hours: 0.8333333333333334
        maximum_memory_gb: 8
        parallel_shards: 1
      - id: "report"
