experiment:
  id: EXP-XEDN-005
  hypothesis_id: H-XEDN-004
  version: 1
  title: >-
    Raised deg-a (≤4) MW relation-coefficient census on non-isotrivial surfaces
  status: approved
  objective: >-
    Measure max_|coeff| of the shortest group-law-verified Mordell-Weil
    relation among free-x sections (deg x≤2, deg y≤3) on non-isotrivial
    surfaces with a≠0, deg a≤4, deg b=6, j non-constant at p∈{7,13,19,31},
    testing whether the GOAL-XEDN-001 bound survives the RT-XEDN-004 deg-a
    raise (the executable form of that control; deg x≤3 is empty on deg-b=6).
  inputs:
    primes: [7, 13, 19, 31]
    family:
      form: "y^2 = x^3 + a(t) x + b(t)"
      deg_a_max: 4
      deg_b: 6
      a_nonzero: true
      j_nonconstant_required: true
    section_shape:
      deg_x_max: 2
      deg_y_max: 3
      exclude_y_zero: true
    square_predicate: >-
      Frozen EXP-XEDN-001 is_square_poly on f = x^3 + a*x + b, with content
      scaling so y=s*h is on-curve.
    eligibility:
      - a ≠ 0 and deg(a) ≤ 4
      - j non-constant
      - disc 4a^3+27b^2 not identically zero
      - ≥2 free-x slots (≥4 preferred)
      - target ≥10 eligible at p=31 when feasible
    relation_verification:
      method: >-
        primary shortest relation via group-law small-support search; verified
        over F_p(t) and by specialisation ≥20 smooth fibres; height-Gram
        diagnostic only
      primary_metric: infinity-norm of shortest nonzero integer relation
  controls:
    - Isotrivial a=0 surfaces excluded from primary trend.
    - μ₃ absence control on eligible surfaces.
    - Baseline: EXP-XEDN-004 deg-a≤2 bound (max_|coeff|=1).
  independent_variables:
    - p
    - surface (a,b)
  metrics:
    primary:
      - max_abs_coeff_shortest_relation_by_p
      - slope_max_abs_coeff_vs_log_p
      - n_eligible_surfaces_by_p
    secondary:
      - mu3_orbit_on_curve_fraction
      - deg_a_histogram
  replication:
    seeds: [2026072511, 2026072512]
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2
    maximum_memory_gb: 4
    maximum_runs: 6
  stopping_rules:
    - Stop a size after ≥5 eligible surfaces with verified relations (≥10 at p=31 when feasible), or budget.
  invalidation_rules:
    - a=0 or constant j counted as eligible → invalid trend.
    - Relations without specialisation verification → invalid for primary metric.
    - Timeout/crash → failed_infrastructure, not mathematical evidence.
  success_criterion: >-
    max_|coeff|(p) ∈ {1,2,3} at every tested p and slope vs log p has uncertainty
    including 0.
  falsification_criterion: >-
    Slope vs log p excludes 0, OR any verified shortest relation has
    infinity-norm ≥4 on an eligible surface.
  required_artifacts:
    - experiments/EXP-XEDN-005/runs/*/manifest.yaml
    - experiments/EXP-XEDN-005/runs/*/raw-result.json
    - experiments/EXP-XEDN-005/runs/*/stdout.log
    - experiments/EXP-XEDN-005/execution_report.md
  assigned_to: executor
  approved_by: coordinator
