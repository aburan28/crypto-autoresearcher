# =============================================================================
# EXP-CERTBIN-66e167 -- VERSION 1 (APPROVED by DEC-20261003-fa8703)
# Replication contract for H-CERTBIN-c50454 after EV-CERTBIN-db7f15 /
# DEC-20261003-34a65b weaken of uniform HEUR-1 at n=19 (EXP-CERTBIN-9ea3d0).
# New seeds 2026100311/12/13 (disjoint from 2026100301/02/03).
# Stage-0 freeze locked (Stages 1-2 MUST NOT rewrite Stage-0 artifacts).
# n=17 still unpooled nearby object. Stages 0-2 authorized.
# ZERO RUNS. No AUXIN. No Bedrock. No ECDLP/exponent/KN-FIND. No 8bdf86/591d28.
# =============================================================================
experiment:
  id: EXP-CERTBIN-66e167
  hypothesis_id: H-CERTBIN-c50454
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260930-d2d20c
  goal_id: GOAL-ECDLP2M-001
  goal_ids: []
  goal_ids_note: >-
    Shared GOAL-ECDLP2M-001.yaml is not edited in this archive (concurrent
    lanes). Operative next_action lives on DEC-20261003-fa8703.
  version: 1
  title: >-
    n=19 HEUR-1 replication (new seeds; Stage-0 freeze locked; n=17
    unpooled) after EV-CERTBIN-db7f15 / DEC-20261003-34a65b weaken
  status: approved
  approved_by: DEC-20261003-fa8703
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  designed_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1, 2]
  execution_authorized_note: >-
    Stages 0-2 authorized by DEC-20261003-fa8703 under AGENTS.md standing
    user authorization (2026-09-06), in fact only after snapshot
    TASK-20261003-c87f79 verifies against Git. No Magma/Sage/AUXIN/Bedrock.
    No ECC2K-130 solve. No /run in the design tick.
  assigned_to: executor
  predecessor:
    experiment_id: EXP-CERTBIN-9ea3d0
    evidence_id: EV-CERTBIN-db7f15
    decision_id: DEC-20261003-34a65b
    excluded_seeds: [2026100301, 2026100302, 2026100303]
  approval:
    approved_by: DEC-20261003-fa8703
    composing_decision: DEC-20261003-fa8703
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06)
      once the protocol was complete. Approval does not assert HEUR-1 is
      true. Cites EV-CERTBIN-db7f15 / DEC-20261003-34a65b as the weaken
      gate this replication answers (NA-1).
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
  objective: >-
    Replicate the n=19 informative/birthday HEUR-1 census under a new
    frozen seed set with Stage-0 predictions locked before Stage 1,
    Z/rZ control, and unpooled n=17 nearby report; deliver exactly one
    O-* label. Prefer this replicate before any stronger adverse call.
  class: heuristic-validation
  class_note: >-
    Pre-registered birthday prediction for HEUR-1 at a toy cell.
    Replication of EXP-CERTBIN-9ea3d0 after scoped weaken.
  claim_tier_and_scope:
    claim_tier: toy
    statement: >-
      Collision-census instrument at n=19 E_0, r=130873, m=3, k in {2,3},
      new seeds only. No Certicom instance. Transfer of delta NOT claimed.
    sota_delta: zero on every ECDLP cost axis
    dominated_by: Pollard rho dominates any reading of a toy collision census.
    certificate_kind: instrument_checksum
    certificate_note: Stage-0 freeze SHA-256; geometric kernel; Z/rZ band.
    affected_vs_safe: No deployed or standardized curve is touched or affected.
  scope:
    included:
      - Stage 0: re-measure n=19 order/r/primality; freeze C_eff and birthday; kernel check; write preregistered-predictions.json + sha256 BEFORE Stage 1.
      - Stage 1: n=19 census k in {2,3} x {primary, holdout} plus Z/rZ; MUST NOT rewrite Stage-0 files.
      - Stage 2: n=17 nearby unpooled rows + RESULTS.md with exactly one O-* label; MUST NOT rewrite Stage-0 files.
    excluded:
      - Magma/Sage/cypari2/AUXIN as the success path.
      - Amazon Bedrock.
      - m=83 / m=131 cells; ECC2K-130 solve.
      - Editing IDEA-20260930-d2d20c or shared GOAL-ECDLP2M-001.yaml.
      - Reopening EXP-BINSTD-8bdf86 or EXP-BINSTD-591d28.
      - Pooling n=17 with n=19.
      - Re-using predecessor seeds 2026100301/02/03.
      - Rewriting Stage-0 freeze artifacts from Stage 1 or Stage 2.
      - Treating infra failure as negative evidence against HEUR-1.
      - reject_scoped or KN-FIND on this design tick.
  execution_surface:
    trial_plan: experiments/EXP-CERTBIN-66e167/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-CERTBIN-66e167/implementation/run.py --stage 0
      --trial-plan experiments/EXP-CERTBIN-66e167/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-CERTBIN-66e167/implementation/run.py --stage 1
      --trial-plan experiments/EXP-CERTBIN-66e167/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage2: >-
      python3 experiments/EXP-CERTBIN-66e167/implementation/run.py --stage 2
      --trial-plan experiments/EXP-CERTBIN-66e167/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Stages 1-2 load the Stage-0 freeze and refuse if the freeze SHA-256
      drifts. Runnable via tools/experiment_execution.py load_plan.
  inputs:
    proposal: ledger/proposals/IDEA-20260930-d2d20c.yaml
    hypothesis: ledger/hypotheses/H-CERTBIN-c50454.yaml
    question: ledger/questions/RQ-CERTBIN-836ce2.yaml
    predecessor_evidence: EV-CERTBIN-db7f15
    predecessor_decision: DEC-20261003-34a65b
    n19_order_prior: experiments/EXP-BINSTD-5d3ec0/stage0/n19-order-check.yaml
    cells:
      measure:
        n: 19
        modulus: t^19 + t^5 + t^2 + t + 1
        curve: 'y^2 + xy = x^3 + 1'
        A: 0
        B: 1
        order_expected: 523492
        r_expected: 130873
      nearby:
        n: 17
        modulus: t^17 + t^3 + 1
        curve: 'y^2 + xy = x^3 + 1'
        A: 0
        B: 1
    seeds:
      primary: 2026100311
      holdout: 2026100312
      zr_control: 2026100313
      excluded_predecessor: [2026100301, 2026100302, 2026100303]
    k_list: [2, 3]
    m: 3
  controls:
    - name: geometric_kernel
      description: '[2]P + tau(P) + tau^2(P) = O on two points; failure -> O-ARTIFACT.'
    - name: zr_uniform
      description: 'Z/rZ ratio outside [1/2, 2] -> O-ARTIFACT.'
    - name: n17_not_pooled
      description: n=17 reported in stage2 and not pooled into the n=19 O-* label.
    - name: holdout_seed
      description: Second n=19 seed 2026100312.
    - name: stage0_freeze_lock
      description: >-
        After Stage 0, SHA-256 of preregistered-predictions.json is written
        to stage0/preregistered-predictions.sha256. Stages 1 and 2 re-hash
        and refuse (O-ARTIFACT) if the bytes changed (PD-2 fix).
    - name: memory_beside_time
      description: Peak RSS stated beside wall time in RESULTS.md.
  independent_variables:
    - name: stage
      levels: [0, 1, 2]
    - name: k
      levels: [2, 3]
    - name: seed
      levels: [2026100311, 2026100312]
    - name: n
      levels: [19, 17]
  metrics:
    primary:
      - informative_colliding_pairs
      - birthday_expectation
      - ratio_informative_over_birthday
      - o_star_label
      - stage0_freeze_sha256
    secondary:
      - raw_colliding_pairs
      - kernel_colliding_pairs
      - heaviest_fiber
      - B_phys
      - additions_charged
      - peak_rss_bytes
      - n17_r_is_prime
      - kernel_rows_nonzero_in_Fr
  heuristic_under_test: HEUR-1
  preregistered_prediction:
    quantity: >-
      informative_colliding_pairs / (C_eff (C_eff-1) / (2 r)) at n=19,
      m=3, k in {2,3}
    formula: >-
      C_eff = min { C : C(C-1)/(2r) >= 5 }, required also <= 50.
      Predicted ratio in [1/2, 2]. r^{0.05} is the exponent-reading
      threshold, not the prediction. Frozen in Stage 0 before Stage 1
      and never rewritten from later stages.
    source: >-
      IDEA-20260930-d2d20c HEUR-1; replication after EV-CERTBIN-db7f15 /
      DEC-20261003-34a65b. Birthday theorem recalled (not opened).
  scale_relevance:
    tier: toy
    justification: >-
      n=19, r=130873. C_eff ~ 1145 so expected collisions ~5. No transfer
      of delta to m=83.
    correspondence: null
  tail_checks:
    - Heaviest fiber among n=19 informative collisions is at most 4 when expectation <= 50.
  replication:
    seeds: [2026100311, 2026100312]
    zr_control_seed: 2026100313
    independent_instances: 2
    replication_note: >-
      Successor replicate of EXP-CERTBIN-9ea3d0 under new seeds.
      Predecessor seeds are forbidden.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 3
    maximum_workers: 1
  stopping_rules:
    - Stop after Stages 0-2 complete or after a named O-ARTIFACT / O-IMPEDIMENT.
    - Stage 0 kernel or order mismatch stops before Stage 1.
    - Stage 1 Z/rZ failure stops before reading n=19 ratios as science.
    - Stage-0 freeze hash mismatch on Stage 1/2 entry is O-ARTIFACT.
    - A crash or timeout is incomplete, never negative evidence against HEUR-1.
  invalidation_rules:
    - n=19 order is not 523492 or r is not prime 130873.
    - Kernel identity fails on E_0.
    - Z/rZ ratio outside [1/2, 2].
    - n=17 rows are pooled with n=19.
    - Magma/Sage/AUXIN/Bedrock used as the success path.
    - A discrete logarithm of a public target is claimed.
    - Stage-0 freeze rewritten after Stage 0 completed.
    - Predecessor seeds 2026100301/02/03 used.
  success_criterion: >-
    Stage 0 freeze exists with sha256; Stage 1 writes n=19 ratios and the
    Z/rZ control without rewriting Stage 0; Stage 2 writes unpooled n=17
    rows; RESULTS.md names exactly one of O-BIRTHDAY, O-DELTA-N19,
    O-MIXED, O-ARTIFACT, O-IMPEDIMENT; freeze hash still matches.
  falsification_criterion: >-
    Z/rZ control in band AND every n=19 (seed, k) cell has
    informative/birthday ratio >= r^{0.05} AND heaviest fiber <= 4.
    That falsifies HEUR-1 at n=19 only on this seed set.
  labels:
    O-BIRTHDAY: every n=19 (seed, k) ratio in [1/2, 2] and tails pass
    O-DELTA-N19: every n=19 (seed, k) ratio >= r^{0.05} and Z/rZ in band
    O-MIXED: neither uniform reading
    O-ARTIFACT: kernel, order, Z/rZ, or Stage-0 freeze-lock instrument failure
    O-IMPEDIMENT: timeout/crash/missing dependency; not evidence
  required_artifacts:
    - experiments/EXP-CERTBIN-66e167/trial-plan-v1.json
    - experiments/EXP-CERTBIN-66e167/stage0/preregistered-predictions.json
    - experiments/EXP-CERTBIN-66e167/stage0/preregistered-predictions.sha256
    - experiments/EXP-CERTBIN-66e167/stage1/n19-census.json
    - experiments/EXP-CERTBIN-66e167/stage2/n17-nearby.json
    - experiments/EXP-CERTBIN-66e167/RESULTS.md
    - experiments/EXP-CERTBIN-66e167/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CERTBIN-66e167/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CERTBIN-66e167/implementation/run.py
    - experiments/EXP-CERTBIN-66e167/implementation/check.py
  trial_plan: experiments/EXP-CERTBIN-66e167/trial-plan-v1.json
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
  out_of_scope:
    - Any Groebner/SAT solve.
    - Any claim that a k-orbit base beats rho.
    - KN-FIND from this design packet.
    - reject_scoped without a completed replicate package and review.
