experiment:
  id: EXP-PFDR-410259
  hypothesis_id: H-PFDR-d3c527
  question_id: RQ-ECDLP-160d89
  idea_id: IDEA-20260901-d77aa8
  batch_id: BATCH-c64bee
  version: 1
  recorded_at: '2026-09-04'
  drafted_under_task: TASK-20260904-9c61a9
  status: draft
  approved_by: null
  approved_at: null
  assigned_to: executor
  status_note: >-
    Frozen at the design stage; NOT submitted for approval and NOT authorized for
    implementation.
  record_shape: >-
    A ZERO-RUN STATIC AND SYMBOLIC PROTOCOL PLUS ONE LITERATURE EXTRACTION. This
    is not a stylistic choice: RQ-ECDLP-160d89 declares its claim boundary as
    static theorem and certificate architecture only, with NO implementation,
    experiment, curve generation, run or ECDLP result authorized. maximum_runs is
    0 and replication.seeds is empty with a stated reason. The exact Fourier
    instrument that would measure the support exponent at toy scale without
    running a join is DELIBERATELY NOT PROPOSED HERE and would need its own
    authority.
  title: >-
    Derive the keyed-leaf-join concentration row as an additive-energy identity
    and its Fourier dual, verify it on TWO CURVE-FREE POSITIVE CONTROLS where
    concentration is provably present, and EXTRACT the exact form of the one
    character-sum bound the coordinate-key conclusion depends on -- reporting
    whichever form the sources actually contain, with a declared downgrade path if
    the needed form is absent.
  claim_ceiling: >-
    An exact identity, a NECESSARY condition on the key for any concentration
    beyond uniform, and the closure of the coordinate-bucket family CONDITIONAL on
    one extracted bound. It can never certify that no key with large Fourier bias
    exists, nor anything about joins that are not keyed leaf joins. No
    implementation, no curve generation, no ECDLP result, no sub-rho mechanism.
  claim_tier_basis: >-
    DERIVATION TIER. No solve is claimed and no certificate of any cryptographic
    kind can arise. Every value is either an exact algebraic quantity or a verbatim
    transcription from a source an agent actually opened.
  objective: >-
    Establish, IN THIS ORDER: (1) the energy identity and its Fourier dual WITH
    EXPLICIT CONSTANTS, including the loss incurred in the cross-fibre bound; (2)
    that the identity FIRES on two CURVE-FREE positive controls where the fibres
    are provably biased, returning the corner exponent exactly on both, and that it
    returns the uniform value on a random-key null; (3) the necessary-condition
    threshold as a function of the support exponent and the key count, with its
    behaviour at both ends of the range stated; (4) THE LITERATURE EXTRACTION --
    the exact statement and quantifiers of each named character-sum bound,
    recorded verbatim, and a determination of whether the MIXED form the
    coordinate-key conclusion needs actually exists; and (5) the downstream
    learner-cost comparison, as a corollary shared with a sibling proposal and not
    as independent evidence.
  band_non_degeneracy:
    statistic: >-
      the largest modulus of a nonzero-frequency Fourier coefficient of a fibre
      indicator, compared against the threshold the necessary condition imposes
    null_value: >-
      the random level, the square root of the fibre size, achieved by a uniformly
      random key
    alternative: >-
      the threshold required for concentration, which at the balanced key count
      equals the group order raised to one minus half the support exponent
    computed_check: >-
      THE STATISTIC HAS A FACTOR OF ROUGHLY THE CUBE ROOT OF THE GROUP ORDER OF
      DYNAMIC RANGE. At the balanced key count the fibre size is the group order to
      the power two thirds, so a maximally biased fibre indicator -- a subgroup
      coset -- attains that value, while a random key attains only the group order
      to the power one third. The Weil level sits between them at one half. The
      required threshold equals the group order to the power one minus half the
      support exponent, which is EXACTLY the Weil level when the exponent is 1 and
      rises strictly above it for every smaller exponent, reaching relative order 1
      at the corner. So the condition is exactly non-binding at the null and
      strictly binding below it, with the whole interval from one third to two
      thirds available for the statistic to move in.
    resolution: >-
      RETAINED, WITH ITS LIMIT STATED RATHER THAN HIDDEN. Near an exponent of 1 the
      required threshold exceeds the Weil level only by the logarithmic cofactor,
      so the argument EXCLUDES concentration asymptotically and CANNOT exclude an
      exponent of 1 minus a term of order the log-log over the log of the group
      order. That is exactly the claim made and no more. Separately, the contract
      records that a toy-scale MEASUREMENT of the exponent would sit inside the gap
      between the Weil level and the random level at reachable field sizes and
      would therefore be INCONCLUSIVE BY CONSTRUCTION -- which is one reason no
      measurement is proposed here.
  inputs:
    positive_controls:
      - 'CURVE-FREE: a vector space over the two-element field with a prefix key, whose fibres are cosets of a subgroup so the indicator is maximally biased'
      - 'CURVE-FREE: a cyclic group with a top-bits-of-exponent key, whose fibres are exponent intervals'
    null_control: 'CURVE-FREE: a uniformly random key at the same class count'
    target_object: 'a coordinate-interval bucket leaf key on a prime-order elliptic-curve group, treated SYMBOLICALLY ONLY'
    extraction_sources: >-
      the two named exponential-sum papers, to be OPENED and their exact statements
      and quantifiers transcribed verbatim, with the determination of whether the
      MIXED form exists recorded either way
    runs: 0
    curve_generation: none
    lists_built: none
  controls:
    - id: CTRL-CURVE-FREE-POSITIVE-1
      row_class: positive_control
      blocking: true
      object: 'the vector-space prefix key, fibres cosets of a subgroup'
      forced_disposition: >-
        The identity MUST return the corner support exponent exactly, the
        collision probability equal to the reciprocal of the complementary subgroup
        size, and the largest Fourier coefficient exactly equal to the fibre size.
        THIS CONTROL CONTAINS NO CURVE and its purpose is to demonstrate that the
        identity fires where concentration is provably present. A deviation voids
        the record.
    - id: CTRL-CURVE-FREE-POSITIVE-2
      row_class: positive_control
      blocking: true
      object: 'the cyclic group with a top-bits-of-exponent key, fibres exponent intervals'
      forced_disposition: >-
        The identity MUST return the corner support exponent exactly, with the
        largest Fourier coefficient of the order of the fibre size divided by a
        fixed constant. ALSO CURVE-FREE. A deviation voids the record.
    - id: CTRL-RANDOM-KEY-NULL
      row_class: null_object
      blocking: true
      object: 'a uniformly random key at the same class count'
      forced_disposition: >-
        MUST return the random level for the largest coefficient and the uniform
        support exponent up to the logarithmic term. This is the FLOOR: any
        coordinate key must sit between it and the Weil level.
    - id: CTRL-EXTRACTION-VERBATIM
      row_class: instrument
      blocking: true
      object: 'each named character-sum source'
      forced_disposition: >-
        FORCED: the exact statement, its quantifiers and its uniformity conditions
        are transcribed VERBATIM from a source the executing agent actually opens,
        and the determination of whether the MIXED form is present is recorded
        EITHER WAY. A recalled statement presented as a checked source INVALIDATES
        the extraction. If only the pure-subgroup form exists, the coordinate-key
        conclusion is DOWNGRADED to a heuristic with the pure form as its rigorous
        half and the record says so in its own words.
    - id: CTRL-ATTRIBUTION-GRANULARITY
      row_class: honesty
      blocking: true
      object: 'each of the four numbered statements in the hypothesis'
      forced_disposition: >-
        FORCED: the report states, statement by statement, which contain an
        elliptic curve. The identity, the dual and the learner corollary are
        GROUP-THEORETIC and are reproduced exactly by the two curve-free positive
        controls and the random null; ONLY the coordinate-key conclusion is a
        statement about elliptic curves, and it is conditional. Describing the
        identity or the dual as an elliptic-curve result INVALIDATES the artifact.
    - id: CTRL-SUM-VERSUS-LEAF-KEYS
      row_class: instrument
      blocking: true
      object: 'every statement in the deliverable'
      forced_disposition: >-
        FORCED: each statement is confirmed to be about LEAF keys. Applying the
        coordinate-key conclusion to a key defined on SUMS is a category error and
        is the most likely misreading, since the lane earlier analytic work targets
        sum keys and needs bilinear bounds.
    - id: PARETO-BASELINES
      row_class: pareto_control
      blocking: true
      object: 'the generic collision method and the memory-heavy generic method'
      forced_disposition: >-
        MANDATORY rows, per this question own constraints. The coordinate-bucket
        keyed join is dominated by them on both axes and the contract says so; no
        advantage is claimed on any axis.
  independent_variables:
    - 'object in {vector-space prefix key, cyclic log-bucket key, random key, coordinate-interval bucket key}'
    - 'the support exponent, as a symbolic parameter over its range'
    - 'the key count, as a symbolic parameter'
    - 'fibre balance in {balanced, unbalanced}'
  metrics:
    primary:
      - 'the energy identity with EXPLICIT CONSTANTS, including the cross-fibre Cauchy-Schwarz loss. UNITS: exact algebraic expression'
      - 'the support exponent returned on each of the two CURVE-FREE positive controls. UNITS: dimensionless exponent, FORCED exactly the corner value on both'
      - 'the support exponent and largest coefficient returned on the random-key null. UNITS: dimensionless exponent; modulus'
      - 'the necessary-condition threshold as a function of the support exponent and the key count, with its value at both ends of the range. UNITS: exponent of the group order'
      - 'the EXACT FORM of each extracted character-sum bound: mixed or pure, with its verbatim statement and quantifiers. UNITS: categorical plus transcription. BLOCKING.'
      - 'the coordinate-key support exponent, WITH ITS CONDITIONALITY STATED. UNITS: dimensionless exponent'
      - 'the learner-cost against four-list-cost table over the exponent range, with the learner polynomial degree as a stated free parameter. UNITS: exponents of the group order'
      - 'the ATTRIBUTION TABLE: which numbered statements contain an elliptic curve. UNITS: categorical, per statement'
    secondary:
      - 'the unbalanced-fibre version of the bound and whether its exponent differs'
      - 'the two distinct reasons a key can sit at the uniform exponent, and the coefficient value that separates them'
      - 'the stated limit of the argument near the uniform exponent'
      - 'an explicit note that a toy-scale measurement of the exponent would be inconclusive by construction at reachable field sizes'
  heuristic_under_test: >-
    HEUR-001 (sample to population, whose variance half is not rigorous and is
    charged symbolically here) and HEUR-002 (Weil-level bias of coordinate sets,
    whose rigorous half is exactly the blocking extraction) of H-PFDR-d3c527.
  preregistered_prediction:
    quantity: >-
      The exponent on both curve-free positive controls and on the random null;
      the threshold as a function of the exponent and key count; the extracted
      bound form; the coordinate-key exponent; and the attribution table.
    formula: >-
      Both CURVE-FREE positive controls return the corner exponent EXACTLY, with
      the largest coefficient equal to the fibre size on the first and of the order
      of the fibre size divided by a fixed constant on the second. The random-key
      null returns the random level and the uniform exponent up to the logarithmic
      term. The threshold is EXACTLY the group order raised to one minus half the
      exponent at the balanced key count, giving relative order 1 at the corner and
      exactly the Weil level at the uniform end; A DERIVATION GIVING A THRESHOLD
      BELOW THE WEIL LEVEL AT ANY EXPONENT BELOW 1 HAS AN ERROR, because it would
      let coordinate keys concentrate. The extracted bound form is REPORTED
      WHATEVER IT IS, with no predicted value. The coordinate-key exponent is at
      least 1 minus a term of order the log-log over the log of the group order,
      CONDITIONAL on the extraction.
    source: >-
      H-PFDR-d3c527 claims (E1) to (E6) and predictions P1 to P7. The conditioned
      row this reformulates was read by the drafting coordinator by targeted search
      of the standing hypothesis. The claim boundary forbidding implementation was
      read verbatim from RQ-ECDLP-160d89. FIXED ON 2026-09-04, BEFORE THE
      EXTRACTION IS PERFORMED.
  scale_relevance:
    tier: null
    justification: >-
      Explicitly null rather than absent. NO SCALE IS TESTED: no group is sampled,
      no curve is generated, no list is built and no join is executed. Every
      statement is either an exact algebraic identity or a transcription. There is
      no transfer assumption to state because nothing is transferred. Separately
      recorded: a toy-scale measurement of the support exponent WOULD sit inside
      the gap between the Weil level and the random level at reachable field sizes
      and would be inconclusive by construction, which is a reason not to propose
      one rather than a result.
    correspondence: 'none; no sampling of any mathematical object occurs'
  tail_checks:
    - >-
      The behaviour of the threshold at BOTH ends of the exponent range, reported
      explicitly, since the argument power is entirely different at the corner
      (relative order 1) and near the uniform end (a logarithmic margin only).
    - >-
      The two distinct reasons a key can sit at the uniform exponent -- a
      coordinate key at the Weil level and a random key at the random level --
      reported with the coefficient value that separates them, so that the Weil
      level is never misread as structure.
    - >-
      The unbalanced-fibre case, worked, with an explicit statement of whether the
      threshold exponent changes.
    - >-
      Every extracted statement transcribed verbatim WITH ITS QUANTIFIERS, since a
      bound over a subgroup and a bound twisted by a group character are different
      statements and the whole conditional conclusion turns on which one exists.
  replication:
    seeds: []
    independent_instances: 0
    reason: >-
      ZERO RUNS AND NO SAMPLING: every quantity is an exact algebraic expression or
      a verbatim transcription, so there is nothing to seed and nothing to
      replicate. The determinism a seed would buy is bought by three declared
      conditions: the identity is checked on two curve-free positive controls with
      forced exact values, the extraction is transcribed verbatim with quantifiers
      from a source actually opened, and the attribution table is fixed statement
      by statement.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 8
    maximum_runs: 0
    maximum_workers: 1
    notes: >-
      maximum_runs is 0: no run occurs and none is authorized. The declared wall
      clock bounds any derivation-aid arithmetic, which is not a run and is not
      evidence. The dominant cost is agent time on the derivation and the
      literature extraction, budgeted in the executing handoff.
  stages:
    - id: stage-0-identity
      purpose: >-
        derive the energy identity and the Fourier dual with explicit constants,
        including the cross-fibre loss, and record the balanced-fibre assumption
        and what changes without it
      blocking: true
    - id: stage-1-controls
      purpose: >-
        run the two CURVE-FREE positive controls and the random-key null
        symbolically; forced exact values on all three
      blocking: true
    - id: stage-2-threshold
      purpose: >-
        derive the necessary-condition threshold as a function of the exponent and
        key count and state its behaviour at both ends of the range
      blocking: true
    - id: stage-3-extraction
      purpose: >-
        OPEN the two named sources and transcribe the exact statements and
        quantifiers verbatim; determine whether the MIXED form exists and record it
        either way; then derive the coordinate-key conclusion or its declared
        heuristic downgrade
      blocking: true
    - id: stage-4-corollary
      purpose: >-
        write the learner-cost comparison with the learner polynomial degree as a
        stated free parameter and tabulate it against the four-list cost over the
        exponent range, labelled as a corollary shared with a sibling proposal and
        not as independent evidence
    - id: stage-5-report
      purpose: >-
        restate the conditioned row as an energy row, propose FOR THE COORDINATOR
        CONSIDERATION ONLY that the certificate condition be checked by the Fourier
        statistic rather than by a distributional claim, and fill the attribution
        table statement by statement
  stopping_rules:
    - >-
      STOP at stage 1 if either curve-free positive control returns anything other
      than the corner exponent exactly. The identity is wrong and the record is
      void.
    - >-
      STOP at stage 2 if the derived threshold falls below the Weil level at any
      exponent below 1. That would let coordinate keys concentrate and indicates an
      algebra error.
    - >-
      DOWNGRADE at stage 3, do not stop, if the extraction finds no mixed-form
      bound. The coordinate-key conclusion becomes a heuristic with the pure form
      as its rigorous half and the record survives as a reformulation plus a NAMED
      extraction gap.
    - >-
      DO NOT PROCEED to any measurement. The question claim boundary authorises
      static work only, and the toy instrument is explicitly out of scope for this
      contract.
  invalidation_rules:
    - >-
      Building any list, generating any curve, executing any join, or producing any
      ECDLP result INVALIDATES the run and violates the question own claim
      boundary.
    - >-
      Presenting a RECALLED character-sum statement as a checked source
      INVALIDATES the extraction. Only a verbatim transcription with quantifiers,
      from a source the executing agent actually opened, discharges it.
    - >-
      Quoting the coordinate-key conclusion as RIGOROUS when only the
      pure-subgroup form was found INVALIDATES the statement.
    - >-
      Describing the identity, the dual, or the learner corollary as an
      ELLIPTIC-CURVE result INVALIDATES the artifact: they are group-theoretic and
      are reproduced by curve-free controls.
    - >-
      Applying the coordinate-key conclusion to a key defined on SUMS INVALIDATES
      the statement; it is a category error.
    - >-
      Claiming exclusion of the uniform exponent itself, rather than of exponents
      below it asymptotically, INVALIDATES the statement: near the uniform end the
      margin over the Weil level is only logarithmic.
    - >-
      Presenting a toy-scale exponent measurement as evidence INVALIDATES it: at
      reachable field sizes such a measurement sits inside the gap between the Weil
      level and the random level and is inconclusive by construction.
    - >-
      Changing any hypothesis, experiment or goal status from inside this run
      package INVALIDATES it.
  success_criterion: >-
    Decidable from the primary metrics, ALL of: (1) the identity and dual are
    derived with explicit constants and the balanced-fibre assumption is recorded;
    (2) both CURVE-FREE positive controls return the corner exponent exactly and
    the random-key null returns the uniform value; (3) the threshold is derived as
    a function of the exponent and key count with its behaviour at both ends
    stated; (4) each named source is OPENED and its exact statement and
    quantifiers transcribed verbatim, with the mixed-versus-pure determination
    recorded either way and the downgrade applied if required; (5) the learner
    corollary is tabulated with its free parameter stated and is labelled as a
    shared corollary; and (6) the ATTRIBUTION TABLE is filled statement by
    statement.
    SUCCESS IS DERIVATION AND EXTRACTION INTEGRITY, NOT A PARTICULAR CONCLUSION. A
    run that finds no mixed-form bound and downgrades the conclusion is a FULL
    SUCCESS.
  falsification_criterion: >-
    ANY of the following, evaluated in this order and reported by name.
    F1 IDENTITY WRONG: either curve-free positive control returns anything other
    than the corner exponent. The record is void.
    F2 BOUND INAPPLICABLE: a coordinate-bucket leaf key is exhibited with a Fourier
    coefficient above the Weil level by a positive power. Either the recalled bound
    does not apply, in which case the record is downgraded, or the coordinate-key
    conclusion is false.
    F3 EXTRACTION GAP: no mixed-form bound exists in the named sources. The
    coordinate-key conclusion becomes a heuristic with the pure form as its
    rigorous half; the record survives as a reformulation plus a NAMED extraction
    gap and says so.
    F4 CAUCHY-SCHWARZ LOSS: the bound is shown to lose a power for unbalanced
    fibres in a way that changes the threshold exponent. The balanced-fibre
    assumption fails and the threshold must be restated.
    F5 NOT A FALSIFICATION, AND ROUTED: a key with concentration beyond uniform on
    a prime-order elliptic-curve group is exhibited. The dual then predicts a
    Fourier-biased fibre and the corollary predicts a learner cheaper than the
    four-list route; the object is routed to an independent review at the highest
    effort tier per AGENTS.md rule 12. It is NOT claimed here.
    F6 ATTRIBUTION MIS-STATED: any artifact describes the identity, the dual or the
    corollary as an elliptic-curve result. They are group-theoretic and reproduced
    by curve-free controls; the artifact is invalid.
  artifact_package_directory: experiments/EXP-PFDR-410259/runs/DERIV-001/
  artifact_package_note: >-
    A ZERO-RUN PACKAGE DIRECTORY. No manifest, no seeds, no timings as evidence,
    and the explicit statement 'certificate kind: none, no run occurred' in the
    execution report.
  required_artifacts:
    - 'experiments/EXP-PFDR-410259/runs/DERIV-001/identity.md (the energy identity and the Fourier dual with explicit constants, the cross-fibre loss, and the balanced-fibre assumption with the unbalanced case worked)'
    - 'experiments/EXP-PFDR-410259/runs/DERIV-001/controls.yaml (the two CURVE-FREE positive controls and the random-key null, each with its forced value and the value obtained)'
    - 'experiments/EXP-PFDR-410259/runs/DERIV-001/threshold.yaml (the necessary-condition threshold as a function of the exponent and the key count, with its behaviour at both ends of the range and the stated limit near the uniform end)'
    - 'experiments/EXP-PFDR-410259/runs/DERIV-001/extraction.md (per source: the URL or identifier, whether it was OPENED, the exact statement transcribed VERBATIM with its quantifiers and uniformity conditions, and the mixed-versus-pure determination)'
    - 'experiments/EXP-PFDR-410259/runs/DERIV-001/coordinate-key.yaml (the coordinate-key conclusion or its declared heuristic downgrade, with the conditionality stated in the value itself)'
    - 'experiments/EXP-PFDR-410259/runs/DERIV-001/learner-table.yaml (the cost comparison over the exponent range with the learner polynomial degree as a stated free parameter, labelled a shared corollary)'
    - 'experiments/EXP-PFDR-410259/runs/DERIV-001/attribution.yaml (statement by statement: which contain an elliptic curve, and the resulting rule for how each may be described)'
    - 'experiments/EXP-PFDR-410259/runs/DERIV-001/execution-report.md (stage by stage; the success-criterion checklist; which of F1 to F6 fired; per-file sha256; the inference block; and explicit statements that zero runs occurred, no list was built, no curve was generated, the question claim boundary was respected, and no record status was changed)'
  interpretation_limits:
    - >-
      Zero runs, no implementation, no curve generation, no ECDLP result -- which
      is the question own declared claim boundary and not a stylistic choice.
    - >-
      The coordinate-key conclusion is CONDITIONAL on an extracted bound and is a
      pointer until an agent opens the source and records the exact mixed-sum
      statement.
    - >-
      The record closes the coordinate-bucket LEAF-key family on the
      enumeration-1 line; it does not close keys computed by other means, and it is
      not a lower bound.
    - >-
      The identity and its dual are facts about finite abelian groups. Only the
      coordinate-key conclusion is about elliptic curves, and BOTH positive
      controls that demonstrate the instrument fires are curve-free. Attributing
      the closure to elliptic-curve structure would attribute a group-theoretic
      fact to a curve.
    - >-
      Near the uniform end the threshold exceeds the Weil level only by a
      logarithmic factor, so the argument excludes concentration asymptotically and
      cannot exclude an exponent of 1 minus a vanishing term. That is exactly what
      is claimed.
    - >-
      A toy-scale measurement would sit inside the gap between the Weil level and
      the random level at reachable field sizes and would be INCONCLUSIVE BY
      CONSTRUCTION. The contract predicts that difficulty rather than a signal, and
      no measurement is proposed.
    - >-
      No hypothesis, experiment or goal status changes. The proposal that the
      certificate condition be checked by the Fourier statistic is offered FOR THE
      COORDINATOR CONSIDERATION ONLY.
  dominated_by: >-
    AS AN ATTACK: none is mounted; every frontier row dominates, checked
    individually -- the generic collision method with distinguished points and
    constant memory, its automorphism-discounted variant, the memory-heavy generic
    method, the parallel variant total work, and the generic lower bound, which is
    not competed with. The remaining classical transfers and descent methods are
    not applicable over a prime field. Data and queries: no queries, no solve. AS A
    STATIC CONTRIBUTION the nearest incumbents are an existing structural record,
    which dominates on the structural conclusion at the corner and is dominated
    here on hypothesis breadth and on the exponent range covered, and an existing
    analytic record, which dominates on ambition for sum keys and is dominated here
    on what is provable for leaf keys. NOT NULL ON ANY AXIS.
  sota_delta: >-
    Realized cryptanalytic delta: 0 on every axis. Static content delivered: the
    conditioned row becomes an exact energy identity with a Fourier dual, replacing
    an existing "no rigorous support presently known" for leaf keys; the
    coordinate-bucket leaf-key family is addressed on the ENTIRE enumeration-1
    line rather than only at the corner; one-variable bounds replace bilinear
    bounds that an earlier record predicted to be unavailable; and the one
    curve-specific ingredient is isolated to a single extraction whose outcome is
    reported either way.
  id_allocation_provenance: >-
    EXP-PFDR-410259 pre-allocated by the tasking Coordinator in
    TASK-20260904-9c61a9 against IDEA-20260901-d77aa8. Nothing was minted.
  yaml_parse_disclosure: >-
    Written without an interpreter; prose values are folded block scalars or
    quoted scalars; no tabs; no duplicate keys to the author reading. The
    orchestrating session must run a strict parse and tools/validate_ledger.py.
