experiment:
  id: EXP-FALSIFY-07dcc1
  hypothesis_id: H-FALSIFY-06f5e0
  derived_from_idea: IDEA-20260815-80db36
  question_id: RQ-FALSIFY-a2c501
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Did any executed experiment test its own proposal's declared falsifiers -
    per-falsifier coverage across executed ECC experiments with verbatim falsifier
    retrieval, a clean-experiment null, an untestable-by-construction null,
    pre-declared thresholds, and a blind re-adjudication scored by Cohen's kappa

  objective: >-
    The one uncertainty a run reduces - whether this program's falsifiability
    requirement is OPERATIVE or CEREMONIAL, which nobody has checked although every
    proposal carries falsification_conditions and every contract carries a metric
    list. A run establishes (i) a per-falsifier coverage verdict for every auditable
    falsifier-experiment pair, drawn from four pre-declared categories - covered,
    uncovered, untestable_as_declared, out_of_scope_by_contract - with the specific
    metric matched and the judgement recorded per pair; (ii) the two nulls, a
    clean experiment that must audit clean and an untestable-by-construction
    falsifier that must be flagged rather than scored uncovered, both executed
    BEFORE any corpus pair is scored; (iii) the count of executed ECC experiments
    citing no identifiable originating proposal, which cannot be audited at all and
    which bounds what any percentage can claim; and (iv) Cohen's kappa between the
    primary audit and an INDEPENDENT BLIND re-adjudication of a random 20 percent of
    pairs, without which no coverage percentage is quotable. The audit establishes
    nothing mathematical and is not evidence about any cryptographic question.

  what_this_is_not:
  - >-
    Not a mathematical result of any kind, not an attack, and not evidence about any
    cryptographic question. It audits process.
  - >-
    Not a judgement that any audited experiment's RESULT is wrong. An uncovered
    falsifier means the experiment did not test that condition, not that its finding
    is false.
  - >-
    Not a judgement that any proposal is wrong. Untestable-as-declared falsifiers
    implicate the way a falsifier was written, not the idea behind it.
  - >-
    Not a status change to any hypothesis, evidence record, decision or goal. Any
    re-reading of affected records is a Coordinator decision downstream of this
    measurement, not part of it.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output or
    evidence. No run has been executed under this contract.

  claim_ceiling:
    tier: >-
      process audit of this corpus - no mathematical claim tier applies, and the
      record must never be cited as evidence about a cryptographic question.
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - among executed ECC experiments in this repository
      that cite an identifiable originating proposal, a stated fraction of declared
      falsifiers were uncovered, a stated fraction untestable as declared, and a
      stated fraction out of scope by contract, at a stated inter-rater reliability;
      and a stated number of executed ECC experiments could not be audited at all.
      WHAT DOES NOT FOLLOW - nothing about experiments outside the ECC area; nothing
      about the unauditable subset, whose falsifier coverage is unknown and not
      estimated; nothing about whether any audited conclusion is correct; and no
      percentage at all if kappa is below the declared threshold.

  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking). Pre-register the four verdict categories with
      a written rubric distinguishing them, the three thresholds (at least 0.30
      supports, at most 0.15 refutes, between is inconclusive), the kappa threshold of
      0.6, the minimum of 10 auditable pairs, the random-subsample rule for
      re-adjudication, and the definitions of executed, ECC, and identifiable
      originating proposal. Select the two null instances BY NAME. All fixed before
      any corpus pair is read, because a rubric written after seeing the pairs would
      score them.
      STAGE 1 (nulls, blocking, run FIRST). Score NULL 1, the experiment selected as
      demonstrably testing its own falsifiers - it must audit with zero uncovered. And
      NULL 2, the falsifier untestable by construction - it must be flagged
      untestable, NOT scored uncovered. Either misbehaving means the criterion is
      miscalibrated and the run stops.
      STAGE 2 (enumeration). Enumerate every executed ECC experiment - one with at
      least one completed run record under experiments/<EXP-ID>/runs/ - and partition
      into AUDITABLE (cites an identifiable originating proposal that declares
      falsification_conditions) and UNAUDITABLE, recording the reason for each
      unauditable case.
      STAGE 3 (verbatim retrieval). For each auditable experiment, extract its
      originating proposal's falsification_conditions VERBATIM into the audit record,
      so the audit cannot silently substitute an easier condition, and extract the
      experiment's declared metric list verbatim.
      STAGE 4 (primary audit). Score each falsifier-experiment pair into one of the
      four categories, RECORDING for each pair the specific metric matched and the
      judgement made, and marking whether the match was syntactic or required
      judgement.
      STAGE 5 (blind re-adjudication). An independent agent that has NOT seen the
      Stage 4 verdicts re-scores a randomly sampled 20 percent of auditable pairs from
      the same verbatim inputs. Compute Cohen's kappa over the four categories.
      STAGE 6 (zero compute). Report the coverage table, the two nulls, the
      unauditable count, kappa, and the verdict against the pre-declared thresholds -
      including INCONCLUSIVE if the uncovered fraction falls in the declared band, and
      NO PERCENTAGE AT ALL if kappa is below 0.6.
    instrument: >-
      Mechanical retrieval from ledger/proposals/ and experiments/<EXP-ID>/ by exact
      path, with verbatim quotation of both the falsification_conditions and the
      metric list into the audit record. Judgement recorded per pair as free text with
      the matched metric named. Cohen's kappa computed from its definition and checked
      against a hand-computed example before use. The Stage 5 re-adjudication runs in
      an independent session with the Stage 4 verdicts withheld. Recorded through
      harness/runner.py.
    parameters: >-
      Population - all executed ECC experiments in this repository, where executed
      means at least one completed run record exists. Verdict categories - covered,
      uncovered, untestable_as_declared, out_of_scope_by_contract. Thresholds -
      uncovered fraction at least 0.30 supports, at most 0.15 refutes, between is
      inconclusive. Reliability - Cohen's kappa at least 0.6 on a random 20 percent
      subsample. Power gate - at least 10 auditable falsifier-experiment pairs. Two
      named null instances selected at Stage 0.

  controls:
  - >-
    NULL 1, CLEAN EXPERIMENT, blocking and run first - an experiment selected in
    advance as demonstrably testing its own falsifiers, which MUST audit with zero
    uncovered. A flag there means the criterion is too strict and every uncovered
    count in the corpus is inflated.
  - >-
    NULL 2, UNTESTABLE-BY-CONSTRUCTION FALSIFIER, blocking and run first - a falsifier
    requiring a measurement no available instrument produces, which MUST be flagged
    untestable rather than scored uncovered. The two categories mean different things
    and an instrument that cannot separate them cannot support the headline.
  - >-
    VERBATIM QUOTATION CONTROL - falsifiers are quoted verbatim from the originating
    proposal into the audit record, so the audit cannot substitute an easier condition
    and a reader can re-score any pair independently.
  - >-
    UNAUDITABLE CATEGORY - experiments citing no identifiable originating proposal are
    reported as a distinct count with the reason, never silently dropped and never
    scored.
  - >-
    SCOPE-EVOLUTION CATEGORY - a falsifier the experiment's contract legitimately
    narrowed out of scope is scored out_of_scope_by_contract, not uncovered. Conflating
    narrowing with omission would manufacture the finding.
  - >-
    BLIND RE-ADJUDICATION, blocking - an independent agent re-scores a random 20
    percent of pairs without seeing the first verdicts; Cohen's kappa below 0.6 means
    no percentage is quotable.
  - >-
    PRE-DECLARED THRESHOLDS WITH AN INCONCLUSIVE BAND - fixed at Stage 0 so the audit
    cannot be read as confirming whatever it happens to find.

  independent_variables:
  - 'pair type - corpus pair versus NULL 1 versus NULL 2'
  - 'match type - syntactic match versus judgement-required match'
  - 'adjudicator - primary audit versus blind re-adjudication'
  - originating-proposal availability

  metrics:
    primary:
    - >-
      per-falsifier coverage verdict - one of four categories per
      (experiment, falsifier) pair - with the specific metric matched and the
      judgement recorded; the headline is the UNCOVERED FRACTION over auditable pairs
    - >-
      untestable-as-declared fraction - dimensionless over auditable pairs - reported
      SEPARATELY from uncovered, since the two implicate different stages of the
      lifecycle
    - >-
      unauditable experiment count - integer and as a fraction of executed ECC
      experiments - those citing no identifiable originating proposal, with the reason
      per case
    - >-
      Cohen's kappa - dimensionless in [-1,1] - between the primary audit and the
      blind re-adjudication over the four categories on a random 20 percent subsample
    - >-
      null verdicts - two booleans - whether NULL 1 audited clean and whether NULL 2
      was flagged untestable rather than uncovered
    secondary:
    - >-
      out_of_scope_by_contract fraction - dimensionless - falsifiers the experiment's
      own contract legitimately narrowed away
    - >-
      judgement-required fraction - dimensionless - pairs matched only by judgement
      rather than syntactically, reported separately because they are where the
      audit's reliability sits
    - >-
      auditable pair count - integer - the denominator of every fraction, reported so
      a percentage over a handful of pairs is visibly that
    - >-
      per-experiment coverage profile - the four counts per experiment, so a single
      experiment with many uncovered falsifiers cannot masquerade as a corpus-wide
      pattern
    - >-
      proposals whose falsification_conditions field is absent entirely, counted
      separately from those whose falsifiers are vague

  heuristic_under_test:
    id: HEUR-FALSIFY-1
    formal_statement: >-
      An experiment's declared metrics determine which of its originating proposal's
      falsifiers it could have detected - for every falsifier F and experiment E, F is
      detectable by E if and only if F is a condition on quantities in E's declared
      metric list.
    tested_here: true
    how: >-
      Directly, by the two nulls and by the blind re-adjudication. NULL 2 tests
      whether the rule can distinguish undetectable-in-principle from
      not-measured-here. The kappa measures whether the rule, applied by two
      independent adjudicators to the same verbatim inputs, yields the same verdicts.
      THE KNOWN GAP is that a falsifier can be detected indirectly through a metric it
      does not name; the contract exposes that gap by reporting the
      judgement-required fraction separately rather than pretending the rule is
      mechanical.

  preregistered_prediction:
    quantity: >-
      The fraction of auditable falsifier-experiment pairs scored UNCOVERED, and
      Cohen's kappa between the primary audit and the blind re-adjudication.
    formula: >-
      Uncovered := |{pairs scored uncovered}| / |{auditable pairs}|. PREDICTED at least
      0.30. Refuted at at most 0.15. Between 0.15 and 0.30 is a pre-declared
      INCONCLUSIVE band. kappa := (p_o - p_e)/(1 - p_e) over the four categories on a
      random 20 percent subsample; predicted at least 0.6, below which no percentage is
      quotable in either direction.
    source: >-
      Pre-registered in the parent proposal IDEA-20260815-80db36, whose
      falsification_conditions name most falsifiers covered, many uncovered and many
      untestable as three distinct outcomes, and whose honest_prior_of_survival records
      0.7 that experiments cite proposals identifiably, 0.8 that the nulls calibrate the
      criterion, and 0.5 that a substantial share of falsifiers turn out uncovered. The
      numeric thresholds 0.30, 0.15 and 0.6, the inconclusive band, the four-category
      rubric and the blind re-adjudication are this contract's operationalisation of
      substantial share and of the proposal's own recorded worry that the audit needs
      judgement it must record rather than a mechanical rule. All fixed at Stage 0
      before any corpus pair is read. Never tuned to data.

  scale_relevance:
    tier: not_applicable
    justification: >-
      The population is the corpus itself, so the audit is executed at full scale by
      construction - there is no smaller version of it and no extrapolation is
      involved. The one scale-like limitation is the AUDITABLE SUBSET - experiments
      citing no originating proposal are outside the measurement, so every fraction is
      a fraction of the auditable subset and never of the corpus, and the unauditable
      count is reported precisely to bound that.
    correspondence: null

  tail_checks:
  - >-
    Report the per-experiment coverage profile, since a corpus-wide uncovered fraction
    driven entirely by one experiment with many falsifiers is a different fact from one
    spread across experiments.
  - >-
    Report the judgement-required fraction separately from the syntactically matched
    one; a headline resting mostly on judgement-required pairs is only as good as the
    kappa.
  - >-
    Report the auditable pair count as the explicit denominator of every fraction, and
    refuse the whole audit below 10 pairs.
  - >-
    Report proposals with NO falsification_conditions field at all separately from
    those with vague ones, since the first is a contract violation and the second is a
    quality problem.
  - >-
    Report the categories on which the two adjudicators disagreed, not just kappa,
    since disagreement concentrated on the uncovered-versus-untestable boundary would
    directly undermine the headline while leaving kappa respectable.

  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
    note: >-
      Seeds govern the random 20 percent subsample drawn for blind re-adjudication.
      The primary audit is deterministic given the corpus and the rubric; its
      replication is the blind re-adjudication itself, which is why that arm is
      blocking rather than optional.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1.0
    maximum_memory_gb: 4
    maximum_runs: 12

  stopping_rules:
  - >-
    Stop immediately if NULL 1 is flagged - the criterion is too strict and every
    uncovered count would be inflated.
  - >-
    Stop immediately if NULL 2 is scored uncovered rather than flagged untestable -
    the two categories are not separated and the headline would conflate them.
  - >-
    Stop and report UNREADABLE if fewer than 10 auditable falsifier-experiment pairs
    exist.
  - >-
    Do not quote any coverage percentage if Cohen's kappa is below 0.6; report kappa
    and the disagreement table instead.
  - >-
    Do not revise the rubric, the four categories or the three thresholds after seeing
    any corpus pair.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion
    is a stop, never a negative result (AGENTS.md rule 5).

  invalidation_rules:
  - >-
    A timeout, crash or tooling failure makes the run failed_infrastructure and is
    NEVER evidence about the program's falsifiability discipline (AGENTS.md rule 5).
  - >-
    A run whose nulls were scored AFTER any corpus pair is invalid_measurement - the
    nulls exist to calibrate the criterion and cannot do so retrospectively.
  - >-
    A run whose blind re-adjudication was performed by an agent that had seen the
    primary verdicts is invalid_measurement; the kappa would measure anchoring rather
    than agreement.
  - >-
    A run that paraphrases rather than quotes a falsifier verbatim is
    invalid_measurement at that pair - paraphrase is exactly how an easier condition
    gets substituted.
  - >-
    A run scoring an out-of-scope-by-contract falsifier as uncovered is
    invalid_measurement at that pair.
  - >-
    A run quoting a coverage percentage while kappa is below 0.6 is
    invalid_measurement.
  - >-
    A run whose rubric or thresholds differ from the frozen contract is a DIFFERENT
    experiment and requires a new contract.

  success_criterion: >-
    Both nulls behave as pre-declared, at least 10 auditable falsifier-experiment
    pairs are found, every auditable pair carries a verdict in one of the four
    categories with its verbatim falsifier text, its matched metric and its recorded
    judgement, the unauditable experiments are counted with reasons, and Cohen's kappa
    is computed over a random 20 percent blind re-adjudication and reported alongside
    the disagreement table. This criterion is decidable from the primary metrics alone
    and says nothing about which coverage fraction is found.

  falsification_criterion:
  - >-
    At most 15 percent of auditable pairs are uncovered, with both nulls behaving and
    kappa at least 0.6. The falsifiability discipline is OPERATIVE and the hypothesis
    is false - which the program currently assumes without evidence and which is worth
    establishing.
  - >-
    Either null misbehaves. The criterion is miscalibrated, no coverage number is
    admissible in either direction, and the miscalibration is the deliverable.
  - >-
    Cohen's kappa is below 0.6. The audit's judgements are not reproducible,
    HEUR-FALSIFY-1 is not operationalisable at this rigour, no percentage may be
    quoted, and the finding is that the audit as specified cannot be made reliable.
  - >-
    Fewer than 10 auditable pairs exist. The audit has no power at any threshold and
    reports UNREADABLE; that itself would mean almost nothing in this corpus is
    auditable, which is reported as the count rather than as a coverage claim.
  - >-
    The uncovered fraction lands between 15 and 30 percent. INCONCLUSIVE by
    pre-declaration - the audit does not discriminate at this resolution and the report
    says so rather than choosing the nearer threshold.

  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model
    and inference block, and environment; and, separately, the manifest of the
    independent blind re-adjudication session
  - >-
    raw-result.json carrying every (experiment, falsifier) pair with the VERBATIM
    falsifier text, the verbatim metric list, the verdict, the matched metric, the
    recorded judgement and the syntactic-versus-judgement flag - not summaries
  - >-
    the two null scorings, in the same file as the corpus pairs, timestamped so that
    their precedence is checkable
  - >-
    the Stage 0 pre-registration text, written before any corpus pair is read and
    hashed, containing the four-category rubric, the three thresholds, the kappa
    threshold, the minimum pair count, the subsample rule and the two named nulls
  - >-
    the unauditable experiment list with a reason per entry, and the separate list of
    proposals with no falsification_conditions field at all
  - >-
    the blind re-adjudication verdicts, the kappa computation and the per-category
    disagreement table

  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution, and under this engagement
    approval is the USER's gate because it authorizes execution and spends compute.
    This contract is NOT approved - approved_by is null and execution_authorized is
    false (AGENTS.md rule 1).
  - >-
    The blind re-adjudication must run in an INDEPENDENT session with the primary
    verdicts withheld, per the review-architecture blindness requirement. An approver
    who cannot arrange that independence should not approve the contract, because
    without it no coverage percentage is quotable.
  - >-
    The parent proposal is not proof-oriented and the paired hypothesis records
    not_applicable_reason on its proof_search_map, so no KN-TECH-080 audit is required.
  - >-
    NOTE FOR THE APPROVER - this audit's own output is a claim about the program's
    records, and any re-reading or re-scoping of affected evidence records is a
    separate Coordinator decision that must NOT be bundled into this experiment or its
    ledger archive.
  - >-
    The rubric, the four categories, the three thresholds, the kappa threshold, the
    minimum pair count and the two named nulls must be recorded at Stage 0 before any
    corpus pair is read.

  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3 to 5
    source_record: IDEA-20260815-80db36
    authored_at: '2026-08-25'
    note: >-
      The two nulls, the verbatim-quotation control, the separate unauditable category
      and the untestable-versus-uncovered distinction are taken directly from the
      parent proposal's null_object_control, minimal_test.controls, confounders and
      falsification_conditions blocks. THREE ADDITIONS BY THIS CONTRACT, all recorded -
      the numeric thresholds 0.30 and 0.15 with an explicit INCONCLUSIVE band between
      them, because the proposal says substantial share without fixing one and a design
      that cannot return inconclusive would be read as confirming whatever it found;
      the four-category rubric, which makes out_of_scope_by_contract a first-class
      verdict rather than a caveat; and the BLIND RE-ADJUDICATION with Cohen's kappa,
      which is this contract's answer to the proposal's own recorded worry that the
      audit needs judgement it must record rather than a mechanical rule. Budgets come
      from the parent's declared estimated_cost (implementation low, compute low). No
      field is invented.

  derivation_gaps:
  - >-
    The two null instances are not named in the proposal and must be selected at Stage
    0. Selecting NULL 1 after scanning the corpus for an experiment that audits clean
    would make the null vacuous; the selection rationale must be recorded before any
    scoring.
  - >-
    The definition of ECC AREA for the population is not fixed. Whether it means the
    ECDLP-family areas only, or every area with an elliptic-curve object, changes the
    denominator materially and must be settled before enumeration.
  - >-
    The 0.30 and 0.15 thresholds are this contract's choices and are not derived from
    any prior. They are defensible as a substantial share and a small share, but a
    result landing near either is reported as near it rather than binned.
  - >-
    Cohen's kappa over four unbalanced categories can be low for reasons unrelated to
    disagreement on the headline. The disagreement table is required for that reason,
    but the contract does not specify a fallback statistic, and a Coordinator may need
    to rule on one if the categories turn out heavily skewed.
  - >-
    Whether enough auditable pairs exist is genuinely unknown before Stage 2. The
    proposal's own prior is 0.7 that experiments cite proposals identifiably, so an
    UNREADABLE outcome is a live possibility and the budget is deliberately small for
    that reason.
