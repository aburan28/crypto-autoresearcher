# =============================================================================
# EXP-BINSTD-835841 -- VERSION 1 (APPROVED by DEC-20261002-633f5b) frozen
# contract for H-BINSTD-dc7c2e: stdlib-only toy Koblitz / Part-2 curve builder
# clearing IMP-PART2-CURVE-LIBS-1 so EXP-BINSTD-178742 Part 2 can run at n≤41
# without Magma/Sage.
#
# Source: IDEA-20261001-3f3b26 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Parent meter: EXP-BINSTD-178742 Part-2 gates G0–G4, E1 table, CERT-*,
# lemmas L3/L4 (cited, not rewritten).
#
# ZERO RUNS in this design packet. Stages 0-2 authorized for executor
# TASK-20261002-287317. No AUXIN. Amazon Bedrock prohibited.
# NO break. NO exponent. NO n≥131 transfer. NO O-SUPPORT claim for
# H-BINSTD-ce4f38 from this contract alone.
# =============================================================================
experiment:
  id: EXP-BINSTD-835841
  hypothesis_id: H-BINSTD-dc7c2e
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-3f3b26
  goal_id: GOAL-ECDLP2M-001
  parent_hypothesis_id: H-BINSTD-ce4f38
  parent_experiment_id: EXP-BINSTD-178742
  impediment_targeted: IMP-PART2-CURVE-LIBS-1
  version: 1
  title: >-
    Stdlib-only toy Koblitz cell builder + Part-2 meter (G0–G4, CERT-*,
    ≥100 sealed relations/cell) at n≤41 to clear IMP-PART2-CURVE-LIBS-1
  status: approved
  approved_by: DEC-20261002-633f5b
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-633f5b
    composing_decision: DEC-20261002-633f5b
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-2 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0: freeze builder API + AST import audit + G0 self-test BEFORE any
      rank readout. Stage 1: n=17 fixture G1 + planted/forced-negative + G3/G4
      + ≥100 relations on both a∈{0,1}. Stage 2: replicate n∈{23,31,41}. No
      Stage 3. No deployed n≥131. No AUXIN provisioning.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Implement a stdlib-only curve/order/λ builder for Koblitz models
    E: Y^2+XY=X^3+a X^2+1 over F_{2^n} (n≤41), reproduce the frozen
    EXP-BINSTD-178742 E1 admissibility table and n=17 fixture, pass gates
    G0–G4, and emit ≥100 CERT-LABEL/QUOT/BIND-sealed relations per positive
    cell with orbit-quotient rank 1 matching EVAL — thereby clearing
    IMP-PART2-CURVE-LIBS-1 or naming a concrete arithmetic obstruction with
    a measured quantity.

  class: instrument
  class_note: >-
    Primary class is instrument (enabling the already-frozen Part-2 meter).
    Carries HEUR-BINSTD-3f3b26-H1 validation at toy scale. Not a
    cost-model-measurement or exponent-moving experiment.

  scope:
    included:
      - >-
        Stage 0. Freeze builder module API under implementation/; run AST
        import audit (stdlib + local typed only); run G0 planted-rank
        self-test on fixture r before any cell build. ZERO Part-2 rank
        readings of live relations in Stage 0.
      - >-
        Stage 1. Build (17,0) and (17,1); match e1_admissibility_table and
        fixture_n17; pass G1, G2 (forced-negative n∈{19,29,37}), G3, G4;
        collect ≥100 triple-certified relations per (17,a); report ranks.
      - >-
        Stage 2. Replicate Stage-1 meter at n∈{23,31,41} for a∈{0,1}
        (E1 match + ≥100 certified relations + quotient rank 1 = EVAL),
        with null-object and non-stable controls at each n.
    excluded:
      - Magma, Sage, cypari2, numpy, or any non-stdlib CAS provisioning
      - Any run at deployed n ≥ 131
      - AUXIN / FROB / QSP / SEMBIN edits or values
      - Claiming O-SUPPORT / supported for H-BINSTD-ce4f38 from this EXP alone
      - Break / exponent / c2pnb clearance
      - Editing EXP-BINSTD-178742 frozen specification bytes

  inputs:
    proposal: ledger/proposals/IDEA-20261001-3f3b26.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-dc7c2e.yaml
    parent_contract: experiments/EXP-BINSTD-178742/specification.yaml
    parent_part2_surface: experiments/EXP-BINSTD-178742/implementation/typed/part2_surface.py
    gf2n_substrate: experiments/EXP-BINSTD-178742/implementation/typed/gf2n.py
    import_audit_pattern: experiments/EXP-BINSTD-178742/implementation/typed/import_audit.py
    optional_code_refs:
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
    e1_admissibility_table_source: >-
      experiments/EXP-BINSTD-178742/specification.yaml
      cells.positive_arm.e1_admissibility_table (DESIGN FIGURES)
    fixture_n17_source: >-
      experiments/EXP-BINSTD-178742/specification.yaml cells.fixture_n17
    gate_definitions_source: >-
      experiments/EXP-BINSTD-178742/specification.yaml controls CTL-* / gates
      G0–G4 and procedure P0-G0..P2-* (cited by id; not copied as a second
      normative surface — on conflict the parent contract wins and this EXP
      records e1_table_disagree / instrument_defect).
    cells:
      positive_arm:
        n_values: [17, 23, 31, 41]
        a_values: [0, 1]
        model: 'E_a: Y^2 + XY = X^3 + a X^2 + 1 over F_{2^n}'
        e1_table_must_match: true
      forced_negative_arm:
        n_values: [19, 29, 37]
      null_object: 'E_b with b drawn from F_{2^n} \\ F_2; expect k=1'
    seeds:
      master: 20261002
      stage1_relations: [20261002, 20261003]
      stage2_relations: [20261004, 20261005]
      g4_mutants: 20261006

  controls:
    - name: ctl_fixture_n17
      gate: G1
      blocking: true
      object: >-
        Reproduce fixture_n17 frozen_values and gate_checks from
        EXP-BINSTD-178742 before any new cell ranks are read.
    - name: ctl_planted_rank
      gate: G0
      blocking: true
      object: >-
        Planted-rank matrices and structured orbit polynomials per
        EXP-BINSTD-178742 CTL-PLANTED; RANK-A and RANK-B must return planted rho.
    - name: ctl_forced_negative
      gate: G2
      blocking: true
      object: >-
        n∈{19,29,37}: usable stable subspace empty; ord_n(2)=n-1; no rank read.
    - name: ctl_admission_selftest
      gate: G3
      blocking: true
      object: >-
        EXP-BINSTD-178742 CTL-ADMISSION-SELFTEST what_v2 / admission_selftest_object;
        AR-2 rejects with ord(lambda)=1; deleted-clause mutant admits.
    - name: ctl_instrument_selftest
      gate: G4
      blocking: true
      object: >-
        EXP-BINSTD-178742 CTL-INSTRUMENT-SELFTEST (M1–M3, PTM-F); mutants fail
        certificates; correct build passes including targets outside G.
    - name: null_object_k1
      blocking: true
      object: >-
        Ordinary E_b (b∉F_2): instrument reports k=1, forms no conjugate row;
        raw class rank = quotient rank = 1; τ(P) fails to lie on E_b for sampled P.
    - name: non_stable_subspace
      blocking: true
      object: >-
        Seeded W' with dim C(W')≤1: zero families admitted as relations over W';
        no ranks reported for them.
    - name: ast_stdlib_import_audit
      blocking: true
      object: >-
        AST walk of implementation/ admits only stdlib + local typed modules;
        any magma/sage/cypari2/numpy/pari import fails the run as audit_fail.
    - name: rank_a_vs_rank_b
      blocking: true
      object: >-
        Two independent rank routines must agree on every reported matrix;
        disagreement is IR-12-class instrument defect for this EXP.

  independent_variables:
    - n
    - a  # 0 | 1 | null_b
    - stage  # 0 | 1 | 2
    - relation_source  # RS-1..RS-4 as in parent
    - basis  # raw_class | raw_point | orbit_quotient | ker_g
    - seed

  metrics:
    primary:
      - e1_complete_pair_count
      - e1_table_match_rate
      - g0_g4_pass_vector
      - certified_relation_count_per_cell
      - quotient_rank_one_rate
      - raw_rank_matches_eval_rate
      - ast_stdlib_audit_pass
    secondary:
      - group_order
      - r
      - lambda
      - peak_rss_bytes
      - wall_s
      - order_factorization_cpu_s
      - redraw_counts_null_and_nonstable
      - termination_reason
      - counterexample_certificate_present

  heuristic_under_test: HEUR-BINSTD-3f3b26-H1

  preregistered_prediction:
    quantity: >-
      e1_complete_pair_count = 8; quotient_rank_one_rate = 1.0 on ≥100
      certified relations per positive cell; g0_g4_pass_vector all true;
      ast_stdlib_audit_pass = true.
    formula: >-
      Under EXP-BINSTD-178742 lemmas L3/L4 and E1 design figures: admitted
      cells match the frozen table; orbit-quotient rank is exactly 1 for
      every relation with target not O; raw ranks equal EVAL.
    source: >-
      IDEA-20261001-3f3b26 HEUR-BINSTD-3f3b26-H1; EXP-BINSTD-178742
      e1_admissibility_table + success_criterion_v3 limb 5 (design figures).
    claim_tier: observational
    measured_vs_modeled: >-
      Group orders, r, λ, ranks, and certificate outcomes are MEASURED.
      The e1 table and fixture values are DESIGN FIGURES used as a
      reproduction oracle, not as modeled predictions of a heuristic CDF.

  scale_relevance:
    tier: toy
    justification: >-
      n≤41 only. Explicitly no transfer to deployed n∈{131,...,571}. Clearing
      IMP-PART2-CURVE-LIBS-1 enables the parent Part-2 meter at the same toy
      scale the parent contract already declared; it does not enlarge scope.
    correspondence: null

  tail_checks:
    - >-
      Extreme relation: report any certified relation whose raw class rank is
      not in {k-1, k} and export counterexample_certificate.
    - >-
      Smoothest/hardest order-factorization cell (expected n=41 a=0 large r):
      record CPU seconds; budget abort is O-IMPEDIMENT-ARITH, not refutation.
    - >-
      G4: every mutant/plant must be invalidated; a mutant that passes all
      certificates fails the gate (IR-18).

  optimistic_assumptions:
    - assumption: >-
        Pure-Python BSGS / Pollard rho order checks suffice at n=41 within
        the advisory 4 CPU-hour envelope.
      bias_direction: >-
        May understate wall time; if budget exhausts, record impediment with
        measured CPU, do not claim mathematical obstruction of L3/L4.
    - assumption: >-
        Frozen e1 design figures are arithmetically correct oracles for the
        builder.
      bias_direction: >-
        Table error would halt as e1_table_disagree (instrument/table
        discrepancy referred to Coordinator), never as L3/L4 refutation.

  memory_accounting: >-
    Peak RSS measured. Dominant structures at n=41: field-element tables
    O(n) and relation matrices of shape related to k=n≤41 and factor-base
    width; reconcile analytic size against peak_rss_bytes in the run summary.

  hidden_overhead_honesty: >-
    Point-counting / order factorization at n=41 in pure Python may dominate
    wall time; this is disclosed and is not hidden inside an asymptotic o(1).
    No attack exponent is claimed.

  replication:
    seeds: [20261002, 20261003, 20261004, 20261005]
    independent_instances: 2
    independent_instances_note: >-
      Stage 1 dual seeds on n=17; Stage 2 dual seeds across n∈{23,31,41}.
      IR-12-style agreement required on primary metrics across seeds where
      both complete_valid.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4
    maximum_memory_gb: 4
    maximum_runs: 20
    maximum_workers: 1

  stopping_rules:
    - >-
      SR-1. G0 fails → stop; status invalid; no ranks read.
    - >-
      SR-2. G1 (n=17 fixture) fails → stop; status invalid; nothing downstream.
    - >-
      SR-3. AST import audit fails → stop; status audit_fail; ranks unread.
    - >-
      SR-4. E1 finds no complete pair at some positive n, or disagrees with
      e1_admissibility_table → halt before rank readout; status
      incomplete_C1 or e1_table_disagree; impediment / discrepancy, not
      evidence against L3/L4.
    - >-
      SR-5. G4 fails (mutant passes or correct build fails certs) → stop;
      status instrument_defect (IR-18); ranks unread.
    - >-
      SR-6. Advisory CPU/wall budget exhausted mid-cell → preserve partial
      artifacts; status failed_infrastructure or O-IMPEDIMENT-ARITH with
      measured quantity; never negative math evidence.
    - >-
      SR-7. Counterexample_certificate on quotient/raw rank → finish
      recording that cell; do not claim O-CLEAR-IMP; export certificate.

  invalidation_rules:
    - Editing EXP-BINSTD-178742 specification.yaml or prior run records.
    - Importing Magma/Sage/cypari2/numpy into the builder tree.
    - Reading ranks after a failed blocking gate.
    - Claiming O-SUPPORT / break / exponent / n≥131 transfer in run artifacts.
    - Overwriting a prior RUN-* directory.
    - Using Amazon Bedrock.

  success_criterion: >-
    ALL of: (1) AST stdlib audit pass; (2) G0–G4 pass; (3) e1_complete_pair_count
    = 8 with e1_table_match_rate = 1.0; (4) every positive cell has
    certified_relation_count ≥ 100; (5) quotient_rank_one_rate = 1.0 and
    raw_rank_matches_eval_rate = 1.0 on those certified relations under both
    RANK-A and RANK-B; (6) null_object and non_stable controls pass at each
    positive n; (7) no invalidation_rule fired. Outcome label O-CLEAR-IMP.
    This success clears IMP-PART2-CURVE-LIBS-1 for successor Part-2 work; it
    does NOT by itself set H-BINSTD-ce4f38 to supported.

  falsification_criterion: >-
    ANY of: (F1) quotient rank ≠1 on a triple-certified relation with
    counterexample_certificate (O-REFUTE-Q); (F2) raw ranks ≠ EVAL on such a
    relation (O-REFUTE-L3); (F3) G4 failure while ranks were still read;
    (F4) non-stdlib library used to produce reported E1/rank values. Budget
    exhaustion and e1_table_disagree are NOT falsification of H1/L3/L4.

  required_artifacts:
    - experiments/EXP-BINSTD-835841/implementation/ (builder + audit + cert/rank)
    - experiments/EXP-BINSTD-835841/runs/<RUN-BINSTD-*>/manifest.yaml
    - experiments/EXP-BINSTD-835841/runs/<RUN-BINSTD-*>/raw-result.json
    - experiments/EXP-BINSTD-835841/runs/<RUN-BINSTD-*>/stdout.log
    - experiments/EXP-BINSTD-835841/runs/<RUN-BINSTD-*>/stderr.log
    - experiments/EXP-BINSTD-835841/stage0/api-freeze.md
    - experiments/EXP-BINSTD-835841/stage0/import-audit.json
    - experiments/EXP-BINSTD-835841/stage0/g0-planted-report.json
    - experiments/EXP-BINSTD-835841/stage1/e1-table-comparison.json
    - experiments/EXP-BINSTD-835841/stage1/gates-g0-g4.json
    - experiments/EXP-BINSTD-835841/stage1/relations-n17.jsonl
    - experiments/EXP-BINSTD-835841/stage2/e1-table-comparison.json
    - experiments/EXP-BINSTD-835841/stage2/relations-summary.json
    - experiments/EXP-BINSTD-835841/RESULTS.md
    - counterexample_certificate.json if F1/F2 fires

  procedure:
    ordering_note: >-
      Stages run in order 0→1→2. Blocking gate failure stops per stopping_rules.
      Parent EXP-BINSTD-178742 gate/CERT definitions are normative by citation.
    steps:
      - id: S0-API
        text: >-
          Freeze builder API (build_cell(n,a) → {group_order, factorisation, r,
          lambda, generator, field_poly}; certify_relation; rank_bases) under
          implementation/; write stage0/api-freeze.md before any scientific cell.
      - id: S0-AUDIT
        text: Run AST import audit; write stage0/import-audit.json; halt on failure.
      - id: S0-G0
        text: CTL-PLANTED on fixture r; write stage0/g0-planted-report.json.
      - id: S1-E1-17
        text: Build (17,0)/(17,1); compare to e1 table + fixture_n17; halt on disagree.
      - id: S1-G1-G4
        text: Run G1–G4 in parent order; record gates-g0-g4.json.
      - id: S1-REL
        text: Collect ≥100 CERT-* relations per (17,a); report ranks; dual seeds.
      - id: S1-CTRL
        text: null_object_k1 and non_stable_subspace at n=17.
      - id: S2-REPL
        text: Repeat E1+relations+controls for n∈{23,31,41}, a∈{0,1}.
      - id: S2-SUM
        text: Write RESULTS.md with O-* outcome label; no ledger status edits.

  assigned_to: executor
  executor_handoff: TASK-20261002-287317
  snapshot_task: TASK-20261002-b15c24

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
