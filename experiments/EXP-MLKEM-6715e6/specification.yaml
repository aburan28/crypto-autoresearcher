experiment:
  id: EXP-MLKEM-6715e6
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-MLKEM-dc51f5
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  batch_id: null
  assigned_to: executor

  title: >-
    Review-required contract: the multi-target weak-key screen for ML-KEM --
    an exact secret-norm tail, a derived threshold gamma_crit, and a toy-scale
    measurement of public-key selection with a planted-degeneracy positive
    control, a graded degeneracy ladder, and a ring-deleted matched null

  objective: >-
    If separately approved, frozen and authorised, decide the primal-uSVP
    multi-target key-selection lane by computing two quantities and measuring a
    third. COMPUTE: (i) the exact distribution of ||(s,e)||^2 by D-fold integer
    convolution and the resulting threshold ratio gamma/gamma_crit at three
    illustrative parameter rows; (ii) the maximum achievable GAIN over the
    shortfall u, evaluated against the EXACT tail rather than a Gaussian form.
    MEASURE: (iii) at toy parameters, the distinguishing advantage of an
    A-oblivious public-key statistic between low-norm and typical keys, against
    a planted-degeneracy positive control that must fire, a graded degeneracy
    ladder, and a ring-deleted matched null. The screen is the deliverable in
    its own right: a lane retired at derivation cost, or promoted to the goal's
    top priority, before any lattice reduction is attempted.

  what_this_is_not:
    - Not an attack on ML-KEM. No key is recovered, no lattice is reduced at any cryptographic dimension, and no attack is implemented, run or claimed.
    - Not a security level or margin for any FIPS 203 parameter set. Every (beta, d) pair is illustrative and RECALLED-UNVERIFIED and no parameter set is asserted affected or cleared.
    - Not a statement about dual attacks, hybrid attacks, decoding attacks, decryption failures, failure boosting, chosen-ciphertext oracles, or implementation side channels. All are outside the contract and none is closed by any outcome.
    - Not a statement about ciphertext-side multi-target selection, which is a different object owned by IDEA-20260805-3d71ca.
    - Not a measurement of gamma at cryptographic block size. gamma is DERIVED from a recalled estimate; the optional toy arm measures a toy analogue that does not transfer, and the contract says so at every use.
    - Not a claim that multi-target attacks on lattice schemes are impossible.
    - Not approval, freezing, execution authorisation, a run, an observed output, or evidence.

  claim_ceiling:
    tier: toy
    tier_vocabulary_note: >-
      `toy` is chosen from the TIER_ORDER vocabulary {toy, medium, crypto} in
      tools/validate_ledger.py rather than an off-vocabulary string, because an
      off-vocabulary tier causes the validator's ceiling check to be SKIPPED.
      This contract therefore accepts the strictest ceiling its measured arms
      can support. The DERIVED arms (the exact tail, the threshold) reach
      cryptographically shaped parameters but rest on relayed constants and
      measure nothing, so they are recorded as derivations and do not raise the
      package's ceiling.
    exact_scope_a_run_could_support: >-
      At most: (a) an exact statement about the distribution of a sum of
      D iid centred-binomial squares; (b) a threshold comparison at three
      illustrative parameter rows under a recalled uSVP estimate and a declared
      cost convention; (c) a toy-scale (n in {8, 16}, k = 2) measurement that
      an A-oblivious public-key statistic does not separate low-norm from
      typical keys while separating planted-degenerate keys. Nothing about
      ML-KEM at n = 256. Nothing about any attack family other than primal
      uSVP.

  inputs:
    derived_arm_parameters:
      n: 256
      q: 3329
      rows:
        - {label: "ML-KEM-512-shaped", k: 2, eta1: 3, D: 1024, beta: 400, d: 1000}
        - {label: "ML-KEM-768-shaped", k: 3, eta1: 2, D: 1536, beta: 623, d: 1500}
        - {label: "ML-KEM-1024-shaped", k: 4, eta1: 2, D: 2048, beta: 875, d: 2000}
      c_T: 0.292
      gamma_crit_rule: "gamma_crit = (2 * phi(0)/Phi(0) / (c_T * ln 2)) * sqrt(D/kappa) = 7.8843 * sqrt(D/kappa)"
      kappa_rule: "kappa = Var(X^2)/E[X^2]^2 computed exactly from P[X=j] = C(2 eta, eta+j)/2^{2 eta}; expected 3/2 at eta=2 and 5/3 at eta=3"
      u_grid: "0 to 0.30 inclusive, step 0.0002"
      provenance_note: >-
        beta and d are RECALLED-UNVERIFIED, are NOT taken from FIPS 203 or from
        any read source, and are used ONLY to illustrate the threshold
        arithmetic. Every derived cell carries the label. c_T is RELAYED from
        KN-TECH-044 / KN-TECH-040; primaries NOT READ. The 2016 uSVP condition
        form is RECALLED-UNVERIFIED and its verification is stage 0.
    measured_arm_parameters:
      toy_n: [8, 16]
      toy_k: 2
      toy_q: 3329
      toy_eta: 3
      keys_per_arm: 20000
      keys_per_arm_note: >-
        Chosen so that a total-variation estimate over the declared statistic
        has a chance floor small enough to resolve the planted control; the
        achieved floor is computed and reported, and if it exceeds the planted
        control's expected advantage the arm is reported as underpowered
        rather than negative.
      declared_A_oblivious_statistics:
        - "S1: the empirical distribution of coefficients of t, summarised by its first four moments"
        - "S2: the Hamming weight of the centred representatives of t below a declared threshold q/8"
        - "S3: the minimum over CRT slots of the F_q-norm of the slot value of t"
        - "S4: the number of CRT slots at which t has a slot value of norm below a declared threshold"
      statistic_freeze_note: >-
        The four statistics are FROZEN HERE, BEFORE ANY DATA EXISTS. No fifth
        statistic may be added after any arm is read; adding one requires a
        versioned amendment with confirmatory_status exploratory_only. S3 and
        S4 are included specifically because they are the statistics a
        degeneracy WOULD show up in, so the planted control has a route to fire.
    seed_derivation_rule: >-
      All randomness derives from SHA-256. domain = "EXP-MLKEM-6715e6/v1".
      seed(label, n, k, arm, index) = SHA256(UTF-8 bytes of
      domain || "|" || label || "|" || decimal(n) || "|" || decimal(k) || "|"
      || arm || "|" || decimal(index)). Digest integers are big-endian
      unsigned. Uniform draws on Z_q use rejection sampling: draw 32 bits,
      discard values >= floor(2^32/q)*q, else reduce mod q. CBD(eta) draws
      consume 2*eta bits per coefficient and compute
      sum(a_i) - sum(b_i). master_index counters advance once per digest and
      are recorded. A third party reproduces every instance bit-for-bit from
      this rule.
    arm_labels: ["treatment", "null_relabelled", "planted_j1", "planted_j2", "planted_j4", "planted_j8", "ring_deleted"]
    environment_declaration: >-
      Verified by import on 2026-08-05 in this container: numpy 2.4.6 PRESENT;
      sympy ABSENT; scipy ABSENT; fpylll ABSENT; Sage ABSENT; Python 3.11.15.
      The derived arms and measured arms need none of the absent packages. The
      OPTIONAL stage-4 gamma arm would need a lattice reducer; since fpylll is
      absent, it uses a pure-Python LLL at toy dimension or is reported as NOT
      RUN. Reporting it as not run does not invalidate stages 0-3.

  independent_variables:
    - the shortfall u, over the declared grid (derived arms)
    - the parameter row (derived arms)
    - the arm label (measured arms)
    - the number of zeroed CRT slots j in {0, 1, 2, 4, 8} (graded ladder)
    - toy dimension n in {8, 16}

  arms_and_controls:
    treatment: >-
      Toy MLWE keys drawn with A uniform on R_q^{k x k} and (s, e) from
      CBD(eta). Keys are partitioned by realised ||(s,e)||^2 into the lowest
      decile and the median decile, and each frozen statistic is used to
      distinguish the two populations. Reported quantity: the estimated total
      variation distance with per-group error bars.
    measured_null: >-
      NULL_RELABELLED, a null object of the same shape whose forced value is
      derived pre-run and which CAN FAIL. Identical key population, identical
      statistics, identical estimator -- but the decile labels are permuted
      uniformly at random, so the conditioning carries no information. FORCED
      VALUE: the estimated advantage equals the estimator's chance floor for
      the sample size, which is computed in closed form and stated before the
      run. IT CAN FAIL: a biased or leaky estimator reports spurious advantage
      here, and this arm exists to catch exactly that before the treatment arm
      is believed.
    positive_control: >-
      PLANTED_J1, the nearby object where the effect MUST appear. Keys built
      with s = 0 in exactly one CRT slot. In that slot t_i = e_i is a SMALL
      element rather than uniform, so statistics S3 and S4 must separate these
      keys from ordinary ones with advantage approaching 1 at the declared
      sample size. THE REMOVED OBJECT IS SLOT NON-DEGENERACY; THE STATISTIC IS
      S3 (and S4); THE SENSITIVITY IS ADVANTAGE >= 0.90 AT THE DECLARED SAMPLE
      SIZE, DECLARED HERE BEFORE THE RUN -- the three obligations of
      KN-TECH-1a5b7e discharged as a criterion with a threshold and a named
      comparator, not as advice. IF PLANTED_J1 DOES NOT REACH 0.90, THE
      INSTRUMENT IS BROKEN AND NO NEGATIVE FROM THE TREATMENT ARM MAY BE
      REPORTED.
    graded_control: >-
      PLANTED_J1 / J2 / J4 / J8: the same construction with j in {1, 2, 4, 8}
      slots zeroed, giving three interior points beyond the j = 0 treatment and
      the j = 8 extreme. Required reporting: advantage per j per statistic and
      a monotonicity verdict. Non-monotonicity localises an instrument defect
      to a specific degeneracy level instead of leaving "it did not work".
    ring_deleted_matched_null: >-
      RING_DELETED, the object-removal null that GOAL-MLKEM-005's C2 demands.
      A plain-LWE instance with A uniform on Z_q^{nk x nk}, matched to the
      treatment arm in dimension nk, modulus q, secret law, error law, sample
      count, statistic set, estimator and seed discipline; differing ONLY in
      that the matrix is unstructured. FORCED VALUES, DERIVED BEFORE THE RUN:
      (i) there are no CRT slots, so the degeneracy escape falls from
      (n/2) q^{-2k} to q^{-nk} and S3/S4 have no slot to read; (ii) THE PLANTED
      POSITIVE CONTROL IS UNCONSTRUCTIBLE in this arm, and reporting that it
      cannot be built is itself the ring's sensitivity demonstration; (iii) the
      exact-equivariance check [rot(A), Phi_k] = 0 holds on the treatment arm
      and fails on this one, which is the cheapest available proof that the two
      arms are different objects. UNMATCHED FEATURE, DECLARED NOT DISCLAIMED:
      the treatment matrix has nk^2 free Z_q parameters against (nk)^2 here, so
      any statistic sensitive to parameter count separates the arms without the
      ring being responsible. This contract does NOT resolve that confound; it
      records it, and IDEA-20260805-530869's entropy-matched arm is named as
      the successor that would.
    ordering_control: >-
      NULL_RELABELLED and all planted arms are generated, scored, written to
      disk and SHA-256 committed BEFORE any treatment number is generated or
      inspected. The commitment hash appears in the run manifest. Absence of
      the commitment is invalid_measurement.
    verdict_on_the_null_first: >-
      The frozen decision rule is executed against NULL_RELABELLED before the
      treatment arm is opened. If it emits the same verdict on both, the rule
      discriminates nothing and must be rewritten before the treatment arm is
      read.
    archive_check: >-
      ZERO COMPUTE. Enumerate every prior measurement in this corpus of attack
      cost conditioned on ||(s,e)||, and every prior ML-KEM null matched on the
      ring. EXPECTED: none of either. Recorded as an absence; no claim is made
      from the absence.
    comparability_policy: >-
      No cross-contract comparison to EXP-MLKEM-007..015, and none to
      IDEA-20260805-3d71ca's ciphertext-side quantity, may be made from within
      this contract. A shared vocabulary ("left tail", "target selection") does
      not imply a shared object: 3d71ca varies the ciphertext at a fixed key
      and tracks a projected-error norm; this contract varies the key and
      tracks ||(s,e)||. Any comparison requires a separately registered
      comparator contract naming both objects and the expected relation.

  metrics:
    primary:
      - WK-1 exact E[S] and Var(S) from the D-fold convolution, per parameter row, with the numerical residual against the closed forms D eta/2 and D Var(X^2).
      - WK-2 gamma, gamma_crit and their ratio, per parameter row, with the (beta, d) provenance recorded on every cell.
      - WK-3 maximum GAIN over the u grid against the EXACT tail, with the maximiser u* and the implied key count 1/p(u*).
      - WK-4 estimated total variation for each frozen statistic on the treatment arm, with per-group error bars and the achieved chance floor.
      - WK-5 the same on PLANTED_J1, reported BEFORE any treatment negative is written.
    secondary:
      - WK-6 the graded ladder table over j in {0, 1, 2, 4, 8} per statistic, with the monotonicity verdict.
      - WK-7 every statistic on RING_DELETED, plus the exact-equivariance check on both arms, plus an explicit record that the planted control is unconstructible there.
      - WK-8 (OPTIONAL) toy-dimension gamma measured by pure-Python reduction against the derived gamma, reported as a ratio with no threshold and with the non-transfer statement attached; may be reported as NOT RUN.
      - The exact-versus-Gaussian tail discrepancy across the u grid, in bits.
      - The exact per-slot degeneracy probability measured at toy n against q^{-2k}, as a ratio (HEUR-WK-2's validation).
      - The stage-0 source-verification log for the 2016 uSVP condition, verbatim or an explicit NOT OBTAINED.

  heuristic_under_test: HEUR-WK-1

  preregistered_prediction:
    quantity: >-
      The threshold ratio gamma/gamma_crit per parameter row; the maximum GAIN
      against the exact tail; the exact moments; and the treatment-versus-
      planted advantage separation.
    formula: >-
      E[S] = D eta/2 and Var(S) = D Var(X^2); kappa = Var(X^2)/E[X^2]^2;
      gamma_crit = 7.8843 sqrt(D/kappa); gamma = 1/(2 ln delta_beta +
      (2 beta - d - 1) (1 - ln(beta/(2 pi e)))/(2 beta^2)) with
      ln delta_beta = ln(beta/(2 pi e))/(2 beta);
      GAIN(u) = (c_T gamma/2) u + log2 P[S <= (1-u) E[S]].
      PREDICTED VALUES, FIXED BEFORE EXECUTION:
      E[S] = 1536 and Var(S) = 3840 at (D, eta) = (1024, 3);
      E[S] = 2048 and Var(S) = 3072 at (2048, 2);
      kappa = 5/3 at eta = 3 and 3/2 at eta = 2;
      gamma = 108.26 / 150.92 / 200.80 and gamma_crit = 195.43 / 252.30 /
      291.33, so ratio = 0.554 / 0.598 / 0.689, all below 1;
      max GAIN = -0.987 / -0.991 / -0.992 bits at u* <= 0.001;
      treatment advantage at the chance floor; PLANTED_J1 advantage >= 0.90.
    source: >-
      Derived in H-MLKEM-dc51f5 `mechanism` from the CBD moment generating
      computation, the CRT decomposition of Z_q[X]/(X^256+1) at q = 3329
      (computed in-repo: q - 1 = 2^8 * 13, ord_512(3329) = 2, hence 128
      irreducible quadratics), and the differentiated 2016 uSVP condition. The
      uSVP condition itself is RECALLED-UNVERIFIED and no source for it was
      read; verifying it is stage 0.
    fixed_before_execution: true

  scale_relevance:
    tier: toy
    justification: >-
      The MEASURED arms run at n in {8, 16} against ML-KEM's n = 256, and the
      per-slot degeneracy probability at toy n is enormously larger than at
      n = 256, so the toy arms test the ARGUMENT of Part A, not the ML-KEM
      number. The DERIVED arms evaluate at cryptographically shaped D and at
      illustrative block sizes, but they measure nothing and rest on relayed
      constants; they are derivations. The honest limit of transfer is stated
      as a numbered heuristic: HEUR-WK-1 asserts that the block size depends on
      (s,e) only through its norm with the stated linear response, and NOTHING
      in this contract validates that at n = 256. If HEUR-WK-1 fails, the
      derived arms carry to ML-KEM not at all, and the contract's transferable
      content reduces to Part A's uniformity argument, which is exact and
      n-independent.
    correspondence: null

  tail_checks:
    - Report the exact-versus-Gaussian tail discrepancy over the whole u grid in bits, not only at the maximiser. A discrepancy exceeding 0.05 bits anywhere in the region of interest downgrades gamma_crit to indicative and makes the exact maximisation authoritative.
    - Compare the observed extreme (the single lowest ||(s,e)||^2 among all drawn toy keys) against its predicted extreme-value probability from the exact distribution. A deviation indicates the sampler is not drawing the declared law.
    - Confirm that the treatment arm's realised E[S] and Var(S) at toy n match the closed forms for that n, which pins the sampler independently of the ML-KEM-shaped derivation.

  replication:
    seeds: [1, 2, 3, 2026, 20260805]
    independent_instances: 20000
    independent_instances_note: >-
      20000 independently keyed instances per arm per toy n, drawn by the
      declared seed rule. The five seeds index five independent repetitions of
      the whole measured-arm battery; every reported advantage carries its
      seed-to-seed spread, and THE SEED SPREAD IS REPORTED BEFORE ANY
      TREATMENT-VERSUS-NULL COMPARISON IS INTERPRETED. If the spread is
      comparable to the treatment-null difference, the result is reported as
      noise-limited, not as a negative.

  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_runs: 3
    stage_budget:
      stage0_source_and_derivation_seconds: 3600
      stage1_exact_tail_and_threshold_seconds: 600
      stage2_degeneracy_bound_seconds: 1800
      stage3_measured_arms_seconds: 7200
      stage4_optional_gamma_seconds: 14400
    no_network_stages_1_to_4: true
    network_stage0: >-
      Stage 0 requires outbound access to attempt verification of the 2016 uSVP
      condition. If unavailable, stage 0 records NOT OBTAINED, the condition
      remains RECALLED-UNVERIFIED, and every derived number is labelled
      unsourced. That is an infrastructure outcome and never mathematical
      evidence.

  stage_ordering_and_the_decisive_gate:
    stage0: >-
      ZERO COMPUTE, AND IT CAN REDIRECT THE WHOLE LINE. Verify the 2016 uSVP
      condition's form and re-derive gamma. If the form is materially
      different, Part C is withdrawn and re-derived before anything else runs;
      Part A is unaffected.
    stage1: >-
      SECONDS, AND IT IS THE CHEAPEST DECISIVE GATE. Exact D-fold convolution,
      WK-1 self-test against 1536/3840, then WK-2 and WK-3. IF gamma/gamma_crit
      COMES OUT ABOVE 1 AT ANY ROW, OR max GAIN IS POSITIVE, STOP AND ESCALATE:
      the lane is live and the goal's priority changes. This single stage can
      end the line in either direction and it costs seconds.
    stage2: >-
      MINUTES. Exact per-slot degeneracy probability at toy n by enumeration or
      exhaustive convolution, against q^{-2k}. Validates HEUR-WK-2.
    stage3: >-
      HOURS. The measured arms, null and planted arms committed and hashed
      first, then the treatment arm.
    stage4: >-
      OPTIONAL. Toy-dimension gamma by pure-Python reduction. May be reported
      as NOT RUN without invalidating anything above.
    which_stage_can_terminate: "stage 1, in both directions -- a ratio above 1 promotes the lane and a ratio below 1 with a negative max GAIN retires it. Stage 3's planted-control failure terminates reporting of any negative."

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived and explicitly authorised. It carries no approved_by field.
    - Stop and escalate at stage 1 if gamma/gamma_crit >= 1 at any row or if the maximum GAIN is positive.
    - Stop if WK-1's exact moments differ from the closed forms by more than 1e-9 relative.
    - Stop before the treatment arm if the null and planted arms' outputs and commitment hash are absent.
    - Stop before reporting any negative if PLANTED_J1 fails to reach advantage 0.90.
    - Stop if the seed-to-seed spread of any reported advantage exceeds the treatment-null difference; report as noise-limited instead.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any treatment number produced or inspected before the null and planted arms' commitment hash exists.
    - Any addition, removal or modification of the four frozen statistics after any arm is read.
    - Any change to the frozen constants, the u grid, the parameter rows, or the illustrative (beta, d) values after any number is observed. Changes require a versioned amendment with confirmatory_status exploratory_only; they are never edits.
    - Any derived cell presented without its RECALLED-UNVERIFIED provenance label on beta, d, c_T or the uSVP condition.
    - Any statement of Part C in Part A's quantifier order, i.e. any presentation of the threshold verdict as a uniform theorem about ML-KEM rather than as a finite table of illustrative rows.
    - Any negative disposition that fails to name all four residuals required by H-MLKEM-dc51f5 interpretation_limits (A-aware screening; ciphertext-side multi-target and decryption failures; dual/hybrid/decoding attacks; early-abort tests).
    - Any comparison to IDEA-20260805-3d71ca's quantity made from within this contract.

  success_criterion: >-
    THIS DRAFT HAS NO CURRENT SUCCESS OUTCOME BECAUSE IT IS NOT AUTHORISED FOR
    EXECUTION. If a later, separately approved and frozen successor is
    executed, its only positive disposition is a complete readout in which:
    stage 0 records the uSVP condition's status; WK-1 reproduces 1536/3840 and
    2048/3072 to 1e-9; WK-2 and WK-3 are reported for all three rows with their
    provenance labels; PLANTED_J1 reaches advantage >= 0.90 on S3 or S4;
    NULL_RELABELLED sits at its computed chance floor; the graded ladder is
    monotone; the ring-deleted arm is reported together with the explicit
    record that its planted control is unconstructible and with the declared
    unmatched entropy confound; and every advantage carries per-group error
    bars and its seed-to-seed spread. That disposition establishes a claim at
    tier `toy` about a toy-scale selection statistic plus a derivation about
    a threshold, and establishes NO ML-KEM attack, cost, security level,
    exponent or deployed-scheme conclusion.
    A CONCLUSIVE NEGATIVE -- the lane retired -- COUNTS AS SUCCESS EXACTLY AS A
    POSITIVE DOES, provided it names its four residuals and carries the
    gamma/gamma_crit margin (0.55 to 0.69) so no reader mistakes it for a
    comfortable closure.

  falsification_criterion: >-
    The hypothesis is falsified by: (F1) gamma/gamma_crit >= 1 at any row, or a
    positive maximum GAIN against the exact tail -- the screen's conclusion is
    wrong and the lane becomes the goal's top priority; (F4) a single toy
    instance in which t is not uniform despite every CRT slot of s being
    nonzero -- Part A's derivation is wrong and is withdrawn by a superseding
    record; (F5) WK-1's exact moments disagreeing with the closed forms -- the
    convolution is wrong and nothing downstream is reportable. PLANTED_J1
    failing is an INSTRUMENT failure, not a falsification: it invalidates the
    measured arms and licenses no conclusion in either direction.

  infrastructure_failure_disposition: >-
    A timeout, crash, missing dependency, unavailable network, memory
    exhaustion, or unobtainable source is reported as INFRASTRUCTURE SIGNAL and
    is NEVER negative mathematical evidence (AGENTS.md rule 5). Specifically:
    the absence of fpylll and Sage (verified 2026-08-05) means stage 4 may be
    reported as NOT RUN, and that report is not evidence for or against
    HEUR-WK-1; failure to obtain a source in stage 0 does not refute the uSVP
    condition and does not license treating the recalled form as verified; a
    truncated measured arm reports what it covered rather than failing, and its
    reduced sample size is carried into every error bar.

  required_artifacts:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - Stage-0 source log with verbatim quotation of the uSVP condition or an explicit NOT OBTAINED, dated before any derived number exists.
    - The exact convolution implementation, its WK-1 residual, and the exact-versus-Gaussian discrepancy table.
    - The WK-2 / WK-3 tables with the provenance label on every cell.
    - The null and planted arms' raw outputs with their SHA-256 commitment, written before any treatment number.
    - Raw per-key records for every arm: seed inputs, realised ||(s,e)||^2, the four statistic values, arm label, and j where applicable.
    - The graded-ladder table and monotonicity verdict.
    - The ring-deleted arm's outputs, the exact-equivariance check on both arms, the written matching policy with the UNMATCHED features enumerated, and the record that the planted control is unconstructible there.
    - The measured per-slot degeneracy probability against q^{-2k}.
    - Seed-to-seed spread for every reported advantage, reported before any interpretation.
    - Manifest, exact command, git commit and dirty-tree state, environment import record, stdout, stderr, timestamps and resource measurements.
    - Snapshot archive followed by independent validation and red-team review before any evidence record is written; C4 of GOAL-MLKEM-005 additionally requires the reviewers to check the stage-1 screen as a first-class artifact and not merely its arithmetic.

  approval_requirements:
    - Independent review confirms that stage 1 is genuinely decisive in BOTH directions and that a ratio above 1 would actually escalate rather than be absorbed.
    - Independent review confirms that NULL_RELABELLED can fail and that PLANTED_J1's 0.90 threshold is a criterion rather than advice.
    - Independent review confirms the four frozen statistics give the planted control a route to fire, since a control that no frozen statistic could detect would be a control that cannot fail.
    - Independent review confirms the Part A / Part C quantifier separation is enforced by the invalidation rules and not merely stated.
    - Coordinator separately approves and freezes; no approved_by field is present because this draft is not approved.

  approval_status: >-
    Pending Coordinator review. Not approved, not frozen, not authorised for
    execution. Only the Coordinator may approve (AGENTS.md rule 1).

  approved_by: null
