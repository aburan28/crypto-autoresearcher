experiment:
  id: EXP-PAIR-521450
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-5f24d7
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: THE MOV COST FUNCTIONAL IS A MINIMUM OVER THREE BRANCHES, NOT ONE, AND ITS BINDING OBSTRUCTION
    AT LARGE EMBEDDING DEGREE IS REPRESENTATION SIZE RATHER THAN INDEX-CALCULUS COST - a transferred
    instance may always be attacked by generic rho INSIDE F_{p^k}, so a cost model that charges only
    L_{p^k}(1/3) overstates the transfer's badness by an unbounded amount and is wrong in the same
    direction as the model that charged only the Miller loop was wrong in the other; the honest functional
    is C_pairing + min(NFS-family, 0.886 sqrt(N) field multiplications), subject to a hard wall at
    k.ceil(log2 p) bits per field element, and the deliverable is the crossover k*(p, N) below which
    the transfer beats rho on the curve
  status: draft
  objective: "(A) THE DEFECT BEING REPAIRED, AND ITS TWIN. This campaign has a recorded cost-model\
    \ failure - according to the account in ideas/catalogue-20260805/A4-transfers-lattice.md sections\
    \ 0 and A4-5, which is the source read for this record, EV-IT-002 observation O-4 and DEC-20260803-004\
    \ both record that a special-solver cost C_special_MOV = ceil(k . log2 p) charged only the Miller\
    \ loop and omitted the dominant field DLP, and that this defect class recurred three times. The\
    \ obvious repair - charge L_{p^k}(1/3) - introduces the OPPOSITE error, and that is what this\
    \ record is about. For k of size comparable to N, L_{p^k}(1/3) is a number so large that reporting\
    \ it as the cost of the transfer is not conservative, it is simply false, because nobody attacking\
    \ a transferred instance would run index calculus. They would run rho in the image group.\n(B)\
    \ THE CORRECT FUNCTIONAL. The MOV/Frey-Ruck transfer maps G injectively into mu_N inside F_{p^k}^*.\
    \ Solving the DLP in mu_N admits at least three algorithms and the attacker takes the cheapest\
    \ -\n  BRANCH 1 - the NFS family in F_{p^k}, at L_{p^k}(1/3, c) with c depending\n    on the variant\
    \ - plain NFS, TNFS and exTNFS for composite k, SNFS when\n    p has a special form. KN-OPEN-025\
    \ records that TNFS linear-algebra\n    speedups at k = 6 and 12 are reported but that NO end-to-end\
    \ figure\n    exists in this corpus, so the constant here is not settled.\n  BRANCH 2 - GENERIC\
    \ rho INSIDE mu_N, at approximately 0.886 sqrt(N)\n    multiplications in F_{p^k}. This branch\
    \ is ALWAYS available, needs no\n    smoothness, no factor base and no linear algebra, and it\
    \ is the branch\n    the L(1/3)-only model omits.\n  BRANCH 3 - not attacking the transferred\
    \ instance at all, i.e. rho on the\n    curve at 0.886 sqrt(N) group operations. This is the baseline\
    \ the whole\n    comparison is against.\nTherefore\n  C_MOV(p, N, k) = C_pairing(p, k) + min(\
    \ L_{p^k}(1/3, c) , 0.886 sqrt(N) . M(k, p) )\nwhere M(k, p) is the cost of one multiplication\
    \ in F_{p^k}. Comparing Branch 2 with Branch 3 gives the sharp qualitative statement - THE TRANSFER\
    \ IS NEVER MORE THAN A poly(k) FACTOR WORSE THAN DOING NOTHING, in an operation-count model, because\
    \ rho in the image costs the same number of steps with more expensive steps. So \"the transfer\
    \ is astronomically expensive at large k\" is FALSE as a time statement, and the reason large\
    \ k is safe must be found elsewhere.\n(C) WHERE IT IS ACTUALLY FOUND - THE REPRESENTATION WALL.\
    \ One element of F_{p^k} occupies k . ceil(log2 p) bits. At k of size comparable to N, that is\
    \ a number of bits of size comparable to N . log p - so a SINGLE element of the target field cannot\
    \ be written down, let alone multiplied. The transfer is infeasible at large k because its image\
    \ group is not representable, not because index calculus in it is slow. This is a MEMORY statement,\
    \ it is exact rather than asymptotic, and it is robust to every future improvement in NFS - which\
    \ is precisely the property one wants from a safety argument. It is also the honest version of\
    \ what KN-TECH-032 asserts qualitatively.\n(D) THE DELIVERABLE - k*(p, N). Define k*(p, N) as\
    \ the largest embedding degree at which C_MOV(p, N, k) is below the matched rho baseline 0.886\
    \ sqrt(N) group operations, computed separately under each NFS variant and reported as a table\
    \ over standardised parameter sizes (roughly 192, 224, 256, 384 and 521 bits). k* is what turns\
    \ a measured k (IDEA-20260807-98a970) into a verdict. NO VALUE OF k* IS ASSERTED IN THIS RECORD.\
    \ Any figure a reader may recall - including the familiar guidance that parameter validation should\
    \ require k above some threshold - must be RE-DERIVED here with its constants stated, not quoted\
    \ from memory, because quoting it is exactly how the three recorded cost-model failures happened.\n\
    (E) WHAT THIS IS NOT. It is not an attack, not a new algorithm, and not a claim that any curve\
    \ is weaker or stronger than believed. It is a cost model with three branches instead of one,\
    \ a hard wall stated in bits, and a crossover table. Its expected effect on every deployed curve\
    \ is precisely zero, and its expected effect on this campaign is to stop a fourth recurrence of\
    \ the same accounting error."
  resource_label: R7 (pairings into F_{p^k}), consumed as a COST MODEL rather than as an attack -
    the record prices the R7 route and never runs it.
  admissibility: admissible
  admissibility_argument: Admissible - the transfer target F_{p^k} is a different group and its cost
    is not a generic-group quantity, so KN-FIND-b7e091 does not apply and no endomorphism is applied
    to any point of G. The record is nevertheless expected to conclude that the admissible route is
    priced out of contention for every curve of interest, which is a quantitative closure rather than
    a filtered one.
  reachability_gate: NOT A MOVE BETWEEN CURVES. The reachability content is that k, and hence the
    position on this cost curve, is an isogeny-class invariant (IDEA-20260807-b92080), so an attacker
    cannot move along the curve at any cost. The record therefore prices a route that is fixed at
    instance-creation time - which is what makes k* a scope threshold rather than a search target.
  inputs:
    procedure: 'STAGE 1 (minutes, zero dependencies): the representation-wall table of Step 2. It
      is exact arithmetic and it alone settles the large-k question. STAGE 2 (hours): freeze and hash
      the formula. STAGE 3 (HARD GATE, hours): the unit null and the tripwire test. STAGE 4 (blocking,
      hours to days): transcribe three finite-field DLP records; if impossible, ship UNCALIBRATED.
      STAGE 5 (hours): compute k* per size per variant, plus the sensitivity sweep. STAGE 6 (HARD
      GATE): the pairing-friendly positive and the random-curve null. STAGE 7: emit the verdict column
      and the just-below-k* nearby-object control. THE CHEAPEST DECISIVE STEP IS STAGE 1 - a table
      of k . ceil(log2 p) bits, computable in a minute, which already establishes the lane''s safety
      statement in a form no future algorithmic improvement can touch.'
    mechanism: STEP 1 - FREEZE THE FORMULA BEFORE LOOKING AT ANY CALIBRATION POINT. Write C_pairing(p,k)
      as an explicit count of F_{p^k} operations for a Miller loop of length log2 N plus the final
      exponentiation, and write both DLP branches with their constants named as symbols. Hash the
      specification. This ordering is not bureaucratic - it is the specific control that would have
      caught the recorded C_special_MOV substitution. STEP 2 - THE REPRESENTATION WALL, which costs
      nothing and should be computed first. Tabulate k . ceil(log2 p) bits for each standardised p
      and for k in {1, 2, ..., 24, 10^3, 10^6, 10^9, N}. State the k at which one field element exceeds,
      respectively, a cache line, a machine's memory, and the estimated storage of the planet. This
      is exact arithmetic, it is the strongest part of the record, and it does not depend on any NFS
      constant. STEP 3 - CALIBRATE BRANCH 1. Transcribe at least three published finite-field DLP
      computations into knowledge/literature with their exact field sizes and reported effort - NONE
      is transcribed in this corpus today and this is the blocking dependency A4-5 already identified.
      Predict each with the frozen formula and report the ratio predicted-to-actual. If no record
      can be transcribed, ship the model as UNCALIBRATED, forbid its use as a decision threshold,
      and say so - never calibrate against a remembered figure. STEP 4 - COMPUTE k*(p, N) by solving
      C_pairing + min(branch 1, branch 2) = 0.886 sqrt(N) for k, numerically, once per (parameter
      size, NFS variant). Report the full curve, not just the crossing point, and report separately
      under plain NFS, under exTNFS for composite k, and under SNFS for special p - three columns,
      because the answer differs and collapsing them hides the assumption. STEP 5 - THE SENSITIVITY
      ANALYSIS, which is what makes the table usable. Recompute k* with the Branch 1 constant varied
      over the range that KN-OPEN-025's unresolved end-to-end TNFS question leaves open, and report
      how much k* moves. If k* is insensitive to that range, the open problem does not block the verdict
      and the record should say so; if it is sensitive, the verdict is conditional and must be labelled
      so. STEP 6 - EMIT THE VERDICT COLUMN for IDEA-20260807-98a970's table, and the tripwire unit
      test asserting that ceil(k . log2 p) is not an admissible C_MOV value.
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - pairing-friendly k = 12 positive - the model must return a win
  - random-curve null - 100 out of 100 ratios above 1
  - just-below-k* nearby object - must be returned AFFECTED
  - unit null - k* invariant under the cost unit
  - formula-substitution tripwire - ceil(k log2 p) rejected
  - monotonicity sweep in k with a single crossing
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, adopted in part from A4-5 because those
    are the right controls. PAIRING-FRIENDLY POSITIVE - a BN- or BLS-shaped parameter set with k =
    12. The model MUST return C_MOV below the matched rho baseline there. An oracle that cannot see
    the real MOV win where one exists is void, and this is the control that the k > 10^6 SAFE verdicts
    depend on. RANDOM-CURVE NULL - 100 sampled (p, N, k) triples from IDEA-20260807-6c7540''s sampler.
    C_MOV divided by matched rho must exceed 1 on 100 out of 100. A single sub-1 ratio means either
    the model or the order computation is wrong. DECAY PARAMETER - k itself. C_MOV / rho must be a
    monotonically increasing function of k over the whole sweep, and it must CROSS 1 exactly once.
    A non-monotone curve, or one that crosses more than once, indicates the branch selection is mis-implemented
    - most likely the minimum is being taken with inconsistent units. FORMULA-SUBSTITUTION TRIPWIRE
    - a unit test asserting that C_special_MOV = ceil(k . log2 p) is rejected by the model as inadmissible,
    so the exact substitution that voided EV-IT-002 cannot recur silently. This is A4-5''s control
    and it is retained verbatim in purpose. UNIT NULL - the entire model evaluated with all costs
    in group operations versus all costs in bit operations. The crossover k* must be the same quantity
    in both accountings up to the declared conversion; a k* that depends on the unit system is an
    accounting error, and this is the cheapest check of the minimum''s correctness.'
  independent_variables: []
  metrics:
    primary:
    - k* per parameter size per NFS variant, with the sensitivity interval
    - the full C_MOV/rho curve as a function of k, not only the crossing
    - the representation wall in bits per (size, k) cell
    - predicted-to-actual ratio for each transcribed DLP record, or an explicit UNCALIBRATED flag
    secondary:
    - the L(1/3)-only versus three-branch ratio at one concrete large k
    - pass or fail of every control
  heuristic_under_test: null
  preregistered_prediction:
    quantity: the ratio C_MOV / matched rho at k = ord_N(p) for 100 random sampled parameter triples
    formula: Above 1 on 100 out of 100. Any triple below 1 indicates a model or order error and halts
      the line.
    source: pre-registered in IDEA-20260807-5f24d7 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Unit mixing. Branch 1 is usually quoted in an abstract operation count, Branch 2 in field multiplications,
    Branch 3 in elliptic-curve group operations. Taking a minimum across three different units is
    the single most likely way to produce a wrong k*, and the unit null exists for exactly this.
  - Precomputation amortisation. Branch 1 splits into a one-off precomputation and a per-target descent;
    a single-target comparison charges the whole precomputation, a multi-target one does not. This
    record is SINGLE-TARGET throughout and must say so; the multi-target regime is a different question
    (catalogue item A4-8, unrun).
  - Special p. Many standardised primes are of a special form chosen for fast reduction, which can
    enable SNFS and lower Branch 1's constant materially. This is a real effect and must appear as
    its own column, not as a footnote.
  - Reading the representation wall as a time bound. It is a memory and representability bound. A
    machine that could represent the elements would face Branch 2's time cost, which is only poly(k)
    worse than rho - so the two obstructions are different in kind and must not be conflated.
  - Treating an UNCALIBRATED k* as a threshold. The recorded history of this defect class in this
    campaign is three recurrences; the tripwire and the explicit flag exist because of it.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Above 1 on 100 out of 100. Any triple below 1 indicates a model or order error
    and halts the line.
  falsification_criterion:
  - The model returning C_MOV below matched rho for any random sampled parameter triple with large
    k. Either the branch minimum or the order computation is wrong; halt.
  - Failure of the pairing-friendly positive control. The oracle is blind to a real transfer win and
    every SAFE verdict derived from it is void.
  - k* depending on the choice of cost unit. Accounting error; the minimum is being taken across inconsistent
    quantities.
  - C_MOV/rho non-monotone in k or crossing 1 more than once. Branch selection is mis-implemented.
  - No finite-field DLP record transcribable in this environment. The model ships UNCALIBRATED, may
    not be used as a decision threshold, and the verdict column of IDEA-20260807-98a970 rests on the
    representation wall alone - which is weaker in coverage but stronger in robustness, and the record
    must say exactly that rather than presenting an uncalibrated number.
  - A published result showing that rho in mu_N inside F_{p^k} does not cost 0.886 sqrt(N) field multiplications.
    Branch 2's constant is wrong and the correction, while still directionally right, is mis-quantified.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
