# EXP-SSI-235f4c
# Capped j-return comparison at p = 59. Not approved: the walker is missing.
# IDEA-20261006-0c760e / H-SSI-03b806. No run is minted.
experiment:
  id: EXP-SSI-235f4c
  hypothesis_id: H-SSI-03b806
  source_idea: IDEA-20261006-0c760e
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  version: 1
  title: >-
    Capped j-return lengths o_3 and o_5 on y^2 = x^3 + x over F_59
  status: review_required
  frozen: false
  designed_at: '2026-10-07'
  approved_by: null
  execution_authorized: false
  objective: >-
    Measure the capped j-return lengths o_3 and o_5 of the rational
    degree-3 and degree-5 Vélu actions on E0: y^2 = x^3 + x over F_59,
    and test whether |o_3 - o_5| is at least 1.
  inputs:
    p: 59
    curve: "y^2 = x^3 + x"
    ell: [3, 5]
    cap: 16
    sentinel: 17
    expected_point_count: 60
  controls:
    - >-
      #E0(F_59) = 60, and every intermediate quotient also has p + 1
      rational points. A different count invalidates the walk.
    - >-
      Each used kernel is the unique rational subgroup of order ell.
      A count other than 1 aborts that walk as undefined and invalidates
      the comparison.
    - >-
      One step followed by the dual isogeny returns the starting j.
      A failure means the Vélu step is invalid.
    - >-
      The ordinary control is the first a in 1..20 for which
      y^2 = x^3 + x + a over F_59 has trace not divisible by 59.
      That curve is not walked. The recorded a is ordinary_control_a.
  independent_variables:
    - ell in {3, 5}
  metrics:
    primary:
      - absolute difference |o_3 - o_5|
      - o_3
      - o_5
    secondary:
      - point_count_E0
      - rational_subgroup_count_3
      - rational_subgroup_count_5
      - ordinary_control_a
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: absolute difference |o_3 - o_5|
    formula: >-
      o_ell is the least k in 1..16 such that the k-fold Vélu quotient
      by the unique rational subgroup of order ell returns j(E0), or 17
      if no such k exists. The prediction is |o_3 - o_5| >= 1, with both
      integers in 1..17.
    source: >-
      IDEA-20261006-0c760e predictions, read 2026-10-07. The prediction
      is the idea's own metric, direction different, minimum effect 1.
      It is not taken from a run.
  scale_relevance:
    tier: toy
    justification: >-
      One prime p = 59 and two primes ell. No transfer to CSIDH-512 or
      to any larger prime is claimed. Exponent delta against the costs
      in KN-TECH-027 is 0.
    correspondence: null
  tail_checks:
    - >-
      Sample size one has no tail. The sentinel 17 is reported as 17
      and is not dropped. A shared 17 is the negative outcome, not a
      discarded sample.
  replication:
    seeds: []
    independent_instances: 1
    replication_note: >-
      One deterministic walk on one curve. No future run slot is named
      and no RUN id is minted.
  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one defined walk or one invalidation.
    - Stop an ell-walk when j returns to j(E0) or when 16 steps are done.
    - A crash or timeout is incomplete, not a negative result.
  invalidation_rules:
    - p = 59 fails a primality check, or 59 is not 3 mod 4.
    - "#E0(F_59) is not 60."
    - Either rational subgroup count is not 1.
    - A dual step fails to restore the starting j.
    - The ordinary control curve is walked.
    - A class group, a class number, or a hidden shift is computed.
  success_criterion: >-
    The walk is defined: point_count_E0 is 60, both rational subgroup
    counts are 1, every dual step restores the starting j, and
    ordinary_control_a is recorded and not walked. Both o_3 and o_5
    lie in 1..17, and |o_3 - o_5| is at least 1.
  falsification_criterion: >-
    The walk is defined under the same controls, both o_3 and o_5 lie
    in 1..17, and o_3 equals o_5. The pair (17, 17) is this negative
    outcome. Equality inside the cap is a real result, not an
    invalid run.
  decision_impact:
    on_positive: >-
      Record that the capped j-orbits separate ell = 3 from ell = 5
      at p = 59 by at least 1. The hypothesis may move to analyzed
      only after a run receipt. The subexponential classical
      vectorization cost and the quantum cost 2^{O(sqrt(log p))}
      stay as stated in KN-TECH-027. No ideal is recovered.
    on_negative: >-
      Record that o_3 equals o_5 at p = 59 inside the cap, including
      when both are the sentinel 17. The inequality is rejected in
      that exact scope. The same costs in KN-TECH-027 stay unchanged.
      No transfer to another prime is closed.
  required_artifacts:
    - experiments/EXP-SSI-235f4c/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SSI-235f4c/runs/<RUN-ID>/command.txt
    - experiments/EXP-SSI-235f4c/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SSI-235f4c/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SSI-235f4c/runs/<RUN-ID>/raw-result.json
  assigned_to: executor
  missing_driver: >-
    No committed program enumerates E0(F_59), walks at most 16 Vélu
    quotients by the unique rational subgroup of order ell for ell in
    {3, 5}, and writes point_count_E0, rational_subgroup_count_3,
    rational_subgroup_count_5, o_3, o_5, and ordinary_control_a.
    harness/isogeny_class.py defines velu_odd and velu_image for one
    odd-degree isogeny. It is not this walker. tools/experiment_execution.py
    load_plan also refuses a trial plan unless status is approved and
    every trial names an allocated RUN id. This replication plan names
    no run slot.
  out_of_scope:
    - Hidden-shift or class-group computation.
    - Any prime other than 59.
    - A claim that changes the quantum cost in KN-TECH-027.
    - Kani embeddings or torsion-point images.
