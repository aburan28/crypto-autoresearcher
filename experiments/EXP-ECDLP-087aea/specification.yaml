  controls:
  - Every point used in a slope lies on the curve. A vertical chord is the sentinel and is not the residue
    0. Two inverses must agree.
  - The second generator 2G is scored beside the primary row and does not decide it. If 2G is the identity,
    that side row is skipped.
  - The null model draws 500 functions from the domain onto the observed image. Fewer than four fifths
    of them splitting leaves the claim unscored.
  - The unchanged original checker executes once before the new envelope is written and once in the native
    supervisor checker phase. Both are deterministic controls, not independent scientific review.
  - Compare preserved raw/legacy-manifest SHA256 values, old identities and metric mapping exactly; refuse
    source drift, output tampering, provenance mismatch or an existing successor output.
  - The native supervisor retains its current manifest-schema gate, live claim admission and immutable-output
    checks. No gate is removed or softened.
  independent_variables:
  - metadata representation only; all original scientific inputs and algorithms fixed
  metrics:
    primary:
    - native execution receipt status
    - original driver returncode
    - pre-envelope original checker returncode
    - supervisor checker returncode
    - exact source/output/provenance SHA256 correspondence
    secondary:
      primary:
      - matrix_holds
      - beyond_matrix
      secondary:
      - scored
      - scanner_ok
  preregistered_prediction:
    id: P-envelope
    quantity: Native validity of a fresh metadata-compatible reproduction
    formula: The original driver and both unchanged checker calls exit 0; raw/legacy-manifest bytes and
      bindings match; the supervisor returns output_validated. Any original matrix reading is permitted.
    source: The prospective adapter contract; no full scientific successor trial has been run during design.
  historical_scientific_protocol:
    objective: On the first eligible curve y^2 = x^3 + x + B over F_53, with B from 1 through 26, measure
      the chord slope from P to P+G. The positive reading is a loss of at least 1/5 and a split on at
      least half the slope values, written as two integer tests. A 500-draw null model must be usable
      or the claim is not scored. This is not a walk and it does not move the generic exponent.
    preregistered_prediction:
      quantity: 5*(|D| - |image|) is at least |D|, and twice the number of splitting values is at least
        the image size.
      formula: The positive reading is both inequalities on a scored curve. The negative reading is a
        scored curve that fails either one. An empty image or an unusable null model is not either reading.
      source: IDEA-20261006-76e571 fixes the integer tests for 1/5 and 1/2, and the 0.8 usability bar
        on 500 draws. Those bounds were fixed before this driver was executed.
    success_criterion: The manifest is valid, the scanner agrees, the null model is usable, the image
      is nonempty, 5*(|D| - |image|) is at least |D|, and twice the splitting count is at least the image
      size.
    falsification_criterion: The manifest is valid, the scanner agrees, the null model is usable, the
      image is nonempty, and either loss test or the split test fails.
    decision_impact:
      on_positive: Record that this one curve met both separators. Do not treat the slope as a sum-compatible
        index or as a faster discrete logarithm.
      on_negative: Record that this one curve missed a separator. Do not move the separators and do not
        start a walk from this manifest.
    stopping_rules:
    - Stop after one valid manifest for RUN-ECDLP-42444c.
    - Do not try a later B after the first eligible curve.
    - An unscored census is the recorded result. Do not move 1/5, 1/2, or 0.8.
    invalidation_rules:
    - A point used in a slope leaves the curve, or the two inverses disagree.
    - The sentinel is stored as the residue 0.
    - A timeout, crash, or missing image record.
    replication:
      seeds: &id001 []
      independent_instances: 1
      named_future_run_slot: RUN-ECDLP-42444c
      replication_note: One deterministic pass. The null-model labels are named in the driver.
  scale_relevance:
    tier: toy
    justification: One prime field of 53 elements and one curve. No walk is run.
    correspondence: null
