  - Any source/input/output/provenance digest mismatch, missing artifact or native supervisor manifest
    refusal.
  - A process crash, memory refusal or lost claim is execution/infrastructure evidence only.
  success_criterion: 'Comparison C-envelope: P-envelope holds with native output_validated and exact preserved
    source/output identities. This accepts only the reproduction/envelope implementation, regardless of
