  falsification_criterion: 'Comparison C-envelope: P-envelope fails because the adapter changes a bound
    scientific byte/metric/identity or cannot emit an admissible envelope despite successful unchanged
    legacy driver/checker processes. This rejects the adapter implementation, never the mathematical hypothesis.'
  decision_impact:
