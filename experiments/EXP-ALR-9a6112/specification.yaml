experiment:
  id: EXP-ALR-9a6112
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-778ba8; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-778ba8
  question_id: RQ-ALR-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Symbolic size ledger for the ALR lane: represented remainder-array bit count per route versus
    compact moment-interface bit count, tabulated at recorded toy parameters with a random-divisor
    null arm and a schedule-walk cross-check'
  objective: 'The run reduces one uncertainty: whether the ALR lane''s central cost claim, that the
    represented routes retain an nN coefficient body while the compact interface does not, is a checkable
    quantity or a verdict. (i) It fixes SIZE_REP as a closed form per route by walking each route''s
    committed operation schedule and recording the widest simultaneously live coefficient-slot set,
    so the nN figure either reproduces from the schedule or fails to. (ii) It fixes SIZE_CPT from
    the interface H-ALR-002 already specifies and evaluates both formulas at the parameters recorded
    in EXP-ALR-001 and EXP-ALR-002, emitting a ratio per curve family and per seed with the parameters
    printed alongside each number. (iii) It runs the identical accounting against a random squarefree
    target divisor of the same degree in the same invocation, where the null must match rather than
    differ, and reports both columns, so a ratio that secretly depends on elliptic structure is caught
    rather than published. The run also solves SIZE_REP = SIZE_CPT for the candidate count and reports
    whether the resulting threshold lies inside or outside the region c <= n that the object itself
    permits. Nothing about solving, factoring, or attacking is measured, and no source artifact is
    re-executed.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: for the five routes named in EV-ALR-001
      and at the parameters recorded in EXP-ALR-001 and EXP-ALR-002, the represented live-slot count
      agrees with the stated closed form to the reported mismatch count, the compact interface size
      is as stated, their ratio takes the tabulated values, and the crossover candidate count is the
      reported surface. What does NOT follow: that a softly O(n+N+c) constructor exists, that the
      represented routes are optimal or unimprovable, that the ratio persists at generic-prime parameters,
      that any lower bound holds on any machine model, or that the ALR lane has produced any speedup,
      attack, or security consequence whatsoever.'
  inputs:
    procedure: 'STAGE 0, parameter extraction, minutes: parse the committed EXP-ALR-001 and EXP-ALR-002
      specifications for (n, N, c, p) per curve family and seed; abort rather than guess if any is
      absent. STAGE 1, schedule walk, one to two hours of implementation: for each of the five routes
      named in EV-ALR-001, encode its operation list and compute the widest simultaneously live slot
      set and the instruction index at which control first becomes data-dependent. STAGE 2, formulas,
      minutes of compute: evaluate SIZE_REP per route and SIZE_CPT at every extracted parameter tuple.
      STAGE 3, diff, seconds: compare stage 2 against stage 1 and emit a mismatch count per route.
      STAGE 4, null arm, seconds: build a random squarefree monic of degree N over the same p plus
      n random abscissae, rerun stages 1 to 3 unchanged, print both ratio columns adjacently. STAGE
      5, threshold, seconds with sympy: solve SIZE_REP = SIZE_CPT for c and report the surface plus
      whether it intersects c <= n. STAGE 6, degenerate controls, seconds: rerun at c = 0 and n =
      1 and at a second toy prime. Total compute well under one CPU-minute.'
    instrument: 'Python 3 with sympy for the symbolic threshold solve and PyYAML for reading committed
      specifications. Existing repository modules: harness/toycurve.py for the exact toy field and
      curve arithmetic used to build the null arm''s abscissae, and harness/runner.py for the run-record
      and manifest discipline. No computer-algebra system beyond sympy, no Sage, no external service,
      and no re-execution of any imported source artifact.'
    parameters: Curve families p98561_j0_q16427_h6_u2_v3, p100129_j1728_q16687_h6_u3_v2, p99527_generic_q14219_h7_u2_v1
      as recorded in RQ-ALR-001. Seeds 16001, 16002, 18104, 18206, 18307. Divisor degrees n and N
      as recorded, plus a synthetic sweep n in {4, 8, 16, 32} crossed with N in {4, 8, 16, 32, 64}
      and c in {1, 2, 4, 8} for the threshold surface. Two toy primes for the p-independence control.
      Null arm sample size 200 random squarefree divisors per (n, N) cell. Five routes. Total 20 recorded
      cells plus 320 synthetic cells.
  controls:
  - Null arm with random squarefree target divisor of identical degree, executed in the same invocation
    as the signal arm, ratios printed together.
  - 'Per-route separation: five separate SIZE_REP formulas rather than one nN figure quoted for all
    five routes.'
  - Schedule walk versus formula diff, so the formula is checked against the operation list rather
    than assumed.
  - 'Unit control: recompute every ratio with p replaced by a different toy prime at fixed (n,N,c)
    and confirm the ratio is p-independent as the formula predicts.'
  - Degenerate control at c = 0 and at n = 1, where the compact interface should collapse to O(N)
    and the ratio to O(n).
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Replace the elliptic target divisor by a uniformly random squarefree
    monic polynomial over the same F_p of the same degree N, and the n source points by n uniformly
    random field elements, then run the IDENTICAL occupancy instrumentation and the IDENTICAL ratio
    formula in the same invocation. Here the null must MATCH, not differ: the accounting is a statement
    about the schedule, so the null arm must report the same nN watermark and the same (n+N+2c) interface
    size at matched (n,N,c). If the null''s ratio differs from the elliptic arm''s ratio at matched
    parameters, the ledger is silently measuring curve arithmetic rather than representation size,
    and the signal arm means nothing.'
  independent_variables:
  - source_divisor_degree_n
  - target_divisor_degree_N
  - candidate_count_c
  - route_identity
  - arm_signal_or_null
  metrics:
    primary:
    - size_rep_bits_per_route
    - size_cpt_bits
    - ratio_size_rep_over_size_cpt
    - formula_versus_schedule_mismatch_count
    - crossover_candidate_count_c_star
    secondary:
    - null_arm_ratio
    - instruction_index_of_first_data_dependence_per_route
    - p_independence_residual
    - degenerate_case_ratio_at_c_zero
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The ratio SIZE_REP/SIZE_CPT at each recorded toy parameter tuple, and the candidate
      count c_star at which the two sizes are equal.
    formula: SIZE_REP(n,N,p) = n*N*ceil(log2 p) bits, defined as the number of distinct target coefficient
      slots held simultaneously live across all n source points at the route's widest instruction.
      SIZE_CPT(n,N,c,p) = (n + N + 2c)*ceil(log2 p) bits, defined as n source weights plus 2c weighted
      moments plus the N-slot reduced target divisor the interface must read. Predicted ratio nN/(n+N+2c),
      predicted to exceed 4 at the recorded parameters and predicted to be independent of p. Predicted
      threshold c_star = (nN - n - N)/2, with compactness ending once c >= c_star.
    source: Pre-registered in the parent proposal IDEA-20260816-778ba8 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Every parameter is the toy parameter already recorded in EXP-ALR-001 and EXP-ALR-002,
      on toy prime fields near 10^5. The synthetic sweep extends only to n, N <= 64, well below any
      cryptographic size. The transfer assumption, stated rather than assumed, is that the live-slot
      count of a route is a property of its schedule and therefore scales as the formula says at larger
      n and N; that assumption is not tested here and no crypto-scale ratio is claimed.
    correspondence: null
  tail_checks:
  - Confirm that no recorded instance has n+2c exceeding N, which would place it in a regime the ratio
    formula treats as degenerate.
  - Check the largest and smallest ratio cells individually against a hand recomputation, since an
    off-by-one in slot counting shows up only at the extremes.
  - Check the null arm's ratio distribution for outliers rather than reporting only its mean, since
    a matching mean with a heavy tail would hide an accounting dependence on divisor structure.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop after all recorded cells and the synthetic sweep are priced and the null arm is complete;
    do not extend the sweep to find a more favourable ratio.
  - Abort and report if any recorded specification does not fix (n, N, c), rather than substituting
    a plausible value.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All five route formulas reproduce their walked schedules with zero mismatches
    across every recorded cell, the null arm ratio matches the signal arm ratio at matched (n,N,c)
    to within the reported tolerance, and a ratio table plus a crossover surface are emitted with
    their parameters attached.
  falsification_criterion:
  - Any nonzero formula-versus-schedule mismatch for any route at any recorded cell.
  - Null arm and signal arm ratios differ at matched parameters beyond the reported tolerance.
  - The ratio varies with p, contradicting uniform bit charging.
  - The crossover surface does not intersect the region c <= n, leaving part (D) of the claim empty.
  - A recorded specification fails to determine (n, N, c) and the run cannot proceed without inventing
    a parameter.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-778ba8
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must decide whether the recorded implementation references in H-ALR-001 and H-ALR-002
    may be read for their operation schedules without counting as re-execution of imported source,
    since EV-ALR-001 explicitly notes the import was not a destination-side re-execution.
  - The definition of a live slot needs a Coordinator ruling for routes that could recompute rather
    than store, because that choice alone can move SIZE_REP by a factor of n.
  - Whether the B in the recorded B^(7/2) figure is the same B as in the divisor degrees is unresolved
    here and is deliberately deferred to a separate commensurability entry.
