experiment:
  id: EXP-SIG-823e22
  hypothesis_id: H-SIG-22ec42
  derived_from_idea: IDEA-20260805-8a68d3
  question_id: RQ-SIG-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Planted-syzygy positive control for the residual-counting pipeline: a graded k ladder at two
    cells the goal already completes inside budget, bracketed by a duplicate-generator null arm and
    a rewritable-relation arm both scored and hash-committed before any planted number is read
  objective: >-
    The single uncertainty a run reduces is whether the pipeline that produces every number this
    goal owns can DETECT a non-rewritable syzygy family of known size. A run establishes (i) the
    recovery slope d(residual_D)/dk over the ladder k in {0, 1, 2, 4, 8, 16} at (n = 9, D = 4) and
    (n = 12, D = 5), with every consecutive difference reported individually so a detection ceiling
    is visible rather than averaged away; (ii) the intercept against the goal's committed unplanted
    residual, as a reproduction gate ordered first; (iii) the change in the rewritable family's rank
    from planting, scored against a value derived from the enumerator's own loop bounds before the
    run; and (iv) the duplicate-arm and rewritable-arm residuals, which bracket the instrument and
    are computed and hash-committed BEFORE any planted arm is read. The deliverable is a correction
    factor or a clean bill. No mathematical claim about the Semaev ideal is made or would follow.
  what_this_is_not:
  - >-
    NOT a new hypothesis about the Semaev ideal, not a semi-regularity or Hilbert-series claim, and
    not a solving-degree argument. It is a calibration of an existing instrument.
  - >-
    NOT support for the lane's substantive hypothesis. A passing calibration removes one reason to
    doubt the goal's numbers and nothing else.
  - >-
    NOT a demonstration that the cascade is absent if it fails. A failing slope says the
    instrument's response to a planted family of a specific shape is not unity.
  - >-
    NOT a status change to any hypothesis, evidence, decision or goal record, and not a promotion of
    any knowledge entry.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at n at most 12, D at most 5, on the boolean chained Semaev system
      and the goal's own pinned pipeline, the instrument's response to a planted family of the
      declared FLAT ADJOINED shape has a stated slope with a stated fit quality, and the duplicate
      and rewritable arms take stated values. WHAT DOES NOT FOLLOW - nothing about D at least 6,
      nothing about a planted family of CASCADE shape, nothing about any ECDLP or Semaev
      mathematical claim, and specifically NOT that a slope of 1 validates any residual value; it
      validates the instrument's sensitivity to one shape at two sizes.
  inputs:
    procedure: >-
      STAGE 0 (zero compute) - re-read the closure and rewritable-family code paths and DERIVE IN
      ADVANCE the exact change in the rewritable family's rank that k adjoined generators must
      produce, from the enumerator's own loop bounds. Hash-commit that derived value before any run.
      STAGE 1 (archive check, minutes, ORDERED FIRST) - reproduce the committed unplanted residuals
      at (n = 9, D = 4) and (n = 12, D = 5). A MISMATCH STOPS EVERYTHING and is reported as a
      reproduction failure, not as a calibration result. STAGE 2 (hand-checkable cell, minutes) - n
      = 9, D = 4, k = 1, with the planted syzygy exhibited explicitly as a row-index vector and
      VERIFIED IN THE KERNEL BY DIRECT SUBSTITUTION, and the expected residual computed by hand.
      THIS STAGE CAN END THE LINE - if k = 1 is not recovered, nothing further is worth running and
      the finding is already the deliverable. STAGE 3 (the bracketing arms, hash-committed before
      any planted number is read) - compute the duplicate arm (k adjoined exact duplicates of
      existing rows) and the rewritable arm (k planted products of existing generators) at both
      cells, score their forced values, and commit them. STAGE 4 (the sweep) - k in {0, 1, 2, 4, 8,
      16} at both cells, 3 planting-site seeds per cell, with the independence of the k planted
      bitmasks verified by rank BEFORE each cell's measurement. STAGE 5 (only if the slope is in
      band) - repeat at (n = 15, D = 5) to check size-independence of the calibration. STAGE 6 (zero
      compute) - report slope, intercept, R-squared and EVERY consecutive difference per cell, plus
      the rank-change comparison and the seed variance.
    instrument: >-
      The goal's own pinned pipeline, UNCHANGED - identity of projection with the measurement being
      audited is the design requirement, and any extra visibility would make the control
      non-representative. Independence of planted bitmasks verified by a separate rank computation
      over the k bitmasks. Recorded through harness/runner.py with the pipeline's exact commit sha.
    parameters: >-
      Two primary cells, (n = 9, D = 4) and (n = 12, D = 5), both of which the goal has repeatedly
      completed inside budget. A third cell (n = 15, D = 5) only if the slope is in band. D = 6 is
      EXCLUDED BY DESIGN - it is the cell that has broken every budget in this lane and no
      calibration result may depend on it. Ladder k in {0, 1, 2, 4, 8, 16}; 3 planting-site seeds
      per cell; three arms (planted, duplicate, rewritable). Per-cell cost is one Macaulay build
      plus one rank at a size the goal already runs; where the build dominates, builds may be shared
      across k and that sharing must be recorded, not assumed.
  controls:
  - >-
    NULL OBJECT OF THE SAME SHAPE, FORCED VALUE PRE-DERIVED, CAN FAIL. The k = 0 arm implemented as
    k adjoined DUPLICATES of existing rows. FORCED - residual_D unchanged from the committed
    baseline, and the k trivial syzygies absorbed entirely into the rewritable family. If residual_D
    moves on the duplicate arm, the pipeline is sensitive to the histogram change rather than to the
    planted structure and the whole sweep is confounded.
  - >-
    POSITIVE CONTROL, the k = 1 hand-checked cell, where the planted syzygy is exhibited explicitly
    and verified in the kernel by direct substitution. The effect MUST appear. If it does not, the
    instrument is blind and no negative from the later stages may be reported.
  - >-
    REWRITABILITY CONTROL, the nearby object where the effect must NOT appear. Plant k genuinely
    rewritable relations - products of existing generators - instead. FORCED - residual_D UNCHANGED,
    because a rewritable family belongs to the model family by definition. A pipeline that reports
    those as residual is over-counting and the goal's numbers are inflated. This arm and the
    treatment arm together BRACKET the instrument.
  - >-
    GRADED CONTROL WITH FOUR INTERIOR POINTS AND MONOTONICITY REPORTED. k = 1, 2, 4, 8 are interior;
    report EVERY consecutive difference, not only the fitted slope, so a saturation - slope 1 up to
    k = 4 then flat - is visible rather than averaged away. Saturation would be the most informative
    single outcome available: it would mean the instrument has a detection CEILING and the goal's
    residuals of order 10^3 all sit far above it.
  - >-
    ORDERING CONTROL. The duplicate-arm and rewritability-arm results are computed, recorded and
    HASH-COMMITTED before any planted-arm number is read. Confirmation pressure runs both ways here
    - a slope of 1 validates eight experiments and a slope of 0 invalidates them - and this ordering
    is the mitigation.
  - >-
    ARCHIVE CHECK ORDERED FIRST. The committed unplanted residuals must be reproduced exactly before
    any planted cell runs. A prior evidence record in this lane documents a reimplementation drift
    in the closure path caught by exactly this gate.
  - >-
    PRE-RUN INDEPENDENCE VERIFICATION. The rank of the k planted bitmasks is computed before each
    cell's measurement, so the k axis is established rather than assumed by the measurement it labels.
  - >-
    PRE-DERIVED RANK-CHANGE EXPECTATION. The expected change in the rewritable family's rank from k
    adjoined generators is derived from the enumerator's loop bounds at Stage 0 and hash-committed,
    so the observed change is scored rather than explained afterwards.
  independent_variables:
  - 'k, over the ladder {0, 1, 2, 4, 8, 16}'
  - 'cell: (n = 9, D = 4) and (n = 12, D = 5), plus (n = 15, D = 5) conditionally'
  - 'arm: planted non-rewritable / adjoined duplicates / planted rewritable'
  - planting-site seed, 3 per cell
  metrics:
    primary:
    - >-
      recovery_slope per cell - dimensionless, the ordinary least squares slope of residual_D
      against k over the ladder, with acceptance band 0.90 to 1.10 and forced value 1.00.
    - >-
      consecutive_differences per cell - integers, residual_D(k_{i+1}) minus residual_D(k_i) at
      every adjacent pair on the ladder, reported individually. This is what makes a detection
      ceiling visible.
    - >-
      unplanted_intercept per cell - integer, residual_D at k = 0, scored for EXACT equality against
      the goal's committed value. A mismatch stops the sweep.
    - >-
      rewritable_family_rank_change - integer, the change in rank of the model rewritable family
      from planting, scored against the value derived at Stage 0 and hash-committed. Any excess
      means planted non-rewritable relations are being classified as rewritable.
    secondary:
    - >-
      linear_fit_r_squared per cell - dimensionless, at least 0.98 expected because the relationship
      is deterministic.
    - >-
      duplicate_arm_residual per cell - integer, forced equal to the committed baseline.
    - >-
      rewritable_arm_residual per cell - integer, forced equal to the committed baseline.
    - >-
      seed_variance per cell - the spread of residual_D across the 3 planting-site seeds at fixed k.
    - >-
      the k = 1 planted syzygy exhibited as a row-index vector, with its substitution check.
    - >-
      per-cell wall clock, peak resident memory, matrix rows and columns.
  heuristic_under_test: HEUR-PLANT-1
  preregistered_prediction:
    quantity: 'recovery_slope at (n = 9, D = 4) and at (n = 12, D = 5).'
    formula: >-
      residual_D(k) minus residual_D(0) equals k exactly, so recovery_slope equals 1.00, acceptance
      band 0.90 to 1.10, with linear_fit_r_squared at least 0.98. Three competing readings are
      pre-declared and each localises a different defect - slope 0 means the instrument is blind and
      every reported residual is a constant of the apparatus; slope strictly between 0 and 1 means
      partial absorption and the reported residuals are systematic UNDER-counts, so the cascade is
      LARGER than recorded; slope above 1 means collateral syzygies and the reported residuals are
      OVER-counts.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-8a68d3, whose predictions block states the
      forced slope, the acceptance band, the R-squared floor and the exact-equality intercept
      condition, and whose mechanism block states the three failure shapes and what each localises.
      Fixed before any run and never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at n at most 15 and D at most 5, deliberately confined to cells the goal has already
      completed inside budget, with D = 6 excluded. That confinement is the design, not a
      compromise: the calibration must not depend on the cell that has broken every budget in this
      lane, and at D at most 5 - well below the freeze degree at these sizes - the variety change
      induced by planting does not drive the rank, which is what makes the planted and unplanted
      arms comparable. The transfer assumption is narrow and stated - that a slope measured at these
      sizes is indicative of the instrument's behaviour at the sizes the goal's other numbers come
      from - and it is explicitly NOT used to license any D at least 6 quantity.
    correspondence: null
  tail_checks:
  - >-
    Report every consecutive difference, not the fitted slope alone, so a saturation at k = 4 is
    visible rather than absorbed into an average that still lands near 1.
  - >-
    Report the seed variance at each k, since a slope of 1 that is an average over three wildly
    different sites is not the same measurement as three agreeing sites.
  - >-
    Report the duplicate-arm and rewritable-arm residuals FIRST in the deliverable, ahead of any
    planted number, matching the order in which they were computed and committed.
  - >-
    Report the k = 1 planted syzygy as an explicit row-index vector with its substitution check, so
    a reader can verify the plant rather than trust the label.
  - >-
    Report the matrix dimensions and peak memory per cell, so a cell that came close to the budget
    is visible before it is cited.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8.0
    maximum_memory_gb: 16
    maximum_runs: 40
  stopping_rules:
  - >-
    STOP EVERYTHING if Stage 1 fails to reproduce a committed unplanted residual. That is a
    reproduction failure and no calibration conclusion is drawn.
  - >-
    STOP if the pre-run rank check shows the k planted bitmasks are not F_2-independent. The k axis
    is mislabelled and the sweep is rebuilt, not reinterpreted.
  - >-
    STOP if residual_D moves on the duplicate arm. The measurement is histogram-sensitive and the
    sweep is confounded.
  - >-
    STOP after Stage 2 if k = 1 is not recovered. Nothing further is worth running and the finding
    is already the deliverable.
  - >-
    Do NOT run any D = 6 cell under this contract under any circumstances; it is excluded by design.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 3). A cell that exhausted memory is
    UNREACHED, not a cell with slope 0.
  - >-
    A run in which any planted-arm number was read before the duplicate-arm and rewritable-arm
    results were hash-committed is completed_invalid. The ordering is the control, and confirmation
    pressure here runs in both directions.
  - >-
    A run whose duplicate arm was not executed in the same invocation as the planted arm is
    invalid_measurement.
  - >-
    A run that reports a fitted slope without every consecutive difference is invalid_measurement; a
    saturation would be averaged away.
  - >-
    A run that modifies the goal's pipeline is completed_invalid. Identity of projection with the
    audited measurement is the design requirement.
  - >-
    A run whose parameters differ from the frozen contract - a different ladder, a different cell, a
    D = 6 cell - is a DIFFERENT experiment and requires a new contract.
  success_criterion: >-
    Stage 1 reproduces both committed unplanted residuals exactly; the pre-run rank check confirms
    F_2-independence at every cell; the duplicate arm and the rewritable arm both return residual_D
    equal to the committed baseline and are hash-committed before any planted number is read; the k
    = 1 hand-checked cell recovers the planted syzygy with its substitution check exhibited; and the
    run reports recovery_slope, intercept, R-squared and every consecutive difference at both
    primary cells, plus rewritable_family_rank_change scored against its pre-derived value. The
    instrument is CALIBRATED only if recovery_slope lies in [0.90, 1.10] at BOTH primary cells with
    R-squared at least 0.98 and rank_change equal to its pre-derived value; any other outcome
    produces a CORRECTION FACTOR instead, which is an equally complete deliverable.
  falsification_criterion:
  - >-
    recovery_slope below 0.90 at either primary cell - the instrument UNDER-reports, every committed
    residual in this goal is a lower bound of unknown tightness, and no negative result from this
    goal may be reported without that correction attached. A slope below 0.50 means more than half a
    planted non-rewritable family is absorbed.
  - >-
    recovery_slope above 1.10 - the instrument OVER-reports and the goal's growth laws need
    rescoping.
  - >-
    residual_D moves on the duplicate (k = 0) arm - the measurement is histogram-sensitive and the
    sweep is void.
  - >-
    residual_D moves on the rewritable arm - the model family fails to absorb genuinely rewritable
    relations and every non-rewritable count is inflated.
  - >-
    Stage 1 fails to reproduce a committed residual - a reproduction failure, reported as such, with
    no calibration conclusion drawn.
  - >-
    The consecutive differences saturate - slope near 1 at small k then flat - which means the
    instrument has a detection CEILING and the goal's residuals of order 10^3 sit far above it. This
    is pre-declared as the most informative single outcome available.
  required_artifacts:
  - manifest.yaml with the exact command, pipeline commit sha, dirty-tree state, resolved model/inference block and environment
  - raw-result.json carrying every per-cell, per-k, per-seed residual, not summaries
  - the duplicate-arm and rewritable-arm residuals, hash-committed before any planted number and reported first
  - the Stage 0 pre-derived rewritable-family rank change, hash-committed before any run
  - the k = 1 planted syzygy as a row-index vector with its explicit substitution check
  - slope, intercept, R-squared and every consecutive difference per cell
  - the pre-run rank verification of the k planted bitmasks per cell
  - per-cell matrix rows and columns, wall clock and peak resident memory
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval and the user's authorization are required before execution. This contract
    is review_required and is NOT approved; approved_by is null and execution_authorized is false
    (AGENTS.md rule 1).
  - >-
    The exact planting construction - which monomial, which generator indices, and the proof that
    the resulting relation is of neither Koszul nor principal-Frobenius shape - must be fixed in
    writing before approval. If the planted relation is rewritable after all, the whole treatment
    arm measures nothing.
  - >-
    The Stage 0 pre-derived rank change must be recorded and hash-committed before dispatch, since a
    value derived after seeing the measured change is an explanation and not a check.
  - >-
    The D = 6 exclusion must be stated in the task card. Executing a D = 6 cell under this contract
    is a contract violation, not an extension.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260805-8a68d3
    authored_at: '2026-08-25'
    note: >-
      The construction, the graded ladder, the three failure shapes, the duplicate and rewritability
      arms, the ordering control and the archive check are taken from the parent proposal's
      mechanism and minimal_test.controls blocks; the slope band, R-squared floor and exact-equality
      intercept condition are its predictions block verbatim in substance. The pre-run rank
      verification and the Stage 0 pre-derived rank change are the parent's assumptions turned into
      committed artifacts. Boilerplate identical across contracts by program rule comes from the
      fixed table. No field is invented; a value the proposal did not supply is a declared
      derivation gap.
  derivation_gaps:
  - >-
    The exact planting construction is described in shape but not fixed in instances. Which monomial
    and which generator pair are used at each site determines whether the relation is genuinely
    non-rewritable, and this must be settled before approval rather than chosen per cell.
  - >-
    Holding the degree histogram fixed via duplicate generators is the parent's own stated 'single
    most delicate part of the design'. Whether adjoining exact duplicates truly matches the planted
    arm's histogram at every k must be verified explicitly, not assumed, and a mismatch confounds
    the sweep.
  - >-
    Three planting-site seeds address site dependence only weakly. A strong treatment would stratify
    by block position; that is named as follow-up and is NOT claimed by this contract.
  - >-
    The committed unplanted residual at (n = 9, D = 4) has more than one recorded value across the
    lane's evidence records. Which one the archive check scores against must be named before
    approval, since 'exact equality' against an ambiguous target is not a gate.
  - >-
    Whether per-cell cost is dominated by the Macaulay build or by the rank determines whether builds
    can be shared across k, which changes the budget by a large factor. This is named as an
    optimisation, not assumed, and the run must record which regime it was in.
