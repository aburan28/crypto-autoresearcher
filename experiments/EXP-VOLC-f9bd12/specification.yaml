experiment:
  id: EXP-VOLC-f9bd12
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-bb03d3
  question_id: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'B-ROUGH-CONDUCTOR ASCENT AS A CANONICAL NORMAL FORM FOR AN ISOGENY CLASS: ascending every
    small-ell volcano simultaneously is polynomial and needs no factorization of t^2-4p, but it lands
    on a Cl(O)-TORSOR of size h(O), not on a point -- so the algorithm exists and is cheap while the
    multi-target amortization it would enable requires the target functional to be constant on the
    crater, which is precisely lane L1''s open question'
  status: draft
  objective: "(A) THE ALGORITHM. Given an ECDLP instance (E, P, Q) with E ordinary over F_p, and a\
    \ smoothness bound B:\n  1. Compute t by point counting; set D = t^2 - 4p.\n  2. For each prime\
    \ ell <= B, compute v_ell(D) by trial division ONLY --\n     no factorization of D is attempted.\
    \ Set h_ell = floor(v_ell(D)/2) for\n     odd ell (the correction at ell = 2 is stated in the\
    \ assumptions). By\n     Kohel, h_ell is the height of the ell-volcano, hence an upper bound on\n\
    \     E's level in it.\n  3. For each such ell with h_ell >= 1, ASCEND: identify the ascending\n\
    \     ell-isogeny by Fouquet-Morain walking (try each of the at most ell+1\n     rational ell-neighbours,\
    \ walk down h_ell steps, the unique neighbour\n     that does not dead-end is the ascent), apply\
    \ Velu, transport (P, Q)\n     through it. Repeat until the vertex has ell+1 rational ell-neighbours\n\
    \     and none of them ascends -- i.e. until the ell-crater is reached.\n  4. Output E*, its transported\
    \ instance (P*, Q*) with the SAME k, and a\n     certificate: the list of j-invariants along the\
    \ path, each step\n     re-verifiable by kernel-polynomial factorization plus a trace check.\n\
    The output E* has End(E*) of conductor free of every prime <= B: a B-ROUGH-CONDUCTOR NORMAL FORM.\
    \ When B exceeds the largest prime factor of c, E* has the MAXIMAL order O_K and is simultaneously\
    \ at the crater of every ell-volcano.\n(B) THE COST, AND WHY IT MATTERS THAT IT NEEDS NO FACTORING.\
    \ Step 2 is O(B) integer divisions. Step 3 costs O(ell * h_ell) Velu computations per ascent level\
    \ and at most h_ell levels, so O(ell * h_ell^2) per ell, and h_ell <= log_ell(2 sqrt(p)). Summing\
    \ over ell <= B gives O(B^2 * log^2 p) field operations up to logarithmic factors. THE POINT:\
    \ this is POLYNOMIAL in log p for fixed B, and it never factors D. The classical route to End(E)\
    \ is subexponential (KN-LIT-251 Bisson-Sutherland, KN-LIT-309 Bisson; both present in this corpus,\
    \ abstracts read, full papers NOT READ) precisely because it must handle ALL primes dividing c.\
    \ Ascending only in the small-ell volcanoes buys a partial normal form at polynomial cost. That\
    \ dichotomy -- cheap per small ell, subexponential in aggregate -- is the same one IDEA-20260807-3c6bd8\
    \ audits from the cost side.\n(C) THE HONEST OBSTRUCTION, WHICH IS THE REAL DELIVERABLE. Ascending\
    \ is cheap, but the ell-crater is not a point. The crater of the ell-volcano is a torsor under\
    \ Cl(O) acting by horizontal isogenies, of size h(O) which is Theta(sqrt(|disc O|)) up to log\
    \ factors. The ascent lands SOMEWHERE on that torsor, determined by where it started, and reaching\
    \ a SPECIFIED crater vertex is the vectorization problem underlying CSIDH, classically about p^{1/4}\
    \ (DECOMPOSITION T5, KN-TECH-027). THEREFORE:\n  - \"Move to the crater\" is CHEAP and is a legitimate\
    \ algorithmic primitive.\n  - \"Move to THE BEST curve on the crater\" is NOT, unless goodness\
    \ is\n    locally detectable, and the crater is homogeneous under Cl(O) so no\n    local test\
    \ distinguishes crater vertices by any Cl(O)-equivariant\n    quantity.\nTHE NORMAL FORM IS A\
    \ SET, NOT A POINT. This is the sharpest available statement of T5 for lane L2 and it is stated\
    \ here so that no downstream proposal may assume otherwise.\n(D) WHAT THE MEASUREMENT DISCRIMINATES.\
    \ Run any frozen cost functional C on (i) the starting curve E, (ii) the normal form E*, (iii)\
    \ a random OTHER vertex of the same crater reached by a horizontal walk of the same length. Three\
    \ outcomes, all informative and mutually exclusive:\n  (O1) C(E*) systematically better than C(E),\
    \ and C constant across the\n    crater. Then the normal form is a genuine free improvement, it\
    \ is\n    reachable in polynomial time, and multi-target preprocessing on the\n    crater amortizes\
    \ over the whole class (lane L13).\n  (O2) C varies as much ACROSS the crater as it does between\
    \ levels. Then\n    the crater is not special, the normal form buys nothing, and the\n    variance\
    \ belongs to lane L1 rather than to depth at all.\n  (O3) C constant everywhere. Then the whole\
    \ functional is an isogeny-class\n    invariant and lane L1's predicted negative is confirmed\
    \ for it, with the\n    ascent algorithm surviving as a certified transport tool.\nO2 is the predicted\
    \ outcome and it is the one that would REDIRECT the campaign from depth to horizontal position,\
    \ which is a substantive change of target rather than a null."
  resource_label: R4 (isogeny graph / class-group action), with R3 (End(E) as a ring) consumed only
    through the conductor valuations
  admissibility: admissible
  admissibility_argument: 'The algorithm operates on CURVES, not on points of G: the isogeny graph
    and the ascending-edge identification are pure R4, and the conductor valuations are read from
    the integer t^2 - 4p (R3 through arithmetic, never through an action on G). The instance is transported
    by T1, and the transport is an ISOMORPHISM on G, so nothing about the transport itself yields
    any advantage -- IDEA-20260807-5cabfc says exactly that. Admissibility therefore rests entirely
    on the functional C measured at the endpoint: if C factors through the abstract triple, the whole
    exercise is provably a no-op and this proposal would be inadmissible_generic_group. It is admitted
    only for C in R1/R2 (Semaev/Groebner meters, factor-base yield, curve-equation shape). That restriction
    is binding and appears in the required_metrics.'
  reachability_gate: 'THIS PROPOSAL IS THE REACHABILITY GATE, ANSWERED IN BOTH DIRECTIONS. POSITIVE:
    any B-rough-conductor vertex is reachable from any starting curve in O(B^2 log^2 p) field operations
    with no factorization, with a re-verifiable certificate, and the DL instance rides along unchanged.
    So "goodness that is a property of the LEVEL" is cheaply reachable and lane L2 can never be dismissed
    on reachability grounds. NEGATIVE: any goodness that is a property of the HORIZONTAL POSITION
    on the crater is NOT reachable, because the crater is a Cl(O)-torsor of size ~ sqrt(|D|) and selecting
    a specified element is vectorization at ~ p^{1/4} classically. So a lane that needs a specific
    j is dead on cost even if the variance is large -- the exact dichotomy DECOMPOSITION T5 states,
    here instantiated with the constants filled in.'
  inputs:
    procedure: 'STAGE 0 (zero compute): read KN-LIT-1210 and KN-LIT-360; write KN-LIT records. A published
      ascent-cost result changes the cost claim''s novelty, not its truth. STAGE 1 (days of implementation,
      hours of compute): implement Velu for ell in {2, 3} plus kernel-polynomial root finding, on
      top of harness/toycurve.py. Validate: every codomain has trace t; every ell-step composed with
      its dual is multiplication by ell on a test point. STAGE 2 (hours): implement ascending-edge
      identification; verify on a hand-built volcano of height >= 2 that each claimed ascent strictly
      reduces v_ell(f_E), measured independently by rational-isogeny counting. STAGE 3 (hours): run
      the full ascent over >= 50 classes; record cost curves. STAGE 4 (hours to days): the C-measurement
      at E, E*, E** with N1, N2, N3. STAGE 5 (zero compute): O1/O2/O3 verdict plus the crater-torsor
      statement.'
    mechanism: 'STEP 1 -- ASCENDING-EDGE IDENTIFICATION, MADE CONCRETE. At a vertex with ell+1 rational
      ell-neighbours and level i with 0 < i <= h, exactly one neighbour is ascending; the rest are
      descending (or, at i = 0, horizontal). Fouquet-Morain: from each neighbour take a descending
      walk of length h; a descending walk from a descending neighbour dead-ends after h - i - 1 further
      steps (the floor has out-degree 1, back up), while the walk through the ascending neighbour
      does not dead-end within h steps. Cost O(ell * h) per identification. At the floor (exactly
      one rational ell-neighbour) the ascent is immediate with no search. STEP 2 -- VELU AND TRANSPORT.
      For ell in {2, 3} the kernel polynomial is a root of x^3 + a x + b (ell = 2) or of psi_3 = 3x^4
      + 6 a x^2 + 12 b x - a^2 (ell = 3), so kernel construction needs only root-finding, not modular
      polynomials -- which matters because no modular polynomial is available in this harness. Velu
      gives (a'', b'') and the image of any point. Transport P and Q through every step. STEP 3 --
      CERTIFICATE. Emit the path as a list ((a_0,b_0), ..., (a_L,b_L)) with, per step, the kernel
      polynomial, the claimed direction (ascend/descend/horizontal), the codomain''s trace, and the
      images of P and Q. An independent verifier recomputes each Velu step, checks each trace equals
      t, checks each transported point lies on the codomain, and checks order(P_L) = N. This is the
      docs/claims-and-verification.md certificate discipline applied to an isogeny path. STEP 4 --
      THE CRATER-HOMOGENEITY MEASUREMENT. At E*, take a horizontal random walk of L steps (using the
      horizontal ell-neighbours at the crater, which exist when (D_K/ell) = 1) to reach an independent
      crater vertex E**. Measure C at E, E*, and E** with all controls. The comparison C(E*) versus
      C(E**) is the crater-homogeneity test and it is what distinguishes O1 from O2.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - horizontal walk of equal length at the crater (N1, blocking)
  - height-zero class where the ascent is the identity (N2)
  - descending walk of equal length (N3)
  - dual-isogeny check: phi-hat composed with phi equals [ell] on test points
  - trace check on every codomain
  - matched rho and BSGS on E and on E*, which must agree by IDEA-20260807-5cabfc and therefore serve
    as an instrument check
  - "NULL OBJECT (from the proposal): (N1) THE HORIZONTAL-WALK NULL, which is the matched object of\
    \ the same shape\n  and the one that makes this proposal falsifiable: a walk of the SAME LENGTH\n\
    \  L at the crater, using only horizontal edges, so End(E) never changes. Any\n  functional difference\
    \ attributable to \"ascending\" must EXCEED the\n  difference produced by a horizontal walk of\
    \ equal length. If it does not,\n  the measurement is reading \"we moved L isogeny steps\", not\
    \ \"we changed the\n  endomorphism ring\". This is the blocking control.\n(N2) THE HEIGHT-ZERO\
    \ NULL: a class with v_ell(c) = 0 for every ell <= B, so\n  the ascent is the identity. Any measured\
    \ \"ascent effect\" there is pure\n  artifact.\n(N3) THE DESCENDING NULL: the same length walk\
    \ DOWNWARD. If ascending and\n  descending produce the same functional change, the direction carries\
    \ no\n  information and only the distance does.\nDECAY PARAMETER: the walk length L, and separately\
    \ the total volcano height H = sum_{ell <= B} h_ell. A genuine normal-form effect must SATURATE\
    \ once every coordinate reaches zero -- extra steps beyond the crater must add nothing, because\
    \ there is nowhere further to ascend. A measured effect that keeps growing with L past the crater\
    \ is the canonical artifact tell."
  independent_variables: []
  metrics:
    primary:
    - Velu step count, wall time, and per-step direction label
    - v_ell(f_E) at every vertex, measured by isogeny counting not by assumption
    - C (Semaev meter vector) at E, E*, and >= 8 crater vertices
    - crater spread versus level spread
    secondary:
    - certificate size and verification time
    - matched rho and BSGS counts
    - pass/fail of every control
    - EXPLICIT LABEL on every measured C stating its resource class (R1/R2), so that a triple-factoring
      functional cannot be reported as a result
  heuristic_under_test: null
  preregistered_prediction:
    quantity: number of Velu steps and wall time to reach the B-rough normal form, as a function of
      log p and B, over >= 50 toy classes
    formula: Measured step count within a factor 3 of sum_{ell <= B} O(ell * h_ell^2), with no dependence
      on the factorization of D beyond the primes <= B. A measured cost that grows with the LARGEST
      prime factor of c would falsify the "no factoring required" claim.
    source: pre-registered in IDEA-20260807-bb03d3 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - WALK LENGTH IS THE OBVIOUS CONFOUND. Ascending L steps and walking horizontally L steps both change
    j completely. Only N1 separates them, and without N1 any reported ascent effect is uninterpretable.
  - Classes with (D_K/ell) = -1 have NO horizontal edges at the ell-crater, so N1 is unavailable for
    that ell. Class selection must ensure at least one ell with (D_K/ell) = 1, and classes where it
    fails are reported separately.
  - At toy p the crater may have h(O) as small as 1, in which case the crater is a single vertex,
    the torsor obstruction is invisible, and O1 and O2 cannot be distinguished. Classes must be selected
    for h(O) >= 8 before the homogeneity test.
  - Velu at ell = 2 has well-known degenerate cases (2-torsion points with y = 0 are their own negatives).
    Explicit handling required and tested.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Measured step count within a factor 3 of sum_{ell <= B} O(ell * h_ell^2), with
    no dependence on the factorization of D beyond the primes <= B. A measured cost that grows with
    the LARGEST prime factor of c would falsify the "no factoring required" claim.
  falsification_criterion:
  - A claimed ascent step that does not strictly decrease v_ell(f_E), verified independently. The
    edge identification is wrong and every level label downstream is void.
  - Measured total cost depending on the large prime factors of c. The "no factoring required" claim
    is false as stated.
  - Outcome O2 (crater spread >= level spread). The normal form buys nothing and the campaign's target
    moves from depth to horizontal position. This is the predicted outcome and it is a redirection,
    not a null.
  - Matched rho counts differing between E and E*. Either IDEA-20260807-5cabfc's theorem is false
    or the transport implementation is broken; the second must be excluded before the first is entertained.
  - Any transported instance whose k differs from the original. Implementation failure; halts the
    line.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-bb03d3
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
