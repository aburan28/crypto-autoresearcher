# =============================================================================
# EXP-SSI-0d35ba — version 1, not approved. Specified from
# IDEA-20261006-fec972 / H-SSI-8a6f00. Status is review_required.
# check_approval_capacity would accept an approving decision:
# GOAL-SSI-001 holds 2 approved contracts with no run, under cap 3,
# so headroom is 1. The two contracts are EXP-SSI-001 and
# EXP-SSI-db46fa. Each has only runs/.gitkeep on origin/main.
# The contract is still not runnable. The missing driver is a program
# that lists the F_{p^2}-isomorphism classes of supersingular elliptic
# curves at p = 23, writes each in short Weierstrass form over
# F_{p^2}, counts F_{p^2}-roots of x^3 + Ax + B, checks that
# y^2 = x^3 - x over F_23 returns the roots 0, 1, and -1, and records
# the complete-split frequency of 100 random monic cubics over
# F_{p^2}. A search of origin/main for the phrases "2-division cubic"
# and "three rational points of order 2" under *.py returned no path.
# experiments/EXP-SSIQ-4de240/implementation/fit_delta_counting.py
# counts supersingular j-invariants in F_p. It does not score
# F_{p^2}-isomorphism classes by roots of the 2-division cubic.
# There is no trial-plan.json. Success is the source idea's
# prediction: the fraction equals 1. The concrete negative is a
# fraction at most 1 - 1/C. This session did not score a class.
# Source idea bytes are blob
# b7dba488e03248752b0e5f569fbc860fdee78614.
# =============================================================================
experiment:
  id: EXP-SSI-0d35ba
  hypothesis_id: H-SSI-8a6f00
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  source_idea: IDEA-20261006-fec972
  version: 1
  title: >-
    Rational 2-torsion census of supersingular classes at p = 23
  status: review_required
  approved_by: null
  designed_at: '2026-10-07'
  frozen: false
  execution_authorized: false
  packaging_only: false
  approval:
    approved_by: null
    composing_decision: DEC-20261007-a6ebb0
    withheld_reason: >-
      The launcher is missing, so the contract is not runnable.
      check_approval_capacity would not reject an approving
      decision: GOAL-SSI-001 has approved_unrun 2 against cap 3
      (EXP-SSI-001 and EXP-SSI-db46fa), headroom 1. That headroom
      is not used. There is no committed program that enumerates
      supersingular F_{p^2}-isomorphism classes at p = 23, counts
      roots of x^3 + Ax + B in F_{p^2}, runs the instrument on
      y^2 = x^3 - x over F_23, and samples 100 random monic cubics.
      A search of origin/main for "2-division cubic" and "three
      rational points of order 2" under *.py returned no path.
      experiments/EXP-SSIQ-4de240/implementation/fit_delta_counting.py
      counts supersingular j-invariants in F_p and does not perform
      this census. A trial plan requires a driver. This session did
      not score a class.
    implementation_authorized: false
    scientific_execution_authorized: false
    scientific_execution_scope: >-
      When a later approval adds the missing census driver, work
      only at p = 23 for the claim, plus the instrument curve
      y^2 = x^3 - x over F_23 and 100 random monic cubics over
      F_{p^2}. Do not transfer the fraction to another prime or to
      cryptographic size.
    frozen: false
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
      applied: false

  objective: >-
    Decide whether the fraction of supersingular
    F_{p^2}-isomorphism classes at p = 23 with three rational
    points of order 2 equals 1. The concrete negative is that the
    fraction is at most 1 - 1/C. No faster isogeny algorithm is in
    scope.

  inputs:
    prime: 23
    classes: >-
      F_{p^2}-isomorphism classes of supersingular elliptic curves
      at p = 23. Quadratic twists that are not isomorphic over
      F_{p^2} are distinct classes.
    model: >-
      Each class is written in short Weierstrass form
      y^2 = x^3 + Ax + B over F_{p^2}. The scored polynomial is
      x^3 + Ax + B.
    instrument_curve: >-
      y^2 = x^3 - x over F_23. The instrument passes when the root
      counter returns exactly the three roots 0, 1, and -1. A
      failure makes the supersingular fraction not admissible.
    random_cubics: >-
      One hundred random monic cubics over F_{p^2}. Their
      complete-split frequency is recorded beside 1/6. A frequency
      outside [0, 1/3] voids the factorizer. It is not the
      concrete negative.
    nearby_ordinary: >-
      For each supersingular class, an ordinary curve over
      F_{p^2} is not required to exist. If one with the same point
      count is found, its splitting type is reported and is not
      folded into the supersingular fraction.

  controls:
    - id: instrument-roots
      statement: >-
        y^2 = x^3 - x over F_23 returns exactly the roots 0, 1,
        and -1. Any other return voids the run.
    - id: random-cubics
      statement: >-
        One hundred random monic cubics have a complete-split
        frequency recorded beside 1/6. A frequency outside
        [0, 1/3] voids the factorizer.
    - id: class-not-j
      statement: >-
        The denominator is the number of F_{p^2}-isomorphism
        classes, not the number of j-invariants. Merging twists
        voids the run.
    - id: singular-excluded
      statement: >-
        A singular model, or a cubic with a repeated root, is
        excluded and listed. It is not scored as 0, 1, or 3.
    - id: ordinary-not-folded
      statement: >-
        An ordinary curve with the same point count, if found, is
        reported separately and is not added to the supersingular
        numerator or denominator.

  independent_variables:
    - whether the arm is the supersingular census, the instrument, the random cubics, or an ordinary neighbor
    - the isomorphism class, identified by j-invariant and twist parameter

  metrics:
    primary:
      - id: split_fraction
        statement: >-
          The number of supersingular F_{p^2}-isomorphism classes
          at p = 23 with three rational points of order 2, divided
          by the number of such classes. The idea's prediction is
          that this fraction equals 1. The concrete negative is
          that the fraction is at most 1 - 1/C.
    secondary:
      - id: class_count
        statement: the number C of supersingular F_{p^2}-isomorphism classes
      - id: split_count
        statement: the number of those classes with three rational points of order 2
      - id: random_split_frequency
        statement: the complete-split frequency of the 100 random monic cubics
      - id: instrument_pass
        statement: pass or fail of the y^2 = x^3 - x root check
      - id: excluded_models
        statement: the count of singular models and cubics with a repeated root

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says the supersingular distribution at p = 23 puts every
    class in the complete-split type, against density 1/6. An
    instrument failure voids the fraction and does not by itself
    replace the comparison with 1.

  preregistered_prediction:
    quantity: >-
      The fraction of supersingular F_{p^2}-isomorphism classes at
      p = 23 with three rational points of order 2.
    formula: >-
      split_fraction = 1. The concrete negative is
      split_fraction <= 1 - 1/C after the instrument passes and
      the random-cubic frequency lies in [0, 1/3]. Source idea
      IDEA-20261006-fec972, predictions minimum_effect: the
      fraction equals 1. No class was scored before this formula
      was written.
    source: >-
      IDEA-20261006-fec972. RQ-SSI-001 asks for toy-scale
      mechanisms about auxiliary torsion and states that toy-only
      effects are hypothesis-generating only. KR-RHO-755e35 was
      opened in this session. It equates point counts across an
      isogeny class and does not state this fraction.

  scale_relevance:
    tier: toy
    justification: >-
      The prime is 23. No transfer to another prime or to
      cryptographic size is assumed. The minimum effect is the
      idea's own: fraction 1 against a fraction at most 1 - 1/C.
    correspondence: >-
      Direct enumeration of classes. No Deuring sampling shortcut
      is used.

  tail_checks:
    - >-
      Fraction 1 meets the prediction. A fraction at most 1 - 1/C,
      with the instrument passed, is the negative.
    - >-
      The factorizer check at this scale is the complete-split
      frequency of 100 random monic cubics. A frequency outside
      [0, 1/3] voids the factorizer.

  replication:
    seeds:
      - EXP-SSI-0d35ba|instrument|y2=x3-x
      - EXP-SSI-0d35ba|random-cubics|100
      - EXP-SSI-0d35ba|supersingular-census|p23
    independent_instances: 1
    note: >-
      One later manifest would cover the instrument, the 100
      cubics, and the class census. No run id is minted in this
      session. The replication plan does not name a future run
      slot, because the trial plan is not frozen while status is
      review_required.

  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One later manifest would cover the frozen census. Wall-clock
      and CPU figures are not set. The 1 GB figure is machine
      protection for a prime of 23. A watchdog expiry is
      failed_infrastructure, not a splitting type.

  stopping_rules:
    - Stop after one reading row is named from the pinned census.
    - Do not change the thresholds 1 and 1/3 after seeing a fraction.
    - Do not enumerate a second claim prime in this contract.
    - A timeout or crash voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - An instrument failure, a random-cubic frequency outside [0, 1/3], a merged twist, or a singular model scored as a class voids the run.
    - An ordinary neighbor that also splits completely is reported and is not the concrete negative.
    - Transferring the fraction to another prime or to cryptographic size voids the run.

  success_criterion: >-
    The instrument on y^2 = x^3 - x returns the roots 0, 1, and -1,
    the complete-split frequency of the 100 random monic cubics
    lies in [0, 1/3], and the fraction of supersingular
    F_{p^2}-isomorphism classes at p = 23 with three rational
    points of order 2 equals 1. That equality is the prediction of
    IDEA-20261006-fec972. The conjunction is reachable as a failure
    when the instrument checks pass and the fraction is at most
    1 - 1/C.

  falsification_criterion: >-
    The instrument on y^2 = x^3 - x returns the roots 0, 1, and -1,
    the random-cubic frequency lies in [0, 1/3], and at least one
    supersingular F_{p^2}-isomorphism class at p = 23 has fewer
    than three points of order 2 rational over F_{p^2}, so the
    fraction is at most 1 - 1/C. That is the concrete negative. An
    instrument failure or a voided factorizer is not this sentence.

  decision_impact:
    on_positive: >-
      A later evidence review may record that the fraction equals 1
      at p = 23, with the instrument passed and the random-cubic
      frequency inside [0, 1/3]. The supersingular isogeny exponents
      stay where RQ-SSI-001 left them. No knowledge entry is
      promoted from this design record.
    on_negative: >-
      A later evidence review may record that the fraction is at
      most 1 - 1/C at p = 23, with the instrument passed, so the
      universal claim is false at this prime only. The supersingular
      isogeny exponents stay where RQ-SSI-001 left them. The two
      outcomes name different comparisons with 1.

  required_artifacts:
    - experiments/EXP-SSI-0d35ba/runs/RUN-*/manifest.yaml
    - experiments/EXP-SSI-0d35ba/runs/RUN-*/raw-result.json
    - experiments/EXP-SSI-0d35ba/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        the root counter on y^2 = x^3 - x does not return 0, 1, and
        -1, the random-cubic frequency lies outside [0, 1/3], twists
        are merged, or a singular model is scored as a class
    - id: infrastructure
      when: the process aborts for memory or the process times out
    - id: fraction_at_most_one_minus_one_over_C
      when: >-
        the instrument and the random-cubic gate pass, and the
        supersingular fraction is at most 1 - 1/C
    - id: fraction_equals_one
      when: >-
        the instrument and the random-cubic gate pass, and the
        supersingular fraction equals 1
  reading_rule: >-
    Name exactly one row. fraction_equals_one is the only success
    row. fraction_at_most_one_minus_one_over_C is the concrete
    negative. instrument_failure and infrastructure are not the
    comparison with 1. Record C, the split count, the random
    frequency, and the instrument result beside the row.
    attack_claimed is false.
