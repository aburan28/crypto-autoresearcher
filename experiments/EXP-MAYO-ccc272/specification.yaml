experiment:
  id: EXP-MAYO-ccc272
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-MAYO-2c6c34
  question_id: RQ-MAYO-001
  goal_id: GOAL-MAYO-001
  title: >-
    Emulsifier defect census for the whipped MAYO map: exhaustive
    slice-space search for a common left kernel at toy parameters,
    against a matched random-matrix null, a planted positive control,
    and a graded plant sweep -- with the dilation identities as a
    zero-compute gate that can end the run first

  objective: >-
    IF this contract is later approved, frozen and separately authorized, decide
    two things at toy scale and by derivation. (A) Whether the five dilation
    identities of H-MAYO-2c6c34 Part A hold at the specification's parameters --
    pure integer arithmetic, no compute, and it can terminate the line. (B)
    Whether any nonzero scalar slice C in F_q^{k x r}, r in {1, 2}, of the
    whipped map admits a common left kernel across its induced emulsifier
    combinations, i.e. whether the emulsifier defect delta(C) is ever nonzero.
    Both outcomes are deliverables: delta_max = 0 is a named obstruction with a
    field-algebra argument and a stated scope; delta_max >= 1 is a
    whipping-induced equation loss that must then be costed, not announced.

  what_this_is_not:
    - Not an attack on MAYO, not a key recovery, not a forgery, and not an attempt at either.
    - Not a claim about any MAYO parameter set's security, published or otherwise.
    - Not a cost, runtime, bit-strength, exponent, or cryptographic-scale claim.
    - >-
      Not a statement about implementations, faults, side channels, or randomness
      discipline. Those belong to H-MAYO-c0ddab / EXP-MAYO-3d55ca and are filed
      separately per GOAL-MAYO-001's next_action; a result here may never be
      scored against that lane or vice versa.
    - Not a verification of any external claim; KN-LIT-1818's relayed 8-bit figure is neither tested nor used.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling: >-
    TOY for every measured number. A future run would be limited to q = 16,
    m in {4, 6, 8}, k in {3, 4}, n in {6, 8, 10}, o in {2, 3}, slice dimensions
    r in {1, 2}, four emulsifier arms, and the declared seeds. The DERIVATIONS
    (the factorization identity, the five dilation identities, and the
    field-algebra forcing of delta = 0 at r = 1) are size-independent and are
    tiered as derivation, not measurement -- and even they are conditional on
    the Round-3 specification matching the recalled premises. A single run
    cannot support any statement about MAYO's deployed parameters, and
    AGENTS.md rule 7 applies without exception.

  stage_order_and_termination:
    stage_0_reading:
      cost: "no compute; wall clock only"
      purpose: >-
        Obtain the MAYO Round-3 specification and quote verbatim: the whipped
        map definition, the emulsifier construction, and the parameter table
        (q, n, m, o, k) per set. Source-preference order, tried in this order
        and each outcome logged: (1) the NIST submission package; (2) the MAYO
        team's own site; (3) ePrint abstract pages (the session literature sweep
        measured ePrint abstracts at HTTP 200 and ePrint PDF bodies at 403, so
        partial success is expected); (4) the reference implementation's
        parameter header in a public source mirror. If none succeeds, record the
        failure as INFRASTRUCTURE SIGNAL, proceed to Stage 1 on the RECALLED
        premises with every downstream number labelled premise-conditional, and
        report the goal's pause condition on source availability as ACTIVE.
      can_terminate: >-
        Yes. If the whipped map is not of the assumed form, Stages 2-3 are void
        as designed and the run stops with a redesign note.
    stage_1_algebra:
      cost: "no compute; wall clock only"
      purpose: >-
        Re-derive the factorization identity and the five dilation identities
        against whatever Stage 0 obtained; evaluate G1, G2, G3 as exact
        integers.
      can_terminate: >-
        Yes, and this is the CHEAPEST DECISIVE GATE IN THE CONTRACT. If G3 fails
        (some parameter set has 2o >= n) the campaign's direction changes and
        the remaining stages are not the right next work. If the field-algebra
        argument forces delta = 0 at r = 1 AND extends to r = 2, Stage 2 becomes
        confirmation rather than discovery and its budget may be reduced by the
        Coordinator.
    stage_2_toy_defect_census:
      cost: "seconds to minutes"
      purpose: exhaustive slice-space search for delta(C) across four arms
      can_terminate: "Yes, on any control failure (see invalidation_rules)."
    stage_3_scaled_sample:
      cost: "minutes; OPTIONAL and outside the success criterion"
      purpose: >-
        Uniform random sampling of C at the specification's own (q, m, k) with a
        declared budget, reporting the exact fraction of the slice space
        touched. NO CLAIM OF EXHAUSTIVENESS IS PERMITTED AT THIS STAGE.

  inputs:
    field: "GF(16), characteristic 2, represented as F_2[z]/(z^4 + z + 1)"
    field_representation_note: >-
      The reduction polynomial z^4 + z + 1 is declared here so a third party
      reproduces the arithmetic bit-for-bit. It is chosen for reproducibility,
      not read from any specification, and the run must record a self-test:
      the multiplicative order of the element z must be 15, and the log/exp
      tables must satisfy exp[log[a]] = a for all a in 1..15.
    m_values: [4, 6, 8]
    k_values: [3, 4]
    n_values: [6, 8, 10]
    o_values: [2, 3]
    r_values: [1, 2]
    design_constraint: "only cells with k*o >= m are built, mirroring MAYO's own signing inequality"
    arms: [spec_shaped_field, random_matrix_null, planted_defect_positive, graded_plant_sweep]
    graded_plant_j_values: [0, 1, 2, 3, 4, 5, 6]
    planted_instances_per_cell: 20
    master_seed: 20260805
    domain: "EXP-MAYO-ccc272/v1"
    seed_derivation_rule: >-
      All randomness derives from SHA-256 over the ASCII byte string
      domain || "|" || label || "|" || decimal(m) || "|" || decimal(k) ||
      "|" || decimal(n) || "|" || decimal(o) || "|" || decimal(counter),
      with digests read big-endian unsigned. Field elements are produced by
      rejection-free reduction of successive 4-bit nibbles of the digest stream
      modulo nothing (a nibble IS a GF(16) element under the declared
      representation), consuming nibbles in most-significant-first order and
      advancing the counter when a digest is exhausted. Labels used:
      "P-coeffs", "oil-basis", "emul-field", "emul-random", "emul-plant",
      "slice-sample", "identity-check".
    deterministic_construction:
      underlying_map_P: >-
        Draw a uniformly random o-dimensional subspace O of F_q^n from the
        "oil-basis" stream by drawing o vectors and rejecting until they are
        independent (rejection count recorded). Draw m symmetric-with-zero-
        diagonal (alternating) bilinear forms from "P-coeffs", then subtract the
        unique correction that makes each form vanish on O x O, by solving the
        linear conditions -- so P is a genuine UOV-shaped map with planted oil
        space O, constructed rather than searched for. Record the construction's
        rank statistics; a cell in which the correction is not solvable is a
        CONSTRUCTION_FAILURE and is reported, never silently reseeded.
      emulsifier_spec_shaped: >-
        Build A as the companion matrix of an irreducible degree-m polynomial
        over F_q, found by scanning monic polynomials in a declared order and
        testing irreducibility by trial division over F_q[z]; record the
        polynomial found. Set E_ij = A^{e(i,j)} for a declared injective index
        map e taking the k(k+1)/2 pairs to distinct exponents in 0..m-1. IF
        k(k+1)/2 > m FOR A CELL, THAT CELL CANNOT USE DISTINCT POWERS AND IS
        RECORDED AS OUT OF THE SPEC-SHAPED ARM RATHER THAN FUDGED -- an
        important honesty point, because it is exactly the configuration in
        which the recalled design assumption may fail at real parameters.
      emulsifier_random_null: >-
        Each E_ij drawn uniformly from F_q^{m x m} via "emul-random". Same m, k,
        same slice space, same search code, same enumeration order.
      emulsifier_planted_defect: >-
        Draw a nonzero u in F_q^m, then draw each E_ij uniformly and replace it
        by E_ij - (u u^T E_ij)/(u^T u) if u^T u is nonzero, else by an explicit
        projection that annihilates u on the left; the run must ASSERT
        u^T E_ij = 0 for every i <= j before proceeding. 20 independent plants.
      emulsifier_graded_plant: >-
        As the planted arm, but with the left-annihilation applied to only the
        first j matrices in a declared enumeration order (diagonal matrices
        first, then off-diagonal), the remaining ones taken from the spec-shaped
        arm. j sweeps the declared list.
    slice_enumeration: >-
      r = 1: enumerate all C in F_q^k up to scalar multiplication, i.e.
      (q^k - 1)/(q - 1) representatives = 273 at k = 3 and 4369 at k = 4, in a
      declared canonical order (first nonzero coordinate equal to 1, lexicographic
      thereafter). r = 2: enumerate all C in F_q^{k x 2} of rank 2 up to the
      right action of GL_2(F_q), by canonical column-reduced form, in a declared
      order; if the count exceeds the declared cap of 200000 per cell, switch to
      uniform sampling from "slice-sample" and RECORD THE COVERAGE FRACTION as a
      primary metric rather than reporting the search as exhaustive.

  measured_quantity:
    delta_definition: >-
      For a slice C, form the stacked matrix S(C) whose row blocks are
      D_a(C) = sum_i c_{ia}^2 E_ii for a = 1..r and
      F_ab(C) = sum_i c_{ia} c_{ib} E_ii + sum_{i<j} (c_{ia} c_{jb} +
      c_{ib} c_{ja}) E_ij for a < b. delta(C) = m - rank_{F_q}(S(C)^T), i.e. the
      dimension of the common LEFT kernel {u : u^T M = 0 for every block M}.
      Rank is exact over F_q by Gaussian elimination with a declared pivoting
      order; no floating point appears anywhere in the contract.
    reported_statistics: >-
      Per (cell, arm): delta_max, the FULL histogram of delta over the enumerated
      or sampled slice space, the number of slices enumerated, the slice-space
      size, the coverage fraction, and the argmax slice in canonical form.

  arms_and_controls:
    treatment: >-
      spec_shaped_field emulsifier, all declared cells, r in {1, 2}.
    measured_null: >-
      random_matrix_null emulsifier, identical cells, identical slice
      enumeration, identical rank code. FORCED EXPECTATION DERIVED BEFORE THE
      RUN: a uniform m x m matrix over F_q is singular with probability
      1 - prod_{i=1..m}(1 - q^{-i}), about 0.0625 at q = 16 -- RECOMPUTED IN THE
      RUN, not taken from this contract -- so across 273 or more slices
      delta_max >= 1 is expected with probability essentially 1. This null CAN
      FAIL and its failure invalidates the treatment arm.
    positive_control: >-
      planted_defect_positive emulsifier. delta(C) >= 1 MUST be recovered at
      EVERY nonzero C, in 20/20 plants. If not, the search or the rank code is
      broken and NO NEGATIVE RESULT MAY BE REPORTED FROM ANY ARM.
    graded_control: >-
      graded_plant_sweep over j, with the derived sub-prediction that at r = 1
      a plant touching only OFF-DIAGONAL matrices leaves delta_max = 0, because
      r = 1 excites only the k diagonal emulsifiers; the effect must turn on at
      r = 2 in that configuration and not before. Monotonicity in j is reported
      explicitly.
    identity_control: >-
      For >= 1000 random (C, y) draws per cell from "identity-check", evaluate
      P*(C y) directly from the whipped map definition and again from the
      factorization, and require exact equality. THIS RUNS FIRST IN STAGE 2. A
      single mismatch halts the package: the mechanism is wrong and no
      downstream number means anything.
    baseline_embedding_control: >-
      For >= 1000 random y per cell, check P*(e_i (x) y) equals E_ii P(y)
      exactly, for every i. The slice family must contain the underlying map.
    ordering_control: >-
      Generate, evaluate and HASH-COMMIT the null arm, the planted positive arm
      and the identity/baseline controls, together with the decision rule's
      output on them, BEFORE the spec-shaped treatment arm is computed or
      inspected. Absence of that commitment is invalid_measurement. If the
      decision rule emits the same label on the null and the planted arm it
      discriminates nothing and must be rewritten before the treatment arm is
      read.
    comparability_policy: >-
      Cross-arm comparison is permitted only within a cell, i.e. at identical
      (q, m, k, n, o, r) and identical slice enumeration. Comparison to any
      other experiment, to real MAYO parameters, or to any external result is
      FORBIDDEN in this contract and requires a separately registered comparator
      naming both domains, statistics, and expected relation.

  metrics:
    primary:
      - delta_max per (cell, arm, r), as an exact integer.
      - Pass/fail of the identity control and the baseline-embedding control, with draw counts.
      - The five dilation identity values (G1, G2, G3) at the specification's parameters, as exact integers.
    secondary:
      - Full delta histograms per (cell, arm, r) and the argmax slice.
      - Slice-space size, number enumerated, and coverage fraction per cell.
      - Recomputed singularity probability 1 - prod(1 - q^{-i}) and the observed singular-combination rate in the null arm.
      - The graded j-sweep table with monotonicity stated, and the r = 1 off-diagonal sub-prediction outcome.
      - For any defect found: slice_advantage_ratio under >= 2 named MQ cost conventions, each with a memory column or an explicit "source states none".
      - The irreducible polynomial found, the field self-test results, and construction rejection counts.

  preregistered_prediction:
    quantity: >-
      delta_max for the spec-shaped arm at every cell and both r values; and the
      three dilation ratios at the specification's parameters.
    formula: >-
      delta_max(spec_shaped) = 0, forced by: every nonzero F_q-combination of a
      field-based emulsifier family is invertible (regular representation of a
      unit), so delta(C) is 0 or m; delta(C) = m requires all r(r+1)/2
      combinations to vanish; at r = 1 that is sum_i c_{i1}^2 eps_ii = 0 in
      F_{q^m}, which for F_q-linearly independent eps_ii forces every c_{i1} = 0
      by Frobenius bijectivity of squaring in characteristic 2, hence C = 0.
      Dilation ratios: (n*/o*)/(n/o) = 1; d*_2/d_2 = (n*-2o*)/(n-2o) =
      alpha*/alpha = k.
    source: >-
      DERIVED IN H-MAYO-2c6c34's mechanism and in IDEA-20260805-74e78c /
      IDEA-20260805-258212. No external theorem is cited and none is needed; the
      only external inputs are the RECALLED, UNVERIFIED premises about MAYO's
      construction, which Stage 0 exists to replace.

  scale_relevance:
    tier: toy
    justification: >-
      The measured census is toy and transfers to real parameters ONLY through
      the field-algebra argument, which is size-independent at r = 1 and is NOT
      established at r >= 2. The honest statement is therefore split: the r = 1
      conclusion is carried by a derivation valid at any m; the r = 2 conclusion
      is carried by enumeration at toy m only and does not transfer. Exhaustive
      enumeration at real parameters is out of reach -- (q^k - 1)/(q - 1) is
      about 4.6e9 at q = 16, k = 9 -- and Stage 3 therefore reports a coverage
      fraction and makes no exhaustiveness claim.
    correspondence: null

  replication:
    seeds: [20260805, 20260806, 20260807]
    independent_instances: 20
    interpretation: >-
      Three master seeds per cell for the randomised arms; the spec-shaped arm is
      deterministic given the irreducible polynomial and index map, so its
      replication is a reproducibility check rather than a sampling one, and the
      contract says so rather than reporting three identical numbers as three
      observations.

  budget:
    maximum_runs: 3
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3
    maximum_memory_gb: 2
    maximum_workers: 1
    no_network_after_stage_0: true
    network_note: >-
      Stage 0 requires network access for source retrieval. Stages 1-3 require
      none and must run with networking off so that no number can depend on an
      unrecorded fetch.

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived, and authorized.
    - Stop at Stage 1 if the dilation identity G3 fails at any parameter set; report and re-rank.
    - Stop immediately on any identity-control or baseline-embedding-control mismatch.
    - Stop before the treatment arm if the null and positive-control commitment is absent.
    - Stop at the declared enumeration cap and switch to sampling with a recorded coverage fraction; never silently truncate.
    - Stop on any budget breach and report it as a budget outcome, not a result.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - A treatment-arm number computed or inspected before the null and positive-control commitment.
    - Any use of floating point in a rank, kernel, or field computation.
    - Any cell reported as exhaustive whose enumeration was capped or sampled.
    - Any construction failure silently reseeded rather than reported.
    - Any comparison to real MAYO parameters presented as a measurement rather than as the derivation it is.

  infrastructure_failure_disposition: >-
    A timeout, crash, memory exhaustion, missing dependency, or failure to
    retrieve the specification is INFRASTRUCTURE SIGNAL and is NEVER negative
    mathematical evidence (AGENTS.md rule 5). Specifically: failure to obtain
    the Round-3 specification does not license any conclusion about the whipped
    map, and it activates GOAL-MAYO-001's declared pause condition on source
    availability, which is an operational state and not a finding. The container
    was checked on 2026-08-05 and has numpy 2.4.6 but no sympy, no galois and no
    Sage; the contract therefore requires hand-rolled GF(16) arithmetic and
    treats any request for a computer-algebra system as an infrastructure
    request rather than an experiment.

  success_criterion: >-
    This draft has NO current success outcome because it is not authorized for
    execution. If a later, separately approved and frozen successor is executed,
    its only positive disposition is a complete readout in which: the identity
    control and the baseline-embedding control both pass at 1000/1000; the
    matched null returns delta_max >= 1; the planted positive control returns
    the planted defect in 20/20; the graded sweep is monotone in j and satisfies
    the r = 1 off-diagonal sub-prediction; and delta_max for the spec-shaped arm
    is reported with its full histogram and its coverage fraction at every cell.
    NOTE THAT THE CRITERION IS SATISFIED BY EITHER VALUE OF delta_max -- the
    experiment succeeds by measuring it under working controls, not by
    confirming the prediction. That disposition establishes no attack, no cost,
    no exponent, no crypto-scale and no deployed-scheme claim.

  falsification_criterion: >-
    H-MAYO-2c6c34 Part B is falsified at a tested cell if the spec-shaped arm
    yields delta_max >= 1 there under passing controls. Part A is falsified if
    G1 is not exactly 1, if G2 is not exactly k, or if G3 is non-negative at any
    parameter set. The mechanism as a whole is falsified at zero compute if the
    identity control fails. A control failure (null returning 0, planted control
    not recovered) falsifies nothing mathematical and permits NO negative report
    at all.

  required_artifacts:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - Stage 0 retrieval log: every source tried, its endpoint, its HTTP status or error, and any text obtained, with quotations attributed.
    - Stage 1 derivation note with the five identities evaluated as exact integers per parameter set.
    - The field self-test output, the irreducible polynomial, the index map, and the construction rejection counts.
    - Null-and-positive-control commitment hash, timestamped before the treatment arm.
    - Raw per-slice delta records per (cell, arm, r) in a canonical, sorted-key, one-record-per-line format, with the slice in canonical form.
    - Identity-control and baseline-embedding-control logs with draw counts and seeds.
    - Manifest, environment, exact command, git commit and dirty-tree state, stdout, stderr, and resource measurements.
    - Snapshot archive followed by independent validation and red-team review before any evidence record is written.

  approval_requirements:
    - Independent review confirms the factorization identity, the enumeration scheme, and the control set are correct and reproducible.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
    - Execution is separately authorized after the approved frozen package is delivered.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved and only the Coordinator may approve it (AGENTS.md rule 1).
