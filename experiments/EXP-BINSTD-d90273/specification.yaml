# EXP-BINSTD-d90273
# Stable-set arithmetic. No factor base is built.
# Approved by DEC-20261003-9c4ad4.
experiment:
  id: EXP-BINSTD-d90273
  hypothesis_id: H-BINSTD-662b09
  source_idea: IDEA-20261001-11aa69
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: 131 minus one
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-9c4ad4
  objective: >-
    Check the difference 130, the sum 262, and the gap 64.
  inputs:
    n_a: 131
    n_a_minus: 130
    n_b: 163
    n_b_minus: 162
    stable_count: 4
    sum_a: 262
    sum_b: 326
    sum_gap: 64
    n_gap: 32
    twice_gap: 64
    n_prod: 21353
    list_floor: 10
    control_floor: 3
    floor_excess: 7
    floor_prod: 30
    rederive: 3
    run_ceiling: 8
    list_over_runs: 2
    remainder: 0
    rate: 1
    rate_excess: 1
  controls:
    - >-
      131 minus 1 is 130. 163 minus 1 is 162. Reporting the
      stable count as 3 drops the count 4 and invalidates the
      run.
    - >-
      The dimensions 0, 1, 130, and 131 sum to 262. The
      dimensions 0, 1, 162, and 163 sum to 326. 326 exceeds 262
      by 64. Twice 32 is 64. The product of 131 and 163 is
      21353.
    - >-
      The list floor 10 exceeds the control floor 3 by 7, and
      their product is 30. The re-derive count 3 equals the
      control floor. 10 exceeds 8 by 2. The remainder is 0, and
      the written rate 1 exceeds it by 1. Reporting the remainder
      as 1 drops that excess.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {difference, sum, floors}
    - route in {subtract, add}
  metrics:
    primary:
      - n_a_minus
      - sum_a
      - sum_gap
      - implementations_agree
    secondary:
      - stable_count
      - floor_excess
      - n_prod
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      131 minus 1 is 130. The four stable dimensions at 131 sum
      to 262. 326 exceeds 262 by 64.
    formula: >-
      Subtract 1 from 131 and from 163. Sum each four-element
      stable set. Subtract the sums. Multiply 131 by 163.
      Subtract 3 from 10.
    source: >-
      IDEA-20261001-11aa69 states the integers 131 and 163, the
      rule n minus 1, the stable set 0, 1, n minus 1, and n, the
      floors 10 and 3, the re-derive count 3, the run ceiling 8,
      and the rate 1, read 2026-10-03. No further prime is named.
      The sums were recomputed in this design session. That
      computation is not a run. No factor base was built.
  scale_relevance:
    tier: toy
    justification: Two written integers and one written four-element set. No transfer to a gate.
    correspondence: null
  tail_checks:
    - The sum 262 and the gap 64 are required. A check that stops at the difference 130 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the difference 130 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The difference is not 130.
    - The sum is not 262.
    - The gap is not 64.
    - The stable count is reported as 3, or a factor base is built.
  success_criterion: >-
    Both runs agree that 131 minus 1 is 130, that the four stable
    dimensions at 131 sum to 262, that 326 exceeds 262 by 64, and
    that 10 exceeds 3 by 7.
  falsification_criterion: >-
    The runs agree that 131 minus 1 is computed, and that
    difference is not 130.
  required_artifacts:
    - experiments/EXP-BINSTD-d90273/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-d90273/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-d90273/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-d90273/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-d90273/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-d90273/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any factor-base construction, census rerun, or order computation.
    - Any claim that a difference of 130 proves an empty usable set.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
