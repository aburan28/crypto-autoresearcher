    "methods": {
      "transition_generation": "Enumerate reachable canonical row spaces and declared hidden labels from initial support. Enumerate the finite row law exactly; use reduced rational probabilities, exact modular RREF and rational costs. Record all transitions, including self loops and terminal absorbing state.",
      "expected_cost": "First find reachable nonterminal closed strongly connected classes. A reachable such class with positive probability gives infinite E[C], since every attempted step costs >=1; emit its path and closed-class witness. Otherwise solve (I-Q)v=c over rational numbers with terminal values0. Independently check every Bellman residual exactly zero and nonnegative finite values. Report initial-law expectation.",
      "rank_certificate": "For each rank r<4, gamma_r=min_s Pr(rank rises |s) and c_r=max_s E[cost|s], over all reachable nonterminal states at rank r including hidden labels. If any gamma_r=0, output no finite rank-only upper certificate. Otherwise V(r)=sum_{j=r}^3 c_j/gamma_j; check V(rank(s)) >= E[cost+V(rank(next))|s] at every state. A full-state v certificate may remain finite when the rank-only envelope is unavailable.",
      "marginal_control": "The uniform_nonzero and persistent_nonzero fixtures have exactly identical unconditional row marginals at each fixed deterministic index when regarded as unstopped output processes; verify the finite symbolic identity from their construction. Do not claim their stopped occupation distributions match. The persistent_rate/resampled_rate pair instead matches the initial mixture and per-attempt declared rate distribution, not full row marginals after stopping.",
