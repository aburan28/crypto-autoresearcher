experiment:
  id: EXP-ECDLP-fce71d
  hypothesis_id: H-ECDLP-375be7
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-4d9d62
  version: 1
  title: >-
    Special-j eigenvalue relation audit: can a genuine curve-backed rank-3
    configuration avoid the known CM relation?
  status: approved
  frozen: true
  approved_by: coordinator
  approval_decision_id: DEC-20260808-939e1a
  claim_tier: toy
  objective: >-
    Audit the cheapest unresolved assumption in IDEA-20260807-285ff4. On six
    frozen prime-order ordinary J0/J1728 cells, verify the special-j map on a
    point, recover its modular eigenvalue, and search the fixed coefficient box
    for a relation. Run a same-size synthetic relation-free control and a
    generic-j rank-one boundary control in the same invocation.
  controls:
    - id: CTRL-MAP-SCALAR
      description: >-
        Directly verify phi(P)=[lambda]P and that every relation certificate
        evaluates to zero modulo N.
      expected_outcome: all valid special-j cells pass.
    - id: CTRL-SYNTHETIC-NOREL
      description: >-
        Search [1,2,4] modulo each cell's N in the same coefficient box; this
        positive control must have no relation.
      expected_outcome: no relation in every declared cell.
    - id: CTRL-GENERIC-RANK1
      description: >-
        Include generic-j frozen cells as a boundary with only eigenvalue 1;
        no rank-3 special-j conclusion may be inferred from them.
      expected_outcome: rank-one boundary, no nontrivial extra map tested.
    - id: CTRL-REPEAT-HASH
      description: >-
        The deterministic invocation is rerun only if the first output hash is
        disputed; identical input and code must reproduce raw-result.json.
      expected_outcome: byte-identical result.
  independent_variables:
    - curve_family
    - field_bits
    - relation_source
  metrics:
    primary:
      - verified_map_scalar_rate
      - short_relation_present_rate
      - relation_vector_certificate_hash
    secondary:
      - synthetic_relation_free_control_rate
      - generic_rank_one_boundary_count
      - wall_clock_seconds
  preregistered_prediction:
    quantity: >-
      Presence of a nonzero relation vector in {-1,0,1}^r for the verified
      special-j eigenvalue set.
    formula: >-
      J0: (1,1,1) dot (1,lambda,lambda^2) = 0 mod N. J1728: (1,0,1,0)
      dot (1,i,-1,-i) = 0 mod N.
    source: H-ECDLP-375be7 mechanism and proof_search_map
  scale_relevance:
    tier: toy
    justification: >-
      The audit reads six 16-24 bit frozen toy cells. It certifies only the
      exact special-j map scope and cannot support a crypto-scale claim.
    correspondence: null
  replication:
    seeds: [1, 2, 3]
    independent_instances: 6
  budget:
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 0.05
    maximum_memory_gb: 2
    maximum_runs: 1
  stopping_rules:
    - >-
      Stop immediately and mark invalid if any point-map or modular-root
      verification fails.
    - >-
      Stop after all six special-j cells and the matched controls are recorded;
      no additional cells may be added post hoc.
  invalidation_rules:
    - >-
      Missing, malformed, or changed frozen input hashes invalidate the run.
    - >-
      A timeout or dependency failure is infrastructure failure, never evidence
      against the hypothesis.
    - >-
      Any result that omits the synthetic control is invalid and cannot be used
      to close the existence question.
  success_criterion: >-
    Every valid J0/J1728 cell has a verified map scalar and at least one
    nonzero short relation, while every synthetic [1,2,4] control has no such
    relation.
  falsification_criterion: >-
    A valid special-j cell has a verified eigenvalue set with no nonzero
    relation in {-1,0,1}^r. This reopens the relation-free rank-3 escape and
    requires independent adversarial review before interpretation.
  required_artifacts:
    - experiments/EXP-ECDLP-fce71d/specification.yaml
    - experiments/EXP-ECDLP-fce71d/code/verify_relation_free.py
    - experiments/EXP-ECDLP-fce71d/runs/RUN-ECDLP-fce71d-001/manifest.yaml
    - experiments/EXP-ECDLP-fce71d/runs/RUN-ECDLP-fce71d-001/raw-result.json
    - experiments/EXP-ECDLP-fce71d/runs/RUN-ECDLP-fce71d-001/stdout.log
    - experiments/EXP-ECDLP-fce71d/runs/RUN-ECDLP-fce71d-001/stderr.log
    - experiments/EXP-ECDLP-fce71d/runs/RUN-ECDLP-fce71d-001/command.txt
    - experiments/EXP-ECDLP-fce71d/runs/RUN-ECDLP-fce71d-001/environment.json
  assigned_to: executor
