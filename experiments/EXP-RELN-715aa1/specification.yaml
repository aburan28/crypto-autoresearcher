experiment:
  id: EXP-RELN-715aa1
  id_allocation_provenance: >-
    Token minted this session with `python3 tools/allocate_id.py --next
    experiment --area RELN` and confirmed free with `--check` before this
    contract was authored.
  hypothesis_id: H-RELN-246a2f
  source_proposal: IDEA-20260906-b26c06
  question_id: RQ-RELN-61638a
  version: 1
  title: >-
    Learned search-policy gain on the ECDLP relation-collection solve and
    linear-algebra channels: Stage-0 zero-compute re-derivation and
    falsification checks ONLY -- the instrumented-solver/policy-training
    stages (1-4) are named, scoped, and explicitly NOT authorized by this
    contract.
  objective: >-
    Re-derive, at zero compute, the three closed-form quantities
    IDEA-20260906-b26c06's full pipeline depends on before any instrumented-
    solver implementation or policy-training compute is authorized: (a) the
    existence-channel oracle ratio (expected lookups under random order
    versus a perfect ordering oracle) from the Poisson law at
    mu in {1, 1/2, 1/4} under both first-element conventions, checked
    against the exhaustive c_D tables already committed by EXP-FB3-001 and
    this lane's FB3 geometries; (b) the planted-positive-control's predicted
    gain factor from the semi-regular closed form, at B in {6, 8, 12, 16,
    24}; (c) the da1428 k-ladder cost table (cost versus guess depth k at
    omega = 2) at the same B grid, as the exact reproduction target Stage 1
    would have to hit before training any policy. This is the proof_search_
    map's own "cheap pre-compute falsification check" step
    (docs/inventor-protocol.md section 8, KN-TECH-080): if any of (a)-(c)
    disagrees with its closed-form prediction beyond the stated tolerance,
    the record's premises are wrong and the "core-days to core-weeks"
    instrumented-solver build (IDEA-20260906-b26c06's own cost estimate) is
    not worth authorizing on the strength of an unverified derivation.

  scope_and_priority_disclosure: >-
    IDEA-20260906-b26c06 self-assigns recommended_priority: low with an
    explicit note: "the channel is LIVE... but its ceiling is a constant
    unless the growth arm says otherwise... it is SEQUENCED AFTER the
    exhaustive enumeration battery... and after the predictor panel... and
    should be designed only once the two predecessors have reported."
    EXP-RELN-f202be (the enumeration battery) reported inconclusive
    (EV-RELN-335cd2 / DEC-20260907-843464); EXP-RELN-82f487 (the predictor
    panel) reported two of three planned cells (EV-RELN-cc045d,
    EV-RELN-99c688 / DEC-20260907-7ccae3), with the third seed cell named
    as an open next_action, deprioritized in favor of EXP-RELN-141a86's
    approach-design work, and not executed. The sequencing precondition is
    therefore PARTIALLY, not fully, satisfied. This contract does not wait
    on the third predictor cell: Stage 0 is pure closed-form arithmetic,
    touches neither the predictor panel's target-selection channel (which
    this hypothesis explicitly reduces away, not tests) nor the solve/LA
    channels' live compute, and its own idle cost is zero. Stages 1-4 (the
    actual policy-training pipeline this idea proposes) remain unauthorized
    regardless, both for the priority/sequencing reason above and for the
    environment-feasibility reason below.

  environment_feasibility_disclosure: >-
    This session has directly observed the current execution environment
    restart its container roughly 20+ times over a single sibling
    experiment's Stage 1 run (EXP-RELN-141a86), each restart killing any
    unattended background process; sustained single-cycle uptimes have
    ranged from single-digit minutes to several hours, unpredictably.
    IDEA-20260906-b26c06's own estimated_cost names implementation: high,
    compute: high, "core-days to core-weeks" for the instrumented-solver
    build and multi-seed policy training it proposes for Stages 1-4. Per
    docs/research-budget-policy.md, that cost estimate is advisory and does
    not by itself block design or approval -- but a multi-week compute
    campaign in an environment that has not sustained multi-hour unattended
    jobs reliably even once without engineered checkpoint-resume is not
    something this contract authorizes blind. Any future expand decision
    for Stages 1-4 should budget for building the same per-unit
    checkpoint-resume discipline (KN-TECH pattern, this session's own
    EXP-RELN-141a86 precedent, commit 46fe1eca9) into the instrumented
    solver and the policy-training loop from the start, not retrofitted
    after multiple restart cycles waste redundant compute.

  inputs:
    poisson_law:
      description: >-
        The existence-channel oracle-ratio closed form under the Poisson
        model, from H-RELN-246a2f's proof_search_map proof_obligations and
        IDEA-20260906-b26c06's claim (2): with c_D(R) ~ Poisson(mu), the
        ratio (expected lookups under random order)/(expected lookups under
        a perfect oracle order) is derived per the stated first-element
        convention (c' = 3c or c' = c).
      fields: mu, first_element_convention, B
    exhaustive_c_D_tables:
      paths:
        - experiments/EXP-FB3-001/runs/RUN-FB3-001-N14/raw-result.json
        - experiments/EXP-FB3-001/runs/RUN-FB3-001-N16/raw-result.json
        - experiments/EXP-FB3-001/runs/RUN-FB3-001-N18/raw-result.json
      role: >-
        Cross-check the Poisson prediction against already-committed real
        c_D vectors (not a new run); read-only.
    semi_regular_degree_formula:
      description: >-
        d_reg = ceil((m(B-1)+D_S)/2), IDEA-20260808-093497, used both for
        the planted-control predicted-gain closed form and the da1428
        k-ladder table.
    da1428_k_ladder:
      description: >-
        The hybrid guess-and-determine cost-versus-k table at omega = 2,
        from IDEA-20260808-da1428 stage 0, re-derived (not re-read from that
        record's own artifacts, which this contract does not have write
        access to) at the same B grid.

  controls:
    - name: poisson_vs_exhaustive_cross_check
      construction: >-
        Compute the oracle ratio from the Poisson closed form at the SAME
        mu values realized by the already-committed EXP-FB3-001 cells (read
        their actual N, B to get mu = C(B+2,3)/N, not the nominal
        mu in {1, 1/2, 1/4}), and separately compute the ratio directly from
        each cell's own raw c_D vector (no Poisson assumption).
      expected: >-
        Agreement within the stated Janson-bracket tolerance
        (IDEA-20260906-86cd30); a disagreement is reported honestly per
        HEUR-RELN-H3-b26c06's falsification_condition, not smoothed over.
    - name: reproducibility_control
      construction: >-
        Run the Stage-0 computation twice, bit-identically, with no random
        seed involved (pure closed-form arithmetic).
      expected: Bit-identical output both times; any difference is failed_infrastructure.
  independent_variables:
    - name: mu
      values: [1, 0.5, 0.25]
    - name: first_element_convention
      values: [c_prime_eq_3c, c_prime_eq_c]
    - name: B
      values: [6, 8, 12, 16, 24]
    - name: k
      values: [0, 1, 2]
  metrics:
    primary:
      - >-
        Existence-channel oracle ratio per (mu, first_element_convention),
        compared against < 2 and against the monotone-decreasing-toward-1
        prediction as mu decreases.
      - >-
        Planted-control predicted gain factor per B, as an exact rational
        or high-precision value with its derivation shown.
      - >-
        da1428 k-ladder table (cost at k in {0,1,2}) per B, at omega = 2.
    secondary:
      - >-
        Poisson-vs-exhaustive cross-check agreement/disagreement per
        EXP-FB3-001 cell, with the measured mu and both ratios reported
        side by side.
  heuristic_under_test: HEUR-RELN-H3-b26c06
  preregistered_prediction:
    quantity: >-
      The existence-channel oracle ratio as a function of mu, under both
      first-element conventions.
    formula: >-
      IDEA-20260906-b26c06's claim (2) derivation: ratio < 2 for every mu,
      tending to 1 as mu -> 0; exact value per convention, to be emitted by
      this run from the stated Poisson-law derivation, not re-derived ad
      hoc during execution.
    source: IDEA-20260906-b26c06 claim section (2), H-RELN-246a2f proof_obligations.
  scale_relevance:
    tier: toy
    justification: >-
      Stage 0 is symbolic/closed-form; "scale" here means the mu and B grid
      values used, which match the toy ladder log2 p in {16, 20, 24, 28}
      this hypothesis's (unauthorized) later stages would use. No claim
      about cryptographic-scale curves is made or licensed.
    correspondence: null
  tail_checks:
    - >-
      k-rich tail check: the largest observed |c_D(R)| in each cross-
      checked EXP-FB3-001 cell against the Poisson tail prediction
      P[c >= k], reported for k up to the observed maximum (per
      HEUR-RELN-H3-b26c06's validation_plan).
  replication:
    seeds: []
    independent_instances: 0
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.2
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
  budget_interpretation: >-
    This design authorizes Stage 0 ONLY: a single, short, zero-compute
    (pure arithmetic) run. It authorizes ZERO instrumented-solver
    implementation and ZERO policy-training runs. Stages 1-4 of
    IDEA-20260906-b26c06's own minimal_test design (the instrumented
    Buchberger/F4 solver, the MDP wrapper, policy training, and the
    symbolic-regression extraction in the alive branch) require a separate,
    future Coordinator expand decision and, given this contract's
    environment_feasibility_disclosure, should not be approved without a
    concrete checkpoint-resume design built in from the start.

  stopping_rules:
    - >-
      Stop after Stage 0 completes and its outputs are archived; do not
      proceed to any instrumented-solver implementation or policy training
      under this contract regardless of Stage 0's outcome.
    - >-
      Stop immediately on any disagreement between the Poisson closed form
      and the exhaustive c_D cross-check beyond the stated Janson-bracket
      tolerance; report as a falsification of HEUR-RELN-H3-b26c06's
      Stage-0-reachable falsification_condition, not as an error to
      work around.
    - No automatic retries, no formula substitution, no tolerance widened after the fact.

  invalidation_rules:
    - Any Stage-0 output that is not reproduced bit-identically on a second run.
    - >-
      Any use of the program's sympy Buchberger wrapper for anything in
      this contract (it is explicitly out of scope for Stage 0, which needs
      no solver at all).
    - >-
      Reading EXP-FB3-001 cells' mu from anything other than each cell's
      own recorded N and B (no assumed/nominal mu substituted for a real
      cell's actual value).
    - >-
      Timeout, out-of-memory, or tool crash in the (trivial) Stage-0
      computation is failed_infrastructure, never a negative or positive
      result.

  success_criterion: >-
    Decidable from Stage 0's own primary metrics. SUCCEEDS as a test of
    HEUR-RELN-H3-b26c06 and the existence-channel ceiling derivation when:
    the computed oracle ratio is < 2 at every tested mu and decreases toward
    1 as mu decreases; the Poisson-vs-exhaustive cross-check agrees within
    the Janson-bracket tolerance at every available EXP-FB3-001 cell; and
    the planted-control and k-ladder tables are emitted with their
    derivations shown (no numeric claim asserted without a shown formula).
    This confirms the STAGE-0-REACHABLE premises H-RELN-246a2f's later
    (unauthorized) stages depend on; it does NOT confirm or refute the
    constant-Gamma claim itself, which requires Stage 2-3 compute this
    contract does not authorize.

  falsification_criterion: >-
    FALSIFIES the Stage-0-reachable premises when: the computed oracle
    ratio is >= 2 at any tested mu, or does not decrease toward 1 as mu
    decreases (refutes the in-record existence-channel derivation and
    re-opens the existence channel as a live channel for a policy, per
    H-RELN-246a2f's falsification_conditions); or the Poisson-vs-exhaustive
    cross-check disagrees beyond the Janson-bracket tolerance at any
    available cell (refutes HEUR-RELN-H3-b26c06 as stated). NOT
    falsification: any Stage-0 infrastructure failure (timeout, crash --
    failed_infrastructure, never evidence); anything about the solve or
    linear-algebra channels' Gamma, which Stage 0 does not measure.

  decision_paths:
    positive: >-
      (Stage 0 succeeds.) The Coordinator records the confirmed Stage-0
      premises at toy scale, cites the exact re-derived formulas and the
      cross-check agreement, and separately decides -- as its own,
      independent expand decision, not implied by this outcome -- whether
      the cost/priority/environment-feasibility case for authorizing
      Stages 1-4 has changed.
    negative: >-
      (Stage 0 falsifies a premise.) The specific falsified premise
      (existence-ceiling derivation or the Poisson heuristic) is reported
      to the IDEA-20260906-86cd30 / da1428 lanes it depends on, per
      AGENTS.md rule 9 (no deliberate steering-away); IDEA-20260906-b26c06's
      claim is scoped down to note the falsified premise, and Stages 1-4
      are not designed until the falsified premise is repaired or
      superseded.

  required_artifacts:
    - runs/RUN-RELN-715aa1-stage0/manifest.yaml
    - runs/RUN-RELN-715aa1-stage0/command.txt
    - runs/RUN-RELN-715aa1-stage0/environment.json
    - runs/RUN-RELN-715aa1-stage0/stdout.log
    - runs/RUN-RELN-715aa1-stage0/stderr.log
    - runs/RUN-RELN-715aa1-stage0/raw-result.json

  later_review_requirements:
    - >-
      A committed Coordinator review_plan must precede any claim-changing
      review, declaring the prior on the existence-channel ceiling and on
      HEUR-RELN-H3-b26c06's Poisson assumption.
    - >-
      Independent validator re-derives the oracle-ratio closed form and the
      planted-control gain factor from the stated formulas alone, without
      the producer's code, and confirms the numeric outputs match.
    - >-
      Red team checks: whether the Poisson-vs-exhaustive cross-check's
      tolerance was set before or after seeing the disagreement (it must be
      set before, per HEUR-RELN-H3-b26c06's pre-stated validation_plan);
      whether any EXP-FB3-001 cell was excluded from the cross-check
      without a stated reason.

  status: approved
  assigned_to: executor
  approved_by: coordinator
  execution_authorized: true
  design_handoff: TASK-20260908-788e3b
  approval_note: >-
    Approved under DEC-20260908-80895f, per the standing user authorization
    in AGENTS.md for Coordinator-ranked next-candidate selection (no
    per-idea user approval required). Scope is Stage 0 (zero-compute
    closed-form re-derivation) ONLY, per this contract's own
    budget_interpretation and environment_feasibility_disclosure; Stages
    1-4 are explicitly unauthorized and require a separate future expand
    decision.
