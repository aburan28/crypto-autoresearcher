protocol_amendment:
  experiment_id: EXP-RELN-715aa1
  amendment_ordinal: 2
  version_from: 2
  version_to: 3
  filename_convention_note: >-
    THE FILENAME IS v2.yaml BECAUSE THIS IS THE SECOND AMENDMENT TO THIS
    CONTRACT. Amendment v1 produced contract version 2; this amendment
    produces version 3.
  filed_at: '2026-09-08'
  filed_by: coordinator (orchestrating session, RQ-RELN-61638a)
  recorded_by_decision: DEC-20260908-f7903c
  status: filed_before_any_run_executed
  claim_tier: toy

  reason: >-
    A second executor dispatch, running under amendment v1, again correctly
    refused to execute Stage 0: v1 fixed the poisson_vs_exhaustive_cross_
    check's CONSTRUCTION (which statistics to compare -- mean, coverage,
    variance, max_count, all present in the committed EXP-FB3-001 cells) but
    left the control's `expected` field pointing at the ORIGINAL Janson-
    bracket tolerance (IDEA-20260906-86cd30's Delta_3/p_max construction),
    which is itself a quantity computed from the underlying hyperedge/
    decomposition structure -- not recoverable from the five committed
    aggregate `stats` fields, the same class of gap v1 already fixed for the
    construction, now recurring for the tolerance. The executor also
    correctly declined to substitute IDEA-20260906-86cd30's OTHER stated
    tolerance conventions (its M2 "3 Monte Carlo standard errors" and F3
    "beyond 4 SE" clauses) verbatim, since those apply to a different
    statistic (random-arm coverage over 200 sampled bases) under a
    different sampling model, and reusing a number from a different check
    under this check's name would be exactly the "formula substitution"
    the frozen contract's stopping_rules forbid. It also flagged, as a
    non-blocking observation, that all 112 cells across the three named
    RUN-FB3-001 files use one of 7 STRUCTURED geometries (asymmetric_
    sizing, coset_union, greedy_optimized, high_bit_interval,
    mixed_two_base, mixed_two_base__secondary_typing, small_height) --
    independently confirmed by the Coordinator -- with no plain matched-
    random-base cell among them, and asked the Coordinator to state
    explicitly whether structured geometries count toward the decidable
    falsification criterion.

  applies_to: >-
    `controls[0].poisson_vs_exhaustive_cross_check.expected` (as narrowed
    by amendment v1's `applies_to`), and the corresponding
    "beyond the stated Janson-bracket tolerance" clauses inside
    `success_criterion`/`falsification_criterion`/`stopping_rules`, are
    replaced, for THIS experiment only, by a pre-registered, standard
    normal-approximation (Wald) agreement band computed from each cell's
    own committed `n_targets` and its independently-derived mu
    (unchanged from v0/v1: mu = C(B+2,3)/N from that cell's own recorded
    N, B) -- no quantity beyond what v1 already established as computable
    from the committed `stats` block is required:
      - mean: predicted mu, SE = sqrt(mu / n_targets). Disagreement if
        |measured_mean - mu| > 3 * SE.
      - coverage: predicted p = 1 - exp(-mu), SE = sqrt(p*(1-p) / n_targets).
        Disagreement if |measured_coverage - p| > 3 * SE.
      - index of dispersion (measured_variance / mu; predicted = 1 under
        Poisson equidispersion): SE = sqrt((1 + 2*mu) / (mu * n_targets))
        (from the asymptotic variance of the sample variance of a Poisson
        variate, Var(variance_hat) ~= (mu + 2*mu^2)/n, divided by mu^2).
        Disagreement if |index - 1| > 3 * SE.
      - tail (max_count): report r = n_targets * P[c >= max_count] under
        Poisson(mu) (a Poisson survival-function evaluation, pure closed-
        form). Disagreement if r < 0.05 (under the null, fewer than a
        1-in-20 chance of any draw in this cell reaching the observed
        maximum -- a surprising tail, the standard direction in which a
        heavier-than-Poisson tail would show up). Report r for every cell
        regardless of whether the flag trips.
    The z = 3 (SE) multiplier for the three moment checks is ADAPTED FROM,
    not reused verbatim as, IDEA-20260906-86cd30's M2 convention ("within 3
    Monte Carlo standard errors") -- the closest available precedent in
    this research thread for what counts as agreement under a Wald-type
    band, applied here to a different statistic and a different (larger,
    per-cell n_targets rather than a 200-draw Monte Carlo null) sample
    size, using the correct asymptotic SE for each of these three specific
    estimators as derived above. This choice, like the statistics amendment
    v1 already made, is filed BEFORE any Stage-0 number is computed.
    The r < 0.05 tail threshold is a new, explicitly pre-registered
    convention (this contract has no closer precedent for a single-
    observed-maximum tail check); it is stated here, before any Stage-0 run,
    for exactly the same reason.
    All 7 committed EXP-FB3-001 geometries (structured or not) remain IN
    SCOPE for this decidable criterion, unfiltered, exactly as the v0
    contract's own "at every available cell" / "at any available cell"
    language already specified -- Stage 0 does not filter by geometry or
    otherwise pre-judge which cells should or should not be expected to
    agree; it computes and reports the same four comparisons uniformly for
    every committed cell, WITH each cell's `geometry` label reported
    alongside its comparison so that a human reviewer can see whether any
    disagreement correlates with structured (non-random) construction.
    Whether a structured-geometry disagreement should count against
    HEUR-RELN-H3-b26c06 itself (a claim about a uniformly random B-subset)
    or is better read as an expected property of that geometry's
    construction is an interpretive question for the Coordinator's later
    review (later_review_requirements), not a Stage-0 measurement decision
    -- Stage 0 measures and reports; it does not filter or interpret.
  what_does_not_change: >-
    Amendment v1's construction (which statistics to compare) is unchanged.
    The pure closed-form Poisson-law oracle-ratio table, the planted-
    control predicted gain factor, and the da1428 k-ladder table remain
    self-contained arithmetic, unaffected by either amendment. Stage 0's
    zero-compute scope, write_scope, and the Stage 1-4 non-authorization
    are unchanged.
  degraded_scope_disclosure: >-
    Carries forward amendment v1's disclosure unchanged (a moment-based
    agreement check is strictly weaker evidence than a full-distribution
    cross-check) and adds: the z=3 / r<0.05 thresholds are ADAPTED
    conventions, not the record's own frozen Janson-bracket tolerance --
    any later claim drawing on this cross-check must state both
    qualifiers (moment-based, and adapted-threshold) verbatim, not just
    the first. A structured-geometry cell disagreeing under this check is
    evidence to be interpreted at review, not an automatic falsification
    of HEUR-RELN-H3-b26c06, which concerns uniformly random B-subsets
    specifically; Stage 0 itself makes no such interpretive call.
  approved_by: coordinator
  status: approved
