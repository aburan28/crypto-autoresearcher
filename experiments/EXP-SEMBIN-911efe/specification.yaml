experiment:
  id: EXP-SEMBIN-911efe
  hypothesis_id: H-SEMBIN-83a856
  goal_id: GOAL-SEMBIN-5078bc
  version: 1
  title: >-
    Split RUN-SEMBIN-1b9afe's per-target decomposition counts by trace parity, test
    the confinement mechanism per target, and count two odd-n control cells
  status: analyzed
  status_history:
    - status: approved
      at: '2026-09-13'
      by: coordinator
      ref: DEC-20260913-c224bb
    - status: completed
      at: '2026-09-13'
      by: executor
      run_id: RUN-SEMBIN-8be036
      note: >-
        Run archived under experiments/EXP-SEMBIN-911efe/runs/RUN-SEMBIN-8be036/ by
        TASK-20260913-e39bfe (commit e7a7f6ddb); manifest status completed_valid;
        N1 = 16 diagnosed and recorded per the stopping rule.
    - status: analyzed
      at: '2026-09-13'
      by: coordinator
      ref: DEC-20260913-92aa48
      note: >-
        EV-SEMBIN-0c8bf4 composed from REVIEW-SEMBIN-20260913-911efe (K1, K2 hold).
        The contract's N1 wording defect is recorded as DEC-20260913-92aa48 PD-F;
        this specification is not otherwise edited.
  objective: >-
    Decide, from committed artifacts and one trace computation per target, whether
    the low-degree-window yield deficit recorded in EV-SEMBIN-d40877 (O-5:
    f_dispersion 0.79-0.82, variance/mean 1.46-1.52, low_degree_polynomial V only,
    b-independent) is the trace-parity confinement of H-SEMBIN-83a856. The decisive
    quantity is a single integer -- the number of nonzero decomposition counts on
    targets with Tr(x_R) = 1 in the low-degree even-n configurations -- predicted to
    be exactly 0. Then test whether the Poisson shape is restored inside the reachable
    class (the difference between "the mechanism" and "the whole mechanism"), and
    count two odd-n cells where the mechanism predicts no deficit.
  inputs:
    primary_data: experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/per-R-counts.json
    primary_data_columns_used: [R_x, R_y, single_x_multiset, chained_x_multiset, usable_point_multiset, tau_O, tau_T2]
    field_code: experiments/EXP-SEMBIN-354a75/code/binary_field.py (modulus_for, trace) -- reused READ-ONLY, copied into this experiment's code directory with its sha256 recorded
    subspace_code: experiments/EXP-SEMBIN-354a75/code/yield_core.py (low_degree_polynomial and random_k_dimensional bases; the random basis must be regenerated from the recorded seed exactly as the run did)
    counting_code_for_P4: experiments/EXP-SEMBIN-354a75/code/ (yield_core.py, yield_run.py) reused for two new cells
    secondary_data: experiments/EXP-SEMBIN-92724f/runs/RUN-SEMBIN-cbd770/image-sizes.json and raw-result.json (P5, conditional on image MEMBERSHIP being retained)
    frozen_source: inputs/SEMAEV-2015-310/ (eq. 11; Section 4.4 window); inputs/NAGAO-2015-984/ (Section 7)
    curves: y^2 + xy = x^3 + B over F_{2^n}, a = 0, as the source runs used
    cells_reanalysed: all 180 configurations of RUN-SEMBIN-1b9afe, both target populations (E side and twist side, each split with its own a)
    new_cells_P4:
      - {n: 21, m: 2, t: 2, k: 11, subspace: low_degree_polynomial, B_modes: [B_eq_1, random_B], seeds: [20260913201, 20260913202], targets_per_config: 2000}
      - {n: 23, m: 2, t: 2, k: 12, subspace: low_degree_polynomial, B_modes: [B_eq_1, random_B], seeds: [20260913201, 20260913202], targets_per_config: 2000}
    new_cells_note: >-
      |V|^2 is 2^22 and 2^24 pairs; exhaustive per the EXP-SEMBIN-354a75 procedure.
      An unreached cell is recorded unreached, never sampled.
  controls:
    - kind: reconstruction
      design: >-
        Before any split, recompute from per-R-counts.json the pooled hit fraction,
        mean, variance/mean and f_dispersion per configuration and confirm they match
        the validator's figures (coordination/review/sembin-20260913-run2/
        TASK-20260913-31d530/report.md) to the printed precision. A mismatch stops
        the run: the re-analysis is not reading the same data.
    - kind: algebraic_selftest
      design: >-
        Enumerate E(F_{2^n}) for n = 7, 8, 9 and a in {0, 1}, compute 2E directly by
        doubling every point, and confirm 2E = {P : Tr(x_P) = Tr(a)} union {O}
        exactly (six cases). Confirm at each source cell, under the run's own
        modulus_for(n), that Tr(alpha^j) = 0 for all j < k (V confined) and, for each
        random_k_dimensional basis regenerated from its seed, whether it lies in
        ker(Tr) (expected: not). These are checks on the arithmetic, not evidence.
    - kind: null_object
      design: >-
        The random_k_dimensional configurations of the same cells and seeds. The
        mechanism predicts NO stratification by Tr(x_R) there (P3). A Tr = 1 deficit
        for random V too means the effect is not confinement.
    - kind: known_false
      design: >-
        Split the same low-degree data by (i) the lowest bit of R_x and (ii) Tr(R_x)
        computed under a DIFFERENT irreducible of the same degree. Both classes must
        show equal means and the pooled over-dispersion must persist in each. An
        empty class under either split means the analysis code is producing the
        effect; the run is then invalid.
    - kind: matched_null
      design: >-
        If per-R counts of the run's symmetric-random-map null are retained in the
        archive, split them by Tr(R_x): two indistinguishable Poisson classes are
        required. If they are not retained, record the control as unavailable and do
        not substitute.
    - kind: nearby_object
      design: >-
        The two odd-n cells (P4): same construction, same code path, V not confined.
        f_dispersion is predicted within error of 1.00.
  independent_variables:
    - parity class pi(R) = Tr(x_R) + Tr(a) (the split variable)
    - subspace variant (low_degree_polynomial | random_k_dimensional)
    - n parity (even source cells | odd new cells)
    - presentation (single eq. 4 | chained eq. 5)
    - curve coefficient B
    - target side (E | twist), each with its own a
  metrics:
    primary:
      - nonzero_count_on_Tr1_targets_low_degree_even_n  # P1: predicted exactly 0
      - per_class_target_count
      - per_class_mean_and_variance_over_mean
      - pooled_variance_over_mean_vs_1_plus_lambda
      - f_dispersion_per_class_and_pooled
      - odd_n_f_dispersion  # P4
    secondary:
      - factor_base_parity_census (count of factor-base points per parity, including x = 0)
      - P5_image_parity_census (if membership retained)
      - reconstruction_residuals
      - wall_clock_and_peak_rss_per_cell
  preregistered_prediction:
    quantity: >-
      The integer N1 := number of (configuration, target) pairs with Tr(x_R) = 1,
      low_degree_polynomial V, even n, and a nonzero decomposition count in either
      presentation; and per-class variance/mean in the Tr = 0 class.
    formula: >-
      N1 = 0 exactly. Tr = 0 class: mean = 2 * pooled mean within sampling error,
      variance/mean = 1.00 within error. Pooled variance/mean = 1 + lambda within error.
      Random V: no stratification. Odd n: f_dispersion = 1.00 within error.
    source: H-SEMBIN-83a856 statement and mechanism; IDEA-20260913-cedd2f.
  coordinator_prior: >-
    Recorded before dispatch. The Coordinator expects N1 = 0 and P2 to hold, because
    the arithmetic in IDEA-20260913-cedd2f reproduces four independently measured
    figures with no free parameter, which is a stronger prior than the program
    usually has. Where the Coordinator expects it to break, if anywhere: the twist
    side (a' with Tr(a') = Tr(a) + 1; a split done with the wrong a would put the
    empty class on the wrong side and look like a falsification), and the x = 0
    factor-base point. The Coordinator also expects P5 to be untestable from the
    archive, because RUN-SEMBIN-cbd770 recorded image sizes, not membership.
  scale_relevance:
    tier: toy
    justification: >-
      n <= 24 re-analysis plus two exhaustive cells at n = 21, 23. The deterministic
      claim (P1) transfers by the theorem; the statistical claims (P2-P4) are scoped
      to these cells.
    correspondence: null
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    maximum_memory_gb: 4
    maximum_runs: 4
    maximum_workers: 1
  stopping_rules:
    - Stop and report a procedure defect if the reconstruction control fails.
    - >-
      Stop and diagnose before any statement if N1 > 0: check the side's a, the
      modulus, and the x_R reading first; record the diagnosis; do not form a claim.
    - Stop the run as invalid if a known-false split produces an empty class.
    - Record an unreached odd-n cell as unreached; never sample.
  invalidation_rules:
    - The run is invalid if the reconstruction control does not match the validator's pooled figures.
    - The run is invalid if the algebraic selftest fails in any of the six cases.
    - The run is invalid if any known-false split produces an empty class.
    - >-
      A twist-side split that does not use the twist's own a is invalid for that
      side.
  success_criterion: >-
    Reconstruction and selftests pass; N1 is reported as an exact integer; per-class
    statistics are reported for every configuration; the known-false and null-object
    controls behave as declared; the two odd-n cells are reported (or recorded
    unreached). N1 = 0 with P2 holding and P4 holding is a confirmation of the
    mechanism at this scope; N1 = 0 with the Tr = 0 class still over-dispersed is a
    partial attribution and is reported as such; N1 > 0 is a diagnosed procedure
    finding.
  falsification_criterion: >-
    N1 > 0 with the side's a, the modulus and the x_R reading verified falsifies
    confinement at that cell. Tr = 0 class variance/mean at 1.4-1.5 falsifies "whole
    deficit". Odd-n f_dispersion at 0.79-0.82 falsifies the even-n scoping.
  required_artifacts:
    - per-configuration, per-class table (targets, nonzero counts, mean, variance/mean, f_dispersion) for both presentations, machine-readable
    - N1 as an exact integer with the list of any offending (configuration, target index) pairs
    - factor-base parity census per configuration
    - all control outcomes, including "unavailable" where declared
    - the two odd-n cells' per-R counts in full, or the unreached record
    - sha256 of every reused source file and the exact command, git commit and dirty-tree state
    - stdout, stderr, wall clock and peak RSS
    - manifest.yaml following templates/research-records.md run manifest schema (status, code.commit, inference block with requested_policy, resolved_model_id, fallback_used and its reason)
  assigned_to: executor
  approved_by: DEC-20260913-c224bb
  approval_basis: >-
    Standing user authorization of 2026-09-06. Approval asserts protocol completeness,
    not that H-SEMBIN-83a856 is true.
  dependencies: []
  independence_note: >-
    Depends on no degree measurement and no solver; re-analyses committed artifacts
    plus two small exhaustive cells. Runs concurrently with everything else in the
    batch.
  interpretation_limits:
    - No statement about first fall degree, Proposition 5, Theorem 1's exponent, or any curve's security.
    - >-
      A confirmed mechanism does not edit EV-SEMBIN-d40877 or DEC-20260913-3b51c8;
      it is recorded as a new evidence record superseding by reference.
    - Observations only from the executor; the Coordinator composes after independent review.
