experiment:
  id: EXP-FRODOFO-663058
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-adf2a2; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-adf2a2
  question_id: RQ-FRODO-a2dbe2
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Rejection-signature comparison of implicit and explicit Fujisaki-Okamoto decapsulation on
    a toy unstructured-LWE KEM, against an enumerated malformed-ciphertext class set and a random-function
    null arm.
  objective: 'One uncertainty is reduced: whether implicit and explicit rejection are separable by
    an adversary who sees only returned values, and by how much, at toy scale. (i) IS THE RIG HONEST.
    On the honest-ciphertext class both decapsulators must return the same correct key and the signature
    must be trivial; on the random-function null arm the signature must not depend on class identity,
    and the pinned-z secret-resampling control must show no movement. Failing any of these means the
    instrument measures itself and nothing downstream may be reported. (ii) HOW BIG IS THE SEPARATION.
    Over the frozen enumerated class set, what fraction of classes yields a signature on which the
    two decapsulators differ, and what is its bootstrap interval across three independent seed families?
    This is the headline number and it is meaningful only jointly with the class set that defines
    it. (iii) IS THE SEPARATION STRUCTURAL OR AN ARTIFACT. Under a sweep of the toy dimension, does
    the fraction move? Per docs/inventor-protocol.md section 3 a quantity that should respond to the
    parameter meant to change it and does not is the signature of an artifact, so a fraction constant
    across three dimensions is recorded as a controlled null rather than as a finding. The run touches
    no primary source and asserts nothing about FrodoKEM.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: for THIS toy unstructured-LWE
      KEM at the stated dimensions, THIS frozen enumeration of malformed-ciphertext classes, and an
      adversary restricted to returned values and their equality relations, the two decapsulators
      produced the measured signature table and the measured middle-regime fraction with the stated
      interval, while the random-function null produced the stated contrasting values. WHAT DOES NOT
      FOLLOW: nothing about FrodoKEM at its real parameters, nothing about any deployed implementation,
      nothing about whether either rejection mode is preferable, no adversary cost, no security consequence,
      and no confirmation or contradiction of any implementation-channel result in the corpus, since
      the design removes those channels by construction.'
  inputs:
    procedure: 'STAGE 0, rig build. Toy unstructured-LWE PKE of Frodo shape plus both FO decapsulators
      over shared key material, with the failure path''s use of z written as an explicit, documented
      specification choice. Cost: implementation only. STAGE 1, honest-class gate. Generate honest
      ciphertexts, confirm both decapsulators agree and the signature is trivial. Cost: seconds; a
      failure halts the run. STAGE 2, class enumeration. Freeze the named malformed classes and their
      seeded generators; emit the class set as a machine-readable artifact before any measurement.
      Cost: implementation. STAGE 3, signature measurement. For each class and each arm, decapsulate
      each ciphertext twice, then re-run the implicit variant with z pinned and the secret resampled;
      record the three bits. Cost: minutes. STAGE 4, null arm, in the same invocation with disjoint
      seed streams. Cost: minutes. STAGE 5, dimension sweep at three toy dimensions, repeating stages
      1 through 4. Cost: under one CPU-hour. STAGE 6, bootstrap over three seed families and report
      per-family before pooling. STAGE 7, immutable run records via harness/runner.py with seeds,
      class set and resolved inference block.'
    instrument: 'Python 3, standard library only: hashlib for the hash and pseudorandom-function calls,
      secrets and random.Random with recorded disjoint seed streams, and integer matrix arithmetic
      written directly rather than via a linear-algebra package, so the toy PKE has no dependency
      that could differ between arms. No Sage, no lattice estimator, no external computer-algebra
      system. Optional numpy only for speed on the largest toy dimension, with a stdlib fallback that
      must produce bitwise-identical outputs and is checked to do so. Run manifests, seeds and the
      inference block are written through harness/runner.py; ids minted with tools/allocate_id.py.'
    parameters: 'Three toy dimensions n in {16, 32, 64} with nbar = 4, modulus q = 2^12, error table
      of support |z| <= 6 with dyadic probabilities on denominator 2^12. Class set frozen at six named
      classes: honest, single-coordinate plus one, single-coordinate large perturbation, zeroed coordinate
      block, wrong-key ciphertext, same-randomness different-message ciphertext. 32 ciphertexts per
      class per seed family, 3 seed families, 2 decapsulator variants, 2 arms (KEM, random-function
      null), 2 queries per ciphertext for determinism, plus 1 pinned-z resample run. Total decapsulations
      under 2^17 at the largest dimension. Bootstrap resamples: 2000.'
  controls:
  - Random-function null arm with the identical interface, class enumerator and signature measurement,
    run in the same invocation as the signal arm.
  - Honest-ciphertext control class, on which both decapsulators must return the same correct key
    and the signature must be the trivial one.
  - Pinned-z secret-resampling control, which on the null arm must show no output movement.
  - Double-query determinism control applied to both arms and to the honest class.
  - 'Dimension sweep as the structural-tell control: the measured fraction must move as the toy dimension
    moves, per inventor-protocol section 3.'
  - 'Seed-replication control: three independent seed families, with the middle-regime fraction reported
    per family before pooling.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A random-function stand-in with the identical interface: a keyed pseudorandom
    function from ciphertext bytes to a key of the same length, wrapped in a fake explicit mode that
    rejects on a fixed-probability coin independent of the ciphertext content, run through the IDENTICAL
    class enumerator and the IDENTICAL signature measurement in the same invocation. The null must
    show a middle-regime fraction consistent with its own rejection coin and NO dependence of the
    signature on class identity, because a random function has no re-encryption check to fail. If
    the null reproduces the signal arm''s class-dependent pattern, then the pattern is produced by
    the class generator or the measurement code rather than by the KEM, and the signal arm means nothing.
    A second null holds z fixed and resamples the secret on the random-function arm, where by construction
    the output must not move; a moved output there is a measurement bug.'
  independent_variables:
  - 'decapsulator variant: implicit or explicit rejection'
  - malformed-ciphertext class, six frozen levels
  - 'arm: toy KEM or random-function null'
  - toy dimension n in {16, 32, 64}
  - seed family, three levels
  metrics:
    primary:
    - per-class rejection signature triple
    - middle-regime fraction with bootstrap confidence interval
    - re-query determinism rate
    - secret-dependence rate under pinned z
    - middle-regime fraction as a function of toy dimension
    secondary:
    - observed key-collision rate under equality comparison
    - per-seed-family middle-regime fraction before pooling
    - honest-class agreement rate between the two decapsulators
    - wall-clock per arm and per dimension
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The middle-regime fraction on the KEM arm, its contrast with the same fraction on the
      random-function null arm, and its movement across the three toy dimensions.
    formula: 'Predicted before the run: middle-regime fraction on the KEM arm at least 0.15, defined
      as the number of frozen classes whose signature triple differs between the two decapsulators
      divided by six; middle-regime fraction on the null arm at most 0.02 by the same definition;
      re-query determinism rate exactly 1.000 on the implicit KEM arm; absolute change in the middle-regime
      fraction between n = 16 and n = 64 at least 0.01, with a change below that recorded as a controlled
      null under inventor-protocol section 3.'
    source: Pre-registered in the parent proposal IDEA-20260816-adf2a2 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at n in {16, 32, 64}, nbar = 4, q = 2^12, which is three orders of magnitude
      below Frodo-640 in dimension. TRANSFER ASSUMPTION, stated rather than assumed: the two rejection
      modes are generic FO constructions whose functional difference does not depend on the underlying
      PKE''s dimension, so the SIGNATURE STRUCTURE is expected to transfer while every FREQUENCY is
      not, because class reachability and honest-failure rates both depend strongly on dimension.
      Consequently the per-class signature table is the transferable part and the middle-regime fraction
      is explicitly not, and no number from this run may be quoted at Frodo parameters.'
    correspondence: null
  tail_checks:
  - Report the observed key-collision rate under equality comparison and confirm it is far below the
    smallest measured fraction, since a collision would be scored as a false agreement.
  - Report the honest-class decryption-failure rate at each toy dimension, since a dimension where
    honest failures are common merges classes and invalidates the partition.
  - Report the per-seed-family fractions and their spread before pooling, not only the pooled value.
  - Report the smallest per-class sample count actually reached after any generator rejection, since
    a class that produces few valid ciphertexts silently dominates the interval.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report if the honest-class gate fails at any dimension.
  - Halt and report if re-query determinism is below 1.0 on the implicit arm, since that indicates
    a rig defect that must be repaired before any measurement is meaningful.
  - Cap total wall clock at two CPU-hours; a cap hit is an infrastructure outcome and is never reported
    as negative mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The honest-class and null-arm gates pass, the middle-regime fraction on the KEM
    arm exceeds the pre-registered threshold with a bootstrap interval excluding the null arm's value,
    re-query determinism is exactly 1.0 on the implicit arm, and the fraction moves across the dimension
    sweep by at least the pre-registered amount.
  falsification_criterion:
  - The random-function null arm shows a class-dependent signature pattern comparable to the KEM arm.
  - The middle-regime fraction is zero at all three dimensions, which is a clean measured obstruction
    and is reported as such.
  - Re-query determinism on the implicit arm is below 1.0.
  - The fraction is constant to three decimal places across the three dimensions, which is recorded
    as a controlled null.
  - Between-seed-family spread exceeds the bootstrap interval.
  - The honest-class control shows a nontrivial signature at any dimension.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-adf2a2
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The rig's treatment of z on the failure path is a specification choice that a Coordinator must
    fix explicitly before approval, because it directly determines the secret-dependence metric and
    must not be settled inside the implementation.
  - The six-class enumeration is proposed, not justified; a Coordinator should either accept it as
    frozen or replace it, but it cannot be extended after results are seen.
  - Whether a later stage binds this toy rig to the filed FrodoKEM specification is out of scope here
    and depends on RQ-FRODO-a2dbe2 constraint 1 being discharged; the sequencing decision belongs
    to the Coordinator.
