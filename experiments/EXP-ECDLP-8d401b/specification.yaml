# EXP-ECDLP-8d401b
# Division-gap arithmetic. No formula is expanded.
# Approved by DEC-20261003-b04907.
experiment:
  id: EXP-ECDLP-8d401b
  hypothesis_id: H-ECDLP-4bea65
  source_idea: IDEA-20261003-e21249
  question_id: RQ-ECDLP-002
  version: 1
  title: One division versus zero
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-b04907
  objective: >-
    Check the gap 1, the sum 1, and the product 0.
  inputs:
    affine_div: 1
    proj_div: 0
    division_gap: 1
    division_sum: 1
    division_prod: 0
  controls:
    - >-
      The affine chart has 1 division and the projective chart has
      0. One exceeds zero by 1. Reporting both charts as having 1
      division drops the gap and invalidates the run.
    - >-
      The two counts sum to 1. Their product is 0.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, sum, product}
    - route in {subtract, multiply}
  metrics:
    primary:
      - division_gap
      - division_sum
      - division_prod
      - implementations_agree
    secondary:
      - affine_div
      - proj_div
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      One exceeds zero by 1. The two counts sum to 1. Their product
      is 0.
    formula: >-
      Subtract 0 from 1. Add 1 and 0. Multiply 1 by 0.
    source: >-
      IDEA-20261003-e21249 states one affine division and zero
      projective divisions, read 2026-10-03. The multiplication
      counts are not named as integers. The gap was recomputed in
      this design session. That computation is not a run. No
      formula was expanded.
  scale_relevance:
    tier: toy
    justification: Two written division counts. No transfer to an exponent.
    correspondence: null
  tail_checks:
    - The sum 1 and the product 0 are required. A check that stops at the gap 1 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 1 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The gap is not 1.
    - The sum is not 1.
    - The product is not 0.
    - Both charts are reported with 1 division, or a formula is expanded.
  success_criterion: >-
    Both runs agree that one exceeds zero by 1, that the two counts
    sum to 1, and that their product is 0.
  falsification_criterion: >-
    The runs agree that the division gap is computed, and that gap
    is not 1.
  required_artifacts:
    - experiments/EXP-ECDLP-8d401b/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-8d401b/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-8d401b/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-8d401b/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-8d401b/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-8d401b/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any formula expansion or multiplication count.
    - Any claim that a gap of 1 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
