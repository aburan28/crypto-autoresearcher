protocol_amendment:
  experiment_id: EXP-SCURVE-29040c
  version_from: 1
  version_to: 2
  approved_at: '2026-10-06'
  reason: >-
    Independent protocol review found that version 1 names the negation-BSGS
    table size and stride but does not bind the shifted block centers. An
    unshifted giant walk with the stated 5,800,018 positions is not exhaustive
    and can miss 3,710,073 admissible residual values.
  changes:
    - >-
      For each orientation s, let W_s=1+floor((n-1-r_s)/M),
      m=5,800,019, stride=2m-1=11,600,037, and
      g_s=ceil(W_s/stride). Store finite babies [j]H for 1<=j<=m-1;
      handle j=0/Infinity separately. The maximum is 5,800,018 finite entries.
    - >-
      Giant index i ranges over 0<=i<g_s with shifted center
      c_i=(m-1)+i*stride. Probe D_{s,i}=T_s-[c_i]H. An x-table match at baby
      index j yields both integer candidates k=c_i-j and k=c_i+j. Range-check
      0<=k<W_s, then check d=r_s+kM is in [1,n-1] and replay [d]G=Q.
    - >-
      Interleave the two orientation walks by increasing i without changing
      either orientation's centers. Stop only after an exact candidate replay;
      a fingerprint or x match alone is never acceptance.
    - >-
      For the maximal width qmax=67,280,421,310,721, g=5,800,018. The first
      block covers k=0 through 11,600,036. The final center is
      67,280,417,600,647 and its right edge exceeds W-1 by 2,089,945, which is
      why the final-block integer range check is mandatory.
    - >-
      Add bsgs-cover-certificate.json. For both orientations it records W_s,
      m, stride, g_s, center formula identifier shifted-negation-v2, first and
      last center, union interval before clipping, clipped final interval,
      matched (i,j,sign,k), fingerprint-verification result, scalar bounds, and
      final [d]G=Q replay.
  affected_runs:
    - RUN-SCURVE-af5caf
  confirmatory_status: preserved
  approved_by: coordinator
  interpretation: >-
    This is a correctness-completeness clarification fixed before execution.
    It changes no seed, oracle, residue modulus, width, table size, success
    criterion, claim ceiling, or scientific prediction. Version 2 is the
    effective protocol for RUN-SCURVE-af5caf.
