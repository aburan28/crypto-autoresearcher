experiment:
  id: EXP-ECDLP-4ce0a2
  hypothesis_id: H-ECDLP-a63008
  proposal_id: IDEA-20260921-3ecbe8
  source_idea_ids: [IDEA-20260921-3ecbe8]
  question_id: RQ-CRYPTO-001
  goal_id: GOAL-CRYPTO-001
  version: 1
  title: >-
    Cross-ratio family (level, anchor-constancy) profile: the
    quadratic-character-in-cross-ratio statistic on the census's primary
    ladder, with a frozen five-triple anchor sweep, the R08 boundary
    control, the Moebius-equivalence check, and the census control
    battery.
  status: approved
  assigned_to: executor
  approved_by: coordinator
  approval_decision: DEC-20260921-b22088
  approval_basis: >-
    AGENTS.md standing user authorization of 2026-09-06; Coordinator
    protocol-completeness check passed (rows, ladder, sweep, controls,
    seeds, stopping/invalidation rules, verdict vocabulary, artifacts,
    write scope all frozen and non-null). Budget advisory; 8 GiB memory
    ceiling is machine protection only.
  recorded_at: '2026-09-21'
  inference:
    requested_policy: executor-implementation
    runtime: null
    resolved_model_id: null
    model_verified: false
    reasoning_effort: null
    fallback_used: false
    degraded_requirements: []
    session_identity: null
    provenance_note: >-
      Designed and executed in the top-level coordinator session under
      the respective role contracts (role-runtime outage, AWS
      DescribeInstances AuthFailure, recorded in DEC-20260921-4d1b40).
  scale_relevance:
    tier: toy
    justification: >-
      The census's primary ladder verbatim; exact computation; readings
      feed necessary-condition gates only.
    correspondence: null

  rows:
    - id: CR
      construction: >-
        v = 1_A/|A|, A = {x in F_p : chi(cr(x; a0, b0, c0)) = +1},
        cr(x; a, b, c) = ((x-a)(b-c))/((x-c)(b-a)), anchors (a0, b0, c0)
        the first triple from the frozen stream
        SHA256(EXP-ECDLP-4ce0a2:anchors:0:<counter>) (distinct, nonzero,
        resampled on collision, mod p); the anchors and the pole x = c
        are assigned to A's complement (frozen choice, recorded);
        chi the quadratic character via the exact squares-set scatter.
    - id: CR2
      construction: as CR with the second frozen anchor triple.
    - id: CR3
      construction: as CR with the third frozen anchor triple.
    - id: CR4
      construction: as CR with the fourth frozen anchor triple.
    - id: CR5
      construction: as CR with the fifth frozen anchor triple.
    - id: CRM
      construction: >-
        The default-triple statistic composed with the frozen-hash
        Moebius map (stream SHA256(EXP-ECDLP-4ce0a2:C03:moebius:CR:
        <counter>)); must equal the corresponding swept triple's set up
        to permutation when the map sends the default anchors to a swept
        triple's anchors -- the equivalence check compares CRM's l1*
        against CR-sweep cells for exact agreement where the induced
        triple coincides, and otherwise records the value as another
        family member.
    - id: R08
      construction: >-
        The census's QR row verbatim (boundary object: flat and stable;
        the candidate must beat its level by more than 2SE to count as
        structured).
    - id: C01
      construction: v = 1/p everywhere; lambda reads 0 exactly.
    - id: C02A
      construction: >-
        random-set control, seed set A (stream
        SHA256(EXP-ECDLP-4ce0a2:C02:sign:A:<block>)); level 0.5.
    - id: C02B
      construction: as C02A with seed set B.

  ladder:
    note: >-
      The census's frozen primary ladder VERBATIM (same ten primes) for
      comparability with the census rows and controls.
    primes: [4099, 8209, 16411, 32771, 65537, 185369, 524309, 1482919, 4194319, 16777259]

  controls:
    - C01 exact numerical zero.
    - C02A/C02B within the Parseval band 0.5 +- (2SE + 0.02) with seed
      agreement within 2SE.
    - vhat(0) = 1 within 1e-9 for every ok cell.
    - R08 boundary control at matched primes (must reproduce the
      census's flat level within 2SE).
    - The anchor-sweep equivalence check (CRM vs the coinciding swept
      triple, exact agreement to 1e-9 relative).
    - >-
        Checker battery: naive O(p^2) DFT spot at the smallest prime and a
        second independently structured chirp-z at a mid prime, agreement
        1e-9.

  independent_variables:
    - anchor triple (default + frozen sweep of four)
    - Moebius composition (CRM)
    - prime (frozen ladder)

  primary_metrics:
    - fitted lambda per row with SE, jackknife.
    - level difference delta = lambda(CR) - lambda(C02A) and
      lambda(CR) - lambda(R08) with combined SE (convention-free).
    - >-
        anchor spread: max pairwise |lambda(CRi) - lambda(CRj)| across the
        sweep with combined SE.
    - the CRM equivalence reading.

  verdict_vocabulary:
    - >-
        stable_above_random: anchor spread within 2SE AND both level
        differences above 2SE (the positive candidate; replicate before
        any use)
    - >-
        stable_flat: anchor spread within 2SE AND at least one level
        difference within 2SE
    - >-
        family_level_varying: anchor spread beyond 2SE (the idea is
        withdrawn in a superseding record)
    - "unresolved: guard failures or missing cells"
    - "void_control_failure: any control failure voids the run"

  stopping_rules:
    - First failed control halts dependent reads and marks the run void
      with the defective control named.
    - Memory above 8 GiB checkpoints the cell resource_exhaustion with a
      continuation pointer (machine protection only).
    - No row, prime, anchor triple, seed, or rule change after any cell
      outcome.

  invalidation_rules:
    - Composite-length surrogate DFT or a non-canonical normalisation.
    - Anchor collisions silently ignored instead of resampled.
    - A level comparison made across different ladders or against
      re-derived controls instead of the run's own C02A/R08 cells.
    - The CRM equivalence failure silently absorbed instead of recorded.

  success_criterion: >-
    The single frozen run completes all cells (10 rows x 10 primes),
    all controls pass (including the R08 boundary reproduction and the
    CRM equivalence where the induced triple coincides), the checker
    spot re-derivations agree to 1e-9, and the family carries one of the
    frozen verdicts with the level differences and the anchor spread on
    record.

  falsification_criterion: >-
    Any control failure voids the run (infrastructure, never
    mathematical evidence). Anchor spread beyond 2SE is outcome (c) and
    withdraws the idea. Constancy with a flat level is outcome (b) and
    scopes the cross-ratio lane out for set statistics with the
    Kloosterman-cancellation reading recorded as the obstruction.
    Constancy above the random level is the positive outcome and
    triggers replicate, not support.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_runs: 1
    maximum_workers: 4

  required_artifacts:
    - experiments/EXP-ECDLP-4ce0a2/runs/RUN-ECDLP-4dfb36/cr_driver.py
    - experiments/EXP-ECDLP-4ce0a2/runs/RUN-ECDLP-4dfb36/cr_checker.py
    - experiments/EXP-ECDLP-4ce0a2/runs/RUN-ECDLP-4dfb36/manifest.yaml
    - experiments/EXP-ECDLP-4ce0a2/runs/RUN-ECDLP-4dfb36/cr_registry.json
    - experiments/EXP-ECDLP-4ce0a2/runs/RUN-ECDLP-4dfb36/cr_fits.json
    - experiments/EXP-ECDLP-4ce0a2/runs/RUN-ECDLP-4dfb36/cr_report.md
    - experiments/EXP-ECDLP-4ce0a2/runs/RUN-ECDLP-4dfb36/command.txt
    - experiments/EXP-ECDLP-4ce0a2/runs/RUN-ECDLP-4dfb36/environment.json
    - experiments/EXP-ECDLP-4ce0a2/runs/RUN-ECDLP-4dfb36/stdout.log
    - experiments/EXP-ECDLP-4ce0a2/runs/RUN-ECDLP-4dfb36/stderr.log
    - experiments/EXP-ECDLP-4ce0a2/runs/RUN-ECDLP-4dfb36/raw-result.json

  write_scope:
