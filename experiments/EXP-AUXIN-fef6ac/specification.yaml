# =============================================================================
# EXP-AUXIN-fef6ac -- VERSION 1 (APPROVED by DEC-20261004-927012) frozen
# contract for H-AUXIN-9d9ee0: exact r±1 Cheon-shape split on
# y^2=x^3+x+1 over F_10007. Source: IDEA-20261005-447d82 under
# RQ-AUXIN-f8d8c0. Compact BINSTD-style measurement. Not an AUXIN walk
# successor of EXP-AUXIN-339fb0.
#
# ZERO RUNS in this design packet. Stages 0-1 authorized for executor
# TASK-20261004-f88f65. No Magma/Sage. No Cheon execution. No auxiliary
# points. Amazon Bedrock prohibited. NO break. NO attack. NO exponent.
# certificate.kind=none. Do not edit GOAL-AUXIN-a93442.yaml or
# GOAL-ECDLP2M-001.yaml.
# =============================================================================
experiment:
  id: EXP-AUXIN-fef6ac
  hypothesis_id: H-AUXIN-9d9ee0
  question_id: RQ-AUXIN-f8d8c0
  source_idea: IDEA-20261005-447d82
  goal_id: null
  goal_ids: []
  goal_ids_note: >-
    RQ-AUXIN-f8d8c0 names GOAL-AUXIN-a93442. This design does not edit that
    head and does not edit GOAL-ECDLP2M-001.yaml.
  prior_experiment: null
  version: 1
  title: >-
    Exact r-1 and r+1 Cheon divisor split on y^2=x^3+x+1 over F_10007
  status: approved
  approved_by: DEC-20261004-927012
  approved_at: '2026-10-04'
  frozen: true
  frozen_at: '2026-10-04'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261004-927012 under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage. No Cheon algorithm
    execution. No auxiliary-point ingest. No Bedrock. No ECDLP solve.
    No transfer to deployed curves. certificate.kind=none.
  approval:
    approved_by: DEC-20261004-927012
    composing_decision: DEC-20261004-927012
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes the curve pin, closed forms, thresholds, dual methods,
      r_null obstruction, and d=2 null before any point count. Stage 1
      counts #E, factors, and writes RESULTS.md with exactly one O-* label.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide, on this one toy curve, whether the two KN-LIT-90e34c Cheon
    closed forms at the exact maximal admissible divisors of r-1 and r+1
    separate by a factor of at least 2, against a d=2 formula null that
    must stay below 1.25. Emit exactly one O-* label from H-AUXIN-9d9ee0.

  class: measurement
  class_note: >-
    Exact integer / closed-form ratio measurement. Not an exponent-moving
    breakthrough; Cheon's algorithm is not run; no protocol-supply audit.

  scope:
    included:
      - >-
        Stage 0. Freeze curve pin (p=10007, a=1, b=1), Cheon closed forms
        with omitted common log factor, thresholds, dual point-count and
        dual factorization methods, r_null consecutive-integer obstruction,
        and d=2 nearby-object control. Write preregistered-predictions.json
        (decision rules only; numeric ratio NOT preregistered).
      - >-
        Stage 1. Count #E(F_10007) by Jacobi and Euler-criterion routes;
        factor N; set r to the largest prime factor; factor r-1 and r+1 by
        trial-up and Pollard-rho routes; compute d_minus, d_plus, B_minus,
        B_plus, B_rho, pinned_ratio, d2_ratio; record N±1 admissible
        divisors as a non-metric control; write RESULTS.md with exactly
        one O-* label.
    excluded:
      - Running Cheon's algorithm or any walk on E.
      - Ingesting or assuming auxiliary points [alpha^d]P.
      - Ordinary ECDLP improvement claims (DEC-20260802-204 gate stands).
      - Transfer to NIST P-256, secp256k1, Curve25519, BN254, BLS12-381.
      - Magma / Sage / cypari2 / AUXIN walks / Bedrock as success path.
      - Editing IDEA-20261005-447d82 claim text.
      - Editing GOAL-AUXIN-a93442.yaml or GOAL-ECDLP2M-001.yaml.
      - Treating infra failure as mathematical evidence.
      - Treating the empty r_null search as a Cheon-split observation.

  execution_surface:
    trial_plan: experiments/EXP-AUXIN-fef6ac/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-AUXIN-fef6ac/implementation/run.py --stage 0
      --trial-plan experiments/EXP-AUXIN-fef6ac/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-AUXIN-fef6ac/implementation/run.py --stage 1
      --trial-plan experiments/EXP-AUXIN-fef6ac/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. implementation/run.py +
      check.py are the hash-bound sources. {run_dir} is substituted by the
      process supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261005-447d82.yaml
    hypothesis: ledger/hypotheses/H-AUXIN-9d9ee0.yaml
    literature: knowledge/literature/KN-LIT-90e34c.md
    question: ledger/questions/RQ-AUXIN-f8d8c0.yaml
    certificate_kind: none
    curve:
      p: 10007
      a: 1
      b: 1
      equation: y^2 = x^3 + x + 1

  controls:
    - name: ctl_freeze_before_census
      definition: Stage-0 freeze exists before any Stage-1 point count.
    - name: ctl_twin_point_count
      definition: Jacobi symbol and Euler criterion must agree on #E(F_p).
    - name: ctl_twin_factor
      definition: Trial-up and Pollard-rho factorizations must agree; products reconstruct.
    - name: ctl_d2_null
      definition: Evaluate both closed forms at d=2; ratio must be < 1.25 else O-ARTIFACT.
    - name: ctl_wrong_integer
      definition: Record largest admissible divisors of N±1; they are not the metric.
    - name: ctl_r_null_obstruction
      definition: >-
        The idea's r_null (prime > 2^16 with both (r±1)/2 prime) is frozen as
        IMPOSSIBLE_CONSECUTIVE. Do not search for a substitute prime and call
        it the idea's r_null.
    - name: ctl_no_cheon_run
      definition: Zero group operations of Cheon's algorithm; closed forms only.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_census]
    - name: branch
      levels: [r_minus_1, r_plus_1, d2_null]

  metrics:
    primary:
      - name: pinned_ratio
        unit: dimensionless
        definition: max(B_minus,B_plus)/min(B_minus,B_plus) at exact d_minus, d_plus
      - name: d2_ratio
        unit: dimensionless
        definition: same ratio with d_minus=d_plus=2
      - name: reconstruction_ok
        unit: boolean
        definition: Twin point-count and twin factorizations agree and reconstruct
    secondary:
      - name: N
        unit: count
      - name: r
        unit: integer
      - name: cofactor
        unit: integer
      - name: d_minus
        unit: integer
      - name: d_plus
        unit: integer
      - name: B_minus
        unit: group-op-shape
      - name: B_plus
        unit: group-op-shape
      - name: B_rho
        unit: group-op-shape
      - name: wall_clock_seconds
        unit: seconds

  heuristic_under_test: H1

  preregistered_prediction:
    quantity: >-
      Decision rules only. The numeric pinned_ratio is the measurement and
      is not preregistered. O-SPLIT iff pinned_ratio>=2 and d2_ratio<1.25
      and r>=16 and reconstruction_ok. O-NO-SPLIT iff pinned_ratio<2 with
      the same guards. O-ARTIFACT iff d2_ratio>=1.25.
    formula: >-
      B_minus=sqrt(r/d_minus)+sqrt(d_minus);
      B_plus=sqrt(r/d_plus)+d_plus;
      B_rho=sqrt(r);
      pinned_ratio=max(B_minus,B_plus)/min(B_minus,B_plus).
      d_minus = max { d | (r-1) : 2 <= d <= floor(sqrt(r)) };
      d_plus analogously for r+1.
    source: >-
      ledger/proposals/IDEA-20261005-447d82.yaml; KN-LIT-90e34c closed
      forms with common log factor omitted. Frozen in
      stage0/preregistered-predictions.json before Stage 1.

  scale_relevance:
    tier: toy_exact_integer
    justification: >-
      p=10007 is a toy field. Hasse-range integers are < 20 bits. Exact
      factorization terminates. No transfer to cryptographic orders.
    correspondence: null

  tail_checks:
    - reconstruction_ok must be true or the run is O-MISMATCH.
    - Metric must use r±1; N±1 is recorded and is not the metric.
    - d2_ratio >= 1.25 is O-ARTIFACT, not O-SPLIT.

  seeds_and_replication:
    seeds: []
    independent_instances: 2
    note: >-
      Deterministic exact arithmetic. Twin point-count routes and twin
      factorization routes are the replication instrument. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 1
    maximum_runs: 3
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and protocol-freeze.json.
    - Stage 1 complete with census.json, control-table.json, RESULTS.md, OR named O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-AUXIN-9d9ee0.
    - maximum_runs = 3.
    - Do not run Cheon's algorithm under this card.

  invalidation_rules:
    - Editing closed forms or thresholds after Stage-0 freeze → protocol invalid.
    - Using N±1 as the metric → O-WRONG-INTEGER.
    - Magma/Sage/Bedrock/Cheon-walk used as success path → protocol invalid.
    - Twin disagreement → O-MISMATCH.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming break / exponent / deployed-curve transfer → protocol invalid.
    - Inventing an r_null prime and presenting it as the idea's construction → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen before any point count; Stage 1 produces N, r,
    twin-agreed factorizations, pinned_ratio, d2_ratio, and RESULTS.md with
    exactly one O-* label from H-AUXIN-9d9ee0 with cited artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; N±1 substitution; post-hoc formula edit;
    a claimed break/exponent/deployed transfer; d2_ratio>=1.25 reported as
    O-SPLIT.

  required_artifacts:
    - experiments/EXP-AUXIN-fef6ac/trial-plan-v1.json
    - experiments/EXP-AUXIN-fef6ac/stage0/preregistered-predictions.json
    - experiments/EXP-AUXIN-fef6ac/stage0/protocol-freeze.json
    - experiments/EXP-AUXIN-fef6ac/stage0/worksheet-note.md
    - experiments/EXP-AUXIN-fef6ac/stage1/census.json
    - experiments/EXP-AUXIN-fef6ac/stage1/control-table.json
    - experiments/EXP-AUXIN-fef6ac/stage1/r-null-obstruction.md
    - experiments/EXP-AUXIN-fef6ac/RESULTS.md
    - experiments/EXP-AUXIN-fef6ac/runs/<RUN-AUXIN-*>/
    - experiments/EXP-AUXIN-fef6ac/implementation/run.py
    - experiments/EXP-AUXIN-fef6ac/implementation/check.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
