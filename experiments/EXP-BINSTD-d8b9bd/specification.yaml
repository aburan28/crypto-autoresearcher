# EXP-BINSTD-d8b9bd
# Large-prime integer identities. No oracle.
# Approved by DEC-20261002-cb46f0.
experiment:
  id: EXP-BINSTD-d8b9bd
  hypothesis_id: H-BINSTD-30fd7b
  source_idea: IDEA-20261001-621974
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Large-prime integer identities
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-cb46f0
  objective: >-
    Check the coefficient 4192, the group-order logarithm, the
    power 2^131/131, the written block sums, and the quotient
    1133/1686.
  inputs:
    coefficient: 4192
    order: 2722258935367507707729280517973639940516
    order_above_2_131: true
    order_excess: 22283658519494248868
    log_above_low: true
    log_below_high: true
    log_equal_131: false
    power_below_12397: true
    power_above_12396: true
    block_m3: 13199
    block_m4: 13300
    budget_gap: 1133
    quotient_above_672: true
    quotient_below_673: true
    half_log_above_792: true
    half_log_below_7925: true
    written_gap_above_half_log: true
    scale_sqrt: 2
    scale_reciprocal: 4
  controls:
    - >-
      A block sum of 132.00 is one hundredth above the written
      tenths. Those tenths add to 13199. Reporting 13200
      invalidates the run.
    - >-
      A power 2^131/131 of at least 2^123.97 is false. The power
      is strictly below 2^123.97 and strictly above 2^123.96.
      Reporting otherwise invalidates the run.
    - >-
      An equality of the group-order logarithm with 131 is false.
      The order is strictly above 2^131, and the logarithm still
      rounds to 131.0000 at four decimals. Reporting equality
      invalidates the run.
    - >-
      The quotient 1133/1686 at most 0.672 is false. The
      cross-product excess over 0.672 is 8, and the quotient is
      strictly below 0.673. Reporting otherwise invalidates the
      run.
    - >-
      A half-log of 3 at least 0.80 is false. It is strictly
      above 0.792 and strictly below 0.7925. Reporting it at
      least 0.80 invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - comparison
    - route in {powers, cross_multiply}
  metrics:
    primary:
      - block_m3
      - power_sides
      - coefficient
      - implementations_agree
    secondary:
      - quotient_sides
      - order_excess
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The block sum 13199 and the two sides of 2^131/131.
    formula: >-
      The coefficient is 32 times 131. The order excess is the
      order minus 2^131. The four-decimal window is the comparison
      of the order to the power 20000 against 2 to the
      2620000 plus or minus 1. The power 2^131/131 is compared
      with 2^123.97 through 131 against 2^7.03. The block sums add
      the written hundredths. The quotient cross-multiplies
      1133/1686 with 672/1000.
    source: >-
      IDEA-20261001-621974 states the large-prime arithmetic,
      including a block total of 132.0 and a coefficient
      2^123.97, read 2026-10-02. The comparisons were made in
      this design session. Those comparisons are not a run. The
      written tenths add to 131.99. No oracle was run.
  scale_relevance:
    tier: toy
    justification: Integer comparisons only. No transfer to an oracle cost.
    correspondence: null
  tail_checks:
    - The m = 4 block sum is required. Stopping after the m = 3 sum and still reporting 13300 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the m = 3 block sum is reported as 13200, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The m = 3 block sum is reported as 13200.
    - 2^131/131 is reported at least 2^123.97 or at most 2^123.96.
    - The group-order logarithm is reported equal to 131.
    - The quotient is reported at most 0.672 or at least 0.673.
    - Half of log2(3) is reported at least 0.80.
    - An oracle cost or a large-prime search is reported.
  success_criterion: >-
    Both runs agree on the coefficient 4192, the order excess
    22283658519494248868, the four-decimal window, the power sides
    below 123.97 and above 123.96, the block sums 13199 and 13300,
    the quotient sides, and the half-log sides. The m = 3 block
    sum stays 13199. The power stays strictly below 2^123.97.
  falsification_criterion: >-
    The runs agree, the block sum stays 13199, the power stays
    below 2^123.97, and any comparison differs from the
    preregistered table.
  required_artifacts:
    - experiments/EXP-BINSTD-d8b9bd/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-d8b9bd/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-d8b9bd/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-d8b9bd/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-d8b9bd/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-d8b9bd/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any oracle, graph, or large-prime search.
    - A claim that a large-prime row helps or does not help.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
