experiment:
  id: EXP-PROP-ba2e44
  hypothesis_id: H-PROP-c95932
  derived_from_idea: IDEA-20260815-14872b
  question_id: RQ-PROP-24458b
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Auxiliary-state size bound by complete enumeration at N <= 23, plus a
    two-dimensional state-size against propagation-probability frontier with a
    curve-free Z/N control, a composite-order control where the bound must
    fail, and a blocking planted-positive recovery check

  objective: >-
    THE ONE UNCERTAINTY A RUN REDUCES -- whether a bounded auxiliary register
    can buy anything, in either the exact or the probabilistic regime, on
    prime-order groups. A run establishes, at toy scale -- (i) by COMPLETE
    enumeration over N in {11, 13, 17, 23} with |S|, |A| in {2, 3, 4} and
    |S| * |A| < N, whether any non-constant exactly propagating pair violates
    the bound |S| * |A| >= N, separately for point-function, pair-dependent
    and partial auxiliary state; (ii) whether elliptic nets at toy scale
    satisfy the bound, which is the cheapest available refutation route;
    (iii) the achieved frontier q_maj(|A|, s) over curve-derived pairs against
    two matched nulls and a curve-free Z/N control on the same axes;
    (iv) whether the search that produces (iii) can recover a planted optimum,
    which decides whether any negative from it is admissible at all; and
    (v) whether the |A| = 1 edge reproduces the sibling record
    IDEA-20260815-f558e4's frozen fixture exactly. No attack, no exponent, no
    cost claim, and no statement about cryptographic N follows from any
    outcome.

  what_this_is_not:
    - >-
      Not an attack, an algorithm, a distinguisher, or a cryptanalytic result.
      No exponent moves and Pollard rho remains the incumbent baseline
      untouched.
    - >-
      Not a claim about cryptographic-size groups. Everything here is at
      N <= a few hundred and licenses no extrapolation.
    - >-
      Not a test of the parent proposal's analogy between the open cell and
      differential cryptanalysis. That analogy is named in
      IDEA-20260815-14872b and is tested nowhere in this contract.
    - >-
      Not a status change to IDEA-20260807-df906f's rigidity theorem, to
      IDEA-20260815-f558e4, to KN-TECH-009 or to KN-OPEN-019.
    - >-
      Not approval, freezing, execution authorization, a run, an observed
      output, or evidence. approved_by is null.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE -- "over the complete enumeration at
      N in {11,13,17,23} with |S|,|A| in {2,3,4}, [this many] counterexamples
      to the state-size bound were found for point-function state and [this
      many] for the pair-dependent and partial variants; and within the tested
      budgets, statistic families, prime orders and search effort, the achieved
      frontier is [these numbers] against [these nulls] and [this] curve-free
      control." WHAT DOES NOT FOLLOW -- the open cell is NOT shown empty in
      general; a bounded search that finds nothing is a statement about the
      search. No claim about cryptographic N, no attack, no exponent, and no
      closure of any escape beyond the exact half of E2 at the tested scope.

  inputs:
    procedure: >-
      STAGE 0 (zero compute) -- re-derive the rigidity theorem from
      IDEA-20260807-df906f's own committed statement, write out the three
      degenerate cases (constant, pair-dependent, partial), and freeze the
      definitions of "propagates exactly", "propagates with probability q" and
      "auxiliary state" in writing. Hash the pre-registration. NO STAGE 3 RUN
      MAY BEGIN BEFORE THIS TEXT IS FROZEN, because the primary overclaim risk
      of this line is definitional drift.
      STAGE 1 (minutes) -- COMPLETE enumeration over all labelings of G of
      order N in {11,13,17,23} into S x A with |S|, |A| in {2,3,4} and
      |S| * |A| < N, testing exact propagation on all N^2 pairs in exact
      integer arithmetic. Run the point-function, pair-dependent and partial
      variants as three separate arms with separately reported results. Record
      every counterexample and every near miss (propagating on more than 99
      percent of pairs).
      STAGE 2 (minutes) -- the elliptic-net consistency check -- construct a
      net on at least two toy curves, state its actual carried state size, and
      compare against N / |S|.
      STAGE 3 (hours) -- the frontier. On prime-order subgroups of at least 6
      toy curves spanning a 6x range of N, for |A| in {1,2,4,8,16,32} and
      s in {2,...,8}, search for (v,a) maximising the majority propagation
      probability q_maj, by local optimisation over labelings with 200 random
      restarts per cell plus structured starts (coordinate buckets, division-
      polynomial characters, isogeny-kernel labels). Run the IDENTICAL
      optimiser on Z/N with no curve, and on a composite-order group of matched
      size. Run the planted-positive control at every cell.
      STAGE 4 (zero compute) -- plot the achieved frontier against the exact-
      regime bound and the zero-state ceiling, report every cell with its
      empirical null distribution, its curve-free counterpart and its search
      effort, and check the structural tell (decay of any excess with N).
    instrument: >-
      Python 3.11 with numpy; NO Sage and NO sympy (recorded absent in prior
      lane records; their absence must be re-checked and recorded at run time).
      Exact propagation is decided in exact integer arithmetic over all N^2
      pairs. q_maj is computed as an exact rational from counts, never
      estimated by sampling. Toy elliptic curves are constructed by direct
      point enumeration over small prime fields, and the prime-order subgroup
      is extracted by exact order computation. Local search is deterministic
      given its seed. Recorded through harness/runner.py.
    parameters: >-
      Exhaustive arm -- N in {11, 13, 17, 23}; |S| and |A| in {2, 3, 4}
      restricted to |S| * |A| < N; three state variants (point-function,
      pair-dependent, partial). Frontier arm -- at least 6 prime orders
      spanning a 6x range, drawn from prime-order subgroups of toy curves over
      prime fields of at most 16 bits; |A| in {1, 2, 4, 8, 16, 32};
      s in {2,...,8}; 200 random restarts and at least 3 structured starts per
      cell; 200 random (v,a) null samples per cell. Composite-order control at
      matched size. Elliptic nets on at least 2 toy curves. The |A| = 1,
      s = 3, N = 23 interval-partition fixture from IDEA-20260815-f558e4.
  controls:
    - >-
      NULL 1 -- RANDOM (v,a) at matched (|S|, |A|), at least 200 samples per
      cell. Any achieved q_maj is compared against this EMPIRICAL distribution,
      never against the analytic 1/s, because at toy N the null's own
      fluctuation exceeds any plausible real excess.
    - >-
      NULL 2 -- RANDOM-FUNCTION statistic via a seeded PRF on the point
      encoding -- efficiently computable and curve-blind, separating cheapness
      from structure.
    - >-
      NULL 3 -- COMPOSITE-ORDER control at matched size, where the state-size
      bound MUST FAIL because the rigidity theorem needs prime order. A
      pipeline reporting the same bound there is measuring the wrong thing and
      every bound result from it is void.
    - >-
      PLANTED POSITIVE, BLOCKING -- a pair built from the DL coordinate
      directly (v = high bits, a = next bits), which must saturate propagation
      and which the search MUST recover at every (|A|, s). If local search
      cannot recover a planted optimum, Stage 3's negatives mean nothing and
      the cell is reported UNTESTED rather than empty.
    - >-
      CURVE-FREE NEARBY-OBJECT CONTROL, MANDATORY -- Z/N with no curve at all,
      identical pipeline, reported on the same axes as every frontier point.
    - >-
      BASELINE FIXTURE, gating -- the |A| = 1 edge must reproduce
      IDEA-20260815-f558e4's committed q_maj at N = 23, s = 3, interval
      partition, in exact rational arithmetic.
    - >-
      STRUCTURAL TELL, per docs/inventor-protocol.md section 3 -- any achieved
      q_maj excess must DECAY as N grows at fixed (|S|, |A|). A flat excess is
      an artifact.

  independent_variables:
    - prime order N
    - "statistic size s = |S|"
    - "auxiliary state budget |A|"
    - "state variant (point-function / pair-dependent / partial)"
    - "object class (curve-derived / curve-free Z/N / composite order / random null / PRF null / planted positive)"
    - propagation regime (exact / probabilistic)

  metrics:
    primary:
      - >-
        E1 exact_propagation_counterexample_count -- the number of
        non-constant pairs (v,a) with |S| * |A| < N propagating exactly on ALL
        N^2 pairs, from the complete enumeration, reported separately for each
        of the three state variants. Unit -- dimensionless count. Predicted 0
        for point-function state.
      - >-
        E3 elliptic_net_state_size versus N / |S| at toy scale. Unit -- number
        of field elements carried, compared against a dimensionless bound.
        Predicted to satisfy the bound with margin.
      - >-
        E4 planted_positive_recovery_rate -- fraction of (|A|, s) cells at
        which local search recovers the planted DL-coordinate optimum, to
        within exact equality of q_maj. Unit -- fraction. Required 1.00.
      - >-
        E5 fixture_agreement at (|A| = 1, s = 3, N = 23, interval partition) --
        exact rational equality with the value committed in
        IDEA-20260815-f558e4, read from that record. Unit -- boolean plus the
        two exact rationals.
      - >-
        E6 curve_versus_curvefree_gap -- the paired per-cell difference
        q_maj_curve minus q_maj_ZmodN over the (|A|, s) grid, with the
        empirical null spread at the same cell and the gap's dependence on N.
        Unit -- probability difference, dimensionless.
      - >-
        E7 composite_order_control_counterexample_count -- the number of
        exactly propagating lossy pairs found at composite N of matched size.
        Unit -- dimensionless count. Required at least 1.
    secondary:
      - >-
        E2 near_miss_count -- pairs propagating on more than 99 percent of
        input pairs at |S| * |A| < N, with each near miss archived
      - achieved q_maj per cell with its exact rational value and its search effort (restarts, evaluations, wall clock)
      - the empirical null distribution per cell (mean, spread, maximum over 200 samples)
      - the PRF-null frontier per cell
      - the exact-regime bound and the zero-state ceiling plotted with the achieved frontier
      - the decay of any excess with N at fixed (|S|, |A|)
      - peak memory and wall clock per stage

  heuristic_under_test: HEUR-AUX-B2
  preregistered_prediction:
    quantity: >-
      E1 = 0 for point-function auxiliary state over the complete enumeration;
      E3 satisfied by elliptic nets; E4 = 1.00; E5 exact; E7 >= 1; and E6's gap
      within the empirical null spread at every cell.
    formula: >-
      E1 := |{(v,a) non-constant, |S| * |A| < N, and there exists F with
      (v,a)(R+R') = F((v,a)(R),(v,a)(R')) for all R,R' in G}| over the complete
      enumeration. E6 := q_maj_curve(|A|, s, N) minus q_maj_ZmodN(|A|, s, N),
      each an exact rational maximum over the searched labelings, compared
      against the empirical spread of NULL 1 at the same cell. Under the NULL
      that the frontier is a fact about sizes, E6 = 0 within null spread at
      every cell. Under the NULL that the auxiliary register buys nothing in
      the exact regime, E1 = 0.
    source: >-
      Pre-registered in IDEA-20260815-14872b (predictions and
      heuristic_assumptions HEUR-AUX-B1, HEUR-AUX-B2) and restated as E1-E7 in
      H-PROP-c95932 before any run under this contract exists. The |A| = 1
      fixture value is attributed by the parent proposal to
      IDEA-20260815-f558e4 and MUST be read from that record at run time; this
      contract does not assert it as a measurement. NO NUMERIC THRESHOLD is
      pre-committed for the frontier's height, deliberately -- any number
      stated here would be invented to be passed.

  scale_relevance:
    tier: toy
    justification: >-
      The exhaustive arm at N <= 23 is chosen so that the exact-regime question
      is DECIDED by complete enumeration rather than estimated -- that is the
      whole point of choosing N small enough to enumerate. The frontier arm
      runs at prime orders spanning a 6x range so that the structural tell
      (decay of any excess with N) is measurable at all; a single N would make
      the tell unmeasurable and the frontier uninterpretable. THE TRANSFER
      ASSUMPTION IS STATED AND UNJUSTIFIED -- that a toy-scale coincidence
      between the curve and curve-free frontiers persists at cryptographic N.
      NOTHING SUPPORTS THAT and it is recorded as an open extrapolation, never
      used, and never cited as evidence.
    correspondence: null

  tail_checks:
    - >-
      Report every near miss (propagation on more than 99 percent of pairs) at
      |S| * |A| < N, since a definitional slip in "propagates" would surface
      there rather than at a clean counterexample.
    - >-
      Report the MAXIMUM of the 200-sample null per cell, not only its mean; a
      claimed excess must beat the maximum, not the average.
    - >-
      Report the 10 cells with the largest curve-versus-curve-free gap
      together with whether they share a statistic family or a small s, since a
      clustered gap is a family artifact rather than a frontier.
    - >-
      Report search effort per cell (restarts, evaluations, wall clock) so a
      negative can be read as "searched this hard" rather than "not found".
    - >-
      Report the frontier at each N separately, never pooled, so the decay
      check is available rather than averaged away.

  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
    note: >-
      Seeds govern the local-search restarts, the null draws and the PRF null.
      The Stage-1 exhaustive enumeration and the exact q_maj computations are
      DETERMINISTIC and must be identical across seeds; a seed-to-seed
      difference there is an implementation defect, not variance.

  budget:
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 12.0
    maximum_memory_gb: 4
    maximum_runs: 12

  stopping_rules:
    - >-
      Abort the whole line if Stage 0's re-derivation of the rigidity theorem
      from its committed statement does not go through; the deliverable is then
      the discrepancy, not a frontier.
    - >-
      Abort Stage 3 reporting entirely if the planted-positive control fails at
      any cell. The open cell is reported UNTESTED; no negative is admissible.
    - >-
      Abort Stage 3 reporting if the |A| = 1 fixture disagrees with
      IDEA-20260815-f558e4. Both records are blocked and the deliverable is the
      located discrepancy.
    - >-
      Stop at the declared grid. Extending |A| or s after seeing the frontier
      is a protocol amendment, never a repair.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result (AGENTS.md rule 5).

  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5). In particular, an unfinished Stage-3 cell is an
      unfinished cell, not an empty one.
    - >-
      A run whose curve-free Z/N control or composite-order control was not
      executed in the same invocation as the signal arm is
      invalid_measurement.
    - >-
      A run that pools the point-function, pair-dependent and partial state
      variants into one number is completed_invalid -- they are three different
      notions and the parent proposal names conflating them as the primary
      overclaim risk.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT
      experiment and requires a new contract.

  success_criterion: >-
    The run is SUCCESSFUL as a measurement when -- (a) the complete enumeration
    finished for all three state variants at every declared (N, |S|, |A|) cell
    and E1 and E2 are reported per variant; (b) the elliptic-net check ran on
    at least two toy curves and E3 is reported; (c) E4 = 1.00 and E5 is exact;
    (d) E7 >= 1; and (e) the frontier is reported for every (|A|, s, N) cell
    with its empirical null, its PRF null, its curve-free counterpart and its
    search effort. CLAIM B is SUPPORTED at toy tier if E1 = 0 for
    point-function state across the complete enumeration and E3 satisfies the
    bound. CLAIM F is SUPPORTED at toy tier if, with E4 = 1.00 and E5 exact,
    E6's gap lies within the empirical null spread at every cell.

  falsification_criterion:
    - >-
      E1 >= 1 for point-function state. CLAIM B IS FALSE. The counterexample
      labeling is archived verbatim as the counterexample certificate and the
      hypothesis is withdrawn by a superseding record.
    - >-
      E3 violated -- an elliptic net propagating exactly on state below
      N / |S| at toy scale. CLAIM B refuted more cheaply than by enumeration.
    - >-
      E6's gap exceeds the empirical null spread at some cell, reproduces
      across at least 3 prime orders, and decays with N. CLAIM F IS FALSE --
      the frontier carries curve-specific content. This is the positive
      outcome; it claims no algorithm and requires independent replication
      before any status moves.
    - >-
      E4 < 1.00. The search is not competent; no Stage-3 negative is
      admissible and the cell is UNTESTED.
    - >-
      E5 disagrees. Pipeline bug; this record and IDEA-20260815-f558e4 are both
      blocked.
    - >-
      E7 = 0. The pipeline cannot see the composite-order case where the bound
      must fail; every Claim-B result from this run is void.
    - >-
      Any achieved excess is FLAT in N. Recorded as an artifact under
      docs/inventor-protocol.md section 3, never as a finding.

  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
    - raw-result.json carrying every per-cell measurement and every enumerated counterexample and near miss, not summaries
    - all null arms (random, PRF, composite-order) and the curve-free Z/N control, in the same file as the signal arm
    - the planted-positive recovery result per cell
    - the frozen Stage-0 definition text for "propagates exactly", "propagates with probability q" and "auxiliary state", written before any run and hashed
    - the exact rational value read from IDEA-20260815-f558e4 for the |A| = 1 fixture, with the path and line it was read from
    - the full labeling of any pair violating the state-size bound, archived verbatim as a counterexample certificate
    - per-cell search effort (restarts, evaluations, wall clock) so a negative is readable as bounded search

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; approved_by is null and
      execution_authorized is false (AGENTS.md rule 1). Approval is the user's
      gate because it authorizes execution and spends compute.
    - >-
      The parent proposal is proof-oriented; its proof_search_map is carried in
      H-PROP-c95932 and must be audited before implementation (KN-TECH-080).
    - >-
      The Stage-0 definitional text must be frozen and hashed before any Stage
      3 search runs. A definition fixed after seeing a frontier voids this
      contract.
    - >-
      This record depends TOTALLY on the rigidity theorem of
      IDEA-20260807-df906f. A Coordinator must confirm that record's status
      before approval; if that theorem is withdrawn, Claim B has no content.

  derivation_provenance:
    tool: coordinator-subagent design pass
    source_record: IDEA-20260815-14872b
    authored_at: '2026-08-25'
    note: >-
      Metrics E1-E7, the four nulls, the planted-positive blocking control and
      the criteria render the parent proposal's mechanism stages 1-4, its
      null_object_control block and its six predictions into quantities
      decidable from a recorded number. The deliberate refusal to pre-commit a
      numeric frontier threshold is taken directly from the parent's own
      predictions and is preserved rather than replaced. Budgets come from the
      parent's declared estimated_cost (implementation low, compute medium).
      No field is invented; unsupplied values are listed in derivation_gaps.

  derivation_gaps:
    - >-
      The parent proposal states the |A| = 1 fixture value as 0.5369 and
      attributes it to IDEA-20260815-f558e4. THIS CONTRACT DOES NOT ASSERT
      THAT NUMBER. The executor must read it from that record's committed text
      and record the path it was read from; a Coordinator should verify the
      attribution before approval, because an unread fixture cannot gate
      anything.
    - >-
      The exact statistic families used for structured starts (coordinate
      buckets, division-polynomial characters, isogeny-kernel labels) are named
      but not specified. They must be written into the frozen pre-registration,
      since a family added after seeing a weak frontier would turn a search
      budget into a fitted result.
    - >-
      The definition of q_maj is inherited from IDEA-20260815-f558e4 and is not
      restated here. Stage 0 must transcribe it verbatim from that record; two
      pipelines computing different q_maj definitions would agree or disagree
      for reasons unrelated to the mathematics.
    - >-
      The composite-order control's "matched size" is not defined precisely.
      Matching on total order alone versus matching on the largest prime factor
      gives different controls, and the choice must be frozen before the run.
