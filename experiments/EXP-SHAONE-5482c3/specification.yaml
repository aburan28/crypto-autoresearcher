experiment:
  id: EXP-SHAONE-5482c3
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-ade53e; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-ade53e
  question_id: RQ-SHAONE-081e3a
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Instrument near-collision block search to collect full abort-depth histograms at reduced-step
    and MD5 scale, test the geometric hypothesis against a probability-matched artificial independent
    condition set, and report the percentile-to-mean budget ratio.
  objective: 'The one uncertainty a run reduces is whether an expected per-block cost is a sufficient
    planning quantity for near-collision block search, or whether the cost distribution''s tail makes
    a mean-based budget systematically insufficient. Stated as parts: (i) it establishes whether the
    abort-depth distribution''s deep tail is populated at all within a declared attempt budget at
    some analogue parameter setting, which is a precondition no record in this repository has checked
    and whose failure is a reportable parameter-choice outcome rather than a result about search dynamics;
    (ii) it validates the instrument and the estimator by running a probability-matched artificial
    independent condition set through the identical loop in the same invocation, an arm that must
    by construction yield the geometric form, so that any deviation observed there is measurement
    error and disqualifies the real arm''s fit before it is interpreted; (iii) it reports the real
    arm''s fitted tail index from two independently written estimators with bootstrap intervals, the
    lag-1 and lag-2 autocorrelation of abort depth with a shuffled-order control to separate sequence
    effects from distributional ones, and the ratio of the 95th-percentile total budget to the mean-based
    budget, which is the planning quantity a mean omits. No collision needs to complete; aborted attempts
    are the data.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for THIS condition
      chain on THIS analogue at THESE parameters and within THIS attempt budget, the abort-depth distribution
      is this histogram, its fitted tail index is this value under these two estimators and this pre-declared
      threshold, its lag-1 autocorrelation is this, and the 95th-percentile budget exceeds the mean-based
      budget by this ratio -- with the artificial arm confirming the estimator. WHAT DOES NOT FOLLOW:
      no cost figure for any real attack, no correction to any published cost model, no statement
      about full-scale parameters, and no security consequence. Confirming or refuting the geometric
      hypothesis at this scale says nothing about it at another.'
  inputs:
    procedure: 'STAGE 0 (cost: 2 human-hours): declare the analogue parameters, the condition chain
      and its ordering, the attempt budget, the tail-fitting threshold, the seeds, and both estimator
      specifications. The threshold is frozen here, before any histogram is seen. STAGE 1 (cost: 4-8
      human-hours): instrument the search kernel in C with in-kernel abort-depth and evaluation counters;
      verify against a counters-disabled build that evaluation totals agree. STAGE 2 (cost: 1-4 CPU-hours):
      run 10^6 attempts against the real condition set and 10^6 against the probability-matched artificial
      set in one invocation, collecting full histograms and the raw abort-depth sequence. STAGE 3
      (cost: minutes): measure per-condition success probabilities at shallow depths and compute the
      geometric prediction for the deep tail. STAGE 4 (cost: minutes): fit the tail index in both
      arms with both estimators at the pre-declared threshold, bootstrap intervals, and check the
      artificial arm against the geometric prediction; halt interpretation of the real arm if it fails.
      STAGE 5 (cost: minutes): compute autocorrelations and repeat on the shuffled-order control.
      STAGE 6 (cost: 1 CPU-hour): compute the percentile-to-mean budget ratio, emit the raw histograms
      alongside every fit, and report each disagreement with the predictions as such.'
    instrument: Python 3.11 orchestration over a ctypes-wrapped C search kernel carrying the abort-depth
      and evaluation counters inside the compiled loop so instrumentation overhead is negligible and
      measurable; numpy for histograms and bootstrap; two independently written tail estimators, one
      a Hill-type order-statistic estimator and one a maximum-likelihood fit over the declared threshold,
      implemented by separate code paths so agreement is meaningful; hashlib for reference vectors;
      harness/runner.py for run manifests and deterministic seeds. No Sage and no computer-algebra
      dependency.
    parameters: 'Analogue: reduced-step compression function at two step counts plus MD5 scale, declared
      at STAGE 0. Attempts: 10^6 per arm per setting, raised to 10^7 only if the deep tail is under-populated
      and budget permits. Condition chain: the declared totally ordered set, with its length recorded.
      Artificial arm: per-condition Bernoulli probabilities matched individually to the measured real
      values. Tail-fitting threshold: pre-declared as a fixed depth quantile. Bootstrap resamples:
      10000. Autocorrelation lags: 1 and 2. Arms: real, artificial independent, shuffled-order control,
      counters-disabled verification.'
  controls:
  - Matched artificial independent condition set with condition-by-condition probability matching,
    same invocation, same loop.
  - Counters-disabled comparison run to confirm instrumentation does not perturb the search.
  - Shuffled-attempt-order control to break any autocorrelation, isolating whether the tail depends
    on attempt sequence.
  - Two independent estimator implementations for the tail fit, since a single fitting routine can
    manufacture a tail.
  - Report the raw histogram alongside every fit so a reader can refit without trusting the estimator.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Artificial independent conditions: replace the real condition set with
    a synthetic set of independent Bernoulli conditions whose individual success probabilities are
    matched, condition by condition, to those measured in the real search, and run the IDENTICAL instrumented
    search loop in the same invocation. By construction this null MUST produce the geometric abort-depth
    form. The null therefore validates the estimator and the instrument: if the artificial arm''s
    fitted tail index deviates from the geometric prediction, the deviation is measurement error and
    no claim about the real condition set is admissible. Only a real arm that deviates while the artificial
    arm does not supports a heavy-tail statement.'
  independent_variables:
  - analogue step count
  - condition set arm (real / artificial independent)
  - attempt ordering (natural / shuffled)
  - tail estimator (order-statistic / maximum-likelihood)
  metrics:
    primary:
    - full abort-depth histogram, raw counts, per arm
    - fitted tail index with bootstrap interval, per arm per estimator
    - ratio of 95th-percentile total budget to mean-based budget, per arm
    - artificial arm deviation from the geometric prediction
    secondary:
    - per-condition success probability by depth
    - lag-1 and lag-2 abort-depth autocorrelation, natural and shuffled
    - evaluations per attempt distribution
    - evaluation total agreement between counters-enabled and counters-disabled builds
  heuristic_under_test: null
  preregistered_prediction:
    quantity: T_real and T_art, the fitted tail indices of the per-attempt cost distribution in the
      real and artificial arms, and Q = (95th-percentile total budget) / (mean-based total budget)
      in the real arm.
    formula: Under the geometric hypothesis with per-condition success probabilities p_i, the probability
      of aborting at depth d is (product of p_i for i<d) times (1-p_d), and the per-attempt cost distribution
      is geometric-mixture with an exponential tail, giving T_art indistinguishable from the geometric
      value at the pre-declared threshold. Predicted Q >= 1.5 in the real arm if T_real departs from
      T_art; Q approximately 1.1 if it does not. No numeric size is pre-committed for the T_real minus
      T_art difference itself.
    source: Pre-registered in the parent proposal IDEA-20260816-ade53e before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are two reduced-step analogue settings plus MD5 scale, with
      10^6 attempts per arm -- toy because no collision needs to complete and aborted attempts are
      the data, which is exactly what makes the measurement affordable. Transfer assumption stated
      explicitly: the tail index does NOT transfer to full-scale parameters and no extrapolation is
      performed. What is argued to transfer is only the qualitative mechanism -- whether shared message
      freedom induces autocorrelation across attempts -- and that argument is asserted, not established,
      because the condition chain''s length and structure differ with scale.'
    correspondence: null
  tail_checks:
  - Report the raw histogram's upper decile counts explicitly, since that is where the fit lives and
    where under-population would invalidate it.
  - Refit at two thresholds either side of the pre-declared one and report all three, so threshold
    sensitivity is visible rather than hidden.
  - Check for censoring at the maximum-depth cap and report the censored fraction; a nonzero fraction
    is disclosed, never absorbed.
  - Check whether the histogram is multimodal, which would indicate two distinct failure regimes and
    make a single tail index the wrong object.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop and report under-population if the upper decile of the abort-depth histogram holds fewer
    than a declared minimum count after 10^7 attempts.
  - Halt interpretation of the real arm if the artificial arm deviates materially from the geometric
    prediction.
  - Stop at the declared wall-clock budget and report attempts completed; a truncated run is a budget
    outcome, never evidence about search dynamics.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run is successful if the artificial arm reproduces the geometric prediction
    within bootstrap intervals and the real arm's histogram, two estimator fits, autocorrelations
    and Q are all reported at the pre-declared threshold -- whether or not the real arm departs from
    geometric.
  falsification_criterion:
  - The artificial arm deviates materially from the geometric prediction, voiding the estimator and
    the real arm's fit.
  - The two independent estimators disagree beyond their bootstrap intervals, so no tail index may
    be reported.
  - Real and artificial histograms coincide within intervals, closing the heavy-tail hypothesis at
    this scale with a measured null and licensing mean-based budgeting there.
  - Counters-enabled and counters-disabled evaluation totals disagree materially, showing instrumentation
    perturbs the search.
  - The censored fraction at the maximum-depth cap exceeds a declared bound, making the tail unmeasurable
    at these parameters.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-ade53e
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The tail-fitting threshold must be fixed by the Coordinator at approval, before any histogram
    exists; a threshold chosen afterwards makes the tail index unfalsifiable.
  - Whether the condition chain is genuinely totally ordered in the chosen analogue needs confirmation;
    a branching chain requires a different tracked object and this contract would not apply.
  - The claim that autocorrelation from shared message freedom is the mechanism behind any heavy tail
    is a conjecture the contract probes but does not establish, and the Coordinator should decide
    whether STAGE 6 is sufficient to support even a candidate-cause statement.
  - Analogue parameter selection between too-easy and too-hard is not specified and may require exploratory
    runs whose cost must be budgeted explicitly rather than absorbed.
