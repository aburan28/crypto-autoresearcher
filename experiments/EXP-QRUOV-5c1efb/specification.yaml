experiment:
  id: EXP-QRUOV-5c1efb
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-QRUOV-677301
  question_id: RQ-QRUOV-001
  goal_id: GOAL-QRUOV-001
  title: >-
    Build and audit the matched extension-field-UOV baseline: two ell-invariant
    identities, an exhaustive meet-in-the-middle disposal, and the single integer
    r that decides whether GOAL-QRUOV-001's yardstick prices the right object

  objective: >-
    If separately approved, frozen and authorised, produce the matched
    extension-field-UOV baseline that GOAL-QRUOV-001's next_action names as a
    prerequisite for its own first batch, and audit it in the same package rather
    than inheriting it. Four questions, cheapest first. (1) Do the identities
    n - 2m = ell(V - M) and n/m = (V + M)/M hold exactly at every declared
    parameter set? (2) Is the reduced oil-space haystack spendable by generic
    meet-in-the-middle at any parameter set of interest? (3) What is r, the
    A-module rank of the A-linear span of the descended public forms, and is the
    generic-existence margin V - r(M+1)/2 non-negative at the declared parameter
    sets? (4) Are the descended forms distinguishable from generic symmetric
    matrices over A by their corank profile? Question 1 is seconds and can
    terminate the audit; questions 2 and 3 are seconds to minutes.

  what_this_is_not:
    - Not an attack, not an exponent claim, and not a cost improvement of any kind. sota_delta is zero on every attack axis by construction.
    - Not a plain-UOV cost model. Every plain-UOV number here is a QUOTED recalled statement carried with its provenance, so that RQ-UOV-001 can replace it rather than compete with it. GOAL-QRUOV-001's next_action forbids two conventions.
    - Not a claim that the quotient-ring structure gives the attacker nothing. The meet-in-the-middle disposal closes GENERIC ENUMERATION ONLY and names what remains open.
    - Not a statement about reducible f; f is irreducible throughout. The reducible case is EXP-QRUOV-5b9038.
    - Not a statement about characteristic 2. Odd q only.
    - Not evidence. No run has happened, and no approval exists.

  claim_ceiling: >-
    TOY for the measured quantities (r, the corank distance) at q in {7, 11},
    ell <= 4, M in {2, 3}, V in {4, 6, 8}, odd characteristic. The identities, the
    haystack exponents, the meet-in-the-middle truth table and the
    generic-existence threshold are EXACT INTEGER ARITHMETIC and carry no
    measurement tier at all -- but they are conditional on the assumed parameter
    semantics, and if a specification cannot be read then every numeric column is
    marked unavailable and the deliverable is symbolic only. Nothing in this
    contract may be cited as a statement about the security of a deployed QR-UOV
    parameter set.

  inputs:
    q: [7, 11]
    ell: [1, 2, 3, 4]
    M: [2, 3]
    V: [4, 6, 8]
    keys_per_cell: 20
    null_samples: 200
    planted_r_ladder: "r planted at 1, 2, ..., M*ell, one instance family per rung"
    random_identity_sweep: 10000
    identity_sweep_ranges: "1 <= V <= 512, 1 <= M <= 64, 1 <= ell <= 64"
    mitm_enumeration_range: "1 <= M <= 16, 1 <= V <= 256, exhaustive"
    omega_reported: [2.37, 3.0]
    master_seed: 7714402
    domain: "EXP-QRUOV-5c1efb/v1"
    seed_derivation_rule: >-
      SHA-256 over the ASCII bytes of domain || "|" || label || "|" ||
      decimal(q) || "|" || decimal(ell) || "|" || decimal(M) || "|" ||
      decimal(V) || "|" || decimal(counter), big-endian unsigned, reduced into
      range by rejection sampling. Labels: "f-irr", "key", "oil", "nullform",
      "plant". Counter starts at 0 per label/parameter tuple and advances once per
      digest. Reproducible bit-for-bit from this rule plus master_seed.
    f_selection_rule: >-
      f is the lexicographically first monic irreducible of degree ell over F_q in
      coefficient order (low to high). DETERMINISTIC; no seed is consumed.
    parameter_table_source: >-
      DECLARED UNAVAILABLE AT CONTRACT TIME. No QR-UOV parameter values are
      recorded in this contract because none has been read. Stage 0 either
      supplies them with a locator or the numeric columns are emitted as
      "unavailable". AGENTS.md rule 9: a parameter is never filled from memory.

  arms_and_controls:
    treatment: >-
      For each cell, build a QR-UOV-shaped key with a planted oil A-module of
      A-rank M, descend the m = M*ell public F_q forms to symmetric matrices over
      A by Lemma T's bijection, and measure r by exact rank of their A-span, the
      public-key F_q-dimension ratio, and the corank profile of the descended
      forms.
    measured_null: >-
      NULL-RANDOM. Public matrices with blocks drawn uniformly from W*phi(A) and
      NO planted oil module, same q, ell, N, M, same descent code, same seeds.
      FORCED VALUE DERIVED BEFORE THE RUN: r is identical to the treatment arm,
      because r is a property of the presentation and not of the secret; and the
      corank profile matches the generic one. THIS NULL CAN FAIL, and its failure
      is the most interesting outcome in the contract: if r differs between
      planted and unplanted keys then r leaks the presence of a secret, which is a
      distinguisher and must be reported as the headline rather than folded into
      the audit.
    measured_null_2: >-
      NULL-MISMATCH. A deliberately WRONG baseline: UOV over F_{q^ell} at
      (N, M*ell) -- equation count confused with oil dimension. FORCED: its
      exponent ell(V + M - 2*M*ell) is NEGATIVE for ell >= 2 at every declared
      (V, M), so the comparison instrument MUST flag it as not comparable. IF THE
      INSTRUMENT PASSES IT AS COMPARABLE, IT CANNOT DETECT A WRONG BASELINE AND NO
      MATCHED-BASELINE CLAIM MAY BE MADE FROM THIS PACKAGE AT ALL.
    positive_control: >-
      POS-PLANT. Instances with r planted deliberately: take k A-independent
      symmetric matrices over A as the public forms, for k = M and for k = M*ell.
      The rank instrument MUST report r = k in both cases. IF IT DOES NOT, THE
      RANK CODE IS BLIND TO A-INDEPENDENCE AND NO MEASURED r MAY BE REPORTED FROM
      ANY ARM.
    graded_control: >-
      GRADED-R. Plant r at every value 1, 2, ..., M*ell and report measured against
      planted across the whole ladder, with monotonicity. This gives at least four
      interior points at M = 2, ell = 3 and localises any blind spot of the rank
      instrument to a specific rung instead of leaving "the rank looked wrong".
    baseline_embedding_control: >-
      ELL-ONE. At ell = 1 the QR-UOV row and the plain-UOV row of the cost table
      must be IDENTICAL in every column as exact integers, and r must equal M.
      This is the frozen baseline-reproduction fixture; a single differing column
      is an instrument defect and no other row may be read.
    ordering_control: >-
      NULL-MISMATCH, NULL-RANDOM and both POS-PLANT arms are computed, executed and
      hash-committed BEFORE any treatment r is read, and the frozen decision rule
      is run on NULL-MISMATCH first.
    comparability_policy: >-
      Only within-contract comparison, between arms sharing (q, ell, M, V, code
      revision, arithmetic implementation). No comparison to a published QR-UOV
      figure or to another experiment from inside this package.
    archive_check: >-
      Prior measurements of r, of the descended corank distribution, or of the
      stabiliser count anywhere in this program: NONE. Area QRUOV is empty of runs.
      Recorded as an ABSENCE.

  independent_variables:
    - presence or absence of a planted oil module (treatment versus NULL-RANDOM)
    - planted r (GRADED-R)
    - ell, including the ell = 1 embedding point
    - q, M, V

  metrics:
    primary:
      - "B1: integer residual (n - 2m) - ell(V - M) at every parameter set and over the random sweep. Forced 0."
      - "B2: symbolic partial derivative of n/m with respect to ell. Forced 0."
      - "B3: number of columns in which the ell = 1 QR-UOV and plain-UOV rows differ. Forced 0."
      - "B4: mismatched-baseline detection rate on NULL-MISMATCH. Required 100 per cent flagged."
      - "B5: exhaustive truth table of M*V/2 < V - M. Forced TRUE only at M = 1, V > 2."
      - "B6: measured r per key. Forced exactly M or exactly M*ell; expectation M."
      - "B10: measured r versus planted r across GRADED-R. Forced equal at every rung."
    secondary:
      - "B7: public-key F_q-dimension ratio, QR-UOV over ext-UOV. Forced 1 if r = M, ell if r = M*ell."
      - "B8: generic-existence margin V - r(M+1)/2 per declared parameter set, with the measured r."
      - "B9: Kolmogorov-Smirnov distance between the descended-form corank distribution and the matched NULL-RANDOM distribution built in the same code path."
      - "the V < 2M intersection-applicability flag per declared parameter set."
      - "haystack exponents log_q over F_q and over A, and their ratio (forced ell)."
      - "linear-algebra cofactor at omega = 2.37 and omega = 3."
      - "stabiliser exponent ratio, reported as the SAME phenomenon as the haystack ratio and never as an independent finding."

  heuristic_under_test: HEUR-QRUOV-BASE-3

  preregistered_prediction:
    quantity: >-
      The two identities, the meet-in-the-middle truth table, r, the public-key
      dimension ratio, and the generic-existence margin.
    formula: >-
      n - 2m = ell(V - M); n/m = (V + M)/M; haystack exponents m(n - m) =
      M*V*ell^2 over F_q and ell*M*V over A, ratio ell; generic MITM cost
      q^{ell*M*V/2}, which beats q^{ell(V-M)} iff M*V/2 < V - M iff
      V(M - 2) < -2M; cofactor ell^{omega - log_2 3}; generic-existence threshold
      V >= r(M+1)/2 from d(N - d) >= r*d(d+1)/2 at d = M, N = V + M.
    source: >-
      Derived in H-QRUOV-677301 (Q1, Q2, Q3 and Lemma T). The cost-exponent
      interpretation additionally rests on HEUR-QRUOV-BASE-1 and -2, both RECALLED
      AND UNVERIFIED; the identities, the haystack ratio, the MITM truth table and
      the dimension counts rest on integer arithmetic alone. NO PUBLISHED SOURCE
      IS CITED FOR ANY NUMBER HERE and none is asserted to exist.

  stages:
    - id: stage0_read
      purpose: >-
        Obtain (a) the QR-UOV parameter table with a locator, (b) the definitions
        of V, M, ell, n, m verbatim, (c) whether the oil space is an A-module,
        (d) how the m public F_q forms are organised, (e) whether the designers
        state the reduction to UOV over F_{q^ell} and in WHICH DIRECTION, and
        (f) a primary statement of the Kipnis-Shamir/reconciliation and
        intersection-attack costs. Declared source order: arXiv abstract and PDF;
        ePrint ABSTRACT page (the PDF endpoint is known to return 403 under this
        network policy); an author-hosted copy; the reference implementation;
        the NIST submission package.
      terminating_outcome: >-
        If the designers state AND prove direction 2 of the quantifier audit -- that
        the descent's image is not an easier subfamily -- record the locator and
        STOP the audit half; the baseline half still runs, since the corpus still
        has no table.
      cost: reading only, zero compute
    - id: stage1_identities
      purpose: >-
        Verify B1 and B2 exactly, symbolically and over the 10,000-point random
        integer sweep; run the ELL-ONE baseline-embedding fixture (B3); and run
        NULL-MISMATCH (B4) before anything else is looked at.
      terminating_outcome: >-
        Any nonzero residual means the assumed parameter semantics are wrong: STOP
        and redirect. B3 or B4 failure means the instrument is defective: STOP.
        THIS IS THE CHEAPEST DECISIVE GATE IN THE CONTRACT.
      cost: seconds
    - id: stage2_table
      purpose: >-
        Compute the full cost table -- every column, both omega values, both
        haystack columns, the V < 2M flag -- and the exhaustive MITM truth table
        (B5). Columns needing a parameter value that stage 0 could not obtain are
        emitted as "unavailable", never estimated.
      terminating_outcome: none; produces the deliverable
      cost: seconds
    - id: stage3_rank
      purpose: >-
        Run POS-PLANT and GRADED-R (B10) and hash-commit them; then NULL-RANDOM;
        then the treatment arm, measuring B6, B7 and B9.
      terminating_outcome: >-
        POS-PLANT or GRADED-R failure halts the package with NO measured r
        reportable. A difference in r between NULL-RANDOM and treatment halts the
        audit and reroutes the finding as a distinguisher claim under its own
        contract.
      cost: minutes
    - id: stage4_quantifier
      purpose: >-
        Write both directions of the reduction out with explicit quantifiers,
        state what Lemma T proves and what it does not, evaluate B8 at every
        declared parameter set with the measured r, and record the Pareto
        disposition of every table row across time, memory and data/queries.
      terminating_outcome: none; produces the deliverable
      cost: zero compute

  scale_relevance:
    tier: toy
    justification: >-
      The identities, the haystack exponents, the MITM truth table, the dimension
      counts and the generic-existence threshold are exact arithmetic and are
      size-independent -- but they are conditional on the parameter semantics
      obtained in stage 0, so their scope is "whatever stage 0 actually read". The
      measured quantities (r, the corank distance) are at q <= 11 and ell <= 4 and
      are TOY: r is a structural integer whose toy value is evidence about the
      CONSTRUCTION, not about a deployed key, and the corank statistics are toy
      outright. Every downstream citation must state which of the two it uses.
    correspondence: null

  replication:
    seeds: [7714402, 7714403, 7714404]
    independent_instances: 20
    interpretation: >-
      Stage 1 and stage 2 are deterministic and exhaustive; replication there is a
      code-path check. Stage 3 uses three seeds and 20 instances per cell.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 3
    no_network: false
    network_note: >-
      Stage 0 needs network for source retrieval only; stages 1-4 run with no
      network. A retrieval failure is an infrastructure and policy outcome, is
      recorded as such with every URL and status code, and triggers the declared
      symbolic-only fallback -- never a mathematical conclusion.

  stopping_rules:
    - Do not execute while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Stop at stage 1 on any nonzero identity residual, on any ELL-ONE column difference, or if NULL-MISMATCH is not flagged.
    - Stop at stage 3 if POS-PLANT or any GRADED-R rung fails.
    - Halt and reroute if r differs between NULL-RANDOM and treatment.
    - Stop on budget exhaustion, reporting coverage rather than shrinking a cell.

  invalidation_rules:
    - Any execution before separate approval, freezing and authorisation.
    - Any treatment r read before the null and positive-control commitments exist with their hashes.
    - Any numeric parameter value taken from memory rather than from a located source; such a column must read "unavailable".
    - Any cost figure reported without its memory column beside it.
    - Any cross-experiment or published-figure comparison from inside this package.
    - Any statement that the quotient-ring structure "provably gives the attacker nothing"; the MITM disposal closes generic enumeration only.

  success_criterion: >-
    No current success outcome: this contract is not authorised for execution. IF
    later approved, frozen, authorised and validly executed, the positive
    disposition is: B1 = 0, B2 = 0, B3 = 0 columns, B4 flagged in 100 per cent of
    cells, B5 matching the pre-registered truth table exactly, B10 exact at every
    rung, B6 = M, B7 = 1, B8 >= 0 at every declared parameter set, and B9 below
    0.10 -- yielding a DERIVED matched extension-field-UOV baseline, an
    exponent-neutrality statement for the audited attack families scoped to
    f irreducible and odd q, and a discharged quantifier audit. THAT OUTCOME MAKES
    THE SCHEME LOOK SOUND AND IS A FIRST-CLASS RESULT: it is half of
    GOAL-QRUOV-001's second completion criterion, and a batch that reaches it and
    records it as a non-result has understated a criterion that was met.

  falsification_criterion: >-
    Any of: a nonzero identity residual (parameter semantics wrong); an ELL-ONE
    column difference or an unflagged NULL-MISMATCH (instrument defective); a
    GRADED-R or POS-PLANT failure (rank instrument blind); r equal to neither M nor
    M*ell (grouping assumption wrong); a dimension ratio equal to neither 1 nor ell
    (Lemma T's bijection wrong); r differing between planted and null arms (r leaks
    the secret -- reroute as a distinguisher); a NEGATIVE generic-existence margin
    at a declared parameter set (the goal's yardstick prices the wrong object, and
    every cost comparison planned by GOAL-QRUOV-001 must be rebuilt); or a corank
    KS distance above 0.10 (the descent's image is a structured subfamily and
    direction 2 is in doubt regardless of r).

  infrastructure_failure_disposition: >-
    Timeouts, crashes, missing dependencies and network failures are recorded as
    failed_infrastructure with the exact command, stage and resource reading, and
    are NEVER negative mathematical evidence (AGENTS.md rule 5). In particular:
    failure to retrieve a QR-UOV specification is a network-policy fact and yields
    "unavailable" columns, not a conclusion about the scheme; and it must not be
    used to argue that the matched baseline cannot be built, since every symbolic
    column is obtainable without it. Environment verified in the generating
    session: numpy 2.4.6 present, sympy ABSENT, Sage ABSENT; all stages are pure
    Python by design so that a missing algebra system cannot manufacture a
    negative.

  required_artifacts:
    - Frozen approved specification and freeze receipt binding its SHA-256.
    - Stage-0 retrieval transcript with every URL, status code and verbatim quotation with locator, or an explicit statement of failure per source in the declared order.
    - Exact integer outputs for B1, B2, B3, B5 with the enumeration ranges pinned.
    - NULL-MISMATCH detection record, committed before any other row.
    - POS-PLANT and GRADED-R planted-versus-measured table, committed before treatment.
    - Per-instance stage-3 records: q, ell, M, V, f, seed, measured r, dimension ratio, corank histogram.
    - The full cost table with every column and both omega values, every unobtainable column marked "unavailable".
    - The written quantifier statement in both directions, with what is proved and what is not.
    - Pareto disposition per row across time, memory and data/queries.
    - Manifest, environment, dependency versions, commands, stdout, stderr, timestamps, resource measurements.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - Independent review confirms every forced value was fixed before execution and that NULL-MISMATCH and POS-PLANT can actually fail.
    - Independent review confirms no plain-UOV cost convention is minted here, only quoted, per GOAL-QRUOV-001's next_action.
    - Coordinator separately approves and freezes; this draft is not edited in place.
    - User separately authorises execution after receiving the approved frozen package.

  approval_status: >-
    Pending Coordinator review. No approved_by field is present because this
    contract is not approved. Only the Coordinator approves experiments
    (AGENTS.md rule 1).

  assigned_to: executor
