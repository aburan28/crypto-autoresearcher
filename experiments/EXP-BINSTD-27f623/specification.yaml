# =============================================================================
experiment:
  id: EXP-BINSTD-27f623
  hypothesis_id: H-BINSTD-b1f016
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-11aa69
  goal_id: GOAL-ECDLP2M-001
  parent_experiment_id: EXP-BINSTD-178742
  version: 1
  title: >-
    Preregistered usable-dimensions emptiness gate on frozen odd primes
    with ord_n(2)=n-1 (Stages 0-1; stdlib Part-1 predicates)
  status: analyzed
  approved_by: DEC-20261003-e9b17b
  approved_at: '2026-10-03'
  analyzed_by: DEC-20261003-947da5
  analyzed_at: '2026-10-03'
  evidence_id: EV-BINSTD-93aee1
  frozen: true
  execution_authorized: true
  packaging_only: false
  approval:
    approved_by: DEC-20261003-e9b17b
    composing_decision: DEC-20261003-e9b17b
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete. Approval does not assert the hypothesis is true.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    stage2_admitted_by: DEC-20261003-6d20b7
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Freeze the forced-negative and positive odd-prime panels plus the
    emptiness-gate API (Stage 0), then run Part-1 dual-route usable_dimensions
    census on those panels with a synthetic non-empty injection null (Stage 1),
    then independently re-derive ord_n(2) for 3 forced-negative members
    (Stage 2; DEC-20261003-6d20b7). Stages 0-1 report E-GATE-HOLDS |
    E-GATE-FAILS | O-CONTROL-FAIL | O-IMPEDIMENT; Stage 2 reports
    S2-REPLICATE-AGREE | S2-REPLICATE-DISAGREE | O-IMPEDIMENT. No
    factor-base construction. No break / exponent claim.

  class: instrument
  class_note: >-
    Instrument validating HEUR-BINSTD-11aa69-H1 at frozen odd primes.
    certificate.kind=none. Not an exponent-moving or cost-model experiment.

  scope:
    included:
      - >-
        Stage 0: freeze forced-negative list F (|F|≥10, ord_n(2)=n-1),
        positive controls C (|C|≥3, ord_n(2)<n-1), usable filter definition,
        injection mutation schema, and preregistered predictions BEFORE any
        Stage-1 gate rate. Zero scientific rates in Stage 0.
      - >-
        Stage 1: score every n in F∪C via Part-1 dual routes; apply emptiness
        gate; inject synthetic non-empty usable set and confirm rejection;
        emit one outcome label.
      - >-
        Stage 2 (DEC-20261003-6d20b7): independently re-derive ord_n(2) for
        the first 3 Stage-0 forced-negative members via a pow-only divisor
        ladder that does not call Stage-1 score_ord_row and does not read
        Stage-1 census rows for the measurement; post-hoc compare to Stage 1
        when present; emit S2-REPLICATE-AGREE | S2-REPLICATE-DISAGREE |
        O-IMPEDIMENT.
    excluded:
      - Magma / Sage / AUXIN / Bedrock as success path
      - Factor-base construction / Semaev / Part-2 ranks
      - Break / exponent / deployed insecurity claim
      - Editing EXP-BINSTD-178742 frozen specification bytes

  inputs:
    proposal: ledger/proposals/IDEA-20261001-11aa69.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-b1f016.yaml
    parent_contract: experiments/EXP-BINSTD-178742/specification.yaml
    parent_part1_surface: experiments/EXP-BINSTD-178742/implementation/typed/part1_surface.py
    trial_plan: experiments/EXP-BINSTD-27f623/trial-plan-v1.json
    trial_plan_stage2: experiments/EXP-BINSTD-27f623/trial-plan-stage2-v1.json
    stage2_amendment: experiments/EXP-BINSTD-27f623/amendments/AMD-EXP-BINSTD-27f623-20261003-stage2.yaml
    implementation:
      - experiments/EXP-BINSTD-27f623/implementation/run.py
      - experiments/EXP-BINSTD-27f623/implementation/check.py

  controls:
    - id: ctl_forced_negative_panel
      role: treatment — every n∈F must have usable_dimensions=[] under both routes
    - id: ctl_positive_ord_lt_n_minus_1
      role: positive control — ≥1 n∈C with usable_dimensions≠[]
    - id: ctl_dual_route_agreement
      role: instrumentation — iteration and divisor-test ord_n(2) must agree
    - id: null_synthetic_nonempty_injection
      role: null object — inject fake usable dims; gate must reject with failure_signature

  independent_variables:
    - panel: [forced_negative, positive_control]
    - n: frozen_in_stage0
    - injection: [none, synthetic_nonempty]

  metrics:
    primary:
      - id: empty_usable_rate_on_ord_eq_n_minus_1
        definition: Fraction of F with usable_dimensions=[] under both routes
      - id: synthetic_injection_catch_rate
        definition: Fraction of synthetic injections rejected by the gate (=1.0 required)
      - id: positive_control_nonempty_count
        definition: Count of C members with usable_dimensions≠[]
    secondary:
      - id: route_agreement_rate
        definition: Fraction of F∪C where both ord routes agree and verify

  heuristic_under_test: HEUR-BINSTD-11aa69-H1
  preregistered_prediction:
    quantity: empty_usable_rate_on_ord_eq_n_minus_1 and synthetic_injection_catch_rate
    formula: >-
      empty_usable_rate = 1.0 on F; catch_rate = 1.0; positive_control_nonempty_count ≥ 1
    source: >-
      IDEA-20261001-11aa69 / HEUR-BINSTD-11aa69-H1; Part-1 filter in
      EXP-BINSTD-178742 part1_surface.stable_dimensions_from_ord

  scale_relevance:
    tier: toy
    justification: >-
      Frozen odd primes with |n|≤200 for forced-negatives and the Part-1 toy
      positives {17,23,31,41}. No transfer to a security claim about n≥131.
    correspondence: null

  tail_checks:
    - id: TC-ROUTE
      check: Every scored n has routes_agree=true and order_verified=true
    - id: TC-INJECTION
      check: failure_signature is non-empty on every rejected injection

  replication:
    seeds: [2026100311]
    independent_instances: 1

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 3
    maximum_workers: 1

  stopping_rules:
    - id: SR-S0
      rule: Stage 1 does not start until Stage-0 freeze artifacts exist with hashes recorded
    - id: SR-ROUTE
      rule: If route_agreement_rate < 1.0 on F∪C, stop and report O-CONTROL-FAIL
    - id: SR-BUDGET
      rule: Advisory 1 CPU-hour; overrun is O-IMPEDIMENT, not falsification

  invalidation_rules:
    - id: INV-1
      rule: Editing preregistered-predictions.json after any Stage-1 outcome invalidates interpretation
    - id: INV-2
      rule: Using Magma/Sage/AUXIN/Bedrock as the success path invalidates the run
    - id: INV-3
      rule: Claiming break / exponent / deployed insecurity from this EXP alone invalidates the report

  success_criterion: >-
    Stage-0 freeze artifacts exist with recorded hashes before Stage 1, and
    Stage 1 returns exactly one of E-GATE-HOLDS, E-GATE-FAILS, or
    O-CONTROL-FAIL with complete per-n rows for F∪C plus an injection
    verdict — a measurement success in either scientific direction.

  falsification_criterion: >-
    HEUR-BINSTD-11aa69-H1 is falsified iff Stage-1 dual-route controls pass
    AND (some n∈F has nonempty usable_dimensions OR the synthetic injection
    is accepted OR every n∈C has empty usable_dimensions) while the report
    still claims E-GATE-HOLDS (the honest label is then E-GATE-FAILS).
    O-IMPEDIMENT / budget abort is not falsification.

  required_artifacts:
    - experiments/EXP-BINSTD-27f623/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-27f623/stage0/frozen-panels.json
    - experiments/EXP-BINSTD-27f623/stage0/gate-api.json
    - experiments/EXP-BINSTD-27f623/stage1/census-matrix.json
    - experiments/EXP-BINSTD-27f623/RESULTS.md
    - experiments/EXP-BINSTD-27f623/runs/RUN-BINSTD-95fcfd/manifest.yaml
    - experiments/EXP-BINSTD-27f623/runs/RUN-BINSTD-95fcfd/raw-result.json
    - experiments/EXP-BINSTD-27f623/runs/RUN-BINSTD-60aff6/manifest.yaml
    - experiments/EXP-BINSTD-27f623/runs/RUN-BINSTD-60aff6/raw-result.json
    - experiments/EXP-BINSTD-27f623/stage2/independent-rederive.json
    - experiments/EXP-BINSTD-27f623/runs/RUN-BINSTD-d15ac1/manifest.yaml
    - experiments/EXP-BINSTD-27f623/runs/RUN-BINSTD-d15ac1/raw-result.json

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
