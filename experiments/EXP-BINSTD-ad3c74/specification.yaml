# EXP-BINSTD-ad3c74
# Degree-gap count arithmetic. No system is solved.
# Approved by DEC-20261003-8ee17f.
experiment:
  id: EXP-BINSTD-ad3c74
  hypothesis_id: H-BINSTD-193dd4
  source_idea: IDEA-20261002-5abffe
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Catalog floor versus the hour cap
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-8ee17f
  objective: >-
    Check the excess 4, the difference 5, and the product 20.
  inputs:
    n_sum: 59
    n_product: 7429
    gap_product: 8
    span: 6
    ell: 3
    cells: 3
    catalog: 12
    slots: 36
    slot_quot: 3
    hour_cap: 8
    catalog_excess: 4
    hour_minus_ell: 5
    excess_product: 20
    catalog_quot: 4
  controls:
    - >-
      Twelve minus 8 is 4. Reporting 12 as 8 invalidates the run.
    - >-
      Eight minus 3 is 5. The product of 4 and 5 is 20. Twelve
      divided by 3 is 4.
    - >-
      Three times 12 is 36, and 36 divided by 12 is 3. The n sum is
      59 and the n product is 7429. The gap product is 8.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {catalog, excess, product}
    - route in {difference, product}
  metrics:
    primary:
      - catalog_excess
      - excess_product
      - implementations_agree
    secondary:
      - slots
      - hour_minus_ell
      - n_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Twelve exceeds 8 by 4. Eight exceeds 3 by 5. The product of 4
      and 5 is 20.
    formula: >-
      Subtract 8 from 12. Subtract 3 from 8. Multiply 4 and 5.
      Divide 36 by 12.
    source: >-
      IDEA-20261002-5abffe states the n list, the dimension 3, the
      catalog floor 12, and the hour cap 8, read 2026-10-03. It does
      not name the overshoot floor. The products were recomputed in
      this design session. That computation is not a run. No system
      was solved.
  scale_relevance:
    tier: toy
    justification: Three listed n values and one written catalog floor. No transfer to a degree gap.
    correspondence: null
  tail_checks:
    - The product 20 and the difference 5 are required. A check that stops at the excess 4 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the excess 4 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The excess is not 4.
    - Eight minus 3 is not 5.
    - The product is not 20.
    - A system is solved, or 12 is reported as 8.
  success_criterion: >-
    Both runs agree that 12 minus 8 is 4, that 8 minus 3 is 5, that
    3 times 12 is 36, and that the product of 4 and 5 is 20.
  falsification_criterion: >-
    The runs agree that 12 minus 8 is computed, and that difference
    is not 4.
  required_artifacts:
    - experiments/EXP-BINSTD-ad3c74/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-ad3c74/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-ad3c74/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-ad3c74/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-ad3c74/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-ad3c74/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any Groebner solve, degree reading, or predictor evaluation.
    - Any claim that a regularity prediction overshoots a solving degree.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
