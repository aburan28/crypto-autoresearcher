# EXP-SSI-435a2c
# Two-step multiplicity-weighted walk on the toy Phi_2 graph.
# Frozen before any run. Distances below are a prediction, not a result.
experiment:
  id: EXP-SSI-435a2c
  hypothesis_id: H-SSI-8d940f
  source_idea: IDEA-20261004-a09dd4
  question_id: RQ-SSI-1946c9
  goal_id: GOAL-SSI-2fa82a
  version: 1
  title: >-
    Total variation of a weighted Phi_2 walk at p=7, 11, 19
  status: approved
  frozen: true
  designed_at: '2026-10-05'
  approved_by: coordinator
  approval_decision_id: DEC-20261005-92a50c
  objective: >-
    Build the multiplicity-weighted Phi_2 transition matrix on
    each frozen supersingular set, start from uniform, and record
    the position law at times 0, 1, and 2.
  inputs:
    primes: [7, 11, 19]
    supersingular_j:
      7: [6]
      11: [0, 1]
      19: [7, 18]
    times: [0, 1, 2]
    phi2: >-
      -X^2 Y^2 + X^3 + Y^3 + 1488 X^2 Y + 1488 X Y^2
      - 162000 X^2 - 162000 Y^2 + 40773375 X Y
      + 8748000000 X + 8748000000 Y - 157464000000000
    predicted_weights:
      7: {6: {6: 3}}
      11: {0: {0: 0, 1: 3}, 1: {0: 2, 1: 1}}
      19: {7: {7: 2, 18: 1}, 18: {7: 2, 18: 1}}
    predicted_mass:
      7:
        - {6: "1"}
        - {6: "1"}
        - {6: "1"}
      11:
        - {0: "1/2", 1: "1/2"}
        - {0: "1/3", 1: "2/3"}
        - {0: "4/9", 1: "5/9"}
      19:
        - {7: "1/2", 18: "1/2"}
        - {7: "2/3", 18: "1/3"}
        - {7: "2/3", 18: "1/3"}
    predicted_total_variation:
      7: ["0", "0", "0"]
      11: ["0", "1/6", "1/18"]
      19: ["0", "1/6", "1/6"]
  controls:
    - >-
      One-vertex control. At p=7 the only state is 6, every
      distance is 0, and the row sum is 3.
    - >-
      Equal-row control. At p=19 both rows are multiplicity
      2 toward 7 and 1 toward 18, so the laws at times 1 and 2
      are equal and the distance stays 1/6.
    - >-
      Moving-row control. At p=11 the distance is 0, then 1/6,
      then 1/18.
    - >-
      Two formulas. One evaluates the monomial Phi_2. The other
      evaluates the cubic in Y with coefficients
      1,
      -X^2 + 1488 X - 162000,
      1488 X^2 + 40773375 X + 8748000000,
      X^3 - 162000 X^2 + 8748000000 X - 157464000000000.
      They must not import each other's weights.
  independent_variables:
    - prime in {7, 11, 19}
    - phi2_formula in {monomial, cubic}
  metrics:
    primary:
      - weights
      - position_mass
      - total_variation
      - routes_agree
    secondary:
      - row_multiplicity_sum
      - time2_equals_time1
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: >-
      Weights, position masses, and total variation under inputs.
      Distances are 0, 0, 0 at p=7; 0, 1/6, 1/18 at p=11; and
      0, 1/6, 1/6 at p=19.
    formula: >-
      The start is uniform. One step multiplies by the row-
      normalized multiplicity matrix. Total variation against
      uniform is half the L1 distance. Masses are exact rationals
      written in lowest terms.
    source: >-
      IDEA-20261004-a09dd4, specialized to this weighted Phi_2
      graph and to times 0, 1, and 2. The distances were computed
      in the design session and are not a run.
  scale_relevance:
    tier: toy
    justification: >-
      Three primes and at most two states. No transfer to a
      cryptographic key distribution.
    correspondence: null
  tail_checks:
    - >-
      p=7 and p=19 must both be reported. Dropping either control
      invalidates the batch.
    - >-
      Every row of multiplicities sums to 3, and every positive
      multiplicity lands inside S_p.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: >-
      Deterministic. One manifest per prime and Phi_2 formula.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - Stop after six valid manifests.
    - Do not add a prime, a time, or a state.
    - Do not continue a cell after the formulas disagree.
  invalidation_rules:
    - The two Phi_2 formulas disagree.
    - A positive multiplicity points outside S_p.
    - A row of multiplicities does not sum to 3.
    - Multiplicity is replaced by a 0-1 edge.
    - A timeout, crash, or missing manifest.
  success_criterion: >-
    All six manifests are valid, the formulas agree, the weights
    and position masses match, every row sums to 3, and the total
    variations are 0, 0, 0 at p=7, 0, 1/6, 1/18 at p=11, and
    0, 1/6, 1/6 at p=19.
  falsification_criterion: >-
    The formulas agree, every row sums to 3, and any weight,
    position mass, or total variation differs from the table.
    A formula disagreement or a row-sum failure does not meet
    this criterion.
  required_artifacts:
    - experiments/EXP-SSI-435a2c/runs/<run-id>/command.txt
    - experiments/EXP-SSI-435a2c/runs/<run-id>/stdout.txt
    - experiments/EXP-SSI-435a2c/runs/<run-id>/stderr.txt
    - experiments/EXP-SSI-435a2c/runs/<run-id>/result.json
    - experiments/EXP-SSI-435a2c/runs/<run-id>/walk.json
  assigned_to: executor
  out_of_scope:
    - The compilers T_id, T_collapse, and T_forget.
    - Any prime outside {7, 11, 19}.
    - Any time outside {0, 1, 2}.
    - A SÉTA, LIT-SiGamal, or EndRing-hardness claim.
    - Editing the three-compiler contract.
