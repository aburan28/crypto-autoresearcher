# EXP-PAIR-cc5e99
# Null monic polynomials on the twelve large split primes.
# Frozen before any run. The table is a prediction, not a result.
experiment:
  id: EXP-PAIR-cc5e99
  hypothesis_id: H-PAIR-c5e676
  source_idea: IDEA-20261005-3a18d1
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-PAIR-001
  version: 1
  title: >-
    Null polynomial norm-equation misses on the twelve split primes
  status: approved
  frozen: true
  designed_at: '2026-10-05'
  approved_by: coordinator
  approval_decision_id: DEC-20261005-3052cb
  objective: >-
    Build the twelve monic null polynomials from the frozen
    coefficient stream and count their norm-equation hits.
  inputs:
    weierstrass: >-
      j = 0 gives y^2 = x^3 + 1. j = 1728 gives y^2 = x^3 + x.
      Otherwise k = j / (1728 - j) and the model is
      y^2 = x^3 + 3*k*x + 2*k.
    coefficient_rule: >-
      k starts at 0. Each lower coefficient is (37*k + 11) mod p,
      then k increases by 1. Coefficients are stored constant
      term first. The polynomial is monic of the listed degree.
      k is not reset between cells.
    comparison_baseline: >-
      EXP-PAIR-c28df1 predicts that the class polynomial passes
      all 12 of these cells. This record does not recompute that
      arm. The null passes 0.
    cells:
      - {D: -7, p: 32771, degree: 1, coeffs: [11], roots: 1, hit_traces: 0}
      - {D: -7, p: 524309, degree: 1, coeffs: [48], roots: 1, hit_traces: 0}
      - {D: -7, p: 8388619, degree: 1, coeffs: [85], roots: 1, hit_traces: 0}
      - {D: -7, p: 134217757, degree: 1, coeffs: [122], roots: 1, hit_traces: 0}
      - {D: -23, p: 32783, degree: 3, coeffs: [159, 196, 233], roots: 0, hit_traces: 0}
      - {D: -23, p: 524389, degree: 3, coeffs: [270, 307, 344], roots: 0, hit_traces: 0}
      - {D: -23, p: 8388637, degree: 3, coeffs: [381, 418, 455], roots: 3, hit_traces: 0}
      - {D: -23, p: 134217823, degree: 3, coeffs: [492, 529, 566], roots: 0, hit_traces: 0}
      - {D: -47, p: 32843, degree: 5, coeffs: [603, 640, 677, 714, 751], roots: 1, hit_traces: 0}
      - {D: -47, p: 524341, degree: 5, coeffs: [788, 825, 862, 899, 936], roots: 2, hit_traces: 0}
      - {D: -47, p: 8388619, degree: 5, coeffs: [973, 1010, 1047, 1084, 1121], roots: 1, hit_traces: 0}
      - {D: -47, p: 134218171, degree: 5, coeffs: [1158, 1195, 1232, 1269, 1306], roots: 3, hit_traces: 0}
    predicted_passes: 0
    predicted_cells_with_root_and_no_hit: 9
    predicted_zero_root_cells: 3
    final_k: 36
  controls:
    - >-
      The four degree-1 cells each have one root. A missing root
      there invalidates the stream.
    - >-
      A cell with zero roots contributes zero hits and is not
      counted among the nine rooted misses.
    - >-
      Both twists of every root are scored. Scoring one model
      only is invalid.
  independent_variables:
    - cell index in the frozen list
  metrics:
    primary:
      - null_passes
      - rooted_misses
    secondary:
      - root_counts
      - hit_traces
  heuristic_under_test: HEUR-CM-SPLIT-1
  preregistered_prediction:
    quantity: >-
      Null passes 0 of 12. Root counts are 1, 1, 1, 1, 0, 0, 3,
      0, 1, 2, 1, 3. Rooted misses are 9. Hit traces are 0 on
      every cell.
    formula: >-
      A hit trace means (trace^2 - 4p) / D is a nonnegative
      square. A cell passes when it has at least one hit trace.
    source: >-
      IDEA-20261005-3a18d1 null-polynomial control, specialized
      to the split primes of EXP-PAIR-c28df1 and the stream
      c = (37*k + 11) mod p. The counts were computed in the
      design session and are not a run.
  scale_relevance:
    tier: toy
    justification: >-
      The primes are the twelve already named, the largest being
      134218171. One stream is not a sample of monic polynomials.
    correspondence: null
  tail_checks:
    - >-
      The last cell has three roots and zero hits. Dropping it
      invalidates the rooted-miss count.
    - >-
      The three zero-root cells stay in the pass count. They are
      not rewritten as empty failures of a different kind.
  replication:
    seeds: [0]
    independent_instances: 1
    replication_note: >-
      Deterministic. The seed is the starting index k = 0.
      There is no second draw.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one valid manifest covering all twelve cells.
    - Do not draw a second stream.
    - Do not add a prime.
  invalidation_rules:
    - A coefficient differs from the frozen list.
    - A root count differs from the frozen list.
    - One twist of a root is not counted.
    - A timeout, crash, or missing manifest.
  success_criterion: >-
    The manifest is valid. Root counts match. Hit traces are 0
    on every cell. Passes are 0. Rooted misses are 9. Zero-root
    cells are 3.
  falsification_criterion: >-
    The coefficients and root counts match, and one twist trace
    solves the norm equation. A root-count mismatch does not
    meet this criterion.
  required_artifacts:
    - experiments/EXP-PAIR-cc5e99/runs/<run-id>/command.txt
    - experiments/EXP-PAIR-cc5e99/runs/<run-id>/stdout.txt
    - experiments/EXP-PAIR-cc5e99/runs/<run-id>/stderr.txt
    - experiments/EXP-PAIR-cc5e99/runs/<run-id>/result.json
  assigned_to: executor
  out_of_scope:
    - Recomputing the class-polynomial traces in EXP-PAIR-c28df1.
    - The height regression of EXP-PAIR-894a7f.
    - The inert cells.
    - A second random stream.
    - A pairing value or a discrete logarithm.
    - Editing any other PAIR contract.
