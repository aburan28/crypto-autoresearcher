experiment:
  id: EXP-SHATHREE-1ec801
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-26ef21; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-26ef21
  question_id: RQ-SHATHREE-cd2cb2
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Certificate-first round-reduced Keccak collision harness with a frozen CNF encoding and a
    four-decade solver-budget ladder, measuring whether maximum reachable round count moves with budget
    against random-constant and random-permutation nulls
  objective: 'The uncertainty a run reduces is whether the round-count ceiling this repository''s
    own search apparatus hits is set by the apparatus or by the object, at round counts far below
    anything of security interest. (i) It establishes that a round-reduced Keccak collision harness
    exists here at all and is calibrated: the r = 1 arm must produce verified literal message pairs
    at the smallest budget under every seed, and every SAT answer at every round count must survive
    re-verification by an implementation independent of the one inside the search, with any failure
    halting the run rather than being reported. (ii) It measures the response surface P(success |
    conflicts) at r = 1, 2, 3, 4 for all four digest sizes and both round-constant windows, with the
    CNF frozen and hashed per cell so that budget is provably the only variable that moves between
    rungs, and reports the single integer that discriminates the two regimes: maximum reachable r
    at 10^8 conflicts minus maximum reachable r at 10^4 conflicts. (iii) It runs the identical ladder
    against 100 random-constant schedules and a randomised Keccak-shaped permutation in the same invocation,
    so that any curve feature attributed to SHA-3 is separated from a feature of the encoding and
    the solver. Every negative cell is recorded as a budget outcome about a solver, never as mathematical
    evidence, per AGENTS.md rule 3.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: ''under this specific CNF encoding,
      this pinned solver version and these declared budgets and seeds, verified round-reduced collision
      certificates were obtained for the following (round count, digest size) cells, and the maximum
      reachable round count did or did not move across four decades of budget, with the null arms
      at the following positions.'' What does NOT follow: that a collision does or does not exist
      at any round count where none was found; that any published attack is confirmed, contradicted
      or reproduced; that any digest size is easier or harder; anything at all about full 24-round
      SHA-3, SHAKE, or any deployed use; and any statement about SHA-3''s security margin.'
  inputs:
    procedure: 'STAGE 0 (cost: ~3h human, minutes CPU). Pin the pure-Python FIPS 202 implementation;
      validate all four digests plus SHAKE against hashlib on four message lengths. Abort on mismatch.
      STAGE 1 (cost: ~4h human). Expose the round count r as a parameter with two declared windows
      (first r constants, last r constants); verify that r = 24 with the first window reproduces hashlib
      exactly. STAGE 2 (cost: ~8h human, minutes CPU per cell). Write a frozen Tseitin CNF encoder
      for the r-round sponge and the digest-equality condition; record the CNF SHA-256, variable count
      and clause count per cell. STAGE 3 (cost: ~30 min CPU). Run the minimal design: SHA3-256, r
      = 1, 2, 3, budgets 10^4 and 10^7, five seeds. Halt the whole experiment unless the r = 1 arm
      succeeds under every seed with verifying certificates. STAGE 4 (cost: ~20h CPU). Run the full
      ladder: r = 1..4, four digest sizes, two windows, budgets 10^4..10^8, 20 seeds -- 800 invocations
      under the declared wall-clock ceiling. STAGE 5 (cost: ~10h CPU). Run NULL-CONST (100 random
      schedules at r = 1..4, budgets 10^4 and 10^8, 5 seeds) and NULL-PERM (same grid) through the
      identical code path. STAGE 6 (cost: ~1h). Emit every verified message pair in hex in the run
      record, the full response surface, the CNF hashes and the run manifest.'
    instrument: Python 3.11; pure-Python FIPS 202 Keccak-f[1600] with a parameterised round count;
      hashlib as the independent verification oracle at r = 24 and for digest reconstruction; python-sat
      (pysat) with a pinned Cadical build for search; a hand-written Tseitin encoder for chi, theta,
      rho, pi and iota; numpy for bookkeeping. No Sage. Manifests, seeds, budgets and the inference
      block via harness/runner.py; identifiers via tools/allocate_id.py.
    parameters: 'Round counts r in {1, 2, 3, 4}. Digest sizes SHA3-224/256/384/512. Round-constant
      windows: first r and last r of the 24. Conflict budgets 10^4, 10^5, 10^6, 10^7, 10^8. Seeds:
      20 per cell for the FIPS arm, 5 per cell for null arms, PCG64-derived and declared before the
      run. Message space: two absorbed blocks of the relevant rate. Null arms: 100 random-constant
      schedules of matched support shape; one randomised Keccak-shaped permutation family with random
      5-bit chi and random rho offsets, 100 draws. Declared wall-clock ceiling 36 hours total.'
  controls:
  - 'r = 1 sanity arm: collisions must be found at the smallest budget by every seed, or the harness
    is broken and the run is void.'
  - 'Certificate control: every SAT answer decoded to a literal message pair and re-verified by hashlib-validated
    independent code; any failure halts the run.'
  - 'NULL-CONST: 100 random round-constant schedules of matched support shape, identical harness.'
  - 'NULL-PERM: Keccak-shaped permutation with randomised chi and rho, identical harness.'
  - 'Encoding-freeze control: the CNF file''s SHA-256 is recorded per cell and must be identical across
    all budget rungs for a given (r, digest size), so budget is the only thing that varies.'
  - 'Round-window control: first-r versus last-r round constants as a declared secondary arm.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): NULL-CONST: the identical harness, encoding, solver, budget ladder
    and seeds, run against Keccak-f[1600] with the 24 round constants replaced by fresh random constants
    of matched support shape (100 schedules). NULL-PERM: the identical harness run against a Keccak-shaped
    permutation whose chi is replaced by a random 5-bit permutation and whose rho offsets are randomised.
    For the FIPS arm to mean anything about SHA-3 specifically, its maximum-reachable-r and its curve
    shape must differ from the NULL-CONST distribution; if they coincide, the recorded result is a
    controlled null and the curve is a property of the encoding and the solver, not of the standard.
    The null arms are executed in the same invocation by the same code path with only the permutation
    object swapped, so they cannot be described-but-not-run.'
  independent_variables:
  - conflict budget
  - round count r
  - digest size
  - round-constant window (first r versus last r)
  - permutation arm in {FIPS, NULL-CONST, NULL-PERM}
  metrics:
    primary:
    - verified certificate count per cell
    - maximum reachable r per budget rung per arm
    - success probability versus budget curve
    - certificate re-verification failure count
    - 'the discrimination integer: max reachable r at 10^8 minus at 10^4'
    secondary:
    - CNF SHA-256, variable count and clause count per cell
    - conflicts, decisions and propagations consumed per invocation
    - solver termination reason per invocation
    - peak solver memory per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'The discrimination integer D = max{r : any verified certificate at 10^8 conflicts}
      - max{r : any verified certificate at 10^4 conflicts}, computed per digest size and per round-constant
      window.'
    formula: Under a budget-limited regime, max reachable r is modelled as approximately a + b*log10(budget)
      with b > 0, giving D approximately 4b > 0 across four decades. Under a structure-limited regime,
      max reachable r is modelled as a constant in budget, giving D = 0 while success probability
      at already-reachable r rises toward 1. The contract pre-commits to reporting D and the fitted
      b with its confidence interval, and pre-commits NOT to a value of D, because D is the unknown
      the experiment exists to measure and any pre-committed value would prejudge the discrimination.
    source: Pre-registered in the parent proposal IDEA-20260816-26ef21 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Round counts 1-4 out of 24, at full state width and full standardised rates. These
      round counts have no security meaning and are chosen because they are the regime where an instrument
      can be calibrated at all. Transfer assumption stated explicitly: NONE. The measured response
      surface characterises this harness at r <= 4 and is not extrapolated to any larger r, and certainly
      not to 24; the discrimination between regimes is claimed only within the tested range.'
    correspondence: null
  tail_checks:
  - Every emitted message pair must re-verify under hashlib-validated independent code; a single failure
    halts the run.
  - The r = 24 first-window reconstruction must match hashlib bit-for-bit before any search runs.
  - CNF hashes must be constant across budget rungs within a cell.
  - Solver termination reason must be recorded for every invocation, so an out-of-memory abort is
    never counted as an unsatisfiable answer.
  - Any UNSAT answer at r <= 2 must be treated as an encoder-bug alarm and investigated before the
    run continues.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt the entire experiment if the stage 3 r = 1 arm fails under any seed.
  - Halt immediately on any certificate re-verification failure.
  - Enforce the declared 36-hour total wall-clock ceiling; exceeding it terminates the run and every
    unfinished cell is recorded as not attempted, never as a negative.
  - No adaptive extension of budgets or seeds after seeing results.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run is successful if the r = 1 calibration passes, every emitted certificate
    re-verifies, CNF hashes are constant within cells, and the full response surface plus both null
    distributions are emitted for every attempted cell -- whether D is zero, positive, or undefined
    for lack of any success beyond r = 1.
  falsification_criterion:
  - The r = 1 arm fails at the smallest budget under any seed.
  - Any SAT answer fails independent certificate re-verification.
  - CNF hashes differ across budget rungs within a cell.
  - No cell at any budget or any arm produces a verified certificate.
  - FIPS, NULL-CONST and NULL-PERM show identical maximum reachable r at every budget -- controlled
    null, recorded as such.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-26ef21
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The CNF encoding of chi admits several Tseitin variants with very different solver behaviour;
    a Coordinator must approve one specific variant and record it, because the choice can dominate
    the budget effect the contract is trying to measure.
  - Whether the first-r or last-r round-constant window is the primary arm is not settled here and
    both are run; a Coordinator must designate the primary before the record is written.
  - The 36-hour ceiling and the 20-seed count are declared rather than derived from a power analysis,
    and a Coordinator should either accept them as declared budgets or replace them with a resolution
    requirement.
  - This contract deliberately does NOT attempt to reproduce a published attack, because RQ-SHATHREE-cd2cb2's
    first constraint forbids designing that experiment until the target attack is filed as a KN-LIT
    entry; that acquisition step remains unfilled.
