experiment:
  id: EXP-POLYMAC-d85614
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-8cb64b; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-8cb64b
  question_id: RQ-POLYMAC-7c89e4
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exact enumeration of multiplicative-order classes and clamped-residue intersections in matched
    binary-extension and prime authentication-key spaces, with generator-relabelling and random-subset
    nulls and a five-prime spread
  objective: The uncertainty reduced is whether the two constructions inherit the same weak-key exposure,
    expressed as counts rather than as citations. (i) Produce, for each tested bit width and each
    arm, the exact per-divisor count of authentication keys of order dividing d, verified twice -
    once by direct enumeration of every group element's order, once from the group-order factorisation
    - with exact agreement required, so that the primary numbers are self-checking. (ii) Produce the
    exact cardinality of the clamped residue set at each width and its exact intersection with every
    order class, since that intersection is the only quantity in this contract that is not derivable
    from group theory alone and is the specific thing distinguishing the prime arm. (iii) Place the
    two arms at matched log-cardinality and emit the cumulative exposure density as a function of
    target order, so that any asymmetry is a curve separation with both curves reproducible from their
    factorisations. The run does not reduce uncertainty about whether low order enables a cheaper
    forgery, which is a different predicate and a different contract.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: at bit widths 8, 12, 16 and
      20, with the pinned reduction polynomials and the five primes per width recorded, the density
      of authentication keys satisfying each declared weak-key predicate is exactly the tabulated
      value in each arm, and the clamped set''s intersection profile is exactly as tabulated. WHAT
      DOES NOT FOLLOW: nothing about the density at the deployed field sizes unless those factorisations
      were actually computed in the run and recorded; nothing about the probability any real key is
      weak; nothing about whether such a key permits a forgery at any cost; and no statement whatever
      about AES-GCM, ChaCha20-Poly1305, or any deployed key-generation procedure.'
  inputs:
    procedure: 'STAGE 0 (cost: under an hour, human): freeze the predicate list, the toy clamping
      rule, the reduction polynomials and the five-prime selection rule per width. STAGE 1 (cost:
      seconds to minutes): factor 2^n - 1 and p - 1 for every width and prime, recording each factorisation
      with the method used and halting rather than guessing if any fails. STAGE 2 (cost: seconds at
      n at most 16, under a minute at n = 20): enumerate every group element and compute its multiplicative
      order by repeated multiplication; tabulate per-divisor counts. STAGE 3 (cost: seconds): derive
      the same counts from the factorisation and require exact agreement. STAGE 4 (cost: seconds):
      apply the toy clamping mask, count survivors by bit arithmetic and by enumeration, require agreement,
      then intersect with every order class. STAGE 5 (cost: same as stages 2 to 4): run NULL A (generator
      relabelling) and NULL B (random subset of matched cardinality) through the identical code path
      in the same process. STAGE 6 (cost: seconds): run the wrong-reduction-polynomial positive control.
      STAGE 7 (cost: minutes): emit the exposure curves at matched log-cardinality, the prime-choice
      spread, and the run manifest.'
    instrument: 'Python 3 standard library: integer arithmetic for the prime arm, shift-and-XOR carry-less
      multiplication with a pinned reduction polynomial for the binary arm, sympy or a hand-rolled
      Pollard rho plus trial division for the group-order factorisations with the method recorded
      per factorisation. Order computation both by naive repeated multiplication over all elements
      and by divisor testing against the factored order. Run manifest and inference block via harness/runner.py.
      No Sage, no network, no remembered constants.'
    parameters: 'Bit widths n in {8, 12, 16, 20}. Binary arm: GF(2^n) with one pinned irreducible
      polynomial per width, group order 2^n - 1. Prime arm: the five largest primes below 2^n per
      width, group order p - 1 each. Toy clamping rule: the declared proportional analogue of the
      full clamping mask, clearing the same fractional bit positions, frozen in the specification.
      Target order ladder T over all divisors of each group order. NULL A: 8 random generator relabellings
      per group. NULL B: 32 random subsets per width at the clamped cardinality. Positive control:
      2 deliberately reducible polynomials per width.'
  controls:
  - 'NULL A: generator relabelling of the same cyclic group, counts must be bit-identical.'
  - 'NULL B: uniformly random subset of the prime field with the clamped set''s exact cardinality,
    same intersection code.'
  - Enumeration-versus-lattice cross-check at every toy width, required exact.
  - A deliberately wrong reduction polynomial for the binary arm, which yields a ring rather than
    a field, must produce a count that violates the cyclic-group prediction - a positive control that
    the counter can detect non-field structure.
  - Independent second implementation of the order computation (by factoring the group order and testing
    divisors) cross-checked against the naive repeated-multiplication order computation on all elements
    at n = 12.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both run by the identical counting code in the same invocation.
    NULL A: a cyclic group of the same order with a randomly chosen generator relabelling - the lattice
    and every count must come out IDENTICAL, because the counts are generator-independent; any difference
    is a bug in the counter, and this is the sharpest available check that the counter counts structure
    and not representation. NULL B: a uniformly random subset of the prime field with exactly the
    cardinality of the clamped set, intersected with the same order classes - the intersection densities
    must match the unconstrained densities to within hypergeometric sampling error. For the signal
    arm to mean anything, NULL B must show NO enrichment: if the random subset shows the same intersection
    profile as the clamped set, then clamping contributes nothing beyond its cardinality and that
    is the finding. If clamping shows a departure from NULL B beyond the hypergeometric interval,
    the departure is the measured structure.'
  independent_variables:
  - arm (binary extension, prime, NULL A, NULL B, reducible-polynomial control)
  - bit width n
  - choice of prime within a width
  - target order T
  metrics:
    primary:
    - per-divisor count of elements of order dividing d, enumerated
    - per-divisor count derived from the factorisation
    - clamped-set cardinality, exact
    - clamped-set intersection count per order class
    - cumulative exposure density versus T at matched log-cardinality, per arm
    secondary:
    - spread of the prime arm's exposure curve across the five primes
    - NULL A discrepancy per node
    - NULL B intersection profile and hypergeometric interval
    - factorisation wall clock and method per group order
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The cumulative exposure density D_arm(T) = (number of authentication keys of multiplicative
      order at most T, after the arm's key constraint) divided by (size of the arm's constrained key
      space), for both arms at matched log-cardinality, and the ratio D_binary(T) divided by D_prime(T)
      across the tested T ladder.
    formula: For a cyclic group of order N, the number of elements of order dividing d equals d exactly
      for every divisor d of N, so D before clamping is a sum of divisor terms with Moebius weights
      over the order lattice; the contract predicts exact agreement between this derivation and direct
      enumeration, with zero tolerance. After clamping, D is predicted to equal the unconstrained
      D to within the hypergeometric interval implied by the clamped cardinality - that is the NULL
      B prediction, and a departure from it is the measured structure of clamping.
    source: Pre-registered in the parent proposal IDEA-20260816-8cb64b before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at bit widths 8 to 20, chosen because the entire multiplicative group is
      enumerable there so every count is verified twice rather than derived once. There is NO extrapolation
      to deployed widths: the deployed-width lattices are reported only if their group-order factorisations
      are computed inside the run, and otherwise are recorded as not obtained. The transfer assumption
      that is made and must be judged is narrower - that the toy clamping rule constrains the same
      fractional bit positions as the full rule, which is a declared analogue, not a theorem.'
    correspondence: null
  tail_checks:
  - divisor d = 1 must give exactly one element (the identity) in every arm
  - divisor d = N must give exactly N elements, i.e. the whole group
  - the largest prime divisor class must be checked against a separate direct computation, since it
    is where enumeration and lattice derivation are most likely to diverge
  - the clamped set at the smallest width must be listed element by element and checked by hand-countable
    inspection
  - a width where p - 1 is smooth and one where it is not must both appear in the five-prime spread,
    or the spread is reported as unrepresentative
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - halt and report if any group-order factorisation fails within 300 seconds, recording that width
    as unmeasured rather than estimating
  - halt immediately on any enumerated-versus-derived count discrepancy
  - cap total run at 1800 seconds; on exceeding it drop the n = 20 prime spread to a single prime
    and record the reduction
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Enumerated and factorisation-derived counts agree exactly in every divisor class
    at every tested width and arm, NULL A discrepancy is exactly zero, the reducible-polynomial control
    violates the cyclic prediction, and the two arms' cumulative exposure curves are emitted at matched
    log-cardinality with the five-prime spread shown.
  falsification_criterion:
  - any enumerated-versus-derived count discrepancy
  - nonzero NULL A discrepancy
  - clamped cardinality by bit arithmetic disagrees with enumeration
  - the reducible-polynomial control does not violate the cyclic prediction
  - the prime-choice spread exceeds the binary-versus-prime separation, making the asymmetry an artifact
    of prime selection
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-8cb64b
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The toy clamping rule must be ratified by the Coordinator as a faithful proportional analogue
    before it is frozen; this record proposes a rule but does not have the authority to bless it.
  - The predicate list beyond multiplicative order (subfield membership, sparse-polynomial roots)
    needs a Coordinator ruling on which are in scope, since each adds a full counting pass.
  - Whether deployed-width factorisations are attempted at all, and under what budget, is a Coordinator
    decision with a real risk of unbounded cost.
  - The matched-log-cardinality comparison rule must be fixed identically to the rule chosen for the
    ratio-surface contract in this batch, or the two records will not compose.
