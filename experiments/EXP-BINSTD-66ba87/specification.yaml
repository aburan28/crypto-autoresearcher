# EXP-BINSTD-66ba87
# Divisor-lattice certificate. Collapse cells stay conditional.
# Approved by DEC-20261001-16412c.
experiment:
  id: EXP-BINSTD-66ba87
  hypothesis_id: H-BINSTD-201c93
  source_idea: IDEA-20260922-d11575
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Divisor dichotomy of 16k for five composite ANSI degrees
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-16412c
  objective: >-
    Enumerate the positive divisors of 16k for five odd primes k and for the
    composite control k = 15. Classify each prime-k divisor as collapse
    candidate, live-lane candidate, or ambient degree. Tag collapse candidates
    as conditional on EXP-BINSTD-de887b.
  inputs:
    rows:
      - {k: 11, N: 176, divisors: [1, 2, 4, 8, 11, 16, 22, 44, 88, 176]}
      - {k: 13, N: 208, divisors: [1, 2, 4, 8, 13, 16, 26, 52, 104, 208]}
      - {k: 17, N: 272, divisors: [1, 2, 4, 8, 16, 17, 34, 68, 136, 272]}
      - {k: 19, N: 304, divisors: [1, 2, 4, 8, 16, 19, 38, 76, 152, 304]}
      - {k: 23, N: 368, divisors: [1, 2, 4, 8, 16, 23, 46, 92, 184, 368]}
    collapse_candidates: [1, 2, 4, 8, 16]
    control: {k: 15, N: 240}
    conditional_on: EXP-BINSTD-de887b
  controls:
    - >-
      k = 15 nearby object. The divisor set of 240 must differ from
      {1, 2, 4, 8, 16, 15, 30, 60, 120, 240}. Equality invalidates the run.
    - Two enumerations, one ascending and one descending. They must not import each other.
    - >-
      Every collapse candidate carries conditional_on EXP-BINSTD-de887b.
      The label structurally_empty_unconditional invalidates the run.
  independent_variables:
    - k in {11, 13, 17, 19, 23, 15}
    - enumeration direction
  metrics:
    primary:
      - divisor_set
      - class_by_divisor
      - control_matches_prime_formula
      - collapse_tag
      - implementations_agree
    secondary:
      - live_lane_divisors
      - ambient_degree
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The five divisor sets and the k = 15 disagreement.
    formula: >-
      For odd prime k not dividing 16, the divisors of 16k are
      {1, 2, 4, 8, 16} times {1, k}.
    source: >-
      IDEA-20260922-d11575 claim (C1), restricted to the integer lattice.
      Design-time enumeration matched the five lists and rejected k = 15.
      That enumeration is not a run of this experiment.
  scale_relevance:
    tier: crypto
    justification: >-
      The five degrees are the deployed composite ANSI extension degrees.
      The work is integer enumeration. No curve arithmetic is performed.
    correspondence: null
  tail_checks:
    - k = 23, N = 368 is the largest. Both directions must include 368 and 23.
  replication:
    seeds: []
    independent_instances: 5
    replication_note: Deterministic. The second run is the opposite enumeration direction.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the k = 15 control matches the prime formula, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either implementation imports the other.
    - control_matches_prime_formula is true.
    - Any collapse cell is labeled structurally_empty_unconditional.
    - The output states a genus, a Gaudry cost, or a discrete logarithm.
  success_criterion: >-
    Both runs agree, every prime-k divisor set equals its preregistered list,
    classes match collapse candidate, live lane, or ambient, the k = 15
    control does not match the prime-k formula, and every collapse candidate
    is tagged conditional_on EXP-BINSTD-de887b.
  falsification_criterion: >-
    The implementations agree, the k = 15 control fails the prime formula,
    the collapse tag is conditional, and at least one prime-k divisor set
    differs from the preregistered list.
  required_artifacts:
    - experiments/EXP-BINSTD-66ba87/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-66ba87/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-66ba87/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-66ba87/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-66ba87/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-66ba87/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Artin-Schreier level m and genus bounds.
    - Literature comparison with MMT.
    - An unconditional structurally-empty verdict.
