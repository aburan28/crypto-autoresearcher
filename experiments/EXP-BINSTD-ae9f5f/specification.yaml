# EXP-BINSTD-ae9f5f
# Slope-cap arithmetic. No last-fall oracle.
# Approved by DEC-20261003-8c844e.
experiment:
  id: EXP-BINSTD-ae9f5f
  hypothesis_id: H-BINSTD-034731
  source_idea: IDEA-20261001-214fd3
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Slope-cap excess and allowed rise
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-8c844e
  objective: >-
    Check the unit excess 6, the product 435456, and the rise
    shortfall 3.
  inputs:
    n_min: 17
    n_max: 31
    span: 14
    ceiling: 8
    cap_den: 20
    unit_excess: 6
    allowed_num: 7
    allowed_den: 10
    rise_shortfall: 3
    gap_17_19: 2
    gap_19_23: 4
    gap_23_29: 6
    gap_29_31: 2
    excess_17_19: 18
    excess_19_23: 16
    excess_23_29: 14
    excess_29_31: 18
    gap_product: 435456
    n_count: 5
    bound_count: 1
  controls:
    - >-
      Thirty-one minus 17 is 14. A one-unit rise has slope 1 over
      14. The cap is 1 over 20. Twenty minus 14 is 6. Reporting the
      unit rise as inside the cap invalidates the run.
    - >-
      The consecutive gaps are 2, 4, 6, and 2. Twenty minus each of
      those gaps is 18, 16, 14, and 18. The product of 6, 18, 16,
      14, and 18 is 435456.
    - >-
      Fourteen over 20 reduces to 7 over 10. Ten minus 7 is 3.
      Reporting the allowed rise as at least 1 invalidates the run.
    - >-
      The ceiling 8 does not contain n, so the distinct bound count
      is 1 across the five cells.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {span, rise, cells}
    - route in {cross_excess, reduced_rise}
  metrics:
    primary:
      - unit_excess
      - gap_product
      - implementations_agree
    secondary:
      - rise_shortfall
      - n_count
      - bound_count
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The unit excess is 6. The product of the five excesses is
      435456. The allowed rise falls short of 1 by 3.
    formula: >-
      Subtract 17 from 31, then subtract that span from 20.
      Separately reduce 14 over 20 and subtract the numerator from
      the denominator.
    source: >-
      IDEA-20261001-214fd3 states the n list, the ceiling 8, and
      the slope cap 0.05, read 2026-10-03. The gaps were recomputed
      in this design session. That computation is not a run. No
      last-fall degree was measured.
  scale_relevance:
    tier: toy
    justification: Five listed n values and one written cap. No transfer to a solver.
    correspondence: null
  tail_checks:
    - The rise shortfall 3 and the bound count 1 are required. A check that stops at the excess 6 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the unit excess 6 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The unit excess is not 6.
    - The product is not 435456.
    - The rise shortfall is not 3.
    - A last-fall degree is measured, or the ceiling 8 is reported as a measured degree.
  success_criterion: >-
    Both runs agree that 31 minus 17 is 14, that 20 minus 14 is 6,
    that the consecutive excesses are 18, 16, 14, and 18, that their
    product with 6 is 435456, and that 7 over 10 falls short of 1
    by 3.
  falsification_criterion: >-
    The runs agree that 31 minus 17 is 14, and 20 minus 14 is not 6.
  required_artifacts:
    - experiments/EXP-BINSTD-ae9f5f/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-ae9f5f/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-ae9f5f/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-ae9f5f/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-ae9f5f/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-ae9f5f/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any last-fall oracle, Macaulay matrix, or solver.
    - Any claim that a last-fall degree stays bounded.
    - Any comparison with rho.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
