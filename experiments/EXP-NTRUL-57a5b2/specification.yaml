experiment:
  id: EXP-NTRUL-57a5b2
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-c01dc8; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-c01dc8
  question_id: RQ-NTRU-9015ee
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Implement and calibrate a seven-invariant lattice-control matching checker, audit the two
    named NTRU control constructions against it across a parameter grid, and test whether the most-failed
    invariant moves a downstream measurement
  objective: 'The uncertainty reduced is whether the control lattices this goal relies on are matched
    in any checkable sense, and whether their mismatches are material. (i) Can the seven invariants
    be computed exactly and cheaply at the dimensions used here, and does the identity null establish
    a noise floor low enough that the declared tolerances are meaningful rather than vacuous, since
    a tolerance above the sampling noise makes every control pass by construction; (ii) which invariants
    do the uniform random q-ary control and the independent-plant control actually fail against an
    NTRU signal arm, at what rates and with what discrepancies across n and q, producing a mismatch
    budget table that later contracts can cite instead of asserting matching; (iii) does the most-failed
    invariant move a downstream quantity, tested by constructing two controls differing only in it
    and running the covolume advantage envelope on both, since an invariant that no downstream measurement
    can see is advisory and should be labelled as such rather than enforced. The stage order is load-bearing:
    tolerances are fixed from the identity null before any audit cell is computed, so that the audit
    cannot be tuned to its own result.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable claim: for the generators as implemented,
      at the tested n and q, control C fails invariants I with discrepancies D at rates R, the identity-null
      noise floor is F, and the downstream envelope crossing shifts by S when only invariant I* differs.
      What does NOT follow: that any control is valid or invalid overall, since seven invariants do
      not characterise a lattice; that any existing proposal''s conclusions are wrong, since none
      have been run; anything about NTRU security, structure or attack cost; and anything about controls
      in other areas of this repository, whose matching notions differ.'
  inputs:
    procedure: 'STAGE 0, cost hours of implementation: implement the seven invariant computations,
      two independent Smith normal form routines, and the checker returning per-invariant signed discrepancies
      rather than a Boolean. STAGE 1, cost minutes: seed-determinism assertion on every generator;
      abort if any generator is not reproducible from its seed. STAGE 2, cost minutes: identity null
      at three seeds per n for each generator, fixing the per-invariant noise floor; tolerances are
      then set to a declared multiple of the floor and frozen. STAGE 3, cost minutes: deliberately
      broken control differing only in planted rank; require exactly one flag. STAGE 4, cost up to
      hours dominated by Smith normal form at n = 64: the audit grid, n in {16, 32, 64} by q in {2^8,
      2^13, 2^18} by two controls, 50 instance pairs per cell, tabulating per-invariant pass rates
      and mean discrepancies. STAGE 5, cost minutes: cross-check the two Smith normal form routines
      on a 10 percent subsample, requiring exact agreement. STAGE 6, cost minutes: materiality arm,
      two controls differing only in the most-failed invariant, covolume envelope computed on 200
      instances each, reporting the crossing shift against the per-key interquartile range.'
    instrument: Pure Python 3, exact integer arithmetic throughout; rational arithmetic via fractions
      for the input-basis Gram-Schmidt so that no floating point enters any invariant. Two Smith normal
      form implementations, one fraction-free elimination and one modular, written independently so
      their agreement is a real check. The checker and the generators live in a new harness/ module
      and are importable by any later contract as a gate. harness/runner.py wraps runs and captures
      manifests. No Sage, no external linear-algebra or lattice library, and no reduction algorithm
      is needed anywhere in this contract.
    parameters: n in {16, 32, 64}; q in {2^8, 2^13, 2^18}; two control constructions, uniform random
      q-ary and independent-plant; 50 instance pairs per cell for the audit; 3 seeds per generator
      per n for the identity null; one broken control differing only in planted rank; 200 instances
      per arm in the materiality step; tolerances set at 3 times the identity-null noise floor per
      invariant and frozen before STAGE 4.
  controls:
  - Identity null, generator against itself at different seeds, fixing the noise floor and gating
    the tolerances.
  - Deliberately broken control differing in exactly one known invariant by a known amount, testing
    per-coordinate attribution.
  - Two independent Smith normal form implementations cross-checked on a subsample, since a wrong
    normal form would produce confident nonsense.
  - 'Materiality arm: two controls differing only in the most-failed invariant, run through one downstream
    measurement.'
  - 'Seed determinism check: every generator re-run with the same seed must produce the identical
    instance, asserted before the audit.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The identity null: run the checker on a generator against itself, with
    different seeds. Every invariant must pass at its declared tolerance, and the measured discrepancies
    give the sampling noise floor below which no mismatch can be claimed. This is the forced null
    that gates the tool. The second null is a deliberately broken control: a generator that differs
    in exactly one known invariant by a known amount, for which the checker must flag that invariant
    and only that invariant. If the checker flags others, its invariants are entangled and the per-coordinate
    attribution in the propagation claim is unsound, which would be a finding about the tool rather
    than about any lattice.'
  independent_variables:
  - control construction in {uniform random q-ary, independent-plant, deliberately broken}
  - n in {16, 32, 64}
  - q in {2^8, 2^13, 2^18}
  - invariant index 1..7
  metrics:
    primary:
    - per-invariant pass rate by cell and control
    - signed discrepancy per invariant with CI
    - identity-null noise floor per invariant
    - flag count for the broken control
    - crossing shift in the materiality arm relative to the per-key IQR
    secondary:
    - Smith normal form cross-check agreement rate
    - wall-clock and integer bit-size growth in the Smith normal form at n = 64
    - seed-determinism assertion results
    - count of cells where a tolerance was hit exactly
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The per-invariant failure rate of each named control against the NTRU signal arm, and
      the downstream envelope crossing shift attributable to the most-failed invariant.
    formula: 'For invariant k, failure at a cell means |discrepancy_k| > 3 * floor_k, where floor_k
      is the maximum absolute discrepancy observed in the identity null for invariant k, fixed before
      the audit. Predicted: the uniform random q-ary control fails at least 2 of 7 at n = 32; the
      independent-plant control fails at least 1; the identity null fails 0; the broken control flags
      exactly 1.'
    source: Pre-registered in the parent proposal IDEA-20260816-c01dc8 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'n in {16, 32, 64}, lattice dimensions 32 to 128, chosen as the range where exact
      Smith normal form is comfortably affordable for 450 instance pairs. No extrapolation is made:
      the audit''s conclusions are about the generators at these sizes, and the contract requires
      any use of the checker at larger n to re-run its own identity null there, since the noise floor
      is size-dependent.'
    correspondence: null
  tail_checks:
  - Integer bit-size growth in the fraction-free Smith normal form at n = 64, measured before the
    full grid is launched.
  - Cells where a control passes every invariant, which would be the refuting outcome and must be
    examined rather than celebrated.
  - Instances where the plant is accidentally non-primitive, which changes two invariants at once
    and would confound the per-coordinate attribution.
  - The smallest n, where the identity-null noise floor may be so large that all tolerances are vacuous.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort if any generator fails seed determinism.
  - Abort if the identity null fails any invariant after tolerances are set from it, which would indicate
    a non-deterministic invariant computation.
  - Abort if the two Smith normal form routines disagree on any subsample instance.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Identity null passes with a measured floor, the broken control flags exactly
    one invariant, the audit grid completes, and a mismatch budget table plus the materiality shift
    are reported with CIs whatever their values.
  falsification_criterion:
  - Identity-null failure, invalidating the tolerance calibration.
  - Broken control flagging more than one invariant, falsifying per-coordinate attribution.
  - Both named controls passing all seven invariants at all cells, refuting the premise that matching
    is currently unchecked in a material way.
  - Smith normal form disagreement, invalidating the elementary-divisor coordinate.
  - No downstream sensitivity in the materiality arm, demoting the most-failed invariant to advisory.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-c01dc8
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The multiplier 3 on the noise floor is a convention and must be either derived or explicitly accepted
    as a convention by the Coordinator before STAGE 4.
  - Whether the input-basis profile belongs in the certificate at all needs a ruling, since it is
    a property of presentation rather than of the lattice and its inclusion changes what matched means.
  - The list of seven is asserted as necessary but no argument is given that it is the right seven;
    a Coordinator should decide whether an eighth, for instance the plant's angle distribution, is
    required before the checker is used as a gate elsewhere.
  - The materiality arm uses one downstream measurement; whether one is enough to demote an invariant
    to advisory is a judgement the Coordinator must make explicit.
