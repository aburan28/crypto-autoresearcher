experiment:
  id: EXP-SEMAEV-a097b5
  hypothesis_id: H-DTREE-001
  goal_id: GOAL-ECDLP-001
  version: 1
  title: Shared S4 substitution and target-subgroup factor-base correctness repair
  status: approved
  frozen: true
  approved_by: DEC-20260813-173d38
  approved_at: '2026-08-13'
  claim_tier: toy
  objective: >-
    Repair two deterministic shared-harness correctness defects without
    reinterpreting or rerunning any archived experiment: construct S4 with
    simultaneous symbolic substitution so all four variables survive, and add
    an opt-in target-subgroup factor-base mode while preserving the legacy
    full-curve default byte-for-byte. Add exact regression tests for the S4
    identity and the subgroup/cofactor boundary. This is implementation and
    unit-test work only; it is not an ECDLP experiment.
  source_records:
    - KN-OPEN-5b3a08
    - EV-DTREE-2e8f6a
    - DEC-20260809-91d4c7
    - CORR-20260809-f0f114
  inputs:
    shared_module: harness/semaev.py
    shared_tests: tests/test_harness.py
    local_reference: experiments/EXP-DTREE-001/implementation/semaev_fix.py
    deterministic_s4_fixture:
      curve: {p: 101, a: 2, b: 3}
      x_coordinates: [1, 3, 5, 41]
      expected_value_mod_p: 0
    deterministic_subgroup_fixture:
      generator_call: generate_instance(seed=1, field_bits=6)
      subgroup_order: 11
      cofactor: 5
      expected_nonzero_subgroup_x_coordinates: [12, 13, 18, 24, 33]
  implementation_contract:
    s4:
      required_change: >-
        Apply the x1->x3, x2->x4, x3->t mapping simultaneously in the
        right-hand S3 polynomial before the resultant.
      invariants:
        - free symbols are exactly x1, x2, x3, x4
        - temporary t is eliminated
        - total degree is 12
        - the frozen four-point witness evaluates to zero modulo 101
    factor_base:
      api: 'build_factor_base(inst, size, seed=0, *, scope="full_curve")'
      legacy_default: full_curve
      allowed_scopes: [full_curve, target_subgroup]
      target_subgroup_contract:
        - generate deterministic nonzero scalar multiples of inst.P
        - retain distinct x-coordinates only
        - verify every canonical lift satisfies inst.n times R equals the identity
        - reject size above (inst.n - 1) // 2
        - raise on shortfall or unknown scope
      compatibility:
        - default output is exactly unchanged
        - explicit full_curve equals the default for identical inputs
  controls:
    - id: CTRL-S4-FREE-SYMBOLS
      method: Verify the corrected expression contains all four public variables and no temporary symbol.
      pass_condition: Exact symbol-set equality and total degree 12.
    - id: CTRL-S4-GROUP-WITNESS
      method: Evaluate the corrected S4 on the frozen F_101 four-point sum witness.
      pass_condition: Value is exactly zero modulo 101.
    - id: CTRL-FB-LEGACY
      method: Compare the pre-repair default output on the frozen cofactor-five fixture with both post-repair default and explicit full_curve modes.
      pass_condition: All legacy lists are identical.
    - id: CTRL-FB-SUBGROUP
      method: Build the target_subgroup base twice and verify size, determinism, uniqueness, subgroup membership, and the frozen x-coordinate set.
      pass_condition: Every check passes; oversize and unknown-scope calls raise ValueError.
  independent_variables: []
  metrics:
    primary:
      - focused unit-test pass/fail
      - S4 free-symbol set
      - S4 witness residue modulo 101
      - legacy factor-base equality
      - subgroup membership count
    secondary:
      - focused test duration
      - full tests/test_harness.py pass/fail
  heuristic_under_test: null
  preregistered_prediction:
    quantity: deterministic correctness predicates
    formula: exact symbolic identity and exact subgroup membership
    source: KN-OPEN-5b3a08 and EV-DTREE-2e8f6a
  scale_relevance:
    tier: toy
    justification: >-
      Tiny exact fixtures distinguish implementation semantics. Passing them
      repairs shared code but provides no cryptographic-scale evidence.
    correspondence: null
  tail_checks: []
  replication:
    seeds: [1]
    independent_instances: 1
  budget:
    wall_clock_seconds_per_run: 0
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 0
    maximum_workers: 1
  stopping_rules:
    - Stop on any write outside the two shared code/test paths and the task report path.
    - Stop if the legacy default factor-base sequence changes.
    - Stop if any test fails; report implementation failure, not mathematical evidence.
    - Stop after focused tests and the full tests/test_harness.py file pass.
  invalidation_rules:
    - Any archived experiment or run artifact is modified.
    - The S4 temporary symbol or any public variable has the wrong support.
    - Subgroup mode returns a point outside the target subgroup or a short base.
    - An experiment run, ECDLP solve campaign, or archived result reinterpretation occurs.
  success_criterion: >-
    The exact shared repair and all frozen regression tests pass, with legacy
    default behavior unchanged and zero experiment runs.
  falsification_criterion: >-
    Any exact regression fails, the change requires archive mutation, or the
    opt-in API cannot preserve legacy behavior.
  required_artifacts:
    - harness/semaev.py
    - tests/test_harness.py
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-1800b3/tasks/TASK-20260813-12c7fb/implementation-report.yaml
  assigned_to: executor
  implementation_authorized: true
  execution_authorized: false
  experiment_runs_authorized: 0

