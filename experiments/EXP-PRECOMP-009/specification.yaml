experiment:
  id: EXP-PRECOMP-009
  status: proposed
  title: Cross-target generalization matrix for reusable solver state
  objective: >-
    Determine whether a cache/trace learned from one target subset transfers to
    genuinely unseen target strata or only to accidental local structure.
  fixtures:
    field_bits: [13, 16, 20, 24, 28]
    curve_seeds: [1, 2, 3]
    training_targets: 100
    holdout_targets: 1000
    decomposition_arities: [2, 3]
  target_strata:
    - uniform_random
    - planted_decomposable
    - certified_nondecomposable_when_feasible
    - low_x_hamming_weight
    - high_x_hamming_weight
    - quadratic_residue_x
    - quadratic_nonresidue_x
  reusable_mechanisms:
    - best_F4_trace_from_PRECOMP_002
    - best_prefix_from_PRECOMP_004
    - best_matrix_template_from_PRECOMP_005
    - best_SAT_state_from_PRECOMP_007
  metrics:
    primary: holdout_warm_speedup_by_stratum
    required:
      - success_rate_by_stratum
      - fallback_rate_by_stratum
      - structural_overlap_by_stratum
      - verification_failures
      - train_holdout_gap
  controls:
    - no holdout target may influence artifact construction or cutoff selection
    - target strata and selection rules frozen before execution
    - matched cold solves on holdouts
  success_criterion: >-
    At least one reusable mechanism retains >=80% of its training-set speedup
    on the uniform-random holdout and shows no >2x pathological slowdown in any
    predeclared stratum.
  strong_signal: >-
    Transfer speedup is statistically indistinguishable across target strata,
    suggesting dependence on the fixed polynomial family rather than target class.
  falsification_hook: >-
    Warm speedup collapses by >50% on uniform unseen targets or is confined to
    a single target stratum.
  depends_on: [EXP-PRECOMP-002, EXP-PRECOMP-004, EXP-PRECOMP-005, EXP-PRECOMP-007]
