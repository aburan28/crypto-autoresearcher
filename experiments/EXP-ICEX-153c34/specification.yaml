# EXP-ICEX-153c34 -- designed by TASK-20261001-768475 (GOAL-ICEX-001,
# BATCH-454f85) under DEC-20261001-9e675e NA-1/NA-2 and DEC-20261001-f5e83a
# R-2. Status review_required, approved_by null: approval is a separate
# committed Coordinator decision. Nothing has been implemented or run.
experiment:
  id: EXP-ICEX-153c34
  hypothesis_id: H-ICEX-6ca21f
  parent_hypothesis_id: H-ICEX-d8e858
  source_idea_ids: [IDEA-20260909-fe3e07]
  question_id: RQ-ICEX-001
  goal_id: GOAL-ICEX-001
  batch_id: BATCH-454f85
  designed_by_task: TASK-20261001-768475
  version: 1
  title: >-
    Groebner summation-polynomial (non-enumerative) m = 5 membership cost per
    success on the six EXP-ICEX-aaccfc v4 fixtures at matched L, with a
    frozen-L exponent panel at 16-24 bits
  status: approved
  assigned_to: executor
  approved_by: coordinator
  approval_decision: DEC-20261001-36e4fa
  approval_basis: >-
    Approved by the Coordinator in DEC-20261001-36e4fa under the standing user
    authorization of 2026-09-06 (AGENTS.md) after a completeness check of the
    design snapshot TASK-20261001-3bcf4a (a5d3a97af7). Approval does not admit
    execution (execution_admission.currently_admitted stays false) and does not
    assert the hypothesis is true.
  experiment_class: cost-model

  objective: >-
    Measure the fully charged m = 5 factor-base membership cost per success of
    the Groebner summation-polynomial backend G1 (EXP-ICEX-fa2b37's design,
    adapted as declared below) on the six v4 fixtures, on exactly the attempt
    stream RUN-ICEX-0ad4d8 used, with every other v4 choice held fixed.
    Compare it with the EV-ICEX-16e3ec obstruction (B0: 50-306 rho references
    per success) and with the competitiveness threshold
    T = 13*0.886*sqrt(q)/(L+27) units per success. Separately, estimate G1's
    variable-cost exponent along a frozen-L series at five field sizes with a
    design whose power was checked before approval.

  relation_to_other_experiments:
    EXP-ICEX-aaccfc: >-
      Held fixed at protocol version 4 (specification.yaml plus
      AMD-20260926-ced670, AMD-20260929-143d11, AMD-20260929-5a84eb): fixtures,
      B rule, C-3 units, collector, R_j charging, linear algebra, descents,
      controls and rho. Its implementation at run commit 3feb29161b is reused
      for every held-fixed stage; only the membership call is replaced.
    EXP-ICEX-fa2b37: >-
      Approved, unimplemented, not edited. Its representation sections
      (semaev_polynomials, degree_and_infinity, indicator_and_ideal,
      groebner_algorithm, gb_certification, root_extraction, signed_recovery)
      define G1, with the deviations D-1..D-6 below. Its object (public-scalar
      bases, arities 3-5) differs from this matched-fixture measurement
      (DEC-20261001-f5e83a R-2).
    EXP-SDEG-85eefd: >-
      Conventions reused by reference from AMD-20260926-3479cf: the exact
      5-multiset oracle as an uncharged verifier, the elimination-degree
      observation-collision note, and charged-work lower bounds at a watchdog
      stop.

  execution_admission:
    currently_admitted: false
    requirements:
      - Committed Coordinator approval decision naming this file's sha256, after the snapshot archive of this contract.
      - Implementation, checker, generator and trial-plan hashes committed in a snapshot archive before any frozen-fixture G1 computation.
      - S0 gates G0-1..G0-6 passed and archived.
      - Executor lane claim via tools/goal_lanes.py.
      - "Machine protection at claim time (as AMD-20260926-ced670 C-7): 15-minute load <= 14, system volume >= 5 GiB free, repository volume >= 20 GiB free; readings recorded in the manifest."

  inference:
    requested_policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    note: Record the resolved model and model_verified in every manifest; the Cursor runtime does not expose it.

  inputs:
    v4_fixtures:
      path: experiments/EXP-SDEG-85eefd/amendments/ic_leads_fixtures_v2.json
      sha256: 543f49ca5304f4e61085305ca2ea01ccc0085298db26368d7362f96b1b6a5a45
      entries: 'the six "EXP-ICEX-aaccfc" entries (bits 16, 20 x seeds 21, 22, 23)'
      generator: experiments/EXP-SDEG-85eefd/amendments/ic_leads_fixtures_v2.py
      generator_sha256: bde44afb3e14c34d97bf50c154456565d12f0b5a1d33d63b473f0f4124b1f3b2
      reproduction_rule: Re-run the generator with Sage and byte-compare before any run (as v4 C-1); a mismatch is a procedure defect.
      L_by_fixture: {b16-s21: 3, b16-s22: 5, b16-s23: 6, b20-s21: 7, b20-s22: 11, b20-s23: 5}
    v4_protocol:
      specification: {path: experiments/EXP-ICEX-aaccfc/specification.yaml, sha256: 5714346ffc24b096f145d849465fb3e947160a33c0d6a576217c1e611f68ed7a}
      amendments:
        - {path: experiments/EXP-ICEX-aaccfc/amendments/AMD-20260926-ced670.yaml, sha256: b74b30022eecbb1fae503ef4d9f0a9aad706d1917cbc4f57c981c94f832394b2}
        - {path: experiments/EXP-ICEX-aaccfc/amendments/AMD-20260929-143d11.yaml, sha256: 36cad68cee9ff8da0ce86e94c2f9548f05ffd95a5bdaf32eeaeaf32c0514dac7}
        - {path: experiments/EXP-ICEX-aaccfc/amendments/AMD-20260929-5a84eb.yaml, sha256: 61926b8c691cfe48a00354939651314a9d5aee62432a4d671c8ec56f7ddb310d}
      implementation_commit: 3feb29161b7e9fe55c42eec010d5db8bef12c89b
      implementation_pins: coordination/goals/GOAL-ICEX-001/batches/BATCH-227e0d/archives/TASK-20260929-a7f89b/snapshot-receipt.json
    reference_run:
      run_id: RUN-ICEX-0ad4d8
      manifest: {path: experiments/EXP-ICEX-aaccfc/runs/RUN-ICEX-0ad4d8/manifest.yaml, sha256: c3b631791056c1c1e439f7ff341f88e2caf9592aeacff5c5c50db7a9cef6cca6}
      used_for: >-
        Read-only. Per-attempt membership bits and charged point operations
        (cells/<fixture>__primary/result.json, stage1 and descents attempt
        logs) for the agreement control and the paired B0 reference; rho cell
        outputs for the rho reproduction control; random-x factor bases
        (cells/<fixture>__null_randfb) for arm N. No B0 query is re-executed.
    backend_design:
      path: experiments/EXP-ICEX-fa2b37/specification.yaml
      sha256: 85735fc99b106af8b47f3e04bacb7c04e6decc615c2e7823640e160492a4ba49
    obstruction_record: {path: ledger/evidence/EV-ICEX-16e3ec.yaml, sha256: 1bedfba0f2acd8903aa2f60321a3070758ad155096d67827ef75f638deabd581}

    held_fixed:
      factor_base_rule: "v4 C-2: V = {x in [0, B) : x^3 + a x + b nonzero square}, B = ceil(p^{1/5}) by exact integer arithmetic (common.fb_bound); points are canonical lifts (x, min(y, p-y)); F contains both signs."
      cost_units: "v4 C-3: F_p multiplication 1; inversion 10; affine point addition 13; hash probe 1; Z/q multiplication in LA 1. F_p additions, subtractions, comparisons and monomial bookkeeping are not charged (as in v4) and are reported as telemetry. Peak RSS beside every cost."
      collector: "v4 C-4 stage 3 with the OQ-3 ruling: uniform collector until rank L + 1 plus 10 excess rows; R_j = a_j G + b_j Q by fresh double-and-add, charged literally (OQ-13); FX-A incremental figure reported as non-verdict."
      linear_algebra: v4 structured Gaussian elimination then Lanczos over Z/q, kernel fixed by log G = 1.
      descents: v4, 16 targets per fixture, randomise Q_t + r G until membership succeeds; recovered k_t verified.
      rho: v4 C-6 baseline, negation map, r = 32 adding walk, 64 targets per fixture, same units.
      threshold_reference: v4 C-5 denominator 13*0.886*sqrt(q) (common.rho_reference_units), q = subgroup order N.

    panel_fixtures:
      purpose: Arm X exponent panel. L is frozen per size, so L variance is removed from the slope by construction (DEC-20261001-9e675e R-1).
      sizes_bits: [16, 18, 20, 22, 24]
      fixtures_per_size: 4
      seeds: [1, 2, 3, 4]
      B_star_rule: "B*(b) = least integer with B*^5 >= 2^(b - 0.5): B* = 9, 12, 15, 20, 26."
      L_star_rule: "L*(b) = floor((B*(b) + 1) / 2): L* = 5, 6, 8, 10, 13."
      p_windows: {16: [32769, 59049], 18: [161052, 248832], 20: [537825, 759375], 22: [2476100, 3200000], 24: [9765626, 11881376]}
      generation_rule: >-
        Public synthetic curves only. For size b and seed s, for counter
        c = 0, 1, 2, ...: x = SHA256(UTF8 'EXP-ICEX-153c34/v1|curve|<b>|<s>|<c>')
        as a big-endian integer; p = next_prime(2^(b-1) + (x mod 2^(b-1)));
        skip unless p has exactly b bits and ceil(p^{1/5}) = B*(b) (exact
        integers); a = (x >> 64) mod p, coefficient b_c = (x >> 128) mod p; apply
        the admissible() rule of ic_leads_fixtures_v2.py verbatim (j not in
        {0, 1728}, nonsingular, #E prime, not anomalous, not supersingular,
        embedding degree > 20); skip unless L(p, a, b_c) = #{x in [0, B*) :
        x^3 + a x + b_c nonzero square} equals L*(b); accept the first passing
        counter. q = N = #E. Base point G as base_point() in
        ic_leads_fixtures_v2.py. Record every rejected counter and its reason.
      generator_artifact: >-
        The executor writes experiments/EXP-ICEX-153c34/implementation/panel_fixtures.py
        (Sage) implementing exactly this rule and its JSON output; both are
        snapshot-archived and independently byte-reproduced (gate G0-1) before
        any G1 computation. Derivation evaluates no cost, query or statistic.
    seed_rule: >-
      Labels are SHA256 of UTF8 'EXP-ICEX-153c34/v1|<kind>|<decimal args
      separated by |>', with rejection sampling for uniform draws modulo n, as
      v4 common.uniform. Kinds: curve, target, attempt, nullattempt, audit,
      bootstrap, planted. Arm M alone replays the v4 labels
      'EXP-ICEX-aaccfc/v2|attempt|...', '.../target|...' and
      '.../descent|...' exactly, read-only, so that B0 and G1 see identical
      attempts. Those draws were consumed by RUN-ICEX-0ad4d8 and their B0
      outcomes are known; G1 has no tunable parameter and every threshold here
      is fixed before any G1 data, so the reuse cannot steer an outcome.
      No unseeded entropy anywhere.

  backend:
    id: G1
    name: Groebner summation-polynomial membership (EXP-ICEX-fa2b37 design, adapted)
    reused_sections_of_EXP-ICEX-fa2b37:
      - representation.field
      - representation.semaev_polynomials (f3; f4 and f5 by fraction-free Bareiss resultants, independently reconstructed)
      - representation.degree_and_infinity (m = 5 uses f6(x1..x5, x_R); target O uses f5)
      - representation.indicator_and_ideal (I_R = <f6(x1..x5, x_R), g_V(x1), ..., g_V(x5)>, repetitions allowed, no distinctness constraints)
      - representation.groebner_algorithm (deterministic lex Buchberger, x1 > ... > x5, product criterion only, interreduction)
      - representation.gb_certification (on the audit subsample; see D-4)
      - representation.root_extraction
      - representation.signed_recovery
    deviations:
      - id: D-1
        what: "Factor base is the v4 interval factor base V (and the v4 random-x deck in arm N), not EXP-ICEX-fa2b37's random-scalar public base; m = 5 only; targets are the v4 or panel attempt points R_j."
      - id: D-2
        what: >-
          Target specialisation. EXP-ICEX-fa2b37 builds f6 symbolically before
          substituting x_R. That is infeasible here: a design-time probe on a
          synthetic curve over F_10007 built f5 (54,777 terms, 5.4 s) but the
          generic resultant for target-specialised f6 exceeded 8 GiB RSS and was
          killed (TASK-20261001-768475/feasibility_probe_output.jsonl). G1
          instead works in the quotient ring R5 = F_p[x1..x5]/<g_V(x_i)> in the
          MONOMIAL basis from the start. Per fixture (setup, charged): f5 and
          its z-coefficients a_0..a_8 in F_p[x1..x4], reduced modulo g_V, and
          the 45 pair products a_j*a_k in R4. Per query (charged): reduce
          F(z) = sum a_j z^j modulo G(z) = f3(x5, x_R, z) by pseudo-division to
          alpha*z + beta, and form Res_z(F, G) from the precomputed pair
          products and polynomials in x5 alone; then the normal form modulo g_V.
          Identity check against point arithmetic on 1,000 random tuples per
          fixture before use (uncharged, gate G0-3).
      - id: D-3
        what: >-
          Forbidden representation. Arithmetic in R5 must stay in the monomial
          basis. Converting to evaluations at grid points (Lagrange/CRT basis)
          is literally enumeration of V^5 and is not G1; an implementation that
          does so is invalid for this experiment.
      - id: D-4
        what: >-
          Certificates. The charged decision runs without generator-combination
          witness tracking. An independent checker reruns 10% of attempts per
          fixture (selected by 'EXP-ICEX-153c34/v1|audit|<fixture>|<j>') with
          EXP-ICEX-fa2b37's full witness tracking and certification; that work
          is reported, uncharged. Every decision is also checked against the
          exact oracle O5.
      - id: D-5
        what: >-
          Decomposition choice (arm M). From all verified decompositions that
          root extraction yields on a member attempt, G1 returns the one B0
          would return under b0.py's deterministic hit order, so relation rows
          equal RUN-ICEX-0ad4d8's and the collector, LA and descents replay
          unchanged. Rows differing from RUN-ICEX-0ad4d8 are a procedure defect.
      - id: D-6
        what: Target R = O uses EXP-ICEX-fa2b37's zero-target branch (f5); charged identically.
    cost_components:
      P_setup: per-fixture setup (f3, f4, f5 construction, independent reconstruction excluded; g_V; reduction of f5 modulo g_V; pair-product tensors). Fixed per fixture.
      S_specialise: per-query target specialisation and normal form modulo g_V (D-2).
      G_groebner: per-query Buchberger S-pair processing, reductions and interreduction.
      X_roots: per-query root extraction (gcds with g_V, recursive specialisation).
      V_verify: per-query signed recovery and witness verification by point arithmetic.
      telemetry_uncharged: F_p additions, monomial comparisons and dictionary operations, wall time, peak RSS, audit-subsample certification work.
      sensitivity_column: each monomial dictionary access charged 1 unit (reported, not used by any verdict).

  oracle:
    id: O5
    role: Uncharged exact verifier. Not a backend under test and not B0.
    definition: >-
      S5 = the set of points e1 P1 + ... + e5 P5 over all 5-multisets of
      factor-base x-classes and signs (repetitions and cancelling pairs
      included), built per fixture as in AMD-20260926-3479cf C-5's exhaustive
      oracle. A point R is a member iff R is in S5. Exact yield
      y_exact = |S5| / q.
    uses: [agreement control on every completed attempt, exact yield for arm X, consistency check of empirical success counts]

  arms:
    M:
      name: matched v4 replay (primary, per card)
      fixtures: the six v4 fixtures
      procedure: >-
        Run the v4 primary pipeline at its pinned implementation with B0
        replaced by G1: stage 1 and the 16 descents on the replayed v4 attempt
        stream, then v4 linear algebra and log verification. Every attempt is
        decided by G1 and charged. Stop a fixture early only by stopping rule
        SR-2.
      attempts_if_completed: {b16-s21: 12165, b16-s22: 1943, b16-s23: 547, b20-s21: 3341, b20-s22: 475, b20-s23: 19917}
    N:
      name: small-x control (random-x factor base)
      fixtures: the six v4 fixtures
      procedure: >-
        32 held-out attempts per fixture, R = a G + b Q with (a, b) from
        'EXP-ICEX-153c34/v1|nullattempt|<bits>|<seed>|<j>', each decided by G1
        twice: once with the interval V and once with the v4 random-x deck of
        equal L (RUN-ICEX-0ad4d8 null_randfb factor base, regenerated by v4
        code and byte-compared). Same per-query watchdog; censored pairs are
        reported and excluded from the ratio.
    X:
      name: frozen-L exponent panel
      fixtures: 20 panel fixtures (5 sizes x 4)
      procedure: >-
        Per fixture, G1 decides 256 attempts R_j = a_j G + b_j Q with (a_j, b_j)
        from 'EXP-ICEX-153c34/v1|attempt|<bits>|<seed>|<j>' and Q = k G, k from
        '.../target|<bits>|<seed>'. All 256 are charged. O5 gives y_exact. No
        collector, LA or descent is run in this arm (the exponent concerns
        membership; the collector's R_j cost is reported separately).
    R:
      name: matched rho
      procedure: >-
        v4 rho.py at the pinned commit on the six v4 fixtures (must reproduce
        RUN-ICEX-0ad4d8 rho outputs exactly) and on the 20 panel fixtures
        (64 targets each, labels '.../rho|...' in the EXP-ICEX-153c34/v1
        namespace). Descriptive; no verdict divides by measured rho.

  cost_accounting:
    membership_units_per_success: >-
      Arm M (threshold metric): M_s = U_M / (L + 27), where U_M is the total G1
      units (S + G + X + V over every attempt of the completed stage-1 and
      descent streams, failures included, plus P_setup). The pipeline beats
      one frozen rho reference on membership alone iff M_s < T, so this is the
      exact quantity the threshold bounds. M_s per realised success
      (U_M / successes) is reported beside it; the two differ only when a
      success adds no rank. Arm X uses c_var / y_exact, with c_var the mean
      S + G + X + V units over the 256 attempts (expected units per success).
    complete_cost_per_log: >-
      C_M = (L + 27) * M_s, the membership work needed for one complete log
      plus 16 descents (L + 11 relations and 16 descent successes).
    b0_reference: >-
      B0 membership-only units per attempt from RUN-ICEX-0ad4d8 logs:
      units_j - 13 * rj_ops_j (rj_ops_j recomputed as in FX-A), plus the forward
      table build once per fixture. Divided by the same successes. Computed
      from committed logs; no B0 query is re-run.
    fixed_cost_handling: >-
      EV-ICEX-16e3ec F-2: fixed per-target costs flatten slopes. Here (1) the
      exponent verdict uses variable per-attempt cost only (S + G + X + V);
      P_setup enters the threshold comparison (amortised over L + 27) and a
      secondary with-setup slope that can never support a favourable call;
      (2) a component guard requires every per-query component holding at
      least 1% of variable cost at 24 bits to have its own slope upper bound
      below 0.5, so a large q-independent per-query term cannot hide a steeper
      one; (3) an absolute guard requires M_s with setup below T on every
      24-bit fixture. The power check shows the naive slope is fooled 99.6% of
      the time by a constant per-query term and the guarded rule 0%; a
      constant setup of 1000x the 16-bit variable cost fools a complete-cost
      fit 100% of the time (slope 0.04) and the variable-cost rule 0%.
    memory: Peak RSS per cell and per stage; the 8 GiB machine-protection guard checkpoints a cell as incomplete.

  controls:
    - kind: agreement
      design: G1's decision equals O5 on every completed attempt (all arms) and equals RUN-ICEX-0ad4d8's logged bit on every arm-M attempt; relation rows equal RUN-ICEX-0ad4d8's (D-5).
    - kind: matched_null
      design: Arm N random-x factor base of equal L on identical attempts (tests whether G1 uses small x; HEUR-ICEX-6ca21f-2).
    - kind: known_false
      design: v4 scrambled-relations control rerun unchanged on every completed arm-M fixture; it must fail log verification.
    - kind: planted_positive
      design: 16 planted members per v4 fixture (R = signed sum of 5 factor-base points, indices and signs from 'EXP-ICEX-153c34/v1|planted|<fixture>|<j>|<i>'); G1 must return a verified decomposition for each. Descriptive cost only.
    - kind: baseline
      design: Arm R (matched rho) plus the paired B0 reference from RUN-ICEX-0ad4d8 logs.
    - kind: accounting_audit
      design: Independent checker replays 10% of attempts per fixture from the operation log (selected by the audit label), recomputes S, G, X, V units and rejects receipts that omit failed attempts, setup or any charged operation.
    - kind: proves_too_much_analysis
      design: >-
        Before admission the frozen analysis code is run on the synthetic
        tables of TASK-20261001-768475/power_check.py and must reproduce its
        rates within Monte Carlo error (gate G0-5), including the planted 0.60
        and the two fixed/constant-cost objects.

  independent_variables:
    - {name: fixture, values: [b16-s21, b16-s22, b16-s23, b20-s21, b20-s22, b20-s23]}
    - {name: factor_base_deck, values: [interval, random_x]}
    - {name: panel_bits, values: [16, 18, 20, 22, 24]}
    - {name: panel_seed, values: [1, 2, 3, 4]}

  metrics:
    primary:
      - "Arm M: M_s(G1) with setup and its ratio to T, per fixture, with 95% CI"
      - "Arm X: beta_var = between-size slope of ln C_M^var versus ln q, with bootstrap and t intervals"
    secondary:
      - "Arm M: M_s(G1) / M_s(B0) on identical attempts; M_s in rho references (comparable to EV-ICEX-16e3ec's 50-306); complete pipeline ratio to 13*0.886*sqrt(q) and to measured rho"
      - "Arm M: median G1 units per non-member attempt over L^5 (HEUR-ICEX-6ca21f-1)"
      - "Arm N: median interval/random-x G1 cost ratio per fixture"
      - "Arm X: per-component slopes (S, G, X, V), with-setup slope, slope of c_var, slope of 1/y_exact, realised within-size residual SD"
      - "Peak RSS, wall time, censored-query counts, monomial-access sensitivity column"

  analysis:
    arm_M:
      ci: >-
        For each completed fixture, 95% percentile CI of M_s by sequential
        resampling: draw (cost, member) pairs with replacement from the
        fixture's realised attempts until L + 27 members are drawn, sum the
        costs, add P_setup, divide by L + 27 (10,000 replicates, label
        'EXP-ICEX-153c34/v1|bootstrap|M|<fixture>'). Rank dependence between
        relations is ignored and disclosed. If the fixture stopped under SR-2,
        M_s is reported as the lower bound spent / (L + 27) and no CI is
        computed.
      verdict:
        A_below_threshold: M_s upper bound < T on every 20-bit fixture, every fixture complete.
        B_obstruction_persists: M_s lower bound >= T on all six fixtures (a completed fixture's CI lower bound, or an SR-2 lower bound).
        mixed: anything else, reported per fixture.
      g1_vs_b0: Per fixture, "G1 cheaper" iff the upper bound of M_s(G1)/M_s(B0) < 1, "G1 dearer" iff its lower bound > 1 (SR-2 lower bounds count toward dearer only), else undetermined.
    arm_X:
      estimator: >-
        Between-size OLS slope of the five size means of ln C_M^var on the five
        size means of ln q. Pooled OLS over all 20 fixtures is not used; it
        mixes in the within-size local slope (about 1 at fixed L) and gave no
        advantage in the power check.
      intervals:
        bootstrap: 95% percentile, 10,000 stratified resamples (fixtures resampled with replacement within each size), label 'EXP-ICEX-153c34/v1|bootstrap|X'.
        t_interval: slope +/- t(0.975, 15) * sqrt(s_p^2 / 4 * sum w_b^2), s_p^2 the pooled within-size variance of ln C_M^var (15 df), w_b the OLS weights of the size means.
      verdict:
        favourable: >-
          ALL of: beta_var upper bound < 0.5 under both intervals; the component
          guard (every component with at least 1% of variable cost at 24 bits
          has slope upper bound < 0.5 under both intervals); the absolute guard
          (M_s with setup < T on every 24-bit fixture); all 20 fixtures
          complete.
        unfavourable: beta_var lower bound >= 0.5 under both intervals, all 20 fixtures complete.
        inconclusive: complete but neither of the above.
        incomplete: any panel fixture censored or checkpointed. The full-panel verdict is then not computed; a slope over the complete sizes is reported descriptively, labelled, with the power of that reduced panel quoted from the power table.
      why_both_intervals: >-
        In the power check the stratified percentile bootstrap alone is
        anti-conservative with 4 fixtures per size (false-favourable 5.7-6.9%
        at a true 0.50 against a nominal 2.5%); the t interval holds 1.2-2.4%.
        Requiring both keeps the bootstrap as a robustness check without
        letting its narrowness decide.
    descriptive_only:
      - Fit of ln M_s on ln q and ln L over arm-M and arm-X fixtures together (conditioned on ln L), labelled non-verdict.
      - Leave-one-fixture-out slopes for arm X.

  power_check:
    script: coordination/goals/GOAL-ICEX-001/batches/BATCH-454f85/tasks/TASK-20261001-768475/power_check.py
    output: coordination/goals/GOAL-ICEX-001/batches/BATCH-454f85/tasks/TASK-20261001-768475/power_check_output.json
    label: NON-PROTOCOL synthetic cost tables
    design_expected_residual_sd: 0.20
