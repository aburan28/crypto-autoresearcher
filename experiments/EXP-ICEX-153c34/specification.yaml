  heuristic_under_test: HEUR-ICEX-6ca21f-1
  heuristics_also_tested: [HEUR-ICEX-6ca21f-2, HEUR-ICEX-6ca21f-3]

  preregistered_prediction:
    quantity: M_s(G1) / T per v4 fixture; beta_var on the frozen-L panel
    formula: >-
      Grid floor M_s >= A * L^5 (A = attempts per success) gives
      M_s / T >= 1,041 (b16-s21), 2,089 (b16-s22), 1,702 (b16-s23),
      6,501 (b20-s21), 8,438 (b20-s22), 5,667 (b20-s23); arm-M verdict B. On the
      panel the floor's ratio to T grows from 1,399 (16 bits) to 45,687
      (24 bits), so beta_var is expected at or above 1, verdict unfavourable if
      the panel completes. Arm N ratio near 1.
    source: >-
      HEUR-ICEX-6ca21f-1 and the arithmetic in
      TASK-20261001-768475/ceiling_audit.py on committed RUN-ICEX-0ad4d8
      quantities. A prediction, not a measurement.

  scale_relevance:
    tier: toy
    justification: q < 2^25 (16-24-bit primes); interval factor base at m = 5. No transfer to cryptographic size without a separate theorem and experiment.
    correspondence: null

  tail_checks:
    - Report the maximum per-attempt G1 cost per fixture and the attempt index; report all censored queries.
    - Empirical successes in each arm-X fixture against Binomial(256, y_exact); a two-sided p < 0.001 is a procedure flag to investigate before analysis.
    - Report members and non-members separately; never fit on members only (successful-subset loophole).
    - Do not tune any threshold, cap or estimator after seeing G1 output.

  replication:
    seeds: [21, 22, 23]
    panel_seeds: [1, 2, 3, 4]
    independent_instances: 26
    bootstrap_replicates: 10000

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_runs: 1
    maximum_workers: 1
    per_query_watchdog_seconds: 3600
    per_fixture_watchdog_hours: 48
    protection_note: >-
      Memory and the watchdogs are machine protection; time and CPU figures
      are advisory (docs/research-budget-policy.md). A watchdog stop
      checkpoints the cell as incomplete infrastructure; it is never a
      mathematical result.

  stage_estimates:
    - {stage: S0 gates and fixture derivation, wall_clock_seconds: 7200, cpu_hours: 2, memory_gb: 2, advisory: true}
    - {stage: S1 arm M (six fixtures), wall_clock_seconds: null, cpu_hours: null, memory_gb: 8, advisory: true, note: "See design_report.yaml runtime_estimates; L >= 7 fixtures are expected to end by SR-2 within hours, L <= 5 fixtures may run to completion."}
    - {stage: S2 arm N, wall_clock_seconds: null, cpu_hours: null, memory_gb: 8, advisory: true}
    - {stage: S3 arm X (20 fixtures), wall_clock_seconds: null, cpu_hours: null, memory_gb: 8, advisory: true, note: "Feasibility at L* = 8, 10, 13 is the main recorded impediment (IMP-1)."}
    - {stage: S4 arm R and analysis, wall_clock_seconds: 3600, cpu_hours: 1, memory_gb: 1, advisory: true}

  s0_gates:
    - {id: G0-1, gate: "v4 fixtures byte-reproduce; panel_fixtures.py output byte-reproduced by an independent verifier."}
    - {id: G0-2, gate: "f4, f5 reconstruct identically by Bareiss and by subset-DP determinant expansion (EXP-ICEX-fa2b37) on every fixture."}
    - {id: G0-3, gate: "Specialised f6 (D-2) vanishes on 1,000 random signed 5-sums and is nonzero on 1,000 random non-sums per fixture (point-arithmetic check, uncharged)."}
    - {id: G0-4, gate: "G1 agrees with O5 on 200 smoke attempts per size on NON-frozen smoke curves (namespace 'smoke|EXP-ICEX-153c34/v1'); smoke output carries no cost fields for frozen fixtures (v4 FX-5 lesson)."}
    - {id: G0-5, gate: "Frozen analysis code reproduces power_check_output.json rates within 3 Monte Carlo standard errors."}
    - {id: G0-6, gate: "Instrumented counters: an independent checker recomputes S, G, X, V units on 20 smoke queries from the operation log exactly."}

  stopping_rules:
    - id: SR-1
      rule: Stop the run at the first disagreement between G1 and O5, between G1 and RUN-ICEX-0ad4d8's bit, at a differing relation row, a failed certificate, or a failed known-false control; classify as procedure defect.
    - id: SR-2
      rule: >-
        Arm M per-fixture budget stop: stop the fixture once spent G1 units
        exceed BOTH 100 * 13*0.886*sqrt(q) (a hundred whole rho references of
        membership work) AND the fixture's entire B0 membership spend on the
        same stream from RUN-ICEX-0ad4d8. Since U_M only grows with further
        attempts, M_s = U_M / (L + 27) >= spent / (L + 27) > 100 T is then a
        valid lower bound, and G1 is established as
        dearer than B0 on that fixture. Exact M_s and the G1/B0 ratio are then
        lower bounds only.
    - id: SR-3
      rule: Per-query watchdog 3600 s wall. The query is censored; its charged units up to the stop are recorded as a lower bound; it is never scored member or non-member. Arm M continues to the next attempt only if SR-2 has not fired.
    - id: SR-4
      rule: Memory guard at 8 GiB RSS or the per-fixture 48 h watchdog checkpoints the cell as incomplete infrastructure.
    - id: SR-5
      rule: Do not change any threshold, cap, estimator or attempt count mid-run.

  invalidation_rules:
    - Any uncharged operation inside S, G, X or V, a grid-evaluation (CRT) representation (D-3), or omitted failed attempts invalidates the cost claims.
    - Using O5 or any table of 5-sums inside the charged path invalidates the run.
    - Smoke output on a frozen fixture with cost fields invalidates the affected arm (v4 FX-5).
    - Infrastructure failures, watchdog stops and memory checkpoints never falsify the hypothesis.
    - A rho comparison with placeholder artifacts invalidates the run.

  success_criterion: >-
    The run is decidable: every completed attempt agrees with O5 (and, in arm
    M, with RUN-ICEX-0ad4d8), the audit subsample certifies, and arm M reaches
    verdict A, B or mixed on all six fixtures with charged costs. Arm X is
    decidable when all 20 fixtures complete; otherwise it reports incomplete.
    Supporting H-ICEX-6ca21f requires arm-M verdict A and the arm-X favourable
    verdict.
  falsification_criterion: >-
    Arm-M verdict B falsifies the first clause of H-ICEX-6ca21f for G1 on these
    fixtures. A complete arm X with the unfavourable verdict falsifies the
    second clause along the frozen-L path at 16-24 bits. Each is scoped to G1
    as implemented and the interval factor base.

  required_artifacts:
    - frozen panel fixture JSON, generator and independent byte-reproduction receipt
    - per-cell manifest (v4 FX-2 shape, top-level run block) with protocol sha256s, approval decision and inference block
    - per-attempt columnar log for every attempt of every arm (decision, S, G, X, V units, telemetry, censored flag)
    - per-fixture P_setup units and peak RSS by stage
    - O5 tables or their hashes and y_exact per fixture
    - agreement report against O5 and RUN-ICEX-0ad4d8 bits and relation rows
    - audit-subsample certificates and checker report
    - rho outputs and the reproduction comparison with RUN-ICEX-0ad4d8
    - analysis.json with every metric, both intervals, guards, verdicts and the realised residual SD
    - stdout, stderr, exact commands, git commit, dirty-tree state, environment and dependency versions
    - complete failures, censored queries and exceptions

  write_scope:
    - experiments/EXP-ICEX-153c34/implementation/
    - experiments/EXP-ICEX-153c34/runs/

  run_record_contract:
    path: experiments/EXP-ICEX-153c34/runs/<RUN-ID>/manifest.yaml
    top_level_key: run
    required_companions: [command.txt, environment.json, stdout.log, stderr.log, raw-result.json, analysis.json]
    binding: Records protocol version 1, this file's sha256, the approval decision's sha256 and the v4 implementation commit.

  review_chain:
    producer_archive: Coordinator snapshot archive of implementation and run before review.
    independent_validator: Run integrity, agreement, charging audit and statistic reproduction.
    red_team: Interpretation and scope, including whether any lower bound is over-read.
    blind_rederivation: >-
      Re-derive y_exact and L^5-floor quantities for two v4 fixtures from the
      fixture parameters alone, without reading the implementation or run
      outputs (blind_from experiments/EXP-ICEX-153c34/implementation/ and runs/).
    review_plan: Required before any reviewer runs; the Coordinator prior is already on H-ICEX-6ca21f.

  proof_search_map:
    see: ledger/hypotheses/H-ICEX-6ca21f.yaml proof_search_map
    experiment_specific:
      baseline_reproduction: G1 bits and relation rows equal RUN-ICEX-0ad4d8's; v4 rho reproduces exactly; B0 per-success figures reproduce EV-ICEX-16e3ec.
      observation_collision: CRT isomorphism of R5 with functions on V^5 (prediction of grid floor); arm N tests it directly.
      quantifier_order: All thresholds, caps and estimators fixed in this file before any G1 computation on a frozen fixture.
      method_ceiling: Grid floor A*L^5 is 1,041-8,438 times T on the v4 fixtures (ceiling_audit_output.json); symmetrised floor 55-229 times T.

  dominated_by:
    status: predicted_dominated (design-time ceiling audit; nothing measured for G1)
    rows_checked:
      - "Pollard rho on the six v4 fixtures (EV-ICEX-16e3ec): the v4 pipeline with B0 is 1,739-9,789 times the frozen rho reference; G1's grid floor alone is 1,041-8,438 times T, i.e. above one rho reference per complete log by the same factor, on time; memory and data not yet measured for G1."
      - "B0 on identical attempts (RUN-ICEX-0ad4d8): G1's grid floor is 0.13-4.4 times B0's units per success, so G1 could be cheaper than B0 only on the L <= 6 fixtures, and only if it ran near its floor."
    rows_unchecked:
      - BSGS (not run in v4 or here)
      - S5-symmetrised Groebner membership (not built; floor 55-229 times T)
      - Structured factor bases (subgroup or rational-map images), outside the held-fixed B rule

  sota_delta:
    established_gain: 0
    predicted_time_ratio_vs_threshold: at least 1,041x to 8,438x above T on the v4 fixtures (grid floor)
    predicted_exponent: beta_var near or above 1 along the frozen-L path
    memory: to be measured
    note: Predictions, not results.

  impediments:
    - id: IMP-1
      raised: '2026-10-01'
      condition: Feasibility of lex Buchberger on I_R at larger L.
      what_is_blocked: Completion of arm-M fixtures with L >= 7 (b20-s21, b20-s22) and of arm-X sizes 20-24 (L* = 8, 10, 13).
      clears_when: S0 smoke timing (gate G0-4) shows median G1 query time below 60 s at L = 8 on non-frozen curves, or the run completes those cells.
      recheck: Gate G0-4 timing table in the S0 archive.
      expected_effect: Arm M still reaches a verdict through SR-2 lower bounds; arm X becomes incomplete and reports a labelled reduced-panel slope (power 0.68 for sizes 16-22, 0.27 for 16-20 at SD 0.20).
      asserts_nothing_about: the science; an infeasible G1 query is infrastructure, not evidence about non-enumerative membership.
    - id: IMP-2
      raised: '2026-10-01'
      condition: Symbolic target-specialised f6 exceeded 8 GiB in the design probe.
      what_is_blocked: EXP-ICEX-fa2b37's build-then-substitute order for f6.
      clears_when: Not required; deviation D-2 replaces it and gate G0-3 checks the replacement.
      recheck: Gate G0-3.
      asserts_nothing_about: the science.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      G1 as implemented, charged in C-3 units: above or below T, and dearer or
      cheaper than B0, on each of the six v4 fixtures; its variable-cost
      exponent along the frozen-L path at 16-24 bits if the panel completes.
    explicitly_not_supportable_under_any_outcome: >-
      Any statement about all non-enumerative membership algorithms,
      symmetrised or structured factor bases, certificate-free decision
      procedures, cryptographic sizes or deployed curves; any unconditional
      exponent theorem.

