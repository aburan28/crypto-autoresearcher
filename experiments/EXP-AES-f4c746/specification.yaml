experiment:
  id: EXP-AES-f4c746
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-AES-0e5fa1
  question_id: RQ-AES-001
  goal_id: GOAL-AES-001
  batch_id: null
  batch_id_note: >-
    NULL BY NECESSITY, NOT BY OMISSION. No BATCH-005 queue exists in
    coordination/goals/GOAL-AES-001/batches at the time of writing, and naming a
    batch directory for a file that has not been written would be a fabrication
    under AGENTS.md rule 9 -- the same test that held the goal's
    current_batch_id at BATCH-002 and then BATCH-003. The Coordinator binds this
    field when the queue exists.

  title: >-
    The index-branching duality iota * B = |X| at one AES super-box interface:
    forced-identity census over GF(2^8) kernels, with a random-mixing-matrix
    null, a two-witness positive control, a graded kernel-dimension control, and
    a GF(2^4) composition leg under two explicitly separated composition models

  objective: >-
    If a later approval and execution authorization are granted, decide whether
    the confinement translation set of an F-linear round-independent per-word
    projection contains a subgroup whose index iota satisfies the forced identity
    iota * B = q^(4 - dim K) exactly, and hence whether TASK-20260801-806 section
    3.3 route 2 -- the bounded-index subgroup statement that DEC-20260731-030
    ranks FIRST for BATCH-005 as the campaign's only exponent-relevant
    forward-looking item -- supplies a repair of PROP-701-I's induction that is
    independent of Corollary 806-2. This contract is an instrument and protocol
    design only. NO RUN HAS OCCURRED.

  what_this_is_not:
    - Not a distinguisher, key recovery, or cryptanalytic attack of any kind.
    - Not a claim about AES at any round count, including the 3-7 rounds RQ-AES-001 scopes in.
    - Not a claim about full-round AES, AES-NI-deployed AES, or the security of any system using AES.
    - Not an exponent, asymptotic, cost, or crypto-scale claim; not a cost inequality.
    - Not a revival of TASK-20260801-806 section 5's cost table, which DEC-20260731-029 STRUCK as unusable in either direction; no entry of it is used, cited, or repaired here.
    - Not a closure of PROP-701-I, of Proposition 806-1, of Proposition 801-1, or of the round-independent single-word deterministic class -- whose reject_scoped DEC-20260731-030 forbids considering until a control ISOLATES the ingredient it negates (V-804-1, undischarged for three consecutive batches). This contract does not attempt that isolation and does not claim it.
    - Not an approval, a freezing, an execution authorization, a run, an observation, or evidence.
    - Not a statement distinguishing AES from any other invertible linear mixing layer; control G6 exists precisely to make that limit visible.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: that over GF(2^8) with the real AES MixColumns matrix, at ONE
      super-box interface Phi = ARK . MC . SR, for F-linear round-independent
      per-word projections pi with 0 < dim K < 4, the confinement translation set
      contains W_S + K and the exact integer identity
      log_q iota + log_q B = 4 - dim K holds at every kernel measured -- over the
      declared census sample and the two named witnesses, with the GF(2^4)
      composition leg reported separately as an ANALOGUE. It could additionally
      support the categorical route2_verdict at those kernels. IT COULD NOT
      SUPPORT any statement about non-linear pi, about more than one GF(2^8)
      interface, about AES at any round count, about any cost, or about any
      exponent. Toy evidence is never crypto-scale evidence (AGENTS.md rule 7).

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      The identity is an ALGEBRAIC IDENTITY whose proof does not depend on the
      field size, so a confirming census over GF(2^8) is a CHECK OF A DERIVATION
      rather than an extrapolation, and the derivation itself is the transferable
      object. THAT IS THE ONLY THING THAT TRANSFERS. The GF(2^4) composition leg
      does NOT transfer: GF(2^4) MixColumns is a different matrix over a different
      field, and any composition law measured there is a fact about the analogue
      that reaches GF(2^8) only through HEUR-0E5-2, which is a stated heuristic
      with a declared falsifier and not a fact. GF(2^2) is excluded from this
      contract because the goal record records it as additionally not MDS.

  inputs:
    field: GF(2^8)
    field_modulus: "x^8 + x^4 + x^3 + x + 1 (0x11B), the AES polynomial"
    q: 256
    mixcolumns_matrix: >-
      The AES MixColumns matrix M with rows (2,3,1,1), (1,2,3,1), (1,1,2,3),
      (3,1,1,2) over GF(2^8); columns m_0..m_3 are its columns. Invertibility is
      RECOMPUTED at stage 1, not assumed.
    analogue_field: GF(2^4)
    analogue_modulus: "x^4 + x + 1 (0x13)"
    analogue_matrix_source: >-
      The GF(2^4) analogue matrix used by TASK-20260801-806's own
      od4_branching.py phases, read from the committed artifact and recorded by
      SHA-256 in the receipt. IF THAT FILE CANNOT BE READ, the analogue leg is
      declared OUT OF SCOPE as infrastructure signal rather than run against an
      invented matrix.
    kernel_dimensions: [1, 2, 3]
    named_witnesses:
      - id: WIT-A
        kernel: "span(1,1,1,1) = ker(M + I)"
        forced_log_q_B: 3
        forced_log_q_iota: 0
      - id: WIT-B
        kernel: "span(e_0) = span(1,0,0,0)"
        forced_log_q_B: 1
        forced_log_q_iota: 2
    census_sample_per_dimension: 10000
    composition_interfaces: [1, 2, 3, 4, 5]
    composition_models:
      - id: M-affine
        definition: "Phi composed with itself; no nonlinear layer between interfaces."
      - id: M-nonlinear
        definition: >-
          Phi . SB composed, with the analogue field's S-box applied between
          interfaces. Separating these two is RT-3's settling control and the
          two legs are NEVER merged into one number.
    master_seed: 3164739
    domain: "EXP-AES-f4c746/v1"
    seed_derivation_rule: >-
      Every random draw is derived deterministically, so a third party
      reproduces the instance set bit-for-bit. Let
      seed_bytes(label, dim, counter) be the ASCII bytes of
      domain || "|" || label || "|" || decimal(dim) || "|" || decimal(counter).
      Let h = SHA-256(seed_bytes(...)) interpreted as a big-endian unsigned
      integer. A dim-d kernel basis for label "kernel" is drawn by taking the
      4*d bytes h mod 256^(4d) in big-endian order as the d basis vectors'
      coordinates, in order; a draw whose vectors are linearly dependent is
      REJECTED and counter is incremented, with the rejection recorded. A random
      invertible mixing matrix for label "nullM" is drawn from the 16 bytes of h
      and REJECTED if singular, counter incremented, rejection recorded. NO
      OTHER SOURCE OF RANDOMNESS IS PERMITTED and no system RNG is used.
    environment_probe_required: >-
      Stage 0 records, inside the dispatched task: python3 version; the exit code
      and version of `import numpy`; the exit code of `import Crypto`; the exit
      code of `import cryptography`; `openssl version`; `gcc --version`; and the
      null probes `import sympy` (expected failure) and `import json` (expected
      success). RATIONALE, AND IT IS NOT INCIDENTAL: GOAL-AES-001's committed
      next_action declares numpy NOT INSTALLED and names that as the binding
      infrastructure blocker for this exact census; numpy 2.4.6 was measured
      PRESENT in this container when this contract was written. The contract
      does not assume either; it measures and records.

  arms_and_controls:
    treatment: >-
      ARM-T. The real AES MixColumns matrix M over GF(2^8). For each kernel in
      the census and for each named witness, compute dim W_S, dim(W_S int K),
      dim(W_S + K), hence log_q B and log_q iota, and the identity residual
      | log_q iota + log_q B - (4 - dim K) |.
    measured_null: >-
      ARM-N. A seeded uniformly random INVERTIBLE 4x4 matrix M' over GF(2^8) in
      place of M, identical in every other respect: same kernel census, same
      dimensions, same code path. FORCED VALUE DERIVED BEFORE THE RUN: the
      identity residual is 0 here too, because its proof uses only that the
      mixing matrix is invertible and never uses MDS, the AES polynomial, or any
      AES-specific structure. THE NULL THEREFORE CANNOT SEPARATE AES FROM A
      RANDOM INVERTIBLE MIXING LAYER, AND SAYING SO IS THE POINT -- it fixes the
      attribution limit before any result exists. WHAT THE NULL MUST SEPARATE is
      the DISTRIBUTION of iota and the presence of a nonzero ker(M' + I): AES's
      M has ker(M + I) = span(1,1,1,1), and the count of null matrices with a
      nonzero eigenvalue-1 eigenspace is the measured comparator. THE NULL CAN
      GENUINELY FAIL: a nonzero identity residual under M' refutes the proof.
    positive_control: >-
      ARM-P. The two named witnesses WIT-A and WIT-B under the real M, whose
      forced values (3, 0) and (1, 2) are derived in H-AES-0e5fa1 before any run.
      BOTH MUST BE REPRODUCED EXACTLY, as integers, with no tolerance. IF EITHER
      FAILS THE INSTRUMENT IS BROKEN AND NO NEGATIVE RESULT MAY BE REPORTED FROM
      ANY STAGE OF THIS EXPERIMENT. This is the sensitivity demonstration: the
      two witnesses differ in BOTH coordinates, so reproducing both shows the
      instrument can move.
    graded_control: >-
      ARM-G. Kernel dimension 1, 2, 3 -- three interior points -- with the forced
      sum log_q iota + log_q B equal to 3, 2, 1 respectively. MONOTONICITY IS
      REPORTED, NOT ASSUMED: the sum must DECREASE BY EXACTLY 1 PER STEP as the
      entropy loss L = 8 dim K rises. A quantity that fails to decrease as the
      parameter meant to destroy it increases is the canonical artifact tell
      (docs/inventor-protocol.md), and this arm localises any failure to a
      specific kernel dimension instead of leaving "it did not work".
    ordering_control: >-
      THE NULL ARM IS RUN, ITS OUTPUT COMMITTED, AND THE FROZEN VERDICT RULE
      EXECUTED ON IT BEFORE ARM-T IS LOOKED AT. If the rule emits the same label
      on ARM-N and ARM-T, the rule discriminates nothing and MUST be rewritten
      and re-frozen before the treatment arm is read. The commit of the ARM-N
      output is a required artifact and its SHA-256 is recorded.
    comparability_policy: >-
      ARM-T and ARM-N share the identical kernel census (same seeds, same
      counters, same rejection log), the identical code path, and the identical
      dimension routine; they differ ONLY in the mixing matrix. Any divergence in
      sample size, seed stream, or rejection handling between arms
      INVALIDATES the comparison and is an invalidation rule below, not a caveat.
    frozen_verdict_rule: >-
      FROZEN BEFORE ANY NUMBER IS OBSERVED. route2_verdict :=
      REPAIRS_INDUCTION if there exists a measured kernel with
      log_q iota <= 1 AND log_q B <= (4 - dim K) - 2, i.e. index bounded while
      the branching is far below |X|;
      VACUOUS_BECAUSE_INDEX_ONE if at least 95 per cent of measured kernels have
      iota = 1 and no kernel satisfies the REPAIRS_INDUCTION condition;
      EQUIVALENT_TO_COR_806_2 otherwise.
      This rule is executed on ARM-N first under the ordering control.

  metrics:
    primary:
      - id: G1
        name: identity_residual_max
        definition: >-
          max over all measured kernels in an arm of
          | log_q iota(K) + log_q B(K) - (4 - dim K) |, computed from
          independently recomputed subspace dimensions.
        units: integer
      - id: G9
        name: route2_verdict
        definition: >-
          The categorical label emitted by the frozen verdict rule above.
        units: categorical
    secondary:
      - id: G2
        name: witness_A_pair
        definition: "(log_q B, log_q iota) at K = ker(M + I) = span(1,1,1,1)."
      - id: G3
        name: witness_B_pair
        definition: "(log_q B, log_q iota) at K = span(e_0)."
      - id: G4
        name: baseline_reproduction_fraction
        definition: >-
          Fraction of census kernels at which the computed B equals Proposition
          806-1's q^(s - dim(W_S int K)).
      - id: G5
        name: graded_sum_by_dimension
        definition: >-
          The measured log_q iota + log_q B at dim K = 1, 2, 3, with the
          per-step difference reported.
      - id: G6
        name: null_identity_residual_max
        definition: "G1 computed on ARM-N."
      - id: G7
        name: generic_index_one_fraction
        definition: >-
          Fraction of dim-1 census kernels with iota = 1, per arm.
      - id: G8
        name: composed_index_by_n_and_model
        definition: >-
          Measured iota^(n) for n = 1..5 in the GF(2^4) analogue, reported
          separately for M-affine and M-nonlinear, against predicted
          min(iota^n, ceiling).
      - id: G10
        name: per_word_B_versus_joint_J_at_witness_A
        definition: >-
          The per-word B and RT-1's joint branching J at WIT-A, REPORTED
          SEPARATELY. Both equal 2^24 at that kernel by different routes;
          merging them would manufacture a false corroboration and is forbidden.

  preregistered_prediction:
    - quantity: G1 (ARM-T)
      formula: "max | log_q iota + log_q B - (4 - dim K) |"
      predicted_value: 0
      source: >-
        H-AES-0e5fa1 Assembly: dim(W_S + K) = s + dim K - dim(W_S int K) with
        dim W_S = s, giving log_q iota + log_q B = 4 - dim K identically.
      tolerance: "exact; zero tolerance, integer comparison"
    - quantity: G2
      formula: "(s - dim(W_S int K), 4 - dim(W_S + K)) at K = span(1,1,1,1)"
      predicted_value: "(3, 0)"
      source: >-
        s = 4 (all coordinates nonzero), W_S = F^4 (M invertible),
        dim(W_S int K) = 1, dim(W_S + K) = 4.
      tolerance: exact
    - quantity: G3
      formula: "(s - dim(W_S int K), 4 - dim(W_S + K)) at K = span(e_0)"
      predicted_value: "(1, 2)"
      source: >-
        s = 1, W_S = span(m_0), m_0 = (2,1,1,3)^T not a scalar multiple of e_0
        so dim(W_S int K) = 0, dim(W_S + K) = 2.
      tolerance: exact
    - quantity: G5
      formula: "log_q iota + log_q B at dim K = 1, 2, 3"
      predicted_value: "3, 2, 1 (difference exactly -1 per step)"
      source: "The identity's right-hand side 4 - dim K."
      tolerance: exact
    - quantity: G6
      formula: "G1 on a random invertible M'"
      predicted_value: 0
      source: >-
        The Assembly uses only invertibility of the mixing matrix. Predicting 0
        here is predicting that the result is NOT AES-specific, and is stated as
        a limitation rather than concealed.
      tolerance: exact
    - quantity: G7
      formula: "(255/256)^4"
      predicted_value: 0.9845
      source: >-
        HEUR-0E5-3: iota = 1 iff W_S + K = F^4, and for dim K = 1 a spanning
        vector with all four coordinates nonzero already gives s = 4.
      tolerance: ">= 0.98; below 0.95 refutes HEUR-0E5-3"
    - quantity: G9
      formula: "the frozen verdict rule"
      predicted_value: "EQUIVALENT_TO_COR_806_2 (with VACUOUS_BECAUSE_INDEX_ONE as the generic sub-case)"
      source: "H-AES-0e5fa1 statement (C)."
      tolerance: categorical
    - quantity: G8
      formula: "min(iota^n, q_analogue^(4(4 - dim K)))"
      predicted_value: >-
        NO SINGLE VALUE IS PREDICTED AND THAT IS DELIBERATE. All three outcomes
        are pre-declared usable: agreement in both models weakens RT-3's
        materiality; disagreement between models confirms RT-3 and confines the
        identity to one interface; iota^(n) exceeding iota^n in M-affine refutes
        HEUR-0E5-2. Pre-registering a single value here would privilege one of
        three informative outcomes.
      source: "HEUR-0E5-2, whose affine half is proved and whose nonlinear half is not."
      tolerance: n/a

  procedure:
    stage_order_rationale: >-
      CHEAPEST FIRST, AND STAGE 1 CAN TERMINATE THE WHOLE EXPERIMENT. Stage 1 is
      a pen-and-paper re-derivation costing zero compute; if it disagrees with
      the Assembly, no later stage is run and the finding is that the derivation
      is wrong -- which is the fastest and most valuable possible outcome.
    stages:
      - id: S0
        name: environment probe and instrument self-check
        cost: seconds
        can_terminate: false
        description: >-
          Run the eight environment probes and the two null probes. Then
          cross-check the GF(2^8) rank routine against a pure-Python reference on
          200 seeded random 16x16 GF(2^8) matrices. IF THE NULL PROBES MISBEHAVE
          OR THE TWO RANK ROUTINES DISAGREE ON ANY OF THE 200, HALT: no census
          number may be reported.
      - id: S1
        name: independent symbolic re-derivation
        cost: zero compute
        can_terminate: true
        description: >-
          Re-derive Lemmas 1-4 and the Assembly WITHOUT reading H-AES-0e5fa1's
          algebra, and independently re-derive LEM-806-2's characterisation of
          R_j(x) as a coset of a fixed subspace. Record agreement or
          disagreement. A DISAGREEMENT HALTS THE EXPERIMENT and is routed to a
          correction record; it is not absorbed.
      - id: S2
        name: positive control, the two named witnesses
        cost: seconds
        can_terminate: true
        description: >-
          Compute (log_q B, log_q iota) at WIT-A and WIT-B. Both forced values
          must be reproduced exactly. FAILURE HALTS EVERYTHING and forbids any
          negative report.
      - id: S3
        name: null arm, then treatment arm
        cost: minutes
        can_terminate: false
        description: >-
          Run ARM-N in full, commit its output and its SHA-256, execute the
          frozen verdict rule on it, and record the label. ONLY THEN run ARM-T.
          Report G1, G4, G5, G6, G7 for both arms and G2, G3, G10 for ARM-T.
      - id: S4
        name: GF(2^4) composition leg
        cost: tens of minutes
        can_terminate: false
        description: >-
          Compute iota^(n) for n = 1..5 by direct composition, under M-affine and
          M-nonlinear separately, exhaustively over dim-1 kernels of the
          analogue. Report each model separately and never merged.

  replication:
    seeds: [3164739, 3164740, 3164741]
    seed_role: >-
      The census, the null matrices, and the reference cross-check are each
      re-drawn under all three master seeds. The IDENTITY-BASED metrics G1-G6
      are SEED-INVARIANT BY CONSTRUCTION -- they are exact integer identities --
      so seed-to-seed variation in them is itself a defect indicator and is
      reported as such. G7 and G8 are distributional and their seed-to-seed
      spread is reported BEFORE any comparison against a predicted value.
    replicates_per_cell: 3

  budget:
    wall_clock_seconds: 3600
    cpu_cores: 4
    memory_gb: 4
    max_runs: 12
    compute_reported_separately: >-
      Per protocol-amendment-GOAL-AES-001-005 Part B clause C4, the declared
      budget is calibrated against AUTHORING-INCLUSIVE session elapsed and the
      compute component is reported separately. Estimated compute: under 300
      seconds across all stages.
    stamp_duty: >-
      Per clause C2, the executing task records a first-act UTC stamp carrying
      start_utc, the declared budget and a COMPUTED binding_stop_utc; a stamp at
      every stage boundary; a halt at binding_stop_utc; and commits the stamps as
      a declared artifact.

  stopping_rules:
    - S1 disagrees with the Assembly -> HALT, report the disagreement, run no further stage.
    - S2 fails either witness -> HALT, report instrument failure, forbid any negative conclusion.
    - S0's null probes misbehave or the rank routines disagree -> HALT, report as infrastructure.
    - binding_stop_utc reached -> HALT and report reached coverage as coverage, never as a distribution.
    - The census exceeds the declared sample size -> STOP at the declared size; the sample is not expanded until a desired value appears.

  invalidation_rules:
    - ARM-T and ARM-N drawn from different seed streams, different sample sizes, or with different rejection handling -> the comparison is INVALID and no verdict is issued.
    - The frozen verdict rule altered after any number from either arm is observed -> the run is INVALID; a change requires a versioned amendment with confirmatory_status exploratory_only, never an edit.
    - Any census number reported before the S0 rank cross-check has passed -> INVALID.
    - Per-word B and joint J merged into a single reported figure at WIT-A -> INVALID (G10 exists to prevent exactly this).
    - Any GF(2^4) composition number reported as a GF(2^8) fact -> INVALID.

  infrastructure_failure_disposition: >-
    A timeout, crash, missing dependency, or unreadable committed artifact is
    reported as INFRASTRUCTURE SIGNAL with the reached coverage stated, and is
    NEVER negative mathematical evidence (AGENTS.md rule 5). SPECIFICALLY: if
    numpy is absent in the dispatch environment, the GF(2^8) census legs are
    declared OUT OF SCOPE AS INFRASTRUCTURE and the two named witnesses -- which
    are pure-Python and cost seconds -- are run anyway, because they alone
    discharge the positive control. If the committed GF(2^4) analogue matrix
    cannot be read, the composition leg is declared out of scope rather than run
    against an invented matrix.

  success_criterion: >-
    S1's independent re-derivation AGREES with the Assembly; S2 reproduces BOTH
    forced witness pairs exactly; G1 = 0 on ARM-T at every measured kernel;
    G4 = 1.000; G5 returns exactly 3, 2, 1; and the frozen verdict rule, executed
    on ARM-N first and then on ARM-T, emits a label. THE SUCCESS CRITERION IS
    THAT THE EXPERIMENT ANSWERS, NOT THAT IT ANSWERS IN THE PREDICTED DIRECTION:
    a REPAIRS_INDUCTION verdict is a successful run and a far more consequential
    one.

  falsification_criterion: >-
    Any of: S1 disagrees with the Assembly; G1 > 0 at any kernel on ARM-T;
    G2 != (3, 0) or G3 != (1, 2); G4 < 1.000; G5's per-step difference is not
    exactly -1; G7 < 0.95; or a measured kernel satisfying the REPAIRS_INDUCTION
    condition. Each falsifies a named component of H-AES-0e5fa1 and the record
    states which.

  required_artifacts:
    - The S1 independent re-derivation, written out in full, committed before any compute.
    - The environment probe receipt with per-probe command, exit code, stdout, timestamp and git commit.
    - The rank cross-check result, 200 seeded instances, with the seed.
    - The ARM-N output and its SHA-256, committed BEFORE ARM-T is executed, with the frozen verdict rule's label on it.
    - The full census output per arm: kernel basis, s, dim W_S, dim(W_S int K), dim(W_S + K), log_q B, log_q iota, residual.
    - The two witness pairs as exact integers.
    - The GF(2^4) composition table, M-affine and M-nonlinear reported separately.
    - The rejection log for every rejected seeded draw.
    - The C2 UTC stamp artifact.
    - A covering manifest carrying an artifact_provenance list over every declared artifact of the task, per protocol-amendment-GOAL-AES-001-005 Part C, with every other manifest of the task appearing as an ENTRY in it, and the four class names treated as closed and case-insensitive.

  approval_note: >-
    NO approved_by FIELD IS PRESENT AND NONE MAY BE ADDED BY ANY ROLE BUT THE
    COORDINATOR (AGENTS.md rule 1). This contract is status review_required,
    frozen false, execution_authorized false, evidence_eligible false. It
    requests no gate be treated as satisfied. Cross-model independence is
    unavailable under inference-amendment-TASK-20260731-602 (commit 0137a051),
    so no outcome of this experiment may be treated as a closure attestation and
    none is recorded.

  inference:
    requested_policy: research-deep
    resolved_model_id: claude-opus-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
      orchestration/model-policies.yaml. Recorded, never silently substituted
      (AGENTS.md rule 11).
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    model_verified_reason: >-
      No adapter probe receipt exists for this session;
      `python3 -m orchestration.adapter doctor --probe` was not run.

  source_refs:
    - ledger/hypotheses/H-AES-0e5fa1.yaml
    - ledger/proposals/IDEA-20260805-947f67.yaml
    - ledger/proposals/IDEA-20260805-78d9bd.yaml
    - ledger/questions/RQ-AES-001.yaml
    - ledger/goals/GOAL-AES-001.yaml
    - coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-806/od4_branching_bound_report.md
    - coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-810/redteam_findings.yaml
    - docs/inventor-protocol.md
    - docs/claims-and-verification.md
