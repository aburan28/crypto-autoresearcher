experiment:
  id: EXP-FALCON-cad4fe
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-5dd256; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-5dd256
  question_id: RQ-FNDSA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Observation-collision audit of the map from secret basis to exact-arithmetic sampler output
    law, with symbolic factoring analysis and exactly enumerated collision witnesses at toy dimension.
  objective: 'The uncertainty a run reduces is whether the distributional channel this research question
    studies can identify a secret basis at all, as opposed to identifying only a coarser invariant
    of it. In parts: (i) whether the output law, written symbolically as a function of the ordered
    Gram-Schmidt frame, uses features of the basis that the enumerated candidate symmetries preserve,
    which is settled at zero compute and closes or opens each candidate before any run; (ii) for each
    candidate not settled symbolically, whether an explicit pair of distinct bases of one toy lattice
    produces output laws that are equal entry by entry in exact rational arithmetic, verified by the
    validated enumeration instrument at d = 2 and again at d = 4; (iii) for any verified collision,
    how large the fiber is within the candidate group and whether its members have comparable likelihood
    under the toy key distribution, since a collision between a plausible and an implausible basis
    is a weaker ceiling. A run does not reduce uncertainty about whether recovery is possible, about
    deployed parameters, about finite-precision behaviour, or about security.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: for the exact-arithmetic Klein family
      at d in {2, 4} on the toy lattices constructed in this run, the enumerated candidate symmetries
      either do or do not preserve the output law, with the listed symbolic verdicts and the listed
      exactly verified witnesses. WHAT DOES NOT FOLLOW: that recovery is impossible, since the surviving
      invariant may still determine the key under the actual key distribution; that the map is injective,
      if no collision is found, because the candidate list is not exhaustive and a null result over
      a finite list is a statement about the list; anything about finite-precision samplers, which
      are outside this audit; anything about FN-DSA parameter sets or any released implementation;
      and nothing about security. A fiber size is a bound on what a channel distinguishes and is not
      an attack cost.'
  inputs:
    procedure: 'STAGE 0, cost under one hour: freeze the candidate symmetry list, the toy lattice
      construction, the equality criterion and the fiber-counting rule. STAGE 1, cost about one day,
      ZERO COMPUTE: write the output law symbolically as a function of the ordered Gram-Schmidt frame
      and record, for each candidate, whether it provably preserves or provably breaks the law; close
      every candidate settled here. STAGE 2, cost minutes: run the identity control and the known-different
      null through the validated enumeration instrument; HALT IF EITHER FAILS. STAGE 3, cost minutes
      per candidate: for each unsettled candidate, construct an explicit pair at d = 2 and enumerate
      both laws in exact rational arithmetic, comparing entry by entry. STAGE 4, cost about an hour:
      replicate every verified collision at d = 4, since a coincidence at the smallest dimension is
      not a structure. STAGE 5, cost about an hour: for each verified collision, count the fiber within
      the candidate group and compute the likelihood ratio of its members under the toy key distribution.
      STAGE 6, cost about half a day: write the quantifier-order statement required by inventor-protocol
      section 8 audit 3, stating explicitly whether each conclusion is over all lattices or only the
      constructed ones.'
    instrument: Pure Python 3 with fractions.Fraction, reusing the validated exact enumeration instrument
      specified in the first entry of this batch rather than reimplementing it, so that its nulls
      carry over. Symbolic work in STAGE 1 is done by hand and recorded in the run report as a derivation,
      with each step checked against a frozen numeric fixture in exact arithmetic. No numpy in the
      exact path. Run manifests through harness/runner.py. No Sage, no external computer algebra,
      no network.
    parameters: Lattice dimensions d in {2, 4}, with d = 8 attempted only if a collision survives
      both smaller dimensions. Width sigma in {1.5, 2.0}. Truncation radius 8 sigma with the tail
      bound reported, inherited from the enumeration instrument. Candidate symmetry list frozen at
      STAGE 0 and expected to contain between three and six entries, including signed permutation
      of Gram-Schmidt order, basis-preserving unimodular transformations, and sign flips of individual
      basis vectors. Five independently constructed toy lattices per dimension. Known-different null
      at perturbation sizes {1e-2, 1e-4, 1e-6} applied to one Gram-Schmidt norm.
  controls:
  - 'Known-different null: two bases with one Gram-Schmidt norm perturbed by a known amount, must
    be reported as unequal with a difference monotone in the perturbation.'
  - 'Identity control: a basis compared against itself, must be reported equal, confirming the check
    is not degenerate.'
  - 'Enumeration-instrument reuse: the equality check must run on the validated enumerator from the
    first entry of this batch, with its own nulls having passed, rather than on a fresh implementation.'
  - 'Key-plausibility control: for any collision found, evaluate both members'' likelihood under the
    toy key distribution, since a collision between a plausible and an implausible basis is a weaker
    ceiling.'
  - 'Dimension replication: verify any collision at both d = 2 and d = 4, since a coincidence at the
    smallest dimension is not a structure.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a pair of bases known to induce DIFFERENT laws,
    constructed by perturbing one Gram-Schmidt norm by a known amount, run through the IDENTICAL enumeration
    and equality check. The null must return a detected inequality, with the magnitude of the difference
    matching the injected perturbation; if the equality check reports equality on a pair known to
    differ, the check has insufficient resolution and every collision it reports is an artifact of
    that resolution rather than a genuine coincidence. A second null applies a transformation that
    trivially preserves the law, namely the identity, and must return equality, confirming the check
    is not simply always reporting difference.'
  independent_variables:
  - candidate symmetry
  - lattice dimension d
  - Gaussian width sigma
  - toy lattice index
  metrics:
    primary:
    - exact total variation between the two laws of each candidate pair, in rational arithmetic
    - symbolic verdict per candidate, preserves or breaks or unsettled
    - fiber size per verified collision within the candidate group
    - likelihood ratio of collision-pair members under the toy key distribution
    secondary:
    - enumerated support size and tail bound per comparison
    - exact total variation in the known-different null per perturbation size
    - count of candidates settled symbolically versus by enumeration
    - wall-clock per enumeration pair
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Whether the map from secret basis to exact-arithmetic output law factors through a strictly
      coarser invariant, expressed as the existence and size of a nontrivial fiber within the frozen
      candidate symmetry group.
    formula: A collision is declared if and only if the two enumerated pmf vectors are equal entry
      by entry as exact rationals over the common truncated support, with the truncation tail bound
      reported and required to be below 1e-30 so that equality cannot be an artifact of truncation.
      No approximate agreement counts. Fiber size is the number of distinct bases in the orbit of
      the stabilizing subgroup of the frozen candidate group.
    source: Pre-registered in the parent proposal IDEA-20260816-5dd256 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Witnesses are verified at d in {2, 4} and optionally 8, against a deployed dimension
      of 1024 or 2048, on toy lattices constructed in-run. The SYMBOLIC half of the audit is dimension-free
      by construction, since it inspects a functional dependence rather than a numerical value, but
      it is unverified above the enumerable range and this record reports the symbolic and verified
      halves separately rather than merging them. NO EXTRAPOLATION IS PERFORMED and no deployed-parameter
      statement is produced.
    correspondence: null
  tail_checks:
  - Require the truncation tail bound below 1e-30 before any equality is declared a collision, so
    that equality is not an artifact of the truncated support.
  - Report the maximum pointwise difference alongside the total variation, since two laws can have
    tiny total variation and still differ visibly at a rare point.
  - Replicate every collision at a second toy lattice and at a second width before reporting it.
  - Report the count of candidates settled symbolically separately from those settled by enumeration,
    since the two carry different confidence.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report instrument failure if the identity control or the known-different null fails.
  - Stop testing a candidate as soon as the symbolic pass settles it, rather than spending compute
    to confirm an argument.
  - Stop the audit at the frozen candidate list and report the list explicitly, never extending it
    opportunistically after seeing results.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both controls pass, every candidate in the frozen list receives an explicit verdict,
    and every verified collision is replicated at a second lattice, a second width and a second dimension,
    with truncation tail bounds below 1e-30 throughout.
  falsification_criterion:
  - Known-different null reported equal, or identity control reported unequal.
  - A symbolically predicted collision failing the enumerated check.
  - A d = 2 collision failing at d = 4.
  - Truncation tail bound above 1e-30 in any comparison where a collision is declared.
  - The report describing a null result over the candidate list as injectivity, which is a reporting
    failure and is listed here so that a reviewer can check for it directly.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-5dd256
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The candidate symmetry list is described but not enumerated, and the strength of every negative
    conclusion depends entirely on it.
  - The symbolic step asserts that the output law is determined by the ordered Gram-Schmidt frame,
    which is restated from existing corpus records and should be independently re-derived by the Coordinator
    before it carries an identifiability conclusion.
  - The toy key distribution used for the likelihood-ratio control is unspecified, and it determines
    whether a found collision is a meaningful ceiling or a curiosity.
  - The relationship between an exact-arithmetic collision and the finite-precision case is left entirely
    open and is arguably the more relevant setting.
