experiment:
  id: EXP-SIMSPK-fd009b
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-0d490e; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-0d490e
  question_id: RQ-SIMSPK-f6a6c0
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Measuring informative-censoring bias in optimal-trail rankings by imposing calibrated synthetic
    censoring on exhaustively computed ground truth, and comparing exclusion, lower-bound imputation
    and interval partial-order estimators against the known ordering
  objective: 'A run reduces exactly one uncertainty: whether the rankings this campaign will produce
    are ordered partly by which searches the solver happened to finish, and if so in which direction
    and by how much. Concretely it determines (i) whether censoring propensity correlates with true
    optimal weight, measured directly at a word size where the true optimum is known for every constant
    by exhaustive search, which is the mechanism the entry rests on and whose absence refutes it outright;
    (ii) the bias of three estimators, exclusion of censored constants, imputation at the lower bound,
    and an interval partial order, each scored against the known ordering by Kendall tau-b, mean signed
    rank displacement, and displacement of the top and bottom deciles, under real-propensity censoring
    and under a uniform-rate null at matched rates and across three rates; and (iii) the comparability
    fraction of the interval partial order and the budget-stability radius B*, the budget beyond which
    further search refines rather than revises the order. The zero-censoring arm and the lower-bound
    soundness check establish that the estimators and the search agree where nothing is hidden. No
    hypothesis is minted and no constant is ranked as a finding.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'At most, a run could support: at the ground-truth word size
      and round counts where exhaustive search completes for every constant, under the specific synthetic
      censoring propensities and rates applied, with the specific estimators implemented, (a) a measured
      correlation between censoring propensity and true optimal weight; (b) measured Kendall tau,
      mean signed rank displacement and decile displacements for each estimator under each censoring
      pattern; (c) the comparability fraction of the interval partial order; and (d) a budget-stability
      radius for the branch-and-bound arm at the word sizes run. What does NOT follow: that any specific
      ranking produced elsewhere in this campaign is wrong by the measured amount, since the propensity
      transfer across word size is an assumption and not a result; that the interval partial order
      recovers the true total order, which it deliberately does not; that any constant is strong,
      weak, optimal or anomalous, since no constant is ranked as a finding here; any security, attack
      or distinguisher claim; any statement about machine variance or this program''s cost model,
      which is a different and blacklisted lane; and anything about designer intent.'
  inputs:
    procedure: 'STAGE 0, freeze the estimators, censoring propensity forms, rates and thresholds,
      and hash the specification. Zero compute, 1 to 2 hours human. STAGE 1, ground truth: exhaustive
      dynamic-programming optimal differential trail weights for all 512 constants at word size 8,
      round counts 1 through 6, no budget parameter and therefore no censoring. Roughly 10 to 40 minutes
      single core. STAGE 2, cross-check: run branch-and-bound with a generous budget on the same cells
      and confirm it returns identical optima and sound lower bounds where it censors; any lower-bound
      violation halts. Minutes. STAGE 3, propensity calibration: measure the censoring rate and its
      dependence on a cheap difficulty proxy in the branch-and-bound arm at word size 16 under the
      campaign''s actual per-cell budget. Bounded by declared stage budget. STAGE 4, synthetic censoring:
      apply real-propensity, uniform-rate and zero patterns to the STAGE 1 ground truth at rates 0.1,
      0.25 and 0.5, plus half-strength and double-strength propensity variants and a threshold-propensity
      robustness form. Seconds. STAGE 5, estimators: compute exclusion, lower-bound imputation and
      interval partial order for every pattern-rate cell, and score each against ground truth. Seconds.
      STAGE 6, budget doubling: rerun a 10 percent subsample of word-size-16 branch-and-bound cells
      at twice the budget, count decensored cells, measure rank movement and estimate B*. Bounded
      by declared stage budget. STAGE 7, determinism rerun on a subsample confirming identical censoring
      indicators.'
    instrument: CPython 3.11 standard library only; numpy, z3, python-sat and pulp are absent in this
      environment as verified on 2026-08-16 and Sage is excluded by contract. Ground truth comes from
      an exhaustive dynamic program over the difference state, which has no budget parameter and is
      therefore censoring-free by construction; the branch-and-bound arm is the same Matsui-style
      search the trail-search contracts use, invoked as a frozen module rather than reimplemented,
      and instrumented to emit its lower bound and budget on every cell rather than only a completed
      flag. Kendall tau-b, the partial-order construction and the displacement statistics are implemented
      from scratch and cross-checked against a hand-computed 12-element fixture stored in the run
      directory. Seeds recorded; manifest and per-stage timing follow harness/runner.py conventions;
      identifiers minted with tools/allocate_id.py --next.
    parameters: 'Ground-truth arm: word size 8, all 512 constants or their orbit representatives,
      round counts 1 through 6, exhaustive dynamic programming over 2^{16} difference states per round.
      Censoring patterns: real-propensity logistic in true weight, uniform at matched rate, and zero;
      plus half-strength, double-strength and threshold-form robustness variants. Censoring rates:
      0.10, 0.25 and 0.50. Propensity calibration arm: word size 16, orbit representatives, round
      counts 1 through 12, per-cell budget as declared by the trail-search contract, with lower bound
      and budget emitted per cell. Budget-doubling arm: 10 percent subsample of word-size-16 cells
      at twice the per-cell budget. Determinism rerun: 10 percent subsample at identical budget. Estimators:
      three. Total run ceiling 7200 seconds excluding the inherited trail-search budgets.'
  controls:
  - Uniform-rate censoring null at matched rate, isolating what censoring costs when it carries no
    information about the true value.
  - Zero-censoring arm, where all three estimators must agree exactly with each other and with ground
    truth; disagreement is an implementation fault.
  - 'Determinism check: a subsample of cells rerun under the same budget must produce identical censoring
    indicators, confirming censoring reflects search difficulty rather than machine noise.'
  - 'Lower-bound soundness check at the ground-truth word size: every branch-and-bound w_lo must be
    at most the known true optimum, with any violation halting the run.'
  - 'Propensity-strength sensitivity: the measured censoring propensity applied at half and double
    strength, so the conclusion is not an artifact of one calibration.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a set of cells with a NON-informative censoring
    pattern of the same rate: censoring indicators drawn uniformly at random over the ground-truth
    grid, independent of the true weight, at exactly the rate observed in the real branch-and-bound
    arm. The identical exclusion, imputation and interval estimators run against it in the same invocation.
    What the null must show for the signal arm to mean anything: under uniform censoring the exclusion
    ranking''s Kendall tau against ground truth must be materially higher than under the real censoring
    propensity, and its mean signed rank displacement must be approximately zero rather than systematically
    signed. If the two censoring patterns produce indistinguishable bias, then the censoring here
    is effectively non-informative, the mechanism in claim (A) is refuted, and the correct conclusion
    is that exclusion is acceptable, which is a genuinely useful negative result that would save the
    campaign the interval machinery entirely. A second control is a zero-censoring arm, where all
    three estimators must agree exactly with ground truth and with each other; disagreement there
    is an implementation fault.'
  independent_variables:
  - censoring pattern (real-propensity, uniform, zero)
  - censoring rate (0.10, 0.25, 0.50)
  - estimator (exclusion, lower-bound imputation, interval partial order)
  - per-cell budget B (nominal and doubled)
  - propensity strength (half, nominal, double) and form (logistic, threshold)
  metrics:
    primary:
    - correlation between censoring propensity and true optimal weight
    - Kendall tau-b against ground truth per estimator per pattern per rate
    - mean signed rank displacement per estimator per pattern per rate
    - comparability fraction of the interval partial order
    secondary:
    - top-decile and bottom-decile rank displacement per estimator
    - budget-stability radius B* and the count of cells decensored under budget doubling
    - lower-bound soundness violations, required zero
    - determinism mismatches on the rerun subsample, required zero
    - wall-clock seconds and peak resident memory per stage
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The difference in Kendall tau-b against ground truth between the exclusion estimator
      under real-propensity censoring and the same estimator under uniform-rate censoring at the identical
      rate, evaluated at rates 0.10, 0.25 and 0.50; and the sign of the mean signed rank displacement
      of the exclusion estimator under real-propensity censoring.
    formula: 'Let w(c,r) be the exact optimal weight from the exhaustive arm. Under a censoring pattern
      P at rate p, each cell is marked censored with probability given by P; for the logistic real-propensity
      form, that probability is the logistic function of a scaled and centred w(c,r), with the scale
      chosen so the marginal censoring rate equals p exactly. The exclusion estimator ranks only constants
      with no censored cell; the imputation estimator ranks all constants using w_lo in place of censored
      values; the interval estimator orders constants c and c'' only when their intervals are disjoint,
      that is when the lower endpoint of one exceeds the upper endpoint of the other, and declares
      them incomparable otherwise. Each estimator''s ordering is scored against the ordering induced
      by w using tau-b. Predicted: tau under real-propensity censoring is strictly lower than under
      uniform censoring at every matched rate, with the gap increasing in p; and the mean signed rank
      displacement under real-propensity censoring is nonzero with the sign that advances constants
      of lighter true weight. No magnitudes are pre-committed, because no censoring propensity has
      ever been measured in this program.'
    source: Pre-registered in the parent proposal IDEA-20260816-0d490e before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The ground-truth arm runs at word size 8 with block size 16 bits, chosen not for
      cryptanalytic interest but because it is the largest size at which optimal trail weights are
      computable with certainty for every constant in pure Python, which is the only way to have a
      known ordering to measure bias against. The propensity-calibration and budget-doubling arms
      run at word size 16, the smallest deployed size, where censoring actually occurs. The transfer
      assumption is stated and is the entry''s main weakness: the censoring propensity is measured
      at word size 16 and applied synthetically at word size 8, and whether propensity transfers across
      word size is not established here. The half-strength and double-strength arms bound the consequence
      of getting the calibration wrong but do not remove the assumption, and every conclusion carries
      it. What does transfer without assumption is the estimator comparison itself, which is a mathematical
      property of the three estimators under any given censoring pattern.'
    correspondence: null
  tail_checks:
  - The top and bottom deciles of the true ordering are scored separately, since those are the regions
    a campaign quotes and an aggregate tau can look healthy while the tails are scrambled.
  - 'Constants with every cell censored are handled explicitly: they vanish entirely under exclusion,
    which is the most extreme case of the bias, and are reported by count.'
  - The rate 0.50 arm is reported separately since half the data missing is a regime where all three
    estimators may degrade for different reasons.
  - Cells whose lower bound at timeout equals the true optimum, meaning the search had effectively
    finished, are reported as a separate stratum since they dilute the measured effect.
  - The single largest positive and negative rank displacements are reported by constant, not only
    as a mean.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt the entire run on any lower-bound soundness violation, since an unsound lower bound invalidates
    the interval estimator and is a defect that must be fixed in the search before anything here means
    anything.
  - Halt and report an implementation fault if the zero-censoring arm shows any disagreement among
    the three estimators.
  - Halt the propensity-calibration and budget-doubling arms at their declared stage budgets and report
    the cells actually completed; a truncated calibration widens the reported uncertainty and is never
    padded.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Zero lower-bound soundness violations, zero determinism mismatches, exact agreement
    of all three estimators in the zero-censoring arm, and a reported correlation between censoring
    propensity and true weight together with the full estimator-by-pattern-by-rate table of tau and
    displacement statistics.
  falsification_criterion:
  - Correlation between censoring propensity and true optimal weight indistinguishable from zero,
    refuting the informative-censoring mechanism.
  - No measurable tau gap between real-propensity and uniform censoring at any rate, the same refutation
    from a second angle.
  - Mean signed rank displacement of the exclusion estimator indistinguishable from zero under real-propensity
    censoring.
  - Any lower-bound soundness violation.
  - Disagreement among estimators in the zero-censoring arm.
  - Non-deterministic censoring indicators on the rerun subsample, which relocates the question into
    the machine-variance lane and outside this contract's scope.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-0d490e
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Whether a censoring propensity measured at word size 16 may legitimately be applied to ground
    truth at word size 8 is the contract's central modelling assumption and the Coordinator must decide
    whether the sensitivity arms are sufficient or whether an intermediate word size must be added
    to test propensity transfer directly.
  - The trail-search contracts must be amended to emit a lower bound and a budget on every cell rather
    than a completed flag; without that instrumentation the interval estimator cannot be computed
    on real data at all, and the Coordinator owns whether that amendment is made before or after this
    contract runs.
  - The functional form of the synthetic censoring propensity, logistic versus threshold, is a modelling
    choice run both ways here, but the Coordinator must designate one as primary before the run so
    the headline number is not selected after the fact.
  - Whether the interval partial order becomes the campaign's reporting standard, replacing exclusion-based
    rankings, is a decision this contract informs but does not make, and it has downstream consequences
    for every record that quotes a rank.
