experiment:
  id: EXP-GGMB-cc98f1
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-569c82
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE PAIRING ORACLE IS THE CONSTANT ORACLE ON A PRIME-ORDER SUBGROUP, AND NO CM ENDOMORPHISM
    CAN RESCUE IT: the Weil pairing is alternating so e(R,S) = 1 identically on G x G, and the campaign''s
    own binding fact -- every endomorphism acts on G as a scalar (H-ENDO-001) -- forbids a distortion
    map inside End_{F_p}(E), which closes DECOMPOSITION lane L8''s stated open question about a CM-specific
    self-pairing computable without a second independent point; usefulness therefore requires resource
    R7, and the embedding degree that gates R7 is an isogeny-class invariant, so no walk can change
    it'
  status: draft
  objective: "(A) THE ORACLE. PAIR(h_1, h_2) returns the pairing value of two handles from G, in mu_N\
    \ inside F_{p^{k_emb}}, where k_emb is the embedding degree, the least k with N | p^k - 1.\n(B)\
    \ THE FIRST FACT, AND IT IS ELEMENTARY. The Weil pairing e_N is ALTERNATING: e_N(R, R) = 1 for\
    \ every R. G is cyclic of prime order N, so every pair of its elements is (R, S) = ([a]P, [b]P),\
    \ and bilinearity gives e_N(R, S) = e_N(P, P)^{ab} = 1. THE WEIL PAIRING RESTRICTED TO G x G IS\
    \ IDENTICALLY 1. The oracle is therefore the CONSTANT ORACLE: verdict SIM with T_sim = 0 group\
    \ operations, existential width Z = 1, and zero bits about k. It is closed by the strongest verdict\
    \ available in this lane and it is closed by an identity, not by an estimate.\n(C) THE SECOND\
    \ FACT, RELAYED AND FLAGGED. For an ordinary curve over F_p with k_emb > 1, the reduced Tate pairing\
    \ is likewise DEGENERATE on G x G: G is the eigenvalue-1 eigenspace of Frobenius in E[N], and\
    \ non-degeneracy of the reduced Tate pairing holds on G x G_2 where G_2 is the eigenvalue-p eigenspace,\
    \ not on G x G. This is the standard reason pairing-based protocols use two distinct groups. [RELAYED,\
    \ NOT RE-DERIVED HERE -- it is standard in the pairing literature and the corpus's own KN-TECH-032\
    \ records the MOV/ Frey-Ruck setting but not this degeneracy statement; it must be confirmed before\
    \ being cited as more than a working fact.] The boundary case k_emb = 1 (N | p - 1) admits a nontrivial\
    \ Tate self-pairing, and those curves are broken outright by the transfer into F_p^* regardless,\
    \ so the exception is real and irrelevant.\n(D) THE THIRD FACT, AND IT IS THE PROPOSAL'S ACTUAL\
    \ CONTRIBUTION, BECAUSE IT CLOSES A QUESTION THE CAMPAIGN WROTE DOWN AS OPEN. DECOMPOSITION lane\
    \ L8 states: \"nothing here is novel unless a CM-specific self-pairing computable without a second\
    \ independent point exists\". A self-pairing that is useful needs a DISTORTION MAP: a map psi\
    \ with psi(P) not in G, so that e_N(P, psi(P)) is nontrivial. On an ordinary prime-field curve\
    \ the natural candidate for psi is a CM endomorphism. IT CANNOT WORK, AND THE REASON IS THE CAMPAIGN'S\
    \ OWN ADMISSIBILITY FILTER: G has prime order N, so End(G) = Z/N and EVERY endomorphism of E acts\
    \ on G as multiplication by a scalar lambda (H-ENDO-001). Hence psi(P) = [lambda]P is IN G, and\
    \ e_N(P, psi(P)) = e_N(P, P)^lambda = 1. THERE IS NO DISTORTION MAP INSIDE End_{F_p}(E) FOR A\
    \ PRIME-ORDER SUBGROUP, FOR ANY CM DISCRIMINANT, INCLUDING D_0 = -3 AND D_0 = -4. L8's stated\
    \ escape hatch is closed by the same one-line fact that closes the endomorphism lane, which is\
    \ a satisfying consistency of the decomposition and worth recording as such. [Verheul's theorem\
    \ gives the same conclusion from a different direction -- that non-trivial distortion maps do\
    \ not exist for ordinary curves -- and is the external citation for this; NOT READ HERE and flagged\
    \ accordingly. The argument above is self-contained and does not need it.]\n(E) WHAT IS LEFT,\
    \ AND IT IS EXACTLY MOV. A useful pairing needs a SECOND independent point of order N, which exists\
    \ only in E(F_{p^{k_emb}}) -- i.e. it needs resource R7, a map into a different group. There the\
    \ oracle is NON-SIMULABLE (its answers are elements of a different group entirely, not functions\
    \ of lambda) and SELF-COMPUTABLE (Miller's algorithm, polynomial time from public data), so it\
    \ is cell (b) / verdict PUB in the IDEA-20260807-5876b8 taxonomy: the oracle framing is empty\
    \ and the question is the cost of the resulting ALGORITHM. That algorithm is MOV/Frey-Ruck (KN-TECH-032)\
    \ and it wins exactly when finite-field index calculus in F_{p^{k_emb}} costs less than 0.886*sqrt(N),\
    \ i.e. when\n  L_{p^{k_emb}}[1/3, c] < 0.886 * sqrt(N).\n[The numeric crossing point is a relayed\
    \ equivalence, not derived here: the widely published security-equivalence tables place a prime\
    \ field of about 3072 bits at roughly 128-bit security against the number field sieve, which at\
    \ a 256-bit N would put the crossing near k_emb of order 10. THE EXACT CONSTANT IS FLAGGED AS\
    \ UNVERIFIED IN THIS CORPUS and must be either derived or sourced before any record quotes a number.]\n\
    (F) THE CAMPAIGN-SPECIFIC OBSERVATION THAT MAKES THIS A SCOPING RESULT. k_emb = ord_N(p mod N)\
    \ depends only on p and N. Both are isogeny-class invariants (DECOMPOSITION T4 fixes t, hence\
    \ p and N across the class). THEREFORE THE EMBEDDING DEGREE IS CONSTANT ON AN ISOGENY CLASS AND\
    \ NO ISOGENY WALK CAN CHANGE IT. Combined with IDEA-20260807-d73e83, which shows the walk is generically\
    \ invisible anyway, lane L8 is a pure SCOPING lane exactly as DECOMPOSITION says: the only question\
    \ is which CM families happen to have small k_emb, and that is a property of the class one is\
    \ handed, not a property one can navigate to.\n(G) THE CONTROL ROLE, WHICH IS THE OTHER REASON\
    \ TO FILE THIS. The pairing oracle on a SUPERSINGULAR prime-field curve with k_emb = 2 IS non-simulable\
    \ and IS useful -- it is a genuine positive control for the adjudication procedure, and one of\
    \ only two this lane can name over prime fields (the other being the anomalous-curve transfer,\
    \ KN-TECH-033). Its existence is what keeps the adjudicator honest; its exclusion from the campaign's\
    \ target family is what makes the campaign's negatives narrow. Both facts belong in the same sentence\
    \ and are developed in IDEA-20260807-5ddd98."
  resource_label: 'R7 (pairings into F_{p^k}) as CLAIMED by lane L8. VERDICT: on G x G the resource
    is not delivered at all -- the pairing is identically trivial, so the oracle consumes no resource
    and is the constant oracle. R7 is genuinely consumed only after moving to E(F_{p^{k_emb}}) to
    obtain a second independent point, at which stage the oracle is self-computable and the question
    is the cost of MOV.'
  admissibility: inadmissible_generic_group
  admissibility_argument: 'INADMISSIBLE in its G x G form, and filed as a recorded closure per the
    IDEATION-BRIEF''s non-negotiable 1. The oracle''s only use of the pairing is to apply it to points
    of G, and on a prime-order cyclic group the alternating Weil pairing is identically 1 -- so the
    oracle is a constant function, simulable at T_sim = 0, carrying zero bits. The obstruction is
    named twice over: alternation of the Weil pairing, and (for the endomorphism-augmented variant)
    the scalar action of End on a prime-order subgroup, H-ENDO-001. The R7-consuming form is ADMISSIBLE
    but is not new: it is MOV, recorded as `known` by KN-TECH-032''s screening rule.'
  reachability_gate: 'DISCHARGED BY INVARIANCE. L8 is the one lane where a reachability question has
    a fully decided answer: the embedding degree k_emb = ord_N(p mod N) depends only on class-invariant
    data, so NO isogeny walk changes it, at any cost. There is no good curve to reach because every
    curve in the class has the same k_emb. Combined with IDEA-20260807-d73e83 (the walk is generically
    invisible), lane L8 has no reachability question left -- only the population question of which
    classes one is handed, which is a survey.'
  inputs:
    procedure: 'STAGE 0 (zero compute, 1 hour): the three arguments -- triviality, distortion-map
      impossibility, class-invariance of k_emb -- plus the supersingular boundary check that the argument
      does not prove too much. STAGE 1 (zero compute): Stage-0 literature obligation -- confirm or
      refuse to rely on the Tate-degeneracy statement of (C); log whatever is found to knowledge/literature/
      with an honest verified/relayed marker. STAGE 2 (toy compute, <= 15 min, HARD GATE): the pairing
      implementation''s positive control -- nontrivial e_N(P, R) and bilinearity on a curve with k_emb
      = 2 at p <= 2^16. STAGE 3 (toy compute, <= 15 min): the G x G triviality measurement, the CM
      self-pairing measurement on j = 0 and j = 1728, and the composite-order decay control. STAGE
      4 (toy compute, included): the supersingular k_emb = 2 fixture, where the distortion map must
      exist and the self-pairing must be nontrivial. STAGE 5 (zero compute): write the L8 closure
      with forward guidance (the remaining question is a population survey, not an experiment).'
    mechanism: 'STEP 1 (zero compute) -- THE TRIVIALITY IDENTITY. Write out e_N(R, S) = e_N(P, P)^{ab}
      = 1 using alternation and bilinearity. Two lines. Record the verdict SIM, T_sim = 0, Z = 1.

      STEP 2 (zero compute) -- THE TATE STATEMENT of (C), with its [relayed] flag, and a note that
      confirming it is a Stage-0 literature obligation before it is used in any conclusion.

      STEP 3 (zero compute) -- THE DISTORTION-MAP CLOSURE of (D). Combine H-ENDO-001''s scalar action
      with bilinearity to show every End-built self-pairing on G is trivial. Note explicitly which
      curves this covers: ALL ordinary prime-field curves with a prime-order subgroup, including j
      = 0 and j = 1728, which are exactly the CM cases L8 would have looked at.

      STEP 4 (zero compute) -- CLASS INVARIANCE OF k_emb. k_emb = ord_N(p mod N); p and N are fixed
      by the trace; the trace is fixed on the class (T4). Hence k_emb is class-constant. One line,
      and it converts L8 into a scoping lane.

      STEP 5 (toy compute, <= 15 minutes, CONFIRMATORY AND CHEAP) -- THE TRIVIALITY CHECK. At p <=
      2^20 on curves with a prime-order subgroup and small k_emb (chosen so that F_{p^{k_emb}} arithmetic
      is feasible in pure Python), compute the Weil pairing e_N(R, S) for many pairs from G and verify
      it is 1 in every case; then compute e_N(P, R) for R a second independent point of order N obtained
      in E(F_{p^{k_emb}}) and verify it is NOT 1, confirming the instrument can produce a nontrivial
      pairing at all. THE SECOND HALF IS THE POSITIVE CONTROL AND IS BLOCKING: a pairing implementation
      that returns 1 for everything would "confirm" (B) while being broken.

      STEP 6 (zero compute) -- write the L8 closure with its forward guidance: what remains open is
      only the population question (which CM families have small k_emb, and whether any standardized
      curve is near them), which is a survey, not an experiment.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - nontrivial e_N(P, R) with a second independent point, plus bilinearity (blocking positive control)
  - supersingular k_emb = 2 fixture where the distortion map must exist (proving-too-much control,
    blocking)
  - composite-order subgroup where triviality must FAIL (decay control)
  - isogeny-class enumeration with trace recorded per curve, so k_emb invariance is checked against
    a class that is actually a class
  - 'factored order and #E != p per curve (KN-TECH-030, KN-TECH-033 hygiene)'
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, and here the null and the positive control
    are the two halves of one measurement. NULL DIRECTION: the pairing of two elements of G must be
    1 for every pair tested. This is the claim, and on its own it is unfalsifiable by a broken implementation
    that always returns 1. PLANTED-SIGNAL DIRECTION, THEREFORE BLOCKING: the same implementation must
    return a NON-trivial value for e_N(P, R) with R a second independent point of order N in E(F_{p^{k_emb}}),
    and must satisfy the bilinearity check e_N([a]P, R) = e_N(P, R)^a for random a. An implementation
    failing either is void and the G x G result it produced is not evidence. DECAY PARAMETER: the
    order of the subgroup. Take a curve with a COMPOSITE subgroup of order N'' = N_1 * N_2 and pair
    elements within it: the triviality argument uses primality (cyclicity of the subgroup is what
    forces every pair to be (aP, bP)), so on a non-cyclic N''-torsion subgroup the pairing must become
    nontrivial. The measured triviality must therefore DECAY as the subgroup stops being cyclic of
    prime order. Triviality that persists on a non-cyclic subgroup is the artifact tell and means
    the implementation is not computing a pairing.'
  independent_variables: []
  metrics:
    primary:
    - fraction of G x G pairs with trivial pairing, per curve
    - value and bilinearity check of e_N(P, R) on the positive control
    - e_N(P, psi(P)) per CM discriminant tested
    - k_emb per curve across the enumerated class
    secondary:
    - pass/fail of the supersingular fixture and the composite-order control
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Weil pairing value e_N(R, S) over many random pairs from a prime-order G on toy curves
      with small k_emb
    formula: Exactly 1 in 100 percent of cases, at every tested curve and pair. A single nontrivial
      value contradicts alternation and is a suspected implementation error until replicated independently.
    source: pre-registered in IDEA-20260807-569c82 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - AN IMPLEMENTATION THAT ALWAYS RETURNS 1 would "confirm" the central claim while being broken.
    This is the dominant confounder and the entire reason the positive control is blocking rather
    than advisory.
  - PROVING TOO MUCH. An argument that also kills the supersingular case is wrong. The boundary fixture
    catches it.
  - CYCLICITY. Every claim uses prime order. A toy curve whose "prime-order subgroup" is actually
    composite silently breaks the argument's hypothesis, not its conclusion, and the order must be
    factored per curve.
  - FIELD ARITHMETIC AT k_emb > 2. Pure-Python F_{p^k} arithmetic is slow and the tested k_emb must
    stay small; conclusions about large k_emb come from the argument, never from the measurement.
  - RELAYED-FACT CREEP. The Tate degeneracy and Verheul's theorem are flagged relayed. If a downstream
    record quotes either as established on the strength of this proposal, that is a citation failure
    originating here.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Exactly 1 in 100 percent of cases, at every tested curve and pair. A single nontrivial
    value contradicts alternation and is a suspected implementation error until replicated independently.
  falsification_criterion:
  - A nontrivial Weil pairing between two elements of a cyclic prime-order G. This contradicts alternation;
    it is an implementation error until independently replicated, and only then a mathematical event.
  - A publicly computable psi on an ordinary prime-field curve with psi(P) not in G for prime-order
    G. This contradicts H-ENDO-001's scalar action; L8 reopens, and the campaign's admissibility filter
    itself would need re-examination, so it would be a major event requiring the AGENTS.md rule 12
    escalation.
  - The positive control fails -- e_N(P, R) trivial or bilinearity violated. The implementation is
    broken and the triviality result is void, not confirmed.
  - The supersingular fixture also comes out trivial. The argument proves too much and is wrong somewhere;
    the record is superseded rather than patched.
  - k_emb varies across an enumerated isogeny class. The class enumeration is wrong (mixed traces)
    and every class-invariance claim that used it is void.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
