# =============================================================================
# EXP-BINSTD-cf4bf7 -- VERSION 1 (APPROVED by DEC-20261001-f9f6d5) frozen
# contract for H-BINSTD-4a2f99: Stage 0 HOLD-N corrected ladder + ord/f
# census; Stage 1 primary toy pair construction; Stage 4 structural
# null/contrast certificates; optional Stages 2–3 WDSat conflict-ratio
# + within-curve non-stable control gated on engine availability.
#
# Source: IDEA-20260922-9e5383 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Absorbs HOLD-N review defects from
# analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-9e5383.yaml
# (verdict sound_with_corrections): null = ord_n(2)=n-1; n=31 invalid null;
# n=41 not poor; WDSat missing.
#
# ZERO RUNS in this design packet. Stages 0/1/4 authorized for later
# executor TASK-20261001-18804b. Stages 2–3 optional. No AUXIN.
# Amazon Bedrock prohibited. packaging_only false.
#
# certificate.kind vocabulary (docs/claims-and-verification.md):
#   discrete_log | decomposition | key_recovery | none
# Run manifests for this experiment MUST use certificate.kind: none
# unless a verified decomposition certificate is independently re-checked.
# =============================================================================
experiment:
  id: EXP-BINSTD-cf4bf7
  hypothesis_id: H-BINSTD-4a2f99
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-9e5383
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    HOLD-N corrected c2tnb-null ladder; primary (d,k)=(2,17) vs primitive
    n=37; Stage 0/1/4 required; WDSat Stages 2–3 optional
  status: analyzed
  approved_by: DEC-20261001-f9f6d5
  approved_at: '2026-10-01'
  analyzed_by: DEC-20261001-8e3e9b
  analyzed_at: '2026-10-01'
  packaging_only: false
  approval:
    approved_by: DEC-20261001-f9f6d5
    composing_decision: DEC-20261001-f9f6d5
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Does NOT claim a break or rho
      competitiveness. HOLD-N defects absorbed.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 4]
    optional_stages: [2, 3]
    scientific_execution_authorized_note: >-
      Stages 0, 1, 4 are the required success path (arithmetic, toy curve
      construction, structural f certificates). Stages 2–3 (WDSat conflict
      ratio and within-curve non-stable control) run ONLY if a CNF-XOR/WDSat
      engine is available; otherwise write instrument_unavailable and stop
      those arms. No deployed-curve attacks. No Amazon Bedrock.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
  analysis:
    evidence_id: EV-BINSTD-01a202
    decision_id: DEC-20261001-8e3e9b
    decision: support
    strength: preliminary
    note: >-
      DO-1 structural instrument confirmed (f(37)=2, f(31)=7 contrast,
      ladder match); Stages 2–3 DO-6 infra not H1 falsification; scoped
      support only — no break/rho/exponent; Stage 2 remains optional.

  objective: >-
    (A) Freeze and independently recompute the HOLD-N-corrected five-pair
    field-size ladder with primitive-prime null arms and disclosed ratio
    errors. (B) Certify ord/f census including n=31 contrast (f=7) and
    n=37 null (f=2). (C) Construct the primary toy pair
    ((d,k)=(2,17) vs n=37) and verify point counts / subgroup orders.
    (D) Optionally measure WDSat conflict ratio on the richest stable
    F_4-subspace with within-curve non-stable control if the engine exists.

  class: measurement
  class_note: >-
    Instrument / null-object protocol measurement. Not a smoothness
    heuristic-validation CDF experiment and not a cost-model claiming
    cryptanalytic impact. Measured vs modeled columns stay separate.
    No exponent-moving claim.

  corrections_absorbed:
    hold_n_null_precondition: >-
      Null arms require ord_n(2)=n-1 (primitive prime). "Prime degree ⇒ no
      nontrivial stable subspace" is rejected as the general null claim.
    hold_n_n31_disqualified: >-
      n=31 has ord_31(2)=5, f=7, 128 stable subspaces — invalid as null;
      retained only as contrast control.
    hold_n_n41_not_poor: >-
      n=41 has ord_41(2)=20, f=3 — rejected as "poor-n" control.
    hold_n_ratio_errors_restated: >-
      After re-selection, pair-2 primary ratio error is −17.0pp (disclosed);
      pair 5 remains best ratio match (+0.2pp).
    hold_n_wdsat_gate: >-
      WDSat missing. Stages 2–3 optional; instrument_unavailable is
      infrastructure.

  scope:
    included:
      - >-
        Stage 0: write corrected-ladder.yaml (five pairs with ratios/errors);
        ord-f-census.yaml for n in {17,29,31,37,41,53}; ord17-of-4-lattice.yaml;
        methodological-note.md absorbing HOLD-N; preregistered-predictions.yaml
        BEFORE any Stage 2.
      - >-
        Stage 1: construct / record primary composite arm over F_{2^{34}}
        with F_4 structure and null arm over F_{2^{37}}; verify #E and
        prime-subgroup orders; write curve-construction.yaml.
      - >-
        Stage 4: factor x^37-1 and x^31-1 over F_2 (or equivalent divisor
        census); write null-arm-f-certificate.yaml (expect f=2) and
        contrast-n31-f-certificate.yaml (expect f=7).
      - >-
        Stage 2 (OPTIONAL): if WDSat/CNF-XOR available, build Weil-descent
        PDP on richest stable F_4-subspace; >=3 certified-UNSAT targets;
        conflict ratio vs 2^{ml}/m!; else instrument_unavailable.yaml.
      - >-
        Stage 3 (OPTIONAL): within-curve size-matched non-stable F_4
        subspace control under the same instrument; else skip with Stage 2.
    excluded:
      - Any scientific ECDLP / GHS / decomposition attack at m >= 131
      - Treating n=31 as a valid null arm
      - Using n=41 as a "poor" lattice control
      - Claiming transfer to deployed c2pnb/c2tnb rows beyond disclosed ratio errors
      - AUXIN edits
      - Amazon Bedrock
      - Claiming a break or any curve's attack cost
      - Treating missing WDSat as mathematical falsification of H1

  inputs:
    proposal: ledger/proposals/IDEA-20260922-9e5383.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-9e5383.yaml
    curve_audit: analysis/binstd-curve-audit/
    hypothesis: ledger/hypotheses/H-BINSTD-4a2f99.yaml
    related_designs:
      - ledger/hypotheses/H-FROB-a5bf86.yaml
      - ledger/proposals/IDEA-20260920-b9f0c5.yaml
      - ledger/proposals/IDEA-20260922-6cf862.yaml
      - ledger/proposals/IDEA-20260918-9abf42.yaml
    optional_code_refs:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
    cells:
      Stage0-corrected-ladder:
        pairs: 5
        null_policy: primitive_prime_ord_n_2_eq_n_minus_1
        primary: pair_2_dk_34_vs_n_37
      Stage0-census:
        n_set: [17, 29, 31, 37, 41, 53]
        primary_lattice: ord_17_of_4
      BIN-TOY-primary-composite:
        d: 2
        k: 17
        field_bits: 34
        base_field: F_4
        expected_stable_subspaces: 32
        expected_dims: [0, 1, 4, 5, 8, 9, 12, 13, 16, 17]
      BIN-TOY-primary-null:
        n: 37
        expected_f: 2
        expected_mid_dim_stable_V: false
      BIN-TOY-contrast-n31:
        n: 31
        expected_f: 7
        role: contrast_not_null

  controls:
    - name: primitive_prime_null
      object: >-
        n=37 with f=2; mid-dimension stable V must be absent.
    - name: nonprimitive_contrast
      object: >-
        n=31 with f=7; demonstrates source "prime⇒empty" claim is false.
    - name: within_curve_non_stable
      object: >-
        Optional Stage 3: size-matched random F_4-subspace on the same
        composite curve; must sit near 1 if Stage 2 claims stability pruning.
    - name: d1_cross_check
      object: >-
        Optional: cite archived H-FROB-a5bf86 / b9f0c5 d=1 result when
        available; do not invent numbers if absent.
    - name: seed_control
      object: '>=3 seeds for any Stage 2 target set.'
    - name: certificate_kind_vocabulary
      object: >-
        Every run manifest result.certificate.kind is one of
        discrete_log | decomposition | key_recovery | none.
    - name: no_break_guard
      object: No break / attack-cost claim in any artifact.

  independent_variables:
    - arm  # composite_stable | composite_nonstable | null_n37 | contrast_n31
    - d
    - k
    - n
    - subspace_kind  # stable | nonstable | absent
    - seed

  metrics:
    primary:
      - ladder_ratio_error_pp
      - ord_n_of_2
      - f_irreducible_factor_count
      - null_arm_f
      - contrast_n31_f
      - ord_17_of_4
      - stable_subspace_count_composite
    secondary:
      - wdsat_conflict_ratio  # Stage 2 optional
      - within_curve_non_stable_ratio  # Stage 3 optional
      - sat_engine_available
      - peak_rss_bytes
      - wall_s
      - termination_reason
      - curve_order_verified

  heuristic_under_test:
    - HEUR-BINSTD-4a2f99-H0
    - HEUR-BINSTD-4a2f99-H1
    - HEUR-BINSTD-4a2f99-H2

  preregistered_prediction:
    quantity: >-
      (A) Corrected ladder ratios/errors match frozen table exactly.
      (B) f(n=37)=2; f(n=31)=7; ord_17(4)=4 with 32 subspaces.
      (C) Optional Stage 2: conflict ratio within 1% of 1.0 (basis-blind
      prior) OR <=0.5 with within-curve non-stable near 1.
    formula: >-
      f = 1+(n-1)/ord_n(2) when (n-1) divisible by ord_n(2); ratio = dk/n;
      conflict_ratio = WDSat_conflicts / (2^{ml}/m!).
    source: >-
      IDEA-20260922-9e5383 (A)(C) arithmetic; HOLD-N review concrete_experiment;
      IDEA-20260920-b9f0c5 thresholds; H-BINSTD-4a2f99.
    claim_tier: observational
    measured_vs_modeled: >-
      ord_n(2), f, ratios, curve orders, and (if Stage 2) WDSat conflict
      counts / wall_s / peak_rss are MEASURED or independently recomputed.
      The a-priori basis-blind expectation (~1.0) is a MODELED prior from
      b9f0c5 and is never mixed into a measured column as if observed here
      before Stage 2 runs. Missing Stage 2 is recorded as
      instrument_unavailable, not as ratio=1.

  scale_relevance:
    tier: toy
    justification: >-
      Primary cell field sizes 34 and 37 bits versus deployed 176–368.
      Contribution is a matched null-object PROTOCOL with disclosed ratio
      errors, not a transfer claim to deployed ANSI rows.
    correspondence: >-
      Ratio triangulation to deployed c2pnb/c2tnb pairs with stated
      percentage-point errors; no Deuring-style exact correspondence to
      cryptographic scale.

  tail_checks:
    - Single richest stable subspace dimension chosen for Stage 2 reported explicitly.
    - Worst ladder ratio error (pair 2, −17.0pp) stated beside any primary-cell finding.
    - Any f≠2 on n=37 is a hard fail, not averaged away.

  replication:
    seeds:
      - 20261001
      - 20261002
      - 20261003
    independent_instances: >-
      Stage 0/4 are deterministic arithmetic (seed-free). Stage 1 curve
      construction is deterministic given frozen (A,B) choices recorded at
      setup. Optional Stage 2 uses >=3 fresh certified-UNSAT targets across
      the listed seeds when the engine is available.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 24
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete when corrected ladder, ord/f census, lattice, predictions, and methodological note are written.
    - Stage 1 complete when both primary curves are constructed and orders verified (or construction failure recorded as infrastructure).
    - Stage 4 complete when f certificates for n=37 and n=31 are written with expected values or explicit disagreement.
    - Stage 2/3: run to completion OR write instrument_unavailable; either satisfies the optional arm.
    - Advisory wall-clock: checkpoint and report; never fabricate completion.

  invalidation_rules:
    - Stage 0 arithmetic disagrees with frozen table without an identified recomputation bug
    - Treating n=31 as null arm
    - timeout/crash/OOM → failed_infrastructure, not negative math evidence
    - Amazon Bedrock invocation attempted → abort
    - Treating missing WDSat as H1 falsification → protocol violation
    - certificate.kind outside vocabulary → invalid run

  success_criterion: >-
    Stage 0: corrected ladder + census + lattice + predictions committed.
    Stage 1: primary composite and null curves recorded with verified orders
    OR documented infrastructure failure.
    Stage 4: f(n=37)=2 and f(n=31)=7 certificates written.
    Optional Stage 2/3: metrics OR instrument_unavailable.
    Decidable from predefined metrics; H0 success does not require Stage 2.

  falsification_criterion: >-
    Any Stage 0/4 disagreement with frozen ord/f/ratio cells after ruling
    out implementation bugs; OR mid-dim stable V on n=37; OR (Stage 2 only)
    stable ratio <=0.5 with within-curve non-stable also <=0.5.
    Missing Stage 2 is NOT falsification.

  required_artifacts:
    - experiments/EXP-BINSTD-cf4bf7/stage0/corrected-ladder.yaml
    - experiments/EXP-BINSTD-cf4bf7/stage0/ord-f-census.yaml
    - experiments/EXP-BINSTD-cf4bf7/stage0/ord17-of-4-lattice.yaml
    - experiments/EXP-BINSTD-cf4bf7/stage0/preregistered-predictions.yaml
    - experiments/EXP-BINSTD-cf4bf7/stage0/methodological-note.md
    - experiments/EXP-BINSTD-cf4bf7/stage1/curve-construction.yaml
    - experiments/EXP-BINSTD-cf4bf7/stage4/null-arm-f-certificate.yaml
    - experiments/EXP-BINSTD-cf4bf7/stage4/contrast-n31-f-certificate.yaml
    - experiments/EXP-BINSTD-cf4bf7/stage2/  # metrics or instrument_unavailable.yaml
    - experiments/EXP-BINSTD-cf4bf7/stage3/  # metrics or skip-with-stage2
    - experiments/EXP-BINSTD-cf4bf7/runs/*/manifest.yaml
    - experiments/EXP-BINSTD-cf4bf7/runs/*/raw-result.json
    - experiments/EXP-BINSTD-cf4bf7/runs/*/stdout.log

  procedure:
    stage0:
      - Recompute five deployed ratios and corrected toy (d,k)/n pairs; write corrected-ladder.yaml with error_pp.
      - Recompute ord_n(2) and f for n in {17,29,31,37,41,53}; write ord-f-census.yaml.
      - Recompute ord_17(4)=4 lattice; write ord17-of-4-lattice.yaml.
      - Write preregistered-predictions.yaml BEFORE Stage 2.
      - Write methodological-note.md citing HOLD-N defects absorbed.
    stage1:
      - Construct composite arm E over F_{2^{34}} with F_4-structure ((d,k)=(2,17)); record (A,B), #E, subgroup order.
      - Construct null arm E' over F_{2^{37}}; record same.
      - Verify orders; write curve-construction.yaml.
    stage4:
      - Factor x^37-1 over F_2 (or count irreducible factors); expect f=2.
      - Factor x^31-1 over F_2; expect f=7.
      - Write both certificates; hard-fail if expectations missed without bug note.
    stage2_optional:
      - Probe for WDSat / CNF-XOR engine; write engine-probe.yaml.
      - If absent: instrument_unavailable.yaml (infrastructure).
      - If present: build PDP on richest stable F_4-subspace; >=3 UNSAT targets; conflict ratio vs 2^{ml}/m!.
    stage3_optional:
      - If Stage 2 ran: measure within-curve non-stable control at matched dimension.
      - If Stage 2 unavailable: write skip note under stage3/.

  optimistic_assumptions:
    - assumption: >-
        Basis-blind prior (~1.0) imported from b9f0c5 applies at d=2 without
        re-validation
      bias_direction: >-
        May overstate confidence that Stage 2 will be near 1; flagged as prior,
        not measurement
    - assumption: >-
        Toy ratio triangulation is informative despite −17pp primary error
      bias_direction: >-
        Overstates deployed-field analogy; mitigated by per-cell error disclosure

  memory_accounting: >-
    Stage 0/1/4: negligible (Python arithmetic). Optional Stage 2: peak RSS
    of WDSat toy instances at 34-bit field; report measured peak_rss_bytes
    beside any conflict counts. No deployed-scale table memory claimed.

  assigned_to: executor
  dominated_by: >-
    Matched rho on standardized binary rows; this experiment is a control
    protocol, not an attack-cost improvement.
  sota_delta:
    time: Zero exponent; optional toy WDSat measurement only.
    memory: Unchanged for attack surfaces; toy instrument RSS only if Stage 2 runs.
    data_queries: N/A; adds corrected primitive-prime null ladder.
  impediments_declared:
    - id: IMP-WDSat-9e5383
      what_is_blocked: Stages 2–3 WDSat conflict-ratio and within-curve control
      condition: WDSat / CNF-XOR SAT engine not installed in this environment
      clears_when: >-
        A pinned CNF-XOR/WDSat engine is available on PATH or under a declared
        experiment tool path and probe returns available=true
      recheck: >-
        command -v wdsat; ls experiments/EXP-BINSTD-cf4bf7/tools/; write
        stage2/engine-probe.yaml
      asserts_nothing_about: >-
        Stage 0/1/4 arithmetic, ord/f census, or corrected ladder validity
    - id: IMP-FROB-d1-crosscheck
      what_is_blocked: Optional d=1 numeric cross-check against archived b9f0c5/H-FROB-a5bf86 results
      condition: >-
        No archived Stage-2-class d=1 WDSat result yet cited as durable
        evidence for the cross-check cell
      clears_when: >-
        A committed evidence/run record under H-FROB-a5bf86 / EXP-FROB-*
        provides a d=1 conflict-ratio figure that can be cited with provenance
      recheck: >-
        rg -n 'conflict_ratio|status:' ledger/hypotheses/H-FROB-a5bf86.yaml
        ledger/evidence/EV-FROB-*.yaml 2>/dev/null | head
      asserts_nothing_about: HOLD-N Stage 0/1/4 structural claims
