experiment:
  id: EXP-SHATWO-917635
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-b7c821; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-b7c821
  question_id: RQ-SHATWO-f196c7
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Canonical generalized-condition table and mechanical inside/outside-window extractor for
    step-reduced SHA-256, validated by exact recovery on synthetic tables and a closed-form-checked
    random-table null
  objective: The one uncertainty a run reduces is whether the conditions half of the frontier ledger
    can be made reproducible at all in this program. (i) It produces a declared per-bit, per-step
    condition alphabet with a canonical serialization and an exact inverse parser, plus a pure extractor
    mapping any table to the integer pair (conditions inside the message-modification window, conditions
    outside it) under a window rule that is a function of step index and one declared coverage depth
    parameter, with no judgement anywhere in the definition - which is precisely what RQ-SHATWO-f196c7's
    methods block requires and what no record in this repository currently provides. (ii) It validates
    the extractor against constructed ground truth rather than against a characteristic this program
    does not have and cannot obtain, by generating synthetic tables with exactly k conditions at declared
    positions straddling the window boundary and requiring exact recovery of both the total and the
    split for every k, and by checking counts on density-matched random tables against an independently
    derived closed-form expectation. (iii) It measures how much of the resulting number is the rule
    rather than the table, by sweeping the coverage depth parameter across its full range and reporting
    the induced range of the split, so that no downstream record can quote an inside-window count
    without its rule sensitivity. A run does NOT produce a condition count for any real characteristic
    and does NOT reduce uncertainty about whether such counts predict any frontier.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope: for the declared condition alphabet, window
      rule and tracked-word set, the extractor recovers constructed condition totals and inside/outside
      splits exactly on the full synthetic battery, matches the independently derived closed-form
      expectation on density-matched random tables, preserves counts across serialization round trip,
      and yields the emitted split range across the coverage depth parameter''s full range; and the
      coverage audit names exactly which of the declared condition types the alphabet cannot express.
      WHAT DOES NOT FOLLOW: any condition count for any real characteristic, since none is available
      and none is used; that the declared window rule is correct, since the contract measures its
      sensitivity rather than justifying it; that a condition count relates to any frontier, degrees-of-freedom
      deficit, or reachable step count; that the alphabet is adequate for characteristics not covered
      by the declared type list; and nothing about full 64-step SHA-256, HMAC-SHA-256, TLS certificate
      chains, code signing, or Bitcoin.'
  inputs:
    procedure: 'STAGE 0 (hours, human): write and hash the preregistration - the condition alphabet
      with each symbol''s meaning, the canonical serialization, the window rule as a function of step
      index and coverage depth, the tracked-word set, the declared condition-type list for the coverage
      audit, and the closed-form expectation derivation for random tables. STAGE 1 (hours, human;
      seconds machine): implement the serializer and its exact inverse parser, and require round-trip
      identity on 10000 random tables. STAGE 2 (hours, human; seconds machine): implement the extractor
      as a pure function and the synthetic table generator specified against the alphabet definition
      rather than against the extractor. STAGE 3 (seconds, machine): run the full synthetic battery
      - every k from 0 to table size, with placements straddling the window boundary - and require
      exact recovery of both total and split; abort on any mismatch. STAGE 4 (seconds, machine): 1000
      random tables per density level through the extractor, compared against the closed form. STAGE
      5 (seconds, machine): sensitivity sweep over the coverage depth parameter''s full range, emitting
      the induced split range. STAGE 6 (an hour, human; seconds machine): the coverage audit against
      the declared condition-type list, emitting by name every type the alphabet cannot express, plus
      the run manifest with seeds and the resolved inference block.'
    instrument: Python 3.11 in the standard library plus numpy for tabulation only; the condition
      table represented as a dense array of small integers with one symbol per state bit per step;
      a JSON canonical serialization with a declared form and a separately written parser; harness/runner.py
      for the run manifest, deterministic seeds and the inference block. No SAT solver, no linear
      algebra beyond counting, no computer-algebra system, and no Sage. The extractor is a single
      pure function with no state and no configuration beyond the two declared parameters.
    parameters: 'Step counts 1..64; tracked-word set declared as the eight working variables plus
      the expanded message word per step, at 32 bits each, giving a table of at most 64 x 9 x 32 =
      18432 cells. Synthetic battery: every k from 0 to 18432 sampled at 200 values, with 50 placements
      each straddling the window boundary. Random-table null: 1000 tables at each of 5 declared density
      levels. Coverage depth parameter swept over its full integer range 0..64. Serialization round
      trip on 10000 random tables. Declared condition-type list: at least 8 named types, emitted in
      full.'
  controls:
  - Random condition tables of matched density against an independently derived closed-form expectation,
    1000 draws per density, same invocation.
  - Zero table and fully constrained table as forced-value anchors returning (0, 0) and the full row
    counts exactly.
  - Serialization round trip on every table, requiring identical extracted counts before and after.
  - Sensitivity sweep over the full range of the coverage depth parameter, reporting how much of the
    split the rule contributes.
  - Coverage audit against a declared enumerated list of condition types, reporting by name which
    the alphabet cannot express.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Random condition tables of matched density, run through the identical
    extractor in the same invocation: 1000 tables per density level, with symbols drawn independently
    at declared marginal rates. For the extractor to mean anything, the counts it returns on random
    tables must match the combinatorial expectation computed independently in closed form - density
    times table size, split by the window rule''s row counts - to within sampling error. If the extractor
    reports counts on random tables that deviate from the closed-form expectation, it is measuring
    its own convention rather than the table, and no count it produces on any real table means anything.
    A second control is the zero table: an all-free table must return the pair (0, 0) exactly, and
    a fully constrained table must return the full row counts exactly, both forced values.'
  independent_variables:
  - constructed condition count k
  - placement of conditions relative to the window boundary
  - coverage depth parameter over 0..64
  - random-table density level
  metrics:
    primary:
    - recovered total versus constructed k
    - recovered inside/outside split versus constructed split
    - mean random-table count versus closed-form expectation per density
    - split range induced by sweeping the coverage depth parameter
    secondary:
    - serialization round-trip count stability over 10000 tables
    - monotonicity of the split in the coverage depth parameter
    - named condition types the alphabet cannot express
    - extractor wall-clock per table
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The number of synthetic battery cases on which the extractor's recovered total or split
      differs from the constructed value, and the width of the inside-window count's range induced
      by sweeping the coverage depth parameter across 0..64 at a fixed representative table.
    formula: 'mismatches = |{ (k, placement) in the battery : extracted_total != k OR extracted_split
      != constructed_split }|. Forced value: mismatches = 0 exactly; any nonzero value is a hard failure
      that stops the contract. rule_range = max over depth in 0..64 of inside_count(depth) minus min
      over depth in 0..64 of inside_count(depth), at a fixed representative table, reported as an
      absolute count and as a fraction of the table''s total condition count. No value of rule_range
      is predicted, because predicting it would fabricate the sensitivity measurement this contract
      exists to supply; it is reported and must accompany any downstream quotation of an inside-window
      count.'
    source: Pre-registered in the parent proposal IDEA-20260816-b7c821 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The table is built at the FULL SHA-256 parameter set - 64 steps, 32-bit words,
      the eight working variables plus the expanded message word - so there is no parameter-dimension
      reduction; the tier is toy because the content of every table is synthetic by construction rather
      than derived from any characteristic, which is the deliberate design that lets the contract
      run while RQ-SHATWO-f196c7''s KN-LIT constraint blocks characteristic work. The transfer assumption
      stated and NOT tested: that an extractor validated on synthetic tables behaves correctly on
      a real characteristic''s table, which is true of the code path by construction since the extractor
      never sees provenance, but which the coverage audit qualifies by naming the condition types
      the alphabet cannot represent at all.'
    correspondence: null
  tail_checks:
  - Check k = 0 and k = table size as forced anchors returning (0, 0) and the full row counts exactly.
  - Check placements exactly at the window boundary step, where an off-by-one in the rule is invisible
    everywhere else.
  - Check coverage depth 0 and 64, the two extremes at which the split must degenerate to all-outside
    and all-inside respectively.
  - Report the extracted counts for the 5 lowest and 5 highest density random tables individually,
    since a convention error shows most clearly at the extremes.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and FAIL on the first synthetic battery mismatch of either total or split.
  - Halt and FAIL on the first serialization round-trip count change.
  - Stop the sweep at the coverage depth parameter's declared full range; do not extend the parameter
    definition after seeing the range.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: mismatches = 0 across the full synthetic battery, random-table means match the
    independently derived closed form within sampling error at every density, counts survive 10000
    serialization round trips unchanged, the split is monotone in the coverage depth parameter, and
    both the rule_range and the named list of inexpressible condition types are emitted - with a nonempty
    inexpressible list counting as a complete and useful deliverable rather than a failure, since
    it states the representation's limit precisely.
  falsification_criterion:
  - Any synthetic battery case returns a total other than the constructed k, falsifying the extractor.
  - Any case returns a split other than the constructed split, falsifying the window rule's implementation.
  - The split is non-monotone in the coverage depth parameter, falsifying the rule's implementation.
  - Random-table means deviate systematically from the closed-form expectation, falsifying either
    the extractor's convention or the derivation, both of which are emitted so the reader can tell
    which.
  - Counts change across a serialization round trip, falsifying the canonical form.
  - rule_range is a large fraction of the total condition count, falsifying the usefulness of the
    inside-window count as a quantity independent of the rule - a reportable outcome rather than a
    bug.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-b7c821
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The coverage depth parameter has no principled value and the contract measures its effect instead
    of choosing it; a Coordinator must decide whether an inside-window count carrying a large rule_range
    is admissible in any record at all.
  - The declared condition-type list for the coverage audit is a judgement about what a characteristic
    could impose, and an incomplete list yields a falsely clean audit; it is emitted in full precisely
    so a later agent can extend it.
  - The tracked-word set is declared rather than derived, and a different choice changes every count;
    no argument is offered for the one chosen.
  - No argument establishes that an extractor validated on synthetic tables behaves correctly on a
    real characteristic's table beyond the fact that it never sees provenance.
