experiment:
  id: EXP-ECDLP-420e73
  hypothesis_id: H-ECDLP-77caa5
  version: 1
  title: >
    Charged-advice exponent gamma_C: Stage 0 planted-affine
    instrument at N=8191, D=20
  status: approved
  approved_by: coordinator
  approved_at: '2026-09-08'
  approval_decision: DEC-20260908-11e3ec
  approval_basis: >
    Standing user authorization recorded in AGENTS.md on
    2026-09-06 (ideas and experiments always approved once
    the protocol is complete). Coordinator completeness
    check is DEC-20260908-11e3ec after TASK-20260908-141ad9.
    User confirmation is not an outstanding gate.
  frozen: true
  frozen_at: '2026-09-08'
  execution_authorized: true
  execution_authorized_note: >
    Stage 0 only. Stages 1 and later remain unauthorized
    until an independent review of the Stage 0 instrument
    holds and a later Coordinator decision extends
    execution_authorized_stages. This approval does not
    authorize Stage 5 of EXP-ECDLP-a98ea9, does not
    classify W, and does not change H-ECDLP-07c7c6 or
    H-ECDLP-2ade73.
  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-11e3ec
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-141ad9
  source_proposal: IDEA-20260904-d84512
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-11e3ec under the standing 2026-09-06
    user authorization. Stage 0 is the planted-affine
    instrument. Any later stage needs a versioned
    protocol_amendment.

  objective: >
    Verify the S*T^2 identity at gamma=0, recover the
    planted affine relation k_v = 3*v+7 mod 8191 on
    V={0..19} by class C3, and confirm that the
    matched-marginal shuffle of those k_v values does
    not admit an exact C3 affine. Record gamma_power
    and gamma_linear as observations. Stage 0 decides
    whether the instrument works. It does not test H1
    on a curve, does not require gamma >= 0.9 at D=20,
    and does not authorize Stages 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: exact recovery of (a,b)=(3,7)
      on the planted table; no exact affine on the
      seed-20260908 shuffle; symbolic identity at
      gamma=0 and theta in {1/3, 1/2, 1}. Secondary:
      gamma_power and gamma_linear recorded on both
      arms. Certificate kind none.
    formula: >
      gamma_power = 1 - log(S_C) / log(D * log2 N)
      gamma_linear = 1 - S_C / (D * log2(N/D))
      with S_C the bit length of the C3 representation
      (two integers a,b in 0..N-1 plus a 64-bit header
      naming lambda=identity), log the natural log.
      Identity: for gamma=0 and D=N^theta,
      log_N(S*T^2) = 2 - theta with T = N^{1-theta}
      and S = D * log2 N, evaluated in float64 at
      N=8191 and theta in {1/3, 1/2, 1}. Relative
      error must be <= 1e-12.
      FORCED Stage 0: planted recovers a=3 and b=7;
      shuffle recovers_exact_affine is false;
      identity_pass is true.
    source: >
      ledger/proposals/IDEA-20260904-d84512.yaml
      claim (A), part (B) identity, and H2
      validation_plan linear o(1). Provenance
      internal; read in this design session.

  design_tightening_stage0_instrument_is_affine_recovery_not_gamma_0_9: >
    IDEA-20260904-d84512 names gamma_C >= 0.9 on the
    anomalous / affine-in-coordinate class. Under the
    record's own power definition
    S = (D * log2 N)^{1-gamma}, O(log N) advice at
    D=20 cannot reach gamma_power >= 0.9. Stage 0
    therefore treats exact recovery of the planted
    (a,b) as the instrument gate and records both
    gammas as observations. The 0.9 threshold is a
    Stage 1+ object on an authorized anomalous curve
    or a larger D, and is not authorized here. This
    is a disclosed tightening, not a silent change
    of the idea's claim.

  inputs:
    fixture:
      N: 8191
      D: 20
      V: integers 0 through 19 inclusive
      planted_a: 3
      planted_b: 7
      k_v_formula: '(3 * v + 7) mod 8191'
      lambda: identity
      shuffle_seed: 20260908
    representation_class_stage0:
      - C3 affine in a declared polylog-computable lambda
    combining_rule: >
      Least-squares fit of k_v = a*lambda(v)+b mod N
      over all pairs; exact recovery means the unique
      (a,b) in 0..N-1 satisfies every v in V.

  independent_variables:
    - arm in {planted, shuffle}
    - representation class (C3 only at Stage 0)

  null_object:
    name: matched-marginal shuffle of planted k_v
    construction: >
      Keep V and the multiset of k_v. Reassign by
      numpy default_rng(20260908).permutation of the
      planted k_v list.
    non_degeneracy_check: >
      Shuffle must not recover an exact affine.
      If it does, the instrument is broken.
    dynamic_range_demonstration: >
      Planted must recover (3,7) exactly. That is
      the known-representable rung. A curve
      measurement is not claimed at Stage 0.

  controls:
    - planted affine table (positive instrument)
    - matched-marginal shuffle (NULL-2)
    - symbolic S*T^2 identity at gamma=0
    - exact enumeration of the 20-row table (no sampling)

  metrics:
    primary:
      - planted_recovers_exact_affine boolean
      - planted_a_hat, planted_b_hat
      - shuffle_recovers_exact_affine boolean
      - identity_pass boolean
      - fixture_pass boolean
    secondary:
      - S_C bits on planted and shuffle
      - gamma_power on planted and shuffle
      - gamma_linear on planted and shuffle
      - wall-clock seconds and peak RSS

  heuristic_under_test: H2

  scale_relevance:
    tier: toy
    justification: >
      Synthetic 20-row table at N=8191. No curve.
      No transfer to cryptographic n. Stages 1+,
      when authorized, remain toy-scale until a
      later amendment says otherwise.
    correspondence: null

  tail_checks:
    - planted (a_hat, b_hat) == (3, 7)
    - shuffle residual is nonzero for every (a,b) tried
      by the frozen C3 fit
    - identity relative error <= 1e-12 at three thetas

  replication:
    seeds: [20260908]
    independent_instances: 1
  seeds_policy: >
    Seed 20260908 governs only the shuffle arm.
    The planted table and the identity are exact
    and are not seeded.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: recover (3,7) on planted,
      no exact affine on shuffle, identity_pass.
      Miss classifies the run failed_infrastructure
      and stops.
    - Stages 1 and later are not authorized.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing N, D, V, planted (a,b), lambda, or the shuffle seed after this freeze
    - Reading Stage 0 gamma as H1 support or as SMALL-W or LARGE-W
    - Reading a gamma_power < 0.9 on the planted table as instrument failure
    - Treating Stage 0 as a curve measurement or an anomalous control
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Changing H-ECDLP-07c7c6 or H-ECDLP-2ade73 from Stage 0 of this experiment

  success_criterion: >
    Stage 0 succeeds as a measurement when
    planted_recovers_exact_affine is true with
    (a_hat, b_hat) = (3, 7),
    shuffle_recovers_exact_affine is false,
    identity_pass is true, both gammas are
    recorded on both arms, and the run manifest
    carries certificate.kind none. Success is
    instrument reproduction, not an H1 claim.

  falsification_criterion: >
    Fixture miss is infrastructure, not
    mathematics. H1 and H2-on-a-curve are not
    testable at Stage 0. No Stage 0 outcome
    supports or weakens H-ECDLP-07c7c6 or
    classifies W.

  required_artifacts:
    - Stage 0 raw-result.json with planted/shuffle
      recovery flags, (a_hat,b_hat), S_C, both
      gammas, and identity residuals
    - fixture_pass boolean and the three forced checks
    - run manifest with command, git state,
      environment, seeds, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - Stage 0 is a synthetic table, not a curve.
    - C3 only. C1, C2, C4 are Stage 1+ objects.
    - Toy scale N=8191, D=20. No cryptographic transfer.
    - gamma >= 0.9 is not a Stage 0 gate, as disclosed above.
    - An H1 reading requires an authorized later-stage ladder.
    - No disposition of H-ECDLP-07c7c6 or H-ECDLP-2ade73.
    - No Stage 5 of a98ea9.
    - Certificate kind none. No solve, relation, or attack.
    - W is not classified.
