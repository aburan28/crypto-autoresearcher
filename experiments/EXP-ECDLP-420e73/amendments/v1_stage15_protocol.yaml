    - n_uncensored m on each arm
    - walk_hit_identity events and spare use
    - extra-start pin match
    - first_j reconstruction match at indices 0 and 10
    - design V prefix and k=21/k=256 pins
    - NULL-3 k prefix and index-20/255 pins
    - wall-clock seconds and peak RSS
  not_a_metric:
