  design_tightening_stage15_is_h3_ks_1e4_at_N_cbrt: >-
    IDEA-20260904-d84512 minimal_test and
    H3 validation_plan take D = round(N^{1/3})
    and D = round(N^{1/2}). Stages 7--14
    froze D=20. Stage 14 observed
    factor2_departure and ks_within_0_10
    false on all four arms at D=20. That
    is an H3 observation at D=20, not a
    license to hunt a new curve. Stage 15
    changes one thing relative to the live
    Stage 14 4096-spare contract: D from
    20 to round(N^{1/3})=256 on the same
    frozen Stage 7 curves. Design V is the
    k=1..256 prefix extension of the Stage 7
    20-set. NULL-3 k continues the Stage 10
    Random(20260908) stream from 20 to 256.
    Partition, addends, official starts
    0..9999, extra-start RNG, walk RNG,
    n_walks=10000, 4096 spares, cap formula
    8*ceil(N/D), and KS definition stay
    frozen; p = D/N becomes 256/N. D =
    round(N^{1/2}) is not this slice. Hard
    gate is fixture_pass. KS is not a gate.
    An H3 miss is not failed_infrastructure
    and not H1 closure. C1, C2, C3, C4,
    fishing-1000, Stage 10, and the D=20
    Stage 14 measurement are not re-run.

