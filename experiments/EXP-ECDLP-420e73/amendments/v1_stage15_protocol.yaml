    - >-
      STAGE 15, HARD GATE once authorized:
      fixture_pass. Crash, extra-start pin
      mismatch, first_j idx0 mismatch,
      design V prefix mismatch, NULL-3 k
      prefix mismatch, identity spare
      exhaustion below 10000 completed
      walks, or a claimed hit whose x is
      not in V classifies the run
      failed_infrastructure and stops.
    - >-
      A large KS distance, a factor-2
      mean miss, a heavy 99th percentile,
      or a large n_capped is not
      failed_infrastructure. It is an H3
      observation and is not H1.
    - Stage 16 and later remain unauthorized.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 15 is not in execution_authorized_stages
    - Changing p, (a,b), N, P, D, n_walks, seed, partition, addends, cap formula, extra-start RNG, or walk RNG after this freeze
    - Hunting a new cell or adding a second ordinary at p=16777213
    - Re-running C1, C2, C3, the Stage 10 walk, the Stage 12 three-arm C4, Stage 13 fishing-1000, or the Stage 14 D=20 KS and reading them as a Stage 15 measurement
    - Treating Stage 11's eight walks or Stage 14 D=20 hitting times as the Stage 15 measurement
    - Using partition x mod 16 (Stage 10 object)
    - Taking D = round(N^{1/2}) in this slice
    - Treating KS, a factor-2 miss, or n_capped as failed_infrastructure
    - Treating an H3 miss as H1 closure
    - Treating C4 or fishing min-gamma as admissible support for H1
    - Reading a Stage 15 KS as SMALL-W or LARGE-W
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this amendment
    - Changing H-ECDLP-07c7c6 or H-ECDLP-2ade73 from Stage 15
    - Citing Lange-Winterhof as support (it remains a recalled pointer)

  success_criterion: >-
    Stage 15 succeeds as a measurement when
    fixture_pass is true, KS distance is
    recorded on every arm or honestly
    null because m=0, certificate.kind is
    none, and KS is not read as H1 support.
    Success is an H3 observation at the
    frozen Stage 7 curves and D=256.

  falsification_criterion: >-
    H3 is not closed by this slice. A KS
    above 0.10, a factor-2 mean miss, or
    a heavy tail is a scoped observation
    at these curves, this partition, D=256,
    and 10000 walks, not H1 closure. Spare
    exhaustion is infrastructure, not a
    class result. No Stage 15 outcome
    supports or weakens H-ECDLP-07c7c6
    or classifies W.

  limitations:
    - One ordinary cell and one anomalous cell at p=16777213. No ladder.
    - D = round(N^{1/3}) only. D = round(N^{1/2}) is not this slice.
    - Toy scale. No cryptographic transfer.
    - KS excludes right-censored walks. If m=0 the distance is null.
    - Stage 14 D=20 starts 0..9999 are reused; hitting times are not nested.
    - Recalled Lange-Winterhof is a pointer, not support.
    - Recalled Smart/Satoh-Araki/Semaev remain pointers, not support.
    - W is not classified.
    - Stage 15 is not authorized by this filing.

  does_not:
    - Authorize Stage 15 or later of EXP-ECDLP-420e73.
    - Claim H1 or read a KS, gamma, C4 S_C, or fishing min-gamma as H1.
    - Treat an H3 miss as failed_infrastructure.
    - Treat an H3 miss as H1 closure.
    - Re-run C1, C2, C3, the Stage 10 walk, the Stage 12 three-arm C4, Stage 13 fishing-1000, or the Stage 14 D=20 KS.
    - Hunt a new cell.
    - Take D = round(N^{1/2}) in this slice.
    - Use partition x mod 16.
    - Authorize Stage 5 of EXP-ECDLP-a98ea9.
    - Classify W or fit a.
    - Change H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73 status.
    - Pin unofficial KS floats in commit messages.
