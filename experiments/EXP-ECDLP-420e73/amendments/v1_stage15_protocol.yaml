  walk_definition: >-
    Same independent_uniform r=16 walk as
    the live Stage 14 4096-spare contract.
    The 16 addend scalars stay frozen.
    From a start R = [s]P, each step draws
    j uniformly from {0,...,15} by the
    per-walk RNG and replaces R by
    R + [s_j]P. A hit is x(R) in the
    Stage 15 D=256 V of that arm (design
    or NULL-3). The start is checked
    (step 0) before any addition. Cap is
    8 * ceil(N/D) with the new D. If a
    walk hits O, record walk_hit_identity
    and retry with the next spare start.
    Spare exhaustion below 10000 completed
    walks is failed_infrastructure, not
    H3. Stage 14 hitting times are not a
    Stage 15 nested measurement: V grew.

