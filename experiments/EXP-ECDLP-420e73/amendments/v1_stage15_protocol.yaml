  arms:
    - T2 design V
    - T2 NULL-3 V
    - T1 design V
    - T1 NULL-3 V

  ks_definition: >-
    Per arm, let T_1, ..., T_m be the
    hitting times of walks that hit V
    before cap (right-censored / capped
    walks are excluded from KS and counted
    in n_capped). Let p = D/N for that
    cell, exact rational 256/N. The
    comparison law is Geometric including
    T=0 because the start is checked:
    P(T = k) = (1-p)^k * p for k = 0,1,2,...
    F_geo(t) = 1 - (1-p)^{t+1} for integer
    t >= 0. F_n is the empirical CDF of
    the m uncensored hitting times.
    ks_distance = max over the observed
    uncensored hitting times t of
    |F_n(t) - F_geo(t)|. Report it as a
    distance, not a hypothesis test and
    not a p-value. If m = 0, ks_distance
    is null and that is an H3 observation,
    not failed_infrastructure. The idea's
    "within 10 percent" is recorded as
    ks_within_0_10 = (ks_distance is not
    null and ks_distance <= 0.10). That
    flag is not a gate.

  percentile_99_definition: >-
    Per arm, the 99th percentile of the
    uncensored hitting times (nearest-rank
    at ceil(0.99 * m), 1-based) versus the
    geometric quantile t_geo_99, the
    smallest integer t with F_geo(t) >=
    0.99. A heavy tail is an H3 observation
    and is not failed_infrastructure.

  combining_rule: >-
    fixture_pass is true when 10000 walks
    complete or hit cap on every declared
    arm, every claimed hit has x in that
    arm's D=256 V, identity events are
    recorded, extra-start pins match,
    first_j at start_index 0 matches Stage
    11, first_j at start_index 10 matches
    the protocol pins, design V prefix
    k=1..20 matches Stage 7, NULL-3 k
    prefix matches Stage 10, and the
    process does not invent a start. Mean
    within factor 2 and ks_within_0_10 are
    not required.

  controls:
    - T2 anomalous #E=p at the frozen Stage 7 cell
    - T1 ordinary prime N != p at the same p
    - NULL-3 random 256-set V, Stage 10 stream continued
    - frozen addends, starts, extra-start RNG, walk RNG
    - no new cell hunt
    - D=20 Stage 14 KS is not re-run

  preregistered_prediction:
    quantity: >-
      Stage 15 H3 10^4-walk Kolmogorov-Smirnov
      at D=round(N^{1/3})=256 on the frozen
      Stage 7 curves. 10000 independent_uniform
      r=16 walks per (cell x V-or-NULL3) arm,
      4096 spares. Mean hitting time versus
      N/D, factor-2 departure, KS distance
      versus Geometric(256/N), and 99th
      percentile are recorded. An H3 miss is
      a model observation, not instrument
      failure and not H1. Certificate kind
      none. This is not an H1 claim.
    formula: >-
      FORCED Stage 15: fixture_pass is true.
      mean in [N/(2D), 2N/D] is NOT forced.
      ks_within_0_10 is NOT forced.
      C1 / C2 / C3 / C4 / fishing-1000 / Stage 10
      / Stage 14 D=20 KS are not Stage 15 objects.
    source: >-
      H-ECDLP-77caa5 heuristic H3,
      IDEA-20260904-d84512 H3
      validation_plan (10^4 walks, KS as a
      distance, 99th-percentile tail check)
      and minimal_test D = round(N^{1/3}).
      Provenance internal.

  independent_variables:
    - cell in {S7-T2-P16777213, S7-T1-P16777213}
    - arm in {design, NULL-3}
    - D = 256

  primary_metrics:
    - fixture_pass
    - ks_distance on each arm
    - ks_within_0_10 on each arm
    - mean_hitting_time on each arm
    - mean_over_N_over_D on each arm
    - factor2_departure boolean on each arm
    - n_capped on each arm
  secondary:
