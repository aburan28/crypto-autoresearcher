  design_tightening_stage12_is_c4_first_slice: >-
    IDEA-20260904-d84512 names C4 as a
    generic entropy coder, recorded as a
    non-admissible indicator only and
    never used to support a positive. A
    generic coder always reports some
    compression on a table of D integers
    written in a fixed width, purely from
    width padding. That floor is why NULL-2
    must reproduce whatever S_C the generic
    arm shows, and why a T2 or T1 C4
    reading cannot support H1. Stage 12
    changes one thing relative to Stage 8
    and Stage 9: the class. Cells, V, k,
    and the T1 NULL-2 shuffle stay frozen.
    Hard gate is fixture_pass. Both gammas
    are observations. C1, C2, C3, and the
    Stage 10/11 walks are not re-run.
    Fishing-1000 remains Stage 13+.

