protocol_amendment:
  experiment_id: EXP-ECDLP-420e73
  version_from: 1
  version_to: 1
  amendment_id: v1_stage1_protocol
  recorded_at: '2026-09-08'
  recorded_by_task: TASK-20260908-e60d2c
  archived_by: TASK-20260908-a92399
  reason: >-
    DEC-20260908-41ed64 held the Stage 0
    planted-affine instrument and required an
    ECC-first rerank. This amendment writes
    the Stage 1 protocol: one certified
    anomalous positive control and one
    same-prime NULL-1, class C3 only, D=20.
    It does not authorize Stage 1 execution.
  predecessor_path: experiments/EXP-ECDLP-420e73/specification.yaml
  predecessor_sha256: 3b7e4b6ba6360f4cf5f5e2eb2da482710c82d58bec9e4dadf16b36c10a91f514
  scientific_parameters_changed: true
  preregistered_prediction_changed: true
  affected_runs: []
  confirmatory_status: preserved
  approved_by: coordinator
  approval_decision: DEC-20260908-b020c7
  standing_authorization: >-
    AGENTS.md user instruction of 2026-09-06.
    This amendment freezes the Stage 1
    protocol text. Coordinator completeness
    for execution authorization is a later
    decision and is not performed here.
  execution_authorized_stages_remain: [0]
  stage1_authorized_by_this_amendment: false
  stage2_authorized_by_this_amendment: false
  exp_a98ea9_stage5_authorized: false
  SMALL_W_or_LARGE_W: false
  fit_of_a: false
  not_an_H1_claim: true
  certificate:
    kind: none
  claim_tier: observational
  scale_relevance:
    tier: toy
    p: 523
    N_max: 523
    correspondence: null

  design_tightening_stage1_gate_is_affine_recovery_not_gamma_0_9: >-
    IDEA-20260904-d84512 names gamma_C >= 0.9
    on the anomalous control. Under the
    power definition S = (D * log2 N)^{1-gamma},
    O(log N) advice at D=20 still cannot
    reach gamma_power >= 0.9. Stage 1
    therefore gates on exact C3 recovery on
    T2 under the declared formal-log lambda,
    and records both gammas as observations.
    The 0.9 threshold remains a later-stage
    object at larger D. This is the same
    disclosed tightening as Stage 0, now
    applied to a curve.

  cells:
    - id: S1-T2-P523
      role: positive_control_T2
      p: 523
      a: 2
      b: 6
      N: 523
      curve: y^2 = x^3 + 2x + 6 over F_523
      generator_P: [0, 23]
      order_check: '[N]P = O'
      count_method: >-
        #E = p+1+sum_x legendre(x^3+ax+b, p).
        Recounted in this design session:
        #E=523. Matches EXP-ECDLP-5cad48
        S1-P523 (internal).
      D: 20
      V_rule: x([k]P) for k=1..20
      V: [0, 436, 365, 181, 65, 502, 497, 417, 473, 485, 5, 500, 158, 362, 185, 419, 237, 340, 29, 42]
    - id: S1-NULL1-P523
      role: null_1_same_prime
      p: 523
      a: 3
      b: 3
      N: 503
      curve: y^2 = x^3 + 3x + 3 over F_523
      generator_P: [1, 141]
      order_check: '[N]P = O'
      count_method: >-
        First lex (a,b) in 0..15 after (2,6)
        with prime #E != p, via the same
        Legendre count. #E=503.
      D: 20
      V_rule: x([k]P) for k=1..20
      V: [1, 74, 512, 87, 98, 95, 425, 377, 392, 240, 85, 171, 219, 346, 361, 278, 197, 374, 262, 239]

  representation_class_stage1:
    - C3 affine in a declared polylog-computable lambda
  lambda_list:
    - id: identity
      formula: lambda(v) = v
      role: Stage 0 planted lambda. Not required to recover T2.
    - id: linearized_formal_log
      formula: >-
        For a point R=(x,y) with y != 0, Hensel-lift
        y to Z/p^2, compute [p]R~ in projective
        coordinates over Z/p^2, set t = -X * Y^{-1}
        mod p^2. Require t == 0 mod p (otherwise
        the lambda is inapplicable on that point).
        s = (t // p) mod p. lambda(v) is s of the
        unique R in <P> with x(R)=v and
        0 < k_v < N/2.
      role: required T2 instrument lambda
      method_pointer: >-
        experiments/EXP-ECDLP-bbb42f/driver/sssa.py
        formal_log_of_pP. Internal pointer to an
        existing SSSA linearization. Not a citation
        of Smart/Satoh-Araki/Semaev as support.
        Recalled Smart/Satoh-Araki/Semaev remain
        pointers only.

  combining_rule: >-
    Exact recovery means a unique (a,b) in 0..N-1
    satisfies k_v = a*lambda(v)+b mod N for every
    v in V on which lambda is applicable, and
    lambda is applicable on all D rows.

  controls:
    - T2 anomalous #E=p (positive instrument)
    - NULL-1 same p, prime N != p (structure-removed twin)
    - identity lambda (known-weak on T2)
    - linearized formal-log lambda (required on T2)
    - exact enumeration of the 20-row tables (no sampling)

  preregistered_prediction:
    quantity: >-
      Stage 1 instrument: C3 recovers an exact
      affine on T2 under linearized_formal_log.
      identity on T2 is recorded and is not a
      hard gate. NULL-1 recovers no exact affine
      under identity. linearized_formal_log on
      NULL-1 is inapplicable (t not 0 mod p) or
      recovers no exact affine. Both gammas are
      observations. Certificate kind none.
    formula: >-
      Same gamma_power and gamma_linear as
      EXP-ECDLP-420e73 Stage 0. FORCED Stage 1:
      T2 linearized_formal_log recovers_exact_affine
      is true; NULL-1 identity recovers_exact_affine
      is false; fixture_pass is true.
    source: >-
      H-ECDLP-77caa5 P-H2-ANOMALOUS and
      IDEA-20260904-d84512 T2 / NULL-1.
      Provenance internal.

  metrics:
    primary:
      - T2_formal_log_recovers_exact_affine boolean
      - T2_formal_log_a_hat, T2_formal_log_b_hat
      - NULL1_identity_recovers_exact_affine boolean
      - fixture_pass boolean
    secondary:
      - identity recovery flags on both cells
      - formal-log applicability and recovery on NULL-1
      - S_C bits and both gammas on both cells and both lambdas
      - wall-clock seconds and peak RSS

  heuristic_under_test: H2
  C1_C2_C4: Stage 2+ objects, not in this amendment
  ordinary_T1_ladder: Stage 2+ object, not in this amendment
  walk_length_H3: Stage 2+ object, not in this amendment
  fishing_1000_designs: Stage 2+ object, not in this amendment

  stopping_rules:
    - >-
      STAGE 1, HARD GATE once authorized: T2
      linearized_formal_log exact affine, NULL-1
      identity not exact affine. Miss classifies
      the run failed_infrastructure and stops.
    - Stage 2 and later remain unauthorized.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 1 is not in execution_authorized_stages
    - Changing p, (a,b), N, P, D, V, or lambda_list after this freeze
    - Reading Stage 1 gamma as H1 support or as SMALL-W or LARGE-W
    - Reading gamma_power < 0.9 on T2 as instrument failure
    - Treating Stage 1 as an ordinary-curve H1 measurement
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this amendment
    - Changing H-ECDLP-07c7c6 or H-ECDLP-2ade73 from Stage 1

  success_criterion: >
    Stage 1 succeeds as a measurement when T2
    linearized_formal_log recovers an exact
    affine, NULL-1 identity does not, both
    gammas are recorded, and certificate.kind
    is none. Success is H2 instrument
    reproduction on one toy anomalous curve,
    not an H1 claim.

  falsification_criterion: >
    T2 formal-log miss is infrastructure, not
    a statement that anomalous curves have no
    short advice. H1 is not testable at
    Stage 1. No Stage 1 outcome supports or
    weakens H-ECDLP-07c7c6 or classifies W.

  limitations:
    - One anomalous curve at p=523. No ladder.
    - C3 only. C1, C2, C4 remain Stage 2+.
    - Toy scale. No cryptographic transfer.
    - gamma >= 0.9 is not a Stage 1 gate.
    - Recalled Smart/Satoh-Araki/Semaev are pointers, not support.
    - W is not classified.
    - Stage 1 is not authorized by this filing.
