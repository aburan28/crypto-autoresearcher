  stage12_comparison_not_rerun: >-
    Compare each cell's Stage 13 min
    gamma_C against that cell's already
    recorded Stage 12 single-design
    gamma_C from RUN-ECDLP-420e73-S12.
    Do not re-run the Stage 12 three-arm
    C4 tables. Do not pin Stage 12 S_C
    or gamma values in this protocol.

  combining_rule: >-
    fixture_pass is true when 1000 valid
    designs are computed on T2 and on T1,
    every payload is 80 bytes, every
    landing reconstruction of (V, k)
    matches [k]P, design_index=0 k and
    k_inc match the frozen pins, min
    gamma_C is recorded on each cell,
    and the process does not crash. A
    small or large min gamma is not
    required. C4 never supports a
    positive. Fishing min-gamma never
    supports a positive.

  controls:
    - T2 anomalous #E=p at the frozen Stage 7 cell
    - T1 ordinary prime N != p at the same p
    - 1000 independent random designs of size D per cell
    - Stage 12 single-design C4 gamma as the comparison point, not re-run
    - increasing-v order (k-order 1,2,...,D forbidden)

  arms:
    - T2 1000 random designs
    - T1 1000 random designs

  c1_not_rerun: Stage 8 object. A second C1 at these cells is restatement.
  c2_not_rerun: Stage 9 object. A second C2 at these cells is restatement.
  c3_not_rerun: Stages 4--7 object. A second C3 at these cells is restatement.
  h3_walks_not_rerun: Stage 10 and Stage 11 objects. A second copy is restatement.
  c4_first_slice_not_rerun: >-
    Stage 12 already measured C4 on the
    three frozen tables. A second copy is
    restatement. Stage 13 reads those
    recorded gammas as comparison points.

  preregistered_prediction:
    quantity: >-
      Stage 13 fishing-1000 minimum
      gamma_C of the C4 zlib coder over
      1000 independent random designs of
      size D=20 on the frozen Stage 7
      cells. The idea's fishing correction
      compares a single design's gamma
      against that extreme-value
      distribution rather than against
      zero. C4 is a non-admissible
      indicator: no fishing reading
      supports H1. Both gammas are
      observations. Certificate kind none.
    formula: >-
      FORCED Stage 13: fixture_pass is true.
      min_gamma << Stage 12 gamma is NOT
      forced and is not H1. gamma >= 0.9
      is NOT a gate. 10^4-walk KS is not
      a Stage 13 object.
    source: >-
      IDEA-20260904-d84512 fishing
      correction. Provenance internal.
      C4 is disclosed as non-admissible.

  metrics:
