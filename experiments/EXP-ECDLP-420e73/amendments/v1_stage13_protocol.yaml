  design_tightening_stage13_is_fishing_1000: >-
    IDEA-20260904-d84512 names a fishing
    correction: for each cell, record the
    MINIMUM gamma_C over 1000 independently
    drawn random designs of the same size,
    and compare a single design's value
    against that extreme-value distribution
    rather than against zero. Stage 13
    changes one thing relative to Stage 12:
    the design sample. Cells, C4 coder,
    payload encoding, and D stay frozen.
    The three Stage 12 tables are not
    re-run. Hard gate is fixture_pass.
    Both gammas are observations. C4 and
    fishing min-gamma never support a
    positive. The idea's 10^4-walk KS plan
    remains a later expansion.

