  random_design_definition: >-
    A Stage 13 random design of size D=20
    on a cell is D distinct scalars k
    drawn without replacement from
    {1, 2, ..., N-1}, with V = x([k]P)
    for each k. This is a NULL-3-style
    random subset of x(G), not a shuffle
    of a frozen table. Identity landings,
    duplicate x-coordinates, and k_inc
    equal to [1, 2, ..., D] are invalid
    and are resampled.

  rng_formula: >-
    seed = 20260908.
    material = f"{seed}|{cell_id}|{design_index}".encode("ascii")
    when retry r >= 1:
    material = f"{seed}|{cell_id}|{design_index}|retry{r}".encode("ascii").
    rng_seed = int.from_bytes(hashlib.sha256(material).digest()[:8], "big").
    rng = random.Random(rng_seed).
    k = rng.sample(range(1, N), D).
    cell_id is S7-T2-P16777213 or
    S7-T1-P16777213. design_index runs
    0 through 999. Do not use
    PYTHONHASHSEED or hash() of a tuple.

  resample_rule: >-
    After sampling k, compute V via [k]P.
    Resample the whole design with the
    next retry r if any landing is
    identity, if any two points share x,
    or if increasing-v k_inc equals
    [1, 2, ..., D]. Start at r = 0 with
    the un-suffixed material. Cap retries
    at 32. Exhausting retries is
    failed_infrastructure, not a class
    result.

  n_designs: 1000
  seed: 20260908
  coder_definition: >-
    Same C4 coder as v1_stage12_protocol.
    For each design, form pairs (v, k),
    sort by v increasing, and take the k
    sequence k_inc. Encode k_inc as the
    concatenation of 20 big-endian
    unsigned 4-byte integers. Payload
    length is 80 bytes. S_C is eight
    times the length in bytes of
    zlib.compress(payload, 9) using
    CPython zlib defaults (wbits 15).
    gamma_power and gamma_linear use the
    Stage 0 formulas. Both gammas are
    observations.

  frozen_design0_protocol_freeze_not_a_run:
    T2:
      k: [12298913, 8467048, 14076747, 10936910, 7569783, 10645121, 2505911, 4502224, 1012183, 12777962, 16054694, 3388688, 13887009, 16099079, 14892208, 10680189, 7540820, 4260711, 16417450, 11779753]
      k_inc: [10936910, 16417450, 12298913, 8467048, 16054694, 14076747, 2505911, 4502224, 14892208, 12777962, 10645121, 3388688, 4260711, 1012183, 16099079, 7569783, 11779753, 10680189, 7540820, 13887009]
      retry: 0
    T1:
      k: [975148, 12294012, 7424872, 3457847, 15464397, 13949641, 15331771, 11788257, 1985447, 4061519, 15702412, 4284282, 15100540, 10472768, 9061857, 10419827, 9562457, 12432150, 6334657, 11755702]
      k_inc: [10419827, 11788257, 13949641, 4284282, 15464397, 11755702, 975148, 15331771, 7424872, 12294012, 10472768, 6334657, 4061519, 1985447, 9061857, 3457847, 15702412, 15100540, 9562457, 12432150]
      retry: 0
    note: >-
      These sequences are the unique
      design_index=0 draws under the RNG
      formula with retry 0. Pinning them
      is protocol-freeze confirmation of
      the sampler, not a Stage 13 S_C or
