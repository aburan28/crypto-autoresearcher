  run_id: RUN-ECDLP-420e73-S13
  implementation_path: experiments/EXP-ECDLP-420e73/implementation/stage13_fishing_1000_16777213.py

  S_C_formulas: >-
    payload = b"".join(k.to_bytes(4, "big")
    for k in k_inc).
    S_C_bits = 8 * len(zlib.compress(payload, 9)).
    This is an encoding-size observation,
    not a claim that a random design is
    short advice, and not H1.

  gamma_observation_formulas: >-
    Same as EXP-ECDLP-420e73 Stage 0
    specification.
    gamma_power = 1 - log(S_C) / log(D * log2 N)
    gamma_linear = 1 - S_C / (D * log2(N/D))
    Both gammas are observations.
    gamma_power < 0.9 is not a Stage 13 miss.
    A recorded fishing min-gamma is not
    H1 support.

  replication:
    seeds: [20260908]
    independent_instances: 1
    n_designs: 1000
    seeds_policy: >-
      Exact 1000 designs per cell from
      the sha256 RNG formula. The only
      seed is 20260908. No sampling of
      the frozen Stage 12 tables.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  required_artifacts:
    - raw-result.json with fixture_pass,
      min gammas, design0 pins, payload
      lengths, n_retries, and frozen
      parameters
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt
    - execution-report-s13.yaml

  stopping_rules:
    - >-
      STAGE 13, HARD GATE once authorized:
      fixture_pass. Crash, design0 pin
      mismatch, payload not 80 bytes,
      retry exhaustion, or failure to
      complete 1000 valid designs on
      both cells classifies the run
      failed_infrastructure and stops.
    - >-
      A large or small min gamma, or a
      gamma away from 0, is not
      failed_infrastructure. It is a C4
      fishing observation and is not H1.
    - Stage 14 and later remain unauthorized.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 13 is not in execution_authorized_stages
    - Changing p, (a,b), N, P, D, n_designs, seed, RNG formula, payload encoding, or zlib level after this freeze
    - Hunting a new cell or adding a second ordinary at p=16777213
    - Re-running C1, C2, C3, the Stage 10/11 walks, or the Stage 12 three-arm C4 and reading them as a Stage 13 measurement
    - Treating C4 or fishing min-gamma as admissible support for H1
    - Treating 10^4-walk KS as this slice
    - Reading a Stage 13 gamma as H1 support or as SMALL-W or LARGE-W
    - Treating a fishing floor as failed_infrastructure
    - Treating a fishing reading as H1 closure
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this amendment
    - Changing H-ECDLP-07c7c6 or H-ECDLP-2ade73 from Stage 13
    - Citing Lange-Winterhof as support (it remains a recalled pointer)

  success_criterion: >
    Stage 13 succeeds as a measurement when
    fixture_pass is true, min gamma_C is
    recorded on every cell, certificate.kind
    is none, and fishing min-gamma is not
    read as H1 support. Success is a C4
    fishing observation at the frozen
    Stage 7 cells.

  falsification_criterion: >
    Fishing-1000 has no live-side
    falsification of H1: C4 is a
    non-admissible indicator. A retry
    exhaustion is infrastructure, not a
    class result. No Stage 13 outcome
    supports or weakens H-ECDLP-07c7c6
    or classifies W.

  limitations:
    - One ordinary cell and one anomalous cell at p=16777213. No ladder.
    - Fishing-1000 first slice only. 10^4-walk KS is not this slice.
    - Toy scale. No cryptographic transfer.
    - Recalled Lange-Winterhof is a pointer, not support.
    - Recalled Smart/Satoh-Araki/Semaev remain pointers, not support.
    - W is not classified.
    - Stage 13 is not authorized by this filing.

  does_not:
    - Authorize Stage 13 or later of EXP-ECDLP-420e73.
    - Claim H1 or read a C4 S_C, gamma, or fishing min-gamma as H1.
    - Treat C4 or fishing-1000 as an admissible positive indicator.
    - Treat a fishing floor as failed_infrastructure.
    - Treat a fishing reading as H1 closure.
    - Re-run C1, C2, C3, the Stage 10/11 walks, or the Stage 12 three-arm C4.
    - Run the idea's 10^4-walk KS plan.
    - Authorize Stage 5 of EXP-ECDLP-a98ea9.
    - Classify W or fit a.
    - Change H-ECDLP-77caa5, H-ECDLP-07c7c6, or
      H-ECDLP-2ade73 status.
    - Pin zlib lengths or S_C in the protocol.
