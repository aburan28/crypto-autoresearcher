  walk_definition: >-
    Nearby-object r-adding walk with r=16.
    The 16 addend scalars stay frozen from
    Stage 10. From a start R = [s]P, each
    step draws j uniformly from {0,...,15}
    by the per-walk RNG defined below and
    replaces R by R + [s_j]P. A hit is
    x(R) in the frozen 20-set V of that
    arm (design V or NULL-3 V). The start
    is checked (step 0) before any
    addition. Cap is 8 * ceil(N/D), a
    formula, not a second hunt. If a walk
    hits O, record walk_hit_identity and
    retry with the next spare start using
    the same seed formula at that spare
    start_index. Spare exhaustion that
    leaves fewer than 8 completed walks
    is failed_infrastructure for that arm
    only if 8 hits cannot be completed;
    prefer recording the identity event
    rather than inventing a start. This
    walk is not a functional graph.
    Stage 10 cycle_length is not a
    Stage 11 object.

  frozen_walk_parameters:
    seed: 20260908
    r: 16
    partition: independent_uniform_0_15
    n_walks: 8
    n_spare_starts: 2
    cap_steps_formula: 8 * ceil(N/D)
    addend_scalars: [4083811, 14207148, 3197494, 5909533, 2112584, 3183261, 10497618, 7831654, 5887209, 4196257, 199026, 3111920, 8124186, 1874953, 16389255, 8467452]
    start_scalars: [16512131, 3548612, 6906991, 7276399, 14567537, 10110148, 14742596, 3279851, 3740181, 16190719]
    start_scalars_used: [16512131, 3548612, 6906991, 7276399, 14567537, 10110148, 14742596, 3279851]
    start_scalars_spare: [3740181, 16190719]
    note: >-
      The same addend and start lists are
      used on T2 and T1. Every listed
      scalar is strictly less than
      min(N_T1, N_T2) = 16770451. These
      lists are reused from
      v1_stage10_protocol. They are not
      redrawn.

  walk_rng:
    algorithm: >-
      For each walk, construct one
      random.Random instance from an
      integer seed that does not depend
      on PYTHONHASHSEED.
    material_ascii: '{seed}|{cell_id}|{start_index}|{arm}'
    seed_formula: >-
      material = f"{seed}|{cell_id}|{start_index}|{arm}".encode("ascii")
      walk_rng_seed = int.from_bytes(hashlib.sha256(material).digest()[:8], "big")
      rng = random.Random(walk_rng_seed)
    step_draw: rng.randrange(16)
    seed_int: 20260908
    cell_id_values: [S7-T2-P16777213, S7-T1-P16777213]
    start_index_official: [0, 1, 2, 3, 4, 5, 6, 7]
    start_index_spare: [8, 9]
    arm_values: [design, NULL-3]
    first_j_pin_is_not_a_run: true
    first_j_after_constructing_rng:
      S7-T2-P16777213:
        design: [6, 7, 14, 4, 4, 2, 5, 1, 8, 5]
        NULL-3: [5, 10, 11, 5, 13, 7, 5, 3, 1, 15]
      S7-T1-P16777213:
        design: [4, 7, 2, 8, 15, 3, 6, 9, 6, 4]
        NULL-3: [4, 15, 0, 1, 5, 7, 12, 7, 1, 15]
    first_j_note: >-
      first_j[cell][arm][start_index] is
      the first rng.randrange(16) after
      constructing that walk RNG. It is
      protocol-freeze confirmation, not
      a Stage 11 run. If the start is
      already in V, hitting_time is 0
      and first_j is unused as a step.
      Example: cell=S7-T2-P16777213,
      start_index=0, arm=design gives
      sha256(b"20260908|S7-T2-P16777213|0|design")
      = 021e3eda4148360d504a6aaff68a4c9c5b52f4c4794935763bdc4e023a949d88
      and walk_rng_seed = 152628544496219661.

  null3:
