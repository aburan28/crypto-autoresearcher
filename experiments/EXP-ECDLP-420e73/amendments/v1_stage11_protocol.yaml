  design_tightening_stage11_is_h3_nearby_object: >-
    H-ECDLP-77caa5 H3 states that an r-adding
    walk meets V after (1+o(1))*N/D steps in
    expectation. The random-model justification
    assumes a walk that mixes faster than
    1/(hitting time). Stage 10 measured the
    deterministic functional-graph walk
    j = x(R) mod 16. Every official start
    entered a short V-free cycle of length
    749--3336, which is O(sqrt(N)) at
    N=16777213. Missing a 20-set on those
    orbits is the expected functional-graph
    outcome, not sampling noise. Stage 11
    changes only how j is chosen: at each
    step j is drawn uniformly from
    {0,...,15} by a per-walk RNG, still
    using the frozen 16 addends. That is
    the inventor-protocol nearby-object
    control. The Stage 10 deterministic
    walk is not re-run. Hard gate is
    fixture_pass. An H3 miss remains a
    model observation, not
    failed_infrastructure and not H1
    closure. C1, C2, and C3 are not
    re-run. C4 and fishing-1000 become
    Stage 12+.

