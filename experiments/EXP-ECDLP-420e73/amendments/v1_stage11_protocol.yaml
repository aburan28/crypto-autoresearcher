    k: [12664300, 6842134, 11844367, 6996586, 4488890, 6629474, 1373371, 715077, 12256922, 7014070, 15143700, 12434262, 1263476, 13985324, 4621790, 8306822, 2915849, 13925014, 13948079, 8437742]
    V_T2: [5008632, 16059306, 6768596, 10311345, 12881503, 11670341, 2237608, 14433701, 3919924, 12118938, 1323836, 6448954, 12258498, 10503013, 6500704, 2551759, 11438792, 11003594, 6078716, 9225734]
    V_T1: [4232246, 12647966, 14113284, 15639226, 7796176, 11842120, 15492402, 3294931, 3074382, 11697033, 16598714, 2029482, 11658992, 11059053, 4883322, 369323, 1834504, 1634034, 12304223, 5575639]

  arms:
    - T2 design V
    - T2 NULL-3 V
    - T1 design V
    - T1 NULL-3 V

  deterministic_x_mod_16_not_rerun: >-
    Stage 10 already measured the
    deterministic j = x(R) mod 16 walk on
    these cells, addends, starts, and V
    sets. A second copy is restatement.
    Stage 11 runs only the re-randomized
    nearby-object walk.
  c1_not_rerun: >-
    C1 interpolants on these cells were
    measured in Stage 8. A second C1 at
    the same cells is restatement.
  c2_not_rerun: >-
    C2 linear complexity on these cells was
    measured in Stage 9. A second C2 at
    the same cells is restatement.
  c3_not_rerun: >-
    C3 affine recovery on these cells was
    measured in Stages 4--7. A second C3
    at the same cells is restatement.

  combining_rule: >-
    fixture_pass is true when 8 walks
    complete or hit cap without crash on
    every declared arm, every landing x
    that claims a hit is in that arm's V,
    every identity event is recorded, and
    the process does not invent a start.
    Mean within a factor 2 of N/D is not
    required. Reconstructing first_j from
    the seed formula is a protocol check,
    not a hard gate on hitting times.

  controls:
    - T2 anomalous #E=p at the frozen Stage 7 cell (H3 nearby-object on a short-advice curve)
    - T1 ordinary prime N != p at the same p (H3 nearby-object on an ordinary cell)
    - NULL-3 random 20-set V, same k list, seed 20260908
    - frozen addends, starts, and cap formula from Stage 10
    - Stage 10 deterministic walk is the baseline object, not re-run
    - no new cell hunt

  preregistered_prediction:
    quantity: >-
      Stage 11 H3 nearby-object walk-length
      measurement on the frozen Stage 7
      cells. Eight re-randomized walks per
      (cell x V-or-NULL3) arm. Mean hitting
      time versus N/D and any factor-2
      departure are recorded. Expected
      mean, if the mixing assumption holds
      for this nearby object, is
      Theta(N/D). An H3 miss is a model
      observation, not instrument failure.
      Certificate kind none. This is not
      an H1 claim and is not H1 closure.
      KS distance and 10^4 walks remain a
      later expansion.
    formula: >-
      FORCED Stage 11: fixture_pass is true.
      mean in [N/(2D), 2N/D] is NOT forced.
      C1 / C2 / C3 are not Stage 11 objects.
      The Stage 10 deterministic walk is
      not a Stage 11 object.
    source: >-
      H-ECDLP-77caa5 heuristic H3,
      IDEA-20260904-d84512 walk model, and
      inventor-protocol nearby-object
      control after RUN-ECDLP-420e73-S10.
      Provenance internal. The idea's
      10^4-walk KS plan is disclosed as
      not this slice.

  metrics:
    primary:
      - fixture_pass boolean
      - mean_hitting_time on each arm
      - mean_over_N_over_D on each arm
      - factor2_departure boolean on each arm
    secondary:
      - per-walk hitting times and whether capped
      - walk_hit_identity events and spare use
      - first_j reconstruction match
      - wall-clock seconds and peak RSS
    not_a_metric:
      - Stage 10 cycle_length
      - C1 degree
      - C2 linear complexity
      - C3 affine recovery
      - C4
      - fishing-1000

