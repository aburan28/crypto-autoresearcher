  reason: >-
    DEC-20260908-130aaf held the Stage 10 H3
    first-slice measurement: this frozen r=16
    x-mod-16 walk misses Theta(N/D) by a
    factor 2 because every official start
    entered a short V-free cycle. Re-running
    that deterministic walk is restatement.
    C4 and fishing-1000 on a non-mixing walk
    would measure cycle confinement again.
    This amendment writes the Stage 11
    protocol: the inventor-protocol
    nearby-object control that changes one
    thing — how j is chosen — on the same
    frozen Stage 7 cells, addends, starts,
    NULL-3, and cap. It does not authorize
    Stage 11 execution.
