    - stdout, stderr, environment.json, command.txt
    - execution-report-s11.yaml

  stopping_rules:
    - >-
      STAGE 11, HARD GATE once authorized:
      fixture_pass. Crash, invented start,
      landing-x not in V on a claimed hit,
      or failure to complete the eight
      walks classifies the run
      failed_infrastructure and stops.
    - >-
      Mean off by more than a factor 2
      of N/D is not failed_infrastructure.
      It is an H3 model observation and
      the declared falsification datum.
    - >-
      A walk that hits the cap without
      landing in V is a recorded
      observation, not infrastructure
      failure, if the walk completed.
    - Stage 12 and later remain unauthorized.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 11 is not in execution_authorized_stages
    - Changing p, (a,b), N, P, D, V, r, addends, starts, NULL-3 k, the cap formula, or the walk_rng formula after this freeze
    - Hunting a new cell or adding a second ordinary at p=16777213
    - Re-running the Stage 10 deterministic x-mod-16 walk and reading it as a Stage 11 measurement
    - Re-running C1, C2, or C3 on these cells and reading it as a Stage 11 measurement
    - Treating an 8-walk mean as a 10^4-walk KS measurement
    - Reading a Stage 11 gamma or walk mean as H1 support or as SMALL-W or LARGE-W
    - Treating an H3 factor-2 miss as failed_infrastructure
    - Treating an H3 miss as H1 closure
    - Treating one ordinary cell at D=20 as an H1 measurement
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this amendment
    - Changing H-ECDLP-07c7c6 or H-ECDLP-2ade73 from Stage 11
    - Citing Lange-Winterhof as support (it remains a recalled pointer)
    - Using PYTHONHASHSEED or hash() of a tuple as the walk seed

  success_criterion: >
    Stage 11 succeeds as a measurement when
    fixture_pass is true, eight walks are
    recorded on every arm, means and
    factor-2 flags are recorded, and
    certificate.kind is none. Success is
    an H3 nearby-object observation at the
    frozen Stage 7 cells. It is not an
    H1 claim and is not H1 closure.

  falsification_criterion: >
    A systematic mean departure from
    Theta(N/D) by more than a factor 2
    on an authorized arm is the H3
    falsification datum of
    H-ECDLP-77caa5, scoped to this
    nearby-object slice, these cells,
    r=16, independent_uniform_0_15, and
    n_walks=8. It does not close H1.
    No Stage 11 outcome supports or
    weakens H-ECDLP-07c7c6 or classifies W.

  limitations:
    - One ordinary cell and one anomalous cell at p=16777213. No ladder.
    - Eight walks, not 10^4. KS distance is not this slice.
    - C4 and fishing-1000 remain Stage 12+.
    - Toy scale. No cryptographic transfer.
    - Recalled Lange-Winterhof is a pointer, not support.
    - Recalled Smart/Satoh-Araki/Semaev remain pointers, not support.
    - W is not classified.
    - Stage 11 is not authorized by this filing.

  does_not:
    - Authorize Stage 11 or later of EXP-ECDLP-420e73.
    - Claim H1 or read a T1 walk mean as H1.
    - Treat an H3 factor-2 miss as failed_infrastructure.
    - Treat an H3 miss as H1 closure.
    - Treat eight walks as the idea's 10^4-walk KS plan.
    - Re-run the Stage 10 deterministic x-mod-16 walk.
    - Re-run C1, C2, or C3 on these cells.
    - Authorize Stage 5 of EXP-ECDLP-a98ea9.
    - Classify W or fit a.
    - Change H-ECDLP-77caa5, H-ECDLP-07c7c6, or
      H-ECDLP-2ade73 status.
    - Move C4 or fishing-1000 into Stage 11.
