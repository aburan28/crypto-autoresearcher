protocol_amendment:
  experiment_id: EXP-ECDLP-420e73
  version_from: 1
  version_to: 1
  amendment_id: v1_stage4_protocol
  recorded_at: '2026-09-08'
  recorded_by_task: TASK-20260908-2f8ded
  archived_by: TASK-20260908-f514f5
  reason: >-
    DEC-20260908-eab591 held the Stage 3
    instrument plus the next ordinary
    observation and required an ECC-first
    rerank. This amendment writes the first
    Stage 4 protocol: one ordinary T1 and
    one same-prime T2 at the idea's next
    named size p=262139 (18-bit), class C3
    only, D=20. It does not authorize
    Stage 4 execution.
  predecessor_path: experiments/EXP-ECDLP-420e73/amendments/v1_stage3_authorized.yaml
  predecessor_sha256: fcbaa5f9256ce48f5d0e32880296bad069022ae1bf67666e8325308a3a83c827
  scientific_parameters_changed: true
  preregistered_prediction_changed: true
  affected_runs: []
  confirmatory_status: preserved
  approved_by: coordinator
  approval_decision: DEC-20260908-3c577f
  standing_authorization: >-
    AGENTS.md user instruction of 2026-09-06.
    This amendment freezes the Stage 4
    protocol text, including budget,
    artifacts, and replication. Coordinator
    completeness for execution authorization
    is a later decision and is not performed
    here.
  execution_authorized_stages_remain: [0, 1, 2, 3]
  stage3_authorized_by_this_amendment: false
  stage4_authorized_by_this_amendment: false
  exp_a98ea9_stage5_authorized: false
  SMALL_W_or_LARGE_W: false
  fit_of_a: false
  not_an_H1_claim: true
  certificate:
    kind: none
  claim_tier: observational
  scale_relevance:
    tier: toy
    p: 262139
    N_max: 262139
    correspondence: null

  design_tightening_stage4_gate_is_t2_affine_not_t1_or_gamma_0_9: >-
    IDEA-20260904-d84512 names gamma_C >= 0.9
    on the anomalous control. Under the
    power definition S = (D * log2 N)^{1-gamma},
    O(log N) advice at D=20 still cannot
    reach gamma_power >= 0.9. Stage 4
    therefore gates on exact C3 recovery on
    T2 under the declared formal-log lambda,
    and records both gammas as observations.
    T1 exact affine is an observation, not a
    hard gate. A T1 non-recovery is the
    expected ordinary outcome at D=20 and
    is not failed_infrastructure. The 0.9
    threshold remains a later-stage object
    at larger D. This is the same disclosed
    tightening as Stages 0--3, now applied
    to the idea's next named T1 size 2^18.

  cells:
    - id: S4-T2-P262139
      role: positive_control_T2
      p: 262139
      a: 106
      b: 13
      N: 262139
      curve: y^2 = x^3 + 106x + 13 over F_262139
      generator_P: [2, 200493]
      order_check: '[N]P = O'
      count_method: >-
        Scan (a,b) in 0..127 via
        #E = p+1+sum_x chi(x^3+ax+b) with a
        QR table (curve_utils.point_count_with_qr).
        First lex pair with #E=p is (106,13).
        Recounted in this design session by
        explicit Legendre: #E=262139. Trace
        t=-1. Hasse |t|<=2*sqrt(p) holds.
        [N]P=O verified. On-curve verified.
      D: 20
      V_rule: x([k]P) for k=1..20
      V: [2, 1136, 251979, 209873, 144684, 42906, 240592, 176375, 184939, 157945, 75011, 138852, 247488, 234240, 255029, 200181, 114653, 218956, 229520, 262059]
    - id: S4-T1-P262139
      role: ordinary_T1_and_same_prime_null
      p: 262139
      a: 1
      b: 52
      N: 261439
      curve: y^2 = x^3 + x + 52 over F_262139
      generator_P: [3, 249411]
      order_check: '[N]P = O'
      count_method: >-
        First lex (a,b) with prime #E != p,
        via the same QR-sieve count and
        explicit Legendre recount. (0,0) is
        singular. All earlier nonsingular
        lex pairs have composite #E in
        {261288, 261369, 261411, 261456,
        261510, 261548, 261552, 261714,
        261720, 261753, 261795, 261813,
        261816, 261824, 261839, 261940,
        261979, 261984, 262018, 262036,
        262056, 262066, 262068, 262084,
        262116, 262117, 262140, 262154,
        262168, 262220, 262255, 262357,
        262404, 262405, 262460, 262500,
        262525, 262526, 262656, 262704,
        262758, 262788, 262794, 262824,
        262872, 262882, 262915, 262988,
        263008, 263016, 263050, 263152}.
        (1,52) has #E=261439 prime. Trace
        t=-701. Hasse holds. [N]P=O
        verified. On-curve verified. This
        cell is also the same-p ordinary
        (NULL-1 role). A second ordinary at
        p=262139 would be restatement of
        this cell, not a new measurement.
      D: 20
      V_rule: x([k]P) for k=1..20
      V: [3, 76720, 159789, 140040, 250531, 65927, 193243, 202502, 174467, 97932, 150254, 249184, 212315, 29553, 155044, 131285, 119861, 43011, 82732, 104615]

  representation_class_stage4:
    - C3 affine in a declared polylog-computable lambda
  lambda_list:
    - id: identity
      formula: lambda(v) = v
      role: >-
        Stage 0 planted lambda. T1 observation
        arm. Not required to recover T2.
    - id: linearized_formal_log
      formula: >-
        For a point R=(x,y) with y != 0, Hensel-lift
        y to Z/p^2, compute [p]R~ in projective
        coordinates over Z/p^2, set t = -X * Y^{-1}
        mod p^2. Require t == 0 mod p (otherwise
        the lambda is inapplicable on that point).
        s = (t // p) mod p. lambda(v) is s of the
        unique R in <P> with x(R)=v and
        0 < k_v < N/2.
      role: required T2 instrument lambda
      method_pointer: >-
        experiments/EXP-ECDLP-bbb42f/driver/sssa.py
        formal_log_of_pP. Internal pointer to an
        existing SSSA linearization. Not a citation
        of Smart/Satoh-Araki/Semaev as support.
        Recalled Smart/Satoh-Araki/Semaev remain
        pointers only.

  combining_rule: >-
    Exact recovery means a unique (a,b) in 0..N-1
    satisfies k_v = a*lambda(v)+b mod N for every
    v in V on which lambda is applicable, and
    lambda is applicable on all D rows.

  controls:
    - T2 anomalous #E=p at the idea's next named T1 size 2^18 (positive instrument)
    - T1 ordinary prime N != p at the same p (H1 next cell and same-p null)
    - identity lambda (observation on T1; known-weak on T2)
    - linearized formal-log lambda (required on T2)
    - exact enumeration of the 20-row tables (no sampling)

  preregistered_prediction:
    quantity: >-
      Stage 4 instrument plus next ordinary
      cell: C3 recovers an exact affine on T2
      under linearized_formal_log. identity on
      T2 is recorded and is not a hard gate.
      T1 identity exact affine is an
      observation and is expected false.
      linearized_formal_log on T1 is
      inapplicable (t not 0 mod p) or recovers
      no exact affine; that is an observation.
      Both gammas are observations. Certificate
      kind none. This is not an H1 claim.
    formula: >-
      Same gamma_power and gamma_linear as
      EXP-ECDLP-420e73 Stage 0. FORCED Stage 4:
      T2 linearized_formal_log recovers_exact_affine
      is true; fixture_pass is true. T1 identity
      recovers_exact_affine is NOT forced.
    source: >-
      H-ECDLP-77caa5 P-H1-GENERIC and
      P-H2-ANOMALOUS, and IDEA-20260904-d84512
      T1 / T2 at the next named size 2^18.
      Provenance internal.

  metrics:
    primary:
      - T2_formal_log_recovers_exact_affine boolean
      - T2_formal_log_a_hat, T2_formal_log_b_hat
      - T1_identity_recovers_exact_affine boolean
      - fixture_pass boolean
    secondary:
      - identity recovery flags on both cells
      - formal-log applicability and recovery on T1
      - S_C bits and both gammas on both cells and both lambdas
      - wall-clock seconds and peak RSS

  heuristic_under_test: H2_instrument_at_262139_and_next_T1_observation
  C1_C2_C4: Stage 5+ objects, not in this amendment
  remaining_T1_sizes: >-
    IDEA-20260904-d84512 T1 sizes 2^20 and
    above are Stage 5+ objects, not in this
    amendment.
  walk_length_H3: Stage 5+ object, not in this amendment
  fishing_1000_designs: Stage 5+ object, not in this amendment

  run_id: RUN-ECDLP-420e73-S4
  implementation_path: experiments/EXP-ECDLP-420e73/implementation/stage4_t1_262139.py
  formal_log_method_pointer: >-
    experiments/EXP-ECDLP-bbb42f/driver/sssa.py
    formal_log_of_pP. Internal. Recalled
    Smart/Satoh-Araki/Semaev remain pointers,
    not support.

  gamma_observation_formulas: >-
    Same as EXP-ECDLP-420e73 Stage 0 specification.
    gamma_power = 1 - log(S_C) / log(D * log2 N)
    gamma_linear = 1 - S_C / (D * log2(N/D))
    S_C is the bit length of two integers a,b in
    0..N-1 plus a 64-bit header naming the lambda.
    Both gammas are observations. gamma_power < 0.9
    is not a Stage 4 miss. A recorded T1 gamma is
    not H1 support.

  c3_fit: >-
    Same recover_affine as Stage 0
    implementation/stage0_planted_affine.py, with
    lambda(v) in place of v. Exact recovery means
    a unique (a,b) in 0..N-1 satisfies every
    applicable row, and lambda applies on all D rows.

  replication:
    seeds: []
    independent_instances: 1
    seeds_policy: >-
      Exact 20-row tables. No sampling. No shuffle
      seed at this Stage 4 slice.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  required_artifacts:
    - raw-result.json with T2 and T1 recovery
      flags, (a_hat,b_hat), formal-log applicability,
      S_C, both gammas, and fixture_pass
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt
    - execution-report-s4.yaml

  stopping_rules:
    - >-
      STAGE 4, HARD GATE once authorized: T2
      linearized_formal_log exact affine.
      Miss classifies the run
      failed_infrastructure and stops.
    - >-
      T1 identity exact affine is not a hard
      gate. A T1 non-recovery is not
      failed_infrastructure and is not H1.
    - Stage 5 and later remain unauthorized.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 4 is not in execution_authorized_stages
    - Changing p, (a,b), N, P, D, V, or lambda_list after this freeze
    - Reading a Stage 4 gamma as H1 support or as SMALL-W or LARGE-W
    - Reading gamma_power < 0.9 on T2 as instrument failure
    - Treating a T1 exact-affine miss as failed_infrastructure
    - Treating one ordinary cell at D=20 as an H1 measurement
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this amendment
    - Changing H-ECDLP-07c7c6 or H-ECDLP-2ade73 from Stage 4
    - Adding a second ordinary cell at p=262139 (restatement of S4-T1-P262139)

  success_criterion: >
    Stage 4 succeeds as a measurement when T2
    linearized_formal_log recovers an exact
    affine, T1 identity exact affine is
    recorded as an observation, both gammas
    are recorded, and certificate.kind is
    none. Success is H2 instrument
    reproduction at p=262139 plus a next
    ordinary observation. It is not an H1
    claim.

  falsification_criterion: >
    T2 formal-log miss is infrastructure, not
    a statement that anomalous curves have no
    short advice. A T1 exact-affine miss does
    not support or weaken H1. H1 is not
    testable from one ordinary cell at D=20.
    No Stage 4 outcome supports or weakens
    H-ECDLP-07c7c6 or classifies W.

  limitations:
    - One ordinary cell and one anomalous cell at p=262139. No ladder.
    - C3 only. C1, C2, C4 remain Stage 5+.
    - Toy scale. No cryptographic transfer.
    - gamma >= 0.9 is not a Stage 4 gate.
    - Recalled Smart/Satoh-Araki/Semaev are pointers, not support.
    - W is not classified.
    - Stage 4 is not authorized by this filing.

  does_not:
    - Authorize Stage 4 or later of EXP-ECDLP-420e73.
    - Claim H1 or read a T1 gamma as H1.
    - Treat a T1 exact-affine miss as failed_infrastructure.
    - Authorize Stage 5 of EXP-ECDLP-a98ea9.
    - Classify W or fit a.
    - Change H-ECDLP-77caa5, H-ECDLP-07c7c6, or
      H-ECDLP-2ade73 status.
