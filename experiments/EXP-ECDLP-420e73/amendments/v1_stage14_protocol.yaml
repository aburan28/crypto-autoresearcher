  ks_definition: >-
    Per arm, let T_1, ..., T_m be the
    hitting times of walks that hit V
    before cap (right-censored / capped
    walks are excluded from KS and counted
    in n_capped). Let p = D/N for that
    cell, exact rational 20/N. The
    comparison law is Geometric including
    T=0 because the start is checked:
    P(T = k) = (1-p)^k * p for k = 0,1,2,...
    F_geo(t) = 1 - (1-p)^{t+1} for integer
    t >= 0. F_n is the empirical CDF of
    the m uncensored hitting times.
    ks_distance = max over the observed
    uncensored hitting times t of
    |F_n(t) - F_geo(t)|. Report it as a
    distance, not a hypothesis test and
    not a p-value. If m = 0, ks_distance
    is null and that is an H3 observation,
    not failed_infrastructure. The idea's
    "within 10 percent" is recorded as
    ks_within_0_10 = (ks_distance is not
    null and ks_distance <= 0.10). That
    flag is not a gate.

  percentile_99_definition: >-
    Per arm, the 99th percentile of the
    uncensored hitting times (nearest-rank
    at ceil(0.99 * m), 1-based) versus the
    geometric quantile t_geo_99, the
    smallest integer t with F_geo(t) >=
    0.99. Both values are observations.
    A heavy upper tail is the failure
    mode named in IDEA-20260904-d84512
    H3 and is not failed_infrastructure.

  combining_rule: >-
    fixture_pass is true when 10000 walks
    complete or hit cap without crash on
    every declared arm, every landing x
    that claims a hit is in that arm's V,
    every identity event is recorded, the
    process does not invent a start,
    extra-start pins at indices 10, 11,
    9999, 10000, and 10031 match, and
    first_j at start_index 0 matches Stage
    11. Mean within a factor 2 of N/D is
    not required. ks_within_0_10 is not
    required. Reconstructing extra starts
    and first_j from the seed formulas is
    a protocol check, not a hard gate on
    KS.

  controls:
    - T2 anomalous #E=p at the frozen Stage 7 cell
    - T1 ordinary prime N != p at the same p
    - NULL-3 random 20-set V, same k list, seed 20260908
    - frozen addends and cap formula from Stage 10
    - independent_uniform_0_15 from Stage 11
    - Stage 10 deterministic walk is the baseline object, not re-run
    - Stage 11 eight-walk nearby-object first slice is nested as start_index 0..7, not re-run as the measurement
    - no new cell hunt

  deterministic_x_mod_16_not_rerun: Stage 10 object. A second copy is restatement.
  stage11_eight_walks_not_the_measurement: >-
