  one_thing_changed: >-
    n_spare_starts 32 -> 4096. The extra-start
    RNG formula is unchanged; the while-loop
    bound is 9990+4096 instead of 9990+32.
    Official start_scalars[0..9999] are the
    prefix of that longer draw and match
    v1_stage14_protocol. New spares occupy
    start_index 10032..14095. Indices
    10000..10031 remain the original 32
    spares. Do not invent starts. Do not
    redraw 0..9999.

  frozen_walk_parameters_unchanged:
    seed: 20260908
    r: 16
    partition: independent_uniform_0_15
    n_walks: 10000
    cap_steps_formula: 8 * ceil(N/D)
    addend_scalars: [4083811, 14207148, 3197494, 5909533, 2112584, 3183261, 10497618, 7831654, 5887209, 4196257, 199026, 3111920, 8124186, 1874953, 16389255, 8467452]
    start_scalars_reused_from_stage10: [16512131, 3548612, 6906991, 7276399, 14567537, 10110148, 14742596, 3279851, 3740181, 16190719]
    start_index_official_range: [0, 9999]
    walk_rng: same as v1_stage14_protocol
    ks_definition: same as v1_stage14_protocol
    cells: same frozen Stage 7 T2 and T1

  spare_pool:
    n_spare_starts: 4096
    start_index_spare_range: [10000, 14095]
    extra_start_rng: >-
      Nmin = 16770451.
      forbidden = set(addend_scalars) |
      set(start_scalars_reused_from_stage10).
      material = f"{seed}|stage14_extra_starts".encode("ascii").
      rng_seed = int.from_bytes(hashlib.sha256(material).digest()[:8], "big").
      rng = random.Random(rng_seed).
      extra = [].
      while len(extra) < 9990 + 4096:
          s = rng.randrange(1, Nmin)
          if s in forbidden or s in extra:
              continue
          extra.append(s).
      start_scalars[10..9999] = extra[0..9989].
      start_scalars[10000..14095] = extra[9990..14085].
      Do not use PYTHONHASHSEED or hash()
      of a tuple.
    extra_start_pins_protocol_freeze_not_a_run:
      material_ascii: '20260908|stage14_extra_starts'
      material_sha256: 7c0af2d4d79d7de7863574728d7089b5ae46db12be67b1817e2700c7b9dd875a
      rng_seed: 8938223406434581991
      start_index_10: 2321726
      start_index_11: 1202185
      start_index_9999: 12097902
      start_index_10000_first_spare: 3391
      start_index_10031: 4108081
      start_index_10032_first_new_spare: 7307652
      start_index_14095_last_spare: 13224198
      n_collision_skips_in_this_draw: 8
      note: >-
        Pins at 10, 11, 9999, 10000, and
        10031 match v1_stage14_protocol.
        The longer draw adds four more
        collision skips. Pinning is
        protocol-freeze of the sampler,
        not a hitting-time measurement.

  identity_retry: >-
    Unchanged from v1_stage14_protocol. A
    walk that hits O records
    walk_hit_identity and retries with the
    next spare start_index. Spare exhaustion
    below 10000 completed walks remains
    failed_infrastructure for that arm, not
    an H3 observation.

  run_id: RUN-ECDLP-420e73-S14
