  design_tightening_stage8_gate_is_fixture_not_t2_low_degree: >-
    IDEA-20260904-d84512 names C1 as the
    interpolating polynomial over F_p of
    minimal degree, plus its sparse variant.
    A unique interpolant of degree < D always
    exists on D distinct abscissae. Expected
    degree is D-1=19 and nnz is near 20.
    Lange-Winterhof (recalled pointer, not
    support) already rules out low-degree
    interpolation as an H1 witness, so a T2
    C1 high degree is the predicted class
    inadequacy, not failed_infrastructure
    and not H1 closure. Stage 8 therefore
    gates on fixture_pass (interpolants
    computed, V match, no crash) and records
    degree, nnz, S_C, and both gammas as
    observations. C3 is not re-run: a second
    C3 at these cells is restatement of
    Stages 4--7. The 0.9 power threshold
    remains a later-stage object at D=20.

