  design_tightening_stage10_gate_is_fixture_not_h3_factor2: >-
    H-ECDLP-77caa5 H3 and IDEA-20260904-d84512
    state that an r-adding walk meets V after
    (1+o(1))*N/D steps in expectation.
    Falsification is a systematic departure
    from Theta(N/D) by more than a factor 2.
    The idea's 10^4 walks and KS distance
    are not this first slice: at p=16777213
    that would be about 8e9 additions.
    This slice locks 8 walks per
    (cell x V-or-NULL3) arm. Mean versus
    N/D and the factor-2 departure are the
    honest metrics. An H3 miss is a model
    observation, not failed_infrastructure
    and not H1 closure. Stage 10 therefore
    gates on fixture_pass (walks complete
    or hit cap without crash; landing x
    in V verified) and records the hitting
    times as observations. C1, C2, and C3
    are not re-run. C4 and fishing-1000
    remain Stage 11+.

