  walk_definition: >-
    r-adding walk with r=16. Partition is
    x mod 16. From a start R = [s]P, each
    step replaces R by R + [s_j]P where
    j = x(R) mod 16 and s_j is the frozen
    addend scalar. A hit is x(R) in the
    frozen 20-set V of that arm (design V
    or NULL-3 V). Cap is 8 * ceil(N/D),
    a formula, not a second hunt. If a
    walk hits O, record walk_hit_identity
    and retry with the next spare start.
    Spare exhaustion that leaves fewer
    than 8 completed walks is
    failed_infrastructure for that arm
    only if 8 hits cannot be completed;
    prefer recording the identity event
    rather than inventing a start.

  frozen_walk_parameters:
    seed: 20260908
    rng: random.Random(20260908)
    r: 16
    partition: x_mod_16
    n_walks: 8
    n_spare_starts: 2
    cap_steps_formula: 8 * ceil(N/D)
    addend_scalars: [4083811, 14207148, 3197494, 5909533, 2112584, 3183261, 10497618, 7831654, 5887209, 4196257, 199026, 3111920, 8124186, 1874953, 16389255, 8467452]
    start_scalars: [16512131, 3548612, 6906991, 7276399, 14567537, 10110148, 14742596, 3279851, 3740181, 16190719]
    start_scalars_used: [16512131, 3548612, 6906991, 7276399, 14567537, 10110148, 14742596, 3279851]
    start_scalars_spare: [3740181, 16190719]
    note: >-
      The same addend and start lists are
      used on T2 and T1. Every listed
      scalar is strictly less than
      min(N_T1, N_T2) = 16770451.

  null3:
    role: random-k distinguished-set control
    seed: 20260908
    construction: >-
      After drawing addends and starts from
      the same Random(20260908) stream,
      draw 20 distinct k in [1, N_T1).
      V = x([k]P) on each cell. Both V
      lists are 20 distinct. Protocol-freeze
      confirmation of [k]P is not a Stage 10
      run.
    k: [12664300, 6842134, 11844367, 6996586, 4488890, 6629474, 1373371, 715077, 12256922, 7014070, 15143700, 12434262, 1263476, 13985324, 4621790, 8306822, 2915849, 13925014, 13948079, 8437742]
    V_T2: [5008632, 16059306, 6768596, 10311345, 12881503, 11670341, 2237608, 14433701, 3919924, 12118938, 1323836, 6448954, 12258498, 10503013, 6500704, 2551759, 11438792, 11003594, 6078716, 9225734]
    V_T1: [4232246, 12647966, 14113284, 15639226, 7796176, 11842120, 15492402, 3294931, 3074382, 11697033, 16598714, 2029482, 11658992, 11059053, 4883322, 369323, 1834504, 1634034, 12304223, 5575639]

  arms:
    - T2 design V
    - T2 NULL-3 V
    - T1 design V
    - T1 NULL-3 V

  c1_not_rerun: >-
    C1 interpolants on these cells were
    measured in Stage 8. A second C1 at
    the same cells is restatement.
  c2_not_rerun: >-
    C2 linear complexity on these cells was
    measured in Stage 9. A second C2 at
    the same cells is restatement.
  c3_not_rerun: >-
    C3 affine recovery on these cells was
    measured in Stages 4--7. A second C3
    at the same cells is restatement.

  combining_rule: >-
    fixture_pass is true when 8 walks
    complete or hit cap without crash on
    every declared arm, every landing x
    that claims a hit is in that arm's V,
    every identity event is recorded, and
    the process does not invent a start.
    Mean within a factor 2 of N/D is not
    required.

  controls:
    - T2 anomalous #E=p at the frozen Stage 7 cell (H3 on a short-advice curve)
    - T1 ordinary prime N != p at the same p (H3 on an ordinary cell)
    - NULL-3 random 20-set V, same k list, seed 20260908
    - frozen addends, starts, and cap formula
    - no new cell hunt

  preregistered_prediction:
    quantity: >-
      Stage 10 H3 first-slice walk-length
      measurement on the frozen Stage 7
      cells. Eight walks per (cell x
      V-or-NULL3) arm. Mean hitting time
      versus N/D and any factor-2
      departure are recorded. Expected
      mean is Theta(N/D). An H3 miss is
      a model observation, not instrument
      failure. Certificate kind none.
      This is not an H1 claim and is not
      H1 closure. KS distance and 10^4
      walks remain a later expansion.
    formula: >-
      FORCED Stage 10: fixture_pass is true.
      mean in [N/(2D), 2N/D] is NOT forced.
      C1 / C2 / C3 are not Stage 10 objects.
    source: >-
      H-ECDLP-77caa5 heuristic H3 and
      IDEA-20260904-d84512 walk model.
      Provenance internal. The idea's
      10^4-walk KS plan is disclosed as
      not this slice.

  metrics:
    primary:
      - fixture_pass boolean
      - mean_hitting_time on each arm
      - mean_over_N_over_D on each arm
      - factor2_departure boolean on each arm
    secondary:
      - per-walk hitting times and whether capped
      - walk_hit_identity events and spare use
      - wall-clock seconds and peak RSS

  heuristic_under_test: H3_walk_length_first_slice_at_16777213
  C4: Stage 11+ object, not in this amendment
  remaining_T1_sizes: >-
    IDEA-20260904-d84512 T1 sizes
    {2^16, 2^18, 2^20, 2^22, 2^24} were
    exhausted by Stage 7. Stage 10 reuses
    those frozen cells. No new T1 size.
  walk_length_H3: this amendment, first slice only
  fishing_1000_designs: Stage 11+ object, not in this amendment
  ks_distance_and_1e4_walks: later expansion, not this slice
  c1_affine: Stage 8 object, not re-run
  c2_lc: Stage 9 object, not re-run
  c3_affine: Stage 0--7 object, not re-run

  run_id: RUN-ECDLP-420e73-S10
  implementation_path: experiments/EXP-ECDLP-420e73/implementation/stage10_h3_16777213.py

  replication:
    seeds: [20260908]
    independent_instances: 1
    seeds_policy: >-
      Frozen addends, starts, and NULL-3 k
      from random.Random(20260908). No
      resampling of V. Eight walks use the
      first eight start scalars. Last two
      starts are spare.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  required_artifacts:
    - raw-result.json with fixture_pass,
      per-arm means, factor-2 flags,
      per-walk hitting times, identity
      events, and frozen parameters
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt
    - execution-report-s10.yaml

  stopping_rules:
    - >-
      STAGE 10, HARD GATE once authorized:
      fixture_pass. Crash, invented start,
      landing-x not in V on a claimed hit,
      or failure to complete the eight
      walks classifies the run
      failed_infrastructure and stops.
    - >-
      Mean off by more than a factor 2
      of N/D is not failed_infrastructure.
      It is an H3 model observation and
      the declared falsification datum.
    - >-
      A walk that hits the cap without
      landing in V is a recorded
      observation, not infrastructure
      failure, if the walk completed.
    - Stage 11 and later remain unauthorized.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 10 is not in execution_authorized_stages
    - Changing p, (a,b), N, P, D, V, r, addends, starts, NULL-3 k, or the cap formula after this freeze
    - Hunting a new cell or adding a second ordinary at p=16777213
    - Re-running C1, C2, or C3 on these cells and reading it as a Stage 10 measurement
    - Treating an 8-walk mean as a 10^4-walk KS measurement
    - Reading a Stage 10 gamma or walk mean as H1 support or as SMALL-W or LARGE-W
    - Treating an H3 factor-2 miss as failed_infrastructure
    - Treating an H3 miss as H1 closure
    - Treating one ordinary cell at D=20 as an H1 measurement
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this amendment
    - Changing H-ECDLP-07c7c6 or H-ECDLP-2ade73 from Stage 10
    - Citing Lange-Winterhof as support (it remains a recalled pointer)

  success_criterion: >
    Stage 10 succeeds as a measurement when
    fixture_pass is true, eight walks are
    recorded on every arm, means and
    factor-2 flags are recorded, and
    certificate.kind is none. Success is
    an H3 first-slice observation at the
    frozen Stage 7 cells. It is not an
    H1 claim and is not H1 closure.

  falsification_criterion: >
    A systematic mean departure from
    Theta(N/D) by more than a factor 2
    on an authorized arm is the H3
    falsification datum of
    H-ECDLP-77caa5, scoped to this
    first slice, these cells, r=16, and
    n_walks=8. It does not close H1.
    No Stage 10 outcome supports or
    weakens H-ECDLP-07c7c6 or classifies W.

  limitations:
    - One ordinary cell and one anomalous cell at p=16777213. No ladder.
    - Eight walks, not 10^4. KS distance is not this slice.
    - C4 and fishing-1000 remain Stage 11+.
    - Toy scale. No cryptographic transfer.
    - Recalled Lange-Winterhof is a pointer, not support.
    - Recalled Smart/Satoh-Araki/Semaev remain pointers, not support.
    - W is not classified.
    - Stage 10 is not authorized by this filing.

  does_not:
    - Authorize Stage 10 or later of EXP-ECDLP-420e73.
    - Claim H1 or read a T1 walk mean as H1.
    - Treat an H3 factor-2 miss as failed_infrastructure.
    - Treat an H3 miss as H1 closure.
    - Treat eight walks as the idea's 10^4-walk KS plan.
    - Re-run C1, C2, or C3 on these cells.
    - Authorize Stage 5 of EXP-ECDLP-a98ea9.
    - Classify W or fit a.
    - Change H-ECDLP-77caa5, H-ECDLP-07c7c6, or
      H-ECDLP-2ade73 status.
