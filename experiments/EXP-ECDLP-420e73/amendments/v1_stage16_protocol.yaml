  invalidation_rules:
    - Any execution while Stage 16 is not in execution_authorized_stages
    - Changing p, (a,b), N, P, D, n_walks, seed, partition, addends, cap formula, extra-start RNG, or walk RNG after this freeze
    - Hunting a new cell or adding a second ordinary at p=16777213
    - Re-running C1, C2, C3, the Stage 10 walk, the Stage 12 three-arm C4, Stage 13 fishing-1000, the Stage 14 D=20 KS, or the Stage 15 D=256 KS and reading them as a Stage 16 measurement
    - Treating Stage 11's eight walks, Stage 14 D=20 hitting times, or Stage 15 D=256 hitting times as the Stage 16 measurement
    - Using partition x mod 16 (Stage 10 object)
    - Using a shared D that is not round(N^{1/2}) on each cell
    - Treating KS, a factor-2 miss, or n_capped as failed_infrastructure
    - Treating an H3 miss as H1 closure
    - Treating C4 or fishing min-gamma as admissible support for H1
    - Reading a Stage 16 KS as SMALL-W or LARGE-W
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this amendment
    - Changing H-ECDLP-07c7c6 or H-ECDLP-2ade73 from Stage 16
    - Citing Lange-Winterhof as support (it remains a recalled pointer)

  success_criterion: >-
    Stage 16 succeeds as a measurement when
    fixture_pass is true, KS distance is
    recorded on every arm or honestly
    null because m=0, certificate.kind is
    none, and KS is not read as H1 support.
    Success is an H3 observation at the
    frozen Stage 7 curves and
    D=round(N^{1/2}).

  falsification_criterion: >-
    H3 is not closed by this slice. A KS
    above 0.10, a factor-2 mean miss, or
    a heavy tail is a scoped observation
    at these curves, this partition,
    D=round(N^{1/2}), and 10000 walks, not
    H1 closure. Spare exhaustion is
    infrastructure, not a class result. No
    Stage 16 outcome supports or weakens
    H-ECDLP-07c7c6 or classifies W.

