experiment:
  id: EXP-ECDLP-0cdf35
  hypothesis_id: H-ECDLP-ccce1a
  question_id: RQ-RELN-001
  version: 1
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Rank, not relation count - exact incremental rank over the RELN lane's
    retained relation matrices, against a curve-free matched random-sparse
    baseline whose width is checked first, with a swept duplication control

  objective: >-
    If separately approved, authorized and executed, measure exact rank as a
    function of relations collected on the RELN lane's retained relation
    matrices, report the marginal rank contribution per relation, and score the
    resulting deficit against a matched random-sparse baseline distribution. The
    operationally important output is the marginal curve - where it approaches
    zero is the real stopping point of collection, and a relation COUNT cannot
    see it at all.

  what_this_is_not:
    - Not a cost model, a relation-probability model, or an exponent.
    - Not a new relation-collection run. The sem side is read from retained or exactly regenerable matrices and is never recollected here.
    - Not a discrete-logarithm attack claim of any kind.
    - Not a status change to any record, including the lane's stopping rule.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling: >-
    Tier TOY, unraisable by any downstream citation. The exact scope a completed
    run could support is - on the lane's retained matrices, at their sizes,
    densities and recorded solve fields, the rank deficit does or does not exceed
    a matched random-sparse baseline, and the marginal rank curve reaches a
    stated value at a stated relation count. It cannot support a statement about
    larger factor bases, about other collection procedures, or about saturation
    at any scale not measured.

  falsifiable_prediction: >-
    PRE-REGISTERED BEFORE EXECUTION AND NEVER TUNED TO THE DATA.
    (1) With k relations deliberately duplicated, rank does not increase at any
    k, and the measured deficit rises by EXACTLY k at every k in the sweep.
    (2) The matched random-sparse baseline deficit distribution has width
    strictly greater than 0 at every scored size.
    (3) DEFICIT MATERIAL is declared if the real deficit exceeds twice the mean
    baseline deficit at the largest retained matrix AND lies outside the
    baseline's 95 percent band; DEFICIT IMMATERIAL if it lies inside that band;
    otherwise INCONCLUSIVE.
    (4) The marginal rank contribution per relation falls; the relation count at
    which it first drops below 0.5 is the reported operational stopping point.
    (5) The curve-free matched random-sparse arm either does or does not
    reproduce the real matrices' deficit and marginal curve, and the consequence
    of the former is fixed below.

  measured_quantities:
    - name: rank_exact
      definition: >-
        Exact rank of the relation matrix over the field the linear system is
        actually solved over, computed at every relation prefix, never estimated.
      units: rank (dimensionless integer)
    - name: relations_collected
      definition: Number of relations in the prefix whose rank is being reported.
      units: relations (dimensionless integer)
    - name: rank_deficit
      definition: relations_collected minus rank_exact at the same prefix.
      units: relations (dimensionless integer)
    - name: marginal_rank
      definition: >-
        Increase in rank_exact per newly added relation, reported as a running
        quantity over the collection order.
      units: rank per relation (dimensionless, in [0, 1])
    - name: baseline_deficit_distribution
      definition: >-
        The distribution of rank_deficit over the matched random-sparse ensemble
        at the same size, density and field, over the declared seeds, with its
        mean, its width and its 95 percent band.
      units: relations (integer), with a distribution
    - name: solve_field
      definition: >-
        The field over which each matrix's rank is computed, taken from the
        lane's recorded solve field for that run.
      units: categorical, recorded per matrix
    - name: matrix_density
      definition: Fraction of nonzero entries per matrix, used to match the baseline.
      units: dimensionless fraction

  metrics:
    primary: [rank_exact, rank_deficit, marginal_rank, baseline_deficit_distribution]
    secondary: [relations_collected, solve_field, matrix_density]

  null_and_control_objects:
    - id: NULL-DUPLICATE
      name: swept duplicated-relation control
      construction: >-
        k relations from the matrix deliberately duplicated before rank is
        recomputed, k swept over {1, 2, 4, 8, 16}.
      forced_value: >-
        rank_exact unchanged at every k, and rank_deficit rising by EXACTLY k at
        every k.
      non_vacuity: >-
        THIS IS THE DEMONSTRATED-DYNAMIC-RANGE CONTROL. Rank growth on a
        duplicate would mean the rank routine is wrong. But a routine that merely
        refuses to grow on one duplicate has shown only that it detects the
        PRESENCE of a dependency; sweeping k forces it to measure SIZE, which is
        what makes a small measured deficit interpretable rather than noise.
      can_it_differ_from_treatment: >-
        YES. A routine using floating-point elimination, a wrong field, or an
        early-exit heuristic fails one or both halves of the forced value.
    - id: NULL-RANDSPARSE
      name: curve-free matched random-sparse baseline
      construction: >-
        Random sparse matrices over the SAME field, with the SAME dimensions and
        the SAME density as each real matrix, containing no elliptic curve
        anywhere, over at least 20 seeds, with the deficit distribution computed
        numerically rather than quoted from a formula.
      forced_value: >-
        Distribution width strictly greater than 0. A point-mass baseline at a
        given size means that size cannot discriminate and the cell is dropped
        BEFORE scoring, not explained afterwards.
      non_vacuity: >-
        Its width is measured and required to be positive; a real deficit is
        scored against a band rather than against a number.
      consequence_pre_declared: >-
        THIS ARM IS BOTH THE CALIBRATION AND THE SCOPE GATE. IF THE REAL
        MATRICES' DEFICIT AND MARGINAL CURVE ARE INDISTINGUISHABLE FROM THE
        MATCHED RANDOM-SPARSE ARM, THE FINDING IS A STATEMENT ABOUT SPARSE LINEAR
        ALGEBRA AT THESE SIZES AND DENSITIES AND NOTHING FROM THIS EXPERIMENT MAY
        BE QUOTED AS A STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP. Written
        before execution so it cannot be reframed afterwards.
    - id: CONTROL-FIELD
      name: solve-field provenance check
      construction: >-
        For every matrix, resolve the field over which its system was actually
        solved from the lane's committed run record, and compute rank over that
        field and no other.
      forced_value: field resolved from a run record for every scored matrix
      non_vacuity: >-
        Genuinely capable of failing - a matrix whose solve field cannot be
        resolved is reported UNRESOLVED and is not scored, because rank over the
        wrong field gives a meaningless deficit.

  scope_gate: >-
    See NULL-RANDSPARSE consequence_pre_declared. The gate is evaluated and
    reported BEFORE any interpretation of the real matrices, and its verdict is
    printed on the face of every quoted number.

  independent_variables: [matrix_identity, relation_prefix_length, duplication_count, arm, baseline_seed]

  preregistered_prediction:
    quantity: rank_deficit on the largest retained matrix, against the baseline band
    formula: >-
      deficit = relations_collected minus rank_exact, both at the same prefix.
      The baseline band is the 2.5 and 97.5 percentiles of the deficit over the
      matched random-sparse ensemble at the same dimensions, density and field.
    source: ledger/hypotheses/H-ECDLP-ccce1a.yaml predictions P1 through P5
    values_frozen_here:
      duplication_sweep: [1, 2, 4, 8, 16]
      baseline_seeds: 20
      material_rule: real deficit above twice the baseline mean AND outside the 95 percent band
      immaterial_rule: real deficit inside the 95 percent band
      inconclusive_band: everything between, declared before the run
      marginal_stopping_threshold: 0.5 rank per relation
      baseline_width_requirement: strictly greater than 0

  decision_rule_that_falsifies: >-
    THE RECORD IS FALSIFIED, and its central claim rejected in scope, IF the real
    deficit lies inside the matched baseline's 95 percent band at the largest
    retained matrix, with every control passing. Relations are then effectively
    as independent as random sparse vectors of the same shape, and the lane's
    supply figure is sound at the tested sizes - a clean positive result that
    must be reported rather than buried.
    THE RECORD IS SUPPORTED IN SCOPE IF the real deficit exceeds twice the
    baseline mean and lies outside the band, with every control passing AND the
    curve-free arm distinguishable from the real arm.
    THE RUN IS INVALID, and no verdict of either kind may be reported, if
    NULL-DUPLICATE does not return exactly k at every k, if the baseline
    distribution is a point mass at a scored size, or if a matrix's solve field
    cannot be resolved.

  stages:
    - id: S0
      name: artifact and field resolution
      terminates_run: true
      description: >-
        Determine which relation matrices are retained, or exactly regenerable
        from the lane's committed parameters and seeds. Resolve each one's solve
        field from a committed run record. IF NEITHER RETENTION NOR EXACT
        REGENERATION HOLDS, the measurement is UNAVAILABLE and the run ENDS with
        that as its reported result; an approximately reconstructed matrix is not
        the matrix the lane measured and is never substituted.
    - id: S1
      name: rank routine calibration, swept
      terminates_run: true
      description: >-
        NULL-DUPLICATE at every k. Failure at any k ENDS the run; no deficit from
        an uncalibrated routine is interpretable.
    - id: S2
      name: baseline construction and width check
      terminates_run: true
      description: >-
        NULL-RANDSPARSE at every scored size, with the deficit distribution
        computed numerically and its width reported BEFORE any real matrix is
        scored. A point-mass baseline drops that size.
    - id: S3
      name: real matrices, incremental rank
      terminates_run: false
      description: >-
        Exact rank at every relation prefix over the resolved field, producing
        the rank-against-count curve and the marginal curve per run.
    - id: S4
      name: scoring and verdict
      terminates_run: false
      description: >-
        Score the real deficit against the baseline band, evaluate the scope
        gate, report the marginal curve and its 0.5 crossing, then apply the
        frozen decision rule.

  replication:
    seeds: [0, 1, 2, 3, 4]
    independent_instances: 20
    seeds_per_cell: 20
    seeds_policy: >-
      THE REAL ARM CARRIES NO NEW SEEDS. Its matrices are the lane's committed
      artifacts, read as archived, or regenerated bit-for-bit from the lane's own
      recorded parameters and seeds; substituting fresh seeds there would measure
      a different object. THE BASELINE ARM is addressed by (matrix_identity,
      baseline_seed_index) and its seed is derived deterministically as a SHA-256
      over the ASCII bytes of the domain string, those fields, and the declared
      master seed, reduced to 64 bits. The domain string is EXP-ECDLP-0cdf35/v1.
      THE DUPLICATION ARM is deterministic given (matrix_identity, k) and the
      declared duplication rule, which selects the first k relations in the
      recorded collection order so that no new randomness enters. The master seed
      is fixed in the frozen contract before any execution and is never re-drawn.
    determinism_requirement: >-
      Re-running any rank computation must reproduce the identical integer.
      Re-generating any baseline matrix from its tuple must reproduce the
      identical matrix hash. Any cell failing this is INVALID.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 40
    maximum_memory_gb: 8
    maximum_runs: 120
    maximum_workers: 1
    note: >-
      Sized to the work. Incremental rank at every prefix is substantially more
      expensive than a single final rank, and that cost is exactly what the
      marginal curve requires; it is budgeted rather than traded away.

  stopping_rules:
    - Matrices neither retained nor exactly regenerable -> STOP, report the measurement as UNAVAILABLE, reconstruct nothing approximately.
    - NULL-DUPLICATE deviates from exactly k at any k -> STOP, rank routine uncalibrated, no deficit interpretable.
    - Baseline distribution is a point mass at a size -> DROP that size before scoring; do not explain it afterwards.
    - A matrix's solve field cannot be resolved to a committed run record -> that matrix is UNRESOLVED and is not scored.
    - Per-run wall clock or memory ceiling exhausted -> STOP that cell, report failed_infrastructure with the prefix coverage reached.

  invalidation_rules:
    - Any rank computed over a field other than the matrix's resolved solve field is invalid.
    - Any estimated rather than exact rank is invalid.
    - Any deficit reported without the baseline distribution's width reported first is invalid.
    - Any deficit scored against a point-mass baseline is invalid.
    - Any marginal curve reported from fewer relations than the declared minimum for that matrix is invalid; a noisy curve at a short prefix is reported as underpowered, never fitted.
    - Any quoted number lacking the curve-free scope-gate verdict on its face is invalid.
    - Any saturation claim extended beyond the tested sizes is invalid on its face.

  success_criterion: >-
    ALL of - (a) the retained or exactly regenerable matrix set enumerated and
    each solve field resolved; (b) NULL-DUPLICATE exact at every k; (c) the
    baseline distribution computed with strictly positive width at every scored
    size; (d) exact incremental rank computed at every prefix on every scored
    matrix; (e) the marginal curve reported with its 0.5 crossing or a statement
    that it never crosses within the collected range; (f) the curve-free scope
    gate evaluated; (g) the frozen decision rule applied and a verdict of
    MATERIAL, IMMATERIAL or INCONCLUSIVE assigned. Reaching IMMATERIAL or
    INCONCLUSIVE is a SUCCESSFUL run; only failing (a) through (f) is
    unsuccessful.

  falsification_criterion: >-
    The real deficit inside the matched baseline's 95 percent band at the largest
    retained matrix, with every control passing. H-ECDLP-ccce1a's central claim is
    then rejected in the tested scope and the lane's relation supply figure is
    sound at those sizes. Secondary falsifiers of the DESIGN rather than the
    hypothesis - unavailable matrices, an uncalibrated rank routine, a point-mass
    baseline, an unresolvable solve field, or a curve-free arm indistinguishable
    from the real one. In every case the failing matrix and control are named,
    and forward guidance names the next object.

  required_artifacts:
    - the enumerated matrix set with retention or regeneration provenance per matrix
    - the resolved solve field per matrix, with the committed run record it came from
    - results.json with rank at every relation prefix, per matrix
    - the marginal rank curve per matrix, with its 0.5 crossing
    - the duplication sweep's rank and deficit at every k
    - the baseline deficit distribution per scored size, with its width and band, written before any scoring
    - the curve-free scope-gate verdict
    - matrix hashes for every real and baseline matrix
    - exact commands, git commit, dirty-tree state, environment and dependency versions
    - peak resident memory, wall clock and CPU time per cell
    - stdout and stderr

  scale_relevance:
    tier: toy
    justification: >-
      The lane's existing toy-scale matrices at their recorded sizes and
      densities. Nothing transfers by extrapolation.
    correspondence: null

  limitations:
    - >-
      Measures a progress metric on already-collected artifacts. Produces NO cost
      model, no relation-probability model and no exponent.
    - >-
      Scoped to the lane's existing runs, their matrix sizes and densities, and
      the recorded solve fields.
    - >-
      At toy sizes the deficit is dominated by the first few relations and the
      marginal curve is noisy. Cells without enough relations for the trend to be
      visible are reported as underpowered rather than fitted.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY RATHER THAN SILENTLY
      SHRUNK - whether relation collection saturates at cryptographically
      relevant factor-base sizes cannot be determined here. A saturation finding
      at toy scale does not transfer without a trend supporting it, and this
      contract fits no such trend.
    - >-
      Pairing a real deficit against a matched random-sparse baseline tests
      whether relations behave like random sparse vectors; it does not identify
      WHAT structure produces a departure if one appears.
    - >-
      Changes no record's status, including the lane's stopping rule.

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory, missing matrix or unresolvable solve field
    is INFRASTRUCTURE SIGNAL, recorded as such with its cause and the prefix
    coverage reached. It is NEVER negative mathematical evidence (AGENTS.md core
    rule 5). An unavailable matrix set makes the measurement UNAVAILABLE, which
    is a reportable outcome and not a null result.

  assigned_to: executor

  authorization_note: >-
    This contract is status draft, is not frozen, and carries approved_by null.
    Only the Coordinator may approve, freeze or authorize execution (AGENTS.md
    rule 1). Written under TASK-20260904-c0edda, which is DESIGN ONLY. It
    supersedes no contract, edits no record and alters no goal.
