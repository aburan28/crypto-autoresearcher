# =============================================================================
# EXP-FROB-d056ce — version 1, approved by DEC-20261006-3685d2.
# Frozen comparison: minimal-polynomial weights of x_E = 3*z^2 on
# y^2 = x^3 + 1 over F_7 and of x_Eprime = z^2 on
# y^2 = x^3 + (z^2)*x + (2 + z + z^2) over F_343 = F_7[z]/(z^3 + 2).
# No degree-3 coefficient vector was recorded in this design.
# Source idea IDEA-20261005-f1b0af is copied unchanged from
# origin/design/hyper-fb6ec7-richelot because it is not on origin/main.
# =============================================================================
experiment:
  id: EXP-FROB-d056ce
  hypothesis_id: H-FROB-579620
  question_id: RQ-FROB-7d8dd4
  source_idea: IDEA-20261005-f1b0af
  goal_id: null
  version: 1
  title: >-
    Minimal-polynomial weight of 3*z^2 on y^2 = x^3 + 1 versus z^2 on
    the matched-order null over F_343
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    approved_by_role: coordinator
    composing_decision: DEC-20261006-3685d2
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06: "all is
      approved. ideas/experiments should be always approved") because every
      field the design protocol requires is non-null. Approval does not assert
      that the object weight is smaller, and it does not assert an ECDLP
      exponent improvement.
    implementation_authorized: true
    scientific_execution_authorized: true
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether w(3*z^2) is strictly smaller than w(z^2), where w
    counts nonzero coefficients of the monic minimal polynomial over
    F_7, including the leading 1, on the frozen curves
    y^2 = x^3 + 1 and y^2 = x^3 + (z^2)*x + (2 + z + z^2). Equal
    weights and a larger object weight are negatives. Do not compute a
    discrete logarithm and do not claim an exponent change.

  inputs:
    field:
      prime: 7
      degree: 3
      polynomial: "z^3 + 2"
      element_order: >-
        c0 + c1*z + c2*z^2, lexicographic on (c0, c1, c2) with c0 most
        significant. Enumeration loops c0, then c1, then c2.
    object_curve:
      model: "y^2 = x^3 + 1"
      a: 0
      b: 1
      coordinate: "3*z^2"
      coordinate_coeffs: [0, 0, 3]
    null_curve:
      model: "y^2 = x^3 + (z^2)*x + (2 + z + z^2)"
      A_coeffs: [0, 0, 1]
      B_coeffs: [2, 1, 1]
      coordinate: "z^2"
      coordinate_coeffs: [0, 0, 1]
    point_count_census:
      object_order_over_F7: 12
      object_trace_over_F7: -4
      matched_point_count: 324
      trace_over_F343: 20
      j_object: 0
      j_null_coeffs: [1, 1, 0]
      j_formula: >-
        j = 6912*A^3 / (4*A^3 + 27*B^2), with integer coefficients
        reduced in characteristic 7 before the division. Singular when
        the denominator is 0.
      note: >-
        324 and the traces are point counts. They are not weights.
        The trace over F_343 follows from t3 = t^3 - 21*t with t = -4.
    weight_definition: >-
      Monic minimal polynomial over F_7, obtained by linear algebra on
      the F_7-span of {1, x, x^7, x^{49}}. w is the number of nonzero
      coefficients in F_7, and the leading 1 is included. A degree-3
      polynomial has w in {1, 2, 3, 4}.
    instrument_element:
      element: 1
      expected_polynomial: "T + 6"
      expected_weight: 2
      note: >-
        The minimal polynomial of 1 is T - 1, which is T + 6 over F_7.
        This checks the weigher. It is not a weight of either selected
        coordinate.
    selection_rule: >-
      The first monic irreducible cubic is the first (a, b, c) in
      lexicographic order, a most significant, such that
      T^3 + a*T^2 + b*T + c has no root in F_7. Curves over F_7 are
      y^2 = x^3 + a*x + b with (a, b) in that integer order. Reject a
      singular model. Reject a model whose trace over F_7 is divisible
      by 7. The first remaining model is the object. Extend it to
      F_343 and let N be its rational-point count, including the point
      at infinity. A right-hand side that is a nonzero square
      contributes two points, and 0 contributes one. The object
      coordinate is the first field element outside F_7, in the frozen
      lexicographic order, whose right-hand side is a square or 0.
      The null is the first (A, B) over F_343, A most significant, in
      the same element order, that is nonsingular, whose trace over
      F_343 is not divisible by 7, whose j-invariant is outside F_7,
      and whose rational-point count equals N. Its coordinate is chosen
      by the same degree-3 rule.
    design_session_census:
      method: >-
        Exact point counts, the j formula above, and Frobenius orbit
        sizes. Run by the design session through the first accepted
        null model. No degree-3 coefficient vector was recorded.
      observed:
        - step: irreducible
          polynomial: "z^3 + 2"
          note: T^3 and T^3 + 1 each have a root in F_7. T^3 + 2 does not.
        - step: object_curve
          rejected: "(0, 0) is singular"
          accepted: "(a, b) = (0, 1), order 12 over F_7, trace -4, order 324 over F_343, trace 20, j = 0"
        - step: object_coordinate
          accepted: "3*z^2, coefficients (0, 0, 3), Frobenius orbit size 3"
        - step: null_curve
          note: >-
            Every nonsingular model with A = 0 has j = 0, which lies in
            F_7, so those models are rejected. The scan then accepts
            A = z^2 and B = 2 + z + z^2, order 324, trace 20, j = 1 + z.
            The design session scanned 450 models before and including
            that acceptance.
        - step: null_coordinate
          accepted: "z^2, coefficients (0, 0, 1), Frobenius orbit size 3"
    forbidden:
      - Do not compute a discrete logarithm.
      - Do not run Pollard rho or baby-step giant-step as a metric.
      - Do not build a factor base or a summation polynomial.
      - Do not claim an ECDLP exponent change.
      - Do not replace the frozen curves or coordinates after seeing the weights. A wrong instance is invalid, not a new protocol.
      - Do not drop the leading 1 from either weight.

  controls:
    - id: degrees
      statement: Both minimal-polynomial degrees equal 3.
      pass_condition: both orbit sizes equal 3 and both computed degrees equal 3
      on_fail: The run is invalid. A different degree is not a weight comparison.
    - id: matched-order
      statement: Both curves have rational-point count 324 over F_343, and 7 divides neither trace.
      pass_condition: >-
        both recomputed orders equal 324, both traces over F_343 equal
        20, and the object trace over F_7 equals -4
      on_fail: The run is invalid. An order mismatch is not a weight gap.
    - id: j-tests
      statement: j of the object lies in F_7 and j of the null does not.
      pass_condition: recomputed j(object) = 0 and recomputed j(null) = 1 + z
      on_fail: The run is invalid. A null with j in F_7 is a second subfield curve.
    - id: instrument
      statement: The weigher returns weight 2 on the element 1, with polynomial T + 6.
      pass_condition: the recorded instrument weight is 2 and the polynomial is T + 6
      on_fail: The run is invalid. Do not report a gap between the two coordinates.
    - id: frobenius
      statement: Applying the 7th-power map replaces each selected minimal polynomial by itself.
      pass_condition: the polynomial of x equals the polynomial of x^7, for both selected x
      on_fail: The run is invalid. A change means the polynomial was not the orbit polynomial.
    - id: minimality
      statement: >-
        Under the frozen selection rule the object is y^2 = x^3 + 1 with
        coordinate 3*z^2, and the null is
        y^2 = x^3 + (z^2)*x + (2 + z + z^2) with coordinate z^2.
      pass_condition: the recomputed census agrees with these two models and these two coordinates
      on_fail: >-
        The named instance is not the first accepted pair. The run is
        invalid. Do not move the comparison to another curve inside this
        protocol.

  independent_variables:
    - which frozen coordinate is weighed, 3*z^2 on the object or z^2 on the null
    - whether the weigher is applied to a selected coordinate or to the instrument element 1

  metrics:
    primary:
      - id: weight_gap
        statement: >-
          w(x_Eprime) - w(x_E). The prediction is that this integer is
          at least 1. Zero and negative values are negatives.
      - id: object_weight
        statement: w(3*z^2), an integer in {1, 2, 3, 4} when the degree is 3.
      - id: null_weight
        statement: w(z^2), an integer in {1, 2, 3, 4} when the degree is 3.
    secondary:
      - id: object_degree
        statement: Degree of the minimal polynomial of 3*z^2. The census orbit size is 3.
      - id: null_degree
        statement: Degree of the minimal polynomial of z^2. The census orbit size is 3.
      - id: matched_point_count
        statement: The common order over F_343. The census value is 324.
      - id: instrument_weight
        statement: Weight of the element 1. The required value is 2.
      - id: j_invariants
        statement: j of the object and j of the null. The census values are 0 and 1 + z.

  heuristic_under_test: HA-1
  heuristic_under_test_note: >-
    HA-1 is the imitation of a uniform monic cubic at this single pair
    (7, 3). The experiment records the two weights. A gap of at least 1
    in the predicted direction is the claim. Equality is a negative.
    The imitation is not an ECDLP exponent.

  preregistered_prediction:
    quantity: >-
      The difference w(z^2) - w(3*z^2) of the two monic minimal
      polynomials over F_7.
    formula: >-
      The difference is at least 1. A difference of 0 or less is the
      negative. No numeral for either weight is written here. Each
      degree-3 weight lies in {1, 2, 3, 4}; that sentence is the
      comparison alphabet, not a measured assignment.
    source: >-
      The inequality is the prediction in IDEA-20261005-f1b0af, copied
      before any run of EXP-FROB-d056ce, with both curves and both
      coordinates named by the design-session census. This design
      session read the idea and RQ-FROB-7d8dd4. It did not record either
      degree-3 coefficient vector.

  scale_relevance:
    tier: toy
    justification: >-
      The tested parameter is the single pair q = 7, n = 3, a field of
      343 elements. A result at this pair is not a result at another
      extension and is not a stage cost. No extrapolation is authorized.
      The question's toy ladder starts near 2^16. This record stays
      below that ladder.
    correspondence: >-
      Direct point counts and two linear algebras of size 3. No Deuring
      sampling equivalence is used to reach a larger field.

  tail_checks:
    - >-
      There is no sampled tail. The census is two elements. The extreme
      check is the instrument: the element 1 must weigh 2. A mismatch
      voids the run. It does not by itself decide the comparison. Each
      recorded weight must lie in {1, 2, 3, 4}.

  replication:
    seeds:
      - name: arithmetic
        algorithm: deterministic point counts, orbit sizes, and exact linear algebra over F_7
        seed: 0
        note: >-
          No random generator is consulted. seed 0 records that fact.
          Substituting a random sample of curves or of coordinates is
          forbidden.
    independent_instances: 1
    independent_instances_note: >-
      The one instance is the frozen pair of coordinates. Earlier models
      in the census are minimality controls, not extra draws of the
      weight comparison.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
    budget_note: >-
      Time and CPU figures are advisory machine-protection watches
      (docs/research-budget-policy.md). They do not cap the frozen
      coordinates. maximum_runs is 2 so one infrastructure retry may
      take a new run id. Watch expiry is failed_infrastructure, never a
      negative mathematical result.

  procedure:
    confirm_instance: >-
      Recompute the selection census through the named null. Proceed
      only when the object is y^2 = x^3 + 1 with coordinate 3*z^2, the
      null is y^2 = x^3 + (z^2)*x + (2 + z + z^2) with coordinate z^2,
      both orders over F_343 are 324, and both degrees are 3. Otherwise
      stop as invalid.
    weigh: >-
      Build both monic minimal polynomials and the instrument polynomial
      of the element 1. Count nonzero coefficients, including the
      leading 1. Apply the same routine to x^7 for each selected x and
      require the same polynomial. Do not compute a discrete logarithm.
    mechanism_assignment:
      - observation: >-
          The degree, order, j, instrument, Frobenius, and minimality
          controls pass, and w(z^2) - w(3*z^2) is at least 1.
        assigns_to: >-
          The object coordinate has strictly smaller weight than the
          null coordinate. This does not change an ECDLP exponent.
      - observation: >-
          The same controls pass and w(z^2) - w(3*z^2) is 0 or negative.
        assigns_to: >-
          Negative. Equal or larger object weight means this coordinate
          shows no such sparsity.
      - observation: >-
          An earlier model qualifies, a degree is not 3, an order is not
          324, a trace is divisible by 7, a j-test fails, the instrument
          weight is not 2, a weight falls outside {1, 2, 3, 4}, or
          Frobenius changes a polynomial.
        assigns_to: >-
          Invalid. Not evidence for either weight.
      - observation: >-
          The watch expires, a dependency is missing, or the run crashes.
        assigns_to: >-
          failed_infrastructure. Not evidence against the hypothesis.

  stopping_rules:
    - Stop when the minimality census, both weights, the instrument weight, and one assignment row are recorded.
    - Do not continue to a second coordinate after this pair.
    - Do not compute a discrete logarithm.
    - Watch expiry stops the run as failed_infrastructure.

  invalidation_rules:
    - A timeout, crash, memory abort, or missing dependency is failed_infrastructure and is not evidence against the hypothesis.
    - Reporting a weight gap when the minimality or instrument control failed invalidates the run.
    - Dropping the leading 1 from one polynomial and not the other invalidates the run.
    - Changing the pre-registered prediction after seeing the weights is forbidden. A correction is a new amendment record, and existing runs are not re-scored against it.

  success_criterion: >-
    The run is a success for the sparsity reading exactly when the first
    row of mechanism_assignment holds. Any other completed assignment is
    not this success. Equal weights and a larger object weight are
    negatives, so success can fail.

  falsification_criterion: >-
    The prediction that the object weight is strictly smaller is
    falsified when the second row of mechanism_assignment holds. A
    difference of 0 or less is that negative. The third row falsifies
    nothing. The fourth row falsifies nothing.

  required_artifacts:
    - experiments/EXP-FROB-d056ce/runs/RUN-*/manifest.yaml
    - experiments/EXP-FROB-d056ce/runs/RUN-*/stdout.txt
    - experiments/EXP-FROB-d056ce/runs/RUN-*/stderr.txt
    - experiments/EXP-FROB-d056ce/runs/RUN-*/raw-result.json
    - experiments/EXP-FROB-d056ce/runs/RUN-*/verdict.yaml
  artifact_contents:
    raw-result.json: >-
      object and null models, both coordinates, object_weight,
      null_weight, weight_gap, both degrees, matched_point_count,
      traces, j-invariants, and instrument_weight. No discrete logarithm
      is included.
    verdict.yaml: >-
      Exactly one assignment row from mechanism_assignment, or
      failed_infrastructure with a reason. The verdict quotes the row. It
      does not change hypothesis status.

  assigned_to: executor
  zero_runs_in_design: true
