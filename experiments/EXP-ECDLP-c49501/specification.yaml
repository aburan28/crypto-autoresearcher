experiment:
  id: EXP-ECDLP-c49501
  hypothesis_id: H-ECDLP-8a1942
  version: 1
  title: >-
    Exhaustive determination of the ideal-to-group solution-count ratio used as
    a corank threshold, at p in {101, 211, 1009} and B in {4, 6, 8} for m in
    {2, 3}, against three pre-registered candidate values, with a curve-free
    negation-closed index set as the required null, planted degenerate strata of
    known size as the dynamic-range control, and both ideal formulations
    reported separately
  status: draft
  status_note: >-
    DRAFT. Not review_required and not approved. Coordinator design freeze
    converting IDEA-20260808-481e07 into a testable protocol under
    TASK-20260904-43152a. Not snapshot-committed, not independently reviewed, NO
    RUN AUTHORIZED. DISPATCH GATE UNRESOLVED - see the gate note below; this
    contract may not be dispatched until it is resolved.
  objective: >-
    Measure the exact ratio between the ideal-theoretic F_p-point count of the
    decomposition ideal and the group-theoretic decomposition count over the
    signed factor base, on the generic stratum and on each named degenerate
    stratum, and determine the integer shift in d_solve that follows from using
    the corrected threshold - while establishing, by a curve-free null, whether
    the ratio is a property of elliptic curves at all.
  dispatch_gate_verified: >-
    VERIFIED 2026-09-04, AND THE GATE IS REAL. An earlier draft of this contract
    recorded the gate as unverifiable because ledger/goals/GOAL-MONO-001.yaml
    does not exist. THAT WAS A LOOKUP ERROR: the goal is stored in the sharded
    layout at ledger/goals/GOAL-MONO-001/goal.yaml with checkpoints/ alongside.
    The Coordinator subagent read that record and CONFIRMS `status: paused`,
    title "Semaev-cover monodromy / relation-rate gate (Tier 2 / G5)",
    current_batch_id BATCH-003, and a completion criterion requiring a committed
    decision that the census agrees with full monodromy, exhibits an exceptional
    locus with controls excluding automorphism artifacts, or records a scoped
    instrument/protocol no-go. IDEA-20260808-481e07's dispatch condition is
    therefore CORRECT AS WRITTEN and binds: this contract MAY NOT be dispatched
    under GOAL-MONO-001 while that goal is paused. WHAT REMAINS FOR THE
    COORDINATOR is a routing decision, not a verification: the source proposal
    itself records that the consumer of this correction is the prime-field
    degree axis of the SDEG and DREG lanes rather than the monodromy lane, so
    dispatching it there is available without waiting on the pause. That choice
    is a Coordinator decision and nothing here performs it.
    ADDITIONAL CONTEXT READ AND CARRIED: GOAL-MONO-001's next_action records that
    DEC-20260810-2f86db REJECTS AT SCOPE the generic-fibre Frobenius cycle-type
    census as a probe of relation rate, at every m, because the statistic is
    identically trivial exactly on the factor-base locus where relation search
    operates - which is the same complete-splitting fact this contract's
    correction rests on. That rejection is about a CENSUS INSTRUMENT and does not
    bear on the solution-count arithmetic measured here, but any reader of this
    contract must not re-open that census under cover of this one.
  inputs:
    cells: >-
      Full cross of p in {101, 211, 1009}, B in {4, 6, 8}, m in {2, 3}, with both
      the unsymmetrised and the elementary-symmetric formulation of the ideal
      reported separately for every cell.
    targets_per_cell: >-
      Every target R reachable as a decomposition over the factor base, enumerated
      exhaustively at these sizes; the ratio is computed per target and reported
      per stratum, never only as a pooled mean.
    stratum_definitions_frozen_before_execution: >-
      Read verbatim from the source finding's branch-locus corollary and written
      into results/strata.yaml before any count is taken. GENERIC: no two
      coordinates equal, no signed partial sum over a proper nonempty subset lies
      in the 2-torsion, no degree drop. DEGENERATE-EQ: two coordinates equal.
      DEGENERATE-2T: a signed partial sum over a proper nonempty subset lies in
      the 2-torsion. DEGENERATE-DROP: the (m-1)-argument summation polynomial
      vanishes, i.e. some signed sum is the identity.
    candidate_ratios_preregistered: >-
      THREE candidates, frozen here: 2^(m-2), 2^(m-1), 2^m. The source proposal
      predicts 2^(m-1); the source finding states deg_T S_m = 2^(m-2) and
      describes 2^(m-2) signed sums. This contract does NOT choose between them
      in advance; it requires the enumeration to return exactly one of the three
      and reports which. A measured value outside the set is a falsification of
      the derivation, not a new candidate to be added after the fact.
    lift_convention: >-
      Declared per cell in the manifest - whether the factor base is a set of
      x-coordinates or a symmetric set of points - and never inferred. The
      correction differs by convention and every output row carries its
      convention.
  controls:
    - id: NULL-CURVE-FREE-SIGNSET
      description: >-
        NAMED CURVE-FREE NULL, REQUIRED, AND THE PRIMARY CONTROL. Replace the
        elliptic curve by the abstract cyclic group Z/NZ with N matched to the
        curve's group order, and replace the factor base by a negation-closed
        subset S = -S of Z/NZ of the same size, drawn at a paired seed. Count
        "ideal solutions" as the number of ordered coordinate tuples from S
        summing to R and "group decompositions" as the number of unordered
        signed decompositions, under exactly the same identification rules and
        the same code path. Compute the same ratio.
      failure_meaning: >-
        CONSEQUENCE DECLARED IN ADVANCE. If NULL-CURVE-FREE-SIGNSET returns the
        same ratio as the curve arm on the generic stratum, then the factor is a
        property of the sign action on a negation-closed index set and NOT of
        elliptic curves, and NOTHING in this run set may be quoted as a statement
        about elliptic curves or about the ECDLP. This is the expected outcome
        and it is a legitimate result; the contract records it as such rather
        than presenting the correction as curve content.
    - id: CTRL-M2-KNOWN-ANSWER
      description: >-
        KNOWN-ANSWER EDGE, HAND-CHECKABLE. At m = 2 the sign group is smallest
        and the three candidate values are 1, 2 and 4, which are trivially
        distinguishable. On one named toy curve the counts are also computed BY
        HAND, independently of the driver, and the two must agree exactly.
      failure_meaning: >-
        A driver that disagrees with a hand count at m = 2 is miscounting, and
        every ratio it produced at any m is VOID.
    - id: CTRL-PLANTED-DEGENERACY-LADDER
      description: >-
        DEMONSTRATED DYNAMIC RANGE, PLANTED DEFECTS OF KNOWN SIZE. Construct four
        factor bases by deliberate planting: (0) no planted degeneracy;
        (1) exactly one 2-torsion point planted; (2) exactly one repeated
        coordinate pair planted; (3) both planted. For each, the predicted
        degenerate fraction and the predicted deviation of the pooled ratio from
        the generic constant are computed and written to results/forced_values.
        yaml BEFORE the run. The measured deviation must match the predicted
        deviation at each level, and the four levels must be distinguishable.
      failure_meaning: >-
        A ladder whose measured deviations do not track the planted ones means
        the stratification is not resolving the degeneracies it names, and every
        stratified number is VOID. A control that merely returns a generic ratio
        without responding to a planted degeneracy has not demonstrated dynamic
        range.
    - id: CTRL-STRUCTURED-BASE
      description: >-
        NEARBY OBJECT WHERE THE HEURISTIC MAY FAIL. A multiplicative-coset factor
        base, which is a chosen rather than a random set and may have a far
        larger degenerate fraction than the O_m(1/B) expectation.
      failure_meaning: >-
        A large degenerate fraction here is a FINDING about that base and is
        reported individually with the base recorded, never averaged into the
        pooled statistic.
    - id: CTRL-FORMULATION-PAIR
      description: >-
        Both the unsymmetrised and the elementary-symmetric formulation are run
        on every cell. In the symmetric formulation the coordinate-permutation
        factor disappears and the sign factor changes; both are reported so the
        correction is never silently formulation-specific.
      failure_meaning: >-
        Reporting one formulation only would produce a correction that is wrong
        for the other, which is exactly how such factors go wrong.
    - id: CTRL-THIRD-COUNT-SEPARATION
      description: >-
        The MULTISET count (the object the mean-yield conservation identity
        fixes) is computed alongside the ideal-theoretic and group-theoretic
        counts at every cell, so all three are separated rather than conflated.
      failure_meaning: >-
        Conflating the multiset count with either of the other two would produce
        an m! error that looks like a sign error.
  independent_variables:
    - 'prime p, in {101, 211, 1009}'
    - 'factor-base size B, in {4, 6, 8}'
    - 'decomposition length m, in {2, 3}'
    - 'ideal formulation, in {unsymmetrised, elementary-symmetric}'
    - 'index-set object, in {elliptic curve factor base, curve-free negation-closed subset of Z/NZ}'
    - 'planted degeneracy level, in {0, 1, 2, 3}'
  metrics:
    primary:
      - >-
        R = ideal-theoretic F_p-point count divided by group-theoretic
        decomposition count, an exact rational, dimensionless, per target, pooled
        per stratum, per cell, per formulation, per object.
      - >-
        which of the three pre-registered candidates R equals on the generic
        stratum, or NONE, per cell.
      - >-
        integer difference in d_solve between corrected and uncorrected
        thresholds, in degrees, per available cell, with zero shifts reported
        explicitly.
      - >-
        degenerate-stratum fraction, dimensionless, per stratum per cell, with
        the exact counts.
      - >-
        the audit label recording which solution count each archived artifact
        used, or NOT RECORDED, per artifact.
    secondary:
      - 'the multiset count per cell, reported beside the other two counts.'
      - 'CTRL-PLANTED-DEGENERACY-LADDER measured deviations against predicted deviations, four rows.'
      - 'NULL-CURVE-FREE-SIGNSET ratio per cell beside the curve arm ratio, at paired seeds.'
      - 'the largest observed degenerate fraction over all cells and the factor base achieving it.'
      - 'per-run wall clock and peak memory.'
  heuristic_under_test: HEUR-STRATUM-1
  preregistered_prediction:
    quantity: >-
      The generic-stratum value of R, and the integer shift in d_solve it induces.
    formula: >-
      R equals exactly one of 2^(m-2), 2^(m-1), 2^m on the generic stratum,
      constant across targets at a cell. The shift in d_solve is 0 or 1 degree,
      and exactly 1 at cells where the corank crosses between the two counts.
      WHICH candidate is NOT pre-registered, deliberately: the source proposal
      and the source finding disagree by a factor of 2, and picking one in
      advance would convert a checkable ambiguity into an assumption.
    source: >-
      Derived in H-ECDLP-8a1942 from Theorem C of knowledge/findings/
      KN-FIND-a8990a.md, which this design session read verbatim, together with
      the discrepancy recorded there between that entry's 2^(m-2) and the source
      proposal's 2^(m-1).
  scale_relevance:
    tier: toy
    justification: >-
      p at most 1009, B at most 8, m at most 3, all counts exhaustive. NOT
      TESTABLE AT REACHABLE SCALE: exhaustive enumeration of an ideal's point set
      is what bounds the reach, and it does not extend to the B a real factor
      base would use or to cryptographic p. Whether the same ratio and the same
      degenerate-density law hold there is NOT tested and is not asserted.
    correspondence: null
  tail_checks:
    - >-
      The largest observed degenerate fraction over all cells, with the factor
      base achieving it, reported individually; a structured base with a large
      fraction is a finding about that base rather than noise.
    - >-
      Every target whose ratio deviates from its stratum's constant is reported
      individually with its coordinates, since a single deviating target on the
      generic stratum falsifies the stratification.
    - >-
      The cell with the smallest nonzero d_solve shift is reported explicitly, so
      that a near-inert correction is visible as such.
  replication:
    seeds:
      - 'RUN-ECDLP-c49501-1 (stratum derivation, forced values, CTRL-M2-KNOWN-ANSWER hand check): master seed 20260904091'
      - 'RUN-ECDLP-c49501-2 (curve arm: full cell cross, both formulations, all strata): master seed 20260904092'
      - 'RUN-ECDLP-c49501-3 (NULL-CURVE-FREE-SIGNSET at paired seeds and matched cells): master seed 20260904093'
      - 'RUN-ECDLP-c49501-4 (CTRL-PLANTED-DEGENERACY-LADDER and CTRL-STRUCTURED-BASE): master seed 20260904094'
    independent_instances: 12
    replication_note: >-
      SEEDS POLICY. Each run declares one master seed; the driver derives every
      per-instance seed from it and records the derivation rule and every derived
      seed and base hash in the manifest. RUN-2 and RUN-3 are PAIRED: instance i
      of the curve arm and instance i of the curve-free null are drawn from the
      same derived seed, so the two are directly comparable per instance rather
      than only in aggregate. `independent_instances: 12` is the per-cell floor
      of distinct factor bases. Counting within a cell is EXHAUSTIVE and consumes
      no randomness; randomness enters only in base selection. No seed may change
      after a run; a re-seeded protocol is a NEW contract.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 8
    maximum_runs: 4
    budget_feasibility_note: >-
      At B at most 8 and m at most 3 the coordinate space per target is at most a
      few hundred tuples and the whole cell cross is small; the exhaustive counts
      are seconds of work. Wall clock and memory are set at the template floors
      and are not the binding constraint.
  stopping_rules:
    - >-
      ST-0 GATE. No run starts until a Coordinator decision names where this
      contract is dispatched. GOAL-MONO-001 is verified `paused`, so dispatch
      under that goal is closed while the pause stands; dispatch under the SDEG
      or DREG degree axis, which is where the correction's consumer lives, is
      available and requires only the routing decision.
    - >-
      ST-1 PER-RUN CAP. 600 seconds and 8 GB per run; on approaching the cap the
      run STOPS and names every cell not reached, with its reason.
    - >-
      ST-2 STOP AND REPORT ON AMBIGUITY. If the lift convention or the ideal
      formulation cannot be resolved unambiguously for a cell, the Executor STOPS
      AND REPORTS rather than choosing; the ambiguity is a protocol deviation.
    - >-
      ST-3 NO INTERPRETATION. Observations only. The run package must not state
      that any existing d_solve is wrong, must not correct any archived artifact,
      must not write an evidence or decision record, and must not touch any
      hypothesis status.
    - >-
      ST-4 CANDIDATE FREEZE. The three candidate ratios are frozen by this
      contract. A measured value outside the set is reported as NONE and
      falsifies the derivation; it is never accommodated by adding a candidate.
  invalidation_rules:
    - >-
      INV-HANDCHECK. CTRL-M2-KNOWN-ANSWER disagrees with the driver: the counting
      is wrong and every ratio is VOID.
    - >-
      INV-LADDER. CTRL-PLANTED-DEGENERACY-LADDER measured deviations do not track
      the planted ones: the stratification is not resolving, and every stratified
      number is VOID.
    - >-
      INV-CONVENTION. A cell whose lift convention or formulation is not recorded
      in its manifest is INVALID.
    - >-
      INV-CONFLATION. A cell in which the multiset count was used in place of
      either of the other two counts is INVALID.
    - >-
      INV-NONEXHAUSTIVE. A cell whose target enumeration was truncated is
      reported as PARTIAL and excluded from every criterion.
    - >-
      INV-INFRASTRUCTURE. A crash, timeout or resource failure is recorded with
      its terminal status and IS INFRASTRUCTURE SIGNAL, never evidence against
      HEUR-STRATUM-1 (AGENTS.md rule 5).
  success_criterion: >-
    S1. CTRL-M2-KNOWN-ANSWER agrees exactly with the hand count;
    CTRL-PLANTED-DEGENERACY-LADDER tracks its planted deviations at all four
    levels; both formulations are reported on every cell; and R equals exactly
    one of the three pre-registered candidates on the generic stratum, constant
    across targets, at every completed cell, with the degenerate strata
    accounted separately and the resulting integer d_solve shift reported per
    cell including zeros. S1 MET means the ideal-to-group correction factor is
    determined at the tested toy cells, under the recorded conventions. IT MOVES
    NO EXPONENT AND ESTABLISHES NOTHING ABOUT ANY ATTACK.
  falsification_criterion: >-
    F1. R on the generic stratum is none of the three pre-registered candidates,
    or is not constant across generic-stratum targets at a cell. The derivation
    is wrong and must be redone before any correction is applied anywhere. F2.
    Applying the correction changes d_solve at NO cell in the reachable range.
    The correction is real but inert at toy scale - an honest outcome, recorded
    so nobody re-derives it, and NOT to be presented as a null result about
    curves. F3. Archived artifacts already used the ideal-theoretic count: there
    is nothing to correct. F4, DECLARED IN ADVANCE AND BINDING WHATEVER ELSE
    HOLDS: if NULL-CURVE-FREE-SIGNSET reproduces the curve arm's generic-stratum
    ratio, the factor is a property of any negation-closed index set and NO
    output of this experiment may be quoted as a statement about elliptic curves
    or the ECDLP.
  required_artifacts:
    - experiments/EXP-ECDLP-c49501/driver/count_solutions.py
    - experiments/EXP-ECDLP-c49501/driver/strata.py
    - experiments/EXP-ECDLP-c49501/driver/curve_free_signset.py
    - experiments/EXP-ECDLP-c49501/results/strata.yaml
    - experiments/EXP-ECDLP-c49501/results/forced_values.yaml
    - experiments/EXP-ECDLP-c49501/results/ratio_table.json
    - experiments/EXP-ECDLP-c49501/results/dsolve_shift_table.json
    - experiments/EXP-ECDLP-c49501/results/artifact_count_audit.json
    - experiments/EXP-ECDLP-c49501/results/summary.json
    - experiments/EXP-ECDLP-c49501/results/seed_env_manifest.yaml
    - experiments/EXP-ECDLP-c49501/runs/RUN-ECDLP-c49501-1/manifest.yaml
    - experiments/EXP-ECDLP-c49501/runs/RUN-ECDLP-c49501-1/results.json
    - experiments/EXP-ECDLP-c49501/runs/RUN-ECDLP-c49501-1/stdout.log
    - experiments/EXP-ECDLP-c49501/runs/RUN-ECDLP-c49501-2/manifest.yaml
    - experiments/EXP-ECDLP-c49501/runs/RUN-ECDLP-c49501-2/results.json
    - experiments/EXP-ECDLP-c49501/runs/RUN-ECDLP-c49501-2/stdout.log
    - experiments/EXP-ECDLP-c49501/runs/RUN-ECDLP-c49501-3/manifest.yaml
    - experiments/EXP-ECDLP-c49501/runs/RUN-ECDLP-c49501-3/results.json
    - experiments/EXP-ECDLP-c49501/runs/RUN-ECDLP-c49501-3/stdout.log
    - experiments/EXP-ECDLP-c49501/runs/RUN-ECDLP-c49501-4/manifest.yaml
    - experiments/EXP-ECDLP-c49501/runs/RUN-ECDLP-c49501-4/results.json
    - experiments/EXP-ECDLP-c49501/runs/RUN-ECDLP-c49501-4/stdout.log
  required_artifacts_note: >-
    results/strata.yaml is written before any count and carries the four stratum
    definitions quoted from the source finding. results/forced_values.yaml is
    written before any measurement and carries the three candidate ratios and the
    four planted-ladder predicted deviations. ratio_table.json reports R per
    target, per stratum, per cell, per formulation, per object, with the
    curve-free null beside the curve arm at paired seeds.
  run_plan:
    - id: RUN-ECDLP-c49501-1
      description: 'freeze strata and forced values; CTRL-M2-KNOWN-ANSWER hand-versus-driver check on one named toy curve'
    - id: RUN-ECDLP-c49501-2
      description: 'curve arm: full p x B x m cross, both formulations, all strata, CTRL-THIRD-COUNT-SEPARATION'
    - id: RUN-ECDLP-c49501-3
      description: 'NULL-CURVE-FREE-SIGNSET over Z/NZ at paired seeds and matched cells'
    - id: RUN-ECDLP-c49501-4
      description: 'CTRL-PLANTED-DEGENERACY-LADDER at four planted levels; CTRL-STRUCTURED-BASE multiplicative-coset arm; artifact count audit'
  provenance:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    independent_session: false
    independent_review_status: 'NOT YET REQUESTED. Contract is at `draft`.'
    design_session_verification_note: >-
      The Coordinator subagent that wrote this contract opened
      knowledge/findings/KN-FIND-a8990a.md and read its object definition,
      Theorem C, the branch-locus corollary and its scope section VERBATIM. It
      confirms the source proposal's quotation of the Theorem C root set is
      faithful once n = m-1 is substituted, AND records the unresolved factor-of-
      two discrepancy between that entry's stated deg_T S_m = 2^(m-2) and the
      proposal's predicted correction 2^(m-1) - which is why three candidates are
      pre-registered rather than one. It read only the title line of
      knowledge/findings/KN-FIND-007.md. CORRECTED READ, 2026-09-04: it initially
      reported GOAL-MONO-001 as absent because it globbed ledger/goals/* and saw
      only flat files; the record is in the SHARDED layout at
      ledger/goals/GOAL-MONO-001/goal.yaml, and on being corrected it read that
      record and confirmed `status: paused`, its title, its current_batch_id, its
      completion criterion and its next_action. It did NOT open KN-FIND-c41ea9,
      any archived degree-instrument artifact, DEC-20260810-2f86db, or the
      GOAL-MONO-001 checkpoints.
  source_refs:
    - ledger/hypotheses/H-ECDLP-8a1942.yaml
    - ledger/proposals/IDEA-20260808-481e07.yaml
    - knowledge/findings/KN-FIND-a8990a.md
    - knowledge/findings/KN-FIND-007.md
    - ledger/questions/RQ-MONO-001.yaml
    - docs/claims-and-verification.md
