experiment:
  id: EXP-DREG-c208ae
  hypothesis_id: H-DREG-9cd42c
  derived_from_idea: IDEA-20260815-cce6e2
  question_id: RQ-DREG-001
  goal_id: GOAL-DREG-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Does CTRL-B still discriminate at the rung the campaign selected to expand into?
    Verbatim criterion extraction and a hashed identity control on committed bytes,
    then planted-positive versus corrupted-null admission rates at n = 12, 15 and 18,
    against a trivial always-admit checker forced to zero discrimination

  objective: >-
    The one uncertainty a run reduces is whether the CTRL-B admission machinery still
    separates a correctly-constructed support restriction from a corrupted one at the
    ladder rung GOAL-DREG-001 has selected to expand into. A run establishes (1) the
    admitted discrimination criterion quoted VERBATIM from committed artifacts, with
    its source path and sha256, plus a verdict on whether it is a decidable predicate
    over named fields or a narrative; (2) whether a re-implementation of that criterion
    reproduces, on the committed artifact bytes, the verdict and the two hashes
    EV-DREG-008 records - the identity control that separates a re-implementation
    defect from instrument drift; (3) admit rates on at least 50 planted positives and
    at least 50 corrupted nulls spanning at least three corruption modes, at n = 12,
    n = 15 and n = 18, against the ADMITTED all-or-nothing standard rather than a new
    one; (4) the trivial always-admit and always-refuse checkers on the identical
    instance sets, whose discrimination is forced to zero; and (5) constructibility and
    measured peak RSS per rung, including for any rung not reached.
    THE SCOPE NARROWING IS DELIBERATE AND IS STATED RATHER THAN IMPLIED. CTRL-B has a
    cheap combinatorial ADMISSION stage and an expensive RANK stage. This contract
    verifies the admission stage only. The rank stage that CTRL-B gates has already
    failed on this host at n = 15, D = 6 with 11.73 to 12.22 GiB of prepare-phase peak
    RSS and zero ranks obtained, and nothing here makes it feasible. A pass clears the
    admission machinery at the tested rungs and clears neither the rank measurement nor
    the expansion's scientific value.
    NO MACAULAY RANK IS COMPUTED. No attack, no exponent, no lane result and no status
    change follows from a run.

  what_this_is_not:
    - >-
      NOT a measurement of d_reg, of any rank, or of any deficit. It builds support
      restrictions and hashes them.
    - >-
      NOT a verification of the expensive rank stage CTRL-B gates, which is explicitly
      out of scope with its reason, and NOT a claim that the expansion is feasible.
    - >-
      NOT a challenge to DEC-20260810-2f92d8's selection of the expansion, and not a
      re-adjudication of DEC-20260725-026's admission. It re-applies the admitted
      criterion; it does not revise it.
    - >-
      NOT a retraction of EV-DREG-008's committed structural number. A drift finding
      would say what that number's instrument can be checked against, not that the
      measurement did not happen.
    - >-
      NOT approval, freezing, execution authorization, a run, or evidence. No run has
      been executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE. For the CTRL-B ADMISSION criterion as quoted verbatim
      from its committed admission artifacts, on the boolean chained Semaev system at
      m = 3, t = 3, ti = 0 over GF(2): the reproduction verdict and hash comparison on
      the committed admitted cell; and, at each rung where at least 50 planted and at
      least 50 null instances were actually constructed, the measured admit rates, the
      per-corruption-mode refusal rates, the trivial-checker scores, and the measured
      peak RSS. WHAT DOES NOT FOLLOW - nothing about the feasibility of the rank stage
      CTRL-B gates; nothing about rungs where construction failed; nothing about the
      expansion's scientific value; nothing about d_reg, any deficit, or RQ-DREG-001's
      decision target; and nothing at crypto scale or on prime fields.

  inputs:
    procedure: >-
      STAGE 0 (ZERO COMPUTE, DECLARED AND HASHED BEFORE ANY INSTANCE EXISTS).
      Locate and quote VERBATIM the CTRL-B discrimination criterion as admitted, from
      the committed artifacts - DEC-20260725-026, EV-DREG-007, EV-DREG-008 and the
      BATCH-005 TASK-20260731-016 results and raw-result files those records cite -
      recording for each quotation its source path and that file's sha256. State the
      criterion as a DECIDABLE PREDICATE over named fields, or record that it cannot be
      so stated. Freeze here, in the same declaration: the ADMITTED STANDARD, which is
      all-or-nothing because all_admission_metrics_pass is an all-or-nothing gate -
      100 per cent admission of planted positives and 0 per cent admission of nulls;
      the planted-instance construction procedure; the at least three named CORRUPTION
      MODES for the nulls; the instance counts; the rung list; the trivial checkers;
      and the peak-RSS threshold above which a rung is refused. Hash the declaration.
      THE CRITERION MAY NOT BE RELAXED AFTER THIS POINT, and quoting it verbatim before
      any instance exists is what makes that checkable.
      IF THE CRITERION CANNOT BE STATED AS A DECIDABLE PREDICATE, STOP: the extraction
      record is the deliverable, and the finding is that CTRL-B is unverifiable at every
      rung including the one it was admitted at.
      STAGE 1 (IDENTITY CONTROL ON COMMITTED BYTES, BLOCKING). Re-implement the criterion
      from the Stage 0 verbatim statement alone. Apply it to the exact committed artifact
      content of the admitted cell and require it to return ctrl_b_admission_status
      admitted, all_admission_metrics_pass, rebuild_match true, and both recorded hashes
      - restricted_support_hash and deleted_set_hash - equal to the values EV-DREG-008
      records. A failure here is a RE-IMPLEMENTATION DEFECT and halts the contract; it
      is deliberately distinguishable from Stage 3's drift check.
      STAGE 2 (TRIVIAL-CHECKER NULL OBJECTS, RUN AND COMMITTED BEFORE THE REAL CHECKER
      TOUCHES ANY RUNG). Generate the planted and null instance sets at every rung, then
      run the ALWAYS-ADMIT and ALWAYS-REFUSE checkers on them and record their
      discrimination scores. Both are forced to ZERO. Write and hash these verdicts
      BEFORE Stage 3. If either scores nonzero, the harness is measuring instance
      construction rather than the checker: the run is VOID and nothing else is read.
      STAGE 3 (ADMITTED-RUNG REPRODUCTION). Run the re-implemented criterion on freshly
      constructed planted and null instances at the ADMITTED rung n = 12, seed 2026,
      D = 6. It must meet the admitted all-or-nothing standard. A failure here, with
      Stage 1 passing, is INSTRUMENT DRIFT rather than rung difficulty, and it blocks
      the expansion until resolved.
      STAGE 4 (THE MEASUREMENT). The same at n = 15 - the ladder's next rung - and at
      n = 18 for the trend. Report admit rates, per-corruption-mode refusal rates, the
      discrimination score, constructibility and measured peak RSS per rung. A rung whose
      instance construction exceeds the declared peak-RSS threshold is recorded as NOT
      REACHED with its measurement, and is never scored.
      STAGE 5 (ZERO COMPUTE). Emit the per-rung verdict in HOLDS, DEGRADED, FAILS,
      NOT-VERIFIABLE or NOT-REACHED, and the trend across the rungs actually scored.
      State explicitly, in the deliverable, that only the ADMISSION machinery was tested
      and that the gated rank stage was not.
    instrument: >-
      Python 3.11. Support-restriction construction, deleted-set construction, rebuild
      and SHA-256 hashing only. NO Macaulay matrix is materialized, NO rank is computed
      and NO linear algebra is performed; if any of those turns out to be required to
      evaluate the criterion, HEUR-DREG-CTRLB-2 is falsified and the contract stops
      there. Peak RSS measured per rung by the harness, not modelled. Recorded through
      harness/runner.py with the standard manifest.
    parameters: >-
      Boolean chained Semaev at m = 3, t = 3, ti = 0 over GF(2). Rungs n = 12 (the
      admitted rung), n = 15 (the next rung, the measurement) and n = 18 (the trend).
      D = 6, matching the admitted cell. At least 50 planted positives and at least 50
      nulls per rung, the nulls spanning at least three distinct named corruption modes
      with at least 10 instances per mode. Trivial checkers always-admit and
      always-refuse. Seeds recorded per instance so every instance is reproducible.
      Number of Macaulay ranks computed: ZERO.
    corruption_modes: >-
      At least three, named and frozen in Stage 0, each producing a support restriction
      that a correct admission criterion MUST refuse. Indicative set, to be fixed in the
      declaration: (i) SUPPORT PERTURBATION - one monomial added to or dropped from the
      restricted support, leaving the deleted set stale; (ii) DELETED-SET PERTURBATION -
      the deleted set altered so it no longer complements the restricted support;
      (iii) REBUILD MISMATCH - the restriction rebuilt from a different parent or seed so
      rebuild_match must fail. Each mode's refusal rate is reported separately, because a
      pooled rate hides a mode-specific blind spot, which is exactly the failure this
      contract is looking for.

  controls:
    - >-
      VERBATIM-CRITERION CONTROL, HASHED FIRST. The admitted criterion is quoted with its
      source path and that file's sha256 into a declaration hashed before any instance
      exists. CRITERION RELAXATION - applying a looser standard than the admission used -
      would clear the expansion falsely and would do so invisibly, because a relaxed
      criterion still looks like a criterion. This control removes the possibility rather
      than warning against it.
    - >-
      IDENTITY CONTROL ON COMMITTED BYTES. The re-implemented criterion applied to the
      exact committed artifact content must return EV-DREG-008's recorded verdict and
      both recorded hashes. This is what separates a re-implementation defect from
      genuine instrument drift; without it, a Stage 3 failure is uninterpretable.
    - >-
      TRIVIAL-CHECKER NULL OBJECTS, FORCED TO ZERO AND COMMITTED FIRST. An always-admit
      checker and an always-refuse checker of the same shape, run on the IDENTICAL
      planted and null sets at every rung. Both must score zero discrimination. A nonzero
      score means the harness is measuring how the instances were built rather than what
      the checker returned, and the run is void. THIS CONTROL CAN FAIL and it is the null
      object required before any signal is believed.
    - >-
      ADMITTED-RUNG REPRODUCTION AS NULL 1. The rung at which CTRL-B was admitted must
      reproduce its admitted discrimination. Failure means the instrument has DRIFTED,
      not that the new rung is hard - and the design keeps those two readings separate.
    - >-
      ONE RUNG BEYOND AS NULL 2. n = 18 is run for the TREND, so the result is a curve
      rather than a single point, and a reader can see whether discrimination degrades
      gradually or fails sharply.
    - >-
      PER-MODE REPORTING. At least three distinct corruption modes with at least 10
      instances each and refusal rates reported per mode. A checker that refuses one mode
      perfectly and another not at all has a blind spot that a pooled rate would hide.
    - >-
      CONSTRUCTIBILITY CONTROL. Constructibility and measured peak RSS are reported per
      rung, including for rungs NOT REACHED, so a construction failure is legible as a
      resource fact and cannot be misread as instrument failure.
    - >-
      ORDERING CONTROL, BINDING. The Stage 2 trivial-checker verdicts are written and
      hashed BEFORE the real checker is run at any rung. A run in which the real checker
      was scored first is invalid.

  independent_variables:
    - 'rung: n in 12, 15 or 18'
    - 'instance class: planted positive or corrupted null'
    - 'corruption mode within the null class: at least three named modes'
    - 'checker: the re-implemented CTRL-B criterion, always-admit, or always-refuse'
    - seed per instance

  metrics:
    primary:
      - >-
        The admitted criterion quoted VERBATIM, with source path and that file's sha256
        per quotation, and the verdict DECIDABLE PREDICATE or NARRATIVE.
      - >-
        Identity-control result on committed bytes - verdict, all_admission_metrics_pass,
        rebuild_match, restricted_support_hash and deleted_set_hash, each printed beside
        the value EV-DREG-008 records, as MATCH or MISMATCH.
      - >-
        Per rung: admit rate on planted positives, admit rate on nulls, and the
        discrimination score defined as the planted admit rate minus the null admit rate.
      - >-
        Per rung and per corruption mode: refusal rate, with the instance count per mode.
      - >-
        Trivial always-admit and always-refuse discrimination scores per rung, forced to
        zero, timestamped and hashed BEFORE the real checker's scores.
      - >-
        Constructibility per rung - CONSTRUCTED or NOT REACHED - with the measured peak
        RSS and the declared threshold beside it.
      - >-
        Per-rung verdict in HOLDS, DEGRADED, FAILS, NOT-VERIFIABLE or NOT-REACHED,
        assigned by the Stage 0 standard and by nothing decided afterwards.
    secondary:
      - Discrimination trend across the rungs actually scored, and its shape - gradual or sharp.
      - Wall time and peak RSS per rung and per stage, since the separability of the admission stage from the rank stage is itself a measured claim.
      - Instance seeds sufficient to reproduce every planted and null instance exactly.
      - sha256 of the Stage 0 declaration and of the Stage 2 trivial-checker verdicts, with their two timestamps in that order.
      - The count of instances discarded during construction, with reasons.

  heuristic_under_test: HEUR-DREG-CTRLB-1
  heuristic_under_test_note: >-
    Stages 3 and 4 are the validation for HEUR-DREG-CTRLB-1 of H-DREG-9cd42c - that
    discrimination power at the admitted rung predicts discrimination power at the next
    rungs. The heuristic's rigorous ingredient is only that the criterion's DEFINITION is
    identical at every rung; the GAP is that discrimination depends on the separation
    between planted and null constructions, which typically shrinks as a ladder ascends,
    and that is why instruments fail on expansion rather than on admission. Stage 4's
    per-rung comparison against the admitted standard is exactly the falsification test.
    HEUR-DREG-CTRLB-2 - that the admission machinery is computable without the rank it
    gates, below the memory cap - is validated by Stage 4's measured peak RSS and by the
    contract's stopping rule, and its failure is a resource fact rather than a finding.

  preregistered_prediction:
    quantity: >-
      The per-rung discrimination score of the re-implemented CTRL-B admission criterion
      against the admitted standard, and the trivial-checker scores on the same instance
      sets.
    formula: >-
      THE ADMITTED STANDARD IS QUOTED, NOT CHOSEN: all_admission_metrics_pass is an
      all-or-nothing gate, so the standard is 100 per cent admission of planted positives
      and 0 per cent admission of nulls, giving a discrimination score of exactly 1.
      HOLDS at a rung means score 1 against at least 50 planted and at least 50 nulls
      spanning at least three modes; DEGRADED means any planted admission below 100 per
      cent or any null admission above 0 per cent; FAILS means the score is at or below
      zero; NOT-VERIFIABLE means the criterion was not recoverable as a decidable
      predicate; NOT-REACHED means instances were not constructible inside the threshold.
      FORCED CONTROLS: both trivial checkers score exactly zero; the identity control
      reproduces EV-DREG-008's verdict and both hashes exactly.
      NOT PREDICTED: whether n = 15 HOLDS or DEGRADES. The parent proposal's own priors
      are recorded and NOT adopted as predictions - 0.8 that the criterion is precisely
      stated, 0.7 that instances are constructible at the next rung, 0.35 that
      discrimination degrades materially there.
    source: >-
      Pre-registered in the parent proposal IDEA-20260815-cce6e2, whose validation plan
      specifies at least 50 planted and at least 50 null instances per rung at the
      admitted rung and the next two, comparison against the admitted standard per rung,
      a tail check at the highest rung where construction succeeds, and the criterion
      quoted verbatim from the admission so it cannot be relaxed. THE ADMITTED STANDARD
      itself is read from EV-DREG-008's recorded all_admission_metrics_pass and
      rebuild_match fields and from DEC-20260725-026's admission of
      CTRL-B-Q-MACHINE-v1 path-pinned checks. THIS CONTRACT'S ADDITIONS, each with its
      reason: the trivial-checker null objects, added because a discrimination score is
      only about the checker if the instance sets do not carry the separation; the
      identity control on committed bytes, added to separate a re-implementation defect
      from drift; the per-mode reporting, added because a pooled rate hides a blind spot;
      and the explicit exclusion of the gated rank stage, added because that stage has
      already failed on this host and a contract that quietly included it could not run.

  scale_relevance:
    tier: toy
    justification: >-
      The tested parameters are the boolean chained Semaev system at m = 3, t = 3,
      ti = 0 over GF(2) at n in 12, 15 and 18, D = 6 - the admitted cell and the ladder's
      next two rungs. The design reaches these rungs at all only because it tests the
      COMBINATORIAL admission stage rather than the rank stage: the same lane measured
      11.73 to 12.22 GiB of prepare-phase peak RSS at n = 15, D = 6 in the rank stage and
      obtained no rank. THE TRANSFER ASSUMPTIONS ARE STATED AND NARROW. First, that the
      admission stage is separable from the rank stage on this host - HEUR-DREG-CTRLB-2,
      which is MEASURED here rather than assumed. Second, that discrimination at the
      admitted rung predicts discrimination at the next - HEUR-DREG-CTRLB-1, which is the
      hypothesis under test and is expected to be the weak point. NOTHING transfers to
      the feasibility of the rank stage, to rungs above 18, to prime fields, to other m
      or t, to crypto scale, or to any statement about d_reg or ECDLP hardness.
    correspondence: null

  tail_checks:
    - >-
      Report the HIGHEST rung at which construction succeeded, separately and with its
      measured peak RSS. That rung is the practical ceiling of instrument verification
      for this ladder and is the single most reusable number this contract produces.
    - >-
      Report the WORST corruption mode per rung - the mode with the lowest refusal rate -
      separately from the pooled rate, since a checker is only as good as its weakest mode
      and a blind spot is invisible in a pooled figure.
    - >-
      Report the individual instances that were admitted when they should have been
      refused, or refused when they should have been admitted, with their seeds, so a
      reviewer can reproduce any single disagreement exactly rather than reading a rate.
    - >-
      Report the discrimination score at the admitted rung beside the score at each new
      rung in the same table, so drift and degradation are visible in one place instead
      of being compared across sections.
    - >-
      Report peak RSS for the admission stage separately from any other stage, since the
      separability claim HEUR-DREG-CTRLB-2 rests on that number alone.

  replication:
    seeds: [2026, 20260904, 20260905]
    independent_instances: 150
    note: >-
      At least 50 planted and at least 50 null instances per rung across three rungs, so
      at least 300 instance evaluations per checker; independent_instances records the
      per-checker instance count at the primary scope. Every instance's seed is recorded
      so any single admission or refusal can be reproduced exactly. Seed 2026 is included
      because it is the admitted cell's seed and the admitted-rung reproduction must be
      run at it; the other two vary the instance draws.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2.0
    maximum_memory_gb: 8
    maximum_runs: 12
    maximum_workers: 1
    note: >-
      Sized to the HOST and to the admission stage only. The 8 GB cap is the template
      floor; the contract additionally declares a per-rung REFUSAL threshold well below
      it, above which a rung is recorded NOT REACHED rather than attempted, because this
      lane has already exhausted memory at n = 15 in the stage this contract excludes. If
      the admission stage itself approaches that threshold, HEUR-DREG-CTRLB-2 is falsified
      and the contract stops rather than raising the cap.

  stopping_rules:
    - >-
      STOP at Stage 0 if the admitted criterion cannot be stated as a decidable predicate
      over named fields. The extraction record with its verbatim quotations, paths and
      hashes is the deliverable.
    - >-
      STOP at Stage 1 if the identity control on committed bytes fails. The
      re-implementation is defective and no rung result may be read.
    - >-
      VOID the run at Stage 2 if either trivial checker scores nonzero discrimination.
      Nothing else in the run is read or reported as a finding.
    - >-
      REFUSE any rung whose instance construction exceeds the declared peak-RSS threshold,
      record it as NOT REACHED with the measurement, and continue to the remaining rungs
      rather than aborting.
    - >-
      STOP the contract if evaluating the criterion is found to require a Macaulay rank or
      any linear algebra. HEUR-DREG-CTRLB-2 is then falsified and the admission stage is
      not separable on this host.
    - >-
      STOP at maximum_runs, total_cpu_hours, wall_clock_seconds_per_run or
      maximum_memory_gb, whichever binds first.

  invalidation_rules:
    - >-
      A run that applies a criterion differing in any respect from the Stage 0 verbatim
      quotation is invalid. Criterion relaxation is the single failure mode that would
      clear the expansion falsely, and it is invalid rather than merely discouraged.
    - >-
      A run that scores the real checker at any rung before the Stage 2 trivial-checker
      verdicts are written and hashed violates the ordering control and is invalid.
    - >-
      A run whose nulls span fewer than three distinct corruption modes, or fewer than 10
      instances in any mode, is invalid for that rung's discrimination score: a null set
      corrupted in one way overstates discrimination.
    - >-
      A run that pools refusal rates across corruption modes without also reporting them
      per mode is invalid as to that rung's verdict.
    - >-
      A run that computes any Macaulay rank, builds any Macaulay matrix, or performs any
      linear algebra is OUT OF CONTRACT and invalid.
    - >-
      A run that edits, supersedes or writes to any existing ledger, experiment, goal or
      knowledge record is invalid. The write scope is this contract's own run directory.
    - >-
      A run that reports a verdict for a rung recorded NOT REACHED is invalid: an
      unconstructed rung has no score.
    - >-
      A run whose instances are not reproducible from recorded seeds is invalid, because a
      disagreement that cannot be reproduced cannot be reviewed.
    - >-
      A timeout, crash or memory exhaustion makes the rung or the run
      failed_infrastructure and is NEVER evidence about CTRL-B, about d_reg, or about
      RQ-DREG-001 (AGENTS.md rule 5).

  success_criterion: >-
    ALL of the following, each decidable from the primary metrics. (1) The Stage 0
    declaration exists, is hashed before any instance is generated, and contains the
    admitted criterion quoted verbatim with source paths and sha256 values, the frozen
    all-or-nothing admitted standard, the named corruption modes, the instance counts, the
    rung list and the peak-RSS refusal threshold - and if the criterion is NOT a decidable
    predicate, that record alone is a complete and successful run. (2) The identity control
    on committed bytes reproduces EV-DREG-008's verdict, all_admission_metrics_pass,
    rebuild_match and both recorded hashes exactly. (3) The trivial always-admit and
    always-refuse checkers scored exactly zero discrimination at every rung where instances
    were built, with their verdicts written and hashed BEFORE the real checker's, and both
    timestamps in the manifest. (4) At every rung recorded CONSTRUCTED, at least 50 planted
    and at least 50 null instances exist, the nulls spanning at least three named modes with
    at least 10 each, and admit rates are reported pooled AND per mode. (5) Constructibility
    and measured peak RSS are reported for every rung including those NOT REACHED. (6) The
    deliverable states explicitly that only the ADMISSION machinery was tested and that the
    gated rank stage was not. A run meeting (1) to (6) is VALID, and the per-rung verdict is
    then whatever the measurement returns: HOLDS, DEGRADED, FAILS, NOT-VERIFIABLE or
    NOT-REACHED. THE CONTRACT PRIVILEGES NO OUTCOME - a DEGRADED verdict at n = 15 is the
    outcome that saves the most and is as welcome as a HOLDS.

  falsification_criterion:
    - >-
      The admitted criterion cannot be quoted as a decidable predicate over named fields.
      (C1) fails: CTRL-B is unverifiable at every rung, including the one it was admitted
      at, and any expansion under it proceeds under an unverified instrument, which the
      batch must then state explicitly.
    - >-
      The identity control on committed bytes fails. The re-implementation is defective,
      no rung result may be read, and this outcome is deliberately distinguishable from
      drift.
    - >-
      The admitted rung n = 12 fails the admitted standard while the identity control
      passes. (C2) fails: INSTRUMENT DRIFT, not rung difficulty, and the expansion is
      blocked until it is resolved.
    - >-
      Either trivial checker scores nonzero discrimination on the same instance sets. The
      harness is measuring instance construction rather than the checker and the run is
      VOID.
    - >-
      Planted admission below 100 per cent, or null admission above 0 per cent, at a rung
      recorded CONSTRUCTED with the full instance and mode counts. (C3) fails at that rung
      and HEUR-DREG-CTRLB-1 is falsified: the expansion would produce results nobody could
      interpret and must be redesigned rather than run and caveated.
    - >-
      Instances are not constructible at n = 15 inside the declared threshold, or the
      criterion turns out to require a rank to evaluate. (C4) fails and HEUR-DREG-CTRLB-2
      is falsified. This is a RESOURCE FACT about the host, never evidence about CTRL-B or
      about d_reg, and the honest consequence is that the expansion proceeds without a
      validated instrument and must say so.

  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, environment and
      dependency versions, and the resolved model and inference block including
      requested_policy, resolved model identifier, model_verified and reasoning effort.
    - >-
      stage0-declaration.yaml - the verbatim criterion quotations with source paths and
      per-file sha256, the decidable-predicate verdict, the frozen admitted standard, the
      named corruption modes, instance counts, rung list and peak-RSS refusal threshold -
      with its own sha256 in the manifest before any other output exists.
    - >-
      identity-control.json - the re-implementation's output on the committed artifact
      bytes beside EV-DREG-008's recorded verdict, all_admission_metrics_pass,
      rebuild_match, restricted_support_hash and deleted_set_hash, marked MATCH or
      MISMATCH per field.
    - >-
      trivial-checker-verdicts.json, written and hashed BEFORE results.json, with both
      trivial checkers' scores per rung and the two timestamps.
    - >-
      instances/ - the planted and null instance sets per rung, or their seeds plus the
      exact construction routine, sufficient to reproduce every instance exactly, with the
      corruption mode labelled per null.
    - >-
      results.json - per rung and per checker: admit rates pooled and per corruption mode,
      the discrimination score, the verdict, and the individual disagreeing instances with
      their seeds.
    - >-
      resources.json - constructibility, measured peak RSS and wall time per rung and per
      stage, the declared threshold, and every rung recorded NOT REACHED with its
      measurement.
    - >-
      scope-statement.md - one page stating that only the CTRL-B ADMISSION machinery was
      tested, that the gated rank stage was not, and what a pass does and does not clear.
    - stdout and stderr, and validity status with its reason.

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      COORDINATOR DRAFTING DOES NOT APPROVE. This contract is `review_required`,
      approved_by is null, frozen is false and execution_authorized is false. Approval is
      a separate committed Coordinator decision and is the maintainer's gate.
    - >-
      THE VERBATIM-CRITERION CONTROL AND ITS HASHING ORDER MUST REMAIN. The whole
      evidential value of this contract is that the standard could not have been relaxed
      after seeing a result, and only a criterion quoted and hashed before any instance
      exists shows that.
    - >-
      THE TRIVIAL-CHECKER NULL OBJECTS MUST REMAIN, AND MUST REMAIN ORDERED FIRST. Without
      them a discrimination score cannot be attributed to the checker rather than to the
      instance generator.
    - >-
      THE SCOPE NARROWING MUST BE APPROVED KNOWINGLY. This contract verifies the ADMISSION
      machinery and NOT the rank stage CTRL-B gates. A Coordinator approving it is
      approving an instrument check, not a clearance of the expansion, and the deliverable
      is required to say so in its own words.
    - >-
      NO OUTCOME AUTHORIZES A STATUS CHANGE for H-DREG-001 or GOAL-DREG-001, and none
      retracts EV-DREG-008. A drift finding is an input to a separate Coordinator decision
      about the expansion, not the decision itself.

