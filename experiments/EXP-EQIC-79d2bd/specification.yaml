experiment:
  id: EXP-EQIC-79d2bd
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-b5c439
  question_id: RQ-EQIC-8cb959
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'A STRUCTURED FACTOR BASE THAT IS phi-STABLE BY CONSTRUCTION: put the Gaudry/Diem "small
    x-coordinate" prime-field factor base on the INVARIANT LINE instead of the x-line -- V = {x :
    x^3 mod p lies in a short interval or a subgroup coset} -- so that structure and phi-stability
    coexist for the first time, and measure whether the norm form''s degree inflation destroys whatever
    the structure was worth'
  status: draft
  objective: "(A) THE INCOMPATIBILITY THIS PROPOSAL RESOLVES, AND WHY IT IS A REAL OBSTACLE. Prime-field\
    \ point-decomposition index calculus has one classical factor-base design lever: choose V structured,\
    \ e.g. V = {x : x < B} (the Gaudry/Diem short-interval base). It has, separately, one endomorphism\
    \ lever: choose V phi-stable. THESE TWO ARE INCOMPATIBLE ON THE x-LINE. A short interval [0, B)\
    \ is not stable under x -> zeta x: multiplication by a cube root of unity is a wild permutation\
    \ of F_p with respect to the integer order, so zeta * [0, B) is a scattered set, and no nonempty\
    \ interval other than {0} is mu_3-stable. Any lane that wants both must therefore change where\
    \ the structure lives.\n(B) THE RESOLUTION, EXACTLY. Impose the structure on the INVARIANT coordinate\
    \ u = x^3, not on x:\n  V_W = { x in F_p^* : x^3 mod p lies in W },  W a chosen subset of F_p^*.\n\
    V_W is mu_3-stable for ANY W, because x and zeta x share the same u. And by the theorem of IDEA-20260807-4d7e8e,\
    \ on a j = 0 curve the on-curve condition is also a function of u alone, so\n  V_W intersect X_E\
    \ = { x : x^3 in W and x^3 + b is a square },\nwhich is again a union of complete orbits. Taking\
    \ W a short interval [0, U) gives about U/3 cubes in W, hence about U/3 orbits, hence |V_W intersect\
    \ X_E| about U/2 after the residue condition -- a factor-base universe with BOTH a size parameter\
    \ and an interval structure, and phi-stable at no extra cost. Membership testing costs one cube\
    \ and one interval comparison.\n(C) THE THREE STRUCTURE FAMILIES WORTH SEPARATING, because they\
    \ behave differently and lumping them is how this kind of proposal goes wrong.\n  W-INT: W = [0,\
    \ U), a short interval on the invariant line. This is the\n    direct transport of the Gaudry/Diem\
    \ base. The membership polynomial\n    g(T) = prod_{u in W, u a cube, u + b square} (T - u) has\
    \ degree about\n    U/6 and NO special structure beyond its support.\n  W-SUB: W = the subgroup\
    \ of cubes itself, or a coset of a small-index\n    subgroup H <= F_p^*. Then membership is a\
    \ single exponentiation\n    u^{(p-1)/d} = fixed, with NO polynomial of degree |W| needed at all\
    \ --\n    the membership CONSTRAINT becomes a residuosity condition rather than a\n    vanishing\
    \ condition. This is the only member of the family in which the\n    degree-m membership polynomial\
    \ disappears entirely, and it is the one\n    with a genuinely different algebraic character.\n\
    \  W-SPARSE: W = the image of a low-degree map, e.g. W = {t^2 : t < U} or\n    W = {c t + d :\
    \ t < U}. Then g has a compact description and the system\n    can be re-parameterised in t, trading\
    \ one variable of degree |W| for one\n    variable of small degree with an auxiliary equation.\n\
    Only W-INT and W-SPARSE stay inside the Groebner framework as stated; W-SUB leaves it, and that\
    \ is precisely why it is worth carrying.\n(D) THE PRE-REGISTERED PREDICTION, AND IT IS NEGATIVE.\
    \ The decomposition system on the invariant line is\n  { T(u1, u2) = 0, u1 in W, u2 in W },\n\
    where T is the norm form of IDEA-20260807-1ea327, of bidegree (6, 6) rather than S_3's (2, 2).\
    \ THE OBSTRUCTION NAMED IN ADVANCE: the r-fold per-variable degree inflation of the norm (2 ->\
    \ 6 at r = 3) applies to EVERY structured base equally, while the interval structure's benefit\
    \ -- fewer candidates, smaller membership degree -- is exactly the r-fold deflation already available\
    \ from any phi-stable base. So the two effects are predicted to cancel to within measurement noise,\
    \ and the structured invariant base is predicted to perform indistinguishably from the unstructured\
    \ phi-stable base of the same cardinality. THE COMPETING EXPLANATION that would make this proposal\
    \ interesting: the interval structure on the u-line interacts with the norm form's Newton polytope\
    \ in a way the unstructured base does not, so that the measured solving-degree proxy for W-INT\
    \ is strictly below both the unstructured phi-stable base AND the x-line short-interval base at\
    \ matched cardinality. Either outcome is a deliverable; the first is a closure with a named obstruction,\
    \ the second would be the first structure-times-symmetry interaction measured in this lane.\n\
    (E) RELATION-COUNT ARITHMETIC, UNCHANGED AND STATED ANYWAY. V_W intersect X_E is a union of m\
    \ complete orbits, |V| = 3m, and the reduced system has m unknowns. Each successful decomposition\
    \ contributes ONE independent equation\n  a_t + b_t k = eps_1 lambda^{c_1} l_{j_1} + eps_2 lambda^{c_2}\
    \ l_{j_2}\nover those m unknowns. The phi-images of that relation are lambda-multiples and contribute\
    \ rank 0 (IDEA-20260807-5dfe4a). Structuring W changes WHICH orbits are in the base and the cost\
    \ of the membership test; it does not change that one search yields one equation, and it does\
    \ not change the per-search success probability, which depends on |V| and the arity. Nothing in\
    \ this proposal manufactures relations."
  resource_label: R1, R2
  admissibility: admissible
  admissibility_argument: 'R1 in its strongest form: the factor base is DEFINED by a condition on
    x-coordinates as field elements -- an interval in the integer representative, or a multiplicative-subgroup
    membership -- which is information a generic-group oracle does not expose. A simulator returning
    opaque handles cannot decide "is this point''s x-coordinate below U" or "is it a cube", so neither
    the base nor the membership test is simulable in the sense of KN-FIND-b7e091. R2: the identification
    of V_W with a union of complete orbits uses the curve equation a = 0 through the theorem of IDEA-20260807-4d7e8e.
    phi is never applied to a point of G to gain information.'
  reachability_gate: 'NOT APPLICABLE TO THE DESIGN: no curve is moved; the four arms differ only in
    factor-base support on one fixed curve, and the comparator curves are constructed. T5 does not
    bind. T4 binds on the scope exactly as elsewhere in this lane: the invariant line exists only
    because a = 0, which is fixed by the isogeny class, so no target curve can be moved into this
    family. A second, weaker reachability question specific to this record is stated for completeness:
    within the FIXED curve, is a good W reachable? Yes and cheaply -- W is chosen by the experimenter
    at zero cost, which is exactly why the negative prediction is meaningful: if a freely choosable
    structure does not help, structure is not the missing ingredient.'
  inputs:
    procedure: 'CHEAPEST VALID DISCRIMINATOR, MINUTES AND ZERO CURVE WORK: verify claim (A) computationally
      -- for a sample of primes p = 1 mod 3, confirm that zeta * [0, U) intersect [0, U) has size
      about U^2 / p (i.e. the interval is essentially unstable) for every U in a ladder. That single
      check establishes the incompatibility this proposal exists to resolve, and if it fails -- if
      some interval IS approximately mu_3-stable -- the entire framing changes and the cheaper design
      is on the x-line after all. THEN, an hour: build the four arms at matched cardinality on one
      16-bit j = 0 instance and confirm the exact orbit counts and cardinalities before any solving.
      THEN, hours: STEP 2 at field_bits in {12, 16, 20}, seeds {1, 2, 3}, 20 targets per cell, all
      four arms plus NULL-3. THEN, an hour: the delta ladder on ARM W-INT at the largest affordable
      instance.'
    mechanism: "STEP 1 -- BUILD THE BASES, ALL AT MATCHED CARDINALITY 3m. On a fixed j = 0 instance\
      \ construct four factor bases, all of cardinality exactly 3m:\n  ARM W-INT:   orbits whose u\
      \ lies in [0, U), U chosen so that the count of\n               qualifying orbits is exactly\
      \ m.\n  ARM W-SUB:   orbits whose u lies in a fixed coset of the index-d subgroup\n        \
      \       of F_p^* for the smallest d giving at least m orbits;\n               membership is\
      \ one exponentiation.\n  ARM W-RAND:  orbits drawn uniformly (the unstructured phi-stable control).\n\
      \  ARM X-INT:   the x-line short-interval base {x < B} intersected with X_E,\n             \
      \  NOT phi-stable, of the same cardinality 3m -- the classical\n               comparator.\n\
      Record for each: the exact orbit count available, the realised cardinality, and the membership\
      \ polynomial degree.\nSTEP 2 -- SOLVE THE SAME TARGET STREAM ON ALL FOUR. Using the ENC-SYM\
      \ invariant encoding of IDEA-20260807-1ea327 for the three phi-stable arms and ENC-X for ARM\
      \ X-INT, run the arity-2 decomposition on an identical stream of targets, recording wall time,\
      \ basis size, maximum reduced-basis total degree, solutions found, and solutions certified.\n\
      STEP 3 -- THE W-SUB SPECIAL CASE, TREATED SEPARATELY BECAUSE IT LEAVES THE FRAMEWORK. For W-SUB\
      \ the membership condition is u^{(p-1)/d} = c, a residuosity test rather than a polynomial of\
      \ degree m. Two sub-arms:\n  W-SUB-poly: encode membership as the degree-m polynomial anyway\
      \ (so the\n    comparison with W-INT is like for like);\n  W-SUB-filter: do not encode membership\
      \ at all -- solve\n    T(u1, u2) = 0 for u2 given u1 by univariate root-finding of a degree-6\n\
      \    polynomial, then FILTER the roots by the residuosity test. This changes\n    the algorithm\
      \ from \"solve a system\" to \"root-find and filter\", and its\n    cost is O(m) root-findings\
      \ of degree 6 per target instead of one\n    Groebner run. Whether that is faster is a measurement,\
      \ and it is the\n    genuinely different thing in this proposal.\n\nSTEP 4 -- THE NULLS AND\
      \ THE DECAY. Run STEP 2 on the size-matched unstructured random x-line base (no orbits, no interval)\
      \ as the outermost control, and run the epsilon orbit-breaking ladder of IDEA-20260807-b42544\
      \ on ARM W-INT. Any advantage attributed to the invariant-line structure must decay as the structure\
      \ is destroyed: replace a fraction of the qualifying orbits by orbits drawn from outside W,\
      \ at fixed cardinality, and require monotone decay to ARM W-RAND.\nSTEP 5 -- ACCOUNT THE MEMBERSHIP\
      \ TEST HONESTLY. Every arm's cost must include the cost of DECIDING membership, because that\
      \ is where W-SUB is cheap and W-INT is not. Report field operations per membership decision\
      \ alongside the Groebner numbers, or W-SUB will be credited with a saving it pays for elsewhere."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - ARM W-RAND, unstructured phi-stable, matched cardinality (blocking)
  - ARM X-INT, classical x-line short interval, matched cardinality
  - NULL-3, fully random x-line base, matched cardinality
  - delta ladder {0, 1/3, 2/3, 1} at fixed cardinality
  - epsilon orbit-breaking ladder inherited from IDEA-20260807-b42544
  - W = all cubes degeneration fixture reproducing ARM W-RAND exactly
  - independent certificate re-verification of every claimed decomposition
  - membership-decision cost measured and charged per arm
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, THREE LAYERS. NULL-1, THE UNSTRUCTURED
    phi-STABLE BASE (ARM W-RAND) at the SAME cardinality 3m: isolates the structure from the phi-stability.
    If W-INT does not beat W-RAND, the interval structure contributes nothing and the honest report
    is the pre-registered negative. NULL-2, THE CLASSICAL x-LINE SHORT-INTERVAL BASE (ARM X-INT) at
    the same cardinality: isolates the invariant-line placement from the interval idea itself. If
    X-INT does as well, the placement is irrelevant. NULL-3, THE FULLY UNSTRUCTURED RANDOM x-LINE
    BASE at the same cardinality: the outermost control, and the one against which KN-LIT-006''s verdict
    is calibrated. DECAY PARAMETER: the STRUCTURE-BREAKING FRACTION delta -- the fraction of qualifying
    orbits replaced by orbits drawn from outside W, at fixed cardinality 3m. Any measured advantage
    of W-INT must decay monotonically to the W-RAND value as delta goes 0 -> 1/3 -> 2/3 -> 1. Flatness
    in delta is the canonical artifact tell and the advantage may not be attributed to the structure.
    The orbit-breaking parameter epsilon of IDEA-20260807-b42544 is inherited as a second, independent
    decay axis.'
  independent_variables: []
  metrics:
    primary:
    - Groebner wall time, basis size, max total degree, per arm per target
    - exact qualifying-orbit count and realised cardinality per arm
    - membership-decision field operations per test, per arm
    - certified solutions per arm
    secondary:
    - delta ladder and epsilon ladder curves
    - sha256 of each factor base and each membership polynomial
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Groebner wall time, ARM W-INT against ARM W-RAND, matched cardinality 3m, identical
      target stream and encoding
    formula: 'PRE-REGISTERED EXPECTATION IS NO DIFFERENCE: ratio in [0.85, 1.18]. A ratio below 0.85
      sustained over at least 20 targets and INCREASING in m is the positive branch and would be the
      first structure-times-symmetry interaction in this lane. A ratio above 1.18 means the structure
      hurts, which is also informative and is reported.'
    source: pre-registered in IDEA-20260807-b5c439 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - CARDINALITY DRIFT. The qualifying-orbit count in an interval is not exactly U/6; if U is chosen
    by formula rather than by counting, the arms will not be cardinality-matched and the entire comparison
    collapses into the size artifact this lane exists to avoid. U MUST be chosen by counting until
    exactly m orbits qualify.
  - INTERVAL ENDPOINT EFFECTS. A short interval starting at 0 includes small u whose cube roots may
    have special structure (e.g. u = 1 has cube root 1). Randomising the interval's start and reporting
    the spread is required.
  - W-SUB COSET CHOICE. Different cosets of the same subgroup can have materially different intersections
    with the on-curve condition at small p. Multiple cosets must be tested and the spread reported,
    not one coset.
  - MEMBERSHIP COST MISCHARGING. W-SUB's cheap membership test is its main structural advantage; failing
    to charge W-INT's polynomial-degree membership on the same footing would manufacture that advantage.
  - SOLVER IDIOSYNCRASY. As in IDEA-20260807-1ea327, sympy's routine may respond to support structure
    in ways an optimized F4 would not; all conclusions are within-solver.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'PRE-REGISTERED EXPECTATION IS NO DIFFERENCE: ratio in [0.85, 1.18]. A ratio
    below 0.85 sustained over at least 20 targets and INCREASING in m is the positive branch and would
    be the first structure-times-symmetry interaction in this lane. A ratio above 1.18 means the structure
    hurts, which is also informative and is reported.'
  falsification_criterion:
  - 'Claim (A) is wrong: some nonempty interval is (approximately) mu_3-stable. The framing collapses
    and the record is superseded by a cheaper x-line design.'
  - W = all cubes does not reproduce ARM W-RAND exactly. The base construction is buggy; no comparative
    number may be reported.
  - 'W-INT matches W-RAND within [0.85, 1.18] on every metric at every m. THE PRE-REGISTERED NEGATIVE
    FIRES: the invariant-line structure contributes nothing beyond cardinality, the obstruction is
    named (the norm''s r-fold degree inflation applies uniformly and cancels the structure''s deflation),
    and this is a closure at the docs/inventor-protocol.md section 4 standard with forward guidance
    pointing to W-SUB-filter and to higher arity.'
  - An apparent W-INT advantage does not decay in delta. Artifact; the attribution is void.
  - Too few qualifying orbits exist in W to reach 3m at the declared U. A feasibility outcome; the
    cell is skipped and recorded, and it is not evidence about structure.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-b5c439
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
