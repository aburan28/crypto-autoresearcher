# contract for H-BINSTD-7c3629: U-LABEL Stages 0-2 (trace-parity census +
# E/4E class census / closure-section cheap test).
#
# Source: IDEA-20261001-39014f under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Supersedes IDEA-20260922-1b16d7 (HOLD-K); consolidates 153a90 closure
# section (T5); ae8f0a is constructive arm (HOLD-X11).
#
# ZERO RUNS in this design packet. Stages 0-2 authorized for executor
# TASK-20261002-75f878. No AUXIN. Amazon Bedrock prohibited. NO break.
# NO attack. NO exponent. No Magma/Sage/WDSat as success path.
# =============================================================================
experiment:
  id: EXP-BINSTD-f58be3
  hypothesis_id: H-BINSTD-7c3629
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-39014f
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    U-LABEL: Stage-0 re-verify of D1-D6 / per_row_table / C1 / yield identity
    plus Stage-1 parity census and Stage-2 E/4E class census at n=19,
    a in {0,1}, l=10, m in {2,3}
  status: approved
  approved_by: DEC-20261002-0f09f5
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-0f09f5
    composing_decision: DEC-20261002-0f09f5
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-2 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0 re-verifies D1-D6, per_row_table, Proposition C1, and the yield
      identity (blocking). Stage 1 runs the parity census. Stage 2 runs the
      E/4E class census with purity scan and replica. No Magma/Sage. No AUXIN.
      No Bedrock. No ECC2K-130 solve. No WDSat as success path. T5 closure
      filing is not performed under this card.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Re-verify Stage-0 zero-compute content of IDEA-20261001-39014f; measure
    parity emptiness / yield-factor bands at n=19; measure depth-2 class
    balance and affine-purity on the cofactor-4 cell; deliver exactly one
    O-* label from H-BINSTD-7c3629.

  class: measurement
  class_note: >-
    Mechanism / heuristic-validation measurement of the corrected Semaev-
    window parity rule and the E/4E census (H-39014f-1, H-39014f-2). At most
    one bit at matched window size. Not an exponent-moving breakthrough.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond tiny Python). Recheck D1-D6 sketches;
        re-derive per_row_table against frozen FIPS/SEC texts; check C1
        statement scope; freeze preregistered-predictions.json and
        stage0/derivations-note.md. Setup: verify toy f irreducible with
        n-s>=11; Tr(t^j) for j<l; group orders via Frobenius-trace
        recurrence; primality of odd parts.
      - >-
        Stage 1. Parity census: cells a in {0,1} at n=19; windows V, V^(0),
        V^(1), RH, RS at l=10; 40 odd-order + 20 mirror targets; m in {2,3}
        exhaustive; record decompositions, F0/F1, parity patterns.
      - >-
        Stage 2. On a=0: beta_2 by D5 vs direct [r']P; histogram; W_0/W_2/WR
        censuses; exhaustive affine-hyperplane purity scan + random-label
        null; Z/(4r') replica; a=1 must report beta_2 undefined.
      - >-
        RESULTS.md with exactly one O-* label; memory beside time; raw
        manifests under runs/.
    excluded:
      - Any ECC2K-130 or deployed-n decomposition solve.
      - Filing Proposition C1 as a KN-OPEN closure (tripwire T5 —
        review-breakthrough, separate card).
      - Designing ae8f0a as a separate experiment under this card (arm /
        shared metric only).
      - Magma/Sage/cypari2/AUXIN/Bedrock/WDSat as success path.
      - Editing IDEA-20261001-39014f / IDEA-20260922-1b16d7 claim text or
        shared GOAL-ECDLP2M-001.yaml.

  inputs:
    idea: ledger/proposals/IDEA-20261001-39014f.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-7c3629.yaml
    decision: ledger/decisions/DEC-20261002-0f09f5.yaml
    ranking: ledger/decisions/DEC-20260929-7257b2.yaml
    superseded: ledger/proposals/IDEA-20260922-1b16d7.yaml
    consolidated_member: ledger/proposals/IDEA-20260922-153a90.yaml
    constructive_arm: ledger/proposals/IDEA-20260926-ae8f0a.yaml
    shared_metric_pointer: ledger/proposals/IDEA-20261001-5628bc.yaml
    fips_text: inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md
    sec2_text: inputs/SAFECURVES-20260825/specs/sec2-v2.txt
    reusable_impl_readonly:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/common.py

  controls:
    - name: random_hyperplane_RH
      description: >-
        Random nonzero linear form on V other than c_0; same size as a half;
        seed recorded. Separates alignment from span size.
    - name: random_subspace_RS
      description: >-
        Random 9-dimensional linear subspace of F_q; seed recorded.
    - name: mirror_targets
      description: >-
        Targets in E\2E; half roles must exchange exactly (P-4).
    - name: a1_beta2_undefined
      description: >-
        On a=1 cell, beta_2 must be reported undefined (root-choice
        dependent) on every point; a defined reading is O-ARTIFACT.
    - name: random_label_null_purity
      description: >-
        Exhaustive purity scan under a random label of equal marginal;
        class-pure beyond null → O-DEPTH2-AFFINE.
    - name: relabelled_Z4r_replica
      description: >-
        Z/(4 r') with residue-mod-4 labels and same-size subsets; curve/
        replica ratios in [0.5,2] (P-9).
    - name: even_n_symbolic
      description: >-
        Stage-0 symbolic check that at even n both halves are identical
        (baseline embedding).
    - name: memory_beside_time
      description: >-
        Peak RSS and window cardinalities stated beside every timing figure.

  independent_variables:
    - name: stage
      levels: [0_freeze_reverify, 1_parity_census, 2_e4e_census]
    - name: a_coeff
      levels: [0, 1]
    - name: window
      levels: [V, V0, V1, RH, RS, W0, W2, WR]
    - name: arity_m
      levels: [2, 3]
    - name: target_class
      levels: [odd_order, mirror_E_minus_2E, class2_in_2E]
    - name: arm
      levels: [curve, Z_4r_replica, random_label_null]

  metrics:
    primary:
      - name: parity_violations
        unit: count
        definition: Counted decompositions with sum of leg labels != target label.
      - name: complementary_half_yield_m3
        unit: mean_count
        definition: Mean decompositions per odd-order target from {c_0=1+Tr(a)} at m=3.
      - name: aligned_over_RH_yield_ratio
        unit: ratio
        definition: >-
          Mean decompositions (aligned half) / (RH), compared to
          2/(1+(1-2theta)^m) with measured theta.
      - name: depth2_histogram_balance_z
        unit: z_score
        definition: Binomial z of class-0 fraction vs 1/2 on aligned window (a=0).
      - name: max_affine_hyperplane_class_purity
        unit: fraction
        definition: Max class purity over all affine hyperplanes of V^(aligned).
    secondary:
      - name: F0_F1_point_counts
        unit: count
        definition: Points with pi=0 / pi=1 per window.
      - name: class_sum_violations
        unit: count
        definition: Leg Z/4 classes not summing to target class (a=0).
      - name: class0_over_parent_yield_ratio
        unit: ratio
        definition: Yield of W_0 over parent aligned window at m=2,3.
      - name: curve_over_generic_ratio
        unit: ratio
        definition: Curve metric / replica metric per Stage-2 quantity.
      - name: beta2_direct_agreement_rate
        unit: fraction
        definition: Fraction of aligned-window points where D5 bit matches [r']P=O.
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS of census processes.
      - name: wall_clock_seconds
        unit: seconds
        definition: Measured wall clock (reported; not a pre-committed claim).

  heuristic_under_test: H-39014f-1; H-39014f-2

  preregistered_prediction:
    quantity: >-
      Stage-0 D1-D6 / per_row_table / C1 / yield identity; Stage-1 P-1..P-4;
      Stage-2 P-5..P-9.
    formula: >-
      parity_violations=0; complementary_half_m3_odd=0 and m2 nonzero;
      aligned/RH ratio in [0.71,1.41]*2/(1+(1-2theta)^m) (≈[1.4,2.8] at
      theta=1/2); mirror roles exchange; class_sum_violations=0;
      beta2_direct_agreement_rate=1.0; histogram within 3 SD of 1/2;
      class0/parent in [0.5,2]*2^{1-m}; max purity not beyond random-label
      null; curve/replica in [0.5,2]; a=1 beta2 undefined.
    source: >-
      ledger/proposals/IDEA-20261001-39014f.yaml predictions P-1..P-9 and
      minimal_test; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy_plus_arithmetic
    justification: >-
      Stage 0 is deployed-parameter arithmetic (no curve run at crypto
      scale). Stages 1-2 are n=19 exhaustive censuses validating the
      combinatorial certificates and H-39014f-1/2. Transfer of the one-bit
      pricing to deployed n is labelled under H-39014f-1.
    correspondence: >-
      Exact emptiness (P-1,P-2,P-4) transfers without scale. Yield-factor
      ≈2 transfers under H-39014f-1. Depth-2 non-affinity is a toy
      measurement; ae8f0a inherits it as a design condition, not a proof.

  sample_size_justification: >-
    Stage 0 is exhaustive over the written identities and eleven-row table.
    Stage 1: 40 odd-order + 20 mirror targets at m=2,3 so a single missed
    emptiness is visible and the P-3 band is resolvable (expected
    decompositions per target at l=10 are ≫1 for m=2). Stage 2: full
    aligned-window histogram (512 points) and exhaustive 2*(2^9-1) affine
    hyperplanes; 1000-draw random-label null for purity comparison.

  tail_checks:
    - Stage-0 per_row_table mismatch vs FIPS/SEC → O-ARTIFACT; stop.
    - Any parity_violation → O-NEGATIVE-MECHANISM.
    - a=1 defined beta_2 → O-ARTIFACT.
    - Class-pure hyperplane beyond null → O-DEPTH2-AFFINE (finding, not void).
    - RH/RS with F0=0 or zero yield → O-ARTIFACT.

  replication:
    seeds: [2026100239]
    seed_base_note: >-
      Target draws, RH/RS/WR forms, and random-label null streams derive from
      seed_base; all recorded in run manifests before any census read.
    independent_instances: 2
    note: >-
      Two a-cells (0 and 1) on one field; Stage-2 replica is the second
      structure arm. Not expandable by leftover wall clock into a deployed
      decomposition or solver-cost cell under this card.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4.0
    maximum_memory_gb: 4
    maximum_runs: 6
    maximum_workers: 1
    note: >-
      Advisory only (docs/research-budget-policy.md). Scientific requirement
      is complete Stage-0 freeze + Stage-1/2 censuses with controls — not
      expandable into ECC2K-130 attack or T5 closure filing under this card.

  stopping_rules:
    - >-
      SR-1. Stage 0 freeze + setup checks pass before any Stage-1 RESULTS
      reading of yield ratios.
    - >-
      SR-2. If Stage 0 arithmetic / per_row / setup fails → O-ARTIFACT;
      do not claim O-POSITIVE.
    - >-
      SR-3. If parity_violation or odd-m complementary yield >0 →
      O-NEGATIVE-MECHANISM; stop promotion of the one-bit statement.
    - >-
      SR-4. If a=1 reports defined beta_2 or RH/RS artifact → O-ARTIFACT;
      void the affected arm.
    - >-
      SR-5. If P-8 fails (class-pure beyond null) → O-DEPTH2-AFFINE; report
      finding; do not interpret as one-bit pricing success.
    - >-
      SR-6. Advisory budget exhausted → O-IMPEDIMENT; never negative evidence.
    - >-
      SR-7. Do not file C1 as a closure or open ae8f0a as a separate EXP
      under this card.
    - >-
      SR-8. Do not claim IC beats rho or any deployed break.

  invalidation_rules:
    - Editing stage0/preregistered-predictions.json after Stage-0 freeze.
    - Reading or promoting yield ratios before Stage-0 freeze.
    - Claiming a break / exponent / IC-vs-rho win from this contract.
    - Provisioning Magma/Sage/cypari2/AUXIN/WDSat as the success path.
    - Using Amazon Bedrock.
    - Editing IDEA-20261001-39014f / IDEA-20260922-1b16d7 claim text or shared GOAL-ECDLP2M-001.yaml.
    - Overwriting a prior RUN-* directory.
    - Treating O-IMPEDIMENT or infra failure as mathematical evidence against H-39014f-*.
    - Filing Proposition C1 as a KN-OPEN closure under this card.

  success_criterion: >-
    ALL of: (1) Stage-0 freeze present with setup checks and per_row
    re-verify; (2) Stage-1 delivers P-1..P-4 metrics with RH/RS/mirror
    controls OR a named O-NEGATIVE-MECHANISM / O-ARTIFACT / O-IMPEDIMENT
    stop; (3) Stage-2 delivers P-5..P-9 with replica and purity null OR a
    named stop including O-DEPTH2-AFFINE; (4) RESULTS.md names exactly one
    O-* label from H-BINSTD-7c3629; (5) memory stated beside time; (6) no
    invalidation_rule fired. Does NOT claim any curve is broken and does
    NOT itself promote a KN-FIND or file T5 as a closure.

  falsification_criterion: >-
    ANY of: (F1) Stage-0 setup/per_row fail with a claimed O-POSITIVE;
    (F2) parity_violation or odd-m complementary yield with a claimed
    O-POSITIVE; (F3) a=1 defined beta_2 with a claimed Stage-2 success;
    (F4) Magma/Sage/AUXIN/Bedrock/WDSat used as success path; (F5)
    claiming IC beats rho or a deployed break. Budget exhaustion is
    O-IMPEDIMENT, not falsification of H-39014f-*.

  required_artifacts:
    - experiments/EXP-BINSTD-f58be3/implementation/
    - experiments/EXP-BINSTD-f58be3/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-f58be3/stage0/derivations-note.md
    - experiments/EXP-BINSTD-f58be3/stage0/per-row-reverify.md
    - experiments/EXP-BINSTD-f58be3/stage1/parity-census.json
    - experiments/EXP-BINSTD-f58be3/stage1/controls.json
    - experiments/EXP-BINSTD-f58be3/stage2/e4e-census.json
    - experiments/EXP-BINSTD-f58be3/stage2/purity-scan.json
    - experiments/EXP-BINSTD-f58be3/stage2/controls.json
    - experiments/EXP-BINSTD-f58be3/runs/
    - experiments/EXP-BINSTD-f58be3/RESULTS.md

  procedure:
    stages:
      - id: S0-FREEZE
        text: >-
          Write preregistered-predictions.json; re-verify D1-D6 sketches and
          per_row_table against FIPS/SEC; run even-n symbolic check; verify
          toy f / orders / primality; write derivations-note.md and
          per-row-reverify.md; ZERO Stage-1 census runs before freeze.
      - id: S1-PARITY
        text: >-
          Implement window builders, exhaustive m=2/m=3 census, RH/RS/mirror
          controls; run a=0 and a=1 cells; write stage1/parity-census.json
          and controls.json.
      - id: S2-E4E
        text: >-
          Implement beta_2 (D5), direct membership check, W_0/W_2/WR,
          exhaustive purity scan, random-label null, Z/(4r') replica; run
          a=0 census and a=1 undefined check; write stage2 artifacts.
      - id: S-SUM
        text: >-
          Write RESULTS.md with exactly one O-* label; preserve raw
          manifests under runs/; cite RUN IDs; no ledger status edits;
          do not file T5 closure or open ae8f0a EXP under this card.

  assigned_to: executor
  executor_handoff: TASK-20261002-75f878
  snapshot_task: TASK-20261002-a60ec0

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
