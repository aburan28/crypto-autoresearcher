experiment:
  id: EXP-HAWKL-b7fab1
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-79af89; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-79af89
  question_id: RQ-HAWK-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Classify the conjugation action rung by rung on a seven-rung representation ladder for HAWK-shaped
    public forms, locate the break point, and witness every lossiness claim with an exhibited collision
    or reconstruction against a matched unstructured null.
  objective: 'The one uncertainty a run reduces is which representation of a HAWK-shaped public quadratic
    form still carries information about which re-randomisation was applied. Concretely: (i) whether
    the R_n-module structure is recoverable from the Gram matrix by exact-integer search at ring degrees
    4 and 8, which decides whether the step from Gram matrix to R_n-quadratic form is a genuine projection
    or merely a change of coordinates - the entry''s most contentious claim and the one most likely
    to be refuted; (ii) at which rung the conjugation action by short unimodular matrices ceases to
    be faithful, measured directly as the number of distinct rung-images produced by all words up
    to a fixed length in a declared generating set, reported per rung, per arm and per generating
    set; (iii) whether the rung-by-rung behaviour differs at all between HAWK-shaped module instances
    and matched unstructured lattices of the same dimension and determinant, which is the only thing
    that licenses attributing any rung behaviour to module structure rather than to dimension and
    determinant. A run computes no solver, performs no lattice reduction, and evaluates no attack.
    The intended downstream use is a single sentence in any successor contract naming which rungs
    it is permitted to track and why.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for HAWK-SHAPED instances
      generated by one declared rule at ring degrees 4 and 8, under one or two declared short-unimodular
      generating sets and word lengths up to 3, the conjugation action is faithful at rungs 1 and
      2 with such-and-such stabiliser sizes and trivial from rung r upward, with the module arm differing
      from the matched unstructured null by such-and-such at rungs 1 and 2, and with the rung-2 reconstruction
      succeeding at such-and-such a rate. What does NOT follow: nothing about the cost of computing
      any rung from any other; nothing about whether any rung yields a distinguisher or an attack;
      nothing about HAWK, whose Round-3 specification is unread here and whose key generation is not
      used; nothing about ring degrees above 8; and no statement about HAWK''s security in either
      direction.'
  inputs:
    procedure: 'STAGE 0 (cost: a day of human reasoning, zero compute). Write the ladder with explicit
      maps and, for each rung, either a reconstruction argument or a claimed collision to be witnessed.
      Freeze the generating sets, word length, genus surrogate and instance rule in the specification.
      STAGE 1 (cost: minutes). Generate 100 HAWK-SHAPED instances and 100 matched unstructured nulls
      per ring degree by the declared rule, matched on dimension and determinant, in one invocation.
      STAGE 2 (cost: minutes to an hour). Rung-2 reconstruction: exact-integer search for a commuting
      R_n-action, run on BOTH arms, success rate recorded per arm. STAGE 3 (cost: minutes). Enumerate
      all generating words up to length 3; for each instance compute the rung-image at every rung;
      count distinct images per rung. STAGE 4 (cost: seconds). Classify each rung faithful / trivial
      / ill-defined and emit the break point per instance and per arm. STAGE 5 (cost: hours, budget-capped).
      Rung-4 collision search across the pooled instances using the declared genus surrogate; report
      collisions with witnesses or report the search size and no collisions. STAGE 6 (cost: minutes).
      Repeat STAGES 3 and 4 with the second generating set. STAGE 7 (cost: minutes). Emit through
      harness/runner.py with seeds, word lengths, per-rung counts, break points, reconstruction rates
      and collision witnesses.'
    instrument: Python 3 with exact integer and rational arithmetic; integer matrices as tuples of
      tuples; sympy for cyclotomic reduction, Smith normal form and modular local invariants used
      in the genus surrogate; numpy only for tabulation. Short-vector work, where needed for the theta
      prefix at rung 5, uses the same hand-written exact-integer enumeration as the matched-pair contract
      in this batch rather than an external lattice library; no computer-algebra system and specifically
      no Sage. Instance generation follows the HAWK-SHAPED declared-rule discipline inherited from
      H-HAWK-c7a551 and the EXP-HAWK-a2f34a instrument lineage. Runs, seeds, manifests through harness/runner.py.
    parameters: 'Ring degrees n in {4, 8} (dimensions 2n in {8, 16}); ring degree 16 attempted only
      for rungs 1 to 3 if budget permits. 100 module instances and 100 matched unstructured nulls
      per degree. Two declared short-unimodular generating sets of at most 6 elements each; all words
      up to length 3 (at most 259 words per set). Seven rungs, with rung 4 using a declared genus
      surrogate built from Smith normal form plus local invariants at primes 2, 3, 5. Rung 5 theta
      prefix truncated at the first 8 nonzero coefficients. Collision search budget: 10^6 symbol comparisons.
      Seeds declared in the specification.'
  controls:
  - 'Null arm: random integral lattice of matched dimension and determinant, no module structure,
    same ladder, same generating set, same invocation.'
  - 'Trivial-action sanity control: conjugation by the identity word must give exactly one rung-image
    at every rung; failure indicates a bug in the representation code, not a finding.'
  - 'Reconstruction control: run the rung-2 reconstruction search on the NULL lattices, where it should
    overwhelmingly fail; a high success rate there means the search is finding spurious actions.'
  - 'Collision control at rung 6: the determinant is matched across arms by construction, so rung
    6 must show total collision; observing anything else means the matching failed.'
  - 'Generating-set dependence control: repeat the faithful/trivial classification with a second declared
    generating set and report both, since stabiliser sizes are defined relative to the set.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a random integral lattice of the same dimension
    2n and the same determinant, generated without any R_n-module structure, put through the IDENTICAL
    ladder and the IDENTICAL faithful/trivial/ill-defined classification in the same invocation, with
    conjugation by the same generating set of short unimodular matrices. For the signal arm to mean
    anything, the null must show a break point at the same rung for the rungs that are structure-independent
    (3 and above, where triviality is forced by construction) and must show a MEASURABLY DIFFERENT
    stabiliser size at rungs 1 and 2, where module structure supplies extra stabilising elements.
    If the null shows identical stabiliser sizes at rungs 1 and 2, then the ladder is reading dimension
    and determinant rather than module structure, and every signal-arm number is void.'
  independent_variables:
  - rung index 0 through 6
  - arm (HAWK-shaped module versus matched unstructured null)
  - ring degree n in {4, 8}
  - generating set (primary versus secondary)
  - word length 1 through 3
  metrics:
    primary:
    - distinct rung-image count per rung per instance
    - break point rung index per instance and its distribution per arm
    - rung-2 reconstruction success rate per arm
    - rung-4 collision count with witnesses, and the search size that produced it
    secondary:
    - classification agreement rate between the two generating sets
    - rung-6 determinant-collision audit result
    - per-rung computation wall clock
    - number of instances on which any rung computation failed and why
  heuristic_under_test: null
  preregistered_prediction:
    quantity: b(arm, n), the modal break point rung index - the lowest rung at which the number of
      distinct rung-images over all words of length at most 3 equals 1 - reported per arm and per
      ring degree.
    formula: 'b = min{ k : |{ rung_k(U-star G U) : |U| <= 3 }| = 1 }. Predicted b = 3 for the module
      arm at both ring degrees, and b = 3 for the null arm as well (since triviality from rung 3 upward
      is forced by isometry-invariance), with the arms instead separated at rungs 1 and 2 by the stabiliser
      ratio s_2(module)/s_2(null) >= 2.0, where s_k is the number of words mapping to the same rung-k
      image as the identity word.'
    source: Pre-registered in the parent proposal IDEA-20260816-79af89 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Ring degrees 4 and 8, dimensions 8 and 16, chosen so that exact-integer reconstruction
      search, full word enumeration and genus-surrogate computation are all complete rather than sampled.
      These are far below deployed parameters and no transfer is assumed: the break point is reported
      per degree with no extrapolation, and the only cross-degree statement permitted is whether the
      value is stable across the two tested degrees. Instances are HAWK-SHAPED by declared rule per
      H-HAWK-c7a551, not HAWK, since RQ-HAWK-001 records that the Round-3 specification is unread
      by this program.'
    correspondence: null
  tail_checks:
  - Check instances where the rung-2 reconstruction finds MULTIPLE inequivalent commuting actions,
    which would mean the module structure is not unique and the ladder's rung 2 is ill-defined rather
    than merely lossy.
  - Check the identity-word case at every rung as a bug detector (must give exactly one image).
  - Check the null instances with the largest rung-1 stabilisers, which are the ones most likely to
    have accidental extra symmetry and to blur the arm comparison.
  - 'Check the extreme of the theta prefix: instances whose first 8 nonzero coefficients are identical
    but whose isometry classes differ, which are rung-5 collision witnesses and should be reported
    individually.'
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report if the rung-2 reconstruction succeeds on the null arm at a rate above 0.2, since
    the search is then not specific to module structure and no rung-2 verdict is available.
  - Halt the collision search at the declared budget and report the search size with the result; an
    exhausted budget is never reported as absence of collisions.
  - Halt if the identity-word sanity control fails at any rung.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run emits, per arm and per ring degree, a break-point distribution, per-rung
    distinct-image counts, the rung-2 reconstruction success rate on both arms, and either exhibited
    rung-4 and rung-5 collision witnesses or the search sizes that failed to find them - with the
    identity-word control passing and the classification stable across both generating sets.
  falsification_criterion:
  - The rung-2 reconstruction succeeds at a comparable rate on the unstructured null arm.
  - The module and null arms show indistinguishable stabiliser sizes at rungs 1 and 2.
  - The break point differs between the two generating sets on the same instances.
  - The rung-2 reconstruction fails on module instances, refuting the change-of-coordinates verdict.
  - Multiple inequivalent commuting R_n-actions are found on a substantial fraction of module instances,
    making rung 2 ill-defined.
  - The identity-word sanity control fails, invalidating the representation code.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-79af89
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The genus surrogate at rung 4 is not specified beyond its inputs; the Coordinator must approve
    a concrete surrogate and accept that a weak surrogate inflates collisions and a strong one may
    be uncomputable here.
  - The declared HAWK-SHAPED generation rule and the matched unstructured null rule must both be fixed
    by the Coordinator; the arms necessarily use different rules, and the Coordinator must decide
    whether that is an acceptable confound or whether a stronger matching (on genus rather than determinant)
    is required.
  - Whether 'ill-defined' should be a third classification label or should halt the run is not settled
    here.
  - Word length 3 is chosen for enumerability, not for any argued sufficiency; the Coordinator must
    decide whether a stabiliser measured at length 3 is worth recording at all.
