experiment:
  id: EXP-PFIVE-e26798
  hypothesis_id: H-PFIVE-6510c2
  goal_id: GOAL-PFDR-fd09e0
  version: 1
  title: Corrective completion of five-lead algebra scope and actual-point SAT validation
  status: review_required
  objective: Complete all78 originally specified algebra cells under an order-identical cache, and add
    actual-point SAT validation on all affine targets of two input-selected prime-order toy curves after
    retaining the interrupted original attempt.
  inputs:
    config: experiments/EXP-PFIVE-e26798/config.json
  input_bindings:
    pending: Source not yet committed; bind before freeze/admission.
  controls:
    aa:
      present: true
      comparison: C-AA
      not_applicable_reason: null
    positive:
      present: true
      arm: positive
      expected_detection: Known affine SAT control found; actual point success is observed only if encountered
        in all-target inventory.
      not_applicable_reason: null
    negative:
      present: true
      arm: negative
      null_population:
        description: All36 original support-matched algebraic null fixtures plus known point-SAT contradictions
          and damaged-certificate checks.
        generator: Unchanged original seed17 support-null construction and fixed per-curve negative controls.
        n: 38
        why_n: Exact finite original null/control coverage, no statistical population inference.
        matched_on:
        - field
        - polynomial support
        - variable count
        - proof checker
      not_applicable_reason: null
  independent_variables:
  - name: membership
    levels:
    - false
    - true
  metrics:
    primary:
    - id: subcells
      name: Retained raw subcells
      unit: integer
      kind: exact
      definition: Number of explicit raw records selected by the frozen per-arm aggregation; no missing
        rows imputed.
      source: Hash-bound raw-result curve_packages and independent checker stdout
      aggregation: per_row
      resolution: one
      uncertainty: none_exact
    - id: sat
      name: SAT classifications
      unit: integer
      kind: exact
      definition: Number of explicit SAT solver results.
      source: Hash-bound raw-result curve_packages and independent checker stdout
      aggregation: per_row
      resolution: one
      uncertainty: none_exact
    - id: unsat
      name: UNSAT classifications
      unit: integer
      kind: exact
      definition: Number of explicit UNSAT solver results.
      source: Hash-bound raw-result curve_packages and independent checker stdout
      aggregation: per_row
      resolution: one
      uncertainty: none_exact
    - id: actual_point_models
      name: Actual point witnesses
      unit: integer
      kind: exact
      definition: SAT results with independently verified P+Q=R lifts.
      source: Hash-bound raw-result curve_packages and independent checker stdout
      aggregation: per_row
      resolution: one
      uncertainty: none_exact
    secondary:
    - id: algebraic_work_subset
      name: Instrumented algebra arithmetic
      unit: integer
      kind: exact
      definition: Sum of emitted all_counted_field_ops; excludes omitted operations, no complete-work
        or speed claim.
      source: Raw algebra payload and frozen export aggregation
      aggregation: per_row
      resolution: one
      uncertainty: none_exact
    - id: matrix_entries
      name: Constructed matrix entries
      unit: integer
      kind: exact
      definition: Exact emitted row/column entry count for selected algebra arms.
      source: Raw algebra payload and frozen export aggregation
      aggregation: per_row
      resolution: one
      uncertainty: none_exact
    - id: unknown_branches
      name: Unresolved legal branches
      unit: integer
      kind: exact
      definition: Exact count of UNKNOWN branches across all selected backdoor arms; every branch is retained.
      source: Raw algebra payload and frozen export aggregation
      aggregation: per_row
      resolution: one
      uncertainty: none_exact
  scale_relevance:
    tier: toy
    justification: Exact finite fields and finite domains from frozen config; no extrapolation.
    correspondence: null
  replication:
    seeds:
    - 17
    independent_instances: 1
  budget:
    enforcement: advisory
    maximum_memory_gb: 4
    maximum_workers: 1
    maximum_runs: 1
  stopping_rules:
  - One additional serial native run after original terminal snapshot, containing all-target point SAT
    plus all78 unchanged algebra cells and durable per-cell outputs; no cell reduction or outcome-dependent
    replacement.
  - Memory4GiB and7200s process watchdog protect host; a cap is UNKNOWN/incomplete, not negative mathematics.
  - Any config, coverage, certificate, group witness or oracle mismatch invalidates affected exact assertion.
  invalidation_rules:
  - Wrong source/input hash, dropped exceptional branch, rejected positive control, non-reproducible exact
    output, corrupted certificate, or inconsistent finite-domain model set.
  success_criterion: 'C-POINT,C-DEGREE,C-BACKDOOR: exact complete declared scope, independently checked
    witnesses/certificates, every UNKNOWN and exception retained; no performance assertion.'
  falsification_criterion: A concrete invalid certificate/model falsifies the corresponding finite assertion.
    Missing/censored cells remain incomplete and require explicit scope retention.
  decision_impact:
    on_positive: Retain distinct finite observations and select follow-up only after independent review;
      no official support transition.
    on_negative: Record affected encoding or instrument counterexample with scope; repair under an additive
      amendment, or close only that tested variant after review.
  variable_ledger:
    independent:
    - name: membership
      levels:
      - false
      - true
    factors:
    - name: curve
      treatment: fixed
      value:
      - 17
      - 97
      how: Existing geometry.select_curve exact first generic nonsingular nonanomalous prime-order selector;
        no domain/outcome reselection.
    - name: targets
      treatment: fixed
      how: ALL affine x coordinates of selected public curve, sorted; target set independent of solver
        outcomes.
    - name: solver
      treatment: fixed
      how: Same original SAT/core source with degree2, row4096, six Boolean variables and all failed attempts
        retained.
    - name: replay
      treatment: fixed
      how: A/A repeats same source/parameters; deterministic results must agree.
    - name: monomial_order_cache
      treatment: fixed
      how: Exact order-equivalence checked over all masks0..255 before solving; caching changes no rowchoice,
        arithmetic, branches or original algebra fixture.
    - name: source_rank_integrity
      treatment: fixed
      how: Correct inherited source_rank stale-row enumeration in the additive independent checker only;
        inspect the current row at each pivot. Six small integrity regression matrices, run before scientific
        fixtures and during verification. Producer source-calibration rank algorithm and all original
        frozen files remain unchanged.
    comparisons:
    - id: C-POINT
      arms:
      - membership
      differs_in: []
      design: absolute
      threshold: Every completed membership result agrees with the complete finite group-pair oracle,
        and every SAT model has a checked actual lift. No SAT outcome is presumed.
    - id: C-AA
      arms:
      - residual
      - aa
      differs_in:
      - replay
      design: aa
    - id: C-DEGREE
      arms:
      - algebra_degree
      differs_in: []
      design: absolute
      threshold: All original declared matrix cells retained, certificates checked and complete/UNKNOWN
        classifications preserved.
    - id: C-BACKDOOR
      arms:
      - algebra_backdoor
      differs_in: []
      design: absolute
      threshold: All original cuts and four legal assignments percut retained; any UNKNOWN branch defeats
        that strong-backdoor assertion.
    crosses_map: false
  prediction_provenance:
  - prediction: POINT
    first_recorded_in: coordination/prime_sat_five_tests_20261029/sat_point_followup/design-note.md
    written_at: '2026-10-29'
    data_seen:
    - path: experiments/EXP-PFIVE-3ca920/runs/RUN-PFIVE-c8c614/sat.json
      measured: Original36 fixed cells on a2b3 had3 residual-only SAT models whose target x had no rational
        lift, and no curve-membership SAT model. They establish residual/certificate tests but no actual
        point-decomposition success.
    - path: experiments/EXP-PFIVE-3ca920/runs/RUN-PFIVE-c8c614/execution-receipt.json
      measured: Original attempt interrupted before all78 algebra cells completed; no algebra aggregate
        outcome interpreted.
    sample_status: partially_in_sample
    overlap: Same SAT/core instrument and overlapping fields; new selected prime-order curves and all-target
      domain.
    decisive_scope: Exact correctness on newly selected curves only; no comparative or statistical criterion.
  transfer_obligations: []
  required_artifacts:
  - manifest.yaml
  - raw-result.json
  - point.json
  - algebra.json
  - every_declared_per_cell_checkpoint
  - all_supervisor_logs_and_receipts
  - export.json
  assigned_to: executor
  approved_by: null
  frozen: false
  execution_authorized: false
  execution_plan:
    protocol_hashes: {}
    trial_plan: experiments/EXP-PFIVE-e26798/trial-plan.json
    queue: coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-449a28/dispatch_queue.json
  stage1_claims:
  - id: POINT
    text: On the frozen selected curves and all affine target x coordinates, membership SAT witnesses
      lift to actual group decompositions and complete target-wise classifications agree with the independent
      group-pair oracle.
    class: exact_computation
    decided_by:
    - C-POINT
    if_supported: Record finite correctness coverage; no asymptotic or performance inference.
    if_not_supported: Retain exact counterexample or missing coverage, with no modification of original
      run.
  - id: ALGEBRA
    text: The cached-order implementation executes exactly the original78 finite algebra fixtures,390
      matrix arms,390 backdoor arms and1560 branches with independently checked certificates, retaining
      every UNKNOWN and source-calibration matrix.
    class: exact_computation
    decided_by:
    - C-DEGREE
    - C-BACKDOOR
    if_supported: Record finite complete instrument observations; no speed comparison or intrinsic regularity
      claim.
    if_not_supported: Retain invalid/censored fixture with exact scope; do not shrink the original coverage.
  - id: NO-PERFORMANCE
    text: No low-regularity, complete degree-D PC closure, cryptographic-scale attack, or performance
      improvement is claimed.
    class: out_of_scope
    decided_by: []
  checker_correction:
    change: Correct inherited source_rank stale-row enumeration in the additive independent checker only;
      inspect the current row at each pivot.
    witness: Over F5, [[1,1],[1,0]] has rank2; the original checker incorrectly returned1.
    scope: Six small integrity regression matrices, run before scientific fixtures and during verification.
      Producer source-calibration rank algorithm and all original frozen files remain unchanged.
    data_seen: Static code review and six instrument regression checks only; no corrective scientific
      fixture was executed.
