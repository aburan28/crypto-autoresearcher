experiment:
  id: EXP-MCEGOP-c82479
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-576d70; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-576d70
  question_id: RQ-MCE-e65b3c
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Symbolic compilation of five committed passages into a four-valued applicability predicate
    over arXiv:2304.14757, with a modality-scrambled null, a double-blind normalisation control and
    a lint pass over committed GOAL-MCE-001 deliverable text
  objective: 'This contract reduces one uncertainty: whether the program''s twice-corrected reading
    of a single external boundary has determinate, mechanically checkable content, or whether it is
    prose that will be re-omitted. Stated in parts: (i) DETERMINACY -- whether the five committed
    passages normalise into a conjunct structure that two independent readings agree on, and whether
    the resulting predicate takes more than two distinct values over the parameter tuples this repository
    actually holds. If the two normalisations disagree, the correction is not determinate enough to
    mechanise and that is the finding. (ii) LOAD-BEARING MODALITY -- whether the modal fields that
    RQ-MCE-f8fca0 added, and that RQ-MCE-3f7c02 lacked, change any downstream verdict. The scrambled
    null answers this directly: if permuting tense, proof status and conjecture status across conjuncts
    leaves the truth table fixed, then the completion changed no applicability verdict and the three-valued
    design is decoration. That is a clean, cheap, publishable negative. (iii) PROPAGATION IN THE COMMITTED
    CORPUS -- how many already-committed GOAL-MCE-001 sentences assert a two-valued reading, and in
    which direction they err. DEC-20260808-a67816 D-5 records the direction as toward dismissal; the
    count is unmeasured. A run produces the count, the direction, and the coverage fraction of the
    lint patterns, so that a low count can be distinguished from poor pattern coverage. No stage of
    this contract fetches, re-reads or interprets any external text, and no output of it is evidence
    about any code family, any parameter set, or any cryptosystem.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support exactly this: that the five named
      committed passages, normalised under a frozen and committed procedure, induce the published
      truth table over the named parameter tuples; that the truth table has the measured sensitivity
      to modal-field permutation; that the two blind normalisations agreed or disagreed on each conjunct
      field at the measured rate; and that the committed deliverable text contains the measured number
      of lint mismatches in the measured direction. What does NOT follow: nothing about whether arXiv:2304.14757''s
      Goppa exclusion holds or falls; nothing about whether any attack applies to binary Goppa codes
      at any parameters; nothing about Classic McEliece''s security; no statement about what any paper
      contains beyond the strings this repository already committed; and no promotion of a documentation
      defect into a mathematical claim in either direction.'
  inputs:
    procedure: 'STAGE 0 (cost: 1 hour, human). Freeze and commit the normalisation procedure, the
      lattice, the lint patterns and the scramble seed BEFORE reading anything for the second time.
      STAGE 1 (cost: 1 hour, human, zero compute). Extract the five passages verbatim from RQ-MCE-3f7c02
      and RQ-MCE-f8fca0 into a clause file, each string carrying its record id and field path. STAGE
      2 (cost: minutes, automated). Run the exact-substring provenance check of every clause string
      against the committed records; any failure aborts the run. STAGE 3 (cost: 2 hours, human, two
      independent passes). Normalise conjuncts into (parameter predicate, tense, proof_status, conjecture_status,
      restricted_phase), blind to each other, then compare and record per-field agreement without
      reconciling. STAGE 4 (cost: minutes). Implement the four-element lattice and the meet rule with
      undetermined absorbing; evaluate over every committed parameter tuple; emit the truth table.
      STAGE 5 (cost: seconds). Run 1000 modality scrambles under the frozen seed; count cells moved.
      STAGE 6 (cost: minutes). Run the conjecture_status ablation. STAGE 7 (cost: 30 minutes). Lint
      committed GOAL-MCE-001 deliverable text; record mismatch count, direction and pattern coverage.
      STAGE 8 (cost: minutes). Emit artifacts and hashes. Total compute is negligible; the cost is
      entirely human reading time, roughly half a day.'
    instrument: 'Python 3.11 standard library only: a clause file in JSON, a sixty-to-hundred-line
      predicate module implementing a four-element lattice, difflib and plain string containment for
      the provenance check, re for the lint patterns, random.Random(frozen seed) for the scramble.
      Reuses the linter harness pattern of tools/claim_class_audit.py rather than introducing a second
      scanning mechanism, and runs through harness/runner.py so the manifest records the resolved
      inference block. No network access, no PDF fetch, no external library, no Sage.'
    parameters: 'Five source passages: the verbatim exclusion sentence and the Table 1 restriction
      row from RQ-MCE-3f7c02.corrected_boundary, and Q-1 through Q-4 from RQ-MCE-f8fca0.the_sources_own_qualification.passages.
      Parameter tuples evaluated: every (q, m, n, k, r, family) tuple committed in RQ-MCE-b38a8b''s
      toy grid (m in {4,5,6}, t in {2,3,4}, n <= 64), the cells of EXP-MCE-3ffdf9, and the five parameter
      sets referenced by EXP-MCE-350abf, giving on the order of 50 tuples. Scrambles: 1000, fixed
      seed. Normalisation passes: exactly 2, independent. Lint corpus: all committed markdown and
      YAML under coordination/goals/GOAL-MCE-001/ plus the four MCE research-question records.'
  controls:
  - Modality-scrambled clause set, 1000 permutations under a fixed seed, run in the same invocation
    as the signal arm.
  - 'Provenance control: every string in the clause file must match a substring of a committed record
    by exact string comparison, checked automatically; any string that does not match is a fabrication
    and fails the build.'
  - 'Two-valued ablation: evaluate the same truth table with the conjecture_status field deleted,
    to isolate how much of the three-valued behaviour comes from that one field.'
  - 'Blind re-normalisation: a second pass normalises the same five passages into conjunct tuples
    without seeing the first pass, and the two normalisations are compared, since normalisation is
    where a human reading could smuggle in a verdict.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The identical compiler is run, in the same invocation, against a SCRAMBLED
    clause set: the same conjuncts from the same records, but with the modal fields (tense, proof_status,
    conjecture_status, restricted_phase) permuted uniformly at random across conjuncts under a fixed
    seed, repeated 1000 times. The null must show that the truth table MOVES -- that for at least
    a stated fraction of scrambles, at least one parameter tuple changes its predicate value. If the
    truth table is invariant under modality permutation, then the modal fields are not load-bearing,
    the three-valued construction is decoration over a two-valued fact, and this proposal is refuted
    by its own control at zero compute cost. That outcome would be reported as a measured negative
    with its scramble count, not suppressed, and it is a genuinely usable obstruction: it would mean
    the correction in RQ-MCE-f8fca0 changes no downstream applicability verdict, which is itself a
    fact worth having on the record.'
  independent_variables:
  - clause set (true | modality-scrambled | conjecture_status-ablated)
  - parameter tuple
  - normalisation pass (A | B)
  metrics:
    primary:
    - number of distinct predicate values over committed tuples
    - fraction of scrambles moving at least one truth-table cell
    - per-field agreement rate between the two blind normalisations
    - lint mismatch count and direction
    secondary:
    - lint pattern coverage fraction
    - number of tuples returning undetermined
    - effect of the conjecture_status ablation on the value count
    - count of provenance-check failures, required zero
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The number of distinct predicate values over committed tuples, and the scramble sensitivity
      of the truth table.
    formula: 'V = |{APPLIES(C_true, p) : p in committed tuples}| where APPLIES is the meet over conjuncts
      in the lattice undetermined < {excluded_but_conjectured_to_fall, excluded_by_family} < applies,
      with undetermined absorbing. Pre-registered: V >= 3. Scramble sensitivity S = (1/1000) * |{sigma
      : exists p with APPLIES(sigma(C), p) != APPLIES(C_true, p)}|. Pre-registered: S >= 0.1, and
      S < 0.1 refutes the three-valued design.'
    source: Pre-registered in the parent proposal IDEA-20260816-576d70 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Scale is not a compute parameter here: the artifact is symbolic and evaluated
      over roughly 50 committed parameter tuples and five source passages. There is no transfer assumption
      because nothing is extrapolated -- the predicate returns undetermined outside its five passages
      by construction, and that is the whole point of the design. The ''toy'' tier records that the
      object is small and closed over committed repository content, not that a larger version is pending.'
    correspondence: null
  tail_checks:
  - Tuples that return 'applies' must be zero; any nonzero count is a compiler bug and is investigated
    before anything else.
  - Scrambles that move EVERY cell are as suspicious as scrambles that move none, and are inspected
    for a normalisation that made modality the only conjunct.
  - The single tuple most distant from the toy grid is checked by hand against the raw passages, since
    the automated path could agree with itself while being wrong.
  - Any conjunct on which the two blind normalisations disagree is reported verbatim, both readings,
    without reconciliation.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort immediately on any provenance-check failure and report the offending string.
  - Do not reconcile the two blind normalisations; if they disagree on more than one of five passages,
    stop and report indeterminacy rather than producing a truth table.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The clause file passes provenance on all five passages, the two blind normalisations
    agree on at least four of five, the predicate takes at least three distinct values over committed
    tuples, and the scramble sensitivity and lint mismatch count and direction are all reported with
    their coverage fractions.
  falsification_criterion:
  - Predicate takes fewer than three values over committed tuples.
  - Scramble sensitivity below 0.1.
  - Any provenance-check failure.
  - Blind normalisations disagreeing on more than one of the five passages.
  - Any tuple returning 'applies'.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-576d70
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact normalisation schema -- which conjuncts a passage decomposes into, and whether the Table
    1 restriction row is one conjunct or three -- must be frozen by the Coordinator before any reading,
    since it is where a verdict could be smuggled in.
  - Whether the lint pass may report on committed text authored by prior tasks without that being
    read as a review of those tasks needs a Coordinator ruling; the intent is a documentation metric,
    not a performance judgement.
  - The lattice ordering is asserted, not derived. If the Coordinator prefers a different propagation
    rule, the scramble null must be re-run under it, because sensitivity is rule-dependent.
