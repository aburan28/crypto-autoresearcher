# EXP-CERTBIN-c97c23
# Four-target union rare-event linearization control vs multi-target rho.
# Approved by DEC-20261004-2be060. Stages 0-1 only. No ECDLP solve.
experiment:
  id: EXP-CERTBIN-c97c23
  hypothesis_id: H-CERTBIN-a916e0
  source_idea: IDEA-20260930-14c753
  question_id: RQ-CERTBIN-836ce2
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Four-target union rare-event linearization control vs charged
    multi-target rho (E0 / F2^19 toy)
  status: analyzed
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-2be060
  frozen: true
  frozen_at: '2026-10-04'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized under DEC-20261004-2be060 and executor
    TASK-20261004-138c80. Stage 0 freezes archived rare-event arithmetic
    and toy protocol parameters. Stage 1 enumerates two toy images on the
    Koblitz n=19 prime-subgroup labels (r=130873), scores union
    frequencies, charges half-fold T_test, and emits exactly one of
    O-RARE / O-BATCH / O-ARTIFACT / O-IMPEDIMENT. Stage 2+ not authorized.
    No Magma/Sage/AUXIN/Bedrock. No ECDLP solve.
  class: control
  claim_tier: measurement
  objective: >-
    Freeze the archived four-target rare-event identity from
    IDEA-20260930-14c753, then at the E0/F2^19 toy (n=19, m=3, r=130873)
    measure whether union frequency matches 1-(1-p)^L and whether the
    charged half-fold membership addition count exceeds the multi-target
    Frobenius-rho iteration estimate at both p≈1/50 and p≈1/2 cells.

  inputs:
    proposal: ledger/proposals/IDEA-20260930-14c753.yaml
    hypothesis: ledger/hypotheses/H-CERTBIN-a916e0.yaml
    question: ledger/questions/RQ-CERTBIN-836ce2.yaml
    half_fold_predecessor: experiments/EXP-CERTBIN-ec9d83/specification.yaml
    half_fold_idea: ledger/proposals/IDEA-20260930-77ec1c.yaml
    koblitz_n19_order_ref: experiments/EXP-CERTBIN-ad3e87/specification.yaml
    trial_plan: experiments/EXP-CERTBIN-c97c23/trial-plan-v1.json
    trial_plan_twin: experiments/EXP-CERTBIN-c97c23/trial-plan.json
    n: 19
    m: 3
    r: 130873
    group_order_full: 523492
    k_rule: floor(m/2)
    L_values: [4, 32]
    batches_L4: 100
    batches_L32: 20
    p_targets:
      - {id: p_sparse, target_p: 0.02, note: about 1/50}
      - {id: p_half, target_p: 0.5, note: about 1/2 nearby-object control}
    max_image_enumerations: 10000000
    archived_ceilings:
      - id: audit-m83-a
        one_target: 2.5453522044710297e-18
        four_target: 1.0181408817884119e-17
      - id: audit-m83-b
        one_target: 8.564834857521739e-18
        four_target: 3.4259339430086955e-17
    seeds:
      stage0: 2026100414
      stage1: 2026100415
    rho_formula: sqrt(pi * r / (4 * n)) * sqrt(L)
    t_test_formula: >-
      For m=3, k=1: complementary half-fold enumerates C(B+1,2) =
      B*(B+1)/2 additions per membership decision (misses charged fully).
    implementation:
      - experiments/EXP-CERTBIN-c97c23/implementation/run.py
      - experiments/EXP-CERTBIN-c97c23/implementation/check.py
      - experiments/EXP-CERTBIN-c97c23/implementation/union_math.py
      - experiments/EXP-CERTBIN-c97c23/implementation/toy_image.py

  controls:
    - >-
      Stage 0 archived rare-event identity: 4 * one_target equals
      four_target to printed digits at both audit rows; 1-(1-p)^4 matches
      the rare-event form before any toy sample is read.
    - >-
      Nearby-object p≈1/2 cell where L*p exceeds 1 and "union = L *
      ceiling" is known false. Measured union near L*p is O-ARTIFACT.
    - >-
      Uncharged T_test = 1 column, reported and labelled uncharged; not
      the headline ratio.
    - >-
      Full-image check: if a cell's image equals the subgroup, record
      union frequency 1 with relation-rank 0 (coverage is not a log).
    - >-
      Independent uniform target draws (no shared walk / distinguished
      point reuse). Dependence voids the union law.
    - Prime-subgroup order r = 130873, not the full group order 4*r.
    - No Magma, Sage, AUXIN, Amazon Bedrock, SAT, MITM, or ECDLP solve.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_toy_union]
    - name: cell_id
      levels: [p_sparse, p_half]
    - name: L
      levels: [4, 32]
    - name: t_test_mode
      levels: [charged_half_fold, uncharged_unit]

  metrics:
    primary:
      - archived_identity_ok
      - union_frequency_L4
      - union_prediction_L4
      - union_abs_deviation_L4
      - linearization_error_p_half
      - charged_additions
      - rho_iteration_estimate
      - charged_ratio
      - outcome
    secondary:
      - p_hat
      - B_selected
      - image_size
      - C_over_r
      - union_frequency_L32
      - empty_batch_count_L4
      - uncharged_ratio
      - lossy_witness_pair_found
      - peak_rss_bytes
      - enumeration_additions

  heuristic_under_test: HEUR-CERTBIN-a916e0-H1
  preregistered_prediction:
    quantity: >-
      Union frequency ≈ 1-(1-p_hat)^L at both cells; charged_ratio > 1 at
      both cells; linearization error at p≈1/2 is >= 1 for L=4.
    formula: >-
      P_union = 1-(1-p)^L; charged_additions >= (L/p) * C(B+1,2);
      rho = sqrt(pi*r/(4*n))*sqrt(L); predicted outcome O-RARE.
    source: >-
      IDEA-20260930-14c753 predictions and heuristic H1, read 2026-10-04.
      Pre-registered before any Stage-1 sample.

  scale_relevance:
    tier: toy
    justification: >-
      Enumerable m=3 sumset on the Koblitz n=19 prime-subgroup labels
      (r=130873), at most 10^7 image enumerations. Combinatorial
      rare-event identity transfers; charged-ratio outcome does not
      transfer to m=83.
    correspondence: null

  tail_checks:
    - >-
      At p≈1/50, empty-batch count among 100 L=4 batches versus binomial
      prediction (1-p)^4; relative error above 50 percent is a tail failure
      (O-ARTIFACT after one redraw).
    - Degree-83 / n>=131 wall ratios are out of scope and must not be quoted.

  seeds_and_replication:
    seeds: [2026100414, 2026100415]
    independent_instances: 2
    replication_note: >-
      Stage 0 is deterministic arithmetic. Stage 1 uses seed 2026100415
      for image labeling and target draws. The two cells are the two
      independent instances inside Stage 1.

  replication:
    seeds: [2026100414, 2026100415]
    independent_instances: 2
    replication_note: Stage 0 freeze + Stage 1 two-cell toy census.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 2
    maximum_workers: 1

  stopping_rules:
    - Stop after Stage 0 freeze and Stage 1 two-cell measurement.
    - A crash or missing freeze table is O-IMPEDIMENT, not a negative result.
    - Do not open Stage 2, allocate a degree-83 table, or solve ECDLP.
    - Do not quote an n=53 wall ratio.

  invalidation_rules:
    - Magma, Sage, AUXIN, or Amazon Bedrock is selected.
    - A SAT/MITM/Gröbner solver is invoked.
    - An ECDLP instance is solved or a break/exponent claim is written.
    - Targets are drawn dependently (shared walk).
    - The group order 4*r is used as the denominator instead of r.
    - The uncharged T_test=1 column is presented as the headline ratio.
    - n>=131 is treated as a cryptographic solve.
    - Shared GOAL-ECDLP2M-001.yaml is edited.

  success_criterion: >-
    Stage 0 archived_identity_ok is true, and Stage 1 outcome is O-RARE:
    at both cells |union_freq_L4 - (1-(1-p_hat)^4)| < 0.05, at p_half
    linearization_error >= 1, and charged_ratio > 1 at both cells.

  falsification_criterion: >-
    Stage 1 outcome is O-BATCH (charged_ratio < 1 at either cell) or
    O-ARTIFACT (p_half measured union within 0.1 of L*p, or union
    deviation > 0.15 after one redraw, or Stage 0 identity fails).

  required_artifacts:
    - experiments/EXP-CERTBIN-c97c23/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CERTBIN-c97c23/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CERTBIN-c97c23/runs/<RUN-ID>/command.txt
    - experiments/EXP-CERTBIN-c97c23/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CERTBIN-c97c23/runs/<RUN-ID>/stderr.log

  assigned_to: executor
  amazon_bedrock: NOT SELECTED
  out_of_scope:
    - Stage 2+ SAT, MITM, Gröbner, or any solver
    - Shared distinguished-point multi-target rho (KR-RHO-46c2c6)
    - IDEA-20260926-20ba8f relation-matrix amortization regime
    - Degree-83 half-fold table allocation
    - Any ECDLP solve, break, exponent, or n>=131 security verdict
    - Magma, Sage, AUXIN, Amazon Bedrock
    - Editing ledger/goals/GOAL-ECDLP2M-001.yaml
    - Editing IDEA-20260930-14c753 claim text
    - Presenting the uncharged T_test=1 column as a complexity claim
