# TASK-20261002-0c453c. No AUXIN. Amazon Bedrock prohibited. NO break.
# NO attack. NO exponent. Optional S=Z/2xZ/2 stratum is report-only.
# =============================================================================
experiment:
  id: EXP-CERTBIN-ef3911
  hypothesis_id: H-CERTBIN-151be9
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260926-ae8f0a
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    HOLD-X11: Stage-0 Z/4 sum + HOLD-O reading freeze; Stage-1 pi_4
    homomorphism / coset-balance (H1); Stage-2 by-coset share census
    (pi_4 vs pi_2 vs random label vs cofactor-1 null vs generic-group)
  status: approved
  approved_by: DEC-20261002-c9afe0
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-c9afe0
    composing_decision: DEC-20261002-c9afe0
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-2 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0 is zero-compute authoring of the Z/4 sum constraint, corrected
      HOLD-O structural reading, H1 band, and preregistered predictions.
      Stage 1 verifies homomorphism/refinement and coset balance of V.
      Stage 2 measures by-coset shares across arms and decides exactly one
      O-* label. No Magma/Sage. No AUXIN. No Bedrock. No ECC2K-130 solve.
      No m>=3 under this card. No T5 closure filing under this card.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Enumerate the E->E/2E->E/4E 2-Sylow chain on a cofactor-4 toy; measure
    whether the level-2 leg label pi_4 removes a by-coset unsatisfiable
    share beyond pi_2 (E-COSET) or is subsumed (E-SUBSUMED); confirm
    cofactor-1 null and random-label no-ops; measure point-halving cost;
    decide exactly one O-* label from H-CERTBIN-151be9.

  class: measurement
  class_note: >-
    Attempt-mix / instrument experiment with Stage-0 arithmetic freeze and
    Stages 1-2 heuristic-validation of H1 plus the E-COSET vs E-SUBSUMED
    decision. Not an exponent-moving breakthrough experiment; no ECDLP
    attack table produced. At most 2 bits disclosed as immaterial vs rho.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond tiny Python). Write
        stage0/preregistered-predictions.json and stage0/derivations-note.md
        freezing: Z/4 sum constraint; corrected HOLD-O structural reading;
        H1 coset-balance band; predicted phi_2/phi_4 bands; seed
        20261002ae; pointer to U-LABEL lead IDEA-20261001-39014f
        (DEC-20260929-7257b2) and 5628bc H1 metric. Must freeze before
        Stage 1.
      - >-
        Stage 1. Implement pi_2 and pi_4 (trace + one halving) on
        curve.py wrappers under this write_scope; verify homomorphism and
        pi_4 mod 2 = pi_2 on 10^3 sampled points; label all of V for
        l in {6,7,8,9} and record coset counts vs |V|/4 (H1); write
        stage1/*.json.
      - >-
        Stage 2. 200 odd-order targets; classify unsat attempts as by-coset
        (pi_4), by-parity-only (pi_2), or by-non-target; arms: pi_4 filter,
        pi_2-only filter, random two-bit label, cofactor-1 null, relabelled
        Z/4 x Z/l generic-group control; completeness check (0 relations
        lost); measure halving cost/success; write stage2/*.json;
        RESULTS.md with exactly one O-* label.
      - Memory (peak RSS) stated beside every time figure.
    excluded:
      - Magma/Sage/cypari2/AUXIN provisioning as the success path.
      - Amazon Bedrock.
      - Editing IDEA-20260926-ae8f0a / 39014f / 5628bc / e3048d claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Claiming break / exponent / ECC2K-130 attack from this contract.
      - Filing T5 closure or promoting a KN-FIND under this card.
      - m>=3 attempts under this card.
      - Treating infra failure as mathematical evidence against H1/E-COSET.
      - Overwriting experiments/EXP-CERTBIN-e94b27/impl/ in place without a
        documented copy/wrapper under this experiment's write_scope.
      - Opening IDEA-20260926-89886c / which-algebra NA-2 under this card.

  inputs:
    proposal: ledger/proposals/IDEA-20260926-ae8f0a.yaml
    hypothesis: ledger/hypotheses/H-CERTBIN-151be9.yaml
    question: ledger/questions/RQ-CERTBIN-836ce2.yaml
    hold_decision: ledger/decisions/DEC-20260928-63addc.yaml
    pool_ranking: ledger/decisions/DEC-20260929-7257b2.yaml
    ulabel_lead: ledger/proposals/IDEA-20261001-39014f.yaml
    ulabel_exp_note: >-
      EXP-BINSTD-f58be3 (IDEA-20261001-39014f U-LABEL) designed on
      cursor/design-binstd-ulabel-parity-ed0c / PR #1572; not yet on
      origin/main at this design tip. Cite the proposal + DEC-20260929-7257b2
      U-LABEL disposition as the binding predecessor; do not require the
      unmerged specification path as a launch input.
    shared_metric_pointer: ledger/proposals/IDEA-20261001-5628bc.yaml
    hold_o_source: ledger/proposals/IDEA-20260922-e3048d.yaml
    depth_pricing: ledger/proposals/IDEA-20260922-153a90.yaml
    pi2_source: ledger/proposals/IDEA-20260913-cedd2f.yaml
    field_instrument: experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
    curve_instrument: experiments/EXP-CERTBIN-e94b27/impl/curve.py
    analysis_readme: analysis/binstd-idea-review-20260926/README.md

  controls:
    - name: cofactor_1_null
      description: >-
        Cofactor-1 Koblitz-shaped curve over the same field; filter must be
        a no-op (by-coset share exactly 0). Failure → O-ARTIFACT.
    - name: random_two_bit_label
      description: >-
        Random two-bit leg label of matched marginal; share within CP95 of
        0 (no group-aligned removal).
    - name: generic_group_control
      description: >-
        Relabelled abstract Z/4 x Z/l group with random point labels; by-coset
        share must match the curve within CP95 (group-structure claim).
    - name: completeness_soundness
      description: >-
        Every counted on-curve relation survives both filters (0 lost);
        rejected attempts verified unsatisfiable by the oracle.
    - name: homomorphism_refinement
      description: >-
        Stage-1 gate: pi_4(P+Q)=pi_4(P)+pi_4(Q) and pi_4 mod 2 = pi_2 on
        10^3 samples before any share is read.
    - name: optional_klein_stratum
      description: >-
        If a cofactor-4 curve with S=Z/2xZ/2 is constructible, record as a
        separate stratum testing |S|-only prediction; not required for the
        primary O-* decision.

  independent_variables:
    - name: arm
      levels: [pi4_filter, pi2_only, random_twobit, cofactor1_null, generic_group]
    - name: field_degree
      levels: [17]
    - name: cofactor
      levels: [4, 1]
    - name: subspace_dim_l
      levels: [6, 7, 8, 9]
      note: Stage-1 H1 census; Stage-2 primary uses l=9.
    - name: arity_m
      levels: [2]

  primary_metrics:
    - name: phi_4
      definition: By-coset unsatisfiable share removed by pi_4 on h=4 cell (fraction, CP95).
    - name: phi_2
      definition: By-coset unsatisfiable share removed by pi_2 alone on h=4 cell (fraction, CP95).
    - name: null_share
      definition: By-coset share on cofactor-1 null (must be 0).
    - name: outcome_label
      definition: Exactly one of O-ECOSET / O-ESUBSUMED / O-ARTIFACT / O-IMPEDIMENT.

  secondary_metrics:
    - name: halving_cost_per_leg
      definition: Field operations and success rate for the level-2 halving step.
    - name: relations_lost
      definition: Count of on-curve relations rejected by the filter (must be 0).
    - name: h1_max_deviation
      definition: Max |coset_count - |V|/4| over the four Z/4 cosets at each l.
    - name: peak_rss_bytes
      definition: Peak RSS beside every timed stage.

  seeds_and_replication:
    master_seed: 20261002ae
    target_count: 200
    homomorphism_sample_size: 1000
    replication: >-
      Single primary replication under this card; seed and instance-set rule
      frozen in stage0/preregistered-predictions.json. A second seed is
      out of scope unless O-ARTIFACT triggers a repair amendment.

  budget:
    wall_clock_seconds: 14400
    memory_gb: 4
    maximum_runs: 3
    cpu_note: >-
      Advisory. Estimate 1-2 CPU-hours of group arithmetic across arms; no
      closures. Freeze scientific sample counts; do not expand to m>=3 or
      deployed curves with leftover wall clock.

  stopping_rules:
    - Stage 0 must freeze predictions before any Stage-1 metric is read.
    - Homomorphism Stage-1 gate failure → O-ARTIFACT; do not read shares.
    - Completeness failure (relations_lost > 0) → O-ARTIFACT; stop.
    - Null share nonzero → O-ARTIFACT; stop.
    - After Stage 2, write exactly one O-* label and stop.
    - Budget abort / crash → O-IMPEDIMENT; never negative math evidence.
    - Do not open m>=3, n=131, or T5 closure under leftover budget.

  invalidation_rules:
    - Editing preregistered predictions after Stage-0 freeze invalidates shares.
    - Counting failed halvings as refutations invalidates phi_*.
    - Mixing cofactor-1 and cofactor-4 targets in one arm voids that arm.
    - Using a closure engine as the satisfiability oracle voids the primary metric.
    - Infra timeouts are O-IMPEDIMENT, not E-SUBSUMED.

  success_criterion: >-
    Stage 0 artifacts frozen; Stage-1 homomorphism gate executed (or
    recorded O-ARTIFACT); Stage 2 produces phi_2/phi_4/null/random/generic
    tables with completeness check; RESULTS.md names exactly one O-* label
    from H-CERTBIN-151be9 with cited artifacts and CP95 intervals; memory
    reported beside time. E-COSET and E-SUBSUMED are both successful
    scientific executions.

  falsification_criterion: >-
    Any of: pi_4 not a homomorphism or not refining pi_2; any on-curve
    relation lost; cofactor-1 null share nonzero; generic-group share
    disagreeing beyond CP95; H1 coset imbalance beyond Stage-0 band while
    still claiming E-COSET; TW/T5/KN-FIND filed under this card; or a claim
    of break/exponent under this card.

  required_artifacts:
    - experiments/EXP-CERTBIN-ef3911/stage0/preregistered-predictions.json
    - experiments/EXP-CERTBIN-ef3911/stage0/derivations-note.md
    - experiments/EXP-CERTBIN-ef3911/stage1/
    - experiments/EXP-CERTBIN-ef3911/stage2/
    - experiments/EXP-CERTBIN-ef3911/RESULTS.md
    - experiments/EXP-CERTBIN-ef3911/runs/<RUN-CERTBIN-*>/

  pre_registered_prediction: >-
    Under H1, among coset-relevant attempts on the h=4 cell, predicted
    by-coset share ~3/4 at pi_4 and ~1/2 at pi_2; exactly 0 on the
    cofactor-1 null; random two-bit label near 0. Honest prior leans
    E-SUBSUMED (pi_2 carries most). Frozen before Stage 1; never adjusted
    after any run (amendment path only).

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
