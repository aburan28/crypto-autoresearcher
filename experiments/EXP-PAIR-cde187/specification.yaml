experiment:
  id: EXP-PAIR-cde187
  hypothesis_id: H-PAIR-a82328
  derived_from_idea: IDEA-20260809-172a9e
  question_id: RQ-PAIR-f2e31f
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Distribution of polynomial-selection quality over a declared budget ladder at two small tower field sizes -
    the best-of-N curve and its saturation point as the primary object, with a seed control that can void the
    run, a two-implementation scoring control that can void the score, a degraded-search positive control, and a
    bits conversion that is reported UNRUN unless a committed calibration exists
  objective: >-
    The one uncertainty a run reduces - whether the selection budget implicitly fixed by a single-selection
    security estimate is a live parameter an adversary could exceed, or whether selection quality saturates so
    early that the budget is irrelevant. A run establishes (i) whether the quality score is measurable at all,
    by requiring two independently written scoring implementations to rank the top candidates identically and
    the score distributions at fixed budget to agree across seeds; (ii) the FULL score distribution at each of
    four declared budget rungs at each of two small field sizes sharing the deployed tower shape; (iii) the
    best-of-N curve against the log of the budget, and the budget at which it saturates, which is the
    decision-relevant feature; (iv) the median-to-best score gap at the largest budget, against the score
    resolution the controls establish; and (v) that gap translated into estimated cost bits IF AND ONLY IF a
    committed score-to-cost calibration exists, and reported UNRUN otherwise. No attack is proposed, no cost is
    reduced, and nothing here is a security verdict about any deployed parameter.
  what_this_is_not:
  - >-
    Not an attack, a break, or a speedup. It measures the spread of an existing search procedure's output
    quality.
  - >-
    Not a security verdict about any deployed pairing parameter. Measurements are at small field sizes and any
    extrapolation carries its own interval.
  - >-
    Not a novelty claim against the literature on selection-quality distributions for integer factorisation.
    What is proposed is the transfer to a tower target field and the best-of-N precomputation framing.
  - >-
    Not a bits claim on its own. The score-to-cost calibration is EXTERNAL to this contract, is not approved,
    and may not exist in committed form; where it does not, the bits metric is UNRUN and no figure is invented.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has been
    executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the two executed small field sizes with the declared tower shape and this
      selection implementation, the quality score distribution at each declared budget takes the measured form,
      the best-of-N curve saturates at the measured budget or does not saturate within the ladder, and the
      median-to-best gap is the measured value in SCORE units; plus, only where a committed calibration exists,
      that gap in bits. WHAT DOES NOT FOLLOW - nothing about the deployed field size except through a numbered
      transfer heuristic; nothing about a different selection implementation, which explores a different space;
      no attack; no cost reduction; and no security verdict about any parameter.
  inputs:
    procedure: >-
      STAGE 0 (zero compute). Freeze the tower shape, the two field sizes, the four budget rungs and their
      spacing factor, the seed set, the quality measure's definition, and the declared score resolution. Record
      whether a COMMITTED score-to-cost calibration exists; if it does, pin its identifier and version, and if it
      does not, declare the bits metric UNRUN before any data is collected, so the downgrade cannot be presented
      afterwards as a result.
      STAGE 1 (SCORING CONTROL, HARD GATE). Run TWO independently written implementations of the quality measure
      over the same candidate set and require identical ranking of the top candidates. This establishes the score
      resolution that every later comparison is judged against. A disagreement voids the score and nothing else
      runs.
      STAGE 2 (SEED CONTROL, HARD GATE). At a fixed budget, run the selection search under each declared seed and
      compare the resulting score distributions. Heavy seed dependence at fixed budget means the search is not
      sampling the space, the distribution is not the object claimed, and the run is INVALID rather than negative.
      STAGE 3 (THE LADDER). At each of the two field sizes and each of the four budget rungs, run the selection
      search under every declared seed and RETAIN THE FULL SCORE DISTRIBUTION per cell, not its summary. Record the
      best-of-N and the median per cell.
      STAGE 4 (POSITIVE CONTROL). Run the identical pipeline on a deliberately DEGRADED search - restricted to a
      small fraction of its normal candidate space - where the distribution MUST be measurably worse. If it is
      not, the instrument cannot detect a quality difference at all and no negative may be read from any cell.
      STAGE 5 (zero compute). Emit the best-of-N curve against the log of the budget with its saturation verdict;
      the median-to-best gap against the score resolution; the two field sizes' agreement on the saturation budget
      and the gap, which is the within-contract transfer test; and the bits conversion, or the UNRUN receipt.
    instrument: >-
      Repeated invocation of the polynomial-selection search at declared budgets and seeds, with the full per-cell
      score distribution retained. TWO independently written scoring implementations, run over the same candidate
      sets, with their ranking agreement reported before any distribution is quoted. The score-to-cost translation
      applied only from a committed calibration, pinned by identifier and version. Recorded through
      harness/runner.py.
    parameters: >-
      Two small field sizes sharing the deployed target's tower shape, so the transfer assumption is tested at the
      only two scales the budget reaches rather than assumed at one. Four budget rungs, spaced by a declared factor,
      with the ladder frozen before any run. At least three seeds per (field size, budget) cell. A degraded-search
      positive control at a declared restriction fraction. THE DEPLOYED PARAMETER SET ENTERS ONLY as the
      destination of an extrapolation under the transfer heuristic, never as an executed parameter, and no
      deployed prime is used.
  controls:
  - >-
    SEED CONTROL, HARD GATE AND IT CAN VOID THE RUN. Repeated runs at the SAME budget with DIFFERENT seeds must
    give consistent distributions within the declared tolerance. A heavy dependence on the seed at fixed budget
    means the search is NOT sampling the space and the distribution is not the object claimed - the run is INVALID
    rather than negative.
  - >-
    SCORING CONTROL, HARD GATE AND IT CAN VOID THE SCORE. Two INDEPENDENTLY WRITTEN implementations of the quality
    measure must rank the top candidates identically. Their level of agreement ESTABLISHES the score resolution
    that the median-to-best gap is later judged against, so this control is not merely a check but the source of
    the comparison threshold.
  - >-
    DEGRADED-SEARCH POSITIVE CONTROL, WHERE THE EFFECT MUST APPEAR. Run the identical pipeline on a search
    restricted to a small fraction of its normal candidate space. Its distribution MUST be measurably worse. If the
    instrument cannot detect a quality difference there, it cannot detect one anywhere, and NO negative conclusion
    about selection budgets may be drawn from any cell.
  - >-
    TWO FIELD SIZES AS THE WITHIN-CONTRACT TRANSFER TEST. The two sizes must agree on the saturation budget and on
    the median-to-best gap within the declared resolution. A disagreement between the only two scales executed
    falsifies the transfer heuristic there and FORBIDS any extrapolation to the deployed size.
  - >-
    FROZEN BUDGET LADDER. The four rungs and their spacing are declared before any run. A rung added after seeing
    a curve is a rung chosen to produce a wanted saturation verdict.
  - >-
    UNRUN DECLARATION BEFORE DATA. Whether a committed score-to-cost calibration exists is recorded in Stage 0,
    BEFORE any measurement, so that a missing calibration is a pre-declared downgrade and not a post-hoc excuse.
  independent_variables:
  - selection budget (four declared rungs)
  - field size (two small sizes sharing the deployed tower shape)
  - seed (at least three per cell)
  - 'search mode: normal / deliberately degraded positive control'
  - 'scoring implementation: two independently written versions'
  metrics:
    primary:
    - >-
      score_distribution - the FULL empirical distribution of the quality score per (field size, budget, seed)
      cell, retained rather than summarised, and reported with its median, its best-of-N and its interquartile
      range.
    - >-
      best_of_n_curve - the best observed quality score as a function of the log of the selection budget, per
      field size, with a SATURATION VERDICT: the rung at which the improvement over the previous rung first falls
      below the declared score resolution, or NO_SATURATION if it never does within the ladder.
    - >-
      median_to_best_gap - in score units, at the largest budget, per field size, reported against the score
      resolution established by the scoring control. A gap at or below that resolution falsifies the concern in
      the score domain.
    - >-
      seed_consistency - the overlap of the interquartile ranges of the fixed-budget distributions across seeds,
      per cell. Below the declared tolerance the run is INVALID.
    - >-
      scoring_agreement - whether the two independent implementations rank the top candidates identically, and the
      score resolution their agreement establishes.
    secondary:
    - >-
      median_to_best_gap_bits - the same gap translated through a COMMITTED score-to-cost calibration, with the
      calibration's identifier and version named. Reported as the literal string UNRUN, with the reason, if no
      committed calibration exists or if its resolution over the observed score range is coarser than the observed
      gap.
    - >-
      the degraded-search positive control's distribution against the normal search's, at matched budget and seed.
    - >-
      the two field sizes' agreement on the saturation budget and on the median-to-best gap, which is the
      within-contract transfer test.
    - >-
      wall time and peak resident memory per cell, and the realized number of selections examined per rung, so the
      declared budget is checkable against what was actually spent.
    - >-
      the frozen budget ladder and the declared score resolution, as recorded in Stage 0.
  heuristic_under_test: HEUR-PAIR-1
  heuristic_under_test_note: >-
    HEUR-PAIR-1 (shape transfer) is tested WITHIN this contract at the only two scales its budget reaches - the two
    executed field sizes must agree on the saturation budget and on the median-to-best gap. That is a genuine but
    WEAK test of a transfer to a deployed size an order of magnitude away, and its weakness is stated rather than
    hidden. HEUR-PAIR-2 (score-to-cost stability) is NOT under test here; it belongs to an external calibration this
    contract does not own, and where it fails the bits metric is UNRUN.
  preregistered_prediction:
    quantity: >-
      Three quantities, fixed before any run exists - the best-of-N curve's saturation verdict; the
      median-to-best score gap at the largest budget; and that gap in bits where a committed calibration exists.
    formula: >-
      The best-of-N at budget rung k is the maximum quality score observed over all selections examined at that
      rung; the saturation verdict is the first rung at which the improvement over the previous rung falls below
      the declared score resolution. PREDICTED - improvement exceeding the score resolution from the first rung to
      at least the third BEFORE saturating; a median-to-best gap ABOVE the score resolution at the largest budget;
      and, where a calibration exists, that gap at least 1 bit. UNDER THE NULL that selection budget is irrelevant,
      the curve saturates at the FIRST rung and the median-to-best gap sits at or below the score resolution - and
      that null is a REASSURING AND PUBLISHABLE NEGATIVE, not a failure.
    source: >-
      Pre-registered in the parent proposal IDEA-20260809-172a9e, predictions and falsification_conditions, before
      any run under this contract exists. The 1-bit threshold is the parent's own figure and is a judgement about
      what counts as material, not a derived quantity; it may not be moved after a run except through a versioned
      amendment.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at two SMALL field sizes chosen so that the selection search can be run many times over at four
      budget rungs, which is the whole point - the object is a DISTRIBUTION, and a distribution needs many draws.
      At a deployed field size a single selection is already expensive and the ladder would be unaffordable, which
      is precisely why published levels evaluate one selection. TRANSFER, STATED AND PARTIALLY TESTED - the bridge
      to a deployed prime is HEUR-PAIR-1, a pure shape-transfer assumption with no model behind it, and this
      contract tests it only at the two scales it executes. That test is real but weak, and it is the reason the
      contract runs TWO sizes rather than one. Every extrapolated statement is labelled as an extrapolation and no
      security verdict rests on one.
    correspondence: null
  tail_checks:
  - >-
    THE TAIL IS THE OBJECT, so it gets the sharpest checks. Report the best, second-best and third-best score per
    cell, not just the maximum, so a best-of-N driven by a single outlier is distinguishable from a genuinely
    heavier tail.
  - >-
    Report the number of selections actually examined per rung against the declared budget. A rung whose realized
    count falls short of its declared budget has a best-of-N that is not comparable to the others and must be
    flagged.
  - >-
    Report the best-of-N curve's improvement between EVERY adjacent pair of rungs against the score resolution,
    rather than only the first-to-last improvement, so a curve that plateaus and then improves again is visible.
  - >-
    Report the median-to-best gap at EVERY budget rung, not only the largest, since a gap that shrinks with budget
    means the tail is being exhausted and a gap that grows means it is not.
  - >-
    Report the degraded-search control's best-of-N beside the normal search's at matched budget, since it is the
    tail and not the median that the control must move for the instrument to be usable for this object.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
    note: >-
      Every (field size, budget) cell is run under all three seeds, which is simultaneously the replication and the
      SEED CONTROL - the distributions must agree within the declared tolerance or the run is invalid. The degraded
      positive control is run at matched seeds so its comparison against the normal search is paired.
  budget:
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 40.0
    maximum_memory_gb: 16
    maximum_runs: 24
  stopping_rules:
  - >-
    HALT at Stage 1 if the two scoring implementations do not rank the top candidates identically. The score is not
    well defined to the resolution claimed and no distribution over it is reportable.
  - >-
    HALT at Stage 2 if the fixed-budget distributions depend heavily on the seed. The search is not sampling the
    space; the run is INVALID rather than negative.
  - >-
    HALT the interpretation of every negative cell if the degraded-search positive control's distribution is not
    measurably worse. The instrument cannot detect a quality difference and no negative may be read from it.
  - >-
    Stop at the frozen four-rung budget ladder and the two declared field sizes. Adding a rung or a size after
    seeing a curve is a different experiment and needs an amendment.
  - >-
    If a (field size, budget) cell exceeds its declared per-cell wall-clock allowance, record it BUDGET-STOPPED
    with the realized selection count and continue. Budget exhaustion is a stop, never a negative result about
    saturation (AGENTS.md rule 5) - in particular a rung that did not reach its declared budget must NOT be read as
    evidence that the curve saturated.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first.
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure and is NEVER
    negative mathematical evidence (AGENTS.md rule 5). A truncated budget rung is specifically named here as such.
  - >-
    A run reporting a saturation verdict from a rung whose realized selection count fell short of its declared
    budget is invalid_measurement. That is budget exhaustion presented as saturation and it is the single most
    likely way this contract would produce a false negative.
  - >-
    A run reporting a bits figure without naming the committed calibration's identifier and version is
    invalid_reporting. Where no committed calibration exists the metric is UNRUN and no figure is stated.
  - >-
    A run whose seed control or scoring control was not executed in the same invocation as the ladder is
    invalid_measurement.
  - >-
    A run reporting only summary statistics rather than the retained full per-cell distributions is
    invalid_measurement; the tail is the object and a summary cannot carry it.
  - >-
    A run whose budget ladder or score resolution was set after any distribution was seen is invalid_measurement.
  - >-
    A run whose parameters differ from this frozen contract is a DIFFERENT experiment and needs a new contract.
  success_criterion: >-
    ALL SIX of the following, each decidable from the primary metrics. (1) scoring_agreement is reported and the two
    implementations rank the top candidates identically, establishing the score resolution. (2) seed_consistency is
    reported and within the declared tolerance at every cell. (3) score_distribution is retained IN FULL for every
    (field size, budget, seed) cell, with the realized selection count per rung. (4) best_of_n_curve is emitted per
    field size with its saturation verdict and with the improvement between every adjacent pair of rungs.
    (5) median_to_best_gap is reported at every rung against the score resolution. (6) The degraded-search positive
    control is reported at matched budget and seed, and median_to_best_gap_bits is either reported with its
    calibration named or recorded UNRUN with its reason. NOTE that success means THE DISTRIBUTION WAS MEASURED AND
    ITS CONTROLS PASSED; whether the hypothesis is supported is decided by the pre-registered prediction and the
    falsification criteria, and a completed run showing immediate saturation is a successful run and a publishable
    negative.
  falsification_criterion:
  - >-
    best_of_n_curve saturates immediately - improvement below the score resolution from the first rung to the fourth,
    with every rung having reached its declared budget. S2 is FALSE, selection budget is irrelevant, and this is a
    reassuring and publishable NEGATIVE.
  - >-
    median_to_best_gap is at or below the score resolution at the largest budget - S3 is FALSE in the score domain,
    before any translation is attempted, and no bits claim is made.
  - >-
    The score-to-cost translation's resolution over the observed score range is coarser than the observed gap - the
    measurement cannot support a claim in bits; the metric is UNRUN and the score-domain result stands alone.
  - >-
    seed_consistency falls below the declared tolerance - the search is not sampling the space, the distribution is
    not the object claimed, and the run is INVALID rather than negative.
  - >-
    scoring_agreement fails - the score is not well defined to the resolution claimed and nothing is reportable.
  - >-
    The degraded-search positive control is not measurably worse - the instrument cannot detect a quality difference
    and no negative may be read from any cell.
  - >-
    The two executed field sizes disagree about the saturation budget or the median-to-best gap beyond the declared
    resolution - HEUR-PAIR-1 fails at the only two scales tested and NO extrapolation to a deployed size may be
    attempted.
  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and
    environment
  - >-
    raw-result.json carrying the FULL per-cell score distribution, not summaries, with the realized selection count
    per rung
  - >-
    both scoring implementations' outputs over the same candidate sets, with their ranking comparison
  - >-
    the seed-control comparison and the degraded-search positive control, in the same file as the ladder
  - >-
    the frozen Stage-0 declaration - tower shape, field sizes, budget ladder and spacing, seed set, quality-measure
    definition, declared score resolution, and the recorded presence or absence of a committed score-to-cost
    calibration - hashed and written before any data
  - >-
    the bits conversion with its calibration identifier and version, OR an explicit UNRUN receipt naming what was
    missing
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution. This contract is NOT approved; approved_by is null,
    execution_authorized is false and frozen is false (AGENTS.md rule 1). Approval is the user's gate because it
    authorizes execution and spends compute.
  - >-
    THE BITS METRIC DEPENDS ON AN EXTERNAL, UNAPPROVED CALIBRATION THAT THIS CONTRACT DOES NOT OWN. The Coordinator
    must decide before approval whether a committed calibration exists; if not, the bits metric is UNRUN from the
    outset and the contract's value is the score-domain distribution alone. Approving this contract does NOT
    authorize the calibration work.
  - >-
    THE PARENT'S REQUIRED READS ARE RECALLED AND UNREAD IN THIS PROGRAM. The tower-field and pairing key-size
    references that fix the tower shape and the quality measure must be obtained before any absolute statement is
    made; the score-domain result does not depend on them beyond fixing the shape and the measure, and the
    Coordinator should record which of the two situations the run is in.
  - >-
    This is the thinnest parent proposal in its batch and the contract has supplied several parameters the parent
    left open. The Coordinator should review the derivation_gaps below before approval, since several of them set
    the contract's discriminating power.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260809-172a9e
    authored_at: '2026-08-25'
    note: >-
      The parent proposal is SHORT and specifies design, controls, predictions and falsification conditions only in
      outline. This contract restates what the parent supplies - repeated selection at four budgets with declared
      seeds at two small field sizes, the full score distribution as the object, the seed control and the scoring
      control, and the two named falsification conditions - and ADDS the structure the parent left implicit: the
      degraded-search positive control, the saturation verdict as a defined quantity, the score resolution as an
      OUTPUT of the scoring control rather than an assumption, the two field sizes as a within-contract transfer
      test, and the explicit UNRUN handling of the external calibration. Those additions are flagged in
      derivation_gaps as contract-supplied rather than parent-supplied. Budgets come from the parent's declared
      estimated_cost (implementation medium, compute moderate and parallel). NO NUMBER IS INVENTED and no
      measurement is asserted.
  derivation_gaps:
  - >-
    The two field sizes, the tower shape, and the four budget rungs with their spacing factor are NOT specified by
    the parent and are not fixed here. They must be frozen in Stage 0, because a ladder chosen after seeing a curve
    sets the saturation verdict, which is the contract's primary output.
  - >-
    The quality measure itself is named only as 'the standard quality measure' in the parent. It must be defined
    exactly before Stage 1, since the entire distribution is a distribution over it and two implementations cannot
    be checked against each other without a definition.
  - >-
    The declared score resolution is an OUTPUT of the scoring control in this contract, not an input - that is a
    contract-supplied design choice and it is the right one, but it means the comparison threshold is not known
    until Stage 1 completes. The Coordinator should note that the median-to-best gap cannot be judged before then.
  - >-
    The score-to-cost calibration is EXTERNAL, unapproved, and possibly non-existent in committed form. The parent
    names a sibling record as the source; this contract deliberately does NOT assert that identifier as a checked
    dependency, and the bits metric is UNRUN unless one is pinned at approval.
  - >-
    The degraded-search positive control and its restriction fraction are CONTRACT-SUPPLIED, not parent-supplied.
    Without such a control a saturation verdict cannot be distinguished from an instrument that cannot see quality
    differences at all, which is why it was added; the exact restriction fraction must still be pinned.
  - >-
    The parent's novelty screen states plainly that the web was NOT checked and that the required external reads are
    recalled. No claim of absence in the literature is made or implied by this contract, and a positive literature
    hit would be an ingredient rather than a defeat.
