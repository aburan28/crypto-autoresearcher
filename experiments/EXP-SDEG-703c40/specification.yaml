# =============================================================================
# EXP-SDEG-703c40 — version 1, approved by DEC-20261006-2143e6.
# Frozen measurement of the hit-versus-miss solving-degree comparison
# in IDEA-20261006-e1215a. Success is the idea's prediction: the miss
# mean and the hit mean either differ by strictly less than 1, or the
# miss mean exceeds the hit mean by at least 1, on both bases, and a
# gap of at least 1 is not reproduced by the random arm. A finished
# difference at most -1 on the primary base is the concrete negative.
# This design session did not build a Groebner basis and did not
# record a degree. No discrete logarithm is authorized.
# Source idea bytes are copied unchanged from
# origin/design/mlkem-0e9abf-isometry.
# =============================================================================
experiment:
  id: EXP-SDEG-703c40
  hypothesis_id: H-SDEG-a7764d
  question_id: RQ-SDEG-001
  source_idea: IDEA-20261006-e1215a
  version: 1
  title: >-
    Hit versus miss grevlex solving degree on one F_61, B = 8 cell
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-2143e6
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that hits and misses share a degree,
      and it does not assert that misses are harder.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Search one ordinary curve over F_61, draw two factor bases of
      size 8, label targets by exhaustive addition, solve the labeled
      S_4 systems and 20 random systems, recompute the primary base
      with a second build, and score D. Do not change the threshold 1.
      Do not search for a discrete logarithm.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether, on one ordinary curve over F_61 with B = 8, the
    mean grevlex solving degree on misses and the mean on hits either
    agree to within strictly less than 1 or the miss mean exceeds the
    hit mean by at least 1, with the second base on the same side of
    that threshold. A finished primary-base difference at most -1 is
    the concrete negative. No faster discrete logarithm is in scope.

  inputs:
    prime: 61
    cardinality: 8
    arity: 3
    bases: 2
    minimum_per_class: 4
    minimum_targets: 12
    enlargement_cap: 96
    random_systems: 20
    curve_search: >-
      Scan integers A from 1 upward and, for each A, scan integers
      Bcoef from 1 upward. The model is y^2 = x^3 + A x + Bcoef over
      F_61. Skip the model when 4 A^3 + 27 Bcoef^2 = 0. Count points
      by summing, over x in {0, 1, ..., 60}, one plus the Legendre
      symbol of x^3 + A x + Bcoef, then add the point at infinity.
      The trace is t = 62 - #E. Skip the model when t = 0. Keep the
      first model that remains, in (A, Bcoef) lexicographic order.
      Record A, Bcoef, #E, and t before any Groebner call. Let n be
      the largest prime factor of #E. Let G be the first affine point,
      scanning x from 0 and taking the smaller y in {0, ..., 60},
      whose order is n. The subgroup is <G>.
    summation_polynomial: >-
      S_3(x1, x2, x3) = (x1 - x2)^2 x3^2
      - 2*((x1 + x2)*(x1*x2 + A) + 2*Bcoef)*x3
      + (x1*x2 - A)^2 - 4*Bcoef*(x1 + x2).
      This is the short-Weierstrass polynomial printed in
      coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-642cf5/v1_blind_rederive.py,
      which this design session opened. S_4(x1, x2, x3; xT) is the
      resultant in an auxiliary variable X of S_3(x1, x2, X) and
      S_3(x3, xT, X), the resultant recursion stated in KR-IC-5a43e5,
      which this design session opened. Expand over F_61 before
      solving. xT is the target abscissa. A and Bcoef are the curve
      coefficients.
    membership: >-
      For a factor base b1, ..., b8 of distinct field elements, the
      membership polynomial is m(X) = product (X - bi), monic of
      degree 8. The ideal is generated by S_4(x1, x2, x3; xT), m(x1),
      m(x2), and m(x3) in F_61[x1, x2, x3]. Field equations
      x_i^61 - x_i are omitted.
    factor_base_draw: >-
      Liftable abscissae are the x in {0, 1, ..., 60} whose Legendre
      symbol of x^3 + A x + Bcoef is 0 or 1. Shuffle that list with
      Fisher-Yates. The random integer at step k is the first 8
      bytes, as a big-endian integer, of SHA-256 of the UTF-8 string
      EXP-SDEG-703c40|base|{base_index}|{k}. base_index is 0 or 1.
      The factor base is the first 8 elements after the shuffle. Each
      abscissa is lifted to one affine point by taking the smaller y
      in {0, ..., 60}. If fewer than 8 liftable abscissae exist, the
      run is incomplete and is not a negative.
    target_draw: >-
      Draw scalars uniformly from {1, 2, ..., n-1}. The scalar at
      draw j is SHA-256 of the UTF-8 string
      EXP-SDEG-703c40|target|{base_index}|{j} reduced modulo n-1,
      plus 1. The target is that scalar times G. Continue until the
      base has at least 12 targets and at least 4 hits and 4 misses,
      or until 96 targets have been drawn, whichever comes first.
      The same rule is applied independently to each base.
    label: >-
      A target T is a hit if and only if some ordered triple of
      distinct lifted base points sums, under the elliptic curve
      law, to T or to -T. Otherwise it is a miss. The labeler is
      point addition. The solver is not the labeler. Record the
      convention next to the counts.
    solver: >-
      Grevlex with variable order x1 > x2 > x3. One solver build for
      every S_4 system and every random system. d_solve is the
      maximum total degree of any polynomial the solver constructs,
      including reducers, as written in its degree transcript. When
      the reduced basis is {1}, d_solve is still that maximum, not 0,
      unless the transcript shows that no higher-degree polynomial
      was built. A target whose transcript does not record the
      maximum is infrastructure-incomplete and is not entered as 0.
    difference: >-
      On a complete class pair, let S_m and n_m be the sum and the
      count of miss degrees, and S_h and n_h the same for hits.
      D_num = n_h * S_m - n_m * S_h and D_den = n_h * n_m. Absolute
      difference strictly less than 1 means abs(D_num) < D_den.
      Difference at least 1 means D_num >= D_den. Difference at most
      -1 means D_num <= -D_den. All comparisons are exact integer
      comparisons. The primary base is base_index 0.
    second_build: >-
      A second solver build recomputes every scored primary-base
      target. Each per-target integer must match the first build.
      A mismatch voids the cell as an instrument failure. It is not
      a difference of -1.
    random_arm: >-
      Draw 20 systems. The first generator has exactly the monomials
      present in S_4 for generic A, Bcoef, and xT, each coefficient
      uniform in F_61, drawn from SHA-256 of the UTF-8 string
      EXP-SDEG-703c40|random|{rep}|{monomial_index} as an integer
      modulo 61. The other three generators are monic of degree 8 in
      one variable each, lower coefficients uniform in F_61 from the
      same style of digest. Solve them with the same solver. Label a
      replicate nonempty when the reduced basis is not {1}, and empty
      when it is {1}. The random difference uses the same integer
      comparison, with empty playing the role of miss and nonempty
      playing the role of hit. The arm is usable only when it has at
      least four empty and four nonempty replicates.
    omission_cap: >-
      If any constructed polynomial has total degree at least 61,
      that target is void. The omission of the field equations was
      then outside the rule, and the degree is not scored. A voided
      target does not count toward the class size.

  controls:
    - id: support-matched-random
      statement: >-
        Twenty support-matched random systems, labeled by empty
        versus nonempty variety. If the S_4 difference is at least 1
        and the random difference matches it to within strictly less
        than 1, the gap is the empty variety and is not success.
    - id: second-base
      statement: >-
        A second recorded base of size 8 on the same curve. Both
        bases must lie on the same side of the threshold 1. One side
        strictly inside the unit gap and the other at absolute
        difference at least 1 is the base-split negative.
    - id: second-build
      statement: >-
        The second solver build on the primary base must match every
        per-target integer. A mismatch voids the cell.

  independent_variables:
    - base index in {0, 1}
    - target draw index
    - class in {hit, miss}
    - arm in {S_4, random}
    - solver build in {first, second} on the primary base

  metrics:
    primary:
      - id: difference_D
        statement: >-
          D_num / D_den on the primary base, compared with the
          threshold 1 by the exact integer tests above, together
          with the same tests on the second base.
    secondary:
      - id: class_counts
        statement: hit count and miss count on each base
      - id: class_extrema
        statement: minimum and maximum d_solve in each class on each base
      - id: random_difference
        statement: >-
          The empty-minus-nonempty difference on the random arm,
          when both random classes have at least four replicates.
      - id: audit_match
        statement: >-
          Whether every primary-base degree matches across the two
          solver builds.

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says the two conditional means agree. The source idea's
    prediction also allows a miss-minus-hit gap of at least 1 as a
    second supportive reading. A random-arm match of a gap of at
    least 1 falsifies the summation polynomial as the cause and is
    not, by itself, a wrong-sign negative.

  preregistered_prediction:
    quantity: >-
      Mean d_solve on misses minus mean d_solve on hits, on the
      F_61, B = 8 cell, and the same difference on the second base.
    formula: >-
      Absolute difference strictly less than 1, or miss mean minus
      hit mean at least 1, on both bases and on the same side. When
      the difference is at least 1, the random arm must not match it
      to within strictly less than 1. The concrete negative is a
      finished primary difference at most -1. Source idea
      IDEA-20261006-e1215a, prediction minimum_effect.
    source: >-
      IDEA-20261006-e1215a. KR-IC-5a43e5 supplies the resultant
      and the degree pattern and was opened. It does not predict
      the sign of D.

  scale_relevance:
    tier: toy
    justification: >-
      The single prime 61 and B = 8 only. No transfer to
      cryptographic p, to larger B, or to m = 4 is assumed. A unit
      gap here is a toy degree comparison.
    correspondence: null

  tail_checks:
    - >-
      Record the maximum and the minimum d_solve in each class on
      each base, so a mean gap of at least 1 that is carried by a
      single target is visible.
    - >-
      On the random arm, record the maximum and the minimum degree
      in the empty class and in the nonempty class.

  replication:
    seeds:
      - EXP-SDEG-703c40|base|{base_index}|{k}
      - EXP-SDEG-703c40|target|{base_index}|{j}
      - EXP-SDEG-703c40|random|{rep}|{monomial_index}
    independent_instances: 2
    random_replicates: 20
    note: >-
      Two is the number of factor bases. Twenty is the random-arm
      replicate count. The per-class floor of four and the draw cap
      of 96 are frozen scientific sample counts. Drawing stops early
      once both classes have four members and at least twelve
      targets have been drawn.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_runs: 1
    maximum_workers: 1
    scientific_systems_cap: 308
    budget_note: >-
      One run manifest covers at most 96 targets on each of two
      bases, 20 random systems, and a second build of at most 96
      primary targets. The cap is 308 systems. The draw stops
      earlier when both classes are full. Wall-clock and CPU
      figures are advisory and null. The 8 GB memory figure is
      machine protection. A watchdog expiry is failed_infrastructure,
      not a difference of -1.

  stopping_rules:
    - Stop drawing on a base when it has at least 12 targets and at least 4 hits and 4 misses.
    - Stop drawing on a base after 96 targets even if a class is still short.
    - Stop the run when both bases have stopped, the 20 random systems are scored or voided, and the second build has finished.
    - A timeout on one system voids that system. It does not fill a degree of 0 and it does not stop the other systems.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - A singular model or a trace-zero model that was scored voids the run.
    - A field equation that was included voids the targets that included it.
    - A monomial order other than grevlex voids the run.
    - A second-build mismatch voids the run and is not a difference of -1.
    - A degree transcript that lacks the maximum voids that target.
    - Fewer than 8 liftable abscissae voids the run and is not a negative.
    - A void from the degree-at-least-61 rule does not count as a class member.

  success_criterion: >-
    Both bases are complete (at least four hits, four misses, and
    twelve targets, none of those counts depending on a void), the
    second build matches every primary degree, and either both bases
    have absolute difference strictly less than 1, or both bases
    have miss mean minus hit mean at least 1 and the random arm has
    at least four empty and four nonempty replicates whose
    difference is not within strictly less than 1 of the primary S_4
    difference. This is the prediction of IDEA-20261006-e1215a. It
    is reachable as a failure.

  falsification_criterion: >-
    The primary base is complete, the second build matches, and the
    miss mean minus the hit mean is at most -1. That finished
    wrong-sign gap is the concrete negative: hits are harder than
    misses by at least one degree, which the idea's disjunction does
    not allow. A base split, absolute difference at least 1 on one
    base and strictly less than 1 on the other, is also a negative.
    A gap of at least 1 on both bases that the random arm reproduces
    to within strictly less than 1 is also a negative. None of these
    outcomes is an infrastructure event.

  required_artifacts:
    - experiments/EXP-SDEG-703c40/runs/RUN-*/manifest.yaml
    - experiments/EXP-SDEG-703c40/runs/RUN-*/stdout.txt
    - experiments/EXP-SDEG-703c40/runs/RUN-*/stderr.txt
    - experiments/EXP-SDEG-703c40/runs/RUN-*/degrees.csv
    - experiments/EXP-SDEG-703c40/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: shared_degree
      when: >-
        both bases complete, audit matches, and both absolute
        differences are strictly less than 1
    - id: two_populations
      when: >-
        both bases complete, audit matches, both differences are at
        least 1, and the usable random arm does not match the
        primary difference to within strictly less than 1
    - id: wrong_sign
      when: >-
        primary base complete, audit matches, and the primary
        difference is at most -1
    - id: base_split
      when: >-
        both bases complete, audit matches, and one absolute
        difference is at least 1 while the other is strictly less
        than 1
    - id: empty_variety
      when: >-
        both bases complete, audit matches, both differences are at
        least 1, and the usable random arm matches the primary
        difference to within strictly less than 1
    - id: incomplete
      when: >-
        a class is short of four after the cap, a required transcript
        is void, the random arm is unusable when a gap of at least 1
        would otherwise be read, or the audit mismatches
  reading_rule: >-
    Name exactly one row. shared_degree and two_populations are the
    only success rows. wrong_sign is the concrete negative.
    base_split and empty_variety are the other negatives named by
    the source idea. incomplete is not evidence about the degree.
    Record both differences, both class counts, the extrema, and the
    random difference beside the row. Those fields do not change the
    row. If wrong_sign and base_split could both apply, name
    wrong_sign.
