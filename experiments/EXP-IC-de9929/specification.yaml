experiment:
  id: EXP-IC-de9929
  hypothesis_id: H-IC-d328c8
  version: 1
  title: pairing exact finite-field lattice interface experiment
  status: review_required
  frozen: false
  objective: Run the complete prescribed pairing finite schedule and preserve certificates, adverse controls, zero
    yields and instrument limits.
  inputs:
    prospective_protocol_path: research/lattice_ic_experiments_20261015/coordinator/prospective-protocols.json
    source_main: 7f11ebacb149fe7936ff45b6bdeff2918ad0edf9
    parameters:
      p: 43
      A: 1
      B: 0
      target_A: -4
      target_B: 0
      r: 11
      quadratic:
      - 1
      - 0
      basis_change_quadratic:
      - 2
      - -2
      isogeny_degree: 2
      targets: all a=0..r-1; Q=aP
      box_ab: 16
      smooth_prime_bound: 13
      large_k_gate:
        q: 2
        r: 101
        maximum_extension_degree: 2
      special_ideal:
        ell: 5
        s: 2
        basis:
        - - 5
          - 0
        - - 2
          - 1
        primitive_pair_subpanel: true
    protocol_panels:
    - Admit E/Eprime by independent point enumeration, map on all source points with O/(0,0) projective exceptions
      and all-pair homomorphism check; enumerate order11 P and distortion witness S=(-x(P),u*y(P)); verify order,
      independence and nondegeneracy.
    - Actual Miller-based Weil pairing, with deterministic lex auxiliary shift if evaluation poles occur (record
      the shift and charge search). Direct e(P,S), e(Q,S), compatible transported e(phiP,phiS), e(phiQ,phiS), reused
      degree2 powers; all targets checked against known planted scalars. Require covariance and exact nontrivial
      order11 image; no inferred inverse-degree normalization.
    - "Two field bases u and v=u+1, v\xB2-2v+2=0; preserve elements by explicit conversion, charge conversion. Exhaustive\
      \ and BSGS tiny field DLP baselines are separate phases."
    - "Actual tiny paired number-field relation pipeline: K1=Q(i), Z[i]; K2=Q(w), w\xB2-w+3=0, theta2=4w-2. Evaluate\
      \ i->u,w->(u+2)/4, so both a-btheta images agree; project nonzero images by exponent168 into mu11. Enumerate\
      \ prime-element generators for rational primes ell<=13 (normell, or inert integerell of normell\xB2) and units;\
      \ preserve exact element identity and unit for every accepted factorization. K1 coefficient generator bounds[-13,13],\
      \ K2[-26,26]; exact norm and irreducibility/inert test, exclude characteristic43."
    - For all integer(a,b) in[-16,16]^2 except zero, compute both norms and attempt exact element division by enumerated
      generators in deterministic(norm,coefficient) order; accepted factorization requires exact product=element
      incl unit, not smoothnorm only. Project both identities, deduplicate actual nontrivial field images as factorbase
      columns, create paired homogeneous log rows. Anchor first lex nontrivial projected image to log1; solve modulo11
      only if rank/consistency certify unique relative logs. Preserve incomplete rank otherwise.
    - 'Individual descent for each actual pairing image and base g: search entire fixed box for matching projected
      element and certified smooth element identity; charge all candidate search and zero successes. Normalize field
      logs by separately descended logg, verify g^a=h. Direct DLP truth is checker/baseline only, never injected
      into relation solver.'
    - 'Public special-ideal lattice illustration already requested: basis (5,0),(2,1), determinant5, exact a-2b=0
      mod5 census in the same box, with primitive gcd(a,b)=1 subpanel labeled separately. Verify norm/element divisibility
      at the good root. This is distinct from actual paired element relations; a0 target is reported separately
      as valid logarithm0, not nondegenerate image failure. No NFS complexity is claimed.'
    route_interfaces: research/lattice_ic_experiments_20261015/coordinator/route-interfaces.md
    user_intake: research/lattice_ic_experiments_20261015/intake.md
  controls:
  - identity map
  - S=P must be degenerate/rejected
  - '[r] kills G and fails injection'
  - q2,r101 embedding-degree gate (integer gate only, no admitted curve)
  - random relabeling must fail group compatibility
  - degree2 power permutation preserves full subgroup average; no selected-target advantage
  - normsmooth candidate without element identity never accepted
  - missing unit or bad projected factor rejected
  independent_variables:
  - p
  - A
  - B
  - target_A
  - target_B
  - r
  - quadratic
  - basis_change_quadratic
  - isogeny_degree
  - targets
  - box_ab
  - smooth_prime_bound
  - large_k_gate
  metrics:
    primary:
    - compatible pairing residual failures
    - actual nondegenerate target count
    - valid paired element relations and modular matrix rank
    - verified individual field descents and recovered scalars, or explicit incomplete coverage
    secondary:
    - Exact case coverage and explicit adverse/inadmissible/instrument-stop counts
    - Per-phase operations,time,RSS; unpriced_work and source/manifest provenance
  scale_relevance:
    tier: toy
    justification: Synthetic explicitly enumerated finite fields and bounded integer boxes; no crypto transfer.
    correspondence: null
  replication:
    seeds:
    - 1729
    independent_instances: 0
    plan: One deterministic frozen finite schedule, seeded controls only; no independent replication asserted.
  budget:
    enforcement: advisory
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
  - Exactly one finite prescribed schedule; no adaptive target/curve/box replacement.
  - Dimension/bit caps, dependency absence or machine protection stop retain incomplete case and logs; never mathematical
    refutation.
  invalidation_rules:
  - Missing controls, mismatched source/spec/plan hashes or changed parameters.
  - Accepted invalid field/point/ring/lattice/root certificate; wrong denominator or improper affine O handling.
  - Oracle/planted truth injected into candidate solver or uncharged extraction described as candidate success.
  success_criterion: Prescribed coverage and mandatory integrity/control checks complete, with every valid negative/zero
    yield and derived instrument-stop explicit. This is trial integrity, not support or improvement.
  falsification_criterion: Wrong covariance/certified identity invalidates trial or scoped assertion after oracle
    review; insufficient relation rank/descent coverage is a valid measured incomplete result, never filled with
    oracle logs.
  required_artifacts:
  - raw-result.json
  - manifest.yaml
  - stdout.log
  - stderr.log
  - check.stdout.log
  - check.stderr.log
  - command.txt
  - environment.json
  - launch.json
  - execution-receipt.json
  assigned_to: executor
  approved_by: null
  execution_authorized: false
  implementation_path: tools/lattice_ic_pairing.py
  candidate_argv:
  - python3
  - tools/lattice_ic_pairing.py
  - --seed
  - '1729'
  - --output-dir
  - '{run_dir}'
  candidate_check_argv:
