---
# Frozen Experiment Specification — EXP-MLDSA-3f7ab2
# Coordinator: TASK-20260805-bebfbc (BATCH-214d98, GOAL-MLDSA-001)
# Frozen: 2026-08-05
# Status: approved
# ─────────────────────────────────────────────────────────────────────────
# BATCH-003 FIPS 204 body constraint (DEC-20260805-0d59ff):
#   This experiment uses academic parameter tables from KN-LIT-056 (TCHES 2018).
#   Any claim about FIPS 204 parameter sets requires reading the FIPS 204
#   standard body before design. All arithmetic here uses academic parameters
#   only. Results must NOT be labeled as validating FIPS 204 parameter choices.
# ─────────────────────────────────────────────────────────────────────────
# UNVERIFIED PARAMETER NOTE:
#   Exact τ, η, γ₁, γ₂, β values stated in this specification are from the
#   idea-generator's memory (IDEA-20260805-3f7ab2 proposals.yaml: "unverified
#   exact values"). The executor MUST verify all parameter values from
#   KN-LIT-056 Table 2 (or equivalent academic table) before performing
#   arithmetic. If parameters cannot be extracted from KN-LIT-056 full text,
#   record as a blocking constraint.
# ─────────────────────────────────────────────────────────────────────────

experiment:
  id: EXP-MLDSA-3f7ab2
  hypothesis_id: H-MLDSA-d1e509
  # NOTE: H-MLDSA-d1e509 is a newly allocated ID (no prior H-MLDSA-* records
  # exist in the ledger). The archival task must create the hypothesis record
  # and confirm no ID collision via tools/allocate_id.py --check.
  version: 1
  title: >-
    Independent Re-Derivation of SelfTargetMSIS Concrete Security Margin at
    ML-DSA-44/65/87 Academic Parameters from KN-LIT-056 Table 2
  status: approved
  approved_by: coordinator
  source_proposal: IDEA-20260805-3f7ab2
  assigned_to: executor

  objective: >-
    Independently re-derive the SelfTargetMSIS concrete bit-security estimate
    at the three ML-DSA academic parameter sets (ML-DSA-44, ML-DSA-65,
    ML-DSA-87) using:
      (a) parameter values extracted from KN-LIT-056 Table 2 (or equivalent);
      (b) the BKZ cost model cited or implied in KN-LIT-056 for the MSIS
          component;
      (c) the exact formula log₂|C| = log₂(C(n,τ) × 2^τ) for the
          hash-programmability component.
    Compare each re-derived estimate to the published security level claimed
    in KN-LIT-056. Determine:
      (1) Whether the re-derivation reproduces the published estimate within
          5 bits (well-calibrated), or reveals a discrepancy (gap finding).
      (2) Which of {MSIS cost, hash cost log₂|C|} dominates at each parameter
          set, establishing whether SelfTargetMSIS is the binding assumption.
      (3) Whether MSIS cost or MLWE cost (from the control) is larger,
          establishing which of the two lattice problems is relatively harder.
    This is an ARITHMETIC RE-DERIVATION task. No implementation, no code.
    A few hours of calculation using a BKZ estimator formula and combinatorics.

  # ─────────────────────────────────────────────────────────────
  # INPUTS
  # ─────────────────────────────────────────────────────────────
  inputs:
    primary_sources:
      - id: KN-LIT-056
        title: "CRYSTALS-Dilithium TCHES 2018"
        url: "https://tches.iacr.org/index.php/TCHES/article/view/839"
        required_sections:
          - >-
            Parameter table (Table 2 or equivalent): n, k, l, q, τ (challenge
            weight), η (secret key bound), γ₁ (masking bound), γ₂ (rounding
            parameter), β (rejection threshold), security claim per parameter
            set.
          - "Security analysis section: BKZ estimator reference or citation"
          - "SelfTargetMSIS definition: norm bound, module dimensions"
        access_note: >-
          Available at IACR TCHES (doi:10.13154/tches.v2018.i1.238-268).
          Record access status in run receipt.
        parameter_verification_required: true
        parameter_note: >-
          ALL parameter values used in arithmetic must be read directly from
          KN-LIT-056 full text. Do not use values from memory. If the paper
          uses different parameter names, record the mapping.

      - id: BKZ_COST_MODEL
        description: >-
          The BKZ cost model cited or used in KN-LIT-056 for MSIS cost
          estimation. This is likely one of:
            (a) Albrecht et al. LWE estimator (lattice-estimator.readthedocs.io);
            (b) Alkim-Ducas-Pöppelmann-Schwabe (ADPS16) estimates;
            (c) Chen-Nguyen BKZ 2.0;
            (d) Another published estimator.
          The executor must identify WHICH estimator KN-LIT-056 uses (from
          citations in the paper's security analysis section) and apply that
          estimator's formula to the extracted MSIS parameters.
        access_note: >-
          The estimator formula itself is publicly available. Identify it from
          KN-LIT-056 citation and record the specific version/formula used.

    unverified_parameter_estimates:
      note: >-
        These are from the idea-generator's memory and are UNVERIFIED.
        The executor must replace these with values verified from KN-LIT-056.
        They are listed here for reference only, not as experimental inputs.
      ml_dsa_44_n: 256
      ml_dsa_44_k: 4
      ml_dsa_44_l: 4
      ml_dsa_44_q: 8380417
      ml_dsa_44_tau_approx: 39
      ml_dsa_65_n: 256
      ml_dsa_65_k: 6
      ml_dsa_65_l: 5
      ml_dsa_65_tau_approx: 49
      ml_dsa_87_n: 256
      ml_dsa_87_k: 8
      ml_dsa_87_l: 7
      ml_dsa_87_tau_approx: 60

    fips204_body_constraint: >-
      FIPS 204 standard body not read (DEC-20260805-0d59ff gate-1).
      Results apply ONLY to academic parameter sets from KN-LIT-056.
      Do not label results as "FIPS 204 ML-DSA-44/65/87 parameters" —
      label them as "academic ML-DSA-44/65/87 parameters from KN-LIT-056."

  # ─────────────────────────────────────────────────────────────
  # METHOD
  # ─────────────────────────────────────────────────────────────
  method:
    type: arithmetic_rederivation
    no_implementation_required: true
    no_code_required: true
    no_computation_required: true
    tools_allowed: [pen_and_paper, calculator, spreadsheet]
    steps:
      - step: 1
        action: >-
          ACCESS AND EXTRACT PARAMETERS.
          Open KN-LIT-056 full text. Locate and extract from Table 2 (or
          equivalent parameter table) the following for each of ML-DSA-44,
          ML-DSA-65, ML-DSA-87:
            n = ring dimension
            k, l = module dimensions (rows × columns)
            q = modulus
            τ = challenge weight (number of ±1 coefficients in challenge c)
            The MSIS norm bound β_MSIS (may be denoted differently; check
              the security analysis section for the exact norm bound used
              in the MSIS instance)
            The published claimed security level (bits or NIST category)
          Also extract: the BKZ cost model citation from the security analysis
          section (which paper is cited for the cost estimate?).
        records: "Verified parameter table: n, k, l, q, τ, β_MSIS, security
          claim, BKZ citation — all from KN-LIT-056 full text."
        blocking_condition: >-
          If KN-LIT-056 full text is inaccessible, or if the parameter table
          does not contain the required values, STOP and record as blocked.
          Do not proceed with unverified parameters from memory.

      - step: 2
        action: >-
          IDENTIFY AND APPLY BKZ COST MODEL.
          Using the BKZ cost model citation from Step 1, look up the specific
          cost formula for MSIS lattice reduction. The typical form is:
            cost_BKZ(n, m, q, β) ≈ 2^(0.292β + 16.4) bit operations
          where β is the BKZ block size needed to find a short vector of
          norm ≤ β_MSIS in the relevant lattice.
          The block size β is determined by the Gaussian heuristic:
            β is the smallest value such that the expected BKZ output length
            for the (k+l)×n module lattice with determinant q^(k*n) equals β_MSIS.
          Apply the formula to each parameter set (ML-DSA-44, ML-DSA-65, ML-DSA-87).
          Record the formula used, the intermediate β values, and the resulting
          cost_MSIS in bits for each parameter set.
        records: "MSIS cost derivation: formula, β values, cost_MSIS per set"
        note: >-
          If KN-LIT-056 uses a non-standard BKZ model, use that model. If the
          cost model cannot be unambiguously identified from KN-LIT-056 alone,
          record this as a constraint: "BKZ model ambiguous; two candidate
          models identified; results under each model reported separately."
          A blocked BKZ model identification is itself a finding.

      - step: 3
        action: >-
          COMPUTE LOG₂|C|.
          The challenge set C consists of all degree-n polynomials with
          exactly τ coefficients equal to ±1 and the rest zero.
          |C| = C(n, τ) × 2^τ (binomial coefficient × sign choices).
          For each parameter set (ML-DSA-44, ML-DSA-65, ML-DSA-87):
            Compute C(n, τ) = n! / (τ! × (n-τ)!) using verified τ from Step 1.
            Compute log₂|C| = log₂(C(n, τ)) + τ.
            (log₂ of the binomial can be computed via Stirling or directly.)
          Record the exact τ values used (verified from Step 1) and the
          resulting log₂|C| values.
        records: "log₂|C| computation: τ values, C(n,τ), log₂|C| per set"

      - step: 4
        action: >-
          COMBINE: SELFTARGETMSIS ESTIMATE.
          For each parameter set:
            cost_SelfTargetMSIS ≈ cost_MSIS + log₂|C|
          (Addition in log₂ space corresponds to multiplication of costs,
          under the independence assumption that the MSIS cost does not depend
          on which challenge c was used.)
          Record the component breakdown (cost_MSIS vs log₂|C|) to show which
          component dominates.
          Compare to the published security claim extracted in Step 1.
          Record the discrepancy Δ = |re-derived - published| in bits.
        records: "SelfTargetMSIS breakdown and comparison to published claim"

      - step: 5
        action: >-
          RECORD RESULTS AND BINDING ASSUMPTION ANALYSIS.
          For each parameter set, state:
            (a) cost_MSIS (bits)
            (b) log₂|C| (bits)
            (c) cost_SelfTargetMSIS = (a) + (b) (bits)
            (d) published security claim (bits, from Step 1)
            (e) discrepancy Δ = (c) - (d) (bits; negative means re-derivation
                is lower than published, a potential concern)
            (f) dominant component: "MSIS" if (a) > (b) + 10 bits,
                "hash" if (b) > (a) + 10 bits, "comparable" if |a-b| ≤ 10 bits
            (g) binding assumption: which of {MSIS, SelfTargetMSIS} is harder?
                (MSIS is harder if cost_MSIS > cost_SelfTargetMSIS, which would
                mean SelfTargetMSIS is strictly harder only by the hash component)
        records: "Complete result table with binding assumption analysis"

  # ─────────────────────────────────────────────────────────────
  # CONTROLS
  # ─────────────────────────────────────────────────────────────
  controls:
    - id: CTRL-1
      description: >-
        MLWE CONTROL: Apply the same BKZ cost model to the MLWE problem at
        the same parameter sets. The MLWE security estimate should appear in
        KN-LIT-056's security analysis. Compare the BKZ-derived MLWE cost to
        the published MLWE security claim and to the MSIS cost.
        Purpose: (a) confirms the BKZ model is not introducing systematic
        upward or downward bias; (b) establishes which of {MLWE, MSIS} is
        the binding lattice assumption. If the BKZ model reproduces MLWE
        within 5 bits, it is correctly calibrated.
      records: "MLWE cost rederivation and comparison to published claim"
      controls_for: "BKZ model calibration — rules out systematic bias"
      expected_outcome: >-
        MLWE cost re-derived within 5 bits of KN-LIT-056 published estimate.
        MLWE and MSIS should be broadly comparable (both should exceed the
        claimed security level).

    - id: CTRL-2
      description: >-
        BKZ MODEL AMBIGUITY CONTROL: If two or more candidate BKZ cost
        models are found in the KN-LIT-056 references, apply BOTH to ML-DSA-65
        only, and record the range of resulting cost_MSIS estimates. If the
        range exceeds 10 bits, the estimate is highly model-sensitive and
        this must be noted as a limitation of the re-derivation.
      records: "BKZ model sensitivity analysis (ML-DSA-65 only, if applicable)"
      controls_for: "Sensitivity to BKZ model choice"

  # ─────────────────────────────────────────────────────────────
  # INDEPENDENT VARIABLES
  # ─────────────────────────────────────────────────────────────
  independent_variables:
    - name: parameter_set
      values: [ML-DSA-44, ML-DSA-65, ML-DSA-87]
      description: "Academic ML-DSA parameter sets from KN-LIT-056"
    - name: problem
      values: [SelfTargetMSIS, MSIS_CTRL, MLWE_CTRL]
      description: "Which hardness problem is being estimated"

  # ─────────────────────────────────────────────────────────────
  # METRICS
  # ─────────────────────────────────────────────────────────────
  metrics:
    primary:
      - name: rederived_security_bits
        type: numeric
        unit: bits
        per: [parameter_set, problem]
        description: "Re-derived bit-security estimate for each (set, problem) pair"
      - name: discrepancy_bits
        type: numeric
        unit: bits
        per: [parameter_set]
        description: >-
          Δ = re-derived SelfTargetMSIS cost − published security claim.
          Positive: re-derivation higher than published (conservative claim).
          Negative: re-derivation lower than published (potential concern).
      - name: dominant_component
        type: categorical
        values: [MSIS, hash, comparable, undetermined]
        per: [parameter_set]
        description: "Which of cost_MSIS or log₂|C| is the larger component"
    secondary:
      - name: bkz_block_sizes
        type: numeric
        per: [parameter_set]
        description: "BKZ block size β used in MSIS cost derivation"
      - name: log2_challenge_set_sizes
        type: numeric
        per: [parameter_set]
        description: "log₂|C| values used in derivation"
      - name: bkz_model_identified
        type: text
        description: "Name and citation of BKZ cost model identified from KN-LIT-056"

  # ─────────────────────────────────────────────────────────────
  # PREREGISTERED PREDICTION
  # ─────────────────────────────────────────────────────────────
  preregistered_prediction:
    quantity: >-
      Discrepancy |re-derived − published| for each of ML-DSA-44/65/87.
      Dominant component at each parameter set.
    formula: >-
      Expected from IDEA-3f7ab2 prediction: |Δ| < 5 bits for all sets if
      the derivation is well-calibrated. At ML-DSA-44, the MSIS and hash
      components are predicted to be within 20 bits of each other (making
      SelfTargetMSIS a potential binding assumption). At ML-DSA-87, the MSIS
      component is predicted to dominate more strongly. If MSIS exceeds
      SelfTargetMSIS by > 50 bits at all sets, SelfTargetMSIS is not binding.
    source: "IDEA-20260805-3f7ab2 prediction, proposals.yaml"

  # ─────────────────────────────────────────────────────────────
  # SCALE RELEVANCE
  # ─────────────────────────────────────────────────────────────
  scale_relevance:
    tier: crypto
    justification: >-
      The arithmetic uses academic ML-DSA parameters from KN-LIT-056, which
      are at or near NIST security category levels (128/192/256-bit). Results
      are therefore at cryptographic scale for the academic parameter sets.
      FIPS 204 body parameters may differ; this caveat is recorded in every
      result artifact.
    correspondence: null
    fips204_scope_note: >-
      Results are labeled "academic parameters (KN-LIT-056)" throughout.
      No claim is made about FIPS 204 production parameter sets.

  # ─────────────────────────────────────────────────────────────
  # REPLICATION
  # ─────────────────────────────────────────────────────────────
  replication:
    seeds: []
    independent_instances: 1
    replication_note: >-
      Arithmetic derivation is deterministic given fixed inputs (verified
      parameter values and identified BKZ formula). If BKZ model choice is
      ambiguous, CTRL-2 applies: both candidate models are tested on ML-DSA-65.

  # ─────────────────────────────────────────────────────────────
  # BUDGET AND STOPPING RULES
  # ─────────────────────────────────────────────────────────────
  budget:
    wall_clock_seconds_per_run: 14400   # 4 hours: parameter extraction + arithmetic
    total_cpu_hours: 0                  # no machine computation
    maximum_memory_gb: 0
    maximum_runs: 1

  stopping_rules:
    - trigger: "KN-LIT-056 full text inaccessible"
      action: >-
        STOP. Record as "blocked: KN-LIT-056 full text inaccessible."
        Parameter values from memory are PROHIBITED as inputs.
        Return a blocking result; Coordinator will dispatch a literature
        access task before re-running this experiment.

    - trigger: >-
        BKZ cost model citation cannot be unambiguously identified from
        KN-LIT-056 text alone (e.g., multiple references cited without
        specifying which was used for parameter selection)
      action: >-
        Record the ambiguity explicitly. Apply all identified candidate models
        to ML-DSA-65 (CTRL-2). Report the range. Proceed with the remaining
        parameter sets using the most commonly cited model, labeled as
        "candidate model [name]."

    - trigger: >-
        Re-derived SelfTargetMSIS estimate for ANY parameter set is MORE THAN
        10 bits BELOW the published security claim
      action: >-
        Record as a potential finding: "Re-derivation [Δ] bits below published
        claim at [parameter set]." Do NOT label as a confirmed calibration gap
        without Coordinator review. Continue computing the remaining sets.

    - trigger: >-
        MSIS cost exceeds SelfTargetMSIS by > 50 bits at ALL THREE parameter sets
      action: >-
        Record as FALSIFICATION of the primary concern: SelfTargetMSIS is not
        the binding assumption at any tested parameter set. MSIS dominates
        completely. Record the exact margins. Coordinator will file as a
        negative result closing this specific question.

  invalidation_rules:
    - trigger: "CTRL-1 fails: MLWE re-derivation differs from published by > 15 bits"
      action: "Flag potential BKZ model error. Do not invalidate automatically;
        record the discrepancy and its magnitude. Coordinator will determine
        whether it represents a systematic model error or a known MLWE vs MSIS
        asymmetry. Continue with main analysis but flag the control failure."
    - trigger: "Parameters used in arithmetic not verified from KN-LIT-056 text"
      action: "Invalidate run. Unverified parameter values from memory are not
        permitted inputs per the blocking condition in Step 1."

  # ─────────────────────────────────────────────────────────────
  # SUCCESS AND FALSIFICATION CRITERIA
  # ─────────────────────────────────────────────────────────────
  success_criterion: >-
    SUCCESS: Parameters are verified from KN-LIT-056 full text; BKZ model is
    identified and cited; arithmetic is complete for all three parameter sets
    and the MLWE control; a result table is produced with (cost_MSIS, log₂|C|,
    cost_SelfTargetMSIS, published_claim, discrepancy_Δ, dominant_component)
    for each parameter set. The result is valid whether the discrepancy is zero
    (well-calibrated) or non-zero (a finding requiring further analysis).

  falsification_criterion: >-
    PRIMARY CONCERN FALSIFIED if: MSIS cost at ML-DSA-44 exceeds the
    SelfTargetMSIS estimate by > 50 bits under any consistent BKZ model
    (meaning SelfTargetMSIS is not the binding assumption at the tightest
    parameter set). Record exact margins.
    
    DERIVATION METHODOLOGY FALSIFIED if: re-derived MLWE cost (CTRL-1) differs
    from the published MLWE claim by > 15 bits under the same BKZ model,
    indicating the BKZ model application is incorrect and all derived values
    are unreliable.

  # ─────────────────────────────────────────────────────────────
  # REQUIRED ARTIFACTS
  # ─────────────────────────────────────────────────────────────
  required_artifacts:
    - type: run_receipt
      path: "experiments/EXP-MLDSA-3f7ab2/run_receipt.yaml"
      required_fields: [parameter_source, bkz_model_citation, timestamps,
                        kn_lit_056_access_status]
    - type: parameter_extraction_record
      path: "experiments/EXP-MLDSA-3f7ab2/parameter_extraction.md"
      description: >-
        Verbatim or exact-paraphrase extracts of parameter values from
        KN-LIT-056 Table 2, with page/section citations. Records the exact
        BKZ model citation. Flags any parameters not found in the text.
    - type: derivation_worklog
      path: "experiments/EXP-MLDSA-3f7ab2/derivation_worklog.md"
      description: >-
        Step-by-step arithmetic for each of Steps 2–5, showing intermediate
        values (β, BKZ formula application, binomial computation, combination).
        Must be checkable independently from the inputs and formulas stated.
    - type: results_table
      path: "experiments/EXP-MLDSA-3f7ab2/results_table.yaml"
      description: >-
        Machine-readable result table: for each (parameter_set, problem),
        records rederived_security_bits, discrepancy_bits, dominant_component.
        Includes CTRL-1 MLWE values and CTRL-2 BKZ sensitivity range if applicable.

  # ─────────────────────────────────────────────────────────────
  # INFERENCE PROVENANCE
  # ─────────────────────────────────────────────────────────────
  inference_provenance:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: amazon-bedrock/us.anthropic.claude-sonnet-4-6
    fallback_used: true
    model_verified: false
