        `completion_criteria` literally reads "(a) the census agrees... (b) an
        exceptional locus is exhibited... (c) a scoped instrument/protocol no-go
        is recorded" -- a derivation satisfies none of the three as written, and
        DEC-20260802-a51c82 (the decision that produced KN-FIND-c41ea9, the
        SAME batch's own more careful m=3 sibling) already ruled explicitly that
        a derivation does not meet this criterion and paused rather than closed
        the goal. KN-FIND-a1f3c2's "CLOSED" verdict contradicts that standing,
        dated, more careful record on the identical question without citing or
