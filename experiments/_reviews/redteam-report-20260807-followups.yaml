        Re-scopes KN-FIND-015 ("dual does not beat primal on Kyber under
        lattice-estimator") to "evidence about the public instrument, not about
        Carrier's coded-dual attack," on a source read finding zero code-based
        decoding terms in lattice-estimator at the pinned commit, with an FFT
