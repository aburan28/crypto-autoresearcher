    # ---- EV-FBST-8949fc / EV-FBST-394e55 (rank-deficiency exploit question) ----
    - target: EV-FBST-8949fc+EV-FBST-394e55
      text: >-
        NO NEW ATTACK-ACCELERATION EXPLOIT FOUND, AND THE DISENTANGLING CONTROL IS
        SOUND. I read the construction code directly. `smallest_x` sorts DL
        indices by (x-coordinate, ascending DL) -- since every non-identity point
        P and its negative -P share the same x-coordinate, the only place the
        DL-value tie-break can matter is the single boundary case where the
        cutoff at rank B lands exactly inside a +-P tie, which is a secret-
        independent, deterministic index comparison, not a source of bias
        correlated with anything an attacker would want. The three invariant
        constructions (uniform_random, sidon_dl, small_multiples) are seeded by a
        hash of (N,B,name) only, so their cross-curve invariance is a designed
        tautology the run confirms rather than an empirical discovery -- a sound
        way to isolate that `smallest_x` alone reads curve-specific arithmetic. An
        attacker running index calculus discovers rank-deficiency exactly when and
        only when they would need to (mid-Gaussian-elimination), at which point
        "collect more relations, preferentially targeting the exposed kernel
        direction" is already standard folklore practice, which the record
        correctly credits. I agree with the record's core judgement: this does
        not accelerate ECDLP.
      confirmed_by: >-
        experiments/EXP-FBST-190234/code/factorbase_stats.py lines 144-165
        (construction definitions), read directly.
    - target: EV-FBST-8949fc+EV-FBST-394e55
      text: >-
        THE "CANNOT PREDICT WITHOUT MEASURING" SUB-CLAIM IS ASSERTED, NOT TESTED.
        EV-FBST-394e55's boundaries state "no exploitable lever is identified"
        and EV-FBST-8949fc's inference states "nothing here shows how to predict,
        without measuring, which curves will have low coverage or rank-deficient
        bases." Both are stated as scope limitations, not as something the run
        actually checked. The already-collected RUN-FBST-190234-002 dataset (280
        curves across 7 target orders, each with a recorded (A,B) and a
        rank-deficient/full label) has not been mined for correlation against any
        cheaply-computable curve invariant -- j-invariant class, presence of
        extra automorphisms / small-discriminant CM, twist parity, or size of A
        vs B. If rank-deficiency correlated with such an invariant, that WOULD be
        a predictive lever -- not one that breaks ECDLP, but a real, if modest,
        operational one (cheaply pre-screening which of several equally-valid
        target representations offers a friendlier smallest-x factor base without
        running the expensive relation search first). This is a gap in what was
        actually tested, not a wrong conclusion; I judge the record's headline
        verdict ("no exploitable lever for solving DLP faster") likely correct on
        the mechanism as described, but "cannot predict without measuring" is
        currently an assertion, not a checked result, and it costs nothing further
        to check on data already in hand.

