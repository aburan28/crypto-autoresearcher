        disposition until that conflict is resolved on the merits.
      confirmed_by: >-
        ledger/evidence/EV-SMON-9c1c23.yaml unresolved_confounds and reviewed_by
        fields; ledger/goals/GOAL-MONO-001/goal.yaml completion_criteria field;
        ledger/decisions/DEC-20260802-a51c82.yaml rule_12_status and N-2 fields
        (all read directly).
    - target: CORR-20260807-652652
      text: >-
        NOT AN UNFAIR PROCEDURAL BAR AGAINST AN UNCONDITIONAL PROOF -- THE
        "DON'T REJECT CONDITIONAL THEOREMS FOR BEING CONDITIONAL" PRINCIPLE DOES
        NOT APPLY HERE, AND THE DISTINCTION MATTERS. That principle protects a
        result's TRUTH-VALUE from being penalized for resting on an explicit
        heuristic. Rule 12 and the goal's completion criterion are not about
        truth-value: they gate the DISPOSITION LANGUAGE ("closed") pending
        independent verification, and they apply with EQUAL force to a fully
        unconditional proof and a heuristic-conditional one -- an unreviewed
        unconditional proof is exactly as unreviewed as an unreviewed conditional
        one. This is a documentation-integrity gate, of the same kind as "never
        record an attestation you did not obtain" elsewhere in AGENTS.md, not a
        mathematical double standard. The correction gets this right: it leaves
        "THE MATHEMATICAL STATEMENT STANDS" completely intact and narrows only
        the disposition -- which is the narrowest valid conclusion available, not
        an overcorrection.
    - target: CORR-20260807-652652
      text: >-
        SPOT-CHECK OF THE SUPPLIED LEMMA AND ITS NUMBERS. I read
        papers/semaev-conservation-specialization/paper.tex Lemma 3.2
        ("Generic separability," lines 305-341, correctly numbered: Section 3 is
        "The structure theorem" and this is the second lemma in it) directly. The
        argument (each a_{S,eps} is a surjective homomorphism of group varieties,
        so its preimage of a finite subscheme is proper closed, and E^n's generic
        point lies in no proper closed subscheme) is coherent, is explicitly
        extended to characteristic 2 (Remark after the proof: "E[2]... only uses
        that it is finite, so no characteristic is excluded"), and matches what
        the correction describes as the missing step. I independently
        cross-checked the correction's cited degenerate-locus counts (962/8000 at
        m=4, 839/2000 at m=5) against
        experiments/EXP-SMON-e5cbe6/runs/RUN-SMON-e5cbe6-001/raw-result.json's
        C5_factor_base_locus block and they match exactly (m=3: 92/8000, m=4:
        962/8000, m=5: 839/2000). I did not referee the proof at specialist depth
        -- that is exactly the missing rule-12 review -- but found no internal
        inconsistency and the correction's citations are faithful to source.
      confirmed_by: >-
        papers/semaev-conservation-specialization/paper.tex lines 179-341 (section
        numbering, Lemma 3.2 text); experiments/EXP-SMON-e5cbe6/runs/RUN-SMON-e5cbe6-001/raw-result.json
