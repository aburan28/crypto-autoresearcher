  narrowest_supported_statement: >-
    (1) CORR-20260807-0021c7's re-measurement and its core claim -- that the
    functional FORM of C(p) is undetermined by any toy-scale data the corpus can
    produce -- are supported, and the point estimates it reports should be read
    strictly as "what a power law fits to if one is assumed," not as a settled
    replacement law; its attribution of a crypto-scale numeric conclusion to
    KN-FIND-5c1a03/f8c290 is not textually supported and should be softened or
    quoted precisely; and the correction understates rather than overstates the
    danger, because a genuine power-law C(p) would threaten the asymptotic
    complexity-class claim itself once m is allowed to grow with N, not merely
    inflate a point value at 2^256.
    (2) CORR-20260807-169c13's primary re-scoping of KN-FIND-015 to "evidence
    about the instrument" is supported by independent source verification. Its
    secondary claim that the MATZOV-headline residual is an unexplained live
    question is not yet supported: the residual was computed by comparing
    `dual_hybrid(fft=True)` (a hybrid construction) against MATZOV-2022's own
    number, not by comparing the estimator's own literal Theorem-7.6 object
    (`matzov`) against it, and that comparison has not been made.
    (3) CORR-20260807-652652's narrowing of "KN-OPEN-009 CLOSED" to "mathematical
    statement stands, disposition does not" is well-grounded on primary sources
    (EV-SMON-9c1c23's own disclosed review gap; GOAL-MONO-001's literal completion
    criteria; DEC-20260802-a51c82's prior, un-overturned ruling on the identical
    question) and is not an unfair procedural bar against an unconditional proof:
    the review gate binds conditional and unconditional results identically and
    is a documentation-integrity rule, not a truth-value penalty.
    (4) EV-FBST-8949fc/EV-FBST-394e55's "no exploitable lever for accelerating
    ECDLP" judgement is independently corroborated on the mechanism as described;
    its narrower "cannot predict without measuring" claim is an untested
    assertion, not a checked result, and should be read as a boundary awaiting a
    (cheap, already-available-data) test rather than as a closed question.

