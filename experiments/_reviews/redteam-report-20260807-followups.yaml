  objections:
    # ---- CORR-20260807-0021c7 (H-PSEUDO) ----
    - target: CORR-20260807-0021c7
      text: >-
        FITTING ASYMMETRY BETWEEN MODELS. hpseudo_scaling.py's compare_models()
        fits the power law by log-log OLS (minimizing log-space residual) but
        fits log/sqrt-log/constant by linear-space least squares, then reports
        ALL FOUR models' RMS in the same linear C-space. This is not an
        apples-to-apples optimization objective, so the "<0.002 RMS separation"
        headline compares a log-space-optimal power-law fit against three
        linear-space-optimal fits. It is not fatal to the qualitative claim --
        refitting the power law in linear space (e.g. scipy curve_fit) would very
        likely tighten its RMS further and REINFORCE indistinguishability, not
        undermine it -- but the correction should say this explicitly rather than
        present the 0.002 figure as a clean, symmetric comparison.
      confirmed_by: experiments/EXP-HPSC-74991c/code/hpseudo_scaling.py lines 261-292 (read directly)
    - target: CORR-20260807-0021c7
      text: >-
        SEVEN POINTS, 5 RESIDUAL DEGREES OF FREEDOM, CANNOT RESOLVE AN
        EXTRAPOLATION QUESTION. The correction's own thesis (H2) is that power
        law, log and sqrt-log diverge only ~240 bits past the fitted range. Given
        that, no amount of additional matched-sample-size measurement AT TOY
        SCALE -- more curves per prime, even a finer prime ladder within
        [1009,400009] -- can ever resolve which model is right, because the
        disagreement lives entirely outside the interpolation region. The
        correction states this in substance but should say it as a hard power
        limit of the experiment DESIGN, not as a result that a better toy-scale
        run could improve on.
      confirmed_by: >-
        H-HPSC-e76e8e.yaml quantifier_order field (explicitly scopes the claim to
        p in [1009,400009]) plus my own recomputation of the ratio
        sqrt(ln(2^256)*ln(ln(2^256))) vs ln(2)*256 vs (2^256)^0.03, which diverge
        by construction outside the sampled range.
    - target: CORR-20260807-0021c7
      text: >-
        POINT-ESTIMATE EXPONENTS RISK BEING READ AS "THE" CORRECTED LAW. The
        correction reports specific corrected values (C_max: 0.0334 CI
        [0.0261,0.0514]; C_mean: 0.0508 CI [0.0461,0.0552]) prominently, alongside
        its own, more important claim that a power-law exponent may not be a
        meaningful description of C(p) at all. A reader who stops at the numbers
        will walk away with "the true exponent is ~0.03-0.05," exactly the
        over-precise reading the correction's second half argues against. The
        numbers should be captioned as "what a power law fits to, IF a power law
        is assumed," not as a replacement scaling law.
    - target: CORR-20260807-0021c7
      text: >-
        ATTRIBUTION TO KN-FIND-5c1a03 / KN-FIND-f8c290 IS NOT TEXTUALLY SUPPORTED
        AS STATED. The correction writes: "as do KN-FIND-5c1a03 and KN-FIND-f8c290
        when they conclude that the yield error term is negligible at crypto
        scale." I read both records in full (they are short) and neither contains
        that conclusion in those or equivalent words. KN-FIND-5c1a03 is a
        structural three-way-convergence claim (Fourier flatness / Betti-Yield /
        quaternion structure) with no numeric yield-error language anywhere.
        KN-FIND-f8c290 is a TOY-SCALE (p=1009) achievability/tightness claim about
        a complexity CLASS, exp(c*sqrt(log N*log log N)), not a crypto-scale
        numeric assertion. I also checked their cited decision records
        (DEC-20260804-425827, -4f7da7, -bfbb09, -db75bb) by grep for
        "negligible|crypto.scale|2\^256|2\^-110" -- zero hits in all four. The
        sentence that DOES say this verbatim ("Yield error O(C^(m-2)*sqrt(m!)/
        sqrt(N)) is negligible at crypto scale") is in KN-FIND-e7a3b1, which the
        correction already lists under `corrects`. Attaching the identical charge
        to two records NOT in that list, without a direct quotation from either,
        overreaches. This should be tightened to cite exact language, or dropped
        for 5c1a03/f8c290 specifically -- note the correction does NOT add either
        to its formal `corrects:` list, so no field was actually altered on
        either record; only the prose narrative overreaches.
      confirmed_by: >-
        Direct read of knowledge/findings/KN-FIND-5c1a03.md, KN-FIND-f8c290.md,
        and grep -niE "yield|negligible|crypto.scale|2\^256|2\^-110" against
        ledger/decisions/DEC-20260804-{425827,4f7da7,bfbb09,db75bb}.yaml (no
        matches for the numeric-negligibility language).
    - target: CORR-20260807-0021c7
      text: >-
        CONVERSELY, THE CORRECTION UNDER-STATES ITS OWN STAKES. KN-FIND-d4f820's
        own "Significance" section gives the mechanism: the Semaev yield error is
        O(C(p)^(m-2) * B^(m/2) / N^(m/2+1/2)), i.e. C(p) enters raised to the
        power (m-2), where m is the arity of the Semaev summation polynomial. The
        asymptotic complexity claim KN-FIND-f8c290 asserts, exp(c*sqrt(log
        N*log log N)), is only reached in this algorithm family by letting m grow
        with N (this is intrinsic to how subexponential index calculus is built,
        not incidental). Under that regime, ANY genuine power-law growth in C(p)
        -- however small the exponent epsilon>0 -- makes C(p)^(m(N)-2) ~
        exp(epsilon*m(N)*ln p) eventually dominate exp(c*sqrt(ln p*ln ln p)) as
        N->infinity, because ln p grows faster than sqrt(ln p * ln ln p) for any
        fixed positive coefficient. That is not "the yield error is bigger than
        we'd like at 2^256" -- it is "the entire heuristic-conditional
        subexponential-complexity claim in KN-FIND-f8c290 may not be asymptotically
        well-posed if C(p) is a true power law." Under the log(p) or sqrt(log p)
        forms this failure mode does not arise. The correction's own hedge ("may
        well be correct... corpus does not have evidence for it") reads as
        softer than what its own cited mechanism implies. This is exactly the
        kind of o(1)/polylog-overhead-against-the-headline-exponent check my role
        requires, and it is currently absent from the corpus.
      confirmed_by: >-
        knowledge/findings/KN-FIND-d4f820.md "Significance" section (yield error
        formula), cross-read against KN-FIND-f8c290.md's complexity-class claim;
        the asymptotic dominance argument is my own derivation from those two
        cited formulas, not sourced from any existing record.
    - target: CORR-20260807-0021c7
      text: >-
        NO RANDOM-MODEL-TRANSFER CONTROL. F_t = {P : x(P) < t} is a coordinate-
        defined (structured) subset, not a genuinely random one -- the same
        obstruction KN-FIND-e7a3b1's own proof-attempts table names ("DL_G(P) is
        non-algebraic," Weil/Weyl/MV methods fail to apply). Neither the original
        corpus nor this correction runs the null-object control the target-result
        profile and inventor protocol both require: measure the identical
        four-model-comparison pipeline against a factor base drawn as a genuinely
        UNIFORM RANDOM B-subset of Z/N (independent of curve arithmetic) at the
        same seven (p,B) pairs, to confirm the pipeline actually recovers the
        textbook sqrt(B log N) law when that IS the ground truth, rather than
        failing to discriminate anything at this range regardless of what
        generates the data.

    # ---- CORR-20260807-169c13 (Kyber dual / lattice-estimator) ----
    - target: CORR-20260807-169c13
      text: >-
        PRIMARY DETERMINATION INDEPENDENTLY VERIFIED, SOUND. I re-fetched nothing
        new (the source is already archived under
        experiments/EXP-KDUAL-8f0b69/runs/RUN-KDUAL-8f0b69-001/source/) and read
        le_lwe_dual.py and le_reduction.py directly. MATZOV.cost() is exactly
        `rop = T_sample + T_guess` with T_guess a single enumeration*FFT product
        (no separate per-sample decoding term, no repetition factor R -- Carrier
        Theorem 4.1's T_dec and R have nowhere to attach). DualHybrid.fft_solver()
        (the actual "+fft" code path KN-FIND-015 used) is likewise a pure
        Walsh-Hadamard-transform + table-update cost with no decoding stage. The
        19 "list_decoding" hits in le_reduction.py are all BDGL16 nearest-
        neighbour sieving cost-model VARIANT NAMES (list_decoding-classical/dw/g/
        ge19/naive_classical/naive_quantum/t_count), confirmed by direct grep and
        line inspection, not code-based decoding. This is a structural read, not
        just a lexical absence, and it holds up.
      confirmed_by: >-
        Direct read of source/le_lwe_dual.py (MATZOV.cost, DualHybrid.fft_solver)
        and source/le_reduction.py lines 720-990 in this repository's own archived
        copy.
    - target: CORR-20260807-169c13
      text: >-
        THE "RESIDUAL NOT EXPLAINED" ESCALATION COMPARES THE WRONG OBJECT. The
        correction's raw-result.json says the 6.3/10.3/16.0-bit gap against
        MATZOV-2022's own headline is unexplained because "the estimator class in
        question is documented as implementing MATZOV Theorem 7.6." But
        lattice-estimator contains THREE distinct things that could be meant by
        that sentence, and they are not interchangeable: (1) `MATZOV` in
        le_lwe_dual.py, a standalone class whose `cost()` classmethod IS
        docstring-labeled "Theorem 7.6" and is callable directly via the
        module-level instance `matzov = MATZOV()`; (2) `dual_hybrid` in
        le_lwe_dual.py, the `DualHybrid`-class-based hybrid zeta-split attack with
        an OPTIONAL fft=True flag invoking [AC:GuoJoh21]'s FFT distinguisher --
        this is what KN-FIND-015 actually called; (3) `dual_hybrid` in le_lwe.py's
        `LWE.estimate` convenience API, which is a THIRD naming path that literally
        aliases to (1): `from .lwe_dual import matzov as dual_hybrid`. I traced
        EXP-MLKEM-015's actual reproduction script and confirmed it imports
        `from estimator.lwe_dual import dual_hybrid` -- object (2), NOT object
        (1). Object (2) is a hybrid construction (guess some coordinates via zeta,
        reduce the rest, FFT-distinguish) that is related to but not identical
        with Theorem 7.6's direct guess+FFT formula (object (1)). The correction
        never checks whether calling object (1) directly reproduces MATZOV-2022's
        headline more closely than object (2) does. If it does, the "residual" is
        an instrument-naming confusion in the SAME family as the one the
        correction itself just diagnosed for Carrier -- not "a question about
        whether the corpus can reproduce a published dual-attack cost at all," as
        the correction currently frames it.
      confirmed_by: >-
        experiments/EXP-MLKEM-015/implementation/reproduce_estimates.py line 16
        (`from estimator.lwe_dual import dual_hybrid`), cross-read against
        source/le_lwe_dual.py class MATZOV (line 496, docstring "Theorem 7.6",
        module instance `matzov = MATZOV()` at line 689) and source/le_lwe.py
        line 13 (`from .lwe_dual import matzov as dual_hybrid`).
    - target: CORR-20260807-169c13
      text: >-
        MINOR RECORD-HYGIENE INCONSISTENCY. EXP-KDUAL-8f0b69/specification.yaml
        declares `status: designed_not_run` ("cannot be run... requires SageMath"),
        while its own run's manifest.yaml declares `status:
        completed_primary_metric_only`. The primary metric (source read) plainly
