  counterexample_or_mutation: >-
    For CORR-20260807-0021c7: the sharpest available mutation is the null-object
    control above (uniform random B-subset run through the identical pipeline) --
    if the four-model comparison ALSO fails to discriminate a known sqrt(log N)
    ground truth from a spurious power-law fit at these same seven (p,B) pairs,
