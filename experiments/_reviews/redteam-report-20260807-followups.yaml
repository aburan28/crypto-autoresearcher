    # ---- CORR-20260807-652652 (KN-OPEN-009 disposition) ----
    - target: CORR-20260807-652652
      text: >-
        THE NARROWING IS WELL-GROUNDED, NOT OVERREACHING. I independently checked
        both grounds the correction gives. (i) EV-SMON-9c1c23.yaml, the paper's
        own companion evidence record, states `reviewed_by: none` and names lack
