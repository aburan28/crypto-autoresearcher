  id: VAL-20260807-4ce796
  task_id: none
  task_id_note: >-
    No Coordinator-issued TASK-* handoff exists for this review. It was requested directly
    by the top-level session under the same explicit user waiver that authorized the four
    producer runs below. Per operating instructions, this report gives genuine independent
    verification of artifact integrity, controls, and metrics; it does NOT retroactively
    grant Coordinator approval to EXP-HPSC-74991c, EXP-SMON-32339c, EXP-FBST-190234, or
    EXP-KDUAL-8f0b69, none of which were approved per AGENTS.md rule 1 / roles.yaml. Only a
    Coordinator can grant that approval. This report also does not satisfy AGENTS.md rule 12
    (independent review at closure) by itself, and is not a completion_quorum attestation.

  branch_reviewed: claude/semaev-monodromy-theorem-jjx29s
  snapshot_note: >-
    All four experiment directories, their run artifacts, and the five cited ledger/evidence
    and ledger/corrections records are committed and pushed on this branch; `git status`
    shows a clean working tree for every path checked. This is a committed snapshot, not a
    working-tree-only receipt, so it is admissible for review under the operating rules
    despite carrying no Coordinator task card.

  run_ids:
    - RUN-HPSC-74991c-001
    - RUN-SMON-32339c-001
    - RUN-FBST-190234-001
    - RUN-FBST-190234-002
    - RUN-KDUAL-8f0b69-001

  cross_cutting_findings:
    - >-
      AUTHORITY: EXP-HPSC-74991c, EXP-SMON-32339c, EXP-FBST-190234, and EXP-KDUAL-8f0b69 were
      all authored, run, and recorded by the top-level session with `approved_by: null` and
      `status: *_without_coordinator_approval` / `designed_not_run`, each self-disclosing
      this plainly. AGENTS.md rule 1 ("Only the Coordinator may change the official status of
      a hypothesis or research direction") is not met by any of the four. Beyond the
      experiment records themselves, H-SMON-db677d.yaml and H-FBST-c8a080.yaml were moved to
      `status: supported_scoped` / `confirmed_scoped` by the top-level session, also
      self-disclosed as not Coordinator-authorized. A Coordinator must review and either
      ratify, revise, or roll back these status fields before they are treated as official.
    - >-
      LEDGER CROSS-REFERENCE GAPS: H-KDUAL-d0ae7e.yaml's `evidence_ids` is `[]` even though
      EV-KDUAL-bd9750 exists, cites `hypothesis_id: H-KDUAL-d0ae7e`, and reports `strength:
      strong`; the hypothesis's `status` also remains `proposed`, unrevised. H-SMON-db677d.yaml's
      `experiment_ids`/`evidence_ids` list only `EXP-SMON-e5cbe6`/`EV-SMON-9c1c23` and were not
      extended to include EXP-SMON-32339c/EV-SMON-0213fa. These are bidirectional linkage gaps,
      not fabrications, but they leave the ledger internally inconsistent until a Coordinator
      ledger-commit reconciles them.
    - >-
      RESOURCE RECORDS: none of the five run manifests records peak memory, only
      `wall_clock_seconds` and `processes: 1`, despite AGENTS.md's artifact policy listing
      "resource measurements" as required. A minor, uniform gap across this batch.
    - >-
      CERTIFICATES: all five runs correctly declare `certificate: {kind: none}` with a note
      that no solve or relation is claimed, consistent with AGENTS.md rule 4 — no certificate
      is owed and none is fabricated.
    - >-
      Proof-architecture (`docs/inventor-protocol.md` §8 / KN-TECH-080) applies only where a
      theorem, bound, certificate family, reduction, or closure argument is proposed.
      H-SMON-db677d.yaml and H-HPSC-e76e8e.yaml both carry full `proof_search_map` blocks
      (baseline reproduction, observation-collision search, quantifier order, method ceiling
      with a nearby-object control); EXP-SMON-32339c is an arity extension of the SAME
      pre-mapped claim rather than a new proposal, so it is adequately covered by the existing
      map. H-FBST-c8a080.yaml and H-KDUAL-d0ae7e.yaml are empirical/audit hypotheses, not
      proof-oriented proposals in KN-TECH-080's sense, so `proof_search_map` is correctly
      absent rather than silently omitted.
    - >-
      Inventor-protocol §6 ladder (measured-ratio-against-baseline for a claimed speedup) does
      not apply to any of the four: none claims an asymptotic complexity improvement or
      algorithmic speedup. HPSC and FBST are measurement/model-comparison exercises; SMON is a
      theorem-verification extension; KDUAL is an instrument audit with an explicit
      no-security-claim boundary. Recorded as not_applicable rather than silently skipped.
    - >-
      Heuristic-validation checklist item 3 (correspondence validity, e.g. Deuring-style
      substitute sampling) is not_applicable to any of the four: none substitutes one sampling
      distribution for another under a cited distributional theorem. Checklist items 5-6
      (cost-unit honesty, cost bookkeeping) are also not_applicable: none of the four asserts a
      concrete attack-cost table. Checklist items 1, 2, and 4 (pre-registered prediction,
      sample integrity, scale binding) DO apply to HPSC, SMON, and FBST and are checked
      per-experiment below.

  # ======================================================================
  experiments:

    # ---------------------------------------------------------------- HPSC
    - experiment_id: EXP-HPSC-74991c
      run_ids: [RUN-HPSC-74991c-001]
      verdict: passed
      artifact_checks:
        - "path_sha256 for code/hpseudo_scaling.py, specification.yaml, and
          runs/RUN-HPSC-74991c-001/raw-result.json all recomputed and matched the manifest
          exactly (independent Python sha256 recomputation, not just `sha256sum -c`)."
        - "Manifest's code.commit (cff1b972...) is reachable in git and is the commit whose
          tree contains these exact bytes (`git cat-file -t` = commit; `git show
          cff1b972:...` content matches working tree)."
        - "REPRODUCED FROM SCRATCH: `python3 hpseudo_scaling.py --curves 24 --primes 1009
          4001 9001 50021 100003 200003 400009 --out ...` executed in the same environment
          (Python 3.11.15, numpy 2.4.6) in 29.55-29.69s (manifest: 26.17s, machine
          variance). Output raw-result.json byte-for-byte IDENTICAL (`diff` exit 0) to the
          committed artifact — full determinism confirmed, not just consistency."
      metric_recomputations:
        - "Per-prime C_mean/C_max values in raw JSON match EV-HPSC-a23ace OBS-1 to the
          quoted precision at all 7 primes (1009 through 400009)."
        - "Bootstrap 95% CIs in raw JSON (C_max [0.0261,0.0514], C_mean [0.0461,0.0552])
          match OBS-2 exactly; recorded_0.079_inside_ci is False for both, recorded_
          0.055_inside_ci is True for C_mean / False for C_max, matching the claimed
          asymmetric falsification exactly."
        - "INDEPENDENTLY RECOMPUTED (own script, not the repo's) the four-model RMS
          residuals from the raw per_prime C values via np.polyfit/np.linalg.lstsq: got
          C_mean {power 0.10075, log 0.09926, sqrt(log) 0.09958, constant 0.29138} and
          C_max {power 0.13628, log 0.13763, sqrt(log) 0.14083, constant 0.24808} —
          EXACT MATCH to the raw JSON and to EV-HPSC-a23ace OBS-3's rounded figures."
        - "2^256 extrapolations independently recomputed (2^(256*b) and sqrt(256*ln2))
          and match raw JSON / OBS-4 exactly (e.g. C_max power-law extrap 807.98,
          sqrt-log 9.4, log 20.0, recorded-0.079 extrap 1,224,703 — all reproduced)."
        - >-
          DISCREPANCY FOUND: EV-HPSC-a23ace OBS-3 and CORR-20260807-0021c7 state "The
          first three [models] are separated by under 0.002 RMS on seven points." This
          holds for C_mean (spread = 0.10075-0.09926 = 0.00149, under 0.002) but NOT for
          C_max (spread = 0.14083-0.13628 = 0.00455, more than double the stated bound).
          Every individual RMS number is correct and independently reproduced; the
          "under 0.002" characterization is an overstatement of tightness when read as
          applying to C_max. It does not change the substantive finding (three
          non-constant models remain far closer to each other, by a factor of ~1.8-2x,
          than to the constant model, and their 2^256 extrapolations still diverge by
          orders of magnitude) but should be corrected in EV-HPSC-a23ace.yaml, e.g. to
          "under 0.0015 RMS for the mean, under 0.0046 for the max."
      control_checks:
        - "MATCHED SAMPLE SIZE: confirmed 24 curves at every one of 7 primes in raw JSON."
        - "FULL k-RANGE: confirmed in code (constant_C zeroes only spec[0], takes max over
          the full FFT output, no truncation)."
        - "INDEPENDENT ORDER CHECK: `_order_is_correct` performs scalar multiplication via
          a separate code path (`_scalar_mul`/`_padd`) from the direct-enumeration
          `curve_order` used to compute N — genuinely independent verification, not the
          same function called twice."
        - "WALK-COVERAGE GATE: an `AssertionError` would have been raised and the run would
          have failed (exit != 0) had any curve's |F|/N fallen outside (0.3, 0.7); the
          rerun completed with exit 0, confirming the gate held for all 168 curves (24 x
          7 primes) without needing to trust a self-reported flag."
        - "NULL-OBJECT CONTROL (constant/no-growth model) behaves as required: RMS 0.248-
          0.291, decisively (roughly 2x) worse than any of the three growth models for
          both statistics — the comparison discriminates when there is something to find,
          which is the check the operating rules ask for."
      heuristic_validation_checks:
        - "Pre-registered prediction: YES — the specification cites KN-FIND-4c9e71 /
          KN-FIND-d4f820 / KN-FIND-e7a3b1 as the source of the 0.079/0.055 predictions,
          written into specification.yaml before this run, not fit post hoc."
        - "Sample integrity: seed (20260807), sample size (24/prime x 7 primes), and
          sampling procedure are all in manifest.yaml and reproduced exactly on rerun; the
          empirical statistics were recomputed here from raw per-prime C_values, not
          copied from the evidence record."
        - "Correspondence validity: not_applicable (direct curve enumeration, no
          substitute sampler)."
        - "Scale binding: correctly recorded as toy tier with an explicit ~9-bit-to-256-bit
          extrapolation-ratio caveat; not presented as crypto-scale evidence (AGENTS rule 7
          respected)."
      limitations:
        - "One implementation, one seed, one session; no independent review obtained
          (self-disclosed, AGENTS rule 12 not met)."
        - "The 'under 0.002 RMS' prose overstatement for C_max, described above, should be
          corrected in a superseding note to EV-HPSC-a23ace.yaml."
        - "This says nothing about H-PSEUDO's truth, and nothing about ECDLP hardness in
          either direction — both already correctly disclaimed in the evidence record."
      artifact_paths:
        - experiments/EXP-HPSC-74991c/specification.yaml
        - experiments/EXP-HPSC-74991c/code/hpseudo_scaling.py
        - experiments/EXP-HPSC-74991c/runs/RUN-HPSC-74991c-001/manifest.yaml
        - experiments/EXP-HPSC-74991c/runs/RUN-HPSC-74991c-001/raw-result.json
        - ledger/evidence/EV-HPSC-a23ace.yaml
        - ledger/corrections/CORR-20260807-0021c7.yaml

