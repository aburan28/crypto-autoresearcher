    - experiment_id: EXP-FBST-190234
      run_ids: [RUN-FBST-190234-001, RUN-FBST-190234-002]
      verdict: passed
      artifact_checks:
        - "RUN-FBST-190234-001: path_sha256 for code/factorbase_stats.py and
          raw-result.json matched exactly; specification.yaml's manifest-recorded hash did
