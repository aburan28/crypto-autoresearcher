          at B=24, non-overlapping CIs, independently confirmed above. This is the
          'parameter meant to destroy the effect' check and the effect does decay as
          expected, which argues against an artifact reading of the smallest_x finding."
        - >-
          GAP FOUND: specification.yaml's `controls:` section calls for a "SHUFFLED-BASE
          NULL: for each structured construction, a size-matched base drawn uniformly from
          the same rational points" — i.e., a null paired 1:1 with each structured
          construction. As implemented, only a single generic `uniform_random`
          construction exists in the four-construction list; it is not instantiated
