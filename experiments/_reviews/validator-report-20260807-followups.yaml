          defensible and consistently-applied convention (the commit that snapshots a run's
          own artifacts cannot exist yet when the run executes), not an error."
        - "REPRODUCED FROM SCRATCH, RUN 001: `python3 factorbase_stats.py --primes 1009
          2003 4001 --Bs 16 24 32 48 --curves-per-cell 100 --out ...` completed in ~15.0s
          (manifest: 16.18s), output byte-for-byte IDENTICAL to committed raw-result.json,
          `cells=4200 gate_failures=0` printed to stderr matching the manifest's outcome."
        - "REPRODUCED FROM SCRATCH, RUN 002: `python3 deepen_same_N.py --p 4001
          --scout-samples 4000 --top-k 3 --extra-targets 3919 3947 4007 4021 4099 --depth
          40 --max-trials-per-target 60000 --Bs 16 24 --out ...` completed in ~14.5s
          (manifest: 26.7s — machine variance only; determinism confirmed by identical
          output), output byte-for-byte IDENTICAL to committed raw-result.json, including
          per-target trial counts (9710-20998, matching EV-FBST-394e55 OBS-1's stated
          range exactly)."
      metric_recomputations:
        - "POSITIVE CONTROL: independently recomputed max|mean - B^3/N| across all 4200
          per-curve cells directly from raw JSON (not trusting the script's own
          `mean_control_ok` flag) — max deviation across all cells is EXACTLY 0.0 (float
          identical, not merely <1e-6). `gate_all_passed: true` and zero entries in
          `gate_failures` confirmed."
        - "DISENTANGLING (claim b), run 001: independently regrouped all 4200 per-curve
          cells by exact (N, B, construction) from scratch (own script, not the shipped
          summary) — recovered 848 repeat groups, 240 of them `smallest_x`, matching the
          raw JSON exactly. For the 608 non-smallest_x groups (uniform_random, sidon_dl,
          small_multiples pooled), coverage and relation_rank differed in ZERO of 608 —
          full, not partial, invariance. For smallest_x, 212/240 groups differed in
          coverage and 5/240 (all at B=16) differed in relation rank — exact match to
          EV-FBST-8949fc OBS-2-OBS-4."
        - "Coverage-spread statistics (median 0.031, mean 0.045, max 0.238 at N=1049,B=24)
          were INITIALLY not reproduced when computed over all 240 smallest_x groups
          (got median 0.024, mean 0.040); tracing the discrepancy showed the reported
          figures are computed over the 212 DIFFERING groups only (28 of 240 happened to
          coincide despite smallest_x not being guaranteed invariant) — recomputing over
          exactly that 212-group subset reproduces median 0.0309, mean 0.045, max 0.2383
          EXACTLY. Confirmed correct once the intended denominator was identified; not a
          fabrication, but the evidence record does not state which denominator (240 vs
          212) it used, which cost real verification time and should be made explicit in
          any future revision."
        - "DISENTANGLING (claim b), run 002: independently recomputed pooled invariance for
          uniform_random/sidon_dl/small_multiples across all 7 targets x 40 curves x 2 B
          values from raw JSON's `summary` block — `coverage_identical`/`rank_identical`
          True for all three constructions at both B=16 and B=24, zero exceptions across
          280 curves per construction, matching EV-FBST-394e55 OBS-2 exactly."
        - "Pooled deficiency rates, run 002: independently summed `rank_deficient_count`
          over all 7 targets from raw JSON — 14/280 = 5.00% at B=16 and 1/280 = 0.36% at
          B=24, matching OBS-3/OBS-4 exactly. Per-target rates (2.5/0.0/12.5/7.5/5.0/5.0/
          2.5% at B=16) also match exactly."
        - "WILSON 95% CI INDEPENDENTLY RECOMPUTED from the standard Wilson score formula
          (z=1.959963984540054) for both pooled rates: 14/280 -> [3.001%, 8.217%] (matches
          claimed [3.0%, 8.2%] exactly); 1/280 -> [0.063%, 1.995%] (matches claimed
          [0.06%, 2.0%] exactly). The arithmetic is correct, not merely asserted."
        - "Non-overlap check: B=16 CI lower bound (3.0%) exceeds B=24 CI upper bound (2.0%),
          confirming the claimed non-overlap and the 'this is a real drop, not noise'
          inference is arithmetically supported."
      control_checks:
        - "Positive control (mean-yield): exact-to-float-precision, held everywhere — see
          metric_recomputations. This is the single most important control per the
          specification's own text ('if the instrument reports variation in the mean, the
          instrument is broken and every other number in the run is void') and it passes
          decisively."
        - "NULL-OBJECT / DISENTANGLING CONTROL: uniform_random, sidon_dl, and
          small_multiples — the three constructions that read only N, never curve
          arithmetic — show EXACTLY ZERO variance across every group sharing an exact N,
          in BOTH runs, at both incidental depth (2-14 curves/group, run 001) and hunted
          depth (40 curves/group, run 002). This is the canonical 'quantity that must not
          show a signal' check the operating rules require, and it is satisfied exactly
          (not 'small' variance — literally zero, confirmed by independent set-cardinality
