          test) and this is correctly disclosed as such, not presented as an independent
          replication."
        - "Sample integrity: seeds (20260807 run 001, 20260808 run 002 — correctly
          distinct, documented as 'a follow-up, not a rerun'), sample sizes, and procedure
          all in the manifests and reproduced exactly on rerun."
        - "Scale binding: correctly toy-tier (N up to ~4099, one prime for run 002); the
          'no exploitable lever' and 'nothing here bears on ECDLP hardness' disclaimers are
          present and appropriately worded in both evidence records."
      limitations:
        - "No independent review obtained (AGENTS rule 12 not met, self-disclosed in both
          runs)."
        - "The prediction 'relation rank is the statistic most likely to show curve
          dependence' was falsified in favor of coverage (which varies far more often);
          this is correctly reported as a falsified sub-prediction within an otherwise-
          confirmed disjunctive claim, not smoothed over — H-FBST-c8a080's own status_note
          says so explicitly."
        - "Run 002's 7 targets are all close together (within ~5% of each other) at one
          prime; no claim about how the ~5%/~0.4% rates scale with N is supported, and none
