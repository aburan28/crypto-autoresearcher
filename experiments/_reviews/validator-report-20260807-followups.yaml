        - "The shuffled-base-null and required_artifacts gaps noted above should be
          corrected in a specification revision."
      artifact_paths:
        - experiments/EXP-FBST-190234/specification.yaml
        - experiments/EXP-FBST-190234/code/factorbase_stats.py
        - experiments/EXP-FBST-190234/code/deepen_same_N.py
        - experiments/EXP-FBST-190234/runs/RUN-FBST-190234-001/manifest.yaml
        - experiments/EXP-FBST-190234/runs/RUN-FBST-190234-001/raw-result.json
        - experiments/EXP-FBST-190234/runs/RUN-FBST-190234-002/manifest.yaml
        - experiments/EXP-FBST-190234/runs/RUN-FBST-190234-002/raw-result.json
        - ledger/evidence/EV-FBST-8949fc.yaml
        - ledger/evidence/EV-FBST-394e55.yaml

