      heuristic_validation_checks:
        - "Pre-registered prediction: YES for both runs — run 001's predictions (mean-yield
          exactly invariant; relation rank most likely to show curve dependence) are from
          KN-FIND-007/KN-FIND-a8990a, prior to this measurement; run 002's targets were
