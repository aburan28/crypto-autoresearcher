# of EXP-BINSTD-ff5050 for H-BINSTD-ce918e after EV-BINSTD-0fed43 /
# DEC-20261003-e86acd (decision: refine) and EV-BINSTD-375f15.
# One frozen contract admitting:
#   Stage 0  — re-freeze pin/(α,M₀) + new catalog_seed + baseline/allocator probes
#   Stage 1  — delta-RSS panels at n=17 ℓ∈{3,4,5,6} with instrument_clears_floor gate
# No parent re-run. No AUXIN. No Bedrock. No break / exponent / n≥131 transfer.
# No support / KN-FIND claim in this design packet.
# =============================================================================
experiment:
  id: EXP-BINSTD-eb9e5e
  hypothesis_id: H-BINSTD-ce918e
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-20561e
  goal_id: GOAL-ECDLP2M-001
  successor_of: EXP-BINSTD-ff5050
  cites_evidence:
    - EV-BINSTD-0fed43
    - EV-BINSTD-375f15
  cites_decision: DEC-20261003-e86acd
  version: 1
  title: >-
    Delta-RSS / allocator-probe refine above OS RSS floor for H-BINSTD-ce918e
  status: analyzed
  status_note: >-
    Evidence review EV-BINSTD-cd47a8 / DEC-20261003-495a2e: Stages 0–1 valid;
    Stage-1 O-INCONCLUSIVE (instrument_clears_floor=false). Decision
    inconclusive. approved→analyzed. Frozen contract bytes otherwise unchanged.
  approved_by: DEC-20261003-53838e
  approved_at: '2026-10-03'
  analyzed_by: DEC-20261003-495a2e
  analyzed_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0 and 1 authorized by DEC-20261003-53838e under AGENTS.md standing
    user authorization (2026-09-06), discharging NA-1 of DEC-20261003-e86acd /
    EV-BINSTD-0fed43. No Magma/Sage/AUXIN/Bedrock. No ECC2K-130 solve. No
    n>=131 attack. No re-run of EXP-BINSTD-ff5050 or EXP-BINSTD-cb15a4.
  approval:
    approved_by: DEC-20261003-53838e
    composing_decision: DEC-20261003-53838e
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete. Approval does not assert the hypothesis is
      true. Stages 0–1 authorized. Cites EV-BINSTD-0fed43 / EV-BINSTD-375f15.
      Does not claim support or authorize KN-FIND.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes inherited (α,M₀)=(1.0,16777216), XOR-SAT pin, new
      catalog_seed=2026100343342, process-isolated baseline + allocator probe.
      Stage 1 measures baseline-subtracted delta_rss at n=17 ℓ∈{3,4,5,6}.
      No Magma/Sage/AUXIN/Bedrock. No ECDLP solve. No parent re-run.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Refine the memory instrument so encode+solve working-set growth can be
    separated from the ≈30 MiB OS RSS floor observed in EV-BINSTD-0fed43 /
    EV-BINSTD-375f15 (process-isolated baseline-subtracted delta-RSS +
    allocator calibration + larger ℓ cells), then re-test the inherited peak
    band — before any support / KN-FIND reading of H-BINSTD-ce918e.

  class: heuristic_validation
  class_note: >-
    Instrument-refine package for a memory heuristic. Not an exponent-moving
    breakthrough; no ECDLP attack table; no support claim this tick.

  scope:
    included:
      - >-
        Stage 0. Freeze V family for Stage-1 cells; inherit (α,M₀) and XOR-SAT
        pin; new catalog_seed; process-isolated baseline repeats →
        os_rss_floor_bytes; allocator probes at 2/8/16 MiB with
        recovery_frac≥0.5 on the largest; twin check.
      - >-
        Stage 1. For (n,ℓ)∈{(17,3),(17,4),(17,5),(17,6)} measure
        process-isolated baseline and encode+solve peaks; report
        delta_rss_bytes; write stage1/panels.json, stage1/control-table.json,
        RESULTS.md with exactly one O-*.
    excluded:
      - Re-run of EXP-BINSTD-ff5050 or EXP-BINSTD-cb15a4 frozen packages
      - Magma / Sage / AUXIN / Amazon Bedrock
      - Deployed-curve attack, break claim, exponent move, n≥131 transfer
      - support / KN-FIND promotion in this design or run package

  inputs:
    parent_experiments: [EXP-BINSTD-ff5050, EXP-BINSTD-cb15a4]
    evidence: [EV-BINSTD-0fed43, EV-BINSTD-375f15]
    decisions: [DEC-20261003-e86acd, DEC-20261003-c14256, DEC-20261003-953dd5]
    idea: IDEA-20261001-20561e
    hypothesis: H-BINSTD-ce918e
    frozen_parameters:
      alpha: 1.0
      M0_bytes: 16777216
      catalog_seed: 2026100343342
      parent_catalog_seed: 2026100375050
      clear_floor_delta_bytes: 262144
      clear_floor_margin_bytes: 524288

  controls:
    - id: twin_N_var
      description: Twin encode paths A/B must agree on N_var for every measured V.
    - id: process_isolated_baseline
      description: >-
        Baseline worker (Field import only) and encode worker run in separate
        fresh subprocesses; delta_rss = max(0, encode_peak - baseline_peak).
    - id: allocator_probe
      description: >-
        Stage-0 known bytearray allocations must recover ≥50% of the largest
        probe size in delta-RSS, else O-IMPEDIMENT (instrument dead).
    - id: inherited_band
      description: peak_rss ≤ M0·2^{α·ℓ} continuity with EV-BINSTD-0fed43 / 375f15.
    - id: no_parent_rerun
      description: Do not execute ff5050 or cb15a4 trial plans.

  independent_variables:
    - name: ell
      levels: [3, 4, 5, 6]
    - name: n
      levels: [17]
    - name: rss_instrument
      levels: [process_isolated_delta]

  metrics:
    primary:
      - name: delta_rss_bytes
        unit: bytes
        definition: >-
          max(0, process-isolated encode+solve peak_rss - process-isolated
          baseline peak_rss).
      - name: peak_rss_bytes
        unit: bytes
        definition: Child-process peak RSS of encode+solve (continuity).
      - name: band_holds
        unit: boolean
        definition: peak_rss_bytes ≤ M0_bytes · 2^(alpha · ell).
      - name: instrument_clears_floor
        unit: boolean
        definition: >-
          median(delta_rss) ≥ 262144 OR (max encode_peak - os_rss_floor) ≥ 524288.
      - name: twin_agreement
        unit: boolean
        definition: Twin N_var meters agree on every measured V.
    secondary:
      - name: os_rss_floor_bytes
        unit: bytes
      - name: floor_dominant_delta
        unit: boolean
      - name: delta_ell_spread
        unit: ratio
      - name: allocator_ok
        unit: boolean
      - name: N_var
        unit: integer
      - name: wall_clock_seconds
        unit: seconds

  heuristic_under_test: HEUR-BINSTD-20561e-H1

  preregistered_prediction:
    quantity: >-
      Process-isolated peak_rss(encode+solve) ≤ M₀·2^{α·ℓ} on Stage-1 cells
      after twin agreement, with (α,M₀)=(1.0, 16777216) and catalog_seed
      2026100343342; primary instrument is baseline-subtracted delta_rss with
      Stage-0 allocator calibration; instrument_clears_floor gates any
      mechanism reading of the band.
    formula: >-
      band_bytes(ell) = 16777216 * 2**(1.0 * ell);
      delta_rss = max(0, encode_peak - baseline_peak);
      peaks from child process resource.getrusage(RUSAGE_SELF).ru_maxrss * 1024.
    source: >-
      EV-BINSTD-0fed43 / DEC-20261003-e86acd NA-1; EV-BINSTD-375f15;
      IDEA-20261001-20561e; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Memory instrument on n=17, ℓ≤6 only under this card. No transfer of a RSS
      band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids band claims (O-ARTIFACT).
    - RSS probe / allocator calibration failure → O-IMPEDIMENT (not O-SUPPORT).
    - instrument_clears_floor=false OR floor_dominant_delta=true → O-INCONCLUSIVE
      for mechanism reading even if peak band holds (diagnostic, not O-FAIL-BAND).
    - floor_dominant from EV-BINSTD-0fed43 blocks support/KN-FIND until this
      refine clears the instrument gate.

  seeds_and_replication:
    catalog_seed: 2026100343342
    parent_catalog_seed: 2026100375050
    v1_catalog_seed: 202610032056
    independent_instances: 4
    note: >-
      Stage-1 cells (17,3)/(17,4)/(17,5)/(17,6) under new seed and delta-RSS.
      Twin meters remain the per-V replication instrument.

  stopping_rules:
    - Stage 0 O-IMPEDIMENT / O-ARTIFACT stops Stage 1.
    - maximum_runs: 4
    - No Bedrock/AUXIN under any stop.

  invalidation_rules:
    - Editing (α,M₀) after Stage-0 freeze.
    - Non-isolated RSS measurement for Stage-1 panels.
    - Re-running parent packages under this card.
    - Claiming break / exponent / n≥131 / support / KN-FIND from this package.

  success_criterion: >-
    Exactly one of O-SUPPORT / O-FAIL-BAND / O-INCONCLUSIVE / O-ARTIFACT /
    O-IMPEDIMENT on Stage 1, with Stage-0 freeze twin_ok + rss_probe_ok +
    allocator_ok (or named impediment). O-SUPPORT requires peak band hold AND
    instrument_clears_floor AND not floor_dominant_delta. Does not assert
    hypothesis support or authorize KN-FIND.

  falsification_criterion: >-
    O-FAIL-BAND: instrument_clears_floor true and peak_rss > band on at least
    one Stage-1 cell. O-INCONCLUSIVE when the instrument still cannot clear
    the OS floor (honest refine outcome, not band falsification).

  required_artifacts:
    - experiments/EXP-BINSTD-eb9e5e/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-eb9e5e/stage0/v-catalog.json
    - experiments/EXP-BINSTD-eb9e5e/stage1/panels.json
    - experiments/EXP-BINSTD-eb9e5e/stage1/control-table.json
    - experiments/EXP-BINSTD-eb9e5e/RESULTS.md
    - experiments/EXP-BINSTD-eb9e5e/runs/RUN-BINSTD-f0b4ee/
    - experiments/EXP-BINSTD-eb9e5e/runs/RUN-BINSTD-b819fc/

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    maximum_memory_gb: 2
    maximum_runs: 4

  assigned_to: executor
  trial_plan: experiments/EXP-BINSTD-eb9e5e/trial-plan-v1.json
  amazon_bedrock: NOT SELECTED
