    doubling-Jacobian chain-rule calibrator.

  objective: >
    Evaluate the exact identity that on
    p=19, A=1, B=-1, P=(2,3) one has
    det D[4]_P = 4 = det D[2]_{[2]P} *
    det D[2]_P, and rejects the nearby
    claim that det D[4]=1, on one
    frozen family (REAL, KF, NULL).
    Stage 0 does not form a real Gamma
    orbit, does not run a unary-closure
    census, and does not authorize
    Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL has
      det D[2]_P=2, det D[2]_{[2]P}=2,
      det D[4]_P=4; KF constant claim
      rejected because det D[4]=4;
      NULL empty matrix rejected; y=0
      rejected. Certificate kind none.
    formula: >
      Affine doubling Jacobian by
      formal differentiation. REAL:
      J1=[[13,12],[3,0]],
      J2=[[0,7],[16,14]],
      J4=J2 J1=[[2,0],[3,2]],
      det1=2, det2=2, det4=4.
      KF: claim det4=1, actual 4,
      rejected as a generic
      doubling-Jacobian target.
    claim_tier: observational

  inputs:
    fixture:
      real_curve:
        p: 19
        A: 1
        B: -1
        P: [2, 3]
        P2: [16, 11]
        P4: [15, 11]
        must_det1: 2
        must_det2: 2
        must_det4: 4
        must_J1: [[13, 12], [3, 0]]
        must_J2: [[0, 7], [16, 14]]
        must_J4: [[2, 0], [3, 2]]
      known_false:
        kind: constant_det4
        claimed_det4: 1
        must_det4: 4
        must_reject: true
      matched_null:
        kind: empty_matrix
        must_reject: true
      invalid:
        - {y_zero: true, point: [2, 0], must_reject: true}

  controls:
    - name: known_false_constant
      object: KF claim det D[4] equals 1
    - name: matched_null
      object: empty matrix
    - name: invalid_y_zero
      object: y=0 doubling input

  independent_variables:
    - point
    - affine_chart
  metrics:
    primary:
      - fixture_pass
      - real_chain_rule_pass
      - known_false_constant_pass
      - reject_invalid_pass
      - null_empty_pass
    secondary: []
  primary_metrics:
