experiment:
  id: EXP-SNFS-ad6ec4
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-4791a4; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-4791a4
  question_id: RQ-SNFS-005666
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Derive and exhaustively falsify the admissible base interval for the special-form class C(d,H),
    and tabulate the resulting complete-detector cost exponent against degree and modulus size
  objective: 'The one uncertainty a run reduces is whether the trivial complete detector for C(d,H)
    has the cost this proposal derives, which is the quantity that converts the inherited phrase into
    a proposition. (i) Is the derived admissible base interval correct: over an exhaustive enumeration
    of witnesses at 20, 24 and 28 bits, does every witness base lie inside the interval derived from
    p, d and H alone, and does a deliberately shifted interval fail, proving the containment check
    has power. (ii) Is the interval tight enough to be the operative cost: what fraction of the derived
    interval actually contains realised witness bases, since an interval that is correct but ten times
    too long converts into a detector cost ten times too high and would make the headline exponent
    an overstatement rather than a measurement. (iii) Does the interval distinguish the constrained
    class from the unconstrained null: when H is raised until the class is essentially all primes,
    does the interval degenerate and the witness count per prime explode as predicted, or does it
    look the same as the constrained case, in which case the exponent is an artifact of how the class
    was parameterised and not a property of speciality. All three are answered from a single exhaustive
    enumeration that costs under a minute per cell and requires no sampling, no threshold and no statistical
    model.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal claim a run could support is: for the class C(d,H)
      as defined here, every witness base among the exhaustively enumerated instances at the tested
      sizes lies in the derived interval, whose length is as computed, so the trivial complete detector
      costs about 2^(n/d) reductions with the stated constant, and the interval is tight to the measured
      ratio. What does NOT follow: nothing about whether a better detector exists, nothing about any
      prime or parameter set outside this class, nothing about feasibility for any actual party, and
      no statement that the inherited phrase is correct or incorrect.'
  inputs:
    procedure: 'STAGE 0, zero compute, hours of human time: derive the interval endpoints and the
      remainder bound, and record the derivation before any code runs. STAGE 1, minutes: implement
      the exhaustive enumerator over all degree-d polynomials with coefficients in [-H,H] and all
      bases m, retaining pairs whose value is an n-bit prime. STAGE 2, under a minute per cell: run
      the enumeration for each (d,H,n) cell and record every witness with its base. STAGE 3, seconds:
      run the containment check and record the fraction, plus the shifted-interval power control.
      STAGE 4, seconds: compute the tightness ratio and the per-prime witness count distribution.
      STAGE 5, minutes: repeat STAGES 2 to 4 for the unconstrained-H null class. STAGE 6, seconds:
      recompute all endpoints with integer-only arithmetic and compare. STAGE 7, seconds: emit the
      cost table over the declared (n,d) grid, purely arithmetic, and the run manifest.'
    instrument: 'Pure Python 3.11 standard library only, verified: no numpy, no sympy, no gmpy2, no
      fpylll available in this environment, and Sage is excluded by contract. Integer nth roots via
      a self-contained integer Newton iteration so that no floating point enters the endpoint computation
      on the primary path, with a floating-point version retained only as the control that the integer
      path is checked against. Miller-Rabin over random and pow for primality. A new module harness/snfs_interval.py
      holds the enumerator, the endpoint derivation and the checks; harness/runner.py records the
      manifest.'
    parameters: 'Degrees d in {2,3,4,5}. Coefficient bounds H in {4,8,16} for the constrained class
      and H = 2^(n/d) rounded down for the unconstrained null. Prime bit sizes n in {20,24,28}. Bases
      m from 2 up to the largest value with f(m) below 2^(n+1). Full enumeration, so no sample size:
      every pair in the box is visited, giving at most (2H+1)^(d+1) polynomials per cell. Cost table
      computed for n in {20,24,28,64,256,1024,2048} and d in {2,...,8}, arithmetic only.'
  controls:
  - The unconstrained-H null class, run through the identical derivation and identical enumeration.
  - 'An off-by-one control: deliberately shift the derived interval endpoints inward by one and confirm
    that the containment check then fails, proving the check has power.'
  - 'A degree-mismatch control: score degree-3 witnesses against the degree-4 interval to confirm
    the interval is degree-sensitive.'
  - An independent recomputation of the interval endpoints using integer arithmetic only, no floating
    point, to rule out rounding as the source of any containment failure.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is the class with no smallness constraint, H set to
    the largest coefficient the construction permits, so that C(d,H) becomes essentially all primes.
    Running the identical interval derivation and the identical exhaustive toy enumeration on that
    class must show the interval degenerating to cover the entire admissible range and the exhaustive
    count of witness bases per prime rising to the point where membership carries no information.
    If the derived interval and the measured witness counts look the same for the constrained and
    the unconstrained class, the interval is not tracking speciality and the whole cost exponent is
    an artifact of the parameterisation rather than of the trapdoor.'
  independent_variables:
  - degree d
  - coefficient bound H
  - prime bit size n
  - constrained versus unconstrained class
  metrics:
    primary:
    - containment fraction of witness bases in the derived interval
    - derived interval length in log2
    - tightness ratio of realised span to derived length
    - witnesses per prime distribution
    - containment fraction under the deliberately shifted interval
    secondary:
    - enumerated pair count per cell
    - prime yield per enumerated pair
    - integer-versus-floating-point endpoint discrepancy
    - wall-clock seconds per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The containment fraction, that is the proportion of exhaustively enumerated witness
      bases m that satisfy L(p,d,H) <= m <= U(p,d,H) for the interval endpoints derived at STAGE 0.
    formula: U(p,d,H) = floor(p^(1/d)) and L(p,d,H) = ceil((p / (H * (1 + 1/(m_0 - 1))))^(1/d)) evaluated
      with the self-consistent m_0 from one fixed-point iteration, where the correction term bounds
      the total contribution of the d lower-order coefficients by H(m^d - 1)/(m - 1). The predicted
      containment fraction is exactly 1.0, and the predicted log2 interval length is n/d - log2 of
      the H-dependent floor factor.
    source: Pre-registered in the parent proposal IDEA-20260816-4791a4 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Exhaustive enumeration is only possible at 20 to 28 bits with coefficient bounds
      up to 16, and those are the sizes used for the containment and tightness measurements. The extrapolated
      part is explicitly separated: the cost table at 64 to 2048 bits is arithmetic evaluation of
      a formula, carries no measurement, and is labelled as such. The single transfer assumption is
      that the interval derivation is an identity in the leading term with a bounded remainder and
      therefore does not depend on n; that assumption is exactly what the toy containment check tests,
      and it is stated rather than assumed silently.'
    correspondence: null
  tail_checks:
  - Inspect witnesses whose base sits within one unit of either endpoint, since those are where the
    remainder bound is doing all the work.
  - Inspect primes with the largest witness counts, which indicate the class is degenerating toward
    the null.
  - Inspect the smallest bases in each cell, where the asymptotic reading of the interval is weakest.
  - Check the cells where prime yield is lowest for enumeration bugs rather than genuine scarcity.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt immediately and record a refutation if any witness base falls outside the derived interval;
    no further cells are needed.
  - Halt a cell if enumeration exceeds 300 seconds and record it as budget-truncated rather than as
    a result.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Every cell reports its containment fraction, its tightness ratio and its witness-per-prime
    distribution, the shifted-interval control demonstrates the check has power, and the cost table
    is emitted with its measured versus extrapolated parts clearly separated.
  falsification_criterion:
  - A single witness base outside the derived interval refutes the interval and the stated exponent.
  - The shifted-interval control still shows full containment, meaning the check cannot detect a wrong
    interval.
  - Constrained and unconstrained classes produce indistinguishable interval lengths, meaning the
    exponent does not track speciality.
  - Integer and floating-point endpoint computations disagree by more than one unit anywhere.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-4791a4
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The endpoint L involves a self-referential correction and the Coordinator must approve the fixed-point
    iteration used to resolve it, or replace it with a cruder but unconditional bound.
  - Whether the lattice-reduction step is genuinely sufficient to decide per-base membership at rank
    d+1 for all H in scope is asserted here and needs either a proof or a measured correction factor
    before the cost table is quoted.
  - The cost table couples detection cost to the sieve advantage of the same degree, and the advantage
    side is not derived in this contract; it must come from a separate norm-gap computation before
    the crossing region can be stated.
