# EXP-CERTBIN-a4217c
# Ceiling-cross arithmetic. No sumset is enumerated.
# Approved by DEC-20261003-47eb93.
experiment:
  id: EXP-CERTBIN-a4217c
  hypothesis_id: H-CERTBIN-0c5608
  source_idea: IDEA-20260930-f1d8ff
  question_id: RQ-CERTBIN-836ce2
  version: 1
  title: Written ceilings versus the two counts
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-47eb93
  objective: >-
    Check the cross 10784024, the cap 10000000, and the product 144.
  inputs:
    count_lo: 6154284
    count_hi: 20708500
    ceil_lo: 254535220
    ceil_hi: 856483486
    ceiling_cross: 10784024
    band_excess: 2
    band_cross: 7
    draws: 1200
    cap_quot: 8333
    cap_rem: 400
    addition_cap: 10000000
    per_law: 50000
    order_product: 144
    fiber_gap: 4
    nearby_lo: 6044060
    nearby_hi: 20460496
  controls:
    - >-
      The cross of 856483486 and 254535220 against 6154284 and
      20708500 is 10784024. The nearby counts 6044060 and 20460496
      invalidate the run.
    - >-
      Four exceeds 2 by 2. Four against one half has cross 7. Eight
      exceeds 4 by 4. Eighteen times 8 is 144.
    - >-
      Two hundred times three times two is 1200. Twelve hundred
      times 8333 plus 400 is 10000000. Two hundred times 50000 is
      10000000.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {ceiling, cap, order}
    - route in {cross, product}
  metrics:
    primary:
      - ceiling_cross
      - addition_cap
      - order_product
      - implementations_agree
    secondary:
      - band_cross
      - fiber_gap
      - draws
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The ceiling cross is 10784024. Twelve hundred times 8333 plus
      400 is 10000000. Eighteen times 8 is 144.
    formula: >-
      Multiply each ceiling mantissa by the other count and
      subtract. Multiply 1200 by 8333 and add 400. Multiply 18 by 8.
    source: >-
      IDEA-20260930-f1d8ff states the counts 6154284 and 20708500,
      the ceilings 2.54535220e-18 and 8.56483486e-18, the draw count
      200, the addition cap, and the orders 18 and 8, read
      2026-10-03. The products were recomputed in this design
      session. That computation is not a run. No sumset was
      enumerated. The subgroup order was not computed.
  scale_relevance:
    tier: toy
    justification: Two written ceilings and one written draw count. No transfer to a hit rate.
    correspondence: null
  tail_checks:
    - The cap 10000000 and the product 144 are required. A check that stops at the cross is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the cross 10784024 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The cross is not 10784024.
    - The cap is not 10000000.
    - The product is not 144.
    - The nearby counts 6044060 and 20460496 are used as the written counts.
    - A sumset is enumerated, or a hit rate is read.
  success_criterion: >-
    Both runs agree that the ceiling cross is 10784024, that 1200
    times 8333 plus 400 is 10000000, that 200 times 50000 is
    10000000, that 4 exceeds 2 by 2, and that 18 times 8 is 144.
  falsification_criterion: >-
    The runs agree that the ceiling cross is computed, and that
    cross is not 10784024.
  required_artifacts:
    - experiments/EXP-CERTBIN-a4217c/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CERTBIN-a4217c/runs/<RUN-ID>/command.txt
    - experiments/EXP-CERTBIN-a4217c/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CERTBIN-a4217c/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CERTBIN-a4217c/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CERTBIN-a4217c/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any sumset enumeration, hit-rate sample, or curve construction.
    - Any claim that a hit-rate ratio moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
