experiment:
  id: EXP-ECDLP-1ed445
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  hypothesis_id: H-ECDLP-feb405
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  source_proposal: ledger/proposals/IDEA-20260805-c4f675.yaml
  title: >-
    Null-normalised H-PSEUDO character-sum ladder: measure C on a matched random
    subset before measuring it on the factor base, report the ratio rather than
    the constant, and extend the p-range until the competing growth models
    separate

  objective: >-
    If separately approved, frozen and authorized, measure the additive-character
    statistic C = max_{k=1..N-1} |sum_{P in F} e(2 pi i k DL_G(P)/N)| / sqrt(B)
    on THREE arms of identical shape at each of four bit sizes -- the small-x
    elliptic-curve factor base, a matched uniform random B-subset of Z_N, and a
    planted arithmetic progression with a forced value -- plus a five-point
    graded interpolation between the last two, and report the RATIO
    R = C_EC/C_null rather than C. The purpose is to test H-ECDLP-feb405's two
    parts: that the null's forced value sqrt(ln((N-1)/2) + gamma_E) is correct,
    and that the EC-specific residual growth exponent after normalisation is
    below 0.020 rather than the 0.055 and 0.079 currently on record for C
    itself.

  what_this_is_not:
    - >-
      NOT a discrete-logarithm SEARCH, an attack, a relation collection, or an
      ECDLP algorithm. Discrete logarithms are obtained by ENUMERATING the group
      from G, which is not a DLP solve and is possible only because the curves
      are toy.
    - >-
      NOT a refutation of H-PSEUDO. H-PSEUDO asserts that C is SMALL; this
      contract measures its GROWTH RATE relative to a null and, if anything, a
      flat ratio makes H-PSEUDO more plausible.
    - >-
      NOT an ECDLP cost, runtime, asymptotic, exponent, crypto-scale, or
      deployed-scheme claim. No exponent moves in any direction.
    - >-
      NOT a status change to KN-FIND-d4f820, KN-FIND-4c9e71, DEC-20260804-7af513
      or any other record. Only the Coordinator may change status.
    - >-
      NOT an adjudication of the four incompatible alpha values on record. Under
      AGENTS.md retrieval policy item 7 the contradiction is REPORTED; this
      contract adds a reading and a null, it does not pick a winner.
    - >-
      NOT approval, freezing, execution authorization, a run, an observed
      output, or evidence.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: that at bits in {20, 22, 24, 26}, on the deterministically
      generated curves actually enumerated, with the declared B rule and the
      FULL k-range, the ratio C_EC/C_null lies in the declared interval and its
      log-log slope is below the declared bound. It could support NOTHING about
      p above 2^26, nothing about the asymptotic behaviour of C, nothing about
      the truth of H-PSEUDO, and nothing about the Semaev yield error at
      cryptographic scale. Toy evidence is never crypto-scale evidence
      (AGENTS.md rule 7). The QUANTIFIER matters and is stated in the hypothesis:
      the claim is over the tested rungs, not FOR ALL p.

  inputs:
    bits: [20, 22, 24, 26]
    curves_per_rung_mean: 8
    curves_per_rung_max: 20
    null_draws_per_rung: 200
    theta_sweep: [0.0, 0.25, 0.5, 0.75, 1.0]
    k_range: "full: k = 1 .. N-1, via one real FFT of length N"
    gamma_E: 0.5772156649015329
    B_rule: >-
      B = 512 at EVERY rung, held fixed across bit sizes. FIXED BEFORE THE RUN
      AND RECORDED HERE BECAUSE IT IS THE MOST LIKELY WAY THE COMPARISON IS
      WRONG IN EITHER DIRECTION: the committed prior data did not hold B fixed,
      so a B-trend could masquerade as a p-trend there. A secondary sweep at
      B in {256, 512, 1024} is run at bits = 20 and 24 only, to report whether
      R depends on B/N; that sweep is DIAGNOSTIC and is not part of any primary
      metric.
    tau_rule: >-
      The small-x factor base is F = {P in E(F_p) : x(P) < tau}, with tau chosen
      as the smallest integer such that |F| >= B, then F truncated to the first
      B points in increasing (x, then y) order. The truncation rule is frozen
      here because "first B" and "all with x < tau" differ and the difference is
      not negligible at small B.
    master_seed: 7719364
    domain: "EXP-ECDLP-1ed445/v1"
    seed_derivation_rule: >-
      Every draw derives from SHA-256 of the ASCII byte string
      domain || "#" || decimal(master_seed) || "|" || label || "|" ||
      decimal(bits) || "|" || decimal(counter), big-endian unsigned. Labels:
      "prime", "curve-a", "curve-b", "null", "ap-a", "ap-d", "theta". The
      counter advances by 1 per candidate rejected or accepted, so a third party
      reproduces every instance and every null draw bit-for-bit from
      (domain, master_seed, bits) alone.
    prime_construction: >-
      Identical rule to EXP-ECDLP-03a8c9: h = int(SHA256(seed("prime", bits,
      0))); L = 2^(bits-1); U = 2^bits; c0 = L + 1 + 2*(h mod 2^(bits-2)); test
      c_k = c0 + 2k in increasing k by deterministic trial division. First prime
      is p; reaching U is CONSTRUCTION_FAILURE with no reseed.
    curve_construction: >-
      a_t, b_t from SHA-256 as in EXP-ECDLP-03a8c9; reject singular; compute
      #E(F_p) by the character sum; accept when #E has a prime factor N with
      N > #E / 8 (so a large prime-order subgroup exists) and the curve is
      ordinary. G is the first point of order N found by scanning x upward and
      multiplying by the cofactor. N, the cofactor and G are recorded.
    dl_table_construction: >-
      The DL table is built by iterating Q <- Q + G from Q = G for N steps,
      recording DL[x(Q)] on first occurrence. This is ENUMERATION, not a DLP
      solve, and costs N point additions per curve -- 2^26 at the top rung,
      which is the dominant compute cost and is budgeted as such.

  arms_and_controls:
    treatment: >-
      ARM-EC. For each curve: build F by the tau rule, form the indicator vector
      over Z_N at positions DL_G(P) for P in F, take one numpy.fft.rfft of
      length N, take max_{k != 0} |.| / sqrt(B). Report per curve; the rung's
      mean statistic is the mean over 8 curves and its max statistic is the max
      over 20.
    measured_null: >-
      ARM-NULL (same shape, CAN FAIL). A uniform random B-subset of Z_N, drawn
      by rejection sampling from SHA-256 bits with label "null", identical N,
      identical B, identical full k-range, identical code path. 200 draws per
      rung. FORCED VALUE DERIVED BEFORE THE RUN:
      C_null = sqrt(ln((N-1)/2) + gamma_E), which is 2.6076 at p = 1009 against
      the 2.57 that DEC-20260804-7af513 already measured for random bijections
      -- 1.46 per cent, an existing and previously unused calibration. IT CAN
      FAIL in two visible ways: the Exponential(1) marginal could break at small
      B/N, or the frequency-independence approximation could break. Either
      failure invalidates the whole comparison rather than the EC arm.
    positive_control: >-
      CTRL-AP (must fire, forced value exact). F_plant = {DL = a + j d mod N :
      j = 0..B-1} with a, d drawn from labels "ap-a", "ap-d" and gcd(d, N) = 1.
      Its transform is a Dirichlet kernel with a spike of magnitude B at
      k = d^{-1} mod N, so C = sqrt(B) EXACTLY -- 22.627 at B = 512, against a
      null near 3.3. THRESHOLD DECLARED BEFORE THE RUN: within 1 per cent of
      sqrt(B). IF CTRL-AP FAILS, THE DFT, THE NORMALISATION OR THE MAXIMISATION
      IS WRONG, AND NO NEGATIVE RESULT MAY BE REPORTED FROM ANY ARM. This is
      the sensitivity demonstration this lane has never had.
    graded_control: >-
      CTRL-THETA (5 points, monotonicity REQUIRED). Replace a fraction theta of
      F_plant's elements with uniform random elements of Z_N, for theta in
      {0, 0.25, 0.5, 0.75, 1.0}, 20 draws per cell per rung. FORCED SHAPE: the
      surviving spike has magnitude (1-theta) B, so
      C(theta) approximately sqrt( ((1-theta) B)^2 / B + ln((N-1)/2) + gamma_E ),
      monotone decreasing from sqrt(B) at theta = 0 to C_null at theta = 1.
      A QUANTITY THAT FAILS TO DECAY AS THE PARAMETER MEANT TO DESTROY IT
      INCREASES IS THE CANONICAL ARTIFACT TELL (inventor protocol section 3);
      a non-monotone response invalidates the whole ladder and localises the
      fault to the maximisation or the normalisation rather than leaving "it did
      not work".
    ordering_control: >-
      The COMPLETE null arm at all four rungs, plus CTRL-AP and CTRL-THETA, is
      generated, measured, hashed and committed BEFORE any EC curve is
      generated. Absence of that commitment is invalid_measurement. The frozen
      decision rule ("residual growth present / absent") is executed ON THE NULL
      ARM FIRST; if it reports growth on the null, the rule is measuring the
      extreme-value law rather than EC structure and MUST be rewritten before
      any EC number is read.
    comparability_policy: >-
      No comparison to the committed values in KN-FIND-d4f820 or KN-FIND-4c9e71
      is admissible as a measurement: those cells used different curves,
      different B, and at p = 2003 and 4001 a PARTIAL k-range (k = 1..300),
      which biases the maximum downward by a p-dependent amount. They are cited
      as the motivating prior and re-derived arithmetically in stage 0, never
      pooled with new measurements.

  metrics:
    primary:
      - >-
        G4: R(p) = C_EC_mean(p) / C_null_mean(p) at each of the four rungs.
      - >-
        G5: least-squares slope alpha_resid of ln R on ln p over the four rungs,
        with a 95 per cent interval, mean statistic.
      - >-
        G6: the same slope for the adversarial max statistic over 20 curves per
        rung.
    secondary:
      - >-
        G1: measured C_null per rung against the derived
        sqrt(ln((N-1)/2) + gamma_E), as a relative error.
      - >-
        G2: C on CTRL-AP against the forced sqrt(B).
      - >-
        G3: the CTRL-THETA sweep with an explicit monotonicity verdict.
      - >-
        G7: R^2 of ln C_EC against ln p, against ln sqrt(ln p), and against
        ln ln ln p, all three reported.
      - >-
        G8: the ADDITIVE residual delta = C_EC - C_null and its slope, reported
        beside the multiplicative one, with neither chosen.
      - >-
        The maximising frequency k* on the EC arm per curve, and whether
        [k*]G lies in F -- the quantity DEC-20260804-7af513's own
        exact_next_action asked for and which no record answers.
      - >-
        The B-sweep diagnostic at bits 20 and 24, B in {256, 512, 1024}.

  preregistered_prediction:
    quantity: >-
      C on a uniform random B-subset of Z_N; C on a planted arithmetic
      progression; and the ratio R = C_EC/C_null with its log-log slope.
    formula: >-
      C_null(N) = sqrt( ln((N-1)/2) + gamma_E ), from the Exponential(1) limit
      of |hat{1_{F'}}(k)|^2/B and the Gumbel maximum over (N-1)/2 conjugate-pair
      frequencies. C_AP = sqrt(B) exactly, from the Dirichlet-kernel spike.
      C(theta) approximately sqrt( ((1-theta)B)^2/B + ln((N-1)/2) + gamma_E ).
    source: >-
      Derived in H-ECDLP-feb405 and IDEA-20260805-c4f675 from the complex CLT
      and the exponential maximum. NO SOURCE WAS OPENED; the extreme-value law
      is RECALLED, UNVERIFIED as to any named theorem and is a CANDIDATE TO
      TEST, which is why the null is MEASURED and the derived value reported
      beside it rather than substituted for it.
    forced_values:
      G1: "relative error < 0.05 at every rung; derived 2.6076 vs committed 2.57 at p=1009 is 1.46 per cent"
      G2: "sqrt(512) = 22.627, within 1 per cent"
      G3: "strictly monotone decreasing across the five theta cells"
      G4: "R in [1.10, 1.32] at every rung"
      G5: "|alpha_resid| < 0.020, interval containing 0; derived on committed points +0.00413"
      G6: "< 0.030; derived on committed points +0.01717"

  scale_relevance:
    tier: toy
    justification: >-
      The four rungs extend the committed p-range by a factor of about 1340
      (1009 to 2^26), which multiplies the separation between the competing
      growth models by about 1.5 relative to the existing four points. That is
      the entire scale argument and it is stated quantitatively rather than
      asserted: the ratio p^{0.079}/sqrt(ln p), normalised at p = 1009, reaches
      1.25 at 2^{20.7}, 1.5 at 2^{26.2} and 2.0 at 2^{33.8}. A separation of 1.5
      against a residual scatter of 7 per cent is decisive for the mean and
      MARGINAL FOR THE MAX, and the contract says so in advance rather than
      discovering it afterwards.
    correspondence: >-
      null -- no correspondence trick is used; the toy instances are direct.
      This is precisely the limitation: reaching a separation of 2.0 needs
      p ~ 2^34, whose FFT does not fit the budget, and NO correspondence is
      known to this contract that would sample C at crypto scale without
      solving ECDLP (the circularity KN-FIND-d4f820 itself records).
    limit: >-
      Nothing here establishes the asymptotic growth of C, and a divergence
      beginning above 2^26 is fully consistent with every possible outcome of
      this contract.

  tail_checks:
    - >-
      The single largest C observed on the null arm across all rungs and draws,
      against the Gumbel tail prediction Pr[C > x] = 1 - (1 - e^{-x^2})^M, so
      the extreme is checked against its own extreme-value probability rather
      than only against the mean.
    - >-
      The single largest C observed on the EC arm, with its curve and its k*,
      reported individually -- an adversarial maximum is a tail statistic and
      reporting only its mean would hide the object of interest.
    - >-
      The smallest B/N reached (bits = 26, B = 512, so B/N about 7.6e-6), with a
      statement of whether the Exponential(1) marginal is still expected to hold
      there.

  replication:
    seeds: [7719364]
    independent_instances: 112
    interpretation: >-
      One master seed generating 8 mean-statistic curves and 20 max-statistic
      curves per rung across four rungs, plus 200 null draws per rung. One run
      is a design-validation attempt. It cannot by itself support, reject or
      validate H-PSEUDO or any ECDLP claim beyond the explicitly scoped toy
      instrument observation.

  budget:
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_runs: 1
    no_network: true
    stage_budgets:
      stage0_arithmetic_seconds: 1800
      stage1_null_and_controls_seconds: 3600
      stage2_ec_arm_seconds: 16200
    binding_constraint: >-
      One real FFT of length N at bits = 26 is about 0.5 GB in complex128; with
      the indicator vector and working space the peak is budgeted at 8 GB. THIS
      IS WHY THE LADDER STOPS AT 26 AND NOT AT THE 34 THAT WOULD GIVE A FACTOR-2
      MODEL SEPARATION.

  stage_order_and_terminating_stage:
    stage0: >-
      ZERO COMPUTE, ARITHMETIC ON COMMITTED VALUES ONLY. Independently reproduce
      the division of KN-FIND-d4f820's and KN-FIND-4c9e71's tables by the
      derived null; report R_mean, R_max, alpha_resid for each, alpha_equiv over
      the three p-intervals, and the three model R^2 values. TERMINATING: if an
      independent reproduction does NOT show a flat mean ratio, the hypothesis
      is dead before any run and nothing further executes.
    stage1: >-
      NULL AND CONTROLS ONLY, no EC arm generated. ARM-NULL at four rungs
      (G1), CTRL-AP (G2), CTRL-THETA (G3). Committed and hashed. TERMINATING: if
      G1 fails at any rung or CTRL-AP misses sqrt(B) by more than 1 per cent,
      the instrument or the derivation is wrong and NO EC measurement is
      admissible.
    stage2: >-
      EC ARM. DL tables, factor bases, FFTs, G4-G8.
    terminating_stage_statement: >-
      STAGE 0 CAN END THE RUN AT ZERO COMPUTE, AND STAGE 1 CAN END IT BEFORE THE
      EXPENSIVE ARM. The costly DL-table construction happens only after both
      cheap gates pass. This ordering is deliberate and is the contract's main
      design decision.

  stopping_rules:
    - >-
      Do not execute unless separately reviewed, approved, frozen, archived and
      explicitly authorized by the Coordinator. GOAL-ECDLP-001's committed
      next_action directs the successor batch elsewhere; nothing here overrides
      it.
    - Stop before the EC arm if the complete null arm and its digest are absent.
    - Stop before the EC arm if CTRL-AP misses sqrt(B) by more than 1 per cent.
    - Stop before the EC arm if CTRL-THETA is non-monotone at any rung.
    - Stop before the EC arm if measured C_null departs from the derived value by more than 5 per cent at any rung.
    - Stop at any rung whose curve construction fails, reporting CONSTRUCTION_FAILURE rather than substituting a nearby prime.
    - Stop on any budget, memory or watchdog failure and report it as infrastructure.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any partial-k maximum anywhere in the comparison; the full range is mandatory.
    - Any EC number read before the null arm is committed and hashed.
    - Any pooling of new measurements with the committed KN-FIND table values.
    - Any report of R without delta beside it, or of one decomposition's slope without the other's.
    - Any variation of B across rungs in the primary metric.

  success_criterion: >-
    This draft has NO current success outcome because it is not authorized for
    execution. If a later, separately approved and frozen successor is executed,
    its only positive disposition is: G1 within 5 per cent at every rung, G2
    within 1 per cent of sqrt(B), G3 strictly monotone, G4 in [1.10, 1.32] at
    every rung, G5 with |alpha_resid| < 0.020 and an interval containing zero,
    G6 below 0.030, and G7/G8 both reported with neither decomposition chosen.
    THAT DISPOSITION ESTABLISHES NO ECDLP ATTACK, COST, EXPONENT, CRYPTO-SCALE
    OR DEPLOYED-SCHEME CLAIM, AND DOES NOT REFUTE H-PSEUDO. It establishes that
    over the tested rungs the measured growth of C is the growth of its own null
    and the EC-specific part is a constant offset.

  falsification_criterion: >-
    Any of: alpha_resid(mean) >= 0.040 (P2 false; the EC-specific growth is real
    at measured scale and DEC-20260804-7af513's conclusion is vindicated with
    the null it never had -- the MORE VALUABLE outcome); measured C_null off the
    derived value by more than 5 per cent at any rung (HEUR-CN-1 refuted, the
    whole comparison withdrawn); CTRL-AP outside 1 per cent of sqrt(B)
    (instrument broken, nothing reportable in either direction); CTRL-THETA
    non-monotone (artifact); R outside [1.05, 1.40] at any rung (neither model
    describes it, and that is the honest deliverable).

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory condition, missing dependency, or
    CONSTRUCTION_FAILURE is reported as an INFRASTRUCTURE SIGNAL and is NEVER
    negative mathematical evidence about H-ECDLP-feb405, H-PSEUDO, or any ECDLP
    proposition (AGENTS.md rule 5). Environment measured this session and
    recorded so a later run can detect drift: Python 3.11.15; numpy 2.4.6
    PRESENT (this resolves the environment disagreement in this session's
    ANGLE-BRIEF section 5.3 in favour of numpy being available); sympy ABSENT;
    sage ABSENT. numpy IS required here, for the FFT only; if it is absent at
    run time that is an infrastructure request, not an experiment, and the run
    reports it as such.

  required_artifacts:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - Stage-0 arithmetic transcript reproducing the ratio table from committed values.
    - Null-arm raw output at all four rungs with its digest, committed BEFORE the EC arm.
    - CTRL-AP output against its forced sqrt(B), and the CTRL-THETA five-point sweep with its monotonicity verdict.
    - Per-curve records: p, N, cofactor, a, b, G, tau, |F|, C_EC, k*, and whether [k*]G lies in F.
    - Both decompositions R and delta with their slopes and intervals.
    - The three model R^2 values and the p at which the models separate.
    - The B-sweep diagnostic at bits 20 and 24.
    - Manifest, environment, command, stdout, stderr, execution report, and dominated_by / sota_delta on the run deliverable.
    - Forward guidance per H-ECDLP-feb405 falsification condition F7, naming what the four committed points can and cannot support.

  approval_requirements:
    - Independent review confirms that the null arm can actually fail and that CTRL-AP's forced value is correct as stated.
    - Independent review confirms the B rule and the tau truncation rule are reproducible and are held fixed across rungs.
    - Coordinator separately approves and freezes a future contract without editing this draft.
    - A separate committed Coordinator authorization, since GOAL-ECDLP-001's committed next_action currently directs the successor batch elsewhere.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved and this session has no authority to approve it (AGENTS.md rule 1).

  assigned_to: executor
