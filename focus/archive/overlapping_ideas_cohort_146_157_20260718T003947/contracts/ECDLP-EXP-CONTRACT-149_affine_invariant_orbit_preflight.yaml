experiment:
  id: EXP-ECDLP-IDEA-149-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-149
  lane: high_risk
  version: 1
  title: Lifted affine-invariant orbit-word theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: low_degree_orbit_code_and_hidden_shift_decoder_missing
  objective: >-
    Decide before computation whether a fixed public observable on an elliptic
    scalar orbit lies in a target-uniform lifted affine-invariant code whose
    local decoder returns a scalar digit or exact source atom.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    public_observable: unresolved
    orbit_code_family: unresolved
    local_decoder_output_type: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-149" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied lifted affine-invariant codewords with planted corruption
    - random public predicates and degree-matched random orbit words
    - full orbit tables, Pollard rho, and BSGS
  metrics:
    primary:
      - orbit-word degree, distance, query complexity, and scalar/source output
      - blind-target correctness without an orbit dictionary
      - lambda=max(a,beta+delta+q+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - observable conductor, list size, calibration, ambiguity, rank, and descent
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while the draft is retired or the Phase 0 theorem is unresolved.
    - Stop if the orbit word has full degree/distance, local decoding returns only public predicate values, or calibration is an N-entry dictionary.
  invalidation_rules:
    - Supplied codewords, corruption locations, or scalar labels are positive controls only.
    - A decoded predicate value is not a scalar or source inverse.
    - Omitted construction, calibration, query, ambiguity, descent, verification, or memory costs invalidate the model.
  success_criterion: >-
    Independent proof supplies one fixed observable, a target-uniform lifted code,
    a public scalar/source decoder, and complete exponents at most 0.45.
  falsification_criterion: >-
    Generic full degree, no hidden-shift output, N-scale calibration, or a complete
    time or memory exponent at least 0.50 closes the stated mechanism.
  future_successor_artifacts:
    - ideas/artifacts/ECDLP-IDEA-149/orbit_code_degree_gate.md
    - ideas/artifacts/ECDLP-IDEA-149/observable_spec.md
    - ideas/artifacts/ECDLP-IDEA-149/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-149/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-149/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-149
  from: coordinator
  to: executor
  objective: Preserve the retired high-risk theorem gate; do not dispatch it.
  uncertainty_reduced: Whether local correction of an elliptic orbit word reveals hidden scalar or exact source information.
  inputs:
    - ideas/deferred/ECDLP-IDEA-149_lifted_affine_invariant_scalar_orbit_decoder_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-149_affine_invariant_orbit_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - No scalar-labelled orbit table or supplied codeword.
    - Charge code construction, calibration, queries, lists, and descent.
  deliverables:
    - orbit-code membership theorem or full-degree obstruction
    - typed local-decoder output proof
    - complete cost receipt and independent review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
