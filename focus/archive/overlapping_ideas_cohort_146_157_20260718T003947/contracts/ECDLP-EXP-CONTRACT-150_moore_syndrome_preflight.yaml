experiment:
  id: EXP-ECDLP-IDEA-150-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-150
  lane: representation_changing
  version: 1
  title: Moore-syndrome elliptic source-decoder theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: addition_compatible_public_moore_syndrome_missing
  objective: >-
    Decide symbolically whether public elliptic endpoints admit an addition-compatible
    extension-space Moore syndrome that encodes exact low-rank factor-base support
    without hidden scalar coordinates or tuple enumeration.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    extension_space_embedding: unresolved
    endpoint_syndrome_map: unresolved
    rank_decoder_source_lift: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-150" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - genuine Gabidulin words with supplied Moore syndromes
    - random linear embeddings and hidden-scalar-coordinate embeddings
    - summation-polynomial search, Pollard rho, and BSGS
  metrics:
    primary:
      - addition compatibility, syndrome dimension, rank radius, and exact source output
      - blind-target reuse with no tuple or scalar oracle
      - lambda=max(a,beta+delta+q+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - embedding construction, collisions, list size, rank, verification, and descent
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while the draft is retired or the Phase 0 theorem is unresolved.
    - Stop if the syndrome needs hidden scalar coordinates, a supplied tuple, B^m enumeration, or rank dimension at least N^0.5.
  invalidation_rules:
    - A supplied Moore syndrome is a positive control only.
    - Rank decoding without an endpoint-to-syndrome map is not an ECDLP algorithm.
    - Omitted embedding, syndrome, output, rank, descent, ambiguity, or memory costs invalidate the model.
  success_criterion: >-
    Independent proof supplies a target-uniform public endpoint syndrome, exact
    source decoder, and complete time and memory exponents at most 0.45.
  falsification_criterion: >-
    Hidden scalar dependence, tuple-derived syndrome, rank/list explosion, or a
    complete time or memory exponent at least 0.50 closes the stated mechanism.
  future_successor_artifacts:
    - ideas/artifacts/ECDLP-IDEA-150/moore_syndrome_homomorphism_gate.md
    - ideas/artifacts/ECDLP-IDEA-150/embedding_spec.md
    - ideas/artifacts/ECDLP-IDEA-150/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-150/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-150/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-150
  from: coordinator
  to: executor
  objective: Preserve the retired representation-changing theorem gate; do not dispatch it.
  uncertainty_reduced: Whether an elliptic endpoint natively exports a public Moore syndrome for its factor-base source.
  inputs:
    - ideas/deferred/ECDLP-IDEA-150_moore_syndrome_rank_metric_source_decoder_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-150_moore_syndrome_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Reject hidden scalar embeddings and supplied source syndromes.
    - Charge the complete relation-to-target path.
  deliverables:
    - endpoint-syndrome homomorphism theorem or impossibility proof
    - rank-decoder source-lift theorem or collision family
    - complete cost receipt and independent review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
