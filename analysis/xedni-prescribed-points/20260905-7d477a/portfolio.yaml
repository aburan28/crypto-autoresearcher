  directions:
    - key: A
      title: Image of the published marked family
      class: measurement
      novelty_status: unverified
      claim: Point matching has a separately measurable cost after curve matching in the named family.
      mechanism: Study the image of the parameter-to-curve-and-labelled-sections evaluation map.
      sources: [elkies2026, old_scope_boundary]
      predictions:
        - metric: Exact fraction of externally sampled pointed configurations reached
          direction: different
          minimum_effect: No numerical effect assumed; exact coverage and conditional losses are the outputs.
      minimal_test:
        design: Enumerate good parameter values over three small fields and match one to three labelled sections.
        controls: [family_generated_positive_tuples, external_uniform_on_model_tuples, pure_reparametrization]
        required_metrics: [curve_match_rate, conditional_point_match_rate, exact_isomorphism_count, duplicate_count, construction_time, peak_memory]
      falsification_conditions:
        - Any verified missing tuple refutes universal coverage for the declared map.
        - Equal image after deduplication refutes an asserted coverage gain for a modification.
      confounders: [j_invariant_only_matching, section_label_changes, planted_targets_mixed_with_external_targets]
      interpretation_limits: [Declared section catalogue only, No rank or dependence inferred from point count]
      estimated_cost: {implementation: medium, compute: low}
      recommended_priority: high

    - key: B
      title: Fixed fibre values versus fixed whole sections
      class: representation
      novelty_status: unverified
      claim: Relaxing full-polynomial constraints may preserve non-gauge marked-point deformation directions.
      mechanism: Compare incidence maps with identical target fibre but different constraints on higher section coefficients.
      sources: [old_fixed_polynomial_model, old_scope_boundary]
      predictions:
        - metric: Integrable nongauge directions changing marked configurations
          direction: higher
          minimum_effect: At least one exact direction beyond the fixed-polynomial slice in an explicitly identified component.
      minimal_test:
        design: Reproduce the old degree slice, then compare Jacobians, components and exact deformation checks.
        controls: [identical_fixed_polynomial_boundary, gauge_only_deformation, singular_component, repeated_sections]
        required_metrics: [equation_rank, tangent_dimension, gauge_dimension, component_dimension, exact_integrability, dependence_constraints]
      falsification_conditions:
        - Every apparent extra direction is gauge, singular or obstructed.
        - Hidden dependence conditions remove the purported marked-point freedom.
      confounders: [dimension_count_as_dominance, tangent_space_as_rational_parametrization, finite_field_as_characteristic_zero]
      interpretation_limits: [Exact degree shape only, No generic-surjectivity claim from sampled tangent ranks]
      estimated_cost: {implementation: medium, compute: medium}
      recommended_priority: high

    - key: C
      title: Prescribed-abscissa incidence geometry with charged rational seeds
      class: composition
      novelty_status: unverified
      claim: Some incidence slices may remain parametrizable after residue constraints, without a free rational seed.
      mechanism: Re-derive the three-abscissa quadric boundary and classify additional constraints before rational search.
      sources: [sawin2025]
      predictions:
        - metric: Verified rational lifts under residue and height constraints
          direction: different
          minimum_effect: A reproducible unseeded solution with all costs and residue conditions checked; no frequency promised.
      minimal_test:
        design: Paired seeded and unseeded three-coordinate inputs, then separately designed four/five-coordinate extensions.
        controls: [known_rational_seed, no_seed_supplied, mismatched_y_residue, singular_curve, local_solution_only]
        required_metrics: [rational_seed_cost, local_solvability, exact_rational_solvability_status, coordinate_heights, coefficient_heights, search_volume]
      falsification_conditions:
        - The construction cannot proceed without being handed a rational lift.
        - Verified success disappears after y-residue or height constraints are enforced.
      confounders: [free_seed_oracle, x_only_success_reported_as_point_success, p_adic_as_rational]
      interpretation_limits: [Bounded search only, Independent marked points not assumed, Extra-coordinate geometry not predetermined]
      estimated_cost: {implementation: medium, compute: medium}
      recommended_priority: high

    - key: D
      title: Multisections compatible with a prescribed fibre
      class: mechanism
      novelty_status: unverified
      claim: A moving multisection may supply a new section with a controlled marked-fibre condition.
      mechanism: Impose incidence on a conic-bundle or multisection family before base change.
      sources: [loughran_salgado2022, elkies2026]
      predictions:
        - metric: New point reductions from certified new sections
          direction: higher
          minimum_effect: One new marked output at controlled auxiliary-base height beyond the declared old catalogue.
      minimal_test:
        design: First verify theorem hypotheses on one explicit surface and one prescribed synthetic point; then compare moving and fixed multisections.
        controls: [fixed_base_change, pure_reparametrization, reducible_multisection, auxiliary_base_without_rational_seed]
        required_metrics: [base_genus, rational_seed_cost, base_height, degree, new_section_certificate, reduction_image]
      falsification_conditions:
        - Point constraints destroy integrality, rationality or the theorem hypotheses.
        - Outputs merely pull back old sections.
      confounders: [non_thinness_as_uniform_residue_coverage, rank_increase_as_dependence, new_section_as_new_j_value]
      interpretation_limits: [A fixed base change selects original fibres, A new section can still enlarge marked-point image]
      estimated_cost: {implementation: high, compute: medium}
      recommended_priority: medium

    - key: E
      title: Incidence slices with certified rank upper bounds
      class: composition
      novelty_status: unverified
      claim: An incidence slice may retain enough structure for a rank upper bound below its marked-point count.
      mechanism: Combine explicit point constraints with applicable descent or low-rank-specialization hypotheses.
      sources: [melistas2025, elkies_klagsbrun2020, jksst2000]
      predictions:
        - metric: Certified upper rank bound minus marked-point count
          direction: lower
          minimum_effect: Strictly negative on a nonsingular fully checked fixture; no universal rate asserted.
      minimal_test:
        design: Audit theorem applicability first; compare small marked curves with rank intervals and a separate torsion certificate.
        controls: [known_dependent_tuple, certified_independent_tuple, rational_two_torsion_vs_odd_reduction_order, rank_score_without_certificate]
        required_metrics: [rank_lower_bound, rank_upper_bound, assumptions, marked_span_rank, torsion, certification_time]
      falsification_conditions:
        - The marked points already have certified full independence.
        - Available upper bounds cannot force dependence or lose applicability after incidence constraints.
      confounders: [selmer_upper_bound_as_exact_rank, analytic_assumptions_omitted, torsion_ignored]
      interpretation_limits: [No discrete-log extraction, Unfinished certification is unresolved]
      estimated_cost: {implementation: high, compute: medium}
      recommended_priority: medium

    - key: F
      title: Bounded-height reduction coverage per unit cost
      class: measurement
      novelty_status: unverified
      claim: Rank alone does not predict distinct bounded-height reduction coverage after construction cost is charged.
      mechanism: Compare finite rational-point catalogues by distinct reduction images, heights and certified lattice information.
      sources: [elkies2026, elkies_klagsbrun2020]
      predictions:
        - metric: Distinct reduction images per total catalogue-construction cost
          direction: different
          minimum_effect: No ordering asserted; report matched comparisons and uncertainty.
      minimal_test:
        design: Freeze catalogues and height caps, then compute their reduction images and evaluate independently sampled targets.
        controls: [equal_catalogue_size_random_image_control, duplicate_reductions, fixed_curve_height_sweep, matched_coefficient_height]
        required_metrics: [catalogue_size, distinct_image_size, rational_rank_bounds, height_pairing_determinant, all_heights, cpu_time, peak_memory]
      falsification_conditions:
        - A claimed advantage disappears after height/cost matching or deduplication.
        - A coverage estimator disagrees with exact finite-image membership frequencies beyond its declared uncertainty.
      confounders: [catalogue_as_complete_height_ball, subgroup_index_as_regulator, varying_curve_as_fixed_curve_asymptotic]
      interpretation_limits: [Uniform independent target identity only, No adaptive-target transfer]
      estimated_cost: {implementation: medium, compute: low}
      recommended_priority: high

  common_proof_search_map:
    applicability: Required audit for any future proof-oriented extension of these directions.
    bottleneck: Effective marked-point image plus rationality, height control and dependence certification.
    baseline_embedding:
      parameter_slice: Fixed-polynomial XEDN slice for B; unmodified published family for A/D/F; seeded three-abscissa quadric for C.
      reproduction_check: Exact identities and target reductions must pass before sampling or elimination results are interpreted.
    observation_collision:
      observable: Rank, parameter count, j-invariant, tangent dimension or catalogue size alone.
      distinct_preimage_search: Exhibit equal observables with different marked images, rational-solvability status or dependence.
    quantifier_order: >-
      The desired future statement is for each admissible externally fixed
      curve-and-point input, there exists a compatible rational construction
      with effective bounds. Producing a construction first and then naming
      its image points certifies only a planted existence fixture.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: Joint incidence image, marked-span rank and height profile.
        predicted_gain: Distinguish configurations that rank alone cannot separate.
      - transform: boundary_lift
        proposed_object: Deformation from fixed-polynomial to evaluation-only incidence constraints.
        predicted_gain: Test extra usable freedom without assuming it yields dominance.
    method_ceiling:
      strongest_certifiable_claim: Exact statement for one named map, component, fixture or finite catalogue.
      nearby_object_control: Gauge-only changes, singular components, incompatible torsion and seeded-only rational parametrizations.
    proof_obligations:
      - {claim: Correct marked evaluation map and exact reductions, responsibility: correctness}
      - {claim: Rational seed and admissible field of definition, responsibility: feasibility}
      - {claim: Heights and all arithmetic costs controlled uniformly in declared parameters, responsibility: size}
      - {claim: Target distribution stated and output multiplicities charged, responsibility: success_probability}
      - {claim: Dependence certificate separated from rank lower bound and torsion, responsibility: interface}
      - {claim: No transfer outside the declared family and field, responsibility: scope}
  heuristic_assumptions:
    - id: no_uniformity_assumption
      statement: No equidistribution, generic-dimension or varying-curve height heuristic is adopted as evidence.
      rigorous_support: Only exact identities or source-specific theorems with their hypotheses may justify a later model.
      validation_plan: Compare any later preregistered probabilistic model with exact small-field images and matched controls.
  target_complexity:
    time_exponent: unknown; no improvement claimed
    memory_exponent: unknown; no improvement claimed
    best_known: No replacement algorithm proposed; existing ECDLP baselines remain unchallenged by this portfolio.
    hidden_overhead: Rational seeds, failed constructions, height growth, descent, relation certification and image lookup must all be charged.
    tradeoff_note: Report CPU, memory and input/data costs separately; no amortization assumed.

  study_common:
    status: draft
    approved_by: null
    execution_authorized_by_this_file: false
    max_concurrent: 1
    random_design: >-
      Use independent deterministic streams with integer seeds 2026090500 through
      2026090515; bind each stream to an input index in the frozen manifest.
      Freeze PRNG algorithm/version and exact input bytes before execution.
    validity:
      - Verify characteristic, discriminants, denominator invertibility and every point equation.
      - Preserve seeded fixtures separately from externally sampled inputs.
      - Bind coordinate changes, section labels and finite-field isomorphisms explicitly.
      - Reject any success that does not meet every declared input constraint.
      - Failures, exclusions, malformed inputs and resource exhaustion remain in the denominator/report.
    artifacts:
      - frozen specification and source fixtures with hashes
      - input manifest, seeds and complete sampling procedure
      - exact commands, code revision, dependency versions and model provenance
      - stdout, stderr, resource measurements and operational status
      - raw per-input outputs including every failure and exclusion
      - exact algebraic identities, point and isomorphism checks
      - summary with denominators, uncertainty and limitations
    prerequisites_to_freeze:
      - Coordinator selects studies, allocates separate hypothesis/experiment/task IDs and commits approval.
      - Source equations and software versions independently checked and hashed.
      - All sampling distributions, parameter domains, ordering and timeout limits fixed.
      - Exact per-stage memory/CPU ceilings and output paths assigned through the dispatcher.
      - Snapshot and independent review plan defined for any proposed claim-changing conclusion.
    no_exponent_fit: true
    invalidation_rule: Failed baseline or exact correctness control invalidates affected comparisons.
    resource_rule: At the cap, preserve partial data and report resource_exhaustion without mathematical rejection.

  studies:
    - key: reachability
      directions: [A, F]
      objective: Measure the marked image of the unmodified explicit rank-17 family.
      field_primes: [101, 211, 431]
      input_design:
        curve_models_per_prime: 16
        curve_distribution: Uniform pairs (A,B) in the field conditioned on nonzero discriminant; not uniform isomorphism classes.
        marked_counts: [1, 2, 3]
        tuples_per_curve_and_count: 64
        tuple_distribution: Uniform ordered distinct affine points on each sampled curve, sampled without replacement within a tuple.
        target_creation_order: Sample all curve models and tuples before image inspection.
        family_domain: All good points of the projective parameter line over each field; include infinity if good and defined.
        sections: First k labelled sections of the cited model; signs fixed from the source and frozen fixture.
        isomorphisms: Enumerate all origin-preserving isomorphisms over the field to the sampled model.
        positive_fixtures: Separate family-generated marked tuples at every good parameter; not counted as external targets.
      budgets: {cpu_seconds: 7200, wall_clock_seconds: 10800, memory_gib: 4, workers: 1}
      primary_metrics: [curve_match_fraction, conditional_tuple_match_fraction, distinct_marked_images]
      secondary_metrics: [all_parameter_count, rejected_parameter_count, cpu_seconds, peak_memory, duplicate_multiplicity]
      stopping_rule: Finish the declared finite domain and target set, or stop at the first resource cap.
      positive_branch: Publish exact reachability for the tested maps with certificates and matched costs.
      negative_branch: Retain verified missing tuples as counterexamples only to universality of the declared map.
      inconclusive_branch: If images cannot be completed or controls fail, report the exact unresolved subset.
      interpretation_limit: Does not cover all section combinations, all rational points or other families.

    - key: evaluation_freedom
      directions: [B]
      objective: Compare full-polynomial and evaluation-only incidence constraints at a fixed fibre.
      field_primes: [7, 13, 19]
      degree_bounds: {a: 4, b: 6, x: 2, y: 3}
      marked_counts: [1, 2, 3, 4, 5]
      target_fibre: 0
      fixtures_per_prime_and_count: 16
      input_design:
        paired_fixtures: Same valid incidence point used for both constraint systems.
        external_checks: Separate externally sampled curve-and-point tuples; fixture construction is not a coverage estimate.
        fixed_polynomial_arm: Fix each complete x-polynomial, preserving the old model's exact scope and recording any additional shared constraints.
        evaluation_arm: Fix a(0), b(0), x_i(0), y_i(0), leaving higher coefficients variable.
        gauges: Identify coordinate and parameter transformations preserving the fibre and polynomial degree bounds before comparing dimensions.
        rational_arm: Any characteristic-zero integration attempt uses exact rational input and is reported separately.
      budgets: {cpu_seconds: 7200, wall_clock_seconds: 10800, memory_gib: 4, workers: 1}
      primary_metrics: [nongauge_tangent_dimension, exact_deformation_certificate, marked_image_differential_rank]
      secondary_metrics: [component_dimension, singularity, repeated_sections, rational_solvability_status, dependence_constraints]
      stopping_rule: Complete paired Jacobian and gauge audits before any costly elimination; stop at cap.
      positive_branch: Identify an exact integrable nongauge direction and name precisely which marked freedom it changes.
      negative_branch: Explain why the proposed extra freedom is gauge, obstructed, singular or constrained by dependence on the tested component.
      inconclusive_branch: Report tangent evidence without promotion if integration or component analysis remains unresolved.
      interpretation_limit: Positive dimension neither proves arithmetic points nor dominance of the evaluation map.

    - key: rationality_and_height
      directions: [C, F]
      objective: Separate a parametrization with a supplied rational seed from a construction starting only with residue data.
      field_primes: [11, 19, 31]
      marked_count: 3
      input_pairs_per_prime: 16
      naive_coordinate_height_caps: [16, 64, 256]
      input_design:
        seeded_arm: Rational nonsingular curve and three known rational points; keep the seed's cost visible as supplied input.
        unseeded_arm: Independently sampled nonsingular finite-field curve model and three affine points with distinct x-coordinates.
        rational_abscissas: Freeze centered integer representatives of x-residues in the initial study; later representatives require a separate arm.
        y_constraint: Both exact rational curve incidence and the prescribed finite-field y-residue are required.
        bounded_domain: Coprime numerator/positive denominator pairs with max absolute numerator and denominator within the declared cap; denominators coprime to p.
        coefficient_constraints: Reconstructed A and B must be p-integral and reduce to the supplied curve coefficients.
        duplicate_policy: Count distinct rational models and marked tuples, retaining all search attempts in cost totals.
      budgets: {cpu_seconds: 14400, wall_clock_seconds: 18000, memory_gib: 4, workers: 1}
      primary_metrics: [unseeded_verified_rational_solution_count, rational_seed_cost, coordinate_height, logarithmic_coefficient_height]
      secondary_metrics: [local_obstructions, bounded_domain_exhausted, attempted_candidates, cpu_seconds, peak_memory]
      controls: [seeded_parametrization_identity, wrong_y_residue, singular_output, local_only_solution]
      stopping_rule: Visit height caps in order; report only domains actually exhausted and stop at cap without expanding it.
      positive_branch: Archive verified unseeded rational solutions and all constraints, seed costs and heights.
      negative_branch: Exact local obstruction or exhausted finite-domain absence rejects only that input and declared domain.
      inconclusive_branch: Unfinished bounded search or unresolved rational seed is inconclusive, not a failure of the mathematical route.
      interpretation_limit: No high-rank or dependence claim; no uniform height or density extrapolation.

  open_directions:
    - Begin with reachability and paired evaluation-constraint audits.
    - Investigate rational seeds and height only on explicitly admissible incidence slices.
    - Audit theorem applicability before designing multisection or rank-upper-bound studies.
    - Retrieve the full 2000 analysis before attempting any claim about escaping its exact obstruction.
