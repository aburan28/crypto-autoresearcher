  global_claim_boundary:
    - High rank is a lower bound, not a dependence certificate.
    - Rank below the marked point count forces dependence modulo torsion.
    - Rational, number-field function-field, finite-field function-field and local lifts are distinct.
    - Only small synthetic mathematical instances are proposed in the first studies.
    - A local solution or tangent direction does not certify a global rational solution.
    - Failure of a bounded search does not certify nonexistence.
    - No production target, private-key recovery or discrete-log solver is part of these designs.
    - No finite-field experiment establishes uniformity over varying rational curves.
