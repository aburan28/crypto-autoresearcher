  constraints:
  - Read analysis/ecc-ideation-20260930/BRIEF.md in full first; sections 0 and 3 bind this lane.
  - Read context/L3-AUXIN.md and the three prior proposals before writing; a record that restates them, or that merely re-proposes the queued census, is returned.
  - >-
    THE GATE STANDS. DEC-20260802-204 records that acquiring [x^d]P from ordinary
    input (P, [x]P) is unestablished below rho-scale work; nothing here reopens
    ordinary ECDLP. Every proposal names the protocol or artefact that SUPPLIES
    the auxiliary powers, cites its specification (provenance marked), and
    reports a supply whose parameters are not publicly pinned as UNDETERMINED.
  - >-
    KNOWN-RESULT POSITIONING. Cheon's algorithm and its p+1 / Phi_k(p) extensions,
    the Kim-Cheon and Satoh generalisations, the Brown-Gallant and Jao-Yoshida
    related bounds, and the published applications to SNARK powers-of-tau setups
    and to q-type assumptions are the nearest prior work; name each you rely on,
    mark recalled unless fetched, and state the delta over it quantitatively.
    Rediscovering Cheon is `known`; the program did it once (APR-206) and will
    not file it twice.
  - >-
    EXACT ACCOUNTING. Every claimed exponent is stated as time AND memory versus
    the memory-charged rho baseline of the same curve (KR-RHO-825bca for the
    constants, KR-RHO-7d93f6 for the time-space bound), with the auxiliary-input
    size d, the number of powers actually needed, and the parallelisation
    behaviour named. Kangaroo-style low-memory variants are priced, not assumed.
  - >-
    DECISIVE OUTCOMES. Each minimal_test has an outcome table in which both a
    positive (an inert-at-deployed-parameters verdict with a certificate) and a
    negative are publishable results, a planted-divisor positive control, and a
    divisor-free null; falsification thresholds are fixed in the record.
  - Position every idea against context/frontier-map-generic-rho.md rows in prior_art.rows_checked (KR-RHO-13bf67, KR-RHO-ea34b8, KR-RHO-46c2c6, KR-RHO-7d93f6 at minimum) and name the nearest.
  - Never edit an existing record. Write only inside the declared write_scope.
  - No runs, no fabricated outputs, timings, statistics or citations (AGENTS.md rules 5 and 9). The crypto-kb index is empty this session; use Grep and WebFetch and record what was searched.
  - 'Proposals only: no hypothesis, experiment, approval or status change; a message is never a permission.'
