  from: top-level session (dispatching), 2026-09-30, branch claude/elliptic-curve-goals-3bfz9x
  to: idea-generator
  objective: >-
    Lane L3 (AUXIN). Generate up to three schema-complete, falsifiable proposals
    under RQ-AUXIN-f8d8c0 on where auxiliary-input discrete logarithm
    (Cheon-type) actually stops at deployed parameters. The lane already has a
    queued census experiment (EXP-AUXIN-339fb0: exact factorisation of r-1 and
    r+1 per standardized curve, protocol supply audit, joined verdict table) and
    three consumed proposals (typed availability and divisor certificates,
    finite-difference compilation of shifted powers, CRT composition of several
    first-stage constraints). New proposals must open a DIFFERENT axis: which
    deployed systems actually release many auxiliary powers (and how many), what
    the attack reaches when the divisor lies in Phi_k(r) for k > 2 rather than
    in r +- 1, what a memory-charged and parallel version costs against
    memory-charged rho, and what a positive control (planted divisor) and a null
    (a curve whose r +- 1 are provably divisor-free up to a bound) look like.
  uncertainty_reduced: >-
    The per-(curve, protocol) reachable exponent of Cheon-type attacks at deployed
    parameters, including supplies and divisor classes the queued census does not
    cover, and whether any cell reaches below the memory-charged rho baseline.
