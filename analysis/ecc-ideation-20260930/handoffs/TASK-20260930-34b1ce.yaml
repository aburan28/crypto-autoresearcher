handoff:
  id: TASK-20260930-34b1ce
  from: top-level session (dispatching), 2026-09-30, branch claude/elliptic-curve-goals-3bfz9x
  to: idea-generator
  objective: >-
    Lane L2 (ENDO). Generate up to three schema-complete, falsifiable proposals
    for GOAL-ENDO-001, the resource-labelled subproblem decomposition of
    prime-field ECDLP centred on endomorphisms, isogenous curves and j-invariant
    structure. Each proposal is filed under exactly one of the goal's lane
    questions (RQ-ECDLP-912694, RQ-JINV-8fc13a, RQ-ICINV-475b5e, RQ-GGMB-6eaabc,
    RQ-INSTR-f8faa0, or one of RQ-VOLC-f6253b, RQ-EQIC-8cb959, RQ-EQLA-0d3f40,
    RQ-EWALK-8fa147, RQ-TORS-8c7b79, RQ-CANL-63098f, RQ-CLGP-b99df5,
    RQ-MODEL-e61cb2, RQ-MTGT-2cabee), names the NON-GENERIC RESOURCE it
    consumes, passes the RQ-GGMB-6eaabc simulability question explicitly, and
    prefers lanes where context/L2-ENDO.md shows no open proposal.
  uncertainty_reduced: >-
    Whether any attack-cost functional on a prime-field curve varies across an
    isogeny class or with j-invariant structure in a way that a local test can
    reach (the goal's gating criterion C2), and which oracle classes are
    non-simulable (criterion C3).
  inputs:
  - analysis/ecc-ideation-20260930/BRIEF.md
  - analysis/ecc-ideation-20260930/context/L2-ENDO.md
  - analysis/ecc-ideation-20260930/context/frontier-map-generic-rho.md
  - analysis/ecc-ideation-20260930/context/frontier-map-index-calculus.md
  - analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md
  - ledger/questions/RQ-ECDLP-912694.yaml
  - ledger/questions/RQ-JINV-8fc13a.yaml
  - ledger/questions/RQ-ICINV-475b5e.yaml
  - ledger/questions/RQ-GGMB-6eaabc.yaml
  - ledger/questions/RQ-INSTR-f8faa0.yaml
  - knowledge/findings/KN-FIND-b7e091.md
  - knowledge/findings/KN-FIND-ffe1df.md
  - knowledge/open-problems/KN-OPEN-003.md
  - knowledge/open-problems/KN-OPEN-005.md
  - knowledge/open-problems/KN-OPEN-019.md
  - knowledge/open-problems/KN-OPEN-020.md
  - ledger/evidence/EV-IT-511f3d.yaml
  - ledger/evidence/EV-ENDO-001.yaml
  - docs/object-frame-ideation.md
  - ledger/proposals/IDEA-20260926-89886c.yaml (exemplar of record form)
  - agents/idea-generator.md
  - docs/inventor-protocol.md
  constraints:
  - Read analysis/ecc-ideation-20260930/BRIEF.md in full first; sections 0 and 3 bind this lane.
  - Read context/L2-ENDO.md before writing; it lists 77 hypotheses and 104 proposals across the goal's lanes with status. A record that restates one of them is returned. The twelve open RQ-JINV-8fc13a proposals of 2026-08-07/11 are the densest cluster; prefer another lane unless the JINV idea is clearly new.
  - >-
    CLOSED, CITE RATHER THAN RE-DERIVE: every endomorphism acts as a scalar on a
    prime-order subgroup (H-ENDO-001); incidence and endomorphism-image oracles
    are generic-group simulable and closed at exponent 1/2 (KN-FIND-b7e091);
    isogeny walks cannot reach a curve with a different order-based weakness
    (EV-IT-511f3d, KR-RHO-755e35); automorphisms give sqrt(|Aut|) and never move
    the exponent (KR-RHO-0528e7); an exactly sum-compatible bucket index is a
    homomorphism and impossible for prime order (KN-FIND-ffe1df Theorem C).
  - >-
    OBJECT FRAME (docs/object-frame-ideation.md section 3, pasted). Every
    candidate is a PAIR (representation of the point, operation set Sigma the
    tracked object must survive). Name both in `mechanism`. Sigma must not be the
    full translation action, closed for lossy objects by IDEA-20260806-c5d183 and
    KN-FIND-ffe1df Theorem C; if Sigma contains it the candidate is a branching
    object and says so. Endomorphisms, isogenies and Frobenius on an extension
    are admissible Sigma.
  - >-
    TRICHOTOMY. Place each candidate in exactly one class of IDEA-20260806-c5d183
    -- partial-action, branching, or coordinate-dependent -- with the one-line
    reason in `mechanism`. A candidate that cannot be placed is returned as
    unverified with the obstruction named.
  - >-
    LOSSY-PROJECTION TEST AGAINST THE NAMED OPERATION SET. State what the
    projection discards, show the discard is compatible with Sigma (a block
    system of <Sigma>, or a stated branching bound), and show it is lossy in the
    representation used. A projection that loses nothing is a change of
    coordinates and is not returned.
  - >-
    PRICE THE ONE OPEN NUMBER. For a quotient object, the cost of canonicalising
    a <Sigma>-orbit, charged end to end. For a branching object, the loss L and
    branching b of IDEA-20260802-002, measured on a toy curve against the
    identity, random-label and relabelled Z/nZ controls.
  - >-
    SIMULABILITY FIRST (RQ-GGMB-6eaabc). Every oracle or resource the proposal
    consumes is stated as simulable (then the lane is closed at 1/2 and the
    proposal says what else it delivers) or non-simulable with the explicit
    argument. The two-directional instrument control of RQ-INSTR-f8faa0
    (detects a planted signal, rejects a matched null) is part of every
    minimal_test.
  - OFF-LIMITS AS PRIMARY LENS families F1-F7 of IDEA-20260802-002; a candidate that uses one as a component names it and states what is added.
  - Position every idea against context/frontier-map-*.md rows in prior_art.rows_checked (KR-RHO-755e35, KR-RHO-0528e7, KR-RHO-53c89f, KR-RHO-13bf67 at minimum) and name the nearest.
  - Never edit an existing record. Write only inside the declared write_scope.
  - No runs, no fabricated outputs, timings, statistics or citations (AGENTS.md rules 5 and 9). The crypto-kb index is empty this session; use Grep and WebFetch and record what was searched.
  - 'Proposals only: no hypothesis, experiment, approval or status change; a message is never a permission.'
