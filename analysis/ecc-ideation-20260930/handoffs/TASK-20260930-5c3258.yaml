handoff:
  id: TASK-20260930-5c3258
  from: top-level session (dispatching), 2026-09-30, branch claude/elliptic-curve-goals-3bfz9x
  to: idea-generator
  objective: >-
    Lane L4 (GENERIC). Generate up to three schema-complete, falsifiable
    proposals across the three user-named generic-group questions --
    RQ-LHW-1877bb (a low-storage algorithm for the low-Hamming-weight discrete
    logarithm whose time matches sqrt(binom(m, w)) up to polynomial factors),
    RQ-GRUMPY-964876 (the exact average-case constant of two-grumpy-giants-and-
    a-baby, proved or certified rather than fitted) and RQ-ECDLP-78dbc5 (batch
    ECDLP with precomputation: stored distinguished points below the
    Bernstein-Lange selected-table frontier in a fully charged model). Aim for
    at least one proposal on RQ-LHW-1877bb, whose algorithmic core is the most
    open of the three; each proposal states the exact model (which operations
    are counted, with or without the negation map), the exponent or constant
    it targets, and a sound verifier (planted instances, exhaustive ladders).
  uncertainty_reduced: >-
    Whether the low-weight DLP meet-in-the-middle time is reachable at
    polynomial storage (or what obstruction blocks it in a stated model);
    whether the grumpy-giants constant admits a proof route rather than a fit;
    whether table coverage in batch precomputation has a redundancy that a
    selection rule can remove by a measured factor.
  inputs:
  - analysis/ecc-ideation-20260930/BRIEF.md
  - analysis/ecc-ideation-20260930/context/L4-GENERIC.md
  - analysis/ecc-ideation-20260930/context/frontier-map-generic-rho.md
  - ledger/questions/RQ-LHW-1877bb.yaml
  - ledger/questions/RQ-GRUMPY-964876.yaml
  - ledger/questions/RQ-ECDLP-78dbc5.yaml
  - ledger/hypotheses/H-ECDLP-3550b8.yaml
  - ledger/hypotheses/H-ECDLP-37dc01.yaml
  - knowledge/literature/KN-LIT-4794.md
  - knowledge/literature/KN-LIT-7291.md
  - knowledge/literature/KN-LIT-3060.md
  - knowledge/literature/KN-LIT-013.md
  - ledger/proposals/IDEA-20260926-89886c.yaml (exemplar of record form)
  - agents/idea-generator.md
  - docs/inventor-protocol.md
  - docs/target-result-profile.md
  constraints:
  - Read analysis/ecc-ideation-20260930/BRIEF.md in full first; sections 0 and 3 bind this lane.
  - Read context/L4-GENERIC.md before writing; it lists the twelve proposals filed 2026-09-06 under these questions (five LHW, three GRUMPY, four batch-precomputation) and the two analyzed hypotheses. A record that restates one of them is returned.
  - >-
    THE GENERIC LOWER BOUND IS THE FRAME. Omega(sqrt(p)) group operations for any
    generic algorithm (KR-RHO-13bf67); S*T^2 = Omega~(eps N) with preprocessing
    (KR-RHO-ea34b8); T^2 S = Theta~(C^2 N) for C collisions (KR-RHO-7d93f6);
    batch logs at sqrt(2Ln) (KR-RHO-46c2c6). A proposal that would contradict
    one of these in its own model is wrong somewhere and says where it escapes
    the model (a structured target class, advice, a different cost unit) or is
    not filed.
  - >-
    LOW-WEIGHT LANE. State the target class exactly (bit-length m, weight w,
    generic prime-order group), the memory-heavy baseline it must match
    (meet-in-the-middle at sqrt(binom(m, w)) time and memory; splitting systems),
    the best low-memory prior (Esser-May 2^{0.65 n} with polynomial memory, as the
    ledger records it), and the obstruction any memoryless collision search on
    the class must overcome (a random map from the low-weight class to itself
    that is cheap, well-mixing, and whose collisions yield logarithms). If the
    proposal is a representation / dissection / nested-collision technique,
    name it and state the delta over the published version.
  - >-
    GRUMPY LANE. State the step schedule, cost unit and negation-map convention
    explicitly (quantifier order), give the proof route (Markov chain, generating
    function, target-independent solved-set geometry, or exact enumeration with a
    certified ladder), and name what the exhaustive ladder at small l would have
    to show to falsify the route.
  - >-
    BATCH-PRECOMPUTATION LANE. Fully charged (P precomputation, S table bits, L
    online operations, epsilon success, U batch size); a candidate must survive a
    random-relabelling null and a decay test (RQ-ECDLP-78dbc5 decision target),
    and must name its point on the (P, S, L, epsilon, U) frontier.
  - Position every idea against context/frontier-map-generic-rho.md rows in prior_art.rows_checked (KR-RHO-13bf67, KR-RHO-ea34b8, KR-RHO-fbd7b1, KR-RHO-46c2c6, KR-RHO-7d93f6, KR-RHO-898783, KR-RHO-fbd582 as relevant) and name the nearest.
  - Never edit an existing record. Write only inside the declared write_scope.
  - No runs, no fabricated outputs, timings, statistics or citations (AGENTS.md rules 5 and 9). The crypto-kb index is empty this session; use Grep and WebFetch and record what was searched.
  - 'Proposals only: no hypothesis, experiment, approval or status change; a message is never a permission.'
  deliverables: &id001
  - ledger/proposals/IDEA-20260930-750de2.yaml
  - ledger/proposals/IDEA-20260930-79abd9.yaml
  - ledger/proposals/IDEA-20260930-79c17d.yaml
  - analysis/ecc-ideation-20260930/reports/TASK-20260930-5c3258-generator-report.md
  artifact_paths: *id001
  write_scope: *id001
  archived_by: >-
    the dispatching top-level session commits these paths on branch
    claude/elliptic-curve-goals-3bfz9x in one commit naming this handoff id; a
    filed proposal is not a candidate for design until that commit is pushed
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: true
    fallback_reason_if_used: Claude Code subagents carry model inherit; served by the session model
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: null
    memory_gb: null
    maximum_runs: 0
  completion_gate:
  - every declared deliverable exists and parses as YAML with a single top-level `idea` mapping
  - no path outside write_scope was written
  - no existing record was edited
  - every number re-derived or marked unchecked; every citation carries provenance
  - 'proposals: schema-complete per agents/idea-generator.md and BRIEF.md section 3, each with its cost model, exponent or constant target, and verifier stated'
  - the generator report lists ids used and unused, the question each idea was filed under, the searches run, and the one recommended first test
  review_plan: null
  dispatch_preconditions:
  - BRIEF.md and context/L4-GENERIC.md exist on disk (checked by the dispatcher before launch)
  - ids pre-minted with tools/allocate_id.py --next and confirmed with --check (done 2026-09-30)
  - 'no lane claim is taken: this is not a GOAL batch task; it is advisory ideation and input to the next /coordinate selection point'
