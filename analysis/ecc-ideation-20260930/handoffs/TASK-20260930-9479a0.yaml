  constraints:
  - Read analysis/ecc-ideation-20260930/BRIEF.md in full first; sections 0 and 3 bind this lane.
  - Read docs/object-frame-ideation.md in full and context/L5-REPR.md (77 hypotheses, 54 proposals) before writing; a record that restates one of them, or that is a known family in new notation, is returned.
  - >-
    OBJECT FRAME. Every candidate is a PAIR (representation of the point,
    operation set Sigma the tracked object must survive). Name both explicitly in
    `mechanism`. Sigma must not be the full translation action, which is closed
    for lossy objects by IDEA-20260806-c5d183 and KN-FIND-ffe1df Theorem C; if
    Sigma contains the full translation action, the candidate is a branching
    object and must say so. Index calculus is Class I, partial-action
    (translation by factor-base elements only).
  - >-
    TRICHOTOMY. Place each candidate in exactly one class of IDEA-20260806-c5d183
    -- partial-action, branching, or coordinate-dependent -- and give the
    one-line reason in `mechanism`. A candidate that cannot be placed is returned
    as `unverified` with the obstruction named, not silently dropped.
  - >-
    LOSSY-PROJECTION TEST, AGAINST THE NAMED OPERATION SET. Per
    docs/inventor-protocol.md section 2 and IDEA-20260901-863e36: state what the
    projection discards, show the discard is compatible with Sigma (a block system
    of <Sigma>, or a stated branching bound), and show it is lossy in the
    representation actually used. A projection that loses nothing is a change of
    coordinates and is not returned.
  - >-
    PRICE THE ONE OPEN NUMBER. For a quotient object, the cost of canonicalising a
    <Sigma>-orbit, charged end to end. For a branching object, the loss L and
    branching b of IDEA-20260802-002, with the minimal test stating how they are
    measured on a toy curve against the identity, random-label, and generic-group
    (relabelled Z/nZ) controls.
  - >-
    OFF-LIMITS AS PRIMARY LENS: families F1-F7 of IDEA-20260802-002, plus the
    lane-specific closures: the bounded-degree algebraic factor base of
    KN-OPEN-020; the Kummer-line and degree-d-function-on-E representations
    (closed at model lever 1); representation techniques over F_{p^2}
    (KR-RHO-5b1c0a, Delaplace-May at p^{1.314}). A candidate that uses one as a
    component names it and states what is added.
  - >-
    FACTOR-BASE ESCAPE. Any candidate factor base or relation mechanism must say
    which of the KN-OPEN-020 open classes it belongs to -- high-degree,
    implicit-membership, or target-dependent description -- and charge
    description, membership, relation, descent, time and memory costs, or declare
    itself inside the scoped-out class and stop.
  - >-
    REPRESENTATION CLASS. Name the R1/R2/R3 class of RQ-ECDLP-623a32 the
    representation belongs to, and the attack stage (factor-base membership,
    relation decomposition, collision structure, linear algebra, descent) whose
    charged cost it claims to change, in one clause of `claim`.
  - >-
    COORDINATE-BIAS LANE (RQ-ECDLP-4fcbd3). The Weil / character-sum bound is the
    ceiling: any distinguisher on a cheap coordinate function has bias
    O(p^{-1/2}) and the record must say where its object concentrates beyond it,
    and how the two known-true objects (anomalous curves; small embedding degree)
    are detected by the same instrument as the positive control.
  - >-
    PROOF SEARCH MAP before any compute (docs/inventor-protocol.md section 8):
    exact bottleneck, baseline embedding, observation collision, quantifier order,
    method ceiling with a nearby-object control.
  - Position every idea against context/frontier-map-*.md rows in prior_art.rows_checked and name the nearest; KR-IC rows on Semaev / Weil descent / factor-base negatives and KR-RHO-13bf67 / KR-RHO-5b1c0a at minimum.
  - Never edit an existing record. Write only inside the declared write_scope.
  - No runs, no fabricated outputs, timings, statistics or citations (AGENTS.md rules 5 and 9). The crypto-kb index is empty this session; use Grep and WebFetch and record what was searched.
  - 'Proposals only: no hypothesis, experiment, approval or status change; a message is never a permission. A session that returns fewer than three candidates still returns the section 5 Pareto block on each record it does file and says in its report why the others were not found.'
