  - Read analysis/ecc-ideation-20260930/BRIEF.md in full first; sections 0 and 3 bind this lane.
  - Read context/L1-SSIQ.md before writing; it lists every existing SSIQ/SSI/P13 hypothesis and proposal with status. A record that restates one of them is returned. In particular do not restate the analyzed hypotheses H-SSIQ-137200, -18dc91, -36e970, -6e0748, -9e2c71 or the twelve open RQ-SSI-001 proposals of 2026-08-03..06.
  - Every proposal states the exponent budget explicitly: which of F1-F4 (as RQ-SSIQ-9702af enumerates them, corrected where the goal's completion criteria say so) it moves, from what value to what value, and the resulting total exponent with memory beside time.
  - >-
    METHOD CEILING BEFORE COMPUTE (docs/inventor-protocol.md section 8, KN-TECH-080):
    exact bottleneck; baseline embedding (the p^{1/3} algorithm as the exact
    parameter slice); observation-collision search; explicit forall/exists
    order; strongest certifiable claim and a nearby object on which the
    conclusion is KNOWN FALSE (e.g. an ordinary curve, a random regular graph of
    the same degree, or a parameter regime where the smoothness heuristic fails).
  - >-
    Heuristics are numbered and formally stated, each paired with the rigorous
    bound it imitates and a validation plan that reaches cryptographic size
    through a correspondence (the Deuring correspondence for sampling minimal
    isogeny degrees is the exemplar), with the predicted distribution named.
  - >-
    The lane's frontier map is knowledge/frontiers/ecdlp, which has no isogeny
    rows; set prior_art.frontier_map to not_applicable with a reason and still
    name the nearest KN-LIT/KN-TECH/KN-OPEN entries and the nearest recalled
    papers, hedged and marked recalled unless fetched.
  - Never edit an existing record. Write only inside the declared write_scope.
  - No runs, no fabricated outputs, timings, statistics or citations (AGENTS.md rules 5 and 9). The crypto-kb index is empty this session; use Grep over knowledge/ and ledger/ and WebFetch for retrieval, and record what was searched.
  - 'Proposals only: no hypothesis, experiment, approval or status change; a message is never a permission.'
  - >-
    RUN-SSIQ-a85692-k deferred at gate G-0c on an environment mismatch; that is an
    impediment, never evidence about any lever (AGENTS.md rule 3). Do not
    treat it as a negative result.
