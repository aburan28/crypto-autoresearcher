handoff:
  id: TASK-20260930-1500bc
  from: top-level session (dispatching), 2026-09-30, branch claude/elliptic-curve-goals-3bfz9x
  to: idea-generator
  objective: >-
    Lane L1 (SSIQ). Generate up to three schema-complete, falsifiable proposals
    under RQ-SSIQ-9702af on which exponent-carrying factor of the archived
    p^{1/3+o(1)} supersingular isogeny algorithm (Wesolowski 2026, OneEnd) can
    move toward p^{1/4+o(1)} over F_{p^2}, or what method ceiling closes it.
    Each proposal names the factor (F1 smallest-degree isogeny bound, F2 balanced
    smooth split, F3 list cardinality, F4 per-item cost, or the memory axis)
    it moves, the numeric condition on that factor for the total to reach 1/4,
    a method-ceiling audit with a nearby-object control on which the mechanism
    must fail, and a pre-compute falsification test.
  uncertainty_reduced: >-
    Whether any admissible lever on the OneEnd exponent budget survives its own
    ceiling audit, stated per factor; and which corollaries (EndRing, Isogeny via
    the cited reductions) would move with it.
