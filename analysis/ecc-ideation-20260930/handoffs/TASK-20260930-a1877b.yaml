  constraints:
  - Read analysis/ecc-ideation-20260930/BRIEF.md in full first; sections 0 and 3 bind this lane.
  - Read context/L6-CONSTRAINT.md (14 hypotheses, 17 proposals) and the five SATIC proposals of 2026-09-04 before writing; a record that restates one of them, or that re-proposes the WDSat-vs-F4 reproduction already specified, is returned.
  - >-
    THE CEILING IS THE FRAME. The SATIC proposals predict a search ceiling of
    exactly ml - log2|G| bits with no above-leaf pruning on the descended
    binary-field system; the certified refutation results at m = 2
    (KN-FIND-5a8d3e, KN-FIND-c3a917) show what a degree-bounded closure proves
    and does not prove. A proposal aiming at outcome (a) must say where it
    escapes the ceiling (which structural property, on which cell) and what
    null ladder (same-support random systems, planted satisfiable systems)
    falsifies it; a proposal aiming at (b) or (c) says so in its first sentence.
  - >-
    PRIME-FIELD AND EXTENSION-FIELD SCOPE. RQ-ECDLP-f0a7b0 is broader than the
    binary pdp: SMT over finite fields (bit-vector and finite-field theories,
    e.g. the cvc5 finite-field solver line -- mark recalled unless fetched),
    #SAT / model counting for exact decomposition-count distributions at toy
    scale, MaxSAT or ILP for factor-base selection, cube-and-conquer with learned
    branching orders, CDCL(T) with a Groebner theory, and proof-producing
    (DRAT/LRAT/FRAT) UNSAT certificates for decomposition attempts are all in
    scope; each is positioned against the nearest published use and the
    program's own CERTBIN certificate instruments.
  - >-
    CHARGE END TO END. A solver-step gain is priced inside the full index-calculus
    cost (relation yield per attempt, linear algebra, descent) against matched
    rho (KR-IC rows on the map give the standing negatives and the SAT/WDSat
    reports); a per-attempt speedup that does not change the product law of
    KN-FIND-aa2efc says so.
  - >-
    CERTIFIABILITY IS A LEGITIMATE DELIVERABLE. A proposal whose honest outcome
    is (c) -- e.g. a certificate format the run wrapper re-verifies
    independently, per docs/claims-and-verification.md -- is welcome if it
    names the claim tier it raises and the cost of producing and checking the
    certificate.
  - Position every idea against context/frontier-map-index-calculus.md rows in prior_art.rows_checked (the SAT / WDSat, Groebner-degree, Weil-descent and factor-base rows at minimum) and name the nearest.
  - Never edit an existing record. Write only inside the declared write_scope.
  - No runs, no fabricated outputs, timings, statistics or citations (AGENTS.md rules 5 and 9). The crypto-kb index is empty this session; use Grep and WebFetch and record what was searched.
  - 'Proposals only: no hypothesis, experiment, approval or status change; a message is never a permission.'
