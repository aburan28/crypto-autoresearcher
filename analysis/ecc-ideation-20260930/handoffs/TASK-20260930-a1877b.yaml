  from: top-level session (dispatching), 2026-09-30, branch claude/elliptic-curve-goals-3bfz9x
  to: idea-generator
  objective: >-
    Lane L6 (CONSTRAINT). Generate up to three schema-complete, falsifiable
    proposals under RQ-ECDLP-f0a7b0 (can SAT, SMT, model-counting and
    proof-producing constraint technology change the charged cost, or the
    certifiability, of factor-base design, relation finding and the algebraic
    step of prime-field and extension-field elliptic-curve index calculus) or
    RQ-SATIC-1ae57a (which structural property of the descended binary-field
    point-decomposition system, not which solver, does the work behind the
    reported WDSat-over-Groebner advantage). Each proposal states which of the
    three outcomes of RQ-ECDLP-f0a7b0's decision target it aims at -- (a) a
    search exponent, (b) a constant or amortised per-target cost, (c)
    certifiability or measurement fidelity -- and is honest that (c) is a
    tooling deliverable, not an attack.
  uncertainty_reduced: >-
    Whether any constraint-technology route moves a search exponent against the
    SATIC ceiling (ml - log2|G| search bits with no above-leaf pruning) or its
    prime-field analogue; failing that, which measured constants or certificates
    it delivers and on which cells.
