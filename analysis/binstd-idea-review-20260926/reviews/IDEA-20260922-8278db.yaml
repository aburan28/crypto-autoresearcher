review:
  idea_id: IDEA-20260922-8278db
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-5d1a51
  ranking_context:
    rank: 25
    disposition: design_after
    hold_id: HOLD-L
  claim_restated: >-
    Take IDEA-20260906-a77711's Arm B (index calculus on the trace-zero variety
    T_k = ker(Tr), dimension k-1, containing G) at cost q^{2-2/g} with g=k-1 plus
    its own disclosed (k-1)! per-relation overhead, and evaluate it at the five
    deployed c2pnb rows (q=2^16, k in {11..23}). (A) shows r ~ q^{k-1} to within one
    bit (a genuine audited near-identity). (B) the naive charged number q^{2-2/g}(k-1)!
    lands 27 to 73 bits BELOW matched rho, growing with k. (C) but g/log2(q)=(k-1)/16
    exceeds 1 at three of five rows, exactly a77711's own "exponent meaningless for
    n growing with the field" regime failure. (D) the true per-trial decomposition
    cost at arity 10-22 is unmeasured anywhere in the program, so the cell must be
    filed OPEN with that quantity named -- NOT as a break and NOT as a defined cost.
  core_argument_check:
    - step: '(B) naive charged cost q^{2-2/(k-1)}*(k-1)! in bits'
      verdict: holds
      note: >-
        Reproduced exactly: 16*(2-2/g)+log2((k-1)!) = 50.6, 58.2, 74.3, 82.7, 100.5
        for k=11,13,17,19,23 (record identical). log2(10!)=21.79 ... log2(22!)=69.93 confirmed.
    - step: '(B) margins below matched rho'
      verdict: holds
      note: >-
        Using the record's rho (77.9..173.3): margins 27.3, 35.5, 51.3, 58.8, 72.8
        bits below rho, growing with k (record identical). Note the rho column is the
        same 0.5-bit-low d11575 convention (A4); the canonical sqrt(pi r/(4k)) rho
        would widen each margin by 0.5 bit, strengthening the record's point, not weakening it.
    - step: '(C) regime ratio rho_reg = (k-1)/16'
      verdict: holds
      note: 'Reproduced: 0.625, 0.750, 1.000, 1.125, 1.375; exactly 1 at k=17. exceeds 1 at k=19,23.'
    - step: '(A) r ~ q^{k-1} to within one bit'
      verdict: holds
      note: 'q^{k-1}=16(k-1) bits = 160,192,256,288,352 vs audited r of 161,193,257,289,353 -- one-bit agreement, consistent with the Hasse interval.'
    - step: '(D) per-trial cost at arity 10-22 is unmeasured (IDEA-20260807-32f96d)'
      verdict: unchecked
      note: >-
        Cited from IDEA-20260807-32f96d ("arity m>=4 has ZERO measured cost cells");
        I did not independently re-verify the corpus has no such cell, but the brief's
        own product-law discussion (Semaev S_{m+1} costs grow super-exponentially in m)
        and RQ-SDEG/DREG being open support it. The (k-1)! charge prices only the trial
        COUNT, not the cost of one trial -- correctly identified as the missing quantity.
  verdict: sound
  defects:
    - what: rho column inherits the 0.5-bit-low d11575/c07598 convention
      where: claim (B), target_complexity.best_known
      fix: restate rho as sqrt(pi r/(4k)); the margins grow by 0.5 bit, so the "apparent break" the record discredits is if anything slightly larger -- no verdict changes.
    - what: Gorla-Massierer and Gaudry are recalled, not read (the T4 latent figure)
      where: citations (provenance recalled), frontier_check
      fix: >-
        Read Gorla-Massierer (iacr:2014/318) at source for its MEASURED per-relation
        cost at g=2,4 -- the single best calibration for (D) -- before any cell moves
        from OPEN. This is the hold's NA-4 gate.
    - what: the 27-73 bit figure is a latent overclaim if ever cited without (C),(D)
      where: interpretation_limits (the record itself flags this)
      fix: >-
        Tripwire T4 is correct: any downstream use of (B)'s numbers without (C) and
        (D) is a misuse. The record handles this exactly as inventor-protocol section
        4 asks -- a named obstruction (rho_reg>=1) plus a named missing quantity.
  ecc2k130_bearing: >-
    Zero operational transfer. T_k = ker(Tr : Res_{F_{q^k}/F_q}(E) -> E) requires a
    proper subfield F_q; ECC2K-130 (n=131 prime) has none, so there is no trace map
    and no trace-zero variety -- the line does not exist for it (the record's own
    null-object control). The implied arity is m = k-1 = 10 to 22, squarely in the
    m>=5 regime the product-law floor says is the ONLY regime that could threaten
    rho -- but here that arity lives on the composite c2pnb curves, not on ECC2K-130,
    and 8278db's whole point is that the per-trial oracle cost at that arity is
    unmeasured and the exponent formula is invalid where rho_reg>=1. What transfers
    to ECC2K-130 is purely methodological: the regime-validity check g/log2(q) as a
    tripwire against reporting a misapplied asymptotic as a cost, which is exactly
    the discipline the ECC2K-130 reachability decision needs when it prices any
    high-arity decomposition line against 2^60.8.
  agreement_with_hold: agrees
  agreement_note: >-
    Strongly agree with design_after (HOLD-L) and tripwire T4. This is a model record
    for the closure standard: it computes a dramatic-looking number specifically to
    DISCREDIT it, names the obstruction (rho_reg>=1 at 3/5 rows) and the missing
    quantity (per-trial cost at arity 10-22), and files the cell OPEN rather than as
    a break or a cost. Read Gorla-Massierer at source; any design that could move the
    cell toward "defined" is a break-adjacent claim and gets review-breakthrough.
    The latent 27-73 bit figure is correctly quarantined.
  concrete_experiment:
    cell:
      curve: >-
        Toy subfield cells E/F_{2^d} over F_{2^{dk'}} with (d,k')=(4,3),(4,5),(4,7),(4,9)
        giving g=k'-1 in {2,4,6,8} at dk' in {12,20,28,36} <= 41; construct the
        trace-zero variety's descended decomposition system at each g.
      m: 'k''-1 (arity spans 2..8 at toy scale, extrapolated toward deployed 10..22)'
      l: 'toy subgroup order at each cell'
      factor_base: 'the T_k factor base (F_q-linear trace-zero condition on Res(E)), a77711''s construction'
      targets: 'certified decomposition attempts; both a decomposing and a non-decomposing tuple per g'
      seeds: enumerated at toy scale
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/macaulay.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - 'new: trace-zero-variety / Res(E) descended-system builder at growing arity (pure Python)'
      - 'missing: msolve/Magma/Singular for a fast Groebner solve at higher g; the Macaulay-rank instrument caps the affordable g'
    procedure:
      - Part 1 (arithmetic, done) -- reproduce (A),(B),(C): the naive charged numbers, margins, and regime ratios (all reproduced in this review).
      - Part 2 (literature, not compute) -- read Gorla-Massierer's MEASURED per-relation cost at g=2,4 and compare to a77711's H2-only prediction 1/(g-1)!, yielding a calibration ratio.
      - Part 3 (toy, the scientific content) -- at each (d,k') build the T_k descended system and MEASURE the operation count of one decomposition attempt with the Macaulay-rank instrument; fit a growth law in g and state the extrapolation distance to g=22.
    metrics:
      - name: naive_charged_cost_bits_per_row
        unit: bits
        definition: q^{2-2/(k-1)}*(k-1)! per deployed row (already computed; reproduced here)
      - name: regime_ratio_rho_reg
        unit: dimensionless
        definition: (k-1)/16 per row (already computed; reproduced here)
      - name: per_trial_decomposition_cost_vs_g
        unit: F_q operations (log2)
        definition: measured cost of one arity-g decomposition attempt at toy scale, fitted as a law in g -- the named missing quantity
    controls:
      - 'Small-g reproduction slice (g=2), matching a77711''s toy ladder and Gorla-Massierer''s implemented case.'
      - 'Null object: a curve not defined over a subfield -- no T_k, instrument must report "no construction".'
      - 'Matched non-T_k factor base of the SAME arity g -- isolates whether per-trial growth is arity-driven or trace-zero-specific.'
      - 'Every claimed decomposition carries a re-verified certificate (recompute the sum).'
    outcomes:
      positive: per-trial cost grows slower than factorial (e.g. polynomial in g) even at toy scale -- the naive number gains credibility and the cell moves from OPEN toward DEFINED with the fitted law replacing (k-1)!; this would be break-adjacent and triggers review-breakthrough.
      negative: 'per-trial cost grows explosively (matching Groebner worst cases) -- the naive number is confirmed an artefact and the cell closes as "line inert, obstruction is per-trial solving cost".'
      artifact: the toy g<=8 law does not extrapolate to g=22 (phase transition / memory wall) -- no deployed cell may be emitted; the extrapolation distance stands.
    falsification_threshold: >-
      A recomputation of (B) or (C) disagreeing by >0.5 bit or >0.01 in rho_reg
      supersedes the record. A Part-3 toy law showing per-trial cost surviving even a
      partial extrapolation to deployed g is the most consequential possible outcome
      and triggers independent review before any further step.
    estimated_cost:
      implementation: low
      compute: low (Part 1 done; Part 3 at g<=8 reuses existing instruments; ESTIMATE hours to a day; higher g needs a Groebner engine not installed)
    zero_run_prerequisites:
      - Read Gorla-Massierer (iacr:2014/318) measured g=2,4 costs at source.
      - Confirm no existing corpus cell measures arity>=4 per-trial cost (IDEA-20260807-32f96d).
  successor_seam: >-
    A cross-lane proposal that lifts rho_reg = g/log2(q) into a standing GATE on
    EVERY decomposition/cover line in the reachability table: before any q^{2-2/g}
    or GHS cost is filed as DEFINED, require rho_reg < some threshold and, above it,
    force an OPEN verdict with the per-trial cost named. This turns 8278db's one-off
    catch into a reusable overclaim tripwire for d11575's GHS lane, the Semaev
    high-arity lines, and any future "apparent break by a borrowed asymptotic",
    which is precisely the failure mode the product-law floor table exists to price.
  records_read:
    - IDEA-20260922-8278db (full)
    - ranking-context-DEC-20260924-99ce20.yaml (HOLD-L)
    - BRIEF.md sections 1,2,3,6 (product-law floor table)
    - AGENTS.md Core rules 5,9; docs/inventor-protocol.md 4
    - experiments/EXP-CERTBIN-e94b27/impl/ (README, file listing)
  not_read:
    - Gorla-Massierer iacr:2014/318 (recalled by the record, the key calibration source)
    - Gaudry J. Symbolic Comput. 44 (2009) (recalled)
    - IDEA-20260906-a77711 body (claim/mechanism/target sections read by the record)
