review:
  idea_id: IDEA-20260922-2e2a58
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-5d1a51
  ranking_context:
    rank: 26
    disposition: design_after
    hold_id: HOLD-M
  claim_restated: >-
    The index-calculus-vs-rho crossover is a SURFACE in (time, memory, parallel
    width), not a scalar, and both premises of the scalar story are wrong. (B) rho
    is NOT memory-free: with distinguished-point probability theta and P concurrent
    walks, stored points D = theta*T_rho and end-of-run waste P/(2 theta), so the
    relative overhead is P/(2D) and rho's storage floor is Theta(P), independent of
    the group order; the published 2^35.63 ECC2K-130 points are a granularity CHOICE
    (~1.5 TiB at 32 B), not a requirement. (C) index calculus does NOT parallelise
    freely: block Wiedemann's Krylov sequence is a sequential chain of ~2B'/n0
    matrix-vector products, giving a wall-clock FLOOR (2B'/n0)*L_mv no processor
    count removes. (E) preregistered: the WIDTH axis binds at no standardized row and
    the MEMORY axis binds at every row, by a factor B'/(gP).
  core_argument_check:
    - step: '(B) rho relative overhead P/(2D), storage floor Theta(P)'
      verdict: holds
      note: >-
        The inspection-paradox residual length 1/(2 theta) for a geometric walk and
        D = theta*T_rho by linearity are standard; the derivation is internally
        consistent. Flagged (H-1) that the negation/Frobenius class reduction can
        break memorylessness -- correctly named as the tested gap.
    - step: 'ECC2K-130 storage arithmetic'
      verdict: holds
      note: >-
        Verified: 60.9 - 35.63 = 25.27 (the three KN-LIT-096 figures are mutually
        consistent). 2^35.63 * 32 B = 2^40.63 B = ~1.55 TiB (record ~1.5 TiB);
        theta=2^-35 -> D=2^25.9 points * 32 B = 2^30.9 B ~ 1 GiB (record ~1 GiB). All reproduce.
    - step: '(C) sequential Krylov chain length 2B''/n0'
      verdict: unchecked
      note: >-
        The data-dependence of Krylov product i+1 on product i is a fact about the
        algorithm (rigorous); the CONSTANT 2/n0 is RECALLED from the block Wiedemann
        literature (KN-LIT-017 body not read) and is explicitly a measurement target
        with a shape-matched random null. Honestly flagged; I did not verify the constant.
    - step: 'memory exponent gap: index calculus N^{1/(m+1)} vs rho N^0'
      verdict: holds
      note: >-
        With B' = N^{1/(m+1)} the memory exponent is 1/(m+1) versus rho's 0 (in the
        group order; rho storage is Theta(P), independent of N). The claim that this
        is the only axis on which the two separate by a power of N is well-argued.
    - step: '(E) preregistered verdict, falsifiable by a single row'
      verdict: holds
      note: A row with P* < 10^6 concurrent walks falsifies (E1); a memory ratio < 2^4 on a competitive row falsifies (E2). Clean preregistration; both cheap to break.
  verdict: sound_with_corrections
  defects:
    - what: limb (B) is very likely KNOWN in the parallel-cryptanalysis literature
      where: frontier_check (the record concedes downgrade to known)
      fix: >-
        A reviewer with retrieval should confirm the van Oorschot-Wiener storage/
        overhead tradeoff is published (it is described in KN-LIT-012's own entry);
        limb (B) should then be marked `known`, its contribution reduced to "stated
        as a floor and applied to this population". The record already says this.
    - what: chain-length model 2B'/n0 is recalled, not verified against KN-LIT-017
      where: heuristic_assumptions H-BINSTD-XOVER-2
      fix: read KN-LIT-017 (Coppersmith) at source before any deployed row is quoted; the record makes the chain length a measured quantity in Stage 2, which is the right hedge.
    - what: the linear-algebra engine (block Wiedemann/Lanczos + structured GE) is not installed
      where: minimal_test Stage 2, estimated_cost
      fix: >-
        Mark missing: sparse-linear-algebra engine (block Wiedemann/block Lanczos over
        a toy prime; ~1000-1500 lines pure Python). The hold's note that this engine
        is GOAL-ICPERF-e6b6a4's decision is right -- build it once, shared across the
        three lane records that need it (b19793, 6028ed, this one).
    - what: nearby-object control carries a sqrt-2 unit ambiguity (ranking HOLD-M)
      where: proof_search_map.nearby_object_control (g_rho constant)
      fix: >-
        Fix whether g_rho enters as the class order or its square root in the
        pseudorandom-vs-Koblitz comparison; the record's claim that the BINDING AXIS
        is insensitive to the symmetry constant needs that unit pinned so the control
        actually tests it.
  ecc2k130_bearing: >-
    Directly bears -- this is the one lane record whose object IS the ECC2K-130
    baseline. It reframes the rho comparison the whole lane rests on: rho at 2^60.9
    (KN-LIT-096) is NOT memory-free but sits on a D = P/(2 epsilon) tradeoff curve,
    and any index-calculus challenger on ECC2K-130 is charged a memory exponent
    N^{1/(m+1)} against rho's N^0. For the m>=5 arity the product-law floor identifies
    as the only regime that could beat rho on ECC2K-130, this record says the BINDING
    obstacle is memory, not the parallelism argument the lane habitually invokes --
    and that the width axis binds at no standardized row. That is a cost-model
    correction to how the ECC2K-130 reachability verdict is computed, not a new
    attack; it moves no exponent and every row dominates it.
  agreement_with_hold: agrees
  agreement_note: >-
    Agree with design_after (HOLD-M): it consumes the effective matrix dimension B'
    (B vs B/g) that S2/b19793 fixes, and GOAL-ICPERF-e6b6a4 owns the linear-algebra
    engine decision, so the natural gate is "after S2 composes and ICPERF records its
    engine". The record is HIGH-value for a cost-model correction because it can
    INVERT a time-axis verdict on the memory axis, and its instruments are shared
    three ways -- but it is correctly not an exponent-moving line. The sqrt-2 unit
    ambiguity in the null-curve control is the one thing to pin before the binding-
    axis claim is trusted.
  concrete_experiment:
    cell:
      curve: >-
        Toy binary cells n in {23,29,31,37,41}, Koblitz and matched ordinary, for
        the rho instrument; real relation matrices from the toy index-calculus
        pipeline at B' from 2^6 to 2^10 for the linear-algebra instrument. Anchors:
        KN-LIT-096 ECC2K-130 config and KN-TECH-036 sect113r2 (reproduction, not run).
      m: 2
      l: 'toy, set by B'' target 2^6..2^10'
      factor_base: 'the toy index-calculus factor base producing the relation matrices; rho side uses concurrent walks'
      targets: 'rho: collision search; LA: the relation matrix per cell plus a shape-matched random sparse null'
      seeds: '30 seeds per rho cell; 10 matrices per LA cell'
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - 'new: parallel-rho harness with separate useful/wasted-iteration counters (Stage 1)'
      - 'missing: sparse-linear-algebra engine -- block Wiedemann, block Lanczos, structured Gaussian elimination over a toy prime (Stage 2), ~1000-1500 lines, not installed'
    procedure:
      - Stage 0 (zero compute, HARD GATE) -- reproduce KN-LIT-096: given 2^60.9 iterations and theta=2^-25.27 emit 2^35.63 stored points; given 54.03e6 iter/s emit 1263 GPUs for one year within 5 percent; reproduce KN-TECH-036 sect113r2. Mismatch halts.
      - Stage 1 (minutes) -- parallel rho on toy cells, P in {2^4,2^8,2^12}, theta over three decades; count stored points, useful and wasted iterations separately; compare measured relative overhead to P/(2D). Tests limb (B).
      - Stage 2 (minutes-hours) -- collect real relation matrices at B' in 2^6..2^10 plus shape-matched random nulls (same dimension, nonzeros/row, entry distribution, random support); run block Wiedemann at n0 in {1,8,32,64}, plus block Lanczos and structured GE; record sequential chain length, field operations, peak live words.
      - Stage 3 (zero compute) -- emit the region table per (row, IC column): charged ops, peak words, P*, binding axis, L_mv sensitivity, both B' readings; report (E1)/(E2) confirmed/refuted/sweep-dependent.
    metrics:
      - name: measured rho relative overhead vs P/(2D)
        unit: dimensionless
        definition: must track P/(2D) within 20 percent across the theta sweep (limb B)
      - name: krylov chain length (real vs shape-matched null)
        unit: sequential matrix-vector products
        definition: predicted ~B'/n0; a real chain below 0.5x the null's = exploitable matrix structure (a genuine finding)
      - name: P* per row and memory ratio per row
        unit: 'concurrent walks; dimensionless'
        definition: "P* = width at which rho's wall clock meets the IC floor (E1, >10^3 x realisable); memory ratio B'/(P/(2 epsilon)) (E2, >2^20 on competitive rows)"
    controls:
      - 'PUBLISHED-ATTACK REPRODUCTION (blocking): KN-LIT-096 ECC2K-130 triple + 1263-GPU year; KN-TECH-036 sect113r2.'
      - 'SHAPE-MATCHED RANDOM SPARSE NULL (blocking for Stage 2): no chain-length conclusion without it.'
      - 'NULL-CURVE CONTROL: every Koblitz row beside its matched pseudorandom row (binding axis must not be driven by the symmetry constant).'
      - 'THREE-ENGINE CONTROL: block Wiedemann, block Lanczos, structured GE on the same matrices.'
      - 'L_mv SWEEP over three decades; RECORD-SIZE SENSITIVITY at 16/32/64 bytes; B'' double reading B and B/g.'
    outcomes:
      positive (thesis holds): width axis binds at no row, memory axis binds at every competitive row -- the lane replaces "rho parallelises and IC does not" with "IC loses on memory by B'/(gP)".
      negative/surprise: a real relation matrix's Krylov chain is materially below B'/n0 while the null matches it -- the matrix has exploitable spectral structure, the IC floor drops, the first measured statement about ECDLP binary relation-matrix structure -- worth more than the region table.
      artifact: measured rho overhead departs systematically from P/(2D) -- limb (B) wrong, the memory side must be rebuilt; OR the model cannot reproduce KN-LIT-096 (Stage 0 gate fails, record withdrawn).
    falsification_threshold: >-
      Any standardized row with P* < 10^6 concurrent walks falsifies (E1). Any
      competitive row (IC ops within 2^10 of rho) with memory ratio < 2^4 falsifies
      (E2). Measured rho overhead departing from P/(2D) breaks limb (B).
    estimated_cost:
      implementation: medium
      compute: low (single machine, hours, under 200 MB peak; the cost is the ~1000-1500-line LA engine, not the runs; ESTIMATE)
    zero_run_prerequisites:
      - Read KN-LIT-017 (Coppersmith) for the block Wiedemann chain-length constant.
      - Confirm limb (B) is published (downgrade to known if so).
      - Decide (with GOAL-ICPERF-e6b6a4) where the shared LA engine is built.
  successor_seam: >-
    The natural successor object is a genuinely parallel sparse solver with a
    critical path shorter than the Krylov chain: if one exists for these relation
    matrices it falsifies (E1) at every row and reopens the width axis, so a proposal
    that searches for exploitable spectral structure in ECDLP binary relation
    matrices (low minimal-polynomial degree relative to B', measured against the
    shape-matched null) is the high-value follow-on -- it would be the first measured
    statement in the corpus about relation-matrix structure and directly sets the
    linear-algebra floor that every index-calculus cell on ECC2K-130 inherits.
