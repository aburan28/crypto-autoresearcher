review:
  idea_id: IDEA-20260922-6cf862
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-002d0e
  ranking_context:
    rank: 11
    disposition: queued_for_design
    hold_id: HOLD-D
  claim_restated: >-
    On the five composite-degree ANSI curves (E over F_{2^16}, attacked over
    F_{2^{16k}}) the F_{2^16}-rational points ARE the cofactor group, so the
    subfield-rational factor base decomposes nothing in the prime-order subgroup:
    a structural-emptiness certificate from h = q + 1 - t and gcd(h, r) = 1. That
    obstruction is subgroup reachability, not degree, and lives inside
    KN-OPEN-020's high-degree open class. The surviving object is the lattice of
    phi-stable F_q-subspaces, which is the lattice of monic divisors of T^k - 1
    over F_q: with d = ord_k(2^16) = 5, 3, 1, 9, 11 there are 2^(1+(k-1)/d)
    stable subspaces, and c2pnb272w1 alone (d = 1) has one of every dimension.
    The smallest stable base satisfying the free-leg balance sits above matched
    rho on four of five rows; c2pnb208w1 is the row where the decomposition
    subroutine, not the base size, decides.
  core_argument_check:
    - step: 'E(F_q) = ker(phi - 1) has order q + 1 - t and that integer is the published cofactor'
      verdict: holds
      note: 'Re-derived: 65537 - 147 = 65390, 65537 - 441 = 65096, 65537 - 251 = 65286, 65537 - 467 = 65070, 65537 - 145 = 65392; Hasse |t| <= 512 holds; the Weil recursion from t reproduces h*r from the dump exactly on all five.'
    - step: 'gcd(h, r) = 1 hence G meets E(F_q) only in O'
      verdict: holds
      note: gcd computed from the dump integers, 1 on all five; r has 161, 193, 257, 289, 353 bits.
    - step: 'phi-stable F_q-subspaces of F_{q^k} = ideals of F_q[T]/(T^k - 1) = monic divisors of T^k - 1'
      verdict: holds
      note: Normal basis theorem plus PID; same correspondence as IDEA-20260918-9abf42 at q = 2. Setting q = 2, k = 131 returns f = 2 and dims {0, 1, 130, 131} (ord_131(2) = 130 re-derived).
    - step: 'd = ord_k(2^16) = 5, 3, 1, 9, 11; factor counts 3, 5, 17, 3, 3; subspace counts 8, 32, 2^17, 8, 8; dimension sets as listed'
      verdict: holds
      note: 'Re-derived: ord_k(2) = 10, 12, 8, 18, 11 and d = ord_k(2)/gcd(ord_k(2), 16) = 5, 3, 1, 9, 11; dimension sets {0,1,5,6,10,11}, {0,1,3,4,6,7,9,10,12,13}, {0..17}, {0,1,9,10,18,19}, {0,1,11,12,22,23}.'
    - step: 'rho rows 2^78.1, 94.0, 125.8, 141.7, 173.6 labelled 0.886 sqrt(r)/sqrt(2k)'
      verdict: holds
      note: >-
        The FIGURES are right under the brief's convention: sqrt(pi*r/(4k)) with
        the actual r gives 78.10, 93.98, 125.78, 141.71, 173.57. The LABEL
        (sqrt(2k)) is wrong, as CORR-20260922-81aeab records; a literal
        evaluation of the label would give 77.60, 93.48, 125.28, 141.21, 173.07.
        So the correction applies to the formula text and to every quantity
        derived from the formula (below), not to the quoted rows themselves.
    - step: 'net movement of the index-calculus/rho ratio from the Frobenius quotient = sqrt(k/2)'
      verdict: defective
      note: >-
        Derived against sqrt(2k). Under sqrt(k) the net is k/sqrt(k) = sqrt(k) on
        the relation-dominated branch: 2^1.73, 1.85, 2.04, 2.12, 2.26 at k = 11,
        13, 17, 19, 23 (record: 2^1.16 .. 2^1.79); k^(3/2) on the LA-dominated
        branch. Conditional on a full factor-k relation gain (upper bound; S2's
        rank question). No exponent moves either way, so the record's conclusion
        survives with the number replaced -- HOLD-D asked for exactly this re-derivation.
    - step: 'Smallest stable base under (m-1)l >= k at m <= 5: l = 5, 4, 5, 9, 11; sizes 2^80, 2^64, 2^80, 2^144, 2^176'
      verdict: holds
      note: ceil(k/4) = 3, 4, 5, 5, 6 rounded up to the lattice gives 5, 4, 5, 9, 11 (checked against the dimension sets); q^l = 2^(16 l). c2pnb208w1 at 2^64 is the only base below its rho row (93.98); LA dimension 2^64/13 = 2^60.3.
    - step: 'Product-law floor per row (not in the record; added here as the brief requires)'
      verdict: holds
      note: >-
        min over l of m!*2^(N - (m-1)l) + m*2^(2l) with N = log2 r (the same
        minimisation that reproduces KN-FIND-aa2efc's ECC2K-130 table exactly),
        and the orbit-aware variant (relations/k, LA/k^2). c2pnb176v1 (N = 160,
        rho 78.10): m = 3 83.1/77.9, m = 4 68.0/62.5, m = 5 58.1/52.3.
        c2pnb208w1 (N = 192, rho 93.98): m = 3 99.1/93.5, m = 4 80.8/74.9,
        m = 5 68.8/62.6, m = 6 60.3/53.9. c2pnb272w1 (N = 256, rho 125.79):
        m = 4 106.4/99.9, m = 5 90.1/83.3. The floor-optimal base is 33-40 bits
        at m = 4-5 on c2pnb208w1, while the stable lattice offers F_q-dimensions
        {1, 3, 4, ...} = 16, 48, 64 bits: the lattice's coarseness costs about
        8-24 bits of base size against the optimum, which is the priced cost the
        record promises in (C) and does not compute.
    - step: 'Orbit canonicalisation O(k) word comparisons (Booth) in a normal basis'
      verdict: holds
      note: Standard; the cost is per insertion, not per attempt.
    - step: 'Toy cells (d, k) in {(4,5), (4,7), (3,11), (2,13), (8,5), (5,7)} with dk <= 41 and coprimality screening'
      verdict: holds
      note: 'One concrete admissible cell computed here: E/F_16 = F_2[t]/(t^4+t+1), A = 0, B = t^3+1 (encoded 9), #E(F_16) = 12, t = 5; over F_{2^20}: 1049052 = 12 * 87421 (r prime, gcd 1); over F_{2^28}: 268402692 = 12 * 22366891. ord_5(16) = 1, so the (4,5) cell mimics c2pnb272w1 (every F_16-dimension available); ord_7(16) = 3 mimics the coarse rows.'
  verdict: sound_with_corrections
  defects:
    - what: 'The matched-rho formula label uses sqrt(2k) (CORR-20260922-81aeab); the quoted rows are nevertheless at the correct convention'
      where: H-6cf862-2; target_complexity; dominated_by; sota_delta; asymptotic_claim.prior_best
      fix: Replace the label by sqrt(pi*r/(4k)); keep the rows; note that only the derived net-movement figure changes.
    - what: 'Net movement sqrt(k/2) is derived against the wrong convention'
      where: constructive_transforms; target_complexity.time_exponent; sota_delta.time
      fix: 'sqrt(k) on the relation-dominated branch (2^1.73 .. 2^2.26), k^(3/2) on the LA branch, both conditional on the realised relation gain; no exponent moves.'
    - what: 'The rounding cost of the coarse lattice is promised ("at a charged cost this record computes") but not computed'
      where: claim (C) last paragraph
      fix: Add the product-law floor per row with and without the orbit gain and the floor-optimal l, and report the lattice''s nearest available dimension against it (numbers above).
    - what: 'The toy design lists cells without checking that a prime-order subgroup coprime to h exists on a named curve'
      where: minimal_test PART 2
      fix: Name the curves (one is given above); screen and report screened-out cells as the record itself asks.
  ecc2k130_bearing: >-
    No arity implied by (A) or (C). The certificate transfers to ECC2K-130
    trivially: E(F_2) for y^2 + xy = x^3 + 1 is {O, (0,1), (1,0), (1,1)}, order 4
    = the cofactor, t = -1, and the Weil recursion reproduces 4l with l the
    129-bit prime (re-derived, l probable prime), so the F_2-rational base is
    empty in the order-l subgroup -- a four-point base, of no interest, but the
    same mechanism. The stable-subspace census at q = 2, k = 131 is
    IDEA-20260918-9abf42's four subspaces. The c2pnb content bears on ECC2K-130
    only as a nearby population: c2pnb208w1 is the row in the whole standardized
    population where the product-law floor leaves the most headroom below rho
    (13-31 bits at m = 4-5 versus 4.4-12.4 on ECC2K-130), because its subgroup is
    192 bits inside a 208-bit field and its stable lattice is fine (d = 3); if any
    decomposition oracle at m >= 4 is ever priced, that row and ECC2K-130 are the
    two cells to price it on.
  agreement_with_hold: agrees
  agreement_note: >-
    HOLD-D (Part 1 queued, net movement to be re-derived, Part 2 needs FROB)
    is right; the re-derivation is done above (sqrt(k), conditional). Add to Part
    1 the per-row product-law floor and the lattice rounding cost, which are
    seconds of arithmetic and turn three certificates into five priced cells.
  concrete_experiment:
    cell:
      curve: 'Part 1: the five c2pnb rows, arithmetic only. Part 2: E/F_16 = F_2[t]/(t^4+t+1), y^2 + xy = x^3 + (t^3+1), #E(F_16) = 12, over F_{2^20} (order 12 * 87421) and F_{2^28} (order 12 * 22366891); F_{2^20} built as F_16[u]/(irreducible quintic) or directly as F_2[z]/(z^20 + z^3 + 1) with F_16 located as the fixed field of z -> z^16.'
      m: 2
      l: 1
      factor_base: '(a) E(F_16), 12 points; (c) V_W for each phi-stable F_16-subspace W of F_{2^20} of F_16-dimension 1 and 2 (all dimensions available since ord_5(16) = 1); (d) a size-matched non-stable F_16-subspace; also m = 3 on the (4,5) cell exhaustively'
      targets: 'all 87421 points of G (exhaustive) for arms (a), (c), (d); all 12 points of the cofactor subgroup for arm (b)'
      seeds: 'seed 20260926 for the random non-stable W; everything else exhaustive'
    instrument:
      - 'experiments/EXP-CERTBIN-e94b27/impl/gf2n.py (Field(n, mod), generic) and curve.py: missing: numpy in this container; a numpy-free port of the two classes is about 150 lines'
      - 'a new script for the Part 1 certificate (done in this review''s scratch: parse dump, h = q + 1 - t, Weil recursion, gcd, ord_k(2^16), dimension sets, floor per row)'
      - 'Booth cyclic-minimisation for orbit canonicalisation (about 20 lines)'
    procedure:
      - '1. Part 1: emit the certificate file with the five identities, the five dimension sets, the corrected rho rows, and the product-law floor per row with the lattice rounding cost.'
      - '2. Part 2 arm (a): exhaustive m = 2 and m = 3 census of G-targets over E(F_16): predicted exactly zero decompositions.'
      - '3. Arm (b): the same base against the 12 cofactor-subgroup targets: predicted positive at the counting rate.'
      - '4. Arm (c) versus (d): relations per attempt and relation-matrix rank in the raw and orbit-quotient bases for stable versus size-matched non-stable W.'
      - '5. Null: an ordinary curve over F_{2^20} with B outside F_16 (point count by curve.count_by_trace, about 2^20 tests), same base sizes: no phi endomorphism, no lattice.'
      - '6. Measure Booth word comparisons per canonicalisation; predicted <= 3k.'
    metrics:
      - name: decompositions_G_over_EFq
        unit: count
        definition: certified m-fold decompositions of G-targets over E(F_16); predicted 0
      - name: decompositions_cofactor_over_EFq
        unit: count
        definition: same over cofactor-subgroup targets; predicted positive
      - name: relations_per_attempt
        unit: dimensionless
        definition: certified decompositions per target attempt, per arm
      - name: rank_ratio_orbit_quotient
        unit: dimensionless
        definition: rank of the orbit-quotient relation matrix over rank of the raw matrix
      - name: canonicalisation_word_comparisons
        unit: word comparisons per insertion
        definition: Booth minimisation cost
    controls:
      - positive control (b): cofactor-subgroup targets must decompose
      - null object: ordinary curve over F_{2^20} with B not in F_16
      - size-matched non-stable F_16-subspace (d)
      - orbit-union set of the same size (KN-FIND-47da4e analogue at q = 16)
      - solver-free ground truth: every decomposition re-verified by summing on the curve
    outcomes:
      positive: 'Arm (a) returns 0 and arm (b) returns the counting rate: the emptiness certificate is confirmed mechanically; arm (c)/(d) then measures the stability contrast.'
      negative: 'A certified decomposition of a G-target over E(F_16): (A) and IDEA-20260906-a77711''s lemma are refuted at that cell; halt and inspect the certificate.'
      artifact: 'Arm (b) returns 0: the instrument cannot find decompositions at all; nothing else is readable.'
    falsification_threshold: 'Any certified G-target decomposition over E(F_q); any dimension set disagreeing with the five hand derivations; canonicalisation superlinear in k.'
    estimated_cost:
      implementation: low
      compute: 'seconds for Part 1; minutes for the exhaustive m = 2 census and tens of minutes for m = 3 at F_{2^20} in pure Python (estimate)'
    zero_run_prerequisites:
      - fix the rho label to sqrt(pi*r/(4k)) and the net movement to sqrt(k)
      - re-derive the five r from ANSI X9.62 (primary text not vendored; secondary source is OpenSSL)
  successor_seam: >-
    THE COARSE-LATTICE PRICE ON THE FIVE ROWS: a table-column proposal (owner
    RQ-BINSTD-b6f698) that prices each c2pnb row as (product-law floor at the
    floor-optimal l, floor at the nearest phi-stable F_q-dimension, floor with an
    orbit-union F_q-set of the optimal size) with and without the order-k orbit
    gain, so the reachability table shows what the lattice's granularity costs
    against what an orbit union would recover -- c2pnb208w1 (d = 3, 16-bit
    granularity against a 33-40-bit optimum) and c2pnb272w1 (d = 1, 16-bit steps)
    being the informative rows. It generalises KN-FIND-47da4e's (representative,
    shift) question from q = 2 to q = 2^16, where the orbit is only k long and
    canonicalisation is O(k) words.
