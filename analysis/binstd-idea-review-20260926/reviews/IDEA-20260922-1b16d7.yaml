    hold_id: HOLD-K
  claim_restated: >-
    On y^2 + xy = x^3 + a x^2 + b over F_{2^n} the map pi(P) = Tr(x_P) + Tr(a)
    is the quotient E -> E/2E, and the odd-order target subgroup G lies in 2E
    (pi = 0). Semaev's low-degree window V = span{1, alpha, ..., alpha^{k-1}}
    is trace-confined only at even n because Tr(1) = n mod 2, and every
    FIPS/SECG field degree is odd, so cedd2f's confinement lever is vacuous on
    the deployed population as stated. Dropping the constant term gives
    V' = span{alpha, ..., alpha^{k-1}} inside ker Tr at every n (Newton's
    identity), which the record says (i) aligns every leg with G for free on the
    six rows with published A = 0 (K-233, K-283, K-409, K-571, sect239k1,
    c2pnb208w1) and (ii) is structurally empty in G on the five rows with A = 1
    (K-163 and the five NIST B-curves) at even arity. Per-attempt cost is
    claimed separable from the yield effect via IDEA-20260915-3119c9's H2.
  core_argument_check:
    - step: pi is a homomorphism E -> Z/2 with kernel 2E, and G is inside 2E
      verdict: holds
      note: >-
        Re-derived the forward half this session with self-contained GF(2^17)
        arithmetic on y^2 + xy = x^3 + a x^2 + 1, a in {0, 1}, 3000 random x
        each: Tr(x(2P)) = Tr(a) on 1493/1493 and 1479/1479 sampled doublings.
        The converse (Tr(x) = Tr(a) implies P in 2E) is relied on from
        IDEA-20260913-cedd2f's exhaustive check at n = 7, 8, 9 and the
        Fong-Hankerson-Lopez-Menezes halving criterion relayed there; not
        re-derived beyond the sample. G has odd order so G = [2]G is inside 2E.
    - step: Tr(1) = n mod 2 and Tr(alpha^j) = 0 for 1 <= j < n - s (Newton)
      verdict: holds
      note: >-
        Newton's identity p_j + c_{n-1} p_{j-1} + ... + j c_{n-j} = 0 with
        c_{s+1} = ... = c_{n-1} = 0 gives p_j = 0 for j < n - s and
        p_{n-s} = (n - s) mod 2. Computed this session: in F_2[t]/(t^17+t^3+1)
        Tr(t^j) = 0 for every j in 1..16 and Tr(1) = 1; in
        F_2[t]/(t^19+t^5+t^2+t+1) Tr(t^j) = 0 for j in 1..16, Tr(t^17) = 1,
        Tr(1) = 1. Both consistent with the bound (which is sufficient, not
        necessary). The pentanomial case therefore holds at the two CERTBIN
        field polynomials; the deployed pentanomials were not computed.
    - step: every FIPS/SECG field degree is odd
      verdict: holds
      note: 163, 233, 239, 283, 409, 571 are all odd (read off the audit dump headers this session).
    - step: literal A in {0, 1} on the eleven named rows
      verdict: unchecked
      note: >-
        Re-read from analysis/binstd-curve-audit/binary-curve-params.txt this
        session for three rows only (sect163k1 A = 1 (0x1), sect239k1 A = 0,
        c2pnb208w1 A = 0). The other eight rows are relied on from this record
        and from IDEA-20260922-7ab503's independent grep of the same dump
        (agreeing values); the B-curve A = 1 values are also consistent with
        FHLM Lemma 4.1(iii) as relayed by cedd2f (NIST random curves have
        Tr(a) = 1). Not re-derived from FIPS 186-4 primary text.
    - step: Tr(a) = 0 rows -- V' has every leg on the G side (F0 = 0) at every arity
      verdict: holds
      note: >-
        Every x in V' has Tr(x) = 0, so pi(P) = Tr(a) = 0 for every leg; any
        m-sum has pi = 0 = pi(R) for R in G. No arity restriction. This is
        3119c9's affine class-aligned slice {Tr(x) = Tr(a)} specialised to
        Semaev's basis, as the record itself concedes.
    - step: Tr(a) = 1 rows -- V' is empty in G AT EVEN ARITY (record, claim D and title)
      verdict: defective
      note: >-
        Every leg of V' has pi(P) = Tr(x) + Tr(a) = 0 + 1 = 1, so an m-sum has
        pi = m mod 2, and a target in G needs pi = 0. The window is therefore
        parity-EMPTY exactly at ODD m and fully aligned (F0 = 0, identical to
        the Tr(a) = 0 case) at EVEN m. The record has the parity reversed;
        HOLD-K's A9 is confirmed from the record text and from the arithmetic.
        Worse for the headline, at odd m on a Tr(a) = 1 row the OTHER half of
        Semaev's own window, the affine slice 1 + V' = {c_0 = 1}, has
        Tr(x) = Tr(1) = 1 (n odd) hence pi = 0 on every leg and is aligned at
        every m. So on every one of the eleven rows the aligned half of
        Semaev's window is {c_0 = Tr(a)} and the other half is aligned at even
        m only. The population split "six helped, five emptied" does not exist;
        the true census is one relabelling rule per row.
    - step: matched rho baseline written as 0.886 sqrt(r)/sqrt(2n)
      verdict: defective
      note: >-
        0.886 sqrt(r)/sqrt(2n) = sqrt(pi r/(8n)), i.e. class size 2n in the
        4k convention with k = 2n. The canonical convention of the brief
        (sqrt(pi r/(4k)), k the Frobenius class order n, negation absorbed in
        the 4) is 0.5 bit higher. On ECC2K-130 (r = 2^129.000, n = 131):
        canonical 2^60.809, record's formula 2^60.309. The record derives no
        number from it, so nothing downstream is wrong, but the convention must
        be restated. HOLD-K's point (2) confirmed.
    - step: cost separation inherited from 3119c9 H2 within 10 percent
      verdict: unchecked
      note: >-
        Not re-derived. One internal inconsistency in the record's use of it:
        the minimal test builds V and V' "at the same nominal k" (so
        |V'| = |V|/2, block size l versus l-1) and then compares per-instance
        cost "at matched dimension". H2 is a statement about which basis is
        used at FIXED l, not about l versus l-1, so the arms as written do not
        test H2. A matched comparison is V'_0 = {c_0 = 0} versus
        V'_1 = {c_0 = 1} versus a random (k-1)-dimensional subspace, all of the
        same size.
    - step: inclusion of c2pnb208w1
      verdict: defective
      note: >-
        n = 208 is even, so Tr(1) = 0 and Semaev's unmodified V is already
        confined there; dropping the constant changes nothing. The row belongs
        to the composite-degree population owned by 6cf862/261004 and should be
        an even-n control, not a census row. HOLD-K's point (3) confirmed.
  verdict: defective
  defects:
    - what: parity direction reversed; Tr(a) = 1 rows are empty at ODD arity and aligned at even arity
      where: title, claim (D), predictions (metric F0_of_V_prime_on_toy_odd_n_Koblitz_cells_with_Tr_a_eq_1), constructive_transforms.predicted_gain
      fix: >-
        Replace the five-row emptiness claim by the per-row rule: at odd n the
        aligned half of Semaev's window is the affine slice {c_0 = Tr(a)} at
        every m; the complementary half is aligned at even m only and empty at
        odd m. Remove "structurally empty" from the title; the construction is
        never empty at every arity on any row.
    - what: rho convention 0.5 bit low
      where: target_complexity.time_exponent (the "0.886 sqrt(r)/sqrt(2n)" formula)
      fix: state sqrt(pi r/(4k)) with k the Frobenius class order, or cite CORR-20260922-81aeab and reconcile.
    - what: c2pnb208w1 is an even-n row where the fix is void
      where: claim (C), title
      fix: move it to the even-n null control; keep the census at ten prime-degree rows.
    - what: the matched-dimension cost comparison does not test the inherited H2
      where: minimal_test.design, falsification_conditions (10 percent clause)
      fix: compare V'_0, V'_1 and a size-matched random (k-1)-subspace at equal l; drop the V (dim k) versus V' (dim k-1) cost arm or label it a block-size arm.
    - what: novelty over IDEA-20260915-3119c9 overstated
      where: mechanism ("WHY THIS IS NOT A RESTATEMENT OF R1"), overlap_review
      fix: >-
        State plainly that V' and 1 + V' ARE 3119c9's class-aligned slices
        realised in Semaev's canonical basis with no search; the record's
        residual content is the odd-n vacuity of cedd2f's window on the deployed
        rows and the per-row relabelling rule.
    - what: no arity m or per-attempt oracle budget stated for ECC2K-130
      where: target_complexity, sota_delta
      fix: state that alignment is a factor <= 2 (1 bit) in yield at every m and changes no floor row; see ecc2k130_bearing.
  ecc2k130_bearing: >-
    ECC2K-130 is a = 0, b = 1, n = 131 odd, cofactor 4 with cyclic 2-Sylow, so
    it is a Tr(a) = 0 row and the E/2E quotient exists: the aligned window is
    {c_0 = 0} in a polynomial basis, or equivalently the even-Hamming-weight
    coordinate vectors in a normal basis (a normal element has trace 1, so Tr
    is the weight parity there; the original ECC2K-130 computation used a
    normal basis). The gain is bounded by yield conservation (KN-FIND-007 as
    cited in KN-FIND-aa2efc): for a random window half of the m-multisets have
    the wrong parity for a G-target, an aligned window of the same size has
    none, so the factor is at most 2 at EVERY m -- one bit, not 2^{m-1}. It
    changes no arity and no floor row: under the finding's table m = 3 sits at
    2^68.58 (my standard-balance re-derivation, B^{m+1} = m! N with N = 2^131,
    gives 2^66.79; either way >= 6 bits above the matched rho 2^60.809, which I
    reproduced from r = 680564733841876926932320129493409985129 and k = 131),
    and one bit does not reach it. At m = 4 the free-oracle floor is 2^56.40
    (finding) or 2^54.23 (mine), so the per-attempt oracle budget is about
    2^4.4 (finding) to 2^6.6 (mine) group-operation equivalents; alignment adds
    at most one bit to that budget. The finding's exact constants are marked
    unchecked (its relations x targets x oracle bookkeeping was not
    reproduced); the qualitative verdict is reproduced. The parity condition is
    also a free linear certificate in the descended system: for legs with
    constant coefficients c_{i,0}, sum_i c_{i,0} = m Tr(a) + pi(R) (mod 2) is
    implied by every instance; see successor_seam.
  agreement_with_hold: agrees
  agreement_note: >-
    All three HOLD-K points are confirmed independently (parity reversed, rho
    convention 0.5 bit low, c2pnb208w1 unjustified). The revision is larger
    than the hold implies: the headline population split dissolves once the
    affine half of Semaev's window is admitted, and what remains is a correct
    but small per-row relabelling rule plus a runnable cell. Rankable revision
    must contain: the per-row aligned-half table at every m; the canonical rho
    convention; the two CERTBIN cells as the matched Tr(a) pair (RC-1 has
    Tr(A = 97044) = 0 and the n = 19 cell has Tr(A = 46693) = 1, both computed
    this session); the size-matched controls; an explicit statement that the
    lever is <= 1 bit at every m on ECC2K-130.
  concrete_experiment:
    cell:
      curve: >-
        Two cells. RC-1 (RQ-CERTBIN-836ce2): n = 17, f = t^17 + t^3 + 1,
        A = 97044 (Tr(A) = 0, computed), B = 126251, #E = 4 * 32603, x(2E)
        targets. Second cell n = 19, f = t^19 + t^5 + t^2 + t + 1, A = 46693
        (Tr(A) = 1, computed), B = 306147, h = 2, x(2E) targets. Twist control at
        n = 17 by A -> A + 1 (Tr(1) = 1 flips Tr(a)).
      m: 2
      l: 9
      factor_base: >-
        Four windows per cell at l = 9 (l = 10 at n = 19): V = {deg < l}
        (Semaev, size 2^l), V'_0 = {deg < l, c_0 = 0} (size 2^{l-1}, linear),
        V'_1 = {deg < l, c_0 = 1} (size 2^{l-1}, affine), R = a random
        (l-1)-dimensional subspace (size-matched null). Arity m = 2 AND m = 3
        (the odd arity is the discriminating one).
      targets: >-
        20 targets from the archived x(2E) target list of RUN-CERTBIN-3b7e05
        for RC-1 (and the n = 19 run's list), plus 20 targets from the non-2E
        coset (pi = 1) as the mirror-image positive control.
      seeds: none needed; exhaustive census over window points, targets enumerated from the archived lists in index order
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py (scalar Field class) and curve.py (add, lift_x, is_x_coord)
      - 'missing: numpy -- both modules import numpy at top level and numpy is not installed in this container (checked 2026-09-26); either install it or lift the 60 scalar lines (clmul, pmod, trace, half-trace, group law) into a self-contained script'
      - new 100-line census script (no solver); no WDSat/CaDiCaL/msolve needed
    procedure:
      - Build the four windows per cell; for each x in a window lift to points; record pi(P) = Tr(x) + Tr(a) per point and the counts F1 (pi = 0) and F0 (pi = 1). Prediction -- V'_0 all pi = Tr(a); V'_1 all pi = 1 + Tr(a); V and R about half and half.
      - m = 2 census -- for each target R and window W, count unordered pairs {P1, P2} of W-points with P1 + P2 = +-R (hash of x-coordinates of R - P1 over P1 in W).
      - m = 3 census -- for each pair (P1, P2) of W-points compute x(R - P1 - P2) and test membership in W; count decompositions.
      - Tabulate decompositions per target per window per m per cell; record the parity pattern of every counted decomposition (must satisfy sum pi(P_i) = pi(R)).
      - Repeat for the pi = 1 coset targets (mirror image) and for the twist at n = 17.
    metrics:
      - name: F0_F1_per_window
        unit: count of points
        definition: number of window points with pi = 1 (F0) and pi = 0 (F1)
      - name: decompositions_per_target
        unit: count (mean and max over targets)
        definition: number of m-multisets of window points summing to +-R, per (cell, window, m, target class)
      - name: parity_violations
        unit: count
        definition: counted decompositions with sum_i pi(P_i) != pi(R); must be exactly 0
      - name: aligned_over_random_yield_ratio
        unit: dimensionless
        definition: mean decompositions per G-target for the aligned half divided by the same for the size-matched random subspace R, per m
    controls:
      - size-matched random (l-1)-subspace R (must show F0 about |R|/2 and nonzero yield at every m on G-targets)
      - twist control at n = 17 (A + 1) flips which half is aligned; the table must mirror
      - pi = 1 coset targets as the mirror image (V'_0 on the Tr(a) = 0 cell must give zero at m = 2 and nonzero at m = 3 there)
      - the n = 17 versus n = 19 cells realise Tr(a) = 0 and Tr(a) = 1 with the same instrument
      - even-n null (a Koblitz cell at n = 20 or 22, cedd2f's regime) where V is already confined and V'_0 adds nothing -- optional, not required for the parity verdict
    outcomes:
      positive: >-
        Tr(a) = 0 cell -- V'_0 nonzero at m = 2 and 3, V'_1 nonzero at m = 2 and
        zero at m = 3; Tr(a) = 1 cell -- V'_0 nonzero at m = 2 and ZERO at
        m = 3, V'_1 nonzero at both; R about half of aligned; zero parity
        violations. The corrected per-row rule is confirmed and the record's
        "empty at even arity" is refuted.
      negative: >-
        Any decomposition violating the parity pattern, or a V'_0 decomposition
        of a G-target at m = 3 on the Tr(a) = 1 cell -- the halving criterion or
        the Newton step fails for this field polynomial; the mechanism is
        withdrawn for that shape.
      artifact: >-
        R (random subspace) also shows F0 = 0 or zero yield at m = 3 -- the
        window is too small to separate confinement from size; the cell is
        excluded from the reading (the record's own degenerate-base tell).
    falsification_threshold: >-
      A single parity-violating decomposition (exact combinatorics, zero
      tolerance) falsifies the pi-homomorphism reading at that cell; a single
      G-target decomposition by V'_0 at m = 3 on the Tr(a) = 1 cell falsifies
      the corrected rule. The aligned/random yield ratio outside [1.4, 2.8] at
      m = 2 or [1.4, 2.8] at m = 3 (prediction 2, the one-bit bound) falsifies
      the yield-conservation pricing.
    estimated_cost:
      implementation: low
      compute: >-
        ESTIMATE -- m = 3 census is about |W|^2/2 group additions per target,
        about 1.3e5 at |W| = 512; 40 targets x 4 windows x 2 cells x (m = 2, 3)
        is about 5e7 pure-Python field operations, i.e. tens of CPU-minutes.
        No solver.
    zero_run_prerequisites:
      - numpy installed, or the scalar arithmetic lifted out of gf2n.py/curve.py
      - the archived target lists of RUN-CERTBIN-3b7e05 and the n = 19 run located and their x(2E) membership re-verified
      - the corrected per-row table (aligned half at every m; other half at even m) written before the census
  successor_seam: >-
    THE PARITY RELATION AS A LINEAR CERTIFICATE INSIDE THE DESCENDED SYSTEM AT
    RC-1 (owner RQ-CERTBIN-836ce2, the G2 lane's "trace-conditioned factor
    bases" seam sharpened). For a G-target and legs x_i = sum_j c_{i,j} t^j in
    V = {deg < 9}, every solution satisfies c_{1,0} + c_{2,0} = pi(R) + m Tr(a)
    (mod 2), a degree-1 Boolean equation implied by the descended S_3 system.
    Proposal: test at the archived RC-1 instances whether this linear form lies
    in the F_2 row space of the 17 descended equations (rank test in
    macaulay.py / elim.py), and if not, at which closure (M_4, W_4, M_5) it
    first appears; then measure whether adding it explicitly changes the W_4
    refutation share and the sat/unsat cost asymmetry. On ECC2K-130 the same
    form reads, in the original normal basis, "the coordinate-weight parities of
    the legs sum to the target's", a free instance-level constraint whose value
    to an m >= 4 oracle is exactly one bit and is worth knowing whether the
    solver already finds it.
