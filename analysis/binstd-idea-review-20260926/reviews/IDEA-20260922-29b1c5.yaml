review:
  idea_id: IDEA-20260922-29b1c5
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-002d0e
  ranking_context:
    rank: 12
    disposition: queued_for_design
    hold_id: HOLD-E
  claim_restated: >-
    The unique rational 2-torsion point T = (0, sqrt b) acts on the x-line as the
    involution iota(x) = sqrt(b)/x, and it is the only translation that descends
    to the x-line. Lemma: an F_2-subspace of F_{2^n} stable under iota is a
    subfield containing b; hence on every prime-degree standardized row the
    (subspace base, 2-torsion quotient) cell is structurally empty, and on the
    five composite-degree rows the only stable subspace is F_{2^16}, whose base
    is E(F_{2^16}) and decomposes nothing in G. The constructive escape is the
    u-line base V_W = {x : x + sqrt(b)/x in W}, which buys exactly 2^(m-1) in the
    enumeration oracle and is priced, not free, in the SAT representation; the
    record predicts the SAT arm realises less.
  core_argument_check:
    - step: 'x(P + T) = sqrt(b)/x(P), and iota is the only translation descending to the x-line'
      verdict: holds
      note: 'Derivation re-done: the numerator collapses to x_1 sqrt(b) by the curve equation. Numerically confirmed on all 75 affine points of y^2 + xy = x^3 + b over F_64 (b in F_4 \ F_2). Translation by S commutes with negation iff 2S = O: holds.'
    - step: 'THE LEMMA: a nonzero iota-stable F_2-subspace V is a subfield F_{2^d} containing b'
      verdict: defective
      note: >-
        The proof's third step is wrong. From u^2/w in V for all nonzero w in V
        one gets u^2 * (1/V) contained in V, and 1/V = V/sqrt(b) by
        iota-stability, so the stabiliser S = {lambda : lambda V = V} contains
        u^2/sqrt(b), not u^2. Carrying the argument through correctly: u/v in S
        for all nonzero u, v in V (since (u/v)^2 in S and squaring is a bijection
        of the odd-order group F^*), K = span(S) is a subfield F_{2^d}, and V =
        c*K for any nonzero c in V; iota-stability then reads sqrt(b)/c^2 in K,
        i.e. V = b^(1/4) * F_{2^d}. CORRECTED LEMMA: the nonzero iota-stable
        F_2-subspaces of F_{2^n} are exactly V_d = b^(1/4) F_{2^d}, one for each
        divisor d of n; V_d is a subfield iff b in F_{2^d}. Brute-force census at
        n = 6 with b in F_4 \ F_2 (all subspaces of dimension <= 3, spans of
        3-subsets of F_64^*): three iota-stable subspaces, of dimensions 1, 2, 3,
        each equal to b^(1/4) F_{2^d}; the record's prediction ("divisors d with
        b in F_{2^d}") gives one. The record's own Stage 1 would have caught this.
    - step: 'Prime-degree rows: the cell is structurally empty'
      verdict: holds
      note: 'Survives the correction with a different certificate: for n prime the stable subspaces are {0}, {0, b^(1/4)} (size 2, useless; equals F_2 exactly when b = 1, i.e. on Koblitz rows) and F_{2^n}. Certificate: the corrected lemma plus primality of n.'
    - step: 'Composite rows: the only stable subspace is F_{2^16} and the cell is empty by the subfield degeneracy'
      verdict: defective
      note: >-
        False. For d in {1, 2, 4, 8, k, 2k, 4k, 8k} the subspace b^(1/4) F_{2^d}
        is iota-stable and is NOT a subfield (the audit places b in no subfield
        smaller than F_{2^16}). V_{8k} = b^(1/4) F_{2^{8k}} has dimension n/2 and
        is also phi-stable (b^(1/4) in F_{2^16}, and F_{2^{8k}} is stable under
        x -> x^{2^16}); its factor base {P : x(P) in b^(1/4) F_{2^{8k}}} is not
        E(F_{2^16}) and is not emptied by the cofactor argument. The cell on the
        five composite rows is OPEN with a new object, not empty. Whether the
        object is any good is a separate question (see successor_seam).
    - step: 'V_W construction, |V_W| = 2 * #{w in W : Tr(sqrt(b)/w^2) = 0}, membership one inversion plus a rank-l test'
      verdict: holds
      note: Standard quadratic-root criterion in characteristic two.
    - step: '(D): enumerating one representative per iota-orbit loses nothing; the per-target cost falls by EXACTLY 2^(m-1) at matched base size; H2 "yield neutral"'
      verdict: defective
      note: >-
        The operation count per target does fall by 2^(m-1), but so does the
        fraction of decomposable targets: if R = P_1 + ... + P_m over V_W then
        flipping any even-size subset of the P_i by T gives another decomposition
        of R, so decompositions of R over V_W come in clusters of 2^(m-1), and the
        probability that a target has at least one decomposition is 2^(m-1) times
        SMALLER than for an unstructured base of the same size (KN-FIND-007's
        conservation of the MEAN yield is exactly why coverage, not mean, is the
        tell). Numerical check at n = 11, m = 2, random b, W of dimension 5
        (|V_W| = 29 x-values, |F_W| = 22 points) against a random subspace of
        matched size: mean multiplicity of decompositions per covered target 2.00
        on the u-line base versus 1.08 on the random base; distinct-target
        coverage per pair-sum 0.54 of the random base's (derivation predicts
        1/2^(m-1) = 0.5). Relation-phase total: R_need x (1/coverage) x cost per
        attempt = m! N for a subspace of size 2^(l+1) and m! N / 2 for V_W of the
        same size (2^l orbit classes). The true gain is ONE BIT, independent of m,
        which is the index of 2E -- exactly what the E/2E quotient is allowed to
        buy. The record's headline metric (orbit_loop_operation_ratio) would pass
        at 2^-(m-1) while relations per operation are unchanged; H2 asserts the
        opposite of what the clustering forces.
    - step: 'On Koblitz rows (b = 1) the u-line base is a new object'
      verdict: defective
      note: >-
        x(2P) = x^2 + b/x^2 (re-derived), so u(x) = x + sqrt(b)/x = sqrt(x(2P)).
        On a Koblitz curve 2 = tau * tau-bar with tau the squaring, so
        x(tau-bar(P)) = sqrt(x(2P)) = u(x): V_W = tau-bar^{-1}(F_W) exactly, the
        plain subspace base pulled back through the dual Frobenius. Decomposing R
        over V_W is decomposing tau-bar(R) over F_W. Under the lossy-projection
        test this is a change of coordinates plus the one E/2E bit; nothing new
        on ECC2K-130, K-163..K-571 or sect239k1.
    - step: 'best_known rho expression "0.886 sqrt(pi ell/4)"'
      verdict: defective
      note: 'Applies sqrt(pi/4) twice (A5): 0.175 bit low. Re-derived on ECC2K-130 negation-only: 64.151 versus 64.326.'
    - step: 'WDSat arm (Stage 4)'
      verdict: unchecked
      note: 'missing: WDSat / CNF-XOR solver (not installed). The prediction "strictly less than 2^(m-1)" is moot once the enumeration arm''s 2^(m-1) is itself an artifact.'
  verdict: defective
  defects:
    - what: 'The emptiness lemma is false as stated (third proof step drops the factor sqrt(b)); the correct classification is V_d = b^(1/4) F_{2^d}, one per divisor d of n'
      where: title; claim (B); mechanism PROOF; predictions 1; quantifier_order
      fix: 'Replace the lemma by the corrected classification with the counterexample b^(1/4) F_{2^3} at n = 6, b in F_4 \ F_2 (verified by census). Prime-row verdicts survive with the corrected certificate.'
    - what: 'The composite-row verdict ("only F_{2^16}, cell empty") is false; scaled subfields b^(1/4) F_{2^d} for d in {1,2,4,8,k,2k,4k,8k} are iota-stable, non-subfield, and V_{8k} is also phi-stable'
      where: title; claim (B) second bullet; predictions 1; minimal_test STAGE 5
      fix: Mark the composite-row cell OPEN with the new object named; hand the object to a successor proposal (below).
    - what: 'The "exact 2^(m-1)" is an accounting artifact: decompositions over V_W cluster in even-parity T-flip classes of size 2^(m-1), so coverage per target falls by the same factor; net gain is one bit'
      where: claim (D), (E); H2; predictions 2, 5; sota_delta.time; dominated_by
      fix: 'Restate the gain as a factor 2 on the relation-phase total (the index of 2E) at any m; replace the headline metric by relations per operation and add the multiplicity-per-covered-target metric (predicted 2^(m-1) on V_W, about 1 on a random base).'
    - what: 'On Koblitz rows V_W = tau-bar^{-1}(F_W); the object fails the lossy-projection test beyond one bit'
      where: mechanism OBJECT FRAME; discriminated_from
      fix: State it; on Koblitz rows the record reduces to "attack 2R with the plain base".
    - what: 'rho expression double-counts the sqrt(pi/4) constant'
      where: target_complexity.best_known
      fix: 'Use sqrt(pi*r/(4k)): 2^60.81 on ECC2K-130, 0.886 sqrt(r) elsewhere.'
    - what: 'Stage 4 needs WDSat, which is not installed'
      where: minimal_test STAGE 4; estimated_cost
      fix: 'Declare missing: WDSat; or drop the stage since the separation it tests no longer has a 2^(m-1) to separate.'
  ecc2k130_bearing: >-
    No arity implied. On ECC2K-130, b = 1: the iota-stable subspaces are {0}, F_2
    and F_{2^131} (the corrected lemma with b^(1/4) = 1), so the emptiness of the
    (subspace base, 2-torsion quotient) cell holds there. The u-line base is
    tau-bar^{-1}(F_W): the plain subspace attack on the target 2R read through
    the free squaring, worth one bit (2E has index 2 in the order-4l group; on the
    order-l subgroup itself it is worth nothing, since 2 is invertible there).
    Against the product law the one bit moves a floor by 2/(m+1) bits (0.4 bit at
    m = 4) and the oracle budget not at all; the record moves nothing on ECC2K-130.
  agreement_with_hold: disagrees
  agreement_note: >-
    HOLD-E queues Stage 0-1 for design on the strength of "the lemma is that
    sqrt(b) is not in V on standardized rows". The lemma is false as written and
    Stage 0 is a hard gate on writing it out, so designing it now spends a design
    cycle on a false statement; the composite-row verdict is wrong in the
    direction that hides a live object; and the 2^(m-1) headline is an artifact
    the record's own metric cannot see. The honest disposition is
    return_for_revision with the corrected lemma, the corrected composite-row
    verdict, and the one-bit gain statement; the prime-row emptiness certificate
    can then be filed as a table cell at zero compute.
  concrete_experiment:
    cell:
      curve: 'Stage 1'': n in {6, 8, 9, 10, 12} (composite) with b in a proper subfield and b in no proper subfield, plus n in {7, 11, 13}; Stage 2'': the two n = 17 curves over F_2[t]/(t^17+t^3+1): Koblitz a = 1, b = 1 (order 2 * 65587) and the RC-1 ordinary curve A = 97044, B = 126251 (DEC-20260926-cb4487).'
      m: 2
      l: 8
      factor_base: 'V_W = {x : x + sqrt(b)/x in W} for a random W of dimension 8 (about 256 x-values, about 2^8 points in F_W), against (i) a random F_2-subspace V of dimension log2|V_W| and (ii) the plain subspace W itself on the target tau-bar(R) on the Koblitz cell'
      targets: 'every point of the prime-order subgroup (65587), exhaustive; on the Koblitz cell also the pair {R, R + T} bookkeeping'
      seeds: 'seed 20260926 for W and V; 20 independent W per cell'
    instrument:
      - 'pure-Python F_{2^n} arithmetic and subspace enumeration (the census script used for this review is about 120 lines; RREF enumeration of all subspaces for the dimension <= n census)'
      - 'experiments/EXP-CERTBIN-e94b27/impl/gf2n.py and curve.py for the n = 17 cells (both import numpy: missing: numpy in this container; numpy-free port about 150 lines)'
      - 'missing: WDSat (Stage 4 of the record)'
    procedure:
      - '1. Stage 1'': enumerate all F_2-subspaces of F_{2^n} (RREF) and count iota-stable ones; predicted count = number of divisors of n, each equal to b^(1/4) F_{2^d}; the record predicts the count of divisors d with b in F_{2^d}.'
      - '2. Stage 2'': build V_W and F_W on both n = 17 curves; exhaustive m = 2 pair sums over F_W; record per target the number of decompositions; compute mean multiplicity per covered target (predicted 2.00 on V_W, about 1 on random V) and coverage per pair-sum (predicted ratio 0.5).'
      - '3. Koblitz check: verify x(tau-bar P) = x + 1/x on all points and that the covered-target set of V_W equals tau-bar^{-1} of the covered set of F_W.'
      - '4. Relation-phase accounting: relations needed (2^8 orbit classes versus 2^9 for the matched subspace), coverage, operations: report the ratio of totals (predicted 0.5, one bit).'
    metrics:
      - name: iota_stable_subspace_count
        unit: count per (n, b)
        definition: number of nonzero F_2-subspaces V with iota(V \ 0) = V \ 0
      - name: multiplicity_per_covered_target
        unit: decompositions per target
        definition: mean number of certified m-fold decompositions among targets with at least one
      - name: coverage_per_operation
        unit: covered targets per pair-sum
        definition: distinct covered targets divided by pair-sums enumerated
      - name: relation_phase_total_ratio
        unit: dimensionless
        definition: (relations needed / coverage x cost per attempt) for V_W divided by the same for the matched subspace
    controls:
      - random subspace V of matched size (the additive-structure null)
      - random pairing control (arbitrary pairs instead of iota-orbits; the orbit loop must be unsound there)
      - Koblitz cell where V_W = tau-bar^{-1}(F_W) is checkable exactly
      - ordinary curve (RC-1) with b outside every proper subfield
      - matched rho beside the relation-phase totals (2^(0.5*log2 65587 - 0.17) negation-only on the ordinary cell; minus 0.5*log2 17 on the Koblitz cell)
    outcomes:
      positive: 'Census returns one stable subspace per divisor of n and multiplicity 2.00 at m = 2: the corrected lemma and the one-bit accounting are confirmed; the record is revised accordingly.'
      negative: 'Census returns only subfields containing b, or multiplicity near 1 on V_W with coverage per operation 2x the random base: the record''s lemma and 2^(m-1) stand and this review''s derivation is wrong; the review is withdrawn.'
      artifact: 'The random pairing control is sound, or the Koblitz identity fails on some point: the pair bookkeeping or the field arithmetic is broken; nothing else is readable.'
    falsification_threshold: 'Stable-subspace count different from the number of divisors of n on any tested (n, b); multiplicity per covered target below 1.5 on V_W at m = 2; relation_phase_total_ratio outside [0.4, 0.6].'
    estimated_cost:
      implementation: low
      compute: 'seconds per (n, b) for the census at n <= 12; about a minute per n = 17 cell exhaustive at m = 2 in pure Python (estimate)'
    zero_run_prerequisites:
      - rewrite the lemma and the composite-row verdict
      - restate the gain as one bit with the multiplicity metric
      - fix the rho expression
  successor_seam: >-
    THE SCALED-SUBFIELD FACTOR BASE ON THE FIVE COMPOSITE ROWS: V_d = b^(1/4)
    F_{2^d} for d in {k, 2k, 4k, 8k} (and the small d) is simultaneously
    iota-stable and phi-stable, is not a subfield, is not E(F_{2^16}), and is not
    emptied by the cofactor lemma; its membership test is one multiplication by
    b^(-1/4) plus a subfield test (x^(2^d) = x), description O(1). The proposal:
    price its yield (is x in b^(1/4) F_{2^d} an x-coordinate at the generic rate?),
    the degree of the descended S_{m+1} system when the unknowns are written as
    b^(1/4) times F_{2^d}-elements (the substitution moves b into the constants),
    and whether the E/2E bit and the order-k phi-orbit quotient compose on it;
    arity m = n/d = 16, 8, 4, 2 and N = 160..352 bits, so the m = 4 cell (d = 4k)
    is the one priced against the per-row product-law floor (c2pnb208w1: floor
    80.8 blind / 74.9 orbit-aware at m = 4 versus rho 93.98, with B = 2^52 against
    a floor-optimal 39 bits). Owner RQ-BINSTD-b6f698 for the cell, RQ-FROB-7d8dd4
    for the mechanism. Toy: E/F_{2^d0} over F_{2^{d0 k}} with b outside F_{2^{d0}}
    is not needed -- any composite n and any b outside a proper subfield exhibits
    the object at n = 12 (d = 3, 4, 6).
