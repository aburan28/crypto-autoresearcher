review:
  idea_id: IDEA-20260922-2a3771
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-843cf5
  ranking_context:
    rank: 33
    disposition: return_for_revision
    hold_id: HOLD-S
  claim_restated: >-
    Two named conditions under which K-163's point-decomposition step could
    fall below its matched rho (quoted 2^77.16). H1: on a tau-stable factor
    base V (per IDEA-20260915-8fe0ef's ker g(tau)), adding explicit
    tau-orbit-equivalence clauses to the CNF-XOR encoding makes the solver
    range over |V|/n orbit classes instead of |V| elements, cutting WDSat
    conflicts from c*2^{m_a l} to c'*2^{m_a (l - log2 n)}, an additive
    m_a*log2(n)-bit per-attempt gain. H2: the one-time factor-base membership
    count |x(E) ∩ V| on a tau-stable V is constant on tau-orbits, so it costs
    |V|/n representative tests in a normal basis, provided one pays an
    "uncharged" polynomial-to-normal basis conversion that no deployed FIPS
    curve is stated in. The record claims no exponent movement, discloses that
    H1 has adjacent negative evidence (IDEA-20260904-3c7a91) and that H2 is
    preprocessing-only, and asks for medium priority.
  core_argument_check:
    - step: 'S1: matched rho on K-163 is 2^77.16 group operations (cited from IDEA-20260922-1a081a)'
      verdict: holds
      note: >-
        Re-derived under the brief's convention sqrt(pi*r/(4k)) with k = 163
        and r ~ 2^162: 0.5*(log2(pi) + 162 - 2 - log2 163) = 77.15. The exact
        K-163 prime moves this by less than 0.01 bit; 1a081a's exact value was
        not re-derived from the FIPS order.
    - step: 'K-163 hosts a tau-stable F_2-subspace V of index-calculus dimension (presupposed by both H1 and H2)'
      verdict: defective
      note: >-
        ord_163(2) = 162 (computed), so Phi_163 is irreducible over F_2 and the
        tau-stable subspaces of F_{2^163} have dimensions {0, 1, 162, 163}
        only. IDEA-20260915-8fe0ef, which the record cites for the ker g(tau)
        construction, itself states "n = 163 (d = 162) has no lane at all".
        The record's headline object is structurally empty on the one curve it
        names. (For the record: 233 has dims 29k, 283 has 94k, 409 has 204k,
        571 has 114k, plus 0/1 -- all already in 8fe0ef.)
    - step: 'H1: the solution set of ONE target instance is closed under the tau-orbit action, so orbit-equivalence clauses are satisfiability-preserving and prune by n'
      verdict: defective
      note: >-
        IDEA-20260906-a77711 Lemma A1: since S_{m+1} has F_2 coefficients,
        squaring all coordinates maps a solution of I_R to a solution of
        I_{sigma(R)}, a DIFFERENT instance. Lemma A2: for R in the prime-order
        subgroup V(I_R) and V(I_{sigma R}) are disjoint (a shared tuple would
        force R = sigma(R)). Hence the orbit of a solution of the fixed-target
        CNF is NOT a solution of that CNF; an "orbit-equivalence" or
        canonical-representative clause set on one instance is unsound and
        would drop solutions. The record's own falsification condition
        ("clauses that change satisfiability halt the design") fires by
        derivation before any run. The only sound form is the orbit system
        over all n conjugate targets, whose leaf count is n*2^{ml}/(m!*n) =
        2^{ml}/m!: no per-instance gain, only the n-relations-per-solve
        dimension gain a77711 already prices. KN-FIND-47da4e measured exactly
        this parameterisation at m = 2, n in {13,17,19,23}: ratio 1.00-1.47,
        never below 1 (unverified provenance, but it is the standing prior the
        record omits).
    - step: 'Toy set n in {17, 23, 29, 31, 37, 41} hosts tau-stable V for the H1/H2 measurements'
      verdict: defective
      note: >-
        ord_29(2) = 28 and ord_37(2) = 36 (computed): those two degrees host
        only dimensions {0,1,n-1,n}. The others do: n = 17 (dims 8k), 23
        (11k), 31 (5k), 41 (20k), plus 0 and 1. Half the record's toy
        ladder is empty for its own construction.
    - step: 'H2 rigorous part: the E-membership indicator is constant on tau-orbits of a tau-stable V'
      verdict: holds
      note: >-
        Re-derived: on y^2 + xy = x^3 + ax^2 + b with a, b in F_2, x is an
        x-coordinate iff Tr(x + b/x^2) = Tr(a) (substitute y = xz), and
        Tr(u^2) = Tr(u), so the predicate is invariant under x -> x^2. True,
        and true by construction on any orbit union. The saving is a factor n
        on a one-time count costing O(|V| * n) bit operations; against
        2^{n - m_a l} decomposition attempts it is invisible at any scale.
    - step: 'H2 cost fact: the polynomial-to-normal basis conversion is an uncharged obstacle to realising the saving'
      verdict: defective
      note: >-
        The conversion is one fixed n x n F_2 matrix applied once per element
        (O(n^2) bit operations, or O(n^2) once for the matrix), a rounding
        error next to a single field multiplication schedule. It is not a
        finding. On ECC2K-130 the challenge itself is stated in a type-II
        optimal normal basis (KN-LIT-661e97, KN-FIND-aa2efc), so the "access
        cost" is zero on the curve this brief prices.
    - step: 'Reproduction anchors: 0d8e90 medians 30978.5 at (15,5), 254656.5 at (17,6), 255301 at (19,6), c in [0.945, 0.974]'
      verdict: unchecked
      note: IDEA-20260915-0d8e90 was not opened this session; the medians are quoted as cited.
    - step: 'Amortisation crossover for H2 (one-time conversion cost repaid over k calls)'
      verdict: holds
      note: >-
        Elementary as stated, but the crossover is at k of order 1 because
        the conversion is O(n^2) and each naive membership test is already
        O(n) field-element work; the "open number" has no content.
  verdict: defective
  defects:
    - what: >-
        H1 treats the absolute Frobenius as a symmetry of one fixed-target
        instance; it is an equivariance between the n conjugate instances
        (a77711 Lemmas A1/A2), so the proposed clauses are unsound and the
        sound orbit-system version has been measured cost-neutral.
      where: claim (S3) H1; mechanism "OBJECT FRAME FOR H1"; heuristic HC-1; predictions[0]
      fix: >-
        Delete H1, or restate it as the orbit system over the n conjugate
        targets (gauge-fixed or one-hot shift), cite a77711 and KN-FIND-47da4e
        as the standing prior, and predict ratio 1 (relabelling) as the null.
    - what: K-163 hosts no tau-stable subspace of any dimension between 1 and 162.
      where: title; claim (S2)-(S3); origin.scope; target_complexity.best_known
      fix: >-
        State the stable-subspace lattice per FIPS Koblitz curve (163: none;
        233: 29k; 283: 94k; 409: 204k; 571: 114k, from 8fe0ef) and re-scope
        every deployed-row statement to curves that host a lane, or to orbit
        unions, in which case H2 is true by construction and says nothing.
    - what: Toy degrees 29 and 37 host no tau-stable V.
      where: minimal_test Step 3; HC-1 and HC-2 validation_plan; method_ceiling
      fix: 'Restrict to n in {17, 23, 31, 41} and list the admissible dimensions (8, 11, 5 or 10, 20).'
    - what: The basis-conversion "uncharged cost" is O(n^2) bit operations once and cannot bear the weight the title puts on it.
      where: title; claim (S3) H2; mechanism "THE ONE OPEN NUMBER"; target_complexity.hidden_overhead
      fix: Charge it in one line and drop it from the title and the priority argument.
    - what: Notation collision -- m is used both for the field degree (order of <tau>) and, as m_a, for the arity; the additive gain m_a*log2(m) mixes the two.
      where: claim (S3) H1; predictions[0]
      fix: Use n for the degree throughout, as every sibling record does.
    - what: Three load-bearing distinctions rest on records cited by title only (3c7a91, eee7e4, b9f0c5).
      where: citations; citation_note; minimal_test Step 1
      fix: Read them in full before refiling; the record itself names this as Step 1.
    - what: dominated_by and frontier_check omit a77711 and KN-FIND-47da4e, the two records that decide H1.
      where: dominated_by; frontier_check
      fix: Add both rows and state what the revised H1 adds beyond them (nothing, on the present reading).
  ecc2k130_bearing: >-
    None. At n = 131, ord_131(2) = 130 and the only tau-stable subspaces have
    dimensions 0, 1, 130, 131 (KN-OPEN-095df5; re-derived here), so neither
    H1 nor H2 has an object on ECC2K-130; orbit unions exist but H2 is then
    vacuous and H1 is the cost-neutral relabelling of KN-FIND-47da4e. The
    challenge is already stated in a normal basis, so the basis-conversion
    story does not apply. The record names no arity and no per-attempt
    oracle budget; whatever m it implied, a symmetry-breaking constant cannot
    move the product-law floor (relations x targets x oracle = m*2^131,
    independent of dim V), which leaves 2^60.8 rho untouched: at m = 3 the
    free-oracle floor is 2^68.58 and at m = 4 the per-attempt budget is about
    2^4.4 group-operation equivalents (BRIEF section 2; my own naive balance
    2*(m! 2^131)^{2/(m+1)} reproduces the table to within 0.3-2.1 bits,
    same ordering, same verdict).
  agreement_with_hold: agrees
  agreement_note: >-
    HOLD-S's three findings are all re-derived here: K-163 hosts no stable V
    (ord_163(2) = 162), H1 contradicts a77711 and omits KN-FIND-47da4e, H2 is
    true by construction. Two additions: the toy ladder is half empty (29, 37),
    and the basis-conversion "cost" is a rounding error, so after the
    corrections almost nothing is left. FOR A REVISED RECORD TO BE RANKABLE it
    must contain, at minimum: (1) an H1 restated as the n-conjugate orbit
    system with a77711's equivariance reading and 47da4e's ratio >= 1 as the
    pre-registered null, or no H1 at all; (2) a stable-subspace lattice per
    named curve with K-163 marked empty; (3) toy cells only at n in
    {17, 23, 31, 41} with the admissible dimension listed; (4) the arity m
    and the per-attempt oracle budget it would need from the product-law
    table, so a constant-factor claim is priced against a floor rather than
    against "faster"; (5) dominated_by rows for a77711 and 47da4e. The
    honest revision route is a merge into the record that already carries
    the stable-lane arm at n = 41/43 (H-FROB-a5bf86 / EXP-FROB-30006a, per
    KN-FIND-47da4e), not a standalone refiling.
  concrete_experiment:
    cell:
      curve: >-
        Koblitz-shaped toy y^2 + xy = x^3 + x^2 + 1 over F_2[t]/(t^17 + t^3 + 1)
        (the RC-1 field; a = 1, b = 1), #E = 2 * 65587 with 65587 prime
        (computed here; matches IDEA-20260915-8fe0ef's n = 17 cell), targets in
        the order-65587 subgroup.
      m: 2
      l: 8
      factor_base: >-
        V = ker g(tau) for g one of the two degree-8 irreducible factors of
        Phi_17 over F_2 (dimension 8, tau-stable by construction); control V'
        = a random 8-dimensional subspace (not tau-stable).
      targets: 200 random points R of the prime-order subgroup, plus sigma(R) for each.
      seeds: 'fixed seed list committed before the run (e.g. 2026092601..2026092620); one run per seed for the target draw only -- everything else is exhaustive.'
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - 'new: about 100 lines of pure Python -- Phi_17 factorisation, ker g(tau) basis, exhaustive 2-sum enumeration, orbit check (no solver needed)'
    procedure:
      - Factor Phi_17 over F_2, build the two ker g(tau) subspaces of dimension 8, and verify tau-stability by direct squaring of a basis.
      - For each target R, enumerate all unordered pairs (x_1, x_2) in V x V with x_1, x_2 x-coordinates and P_1 + P_2 = +-R (exhaustive, 2^16 pairs, pure group arithmetic); record the solution set S(R).
      - Apply coordinate squaring to every tuple in S(R) and test membership in S(R) (H1's implicit closure claim) and in S(sigma(R)) (a77711's Lemma A1 prediction).
      - Count, over the 200 targets, how many have S(R) closed under squaring; count how many have S(R) ∩ S(sigma R) non-empty (Lemma A2 predicts zero).
      - Repeat on V' (random, not tau-stable) where squaring does not even preserve membership in V'; report the fraction of squared tuples that leave V'.
      - 'H2 arm, zero cost: count |x(E) ∩ V| directly and via one representative per tau-orbit (orbits of size 17 plus the two fixed points 0, 1); the two counts must agree exactly.'
    metrics:
      - name: closure_fraction
        unit: fraction of targets
        definition: fraction of R with S(R) closed under coordinate squaring (H1 needs this near 1; a77711 predicts 0 for every R with sigma(R) != +-R).
      - name: conjugate_overlap
        unit: count of targets
        definition: number of R with S(R) ∩ S(sigma R) non-empty (Lemma A2 predicts 0).
      - name: equivariance_agreement
        unit: fraction of tuples
        definition: fraction of squared tuples from S(R) that lie in S(sigma R) (Lemma A1 predicts 1 on the tau-stable V).
      - name: h2_count_agreement
        unit: boolean
        definition: exact equality of the direct and per-orbit |x(E) ∩ V| counts.
    controls:
      - 'Random non-stable V'' of the same dimension (null object): equivariance_agreement is undefined there because squaring leaves V''; report the leave-V'' fraction as the tell.'
      - 'Ordinary-curve control: the same enumeration on a curve with b not in F_2 (e.g. b = t) over the same field, where sigma is not an endomorphism; squared tuples must fail to lie in S(sigma R) for E, confirming the instrument detects absence of equivariance.'
      - 'No relabelled Z/NZ control is needed: no group-structure claim beyond the endomorphism identity is made.'
    outcomes:
      positive: >-
        closure_fraction near 1 or conjugate_overlap > 0 on many targets:
        Lemma A2 is wrong, H1's clauses are sound, and this is a headline for
        review-breakthrough (contradicts a77711 and KN-FIND-47da4e).
      negative: >-
        closure_fraction = 0 and conjugate_overlap = 0 with
        equivariance_agreement = 1: H1 is unsound as written and HOLD-S is
        confirmed by measurement; the record's H1 is closed with a named
        obstruction (free C_n action on the union of conjugate solution sets).
      artifact: >-
        equivariance_agreement < 1 on the tau-stable V: the subspace is not
        actually tau-stable or the enumeration is wrong (check g | Phi_17 and
        the squaring map); nothing about H1 may be read until fixed.
    falsification_threshold: >-
      A single target R with sigma(R) != +-R whose solution set S(R) is
      closed under coordinate squaring, or a single non-empty S(R) ∩ S(sigma R),
      falsifies Lemma A2 and revives H1. Otherwise H1 is dead at this cell.
    estimated_cost:
      implementation: low
      compute: 'estimate: seconds to a minute of pure Python (2^16 pair enumerations x 400 targets); no solver.'
    zero_run_prerequisites:
      - Read IDEA-20260904-3c7a91, IDEA-20260915-eee7e4 and IDEA-20260920-b9f0c5 in full (the record's own Step 1).
      - Confirm from FIPS 186-4 that K-163 has a = 1, b = 1 (recalled in 8fe0ef; not re-derived here).
  successor_seam: >-
    None as a new proposal. The only live content, a factor-of-n saving on a
    one-time membership count over a tau-stable V, is true by construction
    and worth a sentence in whichever record carries the n = 41/43
    stable-lane arm (H-FROB-a5bf86 / EXP-FROB-30006a), not a record of its
    own. The soundness check above is a cheap negative control that any
    future "Frobenius symmetry-breaking on one instance" proposal should be
    required to pass first; the brief's G2 lane already names a77711's
    equivariance reading as a discriminator, so no new ID is warranted.
