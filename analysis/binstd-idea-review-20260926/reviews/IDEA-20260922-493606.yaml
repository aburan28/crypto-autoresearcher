review:
  idea_id: IDEA-20260922-493606
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-843cf5
  ranking_context:
    rank: 34
    disposition: return_for_revision
    hold_id: HOLD-T
  claim_restated: >-
    A zero-compute affordability table built by chaining three filed closed
    forms: IDEA-20260904-3c7a91's leaf-count law N_conf = 2^{ml}/|G|,
    IDEA-20260922-7ab503's extension |G| = m! * mu with mu = n the
    Frobenius-stabiliser order of a Koblitz-shaped curve (realised only in a
    normal basis), and IDEA-20260904-96c4f3's forward condition. At n = 37,
    l = 8 the Koblitz-shaped m = 4 cell is predicted at 2^32/(24*37) =
    4,836,675 leaves, within 1.73x of the already-budgeted m = 3, l = 8 cell
    (2^24/6 = 2,796,203), while the matched pseudorandom-shaped null stays at
    178,956,971; a secondary m = 5, l = 6, n = 29 cell is predicted at
    308,547. The record claims measurability of an m >= 4 cell, not any
    competitiveness with rho, and is explicitly chained on 7ab503's H1.
  core_argument_check:
    - step: 'Arithmetic in (B) and (D): 2^24/6, 2^32/24, /37, 2^30/120, /29, ratio 1.73, admissibility m(l-1) <= n'
      verdict: holds
      note: >-
        Re-computed: 2,796,202.7; 178,956,970.7; 4,836,674.9 (ratio 1.7297);
        8,947,848.5; 308,546.5; 4*7 = 28 <= 37; 5*5 = 25 <= 29; 25 <= 23 false
        (the record catches this itself). log2(37) = 5.21, log2(29) = 4.86 as
        stated. The integer arithmetic is correct for the formulas it applies.
    - step: 'Anchor: IDEA-20260904-b40e6d budgets ~2.8e6 leaves per instance at m = 3, l = 8'
      verdict: unchecked
      note: b40e6d not opened; the record itself flags this as an estimate, not a completed run.
    - step: 'The divisor mu = n exists as a search-tree symmetry of a single fixed-target descended instance on a Koblitz-shaped curve (imported from 7ab503 (A)/(D))'
      verdict: defective
      note: >-
        7ab503 (A) says the coordinate shift maps solutions of E's system "to
        solutions of E^sigma's", conceding the target is squared too. That is
        IDEA-20260906-a77711 Lemma A1: sigma(I_R) = I_{sigma(R)}, an
        equivariance between the instances for R and sigma(R), and Lemma A2:
        their solution sets are disjoint for R in the prime-order subgroup.
        So the mu-orbit "canonical representative" constraint on ONE instance
        drops solutions (unsound), and on the orbit system over the n
        conjugate targets the leaf count is n*2^{ml}/(m!*n) = 2^{ml}/m! --
        the divisor n is exactly cancelled by the n-fold target multiplicity.
        No per-instance factor n exists to be realised in any basis. The
        entire differential between the two arms in (B) rests on this.
    - step: 'The factor base at n = 37, l = 8 is preserved by the Frobenius (needed for the shift to act on the search cube at all)'
      verdict: defective
      note: >-
        ord_37(2) = 36 (computed), so Phi_37 is irreducible over F_2 and the
        tau-stable subspaces of F_{2^37} have dimensions {0, 1, 36, 37}; no
        8-dimensional subspace V is stable, so x -> x^2 does not even preserve
        x_i in V. Same at n = 29 (ord 28). HOLD-T's arithmetic confirmed. The
        degrees that host a stable V near these dimensions are 17 (dim 8), 23
        (dim 11), 31 (dims 5, 10), 41 (dim 20); but see the previous step --
        fixing n does not restore the divisor.
    - step: 'The pseudorandom-shaped null at mu = 1 stays at 2^{32}/24 leaves'
      verdict: holds
      note: >-
        Correct under 3c7a91's law, and -- because the Koblitz arm's divisor
        n does not exist -- the Koblitz-shaped arm is predicted at the SAME
        2^{32}/24 = 1.79e8 leaves. The prediction that the two arms differ
        collapses to a prediction that they agree.
    - step: '(E) forward condition c = 1 - m/(2(m-1)): 1/4 at m = 3, 1/3 at m = 4'
      verdict: holds
      note: Re-computed from 96c4f3 (E) as quoted; 0.25 and 0.333.
    - step: 'log2(mu) ~ 5.2 bits is a constant, not an exponent change'
      verdict: holds
      note: Correct framing had the constant existed; it does not, per the equivariance step.
  verdict: defective
  defects:
    - what: >-
        The load-bearing divisor mu = n is a per-instance symmetry that does
        not exist: the absolute Frobenius is an equivariance between the
        instances of conjugate targets (a77711 Lemmas A1/A2), and on the orbit
        system the n cancels. The Koblitz and pseudorandom arms are predicted
        equal at 2^{32}/24 leaves.
      where: claim (B), (D); title; predictions[0], [2], [3]; sota_delta.time
      fix: >-
        Remove the /mu column, or restate the table for the n-target orbit
        system with the cancellation shown, citing a77711 and KN-FIND-47da4e
        (measured ratio >= 1 at m = 2). The chained dependency on 7ab503 H1
        should be stated as "7ab503 H1 contradicts a77711; this record falls
        with it" rather than as an assumption.
    - what: n = 37 and n = 29 host no tau-stable subspace of dimension 8 or 6, so the shift does not act on the search cube.
      where: claim (B), (D); assumptions[3]; confounders[3]
      fix: 'If any Frobenius-indexed arm survives, choose n from {17, 23, 31, 41} with V = ker g(tau) at the admissible dimension, as HOLD-T says; at m = 4 the admissible stable cell is n = 31, l = 5 (4*4 = 16 <= 31), leaf count 2^{20}/24 = 43,691 -- trivially affordable on ANY curve shape.'
    - what: The "affordability threshold" is defined against a design estimate (b40e6d's ~2.8e6), not a measured run, and the record has no wall-clock or memory figure for any m = 4 cell.
      where: assumptions[2]; proof_search_map.baseline_embedding
      fix: Anchor to a completed run record or state the anchor as unmeasured in the title.
    - what: No solver named in this repository can run the CNF-XOR arm; WDSat/CaDiCaL are not installed.
      where: minimal_test Stage 3; estimated_cost
      fix: Declare the missing engine as a prerequisite or re-plan on the pure-Python Macaulay/closure instrument (S_5 descent at m = 4 is untested there).
  ecc2k130_bearing: >-
    None. The record is toy-only by construction and says so. Read against
    the product law: at m = 4 the free-oracle floor on ECC2K-130 is 2^56.40
    (BRIEF section 2; my naive balance gives 2^55.2) with a per-attempt
    budget of about 2^4.4 group-operation equivalents, and at m = 5 about
    2^12.4. A CNF-XOR attempt at 2^{ml}/m! leaves with l of order 27 (the
    balanced dim V at m = 4) is 2^{103} leaves per attempt -- some 2^98 above
    budget -- and a constant divisor of 37, or of 131, changes nothing. At
    n = 131 no tau-stable V exists at all (ord_131(2) = 130), so even the
    (non-existent) per-instance symmetry would have no object. Bearing on
    2^60.8: zero.
  agreement_with_hold: agrees
  agreement_note: >-
    HOLD-T is right on both counts and understates the problem. It says the
    record is chained on 7ab503's per-instance symmetry claim and that
    n = 37, 29 host no stable subspace (both re-derived: ord 36, 28). The
    deeper point is that re-choosing n from {17, 23, 31, 41} does NOT rescue
    the record, because the divisor mu itself is the equivariance/symmetry
    confusion a77711 closes; with the divisor removed the two arms coincide
    and the "curve shape decides affordability" claim has no content. FOR A
    REVISED RECORD TO BE RANKABLE it must contain: (1) the affordability
    table WITHOUT the /mu column, i.e. 2^{ml}/m! per arm, identical for
    Koblitz-shaped and pseudorandom-shaped curves, with the cancellation on
    the orbit system shown and a77711 / KN-FIND-47da4e cited; (2) if a
    Frobenius-indexed differential is still claimed, a stated mechanism that
    is not a per-instance symmetry, at a degree that hosts a stable V; (3) a
    named, installed solver or a re-plan on the pure-Python closure
    instrument with its m = 4 (S_5) feasibility stated as untested; (4) a
    measured anchor for the m = 3, l = 8 cell instead of a design estimate.
    With (1) applied, what remains is "measure one m = 4 cell", which is
    IDEA-20260807-32f96d's own open item and does not need a Koblitz shape.
  concrete_experiment:
    cell:
      curve: >-
        Two-arm toy at n = 19, f = t^19 + t^5 + t^2 + t + 1: (i) the CERTBIN
        ordinary cell A = 46693, B = 306147, h = 2 (DEC-20260926-901ea1
        SUPPORT); (ii) the Koblitz-shaped y^2 + xy = x^3 + 1 over the same
        field, #E = 4 * 130873 with 130873 prime (computed here), the
        ECC2K-130 order shape.
      m: 3
      l: 5
      factor_base: 'random 5-dimensional polynomial-basis subspace V (3*(5-1) = 12 <= 19 admissible); no tau-stability claimed or possible at n = 19 (ord_19(2) = 18).'
      targets: 100 random targets per arm in the prime-order subgroup, half planted decomposable (sum of three V-points), half random.
      seeds: 'committed list of 5 seeds; target draw and planting only; enumeration is exhaustive.'
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/macaulay.py
      - experiments/EXP-CERTBIN-e94b27/impl/closure.py
      - 'missing: WDSat or CaDiCaL for the CNF-XOR leaf-count arm the record actually proposes; the pure-Python arm measures the S_4 descent refutation cost instead, which is a different oracle.'
    procedure:
      - Build the S_4 Weil descent at (m, l) = (3, 5) on both curves (new code on top of macaulay.py's S_3 builder; S_4 is degree 4 in each variable over binary fields -- feasibility of the pure-Python Macaulay at 15 variables is untested and is the first thing to report).
      - Run the W_4 mutant closure per target with a fixed watchdog; record refuted / found / watchdog per arm and the operation count per instance.
      - Ground truth by exhaustive 3-fold enumeration over V (2^15/6 unordered triples of group additions) for every target; certificate-verify every found decomposition.
      - Compare the per-target operation-count distributions of the two arms (Koblitz-shaped vs ordinary) at identical (m, l, n); the pre-registered prediction is equality within noise.
      - Report the count of targets whose S_4 refutation is out of reach of W_4 at D <= 4 (the KN-FIND-5a8d3e closure-artifact question at m = 3).
    metrics:
      - name: refutation_rate
        unit: fraction of unsat targets certified per arm
        definition: number of unsat targets with a verifier-accepted W_4 certificate divided by the number of unsat targets (ground truth from enumeration).
      - name: ops_per_attempt
        unit: GF(2) row operations (int32 log count)
        definition: closure operation count per target, median and max, per arm.
      - name: arm_ratio
        unit: dimensionless
        definition: median ops_per_attempt Koblitz-shaped / ordinary at identical parameters; predicted 1.0.
      - name: certificate_pass_rate
        unit: fraction
        definition: verifier-accepted certificates over claimed ones; must be 1.0.
    controls:
      - 'Ordinary curve of the same size (arm ii vs arm i) -- the shape control the record itself proposes, with the pre-registered prediction now equality.'
      - 'Null object: a random 5-dimensional V versus a second random V, same arm, to bound run-to-run spread before any arm difference is read.'
      - 'Relabelled Z/NZ generic-group control: not applicable to a solver-cost measurement (the descent needs the curve equation); the exhaustive enumeration arm is the generic-cost reference instead.'
      - 'Planted decomposable targets to check the solver finds what enumeration finds (soundness).'
    outcomes:
      positive: >-
        arm_ratio materially below 1 (say < 0.5) replicated at two seeds:
        the Koblitz shape changes S_4 refutation cost by a mechanism that
        is not the per-instance symmetry, and that would be new -- it goes to
        review-breakthrough before any interpretation.
      negative: >-
        arm_ratio within [0.8, 1.25] and refutation_rate equal across arms:
        curve shape does not decide affordability at m = 3 on this
        instrument, consistent with the equivariance reading; the m >= 4
        gap of IDEA-20260807-32f96d stays open but shape-blind.
      artifact: >-
        certificate_pass_rate < 1, or refutation_rate far below 1 on both
        arms with watchdog expiry dominating: the pure-Python closure does
        not reach S_4 at these parameters; a timeout is not evidence
        (AGENTS.md rule 3) and the cell is reported as unreached.
    falsification_threshold: >-
      For the record's claim: any Koblitz/ordinary operation-count ratio
      below 1/(2*n) = 1/38 at identical (m, l) would be consistent with a
      realised per-instance factor n; a ratio in [0.8, 1.25] falsifies the
      differential-affordability claim at this cell.
    estimated_cost:
      implementation: medium
      compute: 'estimate: minutes to a few hours of single-core pure Python if the S_4 Macaulay at 15 variables fits in 3 GiB; unknown otherwise (labelled estimate; the feasibility is itself the first metric).'
    zero_run_prerequisites:
      - Re-derive a77711 Lemma A2 for the m = 3 case on the Koblitz-shaped n = 19 curve by exhaustive enumeration at l = 5 (the 2a3771 review's zero-solver check, extended to triples).
      - Confirm IDEA-20260904-b40e6d's anchor figure is a design estimate (as the record states) or find the run record.
  successor_seam: >-
    Not the Koblitz differential. The reusable content is the one honest
    gap it points at: the corpus has no measured m >= 4 decomposition cost
    cell on a prime-degree binary sibling (IDEA-20260807-32f96d), and the
    pure-Python closure instrument has only been exercised at m = 2 (S_3).
    A proposal under RQ-CERTBIN-836ce2 that extends EXP-CERTBIN-e94b27's
    W_D closure to the S_4 (m = 3) and S_5 (m = 4) descents at the n = 17
    RC-1 and n = 19 cells, reports where the pure-Python Macaulay stops
    fitting memory, and records the refutation rate versus D as the
    affordability table -- with NO symmetry claim and the ordinary curve as
    the only control -- would fill that gap. That is the G2 lane's seam
    ("degree-fall structure of S_3 and S_4 descents"), so it needs no new ID
    from this review.
