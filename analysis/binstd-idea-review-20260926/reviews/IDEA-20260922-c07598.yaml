review:
  idea_id: IDEA-20260922-c07598
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-002d0e
  ranking_context:
    rank: 8
    disposition: consolidated_into_1a081a
    hold_id: HOLD-B
  claim_restated: >-
    On the five composite-degree ANSI curves (E over F_q, q = 2^16, attacked
    over F_{q^k}, k in {11,13,17,19,23} prime) the automorphism group available
    to Pollard rho on the prime-order subgroup is <pi_q, -1> of order exactly 2k:
    pi_q acts on G as a scalar mu with mu^k = 1 and mu != 1 (because G meets
    E(F_q) only in O), so ord(mu) = k by primality. The tempting 32k (from the
    16k-element Galois orbit of curves under the base-2 Frobenius) is wrong
    because pi_2 is not an endomorphism of any one of the five (B is not in
    F_2). The same order-k group is the ceiling on what any single-target attack
    may charge as a symmetry gain. The matched-rho figures are reused from
    d11575 at 0.886 sqrt(r)/sqrt(2k) with r = 2^(s-0.5).
  core_argument_check:
    - step: 'pi_q restricted to E(F_{q^k}) is a group automorphism of order dividing k'
      verdict: holds
      note: A, B in F_q (audit); pi_q^k fixes F_{q^k}-rational coordinates.
    - step: 'mu != 1 because G meets E(F_q) only in O, i.e. gcd(h, r) = 1 with h = #E(F_q)'
      verdict: holds
      note: >-
        Re-derived from the dump for all five: h = q + 1 - t reproduces 65390,
        65096, 65286, 65070, 65392 from t = 147, 441, 251, 467, 145; the Weil
        recursion from t reproduces h*r exactly (5/5); gcd(h, r) = 1 (5/5);
        r has 161, 193, 257, 289, 353 bits.
    - step: 'k prime forces ord(mu) = k; -1 is not in <mu> so |<pi_q, -1>| = 2k'
      verdict: holds
      note: Lagrange; k odd so an element of order 2 cannot lie in a group of odd order k.
    - step: 'pi_2 is not an endomorphism of E because B is not in F_2'
      verdict: holds
      note: 'Dump: B is a full-width element on all five; c2pnb208w1 has A = 0 (in F_2) but B is not, which is enough.'
    - step: 'A3: Aut(E) = Z/2 for the five curves, flagged open, "most plausibly" failing at c2pnb208w1 (a = 0)'
      verdict: holds
      note: >-
        Closable by a recalled classical fact (Silverman, Appendix A, char 2
        classification; RECALLED, not opened this session): for y^2 + xy = x^3 +
        a x^2 + b the j-invariant is 1/b, so j != 0 for every ordinary curve, and
        Aut(E) over the algebraic closure is {+-1} whenever j != 0 (the order-24
        group occurs only at j = 0, supersingular). Ordinariness is audited: t is
        odd for all five (147, 441, 251, 467, 145). The coefficient a affects only
        Tr(a) (the E/2E class), never j, so a = 0 on c2pnb208w1 is not a risk
        factor. A3 therefore holds for all five; the record's heuristic H-c07598-1
        can be discharged by reading that classification at source.
    - step: 'The numbers (D): 2^77.9, 93.7, 125.5, 141.5, 173.3 from 0.886 sqrt(2^(s-0.5))/sqrt(2k)'
      verdict: holds
      note: >-
        Reproduced as 77.85, 93.73, 125.53, 141.45, 173.31 -- the record's own
        arithmetic is right under its own (wrong) convention. Under the brief's
        convention sqrt(pi*r/(4k)) with the actual r from the dump the rows are
        78.10, 93.98, 125.78, 141.71, 173.57: +0.5 bit from sqrt(2k) -> sqrt(k)
        (A4, CORR-20260922-81aeab) and -0.25 bit because r = 2^(s-0.5) overstates
        the actual r (log2 r = 160.003, 192.010, 256.006, 288.010, 352.003, i.e.
        2^(s-1) + epsilon). Net +0.25 bit per row.
    - step: '(C) attack-side ceiling: a single-target construction may charge at most the order-k group'
      verdict: holds
      note: >-
        Holds as a statement about the symmetry GROUP. It should add that the two
        sides extract different quantities from the same group: rho gains
        sqrt(k) in walk length; a Frobenius-aware index calculus gains up to k in
        relation count and k^2 in linear algebra (GGMP, abstract level). Without
        that sentence (C) invites the reverse mistake of capping the attack at sqrt(k).
    - step: 'Prediction 2: a proper divisor of a composite k'' must be observable on at least one composite toy cell'
      verdict: defective
      note: >-
        Not forced. ord(mu) is a proper divisor of k' iff r divides #E(F_{q^{k'/p}})
        for some prime p | k', which depends on the curve. Example computed here:
        E/F_16 = F_2[t]/(t^4+t+1), A = 0, B = t^3+1 (encoded 9), #E(F_16) = 12,
        t = 5: over F_{2^24} (k' = 6) the order 16772184 has largest prime factor
        181, so the (4, 6) cell on this curve has no large prime subgroup at all.
        The control needs a curve search, stated as such.
  verdict: sound_with_corrections
  defects:
    - what: 'The rho convention sqrt(2k) double-counts negation (A4); the r = 2^(s-0.5) half-bit convention overstates r by 0.5 bit'
      where: claim (D); target_complexity.best_known; dominated_by
      fix: 'Use sqrt(pi*r/(4k)) with the actual r: 78.10, 93.98, 125.78, 141.71, 173.57 (re-derived here). Cite CORR-20260922-81aeab.'
    - what: 'A3 is left open although it closes on the j = 1/b != 0 classification plus the audited odd traces'
      where: assumptions A3; heuristic H-c07598-1; next_gate
      fix: 'Close A3 by reading the char-2 automorphism classification at source (recalled here, provenance to be upgraded); drop the a = 0 red herring.'
    - what: 'The composite-k'' positive control is written as a forced prediction'
      where: predictions 2; minimal_test PART 2
      fix: Reword as a curve search over subfield curves E/F_{2^d} with composite k' until one exhibits r | #E(F_{q^{k'/p}}); report the search.
    - what: '(C) omits that rho and index calculus extract different gains (sqrt(k) versus k) from the same order-k group'
      where: claim (C)
      fix: Add the sentence; it is the content 1a081a's C3 threshold needs.
  ecc2k130_bearing: >-
    No arity implied. The same derivation at q = 2, k = 131 gives the class
    group <tau, -1> of order 262 on the order-l subgroup, with j = 1/b = 1 != 0
    so Aut = Z/2, and rho at sqrt(pi*l/(4*131)) = 2^60.81 (re-derived from the
    129-bit prime l; the Weil recursion from t = -1 reproduces 4l). The 16-fold
    conflation cannot arise on ECC2K-130 (E is defined over F_2, so the Galois
    orbit of curves is trivial). The ceiling (C) says any single-target
    decomposition line may charge at most the order-131 group, which is exactly
    the correction KN-FIND-aa2efc folded in when it withdrew an 11.44-bit
    headroom that assumed a materialised orbit-union base. Against the product
    law: the ceiling bounds the Frobenius-aware floor variant (relations/131,
    LA/131^2: 45.15 at m = 4 versus 56.40 blind) as the best case, not a measured one.
  agreement_with_hold: agrees
  agreement_note: >-
    Consolidating into 1a081a as its symmetry-ledger section is right: the record
    changes no number that 1a081a's baseline column does not already carry
    correctly, and its one open item (A3) closes on a classical fact. The
    section should carry the corrected rows and the sqrt(k)-versus-k sentence.
  concrete_experiment:
    cell:
      curve: 'Toy subfield cell E/F_16, F_16 = F_2[t]/(t^4+t+1), y^2 + xy = x^3 + B with A = 0, B = t^3 + 1 (encoded 9); #E(F_16) = 12, t = 5 (odd, ordinary). Over F_{2^20} (k'' = 5): #E = 1049052 = 12 * 87421, r = 87421 prime, gcd(12, r) = 1. Over F_{2^28} (k'' = 7): #E = 268402692 = 12 * 22366891. Deployed rows: the five c2pnb curves as arithmetic only.'
      m: 0
      l: 0
      factor_base: 'none (this is a group-order and automorphism check, not a decomposition)'
      targets: 'one point of order r on each toy cell, plus 100 random points of the prime-order subgroup'
      seeds: 'seed 20260926; points chosen as h * (random point)'
    instrument:
      - 'experiments/EXP-CERTBIN-e94b27/impl/gf2n.py Field(n, mod) and curve.py Curve (generic n; both import numpy: missing: numpy in this container; a numpy-free port is about 150 lines of pure Python)'
      - 'the five-row integer certificate (gcd, t parity, Weil recursion) -- done in this review''s scratch script and reproducible in seconds'
    procedure:
      - '1. Part 1 (arithmetic): for each c2pnb row print h = q + 1 - t, the Weil recursion to k, h*r versus the dump, gcd(h, r), t mod 2, and the corrected rho row.'
      - '2. Part 2: on the (4,5) and (4,7) cells compute pi_q(P) = (x^16, y^16) on a point P of order r and find the least j with pi_q^j(P) = P; predicted exactly 5 and 7.'
      - '3. Apply pi_2 to P and test E''s own equation; predicted to fail on every point with x not in F_2.'
      - '4. Null object: an ordinary curve over F_{2^20} with B outside F_16 (count its points with curve.count_by_trace, about 2^20 trace tests): pi_16 is not an endomorphism; verify (x^16, y^16) is off the curve.'
      - '5. Composite control: search E/F_16 curves with odd t until one has, over F_{2^24}, a prime r > 2^12 dividing #E(F_{2^8}) or #E(F_{2^12}); report ord(mu) there.'
    metrics:
      - name: ord_pi_q_on_G
        unit: integer
        definition: least j >= 1 with pi_q^j(P) = P for P of order r
      - name: pi_2_endomorphism_failures
        unit: count out of 100
        definition: points whose image under (x, y) -> (x^2, y^2) is not on E
      - name: rho_row_bits
        unit: log2 group operations
        definition: 0.5*log2 r + 0.5*log2(pi/4) - 0.5*log2 k, actual r
    controls:
      - k = 1 embedding (E over F_q itself) returns symmetry order 2
      - null curve over F_{2^20} with B not in F_16 (no pi_16 endomorphism)
      - degenerate control B in F_2 (pi_2 is then an endomorphism and must be detected as one)
      - composite-k' cell found by search, where ord(mu) is a proper divisor
    outcomes:
      positive: 'ord = 5 and 7 exactly on the prime cells, pi_2 fails on all non-F_2 points, the five integer certificates pass: the 2k ledger is certified and the corrected rows are quoted in 1a081a.'
      negative: 'ord(pi_q) on a prime-k'' cell is a proper divisor or a multiple: the primality argument or the point-order arithmetic is wrong; halt.'
      artifact: 'The null curve returns an order for pi_16: the instrument is computing a Galois-conjugate map on the wrong curve; fix before reading anything.'
    falsification_threshold: 'Any prime-k'' cell with ord(pi_q) != k''; any of the five gcd(h, r) != 1; any row differing from the corrected convention by more than 0.01 bit.'
    estimated_cost:
      implementation: low
      compute: 'seconds for Part 1; under a minute for Part 2 in pure Python (estimate); the F_{2^20} null point count is minutes (estimate)'
    zero_run_prerequisites:
      - read the characteristic-2 automorphism classification at source and record its provenance
      - cite CORR-20260922-81aeab for the convention
