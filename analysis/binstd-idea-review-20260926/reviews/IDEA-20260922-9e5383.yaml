review:
  idea_id: IDEA-20260922-9e5383
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-5d1a51
  ranking_context:
    rank: 27
    disposition: design_after
    hold_id: HOLD-N
  claim_restated: >-
    The prime-degree c2tnb curves are RQ-BINSTD's mandated null object for the
    composite c2pnb rows, but their field sizes do not match (gaps up to 87 bits),
    so every deployed-scale null comparison in the lane is already across mismatched
    fields. (A) proposes a toy ladder that preserves each deployed c2pnb-to-nearest-
    c2tnb field-size RATIO at dk<=41 using k-prime, d|16 composite arms and prime n
    null arms, with the ratio-matching error stated per pair. (B) the differential
    measurement: WDSat conflict ratio (reusing IDEA-20260920-b9f0c5's instrument) on
    the composite arm's Frobenius-stable subspace against the orbit-naive null
    2^{ml}/m!, while the prime null arm has NO nontrivial stable subspace by
    construction -- a "precondition absent" null, claimed stronger than a same-shape-
    different-value null. (C) recommends the (d,k)=(2,17) primary cell (ord_17(4)=4,
    f=5, 32 stable subspaces) as the richest reachable proxy.
  core_argument_check:
    - step: '(A) field-size gaps and ratios by subtraction/division'
      verdict: holds
      note: 'Gaps (176->191=15, 208 between 191/239, etc.) and ratios are plain arithmetic on the audited degrees; the disclosed worst mismatch (pair 3, 10 points) is honestly stated.'
    - step: '(C) ord_17(4) = 4, f = 5, 32 stable subspaces'
      verdict: holds
      note: 'Confirmed 4^1=4, 4^2=16, 4^4=256=1 mod 17, so ord_17(4)=4; f=1+(17-1)/4=5; 2^5=32 subspaces. Dimension set {0,1,4,5,8,9,12,13,16,17} correct.'
    - step: 'CORE NULL-OBJECT CLAIM: a prime-degree curve has NO nontrivial Frobenius-stable subspace'
      verdict: defective
      note: >-
        FALSE as stated, and this is the load-bearing defect. The record conflates
        "no proper subFIELD" (true for prime n) with "no nontrivial Frobenius-stable
        subSPACE". Stable F_2-subspaces of F_{2^n} are the F_2[x]/(x^n-1)-submodules,
        counted by 2^f with f = number of irreducible factors of x^n-1 over F_2 =
        1 + (n-1)/ord_n(2). They vanish (only dims 0,1,n-1,n) ONLY when ord_n(2)=n-1.
        The record uses n=31 as a null arm in pairs 1, 2 and 4: I confirmed
        ord_31(2)=5, so x^31-1 has 1 + 30/5 = 7 irreducible factors, f=7, and n=31
        hosts 2^7=128 stable subspaces with nontrivial dimensions (5,6,10,11,...).
        The null arm's precondition is NOT absent at n=31 -- the "structurally
        stronger null" collapses on three of five pairs.
    - step: 'primary cell null arm n=37'
      verdict: holds
      note: >-
        ord_37(2)=36=n-1, so f=2 and n=37 genuinely has only trivial stable
        subspaces -- the null reasoning happens to hold for the PRIMARY cell. But the
        record states the reasoning as a general fact, and it is false for 3 of its 5
        null arms (n=31 in pairs 1,2,4). ord_41(2)=20 likewise gives f=3, so the
        "poor-n" control n=41 also hosts nontrivial stable subspaces.
  verdict: sound_with_corrections
  defects:
    - what: the general null-object justification ("prime-degree -> no stable subspace") is false; n=31 hosts 128 stable subspaces (ord_31(2)=5)
      where: mechanism ("no nontrivial Frobenius-stable subspace at all"), claim (B), (A) pairs 1/2/4 null arm n=31
      fix: >-
        Restate the null precondition as ord_n(2)=n-1 (primitive prime), which holds
        for n=37 but NOT n=31 or n=41. Re-choose every null arm to a primitive prime,
        or -- per the hold -- change the null to "absence of an endomorphism", which
        is the property that actually distinguishes the prime-degree curves and does
        not depend on the x^n-1 factorisation.
    - what: three of five null arms (n=31) are mis-specified
      where: (A) pairs 1, 2, 4
      fix: >-
        Replace n=31 with a primitive prime near the target size (e.g. n=29:
        ord_29(2)=28=n-1, f=2, genuinely trivial; or n=53: ord_53(2)=52). Recompute
        the ratio-matching errors after re-selection.
    - what: the "poor-n" control n=41 is not poor -- ord_41(2)=20 gives a moderately rich lattice
      where: controls (poor-n toy cell)
      fix: the record itself half-acknowledges this ("ord_41(2)=20 gives a moderately rich but different lattice"); pick a genuinely primitive prime for the poor arm.
  ecc2k130_bearing: >-
    ECC2K-130 is n=131 prime with ord_131(2)=130 = n-1, so it IS a primitive prime:
    x^131-1 has only two irreducible factors over F_2 and the only Frobenius-stable
    subspaces have dims 0, 1, 130, 131 (matching the brief's KN-OPEN-095df5 closure).
    So for ECC2K-130 the intended null-object reasoning happens to be correct -- it
    genuinely hosts no useful stable subspace, and the WDSat differential's
    precondition is absent at n=131. The record's error is that it wrongly assumes
    every prime-degree curve behaves like ECC2K-130 does. The transfer to ECC2K-130
    is only structural (confirming it is a valid "precondition absent" null); no
    arity m is implied and the product-law floor is not engaged, so nothing bears on
    the 2^60.8 matched rho as an attack. The differential measurement lives on the
    composite c2pnb toy analogues, not on ECC2K-130 itself.
  agreement_with_hold: agrees
  agreement_note: >-
    Agree with the hold, and I independently confirm its correction: ord_31(2)=5, so
    prime n=31 DOES host nontrivial Frobenius-stable subspaces (128 of them, f=7).
    The record's null reasoning is wrong as written for its n=31 arms; the correct
    null is the absence of an endomorphism (the hold's phrasing) or, equivalently,
    restricting null arms to primitive primes ord_n(2)=n-1. design_after is right:
    the record's arithmetic (A) and (C) are exact and its instrument reuse is sound,
    but the null-object protocol needs re-selection before it is designed, and it
    should wait on IDEA-20260920-b9f0c5's d=1 result under GOAL-FROB-6333a9.
  concrete_experiment:
    cell:
      curve: >-
        Composite arm E/F_4 over F_{4^17} = F_{2^34} ((d,k)=(2,17), ord_17(4)=4,
        f=5, 32 stable subspaces); null arm a PRIMITIVE prime (n=37, ord_37(2)=36 --
        genuinely no nontrivial stable subspace; NOT n=31, which fails the precondition).
      m: 2
      l: 'toy, set by the stable-subspace dimension chosen from {4,5,8,9,...}'
      factor_base: 'the richest Frobenius-stable F_4-subspace of the composite arm (one degree-4-kernel subspace from the f=5 lattice)'
      targets: '>=3 fresh certified-UNSAT PDP targets'
      seeds: enumerated / fresh per target
    instrument:
      - 'IDEA-20260920-b9f0c5 WDSat conflict-ratio instrument (reused at base field F_4)'
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - 'new: F_4 (d=2) base-field arithmetic layer for the descent builder'
      - 'missing: WDSat (the conflict-ratio metric is WDSat-defined); without it, only the structural stable-subspace census (Stage 0/4) runs'
    procedure:
      - Stage 0 (zero compute, done) -- the (A) gap/ratio table with n=31 arms CORRECTED to primitive primes, and the (C) ord_17(4)=4 lattice census.
      - Stage 1 (minutes) -- construct the composite arm E/F_{4^17} and the corrected primitive-prime null arm; verify point counts and prime-subgroup orders.
      - Stage 2 (hours) -- build the Weil-descent PDP on the composite arm's richest stable subspace; certify UNSAT on >=3 targets; run WDSat; compute the conflict ratio against 2^{ml}/m!.
      - Stage 3 -- within-curve non-stable control (size-matched random F_4-subspace) + a d=1 cross-check reusing b9f0c5's own n result.
      - Stage 4 (minutes) -- confirm the null arm's stable-subspace lattice is trivial by factoring x^n-1 over F_2 (must give f=2 for a primitive prime; would give f=7 for n=31, which is why n=31 is disqualified).
    metrics:
      - name: wdsat_conflict_ratio_composite_arm
        unit: dimensionless
        definition: WDSat conflicts on certified-UNSAT PDPs / 2^{ml}/m!; b9f0c5's thresholds (within 1% of 1 = basis-blind; <=0.5 = material pruning)
      - name: within_curve_non_stable_control_ratio
        unit: dimensionless
        definition: same measurement on a size-matched non-stable F_4-subspace; must sit near 1 (or clearly above the stable arm) to credit stability
      - name: null_arm_stable_subspace_count
        unit: integer (f)
        definition: number of irreducible factors of x^n-1 over F_2; must be 2 for a valid primitive-prime null (n=37), NOT 7 (n=31)
    controls:
      - 'WITHIN-CURVE NON-STABLE (reused from 6cf862 Part 2): separates stability from incidental curve arithmetic.'
      - 'd=1 CROSS-CHECK (reused from b9f0c5): the d>1 instrument must agree with the filed d=1 result.'
      - 'ICPERF/Trimoska WDSat UNSAT regression within 2x conflicts (reused from b9f0c5).'
      - 'STRUCTURAL NULL ARM: a PRIMITIVE prime (ord_n(2)=n-1), verified f=2 -- the corrected precondition-absent null.'
    outcomes:
      positive: composite-arm stable ratio <=0.5 on every UNSAT replicate AND the within-curve non-stable control near 1 -- first evidence Frobenius stability reaches the solving step; the primitive-prime null certifies the effect is about stability, not field size.
      negative: composite-arm ratio within 1% of 1 (basis-blind) -- confirms, with two controls, that even the densest reachable toy stable lattice buys nothing at the search step, strengthening the lane's negative reading.
      artifact: the within-curve non-stable control ALSO drops to <=0.5 -- the effect is not specific to stability; OR a null arm chosen as n=31 reports f=7 -- mis-specified null, not a result.
    falsification_threshold: >-
      A prime n exhibited with a nontrivial stable subspace where the record assumed
      none (n=31 already shown to have f=7) falsifies the null-arm reasoning; a
      material stable-arm pruning (<=0.5) that the within-curve non-stable control
      also shows falsifies the stability attribution.
    estimated_cost:
      implementation: low
      compute: low (toy 28-38 bit fields, WDSat toy instances; ESTIMATE hours; F_4 arithmetic is the only new layer)
    zero_run_prerequisites:
      - Re-select all null arms to primitive primes (ord_n(2)=n-1); recompute ratio errors.
      - IDEA-20260920-b9f0c5's d=1 result exists under GOAL-FROB-6333a9 (the hold's revisit condition).
  successor_seam: >-
    The corrected observation itself seeds a proposal: the RIGHT null for "does
    subfield/Frobenius structure help relation collection" is not "prime degree" but
    "ord_n(2) = n-1" (primitive prime, x^n-1 with two factors, no nontrivial stable
    subspace) versus a matched non-primitive prime (e.g. n=31, ord 5, rich lattice)
    at the SAME degree and field size. That pair varies stable-subspace richness
    while holding degree and prime-ness fixed -- a cleaner discriminator than the
    composite-vs-prime contrast, and one that isolates exactly the lattice-richness
    variable, with ECC2K-130 (n=131, primitive) sitting on the "no useful lattice"
    end as the deployed reference.
  records_read:
    - IDEA-20260922-9e5383 (full)
    - ranking-context-DEC-20260924-99ce20.yaml (HOLD-N)
