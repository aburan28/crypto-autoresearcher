review:
  idea_id: IDEA-20260922-f37254
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-5d1a51
  ranking_context:
    rank: 19
    disposition: consolidated_into_cdca3a
    hold_id: HOLD-I
  claim_restated: >-
    The reduction polynomial is an R1 representation axis, not background. NIST's
    FIPS 186-4 split -- trinomial at m=233,409, pentanomial at m=163,283,571, each
    K/B pair sharing the field's polynomial -- is a basis axis this lane has never
    tested, orthogonal to the (a,b) curve-coefficient axis. Two models of F_{2^n}
    defined by different irreducible polynomials are related by an F_2-algebra
    isomorphism phi, so the abstract decomposition ideal (and DLP hardness) is
    provably invariant; but the pipeline-MEASURED cost (WDSat conflict count,
    Macaulay first-fall degree under a fixed order) depends on how generators are
    written and is not guaranteed invariant. The record proposes a toy invariance
    audit at prime n<=41 with a matched trinomial/pentanomial pair, transporting
    one curve through phi and measuring both quantities with and without a fixed
    canonical variable order, to certify the axis inert (I1) or locate a real
    basis dependence (I2).
  core_argument_check:
    - step: 'R2: field isomorphism phi preserves the ideal, so DLP hardness is basis-invariant'
      verdict: holds
      note: phi is an F_2-algebra isomorphism; ideals transport with identical Hilbert function. Rigorous. The record makes no hardness claim.
    - step: 'measured solving degree is not an ideal invariant (IDEA-20260830-ad0be4)'
      verdict: holds
      note: >-
        Cited correctly; the well-known monomial-order sensitivity of Groebner cost
        is the mechanistically adjacent precedent. The open question -- whether the
        DEFINING polynomial (not the monomial order) moves measured cost -- is
        genuinely untested (grep found zero prior "trinomial"/"pentanomial" hits in
        ledger/proposals; I did not independently re-run that grep).
    - step: 'FIPS field polynomials as decoded'
      verdict: holds
      note: >-
        Independently confirmed x^163+x^7+x^6+x^3+1 irreducible over F_2, x^233+x^74+1
        irreducible, and NO irreducible trinomial x^163+x^k+1 exists (scanned k=1..162).
        So the record's R1 fact and NIST's Swan-theorem rationale (recalled by the
        record) both check out -- the latter can now be marked verified, not recalled.
    - step: 'confound: variable ordering induced by the basis (RQ-SEMBIN-9fa4ba 2.4x)'
      verdict: holds
      note: The fixed-canonical-order control separates sparsity from ordering; three named preimages (algebra, ordering, phi bug) each get a check. Well constructed.
  verdict: sound
  defects:
    - what: heavy overlap with 9d12bd (same trinomial-vs-pentanomial axis) and with 8ac1ea/99294c basis handling
      where: overlap_review
      fix: >-
        HOLD-I already merges f37254/9d12bd/99294c into one cdca3a design with a
        basis-general descent generator; f37254 supplies the phi-transport and the
        no-trinomial nearby-object control, 9d12bd the c_leaf-axis-purity framing.
        Keep as one merged design, not three.
    - what: requires a descent generator accepting an arbitrary F_2-basis
      where: assumptions (vendored Weil_descent.sage monomial-basis restriction)
      fix: >-
        This is the same implementation gap 8ac1ea/8fe0ef/3119c9 name; it is the
        shared build cost of the HOLD-I/J generator, not a research assumption.
    - what: best case is a scope-limiting audit, not an exponent
      where: recommended_priority (medium), sota_delta
      fix: none; the record is honest that it moves no exponent and rho dominates every cell.
  ecc2k130_bearing: >-
    Indirect and constant-factor only. ECC2K-130's field F_{2^131} is defined by a
    pentanomial (z^131+z^13+z^2+z+1); if the basis axis is NOT inert (I2), the
    pipeline-measured decomposition cost on ECC2K-130 carries an undisclosed basis
    dependence, but it is a constant factor by R2 -- it cannot move the total degree
    or any exponent, so matched rho's 2^60.8 dominance is untouched at any outcome.
    No arity m is implied; this is a per-equation/per-node representation audit, not
    a decomposition-oracle mechanism, so it does not engage the product-law floor.
    What transfers to ECC2K-130: at most a basis-disclosure caveat on every filed
    conflict-count / first-fall-degree law that touches n=131, and a warning that
    such laws are only comparable across records if they state their basis.
  agreement_with_hold: agrees
  agreement_note: >-
    Agree with design_after / merge into cdca3a (HOLD-I). It is a cheap, well-posed
    coordinate-dependent audit whose Step 0 (matched-pair enumeration + squaring-
    matrix Hamming weight) is zero-solver arithmetic and either closes the axis with
    a certificate or names which filed laws need a basis disclosure. The prime-degree
    toy pairs are the right scope; m=15 was correctly dropped.
  concrete_experiment:
    cell:
      curve: >-
        The Trimoska n=17 fixture (a=b=1, #E=131174) transported through phi, and
        the CERTBIN RC-1 cell (n=17, m=2, l=9, A=97044, B=126251) as a second base;
        both re-expressed in a trinomial and a pentanomial basis of F_{2^17}.
      m: 2
      l: 9
      factor_base: 'the deg<9 polynomial-basis V of RC-1, transported through phi to the second basis'
      targets: 'x(2E) subgroup targets of RC-1; >=20 per basis, matched via phi'
      seeds: 'identity control uses different seeds, same basis; cross-basis uses phi-transported instances'
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/macaulay.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - 'new pure-Python: field-isomorphism phi builder (common root of f in splitting field of g) + basis-general descent generator'
      - 'missing: WDSat (for the conflict-count metric M4); the Macaulay first-fall-degree metric is available in macaulay.py, so a WDSat-free version of the experiment can still run'
    procedure:
      - 'Step 0 (zero solver): for n in {17,19,23,29,31,37,41} enumerate irreducible trinomials x^n+x^k+1 and a sparsest available pentanomial; record which n admit a matched pair (already partly confirmed: 163 has none, mirroring the deployed case).'
      - Step 0b -- compute the squaring-matrix Hamming weight in each basis (pure arithmetic; predicted strictly lower for the trinomial).
      - Step 1 -- construct phi and verify phi(x)*phi(y)==phi(x*y) on >=100 random pairs; verify curve invariants (#E, cofactor) transport.
      - Step 2 -- compute the Macaulay first-fall degree in each basis (macaulay.py) on matched instances; if WDSat becomes available, add conflict counts.
      - Step 3 -- repeat with a fixed canonical variable order to separate sparsity from ordering; Step 4 -- an n with no trinomial (nearby-object control).
    metrics:
      - name: squaring_matrix_hamming_weight
        unit: nonzero entries
        definition: terms needed to express x->x^2 in each basis; predicted lower for trinomial
      - name: macaulay_first_fall_degree
        unit: integer degree
        definition: first degree at which the Macaulay matrix rank falls short; predicted identical across bases under I1
      - name: phi_self_check_pass_rate
        unit: fraction
        definition: fraction of random pairs with phi(x)*phi(y)==phi(x*y); must be 1.0
    controls:
      - 'IDENTITY: same basis, same instance, different seed -- the noise floor.'
      - 'FIXED-ORDER: identical canonical variable numbering across bases, separating sparsity from ordering.'
      - 'NEARBY OBJECT: an n with no irreducible trinomial -> pentanomial-vs-denser comparison (tests term-count continuity).'
      - 'ARITHMETIC SELF-CHECK: phi(x)*phi(y)==phi(x*y) before any solver run is trusted.'
      - 'REPRODUCTION: n=17 curve invariants reproduced in both bases via phi.'
    outcomes:
      positive: first-fall degree (and conflict count if WDSat present) identical within noise across bases at every n -- axis CERTIFIED INERT for this pipeline; a cheap reusable closure.
      negative: the quantity differs beyond noise AND survives the fixed-order control -- a genuine algebra-level sparsity effect; every filed first-fall-degree/conflict-count law in the lane needs its basis stated.
      artifact: the difference disappears under the fixed-order control -- it was a variable-ordering artifact, a partial resolution of RQ-SEMBIN-9fa4ba's 2.4x confound.
    falsification_threshold: >-
      A first-fall-degree difference surviving the fixed-order control at more than
      one tested n falsifies inertness (I1) and establishes I2; phi failing its
      self-check invalidates the instrument (bug, not finding).
    estimated_cost:
      implementation: medium
      compute: low (Step 0 zero-solver; Macaulay ranks at n<=41 within pure-Python budget; ESTIMATE minutes-hours)
    zero_run_prerequisites:
      - Step 0 matched-pair enumeration (which n admit both a trinomial and a pentanomial).
      - phi builder and its arithmetic self-check.
      - basis-general descent generator (shared HOLD-I/J build).
  successor_seam: >-
    If I2 holds (basis genuinely moves measured cost), a follow-on proposal should
    make sparsity a continuous variable rather than a trinomial-vs-pentanomial
    dichotomy: measure first-fall degree and conflict count against reduction-
    polynomial Hamming weight (3,5,7,... terms) at fixed n, isolating whether the
    effect tracks term count monotonically or has a threshold. That record would
    also carry the basis-disclosure amendment for every filed law in the lane
    (0d8e90's c, Semaev Table 3, Nagao Theorem 1 as costed by 41c4f0), turning the
    audit finding into an actionable schema change.
