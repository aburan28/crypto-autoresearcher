review:
  idea_id: IDEA-20260922-e3048d
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-843cf5
  ranking_context:
    rank: 28
    disposition: return_for_revision
    hold_id: HOLD-O
  claim_restated: >-
    (A) ECC2K-130's group is S x C with |S| = 4, |C| = l prime, gcd(4, l) = 1;
    every endomorphism preserves S and C and every subgroup splits, so the
    record concludes that the only full-translation-compatible lossy quotient
    of E(F_2^131) carrying information about a target in C is the projection
    onto C that rho already performs -- "spending the cofactor" via a group
    quotient is closed. (B) What remains is an engineering question: do this
    program's decomposition builders draw factor-base and target x-coordinates
    from all four cofactor cosets or silently from one, a <= 4x (likely <= 2x)
    candidate-pool constant decided by a code read (H_spent versus H_unspent),
    toy-tested against a cofactor-1 null curve.
  core_argument_check:
    - step: gcd(4, l) = 1; G = S x C; endomorphisms preserve S and C; subgroups split as (H cap S) x (H cap C)
      verdict: holds
      note: >-
        Standard and re-checked. l = 680564733841876926932320129493409985129 is
        prime (Miller-Rabin this session) and 4l = #E(F_2^131) reproduces from
        the Frobenius-trace recurrence for y^2 + xy = x^3 + 1. Z/12 sanity
        check -- subgroups of orders {1,2,4} x {1,3}, all products, as the record
        predicts.
    - step: S has only 4 elements, so its only quotients are trivial or all of S
      verdict: defective
      note: >-
        False. The 2-Sylow is cyclic (b != 0 gives one rational 2-torsion point,
        so E[2](F_q) = Z/2), S = Z/4, and Z/4 has the quotient Z/4 -> Z/2. The
        block systems of E under full translation are the coset partitions of
        its subgroups; those trivial on C but nontrivial on E are E/2E (Z/2,
        the map pi = Tr(x) + Tr(a) of cedd2f) and E/4E = E/C (Z/4). Both are
        lossy and full-translation-compatible, both are identically 0 on
        C-targets, and the first is a measured yield lever on LEGS (cedd2f).
        HOLD-O's correction is confirmed -- the certificate must enumerate the
        chain, and the closure as written closes the wrong reading.
    - step: therefore nothing on the quotient side is left but the rho reduction to C
      verdict: defective
      note: >-
        Follows from the defective step. The correct statement is that the
        quotients E/2E and E/4E carry no information about a C-target's
        discrete log (true) but do classify legs drawn from E, which is where
        the lever sits; the record's own part (B) circles this without naming
        it.
    - step: (B) restricting candidates to one cofactor coset loses up to 4x (2x after negation) of the raw pool for free
      verdict: sound_with_corrections
      note: >-
        Re-derived. With x-coordinates, the cosets of C pair under negation
        into three classes -- class 0 (in C), class 2, and {1, 3} -- with
        fractions 1/4, 1/4, 1/2 of x-values; restricting legs to C keeps 1/4 of
        the x's. But by yield conservation (KN-FIND-007 as cited in
        KN-FIND-aa2efc) this is ordinary factor-base SIZE, not a structural
        gain -- unrestricted legs give 4^{m-1} more decompositions per C-target
        at 4x the unknowns, which is the standard base-size trade. The record's
        constant-factor bound is right; the mechanism label ("cofactor spent")
        is wrong. At the specification level RC-1's V = {deg < 9} is all x with
        deg < 9, no coset restriction, so RC-1 is H_spent at the contract level
        (builder code not read).
    - step: cofactor-1 null curve of the same field size where the ratio must be exactly 1
      verdict: defective
      note: >-
        No ordinary binary curve y^2 + xy = x^3 + a x^2 + b has odd order; the
        rational 2-torsion point (0, sqrt b) always exists, so h = 1 is
        impossible in this family. The nearest null is h = 2 (Tr(a) = 1 rows,
        e.g. the n = 19 CERTBIN cell A = 46693 with Tr(A) = 1 computed this
        session, or Koblitz a = 1 at n = 19 with #E = 2 * 262543 prime), where
        the Z/4 quotient does not exist but pi does. A relabelled Z/NZ generic
        group is the right structure control (see concrete_experiment).
    - step: Semaev S_{m+1} vanishes iff the points sum to O in the full group (up to signs)
      verdict: holds
      note: standard; a relation found among arbitrary legs projects to a C-relation after the S-component is checked to vanish, which the class-sum condition expresses.
    - step: RQ-FROB boundary and F6 declaration
      verdict: holds
      note: prime extension degree; no subfield descent involved.
  verdict: defective
  defects:
    - what: the closure (A) rests on the false step "the quotients of S are trivial or all of S"
      where: claim (A), mechanism (TRICHOTOMY, LOSSY-PROJECTION TEST part A), method_ceiling
      fix: >-
        Replace by the chain enumeration E > 2E > 4E = C with quotients Z/2
        and Z/4, state that both are trivial on C-targets and nontrivial on
        legs, and re-scope the closure to "no quotient carries target
        information" -- which is already IDEA-20260806-c5d183 / Theorem C on the
        prime-order subgroup and adds nothing new.
    - what: part (B) is factor-base size, not a cofactor lever
      where: claim (B), constructive_transforms.predicted_gain, sota_delta
      fix: >-
        State the yield-conservation pricing (per-C-target yield 4^{m-1}x at
        4x unknowns) and drop the "free" framing; the code read is still worth
        one line in the CERTBIN spec review but is not a research result.
    - what: the h = 1 null curve does not exist in this curve family
      where: minimal_test STAGE 2, controls, predictions (last metric), nearby_object_control
      fix: use an h = 2 curve as the "no Z/4" control and a relabelled Z/(4l) generic group as the structure control.
    - what: the live lever on legs is missed
      where: whole record
      fix: >-
        Merge into 1b16d7/153a90 (DC-04) -- the leg-side quotient chain with the
        pricing derived in those reviews (parity free, one bit at every m;
        E/4E bit non-linear in x, 2^{1-m} by rejection).
    - what: no arity m or oracle budget stated
      where: target_complexity
      fix: state that no floor row moves (see ecc2k130_bearing).
  ecc2k130_bearing: >-
    "Spend the cofactor on decomposition" buys, on ECC2K-130, exactly the
    leg-side quotient chain -- parity alignment (one bit at every m, free,
    linear in x since a = 0 makes G = {Tr(x) = 0}) and nothing more, because
    the E/4E bit is not linear in x and costs 2^{1-m} to buy by rejection. No
    arity changes; m <= 3 stays closed against the reproduced matched rho
    2^60.809 (free-oracle floor 2^68.58 in the finding, 2^66.79 in my
    standard-balance re-derivation; constants of the finding unchecked); at
    m = 4 the one bit is inside the 2^4.4 to 2^6.6 per-attempt oracle budget.
    Part (A) as corrected is a restatement of Theorem C on the prime-order
    subgroup and prices nothing.
  agreement_with_hold: agrees
  agreement_note: >-
    HOLD-O is confirmed and is the whole story -- Z/4 -> Z/2 exists, the
    2-Sylow is cyclic, the certificate must enumerate the chain. Beyond the
    hold, the h = 1 null is impossible in the family and part (B) is base size.
    A rankable revision is a short chain certificate merged into the DC-04
    cluster; on its own the record has no residual content that 1b16d7 and
    153a90 do not carry.
  concrete_experiment:
    cell:
      curve: >-
        Koblitz y^2 + xy = x^3 + 1 over F_2[t]/(t^19 + t^5 + t^2 + t + 1),
        #E = 4 * 130873 (l prime, computed) -- ECC2K-130's 4l shape at prime n;
        plus RC-1 (n = 17, A = 97044, B = 126251, #E = 4 * 32603, ordinary,
        Tr(A) = 0) as the non-Koblitz h = 4 sibling; plus the h = 2 control
        (Koblitz a = 1 at n = 19, #E = 2 * 262543).
      m: 3
      l: 10
      factor_base: >-
        V = {deg < 10} (all cosets), V_C = {x in V whose points lie in C}
        (coset-restricted, about |V|/4 points), V'_0 = {deg < 10, c_0 = 0}
        (parity-aligned); random 9-dimensional subspace as size-matched null.
      targets: 40 random points of C; 20 of class 2 as mirror controls
      seeds: fixed recorded integer seed for target and subspace draws; census exhaustive
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py and curve.py (scalar arithmetic; group law; mul for the C-membership test [l]P = O)
      - 'missing: numpy (imported at top level by both modules; absent in this container)'
      - new script -- coset classification of window points, m = 2 and m = 3 census, relabelled Z/(4l) replica
    procedure:
      - Classify every window point by its coset of C (via [l]P and [2l]P) and by pi; tabulate the 1/4, 1/4, 1/2 x-class fractions.
      - Census decompositions of the 40 C-targets at m = 2 and m = 3 by V, V_C, V'_0 and the random subspace; record the class-sum of each counted decomposition (must be 0 in Z/4).
      - Compute per-target yield ratios V over V_C per m (prediction 4^{m-1}, the base-size law) and V'_0 over random (prediction 2, the parity bit).
      - Replicate steps 1-3 in Z/(4l) with residue classes as cosets and random subsets of matched sizes; ratios must coincide.
      - h = 2 control -- classes reduce to Z/2; the Z/4 bookkeeping must report "undefined", and the parity ratio must still read 2.
    metrics:
      - name: coset_fractions_of_window_x_values
        unit: fraction
        definition: share of window x-values whose points lie in class 0, class 2, classes {1,3}
      - name: yield_ratio_unrestricted_over_C_restricted
        unit: dimensionless per m
        definition: mean decompositions per C-target with V divided by with V_C; predicted 4^{m-1}
      - name: class_sum_violations
        unit: count
        definition: counted decompositions with nonzero Z/4 class-sum; must be 0
      - name: curve_over_generic_ratio
        unit: dimensionless
        definition: each ratio above divided by its Z/(4l) replica value
    controls:
      - relabelled Z/(4l) generic group (blocking for the group-structure claim)
      - h = 2 sibling (Z/4 quotient absent)
      - random subspace of matched size (null window)
      - class-2 mirror targets (V_C must give zero for them at every m)
    outcomes:
      positive: >-
        ratios 4^{m-1} and 2 reproduced on curve and replica, zero violations --
        part (B) is base size and part (A)'s corrected chain is confirmed; the
        record collapses into DC-04.
      negative: >-
        a curve-only deviation of the V/V_C ratio from 4^{m-1} by more than a
        factor 2 absent on the replica -- a coset-dependent concentration the
        group theory does not predict; report and replicate.
      artifact: >-
        replica deviates identically -- window-size arithmetic; or violations
        appear -- the coset classifier is wrong ([l]P bookkeeping), nothing is
        read.
    falsification_threshold: >-
      one class-sum violation, or V/V_C outside [0.5, 2] x 4^{m-1} on the
      curve while inside on the replica.
    estimated_cost:
      implementation: low
      compute: 'ESTIMATE -- about 2e7 pure-Python field operations for the m = 3 censuses plus the replica; minutes.'
    zero_run_prerequisites:
      - the chain certificate (E > 2E > 4E = C, quotients Z/2 and Z/4) written and hand-checked on Z/12 and on the n = 19 cell's order
      - the h = 1 null replaced in the record by the h = 2 and generic controls
