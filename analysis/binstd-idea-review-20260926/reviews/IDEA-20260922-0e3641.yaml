review:
  idea_id: IDEA-20260922-0e3641
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-5d1a51
  ranking_context:
    rank: 17
    disposition: consolidated_into_d11575
    hold_id: HOLD-H
  claim_restated: >-
    A structural companion to d11575. (A) derives the general GHS conjugate-period
    formula n(c) = d/gcd(c,d) for any divisor c of N = dk (d=16), from the order of
    the Frobenius automorphism fixing the subfield coefficients, and checks it
    reproduces d11575's two k-prime special cases exactly. (B) counts the GHS
    candidate base fields: tau(N) = tau(16)*tau(k) = 10 for k prime, and proves
    this is the MINIMUM over all curves of the shape N = 16k' (k'>1), any composite
    k' giving at least 15. (C) observes that a composite k' would afford extra
    divisors realising the same period at a strictly smaller base field, but leaves
    OPEN whether that is exploitable, because shrinking q at fixed genus raises the
    regime ratio g/log2(q) and pushes the construction out of the cheap small-genus
    regime -- a genuinely new candidate lane whose net cost is not resolved here.
  core_argument_check:
    - step: 'period formula n(c) = d/gcd(c,d), d=16'
      verdict: holds
      note: >-
        Re-derived: sigma_c^i fixes E iff d | c*i, least i = d/gcd(c,d). Checked
        c=2 -> 8; c=jk (gcd(k,16)=1) e.g. c=22 -> gcd(22,16)=2 -> n=8. Reproduces
        d11575's "16/c" (c|16) and "16/(c/k)" (c=jk) exactly.
    - step: 'tau(N) = tau(16)*tau(k) minimised at k prime'
      verdict: holds
      note: >-
        Verified: tau(16)=5; tau(176)=10, tau(144=16*9)=15, tau(240=16*15)=20,
        tau(336=16*21)=20. tau(k')>=2 with equality iff k' prime, so tau(16k') is
        minimised at 10 exactly when k' is prime. Exact number-theoretic fact.
    - step: '(C) genus depends only on period (imported from d11575 C2)'
      verdict: unchecked
      note: >-
        H-0e3641-1 imports d11575's C2 and extends it to divisors coprime to both
        d and k -- a case d11575 never needed. Not independently verified; inherits
        d11575's own open re-derivation obligation. The record flags this honestly.
    - step: '(C) net cost of the extra composite-k'' cells'
      verdict: holds
      note: >-
        Explicitly left OPEN (predictions carry direction: unknown). This is honest
        accounting, not a defect -- the record declines to resolve what it cannot.
  verdict: sound
  defects:
    - what: primary content (A,B) is proven arithmetic but has little independent research value
      where: recommended_priority (medium)
      fix: >-
        None required. The record is correctly a control/context piece. Its (C)
        open question is the only forward content and depends on d11575's C2.
    - what: inherits d11575's unverified C2 for its one heuristic
      where: heuristic_assumptions H-0e3641-1
      fix: fold into d11575's design as its "why the divisor lattice is minimal" section, as the hold directs.
  ecc2k130_bearing: >-
    None. The construction is vacuous for prime-degree curves: applying (B) at d=1
    gives tau(N)=tau(k) and the period formula evaporates (the record's own
    proves-too-much control). ECC2K-130 (n=131 prime, no subfield) is exactly that
    d=1 / prime-degree case, so 0e3641 says only that ECC2K-130 has no GHS divisor
    lattice at all -- consistent with the GHS-empty certificate. No arity m is
    implied and the product-law floor is not engaged; nothing bears on the 2^60.8
    matched rho for ECC2K-130.
  agreement_with_hold: agrees
  agreement_note: >-
    Agree it consolidates into d11575 under HOLD-H. It is a strict generalisation
    of d11575's period enumeration plus a divisor-count context fact; it should be
    a section of d11575's eventual design, not a separate experiment. Its (A)/(B)
    are exact and cheap; its (C) is honestly open and rides on d11575's unresolved C2.
  concrete_experiment:
    cell:
      curve: >-
        Toy composite-k' subfield curve E/F_{2^4} over F_{2^{4*9}} = F_{2^36}
        (d=4, k'=9, dk'=36 <= 41), mirroring the deployed 16k shape at quarter
        scale, with the divisors c=3 and c=9 of N=36 (both gcd(*,4)=1, both period
        n=4) realising the same period at q=2^3=8 vs q=2^9=512.
      m: 2
      l: 10
      factor_base: 'degree-one places of the GHS cover over F_{2^c}, c in {3,9}'
      targets: 'a point of prime order l'' outside the subfield part; enumerate the small subgroup'
      seeds: enumerated (exhaustive at toy scale)
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - 'shares d11575''s Artin-Schreier level routine and cover builder'
      - 'missing: Sage OR a pure-Python GHS cover constructor'
    procedure:
      - Enumerate all divisors of N=36, compute n(c)=d/gcd(c,d) for each; verify c=3 and c=9 both give period 4 (the composite-k' extra pair k-prime forbids).
      - Compute the Artin-Schreier level m (hence genus) for the c=3 and c=9 cells by d11575's Phase-1 method; check they AGREE exactly (tests the imported C2 transfer).
      - Charge time and memory for both cells under the same small/large-genus regime split; report which, if either, beats matched rho at toy scale -- the first data point on (C).
    metrics:
      - name: period_agreement
        unit: boolean
        definition: n(3) == n(9) == 4 as predicted by (A)
      - name: genus_agreement_across_divisors_sharing_period
        unit: integer (Artin-Schreier level)
        definition: m computed at c=3 and c=9 must be equal if C2 transfers
      - name: charged_cost_ratio_smaller_q_over_larger_q
        unit: bits
        definition: time and memory of the c=3 (q=8) cell vs the c=9 (q=512) cell
    controls:
      - 'k-prime toy analogue at d=4, k''=7 (dk''=28): only the two k-prime families, the direct baseline.'
      - 'prime-degree null (d=1): construction vacuous, confirms proves-too-much control.'
    outcomes:
      positive: c=3 and c=9 agree in period and genus, and the smaller-q cell's cost differs measurably -- the composite-k' extra lane is real and its cost is now data-backed.
      negative: genus disagrees across the two divisors sharing a period -- d11575's C2 does not transfer to non-k-related divisors and (C) must be restated as unverified.
      artifact: period agreement fails due to an accidental shared factor of 2 in the toy field -- cell mis-specified, not a finding.
    falsification_threshold: >-
      Genus computed at c=3 and c=9 disagreeing on the toy cell falsifies the
      imported C2 transfer; a period disagreement with d/gcd(c,d) falsifies (A).
    estimated_cost:
      implementation: low
      compute: low (reuses d11575 machinery at quarter scale; ESTIMATE seconds to minutes)
    zero_run_prerequisites:
      - d11575's cover builder and Artin-Schreier level routine exist.
      - d11575's C2 re-derivation obligation is discharged (else this record's (C) inherits it).
  successor_seam: >-
    none (subsumed by d11575; its one forward question -- whether the composite-k'
    smaller-base-field cells are ever exploitable -- is better carried as an
    open-directions note inside d11575's design than as an independent proposal).
