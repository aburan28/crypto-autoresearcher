review:
  idea_id: IDEA-20260922-818b73
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-002d0e
  ranking_context:
    rank: 14
    disposition: consolidated_into_6028ed
    hold_id: HOLD-F
  claim_restated: >-
    Define, per (curve, arity, factor-base parameters) cell, the exchange rate
    gamma*(cell) = 2^(R - F(cell)) with R = 60.9 the ECC2K-130 matched rho and
    F the line's own idealised cost floor in bits: the factor by which the
    measured per-attempt solver cost may exceed its own floor before the cell
    cannot tie rho even in principle. Worked at the QSP cell (n' = 33, m = 4):
    gamma* = 2^0.3 = 1.23 against the resultant floor 60.6, and 2^-72.1 against
    the "every constant kept" 133-bit figure, so the cell is unmet by 50-72
    bits before any solver runs. Proposed as a standard column of the
    reachability table, with a first live application once IDEA-20260916-b84e2d
    executes.
  core_argument_check:
    - step: '2^(60.9 - 60.6) = 1.231 and 2^(60.9 - 133) = 2^-72.1'
      verdict: holds
      note: Arithmetic checks.
    - step: 'the 60.6-bit resultant floor and the 133-bit "every constant kept" figure are two cost models of the IDENTICAL cell (n'' = 33, m = 4)'
      verdict: defective
      note: >-
        RQ-QSP-f9bbdb motivation item (5), read this session: "the paper's own
        cost formula with every constant kept bottoms out at 2^133 (n' = 66,
        m = 2, linear-algebra bound) and its resultant-model floor at 2^68
        (n' = 33, m = 4); with Frobenius-orbit reduction on the Koblitz curve
        that floor is 2^60.6". The 133 is a different cell (n' = 66, m = 2). The
        72-bit gap is cross-cell and is not a statement about (n' = 33, m = 4).
        The same-cell obstruction is IDEA-20260916-3f7a1c's attempts column at
        (n' = 33): >= 110 bits at d = 3 and >= 90.6 at d = 7 from |F| <= 2401,
        i.e. 49.1 or 29.7 bits above rho -- so "50" is defensible same-cell,
        "72" is not.
    - step: 'gamma* is well defined whenever the floor is in the same unit as rho'
      verdict: holds
      note: >-
        The condition is the whole difficulty (HOLD-F's unit caveat): 60.9 is in
        rho ITERATIONS (one group operation plus the class canonicalisation and
        DP test), the resultant floor is in field or polynomial operations. Until
        an exchange rate in field multiplications per rho iteration is fixed on
        one host, gamma* differs from the true ratio by that unknown constant.
    - step: '"no prior record in this program''s corpus computes a rho-tying exchange rate"'
      verdict: defective
      note: >-
        KN-FIND-aa2efc (added 2026-09-17, five days before this record) and
        EV-ICPERF-10c5fc carry, for the ECC2K-130 decomposition family at every
        arity, "oracle budget per attempt to tie rho": 2^-(70.19 + log2 m)
        required speedup and the per-m free-oracle floor; the budget 2^(60.81 -
        floor) is gamma* at family level. Re-derived here: the floor is exactly
        min over l of m! 2^(131-(m-1)l) + m 2^(2l) (89.25, 68.58, 56.40, 48.44,
        42.85, 35.61 at m = 2, 3, 4, 5, 6, 8), so the budgets are none at
        m <= 3 and 2^4.41, 2^12.37, 2^17.96, 2^25.2 at m = 4, 5, 6, 8. The record
        does not cite aa2efc and its dominated_by is wrong on this point.
    - step: 'the only proposed live application depends on IDEA-20260916-b84e2d executing'
      verdict: holds
      note: b84e2d is status proposed; nothing measured.
    - step: 'a shrinking gamma* because F grows is not progress (control)'
      verdict: holds
      note: Correct and worth keeping in the column definition.
  verdict: dominated
  defects:
    - what: 'The worked example conflates two QSP cells; the 72-bit figure is cross-cell'
      where: claim ZERO-COMPUTE WORKED EXAMPLE; predictions 1; falsification 1; method_ceiling
      fix: 'Restate same-cell: at (n'' = 33, m = 4) the resultant floor is 60.6 (68 without the orbit reduction) and the certified attempts column is >= 110 bits (3f7a1c, d = 3), a >= 49-bit gap; cite the 133-bit LA bound as the (n'' = 66, m = 2) cell.'
    - what: 'dominated_by omits KN-FIND-aa2efc / EV-ICPERF-10c5fc, whose per-m oracle budget IS the exchange rate for the ECC2K-130 decomposition family'
      where: dominated_by; overlap_review; citations
      fix: 'Cite both; define the column as budget_bits = R - floor_bits(m) with the floor formula and N stated, and gamma_meas as measured oracle cost per attempt in the same unit.'
    - what: 'Units: rho iterations against model-specific operation counts'
      where: claim; proof_obligations 2; confounders 2
      fix: 'Add a unit field and an exchange-rate row (field multiplications per rho iteration on the same host, or a declared model) before any gamma* is quoted as a number.'
    - what: 'R = 60.9 is KN-LIT-096''s rounded figure; the corpus carries 60.8090 (KN-FIND-aa2efc) under the stated convention'
      where: claim; predictions 1
      fix: Use 60.81 with the convention sqrt(pi*l/(4*131)) and cite KN-LIT-661e97.
  ecc2k130_bearing: >-
    The record's content on ECC2K-130 is the QSP cell, an m = 4 line. Same-cell:
    the resultant floor 60.6 sits 0.2 bit under rho, but the certified base size
    |F| <= 2401 makes the attempts column >= 90.6-110 bits, so the binding
    quantity is not an oracle exchange rate at all -- it is relations x targets
    with B = 2401, and no oracle price can move it. Family-level: gamma* at
    m = 4 is 2^4.41 (2^15.66 in the orbit-aware floor variant computed for this
    lane), which is the number any m = 4 oracle on ECC2K-130 must meet per
    attempt in group-operation equivalents; the only oracle measured so far
    (Riemann-Roch, m = 3, 2.02x brute-force pair enumeration) is at an arity
    whose budget is negative.
  agreement_with_hold: agrees
  agreement_note: >-
    Carrying gamma* as a column of 6028ed's table under a unit caveat is right.
    The column must be defined per (cell, m, unit) from the product-law floor and
    must cite KN-FIND-aa2efc as its origin; the record's own worked example must
    be restated same-cell before it is transcribed, or the table would inherit a
    cross-cell number.
  concrete_experiment:
    cell:
      curve: 'RC-1: n = 17, F_2[t]/(t^17+t^3+1), A = 97044, B = 126251, x(2E) subgroup targets, m = 2, l = 9, V = {deg < 9} polynomial basis (DEC-20260926-cb4487); ECC2K-130 as the arithmetic row.'
      m: 2
      l: 9
      factor_base: 'V = {deg < 9}, 512 x-values'
      targets: 'the 144 archived x(2E) targets of RC-1 (frozen) for the oracle cost; the toy floor uses N = the RC-1 subgroup order'
      seeds: 'RC-1''s frozen seeds (seed 2026092430099 for the self-test) -- no new instances'
    instrument:
      - 'experiments/EXP-CERTBIN-e94b27/impl/closure.py (W_4 closure, operation logs) and curve.py (add/double): missing: numpy in this container'
      - 'a same-unit counter: field multiplications in gf2n.TableField, instrumented on both the group operation and the W_4 refutation'
    procedure:
      - '1. Zero compute: tabulate budget_bits(m) = 60.81 - floor_bits(m) for ECC2K-130 with the floor formula and N = 2^131, and the same for RC-1 with N = the subgroup order (toy gamma*).'
      - '2. On the RC-1 cell count field multiplications for one group addition and for one W_4 refutation on identical instance bytes (the archived certificates); report the exchange rate mults per group op and the oracle cost per attempt in group-op equivalents.'
      - '3. gamma_meas(RC-1) = oracle cost per attempt / toy floor per attempt, in one unit; compare with gamma*(RC-1).'
      - '4. Report both as a distribution over the 144 targets, not a point.'
    metrics:
      - name: budget_bits
        unit: log2 group-operation equivalents
        definition: R - floor_bits(m), floor = min over l of m! 2^(N-(m-1)l) + m 2^(2l)
      - name: mults_per_group_op
        unit: field multiplications
        definition: cost of one curve addition in the instrumented field
      - name: oracle_cost_per_attempt
        unit: group-operation equivalents
        definition: field multiplications of one W_4 refutation divided by mults_per_group_op
    controls:
      - the QSP row restated same-cell must reproduce the >= 49-bit gap from cited numbers only
      - a brute-force pair enumeration on the same RC-1 instances as the structureless oracle (KN-FIND-aa2efc's null)
      - report the floor beside gamma* so a growing floor is not read as progress
    outcomes:
      positive: 'A gamma_meas in one unit at RC-1 exists for the first time; the column has a measured instance and a defined exchange rate.'
      negative: 'The exchange rate varies by more than 4x across instances or hosts: the unit is not stable and gamma* stays a per-model quantity, reported as such.'
      artifact: 'The QSP restatement does not reproduce >= 49 bits: a transcription error in this review or in 3f7a1c, located first.'
    falsification_threshold: 'Same-cell QSP gap below 29.7 bits (the d = 7 bound) from cited numbers; RC-1 gamma_meas within a factor 4 of gamma*(RC-1) would be the first live candidate and triggers the record''s Stage 2.'
    estimated_cost:
      implementation: low
      compute: 'zero for the table; minutes to instrument and count on the 144 archived RC-1 instances (estimate)'
    zero_run_prerequisites:
      - restate the worked example same-cell
      - cite KN-FIND-aa2efc and EV-ICPERF-10c5fc; adopt their floor formula
      - fix the unit convention
  successor_seam: >-
    A small CERTBIN proposal: the first same-unit exchange rate at a measured
    cell -- field multiplications per group operation versus per W_4 refutation
    on RC-1's archived instances -- so that every later "oracle budget" on
    ECC2K-130 (2^4.41 at m = 4) can be read against a measured oracle in the
    same unit rather than against a model. It is the missing conversion between
    KN-FIND-5a8d3e's refutation costs and KN-FIND-aa2efc's budget column.
  records_read:
    - IDEA-20260922-818b73 (full)
    - RQ-QSP-f9bbdb (motivation items 1-5)
    - IDEA-20260916-3f7a1c (lines with the 2401 / 90.6 / 110 figures)
    - KN-FIND-aa2efc
    - EV-ICPERF-10c5fc (lines 138-150)
    - KN-FIND-5a8d3e (frontmatter)
    - DEC-20260926-cb4487 (header and decision label)
    - DEC-20260924-99ce20 (HOLD-F)
  not_read:
    - IDEA-20260916-b84e2d
    - IDEA-20260916-5c9d6e
