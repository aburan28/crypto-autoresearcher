review:
  idea_id: IDEA-20260922-9d12bd
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-5d1a51
  ranking_context:
    rank: 20
    disposition: consolidated_into_cdca3a
    hold_id: HOLD-I
  claim_restated: >-
    Reduction-polynomial sparsity (pentanomial vs trinomial) is a seventh toggleable
    ingredient beyond IDEA-20260904-7fd218's six, predicted to move only the
    per-node cost c_leaf and never the leaf count N_leaf, because Proposition 1 of
    the Trimoska model fixes the ml core variables (hence the backdoor and leaf
    count) independent of how field multiplication is written, while a denser
    modulus widens the Tseitin clauses. A field-degree census (grepped from the
    audit) partitions the standardized population by basis type. The record's real
    contribution is a relabelling-null discriminator: a width-matched random
    F_2-linear relabelling must show small N_leaf effect while an unmatched one
    reproduces 7ef636's >=64x conflict blow-up, so a real sparsity effect cannot be
    mistaken for 7ef636's variable-order effect.
  core_argument_check:
    - step: 'axis purity: basis change moves c_leaf, not N_leaf (backdoor invariance)'
      verdict: holds
      note: >-
        The argument is principled: Prop 1's backdoor is about substitution
        structure (which monomials determine which variables), basis-independent;
        the reduction polynomial changes only the bilinear form's entries, not its
        domain/codomain. Stated as a heuristic (H1) with the axis-purity prediction
        as the falsifiable core. Reasonable.
    - step: 'Stage-0 cell: a toy n admitting both a trinomial and a pentanomial'
      verdict: holds
      note: >-
        Confirmed x^9+x+1 is irreducible over F_2 (the record's exhibited trinomial),
        so a matched pair exists at n=9. The census (ppBasis/tpBasis per m) is a
        secondary-source read with a flagged re-verification obligation, honestly.
    - step: 'relabelling-null discriminator (width-matched vs unmatched)'
      verdict: holds
      note: >-
        The discriminator is the record's genuine methodological addition: it keeps
        a real sparsity effect from being read as a restatement of 7ef636's order
        effect. H2 (width determines search cost) is explicitly instrumental and
        falsifiable. Sound design.
    - step: 'the c_leaf effect is a constant factor on an already-dominated family'
      verdict: holds
      note: The record states this plainly; no exponent moves, leaf count predicted flat, matched rho dominates every row.
  verdict: sound_with_corrections
  defects:
    - what: substantial overlap with f37254 (same trinomial-vs-pentanomial axis)
      where: overlap_review
      fix: >-
        Merge with f37254 and 99294c into the single cdca3a design (HOLD-I). 9d12bd
        contributes the (N_leaf, c_leaf) axis framing and the relabelling-null
        discriminator; f37254 contributes phi-transport and the no-trinomial control.
        Do not build two separate CNF-XOR basis experiments.
    - what: CNF-XOR arm depends on WDSat, which is not installed
      where: minimal_test Stage 2-3
      fix: >-
        Mark missing: WDSat. The encoder-level metrics (clause width, substitution-
        variable count) are computable without a solver and are the record's own
        Stage-4 solve-free deliverable; the conflict-count / seconds-per-leaf arm
        needs WDSat and must declare it a prerequisite.
    - what: census sect*r1/r2 rows for m in {233,283,409,571} not individually re-verified
      where: citations (flagged), interpretation_limits
      fix: re-derive the full census from FIPS 186-4 / ANSI X9.62 at claim strength (the record names this obligation).
  ecc2k130_bearing: >-
    Constant-factor only, and indirect. ECC2K-130 is pentanomial (z^131+...); if the
    c_leaf axis is non-trivial, its CNF-XOR decomposition solve carries a per-node
    cost that a trinomial field would not, but leaf count (the exponent-bearing
    quantity) is predicted flat and no exponent moves -- matched rho 2^60.8 is
    unaffected at any outcome. No arity change is proposed (m=3 throughout the toy
    ladder), so the product-law floor is not engaged. What transfers to ECC2K-130:
    at most a constant-factor per-node cost characterisation and the census cell
    "n=131 -> pentanomial", plus the reusable relabelling-null pattern for any
    future basis claim at n=131.
  agreement_with_hold: agrees
  agreement_note: >-
    Agree with consolidation into cdca3a (HOLD-I). It is a well-posed constant-
    factor measurement whose distinctive value is the width-matched relabelling
    discriminator, which is worth carrying into the merged design as its method for
    separating a structured-basis effect from 7ef636's unstructured-order effect.
    Ranked medium is right; it decides a genuinely new census cell cheaply.
  concrete_experiment:
    cell:
      curve: >-
        Toy field F_{2^9} (Stage 0 cell admitting trinomial x^9+x+1 and a
        pentanomial), Koblitz-analogue curve; scaled to m=3, l in {6,7,8} for the
        measurement. CERTBIN RC-1 (n=17) as the structural-fixture reproduction.
      m: 3
      l: 6
      factor_base: 'the ml-core-variable CNF-XOR pdp system; identical core-variable count across the three basis arms (structural fixture)'
      targets: '10 UNSAT + 10 planted-SAT per (cell, basis arm)'
      seeds: '>=5 seeds per cell'
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - 'new: per-basis Tseitin/CNF-XOR encoder variants + width-matched random-relabelling generator (few hundred lines)'
      - 'missing: WDSat (conflict-count and seconds-per-leaf metrics); encoder-level clause-width/substitution-variable metrics need no solver'
    procedure:
      - Stage 0 (zero compute) -- confirm F_{2^9} admits both moduli (done: x^9+x+1 irreducible); commit the leaf-count-invariance and clause-width predictions before any run.
      - Stage 1 -- encode the same descended system under trinomial, pentanomial and normal basis at m=3, l in {3,4}; verify identical core-variable count, block partition, equisatisfiability and identical projected solution sets by brute force.
      - Stage 2 -- at l in {6,7,8} record leaf counts, clause-width and substitution-variable distributions from the encoder directly (solver-free), plus conflict counts and seconds-per-leaf IF WDSat is available.
      - Stage 3 -- run the unmatched-random and width-matched-random relabelling controls; compare N_leaf against the real-basis arms.
    metrics:
      - name: leaf_count_ratio (pentanomial/trinomial)
        unit: dimensionless
        definition: predicted flat within [0.95,1.05] (axis purity on N_leaf)
      - name: clause_width_ratio (F-set clauses)
        unit: dimensionless
        definition: predicted measurably above 1 for pentanomial; encoder-level, no solver
      - name: N_leaf ratio, width-matched vs unmatched random relabelling
        unit: dimensionless
        definition: width-matched near 1; unmatched reproduces 7ef636's >=64x -- the core discriminator
    controls:
      - 'STRUCTURAL FIXTURE: identical core-variable count and equisatisfiability across bases; mismatch blocks Stage 2.'
      - 'UNMATCHED RANDOM RELABELLING: must reproduce 7ef636''s large N_leaf effect (instrument power check).'
      - 'WIDTH-MATCHED RANDOM RELABELLING: must show small N_leaf effect, isolating clause width.'
      - 'BRUTE-FORCE ORACLE: certificate-set equality across arms at small cells.'
      - 'SEED CONTROL: >=5 seeds per cell.'
    outcomes:
      positive: leaf count flat AND clause width / c_leaf measurably higher for pentanomial, surviving the width-matched null -- a genuine c_leaf lever, a seventh ingredient beside 7fd218's six.
      negative: leaf count ratio outside [0.95,1.05] -- axis purity false, the effect belongs on N_leaf (the more surprising, more important outcome, warranting escalation).
      artifact: width-matched relabelling reproduces the unmatched 64x effect -- the discriminator has no power; no sparsity attribution is licensed.
    falsification_threshold: >-
      leaf_count_ratio outside [0.95,1.05] at any cell with a passing structural
      fixture falsifies the axis-purity mechanism; a width-matched relabelling that
      blows up N_leaf as much as the unmatched one voids the discriminator.
    estimated_cost:
      implementation: medium
      compute: low (single core, low tens of hours with WDSat; solver-free arm is minutes; ESTIMATE)
    zero_run_prerequisites:
      - Stage 0 modulus existence (confirmed at n=9).
      - encoder-level clause-width metric (solver-free) is the affordable population-wide sweep.
  successor_seam: >-
    none distinct from f37254's seam -- the two records answer the same
    trinomial-vs-pentanomial question and should seed a single follow-on
    (sparsity as a continuous term-count variable, with the basis-disclosure
    amendment for filed conflict-count/first-fall-degree laws). 9d12bd's unique
    reusable artefact is the width-matched relabelling-null pattern, which should
    be lifted into any future lane record that varies a linear representation and
    needs to distinguish structure from arbitrary scrambling.
  records_read:
    - IDEA-20260922-9d12bd (full)
    - IDEA-20260922-f37254 (full, sibling)
    - ranking-context-DEC-20260924-99ce20.yaml (HOLD-I)
