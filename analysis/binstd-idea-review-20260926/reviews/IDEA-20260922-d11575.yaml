review:
  idea_id: IDEA-20260922-d11575
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-5d1a51
  ranking_context:
    rank: 16
    disposition: design_after
    hold_id: HOLD-H
  claim_restated: >-
    On the five composite-degree ANSI curves (c2pnb176/208/272/304/368, N = 16k,
    k prime, A,B in F_{2^16}), a GHS/cover census of the ten divisors of N is
    decided by four cheap Artin-Schreier level computations inside F_{2^16}.
    C1: for every base field F_{2^c} with c | 16 the Galois sum factors through
    the subfield trace, which annihilates the prime subgroup, so the conorm-norm
    image is 0 and 25 of 50 cells are STRUCTURALLY EMPTY with an elementary
    certificate. C2: the four live lanes c in {k,2k,4k,8k} have genus g = 2^{m-1}
    pinned into [2^{n/2}, 2^{n-1}] by the single audited fact B not in F_{2^8}.
    C3: under generic m = n only the c = 4k lane (g = 8) beats matched rho in
    time, by 0.9 to 12.3 bits, at 2^38.5 to 2^80.5 memory, which the record
    predicts is a wash or loss under van Oorschot-Wiener accounting and says so
    before the census.
  core_argument_check:
    - step: 'C2/C3 arithmetic: matched rho 0.886 sqrt(l)/sqrt(2k), l=2^{s-0.5}'
      verdict: holds
      note: >-
        Reproduced 77.85, 93.73, 125.53, 141.45, 173.31 (record quotes 77.9..173.3).
        c=4k time q^{1.75}=2^{7k}=77,91,119,133,161; advantages 0.8,2.7,6.5,8.5,12.3
        (record 0.9..12.3); memory q^{7/8}=2^{3.5k}=38.5..80.5 all reproduce.
    - step: 'rho column is 0.5 bit low vs the brief convention (ranking A4)'
      verdict: defective
      note: >-
        The record uses 0.886 sqrt(l)/sqrt(2k) = sqrt(pi*l/(8k)), i.e. symmetry
        order 2k in the 4k slot. The brief's canonical sqrt(pi*r/(4k)) with k the
        Frobenius class order gives 78.35, 94.23, 126.03, 141.95, 173.81 -- exactly
        0.50 bit higher on every row. Confirmed by direct computation. Does not
        change any verdict (advantages < the g!=2^15.3 wash band) but the column
        must be restated in the canonical convention before the census is filed.
    - step: 'C3 exponent move l^{1/2} -> l^{7/16} in the c=4k lane'
      verdict: holds
      note: >-
        7k/(16k-16) -> 7/16 = 0.4375 as k grows; the record correctly labels this
        the KNOWN composite-degree GHS phenomenon, not a new exponent, and claims
        only the per-curve table + collapse closure + memory charge as new.
    - step: 'C1 collapse rests on Hess (KN-LIT-6987) excluding the collapsed case'
      verdict: unchecked
      note: >-
        The record itself flags this as a proof obligation: if Hess's conorm-norm
        theorem is unconditional, C1 is FALSE. KN-LIT-6987 was not opened (corpus
        entry read only). The load-bearing algebraic claim of the record is
        therefore conditional on an unread source. I did not re-derive the Galois-
        sum-through-subfield-trace argument; marked unchecked.
    - step: 'novelty_status: known -- MMT eprint 2001/084 covers exactly these five curves'
      verdict: holds
      note: >-
        Only the MMT abstract was reached (PDF did not render; provenance honestly
        marked retrieved-abstract-only). The genus formula g=2^{m-1} and the magic-
        number definition were relayed through a fetch summariser of Smart's page,
        not the primary source. These are re-derivation obligations, correctly named.
  verdict: sound_with_corrections
  defects:
    - what: rho column 0.5 bit low relative to the brief's sqrt(pi*r/(4k)) convention
      where: target_complexity.best_known, claim (C3), asymptotic_claim.prior_best
      fix: >-
        Restate rho as sqrt(pi*r/(4k)) with k the Frobenius class order (78.35..173.81),
        or state explicitly that 2k includes negation and reconcile with the brief.
        The advantage figures then shrink by 0.5 bit each; none flips sign.
    - what: C1 conditional on the unread Hess theorem (KN-LIT-6987)
      where: proof_obligations, heuristic_assumptions H-DL-0
      fix: >-
        Read Hess "GHS attack revisited" at source and confirm its hypotheses
        exclude the c|16 collapsed case before C1's 25 empty cells are asserted;
        this is the blocking gate the hold (NA-4) already names.
    - what: whole live-lane cost table may merely reproduce MMT
      where: frontier_check, dominated_by
      fix: >-
        Diff the census cell-by-cell against MMT's published m-values and tables;
        the likely honest outcome is reproduction of MMT plus the collapse
        certificate and memory charge as this program's only addition.
  ecc2k130_bearing: >-
    ZERO operational transfer. ECC2K-130 is n = 131 prime, no proper subfield, so
    the divisor lattice is {1,131} and GHS is empty by construction -- exactly the
    record's own prime-degree nearby-object control (c2tnb), which must collapse to
    one hopeless cell. GHS/cover is a genus mechanism, not an arity-m decomposition
    oracle, so it does not engage the product-law floor table at any m; the implied
    "arity" here is the cover genus g up to 2^{n-1}, not a Semaev arity. Against the
    matched rho 2^60.8 on ECC2K-130 this record says nothing beyond confirming the
    curve sits in the GHS-empty column. Its bearing is entirely on the composite
    c2pnb population, not on ECC2K-130.
  agreement_with_hold: agrees
  agreement_note: >-
    Agree with design_after and tripwire T2. The record's strongest content (C1/C2
    closure of 25 cells) is conditional on an unread paper (Hess) and the whole
    live-lane table is dominated by MMT, whose body was not read. A research-deep
    task must read the MMT body at source (retrieved, not summarised) and Hess
    before any cell is called new, and any design is reviewed at review-breakthrough
    because a moved deployed row would be a break-adjacent claim. T2 (recalled GTTD
    exponent, genus via summariser) is correctly applied.
  concrete_experiment:
    cell:
      curve: >-
        Toy subfield analogue E/F_{2^4} over F_{2^{4*7}} = F_{2^28} (d=4, k'=7,
        dk'=28 <= 41), plus the c=16 baseline-embedding cell on the real curves
        (arithmetic only), plus prime-degree control c2tnb191v1 (single cell {1,N}).
      m: 2
      l: 9
      factor_base: 'degree-one places of the GHS cover over F_{2^c}; toy uses the deg<9 polynomial-basis V of CERTBIN RC-1 as the elliptic factor base for the control arm'
      targets: 'a point of prime order l'' in the non-subfield part of the toy curve; 20 targets'
      seeds: enumerated over the small subgroup (exhaustive), not random
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - 'new pure-Python: Artin-Schreier level routine (iterate (u+1) in F_{2^16}) and Cantor reduction on the cover'
      - 'missing: Sage (Weil_descent.sage cover construction) OR a pure-Python GHS cover builder must be written; missing: msolve/Magma not needed for the algebraic C1 check'
    procedure:
      - Phase 0 arithmetic (seconds, no solver) -- compute conjugate period 16/gcd(c,16) and Artin-Schreier level m of beta=B^{2^15} for each of the ten divisors of each real curve; emit the 5x9 census table under both m-conventions and both genus branches.
      - Verify the c=16 baseline-embedding cell returns m=1, g=1 (reproduces E) and the Koblitz control returns m=1 everywhere; halt if not.
      - Phase 2 (minutes) -- on the toy cell construct a point P of order l', compute the subfield trace sum_r pi_q^r(P) explicitly and verify it is the identity (C1 consequence); include a k'-EVEN positive control where the collapse arithmetic changes so the check can fail.
      - Compute the conorm-norm image order on P and verify it is coprime to l' for c|d.
    metrics:
      - name: conorm_norm_image_order_on_l_part
        unit: dimensionless (group element order)
        definition: order of the conorm-norm image of an l'-order point for c|16; predicted exactly 1
      - name: artin_schreier_level_m
        unit: integer
        definition: least j with (u+1)^j beta = 0; predicted in [n/2+1, n] on live lanes
      - name: charged_time_exponent and factor_base_memory_entries
        unit: bits (log2 F_{2^c}-multiplications; log2 entries)
        definition: q^{2-2/g} time and q^{1-1/g} memory per live cell, both regimes
    controls:
      - 'NULL 1: prime-degree ANSI rows (c2tnb191v1) -- divisor lattice must collapse to {1,N}, one hopeless cell; a small genus is a bug.'
      - 'NULL 2: synthetic curve over F_{2^176} with B drawn uniformly -- m must equal n in every lane.'
      - 'NULL 3: binary Koblitz curve -- m = 1 in every lane (validates the level routine).'
      - 'POSITIVE CONTROL: k''-even toy cell where F_{q^2} sits inside F_{q^{k''}} and the conorm-norm image must be NON-trivial (so C1''s check has a possible negative).'
    outcomes:
      positive: conorm-norm image is the identity on all c|d toy cells AND m lands in [n/2+1,n] on all live cells -- C1 and C2 hold; 25 cells certified empty.
      negative: a c|d toy cell shows conorm-norm image of order divisible by l' -- C1 dead, half the table reopens; OR a live cell has m outside [n/2+1,n] -- C2 dead.
      artifact: the k'-even positive control also shows a trivial image (the check cannot fail) -- the C1 verification is uninterpretable and must be re-instrumented.
    falsification_threshold: >-
      Any single toy c|d cell with conorm-norm image order divisible by l' falsifies
      C1 outright; any live cell with period n but m outside [n/2+1,n] falsifies C2.
      A census m-value disagreeing with MMT's published table is wrong until reconciled.
    estimated_cost:
      implementation: medium
      compute: low (Phases 0/1/3 seconds; Phase 2 toy cover at dk'<=41 is the only engineering; ESTIMATE ~2^20 group ops)
    zero_run_prerequisites:
      - Read MMT eprint 2001/084 body at source (retrieved) and diff its m-values against the census.
      - Read Hess KN-LIT-6987 at source to confirm C1's collapse is not excluded by an unconditional theorem.
      - Re-derive the GHS genus formula g=2^{m-1} or 2^{m-1}-1 from a primary source, not the Smart-page summariser.
  successor_seam: >-
    A record that separates the two kinds of small-m cell the census cannot tell
    apart on its own: "m small because collapse (useless, image zero)" versus
    "m small because B sits low in the Artin-Schreier filtration (dangerous,
    non-degenerate transfer)". The discriminating observable is the conjugate
    period 16/gcd(c,16) reported alongside m in every cell; a proposal that turns
    that pair into a decision rule for the reachability table -- and that prices
    the memory honestly under one van Oorschot-Wiener accounting for both the GHS
    and rho arms -- would convert d11575's exponent-comparison into a defensible
    per-curve verdict without waiting on the full MMT reproduction.
  records_read:
    - IDEA-20260922-d11575 (full)
    - ranking-context-DEC-20260924-99ce20.yaml (HOLD-H)
    - BRIEF.md sections 1,2,3,6
    - AGENTS.md Core rules, Inventor protocol
    - docs/inventor-protocol.md sections 2,4,5
    - experiments/EXP-CERTBIN-e94b27/impl/ (README, file listing)
  not_read:
    - MMT eprint 2001/084 body (only abstract, as the record itself states)
    - KN-LIT-6987 (Hess), KN-LIT-007 (GHS 2002) primary texts
