review:
  idea_id: IDEA-20260922-153a90
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-843cf5
  ranking_context:
    rank: 24
    disposition: consolidated_into_1b16d7
    hold_id: HOLD-K (tripwire T5 -- closure section to review-breakthrough)
  claim_restated: >-
    A factoring sieve amortises because divisibility by p is a lossy test that
    is periodic under "advance by 1". The record (A) shows that on the
    prime-order target subgroup G no nontrivial partition invariant under a
    single walk step S exists (block systems of a regular cyclic action of
    prime order are trivial, by Lagrange), so no sieve-style periodic test on
    TARGETS exists; (B) the factor base lives in the composite-order E(F_q),
    whose index-2 block system is exactly cedd2f's pi = Tr(x) + Tr(a), which
    is why every surviving yield lever classifies legs; (C) deeper 2^i-torsion
    quotients exist where the 2-Sylow is cyclic of order >= 2^i and cost O(i)
    field operations per factor-base point via iterated halving (open,
    priced); (D) ECC2K-130 (4l, l prime, rho calibration 2^60.9) is the
    flagship row to state the boundary on.
  core_argument_check:
    - step: block systems of <S> acting regularly on G of prime order r are only trivial and total
      verdict: holds
      note: >-
        For S != O in G, ord(S) = r (Lagrange), so <S> = G acts on itself
        regularly and its blocks are the cosets of subgroups of G, of which
        there are two. Unconditional.
    - step: this closes the "sieve the targets" escape route completely
      verdict: defective
      note: >-
        It closes exactly what it proves -- an exactly periodic, <S>-invariant
        lossy test on targets for a fixed step S of order r. It does not close
        (i) tests that are cheap to UPDATE along a walk without being periodic,
        and in particular (ii) the ordinary Class I structure: if the step S
        lies in the factor base then R = sum P_i gives R + S = sum P_i + S, an
        (m+1)-decomposition, which is "translation by factor-base elements" and
        is precisely not closed (IDEA-20260806-c5d183 places index calculus
        there). The record's own Sigma restriction (single generator, order r)
        makes (A) true; the word "completely" in the title and the closure
        standard claimed in interpretation_limits overreach that Sigma. Since
        this is the closure section, T5 (review-breakthrough) is the right
        tripwire and this review does not stand in for it.
    - step: factor-base side -- E(F_q) has even order on every standardized row, so the index-2 block system pi exists and is the coarsest
      verdict: holds
      note: >-
        b != 0 gives exactly one rational 2-torsion point (0, sqrt b), so E[2](F_q) = Z/2
        and the 2-Sylow is cyclic; 2E has index 2. On ECC2K-130 the chain is
        E > 2E > 4E = C (order 4l > 2l > l), with quotients Z/2 (pi) and Z/4
        (E/C, the rho reduction). Cofactors in the audit dump re-read for
        sect163k1 (2), sect239k1 (4); the "every cofactor even" claim for the
        other rows is relied on from the record.
    - step: c2tnb431r1 cofactor 10080 = 2^5 * 315
      verdict: holds
      note: 32 * 315 = 10080, 315 odd; re-computed.
    - step: iterated halving costs O(1) field operations per level (part C pricing)
      verdict: unchecked
      note: >-
        Relayed literature claim, not re-derived. One structural point the
        record misses and that matters for pricing on ECC2K-130 -- the depth-2
        class (the E/4E bit) of a point P in 2E is Tr of the half-point's
        x-coordinate, which the FHLM halving recipe gives as Tr(y_P + (lambda+1) x_P)
        with lambda a half-trace of x_P + a; it is well defined only when
        pi(T) = Tr(a) = 0 (true at a = 0, hence on ECC2K-130), it depends on
        y_P (not on x_P alone), and it is NOT an F_2-linear function of the
        coordinates of x_P. So unlike pi, no linear x-window can be built
        inside one E/4E class; the second bit is available only by rejecting
        window points. Priced under ecc2k130_bearing.
    - step: (D) the trace-parity quotient and the 131-fold Frobenius class reduction "compose multiplicatively" as amortisations of rho
      verdict: defective
      note: >-
        pi is identically 0 on G, where rho walks, so it is not an amortisation
        of rho at all; it is a relation-collection yield lever on legs. The
        Frobenius class gain is rho's and is already inside 2^60.809. The two
        do not compose on rho; the sentence should be struck.
    - step: ECC2K-130 is the only row with both a certified prime-order target and a published rho calibration
      verdict: holds
      note: as phrased (calibration point); the FIPS rows have certified prime orders but no published rho count.
  verdict: sound_with_corrections
  defects:
    - what: the closure is scoped to a single-generator periodic test but is announced as closing target-side sieving "completely"
      where: title, claim (A), interpretation_limits, method_ceiling.strongest_certifiable_claim
      fix: >-
        Restate the certified claim as "no <S>-periodic lossy test on G for any
        fixed S", name the two open readings it does not close (cheap
        non-periodic incremental tests; translation by factor-base elements,
        which is Class I and live), and file the obstruction as a measured
        `obstruction` block per docs/inventor-protocol.md section 4 (quantity --
        number of nontrivial <S>-invariant partitions, value 0, scope prime r).
    - what: part (D) conflates the leg-side quotient with a rho amortisation
      where: claim (D)
      fix: strike the "compose multiplicatively" sentence; pi has no effect on rho.
    - what: the open number (C) is priced only as a precompute cost, not as a yield trade
      where: claim (C), target_complexity
      fix: >-
        Add the yield pricing -- a window aligned to one E/4E class by rejection
        keeps about half of the pi-aligned points and gains a factor 2 in the
        class-sum success probability, net 2^{1-m} relative to the parity-aligned
        window at arity m (a loss for every m >= 2); state that the E/4E bit is
        not linear in x so no subspace window realises it for free.
    - what: rho quoted as 2^60.9 (KN-LIT-096) rather than the matched convention
      where: claim (D), target_complexity.best_known
      fix: cite 2^60.809 (KN-FIND-aa2efc, sqrt(pi r/(4*131))) as the matched figure; 2^60.9 is Bailey et al.'s own rounding and may stay as the source figure.
  ecc2k130_bearing: >-
    Legs live in the order-4l group, targets in the order-l subgroup C. The
    quotient chain E -> E/2E (Z/2, free and linear in x at odd n via the
    constant coefficient) -> E/C (Z/4, second bit needs y and a half-trace) is
    the complete list of lossy full-translation-compatible quotients that are
    trivial on C. Yield pricing at arity m against a size-matched random
    window -- parity alignment gives at most a factor 2 (one bit) at every m;
    aligning the second bit by rejection costs 2^{1-m}, so it is never bought.
    This changes no arity: m <= 3 stays closed (finding's floor 2^68.58 at
    m = 3, my standard-balance re-derivation 2^66.79, both >= 6 bits above the
    reproduced matched rho 2^60.809), and at m = 4 the one bit is a rounding
    on the 2^4.4 (finding) to 2^6.6 (mine) per-attempt oracle budget. The
    record's target-side closure adds no cost and removes no row; its value is
    as the explanation of why no proposal in this cluster may classify targets.
  agreement_with_hold: agrees
  agreement_note: >-
    Consolidation into 1b16d7 is right -- this record's operational content is
    1b16d7's leg-side lever plus an explanatory closure. T5 is right -- the
    closure section overreaches its own Sigma and must be reviewed at
    review-breakthrough before it is filed as a closure. A rankable revision
    contains the re-scoped closure with a measured obstruction block, the
    corrected part (D), the yield pricing of the E/4E bit, and the relabelled
    generic-group control below (the claim is purely group-theoretic and must
    survive relabelling).
  concrete_experiment:
    cell:
      curve: >-
        Koblitz y^2 + xy = x^3 + 1 over F_2[t]/(t^19 + t^5 + t^2 + t + 1),
        #E = 4 * 130873 with 130873 prime (computed this session by the
        Frobenius-trace recurrence and a Miller-Rabin check) -- the exact
        4l-shape sibling of ECC2K-130 at prime n. Control curve a = 1 at the
        same n, #E = 2 * 262543 (prime), where E/4E does not exist.
      m: 3
      l: 10
      factor_base: >-
        V'_0 = {deg < 10, c_0 = 0} (parity-aligned, size 512), its sub-windows
        V'_{00} and V'_{02} (points of E/4E class 0 resp. 2, by the halving bit,
        each about 256 points), and a random 9-dimensional subspace null.
      targets: 40 random points of C (order l) plus 20 points of class 2 in 2E - C as mirror controls
      seeds: fixed integer seed for the target draw and the random subspace, recorded; census itself is exhaustive
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py and curve.py (scalar field and group law; half-trace exists in gf2n.py)
      - 'missing: numpy (top-level import in both modules; not installed here) -- lift the scalar lines or install'
      - new 150-line script -- halving bit, class histogram, m = 2 and m = 3 census, relabelled Z/(4l) generic-group replica
    procedure:
      - Enumerate the points of V'_0; compute pi (must be 0 for all) and the E/4E bit via one halving; record the class histogram (prediction about 50/50 between classes 0 and 2).
      - m = 2 and m = 3 census of decompositions of the 40 C-targets by V'_0, V'_{00} and V'_{02}; record the class-sum of every counted decomposition (must be 0 mod 4).
      - Compute the yield ratio V'_{00} over V'_0 per m (prediction 2^{1-m} -- 1/2 at m = 2, 1/4 at m = 3).
      - Generic-group replica -- in Z/(4l) with the same class labels (residue mod 4) and a random subset of the same sizes, repeat steps 2-3; the histogram and ratios must coincide within sampling noise.
      - a = 1 control -- repeat step 1; the halving bit must be reported undefined (pi(T) = 1), not computed.
    metrics:
      - name: class_histogram
        unit: count of points per E/4E class
        definition: number of window points in class 0 and class 2 (pi = 0 windows), plus undefined count on the a = 1 control
      - name: class_sum_violations
        unit: count
        definition: counted decompositions whose leg classes do not sum to the target's class mod 4; must be 0
      - name: yield_ratio_class0_over_parity_aligned
        unit: dimensionless, per m
        definition: mean decompositions per C-target using V'_{00} divided by the same using V'_0
      - name: curve_over_generic_ratio
        unit: dimensionless
        definition: each of the above divided by its value on the relabelled Z/(4l) replica
    controls:
      - relabelled Z/(4l) generic group with the same class bookkeeping (blocking -- a group-structure claim must survive relabelling)
      - a = 1 sibling (2l) where the second bit is undefined
      - random 9-dimensional subspace (must show all four class patterns and about half yield)
      - class-2 targets as mirror image (V'_{00} must give zero for them at every m; V'_{02} nonzero at odd m only)
    outcomes:
      positive: >-
        zero class-sum violations, yield ratio within [0.5, 2] x 2^{1-m}, and
        the generic replica matching -- the E/4E lever is real, group-theoretic,
        and never worth buying by rejection; part (C)'s open number is closed
        at the level of subspace windows.
      negative: >-
        yield ratio of V'_{00} exceeding 2^{1-m} by more than a factor 2 on the
        curve but not on the replica -- a curve-specific concentration the group
        theory does not predict; report as a finding and replicate before any
        interpretation.
      artifact: >-
        the replica shows the same excess -- it is window-size arithmetic, not
        structure; or the a = 1 control returns a "class bit" -- the halving code
        is wrong and nothing is read.
    falsification_threshold: >-
      one class-sum violation (exact) falsifies the Z/4 quotient reading; a
      curve/generic ratio outside [0.5, 2] on any metric at matched sizes
      falsifies the "purely group-theoretic" claim of (B).
    estimated_cost:
      implementation: low
      compute: 'ESTIMATE -- about 512^2/2 additions per target at m = 3, 60 targets x 3 windows, about 2e7 pure-Python field operations plus the replica; minutes.'
    zero_run_prerequisites:
      - the re-scoped closure statement and obstruction block written before the run
      - halving-bit formula written out and hand-checked on one point (Stage 0 of the record)
      - numpy or lifted scalar arithmetic
  successor_seam: >-
    THE E/4E BIT AS A NON-LINEAR WINDOW CONDITION (owner RQ-CERTBIN-836ce2,
    G3's target-dependent / implicit-membership class of KN-OPEN-020). The
    parity bit is linear in x and therefore free; the second bit is a function
    of (x, y) through a half-trace and one multiplication. A proposal that
    asks whether ANY cheaply described non-subspace window (for example the
    image of a subspace under one halving, or a window described by its
    half-points) has constant E/4E class, and what that does to the descended
    membership degree, is the honest continuation of part (C). Its prediction
    to beat is the 2^{1-m} rejection price derived here; if a description
    exists with membership cost comparable to a linear test, the two bits are
    worth up to a factor 4 at every m on ECC2K-130, still no arity change.
