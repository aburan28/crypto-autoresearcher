review:
  idea_id: IDEA-20260922-c2bbe6
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-843cf5
  ranking_context:
    rank: 31
    disposition: return_for_revision
    hold_id: HOLD-Q
  claim_restated: >-
    Fix m - 1 factor-base legs, compute the residual L = -(P_1 + ... + P_{m-1})
    with m - 2 additions, and instead of discarding L when it is not in V,
    bank its canonical form c(L) in a hash table; a second tuple with the same
    residual subtracts to a weight-2(m-1) relation among factor-base elements
    at hash-lookup cost. This is the single-large-prime variation of sieve
    factoring ported to elliptic point decomposition, with a union-find merge
    pass as the structured-Gaussian-elimination analogue. The record says the
    binary lane never used it because SAT/Groebner decomposition returns no
    group-element byproduct on UNSAT, and scopes itself to the regime where
    V^{m-1} is directly enumerable.
  core_argument_check:
    - step: the free-leg construction produces exactly one residual per attempt at m - 2 additions plus one membership test
      verdict: holds
      note: trivial; the plain construction is the Theta(B^{m-1}) enumeration of (m-1)-subsets.
    - step: two tuples with equal canonical residual subtract to a certificate-bearing relation of weight <= 2(m-1)
      verdict: holds
      note: up to the recorded sign and orbit correction; a shared leg cancels and lowers the weight.
    - step: combined-relation supply is birthday-quadratic, T^2/(2S) after T attempts over a residual support of size S
      verdict: holds
      note: standard birthday count under the record's own uniformity heuristic H-c2bbe6-0.
    - step: consequence for cost, which the record leaves unresolved -- to collect B relations one needs T of order sqrt(2 S B)
      verdict: defective
      note: >-
        The record derives the quadratic supply and then declines to price it.
        Pricing it -- with S of order N = |E| (the generic case for a subspace
        window whose point set is not a subgroup), T = sqrt(2 N B) attempts of
        m - 2 additions each; on ECC2K-130, N = 2^131 gives T >= 2^66.0 at
        B = 1, 2^71.0 at B = 2^10, 2^76.0 at B = 2^20, 2^81.0 at B = 2^30
        (computed this session), against the reproduced matched rho 2^60.809.
        The ranker's A13 (about sqrt(N B), above rho by sqrt(B)) is confirmed
        up to the factor sqrt 2. The construction is dominated by rho for
        every B >= 1 and every m, before linear algebra and descent are
        charged. dominated_by should say so and does not (it says "not
        applicable as an attack claim").
    - step: the plain (m-1)-fixed construction as a primary relation collector
      verdict: defective
      note: >-
        Not stated in the record -- to collect B full relations the plain
        free-leg enumeration needs T = N attempts (probability B/N per attempt
        times B relations), i.e. it is a Theta(N)-class brute force; the
        large-prime variant improves N to sqrt(2 N B), which is the whole gain
        and is still never below sqrt(N). On any deployed row this mechanism
        cannot be primary; the record's regime restriction ("V^{m-1}
        enumerable") is the honest scope and should be stated as "toy relation
        collection only".
    - step: residual support S could be much smaller than N for a structured V
      verdict: unchecked
      note: >-
        If the (m-1)-fold sumset of the window's point set were concentrated
        on S << N the count changes; for an F_2-subspace x-window the point
        set is not a subgroup and no concentration is expected, but this is
        exactly the record's H-c2bbe6-0 and is measurable (see
        concrete_experiment). The burden is the record's.
    - step: the honest reason (C) -- SAT/Groebner oracles expose no byproduct
      verdict: holds
      note: >-
        Correct and useful. A solver's UNSAT carries no group element; the
        residual exists only when the search is a free-leg enumeration, which
        is the Theta(N) regime above. The two facts together explain the
        absence in the lane.
    - step: F2 not F7 discrimination
      verdict: holds
      note: the table is consumed within one sweep; no advice for future targets.
    - step: HOLD-Q's route -- the GTTD double-large-prime form
      verdict: unchecked
      note: >-
        Re-derived the shape only. A large-prime set W containing V with
        |W| = B' and a decomposition ORACLE at arity m over V^{m-1} x W gives
        partials at probability B^{m-1} B'/((m-1)! N) per attempt and B full
        relations after about sqrt(2 B B') partials, i.e. attempts
        A = (m-1)! N sqrt(2B/B') / B^{m-1}, against m! N / B^{m-1} for the plain
        arity-m oracle -- an attempts-side gain of m sqrt(B'/(2B)) at
        UNCHANGED arity m, paid for by one block of size log B' > log B in
        the descended system. Under a leaf-count-proportional oracle the block
        costs B'/B, so the net is a LOSS by sqrt(B'/B) sqrt(2)/m; under an
        algebraic oracle polynomial in the block size the trade could flip.
        KN-LIT-164 (GTTD, corpus entry seeded from the first two pages, not
        read at source) is the reference the revision must cite and read.
        Not re-derived beyond this bookkeeping.
  verdict: dominated
  defects:
    - what: dominated_by unfilled -- the mechanism is dominated by rho by at least sqrt(2B) on every row, at every m
      where: dominated_by, sota_delta.time, target_complexity.time_exponent
      fix: >-
        State T = sqrt(2 S B) with S about N, the ECC2K-130 numbers (>= 2^66.0
        at B = 1 against 2^60.809), and that the plain free-leg construction is
        Theta(N); mark the record as a toy relation-collection technique with
        zero deployed bearing, or convert it (next item).
    - what: KN-LIT-164 not cited; the double-large-prime form not adopted
      where: citations, mechanism
      fix: >-
        Cite KN-LIT-164 (provenance kb) and read it at source; restate the
        construction as partials with one or two large primes in a set W
        produced by a decomposition oracle, with the attempts-side gain
        m sqrt(B'/(2B)) and the oracle-side charge per block size stated as an
        inequality to beat.
    - what: no arity m and no per-attempt oracle budget for ECC2K-130
      where: target_complexity, sota_delta
      fix: see ecc2k130_bearing -- the GTTD form keeps m; state the m = 4 budget it must fit.
    - what: the near-uniform residual heuristic is stated but not tied to a relabelled generic-group control
      where: controls, heuristic_assumptions H-c2bbe6-0
      fix: add the Z/NZ replica with a random subset of matched size; the collision statistics must coincide or the excess is curve structure.
    - what: the free-leg attribution ("Joux-Vitse") is recalled through 6cf862 and IDEA-20260806-9d47e2 was read at title level only
      where: citations, citation_note
      fix: mark both as recalled; read 9d47e2 in full before relying on its construction.
  ecc2k130_bearing: >-
    Single large prime as written -- closed on ECC2K-130 at every m and every
    B >= 1 by arithmetic (sqrt(2 N B) >= 2^66.0 attempts against the matched
    rho 2^60.809). Double large prime in the GTTD form -- the arity stays m,
    so the product-law rows are unchanged (m <= 3 closed at 2^68.58 in the
    finding, 2^66.79 in my standard-balance re-derivation, both >= 6 bits above
    rho; constants of the finding unchecked); at m = 4 the attempts-side gain
    m sqrt(B'/(2B)) must be bought with a larger block whose per-attempt
    oracle cost has to stay inside the 2^4.4 (finding) to 2^6.6 (mine) budget.
    The inequality a revision must exhibit is oracle(V^{m-1} x W) /
    oracle(V^m) < m sqrt(B'/(2B)); no measured oracle in this program has a
    block-size dependence gentle enough to satisfy it, and this record does
    not claim one.
  agreement_with_hold: agrees
  agreement_note: >-
    HOLD-Q is confirmed independently (sqrt(N B) form, dominated_by unfilled,
    KN-LIT-164 missing). The revision route named by the hold (adopt the
    GTTD form) is a NEW proposal rather than a revision -- it needs a
    decomposition oracle and an oracle-cost model, which this record
    explicitly avoids; it belongs to the G1 lane (TASK-20260926-995431) whose
    seam already names it. A rankable revision of THIS record is the honest
    toy-tier statement -- the free-leg large-prime accumulator as a
    relation-collection instrument at n <= 41 with dominated_by filled.
  concrete_experiment:
    cell:
      curve: >-
        RC-1 (RQ-CERTBIN-836ce2) -- n = 17, f = t^17 + t^3 + 1, A = 97044,
        B = 126251, #E = 4 * 32603, plus the Koblitz sibling y^2 + xy = x^3 + 1
        at n = 19 (#E = 4 * 130873, l prime, computed).
      m: 3
      l: 9
      factor_base: V = {deg < 9} polynomial-basis window (about 512 points), and V'_0 = {c_0 = 0} (aligned half) as the second arm
      targets: none -- target-free relation collection (target O); relations are sums to O
      seeds: none for the exhaustive census; fixed recorded seed for the Stage-2 sub-samples T in {B, 2B, 4B, ...}
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py and curve.py (scalar arithmetic and group law)
      - 'missing: numpy (top-level import in both modules; not installed here)'
      - new 150-line script -- pair enumeration, canonical residual hashing by x-coordinate, union-find, certificate re-summation, relabelled Z/(4l) replica
    procedure:
      - Enumerate all unordered pairs of window points (about 1.3e5), compute L = -(P_1 + P_2), canonicalise by x(L) (sign folded), insert into the hash table keyed by x(L).
      - Count full relations (x(L) in the window) and combined relations (buckets of size >= 2); re-sum every combined relation on the curve and require O (zero tolerance).
      - Build the residual multiplicity histogram; estimate S from the collision rate and compare the combined count to T^2/(2S) with S = N and with S fitted.
      - Sub-sample T in {B, 2B, 4B, ...} and trace the growth curve of combined relations against T.
      - Replicate steps 1-4 in Z/(4 * 32603) with a random 512-subset as the window and residue arithmetic as the group law; the histogram and growth curve must coincide.
      - Adversarial control -- truncate the hash key to 8 bits and confirm the certificate check fails at a measurable rate (the record's own control).
    metrics:
      - name: combined_relation_count_per_T
        unit: count
        definition: number of certificate-passing weight-<=4 relations from residual collisions after T attempts
      - name: residual_collision_rate_ratio
        unit: dimensionless
        definition: observed collisions divided by T^2/(2N); predicted about 1 if residuals are near-uniform on E
      - name: curve_over_generic_ratio
        unit: dimensionless
        definition: each statistic divided by its Z/(4l) replica value
      - name: certificate_pass_rate
        unit: fraction
        definition: combined relations re-summing to O; must be 1.0 under correct canonicalisation and measurably below 1.0 under the truncated key
      - name: attempts_to_B_relations
        unit: count (log2)
        definition: smallest T at which full plus combined relations reach B; compared with sqrt(2 N B) and with N
    controls:
      - relabelled Z/(4l) generic group with a random matched-size window (blocking -- residual uniformity is a group-free statement)
      - recombination-off null (full relations only must match B^3/(3! N) per the record's balance heuristic)
      - truncated-key adversarial canonicalisation (the certificate check must have power)
      - aligned half V'_0 as a second window (parity confines residuals to one coset of 2E and halves S; predicted 2x collision rate, no more)
    outcomes:
      positive: >-
        collision-rate ratio within [0.5, 2] on the curve and on the replica,
        attempts_to_B_relations tracking sqrt(2 N B) -- the sqrt(N B) pricing is
        confirmed at toy scale and the record is filed as dominated with a
        measured S.
      negative: >-
        collision rate exceeding the uniform prediction by more than a factor
        4 on the curve but not on the replica -- a curve-specific residual
        concentration; report as a structural finding, replicate at n = 19,
        then re-price.
      artifact: >-
        the replica shows the same excess (window-size arithmetic), or the
        truncated-key control passes 100 percent (the certificate check has no
        power) -- nothing is read.
    falsification_threshold: >-
      curve/generic collision-rate ratio outside [0.5, 2] at matched T
      falsifies uniformity as a group-free statement; any certificate failure
      under correct canonicalisation voids the arm.
    estimated_cost:
      implementation: low
      compute: 'ESTIMATE -- about 1.3e5 pair additions plus hashing per window, twice (curve, replica), plus sub-samples; seconds to minutes in pure Python.'
    zero_run_prerequisites:
      - dominated_by filled with the sqrt(2 N B) pricing before any run
      - KN-LIT-164 read at source and cited as kb, with the GTTD graph-merge cost noted
      - numpy or lifted scalar arithmetic
  successor_seam: >-
    THE GTTD DOUBLE-LARGE-PRIME FORM WITH AN ORACLE COST MODEL (G1 lane,
    TASK-20260926-995431, owner RQ-CERTBIN-836ce2 for the measured part). The
    seam is the inequality oracle(V^{m-1} x W) / oracle(V^m) < m sqrt(B'/(2B)):
    a proposal that measures, at RC-1 with the existing S_3 Weil descent
    (m = 2, one block of size 9) versus a modified descent with one block of
    size d' in {10, 11, 12}, how the W_4 refutation share and the sat/unsat
    cost move with the large block, would give the first number for the
    oracle-side term of that inequality. If the per-attempt cost grows slower
    than B'/B, large primes become a live attempts-side lever at fixed arity
    on ECC2K-130's m = 4 row; if it grows like B'/B, the lever is closed by
    the same arithmetic that closes the single-prime form.
