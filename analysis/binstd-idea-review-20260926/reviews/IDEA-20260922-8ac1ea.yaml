review:
  idea_id: IDEA-20260922-8ac1ea
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-5d1a51
  ranking_context:
    rank: 22
    disposition: design_after
    hold_id: HOLD-J
  claim_restated: >-
    sect163k1 and sect163r2 share field, reduction polynomial, cofactor 2, a=1 and
    order bit-length, differing in exactly one coefficient b -- the only single-
    variable matched pair at deployed parameters in the standardized binary
    population. This turns "what does Koblitz-ness buy an index calculus" into a
    three-factor separation: S_3 reads only b (P1), E-membership and the E/2E class
    read a (P2), and tau is an endomorphism only when a AND b lie in F_2 (P3). A
    2x2 factorial (a in F_2? x b in F_2?) over one toy field with one V and one
    arity separates three live explanations of any Koblitz advantage -- E1 Frobenius
    orbit only, E2 sparse-constant (b=1 gives a weight-1 constant vector, one
    inhomogeneous descended equation), E3 class-structure (Tr(a) kills odd-arity
    yield inside ker Tr) -- which predict non-overlapping patterns. The load-bearing
    cell C-GK (generic a, b=1) exists in no standard and is the null that separates
    sparse-S_3 from tau-existence.
  core_argument_check:
    - step: 'P1-P3: where a and b enter the pipeline'
      verdict: holds
      note: >-
        S_3 = (x1x2+x1x3+x2x3)^2 + x1x2x3 + b reads b only; membership Tr(x+a+b/x^2)
        and the class map P->Tr(x_P)+Tr(a) read a,b; tau is an endomorphism iff a,b
        in F_2. All correct; the 2x2 is the unique design separating the three, and
        a single-curve experiment cannot.
    - step: 'sect163k1/sect163r2 single-variable-pair fact'
      verdict: holds
      note: >-
        Confirmed x^163+x^7+x^6+x^3+1 is irreducible over F_2 (the shared field
        polynomial). The a=1, cofactor-2, same-order-bit-length, b-only-difference
        claim is a secondary-source (OpenSSL) read the record flags for FIPS 186-4
        re-derivation; I did not re-derive the pseudorandom B of sect163r2.
    - step: 'deployed rho: K-163 2^77.16, B-163 2^80.83'
      verdict: holds
      note: >-
        B-163 negation-only 0.886 sqrt(r) at r=2^162 reproduces 80.83 exactly.
        K-163 Koblitz sqrt(pi r/(4n)) gave me 76.65 vs the record's 77.16 (0.5 bit,
        same 2k-vs-k convention gap seen on the c2pnb rows); does not affect any verdict.
    - step: 'n=29 toy hosts no Frobenius-stable subspace (ranking A10)'
      verdict: holds
      note: >-
        Confirmed ord_29(2)=28, so x^29-1 has only two irreducible factors over F_2
        and no nontrivial stable subspace exists at n=29. This is acceptable because
        8ac1ea's V is an arbitrary F_2-subspace, NOT a Frobenius-stable one -- the
        design does not need a stable subspace, so A10 is satisfied.
    - step: 'HB2-2: degree-invariance under the constant (M3 rank profile) is the primary target'
      verdict: holds
      note: >-
        The top-degree part is identical across cells by P1 (b enters only degree 0),
        so equal leading forms; whether equal leading forms give equal rank profile
        is exactly the open question (Semaev systems are not semi-regular). Written
        as a zero-variance prediction a single measurement can kill. Good practice.
  verdict: sound
  defects:
    - what: single-variable-pair claim rests on a secondary (OpenSSL) source
      where: citation_note, proof_obligations
      fix: re-derive a,b,cofactor,order for sect163k1/sect163r2 from FIPS 186-4 before any deliverable (the record names this gate).
    - what: measured K/B cost is NISTBIN's under the ownership rule (DEC-20260924-4f8a03 R2)
      where: question_id RQ-BINSTD-b6f698
      fix: >-
        As the hold notes, file the measured design under RQ-NISTBIN-06157b; the
        structural/identification content stays with BINSTD but the decomposition
        cost measurement belongs to the NISTBIN/CERTBIN owner.
    - what: M4 conflict counts need WDSat, not installed
      where: minimal_test Step 4
      fix: >-
        Mark missing: WDSat. M3 (Macaulay rank profile / first-fall degree) is the
        preprocessing-immune discriminator the record most wants and is available in
        macaulay.py, so the decisive arm runs solver-free; the conflict-count arm
        declares WDSat a prerequisite.
  ecc2k130_bearing: >-
    ECC2K-130 is y^2+xy=x^3+1, i.e. a=0 (in F_2) and b=1 -- a Koblitz curve sitting
    in cell C-KK. E2's prediction bears directly: b=1 gives a weight-1 constant
    vector in the polynomial basis, so exactly one inhomogeneous descended equation
    versus ~n/2 for generic b. If E2 holds at the SOLVER level, ECC2K-130's per-
    instance decomposition is cheaper by a constant; if E2 holds at the ALGEBRA
    level (M3), a first-fall/solving-degree bound measured on one binary curve does
    not transfer to ECC2K-130. But 8ac1ea's strongest outcome (C) is an explicit
    SCOPE LIMIT, not a speedup: no exponent moves, and matched rho 2^60.8 dominates.
    Crucially the design runs at arity m_a=2,3, far below the m>=5 the product-law
    floor requires to threaten rho on ECC2K-130; so it bears on how per-instance
    cost is attributed, never on whether index calculus beats rho at n=131.
  agreement_with_hold: agrees
  agreement_note: >-
    Agree with design_after (HOLD-J), filed under RQ-NISTBIN-06157b, sharing the
    HOLD-I basis-general descent generator. It is the best-designed record in the
    lane: the C-GK null object (sparse S_3 without tau) genuinely exists nowhere in
    the standard and is the missing control for every "Koblitz" claim in the corpus.
    A10 (n=29 hosts no stable subspace) is confirmed and correctly harmless. The
    only edit is the ownership routing and the FIPS re-derivation gate.
  concrete_experiment:
    cell:
      curve: >-
        ONE field F_{2^23} (prime), one reduction polynomial, FOUR curves:
        C-KK (a in F_2, b=1), C-GK (a generic, b=1), C-KG (a in F_2, b generic),
        C-GG (a,b generic). Reproduction fixture: Trimoska n=17 curve a=b=1 =
        cell C-KK (also CERTBIN RC-1-adjacent).
      m: 2
      l: 11
      factor_base: 'one fixed F_2-subspace V of dimension l=11, identical across all four cells'
      targets: 'targets drawn in the same class of the same subgroup G in every cell; >=20 certified-UNSAT + >=20 certified-SAT per cell'
      seeds: 'identity control = same cell, same instances, different seeds'
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/macaulay.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/instances.py
      - 'new: basis/curve-general descent generator (shared HOLD-I/J build)'
      - 'missing: WDSat (M4 conflict counts); M1/M2/M3/M5 run on the pure-Python impl'
    procedure:
      - Step 0 (zero compute) -- expand the Weil descent of S_3 symbolically; confirm b appears only in the degree-0 term and a appears nowhere in S_3; compute constant-vector weight (M1) per cell (predicted 1 for b=1, ~Binomial(n,1/2) for generic b).
      - Step 1 -- build the four curves; compute #E, r, h, Tr(a).
      - Step 2 -- exhaustively enumerate V, compute |Fb_E ∩ V| and the pair table for m_a=2 (2^22 tests), giving lambda_x per cell (M2).
      - Step 3 -- build the descended system per cell on matched targets; compute the degree-by-degree Macaulay rank profile and first-fall degree (M3); verify the top-degree part is identical across cells FIRST.
      - Step 4 -- (if WDSat present) >=20 UNSAT + >=20 SAT per cell, with and without preprocessing (M4); Step 5 -- C-KK only, <tau,-1> orbit count and matched rho (M5); Step 6 -- repeat at n=29 to separate cell from n effects.
    metrics:
      - name: constant_vector_weight (M1)
        unit: nonzero F_2 coordinates
        definition: exactly 1 in b=1 cells, in [n/2-2sqrt(n), n/2+2sqrt(n)] for generic b
      - name: macaulay_rank_profile / first_fall_degree (M3)
        unit: integer per degree
        definition: predicted identical across all four cells (zero-variance); a single differing rank is the E2-strong outcome
      - name: lambda_x yield ratio across the a-contrast (M2)
        unit: dimensionless / zero-nonzero
        definition: exactly 0 on Tr(a)=1 cells with V in ker Tr and odd m_a; strictly positive on Tr(a)=0 cells (E3)
    controls:
      - 'IDENTITY (N1): same cell, same instances, different seeds -- noise floor.'
      - 'TRANSPORTED-CURVE NULL (N2): two independently drawn b-generic curves in the same cell must agree within N1.'
      - 'GENERIC-GROUP (N3): relabelled Z/rZ with a random-labelled factor base of the same size, for the yield bookkeeping.'
      - 'KNOWN-FALSE: V in ker Tr, odd m_a, Tr(a)=1 cell must give exactly zero G-decompositions.'
      - 'REPRODUCTION: n=17 Trimoska fixture recomputed before any cell is reported.'
      - 'MATCHED BASELINE: rho per cell with its own symmetry group (sqrt(pi r/(4n)) on C-KK, 0.886 sqrt(r) elsewhere).'
    outcomes:
      positive (E2-algebra, outcome C): M3 rank profile differs across the b-contrast -- a degree bound on one binary curve does not transfer to another over the same field; a scope limit on every filed Assumption-1 statement.
      negative (E1, outcome A): all four cells agree in M3 and M4 within the noise floor and only M5 separates C-KK -- the Koblitz advantage is exactly the orbit quotient; reachability table may use 5 attack columns for 10 curves.
      artifact (outcome E): N2 fails -- two C-KG curves disagree beyond the noise floor; the unit of comparison is the curve, the 2x2 is under-powered, and the honest output is a required-sample-size calculation.
    falsification_threshold: >-
      A C-KK/C-GK per-instance conflict (or rank) ratio outside [0.9,1.1] contradicts
      IDEA-20260906-a77711 arm A at the SAT level; a non-zero G-decomposition at odd
      m_a on a Tr(a)=1 cell with V in ker Tr falsifies the class criterion; a
      differing top-degree part across cells is an instrument failure (halt).
    estimated_cost:
      implementation: medium
      compute: low (four curves, 2^11 subspace, 2^22 pairs, degree-4 GF(2) Macaulay ranks within the pure-Python budget; ESTIMATE hours)
    zero_run_prerequisites:
      - Re-derive sect163k1/sect163r2 (a,b,h,order) from FIPS 186-4.
      - Step 0 symbolic verification that S_3's Weil descent writes b to degree 0 only.
      - basis/curve-general descent generator.
  successor_seam: >-
    If outcome (C) holds -- the Macaulay rank profile moves with b although the
    leading forms are identical -- the successor is a record that measures the
    TRANSFERABILITY of a first-fall/solving-degree bound across curves over one
    field as a function of the constant-vector weight, i.e. how far a bound measured
    on b=1 (ECC2K-130's own case) mis-predicts a generic-b curve. That directly
    scopes every Assumption-1 statement the SEMBIN/DREG lanes are spending budget on
    and tells the ECC2K-130 reachability decision whether its own b=1 sparsity makes
    its measured solving degree an outlier rather than a representative.
