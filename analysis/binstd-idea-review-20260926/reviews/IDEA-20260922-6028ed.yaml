review:
  idea_id: IDEA-20260922-6028ed
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-002d0e
  ranking_context:
    rank: 13
    disposition: queued_for_design
    hold_id: HOLD-F
  claim_restated: >-
    RQ-BINSTD-b6f698's decision target names a maintained reachability table,
    but no such object exists: the verdicts live as prose inside proposal
    records and nothing detects when a cell's provenance rots. Proposal: one
    schema-typed YAML artifact whose cells carry a verdict (STRUCTURALLY_EMPTY /
    COMPUTED / OPEN / NOT_YET_ASSESSED), a certificate pointer with sha256, an
    input-record list, a formula, an extrapolation distance and a controlled
    missing_quantity vocabulary; plus a validator in the tools/validate_ledger.py
    check_* pattern that re-hashes certificates, refuses cells whose inputs are
    superseded, and flags OPEN cells whose missing quantity a later record names.
    Tested by a six-case synthetic-mutation battery. Infrastructure, no attack.
  core_argument_check:
    - step: '(A) no reachability-table artifact exists'
      verdict: holds
      note: 'find over the repository (excluding .git) returns no reachability table under analysis/ or ledger/; the hits are unrelated (formal/targets/ncp-reachability.yaml, GOAL-SSI/ECQ task outputs). No ledger/experiments directory and no EXP-BINSTD-* exists.'
    - step: 'tools/validate_ledger.py implements the check_* / Ctx pattern with check_schema_supersessions'
      verdict: holds
      note: check_cross_refs (line 843), check_schema_supersessions (1143), check_knowledge_entries (1665) exist.
    - step: '~180 cells'
      verdict: holds
      note: 31 dumped curves x about 6 columns; ECC2K-130 is not in the OpenSSL dump and must be added by hand as a row, which the record does not say.
    - step: 'the two live checks (hash, supersession) catch the named staleness modes; six-case battery'
      verdict: holds
      note: Design argument; deterministic and cheap. Cannot catch content drift, as the record discloses.
    - step: 'a single YAML file is the right unit of storage in this repository'
      verdict: defective
      note: >-
        CLAUDE.md's concurrency rules exist because many worktrees write the
        same file: goal checkpoints were sharded to one write-once file per batch
        for exactly this reason, and generated aggregates (knowledge/INDEX.md,
        dispatch plans) are gitignored and rebuilt. A single 180-cell YAML
        written by every BINSTD, CERTBIN, FROB and QSP campaign is the goal-head
        conflict pattern reproduced. Cells should be one write-once file each
        (superseded, never edited) with the table view derived and gitignored.
    - step: 'the schema carries what the brief and the sibling reviews need per cell'
      verdict: defective
      note: >-
        Missing fields: (i) unit per cell (rho in group operations; filed IC
        laws in SAT conflicts, field operations, wall clock -- 1a081a's own
        confounder); (ii) arity m and the product-law floor / oracle budget per
        decomposition cell (the brief's central number; re-derived here as min
        over l of m! 2^(N-(m-1)l) + m 2^(2l)); (iii) the rho convention pointer
        (CORR-20260922-81aeab) beside matched_rho_row; (iv) a provenance tier for
        the number (proposal-time arithmetic / analysis / evidence) so a cell
        seeded from a review is never read as evidence.
  verdict: sound_with_corrections
  defects:
    - what: 'One shared YAML file contradicts the repository''s own write-once sharding discipline'
      where: claim (C); minimal_test STAGE 1
      fix: 'One file per cell under analysis/binstd-curve-audit/reachability/<curve>/<column>.yaml, write-once with a superseded_by field; the table view is a generated, gitignored artifact rebuilt by the validator (same pattern as knowledge/INDEX.md).'
    - what: 'Schema lacks unit, arity m, product-law floor/budget, rho convention pointer, and a provenance tier'
      where: claim (C) cell record
      fix: 'Add unit (controlled vocabulary), m, floor_bits and budget_bits with the formula and N used, rho_convention: CORR-20260922-81aeab, and provenance_tier in {proposal_arithmetic, analysis, evidence}; 818b73''s gamma* becomes the budget column.'
    - what: 'ECC2K-130 is absent from the OpenSSL dump the seed reads'
      where: minimal_test STAGE 1
      fix: Add the ECC2K-130 row by hand from KN-LIT-661e97 with the 129-bit prime l and h = 4.
    - what: 'Stage 1 seeds COMPUTED cells from 77bf31''s g/B bound and OPEN cells from 29b1c5-style verdicts; two of the sources are corrected by this review lane'
      where: minimal_test STAGE 1; transcription-fidelity control
      fix: Seed only from cells whose arithmetic has been independently re-derived (this lane's summary lists them) and mark them provenance_tier proposal_arithmetic.
  ecc2k130_bearing: >-
    None as content; as the carrier it must hold the ECC2K-130 row correctly:
    matched rho 2^60.81 under sqrt(pi*l/(4*131)) with l the 129-bit prime (the
    order 4l re-derived from the Weil recursion, t = -1); per decomposition
    column the arity m, the product-law floor (89.25, 68.58, 56.40, 48.44, 42.85,
    35.61 at m = 2..8, reproduced exactly) and the oracle budget (none at m <= 3;
    2^4.41, 2^12.37, 2^17.96, 2^25.2 at m = 4, 5, 6, 8); the one measured oracle
    (KN-FIND-aa2efc's Riemann-Roch at m = 3, 2.02x brute force, d = 6, external
    provenance) as a COMPUTED cell with its tier; the stable-subspace column
    STRUCTURALLY_EMPTY with ord_131(2) = 130; the GHS column STRUCTURALLY_EMPTY
    with 131 prime; the QSP column with |F| <= 2401 and the >= 110-bit attempts
    column (IDEA-20260916-3f7a1c). No arity is implied by the record itself.
  agreement_with_hold: agrees
  agreement_note: >-
    A tooling carrier seeded from 1a081a's baseline column, with 818b73's
    gamma* as a column under a unit caveat, is the right disposition. The carrier
    should be sharded per cell and the schema extended as above before it is
    seeded, or the first version will need superseding immediately.
  concrete_experiment:
    cell:
      curve: 'Seed rows: ECC2K-130 (by hand), the ten FIPS curves, sect193r1/r2, sect239k1, sect131r1/r2, c2pnb176v1/208w1/272w1/304w1/368w1 (from the dump). Seed columns: matched_rho, GHS_cover, subfield_rational_base, phi_stable_subspace_base, decomposition_m (one cell per m in {2..8}), QSP, descent.'
      m: 0
      l: 0
      factor_base: 'not applicable (table object); each decomposition cell names its m and its floor'
      targets: 'not applicable'
      seeds: 'the synthetic battery uses a scratch copy; no random seed'
    instrument:
      - 'tools/validate_reachability_table.py (to be written, following tools/validate_ledger.py check_schema_supersessions at line 1143 and check_cross_refs at 843)'
      - 'analysis/binstd-curve-audit/subfield_scan.py and subfield_certify.py (certificate producers, to be hashed)'
      - 'the rho/floor arithmetic script from this review lane (to be committed under analysis/ as the seed producer)'
    procedure:
      - '1. Write the per-cell schema with unit, m, floor_bits, budget_bits, rho_convention, provenance_tier, certificate {path, sha256, assertion}, inputs, superseded_by.'
      - '2. Seed only re-derived cells: the thirteen matched-rho rows, the GHS column on prime-degree rows, the subfield-rational column on the five c2pnb rows and ECC2K-130, the stable-subspace column on prime-degree rows (ord_n(2) values), the ECC2K-130 decomposition floors at m = 2..8; everything else NOT_YET_ASSESSED.'
      - '3. Implement the validator (schema, hash, supersession, liveness grep) and the generated table view.'
      - '4. Run the six-case battery on a scratch copy: valid; one-byte certificate change; missing input id; synthetic CORR superseding an input; bad missing_quantity string; unrelated new record.'
      - '5. Report per-case pass/fail with the named cell and pointer, runtime, and the transcription-fidelity diff against the source arithmetic.'
    metrics:
      - name: battery_pass_count
        unit: cases out of 6
        definition: expected verdict reproduced per case with the failing cell and pointer named
      - name: transcription_fidelity
        unit: fraction of seeded cells
        definition: cells whose numbers match the independent re-derivation to 0.01 bit
      - name: validator_runtime
        unit: seconds
        definition: wall time of a full validation over the seeded cells
    controls:
      - unrelated-record case 6 (false-positive control)
      - valid-table case 1
      - scratch-copy discipline for every mutation
      - independent re-derivation of every seeded number (this lane's arithmetic) before transcription
    outcomes:
      positive: '6/6 and 100 percent transcription fidelity: the carrier exists, is sharded, and can be proposed for CI.'
      negative: 'A battery case fails: the named gap (a staleness mode the pointers miss, or a false positive) is fixed before any CI proposal.'
      artifact: 'The unmutated seed fails its own validator: schema/seed mismatch, fixed first.'
    falsification_threshold: 'battery_pass_count < 6; any seeded cell differing from its re-derivation by more than 0.01 bit; any cell without a unit.'
    estimated_cost:
      implementation: low
      compute: 'sub-second per validation; the whole battery in seconds (estimate)'
    zero_run_prerequisites:
      - Coordinator decision on per-cell sharding and on the generated view being gitignored
      - the corrected conventions (CORR-20260922-81aeab) and the corrected 29b1c5 verdicts applied to the seed
  successor_seam: none
  records_read:
    - IDEA-20260922-6028ed (full)
    - IDEA-20260922-77bf31 (full)
    - IDEA-20260922-818b73 (full)
    - tools/validate_ledger.py (function index)
    - CLAUDE.md concurrency section
    - RQ-BINSTD-b6f698
    - DEC-20260924-99ce20 (HOLD-F)
  not_read:
    - IDEA-20260922-2e2a58
    - IDEA-20260922-b19793 (grep only)
    - .github/workflows/main-health.yml
