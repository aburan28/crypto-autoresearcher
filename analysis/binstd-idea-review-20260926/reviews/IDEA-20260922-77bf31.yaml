review:
  idea_id: IDEA-20260922-77bf31
  reviewed_at: '2026-09-26'
  reviewer_lane: TASK-20260926-002d0e
  ranking_context:
    rank: 15
    disposition: queued_for_design
    hold_id: HOLD-G
  claim_restated: >-
    For every decomposition column over a single-level factor base the
    individual logarithm is one expected successful decomposition of a
    re-randomised target, so its charge is g/B of the relation phase (g the
    Frobenius orbit gain, B the base size): below 2^-19 at every standardized
    row, so charging the descent column at zero is correct to that relative
    error. For the GHS/cover column on the five c2pnb rows the same argument
    fails (partial base, genuine smoothness descent) and the cell is OPEN with
    the covering genus named. The residue is the per-attempt re-randomisation
    cost: on a tau-stable base tau is worth zero new trials (the indicator is
    constant on tau-orbits), and the lag-1 autocorrelation of the
    decomposability indicator along a translate walk R <- R + W is unmeasured
    and measurable at n <= 41 in minutes.
  core_argument_check:
    - step: '(A) single-level base: the individual logarithm is one decomposition, no descent tree'
      verdict: holds
      note: Standard; the target re-randomised to [a]P + [b]Q decomposes with the same p as a relation target.
    - step: '(B) descent/relations = 1/R_need + C_rerand p/(R_need C_att); share g/B under R_need = B/g'
      verdict: holds
      note: Identity given the definitions; conditional on the orbit-collapse reading of R_need (S2 / IDEA-20260922-b19793); the bound only strengthens if R_need = B.
    - step: '(C) computed rows: ECC2K-130 m = 4 share < 2^-25.9; m = 5 < 2^-19.9; K-163 < 2^-33.6; K-571 < 2^-133.8; c2pnb368w1 < 2^-87.5'
      verdict: holds
      note: 'Re-derived with l = ceil(n/m): l = 33, 27, 41, 143, 92; g = 2^7.03, 7.03, 7.35, 9.16, 4.52; shares 2^-25.97, -19.97, -33.65, -133.84, -87.48.'
    - step: '(D) the cover column is OPEN with g_H named'
      verdict: holds
      note: Correctly refused on a recalled literature property; no number written.
    - step: '(E) chi(tau R) = chi(R) whenever V is tau-stable'
      verdict: holds
      note: Two lines; unconditional.
    - step: '(E) as applied to "Koblitz rows": the free re-randomiser tau is worth zero new trials on every Koblitz row'
      verdict: defective
      note: >-
        Only for a tau-stable V. On ECC2K-130 there is no tau-stable F_2-subspace
        of dimension 2..129 (ord_131(2) = 130, re-derived), and likewise none at
        K-163 (ord 162), K-409 (ord 204 gives dims {0,1,204,205}), sect239k1
        (ord 119); K-233 (ord 29) and K-283 (ord 94) do host some. For a
        NON-stable V, chi_V(tau R) = chi_{tau^{-1} V}(R) (IDEA-20260906-a77711's
        equivariance), so the 131 conjugates tau^j(R) are 131 attempts over 131
        different bases at one squaring each -- the CHEAPEST re-randomiser on
        ECC2K-130, and not trivially correlated. The record's reading applies to
        orbit-union (tau-stable set) bases and should say so; for subspace bases
        on ECC2K-130 it inverts.
    - step: 'toy grid n in {17, 19, 23, 29, 31, 37, 41}, V tau-stable of dimension l = ceil(n/m), m in {3, 4}'
      verdict: defective
      note: >-
        Re-derived stable dimension sets: n = 17 {0,1,8,9,16,17}; 19 {0,1,18,19};
        23 {0,1,11,12,22,23}; 29 {0,1,28,29}; 31 {0,1,5,6,...,25,26,30,31};
        37 {0,1,36,37}; 41 {0,1,20,21,40,41}. A tau-stable V of dimension
        ceil(n/m) exists only at (31, m = 3, l = 11) among the record's m in
        {3, 4}, and at (17, 2, 9), (23, 2, 12), (31, 2, 16), (41, 2, 21) for
        m = 2. n = 19, 29, 37 host no nontrivial stable subspace at all -- the
        defect HOLD-T named for IDEA-20260922-493606. ARM A cannot run as
        written on six of the seven n.
    - step: 'toy Koblitz curves y^2 + xy = x^3 + 1 at those n have a usable prime-order subgroup'
      verdict: defective
      note: >-
        Orders re-derived from the Weil recursion (t = -1 for a = 0, t = +1 for
        a = 1): n = 17 a = 0: 4 * 137 * 239 (no large prime); a = 1: 2 * 65587
        (prime); n = 23 a = 0: 4 * 2095853 (prime); n = 31 a = 0: 4 * 373 *
        1439393; a = 1: 2 * 26041 * 41231; n = 41 a = 0: 4 * 549756390943 (prime).
        The record fixes a = 0 and does not check; at n = 17 the a = 1 curve is
        the one with a prime subgroup (8fe0ef's r = 65587 cell).
    - step: 'fresh scalar multiplication costs about 1.5 n group operations'
      verdict: defective
      note: On a Koblitz curve a tau-adic (TNAF) scalar multiplication costs about n/3 additions plus free squarings; the comparison in the tradeoff note overstates the alternative by about 4.5x. Minor.
    - step: 'the descent column on ECC2K-130 matters to reachability'
      verdict: holds
      note: It does not, and the record does not claim it does; the m = 4 line sits at the 2^56.40 product-law floor and the descent share 2^-26 is invisible there.
  verdict: sound_with_corrections
  defects:
    - what: 'Limb (E) conflates "Koblitz row" with "tau-stable V"; on ECC2K-130 no useful tau-stable subspace exists and tau is then the cheapest non-trivial re-randomiser'
      where: claim (E); mechanism WHY THE FREE SYMMETRY IS USELESS; predictions 1
      fix: Scope (E) to tau-stable SETS (orbit unions) and add the non-stable case with the equivariance reading; measure the tau-walk autocorrelation on a non-stable V as a fourth arm.
    - what: 'Stage 1 grid is unrunnable as written at six of seven n'
      where: minimal_test STAGE 1; heuristic H-BINSTD-DESC-1 validation_plan
      fix: 'Use (17, 2, 9) on the a = 1 curve, (23, 2, 12) and (41, 2, 21) on a = 0, and (31, 3, 11) on the 1439393-order subgroup; or use orbit-union sets at every n with l free.'
    - what: 'Curve choice a = 0 unchecked for a prime subgroup'
      where: minimal_test STAGE 1
      fix: Name the curve per cell with its factored order (above).
    - what: 'Scalar-multiplication cost on Koblitz rows overstated'
      where: claim (E); tradeoff_note; proof_search_map.bottleneck
      fix: Use about n/3 additions for TNAF; the W-translate advantage is then a factor n/3, not 1.5 n.
  ecc2k130_bearing: >-
    The record applies at every arity and moves no floor. On ECC2K-130 at m = 4
    the descent share is 2^-26 of the relation phase, so the descent column is not
    where the 2^4.41 oracle budget is spent; the re-randomisation multiplier
    1/(1 - rho_1) multiplies the relation phase and therefore the product-law
    floor itself, which is why (E) is worth measuring. With the correction above,
    the interesting ECC2K-130 statement is the inverse of the record's: for any
    F_2-subspace V there, tau gives 131 conjugate targets at one normal-basis
    squaring each, whose decomposition systems are images of one another under
    the equivariance; their indicator correlation is unmeasured and is the
    cheapest attempt generator the curve offers. Orbit-union bases (tau-stable
    sets) are the case where tau is worth nothing, as the record says.
  agreement_with_hold: agrees
  agreement_note: >-
    HOLD-G (Stage 0 only; Stage 1 belongs to ICPERF's phase instrument) is right
    on ownership. Stage 0's deliverable should carry the two corrections (scope
    of (E); the runnable grid) so that the ICPERF arm inherits a design that can
    run. Stage 1 at (17, 2, 9) is minutes of pure Python and could ride along.
  concrete_experiment:
    cell:
      curve: 'n = 17, F_2[t]/(t^17+t^3+1): Koblitz y^2 + xy = x^3 + x^2 + 1 (a = 1, b = 1, order 2 * 65587, r = 65587 prime) beside the RC-1 ordinary curve A = 97044, B = 126251 (DEC-20260926-cb4487) as the null; second cell (23, 2, 12) on y^2 + xy = x^3 + 1 (order 4 * 2095853).'
      m: 2
      l: 9
      factor_base: 'V_stable = the ideal of one degree-8 irreducible factor of Phi_17 in the F_2[T]/(T^17-1)-module (dimension 9, tau-stable); V_poly = {deg < 9} polynomial basis (RC-1''s V, not tau-stable); on the null curve V_poly only'
      targets: 'ARM A: all 65587 subgroup points, exhaustive; ARM B/C: 10^3 seeds x 10^3 steps; ARM E: 10^5 fresh scalar targets'
      seeds: 'seed 20260926; W chosen as a random subgroup point not in the base with ord(W) = r > 10 x series length (automatic since r is prime)'
    instrument:
      - 'experiments/EXP-CERTBIN-e94b27/impl/gf2n.py and curve.py (Field(17, t^17+t^3+1) is the shipped constant; both import numpy: missing: numpy in this container; numpy-free port about 150 lines)'
      - 'a sumset-membership routine: chi(R) = exists P in F with R - P in F, one hash lookup per base point (2^9 per target)'
      - 'a tau-stable subspace constructor: factor T^17 - 1 over F_2 (two degree-8 factors of Phi_17), normal-basis change (about 60 lines)'
      - 'block-bootstrap autocorrelation estimator (about 30 lines)'
    procedure:
      - '1. Stage 0: write limb (B), the g = 1 slice, the tau-equivariance proof scoped to tau-stable sets, and the corrected limb (C) table; emit the descent-column verdicts.'
      - '2. ARM A (positive control): on V_stable, chi constant on every tau-orbit of the 65587 targets; predicted concordance 1.000.'
      - '3. ARM A'' (the new arm): on V_poly, fraction of tau-orbits with chi constant, versus the chance value from Pr[chi = 1]; and the lag-j autocorrelation of chi along tau-orbits (j = 1..16).'
      - '4. ARM B: W-translate walk on both bases; lag-1 and lag-2 autocorrelation with block bootstrap; three W plus one W in the base.'
      - '5. ARM C (negative control): V_stable with one element deleted per orbit; concordance must drop.'
      - '6. ARM D (null): RC-1 ordinary curve, V_poly, ARM B repeated; ARM A undefined by construction.'
      - '7. ARM E (independence anchor): fresh scalar targets; calibrates the estimator.'
      - '8. Stage 2 on this cell: relation collection to R_need and one individual logarithm on one frozen instance set, one counter; measured descent/relation ratio against g/B = 17/512.'
    metrics:
      - name: tau_orbit_concordance
        unit: fraction of orbits
        definition: 'orbits on which chi is constant (V_stable: predicted 1.000; V_poly: measured)'
      - name: rho_1_W_walk
        unit: correlation coefficient
        definition: lag-1 autocorrelation of chi along R <- R + W with block-bootstrap 95 percent interval
      - name: rho_j_tau_walk
        unit: correlation coefficient
        definition: lag-j autocorrelation of chi along tau^j(R) on V_poly, j = 1..16
      - name: descent_over_relation_ops
        unit: dimensionless
        definition: charged group operations of the individual logarithm divided by those of relation collection on one frozen instance set; predicted g/B within 1.5x
    controls:
      - positive control ARM A on V_stable (blocking)
      - negative control ARM C (blocking)
      - null curve ARM D (RC-1, same field, same V_poly)
      - independence anchor ARM E
      - g = 1 symbolic slice
      - W-choice sensitivity (three W, one in the base)
      - matched rho on the same curves (negation-only 2^7.83 on RC-1''s subgroup size; minus 0.5*log2 17 on the Koblitz cell)
    outcomes:
      positive: '|rho_1| < 0.05 on the W-walk and on the tau-walk over V_poly, concordance 1.000 on V_stable: cheap re-randomisers are sound, and on non-stable bases tau supplies n independent attempts per squaring -- the multiplier in front of the relation phase is 1 and the free conjugates are usable.'
      negative: '|rho_1| >= 0.05 on either walk: the effective attempt count is inflated by 1/(1 - rho_1) and every walk-based yield instrument inherits it; limb (C) is unaffected.'
      artifact: 'ARM E reports |rho_1| >= 0.05, or ARM A on V_stable is not 1.000: the estimator or the stability constructor is broken; nothing is read.'
    falsification_threshold: 'Concordance != 1.000 on V_stable; measured descent/relation ratio > 10 g/B; ARM E |rho_1| >= 0.05 (uninterpretable); tau-walk |rho_1| >= 0.05 on V_poly refutes the corrected reading that conjugates are independent attempts.'
    estimated_cost:
      implementation: low
      compute: 'minutes per arm at n = 17 in pure Python; under an hour for the (23, 2, 12) cell (estimate)'
    zero_run_prerequisites:
      - scope limb (E) to tau-stable sets and add the equivariance reading
      - fix the runnable grid and the curve per cell
      - S2''s decision on R_need = B/g (affects only the constant in limb (C))
  successor_seam: >-
    TAU AS THE FREE ATTEMPT GENERATOR ON ECC2K-130 FOR NON-STABLE BASES: the 131
    conjugate targets tau^j(R) cost one normal-basis squaring each and their
    descended systems are images of one instance's system under a linear change
    of the factor-base coordinates (IDEA-20260906-a77711); the proposal measures
    (i) the independence of their decomposability indicators (the autocorrelation
    above) and (ii) how much Macaulay / W_4 elimination work is shareable across
    the 131 images on the RC-1-style cells (discriminated from
    IDEA-20260923-5d0b8e's trace-replay, which reuses a fixed base's trace
    across targets rather than transporting one system across conjugate bases).
    Owner RQ-CERTBIN-836ce2. Priced against the product law: it does not change
    the floor, but if the per-attempt cost of the 130 images is a fraction of the
    first, the oracle budget 2^4.41 at m = 4 is met by amortisation across
    conjugates rather than by a faster solver.
