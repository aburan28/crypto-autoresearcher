idea:
  id: IDEA-20260731-015
  question_id: RQ-ECDLP-002
  title: >-
    Public-scalar factor base — the linear-algebra and relation-collection
    stages of prime-field index calculus are removable by construction, and the
    standing alpha < 3/2 gate belongs to a dominated variant
  class: algorithm
  claim: >-
    Let E/F_p carry a prime-order subgroup G = <P> of order N, and let the
    factor base be chosen as F = {s_i * P : s_i in Z_N, i = 1..B} with the
    scalars s_i PUBLIC (B = N^beta). The discrete logarithm of every base
    element is then known by construction, so a single successful decomposition
    of the masked target R_t = Q + tP over F yields k directly: k = +/-sum(s_i)
    - t (mod N), verified by one re-multiplication. The relation-collection and
    linear-algebra stages of the ledger's IC model (H-IC-001: C_IC(K) =
    S_rel + S_LA + K*T_desc; IDEA-20260727-003 free-oracle floor with the
    c_LA*B^omega_LA term; IDEA-20260727-007's budget E = max((1+alpha)/m,
    omega_LA/m, 1/m)) exist only to determine unknown base logarithms and are
    REMOVED by construction. The assembled per-target exponent for the direct
    variant is E_direct = max(alpha/m, 1/m, base-construction) = alpha/m for
    alpha > 1, where alpha is the SAME amortized membership-query exponent of
    IDEA-20260727-007 (query cost B^alpha), and the single-target gate becomes
    alpha < m/2 (at m = 5: alpha < 2.5) instead of alpha < 3/2. Consequently:
    (i) IDEA-20260727-007's alpha < 3/2 gate and IDEA-20260727-003's m >= 5
    necessity are the gates of the DOMINATED unknown-log variant; (ii) the
    m = 4 direct-variant gate is alpha < 2; (iii) if the direct variant holds,
    SG-ECDLP-004's multi-target amortization framing (one matrix, T descents)
    collapses to per-target descent alone. The open quantity is unchanged:
    the amortized-over-yield alpha (pre-registered per IDEA-20260727-007).
    CLAIM: at toy scale, the measured end-to-end direct-variant exponent
    E_direct_measured (yield-charged group ops per target, fitted against N)
    equals alpha/m within fit error at m in {3, 4, 5} and is strictly below
    1/2 for at least one admissible (m, alpha) cell; the unknown-log variant's
    measured total (S_rel + S_LA + T_desc) is >= the direct variant's on the
    same instances. The falsifier is on E_direct_measured: if it is >= 1/2 at
    every tested cell, the budget correction is wrong as stated and the direct
    route closes at tested scope.
  mechanism: >-
    ATTACK OBJECT: the factor base as a charged construction — specifically the
    choice of known-log base elements (public scalars s_i) versus unknown-log
    random points, and the resulting assembled cost model of the IC lane. In
    the ledger's IC model the base logarithms are unknowns determined by
    B-1 relations plus a sparse solve; the entire S_rel + S_LA charge is an
    artifact of that choice. A base F = {s_i*P} with public scalars removes it:
    per target, draw t, compute R_t = Q + tP, run the committed membership test
    (Semaev S_{m+1} plus indicator factors over the base x-set — the same test
    the unknown-log variant's descent runs), and on the first success read off
    k from the public scalars of the found subset. Expected attempts per
    success is m!/coverage (the EV-FBG-001 conservation identity and its
    bounded coverage channel apply to ANY base of size B, so the base-design
    channel is deliberately NOT claimed here); each attempt costs one query at
    cost B^alpha, so the per-target cost is m! * B^alpha * (coverage
    correction), exponent alpha/m at beta = 1/m. The x-only sign ambiguity (a
    tuple whose x-sum is x(R_t) corresponds to R_t or -R_t) resolves in both
    readings (k = +/-sum - t), so no failure mode is hidden there. This record
    is the descent path made total: it is the budget reading that the external
    corpus's "a descent-only improvement cannot cross rho by itself" (C2 in
    idea_generation_20260727_claude_candidates.yaml) implicitly rejects by
    assuming collection is unavoidable; the toy measurement decides between the
    corpus's reading and the public-scalar reading. It composes with, and is
    orthogonal to, the membership-test-level claw (IDEA-20260731-007 /
    SG-ECDLP-001) and the LP-1 harvest (IDEA-20260731-012): each improves the
    query constant/alpha, this record removes the collection and LA stages.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-07-31'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/hypotheses
    - ledger/evidence
    - knowledge/INDEX.md
    - knowledge/techniques
    - knowledge/open-problems
    - knowledge/literature
    - coordination/goals/GOAL-ECDLP-001
    - research/idea_generation_20260727_claude_candidates.yaml
    grep_results:
    - >-
      H-IC-001 (weakened) and EV-IC-002 charge C_IC(K) = S_rel + S_LA +
      K*T_desc with the base log table computed by relation collection plus
      sparse linear algebra; the base-log unknowns are never questioned.
      IDEA-20260727-003's free-oracle floor and IDEA-20260727-007's E =
      max((1+alpha)/m, omega_LA/m, 1/m) charge the LA stage unconditionally;
      neither considers a known-log base.
    - >-
      "known-log" in the corpus refers exclusively to CONTROL TARGETS (known-log
      endpoints / relation targets vs fresh scalar-blind masked targets: the
      calibration pattern of GOAL-CRYPTO-001 and the EXP-SCR/EXP-STR families)
      and to forbidden "known-log selectors/advice" in rejected-contract
      preflights; no record uses a factor base whose ELEMENTS carry public
      scalars as the attack construction, and no record states that collection
      and LA are removable by construction.
    - >-
      The external corpus's C2 entry (idea_generation_20260727_claude_candidates.yaml)
      states "the m=5 index-calculus bottleneck is relation collection... a
      descent-only improvement cannot cross rho by itself" — the claim this
      record directly tests; the corpus never justifies WHY collection is
      unavoidable for an attacker free to choose base elements.
    - >-
      EV-SUBRES-001 bounds the m=5 membership query as ops_per_query = O(L^5) =
      O(q) for any curve/base (an upper bound on alpha); EV-FBG-001 /
      DEC-20260724-020 settled the coverage channel (mean yield is
      geometry-invariant by the conservation identity; coverage headroom
      bounded <= 1.582x at m=3) — both are reused as controls, not duplicated.
    - >-
      SG-ECDLP-004 (multi-target amortization) charges one matrix and T
      descents; this record removes the matrix for the known-log base, which
      changes SG-ECDLP-004's break-even analysis — a stated consequence, not a
      duplicate.
    literature_verified: []
    conclusion: >-
      The decomposition attack with known-log base elements is elementary and
      likely folklore in the general IC literature, but this corpus's standing
      IC cost models (H-IC-001, IDEA-20260727-003, IDEA-20260727-007,
      SG-ECDLP-004) all charge collection and LA unconditionally and no record
      states the removal. The contribution is the budget correction relative to
      this ledger's own models plus the toy end-to-end measurement that decides
      it; novelty_status adaptation, not stronger.
  assumptions:
  - The base F = {s_i*P} has B = N^beta elements with distinct +/- classes
    (s_i not congruent to +/-s_j mod N), so the base x-set has B distinct
    values; the scalars are public but the base is otherwise an ordinary point
    set of size B (no coverage or yield advantage claimed — EV-FBG-001's
    conservation identity applies).
  - The membership test is the ledger's committed Semaev solve (S_{m+1} plus
    indicator factors, pinned engine), identical for the direct and unknown-log
    variants; alpha is the amortized-over-yield query exponent of
    IDEA-20260727-007, measured, never assumed.
  - Every failed attempt (t that does not decompose) is charged at full query
    cost toward the target — the EV-IC-001 uncharged-single-solve failure mode
    (DEC-20260727-008) is the specific trap this record pre-registers against.
  - Toy instances only for execution; any sub-1/2 measured exponent is a
    conditional budget requiring AGENTS.md rule 12 handling before any status
    change, never a standalone claim.
  predictions:
  - metric: direct_variant_end_to_end_exponent_E_direct
    direction: lower
    minimum_effect: >-
      Fitted E_direct_measured (total group ops per target, yield-charged, vs N
      on log-log axes, R^2 >= 0.90 over >= 3 sizes) equals alpha/m within 0.05
      at m in {3, 4, 5} and is < 1/2 at >= 1 tested (m, size) cell. The
      falsifier: E_direct_measured >= 1/2 at ALL tested cells.
  - metric: unknown_log_variant_total_over_direct
    direction: higher
    minimum_effect: >-
      On identical instances, (S_rel + S_LA + K*T_desc) for the unknown-log
      variant (scalars hidden, matrix solve) is >= the direct variant's total
      for K >= 1 at every tested cell; a measured ratio < 1 would mean the
      unknown-log variant has an unmodeled advantage and the budget correction
      is incomplete.
  - metric: alpha_consistency
    direction: different
    minimum_effect: >-
      The alpha implied by E_direct_measured (alpha = m * E_direct_measured)
      agrees with the independently measured amortized query exponent (per
      IDEA-20260727-007's pre-registration: total query cost over a campaign /
      usable relations) within 0.1 at every cell — the self-consistency check
      that the exponent is being attributed to the right stage.
  - metric: per_target_attempts_over_m_factorial
    direction: different
    minimum_effect: >-
      Measured attempts-per-success lies in [1, 2] * m! / coverage at every
      cell with coverage measured by exact enumeration at the smallest size —
      the EV-FBG-001 conservation-identity check, confirming no uncharged
      yield factor.
  minimal_test:
    design: >-
      (1) INSTANCES: toy prime-field curves at 16, 20, 24 bits, prime-order
      subgroups, 3 seeds; m in {3, 4, 5}; B = ceil((m!*N)^(1/m)) (tight
      beta = 1/m). (2) DIRECT VARIANT: build F = {s_i*P} with fresh public
      random scalars (distinct +/- classes); for each of >= 10 targets, run
      t-randomized attempts (fresh t per attempt) with the committed Semaev
      membership test until one success; read off k = +/-sum(s) - t; verify by
      re-multiplication (certificate). Record total group ops per target
      including ALL failed attempts. (3) UNKNOWN-LOG VARIANT (control): same
      base but scalars hidden; run relation collection to rank B-1, the sparse
      solve, then the same descent; record S_rel, S_LA, T_desc. (4) ALPHA
      MEASUREMENT: independently fit the amortized query exponent per
      IDEA-20260727-007 from a separate campaign. (5) COVERAGE: exact
      enumeration of reachable targets at the smallest size; the conservation
      identity check (mean = binomial(B+m-1,m)/N). (6) Fit E_direct_measured,
      report intervals, and assemble the comparison table vs 0.5 and vs matched
      rho.
    controls:
    - >-
      Matched Pollard rho (negation) and BSGS, same instances, same
      group-operation unit — the mandatory RQ-ECDLP-002 baselines.
    - >-
      Unknown-log variant on identical instances: the direct comparison that
      separates the LA/collection removal from any other advantage.
    - >-
      Yield-charging control: report per-attempt cost and attempts-per-success
      separately; the uncharged single-solve figure is reported and never
      substituted for the yield-charged cost (the EV-IC-001 trap,
      DEC-20260727-008).
    - >-
      Coverage/conservation control: measured coverage and mean yield against
      the EV-FBG-001 identity; a deviation beyond the pre-registered tolerance
      voids the yield accounting.
    - >-
      Planted-bug positive control: corrupt one base scalar; the certificate
      check must fail on the recovered k — the verification harness must be
      able to detect its own errors.
    - >-
      Sign-ambiguity control: for every successful decomposition, record which
      reading (R_t or -R_t) was used; both must produce the verified k, and the
      reading distribution must be reported (a biased reading would indicate a
      hidden selection effect).
    - >-
      Scale/decay control: E_direct_measured fitted over >= 3 sizes with
      pre-registered fit-quality rule (R^2 >= 0.90, else drop the size by the
      rule, not after seeing the exponent).
    required_metrics:
    - per-target total group ops (yield-charged) per (m, size, seed) cell
    - fitted E_direct_measured with interval and R^2
    - S_rel, S_LA, T_desc for the unknown-log variant per cell
    - independently measured alpha (amortized) and the implied alpha = m*E
    - attempts-per-success, coverage, and mean yield per cell
    - certificate pass rate and reading (sign) distribution
    - matched rho and BSGS op counts and BSGS memory
  falsification_conditions:
  - 'TOY-TIER FALSIFIER: E_direct_measured >= 1/2 at all tested (m, size) cells
    with successful verification — the public-scalar budget correction is wrong
    as stated (the per-target cost carries an unmodeled stage or an alpha bound
    above m/2); the direct route closes at tested scope, and the corpus''s
    standing gates (alpha < 3/2, m >= 5) remain the operative ones for the
    tested envelope. Toy-scope statement only.'
  - 'TOY-TIER FALSIFIER: alpha-consistency fails (|alpha_implied -
    alpha_measured| > 0.1 at any cell) — the exponent is misattributed and the
    run is void, not negative.'
  - 'CONDITIONAL-POSITIVE GATE: E_direct_measured < 1/2 at any tested cell is a
    conditional sub-rho budget under the measured alpha and the committed
    backend; per AGENTS.md rule 12 it requires independent review-breakthrough
    handling before any status change, and it must never be reported as a
    solve or as crypto-scale evidence (AGENTS.md rule 7).'
  - 'Infrastructure: unknown-log variant fails to reach rank B-1 within budget,
    or the certificate check fails on > 0 runs — infrastructure-inconclusive,
    not evidence against the budget correction.'
  confounders:
  - The committed Semaev backend's query cost at toy B may be constant-dominated
    (B in the low tens at 16 bits); the fit rule and the alpha-consistency
    check exist to stop a constant being read as an exponent.
  - The public-scalar base and the unknown-log base must be the SAME point set
    (only the scalar visibility differs); otherwise the comparison conflates
    base geometry with the LA-removal claim.
  - The coverage channel (EV-FBG-001 bounded <= 1.582x at m=3) is a constant,
    not an exponent; a coverage advantage must not be reported as an exponent
    move, and no base-design claim is made here.
  - Target reuse across seeds and base leakage across targets must be excluded
    by fresh scalars and fresh t per attempt; a reused t with a stored answer
    would undercharge the descent.
  interpretation_limits:
  - A confirmed E_direct_measured < 1/2 is a toy-scope conditional budget under
    the measured alpha and the committed backend; it does not by itself move
    any assembled crypto-scale exponent, and the alpha measurement remains the
    decisive open quantity (IDEA-20260727-007).
  - A confirmed budget correction changes this ledger's internal IC accounting
    (H-IC-001's S_rel + S_LA, IDEA-20260727-003's LA floor, IDEA-20260727-007's
    gate, SG-ECDLP-004's amortization) and must be reconciled with those
    records by the Coordinator; this proposal makes no status change to any of
    them.
  - The idea composes with IDEA-20260731-007/012 at the query level; the
    compositions are separate experiments, never merged into this record's
    metric.
  - Nothing here is evidence about ECDLP at cryptographic scale, and no claim
    about the unknown-log variant's standing is made beyond the direct
    comparison on identical instances.
  heuristic_assumptions:
  - id: HEUR-PS-1
    statement: >-
      The amortized membership-query exponent alpha is a property of the base
      as a POINT SET, not of the visibility of its scalars: the public-scalar
      base {s_i*P} has the same query-cost distribution as an unknown-log base
      of the same point set, so the direct variant's per-target cost is
      m! * B^alpha / coverage with the same alpha that IDEA-20260727-007
      measures on the unknown-log setup.
    rigorous_support: >-
      The rigorous anchor is that the membership test (Semaev S_{m+1} plus
      indicator factors) is a function of the x-coordinate set alone, and the
      public-scalar base's x-set is a set of B distinct field elements exactly
      like any base's; scalar visibility does not enter the polynomial system.
      The classical distribution statement imitated is the EV-FBG-001
      conservation identity (mean yield is geometry-invariant for ANY base of
      size B — archived, replicated). What is heuristic is the VALUE of alpha
      and its stability across bases — exactly the quantity IDEA-20260727-007
      pre-registered to measure.
    validation_plan: >-
      Sampled quantity: per-target yield-charged cost and the independently
      measured amortized alpha. Shortcut: toy B makes full campaigns and exact
      coverage enumeration feasible; no crypto-size Groebner call anywhere.
      Comparison distribution: E_direct_measured vs alpha/m (the
      self-consistency check) and vs 0.5 (the rho gate); the unknown-log
      variant's total provides the paired control on identical instances.
      Tail consistency check: attempts-per-success vs m!/coverage with the
      EV-FBG-001 identity. LABEL: TOY-SCALE; the alpha extrapolation is out of
      this minimal test.
  target_complexity:
    time_exponent: >-
      The assembled per-target exponent under test: E_direct = max(alpha/m,
      1/m) = alpha/m for alpha > 1, vs the ledger's standing
      E = max((1+alpha)/m, omega_LA/m, 1/m) (IDEA-20260727-007) and the
      free-oracle floor max(B, c_LA*B^omega_LA) (IDEA-20260727-003). At
      alpha = 1.5, m = 5: E_direct = 0.3 vs the standing E = 0.5 boundary. No
      exponent is claimed without the measured alpha.
    memory_exponent: >-
      B = N^{1/m} for the base x-set and the relation matrix of the unknown-log
      control; the direct variant needs no matrix — memory is B + query
      workspace, reported in bits under the shared convention.
    best_known: >-
      Pollard rho ~0.886 sqrt(N) (KN-TECH-001); BSGS 2^{n/2} x n*2^{n/2} bits
      (KN-TECH-031/035); the corpus's standing IC gates alpha < 3/2 (m=5) and
      m >= 5 (IDEA-20260727-003/007) — the numbers this record's budget
      correction challenges at toy scale.
    hidden_overhead: >-
      The query constant (engine constants, indicator-polynomial degree B) and
      the coverage factor (EV-FBG-001 bounded <= 1.582x at m=3) sit outside the
      exponent and are charged/reported; the alpha extrapolation to crypto size
      is a model statement and is not made here.
    tradeoff_note: >-
      Larger m lowers beta = 1/m but raises the Semaev degree 2^{m-2} and the
      query constant; the t-randomization trades per-target attempts against
      query reuse (no reuse allowed across targets). Parallelization is
      near-linear in targets (embarrassingly parallel descent), unlike the
      unknown-log variant's serial LA stage.
  matched_baseline: >-
    SAME COST CONVENTION ON BOTH SIDES, serial classical: costs in
    group-operation equivalents (1 point addition = 1 op; scalar multiplications
    charged by their operation count); memory charged separately in bits (table
    entries x bit-width); preprocessing and query data charged (factor base,
    sumset tables, pool, walk data). Baselines written down: Pollard rho ~ 0.886
    * 2^(n/2) group ops serial constant memory (KN-TECH-001, archived); BSGS ~
    2^(n/2) time x n * 2^(n/2) bits memory (KN-TECH-031/035, archived); multi-
    target rho: independent runs T * 0.886 * 2^(n/2); shared distinguished-point
    table ~ sqrt(T * N) total ops — UNVERIFIED (measured by IDEA-20260731-013);
    preprocessing frontier S*T^2 = Omega~(eps*N) (KN-LIT-013, archived); generic
    GGM Omega(sqrt(N)) (KN-TECH-005, archived). Quantum: stated separately
    under MAXDEPTH; none claimed here. On the measured side the same convention
    charges the direct variant (attempts x query, all failures) and the
    unknown-log variant (S_rel + S_LA + descent) identically, on the same
    point sets.
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: high
  dominated_by: >-
    Not dominated within its own row (assembled single-target IC budget): no
    corpus record removes S_rel + S_LA by construction, and the standing gates
    are for the dominated variant. It is dominated in the generic sense by rho
    unless the measured alpha clears alpha < m/2; the single-target exponent
    row remains rho-dominated unless the conditional-positive gate fires (then
    AGENTS.md rule 12 applies). The membership-test-level improvements
    (IDEA-20260731-007 claw, IDEA-20260731-012 LP-1) compose with this record
    rather than dominate it. Every row of the frontier (time, memory,
    data/queries) checked as documented.
  sota_delta: >-
    Quantitative: moves the ledger's assembled single-target IC gate from
    alpha < 3/2 (m=5, IDEA-20260727-007) to alpha < m/2 (2.5 at m=5) and
    removes the c_LA*B^omega_LA floor (IDEA-20260727-003) for the public-scalar
    variant — a budget-exponent correction of 1/m in log_N units on the
    collection term, conditional on the toy measurement confirming
    E_direct = alpha/m; no crypto-scale exponent is claimed.
