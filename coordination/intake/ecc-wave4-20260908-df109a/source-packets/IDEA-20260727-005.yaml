idea:
  id: IDEA-20260727-005
  question_id: RQ-ECDLP-002
  title: >-
    Exit-map classification barrier - every efficiently computable algebraic
    homomorphism out of a prime-order prime-field subgroup lands in one of three
    classes, each with an exponent at or above one half, and self-maps are
    provably exponent-neutral
  class: mechanism
  claim: >-
    Let E/F_p be an elliptic curve and G = <P> a subgroup of prime order N with
    Q = [k]P. Define an EXIT MAP as a group homomorphism psi: G -> H(F_p) into
    the F_p-points of a connected commutative algebraic group H over F_p, with
    psi evaluable in N^{o(1)} bit operations. The claim has four parts.
    (C1) SELF-MAP NEUTRALITY (rigorous). Every group homomorphism G -> G is
    multiplication by a scalar. Consequently, for any family phi_1 = 1,
    phi_2, ..., phi_r of efficiently computable endomorphisms of E acting on G,
    the augmented witness lattice
    W_r = {(a,b) in Z^{2r} \ 0 : sum_i a_i phi_i(P) + sum_i b_i phi_i(Q) = O}
    is a sublattice of Z^{2r} of index EXACTLY N, for every r. Its Minkowski
    minimum therefore shrinks as lambda_1^infty(W_r) <= N^{1/(2r)}, but the
    number of integer vectors inside the Minkowski box is (2N^{1/(2r)}+1)^{2r}
    = Theta_r(N), invariant in r, and the balanced meet-in-the-middle over the
    2r coordinates costs Theta(2^r sqrt(N)) group operations. Endomorphism
    augmentation therefore CANNOT move the exponent below 1/2 and strictly
    inflates the constant by 2^r.
    (C2) CLASSIFICATION (structural). By the Chevalley-Barsotti structure
    theorem every connected commutative algebraic group H over a perfect field
    is an extension of an abelian variety by a linear group, and a connected
    commutative linear group over F_p is a torus times a unipotent group.
    Because G has prime order N, any nontrivial psi is injective, so N divides
    |H(F_p)|. Hence exactly three exit classes exist: E1 unipotent (target
    F_p^+, forces N = p, the anomalous case), E2 toric (target a subgroup of
    F_{p^k}^*, forces N | p^k - 1, the MOV / Frey-Ruck case), E3 abelian-variety
    (target Jac_C(F_p) or an abelian variety over F_p of dimension g).
    (C3) EXPONENTS. E1 is polynomial-time but occurs only when N = p. E2 costs
    L_{p^k}(1/3) plus the pairing evaluation and is governed by the embedding
    degree k = ord_N(p). E3 is quantitatively CLOSED over a prime field: the
    base field cannot shrink, so for fixed g >= 2 the best known Jacobian DLP is
    Otilde(p^{2 - 2/g}) >= p^1 (Diem; Gaudry-Thome-Theriault-Diem), and in the
    provably subexponential regime g >= theta log p the cost is
    L_{p^g}(1/2) = p^{Theta(sqrt(log log p))}, which is superpolynomially LARGER
    than p^{1/2}. Both regimes exceed matched rho at 0.886 sqrt(N).
    (C4) CONSEQUENCE. For prime-order subgroups of prime-field curves with
    N != p and large embedding degree, no algebraic exit map and no
    endomorphism augmentation can produce a time exponent below 1/2. Any
    sub-birthday attack must therefore be NON-ALGEBRAIC: it must consume the
    bit-level coordinate encoding, which is exactly the index-calculus lane that
    IDEA-20260727-003 constrains and that EV-GGM-001 already classified as the
    one NON_SIMULABLE oracle.
    The claim is falsified by exhibiting (a) a fourth exit class, (b) an
    efficiently computable non-scalar group endomorphism of a prime-order
    subgroup, (c) an augmented witness lattice of index strictly less than N,
    or (d) a same-prime-field cover construction whose Jacobian DLP cost
    exponent is measured below 1/2.
  mechanism: >-
    The exemplar this program targets (Wesolowski, eprint 2026/1486) works
    because three ingredients coincide: the solution set is large, a rigorous
    theorem bounds its MINIMUM strictly below the ambient birthday exponent
    (deg phi <= (p/2)^{1/3} against an ambient p^{1/2}), and the size function
    is MULTIPLICATIVE so that the minimal object splits into two halves each
    enumerable in time proportional to its own size bound. This record isolates
    why none of the three transfers to prime-field ECDLP, and turns the failure
    into a quantitative classification.
    First, the solution set. The natural ECDLP witness object is the relation
    lattice L_k = {(a,b) in Z^2 : aP + bQ = O} = {(a,b) : a + bk = 0 mod N},
    of index N in Z^2. Minkowski gives lambda_1(L_k) <= (4N/3)^{1/2}, so a
    minimum-size bound DOES exist - but at exponent exactly 1/2, not below it.
    Sharpness is elementary and is the load-bearing counting lemma: every pair
    (a,b) with 0 < max(|a|,|b|) <= eps sqrt(N) and gcd(b,N) = 1 determines at
    most one scalar k = -a b^{-1} mod N, so at most (2 eps sqrt(N) + 1)^2 of the
    N scalars admit a witness shorter than eps sqrt(N). Hence for all but a
    4 eps^2 + o(1) fraction of instances the minimal witness is at least
    eps sqrt(N): no non-vacuous sub-birthday minimality theorem can exist.
    Second, the size function. The witness norm is a sup-norm on a lattice,
    which is ADDITIVE, not multiplicative. Enumerating all lattice vectors of
    norm at most X in dimension d costs Theta(X^d); at the Minkowski minimum
    X = N^{1/d} this is Theta(N) regardless of d. In the isogeny setting the
    size function is the degree, and enumerating all isogenies of degree at most
    X costs Theta(X), not Theta(X^d) - that single difference is the whole
    exemplar. This is why raising the rank of the witness lattice by adding
    endomorphisms shrinks the minimum (to N^{1/(2r)}) without shrinking the
    search: the determinant, and hence the candidate count inside the Minkowski
    box, is pinned at N.
    Third, why the determinant is pinned. G has prime order, so every group
    endomorphism of G is multiplication by a scalar lambda_i in Z/N; the
    augmented relation is the single congruence
    sum_i lambda_i (a_i + k b_i) = 0 mod N in 2r unknowns, one linear condition
    modulo N, giving index exactly N. This is the lattice-geometric shadow of
    DEC-20260726-007's finding that the endomorphism oracle is GGM-simulable at
    zero overhead, and it explains why H-STR-002's phi-invariant construction
    could only ever deliver the automorphism-quotient constant r = 3 measured in
    DEC-20260727-009.
    Fourth, the classification. Because a nontrivial homomorphism from a group
    of prime order N is injective, any exit target must have order divisible by
    N. Chevalley-Barsotti plus the structure of connected commutative linear
    groups then leaves only unipotent, toric, and abelian-variety targets, i.e.
    precisely the anomalous, pairing, and cover channels. The first two are the
    two classically known non-generic breaks, which makes the classification
    non-vacuous: it has exactly two known positive instances and predicts no
    third. The third class is the one the corpus transfer document
    (non_generic_transfer_search_20260610.md) leaves qualitatively OPEN
    ("lands in a harder Jacobian/group"); this record closes it quantitatively
    for algebraic exits by observing that a cover C -> E over F_p leaves the
    base field at p, and every known Jacobian index calculus over F_q costs at
    least q^{1-o(1)} because the degree-one factor base has size Theta(q).
    The construction is explicit and computable, which is what makes the closure
    testable rather than rhetorical: for any rational map varphi: P^1 -> P^1 of
    degree d over F_p, the fibre product C = E x_{P^1, x} P^1_varphi is the
    hyperelliptic curve y^2 = f(varphi(t)) of genus about 3d/2, the projection
    pi: C -> E has degree d, and pi^*: E(F_p) -> Jac_C(F_p) is computable by
    root-finding and is injective on G whenever gcd(N, d) = 1. So the exit
    EXISTS for every d; it is the destination cost, not the map, that closes it.
    The record therefore discriminates four explanations of the standing
    sqrt(N) wall: (i) the wall is an artifact of not having found the right
    endomorphism structure - refuted by C1's index-N theorem;
    (ii) the wall is an artifact of not having found the right corresponding
    object - refuted by C2+C3 for algebraic targets;
    (iii) the wall is genuinely information-theoretic and the encoding is
    irrelevant - refuted by the existence of E1 and E2 as real breaks;
    (iv) the wall is algebraically complete but encoding-sensitive, so all
    remaining hope is in non-algebraic coordinate-consuming attacks - the
    prediction of this record, and the reading that makes IDEA-20260727-003's
    free-oracle floor the binding constraint on the whole program.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-07-27'
    corpus_paths_grepped:
      - /Volumes/Volume/git/autolab/research
      - /Volumes/Volume/crypto-autoresearcher-worktrees/ecdlp-batch006/ledger
    grep_results:
      - >-
        "Minkowski|shortest vector|relation lattice|lattice minimum|successive
        minima" (case-insensitive) in the report corpus - 27 occurrences across
        13 files. Nearest prior art read in full:
        idea_generation_20260718_batch3.md candidate C3, which runs LLL on a
        FACTOR-BASE coordinate relation lattice over Z and notes
        lambda_1(Lambda) = Theta(n^{1/B}) by Minkowski. Different object: that
        lattice encodes factor-base coordinate constraints and has dimension
        tied to the factor base; the object here is the rank-2r witness lattice
        of the DLP instance itself, and the contributed statement is its index
        being exactly N for every r.
      - >-
        "Chevalley|conorm|Enge-Gaudry|2-2/g|Weil restriction|cover attack|GHS"
        (case-insensitive) - 188 occurrences across 73 files. Densest and
        nearest: non_generic_transfer_search_20260610.md (8 hits), read in full
        for the relevant sections. It records: same-field isogeny channel
        NEGATIVE / class-invariant; GHS/Weil descent "relevant to E/F_{q^e}, not
        directly to a curve natively over F_p with no proper base field"; and it
        leaves status "OPEN for genuinely new Jacobian/correspondence relation
        engines that do not factor through the scalar x-line Semaev relation".
        It states the Jacobian destination is "harder" but attaches NO exponent
        to the same-field cover, gives no explicit cover construction, and
        offers no completeness argument over the space of algebraic targets.
        Those three are this record's contribution.
      - >-
        "witness lattice|determinant invarian|escape route|Smart.{0,20}anomalous
        |Satoh-Araki" - 56 occurrences across 40 files; all are references to
        the classical anomalous attack as a predicate or positive control. No
        occurrence of an index/determinant invariance statement.
      - >-
        p1439_coordinate_deck_structured_group_barrier.md read in full for its
        model section. Its CD-SGM structured-generic model is explicitly
        self-scoped: "This is a restricted model for the present lane, not a
        lower bound for every prime-field ECDLP algorithm." It bounds coordinate
        decks and rational-map streams, i.e. NON-algebraic encoding attacks -
        the complementary half of the present classification, not the same half.
      - >-
        In this ledger, no record contains an exit-map classification, a witness
        lattice, or a Chevalley-type completeness argument. The closest is
        DEC-20260726-007 / EV-GGM-001, which classifies the endomorphism oracle
        as simulable with C = 0; C1 here is the lattice-geometric form of that
        verdict and is disclosed as such rather than claimed as independent.
    literature_verified:
      - >-
        Wesolowski, "The supersingular isogeny problem in time and memory
        p^{1/3+o(1)}", eprint 2026/1486, confirmed present and confirmed to
        state the p^{1/2}(log p)^{O(1)} -> p^{1/3+o(1)} improvement, the
        smoothness heuristic conditionality, and the disclosed superpolynomial
        overhead in o(1) plus high memory. Retrieved 2026-07-27 via search
        result listing; used only for the structural template, not for any
        numerical claim.
      - >-
        Gaudry, Thome, Theriault, Diem, "A double large prime variation for
        small genus hyperelliptic index calculus", Math. Comp. 76 (2007)
        475-492 (eprint 2004/153). Confirmed: for fixed genus g >= 2 the DLP in
        degree-0 class groups of non-singular curves over F_q is solvable in
        expected time Otilde(q^{2-2/g}) given a plane model of bounded degree.
        Retrieved 2026-07-27.
      - >-
        Enge, "Computing discrete logarithms in high-genus hyperelliptic
        Jacobians in provably subexponential time", Math. Comp. 71 (2002)
        729-742; Enge and Gaudry, "A general framework for subexponential
        discrete logarithm algorithms", Acta Arith. 102 (2002) 83-103.
        Confirmed: the provable L(1/2) regime requires g >= theta log q for a
        positive constant theta. Retrieved 2026-07-27.
      - >-
        Balasubramanian and Koblitz, "The improbability that an elliptic curve
        has subexponential discrete log problem under the Menezes-Okamoto-
        Vanstone algorithm", J. Cryptology 11 (1998). Cited from memory for the
        large-embedding-degree statement and therefore marked UNVERIFIED; the
        minimal test re-derives the needed distributional statement empirically
        and does not depend on the citation.
    conclusion: >-
      The four ingredients are individually elementary or published: Minkowski,
      Chevalley-Barsotti, the Diem/GTTD and Enge exponents, and the classical
      anomalous and pairing attacks. The adaptation claimed here is their
      assembly into a single exit classification with a per-class exponent, the
      index-N invariance theorem for endomorphism-augmented witness lattices,
      and the explicit same-field cover construction that makes the E3 closure
      testable. Overlap with non_generic_transfer_search_20260610.md is
      substantial and disclosed; that document's own OPEN clause is the gap this
      record targets. novelty_status is adaptation, not speculative and not new.
  assumptions:
    - >-
      E/F_p ordinary or supersingular short-Weierstrass, G = <P> of prime order
      N, N != p, and the embedding degree k = ord_N(p) is large. Curves failing
      either condition are the E1 and E2 positive controls, not counterexamples.
    - >-
      "Efficiently computable" means evaluable in N^{o(1)} bit operations given
      only public data. A map requiring a discrete logarithm to evaluate is not
      an exit map and is excluded by definition; this exclusion is stated up
      front because it is where a circular argument would otherwise hide.
    - >-
      The classification covers homomorphisms into connected commutative
      algebraic groups over F_p. Non-algebraic maps, maps into non-commutative
      groups, and maps that consume the bit representation of coordinates are
      OUTSIDE the classification and are named as the surviving lane, not
      claimed to be closed.
    - >-
      The Chevalley-Barsotti structure theorem is applied over the perfect field
      F_p, where it holds. No claim is made over imperfect base fields.
    - >-
      Best-known Jacobian index-calculus exponents are taken as published
      (Diem/GTTD, Enge). If a better Jacobian algorithm exists, E3's exponent
      must be recomputed; falsification condition four tests exactly that.
  predictions:
    - metric: augmented_witness_lattice_index
      direction: different
      minimum_effect: >-
        [Z^{2r} : W_r] = N exactly, for every tested r in {1, 2, 3, 4} and every
        tested instance, computed as the Smith normal form / Hermite normal form
        index of the explicitly constructed lattice. Any instance with index
        strictly less than N falsifies C1 and is a scoped positive requiring
        independent review.
    - metric: mitm_group_operations_over_sqrt_N_versus_r
      direction: higher
      minimum_effect: >-
        Measured meet-in-the-middle cost of finding a witness in W_r, divided by
        sqrt(N), is non-decreasing in r and grows at least like 2^{r-1} between
        r = 1 and r = 4, with the r = 1 value within a factor 2 of 1. A ratio
        that DECREASES with r at any tested size falsifies the neutrality claim
        and is the single most informative possible outcome of this record.
    - metric: short_witness_instance_fraction
      direction: lower
      minimum_effect: >-
        Over exhaustive enumeration of all k in [1, N-1] at toy N, the fraction
        of scalars with lambda_1^infty(L_k) <= eps sqrt(N) is at most
        4 eps^2 + 3/sqrt(N) for every eps in {0.05, 0.1, 0.2, 0.4}, and the
        empirical mean of lambda_1^infty / sqrt(N) agrees with the Siegel
        mean-value prediction within 5 percent. A systematic excess of short
        witnesses is a structural signal.
    - metric: same_field_cover_dlp_exponent
      direction: higher
      minimum_effect: >-
        For explicit covers C = E x_{P^1} P^1_varphi of genus g in {2, 3, 4, 5}
        over the SAME toy prime field, the fitted cost exponent of the best
        available Jacobian index calculus, expressed in log_p units, is at least
        1.0 - 0.15 at every tested size, versus 0.5 for matched rho on the
        original curve. A fitted exponent below 0.5 falsifies C3.
    - metric: exit_class_census_completeness
      direction: different
      minimum_effect: >-
        For every curve in the public census, the computed triple (N == p,
        ord_N(p), minimal cover exponent over tested g) assigns the curve to
        exactly one of E1, E2, E3 or to "no exit", with zero curves unassigned.
        Any curve carrying an efficiently computable homomorphism out of G that
        the triple fails to classify falsifies C2.
  minimal_test:
    design: >-
      Four stages, all executable at toy scale, none requiring a solver
      breakthrough.
      (1) INDEX THEOREM CHECK. On toy curves at 12, 16, 20 and 24 bits with
      prime-order G, and for r in {1, 2, 3, 4} using phi_1 = identity, phi_2 =
      negation-independent CM endomorphism where available, phi_3 = phi_2^2, and
      phi_4 = Frobenius-derived scalar, construct W_r explicitly from the
      publicly computable eigenvalues lambda_i and report its Hermite normal
      form index, its determinant, and lambda_1^infty via exact enumeration or
      LLL with a certified bound. Predicted index N for all r.
      (2) MITM COST CURVE. For each r, run the balanced meet-in-the-middle over
      the 2r coordinates in the Minkowski box, counting group operations and
      memory, and report cost / sqrt(N) as a function of r. Compare against
      matched Pollard rho with negation at 0.886 sqrt(N) and matched BSGS.
      (3) SHORT-WITNESS DISTRIBUTION. At toy N (12-20 bits) enumerate ALL
      scalars k, compute lambda_1^infty(L_k) exactly by enumeration, and compare
      the empirical CDF against both the rigorous bound 4 eps^2 and the Siegel
      mean-value prediction for random lattices of covolume N. Report the tail:
      the single smallest lambda_1^infty observed and its predicted frequency.
      (4) COVER-EXIT COST. Build explicit covers C: y^2 = f(varphi(t)) for
      varphi of degree d in {1, 2, 3}, giving genus g about 3d/2; verify pi^* is
      injective on G by checking gcd(N, d) = 1 and by replaying pi^*(P) and
      pi^*(Q) as reduced divisors; then run a standard Jacobian index calculus
      (degree-one factor base, sparse solve) on the transported instance and fit
      the cost exponent in log_p units across at least three field sizes.
      Report every stage in group-operation equivalents against matched rho.
    controls:
      - >-
        E1 POSITIVE CONTROL - anomalous curves with #E(F_p) = N = p. The
        classification must assign these to E1 and the transported problem must
        be solved in polynomial time by the formal-logarithm map. If the census
        does not detect this, the census is not sensitive enough to detect a
        real break and its negatives are worthless.
      - >-
        E2 POSITIVE CONTROL - a supersingular or small-embedding-degree curve
        with k in {1, 2, 3, 4, 6}. The classification must assign these to E2
        and the transported F_{p^k}^* instance must be measurably easier than
        matched rho at toy scale.
      - >-
        E3 CONSTRUCTION CONTROL - verify the cover map is a genuine injective
        homomorphism by checking pi^*(P + Q') = pi^*(P) + pi^*(Q') as divisor
        classes on at least 1000 random pairs, and by confirming pi^*(P) has
        order N in Jac_C(F_p). A failed check means the E3 cost measurement is
        measuring the wrong object.
      - >-
        NEGATIVE CONTROL for stage 2 - a random rank-2r sublattice of Z^{2r} of
        index N with no endomorphism origin. Its MITM cost curve must match the
        endomorphism-derived one; a discrepancy means the endomorphism structure
        carries information the index does not capture, which would be the
        interesting outcome.
      - >-
        Matched Pollard rho with negation at 0.886 sqrt(N) and matched BSGS with
        operations AND memory, on every instance, in the same operation unit.
      - >-
        AUTOMORPHISM-QUOTIENT CALIBRATION - on the same j = 0 curves, the known
        Duursma-Gaudry-Morain style speedup sqrt(|Aut|) must be reproduced, so
        that the r-dependence of stage 2 is not confused with the classical
        automorphism constant. This is the exact confusion that
        DEC-20260727-009 found in H-STR-002.
    required_metrics:
      - Hermite normal form index and determinant of W_r per instance per r
      - lambda_1^infty(W_r) per instance per r, exact or certified
      - MITM group operations and peak memory per instance per r
      - empirical CDF of lambda_1^infty(L_k)/sqrt(N) over all k at toy N
      - smallest observed lambda_1^infty and its predicted frequency (tail check)
      - cover genus, degree d, gcd(N,d), and pi^* homomorphism check pass rate
      - fitted Jacobian index-calculus cost exponent in log_p units per genus
      - exit-class assignment per census curve with the deciding invariant
      - matched rho and BSGS operation counts and BSGS memory per instance
  falsification_conditions:
    - >-
      Any tested instance yields [Z^{2r} : W_r] < N. C1 is false, the
      determinant is not pinned, and endomorphism augmentation is a live lever.
    - >-
      The measured MITM cost / sqrt(N) DECREASES with r on any instance family.
      Exponent neutrality under augmentation is false as a cost statement even
      if the index theorem holds.
    - >-
      An efficiently computable non-scalar group endomorphism of a prime-order
      subgroup is exhibited. This contradicts an elementary theorem, so such an
      observation is far more likely an implementation error than a discovery
      and must be independently replicated before any interpretation.
    - >-
      A same-prime-field cover construction is measured with a fitted Jacobian
      DLP cost exponent below 0.5. C3 is false and the cover exit reopens.
    - >-
      A curve is exhibited carrying an efficiently computable homomorphism out
      of G into a group not covered by E1, E2, E3. C2's completeness is false.
    - >-
      The E1 or E2 positive control is NOT detected by the census. The test
      apparatus is invalid and every negative it produced is void, not negative.
  confounders:
    - >-
      Toy N makes lambda_1^infty small in absolute terms, so constants dominate.
      The index and homomorphism checks are exact and unaffected; the MITM cost
      curve and the fitted cover exponent are the fragile measurements and must
      be reported with fit intervals across at least three sizes, never as a
      single point.
    - >-
      The r-dependence of the MITM cost can be confounded with the classical
      automorphism-quotient speedup sqrt(|Aut|), which is a genuine constant-
      factor win in the OPPOSITE direction. The calibration control exists
      solely to separate them; without it a measured improvement would be
      misread as falsifying C1.
    - >-
      Jacobian index calculus at toy genus and toy p is dominated by
      implementation constants and by the fact that the factor base of
      degree-one places nearly exhausts the field. The fitted exponent is a
      model statement supported by three sizes, not an asymptotic measurement,
      and must be labelled as such.
    - >-
      "Efficiently computable" is a definitional boundary. A referee can always
      propose a map whose evaluation cost was not charged. Every exit map in the
      census must carry a measured evaluation cost in group-operation
      equivalents, or it is not admitted.
    - >-
      Chevalley-Barsotti classifies ALGEBRAIC groups. The classification is
      silent on maps built from the bit representation of coordinates, which is
      not a defect to be hidden but the explicit boundary of the claim.
  interpretation_limits:
    - >-
      A confirmation is a NEGATIVE-THEORY result. It asserts that a family of
      attack routes is closed at exponent 1/2; it is not evidence that ECDLP is
      hard, does not constitute a lower bound, and must never be reported as
      one. Shoup's bound remains the only generic lower bound in force.
    - >-
      The classification is scoped to prime-order subgroups over prime fields
      with N != p and large embedding degree. It says nothing about extension
      fields, where GHS/Weil descent is a real and published break, and nothing
      about composite-order groups.
    - >-
      All measured quantities are toy-scale (12-24 bits). The index theorem and
      the homomorphism checks are exact and scale-free as MATHEMATICS; the cost
      curves and fitted exponents are toy-scale MEASUREMENTS and are never
      crypto-scale validation.
    - >-
      The one lane this record leaves explicitly open - non-algebraic,
      coordinate-consuming attacks - is the largest lane, containing all of
      index calculus. Reading this record as "ECDLP is closed" would be a
      serious misreading; the correct reading is "the algebraic half is closed,
      so all program compute belongs in the encoding half."
    - >-
      Overlap with non_generic_transfer_search_20260610.md is substantial. The
      record must be cited as a quantitative sharpening of that document, never
      as an independent discovery of the transfer closure.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Witness equidistribution.) For E/F_p with prime-order subgroup G of
        order N and uniformly random k in [1, N-1], the point set
        {(a,b) in Z^2 : a + bk = 0 mod N} behaves, as a lattice of covolume N,
        like a uniformly random lattice of covolume N drawn from
        SL_2(Z)\SL_2(R) with Haar measure. In particular
        E[#{v in W_r : ||v||_infty <= X}] = (2X+1)^{2r}/N + O(1) and
        Pr[lambda_1^infty(L_k) <= eps sqrt(N)] -> c eps^2 as N -> infinity.
      rigorous_support: >-
        The upper bound is RIGOROUS and unconditional, not heuristic: each pair
        (a,b) with 0 < ||(a,b)||_infty <= eps sqrt(N) and gcd(b,N) = 1
        determines at most one k, so at most (2 eps sqrt(N)+1)^2 <= 4 eps^2 N +
        O(sqrt(N)) scalars admit such a witness. Minkowski's convex body theorem
        gives the matching upper bound lambda_1^infty(W_r) <= N^{1/(2r)}. The
        classical distribution statement being imitated is Siegel's mean value
        theorem: for a random unimodular lattice, the expected number of nonzero
        points in a measurable set S equals vol(S). H1 is the assertion that the
        arithmetically-defined family {L_k} is Siegel-generic; only the LOWER
        tail (that short witnesses are not systematically more common) is
        assumed, and the assumption is used only to convert the rigorous
        one-sided bound into a two-sided prediction.
      validation_plan: >-
        Sampled quantity: lambda_1^infty(L_k) and the full witness count profile
        #{v : ||v||_infty <= X} for X on a geometric grid. Shortcut making
        sampling feasible: at toy N (12-20 bits) the scalar k is exhaustively
        enumerable, so no DLP is solved and no sampling bias is introduced -
        this is a complete census, not a sample. At 24-32 bits, sample k
        uniformly (the scalar is chosen, not recovered), which keeps sampling
        feasible without any correspondence trick. Comparison distribution:
        the Siegel/Gaussian-heuristic prediction Pr[lambda_1^infty <= eps
        sqrt(N)] ~ c eps^2, plotted against the empirical CDF, and against the
        rigorous ceiling 4 eps^2. Tail consistency check: the minimum of
        lambda_1^infty over the whole census must occur with frequency
        consistent with the eps^2 law at eps ~ N^{-1/2}, i.e. O(1) scalars
        should have a witness of norm O(1); count them and compare. LABEL: this
        validation is TOY-SCALE for the distributional claim and EXACT for the
        rigorous ceiling.
    - id: H2
      statement: >-
        (Embedding-degree genericity.) For a uniformly random prime-field curve
        with prime subgroup order N, the embedding degree k = ord_N(p) behaves
        like the multiplicative order of a uniformly random element of
        (Z/N)^*, so Pr[k <= N^{1/2}] = O(N^{-1/2+o(1)}) and the E2 exit is
        unavailable for all but a negligible fraction of curves.
      rigorous_support: >-
        The counting bound is elementary: the number of elements of (Z/N)^* of
        order at most B is at most sum_{d <= B, d | N-1} d <= B^2, so the
        fraction with order at most N^{1/2} is at most N^{-1+o(1)} times the
        number of admissible divisors. The classical distribution statement
        imitated is the Erdos-Pomerance theory of the multiplicative order of a
        random residue, and the specific cryptographic instance is the
        Balasubramanian-Koblitz improbability result, which is cited here as
        UNVERIFIED (from memory) and is deliberately not load-bearing: the
        elementary counting bound alone supports the prediction.
      validation_plan: >-
        Sampled quantity: k = ord_N(p) for randomly generated prime-order curves
        over primes of 16, 24, 32 and 48 bits, plus every curve in the public
        standardized census. Shortcut: ord_N(p) is computed directly from the
        factorization of N-1, which is feasible at these sizes and is a pure
        integer computation requiring no curve arithmetic; no correspondence
        trick is needed. Comparison distribution: the empirical CDF of
        log k / log N against the predicted distribution of the normalized order
        of a random residue, and against the elementary ceiling. Tail check: the
        SMALLEST k observed across all sampled curves, compared with the
        predicted frequency of k <= N^{1/2}; a single random curve with small k
        at 32 bits would already be strongly anomalous. LABEL: TOY-to-MID-scale;
        the standardized-curve census is exact and complete for those curves.
    - id: H3
      statement: >-
        (Cover-destination genericity.) For an explicit cover
        C = E x_{P^1, x} P^1_varphi over F_p with varphi of degree d chosen at
        random, Jac_C(F_p) behaves for index-calculus purposes like the Jacobian
        of a random curve of the same genus over F_p: the degree-one factor base
        has size p + O(g sqrt(p)) by the Weil bound, and a random reduced
        divisor of degree g splits over a factor base of size p^alpha with
        probability p^{-g(1-alpha)}/g! up to a constant.
      rigorous_support: >-
        The factor-base size is RIGOROUS via the Weil bound
        | #C(F_p) - (p+1) | <= 2 g sqrt(p). The splitting probability is the
        standard smoothness heuristic for function fields, whose classical
        analogue is the Dickman-de Bruijn / Panario-Gourdon-Flajolet-Richmond
        theory of smooth polynomials over finite fields: the probability that a
        random degree-g effective divisor factors into degree-one places is
        asymptotically 1/g!, matching the density of degree-g polynomials
        splitting completely.
      validation_plan: >-
        Sampled quantity: the empirical fraction of random reduced divisors on
        Jac_C(F_p) that split completely over degree-one places, and the
        empirical fraction that split over a restricted factor base of size
        p^alpha for alpha in {0.4, 0.6, 0.8, 1.0}. Shortcut: divisor splitting
        is decided by polynomial factorization over F_p, which is polynomial
        time, so this can be sampled at p up to 32 bits and g up to 5 without
        any DLP being solved. Comparison distribution: 1/g! for the complete-
        splitting case, and the Dickman-analogue rho_{FF}(g/(alpha g)) style
        prediction for restricted bases. Tail check: the most-splitting observed
        divisor batch versus the predicted 1/g! rate, with a chi-square test
        against the multinomial prediction over factorization patterns. LABEL:
        TOY-SCALE; nothing here is presented as a cryptographic-scale
        measurement of Jacobian index calculus.
  target_complexity:
    time_exponent: >-
      This is a barrier record; its target is to CERTIFY exponents, not lower
      them. Certified per exit class, in units of log_N: E1 (unipotent /
      anomalous) polynomial, but reachable only when N = p; E2 (toric /
      pairing) L_{p^k}(1/3) with k = ord_N(p), unreachable when k is large;
      E3 (abelian variety / same-field cover) at least 1 - o(1), specifically
      Otilde(p^{2-2/g}) for fixed g >= 2 and p^{Theta(sqrt(log log p))} in the
      provable L(1/2) regime g >= theta log p; E4 (self-maps / endomorphism
      augmentation) exactly 1/2, with the constant inflated by 2^r. The
      classification asserts the minimum over all algebraic exits is 1/2, i.e.
      NO improvement over the best known.
    memory_exponent: >-
      The E4 meet-in-the-middle that realizes the 1/2 exponent uses memory
      2^r N^{1/2}, strictly worse in memory than Pollard rho at N^{o(1)}. The
      E3 Jacobian index calculus uses memory Theta(p) for a degree-one factor
      base. Neither is memory-competitive, which reinforces rather than weakens
      the barrier.
    best_known: >-
      0.886 sqrt(N) group operations, N^{o(1)} memory (Pollard rho with negation
      and, where applicable, the automorphism quotient sqrt(|Aut|)); N^{1/3}
      online time with N^{1/3} advice in the preprocessing model, matching the
      Corrigan-Gibbs-Kogan S T^2 = Omegatilde(N) frontier already charged in
      DEC-20260727-008.
    hidden_overhead: >-
      Nothing is hidden in an o(1) here because no improvement is claimed. The
      honest disclosures run the other way: the 2^r factor in E4 is exponential
      in the number of endomorphisms used and is disclosed rather than absorbed;
      the Otilde in Diem/GTTD hides polylog factors and a bounded-plane-model
      hypothesis; Enge's L(1/2) constant is not reproduced here and the
      p^{Theta(sqrt(log log p))} form is an asymptotic restatement, not a
      concrete cost. The E2 exponent depends on the pairing evaluation cost,
      which is charged separately and is not folded into L_{p^k}(1/3).
    tradeoff_note: >-
      The E4 witness MITM sits at the S = T = N^{1/2} corner of the van
      Oorschot-Wiener curve and is strictly dominated by parallel rho with
      distinguished points, which achieves T = N^{1/2}/M on M processors with
      negligible memory. Increasing r moves the point up and to the right - more
      memory for more time - so the augmented lattice is not merely neutral but
      Pareto-dominated. This is the sharpest practical form of the neutrality
      claim and is the reason the cost-curve prediction, not the index theorem,
      is the discriminating measurement.
  proof_decomposition:
    - >-
      LEMMA 1 (scalar rigidity, correctness). Every group homomorphism from a
      cyclic group of prime order N to itself is multiplication by a scalar in
      Z/N. Elementary; single responsibility: rules out non-commutative
      augmentation inside G.
    - >-
      LEMMA 2 (index bound, size). With lambda_i the scalars of Lemma 1 and
      lambda_1 = 1, W_r = {(a,b) in Z^{2r} : sum_i lambda_i (a_i + k b_i) = 0
      mod N} is the kernel of a surjective homomorphism Z^{2r} -> Z/N, hence
      [Z^{2r} : W_r] = N and det(W_r) = N, for every r >= 1. Single
      responsibility: the determinant is r-invariant.
    - >-
      LEMMA 3 (Minkowski, size). lambda_1^infty(W_r) <= det(W_r)^{1/(2r)} =
      N^{1/(2r)}, and the box [-N^{1/(2r)}, N^{1/(2r)}]^{2r} contains
      (2N^{1/(2r)}+1)^{2r} = Theta_r(N) integer points. Single responsibility:
      shrinkage of the minimum is exactly compensated by dimension growth.
    - >-
      LEMMA 4 (MITM runtime). Splitting the 2r coordinates into two halves of r
      gives two lists of size (2N^{1/(2r)}+1)^r = Theta(2^r sqrt(N)) group
      elements, joined by a hash collision on the group element; the search
      succeeds iff a witness lies in the box, which Lemma 3 guarantees. Runtime
      and memory Theta(2^r sqrt(N)). Single responsibility: the cost of the best
      decomposition of the augmented search.
    - >-
      LEMMA 5 (sharpness / success probability). At most 4 eps^2 N + O(sqrt(N))
      scalars k admit a witness of norm at most eps sqrt(N) in W_1. Single
      responsibility: no sub-birthday minimality theorem can hold for a positive
      fraction of instances.
    - >-
      LEMMA 6 (target classification). A nontrivial homomorphism from a group of
      prime order N into H(F_p) is injective, so N | |H(F_p)|; by
      Chevalley-Barsotti and the structure of connected commutative linear
      groups over F_p, H is an extension of an abelian variety by a torus times
      a unipotent group. Single responsibility: exhaustiveness of E1, E2, E3.
    - >-
      LEMMA 7 (E3 cost). For a curve C over F_p of genus g, every published
      Jacobian index calculus costs at least p^{1-o(1)}: for fixed g >= 2,
      Otilde(p^{2-2/g}) >= p (Diem; GTTD), and for g >= theta log p, Enge's
      provable L_{p^g}(1/2) evaluates to p^{Theta(sqrt(log log p))}. Single
      responsibility: the exit destination cost.
    - >-
      MAIN ASSEMBLY. Per-attempt cost times inverse success probability: the E4
      route pays Theta(2^r sqrt(N)) per attempt (Lemma 4) with success
      probability 1 by Lemma 3, giving Theta(2^r sqrt(N)) total, minimized at
      r = 1; the E1/E2/E3 routes pay their class exponent from Lemma 7 and the
      classical attacks, and are gated by the arithmetic predicates N = p and
      k = ord_N(p); Lemma 6 says there is nothing else. The minimum over all
      algebraic exits is therefore Theta(sqrt(N)) whenever N != p and k is
      large. Lemma 5 forecloses the alternative assembly in which a rigorous
      minimality theorem below sqrt(N) would have replaced Lemma 3.
