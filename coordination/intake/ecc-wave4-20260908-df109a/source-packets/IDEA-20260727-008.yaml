idea:
  id: IDEA-20260727-008
  question_id: RQ-ECDLP-002
  title: >-
    Endomorphism-rank cost curve - the cheapest decisive test that adding
    endomorphisms to the ECDLP witness lattice shrinks the Minkowski minimum
    while leaving the search exponent at one half and inflating the constant
  class: control
  claim: >-
    This record isolates part C1 of IDEA-20260727-005 as a standalone, cheap,
    pre-registered measurement so that the neutrality theorem can be tested
    without committing to the full exit classification. The claim is that for
    prime-order subgroups G = <P> of prime-field curves, with r efficiently
    computable endomorphisms phi_1 = 1, ..., phi_r acting on G with publicly
    computable eigenvalues lambda_i in Z/N, the augmented witness lattice
    W_r = {(a,b) in Z^{2r} \ 0 : sum_i a_i phi_i(P) + sum_i b_i phi_i(Q) = O}
    satisfies THREE measurable properties simultaneously, and the third is the
    non-obvious one.
    (P1) INDEX PINNING. [Z^{2r} : W_r] = N exactly, for every r, on every
    instance, computed by Hermite normal form.
    (P2) MINIMUM SHRINKAGE. lambda_1^infty(W_r) scales as N^{1/(2r)}, i.e. the
    measured log_N of the shortest witness falls like 1/(2r) - so the witness
    really does get dramatically shorter as r grows, which is the observation
    that makes the endomorphism route look attractive.
    (P3) COST INFLATION. Despite P2, the measured cost of FINDING a witness by
    the best balanced meet-in-the-middle over the 2r coordinates is
    Theta(2^r sqrt(N)) group operations and Theta(2^r sqrt(N)) memory, i.e. the
    exponent is 1/2 for every r and the constant grows like 2^r. Increasing r
    therefore makes the attack strictly worse, and is Pareto-dominated by
    parallel rho with distinguished points at N^{o(1)} memory.
    The record additionally predicts that the ONLY measurable benefit from
    endomorphisms is the classical automorphism-quotient speedup: measured rho
    cost 0.886 sqrt(N / |Aut|) on j = 0 and j = 1728 curves, a constant factor
    of at most sqrt(6), never an exponent. It is falsified if the measured MITM
    cost divided by sqrt(N) DECREASES with r on any instance family, if any
    instance has index strictly below N, or if the measured rho speedup on
    endomorphism-rich curves exceeds sqrt(|Aut|) by more than 20 percent.
  mechanism: >-
    The intuition that more structure should help is strong and is exactly what
    H-STR-002 encoded before DEC-20260727-009 weakened it to the known
    automorphism-quotient constant r = 3. This control replaces the intuition
    with a measurement of the one quantity that decides it.
    Because G has prime order N, every group homomorphism G -> G is
    multiplication by a scalar. Therefore the r endomorphisms contribute exactly
    ONE linear congruence over 2r unknowns:
    sum_i lambda_i (a_i + k b_i) = 0 mod N. A single congruence modulo N in
    Z^{2r} cuts out a sublattice of index N, whatever r is. Minkowski then
    bounds the shortest vector by det^{1/(2r)} = N^{1/(2r)}, which is a genuine
    and dramatic shrinkage: at r = 4 the shortest witness has entries of size
    only N^{1/8}. But the box of side N^{1/(2r)} in dimension 2r contains
    (2N^{1/(2r)}+1)^{2r} = Theta_r(N) integer points, independent of r, and the
    witness density inside it is 1/N. A balanced split of the 2r coordinates
    into two halves of r gives two lists of Theta(2^r sqrt(N)) group elements
    joined by a collision - the birthday exponent, with a constant that doubles
    per added endomorphism.
    So the three properties pull apart cleanly, and measuring all three at once
    is what makes this a discriminator rather than a demonstration. Shrinkage
    without cost reduction is the signature of the determinant being pinned;
    shrinkage WITH cost reduction would mean the determinant is not pinned or
    the enumeration is not the bottleneck, either of which would be a genuine
    structural finding. Three explanations of the endomorphism lane are
    separated:
    (a) P1, P2 and P3 all hold: endomorphism augmentation is exponent-neutral
    and constant-inflating, the intuition is refuted quantitatively, and the
    program should stop spending compute on endomorphism-rich factor bases and
    displacement structure. This also supplies the lattice-geometric reading of
    DEC-20260726-007's endomorphism-oracle verdict (simulable at C = 0) and of
    DEC-20260727-009's measured r = 3 constant.
    (b) P1 holds but P3 fails - cost falls with r: the meet-in-the-middle is not
    the best decomposition of the augmented search, and some enumeration
    exploits the low-dimensional shadow of a short vector. This would be the
    first non-generic signal from the endomorphism lane and would require
    independent review before interpretation.
    (c) P1 fails - some instance has index below N: an efficiently computable
    non-scalar self-map exists, contradicting an elementary theorem. This is far
    more likely an implementation error than a discovery and must be replicated
    independently before being reported as anything.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-07-27'
    corpus_paths_grepped:
      - /Volumes/Volume/git/autolab/research
      - /Volumes/Volume/crypto-autoresearcher-worktrees/ecdlp-batch006/ledger
    grep_results:
      - >-
        "Minkowski|shortest vector|relation lattice|lattice minimum|successive
        minima" in the report corpus - 27 occurrences across 13 files. Nearest:
        idea_generation_20260718_batch3.md candidate C3 (LLL on a factor-base
        coordinate relation lattice, lambda_1 = Theta(n^{1/B})) and
        idea_generation_20260718_batch2.md candidate C3 (Coleman-Gross p-adic
        height-pairing relation lattice). Both build lattices from FACTOR-BASE
        or height data; neither builds the witness lattice of the DLP instance,
        and neither states an index or determinant invariance.
        PO_transfer_010_contract.md records "Rosati Gram matrix, determinant,
        successive minima, and vector norms" as metrics for an abelian-variety
        homomorphism module - a different lattice (Hom-module under the Rosati
        involution), and the nearest genuine neighbour found; disclosed.
      - >-
        "automorphism" in the report corpus - 1268 occurrences across 189 files;
        the Duursma-Gaudry-Morain style sqrt(|Aut|) speedup is established prior
        art and is used here only as a calibration control, not as a result.
      - >-
        In this ledger: DEC-20260726-007 / EV-GGM-001 record the endomorphism
        oracle as SIMULABLE with C = 0; DEC-20260727-009 weakened H-STR-002 to
        the known automorphism-quotient constant r = 3 measured at 2.62-3.20x;
        IDEA-20260727-001 supplies the orbit-quotient and rank controls. No
        ledger record contains a witness lattice, an index computation, or a
        cost curve in the number of endomorphisms. The deliberate overlap with
        IDEA-20260727-005 stages 1-2 is disclosed: this record IS those stages,
        separated so they can be dispatched alone.
    literature_verified: []
    conclusion: >-
      The mathematics is elementary and the automorphism speedup is classical.
      The adaptation is the packaging as a three-property simultaneous
      measurement whose predicted pattern (shrinkage without cost reduction)
      is falsifiable in a way that neither property alone is. No novelty is
      claimed for the underlying facts.
  assumptions:
    - >-
      G has prime order N and every phi_i is defined over F_p and maps G into G,
      so each acts as multiplication by a scalar lambda_i in Z/N.
    - >-
      Each lambda_i is publicly computable from the curve and N - for CM
      discriminant -3 and -4 curves by solving the characteristic equation
      modulo N, which requires no secret and no discrete logarithm. A phi_i
      whose lambda_i cannot be computed without a DLP is excluded, and the
      exclusion is stated because it is where circularity would otherwise enter.
    - >-
      Toy sizes (16-32 bits) permit exact Hermite normal form computation and
      exact or LLL-certified shortest vectors in dimension up to 8.
    - >-
      The meet-in-the-middle implementation is the balanced coordinate split; if
      a better decomposition of the augmented search exists, finding it IS the
      falsification of P3 and must be reported as such rather than treated as an
      implementation improvement.
    - >-
      Matched Pollard rho with negation and matched BSGS are run on identical
      instances in the same operation unit.
  predictions:
    - metric: augmented_witness_lattice_index
      direction: different
      minimum_effect: >-
        Hermite normal form index equals N exactly on 100 percent of instances
        for every r in {1, 2, 3, 4}. Any single instance with index below N
        falsifies P1.
    - metric: log_N_of_shortest_witness_versus_r
      direction: lower
      minimum_effect: >-
        The fitted slope of log_N(lambda_1^infty(W_r)) against 1/(2r) lies in
        [0.85, 1.15] with R^2 >= 0.90, confirming genuine shrinkage. A flat
        curve would mean the Minkowski bound is not attained and the setup is
        wrong, making the cost comparison uninterpretable.
    - metric: mitm_cost_over_sqrt_N_versus_r
      direction: higher
      minimum_effect: >-
        The measured ratio is non-decreasing in r and at least 4x larger at
        r = 4 than at r = 1, with the r = 1 value within a factor 2 of 1. The
        competing prediction - a ratio DECREASING in r at any tested size - is
        the single most informative possible outcome and would require
        independent review before interpretation.
    - metric: rho_speedup_over_sqrt_aut_prediction
      direction: different
      minimum_effect: >-
        Measured rho cost on j = 0 and j = 1728 curves lies within 20 percent of
        0.886 sqrt(N / |Aut|), i.e. the endomorphism benefit is exactly the
        classical automorphism quotient and nothing more. A measured speedup
        exceeding sqrt(|Aut|) by more than 20 percent is a signal that must be
        explained before any other number in the run is trusted.
    - metric: mitm_peak_memory_over_rho_memory
      direction: higher
      minimum_effect: >-
        Peak memory of the augmented MITM divided by rho's peak memory is at
        least sqrt(N)/polylog at every r, confirming Pareto domination by rho.
        A memory-competitive MITM would change the tradeoff reading.
  minimal_test:
    design: >-
      Toy prime-field curves at 16, 20, 24, 28 and 32 bits, prime-order
      subgroups, at least 5 seeds each, on three families: j = 0 (|Aut| = 6),
      j = 1728 (|Aut| = 4), and generic j (|Aut| = 2, the control family).
      For each instance and each r in {1, 2, 3, 4}:
      (1) compute the eigenvalues lambda_i from the characteristic equation
      modulo N and verify each by checking phi_i(P) = [lambda_i]P on the curve -
      a check that costs O(log N) and catches a wrong root immediately;
      (2) construct W_r explicitly as the kernel lattice of the single
      congruence, compute its Hermite normal form, report the index and the
      determinant;
      (3) compute lambda_1^infty(W_r) exactly by enumeration for dimension <= 4
      and by LLL with a certified gap for dimension 6 and 8, reporting which
      method was used per instance;
      (4) run the balanced meet-in-the-middle over the 2r coordinates in the
      Minkowski box, counting group operations and peak memory, and verify the
      returned witness by replaying sum_i a_i phi_i(P) + sum_i b_i phi_i(Q) = O
      on the curve and by recovering k = -A/B mod N and checking [k]P = Q. Only
      certificate-verified witnesses are counted;
      (5) run matched Pollard rho with negation and the automorphism quotient
      where available, and matched BSGS, on the same instances;
      (6) plot cost/sqrt(N) and memory against r, and the fitted shrinkage slope
      against 1/(2r), on the same axes.
    controls:
      - >-
        RANDOM-SUBLATTICE NEGATIVE CONTROL - a uniformly random sublattice of
        Z^{2r} of index N with no endomorphism origin. Its MITM cost curve must
        match the endomorphism-derived one within the measurement interval. A
        discrepancy means the endomorphism structure carries exploitable
        information beyond the index, which is precisely outcome (b).
      - >-
        AUTOMORPHISM-QUOTIENT CALIBRATION - reproduce the classical
        0.886 sqrt(N/|Aut|) rho speedup on j = 0 and j = 1728. A harness that
        cannot reproduce a known constant-factor speedup cannot certify the
        absence of an exponent change.
      - >-
        GENERIC-j CONTROL FAMILY - curves with |Aut| = 2 and no nontrivial
        endomorphism available, run at r = 1 only. These pin the r = 1 baseline
        and confirm the MITM implementation is within a factor 2 of BSGS.
      - >-
        CERTIFICATE CONTROL - every witness replayed on the curve and every
        recovered k verified by [k]P = Q, per docs/claims-and-verification.md.
        An unverified witness is not a witness and is excluded from the counts.
      - >-
        EIGENVALUE CONTROL - each lambda_i verified by phi_i(P) = [lambda_i]P.
        A wrong root silently produces a lattice of the wrong index and would
        manufacture a false falsification of P1; this control exists precisely
        to prevent outcome (c) from being an artifact.
      - >-
        SYNTHETIC INDEX-COLLAPSE POSITIVE CONTROL - an artificially constructed
        instance where the congruence is imposed modulo a proper divisor of N
        (simulating a genuine determinant collapse). The harness must report an
        index below N and a MITM cost below sqrt(N). If it cannot detect a
        planted collapse, its P1 negatives are worthless.
      - >-
        Matched Pollard rho with negation and matched BSGS with operations and
        memory, on every instance.
    required_metrics:
      - lambda_i per instance with the phi_i(P) = [lambda_i]P verification flag
      - Hermite normal form index and determinant of W_r per instance per r
      - lambda_1^infty(W_r) per instance per r, with the method used
      - MITM group operations, peak memory, and witness verification flag
      - recovered k and the [k]P = Q certificate result per successful run
      - measured rho cost and its ratio to 0.886 sqrt(N/|Aut|)
      - matched BSGS operations and memory
      - random-sublattice control cost curve, per r
      - synthetic index-collapse control: detected index and detected cost
  falsification_conditions:
    - >-
      Measured MITM cost / sqrt(N) decreases with r on any instance family, with
      the trend surviving the random-sublattice control. P3 is false; the
      endomorphism lane is live and independent review is mandatory.
    - >-
      Any instance has Hermite index strictly below N with the eigenvalue
      control passing. P1 is false.
    - >-
      The shrinkage slope is flat (outside [0.85, 1.15]) - the Minkowski minimum
      is not attained, the box is the wrong size, and the cost comparison is
      uninterpretable. The run is INCONCLUSIVE, not negative.
    - >-
      Measured rho speedup on endomorphism-rich curves exceeds
      sqrt(|Aut|) by more than 20 percent - the endomorphism benefit is larger
      than the classical automorphism quotient and must be explained before any
      other conclusion is drawn.
    - >-
      The synthetic index-collapse positive control is not detected - the
      harness cannot see a real collapse and all its P1 negatives are void.
  confounders:
    - >-
      The 2^r constant and the toy N are the same order of magnitude at 16 bits
      and r = 4 (2^4 = 16 versus sqrt(2^16) = 256), so the cost curve must be
      fitted across at least four sizes; a single size cannot separate a
      constant from an exponent. This is the dominant risk in the record.
    - >-
      LLL does not certify the shortest vector in general. For dimensions 6 and
      8 the reported lambda_1^infty is an upper bound unless exact enumeration
      is run; which method was used must be reported per instance, and mixing
      the two in one fit is not permitted.
    - >-
      The endomorphism-derived speedup and the automorphism-quotient speedup act
      in opposite directions and are easy to conflate. This is the exact
      confusion DEC-20260727-009 found in H-STR-002, and the calibration control
      is the only thing separating them.
    - >-
      MITM implementation quality directly sets the measured constant. Only the
      TREND in r is interpretable, never the absolute ratio, and the generic-j
      control exists to bound the implementation penalty at r = 1.
    - >-
      Endomorphisms with lambda_i satisfying an extra relation (for example
      lambda_3 = lambda_2^2 mod N, which holds for phi_3 = phi_2^2) make the
      congruence degenerate in a predictable way. The eigenvalue set must be
      reported explicitly so that a degenerate choice is visible rather than
      hidden inside r.
  interpretation_limits:
    - >-
      A confirmation is a scoped negative about ONE attack strategy at toy
      sizes. It is not a lower bound, not a proof of hardness, and not a
      statement about crypto-scale behaviour. It bounds what
      IDEA-20260727-005 C1 may be promoted to, nothing more.
    - >-
      All conclusions are scoped to prime-order subgroups over prime fields at
      16-32 bits with |Aut| in {2, 4, 6}. Nothing transfers to composite-order
      groups, extension fields, or supersingular curves over F_{p^2}, where the
      endomorphism ring has rank 4 and the analysis differs materially.
    - >-
      Outcome (b) - cost falling with r - would be a structural signal about the
      augmented search, still bounded by Shoup and still requiring a fully
      charged end-to-end comparison before it changed any claim.
    - >-
      This record deliberately duplicates stages 1 and 2 of
      IDEA-20260727-005's minimal test. If both are dispatched, the duplication
      must be resolved by the Coordinator rather than run twice.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Witness equidistribution in the Minkowski box.) For uniformly random k,
        the number of nonzero witnesses of W_r in the box
        [-X, X]^{2r} is Poisson with mean (2X+1)^{2r}/N, so at X = N^{1/(2r)}
        the box contains Theta_r(1) witnesses and the balanced MITM succeeds
        with constant probability in one pass.
      rigorous_support: >-
        Minkowski's convex body theorem gives the RIGOROUS existence of a
        nonzero witness with ||v||_infty <= det^{1/(2r)} = N^{1/(2r)}, so
        success in the box is guaranteed, not probabilistic; the heuristic
        content is only the COUNT, which controls how much the box must be
        inflated in practice. The classical distribution statement imitated is
        Siegel's mean value theorem for random lattices: the expected number of
        nonzero lattice points in a measurable set S of volume V, for a random
        lattice of covolume D, is V/D.
      validation_plan: >-
        Sampled quantity: the witness count in boxes of side c N^{1/(2r)} for
        c in {0.5, 1, 2, 4}, per instance per r. Shortcut making sampling
        feasible: at toy N the scalar k is CHOSEN by the experimenter, so no
        discrete logarithm is solved and the entire witness set of a box can be
        enumerated directly; at 16-20 bits the whole scalar range can be swept
        exhaustively, giving a complete census rather than a sample. Comparison
        distribution: the empirical count histogram against Poisson with mean
        (2X+1)^{2r}/N, tested by chi-square. Tail consistency check: the
        fraction of instances with ZERO witnesses in the c = 1 box, which
        Minkowski forces to be exactly 0 - a single nonzero observation is an
        implementation error, and this is the cheapest self-check in the record.
        LABEL: EXHAUSTIVE at 16-20 bits, TOY-SCALE SAMPLED at 24-32 bits.
    - id: H2
      statement: >-
        (Eigenvalue genericity.) The scalars lambda_1 = 1, lambda_2, ...,
        lambda_r are, apart from the algebraic relations forced by the
        endomorphism ring (for example lambda^2 + lambda + 1 = 0 mod N at
        j = 0), distributed like independent uniform elements of Z/N, so the
        single congruence sum_i lambda_i (a_i + k b_i) = 0 is non-degenerate and
        the index is N rather than a proper divisor.
      rigorous_support: >-
        Non-degeneracy is RIGOROUS given lambda_1 = 1: the coefficient vector of
        the congruence contains a unit, so the map Z^{2r} -> Z/N is surjective
        and the index is exactly N unconditionally. H2 is therefore NOT
        load-bearing for P1; it is used only to predict that the shortest vector
        attains the Minkowski bound rather than being forced short by an
        accidental relation among the lambda_i. The classical statement imitated
        is the equidistribution of roots of a fixed quadratic modulo varying
        primes.
      validation_plan: >-
        Sampled quantity: the multiset {lambda_i mod N} over many curves, and
        the observed lambda_1^infty against the Minkowski bound. Shortcut: the
        lambda_i are roots of a known quadratic modulo N, computable directly;
        no curve arithmetic beyond one verification multiplication is needed.
        Comparison distribution: the empirical distribution of lambda_2/N on
        [0,1) against uniform, by Kolmogorov-Smirnov, over at least 500 curves.
        Tail check: the smallest observed ratio lambda_1^infty / N^{1/(2r)}; a
        systematically small ratio would indicate accidental relations among the
        lambda_i and would mean r is effectively lower than nominal.
        LABEL: TOY-SCALE.
  target_complexity:
    time_exponent: >-
      Predicted 1/2 for every r, i.e. NO improvement, with the constant
      2^r. The record's purpose is to measure whether this is right; it claims
      no improvement and its confirmatory outcome is a negative.
    memory_exponent: >-
      Predicted 1/2 with constant 2^r for the augmented MITM, versus N^{o(1)}
      for Pollard rho and N^{1/2} for BSGS. The MITM is therefore predicted to
      be memory-equivalent to BSGS and strictly worse in constants, which is the
      practical content of the neutrality claim.
    best_known: >-
      0.886 sqrt(N / |Aut|) group operations at N^{o(1)} memory for rho with
      negation and the automorphism quotient - a constant-factor improvement of
      at most sqrt(6) on j = 0 curves. This is the number the record predicts is
      the ENTIRE benefit obtainable from endomorphisms in this setting.
    hidden_overhead: >-
      No o(1) is claimed. The disclosed overheads run against the augmented
      route: the 2^r constant is exponential in r and is stated explicitly
      rather than absorbed; the LLL certification gap in dimensions 6 and 8 is
      an upper bound and is flagged per instance; the group-operation
      calibration of the lattice arithmetic is implementation-bound and cancels
      only in the trend, not in the absolute ratio.
    tradeoff_note: >-
      The augmented MITM sits at S = T = 2^r N^{1/2} on the van
      Oorschot-Wiener curve, which is strictly Pareto-dominated by parallel rho
      with distinguished points (T = N^{1/2}/M on M processors at negligible
      memory) and matched by BSGS at a smaller constant. Increasing r moves the
      operating point away from the frontier in both coordinates. The
      parallelization behaviour is favourable in form - both MITM lists build
      embarrassingly in parallel - but the collision join is bandwidth-bound and
      is exactly the regime the external corpus's D1 data-movement
      exponent-neutrality barrier says cannot change an exponent.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  source_refs:
    - ledger/proposals/IDEA-20260727-005.yaml
    - ledger/proposals/IDEA-20260727-001.yaml
    - ledger/decisions/DEC-20260726-007.yaml
    - ledger/decisions/DEC-20260727-009.yaml
    - ledger/evidence/EV-GGM-001.yaml
    - /Volumes/Volume/git/autolab/research/idea_generation_20260718_batch3.md
    - /Volumes/Volume/git/autolab/research/PO_transfer_010_contract.md
