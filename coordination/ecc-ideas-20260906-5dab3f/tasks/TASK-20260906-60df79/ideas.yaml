      "title": "Schur-complement norm slicing for an explicitly supplied quaternion coset",
      "class": "algorithm",
      "area_tags": [
        "SSI",
        "SSIQ",
        "P13"
      ],
      "claim": "For a supplied rank-four positive definite integral norm lattice and affine congruence coset, a two-plus-two slicing algorithm can enumerate every primitive vector of norm <=D with fewer tested candidates than an axis-aligned four-dimensional box, while preserving exactly the witness set. A useful slice requires at least a factor 2 reduction in charged candidate work after preprocessing.",
      "mechanism": "Write Q(u,v)=u^T A u+2u^T Bv+v^T Cv with u,v in Z^2. Complete the square in rational arithmetic: Q=(v+C^-1 B^T u)^T C(v+C^-1 B^T u)+u^T(A-BC^-1B^T)u. Enumerate u in the projected ellipse, then v in the translated residual ellipse intersected with the declared residue coset. Primitive tests and automorphism deduplication are separate. The object is a family of exact conditional ellipses, not a list of approximately independent norms. Coordinate-dependent representation paired with integer lattice enumeration; it discards impossible v branches only after an exact inequality. End(E) or the lattice is supplied for this audit: obtaining it from a general input curve has unresolved cost A(p), which cannot be assumed free.",
