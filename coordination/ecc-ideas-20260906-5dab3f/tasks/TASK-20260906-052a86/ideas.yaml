      "claim": "For the fixed Bernstein–Lange three-sequence geometry, optimizing the interleaving over a declared finite lattice of prefix lengths by a Bellman recurrence gives the exact minimum all-target mean in that family, and can determine whether fixed round-robin is strictly suboptimal. This targets a generic addition constant, with zero exponent gain.",
      "mechanism": "The object is the covered-slope set C(i,j,k), compressed to its cardinality and marginal increments, paired with Sigma={extend one of the three sequence prefixes}. This is partial-action on schedules: target identities are discarded after computing exact coverage, and expected remaining cost propagates because uncovered targets depend only on the three prefixes. It is not a lossy quotient of the point group. F1 is only the source of the sequences; the proposed object is the schedule value function.\n\nFix starts 0,Q,2Q and increments P,MP,-(M+1)P, including explicit initial-point and setup counts. For a prefix triple s=(i,j,k), C(s) is the union of the three cross-sequence collision slope sets. A path through prefix triples has expected cost sum_s (1-|C(s)|/N), plus setup. Backward dynamic programming over 0<=i,j,k<=K, terminating only at C=Z/N, minimizes this exact sum. The retained cardinality is sufficient for this objective but not for changing starts or slopes; those parameters are fixed outside the recurrence. A dual feasible lower bound on every outgoing edge certifies the selected path, so the output is a checkable optimum rather than a fitted constant.",
