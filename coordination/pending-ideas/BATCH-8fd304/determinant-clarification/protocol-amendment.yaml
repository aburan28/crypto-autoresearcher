ambient_linear_algebra:
  field: F_N
  coefficient_arithmetic: exact_modular_arithmetic_in_the_prime_order_field_F_N
  row_matrix: "M = [A | B]"
  dimensions: "A in F_N^(r x a), B in F_N^(r x b)"
  ambient_map: "Phi: F_N^(a+b) -> F_N^r, (u,v) |-> A u + B v"
  cancellation_map: "K_A = ker(A^T) = {lambda in F_N^r : lambda^T A = 0}"
  projected_map: "Pi_A,B: K_A -> F_N^b, lambda |-> lambda^T B"
  rowspace_test: "For prior base/known rowspace R, an emitted row has positive information only when rank(span(R, Pi_A,B(K_A))) - rank(R) > 0, after consistency and certificate checks."
  scope_note: This map definition is a preparation object, not a scientific result and not a solver or collection implementation.

candidate_determinant_objects:
  - id: ALT-A
    name: auxiliary_block_determinant
    matrix: "A, a named square auxiliary coefficient block"
    ambient_map: "u |-> A u on the auxiliary-coordinate subspace of Phi"
    candidate_statement: "det(A)=0 certifies that A is singular and therefore that K_A is nonzero when A is square."
    valid_implication: It supplies a nonzero cancellation space, not a conclusion that Pi_A,B(K_A) is zero, redundant, or independent.
    missing_premise: The exact K_A, the resulting K_A B, prior rowspace, consistency, and original-row certificate must still be checked.
    status: unresolved_candidate_not_selected
  - id: ALT-B
    name: selected_square_minor_of_auxiliary_block
    matrix: "A[I,J], a specified square minor of A"
    ambient_map: "restriction of the auxiliary coefficient map to the named row and auxiliary-coordinate subspaces"
    candidate_statement: "det(A[I,J])=0 describes only the selected minor unless the complete maximal-minor rank certificate is also supplied."
    valid_implication: A named minor can certify a rank upper/lower condition only together with the complete minor/rank conditions required for that claim.
    missing_premise: The selected index sets, maximality, all comparison minors, and its relation to K_A must be explicit.
    status: unresolved_candidate_not_selected
  - id: ALT-C
    name: full_or_bordered_coefficient_minor
    matrix: "A square minor of [A | B], or a named bordered matrix containing both auxiliary and base/known columns"
    ambient_map: "the corresponding coordinate restriction of Phi"
    candidate_statement: A nonzero or vanishing full/bordered minor certifies a property of the combined coefficient map, not automatically an auxiliary-free base constraint.
    valid_implication: It can support a combined-map rank statement only; a base-information conclusion additionally requires quotienting/cancellation and prior-rowspace checks.
    missing_premise: The border, column partition, and projection/recovery map must be named.
    status: unresolved_candidate_not_selected
  - id: ALT-D
    name: induced_projected_map_minor
    matrix: "Q = K B after an explicitly specified basis or full-row representation K of K_A; then a square minor Q[I,J]"
    ambient_map: "Pi_A,B: K_A -> F_N^b"
    candidate_statement: A nonzero maximal square minor of the induced projected map certifies positive image rank for the named coordinates.
    valid_implication: After quotienting by prior rowspace and checking consistency, a positive rank increment certifies independent projected information for that exact input.
    missing_premise: K must be complete and its basis convention fixed; the exact quotient by prior rows and all multiplier/certificate witnesses must be checked.
    status: mathematically direct_alternative_not_authorized_as_source_intent

