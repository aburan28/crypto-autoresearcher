  cross_cutting_findings:
    - id: GATE-1
      disposition: REVISE
      severity: blocking
      finding: >-
        RQ-FRODO-3260cc forbids experiment design until the Frodo specification
        and the primary Renyi-divergence and DFR analyses are filed as KN-LIT
        records at stated provenance, with extraction damage marked.
        RQ-FRODO-a2dbe2 separately forbids design until the Frodo security
        section and the primary Fujisaki-Okamoto analyses are filed and the
        applicable bound is transcribed with its symbols and quantifier order.
        Both governing GOAL records say that their source gates are shut. All
        six reviewed cards nevertheless contain complete minimal experiments.
        A proposed Stage 0 acquisition step does not retroactively satisfy a
        source-before-design gate.
      additive_repair: >-
        Acquire, read, and file the required primary text first, including the
        exact page, theorem, equation, and algorithm bindings required by the
        owning question. Only then mint an additive successor whose design is
        derived from those filed sources. Do not amend a reviewed proposal.
    - id: CITATION-1
      disposition: REVISE
      severity: blocking
      finding: >-
        Citation-provenance syntax is present and every card honestly retains
        novelty_status unverified. The load-bearing claims are not yet source
        adequate: exact theorem and algorithm assertions rely on abstract-level
        retrieval, search summaries, recalled references, or adjacent KN-LIT
        entries whose records explicitly say that the paper body was not read.
        Those records are useful pointers but cannot discharge either question's
        primary-text and transcription gate.
      additive_repair: >-
        In each successor, bind every external load-bearing claim to the exact
        primary-source page, theorem, equation, or algorithm that supports it,
        with task/agent verification. Keep recalled references as pointers only
        and preserve novelty_status unverified unless authoritative retrieved or
        knowledge-base evidence supports a stronger label.
    - id: DUPLICATE-1
      disposition: PASS
      severity: non_blocking
      finding: >-
        A direct-tree screen over 1302 parsed proposal records found no exact
        duplicate of any reviewed card. There are material near-neighbor and
        dependency relationships with earlier Frodo arithmetic, DFR, bound,
        and cost-audit proposals and experiment specifications. The cards are
        not interchangeable, but successors must retain those dependencies and
        identify a precise incremental observable.
      additive_repair: >-
        Carry the applicable predecessor and experiment IDs into each successor
        and state the one quantity, certificate, or theorem obligation that the
        predecessor does not already provide.
    - id: CONTROL-1
      disposition: REVISE
      severity: blocking
      finding: >-
        Each card supplies named controls and a four-audit proof_search_map, but
        several forced outcomes do not follow from the proposed model. Examples
        include treating every truncated-divergence cell as infinite, forcing a
        structure-blind residual to equal a claimed gain rather than zero,
        forcing multiplication schedules from bit length, limiting bound
        residuals to two possible forms, adding logarithms of sequential costs,
        and declaring slice-specific horizons sufficient for a global conclusion.
      additive_repair: >-
        Derive every forced control from a filed definition or theorem, keep
        linear costs in linear coordinates until the final logarithm, distinguish
        per-entry from aggregate probabilities, and restrict each conclusion to
        the exact tested slice.
    - id: PARETO-1
      disposition: REVISE
      severity: blocking
      finding: >-
        dominated_by, sota_delta, and estimated_cost are structurally present,
        and the cards correctly avoid claiming an attack improvement. Several
        concrete budgets and Pareto statements nevertheless omit load-bearing
        transforms, CRT reconstruction, simulator storage or recomputation,
        correlated aggregation, or the mapping from query axes to total work.
        The present fields therefore do not support the quantitative comparisons.
      additive_repair: >-
        Recompute time, memory, and data/query costs only after correcting the
        mathematical model and filing the primary sources. Report incomparable
        axes as incomparable and retain the no-attack and unverified-novelty
        framing.

  per_card:
    - id: IDEA-20260821-b19e5e
      disposition: REVISE
      question_gate: REVISE
      citation_provenance: REVISE
      proof_search_map: REVISE
      controls: REVISE
      costs_and_pareto: REVISE
      findings:
        - >-
          The source gate for RQ-FRODO-3260cc was not discharged before this
          full divergence-lattice experiment was designed.
        - >-
          The claim that all 48 Psi-versus-chi cells are positive infinity is
          false. An untruncated full-support distribution can have infinite
          divergence against a finite-support comparator, but a properly
          truncated and renormalized distribution on matched support has finite
          divergence. A truncated, unnormalised mass function is not a
          probability input to the standard Renyi divergence unless a separate
          subprobability definition is supplied.
        - >-
          The categorical statement that the divergence is transcendental and
          therefore cannot equal any rational is unsupported. The justified
          operational issue is that the proposed numerical representation does
          not itself yield an exact rational value; certified rational-endpoint
          enclosures do not require a transcendence claim.
        - >-
          The forced local-optimality mutation sign is inherited from an
          unvalidated predecessor. A decrease cannot distinguish a false
          optimality claim from an objective, convention, or grid mismatch
          until the exact published objective is filed and reproduced.
      exact_additive_repairs:
        - >-
          After filing the exact specification and primary Renyi analysis, mint
          a successor that defines every candidate as a proper probability
          distribution and counts finite and infinite cells under the filed
          support convention.
        - >-
          Replace the transcendence assertion with a certified-interval
          requirement and bind the divergence direction, alpha convention,
          support, and reported quantity to exact primary-source locations.
        - >-
          Derive an independent mutation expectation from the filed objective,
          or separate local optimality into an explicitly unverified hypothesis.

    - id: IDEA-20260821-bd7b6c
      disposition: REVISE
      question_gate: REVISE
      citation_provenance: REVISE
      proof_search_map: REVISE
      controls: REVISE
      costs_and_pareto: REVISE
      findings:
        - >-
          RQ-FRODO-3260cc asks for exact Renyi and DFR arithmetic, whereas this
          proposal audits attribution in a Module/Ring-LWE hybrid-attack cost.
          It uses Frodo as an unstructured control but does not reduce the
          uncertainty named by the assigned question.
        - >-
          The claim that the cited paper publishes no unstructured control
          cannot be made from an abstract-level reading; absence from the paper
          body has not been checked.
        - >-
          The Stage 0 algebra is reversed. If all N occurrences enter only
          through total dimension n = N*k, then fixing n makes structured and
          unstructured gains equal, so gain_structured minus gain_unstructured
          is zero rather than exactly the claimed gain.
        - >-
          Forcing gain at N = 1 to zero is invalid if the enhanced method also
          contains generic decoder improvements, and the source algorithm may
          not even be defined on a ring-degree-one object.
        - >-
          The card calls Frodo deployed and standardised, while the governing
          records establish only a standards-track unstructured reference in
          this review. The stronger deployment description is not sourced.
      exact_additive_repairs:
        - >-
          Reroute a successor to the appropriate FHE or ML-KEM research question
          after the full cited paper is filed and read; inventory the paper's
          actual controls before asserting an omission.
        - >-
          Define a comparison family on which the algorithm is valid, correct
          the structure-blind identity to a zero residual, and treat any generic
          decoder intercept as an estimand rather than a forced failure.
        - >-
          Describe Frodo only at the provenance-supported standards-track scope.

    - id: IDEA-20260821-c037fc
      disposition: REVISE
      question_gate: REVISE
      citation_provenance: REVISE
      proof_search_map: REVISE
      controls: REVISE
      costs_and_pareto: REVISE
      findings:
        - >-
          The RQ-FRODO-3260cc source gate was not discharged, and the proposal
          substantially overlaps the existing certified DFR-enclosure
          experiment EXP-FRODO-60fd9d without first establishing why the exact
          integer route supplies a nonredundant certificate.
        - >-
          The exponentiation count conflates bit length with squaring count.
          For example, standard binary exponentiation of exponent 2688 uses 11
          squarings and two additional polynomial multiplications, not exactly
          12 squarings. The other headline counts require the same correction.
        - >-
          The computed object is a per-entry marginal probability, but parts of
          the card call it the DFR and compare toward published figures whose
          unit may be per ciphertext. Correlated aggregation over 64 entries is
          acknowledged but not resolved in the required comparison.
        - >-
          The ordinary-workstation feasibility statement counts mainly the
          output vector and underprices modular transforms, the number of CRT
          primes, reconstruction, and the independent second implementation.
      exact_additive_repairs:
        - >-
          After filing the specification and primary DFR analysis, bind the
          exact error expression, threshold, and probability unit to the source.
        - >-
          Correct the complete multiplication schedule and include all NTT
          transforms, primes, CRT reconstruction, verification, wall time, and
          peak memory in the budget.
        - >-
          Compare only like-for-like per-entry quantities or add a valid exact
          or controlled joint-aggregation method, and state the unique increment
          over EXP-FRODO-60fd9d.

    - id: IDEA-20260821-c2242b
      disposition: REVISE
      question_gate: REVISE
      citation_provenance: REVISE
      proof_search_map: REVISE
      controls: REVISE
      costs_and_pareto: REVISE
      findings:
        - >-
          The RQ-FRODO-a2dbe2 source gate was not discharged before the bound
          ablation was designed.
        - >-
          The card claims that Frodo and eFrodo differ by exactly two edits while
          salt deletion is itself recalled and the card acknowledges seedSE and
          possible additional differences. This is not yet a matched ablation.
        - >-
          A syntactic prefix alone does not determine the residual operator. The
          term form, security game, dependency structure, and reduction semantics
          determine whether U appears and with which exponent or combination.
        - >-
          The forced claim that the only admissible answers are residual one or
          a nontrivial residual in U is false. A valid theorem may contain
          square-root, quadratic, maximum, sum, collision, key-dependent, or no
          applicable multi-target term. A salted reduction can also retain
          collision or statistical residuals rather than literal one.
      exact_additive_repairs:
        - >-
          File both variant specifications and the exact salted and unsalted
          theorem bodies, then enumerate all variant differences before calling
          the comparison a salt ablation.
        - >-
          Build the binder and dependency graph from the exact theorem and allow
          the source-derived symbolic residual family rather than two forced
          outputs.
        - >-
          Calibrate against the exact published theorem and assumptions, not an
          abstract-level security headline.

    - id: IDEA-20260821-c50370
      disposition: REVISE
      question_gate: REVISE
      citation_provenance: REVISE
      proof_search_map: REVISE
      controls: REVISE
      costs_and_pareto: REVISE
      findings:
        - >-
          The RQ-FRODO-a2dbe2 source gate was not discharged, and the title's
          claim that published accounting charges neither hop is unsupported
          before the source body is read.
        - >-
          Sequential running times add in linear coordinates. In general,
          log2(t1 + t2) is a log-sum expression, not log2(t1) + log2(t2). The
          claim that one hop is vector addition in log coordinates contradicts
          the card's later max-plus hypothesis.
        - >-
          Multiplying one hop by 2^10 does not force the total work factor to
          move by ten bits unless that hop is the sole or dominant term.
          Likewise, overhead no larger than t_A can still move log2(t_A plus
          overhead) by any amount in the interval from zero through one bit; it
          does not force exactly 0.000 bits.
        - >-
          The sign of the work-factor transfer is not derived. Under the usual
          hard-problem reduction reading, reduction overhead is commonly
          subtracted from transferred security, whereas the proposed term is
          treated as a positive contribution without a named convention.
        - >-
          The categorical assertion that no time-memory tradeoff exists and one
          record per query must be stored is not supported without the exact
          simulator and data structure.
      exact_additive_repairs:
        - >-
          File and transcribe the exact reduction, simulator, time expression,
          and memory expression before minting a successor.
        - >-
          Track linear resource expressions through composition, take a final
          logarithm only after summation, and derive the security-transfer sign
          under a named definition.
        - >-
          Replace the forced zero-bit and ten-bit controls with exact log-sum
          predictions, and source any memory lower bound while allowing explicit
          recomputation or compression alternatives.

    - id: IDEA-20260821-c73dd8
      disposition: REVISE
      question_gate: REVISE
      citation_provenance: REVISE
      proof_search_map: REVISE
      controls: REVISE
      costs_and_pareto: REVISE
      findings:
        - >-
          The RQ-FRODO-a2dbe2 source gate was not discharged, and the salt-free
          eFrodo premise remains recalled rather than source-bound.
        - >-
          Comparing a horizon coordinate x along arbitrary query and target rays
          directly with 149.8, 212.6, and 266.8 category figures is not
          dimensionally justified. The proposal must map each ray to a named
          total time, data, query, or work measure and establish what the
          comparison figures represent.
        - >-
          Three selected rays establish only slice-specific horizons. They do
          not determine the global feasible region or prove that a salt fix is
          sufficient.
        - >-
          The external 2^64-query and roughly 62-bit calibration comes from an
          abstract-level record and does not reproduce the theorem body,
          assumptions, quantifiers, or exact cost convention.
        - >-
          The falsification rule overclaims: a horizon above a chosen figure on
          three rays cannot by itself prove sufficiency or redirect the whole
          lane.
      exact_additive_repairs:
        - >-
          After filing the bound and both specifications, derive each ray from
          the named theorem and security game and map its coordinate to a
          compatible total-resource threshold.
        - >-
          Report H(P, r, threshold) only as a slice-specific result, verify the
          eFrodo variant from primary text, and calibrate against the exact
          theorem rather than an abstract headline.
        - >-
          Restrict any negative finding to the transcribed bound, declared grid,
          and tested rays; do not infer salt sufficiency or protocol security.

  completion_statement: >-
    All six frozen proposal records were reviewed exactly once in this report.
    The literal disposition is REVISE for each card. The review preserves every
    novelty claim as unverified, proposes additive successors only, and makes no
    scientific, cryptanalytic-security, experiment-status, question-status, or
    goal-status conclusion.
