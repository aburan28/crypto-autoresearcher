  cross_cutting_findings:
    - id: GATE-1
      severity: blocking
      finding: >-
        Every governing question imposes a source-before-design action gate.
        The ML-DSA, HQC, and both Frodo questions require their named primary
        sources to be filed as KN-LIT before an experiment is designed or
        advanced; RQ-UOV-001 imposes the same gate on the UOV primary sources.
        All fifteen cards already contain detailed designs while the required
        filing is absent or acknowledged as absent. A Stage 0 promise inside a
        completed design does not satisfy a source-before-design gate.
      additive_repair: >-
        First acquire, read, and file the exact primary sources required by the
        owning question, with page/theorem/algorithm bindings. Only afterward
        mint a new IDEA successor whose design is derived from those filed
        sources. Do not amend any reviewed card.
    - id: CITATION-1
      severity: blocking
      finding: >-
        The later nine carry explicit citation provenance and correctly retain
        novelty_status unverified, but several load-bearing statements still
        rest on recalled sources or retrieved summaries rather than filed
        primary text. The six imported UOV cards have no citations list at all;
        external NIST, UOV, Grover, quadratic-form, and equivalent-key claims
        appear in prose or source_refs without per-claim provenance.
      additive_repair: >-
        In each successor, give every external load-bearing statement its own
        citation entry with ref, provenance, precise claim, and verified_by.
        Recalled items remain pointers only. Preserve novelty_status unverified
        unless authoritative retrieved or kb evidence actually supports a
        stronger label.
    - id: DUPLICATE-1
      severity: non_blocking
      finding: >-
        A direct-tree screen over 1296 proposal records found no exact duplicate.
        The closest relations are declared compositions or adaptations: 65739b
        with 6109f8/71fc18; 726cc7 with baa4da; 7a08df with b336a3; c05d5f with
        the GOAL-MLKEM-005 census; and the UOV 3686da/b8091d/ca165e algebraic
        cluster. These relations do not make the cards interchangeable, but a
        successor must retain explicit dependency and non-duplication language.
      additive_repair: >-
        Carry the named parent/dependency IDs into each successor and state the
        one observable or theorem obligation not supplied by the parent.
    - id: PARETO-1
      severity: blocking
      finding: >-
        dominated_by and sota_delta fields are present on every card, and most
        appropriately say that no attack improvement is claimed. They do not,
        however, cure invalid discriminators or under-specified cost models.
        In particular 726cc7 asserts an ordering between re-optimized discounts,
        03b05a mixes cost and exponent ratios, and e55f2e uses an inconsistent
        any-one-versus-all-target baseline.
      additive_repair: >-
        Recompute every Pareto statement only after the corrected time, memory,
        and data/query model is explicit; report incomparable axes as
        incomparable and leave novelty unverified.

  per_card:
    - id: IDEA-20260821-65739b
      disposition: REVISE
      question_gate: FAIL
      citation_provenance: PARTIAL
      proof_search_map: STRUCTURALLY_COMPLETE_CONTENT_REVISE
      findings:
        - >-
          The proposed sample thresholds follow only from making estimator
          standard deviation smaller than half a quantization bin. That event
          does not imply the claimed coefficient-agreement probability: success
          depends on the entire estimator-error distribution and on the true
          t0 residue's distance to a bin boundary.
        - >-
          floor((t0+2^(b-1))/2^b) is a rounded coarse quantizer, not an isolated
          bit plane. The signed representation and boundary convention are
          load-bearing but not fixed.
        - >-
          A bounded r0 interval wider than 2^b does not make r0 modulo 2^b
          exactly uniform unless the interval length and endpoint alignment
          make every residue multiplicity equal.
      exact_additive_repairs:
        - >-
          After filing FIPS 204 and the two required attack papers, mint a
          successor that names the observable as a signed coarse quantizer and
          fixes its bin boundaries.
        - >-
          Derive an exact or certified interval for quantizer success from the
          full conditional error law and every possible t0 residue; define
          N_b(alpha) for a declared target probability alpha rather than using
          a half-bin RMS surrogate.
        - >-
          Include exact self-interference and covariance terms and replace the
          exact-uniform modulo assertion with a proved distance-to-uniform bound.

    - id: IDEA-20260821-6d1b97
      disposition: REVISE
      question_gate: FAIL
      citation_provenance: PARTIAL
      proof_search_map: STRUCTURALLY_COMPLETE_CONTENT_REVISE
      findings:
        - >-
          The synthetic fixed-t0 null cannot be forced to a closed-form value
          averaged over random t0. A conditional experiment on one fixed t0 and
          a marginal analytic expectation are different estimands.
        - >-
          The union-combined coefficient probability is not an exact maximum
          event probability when polynomial coefficients are correlated.
        - >-
          A probability over an independent uniform challenge is not the real
          Line-28 firing rate after earlier rejection checks and Fiat-Shamir
          challenge derivation; the conditioning and reach probability may
          change the distribution materially.
        - >-
          The importance-sampling proposal does not provide the complete
          mixture density, stratum weights, or likelihood ratio needed to make
          either route an unbiased certificate.
      exact_additive_repairs:
        - >-
          File the required primary sources, then choose and state one estimand:
          an idealized uniform-challenge functional or the full signer firing
          probability including earlier checks and hash-derived challenge.
        - >-
          For a fixed-key estimand, supply an independently computed conditional
          truth on exhaustive small instances; for a marginal estimand, redraw
          t0 in an explicit outer ensemble.
        - >-
          Give the normalized proposal density, all mixture weights, support
          proof, exact likelihood ratio, effective-sample-size rule, and a
          reachable-threshold real-signing control. Remove the forced exact
          maximum unless a joint distribution proof supplies it.

    - id: IDEA-20260821-71fc18
      disposition: REVISE
      question_gate: FAIL
      citation_provenance: PARTIAL
      proof_search_map: STRUCTURALLY_COMPLETE_CONTENT_REVISE
      findings:
        - >-
          The composition inherits the unsupported price curve of 65739b, so
          its numerical tier ordering and break-even conclusions are not
          independently established.
        - >-
          An audit of omitted LowBits rejection must be conditioned on actual
          violating and nonviolating events. Unconditional coefficient
          agreement is not a detector-performance measure, especially when the
          propagated reconstruction error is wider than the violation
          overshoot band.
        - >-
          The claimed ct0 crossing probabilities and one-percent detection
          threshold have no derived joint overshoot/error law.
      exact_additive_repairs:
        - >-
          Preserve the exact tier-lattice derivation, but bind all price inputs
          only to a corrected successor of 65739b.
        - >-
          Derive conditional false-positive and false-negative curves given a
          violation and given a nonviolation, including worst-case residue
          bounds and an empirical calibration arm.
        - >-
          Separate the signatures required to enable a detector from the wait
          time to observe a rare rejected state; do not close a tier until both
          costs and the source gate are discharged.

    - id: IDEA-20260821-726cc7
      disposition: REVISE
      question_gate: FAIL
      citation_provenance: PARTIAL
      proof_search_map: STRUCTURALLY_COMPLETE_CONTENT_REVISE
      findings:
        - >-
          The assertion that all merge-based ISD variants carry the target
          count N through their lists is not derived per algorithm. Multi-target
          lists can sometimes be shared while targets are queried separately,
          so a family-wide memory penalty is not established.
        - >-
          The forced control delta_FC(N) <= delta_G(N) is false for independently
          re-optimized objectives. The full-cost penalty and the optimal
          parameter point can change with N, so the full-cost discount need not
          be ordered below the gate-only discount.
        - >-
          A finite flattening threshold N* is not proved for every variant; a
          monotone cost can approach a floor without attaining a finite plateau.
      exact_additive_repairs:
        - >-
          File the primary DOOM/multi-instance and each advanced-ISD source,
          then give one absorption algorithm per variant with explicit list,
          query, verification, memory, and preprocessing costs.
        - >-
          Keep only monotonicities implied by nested feasible sets. Delete the
          false discount-order control and permit the outcome that no finite
          plateau exists on the declared N domain.
        - >-
          Reproduce the N=1 baseline under the identical end-to-end cost basis
          and keep key-recovery, message-recovery, and same-code query axes
          separate.

    - id: IDEA-20260821-7a08df
      disposition: REVISE
      question_gate: FAIL
      citation_provenance: PARTIAL
      proof_search_map: STRUCTURALLY_COMPLETE_CONTENT_REVISE
      findings:
        - >-
          A margin defined as best score minus runner-up is nonnegative by
          definition, so the claimed equivalence between block failure and
          M<0 is impossible. Failure requires a signed true-codeword score
          minus the best competing score.
        - >-
          The declared sample budget cannot populate the stated joint-tail grid.
          With T=10^7, expected joint counts T*u^k are below one in material
          parts of the k<=8, u>=10^-4 grid and cannot meet the floor of 30.
        - >-
          Re-pairing supplies an expectation or a finite-sample interval under
          an independence construction, not an exact observed coincidence
          rate.
      exact_additive_repairs:
        - >-
          After the HQC source filing, define the signed true-versus-best-wrong
          margin and verify exact equivalence against decoder failure on an
          exhaustive small control.
        - >-
          Publish a pre-run power table for every (k,u) cell, restrict the grid
          to cells meeting the count floor, or introduce a validated
          change-of-measure design with likelihood ratios.
        - >-
          Report re-pairing as a randomization distribution with uncertainty;
          make no DFR or k=16 extrapolation beyond the powered measured grid.

    - id: IDEA-20260821-819183
      disposition: REVISE
      question_gate: FAIL
      citation_provenance: PARTIAL
      proof_search_map: STRUCTURALLY_COMPLETE_CONTENT_REVISE
      findings:
