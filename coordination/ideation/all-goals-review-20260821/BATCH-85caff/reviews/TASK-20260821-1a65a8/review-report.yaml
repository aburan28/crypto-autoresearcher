    - id: IDEA-20260821-9ad4a2
      disposition: REVISE
      question_gate: FAIL
      citation_provenance: PARTIAL
      proof_search_map: STRUCTURALLY_COMPLETE_CONTENT_REVISE
      findings:
        - >-
          Summing fixed-set sizes over nonidentity affine actions is a union
          bound, not the exact number of exceptional expanders, because fixed
          sets overlap. It cannot be required to equal an exhaustive distinct
          union count.
        - >-
          The proposed nearby control predicting a strictly larger full affine
          symmetry set whenever 2 is nonprimitive is false. For prime n the
          multipliers X->X^a exist independently of the order of 2; primitivity
          only identifies the Frobenius-generated subgroup with the full
          multiplier group.
        - >-
          Cyclic coordinate shifts are weight-preserving linear actions but not
          unital ring automorphisms, so the acting group and stabilizer must be
          stated without conflating these categories.
      exact_additive_repairs:
        - >-
          File the primary coding-theory sources, formalize the affine
          coordinate action and instance stabilizer, and state the sampling
          model for h explicitly.
        - >-
          Either retain the fixed-set sum as an upper bound or derive the exact
          union with a subgroup-lattice inclusion-exclusion or Mobius argument;
          compare exhaustive enumeration to the matching quantity only.
        - >-
          Replace the primitive/nonprimitive control with a matched comparison
          between the Frobenius-generated subgroup and the full multiplier
          group. State probability bounds for uniform h, not exact deployed
          behavior.

    - id: IDEA-20260821-a8e9db
      disposition: REVISE
      question_gate: FAIL
      citation_provenance: PARTIAL
      proof_search_map: STRUCTURALLY_COMPLETE_CONTENT_REVISE
      findings:
        - >-
          At q=2^16, injective inputs and AES permutation do force distinct
          128-bit outputs. At q=2^15, however, permutation plus an 8-bit-fiber
          projection does not determine the AES-family collision distribution
          or even an exact expectation over keys. A random-permutation model
          would be an additional assumption, not an algebraic consequence.
        - >-
          An expected collision count is insufficient to derive the optimal
          distinguishing advantage of the collision statistic; that advantage
          requires the full statistic distribution under both arms.
        - >-
          Treating real SHAKE output as exactly the uniform closed form is a
          model prediction, not an exact computation. Eight ordinary samples
          also have essentially no power to validate birthday probabilities at
          the claimed tiny scale.
      exact_additive_repairs:
        - >-
          After filing the Frodo specification, Renyi source, and DFR source,
          retain the exact q=2^16 forced-zero result and the seed-support
          statistical-distance lower bound as separate statements.
        - >-
          For q=2^15, state an ideal-random-permutation model explicitly and
          derive the complete projected collision-count distribution, or label
          the AES result empirical with a powered key-sampling plan. Do not
          infer it from injectivity alone.
        - >-
          Compute total variation on the statistic from full distributions,
          power every empirical control against its expected event rate, and
          keep every generator-only result outside the KEM-security tier.

    - id: IDEA-20260821-c05d5f
      disposition: REVISE
      question_gate: FAIL
      citation_provenance: PARTIAL
      proof_search_map: STRUCTURALLY_COMPLETE_CONTENT_REVISE
      findings:
        - >-
          The six provenance classes are neither mutually exclusive nor all the
          same kind of object: P3 and P4 can overlap, P5 describes a retrieval
          path outcome, and P6 describes an adversary resource rather than a
          normative authority.
        - >-
          Offline hash queries are not literally uncapped in a concrete
          security model. A running-time or gate budget implies a query ceiling
          once hash cost is charged, even though no protocol can enforce that
          ceiling. The card conflates absence of a normative deployment count
          with absence of an analyst/resource-model bound.
        - >-
          The 149.8/212.6/266.8 figures cannot be a forced reproduction fixture
          until primary text establishes that they are outputs of the
          transcribed IND-CCA inequality rather than underlying LWE estimates.
        - >-
          An incomplete document set, including an unavailable ISO source,
          cannot support an unqualified negative documentary conclusion.
      exact_additive_repairs:
        - >-
          After filing the primary Frodo/FO sources and transcribing the bound,
          mint a successor with orthogonal fields: authority type, normative
          force, count/time unit, retrieval state, and conversion assumptions.
        - >-
          Separate protocol-enforceable deployment bounds from analyst-chosen
          resource caps and charge the conversion from time/gates to queries.
        - >-
          Bind baseline figures to the exact equation and inputs that generate
          them; otherwise label them non-reproducible comparison values.
        - >-
          Scope every absence to an enumerated, versioned retrieval closure and
          keep acquisition failures distinct. Retain the declared adaptation
          link to the GOAL-MLKEM-005 census.

    - id: IDEA-20260813-03b05a
      disposition: REVISE
      question_gate: FAIL
      citation_provenance: FAIL
      proof_search_map: STRUCTURALLY_COMPLETE_CONTENT_REVISE
      findings:
        - >-
          The opening assertion that a NIST category is simply a quantum
          statement is not source-bound and suppresses the exact reference
          attack, gate-count, depth, and classical/quantum conventions that the
          comparison must use.
        - >-
          The claimed quantum/classical ratio between a square root and one is
          dimensionally ambiguous. Work, time, depth, total gates, processors,
          and bit exponents transform differently; P-way Grover parallelism
          gives sqrt(P) time speedup but changes total work.
        - >-
          No concrete depth-capped resource equation or optimistic endpoint for
          the solving stage is supplied. Convergence toward classical cost is
          not automatic when processor count and total-gate accounting vary.
        - >-
          A toy classical stage profile cannot establish which stage dominates
          at standardized parameters without a validated scaling model.
      exact_additive_repairs:
        - >-
          File the UOV primary attack/specification and the exact NIST category
          definition, and add explicit citation provenance for Grover,
          parallel search, depth bounds, and every quantum-algebra claim.
        - >-
          Define one resource tuple per stage, including oracle construction,
          logical gates, depth, width/qubits, memory, processors, and
          verification; derive the depth/parallel tradeoff instead of
          interpolating it.
        - >-
          State the solving-stage bracket endpoints as named algorithms or
          proved bounds, and validate stage-dominance scaling across a declared
          parameter ladder before applying it to category margins.

    - id: IDEA-20260813-1c08e4
      disposition: REVISE
      question_gate: FAIL
      citation_provenance: FAIL
      proof_search_map: STRUCTURALLY_COMPLETE_CONTENT_REVISE
      findings:
        - >-
          Standard cryptographic security is normally an experiment whose
          probability includes honest key generation, not a requirement that
          every possible generated key meet the same cost. The card's
          typical-versus-for-all quantifier is therefore incorrect unless a
          stronger per-key claim is actually found in primary text.
        - >-
          A random map with no planted oil space has no successful recovery
          certificate, so its time-to-oil-space distribution is not a matched
          null for a planted UOV instance. Timeout/failure and recovery cost are
          different outcomes.
        - >-
          Hundreds of keys cannot estimate a 0.1th percentile: fewer than one
          expected observation lies below that quantile. Even the 1st
          percentile needs a precomputed confidence/sample-size design.
      exact_additive_repairs:
        - >-
          File the UOV key-generation and security-definition sources, add
          per-claim citations, and restate the estimand as the distribution over
          the honest KeyGen experiment unless the source makes a per-key claim.
        - >-
          Replace the no-solution random-map null with a matched planted
          ensemble or another model having the same certified solution
          predicate; report failures separately from successful recovery cost.
        - >-
          Pre-register quantile confidence intervals and choose sample sizes
          that provide multiple effective observations in each reported tail;
          drop the 0.1th percentile if the budget cannot support it.

    - id: IDEA-20260813-3686da
      disposition: REVISE
      question_gate: FAIL
      citation_provenance: FAIL
      proof_search_map: STRUCTURALLY_COMPLETE_CONTENT_REVISE
      findings:
        - >-
          Polarization in characteristic two does have an n-dimensional
          diagonal kernel per component, and a fixed candidate basis receives
          o additional value equations per component. Calling m*o the exact
          variety codimension or independent constraint gain is stronger than
          this equation count proves.
        - >-
          The odd-characteristic control is inconsistent with the stated
          polar-only equation count. In odd characteristic total isotropy of a
          symmetric polar form includes diagonal conditions B(u,u)=0; a system
          retaining only i<j pairs does not become equivalent automatically.
        - >-
          Adding equations does not generally guarantee that a Groebner
          computation's maximum or solving degree cannot increase. The claimed
          monotonicity is not a rigorous support statement.
        - >-
          A random-alternating-form null does not define the diagonal quadratic
          residue needed to decide total singularity.
      exact_additive_repairs:
        - >-
          File primary UOV and intersection-attack sources and cite the
          characteristic-two quadratic-form facts explicitly.
        - >-
          Distinguish equation count, Jacobian rank, ideal codimension,
          solution count, and measured solving degree; prove or measure each
          rather than equating them.
        - >-
          Define the odd-characteristic comparator with the full symmetric
          polar restriction, and give the random null an independently sampled
          compatible quadratic refinement/diagonal residue.
        - >-
          Remove solving-degree monotonicity and report either direction under
          identical term order and implementation.

    - id: IDEA-20260813-b8091d
      disposition: REVISE
      question_gate: FAIL
      citation_provenance: FAIL
      proof_search_map: STRUCTURALLY_COMPLETE_CONTENT_REVISE
      findings:
        - >-
          The accidental-oil-space formula uses an unconditional random-map
          probability for a UOV map already conditioned to contain the planted
          oil space. For a second candidate, the number of new constraints
          depends on its intersection dimension with the planted space; the
          simple Gaussian-binomial product is not the claimed expectation.
        - >-
          N_oil does not divide an algebraic attack's work uniformly without a
          proof that candidates are sampled uniformly, per-candidate costs are
          equal, and every solution yields a usable key. Multiple solutions can
          change a solver's degree and success probability nonlinearly.
        - >-
          A construction intended to plant two oil spaces may accidentally
          plant more; requiring exactly two is not a valid positive control
          unless exact multiplicity is independently certified.
        - >-
          A nonzero random-map count is not automatically an enumerator error,
          especially at toy shapes where the predicted count may be material.
      exact_additive_repairs:
        - >-
          File the primary sources and derive the conditional expectation by
          stratifying candidate spaces by dim(O intersect O_planted), with the
          exact rank of new singularity constraints in every stratum.
        - >-
          Prove the multiplicity-to-work relationship for the named attack or
          present N_oil only as a measured invariant with no automatic cost
          multiplier.
        - >-
          Use an independently exhaustively certified exact-two construction,
          or require the control to recover both planted spaces and report all
          additional ones. Compare random-map counts to exact confidence bands,
          not zero.

    - id: IDEA-20260813-ca165e
      disposition: REVISE
      question_gate: FAIL
      citation_provenance: FAIL
      proof_search_map: STRUCTURALLY_COMPLETE_CONTENT_REVISE
      findings:
        - >-
          The existence of an o-dimensional totally singular subspace for both
          a UOV component and a generic form does not imply equality of their
          rank, type, Arf, Witt-index, or other single-form invariant
          distributions. A UOV component is sampled conditional on containing
          the planted space and is weighted differently over forms.
        - >-
          The universal statement that no function of one component can
          distinguish is far stronger than the Witt-index argument and is
          contradicted by the card's own admission that only named invariants
          would be measured.
        - >-
          The generic nondegenerate Witt-index statement does not cover
          degenerate components, which can have different radical and maximal
          singular-space dimensions.
        - >-
          This is a proposed lane closure but contains no measured obstruction
          block, run-bound value/error, or resource_check as required by the
          inventor protocol.
      exact_additive_repairs:
        - >-
          Do not issue a closure successor. File primary quadratic-form and UOV
          sources, then derive the actual marginal distribution of one UOV
          component as the planted space is randomized.
        - >-
          For each named invariant, compute or measure the conditional UOV
          distribution against a uniform-form null including degenerate cases;
          state only the invariants the evidence covers.
        - >-
          If a closure remains supportable, add the required obstruction block
          with quantity, units, error, run references, exact scope, and an
          examined resource_check naming which joint or diagonal-sensitive
          directions remain open.

    - id: IDEA-20260813-e55f2e
      disposition: REVISE
      question_gate: FAIL
      citation_provenance: FAIL
      proof_search_map: STRUCTURALLY_COMPLETE_CONTENT_REVISE
      findings:
        - >-
          Independent seeds passed through the same deterministic expander do
          not become correlated merely because the algorithm is shared. Plain
          key generation likewise shares an algorithm and parameter-specific
          structure; the proposed asymmetry is not established.
        - >-
          A(T) is defined for recovering any one of T targets, for which the
          trivial strategy attacks one selected target at normalized cost one.
          Several claims and the title instead compare against T times the
          single-key cost, the baseline for recovering all T targets. The goal
          and denominator are inconsistent.
        - >-
          Independence does not force every measured multi-target algorithm to
          have A(T)=1. Generic preprocessing, batching, or multi-instance search
          can apply to independent instances; declaring any plain-key gain an
          instrument failure would discard a real algorithmic effect.
        - >-
          Forbidding the attack's online phase from consulting public
          per-instance seeds excludes legitimate attacks and does not correctly
          separate shared preprocessing from per-target work.
      exact_additive_repairs:
        - >-
          File the compressed-variant specification and external multi-target/
          preprocessing sources with explicit citation provenance.
        - >-
          Choose one goal: any-one success or all-T recovery. Define success
          probability, preprocessing advice, online work, memory, data, and
          amortization denominator consistently for that goal.
        - >-
          Run the same seed-independent preprocessing and seed-aware online
          interface on plain, ideal-expander, real-expander, and
          planted-correlation arms. Treat a plain-key gain as a measured
          baseline, not automatically as a bug.
        - >-
          Replace the approximate birthday expression with exact pair and
          collision probabilities for the precisely named sub-blocks and power
          the T ladder to detect the declared effect.

  completion_statement: >-
    The frozen fifteen-card scope was reviewed exactly once in this independent
    validator session. All fifteen require additive successors before ranking,
    approval, implementation, or experiment dispatch. No absence of retrieval
    evidence was used as novelty evidence, and every novelty label remains
    unverified.
