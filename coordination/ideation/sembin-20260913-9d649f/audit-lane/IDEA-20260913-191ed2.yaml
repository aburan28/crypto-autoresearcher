idea:
  id: IDEA-20260913-191ed2
  question_id: RQ-SEMBIN-fa2e3f
  status: proposed
  proposed_by: idea-generator
  session: sembin-20260913-9d649f
  title: >-
    Assumption 1 is validated mostly on the arm that cannot fail it: stratify
    d_F4 by satisfiability, and replace eq. (15)'s single per-attempt cost by the
    two-term charge 2^k (m! 2^{n-mk} C_unsat + C_sat) that the stratification
    forces
  class: control

  claim: >-
    Three linked claims.

    (C1) SAMPLING. Semaev's own Section 4.5.1 states the asymmetry outright:
    "If the ideal generated by the polynomials is unit, then 'step degree' was
    always bounded by 4. If not, that is there is a solution, then 'step degree'
    was bounded by 4 for all the steps before the basis is computed" followed by
    up to three further steps at degrees 5, 6, 7. The experimental-probability
    column of Tables 1-2 therefore doubles as a census of how much of the
    evidence base lies on each arm, and the census is lopsided: over the 24
    reported t = m cells (2400 systems), approximately 387 instances are
    satisfiable, i.e. 16.1%; over all 33 reported cells (3300 systems) about 393,
    i.e. 11.9%; and 10 of the 33 cells contain at most ONE satisfiable instance
    out of 100. Assumption 1 is asserted FORALL instances, but in those 10 cells
    the reported maximum degree 4 is a statement about the unsatisfiable arm
    almost surely and carries essentially no information about the satisfiable
    one.

    (C2) MECHANISM AND DIRECTION. The two arms are not exchangeable, and the
    asymmetry has a structural cause rather than a statistical one: certifying
    unsatisfiability requires deriving 1 from the ideal, whereas determining the
    solution set requires deriving enough of the reduced basis to isolate the
    points -- strictly more of the ideal. We therefore predict
    d_solv | satisfiable >= d_solv | unsatisfiable pointwise, with strict
    inequality on a positive fraction of instances, and we predict the gap to be
    the reconciliation of the Semaev/Kosters contradiction recorded in
    KN-LIT-e77232 (Kosters: at n = 25, m = t = 3, step degree "seems" 4 with no
    solutions and 5 with solutions). KN-LIT-e77232 already names this as a
    null-control caveat whose direction makes null-derived ceilings OPTIMISTIC.

    (C3) COST CONSEQUENCE, quantified. Eq. (15) charges every attempt one solve
    at the same cost and so charges the satisfiable solves at the unsatisfiable
    arm's degree. The correct form, given that the algorithm performs about 1/P
    attempts per relation of which exactly one succeeds, is
      stage1 = 2^k * ( (1/P) * C(d_unsat) + C(d_sat) ),  C(d) = n^{d*omega}
    under the paper's own block-solver assumption, against its printed
    stage1 = 2^k * (1/P) * n^{4*omega}. Re-derived at the paper's own optimum m
    with integer k = ceil(n/m), omega = 3 (all numbers derived in this session
    from the paper's formulas, nothing measured): at n = 571, m = 12, k = 48 the
    single-term estimate is 2^181.7 and the two-term estimate is 2^181.7 /
    2^185.5 / 2^212.8 / 2^240.3 for d_sat = 4 / 5 / 6 / 7. Re-optimising m at
    integer k, the crossover with 2^{n/2} moves from n = 281 (d_sat = 4) to
    n = 295 (d_sat = 5), n = 337 (d_sat = 6), n = 393 (d_sat = 7). So a single
    extra degree on the satisfiable arm is worth +3.7 bits at n = 571 and
    +3.2 bits at n = 310 -- where the paper's own margin over rho is only
    2.9 bits -- and two extra degrees move the corrected threshold from "n > 281"
    to "n > 337" while leaving all four FIPS curves inside the affected scope.
    This independently CONFIRMS Semaev's contested comment-thread reply that the
    method still beats rho at regularity degree 6 (2^192.8 vs 2^285.5 at
    n = 571 after re-optimising m), and simultaneously shows the published
    threshold is the fragile part of the claim, not the FIPS conclusion.

  mechanism: >-
    Under the random-map model of Section 4.3 the fraction of satisfiable
    attempts is P(n,m,t,k) ~ 2^{tk-n}/t!, which at the asymptotic optimum is
    about 1/m! -- so the algorithm spends a 1 - 1/m! fraction of its attempts on
    the arm whose degree ceiling Semaev's data supports best, and a 1/m!
    fraction on the arm Kosters' data questions. Averaging the two arms into one
    per-attempt cost is safe only while the arms' costs are within a factor 1/P
    of each other; since C(d) = n^{d*omega} and 1/P = m! 2^{n-mk} ~ m!, the
    switch-over is at
    d_sat - d_unsat = log_n(m! 2^{n-mk})/omega, which is 0.87 at (n, m, omega) =
    (571, 12, 3). One degree of separation is therefore exactly the threshold at
    which eq. (15)'s single-term form stops being the right bookkeeping.

  novelty_status: adaptation
  citations:
    - ref: KN-LIT-fa346d
      provenance: retrieved
      claim: >-
        Section 4.5.1's unit-ideal / has-solution asymmetry sentence; the
        per-cell experimental probabilities of Tables 1-2; the statement that
        2300 t = m systems were solved; eq. (15) and its Table 3 instantiation
        m! 2^{n/m} n^{12}; Section 4.5.2's block-solver reduction of the
        per-solve cost from [n(m-1)]^{4 omega} to n^{4 omega}.
      verified_by: idea-generator, session sembin-20260913-9d649f, read
        inputs/SEMAEV-2015-310/paper_fulltext.md and tables.yaml in full
    - ref: KN-LIT-e77232
      provenance: internal
      claim: >-
        Kosters (2015-05-02): at n = 25, m = t = 3 the step degree "seems" to be
        4 with no solutions and 5 with solutions; at n = 45, m = t = 2 a
        completed run with two solutions reached step degree 5 at 126 GB. The
        record's relevance note 2 states the direction: a degree ceiling
        measured on solution-free systems under-states the solving degree of
        solvable ones, making null-derived ceilings optimistic.
      verified_by: idea-generator, session sembin-20260913-9d649f
    - ref: KN-TECH-056
      provenance: internal
      claim: >-
        Inventor protocol section 3, "controls before belief": a reported signal
        is an artifact until the identical measurement has been run against a
        null object of the same shape. Here the unsatisfiable arm IS the null
        object, and the finding is that the published measurement is dominated
        by it.
      verified_by: idea-generator, session sembin-20260913-9d649f
    - ref: IDEA-20260913-449d2b
      provenance: internal
      claim: >-
        Supplies the algorithm-independent predicate SOLV4 that this proposal
        stratifies; without it "degree" is ambiguous and the stratification
        measures a strategy artifact.
      verified_by: idea-generator, session sembin-20260913-9d649f

  assumptions:
    - >-
      The experimental-probability column of Tables 1-2 is the empirical
      frequency of satisfiable instances among the 100 random z per cell. The
      paper's wording supports this (the columns are "experimental success
      probability"), but it is an inference: a "success" could alternatively
      mean a completed solve. If it means the latter, C1's census is void and
      must be re-derived, which is itself worth knowing.
    - >-
      Within a cell, the 100 z are independent and uniform in F_{2^n}, per
      Section 4.5.1's substitution of a random z for R_X.

  proof_search_map:
    bottleneck: >-
      The per-attempt cost factor in eq. (15). Everything downstream -- the
      balance m* ~ sqrt(2 ln2 n / ln n), c = 1.6986, Table 3, and "n > 310" --
      multiplies through it.
    baseline_embedding:
      parameter_slice: >-
        d_sat = d_unsat = 4 collapses the two-term charge back to the paper's
        single-term eq. (15) exactly; the re-derivation reproduces
        log2 stage1 = 181.7 at (n, m, k) = (571, 12, 48) and the printed
        1.21e56 = 2^186.3 at the paper's own non-integer k = n/m.
      reproduction_check: >-
        Frozen fixture: all 36 numeric cells of Table 3 in
        inputs/SEMAEV-2015-310/tables.yaml, already reproduced to within 0.7% by
        the freezing session; the two-term model must return them exactly when
        d_sat is set to 4.
    observation_collision:
      observable: >-
        A per-cell maximum degree reported over a mixture of satisfiable and
        unsatisfiable instances.
      distinct_preimage_search: >-
        Two cells with identical reported maximum (4) whose satisfiable
        subsamples differ in size by two orders of magnitude -- e.g. n = 19,
        m = t = 3, k = 7 (47 satisfiable of 100) against n = 15, m = 5, t = 2,
        k = 3 (0 satisfiable of 100). Both appear in the table as "d_F4 = 4"
        with equal weight. The collision is already present in the published
        data and is exhibited rather than searched for.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Split the attempt budget into proved-disjoint blocks (satisfiable,
          unsatisfiable), measure a degree ceiling on each separately, and add
          charges only over the blocks: stage1 = 2^k((1/P) C_unsat + C_sat).
        predicted_gain: >-
          Makes the cost model sensitive to exactly the quantity Kosters
          measured, and prices it: +3.7 bits at n = 571 and +3.2 bits at n = 310
          per extra degree on the satisfiable arm, with the corrected threshold
          moving 281 -> 295 -> 337 -> 393 as d_sat goes 4 -> 5 -> 6 -> 7.
      - transform: stronger_invariant
        proposed_object: >-
          Track, per instance, the pair (satisfiable?, SOLV4?) rather than the
          per-cell maximum degree, and report the 2x2 contingency table.
        predicted_gain: >-
          Preserves the one piece of state that the published per-cell maximum
          destroys and that the cost model needs.
    quantifier_order: >-
      Assumption 1: FORALL (n, m, t, k) on the diagonal, FORALL V, FORALL
      instances, d_F4 <= 4. The evidence supports at most: FORALL cells tested,
      FORALL instances IN THE UNSATISFIABLE ARM (88-98% of each of 10 cells,
      84% overall), observable <= 4; and FORALL instances in the satisfiable arm
      OF THE 23 CELLS WHERE THAT ARM IS NON-EMPTY. The uniform claim needs the
      arm the sample under-covers.
    method_ceiling:
      strongest_certifiable_claim: >-
        A 2x2 contingency table of (satisfiable, SOLV4) at n <= 25 for m = 3 and
        n <= 45 for m = 2, with exact satisfiability determined by enumeration
        over V^t, plus a recomputed cost table that is a function of a measured
        d_sat rather than an assumed one. It cannot establish d_sat at n > 45.
      nearby_object_control: >-
        The unsatisfiable arm itself. If SOLV4 holds on BOTH arms at every
        reachable cell, the stratification has found nothing and the published
        mixture was harmless; that is a complete and useful negative outcome.
    proof_obligations:
      - claim: >-
          d_solv | satisfiable >= d_solv | unsatisfiable for this family
        responsibility: correctness
      - claim: >-
          stage1 = 2^k((1/P) C_unsat + C_sat) is the correct bookkeeping for the
          algorithm of Section 3 as literally specified
        responsibility: runtime
      - claim: >-
          The two-term model reduces to eq. (15) at d_sat = d_unsat
        responsibility: baseline
      - claim: >-
          The experimental-probability column is the satisfiable fraction
        responsibility: scope

  predictions:
    - metric: >-
        Pr[SOLV4 false | satisfiable] - Pr[SOLV4 false | unsatisfiable], per
        cell, >= 100 instances per arm
      direction: higher
      minimum_effect: >-
        strictly positive with a non-overlapping bootstrap CI in at least one
        reachable cell; the smallest interesting effect is 0.05 (5 instances per
        100 flipping) because that is the resolution of the published columns.
    - metric: >-
        SOLV4 failure rate on the unsatisfiable arm
      direction: lower
      minimum_effect: >-
        < 0.01 at every reachable cell, i.e. the unit-ideal arm essentially
        never needs degree 5. Predicted directly by Section 4.5.1's "always
        bounded by 4" for the unit case; a failure rate above 0.05 falsifies
        the mechanism of C2 and makes the published evidence base better, not
        worse, than this proposal claims.
    - metric: >-
        recomputed crossover threshold n* with 2^{n/2}, as a function of the
        measured d_sat
      direction: higher
      minimum_effect: >-
        n* >= 295 if d_sat = 5 is measured anywhere in the family, versus the
        corrected d_sat = 4 threshold of 281. A measured d_sat of 6 predicts
        n* = 337.
    - metric: >-
        fraction of the paper's 2300-system evidence base that lies on the
        satisfiable arm
      direction: lower
      minimum_effect: >-
        <= 0.25. Derived in this session as 0.161 from the frozen table; this
        prediction is a check on the transcription and on the reading of the
        probability column, not on nature.

  minimal_test:
    design: >-
      (1) CENSUS, zero compute: recompute the satisfiable-instance count per
      cell from inputs/SEMAEV-2015-310/tables.yaml, with Poisson intervals,
      and publish the per-cell power of the satisfiable arm. This alone
      delivers C1 and costs nothing.
      (2) CONTINGENCY, cheap: at n = 12 (m = t = 6, k = 2), n = 15 (m = t = 4,
      k = 4), n = 21 (m = t = 3, k = 7) and n = 25 (m = t = 3, k = 9) build
      >= 200 instances per cell; determine satisfiability EXACTLY by
      enumeration over V^t (|V|^t <= 2^27 at these cells, each test a handful of
      field operations); evaluate SOLV4 (IDEA-20260913-449d2b) per instance;
      report the 2x2 table per cell with bootstrap CIs. Sizes from
      IDEA-20260913-9ba7fc's table: the largest of these, n = 25, m = t = 3, is
      a 35,800 x 294,204 GF(2) matrix, 1.23 GiB dense -- inside this machine's
      15 GiB.
      (3) COST RE-DERIVATION, zero compute: emit the two-term stage-1 table and
      the re-optimised crossover as a function of d_sat in {4,5,6,7}, with the
      d_sat = 4 column checked against the frozen Table 3.
    controls:
      - >-
        Exact satisfiability by enumeration, never by whether the solver
        succeeded -- otherwise the stratifier is the instrument under test.
      - >-
        Planted-solution instances (z = x(sum of t factor-base points)) as a
        SECOND satisfiable arm, compared against random-z-conditioned-on-
        satisfiable, to expose the importance weighting by decomposition
        multiplicity.
      - >-
        T11-certified support-matched semi-regular null, stratified identically,
        so that "satisfiable is harder" is not an artifact of the satisfiable
        systems having a different support profile.
      - >-
        Curve control: B = 1 (Table 1) and random B (Table 2), since the paper
        reports them separately.
    required_metrics:
      - per-cell satisfiable count with exact Poisson interval
      - SOLV4 per instance with the certifying rank
      - 2x2 contingency table and bootstrap CI on the arm difference
      - number of distinct decompositions per satisfiable instance (the
        importance weight)
      - two-term stage-1 table and re-optimised crossover vs d_sat

  falsification_conditions:
    - >-
      SOLV4 holds on both arms at every reachable cell with no measurable arm
      difference: C2 is refuted, the published mixture was harmless, and
      eq. (15)'s single-term form is vindicated at these parameters.
    - >-
      SOLV4 fails at a comparable rate on the unsatisfiable arm: C2's mechanism
      is wrong and Section 4.5.1's "always bounded by 4 for the unit case" does
      not reproduce outside MAGMA.
    - >-
      The experimental-probability column turns out not to be the satisfiable
      fraction: C1's census is void as stated and must be recomputed.
    - >-
      The two-term model fails to reproduce Table 3 at d_sat = 4: the
      re-derivation is wrong, not the paper.

  confounders:
    - >-
      Decomposition multiplicity: satisfiable instances with many
      decompositions may be easier (more of the ideal is visible at low
      degree), so an unweighted satisfiable arm mixes "has one solution" with
      "has twenty". Report SOLV4 against the exact decomposition count, not
      just against the satisfiable flag.
    - >-
      Lemma 2's hypothesis: an instance satisfiable for eq. (6) at t may be
      UNSATISFIABLE for the chain eq. (5) at that t if a lower-t system is
      satisfiable, because an intermediate point becomes infinite. Enumerating
      V^t answers satisfiability of eq. (6); the chain's satisfiability must be
      determined separately. This is the same accounting gap
      IDEA-20260913-5e0b05 attacks and it must not be silently conflated here.
    - >-
      At small |V| a sizeable fraction of satisfiable instances have repeated
      x_i or x_i equal to R_X; these degenerate solutions may have anomalous
      degree behaviour and must be reported as their own stratum.
    - >-
      Poisson noise: a published 0.01 cell is one instance in 100 and is
      consistent with any true rate below about 0.03 (transcription limit
      already recorded in tables.yaml). The census is therefore an interval,
      not a point.

  interpretation_limits:
    - >-
      A measured d_sat at n <= 25 (m = 3) or n <= 45 (m = 2) does not transfer
      to n = 409 or 571. The cost re-derivation is a SENSITIVITY table -- what
      the published claim costs as a function of d_sat -- not a prediction of
      d_sat at cryptographic size.
    - >-
      The +31.1 bit correction at d_sat = 6 does NOT overturn the FIPS
      conclusion; at n = 571 the method still lands at 2^192.8 against rho's
      2^285.5 after re-optimising m. Reporting it as a refutation would be
      overclaiming in the opposite direction.
    - >-
      C1 is a statement about the evidence, not about Assumption 1. Under-covered
      does not mean false.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Arm-conditional degree separation.) For the Weil descent of eq. (5)
        with k = ceil(n/m), there exist integers d_u <= d_s such that
        Pr[d_solv <= d_u | unsatisfiable] = 1 - o(1) and
        Pr[d_solv <= d_s | satisfiable] = 1 - o(1) as n grows along the
        diagonal, with d_s - d_u >= 1 for infinitely many n.
      rigorous_support: >-
        Rigorous half: certifying unsatisfiability requires only 1 in the
        degree-d truncation, whereas determining V(I) requires the truncation to
        contain a basis separating the points, so d_solv | sat >= d_solv | unsat
        pointwise for a fixed instance family with the same generators. The
        distribution statement it imitates: for a random overdetermined Boolean
        system the degree at which the truncation becomes the whole coordinate
        ring behaves like the Bardet-Faugere-Salvy semi-regular degree of
        regularity of a system of the same shape (recalled, not opened), so the
        two arms should differ by the codimension of the solution locus, i.e.
        by an O(1) amount and at least 1 when a solution exists.
      validation_plan: >-
        Sample >= 200 instances per cell at (n, m, t) = (12,6,6), (15,4,4),
        (21,3,3), (25,3,3) with exact satisfiability by enumeration over V^t
        (<= 2^27 tuples); compare the empirical distribution of d_solv on each
        arm against (a) the matched semi-regular null's distribution on the same
        arm and (b) the constant 4. Tail check: the largest d_solv observed on
        the satisfiable arm, against Kosters' reported 5 at n = 25, m = t = 3 --
        the one external data point in existence at these parameters. Transfer
        assumption, stated: no extrapolation of d_s beyond the sampled n is
        claimed; the cost table is emitted as a function of d_s, not at a
        predicted d_s.

  target_complexity:
    time_exponent: >-
      Audited, not claimed: Semaev's 2^{1.6986 sqrt(n ln n)} becomes
      2^{c(d_s) sqrt(n ln n)} under the two-term charge, with the concrete
      consequence tabulated (log2 stage1 at n = 571, m = 12, k = 48: 181.7 /
      185.5 / 212.8 / 240.3 for d_s = 4 / 5 / 6 / 7; re-optimised total 175.1 /
      176.9 / 192.8 at d_s = 4 / 5 / 6).
    memory_exponent: >-
      Unchanged by this proposal at 2^{ceil(n/m)} relations; note that
      re-optimising m under d_s = 6 SHRINKS k from 48 to 32 at n = 571, i.e.
      a worse time exponent buys a 16-bit memory saving. Charged properly in
      IDEA-20260913-9c54f9.
    best_known: >-
      parallel Pollard rho / van Oorschot-Wiener, 2^{n/2}/M group operations,
      negligible memory, unconditional (frontier as enumerated in
      IDEA-20260913-449d2b).
    hidden_overhead: >-
      omega = 3 is used throughout to match Table 3; at omega = 2.376 every
      exponent above shrinks by a factor 0.792 and the arm-separation threshold
      d_s - d_u = log_n(m! 2^{n-mk})/omega rises to 1.10 at n = 571, m = 12, which makes
      the single-term form safe for one extra degree and not for two.
    tradeoff_note: >-
      The re-optimisation shows a genuine trade: accepting a larger d_s pushes
      the optimum to larger m, smaller k, hence less memory and more time. That
      curve is the honest object to compare with van Oorschot-Wiener.

  dominated_by: >-
    n/a (no algorithm claimed). Frontier checked row by row as in
    IDEA-20260913-449d2b: parallel rho 2^{n/2}/M with negligible memory
    dominates the audited algorithm on the memory axis at every n, and on time
    only for n below the recomputed threshold (281 / 295 / 337 / 393 for
    d_s = 4 / 5 / 6 / 7). The deliverable itself is a control and a cost
    re-derivation and occupies no point on the frontier.
  sota_delta: >-
    No exponent moved. Quantitatively: converts the published "n > 310" from a
    fixed threshold into a measured function of one quantity, and shows the
    published margin at n = 310 is 2.9 bits -- smaller than the 3.2-bit cost of
    a single extra degree on the satisfiable arm. Also establishes that 84% of
    the 2300-instance evidence base is on the arm the paper itself says cannot
    exceed degree 4, and that 10 of 33 cells have <= 1 instance on the other
    arm. Cost: item (1) and (3) are zero-compute; item (2) is < 20 CPU-hours
    and <= 2 GiB.

  test_boundary:
    instances: >-
      (n, m, t, k) in {(12,6,6,2), (15,4,4,4), (21,3,3,7), (25,3,3,9)};
      >= 200 instances per cell per arm; curves B = 1 and random B; V = the
      subspace of polynomials of degree < k in alpha, with a random-subspace
      replicate at one cell to match Table 1's starred rows.
    parameters:
      max_D: 5
      engines: pure-GF(2) rank/closure written for this task (no Sage,
        Singular, msolve or MAGMA in this container)
      satisfiability_oracle: exhaustive enumeration over V^t
    budget:
      wall_clock_seconds_per_cell: 14400
      maximum_memory_gb: 4
      maximum_runs: 40
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
