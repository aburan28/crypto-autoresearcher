idea:
  id: IDEA-20260913-449d2b
  question_id: RQ-SEMBIN-fa2e3f
  status: proposed
  proposed_by: idea-generator
  session: sembin-20260913-9d649f
  title: >-
    Four quantities, one name: separate Semaev's d_F4 from the solving degree and
    from the Macaulay/semi-regular degree GOAL-DREG-001 measures, and decide by
    construction whether that campaign's numbers bear on Assumption 1 at all
  class: measurement

  claim: >-
    The quantity Semaev's Assumption 1 bounds (`d_F4`, Section 4.4: "the maximal
    total degree of the polynomials occurring before a Groebner basis is
    computed", measured in Section 4.5.1 as MAGMA F4's per-step "step degree"
    with the trailing "No pairs to reduce" steps at degrees 5, 6 and 7 excluded)
    is NOT the quantity GOAL-DREG-001 measures on the same Boolean system, and
    the two are separated by construction rather than by scale. Specifically,
    three distinct claims, each independently falsifiable:

    (C1) `d_F4` as operationally defined is a property of one algorithm run under
    one selection strategy and one monomial order, and Semaev's own Section 4.5.1
    protocol subtracts every step that occurs after the basis is complete. His
    own runs therefore EXHIBIT step degrees 5, 6 and 7; the number 4 is the
    maximum over productive steps only. Any reproduction that reports "max step
    degree" without that subtraction will report 5, 6 or 7 and will appear to
    contradict Assumption 1 while measuring something else.

    (C2) The tightest algorithm-independent surrogate for Assumption 1 is the
    degree-4 SOLVING degree: let R_4 be the fixed point of the degree-capped
    closure (echelonize the span of {m*f : deg(m*f) <= 4} over the Boolean ring;
    whenever a polynomial of degree d < 4 appears, re-admit its multiples up to
    degree 4; iterate). Assumption 1 in its cost-bearing reading is equivalent to
    "R_4 determines V(I)" -- it contains 1 for an unsatisfiable instance, and n
    independent linear forms for a uniquely satisfiable one. Predicted relation:
    d_ff = 4 <= d_solv <= d_F4 + 0 is FALSE in general, and the correct chain is
    d_ff <= d_solv and d_solv <= d_F4^{productive}; d_F4^{productive} >= d_solv
    holds because any complete F4 run must at some productive step leave the
    degree-4 span if the degree-4 span does not resolve the system.

    (C3) GOAL-DREG-001 measures neither. Its instrument (`src/h012c_block_m4ri.py`)
    computes the exact GF(2) rank of the degree-D Macaulay matrix and the deficit
    `pred[D] - rank`, where `pred` is the Bardet-Faugere-Salvy semi-regular rank
    prediction (`semireg_rank_pred` in `src/h012_peel_rank.py`); it computes no
    degree at all. The `d_reg` metric of H-DREG-001 and EXP-DREG-001 ("first D at
    which full rank is reached") is operationalized in
    `experiments/EXP-DREG-001/analysis.md` as rank = nrows ("rank 69,073 < 74,880
    = nrows"), and that condition is UNREACHABLE at every D >= 4 for this system,
    because the quadratic block alone contributes the Frobenius dependencies
    q_i*q_i = 1*q_i and the C(n_q,2) Koszul pairs that KN-FIND-006 already
    identifies as the exact generic degree-4 syzygy content. Consequently
    H-DREG-001's success clauses (i) and (iii) are not evaluable in principle,
    not for want of compute, and the campaign's D = 5 and D = 6 work is a
    measurement of semi-regularity defect, which neither implies nor is implied
    by Assumption 1.

  mechanism: >-
    All four quantities are degrees attached to the same ideal I generated by the
    Weil descent of eq. (5), but they quantify over different objects.
    `d_ff` quantifies over syzygies with a degree drop and is a property of I
    (Semaev proves it equals 4 for the all-variable S_3 and reports 4
    experimentally for the constant-R_X one, against the bound 5 of
    Hodges-Petit-Schlather). `d_solv` quantifies over truncations of I and is a
    property of I. `d_F4` quantifies over the trace of one algorithm and is a
    property of (I, monomial order, selection strategy, termination test).
    `d_reg^{BFS}` quantifies over the Hilbert series of the ideal of top-degree
    forms and is a property of the homogenization of I, which is why a rank
    deficit against `pred[D]` can exist at D = 6 (EV-DREG-008: deficit_genuine
    = 17,947 at n=12, D=6) while a degree-4 truncation still resolves the system.
    The literature's "does d_ff track d_reg" dispute (KN-LIT-7604, KN-LIT-7607)
    is therefore partly a dispute about which of these four is meant, and the
    Semaev/Kosters 4-versus-5 contradiction recorded in KN-LIT-e77232 is partly
    a dispute about whether the trailing non-productive steps are subtracted.

  novelty_status: adaptation
  citations:
    - ref: KN-LIT-fa346d
      provenance: retrieved
      claim: >-
        Section 4.4 defines d_F4 as the maximal total degree of polynomials
        occurring before a Groebner basis is computed and accepts O(n^{omega
        d_F4}) as F4's cost; Section 4.5.1 states that when the ideal is unit the
        step degree was always <= 4, and that when a solution exists the steps
        bounded by 4 "were followed by at most three more steps, where 'step
        degree' was 5, 6, 7 with the message 'No pairs to reduce'"; Assumption 1
        is the separate step d_F4 <= d_ff after d_ff = 4 is proved.
      verified_by: idea-generator, session sembin-20260913-9d649f, read
        inputs/SEMAEV-2015-310/paper_fulltext.md in full
    - ref: KN-LIT-e77232
      provenance: internal
      claim: >-
        Records Semaev's 2015-04-20 comment reporting "possibly redundant
        degree-5/6/7 steps at the very end" of his n=40, m=2 runs, and Kosters'
        2015-05-02 report of step degree 5 at n=45, m=t=2 (126 GB) and at n=25,
        m=t=3 with solutions. Neither comment states the monomial order, MAGMA
        version, or whether trailing steps were subtracted.
      verified_by: idea-generator, session sembin-20260913-9d649f, read the
        corpus record in full
    - ref: KN-FIND-006
      provenance: internal
      claim: >-
        For the Weil-descended chained S_3 system at t=3 the generic degree-4
        syzygies are exactly the classical trivial ones -- n_q Frobenius
        (q_i^2 = q_i) plus C(n_q,2) Koszul pairs -- verified by
        rank(G) = nrows - pred[4] to the integer.
      verified_by: idea-generator, session sembin-20260913-9d649f
    - ref: H-DREG-001
      provenance: internal
      claim: >-
        Defines d_reg as "first D at which full rank is reached" and deficit as
        sr_pred_D - rank_full; EXP-DREG-001/analysis.md section 6 operationalizes
        the former as rank = nrows and records that it "was not reached at D=5 in
        any measured cell".
      verified_by: idea-generator, session sembin-20260913-9d649f
    - ref: KN-LIT-7604
      provenance: internal
      claim: >-
        Kosters-Yeo argue against d_ff ~ d_reg for summation systems. USED ONLY
        as relayed by KN-LIT-fa346d and KN-LIT-e77232; the source was not opened
        in this session and this entry supports no novelty claim.
      verified_by: null
    - ref: KN-LIT-7607
      provenance: internal
      claim: >-
        Huang-Kosters-Yeo introduce the last fall degree and argue it, not the
        first fall degree, controls solving. USED ONLY as relayed; source not
        opened here.
      verified_by: null
    - ref: null
      provenance: recalled
      claim: >-
        Bardet-Faugere-Salvy (cited as [1] by the frozen paper) give the
        semi-regular Hilbert-series definition of the degree of regularity that
        `semireg_rank_pred` implements; Lazard (cited as [16]) gives the
        Macaulay-triangulation equivalence the solving-degree reading rests on.
        Recalled, not opened; a pointer only.
      verified_by: null

  assumptions:
    - The DREG builder produces Semaev eq. (5) at t = m = 3 with
      k = ceil(n/m) and not some other chained system; KN-FIND-006's
      "n quadrics + n cubics in nb = 2n variables" matches the count
      n(t-2) cubics + n quadratics in n(t-2) + kt variables at t = 3, which is
      consistent but is not a proof that the generators agree coefficient-wise.
    - The Boolean ring convention (squarefree monomials, field equations
      implicit) is the same in both instruments.

  proof_search_map:
    bottleneck: >-
      The inequality d_F4 <= d_ff. Assumption 1 is exactly this step and nothing
      else: d_ff = 4 is proved in Section 4.5. Every polynomial-per-solve claim,
      and hence eq. (15) and Table 3, rests on it.
    baseline_embedding:
      parameter_slice: >-
        n = 12, m = t = 6, k = 2 and n = 21, m = t = 3, k = 7 -- Table 2 rows
        with d_F4 = 4 that lie inside the reach of this program's own instrument,
        so the reproduction is an exact parameter slice of the paper's evidence
        rather than a lookalike.
      reproduction_check: >-
        Frozen fixture: the per-cell (n, m, t, k, exp_prob, P, d_F4, seconds, MB)
        rows of inputs/SEMAEV-2015-310/tables.yaml. A reproduction is accepted
        only if it reports, per instance, all four degrees (d_ff, d_solv,
        d_F4^{productive} under a named strategy, d_reg^{BFS} bracket) and states
        which one it is comparing with the frozen 4.
    observation_collision:
      observable: >-
        The integer "maximal step degree" reported by a Groebner engine.
      distinct_preimage_search: >-
        Construct two instances of the SAME (n, m, t, k) cell, one satisfiable
        and one unsatisfiable, on which the observable collides at 4 while
        d_solv differs; and construct one instance whose observable is 4 under a
        degrevlex/normal-strategy run and 5 under a different selection strategy
        on the identical ideal. Either collision falsifies the identifiability of
        Assumption 1 from the published number. The second is strongly expected:
        the paper's own trailing 5/6/7 steps are an existence proof that the raw
        observable exceeds 4 on the instances it reports as 4.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "d_F4 <= 4" by the algorithm-independent predicate SOLV4(I):
          the degree-4 capped closure R_4 determines V(I). SOLV4 is a rank/span
          condition over GF(2), decidable exactly, with no dependence on
          strategy, order, or termination message.
        predicted_gain: >-
          Converts a claim about a proprietary implementation's verbosity output
          into a linear-algebra predicate computable with 0.3-1.3 GiB at the
          exact cells where the published dispute sits (see
          IDEA-20260913-9ba7fc for the size table), and makes "Assumption 1
          fails here" certifiable one-sidedly.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (max step degree = 4) fixed and vary the forgotten
          structure (satisfiability, strategy, whether trailing steps are
          counted); the intrinsic invariant separating the fibres is SOLV4.
        predicted_gain: >-
          Names exactly which published 4s are evidence for Assumption 1 in its
          cost-bearing reading and which are not.
    quantifier_order: >-
      Semaev's Assumption 1 as written: FORALL n, FORALL m with 2 <= m < n,
      FORALL subspaces V of dimension k = ceil(n/m), FORALL t with 2 <= t <= m,
      FORALL instances: d_F4 <= 4. His evidence is: EXISTS a MAGMA version, EXISTS
      a monomial order and selection strategy, EXISTS a termination convention
      (trailing steps subtracted), FORALL of 2300 instances drawn from 31
      (n,m,t,k) cells with n <= 21 (one at n = 40) and m <= 6: observable = 4.
      The witness (strategy, convention) is allowed to depend on nothing in the
      published statement but in fact must be fixed before the statement has a
      truth value. This quantifier defect is the whole content of C1.
    method_ceiling:
      strongest_certifiable_claim: >-
        This proposal can certify, per instance and exactly: d_ff, whether
        SOLV4 holds, the degree-D Macaulay rank and its BFS deficit, and the
        productive/non-productive step-degree profile of ONE named open-source
        engine. It cannot certify anything about MAGMA's F4, and it cannot turn
        any of these into a statement at n = 409 or 571.
      nearby_object_control: >-
        The paper's own conceded family k > ceil(n/m), where it states the
        regularity degree "generally exceeds 4" while d_ff stays 4. The
        reconciliation must assign DIFFERENT values to that family (d_ff = 4,
        SOLV4 false) and to the diagonal family (d_ff = 4, SOLV4 true); a
        proposed identification of the quantities that cannot distinguish the
        pair has not identified the load-bearing structure. Measured in
        IDEA-20260913-915511.
    proof_obligations:
      - claim: d_ff <= d_solv for these systems
        responsibility: correctness
      - claim: >-
          If SOLV4(I) is false then every complete run of any degree-by-degree
          Groebner/XL procedure has a productive step of degree >= 5
        responsibility: correctness
      - claim: >-
          rank = nrows is impossible at D >= 4 for a system containing >= 2
          Boolean quadrics, hence H-DREG-001 clauses (i) and (iii) are
          vacuous as written
        responsibility: scope
      - claim: >-
          The DREG builder's generators equal the Weil descent of eq. (5) at
          t = m = 3 coefficient-wise
        responsibility: baseline
    not_applicable_reason: null

  predictions:
    - metric: >-
        count of the four degrees (d_ff, d_solv, d_F4^{productive},
        d_reg^{BFS}) that coincide on a single Table-2 cell reproduced exactly
      direction: lower
      minimum_effect: >-
        at most 3 of the 4 coincide on at least one cell with n <= 21; the
        prediction is falsified if all four agree on every reproduced cell.
    - metric: >-
        max raw step degree reported by an open-source engine on cells the paper
        reports as d_F4 = 4, WITHOUT subtracting post-basis steps
      direction: higher
      minimum_effect: >-
        >= 5 on at least 50% of satisfiable instances at n = 12, m = t = 6 and
        n = 21, m = t = 3; this is predicted directly by the paper's own Section
        4.5.1 sentence and its absence would falsify C1.
    - metric: >-
        rank(M_D) - nrows(M_D) at D = 4, 5, 6 on the DREG cells
      direction: lower
      minimum_effect: >-
        strictly negative at every D >= 4 and every n, with the shortfall at
        D = 4 equal to n_q + C(n_q, 2) plus the KN-FIND-006 deficit; a single
        cell with rank = nrows falsifies C3.
    - metric: >-
        whether SOLV4 holds at n = 12, m = t = 3, k = 4 (the EV-DREG-008 cell)
      direction: different
      minimum_effect: >-
        a definite true/false, exactly computed. TRUE means the D=6 deficit of
        EV-DREG-008 is orthogonal to Assumption 1 and that campaign's numbers
        neither support nor contradict it. FALSE means Assumption 1 already
        fails at n = 12 in its cost-bearing reading, which contradicts
        Table 2's d_F4 = 4 at n = 12 and localises the contradiction to the
        definition rather than to the scale.

  minimal_test:
    design: >-
      Zero-Groebner, three steps, all exact.
      (1) DEFINITIONAL AUDIT, no compute: write the four definitions side by
      side with their quantifiers; read `src/h012c_block_m4ri.py`,
      `src/h012_peel_rank.py` and the DREG harness to determine which target
      `rank` is compared against in code (nrows, ncols, pred[D], or the
      degree-exactly-D block) and record it verbatim; check whether
      rank = nrows is attainable at D >= 4 given n_q Boolean quadrics.
      (2) BUILDER EQUALITY, cheap: regenerate the descent of eq. (5) at
      n = 12, m = t = 3, k = 4 independently from the frozen S_3 =
      (x1x2+x1x3+x2x3)^2 + x1x2x3 + B and compare generator sets
      coefficient-wise with the DREG builder's output on the same seed. A
      mismatch stops the whole reconciliation and is itself the finding.
      (3) FOUR-DEGREE PROFILE, ~1 CPU-hour per cell: on n = 12, m = t = 6, k = 2
      and n = 21, m = t = 3, k = 7 (both Table 2 rows, both inside reach), for
      >= 40 instances each stratified 50/50 satisfiable/unsatisfiable, compute
      d_ff (existing `ic_first_fall_fast`), SOLV4 by degree-capped closure over
      GF(2), the Macaulay rank and BFS deficit at D = 4, 5, 6, and the full
      step-degree trace (productive and non-productive separately) of one named
      open-source engine.
    controls:
      - >-
        Satisfiability stratification: planted-solution instances (z = x(P_1 +
        ... + P_t) for random P_i with x(P_i) in V) against random-z instances,
        with the satisfiability of each instance determined independently by
        exhaustive enumeration over V^t (feasible: |V|^t <= 2^21 at these
        cells). This is the confound KN-LIT-e77232 relevance note 2 already
        flags as making null-derived ceilings optimistic.
      - >-
        Strategy control: the same ideal run under >= 2 monomial orders and
        >= 2 selection strategies; if the raw step-degree observable moves, C1
        is established without any appeal to MAGMA.
      - >-
        Null object of the same shape: the T11-certified support-matched
        semi-regular null already used by EXP-DREG-001, carried through all four
        degree measurements, so that a "d_solv = 4" reading is not credited
        before the null is shown to differ.
      - >-
        Engine cross-validation: SOLV4 decided by two independent GF(2) rank
        routines on the identical matrix; disagreement invalidates the cell.
    required_metrics:
      - d_ff per instance
      - SOLV4 boolean per instance, with the certifying rank and the closure
        iteration count
      - rank(M_D), pred[D], deficit at D = 4, 5, 6
      - step-degree trace split into productive / no-pairs-to-reduce steps
      - satisfiability per instance from exhaustive enumeration
      - peak RSS and wall time per cell

  falsification_conditions:
    - >-
      All four degrees coincide on every reproduced cell, including on the
      k > ceil(n/m) control: the quantities are the same in practice and
      GOAL-DREG-001's measurements DO bear on Assumption 1. C1-C3 are then
      refuted and the reconciliation claim is dead.
    - >-
      The DREG code compares rank against the degree-exactly-D monomial count
      (i.e. computes d_reg^{BFS} proper) rather than against nrows: C3's
      "unreachable by construction" clause is refuted, and the analysis text is
      merely loose.
    - >-
      The open-source engine reports max raw step degree 4 (no trailing 5/6/7)
      on satisfiable instances: C1 is refuted for that engine and the paper's
      own Section 4.5.1 sentence must be explained some other way.
    - >-
      The DREG builder's generators do not equal the descent of eq. (5): the
      reconciliation question is void as posed and is replaced by "which system
      has GOAL-DREG-001 been measuring", which is a larger finding.
    - >-
      SOLV4 is false at a cell the paper reports as d_F4 = 4 AND remains false
      under every strategy and both satisfiability strata: Assumption 1 fails at
      n <= 21 in its cost-bearing reading, which would be a much stronger result
      than this proposal claims and must go to review-breakthrough.

  confounders:
    - >-
      Satisfiability is the dominant confound in every degree measurement here
      (KN-LIT-e77232 relevance note 2). Semaev's 2300 systems are heavily
      weighted to unsatisfiable instances -- his own experimental probabilities
      run from 0.00 to 0.47 -- and he states that the unit-ideal case never left
      degree 4. Any comparison that does not stratify is comparing mixtures.
      Quantified separately in IDEA-20260913-191ed2.
    - >-
      Monomial order and selection strategy for any step-degree number; MAGMA's
      F4 is not reproducible here at all, so no cross-engine step-degree
      equality may be asserted.
    - >-
      The Boolean ring convention: whether field equations are explicit rows or
      implicit in squarefree monomials changes both nrows and the trivial-syzygy
      count, hence every deficit.
    - >-
      Planted-solution sampling importance-weights z by its number of
      decompositions; instances with many decompositions are over-represented
      relative to "random z conditioned on satisfiable".

  interpretation_limits:
    - >-
      This settles a definition and a bracket of inequalities. It establishes
      nothing about whether Assumption 1 is true at any n, and nothing at all at
      n = 409 or 571.
    - >-
      A finding that GOAL-DREG-001's metric is orthogonal to Assumption 1 is not
      a criticism of that campaign's measurements, which stand as
      semi-regularity data; it bounds what they can be cited FOR.
    - >-
      No MAGMA is available to this program, so "d_F4" in Semaev's exact
      operational sense can never be reproduced here, only bracketed. That is an
      infrastructure limit and is not mathematical evidence either way.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Strategy-invariance of the solving degree.) For the Weil descent of eq.
        (5) with k = ceil(n/m), the predicate SOLV4 is invariant under the choice
        of degree-compatible monomial order and S-pair selection strategy, while
        the raw maximal step degree is not. Formally: for all instances I in the
        family, and all admissible (order, strategy) pairs s, s',
        SOLV4(I) is independent of s, and there exist I, s, s' with
        maxStepDeg(I, s) != maxStepDeg(I, s').
      rigorous_support: >-
        SOLV4 is defined purely as a span/rank condition on the degree-<=4
        truncation of the ideal in the Boolean ring, which is order-independent
        by construction; the Macaulay-triangulation equivalence (Lazard, cited as
        [16] of the frozen paper, provenance recalled) is the classical statement
        that degree-bounded linear algebra and degree-bounded Groebner
        computation see the same truncation. The non-invariance half is
        exhibited, not assumed, by the paper's own trailing 5/6/7 steps.
      validation_plan: >-
        Sample >= 40 instances per cell at n = 12, m = t = 6 and n = 21,
        m = t = 3, stratified by satisfiability; run >= 2 orders x >= 2
        strategies per instance; compare the empirical distribution of
        maxStepDeg across (order, strategy) with the constant function SOLV4.
        The predicted comparison distribution is degenerate for SOLV4 (all
        mass on one value per instance) and non-degenerate for maxStepDeg. Tail
        check: the largest observed maxStepDeg across all strategies, against
        the paper's reported 7. Transfer assumption stated explicitly: nothing
        is claimed for MAGMA's F4 or for n > 21.

  target_complexity:
    time_exponent: >-
      No new exponent claimed. The audited claim is Semaev's
      2^{c sqrt(n ln n)}, c = 2/(2 ln 2)^{1/2} ~ 1.6986, conditional on
      Assumption 1 (or on Assumption 2's d_F4 = o(sqrt(n/ln n))).
    memory_exponent: >-
      No new memory claimed. The audited claim reports none; the second stage
      stores Theta(2^k) relations (2^31 / 2^38 / 2^48 at n = 310 / 409 / 571),
      re-derived in IDEA-20260913-9c54f9.
    best_known: >-
      For E(F_{2^n}) with n prime: parallel Pollard rho with distinguished
      points, time 2^{n/2}/M group operations on M processors, memory negligible,
      unconditional. Diem's subexponential result applies to non-prime n only;
      Petit-Quisquater's 2^{c n^{2/3} ln n} is conditional on a first-fall-degree
      assumption. Frontier enumerated from the frozen paper's introduction and
      KN-LIT-e77232.
    hidden_overhead: >-
      Under Assumption 1 the per-solve cost is claimed polynomial as
      [n(m-1)]^{4 omega}; this proposal does not assess that exponent (see
      IDEA-20260913-9c54f9, which fits it against the paper's own timings).
    tradeoff_note: >-
      Not applicable: the deliverable is a definition and a bracket of
      inequalities, not an algorithm.

  dominated_by: >-
    n/a (no algorithm claimed). Checked against every row of the frontier for
    prime-degree binary ECDLP known to this program: (i) parallel rho / vOW
    2^{n/2}, negligible memory, unconditional; (ii) Semaev 2015 conditional
    2^{1.6986 sqrt(n ln n)} time with 2^{ceil(n/m)} memory; (iii)
    Petit-Quisquater 2012 conditional 2^{c n^{2/3} ln n}; (iv) Gaudry/Diem
    index calculus, non-prime n only, out of scope. This proposal proposes no
    point on that frontier, so none of the rows dominates it in the Pareto
    sense; it changes which of the rows may be cited as conditional.
  sota_delta: >-
    Moves no exponent. Quantitatively: it decides whether ~14 months of
    GOAL-DREG-001 measurement (deficit series 1322 / 1862 / 1999 at
    n = 12/15/18 and deficit_genuine = 17,947 at n = 12, D = 6, EV-DREG-008)
    counts as evidence about Assumption 1 or about nothing bearing on it, and it
    determines whether two of H-DREG-001's three success clauses are evaluable
    at all. Expected cost: < 5 CPU-hours and no new instrument beyond a GF(2)
    degree-capped closure.

  test_boundary:
    instances: >-
      n = 12, m = t = 6, k = 2 and n = 21, m = t = 3, k = 7 (both exact Table 2
      rows); plus the n = 12, m = t = 3, k = 4 cell of EV-DREG-008; >= 40
      instances per cell, stratified 50/50 by satisfiability; >= 2 curves
      (B = 1 and random B, matching Tables 1 and 2 respectively).
    parameters:
      max_D: 6
      engines: >-
        pure-GF(2) bitset/M4RI-style rank and degree-capped closure written for
        this task (gcc available; 15 GiB usable; NO Sage, Singular, msolve or
        MAGMA in this container -- declared impediment, not evidence), plus one
        open-source Groebner engine if one can be installed, named in the run
        record.
      fields: F_{2^n} with V the subspace of polynomials of degree < k in alpha
    budget:
      wall_clock_seconds_per_cell: 7200
      maximum_memory_gb: 8
      maximum_runs: 40
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
