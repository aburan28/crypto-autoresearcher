idea:
  id: IDEA-20260913-9c54f9
  question_id: RQ-SEMBIN-fa2e3f
  status: proposed
  proposed_by: idea-generator
  session: sembin-20260913-9d649f
  title: >-
    The diagonal k = ceil(n/m) is not load-bearing: recharge Table 3 with
    integer k, a fitted per-solve law and a memory column, and show the FIPS
    conclusion needs only "solving degree bounded at SOME fixed k_0", not
    Assumption 1 -- while the published "n > 310" threshold does not survive any
    degree growth at all
  class: mechanism

  claim: >-
    Four claims, all derivable from the paper's own formulas plus its own
    timings; every number below was computed in this session from
    inputs/SEMAEV-2015-310/ and nothing was measured.

    (C1) RELOCATION OF THE ASSUMPTION. Assumption 1 is stated on the diagonal
    k = ceil(n/m), where k grows with n at fixed m. The cost model does not
    require the diagonal: m is a free parameter of the algorithm, so the
    implementer may PIN k at any constant k_0 and pay m! with m = ceil(n/k_0).
    Charging the paper's own stage-1 formula with the solving degree d allowed to
    grow in k, and re-optimising m at integer k, gives at n = 571: total 2^186
    if d == 4 always (m = 13, k = 44); 2^233 under d = 4 + (k-20)/3, the linear
    rate implied by the only two external data points in existence
    (KN-LIT-e77232: d = 4 at k = 20, d = 5 at k = 23, both m = 2); 2^213 under
    d = 4 + log2(k/20); against rho at 2^285.5 in every case. The optimiser
    escapes growth by pushing m to 29 and pinning k at 20. So:
    **the "four FIPS curves theoretically broken" conclusion survives every
    degree-growth model that can be calibrated from available data**, and what
    it actually needs is only that there exists a constant k_0, uniform in n, at
    which the solving degree stays bounded, with k_0 > 2 log2(n/k_0) + O(1)
    (about k_0 >= 10 at n = 571). That is a strictly weaker and much more
    testable assumption than Assumption 1, and the paper never states it.

    (C2) THE PUBLISHED THRESHOLD IS THE FRAGILE PART. The same re-derivation
    moves the crossover with 2^{n/2} from the paper's stated n > 310 (its own
    formula gives 302 at non-integer k, 303 at integer k with m re-optimised) to
    n > 336 under d = 4 + log2(k/20), n > 339 under the linear rate, n > 347 if
    the satisfiable arm alone needs degree 6 (IDEA-20260913-191ed2). At n = 310
    the method's margin over rho is only 2.9 bits. So the sentence "the new
    method starts performing better than Pollard's for n > 310" is not robust,
    while the FIPS sentence is: the audit's two headline claims point in
    OPPOSITE directions and must be reported as such.

    (C3) THE PER-SOLVE COST LAW IS UNCALIBRATED AND THE PAPER'S OWN TIMINGS ARE
    CONSISTENT WITH AN EXPONENTIAL-IN-k LAW. Eq. (15) uses [n(m-1)]^{4 omega},
    reduced to n^{4 omega} = n^{12} in Table 3 by an unimplemented
    block-structured solver. Against that, fitting the Table 2 timings: at fixed
    k = 4 (m = t = 4, n = 13..16) the measured time exponent in n is 3.06 and in
    the variable count N is 4.75; at fixed k = 3 (m = t = 5, n = 13..15) it is
    3.97 in n and 5.40 in N; at fixed k = 7 (m = t = 3) the time is FLAT in n
    (137.32 s at n = 19, 133.54 s at n = 21, exponent -0.28); and moving k from
    6 to 7 at m = 3 multiplies the time by 8.69, i.e. 2^{3.12} per unit of k.
    The model predicts an exponent 4 omega in [9.5, 12]; the data show 3-5.4 and
    are equally consistent with time = 2^{3.12 k} * n^{-0.28}. These are 2-4
    point fits with no replication and must be labelled as such -- but the
    direction is unambiguous: the published law is not the law the published
    timings exhibit, and the discrimination is decided by k, not by n. Under
    time = 2^{3.12 k} the method still beats rho (n = 571: 2^177 at m = 22;
    crossover at n = 180), which is C1 again from the other side: polynomiality
    is not what the FIPS claim rests on.

    (C4) THE MEMORY COLUMN, AND WHY IT DOES NOT MOVE THE TIME CLAIM BUT DOES
    PIN A FLOOR. Table 3 and eqs. (15)-(17) report time only. Charging both
    memory terms at n = 571 over m = 2..30 with integer k: the relation store
    2^k(2n + mk) bits falls from 2^296.7 (m = 2) to 2^30.8 (m = 30) while the
    per-decomposition working set rises -- 2^{64.1} to 2^{103.0} bits dense
    (the m = 12 value 2^{91.8} independently recovers Galbraith's 2^{91}), and
    2^{62.5} to 2^{74.2} bits under Semaev's own sparse model (the m = 12 value
    2^{70.3} recovers his 2^{70}). The max of the two is MINIMISED at m = 10,
    k = 58, at 2^{69.5} bits, with time 2^{189.7} -- only 3.3 bits worse than
    the time optimum. So there is no useful time-memory tradeoff below
    2^{69.5} bits: the two terms move in opposite directions in m and their
    maximum is flat at 2^{69.5}-2^{74} across m = 10..30. Against van
    Oorschot-Wiener parallel rho, whose memory is free (w distinguished points,
    2n bits each; 2^{30} points is 2^{40.2} bits) and whose time is
    2^{n/2}/M exactly, the honest statement is: the method buys 96 bits of time
    at n = 571 for a 29-bit memory floor above any figure the freezing session
    derived, a floor that is 2^{-5.3} of the 2013 web (4 ZB = 2^{74.8} bits per
    KN-LIT-e77232) and required PER RELATION for 2^{44}-2^{58} relations.

  mechanism: >-
    Stage 1 costs 2^k * (1/P) * C, stage 2 costs 2^{k omega'}. Both depend on n
    only through k = ceil(n/m) and through C. The implementer chooses m, so the
    correct object is the two-dimensional surface (time, memory) parameterised by
    m, not the single row Table 3 prints at the m that minimises time under the
    assumption C = n^{12}. Once C is allowed to depend on k -- which is what any
    degree-growth statement means -- the optimiser trades k against m! and
    settles wherever the degree is still bounded, which is why the conclusion is
    robust to the failure of Assumption 1 and why the threshold is not. The
    memory floor arises because the two memory terms have opposite monotonicity
    in m: the relation store is 2^{ceil(n/m)} and the working set is a function
    of N = (m-2)n + km, which grows with m.

  novelty_status: adaptation
  citations:
    - ref: KN-LIT-fa346d
      provenance: retrieved
      claim: >-
        Eqs. (15)-(17), Table 3's column formulas m! 2^{n/m} n^{12} and
        2^{2n/m}, the balance m* ~ sqrt(2 ln2 n / ln n) and c = 2/(2 ln 2)^{1/2}
        ~ 1.6986; Section 4.5.2's contingency of the four-curve claim on an
        unimplemented block-structured solver ("We think the same approach is
        applicable"), with only two curves claimed without it; Section 4.2's
