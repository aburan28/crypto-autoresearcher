      verified_by: idea-generator, session sembin-20260913-9d649f
    - ref: null
      provenance: recalled
      claim: >-
        van Oorschot-Wiener parallel collision search (cited as [21] of the
        frozen paper): M-fold linear speedup of rho with w distinguished points
        and negligible memory, time ~ sqrt(pi q / 4)/M. Recalled, not opened;
