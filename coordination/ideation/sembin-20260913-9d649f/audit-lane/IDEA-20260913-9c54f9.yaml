      verified_by: null
    - ref: KN-FIND-0618ab
      provenance: internal
      claim: >-
        Records the program's own precedent for exactly this failure mode: a
        bounded-D_0 Macaulay cost model priced a matrix with zero rows at
        m >= 3, and the measured solving degree at m = 2 was D_0(s) =
        4 + floor(s/2), a GROWING function of the presentation parameter. The
        analogy is structural, not numerical: that is a digit-presentation
        prime-field system, not this one.
      verified_by: idea-generator, session sembin-20260913-9d649f
    - ref: KN-OPEN-86e7e1
      provenance: internal
      claim: >-
        Named by inputs/SEMAEV-2015-310/tables.yaml as the open problem holding
        the missing memory column; this proposal is the intended answer to it.
        NOTE: no file for this identifier exists in the repository yet, so the
        reference is forward-looking and supports nothing.
      verified_by: null

  assumptions:
    - >-
      omega = 3 and omega' = 2 throughout, to match Table 3. At omega = 2.376
      every time exponent scales by 0.792 and the thresholds move; the
      deliverable must tabulate both.
    - >-
      The block-structured solver of Section 4.5.2 exists and delivers
      n^{4 omega}. Without it the per-solve cost is [n(m-1)]^{4 omega} =
      2^{151.4} at n = 571, m = 12 (against n^{12} = 2^{109.9}), and the paper
      itself then claims only the two n = 571 curves. Both columns must be
      reported.
    - >-
      The sparse working-set model is Semaev's own and was not re-derived from
      first principles here; KN-LIT-e77232 records that its formulas are his.

  proof_search_map:
    bottleneck: >-
      The identification of Table 3's row with the algorithm's actual cost. Two
      substitutions do all the work: C = n^{4 omega} independent of k, and
      "memory is not a cost".
    baseline_embedding:
      parameter_slice: >-
        Setting d == 4, k = n/m non-integer and omega = 3 must reproduce Table 3
        exactly; the freezing session already checked all 36 cells to within
        0.7% and the crossover at n = 302.
      reproduction_check: >-
        Frozen fixture inputs/SEMAEV-2015-310/tables.yaml table_3 plus
        derived_checks.table_3_columns. The re-derivation is accepted only if it
        returns 2^186.3 for stage 1 at n = 571 with the paper's own
        non-integer k, and 2^181.7 with integer k = 48 at m = 12.
    observation_collision:
      observable: >-
        A single (n, m, time) row, as Table 3 prints it.
      distinct_preimage_search: >-
        Two cost laws with the same Table 3 row at n <= 21 and different rows at
        n = 571: C = n^{12} and C = 2^{3.12 k} n^{-0.28} agree to within the
        scatter of the paper's own 21 timings (same n^{12} at n=17..21, k=6..7)
        and differ by 2^{-9} to 2^{+27} at n = 571 depending on m. The collision
        is exhibited, not hypothetical, and it is why the fit in C3 is the
        load-bearing measurement rather than a curiosity.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from "the single m that minimises time
          at d = 4" to the whole (time, memory) surface over m in [2, n/2] with
          integer k and d = d(k), and prove a strict inward improvement or
          report its absence.
        predicted_gain: >-
          Converts one printed row into a frontier and exposes the 2^{69.5}-bit
          memory floor, the flatness of time across m = 10..14, and the
          k-pinning escape from degree growth.
      - transform: specialization_pack
        proposed_object: >-
          Resource measure "max(relation store, per-solve working set) in bits",
          realised by the specialisation m = ceil(n/k_0), with charges added
          only over the proved-disjoint stages 1 and 2.
        predicted_gain: >-
          A memory column that can be compared with vOW at all, which Table 3
          currently cannot be.
    quantifier_order: >-
      The published conclusion reads: FORALL n > 310, the method beats rho. Its
      support is: FOR the single m in Table 3, EXISTS a cost law (C = n^{12}),
      EXISTS a solver (the unimplemented block-structured one), FORALL n in a
      12-row table, time < 2^{n/2}. The reframed claim this proposal offers has
      the honest order: EXISTS k_0 (uniform in n) such that FORALL n, the
      solving degree at k = k_0 is bounded, THEREFORE FORALL n > n_0(k_0) the
      method beats rho. The witness k_0 is allowed to depend on nothing; that is
      what makes it testable.
    method_ceiling:
      strongest_certifiable_claim: >-
        An exact, reproducible (time, memory) frontier as a function of
        (n, m, omega, d(.), block-solver on/off), with every input labelled
        assumed or measured, plus fitted per-solve exponents with honest
        confidence statements from 21 published timings. It cannot measure d(.)
        -- that is IDEA-20260913-9ba7fc and -915511 -- and it cannot make any
        claim about a real implementation at n > 45.
      nearby_object_control: >-
        Apply the same frontier machinery to Petit-Quisquater's
        2^{c n^{2/3} ln n} claim, where the conclusion "beats rho for n > 2000"
        is known and published, and check the machinery returns that threshold
        from that paper's parameters. If it cannot reproduce a second published
        threshold it has not identified the load-bearing structure.
    proof_obligations:
      - claim: Table 3 is reproduced exactly at d = 4, non-integer k, omega = 3
        responsibility: baseline
      - claim: >-
          max(relation store, working set) is minimised at an interior m and the
          minimum is 2^{69.5} bits at n = 571 under the sparse model
        responsibility: memory
      - claim: >-
          Pinning k at k_0 and paying ceil(n/k_0)! beats 2^{n/2} whenever
          k_0 > 2 log2(n/k_0) + O(1)
        responsibility: runtime
      - claim: >-
          The fitted per-solve exponent from the published timings is
          inconsistent with 4 omega >= 9.5 at any reasonable noise model
        responsibility: strictness
      - claim: >-
          The vOW comparison uses the source's own constants
        responsibility: interface

  predictions:
    - metric: >-
        fitted per-solve time exponent in the variable count N, from the 21
        Table 1-2 timings with cell-level bootstrap
      direction: lower
      minimum_effect: >-
        upper end of the 90% interval below 9.5 (= 4 omega at omega = 2.376).
        Point estimates derived here are 4.75 (k = 4 ladder) and 5.40 (k = 3
        ladder). If the interval covers 9.5 the published law is not
        contradicted by its own timings and C3 is withdrawn.
    - metric: >-
        fitted per-unit-k time exponent a in time = 2^{a k} n^{b}
      direction: higher
      minimum_effect: >-
        a >= 2 with b indistinguishable from 0. Point estimates here: a = 3.12
        (two-point, k 6 -> 7 at m = 3) and b = -0.28 (two-point, n 19 -> 21 at
        k = 7).
    - metric: >-
        min over m of max(relation store, per-solve working set) in bits at
        n = 571
      direction: higher
      minimum_effect: >-
        >= 2^{69} bits, i.e. at least 20 bits above the 2^{48} relation count
        and at least 29 bits above the 2^{58.7}-bit relation-store figure the
        freezing session derived. A frontier point below 2^{60} bits falsifies
        C4.
    - metric: recomputed crossover threshold n* with 2^{n/2}
      direction: higher
      minimum_effect: >-
        n* >= 330 under any model with d strictly increasing in k; the paper
        states 310 and its own formula gives 302-303.
    - metric: >-
        total time at n = 571 under the linear-in-k degree rate calibrated to
        the two Kosters points
      direction: higher
      minimum_effect: >-
        2^{233} +/- 3 bits, still below rho's 2^{285.5}. A value ABOVE 2^{285.5}
        would falsify C1 and would be a much stronger result.

  minimal_test:
    design: >-
      Entirely re-analysis and modelling; no algebra, no solver, no new
      instrument. One script, five outputs, each a table with every input
      labelled assumed / measured / cited:
      (1) exact reproduction of Table 3 at d = 4, non-integer k, omega = 3;
      (2) the same at integer k = ceil(n/m) with m re-optimised, and the
      resulting crossover;
      (3) per-solve cost-law fit over the 21 published timings: the nested
      models time = C n^{p}, time = C N^{p}, time = C 2^{a k} n^{b}, with
      cell-level bootstrap intervals and an explicit statement of how few
      degrees of freedom each ladder has (4, 3 and 2 points respectively);
      (4) the (time, memory) frontier over m in [2, n/2] at n in {163, 233,
      283, 310, 409, 571} with the relation store, dense and sparse working
      sets, and the max, plus the memory-minimising m;
      (5) the vOW comparison at matched memory budgets in {2^{40}, 2^{50},
      2^{60}, 2^{70}, 2^{80}} bits, with rho's time taken from the source's own
      constants, and the affected / safe FIPS scope recomputed at each budget
      and each degree-growth model.
    controls:
      - >-
        Baseline reproduction gate: no derived table is reported unless the
        d = 4 / non-integer-k column reproduces the frozen Table 3.
      - >-
        Nearby-object control: the same machinery applied to the
        Petit-Quisquater threshold (n > 2000) as relayed by the frozen paper's
        introduction, to check it returns a published number it did not fit.
      - >-
        Unit control: state whether "operation" means a field operation or a
        group operation in each row, since rho is quoted in group operations
        and eq. (15) in field operations -- a factor of order n that currently
        favours the method silently.
      - >-
        Null cost law: a deliberately wrong law (time constant in every
        parameter) run through the same pipeline, to confirm the pipeline can
        produce a threshold that contradicts the paper's and is therefore not
        rigged.
    required_metrics:
      - reproduced Table 3 residuals
      - fitted exponents with bootstrap intervals and degrees of freedom
      - (time, memory) frontier points per (n, m) with all three memory terms
      - memory-minimising m and the floor in bits
      - crossover n* per (degree model, omega, block-solver on/off)
      - affected / safe scope statement per memory budget

  falsification_conditions:
    - >-
      The fitted per-solve exponent interval covers 4 omega: C3 withdrawn, the
      published law stands against its own data.
    - >-
      max(relation store, working set) admits a frontier point below 2^{60}
      bits at n = 571: C4's floor is wrong.
    - >-
      Pinning k at a constant does NOT beat 2^{n/2} for any k_0 at n = 571
      (i.e. the m! penalty always dominates): C1 is refuted and Assumption 1 is
      load-bearing after all -- which would make the whole audit lane more
      important, not less.
    - >-
      The re-derivation cannot reproduce Table 3 at d = 4: the re-derivation is
      wrong.
    - >-
      The machinery cannot reproduce the Petit-Quisquater n > 2000 threshold
      from that paper's stated parameters: the modelling is not trustworthy and
      no threshold it emits may be cited.

  confounders:
    - >-
      Every timing in Tables 1-2 is MAGMA F4 on one 2.6 GHz i7 with 16 GB, and
      the memory column is the total over 100 systems rather than per system
      (transcription limit already recorded in tables.yaml). Fitting an exponent
      to 21 such numbers across different m, t and k confounds algorithmic
      scaling with memory-pressure effects on one machine; the n = 15, m = t = 5
      cell at 3286.9 MB is within a factor 5 of that machine's RAM and may be
      swapping.
    - >-
      The fixed-k ladders have 4, 3 and 2 points. A 3-point, 3-parameter fit has
      zero residual by construction and is not a test; this must be said in the
      deliverable, not buried.
    - >-
      Group-operation versus field-operation units (see controls).
    - >-
      The block-structured solver is assumed, and it is assumed to change the
      exponent but not the memory. If it is a Wiedemann/XL block method as
      Semaev's comment thread suggests, its memory profile is different from
      F4's and the frontier must be recomputed for it.
    - >-
      Non-integer k in the paper's own table both raises stage-1 cost and lowers
      stage-2 cost relative to integer k, so "integer k is more honest" is not
      the same as "integer k is worse for the paper": at n = 571, m = 12 it
      LOWERS stage 1 from 2^{186.3} to 2^{181.7}.

  interpretation_limits:
    - >-
      This proposal measures nothing about the mathematics. It is a cost
      re-derivation and a sensitivity analysis; every degree-growth model it
      evaluates is a hypothesis, and the linear rate calibrated from two
      unreproduced blog-comment data points is the weakest-supported input in
      the whole exercise and must be labelled so at every use.
    - >-
      C1 is a statement that the FIPS conclusion is ROBUST to a class of
      failures of Assumption 1. It is not a statement that the FIPS conclusion
      is true, and it must not be cited as strengthening the attack: it
      strengthens nothing, it relocates what would have to be measured.
    - >-
      A memory floor of 2^{69.5} bits is not a refutation. It is the honest
      memory column the target result profile requires and the paper omits.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Bounded degree at pinned k.) There exists a constant k_0, independent
        of n, and a constant d_0, such that for all n and all instances of the
        Weil descent of eq. (5) with t = m = ceil(n/k_0) and dim V = k_0, the
        solving degree is at most d_0.
      rigorous_support: >-
        Rigorous ingredient: the first fall degree of these systems is 4, proved
        in Section 4.5 of the frozen paper for the all-variable S_3 and bounded
        by 5 for the constant-R_X one by Hodges-Petit-Schlather as cited there
        (provenance recalled for the latter). Distribution statement it imitates:
        the solving degree of an overdetermined Boolean system behaves like the
        Bardet-Faugere-Salvy degree of regularity of a semi-regular system with
        the same number of equations and variables, which at a FIXED number of
        factor-base variables k_0 and a growing number of auxiliary variables
        (m-2)n is an increasingly overdetermined regime and should therefore NOT
        grow.
      validation_plan: >-
        The fixed-k ladder of IDEA-20260913-9ba7fc: hold k in {3, 4, 6, 7} and
        grow n through every value the paper's own tables cover and beyond
        (n = 13..30 at k = 3, 4), measuring the solving degree exactly. Compared
        against: the constant function 4, and the matched semi-regular
        prediction for the same shape. Tail check: the largest solving degree
        over all instances at the largest reachable n, at each k. Note that the
        paper's own Tables 1-2 already contain three such ladders at k = 4
        (n = 13..16), k = 3 (n = 13..15) and k = 7 (n = 19, 21), all reporting
        4 -- so H1 is the assumption its data actually supports, which is the
        reason to state it. Transfer assumption: nothing is claimed at
        n > 30 by this route; the extrapolation is to be reported as a fitted
        growth rate with an interval, never as a bound.
    - id: H2
      statement: >-
        (Sparse working-set model.) The degree-4 Macaulay/XL matrix for the
        descended chained system in N = (m-2)n + km variables has about
        (nm)^4/4! columns with about n^3/m nonzeros per row, so the working set
        is about (nm)^4/4! * n^3/m bits.
      rigorous_support: >-
        None rigorous. These are Semaev's own formulas as recorded in
        KN-LIT-e77232 and re-checked arithmetically there; the structural claim
        that the descended system's row weight is n^3/m is not derived anywhere
        in this program.
      validation_plan: >-
        Directly measurable and cheap: build the descended system at
        (n, m, t) = (21, 3, 3), (25, 3, 3), (40, 2, 2), (45, 2, 2) and count
        actual columns and nonzeros per row of the degree-4 Macaulay matrix
        against (nm)^4/4! and n^3/m. Compare the empirical row-weight
        distribution against the predicted point value, with the maximum row
        weight as the tail check. This single measurement decides the 2^{70}
        versus 2^{91} dispute in KN-LIT-e77232 on the small end of the range and
        gives the growth rate to extrapolate, and it costs under 2 GiB.

  target_complexity:
    time_exponent: >-
      Audited. Paper: 2^{1.6986 sqrt(n ln n)} and Table 3's 2^{186.3} at
      n = 571. Re-derived here: 2^{181.7} at m = 12 integer k; 2^{175.1} with m
      re-optimised; 2^{213} / 2^{233} under log2 and linear degree growth in k;
      2^{177} under an exponential-in-k per-solve law fitted to the paper's own
      timings. Crossover with 2^{n/2}: 302 (paper's formula), 303 (integer k,
      m re-optimised), 336-339 (degree growing in k), 347 (satisfiable arm at
      degree 6), 400 (degree 7).
    memory_exponent: >-
      Supplied where the paper has none: relation store 2^{ceil(n/m)}(2n+mk)
      bits; per-decomposition working set 2^{69.5}-2^{103.0} bits at n = 571
      over m = 2..30; the minimum of the max over m is 2^{69.5} bits at m = 10
      under the sparse model and 2^{64.1} bits at m = 2 under the dense model
      only because the relation store there is 2^{296.7}.
    best_known: >-
      van Oorschot-Wiener parallel rho: time sqrt(pi 2^n / 4)/M group
      operations, memory w * 2n bits for w distinguished points with w free,
      unconditional, and perfectly parallel. Every other frontier row
      (Petit-Quisquater conditional 2^{c n^{2/3} ln n}; Gaudry/Diem for
      non-prime n; Semaev 2015 itself) is checked in this proposal's output
      table 5.
    hidden_overhead: >-
      omega = 3 vs 2.376 rescales every time exponent by 0.792. The
      block-structured solver is assumed and unimplemented; without it the
      paper's own claim drops from four curves to two. The unit mismatch between
      field and group operations is an unquantified factor of order n in the
      method's favour.
    tradeoff_note: >-
      The time-memory tradeoff is the deliverable: time is flat within 3.3 bits
      across m = 10..14 at n = 571 while the memory maximum is flat at
      2^{69.5}-2^{70.9}, so there is no exploitable interpolation in that range,
      and outside it memory rises in both directions. Parallelisation: stage 1
      is embarrassingly parallel across relations (the paper says so), but
      Galbraith's objection is that the per-relation working set is not
      distributable; the frontier must be stated per node, not aggregate.

  dominated_by: >-
    The audited algorithm is dominated by van Oorschot-Wiener parallel rho on
    the memory axis at every n (2^{40.2} bits vs a 2^{69.5}-bit floor at
    n = 571) and on the time axis for all n below the recomputed threshold
    (303-400 depending on model). It dominates rho on time at n = 409 and 571
    under every degree model evaluated here. Frontier rows checked: vOW rho;
    plain rho; Petit-Quisquater conditional; Gaudry/Diem (non-prime n, out of
    scope); Semaev 2015 as printed. The deliverable itself is a cost
    re-derivation and occupies no frontier point.
  sota_delta: >-
    Moves no exponent and claims no attack. Quantitatively it supplies: the
    memory column the paper omits (floor 2^{69.5} bits at n = 571, minimised at
    m = 10, versus 2^{40.2} bits for the competitor); a corrected threshold
    (302-303 -> 336-400 as soon as the degree grows in k at all); a 4.6-bit
    integer-k correction to the paper's own n = 571 stage-1 figure at its own m;
    an 11.2-bit improvement to it if m is re-optimised; and a relocation of the
    load-bearing assumption from Assumption 1 to "bounded degree at some fixed
    k_0 >= 10". Cost: one analysis script, zero new algebra, hours not days.

  test_boundary:
    instances: >-
      Analytical only: n in {163, 233, 283, 310, 350, 400, 409, 450, 500, 571},
      m in [2, n/2], omega in {2.376, 3}, omega' in {2, 3}, block solver on/off,
      degree models {4, 4+log2(k/20), 4+(k-20)/3, 4+sqrt(k-20), fitted
      2^{a k}}. The fitting input is the 21 published timings, and nothing else.
    parameters:
      instruments: python + numpy only (no Sage/Singular/msolve/MAGMA here)
      fit_degrees_of_freedom: stated per ladder (4, 3, 2 points)
    budget:
      wall_clock_seconds: 3600
      maximum_memory_gb: 1
      maximum_runs: 1
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
