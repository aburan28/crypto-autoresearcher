  assumptions:
    - >-
      Standalone mathematical instances and derivations only. No deployed target, no
      private key, no claim about the security of any FIPS PUB 186-4 binary curve in
      either direction.
    - >-
      The ambient basis is the polynomial basis 1, alpha, ..., alpha^{n-1} used by
      Semaev's Section 4.5. sigma and d2 are defined relative to it, and sigma is
      basis-dependent by construction. A normal-basis or dual-basis representation
      would give different sigma and is a separate experiment, named in
      interpretation_limits and not claimed here.
    - >-
      Comparison is at EQUAL k and equal (n, f, B, m, t, instance seeds, variable
      order). Any arm that changes two of these at once is discarded. This is the exact
      control Semaev's two starred rows already satisfy for the low-degree/random pair;
      the Sidon arm is added to it.
    - >-
      No degree assumption is inherited. (C1)-(C3) are basis-arithmetic theorems and
      exact computations. (C4)'s thresholds are on wall-clock and memory with d_ff and
      the observed solving degree recorded as OUTPUTS, not premises. In particular
      Assumption 1 is neither used nor tested.
  predictions:
