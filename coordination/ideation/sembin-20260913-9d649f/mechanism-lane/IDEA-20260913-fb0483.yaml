    dominant_cost: >-
      The random-subspace arm, because it needs >= 20 independent draws x 100 instances
      to have its own spread, and because it is the slowest arm by hypothesis.
  recommended_priority: high
  proof_search_map:
    bottleneck: >-
      The bottleneck this record addresses is not a proof step but an UNEXPLAINED
      MEASUREMENT that the construction's cost model depends on: Semaev's cofactor
      n^{4 omega} is charged as if the subspace were irrelevant, while his own Table 1
      shows a 2.4x at equal k. The proof-oriented content is (C1)'s extremality
      statement and (C2)'s degeneracy argument, both of which are short and both of
      which are load-bearing for the closure of the search over V.
    baseline_embedding:
      parameter_slice: >-
        n = 17, m = t = 3, k = 6, B = 1, f of degree 17, 100 random z. This is exactly
        Table 1's starred pair and exactly the cell Semaev compared.
      reproduction_check: >-
        A modern solver must reproduce the RATIO 2.373 (and 2.839 on the random-f pair)
        to within [1.5, 4.0], and must reproduce d_F4 = 4 and exp_prob near 0.28-0.36
        on both arms. Absolute seconds are NOT expected to reproduce (2015 MAGMA on a
        2.6 GHz i7 against a 2026 solver) and any protocol that requires them is
        misdesigned. If the ratio does not reproduce, sub-objective 2's premise fails
        and that is the finding.
    observation_collision:
      observable: >-
        Median solve time (and peak memory) at equal (n, f, B, m, t, k, order, seeds).
      distinct_preimage_search: >-
        DONE and SUCCESSFUL -- this is the core of the record. Two distinct structural
        quantities, sigma and d2, are both preimages of the same observable in the only
        comparison Semaev ran, because V_low minimises both and V_random maximises both.
        The search for a third preimage found one: the anti-diagonal POSITION pattern
        l = i + j of the low-degree arm's nonzeros, which is neither a count nor a
        dimension, and which HEUR-SIG's random-model justification names explicitly as
        the mechanism that the NEITHER outcome would indicate. So the observable has at
        least three candidate preimages and the design separates the first two exactly
        and flags the third.
    constructive_transforms:
      - >-
        V_low -> V_Sidon: replace the exponent set {0,...,k-1} by a Sidon set inside
        [0, floor((n-1)/2)]. Preserves sigma exactly (both equal k(k+1)/2 by (C1)'s
        equality condition), maximises d2. Exists iff k = O(sqrt(n)); constructed
        explicitly at n = 23, k = 4.
      - >-
        V_low -> V_random: destroys both. The null.
      - >-
        V_low -> F_{2^d} subfield: pushes d2 BELOW the Kneser bound via the exceptional
        branch, and simultaneously empties the solution set. The known-false control.
      - >-
        V -> cV for c in F_{2^n}*: preserves sigma and d2 exactly (scaling the space
        scales every product). A free 2^n-sized family of arms with identical predicted
        behaviour, which is the cheapest available consistency check on the harness and
        costs one extra arm.
      - >-
        variable order -> reversed / permuted: preserves sigma and d2 exactly and
        changes only the elimination order. Isolates the goal's ordering-artifact
        reading.
    quantifier_order: >-
      Stated explicitly because the record's value depends on it. (C1) is: FOR ALL n,
      FOR ALL k, FOR ALL k-dimensional F_2-subspaces V of F_{2^n}, sigma(V) >= k(k+1)/2
      and (d2(V) >= 2k-1 OR there EXISTS d | n with d > 1 and V.V an F_{2^d}-module).
      Universal in V, with an existential escape clause -- this is the strong order and
      it is what makes the search over V closeable. (C2) is: FOR ALL d | n with d > 1,
      FOR ALL B outside F_{2^d} (a 1 - 2^{d-n} fraction), the subfield arm has NO
      solutions -- again universal. (C4) is the weak one: THERE EXISTS a cell (n, k) at
      which the three arms separate. A single separating cell supports a mechanism
      claim at that cell and NOT a universal one, and the record does not upgrade it.
      The dangerous inversion to avoid is reading (C4)'s existential as (C1)'s universal:
      "sigma explains the gap" is established at a cell, never for all (n, k).
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest thing this method can certify is: the multiplicative geometry of
        V changes the descended system's input size by a factor n/2 at equal k, this is
        extremal by Hou-Leung-Xiang, the extremal escape hatch is empty by (C2), and at
        one or two cells the runtime responds to sigma rather than to d2 (or the
        reverse). It CANNOT certify any change to the 1.6986 constant, cannot certify a
        cofactor exponent, and cannot certify anything at k with 2k - 2 >= n, which is
        every Table 3 parameter.
      nearby_object_control: >-
        The nearby object is the SAME comparison run on a system whose cost is known not
        to depend on multiplicative structure: a random Boolean system with the same
        variable count, the same quadratic/cubic generator split and the same number of
        equations, built with no field arithmetic at all. Its sigma is undefined, so the
        control is constructed by matching total monomial occurrences to each arm's
        sigma and measuring whether the timing gap reappears. If a monomial-count-matched
        random system reproduces the gap, the gap is a size effect and nothing about
        fields is involved; if it does not, the effect is specific to the anti-diagonal
        structure. This control costs one extra arm and is the cheapest way to find out
        that the whole record is about sparse linear algebra rather than about
        subspaces.
    proof_obligations:
      - >-
        Prove sigma(V) >= k(k+1)/2 with the stated equality condition. Immediate:
        v_i v_j != 0 for all i, j in a field, so each of the k(k+1)/2 products
        contributes at least one nonzero coordinate; equality forces each product to be
        a single ambient basis element, hence {v_i v_j} is contained in
        c . {alpha^l}, which after scaling by c^{-1} gives v_i = alpha^{a_i} up to a
        common scalar and 2 max(a_i) < n. One paragraph; must be written out because
        the equality condition is what (C3) rests on.
      - >-
        Specialise Hou-Leung-Xiang to F = F_2, L = F_{2^n}, S = T = V, checking that
        F_{2^n}/F_2 is separable (finite extension of a finite field) and that the
        stabiliser form and the subfield form are the equivalent statements the source
        says they are. Half a page, cites Bachoc-Serra-Zemor Theorem 2 as read.
      - >-
        Prove (C2): with x_i in F_{2^d}, S_3(x_1,x_2,x_3) in F_{2^d} + B, so eq. (14) has
        a solution only if B in F_{2^d}. One line, but it must be stated for the
        CHAINED system too, where the auxiliary u_i range over all of F_q and are NOT
        confined to the subfield -- the argument survives because the first equation
        S_3(u_1, x_1, x_2) has two subfield arguments and one free one, so it is
        satisfiable; the degeneracy bites on the t = 2 equation S_3(x_1, x_2, R_X) and on
        eq. (4), and the proposal must say exactly which chain positions it kills rather
        than asserting the whole construction dies. THIS OBLIGATION IS NOT YET
        DISCHARGED and is the record's weakest link: if the chained presentation evades
        the subfield degeneracy, the Kneser exceptional branch reopens and the record's
        closure of the search over V is void.
      - >-
        Exhibit, for each cell used, an explicit k-element Sidon set inside
        [0, floor((n-1)/2)] with a certificate that all k(k+1)/2 pairwise sums are
        distinct, or record that none exists at that (n, k) and that the arm is a
        partially-spread family. Mechanical.
    not_applicable_reason: null
  dominated_by:
    status: >-
      NOT DOMINATED for the question asked, because no row of the frontier answers it;
      DOMINATED in absolute terms by parallel rho, as the whole construction is.
    checked_rows:
      - >-
        Parallel Pollard rho / van Oorschot-Wiener (KN-TECH-006, KN-LIT-012): 2^{n/2}
        time, O(1) memory, 0 queries, linear parallel speedup. DOMINATES the entire
        Semaev construction at every n where its assumptions have been validated, and
        dominates this record's arms trivially since they are components of that
        construction. Checked on all three axes: time 2^{n/2} versus stage-1
        2^{186.0} at n = 571 against rho's 2^{285.5}, so Semaev's TIME is better on its
        own model; memory O(1) versus Theta(2^{48}) relations, so rho is better on
        memory by 48 bits; queries 0 versus 0, a tie. So the domination is not total --
        Semaev's model beats rho in time and loses in memory at n = 571, which is the
        open memory-charged-crossover question KN-OPEN-86e7e1, and this record changes
        neither column.
      - >-
        Gaudry / Diem-style index calculus with a factor base defined by "any subspace
        of dimension k" (the [3] that Semaev credits): this is the arm this record's
        V_random represents. Same time and memory exponents as Semaev's; this record
        measures it as a factor 2.4 SLOWER in the cofactor at one cell. So V_random is
        dominated by V_low in the cofactor and identical in every exponent.
      - >-
        Galbraith-Gebregiyorgis coset-typed factor bases (KN-LIT-439, and the sibling
        IDEA-20260913-8138a0): changes the m! in the yield law, not the subspace
        geometry. ORTHOGONAL rather than dominating -- both devices can be applied
        together, and neither this record nor the sibling claims the composition.
      - >-
        Symmetric-function / elementary-symmetric-coordinate presentations
        (Faugere-Gaudry-Huot-Renault, KN-LIT-004 as a corpus record only): these change
        the variable set, so sigma and d2 are not defined on them in the same way, and
        the comparison is not on the same frontier. Named so the row is not silently
        skipped, and recorded as NOT COMPARABLE rather than as checked.
      - >-
        Trimoska-Ionica-Dequen SAT-based point decomposition: a different solver on the
        same systems. It would respond to sigma differently (clause count rather than
        monomial count), so it is a natural second arm and NOT a dominating row. Cited
        from a source fetched in this batch; not compared numerically here.
    missing_comparisons:
      - >-
        No comparison against a normal-basis representation, where sigma is a different
        tensor entirely. This is the largest gap in the frontier check and it could
        plausibly beat the low-degree arm; it is named as forward guidance.
      - >-
        No comparison against factor bases that are not subspaces at all (Diem's
        general-position factor bases, Semaev's own prime-field "residues bounded by
        q^{1/n+delta}" construction from Section 3). Those leave the subspace frontier
        and the (C1) bound does not apply to them.
      - >-
        No quantum row. Nothing here is quantum-relevant and the frontier check does not
        include quantum algorithms; that is a declared omission, not an oversight.
    note: >-
      `dominated_by` is NOT null. The honest summary: this record is a cofactor
      observation inside a construction that is itself dominated on memory by rho at
      the parameters it targets, and its own best case is a bounded factor n/2 that
      vanishes at exactly those parameters (hidden_overhead (i)). It earns its priority
      from the information it buys about a WIDE OPEN sub-objective at very low cost, not
      from a position on the frontier.
