        k = 7. Falsified at any (n, k) where the measured ratio departs from n/2 by more
        than 5 percent with 2k - 2 < n, which would mean the single-coordinate product
        structure of the polynomial basis is not the mechanism.
    - metric: dim(V.V) for the low-degree space, exact
      direction: lower
      minimum_effect: >-
        Exactly 2k - 1 whenever 2k - 2 < n, and never below 2k - 1 for any V whose
        product space is not a proper-subfield module. Falsified by exhibiting a
        k-dimensional V with d2 < 2k - 1 and V.V not an F_{2^d}-module for any d | n,
        d > 1 -- which would contradict Hou-Leung-Xiang and is therefore a check on the
        implementation rather than on the theorem.
    - metric: >-
        time(V_Sidon) / time(V_low) and time(V_Sidon) / time(V_random) at one (n, k)
        with matched f, B, seeds and variable order
      direction: unknown
      minimum_effect: >-
        The three outcomes of (C4) are separated at a factor 1.8 and a window
        [0.7, 1.4]. A result that lands in neither the SIGMA nor the D2 outcome and
        outside the NEITHER window (for instance time(V_Sidon) between 1.4x and 1.8x
        time(V_low)) is reported as inconclusive at that (n, k) and repeated at a second
        (n, k) before any conclusion; the direction is deliberately declared UNKNOWN
        here because the whole point of the test is that the proposer does not know it.
    - metric: >-
        number of coordinate equations of a chained S_3 block that are identically
        linear in the V-coordinates, counted symbolically
      direction: higher
      minimum_effect: >-
        max(0, n - (4k - 3)) for V_low against 0 for V_random, almost surely. At
        n = 23, k = 4 this is 23 - 13 = 10 free linear equations for V_low and 0 for
        V_random; at n = 17, k = 6 it is max(0, 17 - 21) = 0 for BOTH, which is a
        prediction that the n = 17, k = 6 cell -- the only cell Semaev actually compared
        -- has NO free-linear-equation advantage and so its 2.4x must be a pure sigma
        effect. Falsified if the n = 17, k = 6 cell's Sidon arm behaves like the random
        arm, since that would require a d2 effect at parameters where the free-linear
        count is zero on both sides.
  minimal_test:
    execution_status: >-
      NOT EXECUTED. Steps (1) and (2) below were executed IN THIS TASK as exact
      computations and their outputs are reported above and in the citations; they
      required no algebra engine and no elliptic curve. Step (3) is NOT executed and
      needs a separate approved contract.
    design: >-
      (1) DONE, exact, no sampling: for n in {12, 17, 19, 23} and k in {4, 5, 6, 7},
      compute sigma(V) and d2(V) for V_low, for every sigma-minimal exponent family
      V_a with 2 max(a_i) < n that is reachable by enumeration, for the subfield V
      where k | n, and for >= 100 random full-rank k-subspaces. Report exact counts for
      the structured arms and mean/sd for the random arm. This is the (C1)-(C3)
      evidence and it is arithmetic over GF(2)[x]/(f) alone.
      (2) DONE: verify the (C2) degeneracy symbolically -- with x_1, x_2, x_3 in a
      subfield F_{2^d}, eq. (14) forces B in F_{2^d}, so the relation supply is empty
      for a 1 - 2^{d-n} fraction of curves. This is a one-line argument and is recorded
      as such rather than as a measurement.
      (3) NOT DONE, the discriminating run: fix one curve E over F_{2^n} with the same
      f, the same B, and one (m, t, k). Build the Weil-descended chained system (5) for
      each of V_low, V_Sidon, V_random, using the SAME instance list z_1..z_S (S >= 100
      random z in F_{2^n}, per the paper's own Section 4.5.1 substitution of a random z
      for R_X), the SAME monomial order, and the SAME solver invocation. Record per
      instance: wall clock, peak memory, first fall degree, the maximum step degree,
      the degree-4 Macaulay rank and deficit, and satisfiability. Then repeat the whole
      thing with the variable order reversed, which is the control for the goal's
      "artifact of the variable ordering" reading. Recommended cell: n = 23,
      f = x^23 + x^5 + 1, k = 4, V_Sidon = {0,1,3,7}, t = 3 (N = 23 + 12 = 35 Boolean
      variables, 46 Boolean equations) -- chosen because k = 4 is the smallest k at
      which a genuine Sidon set with 2 max < n exists, and because n = 23 puts
      4k - 3 = 13 strictly below n so the free-linear-equation count differs between
      arms (10 against 0), whereas at Semaev's own n = 17, k = 6 it is zero on both
      sides. Run BOTH cells: the n = 17, k = 6 cell reproduces Semaev's 2.4x under a
      modern solver and is the exact-baseline-reproduction audit; the n = 23, k = 4 cell
      is the discriminator.
    matched_null: >-
      The V_random arm IS the null object: same k, same field, same curve, same seeds,
      same order, no multiplicative structure. It is the null in the inventor-protocol
      sense because it is the same shape with the hypothesised structure destroyed. The
      destroying parameter is sigma, and the required decay behaviour is explicit: as k
      grows at fixed n, sigma_low / sigma_random must fall like 2/n and the timing gap
      must widen; a timing gap that does NOT respond to sigma when sigma is driven
      apart is the canonical artifact tell and refutes the SIGMA outcome of (C4).
    known_false: >-
      The subfield arm, available whenever k | n (e.g. n = 12, k = 4; n = 20, k = 4 or
      5; n = 24, k = 4, 6 or 8). It has d2 = k, strictly below the Kneser bound, so any
      argument of the form "smaller d2 implies a faster relation search" must predict
      that it is the FASTEST arm. It is in fact the arm with no relations at all for a
      generic B, by (C2). Running it is the proves-too-much control for this record's
      own mechanism: if the measured timing story ranks the subfield arm fastest and the
      proposer had stopped at "minimise d2", the conclusion would have been an algorithm
      that never emits a relation. Cost: one extra arm at n = 12, k = 4.
    invalid_input_reject: >-
      Reject and record, never silently absorb: (a) any f that fails an irreducibility
      certificate; (b) any candidate V whose k generators are not full rank; (c) any
      arm whose instance list, monomial order, B, or solver version differs from the
      others; (d) any timing taken on a machine with a different load profile than its
      paired arms, since the whole claim is a ratio; (e) any cell where 2 max(a_i) >= n
      reported as sigma-minimal, since (C1)'s equality condition then fails and the
      arm is no longer a sigma-matched control.
    controls:
      - >-
        V_random at equal k (the null), >= 20 independent draws so the arm has its own
        spread rather than a single sample.
      - >-
        Reversed and randomly permuted variable orders on every arm: this is the control
        for the goal's alternative reading that the 2.4x is an ordering artifact, and it
        is run whether or not the main result looks structural.
      - >-
        The subfield arm (known-false / proves-too-much control), at n = 12, k = 4.
      - >-
        Exact-baseline reproduction: the n = 17, m = t = 3, k = 6, B = 1 cell with both
        low-degree and random subspace, against Semaev's 11.41 s / 364.1 MB and
        27.08 s / 378.1 MB. A modern solver will not reproduce the absolute numbers;
        the check is on the RATIO, and a modern ratio outside [1.5, 4.0] is itself the
        finding and must be reported before any of (C4)'s thresholds are applied.
      - >-
        Random-f arm: Semaev's Table 1 includes n_random_f rows, and the low-degree
        space depends on f, so f is a nuisance parameter. At least 3 distinct
        irreducible f per cell.
      - >-
        Degree recording on every arm. If d_ff or the maximum step degree differs across
        arms, the timing comparison is confounded by a degree effect and the record
        becomes a degree observation instead of a size observation. This is an
        unexpected-observation channel, not a failure.
    decision_threshold: >-
      (C1) and (C3) are already settled as exact computations; they fail only to an
      implementation error, and the failure mode is named under predictions.
      (C4) decides between SIGMA, D2 and NEITHER at the stated thresholds (1.8x
      separation, [0.7, 1.4] equivalence window), applied to the MEDIAN over >= 100
      matched instances per arm, with a Mann-Whitney U test at alpha = 0.01 required
      before either exclusive outcome is declared. If the exact-baseline reproduction
      ratio is outside [1.5, 4.0] the cell is reported as not reproducing Semaev's
      observation and no mechanism claim is made from it.
    stopping_rules:
      - >-
        Stop step (3) at a cell as soon as >= 100 matched instances have completed on
        all three arms, or at 4 CPU-hours per arm per cell, whichever comes first.
      - >-
        Abandon a cell (recording it, never deleting it) if any arm's median solve
        exceeds 10x the slowest other arm's, since the comparison is then dominated by
        one arm's timeout behaviour rather than its algebra.
      - >-
        Stop the whole test after the n = 23, k = 4 and n = 17, k = 6 cells. A third
        cell is a new contract; three cells cannot support an extrapolation in n
        anyway and this record makes no asymptotic claim.
    required_artifacts:
      - The exact f, B, V generators, instance list z_1..z_S and seeds for every arm.
      - Per-instance wall clock, peak memory, d_ff, max step degree, D = 4 Macaulay rank and deficit, satisfiability.
      - The exact sigma and d2 for every V used, recomputed by the run harness rather than copied from this record.
      - Solver name and version, machine, load profile, and the order in which arms were run (to expose warm-cache bias).
      - The reversed-order and permuted-order repeat of every arm.
      - The raw per-instance table, not just medians.
    budget:
      authorized_runs_in_this_task: 0
      future_experiment_status: >-
        Requires a new approved frozen handoff and contract. Steps (1) and (2) are
        already complete as exact computations in this task and need no contract; only
        step (3) does. This record neither creates, approves nor dispatches it.
  falsification_conditions:
    - >-
      A k-dimensional F_2-subspace V of F_{2^n} with sigma(V) < k(k+1)/2. This is
      impossible if every v_i v_j is nonzero, so such a finding refutes the
      implementation, not (C1).
    - >-
      A k-dimensional V with dim(V.V) < 2k - 1 whose product space is NOT a module over
      any proper subfield F_{2^d}, d | n, d > 1. This refutes the Hou-Leung-Xiang
      dichotomy as applied here -- most likely by the separability or the F = F_2
      specialisation being misread -- and would invalidate (C1)'s extremality claim
      entirely.
    - >-
      An exponent family {a_i} with 2 max(a_i) < n and sigma = k(k+1)/2 whose
      dim(V.V) is NOT k(k+1)/2 when the pairwise sums a_i + a_j are all distinct. This
      refutes the (C3) separation and removes the discriminating object, at which point
      the two mechanisms cannot be told apart by this design and the record should be
      superseded rather than patched.
    - >-
      In step (3): time(V_Sidon) within [0.7, 1.4] of time(V_low) AND time(V_random)
      within [0.7, 1.4] of time(V_low). Then neither sigma nor d2 explains anything, the
      2.4x does not reproduce, and (C1)'s exact counts are true but inert -- a bounded
      structural quantity with no runtime consequence. This is a complete negative and
      it is the outcome the record is most exposed to.
    - >-
      In step (3): a measured d_ff or max-step-degree DIFFERENCE across arms exceeding
      1. The comparison is then a degree comparison, (C5)'s "cannot move the exponent"
      reasoning no longer applies (a degree that depends on the subspace enters the
      cost model multiplicatively in the exponent, not in the cofactor), and the record
      must be superseded by one that treats the subspace as a degree parameter. This is
      the single outcome that would make sub-objective 2 exponent-relevant after all,
      and it is stated here so it cannot be quietly reinterpreted later.
    - >-
      The subfield arm emitting relations at a generic B. This refutes (C2) and reopens
      the Kneser exceptional branch as a real option, which would be a much stronger
      result than anything claimed here.
  confounders:
    - >-
      VARIABLE ORDER. The low-degree basis induces a natural order on the
      V-coordinates that matches the ambient order; a random basis does not. Every arm
      is therefore run under at least three orders (natural, reversed, random). Without
      this control the whole comparison is uninterpretable, and it is exactly the
      confounder the goal names.
    - >-
      SOLVER IMPLEMENTATION. MAGMA's F4 in 2015 and any 2026 solver differ in sparse
      representation, monomial hashing and memory layout, all of which interact with
      sigma directly. The exact-baseline-reproduction control exists precisely to bound
      this, and the deliverable is a RATIO under one solver, never a comparison of
      Semaev's seconds with new seconds.
    - >-
      MEMORY UNITS. Table 1's MB are totals over 100 systems, not per system
      (tables.yaml transcription_limits). Any memory ratio quoted from Table 1 must be
      taken as a total-over-100 ratio; this record's 1.038 and 1.952 are such ratios.
    - >-
      CHOICE OF f. The low-degree space is defined by f, so f is not a nuisance
      parameter for the structured arms in the way it is for the random arm. A trinomial
      f gives sparse reduction and a pentanomial gives denser reduction, and sigma for
      V_low is INDEPENDENT of f only while 2k - 2 < n. At least 3 distinct f per cell,
      and cells with 2k - 2 >= n reported separately.
    - >-
      SATISFIABILITY MIX. Solve time on a satisfiable instance and on an unsatisfiable
      one are different quantities (this is the point of the committed sibling
      IDEA-20260913-191ed2). The three arms have nearly equal theoretical satisfiability
      -- Table 1 reports exp_prob 0.30, 0.32, 0.36, 0.25 across the four starred rows
      against P_theoretical 0.2834 for all -- but with 100 samples that is +/- 1 count
      of Poisson noise, so the arms must be compared WITHIN satisfiability stratum as
      well as pooled.
    - >-
      SIDON SET EXISTENCE. A k-element Sidon set inside [0, floor((n-1)/2)] exists only
      for k = O(sqrt(n)); at n = 17, k = 6 it does NOT (21 pairwise sums cannot be
      distinct inside a 17-element range), which is why the discriminating cell is
      n = 23, k = 4 and not Semaev's own cell. Any attempt to run the discriminator at
      n = 17, k = 6 will silently use a partially-spread family with intermediate d2,
      and must be reported as such rather than as a Sidon arm.
  interpretation_limits:
    - >-
      (C5) is the boundary of the whole record: sigma and d2 are polynomial-factor
      quantities and CANNOT move the 1.6986 constant. Any reading of this record as an
      exponent improvement is wrong. What it can move is the crossover n, through the
      n^{4 omega} cofactor, and by a factor bounded by a power of n/2 whose exponent is
      not determined here.
    - >-
      Everything is stated in the polynomial basis. sigma is basis-dependent and a
      normal basis gives a different tensor; d2 is basis-INDEPENDENT (it is a dimension)
      and (C1)'s Kneser bound is therefore the basis-free half of the claim. A reader
      who needs a representation-independent statement should take d2 and discard sigma.
    - >-
      The (C4) thresholds are declared before the run and are not derived from a power
      analysis on pilot data, because there is no pilot data. They encode the
      proposer's judgement that a 1.8x separation is the smallest gap worth calling
      structural given that Semaev's own effect is 2.4x. A reviewer may reset them, but
      only before the run.
    - >-
      Semaev's four starred rows are 100-sample cells at ONE (n, k) on ONE curve family.
      They are the entire empirical basis for the 2.4x. This record does not treat them
      as established; the exact-baseline-reproduction control can fail, and if it does,
      sub-objective 2's premise -- that there is an effect to explain -- is what falls.
    - >-
      Nothing here bears on Assumption 1, on the (m, t) optimisation of
      H-SEMBIN-b1708c, or on the topology question. Those are separate records in this
      lane.
  heuristic_assumptions:
    - id: HEUR-SIG
      statement: >-
        (Support-cost proportionality.) Let two Weil-descended chained systems (5) be
        built at identical (n, f, B, m, t, k, monomial order, instance z) and differ
        only in the choice of the k-dimensional V. Let sigma_1, sigma_2 be their
        multiplicative supports and suppose their measured first fall degrees and
        maximum step degrees agree. Then the ratio of median solve times over a matched
        instance set is a NON-DECREASING function of sigma_2 / sigma_1, and is bounded
        above by (sigma_2 / sigma_1)^omega with 2.376 <= omega <= 3. Formally: for all
        such pairs, 1 <= T_2 / T_1 <= (sigma_2/sigma_1)^omega whenever
        sigma_2 >= sigma_1.
      rigorous_support: >-
        The rigorous half is an input-size bound. sigma counts, exactly, the quadratic
        monomial occurrences a V-variable pair contributes to the descended block, so
        the number of nonzero entries in the degree-D Macaulay matrix is bounded above
        by a fixed combinatorial factor times sigma; a sparse linear-algebra step on a
        matrix with Z nonzeros costs at most O(Z . M^{omega-1}) and at least Omega(Z), so
        cost is monotone in sigma for FIXED matrix dimension M, and M is fixed here
        because the two arms have identical variable counts by construction. What is NOT
        rigorous is that the degree-D structure, and hence M and the elimination order,
        is unchanged when sigma changes -- the hypothesis conditions on the measured
        degrees agreeing, which converts that gap into a checkable side condition rather
        than an assumption.
      random_model_justification: >-
        The classical statement this imitates is the sparse-elimination cost model used
        for Macaulay and F4 linear algebra: for a matrix drawn with Z nonzeros in
        generic positions, elimination cost scales with Z up to fill-in, and fill-in is
        governed by the elimination tree rather than by Z itself. The random model here
        is that the V-dependent entries occupy generic positions given their count --
        the same modelling step the paper's Section 4.5.1 makes when it replaces the
        x-coordinate R_X of a random R "by a random element z from F_{2^n}". The
        low-degree arm is the arm where that genericity is MOST suspect, because its
        nonzeros sit on the anti-diagonals l = i + j, which is structure and not
        genericity. If the measurement shows T_low far below the bound while
        T_Sidon tracks it, the informative reading is that the genericity model fails
        for V_low specifically -- i.e. the anti-diagonal structure is a third mechanism
        beyond sigma and d2, which this design would detect as the NEITHER outcome and
        must then name.
      falsification_condition: >-
        A matched pair with agreeing measured degrees, sigma_2 > sigma_1, and median
        T_2 / T_1 < 0.9 (monotonicity violated) or T_2 / T_1 > (sigma_2/sigma_1)^3
        (upper bound violated), at >= 100 instances per arm and p < 0.01. Either
        refutes HEUR-SIG and with it the SIGMA outcome of (C4); the D2 and NEITHER
        outcomes survive.
      validation_plan: >-
        Sample the sigma-minimal exponent families and random subspaces at
        (n, k) in {(23, 4), (29, 4), (31, 5)} with t = 3, >= 100 matched instances per
        arm, stratified 50/50 by independently enumerated satisfiability, and regress
        log median time on log sigma with d_ff and max step degree as recorded
        covariates. Predicted distribution: slope in [0, omega] = [0, 3] with the
        low-degree point as the leftmost and a random point as the rightmost. Tail
        check: the 95th-percentile solve time per arm, not just the median, because a
        support effect that acts only on the worst instances would be invisible in the
        median and is the more dangerous failure mode for a cost model. Sampled
        parameters recorded exactly. TRANSFER ASSUMPTION, stated: nothing is claimed for
        n > 31, for k > 5, for t > 3, or for MAGMA's 2015 F4. The regression is over
        three (n, k) cells and is reported as such, not extrapolated.
    - id: HEUR-D2
      statement: >-
        (Product-dimension cost effect.) With the same matched setup as HEUR-SIG, and
        additionally with sigma held EQUAL between the two arms, the ratio of median
        solve times is a non-decreasing function of d2_2 / d2_1, and the effect is
        carried entirely by the max(0, n - (4k-3)) coordinate equations that are
        identically linear in the V-coordinates for the smaller-d2 arm. Formally: for
        all sigma-matched pairs with d2_2 >= d2_1, T_2 / T_1 >= 1, and the difference
        vanishes when 4k - 3 >= n.
      rigorous_support: >-
        The rigorous half is the vanishing count. The V-only part of a descended S_3
        block lies in (V.V)^2 + V.V.V, whose ambient support has dimension at most
        min(n, 4k - 3) for V_low and at most min(n, 3 d2) in general; in any coordinate
        outside that support the coordinate equation contains no V-quadratic or
        V-cubic term and is therefore affine in the V-coordinates. An affine equation
        eliminates one variable exactly, so the smaller-d2 arm provably starts from a
        system with at least max(0, n - (4k-3)) fewer effective variables. What is NOT
        rigorous is that eliminating those variables reduces solve time monotonically --
        elimination can densify -- and that is the heuristic.
      random_model_justification: >-
        The classical statement imitated is the Bardet-Faugere-Salvy semi-regularity
        picture (KN-LIT-029 in this corpus), under which a system's solving degree and
        cost are functions of its variable count and generator degree profile alone. On
        that model, removing v variables by linear elimination is exactly equivalent to
        starting from a system with v fewer variables, and the cost falls accordingly.
        The corpus record for KN-LIT-029 itself carries the hedge that semi-regularity
        need not hold for structured systems, and a Weil-descended S_3 block is as
        structured as systems get -- so the model is being used as a direction-of-effect
        predictor only, never as a cost formula.
      falsification_condition: >-
        A sigma-matched pair with d2_2 > d2_1 and median T_2 / T_1 < 0.9 at >= 100
        matched instances and p < 0.01; or a cell with 4k - 3 >= n on both arms
        exhibiting a d2-correlated timing gap, which would mean d2 acts through some
        channel other than the free-linear-equation count and the stated mechanism is
        wrong even if the correlation is real.
      validation_plan: >-
        The n = 23, k = 4 cell is the primary validation: it has 4k - 3 = 13 < 23, so
        V_low carries 10 free linear equations and V_Sidon carries 0 at equal sigma.
        The n = 17, k = 6 cell is the built-in negative control: 4k - 3 = 21 > 17, so
        the free-linear count is 0 on both arms and HEUR-D2 predicts NO gap there --
        which means that if Semaev's 2.4x at n = 17, k = 6 is real, HEUR-D2 cannot
        explain it and HEUR-SIG must. Count the free linear equations symbolically
        before solving, per arm, and record the count as an artifact so the prediction
        is checked against the system actually built rather than against this record's
        arithmetic. >= 100 matched instances per arm, satisfiability-stratified. Tail
        check: the instance-level correlation between the realised number of linear
        equations found by the solver at degree 1 and the solve time, within arm.
        TRANSFER ASSUMPTION, stated: two cells, one positive and one negative-control,
        support a direction of effect and nothing about magnitude at other (n, k).
  target_complexity:
    time_exponent: >-
      Unchanged. This record claims NO change to the time exponent. Semaev's stage-1
      time is m! 2^{n-mk} 2^k n^{4 omega} and stage-2 is 2^{k omega'}; the subspace
      appears in neither the m! nor the 2^{n-mk} nor the 2^k nor the 2^{k omega'}, so
      the balance and hence the constant 2/(2 ln 2)^{1/2} = 1.6986 are untouched. The
      claim is confined to the n^{4 omega} cofactor, where a factor n/2 in Groebner
      input size enters with an unresolved power: if cost is proportional to sigma then
      the cofactor changes by (n/2)^{1}, if proportional to sigma^omega then by
      (n/2)^{omega}. The proposal does not decide which; that is HEUR-SIG's regression.
    memory_exponent: >-
      Also confined to the cofactor. Table 1's memory ratio at the starred rows is
      1.038 (B = 1) and 1.952 (random f), both totals over 100 systems, so the observed
      memory effect is between negligible and a factor 2 -- much smaller than the time
      effect and in the same direction. Stage-2 memory remains Theta(2^k) relations
      (2^48 at n = 571, per tables.yaml stage2_memory), which no subspace choice
      changes: the factor base has 2^k elements by definition of k.
    best_known: >-
      Parallel Pollard rho (van Oorschot-Wiener, KN-TECH-006 / KN-LIT-012): 2^{n/2}
      group operations, negligible memory, linear parallel speedup. This record does not
      compete with it and does not claim to.
    best_known_comparator: >-
      For the narrow question actually asked -- what does the subspace choice buy inside
      Semaev's own cost model -- the comparator is Semaev's own low-degree arm, and the
      quantity is the measured ratio 2.373 (B = 1) / 2.839 (random f) at n = 17,
      m = t = 3, k = 6. For the wider question the comparator is vOW rho, against which
      the entire construction is behind at every n where its assumptions are validated.
    hidden_overhead: >-
      Disclosed: (i) the factor n/2 in sigma is exact only while 2k - 2 < n; above that
      the low-degree space also suffers reduction spread and the advantage shrinks
      toward 1, and at the FIPS-relevant parameters k = ceil(n/m) is 31, 38, 48 at
      n = 310, 409, 571 with 2k - 2 = 60, 74, 94 all FAR ABOVE n -- so the low-degree
      advantage as measured at n <= 23 is in a regime that does NOT contain the
      parameters Table 3 extrapolates to. This is the single most important honest
      disclosure in the record and it cuts against the record's own usefulness: the
      mechanism identified here is strongest exactly where the construction is weakest.
      (ii) sigma is basis-dependent; a normal basis is not measured. (iii) The free
      linear equation count max(0, n - (4k-3)) is zero for every (n, k) in Table 3.
    tradeoff_note: >-
      No time-memory tradeoff is introduced. The three arms have identical variable
      counts, identical factor-base size 2^k and identical relation requirements; they
      differ only in the arithmetic populating the same-shaped system. Parallelisation
      position is therefore also identical, and unchanged from Semaev's own "almost
      unbounded parallelisation" remark about the collection stage.
    cost_model: >-
      Semaev's eqs. (15)-(17) with the n^{4 omega} cofactor left symbolic, plus a
      sparse-elimination model for the cofactor's dependence on sigma (HEUR-SIG). No
      other cost model is assumed; in particular Assumption 1 is not used, because the
      claim is about input size at FIXED measured degree.
    data_query_cost: >-
      Zero oracle queries. The relation-collection stage needs 2^k relations regardless
      of arm, so the data cost is identical across arms and equal to Semaev's. No
      precomputation is introduced, so there is no query/precomputation tradeoff to
      report.
    established_exponent_gain: 0
  estimated_cost:
    implementation: low
    compute: low
    proposal_task:
      maximum_runs: 0
      wall_clock_cap_seconds: 3600
      memory_cap_gb: 4
    future_test: >-
      Steps (1) and (2) are complete and cost nothing further (the computation above ran
      in under 2 seconds of Python). Step (3) is the only expensive part: two cells
      (n = 23, k = 4, t = 3, N = 35 variables; and n = 17, k = 6, t = 3, N = 35
