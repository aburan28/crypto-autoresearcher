idea:
  id: IDEA-20260913-fb0483
  title: >-
    The low-degree subspace is multiplicatively extremal, not merely convenient:
    dim(V.V) = 2k-1 is forced by Hou-Leung-Xiang and the only way to beat it is a
    subfield module that kills the yield outright -- and a sigma-minimal Sidon-exponent
    subspace separates the two candidate mechanisms behind Table 1's 2.4x in one
    experiment
  class: representation
  claim: >-
    Semaev's unexplained preference for V = {polynomials in alpha of degree < k} over
    "any subspace of F_{2^n} of dimension k" (Section 4.5, attributed only to the
    Groebner input being "simpler") is a STRUCTURAL choice with two separable causes,
    and exactly one experiment tells them apart.

    Define, for an F_2-subspace V of F_{2^n} with ordered basis v_1..v_k and the
    ambient polynomial basis 1, alpha, ..., alpha^{n-1}:
      (a) the MULTIPLICATIVE SUPPORT
          sigma(V) = #{(i,j,l) : i <= j, c_ijl != 0}, where v_i v_j = sum_l c_ijl alpha^l;
      (b) the PRODUCT DIMENSION d2(V) = dim_{F_2}(V.V), V.V = span{v_i v_j}.
    sigma(V) is the exact count of quadratic Boolean monomials contributed per
    V-variable pair to each Weil-descended S_3 block; d2(V) is the number of ambient
    coordinates that the V-only part of an S_3 block can occupy, so n - d2(V.V-closure)
    is a count of coordinates in which that part vanishes identically.

    (C1) LOWER BOUNDS, both tight and both attained by the low-degree space.
         sigma(V) >= k(k+1)/2 for every V, with equality iff every product v_i v_j is
         a single ambient basis element, i.e. iff V = c . span{alpha^{a_1},...,alpha^{a_k}}
         for some c in F_{2^n}* and exponents with 2 max(a_i) < n.
         d2(V) >= 2k - 1 for every V UNLESS V.V is a module over a proper subfield
         F_{2^d} (d | n, d > 1) -- this is exactly the dichotomy of the Hou-Leung-Xiang
         linear Kneser theorem, applicable because F_{2^n}/F_2 is separable.
         V_low = span{1, alpha, ..., alpha^{k-1}} attains BOTH bounds simultaneously
         whenever 2k - 2 < n: sigma = k(k+1)/2 and d2 = 2k - 1.
         MEASURED, this task, exactly (no sampling error), n = 17, f = x^17 + x^3 + 1:
           k = 6: V_low sigma = 21 = k(k+1)/2, d2 = 11 = 2k-1;
                  random k-subspace sigma = 177.5 +/- 9.1 (sd, 200 draws), d2 = 16.95 mean.
           k = 4: V_low sigma = 10, d2 = 7; random sigma = 85.0 +/- 6.6, d2 = 10.00.
           k = 5: V_low sigma = 15, d2 = 9; random sigma = 128.4 +/- 7.7, d2 = 14.76.
         The support ratio is sigma_rand / sigma_low = 8.45, 8.50, 8.56 at k = 6, 4, 5,
         against the closed-form prediction n/2 = 8.5. So the choice buys a factor
         n/2 in Groebner input size, not an unquantified "simpler".

    (C2) THE UNCONSTRAINED MINIMISER OF d2 IS DEGENERATE, which is why (C1)'s
         exceptional branch is a wall and not an opportunity. If V = F_{2^d} is a
         subfield then V.V = V and d2 = k = d, below 2k-1. MEASURED, this task:
         n = 12, f = x^12 + x^6 + x^4 + x + 1, V = F_16 (k = 4): d2 = 4 < 7 = 2k-1,
         confirming the HLX exceptional branch is non-vacuous at these parameters.
         But a subfield V makes eq. (14) unsatisfiable except on a measure-zero curve
         family: with x_1, x_2, x_3 in F_{2^d}, S_3(x_1,x_2,x_3) = (x_1x_2+x_1x_3+x_2x_3)^2
         + x_1x_2x_3 + B lies in F_{2^d} + B, so S_3 = 0 has no solution at all unless
         B in F_{2^d}, a 2^{d-n} fraction of curves. The same subfield that beats the
         Kneser bound deletes the relation supply. Hence: the low-degree space is the
         CONSTRAINED optimum, optimal subject to V.V not being a proper-subfield
         module, and no subspace choice can do better without changing the curve.

    (C3) THE DISCRIMINATING OBJECT. sigma-minimality does NOT single out V_low: by
         (C1) the whole family V_a = span{alpha^{a_1},...,alpha^{a_k}} with 2 max(a_i)
         < n attains sigma = k(k+1)/2, and inside that family d2 ranges from 2k-1
         (consecutive exponents) up to k(k+1)/2 (pairwise-distinct sums, i.e. a Sidon
         set of exponents). MEASURED, this task, exactly, n = 23, f = x^23 + x^5 + 1,
         k = 4: low-degree {0,1,2,3} has sigma = 10 (the minimum), d2 = 7 (the minimum);
         Sidon {0,1,3,7} has sigma = 10 (still the minimum), d2 = 10 (the MAXIMUM,
         equal to a random subspace's 10.00 mean); Sidon {0,2,5,11} likewise sigma = 10,
         d2 = 10; {0,4,8,11} sigma = 10, d2 = 9; random k = 4 subspaces sigma = 114.6
         mean, d2 = 10.00 mean. So V_Sidon has the support of the low-degree space and
         the product dimension of a random space. It is the exact object that splits
         the two explanations.

    (C4) THE PREDICTION, which is what makes this falsifiable in one run. Semaev's
         2.4x at n = 17, m = t = 3, k = 6 (Table 1 starred rows: 11.41 s / 364.1 MB
         low-degree against 27.08 s / 378.1 MB random; the random-f pair is 12.09 s /
         355.1 MB against 34.32 s / 693.2 MB, 2.84x and 1.95x) is caused by sigma, by
         d2, or by neither. Run the identical protocol on V_low, V_Sidon and V_random
         at one (n, k) with the same f, the same B, the same instance seeds and the
         same variable order:
           SIGMA HYPOTHESIS: time(V_Sidon) / time(V_low) in [0.7, 1.4] and
             time(V_random) / time(V_low) > 1.8.
           D2 HYPOTHESIS: time(V_Sidon) / time(V_low) > 1.8 and
             time(V_Sidon) / time(V_random) in [0.7, 1.4].
           NEITHER: all three within [0.7, 1.4] of each other, in which case Table 1's
             2.4x is an artifact of the variable ORDERING that the low-degree basis
             induces (the goal's own alternative reading) and the correct deliverable
             is the order-permuted control, which this test runs anyway.
         These three outcomes are exhaustive and mutually exclusive at the stated
         thresholds, so the experiment cannot return "no information".

    (C5) SCOPE, stated before anyone can be misled by (C1): sigma and d2 are both
         POLYNOMIAL-FACTOR quantities. sigma_rand / sigma_low = n/2 changes the
         Groebner input size by a factor n/2 and therefore changes eqs. (15)-(17) by
         at most a bounded power of n inside the n^{4 omega} cofactor. It moves the
         CROSSOVER n and it cannot move the 1.6986 constant, because that constant is
         determined by balancing m! 2^{n-mk} 2^k against 2^{k omega'} and neither term
         contains the subspace. The honest answer to the goal's question "which
         unrevisited choice carries the exponent" is, for sub-objective 2: NOT THIS
         ONE, and here is the exact size of what it does carry.
  mechanism: >-
    Weil descent turns one F_{2^n}-equation into n Boolean equations by expanding in a
    fixed ambient basis, and the arithmetic that populates those n equations is the
    structure-constant tensor of the field in that basis restricted to the variable
    subspace. That tensor -- not the subspace as a set -- is what the Groebner engine
    sees.

    Concretely, for x, y in V with coordinates x_i, y_j, coordinate l of the product is
    sum_{i,j} c_ijl x_i y_j. In the polynomial basis with V = V_low and 2k-2 < n, we have
    alpha^i alpha^j = alpha^{i+j} with i + j < n, so c_ijl != 0 for EXACTLY ONE l per
    pair, namely l = i + j: the quadratic part of each descended S_3 block carries
    k(k+1)/2 monomial occurrences in total, spread over 2k-1 coordinates, at most k per
    coordinate. For a random k-dimensional W each product w_i w_j is a generic element,
    so c_ijl != 0 with probability 1/2 independently across l, giving about
    (n/2) . k(k+1)/2 occurrences spread over all n coordinates. The factor is n/2 and
    it is a factor on the INPUT SIZE of the Groebner computation, before any
    degree-growth question is asked. That is the mechanism behind the paper's one-line
    attribution, made quantitative.

    The second, logically independent effect is the vanishing pattern. The terms of
    eq. (14) that involve only V-variables live in (V.V)^2 + V.V.V, so they occupy at
    most min(n, 4k-3) ambient coordinates; in the remaining n - (4k-3) coordinates the
    V-only part of the block is identically zero and those coordinate equations reduce
    to their V-free parts, which are linear or constant in the V-coordinates. For V_low
    that vanishing is maximal (d2 = 2k-1 is minimal); for a random W it is absent
    (d2 = n almost surely once k(k+1)/2 >= n). A vanishing coordinate equation is not a
    smaller monomial count -- it is a FREE LINEAR EQUATION, which is a different and
    stronger kind of help, because it removes variables rather than terms.

    The two effects coincide on V_low and on V_random, which is why Semaev's single
    comparison cannot separate them, and why the paper could only say "simpler". They
    come apart on the sigma-minimal family: choosing the exponents {a_i} to be a Sidon
    set below n/2 keeps every product a single basis element (sigma minimal) while
    making all k(k+1)/2 products land in DISTINCT coordinates (d2 maximal). That is a
    lossy projection in the sense the inventor protocol asks for: sigma forgets which
    coordinates are hit and retains only how many monomials are produced, while d2
    forgets the multiplicities and retains only the span. Neither determines the other
    on the sigma-minimal family, which is exactly the statement that the projection is
    genuinely lossy rather than a change of coordinates -- and both propagate
    compatibly through the chain, because each S_3 block's V-part support is a function
    of V.V, V.V.V and the Frobenius permutation alpha^j -> alpha^{2j mod f}, all of
    which are fixed by the basis before any instance is drawn.

    The upper bound that stops the search is external and verified: Hou-Leung-Xiang's
    linear analogue of Kneser's addition theorem says that for F-subspaces S, T of a
    separable extension L/F either dim ST >= dim S + dim T - 1 or there is a subfield
    K with F strictly inside K and STK = ST. With F = F_2, L = F_{2^n}, S = T = V this
    is precisely: d2(V) >= 2k-1 unless V.V is an F_{2^d}-module for some d | n, d > 1.
    So (C1)'s bound is not a heuristic and not a fit; it is a theorem, and (C2) shows
    its escape hatch is barred by the curve equation rather than by another inequality.
    This is the "external theorem that converts a bottleneck into a closed question"
    pattern the target profile asks for, used here to CLOSE a search rather than open
    one, with the exact residual freedom named in (C3).
