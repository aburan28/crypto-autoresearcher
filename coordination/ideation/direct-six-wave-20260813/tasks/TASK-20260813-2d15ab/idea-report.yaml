  deliverables:
    - path: ledger/proposals/IDEA-20260813-d50a10.yaml
      id: IDEA-20260813-d50a10
      title: First-disagreement coupling
      class: measurement
      summary: >-
        Shared-randomness replay brackets output total variation between a
        public-witness lower bound and a coupling-mismatch upper bound while
        assigning every mismatch to its first divergent predicate.
      exact_nearest_neighbor: IDEA-20260805-4a6dc7
      distinction: pathwise paired trace localization and two-sided bracket, not fixed-sample leaf GOF
      exact_null: independently implemented identical exact replays must have zero mismatch
      biased_positive: one displaced rounding or rejection boundary with exact boundary mass
      novelty_status: unverified
      recommended_priority: high
    - path: ledger/proposals/IDEA-20260813-aaf02e.yaml
      id: IDEA-20260813-aaf02e
      title: Affine-interval sampler certificate
      class: representation
      summary: >-
        Dependency-aware affine intervals and a reach-weighted hybrid sum aim
        to compose local finite-precision errors into a checked end-to-end
        distribution-distance upper bound.
      exact_nearest_neighbor: H-FNDSA-6a9cbb
      distinction: certified finite-precision bridge from exact null to implementation, not construction of the null itself
      exact_null: zero-width identical rational tree must certify distance zero
      biased_positive: reachable one-node rational branch-probability displacement with exact toy distance
      novelty_status: unverified
      recommended_priority: medium
    - path: ledger/proposals/IDEA-20260813-d984ac.yaml
      id: IDEA-20260813-d984ac
      title: Public-projection survival audit
      class: mechanism
      summary: >-
        Conditional-expectation projection and encoder-fiber collisions rank
        internal defect-score directions by the fraction that survives in the
        transmitted and publicly reconstructible signature view.
      exact_nearest_neighbor: IDEA-20260805-2bbfb2
      distinction: tests public observability of internal scores rather than rederiving the secret-frame normalizer channel
      exact_null: identical exact internal law through identical public encoder
      biased_positive: across-fiber mass transfer with exact public total variation
      invisible_control: within-fiber mass transfer with nonzero internal and zero public distance
      novelty_status: unverified
      recommended_priority: high
    - path: ledger/proposals/IDEA-20260813-76dcbd.yaml
      id: IDEA-20260813-76dcbd
      title: Anytime-valid signature monitor
      class: measurement
      summary: >-
        A predictable e-process provides type-I control uniform over every
        monitored prefix and adaptive public stopping time, with delay calibrated
        on exact exponential-tilt controls.
      exact_nearest_neighbor: IDEA-20260801-010
      distinction: optional-stopping-safe sequential supermartingale, not a terminal GOF p-value
      exact_null: exact public-score streams monitored continuously must cross with probability at most alpha
      biased_positive: symmetric exact exponential-tilt ladder with precomputed expected log growth
      novelty_status: unverified
      recommended_priority: medium
    - path: ledger/proposals/IDEA-20260813-2d839b.yaml
      id: IDEA-20260813-2d839b
      title: Sibling-copula defect probe
      class: mechanism
      summary: >-
        A bounded public sibling interaction detects planted recursive
        dependence that preserves every coefficient marginal and the complete
        population covariance, making marginal and BBP instruments exact
        negative controls.
      exact_nearest_neighbor: IDEA-20260808-e7ba81
      distinction: higher-order moment-preserving copula score, not a spiked-covariance eigenvalue
      exact_null: independent exact sibling draws have zero interaction
      biased_positive: exact copula tilt with unchanged marginals and covariance but known nonzero interaction
      novelty_status: unverified
      recommended_priority: high
  mechanism_distinctness_matrix:
    columns:
