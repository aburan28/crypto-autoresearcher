        defect_class: compositional finite-precision error
        nearest_neighbor: H-FNDSA-6a9cbb
      - id: IDEA-20260813-d984ac
        tracked_object: encoder fibers and conditional score projection
        primary_output: visibility spectrum and public nullspace basis
        defect_class: public-visible versus encoder-erased internal deviations
        nearest_neighbor: IDEA-20260805-2bbfb2
      - id: IDEA-20260813-76dcbd
        tracked_object: predictable e-value path
        primary_output: anytime-valid alarm or scoped delay/effect bound
        defect_class: persistent weak public-score bias under adaptive sampling
        nearest_neighbor: IDEA-20260801-010
      - id: IDEA-20260813-2d839b
        tracked_object: bounded higher-order public sibling interaction
        primary_output: calibrated moment-preserving dependence effect
        defect_class: shared-node correlation invisible to marginal and covariance tests
        nearest_neighbor: IDEA-20260808-e7ba81
  ranking:
    ranking_basis: >-
      Cheap falsification first, mechanism coverage, dependence on unfiled
      primary details, and whether the proposal closes an interface needed by
      later distributional claims.  Ranking is advisory and changes no state.
    rows:
      - rank: 1
        id: IDEA-20260813-d984ac
        rationale: >-
          Projection visibility is a prerequisite for turning any internal
          deviation into a public signature statistic; exact visible and
          invisible controls cheaply expose identifiability failures.
      - rank: 2
        id: IDEA-20260813-d50a10
        rationale: >-
          Shared-tape first-divergence replay gives the most direct localization
          of floating versus integer reformulations once randomness semantics are filed.
      - rank: 3
        id: IDEA-20260813-2d839b
        rationale: >-
          Moment-preserving copula controls cover a genuine blind spot of all
          screened marginal and covariance instruments with exact toy algebra.
      - rank: 4
        id: IDEA-20260813-76dcbd
        rationale: >-
          Anytime validity is valuable after a public score exists, but it is
          downstream of projection selection and does not itself create power.
      - rank: 5
        id: IDEA-20260813-aaf02e
        rationale: >-
          A rigorous finite-precision certificate has the strongest proof
          value and highest method-ceiling risk; cheap vacuity tests should
          precede a high implementation investment.
  pareto_matrix:
    axes:
      - time
      - memory
      - data_or_queries
      - preprocessing
      - oracle_access
      - distinctive_value
    rows:
      - id: IDEA-20260813-d50a10
        time: O(N times paired sampler cost)
        memory: O(tree nodes) streaming
        data_or_queries: N local paired tapes per arm
        preprocessing: exact boundary masses and tape adapter
        oracle_access: local deterministic replay only
        distinctive_value: first-divergence attribution and distance bracket
        dominated_by: n/a; no attack result claimed and no screened row dominates localization
      - id: IDEA-20260813-aaf02e
        time: polynomial target with disclosed exponential path worst case
        memory: symbolic certificate state; potentially high
        data_or_queries: zero victim data
        preprocessing: dominant control-flow and exact reach analysis
        oracle_access: none
        distinctive_value: proof-checkable finite-precision upper bound
        dominated_by: n/a; may become method-dominated if the bound reaches one
      - id: IDEA-20260813-d984ac
        time: O(defect basis size times finite internal states)
        memory: explicit fibers or streaming public-fiber statistics
        data_or_queries: local exact samples only
        preprocessing: dominant exact fiber enumeration
        oracle_access: public deterministic encoder and local sampler
        distinctive_value: exact observable nullspace and survival spectrum
        dominated_by: n/a; no screened row dominates public identifiability
      - id: IDEA-20260813-76dcbd
        time: O(N times mixture components)
        memory: O(mixture components plus contexts)
        data_or_queries: sequential local public samples
        preprocessing: exact conditional MGF tables
        oracle_access: public signature stream only
        distinctive_value: optional-stopping-safe type-I control
        dominated_by: n/a; fixed-horizon tests may dominate constants but not stopping validity
      - id: IDEA-20260813-2d839b
        time: O(N times frozen interactions)
        memory: O(frozen interactions) streaming
        data_or_queries: local public sampler outputs
        preprocessing: exact orthogonal scores and copula tables
        oracle_access: local public sampler and encoder only
        distinctive_value: power against a population-covariance-preserving planted family
        dominated_by: n/a; marginal/spectral rows are blind on the defining control family
