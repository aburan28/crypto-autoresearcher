      cost_model: PASS
      proof_search_map: PASS
      pareto: PASS
      citation_and_claim_boundary: PASS
      rationale:
        - >-
          For a sufficiently rich finite support, exact orthogonalization
          against 1, x and x squared makes the planted product-copula law
          preserve both marginals and every declared first/second moment while
          forcing interaction delta E[a squared] E[b squared].
        - >-
          Independent exact siblings, the exact copula ladder and unchanged
          population covariance provide null, biased-positive and nearby
          blindness controls with algebraic forced values.
        - >-
          The moment-fiber collision, pre-treatment score/pair/context
          quantifiers and orthogonal-copula method ceiling prevent a finite
          interaction basis from being called global exactness.
        - >-
          Pair multiplicity, context rarity, public projection, exact tables,
          streaming memory, sample complexity and lack of recovery are disclosed.
      limitations:
        - A future protocol must choose support/context cells with enough dimension for nonzero functions orthogonal to 1, x and x squared.
        - Secret recursive siblings may not remain aligned with the frozen public pairing.

