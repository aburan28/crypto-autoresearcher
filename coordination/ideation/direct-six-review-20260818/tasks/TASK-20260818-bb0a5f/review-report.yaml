    - proposal_id: IDEA-20260813-76dcbd
      schema: PASS
      mechanism: PASS
      prediction_and_falsifier: REVISE
      controls: REVISE
      cost_model: PASS
      proof_search_map: PASS
      pareto: PASS
      citation_and_claim_boundary: PASS
      rationale:
        - >-
          Predictable normalized MGF factors do define a nonnegative null
          supermartingale, and Ville's inequality supports a crossing
          probability no greater than alpha for the declared filtration.
        - >-
          The proposal correctly separates an anytime-valid public-score alarm
          from trapdoor recovery and charges mixture, context, data and MGF preprocessing.
      revision_findings:
        - finding_id: FNDSA-76DCBD-NULL-GATE
          severity: material_design_error
          finding: >-
            The exact-null theorem and forced value are crossing probability
            no greater than alpha, but the prediction requires a confidence
            interval containing alpha and the control gate invalidates any
            interval excluding alpha. A valid conservative e-process can have
            true crossing probability strictly below alpha, so a confidence
            interval wholly below alpha is compatible with the theorem and
            must not invalidate treatment monitoring.
          required_correction: >-
            Replace the equality-style empirical gate with a one-sided
            anti-conservatism check: invalidate only when exact enumeration
            violates a conditional MGF bound or when a preregistered one-sided
            lower confidence bound establishes crossing probability above
            alpha. Report conservative below-alpha behavior rather than
            treating it as failure.
        - finding_id: FNDSA-76DCBD-SIGN-SYMMETRY
          severity: material_positive_control_error
          finding: >-
            A symmetric mixture and a ladder containing both +delta and
            -delta do not by themselves imply equal detection-delay
            distributions. For an asymmetric exact-null score law, the two
            exponentially tilted laws generally have different normalizers,
            divergences, overshoot and delay. The proposal supplies no
            score-law symmetry assumption, yet treats unequal delay as an
            implementation or normalization falsifier.
          required_correction: >-
            Either restrict this equality prediction and falsifier to an
            exactly verified sign-symmetric null/score law, or preregister and
            compare the distinct exact expected log-growth and delay targets
            for +delta and -delta separately. The planted-control gate must
            test those forced sign-specific values.
      limitations:
        - No real public score, exact conditional MGF family or stream was supplied or tested.

