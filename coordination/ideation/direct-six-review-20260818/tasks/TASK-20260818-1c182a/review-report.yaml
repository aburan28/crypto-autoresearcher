        requires a separately stated extension before it can cover transcript
        projection masks.

  mechanism_prediction_falsifier_checks:
    result: pass
    detail: >-
      The five tracked objects are mechanism-distinct: a certified cost
      frontier, quotient incidence rank/entropy, conditioned nonlinear
      spectrum, public support-orbit posterior weighting, and reusable
      projection-image tables. Each record makes no present signal or speedup
      claim, defines quantitative promotion gates, and names observations that
      would falsify the proposed mechanism. A null result, implementation
      failure, timeout, missing primary source, or absent retrieval hit is not
      presented as mathematical evidence.

  control_checks:
    result: pass_at_design_stage_with_one_interface_revision
    detail: >-
      Every empirical observable has an identical-shape null and a planted
      positive control. The baseline proposal includes an intentionally omitted
      table; incidence uses degree-matched/no-reuse/planted low-rank arms;
      spectrum uses density-rank-degree matching, phase randomization, and a
      planted sparse spectrum; orbit weighting uses an exchangeable
      orbit-size-matched law, held-out data, and planted odds; projection masks
      use generic public-code, rank/nesting-matched, fresh-mask, fresh-key, and
      planted cascade arms. No control was executed. The one revision is that
      632866 cannot serve as an augmented-transcript exchangeability control
      without an explicit distribution-preserving extension.

  heuristic_validation_checks:
    result: pass_at_ideation_stage
    detail: >-
      The four mechanism proposals number two assumptions each, state the
      random-model or conditional law, distinguish exact ingredients from the
      heuristic step, and provide exact-enumeration/sampling/scaling validation
      plans. Their record-level falsification lists pair each heuristic with a
      concrete failure condition. No sampling occurred and no heuristic is
      treated as validated.

  cost_model_checks:
    result: pass_at_ideation_stage
    detail: >-
      Every proposal separates per-attempt work from inverse success and names
      peak memory, memory access, preprocessing and amortization denominator,
      available data/targets, oracle access, false positives/retries, and final
      verification. Every current work and exponent delta is 0.0. No concrete
      cost table or speedup exists yet. A future claim remains gated on a
      matched retained row from 27df0c and, for overall forgery relevance, the
      MPCitH-versus-SD crossover.

  proof_architecture_checks:
    - check: baseline_fixture
      result: pass_at_proposal_stage
      detail: >-
        All five name an exact 43d6df/27df0c slice or say the task blocks if it
        cannot be obtained. Reproduction has not occurred and is correctly a
        first future obligation rather than a result.
    - check: observation_collisions
      result: pass_at_design_stage
      detail: >-
        Every proof map searches for distinct underlying objects sharing its
        proposed observable, including equal headline costs with different
        resource vectors, equal incidence ranks with different decoder work,
        equal spectral mass with different joins, equal orbit sizes with
        different per-support probabilities, and equal collision counts with
        different cascade work.
    - check: quantifier_fidelity
      result: pass_at_design_stage
      detail: >-
        Each proposal fixes the instance, observable, null, decoder or
        separator, memory/preprocessing regime, and data/target policy before
        observation. No per-instance or post-selected witness is used as a
        uniform claim.
    - check: method_ceiling_and_nearby_control
      result: pass_at_design_stage
      detail: >-
        Each method ceiling is toy/source-gated, and each nearby object is
        declared: undercharged cost copy, mandatory relation removed by the
        quotient, phase-randomized predicate, exchangeable relabelled law, or
        fresh matched masks. None currently certifies a decoder or speedup.
    - check: interface_preservation
      result: revise
      detail: >-
        The four mechanism records treat 632866 as if it already preserved the
        SDitH hypercube challenge/opening transcript distribution. It only
        states a reduction for the random parity-check matrix, syndrome, and
        balanced error witness. The augmented transcript interface, public
        group action, projection masks, view reuse, data access, and challenge
        law are additional hypotheses and losses that must be written and
        checked separately.

  internal_prior_scope_check:
    cited_prior: IDEA-20260808-632866
    result: revise
    direct_tree_finding: >-
      The cited prior's claim (C) says its one named coverage hole is asymmetric
      full-cost accounting for memory-heavy solvers: the 1/rho repetitions
      multiply time while memory is paid once. Its falsification/scope fields
      separately name a structured public matrix and multiple weight-w
      witnesses. It does not name challenge-conditioned support-orbit
      non-exchangeability, view reuse, face-spectrum alignment, or recurring
      projection masks as its adversary exception.
    affected_proposals:
      - proposal_id: IDEA-20260813-2caec5
        unsupported_use: >-
          Says a non-exchangeable view-reuse exception is required to escape
          the reduction and uses it as a control/falsifier.
      - proposal_id: IDEA-20260813-8791d0
        unsupported_use: >-
          Says the source-aligned predicate feature must survive the reduction,
          without specifying a reduction over the predicate/transcript law.
      - proposal_id: IDEA-20260813-4a824d
        unsupported_use: >-
          Says 632866 names an adversary exception and identifies that exception
          with public stabilizer-orbit imbalance.
      - proposal_id: IDEA-20260813-533bc4
        unsupported_use: >-
          Uses a generic permutation-reduction survival check for projection
          masks without an interface theorem binding those masks to the prior.
    required_revision: >-
      Preserve 632866's actual scope. A superseding proposal may either remove
      it as a dispositive transcript control, or state and prove a new augmented
      reduction that includes the challenge/opening transcript distribution,
      attacker-visible data, public group action or masks, success loss, time,
      memory, preprocessing, and target reuse. Until then it is only a nearby
      plain-SD/d-split control, not a falsifier of the proposed transcript
      mechanisms.

  pareto_checks:
    result: revise_for_unclaimed_points
    detail: >-
      All five records disclose time, memory, data, preprocessing, oracle, and
      verification axes, and 27df0c correctly names 43d6df as its dominator.
      The other four set dominated_by to null while also stating current net
      work and exponent deltas are zero and that no decoder/result exists.
      Their frontier_check paragraphs compare a future construction chiefly to
      27df0c/43d6df, not a measured point against every applicable frontier
      row. Under inventor-protocol section 5, the unambiguous ideation value is
      "n/a (no result claimed)" unless a complete applicable-frontier audit
      supports a named result-level null. This correction prevents null from
      being read as a scientific non-domination finding.

  citation_provenance_checks:
    result: revise
    detail: >-
      Each proposal ends with bare source_refs, including KN-LIT-7542, but no
      per-reference provenance and no verified_by field. The co-archived
      retrieval screen says an unspecified upstream_parent performed retrieval
      and supplies query/chunk/content identifiers, while the producing agent
      explicitly disclaims personal MCP use. That is adequate to explain why
      novelty stayed unverified, but it does not identify the verifying TASK or
      agent required for a `kb` or `retrieved` citation under AGENTS.md rule 9
      and templates/research-records.md. The source is not load-bearing and no
      theorem or parameter is attributed, so this is incomplete provenance,
      not fabrication or scientific invalidity.
    required_revision: >-
      In additive superseding/correction records, express the source inventory
      as structured citations. Mark repository records internal. Mark
      KN-LIT-7542 `kb` only if the exact retrieving/verifying task can be bound;
      otherwise retain it only as explicitly unverified metadata or a recalled
      pointer. Do not upgrade novelty_status.

  claim_ceiling_check:
    result: pass
    detail: >-
      Every proposal is status proposed and novelty_status unverified. The
      reports say experiments, commands, network calls, Git operations,
      scientific effects, and security/speedup claims are zero or none. The
      proposal text consistently says no rank, entropy, spectrum, orbit,
      collision, work-factor, or exponent improvement is currently observed.
      The RQ toy-tier ceiling, unread Round-3 specification, source gate, and
      absence of production transfer are stated. No novelty is inferred from
      stale-index absence.

  metric_recomputations:
    result: not_applicable
    reason: >-
      No experiment, run, raw data, metric, sample, timing, certificate, or
      concrete SDitH parameter result exists in this ideation snapshot. Hash,
      commit, schema, source-scope, and direct-tree duplicate checks were
      recomputed instead.

  limitations:
    - >-
      search_knowledge is not callable in this Validator session and the frozen
      task states that the local KB is empty/in-memory. No live novelty or
      literature search was attempted, and absence is not evidence.
    - >-
      The producer query/chunk/content receipts cannot be replayed here. This
      review validates their internal consistency, the existence and scope of
      direct-tree records, and the claim ceiling only.
    - >-
      The SDitH Round-3 specification and exact parameter capsule were not read
      by the producer or this Validator. Every hypercube mechanism remains
      conditional on source verification; no implementation or experiment may
      be approved from these records as they stand.
    - >-
      The direct-tree duplicate scan covers the 1,225 parseable proposal
      records in this checkout and exact/near lexical and mechanism checks; it
      cannot establish external novelty or prove that an unindexed internal
      idea never existed.

  required_additive_next_action:
    owner: coordinator
    action: >-
      Preserve the archived proposals unchanged and dispatch one bounded
      additive revision task for the SDITH lane. It must (1) correct the scope
      attributed to IDEA-20260808-632866 or supply an explicit augmented
      transcript reduction, (2) add structured citation provenance with an
      exact verifier identity or downgrade the metadata pointer, (3) replace
      the four unmeasured dominated_by nulls with n/a or a complete supported
      frontier audit, and (4) retain novelty_status: unverified and all current
      no-result boundaries. A fresh independent Validator pass is required on
      the superseding records before administrative PASS.

  overall_rationale: >-
    Artifact custody, commit ancestry, hashes, dispatcher eligibility, parsing,
    schema completeness, controls, cost disclosure, proof-map coverage, and
    ideation claim ceilings pass. The lane cannot receive PASS because a
    direct-tree read disproves the scope attributed to a load-bearing internal
    reduction control, and because citation provenance and four Pareto nulls
    need additive correction. These are record/interface defects, not evidence
    for or against SDitH security or any proposed mechanism.
