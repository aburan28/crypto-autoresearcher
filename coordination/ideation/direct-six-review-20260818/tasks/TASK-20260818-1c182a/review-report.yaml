        calls public stabilizer-orbit imbalance the adversary exception named
        by 632866, but the cited prior names a different full-cost hole.
    - proposal_id: IDEA-20260813-533bc4
      result: pass_with_revision_finding
      detail: >-
        All required structural fields are present with generic-public-code,
        random-mask, fresh-mask, fresh-key, and planted-mask controls; complete
