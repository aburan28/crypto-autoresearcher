lane_dispositions:
  FNDSA:
    validator_task_id: TASK-20260818-bb0a5f
    verdict: REVISE
    bounded_passes:
      - The four FNDSA proposals other than IDEA-20260813-76dcbd pass bounded proposal-admissibility review.
    repair_gate:
      - >-
        Correct IDEA-20260813-76dcbd's confidence-interval gate: the exact-null
        theorem gives crossing at most alpha, so the interval must not be
        required to contain alpha. Reject only demonstrated crossing above
        alpha or MGF failure, and report conservatism.
      - >-
        Use symmetric plus/minus delta alternatives only after verified sign
        symmetry; otherwise preregister separate targets.
    novelty_status: unverified

  MQOM:
    validator_task_id: TASK-20260818-0b83a5
    verdict: PASS
    pass_scope: proposal_admissibility_only
    limitations:
      - Novelty remains unverified.
      - No primary-literature review was completed.
      - Live search_knowledge was unavailable.
      - The pass is not scientific support and does not authorize implementation.
    novelty_status: unverified

  SDITH:
    validator_task_id: TASK-20260818-1c182a
    verdict: REVISE
    repair_gate:
      - >-
        Correct four proposals' mis-scoping of IDEA-20260808-632866, including
        its full-cost asymmetry and augmented-transcript interface.
      - Add structured citation verified_by provenance.
      - Replace unsupported dominated_by null with n/a or a complete current frontier audit.
    novelty_status: unverified

  SLHDSA:
    validator_task_id: TASK-20260818-c81163
    verdict: REVISE
    bounded_passes:
      - Textual separation of the fault lane from the conventional lane passes.
    repair_gate:
      - Use canonical proof_search_map shapes for all five proposals.
      - Add structured inventor deliverable fields.
      - Replace dominated_by.overall null with n/a or a current bounded frontier including the 11 post-snapshot proposals.
      - Add structured citation provenance for KN-LIT-748 and KN-LIT-3858.
      - Resolve or retire nonresolving IDEA-20260808-e41559.
      - Restore goal ordering with the conventional constants-tracked bound first and the fault lane separate and nonblocking.
    novelty_status: unverified

  SQISIGN:
    validator_task_id: TASK-20260818-63b5d2
    verdict: REVISE
    bounded_passes:
      - The SQISIGN-versus-SSI boundary passes.
      - The corrected source typo passes.
    repair_gate:
      - Replace the malformed 48-hex purported SHA-256 for IDEA-20260808-287361 with a verified full binding or explicit unavailable provenance.
      - Replace unsupported dominated_by null with n/a or a full frontier audit.
      - Add KN-TECH-058 current Fp2 baseline tiers and caveats.
      - Correct EXP-SSI-7c41d9 from an inaccurate single-run characterization to the three-replicate unarchived direct-tree limitation.
    novelty_status: unverified

  UOV:
    validator_task_id: TASK-20260818-e966bb
    verdict: REVISE
    bounded_passes:
      - The other three UOV proposals pass ideation-stage checks with primary-source and shared-cost blockers preserved.
    repair_gate:
      - >-
        Replace IDEA-20260813-16d752's exact null, which merely permutes public
        quadratic equations and preserves the zero set and oil certificate,
        with a proved certificate-destroying same-shape null.
      - >-
        For IDEA-20260813-1c423c, preregister the false-map class, challenge
        distribution, soundness-bound formula, and repetition rule.
    novelty_status: unverified

