  proposal_checks:
    - proposal_id: IDEA-20260813-16d752
      title: Same-instance incidence correspondence with recovery-certificate round trips
      schema: pass
      mechanism: pass
      prediction_and_falsifier: pass
      cost_and_claim_ceiling: pass
      proof_search_map: pass
      pareto: pass_with_current_tree_review
      citation_provenance: pass_with_unverified_limit
      controls: revise
      proposal_disposition: REVISE
      blocking_finding: >-
        The declared exact null says to independently permute the public
        quadratic forms in one target formulation and expects the identical-
        certificate lift rate to collapse. A permutation of the public forms
        is an invertible row/equation reordering: it preserves their common
        zero set, planted oil space, and certificate semantics. A correct
        same-instance correspondence should transport through that reordering,
        so the proposed forced collapse is false and cannot validate the
        claimed semantic map. Replace it in a superseding record with a
        same-shape, certificate-destroying control such as an independently
        generated public map or a coefficient scrambling proved not to be an
        allowed row/variable equivalence, while retaining the existing planted
        positive and nearby counterobject.
      nonblocking_notes:
        - >-
          The map/certificate claim is otherwise well scoped to toy fixed
          instances, declares exceptional loci, multiplicities, all six
          directed round trips, and no Round-3 or attack-cost inference.
        - >-
          Before an experiment is frozen, the phrase dense-open toy slice must
          be converted into an enumerated instance/sample boundary so generic
          failures cannot be selected after observation.

    - proposal_id: IDEA-20260813-f2a6e7
      title: Certificate-labelled syzygy fingerprints for attack-system equivalence
      schema: pass
      mechanism: pass
      prediction_and_falsifier: pass
      controls: pass
      cost_and_claim_ceiling: pass
      proof_search_map: pass
      pareto: pass_with_current_tree_review
      citation_provenance: pass_with_unverified_limit
      proposal_disposition: PASS
      detail: >-
        The proposal treats the fingerprint as a diagnostic rather than an
        isomorphism proof, includes a same-shape planted-root null, a known
        transported-map positive, label ablation, an observation-collision
        search, and explicit finite-degree scope. No solving-degree, recovery,
        Round-3, or sibling-scheme conclusion is imported. A later experiment
        contract must freeze D, ensemble sizes, intervals, and the allowed
        transformation group, but those are correctly left as approval gates
        rather than claimed observations here.

    - proposal_id: IDEA-20260813-5988b7
      title: Same-oil conditional fibre diagnostics for compressed public maps
      schema: pass
      mechanism: pass
      prediction_and_falsifier: pass
      controls: pass
      cost_and_claim_ceiling: pass
      proof_search_map: pass
      pareto: pass_with_current_tree_review
      citation_provenance: pass_with_unverified_limit
      proposal_disposition: PASS
      detail: >-
        Conditioning all arms on the identical canonical oil space separates
        secret selection from compression-induced coefficient dependence. The
        exact seed-null, repeated-block positive, expanded-tensor identity
        check, and nearby random-map control distinguish dependency, generator,
        serialization, and certificate effects. The proposal does not conflict
        with IDEA-20260805-74349c's expanded-key identity: it compares
        conditional ensembles, not two encodings of the same expanded key.
        Source-derived generator exchangeability and sample sizes remain
        mandatory before approval.

    - proposal_id: IDEA-20260813-6e47e8
      title: Certificate-localized degree-fall decomposition
      schema: pass
      mechanism: pass
      prediction_and_falsifier: pass
      controls: pass
      cost_and_claim_ceiling: pass
      proof_search_map: pass
      pareto: pass_with_current_tree_review
      citation_provenance: pass_with_unverified_limit
      proposal_disposition: PASS
      detail: >-
        The certificate-localized, residual, positive-relation, extraneous-
        component, order, and same-planted-subspace controls are discriminating.
        The record explicitly treats a supplied certificate as charged advice,
        limits the method to diagnosis unless certificate-free discovery is
        added, and requires recombination and verifier checks. It therefore
        does not turn secret-assisted localization into an attack claim.

    - proposal_id: IDEA-20260813-1c423c
      title: Randomized quotient-trace certificates for semantic map auditing
      schema: pass
      mechanism: pass_with_missing_soundness_instantiation
      prediction_and_falsifier: revise
      controls: pass
      cost_and_claim_ceiling: pass
      proof_search_map: revise
      pareto: pass_with_current_tree_review
      citation_provenance: pass_with_unverified_limit
      proposal_disposition: REVISE
      blocking_finding: >-
        The claim, predictions, falsifier, and target-complexity block repeatedly
        invoke an explicit or proved field-size/repetition soundness bound, but
        the proposal never states the candidate false-map class, the challenge
        distribution, a single-challenge formula, the repetition composition,
        or a numeric/symbolic target B(q, dimensions, repetitions). Consequently
        the promised bound is not preregistered and the falsifier any false map
        beats the bound is circular: the threshold could be chosen after the
        collision census. A superseding record must declare the map class and
        challenge family and state a formula of the form probability of false
        acceptance at most B before any exhaustive or sampled audit; it must
        also say which dependencies invalidate repetition multiplication.
      nonblocking_note: >-
        The post-commit challenge, known transported positive, independently
        generated quotient null, and nonreduced multiplicity control are sound
        design ingredients. Fixing the bound does not require discarding them.

