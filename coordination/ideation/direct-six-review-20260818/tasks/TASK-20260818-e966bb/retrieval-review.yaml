    unverified ideation screen: it preserves stale-corpus and no-absence limits,
    identifies the direct prior neighborhood, and does not fabricate source
    access. It is deliberately insufficient for novelty or experiment approval.
    The lane's literal REVISE is driven by the two proposal-design blockers in
    review-report.yaml; retrieval limitations remain explicit prerequisites and
    are not converted into mathematical or novelty verdicts.

