  # -------------------------------------------------------------------------
  # Semantics implemented
  # -------------------------------------------------------------------------
  committed_reading: >-
    "Committed" is taken literally. In a git checkout whose top level is the repo
    argument, decisions are found with `git grep -l -F -e <key>... HEAD --
    ledger/decisions` and read with `git show HEAD:<path>`, restricted to .yaml and
    .yml files. Only HEAD's blob counts. A working-tree decision that is untracked
    or differs from HEAD and carries a block key is named in a stderr warning and
    is not honoured beyond its committed version. Outside a git checkout (a test
    fixture tree) the working tree is read as the record, with a stderr warning
    saying so.
  parse_failure_handling: >-
    Any exception while parsing a candidate decision produces the stderr warning
    "<path> does not parse (<ExceptionType>); skipped, nothing in it is honoured",
    and the file contributes nothing. A non-mapping document and a block key placed
    at top level instead of under coordinator_decision also warn and contribute
    nothing. Only files whose committed text contains one of the block keys are
    parsed. A file without the key cannot carry the block, so a parse failure
    elsewhere in ledger/decisions/ is not reported by these tools.
  ordering_rule: >-
    Blocks are applied in ascending (decided_at, decision id) order. decided_at is
    compared as an ISO-8601 string: YAML dates are str()-ed and a space separator is
    normalised to "T". A missing decided_at sorts first. The decision id
    (coordinator_decision.id, or the file stem if absent) breaks ties. The last
    applied block that names an ID decides whether it is held. A block that fails
    its guards applies nothing. Within one decision, T-2 applies withheld_contracts
    before released_contracts, so a decision that both holds and releases an id
    releases it. The constant is ecc_priority.ORDERING_RULE.
  T1_guards:
    - Membership is idea_dispositions.applies_to_exactly[*].id only (string, non-empty). Entries without an id warn and are ignored. Titles are never read.
    - A block whose disposition is not `reopened` is honoured only if rule_9_fields carries non-empty evidence, budget, test_boundary, remaining_uncertainty and successor_or_revisit. Otherwise it warns, names the decision and the missing fields, and the ideas stay open.
    - A guarded block with an empty disposition warns and is not honoured.
    - >-
      `reopened` (block-level disposition) restores its ids and is not
      rule_9-guarded, because restoring is the same effect a failed guard has.
      This is an interpretation; the card does not state whether a reopen needs
      the guard.
    - idea_dispositions may be one mapping (as in DEC-20261005-138b51) or a list of mappings.
    - The --area filter applies to the disposed section as well as the open list.
  T1_json_choice:
    choice: keep the --json stdout shape (a JSON list of open-idea rows, keys unchanged) and print the disposed section on stderr
    why: >-
      The existing --open-ideas --json output is a bare JSON list, so a documented
      key cannot be added without changing the top-level type to an object, which
      would break every list consumer. The repository has no code that parses it.
      The recorded consumers are sessions that read it as a list:
      DEC-20261005-7a74e9 context ("--open-ideas --json (19 open ECC ideas)"),
      DEC-20261005-138b51 evidence_refs (a scratch open_ideas.json), and
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-33cdc3/archive-manifest.yaml
      ("all three IDs occur in ecc_priority.py --open-ideas --area ECDLP --json").
      The only in-repo programmatic consumer, orchestration/campaign/autopilot.py,
      calls open_ecc_ideas() directly and is unaffected. stderr therefore keeps
      every consumer working and still always prints the section.
    verified: gate-logs/g5json.stdout.json parses as a list of 3 rows, each equal (keys and key order) to the corresponding pre-change row; gate-logs/g5json.stderr carries the 16-row disposed section.
  T2_guards:
    - Membership is withheld_contracts.ids only (string entries, or mappings with an id). Titles, templates, signatures and areas are never read.
    - The block is honoured only if withheld_contracts.rule_9_fields carries all five non-empty fields. Otherwise it warns, naming the decision and the missing fields, and its ids stay selectable.
    - released_contracts.ids in a later decision (ORDERING_RULE) restores ids. It is not rule_9-guarded, for the same reason as `reopened`.
    - The hold is checked after every existing filter (approval, frozen, execution_authorized, superseded, goal, experiment, completion, blocked), so "dropped" counts only rows that would otherwise have been listed.
    - --goal selection applies the hold. --include-blocked selection applies the hold.
    - >-
      --experiment: a named withheld row is returned with its shape unchanged, and
      stderr reads "newest_experiments: <id> is withheld from dispatch by <DEC>;
      returned because --experiment named it (the hold governs unqualified and
      --goal selection only)".
    - The count line is printed to stderr on every CLI run, in text and --json modes, including when no decision is honoured ("holds: no honouring decision; 0 row(s) dropped").
    - --show-withheld lists every held id with its DEC ("# withheld by decision: N" then "<id>\t<DEC>"), to stderr under --json and to stdout after the selectable rows in text mode.

