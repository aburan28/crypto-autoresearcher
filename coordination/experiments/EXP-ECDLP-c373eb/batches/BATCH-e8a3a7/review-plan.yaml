schema: crypto.autoresearch.review_plan.v1
batch_id: BATCH-e8a3a7
goal_id: GOAL-ECDLP-001
experiment_id: EXP-ECDLP-c373eb
recorded_at: '2026-09-03'
recorded_by: coordinator
recorded_before_any_reviewer_launched: true
ordering_note: >-
  This plan is committed BEFORE either reviewer task is dispatched, per
  AGENTS.md "Review architecture" and the coordinate-research-goal skill's
  step 3. A prior recorded after the verdicts is not a prior; joints assigned
  after the fact buy no coverage. The commit carrying this file is the
  evidence of that ordering.

review_plan:
  claim_under_review: >-
    That RUN-ECDLP-c373eb-2 (the replication of RC-1 on a second toy instance:
    p=1013, y^2 = x^3 + 2x + 2, S=(393,263), n=41, r=8) is sound, genuinely
    independent of RUN-ECDLP-c373eb-1 (p=1009, y^2 = x^3 + x + 1, S=(286,680),
    n=47), and jointly with RUN-1 sufficient to upgrade KN-FIND-1ba0fe's
    recorded confidence from `preliminary` to `replicated`, and to move
    H-ECDLP-a40416 off `supported_scoped_single_toy_instance`.

  coordinator_prior: >-
    My prior, recorded before any reviewer runs. I EXPECT J1 to hold: I
    already re-derived RUN-2's instance and five of its D1 values myself from
    scratch with an independent Jacobian implementation, and they matched. I
    record explicitly that MY OWN re-derivation carries NO independence weight
    for this round -- I am the dispatching Coordinator, I read the producer's
    output before re-deriving, and one agent checking its own subagent is not
    independent review. That is precisely why J1 is assigned to a fresh
    blinded session. I am GENUINELY UNCERTAIN on J2, and I lean toward the
    upgrade being PREMATURE: RUN-2's script (rc1_tabulation_run2.py) was
    adapted from RUN-1's (rc1_tabulation.py) by the same agent lineage under
    the same brief, so a shared methodological or arithmetic error would
    reproduce identically in both runs and their agreement would be
    correlated, not corroborating. Two instances also may simply not meet
    whatever this program means by `replicated` as against `preliminary`. If
    J2 breaks, the honest outcome is to keep KN-FIND-1ba0fe at `preliminary`
    and record WHY two runs did not suffice -- which is a useful finding in
    itself, not a failure of the round. I am recording this lean so that a
    J2 verdict of `holds` cannot later be read as mere agreement with me.

  joints:
    - joint: >-
        J1: RUN-ECDLP-c373eb-2's measurement is arithmetically sound, its
        coverage is exhaustive as claimed, its canonical lift genuinely
        satisfies the order-n condition, its null-lift control is genuinely
        NOT order-n, and its instance is genuinely distinct from RUN-1's.
      assigned_to: TASK-20260903-6048dc
      owner_role: validator
      attack_plan: >-
        Do not accept any reported number. (a) Re-derive the instance from
        first principles: independently confirm #E(F_1013)=984 for
        y^2=x^3+2x+2 by your own point count, confirm S=(393,263) is on the
        curve and has order exactly 41, and confirm gcd(41,1013)=1. (b)
        Independently implement the canonical order-n lift at r=8 and verify
        n*S_hat equals the exact projective identity mod p^8 -- if it does
        not, J1 breaks. (c) Independently tabulate D1 over ALL 780 pairs
        1<=j<k<41 and confirm the image is exactly {0,8} with the value 8
        occurring exactly on k = n-j; a single intermediate value in [1,7]
        breaks J1. (d) Verify the null lift is genuinely non-order-n by
        computing v_p of the Z-coordinate of n*(null lift) yourself, and
        confirm its D1 image genuinely differs. (e) Confirm the instance
        differs from RUN-1's in p, curve coefficients, and n. Report `breaks`
        on any mismatch; `inconclusive` only if you cannot complete a step and
        say exactly which.
    - joint: >-
        J2: Two agreeing toy instances (RUN-1 and RUN-2) are sufficient to
        upgrade KN-FIND-1ba0fe from `preliminary` to `replicated` confidence,
        given that RUN-2's implementation was adapted from RUN-1's by the same
        agent lineage under the same brief.
      assigned_to: TASK-20260903-d02517
      owner_role: red-team
      attack_plan: >-
        Attack the INFERENCE, not the arithmetic (J1 owns the arithmetic; grant
        it). (a) Common-mode failure: rc1_tabulation_run2.py was adapted from
        rc1_tabulation.py. Identify concretely what class of error would
        survive that adaptation and reproduce identically in both runs, and
        whether either run contains any check capable of catching it. The
        null-lift control is the candidate internal check -- assess honestly
        whether it actually discriminates a shared-code error or only a
        shared-mathematical-premise error. (b) Definitional: search this
        program's own corpus (docs/, templates/research-records.md, prior EV-*
        records) for what `replicated` versus `preliminary` actually requires
        here -- number of instances, independence of implementation, seeds,
        scale diversity -- and judge the upgrade against that standard rather
        than against intuition. If the corpus does not define it, say so
        plainly; an undefined threshold is itself a finding. (c) Scope: both
        runs are ~10-bit toy instances of the SAME shape (small ordinary curve,
        prime n, minimal model). Assess whether two draws from one narrow
        family is replication of the FINDING or merely repetition of one
        configuration. (d) State the cheapest concrete experiment that would
        genuinely discharge your objection if you raise one. Report `breaks` if
        the upgrade is not warranted on the evidence, `holds` if it is.

  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      Not lifted. The two reviewers run as fresh, concurrent, independent
      sessions launched in one message; neither may read the other's report,
      and neither report is a whole-claim verdict. J1 and J2 are conjunctive:
      the claim under review carries only if BOTH hold. Composition across the
      two joints is Coordinator work, performed after both verdicts land.

  proves_too_much:
    objects:
      - >-
        OBJECT A (for J2): two runs of the SAME systematically-wrong script on
        two different instances. The conclusion "the finding is replicated" is
        KNOWN FALSE there -- agreement is guaranteed by shared code and
        establishes nothing about the mathematics. Any J2 argument that
        licenses the upgrade must NOT also license it on Object A.
      - >-
        OBJECT B (for J1): the null lift within each run. The conclusion "D1's
        image is the flat two-valued set {0,r}" is KNOWN FALSE there by design
        -- the null lift is constructed to break the order-n premise, and both
        runs report {0,1} for it. Any J1 soundness argument for the canonical
        lift that would ALSO predict flatness on the null lift proves too much
        and is wrong somewhere.
    failure_signature: >-
      A reviewer's argument is proving too much if, run unchanged against its
      assigned object above, it returns the same favourable verdict there as
      on the real object. For J2 that is: the argument licenses `replicated`
      for two runs of one buggy script. For J1 that is: the argument's
      reasoning for the canonical lift's two-valuedness applies verbatim to
      the null lift and predicts {0,8} there, contradicting the observed
      {0,1}.

  blind_rederivation:
    required: true
    quantity: >-
      The image (as a set) of D1(j,k) = v_p(x([k]S_hat) - x([j]S_hat))
      truncated at r=8, over all pairs 1<=j<k<41, on the canonical order-n
      lift of S for the instance stated below; and, separately, v_p of the
      Z-coordinate of n*(null lift).
    assigned_to: TASK-20260903-6048dc
    instance_parameters_supplied_here_deliberately: >-
      p = 1013; curve y^2 = x^3 + A x + B over F_p with A = 2, B = 2;
      S = (393, 263); n = ord(S) = 41; #E(F_p) = 984; p-adic precision r = 8;
      null lift = the Hensel lift of S taken with x-coordinate perturbed to
      S.x + p before lifting y, with NO order-n condition enforced.
      These are supplied IN THIS PLAN on purpose: RUN-2's manifest.yaml
      carries the answer in its own `result.metrics` block, so the manifest
      must sit in blind_from, and the re-deriver would otherwise have no
      lawful source for the instance. Supplying inputs is not supplying the
      answer.
    blind_from:
      - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/manifest.yaml
      - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/raw-result.json
      - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/stdout.log
      - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/execution-report.yaml
      - experiments/EXP-ECDLP-c373eb/implementation/rc1_tabulation.py
      - experiments/EXP-ECDLP-c373eb/implementation/rc1_tabulation_run2.py
      - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-1/raw-result.json
      - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-1/manifest.yaml
    protocol: >-
      SEAL FIRST, THEN OPEN. Write your own re-derivation and its resulting
      image sets to your report, and record a sha256 of that sealed text,
      BEFORE opening any path in blind_from. Only after sealing may you open
      those paths to compare. Declare every path you actually read in
      review_attestation.sources_read; the checker mechanically fails a
      re-deriver whose sources_read intersects blind_from before the seal.
      If you open a blind_from path early, say so -- a disclosed deviation is
      recoverable, a concealed one poisons the round.

  escalation_condition: >-
    If EITHER reviewer concludes that this replication CONTRADICTS
    RUN-ECDLP-c373eb-1 or any prior validated evidence (rather than confirming
    or merely failing to strengthen it), routing_rules
    unrecoverable-result-review fires and this round must be re-run at
    review-breakthrough tier (validator-breakthrough / red-team-breakthrough,
    effort max, degradable false). Confirming evidence and an
    insufficient-for-upgrade verdict do NOT fire this condition; only a
    genuine contradiction does.

  composition_rule: >-
    J1 and J2 are conjunctive. `holds` on one joint and `breaks` on the other
    is a SPLIT, not a pass, and the claim under review does not carry. In that
    case the Coordinator records the narrowest defensible outcome -- most
    likely: RUN-2 accepted as a sound second measurement, KN-FIND-1ba0fe left
    at `preliminary` with the reason recorded -- rather than forcing the
    upgrade or discarding the run.
