      n_S_hat_equals_exact_projective_identity_mod_p20: true
      second_independent_witness_psi41_S_hat_zero_mod_p8: true
      second_independent_witness_psi41_S_hat_zero_mod_p20: true
      vp_Z_of_n_S_hat: >-
        Uncapped this is +infinity, not merely >= r: [40]S_hat equals
        -[1]S_hat EXACTLY as residues mod p^8 (and mod p^20), so the sum is
        the literal projective identity (0:1:0) with Z = 0. Truncated at the
