reproducibility_check:
  pointer_exercised: true
  method: >-
    Not asserted from the receipt. I re-ran the committed script from a clean
    invocation of the recorded command and diffed the outputs against the
    committed artifacts.
  results:
    exit_status: 0
    stderr_bytes: 0
    stdout_vs_committed_stdout_log: 'byte-identical'
    full_result_dict_vs_committed_raw_result_json: 'identical, including both 780-entry tables'
  finding_reported_not_hidden: >-
    The committed script's __main__ prints a REDUCED dict that deliberately
    omits part1_full_table and part2_full_table, so the script as committed
    does not itself write raw-result.json; that file was serialised by a
    separate executor step. The content is nevertheless exactly reproducible
    from the committed script (I reproduced it by importing the module and
    dumping its `result` object), so provenance is verifiable. Worth a note
    because "re-run the command and compare" alone would not have covered
    the two full tables, which are the substance of the run.

