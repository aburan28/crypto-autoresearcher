      J1_break_condition_not_triggered: >-
        The plan states J1 BREAKS if n*S_hat is not the exact projective
        identity mod p^8. It is, by two independent criteria.
    step_3_D1_tabulation:
      pairs_tabulated_by_me: 780
      C_40_2: 780
      pair_range: '1 <= j < k < 41'
      D1_image: [0, 8]
      count_of_value_0: 760
      count_of_value_8: 20
      intermediate_values_in_1_to_7: 'NONE (empty list)'
      capped_value_occurs_exactly_on_k_equals_n_minus_j: true
