    recomputed_independently: '20 / 760'
    agrees: true
    detail: 'mirror pairs (j, 41-j) for j = 1..20; 780 - 20 = 760.'
  - metric: 'part1_notes (intermediate-value violations)'
    reported: '[] (empty)'
    recomputed_independently: 'no pair with 1 <= v <= 7 exists'
    agrees: true
  - metric: 'part2_D1_image_null_lift'
    reported: [0, 1]
    recomputed_independently: [0, 1]
    agrees: true
  - metric: 'v_p_of_Z_of_n_times_null_lift'
    reported: 1
    recomputed_independently: '1 (Jacobian), kernel level t = 1'
    agrees: true
  - metric: 'part3_vandermonde_image / part3_nonrigid_image'
    reported: '[0, 8] / [0]'
    recomputed_independently: '[0, 8] / [0]'
    agrees: true
  - metric: 'curve invariants: N = 984, a_p = 30, ordinary, N = 2^3 * 3 * 41'
    recomputed_independently: 'N = 984 by two methods; a_p = 1013 + 1 - 984 = 30 != 0 so ordinary; 984 = 8 * 3 * 41'
    agrees: true

control_checks:
  - control_id: RC-1-part-2-null-lift
    declared_in_frozen_contract: true
    contract_text: >-
      "An arbitrary Hensel lift of S that does NOT satisfy the canonical
      order-n condition ... the discriminating control distinguishing 'the
      flatness is a consequence of the canonical lift's isomorphism
      mechanism' from 'the flatness is an artifact of the p-adic library's
      precision handling'."
    as_run_matches_contract: true
    genuinely_not_order_n: true
    independent_evidence: >-
      Verified three independent ways by me: (i) my own order test
      x([21]P) == x([20]P) returns False; (ii) [41]S_null is a kernel point
      of level 1, so v_p(Z) = 1, far short of the r = 8 cap; (iii)
      v_p(psi_41(S_null)) = 1, i.e. the division polynomial does not vanish.
      The control is genuine, not decorative.
    discriminates_the_stated_alternative: true
    detail: >-
      The control does what the contract asks of it: it separates the
      mechanism from a precision artifact, and my dose-response sweep
      strengthens that separation by showing the value moves continuously
      with the depth of the premise violation.
  - control_id: 'part 3 non-rigid functional (implicit second control)'
    as_run_matches_contract: true
    detail: >-
      The non-rigid functional x1*x2 - x3 stays at image [0] on the same
      canonical lift where the rigid Vandermonde reaches [0, 8], so the
      two-valuedness is a property of the rigid functional and not of the
      lift alone. I recomputed both from my own x-coordinates and agree.
  - control_id: 'positive control'
    present: partial
    detail: >-
      The frozen contract declares only the one (negative/discriminating)
      control. The role of a positive control is played by the
      pre-registered prediction plus the order-n certificate, which is a
      hard pass/fail. I note the asymmetry rather than treating it as a
      defect: for a deterministic tabulation whose predicted value is a
      theorem, a separate positive control adds little. My division-polynomial
      calibration on F_p (psi_41(S) = 0, psi_k(S) != 0 for k < 41) served as
      a positive control on my own instrument.

heuristic_validation_checks:
  - check: 'pre-registered prediction recorded before or independently of the measurement'
    result: pass
    detail: >-
      specification.yaml carries preregistered_prediction with formula
      "{0, r} exactly, with the 'r' value occurring exactly at k = +/-j mod n",
      sourced to Proposition E. Ordering verified from git, not from prose:
      the specification was committed 2026-09-01 09:06:26 -0700 (a97469904);
      RUN-2's recorded execution commit is 2026-09-02 09:08:31 and its
      archive commit 2026-09-02 09:17:01. The prediction predates the run by
      a day. It is not a post-hoc fit.
  - check: 'falsification criterion stated in advance and honoured'
    result: pass
    detail: >-
      The contract states that any value strictly between 1 and r-1 on the
      canonical lift falsifies Proposition E's literal claim, and that a null
      lift ALSO showing {0,r} would undermine the mechanism claim. Both
      conditions were live and both came back negative on my independent
      computation as well as the producer's.
  - check: 'sample size, procedure and seeds in the manifest'
    result: pass
    detail: >-
      Not a sampling experiment: the tabulation is EXHAUSTIVE over the pair
      space (all 780 pairs), so there is no sample and no seed to record, and
      the manifest says so explicitly rather than leaving the field blank.
      Instance selection is deterministic and documented.
  - check: 'empirical result recomputed from raw data rather than copied from the report'
    result: pass
    detail: 'All image sets recomputed from the 780-entry raw tables, and independently from my own arithmetic.'
  - check: 'substitute-sampling correspondence cited and controlled'
    result: not_applicable
    detail: >-
      No correspondence is used. The quantity is computed directly on the
      object of interest; nothing stands in for anything.
  - check: 'scale binding: parameter sizes, declared scope and transfer assumptions recorded'
    result: pass
    detail: >-
      p = 1013 is about 10 bits, claim_tier toy, which matches the
      mechanical rule in docs/claims-and-verification.md (toy = max field bit
      size <= 32). Both the manifest and the execution report state that no
      claim about cryptographic-scale curves is made or implied, and the
      execution report's operational_limitations says so in terms. The
      specification argues toy scale is sufficient BECAUSE the claim being
      checked (Proposition E) is scale-independent and a toy counterexample
      would falsify it -- that is a stated transfer argument, correctly
      labelled as such, and I neither verify nor endorse Proposition E here.

cost_model_checks:
  - check: 'concrete cost table with declared unit'
    result: not_applicable
    detail: >-
      RUN-2 reports no cost model, no complexity claim, and no speedup. It
      reports one wall-clock figure (0.2 s) against its budget, which is a
      resource record and not a cost claim. There is consequently nothing to
      check for cost-unit honesty, memory-beside-time, or
      per-attempt-cost x inverse-success-probability bookkeeping.
  - check: 'no speedup or improvement claimed, so the inventor-protocol section 6 ladder is not triggered'
    result: not_applicable_verified
    detail: >-
      I checked this rather than assuming it. The run claims a MEASUREMENT,
      not an improvement: no baseline is named, no ratio is reported, and the
      execution report explicitly reserves interpretation. Since no speedup is
      claimed, the ladder's step 2 (measured ratio against a baseline on a
      scaled-down instance) is not owed here and its absence is not a
      failure. Were any downstream record to convert this into a speedup or
      an asymptotic claim, that ladder WOULD become owed and none of it has
      been done.

proof_architecture_checks:
  - check: 'baseline fixture reproduces exactly'
    result: pass
    detail: >-
      The relevant fixture is RUN-1's own instance, which I read from
      RUN-1's raw-result.json rather than from the task card: p=1009, A=1,
      B=1, S=(286,680), n=47, with 1035 = C(46,2) pairs. It reproduces the
      same qualitative images ([0,8] and [0,1]) on different parameters.
  - check: 'quantifier fidelity'
    result: pass
    detail: >-
      The measurement is per-instance and is reported per-instance. Nothing
      in RUN-2's own records presents a per-instance witness as a uniform
      one; the execution report explicitly declines to generalise.
  - check: 'observation collisions bound to enumerated scope'
    result: pass
    detail: >-
      The "no intermediate value" observation is bound to an EXHAUSTIVE
      enumeration of its scope (all 780 pairs), not a bounded search, so
      within this instance it is a complete statement. Across instances it
      is two points and certifies nothing global -- correctly not claimed.

instance_distinctness_check:
  verified_against: 'RUN-1 raw-result.json and manifest.yaml, read directly'
  run1: {p: 1009, A: 1, B: 1, S: [286, 680], n: 47, pairs: 1035}
  run2: {p: 1013, A: 2, B: 2, S: [393, 263], n: 41, pairs: 780}
  differs_in_p: true
  differs_in_A: true
  differs_in_B: true
  differs_in_n: true
  differs_in_base_point: true
  verdict: >-
    Genuinely distinct in every component the plan names -- p, BOTH curve
    coefficients, and n -- and additionally in the base point and in the
    resulting pair-space size. Both are ordinary (a_p = -24 and a_p = 30,
    both nonzero) with prime n and gcd(n,p) = 1, so they are two draws from
    the same NARROW FAMILY: distinct instances, same shape. I record that
    plainly because the distinctness of the instances and the diversity of
    the family are different questions, and only the first is mine.

certificate_discipline_check:
  claimed_kind: none
  correct_classification: true
  reasoning: >-
    docs/claims-and-verification.md: "kind: none is used for pure measurement
    runs ... those have nothing to certify, and that is stated explicitly
    rather than left blank." RUN-2 is exactly that -- it tabulates p-adic
    valuations and claims no discrete-log solve and no factor-base relation.
    I confirmed from the script that no discrete logarithm is computed or
    claimed anywhere in it. The statement is given explicitly in both the
    manifest and the execution report rather than left blank, and the
    required "at least r, never infinity" precision caveat is present in
    both. The classification is correct.
  no_evidence_record_asserts_above_its_tier: 'not assessed here -- no EV record is in scope for this task'
  precision_caveat_verified_conservative: >-
    The run's caveat says a reported 8 means v_p >= 8 and never infinity.
    My independent computation shows the on-fibre differences are in fact
    exactly zero (infinite valuation), confirmed to precision p^20. The run
    therefore UNDER-claims relative to the mathematics, which is the correct
    direction for a finite-precision receipt to err.

limitations:
  - >-
    PRECISION. Everything is truncated at r = 8. The reported value 8 is a
    lower bound from the run's own instrument. My re-derivation shows the
    underlying valuation is genuinely infinite for on-fibre pairs, but that
    strengthening comes from my computation, not from RUN-2's artifacts.
  - >-
    THE NULL-LIFT CONTROL IS BLIND BEYOND DEPTH r. My dose-response sweep
    shows a lift perturbed at depth t >= 8 is indistinguishable from the
    canonical lift at precision 8. So the control certifies "canonical to 8
    p-adic digits", not "canonical" absolutely. This does not affect RUN-2,
    whose order-n property is separately certified EXACTLY (n * S_hat is the
    literal identity), but a future run relying on the control alone at
    higher stakes should raise r or use the exact certificate.
  - >-
    SCALE. p = 1013 is about 10 bits. Nothing here transfers to
    cryptographic scale, and RUN-2 makes no such claim. J1 does not assess
    Proposition E itself, only that RUN-2 measured what it says it measured.
  - >-
    TWO INSTANCES OF ONE SHAPE. RUN-1 and RUN-2 are distinct instances but
    both are small ordinary curves with prime n in a minimal model. Whether
    that constitutes replication of the FINDING is J2's question, assigned
    to a reviewer I cannot see, and I express no view on it. My `passed`
    verdict must not be read as support for the `preliminary` ->
    `replicated` upgrade.
  - >-
    FROZEN-CONTRACT BUDGET. specification.yaml declares
    budget.maximum_runs: 1 and replication.independent_instances: 1, and
    RUN-2 is the SECOND run under that same frozen specification (version 1).
    The run records three deviations (DEV-1/2/3) but none of them is this
    one, so the departure is undeclared. It is a contract-hygiene matter for
    the Coordinator -- a new specification version or a recorded deviation --
    and it does not touch the arithmetic, so it does not enter the J1
    verdict. I report it rather than absorb it silently.
  - >-
    CERTIFICATE PLACEMENT. The certificate block is absent from
    raw-result.json where docs/claims-and-verification.md says it is stored;
    it is present and correct in the manifest and execution report. Same in
    RUN-1. Non-blocking for kind: none.
  - >-
    I VERIFIED THE RECORDED DIRTY-TREE NOTE ONLY BY ITS CONSEQUENCE. The run
    executed against a dirty working tree (disclosed). I cannot reconstruct
    that tree, so I substituted the stronger available check -- exact
    reproduction of every committed artifact from the committed script at
    today's HEAD -- rather than accepting the note on its word.

procedure_deviations:
  - id: PD-1
    kind: blindness_qualification
    severity: disclosed_material
    description: >-
      MY RE-DERIVATION WAS IMPLEMENTATION-BLIND BUT NOT ANSWER-BLIND, and the
      cause is the review plan itself, which I was instructed to read first
      and which is not listed in blind_from. Its J1 attack_plan states
      "confirm the image is exactly {0,8} with the value 8 occurring exactly
      on k = n-j", and its proves_too_much section states that both runs
      report {0,1} for the null lift. So three of the numbers I was asked to
      derive blind were disclosed to me before I computed anything. I did not
      open any blind_from path before sealing, and my derivation was
      genuinely independent of the producer's code, but a later reader should
      not credit my agreement on the IMAGE SETS as fully blind.
    mitigation_and_why_the_re_derivation_still_carries_weight: >-
      The overwhelming majority of what I matched was NOT disclosed anywhere
      in the plan: x_hat and y_hat mod p^8 (23- and 23-digit integers), the
      null lift's y (24 digits), all 780 canonical per-pair values, all 780
      null per-pair values, the 40 affine x-coordinates including the two in
      the producer's spot-check, the kernel level of n * null lift, and the
      part-3 per-triple valuations. Being told the image set gives no
      purchase on any of those. The agreement therefore remains evidence
      about the quantity.
    recommendation_for_future_rounds: >-
      State the quantity and the parameters in the plan, as this one
      correctly does, but do NOT state the expected value in the attack plan
      of the joint whose owner also holds the blind re-derivation. Put the
      expected value in the coordinator_prior, which the re-deriver can be
      told not to read, or assign the re-derivation to the reviewer who does
      not own that joint.
  - id: PD-2
    kind: scope_of_computation
    severity: none
    description: >-
      I ran computations beyond the literal steps enumerated in the attack
      plan: a division-polynomial second witness for the order-n condition, a
      verification at precision p^20 as well as p^8, an independent
      recomputation of part 3, and a nine-point dose-response sweep. The task
      budget explicitly permits computation. No frozen contract was
      re-executed and no producer artifact was modified.
  - id: PD-3
    kind: incidental_exposure
    severity: none
    description: >-
      A directory listing of the batch reviews folder showed the sibling task
      directory name coordination/.../reviews/TASK-20260903-d02517/. I did not
      open it or any file inside it, and I know nothing of its contents or
      verdict. Disclosed for completeness.

