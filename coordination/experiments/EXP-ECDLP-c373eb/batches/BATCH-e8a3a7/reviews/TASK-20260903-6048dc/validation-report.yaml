      strengthening: >-
        For every mirror pair the x-coordinates are equal not merely to the
        cap but EXACTLY, still equal at precision p^20, and y_{41-j} = -y_j
        exactly. The value 8 is a truncation of a genuinely infinite
        valuation, not a near-miss.
      J1_break_condition_not_triggered: >-
        The plan states a single intermediate value in [1,7] BREAKS J1.
