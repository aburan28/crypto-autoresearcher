# ===========================================================================
# PHASE 1 -- SEALED BLIND RE-DERIVATION
# Produced from the instance parameters supplied in review-plan.yaml alone.
# No path in blind_rederivation.blind_from was opened before the two hashes
# below were computed and recorded.
# ===========================================================================

blind_rederivation:
  required_by_plan: true
  assigned_to: TASK-20260903-6048dc
  method_summary: >-
    Independent implementation in pure Python arbitrary-precision integers.
    Exact integer arithmetic mod p^e throughout; no floating point at any
    point. Deliberately different in method from anything a producer would
    plausibly write: (i) affine chord-and-tangent arithmetic over Z/p^e with
    every division guarded so a non-unit denominator RAISES rather than
    silently producing a wrong value -- not Jacobian/projective coordinates;
    (ii) the canonical order-n lift found by EXHAUSTIVE digit-by-digit
    search over all p=1013 candidate digits at each p-adic level, asserting
    that exactly one digit is admissible at every level -- not Newton/Hensel
    iteration; (iii) the multiples [k]S_hat built by the sequential chain
    P_2 = 2P, P_{k+1} = P_k + P, which provably never touches the identity
    and never adds two points of equal reduction for 1 <= k <= 40, so every
    denominator is a unit -- not double-and-add; (iv) the order-n condition
    cross-checked a SECOND time by division polynomials psi_k, a criterion
    that never invokes the group law at all, with that code first calibrated
    on F_p where the answer is known (psi_41(S) = 0 and psi_k(S) != 0 for
    1 <= k <= 40); (v) the group order obtained twice, by Legendre symbols
    and independently by a square-table count.

  sealed_block_canonical_json: '{"instance":{"A":2,"B":2,"S":[393,263],"n":41,"p":1013,"r":8},"phase":1,"s1_S_on_curve":true,"s1_discriminant_4a3_27b2_mod_p":140,"s1_gcd_n_p":1,"s1_group_order_over_ord_S":24,"s1_ord_S":41,"s1_ord_S_divides_group_order":true,"s1_point_count_agrees_with_984":true,"s1_point_count_legendre":984,"s1_point_count_squaretable":984,"s2_S_hat_on_curve_mod_p8":true,"s2_S_hat_reduces_to_S":true,"s2_all_multiples_on_curve_mod_p8":true,"s2_lift_digit_uniqueness_per_level":[[2,[623]],[3,[442]],[4,[155]],[5,[652]],[6,[471]],[7,[520]],[8,[20]]],"s2_n_S_hat_is_projective_identity_mod_p20":true,"s2_n_S_hat_is_projective_identity_mod_p8":true,"s2_vpZ_of_n_S_hat_capped_at_r":8,"s2_vpZ_of_n_S_hat_uncapped":"infinity","s2_x_hat_base_p_digits_low_first":[393,623,442,155,652,471,520,20],"s2_x_hat_mod_p8":22454942430194572886520,"s2_y_hat_mod_p8":30185837102734218797721,"s2b_psi41_S_hat_zero_mod_p20":true,"s2b_psi41_S_hat_zero_mod_p8":true,"s2b_psi_code_calibrated_on_Fp":true,"s2b_vp_psi41_null_lift":1,"s3_D1_image":[0,8],"s3_capped_exactly_on_k_equals_n_minus_j":true,"s3_count_value_0":760,"s3_count_value_r":20,"s3_expected_C_40_2":780,"s3_intermediate_values_1_to_7_pairs":[],"s3_mirror_pairs_count":20,"s3_mirror_x_equal_at_precision_20":true,"s3_pair_count":780,"s4_null_D1_image":[0,1],"s4_null_is_order_n":false,"s4_null_kernel_level_t_of_n_times_null":1,"s4_null_mirror_values":[1],"s4_null_nonmirror_values":[0],"s4_null_x_mod_p8":1406,"s4_null_y_mod_p8":405806453473732067420664,"s4_vpZ_of_n_null_homogeneous_convention":3,"s4_vpZ_of_n_null_jacobian_convention":1,"s4_vp_x40_minus_x_null":1,"s4_vp_xnull_minus_xhat":1,"s4_vp_y40_minus_y_null":0,"s5_distinct_from_run1":{"A_differs":true,"B_differs":true,"base_point_differs":true,"n_differs":true,"p_differs":true},"task":"TASK-20260903-6048dc"}'
  sealed_block_sha256: 0c683572efa10fbe690b5b738080732a9b9d192ce365bd46bfc4cb3c449c9809
  sealed_block_length_bytes: 1798
  sealed_block_hash_definition: >-
