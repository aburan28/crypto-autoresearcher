  addendum_sha256: 7ee2c303498a694d400304026fa37ff1a373fcd3cd53e3f7b7e2050661b61be7
  addendum_contents: >-
    x and y of [k]S_hat mod p^8 for k = 1..40; x of [k]S_null mod p^8 for
    k = 1..40; all 780 canonical D1(j,k); all 780 null D1(j,k).

  phase1_findings_readable:
    step_1_instance_from_first_principles:
