      order_divides_group_order: '984 = 41 * 24, cofactor 24'
      gcd_n_p: 1
    step_2_canonical_lift:
      x_hat_mod_p8: '22454942430194572886520'
      y_hat_mod_p8: '30185837102734218797721'
      x_hat_base_p_digits_low_first: [393, 623, 442, 155, 652, 471, 520, 20]
