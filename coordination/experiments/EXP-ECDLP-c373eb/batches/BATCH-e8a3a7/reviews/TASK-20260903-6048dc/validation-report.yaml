# ===========================================================================
# WHY THE RESULT IS FORCED -- and the required proves-too-much control
# ===========================================================================

soundness_argument:
  statement: >-
    S_hat has exact order n = 41 in E(Z_p). Hence for j + k = 41,
    [k]S_hat = -[j]S_hat EXACTLY, so x([k]S_hat) - x([j]S_hat) = 0 and
    v_p = +infinity, reported as the cap r. For j + k not congruent to 0
    mod 41 and j != k, the reductions [j]S and [k]S are distinct points of
    E(F_p) with [k]S != -[j]S, so x([k]S) != x([j]S) already in F_p and the
    difference is a unit, giving v_p = 0. No intermediate value is possible,
    because an intermediate value would require the two x-coordinates to
    agree mod p but differ mod p^8 -- and agreement mod p forces
    k = +/- j mod 41, which forces exact equality. The image is therefore
    {0, r} with r exactly on k = n - j, and this is a theorem about the
    instance, not a measurement outcome.

proves_too_much_control:
  assigned_object: >-
    OBJECT B: the null lift, where the conclusion "D1's image is the flat
    two-valued set {0,r}" is KNOWN FALSE by design.
  ran_my_argument_unchanged_on_object_B: true
  outcome: DOES_NOT_PROVE_TOO_MUCH
  detail: >-
    The argument's first step is "[41]S_hat = O exactly". On the null lift
    that step is FALSE: [41]S_null is a kernel point of level t = 1, not the
    identity. The argument therefore does not reach flatness there. Run
    unchanged it instead predicts [41-j]S_null = -[j]S_null + K with K of
    level t, hence x-differences of valuation exactly t on the mirror pairs
    and 0 elsewhere -- image {0, t}. With t = 1 that is {0,1}, which is
    exactly what both my implementation and the producer observe. The
    argument returns a DIFFERENT and CORRECT verdict on the known-false
    object, which is the outcome the control is looking for.
  failure_signature_checked: >-
    The plan's stated failure signature is an argument that "applies verbatim
    to the null lift and predicts {0,8} there, contradicting the observed
    {0,1}". Mine predicts {0,1} there. The signature is absent.
  sharper_test_the_argument_survives: >-
    The argument does not merely decline to predict flatness on Object B; it
    predicts the exact non-flat value, t = v_p(x_null - x_hat). I computed
    v_p(x_null - x_hat) = 1 independently and the observed mirror value is 1.
    An argument that only said "not flat" would have been weaker evidence.

null_object_and_decay_control:
  rationale: >-
    docs/inventor-protocol.md section 3: a signal is an artifact until the
    identical measurement is run against a null object of the same shape, and
    the canonical artifact tell is a quantity that does NOT decay when the
    parameter meant to destroy it increases. The frozen contract supplies one
    null object (the null lift). I ran the stronger version: a dose-response
    sweep over the parameter that controls how badly the order-n premise is
    broken.
  what_the_quantity_should_do: >-
    Perturbing the canonical lift to p-adic depth t should move the on-fibre
    D1 value to exactly min(t, r) and leave the off-fibre value at 0. The
    signal should therefore be recoverable continuously across the whole
    range, and the control should go BLIND at t >= r, where the perturbed
    lift is indistinguishable from canonical at precision r.
  measured:
    - {perturbation_depth_t: 1, vp_x0_minus_xhat: 1, D1_image: [0, 1], predicted: [0, 1]}
    - {perturbation_depth_t: 2, vp_x0_minus_xhat: 2, D1_image: [0, 2], predicted: [0, 2]}
    - {perturbation_depth_t: 3, vp_x0_minus_xhat: 3, D1_image: [0, 3], predicted: [0, 3]}
    - {perturbation_depth_t: 4, vp_x0_minus_xhat: 4, D1_image: [0, 4], predicted: [0, 4]}
    - {perturbation_depth_t: 5, vp_x0_minus_xhat: 5, D1_image: [0, 5], predicted: [0, 5]}
    - {perturbation_depth_t: 6, vp_x0_minus_xhat: 6, D1_image: [0, 6], predicted: [0, 6]}
    - {perturbation_depth_t: 7, vp_x0_minus_xhat: 7, D1_image: [0, 7], predicted: [0, 7]}
    - {perturbation_depth_t: 8, vp_x0_minus_xhat: 8, D1_image: [0, 8], predicted: [0, 8], note: 'control blind at and beyond r'}
    - {perturbation_depth_t: 9, vp_x0_minus_xhat: 8, D1_image: [0, 8], predicted: [0, 8], note: 'control blind at and beyond r'}
  conclusion: >-
    The measured quantity tracks the destroying parameter exactly and
    monotonically across the entire admissible range. The {0,8} result is
    therefore NOT a precision or library artifact: a precision artifact would
    have pinned the value at the cap regardless of t. This is the decay
    behaviour the protocol asks for, and it is present.
  incidental_finding_reported_not_hidden: >-
    v_p(S.x - x_hat) = 1, so the UNPERTURBED naive Hensel lift of S is
    already not the order-n lift and already yields image {0,1}. The "+p"
    perturbation is therefore not what breaks the order-n property; it moves
    the lift to a different level-1 point. This does not weaken the control
    -- what J1 asks is whether the null lift is genuinely NOT order-n, and it
    is, verifiably (v_p(Z) of n * null lift = 1, and v_p(psi_41(null)) = 1).
    The manifest's own wording is accurate; I record the point only so no
    later reader infers that the +p is load-bearing.

