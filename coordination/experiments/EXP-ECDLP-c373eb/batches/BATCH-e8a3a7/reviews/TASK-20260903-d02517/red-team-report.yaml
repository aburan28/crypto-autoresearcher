red_team_report:
  id: RT-20260903-d02517
  task_id: TASK-20260903-d02517
  batch_id: BATCH-e8a3a7
  goal_id: GOAL-ECDLP-001
  experiment_id: EXP-ECDLP-c373eb
  joint: J2
  recorded_at: '2026-09-03'
  reviewed_snapshot:
    run_2_commit: f7a52cbad          # "runs(EXP-ECDLP-c373eb): RUN-ECDLP-c373eb-2 replication run archived"
    run_1_impl_commit: 5d7cf2888     # "snapshot(GOAL-ECDLP-001): TASK-20260901-400254 RC-1 run bytes"
    note: >-
      Both reviewed artifacts are Coordinator-committed, so this review rests on
      durable snapshots and not on working-tree bytes, per red-team.md
      responsibility 6.

  claim_under_review: >-
    That two agreeing toy instances -- RUN-ECDLP-c373eb-1 (p=1009, y^2=x^3+x+1,
    S=(286,680), n=47) and RUN-ECDLP-c373eb-2 (p=1013, y^2=x^3+2x+2,
    S=(393,263), n=41) -- are SUFFICIENT to upgrade KN-FIND-1ba0fe's recorded
    confidence from `preliminary` to `replicated`, given that RUN-2's script was
    adapted from RUN-1's by the same agent lineage under the same brief.

  verdict: breaks

  verdict_summary: >-
    The upgrade is NOT warranted on this evidence. RUN-2 supplies a second
    INSTANCE; `replicated` in this program's operative practice counts
    IMPLEMENTATIONS. The two runs share 266 of RUN-1's 270 non-comment
    executable lines verbatim -- every function definition without exception --
    so their agreement is guaranteed conditional on a shared error and carries a
    likelihood ratio of essentially 1 between "the mathematics is right" and
    "the shared arithmetic core is wrong". The order-n certificate that both
    runs advertise as independent is computed by the same `scalar_mult` it
    certifies. The null-lift control varies the INPUT, not the CODE PATH, and is
    itself common-mode across the two runs: running a shared control twice does
    not make it a cross-run control. Separately, the measured outcome is forced
    by the already-derived Lemmas 1-2 once the order-n certificate passes, so
    the experiment's residual information content is about the implementation,
    which is precisely the axis on which the two runs are not independent.
    This verdict is INSUFFICIENT-FOR-UPGRADE, not a contradiction: RUN-2's
    reported values agree with RUN-1's and with Proposition E, and nothing here
    is evidence against the finding.

  escalation:
    fires: false
    reason: >-
      The plan's escalation_condition fires only on a genuine CONTRADICTION of
      RUN-1 or of prior validated evidence. RUN-2 confirms RUN-1 (canonical
      {0,8}, null {0,1}, Vandermonde {0,8}, non-rigid {0} in both). My objection
      is that confirmation from a near-clone implementation is weak, not that it
      is contrary. The plan states explicitly that an insufficient-for-upgrade
      verdict does not fire escalation. No review-breakthrough re-run is
      requested on my joint.

  # =====================================================================
  # OBJECTIONS
  # =====================================================================
  objections:

    - id: OBJ-1
      title: >-
        The two runs are one implementation, not two: 266 of 270 executable
        lines are byte-identical, and every function definition is shared
        verbatim.
      line_of_attack: '(a) common-mode failure'
      severity: decisive
      finding: >-
        `diff` over the two committed scripts, with comments and blank lines
        stripped, gives 270 executable lines in rc1_tabulation.py, 282 in
        rc1_tabulation_run2.py (the 12 extra are a docstring), and 266 lines in
        common. The complete list of executable differences is five lines:
        `p = 1009` -> `p = 1013`; `A, B = 1, 1` -> `A, B = 2, 2`;
        `n = 47` -> `n = 41`; the six-triple `triples = [...]` literal; and one
        ADDED line `assert p % n != 0`. Nothing else changed. Every function --
        fp_add, fp_mul, count_points, find_point_of_order_n, jac_dbl, jac_add,
        scalar_mult, scalar_mult_naive, curve_ok, valuation, affine_x,
        hensel_lift_y, f_of_x0, vp_diff_x, xk -- is byte-identical, as are the
        Hensel root-lifting block, the null-lift block, both tabulation loops,
        the Part-3 block, the spot-check block and the result assembly.
      why_it_bites: >-
        "Adapted from" understates the relationship. RUN-2 is RUN-1's script
        with four constants substituted. The evidential question is the
        likelihood ratio L = P(agree | mechanism correct) / P(agree | shared
        systematic error). For two independent implementations L is large. Here
        P(agree | shared systematic error) = 1 by construction, because the
        error would be in code executed identically in both runs, so L = 1 and
        the agreement carries ZERO weight against the common-mode hypothesis.
        It carries real weight only against errors that are instance-specific
        (a typo in a hard-coded curve constant, an n that is not prime, a bad
        point), and those are the errors the runs' own asserts already catch
        individually.
      what_would_change_it: FG-1, FG-2.

    - id: OBJ-2
      title: >-
        The order-n certificate -- the single load-bearing check in both runs --
        is computed by the very arithmetic it certifies, and the manifest names
        the block `independent_certificate` while its own prose says otherwise.
      line_of_attack: '(a) common-mode failure'
      severity: high
      finding: >-
        Both scripts establish the lift's correctness with
        `nS_hat = scalar_mult(n, S_hat, MOD); canonical_lift_verified_exact =
        (nS_hat == (0,1,0))`. `scalar_mult` is built from `jac_add`/`jac_dbl`,
        the same routines used for every tabulated value. The supporting asserts
        do not close the loop either: `curve_ok(S_hat, MOD)` tests only that the
        lifted point satisfies the curve equation (membership, not the group
        law); `assert valuation(f0, r, WORK_MOD) == 1` is itself evaluated
        through `f_of_x0` -> `scalar_mult`. RUN-2's manifest records the field
        `canonical_lift_S_hat.independent_certificate` whose own text reads
        "recomputed via the SAME double-and-add scalar multiplication used
        everywhere else in this script". The field name asserts an independence
        the field body denies.
      why_it_bites: >-
        My Objection OBJ-6 shows the measured image is FORCED once the order-n
        certificate holds. So the entire empirical content of both runs rests on
        that one certificate -- and that certificate has no implementation
        independence in either run, and shares 100% of its code across the two.
        A wrong-but-self-consistent group law would satisfy it in both runs
        identically. AGENTS.md "Review architecture" names exactly this failure
        mode: "recomputing from the producer's own artifacts reproduces a
        wrong-but-self-consistent implementation faithfully, which is exactly
        the failure mode validation cannot see."
      unused_control_already_in_the_file: >-
        Each script already contains a genuinely independent second
        implementation of the group law -- the F_p affine routines `fp_add` /
        `fp_mul`, used only during instance setup -- and NEITHER RUN EVER
        CROSS-CHECKS the Z/p^r Jacobian arithmetic against it. Three lines
        asserting `affine_x(scalar_mult(k, S_hat, MOD), MOD) % p ==
        fp_mul(k, S, p, A)[0]` for k = 1..n-1 would exercise the shared core
        against independent code at zero marginal cost. It is not there.
      what_would_change_it: FG-1, FG-2.

    - id: OBJ-3
      title: >-
        The null-lift control discriminates a shared MATHEMATICAL-PREMISE error
        and a narrow band of input-invariant code errors. It does NOT
        discriminate a shared CODE error, and it supplies no cross-run
        independence at all because it is itself common-mode.
      line_of_attack: '(a) common-mode failure -- the honest assessment the plan asked for'
      severity: high
      what_the_control_genuinely_does: >-
        CREDIT WHERE DUE. The null lift (x0 = S.x + p, Hensel-lifted in y, no
        order-n condition) yields image {0,1} against the canonical lift's
        {0,8} in both runs, and that genuinely refutes the alternative it was
        designed against -- "the flatness is a p-adic-precision artifact present
        on any lift". It also rules out a real, if narrow, band of code errors:
        a `valuation` that saturates unconditionally, a tabulation that ignores
        the lift and reads F_p, a hard-coded image. Those hypotheses predict
        {0,8} on the null lift and are refuted. This is a real control and I do
        not dismiss it.
      what_the_control_cannot_do: >-
        It varies the INPUT (which lift is passed to `vp_diff_x`), not the CODE
        PATH. Every line executed for the null lift is also executed for the
        canonical lift: `vp_diff_x`, `scalar_mult`, `jac_add`, `jac_dbl`,
        `affine_x`, `valuation`, `hensel_lift_y`. It can therefore only detect
        errors whose effect is INVARIANT under change of input lift. An error in
        the shared arithmetic that is consistent across inputs -- the entire
        class relevant to OBJ-1 and OBJ-2 -- is invisible to it by construction.
      the_step_that_is_usually_missed: >-
        The null-lift control is INTERNAL to each run and is implemented in the
        shared code. It is therefore exactly as common-mode between RUN-1 and
        RUN-2 as the primary measurement is. Its appearance in both runs is not
        two controls; it is one control run twice by the same program.
        RUNNING A SHARED CONTROL TWICE DOES NOT MAKE IT A CROSS-RUN CONTROL.
        The agreement of the two null-lift images {0,1} = {0,1} is not
        independent corroboration of the null-lift result, for precisely the
        reason the agreement of the two canonical images is not.
      what_would_change_it: FG-1, FG-3.

    - id: OBJ-4
      title: >-
        The documented threshold for `replicated` is under-specified, but the
        program's OPERATIVE standard, read off 50 committed evidence records, is
        independent IMPLEMENTATION -- and RUN-2 adds an instance, not an
        implementation.
      line_of_attack: '(b) definitional'
      severity: decisive
      the_documented_threshold: >-
        The corpus defines the vocabulary in exactly one place, one table row:
        docs/evidence-and-reproducibility.md line 11 --
        "`replicated` | The effect was reproduced from a clean run, preferably
        independently." That is under-specified in three ways that matter here.
        It sets NO instance count. It makes independence a PREFERENCE
        ("preferably"), not a requirement. And it does not say which axis must
        vary: a second instance through the same code, and the same instance
        through second code, both read as "reproduced from a clean run". By
        contrast the adjacent row for `strong` does name the axes -- "predefined
        protocol, adequate controls, multiple instances, retained artifacts,
        and stable effect". PLAINLY STATED, AS THE PLAN ASKED: THE DOCUMENTED
        THRESHOLD DOES NOT DECIDE THIS CASE, AND THAT GAP IS ITSELF A FINDING.
      the_operative_threshold: >-
        The program's practice is materially stricter than its documentation and
        it is close to unanimous. Of 538 evidence records, 50 carry
        `strength: replicated`; 31 of those 50 ground the label in explicit
        language of INDEPENDENT IMPLEMENTATION or INDEPENDENT RE-DERIVATION --
        "two independent implementations", "independent reimplementation",
        "independently re-derived", "independently re-acquired first-hand",
        "shares no code with the producer". Instances checked directly:
        EV-ECQ-5c2c0a ("reproduced on two independent implementations THAT SHARE
        NO CODE WITH THE PRODUCER"); EV-MCE-3d6e9a ("`replicated` is scoped to
        O-1, O-2 and O-3 ONLY ... each of which was independently re-acquired
        first-hand by validator TASK-20260808-ea7bed"); EV-MDFIVE-24e077
        ("share no code"); EV-MLKEM-5aa471 ("second independent ... shares no
        code"). Not one record I examined grounds `replicated` in "second
        instance, same code".
      the_precedent_that_is_directly_on_point: >-
        EV-DIFFP-1e08cc's own `strength_note` states, in the record's capitals:
        "`replicated` DESCRIBES HOW MANY IMPLEMENTATIONS PRODUCED A NUMBER AND
        NEVER WHAT THE NUMBER MEANS, AND THIS ROUND CARRIES A FURTHER
        QUALIFICATION THAT MAY NOT BE DROPPED." That record had TWO
        implementations and still qualified the label because both were
        value-informed. The present round has ONE implementation run twice.
        Under the standard that record states, this does not reach `replicated`.
      a_second_definitional_defect: >-
        `replicated` is not a member of the KN-FIND `confidence` vocabulary at
        all. templates/research-records.md defines `strength` for EVIDENCE
        records (line 321) and defines NO `confidence` field for knowledge
        entries; across 81 findings, 75 carry a `confidence` value and ZERO use
        `replicated`. The vocabulary actually in use there is `reported`,
        `proved`, `established`, `provisional`, `preliminary_empirical`,
        `derivation`, `strong` -- plus long descriptive compounds that spell out
        the dependence structure explicitly, e.g.
        `derivation_via_direct_code_reproduction_by_one_session_from_two_independently_produced_raw_observations`.
        So the proposed target label is borrowed from the evidence-record
        vocabulary, where its operative meaning is "how many independent
        implementations produced the number" -- which is the reading that
        defeats the upgrade.
      why_the_label_is_not_cosmetic: >-
        docs/task-lifecycle.md line 124 and templates/research-records.md line
        525 make `replicated`/`strong` the gate: a `support` or `reject_scoped`
        decision backed by evidence of that strength MUST promote a KN-FIND or
        record `not_warranted`. docs/claims-and-verification.md line 146 also
        keys refutation policy to replication. The word carries mechanical
        downstream authority, so applying it loosely here would loosen it
        everywhere it is already applied strictly.
      what_would_change_it: FG-1, plus FG-6 to fix the documentation gap.

    - id: OBJ-5
      title: >-
        Two draws is repetition of ONE CONFIGURATION, not replication of the
        FINDING: the second instance is the nearest neighbour of the first in a
        deliberately tiny box, and every parameter that could stress the
        mechanism is held fixed or asserted out.
      line_of_attack: '(c) scope'
      severity: high
      how_close_the_two_draws_are: >-
        p: 1009 -> 1013 (the NEXT PRIME). A,B: (1,1) -> (2,2). n: 47 -> 41. Both
        ~10-bit, both ordinary, both prime n, both minimal short Weierstrass,
        both r=8, both GUARD=4. RUN-2's manifest discloses the selection rule
        honestly: "p=1013, 1021, 1031 tried; A,B in [1,5]x[1,5], selecting the
        FIRST ordinary curve found whose group order has a prime factor distinct
        from RUN-1's n=47". So the draw is not a sample from the hypothesis's
        family; it is the lexicographically first element of a 3 x 25 box
        adjacent to RUN-1. Both scripts additionally select S by the SAME
        deterministic rule (scan x ascending, sympy `sqrt_mod`'s canonical root,
        multiply by the cofactor, take the first hit), so S is not sampled
        either -- and neither run varies S WITHIN a curve, which is the cheapest
        available diversity axis and costs nothing.
      parameters_held_fixed_across_both_runs:
        - 'precision r = 8 and GUARD = 4 -- never varied; the Hensel step count `range(1, r+2)` is a function of r, so the whole precision budget is pinned at one point'
        - 'the null-lift perturbation depth e = 1 (x0 = S.x + p) -- never varied'
        - 'ordinary reduction -- SUPERSINGULAR IS ASSERTED OUT (`assert a_p != 0`) in both scripts, although the mechanism KN-TECH-73630e does not require ordinarity, and H-ECDLP-a40416 itself flags the ordinary assumption as "broader than strictly needed"'
        - 'good reduction / minimal model -- v_p(disc) != 0 is asserted in both; the premise has NO null object anywhere in either run'
        - 'gcd(n,p) = 1 -- asserted in both; see the scope caution below'
        - 'S not 2-torsion -- asserted in both'
        - 'six Part-3 triples in both, of which (1,2,3) and (2,5,9) are used VERBATIM in both runs'
      what_this_does_to_the_hypothesis_transition: >-
        H-ECDLP-a40416's statement quantifies over a FAMILY ("a small ordinary
        E/F_p (p around 1009) with S of prime order n coprime to p on a minimal
        Weierstrass model"). Moving it off
        `supported_scoped_single_toy_instance` on the strength of a second draw
        that varies only p by 4, the coefficients by 1, and n by 6 -- with every
        assumption in the `assumptions` block held fixed -- converts "single toy
        instance" into "two adjacent toy instances" and nothing more. The honest
        successor label is `supported_scoped_two_adjacent_toy_instances`, which
        is worth recording and is not `replicated`.
      the_finding_s_own_text_is_weaker_than_the_upgrade: >-
        KN-FIND-1ba0fe's Forward guidance reads: "A second toy instance
        (different curve, different n) would move this finding from
        `preliminary` TOWARD `replicated`." TOWARD, not TO. The finding's own
        author hedged the very inference now being proposed as sufficient.
      scope_caution_worth_carrying_forward: >-
        NOT AN OBJECTION TO THE FINDING AS WRITTEN, but a guard against later
        citation drift. Both runs assert gcd(n,p)=1, which excludes the ANOMALOUS
        case n = #E(F_p) = p where p-adic lifting is famously the winning attack
        (Smart / Satoh-Araki / Semaev; provenance: recalled -- named as a pointer
        for a reviewer, not as support, per AGENTS.md rule 9). The finding is
        correctly scoped to prime-to-p torsion and does not claim otherwise. But
        "D1 on the canonical torsion lift gives no leverage" must never be
        compressed in a later record into "p-adic lifting gives no leverage",
        because the two runs are drawn from a family that excludes by assertion
        the one case where the broader statement is false.
      what_would_change_it: FG-3, FG-4.

    - id: OBJ-6
      title: >-
        The measured outcome is FORCED once the order-n certificate passes, so
        the experiment's residual information content is about the
        implementation -- which is exactly the axis on which the two runs are
        not independent.
      line_of_attack: 'beyond the plan -- the mechanism of the inference itself'
      severity: high
      the_argument: >-
        Grant J1 the arithmetic, as instructed. The certificate `n * S_hat ==
        (0,1,0)` exactly mod p^r says S_hat is an exact n-torsion point of the
        group over Z/p^r. Then for the on-fibre pairs k = n - j: [k]S_hat =
        [n]S_hat - [j]S_hat = -[j]S_hat, and x(-P) = x(P) on a Weierstrass
        model, so x([k]S_hat) - x([j]S_hat) is EXACTLY ZERO as a ring element,
        and `valuation` returns its `cap` argument, r = 8. For off-fibre pairs,
        reduction mod p gives [k]S != +/-[j]S in E(F_p) because S has prime
        order n, so by Lemma 2 the x-coordinates differ mod p and the difference
        is a unit: valuation 0. Both branches are deductive consequences of the
        certificate plus Lemmas 1-2, which were already derived, independently
        re-derived (DEC-20260901-255ebd) and blind re-derived by a validator
        (TASK-20260831-c6ceb9) BEFORE either run.
      consequence_for_j2: >-
        Conditional on the certificate, the outcome space of this experiment is
        a single point: no correct implementation on any instance in the stated
        family can return anything but {0, r} canonical and {0, 1} null. The
        experiment therefore cannot furnish evidence ABOUT the mathematics; its
        entire residual function is to check that the implementation realises
        the deduction. A replication whose only informative axis is
        implementation correctness, performed by re-running the SAME
        implementation, is the least informative replication available. That is
        the precise sense in which two agreeing instances are insufficient.
      a_semantic_defect_this_exposes_shared_by_both_runs: >-
        `valuation(x, cap, mod)` returns `cap` when x == 0 mod p^r, so the
        reported on-fibre value 8 is NOT a measured p-adic valuation; it is a
        SENTINEL FOR EXACT EQUALITY OF TWO RING ELEMENTS. The null lift never
        reaches the cap, so the control never exercises that branch, and the
        defect is invisible to it. The runs and EV-ECDLP-f5c698 do disclose the
        weaker "v_p >= 8, never literal infinity" caveat -- correctly -- but
        "the two elements are literally equal mod p^8" is a stronger and
        cleaner statement than "the valuation is at least 8", and both records
        report the weaker one. Direction of error is conservative, so this is a
        reporting-precision defect and not a correctness defect; it is listed
        because it is baked into shared code and reproduces identically in both
        runs, which makes it a textbook member of the class OBJ-1 is about.
      what_would_change_it: FG-1, FG-3.

    - id: OBJ-7
      title: >-
        There is no pre-registered replication protocol. The frozen contract
        affirmatively declares `independent_instances: 1` and `maximum_runs: 1`,
        and no amendment exists.
      line_of_attack: '(b) definitional / procedural'
      severity: moderate
      finding: >-
        experiments/EXP-ECDLP-c373eb/specification.yaml carries
        `replication: {seeds: [], independent_instances: 1}` and
        `budget.maximum_runs: 1`. The experiment directory contains
        specification.yaml, execution-report.yaml, implementation/ and runs/ --
        there is NO `amendments/` directory, and `git log` shows one commit
        touching specification.yaml. RUN-2's own manifest concedes the point in
        DEV-1: the distinct-instance requirement was "task-level, not
        specification-level".
      why_it_bites: >-
        The contract that would have declared what replication means for this
        experiment declares the opposite -- one instance. So there is no
        pre-registered instance count, no pre-registered independence axis, and
        no stopping rule for replication to be measured against, and the target
        label is being chosen after seeing the result rather than before. This
        cuts against docs/evidence-and-reproducibility.md "Statistical
        discipline" ("Predefine the primary metric", "Treat seed selection as
        part of the protocol") and against AGENTS.md core rule 3. It does NOT
        invalidate RUN-2: the executor exercised the specification's own
        executor-choice clause, disclosed its search box honestly, and the
        deterministic forced outcome means there is no garden-of-forking-paths
        risk in the instance choice. It means only that "is two enough?" has no
        pre-committed answer, so answering it now with `replicated` is a
        post-hoc choice.
      what_would_change_it: FG-6.

    - id: OBJ-8
      title: >-
        The replication reproduced the design defect that RUN-1's own evidence
        record flagged as the thing needing repair.
      line_of_attack: '(c) scope / forward guidance already on record'
      severity: moderate
      finding: >-
        EV-ECDLP-f5c698 boundary 4 and KN-FIND-1ba0fe both record that Part 3's
        non-rigid-functional probe is "statistically underpowered at six
        triples" and that "a larger, deliberately-searched sample ... would be
        needed". RUN-2 used SIX TRIPLES AGAIN, two of them ((1,2,3) and (2,5,9))
        the same triples as RUN-1. Pooled sample: 12 triples, expected number of
        mod-p coincidences ~ 12/p ~ 0.012. Observing {0} twice is exactly what
        both a true RTF-1 and a broken probe predict; the second run added no
        power whatsoever to the one sub-result its predecessor declared
        underpowered.
      why_it_bites: >-
        KN-FIND-1ba0fe's Forward guidance named three items: a second instance,
        repair of the RTF-1 underpowering, and RC-3/RC-4. The round addressed
        item 1 and COPIED item 2's defect. A confidence upgrade on the finding
        as a whole would upgrade a record one of whose four reported
        sub-results remains, on the record's own statement, uninformative --
        and is now uninformative twice.
      what_would_change_it: FG-5.

    - id: OBJ-9
      title: >-
        The reported quantity has never been shown to respond to either
        parameter that is supposed to move it. There is no dose-response and no
        second null object.
      line_of_attack: 'inventor-protocol section 3 -- controls before belief'
      severity: high
      the_question_the_protocol_requires: >-
        Name the parameter that is supposed to destroy the signal, and state
        what the measurement should look like as it increases. Two such
        parameters exist here and NEITHER has ever been varied, in either run.
      parameter_1_precision_r: >-
        The canonical on-fibre value should equal r EXACTLY, at every r. At
        r = 4 it should read 4; at r = 16 it should read 16. If it stayed at 8
        when r moved to 16, the "flatness" would be an artifact of the Hensel
        step budget (`for step in range(1, r+2)`, GUARD = 4) rather than a
        property of the lift -- the canonical artifact tell of a quantity that
        fails to move when the parameter meant to move it does. BOTH RUNS SIT AT
        r = 8. The pipeline has never been shown to be responsive to r.
      parameter_2_null_lift_perturbation_depth_e: >-
        The null lift is x0 = S.x + p, i.e. e = 1, and it returns {0,1}. The
        defect lives in the formal group, on which [n] acts by a unit, so
        perturbation at depth e should give v_p(Z of [n]L) = e and null image
        {0, e}: e = 2 -> {0,2}, e = 3 -> {0,3}. That is a graded, falsifiable
        dose-response curve, obtainable by changing ONE CHARACTER in each script,
        and it would demonstrate that the pipeline measures p-adic DEPTH rather
        than emitting one of two memorised summaries. BOTH RUNS SIT AT e = 1,
        TWICE. A null object measured at a single dose is a single point, not a
        control curve.
      missing_null_object: >-
        The order-n premise has a null object. The GOOD-REDUCTION / MINIMAL-MODEL
        premise -- an equally load-bearing assumption of H-ECDLP-a40416, listed
        third in its `assumptions` block -- has NONE, in either run. Both scripts
        assert `disc % p != 0` and stop. There is no measurement of what D1 does
        when that premise fails, so there is no evidence that the reported
        two-valuedness is attributable to it.
      what_would_change_it: FG-3, FG-4.

  # =====================================================================
  # PROVES-TOO-MUCH CONTROL (Object A) -- MANDATORY, RUN AS ASSIGNED
  # =====================================================================
  proves_too_much_control:
    object: >-
      OBJECT A: two runs of the SAME systematically-wrong script on two
      different instances. The conclusion "the finding is replicated" is KNOWN
      FALSE there -- agreement is guaranteed by shared code and establishes
      nothing about the mathematics.
    outcome: PROVES_TOO_MUCH -- the licensing argument survives on Object A and is therefore wrong.
    the_argument_run_unchanged: >-
      The argument that would license the upgrade is: "RUN-1 and RUN-2 measured
      the predicted image {0,8} on two DIFFERENT instances (different p,
      different curve, different n); each run additionally carried a
      discriminating null-lift control that returned a DIFFERENT image {0,1},
      ruling out a precision artifact; each verified an order-n certificate;
      each spot-checked D1 against a second code path. Two agreeing instances
      with passing internal controls meet `replicated`."
    running_it_against_object_a: >-
      Substitute a systematically-wrong script for the correct one and change
      nothing else in the argument. (i) "Two different instances": satisfied --
      Object A stipulates two instances. (ii) "Agreeing image": satisfied, and
      GUARANTEED, since the shared code produces the same output shape on both.
      (iii) "A discriminating null-lift control returning a different image":
      satisfied -- the null-lift branch is computed by the SAME shared code, so
      whatever it returns it returns identically in both runs, and its
      difference from the canonical image is a property of the code, not of the
      mathematics. (iv) "An order-n certificate": satisfied -- the certificate
      is computed by the same `scalar_mult` the wrong script uses everywhere
      (OBJ-2), so a self-consistent error passes it in both runs. (v) "A
      spot-check against a second code path": satisfied -- `scalar_mult` versus
      `scalar_mult_naive` both call `jac_add`, so a wrong `jac_add` agrees with
      itself in both runs, at the same pair (5,12) in both. EVERY CLAUSE OF THE
      ARGUMENT IS SATISFIED ON OBJECT A. The argument returns the same
      favourable verdict where its conclusion is known false. This is the
      plan's declared failure signature for J2, met in full.
    where_in_the_argument_the_survival_happens: >-
      At the single inferential step "the two runs agree, THEREFORE the
      agreement is evidence about the mathematics." That step silently assumes
      the two runs are CONDITIONALLY INDEPENDENT GIVEN THE MATHEMATICS. They are
      not. Because 266 of 270 executable lines are shared,
      P(agree | shared systematic error) = 1, so the likelihood ratio between
      "correct" and "shared systematic error" is 1 and the agreement is
      evidentially inert on exactly the hypothesis that matters. Every other
      clause of the argument -- the null control, the certificate, the
      spot-check -- inherits the same defect because each is implemented in the
      shared code and therefore transfers to Object A unchanged.
    the_patched_argument_and_whether_it_survives: >-
      Patch: "... AND the image was reproduced by an implementation that shares
      no code with the producer." Re-run against Object A: an independent
      implementation would DISAGREE with the systematically-wrong script, so the
      patched argument does NOT license the upgrade on Object A. It
      discriminates. Note that the patched argument is, to the word, the
      program's operative standard recovered in OBJ-4 ("shares no code with the
      producer", EV-ECQ-5c2c0a, EV-MDFIVE-24e077, EV-MLKEM-5aa471). The
      surviving-and-discriminating version of the argument is one RUN-2 does not
      satisfy: RUN-2 shares 100% of the arithmetic with RUN-1.
    consequence: >-
      Under the assigned control the licensing argument fails, and the patched
      argument that passes the control is not satisfied by the evidence in hand.
      J2 breaks.

  # =====================================================================
  # REQUIRED CONTROLS
  # =====================================================================
  required_controls:
    - id: RC-A
      control: >-
        Independent-implementation re-derivation of the FULL image on BOTH
        instances by code sharing no lines with rc1_tabulation*.py.
      discharges: OBJ-1, OBJ-2, OBJ-6, proves_too_much
      note: >-
        This is the one control whose absence is decisive. See FG-1 for the
        cheapest concrete form, including a construction of the order-n lift
        that uses no Hensel iteration at all.
    - id: RC-B
      control: >-
        Cross-check of the Z/p^r Jacobian arithmetic against the F_p affine
        arithmetic ALREADY PRESENT and unused in both scripts, for all
        k = 1..n-1.
      discharges: OBJ-2 (partially -- only errors visible mod p)
    - id: RC-C
      control: >-
        Dose-response on the null object: null-lift perturbation depth
        e in {1,2,3,4}, predicted image {0,e}; and precision sweep
        r in {4,8,16}, predicted canonical image {0,r}.
      discharges: OBJ-9, and OBJ-6's semantic defect
    - id: RC-D
      control: >-
        Nearby-object controls: (i) a supersingular curve with gcd(n,p)=1,
        where the mechanism predicts the SAME {0,r} and both scripts currently
        assert the case out; (ii) a non-minimal / bad-reduction model, where the
        premise fails and the signal must change -- the premise that currently
        has no null object at all.
      discharges: OBJ-5, OBJ-9
    - id: RC-E
      control: >-
        Within-curve instance diversity: at least three distinct generators S of
        the same order n on the SAME curve, and at least one curve with a
        DIFFERENT n-structure. Costs seconds and breaks the shared
        first-hit-scanning selection rule.
      discharges: OBJ-5
    - id: RC-F
      control: >-
        RTF-1 non-rigid probe at >= 5p triples, or a deliberate search for a
        triple with x([k1])x([k2]) = x([k3]) mod p.
      discharges: OBJ-8

  counterexample_or_mutation: >-
    THE CHEAPEST DISCRIMINATING MUTATION, and the one I would run first: in a
    fresh file, construct the order-n lift WITHOUT any Hensel/Newton machinery,
    using only group arithmetic. Take any lift L of S to Z/p^r (Hensel or
    otherwise), note that the kernel of reduction E_1(Z/p^r) -> E(F_p) has
    exponent dividing p^(r-1), and set
        S_hat' = [ p^(r-1) * ((p^(r-1))^(-1) mod n) ] L.
    Then S_hat' reduces to S (the scalar is 1 mod n) and [n]S_hat' = O (the
    scalar is 0 mod p^(r-1), which kills the formal-group part of [n]L). The
    order-n lift is unique, so S_hat' MUST equal the scripts' x_hat EXACTLY --
    all r digits, a hard binary check on the single load-bearing object, not
    five sampled pairs. Implement it with AFFINE arithmetic over Z/p^r
    (`pow(z,-1,p^r)`) rather than Jacobian coordinates and it shares no line
    with either script: it exercises a different lift construction AND a
    different group law. It is roughly fifteen lines and runs in well under a
    second on both instances. If x_hat disagrees, the shared core is wrong and
    both runs fall together -- which is precisely the outcome no amount of
    re-running rc1_tabulation*.py can produce.

  # =====================================================================
  # BASELINE COMPARISON AND PARETO CHECK
  # =====================================================================
  baseline_comparison:
    note: >-
      The substantive claim under KN-FIND-1ba0fe is a NEGATIVE -- that D1
      supplies no leverage. The Pareto check therefore runs in the direction of
      confirming domination of D1 by the trivial baseline, and I checked every
      axis rather than reading past the field, per AGENTS rule 5 and the
      `dominated_by` discipline.
    axes_checked:
      time: >-
        D1 requires constructing the canonical lift (r+1 Hensel correction
        steps, EACH performing a full [n] scalar multiplication at precision
        p^(r+GUARD)) plus two scalar multiplications in Z/p^r per queried pair.
        The trivial baseline -- compare x([j]S) and x([k]S) in F_p -- requires
        two scalar multiplications in F_p and one comparison. D1 is strictly
        more expensive by the full p-adic-precision factor plus the lift
        precomputation.
      memory: >-
        D1 holds r-digit (p^8) integers; the baseline holds single field
        elements. Strictly worse, no axis of improvement.
      data_queries: >-
        Identical: both need [j]S and [k]S. No query advantage.
      information: >-
        Identical output -- the indicator of k = +/-j mod n. Zero information
        gain, which is the finding's own point.
    invariant_cost_charged: >-
      Per KN-LIT-7593, an eliminated search dimension is not a speedup until the
      invariant's own cost is in the total. Here the direction is favourable to
      the finding: charging the lift's construction cost makes D1 look WORSE, so
      the negative conclusion cannot be inflated by omitting it. I note only
      that the cost is not tabulated anywhere in the package; it should be, if
      only in one line, so a later reader can see it was charged.
    dominated_by: >-
      NOT NULL. D1 is dominated on every axis by the single F_p x-coordinate
      comparison, and hence by Pollard rho with the negation map
      (~sqrt(pi*n/4)/sqrt(2) group operations, O(1) memory with distinguished
      points), and by BSGS (~2*sqrt(n) operations, sqrt(n) memory) for the
      same reason -- neither needs D1 to exploit the +/- quotient. The closest
      specialized baseline, the Smart / Satoh-Araki / Semaev anomalous-curve
      p-adic attack (provenance: recalled; named as a pointer, not as support),
      is INCOMPARABLE rather than dominating: it applies to n = p, which both
      runs exclude by assertion. See OBJ-5's scope caution.
    sota_delta: >-
      Zero, by construction and as intended. D1 moves no exponent and no
      constant; the finding claims it does not, and I found nothing in either
      run that would let it claim otherwise. Nothing in this round inflates the
      claim in the SOTA direction, and I record that as a point in the
      package's favour.

  # =====================================================================
  # EXEMPLAR-PROFILE AUDITS -- RECORDED, NOT SILENTLY OMITTED
  # =====================================================================
  heuristic_challenges:
    - id: HC-1
      status: not_applicable_with_reason
      finding: >-
        H-ECDLP-a40416 carries `heuristic_assumptions: []` and
        `asymptotic_claim: null`, and I confirmed the record contains no
        numbered heuristic, no random-model justification and no distribution
        theorem. The exemplar-profile heuristic inventory (red-team.md items
        1-3) therefore has no object to attack, and I record that rather than
        omitting it. THE ABSENCE IS CORRECT, not a defect: this is a bounded
        deductive-confirmation measurement, and inventing heuristics for it
        would be the error.
    - id: HC-2
      status: raised
      finding: >-
        There is nevertheless ONE unstated modelling assumption, and it is
        load-bearing for J2 rather than for the mathematics: THAT TWO RUNS
        SHARING 266 OF 270 EXECUTABLE LINES ARE CONDITIONALLY INDEPENDENT GIVEN
        THE MECHANISM. It is nowhere numbered, nowhere stated and nowhere
        justified, and it is false. It is the exact analogue, at the level of
        evidence rather than mathematics, of an unnumbered heuristic doing
        silent work in a proof. Objections OBJ-1 and the Object-A control are
        its falsification.

  cost_model_challenges:
    - id: CC-1
      status: not_applicable_with_reason
      finding: >-
        No asymptotic claim, no concrete-cost table, no o(1)/polylog cofactor,
        no time-memory interpolation and no affected-vs-safe scheme list is
        asserted anywhere in this package, so the hidden-overhead,
        cost-bookkeeping and van Oorschot-Wiener audits have no object. The
        one cost statement present -- that D1 is dominated by a free F_p
        comparison -- I checked directly and confirmed in `baseline_comparison`
        above, including the invariant's own construction cost.
    - id: CC-2
      status: raised
      finding: >-
        Per-attempt versus total-expected-cost confusion has a small analogue
        here that IS live: EV-ECDLP-f5c698 and KN-FIND-1ba0fe correctly compute
        the RTF-1 non-rigid probe's per-triple coincidence probability (~1/p)
        and correctly conclude "underpowered at six triples" -- but RUN-2 then
        ran six triples again without multiplying through by the number of
        attempts needed. Total power = per-triple probability x number of
        triples; at 12 pooled triples that is ~0.012, which is not a test.
        See OBJ-8 and FG-5.

  reduction_and_scope_challenges:
    - id: RS-1
      finding: >-
        No corollary is obtained here by citing a published reduction, so the
        reduction-instantiation audit has no object. The one external
        ingredient, KN-TECH-73630e (reduction is an isomorphism on prime-to-p
        torsion), is internal, was independently re-derived twice on the prior
        round (DEC-20260901-255ebd; validator TASK-20260831-c6ceb9 sealed blind
        re-derivation), and I did not find it misapplied.
    - id: RS-2
      finding: >-
        SCOPE INFLATION AUDIT: I found NONE in the current records, and I say so
        plainly because a red team that reports only defects is not calibrated.
        KN-FIND-1ba0fe's "What this does NOT establish" section is unusually
        disciplined -- it disclaims replication, disclaims closure of
        KN-OPEN-3417fc, disclaims D2, disclaims retiering KN-FIND-002 and
        KN-FIND-b7e091, and disclaims cryptographic scale. RUN-2's
        execution-report carries a `no_interpretation_note` and an
        `operational_limitations` block stating "two toy instances, not a
        systematic sweep". The executor did not overclaim. THE RISK IN THIS
        ROUND IS ENTIRELY AT THE COMPOSITION STEP, not at the producer.
    - id: RS-3
      finding: >-
        ONE DISCLOSURE GAP AT THE PRODUCER, small but real:
        `operational_limitations` names the instance count and the precision cap
        but does NOT name the fact that the script shares its entire arithmetic
        core with RUN-1's. A reader of RUN-2's manifest alone -- which is what a
        composing Coordinator reads -- would not learn the single most important
        fact about RUN-2's evidential independence. Compounded by the
        `independent_certificate` field name flagged in OBJ-2.

  proof_architecture_challenges:
    - id: PA-1
      audit: nearby-object
      finding: >-
        The reasoning for the canonical lift's two-valuedness must NOT apply
        verbatim to a lift failing the order-n condition. I checked that my own
        OBJ-6 derivation does not: it uses [n]S_hat = O at the first step, which
        the null lift does not satisfy, and the null lift's {0,1} is then the
        correct prediction from the perturbation depth e = 1. My argument
        therefore distinguishes the two objects and does not prove too much on
        the null lift either. (Object B is J1's assignment; I record this only
        because my own OBJ-6 reasoning had to be checked against it.)
    - id: PA-2
      audit: quantifier-order
      finding: >-
        The finding's claim is correctly quantified -- "for this tested
        instance" -- and does not silently choose the instance after seeing the
        outcome in any way that matters, since the outcome is forced (OBJ-6).
        But H-ECDLP-a40416's STATEMENT quantifies over a family, and its status
        transition is the place where the quantifier can slip from "there exist
        two instances such that" to "for all instances in the family". OBJ-5
        is the guard.
    - id: PA-3
      audit: method-ceiling
      finding: >-
        The largest claim this measurement design can support, under ideal
        tuning and unlimited instances, is: "no counterexample to Proposition E
        exists among the instances tested, as computed by this implementation."
        It cannot reach "the mechanism is correct" (that is the already-archived
        derivation's job, not this experiment's) and it cannot reach
        "implementation-independent" without a second implementation. The
        ceiling does not reach `replicated` under the operative reading of
        OBJ-4, no matter how many instances are added ON THIS CODE. Adding a
        third and fourth near-clone instance would not fix J2; adding one
        independent implementation would.

  # =====================================================================
  # NARROWEST SUPPORTED STATEMENT
  # =====================================================================
  narrowest_supported_statement: >-
    Granting J1's arithmetic as instructed, the evidence supports exactly this
    and no more: on TWO adjacent toy instances -- (p=1009, y^2=x^3+x+1,
    S=(286,680), n=47) and (p=1013, y^2=x^3+2x+2, S=(393,263), n=41), both ~10
    bits, both ordinary, both prime n, both minimal short Weierstrass, both at
    precision r=8 -- ONE IMPLEMENTATION, run twice with four constants changed,
    exhaustively tabulated D1 over all 1035 and all 780 pairs respectively and
    obtained image {0, >=8} in both, with the accompanying null-lift control at
    perturbation depth e=1 giving {0,1} in both. This is consistent with
    Proposition E, adds one instance to the tested set, and adds NO
    implementation independence, NO parameter diversity in r or e, NO diversity
    in S within a curve, and NO additional power to the RTF-1 non-rigid probe.
    The honest label for KN-FIND-1ba0fe remains `preliminary`; the honest label
    for H-ECDLP-a40416 is a widened scoped status such as
    `supported_scoped_two_adjacent_toy_instances`, NOT `replicated`. Recording
    that widening, with the reason two runs did not suffice, is itself a result
    worth committing -- the Coordinator's own prior anticipated exactly this
    and it is the outcome the plan describes as "a useful finding in itself".

  # =====================================================================
  # FORWARD GUIDANCE -- a closure without it is a fatigue report
  # =====================================================================
  forward_guidance:
    - id: FG-1
      title: 'Independent implementation of the FULL image on BOTH instances.'
      discharges: OBJ-1, OBJ-2, OBJ-6, proves_too_much
      cost: 'one file, ~40 lines, <5 s runtime, no new mathematics'
      cheapest_concrete_form: >-
        Build the order-n lift by the group-theoretic route in
        `counterexample_or_mutation` above (S_hat' = [p^(r-1) *
        ((p^(r-1))^(-1) mod n)] L), using AFFINE arithmetic over Z/p^r instead
        of Jacobian coordinates. This shares no line with either script and
        exercises a different lift construction AND a different group law.
        Assert (i) x_hat' == x_hat exactly mod p^8 on BOTH instances -- a hard
        binary check on all r digits of the single load-bearing object, versus
        the five sampled pairs currently on record for RUN-1 -- and (ii) the
        FULL 1035- and 780-pair images agree. THIS IS THE ONE ITEM THAT WOULD
        GENUINELY DISCHARGE J2. Any two of {RUN-1, RUN-2, this} then constitute
        two implementations, which is what `replicated` means in this program's
        practice.
      priority: 1
    - id: FG-2
      title: 'Cross-check the shared core against the unused F_p implementation already in the file.'
      discharges: 'OBJ-2 (partially)'
      cost: 'three lines, zero new code, <1 s'
      form: >-
        assert affine_x(scalar_mult(k, S_hat, MOD), MOD) % p ==
        fp_mul(k, S, p, A)[0] for k = 1..n-1, in both scripts. Catches any
        `jac_add`/`jac_dbl` error visible mod p using code already written and
        currently used only for instance setup. It does NOT catch errors that
        vanish mod p, so it supplements FG-1 and does not replace it.
      priority: 2
    - id: FG-3
      title: 'Dose-response on both parameters that are supposed to move the quantity.'
      discharges: OBJ-9, OBJ-6, OBJ-3
      cost: '12 cells, seconds, one-character edits'
      form: >-
        Sweep the null-lift perturbation depth e in {1,2,3,4} (x0 = S.x + p^e),
        predicting null image {0,e} exactly; and sweep r in {4,8,16},
        predicting canonical image {0,r} exactly. PRE-REGISTER BOTH PREDICTIONS
        BEFORE RUNNING. A null image that stays {0,1} as e rises, or a canonical
        value that stays 8 as r rises, is the artifact tell and would be a far
        more valuable outcome than another agreeing instance.
      priority: 3
    - id: FG-4
      title: 'The two missing null/nearby objects.'
      discharges: OBJ-5, OBJ-9
      cost: 'two instances, seconds; requires relaxing two asserts'
      form: >-
        (i) SUPERSINGULAR curve with gcd(n,p)=1: KN-TECH-73630e does not require
        ordinarity, so the mechanism PREDICTS the same {0,r}; both scripts
        currently assert this case out (`assert a_p != 0`), and confirming it
        would show whether the `ordinary` assumption -- which H-ECDLP-a40416
        itself calls "broader than strictly needed" -- is load-bearing.
        (ii) NON-MINIMAL / BAD-REDUCTION model (v_p(disc) != 0): the premise
        fails and the signal must change. This premise currently has no null
        object anywhere in the package.
      priority: 4
    - id: FG-5
      title: 'Repair, rather than re-copy, the RTF-1 underpowering.'
      discharges: OBJ-8, CC-2
      cost: 'seconds; ~5000 triples on a 10-bit instance is trivial'
      form: >-
        Raise the non-rigid triple sample to >= 5p (expected ~5 coincidences at
        the stated ~1/p per-triple rate), or deliberately SEARCH for a triple
        with x([k1])x([k2]) = x([k3]) mod p and exhibit it. Either converts a
        twice-uninformative sub-result into a real test of RTF-1's non-rigid
        half.
      priority: 5
    - id: FG-6
      title: 'Fix the threshold before applying it, in both places it is broken.'
      discharges: OBJ-4, OBJ-7
      cost: 'documentation plus one amendment record; no compute'
      form: >-
        (i) Amend EXP-ECDLP-c373eb (or freeze a successor contract) declaring
        the replication protocol BEFORE the next run: how many instances,
        whether independence is of INSTANCE or of IMPLEMENTATION, and the
        stopping rule. The current contract says `independent_instances: 1`,
        `maximum_runs: 1`, and has no `amendments/` directory.
        (ii) Tighten docs/evidence-and-reproducibility.md line 11 so the
        documented threshold matches the operative one recovered in OBJ-4 --
        e.g. "`replicated` | The effect was reproduced by an implementation
        sharing no code with the producer; a second instance through the same
        implementation is not replication." And decide whether KN-FIND
        `confidence` may take evidence-strength values at all, given that zero
        of 81 findings currently use `replicated`. THIS IS A FINDING ABOUT THE
        PROGRAM, NOT ABOUT THE MATHEMATICS, and it will recur on every future
        replication round until it is written down.
      priority: 6

  next_concrete_action: >-
    Run FG-1: a single ~40-line independent implementation that constructs the
    order-n lift group-theoretically (no Hensel iteration) with affine Z/p^r
    arithmetic (no Jacobian coordinates), and re-derives the FULL D1 image on
    BOTH instances -- all 1035 pairs at n=47 and all 780 at n=41 -- asserting
    exact agreement of x_hat on all 8 p-adic digits. It shares no line with
    either existing script, costs under five seconds, requires no new
    mathematics, and is the ONLY item on this list that converts the present
    "one implementation run twice" into the "two implementations" that
    `replicated` means in this program's own committed practice. Until it runs,
    keep KN-FIND-1ba0fe at `preliminary` and record WHY -- per the review plan's
    own composition_rule, that record is the round's result, not its failure.

  # =====================================================================
  # WHAT I DID NOT OBJECT TO -- calibration
  # =====================================================================
  not_objected_to:
    - >-
      RUN-2's reported values. They agree with RUN-1 and with Proposition E. I
      grant J1's arithmetic as instructed and found no reason in the inference
      to doubt it.
    - >-
      The executor's conduct. RUN-2 disclosed its instance-search box
      ("p=1013, 1021, 1031 tried; A,B in [1,5]x[1,5]"), disclosed the dirty
      tree and why, refused to interpret (`no_interpretation_note`), and stated
      "two toy instances, not a systematic sweep" in its own limitations. That
      is the right behaviour and it is why this objection is about composition
      rather than production.
    - >-
      The finding's scoping discipline. KN-FIND-1ba0fe's "What this does NOT
      establish" section is a model of the genre and I found no inflation in it.
    - >-
      The null-lift control's DESIGN. It is a genuine discriminating control
      against the mathematical alternative it targets, and against a real if
