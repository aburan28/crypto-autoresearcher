        samples of the same presumed underlying distribution, not a paired
        seed-by-seed check.
      noise_assessment: >-
        Judged WITHIN seed-to-seed noise, not a units/definition mismatch,
        for four disclosed reasons: (1) both samples' margins cluster in the
        same narrow near-zero-positive band (blind: -0.0015 to +0.0206;
        production: +0.0031 to +0.0119) with nearly identical sample means
        (blind +0.00618, production +0.00693); (2) this is exactly the cell
        specification.v2.yaml's own `preregistered_prediction` independently
        flagged, BEFORE either reading was produced, as "predicted FEASIBLE
        but BORDERLINE (around 4/5, possibly 3/5 or 5/5) ... the one this
        contract is least confident in and most likely to move"; (3) the
        blind sample's wider spread (0.022) vs. production's (0.009) is
        itself consistent with ordinary 5-draw sampling variance around a
        small true margin, not a systematic bias in one direction; (4) no
        stated units/definition difference was found between the two
        implementations' G3-style criterion (both apply exact top-T_sel
        share >= STATIC(T)_r exact coverage identically). This judgement is
        a Validator interpretation of a genuinely borderline case, disclosed
        as such -- the Coordinator may reasonably want a documented option
        of a larger-seed confirmatory run before treating this as fully
        closed, though this task's own scope does not authorize running one.
