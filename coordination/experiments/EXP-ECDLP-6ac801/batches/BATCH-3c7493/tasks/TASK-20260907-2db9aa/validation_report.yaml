  limitations:
    - >-
      This task's own instrument is a genuinely independent, from-scratch
      construction (a literal uniformly random self-map table + independent
      Bernoulli(1/W) DP marking + exact binary-lifting absorption), not a
      re-implementation of production's specific mix64-based hash instrument.
      This is the POINT of a blind re-derivation (testing the STATISTICAL
      MODEL, not reproducing one implementation's approximation of it), but
      it means per-seed numeric values are not expected to match production
      seed-for-seed, only in aggregate pattern and magnitude -- exactly the
      comparison performed above.
    - >-
      A nonzero fraction of points at every cell never reach a distinguished
      point (caught in a DP-free cycle under this reviewer's own literal
      random-function realization); this task treats such points as
      genuinely uncovered by ANY selection (excluded from all basin/coverage
      sums, which are always taken over N in the denominator). Production's
      own summary.json cells show a `cap` field (~8W) suggesting a
      walk-length cutoff rather than an infinite-horizon exact-absorption
      test; the two approaches are plausibly handling the same underlying
      model feature via different practical mechanisms, and this
      possible definitional difference was not, and could not within this
      task's scope be, fully reconciled against production's own
      implementation (whose source this task's own blind_from restriction
      never opens). It did not appear to bias the qualitative conclusion,
      given both readings agree on the categorical verdict.
    - >-
      A single sealed sample of 5 fresh seeds is a small sample at a cell
      whose margin is close to zero by the contract's own preregistered
      characterization; the S1 verdict rests on a judgement about whether an
      observed one-seed sign flip is noise, disclosed in full above rather
