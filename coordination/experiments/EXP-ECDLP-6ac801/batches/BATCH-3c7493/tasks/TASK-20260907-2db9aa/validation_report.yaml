        fate), exact basin sizes by full enumeration, oracle top-128-basin
        share computed directly; STATIC(T)_r pool built via uniform random
        restarts (own RNG stream) crediting every walk until exactly
        r*T=512 distinct DPs are found, weight_d = S_d + 4*W*h_d, top 256 by
        weight selected, true exact coverage of that selected set read off
        the full enumeration.
