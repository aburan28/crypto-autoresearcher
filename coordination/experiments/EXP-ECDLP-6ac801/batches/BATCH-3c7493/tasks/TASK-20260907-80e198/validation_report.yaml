  control_checks:
    - "control (a) blind rederivation seal: PASS, sealed before any blind_from read"
    - "control (b) a=1/4 replication control: PASS under both blind (0/5 pass) and production (0/5 pass) readings; production identical to EV-ECDLP-60e266 to quoted precision"
    - "control (c) exact-coverage non-exceedance: PASS, 0 exceedances across sealed Stage A cells and all 20 production raw cells"
    - "control (d) definitional identity with v2 g3_gate_procedure: PASS, verbatim in substance, confirmed by reading both specification texts and the executor's stagec_analysis.py source"
    - "control (e) seed-count parity: PASS, 5 seeds per a on both readings, no duplicates"
  heuristic_validation_checks:
    - >-
      HEUR-BLT-1 (uniformly random function + independent Bernoulli(1/W)
      marking) is the standing assumption this contract inherits and does
      not re-test (per specification.yaml `heuristic_note`); Stage A's own
      implementation is built directly on this model and its basin-closure
      correctness was independently verified against exhaustive brute force
      at N=1024 (0 mismatches after a resolution-check fix), which is the
      applicable sample-integrity/positive-control check available here.
  cost_model_checks:
    - "Not applicable: specification.yaml `cost_model.standardized_parameter_sets` states this is a feasibility measurement, not a COST-* record; no cost table is reported by this contract."
  proof_architecture_checks: []

  limitations:
    - >-
      Stage A's sealed STATIC(T)_r selection used true exact basin size
      rather than production's S_d+4*W*h_d weight, because
      specification.yaml's own `definitions` text underspecifies the
      selection formula (see `a_1_8_disagreement_root_cause`). This is the
      single largest limitation of this review: a=1/8's literal S3
      verdict is a definitional artifact of the frozen contract's own text,
      not an open scientific question about N-dependence, but this report
      does not have standing to re-seal Stage A under a corrected
      definition.
    - >-
      Stage A's own pool-sampling RNG offset used Python's `hash()` on a
      string, which is process-randomized (PYTHONHASHSEED) and therefore
      not reproducible bit-for-bit across runs of blind_rederivation.py; the
      sealed artifact is a fixed, legitimate realization, disclosed with
      this caveat.
    - >-
