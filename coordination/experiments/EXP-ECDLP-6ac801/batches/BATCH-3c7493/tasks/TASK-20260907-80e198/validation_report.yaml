      production's mix64/hash64), exact basin closure via vectorized
      pointer-doubling (26 rounds, verified correct against an exhaustive
      brute-force walk at N=1024 with 0 mismatches after fixing a resolution
      bug found during that check -- see `defects_found_in_own_method`
      below), and an independently-implemented Bernstein-Lange-style
      oversampled pool (r*T=512 distinct DPs collected via uniformly random
      restarts, weighted naturally toward larger basins) for STATIC(T)_r.
      Code: blind_rederivation.py (this task's own directory).
    artifact_path: coordination/experiments/EXP-ECDLP-6ac801/batches/BATCH-3c7493/tasks/TASK-20260907-80e198/sealed_blind_rederivation.json
    artifact_sha256: 9127cabc803bb5fdbb90342bb7724810c6d5d5cfea0a83d6e4cfe40762fa90d3
