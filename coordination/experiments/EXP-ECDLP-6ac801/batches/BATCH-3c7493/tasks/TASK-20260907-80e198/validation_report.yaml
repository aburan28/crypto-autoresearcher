      affect any verdict.

    defects_found_in_own_method: >-
      (1) CORRECTNESS BUG, FOUND AND FIXED BEFORE THE N=2^24 RUN: an early
      version checked resolution via `g[terminal] == terminal`, which cannot
      distinguish a genuine DP self-loop from a coincidental FIXED POINT of f
      that is NOT a DP (f(y)=y, D[y]=False also self-loops under g). Caught
      by an exhaustive N=1024 brute-force cross-check (3/1024 mismatches,
      all funnelling into one non-DP fixed point); fixed by requiring
      resolved[x] = D[terminal[x]] explicitly; re-verified against the same
      brute force with 0 mismatches. This fix was in place before the sealed
      N=2^24 run; the sealed artifact is NOT affected by this bug.
      (2) REPRODUCIBILITY DEFECT, FOUND AFTER SEALING, DISCLOSED HERE, NOT
      corrected in the sealed artifact or in blind_rederivation.py (an
      immutable record of what was actually run): the STATIC(T)_r
      pool-sampling RNG offset was seeded in part with
      `hash(a_label) % 1000`, where a_label is a Python str. CPython
      randomizes str hashing per process by default (PYTHONHASHSEED), so
      this offset differs on every fresh process invocation -- confirmed
      directly (`hash('1/8') % 1000` returned 287, 396, 762 on three bare
      `python3 -c` calls in this environment). The sealed JSON is a fixed,
      legitimate, hash-stamped data point (one particular realization of a
      correctly-specified random procedure), but blind_rederivation.py is
      NOT bit-for-bit reproducible from a fresh re-run because of this. This
      does not change any of the four cells' pass-count verdicts under
      repeated independent checks (see `postseal_diagnostics` below, which
      used a corrected, deterministic offset and reproduced the same
      qualitative pattern), but it is a real quality defect in Stage A's own
      code, disclosed rather than silently left for a reader to discover.

