  # =========================================================================
  # ROOT-CAUSE DIAGNOSIS OF THE a=1/8 DISAGREEMENT (post-seal, fully disclosed)
  # =========================================================================
  a_1_8_disagreement_root_cause:
    finding: >-
      specification.yaml's own `definitions.STATIC(T)_r exact coverage`
      text names "the published Bernstein-Lange weight" used to select the T
      table entries from the r*T-distinct-DP pool, but never states the
      formula. This is an UNDERSPECIFICATION IN THE FROZEN CONTRACT ITSELF,
      not a bug in either implementation: the plain HEUR-BLT-1 statistical
      model given in `blind_rederivation.quantity` (a uniformly random
      function plus independent Bernoulli marking) does not determine this
      formula, so an independent from-scratch reader has no way to derive it
      and must make a defensible but arbitrary choice.
    what_stage_a_did: >-
      Absent the formula, Stage A's sealed computation selected the pool's T
      entries by TRUE EXACT BASIN SIZE (an oracle-optimal selection given
      the sampled pool) -- the most natural reading of "weight" without
      access to the specific literature estimator.
    what_production_actually_does: >-
      Read AFTER the seal (permitted: the blind_from timing rule binds
      before sealing, not after -- specification.yaml `blind_rederivation.procedure`
      explicitly directs the reviewer to open blind_from paths "ONLY THEN",
      i.e. after sealing, for exactly this kind of comparison/diagnosis) in
      experiments/EXP-ECDLP-612fb1/source_v2/instrument.py, reused unchanged
      by this contract's Stage B (execution_report.yaml
      `implementation.instrument_reuse`): `Pool.weights(W)` computes weight_d
      = S_d + 4*W*h_d, where S_d is the SUM of GENERATING-WALK LENGTHS of
      every pool-construction walk that terminated at DP d during
      `generate_pools` (uniform restarts, batches, every walk charged), and
      h_d is the hit count -- a realistic, walk-statistics-based ESTIMATOR a
      real precomputer would have to use (not knowing exact basin sizes in
      advance), NOT the DP's true exact basin size. STATIC(T)_r's table is
      selected by this weight, and only then is its TRUE exact coverage
      read off the true sizes of the selected entries -- production's
      "exact coverage" is exact, but the SELECTION that produced the
      selected set is a realistic estimator, not an oracle.
    controlled_diagnostic: >-
      postseal_diagnostic_v2_clean.py (this task's directory; run strictly
      after the seal and after reading instrument.py) draws ONE shared pool
      of (start, terminal-DP, walk-length) triples per (a, seed) -- fixing
      an earlier, less careful diagnostic pass's confound of also comparing
      across different pool draws, and fixing the PYTHONHASHSEED
      nondeterminism defect above with a deterministic offset -- and applies
      BOTH selection rules (true-size vs S_d+4*W*h_d) to the IDENTICAL pool,
      isolating the selection-rule effect.
    controlled_diagnostic_results:
      "a=1/16": {margin_by_size: [0.009832, 0.010919, 0.011419, 0.021962, 0.012595], margin_by_weight: [0.018459, 0.017246, 0.018898, 0.029382, 0.022182], pass_by_size: 5, pass_by_weight: 5}
      "a=1/8": {margin_by_size: [-0.002059, -0.009712, -0.000395, 0.001407, -0.006330], margin_by_weight: [0.015305, 0.000836, 0.010721, 0.013383, 0.008528], pass_by_size: 1, pass_by_weight: 5}
      "a=3/16": {margin_by_size: [-0.013632, -0.017960, -0.009432, -0.017322, -0.025900], margin_by_weight: [-0.002048, 0.001197, 0.010779, -0.002366, -0.006438], pass_by_size: 0, pass_by_weight: 2}
      "a=1/4": {margin_by_size: [-0.026986, -0.036135, -0.031442, -0.053378, -0.047598], margin_by_weight: [-0.004838, -0.015635, -0.014850, -0.031043, -0.017314], pass_by_size: 0, pass_by_weight: 0}
    interpretation: >-
      Switching the STATIC(T)_r selection rule from true-size (oracle) to
      the production's actual S_d+4*W*h_d weight, on the SAME underlying
      pool, SYSTEMATICALLY RAISES the margin at every (a, seed) tested (the
      oracle selection always weakly dominates a realistic estimator's
      selection, so STATIC(T)_r's coverage under the oracle rule is
      systematically higher, making share-minus-coverage systematically
      lower under the sealed method than under production's method). At
      a=1/8 this flips the pass-count from 1/5 (INFEASIBLE) to 5/5
      (FEASIBLE), exactly matching production. At a=3/16 it moves 0/5 to
      2/5 -- still solidly INFEASIBLE by the >=4/5 threshold, but visibly
      closer to production's own near-boundary readings there (two
      production seeds at -0.000055 and -0.001886). At a=1/16 and a=1/4 the
      verdict is unchanged under either rule (robust). This is a
      DEMONSTRATED, CHECKABLE units/definition mismatch, not a genuine
      N-dependent reversal and not a computational bug in either party's
      pipeline.
    disposition: >-
      Reported per specification.yaml `distinguishable_outcomes` (b) /
      `falsification_criterion` F3's own escape valve ("or the disagreement
      traces to a demonstrable units/definition mismatch"). This report
      does NOT unilaterally relabel a=1/8 from S3 to S1 (that is the
      Coordinator's call, and the literal frozen comparison IS S3 as sealed);
      it hands the Coordinator a diagnosed, fixable, and now well-supported
      explanation, together with the recommendation that a future versioned
      protocol_amendment to specification.yaml's own `definitions.STATIC(T)_r
      exact coverage` state the S_d + 4*W*h_d formula explicitly (removing
      the underspecification for any future blind rederivation), after
      which Stage A could be re-sealed under the corrected definition per
      `invalidation_rules` ("runs already executed are never re-scored" --
      a re-seal would be a new, additional artifact, not an edit of this one).

