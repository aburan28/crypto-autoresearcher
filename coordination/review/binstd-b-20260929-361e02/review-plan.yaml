    - joint: >-
        J2 -- The code, completeness and custody (C4, C7 for the numbered
        heuristics, C8; R-1, R-2 as code, R-5, R-6, R-7 code, R-8, R-10, the
        supersession form). The fixture, the histogram-preserving shuffle, the
        measured-null calibration, the replacement identity arm, the ordinary
        cells' order route, the PC-7 Z/lZ log-interval check, the PC-9
