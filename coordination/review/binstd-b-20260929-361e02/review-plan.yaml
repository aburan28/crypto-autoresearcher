        the N reading (l or #E) and the rounding rule for M stated.
      assigned_to: TASK-20260929-75e9e4
      attack_plan: >-
        (i) Recompute the Koblitz a = 0 orders for every declared ladder cell
        yourself and check admissibility. (ii) Recompute the S grid per (cell,
