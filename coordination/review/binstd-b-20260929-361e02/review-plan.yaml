  composition:
    who: >-
      The Coordinator, in TASK-20260929-bf8f6c, in a fresh session that did
      not run TASK-20260929-291567, did not compose DEC-20260928-9d9c47 or
      DEC-20260928-63addc, did not author DEC-20260929-01ea31 or either plan
      of this batch, and is not the lane-A composer. No reviewer votes on the
      whole contract.
    independence_check: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/binstd-b-20260929-361e02/review-plan.yaml --reports
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-361e02/reviews/TASK-20260929-75e9e4/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-361e02/reviews/TASK-20260929-7d8385/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-361e02/reviews/TASK-20260929-953377/,
      run by the top-level session and recorded in DEC-20260929-8c3cb2
      whatever it reports. The --blind-history check is uncheckable for this
      batch (no protected-digest file) and is recorded as such (PD-R4).
    custody_without_seal: >-
      No seal card. Before TASK-20260929-bf8f6c is launched, the top-level
      session computes sha256 of the six declared report files of this lane
      and pastes them into the launch prompt. The composer records them
      verbatim in its composition worksheet as its first act, before it reads
      any report. TASK-20260929-ee38f7 must reproduce the same six digests; a
      mismatch voids the composition.
    discharge_check: >-
      The composer reads the audit sheet's revision discharge table and checks
      that each of R-1 to R-12 of DEC-20260928-9d9c47, and each design
      condition C1 to C8 of DEC-20260928-63addc S2, maps to a named clause
      that the owning joint's report does not contradict. An item with no
      clause is a missing approval field for K-revise-defect.
    keys:
      K-approve: >-
        J1 to J4 hold; J5 agrees with the contract's frozen figures within the
        agreement tolerance; every PTM meets its failure signature; no
        tripwire fired; every revision requirement is discharged
        (discharge_check). DEC-20260929-8c3cb2 then approves EXP-BINSTD-6f1e66
        under the AGENTS.md standing user authorization and names as its
        first next action the opening of an execution batch whose first card
        advances the approval and status fields of the version-2 records and
        records version 1 as superseded. Approval asserts nothing about any
        curve's security, any filter's existence, or any k-list cost against
        rho.
      K-revise-defect: >-
        Any of J1 to J4 breaks, a field approval requires is missing, a
        revision requirement is undischarged, or TB-4 fired. Decision revise,
        each defect listed with its joint and breaking artifact, and a
        revision design card in a new batch as the first next action.
      K-indeterminate: >-
        J5 disagrees with the contract beyond the tolerance on any quantity,
        or reports a choice that changes one. Decision revise on C2 or C6,
        naming the quantity; neither implementation is preferred.
      K-impediment: >-
        Wagner 2002 or Fong-Hankerson-Lopez-Menezes is unreachable and the
        contract records the impediment, keeps every dependent statement
        marked, and forbids substitution; the group-law re-derivation of the
        halving criterion remains the accepted alternative. Not a defect by
        itself; approval is permitted if every other key of K-approve holds.
        Relaying the criterion through IDEA-20260922-1b16d7 is
        K-revise-defect.
      K-infra: >-
        A reviewer could not run a joint. That joint reads inconclusive. No
        approval while any joint is inconclusive. An infrastructure failure
        is never negative evidence about the contract's mathematics or any
        curve.
      any_tripwire: See tier.tripwires. The composer applies the tripwire's stated effect.
    selection_point_duties: >-
      The composing decision is a selection point of GOAL-ECDLP2M-001. Per
      DEC-20260928-9d9c47 NA-3 it reads DEC-20260928-cec92e (on main),
      DEC-20260929-01ea31 R-SELECTION and, if on origin/main at its launch,
      DEC-20260929-1f5fcb, DEC-20260925-41f6dc and DEC-20260925-a84b16, and
      records only the changes to the standing order, each with its reason and
      revisit. It performs the HOLD-X2 revisit of DEC-20260928-cec92e CH-4 if
      the lane-A composing decision is already on main. It re-ranks the
      EXP-QSP-70b731 custody successor without displacing its hold on slot 1
      unless a reason is recorded. It considers the two technique lessons of
      DEC-20260928-9d9c47 knowledge_promotion only once the revised instrument
      has run, not before.

