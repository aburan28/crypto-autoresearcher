  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20260929-7d8385
    objects:
      - id: PTM-A
        object: >-
          The composite-order n = 17 Koblitz cell (a = 0; order to be
          recomputed), fed to the contract's certificate function and to its
          Stage 1 gate at the declared S for its alphabet-548 and -956
          homomorphisms.
        known_truth: >-
          The capacity is not 2 bits there. The certificate function must
          return the full divisor set of the group order (every divisor,
          including 548 and 956; the largest divisor strictly below 239 is
          137), and the gate must read G = M on both homomorphisms at the
          declared S. A certificate returning 2 bits, or a gate reading the
          null, has proved too much. (Wording corrected from the version-1
          plan, whose clause "every divisor below the largest prime factor,
          including 548 and 956" was unsatisfiable; DEC-20260928-9d9c47
          PD-C1.)
      - id: PTM-B
        object: >-
          Z/2^n with h the low log2(M) bits, fed to the contract's certificate
          function and gate.
        known_truth: >-
          Every subgroup 2^k Z/2^n is an exact filter and h reads G = M
          exactly. A certificate finding no alphabet between 4 and the order,
          or a rule reporting the random-label null there, has proved too
          much.
      - id: PTM-C
        object: >-
          The relabelled Z/lZ control with the log-interval key, fed to the
          contract's Stage 2 rules and the PC-7 code across the declared M
          grid.
        known_truth: >-
          The key is an approximate filter with G about M/2 up to one carry. A
          rule that reads the null there cannot see approximate filters; the
          rule must read it as the far-end positive control on every declared
          M, net of the stated maximum bias.
      - id: PTM-D
        object: >-
          The repaired shuffle fed (a) an exact filter (a homomorphism onto a
          group of order M) and (b) a planted marginal-only filter (a
          weight-class or bucket-skew label whose marginal inflates max_c
          pi_c with no arithmetic propagation), on synthetic data of a declared
          cell's shape at the declared S (DEC-20260928-9d9c47 NA-1).
        known_truth: >-
          A null must destroy arithmetic and keep marginals: the exact filter
          collapses to within the null width under the shuffle, and the
          planted marginal-only reading is preserved within its own bootstrap
          width. A shuffle that preserves (a) or destroys (b) has proved too
          much (in version 1 the label permutation preserved both).
    failure_signature: >-
      A correct protocol keeps each known-false conclusion out of reach.
      PTM-A returns the full divisor set and reads G = M on both
      homomorphisms at the declared S. PTM-B returns the subgroup filters and
      reads G = M. PTM-C reads about M/2 on every declared M and is labelled a
      positive control. PTM-D collapses (a) and preserves (b).
    how_to_run_it: >-
      Review computations in your own script on toy or synthetic inputs. They
      mint no RUN-*, write no evidence record and never execute any
      EXP-BINSTD-6f1e66 driver as an experiment on a cell. Put every script,
      seed and output in computations.json. If a PTM would amount to a new
      experiment, record it not performed with the reason.

