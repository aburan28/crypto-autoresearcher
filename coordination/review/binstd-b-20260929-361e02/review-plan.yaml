        record as the reason; HEUR-B2's random-model justification records
        that Theorem A-prime bounds the averaged agreement and that the
        repaired bound reaches only M at most N^(1/4), and its consequent is
        quantitative (the c for which the tree at the exact capacity stays
        above matched rho); the with-orbit line's conditional_on adds
        KN-FIND-47da4e's exclusion; the stake stays a ceiling, the lead
        threshold is pre-registered and routed, the orbit-unknowns line is
        labelled per CORR-20260925-649e25, the resolving floor for approximate
        filters at the declared S is stated as an interpretation limit.
      assigned_to: TASK-20260929-7d8385
      attack_plan: >-
        (i) Construct, at toy size in your own script, a random-label null of
        a declared cell's shape at the declared S and M, and read the rules:
        does the null land in the null outcome, and does SR-4 clause 2 stay
        unsatisfied by occupancy along the ladder? (ii) Construct a filter
        with a planted true excess at the contract's stated resolving floor
        and check the rules can reach LEAD with it. (iii) Quote every stake,
        below-rho, break, lead or 13-bit sentence and classify it; an outcome
