  coordinator_prior:
    estimator_finite_sample_prior: >-
      Written first, as DEC-20260928-9d9c47 what_this_says_about_the_prior
      asks. Taking the version-1 red team's scale statement as my working
      model (null scale of the maximum-over-cells statistic about
      sqrt(M^3 / S) times a log factor), at S = 100 x M^2 the random label's
      excess G - 1 should sit at about sqrt(M)/10 times a log factor: roughly
      0.8 to 2 at M = 64, and about 2 to 7 at M = 548 and 956. I therefore
      expect: (a) exact controls (G = M) to separate from the measured null by
      one to two orders of magnitude at every declared (cell, M), so the gate
      reads; (b) the repaired shuffle to collapse an exact filter to within
      the null width with probability about 0.9 and to preserve a planted
      marginal-only filter within its own bootstrap width with probability
      about 0.8; (c) the LEAD threshold (three random-label bootstrap widths
      at M = N^(1/3)) to be reachable in principle but only by filters whose
      excess is several units at M = 64, so the instrument's resolving floor
      for approximate filters at the repriced S is coarse, and the design
      should state that floor as an interpretation limit; (d) a bootstrap of
      a maximum statistic to under-cover its own sampling distribution, so a
      width taken from 1000 resamples of the random-label arm is a biased
      null width unless the calibration draws independent random labels. A
      prior, not a result; each item is something the review can overturn.
    per_joint: >-
      J1 (Stage 0: certificate as code, ambients, ladder orders, repriced S
      grid, wording items) holds with probability about 0.7; if it breaks I
      expect it on the S grid's N reading (l against #E) or a ladder cell
      whose order is stated rather than recomputed. J2 (the code: fixture,
      shuffle, measured null, identity arm, ordinary-cell route, PC-7, PC-9,
      caching, R-10 repairs; completeness; custody) holds with probability
      about 0.5, the code being again where the round most likely breaks, on
      item (d) above or on the measured null being taken from the same
      resamples it then judges. J3 (the estimator's decision rules: null
      calibration, SR-4 reachability, the LEAD route, HEUR-B2 quantitative,
      labelling) holds with probability about 0.55. J4 (R2 boundaries,
      exclusions, PTM-A to PTM-D, over-scoped sentences) holds with
      probability about 0.75; if it breaks, on PTM-D. J5 (blind) agrees on the
      Koblitz orders and admissibility exactly with probability about 0.95 and
      on the S grid within tolerance with probability about 0.85, the gap
      being the N reading and the rounding rule.
    overall: >-
      Probability about 0.35 that the round composes to approve. The most
      likely outcome is revise on J2 or J3 (the estimator), each still a local
      remedy.
    where_i_think_it_breaks_if_it_breaks: J2 on the null calibration or the shuffle's gate check, then J3 on SR-4 reachability, then J1 on the S grid.
    what_would_overturn_this_prior_most: >-
      (1) The repaired shuffle failing to collapse an exact filter at the
      declared S, which would say histogram-preserving resampling is not a
      null for this statistic either. (2) The random-label null at the
      repriced S reading far below sqrt(M)/10, which would say the version-1
      scale statement was wrong and the resolving floor is finer than I
      expect. (3) Any party exhibiting an exact filter with alphabet strictly
      between 4 and l (TB-3).
    informed_prior_disclosure: >-
      The prior is informed, not blind (PD-R1). The session that wrote this
      plan read DEC-20260928-9d9c47 and DEC-20260928-cec92e in full and the
      version-1 specification's cells, ceiling-model and procedure blocks.

  # ---------------------------------------------------------------------------
  joints:
    - joint: >-
        J1 -- Stage 0, ambients, ladder and the repriced sample grid (C2, C3,
        C6; R-3 arithmetic, R-4, R-7 certificate readings, R-9, R-12). The
        contract commits the exact-capacity certificate as a divisor-set
