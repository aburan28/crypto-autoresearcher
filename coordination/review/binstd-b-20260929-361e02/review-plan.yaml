        DEC-20260929-8c3cb2; supersedes naming H-BINSTD-0126fe and
        EXP-BINSTD-de9678; the version-1 files unedited; zero runs.
      assigned_to: TASK-20260929-75e9e4
      attack_plan: >-
        (i) Extract every code block by the pinned method and check its
        reference sha256. (ii) Dry-call the shuffle on synthetic integer data:
        an exact mod-4 filter must collapse to within the stated null width
        and a planted marginal-only filter must keep its reading; a shuffle
