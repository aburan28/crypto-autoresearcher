        three version-2 files against TASK-20260929-36d781 and the three
        version-1 files against TASK-20260928-b933db at HEAD. Where I think it
        breaks: (ii) or (iii).
      breaking_artifact: >-
        A code block that does not reproduce its reference sha256; a shuffle
        that preserves an exact control or destroys a planted marginal-only
        filter; a null calibrated from the resamples it judges; an identity
        arm reading the null; an R-10 repair absent from code; a pass
        criterion not in the rules; a missing approval field; a non-null
        approved_by; a missing supersedes field; a version-1 file changed.
    - joint: >-
        J3 -- The estimator's decision rules and labelling (C1, C3, C5, C7;
        R-2 rules, R-11, the LEAD route). PC-2 and the family comparison are
        stated against the measured null distribution per (cell, M); SR-4 is
