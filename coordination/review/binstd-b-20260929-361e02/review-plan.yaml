        the tested N. (v) Check the orbit-unknowns and KN-FIND-47da4e
        conditionals. Where I think it breaks: (i).
      breaking_artifact: >-
        A null that lands outside the null outcome; an SR-4 clause satisfied
        by occupancy alone or unsatisfiable; a LEAD branch unreachable by a
        planted filter at the stated floor; a closed-form null allowance still
        governing a maximum statistic; an unfalsifiable HEUR-B2 consequent; a
        stake or lead sentence as an outcome; an unlabelled per-orbit line.
    - joint: >-
        J4 -- R2 boundaries, exclusions and the proves-too-much controls (C8).
        No k-tree run at deployed parameters; target-dependent filters out of
        family; levels above 1 excluded; d3c5a5's engine not used; d06324's
