review_plan:
  id: REVIEW-ICPERF-PRIME63-M2-POSTRUN-20261019
  goal_id: GOAL-ICPERF-e6b6a4
  experiment_id: EXP-ICPERF-515ae3
  run_id: RUN-ICPERF-eb0d88
  prior_plan_path: coordination/review/icperf-prime63-m2-20261019/review-plan.yaml
  round_scope: Independent custody and bounded invalid-output interpretation for the
    existing failed run; the original full-output review chain stays uncompleted.
  source_task_id: TASK-20261019-4af537
  snapshot_task_id: TASK-20261019-89053c
  validator_task_id: TASK-20261019-bb87e3
  red_team_task_id: TASK-20261019-02a5c2
  ledger_archive_task_id: TASK-20261019-6398fb
  written_by: coordinator
  written_at: '2026-10-19'
  written_before_any_reviewer_ran: true
  claim_under_review: The candidate custody package purports to preserve the historical
    failed run and absent supervisor outputs. The review independently checks raw
    inventory, exact witness equations, copy custody and censor interpretation. It
    makes no solver certificate, base ranking or total-cost claim.
  coordinator_prior: I expect the required outputs to remain absent and positive solver
    calls to remain censored. The Validator receives no expected inventory count or
    digest list; this prior is not independent validation.
  joints:
  - id: P1
    joint: An independently derived inventory of permitted original raw archive members
      has exact paths, sizes and SHA-256 values, with omitted or duplicate members
      identified without a producer inventory.
    assigned_to: TASK-20261019-bb87e3
    attack_plan: Enumerate the original raw tar directly, recompute its member path
      list, sizes and SHA-256 values, and independently map raw requests and traces;
      do not inspect the candidate bundle or diagnostic receipt.
    breaking_artifact: A named path or tar member with an independently calculated
      contradictory digest or count.
  - id: P2
    joint: The frozen plan requires two missing top-level outputs; public inputs specify
      exactly one monitor control and three positive requests; a satisfying witness
      refutes a contradictory no-solution assertion.
    assigned_to: TASK-20261019-bb87e3
    attack_plan: Read the plan and original public requests, derive required output
      names and schedule, then independently evaluate the archived witness over the
      exact field and signed group equations.
    breaking_artifact: A named required path, request, target, witness equation or
      accepted no-solution claim contradicted by direct calculation.
  - id: P3
    joint: The candidate manifest and bundle agree with all original run files, failed
      release, Git anchors and explicit absence statements; the later task does not
      claim authorship of earlier candidate bytes.
    assigned_to: TASK-20261019-02a5c2
    attack_plan: Recompute bundle and member digests against original paths and Git
      blobs, test absent paths, and compare commit chronology with the new handoff.
    breaking_artifact: A named copy, anchor, absence or chronology assertion contradicted
      by original bytes or reachable history.
  - id: P4
    joint: Monitor and three positive stops retain their raw censor classes, and missing
      end-to-end terms remain unmeasured.
    assigned_to: TASK-20261019-02a5c2
    attack_plan: Reconstruct terminal states, phase traces and sampled resource limits;
      inspect every comparative statement against cold and online cost ledgers with
      natural yield, rank, linear algebra, target work and matched rho null.
    breaking_artifact: A cell with contradictory raw stop classification or a quantitative
      comparison requiring an unmeasured term.
  blindness:
    mutual: true
    lifted_for: []
    rule: The Validator may check only existence of the exact two required run-root
      output paths while otherwise using its declared original raw archive and public
      inputs. It never reads the candidate bundle, custody manifest, adoption report,
      diagnostic receipt, producer checker, run report or peer report before sealing.
      The Red Team may examine candidate and originals but cannot read the Validator
      report before both seal.
  proves_too_much:
    objects:
    - id: missing_required_output
      known_false_conclusion: The historical run satisfied its frozen supervisor output
        contract.
      object: The frozen plan requires manifest.yaml and raw-result.json at the exact
        RUN-ICPERF-eb0d88 root; independently check both paths in the historical run
        directory.
      expected_failure_signature: Both frozen-plan required output paths are absent
        at the historical run root, so the conclusion that the output contract was
        satisfied is rejected.
    - id: contradictory_no_solution
      known_false_conclusion: A satisfying archived witness and certified no-solution
        assertion both hold for the same system.
      object: For the exact fixed random-m2 request in the original raw archive and
        its matching archived satisfying witness, independently construct or verify
        a certified_no_solution response; check that the assertion is contradicted
        by the witness.
      expected_failure_signature: Independent witness evaluation rejects certified_no_solution
        for the same random-m2 system; a bounded solver timeout stays censored.
    assigned_to: TASK-20261019-bb87e3
    failure_signature: Accepting either false conclusion invalidates the review procedure.
  blind_rederivation:
    required: true
    quantity: Original raw archive member identities and digests, fixed request identities,
      schedule, required output paths, and independently evaluated planted polynomial
      and signed point equalities; expected counts and digests are withheld. The two
      required run-root output existence checks are allowed and do not disclose producer
      interpretations.
    parameters: Prime p=9223372021248595841, subgroup r=9223372018953067627, B=475,
      m=2, frozen three-arm plan, public factor-base definitions, original requests
      and archived witness coordinates.
    blind_from:
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-5bfb57/reconciliation/RUN-ICPERF-eb0d88/custody.json
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-5bfb57/reconciliation/RUN-ICPERF-eb0d88/source-bundle.tar.gz
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-5bfb57/reconciliation/RUN-ICPERF-eb0d88/custody-adoption.json
    - experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/diagnostic/receipt.json
    - research/icperf_prime63_m2_diagnostic_integration_20261018/check.py
    - experiments/EXP-ICPERF-515ae3/reports/run-20261019T2113Z/report.md
    assigned_to: TASK-20261019-bb87e3
  seal_then_compare: A reviewer is sealed only after its write-once report and attestation
    have a matching completed release. Seal both before the Coordinator reads them
    side by side, compares blind values with candidate custody, or composes joint
    verdicts. Later clarification is a procedure deviation.
  procedure_deviations: []
  inference_boundary: Passing this round can establish custody and bounded invalid-output
    interpretation only. It cannot validate the historical supervisor output contract,
    turn a censor into a certificate, rank bases, or measure natural yield, useful
    rank, total IC cost or a matched-rho gap.
