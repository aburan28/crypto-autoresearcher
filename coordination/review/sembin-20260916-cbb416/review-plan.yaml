# =============================================================================
# REVIEW-SEMBIN-20260916-cbb416 -- the review plan for BATCH-cbb416's execution
# of EXP-SEMBIN-4fa22c.
#
# Written 2026-09-16 by the coordinator, WHEN THE BATCH WAS OPENED and therefore
# before the executor was dispatched, let alone before any reviewer ran. Written
# now rather than later for the reason AGENTS.md gives: "three reviewers
# concurred" and "three reviewers concurred with what the Coordinator already
# believed" are different findings, and only a prior recorded in advance
# separates them.
#
# It can be written this early because its joints are the CONTRACT's load-bearing
# steps, not the run's outputs. What the run measures is unknown; what it must
# get right to have measured anything is fully determined by
# experiments/EXP-SEMBIN-4fa22c/specification.yaml.
# =============================================================================

review_plan:
  id: REVIEW-SEMBIN-20260916-cbb416
  batch_id: BATCH-cbb416
  goal_id: GOAL-SEMBIN-fcb7a2
  experiment_id: EXP-SEMBIN-4fa22c
  hypothesis_id: H-SEMBIN-a7e721
  written_by: coordinator
  written_at: '2026-09-16'
  written_before_any_reviewer_ran: true
  opens_a_claim_changing_round: true
  what_could_move: >-
    H-SEMBIN-a7e721 from `approved` toward `analyzed` and then one of supported / weakened /
    rejected / inconclusive, and EXP-SEMBIN-4fa22c from `running` to `completed` / `invalid` /
    `failed_infrastructure`. NOTHING in this round can move a claim about Proposition 5 itself; see
    `the_ceiling_on_this_round`.

  the_ceiling_on_this_round: >-
    DC-1 of DEC-20260916-88ac73, restated here because it bounds what any reviewer may certify: the
    instrument is structurally unable to exhibit d_F > 4, because degree drops produced purely by
    X^2 -> X count toward d_F and are invisible to d'_F. A reviewer therefore may not certify a
    refutation of Proposition 5 no matter what the run measured, and a report phrased as one is a
    finding AGAINST the run (S-1 FAIL) rather than a result. Separately: a claim presented as
    contradicting Proposition 5 would require `review-breakthrough` at max, which is undegradable
    and CANNOT BE SERVED in this environment -- such a claim stays un-promoted while the campaign
    stays active.

  # ---------------------------------------------------------------------------
  coordinator_prior:
    recorded_before_any_report_returned: true
    on_the_measurement: >-
      The Coordinator expects d'_F > 4 at the shifted instances for the n it reaches, because the
      hypothesis was authored on that reasoning -- and expects that expectation to be the weakest
      part of this round, since it is exactly the prior that makes an agreeing review uninformative.
    on_what_will_actually_break: >-
      The Coordinator expects the trivial-Koszul exclusion (M-2, declared_conventions) to be where
      the instrument is wrong or under-specified, not the rank computation. The contract declares an
      exclusion of "falls whose combination lies in the module generated by the trivial Koszul
      syzygies", and computing that module's rank contribution correctly at each degree is the
      subtlest step in the whole design. If M-1 comes back equal to M-2, the instrument measured the
      ceiling and nothing else.
    on_the_nulls: >-
      The Coordinator expects A-NULL-RANDOM to separate from the target and A-NULL-SHUFFLED NOT to,
      or to separate only weakly -- because the shuffled null preserves the exact monomial multiset,
      which is most of what a Macaulay rank at low degree sees. If that is what happens, S-6 makes
      the null failure the run's headline and no d'_F value is evidence about Nagao. THE COORDINATOR
      EXPECTS THIS OUTCOME IS AS LIKELY AS THE HEADLINE ONE, and says so here so that reporting it
      is not read as a disappointment.
    on_the_series: >-
      The Coordinator expects censoring (SR-1) at or before n = 10, so the monotonicity control C-5
      probably rests on three or four points rather than six. Three consecutive n is the declared
      minimum; two would not support P-3 at all.
    what_would_overturn_this_prior_and_be_more_informative: >-
      A clean separation of the target from BOTH nulls together with M-1 strictly below M-2 at three
      or more consecutive n. That would make the measurement mean what the hypothesis wants, and the
      Coordinator does not expect it.

  # ---------------------------------------------------------------------------
  joints:
    - id: J1
      name: THE INSTANCE IS THE ONE THE CONTRACT NAMES
      owner: TASK-20260916-90af14
      what_is_load_bearing: >-
        That the measured systems are the coset-shifted EQS4 degree-3 reduced descents of the third
        summation polynomial over F_{2^n} for a non-Koblitz curve, with non-zero recorded shifts --
        DC-3 and DC-4. If the shifts are zero or absent the run measured EQS2 and says nothing about
        Proposition 5's EQS4 claim; if the generators are not the reduced multilinear descents the
        declared representative is not the one computed.
      worked_attack_plan: >-
        Recompute the descent independently for the smallest n from the paper's definitions, not
        from the executor's code, and compare the canonical serialisation hash (M-4). Check every
        recorded v_i is non-zero as a field element in the recorded basis of V, and that
        A-UNSHIFTED differs from A-SHIFTED in EXACTLY those elements and nothing else -- diff the
        two generator sets, do not take the code path's word for it. Verify the curve is not a
        Koblitz curve.
      where_the_coordinator_thinks_it_breaks: >-
        In the matched pair. "Everything else byte-identical" is easy to claim and easy to violate
        through a re-seeded basis of V or a re-derived summation polynomial; if the two arms differ
        in more than the shifts, C-1 detects nothing and the mechanism test of P-2 is void.
    - id: J2
      name: THE INSTRUMENT COMPUTES d'_F AND NOT SOMETHING NEAR IT
      owner: TASK-20260916-90af14
      what_is_load_bearing: >-
        The equality-form convention on condition (1), the trivial-Koszul exclusion, the
        field-equation placement (C-6), and the order-independence (C-4). Each of these can be
        implemented in a way that silently computes a different integer.
      worked_attack_plan: >-
        Run C-3's known-answer fixture yourself: f1 = X1X2 + X3, f2 = X1 + X2 must give fake
        quantity 2, and the same pair with the field equations OUTSIDE must give true first fall 3
        (already verified by hand at
        coordination/review/sembin-20260916-propquant/coordinator-recheck.py -- re-run it, do not
        cite it). Plant a fall at a known degree and confirm the instrument finds it at that degree
        and not one above. Then check the trivial-Koszul exclusion by adding a pair of generators
        whose only fall is the Koszul syzygy f_j f_k + f_k f_j and confirming M-1 does NOT move while
        M-2 does.
      where_the_coordinator_thinks_it_breaks: >-
        The Koszul exclusion, as stated in the prior. Second most likely: an off-by-one in "all
        products at the same degree d", which is what distinguishes a first fall from any degree
        drop and is the whole content of the equality form.
    - id: J3
      name: THE NULLS DISCRIMINATE, AND WERE NOT RE-ROLLED UNTIL THEY DID
      owner: TASK-20260916-7be96a
      what_is_load_bearing: >-
        C-2, S-6 and the inventor protocol's controls-before-belief. A reported separation between
        target and null is the only thing that makes a d'_F value a statement about the summation
        polynomial rather than about degree-3 Boolean systems of that shape.
      worked_attack_plan: >-
        Check every seed is recorded and that the ten draws per arm are ten DISTINCT draws, not one
        draw reported ten times. Regenerate at least two draws from their recorded seeds and confirm
        they reproduce. Confirm A-NULL-SHUFFLED preserves the exact global monomial multiset of
        A-SHIFTED -- count the multiset, do not trust the label. Check the run did not exceed
        maximum_runs 4, which is the contract's guard against re-rolling nulls until they cooperate;
        a fifth pass over the n-series voids C-2 entirely.
      where_the_coordinator_thinks_it_breaks: >-
        Not in the seeds. In the REPORTING ORDER: S-6 requires the nulls be reported before any
        target value is interpreted, and a report that presents the headline first and the nulls as
        a later section has already spent the control even if the numbers are right.
    - id: J4
      name: CENSORING, MONOTONICITY AND COST ARE NOT QUIETLY CONVERTED INTO RESULTS
      owner: TASK-20260916-7be96a
      what_is_load_bearing: >-
        SR-1's censored observation, SR-5's failed_infrastructure, C-5's series, and M-5's poll-
        interval floor. Every one of these is a place where an absence can be written up as a fact.
      worked_attack_plan: >-
        For every arm that did not find a fall, confirm the record says `> d_max_reached` and NOT
        "no fall" -- and confirm no downstream statement in the report treats a censored arm as a
        measured value. Confirm any watchdog kill is `failed_infrastructure` and is not cited as
        evidence about Nagao. Read the recorded poll interval and check that no reported wall RATIO
        involves two measurements that both finish inside it (CORR-20260916-33068f measured a 51x
        inflation from exactly that defect). Check C-5's series is reported as a series a reader can
        see, not as an assertion that monotonicity held.
      where_the_coordinator_thinks_it_breaks: >-
        A non-monotone series being explained rather than reported. F-4 makes non-monotonicity an
        INSTRUMENT signal first; a report that rationalises it as a fact about the systems has
        inverted the contract.
    - id: J5
      name: THE RUN'S OWN BLINDNESS IS STATED, NOT IMPLIED
      owner: TASK-20260916-90af14
      what_is_load_bearing: >-
        S-1 and S-5. The contract makes "this instrument cannot refute Proposition 5" a success
        criterion precisely because the natural writeup of this experiment has a refutation as its
        headline and that headline is unreachable by construction.
      worked_attack_plan: >-
        Find the sentence. It must say that a measured d'_F > 4 is CONSISTENT with d_F <= 4 because
        Lemma 4 runs d_F <= d'_F, and that the instrument is blind to the X^2 -> X falls. Then check
        S-5: for every measured value, BOTH consequences stated -- what it means for the
        justification and what it means (nothing, in the refuting direction) for the proposition.
        A confirmation direction must additionally carry its dependence on Lemma 4's inside form,
        which is unproven and whose literal form is verified FALSE.
      where_the_coordinator_thinks_it_breaks: >-
        Nowhere, if the executor read its contract; this is the cheapest joint. It is owned anyway
        because it is the one failure that would make every other joint's PASS worthless.

  # ---------------------------------------------------------------------------
  blind_rederivation:
    required: true
    owner: TASK-20260916-7be96a
    quantity: >-
      d'_F for the A-SHIFTED arm at the smallest n the run completed, plus M-2 at the same instance.
    blind_from:
      - experiments/EXP-SEMBIN-4fa22c/code/
      - experiments/EXP-SEMBIN-4fa22c/runs/
      - coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-cbb416/archives/
      - coordination/review/sembin-20260916-cbb416/TASK-20260916-90af14/
    blind_from_note: >-
      THE VALUE DOES NOT EXIST YET, which is the one advantage of writing this plan before the run.
      It cannot be pre-leaked into a contract or a source record the way ICPERF's gb_size = 43 was
      (CORR-20260916-292e53), because nobody knows it. THE OBLIGATION THAT FOLLOWS: no card, batch
      note, bus message or opening report in this campaign may ever quote a measured d'_F value.
      Cite the run record; a pointer costs nothing and does not leak. And before this task is
      dispatched, the Coordinator RE-GREPS for the value over the tree as it then stands, including
      any document written as part of the dispatch itself -- which is the specific step whose
      omission caused CORR-20260916-292e53.
    procedure: >-
      Pre-register first, exactly as CORR-20260916-292e53's forward guidance requires: derive both
      integers from the contract's definitions and the instance description alone, write them with
      your method, exact command and input hash to
      coordination/review/sembin-20260916-cbb416/TASK-20260916-7be96a/PREREGISTERED-VALUES.json
      (write-once, no edits, append a second file to correct), and only then read anything else.
    why_not_replication: >-
      Recomputing from the producer's own code reproduces a wrong-but-self-consistent implementation
      faithfully, which is the failure validation cannot see. Agreement between two independent
      implementations is evidence about the quantity; disagreement localises to one of two named
      implementations.

  proves_too_much:
    required: true
    owner: TASK-20260916-90af14
    object: >-
      A degree-3 Boolean system with a PLANTED fall at degree 3, and separately a system whose only
      fall is a trivial Koszul syzygy.
    what_must_not_happen: >-
      The argument "no non-trivial fall at or below 4, therefore the borrowed estimate cannot carry
      Proposition 5's bound" must NOT go through for the planted object -- the instrument must find
      the planted fall at 3. And it must NOT report a fall for the Koszul-only object, because that
      fall is present in every system and carries no information about this one. An instrument that
      passes the first test and fails the second is measuring the ceiling.

  blindness:
    within_this_round: >-
      The two reviewers may not read each other's reports. Each attests to what it read and records
      a `did_not_read` list naming the sibling's directory.
    lifted_for: []
    lifted_rationale: null

  composition:
    by: coordinator
    rule: >-
      Each reviewer reports on ITS OWN joints and returns no whole-claim verdict: a reviewer blinded
      from its sibling cannot see the other joints by construction, so a whole-claim verdict from
      one would be an opinion formed from a fraction of the evidence. The Coordinator composes, and
      the composition names every joint, its owner, its verdict and the evidence.
    what_a_break_on_each_joint_costs:
      J1: >-
        The run measured something other than EQS4. The measurement is not void -- it is a
        measurement of whatever it measured -- but it is not evidence about Proposition 5's
        justification and is relabelled rather than reinterpreted.
      J2: >-
        Instrument failure (F-4). No d'_F value from the run may be cited, and the repair is a
        successor contract, not an amendment to this one.
      J3: >-
        F-3. The data is kept, the null failure is the headline, and no value is offered as evidence
        about Nagao (SR-4, S-6).
      J4: >-
        A reporting defect that is correctable by a superseding report if the underlying rows are
        intact, and an evidence-integrity failure if they are not.
      J5: >-
        S-1 FAIL. The run's own report overclaims, and the correction supersedes the report before
        any evidence record is written.

  procedure_deviations: []
  procedure_deviations_note: >-
    Departures from this plan are recorded here rather than quietly absorbed. Acting before a report
    returns, reassigning a joint mid-round, or dropping a control may each be right in the moment;
    none is self-documenting, and a protocol that is silently deviated from is worth less than one
    never declared, because it still reads as rigorous.

  inference:
    model_note: >-
      Both reviewer cards set `fallback_allowed: true` with a stated reason, declared here before
      the round rather than amended after it. This checkout has no API credentials for any adapter
      backend, so the runtime-native binding permitted by core rule 16 is the only route and
      `false` would be a claim every dispatch breaks (DEC-20260916-7b2235, DEC-20260916-bec4b8).
      `resolved_model_id` is whatever each reviewer session self-reports and `model_verified` stays
      false absent a probe; both are recorded in each attestation with `fallback_used` and its
      reason. An unverified identifier is unverified configuration, never an established fact about
      which model reviewed.
    policy: review-adversarial
    reasoning_effort: xhigh
    independent_session_required: true
