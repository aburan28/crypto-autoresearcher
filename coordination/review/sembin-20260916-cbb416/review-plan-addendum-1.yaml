# =============================================================================
# REVIEW-SEMBIN-20260916-cbb416-ADD1 -- additive companion to review-plan.yaml.
#
# The parent plan is committed and hash-bound at d38386a31 (TASK-20260916-007117)
# and is not edited. tools/check_review_independence.py composes a plan with the
# addenda beside it, ordered by written_at, and an addendum may add joints,
# reassign a joint's owner, or add proves-too-much objects -- nothing else. This
# one reassigns two joints. It removes nothing and weakens no control.
# =============================================================================
review_plan_addendum:
  id: REVIEW-SEMBIN-20260916-cbb416-ADD1
  extends: review-plan.yaml
  addendum_to: REVIEW-SEMBIN-20260916-cbb416
  goal_id: GOAL-SEMBIN-fcb7a2
  batch_id: BATCH-cbb416
  written_by: coordinator
  written_at: '2026-09-16T11:05:00Z'
  written_before_any_reviewer_ran: true
  written_before_any_reviewer_ran_evidence: >-
    Neither producer has returned: TASK-20260916-fc72a6 holds the only claim under
    coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-cbb416/claims/ and
    TASK-20260916-0c2802 is `blocked` on a Coordinator ruling that does not exist yet. No
    reviewer has been dispatched and no directory other than this plan's exists under
    coordination/review/sembin-20260916-cbb416/.

  why_this_addendum_exists: >-
    The parent plan gave TASK-20260916-7be96a both J3/J4 and the blind re-derivation. J3 and
    J4 (distinct seeded null draws, the shuffled null's monomial multiset, maximum_runs,
    censoring, watchdog kills, the poll interval, the C-5 series) cannot be checked without
    opening experiments/EXP-SEMBIN-4fa22c/runs/, which is in the blind re-derivation's
    `blind_from`. tools/check_review_independence.py reports ANY attested `sources_read` under
    `blind_from` as a failed re-derivation and has no after-pre-registration exception, so an
    honest reviewer holding both assignments could not pass the completion gate on its own
    card -- the only way to turn the check green would have been to omit a read from
    `sources_read`, which is the fabrication the checker exists to catch. ICPERF's
    BATCH-a33cda avoided this by giving its re-deriver (TASK-20260915-abf147) nothing but the
    upstream instance and assigning every run-reading joint elsewhere. This round now has the
    same shape.

  what_changes:
    owners:
      J3: TASK-20260916-90af14
      J4: TASK-20260916-90af14
    owners_after:
      TASK-20260916-90af14: [J1, J2, J3, J4, J5, proves_too_much]
      TASK-20260916-7be96a: [blind_rederivation]
    note: >-
      The joints' statements, worked attack plans and `where_the_coordinator_thinks_it_breaks`
      are unchanged; only the owner moves. TASK-20260916-90af14 already reads the whole
      experiment tree for J1, J2 and J5, so J3 and J4 cost it no new exposure. The Coordinator's
      priors on J3 and J4, recorded in the parent plan before this addendum, stand as recorded.

  what_is_unchanged:
    blind_rederivation: >-
      Owner TASK-20260916-7be96a, quantity, `blind_from`, and the pre-registration procedure
      and path (coordination/review/sembin-20260916-cbb416/TASK-20260916-7be96a/
      PREREGISTERED-VALUES.json, write-once) are exactly as the parent plan states. What changes
      is only that its owner now holds NOTHING ELSE, so its read scope can be disjoint from
      `blind_from` at every moment rather than only before pre-registration.
    proves_too_much: Owner TASK-20260916-90af14, objects and what_must_not_happen unchanged.
    blindness: >-
      Unchanged and NOT lifted. The two reviewers still may not read each other's directories.
      Both may read this addendum: it is the Coordinator's instruction to them, not a sibling's
      finding, and it quotes no measured value.
    coordinator_prior: Unchanged; nothing here was written after a report returned.

  how_the_blind_re_deriver_learns_the_instance:
    problem: >-
      The contract records the curve, the basis of V and every coset shift v_i in the run's
      inputs block -- under experiments/EXP-SEMBIN-4fa22c/runs/, which is in `blind_from`. A
      re-deriver that may not open the run still has to know which system to derive.
    resolution: >-
      Before TASK-20260916-7be96a is dispatched, the Coordinator copies the instance description
      from the run's recorded inputs block to
      coordination/review/sembin-20260916-cbb416/blind-instance.yaml -- the smallest completed n,
      the curve's defining polynomial and coefficients, the basis of V, every v_i as a field
      element in that basis, and nothing else -- and re-greps that file and the tree for any
      d'_F, M-1 or M-2 figure, as the parent plan's `blind_from_note` already requires of the
      dispatch. That file is the ONLY thing about the run the re-deriver is told, and it is
      declared in TASK-20260916-6a2fcf's artifact_paths so the closing ledger archive hash-binds
      the bytes the re-deriver was handed.
    must_not_contain: >-
      Any measured value, any rank series row, any censoring flag, any wall figure, any
      verdict. A field element is an input; an integer degree is a result.

  procedure_deviations: []
  procedure_deviations_note: >-
    This addendum is not a deviation: it was written before the round ran and is the declared
    mechanism for reassigning a joint. A departure from the plan AS COMPOSED with this addendum
    is recorded in the parent plan's `procedure_deviations` at composition.
