# =============================================================================
# REVIEW-SEMBIN-20260916-cbb416-ADD2 -- additive companion to review-plan.yaml.
#
# The parent plan is committed and hash-bound at d38386a31 (TASK-20260916-007117)
# and is not edited; neither is ADD1, which is another session's and is already
# committed. tools/check_review_independence.py composes a plan with the addenda
# beside it, ordered by written_at.
#
# ADD1 reassigned J3 and J4. THIS ONE TOUCHES NO OWNER AND NO JOINT. It extends
# `blind_from` over material that did not exist when the parent plan was written.
#
# IT QUOTES NO MEASURED VALUE, and that is the whole point of it: the last blind
# assignment in this repository was leaked by the very document written to protect
# it (CORR-20260916-292e53), so what follows names PATHS and never numbers.
# =============================================================================
review_plan_addendum:
  id: REVIEW-SEMBIN-20260916-cbb416-ADD2
  extends: review-plan.yaml
  composes_with: REVIEW-SEMBIN-20260916-cbb416-ADD1
  addendum_to: REVIEW-SEMBIN-20260916-cbb416
  goal_id: GOAL-SEMBIN-fcb7a2
  batch_id: BATCH-cbb416
  written_by: coordinator
  written_at: '2026-09-16T11:45:00Z'
  decision_id: DEC-20260916-b0e654
  written_before_any_reviewer_ran: true
  written_before_any_reviewer_ran_evidence: >-
    No directory exists under coordination/review/sembin-20260916-cbb416/ other than this plan and
    its two addenda. TASK-20260916-0c2802 -- the execution both reviewers depend on -- is still
    `blocked`, and no reviewer has been dispatched or claimed.

  why_this_addendum_exists: >-
    The parent plan's `blind_from` lists the producer's code, the producer's runs, this batch's
    archives and the sibling reviewer's directory. The collision audit did not exist when that list
    was written. It now does, and it contains one thing the list should have covered: a DELIBERATELY
    DISCLOSED scoped relation between prior unshifted measurements and this contract's threshold,
    recorded in verdict.json under `values_disclosed_deliberately`, naming the paths that hold the
    prior integers. The audit was right to disclose it -- withholding it would have understated its
    own answer to Q5 in the direction that keeps the run alive -- and it is exactly the kind of
    thing a blind re-deriver must not read.

  what_changes:
    blind_from_additions:
      - coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-cbb416/collision-audit/
      - experiments/EXP-DREG-001/runs/
      - experiments/EXP-SIG-007/src/ic_first_fall_fast.py
      - experiments/EXP-DREG-001/DREG_dff.sage
    what_each_addition_is_for:
      collision_audit: >-
        Holds the disclosed relation and the pointers to the prior integers. Nothing in it is needed
        to derive d'_F from the contract's definitions.
      EXP_DREG_001_runs: >-
        The path the disclosure names as holding the prior fall-degree integers for a nearby
        unshifted object. Reading them before pre-registration would make the re-derivation informed
        rather than independent, even though they concern a different arm under a different fall
        criterion.
      the_two_prior_instruments: >-
        The two implementations whose fall criterion differs from this contract's. A re-deriver who
        reads them is liable to re-derive THEIR quantity, which is the failure mode a blind
        re-derivation exists to detect in the producer.
    owners: unchanged
    joints: unchanged
    quantity: unchanged
    procedure: unchanged
    proves_too_much: unchanged

  effect_on_each_reviewer:
    TASK-20260916-7be96a: >-
      Its read scope, as ADD1 left it, already excludes every path added here -- it lists only the
      plan, the addenda, blind-instance.yaml, the contract, the hypothesis, the Nagao text and the
      record templates. So this addendum adds no restriction it was not already observing; it makes
      the exclusion CHECKABLE by tools/check_review_independence.py rather than merely true, and it
      binds the sibling too.
    TASK-20260916-90af14: >-
      UNAFFECTED, and deliberately so. It owns J1-J5 and needs the audit for exactly what A-3 of
      AMD-EXP-SEMBIN-4fa22c-20260916-collision asks of the run: whether the unshifted arm's
      comparison against the prior EQS2 records is honest about the four differences. `blind_from`
      constrains the blind re-derivation, never the round.

  what_this_addendum_does_not_do:
    - >-
      It does not restate the disclosed relation, the prior integers, or any measured degree. It
      names paths. A reader who wants the numbers reads the paths and thereby records the read.
    - >-
      It does not reassign a joint, remove a joint, weaken a control, or change what the round can
      conclude.
    - >-
      It does not criticise the audit's disclosure. The disclosure was correct and its absence would
      have been a research-direction integrity risk; this addendum is the containment the disclosure
      deserved.
    - >-
      It does not change the standing campaign obligation, which is unchanged and absolute: no card,
      plan, addendum, batch note, bus message or report may quote a measured d'_F or M-2.
