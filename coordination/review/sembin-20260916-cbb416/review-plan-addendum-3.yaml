    lifted_for: []
    lifted_note: Nothing is lifted. Addenda 1 and 2 stand exactly as written.
    protected_from_the_producer:
      - path: coordination/review/sembin-20260916-cbb416/review-plan-addendum-3.yaml
        protected_from: TASK-20260916-0c2802
        why: >-
          This file states the expected value of the quantity that task is measuring. It is
          outside that task's declared read_scope and the task was not told. If its report
          shows knowledge of 4 as an EXPECTATION rather than deriving it, that is a leak to
          investigate.

  what_changes:
    owners: {}
    owners_note: No joint changes owner. Addendum 1's J3/J4 reassignment stands.
    blind_from_additions:
      - coordination/review/sembin-20260916-cbb416/review-plan-addendum-3.yaml
    what_each_addition_is_for:
      review_plan_addendum_3: >-
        The blind re-deriver (TASK-20260916-7be96a) must not read a Coordinator prior that
        states the value it is re-deriving. Same protection addendum 2 gave it over the
        collision audit's disclosed integers, applied to a number that did not exist when
        addendum 2 was written.
    enforcement_status: >-
      DECLARED AND, AS OF THIS WRITING, NOT MECHANICALLY ENFORCED. compose_plan() in
      tools/check_review_independence.py acts on `joints_added`, `what_changes.owners` and
      `proves_too_much_objects_added` only; `blind_from_additions` is an unknown key and the
      composer's documented policy is to leave unknown keys alone. So addendum 2's additions
      are declarative too. This is recorded here rather than quietly relied upon, and the
      tooling gap is being fixed separately -- a widening of blind_from can only strengthen a
      review, so honouring it does not let an addendum weaken a control.

  # -------------------------------------------------------------------------
  # 5. SECOND-ORDER FINDINGS -- recorded, not acted on here
  # -------------------------------------------------------------------------
  carried_findings:
    - finding: >-
        The statement-versus-argument split that CORR-20260916-96f47d identified in Nagao is
        INHERITED FROM SEMAEV, not invented by Nagao. Semaev states the Petit-Quisquater
        first-fall-degree definition on the polynomial system with plain total degree -- the
        TRUE degree -- and then argues in the Boolean/ANF degree, introducing notation to do
        it. So the "4" is a fake-degree bound obtained under a statement of the true
        definition.
      bears_on: CORR-20260916-96f47d, independently and from the upstream paper
      owned_by_lane: BATCH-e0a0c1
      not_acted_on_here: >-
        That lane's composition (TASK-20260916-a8e5b5) rules on it, and the sibling read
        TASK-20260916-9da6e0 owns the Nagao side.
    - finding: >-
        Nagao's one-line justification cites a witness, x u * S_3(x, u, R_X), that Semaev
        EXPLICITLY EXCLUDES and that produces NO FALL: naive bound 4, product ANF degree
        exactly 4, checked exactly over F_2 at n = 7 and n = 9, with three nearby multipliers
        also failing.
      bears_on: the justification of d'_F <= 4 as cited, not the bound itself
      owned_by_lane: BATCH-e0a0c1
    - finding: >-
        J-5 control A FAILED. Applied at k > ceil(n/m) -- the regime Semaev himself reports
        his conclusion false in -- the cost derivation runs, notices nothing, and returns a
        STRICTLY BETTER bound: at n = 300 the paper's own k loses to Pollard while a free k
        beats it by 2^18.25. The paper optimises over m with k pinned, and its own cost model
        prefers to cross the one hypothesis confining it.
      bears_on: >-
        GOAL-ICPERF-e6b6a4's cost models, which take index-calculus cost estimates from this
        literature. A cost model that improves when its own stated validity hypothesis is
        violated is a cost model whose confinement is doing the work.
      owned_by_lane: BATCH-e0a0c1
      not_acted_on_here: true

  # -------------------------------------------------------------------------
  # 6. PROCEDURE DEVIATIONS, DECLARED
  # -------------------------------------------------------------------------
  procedure_deviations:
    - deviation: >-
        This addendum cites four artifacts uncommitted at the commit introducing it, because
        their owning snapshot archive (TASK-20260916-92128f) is gated on a sibling read still
        running.
      why_accepted: >-
        The prior's entire value is that it precedes the measurement. Waiting for the sibling
        read would have made it post-hoc.
      remedy: >-
        TASK-20260916-92128f commits the reader package. Until then this addendum is a
        declared expectation and not citable evidence.
    - deviation: >-
        A prior is being added after the round's plan was frozen and after two earlier
        addenda, in response to a task in a DIFFERENT lane.
      why_accepted: >-
        The plan is committed and bound, so a change travels as an addendum beside it rather
        than an edit -- as addenda 1 and 2 already did. No reviewer in this round has run, so
        "before any reviewer runs" still holds.
      remedy: none needed; recorded for the composition to read.
