# =============================================================================
# Additive addendum 3 to REVIEW-SEMBIN-20260916-cbb416.
#
# WHAT THIS IS: the Coordinator's PRE-MEASUREMENT PRIOR for EXP-SEMBIN-4fa22c's
# shifted arm, and it reverses the direction the campaign has been predicting.
#
# WHY IT IS URGENT. AGENTS.md "Review architecture" requires the Coordinator to
# record its prior BEFORE any reviewer runs, because "reviewers concurred" and
# "reviewers concurred with what the Coordinator already believed" are different
# findings and only a pre-recorded prior separates them. That obligation binds
# harder here than usual: the prior below is a sharp numeric prediction about a
# measurement that IS CURRENTLY BEING TAKEN by TASK-20260916-0c2802, and a
# prediction recorded after the number arrives is not a prediction.
#
# THE PRE-REGISTRATION IS MACHINE-CHECKABLE, NOT ASSERTED, AND IT IS NARROWER
# THAN THE FIRST DRAFT OF THIS FILE CLAIMED. At the commit that introduces this
# file, `experiments/EXP-SEMBIN-4fa22c/runs/` DOES NOT EXIST -- not in the
# committed tree and not on disk -- so no run directory, no manifest and no
# measured value exists anywhere. Verify with
# `git ls-tree -r <commit> -- experiments/EXP-SEMBIN-4fa22c`.
#
# What is NOT claimed: `experiments/EXP-SEMBIN-4fa22c/code/` DOES exist on disk,
# untracked, holding 7 implementation modules. The executor began implementing
# between this file being drafted and being committed, and an earlier draft of
# this header asserted that directory was absent. It was true when written and
# false ten minutes later, so it is corrected here rather than committed as
# written -- an overstated pre-registration claim is worse than a narrow one,
# because the narrow one is the one that is true.
#
# The prior therefore precedes the MEASUREMENT, which is what matters, and does
# not precede the implementation, which does not.
#
# WHAT IT DOES NOT DO: it does not amend the frozen contract, does not move any
# hypothesis status, does not reassign any joint, does not lift any blindness,
# and DOES NOT REACH THE RUNNING EXECUTOR. The executor's declared read scope
# excludes this directory and it was deliberately not told, because telling a
# measurer the expected answer destroys the measurement. Nothing here relaxes
# AMD-EXP-SEMBIN-4fa22c-20260916-collision or addenda 1 and 2.
#
# STRUCTURE NOTE, because it nearly went wrong: everything below is nested under
# `review_plan_addendum:` because tools/check_review_independence.py finds an
# addendum only by that key (`_addendum_of`). A flat file with a top-level
# `extends:` parses fine, validates fine, and IS SILENTLY IGNORED by the
# composer -- the worst of the three outcomes, since it reads as a protection
# that is not in force. The first draft of this file had exactly that shape.
# =============================================================================

review_plan_addendum:
  id: REVIEW-SEMBIN-20260916-cbb416-ADD3
  extends: review-plan.yaml
  composes_with: REVIEW-SEMBIN-20260916-cbb416-ADD1, REVIEW-SEMBIN-20260916-cbb416-ADD2
  addendum_to: REVIEW-SEMBIN-20260916-cbb416
  goal_id: GOAL-SEMBIN-fcb7a2
  batch_id: BATCH-cbb416
  written_by: coordinator
  written_at: '2026-09-16T12:05:00Z'
  authored_under_task: TASK-20260916-1bb446
  archived_by: TASK-20260916-d5e431
  supersedes: null
  supersedes_note: >-
    Additive only. Addendum 1 reassigned J3/J4 to the instrument reviewer and addendum 2
    extended blind_from over the collision audit; this one adds a prior and changes
    neither.

  written_before_any_reviewer_ran: true
  written_before_any_reviewer_ran_evidence: >-
    Both reviewer tasks (TASK-20260916-90af14, TASK-20260916-7be96a) are `queued` and
    blocked on TASK-20260916-0c2802 and TASK-20260916-8eb394; neither has been dispatched
    or claimed, and no reviewer directory exists under
    coordination/review/sembin-20260916-cbb416/.
  written_before_the_measurement: true
  written_before_the_measurement_evidence: >-
    At the commit introducing this file, experiments/EXP-SEMBIN-4fa22c/runs does not exist --
    neither in the committed tree nor on disk -- so no run directory, no manifest and no
    measured value exists anywhere. This is the stronger and less usual claim of the two, and
    it is the one that matters.
  written_before_the_implementation: false
  written_before_the_implementation_note: >-
    NOT CLAIMED, and an earlier draft of this file wrongly implied it.
    experiments/EXP-SEMBIN-4fa22c/code exists on disk (untracked, 7 modules) at this commit:
    the executor started implementing while this addendum was being drafted. Corrected before
    committing, because a pre-registration claim that overstates its own scope is worth less
    than the narrow claim that is true.

  why_this_addendum_exists: >-
    A blind source read in the OTHER lane on this goal (TASK-20260916-64a93b, BATCH-e0a0c1,
    Semaev ePrint 2015/310) returned while this batch's executor was already running, and it
    carries an exact computation over F_2 whose consequence is a numeric prediction about
    the very arm being measured -- in the OPPOSITE direction to the hypothesis under test.
    Recording that after the measurement lands would waste it entirely.

  # -------------------------------------------------------------------------
  # 1. WHERE THE PRIOR COMES FROM
  # -------------------------------------------------------------------------
  provenance:
    source_task: TASK-20260916-64a93b
    source_lane: BATCH-e0a0c1
    source_goal: GOAL-SEMBIN-fcb7a2
    source_kind: >-
      Blind independent source read of Semaev ePrint 2015/310, joint J-4 plus the required
      J-5 proves-too-much control. Zero runs, zero measurements, maximum_runs 0 respected.
    source_artifacts:
      - coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-semaev-2015-310/report.md
      - coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-semaev-2015-310/attestation.yaml
      - coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-semaev-2015-310/recheck.py
      - coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-semaev-2015-310/recheck.json
    source_commit_status: >-
      UNCOMMITTED AT THE TIME THIS PRIOR IS WRITTEN. The reader package's own snapshot
      archive is TASK-20260916-92128f, gated on the sibling read TASK-20260916-9da6e0 which
      is still running. This addendum therefore cites artifacts a reader of THIS commit
      cannot open, which is a real defect in the citation and is disclosed rather than
      hidden. It is accepted because the alternative -- waiting, and recording the prior
      after the measurement it predicts -- destroys the only property that makes a prior
      worth having. Until TASK-20260916-92128f commits them, this addendum is a declared
      expectation and NOT citable evidence.
    provenance_of_the_underlying_paper: retrieved
    provenance_note: >-
      inputs/SEMAEV-2015-310 is frozen here with sha256 sidecars; the reader verified both
      sidecars in its own session and re-extracted the PDF under two non-freeze LAParams
      settings plus a second library. A read source, not a recalled one.

  # -------------------------------------------------------------------------
  # 2. THE PRIOR
  # -------------------------------------------------------------------------
  coordinator_prior_addendum:

    standing_prediction:
      where: H-SEMBIN-a7e721, mechanism, lines 64-70
      text_as_recorded: >-
        "the shifts destroy the coordinate symmetry that keeps early degree falls available"
      what_it_implies_for_the_measurement: >-
        d'_F on the coset-shifted arm A-SHIFTED should be HIGHER than on the matched
        unshifted pair A-UNSHIFTED. Measuring both arms was premised on the shifted one
        rising.

    revised_prior:
      direction: REVERSED
      statement: >-
        d'_F(A-SHIFTED) at m = 3 is AT MOST 4, and it does NOT separate upward from
        A-UNSHIFTED. I expect the two arms to agree at 4, or to differ by less than the
        instrument can resolve.
      mechanism: >-
        Semaev's proved Boolean degree fall does not care about the shifts. With
        X_i = v_i + sum_j X_ij alpha^j and v_i != 0, each x_i is still F_2-AFFINE in its
        coordinates and Frobenius is still F_2-linear, so every degree count in Semaev's
        argument is unchanged. The reader computed this exactly over F_2 at n = 7 and n = 9
        with NON-ZERO shift vectors: for the all-variable witness x_1 * S_3 the naive bound
        is 4 and the product's ANF degree is 3, so a fall occurs at 4 (recheck.py block A,
        `shifted_allvar_x1_times_S3`). At EXP-SEMBIN-4fa22c's m = 3 the shifted EQS4
        contains an all-variable S_3, so that witness is present in the measured object.
      why_this_bounds_the_measurement: >-
        d'_F is the least degree at which a non-trivial fall occurs, so a single exhibited
        witness falling at 4 is an UPPER bound: d'_F <= 4. The contract's M-1 fires on any
        degree drop below max_i deg(h_i f_i), which is the same event the reader's
        naive-bound-4-against-product-degree-3 computation exhibits, so the criteria agree
        and the bound transfers.
      the_hypothesis_premise_this_contradicts: >-
        H-SEMBIN-a7e721's mechanism premise, that the shifts remove low-degree falls, does
        not hold for THIS fall. The hypothesis may still be right about some other fall or
        some other m; what is now predicted false is the specific route by which it expected
        the shifted arm to rise.

    # Every outcome gets its reading BEFORE the number exists, so that none can be
    # narrated as a success afterwards.
    outcomes:
      - observation: d'_F(A-SHIFTED) = 4, agreeing with A-UNSHIFTED
        reading: >-
          PRIOR CONFIRMED, hypothesis mechanism WEAKENED. The shifts did not raise the first
          fall degree, and the reason is understood rather than mysterious. This is the
          outcome I expect.
      - observation: d'_F(A-SHIFTED) < 4
        reading: >-
          PRIOR CONFIRMED IN DIRECTION, and a stronger fall than Semaev's exists in the
          shifted object. Unanticipated: the read bounds d'_F above only and explicitly did
          not search.
      - observation: d'_F(A-SHIFTED) > 4
        reading: >-
          PRIOR REFUTED, and at least one of three things is wrong, in this order of prior
          probability: (a) THE INSTRUMENT, because the read exhibits an explicit degree-3
          product against a bound of 4, and an instrument that cannot see that witness is
          not measuring the first fall degree; (b) the contract's M-1 criterion differs from
          the reader's fall criterion in a way neither of us noticed; (c) the reader's degree
          identity fails at m = 3 or larger n despite being structural. THIS ROW IS WHY THE
          PRIOR IS WORTH RECORDING: it makes a specific instrument failure detectable that
          would otherwise read as a mathematical finding.
      - observation: A-SHIFTED censored at `> d_max_reached` (SR-1)
        reading: >-
          NOT a value and NOT a refutation (core rule 5, SR-1). But it becomes an INSTRUMENT
          CONCERN rather than a neutral budget outcome, because a witness falling at degree 4
          is cheap, and a run that cannot reach it inside 1800 s per arm has a performance
          defect worth naming.

    scope_limits:
      - >-
        It says nothing about d_F, Nagao's TRUE first fall degree. Lemma 4's inside form is
        recorded unproven and false in its literal form (CORR-20260916-96f47d), and Semaev
        never states d_F <= d'_F in either direction. S-1 stands unchanged: this instrument
        cannot refute Proposition 5.
      - >-
        The reader's computation is at n = 7 and n = 9, k = 3, one curve constant, one z,
        one shift vector. It establishes a DEGREE IDENTITY, which is structural, but it
        establishes it at those choices.
      - >-
        It bounds d'_F above only. The reader evaluated stated witnesses and did not search,
        so d'_F could be smaller than 4 and nothing here predicts it is not.
      - >-
        m = 2 is out of scope entirely. Semaev's argument does not reach the single
        constant-R_X equation by his own words, so no prediction is made there.
      - >-
        It is a PRIOR, not a result. If the measurement disagrees, the measurement wins on
        the measured object and this addendum becomes the record of a Coordinator
        expectation that was overturned -- which AGENTS.md names as one of the most
        informative outcomes the program can produce.

  # -------------------------------------------------------------------------
  # 3. WHAT THE ROUND MUST NOW ALSO DO -- additive, no reassignment
  # -------------------------------------------------------------------------
  # Deliberately NOT expressed as `what_changes.owners`: no owner changes. These are
  # additional obligations on joints that already have owners, and the composer leaves
  # ownership untouched.
  joint_obligations_added:
    - joint: J1
      obligation: >-
        Check the instrument against the shifted all-variable witness x_1 * S_3 explicitly.
        This is now a KNOWN-ANSWER FIXTURE for the shifted path, of exactly the kind C-3
        requires, and which the contract's C-3 does not contain because nobody had this
        witness when the contract was frozen. An instrument that reports no fall at 4 for
        that product is broken, independent of what it reports for the full system.
      does_not_reassign: true
    - joint: J2
      obligation: >-
        If the arms do not separate, state plainly whether the contract's separation
        criteria can distinguish "no effect" from "instrument cannot resolve either arm". A
        null result and a blind instrument produce the same table.
      does_not_reassign: true

