  proves_too_much:
    assigned_to: TASK-20260928-062eb8
    objects:
      - id: PTM-A
        object: >-
          The composite-order n = 17 Koblitz cell (a = 0; the record states
          order 4 x 137 x 239, to be recomputed), fed to the contract's
          capacity certificate and to its Stage 1 gate.
        known_truth: >-
          The capacity is not 2 bits there: the certificate must return the
          full alphabet set (every divisor of the order below the largest
          prime factor, including 548 and 956), and the gate must read
          G = M on the alphabet-548 and -956 homomorphisms. A certificate that
          returns 2 bits, or a gate that reads the null, has proved too much.
      - id: PTM-B
        object: >-
          Z/2^n with h = the low log2(M) bits (Wagner's own setting), fed to
          the contract's certificate and gate.
        known_truth: >-
          Every subgroup 2^k Z/2^n is an exact filter and h reads G = M
          exactly. A certificate that finds no alphabet between 4 and the
          order, or a null-reading rule that reports the random-label null
          there, has proved too much.
      - id: PTM-C
        object: >-
          The relabelled Z/lZ control with the log-interval key (top log2(M)
          bits of the discrete logarithm), fed to the contract's Stage 2
          rules.
        known_truth: >-
          The key is an approximate filter with G about M/2 (top-bits
          additivity up to one carry). A rule that reads the null there
          cannot see approximate filters, and a null on the Koblitz arms
          would then be inadmissible; the rule must read it as the far-end
          positive control.
    failure_signature: >-
      A correct protocol keeps each known-false conclusion out of reach in
      its rules. PTM-A returns the full alphabet set and reads G = M on both
      homomorphisms. PTM-B returns the subgroup filters and reads G = M.
      PTM-C reads about M/2 and is labelled a positive control. A certificate
      or rule that reports otherwise on any of them has proved too much.
    how_to_run_it: >-
      Review computations in your own script at toy size. They mint no
      RUN-*, write no evidence record and never execute any EXP-BINSTD-de9678
      driver as an experiment. Put every script, seed and output in
      computations.json. If a PTM would amount to a new experiment, record it
      not performed with the reason.

