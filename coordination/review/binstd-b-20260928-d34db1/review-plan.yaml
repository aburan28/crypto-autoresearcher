  # ---------------------------------------------------------------------------
  composition:
    who: >-
      The Coordinator, in TASK-20260928-606978, in a fresh session that did
      not run TASK-20260928-6880fc and did not compose DEC-20260928-63addc or
      author DEC-20260928-65c6d7. No reviewer votes on the whole contract.
    independence_check: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/binstd-b-20260928-d34db1/review-plan.yaml --reports
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-d34db1/reviews/TASK-20260928-91b346/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-d34db1/reviews/TASK-20260928-062eb8/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-d34db1/reviews/TASK-20260928-d1ad97/,
      run by the top-level session and recorded in DEC-20260928-9d9c47
      whatever it reports. The --blind-history check is uncheckable for this
      batch (no protected-digest file) and is recorded as such (PD-R4).
    custody_without_seal: >-
      No seal card. Before TASK-20260928-606978 is launched, the top-level
      session computes sha256 of the six declared report files of this lane
      and pastes them into the launch prompt. The composer records them
      verbatim in its composition worksheet as its first act, before it reads
      any report. TASK-20260928-4b00da must reproduce the same six digests; a
      mismatch voids the composition.
    keys:
      K-approve: >-
        J1 to J4 hold; J5 agrees with the contract's frozen capacity and
        table within the agreement tolerance; every PTM meets its failure
        signature; no tripwire fired. DEC-20260928-9d9c47 then approves
        EXP-BINSTD-de9678 under the AGENTS.md standing user authorization and
        names as its first next action the opening of an execution batch
        whose executor card is minted then. Approval asserts nothing about
        any curve's security, any filter's existence, or any k-list cost
        against rho.
      K-revise-defect: >-
        Any of J1 to J4 breaks, or a field approval requires is missing, or
        TB-4 fired. Decision revise, each defect listed with its joint and
        breaking artifact, and a revision design card in a new batch as the
        first next action.
      K-indeterminate: >-
        J5 disagrees with the contract beyond the tolerance on any quantity,
        or reports a choice that changes one. Decision revise on C2 or C6,
        naming the quantity; neither implementation is preferred.
      K-impediment: >-
        Wagner 2002 or FHLM (C5) is unreachable and the contract records the
        impediment, keeps every statement that would rest on it marked
        recalled, and forbids substitution; for the halving criterion the
        group-law re-derivation is the accepted alternative. Not a defect by
        itself; approval is permitted if every other key of K-approve holds.
        A contract that relays the criterion through IDEA-20260922-1b16d7 is
        K-revise-defect.
      K-infra: >-
        A reviewer could not run a joint. That joint reads inconclusive. No
        approval while any joint is inconclusive. An infrastructure failure
        is never negative evidence about the contract's mathematics or any
        curve.
      any_tripwire: See tier.tripwires. The composer applies the tripwire's stated effect.
    selection_point_duties: >-
      The composing decision is a selection point of GOAL-ECDLP2M-001
      (DEC-20260928-63addc holds note): it re-ranks HOLD-X1 to HOLD-X13 and
      HOLD-A to HOLD-G, applies DEC-20260925-41f6dc and DEC-20260925-a84b16 if
      they are on origin/main at its launch, and re-ranks the EXP-QSP-70b731
      custody successor (DEC-20260928-65c6d7 R-CUSTODY) without displacing its
      claim on slot 1 unless a reason is recorded. If DEC-20260928-cec92e is
      already on main, this decision cites its re-rank and records only the
      changes.

  procedure_deviations:
    - id: PD-R1
      severity: material
      what: >-
        The prior is informed, not blind. The session that wrote this plan
        read IDEA-20260926-136bd3 and IDEA-20260926-d06324 in full, including
        their hand-derived tables and alphabets.
      consequence: >-
        Concurrence of TASK-20260928-91b346 with those values is weak
        corroboration; J5 is the structurally blind check.
    - id: PD-R2
      severity: disclosed
      what: The object did not exist when this plan was written; it is bound by the producer snapshot.
    - id: PD-R3
      severity: disclosed
      what: >-
        No seal card and no blind-inputs file. The blind quantities and
        parameters are carried in the blind card itself
        (ledger/handoffs/TASK-20260928-d1ad97.yaml), which is the one batch
        record on its whitelist; this departs from the BATCH-7d29e8 form for
        the reason given in the lane-A plan's PD-R3.
    - id: PD-R4
      severity: disclosed
      what: >-
        No protected-digest file is written for this batch, so
        tools/check_review_independence.py --blind-history is uncheckable
        for J5, never passed. Blindness from commit messages and PR text rests
        on the card's ban on every git history command and all PR text.
  procedure_deviations_note: >-
    Four at writing. Later departures are recorded in DEC-20260928-9d9c47 or
    in an addendum, never absorbed.
