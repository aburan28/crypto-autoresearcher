        from: "launch.json.plan_sha256"
        to: "Exact trial-plan.json bytes"
        digest: "08f32f02a191dfd16f5342540716a327da73f5091528bac07cf5ee77cdb7cbc9"
        source: "tools/experiment_execution.py:713-719"

      - id: "trial-plan-to-completed-manifest"
        from: "run.inputs.plan_sha256"
        to: "Exact trial-plan.json bytes"
        digest: "08f32f02a191dfd16f5342540716a327da73f5091528bac07cf5ee77cdb7cbc9"
        condition: >-
          Present when the supervisor completes a schema-defective manifest and
          the run.inputs field was missing.
        source: "tools/experiment_execution.py:345-350"

      - id: "trial-plan-to-execution-receipt"
        from: "execution-receipt.json.plan_sha256"
        to: "Exact trial-plan.json bytes"
        digest: "08f32f02a191dfd16f5342540716a327da73f5091528bac07cf5ee77cdb7cbc9"
        source: "tools/experiment_execution.py:713,796-803"

      - id: "source-and-specification-to-environment"
        from:
          - "environment.json.source_sha256"
          - "environment.json.specification_sha256"
        to:
          - "The frozen source_sha256 mapping in trial-plan.json"
          - "The frozen specification digest"
        specification_digest: "3e24c2c1df6451f39388082a6b9594c6a6491f86c3075e1bf5878d6093792a30"
        source:
          - "experiments/EXP-ICPERF-515ae3/trial-plan.json:15-32"
          - "tools/experiment_execution.py:722-725"

      - id: "original-driver-manifest-to-completion-record"
        from: "execution-receipt.json.manifest_completion.driver_manifest_sha256"
        to: "Driver manifest.yaml bytes before envelope completion"
        condition: >-
          An initially schema-valid manifest produces an unchanged completion
          record with the digest. A completed manifest produces a completed
          record with the digest and retains the original text inside the
          completion object written to the receipt.
        source:
          - "tools/experiment_execution.py:307-309"
          - "tools/experiment_execution.py:372-391"
          - "tools/experiment_execution.py:796-803"

      - id: "receipt-to-logical-artifacts"
        from: "execution-receipt.json.artifact_sha256"
        to: "Exact logical content of the nine non-receipt artifacts"
        exact_keys:
          - "manifest.yaml"
          - "raw-result.json"
          - "launch.json"
          - "command.txt"
          - "environment.json"
          - "stdout.log"
