  obligations:
    scope:
      statement: >-
        Derive the exact required run-root artifact set, mandatory manifest and
        raw-result fields, digest-link obligations, and known-false mutation
        classifications from the frozen trial plan and standard supervisor,
        without reading candidate or prior-review material.
      source:
        - "coordination/review/icperf-prime63-m2-output-contract-v2-remedy-20261025/review-plan.yaml:17-21"
        - "coordination/review/icperf-prime63-m2-output-contract-v2-remedy-20261025/review-plan.yaml:80-85"
      candidate_conformance_assessed: false

    derivation_steps:
      - id: "derive-run-root"
        source:
          - "experiments/EXP-ICPERF-515ae3/trial-plan.json:31-33"
          - "experiments/EXP-ICPERF-515ae3/trial-plan.json:71-75"
          - "tools/experiment_execution.py:394-396"
        reasoning: >-
          The supervisor takes the parent of the specification path
          experiments/EXP-ICPERF-515ae3/specification.yaml, appends runs, and
          appends the trial's fixed run_id RUN-ICPERF-eb0d88.
        result: "experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88"

      - id: "derive-declared-artifacts"
        source:
          - "experiments/EXP-ICPERF-515ae3/trial-plan.json:52-55"
          - "tools/experiment_execution.py:185-203"
        reasoning: >-
          The trial declares exactly manifest.yaml and raw-result.json. The plan
          loader requires both names, rejects duplicate and reserved generated
          names, and permits an empty declared artifact only when it appears in
          an explicit allow_empty_artifacts list. This trial has no such list.
        result:
          - "manifest.yaml"
          - "raw-result.json"

      - id: "derive-supervisor-generated-artifacts"
        source:
          - "tools/experiment_execution.py:43-45"
          - "tools/experiment_execution.py:521-527"
          - "tools/experiment_execution.py:717-725"
          - "tools/experiment_execution.py:731-746"
          - "tools/experiment_execution.py:764-769"
          - "tools/experiment_execution.py:796-803"
        reasoning: >-
          GENERATED names eight supervisor artifacts. Authorization requires
          archive coverage for all eight plus the declared artifacts. Launch,
          command, and environment files are created before the driver; driver
          and checker log paths are opened by the supervisor or created after a
          failure; execution-receipt.json is written last.

      - id: "derive-output-validation-gate"
        source: "tools/experiment_execution.py:738-760"
        reasoning: >-
          A zero checker return initially selects output_validated. Before that
          result survives, each trial-declared artifact must be a regular
          nonempty file unless explicitly allow-listed empty, and manifest.yaml
          must pass the external run-schema check. An ensuing execution error
          after a zero driver return changes status to invalid_output.

      - id: "derive-receipt-reconstruction-gate"
        source:
          - "tools/experiment_execution.py:399-431"
          - "tools/experiment_execution.py:769-803"
        reasoning: >-
          The receipt hashes each declared artifact and each GENERATED artifact
          other than the receipt itself. Later trial-state reconstruction
          requires the exact nine-name hash-key set, restricts storage entries
          to those names, and checks each logical artifact against its recorded
          digest before returning output_validated.

      - id: "derive-manifest-envelope-gate"
        source:
          - "tools/experiment_execution.py:247-309"
          - "tools/experiment_execution.py:317-391"
          - "tools/experiment_execution.py:738-756"
        reasoning: >-
          A present nonempty manifest is parsed before the independent checker.
          A manifest that already passes the external run-schema validator is
          left unchanged. Otherwise the supervisor may add publish-time envelope
          fields and replaces the original only if the completed candidate
          passes the external validator. The checker validates the selected
          publication bytes.

      - id: "derive-raw-result-gate"
        source:
          - "tools/experiment_execution.py:291-306"
          - "tools/experiment_execution.py:354-367"
          - "tools/experiment_execution.py:747-756"
        reasoning: >-
          The standard supervisor tries to parse raw-result.json only for an
          optional top-level attack_claimed value. Independently of that parse,
          output_validated requires raw-result.json to exist and be nonempty.
          No complete raw-result field schema appears in the permitted
          supervisor.

    required_output_paths:
      run_root: "experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88"
      exact_logical_path_set:
        - "experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/manifest.yaml"
        - "experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/raw-result.json"
        - "experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/launch.json"
        - "experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/execution-receipt.json"
        - "experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/command.txt"
        - "experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/environment.json"
        - "experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/stdout.log"
        - "experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/stderr.log"
        - "experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/check.stdout.log"
        - "experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/check.stderr.log"
      archive_coverage_requires_all_ten:
        value: true
        source: "tools/experiment_execution.py:521-527"
      execution_receipt_artifact_sha256_exact_keyset:
        - "manifest.yaml"
        - "raw-result.json"
        - "launch.json"
        - "command.txt"
        - "environment.json"
        - "stdout.log"
        - "stderr.log"
        - "check.stdout.log"
        - "check.stderr.log"
      execution_receipt_self_hash_required: false
      execution_receipt_self_hash_reason:
        source:
          - "tools/experiment_execution.py:414-417"
          - "tools/experiment_execution.py:769-803"
        reasoning: >-
          execution-receipt.json is excluded from its own artifact_sha256 map
          but remains one of the ten paths required by handoff archive coverage.
      temporary_non_output:
        path: ".manifest.candidate.yaml"
        retained: false
        source: "tools/experiment_execution.py:377-386"
        reasoning: >-
          This temporary schema candidate is unlinked in a finally block and is
          not part of the final run-root artifact set.

    mandatory_manifest_fields:
      exact_universal_field_set_derivable: false
      directly_enforced_structure:
        - field_or_shape: "manifest document"
          obligation: "Must be a YAML mapping."
          source: "tools/experiment_execution.py:266-273"

        - field_or_shape: "run envelope"
          obligation: >-
            If a top-level run key exists, it must be the only top-level key and
            its value must be a mapping. Otherwise the flat mapping is treated
            as a legacy run body.
          source: "tools/experiment_execution.py:274-279"

        - field_or_shape: "run.id and run.run_id"
          obligation: >-
            Either alias, when present in the driver manifest, must equal
            RUN-ICPERF-eb0d88. The completion path supplies missing run.id but
            does not supply missing run.run_id.
          source:
            - "tools/experiment_execution.py:280-284"
            - "tools/experiment_execution.py:323-324"

        - field_or_shape: "run.experiment_id"
          obligation: >-
            When present it must equal EXP-ICPERF-515ae3; the completion path
            supplies that value when absent.
          source:
            - "tools/experiment_execution.py:280-284"
            - "tools/experiment_execution.py:323-324"

        - field_or_shape: "run.code, run.result, run.inputs, run.environment, run.timing"
          obligation: "Any one that is present must be a mapping."
          source: "tools/experiment_execution.py:285-287"

        - field_or_shape: "run.result.certificate"
          obligation: "When present it must be a mapping."
          source: "tools/experiment_execution.py:288-290"

        - field_or_shape: "attack_claimed"
          obligation: >-
            If present at the manifest run-body top level, it must be Boolean.
            If any inspected manifest or raw-result attack_claimed value is true,
            the manifest must already contain a certificate whose kind is not
            none. The supervisor cannot synthesize a positive certificate.
          source: "tools/experiment_execution.py:291-306"

        - field_or_shape: "final manifest run schema"
          obligation: >-
            The manifest associated with output_validated must yield no errors
            from manifest_schema_errors, which delegates to
            tools/validate_ledger.py.
          source:
            - "tools/experiment_execution.py:222-231"
            - "tools/experiment_execution.py:377-390"
            - "tools/experiment_execution.py:747-756"

      fields_supplied_when_missing_on_schema_completion_path:
        identity_and_state:
          - field: "run.id"
            value: "RUN-ICPERF-eb0d88"
            source: "tools/experiment_execution.py:323-324"
          - field: "run.experiment_id"
            value: "EXP-ICPERF-515ae3"
            source: "tools/experiment_execution.py:323-324"
          - field: "run.hypothesis_id"
            value: "H-ICPERF-05021b"
            source:
              - "experiments/EXP-ICPERF-515ae3/trial-plan.json:5-6"
              - "tools/experiment_execution.py:325-326"
          - field: "run.task_id"
            value: "TASK-20261019-904fbf"
            source:
              - "experiments/EXP-ICPERF-515ae3/trial-plan.json:31-33"
              - "tools/experiment_execution.py:327-329"
          - field: "run.trial_id"
            value: "prime63-m2-three-arm-diagnostic"
            source:
              - "experiments/EXP-ICPERF-515ae3/trial-plan.json:71-75"
              - "tools/experiment_execution.py:327-329"
          - field: "run.approved_by"
            value: "DEC-20261019-133820"
            source:
              - "experiments/EXP-ICPERF-515ae3/trial-plan.json:1-4"
              - "tools/experiment_execution.py:327-330"
          - field: "run.status"
            value: "completed"
            source: "tools/experiment_execution.py:330-333"
          - field: "run.status_note"
            condition: "Supplied only when run.status itself was missing."
            value: >-
              The supervisor records that driver exit zero is not a validity
              ruling.
            source: "tools/experiment_execution.py:330-333"

        code:
          fields:
            - "run.code.commit"
            - "run.code.commit_meaning"
            - "run.code.command_file"
            - "run.code.command"
            - "run.code.check_command"
          source: "tools/experiment_execution.py:334-344"

        environment:
          field: "run.environment"
          value_shape: >-
            A mapping containing file: environment.json together with the fields
            read from environment.json.
          source: "tools/experiment_execution.py:344"

        inputs:
          fields:
            - field: "run.inputs.trial_plan"
              value: "experiments/EXP-ICPERF-515ae3/trial-plan.json"
            - field: "run.inputs.plan_sha256"
              value: "08f32f02a191dfd16f5342540716a327da73f5091528bac07cf5ee77cdb7cbc9"
            - field: "run.inputs.trial_id"
              value: "prime63-m2-three-arm-diagnostic"
          optional_trial_derived_fields_present_in_this_trial: []
          source:
            - "experiments/EXP-ICPERF-515ae3/trial-plan.json:34-76"
            - "tools/experiment_execution.py:345-350"

        timing:
          fields:
            - "run.timing.started_at"
            - "run.timing.finished_at"
            - "run.timing.wall_seconds"
            - "run.timing.source"
          source: "tools/experiment_execution.py:317-322,351-353"

        result:
          - field: "run.result.raw_result"
            value: "raw-result.json"
            condition: "Supplied when raw-result.json is a regular file."
            source: "tools/experiment_execution.py:354-355"
          - field: "run.result.metrics"
            condition: >-
              Supplied only when the original run body has a mapping-valued
              top-level metrics field.
            source: "tools/experiment_execution.py:356-357"
          - field: "run.result.certificate"
            condition: >-
              Supplied with kind none only when at least one inspected
              attack_claimed field exists, all inspected values are exactly
              false, and no certificate already exists.
            source: "tools/experiment_execution.py:358-367"
          - field: "run.result.executor_receipt"
            value: "execution-receipt.json"
            source: "tools/experiment_execution.py:368"

        artifacts:
          field: "run.artifacts"
          value:
            stdout: "stdout.log"
            stderr: "stderr.log"
            check_stdout: "check.stdout.log"
            check_stderr: "check.stderr.log"
          source: "tools/experiment_execution.py:369-371"

        envelope_completion:
          field: "run.envelope_completion"
          fields:
            - "schema"
            - "action"
            - "driver_shape"
            - "driver_manifest_sha256"
            - "completed_by"
            - "added"
          source: "tools/experiment_execution.py:372-391"

      limitation: >-
        The completion-path fields are not a derivable universal minimum schema.
        A manifest that already passes the external run-schema check returns
        unchanged at tools/experiment_execution.py:307-309. The precise external
        schema lives in an unpermitted sixth source. Therefore the allowed bytes
        do not determine the exact mandatory manifest field set requested by B1.

    mandatory_raw_result_fields:
      exact_universal_field_set_derivable: false
      directly_required_fields: []
      directly_required_file_properties:
        - property: "Declared at the exact run root as raw-result.json."
          source: "experiments/EXP-ICPERF-515ae3/trial-plan.json:52-55"
        - property: "Must be a regular nonempty file for output_validated."
          source: "tools/experiment_execution.py:747-752"
      conditional_field_rule:
        field: "attack_claimed"
        obligation: >-
          If raw-result.json parses as a mapping and contains attack_claimed,
          its value must be Boolean. A true value requires a manifest certificate
          whose kind is not none.
        source: "tools/experiment_execution.py:291-306"
      no_direct_complete_json_schema:
        value: true
        source: "tools/experiment_execution.py:291-300"
        reasoning: >-
          JSON decoding failure causes the envelope check to treat raw as absent
          for claim inspection rather than directly classifying the result as
          invalid. The independent checker may impose a complete schema, but its
          source is protected and was not read.
      limitation: >-
        The trial plan names raw-result.json but does not declare any fields for
        it. Beyond nonempty-file status and the conditional attack_claimed rule,
        substantive raw-result validation is delegated to the unread checker.
        Exact mandatory raw-result fields therefore cannot be independently
        derived from the permitted sources.

    digest_links:
