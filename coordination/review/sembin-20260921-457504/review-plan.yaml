# Round: REVIEW-SEMBIN-20260921-457504 -- evidence review of RUN-SEMBIN-b6eb9f
# (EXP-SEMBIN-c2c312) under GOAL-SEMBIN-5078bc / BATCH-457504.
review_plan:
  id: REVIEW-SEMBIN-20260921-457504
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: BATCH-457504
  experiment_id: EXP-SEMBIN-c2c312
  hypothesis_id: H-SEMBIN-112e2e
  run_ids: [RUN-SEMBIN-b6eb9f]
  superseded_run_ids: [RUN-SEMBIN-595308]
  opened_at: '2026-09-21'
  opened_by: coordinator
  why_this_round_is_claim_changing: >-
    It can move H-SEMBIN-112e2e out of `specified`, and it can discharge
    GOAL-SEMBIN-5078bc's FIRST completion criterion, which asks for a committed
    Coordinator decision stating the map between Semaev's d_F4 and GOAL-DREG-001's
    Macaulay-rank d_reg/D, "so that campaign's existing measurements can be read as
    bearing on Assumption 1 or explicitly as not bearing on it. Either answer
    satisfies this criterion; an unstated map does not." A completion criterion is
    the strongest claim this program makes short of closing a goal, so this round
    gets a plan even though the run is a toy-tier instrumentation exercise.

  the_claim_as_its_producer_stated_it: >-
    From RUN-SEMBIN-b6eb9f's task-report.md: "On the 9 instances where both
    instruments returned a value, closure_D - d_F4 = 0 on 9 instance(s). The two
    statistics agree instance for instance on everything measured here: the smallest
    degree cap at which the degree-capped Boolean closure is already a Groebner basis
    equals the maximal F4 step degree before termination, on every instance where
    both were reached. The map is the identity on this set." And separately: the
    single-level Macaulay statistic (the GOAL-DREG-001-style one) "has no notion of
    termination and is not the quantity Assumption 1 bounds. Its degree parameter D
    is an input to the instrument, whereas d_F4 and closure_D are outputs."
  the_producer_declared_run_valid: >-
    manifest.yaml records status completed_valid, all four contract controls recorded
    as passed or recorded, and seven protocol deviations described as "all for cost,
    none for content".

  # ----------------------------------------------------------------------
  # MY PRIOR, RECORDED BEFORE ANY REPORT RETURNS.
  # Six predictions with the direction I expect, so that "the reviewers agreed"
  # can later be distinguished from "the reviewers agreed with what I already
  # believed". P-3 is the one I most expect to be told I am wrong about, and P-6
  # is the one whose loss would most change the outcome.
  # ----------------------------------------------------------------------
  coordinator_prior:
    - id: P-1
      prediction: >-
        The byte-identity control is NOT satisfied as the contract specifies it. The
        contract requires that "both instruments' recorded input hashes" be COMPARED;
        manifest.yaml instead records "system_sha256 and input_sha256 recorded per
        record and EQUAL BY CONSTRUCTION". An assertion that they must be equal is
        not the comparison the control asks for, and "by construction" is precisely
        the claim a byte-identity control exists to test.
      expected_verdict: confirmed
      confidence: high
      what_would_change_my_mind: >-
        A per-record comparison actually present in the raw records or in
        results-table.json, such that the equality is read off data rather than
        asserted from the generator's design.
    - id: P-2
      prediction: >-
        The headline closure_D - d_F4 = 0 on 9 of 9 instances REPRODUCES from the raw
        per-instance records, independently of summarize.py.
      expected_verdict: confirmed
      confidence: high
      what_would_change_my_mind: >-
        A different instance count, a different separation on any instance, or
        instances where both instruments returned a value that the summary omitted.
    - id: P-3
      prediction: >-
        The contract's declared primary metric `D_macaulay_rank_statistic` was NEVER
        MEASURED AS AN OUTPUT, and the run substituted a new output quantity,
        `closure_D`, that the contract does not name. The separation the contract
        declared, `separation_D_minus_d_F4`, is therefore not the separation reported.
        This is a deviation of CONTENT, contradicting the run's own statement that its
        seven deviations are "all for cost, none for content" -- and it is not among
        those seven.
      expected_verdict: confirmed
      confidence: high
      this_is_my_sharpest_prediction_and_also_the_least_hostile_reading: >-
        I expect the substitution to be CORRECT science and a defect in the CONTRACT
        rather than in the run: the contract presumed a "D" comparable to d_F4, and
        the DREG statistic is not one, because its degree is an input. The run
        appears to have discovered that and responded by constructing the output
        quantity the comparison actually needs. If so the fault is the protocol's,
        the response was right, and the only real failure is that it was not declared
        as a content deviation. A reviewer who shows me that closure_D IS the
        contract's D, or that the contract's D was measured as an output after all,
        overturns this.
    - id: P-4
      prediction: >-
        The contract's falsification criterion is INTERNALLY DEFECTIVE. It says
        "D - d_F4 = 0 on every measured instance including the off-diagonal cells
        refutes the hypothesis in the direction that matters most: the two statistics
        would then be the same quantity here, and GOAL-DREG-001's degree-5/6
        measurements WOULD be in tension with Assumption 1." Under the only D measured
        as an output (closure_D) the antecedent HOLDS, and the consequent does NOT
        follow, because closure_D is not the DREG statistic. The criterion conflates
        two different D's.
      expected_verdict: confirmed
      confidence: medium_high
      why_it_matters: >-
        If this is right, the run triggers a falsification criterion whose attached
        conclusion is unsound, and a Coordinator reading the contract mechanically
        would record the OPPOSITE of the truth about GOAL-DREG-001.
    - id: P-5
      prediction: >-
        The success criterion is NOT fully met, because one of its four conjuncts --
        "the matched-null separation differs from the structured separation" -- is
        UNEVALUABLE: the null's F4 hit the wall cap and its closure returned
        undetermined, so the null has no separation at all (manifest records
        null_f4_d_F4 null and null_closure_D null). The contract's third invalidation
        rule, which voids the run if the null separation EQUALS the structured one,
        is likewise unevaluable rather than passed.
      expected_verdict: confirmed
      confidence: high
      the_producer_reframed_it: >-
        The report substitutes a different and weaker claim -- that a SUFFICIENT
        verdict at degree 4 is not an artifact of the Macaulay shape, since the null
        reaches rank 11186 of 59536 where the structured system reaches 59530. That
        substitute claim looks true and useful to me; it is simply not the control the
        contract declared, and the difference should be recorded rather than absorbed.
    - id: P-6
      prediction: >-
        Despite P-3 through P-5, the experiment's OBJECTIVE is answered, and answered
        in the negative direction: GOAL-DREG-001's Macaulay-rank statistic is not
        commensurable with d_F4, because its degree is an input to a fixed-degree rank
        computation while d_F4 is an output of a terminating algorithm, so that
        campaign's degree-5 and degree-6 measurements do NOT bear on Assumption 1.
        Completion criterion 1 is satisfiable on the "explicitly as not bearing on it"
        branch it names.
      expected_verdict: confirmed
      confidence: medium
      THIS_IS_THE_PREDICTION_I_MOST_EXPECT_TO_LOSE: >-
        The weakness is that this answer may rest on a DEFINITIONAL OBSERVATION the
        executor made in prose rather than on anything the measurement established.
        If a reviewer shows that the input-versus-output distinction is argued and not
        measured, then the run did not settle the map -- it stated it -- the honest
        decision is `inconclusive` rather than `refine`, the finding is a technique
        note rather than evidence, and completion criterion 1 stays open. I would
        regard that as the most valuable outcome this round could produce, and it is
        the reason J-2 exists as a separate owned joint rather than a remark in the
        analysis.
    - id: P-7
      prediction: >-
        The correct decision is `refine`: not `support` (the hypothesis predicted
        d_F4 <= D with STRICTNESS on some instance, and strictness was not observed),
        not `weaken` or `reject_scoped` (the quantity the hypothesis named was never
        measured, so there is nothing about it to reject), and not `replicate` as a
        first move (re-running the same instrument pair would reproduce the same
        definitional gap).
      expected_verdict: confirmed
      confidence: low_medium
      explicitly_open: >-
        `inconclusive` is a legitimate alternative and follows immediately if P-6
        falls. I am recording `refine` as my prior so that an `inconclusive` outcome
        reads as the review overturning me rather than as my own conclusion.

  # ----------------------------------------------------------------------
  # JOINTS. One owner each. No joint is unowned; no joint has two owners.
  # ----------------------------------------------------------------------
  joints:
    - joint: J-1
      statement: >-
        Is RUN-SEMBIN-b6eb9f VALID as the contract defines validity, and are its four
        controls satisfied as SPECIFIED rather than as reframed?
      assigned_to: TASK-20260921-f2d82f
      owner_role: validator
      attack_plan: >-
        Work from the raw records, not the summary. (a) BYTE IDENTITY: find whether
        any per-record comparison of the two instruments' input hashes exists, or
        whether equality is only asserted; if only asserted, say what would have to be
        true for it to fail silently. (b) DUPLICATE RECORDS: the run discloses that
        two processes (pids 9160, 9336) both appended to workerB/cells/results.jsonl
        and that summarize.py resolves duplicates by "first completed record wins".
        Find every duplicated (instance, instrument) pair and report whether any pair
        is DISCORDANT -- different d_F4, different closure_D, different profile. "First
        wins" is safe if and only if no pair disagrees, and nothing in the package
        says whether any did. THIS IS THE HIGHEST-VALUE ITEM ON THIS JOINT. (c) The
        baseline control rests on ONE instance at (13,4,4,4) with closure_measured 1;
        check that and report how much the calibration actually rests on. (d) The
        three invalidation rules other than the null one: structural shape check
        (n(t-1) equations in n(t-2)+kt variables of degree 3), known-false returning
        2 from both, invalid inputs rejected. (e) Raw-to-summary agreement on instance
        counts: the report says 126 instances recorded, 314 raw records, 44 duplicates
        resolved -- check the arithmetic and say whether 314, 126 and 44 are mutually
        consistent.
      where_I_think_it_breaks: >-
        Byte identity (asserted, not compared) and the duplicate resolution (unaudited
        for discordance). I do not expect an actual discordant pair; I expect that
        nobody checked.
    - joint: J-2
      statement: >-
        Did the run measure the quantity the contract declared, and does the reported
        map actually settle the commensurability question -- or does it state a
        definitional distinction that was argued rather than measured?
      assigned_to: TASK-20260921-411a9d
      owner_role: red-team
      attack_plan: >-
        Adversarial, and the most important joint in the round. (a) Compare the
        contract's `metrics.primary` list against what the results table actually
        contains. The contract names `D_macaulay_rank_statistic` and
        `separation_D_minus_d_F4`; the report presents `closure_D` and
        `closure_D - d_F4`. Establish whether closure_D is the contract's D, a
        different quantity, or a third thing, and whether the substitution is
        disclosed anywhere as a deviation. (b) Then attack the CENTRAL claim: that
        DREG's statistic is not the quantity Assumption 1 bounds because its degree is
        an INPUT while d_F4 is an OUTPUT. Is that established by the measurement, or
        is it a definitional remark that needed no experiment? Build the strongest
        case that the run did NOT settle the map. (c) Then build the strongest case
        that it DID -- specifically, whether measuring both instruments on
        byte-identical systems adds anything the definitional remark alone does not.
        Report both cases and say which is stronger. (d) The contract's falsification
        criterion attaches a conclusion about GOAL-DREG-001 to "D - d_F4 = 0". State
        whether that inference is sound under the D actually measured. (e) Does
        anything in the run bear on Assumption 1 despite the contract's
        interpretation_limits forbidding that reading? Check the report for leakage
        in either direction.
      where_I_think_it_breaks: >-
        I expect (a) to confirm a content substitution and (d) to confirm the criterion
        is defective. I am genuinely uncertain on (b)/(c) and that uncertainty is the
        reason this round is worth running.
    - joint: J-3
      statement: >-
        Do d_F4, closure_D and their separation reproduce from the raw per-instance
        records, computed by an implementation that has not read the producer's?
      assigned_to: TASK-20260921-f1e5bd
      owner_role: validator
      attack_plan: >-
        A BLIND RE-DERIVATION, not a replication: recompute the three quantities from
        the definitions and the raw records alone. Take d_F4 from the F4 round traces
        as Semaev defines it in the contract (maximal total degree occurring before
        termination, with trailing "No pairs to reduce" steps excluded) and closure_D
        from the per-degree closure profiles, then form the separation, and only then
        compare against summary.json and the report. Report per instance. Also report
        the two tail checks the contract asks for and the report does not clearly
        answer: (i) every instance where the two statistics AGREE but the per-degree
        PROFILES differ -- the contract calls numerical agreement for different
        reasons "the dangerous case"; (ii) the degrees at which F4 reported no pairs
        against the degrees at which the Macaulay block gained rank, which is the
        contract's predicted mechanism for a separation that did not appear.
      where_I_think_it_breaks: >-
        I expect the three headline numbers to reproduce. I expect tail check (i) to
        be UNANSWERED by the package and to be answerable from the raw profiles, and I
        think it is the most informative thing nobody has computed: identity on the
        maxima with different profiles underneath is exactly the fibre the contract's
        objective says created the ambiguity.

  # ----------------------------------------------------------------------
  blindness:
    declared: true
    rule: >-
      The three reviewers may not read each other's reports, and each attests to what
      it read. They are dispatched concurrently and none is told the others' findings.
    reviewers_may_not_read:
      - the other two task directories in this batch
      - this review plan's `coordinator_prior` block
    coordinator_prior_is_withheld_because: >-
      A reviewer that knows which verdict the Coordinator expects is measuring the
      Coordinator's taste. The rest of this plan -- claim, joints, attack plans -- is
      given to its owner in full, because an attack plan is worth more when worked.
    lifted_for: []
    note: >-
      No blindness is lifted in this round. A later hardening round may legitimately
      let a reviewer see earlier verdicts; that would be recorded here as
      `lifted_for` with a rationale, and is not happening now.

  # ----------------------------------------------------------------------
  # PROVES-TOO-MUCH. Structured objects, filled BEFORE dispatch. The previous
  # round in this program left this field empty and the ruling recorded it as a
  # genuine procedure deviation (PD-6, the most serious of four). Not repeating it.
  # ----------------------------------------------------------------------
  proves_too_much:
    declared: true
    assigned_to: TASK-20260921-411a9d
    what_is_being_controlled: >-
      The run's reasoning that "both instruments returned the same number on identical
      bytes, therefore the two statistics are the same quantity here". Run that
      reasoning against objects where its conclusion is KNOWN FALSE.
    objects:
      - object: the known-false planted-dependency control already in the package
        why_its_conclusion_is_known_false: >-
          Both instruments return 2 on it. If numerical agreement licensed
          "same quantity", it would license it here too -- on a system built so that
          the answer is forced by a planted linear dependency rather than by anything
          the two instruments share. Agreement on a forced answer is the cheapest
          possible way for two different quantities to coincide.
        signature_a_correct_argument_must_show: >-
          It must NOT conclude commensurability from this instance. A correct argument
          says agreement on a degenerate instance is uninformative about whether the
          quantities coincide in general.
      - object: >-
          the unsatisfiable instances -- 35 of the 43 completed traces are unit-ideal,
          quotient dimension 0
        why_its_conclusion_is_known_false: >-
          On a unit ideal F4 derives 1 and stops, so d_F4 is bounded by the
          construction rather than by the system's difficulty, and Semaev says so
          himself in Section 4.5.1. Any two degree statistics will tend to agree here
          for a reason having nothing to do with the map between them.
        signature_a_correct_argument_must_show: >-
          It must report how many of the 9 map-supporting instances are unsatisfiable,
          and must not rest the identity claim on them. If most or all of the 9 are
          unit-ideal, the map is asserted mainly on instances where agreement is
          forced -- which would be the single most damaging finding available in this
          round. THE REVIEWER MUST COMPUTE THIS NUMBER.
      - object: >-
          the matched-null random dense system, whose F4 hit the wall cap after 3
          rounds
        why_its_conclusion_is_known_false: >-
          Its first fall degree is not 4 by construction, so any argument concluding
          "the instruments agree at 4" must fail here. It is also the object on which
          the contract's own invalidation rule was supposed to be evaluated.
        signature_a_correct_argument_must_show: >-
          It must treat the null's wall-cap outcome as an INFRASTRUCTURE fact yielding
          no separation (AGENTS.md rule 5), and must not convert "the null did not
          produce a sufficient verdict" into "the null confirms the structured
          result". The report comes close to that conversion and this control exists
          to test it.
      - object: >-
          GOAL-DREG-001's own reported degree-5 and degree-6 Macaulay work (EV-DREG-008)
        why_its_conclusion_is_known_false: >-
          If closure_D = d_F4 = 4 on these instances AND the DREG statistic were the
          same quantity, then DREG's degrees 5 and 6 on this same system would put it
          in direct tension with Assumption 1 -- a conclusion this run's own
          interpretation_limits forbid it from reaching in either direction.
        signature_a_correct_argument_must_show: >-
          It must block that inference explicitly, and the only clean way to block it
          is the input-versus-output distinction. So this object is simultaneously the
          proves-too-much control and the test of whether that distinction is doing
          real work or is a convenient escape. If the distinction is sound the
          inference is blocked; if it is merely asserted, the run has an unresolved
          tension with EV-DREG-008 that must be recorded rather than dissolved.

  # ----------------------------------------------------------------------
  blind_rederivation:
    declared: true
    quantity: >-
      d_F4, closure_D, and the separation closure_D - d_F4, per instance, over the
      instances where both instruments returned a value.
    assigned_to: TASK-20260921-f1e5bd
    why_rederivation_and_not_replication: >-
      Recomputing from the producer's own summarizer would reproduce a
      wrong-but-self-consistent implementation faithfully, which is exactly the
      failure validation cannot see. The reviewer must implement the definitions
      itself, from the raw traces.
    blind_from:
      - experiments/EXP-SEMBIN-c2c312/runs/RUN-SEMBIN-b6eb9f/summary.json
      - experiments/EXP-SEMBIN-c2c312/runs/RUN-SEMBIN-b6eb9f/task-report.md
      - experiments/EXP-SEMBIN-c2c312/runs/RUN-SEMBIN-b6eb9f/results-table.json
      - experiments/EXP-SEMBIN-c2c312/code/summarize.py
      - experiments/EXP-SEMBIN-c2c312/runs/RUN-SEMBIN-b6eb9f/NOTES-deviations-and-limitations.md
      - the `result` and `controls` blocks of RUN-SEMBIN-b6eb9f/manifest.yaml
      - this plan's coordinator_prior block
      - the other two reviewers' task directories
    permitted_reads: >-
      The contract's definitions in experiments/EXP-SEMBIN-c2c312/specification.yaml,
      the raw per-record files under worker*/cells/ and heavy/cells/, the generated
      instances, and the frozen source inputs/SEMAEV-2015-310/ for Semaev's definition
      of d_F4.

  # ----------------------------------------------------------------------
  composition:
    assigned_to: TASK-20260921-a9f304
    rule: >-
      Each reviewer reports on ITS OWN joints only. A blinded reviewer cannot see the
      other joints by construction, so a whole-claim verdict from one is an opinion
      formed from a fraction of the evidence. The Coordinator composes, scores every
      prior above as confirmed / refuted / untested, and only then writes analysis.md,
      the evidence record and the decision.
    required_outputs:
      - experiments/EXP-SEMBIN-c2c312/analysis.md, separated strictly into
        Observation / Comparison / Inference / Limitation
      - ledger/evidence/EV-SEMBIN-<tok>.yaml with direction, strength, claim_tier,
        obstruction + resource_check where the direction is weakens or contradicts
      - ledger/decisions/DEC-20260921-<tok>.yaml with one transition, knowledge_promotion
        filled, and an explicit statement of whether completion criterion 1 is met
      - H-SEMBIN-112e2e status updated, or an explicit statement that it does not move
    claim_tier_ceiling: >-
      toy. The contract declares tier toy with n <= 21, N <= 60, and no
      correspondence; the paper's conclusion needs n = 409 and 571. No transfer is
      claimed and the evidence record may not exceed this.

  procedure_deviations: []
  procedure_deviations_note: >-
    Empty at open, by construction. Any departure from this plan during the round --
    acting before a report returns, reassigning a joint, dropping a control -- is
    appended here rather than quietly absorbed.
