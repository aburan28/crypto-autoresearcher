    while decisively better than Semaev-via-SAT (32/32 vs 0/32 at d = 6) --
    costs 2.02x a structureless brute-force pair enumeration on identical
    solution sets." The product law's model: relations needed |F| = 2^l
    (2^l/n for a Frobenius-stable set), targets per relation 2^n / C(|F|, m),
    oracle per target C(|F|, m-1), linear algebra m * 2^(2l); the product of the
    first three is m * 2^n independently of l because C(|F|, m-1)/C(|F|, m) is
    about m/|F|. The free-oracle floors quoted: m = 2: 2^89.25, 3: 2^68.58,
    4: 2^56.40, 5: 2^48.44, 6: 2^42.85, 8: 2^35.61; the required oracle
    speed-up over search rho/(m 2^131) = 2^-(70.19 + log2 m); the oracle budget
    column 2^-27.86, 2^-6.78, 2^+5.71, 2^+13.94, 2^+19.77, 2^+27.35 at m = 2,
    3, 4, 5, 6, 8; the rho reference 2^60.8090 with the <-1> x <pi> speed-up.
    Also under review: the evidence record's strength "replicated" and claim
    tier "toy", and the exact-triviality argument for the degree-2 target-side
    vanishing ideal at m = 4, d >= 6.

