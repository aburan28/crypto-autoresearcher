        e_amortisation_UNBOUND: >-
          The amortisation shares 0.12% (d=6) and 0.07% (d=7) are in
          solver_11/summary.json (0.001223 and 0.000738, recomputed
          target_independent_ops/total_ops = 0.1223% and 0.0738%). solver_11 is
