          sha256(solver_11/summary.json) =
          c2382981a60f8538e9e93dfbba6338d872628145cb41f55fc5ea3f393220af92.
          The evidence record discloses this honestly; it is a binding gap, not
          a fabrication.
        f_strength_label_BREAK: >-
          templates/research-records.md lists strength in {anecdotal,
          preliminary, replicated, strong, inconclusive, contradictory} without
          crisp per-word definitions; the Validator contract (#5) and
          knowledge/README define a replication as an INDEPENDENT
          implementation, partition, seed, or reviewer. What the panel has:
          cross-oracle solution-set agreement (solver_12 pair enumeration vs
