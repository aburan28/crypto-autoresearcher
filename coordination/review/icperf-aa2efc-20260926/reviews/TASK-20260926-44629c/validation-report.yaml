          independent re-implementation of the image construction in solver_11,
          and 28 relations re-verified by an in-run lift-and-sum. What it lacks:
          repeated-trial statistics (every round's own limits field says "Single
          sequential run, no repeated-trial statistics"), independent seeds per
          measurement, and any independent reviewer in THIS program (the two
          adversarial reviews were in the producing session). So the SOLVER
          CORRECTNESS is cross-checked, but the HEADLINE COST claims (0.494x;
          the candidate ratios; the amortisation shares) are single-run. Calling
          the record as a whole "replicated" overstates those cost claims; the
          honest label is "preliminary" (empirical, internally cross-checked,
          single-run, external provenance, un-reviewed in-program), with
          "replicated" defensible only for the narrow cross-oracle correctness
          agreement. The label is load-bearing: knowledge/README permits
          promotion to a KN-FIND only from "replicated"/"strong" evidence, and
          KN-FIND-aa2efc was promoted. This is the break.
        g_vanishing_ideal: >-
          Direction of the monotonicity argument is SOUND: nested V_d => nested
          value sets D_d => the degree-2 vanishing ideal I_2(D_d) can only
          SHRINK as d grows (a larger value set imposes more linear conditions
          on degree-2 forms), so I_2 trivial at d=6 forces it trivial for all
          d>=6 at fixed arity m=4. The refusal to transfer to m=3 is correct:
          the m=3 and m=4 value-set maps differ, and I_2(m=4 set)=0 does not
          bound I_2(m=3 set). ARITHMETIC of the base case is consistent: the
          number of Boolean monomials of degree <= 2 in 131 variables is
          1 + 131 + C(131,2) = 8647, so "rank 8647, dim 0" means the degree-2
          part of the vanishing ideal is exactly {0}; and 8647 - 1680 = 6967
          matches the quoted d=5 kernel dim over 1680 points at rank 1680. BUT
          the base-case NUMBERS (d=5 dim 6967 over 1680 points; d=6 dim 0 over
          140400 points at rank 8647) are NOT in any of the seven hashed
          artifacts: 8647 appears only in the UNBOUND solver_11 and
          goal_round_20260913.json; 6967 in solver_02 and a parameter_sweep;
          140400 appears in bounds_01 only as a substring of a fraction
          numerator, not as a "distinct points" count I could confirm. So the
          degree-2 vanishing-ideal base case is UNBOUND / recalled: the argument
          direction is sound and the counts are internally consistent, but no
          hashed artifact carries the computation.
      what_would_have_broken_it: >-
        Any measured number differing from its artifact, any of the seven hashes
        mismatching, or "replicated" resting on a basis the templates/contract
        do not accept. The first two did not occur; the third did (the break),
        and two numbers (amortisation, vanishing-ideal base case) are unbound.

  # ==========================================================================
  proves_too_much:
    verdict: pass_with_qualification
    objects_evaluated:
      same_unit_boundary_ledger:
        source: /home/user/crypto/docs/ic/runs/ic-boundary-ledger-round3-2026-09-21.json
        unit: "S = group-addition equivalents / sqrt(r); native counts exact, conversions measured per instance (the SAME unit family as the free-oracle floor)."
        objects: >-
          216 measured whole-solve Koblitz index-calculus rows (11 curves,
          n = 11..41, meet-in-the-middle m=2/m=3 over signed-Frobenius-orbit
          columns and Semaev S4 pairs-and-solve) -- members of the
          decomposition-oracle family the floor claims to bound. #E recomputed
          from the Frobenius recurrence for each (matches).
        result: >-
          Shape-matched free-oracle floor (relations 2^l/(2n) for signed
          orbits, targets/relation max(1, N/C(2^l,m)), LA m(2^l/2n)^2), evaluated
          at each curve's own (n, m): with N = r (the order-r subgroup, the
          correct target space per J1) NO measured total sits below the floor
          (0 of 216) and no relation-phase-only cost sits below it (0 of 216).
          Minimum total/floor(r) = 2^+2.58. THE CONTROL PASSES: no member of the
          measured family goes below the floor at its own parameters, in the
          floor's own unit.
        secondary_finding_corroborating_J1: >-
          Under the PRODUCER'S stated ambient N = #E = 4r (which at these toy
          Koblitz curves means huge cofactors: n=39 cofactor 8012, n=29 12646,
          n=37 596), the floor is VIOLATED: 3 of 216 total costs and 21 of 216
          relation-phase costs sit up to 2^-1.76 / 2^-4.76 below the N=#E floor,
          every one of them a high-cofactor row. The reason is exactly J1(a): a
          measured solve only has to cover the order-r subgroup its targets live
          in, so its true targets-per-relation is N=r-based (~6), not N=#E-based
          (~50190). This is a proves-too-much TELL that points at the same joint
          J1 flags: N=#E over-states the yield ceiling by the cofactor and can
          make the floor claim FALSE where the cofactor is large. It confirms
          the ambient must be N=r. On ECC2K-130 the cofactor is only 4 (2 bits)
          so no verdict flips there, but the control shows the N=4r choice is
          not merely conservative.
      tournament_cells_rounds_0021_0022:
        source: /home/user/crypto/research/ic_candidate_tournament_20260915/campaign_20260916/ (RESULTS.md rounds 0021, 0022; ROUND21/ROUND22 write-ups)
        cells: "n23a1 (r=4196903) IC/rho 0.831; n37a0 (r=230603167) 1.396; n43a1 (r=4644189029) 2.207 -- the producer's own section-6.2 quotes."
        verdict: inconclusive
        reason: >-
          The tournament reports IC/rho as a ratio of whole-process CALLGRIND
          INSTRUCTIONS (instructions() parses callgrind's Collected: line); the
          free-oracle floor is in group operations. No instructions-per-group-op
          conversion is recorded for either arm in rounds 0021/0022 (calibration
          exists only in the boundary-ledger family, a different harness). A
          same-unit comparison is therefore impossible from these cells, so per
          the plan this is INCONCLUSIVE, never a pass. Bounding arithmetic: the
          shape-matched floor in group ops at these cells (N=#E) is 2.50x
          (n23a1), 146x (n37a0), 461x (n43a1) of rho's expected steps -- far
          above the measured instruction ratios (0.831, 1.396, 2.207), so for
          the instruction ratio to be consistent with the group-op floor the IC
          arm would need 3x-209x fewer instructions per group-op than the rho
          arm; plausible for a compiled tiny-field collector against a heavier
          rho walker, but unmeasured. The two harnesses disagree ~9x on IC/rho
          for the SAME n=23 cell (boundary-ledger frobfold_walk 7.47x in
          group-add-equivalents vs tournament 0.831x in instructions), which is
          exactly why the instruction ratio cannot be read as a group-op ratio.
    overall: >-
      PASS on the same-unit objects (the floor holds against every measured toy
      index-calculus cost with the correct N=r ambient), INCONCLUSIVE (never
