      most_important_number: "7 of 7 bound hashes MATCH at f9c77524; but the cost claims are single-run (no repeated-trial statistics, no independent in-program reviewer), so 'replicated' is overstated."
      worked:
        hashes: >-
          All seven artifacts in EV-ICPERF-10c5fc.external_provenance recompute
