  joints:
    - joint: J1
      title: >-
        The product identity 2^l * 2^n/C(2^l,m) * C(2^l,m-1) = m*2^n and its
        hidden assumptions (which group order N; the uniform-spread/one-relation
        assumption; the Frobenius-stable-set variant m*2^n/n).
      verdict: holds
      most_important_number: >-
        m = 3 subgroup-restricted floor (N = r, |F| = 2^l/4) is 2^67.585, i.e.
        +6.776 bits above rho (2^60.8090); the producer's N = 4r value is
        2^68.585, +7.776. No m <= 3 row crosses rho in EITHER model.
      worked:
        product_identity_exact: >-
          With C(|F|,m) written exactly, 2^l * N/C(2^l,m) * C(2^l,m-1) =
          N * m * F/(F - m + 1), which equals the producer's m*N up to the
          factor F/(F-m+1) = 1 + (m-1)/(F-m+1). At each floor-optimal integer l
          the relative error of the m/|F| approximation is 1.14e-13 (m=2, l=43),
          2.33e-10 (m=3, l=33), 2.24e-8 (m=4, l=27), 4.77e-7 (m=5, l=23),
          4.77e-6 (m=6, l=20), 1.07e-4 (m=8, l=16). The identity is therefore
          exact to < 1e-4 relative at every row -- far inside the plan's 2.1-bit
          break threshold. log2(product) vs log2(m*N): 132.000000/132.000000,
          132.584963/132.584963, 133.000000/133.000000, 133.321929/133.321928,
          133.584969/133.584963, 134.000154/134.000000.
        floor_tables_side_by_side: >-
          Free-oracle floor min over l of [2^(l-s) N/C(2^(l-s),m) + m 2^(2(l-s))],
          bits, real l (integer-l values in the script agree within rounding):
          | m | producer N=4r,s=0 | subgroup N=r,s=2 | diff (bits) | l* (4r) | l* (r) |
          | 2 | 89.2516 | 87.9183 | 1.3333 | 43.333 | 44.667 |
          | 3 | 68.5850 | 67.5850 | 1.0000 | 33.000 | 34.500 |
          | 4 | 56.4049 | 55.6049 | 0.8000 | 26.834 | 28.434 |
          | 5 | 48.4352 | 47.7686 | 0.6667 | 22.764 | 24.431 |
          | 6 | 42.8501 | 42.2786 | 0.5714 | 19.890 | 21.604 |
          | 8 | 35.6086 | 35.1642 | 0.4444 | 16.123 | 17.901 |
          The bit shift 4r->r is exactly 4/(m+1) (closed form: the cofactor
          divides N by 4 and the floor scales as N^(2/(m+1))). Producer's own
          floor column reproduces to <= 0.005 bit; producer's dim V column
          (43.33, 33.00, 26.83, 22.76, 19.89, 16.12) IS the floor-optimal l
          (matches my l* to <= 0.004).
        uniform_spread_assumption: >-
          "targets per relation = N/C(|F|,m)" assumes one relation per
          decomposable target and negligible collision. At each l* the expected
          decompositions per target lambda = C(2^l,m)/N is 2^-45.3 (m=2) down to
          2^-17.3 (m=8), so the Poisson correction 1/lambda vs 1/(1-e^-lambda) is
          <= lambda/2 = 2^-46 .. 2^-18 relative -- negligible. The assumption
          that itself is not free is EQUIDISTRIBUTION of m-subset sums over the
          group/cosets, which the producer measures only at n <= 19 (note
          section 1) and applies at n = 131; that is a stated transfer
          assumption, not a bound.
        frobenius_set_variant: >-
          ord_131(2) = 130, so the 2-cyclotomic cosets mod 131 have sizes 1 and
          130 and the only Frobenius-stable F_2-SUBSPACE dimensions are 0, 1,
          130, 131 -- there is no invariant subspace factor base of usable size,
          confirming the note's dichotomy. But 131 is prime, so every abscissa
          not in F_2 has a Frobenius orbit of size exactly 131 and orbit UNIONS
          of any k orbits are stable with 131k abscissae: the collapse is "free"
          for SETS and needs a materialised base, as the finding says. The
          collapsed product (2^l/n)*N/C*C(m-1) = m*N/n gives log2(3*2^131/131) =
          125.55, matching note section 6. An orbit-collapsed FREE-ORACLE floor
          (relations 2^l/n, LA m(2^l/n)^2) is 8-12 bits below the finding's
          no-collapse table (m=3: 2^58.03), but the finding's table is
          explicitly the NO-collapse table ("2^l/n for a Frobenius-stable set"),
          so this is a different model, not an error -- which also explains the
          1-3 bit lower R3a/R3b lane figures the Coordinator prior P1 flagged.
      what_would_have_broken_it: >-
        The identity failing by > rounding at any row (it does not: <= 1e-4),
        OR the subgroup-restricted variant moving any m <= 3 row below 2^60.81
        (it does not: m=3 stays +6.78 bits above, m=2 +27.11). Either would be a
        break; neither occurs.

    - joint: J2
      title: >-
        The free-oracle floor table, the oracle-budget column, the required
        speed-up column, and the DEFINITION of "oracle budget" vs "floor-to-rho
        gap"; and which quantity downstream program records quote.
      verdict: holds
      verdict_qualifier: >-
        Arithmetic holds (every floor reproduces to <= 0.05 bit; the
        oracle-budget and speed-up columns reproduce from the stated model). The
        DEFINITIONS are the load-bearing content, and downstream program records
        systematically quote the wrong one -- see wrong_quantity_records below.
        That is a defect in downstream records, not in the finding.
      most_important_number: >-
        At m = 4 there are THREE distinct quantities, all real: floor-to-rho GAP
        (rho/floor) = 2^-4.41; per-target oracle budget at the floor-optimal l,
        LA ignored (rho/T, the NOTE'S OWN 5.3 column) = 2^-5.71 [i.e. +5.71 in
        the note's sign]; re-optimised per-attempt budget (one attempt/relation
        cap, l re-optimised) = 2^+11.01. The number "2^4.4" quoted across this
        program as "per-attempt oracle budget" is the GAP, not any per-attempt
        budget.
      worked:
        six_floors: >-
          Reproduced exactly (bits, real l): 89.2516, 68.5850, 56.4049, 48.4352,
          42.8501, 35.6086 vs producer 89.25, 68.58, 56.40, 48.44, 42.85, 35.61
          -- max deviation 0.005 bit, inside the 0.05-bit break threshold.
          Producer's dim V column is the floor-optimal l (see J1).
        oracle_budget_column_D2: >-
          rho/T(l*) where T = targets term alone at the floor-optimal l:
          -27.858, -6.776, +5.726, +13.959, +19.766, +27.370 bits vs producer's
          note-5.3 column -27.86, -6.78, +5.71, +13.94, +19.77, +27.35 -- max
          0.02 bit. THIS is the note's "oracle budget" column.
        required_speedup_D4: >-
          rho/(m*2^131) = 2^-(70.19 + log2 m): -71.191, -71.776, -72.191,
          -72.513, -72.776, -73.191 vs producer -71.19, -71.78, -72.19, -72.51,
          -72.78, -73.19 -- exact. Verified B(m)/C(2^l*,m-1) = S(m) (the last
          column IS the product law read backwards) and that the "search space
          per target" column C(2^l*,m-1) reproduces the note's 43.33, 65.00,
          77.91, 86.46, 92.54, 100.54.
        three_definitions_pinned:
          - "D1 floor-to-rho GAP  = rho/floor(l*): 2^-4.41 at m=4. Total-cost headroom before ANY oracle cost is charged. NOT a per-attempt budget (the floor already charges 1 op/target + LA)."
          - "D2 oracle budget     = rho/T(l*)     : 2^+5.71 at m=4 (note 5.3). Per-target oracle cost that ties rho if l is held at the free-oracle optimum and LA is ignored."
          - "D3 re-optimised budget: min_l[2^w T(l)+m 2^2l]=rho for w, one attempt/relation cap: 2^+11.01 (m=4), 2^+33.08 (m=5), 2^+37.39 (m=6), 2^+42.52 (m=8). The honest 'what must an m>=4 oracle cost per attempt to tie rho' with l free."
        which_an_m_ge_4_oracle_must_meet: >-
          To tie rho with l chosen for the oracle, the per-attempt budget is D3
          (2^11.01 at m=4). If l is pinned at the free-oracle optimum and LA is
          ignored, it is D2 (2^5.71). The gap D1 (2^4.41) is NOT a per-attempt
          budget and must not be quoted as one.
      what_would_have_broken_it: >-
        Any floor off by > 0.05 bit under the stated model, or the
        oracle-budget/speed-up columns not reproducible from any stated model.
        Neither occurs; the columns reproduce from N = 4r with l at the
        free-oracle optimum.

    - joint: J3
      title: >-
        The rho reference 2^60.8090: #E(F_2^131) = 4r for y^2+xy=x^3+1,
        r prime, automorphism order 262, constant sqrt(pi r/(4*131)).
      verdict: holds
      most_important_number: "sqrt(pi r/(4*131)) = 2^60.8090366; producer quotes 2^60.8090 (difference 3.7e-5 bit)."
      worked:
        curve_count: >-
          Direct enumeration of y^2+xy=x^3+1 over F_2 (a=0) gives #E(F_2)=4,
          trace t_1 = -1. Frobenius recurrence t_0=2, t_k=t_1 t_{k-1}-2 t_{k-2}
          gives t_131 = -22283658519494248867 and
          #E(F_2^131) = 2^131 + 1 - t_131 = 2722258935367507707729280517973639940516
          = 4 * 680564733841876926932320129493409985129 exactly. (a=1 gives
          t_1=+1, the twist; a=0 is the challenge curve.)
        r_prime: >-
          r = 680564733841876926932320129493409985129 is prime by Miller-Rabin
          on 52 bases (12 fixed small primes + 40 seeded random) and
          independently by sympy.isprime; log2 r = 129.0000, r - 2^129 =
          5570914629873562217.
        automorphisms_and_constant: >-
          131 | r-1 (=(r-1) mod 131 = 0), so a Frobenius eigenvalue of order 131
          acts on the order-r subgroup; with negation |<-1> x <pi>| = 2*131 =
          262. Constant candidates (bits): plain sqrt(pi r/2) 64.826; negation
          only sqrt(pi r/4) 64.326; Frobenius only 61.309; <-1> x <pi>
          sqrt(pi r/(4*131)) = sqrt(pi r/2)/sqrt(262) = 60.80904. S =
          ref/sqrt(r) = 0.077430006, matching the note's S = 0.077430.
        convention_match: >-
          The finding's 2^60.8090 uses sqrt(pi r/(4k)) with k = 131 (the
          Frobenius class order), which is EXACTLY the standing program
          convention of CORR-20260922-81aeab as applied in DEC-20260924-99ce20
          S2 C2 (sqrt(pi r/(4k))). It is NOT the sqrt(2k) double-count that
          CORR-20260922-81aeab / -0d365e correct; using sqrt(pi r/(8*131)) would
          give 2^60.309, and the finding does not. No convention mismatch.
      what_would_have_broken_it: >-
        Any disagreement above 0.01 bit from 2^60.8090 (actual 3.7e-5), a
        #E != 4r, r composite, or the finding using the sqrt(2k) convention the
        program's correction records reject. None occurs.

