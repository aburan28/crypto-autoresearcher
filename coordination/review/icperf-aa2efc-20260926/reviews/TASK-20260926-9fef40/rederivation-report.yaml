parameters_verbatim: |
  r = 680564733841876926932320129493409985129. n = 131. m ranges over {2, 3, 4, 5, 6, 8}.
  C(a, b) is the exact binomial coefficient (for non-integer a, use the falling-factorial
  form a(a-1)...(a-b+1)/b!; state which form you use where l is real). Report every
  logarithmic value in bits (log base 2) to 4 decimal places.

quantities_verbatim: |
  Q1. F(m; N, s) = min over real l >= 1 of [ 2^(l-s) * N / C(2^(l-s), m)  +  m * 2^(2(l-s)) ],
  for each m, at (N, s) = (4r, 0) and at (N, s) = (r, 2). Report for each (m, N, s): the
  optimising l (call it l*), the two summands at l*, and log2 F. Also report the same minimum
  over INTEGER l only.
  Q2. T(m; N, s) = 2^(l*-s) * N / C(2^(l*-s), m) at the real-l optimum l* of Q1 (the first
  summand alone), in bits; and B(m; N, s) = log2(R) - log2(T(m; N, s)) in bits, where R is Q3.
  Q3. R = sqrt(pi * r / (4 * 131)), in bits.
  Q4. The exact ratio C(2^l*, m-1) / C(2^l*, m) at the (N, s) = (4r, 0) optimum l* of Q1 (use
  the integer l nearest l* so the binomials are exact), compared with m / 2^l: report both and
  their ratio.
  Q5. For the curve y^2 + x y = x^3 + 1 over F_2 (so a = 0, b = 1): compute #E(F_2) by hand
  (list the points), obtain the trace t = 2 + 1 - #E(F_2), and use the recurrence for
  #E(F_{2^k}) = 2^k + 1 - (alpha^k + beta^k) where alpha, beta are the roots of X^2 - t X + 2
  (equivalently the integer recurrence s_k = t s_{k-1} - 2 s_{k-2}, s_0 = 2, s_1 = t) to
  compute #E(F_{2^131}) exactly. Report whether #E(F_{2^131}) equals 4 * r, and test r for
  primality with a deterministic-enough Miller-Rabin (at least 40 random bases, plus the small
  primes), reporting the result.

method_notes:
  binomial_form: >
    For real l the binomial C(x, m) with x = 2^(l-s) is the falling-factorial form
    x(x-1)...(x-m+1)/m!. For integer l (and s <= l) x is an integer and this equals
    math.comb(x, m); the integer-l minimum and Q4/Q5 use exact Python integers and
    fractions.Fraction.
  domain: >
    The falling-factorial C(x, m) is zero at x in {0,...,m-1} and negative on some
    sub-intervals below m-1, where the objective is undefined or unbounded below. The
    real-l minimisation is therefore taken over l >= max(1, s + log2(m-1)) + 1e-9, i.e.
    2^(l-s) > m-1 and l >= 1. The optimum lies at 2^(l*-s) ~ N^(1/(m+1)) (2^16 .. 2^43),
    far inside that domain, so the restriction never binds. Integer-l candidates with
    C(x, m) <= 0 are skipped for the same reason (only l=1 at s=2 is affected).
  real_l_minimisation: >
    mpmath at 60 decimal digits. The objective is convex in x and x = 2^(l-s) is monotone
    in l, so it is unimodal in l; golden-section search over l in [domain floor, 400] for
    260 iterations (bracket width ~1e-50), followed by a secant polish (mpmath.findroot) on
    the numerical derivative, accepted only when it lowers the objective; a final check
    asserts the objective is not lower at l* +/- 1e-6. Sanity: the first-order condition
    x^(m+1) = (m-1)!(m-1) N / 2 predicts l* = 130/3 (m=2, 4r,0), 33 (m=3, 4r,0) and
    l*-2 = 128/3 (m=2, r,2), matching the search.
  integer_l_minimisation: >
    Exhaustive over integer l in [1, 400] with exact Fraction arithmetic; log2 taken with
    mpmath at 60 digits on the exact fraction.
  logs: "All bits values are log2 computed at 60 digits and rounded to 4 decimals."
  q4: >
    l_int = nearest integer to l* from Q1 at (4r, 0). The exact ratio
    C(2^l, m-1)/C(2^l, m) = m/(2^l - m + 1) (verified by computing both binomials with
    math.comb and comparing to the closed form); compared with m/2^l, whose quotient is
    2^l/(2^l - m + 1).
  q5: >
    Points enumerated over F_2 by direct substitution; trace from #E(F_2); s_k by the
    exact integer recurrence; Hasse bound checked. Primality of r: trial division by all
    primes < 10000, then Miller-Rabin with 65 bases = the 25 smallest primes plus 40
    bases drawn from random.Random(20260926).randrange(2, r-2) (fixed seed, so the run
    is reproducible).

