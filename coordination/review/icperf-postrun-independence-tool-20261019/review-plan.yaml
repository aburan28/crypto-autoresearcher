review_plan:
  id: REVIEW-ICPERF-INDEPENDENCE-CHECKER-20261019
  goal_id: GOAL-ICPERF-e6b6a4
  source_task_id: TASK-20261019-c9dbad
  snapshot_task_id: TASK-20261019-d6f5cb
  reviewer_task_id: TASK-20261019-fcedbb
  ledger_archive_task_id: TASK-20261019-bb606b
  written_by: coordinator
  written_at: '2026-10-19'
  written_before_any_reviewer_ran: true
  claim_under_review: Explicit id plus full statement joint plans are matched by stable IDs without weakening
    any independent-review refusal.
  coordinator_prior: The current checker misses P3/P4 because it chooses full sentence joint text over P3/P4 IDs;
    a narrow ID preference should repair matching but known-false controls must still fail.
  joints:
  - id: T1
    joint: Explicit stable joint IDs and full statements remain linked to exactly one original owner.
    assigned_to: TASK-20261019-fcedbb
    attack_plan: Derive expected labels from frozen plan before reading patch; then inspect selector, test ID
      plus text, legacy text-only, ambiguous or duplicate ID and wrong-owner cases.
    breaking_artifact: A concrete fixture whose ID, statement, owner or verdict is silently misbound.
  - id: T2
    joint: The patched checker preserves attestation, verdict, controls, sibling-read and blind_from refusals.
    assigned_to: TASK-20261019-fcedbb
    attack_plan: Mutate one requirement at a time in a passing synthetic fixture, rerun checker and inspect errors;
      verify the sealed top-level Validator schema is not auto-inferred as reviewer testimony.
    breaking_artifact: A named known-false mutation accepted by the checker or an inferred reviewer attestation
      not present in sealed bytes.
  blindness:
    mutual: true
    lifted_for: []
    rule: Tool reviewer uses a fresh independent session and cannot rely on the code author's assertions as its
      test oracle.
  proves_too_much:
    objects:
    - id: wrong_owner
      known_false_conclusion: A P3 verdict from another owner satisfies the P3 assignment.
      object: Synthetic plan and attestation with P3 owned by a different task.
      expected_failure_signature: Wrong owner is rejected.
    - id: blind_leak
      known_false_conclusion: A re-deriver that read a blind_from source remains independent.
      object: Synthetic read list containing one protected path.
      expected_failure_signature: blind_from violation is rejected.
    - id: missing_attestation
      known_false_conclusion: An unfiled Validator review satisfies P1 and P2.
      object: Frozen plan with only Red Team review_attestation.
      expected_failure_signature: Missing Validator attestation is rejected.
    assigned_to: TASK-20261019-fcedbb
    failure_signature: Acceptance of any known-false fixture blocks tool-fix approval.
  blind_rederivation:
    required: false
    rationale: This is a parser and refusal review with no load-bearing scientific quantity to rederive; known-false
      fixtures supply the direct control.
  seal_then_compare: Publish the tool-review report and attestation with a matching release, snapshot their exact
    bytes with Validator clarification, then issue the operational acceptance decision.
  procedure_deviations: []
  inference_boundary: Tool acceptance establishes only parser behavior for the declared fixtures. It does not
    validate P1-P4, infer a missing original reviewer attestation, repair historical invalid_output or support
    a speedup.
