        widening a checker's vocabulary to accept the output it is checking, in the same
        change that produces that output, is the pattern CLAUDE.md warns against for
        floors. A checker change, if wanted, is a separate reviewed code change: accept
        `filed` for attestations whose `kind` is `blind_rederivation` and require a
