        {holds, breaks, inconclusive}.
      why_the_owner_is_right_and_the_checker_is_incomplete: >-
        A blind re-deriver cannot say holds or breaks: it has, by construction, never seen
        the producer's value. `inconclusive` would misdescribe a complete, exact
        derivation. `filed` is the honest word and the contract's own model -- the
        Coordinator compares. The FAIL line is therefore a vocabulary gap in the checker
        for `kind: blind_rederivation`, not an independence problem, and the composition
        above supplies the verdict the checker wants to see.
