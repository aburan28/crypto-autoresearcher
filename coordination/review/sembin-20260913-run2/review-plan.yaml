review_plan:
  id: REVIEW-SEMBIN-20260913-run2
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: BATCH-SEMBIN-20260913-9d649f
  written_by: coordinator
  written_at: '2026-09-13'
  written_before_any_reviewer_ran: true
  written_before_any_reviewer_ran_evidence: >-
    This file is committed before TASK-20260913-31d530, TASK-20260913-7ca970 and
    TASK-20260913-3395e3 are dispatched; all three sit `queued` in
    coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-9d649f/dispatch_queue.json at the
    commit that adds this plan, and no report or attestation exists under this round's
    directory. The two runs under review were snapshot-archived first (commits 24f5a574a
    and 40e1cf727), so every reviewer reads committed bytes.

  why_this_round_exists: >-
    Two runs returned `completed_valid` and BOTH crossed a declared threshold that their
    contracts said would halt them. EXP-SEMBIN-354a75's ratio-above-1 stopping rule fired
    in six of nine cells. EXP-SEMBIN-92724f's arm D reports
    `falsification_threshold_crossed: true` and
    `cells_meeting_the_within_10pct_prediction: 0` at all seven cells. Neither executor
    formed a claim, which is correct. What they returned is therefore a pile of
    observations that could move two hypothesis statuses, could overturn a committed
    scoped closure (KN-FIND-9643e7 / DEC-20260913-74e208), and -- newly -- bears directly
    on the Nagao lane opened the same day, because Nagao's Theorem 1 draws its entire
    exponent saving from exactly the mechanism EXP-SEMBIN-92724f arm D measured. This is
    a claim-changing round and runs under a plan.

  claim_under_review: >-
    Not a single claim. Two run packages, and the question for each is what its
    observations support and how narrowly. The round does NOT ask whether Semaev's
    algorithm is fast, whether coset typing works, or whether any curve is affected; it
    asks which of the reported quantities are what the runs say they are.

  # ---------------------------------------------------------------------------
  # THE COORDINATOR'S PRIOR, RECORDED BEFORE ANY REPORT RETURNS.
  #
  # AGENTS.md: "'Three reviewers concurred' and 'three reviewers concurred with
  # what the Coordinator already believed' are different findings and only a
  # pre-recorded prior separates them. A prior the review overturns is one of the
  # most informative results the program can produce, and it is unrecoverable if
  # written afterwards."
  # ---------------------------------------------------------------------------
  coordinator_prior:
    on_354a75_headline_ratio:
      expectation: >-
        I EXPECT J1 TO BREAK. The run reports at least three distinct
        measured-over-predicted ratios and, at the same cell n20 m2 t2 k10, they disagree
        materially: section A of ratio-above-1-diagnosis.txt gives `sem P` 0.9024,
        section D gives an observed P ratio of 0.7583, and section G gives f_dispersion
        0.9091. The executor's bus message (MSG-20260913-477ddd) quoted 0.9024 as the
        headline and read the bias SIGN off it. Three numbers between 0.75 and 0.91 for
        one cell, one of which was promoted to a headline, is the shape of a quantity
        whose definition has not been pinned down.
      what_would_change_my_mind: >-
        A demonstration that the three columns are three different well-defined
        quantities under their stated definitions, that each is internally consistent,
        and that the one entering stage-1 relation cost is in fact the one quoted.
      confidence: moderate; I have read the diagnosis but not the code
    on_354a75_artifact_free_label:
      expectation: >-
        I EXPECT J2 TO BREAK, and this is my strongest prior in the round. The executor
        calls the m = t = 2, |V| >= 1024 cells "artifact-free" and reads the negative
        bias sign off them. But under the run's OWN exact factorisation at n20:
        f_legal = 0.9972, f_multiset = 1.0010, f_pop = 1.0021, and f_base = 0.9103.
        The entire ~9% deficit in the cells labelled artifact-free is f_base -- and
        section C of the diagnosis lists f_base among the three factors that are
        "properties of eq. (11)'s own approximation rather than of the curve." So either
        those cells are not artifact-free, or f_base is not an artifact. Both readings
        may be defensible and they lead to DIFFERENT conclusions: on one, the shortfall
        is real but its mechanism is a bookkeeping choice inside eq. (11) (charging |V|
        x-values where only L carry rational points), not the curve's decomposition
        behaviour; on the other, the label is wrong.
      what_would_change_my_mind: >-
        A principled criterion, stated before the cells are inspected, for which factors
        count as artifacts of the formula and which as features of the accounting -- and
        a showing that f_base falls on the side the label assumes.
      confidence: high that the tension is real; no view on which resolution is right
    on_354a75_decay_claim:
      expectation: >-
        I EXPECT J3 TO BREAK AS STATED AND SURVIVE AS INTENDED. Section E asserts
        f_multiset and f_base "are both O(|V|^-1/2)-type small-window effects: they go to
        1 as |V| grows at fixed t." The three largest-|V| cells give f_base = 0.9103,
        1.0029, 0.9762 at |V| = 1024, 2048, 4096 -- not monotone, and still up to 9% from
        1 at the largest window measured. I expect the underlying claim to be right in
        the limit (L - |V| should fluctuate on a Hasse-type scale, so the relative
        deviation decays like |V|^{-1/2} while its SIGN does not settle) and the sentence
        as written to be unsupported by these three points.
      what_would_change_my_mind: >-
        Either a derivation showing monotone decay is expected here, or a demonstration
        that three points at fixed t cannot distinguish the two and the sentence should
        never have been read as a measurement.
      confidence: moderate-high
    on_92724f_arm_d:
      expectation: >-
        I EXPECT J4 TO HOLD -- that is, I expect the negative result to survive. Arm D
        was the gating arm of its own contract, it was measured exhaustively and never
        sampled, and it missed its prediction at every one of seven cells with a median
        ratio of 0.4315 and a draw below half m! in every cell. A gating arm that misses
        by better than a factor of two at every cell, exhaustively, is the cleanest kind
        of negative result this program produces. My prior is that coset typing recovers
        substantially LESS of the m! symmetry factor than H-SEMBIN-c59e50 predicted.
      what_would_change_my_mind: >-
        A defect in the image-counting convention -- most plausibly a disagreement about
        what the denominator m! is being compared against, or a degenerate-draw exclusion
        that removed exactly the draws where typing works. `min_over_all_completed_draws`
        is 0.000696 and `max` is 68.47, a spread of five orders of magnitude, and a
        median over a distribution that wide is a fragile summary.
      confidence: moderate; the spread is the part I distrust
    on_92724f_interior_minimum:
      expectation: >-
        I EXPECT J5 TO BREAK THE HYPOTHESIS AND NOT THE RUN. H-SEMBIN-c59e50 predicted
        the typed objective is monotone decreasing in m with no interior optimum; the run
        reports `typed_objective_interior_minimum_exists: true` with a closed-form argmin
        at m = n ln 2 and names the term the hypothesis missed (`log2 m`). A prediction
        that fails against a closed form the same run derives is usually the prediction's
        fault. The depth is 0.086 bits, which is the part a reviewer should press: an
        interior minimum that shallow may be real and useless.
      confidence: moderate-high
    what_i_expect_across_the_whole_round: >-
      That both runs are INSTRUMENTALLY sound -- exhaustive where they claim to be,
      controls firing where they should -- and that the defects are in how the numbers
      were SUMMARISED rather than in how they were obtained. If a reviewer instead finds
      an enumeration defect, that is a much more serious finding than anything in my
      prior and must not be softened to fit it.
    a_prior_i_am_deliberately_not_recording: >-
      I have no prior on whether the eq.(11)-conditional closure in KN-FIND-9643e7
      survives. The executor stated plainly that the t<m versus t=m comparison needed to
      settle it is NOT AVAILABLE in this cell set and that it did not add a cell to
      manufacture one. I take that at face value and expect the closure question to
      remain open rather than to be resolved in either direction by this round.

  joints:
    - joint: >-
        J1 -- WHICH RATIO IS THE HEADLINE. That the quantity EXP-SEMBIN-354a75 reports as
        the measured-over-eq.(11) yield ratio is a single well-defined quantity, that the
        three columns reporting it in sections A, D and G of
        ratio-above-1-diagnosis.txt are mutually consistent under their stated
        definitions, and that the one quoted as the headline (0.9024 at n20) is the one
        that enters stage-1 relation cost.
      assigned_to: TASK-20260913-31d530
      attack_plan: >-
        Take cell n20 m2 t2 k10 and nothing else at first. From raw-result.json and
        per-R-counts.json, recompute each of the three columns from its own stated
        definition and reproduce all three numbers (0.9024, 0.7583, 0.9091). Then state,
        for each, the exact population it averages over (E or T), the presentation
        (single, chained, usable), the class-count variant, and whether it is pooled
        across the 20 configurations or per-configuration. Then answer one question:
        which of the three multiplies into a stage-1 relation cost, and is that the one
        MSG-20260913-477ddd quoted? I think the columns are three different quantities
        and that the disagreement is definitional rather than arithmetic -- but I also
        think a reader of the bus message could not have known which one they were being
        given, and if the quoted one is not the cost-bearing one, the bias sign in that
        message is unsupported.
      breaking_artifact: >-
        Any pair of the three columns that cannot both be right under their stated
        definitions; or a showing that the cost-bearing ratio is not the quoted one.
      holding_artifact: >-
        A table mapping each column to its definition, its population and its
        presentation, with all three reproduced and the cost-bearing one identified.
    - joint: >-
        J2 -- THE ARTIFACT-FREE LABEL. That the m = t = 2, |V| >= 1024 cells are free of
        the eq. (11) approximation artifacts, and therefore that the negative bias sign
        read off them is a statement about the curve's realized yield rather than about
        eq. (11)'s bookkeeping.
      assigned_to: TASK-20260913-31d530
      attack_plan: >-
        Reproduce the four-factor decomposition at n20, n22 and n24 and confirm the
        residual closes to 1e-9 as claimed. Then partition the four factors into "artifact
        of the formula" and "feature of the accounting" USING A CRITERION YOU STATE
        BEFORE LOOKING AT THE VALUES. Now check where the deficit sits: I compute
        f_legal = 0.9972 and f_base = 0.9103 at n20, i.e. essentially all of it in
        f_base, which section C itself calls an eq. (11) approximation. Decide whether
        that makes the label wrong or the classification wrong, and say what the
        shortfall's mechanism actually is. If f_base is the whole effect, then eq. (11)
        charging |V| x-values instead of L rational ones is the finding, and it is a
        DIFFERENT and more interesting finding than "the curve yields less than
        predicted" -- it is a defect in the formula that a reader can check without a
        curve at all.
      breaking_artifact: >-
        A showing that the deficit in the cells called artifact-free is dominated by a
        factor the run itself classifies as an artifact of eq. (11).
      holding_artifact: >-
        A stated criterion under which f_base is a feature of the accounting rather than
        an artifact, plus the resulting corrected reading of the bias sign.
    - joint: >-
        J3 -- THE DECAY CLAIM. That f_multiset and f_base "go to 1 as |V| grows at fixed
        t" (section E), and hence that the small-window artifacts are absent at the
        largest cells measured.
      assigned_to: TASK-20260913-31d530
      attack_plan: >-
        Derive, from the definitions alone, the expected magnitude of f_base = (L/|V|)^t
        when L is the count of F_q-rational points with x in V: L - |V| should fluctuate
        on a Hasse-type scale, so predict both the decay rate of |f_base - 1| and the
        fact that its SIGN does not settle. Compare against the three observed values
        (0.9103, 1.0029, 0.9762 at |V| = 1024, 2048, 4096) and against the smaller cells.
        Then state the |V| at which |f_base - 1| would fall below the headline effect
        size, and whether any cell in this contract reaches it. Do not treat
        non-monotonicity as a defect if the derivation predicts it -- report it as the
        derivation predicting it, which makes the sentence in section E wrong and the
        underlying physics right.
      breaking_artifact: >-
        A derivation under which f_base does NOT approach 1 at fixed t; or a showing that
        no measured cell reaches the window where the claim is testable.
      holding_artifact: >-
        A derived decay rate consistent with all nine cells and a stated threshold |V|.
    - joint: >-
        J4 -- ARM D, THE GATING NEGATIVE RESULT. That EXP-SEMBIN-92724f's exact
        coset-typed image ratio genuinely misses the predicted m! at every one of seven
        cells -- median 0.4315, no cell within 10%, a draw below half m! in every cell --
        and that the measurement is exhaustive rather than sampled.
      assigned_to: TASK-20260913-7ca970
      attack_plan: >-
        Verify exhaustiveness first and independently of the ratio: reconstruct the
        enumeration domain sizes and check that every claimed cell was fully enumerated,
        with no degenerate-draw exclusion that could have removed precisely the draws
        where typing works. Then attack the DENOMINATOR: state exactly what the predicted
        m! is a ratio against, and whether the typed and untyped families being compared
        have the same target population. Then attack the SUMMARY: min is 0.000696 and max
        is 68.47, five orders of magnitude, and a median over a distribution that wide is
        fragile -- report the full distribution per cell, not the median, and say whether
        the 68.47 draw is a real cell or a degenerate one that should have been excluded
        under the contract's own rule. I expect this negative result to survive; the
        denominator convention and that 68.47 outlier are where I think it is most likely
        to be wrong.
      breaking_artifact: >-
        A denominator or population mismatch between the typed and untyped families; or a
        degenerate-draw rule that excluded draws non-neutrally; or a cell that was
        sampled where the run claims exhaustion.
      holding_artifact: >-
        Per-cell distributions with the exhaustiveness independently confirmed and the
        denominator convention stated and checked.
    - joint: >-
        J5 -- THE INTERIOR MINIMUM. That the typed objective has an interior minimum at
        m = n ln 2 with depth 0.086 bits, contradicting H-SEMBIN-c59e50's prediction of
        monotone decrease, and that the missed term is log2 m.
      assigned_to: TASK-20260913-7ca970
      attack_plan: >-
        Re-derive dT/dm symbolically and independently and confirm or refute the argmin
        m = n ln 2. Then press the depth: 0.086 bits is small enough that it may be real
        and operationally meaningless, and the honest report of a 0.086-bit interior
        optimum is that the objective is FLAT near it, not that it has an optimum there.
        Say which. Then decide whether this refutes the hypothesis's prediction or merely
        its phrasing -- a prediction of "monotone decreasing with no interior optimum"
        that fails by 0.086 bits has failed, and it should be recorded as failed, but the
        research content of the failure may be nil and that should be said too.
      breaking_artifact: >-
        An argmin that does not reproduce, or a depth that vanishes under a different but
        equally defensible normalisation.
      holding_artifact: >-
        An independent symbolic re-derivation of the argmin and a stated verdict on
        whether 0.086 bits is an optimum or flatness.
    - joint: >-
        J6-BLIND -- THE LOAD-BEARING QUANTITY, RE-DERIVED BLIND. The exact factor by
        which eq. (11) misstates the mean number of decompositions per target when it
        charges |V| x-values while only L of them carry F_q-rational factor-base points,
        at t = 2 and |V| = 1024, 2048, 4096.
      assigned_to: TASK-20260913-3395e3
      attack_plan: >-
        See `blind_rederivation` below. This joint is a re-derivation, not a review, and
        its owner reads NONE of the producing run's implementation, diagnosis, report or
        outputs.
      breaking_artifact: >-
        A blind value differing from the producer's by more than 0.01 in the factor, at
        any of the three cells.
      holding_artifact: >-
        Three blind values and the derivation that produced them, filed before any
        comparison is made.

  every_joint_has_exactly_one_owner: true
  owners:
    TASK-20260913-31d530: [J1, J2, J3]
    TASK-20260913-7ca970: [J4, J5]
    TASK-20260913-3395e3: [J6-BLIND]

  blindness:
    within_round: true
    statement: >-
      No reviewer in this round may read another's report or attestation. The two
      validators own disjoint runs, so this costs them nothing they need. Each attests to
      exactly what it read.
    lifted_for: []
    lifted_for_rationale: >-
      Nothing is lifted. A later hardening round may legitimately let a reviewer see
      earlier verdicts; that would be recorded here with its reason and is not being done
      now.
    what_reviewers_may_read: >-
      The frozen specifications, the archived run packages of the run they own, the
      ledger, the knowledge corpus, and inputs/SEMAEV-2015-310. J6-BLIND's owner is
      restricted further; see blind_rederivation.blind_from.
    a_disclosure_this_plan_makes_deliberately: >-
      This plan states my priors and my arithmetic (f_legal = 0.9972 and f_base = 0.9103
      at n20; the three disagreeing columns; the 68.47 outlier). The two validators WILL
      read it, because a worked attack plan is worth more than blindness to the
      Coordinator's guess -- AGENTS.md requires the attack plan to say "where the
      Coordinator thinks it breaks". The cost is anchoring, and it is real: a reviewer
      told where I think the break is may find that break and stop. Both validators are
      therefore instructed to report any joint they judge SOUND as sound, and PD is
      reserved for the case where a reviewer merely confirms my arithmetic without
      testing the joint. J6-BLIND's owner does not read this file at all, which is what
      keeps one quantity anchor-free.

  proves_too_much:
    required: true
    statement: >-
      Controls before belief, applied to an argument rather than a measurement: run each
      run's own reasoning against an object for which its conclusion is KNOWN FALSE.
    objects:
      - owner: TASK-20260913-31d530
        object: >-
          A cell whose factor base carries NO F_q-rational points with x in V, so that
          L = 0 and the true yield is exactly zero. Cell n15 m5 t3 k3 in this very run is
          close to it: L = 3, f_legal = 0.0000, and its residual column reads "0/0
          (both)". Run the four-factor attribution there and state what it does. An
          attribution machinery that returns a finite, meaningful-looking ratio at a cell
          whose true yield is zero is wrong somewhere; one that returns 0/0 and says so
          is behaving correctly, and saying so is the deliverable.
        why_this_object: >-
          It is the degenerate corner the run already stumbled into and reported honestly.
          Using it as the known-false object costs nothing and tests the machinery at the
          one place its output is undefined.
      - owner: TASK-20260913-7ca970
        object: >-
          The run already reports two: `nearby_object_gg_argument_fails: true` and
          `nearby_object_trimoska_argument_fails: true`. Do NOT take those at face value.
          Verify that each control actually fails for the stated reason rather than
          failing for an incidental one, because a proves-too-much control that fails by
          accident provides no assurance while reading as though it does.
        why_this_object: >-
          A control the producer reports as passing is exactly the control nobody checks.
    failure_signature: >-
      Each argument must fail for the stated known-false reason; in particular, the
      zero-yield cell must produce an explicit 0/0 result rather than a finite ratio,
      and both nearby-object controls must fail for their stated structural reasons.
    what_a_failure_means: >-
      An argument that still goes through where its conclusion is known false is wrong
      somewhere nobody has read closely enough yet, and the finding is the argument, not
      the object.

  blind_rederivation:
    required: true
    assigned_to: TASK-20260913-3395e3
    quantity: >-
      Let V be a k-dimensional F_2-subspace of F_{2^n} used as the x-coordinate set of a
      factor base on E: y^2 + xy = x^3 + B over F_{2^n}. Let L be the number of
      F_{2^n}-rational points of E whose x-coordinate lies in V. Consider a model in
      which eq. (11) predicts the mean number of t-element decompositions of a target by
      charging |V| available x-values, while only L of them carry a rational point.
      DERIVE the exact multiplicative factor by which that substitution misstates the
      predicted mean, as a closed form in L, |V| and t; then EVALUATE it at t = 2 for
      k = 10, 11, 12 (so |V| = 1024, 2048, 4096) at n = 20, 22, 24 respectively, with B
      = 1 and A = 0, computing L yourself.
    blind_from:
      - experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/ratio-above-1-diagnosis.txt
      - experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/raw-result.json
      - experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/per-R-counts.json
      - experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/task-report.md
      - experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/summary-tables-E.txt
      - experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/summary-tables-T.txt
      - experiments/EXP-SEMBIN-354a75/code/
      - coordination/review/sembin-20260913-run2/review-plan.yaml
      - coordination/bus/messages/MSG-20260913-477ddd.yaml
      - coordination/review/sembin-20260913-run2/TASK-20260913-31d530/
      - coordination/review/sembin-20260913-run2/TASK-20260913-7ca970/
    why_blind_and_not_replication: >-
      Recomputing from the producer's own artifacts reproduces a wrong-but-self-consistent
      implementation faithfully, which is exactly the failure mode validation cannot see.
      The parent round proved this the expensive way: TASK-20260913-ec11c4's disagreement
      traced to the review plan's own parameter block giving a row width where it said
      variable count, and no recomputation from the producer's artifacts could have caught
      it (DEC-20260913-74e208 PD-1). Agreement here is then evidence about the quantity;
      disagreement localises to one of two named implementations.
    the_expected_value_is_deliberately_not_disclosed: >-
      Neither this plan nor the handoff states what the factor should come out to, nor
      names it, nor says how many cells the producer thought were affected. PD-2 of
      DEC-20260913-74e208 records that the parent plan disclosed its expected value and
      spent the blindness it was buying. The producer's value exists and is committed; the
      comparison is made by the Coordinator AFTER the blind value is filed, never by the
      re-deriver.
    note_on_the_statement_itself: >-
      The quantity is stated in terms of L, |V| and t and requires the re-deriver to
      compute L itself from the curve and the subspace. If the statement is insufficient
      to derive the quantity, THAT IS THE FINDING and it must be reported as such rather
      than resolved by reading a blind_from source.

  what_this_round_may_and_may_not_do:
    may:
      - report each owned joint as holds, breaks or inconclusive, with artifacts
      - find an instrumental defect more serious than anything in the Coordinator's prior
      - overturn any part of that prior, which is a result and not a problem
    may_not:
      - move a hypothesis status; only a committed Coordinator decision does that
      - write an evidence record; that is TASK-20260913-c44484 and TASK-20260913-e9cb45
      - measure or assert any degree (IMP-SEMBIN-ENGINE)
      - state anything about any curve's security, in either direction
      - treat an unreached cell, a timeout or an infrastructure failure as negative
        mathematical evidence
      - offer a whole-claim verdict from a fraction of the evidence

  escalation:
    condition: >-
      If a reviewer concludes that EXP-SEMBIN-92724f arm D's negative result is sound AND
      that it transfers to the disjoint-coset construction of Nagao ePrint 2015/984
      Section 7, that is a contradiction of a published polynomial-time claim's central
      mechanism and requires review-breakthrough at max effort under core rule 12.
    do_not_pre_empt_it: >-
      Arm D measured a coset-typed family under H-SEMBIN-c59e50's construction, NOT
      Nagao's EQS3/EQS4. Whether the two are the same object is an open question this
      round is not equipped to settle and must not assume in either direction. A reviewer
      noticing the connection should record it as a pointer for RQ-SEMBIN-9e8f82 and stop
      there.
    degradability: >-
      review-breakthrough is `degradable: false`. If it cannot be served, the goal stays
      active, the CLAIM stays un-promoted, and an impediment is recorded. Substituting an
      ordinary validator to get the claim moving is the silent downgrade the policy layer
      forbids.

  procedure_deviations:
    - id: PD-A
      raised: '2026-09-13'
      kind: plan_edited_after_a_reviewer_was_dispatched
      what: >-
        Commit 6b766bafa ("Fix run2 review control schema"), authored by a session other
        than the one that wrote this plan, renamed two fields of the proves-too-much block
        -- `proves_too_much_control` -> `proves_too_much` and its `assigned` list ->
        `objects` -- and added a `failure_signature` field. It landed at 19:08 UTC on the
        branch, AFTER TASK-20260913-31d530 had been dispatched at approximately 18:53 UTC
        against the earlier bytes.
      why_it_is_recorded_rather_than_absorbed: >-
        The plan's own note says a protocol that is silently deviated from is worth less
        than one never declared, because it still reads as rigorous. A reviewer that reads
        one version of its brief while the record shows another is exactly that situation,
        however small the edit. Recording it costs nothing and is the only thing that
        keeps the "written before any reviewer ran" claim in this file honest.
      what_changed_in_substance: >-
        Nothing. Both known-false objects, both owners, both rationales and the
        what_a_failure_means clause are byte-identical; the rename aligns the block with
        the field names tools/check_review_independence.py reads, and the added
        `failure_signature` restates in one sentence the failure condition the two object
        entries already spell out (the zero-yield cell must return 0/0 rather than a
        finite ratio; the two nearby-object controls must fail for their stated structural
        reasons). A reviewer working from either version owns the same joints and runs the
        same control.
      what_it_does_not_excuse: >-
        It does not make the plan mutable. Any FURTHER change that would alter a joint, an
        owner, an attack plan, a blindness boundary, or the blind_rederivation statement is
        not a schema repair and does not travel this way: it is a new plan or a superseding
        record under a new id, and this entry must not be cited as precedent for one.
      affects_blindness: false
      affects_blindness_reason: >-
        The edit touched no `blind_from` path, and TASK-20260913-3395e3 (J6-BLIND) reads
