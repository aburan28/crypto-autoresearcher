review_attestation:
  task_id: TASK-20260913-31d530
  review_round_id: REVIEW-SEMBIN-20260913-run2
  review_plan: coordination/review/sembin-20260913-run2/review-plan.yaml
  role: validator
  independent_session: true
  independent_session_evidence: >-
    This session ran as the validator for TASK-20260913-31d530 alone. It did not produce
    RUN-SEMBIN-1b9afe, did not author EXP-SEMBIN-354a75's specification or code, holds no
    Coordinator authority, and read no sibling reviewer's report or attestation. At the time
    of this review coordination/review/sembin-20260913-run2/ contained only
    review-plan.yaml, so no sibling report existed to read.

  inference:
    requested_policy: review-adversarial
    resolved_model_id: claude-opus-5
    resolved_model_id_provenance: >-
      Self-reported by the runtime to this session. Corroborated by
      `python3 -m orchestration.adapter resolve --role validator --independent-session`,
      which prints `review-adversarial -> anthropic:claude-opus-5 (effort=xhigh)` for this
      checkout. The session was not launched through `orchestration.adapter env`.
    backend: cursor_cloud_agent
    runtime: cursor_cloud_agent
    reasoning_effort: xhigh
    model_verified: false
    model_verified_note: >-
      `python3 -m orchestration.adapter doctor --probe` was not run from this session, so
      the identifier above is configuration plus self-report rather than a probe-verified
      fact. Recorded rather than asserted.
    fallback_used: false
    degraded_allowed: false

  joints_owned: [J1, J2, J3]
  joints_not_owned_and_not_read: [J4, J5, J6-BLIND]

  verdict:
    J1: breaks
    J2: breaks
    J3: breaks

  verdict_notes:
    J1: >-
      Breaks, but not for the reason in the Coordinator's prior. All three columns reproduce
      exactly and are mutually consistent as identities (A = G x f_mean_level to six
      decimals; D = f_dispersion x f_mean_level to six decimals), so none is definitionally
      vague. G is not a measured-over-eq.(11) ratio at all by its own definition. Sections
      A and G pool 20 configurations while C, D, E and F are the single B=1/low-degree
      exhaustive configuration, and the rendered diagnosis never states the change of
      population. The cost-bearing ratio is of A's kind, and the quoted value 0.9024 is the
      average of a bimodal population whose modes are 0.781 and 1.024, so it is the
      cost-bearing ratio for no instance measured. Its Wilson interval is 4-5x too narrow
      at cluster level.
    J2: >-
      Breaks, and the prior's diagnosis is overturned. f_base = 0.9103 is one configuration's
      -1.44 sigma draw, not the cell's property: it averages 0.9888/0.9998/1.0032 over 20
      configurations, which task-report.md section 11 step 2 already states correctly. The
      headline deficit is carried by f_dispersion, which is not one of the four factors, and
      f_dispersion is 0.79-0.82 for low_degree_polynomial subspaces against 0.99-1.01 for
      random_k_dimensional ones at the same cells with no dependence on B (Welch t = 8.6 to
      19.7). The shortfall's mechanism is over-dispersion of the per-target counts specific
      to the degree-<k x-coordinate window, not the curve's realized yield and not eq. (11)'s
      class-count bookkeeping. The executor's sign is not overturned; for the subspace the
      primary source specifies (paper_fulltext.md lines 539-545) it is stronger than
      reported, 18-22% rather than 9-10%.
    J3: >-
      Breaks as stated and survives as intended; the Coordinator's prior is confirmed and the
      derivation it asked for is supplied. From the definitions alone, L = 2r-1 with
      r-1 ~ Binomial(|V|-1, 1/2), so E[L] = |V|, sd(L) = sqrt(|V|-1),
      f_base = (1 + Z |V|^-1/2)^t, sd(f_base) ~ t |V|^-1/2, E[f_base] - 1 = O(t^2/|V|), and
      sign(f_base - 1) = sign(Z), which does not settle. All nine cells are consistent with
      this. Section E's sentence is wrong in three ways beyond non-monotonicity: it conflates
      an O(|V|^-1) deterministic factor with an O(|V|^-1/2) fluctuation; its table varies t
      while claiming a trend at fixed t; and "go to 1" is the wrong mode of convergence for
      f_base. Threshold: |V| > 1680 at 2 sigma to put f_base noise below the 9.76% headline
      effect, reached by n22 and n24 but not by n20; |V| > 1.98e6 (k >= 21) to put it below
      the 0.284% f_legal shortfall, reached by no cell in this contract.

  proves_too_much_control:
    assigned: true
    object: cell n15 m5 t3 k3, exhaustive configuration (B = 1, low-degree V), L = 3, true yield exactly zero
    executed: >-
      Imported mean_decomposition and probability_decomposition from
      experiments/EXP-SEMBIN-354a75/code/yield_diagnose.py and called them on that cell
      record, rather than reading the printed table.
    machinery_result: passes
    machinery_result_detail: >-
      residual_observed_over_product = None (rendered "0/0 (both)"), f_dispersion = nan,
      product = 0.0, observed = 0.0. No finite, meaningful-looking ratio is returned at a
      cell whose true yield is zero, and both routines announce the undefinedness.
    argument_result: fails
    argument_result_detail: >-
      Three things go through unchanged where their conclusion has no content.
      (1) attribution_closes returns True on the degenerate branch because it tests
      observed == 0.0, and section C's footer AND-s that vacuous True into "every cell's
      attribution closes to 1e-9: True", which is false as written at one of nine cells.
      (2) Section F prints 1 - f_legal = 1.000000 with no denominator column, in the same
      units as the 0.002840 at n20, where the denominators are 10 and 477753.
      (3) Section A reports sem P = 1.2400 with a 95% interval [1.0439, 1.4728] strictly
      above 1 at the same cell label where sections C, D and F report exactly zero yield;
      the exhaustive configuration contributes zero of section A's 129 hits. One label
      carries +24% and -100% simultaneously. The finding is the argument, not the object.

  instrumental_defect_found: false
  instrumental_defect_note: >-
    None. The enumeration is exhaustive where claimed (unreached_cells empty, 180/180
    configurations, order-independent under three permutation seeds per audited cell), the
    conservation identity is exact with no remainder at all nine cells, the four-factor
    residual closes to twelve decimals at all eight non-degenerate cells, every artifact and
    code digest matches, and the exhaustive pass agrees with 10000 independent draws on the
    same configuration at |z| <= 0.53 at all three m=t=2 cells. Every per-R count reconciled.
    The Coordinator's whole-round prior -- instrumentally sound, defects in the summarisation
    -- is confirmed for this run.

  coordinator_prior_outcome:
    J1: partly_overturned
    J2: overturned
    J3: confirmed
    whole_round_prior_on_instrumental_soundness: confirmed

  read_sibling_reports: false
  blind_from_respected: null   # not a re-derivation task; J6-BLIND is not mine
  procedure_deviations:
    - kind: anchoring_disclosed_by_the_plan
      detail: >-
        J2's attack asks for a criterion stated before the values are inspected, but the
        review plan pre-discloses f_legal = 0.9972 and f_base = 0.9103 at n20 in its prior,
        and the handoff directs reading the plan in full first. So the ordering protection
        was partly spent before this task began. Compensated by making the criterion
        decidable from the factor definitions alone and adding a second criterion decided by
        the run's own matched null rather than by this reviewer's judgement. Recorded rather
        than absorbed.
    - kind: read_a_path_outside_the_task_card_read_scope
      detail: >-
        Read coordination/bus/messages/MSG-20260913-477ddd.yaml and
        coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-9d649f/dispatch_queue.json, which
        are outside the card's declared read_scope (experiments/EXP-SEMBIN-354a75, ledger,
        knowledge, inputs/SEMAEV-2015-310). Both were named by the handoff: J1 asks whether
        the quoted headline is the cost-bearing ratio, which cannot be answered without the
        message, and the dispatch queue is the handoff record. Recorded for completeness.

  authority_boundaries_observed:
    hypothesis_status_changed: false
    evidence_record_written: false
    decision_record_written: false
    anything_promoted: false
    ledger_edited: false
    producer_artifact_repaired_or_edited: false
    committed_in_a_shared_worktree: false
    degree_measured_estimated_or_asserted: false
    statement_about_any_curve_security: false
    whole_claim_verdict_offered: false
    unreached_cell_or_timeout_treated_as_negative_evidence: false
    unreached_cells_found: none  # the run's unreached list is empty; verified

  sources_read:
    # binding contracts and the round's plan
    - AGENTS.md
    - agents/validator.md
    - docs/inventor-protocol.md
    - templates/research-records.md
    - coordination/review/sembin-20260913-run2/review-plan.yaml
    - coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-9d649f/dispatch_queue.json
    - tools/check_review_independence.py
    # the object under review, archived in 40e1cf727
    - experiments/EXP-SEMBIN-354a75/specification.yaml
    - experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/manifest.yaml
    - experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/ratio-above-1-diagnosis.txt
    - experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/raw-result.json
    - experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/per-R-counts.json
    - experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/artifact-digests.json
    - experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/task-report.md
    - experiments/EXP-SEMBIN-354a75/code/yield_diagnose.py
    - experiments/EXP-SEMBIN-354a75/code/yield_null.py
    - experiments/EXP-SEMBIN-354a75/code/yield_stats.py
    # the primary source
    - inputs/SEMAEV-2015-310/paper_fulltext.md
    # the executor's bus message, named by the J1 attack plan
    - coordination/bus/messages/MSG-20260913-477ddd.yaml
  sources_read_partially:
    - path: experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/task-report.md
      what: sections 10, 11 and 12 in full; the rest by targeted search for the artifact-free label, the variant names, and the T-side treatment
    - path: experiments/EXP-SEMBIN-354a75/specification.yaml
      what: lines 40-169 in full (cells, controls, independent variables, metrics, prediction, scale, tail checks); the remainder by targeted search
    - path: inputs/SEMAEV-2015-310/paper_fulltext.md
      what: lines 535-560 (the subspace definition and the low-degree preference) and a targeted search for the factor-base definition
    - path: experiments/EXP-SEMBIN-354a75/code/yield_stats.py
      what: lines 1-120 (ratio definitions, class counts, Wilson and mean intervals)
  sources_deliberately_not_read:
    - path: coordination/review/sembin-20260913-run2/TASK-20260913-7ca970/
      reason: sibling reviewer, J4/J5; blindness within the round. Did not exist at review time.
    - path: coordination/review/sembin-20260913-run2/TASK-20260913-3395e3/
      reason: sibling reviewer, J6-BLIND; blindness within the round. Did not exist at review time.
    - path: experiments/EXP-SEMBIN-92724f/
      reason: the other run in this round; owned by TASK-20260913-7ca970, not by this task.
    - path: experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/manifest_v2.yaml
      reason: >-
        additive schema completion (CORR-20260913-a99454) adding no fact; the handoff directs
        reading the archived manifest.yaml for substance. Its existence was verified by
        `git diff 40e1cf727 HEAD` and it was not used for any claim.

  commands_run_that_produced_the_numbers_in_report_md: >-
    All recomputation was read-only Python over the archived artifacts, run from
    experiments/EXP-SEMBIN-354a75/ and its runs/RUN-SEMBIN-1b9afe/ directory: SHA-256 over
    every artifact and code file against artifact-digests.json; independent recomputation of
    the pooled headline ratio, the dispersion factor, the per-family and per-B-mode splits
    and their cluster-level intervals from per-R-counts.json's E-side usable_point_multiset
    column; independent recomputation of the four-factor decomposition and the conservation
    identity from raw-result.json's integer fields; and one import of
    code/yield_diagnose.py's mean_decomposition and probability_decomposition to execute the
    attribution machinery on the known-false cell. Peak resident set stayed at 166 MB against
    a 2 GB budget. No artifact was written outside
    coordination/review/sembin-20260913-run2/TASK-20260913-31d530/.

  deliverables:
    - coordination/review/sembin-20260913-run2/TASK-20260913-31d530/report.md
    - coordination/review/sembin-20260913-run2/TASK-20260913-31d530/attestation.yaml
  handed_to: >-
    TASK-20260913-c44484, the Coordinator's ledger archive task. This report is not committed
    by its author and is not durable until that archive commits it.
