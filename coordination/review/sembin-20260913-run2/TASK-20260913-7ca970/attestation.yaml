  declared_breaking_artifacts_status:
    J4_denominator_or_population_mismatch: >
      CHECKED, does not fire as a break of the scored miss. Typed and untyped
      images live in the same group. m! is the large-V limit of the
      x-multiset cap, not the measured point-domain ratio, and mk <= n-3 holds
      at none of the seven cells. That is the convention, disclosed in the
      run's layer D1 and restated in report.md. The scored ratio still misses
      m! at every cell under every-draw scoring.
    J4_degenerate_draw_rule_non_neutral: >
      DOES NOT FIRE. 28 empty typed draws have ratio 0; including them lowers
      the median and cannot create a within-10% cell. All 28 are additive.
    J4_cell_sampled_where_exhaustion_claimed: >
      DOES NOT FIRE. 0 unreached. Domain, fibre-mass and binomial identities
      close. One independent brute-force draw agrees.
    J5_argmin_does_not_reproduce: >
      DOES NOT FIRE for the unceiled closed form. Independent dT/dm gives
      m = n ln 2; numeric argmin 69 at n=100 and 396 at n=571.
    J5_depth_vanishes_under_other_normalisation: >
      FIRES as a scope fact, not as a break of the unceiled closed form.
      Ceiled + capped yield puts the global argmin at the boundary at n=571
      (depth 0 vs m=n) and at a two-point tie {50, n} at n=100 (depth 0).
      Report.md records that the 0.086-bit min is unceiled-specific and is
      flatness. The joint's named closed form still holds.

