# Additive companion to review-plan.yaml for REVIEW-SEMBIN-20260913-run2.
#
# WHY A SEPARATE FILE. review-plan.yaml is bound BY CONTENT HASH in the ledger
# archive TASK-20260913-c44484 (commit be86af9a8). An entry appended to it after
# that commit -- PD-D, written at 20:05Z -- changed the bytes the archive names,
# and tools/research_dispatch.py correctly refused the whole batch with
# "content hash mismatch". The plan is restored to its archived bytes in the
# same commit that adds this file; PD-D lives here from now on. The plan's own
# text already says any further change to it "is a new plan or a superseding
# record under a new id"; this is that record, scoped to procedure deviations.
#
# This file is itself write-once. A later deviation goes in a new file.
review_plan_addendum:
  for_review_plan: coordination/review/sembin-20260913-run2/review-plan.yaml
  review_round_id: REVIEW-SEMBIN-20260913-run2
  bound_plan_sha256: 45ec4b3a6293474de69c84dd8075c8380d783a232deed35cce5f9d27808d09b1
  recorded_by: coordinator
  recorded_at: '2026-09-13T20:20Z'
  procedure_deviations_addendum:
    - id: PD-D
      recorded: '2026-09-13T20:05Z'
      what: >-
        The EXP-SEMBIN-354a75 half of this round was composed and ledger-archived
        (TASK-20260913-c44484: EV-SEMBIN-d40877, DEC-20260913-3b51c8) BEFORE
        TASK-20260913-7ca970 (J4, J5, EXP-SEMBIN-92724f) was dispatched. The
        joint_outcomes block of the plan, the two ledger records, and the batch
        queue's completion notes therefore state J1, J2, J3 and J6-BLIND verdicts
        in files that lie inside TASK-20260913-7ca970's read_scope.
      why_it_is_a_deviation: >-
        within_round blindness forbids a reviewer reading a sibling's REPORT. No
        report is exposed, but a one-word verdict is a fraction of one, and the plan
        promised each reviewer would attest to exactly what it read. Recorded rather
        than absorbed so the composition of J4/J5 can weigh it.
      why_it_was_done_anyway: >-
        The two validators own disjoint joints on disjoint runs by design; J1-J3
        concern eq. (11)'s yield model on RUN-SEMBIN-1b9afe and J4-J5 concern the
        coset-typed image ratio and the typed objective on RUN-SEMBIN-cbd770.
        Nothing in the exposed verdicts bears on either J4 or J5. Holding the
        354a75 half un-archived until 7ca970 returned would have kept a finished
        hypothesis transition and two review reports uncommitted for the duration
        of another review, which AGENTS.md "Durable research commits" forbids.
      instruction_to_TASK-20260913-7ca970: >-
        Read the plan's prior, joints J4 and J5, blindness, proves_too_much and
        blind_rederivation sections. Do NOT read joint_outcomes,
        procedure_deviations_addendum, EV-SEMBIN-d40877, DEC-20260913-3b51c8, or any
        file under TASK-20260913-31d530/ or TASK-20260913-3395e3/. If you did read
        any of them before seeing this, say so in your attestation; that is not a
        failure, an unrecorded read is. (This instruction was also given verbatim
        in the dispatch brief.)
      affects_blindness: partial
    - id: PD-E
      recorded: '2026-09-13T20:20Z'
      what: >-
        PD-D was first appended to review-plan.yaml itself, in commits 666eabb61 and
        d4112b3fd, AFTER the plan's bytes had been bound by TASK-20260913-c44484.
        The dispatcher refused the batch on the hash mismatch. The plan is restored
        to its archived bytes and PD-D moved here. TASK-20260913-7ca970 was
        dispatched while the appended version was on disk and may have read PD-D
        in situ; the text is identical, so what it read is what is recorded.
      why_it_is_recorded: >-
        A Coordinator editing a hash-bound coordination record after binding it is
        exactly the failure the content-first archive exists to catch. It caught
        it. Recording the catch is what keeps "archives bind to CONTENT first"
        honest; hiding it by rebinding would not.
      what_was_not_done: >-
        The archive's path_sha256 was NOT rewritten to the new bytes, and the
        ledger commit was NOT amended or rebased.
