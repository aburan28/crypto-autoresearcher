  # ---------------------------------------------------------------------------
  tier:
    policy: review-breakthrough
    reasoning_effort: max
    degradable: false
    subagent_bindings: validator-breakthrough (TASK-20260928-d5024b, TASK-20260928-95abde); red-team-breakthrough (TASK-20260928-a75ba7)
    ruling: >-
      review-breakthrough at max. DEC-20260928-63addc tripwire TW-01 names
      IDEA-20260926-20ba8f claim (C), whose clause that an oracle below T_gen
      would be the first ECDLP algorithm below the S T^2 = N_prime line is a
      breakthrough-shaped statement, and routes the design round itself to
      this tier (DEC-20260924-99ce20 DEP-5 precedent). The contract must keep
      that clause out of every outcome; a protocol that could later be read as
      placing index calculus below the generic frontier on a deployed row is
      what AGENTS.md rule 12 protects.
    unservable_rule: >-
      If review-breakthrough cannot be served at max for any of the three
      review cards, that card is not dispatched, the impediment is recorded on
      the still-active goal, and the contract stays unapproved. The tier is
      never lowered and no review-adversarial session substitutes. A backend
      substitution that fully meets the max floor is recorded as fallback_used
      and is not a downgrade.
    tripwires:
      - id: TA-1
        fires_when: >-
          The contract, the audit sheet, the hypothesis or any review report
          states or implies, as an outcome, a prediction or a success
          criterion, that an oracle sits below T_gen at n = 131, that index
          calculus is below the generic preprocessing frontier on any deployed
          row, or that any algorithm is the first below the S T^2 = N_prime
          line (DEC-20260928-63addc S1 C3).
        effect: >-
          The reviewer finishes its joint, flags TA-1 at the top of its report
          and stops. The composer records revise on C3 and does not approve
          while the sentence stands. A genuine claim of that kind, if ever
          made on evidence, is reviewed in its own review-breakthrough round
          with independent replication, never in this one.
      - id: TA-2
        fires_when: >-
          Any record in the round contradicts a validated evidence record or a
          promoted finding, in particular KN-FIND-aa2efc as scoped by
          CORR-20260928-4cb669, EV-ICPERF-10c5fc as relabelled by
          CORR-20260928-5d81df, or KN-FIND-007.
        effect: >-
          Stop and report. Composition is suspended until a dedicated
          review-breakthrough contradiction round is opened by a new
          Coordinator decision.
      - id: TA-3
        fires_when: >-
          The producer designed the prime-field engine cells of the record's
          Stage 2 (routed to GOAL-ICPERF-e6b6a4 by PTR-ICPERF), any run at
          deployed parameters, or priced any m >= 4 budget against D1
          (CORR-20260928-4cb669), or the fixture of C4 exists as prose rather
          than code.
        effect: The composer applies K-revise-defect. No approval.
      - id: TA-4
        fires_when: A review card of this lane cannot be served at review-breakthrough at max.
        effect: See unservable_rule. The card is not dispatched and the contract stays unapproved.
    tripwire_note: >-
      Pre-declared, so escalation is a rule applied and not a judgement made
      after reading the reports.

  # ---------------------------------------------------------------------------
  claim_under_review:
    statement: >-
      H-BINSTD-6e4713 and EXP-BINSTD-532d7f, as frozen by TASK-20260928-7a6424,
      together with the proof_search_map audit sheet carrying the committed
      Z/NZ fixture code, are a complete protocol for IDEA-20260926-20ba8f as
      scoped by DEC-20260928-63addc S1. Stage 0 (zero compute) recomputes claim
      (B) and claim (C) of the record in Python: the cap locus B_cap per m, the
      generic frontier column T_gen = sqrt(N_prime / S) and P_gen at m in 4, 5,
      6, 8, 16 with N_prime = r/262, the identity P_IC = P_gen at C = T_gen,
      the statement that the LA term sits below P_gen at every m >= 4, the
      m = 5 crossing window in g restated against the pinned D3 column with
      both columns shown, and the m = 4 window the record leaves open, stated
      exactly; and carries the IDEA-20260926-4b65e3 Stage 0 section (the
      pinned D3 column 11.01, 33.08, 37.39, 42.52 bits at m = 4, 5, 6, 8 beside
      4b65e3's mu = 1 values 11.0, 32.4, 36.7, 42.2, the 1.58-attempt factor
      explained and the 0.34-bit residual at m = 8 resolved or recorded as a
      definitional difference). Stage 1 is the instrument gate as a frozen
      fixture (full-log-vector solve and shared-table multi-target rho on a
      relabelled Z/NZ group of about 2^20 with a random base of 2^7 elements;
      both exponents within 0.1 of -1 and -0.5 before any curve cell is read).
      Stage 2 is the heuristic validation on binary cells only (the n = 19
      CERTBIN cell and the Koblitz n = 19 sibling at m = 2 with oracle A, L in
      1, 4, 16, 64, 256 fresh targets with certificates, 30 seeds for rho per
      L, shared and per-target operations counted separately, usable fraction
      and retries per target, the pooling constant against IDEA-20260920-2e37b3's
      toy range). Stage 3 files the preprocessing column into the table beside
      the single-target column, conditional on H1, H2 and on C. The protocol
      discharges C1-C8 and every KN-TECH-080 audit, carries approved_by null,
      and is complete enough for Coordinator approval under standing
      authorization. Zero runs in this batch.
    conditions_to_discharge: >-
      Read verbatim from DEC-20260928-63addc selected S1 scope, absorbs,
      decision_it_changes and design_conditions C1-C8. They are not
      paraphrased further here.
    object_under_review:
      paths:
        - ledger/hypotheses/H-BINSTD-6e4713.yaml
        - experiments/EXP-BINSTD-532d7f/specification.yaml
        - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-d34db1/design/TASK-20260928-58d044/proof-search-map-audit.yaml
