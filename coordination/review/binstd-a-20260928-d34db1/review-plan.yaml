      either side.

  # ---------------------------------------------------------------------------
  composition:
    who: >-
      The Coordinator, in TASK-20260928-ae6f2a, in a fresh session that did
      not run TASK-20260928-58d044 and did not compose DEC-20260928-63addc or
      author DEC-20260928-65c6d7. No reviewer votes on the whole contract.
    independence_check: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/binstd-a-20260928-d34db1/review-plan.yaml --reports
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-d34db1/reviews/TASK-20260928-d5024b/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-d34db1/reviews/TASK-20260928-a75ba7/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-d34db1/reviews/TASK-20260928-95abde/,
      run by the top-level session and recorded in DEC-20260928-cec92e
      whatever it reports. The --blind-history check is uncheckable for this
      batch (no protected-digest file) and is recorded as such (PD-R4).
    custody_without_seal: >-
      No seal card. Before TASK-20260928-ae6f2a is launched, the top-level
      session computes sha256 of the six declared report files of this lane
      and pastes them into the launch prompt. The composer records them
      verbatim in its composition worksheet as its first act, before it reads
      any report. TASK-20260928-649630 must reproduce the same six digests; a
      mismatch voids the composition.
    icperf_objection_check: >-
      DEC-20260928-63addc PTR-ICPERF says an objection from GOAL-ICPERF-e6b6a4
      on the binary Stage 2 cells is heard by bus before the S1 contract is
      approved. Before the composer is launched the session runs
      tools/agent_bus.py inbox --as coordinator and pastes any message from
      the ICPERF owner referencing IDEA-20260926-20ba8f or PTR-ICPERF, or
      states there is none. K-approve requires that statement or a ruling on
      the objection inside the composing decision.
    keys:
      K-approve: >-
        J1 to J4 hold; J5 agrees with the contract's frozen column and window
        within the agreement tolerance; every PTM meets its failure
        signature; no tripwire fired; the ICPERF objection check is recorded
        with no unruled objection. DEC-20260928-cec92e then approves
        EXP-BINSTD-532d7f under the AGENTS.md standing user authorization and
        names as its first next action the opening of an execution batch
        whose executor card is minted then. Approval asserts nothing about any
        curve's security, any oracle's cost, or index calculus against rho.
      K-revise-defect: >-
        Any of J1 to J4 breaks, or a field approval requires is missing, or
        TA-3 fired. Decision revise, each defect listed with its joint and
        breaking artifact, and a revision design card in a new batch as the
        first next action.
      K-indeterminate: >-
        J5 disagrees with the contract beyond the tolerance on any quantity,
        or reports a choice that changes one. Decision revise on C2, naming
        the quantity; neither implementation is preferred.
      K-impediment: >-
        The CGK source (C5) is unreachable and the contract records the
        impediment, keeps H2's supporting result marked as a corpus entry
        only, and forbids substitution. Not a defect by itself; approval is
        permitted if every other key of K-approve holds. A contract that
        presents KN-LIT-013's corpus entry as a source read is
        K-revise-defect.
      K-infra: >-
        A reviewer could not run a joint. That joint reads inconclusive. No
        approval while any joint is inconclusive. An infrastructure failure
        is never negative evidence about the contract's mathematics or any
        curve.
      any_tripwire: See tier.tripwires. The composer applies the tripwire's stated effect.
    selection_point_duties: >-
      The composing decision is a selection point of GOAL-ECDLP2M-001
      (DEC-20260928-63addc holds note): it re-ranks HOLD-X1 to HOLD-X13 and
      HOLD-A to HOLD-G, applies DEC-20260925-41f6dc and DEC-20260925-a84b16 if
      they are on origin/main at its launch, and re-ranks the EXP-QSP-70b731
      custody successor (DEC-20260928-65c6d7 R-CUSTODY) without displacing its
      claim on slot 1 unless a reason is recorded.

  procedure_deviations:
    - id: PD-R1
      severity: material
      what: >-
        The prior is informed, not blind. The session that wrote this plan
        read IDEA-20260926-20ba8f and IDEA-20260926-4b65e3 in full, including
        their hand-derived columns.
      consequence: >-
        Concurrence of TASK-20260928-d5024b with those values is weak
        corroboration; J5 is the structurally blind check.
    - id: PD-R2
      severity: disclosed
      what: The object did not exist when this plan was written; it is bound by the producer snapshot.
    - id: PD-R3
      severity: disclosed
      what: >-
        No seal card and no blind-inputs file. The blind quantities and
        parameters are carried in the blind card itself
        (ledger/handoffs/TASK-20260928-95abde.yaml), which is the one
        batch record on its whitelist; this departs from the BATCH-7d29e8
        form, where a separate blind-inputs.yaml existed, because the opening
        act's write set was fixed to the plans, the queue, the cards, the
        decision and the goal head.
    - id: PD-R4
      severity: disclosed
      what: >-
        No protected-digest file is written for this batch, so
        tools/check_review_independence.py --blind-history is uncheckable
        for J5, never passed. Blindness from commit messages and PR text rests
        on the card's ban on every git history command and all PR text.
  procedure_deviations_note: >-
    Four at writing. Later departures are recorded in DEC-20260928-cec92e or
    in an addendum, never absorbed.
