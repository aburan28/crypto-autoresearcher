  # ---------------------------------------------------------------------------
  coordinator_prior:
    per_joint: >-
      J1 (Stage 0 recomputation and the pinned comparator) holds with
      probability about 0.7; if it breaks, I expect it on the m = 4 window,
      whose shared cost is LA-dominated and which the record itself declined
      to state by hand, or on the 0.34-bit residual at m = 8 being labelled
      resolved when it is a definitional difference. J2 (fixture as code,
      completeness, custody) holds with probability about 0.5; this is where I
      expect the round to break, on C4: the Z/NZ gate committed as prose or as
      a plan rather than as runnable code with its pass criterion, or on the
      full-log-vector solve being assumed of linalg.py, whose incremental
      elimination the record says stops at the first pinning row. J3
      (comparator, constants, the first-below-the-line clause, H1, H2,
      provenance) holds with probability about 0.6; if it breaks, I expect the
      first-below-the-line clause to have leaked into the outcome table or a
      prediction (TA-1), or the window's upper end to rest on the recalled
      Kuhn-Struik range rather than on the Bernstein-Lange table. J4 (R2
      boundaries, exclusions, memory beside time, proves-too-much) holds with
      probability about 0.75. J5 (blind) agrees on T_gen at every m within
      0.1 bit with probability about 0.9, on the identity with probability
      about 0.95, and on the m = 5 window bounds within 1 bit with probability
      about 0.7, the gap being whether the LA term and the 1.58 factor are kept
      or dropped in the quadratic.
    overall: >-
      Probability about 0.3 that the round composes to approve on this first
      design. The most likely outcome is revise on C4 (the fixture) or C3 (the
      clause), each a cheap remedy.
    where_i_think_it_breaks_if_it_breaks: J2 on C4, then J3 on C3, then J1 on the m = 4 window.
    what_would_overturn_this_prior_most: >-
      (1) J5 disagreeing with the contract's T_gen column by more than 0.5 bit
      at any m, which would say one of two implementations of elementary
      arithmetic is wrong. (2) J1 finding that the LA term is not below P_gen
      at m = 4, which would void the identity's consequence at the row where
      the relaxation is largest. (3) A reviewer producing a published ECDLP
      algorithm below the S T^2 = N line on some curve, which withdraws the
      first clause of claim (C) (the record's own fifth falsification
      condition) while the column stands.
    informed_prior_disclosure: >-
      The prior is informed, not blind (PD-R1). The session that wrote this
      plan read IDEA-20260926-20ba8f and IDEA-20260926-4b65e3 in full,
      including their hand-derived columns, and DEC-20260928-63addc and
      CORR-20260928-4cb669, which pin the comparator.

  # ---------------------------------------------------------------------------
  joints:
    - joint: >-
        J1 -- Stage 0 recomputation and the pinned comparator (C1, C2, the
        4b65e3 section). The contract commits, in Python, B_cap(m) =
        (m! 2^131)^(1/m); T_gen(m) = sqrt(N_prime / B_cap) and P_gen(m) =
        sqrt(N_prime B_cap) at m in 4, 5, 6, 8, 16 with N_prime = r/262; the
        identity P_IC = P_gen at C = T_gen; the LA term m B_cap^2 below P_gen at
        every m >= 4; the m = 5 window in g restated against the pinned D3
        value 33.08 bits with the record's 32.4 shown beside it; the m = 4
        window stated exactly with its LA-dominated shared cost; the rho
        convention sqrt(pi r/(4 x 131)) = 2^60.8090 with the record's
        sqrt(pi N_prime/2) form shown equivalent; and the 4b65e3 Stage 0
        section with the 1.58-attempt factor (0.66 bit) and the 0.34-bit
        residual at m = 8 resolved on paper or recorded as a definitional
        difference. The single-target comparator is D3, never D1.
      assigned_to: TASK-20260928-d5024b
      attack_plan: >-
        (i) Recompute every column above with your own code at exact
        rational or high-precision arithmetic and compare to the contract's
        committed values to 0.05 bit; report every deviation with its field.
        (ii) Recompute the m = 5 window without dropping the LA term
        5 B_cap^2 and without dropping the 1.58 factor, at g in 0, 6, 10, 13,
        13.2 and at both comparator values; state whether the contract's
        bounds hold to 1 bit and whether its critical g is right. (iii) Solve
        the m = 4 window yourself with the shared cost written in full and
        compare with the contract's exact statement; if the contract still
        leaves it open or states it as a hand figure, that breaks C2's
        recomputation obligation. (iv) Check the 4b65e3 section: derive
        1/(1 - e^-1) = 1.58 and its 0.66 bit; recompute the m = 8 residual
        between 42.52 and 42.2 plus 0.66 and say whether the contract's
        reconciliation is arithmetic or a label. (v) Grep the three files for
        4.41, D1 and gap; any use of D1 as a per-attempt budget breaks C2.
        Where I think it breaks: (iii), then (iv).
      breaking_artifact: >-
        A recomputed column differing from the contract by more than 0.05
        bit; a window bound off by more than 1 bit or a critical g off by
        more than 0.2; an m = 4 window not stated exactly; a residual labelled
        resolved without the arithmetic; D1 used as a budget.
    - joint: >-
        J2 -- Fixture as code, protocol completeness and custody (C4, C5 for
        the numbered heuristics, C6, C8). The Z/NZ gate is committed as
        runnable code in the audit sheet with its pass criterion (both fitted
        exponents within 0.1 of -1 and -0.5) stated before execution and
        placed in the stopping and invalidation rules so that no curve cell is
        read before it passes; the full-log-vector solve and the shared-table
        multi-target rho are specified precisely enough to implement (the
        incremental elimination in linalg.py stops at the first pinning row
        and must be extended, as the record says); the Stage 2 cells are
        defined with orders recomputed at setup; certificates on every log;
        seeds enumerated; H1 and H2 carry numbered statements and validation
        plans with sample, comparison and tail; memory (advice S = B_cap words
        in bytes per m, the LA term) beside every time figure; every field
        approval requires is present; status review_required; approved_by
        null with an approval block naming DEC-20260928-cec92e; zero runs;
        the three files hash to the snapshot.
      assigned_to: TASK-20260928-d5024b
      attack_plan: >-
        (i) Extract the fixture code from the audit sheet and read it
        statically; state whether it is runnable in principle (imports,
        entry point, seed handling, the two fits, the pass test) and whether
        its pass criterion is in the specification's rules, not only in
        prose. Do not run it as an experiment; a syntax check or a dry import
        is a review computation and is recorded as such. (ii) Check that the
        rules forbid reading any curve cell before the gate passes and
        invalidate the run if it fails. (iii) Check the n = 19 CERTBIN cell
        and the Koblitz n = 19 sibling are defined with their orders to be
        recomputed and primality proved at setup, not cited from hand
        arithmetic. (iv) List every field approval requires and mark each
        present or absent; hash the three files. (v) For H1 and H2, check the
        validation plan names the sample, the predicted distribution, the
        comparison and the tail check, and that the transfer assumption is
        stated as a heuristic. (vi) Check every time figure has its memory
        figure beside it. Where I think it breaks: (i).
      breaking_artifact: >-
        Fixture code absent, non-runnable in principle, or with a pass
        criterion not in the rules; a curve cell readable before the gate; an
        order cited rather than recomputed; a missing approval field; a
        non-null approved_by; a hash mismatch; a time figure without memory.
    - joint: >-
        J3 -- The comparator and its constants, the first-below-the-line
        clause and its routing, the crossing window's validity, H1 and H2,
        and provenance (C3, C5, C7). The S T^2 = N_prime frontier is stated
        with its constants disclosed (CGK's Omega-tilde slack; Bernstein-Lange
        1.24 and 1.77) inside the 0.5-bit tolerance; the window's upper end
        above 2^30 rests on the Bernstein-Lange table, with Kuhn-Struik's
        validity range recalled and marked; the contract attempts CGK's bound
        statement at source (KN-LIT-013 is a corpus entry and does not
        discharge H2's supporting result) and records retrieved or the
        impediment; the retry factor 1/(1 - m e^(-mR/B)) and the assumption
        that LA returns the full log vector are stated as model assumptions;
        forward guidance (iii) on the orbit-quotient advice size B/131 is a
        per-orbit framing labelled conditional under CORR-20260925-649e25 and
        cited only as a dependency; the first-below-the-line clause of claim
        (C) appears nowhere as an outcome, prediction or success criterion.
      assigned_to: TASK-20260928-a75ba7
      attack_plan: >-
        (i) Quote every sentence in the three files that mentions the generic
        frontier, the S T^2 line, first, below T_gen or beats; classify each
        as conditional statement, design figure or outcome; any outcome
        classification fires TA-1. (ii) Rebuild the window argument from the
        two generic laws and say which law carries the upper end; if the
        contract's upper end rests on Kuhn-Struik above N_prime^(1/4) without
        the table, that breaks C5's marking. (iii) Attempt CGK (KN-LIT-013's
        source) yourself and record what you reached with provenance; compare
        the contract's statement of the bound with the source. (iv) Construct
        the observation collision of the record's audit 2: an over-complete
        toy relation set in which every fresh target decomposes at first
        attempt while the shared cost is setup-dominated; feed it to the
        contract's reporting rules and say whether the usable fraction,
        retries and the Z/NZ control separate it from genuine amortisation.
        (v) Check the CORR-20260925-649e25 label on forward guidance (iii).
        Where I think it breaks: (i).
      breaking_artifact: >-
        A sentence stating the first-below-the-line clause as an outcome; an
        upper window end resting on an unmarked recalled range; a CGK
        statement attributed without a read or with provenance mislabelled; a
        collision the reporting rules misread; an unlabelled per-orbit
        movement.
    - joint: >-
        J4 -- R2 boundaries, exclusions, and the proves-too-much controls
        (C6, C8). The prime-field engine cells of the record's Stage 2 are
        excluded and named as ICPERF's to rank; no deployed-parameter run is
        designed; the IDEA-20260926-1ddce2 size column is cited by id and not
        re-derived; the binary Stage 2 cells are the heuristic validation of
        the column (DEC-20260928-63addc DEP-4 reading), not a phase-cost row;
        every excluded read of the card is respected in the contract's own
        inputs; PTM-A to PTM-C below meet their failure signatures.
      assigned_to: TASK-20260928-a75ba7
      attack_plan: >-
        (i) Perform PTM-A to PTM-C against their failure signatures with the
        contract's own cost rules in your own script. (ii) Search the contract
        for any prime-field cell, engine reference or deployed-parameter run.
        (iii) Check that the 1ddce2 column is cited, not re-derived. (iv)
        Quote every sentence that states or implies more than a second budget
        row, a structural statement and toy exponents. Where I think it
        breaks: PTM-B, if the contract's L = 1 slice is not term-for-term the
        pinned single-target verdict.
      breaking_artifact: >-
        A PTM object on which the rules reach the known-false conclusion; a
        prime-field or deployed cell designed in; a re-derived 1ddce2 column;
        an over-scoped sentence.
    - joint: >-
        J5 -- Blind re-derivation of the deployed arithmetic. Two
        implementations that share nothing produce the same T_gen at m in 4,
        5, 6, 8, 16 from N_prime = r/262 and B_cap, the same verdict on the
        identity P_IC = P_gen and on the LA term, and the same m = 5 window
        bounds. See blind_rederivation below.
      assigned_to: TASK-20260928-95abde
      attack_plan: >-
        See blind_rederivation and the quantities block of
        ledger/handoffs/TASK-20260928-95abde.yaml. The re-deriver is told what
        to compute and not how, and reads no producer artifact.
      breaking_artifact: >-
        Any value that differs from the contract's frozen column beyond the
        agreement tolerance. That localises the fault to a model choice or one
        of two named implementations.

  joint_ownership_note: >-
    Five joints, three owners, none unowned, none shared. TASK-20260928-d5024b
    (validator-breakthrough) owns J1 and J2; TASK-20260928-a75ba7
    (red-team-breakthrough) owns J3 and J4 and the proves-too-much controls;
    TASK-20260928-95abde (validator-breakthrough, a separate session) owns
    only J5 and reads a whitelist that excludes every producer artifact and
    every record that states the values it re-derives.

  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      Not lifted. No reviewer reads another reviewer's report, in this lane
      or lane B. J1's recomputation must not reach J5 before J5 returns.
    excluded_from_every_reviewer: See excluded_reads_for_every_party above.

  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20260928-a75ba7
    objects:
      - id: PTM-A
        object: >-
          An oracle with per-attempt cost exactly C = T_gen(m) at matched
          advice S = B_cap, at each m in 4, 5, 6, 8, 16, fed to the contract's
          cost rules.
        known_truth: >-
          Its precomputation equals P_gen exactly (the identity) and its
          online cost 1.6 C sits at or above T_gen; it is on the generic
          frontier, not below it. A rule that reports it below the frontier,
          or that reports a relaxation for it, has proved too much.
      - id: PTM-B
        object: >-
          The L = 1 slice of the contract's multi-target cost at m = 4 on
          ECC2K-130 with the record's plain-base sub-cap optimum.
        known_truth: >-
          L = 1 reproduces the single-target product law term by term: the
          per-attempt budget that ties matched rho is the pinned D3 value
          2^11.01 (CORR-20260928-4cb669), and no amortisation exists. A rule
          that reports any budget other than the pinned single-target column,
          or any advantage, at L = 1 has proved too much.
      - id: PTM-C
        object: >-
          The m = 5 window at oracle excess g = 14 bits (above the record's
          critical 13.2), and the relabelled Z/NZ control versus the ordinary
          and Koblitz n = 19 cells for the amortisation exponent.
        known_truth: >-
          At g = 14 the window is empty; a rule that reports a nonempty window
          there has proved too much. The L^-1 law is group-generic; a rule
          that predicts a different exponent on the Koblitz cell than on the
          ordinary cell or on Z/NZ has proved too much, since no Frobenius is
          used.
    failure_signature: >-
      A correct protocol keeps each known-false conclusion out of reach in its
      rules. PTM-A reads on the frontier with zero relaxation. PTM-B reads the
      pinned single-target verdict with no advantage. PTM-C reads an empty
      window at g = 14 and identical predicted exponents on all three cells. A
      rule that reports otherwise on any of them has proved too much.
    how_to_run_it: >-
      Review computations in your own script at zero compute (these are
      arithmetic on the contract's rules). They mint no RUN-*, write no
      evidence record and never execute any EXP-BINSTD-532d7f driver as an
      experiment. Put every script and output in computations.json. If a PTM
      would amount to a new experiment, record it not performed with the
      reason.

  # ---------------------------------------------------------------------------
  blind_rederivation:
    required: true
    assigned_to: TASK-20260928-95abde
    quantity: >-
      Q0 to Q5 exactly as the quantities block of
      ledger/handoffs/TASK-20260928-95abde.yaml states them. Q0 is every
      undetermined choice; Q1 is B_cap(m) in bits; Q2 is T_gen(m) and P_gen(m)
      in bits at m in 4, 5, 6, 8, 16 with N_prime = r/262; Q3 is the identity
      check and the LA-term comparison; Q4 is the m = 5 window bounds in log2 L
      at the stated g values and both comparator values, with the LA term and
      the 1.58 factor kept; Q5 is the rho reference in bits.
    parameters: See the quantities block of that card. The card carries the statement and the parameters and no computed answer.
    blind_from:
