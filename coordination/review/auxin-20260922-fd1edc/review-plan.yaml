  # ---------------------------------------------------------------------------
  # THE PRIOR. Recorded before any report returns.
  # ---------------------------------------------------------------------------
  coordinator_prior:
    what_the_escalate_is: >-
      E(r) is the base-r logarithm of Cheon's auxiliary-input cost expression
      sqrt(m/d) + sqrt(d), minimized over divisors d of m = r - 1 or r + 1
      (DEC-20260802-204 B032-C4/C5, frozen in the specification). Since
      sqrt(m/d) + sqrt(d) >= 2 m^{1/4} for every d, E(r) >= (1 + log2(m)/4) /
      log2(r), which is about 0.25 + 1/log2(r) -- 0.2539 at 256 bits. That
      floor IS the known Cheon balanced exponent 1/4 with its constant factor 2
      written as an exponent. The rows at 0.2539 (NIST-P-256, secp256k1, BN254-r,
      BLS12-381-r) sit essentially on the floor, meaning m has a divisor within a
      small factor of sqrt(m); brainpoolP256r1 at 0.2556 is about a factor
      1.35 above it. The trigger compared E(r) against the preregistered
      e_escalate_ceiling 0.40 (specification parameters and
      preregistered_prediction), and fired because six complete-lattice rows are
      at or below it. So, to the question put to this round: YES, E(r) ~ 0.254 on
      P-256 / secp256k1 / BLS12-381 is the known auxiliary-input exponent,
      realised because those r +/- 1 happen to have divisors near sqrt(r). It is
      conditional on holding [x^d]P for THAT d -- a 126-128-bit d on the flagged
      rows -- and says nothing about an attacker holding only P and [x]P.
    what_i_expect_the_REVIEW_to_find:
      arithmetic: >-
        That the table is arithmetically right. I expect J1 (pins), J8 (blind
        re-derivation) and the value half of J2 to hold: the r values are the
        standard orders, the factorizations multiply back, and an independent
        implementation reproduces the per-branch minima to many digits.
      certificate_strength: >-
        That J2 finds a CERTIFICATE-STRENGTH defect rather than a value error:
        both arithmetic paths test primality with the same library call
        (sympy.isprime, BPSW), so the "second check" the contract asks for is
        the same check twice, and every "certificate" is a probable-prime
        verdict. I expect no factor to be wrong; I expect the certificate claim
        to be overstated.
      escalate_set: >-
        That J5 BREAKS, in both directions at once. (a) UNDER-INCLUSIVE under
        the literal rule: the frozen rule is "if any deployed E(r) <= 0.40", and
        experiments/EXP-AUXIN-7e2e3d/implementation/driver.py lines 707-715 fire
        only on quantity_kind == "E(r)". But an E_bound is an upper bound on the
        true E(r) (the producer's own bound_direction says so), so NIST-P-384
        (<= 0.3925), brainpoolP384r1 (<= 0.3972) and Ed25519-L (<= 0.3570, on a
        COMPLETE r+1 branch) already satisfy the rule. Read literally the set is
        9 of 10, not 6; only NIST-P-521 (<= 0.4520) is undetermined.
        RT-20260916-c14349 objection O4 called their absence "correct"; I think
        that reading is wrong on the text and this round must settle it.
        (b) OVER-INCLUSIVE under branch typing: DEC-20260802-204 files Cheon's
        algorithm for d | r - 1 with a single auxiliary power [x^d]P. Three
        flagged rows minimize on r + 1 (NIST-P-224, brainpoolP256r1, BN254-r).
        On r - 1 alone NIST-P-224 is 0.4353 and brainpoolP256r1 is 0.4918, both
        above 0.40; BN254-r's r - 1 branch is 0.2539 and it stays. The r + 1
        variant needs a different and much larger auxiliary input (RECALLED,
        unverified pointer: on the order of 2d consecutive powers [x^i]P rather
        than one). If that holds, the r + 1 rows answer a different problem
        and cannot share one column with the r - 1 rows.
        A typed r-1-only set, bounds included, would be {NIST-P-256, secp256k1,
        BN254-r, BLS12-381-r, brainpoolP384r1}. I do not assert that set; I
        assert that 6 is not obviously the right number under any single typing.
      generic_or_specific: >-
        That J7 shows the escalate carries NO curve-specific signal. E_m(r) <=
        0.40 needs only a divisor of m in [r^{0.2}, r^{0.8}], which fails only
        when m is roughly (small) x (prime above r^{0.8}); with two branches per
        prime I expect most random primes of the same size to trip the 0.40
        ceiling, and the 0.49 "inert" floor to be rare. If so, the preregistered
        thresholds made escalation the expected outcome, and "six deployed
        curves escalated" is a property of integers near 2^256, not of how those
        curves were chosen. This expectation comes from divisor-distribution
        heuristics I have NOT checked (recalled reasoning, not a filed source);
        J7 measures it.
      operational_reading: >-
        That J6 finds the flagged minimizers need [x^d]P with d of 126-128 bits.
        Whether any deployed protocol releases such a power is the supply
        question of IDEA-20260831-ccb587, which stays unopened; I expect the
        answer to be none, which would make the escalate operationally empty.
        This round must NOT answer that question. It only has to stop the table
        being read as if it had been answered.
      provenance: >-
        That J4 finds a durability gap rather than a content problem: the run
        manifest records code.dirty true at 846a4e071834d59aa3b3cc4d9c81fd2fc7552634;
        the snapshot's verifier-bound path_sha256 covers only
        implementation/trial-plan.json, while the run files sit in a side field
        run_artifacts_sha256 and the implementation modules are not hashed at
        all. I expect the bytes to match their recorded hashes and the binding
        to be narrower than the snapshot scope sentence implies.
    where_i_think_it_breaks_if_it_breaks: >-
      Not in the factorizations. In the TRIGGER: which rows it counted (E_bound
      exclusion), which problem each row answers (branch typing), and whether the
      thresholds could ever have come out another way (J7). Second, in the
      CERTIFICATE WORDING (J2). The escalate package is most likely a correct
      table under a mis-specified trigger.
    what_would_overturn_this_prior_and_matter_most: >-
      (i) J8 disagreeing with the producer on P-256 or brainpoolP256r1 -- a
      wrong-but-self-consistent implementation, which nothing else in this
      round can see. (ii) J7 finding random primes of the same size rarely
      escalate -- that would make the deployed rows anomalous and would itself
      be worth a decision. (iii) Any reviewer finding a real row BELOW the
      analytic floor -- impossible under the formula, so either an
      implementation error or a claim that must go to review-breakthrough (see
      rule_12_status, T2). Each of these is more informative than concurrence
      and none is recoverable if this prior is written afterwards.

