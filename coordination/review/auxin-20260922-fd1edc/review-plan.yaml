      assigned_to: TASK-20260922-0e10d1
      attack_plan: See proves_too_much; it is stated there in full.
      breaking_artifact: >-
        Evidence that the escalate fires at a comparable rate on primes nobody
        standardized (the escalate is then generic), or that the evaluator cannot
        report inertness on a prime built to be inert, or that any reading of
        the table survives the removal of the auxiliary input.

    - joint: >-
        J8 -- BLIND RE-DERIVATION of E(r) on NIST-P-256 and brainpoolP256r1,
        both branches each. See blind_rederivation below.
      assigned_to: TASK-20260922-09522c
      attack_plan: >-
        See blind_rederivation and blind-inputs.yaml. The re-deriver is told the
        statement and the input integers, not the method and not the answer.
      breaking_artifact: >-
        A re-derived factorization, per-branch minimizer or exponent that
        differs from the producer's, which localises an error to one of two
        named implementations.

  joint_ownership_note: >-
    EIGHT JOINTS, THREE OWNERS, NONE UNOWNED, NONE SHARED. The split is by
    ACCESS, the lesson of BATCH-cbb416 and REVIEW-FROB-20260922-5286b0: a
    reviewer that must read the producer's outputs cannot also be the blind
    re-deriver. TASK-20260922-ba2fac (validator) owns the four validity joints and reads the
    run package, the implementation and the snapshot. TASK-20260922-0e10d1 (red team) owns
    the three interpretation joints and reads everything except sibling
    reports. TASK-20260922-09522c (validator, separate independent session) owns only J8 and
    reads only blind-inputs.yaml plus the frozen contract and the two
    primary-source text files it needs. TASK-20260922-ba2fac and TASK-20260922-09522c MUST be different
    sessions even though both are validator-role: a session that has read
    e_table.json cannot un-read it.

  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      Not lifted. No reviewer reads another's report in this round. Reading the
      PREVIOUS round's reports on RUN-AUXIN-6117d3 (VAL-20260916-b828e7,
      RT-20260916-c14349) is permitted to TASK-20260922-ba2fac and TASK-20260922-0e10d1 because they are not
      siblings in this round, must be declared in sources_read, and are
      forbidden to TASK-20260922-09522c (they quote deployed values).

  proves_too_much:
    objects:
      - >-
        PTM-1 -- RANDOM PRIMES OF THE SAME SIZE. For these the conclusion "the
        escalate identifies something about how the deployed curves were
        chosen" is false by construction. Draw 32 primes uniformly from
        [2^255, 2^256) as next_prime(U) for U from a seeded generator, seed
        2026092201 (declare the generator), and compute E_{r-1}, E_{r+1} and
        E(r) under the frozen statement with a 300 s per-integer factoring cap
        (the producer's effective cap, so the comparison is like for like).
        Unfactored rows: an E_bound <= 0.40 counts as escalating (it is an upper
        bound); an E_bound > 0.40 is UNDETERMINED and is reported as such, never
        as inert.
      - >-
        PTM-2 -- A PRIME BUILT TO BE INERT at 256 bits: r with (r - 1)/2 prime
        AND r + 1 = 2^a * 3^b * q' with q' prime and 2^a * 3^b small (or the
        closest structure you can construct in budget; declare it). Here the
        conclusion "E(r) <= 0.40" is false. The planted and safe-prime controls
        are at <= 125 bits and exercise r - 1 only; this object tests that the
        evaluator can return an inert answer at deployed size on BOTH branches.
      - >-
        PTM-3 -- THE NO-SUPPLY NULL: any flagged curve, under the assumption
        that nothing releases [x^d]P. Here the conclusion "the discrete
        logarithm costs r^{E(r)}" is false (DEC-20260802-204 B032-C7/C8: no
        sub-rho acquisition of [x^d]P from P and [x]P is established).
    failure_signature: >-
      PTM-1: if the fraction of random primes whose E(r) (or E_bound) is <= 0.40
      is comparable to the deployed fraction, the escalate has proved too much:
      it fires on integers, not on standards, and must be reported as a generic
      arithmetic fact about primes near 2^k. Report the fraction with its
      binomial interval, the distribution of E(r) - (1 + log2(m)/4)/log2(r), and
      the fraction at or above 0.49. A deployed rate far ABOVE the random rate
      is the surprising outcome and triggers rule_12_status T3 review of the
      claim that the standards are anomalous.
      PTM-2: the evaluator must return E_{r-1} and E_{r+1} both >= 0.49 (up to
      the analytic effect of the small smooth part, stated). If it reports
      <= 0.40 on an object built to be inert, the evaluator -- or the construction
      -- is wrong and every deployed row inherits the doubt.
      PTM-3: every sentence proposed to describe the table must FAIL when the
      auxiliary input is removed. A sentence that still delivers a cost below
      rho under PTM-3 has proved too much and is an ordinary-ECDLP overclaim;
      it is refused, and if anyone asserts it as true, rule_12_status T1 fires.
    assigned_to: TASK-20260922-0e10d1
    computation_status: >-
      PTM-1 and PTM-2 are REVIEW COMPUTATIONS: they mint no RUN-*, write no
      evidence record, and are not census rows. They may be cited only as the
      review control they are. If the reviewer judges either to be a scientific
      trial requiring its own protocol, it records "not performed" with that
      reason rather than running it; an unauthorised extra arm is worse than a
      missing control.
    why_this_control_exists_here: >-
      Because the preregistered thresholds (inert >= 0.49, escalate <= 0.40)
      were set without any measurement of what random primes do, and because the
      goal's own pause condition calls a near-sqrt(r) hit "a surprising positive
      on standardized parameters". Whether it is surprising is a question about
      the null, and nobody has measured the null.

  blind_rederivation:
    required: true
    quantity: >-
      THE STATEMENT ONLY, no method: for prime r and m in {r - 1, r + 1},
      E_m(r) = min over all positive divisors d of m of log2(sqrt(m/d) +
      sqrt(d)) / log2(r), and E(r) = min(E_{r-1}(r), E_{r+1}(r)), with the
      attaining branch and d. Report both branch minima, not only the global
      one.
    parameters: >-
      NIST-P-256 and brainpoolP256r1, r pinned by the re-deriver from
      inputs/SAFECURVES-20260825/specs/sp800-186.txt and rfc5639.txt
      respectively, compared against the r hex the producer used (given in
      blind-inputs.yaml, as inputs, with no outputs). Precision >= 100 decimal
      digits.
    blind_from:
      - experiments/EXP-AUXIN-7e2e3d/runs/
      - experiments/EXP-AUXIN-7e2e3d/implementation/
      - coordination/design/BATCH-5149d8/
      - coordination/design/BATCH-cae584/
      - coordination/review/auxin-20260922-fd1edc/review-plan.yaml
      - ledger/decisions/DEC-20260922-19b645.yaml
      - ledger/decisions/DEC-20260916-c81d20.yaml
      - ledger/goals/GOAL-AUXIN-a93442.yaml
      - ledger/handoffs/TASK-20260916-fa9626.yaml
      - ledger/handoffs/TASK-20260916-41af61.yaml
      - inputs/SAFECURVES-20260825/pages/
      - inputs/SAFECURVES-20260825/tables/
      - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-ba0b0d/reviews/TASK-20260922-ba2fac/
      - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-ba0b0d/reviews/TASK-20260922-0e10d1/
      - the executor return report for TASK-20260916-3dcd7e
      - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-ba0b0d/dispatch_queue.json
      - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-ba0b0d/archives/
      - ledger/handoffs/TASK-20260922-d21434.yaml
      - ledger/handoffs/TASK-20260922-7e0d35.yaml
      - ledger/handoffs/TASK-20260922-ba2fac.yaml
      - ledger/handoffs/TASK-20260922-0e10d1.yaml
      - ledger/handoffs/TASK-20260922-39a32c.yaml
      - ledger/handoffs/TASK-20260922-a05e72.yaml
    blind_from_note: >-
      The SafeCurves pages/tables are third-party, not producer artifacts; they
      are listed because SafeCurves primality proofs may print partial
      factorizations of r - 1, and a transcribed factorization would reduce the
      re-derivation to a product check. The specification and the amendment
      are NOT in blind_from: they carry the statement and no computed value for
      any real curve.
    blind_from_exception:
      path: coordination/review/auxin-20260922-fd1edc/blind-inputs.yaml
      what_it_contains: >-
        The statement of E(r), the two curve ids, the r hex the producer used
        (inputs only), the primary-source files and approximate lines to pin
        from, required outputs, precision, independence requirements and the
        must-not-read list. No factorization, divisor, exponent, threshold
        outcome or trigger state.
      who_writes_it: >-
        The Coordinator, in this act, before any reviewer is dispatched. It can
        be written now because every input already exists; nothing needs to be
        extracted from the run.
      standing_obligation: >-
        NO CARD, QUEUE NOTE, BUS MESSAGE, RECEIPT, PR TEXT OR COMMIT MESSAGE IN
        THE REVIEW BATCH MAY QUOTE A DEPLOYED E(r), E_bound, MINIMIZING d OR THE
        NAMES OF THE ESCALATED CURVES BEFORE J8 RETURNS. The TASK-20260922-09522c card names
        its two curves and nothing else about the census. The dispatching
        session declares blind_phase_hygiene.protected_sha256 in the batch file
        and runs `python3 tools/check_review_independence.py --blind-history`
        on the branch TASK-20260922-09522c will run in, BEFORE dispatching it
        (CORR-20260905-547849, CORR-20260916-292e53).
    assigned_to: TASK-20260922-09522c
    agreement_tolerance: >-
      Factorizations: identical multisets of (prime, exponent) -- integers, so
      exact. Per-branch minimizing d: exact, except a documented near-tie
      (two divisors within 1e-20 in exponent), which both implementations must
      then evaluate identically. Exponents: agreement to at least 25
      significant decimal digits.
    what_disagreement_means: >-
      NOT that the producer is wrong. It localises the error to one of two named
      implementations; the Coordinator resolves it by reading both, never by
      preferring the producer's. No number from the disputed row is used until
      it is localised.

  composition:
    who: >-
      THE COORDINATOR, in a compose task named in the review batch's queue,
      after a snapshot archive of the three reports has verified. No reviewer
      votes on the claim.
    independence_check: >-
      `python3 tools/check_review_independence.py --batch <review batch dir>`
      and `--blind-history` for TASK-20260922-09522c, before the round is treated as complete.
    what_each_outcome_means:
      all_joints_hold: >-
        The census table stands as ARITHMETIC at its declared scope: ten pinned
        orders, both branches, sympy-backed factoring with the certificate
        strength J2 establishes, Cheon's auxiliary-input cost expression
        without log cofactor. An evidence record may then be written at that
        scope with the escalate set J5 establishes. It does not by itself move
        H-AUXIN-66e6fd, open IDEA-20260831-ccb587, or say anything about any
        deployed system; each of those is a separate committed decision.
      J1_breaks: The affected rows are void; the others stand. Infrastructure, not mathematics.
      J2_breaks_on_values: The affected rows are void pending re-factorization; never negative evidence.
      J2_breaks_on_certificate_strength_only: >-
        Values stand; certificate wording is downgraded to "probable prime
        (BPSW)" in any record that cites them, unless re-proved.
      J3_breaks: >-
        The census has no admissible controls; every deployed row is void as it
        was for RUN-AUXIN-6117d3. Infrastructure, not mathematics.
      J4_breaks: >-
        No evidence record may cite the run until a superseding snapshot binds
        the run files (and, if recoverable, the implementation) by path_sha256.
      J5_breaks: >-
        The escalate set is corrected by a correction record, never by editing
        the run; the evidence record states the set under the typing the
        contract specifies and names the others.
      J6_breaks: Every offending sentence or column is superseded before any citation.
      J7_generic: >-
        The escalate is reported as a generic property of primes of that size.
        The preregistered thresholds are left standing (they are frozen) and the
        calibration gap is recorded as a finding about the protocol, with a
        protocol_amendment if any future census is to use them.
      J7_anomalous: See rule_12_status T3.
      J8_disagrees: See blind_rederivation.what_disagreement_means.
    rule_12_status: >-
      TIER RULING: review-adversarial (validator / red-team at xhigh,
      independent sessions), NOT review-breakthrough. Basis, from
      orchestration/model-policies.yaml routing_rules
      `unrecoverable-result-review`: (a) claimed_breakthrough is FALSE -- the
      producer claims an arithmetic table and a procedural trigger and states
      "no vulnerability claim" in the run itself; the quantity is bounded below
      by Cheon's own balanced exponent, so the census cannot express anything
      beyond known prior art (DEC-20260802-204 B032-C5 classifies the
      N^{1/4} auxiliary-input row as known); (b) no proposed_state_transition to
      `closed` -- this round moves nothing; (c) contradicts_prior_evidence is
      FALSE -- no validated evidence record on these divisor lattices exists
      (the only prior package, RUN-AUXIN-6117d3, is void and its reviews are
      reviews, not evidence), and nothing here disputes DEC-20260802-204's
      acquisition gate. The round is claim-changing (it gates an official
      reading), so it is not a mechanical tier either. This is NOT a downgrade:
      no record ever routed this package to review-breakthrough, the goal's
      pause condition names "independent validation and red team", and the
      previous escalate package was reviewed at review-adversarial.
      PRE-DECLARED TRIPWIRES. The round STOPS and the affected claim is routed
      to review-breakthrough at max (validator-breakthrough /
      red-team-breakthrough, independent sessions, fallback_allowed false,
      degradable false) if any of these occurs:
      T1 -- any reviewer or record asserts, or any reading of the package
      entails, an ordinary-ECDLP cost below rho or a break of a deployed scheme;
      T2 -- a real (not implementation-error) E_m(r) below the analytic floor
      (1 + log2(m)/4)/log2(r) is asserted, i.e. an exponent below Cheon's;
      T3 -- J7 finds the deployed escalate rate far above the random-prime rate
      and anyone proposes that the standards are anomalous, or any finding
      contradicts DEC-20260802-204's acquisition gate;
      T4 -- anyone proposes to close the lane on this package.
      If review-breakthrough cannot be served when a tripwire fires, the CLAIM
      stays un-promoted and the goal stays active with an impediment; the
      review-adversarial reports of this round do NOT stand in for it.
      REVIEW-FROB-20260922-5286b0 records review-breakthrough as unservable in
      its environment on 2026-09-22 while CLAUDE.md lists validator-breakthrough
      and red-team-breakthrough bindings at max; this plan does not adjudicate
      that and requires `python3 -m orchestration.adapter doctor --probe` (or
      the session's equivalent) before any tripwire dispatch.

  procedure_deviations:
    - id: PD-R1
      severity: procedural
      what: >-
        OWNERS AND BATCH WERE TOKENS AT WRITING. The Coordinator that wrote this
        plan has no shell and cannot mint identifiers, so it wrote four
        placeholder tokens (one per reviewer slot, V / R / B, and one for the
        batch) and handed back.
      binding_performed: >-
        BEFORE FIRST COMMIT, and before any reviewer existed, the tokens were
        replaced by pure token substitution -- nothing else in the text changed
        by that step -- in this file, blind-inputs.yaml and DEC-20260922-19b645,
        with ids minted and --check'ed by the top-level session (all free across
        the union, 8/8 distinct): validator slot V -> TASK-20260922-ba2fac; red
        team slot R -> TASK-20260922-0e10d1; blind re-deriver slot B ->
        TASK-20260922-09522c; batch -> BATCH-ba0b0d. The same session also
        minted TASK-20260922-d21434 (opening-act card), TASK-20260922-7e0d35
        (ledger archive of the opening act), TASK-20260922-39a32c (snapshot
        archive of the three reports) and TASK-20260922-a05e72 (compose). This
        PD entry itself was then rewritten to record the mapping (it described
        the rule before; it records the act now). The file is frozen at first
        commit; any later change is an addendum.
      why_not_an_addendum: >-
        tools/check_review_independence.py compose_plan lets an addendum
        reassign joint owners (what_changes.owners) but reads
        blind_rederivation.assigned_to from the base plan only, so an addendum
        could not have bound the re-deriver and the independence check would
        report it as unattested. Substitution before freeze is the route that
        keeps the declared setup and the checked setup the same.
    - id: PD-R2
      severity: material
      what: >-
        THE PRIOR IS INFORMED, NOT BLIND. The same Coordinator session that wrote
        this plan read every output of RUN-AUXIN-fd1edc, the previous round's
        validator and red-team reports, and driver.py lines 660-739 plus the
        import lines of the implementation modules. J5's "where it breaks" was
        found by reading that code, and its branch-typing half follows
        RT-20260916-c14349 objections O4 and O6. The framing question for this
        round ("is ~0.254 simply the known auxiliary-input exponent?") was put by
        the dispatching session's brief, which also quoted the six values.
      what_it_costs_a_later_reader: >-
        Concurrence of TASK-20260922-ba2fac or TASK-20260922-0e10d1 with the prior is weak corroboration of
        the prior's diagnoses; the prior found them first. Only J8 (structurally
        blind) and J7 (a measurement nobody has made) can overturn it
        independently.
      recalled_content: >-
        Three elements of the prior are RECALLED and are pointers, not support:
        the input form of Cheon's d | r + 1 variant; the BN and BLS12 order
        parametrizations offered to J1; and the divisor-density reasoning behind
        J7's expectation. No decision may rest on any of them until a reviewer
        who read a source says so.
    - id: PD-R3
      severity: disclosure
      what: >-
        NO TOOL WAS RUN AND NO HASH WAS COMPUTED by the writer. Statements about
        the snapshot's binding scope rest on reading snapshot.json and the
        dispatch queue, not on running tools/research_dispatch.py; the sha256
        values quoted are read from the artifacts as written. J4 is where they
        get checked.
    - id: PD-R4
      severity: disclosure
      what: >-
        THE PRODUCING QUEUE NEVER CARRIED A REVIEW CHAIN. In
        coordination/design/BATCH-5149d8/dispatch_queue.json the census producer
        TASK-20260916-3dcd7e has review_required false and no dependent
        reviewer, although agents/coordinator.md requires a claim-relevant
        producer to set review_required true with a dependent review task, and
        the goal's pause conditions pre-declared that an escalate must go to
        review. This round is that missing chain, opened late in a new batch
        rather than by editing a completed queue.
    - id: PD-R5
      severity: procedural
      what: >-
        THE COMPOSE CARD IS WRITTEN BUT NOT YET QUEUED. composition.who says
        the compose task is "named in the review batch's queue". At opening it
        is named in the queue's successor_cards_not_written block instead, and
        its handoff exists at ledger/handoffs/TASK-20260922-a05e72.yaml.
        Reason: tools/research_dispatch.py validate_queue requires every
        non-archive task to be assigned to exactly one archive task in the same
        queue, and the three reviews are already assigned to the snapshot
        archive TASK-20260922-39a32c, so a queued compose card would need its
        own ledger-archive task -- an identifier not minted at opening. The
        compose card and its ledger archive are appended to the queue together,
        as a recorded revision, once that identifier is minted. Nothing about
        the round's independence depends on this: composition cannot start
        until the snapshot of all three reports verifies.
    - id: PD-R6
      severity: procedural
      what: >-
        FOUR SHORT PROTECTED LITERALS ARE NOT HASH-CHECKED IN COMMIT HISTORY.
        Of the 16 distinct literals protected for the blind phase, the four
        integers of two or three digits (two divisor counts on the
        brainpoolP256r1 branches, one on the NIST-P-256 r + 1 branch, and the
        brainpoolP256r1 r - 1 largest divisor <= sqrt r) are excluded from
        blind_phase_hygiene.protected_sha256. Measured by the top-level session
        against origin/main's last 500 commit messages before any AUXIN commit
        existed: the full set produced 30 hits, every one from three of those
        integers (19, 8 and 3); the 12 long literals produced 0. Declared as-is
        the check would be permanently red on unrelated history. The full ruling,
        what still protects those values, and the residual risk are in
        coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-ba0b0d/batch.yaml
        blind_phase_hygiene.
    - id: PD-R7
      severity: disclosure
      what: >-
        REVIEWER CARDS SET fallback_allowed TRUE, where DEC-20260922-19b645 as
        first drafted said false. Under this runtime every subagent inherits the
        session model (this Coordinator itself recorded fallback_used true for
        exactly that reason), so `false` would be a statement the dispatch is
        known to break -- the reasoning BATCH-5286b0 records for GOAL-FROB-6333a9.
        What is allowed is a BACKEND substitution only: the policy stays
        review-adversarial at xhigh, degraded_allowed stays false, and each
        reviewer records requested versus served model with fallback_used and
        its reason. Corrected in the decision before its first commit.
  procedure_deviations_note: >-
    Further departures -- acting before a report returns, reassigning a joint,
    dropping a control, lifting blindness -- go in an addendum, never quietly
    absorbed.
