# =============================================================================
# BLIND INPUTS for the blind re-derivation joint (J8) of
# REVIEW-AUXIN-20260922-fd1edc.
#
# This is the ONLY review-round file the blind re-deriver reads. It carries the
# STATEMENT of the quantity and the INPUT integers, and nothing the producer
# computed from them: no factorization, no divisor, no exponent, no bin, no
# threshold outcome. If you are the blind re-deriver and you find a computed
# value of the quantity anywhere in this file, stop and report a leak -- do
# not proceed on a contaminated input.
#
# Written by the Coordinator (DEC-20260922-19b645) before any reviewer runs.
# Frozen at first commit. Pre-commit, the only permitted change is the
# mechanical owner/batch token substitution declared in the review plan's
# procedure_deviations PD-R1 (TASK-20260922-09522c and BATCH-ba0b0d below).
# =============================================================================
blind_inputs:
  review_plan_id: REVIEW-AUXIN-20260922-fd1edc
  joint: J8
  assigned_to: TASK-20260922-09522c
  written_at: '2026-09-22'
  written_by: coordinator

  quantity:
    name: E(r)
    statement: >-
      For a prime r and for each branch m in {r - 1, r + 1}, let D(m) be the
      set of ALL positive divisors d of m. Define
        expr(d, m) = sqrt(m / d) + sqrt(d)
      and the per-branch exponent
        E_m(r) = min over d in D(m) of  log2(expr(d, m)) / log2(r).
      The quantity is E(r) = min(E_{r-1}(r), E_{r+1}(r)), together with the
      branch and the divisor d that attain it. d = 1 and d = m are admissible
      divisors. No other term, cofactor or constant is included.
    precision: >-
      Evaluate in exact rational arithmetic where possible and otherwise at a
      stated decimal precision of AT LEAST 100 significant decimal digits (the
      frozen contract requires >= 80 bits; this round asks for more so that
      near-ties can be separated). Report every exponent to at least 30
      significant digits.
    source_of_statement: >-
      This is the definition frozen in
      experiments/EXP-AUXIN-7e2e3d/specification.yaml (inputs.procedure STAGE 1
      steps 3-5 and parameters.cost_expression / E_r). You MAY read that file
      and experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260916-bands.yaml to
      confirm the statement; neither contains any computed value for a real
      curve. You may NOT read anything under that experiment's runs/ or
      implementation/ directories.

  curves:
    - id: NIST-P-256
      r_hex_as_used_by_producer: FFFFFFFF00000000FFFFFFFFFFFFFFFFBCE6FAADA7179E84F3B9CAC2FC632551
      primary_source_to_pin_from: >-
        inputs/SAFECURVES-20260825/specs/sp800-186.txt -- the P-256 domain
        parameters, field `n`, printed in decimal and hex across several lines
        near line 2139 of that text extraction. Reconstruct n yourself from the
        text; do not copy the hex above into your computation until you have
        confirmed equality.
    - id: brainpoolP256r1
      r_hex_as_used_by_producer: A9FB57DBA1EEA9BC3E660A909D838D718C397AA3B561A6F7901E0E82974856A7
      primary_source_to_pin_from: >-
        inputs/SAFECURVES-20260825/specs/rfc5639.txt -- the brainpoolP256r1
        domain parameters, field `q` (RFC 5639 names the prime group order q),
        near line 587 of that text.

  required_outputs_per_curve:
    - pin_check: >-
        The r you reconstructed from the primary source, whether it equals
        r_hex_as_used_by_producer exactly, and a primality verdict for r with
        the method named. A mismatch is a finding in its own right; report it
        and compute on the PRIMARY-SOURCE value.
    - factorization_per_branch: >-
        For m = r - 1 and m = r + 1 separately: the complete prime
        factorization as a multiset of (prime, exponent), an exact product
        check, and for EVERY reported prime a primality verdict with the method
        named. If a branch cannot be completely factored within budget, report
        the factored part and the unfactored cofactor with its bit length,
        and say so -- never drop the branch.
    - divisor_count_per_branch: The number of positive divisors of m you enumerated.
    - per_branch_minimum: >-
        For each branch separately: the minimizing d (decimal), its bit length,
        expr(d, m) and E_m(r) to >= 30 significant digits. Report the minimum
        on BOTH branches, not only the global one.
    - global_minimum: E(r), the branch attaining it, and d.
    - largest_divisor_at_most_sqrt_r: >-
        For each branch, the largest divisor of m that is <= floor(sqrt(r)),
        and its bit length.
    - near_ties: >-
        Any second divisor, on either branch, whose exponent is within 1e-20 of
        the reported minimum. A near-tie is reported, never silently resolved.
    - method_declaration: >-
        Every tool, library and version used for factoring, primality and
        high-precision arithmetic, and the exact commands or scripts (kept in
        your own write scope).

  independence_requirements:
    - >-
      Factor with a backend of your own choice and NAME it. The producer's
      backend is not disclosed to you on purpose. If the only backend you can
      reach is a general-purpose CAS library, use it and declare it; the Coordinator
      will judge overlap when composing, not you.
    - >-
      Prefer a PROVING primality test (e.g. an APR-CL or ECPP implementation)
      over a probable-prime test. If only probable-prime tests are available,
      name the test and say "probable prime" rather than "prime".
    - >-
      Do not transcribe a factorization from any published table, web page,
      corpus entry or third-party page, including
      inputs/SAFECURVES-20260825/pages/ and inputs/SAFECURVES-20260825/tables/.
      Compute it.

  must_not_read: >-
