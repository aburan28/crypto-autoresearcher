  # ---------------------------------------------------------------------------
  objections:
    - id: OBJ-RT-1
      joint: J-PCNULLR
      text: >-
        PC-NULL-R criterion (i) is degenerate at this design. It can fail only at K >= 2,
        because P(K_null >= 1) = 0.038. A single anomalous null arm produces K = 1 at most
        (failure probability <= 0.00035 at kappa 1.10 and 1.15). The gate's informativeness
        therefore rests on criterion (ii) alone. Disclosed pre-data in A-8; this report
        confirms it at the realised n.
    - id: OBJ-RT-2
      joint: J-PCNULLR
      text: >-
        Criterion (ii) tests a quantity that is fixed by algebra to first order. The four
        pseudo-cell numerators sum to zero identically, so "the mean of the four null z"
        detects departures only through the covariance of numerators and SD_null (99%
        interval width 0.016). It is informative against single-arm departures (0.69 at
        kappa 1.10) but blind by construction to common mode. The observed mean sits at the
        2.1% point of its simulated law: inside, but not central.
    - id: OBJ-RT-3
      joint: J-COV
      text: >-
        The AR-3 governing-bound choice is at Monte Carlo resolution. The signed bound's
        coverage is about 0.945, equal to the floor, and the choice flips with the coverage
        seed. Immaterial here (both bounds <= 1.0435). It is a latent coin flip for any
        reading near 1.15.
    - id: OBJ-RT-4
      joint: J-CAL
      text: >-
        The source of t_dec (t_A or t_perm) is likewise at Monte Carlo resolution (2.349 and
        2.344 in calibration.json; 2.357 and 2.361 here). Immaterial at z_A = -0.068.
    - id: OBJ-RT-5
      joint: J-PTM
      text: >-
        The planted_target object checks the argument at a single deterministic point well
        inside the detection region (z 8.06). It cannot expose a miscalibration near the
        boundaries. That burden falls on the coverage and X_rel simulations, which hold.
  required_controls:
    - id: RCT-1
      text: >-
        For any reuse of PC-NULL-R (Part B or C, or a re-review), replace criterion (i) with
        the family-wise test "max of the four null pseudo-cell z exceeds its simulated 0.99
        quantile". On this design that test is calibrated (null rejection 0.0114, SE 0.0015)
        and informative (0.925 to 0.930 at a single null arm with kappa 1.10). On the
        observed cells it passes (max z 1.094, P 0.51). Code: attacks/j_pcnullr_extra.py.
    - id: RCT-2
      text: >-
        Report a common-mode yardstick beside PC-NULL-R, because (i) and (ii) cannot see a
        common mode. Report the null arms' rho1_hat against U (mu_model) and against the
        previous experiment's rate, with 99% intervals and the factor needed to cross the
        outcome boundary. Here that factor is 1.0575 against an admitted pooled upper end of
        1.030; numbers in out/j_pcnullr_cm.json.
    - id: RCT-3
      text: >-
        Pre-register an AR-3 rule that Monte Carlo noise cannot decide. For example, the
        governing bound is the larger of the two, or the signed bound governs unless its
        coverage is below the floor by more than 3 Monte Carlo SE.
  counterexample_or_mutation: >-
    A single null arm Poisson-planted at kappa 1.10 or 1.15 at the realised n (10200 curves)
    is the counterexample to criterion (i)'s informativeness: (i) fails with probability
    <= 0.00035 while (ii) fails with 0.69 to 0.99 (out/j_pcnullr.json). No mutation or
    departure consistent with the null arms was found that changes the recorded outcome
    class.
  baseline_comparison: >-
    Not applicable to a cost axis. The experiment claims no attack and no speedup.
    specification.yaml pareto_honesty.dominated_by is present and non-null (Pollard rho,
    about 0.886 sqrt(N) group operations and O(1) memory, for every outcome of this engine),
    and no invariance or precomputation claim needs its cost charged.
  heuristic_challenges:
    - id: HC-1
      heuristic: HEUR-2765d2-H1c (TT m = 4 dispersion clause)
      text: >-
        Tested clause holds at the tested scale. D_pooled 1.0164, 99% curve-cluster interval
        [0.989, 1.046], inside [0.8, 1.25]. The approximately-Poisson shape is consistent
        with every fit test: zero fraction, tail above the per-curve 0.99 quantile (134 vs
        131.9 curves with >= 3 relations), and top-10 share. The randomized-PIT KS clause of
        H1c is not part of this experiment's frozen test and was not run.
    - id: HC-2
      heuristic: HEUR-2765d2-H4
      text: >-
        The H4 reading at this cell rests on PC-NULL-R and on t_perm (2.344) staying below
        t_A's 0.999 quantile (3.125). PC-NULL-R's (i) is degenerate (OBJ-RT-1), (ii) is
        second-order (OBJ-RT-2), and neither can see a common-mode departure of
        FactorBase.random from U. The cheapest exposing computation is the random-arm rate
        against mu_model by s_sub decile; it was run here. Chi-square 10.7 and 13.1 on 9 df,
        log-log slopes -0.002 and 0.042. rho1_hat is 0.971 at 30 bits (about 1.8 SE below 1)
        and 0.986 pooled, 99% [0.957, 1.015] against U. No systematic deviation was found.
    - id: HC-3
      heuristic: HEUR-2765d2-H2
      text: >-
        Not refuted at this cell: a scoped non-detection with governing bound 1.043 and
        X_rel 1.06. The random-model justification of H2 (character-sum cancellation;
        recalled) is untouched by this measurement.
  cost_model_challenges: []
  cost_model_note: no cost or exponent claim is made; nothing to recompute
  reduction_and_scope_challenges:
    - >-
      The O-A3 reading is scoped to one cell (small_x, TT, m = 4), pooled 30 and 32 bits,
      10200 fresh prime-order curves (c = 2010..7109 per rung), the mitm engine on the EC-A1
      build at default arity 2 and min_fill, and this budget. It closes nothing else: no
      other cell, m or base, no growth with N, no deployed curve (TW-SCOPE). Its
      relationship to EXP-PFDR-011cd0's non-excluding reading of the same cell is a
      composition question, not a property of this run.
  proof_architecture_challenges:
    - >-
      Quantifier order: which bound is "the governing U_A" is chosen after the coverage
      simulation and is seed-dependent (OBJ-RT-3), so the outcome condition is not fully
      fixed before randomness. Here both candidates satisfy the condition with a large
      margin.
    - >-
      Boundary margins: z_A = -0.068 against t_dec 2.35 to 2.36; governing U 1.043, which
      is 4.6 SE below 1.15; X_rel 1.06 against 1.15. No assessed model departure brings any
      of the three within reach of its boundary.
  narrowest_supported_statement: >-
    On 10200 fresh prime-order curves at 30 and 32 bits (5100 each), with this mitm engine
    at m = 4 and table arity 2, the small_x TT relation count (2561) equals the matched-random
    mean (2565.0): kappa_rel 0.998, z_A -0.068 against t_dec about 2.35. The one-sided upper
    bound is 1.043 (|dev|, simulated coverage about 0.97, and above 0.95 under every assessed
    departure). The design detects kappa 1.15 with probability at least 0.9997, and X_rel is
    1.06. The recorded O-A3 survives every attack on J-CAL, J-PTM, J-PLANT, J-MUT, J-DISP,
    J-COV and J-P0IN. PC-NULL-R's criterion (i) is uninformative at this design, so the null
    control's informativeness rests on criterion (ii) and on the reviewer's max-z
    replacement, which also passes.
  next_concrete_action: >-
    At NA-7 composition, record J-PCNULLR's break as a defect of PC-NULL-R criterion (i)'s
    informativeness that leaves the outcome class unchanged (the max-z replacement passes on
    the observed cells). Carry RCT-1 to RCT-3 into the PC-NULL-R and AR-3 clauses of any
    later design that reuses them (Part B).
  limitations:
    - Session independence only; model independence is not claimed.
    - >-
      Reduced replicate counts where declared (procedure_deviations PD-1), each with its
      Monte Carlo SE. Frozen counts were used for J-CAL (5 x 20000), for both J-COV banks
      (5 x 20000 each) and for coverage (at least 4000 designs per kappa per set).
    - >-
      Departure laws were fitted one at a time at their 99% upper ends. Joint departures
      (for example zero inflation together with curve effects) were not explored.
    - >-
      The common-mode reference is EXP-PFDR-011cd0's random rate, which shares the
      FactorBase.random construction. A bias common to both experiments is invisible to it;
      against U the pooled rho1 interval is [0.957, 1.015].
    - >-
      J-P0IN: the 011cd0 calibration.json mj field and the 011cd0 curve-level sum of
      mu_model were not independently re-read (outside the card's inputs).
    - >-
      This review's CC-1 recount (equal to the census counts on every curve and arm) is an
      input check for the owned joints. It is not the G-REL gate, which belongs to J-VAL.
    - Toy scale; no transfer to larger N, other cells, other engines or deployed curves.
  procedure_deviations:
    - id: PD-1
      text: >-
        Declared reduced replicate counts: J-PCNULLR departures 20000 per scenario (1
        family); J-PCNULLR replacement check 5000 per scenario; J-DISP laws (t_A 20000,
        power 4000 per kappa, dev 20000, coverage 4000 per kappa); J-DISP subsets (bank
        20000 split 5 x 4000 for the bound); J-P0IN rule 1 x 20000 per multiplier;
        compound-planting coverage 4000 per kappa. None is presented as a frozen-count value.
    - id: PD-2
      text: >-
        Coverage designs' own bounds were computed by interpolating q_lo and q_abs on a
        0.0025 kappa grid built from the 5 x 20000 bank (RD-6). The producer instead runs a
        fresh 5 x 20000 simulation per design (PDI-6). This is a computational reading. It
        agrees with calibration.json's coverages within Monte Carlo error.
    - id: PD-3
      text: >-
        J-PCNULLR (3): the first run's "admitted_f_interval_99_widest" mixed the 32-bit
        rung's normalised upper end into the pooled factor. It is superseded by
        j_pcnullr_cm.py, which propagates pooled ends, per-rung corners and the needed
        factor. Both outputs are kept.
    - id: PD-4
      text: >-
        j_disp.py stopped with an IndexError on a single-rung Model in part 3, after part 1,
        the fits and all six laws had completed and printed. The run log is kept verbatim
        as out/j_disp_run1.log. common.Model was patched to accept single-rung masks (no
        change for two-rung models). Part 3 was re-run as j_disp_part3.py with the same
        seeds, and the two leave-out variants reproduced the run-1 values exactly.
        out/j_disp.json was assembled from the log and the part-3 output by
        j_disp_collect.py, which does no computation.
    - id: PD-5
      text: >-
        j_plant.py's first run compared the unsorted recomputed S with design.json's sorted
        S and printed a false "not equal". The comparison was corrected to sorted and re-run
        (out/j_plant.json replaced inside this task's own write scope, before sealing).
        j_p0in.py independently confirms S equal.
    - id: PD-6
      text: common.jdump extended to serialise numpy bools; no value changed.
    - id: PD-7
      text: >-
        Machine protection: once, for under two seconds, three interpreter processes ran
        together. j_pcnullr_cm.py was piped into a second short-lived python while
        j_disp.py was running, and the first process exited at once with an error. All
        other computation respected at most 2 processes. Peak memory stayed well under
        6 GB; host MemAvailable was about 14 GB at start.
    - id: PD-8
      text: >-
        The proves-too-much table, the J-PLANT detection figures and X_rel use this review's
        own t_dec (2.36063). The producer's 2.34919 is reported beside it. No object's
        classification differs between the two.
