# (EXP-PFDR-0b3699, RA-01 to RA-06). Joints owned: J-VAL, J-A3, J-PDI9, J-PROV.
# Built APPEND-ONLY: the J-VAL (4) sampling rule below was written first, at
# 2026-10-09T21:24:19Z, before any per-curve relation count was read. Later
# sections are appended after it; no earlier byte is edited.
