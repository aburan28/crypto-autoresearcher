j_val_recount_sampling_rule_written_first:
  sealed_copy: coordination/review/pfdr-0b3699-20261009/reviews/TASK-20261009-33b5cf/attacks/j-val/sampling-rule.yaml
  sealed_copy_sha256: 676fb39cc59efb2e56c2d35bae3810e018ea5197b3b84665d8e244b197b7dbba
  verbatim: |
    # TASK-20261009-33b5cf, J-VAL (4) G-REL-style recount: SAMPLING RULE.
    # Fixed and written at 2026-10-09T21:24:19Z, BEFORE any per-curve relation count of
    # any row file (rows.jsonl.gz, per-job rows / harvest-rows) was opened by this task.
    # This file is not edited after it is written; report.yaml carries it verbatim as its
    # first section.
    sampling_rule:
      written_at: '2026-10-09T21:24:19Z'
      population: >-
        Per rung b in {30, 32}: the design curves of
        experiments/EXP-PFDR-0b3699/runs/RUN-PFDR-0b3699-p0-design/design.json (sha256
        2c0996fec8553caffd867b326a16b2a62b81f7d69c2e3deab3db269800d0b78b), key curves,
        entries with bits == b, i.e. c = 2010 .. 7109 (final_n_b 5100 per rung), as a list
        sorted ascending by c.
      sample: >-
        random.Random(f"TASK-20261009-33b5cf|J-VAL|G-REL-recount|{b}").sample(curves_b, 510)
        with Python 3.11 random (Mersenne Twister, str seed version 2); 510 = ceil(0.10 x
        5100), i.e. exactly 10% of each rung (the plan's floor). No other selection.
      arms_on_sample: >-
        subgroup, small_x, random_sub_r0, random_sub_r1, random_sub_r2, known_null_sub,
        planted_sub, small_x_offset, and the derived planted_target (planted_sub with, on
        curves outside design.json S, the curve's planted TT monic vector removed by exact
        match; on curves in S, every relation counted).
      arms_on_all_curves: random_sub_r0, random_sub_r1, random_sub_r2, known_null_sub (all 10200 curves).
      count: >-
        The per-curve TT relation count at m = 4 by CC-1 to CC-3 of
        experiments/EXP-PFDR-011cd0/specification.yaml (read after this rule is written),
        recounted by an independent reader of the retained harvest rows in every job's
        harvest-rows.jsonl.gz, and cross-read against the harvester fields of the census
        rows (run-root rows.jsonl.gz and per-job rows.jsonl.gz).
      comparison: >-
        Every count that analysis.json and cells.jsonl record for those curves and arms.
        A recount differing from a recorded count by any integer amount is a break.
      supplementary_declared_now: >-
        Beyond the plan, a full recount of every arm on every curve, compared with the
        per-arm and per-rung totals of analysis.json and cells.jsonl. Reported separately
        and labelled supplementary.
      seen_before_rule: >-
        Before writing this rule the task had opened analysis.json, outlined and with
        long values truncated, including the first entries of the small_x and
        small_x_offset curves_with_count_ge_3 lists and the per-arm totals. It had also
        seen the prefix of design.json S. The rule is a seeded uniform sample with a seed
        string fixed by the task id, so it cannot be steered by what was seen.

