        per_run_provenance block, and the superseding manifests carry them.
    - id: O-4
      joint: J-PROV (3)
      text: >-
        execution-report-9456e8.yaml deviation line: "Between RA-05 finalize
        and the pin append about 6 minutes passed". By the A-9 times, fin_cal
        ends 17:02:08Z and the pin is at 17:02:15Z (7 s apart). The ~5.6 min
