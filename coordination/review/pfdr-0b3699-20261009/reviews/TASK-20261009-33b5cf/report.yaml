      text: >-
        Reading taken for "a finalize time outside its run's timing": the
        finalize window must start at or after the manifest's finished_at and
        end before the next logged invocation. finalize derives finished_at
        from the execution records written before it runs, so every finalize
        necessarily follows finished_at (by 14.5 s, 335.7 s and 16.6 s here).
        Under a literal [started_at, finished_at] reading, every finalize of
        every run would be outside; that is not counted as a break.
