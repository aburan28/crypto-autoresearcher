  findings:
    - id: F-1
      joint: J-VAL (8)
      text: >-
        execution-report-9456e8.yaml outcome.TW-ALIVE reads "fired". The frozen
        TW-ALIVE fires on O-A1, O-A1b or O-A2 only, but the same block's
        outcome_id and analysis.json both record O-A3. No RA-06 artifact
        carries a tripwire record. Taken alone, the line would bar any reading
        and route to review-breakthrough. Read with the frozen rule and the
        recorded outcome id, it changes no reading. Suggested remedy: a
        correction record (the report is immutable).
    - id: F-2
      joint: J-VAL (1)
      text: >-
        RA-05 and RA-06 raw-result.json have metrics null and no outcome id,
        while specification required_artifacts.per_run requires "for RA-05 and
        RA-06 every declared metric and the outcome id". The values exist in
        calibration.json declared_metrics and in analysis.json
        declared_metrics and outcome_id, both bound by sha256 in the
        raw-result file_sha256 map. The pinned finalize supports --metrics-from,
        but fin_cal and fin_an did not pass it (A-9 argv). This is not in the
        plan's breaking-artifact list. A-4 covers run.code.command only, so the
        Coordinator should rule on it.
    - id: F-3
      joint: J-VAL (5)
      text: >-
        RA-06 raw-result.json gates holds a single entry for analysis.json with
        gate null, pass null and checks null, because fin_an passed
        analysis.json as --gate-report. The gates RA-06 actually read are
        recorded in analysis.json gates_read.
    - id: F-4
      joint: J-VAL (7)
      text: >-
        row-verify.json carries exit_code (0) and stderr_tail (null), which are
        beyond the RA-04 command's "only" field list for that file. Neither is
