readings:
  task_id: TASK-20261009-a92ff3
  review_plan_id: REVIEW-PFDR-20261009-eb0048
  experiment_id: EXP-PFDR-0b3699
  written_at_utc: '2026-10-09T21:25Z (before the first row of any census, harvest or staircase file was opened)'
  state_at_writing: >-
    Read so far: this card; review_plan of TASK-20261009-33b5cf (header, J-BLIND
    joint, blindness, blind_rederivation, procedure_deviations; NOT
    coordinator_prior, NOT the other joints' bodies); specification.yaml in
    full; AMD-20261008-9c080d in full; design.json (structure, curves,
    rho1_hat_b/D_in_b planning values, simulation description); EXP-PFDR-011cd0
    specification.yaml CC-1..CC-10, A-CAL_calibration, PC-NULL_rule (adjacent
    lines), A-INT_intervals, A2R/A3R/A5R/A6R/A-CARRY (adjacent lines), A-TAIL,
    A9 (adjacent), tail_checks (adjacent); H-PFDR-2765d2 lines 90-227
    (mechanism, assumptions, L1, L2, L3 statements); engine source
    __main__.py lines 690-809 and harvest.py lines 40-79, 578-736, 870-959
    (row format). The table run's directory was listed by name only. No row
    file, log, report, manifest, raw-result or blind_from path has been opened.
  disclosure_design_json: >-
    design.json is a permitted pre-data input and it carries some descriptions
    of the producer's P0 simulation, which I have seen: a seed rule naming
    SeedSequence children 'bank', 'struct', 'xrel', 'cov_designs',
    'cov_bounds', 'obs_bound', 'contrast', 'spare'; the label
    "analysis.upper_bound_U_A applied to synthetic null designs (PDI-6)";
    predicted coverages at kappa 1 (signed 0.94625, |dev| 0.9735, 4000
    designs). R-14 below (a bank of random-arm draws shared by the inner
    simulations) was chosen for cost reasons stated there; the word 'bank'
    in design.json was seen before the choice was made, and this is disclosed
    rather than claimed as independent. The PDI-1..PDI-10 texts that A-7 of
    AMD-20261008-9c080d makes binding live in implementation-notes.yaml
    (blind_from) and were NOT read; where a PDI resolves a point below, my
    reading may differ from it, and a difference is a specification-level
    finding, not an implementation error.

  # ---------------------------------------------------------------------------
  # Counting (CC-1 to CC-3, CC-7, CC-10)
  # ---------------------------------------------------------------------------
  R-1_relation_unit:
    text_basis: EXP-PFDR-011cd0 CC-1, CC-2, CC-3, CC-4, CC-7
    open_points:
      - The x-group key. CC-1 says groups are "reconstructed from the star rows (rows sharing their first element)". The harvest row records 'elements' (list of two element descriptors) and no x.
      - Whether the engine's in-process fields (census row harvest.TT.at_stop.relations_distinct / relations_nonformal) may stand in for a recount.
      - CC-2 formal test for the scored arms.
    alternatives:
      A1: own recount from per-job harvest-rows.jsonl.gz, class TT, grouped by canonical JSON of elements[0] (first element) within (bits, curve, m, arm, mode)
      A2: the engine's census-row field harvest.TT.at_stop.relations_nonformal (in-process count, harvest.py relcount)
    adopted: A1
    why: >-
      The card requires my own reader from CC-1 to CC-3. Star row j of a group
      is (d_1 - d_j) with elements [d_1, d_j] (harvest.py table_phase), so the
      first element identifies the group. Each relation vector is
      (c_1..c_|F|, kcoef, rhs) with kcoef = rhs = 0 for TT; pairs (1, j) carry
      row_j, pairs (i, j) carry row_j - row_i; reduce mod N (N from
      design.json for (bits, c), equal to the row's curve order -- checked);
      drop zero vectors; make monic by the inverse mod N of the first nonzero
      coordinate in the order base indices ascending, then kcoef, then rhs;
      n_{X,j} = number of distinct monic vectors. CC-2: the formal basis is
      empty for every generic and planted arm, so for small_x, small_x_offset
      and r0..r2 every nonzero relation is nonformal (the harvest row's
      'formal' flag is not used). A2 is computed beside A1 and every
      difference is reported per instance; A1 governs.
  R-2_instances_and_CC-6:
    text_basis: CC-6; 0b3699 outcomes.note (M admission); analysis.statistic
    open_points:
      - Which arms form "the family" whose failed_infrastructure drops a curve.
      - Whether rows other than status completed_valid exist.
    alternatives:
      F1: family of cell X = {X, random_sub_r0, r1, r2}; a curve is admitted to cell X iff those four instances (m 4, mode table) are completed_valid and fb_size(X) == fb_size(r0) == fb_size(r1) == fb_size(r2) (unmatched_size drops the curve for X only)
      F2: family = all eight arms of the job; any failed arm on a curve drops the curve from every cell
    adopted: F1
    why: >-
      The outcomes note names "failed_infrastructure of small_x_offset or of
      any arm of the family it is scored with", i.e. the arms the CC-8
      formula reads. F2 is computed beside it; with no failures the two
      coincide and this is recorded.
  R-3_cell_curve_set_for_C_R_and_V:
    open_point: Whether C_R and sum s_j^2 of a cell run over the cell's admitted curves or over every curve with valid randoms.
    alternatives:
      S1: the cell's admitted curves (paired; CC-5 the curve is the unit)
      S2: every design curve whose three randoms are valid
    adopted: S1
    why: CC-5 pairs the arms of a family on a curve; CC-8 is "per cell". S2 is reported if it differs.
  R-4_pooling_CC-10:
    open_point: Whether V's floor max(., C_R) applies to the pooled sums or per rung.
    alternatives:
      P1: pooled -- C_X, C_R and sum_j s_j^2 summed over both rungs' admitted curves, then V = max(sum s_j^2, C_R)
      P2: per rung -- V = sum_b max(S_b, C_R_b)
    adopted: P1
    why: CC-10 pools the 30- and 32-bit curves into ONE cell and CC-8 is defined per cell. P2 is reported.
  R-5_z_M:
    text_basis: '0b3699 objective, metrics.primary [3]: "kappa_rel and z_M (CC-8, same randoms)"'
    open_point: Curve set for C_R and V in z_M.
    alternatives:
      M1: the M cell's admitted curves (height screen and CC-6 removals applied) for C_M, C_R and V
      M2: C_M over M's admitted curves, C_R and V from the A cell
    adopted: M1
    why: R-3. M2 reported where it differs (it coincides when the curve sets coincide).
  R-6_z_Delta:
    text_basis: 'analysis.statistic: "z_Delta = (C_A - C_M)/sqrt(2V) on the curves where M is admitted"'
    open_points:
      - Whether C_A is restricted to the curves where M is admitted.
      - Which V (the plan names this explicitly).
    alternatives:
      D1: C_A and C_M both over the curves where M is admitted (and A admitted); V computed from r0..r2 over that same set (its own max(sum s_j^2, C_R))
      D2: C_A and C_M over that set; V of the primary A cell (all A-admitted curves)
      D3: C_A over all A-admitted curves, C_M over the M set, V of the A cell (literal-unpaired; listed for completeness)
      D4: C_A and C_M over that set; V of the M cell (M1)
    adopted: D1
    why: '"on the curves where M is admitted" scopes the whole contrast; the contrast is a paired curve-level difference and its null variance is estimated on the same curves. D2-D4 are reported; all coincide when no curve is removed from M.'
  R-7_per_rung:
    reading: Per-rung C_A, 3 x C_R, C_M, sum s_j^2, V_b = max(S_b, C_R_b), kappa_b and z_b are reported by the same formula, secondary.

  # ---------------------------------------------------------------------------
  # G-NB-R null model (analysis.calibration_G-NB-R; A-CAL)
  # ---------------------------------------------------------------------------
  R-8_mu_model:
    text_basis: 'A-CAL: "mu_model from L1''s first moment with the generic multiplicity of L2, per curve''s |F| and N"; P0_rule (1): "X-free model means mu_model(j) for TT at m = 4 (L1 first moment with generic multiplicity 3, L2)"; H-PFDR-2765d2 L1 E[R] = |RR|/N'
    observation_before_data: >-
      design.json's mu_model equals (8 C(s,4) + 4 s C(s-1,2) + 4 C(s,2)) / N
      exactly on the 10 curves checked (s = s_sub), a count of projective
      classes. The literal "generic multiplicity for every pair" reading,
      |RR| ~= |V|(|V|-1)/3 with |V| = s(s-1) stored tails, is 1.0097 to
      1.0139 times smaller, varying smoothly with s.
    alternatives:
      MU1: design.json mu_model(j) as recorded (pre-data, pinned at sha256 2c0996fe...)
      MU2: s(s-1)(s(s-1)-1)/(3N) (every signed pair given the generic multiplicity 3)
    adopted: MU1
    why: >-
      The plan fixes the parameters "exactly as the producer used them, from
      frozen or pre-data files", and mu_model is a P0 output recorded in
      design.json before data. MU2 is the more literal text and is carried
      as an alternative; U_A is recomputed under MU2. Because m_j =
      rho1_hat_b x mu_model(j) with rho1_hat_b a ratio estimator, only the
      curve-to-curve profile of mu_model matters.
  R-9_rho1_hat_b:
    text_basis: '0b3699 calibration_G-NB-R: "m_j = rho1_hat_b x mu_model(j) ... rho1_hat_b and D = max(D_hat, 1) estimated from r0..r2 of this experiment only"; P0_rule (2) form "rho1_hat_b = sum_j mj / sum_j mu_model(j)"'
    alternatives:
      RH1: ratio estimator rho1_hat_b = sum_j nbar_j / sum_j mu_model(j) over rung b's A-cell curves, nbar_j = mean of the three random counts on curve j
      RH2: mean over curves of nbar_j / mu_model(j)
    adopted: RH1
    why: >-
      RH1 is the P0 form with this experiment's random means in place of the
      011cd0 per-curve null means, and it is the Poisson maximum-likelihood
      estimate of a scale on mu_model. RH2 is carried (U_A recomputed).
  R-10_D:
    text_basis: 'A-CAL: "D = max(D_hat, 1) with D_hat = sum_j s_j^2 / sum_j nbar_j pooled over the rung''s curves from r0..r2 only"; 0b3699: groups (SUB, TT, 4, 30) and (SUB, TT, 4, 32)'
    alternatives:
      DD1: per rung, D_b = max(sum_{j in b} s_j^2 / sum_{j in b} nbar_j, 1)
      DD2: one D pooled over both rungs
    adopted: DD1
    why: The text says per rung. DD2 carried (U_A recomputed).
  R-11_NB_parameterisation:
    reading: >-
      Count ~ NB with mean m and variance D m: numpy negative_binomial(n = m /
      (D - 1), p = 1 / D) for D > 1 (gamma-Poisson mixture); Poisson(m) if D
      == 1. Every arm (randoms and the structured arm) uses the same law
      ("every arm's count", A-CAL). Because p = 1/D is common within a rung,
      the rung total of a structured arm is NB(sum_j n_j, 1/D) in law; the
      simulation draws the structured arm by its rung totals (exact in law),
      since only C_A enters kappa*, and draws the three randoms per curve
      (needed for s_j^2).

  # ---------------------------------------------------------------------------
  # U_A (analysis.upper_bound_U_A; AR-3)
  # ---------------------------------------------------------------------------
  R-12_signed_bound:
    reading: >-
      Observed: kappa_hat = C_A / C_R, SE = SD_null / C_R with SD_null =
      sqrt(4V/3) of the A cell. Replicate: randoms r0, r1, r2 per curve drawn
      iid from G-NB-R (m_j, D_b); structured arm = G-NB-R null draw, then for
      kappa_hat > 1 plus Poisson((kappa_hat - 1) m_j) per curve (rung total
      Poisson((kappa_hat - 1) sum m_j)); for kappa_hat < 1 the null draw
      Binomial-thinned with keep probability kappa_hat; for kappa_hat = 1 the
      null draw as drawn. kappa* = C_A*/C_R*, SE* = sqrt(4 V*/3)/C_R* with V*
      = max(sum s_j*^2, C_R*); dev = (kappa* - kappa_hat)/SE*. q_lo = 0.05
      quantile of dev; U_signed = kappa_hat - q_lo x SE.
    open_points:
      - Per-curve excess mean (kappa_hat - 1) m_j versus (kappa_hat - 1) nbar_j. Under RH1, sum_j m_j = sum_j nbar_j per rung, and only rung totals of the Poisson excess enter, so the two are identical in law; recorded, no alternative computed.
      - Aggregation over the 5 families.
      - Quantile interpolation rule.
    alternatives:
      Q1: q_lo = mean over 5 families of the per-family 0.05 quantile (20000 replicates each)
      Q2: 0.05 quantile of the pooled 100000 replicates
    adopted: Q1
    why: '"seed-averaged over 5 families" is the stated convention for t_A in the same section; the U_A clause says ">= 20000 replicates x 5 families". Q2 reported. numpy default (linear) quantile.'
  R-13_absdev_bound:
    text_basis: 'EXP-PFDR-011cd0 A-INT_intervals: "kappa_hat +- q SE with SE = SD_null / C_R and q the simulated ... 0.95 quantile (one-sided upper bound) of |kappa_hat - kappa| / SE under G-NB-R with a planted excess at kappa = kappa_hat"; 0b3699 upper_bound_U_A: the simulation rule (Poisson-planted; thinning when kappa_hat < 1) applies to "the |dev| fallback"'
    open_point: Whether SE in |kappa* - kappa|/SE is the replicate's SE* or the observed SE.
    alternatives:
      AB1: q_abs = 0.95 quantile of |kappa* - kappa_hat| / SE* (replicate SE, studentised, the "dev" of the signed clause in absolute value); U_abs = kappa_hat + q_abs x SE
      AB2: denominator the observed SE (fixed)
    adopted: AB1
    why: 0b3699 calls it "the |dev|-quantile bound" and "quantile of |dev|", with dev defined with SE*. AB2 reported with its coverage. Same replicates and family aggregation as R-12.
  R-14_coverage:
    text_basis: 'upper_bound_U_A: "One-sided coverage of U_A is simulated at kappa = 1.00, 1.10 and 1.15 (>= 4000 synthetic designs each)"; every synthetic design''s own bound "computed by this rule"'
    reading: >-
      For kappa_true in {1.00, 1.10, 1.15}: a synthetic design is a full draw
      of the A cell under G-NB-R at the observed-data parameters (per-curve
      randoms; structured arm at kappa_true by the same rule: Poisson excess
      for kappa_true > 1, null draw at 1.00). Each design's kappa_hat_s and
      SE_s are computed by CC-8 and its own two bounds by R-12/R-13 at
      kappa = kappa_hat_s (thinning if kappa_hat_s < 1). One-sided coverage =
      fraction of designs with bound >= kappa_true.
    open_points:
      - The inner simulation per design. The literal rule (>= 20000 x 5 inner replicates per design, each a full per-curve redraw) costs about 4e8 full design draws per kappa, beyond the 8 CPU-hour budget.
      - Whether a synthetic design re-estimates rho1_hat_b and D from its own randoms before computing its bound.
      - Number of designs.
    alternatives:
      C1: inner simulation per design at its exact kappa_hat_s with 5 x 20000 replicates whose random-arm summaries (C_R*, sum s_j*^2) come from one fixed bank of 5 x 20000 full per-curve random draws (the same bank as the observed bound), and whose structured-arm totals are drawn fresh per design. The random component of the inner simulation does not depend on kappa, so this is the rule's inner simulation with common random numbers across designs.
      C2: a second, independent bank (different seed) -- the between-bank difference measures the bank's share of the Monte Carlo error
      C3: plug-in -- each design uses the quantile simulated at kappa_true instead of at its own kappa_hat_s (reported as a diagnostic only, not a reading of the text)
      P-fixed vs P-re-estimated: fixed observed-data G-NB-R parameters (adopted) versus per-design re-estimation (not computed; recorded as a limitation)
    adopted: C1 with fixed parameters; 5 families x 4000 designs = 20000 designs per kappa (>= 4000 frozen minimum)
    why: >-
      C1 evaluates each design's bound at its own kappa_hat_s by the stated
      rule with the frozen replicate count, and is feasible. The fixed-
      parameter choice follows "under G-NB-R" (one model, the realised one).
      Monte Carlo SE = sqrt(c (1 - c) / n_designs), plus the C2 between-bank
      difference.
  R-15_AR-3:
    reading: The signed bound governs iff each of its three simulated coverages >= 0.945; otherwise the |dev| bound governs. A coverage within 3 Monte Carlo SE of 0.945 is flagged "choice at Monte Carlo resolution".
  R-16_seeds:
    rule: numpy SeedSequence([0xA92FF3, purpose, family]) with purpose 1 = bank (random arms, U_A and inner coverage), 2 = structured draws for the observed bound, 3 = second independent bank (C2), 4 = structured draws for the C2 bank, 5..7 = alternative-reading banks (MU2, RH2, DD2), 10 + i = synthetic designs at kappa index i (0: 1.00, 1: 1.10, 2: 1.15), 20 + i = inner structured draws for those designs; family 0..4. numpy PCG64. 0xA92FF3 is this task's 6-hex token; the producer's 0x0b3699 rule is deliberately not used.
  R-17_not_used:
    - S, K_plant, planted_target, known_null_sub, subgroup, t_A, t_perm, t_Delta, X_rel -- outside the J-BLIND quantity list (known_null_sub and the other arms enter only via F2 of R-2).
    - bases.jsonl.gz -- not needed for any listed quantity; not opened unless a check needs it.
    - staircase.jsonl.gz -- not needed (informative rank is not a listed quantity); not opened unless a check needs it.
