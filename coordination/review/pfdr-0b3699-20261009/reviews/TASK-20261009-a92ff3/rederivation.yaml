  addendum_after_readings:
  - id: AD-1
    text: 'R-8 mu_model. curves.jsonl.gz (opened after readings) records mu_model_rule "T (T - 1) / (3
      N), T = s_sub^2". This equals s^2(s^2 - 1)/(3N), which is identical to the class count (8 C(s,4)
      + 4 s C(s-1,2) + 4 C(s,2))/N noted in R-8. Its algebra: s(s-1)[(s-2)(s-3)/3 + 2(s-2) + 2] = s^2(s^2-1)/3.
      MU1 (design.json values) is unchanged. MU2 is the same "pairs/3" form with T = s(s-1), the number
      of stored 2-tails over two distinct indices, instead of T = s^2. MU2 stays an alternative.'
  - id: AD-2
    text: R-1. The own recount (A1) equals the engine's census-row fields relations_distinct and relations_nonformal
      (A2) on all 51000 scored instances (5 arms x 10200 curves). Pairs, zero pairs and R_star also agree
      on all of them. The two readings therefore give identical counts.
  - id: AD-3
    text: R-2 to R-6. Every one of the 81600 m 4 table instances is completed_valid. Every scored arm
      has fb_size == s_sub, and the height screen is empty. So the A, M and contrast curve sets all equal
      the 10200 design curves, and F1 = F2, S1 = S2, M1 = M2 and D1 = D2 = D3 = D4. V is not floored,
      pooled or in either rung, so P1 = P2. The deterministic quantities are therefore reading-invariant
      ON THESE DATA. That is a property of the realised rows; the text still leaves these points open
      in general.
  - id: AD-4
    text: R-12. kappa_hat < 1, so the observed bound uses the binomial-thinning branch. The open point
      on the per-curve excess mean (R-12) does not arise for the observed bound. It does arise inside
      the coverage designs whose kappa_hat_s > 1, where the excess total is (kappa - 1) sum m_j per rung;
      R-12 notes that this equals (kappa - 1) sum nbar_j under RH1.
  - id: AD-5
    text: "R-16 seeds added before any simulation started: - the C2-bank coverage uses inner seeds SeedSequence([0xA92FF3,\
      \ 30 + i, 0]); - the C3 plug-in diagnostic uses SeedSequence([0xA92FF3, 29, i]) (bank 1)\n  and\
      \ SeedSequence([0xA92FF3, 39, i]) (bank 3);\n- the alternative-reading observed bounds (MU2, RH2,\
      \ DD2) draw their\n  structured totals from purpose 2, the observed-bound purpose.\nEach design\
      \ family f uses one generator, SeedSequence([0xA92FF3, 10 + i, f]), for both its random-arm and\
      \ its structured draws, in that order."
  - id: AD-6
    text: Simulator control. Each bank's mean C_R* and mean sum s_j*^2 match the model's sum m_j and sum
      D_b m_j (simulator_controls in U_A). This is a positive control on the NB parameterisation of R-11.
  - id: AD-7
    text: 'Supplementary coverage extension, decided AFTER the adopted R-14 coverages were seen. The signed
      coverage at kappa 1.10 and 1.15 fell within 3 binomial Monte Carlo SE of 0.945, and at 1.15 it fell
      below 0.945. extend_coverage.py then drew 4 x 20000 further designs per kappa under the same readings,
      rule and bank 1, with new seeds: designs SeedSequence([0xA92FF3, 40 + i, f]), inner SeedSequence([0xA92FF3,
      50 + i, 0]). The extension only reduces the Monte Carlo error of the same functional; it is not
      optional stopping on any experimental datum. The ADOPTED coverages and AR-3 choice remain the pre-declared
      20000-design values. The extension and its pooling with the adopted designs (100000 per kappa, independent
      seeds, same bank) are reported beside them under U_A.supplementary_coverage_extension_AD-7.'
  - id: AD-9
    text: 'Extension results and checks (U_A.supplementary_coverage_extension_AD-7).

      Determinism. Every extension family logged before a restart was reproduced exactly by the later
      run: - kappa 1.00, families 0-2: 0.9452/0.9725, 0.9464/0.9724, 0.94285/0.97315 (X.log, X2.log, R0.log);
      - kappa 1.10, families 0-1: 0.94795/0.9749, 0.94805/0.97335 (Y2.log, R1.log). The kappa 1.10 run
      was killed and resumed mid-family 0. The kappa 1.15 extension finished before the first restart,
      written by extend_coverage.py.

      AR-3 on the pooled designs. Pooled with the adopted designs (100000 per kappa, independent seeds,
      bank 1), every signed coverage is at or above 0.945, so the signed bound would govern. On the adopted
      20000 designs, kappa 1.15 is below 0.945 and the |dev| bound governs. Both choices sit at Monte
      Carlo resolution; this report adopts neither of them over the pre-declared rule, and records both.

      Unexpected observation, kept. At kappa 1.00 the adopted 20000 designs (seed purpose 10) give signed
      coverage 0.9499 and the 80000 extension designs (seed purpose 40) give 0.944925. The difference
      is 0.004975, about 2.86 combined binomial SE. Both use the same code path, rule and bank and differ
      only in design seeds. At kappa 1.10 and 1.15 the two sets agree within 1 SE. No cause was found;
      it is read as Monte Carlo fluctuation at about the 0.4% two-sided level, and it is reported, not
      discarded.'
  - id: AD-8
    text: Labels. The upper_bound_U_A label template carries one "simulated coverage x.xxx" while three
      coverages are simulated, and the text does not say which one the label shows. The labels here show
      the minimum of the three; all three are reported.
  limitations:
  - The producer's binding pre-data interpretations PDI-1 to PDI-10 (AMD-20261008-9c080d A-7) are in implementation-notes.yaml,
    which is blind_from, and were not read. Where a PDI resolves a point differently from R-1 to R-16,
    a difference in a value is a specification-level ambiguity and not an implementation error (comparison_rule).
  - Coverage (R-14 C1). Each synthetic design's own bound is simulated at its exact kappa_hat_s with 5
    x 20000 inner replicates. The random-arm half of the inner simulation is a fixed bank shared by all
    designs (common random numbers); the structured half is drawn fresh per design. A literal per-design
    fresh inner simulation (about 4e8 full design draws per kappa) was beyond the budget. The bank's share
    of the Monte Carlo error is shown by a second, independent bank (C2) on the same designs.
  - Synthetic designs do not re-estimate rho1_hat_b and D from their own randoms; G-NB-R is held at the
    realised-data estimates (R-14). This propagation is not simulated.
  - 'Monte Carlo SE of each bound is reported as the larger of two estimates, both multiplied by SE: an
    asymptotic order-statistic SE on the pooled 100000 replicates, and the spread of the five family quantiles.
    Coverage SE is binomial over 20000 designs per kappa. The between-bank (C1 versus C2) difference is
    reported beside it.'
  - Quantiles use numpy's default (linear) definition.
  - Coverages are simulated under the adopted readings only, with banks C1 and C2. Under the alternative
    readings (MU2, RH2, DD2, Q2, AB2) only the observed bounds are reported. The AB2 coverage, which reuses
    the adopted designs, is the one exception.
  - Only class TT at m 4 and the five arms the quantities read (small_x, small_x_offset, r0, r1, r2) were
    counted. Statuses of all eight arms were read, for R-2 F2.
  - No receipt, manifest, log or checksum was read (out of read scope), so this report does not establish
    the run's admissibility.
