  ledger_archive: TASK-20260924-499d57
  written_at: '2026-09-24'
  written_before_any_reviewer_ran: true
  written_before_the_object_existed: true
  written_before_the_object_existed_note: >-
    TRUE. The producer TASK-20260924-fda726 has not run. The joints are fixed now
    by DEC-20260924-99ce20 S1 scope and design_conditions C1-C8, which are known
    before the design. The object is bound by content only after it exists, by
