  # ---------------------------------------------------------------------------
  tier:
    policy: review-breakthrough
    reasoning_effort: max
    degradable: false
    subagent_bindings: validator-breakthrough (TASK-20260924-6fbd0d, TASK-20260924-4ff2df); red-team-breakthrough (TASK-20260924-e0a065)
    ruling: >-
      review-breakthrough at max. DEC-20260924-99ce20 tripwire T1 names
      IDEA-20260922-7d6d43 and routes "the S1 design round in the NA-1 design
      batch" to review-breakthrough at max. The object prices the program's
      single below-rho index-calculus cell on a deployed binary curve, and a
      protocol that could later be read as opening (E1) or closing (E2) that
      cell is exactly what AGENTS.md rule 12 protects.
    unservable_rule: >-
      If review-breakthrough cannot be served at max for any of the three
      review cards, that card is not dispatched, the impediment is recorded on
      the still-active goal, and the contract stays unapproved. The tier is never
      lowered and no review-adversarial session substitutes (AGENTS.md "Goals are
      never paused", point 2). A backend substitution that fully meets the max
      floor is recorded as fallback_used and is not a downgrade.
    tripwires:
      - id: TA-1
        fires_when: >-
          The contract, the audit sheet, the hypothesis or any review report
          states or implies that index calculus beats rho at 571 at the TRUE
          solving degree (E1), that the 571 cell is closed (E2), or any verdict on
          the 571 cell beyond "D*(omega) in the reconciled model, assuming H1".
        effect: >-
          The reviewer finishes its joint, flags TA-1 at the top of its report and
          stops. The composer records revise on C7 and does not approve while the
          sentence stands. A genuine E1/E2 claim, if one is ever made on evidence,
          is reviewed in its own review-breakthrough round, never in this one.
      - id: TA-2
        fires_when: >-
          Any record in the round contradicts a validated evidence record, in
          particular KN-FIND-936151 / EV-SEMBIN-1ca3c8 or H-SEMBIN-97ea23.
        effect: >-
          Stop and report. Composition is suspended until a dedicated
          review-breakthrough contradiction round (AGENTS.md rule 12) is opened by
          a new Coordinator decision.
      - id: TA-3
        fires_when: >-
          The producer designed Part 3 (the true, U-4-discharged solving-degree
          measurement), re-measured a SEMBIN or SDEG quantity, or reported under
          C4 that a D_solve sensitivity surface exists or is in flight on
          GOAL-SEMBIN-fcb7a2.
        effect: >-
          R2 or C4 breach. Composition applies K-duplicate (for C4) or
          K-revise-defect (for Part 3 or re-measurement). No approval.
      - id: TA-4
        fires_when: A review card of this lane cannot be served at review-breakthrough at max.
        effect: See unservable_rule. The card is not dispatched and the contract stays unapproved.
    tripwire_note: >-
      Pre-declared, so escalation is a rule applied and not a judgement made
      after reading the reports.

  # ---------------------------------------------------------------------------
  claim_under_review:
    statement: >-
      H-NISTBIN-dec5e1 and EXP-NISTBIN-451dfa, as frozen by TASK-20260924-304b20,
      together with the proof_search_map audit sheet, are a complete protocol for
      IDEA-20260922-7d6d43 Parts 1-2 (the sensitivity surface cost_571(D_solve,
      omega), reconciled to EXP-SEMBIN-992e73's exact block_n4w model at
      D_solve = 4, the zero locus D*(omega) read only after that reconciliation,
      and the 283 proves-too-much control) that discharges DEC-20260924-99ce20
      design_conditions C1-C8 and every KN-TECH-080 audit, carries a frozen C2
      regression fixture that passes as a review computation, and is complete
      enough for Coordinator approval under standing authorization.
    conditions_to_discharge: >-
      Read verbatim from DEC-20260924-99ce20 selected S1 design_conditions C1-C8.
      They are not paraphrased further here.
    object_under_review:
      paths:
        - ledger/hypotheses/H-NISTBIN-dec5e1.yaml
        - experiments/EXP-NISTBIN-451dfa/specification.yaml
        - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-7d29e8/design/TASK-20260924-fda726/proof-search-map-audit.yaml
      binding: >-
        path_sha256 in TASK-20260924-304b20's snapshot receipt (content_at_commit;
        DEC-20260924-f0a9c7 R3 gives the reason). Every reviewer hashes the three
        files before relying on them.
      context_not_under_review: >-
        experiments/EXP-SEMBIN-992e73/ and experiments/EXP-SEMBIN-81dc96/ are
        context. Nothing in either may be edited by anyone in this round.

  # ---------------------------------------------------------------------------
  coordinator_prior:
    per_joint: >-
      J1 (baseline fixture and corrected rho column) HOLDS with probability about
      0.5. The rho arithmetic is simple and I expect it right (K-571 279.75 and
      B-571 284.83 per DEC-20260924-99ce20). If J1 breaks, I expect it on the
      fixture: either the contract does not identify the exact block_n4w model
      precisely enough for a reviewer to evaluate the fixture, or it treats
      EXP-SEMBIN-992e73's 571 row (log2 cost 186.31) as validated evidence,
      although that experiment's specification header, as this session read it,
      records status specified and says no evidence record may rest on its run.
      J2 (completeness, source reads, custody) HOLDS with probability about 0.7;
      if it breaks, I expect it on C4 (a source read attested at summary level)
      or C5 (a proposal-session figure cited as a result). J3 (the cliff model
      and the interface lemma) HOLDS with probability about 0.45; this is where I
      expect the round to break: a multiplier reconciled at D_solve = 4 that
      in fact depends on D_solve, so agreement at D = 4 does not transfer to the
      D* reading. J4 (283 control, true-vs-fake confound, R2 and routing) HOLDS
      with probability about 0.7. J5 (blind) agrees with the contract's rho
      column with probability about 0.85, and with its D = 4 target with
      probability about 0.55, because the published model may leave a
      solving-cost reading underdetermined.
    overall: >-
      Probability about 0.25 that the round composes to approve on this first
      design. The most likely outcome is revise on C3 (interface) or C2 (fixture
      identification or provenance).
    where_i_think_it_breaks_if_it_breaks: J3, then J1, then J5 on the D = 4 target.
    what_would_overturn_this_prior_most: >-
      (1) J3 showing that every omitted multiplier is D-independent, with a
      proof in the contract, so the D = 4 reconciliation transfers. (2) J5
      reproducing the D = 4 target from Semaev 2015 as published, first time,
      which would show the model is determined by its published text. (3) J1
      finding the corrected rho column wrong, which I do not expect.
    informed_prior_disclosure: >-
      The prior is informed, not blind (PD-R1). This session read
      DEC-20260924-99ce20 and IDEA-20260922-7d6d43 in full, including every value
      they quote, and a header section of experiments/EXP-SEMBIN-992e73/specification.yaml.

  # ---------------------------------------------------------------------------
  joints:
    - joint: >-
        J1 -- BASELINE FIXTURE AND CORRECTED RHO COLUMN (C1, C2). The contract's rho
        column uses sqrt(pi r/(4k)) per CORR-20260922-81aeab, k the curve's own
        Frobenius class order (1 on B-curves), with r from primary parameters at
        K-571, B-571, K-283 and B-283. Claim (A) is re-evaluated against that
        column at every FIPS, Certicom and Oakley degree under the coherent
        baseline. The C2 regression fixture is frozen, identifies the exact
        block_n4w model, states its tolerance before execution, reproduces the
        571 row at D_solve = 4, quotes the margin against both corrected rows,
        and gates every D* read.
      assigned_to: TASK-20260924-6fbd0d
      attack_plan: >-
        (i) Re-derive r and the cofactor for K-571, B-571, K-283 and B-283 from
        inputs/FIPS186-4-BINARY-CURVES/, recompute log2 matched rho under the
        convention yourself, and compare with the contract's column to 0.01 bit.
        As a convention sanity check, evaluate the same formula at ECC2K-130 and
        compare with the published iteration count KN-LIT-096 records. (ii)
        Identify the exact model the fixture names. EXP-SEMBIN-992e73 loads
        experiments/EXP-SEMBIN-81dc96/code/joint_balance.py; evaluate the
        fixture exactly as the contract freezes it, at D_solve = 4, as a REVIEW
        COMPUTATION (import the frozen module read-only, or re-implement from its
        text; say which), and report whether it reproduces the 571 row within the
        contract's stated tolerance. A tolerance stated after, or looser than the
        evidence justifies, is a finding. (iii) Provenance of the fixture target.
        Read EXP-SEMBIN-992e73's specification status and every decision that
        cites it, and say whether the target is an approved, reviewed number or
        an unapproved derivation. Check that the contract uses it as a
        reproduction target of the instrument and not as validated evidence
        about any curve. (iv) Check that claim (A) is re-evaluated at every
        FIPS, Certicom and Oakley degree against the corrected column, under
        H-SEMBIN-97ea23's coherent baseline, and that no D* appears in the
        contract's stage order before the fixture gate. WHERE I THINK IT BREAKS:
        (ii) or (iii).
      breaking_artifact: >-
        A rho value off by more than 0.01 bit or computed with the wrong k; a
        fixture that does not name an evaluable model, fails to reproduce the 571
        row within its own tolerance, or states its tolerance after the fact; a
        fixture target used as evidence although its source is an unapproved
        derivation; or a D* read that the stage order allows before the fixture
        passes.
    - joint: >-
        J2 -- PROTOCOL COMPLETENESS, SOURCE READS AND CUSTODY (C4, C5, C8). Every
        field approval requires is present; approved_by is null with an approval
        block naming DEC-20260924-124667; the audit sheet attests reading
        KN-FIND-936151, EV-SEMBIN-1ca3c8, H-SEMBIN-97ea23, EXP-SEMBIN-992e73
        RESULTS and the GOAL-SEMBIN-fcb7a2 head at source; no figure the proposal
        computed in session is cited as a result; the memory disclosure sits
        beside every time figure; zero runs; the three files hash to the snapshot.
      assigned_to: TASK-20260924-6fbd0d
      attack_plan: >-
        (i) Hash the three files against TASK-20260924-304b20's receipt. (ii)
        List every field approval requires (controls, metrics, budget, stopping
        rules, invalidation rules, required artifacts, a decidable success
        criterion with at least one negative outcome, a falsification criterion,
        interpretation limits, proof_search_map) and mark each present or absent.
        (iii) Read KN-FIND-936151 and EV-SEMBIN-1ca3c8 yourself and check that
        the contract's per-instance discharge wording matches what they say, and
        that the audit sheet's C4 attestation names what was read and at what
        depth. Check the GOAL-SEMBIN-fcb7a2 head yourself for a D_solve surface
        existing or in flight. (iv) Search the contract and audit sheet for the
        proposal's session-computed margins and D* range and for any sentence
        citing them as a result. (v) Check that every time figure carries the
        Macaulay-matrix memory figure beside it. WHERE I THINK IT BREAKS: (iii).
      breaking_artifact: >-
        A missing approval field; a non-null approved_by or an approval block
        naming another decision; a C4 read attested at summary level or a
        discharge sentence that misstates KN-FIND-936151; a proposal-session
        figure cited as a result; a time figure without its memory figure; a hash
        mismatch.
    - joint: >-
        J3 -- THE CLIFF MODEL AND THE INTERFACE LEMMA (C3, C6). The
        illustrative-to-block_n4w interface is stated as its own lemma, naming
        each multiplier the illustrative model omits, and the reconciliation at
        D_solve = 4 is shown to transfer to every D at which D* is read. H1 (the
        XL/block cost model) and H2 (the D_solve(m) growth law) are numbered, each
        with a falsification condition; H1 is validated inside the contract by C2
        and the 283 control; H2 is scheduled to GOAL-SEMBIN-fcb7a2 as a pointer.
        D*(omega) is a derived quantity and is never presented as a measured one.
      assigned_to: TASK-20260924-e0a065
      attack_plan: >-
        (i) Take the interface lemma and list every multiplier it names. For each,
        say whether it can depend on D_solve (the number of monomials or rows at
        degree D, a sparsity term, the stage split, the cofactor charge, the
        omega exponent's domain). Construct the smallest numerical case in which
        a multiplier fitted at D = 4 misplaces D* by more than one degree. A
        lemma that proves agreement only at D = 4 and then reads D* elsewhere
        breaks. (ii) Say whether omega has a meaning inside block_n4w or only in
        the illustrative surface; a D*(omega) read in a model where omega is
        fixed is a finding. (iii) Check H1 and H2 each carry a statement, a
        rigorous-support clause, a falsification condition and a validation
        route, and that the random-system null is left with Part 3 as C6 says.
        (iv) Check the quantifier order in the contract: the cliff is derived,
        the crossing is measured elsewhere. WHERE I THINK IT BREAKS: (i).
      breaking_artifact: >-
        A D-dependent multiplier treated as a constant; an interface stated as
        prose rather than a lemma; D*(omega) read where omega has no meaning; an
        unnumbered heuristic or one without a falsification condition; D*
        presented as measured.
    - joint: >-
        J4 -- 283 CONTROL, TRUE-VS-FAKE CONFOUND, R2 BOUNDARIES AND E1/E2
        ROUTING (C7, the method ceiling, and the proves-too-much control). The 283
        control uses the corrected column; no route lets a fake d'_F feed
        D_solve; Part 3 is not designed and nothing re-measures SEMBIN or SDEG
        quantities; any E1, E2 or cell verdict is routed to review-breakthrough at
        max; the strongest certifiable claim is D*(omega) in the reconciled model
        assuming H1.
      assigned_to: TASK-20260924-e0a065
      attack_plan: >-
        (i) Perform PTM-A to PTM-D below against their failure signature, using
        the contract's formulas and rules in your own script. (ii) Search the
        contract for any input path by which a fake first-fall degree could
        become D_solve (defaults, worked examples, a column labelled only
        "degree"). (iii) Read the contract's scope and exclusions against
        DEC-20260924-4f8a03 R2 and DEC-20260924-99ce20 S1 r2_owner, and quote any
        clause that designs Part 3 or re-measures a SEMBIN quantity. (iv) Quote
        every sentence in the contract, hypothesis or audit sheet that opens or
        closes the 571 cell, or states a verdict on it; check the routing clause
        names review-breakthrough at max. WHERE I THINK IT BREAKS: (iv), on
        wording.
      breaking_artifact: >-
        A PTM object on which the contract's rules reach the known-false
        conclusion; an admissible fake-degree input; a designed Part 3 or a
        re-measurement; an unrouted E1/E2 or cell-verdict sentence.
    - joint: >-
        J5 -- BLIND RE-DERIVATION OF THE LOAD-BEARING NUMBERS. Two
        implementations that share nothing produce the same log2 matched rho at
        K-571, B-571, K-283 and B-283 and the same D = 4 reconciliation target.
        See blind_rederivation below.
      assigned_to: TASK-20260924-4ff2df
      attack_plan: >-
        See blind_rederivation and blind-inputs.yaml. The re-deriver is told what
        to compute and not how. Its value is that it has read nothing but primary
        sources, one frozen model statement and its own instructions.
      breaking_artifact: >-
        Any value that differs from the contract's frozen value beyond tolerance.
        That localises the fault to an undetermined model or to one of two named
        implementations; it does not by itself say which.

  joint_ownership_note: >-
    FIVE JOINTS, THREE OWNERS, NONE UNOWNED, NONE SHARED. TASK-20260924-6fbd0d
    (validator-breakthrough) owns J1 and J2: numbers, fixture, custody and
    completeness, which need the environment and the frozen instrument.
    TASK-20260924-e0a065 (red-team-breakthrough) owns J3 and J4: the model
    interface, the controls, the confound, R2 and routing. TASK-20260924-4ff2df
    (validator-breakthrough, a separate session) owns only J5 and reads a
    whitelist that excludes every producer artifact and every record quoting the
    values it re-derives.

  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      Not lifted. No reviewer reads another reviewer's report in this round, and
      no reviewer reads lane B's reports. In particular J1's fixture evaluation
      must not reach J5 before J5 returns; the comparison is made only at
      composition. A later hardening round may lift blindness by addendum with
      its own rationale, never by drift.
    excluded_from_every_reviewer: >-
      experiments/EXP-FROB-30006a/, experiments/EXP-QSP-70b731/runs/, the ref
      origin/cursor/semaev-2015-audit-program-5b8b and PR #1377. None of it bears
      on this round.

  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20260924-e0a065
    objects:
      - id: PTM-A
        object: >-
          The 283 row (K-283 and B-283) at D_solve = 4, under the contract's
          reconciled surface and its corrected rho column.
        known_truth: >-
          In the exact model EXP-SEMBIN-992e73 evaluates, 283 loses to rho at
          D = 4 even against the naive column, and the corrected column is lower
          still, so rho wins by more. Provenance of this known truth is
          IDEA-20260922-7d6d43's citation of EXP-SEMBIN-992e73 RESULTS.md; this
          plan's author did not read RESULTS.md, so the red team confirms it
          there before relying on it and reports any difference.
      - id: PTM-B
        object: >-
          The FIPS degrees 163 and 233 and one Certicom degree of your choice,
          declared before evaluation, at D_solve = 4, under the reconciled surface.
        known_truth: >-
          EXP-SEMBIN-992e73 records that each loses to rho in the exact model at
          D = 4 (as IDEA-20260922-7d6d43 cites it; confirmed by the red team from
          RESULTS.md before use, as for PTM-A).
      - id: PTM-C
        object: >-
          The 409 row read against the naive 2^(n/2) column instead of the
          coherent baseline.
        known_truth: >-
          Under H-SEMBIN-97ea23's coherent baseline 409 is not a live cell. A
          protocol whose baseline rule admits the naive column resurrects 409 as a
          false second cell.
      - id: PTM-D
        object: >-
          A D_solve input taken from a fake first-fall degree d'_F reading at a
          toy n where KN-FIND-936151 records the fake and true readings as
          different, fed to the surface as if it were the true degree.
        known_truth: >-
          The fake degree may not be cited as bounding the true one
          (KN-FIND-936151). A correct protocol refuses the input by rule.
    failure_signature: >-
      A correct protocol keeps each known-false conclusion out of reach in its
      rules, not only in prose. PTM-A and PTM-B come out on the rho-wins side at
      D = 4. PTM-C is excluded by the baseline rule before any cell is counted.
      PTM-D is rejected as an inadmissible input before any D* is read. A rule
      that places 283, 163, 233 or the Certicom degree below rho at D = 4, counts
      409 as live, or admits a fake degree has proved too much.
    how_to_run_it: >-
      REVIEW COMPUTATIONS. Closed-form evaluation of the contract's formulas in
      your own script. They mint no RUN-*, write no evidence record, run no
      Groebner, XL, SAT or F4 solver, instantiate no curve and never execute any
      EXP-NISTBIN-451dfa or EXP-SEMBIN driver as an experiment. Put every script
      and output in computations.json. If a PTM would amount to a new
      experiment, record it NOT PERFORMED with the reason.

