      in full here. BL-4 in blind-inputs.yaml makes any computed Q1 or Q2 value
      found there a reportable leak.
    agreement_tolerance: >-
      Q1 within 0.01 bit per curve, exact on r's bit length and on k. Q2 within
      the smaller of the C2 tolerance frozen in EXP-NISTBIN-451dfa and 0.1 bit
      on log2 cost, and exact on the optimising extension parameter if the model
      has one.
    what_disagreement_means: >-
      NOT that J1 or J5 is wrong. It localises the difference to an
      undetermined model, an undetermined convention or one of two named
      implementations. The composer reads both and applies K-indeterminate or
      K-fixture; it never prefers either side.

