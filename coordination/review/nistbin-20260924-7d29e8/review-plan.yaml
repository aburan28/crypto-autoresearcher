  composing_decision: DEC-20260924-124667
  opening_task: TASK-20260924-23cefd
  archived_by: TASK-20260924-083fd4
  producer_task: TASK-20260924-fda726
  producer_snapshot: TASK-20260924-304b20
  reviewer_tasks: [TASK-20260924-6fbd0d, TASK-20260924-e0a065, TASK-20260924-4ff2df]
