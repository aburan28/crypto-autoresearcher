# =============================================================================
review_plan:
  id: REVIEW-NISTBIN-20260924-7d29e8
  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-7d29e8
  lane: A
  question_id: RQ-NISTBIN-06157b
  idea_id: IDEA-20260922-7d6d43
  hypothesis_id: H-NISTBIN-dec5e1
  experiment_id: EXP-NISTBIN-451dfa
  authorised_by: DEC-20260924-99ce20 (selected S1, design_conditions C1-C8, tripwire T1, next_actions NA-1)
