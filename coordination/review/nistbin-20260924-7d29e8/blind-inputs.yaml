# =============================================================================
# Blind inputs for TASK-20260924-4ff2df (joint J5 of REVIEW-NISTBIN-20260924-7d29e8).
#
# This file is one of the ten files you may read. It tells you WHAT to compute
# and nothing about how anyone else computed it, or what they found. It contains
# no computed value of any kind.
# =============================================================================
blind_inputs:
  task_id: TASK-20260924-4ff2df
  review_plan_id: REVIEW-NISTBIN-20260924-7d29e8
  sources:
    curve_parameters: inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md (with its source_record.yaml)
    index_calculus_model: inputs/SEMAEV-2015-310/paper_fulltext.md (with its source_record.yaml)
    model_conventions: experiments/EXP-SEMBIN-992e73/specification.yaml
  source_note: >-
    These files and your own handoff card are your ONLY repository sources. If
    one of them refers to another repository file for a formula, a convention or
    a parameter, do NOT open that file. Record the reference under Q0 and
    continue with what the permitted files state. Published mathematics from
    outside this repository may be used and is cited with provenance.

  what_you_are_testing: >-
    Whether four matched-rho figures and one index-calculus cost figure are
    determined by primary parameters, a stated convention and a published cost
    model. You are not asked whether the convention or the model is a good one.
    A second implementation, written by someone who shares nothing with you,
    will be compared with yours afterwards.

  quantities:
    Q0:
      name: undetermined choices
      definition: >-
        Every point at which your sources left you a choice: a reading of the
        convention, the value of k, a cost-model reading, a unit, a rounding
        rule, an optimisation range, a reference to another file. For each:
        quote the text, list the readings you consider admissible, and say which
        quantities below depend on it.
      report: A list. An empty list is a result and must be stated as such.
    Q1:
      name: log2 matched rho at four FIPS binary curves
      curves: [K-571, B-571, K-283, B-283]
      definition: >-
        For each curve, let r be the prime order of the base point's subgroup and
        h the cofactor, both read from the FIPS 186-4 text. Let k be the order of
        the Frobenius class map on that subgroup: for a Koblitz curve, defined
        over F_2 and used over F_(2^m), k is the order of the 2-power Frobenius
        endomorphism acting on the subgroup; for a curve not defined over a proper
        subfield, k = 1. Compute log2 of sqrt(pi r / (4 k)), the expected number
        of group operations of Pollard rho with the negation map and, where k > 1,
        the Frobenius class map. Derive k yourself and say how you did.
      report: >-
        Per curve: r in decimal, its bit length, h, k, how k was established, and
        log2 sqrt(pi r / (4 k)) to at least four decimal places.
      tolerance: 0.01 bit; exact on bit length and on k
    Q2:
      name: the D = 4 reconciliation target at extension degree 571
      definition: >-
        log2 of the total index-calculus cost for the ECDLP in the prime-order
        subgroup of a curve over F_(2^571), under Semaev 2015's optimised cost
        model evaluated in the convention EXP-SEMBIN-992e73's specification names
        as the paper's own (stage 1 only, t = m), with the first-fall or solving
        degree set to 4, and with the solving-cost reading, cofactor charge and
        optimisation range that specification declares. Where the specification
        does not determine a reading, take it from Semaev 2015 as published and
        record the choice under Q0.
      report: >-
        log2 cost to at least three decimal places; the optimising value of every
        free parameter (for example m); the unit of cost; whether the value
        differs between K-571 and B-571 and why; and the formula as you
        evaluated it, written out. Where Q0 lists a choice that changes the
        value, report the value under each admissible reading.
      tolerance: see the plan's agreement_tolerance, applied by the composer; report your value, not a comparison

  rules:
    - BL-1 Read ONLY the ten whitelisted paths on your card. Every other path in the repository is out of scope.
    - BL-2 Run no git command that shows history (log, show, blame, diff) and read no pull-request text.
    - >-
      BL-3 Choose your own libraries and algorithms and name them with versions.
      Do not transcribe a computed cost or rho figure from any source; compute it.
      Curve parameters are read from the FIPS text, not recalled.
    - >-
      BL-4 If you find, in a file you were permitted to read, a value that looks
      like an already-computed answer to Q1 or Q2, STOP and report a leak with
      the file and line.
    - BL-5 Report on J5 only. Give no verdict on the contract or the hypothesis, which you have not read.
    - >-
      BL-6 ZERO experiment runs. Instantiate no curve, run no rho walk, run no
      Groebner, XL, SAT or F4 solver. This is closed-form arithmetic.
    - BL-7 Write nothing outside your write scope. Put every script, command and raw output inside computations.json.

  verdict_rule_for_your_attestation: >-
    Your review_attestation verdict on J5 is inconclusive by design: you are
    forbidden to compare. Report Q0 to Q2 in full; the composing Coordinator
    compares them with the other implementation under the plan's keys.
