    agreement_tolerance: >-
      Q1, Q2, Q5 within 0.05 bit. Q3 exact on the identity and on the sign of
      the LA comparison at each m. Q4 within 1 bit on each endpoint and 0.2 on
      each critical g. Q6 within 1 bit on each envelope edge, 0.2 on each
      closing g, and exact on contiguity per g. Q7 within 0.05 bit.
    what_disagreement_means: >-
      Not that J1 or J5 is wrong. It localises the difference to a model
      choice (the range, the grid, contiguity reading, a constant) or one of
      two named implementations. The composer applies K-indeterminate and
      never prefers either side. If the contract's committed m = 4 range is
      neither named range, the composer compares on the per-B table over the
      contract's range where it lies inside the grid and records any part
      outside the grid as not compared.

  # ---------------------------------------------------------------------------
  composition:
    who: >-
      The Coordinator, in TASK-20260929-b0c8c3, in a fresh session that did
      not run TASK-20260929-1e739f, did not compose DEC-20260928-cec92e or
      DEC-20260928-63addc, and did not author DEC-20260929-01ea31 or either
      plan of this batch. No reviewer votes on the whole contract.
    independence_check: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/binstd-a-20260929-361e02/review-plan.yaml --reports
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-361e02/reviews/TASK-20260929-45204f/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-361e02/reviews/TASK-20260929-594e8d/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-361e02/reviews/TASK-20260929-739a0c/,
      run by the top-level session and recorded in DEC-20260929-1f5fcb
      whatever it reports. The --blind-history check is uncheckable for this
      batch (no protected-digest file) and is recorded as such (PD-R4).
    custody_without_seal: >-
      No seal card. Before TASK-20260929-b0c8c3 is launched, the top-level
      session computes sha256 of the six declared report files of this lane
      and pastes them into the launch prompt. The composer records them
      verbatim in its composition worksheet as its first act, before it reads
      any report. TASK-20260929-e85cfa must reproduce the same six digests; a
      mismatch voids the composition.
    icperf_objection_check: >-
      DEC-20260928-cec92e NA-2 and DEC-20260928-63addc PTR-ICPERF. Before the
      composer is launched the session runs tools/agent_bus.py inbox --as
      coordinator and pastes any message from the GOAL-ICPERF-e6b6a4 owner
      referencing IDEA-20260926-20ba8f, PTR-ICPERF, EXP-BINSTD-532d7f or
      EXP-BINSTD-517186, or states there is none. K-approve requires that
      statement or a ruling on the objection inside the composing decision.
    discharge_check: >-
      The composer reads the audit sheet's revision discharge table and
      checks that each of R-J1-1, R-J2-1, R-J2-2, R-J2-3, R-J3-1, R-J4-1 and
      R-J1-2 to R-SRC of DEC-20260928-cec92e maps to a named clause that the
      owning joint's report does not contradict. An item with no clause is a
      missing approval field for K-revise-defect.
    keys:
      K-approve: >-
        J1 to J4 hold; J5 agrees with the contract's frozen figures within the
        agreement tolerance (after any stated constants_delta adjustment);
        every PTM meets its failure signature; no tripwire fired; every
        revision requirement is discharged (discharge_check); the ICPERF
        objection check is recorded with no unruled objection.
        DEC-20260929-1f5fcb then approves EXP-BINSTD-517186 under the AGENTS.md
        standing user authorization and names as its first next action the
        opening of an execution batch whose first card advances the approval
        and status fields of the version-2 records and records version 1 as
        superseded. Approval asserts nothing about any curve's security, any
        oracle's cost, or index calculus against rho.
      K-revise-defect: >-
        Any of J1 to J4 breaks, a field approval requires is missing, a
        revision requirement is undischarged, or TA-3 fired. Decision revise,
        each defect listed with its joint and breaking artifact, and a
        revision design card in a new batch as the first next action.
      K-indeterminate: >-
        J5 disagrees with the contract beyond the tolerance on any quantity,
        or reports a choice that changes one. Decision revise on C2, naming
        the quantity; neither implementation is preferred.
      K-impediment: >-
        A primary source the contract cites is unreachable and the contract
        records the impediment, keeps the dependent statement marked, and
        forbids substitution (SR-NOSUB). Not a defect by itself; approval is
        permitted if every other key of K-approve holds. Citing the version-1
        red-team retrievals with URL, sha256 and verified_by is the R-SRC
        route and is not an impediment.
      K-infra: >-
        A reviewer could not run a joint. That joint reads inconclusive. No
        approval while any joint is inconclusive. An infrastructure failure
        is never negative evidence about the contract's mathematics or any
        curve.
      any_tripwire: See tier.tripwires. The composer applies the tripwire's stated effect.
    selection_point_duties: >-
      The composing decision is a selection point of GOAL-ECDLP2M-001. Per
      DEC-20260928-9d9c47 NA-3 it reads DEC-20260928-cec92e (on main),
      DEC-20260929-01ea31 R-SELECTION and, if on origin/main at its launch,
      DEC-20260929-8c3cb2, DEC-20260925-41f6dc and DEC-20260925-a84b16, and
      records only the changes to the standing order, each with its reason and
      revisit. It performs the revisits DEC-20260928-cec92e CH-3 (HOLD-X1) and
      CH-5 (HOLD-X8) assign to this decision, and CH-4 (HOLD-X2) if the lane-B
      composing decision is already on main. It re-ranks the EXP-QSP-70b731
      custody successor without displacing its hold on slot 1 unless a reason
      is recorded (DEC-20260929-01ea31 R-CUSTODY). The two technique lessons of
      DEC-20260928-9d9c47 knowledge_promotion wait until the revised
      instrument has run.

  procedure_deviations:
    - id: PD-R1
      severity: material
      what: >-
        The prior is informed, not blind. The session that wrote this plan
        read DEC-20260928-cec92e and DEC-20260928-9d9c47 in full, including
        the version-1 reviewers' findings they quote, and the version-1
