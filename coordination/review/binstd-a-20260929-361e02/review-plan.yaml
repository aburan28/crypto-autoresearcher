  coordinator_prior:
    per_joint: >-
      J1 (Stage 0, the pinned comparator, the m = 4 envelope on one range)
      holds with probability about 0.75: the column, the identity, the LA term
      and the m = 5 window held twice in version 1, so the remaining risk is
      the newly committed m = 4 range, where I expect a break, if any, on the
      closing g or on contiguity at an intermediate g being stated from a
      coarse grid, or on the L = 1 print still reading zero by construction
      (R-J1-3). J2 (code, completeness, custody, memory) holds with
      probability about 0.6; if it breaks I expect it on the reference sha256
      and extraction method of the code blocks not reproducing (R-J2-6), or on
      the prime-field self-test curve and the placement of I1 and I2 under the
      experiment directory (R-J4-2) left underspecified. J3 (the decision table
      itself) holds with probability about 0.45 and is where I expect the
      round to break: a replacement amortisation observable whose admissible
      range is again confined by an admission rule (the knee-rule lesson
      repeated one level down), or a flattening-ratio band that 341 targets
      cannot resolve, leaving a declared outcome unreachable at the designed
      sample size, or the no-reuse null separated only through a threshold
      that depends on an unmeasured constant. J4 (scope wording, R2
      boundaries, conventions, provenance) holds with probability about 0.75;
      if it breaks, on a residual over-scoped sentence of the R-J4-4 kind. J5
      (blind) agrees on the column, the identity and rho with probability
      about 0.95, on the m = 5 window and critical g with probability about
      0.9 now that the constants and comparator inputs are fixed exactly on
      the card, and on the m = 4 envelope within tolerance with probability
      about 0.7, the gap being the range, the grid and whether contiguity is
      read per g.
    overall: >-
      Probability about 0.35 that the round composes to approve. The most
      likely outcome is revise on J3 (the decision table), a cheap remedy.
    where_i_think_it_breaks_if_it_breaks: J3 on reachability, then J2 on the code pin, then J1 on the m = 4 closing g.
    estimator_prior: >-
      For the Stage 2 validation arm I expect, under the contract's own random
      model at m = 2, that the fitted slope of per-target cost against L over
      all five L will lie close to -1 for any design in which setup dominates
      at small L, whether or not relations are reused, so that the slope alone
      cannot separate amortisation from the no-reuse null; the separating
      observable must be the marginal per-target cost beyond the knee against
      kappa_2 times the mean attempt cost, where I expect genuine reuse to read
      near 1 and the no-reuse null to read at least an order of magnitude
      higher. A prior, not a result.
    what_would_overturn_this_prior_most: >-
      (1) J5 disagreeing with the contract's m = 5 window by more than 1 bit
      with the constants now fixed, which would locate a model-reading
      difference that version 1 hid inside rounding. (2) J3 finding that the
      no-reuse null is inseparable from amortisation on every observable the
      Stage 2 cells can measure, which would say the validation arm cannot
      validate H1 at this scale in any design. (3) A reviewer producing a
      published ECDLP algorithm below the S T^2 = N line on some curve, which
      withdraws the first clause of claim (C) while the column stands.
    informed_prior_disclosure: >-
      The prior is informed, not blind (PD-R1). The session that wrote this
      plan read DEC-20260928-cec92e and DEC-20260928-9d9c47 in full, the
      version-1 specification's definitions and stage_0 blocks, and
      DEC-20260928-65c6d7 and both version-1 plans.

  # ---------------------------------------------------------------------------
  joints:
    - joint: >-
        J1 -- Stage 0 recomputation, the pinned comparator and the m = 4
        envelope (C1, C2, C6 for the LA term; R-J1-1 to R-J1-6, R-J4-3). The
        contract commits, in stage0_code, B_cap(m) and the column T_gen,
        P_gen at m in 4, 5, 6, 8, 16 with N_prime = r/262; the identity; the
        LA term below P_gen; the m = 5 window at B = B_cap(5), labelled a
        B = B_cap statement, in the D3 convention (33.075936) with the
        proposal convention (32.414212) beside it; the m = 4 envelope over ONE
        committed B range, identical in the text and in stage0_code, with its
        lower edge, upper edge, closing g and contiguity at each g recomputed
        on that range and stated beside the two named slices; the L = 1
        T_shared evaluated from the model terms so that the CTL-4 arithmetic
        arm and PTM-B can fail; the unrounded D3(4) = 11.010251 in
        conventions_for_g (or the stated tie rule); the corrected audit_1
        symbolic check and reproduction_check (which single-target law the
        L = 1 slice reproduces in each convention); the D3 values at m = 5, 6,
        8 attributed to their actual source; the one-to-one rate between
        group-operation equivalents and modular multiply-adds stated as a
        model assumption. D3, never D1.
      assigned_to: TASK-20260929-45204f
      attack_plan: >-
        (i) Recompute every column with your own code at high precision and
        compare with the committed values to 0.05 bit. (ii) Recompute the m = 5
        window at B = B_cap(5) keeping A(mu) = 1/(1 - exp(-mu)) and
        retry_5 = 1/(1 - 5 exp(-5)) exactly, at g in 0, 2, 6, 10, 12, 13, 13.2,
        14 in both conventions, and the critical g. (iii) Recompute the m = 4
        envelope on the contract's committed range on a 0.01-bit grid in
        log2 B from its lower end; compare lower edge, upper edge and closing g
        (1 bit; 0.2 on g) and contiguity per g; check that the specification
        text and stage0_code declare the same range byte for byte. (iv) Read
        stage0_code statically for the L = 1 print: it must evaluate
        T_shared(B, C) + per_target(B, C) against rho_1 from the model terms,
        not return a difference that is zero by construction. (v) Grep the
        three files for 4.41, D1 and gap; any D1-as-budget use breaks C2.
        Where I think it breaks: (iii), then (iv).
      breaking_artifact: >-
        A recomputed column differing by more than 0.05 bit; a window bound
        off by more than 1 bit or a critical g off by more than 0.2; two B
        ranges, or an envelope figure not recomputed on the committed range;
        an L = 1 print that cannot fail; D1 used as a budget; any non-breaking
        item of R-J1-2 to R-J1-6 or R-J4-3 left undischarged in the discharge
        table.
    - joint: >-
        J2 -- Code, completeness, memory and custody (C4, C5 for the numbered
        heuristics, C6, C8; R-J2-4 to R-J2-8, R-J4-2, the supersession form).
        fixture_code and stage0_code are block scalars of the audit sheet with
        their extraction method and reference sha256 pinned so IR-6 can check
        them; seed labels and the generator agree between specification and
        code; a reseed rule for the base assertion on a pair F and -F; the
        coded G1 test agrees with the rule text (CERT-REL and the
        reference-solve CERT-DL in the test or out of the text); the Stage 1
        gate is tied to the instruments Stage 2 reads (I1, I2) or gated on
        them, and the I2 walk behaviour at a new distinguished point is
        specified; AR-MU applies to the binary cells only; the prime-field
        self-test curve of procedure step 2 is defined (parameters, order,
        admission) and I1 and I2 sit under the experiment directory with
        provenance rather than extending the shared index_calculus package in
        place; memory beside every time figure, including the Krylov working
        vectors in the LA memory and the comparator memory at the window upper
        ends; every approval field present; status review_required;
        approved_by null with an approval block naming DEC-20260929-1f5fcb;
        supersedes naming H-BINSTD-6e4713 and EXP-BINSTD-532d7f; the
        version-1 files unedited; zero runs.
      assigned_to: TASK-20260929-45204f
      attack_plan: >-
        (i) Extract both code blocks by the pinned method, hash them against
        the pinned reference sha256, and read them statically (a syntax check
        or dry import is a review computation, recorded as such; never run the
        fixture as an experiment). (ii) Compare the coded G1 test with the
        rule text term by term. (iii) Check the Stage 1 gate exercises I1 and
