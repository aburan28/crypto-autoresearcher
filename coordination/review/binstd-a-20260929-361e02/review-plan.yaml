      (version_1_reports_rule). J1's recomputation must not reach J5 before J5
      returns.
    excluded_from_every_reviewer: See excluded_reads_for_every_party and version_1_reports_rule above.

  scratch:
    rule: >-
      Each reviewer and the blind re-deriver uses a private scratch
      subdirectory, <session scratchpad>/BATCH-361e02/<its TASK id>/, created
      by the top-level session before launch and named in the launch prompt.
      It writes temporaries only there, never lists the scratchpad root or a
      sibling subdirectory, never lists the batch's reviews/ or composition/
      directories beyond its own task directory, and embeds every script and
      output it relies on in computations.json. Scratch is not an artifact
      and is not archived.
    reason: DEC-20260928-cec92e PD-C1 (the shared scratchpad exposed sibling file names in BATCH-d34db1).

  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20260929-594e8d
    objects:
      - id: PTM-A
        object: >-
          An oracle with per-attempt cost exactly C = T_gen(m) at matched
          advice S = B_cap, at each m in 4, 5, 6, 8, 16, fed to the contract's
          cost rules.
        known_truth: >-
          Its precomputation equals P_gen exactly and its online cost sits at
          or above T_gen; it is on the generic frontier, not below it. A rule
          that reports it below the frontier or reports a relaxation for it
          has proved too much.
      - id: PTM-B
        object: >-
          The L = 1 slice of the contract's multi-target cost at m = 4 at the
          sub-cap base 2^29.036035 and at m = 5 at B_cap(5), with T_shared
          evaluated from the model terms (R-J1-3).
        known_truth: >-
          L = 1 reproduces a single-target product law with no amortisation;
          at m = 4 in the D3 convention the tie budget is the unrounded pinned
          value 11.010251 up to the stated attempt-constant difference. A rule
          that reports an advantage at L = 1, or a tie budget that differs
          from the single-target law it names without the stated difference,
          has proved too much.
      - id: PTM-C
        object: >-
          The m = 5 window at g = 14, and the relabelled Z/NZ control against
          the ordinary and Koblitz n = 19 cells for every gated amortisation
          observable.
        known_truth: >-
          At g = 14 the window is empty in both conventions. The amortisation
          law is group-generic; a rule that predicts a different value of any
          gated observable on the Koblitz cell than on the ordinary cell or on
          Z/NZ has proved too much.
      - id: PTM-D
        object: >-
          The no-reuse null: a fixed setup spent in full, then an independent
          per-target solve that reuses no relation, with the contract's
          accounting, on CTRL-ZN and on one binary cell.
        known_truth: >-
          There is no amortisation. A rule that reads it as amortisation on
          any gated observable, or that assigns it to the POSITIVE outcome,
          has proved too much (DEC-20260928-cec92e R-J3-1; in version 1 it
          passed both exponent bands).
    failure_signature: >-
      A correct protocol keeps each known-false conclusion out of reach in its
      rules. PTM-A reads on the frontier with zero relaxation. PTM-B reads the
      single-target law with no advantage and a tie budget that can differ
      from it (the print is not zero by construction). PTM-C reads an empty
      window at g = 14 and identical predictions on all three cells. PTM-D
      fails an amortisation gate and lands in a declared non-POSITIVE outcome.
    how_to_run_it: >-
      Review computations in your own script at zero compute (arithmetic on
      the contract's rules and synthetic cost tables). They mint no RUN-*,
      write no evidence record and never execute any EXP-BINSTD-517186 driver
      as an experiment. Put every script and output in computations.json. If a
      PTM would amount to a new experiment, record it not performed with the
      reason.

