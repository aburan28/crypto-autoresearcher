        src/crypto_autoresearcher/index_calculus/. (vi) List every approval
        field present or absent; check memory beside every time figure. (vii)
        Hash the three version-2 files against TASK-20260929-36a146 and the
        three version-1 files against TASK-20260928-7a6424 at HEAD. Where I
        think it breaks: (i).
      breaking_artifact: >-
        A code block whose extraction or reference sha256 does not reproduce;
        a coded test disagreeing with the rule text; a Stage 2 instrument
        ungated; an undefined self-test curve; an instrument extending the
        shared package in place; a missing approval field; a non-null
        approved_by; a missing supersedes field; a version-1 file changed; a
        time figure without memory.
    - joint: >-
        J3 -- The decision table itself (C5 for the validation pairing;
        R-J2-1, R-J2-2, R-J2-3, R-J3-1, R-J3-3). Every declared outcome is
        reachable by some data the Stage 2 cells can produce; the most likely
        result under the contract's own random model is assigned to a declared
        outcome; every prediction is matched to the metric as defined (usable
        fraction on determined columns against a determined-column
        prediction, or R chosen so the two coincide; retries in one unit);
        no gated observable is confined by its own admission rule; the
        no-reuse null arm (fixed setup plus an independent per-target solve,
        identical accounting) on CTRL-ZN and at least one binary cell differs
        from the amortisation reading on a gated observable; the binary
        against control usable test is two-sided; CTL-6 sits in an
        invalidation rule; assumptions A2 and A3 are restated at m = 2.
      assigned_to: TASK-20260929-594e8d
      attack_plan: >-
        (i) Enumerate the outcome table. For each declared outcome construct a
        synthetic per-cell data pattern (per-target cost by L, usable
        fraction, retries, certificate rates) that the rules as written assign
        to it; an outcome with no reaching pattern breaks the joint. (ii)
        State the most likely pattern under the contract's random model and
        H1 and H2 predictions (a Monte Carlo of an abstract relation graph is a
        review computation), and read its assigned outcome; no declared
        outcome breaks the joint. (iii) For each gated observable, compute the
        range it can take for arbitrary cost data under the admission and fit
        rules; a range confined inside its pass band breaks the joint. (iv)
        Build the no-reuse null in your own script with the contract's
        accounting and feed it to the rules; it must fail an amortisation
        gate. (v) For every prediction, quote the metric's definition and the
        predicted quantity side by side. (vi) Check the usable test is
        two-sided and CTL-6 is wired. Where I think it breaks: (iii), then
        (i).
      breaking_artifact: >-
        A declared outcome no data can reach; a most-likely result in no
        declared outcome; a gated observable confined by construction; a
        prediction compared with a differently defined metric; the no-reuse
        null passing an amortisation gate; a one-sided usable test; CTL-6 in
        no invalidation rule.
    - joint: >-
        J4 -- Scope wording, R2 boundaries, conventions and provenance (C3,
        C7, C8; R-J4-1, R-J4-4, R-J3-2, R-J3-4, R-SRC). The hypothesis title
