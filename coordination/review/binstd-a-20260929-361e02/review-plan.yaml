        verified_by TASK-20260928-a75ba7; no prime-field cell and no deployed
        run designed; the IDEA-20260926-1ddce2 column cited by id; the first
        clause of claim (C) in no outcome (TA-1).
      assigned_to: TASK-20260929-594e8d
      attack_plan: >-
        (i) Quote every sentence mentioning the generic frontier, the S T^2
        line, first, below T_gen, beats, validated or every m >= 4; classify
