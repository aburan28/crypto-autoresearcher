    - id: PD-R2
      severity: disclosed
      what: The object did not exist when this plan was written; it is bound by the producer snapshot.
    - id: PD-R3
      severity: disclosed
      what: >-
        No seal card and no blind-inputs file. The blind quantities and
        parameters are carried in the blind card itself
        (ledger/handoffs/TASK-20260929-739a0c.yaml), the one batch record on
        its whitelist, as in BATCH-d34db1.
    - id: PD-R4
      severity: disclosed
      what: >-
        No protected-digest file is written for this batch, so
        tools/check_review_independence.py --blind-history is uncheckable for
        J5, never passed. Blindness from commit messages and PR text rests on
        the card's ban on every git history command and all PR text.
    - id: PD-R5
      severity: disclosed
      what: >-
        The three reviewers read DEC-20260928-cec92e, which quotes version-1
