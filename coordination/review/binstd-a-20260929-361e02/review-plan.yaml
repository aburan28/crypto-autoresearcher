        breaks: (iii).
      breaking_artifact: >-
        A frontier or first-below-the-line sentence as an outcome; an
        over-scoped sentence of the R-J4-1 or R-J4-4 kind; a convention of
        R-J3-2 absent; an unlabelled per-orbit movement; a source presented
        as read without provenance; a prime-field or deployed cell designed
