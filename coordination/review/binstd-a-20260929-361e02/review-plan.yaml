  blind_rederivation:
    required: true
    assigned_to: TASK-20260929-739a0c
    quantity: >-
      Q0 to Q7 exactly as the quantities block of
      ledger/handoffs/TASK-20260929-739a0c.yaml states them. Q0 undetermined
      choices; Q1 B_cap(m) in bits; Q2 T_gen(m) and P_gen(m) at m in 4, 5, 6,
      8, 16; Q3 the identity and the LA comparison; Q4 the m = 5 window at
      B = B_cap(5) in both conventions with the model's exact constants; Q5 the
      rho reference; Q6 the m = 4 envelope over log2 B on a 0.01-bit grid in
      two named ranges, with the per-B table; Q7 the L = 1 tie budgets.
    constants_carried: >-
      The card carries the contract's own constants as exact functional forms
      (A(mu) = 1/(1 - exp(-mu)); retry_m = 1/(1 - m exp(-m)); mu(B) =
      B^m/(m! 2^131)) and the unrounded comparator inputs 33.075936 and
      32.414212 at m = 5, 11.010251 at m = 4, and the sub-cap base by its
      definition x_sub = (log2 R + log2 0.6 - 2)/2 (29.036035 in version 1),
      as DEC-20260928-cec92e PD-C3 requires. The value is not printed on the
      card, because with it the re-deriver could back out the rho reference
      Q5 asks for; the upper end of range_a is likewise stated as log2
      B_cap(4), the re-deriver's own Q1 value. The version-2
      producer keeps these or records every change in a constants_delta
      block; the composer then adjusts by the stated arithmetic before
      comparing and records the adjustment.
    parameters: See the quantities block of that card. The card carries the statement and the parameters and no computed answer.
    blind_from:
