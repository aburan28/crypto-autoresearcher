  what_you_are_testing: >-
    Three things about EXP-AUXIN-7e2e3d as its held texts state it: which
    phrases point at a document or part of one; which rules make a run-time
    decision depend on the bytes or state of a named file, path or record;
    and which rules speak about revision, approval, custody, write scope, or
    reference reading. You are not asked whether the rules are good.

  canonical_form: >-
    A string value is hashed as the UTF-8 bytes of the string a YAML safe
    loader returns. A non-string value is hashed as JSON with sorted keys,
    ensure_ascii false and separators (',', ':'). State the library and version.

  quantities:
    BQ0:
      name: undetermined choices
      definition: >-
        Every point at which the held texts left you a choice in computing
        BQ1 to BQ3. Quote the text, list admissible readings, and name what
        depends on the choice.
      report: A list. An empty list is a result and is stated as such.
    BQ1:
      name: self-referential phrase inventory
      definition: >-
        Every occurrence in any of the six files of a phrase that designates
        a document, file, layer, contract, specification, amendment, protocol,
        text, experiment, record, table or convention by deictic or definite
        description, file name, or amendment.<path> form. For each: file,
        field path, offset, phrase verbatim, referent in the held stack.
      report: Matching rule; one record per occurrence; unresolved under BQ0.
    BQ2:
      name: held-file dependence inventory
      definition: >-
        Every clause in the six files whose run-time decision depends on the
        bytes, sha256, cleanliness, presence or archiving of a named file,
        path or record. Quote the clause and name the file or path.
      report: One record per dependence; empty list allowed.
    BQ3:
      name: reserved-topic rule inventory
      definition: >-
        Every clause that states a rule on revision, approval, custody, write
        scope or the reading of references. Quote the clause and classify
        protocol content versus machinery only.
      report: One record per clause.

  attestation_requirement:
    id: PD-C14b284-1 + PD-C36b01a-1
    text: >-
      The report MUST set INSIDE the review_attestation block all of:
      (1) review_attestation.task_id to TASK-20260930-4cc472 (PD-C14b284-1);
      (2) review_attestation.joints_owned to [EJ7] (or the owned joint list);
      (3) review_attestation.verdict or review_attestation.verdicts naming the
      joint verdict(s) (PD-C36b01a-1). Outer report.task_id, outer joints_owned,
      or outer verdict alone do not satisfy this gate. Empty any of these three
      fails the blind completion gate and independence.

  do_not:
    - Open any draft, design report, control output, review plan, or earlier AUXIN review report.
    - Open AGENTS.md, any file under agents/, any file under templates/, or any GOAL-ECDLP path.
    - Run search, grep, glob, git status, or git history commands.
    - Compute or report any census value, curve name, or control integer.
    - Reuse or open any TASK-20260929-613bf5, TASK-20260929-41af63 or TASK-20260929-68e91d inventory or report.
