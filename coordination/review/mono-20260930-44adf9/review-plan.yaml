# REVIEW PLAN FILE -- REVIEW-MONO-20260930-40470a, GOAL-MONO-001, BATCH-44adf9.
#
# WHAT THIS FILE IS: A FAITHFUL EXTRACTION, NOT A NEW PLAN.
# The authoritative plan is the inline `review_plan` block of the committed
# handoff ledger/handoffs/TASK-20260930-40470a.yaml, written 2026-09-30 under
# DEC-20260930-3a0b7b (R-3) before any reviewer ran. That handoff names no
# separate plan path, so this copy sits at the default location named by the
# BATCH-44adf9 opening instruction. Every block under `review_plan:` below is
# copied from that handoff WITHOUT CHANGING ITS SUBSTANCE: the text is copied
# as written, and only the YAML layout differs. If this file and the handoff
# ever disagree, the handoff governs and the disagreement is a custody defect
# to report. It is not a plan amendment.
#
# The handoff has no block called "composition keys". The `composition`
# section at the end of this file therefore adds NO key. It quotes, with
# sources, the composition-relevant statements that the handoff, its
# authorizing decision and the binding rules already make, and it lists the
# gaps those sources leave open (`unstated_in_sources`). Filling a gap needs a
# Coordinator plan amendment committed BEFORE TASK-20260930-40470a is
# launched. After the reviewer has run, changing it needs a versioned
# protocol_amendment.
#
# Written by a Coordinator subagent that has no shell. It is unofficial until
# the top-level session commits it (DP-2 of the handoff) and pushes it. No
# reviewer has run on this claim.
extraction:
  plan_id: REVIEW-MONO-20260930-40470a
  extracted_from: ledger/handoffs/TASK-20260930-40470a.yaml (handoff.review_plan, plus the handoff fields quoted under composition and blind_rules)
  authorizing_decision: ledger/decisions/DEC-20260930-3a0b7b.yaml
  batch_id: BATCH-44adf9
  queue: coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/dispatch_queue.json
  extracted_at: '2026-09-30'
  extracted_by: coordinator (BATCH-44adf9 opening subagent, no shell)
  faithful_extraction: true
  adds_keys: false
  reviewer_has_run: false

review_plan:
  id: REVIEW-MONO-20260930-40470a
  written_before_any_reviewer_ran: true
  supersedes_plan_of: TASK-20260904-50755f
  claim_under_review: >-
    Route (c), as stated by its producer in DEC-20260810-2f86db: "the
    generic-fibre Frobenius cycle-type census, in the frozen instrument form
    of EXP-MONO-4b50b6, AS A PROBE OF INDEX-CALCULUS RELATION RATE, at every
    m" is closed. The reason: on the factor-base locus the statistic is
    identically trivial (EV-MONO-a0a89c OBS-5). If x_1..x_{m-1} are
    x-coordinates of F_p-rational points, the roots of S_m(x_1..x_{m-1},T)
    are exactly the 2^{m-2} values x(eps_1 P_1 + ... + eps_{m-1} P_{m-1}),
    all in F_p. That no-go is proposed as the criterion-(c) object. Route (a)
    is not claimed by any record. J4 asks whether it could be, and the
    Coordinator proposes nothing on it in advance.
  coordinator_prior: >-
    Written 2026-09-30, before any reviewer ran. It restates and extends the
    2026-09-04 prior. J1: CONCUR expected, probability about 0.85. The
    argument follows from the group law. The one place I expect a gap could
    hide is still the exhaustion direction: that the sign-vector sums
    account for ALL roots of S_m over the algebraic closure, counted with
    multiplicity. A DISSENT there would most likely come from repeated roots
    (coincident sign-vector sums, e.g. 2-torsion or P_i = +/-P_j), where
    "exactly 2^{m-2} distinct values" fails even though complete splitting
    holds. That would weaken the wording but not the no-go. J2: CONCUR
    expected on overreach. I expect the reviewer to find that D-3's
    "imprimitivity half ... LIVE at m >= 4" and the goal head's text are
    STALE (they underclaim) relative to DEC-20260904-dd58c3, and to flag
    this. Staleness in the direction of underclaiming is not overreach.
    J3: CONCUR expected, about 0.75. The weakest point is whether "recorded"
    in criterion (c) is satisfied by a derivation-based no-go rather than a
    measured one. D-6 argues it is. J4: genuinely uncertain, CONCUR about
    0.5. Criterion (a) does not name an arity, and EV-MONO-e9dc3b is an
    exhaustive census agreeing with full S_4. But the census is not the
    frozen EXP-MONO-4b50b6 protocol the objective names, it covers the
    symmetric base at m=4 on 4 curves and 2 primes only, and
    DEC-20260904-dd58c3 itself declined to mark any criterion met. I would
    not be surprised by DISSENT or INCONCLUSIVE on J4. I expect the
    composed round to support closure under (c) alone.
  prior_by_joint:
    note: >-
      Index of coordinator_prior above, for the composer's prior-versus-outcome
      table. It adds nothing: every value is quoted from coordinator_prior.
    J1: {expected: CONCUR, probability: 'about 0.85'}
    J2: {expected: 'CONCUR (on overreach)', probability: 'not stated'}
    J3: {expected: CONCUR, probability: 'about 0.75'}
    J4: {expected: 'genuinely uncertain, CONCUR about 0.5', probability: 'about 0.5'}
    round: 'expect the composed round to support closure under (c) alone'
  joints:
    - joint: >-
        J1 - DERIVATIONAL SOUNDNESS OF THE NO-GO (carried from
        50755f J1). On the factor-base locus, S_m(x_1..x_{m-1},T) splits
        completely over F_p with root set exactly { x(eps_1 P_1 + ... +
        eps_{m-1} P_{m-1}) }, which has cardinality deg_T S_m = 2^{m-2} for
        m >= 3, counted with multiplicity. So the cycle-type statistic is
        constant on that locus.
      assigned_to: TASK-20260930-40470a
      attack_plan: >-
        Re-derive blind (see blind_rederivation), from the group law and the
        defining property of Semaev polynomials (S_m(x_1..x_m) = 0 iff there
        exist points P_i with x(P_i) = x_i and P_1 + ... + P_m = O). Also
        build S_4 yourself by resultant recursion over a prime in 50-2000.
        Check (a) completeness: all four T-roots lie in F_p for random
        factor-base triples. Check (b) exactness: the root multiset equals
        the sign-vector multiset. Check (c) degeneracies: construct triples
        with P_i = +/-P_j, a 2-torsion P_i, and a coincident sum, and report
        what happens to multiplicity and to the statistic. Attack the
        exhaustion direction first.
      breaking_artifact: >-
        One factor-base-locus instance where S_m fails to split completely
        over F_p, or where a root lies outside the sign-vector set; or a
        derivation showing the root count differs from 2^{m-2} with
        multiplicity. A degeneracy that changes only distinctness is
        reported as a scope correction, not a break.
    - joint: >-
        J2 - SCOPE HONESTY (carried from 50755f J2, widened). The no-go
        must close ONLY the instrument form. It must not close the
        relation-rate question (D-2), the D-4 direction swap, or any other
        statistic, and it must not license an m >= 4 census in the rejected
        form. WIDENED: audit the no-go's scope statements against the
        records committed since 2026-09-04 (DEC-20260904-dd58c3,
        H-MONO-ebd400, KN-FIND-edd62c, KN-FIND-19f5ea, DEC-20260905-021e6e)
        and the current goal head.
      assigned_to: TASK-20260930-40470a
      attack_plan: >-
        Run the proves-too-much control (below). Then audit wording for
        overreach: any sentence in DEC-20260810-2f86db or the goal head that
        could be read as closing the relation-rate half, condemning the D-4
        statistic, or closing any statistic other than the generic-fibre
        cycle type. Separately, list statements the later records make
        stale, such as D-3's m >= 4 imprimitivity sentence versus
        H-MONO-ebd400. Label each finding as overreach or underclaim.
      breaking_artifact: >-
        A reading that licenses "the relation-rate half of KN-OPEN-009 is
        closed" or "the D-4 swapped statistic is condemned", or a
        demonstration that the D-1 argument structure transfers to the
        swapped statistic.
    - joint: >-
        J3 - ADEQUACY FOR CRITERION (c) (carried from 50755f J3).
      assigned_to: TASK-20260930-40470a
      attack_plan: >-
        Quote-match criterion (c) against DEC-20260810-2f86db. Is the no-go
        scoped (J2)? Is it recorded in a committed Coordinator decision? Is
        adopting it consistent with DEC-20260802-a51c82 N-2, which examined
        only (a), and with D-6/D-9? Check that closure under (c) implies no
        hypothesis-status change and no claim beyond toy. Build the exact
        quote trail. No new mathematics is needed.
      breaking_artifact: >-
        A reading of criterion (c) that the record does not satisfy (for
        example, one requiring measurement rather than derivation, or scope
        statements the record lacks), or a contradiction that closure would
        paper over.
    - joint: >-
        J4 - ADEQUACY OF H-MONO-ebd400 / EV-MONO-e9dc3b FOR CRITERION (a)
        (NEW). Criterion (a): "the census agrees with full
        symmetric/wreath monodromy within stated error".
      assigned_to: TASK-20260930-40470a
      attack_plan: >-
        This is a consistency joint. Quote-match criterion (a) and the goal
        objective ("Decide KN-OPEN-009 at toy scope via a frozen
        Chebotarev/monodromy census protocol") against EV-MONO-e9dc3b,
        H-MONO-ebd400, EXP-MONO-0e6e8f/specification.yaml and
        DEC-20260904-dd58c3's scope_statement and official_status_changes
        (completion_criteria_met []). Decide five things: whether "the
        census" in (a) must be the EXP-MONO-4b50b6 instrument or any frozen
        census; whether m=4 over the symmetric base on 4 curves and 2 primes
        meets "within stated error"; whether "agrees with full ... monodromy"
        is met by an exhaustive group-theoretic identification (a 4-cycle
        and a 3-cycle force S_4) rather than a distributional fit; whether
        CORR-20260904-33fbf3 affects the headline; and whether the m=3
        non-discrimination (DEC-20260802-a51c82 D-2) conflicts with adopting
        (a). Do not re-run or recompute the census. Its validation is
        committed and is not this joint.
      breaking_artifact: >-
        A reading of criterion (a) or the objective that the m=4 result does
        not satisfy, or a committed statement that adopting (a) would
        contradict.
  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      Single-reviewer round. No sibling report exists. The reviewer may read
      the committed m=4 review outcomes as recorded in DEC-20260904-dd58c3,
      but not the underlying reviewer task reports, which the inputs do not
      list.
  proves_too_much:
    objects:
      - >-
        A GENERIC base tuple: x_i drawn from F_p and NOT constrained to be
        x-coordinates of F_p-rational points. The census statistic is
        expected to vary there. If the D-1 argument structure also "proves"
        constancy for such tuples, it proves too much.
      - >-
        The D-4 swapped statistic on the same locus: fix T = x(R) and count
        FB-rational points on the fibre of the projection to the T-line. If
        D-1's argument yields constancy here too, the no-go condemns its own
        named successor.
    failure_signature: >-
      The argument succeeds (proves constancy) on either object. Record the
      exact step that fails to stop at the locus boundary.
    assigned_to: TASK-20260930-40470a
  blind_rederivation:
    required: true
    quantity: >-
      The OBS-5 root-set statement for m=3 and m=4: the F_p-root multiset of
      S_m(x_1..x_{m-1},T) on the factor-base locus equals
      { x(sum eps_i P_i) } and has size 2^{m-2} with multiplicity. Derive it
      from the group law and the defining property of Semaev polynomials,
      using your OWN S_4.
    parameters: >-
      Any prime p in 50-2000 and any curve over F_p, with at least 20 random
      factor-base tuples at m=4 plus the degeneracy instances of J1(c). The
      producer used p=211 and y^2 = x^3 + 3x + 8. You need not use them.
    blind_from:
      - experiments/EXP-MONO-4b50b6/
      - coordination/goals/GOAL-MONO-001/batches/BATCH-003/
    assigned_to: TASK-20260930-40470a
  procedure_deviations:
    - id: PD-A
      what: >-
        The plan was refreshed from TASK-20260904-50755f before any reviewer
        ran. J2 is widened, J4 is added, and a new prior is recorded.
        Reasons are in DEC-20260930-3a0b7b R-3. J1-J3 keep their 2026-09-04
        substance, and that prior is preserved in 50755f.
    - id: PD-B
      what: >-
        One reviewer owns every joint, the control and the blind
        re-derivation, as in the 2026-09-04 plan. This buys coverage, not
        cross-reviewer independence. Disclosed in DEC-20260930-3a0b7b
        limitations.

