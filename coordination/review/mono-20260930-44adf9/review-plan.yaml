# COMPOSITION. Every entry is quoted, with its source. This section adds no
# key. The composer is TASK-20260930-e74f4c (a fresh Coordinator session).
composition:
  status: >-
    EXTRACTED. The handoff and DEC-20260930-3a0b7b contain no block named
    composition keys. The entries below are the composition-relevant
    statements they, and the binding rules, already make.
  composer_task: TASK-20260930-e74f4c
  stated:
    - id: C-1 reviewer decides nothing
      source: handoff.objective; handoff.constraints[1]
      text: >-
        "Your verdicts are the input a Coordinator closure decision needs. You
        decide nothing yourself." / "Report on YOUR joints only (J1-J4 plus
        the proves-too-much control and the blind re-derivation). The
        Coordinator composes the round. Give no whole-goal verdict."
    - id: C-2 route independence
      source: handoff.uncertainty_reduced
      text: >-
        "A DISSENT on J1 with a CONCUR on J4 would leave route (a) standing,
        and the reverse would leave route (c) standing. Both are
        decision-changing."
    - id: C-3 the two outcomes
      source: DEC-20260930-3a0b7b next_actions NA-1
      text: >-
        "a fresh Coordinator session composes J1-J4 into a decision that
        either adopts criterion (c) and/or (a) as met, moves GOAL-MONO-001 to
        completed together with the KN-OPEN-009 supersession, and promotes
        knowledge per the gate; or records the DISSENT and keeps the goal
        active."
    - id: C-4 adoption and supersession land together
      source: DEC-20260810-2f86db next_actions N-1 and knowledge_promotion.not_warranted
      text: >-
        "On an adopting verdict, GOAL-MONO-001 moves to completed under
        criterion (c) in a committed Coordinator decision, together with the
        KN-OPEN-009 supersession deferred above." / "Promotion is deferred
        until the rule-12 review-breakthrough adopts the no-go; at that point
        the supersession and the goal closure should land together." The
        supersession's intended shape at that time: "a supersession of
        KN-OPEN-009 splitting it into its two halves - a closed instrument
        no-go for the generic-fibre cycle-type relation-rate probe, and a
        still-open imprimitivity question at m >= 4." (Written before
        DEC-20260904-dd58c3. J2's staleness audit bears on the second half.)
    - id: C-5 a recorded DISSENT blocks closure
      source: CLAUDE.md non-negotiable rule 8
      text: >-
        "a recorded `DISSENT` still blocks closure"
    - id: C-6 J1 distinctness is a scope correction
      source: review_plan.joints[J1].breaking_artifact; coordinator_prior (J1)
      text: >-
        "A degeneracy that changes only distinctness is reported as a scope
        correction, not a break." / "That would weaken the wording but not
        the no-go."
    - id: C-7 staleness is not overreach
      source: coordinator_prior (J2); review_plan.joints[J2].attack_plan
      text: >-
        "Staleness in the direction of underclaiming is not overreach." /
        "Label each finding as overreach or underclaim."
    - id: C-8 infrastructure is not evidence
      source: handoff.constraints[4]
      text: >-
        "A timeout, crash or tooling failure is not evidence about the
        mathematics (AGENTS.md core rule 5). Report it as what it is."
    - id: C-9 unservable tier
      source: handoff DP-3; DEC-20260930-3a0b7b R-1 and NA-1
      text: >-
        "If either fails, DO NOT DISPATCH. IMP-1 stands." / "If DP-3 (effort
        max) cannot be confirmed, do not dispatch. IMP-1 then stands with its
        recheck, and the harness moves to rank 2."
    - id: C-10 model-correlation disclosure
      source: DEC-20260930-3a0b7b R-2 and limitations
      text: >-
        "The model-correlation confound that EV-MONO-a0a89c already records
        stays a DISCLOSED LIMITATION. Any closure decision that rests on this
        review must repeat it." / "The review is independent by session and
        by role, not by model (R-2). Any closure decision must say so."
    - id: C-11 tier and status ceiling
      source: handoff.constraints[6]; review_plan.joints[J3].attack_plan
      text: >-
        "The claim tier ceiling stays toy. No security estimate moves in
        either direction. Nothing you write is an ECDLP result." / "Check
        that closure under (c) implies no hypothesis-status change and no
        claim beyond toy."
  unstated_in_sources:
    - >-
      Which joints a route-(c) adoption requires. C-2 ties route (c) to J1.
      The plan titles J3 "ADEQUACY FOR CRITERION (c)" and J2 "SCOPE
      HONESTY" of the same no-go, but no source states that CONCUR on J2
      and on J3 is each required. The same holds for route (a) and J4
      beyond C-2.
    - >-
      How an INCONCLUSIVE verdict on a joint composes. The sources speak
      only of CONCUR and DISSENT, while the deliverables permit
      INCONCLUSIVE.
    - >-
      How a J2 overreach finding that does not reach the breaking_artifact
      composes, for example a wording repair short of licensing closure of
      the relation-rate half.
    - >-
      Whether a failed proves-too-much control, or a blind re-derivation
      that disagrees with OBS-5, is itself a DISSENT on J1 or J2, or a
      separate finding.
  gap_handling: >-
    Not filled by this extraction. A Coordinator plan amendment committed
    before TASK-20260930-40470a launches may fill these gaps. Otherwise
    the composer may not invent a key after reading the report (AGENTS.md:
    success criteria are never changed after observing outcomes without a
    versioned protocol_amendment). The composer card TASK-20260930-e74f4c
    states the conservative handling it applies if a gap is actually hit.
