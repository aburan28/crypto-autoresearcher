  definitions:
    composed_status:
      note: >-
        A composed status is the composer's classification of a joint for
        the purpose of adopting a route. It sits BESIDE the verdict as
        reported and never replaces it (C-1).
      C: composes as CONCUR. The joint may carry a route.
      B-D: blocking; the reviewer reported DISSENT on the joint.
      B-W: >-
        blocking wording defect. The reviewer did not DISSENT, but a
        pre-declared breaking-artifact clause is literally met outside every
        pre-declared carve-out (K4c), or a K3 cure condition is unmet. It is
        not a finding against any substance the reviewer affirms.
      N-E: >-
        not established. The reviewer reported INCONCLUSIVE (K2), or the
        report is internally inconsistent on the joint (K4d).
    load_bearing_joint: >-
      A joint whose subject is a step the route's claim needs. Per
      templates/research-records.md (review_plan.joints): "the load-bearing
      steps: if one fails, the claim fails".
    adopt: A committed Coordinator decision records the route's completion criterion as met.
    stands_or_remains_open: >-
      The route is not adopted and not eliminated. Every blocking ground on
      it has a named cure, or is a DISSENT open to supersession on the
      merits. This is how the amendment reads C-2's "would leave route (c)
      standing": it means not eliminated, never adopted.

  keys:
    # ------------------------------------------------------------------ K1
    - id: K1
      settles: gap 1. Which joints a route adoption requires, and whether a DISSENT on J2 or J3 blocks route (c).
      rule_text:
        - >-
          K1a. Load-bearing joints. Route (c) needs J1, J2 and J3. Route (a)
          needs J4. Findings of the proves-too-much control and of the blind
          re-derivation reach a route only through the joint they compose
          under (K4).
        - >-
          K1b. A route may be adopted only if EVERY load-bearing joint
          composes as C. Any B-D, B-W or N-E on a load-bearing joint blocks
          adoption of that route. So a DISSENT on J2 or on J3 blocks route (c).
        - >-
          K1c. A DISSENT on a joint that is not load-bearing for a route does
          not block that route (C-2). The exception is ground-following. If the
          DISSENT's stated grounds condemn a record or statement that the
          route's adopting decision would rest on, or would itself write
          (including the goal-head projection and the C-4 supersession
          text), the DISSENT blocks that route too, until it is cured or
          superseded on the merits.
        - >-
          K1d. Whether or not it blocks, every recorded DISSENT is carried by
          reference into any adopting decision. That decision may not state or
          imply anything the DISSENT's grounds deny. For example, a route-(c)
          closure may not state or imply that criterion (a) is met.
        - >-
          K1e. Persistence. A recorded DISSENT blocks its route or routes
          until a committed Coordinator decision supersedes it on the merits.
          That decision must cite a fresh rule-12 review of the cured object.
          Recomposing the same report never lifts a DISSENT.
      principled_basis:
        - >-
          Conjunctive composition is the program's definition of a joint.
          templates/research-records.md says "the load-bearing steps: if one
          fails, the claim fails". AGENTS.md "Review architecture" says "The
          claim's load-bearing steps are named".
        - >-
          J2 is load-bearing for (c) on the text alone. Criterion (c) reads "a
          SCOPED instrument/protocol no-go is recorded" (goal.yaml
          completion_criteria). J2 is the scope-honesty joint of that no-go.
          J3's own attack plan asks "Is the no-go scoped (J2)?". J3 is titled
          "ADEQUACY FOR CRITERION (c)". J1 is the no-go's soundness.
        - >-
          Routes are independent because the criterion is disjunctive:
          "either (a) ..., or (b) ..., or (c) ...". C-2 states this
          independence, and it was written before the review.
        - >-
          AGENTS.md: "A single DISSENT blocks closure ... it stands until a
          new Coordinator decision supersedes it on the merits ... having
          obtained a dissent, closing anyway is incoherent". Incoherence
          arises when a closure rests on, or asserts, what a dissent denies.
          K1c and K1d are that test. K1e is the rule's own persistence clause.
      precedent:
        - C-2 (handoff uncertainty_reduced, written before any reviewer ran).
        - >-
          DEC-20260802-a51c82 N-2 examined criterion (a) only, and
          DEC-20260810-2f86db D-6 records that (c) was never examined. The
          program has assessed the criteria separately before. (Quoted in the
          review's J3 quote trail and confirmed by DEC-20260930-8553d4 R-J3/R-J4;
          this session did not reopen those records.)
        - DEC-20260930-8553d4 invariance_note already reads C-5 route-scoped, as C-2 requires.
      alternatives_rejected:
        - alternative: Route (c) is tied to J1 alone, reading C-2 as a sufficient condition.
          why_rejected: >-
            C-2 speaks of a route "standing", not of adoption. This reading
            would adopt a no-go whose scope and whose adequacy for criterion
            (c) failed review. Criterion (c)'s own word "scoped" would stop
            binding. It also contradicts the load-bearing definition, and it
            favours adoption without any higher justification.
        - alternative: Any DISSENT on any joint blocks every route (whole-goal reading).
          why_rejected: >-
            This is more conservative, but it contradicts a pre-registered
            entry (C-2) and the disjunctive criterion. It would hold the goal's
            closure hostage to a route nobody claimed. It is rejected on
            principle, not for its effect: on the committed report it changes
            nothing, because both routes are blocked under either reading.
            K1c and K1d keep the sound part of it, namely that a dissent's
            grounds may not be contradicted or relied on.
      conservatism_and_higher_bar: >-
        This is the most conservative reading consistent with the
        pre-registered C-2. Looking ahead, K1 lets route (c) be adopted even
        though J4 DISSENTs. That favours adoption relative to the whole-goal
        reading, so it must meet the higher bar. It does: the permission comes
        from C-2 and the disjunctive criterion, both fixed before the review.
        This amendment only states it and restricts it (K1c, K1d, K1e). It
        does not create it.
      effect_on_committed_report: >-
        Route (c): J1 is B-W (K4c), J2 is B-D (O-1) and J3 is B-D (G-1, G-2).
        It is NOT adoptable. Route (a): J4 is B-D. It is NOT adoptable.
        Ground-following (K1c): J2 O-1 condemns DEC-20260810-2f86db D-5/N-2,
        which is already part of the route-(c) object. J4's grounds (the V_4
        ordered base, the withdrawn M3, and the contradictions with N-2 and
        dd58c3) condemn neither DEC-20260810-2f86db nor EV-MONO-a0a89c, so
        they do not block route (c) by ground-following. Under K1d, though, any
        route-(c) adoption and its C-4 supersession text may not state
        criterion (a) met, and may not state full symmetric or wreath
        monodromy on KN-OPEN-009's ordered base. Under K1e the J2 and J3
        DISSENTs persist against route (c), and the J4 DISSENT against route
        (a), until each is superseded on the merits. The outcome is
        identical to DEC-20260930-8553d4's.

    # ------------------------------------------------------------------ K2
    - id: K2
      settles: gap 2. How an INCONCLUSIVE verdict composes. Optional under NA-1; settled here because it binds the successor round and the report does not touch it.
      rule_text:
        - >-
          K2a. INCONCLUSIVE on a load-bearing joint composes as N-E. It blocks
          adoption of that route. It never nets against CONCURs on other
          joints.
        - >-
          K2b. N-E is not a DISSENT. It needs no supersession on the merits.
          It is not negative evidence, and the route remains open. Its cure is
          a fresh rule-12 review of that joint, or of the object once any
          missing artifact exists, under a plan that names what would decide
          the joint.
        - K2c. INCONCLUSIVE on a joint that is not load-bearing blocks nothing, and it is carried by reference.
      principled_basis:
        - >-
          "If one fails, the claim fails" makes composition conjunctive, and an
          unestablished step does not establish the claim. AGENTS.md: "A
          `completed` goal still requires a committed Coordinator decision
          showing the criterion was met. Reachable is not automatic."
        - >-
          AGENTS.md core rules 5 and 6, and C-8: absence of support is not
          refutation. So INCONCLUSIVE is neither adoption nor a negative
          result.
      precedent: TASK-20260930-e74f4c CM-4 already treats a landed gap as "not a DISSENT and not negative evidence". K2 applies the same logic to a joint that is not established.
      alternatives_rejected:
        - alternative: INCONCLUSIVE composes as CONCUR with reservations.
          why_rejected: It would adopt on a step nobody established, which is the failure conjunctive composition exists to prevent.
        - alternative: INCONCLUSIVE composes as DISSENT.
          why_rejected: >-
            It would read absence of support as a negative (core rule 5 by
            analogy). It would also demand a supersession on the merits of a
            verdict that asserts nothing.
      conservatism_and_higher_bar: Conservative. It never favours adoption.
      effect_on_committed_report: None. No joint in the committed report is INCONCLUSIVE.

    # ------------------------------------------------------------------ K3
    - id: K3
      settles: gap 3. How a J2 overreach finding that falls short of the breaking artifact composes.
      rule_text:
        - >-
          K3a. An overreach finding under J2 that does not meet J2's
          breaking_artifact does not by itself change J2's verdict. The
          threshold is pre-registered, and the verdict is the reviewer's (C-1).
        - >-
          K3b. It is a CURE CONDITION on any decision that adopts a route. Each
          such finding in any report the decision composes must be answered,
          finding by finding and cited by finding id, with an explicit
          narrowing or counter-statement. The answer is committed before the
          adopting decision or inside it. There is one limit. If the answer
          narrows a committed record's own directive or disposition, rather than
          how the decision reads that record, it must be a committed correction
          record that predates the adopting decision, because records are
          immutable (CLAUDE.md rule 2).
        - >-
          K3c. The narrowing must also be carried into every text the adopting
          decision projects: the goal head, the C-4 supersession and any
          knowledge entry.
        - >-
          K3d. An unmet cure condition composes J2 as B-W for adoption. It
          blocks, but it is not a DISSENT and not negative evidence.
        - >-
          K3e. Staleness in the underclaim direction stays under C-7. It is
          neither a ground nor a cure condition. Nothing here licenses an
          adopting decision to repeat a statement a staleness finding shows
          to be false (core rule 9).
      principled_basis:
        - >-
          J2's stated purpose: "The no-go must close ONLY the instrument form".
          Closure is "the strongest claim the program makes" (AGENTS.md).
          Carrying a known overreach into it, uncorrected, defeats both that
          purpose and rule 4's scoping duty.
        - >-
          The plan's own pattern for sub-threshold defects is a correction
          carried in the wording, not a break (C-6). K3 applies that pattern
          to scope, and it makes the correction blocking until it is carried.
      precedent:
        - >-
          DEC-20260810-2f86db D-2 narrows EV-MONO-a0a89c's inference sentence.
          The reviewer treats that narrowing as neutralizing O-2, on the
          condition that "Any closure decision that cites EV-MONO-a0a89c must
          carry D-2's narrowing explicitly" (review_report.md J2 O-2).
        - DEC-20260930-8553d4 CU-2 and CU-3 applied exactly this pattern to O-2 and O-3.
      alternatives_rejected:
        - alternative: Sub-threshold overreach does not compose at all.
          why_rejected: It lets an overreach the reviewer has already identified enter the program's strongest claim.
        - alternative: Sub-threshold overreach composes as DISSENT.
          why_rejected: >-
            It overrides both the reviewer's classification and the
            pre-registered threshold (C-1). It also misfits the defect: a
            DISSENT persists until superseded on the merits, while a wording
            overreach is fully cured by a committed narrowing.
      conservatism_and_higher_bar: >-
        K3 is stricter than the verdict as reported, because it adds a
        blocking condition. It is less strict than the DISSENT alternative. In
        future rounds it could therefore favour adoption relative to that
        alternative, so it must meet the higher bar. It does. The breaking
        artifact that separates the two was pre-registered. The reviewer, not
        the composer, did the classifying. And K3 still blocks until every
        finding is answered in committed text.
      effect_on_committed_report: >-
        It does not decide J2 here. J2 is B-D on O-1, which meets the
        breaking artifact and is not a K3 finding. Cure status as recorded:
        O-2 is answered by DEC-20260810-2f86db D-2 and DEC-20260930-8553d4
        CU-2. O-3 is answered by DEC-20260930-8553d4 CU-3 (the goal-head
        counter-statement). O-4 is NOT yet answered by any committed record
        (DEC-20260904-dd58c3's next_action (3) and the goal head's
        "DECISIVELY CONFIRMED" line). Any future adopting decision must
        therefore carry an O-4 narrowing. It must say that those statements
        rest on a census of 4 curves at 2 primes. It must also say that the
        uniform-in-curve statement is so far only a single-reviewer
        derivation, which CU-9 has not re-derived. No route becomes
        adoptable.

    # ------------------------------------------------------------------ K4
    - id: K4
      settles: >-
        gap 4. Whether a failed proves-too-much control, or a blind
        re-derivation that disagrees with or corrects OBS-5, is itself a
        DISSENT. This includes the SC-2-versus-C-6 question: whether a J1
        CONCUR that concedes the SC-2 degree drop composes as CONCUR.
      rule_text:
        - >-
          K4-general. The proves-too-much control and the blind re-derivation
          are instruments, not joints. The handoff requires verdicts on J1-J4
          only (deliverables[0], completion_gate[1]), and constraints[1] lists
          the control and the re-derivation beside the joints. Their findings
          carry no verdict of their own. Each composes under the joint whose
          breaking_artifact it reaches.
        - >-
          K4a. Failed proves-too-much control. If the argument under review
          (D-1) succeeds on object 1 (a generic tuple), the argument proves
          too much. That reaches J1's subject, derivational soundness
          (AGENTS.md: such an argument "is wrong somewhere"). If it succeeds on
          object 2 (the D-4 count), it meets J2's breaking-artifact clause 3
          verbatim. A failure against a different provision composes under
          the joint whose breaking artifact it reaches. For example, a
          provision condemning the D-4 statistic reaches J2 clause 2. Either
          way the reached joint composes as B-D if the reviewer DISSENTs on
          it, and as N-E (K4d) if the reviewer CONCURs without addressing the
          failure. It never composes as C.
        - >-
          K4b. Disagreeing blind re-derivation. Per AGENTS.md, "disagreement
          localises to one of two named implementations". (i) If it is not
          localised, J1 is N-E. (ii) If it is localised to the producer and
          meets a J1 breaking clause outside every carve-out, J1 is B-D when
          the reviewer DISSENTs and follows K4c when the reviewer CONCURs.
          (iii) If it is localised to the producer and falls within a
          pre-declared carve-out, it is a scope correction (C-6). J1 composes
          as C, and the corrected wording is mandatory in every adopting text.
          (iv) If it is localised to the re-deriver, it has no effect.
        - >-
          K4c. Carve-outs are read as written. A pre-declared carve-out is not
          extended by analogy after the outcome is known. Suppose a correction
          literally meets a pre-declared breaking-artifact clause and lies
          outside every pre-declared carve-out. Then it composes the joint as
          B-W, even under a CONCUR verdict, and the verdict is still recorded
          as reported (C-1). B-W blocks adoption on the wording as recorded.
          It asserts nothing against the substance the reviewer affirms. It is
          cured only when the corrected statement is carried verbatim as the
          scope of a committed record that the adopting decision cites, and
          that record has been reviewed by a fresh rule-12 review. A composer
          may not cure B-W by adopting corrected wording inside its own
          decision.
        - >-
          K4d. Internal inconsistency. Suppose a report records a finding that
          meets a joint's breaking artifact, gives that joint CONCUR, and does
          not classify the finding, or classifies it against K4c. The joint
          then composes as N-E. The composer never converts a verdict to
          DISSENT, and never to C.
      principled_basis:
        - >-
          Pre-registration discipline. agents/coordinator.md forbids changing
          success criteria after observing outcomes without an amendment, and
          a carve-out is part of the pre-registered criterion. To widen it now,
          by analogy, would itself be a post-hoc criterion change, and it
          would be one that favours adoption. Analogy after the fact cannot
          meet the higher bar such a change requires.
        - >-
          C-6 names exactly one case: "A degeneracy that changes only
          distinctness". The prior's "would weaken the wording but not the
          no-go" was written about repeated roots, the case C-6 carries. The
          J1 joint as frozen states "cardinality deg_T S_m = 2^{m-2}". SC-2
          shows this is false for the affine degree on the proper closed
          sublocus S_{m-1}(x_1..x_{m-1}) = 0. The claim as stated is false
          there, even though its substance survives.
        - >-
          Instruments are not joints, which follows from the handoff's
          structure. Routing their findings through breaking artifacts keeps
          composition anchored to what was declared before the review.
      precedent:
        - >-
          CORR-20260904-33fbf3 and the review's J4 item 2. When a
          pre-registered test failed (M3), the exact null derived after the
          data were seen was not allowed to rescue it (as quoted in
          review_report.md; not reopened here).
        - >-
          experiments/EXP-ECRANK-73275e/amendments/v2_replication_protocol.yaml:
          "Executed runs R1-R8 are NEVER re-scored" and "the v1 expectation ...
          is withdrawn for v2 runs only". An amendment applies forward, and it
          does not re-score completed work in the favourable direction.
        - C-6 itself, read as written.
      alternatives_rejected:
        - alternative: Purposive reading. SC-2 is a scope correction, J1 composes C, and the reviewer's four reasons apply.
          why_rejected: >-
            The mathematics is not disputed. This amendment accepts that SC-2
            leaves splitting, sign-set membership and trivial Frobenius
            intact, and that the root multiset in P^1 is exact. What is
            disputed is whether a post-hoc amendment may widen a
            pre-registered carve-out in the direction that favours adoption.
            It may not do so on analogy alone. Where principle is at best
            balanced, the conservative rule is chosen.
        - alternative: Literal reading, with J1 relabelled as DISSENT.
          why_rejected: >-
            The composer does not re-rule verdicts (C-1). A DISSENT's
            persistence rule (supersession on the merits) also misfits a
            wording-only defect. B-W carries the same blocking force without
            misstating what the reviewer found.
        - alternative: A failed control, or any disagreeing re-derivation, is automatically a DISSENT on J1 or J2.
          why_rejected: >-
            That gives instruments verdict power the handoff did not give
            them. It also ignores the rule that disagreement has to be
            localised before it counts against either side.
      conservatism_and_higher_bar: >-
        Conservative. K4c blocks where the alternative would admit. No part of
        K4 favours adoption.
      effect_on_committed_report: >-
        Control: D-1 stops at the locus boundary on both objects (as
        reported), so K4a has nothing to compose for D-1. The failure against
        D-5 reaches J2 clause 2 and is already J2's B-D, which is where the
        reviewer placed it. Blind re-derivation: it agrees in substance.
        B-1 = SC-1 is a distinctness correction under C-6, a scope correction
        that composes C with the corrected wording mandatory. B-2 = SC-2 falls
        under K4c: J1 clause 3 is literally met for the affine count on
        S_{m-1} = 0, outside C-6. J1 therefore composes B-W, while the
        verdict as reported stays CONCUR. The no-go's substance is affirmed.
        J1's B-W is cured by CU-6 (scope equal to the CU-1 corrected
        statement) together with CU-7. Both are already in the declared
        successor sequence, so no new step is added. K4d is not triggered,
        because the reviewer classified SC-2 openly. Compared with
        DEC-20260930-8553d4, which recorded J1 as "CONCUR, composed as
        reported" with SC-2 unsettled, J1's composed status changes to B-W.
        No route disposition changes, because route (c) was already blocked
        by J2, J3 and the closure gate, and J1 does not bear on route (a)
        (C-2).

    # ------------------------------------------------------------------ K5
    - id: K5
      settles: binding scope, so that the keys also bind the successor round (DEC-20260930-8553d4 NA-1).
      rule_text:
        - >-
          K5a. K1-K4 bind every composition of REVIEW-MONO-20260930-40470a from
          the verified archive of this amendment onward. They are also the
          default composition keys of every successor route-(c) or route-(a)
          closure review round on GOAL-MONO-001, including CU-7. For those
          rounds the keys are pre-review.
        - >-
          K5b. A successor plan may add keys or make them stricter before its
          reviewer launches. Relaxing any A01 key requires its own versioned
          amendment, committed with reasons BEFORE that reviewer launches.
        - >-
          K5c. A successor plan must do three things. It must name, per route,
          the joints that route needs. It must state per joint the carve-outs
          it intends, including degenerate subloci, if any correction there
          is to count as scope rather than a break. And its composition
          section must either state that no composition question is left
          unstated, or list the open ones, with K2's N-E as their default.
        - >-
