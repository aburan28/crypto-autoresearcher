  # ---------------------------------------------------------------------------
  # THE CLAIM UNDER REVIEW.
  # ---------------------------------------------------------------------------
  claim_under_review:
    statement: >-
      Seven parts, all of which must hold.
      (1) AMD-EXP-AUXIN-7e2e3d-20260928-discharge discharges DF-G1 by normative
      text: exactly one reading of how falsification condition N4 compares a
      returned bound with the fixed value is textual on every C-BOUND state and
      every constructed BOUND state, and the text states whether that changes
      N4's tested meaning.
      (2) It discharges DF-G2: it names the source of the expected status,
      witness set and witness for a reviewer-constructed BOUND state, or states
      that such states are outside the protocol except in reviewer-evaluation
      mode.
      (3) It discharges DF-G3: a counting convention under which two correct
      scans of the threshold index agree, or an explicit non-normative
      declaration naming every clause that reads the index, with no normative
      clause among them.
      (4) It carries O-1: a reader-map entry for narrow span BN-K.
      (5) It supersedes or adds ONLY spans named by DF-G1, DF-G2, DF-G3 and
      O-1. Every other field is incorporated from AMD-20260928-gated by the
      sha256 above (and through it from narrow and typed), and is not retyped,
      paraphrased, transcluded or restated.
      (6) It carries a governing-text table over five layers (frozen v1,
      typed, narrow, gated, new) under which a reader names the single
      governing text for every field without choosing, and a READER MAP: for
      every span it adds or supersedes, every clause in every older layer that
      reads the field, with that clause's outcome under the new text.
      (7) It touches no executed-layer field; nothing that held in
      REVIEW-AUXIN-20260928-104724 regresses (including DF-N1 and DF-N2
      staying discharged); the amendment is one new additive file; and
      DEC-20260927-f680f7 dispatch_preconditions_carried stays a precondition
      of any future executor card.
    claim_note: >-
      This is the claim the producer card requires. The producer's own
      statement in its design report governs where it is narrower; any
      difference is itself an RJ3 item.
    object_under_review:
      paths:
        - experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260928-discharge.yaml
        - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-bc5afb/design/TASK-20260928-d076fa/design-report.yaml
        - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-bc5afb/design/TASK-20260928-d076fa/execution-transcripts.json (only if CD-5's re-execution branch applies)
