        untouched; the new layer adds no cross-layer residue.
      assigned_to: TASK-20260928-01c2ea
      attack_plan: >-
        (i) Read every new span and the design report line by line; quote any
        sentence that states more than its measurement supports, against
        CORR-20260923-187ea3, CORR-20260923-5c5a23 and CORR-20260923-f5f060.
        (ii) Take H-AUXIN-6db354 falsification_conditions one by one and check
