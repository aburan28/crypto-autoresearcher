  # ---------------------------------------------------------------------------
  # JOINTS. Each has exactly ONE owner.
  # ---------------------------------------------------------------------------
  joints:
    - joint: >-
        RJ1 -- N4 COMPARISON AND CONSTRUCTED-STATE SOURCE (DF-G1, DF-G2,
        regression R-DFN1, R-D4). On every C-BOUND state and every constructed
        BOUND state, the governing text makes exactly one reading of N4's
        bound comparison textual, and names the source of expected fields for
        a constructed state or places it outside the protocol. DF-N1 stays
        discharged and every held control rebuilds unchanged.
      assigned_to: TASK-20260928-cf60fa
      attack_plan: >-
        (i) Build every control integer, including the C-BOUND construction
        states, from the governing text with your own code, transcribing
        nothing from any report, and record the build time before any
        comparison.
        (ii) Before reading the new layer's DF-G1 span, list every reading of
        N4's bound comparison you can name from the held text alone (at least:
        exact equality with the fixed value; the C-BOUND gate-2 tolerance;
        through the gate verdicts). Then read the DF-G1 span and say, for each
        reading, whether the text now excludes it. Any reading not excluded
        that gives a different N4 outcome on any state is a K-layer-outcome
        (b) finding.
        (iii) For BND-1, BND-2 and BND-3 report status, witness, witness set,
        bin, bin_at_least and boundary_flag, then gate 1 and N4 under the
        stated comparison, and whether the pair has exactly one outcome.
        (iv) Construct at least one further BOUND state of your own that bins
        NEAR_FLOOR. Under DF-G2, say where the text tells you to get its
        expected status, witness set and witness; if the text places it
        outside the protocol, say whether reviewer-evaluation mode is defined
        well enough to evaluate it. Report the same fields and outcomes.
        (v) Gating test (R-DFN1): on every state in (iii) and (iv), gate 1
        must fail with bin_at_least absent and with a wrong bin.
        (vi) Regression R-D4: every carried recipe and the BOUND evaluator
        control builds with outputs unchanged; after (i) to (v) are recorded,
        compare with the BATCH-104724 validator values (PD-R2).
        WHERE I THINK IT BREAKS: (iv), on a constructed state the DF-G2 text
        does not reach.
      breaking_artifact: >-
        A reading of N4's comparison that the text does not exclude and that
        changes N4's outcome on any state; no stated tested-meaning change when
        there is one; a constructed BOUND state with neither a named source nor
        an out-of-protocol statement that covers it; a gate that passes with
        bin_at_least absent or wrong; a carried recipe whose output changed
        without the draft saying so.
    - joint: >-
        RJ2 -- THRESHOLD INDEX, EXECUTED LAYER AND CUSTODY (DF-G3, RJ2-OBS-2,
        GT-5, R-DFN2, R-NJ1, R-NJ2, R-D7D10, DP-1). The threshold index is
        counted under a stated convention, or is non-normative with every
        reader named and none normative. No executed-layer field changed, or
        every changed one was re-executed with transcripts. Frozen files are
        byte-identical; the draft is one new file; the precondition is carried.
      assigned_to: TASK-20260928-cf60fa
      attack_plan: >-
        (i) If DF-G3 is discharged by a convention: scan all five layers
        yourself under that convention and record your index BEFORE reading
        the draft's; then compare. Any membership difference that the
        convention does not resolve is a finding. If by a non-normative
        declaration: search every layer for every clause that reads the index
        (by name, by path and by 'this field' self-reference) and report any
        normative reader.
        (ii) RJ2-OBS-2: say whether the self-reference is resolved or harmless
        under the chosen route.
        (iii) List every span the draft adds or supersedes and confirm none is
        a pin, locator, FP, tool-admission or timeout field; if any is,
        re-execute as the predecessor RJ2 (iii) did.
        (iv) R-DFN2: confirm no completeness claim is reintroduced, or that
        any claim holds over five layers.
        (v) R-NJ1, R-NJ2 and R-D7D10 exactly as the predecessor RJ2 (iv) and
        (v) state, with AMD-20260928-gated added to the byte-identity set.
        (vi) DP-1 carried unweakened.
        WHERE I THINK IT BREAKS: (i), on a normative reader of the index.
      breaking_artifact: >-
        Two correct scans that disagree under the stated convention; a
        non-normative index read by a normative clause; a changed executed
        field without a reproducing transcript; M-FP passing every declared
        control; any byte change to a frozen file; a certificate route that
        fails; the precondition dropped or weakened.
    - joint: >-
        RJ3 -- FIVE-LAYER GOVERNING TEXT AND READER MAP (GT-1, GT-2, GT-4, O-1,
        O-2, R-ER). The draft adds or supersedes only the named spans;
        everything else is incorporated by hash. The table names one governing
        text per field AND no older clause's tested outcome changes under a new
        span unless the span supersedes it. The reader map is complete and
        carries O-1.
      assigned_to: TASK-20260928-01c2ea
      attack_plan: >-
        (i) Hash the three incorporated amendments and compare with the digests
        the draft states and with this plan's.
        (ii) Enumerate every field the protocol reads at run time and name its
        governing text from the table alone; report every field for which you
        had to read more than one layer.
        (iii) For each span the draft adds or supersedes, find every clause in
        every older layer that reads the field (gate 1, every N condition,
        every stopping rule, every expected block, every reporting rule) and
        classify its OUTCOME as unchanged, changed-and-superseded, or
        changed-without-supersession. In particular, every clause that reads
