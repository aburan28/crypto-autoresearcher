  # of REVIEW-AUXIN-20260928-104724 is kept. K-layer-outcome takes the
  # stricter reading prospectively. CD-7 is attached to the revise keys.
  # ---------------------------------------------------------------------------
  composition:
    who: >-
      The Coordinator, in TASK-20260928-532b44, in a session that did not run
      TASK-20260928-dafcbf, TASK-20260928-fb01c9, TASK-20260928-e2f10e or
      TASK-20260928-d076fa, and did not produce, review or compose any earlier
      amendment of this lineage. No reviewer votes on the whole draft.
    independence_check: >-
      Run python3 tools/check_review_independence.py --plan
      coordination/review/auxin-20260928-bc5afb/review-plan.yaml --reports
      coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-bc5afb/reviews/ and
      record the result in the composing decision whatever it is. Confirm the
      pre-dispatch blind-phase record exists in TASK-20260928-f0793e's receipt.
    keys:
      K-approve: >-
        All of: every joint holds; RJ1/RJ2 and RJ5 agree on every QB1 to QB4
        value within tolerance; no open material choice; K-layer-outcome does
        not fire under the stricter reading; every PTM meets its failure
        signature; every coverage item has a discharging or declaring span its
        owning joint reports as holding; no regression; no tripwire; the
        independence check passes. The composing decision then approves
        AMD-EXP-AUXIN-7e2e3d-20260928-discharge, together with the fields of
        AMD-20260928-gated, AMD-20260927-narrow and AMD-20260926-typed it
        incorporates by hash, under the AGENTS.md standing user authorization,
        and may move H-AUXIN-6db354 from proposed to approved as its
        status_note provides. Its first next action opens an execution batch
        whose first card provisions and admits the declared tools per
        dispatch_preconditions_carried. Approval asserts nothing about any
        curve.
      K-revise-defect: >-
        Any joint breaks on any coverage item, or the draft omits a field
        approval requires. Decision revise; each defect listed with its joint
        and breaking artifact. CD-7 applies: the additive lineage ends and the
        next selection point takes option 2 (RS-B) without re-ranking
        S-discharge.
      K-regression: >-
        Anything in R-DFN1, R-D4, R-DFN2, R-NJ1, R-NJ2, R-D7D10, R-ER, R-NJ3 or
        R-D2D3 breaks. Decision revise, named separately from new defects. A
        K-regression reopens the whole ranking.
      K-indeterminate: >-
        RJ1/RJ2 and RJ5 disagree on any value beyond tolerance, or either
        reports a choice the text leaves open that affects a reported quantity
        or a run-time decision. Decision revise. A choice the text explicitly
        declares immaterial with a reason does not fire this key unless an
        implementation found that it changes a value. CD-7 applies.
      K-layer: >-
        Literal reading, carried: RJ3 breaks on GT-2 in the sense "a field with
        no single governing text", or on GT-1 (incorporation by hash ruled not
        approvable). Decision revise; the switch condition to option 2 has
        fired.
      K-layer-outcome: >-
        STRICTER READING, adopted prospectively by DEC-20260928-4fcf71 from
        DEC-20260928-c4f3dc disclosed_alternative_reading. Fires when ANY of:
        (a) RJ3 finds an older-layer clause whose tested outcome changes under
        a new span without being superseded (the DF-N1 class, anywhere); (b)
        ANY reviewer (RJ1, RJ3 or RJ5) names a reading of the governing text,
        stated or implied, under which gate 1 and N4, or any other run-time
        decision a span of the new layer touches, have two outcomes on any
        C-BOUND or constructed BOUND state, and the governing text does not
        explicitly exclude that reading. A reading the text explicitly
        excludes does not count; a reading resolved only by implication does;
        (c) DF-G1, DF-G2 or DF-G3 is not discharged, or DF-N1 or DF-N2 is no
        longer discharged. Decision revise, and the decision records that the
        additive lineage has ended: the next selection point takes option 2
        (RS-B) without re-ranking S-discharge. Option 1 stays subject only to
        its own switch conditions. Not applied to any finding of
        REVIEW-AUXIN-20260928-104724.
      K-executed-layer: >-
        RJ2 finds an executed-layer defect (pin, locator, FP, tool interface or
        timeout), whether or not the draft touched the field, while RJ1, RJ3
        and RJ4 hold. Decision revise; the switch condition to option 1 has
        fired and the next selection point re-ranks option 1 against option 2.
      K-provision: >-
        Engages only if RJ2 (iii) must re-execute a touched executed field and a
        declared tool is absent from the base environment. The reviewer installs
        the declared version under scratch and runs the gate as written. If the
        gate then determines admission, RJ2 reads on the text and the absence
        stays a dispatch precondition. If provisioning fails even under
        scratch, K-infra applies to RJ2 and the switch condition to option 1
        has fired.
      K-hypothesis: >-
        The design report, RJ3 or RJ4 finds that H-AUXIN-6db354 cannot carry
        the protocol without change. Composition files a correction or a
        successor hypothesis whose id is minted by the top-level session and
        added to TASK-20260928-532b44 and TASK-20260928-2c9162 by a recorded
        queue revision BEFORE the record is written.
      K-route-switch: >-
        RI-1 as governed after the draft shows enough falsification conditions
        retired or demoted that the amendment no longer tests the same
        hypothesis. Decision revise; the switch condition to option 2 has fired.
      K-infra: >-
        A reviewer could not run a joint (tool not installable, environment
        failure, budget exhausted). That joint reads inconclusive; no approval
        while RJ1, RJ2 or RJ5 is inconclusive. Never negative evidence about the
        draft's mathematics or any curve, and it does not trigger CD-7.
      K-producer-stop: >-
        ADDED. The producer stops under CD-6 without a draft. No review round
        runs; the composing decision records the stop, and the next selection
        point takes option 2 (RS-B) without re-ranking S-discharge.
      any_tripwire: See tier.tripwires. Composition stops and routes to review-breakthrough.
    h_correction_note: >-
      The H-AUXIN-6db354 interpretation_limits correction (DEC-20260926-96f970
      next_actions item 2) is NOT folded into this batch by this plan. It may
      be folded in only by a declared queue revision with a session-minted id
      before any writing; this plan does not edit H-AUXIN-6db354.

