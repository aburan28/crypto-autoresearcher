        (iii) Confirm D2 and D3 fields are governed by hash-bound text and
        untouched; re-evaluate the D3 rules on one constructed unfactored row
        and one constructed r + 1 witness row.
        (iv) O-4: say whether the new layer adds a residue of the kind O-4
        lists.
        WHERE I THINK IT BREAKS: (ii), on the N4 row.
      breaking_artifact: >-
        An over-scoped sentence; a falsification condition missing from RI-1 or
        whose changed meaning is not stated; a D2/D3 field changed; a new
