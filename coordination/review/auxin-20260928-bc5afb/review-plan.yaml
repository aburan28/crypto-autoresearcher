        superseded (R-ER).
        (vi) Say whether incorporating three refused amendments by hash leaves
        anything approvable-by-reference that any refusal ruled broken.
        WHERE I THINK IT BREAKS: (iii), on the stopping rule or reporting rule
        that reads N4.
      breaking_artifact: >-
        A field with no governing text, or with two; an older clause whose
        tested outcome changes under a new span without being superseded; a
        reader map that omits such a clause or omits BN-K; a retyped held span;
