      objection: >-
        The plan's suspected break -- the stored set V depending on L through
        x-key deduplication at build -- does not occur. tails.py keeps every
        tail sharing an x (x-groups are sorted, never deduplicated), has no cap
        and no early return in either build; the only L-dependence is the drop
        of a candidate whose sum is the identity (never at h = 2 for the
        engine's distinct-x base; 3-term and (2,1)-type zero sums at h = 3),
        which changes no count off L1's null event. Residual objections are
        wording and model-transfer, not proof: (L1-W1) for TB the setting's
        "V = tails together with e_b" must be read on the bipartite (base, tail)
        pair set that the harvester and I-1 use, not on all pairs of V;
        (L1-W2) the stated moments are exact for the representations
        sum M_r I_r and sum I_r, which equal the engine counts only off the null
        event; (A-Q2) the table also stores repeated-index tails (2e_a at h = 2;
        2e_a +- e_c, e_a +- 2e_b, 3e_a and +-e_c at h = 3) that L2's assumption
        does not mention -- harmless for generic relations, but they create the
        non-generic classes that make the realised TT5 pair dispersion ~30, not
        10; (A-Q3) L1 is exact under U, while FactorBase.random draws distinct x
        (L_i != 0, L_i != +-L_j), under which 2-term classes are impossible and
        a pair sharing an index loses one of its two coincidence classes -- a
        first-moment pair bias of about -2/s, i.e. -0.2% to -0.3% at TT3 30-32
        bits, consistent with the archived H1a TT3 ratio 0.9976. That gap is
        HEUR-2765d2-H4's subject, not L1's.
