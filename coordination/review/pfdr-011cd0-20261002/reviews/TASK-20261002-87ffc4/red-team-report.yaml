        - "Producer statements against TW-SCOPE: execution-report-236691.yaml, analysis.json and heuristics.json carry no interpretation, closure, deployed-curve, all-N or exponent wording (word scan, read log). TA-1 label: present in design.json (14 occurrences) and power.json (13); absent in calibration.json and analysis.json (known O-C3); every SS m 4 value in this report carries it."
      per_cell_statements: >-
        attacks/j6/out/cell-statements.json gives, for every FAM-1 cell, the
        narrowest true sentence: arm, class, m, 30-32 bits, curves, this engine
        and these curves; kappa_rel with the reported 95% interval and upper
        bound; z against t* with its per-cell calibrated p ("not an excursion of
        the family-wise rule"); X_rel against target; plus the two exceptions
        above and the TA-1 label on the SS m 4 cells.
      replication_requirements_for_a_later_reject_scoped: >-
        (1) Fresh curves disjoint from c = 10..2009 (and from the R17 range
        c >= 20000 if that is reserved), same generator and p_filter, same bits,
        m, arms, |F| matching, CC-1..CC-10 and statistic, pre-registered before
        any count is read. (2) A separate session (executor) and an independent
        review round, with the count implementation re-checked from rows
        (G-REL style) and a blind re-derivation. (3) t* recalibrated on the
        replication's own randoms before unmasking (two-step blinding), plus a
        real-data permutation null beside G-NB-R. (4) Achieved X_rel at or below
        target in every cell to be covered AND a one-sided 95% bound at or below
        target in each such cell; for small_x TT4 specifically, sized for a
        single-cell confirmatory test (~6800 curves for power 0.9 at kappa 1.10,
        one-sided 0.01). (5) A second engine is NOT needed for a reject_scoped
        stated for this mitm engine at default arity and min_fill; it IS needed
        for any statement beyond this engine. (6) A planted arm at the target
        size (kappa ~1.15 TT/SS, ~1.5 TB3) so PC-R measures sensitivity, not only
        dynamic range. Even then a reject_scoped covers only the tested arms,
        cells, bits, engine and curves (TW-SCOPE).
      narrowest_supported_statement: >-
        R16's outcome is a per-cell, detection-limited non-detection at 30-32
        bits on these arms, this engine and these curves: no FAM-1 cell exceeds
        the calibrated family-wise threshold; 19 of 21 cells have a one-sided
        upper bound between 1 and their target and an achieved X_rel at or
        below it. small_x TT4 is a non-detection at the family level whose data
        do not exclude a ~10-17% TT relation excess (bound 1.17 > target 1.15)
        and must be scoped out of any bound-based weaken until replicated;
        dickson SS4 is a lower-tail null count. The SS m 4 cells meet target only
        through their achieved X_rel [SS m 4 P0 inputs estimated at 22-24 bits;
        TA-1 assumed, not verified by P0]. Nothing here is a closure, and nothing
        supports reject_scoped before an independent replication.
      artifacts:
        - attacks/j6/j6_table.py
        - attacks/j6/replication_sizing.py
        - attacks/j6/smallx_tt4_localise.py
        - attacks/j6/out/cell-statements.json
        - attacks/j6/out/replication-sizing.json
        - attacks/j6/out/smallx-tt4-localise.json
    # -------------------------------------------------------------------------
    J8:
      verdict: holds
      objection: >-
        Every O-HEUR reading follows from its frozen falsification condition on
        the archived counts, recomputed with own code: no heuristic is refuted at
        the tested scale. Three wording limits keep the readings no stronger than
        their tests: (1) the frozen conditions define only REFUTATION; "met"
        means "not refuted", and three intervals straddle their band rather than
        lying inside it -- H1a TB3 [0.940, 1.115] (upper end above 1.10), H1b SS3
        [0.759, 1.197] and SS5 [0.676, 1.072] (lower ends below 0.8); those are
        "not refuted, not established within the band". (2) H3 is NOT EVALUABLE
        for TT4 and TB3 on every random arm (no (arm, class, m) reaches 20
        instances with R_star >= 10; relation means ~0.25 per instance), so "H3
        met" must be scoped to TT3, TT5, SS3, SS4, SS5. (3) The H1c randomized-PIT
        KS uses rho1 fitted on the same instances, which makes the asymptotic
        Kolmogorov test conservative: under the null its size is 0-0.4% at the
        nominal 1% (1000-replicate diagnostic on the actual instances), i.e. it has
        less power to detect non-Poisson shape than "1%" suggests; the plan's
        suspected break (x-group dependence breaking the PIT KS) does not appear
        (Monte-Carlo p 0.21-0.92).
      computation:
        H1a: >-
          ratio of summed random-arm pairs to the uniform-model pair mean,
          99% curve-cluster t-interval (bootstrap check beside): TT3 0.9976
          [0.9934, 1.0018]; TT4 1.0023 [0.9696, 1.0350]; TT5 0.9833 [0.9597,
          1.0069]; SS3 0.9933 [0.9831, 1.0035]; SS4 1.0119 [0.9993, 1.0245]
          [SS m 4 P0 inputs estimated at 22-24 bits; TA-1 assumed, not verified by
          P0]; SS5 1.0131 [0.9872, 1.0390]; TB3 1.0274 [0.9402, 1.1145]. Not
          refuted anywhere; TB3 straddles 1.10. The TT3 point (-0.24%) matches the
          a-priori -2/s bias of the uniform-model pair mean under the engine's
          distinct-x base (J2 A-Q3; s ~ 740-1170 at 30-32 bits).
        H1b: >-
          D_P_hat / D_P_pred with observed multiplicities, 99% curve-cluster
          bootstrap (20000, n/(n-1) endpoint scaling): TT3 0.988 [0.917, 1.060];
          TT4 1.007 [0.979, 1.037]; TT5 1.026 [0.975, 1.085]; SS3 0.960 [0.759,
          1.197]; SS4 1.032 [0.919, 1.130]; SS5 0.868 [0.676, 1.072]; TB3 1.015
          [0.950, 1.080]. Not refuted. TT5's D_P (~30) is dominated by rare 4-term
          relations of multiplicity up to 642: the top 1% of curves carry 28% of
          sum M^2, so its interval rests on few clusters.
        H1c: >-
          pooled within-curve relation dispersion, 99% bootstrap: TT3 0.988
          [0.919, 1.061]; TT4 1.007 [0.978, 1.036]; TT5 1.055 [0.975, 1.138]; TB3
          1.015 [0.952, 1.079] -- all inside [0.8, 1.25]. Randomized PIT KS with the
          frozen pit-011cd0 seeds against Poisson(rho1_hat x mu_model): TT3 D
          0.0081, asymptotic p 0.971, Monte-Carlo p 0.92; TT4 D 0.0059, 0.365,
          0.245; TT5 D 0.0121, 0.478, 0.215; TB3 D 0.0152, 0.377, 0.27 (n 3600,
          24000, 4800, 3600; 400 Monte-Carlo replicates with rho1 re-estimated).
          Per-family rho1 gives the same verdicts. Not refuted.
        H3: >-
          A3R median informative_rank / min(R_star, U), R_star >= 10, all rungs:
          1.0 for every evaluated random and x-defined (arm, class, m) (TT3, TT5,
          SS3, SS4, SS5); 5-16% of qualifying instances fall below 0.95 (SS3
          13-16%, TT5 5-8%), never the median; known_log 0 (P5). Not evaluable:
          TT4 and TB3 on all six random arms.
        H4: >-
          PC-NULL passes on recomputation (J4 b) and the H1c TT/TB dispersion
          clause holds: not refuted. Its PC-NULL leg has power 0.045 / 0.12 / 0.50
          against a known-null arm 1.5 / 2 / 3 times as dispersed as the randoms
          (J4 c), so H4's "distributed as the calibrated null" is supported at
          the tested scale mainly by the direct dispersion estimates (J4 d) and
          the PTM-1 / permutation-null results, not by PC-NULL alone.
        H5: >-
          SS relation dispersion at X_fix, 99% bootstrap: SS3 0.953 [0.755,
          1.185]; SS4 1.324 [1.186, 1.470] [SS m 4 P0 inputs estimated at 22-24
          bits; TA-1 assumed, not verified by P0]; SS5 0.871 [0.689, 1.077]; all
          far below 4, and the known-null SS pseudo-cells pass PC-NULL: not
          refuted. Its "in particular" clause (the A_fix SS m 4 dispersion was
          exposure-driven) is supported by a within-experiment comparison at the
          same bits: X_fix dispersion 1.29 / 1.47 at 22 / 24 bits against the P0
          A_fix input 16.15 at 22-24 bits (point estimates, 20 triples per rung).
        multiplicities: >-
          share of relations at the generic multiplicity: TT3 99.3% (M 3), TT4
          96.7% (M 3), TB3 99.5% (M 3), TT5 83.1% (M 10; the rest 4-term and
          coefficient-2 relations with M 2-642); SS mean M 1.74 / 5.03 / 5.13 at
          m = 3 / 4 / 5.
        ks_family: >-
          Five goodness-of-fit tests whose 1% rejection would refute a heuristic:
          the four H1c PIT KS (TT3, TT4, TT5, TB3) and PC-NULL (ii) (H4). Under all
          heuristics true: each PIT KS has size 0-0.4% (diagnostic, 1000
          replicates per test on the actual instances), PC-NULL (ii) about
          1-2% (own Monte Carlo); family-wise chance of at least one rejection
          about 0.03 (at most 0.049 by the nominal independence bound
          1 - 0.99^5). The interval-based clauses (H1a 7, H1b 7, H1c 4, H5 3, 99%
          each) test bands, not points, and add little family-wise risk when the
          truth is inside the band.
      refutations: >-
        None. The H1b/H1c-on-TT/TB routing (implicate H4 or the instrument, since
        L1 is proved under U) is not exercised; no refutation artifact is needed.
        Were one needed, the strongest available would be empirical_only (a single
        unreplicated run), taking weaken plus replication, not reject_scoped
        (docs/claims-and-verification.md).
      narrowest_supported_statement: >-
        At 30-32 bits on the random arms of this engine and these curves, none of
        HEUR-2765d2-H1a, H1b, H1c, H3, H4, H5 is refuted by its frozen condition.
        Within-band agreement is established for H1a (all but TB3), H1b (TT3, TT4,
        TT5, TB3, SS4), H1c dispersion (all four), and H5 (all three, far from
        4); H1a TB3 and H1b SS3/SS5 are not refuted but not established within
        their bands; H3 holds where evaluable (TT3, TT5, SS3, SS4, SS5) and is
        untested for TT4 and TB3; the H1c shape tests are conservative.
      artifacts:
        - attacks/j8/00-readings-before-computing.yaml
        - attacks/j8/j8_heur.py
        - attacks/j8/j8_ks_diag.py
        - attacks/j8/out/heur.json
        - attacks/j8/out/ks_diag.json
        - attacks/j8/pitcheck_scratch_copy.py
        - attacks/j8/out/pitcheck.log
    # -------------------------------------------------------------------------
    proves_too_much:
      verdict: holds
      objection: >-
        The procedure does not prove too much on objects where "excess" is known
        false, and it detects planted excess where it is known true, at the
        stated sensitivity; the lemma arguments fail exactly where their
        hypotheses fail. One qualification is a wording point for J6: X_rel is a
        design sensitivity, not a realised bound -- conditional on the observed
        data, 6 of 21 cells (those with low or negative observed z) could not have
        detected an excess of size X_rel with probability >= 0.5, so bounds must be
        read from each cell's upper bound, never from X_rel.
      PTM1: >-
        Random arms read as structured (each r_k against the other two randoms
        and the known-null arm, CC-8 unchanged), 42 band pseudo-cells: 0 above t*
        (producer's or own), 0 below -t*; expected 0.10 under the generator
        (P(at least one) ~ 0.10); z mean 0.03, sd 1.04, max 1.86, min -2.58; KS
        against the generator's law D 0.126, approximate p 0.49. Excursion rate
        consistent with the calibrated rate: failure signature absent.
      PTM2: >-
        (a) Synthetic null counts from own G-NB-R through CC-8 and t*: family-wise
        excursion rate 0.0505 at the producer's t* (100000 replicates); A-INT
        upper-bound coverage at kappa = 1 is 0.961-0.980 (J4 e). (b) Real-data
        null without the NB assumption (the four null arms per curve exchanged,
        4000 replicates): 0.95 quantile of the 14-cell maximum 2.639 against the
        generator's 2.709; family-wise rate at the producer's t* 0.0275 against
        0.0338; per-cell sd of z 0.89-1.02. The real-data null is no heavier than
        the generator, so t* is not too low: failure signature absent.
      PTM3:
        detectable_X_per_FAM1_cell_real_noise: >-
          Real-data permutation null plus a Poisson-planted excess (4000
          replicates): X_C equals the producer's X_rel in all 14 family-(class, m)
          cells (TT3 1.02, TT4 1.11, TT5 1.05, SS3 1.03, SS4 1.03 [SS m 4 P0 inputs
          estimated at 22-24 bits; TA-1 assumed, not verified by P0], SS5 1.05,
          TB3 1.27), with detection 0.50-0.95 at X_rel; at kappa 1.15 detection
          is 0.89-1.00 in every TT and SS cell, and TB3 (target 1.5) reaches 0.98
          at 1.5. X_rel does not overstate the sensitivity.
        conditional_on_observed_data: >-
          The plan's literal object (observed structured-arm counts plus a planted
          excess, randoms unchanged): X_cond (Poisson; compound and clustered
          identical within 0.01) -- subgroup / small_x / dickson: TT3 1.02 / 1.02 /
          1.02; TT4 1.11 / 1.01 / 1.09; TT5 1.05 / 1.04 / 1.03; SS3 1.02 / 1.02 /
          1.02; SS4 1.03 / 1.03 / 1.05; SS5 1.08 / 1.06 / 1.06; TB3 1.29 / 1.22 /
          1.35. Detection < 0.5 at the producer's X_rel in 6 cells (dickson SS4,
          subgroup SS5, small_x SS5, dickson SS5, subgroup TB3, dickson TB3), all
          with observed z <= -0.16: expected under conditioning on a below-null
          realisation and accounted for by those cells' upper bounds, which are
          all below their X_cond. Detection at kappa_true >= 1.50 is >= 0.998 in
          every cell, and at 1.15 is >= 0.999 in every TT and SS cell.
      PTM_L: >-
        attacks/ptm/ptm-l-notes.yaml: L1 at composite N fails visibly at proof
        step (1) (N = 16: 16 classes with P(v.L = 0) = 2/N; E[R] 7.75 vs 6.75)
        and step (2) (N = 15: 144 dependent non-associate class pairs; D_R 1.37
        vs 0.93); with the stored set chosen after seeing L it fails at the
        fixed-V setting and step (4) (dedup by x-key: E[n_P] = 0 vs 7.74; early
        return at N 1009, s 8: E[n_P] 0.76 vs 4.00, Var 0.18 vs 20.6 -- the SS
        situation, which is why L3 is not a proof); L2's formula on a relation
        with a repeated index or a coefficient 2 gives 3 or 10 where the truth is
        2, 1, 36 or 7. No argument survives on a known-false object.
      narrowest_supported_statement: >-
        On known-null and random-as-structured objects the frozen procedure
        excurses at (or below) the calibrated family-wise rate, on real-data
        and generator nulls alike; planted excess is detected with probability
        >= 0.5 at each cell's X_rel under real noise; the lemma proofs fail at the
        hypotheses they use. The argument does not prove too much; X_rel must
        not be read as a realised bound.
      artifacts:
        - attacks/ptm/ptm.py
        - attacks/ptm/out/ptm.json
        - attacks/ptm/ptm-l-notes.yaml
        - attacks/j2/out/toy_enum.json
        - attacks/j2/out/toy_enum2_rest.json
        - attacks/j2/out/l2_splits.json
