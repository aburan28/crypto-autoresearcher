      (small_x TT4, bound 1.17 > 1.15) and inapplicable as a bound for the
      deficit-side cell dickson SS4.
    per_cell_detectable_excess: >-
      X_rel (P(z > t*) >= 0.5): TT3 1.02, TT4 1.11, TT5 1.05, SS3 1.03, SS4 1.03
      [SS m 4 P0 inputs estimated at 22-24 bits; TA-1 assumed, not verified by
