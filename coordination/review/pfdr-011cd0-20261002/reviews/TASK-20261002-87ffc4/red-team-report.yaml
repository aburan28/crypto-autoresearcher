    strength_of_O_NULL_BOUNDED: >-
      Correctly computed. Its per-cell intervals are slightly STRONGER in
      coverage than labelled (~97.5% rather than 95%, by I-11's literal |.|
      reading), so the reported bounds are conservative; the frozen X_rel is
      reproduced and validated under real noise. The outcome table's "cells
