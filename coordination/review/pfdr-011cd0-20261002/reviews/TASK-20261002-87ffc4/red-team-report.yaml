    heuristic_readings: none refuted; three readings straddle their bands; H3 untested for TT4 and TB3.
  joint_verdicts_summary:
    J2: holds
    J4: holds
    J6: breaks (one cell; wording/criterion of the frozen O-NULL-BOUNDED reading, not computation)
    J8: holds
    proves_too_much: holds
  objections:
    - id: OBJ-RT-1
      joint: J6
      text: >-
        small_x TT4 must be scoped out of any bound-based weaken: X_rel 1.11
        meets the target, but kappa_rel 1.097 with upper bound 1.171 (signed
        one-sided 1.159) does not exclude kappa = 1.15, and the reported two-sided
        95% interval [1.011, 1.182] excludes 1 (per cell, unadjusted; family-wise
        p 0.082). The frozen "X_rel <= target" criterion is a sensitivity
        statement, not a bound.
    - id: OBJ-RT-2
      joint: J4
      text: >-
        PC-NULL does not measure the failure it was meant to guard against at the
        dispersion level (power 0.045 / 0.12 / 0.50 at 1.5 / 2 / 3 x arm
        dispersion); PC-R (i) and PC-1 demonstrate dynamic range (planted kappa
        1.50 and 4.79; known_log ratio 18997) rather than sensitivity at the
        target. Their passes are real but narrower than "calibration and dynamic
        range demonstrated" suggests; the gaps were closed in this review by
        direct dispersion estimates, a real-data permutation null and PTM-3.
    - id: OBJ-RT-3
      joint: J4/J6
      text: >-
        "95%" intervals are ~97.5% under I-11's literal reading; label them by
        their simulated coverage (0.97-0.98) in any record, or recompute signed
        quantiles. Conservative, not invalid.
    - id: OBJ-RT-4
      joint: J8
      text: >-
        "Met" must read "not refuted": H1a TB3 and H1b SS3/SS5 straddle their
        bands; H3 is untested for TT4 and TB3; the H1c PIT KS is conservative
        (size 0-0.4% at nominal 1%).
    - id: OBJ-RT-5
      joint: J2
      text: >-
        L1's TB setting must name the bipartite pair set; its moments are exact
        for the representations; L2's assumption sentence should say the table
        also stores repeated-index sums; the U-to-engine transfer (distinct-x
        base) is H4's, with a derived -2/s pair-moment bias.
    - id: OBJ-RT-6
      joint: J4 (f)
      text: >-
        TA-1 failed by a factor ~12 in the SS m 4 dispersion (A_fix 16.15 vs
        X_fix ~1.3), conservatively; the design's raise to 144 curves per rung
        was spent on a transfer error. Any future P0 must estimate SS inputs at
        the decision scope (X_fix), not A_fix. [SS m 4 P0 inputs estimated at
        22-24 bits; TA-1 assumed, not verified by P0]
  required_controls:
    - id: RC-1
      text: >-
        Before any bound-based weaken covers small_x TT4: a pre-registered,
        single-cell confirmatory replication on fresh curves (both 30 and 32
        bits; ~6800 curves pooled for power 0.9 at kappa 1.10, one-sided 0.01, by
        the Gaussian planning approximation in attacks/j6/out/replication-sizing.json),
        randoms recalibrated before unmasking, with its null-object controls on
        the same curves (known-null arm; a random arm scored as structured) and
        one mutation of the base (small_x shifted to the s smallest x above an
        offset, or small_x on the quadratic twist) to test whether any excess is
        tied to small x.
    - id: RC-2
      text: >-
        In any replication, a planted arm at the target size (kappa ~1.15 TT/SS,
        ~1.5 TB3) so PC-R measures sensitivity at the target.
    - id: RC-3
      text: >-
        Beside G-NB-R, the real-data permutation null of the four null arms per
        curve (cheap; attacks/ptm/ptm.py PTM-2b) as a check on t*.
  counterexample_or_mutation: >-
    No counterexample to L1 or L2 (exact toys agree with the formulas; PTM-L
    objects fail where the hypotheses fail). No mutation breaks the calibration
    (permutation null lighter than the generator). The cheapest discriminating
    control for the one open signal is RC-1 (small_x TT4 single-cell replication
    with a base mutation): it separates a chance 32-bit fluctuation (expected:
    regression to kappa ~1, as the 30-bit rung already shows at 1.017) from a
    small_x-specific excess (expected: persistence at both rungs and loss under
    the offset mutation).
  baseline_comparison: >-
    No attack is claimed and none follows. Pollard rho (about 0.886 sqrt(N)
    group operations, O(1) memory; internal: H-PFDR-2765d2 prior_best) and BSGS
    (about sqrt(N) time and memory; recalled) are unaffected. The closest
    specialized baseline is this same mitm engine on matched random bases
    (kappa_rel = 1 by definition); the measured relation-level bounds (upper
    bounds 0.998-1.25 in the other 20 cells, 1.17 for small_x TT4) are constant factors on
    the relation supply at 30-32 bits and cannot move the engine's exponent
    N^{max(h, m-h+1)/m} (0.75 measured at m = 4, internal: H-PFDR-2765d2) toward
    rho's 1/2; only kappa_rel ~ N^delta could, and a two-rung band cannot
    measure delta. The specification's dominated_by (rho, time and memory) is
    non-null and correct for every generic outcome; no data/query axis applies.
    The structural branch's comparison with any other frontier row is outside
    this report (TW-FLOOR-INDEPENDENCE).
  heuristic_challenges:
    - id: HC-1 (inventory)
      text: >-
        H1a-H5 are explicit and numbered with falsification conditions. H2's
        random-model justification (Hom(E, G_m) = 0 character-sum cancellation)
        is recalled and outside the proven incomplete-sum range, as the record
        itself discloses; H2 is the structural null under test, not a premise.
    - id: HC-2 (random-model transfer)
      text: >-
        L1's U model treats base logs as iid uniform; the engine's base is a
        uniform s-subset of distinct +-x classes. Derived consequence: pairs that
        share an index lose one of their two coincidence classes, biasing the
        uniform-model pair mean by about -2/s (exact toy: -19% at s 10, -9% at s
        20; predicted -0.2% to -0.3% at TT3 30-32 bits, observed H1a TT3 0.9976).
        Cheapest experiment exposing the deviation: H1a per rung at small s (m = 4
        at 20-24 bits, s ~ 23-60), where the predicted bias is several percent.
    - id: HC-3 (scale honesty)
      text: >-
        Tested scale: 30-32 bits for FAM-1 (two rungs), 20-32 per rung; no
        transfer is claimed. TA-1 (22-24 bit, A_fix SS m 4 inputs) failed
        conservatively; the decision rests on the achieved X_rel at the realised
        n, as the amendment required.
    - id: HC-4 (shape tests)
      text: >-
        H1c's PIT KS with fitted rho1 is conservative (null size 0-0.4% at nominal
        1%); H1b's TT5 reading rests on a heavy-tailed multiplicity (top 1% of
        curves carry 28% of sum M^2).
  cost_model_challenges:
    - id: CM-1
      text: >-
        Per-attempt versus total cost: not applicable (no solve or cost claim).
        A constant kappa_rel even at the largest upper bound (1.25, TB3 small_x)
        changes the relation supply by a constant, never an exponent; the
        motivating conditional (kappa ~ N^delta moves the exponent by delta/2) is
        untested by a two-rung band, and the secondary A2R slopes are fits, not
        bounds (smallest one-sided p 0.0035, small_x TT4, not Holm-significant
        against 0.0024).
  reduction_and_scope_challenges:
    - id: RS-1
      text: >-
        Producer outputs comply with TW-SCOPE (no closure, deployed-curve, all-N or
        exponent wording; word scan). The TA-1 label is missing from
