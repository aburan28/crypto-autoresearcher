  tripwire_check:
    frozen_text_yields_O_CANDIDATE: false
    basis: >-
      Own CC-8 equals the archived cells exactly (297/297); the largest FAM-1 z is
      2.673 (small_x TT4) < t* = 2.849 (producer) and < 2.851 / 2.853 (own
      readings); CARRY-1 z = 0.356 < t_carry 2.307 (own 2.297 / 2.315). No
