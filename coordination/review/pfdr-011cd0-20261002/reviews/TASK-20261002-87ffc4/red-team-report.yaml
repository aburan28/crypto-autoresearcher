  closure_check: >-
    O-NULL-BOUNDED is not a closure and must not be summarised as "the
    structural lane is dead". What is measured: per-cell relation-level
    non-detection at 30-32 bits for three named x-defined families, one engine,
    m = 3, 4, 5, TT/SS (TB at m = 3 only). What remains open, by name: (1)
    small_x TT4 (bound above target; RC-1); (2) growth with N -- the target
    alternative is kappa ~ N^delta, which two rungs cannot measure, so larger N
    is untested; (3) other x-defined families and other arities; (4) TB at m =
    4, 5 (screened only) and the unharvested TS and search-vs-base coincidences;
    (5) informative-but-solve-useless excess (PA-1). A count of non-detecting
    cells is a statement about these cells, not about the problem.
  prior_comparison: >-
    Against the Coordinator's prior (written after reading R16's outcome
    summary, PD-1). Confirmed: L1 within U (0.85), V independent of L -- tails.py
    does not deduplicate x-keys (prior 0.75), L2 (0.9), L3 sketch (0.9); t*
    reproduced within spread (0.85); PC-NULL/PC-R pass on recomputation (0.85);
    X_rel within grid resolution (0.75); no FAM-1 heuristic refuted; PTM-1/2 at
    the calibrated rate (0.85); planted detection >= 0.5 at X_rel (0.75) --
    unconditionally under real noise, while conditionally 6 of 21 cells fall
    below. Overturned: the expected break at structured-arm over-dispersion (0.2)
    -- no arm is significantly over-dispersed, and X_rel at P = 0.5 is
    structurally insensitive to it; the expected SS m 4 target miss (0.4) -- SS
    m 4 meets its target with X_rel 1.03 because TA-1 erred conservatively
    [SS m 4 P0 inputs estimated at 22-24 bits; TA-1 assumed, not verified by P0];
    "at least one cell misses its target (0.5)" -- none misses by X_rel, but one
    (small_x TT4) is not bounded below its target, a break the prior did not
    name in this form; "per-rung |z| > t* cells consistent with per-rung
    multiplicity (0.85)" -- borderline (P(>= 3 of 147) = 0.035 under the
    calibrated generator). Not anticipated by the plan: the "95%" intervals are
    ~97.5%; PC-NULL's blindness to dispersion; the -2/s U-to-engine bias. This
    review's concurrence with the prior elsewhere is weaker evidence than it
    looks only to the extent that it read the same producer outputs; every
    concurring number above was recomputed with own code and seeds.
  narrowest_supported_statement: >-
    For EXP-PFDR-011cd0 (R12-R16, protocol v6, package 5753edf2e), on the
    joints owned here: Lemmas L1 and L2 are correct and apply to the engine's
    stored sets (wording fixes noted; L3 a sketch not relied on); the frozen
    calibration, controls and achieved detection limits are what the frozen
    procedure gives, reproduced independently and validated against a
    real-data null, with intervals that are conservative (~97.5%); the O-HEUR
    readings follow their frozen conditions with no refutation (three not
    established within their bands; H3 untested for TT4 and TB3); and the
    argument does not prove too much. The outcome is a per-cell,
    detection-limited relation-level non-detection at 30-32 bits on these arms,
    this mitm engine and these curves, with 19 of 21 FAM-1 cells bounded between
    1 and their target, small_x TT4 not bounded below its target (1.17 > 1.15),
    dickson SS4 a lower-tail null count, the SS m 4 cells meeting target only
    through achieved X_rel [SS m 4 P0 inputs estimated at 22-24 bits; TA-1
    assumed, not verified by P0], and no closure.
  next_concrete_action: >-
