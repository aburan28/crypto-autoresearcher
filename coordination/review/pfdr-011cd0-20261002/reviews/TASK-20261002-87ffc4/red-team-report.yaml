  proof_architecture_challenges:
    - id: PA-1 (observation fiber)
      text: >-
        kappa_rel with informative rank cannot separate an informative but
        solve-useless homogeneous excess (disclosed in the record); not
        exercised, since nothing was detected.
    - id: PA-2 (quantifier order)
      text: >-
        Target: EXISTS a family with kappa_rel >= 1 + c N^delta FOR ALL N. Tested:
        FOR EACH named family and (class, m) AT 30-32 bits. A non-detection is "no
        excess above the per-cell bound at these N", never "for all N"; this
        report keeps that order.
