# TASK-20261002-87ffc4 red team -- J8 readings of the frozen A6R/A3R text, written
# BEFORE any heuristic value is recomputed by this reviewer. Disclosure: this
# reviewer HAS read heuristics.json (it is an input of the card) before writing this;
# the readings below are taken from the frozen text (specification.yaml A6R, A3R;
# H-PFDR-2765d2 heuristic_assumptions) and are not tuned to any value.
readings:
  scope: random arms r0..r2 of BOTH families, 30 and 32 bits (band), per (class, m) in
    {TT3, TT4, TT5, TB3, SS3, SS4, SS5}; source = in-process harvest counts of the
    archived canonical rows (G-REL-gated), streamed by attacks/common/extract_rows.py.
  H1a: >-
    y = sum of pairs_nonformal (SS: at_X_fix pairs_nonformal) over the random arms,
    x = sum of the uniform-model pair mean: TT Ep(Ep-1)/N, TB 2 Ep s/N, SS
    X(X-1)/N with X = formally distinct encodings at X_fix (equals X_fix when not
    censored). Ratio R = sum y / sum x; 99% curve-cluster t-interval with the
    linearised ratio SE (clusters = curves, each carrying six random arms), df = n - 1.
    Refuted for a (class, m) iff the interval lies entirely outside [0.90, 1.10].
    Check: a curve-cluster percentile bootstrap beside it (seed below).
  H1b: >-
    D_P_hat = sum_j sum_fam s^2(pairs) / sum_j sum_fam mean(pairs) over the triples;
    D_P_pred = (1 - 1/Nbar) sum M^2 / sum M over the observed multiplicity
    histograms of the same random instances; ratio with a 99% curve-cluster
    percentile bootstrap (20000 replicates) whose endpoints are scaled about the
    estimate by sqrt(n/(n-1)) (the n/(n-1) correction). Refuted iff entirely outside
    [0.8, 1.25].
  H1c: >-
    D_R pooled within-curve as H1b with relation counts; 99% bootstrap as above;
    refuted if entirely outside [0.8, 1.25]. Randomized PIT of each random-arm
    relation count against Poisson(m_j), m_j = rho1_hat(class, m, rung) x
    mu_model(instance), PIT uniforms from the FROZEN seeds
    random.Random(f"pit-011cd0|{bits}|{c}|{m}|{arm}|{class}"), one-sample KS at 1%.
    Both rho1 readings (pooled over families, I-10; per family) are computed. The
    asymptotic Kolmogorov p is checked by a Monte-Carlo p from the generator (it
    reproduces the estimated-rho1 and within-curve-sharing structure).
  H3: >-
    A3R: per instance and class, informative_rank / min(R_star, U) with R_star >= 10;
    median per (arm, class, m) with >= 20 qualifying instances; all rungs 20..32 (A3R
    names no band); refuted for a random arm iff median < 0.95. A (class, m) with < 20
    qualifying instances is NOT EVALUATED, never "met".
  H4: PC-NULL (J4) plus the H1c TT/TB dispersion clause.
  H5: SS relation dispersion at X_fix pooled within curve, 99% bootstrap; refuted iff
    the lower end > 4 (or the known-null SS pseudo-cells fail PC-NULL).
  KS_family: the tests whose rejection at 1% refutes a heuristic by a goodness-of-fit
    KS -- H1c PIT KS for TT3, TT4, TT5, TB3, and PC-NULL (ii) (H4). Family-wise rate
    under all-true reported from simulation where feasible, else from the
    independence bound 1 - 0.99^k.
  seeds: bootstrap SeedSequence([0x87ffc4, 300]); Monte-Carlo KS calibration
    SeedSequence([0x87ffc4, 310, f]); PIT seeds frozen (above).
