# TASK-20261002-87ffc4 -- PTM-L: the lemma arguments run, unchanged, on objects where their
# conclusion is KNOWN FALSE or unproven. Failure signature (plan): the proof must fail visibly at
# the step that uses the violated hypothesis; a proof that still goes through there proves too much.
objects:
  - id: PTM-L1a
    object: L1 at composite N = 16 (Z/16 not a field), s 4, h 2, every L in (Z/16)^4
    known_false: the L1 moments (E[R] = |RR|/N etc.)
    result: >-
      E[R*] = 7.75 against the formula's 6.75; Var 17.6 against 6.33 (D 2.27 against 0.94).
      16 relation classes (e.g. (2, 14, 0, 0) = 2e_a - 2e_b, (2, 2, 0, 0)) have P(v.L = 0) = 0.125 = 2/N.
    where_the_proof_fails: >-
      Step (1): "some v_i is nonzero and L_i is uniform" gives a uniform v.L only when v_i is a
      unit; 2 is not a unit mod 16. Visible, at the step that uses N prime.
    source: attacks/j2/out/toy_enum.json parts.D_composite_N16
  - id: PTM-L1b
    object: L1 at composite N = 15, s 4, h 2, every L in (Z/15)^4
    known_false: the L1 variance (pairwise independence of distinct classes)
    result: >-
      Step (1) survives (every class vector has a unit coordinate: 0 classes with P != 1/N), but
      144 pairs of classes that are not unit multiples are dependent, e.g. (3,1,0,0) and
      (3,4,0,0): P(both) = 0.0133 against 0.0044; Var[R*] = 8.75 against 5.97 (D 1.37 against 0.93).
    where_the_proof_fails: >-
      Step (2): "not scalar multiples, hence linearly independent; the map onto (Z/N)^2" needs a
      field. Visible, at the step that uses N prime.
    source: attacks/j2/out/toy_enum.json parts.D_composite_N15
  - id: PTM-L1c
    object: L1 with the stored set chosen after seeing L -- (i) deduplicated by x-key (one element per x-group), N 31, s 4, h 2, every L; (ii) an early-return selection (elements taken in stored order, collection stops at the first x-coincidence)
    known_false: E[n_P] = sum M_r / N and the variance formula
    result: >-
      (i) n_P = 0 identically against a formula mean 7.74. (ii) at N 31 the count is 1 on all
      but a 1e-6 fraction of L (16 elements in 15 x-classes force a coincidence), variance ~1e-6
      against 28.5; the N 1009, s 8 Monte-Carlo version is in attacks/j2/out/toy_enum2_rest.json (E2).
    where_the_proof_fails: >-
      At the setting ("V is a FIXED finite set") and step (4): the representation n_P = sum M_r I_r
      uses multiplicities of a fixed V; with V chosen after L, M_r is a function of L and the
      linearity/independence steps no longer apply. Visible, at the hypothesis the selection violates.
      This is exactly the SS situation (L3's early return and X_fix truncation), which is why L3 is
      not a proof and the SS null is empirical.
    source: attacks/j2/out/toy_enum.json parts.E_selected_after_L; attacks/j2/out/toy_enum2_rest.json
  - id: PTM-L2
    object: L2's formula applied to relations outside its hypothesis (repeated index or coefficient +-2)
    known_false: M_r = C(2h, h)/2 (TT) or h + 1 (TB) for these relations
    result: >-
      h 2: 2e_a - e_b - e_c has M = 2 (formula 3); 3e_a + e_b has M = 1. h 3: the 4-term TT relation
      e_a + e_b + e_c - e_d has M = 36 at s 8 (formula 10; ~6s in general, 233-642 in the archived
      TT5 histogram); the 5-term relation with one coefficient 2 has M = 7.
    where_the_proof_fails: >-
      At "its signed pairs correspond to the unordered splits of its support into two h-subsets":
      the support is not of size 2h with +-1 coefficients, and repeated-index or partially
      cancelling tails provide splits that the counting ignores. Visible, at the hypothesis.
    source: attacks/j2/out/l2_splits.json
verdict: >-
  On every PTM-L object the argument fails at the step that uses the violated hypothesis (N
  prime for steps 1-2, V fixed for the setting and step 4, generic support for L2). No lemma
  argument survives on a known-false object: the lemmas do not prove too much.
