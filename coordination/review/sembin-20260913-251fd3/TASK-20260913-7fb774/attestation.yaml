  sources_read:
    - AGENTS.md
    - agents/validator.md
    - inputs/NAGAO-2015-984/paper_fulltext.md
    - ledger/hypotheses/H-SEMBIN-4a80f3.yaml
    - experiments/EXP-SEMBIN-db9bc3/specification.yaml
    - experiments/EXP-SEMBIN-f4a17b/specification.yaml
    - ledger/evidence/EV-SEMBIN-71e5cd.yaml
    - ledger/corrections/CORR-20260913-53739b.yaml
  sources_in_scope_not_opened:
    - path: inputs/SEMAEV-2015-310/paper_fulltext.md
      reason: >-
        Offered conditionally ("if you need eq. (11)"). I did not need it: the
        quantity's yield form is given directly by the task statement
        (Pr = 1 - exp(-lambda)) and by HEUR-2, and CORR-20260913-53739b quotes
        eq. (11)'s derivation P = 1 - (1 - 1/q)^K with K ~ |V|^t/t! in full. Not
        opening it keeps my T4 derivation free of the Semaev-specific m! factor,
        which the Nagao disjoint-coset construction does not carry.
    - path: experiments/EXP-SEMBIN-f4a17b/runs/RUN-SEMBIN-121b59/COST-SEMBIN-8d123b.yaml
      reason: >-
        Declared optional. Deliberately not opened: it is the Semaev cost table the
        charging conventions came from, and the conventions I needed (vOW Pareto
        minimum of T = W(1/M + 1/w) with Mem = 3n max(w, M); no unit conversion) are
        stated in the task card and in EV-SEMBIN-71e5cd O-6/O-7. Reading a
        neighbouring producer's table would have put its numbers in front of a blind
        re-derivation for no derivational need.

  write_scope_note: >-
    My assigned write scope already contained rederivation.md, rederived-values.json
    and scratch/ when this attempt started, with mtimes inside this round. Their
    provenance could not be established without reading them, and reading them could
    have spent the blindness the task exists to buy. I moved them UNREAD to
    preexisting-unread/ and wrote fresh deliverables. I did not open them, did not
    diff them, and cannot say what they contain. Treat preexisting-unread/ as
    unexamined by me.

  method: >-
    Own arithmetic, written from the statement and the sources above; no code
    imported or copied from any experiments/ directory. Exact integer math.comb plus
    log2 of the exact integer for binomial monomial counts (bit-shift for integers
    past 1000 bits), lgamma for the non-integer-m variant, stable log2(1 - exp(-x))
    and log-sum-exp. Monte Carlo over 200000 factor-base draws per (cell, coset
    parametrisation), seed 20260914: exact 2*popcount(getrandbits(2^C0)) for the
    pairs law, PTRS transformed rejection for the Poisson law. Machinery anchored by
    eight self-checks against hand-computable values, all passing.

  verdicts:
    blind_rederivation: holds

  verdict_basis: >-
    `holds` in the sense the task card defines: the quantity is derivable from the
    statement and the cited sources UP TO the ambiguities listed below, and a value
    is filed under every reading I could defend. I hit no point needing anything
    outside the READ SCOPE. Not `breaks`, because the statement does determine the
    quantity once an expectation convention and a HEUR-1 parametrisation are named,
    and it names the readings it wants reported rather than pretending there is one.
    Flagged for composition, not folded into the verdict: at cell B the choice among
    those conventions is worth 20.2 bits in T4 and 20.1 bits in the charged time, so
    a single T4 figure at cell B is not a well-defined deliverable without its
    convention attached.

  ambiguities_found:
    - id: A-0
      kind: procedural
      statement: >-
        The assigned write scope was non-empty on arrival; the pre-existing files
        were moved unread rather than opened, so their contents are unexamined here.
      worth_bits: null
    - id: A-1
      kind: parameter rounding
      statement: >-
        m = n/C_0 is not an integer at either cell (571/8, 571/3) and Nagao writes
        "m ~ n/C_0". Floor, ceil, nearest and exact-real all reported. The rounding
        chooses the integer exponent in lambda = p^{m C_0 - n}, so it is nearly free
        in T1 and T3 and not free in T4.
      worth_bits:
        T1_spread_cell_A: 0.0819
        T1_spread_cell_B: 0.0305
        T3_spread_cell_A: 0.0202
        T3_spread_cell_B: 0.0075
        charged_time_floor_vs_ceil_under_R2_cell_A: 2.8393
        charged_time_floor_vs_ceil_under_R2_cell_B: 1.2201
    - id: A-2
      kind: which expectation (the material one)
      statement: >-
        lambda is a random variable under HEUR-1, and E[lambda] (arithmetic),
        E[log lambda] (geometric) and E[Pr] are three different quantities. The
        statement does not choose. All three reported per cell per rounding.
      worth_bits:
        T4_expectation_choice_only_at_fixed_floor_rounding_cell_A: 0.1898
        T4_expectation_choice_only_at_fixed_floor_rounding_cell_B: 18.8998
        T4_over_all_readings_and_roundings_cell_A: 3.2790
        T4_over_all_readings_and_roundings_cell_B: 20.2188
        charged_time_over_all_readings_and_roundings_cell_A: 3.0290
        charged_time_over_all_readings_and_roundings_cell_B: 20.1200
    - id: A-3
      kind: which binomial parametrisation
      statement: >-
        HEUR-1 fixes the mean p^{C_0}, not the law. Poisson(p^{C_0}) (point into
        coset) and 2*Bin(2^{C_0}, 1/2) (the 2-to-1 x-coordinate model HEUR-1's own
        justification implies) both have that mean but differ by a factor 11.6 in
        P[empty coset] at C_0 = 3, hence P[all m cosets nonempty] = 0.938 vs 0.475 at
        cell B.
      worth_bits:
        conditional_T4_cell_A: 0.0005
        conditional_T4_cell_B: 0.3376
        P_all_cosets_nonempty_cell_B_poisson: 0.9382
        P_all_cosets_nonempty_cell_B_pairs: 0.4754
    - id: A-4
      kind: conditioning on a usable factor base
      statement: >-
        Under any expectation of a logarithm, T4 is +inf unconditionally
        (P[#Fb_i = 0] > 0, so lambda = 0 on a positive-probability set of factor bases
        and no R decomposes at all for those) and finite only conditional on no empty
        coset. Whether the charge should include the expected redraws (1.07 draws
        under Poisson, 2.10 under pairs, at cell B) is not determined. Reported
        separately; added into no charged time.
      worth_bits: {redraw_factor_cell_B: 1.073, unconditional_branch: inf}
    - id: A-5
      kind: metric framing
      statement: >-
        Under time_only the vOW curve has no interior Pareto minimum -- inf T = 0 as
        w -> infinity -- so the declared point M = 1, w -> infinity charges TOTAL WORK
        (log2 W), not a minimised time. Determined by the statement's own declaration;
        recorded because the label "Pareto minimum" does not describe it.
      worth_bits: null
    - id: A-6
      kind: units
      statement: >-
        No F_2-operation/group-operation conversion is applied, as instructed, so
        every margin is convention-dependent in that sense. Separately, the product
        metric multiplies vOW time (group ops) by vOW memory in BITS (3n per point)
        while the Nagao side multiplies F_2 operations by memory in FIELD ELEMENTS; at
        p = 2 those coincide only under bit-packing. The vOW-memory-in-points variant
        (10.742 bits lower) is recorded to expose the asymmetry.
      worth_bits: {vow_memory_unit_variant: 10.742}
    - id: A-7
      kind: variable count
      statement: >-
        The statement's N = n(m-1) is the m*C_0 = n slice of the paper's actual EQS4
        variable count m*C_0 + n(m-2) (Definitions 7-8). Both reported.
      worth_bits: {T1: 0.00043}
    - id: A-8
      kind: monomial count
      statement: >-
        C(N + 4, 4) (with repetition) versus the square-free sum_{d<=4} C(N, d) that
        the field equations force. Both reported; they agree at these N and do not at
        small N.
      worth_bits: {T1: 0.00001}
    - id: A-9
      kind: relation count
      statement: >-
        Algorithm 2's loop collects #Fb + 1 relations, not #Fb. Both reported.
      worth_bits: {T3: 0.00095}
    - id: A-10
      kind: inert term
      statement: >-
        The index-calculus linear algebra term omega*T3 (39.7 / 31.7 bits) is 134-166
        bits below the decompose step, so the statement's log-addition contributes
        < 1e-38 bits and the charged time equals T1+T2+T3+T4 to every decimal
        reported. Consistent with Nagao's own "O(n^w) and very very small".
      worth_bits: {log_add_contribution: 0.0}

  boundaries:
    - >-
      Arithmetic in the log2 domain only. No curve instantiated, no system solved, no
      Groebner basis run. NO DEGREE MEASURED OR ASSERTED: Proposition 5 and the first
      fall degree assumption are granted per H-SEMBIN-4a80f3's own assumptions block,
      and d_F = 4 is an input to this derivation, not a finding of it.
    - >-
      NO STATEMENT ABOUT THE SECURITY OF ANY CURVE, in either direction. A margin
      between two cost models is a statement about two cost models.
    - >-
      NOTHING HERE BEARS ON WHETHER NAGAO'S THEOREM 1 IS TRUE. Theorem 1 is
      O(n^{8w+1}) with C and n_0 unstated, and an evaluation at one n can neither
      confirm nor contradict it.
    - >-
      The Monte Carlo readings carry sampling error. At 200000 draws the reported
      E[Pr] figures are stable to roughly 0.01-0.1 bits; the analytic readings
      (R1-R3) carry no sampling error.
    - >-
      This is one session's arithmetic. It has not itself been independently checked,
      and a blind re-derivation agreeing or disagreeing with a producer localises a
      difference to one of two named implementations -- it does not adjudicate one.

