    under coordination/review/ other than my own task directory, nothing under
    coordination/goals/ or coordination/bus/, and neither
    ledger/goals/GOAL-SEMBIN-5078bc.yaml nor
    ledger/decisions/DEC-20260913-c224bb.yaml. I ran no `git log`, read no commit
