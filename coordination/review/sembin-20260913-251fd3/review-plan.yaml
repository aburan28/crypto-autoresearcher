  proves_too_much:
    required: true
    objects:
      - owner: TASK-20260913-f6652f
        object: >-
          The producer's own charging run at C_0 = ceil(n/3) (m = 3) and C_0 = ceil(n/2)
          (m = 2) at n = 571 under every metric and reading, using code/nagao_cost.py
          as-is. At m = 2 the construction collects #Fb ~ 2 x 2^{n/2} relations, so any
          honest accounting must put Nagao ABOVE vOW under every metric; at m = 3
          (#Fb ~ 3 x 2^{n/3}, N = 2n) the time is dominated by T3 + omega log2 C(2n+4,4)
          and should sit near or above vOW.
        why_this_object: >-
          It is the same charged model at a parameter where the conclusion "Nagao
          ahead" is KNOWN FALSE by a one-line counting argument. If the model reports
          Nagao ahead there, some term that grows with #Fb is under-charged, and the
          same term must then be bounded at the flagged cells before any of them is
          believed.
    failure_signature: >-
      nagao_ahead = true at m = 2 under any metric; or at m = 3 under a memory-charging
      metric by more than the T6 term can explain.
    what_a_failure_means: >-
      The accounting omits or under-charges a #Fb-dependent term; B1 is inconclusive
      until that term is bounded at the 120 cells, and the evidence record says so.
    assigned_to: TASK-20260913-f6652f

