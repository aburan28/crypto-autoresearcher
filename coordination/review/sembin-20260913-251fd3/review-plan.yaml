    on_N4_surface_arithmetic_and_flag_counts:
      expectation: >-
        I EXPECT THE ARITHMETIC TO HOLD to rounding at every recomputed cell, the flag
        counts 242 / 180 / 120 to be reproducible by an independent filter over
        cost-surface.json, the small-C_0 non-monotone crossovers to be real (T4 grows
