    on_B1_the_escalation_flag:
      expectation: >-
        I EXPECT B1 TO HOLD AS ARITHMETIC AND TO SUPPORT NO CLAIM ABOUT ANY CURVE, and I
        expect the max reviewer to find that the FROZEN-WIDTH MEMORY READING IS THE
        WEAK JOINT. Charging memory as C(N+4,4) field elements is charging one row (or an
        implicit representation) of a Macaulay matrix whose dense form is width^2; the
        decisive n = 409 flags exist ONLY under that reading, and at n = 571 the dense
        reading leaves margins of -35.0 (omega = 2.376) and -10.6 (omega = 2.807) bits,
        which is inside the range an unmeasured Lemma-2 constant or one degree of
        solving-degree slack can erase: ARM K measures d_F 4 -> 5 as omega x log2((N+5)/5)
        ~ 36 bits at N = 40541, omega = 2.807. So my prior is: the flags at n = 409 do
        not survive a defensible memory model; the flags at n = 571 survive it under
        omega <= 2.807 but sit within the absorbed constant; the flags at omega = 2.376
        rest on an omega no implementation reaches. The strongest claim I expect the
        review to support is a claim ABOUT THE HYPOTHESIS: "P3 of H-SEMBIN-4a80f3 is
        falsified in the charged model at n = 571 under the dense reading for omega <=
        2.807, conditional on Prop. 5 and the first-fall-degree assumption granted as
        the SOLVING degree; C2 is weakened; nothing follows about B-571 or any curve."
        I also expect the reviewer to say plainly that "first fall degree assumption" as
        granted is the STRONG version (first fall degree = solving degree), which is the
        published point of contention, and that the surface is a costing of Theorem 1
        under that grant rather than a costing of an algorithm anyone has run.
      what_would_change_my_mind: >-
        A defect in the charging that erases the n = 571 flags under the dense reading
        too (then P3 survives and C2 is not weakened); OR the reverse -- a reasoned
        argument that the frozen-width reading IS the honest memory model for this
        linear algebra (e.g. a structured/implicit Macaulay representation with proven
        memory ~ #monomials at the same omega), in which case the n = 409 flags stand and
        the claim tier question is sharper than I expect. Either overturns this prior
        and either is recorded as doing so.
      confidence: moderate
    on_B2_arm_c_inference_and_trigger_b:
      expectation: >-
        I EXPECT B2 TO HOLD: bound B gives C_0 = log2 n - log2 log2 n + O(1), so
        2^{C_0} = Theta(n / log n), #Fb = m 2^{C_0} = Theta(n^2 / log^2 n),
        N = n(m - 1) = Theta(n^2 / log n), and the decompose step is
        Theta~(n^{8w+2}); polynomial, trigger (b) correctly NOT fired, and my own
        contract prior (non-polynomial) correctly recorded as overturned. On the
        SECOND READING (cosets chosen after testing) I expect the reviewer to find that
