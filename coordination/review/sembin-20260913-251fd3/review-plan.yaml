      what_would_change_my_mind: >-
        A bound-B value at any label that moves by 2 or more under a defensible
        alternative tolerance or conditioning; an enumeration cell whose recomputed
        empty-coset count differs from c0-lower-bound.json; a z-score computed against
        the wrong variance (single-draw vs pooled).
