        n = 571, and say whether any could close a surviving margin. (5) THE UNIT. Check
        the conversion direction independently; state the margin at the surviving flags
        with n log n and n^2 conversions applied. (6) THE CLAIM TIER. Write the strongest
        statement this supports in the form of the hypothesis's method_ceiling ("granting
        ..., with T1-T5 as ..., the charged cost at n = ... is ... against vOW at ...,
        margin ...") and the statement about curves (expected: none), and say whether
        P3 is falsified and C2 weakened IN THE CHARGED MODEL. (7) Run the proves-too-much
        object below. Where the Coordinator thinks this breaks: (1).
      breaking_artifact: >-
        A defensible memory model, constant, omitted term or grant under which NO flagged
        cell survives at n = 571 (then P3 stands and C2 is not weakened); or a showing
        that the model proves too much on the control object.
      holding_artifact: >-
        The surviving-flag list under each memory reading, the erasing-constant table,
        the grant statement, the omitted-term bounds, the unit-converted margins, and
        the claim-tier statement -- each with its argument.
    - joint: >-
        B2 -- ARM C'S INFERENCE TO THEOREM 1 AND TRIGGER (b). That bound B's
        C_0 = Theta(log n) leaves Theorem 1 polynomial (exponent 8w+2 up to logs) so
        trigger (b) was correctly NOT fired and the Coordinator's contract prior
        (non-polynomial) is correctly recorded as overturned; and what the "second
        reading" (cosets chosen after testing) does to C1's status.
      assigned_to: TASK-20260913-f6652f
      attack_plan: >-
        (1) From bound B's growth, derive 2^{C_0}, #Fb, N and the decompose cost as
        functions of n yourself and state the exponent and the polylog; check against
        the report's 8w+2. (2) Read Nagao Section 7 and Algorithm 2 in
        inputs/NAGAO-2015-984/paper_fulltext.md and decide whether the text fixes the m
        cosets before testing or permits choosing them; under the searched-coset
        reading, compute what it costs to find m cosets with product >= 2^n among the
        2^{n - C_0} available (is it the same order as building Fb?) and whether bounds
        A and B then constrain C_0 at all. (3) State C1's honest status: holds under the
        fixed reading only; reading-dependent; or independent of reading. (4) State
        whether anything in ARM C contradicts a published result; the Coordinator's
        expectation is NO.
      breaking_artifact: >-
        A derivation giving a non-polynomial cost under bound B (trigger (b) should have
        fired); or a demonstration that bound B's growth is not Theta(log n).
      holding_artifact: >-
        The exponent derivation, the text reading with quotations, the selection-cost
        estimate, and C1's status in one sentence.

