      what_would_change_my_mind: >-
        A derivation that bound B's growth is NOT Theta(log n) (e.g. the deficit
        saturates); an argument that the searched-coset reading costs asymptotically
        more than building the factor base, so the fixed reading is forced; or a reading
        of Section 7 that settles which is meant.
      confidence: low-moderate
    on_the_blind_rederivation:
      expectation: >-
        I EXPECT AGREEMENT to within 0.1 bits at cell A under the ceil-m reading, and I
        EXPECT A LOAD-BEARING AMBIGUITY TO SURFACE IN T4 at cell B: HEUR-2 states
