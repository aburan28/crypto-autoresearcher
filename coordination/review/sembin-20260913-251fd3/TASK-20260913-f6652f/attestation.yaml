  verdict_notes:
    B1: >-
      Holds for the 39 flag entries at n = 571 that survive the coherent (dense width^2)
      memory reading: reproduced from the definitions to 1.2e-13 bits; not erasable by
      unit conversion (which deepens them by 12-18 bits), by any attack-side omitted term
      I can bound (all >= 85 bits below the charged time or memory), or by any coherent
      memory reading of Lemma 2 (dense width^2 is the most pessimistic coherent reading).
      Breaks for the other 81 of the 120 cells -- every n = 409 cell and 42 n = 571 cells
      -- which exist only under the frozen-width pairing (time from a D^omega algorithm,
      memory from none). The plan's breaking_artifact ("a defensible memory model,
      constant, omitted term or grant under which NO flagged cell survives at n = 571")
      was not found within the charged model as stated; what erases every survivor is one
      degree of Assumption-1 (first-fall-degree = solving degree) slack (52-67 bits T x M),
      and an absorbed Lemma-2 constant of <= 2^{23.2} erases every omega >= 2.807 survivor.
      Those are the model's premises, disclosed as such, not an artifact. Supports a
      heuristic-conditional derivation-tier statement about H-SEMBIN-4a80f3's P3 and C2 in
      the charged model (report.md section B1(6)) and no claim about any curve.
    B2: >-
      Under bound B (C_0 = Theta(log n)): 2^{C_0} = Theta(n/log n), #Fb = Theta(n^2/log^2 n),
      N = Theta(n^2/log n), decompose cost Theta(n^{8 omega + 2} / (log n)^{4 omega + 2});
      polynomial; trigger (b) correctly did not fire. Nothing in ARM C contradicts a
      published result. C1 is reading-dependent (report.md section B2(3)).
    proves_too_much: >-
      Producer's own charging (code/nagao_cost.py as-is) at n = 571, C_0 = ceil(n/3) = 191
      (m = 3) and C_0 = ceil(n/2) = 286 (m = 2), every metric x memory reading x monomial
      reading x omega: any_nagao_ahead = false for both objects; minimum margins +172.3
      bits (m = 3) and +396.6 bits (m = 2). With T6 removed entirely, m = 2 stays above vOW
      under every metric (min +78.1) and m = 3 above vOW under every memory-charging metric
      (min +17.4); the failure signature is not met.

  prior_overturned:
    summary: >-
      Partly. The Coordinator's prior on B1 is confirmed on every point it made and
      sharpened in two directions it did not contain; the prior on B2 is confirmed in
      its conclusions and partly overturned on what Nagao's text settles.
    B1:
      confirmed: >-
        Frozen-width memory is the weak joint; no n = 409 flag survives a coherent memory
        model (minimum dense T x M margin at 409 is +18.2 bits); the n = 571 flags survive
        the dense reading and sit within the absorbed constant / one degree of slack;
        omega = 2.376 rests on an exponent no implementation reaches; the grant needed is
        the STRONG first-fall-degree assumption; the surface costs Theorem 1 under that
        grant, not an algorithm anyone has run; nothing follows about any curve.
      overturned_or_sharpened:
        - >-
          The prior's what_would_change_my_mind hoped for "a defect in the charging that
          erases the n = 571 flags under the dense reading too". No memory-model defect
          can: T x M = r^omega D^2 for a coherent r-row Lemma-2 elimination is monotone
          in r, so the producer's dense width^2 (r = D) is the CEILING of the coherent
          readings; every cheaper coherent reading deepens the 571 flags (to -84 bits at
          r = N(N+1)) and would RESTORE the 409 flags (-15.7). Only the O(.) constant and
          the degree grant can erase the 571 survivors.
        - >-
          The prior's "survive under omega <= 2.807" understates: omega = 3.0 also
          survives under the dense reading at C_0 in {10, 12, 16} (margins -4.3, -8.2,
          -13.1 bits; +0.3 at C_0 = 8).
        - >-
          The prior's headline "-10.6 at C_0 = 8" is a grid artifact of where the C_0
          grid stopped: the model's own dense T x M margin at omega = 2.807 keeps falling
          off-grid to -28.3 bits at C_0 = 32 (m = 18) before T6 takes over near C_0 = 96.
          Still inside one degree of slack (~41 bits there).
    B2:
      confirmed: >-
        Polynomial exponent 8 omega + 2 up to polylog under bound B; trigger (b) correctly
        not fired; the contract prior (non-polynomial) correctly recorded as overturned;
        under the searched-coset reading both bounds dissolve and selection costs the same
        order as building Fb (0.4-0.9 bits more); C1 reading-dependent; HEUR-1 formalises
        the fixed-coset reading; no published result contradicted.
      overturned_or_sharpened:
        - >-
          The prior expected "Nagao's text does not settle it -- Algorithm 2's 'Put
          v_1..v_m' is silent". The text is less silent than that: the only condition it
          ever places on the v_i is disjointness (l. 663, l. 855), and the parenthesis at
          l. 753-760 names BOTH failure modes (empty coset, product short of p^n) and
          remedies both by "we choose suitable constant C_0", never by choosing v_i. The
          fixed-coset reading is the text's own; the searched-coset reading is a repair
          the text permits only by forbidding nothing. This partly satisfies the prior's
          own third what_would_change_my_mind item ("a reading of Section 7 that settles
          which is meant").
        - >-
          A third reading the plan did not name: keep cosets fixed but over-provision m by
          the constant factor 1 + delta(C_0)/C_0 (+ Theta(sqrt n) for the CLT fluctuation).
          Then only bound A (C_0 = Theta(log log n)) binds and Nagao's stated exponent
          8 omega + 1 survives up to polylog factors. C1's "not a constant" conclusion
          survives two of the three readings; its exponent conclusion depends on which.
        - >-
          Numerically, the local slope of log2 cost vs log2 n under bound B at
          n <= 2^25 reads as ~8 omega + 1.0-1.5, not 8 omega + 2, because the
          (log n)^{-(4 omega + 2)} cofactor contributes about -1 per doubling in that
          range; both are polynomial.
    proves_too_much: none (expected to pass; passed)

