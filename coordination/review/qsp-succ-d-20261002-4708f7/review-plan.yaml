  # ---------------------------------------------------------------------------
  tier:
    policy: review-adversarial
    reasoning_effort: xhigh
    degradable: false
    subagent_bindings: validator (TASK-20261002-3b6a02, TASK-20261002-c81b2e); red-team (TASK-20261002-323713)
    ruling: >-
      review-adversarial at xhigh. The round reviews a repair design and an
      optional instrument-route and stage-order amendment that may not touch
      the preregistered prediction or the criteria (R-AMEND-SCOPE). It is not
      a claimed break, a closure result or a contradiction of validated
      evidence (AGENTS.md rule 12).
    unservable_rule: >-
      If review-adversarial cannot be served at xhigh for a review card, that
      card is not dispatched and the impediment is recorded on the
      still-active goal. The tier is never lowered. A backend substitution
      that fully meets the xhigh floor is recorded as fallback_used and is not
      a downgrade.
    tripwires:
      - id: TQ-1
        fires_when: >-
          Any party of this round reads anything under
          experiments/EXP-QSP-70b731/runs/, a path in the specification's
          blind_from, ledger/evidence/EV-QSP-a6aa4b.yaml or a DEC-20260917-*
          decision.
        effect: >-
          The party stops and reports it at the top of its file. If it is the
          producer, the composer applies K-design-revise and the design is
          rewritten by a fresh session; if a reviewer, its joint reads
          inconclusive (K-infra) and a fresh reviewer is needed.
      - id: TQ-2
        fires_when: >-
          amendment-v2.yaml changes any field outside R-AMEND-SCOPE (A1 route
          per cell, A2 stage and control order, A3 Stage 0 mechanics; tighten
          only for invalidation rules, stopping rules and blind_from), or
          touches preregistered_prediction, success_criterion,
          falsification_criterion, M1 to M9, certificate_semantics, the
          candidate set, the cells, seeds, claim_tier, the field model or any
          tolerance.
        effect: The composer does not approve the amendment and applies K-design-revise.
      - id: TQ-3
        fires_when: >-
          Any party runs an instrument (the bound closure or new code) or
          computes N_K(L), a root, a gcd with X^(2^n) - X, an H polynomial or
          any decision statistic on a cell the specification declares (stage
          0 (4, 3); stage 1 (11, 6), (13, 7), (7, 3); C2 to C6; any census
          cell at n = 131), or on any synthetic cell whose field degree n lies
          in {4, 7, 11, 12, 13, 31, 131}; or runs anything outside its card's
          allowed computations.
        effect: The composer applies K-design-revise. No acceptance.
      - id: TQ-4
        fires_when: >-
          Any record of this round states a run value of EXP-QSP-70b731 or of
          EXP-QSP-33b442, a reading of H-QSP-cd0c90's standing, or a sentence
          that any trial supports, weakens or contradicts H-QSP-cd0c90 or
          EV-QSP-a6aa4b.
        effect: The party finishes its joint, flags TQ-4 at the top and stops; the composer applies K-design-revise while the sentence stands.
      - id: TQ-5
        fires_when: A review card of this round cannot be served at review-adversarial xhigh.
        effect: See unservable_rule.
    tripwire_note: >-
      Pre-declared, so escalation is a rule applied and not a judgement made
      after reading the reports. TQ-3 carries the "no synthetic group may
      coincide with a declared cell" lesson in the QSP form (R-CARRIED CI-6).

