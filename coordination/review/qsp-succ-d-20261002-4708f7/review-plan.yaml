  scratch:
    rule: >-
      Each reviewer uses a private scratch subdirectory,
      <session scratchpad>/BATCH-4708f7/<its TASK id>/, created by the session
      before launch and named in the launch prompt. It writes temporaries only
      there, never lists the scratchpad root or a sibling subdirectory, never
      exports or copies a whole git tree into it (check out only the declared
      paths it needs, at the snapshot commit), and embeds every script and
      output it relies on in computations.json. Scratch is not an artifact and
      is not archived.
    paths:
      TASK-20261002-3b6a02: <session scratchpad>/BATCH-4708f7/TASK-20261002-3b6a02/
      TASK-20261002-323713: <session scratchpad>/BATCH-4708f7/TASK-20261002-323713/
      TASK-20261002-c81b2e: <session scratchpad>/BATCH-4708f7/TASK-20261002-c81b2e/

  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20261002-3b6a02 (PTM-D1); TASK-20261002-323713 (PTM-D2, PTM-D3)
    objects:
      - id: PTM-D1
        owner: TASK-20261002-3b6a02
        object: >-
          The bound closure (the eight files of
          experiments/EXP-QSP-70b731/implementation/ at the digests the plans
          print), read statically, fed through every acceptance check the
          design states.
        known_truth: >-
          That closure is non-conformant: the archived validator report
          locates F-01 (flat manifest writer), F-02 (certificate writer
          hard-coded off), F-03 (checker fallback pass), F-04 (I_indep path
          A-L duplicating I_direct) and F-06 (Stage 0 by census code;
          constant attestation). A design whose acceptance checks pass it on
          any of these has proved too much.
      - id: PTM-D2
        owner: TASK-20261002-323713
        object: >-
          The design's route rule applied to the bridge cell n' = 22 at
          d = 3 (q = 5, r = 21; bound max(2^1, 3^6) = 729) and to Band H n' =
          66 at d = 7 (q = 1, r = 65; bound 49).
        known_truth: >-
          Derivation (A)'s polynomial has degree at most 729 and 49 there,
          trivially feasible. A route rule that assigns these cells any route
          other than derivation (A), or an amendment that cites infeasibility
          for them, has proved too much.
      - id: PTM-D3
        owner: TASK-20261002-323713
        object: >-
          A hypothetical I_indep that computes deg gcd(X^(2^131) - X, L) by
          repeated squaring under a different function name, on a Band-L
          cell, fed through the design's independence acceptance check and
          route table.
        known_truth: >-
          That is I_direct (the specification's own definition of I_direct;
          F-04's path A-L). An independence check or a Band-L substitute route
          that admits it has proved too much.
    failure_signature: >-
      A correct design keeps each known-false conclusion out of reach.
      PTM-D1 fails the bound closure on at least F-01, F-02, F-04 and F-06.
      PTM-D2 routes both cells to derivation (A). PTM-D3 is rejected as not
      independent.
    how_to_run_it: >-
      Static reading and arithmetic on stated rules in your own script. No
      instrument is run on any cell the specification declares; nothing of
      the bound closure is executed. Put every script and output in
      computations.json. If a PTM would need a run, record it not performed
      with the reason.

  # ---------------------------------------------------------------------------
  blind_rederivation:
    required: true
    mode: fresh_card
    assigned_to: TASK-20261002-c81b2e
    quantity: >-
      Q0 to Q3 exactly as the quantities block of
      ledger/handoffs/TASK-20261002-c81b2e.yaml states them: Q0 undetermined
      choices; Q1 (q, r) = divmod(n, n') for every declared cell; Q2 per
      (cell, d) the bound B = max(2^(n'-r), d^(q+1)), log2 B and whether B is
      at most 2^20, 2^24 and 2^28; Q3 the number of candidate polynomials per
      census cell and per stage-1 cell under the stated rule, and the number
      of linearized polynomials it excludes.
    parameters: As frozen on TASK-20261002-c81b2e's card.
    blind_from:
      - coordination/review/qsp-succ-d-20261002-4708f7/review-plan.yaml
      - coordination/review/qsp-succ-r-20261002-4708f7/review-plan.yaml
      - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-4708f7/
      - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-2d2fa1/
      - ledger/decisions/
      - ledger/hypotheses/
      - ledger/proposals/
      - ledger/evidence/
      - experiments/
      - knowledge/
      - analysis/
    blind_from_note: >-
      The re-deriver's whitelist is its card, AGENTS.md, agents/validator.md
      and templates/research-records.md, none of which lies under these paths.
      The design's figures sit under BATCH-4708f7; the Coordinator's prior
      figures sit in DEC-20261002-a63f13 and in this plan; the old closure's
      path counts sit in the BATCH-2d2fa1 validator report. The producer may
      not read the blind card's report directory.
    agreement_tolerance: >-
      Q1 exact. Q2 B exact as an integer and log2 B within 0.01; the three
      threshold flags exact. Q3 exact.
    what_disagreement_means: >-
      Not that JD3 or the design is wrong. It localises the difference to a
      cell list, a candidate rule or one of two named implementations. The
      composer applies K-indeterminate and never prefers either side.

  # ---------------------------------------------------------------------------
  composition:
    who: >-
      The Coordinator, in TASK-20261002-55bec1, in a fresh session that did
      not run TASK-20261002-c5d9e7, did not author DEC-20261002-a63f13 or this
      plan, and is not a reviewer of this round. No reviewer votes on the
      whole design.
    independence_check: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/qsp-succ-d-20261002-4708f7/review-plan.yaml --reports
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-4708f7/reviews/TASK-20261002-3b6a02/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-4708f7/reviews/TASK-20261002-323713/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-4708f7/reviews/TASK-20261002-c81b2e/,
      run by the top-level session and recorded in DEC-20261002-6e68d8
      whatever it reports; the tool is never edited to pass. The
      --blind-history check is uncheckable (no protected-digest file) and is
      recorded as such (PD-D3).
    custody_without_seal: >-
      No seal card. Before TASK-20261002-55bec1 is launched, the top-level
      session computes sha256 of the six declared report files of this round
      and pastes them into the launch prompt. The composer records them
      verbatim as its first act, before reading any report.
      TASK-20261002-0abdcf must reproduce all six; a mismatch voids the
      composition.
    discharge_check: >-
      The composer reads the design's discharge table and checks that each of
      D-1 to D-8, the carried conditions and CI-1 to CI-6 maps to a named
      clause that the owning joint's report (discharge_map) does not
      contradict. An item with no clause is a defect for K-design-revise.
    keys:
      K-design-accept: >-
        JD1 and JD2 hold; JD3 agrees with the design within the tolerance;
        every PTM meets its failure signature; no tripwire fired; the
        discharge check passes; and, if amendment-v2.yaml exists, it lies
        inside R-AMEND-SCOPE and JD2 holds on its necessity and its
        consequence statement. DEC-20261002-6e68d8 then accepts the design
        and, if the amendment exists, approves it as protocol version 2 under
        the AGENTS.md standing user authorization (approval asserts nothing
        about N_K(L), H-QSP-cd0c90 or any curve), and names as its first next
        action the dispatch of TASK-20261002-e0b22e after TASK-20261002-0abdcf
        verifies. If no amendment was written, it returns the reserved AMD id
        unused by name.
      K-design-revise: >-
        JD1 or JD2 breaks, a discharge item has no clause, or TQ-1 (producer),
        TQ-2, TQ-3 or TQ-4 fired. Decision revise, each defect listed with its
        joint and breaking artifact; cards TASK-20261002-e0b22e to
        TASK-20261002-1b8018 are not dispatched; TASK-20261002-0abdcf closes
        the lane. The decision is a selection point (DEC-20261002-a63f13
        R-ORDER-3 (5)): it may keep slot 2 for a QSP-SUCC design revision
        only with a recorded reason and the cost of deferring the head item.
      K-indeterminate: >-
        JD3 disagrees with the design beyond the tolerance on any quantity.
        Decision revise, naming the quantity; neither side is preferred; as
        K-design-revise for the cards and the slot.
      K-new-record: >-
        A holding JD2, or the design itself, shows that the replication
        cannot be performed under the frozen specification plus an amendment
        inside R-AMEND-SCOPE (for example derivation (A) not implementable on
        the bridge or Band H as stated). Decision revise with that finding;
        cards 10 to 16 not dispatched; the lane closes at
        TASK-20261002-0abdcf; a new-record design batch (a superseding
        hypothesis and experiment with freshly minted ids) is ranked at this
        selection point with its reason and cost.
      K-infra: >-
        A reviewer could not run a joint. That joint reads inconclusive. No
        acceptance while any joint is inconclusive; the composer names the
        re-dispatch. An infrastructure failure is never negative evidence.
      any_tripwire: See tier.tripwires. The composer applies the tripwire's stated effect.
    owner_reply_duty: >-
      The composer rules on any reply of coordinator-qsp-run-20260921 that
      DEC-20261002-a63f13 R-QSP-RETURN routed to it (MSG ids in the queue's
      tasks_state_revisions), as a pointer.
    selection_point_duties: >-
      DEC-20261002-6e68d8 frees no slot under K-design-accept (the lane
      continues into round 2). Under any other key it closes the lane and is
      a selection point: the slot goes to the head item of
      DEC-20261002-a63f13 R-ORDER-3 or any later standing order on
      origin/main at its launch, unless it records a new reason and the cost
      of deferring the head item. It names exactly one first next action.

  procedure_deviations:
    - id: PD-D1
      severity: material
      what: The prior is informed, not blind (see informed_prior_disclosure).
      consequence: Concurrence of a reviewer with R-ROUTE-PRIOR is weak corroboration; JD3 is the structurally blind check on the route quantities.
    - id: PD-D2
      severity: disclosed
      what: >-
        The object did not exist when this plan was written; it is bound by
        the producer snapshot. The amendment is conditional, so its path is
        added to the producer card's artifact_paths only if written
        (the queue's R-AMD-PATH note).
    - id: PD-D3
      severity: disclosed
      what: >-
        No protected-digest file is written for this batch, so
        tools/check_review_independence.py --blind-history is uncheckable,
        never passed.
    - id: PD-D4
      severity: disclosed
      what: >-
        This plan names the amendment's consequence statement, the Band-L
        substitute's independence, D-6 and non-failing acceptance checks as
        likely break sites, and the producer reads the plan. A producer that
        closes them before review makes the round less likely to break at the
        predicted sites; that is the purpose of a worked attack.
    - id: PD-D5
      severity: disclosed
      what: >-
        JD2's owner judges route feasibility with its own reasoning before
        opening the producer's table (attack (i)); that is independence of
        order and implementation, not blindness. JD3 is blind on the
        arithmetic only; the feasibility judgement itself has no blind card.
  procedure_deviations_note: >-
    Five at writing. Later departures are recorded in DEC-20261002-6e68d8 or
    in an addendum, never absorbed.
