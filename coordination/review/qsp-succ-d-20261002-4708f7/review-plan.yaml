    TASK-20261002-3b6a02: >-
      You are the validator for TASK-20261002-3b6a02 of BATCH-4708f7 on
      GOAL-ECDLP2M-001, served at review-adversarial at xhigh. Read your card,
      ledger/handoffs/TASK-20261002-3b6a02.yaml, first, and follow it exactly;
