  # ---------------------------------------------------------------------------
  coordinator_prior:
    per_joint: >-
      JD1 (discharge table, work orders, specification reading, acceptance
      checks) holds with probability about 0.6. D-1, D-2, D-7 and D-8 are
      mechanical and should map cleanly. Where I expect a break: (a) D-6, if
      the design makes Stage 0 a trial whose payload still calls census code
      or reads a constant blind_from_respected rather than a declared,
      checkable read set; (b) an acceptance check that cannot fail (for
      example an M5 check that recomputes certificate_bearing from the same
      counter the driver reports rather than from files on disk); (c) the
      manifest target not being the run-record schema validate_ledger.py
      check_run applies. JD2 (routes, amendment, independence, ordering)
      holds with probability about 0.45 and is where I expect the round to
      turn. My reading (DEC-20261002-a63f13 R-ROUTE-PRIOR) is that a dense
      derivation-(A) construction is infeasible on most Band-L cells, so I
      expect the producer to write amendment-v2.yaml with an A1 clause; I
      expect the break, if any, in its consequence statement (what S1 and
      the pre-Band-H calibration still mean when derivation (A) runs only on
      the top of Band L and the bridge) or in an independence argument for
      the Band-L substitute route that silently shares I_direct's algorithm
      or primitives (F-04 again). A second likely break: D-5 read as
      permitting the blocking fixtures after the census because the stage
      numbering says so, which the stopping rules contradict. JD3 (blind
      route quantities) agrees with the design within tolerance with
      probability about 0.9; the risk is a mis-stated cell or candidate count,
      not arithmetic.
    overall: >-
      Probability about 0.35 that the round composes to K-design-accept with
      an approved amendment, about 0.15 to K-design-accept without one, about
      0.4 to K-design-revise (JD2 first, then JD1), and about 0.1 to
      K-new-record (derivation (A) shown not implementable on the bridge or
      Band H as stated).
    where_i_think_it_breaks_if_it_breaks: JD2 at the amendment's consequence statement, then JD2 at the Band-L substitute's independence, then JD1 at D-6, then JD1 at an acceptance check that cannot fail.
    what_would_overturn_this_prior_most: >-
      (1) A derivation-(A)-faithful route on all of Band L at feasible cost,
      found by the producer or by JD2, so that no amendment is needed; (2)
      the old closure passing the design's own acceptance checks (PTM-D1),
      which would mean the checks are not checks; (3) JD3 disagreeing with
      the design on q, r or a candidate count.
    informed_prior_disclosure: >-
      The prior is informed: the author of this plan read the archived
      validator report (including F-04's path counts) and computed
      R-ROUTE-PRIOR by hand. It read no run file.

  # ---------------------------------------------------------------------------
  joints:
    - joint: >-
        JD1 -- Discharge table, work orders, specification reading and
        acceptance checks for D-1, D-2, the accounting half of D-3, D-6, D-7,
        D-8, CI-2, CI-5, CI-6 and the carried conditions on run ids, re-runs
        and Linux. Every item maps to (the specification clause it rests on,
        an executor work order precise enough to implement without further
        design, and an acceptance check that the round-2 validator can run on
        synthetic cells and that can fail). The manifest target is the
        run-record schema tools/validate_ledger.py check_run applies, with
        every AGENTS.md artifact-policy field. Certificates are root-list
        files for every N > 0 row, re-verified by the wrapper root by root;
        certificate_bearing counts re-verified files on disk; M5 is checked
        per stage before any headline; under-listing is impossible or
        flagged; the checker has no fallback pass. Stage 0 is the hand
        re-derivation with no census code, and M9 a declared, checkable read
        set per run. The internal RNG seeds are declared. Failed and expired
        attempts leave a record validate_ledger can see. The successor plan
        covers all 20 trials with fresh run ids, none equal to any earlier
        plan's or bound directory's id. The design's own computations stayed
        inside D-C1 to D-C6.
      assigned_to: TASK-20261002-3b6a02
      attack_plan: >-
        (i) Read check_run in tools/validate_ledger.py and the AGENTS.md
        artifact policy; list every required field and check the design's
        manifest work order names each. (ii) For each acceptance check the
        design states, construct on paper or in your scratch a synthetic
        input that should fail it (a row with N > 0 and no certificate file;
        a row with root_count_listed below N and root_list_deferred false; a
        flat manifest; a Stage-0 payload that imports census code) and show
        the check as written would fail it; a check you cannot make fail
        breaks the joint. (iii) PTM-D1 below. (iv) Read stages.stage_0 and M9
        and check the D-6 mechanism contains no census code path and no
        constant attestation. (v) Check the run-id rule against the twenty
        run ids of trial-plan.json and the sixteen bound directory names
        listed in the archived validator report. (vi) Hash the producer files
        against TASK-20261002-f0f7e0 and the inputs as listed; check every
        relayed D-C output reproduces from the committed code blocks. Where I
        think it breaks: (iv), then (ii).
      breaking_artifact: >-
        A D-item, carried condition or CI item with no work order or no
        specification clause; an acceptance check that cannot fail; a
        manifest target that is not check_run's schema; a Stage 0 mechanism
        that runs census code or records a constant attestation; a run-id
        rule that admits reuse; a relayed computation that does not reproduce;
        the old closure passing the design's checks (PTM-D1).
    - joint: >-
        JD2 -- Instrument routes, the amendment, I_indep independence and
        stage order (D-4, the I_indep half of D-3, D-5, CI-1, CI-3, CI-4,
        R-AMEND-SCOPE; the blind_from carried condition). The design's route
        table assigns every census and calibration cell an I_indep route; a
        route other than derivation (A) appears only where derivation (A) is
        shown infeasible, by a stated cost argument; if amendment-v2.yaml
        exists it changes only R-AMEND-SCOPE fields, states its POST-DATA
        exposure honestly, states the consequence of each change for S1 and
        for the pre-Band-H calibration, names the cells on which derivation
        (A) itself is calibrated by C1 and shows they exercise the code path
        Band H uses; the Band-L substitute route (if any) is independent of
        I_direct in algorithm and primitives; the I_indep work order binds
        the author by CI-1, CI-3, CI-4 and the specification's blind_from; the
        Stage-1 calibration exercises every route the census uses; the D-5
        reading places the blocking fixtures C2 to C6 where the
        specification's stopping rules require, or the amendment moves them
        inside A2.
      assigned_to: TASK-20261002-323713
      attack_plan: >-
        (i) ROUTE TABLE FIRST. Before opening the design's route table or the
        amendment, write your own: for every census and calibration cell, q,
        r, the bound max(2^(n'-r), d^(q+1)) per d, and your own judgement
        whether derivation (A) as H-QSP-cd0c90 and IDEA-20260916-3f7a1c state
        it can be implemented at that cell within the specification's 8 GB
        machine-protection ceiling, by a dense construction or by any
        structured route you can find; record the order. (ii) Then compare
        with the design's table cell by cell; an amended route on a cell
        where you can exhibit a feasible derivation-(A) route breaks the
        joint, and so does derivation (A) assigned where it is infeasible.
        (iii) Diff amendment-v2.yaml against the specification field by
        field and classify each change as A1, A2, A3, a tightening, or
        out of scope (TQ-2). (iv) Read the amendment's consequence statement
        against S1 and the specification's sentence that Band-L and bridge
        agreement "calibrates it before Band H"; an overstated or omitted
        consequence breaks the joint. (v) PTM-D2 and PTM-D3 below. (vi) Read
        stopping_rules, controls C2 to C6 and stages; state where the
        blocking fixtures must run; compare with the design. Where I think it
        breaks: (iv), then (ii) on the Band-L substitute's independence.
      breaking_artifact: >-
        A cell whose route contradicts your table without a reason that
        survives; an amendment change outside R-AMEND-SCOPE (also TQ-2); a
        consequence statement that omits or overstates what S1 and the
        calibration still mean; a Band-L substitute that shares I_direct's
        algorithm or primitives; an I_indep work order that lets its author
        read the bound closure or a blind_from path; a Stage-1 calibration
        that skips a census route; a D-5 order the stopping rules forbid;
        PTM-D2 or PTM-D3 reaching the known-false conclusion.
    - joint: >-
        JD3 -- Blind re-derivation of the per-cell route quantities and
        candidate counts on the card of TASK-20261002-c81b2e (Q0 to Q3), from
        their definitions alone.
      assigned_to: TASK-20261002-c81b2e
      attack_plan: >-
        Fixed on the card; the re-deriver reads no producer artifact. The
        composer compares its Q1 to Q3 values with the design's route table
        and stated counts quantity by quantity under the agreement tolerance
        below.
      breaking_artifact: >-
        Any value differing from the design's figures beyond the tolerance
        (K-indeterminate).

  joint_ownership_note: >-
    Three joints, three owners, none unowned, none shared.
    TASK-20261002-3b6a02 (validator) owns JD1 and PTM-D1.
    TASK-20261002-323713 (red-team) owns JD2, PTM-D2 and PTM-D3.
    TASK-20261002-c81b2e (validator, blind) owns JD3.
    tools/check_review_independence.py is run with the three report
