    conditions_to_discharge: >-
      Read verbatim from DEC-20261002-e0aa2b defect_return (D-1 to D-8,
      carried_conditions) and DEC-20261002-a63f13 (R-AMEND-SCOPE, R-CARRIED
      CI-1 to CI-6). They are not paraphrased further here.
