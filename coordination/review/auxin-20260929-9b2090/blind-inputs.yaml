  what_you_are_testing: >-
    Three things about EXP-AUXIN-7e2e3d as its held texts state it: which
    phrases in those texts point at a document or part of one, and what each
    points at; which rules make a run-time decision depend on the bytes or
    state of a named file, path or record; and which rules speak about how
    the protocol is revised, approved, kept in custody, written, or how its
    references are read. You are not asked whether the rules are good. Your
    results will be compared with other work by someone who shares nothing
    with you.

  canonical_form: >-
    A string value is hashed as the UTF-8 bytes of the string a YAML safe
    loader returns. A non-string value (mapping, list, number, boolean, null)
    is hashed as JSON with sorted keys, ensure_ascii false and separators
    (',', ':'). A leaf whose effective text is assembled from several pieces
    (for example a field with a span replaced inside it) is hashed as the
    assembled string. State the library and version you used.

  quantities:
    BQ0:
      name: undetermined choices
      definition: >-
        Every point at which the held texts left you a choice in computing
        BQ1 to BQ3: which file governs a leaf; where a span begins or ends;
        how an addition combines with the field it is added to; whether a
        field is one leaf or several; what a phrase refers to; whether a
        clause is a run-time decision; whether AMD-20260916-bands.yaml or
        AMD-20260923-d1d10.yaml governs any leaf. Quote the text, list the
        admissible readings, and name what depends on the choice. A reading
        the text excludes only by implication is listed as admissible and
        marked so.
      report: A list. An empty list is a result and is stated as such.
    BQ1:
      name: self-referential phrase inventory
      definition: >-
        Every occurrence, in any of the six files, of a phrase that designates
        a document, a file, a layer, a contract, a specification, an
        amendment, a protocol, a text, an experiment, a record, a table or a
        convention, where the phrase is (a) a deictic or definite description
        ("this ...", "these ...", "the ...", "above", "below", "the
        following", "held ...", "the combined ..."), (b) a file name or path,
        or (c) an amendment.<path> or experiment.<path> form. State your
        matching rule first. For each occurrence give the file, the field
        path of the leaf it sits in, the character offset within the leaf's
        string value, the phrase verbatim, and its referent in the held stack
        (which file, which layer, or which combination of files, and the
        clause of the held texts that fixes that referent).
      report: Your matching rule; one record per occurrence; a list of phrases whose referent you could not fix, each also entered under BQ0.
    BQ2:
      name: effective text and held-file dependence per table row
      definition: >-
        For each row of the governing_text_table of AMD-20260928-gated.yaml,
        in table order: the row's field name exactly as the table writes it;
        the file whose text governs it under the held texts' own
        supersession, span and precedence rules (report where your
        determination differs from the table's layer column); the effective
        text after every supersession, span replacement and addition that
        applies; its sha256 in the canonical form; and whether any run-time
        decision in that text (a gate, stop, launch refusal, admission item,
        validity or invalidation rule, outcome, or custody check) depends on
        the bytes, sha256, cleanliness (dirty or clean state), presence, or
        archiving of a named file, path or record. For each such dependence
        name the file, path or record and quote the clause.
      report: One record per table row with field, governing file, effective text (verbatim), sha256, the clauses that decided each, and the dependence list (empty if none).
    BQ3:
      name: reserved-topic rules and protocol content per table row
      definition: >-
        For each row in BQ2: (a) whether its effective text states a rule on
        any of these topics: revision (how the protocol or any rule of it may
        be changed, added to or replaced); approval (who or what approves,
        and what approval requires); custody (what must be hashed, checked,
        kept clean or archived, and against what); write scope (which paths
        may be written); reading of references (how a reference in the text
        is to be read). Name each topic and quote the clause. (b) whether the
        text is protocol content (a gate, stop, validity rule, outcome,
        control, definition, custody check, pin, parameter or any rule a run
        must obey) or machinery only (identity, approval status, provenance,
        citation, or how the held files govern one another). State your
        classifying rules first. Where a row mixes both, classify it as
        protocol content and quote the clause that makes it so.
      report: One record per row with the topics found (with quotes) and the content class.

