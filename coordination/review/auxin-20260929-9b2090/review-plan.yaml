        Where I think it breaks: T-0124 and T-0636; custody scope undefined.
      breaking_artifact: A stated entry on a reserved topic that decides a run-time question differently from the fresh field, not neutralised by a stated F-READ rule, with the situation constructed; or an undefined reserved term on which two readings decide a run-time question differently.
    - joint: EJ7 -- BLIND RE-DERIVATION FROM THE HELD TEXTS ALONE. See blind_rederivation. Owned by the re-deriver; its verdict is inconclusive by design and the composer compares.
      assigned_to: TASK-20260929-7109a0
      attack_plan: >-
