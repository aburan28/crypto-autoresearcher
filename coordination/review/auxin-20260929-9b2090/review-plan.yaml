      attack_plan: >-
        Build your own phrase inventory over every stated entry (do not start
        from the control's phrase lists; compare with them afterwards). For
        each phrase: which rules could fire, which fires first under the
        stated order, the table's rule, the held referent and the F-READ
        referent.
        Named breaks: EJ3-B1 (no stated reference still reads an
        incorporates or incorporates_by_hash field; amendment.<path> read by
        R7 only, with no R2/R3 overlap left); EJ3-B2 (T-0461 under R2 needs
        this contract's own verified snapshot; whether T-0457, EJ3-M1, still
        compounds by requiring the predecessor's approval chain).
        Control findings: decide whether, in typed spans, "the frozen
        <field>" and "frozen spec(ification)" are read by R4 (typed
        conventions.Q0-11, provenance only unless an exception applies) or
        by R7 as the table says, quoting F-READ's order and R4's and R7's
        texts; construct a run-time situation in which the two readings
        decide differently, or show none exists. Decide whether "held text"
        (T-0560) is a self-referential phrase R9 requires in the table.
        New text: R2's "this specification" and "this experiment" (T-0535);
        R8 (T-0566); EJ3-M4 (T-0463 quoting an older launch_gate.note; the
        words "scientific_execution_authorized is true" there are quoted text
