  # ---------------------------------------------------------------------------
  # REPORTS, SEAL AND COMPOSITION.
  # ---------------------------------------------------------------------------
  attestation_schema_note: >-
    Every report carries review_attestation as templates/research-records.md
    defines it (task_id, joints_owned, sources_read, read_sibling_reports,
    blind_from_respected for the re-deriver) and a `verdicts` mapping keyed
    by joint label with holds, breaks or inconclusive. The validator and red
    team also report, per named break they own, fixed / not fixed /
    inconclusive with the breaking artifact or the argument. The red team
    reports each PTM object against its failure_signature. No whole-claim
    verdict.
  seal: >-
    TASK-20260929-6beb6d hashes every file under each reviewer's reviews/
    directory after all three return, before composition. The composer
    verifies every report against the seal; a mismatch voids composition.
  independence_check: >-
    python3 tools/check_review_independence.py --plan coordination/review/auxin-20260929-9b2090/review-plan.yaml
    --reports coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-9b2090/reviews/
    run by the composer; its result is recorded in the composing decision
    whatever it is.

  composition:
    who: >-
      The Coordinator, in TASK-20260929-316eb6, in a session that did not run
      TASK-20260928-4d6266, TASK-20260929-e066a4, TASK-20260929-32a383,
      TASK-20260929-8d90b4 or any reviewer task of this round. It stages
      DEC-20260929-7efa82 in its composition directory; TASK-20260929-763550
      places it.
    reads: the sealed reports, the seal, this plan, the draft, the controls outputs, the held sources and the sealed round-8456b6 EJ7 report of TASK-20260928-57191a (as the second EJ7 comparator only).
    keys_in_precedence_order:
      - key: K-escalate
        when: A reviewer reports, with a quoted clause, that the draft claims a breakthrough, a closure result or a contradiction of validated evidence.
        then: Composition stops. A review-breakthrough round is carded under a new plan; the claim is not promoted. That tier is never downgraded.
      - key: K-infra
        when: A reviewer task failed, timed out or crashed, or returned no report.
        then: No evidence either way. The joint is re-carded in a new task; never a negative result.
      - key: K-leak
        when: The re-deriver's attestation lists a path outside its card's allowed files (other than its own claim and release paths and files it wrote), blind_from_respected is false, it ran search, grep, glob or git status, or a pre-dispatch hygiene check failed on its ref.
        then: EJ7 is void (not evidence). A new blind task under a new id; the other joints compose normally.
      - key: K-revise
        when: >-
          Any of EJ1 to EJ6 or EJ8 breaks with its breaking_artifact; or any
          named break is reported not fixed with its artifact; or the
          composer traces an EJ7 comparison difference (BQ1 to BQ3, outside
          the threshold index) to the draft.
        then: >-
          EXP-AUXIN-bafa2e is not approved. Under F-REV, any fix is a new
          successor contract under a new EXP id; no amendment layers this
          draft. RS-B stays the selected scope; no re-ranking unless a
          rerank_trigger fires.
      - key: K-reviewer-error
        when: An EJ7 difference the composer traces to the re-deriver, or a control finding every owning reviewer shows to be a control error with the argument.
        then: Recorded as a re-deriver or control error, not a draft defect. If it leaves any row uncompared, a new blind task covers only those rows before K-hold can be read.
      - key: K-indeterminate
        when: Any joint or named break is inconclusive with no break; or a PTM object fails its failure_signature, which voids the verdict of the joint that relied on it.
        then: Inconclusive. A successor review task on the affected joints only, under an addendum to this plan. No approval.
      - key: K-hold
        when: >-
          EJ1 to EJ6 and EJ8 hold; every named break is reported fixed; every
          PTM object behaves per its failure_signature; EJ7 agrees on every
          compared row after granularity reconciliation that changes no text;
          every control finding is either confirmed harmless or shown to be a
          control error by its owning reviewer; the independence check passes.
        then: >-
          The round holds. The composing decision may approve
          EXP-AUXIN-bafa2e by name at sha256
          667cf21e1a0680eaa5eb862164835a0074c109f2254f5ac6f52428327ba27bbd
          under F-APPROVAL. It still does not set
          scientific_execution_authorized; placement under
          experiments/EXP-AUXIN-bafa2e/ is a later archived act; any executor
          card carries F-PRE unweakened. H-AUXIN-6db354 stays proposed.
    no_key_after_the_fact: No key is added, removed or reworded after any report returns, except by an addendum written before the composer reads a report, disclosed in procedure_deviations.

