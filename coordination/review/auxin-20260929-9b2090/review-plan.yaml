        Negative control: on a scratch copy, delete one table row and flip
        one row's rule; your closure and order checks must report both.
        Where I think it breaks: the typed-span R4/R7 rows, and R9's closure.
      breaking_artifact: A phrase with no rule, two rules the order does not decide, a table rule that differs from the rule the stated order selects where the referent differs, an unlisted self-referential phrase, or a reference whose F-READ referent decides a named run-time question differently from its held referent with no fresh field replacing it; each with the situation constructed.
    - joint: EJ4 -- THE FRESH DECISION CLAUSES F-N4 AND F-BOUND-CONSTRUCTED. As re-authored in this draft (PD-4d6266-2), F-N4's biconditional holds against the transcluded C-BOUND gates and stopping rule 10, and F-BOUND-CONSTRUCTED yields exactly one expected block for any BOUND state a reviewer declares.
      assigned_to: TASK-20260929-1980c4
      attack_plan: >-
        First diff this draft's F-N4, F-BOUND-CONSTRUCTED and F-INDEX against
        the same-named fields of EXP-AUXIN-edd104 (read-only; the design
        report says content is unchanged). Any textual difference is
        attacked in full: the truth table of returned fields against the
        C-BOUND gates on paths A and B, BND-1 to BND-3 built from their
        recipes with your own code, and one BOUND state of your own that bins
        NEAR_FLOOR, derived before evaluation. If the text is identical,
        still re-run the truth table on this draft's transcluded gate texts
        (the spans may differ from edd104's) and one declared state.
        Where I think it breaks: nowhere.
      breaking_artifact: A concrete state and field on which N4 and stopping rule 10 disagree, or a declared constructed state with two admissible expected values for one field.
    - joint: EJ5 -- NOTHING NORMATIVE DROPPED BY REPLACEMENT OR BY ENVELOPE. Every replacement_table row's fresh field states every run-time clause of the held leaf it replaces except clauses that bind a held file; no envelope_or_layering row carries a run-time rule not stated elsewhere; every additions_read_together group reproduces its held path_additions; the ADM-7 replacement and the EJ5-D1 non_claim are consistent with the held text they sit beside.
      assigned_to: TASK-20260929-1980c4
      attack_plan: >-
        For each replacement_table row, extract every normative clause of the
        held leaf (must, shall, only, refuse, stop, invalid, fail, before,
        unless, conditioned on). Classify each as binding a held file or not.
        For every clause that does not bind a held file, name the fresh
        wording that states it, or record it as dropped with the run-time
        behaviour now permitted. Pay attention to F-CUSTODY.manifest's
        non-hash items, D10's implementation-module sentences under F-WRITE,
        and F-CUSTODY.admission_item_7 against the ADM-7 span's other
        conditions and position in the admission list. For each dropped
        read-together group (change.D8_custody.manifest,
        change.D8_custody.trial_plan, invalidation_rules), confirm every
        addition is a replaced leaf. For envelope rows, repeat the round-8456b6
        EJ5 extraction on this draft (EJ5-G1, EJ5-G2 belong to EJ8). Check the
        EJ5-D1 non_claim does not rehabilitate or cite either run as evidence.
        Negative control: remove one non-hash manifest item from a scratch
        copy of F-CUSTODY.manifest; your check must report it dropped.
        Where I think it breaks: manifest non-hash items or D10 module sentences.
      breaking_artifact: A dropped non-held run-time clause with the run-time behaviour it now permits, or a read-together path whose grouped texts differ from the held path_additions.
    - joint: EJ6 -- NO RUN-TIME DEPENDENCE ON HELD FILES; A NEW EXPERIMENT, NOT A LAYER. No run-time decision of EXP-AUXIN-bafa2e changes when any EXP-AUXIN-7e2e3d file changes and the successor's bytes do not; the draft incorporates nothing by hash or reference and supersedes no held field; the R5 remap names only EXP-AUXIN-bafa2e paths.
      assigned_to: TASK-20260929-32cfb8
      attack_plan: >-
        Named break EJ6-B1. Re-run a held-file mutation test of your own
        design (do not reuse held_file_mutation.py; you may read it after
        your own run to compare): mutate each of the six held files and add
        a file under the held implementation directory, in a scratch clone,
        and evaluate every stated rule that names custody, dirtiness,
        governing text, archives, snapshots, receipts or implementation
