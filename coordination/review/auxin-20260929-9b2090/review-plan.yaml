        Not-a-layer: the CD-6 form (no incorporation, no supersession) with
        PTM-1. Where I think it breaks: T-0388, then T-0457.
      breaking_artifact: A stated rule whose outcome (or whose deciding input) changes when a held file changes and the successor's bytes do not, with the mutation and the rule quoted; or an incorporation or supersession; or a remapped path into the predecessor's tree.
    - joint: EJ8 -- FRESH FIELDS AGAINST TRANSCLUDED TEXT UNDER F-PREC RESERVED TOPICS. No stated entry states a rule on revision, approval, custody, write scope or reference reading that differs from the fresh field reserved for that topic; F-CUSTODY.scope's "custody" is defined well enough to decide which stated entries it displaces; carried tensions are resolved or harmless.
      assigned_to: TASK-20260929-32cfb8
      attack_plan: >-
        Named break EJ6-B2: is T-0124 ("a later amendment may pre-register a
        rule") a revision route that F-REV forbids, or history that decides
        nothing? Construct the run-time situation. Control findings: T-0162
