  joints:
    - joint: EJ1 -- SPAN FIDELITY AND BUILD REPRODUCIBILITY. Every item of successor_contract.transcluded.entries is a byte-exact copy of the span its anchor names in the blob at source_commit under its declared anchor convention; every span_sha256 and source_blob_sha256 recomputes; no two entries overlap in one source; no entry is copied from a source path that replacement_table replaces; build_successor.py rebuilds draft-contract.yaml byte for byte.
      assigned_to: TASK-20260929-1980c4
      attack_plan: >-
        Write your own verifier; do not call build_successor.py's verify path.
        For each entry: git show the blob at source_commit, check
        source_blob_sha256, resolve the anchor under its convention, compare
        text, hash UTF-8 bytes, compare span_sha256. Check pairwise
        non-overlap per source. For each replacement_table row, confirm no
        entry's anchor lies inside the replaced source path (the design
        report's builder_guard claim). Separately run build_successor.py
        twice with the source commit into your own write scope and compare
        sha256 with the snapshot digest.
        Negative control (required): on a scratch copy, flip one byte in one
        entry's text and, separately, move one entry's anchor into a replaced
        path; your verifier must report both.
        Where I think it breaks: nowhere; if anywhere, source_bytes anchors.
      breaking_artifact: An entry whose recomputed hash or resolved text differs, an unresolvable anchor, an overlapping pair, an entry inside a replaced path, or a rebuild whose sha256 differs.
    - joint: EJ2 -- LEAF_MAP COMPLETENESS, COMPOSITION AND THE C-ORDER ROWS. Every row of the held governing_text_table of AMD-20260928-gated has exactly one leaf_map row and no leaf_map row lacks a held row; each stated row composes to the held effective text under its composition string; each superseded row's replaced_by_entries resolve from the supersedes_fields item it cites; the C-ORDER rows are correct.
      assigned_to: TASK-20260929-1980c4
      attack_plan: >-
        Build the held effective text of every leaf yourself, compose each
        stated row from its entries under the row's composition string
        (PD-4d6266-4), and compare by sha256. Bijection check. For every
        superseded row, resolve the cited supersedes_fields item
        independently and compare replaced_by_entries as sets and in order.
        C-ORDER (named break): for rows v1:controls[ordering].name and
        v1:controls[ordering].design, state what the cited item names under
        (a) the validator reading of VAL-20260928-85bfad and (b) the literal
        amendment.<path> reading; say which the held text supports, quoting
        it, and whether the rows are correct under that reading. "Fixed
        under reading (a)" without an answer on (b) is inconclusive, not
        holds. Check that no other superseded row gained or lost an entry
        through the builder change (the design report says none did).
        Negative control: drop one entry id from one stated row in a scratch
        copy and confirm your check fails.
        Where I think it breaks: the C-ORDER rows under the literal reading.
      breaking_artifact: A held leaf with zero or two rows, a stated row whose composed text differs from the held effective text, a superseded row whose replacement set differs from the cited item under the reading the held text supports.
