      breaking_artifact: A row the composer traces to the draft (not to the re-deriver) whose composed text differs, whose held-file dependence survives in a stated span, whose reserved-topic rule survives in a stated span, or whose self-referential phrase is absent from self_reference_table.

  joints_note: >-
    These joints are named for this draft's surfaces and the design report's
    named defects, unchecked text and control targets, not copied from the
    round-8456b6 plan (whose structure is followed). Earlier rounds' verdicts
    do not carry into this composition.

  # ---------------------------------------------------------------------------
  # BLINDNESS.
  # ---------------------------------------------------------------------------
  blindness:
    mutual: true
    lifted_for: []
    rationale: null
    rules:
      - No reviewer of this round reads another reviewer's report, computations, notes or messages of this round, before or after writing its own.
      - No reviewer reads a computations file, seal body or composition worksheet of any earlier AUXIN round. The validator and red team may read the committed round-8456b6 reports RT-20260928-150e1c and VAL-20260928-85bfad and DEC-20260928-004532, because the named breaks are defined there; the re-deriver may not.
      - The validator and red team may read the pre-review control outputs of TASK-20260929-e066a4 (they are the Coordinator's observations to attack), but only after their own independent check of the corresponding joint is written into their computations.
      - Each reviewer attests under review_attestation.sources_read to every path opened, and read_sibling_reports false.
      - The re-deriver reads only the files its card lists, runs no search, grep or glob, runs no git status and no git command that shows history.

  reviewer_independence: >-
    Each reviewer runs in its own session, and none of the three is the same
    session as another. Ineligible: the producer session of
    TASK-20260928-4d6266 (coordinator-auxin-producer-9b2090); the snapshot
    session of TASK-20260928-f470fd (coordinator-auxin-snapshot-9b2090);
    any session that ran TASK-20260928-6c71f5 or TASK-20260928-e31713; this
    session (coordinator-auxin-controls-9b2090: TASK-20260929-e066a4,
    TASK-20260929-a3f933, TASK-20260929-32a383, TASK-20260929-8d90b4); any
    author of AMD-20260926-typed, AMD-20260927-narrow or AMD-20260928-gated;
    and any session that ran a reviewer, seal or composer task of round
    8456b6 (TASK-20260928-e2cfcf, TASK-20260928-2f300c,
    TASK-20260928-36ebc2, TASK-20260928-ffff5c, TASK-20260928-1507c9,
    TASK-20260928-57191a, TASK-20260928-bbc985, TASK-20260928-1dd5cc) or
    TASK-20260928-fa9275.

  # ---------------------------------------------------------------------------
  # PROVES-TOO-MUCH CONTROLS. Objects for which the governing claim is KNOWN
  # FALSE. Owned by the red team; scratch objects in its own write scope.
  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20260929-32cfb8
    governing_claim_tested: >-
      "This file states the held protocol once, reads every reference by one
      rule, depends at run time on no held-file byte, and states no
      reserved-topic rule outside its fresh fields."
    failure_signature: >-
      On every object below the test or argument the red team uses must come
      out FALSE. An argument that returns TRUE on any of them has proved too
      much, and the joint that relied on it is K-indeterminate.
    objects:
      - id: PTM-1
        object: AMD-20260928-gated.yaml read as a candidate successor.
        known_false_because: It incorporates narrow by hash, states precedence over the four-layer set and supersedes held fields.
        failure_signature: The EJ6 not-a-layer criterion must classify it as a layer, and the EJ6 dependence test must find its outcome depends on held bytes.
      - id: PTM-2
        object: The refused draft EXP-AUXIN-edd104 draft-contract.yaml (BATCH-8456b6, sha256 a85aa7630ecca8f11385a5ff6c52d9fa9197028a96366852565d0804603c4a69), read only.
        known_false_because: DEC-20260928-004532 (committed, ledger archive d069da95ca) found EJ6-B1 and EJ3-B2 breaks in it.
        failure_signature: The EJ6 held-file mutation test must find at least one stated rule of edd104 affected, and the EJ3 argument must find its "this frozen contract" referent problem. If either passes edd104, it proves too much.
      - id: PTM-3
        object: A scratch copy of this draft with one self_reference_table row deleted and F-READ's order sentence removed.
        known_false_because: The table is then not closed and two rules can fire with nothing to decide.
        failure_signature: The EJ3 closure and order argument must fail on it.
      - id: PTM-4
        object: A scratch copy of this draft with one stated entry's text replaced by "An amendment file may revise any rule of this contract." (hash left stale is acceptable; the argument is run on text).
        known_false_because: It states a revision route F-REV forbids.
        failure_signature: The EJ8 conflict argument must flag it as a reserved-topic conflict not neutralised by F-READ.
    note: >-
      Joint-internal negative controls (EJ1, EJ2, EJ3, EJ5) are controls on
      each reviewer's own tooling; they are not substitutes for these.

