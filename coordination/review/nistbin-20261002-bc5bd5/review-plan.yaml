      Q1-571: within 0.01 bit; exact on bit length and k_c. QA: within 0.01
      bit on A(571, m) and on the relation store, under matching P form and k
      reading. Q3: exact on every integer D*_R(c, 3.0, m) token; within 0.01
      on D*real_B. QX: exact on D_ps and D_cum; within 0.05 bit on DELTA7.
      QNF: the tolerance the amendment states per item, by default 0.01 bit on
      log2 quantities and exact on integers. Carried J9: as frozen in
      REVIEW-NISTBIN-20260925-b67954. Carried J10: as frozen in
      REVIEW-NISTBIN-20261002-f435ab, under PF-1 only.
    what_disagreement_means: >-
      NOT that a reviewer, J9, J10 or J11 is wrong. It localises the
      difference to an undetermined model, an undetermined convention, or one
      of two named implementations. The composer reads both and applies
      K-indeterminate or K-fixture; it never prefers either side. A version-4
      value under a reading no blind card evaluated is recorded NOT
      BLIND-RE-DERIVED (a disclosed gap), never as agreement. Blind cards
      disagreeing with each other on a value version 4 does not freeze is a
      finding for the composer to record, not a key.

  # ---------------------------------------------------------------------------
  composition:
    who: >-
      The Coordinator, in TASK-20261002-fb61ea, a fresh session that did not
      run TASK-20261002-e11714 or the gate sub-session of TASK-20261002-1d1f48,
      did not compose DEC-20261002-353743, DEC-20260925-41f6dc or
      DEC-20260924-124667, did not write this plan or DEC-20261002-3ba55f, and
      is not a reviewer of this round. It holds no shell. It writes
      DEC-20261002-09e2be and one composition worksheet, and edits neither the
      hypothesis nor the specification. No reviewer votes on the whole
      contract.
    independence_check: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/nistbin-20261002-bc5bd5/review-plan.yaml --reports
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-bc5bd5/reviews/TASK-20261002-16c2f1/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-bc5bd5/reviews/TASK-20261002-ccdc5f/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-bc5bd5/reviews/TASK-20261002-aeaf93/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-bc5bd5/reviews/TASK-20261002-f19cfa/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-bc5bd5/reviews/TASK-20261002-ee63af/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/reviews/TASK-20260925-a43591/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-f435ab/reviews/TASK-20261002-84c5d6/,
      run by the top-level session immediately before the composer's launch
      and pasted verbatim after its prompt; recorded in DEC-20261002-09e2be
      whatever it reports. If the tool refuses a carried report, the composer
      applies K-carry-broken to that joint; the tool is never edited to pass.
      --blind-history is UNCHECKABLE (no protected-digest file), recorded as
      such, never as passed.
    custody_without_seal: >-
      No seal card. Before TASK-20261002-fb61ea is launched, the top-level
      session computes sha256 of the ten report files of this round (the five
      reports and the computations.json beside each) and of the four carried
      files, and pastes them after the composer's prompt. The composer
      records them verbatim as its first act, before reading any report, and
      checks the carried four against the values in digest_check above.
      TASK-20261002-970085 must reproduce all fourteen; a mismatch voids the
      composition.
    gate_check: >-
      The composer is not blind. It checks the pre-review gate: both gate
      files present and bound by TASK-20261002-1d1f48; every hit disposed of
      under exactly one of D1 to D4; every D4 group basis re-checked and a
      sample of hits opened at source, the method disclosed; every NF-nn
      definition transcribed or flagged not separable. A gate defect is a
      procedure finding of the composing decision, disclosed there and never
      repaired by re-running a review.
    discharge_check: >-
      The composer reads the worksheet's discharge table and checks that each
      of RV3-1 to RV3-14 maps to a named clause that its owning joint's report
      does not contradict, that each RV3-14 item id is answered in substance
      against the version-3 report that raised it, that DI-INDEX is present,
      and that every change to an item 353743 composed as holding is in
      constants_delta with its forcing item. An RV3 item with no clause is a
      missing approval field for K-revise-defect.
    keys:
      K-approve: >-
        J1 to J8 hold; J6 reports the fixture passing as frozen; J8 reports no
        breaking UNOWNED item; J6's D-CARRY finds no uncovered difference, and
        J9 and J10 each agree with version 4 on every value they computed,
        under matching MI-1 and MI-2 labels, within their frozen tolerances;
        J11 agrees with version 4 on every newly frozen value (QA, any Q3
        value version 4 freezes, QX where version 4 states a crossover, every
        QNF item) within tolerance; every undetermined choice J11 reports that
        changes a value is a numbered model-identification choice version 4
        declares with its consequence disclosed; every PTM meets its failure
        signature; no tripwire fired; the discharge check passes; the gate
        check finds no misclassified hit that bears on a compared value.
        DEC-20261002-09e2be then approves "EXP-NISTBIN-451dfa version 4"
        under the AGENTS.md standing user authorization and names as its
        first next action an execution batch whose first card advances the
        approval and status fields (DEC-20260924-f0a9c7 R4) and whose
        executor card is minted then; that batch takes a goal slot only under
        the standing order in force at the selection point. Approval asserts
        nothing about the 571 cell, the true solving degree or any curve.
      K-revise-defect: >-
        Any of J1 to J8 breaks (including a J5 regression or a breaking
        UNOWNED item), a field approval requires is missing, an RV3 item is
        undischarged, or TA-3 fired on Part 3, re-measurement, instrument
        execution or module-level execution. Decision revise, listing each
        defect with its joint and breaking artifact. No run. STRUCTURAL
        DUTY: if a defect class recurs from the version-3 round (C8 broke in
        the version-2 and version-3 rounds), the composer states whether the
        remedy is local or structural and, if structural, names the
        structural remedy (for example the superseding record form, which
        collapses the hypothesis layers) in its first next action rather than
        a same-form revision.
      K-fixture: >-
        J6 reports the fixture failing as frozen, or J9's Q2 under the frozen
        readings disagrees with the frozen target beyond tolerance. Revise on
        C2.
      K-indeterminate: >-
        J9, J10 or J11 reports an undetermined choice that changes a compared
        value beyond tolerance and that version 4 does not declare as a
        numbered choice with its consequence; or a reviewer and a blind card
        disagree on a value under the same labels. Revise on C1, C2, C3 or C8
        as the quantity requires, naming both implementations; the composer
        prefers neither. A divergence only between readings version 4
        declares and discloses (MI-1, MI-2 or a further numbered choice) does
        not fire this key.
      K-carry-broken: >-
        J6's D-CARRY reports an uncovered difference in a value J9 or J10
        computed, the independence tool refuses a carried report, or TA-3's
        blind-read clause fired. The carried joint is not applicable to the
        affected values; J11 governs them where it computed them; otherwise
        no approval resting on them, decision revise, with a fresh blind card
        on those values in the first next action. Not a defect of the
        mathematics.
      K-leak: >-
        J11 reports a BL-4 leak or an exposure, or the gate shows a D3 hit or a
        misclassified D4 hit bearing on a J11 value. The affected J11 values
        are admitted only as attested-blind or set aside, and the keys are
        applied with them set aside; if approval would depend on them, no
        approval; replicate J11 under a corrected whitelist.
      K-duplicate: >-
        The producer or a reviewer reports under C4 that a D_solve sensitivity
        surface exists or is in flight on GOAL-SEMBIN-fcb7a2. Revise; the
        lane is withdrawn with a bus pointer to that lane.
      K-impediment: >-
        A card could not be served at review-breakthrough at max (TA-4). It is
        not dispatched; the impediment is recorded on the active goal; the
        claim stays un-promoted; no composition until every card is served.
        Never a downgrade and never evidence.
      K-infra: >-
        A reviewer could not run a joint (tool absent, environment failure,
        watchdog, a killed session not continued). That joint reads
        inconclusive. No approval while any joint other than J9, J10 and J11
        (which are inconclusive by design) is inconclusive; the decision is
        revise or replicate the review. An infrastructure failure is never
        negative evidence about the contract's mathematics or any curve.
      any_tripwire: See tier.tripwires. The composer applies the tripwire's stated effect.
    selection_point_duties: >-
      The composing decision is a selection point of GOAL-ECDLP2M-001. It reads
      DEC-20261002-3ba55f (R-SLOT-3, R-ORDER-5, R-08C3F8-CHECK) and every later
      decision on this goal on origin/main at its launch, and records only
      changes to the standing order, each with its reason, cost and revisit.
      It rules the slot this batch frees under R-ORDER-5 (S1-V5 next, then
      U-HOLDH-V2); performs the DEC-20261002-8cabf8 R-08C3F8 reconciliation if
      DEC-20261002-08c3f8 has reached origin/main; carries the HOLD-F and
      HOLD-G row-set condition (DEC-20261002-353743 hold_f_hold_g);
      re-applies X-CERTBIN if any CERTBIN contract has been versioned since
      DEC-20261002-0983f2; and, under K-approve, ranks the execution batch
      against the standing order rather than giving it the freed slot by
      default.

