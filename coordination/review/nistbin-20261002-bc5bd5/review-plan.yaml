  in_force_text_rule:
    declared_by: this plan (DEC-20261002-353743 RV3-2 leaves the rule to the next plan, never to the producer)
    rule: >-
      (1) The in-force text of version 4 is: the version-4 specification; the
      hypothesis version_4 block; every field of the version_3, version_2 and
      version_1 layers of the hypothesis that the version_4 block does not
      name as superseded; the version-4 audit sheet, INCLUDING every verbatim
      log or session-computation output embedded in it; and the version-4
      worksheet. (2) A VERBATIM LOG IS IN-FORCE TEXT. It is not exempt as a
      record: a log is where a reader takes the figure from, and the
      version-3 break J2-D3 was a log. Each printed log line is one list item
      for the WITH rule. (3) WITH RULE (frozen, unchanged from the version-3
      plan and extended to tables and logs): a time figure is WITH memory
      only if a memory figure for the same object stands in the same
      sentence, the same list item, the same table row or the same printed
      log line. (4) Index text that refers to a figure by field-path label
      carries no figure; a numeral in index text is a figure.
    cost_stated_plainly: >-
      Every code block that prints a time figure must print its memory figure
      on the same line, so CB-2 and any successor change digest. That is the
      remedy RV3-1 already requires.

