      sub-condition is neither fixed true nor fixed false by the closed-form
      table, does not fire from a grid-edge entry, does not fire at another
      k, t or report, and names an event that would make the Part 3
      measurement more worth making. PTM-H: the reading at that m is refused
      by rule (route S) or routed only through the numbered transfer
      heuristic with its falsifier (route T). PTM-I: no in-force sentence
      switches direction at D_ps or asserts a direction over a degree range
      on which the cumulative difference has the opposite sign.
    how_to_run_it: >-
      REVIEW COMPUTATIONS: closed-form evaluation of the contract's formulas in
      your own script, and rule traces through the version-4 text. They mint
      no RUN-*, write no evidence record, run no Groebner, XL, SAT or F4
      solver, instantiate no curve, construct no group, and never execute an
      EXP-NISTBIN-451dfa or EXP-SEMBIN driver as an experiment. Everything
      goes in computations.json. Declarations (PTM-B's Certicom degree,
      PTM-E's and PTM-H's rules) are written and hashed in computations.json
      before evaluation. A PTM that would amount to a new experiment is
      recorded NOT PERFORMED with the reason.

