      rd_items: [RV3-1, RV3-2]
      non_breaking_items: []
      c8_owner: true
      assigned_to: TASK-20261002-ccdc5f
      attack_plan: >-
        (i) Build the in-force text set by your own script from the bytes:
        the version-4 spec; the version_4 block; every version_3, version_2
        and version_1 field the block does not name as superseded; the audit
        sheet with every embedded log; the worksheet. Compare your set with
        the block's in_force_index field by field: a field the index omits,
        or marks superseded although the block does not restate it, is a
        break here when it carries a time figure (the structural question is
        J7's). (ii) Scan the set for every time figure: log2 costs, 2^x and
        operation counts, per-m and per-reading rows, differences between
        readings, k readings or P forms, carried and quoted figures, and
        every log line. Apply the WITH rule exactly as frozen. List every
        figure WITH or WITHOUT, by file and line. (iii) Recompute every
        memory figure with your own code from the variable counts at its own
        (n, m, t, D, k reading, convention): R-B rows D log2 n, R-M rows
        W(n, D), MR_C8 log2 binom(nvar, D), macaulay4 width W(N5, D), f4_std
        rows D log2(n(t - 1)), dense entries, relation store log2 k. Compare
        to 0.01 bit and exactly on integer counts. (iv) Extract CB-2 (or its
        successor) by the pinned method, check its new reference sha256 and
        import safety, and check that its A(571, m) lines print a store beside
        each time figure. (v) Walk J2-D1 to J2-D5 at their version-3
        locations in the frozen version-3 copy and the version-3 audit sheet,
        and find each remedy in version 4. WHERE I THINK IT BREAKS: (i), then
        a worksheet table row.
      breaking_artifact: >-
        Any time figure in force WITHOUT its memory figure under the frozen
        WITH rule; a memory figure off by more than 0.01 bit or computed at
        another point; a variable count disagreeing with the frozen
        instrument's at the same (n, t, k reading); an A(571, m) line without
