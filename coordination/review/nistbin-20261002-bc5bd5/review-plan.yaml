        coordination/review/nistbin-20261002-bc5bd5/whitelist-grep-v4.yaml
        (blind_from; it may print search terms). (3) ONE fresh gate
        sub-session writes the value-free additive amendment
        coordination/review/nistbin-20261002-bc5bd5/blind-inputs-amendment-01.yaml.
        Every hit takes exactly one of the FOUR DISPOSITIONS below, never any
        other label. It transcribes, never as a value: the definition of
        every NF-nn item of the producer's newly_frozen_values section,
        copied byte-exact, with "definition not separable" recorded where it
        cannot be separated from its answer; any changed definition of A, R-B,
        R-M, W, a memory column, the threshold, the P form or an M7 reading;
        and the (n, m, t, D, k reading, P form) points at which version 4
        states a newly frozen figure outside the QA, Q3 and QX grids, as
        parameters. (4) The top-level session greps the amendment for every
        search term and checks every transcribed definition is a byte-exact
        substring of the producer's worksheet; any hit or mismatch is a stop
        and the gate sub-session rewrites. Both files are committed and
        pushed in TASK-20261002-1d1f48's snapshot commit before dispatch.
      dispositions:
        D1-REDACTION: A new line-range redaction rule, attested by the re-deriver.
        D2-EXCLUSION: The file is removed from the whitelist.
        D3-DISCLOSED-LEAK: >-
          Recorded with file:line, never the value. The affected J11 values are
          admitted only as attested-blind or set aside under K-leak.
        D4-NON-VALUE-MATCH: >-
          Retained with no change, and allowed only in one of two closed
          subclasses. D4a IDENTIFIER, the match lies wholly inside an
          identifier, a path, a hash, a hex string or a curve-parameter digit
          string, never in a standalone numeral. D4b FOREIGN-QUANTITY, the
          match is a standalone numeral whose own sentence, cited by file:line
          without quoting the value, states a quantity of a different kind (a
          line, page, equation, table or reference number, a year, a toy
          parameter at a degree outside every Q parameter set). The gate
          states the subclass and a one-line value-free basis per hit. A hit
          that is not shown to be D4a or D4b takes D1, D2 or D3. The composer
          re-checks every D4 group and opens a sample of hits at source; a
          misclassified hit is treated as D3.
      false_pass_and_false_fail_of_the_grep: >-
        False PASS: a value printed at another precision or in another form
        than searched. The forms in (1) include rounding and truncation at
        every precision version 4 prints, and the gate records any printed
        form it found outside them. False FAIL: identifier and parameter-digit
        matches. D4a absorbs them without weakening the search.
