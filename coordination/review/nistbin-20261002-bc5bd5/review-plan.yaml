        performed_by: TASK-20261002-f19cfa
        object: K-283 and B-283 at D_solve = 4 under version 4's reconciled surface, MI-1, MI-2 and the corrected rho column.
        known_truth: In the exact model EXP-SEMBIN-992e73 evaluates, 283 loses to rho at D = 4; confirm at source (RESULTS.md) before relying on it.
      - id: PTM-B
        performed_by: TASK-20261002-f19cfa
        object: FIPS 163 and 233 and one Certicom degree declared in a hashed block before evaluation, at D_solve = 4.
        known_truth: Each loses to rho in the exact model at D = 4 (confirm at source).
      - id: PTM-C
        performed_by: TASK-20261002-f19cfa
        object: The 409 row read against the naive 2^(n/2) column.
        known_truth: Under H-SEMBIN-97ea23's coherent baseline 409 is not a cell below rho; a rule that admits the naive column resurrects it.
      - id: PTM-C-SLICE
        performed_by: TASK-20261002-f19cfa
        object: Three mis-sliced imports of the coherent row fed to BR-1 (cofactor-charged; label-separated; time-only).
        known_truth: None is the row H-SEMBIN-97ea23 records; importing any of them misstates the baseline.
      - id: PTM-D
        performed_by: TASK-20261002-f19cfa
        object: A D_solve input taken from a fake first-fall degree reading (KN-FIND-936151 witness A), fed as if true.
        known_truth: The fake degree may not be cited as bounding the true one (KN-FIND-936151).
      - id: PTM-E
        performed_by: TASK-20261002-f19cfa
        object: G4 at the least convenient known-truth Certicom degree, chosen by a rule declared in a hashed block before evaluation, at every omega at which version 4 scores D*.
        known_truth: rho wins at that degree at D = 4 in the exact model.
      - id: PTM-F
        performed_by: TASK-20261002-f19cfa
        object: The added Certicom degree 359 (no exact-model result recorded), presented to G4 or to claim (A) as a known-truth control.
        known_truth: Its class is not known from any recorded result; treating it as known certifies a control with no truth behind it.
      - id: PTM-G
        performed_by: TASK-20261002-ee63af
        object: >-
          The K4 revisit sub-condition (i) as version 4 restricts it,
          evaluated (a) on the run's own closed-form threshold table at every
          m in 2..30, both readings, both k readings and both 571 curves,
          including the small-m entries where the threshold sits at the
          grid's lower edge; (b) at a k other than ceil(n/m) and a t other
          than m; (c) on a report other than the first validated one after
          the decision; and (d) on the external event it names.
        known_truth: >-
          A revisit condition fixed before the run by closed forms carries no
          information (DEC-20260925-41f6dc R-S10; DEC-20260924-124667 D-8
          RT4-CERTAIN); a grid-edge entry marks an m at which index calculus
          loses at every degree in the model and is no reason to reprioritise
          a measurement; a condition read at another k, t or report is
          outside what OBJ-J6-1 admits.
      - id: PTM-H
        performed_by: TASK-20261002-f19cfa
        object: >-
          E1, E2 and the threshold sentence read at an m other than 12,
          chosen by a rule declared in a hashed block before evaluation:
          the m in 2..30 whose threshold under R-B at K-571 is a grid-edge
          token, and failing that the m farthest from 12.
        known_truth: >-
          H1 as validated speaks to its stated support only; a reading at
          another m without a numbered transfer heuristic, with its own
          falsifier and validation pointer, is an extrapolation (C6;
          353743 RV3-7).
      - id: PTM-I
        performed_by: TASK-20261002-f19cfa
        object: >-
          The M7-BIN reading: Macaulay rows counted as Boolean monomials of
          degree at most D in the Boolean variable count N5 of system (5) at
          chain length t = m (the frozen instrument's count), anchored at
          D = 4 to R-B, compared with R-B's D log2 n at 571 over D in 4..64 and
          every m in 2..30 under MI-1. The cumulative difference is
          DELTA7(D) = [W(N5, D) - W(N5, 4)] - (D - 4) log2 n. The PER-STEP
          CROSSOVER D_ps(m) is the least D in 5..64 at which the per-step
          growth W(N5, D) - W(N5, D - 1) falls below log2 n; the CUMULATIVE
          CROSSOVER D_cum(m) is the least D in 5..64 at which DELTA7(D) < 0.
          Both are computed, never asserted.
        known_truth: >-
          The direction of M7-BIN against R-B at a crossing is governed by the
          cumulative difference over the degrees up to that crossing, not by
          the per-step growth. A sentence that switches direction at D_ps is
          false for crossings in (D_ps, D_cum] at every m where D_ps < D_cum,
          and a "later" sentence is false for crossings below D_cum (353743
          R-J4, OBJ-J4-0, S-2 (c); recompute, do not assume).
    failure_signature: >-
      A correct contract keeps each known-false conclusion out of reach IN ITS
      RULES, not only in prose. PTM-A, PTM-B and PTM-E come out rho-wins at
      D = 4 at every scored omega under both P forms. PTM-C is excluded by
