# =============================================================================
# Blind inputs for TASK-20261002-16c2f1 (joint J11 of REVIEW-NISTBIN-20261002-bc5bd5).
#
# This file is one of your whitelisted files. It tells you WHAT to compute and
# nothing about how anyone else computed it, or what they found. It contains no
# computed value of any kind: no rho figure, no cost figure, no variable count,
# no memory figure, no optimising parameter, no threshold, no crossover degree.
# If you ever find a value here, that is a leak: report it (BL-4).
#
# Written 2026-10-02 by the Coordinator of DEC-20261002-3ba55f (opening card
# TASK-20261002-1afe54), before the object under review existed and before any
# reviewer ran. Definitions marked "as the contract names it" use the names of
# the contract under review, so that the composer can match your quantities to
# its quantities by name; they are definitions, not values.
# =============================================================================
blind_inputs:
  task_id: TASK-20261002-16c2f1
  review_plan_id: REVIEW-NISTBIN-20261002-bc5bd5
  joint: J11
  write_directory: coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-bc5bd5/reviews/TASK-20261002-16c2f1/

  sources:
    curve_parameters_fips: inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md (custody - fips186-4_text.md.sha256; provenance - source_record.yaml), for the K-571 and B-571 rows only
    index_calculus_model: inputs/SEMAEV-2015-310/paper_fulltext.md (custody - paper_fulltext.md.sha256), UNDER REDACTION RULE RD-SEM
    model_conventions: experiments/EXP-SEMBIN-992e73/specification.yaml, for its stated model conventions only (RD-SPEC)
    forward_amendment: >-
      coordination/review/nistbin-20261002-bc5bd5/blind-inputs-amendment-01.yaml,
      if and only if it exists and is committed when you are launched. It is
      value-free by construction. It may add redactions or exclusions, record
      disclosed leaks, transcribe changed definitions, transcribe the
      definitions of newly frozen quantities (QNF), and pin extra parameter
      points. If it does not exist, you were dispatched against the plan's
      forward precondition: stop and report that as an impediment, not a
      result.
  source_note: >-
    These files, the forward amendment and your own handoff card are your ONLY
    repository sources. If one of them refers to another repository file for a
    formula, convention or parameter, do NOT open that file; record the
    reference under Q0 and continue with what the permitted files state.
    Published mathematics from outside this repository may be used and is
    cited with provenance (recalled | retrieved).

  what_you_are_testing: >-
    Whether a published index-calculus cost model's first-stage cost, a table
    of degree thresholds under that model, the degrees at which one row-count
    reading stops growing faster than another, and a set of further figures
    defined below and in the amendment, are determined by primary parameters,
    a stated convention, the published model, two explicitly pinned forms of
    the model's decomposition probability, and the definitions written out
    below. You are not asked whether the model or the convention is a good
    one. Other implementations, written by people who share nothing with you,
    are compared with yours afterwards by the composing Coordinator.

  # ---------------------------------------------------------------------------
  pinned_choices:
    note: >-
      Pinned BY RULE, BY FORMULA or BY LABEL, never by printing a value you
      must derive. Where a pin below still leaves you a choice, record it under
      Q0 with the value under each admissible reading.
    PIN-OMEGA: >-
      omega = 3.0 for Q3 and for every quantity below where omega enters. This
      is a parameter of the contract, not a result. If the forward amendment
      pins a further omega, evaluate there too and report each value with its
      omega.
    PIN-K-READING: >-
      Evaluate every quantity in which the number k of relations collected,
      or the size exponent of the factor base, enters under BOTH labelled
      readings and report both. KR-A: k = n/m taken as a real number wherever
      it appears. KR-B: k = ceil(n/m), the integer the paper defines at the
      start of Section 4.5.2. Where a quantity needs an integer count built
      from a real k (for example a variable count), report it unrounded,
      rounded to the nearest integer and ceiled, and say which the paper's
      text supports. You are not told which reading any other document uses;
      the composer matches readings by label.
    PIN-P-FORM: >-
      Evaluate every quantity in which the decomposition probability
      P(n, m, t, k) enters under BOTH labelled forms and report both, with
      t = m. The paper's Section 4.3 states the model near its equation (11);
      read it there. PF-1 (first-order form): P = 2^(t k - n) / t!. PF-2
      (equation (11) form): P = 1 - exp(-2^(t k - n) / t!). Both are the
      paper's expression |V|^t / (q t!) with |V| = 2^k and q = 2^n, taken to
      first order and in full respectively. If you find a third admissible
      reading in the text, record it under Q0 and evaluate it too, labelled.
      You are not told which form any other document uses.
    PIN-STAGE: >-
      Stage 1 (relation collection, as the paper sets it out in Section
      4.5.2) only, with t = m.
    PIN-M-GRID: Every integer m from 2 to 30 inclusive, each m on its own, with no minimisation over m anywhere in QA, Q3 or QX.
    PIN-D-GRID: Every integer D from 2 to 64 inclusive unless a quantity states a narrower range.
    PIN-COFACTOR-AND-CHARGE: >-
      The cofactor charge, the stage split and the unit of cost are as
      EXP-SEMBIN-992e73's specification declares for the paper's own
      convention. Where that specification does not determine a reading, take
      it from Semaev 2015 as published and record the choice under Q0.

  # ---------------------------------------------------------------------------
  definitions_as_the_contract_names_them:
    note: >-
      Contract-specific readings the published text does not state beyond
      degree 4. Each is a definition, not a value. If the forward amendment
      transcribes a changed definition, the amendment's text governs and you
      report under both.
    A_of_n_m: >-
      A(n, m): the paper's first-stage cost at chain length t = m with the
      per-system solving cost omitted, that is, log2 of the number of
      relations the paper's first stage collects plus log2 of the inverse of
      the decomposition probability P(n, m, m, k), under each P form of
      PIN-P-FORM and each k reading of PIN-K-READING. Derive the
      relation-count term from the paper (Sections 4.3 and 4.5.2) and write
      the full expression out in your report, once per P form.
    relation_store: >-
      As the contract names it: the memory of the relation store beside
      A(n, m), log2 k under the k reading in force. If the paper's text
      supports a different store (for example a count of stored relations
      rather than of factor-base elements), record that under Q0 and report
      both.
    W: W(n, D) = log2 of the sum over d = 0..D of binom(n, d).
    R-B: >-
      Reading R-B: per-system solving cost exponent S_B(n, D, omega) =
      D omega log2 n. The paper's block-structured per-solve cost n^(4 omega)
      with the degree bound 4 replaced by D.
    R-M: >-
      Reading R-M: S_M(n, D, omega) = omega (W(n, D) - W(n, 4) + 4 log2 n).
      The degree-D Macaulay width of an n-variable block, normalised so that
      it equals S_B at D = 4.
    C_R: C_R(n, D, omega; m) = A(n, m) + S_R(n, D, omega), for R in {R-B, R-M}, with no minimisation over m.
    rho: >-
      rho(c) = 0.5 log2(pi r / (4 k_c)) for curve c, r the prime order of the
      base point read from the primary text, k_c the order of the curve's own
      Frobenius class map on that subgroup (k_c = n for a curve defined over
      F_2 used over F_(2^n); k_c = 1 for a curve not defined over a proper
      subfield). Derive k_c yourself and say how. This k_c is not the k of
      PIN-K-READING.
    threshold: >-
      D*_R(c, omega, m) = the least integer D in 2..64 with
      C_R(571, D, omega; m) - rho(c) > 0. If no D in 2..64 qualifies, the value
      is the token "no crossing at D <= 64". A crossing at D = 2 is reported as
      the token "D* <= 2". Under R-B the margin is linear in D, and
      D*real_B(c, omega, m) = (rho(c) - A(571, m)) / (omega log2 571) is
      reported to two decimals beside the integer value; R-M is defined at
      integer D only and has no real form.
    N5: >-
      N5(n, t, k): the number of Boolean variables of the paper's system (5)
      at chain length t. DERIVE IT FROM THE PAPER (system (5) and its
      variable count), state the formula with the paper's line numbers, and
      evaluate it in every rounding of PIN-K-READING.
    M7-BIN: >-
      A row-count reading anchored at D = 4 to R-B: rows counted as Boolean
      monomials of degree at most D in N5 variables. Its cumulative
      difference from R-B is DELTA7(D; n, m) = [W(N5, D) - W(N5, 4)] -
      (D - 4) log2 n, for D in 4..64, at t = m. Its per-step growth at D is
      W(N5, D) - W(N5, D - 1), to be set against R-B's per-step growth
      log2 n.

  # ---------------------------------------------------------------------------
  quantities:
    Q0:
      name: undetermined choices
      definition: >-
        Every point at which your sources, after the pins above, left you a
        choice: a reading of the convention, the value or rounding of k or of a
        variable count, a cost-model reading, a P form beyond PF-1 and PF-2, a
        unit, a rounding rule, a range, a reference to another file. For each,
        quote the text (file and line), list the readings you consider
        admissible, and say which quantities below depend on it and whether
        the value changes by more than the tolerance.
      report: A list. An empty list is a result and must be stated as such.
    Q1-571:
      name: log2 matched rho at K-571 and B-571 (an input to Q3)
      definition: >-
        For each of the two rows, r and h from FIPS 186-4 (Appendix D.1.3 and
        the cofactor rule of its preamble), k_c as in the rho definition, and
        rho(c).
      report: Per row the field degree, r in decimal, its bit length, h, k_c, how k_c was established, and rho(c) to at least four decimal places.
      tolerance: 0.01 bit; exact on bit length and on k_c
    QA:
      name: the first-stage cost at 571 and its relation store, per m
      definition: >-
        For each m of PIN-M-GRID, each k reading and each P form: A(571, m)
        and the relation store beside it; and the difference A under PF-2
        minus A under PF-1, per m and k reading.
      report: A table with one line per (m, k reading), carrying both P forms, the store and the difference.
      tolerance: 0.01 bit on every log2 figure
    Q3:
      name: the threshold table at n = 571
      definition: >-
        For c in {K-571, B-571}, R in {R-B, R-M}, omega of PIN-OMEGA, each k
        reading, each P form and each m of PIN-M-GRID: D*_R(c, omega, m) with
        its tokens, D*real_B(c, omega, m), and the margins C_R - rho(c) at
        D* - 1 and at D* where D* is an integer.
      report: A table with one line per (c, R, k reading, P form, m).
      tolerance: exact on every integer threshold and token; 0.01 on D*real_B; 0.01 bit on each margin
    QX:
      name: the per-step and the cumulative crossover of M7-BIN against R-B
      definition: >-
        At n = 571, for each m of PIN-M-GRID and each k reading (with N5 in
        each admissible rounding): the PER-STEP CROSSOVER D_ps(m), the least
        D in 5..64 at which W(N5, D) - W(N5, D - 1) < log2 571, or the token
        "none in 5..64"; the CUMULATIVE CROSSOVER D_cum(m), the least D in
        5..64 at which DELTA7(D; 571, m) < 0, or the token "none in 5..64";
        and the maximum of DELTA7 over D in 4..64 with its argument. The two
        crossovers are different quantities; report both, never one for the
        other. If the forward amendment transcribes a further M7 reading,
        compute the same outputs for it, labelled with the amendment's name
        for it.
      report: A table with one line per (m, k reading, rounding, reading).
      tolerance: exact on each degree; 0.05 bit on DELTA7
    QNF:
      name: newly frozen quantities
      definition: >-
        Every item NF-nn whose value-free definition the forward amendment
        transcribes, computed from that definition and the pins above, under
        every P form and k reading the definition leaves open. If the
        amendment marks an item "definition not separable", report it as not
        computed with that reason; never infer it.
      report: One line per NF-nn with its value, units, the k reading and the P form used.
      tolerance: as the amendment states per item; by default 0.01 bit on log2 quantities and exact on integers

  # ---------------------------------------------------------------------------
  redaction_rules:
    RD-SEM: >-
      inputs/SEMAEV-2015-310/paper_fulltext.md: do NOT read lines 1131 to 1235
      inclusive (the paragraph that introduces Table 3, its verdict sentences,
      and Table 3 itself). Read the file only by line ranges, never by a text
      search whose output could display a line in that range. Everything else
      in the paper may be read. This is ATTESTED blindness, not structural.
    RD-SPEC: >-
      experiments/EXP-SEMBIN-992e73/specification.yaml: read for its stated
      model conventions (cost reading, cofactor charge, stage split, t range,
      m grid) only. If you find a computed rho, cost, variable count, memory
      figure, optimising parameter or threshold value there, BL-4 applies.
    exposure_rule: >-
      If a tool displays to you any line inside a redacted range, stop reading
      that file, record an EXPOSURE with file and line (never the value), say
      which quantities you had already computed and saved before the exposure,
      and continue with the other quantities.

  # ---------------------------------------------------------------------------
  whitelist:
    - ledger/handoffs/TASK-20261002-16c2f1.yaml
    - coordination/review/nistbin-20261002-bc5bd5/blind-inputs.yaml
    - coordination/review/nistbin-20261002-bc5bd5/blind-inputs-amendment-01.yaml
    - inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md
    - inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md.sha256
    - inputs/FIPS186-4-BINARY-CURVES/source_record.yaml
    - inputs/SEMAEV-2015-310/paper_fulltext.md
    - inputs/SEMAEV-2015-310/paper_fulltext.md.sha256
    - experiments/EXP-SEMBIN-992e73/specification.yaml
    - AGENTS.md
    - agents/validator.md
    - templates/research-records.md
  whitelist_note: >-
    Twelve paths. Everything else in the repository is out of scope,
    including every other file in the inputs/ directories named and the whole
    of inputs/CERTICOM-CHALLENGE-2009/.

  # ---------------------------------------------------------------------------
  whitelist_value_search:
    performed_by: >-
      Not performed at writing. The Coordinator of DEC-20261002-3ba55f has no
      shell and did not run a value pre-search; it wrote no value into this
      file. The forward precondition below covers every value version 4 will
      freeze or carry.
    residual_risk: >-
      The paper is retained under attested redaction, not exclusion, because
      it is the only primary statement of the model and of system (5). The
      values version 4 will freeze are not known yet, so only the forward
      precondition can cover them.

  forward_precondition:
    binds: the dispatcher (top-level session) and the gate sub-session of TASK-20261002-1d1f48, not you
    text: >-
      Before you are dispatched, the top-level session greps every whitelisted
      file for every value the version-4 contract freezes or carries that you
      or another blind implementation compute, records the command and hits
      (file:line only) in a grep record that is out of your scope, and a
      Coordinator gate sub-session writes the value-free amendment. Each hit
      takes one of four declared dispositions (a redaction, an exclusion, a
      disclosed leak, or a non-value match of a closed kind). Both files are
      committed and pushed before dispatch. You may not be dispatched until
      the grep is recorded.

  # ---------------------------------------------------------------------------
  rules:
    - BL-1 Read ONLY the whitelisted paths, under the redaction rules. Every other path in the repository is out of scope.
    - BL-2 Run no git command that shows history or content of other revisions (log, show, blame, diff, grep over history) and read no pull-request text or commit message.
    - >-
      BL-3 Choose your own libraries and algorithms and name them with
      versions. Do not transcribe a computed cost, rho figure, variable count,
      memory figure, optimising parameter, threshold or crossover from any
      source; compute it. Curve parameters are read from the primary text,
      not recalled.
    - >-
      BL-4 If you find, in a file you were permitted to read, a value that
      looks like an already-computed answer to any quantity above, stop
      reading that file and report a LEAK with file and line, never the
      value. Say which quantities you had computed and saved before.
    - BL-5 Report on J11 only. Give no verdict on the contract or the hypothesis, which you have not read. Your verdict on J11 is inconclusive by design.
    - >-
      BL-6 ZERO experiment runs. Instantiate no curve, construct no group, run
      no rho walk, run no Groebner, XL, SAT or F4 solver. This is closed-form
      arithmetic, including order computations on the Frobenius action where
      you need them.
    - BL-7 Write nothing outside your write directory and your private scratch subdirectory. Never export or copy a whole git tree. Put every script, command and raw output inside computations.json. sources_read lists files read, never files written.
    - BL-8 Obey RD-SEM, RD-SPEC and the exposure_rule; attest each in your report.

  output_schema:
    directory: coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-bc5bd5/reviews/TASK-20261002-16c2f1/
    files:
      rederivation-report.yaml: >-
        review_attestation (task_id TASK-20261002-16c2f1, joints_owned [J11],
        verdicts {J11: inconclusive}, independent_session true,
        requested_policy review-breakthrough, resolved_model_id,
        reasoning_effort, fallback_used and reason, degraded_allowed false,
        model_verified, amazon_bedrock not used, read_sibling_reports false,
        blind_from_respected true or false, sources_read as a list of
        repository paths exactly as read); redactions_respected (RD-SEM,
        RD-SPEC, each true or false with detail); amendment_read (path and
        sha256, or its absence); Q0 (list); Q1-571; QA; Q3; QX; QNF; leaks and
        exposures (file:line only); environment (language, libraries,
        versions); procedure_deviations; runs_launched 0.
      computations.json: every script verbatim, every command, raw outputs, the full QA, Q3 and QX tables, and the sha256 of each whitelisted file as read
    yaml_hygiene: >-
      Write every prose value that contains a colon followed by a space as a
      folded block scalar; never put a mapping key at list-item indent; parse
      your own YAML before you hand back.
    sha256_note: The top-level session hashes both files before the composer is launched; do not edit either after you report.

  verdict_rule_for_your_attestation: >-
    Your verdict on J11 is inconclusive by design: you are forbidden to
    compare. Report every quantity in full; the composing Coordinator compares
    them with the other implementations under the plan's keys.
