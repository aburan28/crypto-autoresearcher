  - every integer of that c4.out under the keys m_star, runner_up_m, smallest_at_m, nvar_C8, nvar, N5, N5_rounded, N5_ceiled,
    n_times_t_minus_1, block_n4w_m_star, D_ps, D_cum, DELTA7_argmax, no_later_for_crossings_in, no_earlier_for_crossings_from,
    undetermined_at_crossing, scored_cells_D_star, D_star, D_star_lo and D_star_hi (argmins, crossover degrees, DELTA7 extremes
    and threshold degrees); grid parameters (D, m, t, n, m_grid, D_grid) are parameters, not values, and are not searched
  - the carried Q1 values (eight rows) and Q2 values (three rows) of DEC-20260925-41f6dc R-J9, with the Q2 argmins and the
    Q1 k values (as in whitelist-grep-v3)
  - the integer values of NF-01 and NF-02 carried in CB-1 (as in whitelist-grep-v3)
  forms: each decimal value rounded half-even, rounded half-up and truncated to one, two, three and four places, matched as
    a bare numeral not preceded by a digit or point and not followed by a digit (which also matches it inside 2^x, 2^{x} and
    2**x and with a leading sign); scientific notation of each decimal value with mantissa at one to four places (e or x 10^
    forms); each integer value after "m = ", "m* = ", "D = ", "D* = ", "D*(m) = " and "D_ps = ", "D_cum = " and "N = " (whitespace-tolerant)
    and as an element of a bracketed or comma-separated list
  limitations:
  - A form that prints as zero at a given precision is not searched (it carries no value).
  - Integers are searched only in the prefixed and list forms the plan names; a bare integer elsewhere is not a search hit.
  - Grid parameters of the abstract model (the D, m, t and n axes) are not searched as values.
